[package]
name = "fnse_core"
version = "0.1.0"
edition = "2021"
authors = ["Flowork OS <agent@floworkos.com>"]
description = "Flowork Neural-Storage Engine (FNSE) - High performance Hybrid FTS, Vector, and CSR Graph Engine"

[dependencies]
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
tantivy = { version = "0.22", default-features = false, features = ["mmap", "lz4-compression"] }
tempfile = "3.10"
