<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glowing Rune Warhammer</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070b);
scene.fog = new THREE.FogExp2(0x05070b, 0.055);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.2, 2.8, 6.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 4;
controls.maxDistance = 10;
controls.target.set(0, 0.1, 0);

scene.add(new THREE.HemisphereLight(0x516b9c, 0x100b08, 1.2));

const warmLight = new THREE.PointLight(0xff5b18, 14, 7, 2);
warmLight.position.set(0, 1.1, 1.1);
warmLight.castShadow = true;
scene.add(warmLight);

const blueLight = new THREE.PointLight(0x197cff, 10, 6, 2);
blueLight.position.set(-1.4, 0.1, 0.8);
scene.add(blueLight);

const rimLight = new THREE.DirectionalLight(0x789dff, 2.5);
rimLight.position.set(-4, 5, 5);
rimLight.castShadow = true;
rimLight.shadow.mapSize.set(1024, 1024);
scene.add(rimLight);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(5.5, 64),
  new THREE.MeshStandardMaterial({ color: 0x080b11, roughness: 0.82, metalness: 0.18 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.65;
floor.receiveShadow = true;
scene.add(floor);

const weapon = new THREE.Group();
weapon.rotation.z = -0.045;
scene.add(weapon);

const iron = new THREE.MeshStandardMaterial({
  color: 0x151a22,
  roughness: 0.27,
  metalness: 0.9
});
const ironEdge = new THREE.MeshStandardMaterial({
  color: 0x252b35,
  roughness: 0.2,
  metalness: 1
});
const leather = new THREE.MeshStandardMaterial({
  color: 0x25120d,
  roughness: 0.9,
  metalness: 0.05
});
const leatherHighlight = new THREE.MeshStandardMaterial({
  color: 0x56301b,
  roughness: 0.82,
  metalness: 0.06
});
const moltenOrange = new THREE.MeshStandardMaterial({
  color: 0xff5b14,
  emissive: 0xff3608,
  emissiveIntensity: 7,
  roughness: 0.22,
  metalness: 0.1
});
const moltenBlue = new THREE.MeshStandardMaterial({
  color: 0x47baff,
  emissive: 0x087dff,
  emissiveIntensity: 8,
  roughness: 0.18,
  metalness: 0.15
});

function mesh(geometry, material, position, parent = weapon) {
  const item = new THREE.Mesh(geometry, material);
  item.position.set(position[0], position[1], position[2]);
  item.castShadow = true;
  item.receiveShadow = true;
  parent.add(item);
  return item;
}

const haft = mesh(new THREE.CylinderGeometry(0.19, 0.24, 4.55, 20), iron, [0, -0.35, 0]);
const pommel = mesh(new THREE.SphereGeometry(0.38, 20, 12), ironEdge, [0, -2.6, 0]);
mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.22, 20), ironEdge, [0, -2.72, 0]);

function grip(y, length, radius) {
  mesh(new THREE.CylinderGeometry(radius, radius * 1.03, length, 20), leather, [0, y, 0]);
  const count = Math.floor(length / 0.23);
  for (let i = 0; i < count; i++) {
    const band = mesh(new THREE.TorusGeometry(radius * 1.035, 0.035, 8, 20), leatherHighlight, [0, y - length / 2 + 0.12 + i * 0.23, 0]);
    band.rotation.x = Math.PI / 2;
  }
}
grip(-1.45, 1.7, 0.255);
grip(0.05, 0.8, 0.235);

const head = new THREE.Group();
head.position.y = 1.65;
weapon.add(head);

mesh(new THREE.BoxGeometry(3.05, 1.55, 1.3), iron, [0, 0, 0], head);
mesh(new THREE.BoxGeometry(3.35, 1.12, 1.08), ironEdge, [0, 0.03, 0], head);
mesh(new THREE.BoxGeometry(0.36, 1.72, 1.42), ironEdge, [-1.57, 0, 0], head);
mesh(new THREE.BoxGeometry(0.36, 1.72, 1.42), ironEdge, [1.57, 0, 0], head);

const capLeft = mesh(new THREE.CylinderGeometry(0.57, 0.57, 0.24, 8), ironEdge, [-1.77, 0, 0], head);
capLeft.rotation.z = Math.PI / 2;
const capRight = mesh(new THREE.CylinderGeometry(0.57, 0.57, 0.24, 8), ironEdge, [1.77, 0, 0], head);
capRight.rotation.z = Math.PI / 2;

function runeBar(parent, x, y, length, angle, material, z = 0.67, thickness = 0.065) {
  const bar = new THREE.Mesh(new THREE.BoxGeometry(length, thickness, 0.045), material);
  bar.position.set(x, y, z);
  bar.rotation.z = angle;
  bar.castShadow = true;
  parent.add(bar);
  return bar;
}

function rune(parent, x, y, scale, material, z = 0.69) {
  const t = 0.065 * scale;
  runeBar(parent, x - 0.22 * scale, y, 0.38 * scale, 0, material, z, t);
  runeBar(parent, x, y + 0.22 * scale, 0.34 * scale, Math.PI / 2, material, z, t);
  runeBar(parent, x + 0.2 * scale, y - 0.22 * scale, 0.38 * scale, Math.PI / 4, material, z, t);
  runeBar(parent, x - 0.02 * scale, y - 0.2 * scale, 0.3 * scale, -Math.PI / 4, material, z, t);
}

rune(head, -1.05, 0.18, 0.72, moltenOrange);
rune(head, -0.35, -0.18, 0.72, moltenBlue);
rune(head, 0.38, 0.18, 0.72, moltenOrange);
rune(head, 1.08, -0.18, 0.72, moltenBlue);

const crackGroup = new THREE.Group();
head.add(crackGroup);
runeBar(crackGroup, -0.72, -0.48, 0.68, -0.24, moltenOrange, 0.685, 0.045);
runeBar(crackGroup, -0.18, 0.46, 0.5, 0.38, moltenBlue, 0.685, 0.045);
runeBar(crackGroup, 0.62, -0.49, 0.62, 0.2, moltenOrange, 0.685, 0.045);
runeBar(crackGroup, 1.3, 0.46, 0.32, -0.55, moltenBlue, 0.685, 0.045);

const haftRunes = new THREE.Group();
haftRunes.position.set(0, 0, 0);
weapon.add(haftRunes);
runeBar(haftRunes, -0.03, -0.75, 0.4, Math.PI / 2, moltenBlue, 0.245, 0.045);
runeBar(haftRunes, 0.03, -1.02, 0.32, 0.2, moltenOrange, 0.245, 0.045);
runeBar(haftRunes, -0.03, -1.3, 0.4, Math.PI / 2, moltenBlue, 0.245, 0.045);
runeBar(haftRunes, 0.03, -1.57, 0.32, -0.2, moltenOrange, 0.245, 0.045);
runeBar(haftRunes, -0.03, -1.84, 0.4, Math.PI / 2, moltenBlue, 0.245, 0.045);
runeBar(haftRunes, 0.03, -2.11, 0.32, 0.2, moltenOrange, 0.245, 0.045);

const emberCount = 150;
const emberPositions = new Float32Array(emberCount * 3);
const emberSpeeds = new Float32Array(emberCount);
for (let i = 0; i < emberCount; i++) {
  emberPositions[i * 3] = (Math.random() - 0.5) * 3.3;
  emberPositions[i * 3 + 1] = Math.random() * 5.1 - 2.5;
  emberPositions[i * 3 + 2] = (Math.random() - 0.5) * 1.8;
  emberSpeeds[i] = 0.12 + Math.random() * 0.35;
}
const emberGeometry = new THREE.BufferGeometry();
emberGeometry.setAttribute("position", new THREE.BufferAttribute(emberPositions, 3));
const emberMaterial = new THREE.PointsMaterial({
  color: 0xff7730,
  size: 0.045,
  transparent: true,
  opacity: 0.85,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const embers = new THREE.Points(emberGeometry, emberMaterial);
scene.add(embers);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  const pulse = 0.72 + Math.sin(elapsed * 3.4) * 0.18 + Math.sin(elapsed * 7.1) * 0.06;
  moltenOrange.emissiveIntensity = 6.5 + pulse * 2.1;
  moltenBlue.emissiveIntensity = 7.2 + pulse * 2.4;
  warmLight.intensity = 11 + pulse * 7;
  blueLight.intensity = 8 + pulse * 4;
  const positions = emberGeometry.attributes.position.array;
  for (let i = 0; i < emberCount; i++) {
    positions[i * 3 + 1] += emberSpeeds[i] * 0.008;
    positions[i * 3] += Math.sin(elapsed * 1.7 + i) * 0.0008;
    if (positions[i * 3 + 1] > 2.7) {
      positions[i * 3 + 1] = -2.55;
      positions[i * 3] = (Math.random() - 0.5) * 3.3;
      positions[i * 3 + 2] = (Math.random() - 0.5) * 1.8;
    }
  }
  emberGeometry.attributes.position.needsUpdate = true;
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
