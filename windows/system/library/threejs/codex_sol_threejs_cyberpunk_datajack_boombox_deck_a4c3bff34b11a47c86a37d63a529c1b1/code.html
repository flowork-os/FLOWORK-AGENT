function canvasTexture(width, height, draw) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  draw(ctx, width, height);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return { canvas, ctx, texture };
}

const carbonData = canvasTexture(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#0b0d10';
  ctx.fillRect(0, 0, w, h);
  for (let y = -8; y < h + 8; y += 8) {
    for (let x = -8; x < w + 8; x += 8) {
      const even = ((x + y) / 8) % 2 === 0;
      ctx.fillStyle = even ? '#171b20' : '#080a0d';
      ctx.beginPath();
      ctx.moveTo(x, y + 4);
      ctx.lineTo(x + 4, y);
      ctx.lineTo(x + 12, y + 8);
      ctx.lineTo(x + 8, y + 12);
      ctx.closePath();
      ctx.fill();
    }
  }
  const gradient = ctx.createLinearGradient(0, 0, w, h);
  gradient.addColorStop(0, 'rgba(255,255,255,0.09)');
  gradient.addColorStop(0.45, 'rgba(255,255,255,0)');
  gradient.addColorStop(1, 'rgba(0,0,0,0.25)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, w, h);
});
carbonData.texture.wrapS = carbonData.texture.wrapT = THREE.RepeatWrapping;
carbonData.texture.repeat.set(3.2, 2.2);

function roundedBox(name, size, position, material, radius = 0.14, segments = 4) {
  const geometry = new RoundedBoxGeometry(size[0], size[1], size[2], segments, radius);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  deck.add(mesh);
  return mesh;
}

function box(name, size, position, material, rotation = null) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), material);
  mesh.name = name;
  mesh.position.set(...position);
  if (rotation) mesh.rotation.set(...rotation);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  deck.add(mesh);
  return mesh;
}

function cylinder(name, radiusTop, radiusBottom, height, segments, position, material, rotation = null) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
    material
  );
  mesh.name = name;
  mesh.position.set(...position);
  if (rotation) mesh.rotation.set(...rotation);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  deck.add(mesh);
  return mesh;
}

function cableCurve(points, color, radius, yOffset = 0) {
  const curve = new THREE.CatmullRomCurve3(
    points.map(p => new THREE.Vector3(p[0], p[1] + yOffset, p[2])),
    false,
    'centripetal'
  );
  const geometry = new THREE.TubeGeometry(curve, 48, radius, 8, false);
  const material = new THREE.MeshStandardMaterial({
    color,
    roughness: 0.55,
    metalness: 0.18
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  deck.add(mesh);
  return mesh;
}

function drawLCD(time) {
  const ctx = lcdData.ctx;
  const w = lcdData.canvas.width;
  const h = lcdData.canvas.height;
  const t = time * 0.001;

  ctx.fillStyle = '#030b08';
  ctx.fillRect(0, 0, w, h);

  const grad = ctx.createLinearGradient(0, 0, w, 0);
  grad.addColorStop(0, '#0b3b27');
  grad.addColorStop(0.5, '#082317');
  grad.addColorStop(1, '#15472d');
  ctx.fillStyle = grad;
  ctx.fillRect(10, 10, w - 20, h - 20);

  ctx.strokeStyle = 'rgba(105,255,157,0.13)';
  ctx.lineWidth = 1;
  for (let y = 14; y < h - 10; y += 6) {
    ctx.beginPath();
    ctx.moveTo(10, y);
    ctx.lineTo(w - 10, y);
    ctx.stroke();
  }

  const glyphs = 'アカサタナハマヤラワヲンキシチニヒミリヰクスツヌフムユルケセテネヘメレヱコソトノホモヨロ';
  const offset = Math.floor(t * 95) % 48;
  ctx.font = 'bold 76px sans-serif';
  ctx.textBaseline = 'middle';

  for (let i = 0; i < 14; i++) {
    const x = i * 72 - offset;
    const index = (i + Math.floor(t * 2)) % glyphs.length;
    ctx.fillStyle = i % 5 === 0 ? '#ff3a9f' : '#93ffad';
    ctx.shadowColor = ctx.fillStyle;
    ctx.shadowBlur = 12;
    ctx.fillText(glyphs[index], x, 122 + Math.sin(i + t * 8) * 5);
  }
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#d0ff3d';
  ctx.font = 'bold 27px monospace';
  ctx.fillText('BPM 148.7', 24, 35);
  ctx.fillStyle = '#ff469f';
  ctx.fillText('LEV +10mm', 570, 222);

  for (let i = 0; i < 7; i++) {
    const gy = (Math.sin(t * 13 + i * 7.4) * 0.5 + 0.5) * h;
    const gx = (Math.sin(t * 5.2 + i * 3.1) * 0.5 + 0.5) * w;
    ctx.fillStyle = i % 2 ? 'rgba(255,40,151,0.45)' : 'rgba(150,255,178,0.35)';
    ctx.fillRect(gx, gy, 45 + (i * 31) % 130, 3 + (i % 3));
  }

  ctx.strokeStyle = 'rgba(220,255,235,0.85)';
  ctx.lineWidth = 2;
  const cracks = [
    [[492, 12], [477, 58], [502, 92], [468, 137], [481, 178], [444, 245]],
    [[502, 92], [548, 71], [587, 79]],
    [[468, 137], [420, 121], [386, 145]],
    [[481, 178], [531, 194], [552, 232]]
  ];
  cracks.forEach(path => {
    ctx.beginPath();
    ctx.moveTo(path[0][0], path[0][1]);
    for (let i = 1; i < path.length; i++) ctx.lineTo(path[i][0], path[i][1]);
    ctx.stroke();
  });

  lcdData.texture.needsUpdate = true;
}

const clock = new THREE.Clock();
let lcdAccumulator = 0;

function animate(time) {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  lcdAccumulator += delta;

  platter.rotation.y += delta * 0.46;
  platter.position.y = 1.19 + Math.sin(time * 0.0018) * 0.018;
  magHalo.material.opacity = 0.27 + Math.sin(time * 0.004) * 0.08;
  pinkUnder.intensity = 19 + Math.sin(time * 0.003) * 4;
  greenLight.intensity = 6 + Math.sin(time * 0.0047) * 1.2;

  if (lcdAccumulator > 0.065) {
    drawLCD(time);
    lcdAccumulator = 0;
  }

  controls.update();
  renderer.render(scene, camera);
}

drawLCD(0);
animate(0);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
