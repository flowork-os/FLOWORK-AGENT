<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Alchemist's Laboratory</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0806} canvas{display:block}
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================ config / palette ============================ */
const PAL = {
  fog: 0x140b06, iron: 0x2b2b30, brass: 0xb8893c, waxIvory: 0xe8d9b0, flame: 0xffb143,
  greenGlow: 0x49ff9c, violetGlow: 0xb45cff, amber: 0xd98e2b, runeTeal: 0x59f0d2,
  parchment: 0xd8c290, herb: 0x54633a
};
const ROOM = { w: 20, d: 20, h: 8 };

/* ============================= prng / helpers ============================= */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(0xA1C4E57);
const rr = (a, b) => a + rng() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = arr => arr[Math.floor(rng() * arr.length)];

// mesh factory: geometry + material + position, shadows on by default
function M(geo, mat, x = 0, y = 0, z = 0, shadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = shadow;
  return m;
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}
function canvasTexture(c, repeat = 1) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  return t;
}

/* ============================ procedural textures ========================= */
function stoneFloorTexture() {
  const [c, g] = makeCanvas(512, 512);
  g.fillStyle = '#4d453c'; g.fillRect(0, 0, 512, 512);
  const n = 8, s = 512 / n;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const v = 60 + ri(-14, 16);
    g.fillStyle = `rgb(${v + 12},${v + 2},${v - 8})`;
    g.fillRect(x * s + 2, y * s + 2, s - 4, s - 4);
    g.strokeStyle = 'rgba(18,12,8,0.8)'; g.lineWidth = 3;
    g.strokeRect(x * s + 1, y * s + 1, s - 2, s - 2);
  }
  for (let i = 0; i < 900; i++) { // grime speckles
    g.fillStyle = `rgba(${ri(20, 40)},${ri(16, 32)},${ri(10, 24)},${rr(0.1, 0.4)})`;
    g.fillRect(rr(0, 512), rr(0, 512), rr(1, 3), rr(1, 3));
  }
  return canvasTexture(c, 2);
}
function wallTexture() {
  const [c, g] = makeCanvas(512, 512);
  g.fillStyle = '#453b31'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 260; i++) { // mottled plaster patches
    const v = ri(48, 84);
    g.fillStyle = `rgba(${v + 8},${v - 2},${v - 12},${rr(0.15, 0.5)})`;
    g.beginPath(); g.ellipse(rr(0, 512), rr(0, 512), rr(8, 42), rr(6, 26), rr(0, 3.14), 0, 6.3); g.fill();
  }
  g.fillStyle = 'rgba(12,8,5,0.35)'; g.fillRect(0, 0, 512, 70); // soot near the ceiling
  for (let i = 0; i < 14; i++) { // mortar cracks
    g.strokeStyle = 'rgba(20,14,10,0.5)'; g.lineWidth = rr(1, 2.5);
    g.beginPath(); let x = rr(0, 512), y = rr(0, 512); g.moveTo(x, y);
    for (let k = 0; k < 5; k++) { x += rr(-40, 40); y += rr(10, 50); g.lineTo(x, y); }
    g.stroke();
  }
  return canvasTexture(c, 2);
}
function woodTexture() {
  const [c, g] = makeCanvas(256, 256);
  g.fillStyle = '#57381d'; g.fillRect(0, 0, 256, 256);
  for (let y = 0; y < 256; y += 2) { // grain bands
    const v = 70 + Math.sin(y * 0.22) * 12 + ri(-9, 9);
    g.fillStyle = `rgba(${v},${v * 0.62},${v * 0.34},0.55)`;
    g.fillRect(0, y, 256, 2);
  }
  for (let i = 0; i < 10; i++) { // knots
    g.strokeStyle = 'rgba(38,22,10,0.7)'; g.lineWidth = 2;
    g.beginPath(); g.ellipse(rr(0, 256), rr(0, 256), rr(3, 9), rr(2, 5), 0, 0, 6.3); g.stroke();
  }
  return canvasTexture(c, 1);
}
function pageTexture() {
  const [c, g] = makeCanvas(512, 256);
  g.fillStyle = '#e0cb96'; g.fillRect(0, 0, 512, 256);
  g.fillStyle = 'rgba(150,110,60,0.25)'; g.fillRect(250, 0, 12, 256); // spine shadow
  g.strokeStyle = '#4a3218'; g.lineWidth = 2;
  for (let p = 0; p < 2; p++) { // two pages of scrawled script
    for (let row = 0; row < 9; row++) {
      const y = 30 + row * 24; let x = p * 256 + 26;
      while (x < p * 256 + 226) {
        const w = rr(8, 26);
        g.beginPath(); g.moveTo(x, y + rr(-2, 2)); g.lineTo(x + w, y + rr(-2, 2)); g.stroke();
        x += w + rr(4, 9);
      }
    }
  }
  g.strokeStyle = '#7a2e14'; g.lineWidth = 3; // alchemical diagram on the right page
  g.beginPath(); g.arc(384, 190, 38, 0, 6.3); g.stroke();
  g.beginPath(); g.moveTo(384, 152); g.lineTo(351, 209); g.lineTo(417, 209); g.closePath(); g.stroke();
  return canvasTexture(c, 1);
}
function runeTexture() {
  const [c, g] = makeCanvas(512, 512);
  g.strokeStyle = '#ffffff';
  for (const [r, w] of [[236, 6], [208, 3], [120, 3]]) { // concentric rings
    g.lineWidth = w; g.beginPath(); g.arc(256, 256, r, 0, 6.3); g.stroke();
  }
  for (let i = 0; i < 3; i++) { // interlaced triangles
    g.save(); g.translate(256, 256); g.rotate(i * 2.094);
    g.beginPath(); g.moveTo(0, -120); g.lineTo(104, 60); g.lineTo(-104, 60); g.closePath(); g.stroke();
    g.restore();
  }
  g.lineWidth = 4;
  for (let i = 0; i < 16; i++) { // glyphs around the band
    const a = i / 16 * Math.PI * 2;
    g.save(); g.translate(256 + Math.cos(a) * 170, 256 + Math.sin(a) * 170); g.rotate(a + 1.5708);
    for (let s = 0; s < 4; s++) {
      g.beginPath(); g.moveTo(rr(-12, 12), rr(-14, 14)); g.lineTo(rr(-12, 12), rr(-14, 14)); g.stroke();
    }
    g.restore();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function glowSpriteTexture() {
  const [c, g] = makeCanvas(64, 64);
  const gr = g.createRadialGradient(32, 32, 2, 32, 32, 30);
  gr.addColorStop(0, 'rgba(255,255,255,0.9)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.28)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

/* ================================ materials =============================== */
const woodTex = woodTexture();
const MAT = {
  floor: new THREE.MeshStandardMaterial({ map: stoneFloorTexture(), roughness: 0.93 }),
  wall: new THREE.MeshStandardMaterial({ map: wallTexture(), roughness: 0.96, side: THREE.DoubleSide }),
  ceiling: new THREE.MeshStandardMaterial({ color: 0x241a12, roughness: 1 }),
  woodD: new THREE.MeshStandardMaterial({ map: woodTex, color: 0x9a7a55, roughness: 0.85 }),
  woodM: new THREE.MeshStandardMaterial({ map: woodTex, color: 0xc09a6b, roughness: 0.8 }),
  iron: new THREE.MeshStandardMaterial({ color: PAL.iron, roughness: 0.55, metalness: 0.75 }),
  brass: new THREE.MeshStandardMaterial({ color: PAL.brass, roughness: 0.32, metalness: 0.9 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xcfe8dd, roughness: 0.06, metalness: 0,
    transparent: true, opacity: 0.3, clearcoat: 1, side: THREE.DoubleSide }),
  green: new THREE.MeshStandardMaterial({ color: 0x0d5c33, emissive: PAL.greenGlow, emissiveIntensity: 1.5 }),
  violet: new THREE.MeshStandardMaterial({ color: 0x2c1050, emissive: PAL.violetGlow, emissiveIntensity: 1.4 }),
  amber: new THREE.MeshStandardMaterial({ color: 0x5c3a08, emissive: PAL.amber, emissiveIntensity: 0.8 }),
  wax: new THREE.MeshStandardMaterial({ color: PAL.waxIvory, roughness: 0.6 }),
  flame: new THREE.MeshBasicMaterial({ color: PAL.flame }),
  coal: new THREE.MeshStandardMaterial({ color: 0x1c1210, emissive: 0xff4d12, emissiveIntensity: 1.2, roughness: 0.9 }),
  rune: new THREE.MeshBasicMaterial({ map: runeTexture(), color: PAL.runeTeal, transparent: true,
    opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false }),
  page: new THREE.MeshStandardMaterial({ map: pageTexture(), roughness: 0.9 }),
  parch: new THREE.MeshStandardMaterial({ color: PAL.parchment, roughness: 0.9 }),
  rope: new THREE.MeshStandardMaterial({ color: 0x8a6f45, roughness: 1 }),
  ceramic: new THREE.MeshStandardMaterial({ color: 0x9c8f78, roughness: 0.5 }),
  bone: new THREE.MeshStandardMaterial({ color: 0xd9cfb4, roughness: 0.7 }),
  specimen: new THREE.MeshStandardMaterial({ color: 0x24301c, roughness: 0.9 }),
  liquidPot: new THREE.MeshStandardMaterial({ color: 0x0a3d22, emissive: PAL.greenGlow, emissiveIntensity: 1.7 })
};
const bookMats = [0x6e2b1e, 0x2e4a35, 0x27354f, 0x5a4a20, 0x4a2440]
  .map(c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.8 }));

/* ============================ renderer / scene ============================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.fog); scene.fog = new THREE.Fog(PAL.fog, 11, 30);

const camera = new THREE.PerspectiveCamera(54, innerWidth / innerHeight, 0.1, 80);
camera.position.set(3.4, 4.4, 7.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0.2); controls.enableDamping = true;
controls.autoRotate = true; controls.autoRotateSpeed = 1.0;
controls.minDistance = 4.5; controls.maxDistance = 9.0;
controls.minPolarAngle = 0.95; controls.maxPolarAngle = 1.48;

/* ---- animation registries filled by the builders ---- */
const flames = [], swayers = [], spinners = [];  // { mesh|obj, phase, amp/axis/speed }
const flickerLights = [];                        // { light, base, speed, phase, depth }

/* ============================ builder functions =========================== */
function buildRoom() {
  const g = new THREE.Group();
  const floor = M(new THREE.PlaneGeometry(ROOM.w, ROOM.d), MAT.floor, 0, 0, 0, false);
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
  g.add(floor);
  const wallGeo = new THREE.PlaneGeometry(ROOM.w, ROOM.h);
  for (const [x, z, ry] of [[0, -ROOM.d / 2, 0], [0, ROOM.d / 2, Math.PI],
      [-ROOM.w / 2, 0, Math.PI / 2], [ROOM.w / 2, 0, -Math.PI / 2]]) {
    const w = M(wallGeo, MAT.wall, x, ROOM.h / 2, z, false);
    w.rotation.y = ry; w.receiveShadow = true;
    g.add(w);
  }
  const ceil = M(new THREE.PlaneGeometry(ROOM.w, ROOM.d), MAT.ceiling, 0, ROOM.h, 0, false);
  ceil.rotation.x = Math.PI / 2;
  g.add(ceil);
  const beamGeo = new THREE.BoxGeometry(ROOM.w, 0.42, 0.42);
  for (const z of [-5, 0, 5]) g.add(M(beamGeo, MAT.woodD, 0, ROOM.h - 0.35, z));
  // small round window with cold night glow on the back wall
  const wz = -ROOM.d / 2 + 0.03;
  const win = M(new THREE.CircleGeometry(0.85, 24), new THREE.MeshBasicMaterial({ color: 0x22314f }), 3.4, 5.4, wz, false);
  const rim = M(new THREE.TorusGeometry(0.88, 0.08, 8, 24), MAT.iron, 3.4, 5.4, wz, false);
  const bar1 = M(new THREE.BoxGeometry(1.7, 0.06, 0.05), MAT.iron, 3.4, 5.4, wz, false);
  const bar2 = bar1.clone(); bar2.rotation.z = Math.PI / 2;
  g.add(win, rim, bar1, bar2);
  return g;
}

function buildRuneCircle() {
  const g = new THREE.Group();
  const disc = M(new THREE.CircleGeometry(2.45, 48), MAT.rune, 0, 0.015, 0, false);
  disc.rotation.x = -Math.PI / 2;
  const orb = M(new THREE.IcosahedronGeometry(0.16, 1), new THREE.MeshBasicMaterial({ color: PAL.runeTeal }), 0, 0.55, 0, false);
  g.add(disc, orb);
  g.userData = { orb };
  return g;
}

function buildCauldron() {
  const g = new THREE.Group();
  const profile = [[0.05, 0], [0.62, 0.02], [0.98, 0.34], [1.1, 0.78], [0.98, 1.18], [1.04, 1.3], [0.96, 1.32]]
    .map(p => new THREE.Vector2(p[0], p[1]));
  g.add(M(new THREE.LatheGeometry(profile, 28), MAT.iron, 0, 0.42, 0));
  const rim = M(new THREE.TorusGeometry(1.0, 0.075, 10, 28), MAT.iron, 0, 1.74, 0);
  rim.rotation.x = Math.PI / 2;
  g.add(rim);
  for (let i = 0; i < 3; i++) { // stubby angled legs
    const a = i / 3 * Math.PI * 2;
    const leg = M(new THREE.CylinderGeometry(0.075, 0.1, 0.6, 8), MAT.iron, Math.cos(a) * 0.72, 0.26, Math.sin(a) * 0.72);
    leg.rotation.set(Math.sin(a) * 0.28, 0, -Math.cos(a) * 0.28);
    g.add(leg);
  }
  const liquid = M(new THREE.CircleGeometry(0.9, 26), MAT.liquidPot, 0, 1.58, 0, false);
  liquid.rotation.x = -Math.PI / 2;
  const ash = M(new THREE.CircleGeometry(1.35, 22), new THREE.MeshStandardMaterial({ color: 0x171310, roughness: 1 }), 0, 0.012, 0, false);
  ash.rotation.x = -Math.PI / 2;
  g.add(liquid, ash);
  const coals = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(0.12, 0), MAT.coal, 14);
  const dm = new THREE.Object3D();
  for (let i = 0; i < 14; i++) { // glowing coal bed
    const a = rr(0, 6.28), r = rr(0.1, 0.85);
    dm.position.set(Math.cos(a) * r, 0.07, Math.sin(a) * r);
    dm.rotation.set(rr(0, 3), rr(0, 3), rr(0, 3));
    dm.scale.setScalar(rr(0.7, 1.3)); dm.updateMatrix();
    coals.setMatrixAt(i, dm.matrix);
  }
  const handle = M(new THREE.CylinderGeometry(0.03, 0.03, 1.5, 6), MAT.iron, 0.75, 2.05, 0); // ladle on the rim
  handle.rotation.z = 0.9;
  const cup = M(new THREE.SphereGeometry(0.14, 10, 8, 0, 6.3, 0, 1.6), MAT.iron, 1.34, 1.6, 0);
  cup.rotation.z = 2.6;
  g.add(coals, handle, cup);
  const bubbles = new THREE.InstancedMesh(new THREE.SphereGeometry(0.05, 8, 6), MAT.green, 14); // rising brew bubbles
  bubbles.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const bubbleSeeds = [];
  for (let i = 0; i < 14; i++) bubbleSeeds.push({ a: rr(0, 6.28), r: rr(0, 0.7), p: rr(0, 1), s: rr(0.5, 1.4) });
  g.add(bubbles);
  g.userData = { liquid, bubbles, bubbleSeeds };
  return g;
}

function makeSteam(count, radius) {
  const seeds = [];
  for (let i = 0; i < count; i++) seeds.push({ a: rr(0, 6.28), r: rr(0, radius), p: rr(0, 1), sp: rr(0.14, 0.3) });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 3), 3).setUsage(THREE.DynamicDrawUsage));
  const mat = new THREE.PointsMaterial({ map: glowSpriteTexture(), color: 0x9adfc2, size: 0.5,
    transparent: true, opacity: 0.28, depthWrite: false, blending: THREE.AdditiveBlending });
  const pts = new THREE.Points(geo, mat);
  pts.userData = { seeds, radius };
  return pts;
}

function makeCandle(h, r) {
  const g = new THREE.Group();
  g.add(M(new THREE.CylinderGeometry(r * 0.92, r, h, 10), MAT.wax, 0, h / 2, 0));
  g.add(M(new THREE.CylinderGeometry(r * 1.5, r * 1.7, 0.02, 10), MAT.wax, 0, 0.01, 0, false)); // melt pool
  for (let i = 0; i < 3; i++) { // wax drips running down the side
    const a = rr(0, 6.28);
    const drip = M(new THREE.SphereGeometry(r * 0.3, 6, 6), MAT.wax,
      Math.cos(a) * r * 0.9, h - rr(0.05, h * 0.5), Math.sin(a) * r * 0.9, false);
    drip.scale.y = rr(1.6, 2.6);
    g.add(drip);
  }
  const flame = M(new THREE.ConeGeometry(0.035, 0.13, 8), MAT.flame, 0, h + 0.09, 0, false);
  flames.push({ mesh: flame, phase: rr(0, 6.28) });
  g.add(flame);
  return g;
}

function makeFlask(kind, liquidMat) {
  const g = new THREE.Group();
  if (kind === 'round') {
    g.add(M(new THREE.SphereGeometry(0.22, 16, 12), MAT.glass, 0, 0.24, 0));
    g.add(M(new THREE.CylinderGeometry(0.055, 0.07, 0.26, 10), MAT.glass, 0, 0.53, 0));
    const liq = M(new THREE.SphereGeometry(0.17, 12, 10), liquidMat, 0, 0.21, 0, false);
    liq.scale.y = 0.75; g.add(liq);
  } else if (kind === 'conical') {
    g.add(M(new THREE.CylinderGeometry(0.05, 0.24, 0.42, 14), MAT.glass, 0, 0.21, 0));
    g.add(M(new THREE.CylinderGeometry(0.13, 0.21, 0.16, 12), liquidMat, 0, 0.1, 0, false));
  } else if (kind === 'tube') {
    g.add(M(new THREE.CylinderGeometry(0.055, 0.055, 0.45, 10), MAT.glass, 0, 0.23, 0));
    g.add(M(new THREE.CylinderGeometry(0.042, 0.042, 0.2, 8), liquidMat, 0, 0.12, 0, false));
  } else { // retort: bulb with a long down-curving spout
    g.add(M(new THREE.SphereGeometry(0.24, 16, 12), MAT.glass, 0, 0.26, 0));
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 0.42, 0), new THREE.Vector3(0.2, 0.56, 0),
      new THREE.Vector3(0.44, 0.5, 0), new THREE.Vector3(0.6, 0.26, 0)
    ]);
    g.add(M(new THREE.TubeGeometry(curve, 16, 0.045, 8), MAT.glass));
    const liq = M(new THREE.SphereGeometry(0.19, 12, 10), liquidMat, 0, 0.23, 0, false);
    liq.scale.y = 0.7; g.add(liq);
  }
  if (kind !== 'retort' && rng() < 0.7) // cork stopper
    g.add(M(new THREE.CylinderGeometry(0.05, 0.06, 0.07, 8), MAT.rope,
      0, kind === 'round' ? 0.69 : (kind === 'tube' ? 0.48 : 0.45), 0, false));
  return g;
}

function buildWorkbench() {
  const g = new THREE.Group();
  g.add(M(new THREE.BoxGeometry(4.6, 0.14, 1.7), MAT.woodM, 0, 1.05, 0));
  const legGeo = new THREE.BoxGeometry(0.16, 1.0, 0.16);
  for (const [x, z] of [[-2.1, -0.7], [2.1, -0.7], [-2.1, 0.7], [2.1, 0.7]]) g.add(M(legGeo, MAT.woodD, x, 0.5, z));
  g.add(M(new THREE.BoxGeometry(4.2, 0.08, 1.3), MAT.woodD, 0, 0.34, 0)); // lower shelf
  const layout = [ // glassware line-up on the bench top
    ['retort', MAT.green, -1.85, -0.25], ['round', MAT.violet, -0.95, 0.3],
    ['conical', MAT.green, -0.35, -0.4], ['tube', MAT.amber, 0.05, 0.25],
    ['round', MAT.green, 0.55, -0.15], ['conical', MAT.violet, 1.15, 0.35]
  ];
  for (const [kind, liq, x, z] of layout) {
    const f = makeFlask(kind, liq);
    f.position.set(x, 1.12, z); f.rotation.y = rr(-0.5, 0.5);
    g.add(f);
  }
  // iron ring stand holding a violet round flask over a tiny burner
  const stand = new THREE.Group();
  const ring = M(new THREE.TorusGeometry(0.16, 0.02, 8, 18), MAT.iron, 0.14, 0.52, 0);
  ring.rotation.x = Math.PI / 2;
  const held = makeFlask('round', MAT.violet); held.position.set(0.14, 0.36, 0);
  const bFlame = M(new THREE.ConeGeometry(0.045, 0.14, 8), MAT.flame, 0.14, 0.2, 0, false);
  flames.push({ mesh: bFlame, phase: rr(0, 6.28) });
  stand.add(M(new THREE.CylinderGeometry(0.025, 0.025, 0.9, 8), MAT.iron, 0, 0.45, 0),
    M(new THREE.BoxGeometry(0.4, 0.04, 0.25), MAT.iron, 0, 0.02, 0),
    M(new THREE.CylinderGeometry(0.07, 0.09, 0.1, 10), MAT.brass, 0.14, 0.05, 0), ring, held, bFlame);
  stand.position.set(1.85, 1.12, -0.2);
  g.add(stand);
  // mortar and pestle, stray book, bench candle
  g.add(M(new THREE.CylinderGeometry(0.14, 0.09, 0.14, 12), MAT.ceramic, -1.3, 1.19, 0.45));
  const pestle = M(new THREE.CapsuleGeometry(0.03, 0.16, 4, 8), MAT.ceramic, -1.08, 1.16, 0.5);
  pestle.rotation.z = 1.2; g.add(pestle);
  const benchBook = M(new THREE.BoxGeometry(0.42, 0.09, 0.3), pick(bookMats), 0.7, 1.17, 0.55);
  benchBook.rotation.y = 0.5; g.add(benchBook);
  const c1 = makeCandle(0.3, 0.05); c1.position.set(-2.05, 1.12, 0.55); g.add(c1);
  return g;
}

function buildShelfUnit(shelfCount) {
  const g = new THREE.Group();
  const W = 3.4, H = 4.2, D = 0.85;
  const sideGeo = new THREE.BoxGeometry(0.14, H, D);
  g.add(M(sideGeo, MAT.woodD, -W / 2, H / 2, 0), M(sideGeo, MAT.woodD, W / 2, H / 2, 0));
  g.add(M(new THREE.BoxGeometry(W, H, 0.06), MAT.woodD, 0, H / 2, -D / 2 + 0.03));
  const boardGeo = new THREE.BoxGeometry(W - 0.1, 0.09, D - 0.08);
  for (let s = 0; s < shelfCount; s++) {
    const y = 0.55 + s * (H - 0.8) / (shelfCount - 1);
    g.add(M(boardGeo, MAT.woodM, 0, y, 0));
    let x = -W / 2 + 0.35;
    while (x < W / 2 - 0.3) { // cram the shelf with jars and oddments
      const roll = rng();
      if (roll < 0.42) { // lidded jar, sometimes glowing
        const jm = rng() < 0.4 ? pick([MAT.green, MAT.violet, MAT.amber]) : MAT.glass;
        const jr = rr(0.09, 0.14), jh = rr(0.24, 0.4), jz = rr(-0.12, 0.12);
        g.add(M(new THREE.CylinderGeometry(jr, jr, jh, 10), jm, x, y + 0.05 + jh / 2, jz));
        g.add(M(new THREE.CylinderGeometry(jr * 1.1, jr * 1.1, 0.05, 10), MAT.rope, x, y + 0.07 + jh, jz, false));
      } else if (roll < 0.62) { // specimen sphere with a dark curio inside
        const jz = rr(-0.1, 0.1);
        g.add(M(new THREE.SphereGeometry(0.13, 12, 10), MAT.glass, x, y + 0.18, jz));
        const spec = M(new THREE.TetrahedronGeometry(0.06, 0), MAT.specimen, x, y + 0.18, jz, false);
        spec.rotation.set(rr(0, 3), rr(0, 3), 0);
        g.add(spec);
      } else if (roll < 0.82) { // leaning books
        const n = ri(2, 4);
        for (let b = 0; b < n; b++) {
          const bk = M(new THREE.BoxGeometry(0.07, rr(0.28, 0.4), 0.24), pick(bookMats), x + b * 0.08, y + 0.21, 0);
          bk.rotation.z = b === n - 1 ? -0.18 : 0;
          g.add(bk);
        }
        x += n * 0.08;
      } else { // rolled scroll
        const sc = M(new THREE.CylinderGeometry(0.045, 0.045, 0.3, 8), MAT.parch, x, y + 0.09, rr(-0.1, 0.1));
        sc.rotation.set(0, rr(-0.4, 0.4), Math.PI / 2);
        g.add(sc);
      }
      x += rr(0.32, 0.5);
    }
  }
  const skull = new THREE.Group(); // a specimen skull perched on top
  const cr = M(new THREE.SphereGeometry(0.14, 12, 10), MAT.bone); cr.scale.z = 1.15;
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0x090909 });
  skull.add(cr, M(new THREE.BoxGeometry(0.16, 0.09, 0.14), MAT.bone, 0, -0.1, 0.04),
    M(new THREE.SphereGeometry(0.035, 8, 6), eyeMat, -0.055, 0.02, 0.12, false),
    M(new THREE.SphereGeometry(0.035, 8, 6), eyeMat, 0.055, 0.02, 0.12, false));
  skull.position.set(0.8, H + 0.16, 0);
  g.add(skull);
  return g;
}

function buildLectern() {
  const g = new THREE.Group();
  g.add(M(new THREE.CylinderGeometry(0.32, 0.42, 0.12, 10), MAT.woodD, 0, 0.06, 0));
  g.add(M(new THREE.CylinderGeometry(0.09, 0.12, 1.05, 10), MAT.woodD, 0, 0.62, 0));
  const desk = M(new THREE.BoxGeometry(0.95, 0.06, 0.7), MAT.woodM, 0, 1.22, 0);
  desk.rotation.x = -0.42; g.add(desk);
  const book = new THREE.Group(); // the open grimoire
  const pages = M(new THREE.PlaneGeometry(0.74, 0.5), MAT.page, 0, 0.096, 0, false);
  pages.rotation.x = -Math.PI / 2;
  book.add(M(new THREE.BoxGeometry(0.8, 0.05, 0.56), bookMats[0]),
    M(new THREE.BoxGeometry(0.74, 0.07, 0.5), MAT.parch, 0, 0.06, 0), pages);
  book.position.set(0, 1.28, 0.02); book.rotation.x = -0.42;
  g.add(book);
  const c = makeCandle(0.22, 0.045); c.position.set(0.42, 1.06, -0.32); g.add(c);
  return g;
}

function buildHerbRack() {
  const g = new THREE.Group();
  const pole = M(new THREE.CylinderGeometry(0.045, 0.045, 3.4, 8), MAT.woodD, 0, 3.1, 0);
  pole.rotation.z = Math.PI / 2; g.add(pole);
  for (const px of [-1.55, 1.55]) // ropes up to the ceiling
    g.add(M(new THREE.CylinderGeometry(0.02, 0.02, ROOM.h - 3.5, 6), MAT.rope, px, 3.1 + (ROOM.h - 3.5) / 2, 0, false));
  const herbMats = [PAL.herb, 0x6b6b38, 0x4a5a2e, 0x77683c].map(c =>
    new THREE.MeshStandardMaterial({ color: c, roughness: 1 }));
  for (let i = 0; i < 7; i++) { // hanging dried bundles
    const b = new THREE.Group();
    b.add(M(new THREE.CylinderGeometry(0.012, 0.012, 0.32, 5), MAT.rope, 0, -0.16, 0, false));
    b.add(M(new THREE.SphereGeometry(0.035, 6, 6), MAT.rope, 0, -0.32, 0, false));
    const hm = pick(herbMats);
    for (let k = 0; k < 3; k++) {
      const tuft = M(new THREE.ConeGeometry(rr(0.07, 0.11), rr(0.34, 0.52), 7), hm,
        rr(-0.05, 0.05), -0.52 - rr(0, 0.08), rr(-0.05, 0.05));
      tuft.rotation.set(rr(-0.25, 0.25), 0, rr(-0.25, 0.25));
      b.add(tuft);
    }
    b.position.set(-1.45 + i * 0.48, 3.1, rr(-0.05, 0.05));
    swayers.push({ obj: b, phase: rr(0, 6.28), amp: rr(0.04, 0.09) });
    g.add(b);
  }
  return g;
}

function buildCandelabra() {
  const g = new THREE.Group();
  g.add(M(new THREE.CylinderGeometry(0.24, 0.34, 0.1, 12), MAT.brass, 0, 0.05, 0));
  g.add(M(new THREE.CylinderGeometry(0.045, 0.06, 1.5, 10), MAT.brass, 0, 0.85, 0));
  const armGeo = new THREE.TorusGeometry(0.3, 0.028, 8, 16, Math.PI);
  for (let i = 0; i < 2; i++) { // two curled arms with drip cups
    const arm = M(armGeo, MAT.brass, 0, 1.35, 0);
    arm.rotation.set(0, i * Math.PI, Math.PI);
    g.add(arm, M(new THREE.CylinderGeometry(0.07, 0.05, 0.05, 10), MAT.brass, i === 0 ? -0.3 : 0.3, 1.38, 0));
    const c = makeCandle(0.26, 0.045); c.position.set(i === 0 ? -0.3 : 0.3, 1.41, 0); g.add(c);
  }
  const cTop = makeCandle(0.3, 0.05); cTop.position.y = 1.62; g.add(cTop);
  return g;
}

function buildInstrumentTable() {
  const g = new THREE.Group();
  g.add(M(new THREE.CylinderGeometry(0.85, 0.85, 0.09, 18), MAT.woodM, 0, 0.95, 0),
    M(new THREE.CylinderGeometry(0.09, 0.13, 0.92, 10), MAT.woodD, 0, 0.46, 0),
    M(new THREE.CylinderGeometry(0.4, 0.48, 0.08, 12), MAT.woodD, 0, 0.04, 0));
  // armillary sphere with slowly precessing brass rings
  const arm = new THREE.Group();
  arm.add(M(new THREE.CylinderGeometry(0.1, 0.16, 0.08, 10), MAT.brass),
    M(new THREE.CylinderGeometry(0.02, 0.03, 0.22, 8), MAT.brass, 0, 0.14, 0));
  const rings = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const ring = M(new THREE.TorusGeometry(0.24 - i * 0.045, 0.014, 6, 26), MAT.brass);
    ring.rotation.set(rr(0, 3.1), rr(0, 3.1), 0);
    rings.add(ring);
  }
  rings.add(M(new THREE.SphereGeometry(0.05, 10, 8),
    new THREE.MeshStandardMaterial({ color: 0x8a5c20, emissive: 0xffa63c, emissiveIntensity: 0.7 }), 0, 0, 0, false));
  rings.position.y = 0.5;
  spinners.push({ obj: rings, axis: new THREE.Vector3(0.3, 1, 0.2).normalize(), speed: 0.45 });
  arm.add(rings);
  arm.position.set(0.28, 1.0, 0.1);
  g.add(arm);
  // brass balance scales with a gently rocking beam
  const sc = new THREE.Group();
  sc.add(M(new THREE.CylinderGeometry(0.09, 0.14, 0.05, 10), MAT.brass),
    M(new THREE.CylinderGeometry(0.018, 0.024, 0.42, 8), MAT.brass, 0, 0.23, 0));
  const beam = new THREE.Group();
  beam.add(M(new THREE.BoxGeometry(0.56, 0.02, 0.02), MAT.brass));
  for (const side of [-1, 1])
    beam.add(M(new THREE.CylinderGeometry(0.006, 0.006, 0.16, 5), MAT.brass, side * 0.27, -0.08, 0, false),
      M(new THREE.CylinderGeometry(0.09, 0.07, 0.025, 12), MAT.brass, side * 0.27, -0.17, 0));
  beam.position.y = 0.45;
  swayers.push({ obj: beam, phase: 2.1, amp: 0.06 });
  sc.add(beam);
  sc.position.set(-0.35, 1.0, -0.15);
  g.add(sc);
  return g;
}

function buildTelescope() {
  const g = new THREE.Group();
  for (let i = 0; i < 3; i++) { // wooden tripod
    const a = i / 3 * Math.PI * 2;
    const leg = M(new THREE.CylinderGeometry(0.03, 0.04, 1.5, 8), MAT.woodD, Math.cos(a) * 0.4, 0.72, Math.sin(a) * 0.4);
    leg.rotation.set(Math.sin(a) * 0.5, 0, -Math.cos(a) * 0.5);
    g.add(leg);
  }
  const tube = M(new THREE.CylinderGeometry(0.09, 0.13, 1.3, 14), MAT.brass, 0, 1.55, 0);
  tube.rotation.set(0.9, 0, 0.35);
  g.add(tube, M(new THREE.CylinderGeometry(0.05, 0.05, 0.16, 10), MAT.brass, -0.22, 1.2, -0.35));
  return g;
}

function buildClutter() {
  const g = new THREE.Group();
  for (let i = 0; i < 2; i++) { // supply crates in the corner
    const ch = rr(0.5, 0.7);
    const crate = M(new THREE.BoxGeometry(rr(0.8, 1.0), ch, rr(0.7, 0.9)), MAT.woodM, -7.3 + i * 1.15, ch / 2, -6.6 + i * 0.7);
    crate.rotation.y = rr(-0.3, 0.3);
    g.add(crate);
  }
  for (let i = 0; i < 4; i++) { // floor book stack near the lectern
    const bk = M(new THREE.BoxGeometry(0.5 - i * 0.04, 0.1, 0.36), pick(bookMats), 4.3, 0.05 + i * 0.1, 4.6);
    bk.rotation.y = rr(-0.5, 0.5);
    g.add(bk);
  }
  const floorCandles = new THREE.Group(); // melted cluster beside the rune circle
  for (let i = 0; i < 3; i++) {
    const c = makeCandle(rr(0.16, 0.34), 0.055);
    c.position.set(rr(-0.25, 0.25), 0, rr(-0.25, 0.25));
    floorCandles.add(c);
  }
  floorCandles.position.set(-2.1, 0, 3.6);
  const broom = new THREE.Group(); // broom leaning by the crates
  const stick = M(new THREE.CylinderGeometry(0.03, 0.03, 1.9, 7), MAT.woodM, 0, 1.15, 0);
  stick.rotation.z = 0.28;
  const brush = M(new THREE.ConeGeometry(0.16, 0.5, 9), MAT.rope, 0.31, 0.25, 0);
  brush.rotation.z = 0.28;
  broom.add(stick, brush); broom.position.set(-8.7, 0, -5.4);
  const scroll = M(new THREE.CylinderGeometry(0.05, 0.05, 0.5, 8), MAT.parch, 2.4, 0.05, 4.3);
  scroll.rotation.set(Math.PI / 2, 0, 0.7);
  g.add(floorCandles, broom, scroll);
  return g;
}

/* ============================ assembly / layout =========================== */
function place(obj, x, z, ry = 0) {
  obj.position.set(x, 0, z); obj.rotation.y = ry;
  scene.add(obj); return obj;
}
scene.add(buildRoom(), buildClutter());
const rune = place(buildRuneCircle(), 0.6, 0.4);
const cauldron = place(buildCauldron(), -3.4, -2.4);
const cauldronSteam = makeSteam(36, 0.7);
cauldronSteam.position.set(-3.4, 1.7, -2.4);
scene.add(cauldronSteam);
place(buildWorkbench(), 4.5, -2.9, -0.5);
place(buildShelfUnit(4), -4.6, -9.45);
place(buildShelfUnit(4), -0.4, -9.45);
place(buildShelfUnit(3), -9.45, 2.4, Math.PI / 2);
place(buildLectern(), 3.0, 3.8, 2.5);
place(buildHerbRack(), -5.6, 1.6, 0.35);
place(buildCandelabra(), -1.1, 5.3);
place(buildInstrumentTable(), 6.2, 0.9);
place(buildTelescope(), -7.0, 5.6, 2.2);

/* ================================ lighting ================================ */
scene.add(new THREE.HemisphereLight(0x53402e, 0x120b08, 0.5));

const key = new THREE.SpotLight(0xffb46b, 300, 0, 1.1, 0.55, 1.7); // warm hearth-key from the rafters
key.position.set(2.5, 7.4, 2.0); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004;
key.shadow.camera.near = 1; key.shadow.camera.far = 25;
scene.add(key, key.target);

function accent(color, intensity, dist, x, y, z, speed, phase, depth) {
  const L = new THREE.PointLight(color, intensity, dist, 2);
  L.position.set(x, y, z);
  scene.add(L);
  if (speed) flickerLights.push({ light: L, base: intensity, speed, phase, depth });
  return L;
}
accent(0xff5a1a, 26, 11, -3.4, 0.9, -2.4, 9.5, 0.7, 0.35);     // coal bed
accent(PAL.greenGlow, 20, 9, -3.4, 2.3, -2.4, 5.2, 2.3, 0.3);  // green brew glow
accent(PAL.violetGlow, 16, 8, 4.5, 1.9, -2.7, 6.7, 4.1, 0.32); // violet retort glow on the bench
accent(PAL.runeTeal, 16, 8, 0.6, 0.8, 0.4, 1.7, 0, 0.4);       // rune circle pulse
accent(0xffb143, 14, 7, -1.1, 2.1, 5.3, 11.3, 1.9, 0.28);      // candelabra pool
accent(0xffb143, 9, 6, 3.0, 1.7, 3.8, 12.7, 3.3, 0.3);         // lectern candle pool
accent(0x3a5aa8, 10, 9, 3.4, 5.2, -8.9, 0, 0, 0);              // cold moonlight from the window

/* ============================== animation loop ============================ */
const clock = new THREE.Clock();
const bubbleDummy = new THREE.Object3D();
let prevT = 0;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = Math.min(t - prevT, 0.05);
  prevT = t;
  // candle / burner flames: jittering stretch
  for (const f of flames) {
    const s = 1 + Math.sin(t * 13 + f.phase) * 0.16 + Math.sin(t * 29 + f.phase * 2.7) * 0.1;
    f.mesh.scale.set(1 + (s - 1) * 0.4, s, 1 + (s - 1) * 0.4);
  }
  // flickering light rig (potion light dancing over the brass)
  for (const fl of flickerLights) {
    fl.light.intensity = fl.base * (1 - fl.depth * 0.5 +
      fl.depth * 0.5 * (Math.sin(t * fl.speed + fl.phase) * 0.6 + Math.sin(t * fl.speed * 2.3 + fl.phase) * 0.4));
  }
  // rune circle pulse and hovering focus orb
  MAT.rune.opacity = 0.62 + Math.sin(t * 1.7) * 0.22;
  rune.userData.orb.position.y = 0.55 + Math.sin(t * 1.3) * 0.1; rune.userData.orb.rotation.y = t * 0.8;
  // cauldron brew: bobbing surface and rising bubbles
  const cu = cauldron.userData;
  cu.liquid.position.y = 1.58 + Math.sin(t * 2.1) * 0.015;
  for (let i = 0; i < cu.bubbleSeeds.length; i++) {
    const b = cu.bubbleSeeds[i];
    b.p += dt * (0.4 + b.s * 0.3);
    if (b.p > 1) { b.p = 0; b.a = rr(0, 6.28); b.r = rr(0, 0.7); }
    bubbleDummy.position.set(Math.cos(b.a) * b.r, 1.56 + b.p * 0.32, Math.sin(b.a) * b.r);
    const sc = b.s * 0.9 * (b.p < 0.85 ? 1 : (1 - b.p) / 0.15);
    bubbleDummy.scale.setScalar(Math.max(sc, 0.001));
    bubbleDummy.updateMatrix();
    cu.bubbles.setMatrixAt(i, bubbleDummy.matrix);
  }
  cu.bubbles.instanceMatrix.needsUpdate = true;
  // steam drifting up out of the brew
  const sp = cauldronSteam.geometry.attributes.position;
  const seeds = cauldronSteam.userData.seeds;
  for (let i = 0; i < seeds.length; i++) {
    const s = seeds[i];
    s.p += dt * s.sp;
    if (s.p > 1) { s.p = 0; s.a = rr(0, 6.28); s.r = rr(0, cauldronSteam.userData.radius); }
    const wob = Math.sin(t * 1.4 + i) * 0.12 * s.p;
    sp.setXYZ(i, Math.cos(s.a) * s.r * (1 + s.p) + wob, s.p * 2.4, Math.sin(s.a) * s.r * (1 + s.p));
  }
  sp.needsUpdate = true;
  cauldronSteam.material.opacity = 0.2 + Math.sin(t * 0.9) * 0.06;
  // swaying herb bundles / rocking scale beam, precessing armillary rings
  for (const sw of swayers) sw.obj.rotation.z = Math.sin(t * 0.9 + sw.phase) * sw.amp;
  for (const sn of spinners) sn.obj.rotateOnAxis(sn.axis, sn.speed * dt);

  controls.update(); renderer.render(scene, camera);
}
animate();

/* ================================= resize ================================= */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
