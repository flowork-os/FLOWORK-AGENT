<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cave Entrance</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#151a21}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let s = 7;
const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151a21);
scene.fog = new THREE.Fog(0x151a21, 20, 48);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 120);
camera.position.set(7.5, 3.4, 10.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.1, 0.5);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.maxPolarAngle = Math.PI * 0.52;
controls.minDistance = 4;
controls.maxDistance = 26;

// --- lighting ---
scene.add(new THREE.HemisphereLight(0x9db4c8, 0x2b2721, 0.55));
const sun = new THREE.DirectionalLight(0xffe3bd, 1.7);
sun.position.set(9, 13, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 14, bottom: -2, near: 1, far: 45 });
sun.shadow.bias = -0.0006;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x7d93ad, 0.3);
fill.position.set(-7, 4, 8);
scene.add(fill);

// --- the cave entrance (one centered procedural object) ---
const cave = new THREE.Group();
scene.add(cave);

const mouthP = new THREE.Vector3(0, 1.4, 0.8); // damp zone focus
const dryMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.93 });
const wetMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.38, metalness: 0.05 });
const cDryA = new THREE.Color(0x9a8c76), cDryB = new THREE.Color(0x695e4d), cWet = new THREE.Color(0x2f3b36);

function rockGeo(seed, rough = 0.3, detail = 3) {
  const g = new THREE.IcosahedronGeometry(1, detail);
  const p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const f = 1 + rough * (
      0.55 * Math.sin(v.x * 2.4 + seed) * Math.sin(v.y * 3.1 + seed * 1.7) +
      0.30 * Math.sin(v.y * 5.3 + seed * 2.3) * Math.sin(v.z * 4.2 + seed * 0.6) +
      0.15 * Math.sin(v.x * 9 + v.z * 7 + seed * 3));
    p.setXYZ(i, v.x * f, v.y * f, v.z * f);
  }
  g.computeVertexNormals();
  return g;
}

function paint(mesh, wet) {
  mesh.updateMatrixWorld(true);
  const g = mesh.geometry, p = g.attributes.position;
  const col = new Float32Array(p.count * 3), v = new THREE.Vector3(), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).applyMatrix4(mesh.matrixWorld);
    const band = 0.5 + 0.5 * Math.sin(v.y * 3.2 + Math.sin(v.x * 0.8) * 1.6); // strata layers
    c.copy(cDryA).lerp(cDryB, band);
    const damp = Math.max(0, Math.min(1, 1.15 - v.distanceTo(mouthP) / 3.4)) * (wet ? 1 : 0.7);
    c.lerp(cWet, damp * 0.85);
    c.multiplyScalar((0.7 + 0.3 * Math.max(0, Math.min(1, v.y / 1.5 + 0.2))) * (0.94 + rnd() * 0.12));
    col.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
}

function addRock(mat, wet, x, y, z, sx, sy, sz, rough, detail) {
  const m = new THREE.Mesh(rockGeo(rnd() * 20, rough, detail), mat);
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  m.rotation.set(rnd() * 0.4 - 0.2, rnd() * Math.PI * 2, rnd() * 0.4 - 0.2);
  m.castShadow = m.receiveShadow = true;
  cave.add(m);
  paint(m, wet);
  return m;
}

// dark recessed opening (arched tunnel, seen from inside)
const arch = new THREE.Shape();
arch.moveTo(-1.5, 0); arch.lineTo(1.5, 0); arch.lineTo(1.65, 1.15);
arch.quadraticCurveTo(1.25, 2.55, 0, 2.7);
arch.quadraticCurveTo(-1.3, 2.5, -1.7, 1.1);
arch.lineTo(-1.5, 0);
const tunnel = new THREE.Mesh(
  new THREE.ExtrudeGeometry(arch, { depth: 2.6, bevelEnabled: false }),
  new THREE.MeshStandardMaterial({ color: 0x0a0c0d, roughness: 1, side: THREE.BackSide }));
tunnel.position.set(0, 0.04, 0.7);
tunnel.rotation.y = Math.PI;
cave.add(tunnel);

// occluder wall behind the cliff mass
const back = new THREE.Mesh(new THREE.PlaneGeometry(17, 10),
  new THREE.MeshStandardMaterial({ color: 0x17181a, roughness: 1 }));
back.position.set(0, 4.2, -2.7);
cave.add(back);

// main cliff masses (dry, layered)
[[-3.4, 2.4, -0.2, 2.4, 2.9, 2.0], [3.4, 2.4, -0.2, 2.4, 2.9, 2.0],
 [0, 5.4, -0.5, 4.6, 2.1, 2.1], [-6.0, 1.8, -1.2, 2.2, 2.2, 1.9],
 [6.0, 1.8, -1.2, 2.2, 2.2, 1.9], [-4.9, 4.6, -1.3, 2.2, 1.9, 1.8],
 [4.9, 4.6, -1.3, 2.2, 1.9, 1.8], [0, 7.0, -1.4, 3.4, 1.6, 1.7]]
.forEach(r => addRock(dryMat, 0, ...r, 0.3, 3));

// rock overhang above the mouth
addRock(dryMat, 0, 0, 3.95, 0.9, 2.9, 1.0, 1.6, 0.26, 3);

// damp layered rim hugging the opening
[[-1.85, 0.55, 0.7], [-1.95, 1.45, 0.62], [-1.45, 2.3, 0.58], [-0.6, 2.85, 0.55],
 [0.45, 2.95, 0.55], [1.35, 2.5, 0.58], [1.85, 1.6, 0.62], [1.85, 0.55, 0.7]]
.forEach(([x, y, sz]) => addRock(wetMat, 1, x, y, 0.55, sz, sz * 1.2, sz * 0.8, 0.3, 2));

// boulders at the base
[[-2.6, 0.4, 2.2, 0.6], [2.9, 0.5, 1.7, 0.72], [1.7, 0.28, 3.1, 0.42],
 [-1.2, 0.32, 3.8, 0.46], [3.9, 0.34, 3.2, 0.5], [-3.6, 0.3, 3.0, 0.44]]
.forEach(([x, y, z, r]) => addRock(dryMat, 0, x, y, z, r, r * 0.85, r, 0.35, 2));

// scattered rubble
for (let i = 0; i < 55; i++) {
  const a = (rnd() - 0.5) * 2.6, r = 1.1 + Math.sqrt(rnd()) * 4.6;
  const sz = 0.06 + rnd() * 0.22;
  addRock(dryMat, 0, Math.sin(a) * r, sz * 0.5, 0.5 + Math.cos(a) * r * 0.8, sz, sz * 0.75, sz, 0.45, 1);
}

// ground + damp threshold
const ground = new THREE.Mesh(new THREE.CircleGeometry(18, 48),
  new THREE.MeshStandardMaterial({ color: 0x5b5344, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
cave.add(ground);
const damp = new THREE.Mesh(new THREE.CircleGeometry(2.4, 32),
  new THREE.MeshStandardMaterial({ color: 0x33312a, roughness: 0.45 }));
damp.rotation.x = -Math.PI / 2;
damp.position.set(0, 0.012, 1.5);
damp.receiveShadow = true;
cave.add(damp);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
