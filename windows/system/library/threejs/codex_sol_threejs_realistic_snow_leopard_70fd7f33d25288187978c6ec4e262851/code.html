<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snow Leopard Prowling</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b8c1c3}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8c3c5);
scene.fog = new THREE.Fog(0xb8c3c5, 11, 24);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(-7.8, 4.7, 10.2);
camera.lookAt(0, 1.65, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.55, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 6.5;
controls.maxDistance = 17;
controls.maxPolarAngle = Math.PI * 0.48;

scene.add(new THREE.HemisphereLight(0xdde9ed, 0x474744, 2.25));

const key = new THREE.DirectionalLight(0xfff4df, 4.2);
key.position.set(-5, 9, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -5;
key.shadow.camera.near = 1;
key.shadow.camera.far = 24;
key.shadow.bias = -0.0005;
scene.add(key);

const rim = new THREE.DirectionalLight(0xb6d4e4, 2.6);
rim.position.set(6, 5, -7);
scene.add(rim);

const warm = new THREE.PointLight(0xffd7b0, 1.3, 16);
warm.position.set(-5, 3.2, 5);
scene.add(warm);

const groundMat = new THREE.MeshStandardMaterial({
  color: 0xaab4b3,
  roughness: 0.96,
  metalness: 0
});
const ground = new THREE.Mesh(new THREE.CircleGeometry(12, 96), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const leopard = new THREE.Group();
leopard.rotation.y = -0.08;
leopard.position.y = 0.04;
scene.add(leopard);

const fur = new THREE.MeshStandardMaterial({
  color: 0x92999a,
  roughness: 0.88,
  metalness: 0,
  side: THREE.FrontSide
});
const paleFur = new THREE.MeshStandardMaterial({
  color: 0xe7dfcb,
  roughness: 0.92
});
const darkFur = new THREE.MeshStandardMaterial({
  color: 0x17191a,
  roughness: 0.9
});
const charcoal = new THREE.MeshStandardMaterial({
  color: 0x252728,
  roughness: 0.88
});
const noseMat = new THREE.MeshStandardMaterial({
  color: 0xc98787,
  roughness: 0.7
});
const eyeMat = new THREE.MeshPhysicalMaterial({
  color: 0xb8d7ba,
  roughness: 0.18,
  clearcoat: 1,
  clearcoatRoughness: 0.08,
  emissive: 0x243d29,
  emissiveIntensity: 0.28
});
const whiteMat = new THREE.MeshStandardMaterial({
  color: 0xf6f1e6,
  roughness: 0.75
});

function mesh(geometry, material, position, scale, parent = leopard) {
  const object = new THREE.Mesh(geometry, material);
  object.position.copy(position);
  object.scale.copy(scale);
  object.castShadow = true;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}

function ellipsoid(position, scale, material = fur, parent = leopard, segments = 32) {
  return mesh(
    new THREE.SphereGeometry(1, segments, Math.max(16, segments / 2)),
    material,
    position,
    scale,
    parent
  );
}

function capsuleBetween(a, b, radius, material = fur, parent = leopard, radial = 16) {
  const midpoint = a.clone().add(b).multiplyScalar(0.5);
  const length = a.distanceTo(b);
  const object = mesh(
    new THREE.CapsuleGeometry(radius, Math.max(0.01, length - radius * 2), 6, radial),
    material,
    midpoint,
    new THREE.Vector3(1, 1, 1),
    parent
  );
  object.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    b.clone().sub(a).normalize()
  );
  return object;
}

function orientNormal(object, normal) {
  object.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal.clone().normalize());
}

const body = ellipsoid(
  new THREE.Vector3(0.15, 2.02, 0),
  new THREE.Vector3(2.55, 0.77, 0.78)
);
body.rotation.z = -0.035;

ellipsoid(
  new THREE.Vector3(-1.6, 2.25, 0),
  new THREE.Vector3(1.05, 0.91, 0.86)
);
ellipsoid(
  new THREE.Vector3(1.63, 2.03, 0),
  new THREE.Vector3(1.08, 0.83, 0.82)
);

const belly = ellipsoid(
  new THREE.Vector3(0.05, 1.61, 0),
  new THREE.Vector3(2.08, 0.38, 0.67),
  paleFur
);
belly.scale.z = 0.96;

capsuleBetween(
  new THREE.Vector3(-2.05, 2.25, 0),
  new THREE.Vector3(-2.72, 2.14, 0.02),
  0.54,
  fur
);

const head = ellipsoid(
  new THREE.Vector3(-3.05, 2.12, 0.02),
  new THREE.Vector3(0.83, 0.68, 0.68),
  fur
);
head.rotation.z = -0.12;

ellipsoid(
  new THREE.Vector3(-3.59, 1.91, 0.02),
  new THREE.Vector3(0.52, 0.38, 0.49),
  paleFur
);
ellipsoid(
  new THREE.Vector3(-3.55, 2.08, 0.34),
  new THREE.Vector3(0.4, 0.32, 0.25),
  paleFur
);
ellipsoid(
  new THREE.Vector3(-3.55, 2.08, -0.34),
  new THREE.Vector3(0.4, 0.32, 0.25),
  paleFur
);

function makeEar(z, rotationX) {
  const shape = new THREE.BufferGeometry();
  const vertices = new Float32Array([
    -3.33, 2.55, z,
    -2.89, 3.01, z * 0.98,
    -2.63, 2.49, z
  ]);
  shape.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
  shape.setIndex([0, 1, 2]);
  shape.computeVertexNormals();
  const ear = new THREE.Mesh(shape, darkFur);
  ear.rotation.x = rotationX;
  ear.castShadow = true;
  leopard.add(ear);

  const inner = new THREE.Mesh(
    new THREE.CircleGeometry(0.24, 3),
    new THREE.MeshStandardMaterial({
      color: 0xa57879,
      roughness: 0.95,
      side: THREE.DoubleSide
    })
  );
  inner.position.set(-2.94, 2.68, z + Math.sign(z) * 0.012);
  inner.scale.set(0.8, 1.18, 1);
  inner.rotation.z = z > 0 ? -0.48 : 0.48;
  inner.rotation.y = z > 0 ? 0.07 : Math.PI - 0.07;
  leopard.add(inner);
}
makeEar(0.43, -0.06);
makeEar(-0.43, 0.06);

function eye(z) {
  const e = ellipsoid(
    new THREE.Vector3(-3.55, 2.27, z),
    new THREE.Vector3(0.075, 0.105, 0.135),
    eyeMat
  );
  e.rotation.z = -0.12;
  const pupil = ellipsoid(
    new THREE.Vector3(-3.625, 2.275, z + Math.sign(z) * 0.012),
    new THREE.Vector3(0.028, 0.078, 0.078),
    darkFur
  );
  pupil.rotation.z = -0.1;
  const glint = ellipsoid(
    new THREE.Vector3(-3.65, 2.323, z + Math.sign(z) * 0.055),
    new THREE.Vector3(0.012, 0.022, 0.022),
    whiteMat
  );
}
eye(0.38);
eye(-0.38);

const nose = ellipsoid(
  new THREE.Vector3(-4.045, 1.98, 0),
  new THREE.Vector3(0.16, 0.115, 0.19),
  noseMat
);
nose.rotation.z = -0.08;

capsuleBetween(
  new THREE.Vector3(-3.99, 1.88, 0),
  new THREE.Vector3(-3.91, 1.77, 0),
  0.016,
  darkFur
);
capsuleBetween(
  new THREE.Vector3(-3.91, 1.77, -0.22),
  new THREE.Vector3(-3.91, 1.77, 0.22),
  0.013,
  darkFur
);

for (const side of [-1, 1]) {
  for (let i = 0; i < 5; i++) {
    const y = 1.94 - i * 0.075;
    const start = new THREE.Vector3(-3.75, y, side * (0.35 + i * 0.018));
    const end = new THREE.Vector3(-4.55 + i * 0.035, y + 0.11 - i * 0.035, side * (0.78 + i * 0.10));
    const middle = start.clone().lerp(end, 0.5);
    middle.y += 0.06;
    const curve = new THREE.QuadraticBezierCurve3(start, middle, end);
    const whisker = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 12, 0.008, 5, false),
      whiteMat
    );
    whisker.castShadow = true;
    leopard.add(whisker);
  }
}

function addLeg(points, radii, lifted = false) {
  for (let i = 0; i < points.length - 1; i++) {
    capsuleBetween(points[i], points[i + 1], radii[i], i > 0 ? paleFur : fur);
    if (i < points.length - 2) {
      ellipsoid(points[i + 1], new THREE.Vector3(radii[i] * 1.1, radii[i] * 1.05, radii[i] * 1.05), i > 0 ? paleFur : fur);
    }
  }
  const foot = points[points.length - 1];
  const paw = ellipsoid(
    foot,
    lifted ? new THREE.Vector3(0.42, 0.18, 0.31) : new THREE.Vector3(0.48, 0.16, 0.34),
    paleFur
  );
  paw.rotation.z = lifted ? -0.28 : 0;
  for (let j = -1; j <= 1; j++) {
    capsuleBetween(
      foot.clone().add(new THREE.Vector3(-0.30, 0.015, j * 0.09)),
      foot.clone().add(new THREE.Vector3(-0.41, 0.005, j * 0.09)),
      0.014,
      charcoal
    );
  }
}

addLeg([
  new THREE.Vector3(-1.58, 2.18, 0.46),
  new THREE.Vector3(-1.72, 1.35, 0.52),
  new THREE.Vector3(-1.35, 0.66, 0.51),
  new THREE.Vector3(-0.91, 0.39, 0.51)
], [0.35, 0.24, 0.18]);

addLeg([
  new THREE.Vector3(-1.78, 2.12, -0.43),
  new THREE.Vector3(-2.04, 1.40, -0.52),
  new THREE.Vector3(-2.54, 1.05, -0.55),
  new THREE.Vector3(-2.83, 0.86, -0.56)
], [0.34, 0.23, 0.17], true);

addLeg([
  new THREE.Vector3(1.55, 1.97, 0.45),
  new THREE.Vector3(1.78, 1.24, 0.49),
  new THREE.Vector3(1.48, 0.56, 0.52),
  new THREE.Vector3(1.10, 0.34, 0.54)
], [0.38, 0.27, 0.19]);

addLeg([
  new THREE.Vector3(1.72, 1.95, -0.42),
  new THREE.Vector3(2.03, 1.27, -0.48),
  new THREE.Vector3(2.47, 0.65, -0.48),
  new THREE.Vector3(2.75, 0.34, -0.47)
], [0.38, 0.27, 0.19]);

ellipsoid(new THREE.Vector3(-1.55, 2.62, 0.2), new THREE.Vector3(0.68, 0.34, 0.63), fur);
ellipsoid(new THREE.Vector3(-1.25, 2.67, -0.15), new THREE.Vector3(0.58, 0.3, 0.58), fur);

const tailPoints = [
  new THREE.Vector3(2.25, 2.08, -0.08),
  new THREE.Vector3(2.92, 1.95, -0.14),
  new THREE.Vector3(3.58, 1.62, -0.2),
  new THREE.Vector3(4.08, 1.21, -0.1),
  new THREE.Vector3(4.36, 1.15, 0.35),
  new THREE.Vector3(4.36, 1.45, 0.85),
  new THREE.Vector3(4.08, 1.94, 1.16),
  new THREE.Vector3(3.54, 2.42, 1.22),
  new THREE.Vector3(2.91, 2.77, 1.05),
  new THREE.Vector3(2.38, 2.91, 0.75)
];

for (let i = 0; i < tailPoints.length - 1; i++) {
  const t = i / (tailPoints.length - 1);
  const radius = 0.39 - t * 0.12;
  capsuleBetween(tailPoints[i], tailPoints[i + 1], radius, fur, leopard, 18);
  if (i > 0) {
    ellipsoid(
      tailPoints[i],
      new THREE.Vector3(radius * 1.03, radius * 1.03, radius * 1.03),
      fur,
      leopard,
      20
    );
  }
}
ellipsoid(tailPoints[tailPoints.length - 1], new THREE.Vector3(0.29, 0.29, 0.29), paleFur);

function addRosette(position, normal, sx, sy, rotation = 0, parent = leopard) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.19, 0.045, 7, 15),
    darkFur
  );
  ring.position.copy(position).addScaledVector(normal, 0.022);
  orientNormal(ring, normal);
  ring.rotateZ(rotation);
  ring.scale.set(sx, sy, 0.72);
  ring.castShadow = true;
  parent.add(ring);

  if (sx > 0.8) {
    const core = ellipsoid(
      position.clone().addScaledVector(normal, 0.035),
      new THREE.Vector3(0.045, 0.04, 0.018),
      darkFur,
      parent,
      10
    );
    orientNormal(core, normal);
  }
}

const bodySpotRows = [
  { x: -1.95, count: 5, offset: 0.25 },
  { x: -1.35, count: 6, offset: 0.0 },
  { x: -0.7, count: 7, offset: 0.23 },
  { x: 0.0, count: 7, offset: 0.0 },
  { x: 0.7, count: 7, offset: 0.25 },
  { x: 1.35, count: 6, offset: 0.0 },
  { x: 1.92, count: 5, offset: 0.25 }
];

for (const row of bodySpotRows) {
  for (let j = 0; j < row.count; j++) {
    const angle = -1.15 + (j + row.offset) * (2.3 / Math.max(1, row.count - 1));
    const y = 2.04 + Math.cos(angle) * 0.67;
    const z = Math.sin(angle) * 0.75;
    if (y < 1.68) continue;
    const normal = new THREE.Vector3(0, Math.cos(angle) / 0.77, Math.sin(angle) / 0.78).normalize();
    addRosette(
      new THREE.Vector3(row.x, y, z),
      normal,
      0.78 + 0.24 * Math.sin(row.x * 3 + j),
      0.62 + 0.2 * Math.cos(j * 2.1),
      row.x + j
    );
  }
}

for (const side of [-1, 1]) {
  for (let i = 0; i < 5; i++) {
    const x = -2.65 - (i % 2) * 0.34;
    const y = 2.02 + Math.floor(i / 2) * 0.23;
    const z = side * Math.sqrt(Math.max(0.02, 0.42 - Math.pow(y - 2.12, 2))) * 0.92;
    const normal = new THREE.Vector3(-0.35, (y - 2.12) * 1.8, side).normalize();
    addRosette(new THREE.Vector3(x, y, z), normal, 0.54, 0.43, i * 0.8);
  }
}

const legSpotSets = [
  { x: -1.68, z: 0.79, ys: [1.95, 1.66, 1.38] },
  { x: -1.88, z: -0.76, ys: [1.92, 1.66, 1.4] },
  { x: 1.68, z: 0.77, ys: [1.86, 1.57, 1.28] },
  { x: 1.84, z: -0.72, ys: [1.83, 1.55, 1.28] }
];
for (const set of legSpotSets) {
  for (let i = 0; i < set.ys.length; i++) {
    const side = Math.sign(set.z);
    addRosette(
      new THREE.Vector3(set.x + i * 0.06, set.ys[i], set.z - side * i * 0.05),
      new THREE.Vector3(0.1, 0.1, side),
      0.48,
      0.4,
      i
    );
  }
}

for (let i = 1; i < tailPoints.length - 1; i++) {
  if (i % 2 === 0) {
    const tangent = tailPoints[i + 1].clone().sub(tailPoints[i - 1]).normalize();
    const side = new THREE.Vector3(-tangent.y, tangent.x, 0).normalize();
    const bandCenter = tailPoints[i];
    for (const sign of [-1, 1]) {
      addRosette(
        bandCenter.clone().addScaledVector(side, sign * 0.31),
        side.clone().multiplyScalar(sign),
        0.75,
        0.38,
        i * 0.4
      );
    }
  }
}

const hairPositions = [];
const hairColors = [];
for (let i = 0; i < 360; i++) {
  const x = -2.15 + Math.random() * 4.25;
  const half = Math.sqrt(Math.max(0, 1 - Math.pow(x / 2.55, 2)));
  const z = (Math.random() - 0.5) * 1.28 * half;
  const y = 2.03 + Math.sqrt(Math.max(0, 0.77 * 0.77 * half * half - z * z * 0.27));
  if (y < 2.3) continue;
  const root = new THREE.Vector3(x, y, z);
  const normal = new THREE.Vector3(x / 6.5, (y - 2.02) / 0.58, z / 0.62).normalize();
  const length = 0.045 + Math.random() * 0.085;
  const tip = root.clone().addScaledVector(normal, length);
  hairPositions.push(root.x, root.y, root.z, tip.x, tip.y, tip.z);
  const shade = 0.58 + Math.random() * 0.26;
  hairColors.push(shade, shade, shade, shade + 0.08, shade + 0.08, shade + 0.08);
}
const hairGeometry = new THREE.BufferGeometry();
hairGeometry.setAttribute('position', new THREE.Float32BufferAttribute(hairPositions, 3));
hairGeometry.setAttribute('color', new THREE.Float32BufferAttribute(hairColors, 3));
const hairs = new THREE.LineSegments(
  hairGeometry,
  new THREE.LineBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 0.72
  })
);
leopard.add(hairs);

for (let i = 0; i < 85; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = 2.5 + Math.random() * 6.3;
  const blade = capsuleBetween(
    new THREE.Vector3(Math.cos(angle) * radius, 0.01, Math.sin(angle) * radius),
    new THREE.Vector3(
      Math.cos(angle) * radius + (Math.random() - 0.5) * 0.12,
      0.055 + Math.random() * 0.12,
      Math.sin(angle) * radius + (Math.random() - 0.5) * 0.12
    ),
    0.006 + Math.random() * 0.007,
    new THREE.MeshStandardMaterial({
      color: Math.random() > 0.5 ? 0x82908c : 0x9ba49e,
      roughness: 1
    }),
    scene,
    5
  );
  blade.castShadow = false;
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  leopard.position.y = 0.04 + Math.sin(elapsed * 1.15) * 0.008;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
