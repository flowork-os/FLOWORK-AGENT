<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowing Deep Lanternfish</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #010610; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010610);
scene.fog = new THREE.FogExp2(0x010610, 0.045);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0.2, 0.4, 11.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.42;
controls.enablePan = false;
controls.minDistance = 7;
controls.maxDistance = 18;
controls.target.set(0, 0.15, 0);

scene.add(new THREE.HemisphereLight(0x183653, 0x010207, 0.42));

const rimLight = new THREE.DirectionalLight(0x4c9ec2, 1.3);
rimLight.position.set(-4, 6, 5);
scene.add(rimLight);

const faintFill = new THREE.PointLight(0x116080, 8, 13, 2);
faintFill.position.set(-2, -1, 4);
scene.add(faintFill);

const fish = new THREE.Group();
fish.rotation.x = -0.08;
fish.rotation.z = -0.015;
scene.add(fish);

function centerline(t) {
  const x = -3.45 + 6.05 * t;
  const y = -0.54 + 1.48 * Math.sin(Math.PI * t) + 0.1 * t;
  return new THREE.Vector3(x, y, 0);
}

function bodyRadius(t) {
  const tailRise = THREE.MathUtils.smoothstep(t, 0, 0.22);
  const headTaper = 1 - 0.24 * THREE.MathUtils.smoothstep(t, 0.75, 1);
  const fullness = 0.17 + 0.52 * Math.sin(Math.PI * Math.min(1, t * 1.06));
  return fullness * tailRise * headTaper + 0.045;
}

function tangentAt(t) {
  const e = 0.001;
  const a = centerline(Math.max(0, t - e));
  const b = centerline(Math.min(1, t + e));
  return b.sub(a).normalize();
}

function surfacePoint(t, verticalOffset, depthScale = 1) {
  const c = centerline(t);
  const tangent = tangentAt(t);
  const normal = new THREE.Vector3(-tangent.y, tangent.x, 0).normalize();
  const r = bodyRadius(t);
  c.addScaledVector(normal, verticalOffset * r);
  c.z = Math.sqrt(Math.max(0, 1 - verticalOffset * verticalOffset)) * r * 0.67 * depthScale;
  return c;
}

function createBodyGeometry() {
  const segments = 88;
  const rings = 18;
  const positions = [];
  const normals = [];
  const indices = [];

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const c = centerline(t);
    const tangent = tangentAt(t);
    const up = new THREE.Vector3(-tangent.y, tangent.x, 0).normalize();
    const side = new THREE.Vector3(0, 0, 1);
    const r = bodyRadius(t);
    const verticalScale = 1.03 + 0.12 * Math.sin(Math.PI * t);
    const depthScale = 0.67;

    for (let j = 0; j < rings; j++) {
      const angle = j / rings * Math.PI * 2;
      const cv = Math.cos(angle);
      const sv = Math.sin(angle);
      const p = c.clone()
        .addScaledVector(up, cv * r * verticalScale)
        .addScaledVector(side, sv * r * depthScale);
      positions.push(p.x, p.y, p.z);

      const n = up.clone()
        .multiplyScalar(cv / verticalScale)
        .addScaledVector(side, sv / depthScale)
        .normalize();
      normals.push(n.x, n.y, n.z);
    }
  }

  for (let i = 0; i < segments; i++) {
    for (let j = 0; j < rings; j++) {
      const next = (j + 1) % rings;
      const a = i * rings + j;
      const b = (i + 1) * rings + j;
      const c = (i + 1) * rings + next;
      const d = i * rings + next;
      indices.push(a, b, d, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geometry.setIndex(indices);
  geometry.computeBoundingSphere();
  return geometry;
}

const bodyMaterial = new THREE.MeshStandardMaterial({
  color: 0x071522,
  roughness: 0.9,
  metalness: 0.02,
  emissive: 0x020b13,
  emissiveIntensity: 0.55,
  side: THREE.DoubleSide
});

const body = new THREE.Mesh(createBodyGeometry(), bodyMaterial);
body.castShadow = true;
body.receiveShadow = true;
fish.add(body);

function finGeometry(points, z = 0) {
  const positions = [];
  const indices = [];
  for (const p of points) positions.push(p.x, p.y, z);
  for (let i = 1; i < points.length - 1; i++) indices.push(0, i, i + 1);
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const finMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x0a3850,
  emissive: 0x0b5470,
  emissiveIntensity: 0.42,
  transparent: true,
  opacity: 0.52,
  roughness: 0.7,
  metalness: 0,
  transmission: 0.06,
  depthWrite: false,
  side: THREE.DoubleSide,
  blending: THREE.NormalBlending
});

function offsetPoint(t, amount) {
  const c = centerline(t);
  const tangent = tangentAt(t);
  return c.add(new THREE.Vector3(-tangent.y, tangent.x, 0).multiplyScalar(amount));
}

const dorsalPoints = [
  offsetPoint(0.29, bodyRadius(0.29) * 0.86),
  offsetPoint(0.38, bodyRadius(0.38) * 1.85),
  offsetPoint(0.52, bodyRadius(0.52) * 1.48),
  offsetPoint(0.65, bodyRadius(0.65) * 0.88)
];
const dorsal = new THREE.Mesh(finGeometry(dorsalPoints, -0.035), finMaterial);
fish.add(dorsal);

const ventralPoints = [
  offsetPoint(0.38, -bodyRadius(0.38) * 0.84),
  offsetPoint(0.51, -bodyRadius(0.51) * 1.55),
  offsetPoint(0.66, -bodyRadius(0.66) * 1.13),
  offsetPoint(0.73, -bodyRadius(0.73) * 0.83)
];
const ventral = new THREE.Mesh(finGeometry(ventralPoints, -0.02), finMaterial);
fish.add(ventral);

const pectoralBase = surfacePoint(0.71, -0.08, 1.03);
const pectoralGeometry = finGeometry([
  new THREE.Vector3(pectoralBase.x, pectoralBase.y, pectoralBase.z),
  new THREE.Vector3(0.25, -0.76, 1.08),
  new THREE.Vector3(1.25, -0.22, 0.58)
]);
const pectoral = new THREE.Mesh(pectoralGeometry, finMaterial);
fish.add(pectoral);

const tailBase = centerline(0.035);
const tailGeometry = finGeometry([
  new THREE.Vector3(tailBase.x + 0.12, tailBase.y, -0.02),
  new THREE.Vector3(-4.43, tailBase.y + 1.13, -0.05),
  new THREE.Vector3(-4.12, tailBase.y + 0.08, 0),
  new THREE.Vector3(-4.38, tailBase.y - 1.02, -0.05)
]);
const tail = new THREE.Mesh(tailGeometry, finMaterial);
fish.add(tail);

const tailRayMaterial = new THREE.LineBasicMaterial({
  color: 0x3fd4e6,
  transparent: true,
  opacity: 0.32,
  blending: THREE.AdditiveBlending
});
[
  new THREE.Vector3(-4.43, tailBase.y + 1.13, 0),
  new THREE.Vector3(-4.12, tailBase.y + 0.08, 0.02),
  new THREE.Vector3(-4.38, tailBase.y - 1.02, 0)
].forEach(end => {
  const ray = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(tailBase.x + 0.1, tailBase.y, 0.03),
      end
    ]),
    tailRayMaterial
  );
  fish.add(ray);
});

const photophoreCoreMaterial = new THREE.MeshBasicMaterial({
  color: 0xd9ffff,
  toneMapped: false
});
const photophoreHaloMaterial = new THREE.MeshBasicMaterial({
  color: 0x42e9ff,
  transparent: true,
  opacity: 0.16,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  toneMapped: false
});

const coreGeometry = new THREE.SphereGeometry(0.055, 12, 8);
const haloGeometry = new THREE.SphereGeometry(0.145, 12, 8);
const photophoreData = [];

for (let i = 0; i < 23; i++) {
  const t = 0.13 + i * 0.033;
  const wave = Math.sin(i * 1.7) * 0.035;
  photophoreData.push({ t, row: -0.28 + wave, scale: 0.8 + 0.25 * Math.sin(i * 2.2 + 1) });
}
for (let i = 0; i < 15; i++) {
  const t = 0.24 + i * 0.045;
  photophoreData.push({ t, row: 0.18 + Math.sin(i * 1.45) * 0.04, scale: 0.72 + 0.18 * Math.cos(i) });
}
for (let i = 0; i < 9; i++) {
  const t = 0.43 + i * 0.052;
  photophoreData.push({ t, row: -0.58 + Math.sin(i) * 0.03, scale: 0.65 + i * 0.018 });
}

const cores = new THREE.InstancedMesh(coreGeometry, photophoreCoreMaterial, photophoreData.length);
const halos = new THREE.InstancedMesh(haloGeometry, photophoreHaloMaterial, photophoreData.length);
const dummy = new THREE.Object3D();

photophoreData.forEach((d, i) => {
  const p = surfacePoint(d.t, d.row, 1.08);
  dummy.position.copy(p);
  dummy.scale.setScalar(d.scale);
  dummy.updateMatrix();
  cores.setMatrixAt(i, dummy.matrix);

  dummy.scale.setScalar(d.scale * (0.9 + 0.25 * Math.sin(i * 3.1)));
  dummy.updateMatrix();
  halos.setMatrixAt(i, dummy.matrix);
});
cores.instanceMatrix.needsUpdate = true;
halos.instanceMatrix.needsUpdate = true;
fish.add(cores, halos);

const headCenter = centerline(0.94);
const headAngle = Math.atan2(tangentAt(0.94).y, tangentAt(0.94).x);
const eyeGroup = new THREE.Group();
eyeGroup.position.set(headCenter.x + 0.13, headCenter.y + 0.15, 0.49);
eyeGroup.rotation.z = headAngle;
fish.add(eyeGroup);

const eyeSocket = new THREE.Mesh(
  new THREE.SphereGeometry(0.185, 24, 16),
  new THREE.MeshStandardMaterial({ color: 0x010306, roughness: 0.28, metalness: 0.15 })
);
eyeSocket.scale.set(1, 1, 0.45);
eyeGroup.add(eyeSocket);

const iris = new THREE.Mesh(
  new THREE.SphereGeometry(0.108, 20, 12),
  new THREE.MeshBasicMaterial({ color: 0x58e9ec, toneMapped: false })
);
iris.position.z = 0.13;
iris.scale.z = 0.28;
eyeGroup.add(iris);

const pupil = new THREE.Mesh(
  new THREE.SphereGeometry(0.06, 18, 10),
  new THREE.MeshBasicMaterial({ color: 0x000407 })
);
pupil.position.z = 0.17;
pupil.scale.z = 0.22;
eyeGroup.add(pupil);

const jawMaterial = new THREE.MeshStandardMaterial({
  color: 0x06111b,
  roughness: 0.82,
  emissive: 0x02080d,
  side: THREE.DoubleSide
});
const jaw = new THREE.Mesh(
  finGeometry([
    new THREE.Vector3(2.15, 0.1, 0.13),
    new THREE.Vector3(2.87, 0.2, 0.1),
    new THREE.Vector3(2.16, -0.13, 0.13)
  ]),
  jawMaterial
);
fish.add(jaw);

const filamentStart = new THREE.Vector3(2.08, 1.02, 0.18);
const filamentCurve = new THREE.CubicBezierCurve3(
  filamentStart,
  new THREE.Vector3(2.25, 2.15, 0.18),
  new THREE.Vector3(3.1, 2.05, 0.28),
  new THREE.Vector3(3.0, 1.1, 0.4)
);
const filament = new THREE.Mesh(
  new THREE.TubeGeometry(filamentCurve, 36, 0.018, 7, false),
  new THREE.MeshStandardMaterial({
    color: 0x153e4e,
    emissive: 0x1aa5b7,
    emissiveIntensity: 1.1,
    roughness: 0.65
  })
);
fish.add(filament);

const bulbPosition = filamentCurve.getPoint(1);
const bulb = new THREE.Group();
bulb.position.copy(bulbPosition);
fish.add(bulb);

const bulbOuter = new THREE.Mesh(
  new THREE.SphereGeometry(0.26, 28, 20),
  new THREE.MeshBasicMaterial({
    color: 0x69efff,
    transparent: true,
    opacity: 0.25,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    toneMapped: false
  })
);
bulbOuter.scale.set(1.05, 1.25, 1.05);
bulb.add(bulbOuter);

const bulbCore = new THREE.Mesh(
  new THREE.SphereGeometry(0.13, 22, 16),
  new THREE.MeshBasicMaterial({ color: 0xe8ffff, toneMapped: false })
);
bulbCore.scale.set(1, 1.18, 1);
bulb.add(bulbCore);

const bulbHalo = new THREE.Mesh(
  new THREE.SphereGeometry(0.62, 24, 16),
  new THREE.MeshBasicMaterial({
    color: 0x25dff5,
    transparent: true,
    opacity: 0.085,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.BackSide,
    toneMapped: false
  })
);
bulb.add(bulbHalo);

const lureLight = new THREE.PointLight(0x75efff, 22, 4.8, 2);
lureLight.position.copy(bulbPosition);
fish.add(lureLight);

const tailGlow = new THREE.Mesh(
  new THREE.SphereGeometry(0.58, 20, 14),
  new THREE.MeshBasicMaterial({
    color: 0x2edcf2,
    transparent: true,
    opacity: 0.07,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    toneMapped: false
  })
);
tailGlow.position.set(-4.25, tailBase.y + 0.05, -0.02);
tailGlow.scale.set(0.8, 1.7, 0.65);
fish.add(tailGlow);

const tailTipLight = new THREE.PointLight(0x36d9ed, 4.5, 3, 2);
tailTipLight.position.set(-4.18, tailBase.y + 0.05, 0.15);
fish.add(tailTipLight);

const bubbleMaterial = new THREE.MeshBasicMaterial({
  color: 0x36a8c4,
  transparent: true,
  opacity: 0.11,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});
const bubbleGeometry = new THREE.SphereGeometry(0.035, 8, 6);
const bubbles = new THREE.Group();
for (let i = 0; i < 18; i++) {
  const b = new THREE.Mesh(bubbleGeometry, bubbleMaterial);
  const angle = i * 2.399;
  const radius = 4.6 + (i % 4) * 0.42;
  b.position.set(
    Math.cos(angle) * radius,
    Math.sin(angle * 1.3) * 2.7,
    -1.5 - (i % 5) * 0.7
  );
  b.scale.setScalar(0.5 + (i % 3) * 0.4);
  bubbles.add(b);
}
scene.add(bubbles);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  fish.position.y = Math.sin(time * 0.55) * 0.055;
  fish.rotation.y = Math.sin(time * 0.32) * 0.045;
  bulbOuter.scale.setScalar(1 + Math.sin(time * 3.1) * 0.045);
  bulbOuter.scale.y *= 1.2;
  bulbHalo.scale.setScalar(1 + Math.sin(time * 2.15) * 0.09);
  tailGlow.material.opacity = 0.065 + Math.sin(time * 1.8) * 0.012;
  photophoreHaloMaterial.opacity = 0.145 + Math.sin(time * 2.4) * 0.025;
  lureLight.intensity = 21 + Math.sin(time * 2.6) * 3;

  bubbles.children.forEach((b, i) => {
    b.position.y += 0.0015 + (i % 3) * 0.0007;
    if (b.position.y > 3.5) b.position.y = -3.5;
  });

  controls.update();
  renderer.render(scene, camera);
}

animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
