<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand-Thrown Glazed Ceramic Vase</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #d8d0c2;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8d0c2);
scene.fog = new THREE.Fog(0xd8d0c2, 15, 28);

const camera = new THREE.PerspectiveCamera(
  35,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.set(8.2, 5.7, 9.4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.75, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 7;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.48;

const ambient = new THREE.HemisphereLight(0xfff7e8, 0x4b5360, 2.1);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xfff0d8, 5.2);
keyLight.position.set(-5.5, 9, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -3;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 22;
keyLight.shadow.bias = -0.00025;
keyLight.shadow.normalBias = 0.025;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xbcd9ff, 2.1);
fillLight.position.set(6, 5, 3);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xffc998, 28, 16, 2);
rimLight.position.set(-4, 5.5, -5);
scene.add(rimLight);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xc5bbaa,
  roughness: 0.82,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.08;
floor.receiveShadow = true;
scene.add(floor);

const shadowCanvas = document.createElement('canvas');
shadowCanvas.width = 256;
shadowCanvas.height = 256;
const shadowContext = shadowCanvas.getContext('2d');
const shadowGradient = shadowContext.createRadialGradient(128, 128, 8, 128, 128, 124);
shadowGradient.addColorStop(0, 'rgba(28,24,20,0.42)');
shadowGradient.addColorStop(0.35, 'rgba(28,24,20,0.22)');
shadowGradient.addColorStop(1, 'rgba(28,24,20,0)');
shadowContext.fillStyle = shadowGradient;
shadowContext.fillRect(0, 0, 256, 256);

const contactShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(6.5, 6.5),
  new THREE.MeshBasicMaterial({
    map: new THREE.CanvasTexture(shadowCanvas),
    transparent: true,
    depthWrite: false,
    opacity: 0.7
  })
);
contactShadow.rotation.x = -Math.PI / 2;
contactShadow.position.y = -0.065;
scene.add(contactShadow);

const profile = [
  [0.00, 0.02],
  [0.52, 0.02],
  [1.08, 0.12],
  [1.58, 0.38],
  [1.94, 0.78],
  [2.14, 1.32],
  [2.20, 1.88],
  [2.12, 2.48],
  [1.91, 2.98],
  [1.57, 3.39],
  [1.13, 3.70],
  [0.76, 3.96],
  [0.60, 4.25],
  [0.57, 4.65],
  [0.60, 5.06],
  [0.72, 5.31],
  [0.89, 5.48],
  [0.95, 5.61],
  [0.89, 5.72],
  [0.72, 5.74],
  [0.57, 5.64],
  [0.52, 5.45],
  [0.49, 5.05],
  [0.48, 4.63],
  [0.50, 4.29],
  [0.43, 4.08],
  [0.00, 4.00]
].map(([radius, height]) => new THREE.Vector2(radius, height));

const vaseGeometry = new THREE.LatheGeometry(profile, 192);
const positions = vaseGeometry.attributes.position;
const colors = new Float32Array(positions.count * 3);
const baseColor = new THREE.Color(0x176f78);
const paleColor = new THREE.Color(0x4f9a94);
const deepColor = new THREE.Color(0x0d4f59);

const chips = [
  { angle: 0.48, width: 0.095, depth: 0.15 },
  { angle: 2.48, width: 0.070, depth: 0.105 },
  { angle: -1.72, width: 0.055, depth: 0.075 }
];

function angularDistance(a, b) {
  return Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));
}

for (let i = 0; i < positions.count; i++) {
  let x = positions.getX(i);
  let y = positions.getY(i);
  let z = positions.getZ(i);
  const angle = Math.atan2(z, x);
  const radius = Math.hypot(x, z);

  const broadWobble =
    1 +
    0.012 * Math.sin(angle * 2 + y * 0.72) +
    0.007 * Math.sin(angle * 5 - y * 1.15) +
    0.004 * Math.sin(angle * 9 + y * 2.3);

  const leanX = 0.022 * Math.sin(y * 0.88) * (y / 5.75);
  const leanZ = 0.018 * Math.sin(y * 1.13 + 0.8) * (y / 5.75);

  x = x * broadWobble + leanX;
  z = z * broadWobble + leanZ;

  if (y > 5.43 && radius > 0.55) {
    const topInfluence = THREE.MathUtils.smoothstep(y, 5.43, 5.75);
    for (const chip of chips) {
      const distance = angularDistance(angle, chip.angle);
      if (distance < chip.width) {
        const chipShape = Math.cos((distance / chip.width) * Math.PI * 0.5);
        y -= chip.depth * chipShape * chipShape * topInfluence;
        const inward = 1 - 0.055 * chipShape;
        x *= inward;
        z *= inward;
      }
    }
  }

  positions.setXYZ(i, x, y, z);

  const banding =
    0.5 +
    0.25 * Math.sin(y * 8.2 + Math.sin(angle * 3) * 0.4) +
    0.15 * Math.sin(y * 18.5 + angle * 2);

  const irregularity =
    0.5 + 0.5 * Math.sin(angle * 13.7 + y * 6.1) * Math.sin(angle * 5.3 - y * 3.7);

  const mixValue = THREE.MathUtils.clamp(0.20 + banding * 0.24 + irregularity * 0.08, 0, 0.55);
  const vertexColor = baseColor.clone().lerp(paleColor, mixValue);
  vertexColor.lerp(deepColor, THREE.MathUtils.clamp((2.2 - y) * 0.035, 0, 0.12));

  colors[i * 3] = vertexColor.r;
  colors[i * 3 + 1] = vertexColor.g;
  colors[i * 3 + 2] = vertexColor.b;
}

vaseGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
vaseGeometry.computeVertexNormals();
vaseGeometry.computeBoundingSphere();

const glazeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  vertexColors: true,
  roughness: 0.19,
  metalness: 0,
  clearcoat: 0.95,
  clearcoatRoughness: 0.13,
  reflectivity: 0.65,
  ior: 1.48,
  sheen: 0.12,
  sheenColor: new THREE.Color(0xb7e1d4),
  side: THREE.DoubleSide
});

const vase = new THREE.Mesh(vaseGeometry, glazeMaterial);
vase.castShadow = true;
vase.receiveShadow = true;
scene.add(vase);

const clayMaterial = new THREE.MeshStandardMaterial({
  color: 0x9a6246,
  roughness: 0.7,
  metalness: 0
});

for (let i = 0; i < chips.length; i++) {
  const chip = chips[i];
  const radius = 0.79;
  const marker = new THREE.Mesh(
    new THREE.SphereGeometry(1, 20, 12),
    clayMaterial
  );
  marker.scale.set(chip.width * 1.12, 0.035 + chip.depth * 0.15, 0.065);
  marker.position.set(
    Math.cos(chip.angle) * radius,
    5.61 - chip.depth * 0.42,
    Math.sin(chip.angle) * radius
  );
  marker.rotation.y = -chip.angle;
  marker.castShadow = true;
  scene.add(marker);
}

const mouthMaterial = new THREE.MeshStandardMaterial({
  color: 0x12383a,
  roughness: 0.34,
  metalness: 0,
  side: THREE.DoubleSide
});
const mouth = new THREE.Mesh(
  new THREE.CircleGeometry(0.515, 96),
  mouthMaterial
);
mouth.rotation.x = -Math.PI / 2;
mouth.position.set(0.017, 5.535, 0.006);
scene.add(mouth);

const ringMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x267d82,
  roughness: 0.23,
  clearcoat: 0.9,
  clearcoatRoughness: 0.15
});

const throwingRings = [
  { y: 1.08, radius: 2.06, tube: 0.011 },
  { y: 1.72, radius: 2.19, tube: 0.012 },
  { y: 2.37, radius: 2.12, tube: 0.010 },
  { y: 3.02, radius: 1.86, tube: 0.010 },
  { y: 4.36, radius: 0.575, tube: 0.009 },
  { y: 4.75, radius: 0.575, tube: 0.009 }
];

for (let i = 0; i < throwingRings.length; i++) {
  const ring = throwingRings[i];
  const mesh = new THREE.Mesh(
    new THREE.TorusGeometry(ring.radius, ring.tube, 8, 160),
    ringMaterial
  );
  mesh.rotation.x = Math.PI / 2;
  mesh.position.y = ring.y;
  mesh.scale.x = 1 + 0.004 * Math.sin(i * 2.1);
  mesh.scale.y = 1 - 0.005 * Math.cos(i * 1.7);
  mesh.castShadow = true;
  scene.add(mesh);
}

const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(28, 15),
  new THREE.MeshStandardMaterial({
    color: 0xd8d0c2,
    roughness: 1
  })
);
backdrop.position.set(0, 6, -8);
backdrop.receiveShadow = true;
scene.add(backdrop);

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  rimLight.intensity = 28 + Math.sin(elapsed * 0.45) * 1.2;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
