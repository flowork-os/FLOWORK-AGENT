<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ================================================================
// 1. CONFIG & PALETTE - cozy winter storybook at dusk
// ================================================================
const SEED = 20260117;
const PAL = {
  snow: 0xedf3fc, ice: 0xbfd9ec, timber: 0x8a6a48, timberDark: 0x54402c,
  roof: 0x6a5644, stone: 0x9198a6, plaster: 0xd9dee9, iron: 0x2b3038,
  amber: 0xffb45c, spruce: 0x2f5240, trunk: 0x4c3a28, red: 0x9e3030,
  gold: 0xc89a44, horse: 0x5a3d26, spire: 0x39404f, dusk: 0x474b72
};

// ================================================================
// 2. SEEDED PRNG & SMALL HELPERS
// ================================================================
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(SEED);
const rr = (a, b) => a + (b - a) * rand();
function mesh(geo, mat, x = 0, y = 0, z = 0){
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m;
}
function shadowify(g){
  g.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

// ---- core renderer / camera / controls ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(PAL.dusk, 55, 150);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 420);
camera.position.set(30, 17, 38);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.2, -2);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.autoRotate = true; controls.autoRotateSpeed = 0.85;
controls.minDistance = 20; controls.maxDistance = 78;
controls.maxPolarAngle = 1.42;

// ================================================================
// 3. PROCEDURAL CANVAS TEXTURES
// ================================================================
function makeTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const woodTex = makeTex(256, 256, g => {
  g.fillStyle = '#7a5a3a'; g.fillRect(0, 0, 256, 256);
  for (let y = 0; y < 256; y += 16){
    g.fillStyle = `rgba(40,24,12,${0.15 + rand() * 0.15})`; g.fillRect(0, y, 256, 2.5);
    g.fillStyle = `rgba(255,220,170,${0.04 + rand() * 0.05})`; g.fillRect(0, y + 7, 256, 1.5);
  }
  for (let i = 0; i < 60; i++){
    g.strokeStyle = `rgba(52,34,18,${0.1 + rand() * 0.2})`; g.lineWidth = 1;
    const y = rand() * 256; g.beginPath(); g.moveTo(0, y);
    g.bezierCurveTo(64, y + rr(-4, 4), 190, y + rr(-4, 4), 256, y); g.stroke();
  }
  for (let i = 0; i < 9; i++){
    g.fillStyle = 'rgba(40,26,14,0.55)';
    g.beginPath(); g.ellipse(rand() * 256, rand() * 256, 3.5, 5, 0, 0, 7); g.fill();
  }
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping; woodTex.repeat.set(0.28, 0.28);
const snowTex = makeTex(256, 256, g => {
  g.fillStyle = '#eef4fd'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 900; i++){
    g.fillStyle = `rgba(186,201,232,${0.06 + rand() * 0.14})`;
    g.beginPath(); g.arc(rand() * 256, rand() * 256, rr(1, 4), 0, 7); g.fill();
  }
  for (let i = 0; i < 140; i++){
    g.fillStyle = 'rgba(255,255,255,0.9)'; g.fillRect(rand() * 256, rand() * 256, 1.4, 1.4);
  }
});
snowTex.wrapS = snowTex.wrapT = THREE.RepeatWrapping; snowTex.repeat.set(9, 9);
const laneTex = makeTex(256, 1024, g => {
  g.fillStyle = '#c2cee0'; g.fillRect(0, 0, 256, 1024);
  for (let i = 0; i < 700; i++){
    g.fillStyle = `rgba(140,158,190,${0.05 + rand() * 0.16})`;
    g.beginPath(); g.arc(rand() * 256, rand() * 1024, rr(1, 5), 0, 7); g.fill();
  }
  for (const x of [92, 164]){                              // sleigh runner tracks
    g.strokeStyle = 'rgba(122,140,176,0.85)'; g.lineWidth = 7; g.beginPath();
    g.moveTo(x, 0);
    for (let y = 0; y <= 1024; y += 64) g.lineTo(x + Math.sin(y * 0.013) * 9, y);
    g.stroke();
  }
  for (let y = 30; y < 1024; y += 46){                     // hoof prints
    g.fillStyle = 'rgba(96,112,148,0.7)';
    g.beginPath(); g.ellipse(118 + (y % 92 ? 22 : 0), y, 5, 8, 0, 0, 7); g.fill();
  }
});
const pondTex = makeTex(512, 512, g => {
  const rg = g.createRadialGradient(256, 256, 40, 256, 256, 258);
  rg.addColorStop(0, '#e0f1fb'); rg.addColorStop(0.55, '#aecbe8'); rg.addColorStop(1, '#7fa3cd');
  g.fillStyle = rg; g.fillRect(0, 0, 512, 512);
  g.strokeStyle = 'rgba(255,255,255,0.28)'; g.lineWidth = 1.6;
  for (let i = 0; i < 14; i++){                            // hairline cracks
    const a = rand() * Math.PI * 2;
    g.beginPath(); g.moveTo(256, 256);
    g.lineTo(256 + Math.cos(a) * rr(90, 240), 256 + Math.sin(a) * rr(90, 240)); g.stroke();
  }
  g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 4;
  for (let i = 0; i < 5; i++){                             // looping skate trails
    const cx = rr(160, 350), cy = rr(160, 350), r = rr(45, 110);
    g.beginPath(); g.ellipse(cx, cy, r, r * rr(0.45, 0.8), rand() * 3, 0, 7); g.stroke();
  }
  g.beginPath(); g.ellipse(230, 250, 70, 40, 0.5, 0, 7); g.stroke();
  g.beginPath(); g.ellipse(310, 290, 70, 40, 0.5, 0, 7); g.stroke();   // figure eight
});
const winTex = makeTex(64, 80, g => {
  g.fillStyle = '#2a1c10'; g.fillRect(0, 0, 64, 80);
  const rg = g.createRadialGradient(32, 40, 4, 32, 40, 52);
  rg.addColorStop(0, '#ffe7b0'); rg.addColorStop(0.6, '#f7b45c'); rg.addColorStop(1, '#c97b2e');
  g.fillStyle = rg; g.fillRect(5, 5, 54, 70);
  g.fillStyle = '#3a2814'; g.fillRect(29, 5, 6, 70); g.fillRect(5, 37, 54, 6);
});
const archWinTex = makeTex(64, 96, g => {
  g.fillStyle = '#22283c'; g.fillRect(0, 0, 64, 96);
  const rg = g.createRadialGradient(32, 52, 4, 32, 52, 60);
  rg.addColorStop(0, '#ffedbe'); rg.addColorStop(0.65, '#eaa94e'); rg.addColorStop(1, '#b06a28');
  g.fillStyle = rg;
  g.beginPath(); g.moveTo(8, 90); g.lineTo(8, 34); g.quadraticCurveTo(32, 2, 56, 34);
  g.lineTo(56, 90); g.closePath(); g.fill();
  g.fillStyle = '#2c2416'; g.fillRect(29, 10, 6, 80);
});
const clockTex = makeTex(128, 128, g => {
  g.fillStyle = '#20242f'; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#f7ecd2'; g.beginPath(); g.arc(64, 64, 55, 0, 7); g.fill();
  g.strokeStyle = '#4a3c28'; g.lineWidth = 5;
  g.beginPath(); g.arc(64, 64, 53, 0, 7); g.stroke();
  g.strokeStyle = '#332a1c'; g.lineWidth = 3;
  for (let i = 0; i < 12; i++){
    const a = i / 12 * Math.PI * 2;
    g.beginPath(); g.moveTo(64 + Math.cos(a) * 40, 64 + Math.sin(a) * 40);
    g.lineTo(64 + Math.cos(a) * 48, 64 + Math.sin(a) * 48); g.stroke();
  }
  g.fillStyle = '#332a1c'; g.beginPath(); g.arc(64, 64, 4, 0, 7); g.fill();
});
const glowTex = makeTex(128, 128, g => {
  const rg = g.createRadialGradient(64, 64, 2, 64, 64, 64);
  rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(0.3, 'rgba(255,255,255,0.35)');
  rg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
});
const flakeTex = makeTex(32, 32, g => {
  const rg = g.createRadialGradient(16, 16, 1, 16, 16, 15);
  rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(0.5, 'rgba(255,255,255,0.7)');
  rg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 32, 32);
});
const smokeTex = makeTex(64, 64, g => {
  const rg = g.createRadialGradient(32, 32, 2, 32, 32, 31);
  rg.addColorStop(0, 'rgba(226,231,242,0.85)'); rg.addColorStop(0.6, 'rgba(226,231,242,0.3)');
  rg.addColorStop(1, 'rgba(226,231,242,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 64, 64);
});
const skyTex = makeTex(16, 256, g => {
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#0d1230'); gr.addColorStop(0.4, '#2a3158');
  gr.addColorStop(0.5, '#6b5476'); gr.addColorStop(0.55, '#c08a6d');
  gr.addColorStop(0.6, '#6b5476'); gr.addColorStop(1, '#2a3158');
  g.fillStyle = gr; g.fillRect(0, 0, 16, 256);
});

// ================================================================
// 4. MATERIALS
// ================================================================
const matGround   = new THREE.MeshStandardMaterial({ color: PAL.snow, map: snowTex, roughness: 0.97 });
const matSnowCap  = new THREE.MeshStandardMaterial({ color: PAL.snow, roughness: 0.9 });
const matTimber   = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.85 });
const matTimberDk = new THREE.MeshStandardMaterial({ map: woodTex, color: 0x8a7058, roughness: 0.85 });
const matRoof     = new THREE.MeshStandardMaterial({ map: woodTex, color: PAL.roof, roughness: 0.9 });
const matStone    = new THREE.MeshStandardMaterial({ color: PAL.stone, roughness: 0.95 });
const matPlaster  = new THREE.MeshStandardMaterial({ color: PAL.plaster, roughness: 0.85 });
const matIron     = new THREE.MeshStandardMaterial({ color: PAL.iron, roughness: 0.6, metalness: 0.4 });
const matWindow   = new THREE.MeshStandardMaterial({ map: winTex, emissive: PAL.amber, emissiveMap: winTex, emissiveIntensity: 1.7, roughness: 0.5 });
const matArchWin  = new THREE.MeshStandardMaterial({ map: archWinTex, emissive: PAL.amber, emissiveMap: archWinTex, emissiveIntensity: 1.5, roughness: 0.5 });
const matClock    = new THREE.MeshStandardMaterial({ map: clockTex, emissive: 0xfff2cc, emissiveMap: clockTex, emissiveIntensity: 0.9, roughness: 0.5 });
const matDoor     = new THREE.MeshStandardMaterial({ map: woodTex, color: 0x6a4a2e, roughness: 0.8 });
const matSpruce   = new THREE.MeshStandardMaterial({ color: PAL.spruce, roughness: 0.9 });
const matTrunk    = new THREE.MeshStandardMaterial({ color: PAL.trunk, roughness: 0.95 });
const matIce      = new THREE.MeshStandardMaterial({ map: pondTex, roughness: 0.14, metalness: 0.06, emissive: 0x14243a, emissiveIntensity: 0.2 });
const matLane     = new THREE.MeshStandardMaterial({ map: laneTex, roughness: 0.95 });
const matRed      = new THREE.MeshStandardMaterial({ color: PAL.red, roughness: 0.55 });
const matGold     = new THREE.MeshStandardMaterial({ color: PAL.gold, roughness: 0.4, metalness: 0.35 });
const matHorse    = new THREE.MeshStandardMaterial({ color: PAL.horse, roughness: 0.8 });
const matSpire    = new THREE.MeshStandardMaterial({ color: PAL.spire, roughness: 0.7 });
const matDarkWood = new THREE.MeshStandardMaterial({ color: PAL.timberDark, roughness: 0.85 });

// ================================================================
// 5. BUILDER FUNCTIONS
// ================================================================
function houseGeo(w, d, wallH, peakH){
  const s = new THREE.Shape();
  s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(w / 2, wallH);
  s.lineTo(0, wallH + peakH); s.lineTo(-w / 2, wallH); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: false });
  g.translate(0, 0, -d / 2);
  return g;
}
function addGableRoof(parent, w, d, wallH, peakH){
  const A = Math.atan2(peakH, w / 2);
  const slope = Math.hypot(peakH, w / 2) + 0.55;
  for (const s of [-1, 1]){
    const cx = s * w / 4, cy = wallH + peakH / 2;
    const nx = s * Math.sin(A), ny = Math.cos(A);
    const slab = mesh(new THREE.BoxGeometry(slope, 0.16, d + 0.8), matRoof, cx + nx * 0.1, cy + ny * 0.1, 0);
    slab.rotation.z = -s * A; parent.add(slab);
    const cap = mesh(new THREE.BoxGeometry(slope * 0.98, 0.22, d + 0.85), matSnowCap, cx + nx * 0.31, cy + ny * 0.31, 0);
    cap.rotation.z = -s * A; parent.add(cap);
  }
  const ridge = mesh(new THREE.CylinderGeometry(0.24, 0.24, d + 0.85, 10), matSnowCap, 0, wallH + peakH + 0.36, 0);
  ridge.rotation.x = Math.PI / 2; parent.add(ridge);
}
function buildChalet(w, d, wallH, peakH, balcony){
  const g = new THREE.Group();
  g.add(mesh(new THREE.BoxGeometry(w + 0.35, 0.7, d + 0.35), matStone, 0, 0.35, 0));
  g.add(new THREE.Mesh(houseGeo(w, d, wallH, peakH), matTimber));
  addGableRoof(g, w, d, wallH, peakH);
  const winGeo = new THREE.PlaneGeometry(0.8, 1.0);
  const rows = wallH > 4 ? [1.9, wallH - 1.0] : [1.9];
  const nF = 2, nS = 2;
  rows.forEach((y, ri) => {
    for (let i = 0; i < nF; i++){
      const x = (i - (nF - 1) / 2) * (w / (nF + 0.6));
      if (ri === 0 && i === 0){                             // door takes this slot
        g.add(mesh(new THREE.PlaneGeometry(1.05, 1.9), matDoor, x, 1.72, d / 2 + 0.03));
        g.add(mesh(new THREE.PlaneGeometry(0.66, 0.4), matWindow, x, 2.95, d / 2 + 0.03));
        g.add(mesh(new THREE.BoxGeometry(1.35, 0.18, 0.9), matSnowCap, x, 0.75, d / 2 + 0.4));
      } else {
        g.add(mesh(winGeo, matWindow, x, y, d / 2 + 0.03));
      }
      const wb = mesh(winGeo, matWindow, x, y, -d / 2 - 0.03);
      wb.rotation.y = Math.PI; g.add(wb);
    }
    for (let i = 0; i < nS; i++){
      const z = (i - (nS - 1) / 2) * (d / (nS + 0.8));
      const wl = mesh(winGeo, matWindow, -w / 2 - 0.03, y, z); wl.rotation.y = -Math.PI / 2; g.add(wl);
      const wr = mesh(winGeo, matWindow, w / 2 + 0.03, y, z); wr.rotation.y = Math.PI / 2; g.add(wr);
    }
  });
  if (balcony){
    g.add(mesh(new THREE.BoxGeometry(w * 0.8, 0.12, 1.0), matTimberDk, 0, wallH - 1.85, d / 2 + 0.5));
    g.add(mesh(new THREE.BoxGeometry(w * 0.8, 0.07, 0.07), matTimberDk, 0, wallH - 1.15, d / 2 + 0.96));
    g.add(mesh(new THREE.BoxGeometry(w * 0.8, 0.07, 0.12), matSnowCap, 0, wallH - 1.08, d / 2 + 0.96));
    for (let i = 0; i < 6; i++){
      const bx = (i - 2.5) * (w * 0.8 / 6);
      g.add(mesh(new THREE.BoxGeometry(0.06, 0.62, 0.06), matTimberDk, bx, wallH - 1.48, d / 2 + 0.96));
    }
  }
  const chX = w * 0.22, chZ = -d * 0.18;
  g.add(mesh(new THREE.BoxGeometry(0.75, peakH + 2.0, 0.75), matStone, chX, wallH + peakH / 2 + 0.6, chZ));
  g.add(mesh(new THREE.BoxGeometry(0.95, 0.14, 0.95), matStone, chX, wallH + peakH + 1.65, chZ));
  g.add(mesh(new THREE.BoxGeometry(0.86, 0.16, 0.86), matSnowCap, chX, wallH + peakH + 1.78, chZ));
  g.userData.chimneyTop = new THREE.Vector3(chX, wallH + peakH + 1.95, chZ);
  return shadowify(g);
}
function buildChurch(){
  const g = new THREE.Group();
  g.add(mesh(new THREE.BoxGeometry(4.0, 0.6, 4.0), matStone, 0, 0.3, 0));
  g.add(mesh(new THREE.BoxGeometry(3.4, 9.5, 3.4), matPlaster, 0, 4.75, 0));
  g.add(mesh(new THREE.BoxGeometry(3.9, 1.5, 3.9), matDarkWood, 0, 10.25, 0));
  g.add(mesh(new THREE.ConeGeometry(2.6, 8.5, 8), matSpire, 0, 15.25, 0));
  g.add(mesh(new THREE.ConeGeometry(2.78, 0.95, 8), matSnowCap, 0, 11.45, 0));
  g.add(mesh(new THREE.ConeGeometry(0.72, 1.35, 8), matSnowCap, 0, 18.6, 0));
  g.add(mesh(new THREE.SphereGeometry(0.17, 10, 8), matGold, 0, 19.6, 0));
  g.add(mesh(new THREE.BoxGeometry(0.06, 0.7, 0.06), matGold, 0, 20.05, 0));
  g.add(mesh(new THREE.BoxGeometry(0.4, 0.06, 0.06), matGold, 0, 20.14, 0));
  const clockGeo = new THREE.CircleGeometry(1.05, 26);
  g.add(mesh(clockGeo, matClock, 0, 8.3, 1.72));
  const cl = mesh(clockGeo, matClock, -1.72, 8.3, 0); cl.rotation.y = -Math.PI / 2; g.add(cl);
  const cr = mesh(clockGeo, matClock, 1.72, 8.3, 0); cr.rotation.y = Math.PI / 2; g.add(cr);
  const hourHand = new THREE.Group(); hourHand.position.set(0, 8.3, 1.76);
  hourHand.add(mesh(new THREE.BoxGeometry(0.07, 0.52, 0.02), matIron, 0, 0.22, 0));
  hourHand.rotation.z = -2.1; g.add(hourHand);
  const minuteHand = new THREE.Group(); minuteHand.position.set(0, 8.3, 1.78);
  minuteHand.add(mesh(new THREE.BoxGeometry(0.05, 0.78, 0.02), matIron, 0, 0.34, 0));
  g.add(minuteHand); g.userData.minuteHand = minuteHand;
  g.add(mesh(new THREE.PlaneGeometry(1.35, 2.4), matDoor, 0, 1.85, 1.72));
  g.add(mesh(new THREE.PlaneGeometry(0.9, 1.25), matArchWin, 0, 4.4, 1.72));
  const nave = new THREE.Group(); nave.position.z = -6.2;
  nave.add(new THREE.Mesh(houseGeo(6.5, 9, 4.4, 2.6), matPlaster));
  addGableRoof(nave, 6.5, 9, 4.4, 2.6);
  const aGeo = new THREE.PlaneGeometry(0.72, 1.5);
  for (const z of [-3.0, 0, 3.0]){
    const wl = mesh(aGeo, matArchWin, -3.28, 2.5, z); wl.rotation.y = -Math.PI / 2; nave.add(wl);
    const wrr = mesh(aGeo, matArchWin, 3.28, 2.5, z); wrr.rotation.y = Math.PI / 2; nave.add(wrr);
  }
  g.add(nave);
  g.userData.chimneyTop = null;
  return shadowify(g);
}
function plantPines(spots){
  spots = spots.filter(([x, z]) => !(Math.abs(x) < 6.5 && z > -46 && z < 44) &&
    Math.hypot(x - 19, z + 13) > 10.5);
  const n = spots.length;
  const trunkIM = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.22, 0.32, 1.8, 7), matTrunk, n);
  const greenIM = new THREE.InstancedMesh(new THREE.ConeGeometry(1, 1, 8), matSpruce, n * 3);
  const snowIM  = new THREE.InstancedMesh(new THREE.ConeGeometry(1, 1, 8), matSnowCap, n * 3);
  const d = new THREE.Object3D();
  spots.forEach(([x, z, s], i) => {
    const y = groundH(x, z);
    d.rotation.set(0, rr(0, Math.PI * 2), 0);
    d.position.set(x, y + 0.9 * s, z); d.scale.set(s, s, s); d.updateMatrix();
    trunkIM.setMatrixAt(i, d.matrix);
    d.rotation.set(0, 0, 0);
    for (let L = 0; L < 3; L++){
      const r = (2.15 - 0.58 * L) * s, h = 2.5 * s;
      const ly = y + (1.35 + 1.32 * L) * s + h / 2;
      d.position.set(x, ly, z); d.scale.set(r, h, r); d.updateMatrix();
      greenIM.setMatrixAt(i * 3 + L, d.matrix);
      d.position.set(x, ly + h * 0.3, z); d.scale.set(r * 0.82, h * 0.42, r * 0.82); d.updateMatrix();
      snowIM.setMatrixAt(i * 3 + L, d.matrix);
    }
  });
  for (const im of [trunkIM, greenIM, snowIM]){
    im.instanceMatrix.needsUpdate = true; im.castShadow = true; im.receiveShadow = true;
    scene.add(im);
  }
}
const logXf = [];
function addWoodStack(x, z, ry){
  const rows = [5, 4, 3, 2];
  rows.forEach((cnt, r) => {
    for (let i = 0; i < cnt; i++) logXf.push([x, z, ry, (i - (cnt - 1) / 2) * 0.34, 0.17 + r * 0.29, rr(-0.07, 0.07)]);
  });
  const cap = mesh(new THREE.BoxGeometry(1.95, 0.16, 1.7), matSnowCap, x, 1.32, z);
  cap.rotation.y = ry; scene.add(shadowify(cap));
}
function commitWoodStacks(){
  const im = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.15, 0.15, 1.55, 8), matTimberDk, logXf.length);
  const dm = new THREE.Object3D(), base = new THREE.Matrix4(), out = new THREE.Matrix4();
  logXf.forEach(([x, z, ry, lx, ly, jz], i) => {
    dm.position.set(lx, ly, jz); dm.rotation.set(Math.PI / 2, 0, 0); dm.updateMatrix();
    base.makeRotationY(ry).setPosition(x, 0, z);
    out.multiplyMatrices(base, dm.matrix);
    im.setMatrixAt(i, out);
  });
  im.instanceMatrix.needsUpdate = true; im.castShadow = true; im.receiveShadow = true;
  scene.add(im);
}
function buildLantern(withLight){

  g.add(mesh(new THREE.BoxGeometry(0.34, 0.42, 0.34), lampMat, 0, 3.4, 0));
  g.add(mesh(new THREE.BoxGeometry(0.42, 0.05, 0.42), matIron, 0, 3.16, 0));

}

function buildFence(x1, z1, x2, z2, posts){
  const g = new THREE.Group();
  const dx = x2 - x1, dz = z2 - z1, len = Math.hypot(dx, dz), ang = Math.atan2(dx, dz);
  for (let i = 0; i < posts; i++){
    const t = i / (posts - 1);
    const p = mesh(new THREE.BoxGeometry(0.13, 0.95, 0.13), matTimberDk, x1 + dx * t, 0.47, z1 + dz * t);
    g.add(p);
    g.add(mesh(new THREE.BoxGeometry(0.16, 0.09, 0.16), matSnowCap, x1 + dx * t, 0.98, z1 + dz * t));
  }
  for (const ry of [0.38, 0.72]){
    const rail = mesh(new THREE.BoxGeometry(0.07, 0.09, len), matTimberDk, x1 + dx / 2, ry, z1 + dz / 2);
    rail.rotation.y = ang; g.add(rail);
  }
  return shadowify(g);
}
function buildBench(){
  const g = new THREE.Group();
  g.add(mesh(new THREE.BoxGeometry(1.5, 0.09, 0.45), matTimberDk, 0, 0.45, 0));
  g.add(mesh(new THREE.BoxGeometry(1.5, 0.09, 0.5), matSnowCap, 0, 0.53, 0));
  for (const sx of [-0.6, 0.6]) g.add(mesh(new THREE.BoxGeometry(0.12, 0.45, 0.4), matTimberDk, sx, 0.22, 0));

const bumps = [];
for (let i = 0; i < 42; i++) bumps.push([rr(-95, 95), rr(-95, 95), rr(7, 20), rr(0.5, 2.2)]);
function groundH(x, z){
  let h = 0;
  for (const b of bumps){
    const dx = x - b[0], dz = z - b[1];
    h += b[3] * Math.exp(-(dx * dx + dz * dz) / (2 * b[2] * b[2]));
  }
  return h * THREE.MathUtils.smoothstep(Math.hypot(x, z), 34, 58);
}

// ================================================================
// 8. ATMOSPHERE - falling snow & chimney smoke particles
// ================================================================
const SNOW_N = 950, SNOW_H = 46;
const snowX0 = [], snowY0 = [], snowZ0 = [], snowSp = [], snowPh = [];
const snowArr = new Float32Array(SNOW_N * 3);
for (let i = 0; i < SNOW_N; i++){
  snowX0.push(rr(-68, 68)); snowY0.push(rr(0, SNOW_H)); snowZ0.push(rr(-68, 68));
  snowSp.push(rr(1.5, 3.4)); snowPh.push(rr(0, Math.PI * 2));
  snowArr[i * 3] = snowX0[i]; snowArr[i * 3 + 1] = snowY0[i]; snowArr[i * 3 + 2] = snowZ0[i];
}
const snowGeo = new THREE.BufferGeometry();
snowGeo.setAttribute('position', new THREE.BufferAttribute(snowArr, 3).setUsage(THREE.DynamicDrawUsage));
const snowPts = new THREE.Points(snowGeo, new THREE.PointsMaterial({ map: flakeTex, color: 0xffffff, size: 0.42, transparent: true, opacity: 0.95, depthWrite: false }));

const smokeOrigins = [];
for (const c of chalets){
  const v = c.userData.chimneyTop.clone();
  c.localToWorld(v); smokeOrigins.push(v);
}
const SMK_PER = 24, SMK_N = smokeOrigins.length * SMK_PER;
const smkO = [], smkPh = [], smkSp = [];
const smkArr = new Float32Array(SMK_N * 3);
for (let i = 0; i < SMK_N; i++){
  smkO.push(smokeOrigins[Math.floor(i / SMK_PER)]);
  smkPh.push(rr(0, 1)); smkSp.push(rr(0.08, 0.16));
}
const smkGeo = new THREE.BufferGeometry();
smkGeo.setAttribute('position', new THREE.BufferAttribute(smkArr, 3).setUsage(THREE.DynamicDrawUsage));
const smkPts = new THREE.Points(smkGeo, new THREE.PointsMaterial({ map: smokeTex, color: 0xb9c2d6, size: 2.1, transparent: true, opacity: 0.32, depthWrite: false }));
scene.add(smkPts);

// ================================================================
// 9. ANIMATION LOOP
// ================================================================
const clockT = new THREE.Clock();
function tick(){
  const t = clockT.getElapsedTime();
  controls.update();
  // drifting snowfall
  const sp = snowGeo.attributes.position;
  for (let i = 0; i < SNOW_N; i++){
    let y = (snowY0[i] - t * snowSp[i]) % SNOW_H;
    if (y < 0) y += SNOW_H;
    sp.array[i * 3] = snowX0[i] + Math.sin(t * 0.55 + snowPh[i]) * 1.7;
    sp.array[i * 3 + 1] = y + 0.25;
  }
  sp.needsUpdate = true;
  // rising chimney smoke
  const mp = smkGeo.attributes.position;
  for (let i = 0; i < SMK_N; i++){
    const o = smkO[i], k = (t * smkSp[i] + smkPh[i]) % 1;
    const wob = Math.sin(t * 0.8 + smkPh[i] * 40) * 0.28 * (0.25 + k);
    mp.array[i * 3] = o.x + wob + k * 2.0;
    mp.array[i * 3 + 1] = o.y + k * 7.5;
    mp.array[i * 3 + 2] = o.z + Math.cos(t * 0.6 + smkPh[i] * 30) * 0.2 + k * 0.9;
  }
  mp.needsUpdate = true;
  // lantern flicker + halos
  for (const L of lanterns){
    const v = 0.74 + 0.18 * Math.sin(t * 6.3 + L.ph) + 0.08 * Math.sin(t * 11.7 + L.ph * 1.7);
    L.mat.emissiveIntensity = 1.9 * v;
    L.halo.opacity = 0.55 * v;
    if (L.light) L.light.intensity = 8 * v;
  }
  // church clock, horse, sleigh micro-motion, pond sheen
  minuteHand.rotation.z = -t * 0.06;
  sleigh.userData.head.rotation.x = Math.sin(t * 1.1) * 0.07;
  sleigh.rotation.z = Math.sin(t * 0.8) * 0.004;
  matIce.emissiveIntensity = 0.18 + 0.06 * Math.sin(t * 0.7);
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(tick);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
