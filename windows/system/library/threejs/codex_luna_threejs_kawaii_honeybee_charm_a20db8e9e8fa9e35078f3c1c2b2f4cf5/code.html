<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kawaii Honeybee</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff4d9; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfff4d9);
scene.fog = new THREE.Fog(0xfff4d9, 8, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.2, 3.5, 7.6);
camera.lookAt(0, 1.35, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.15;
controls.minDistance = 4.5;
controls.maxDistance = 12;
controls.target.set(0, 1.35, 0);

scene.add(new THREE.HemisphereLight(0xfff8e8, 0x9b6d4f, 2.2));

const keyLight = new THREE.DirectionalLight(0xfff3cf, 4.1);
keyLight.position.set(-4, 8, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xffb7a1, 1.4, 9);
fillLight.position.set(4, 2.5, 4);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xbdeaff, 2, 8);
rimLight.position.set(-3, 4, -4);
scene.add(rimLight);

const bee = new THREE.Group();
bee.position.y = 0.08;
scene.add(bee);

const yellow = new THREE.MeshStandardMaterial({
  color: 0xf6c942,
  roughness: 0.34,
  metalness: 0.02
});
const yellowLight = new THREE.MeshStandardMaterial({
  color: 0xffdb62,
  roughness: 0.3
});
const matteBlack = new THREE.MeshStandardMaterial({
  color: 0x17151b,
  roughness: 0.78,
  metalness: 0
});
const glossyBlack = new THREE.MeshPhysicalMaterial({
  color: 0x08090d,
  roughness: 0.12,
  metalness: 0.05,
  clearcoat: 0.9,
  clearcoatRoughness: 0.08
});
const blushMat = new THREE.MeshStandardMaterial({
  color: 0xf28b9a,
  roughness: 0.48
});
const heartMat = new THREE.MeshStandardMaterial({
  color: 0xff7894,
  roughness: 0.3,
  metalness: 0.02
});
const wingMat = new THREE.MeshPhysicalMaterial({
  color: 0xbde9ec,
  roughness: 0.18,
  metalness: 0,
  transmission: 0.15,
  thickness: 0.3,
  transparent: true,
  opacity: 0.58,
  side: THREE.DoubleSide,
  depthWrite: false
});
const wingPinkMat = new THREE.MeshPhysicalMaterial({
  color: 0xf8c9d7,
  roughness: 0.18,
  transmission: 0.12,
  thickness: 0.25,
  transparent: true,
  opacity: 0.5,
  side: THREE.DoubleSide,
  depthWrite: false
});

function smoothSphere(name, position, scale, material, segments = 48) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, segments, segments), material);
  mesh.name = name;
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  bee.add(mesh);
  return mesh;
}

function addTorus(position, scale, material) {
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(0.7, 0.17, 24, 64), material);
  mesh.position.copy(position);
  mesh.rotation.y = Math.PI / 2;
  mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  bee.add(mesh);
  return mesh;
}

function cylinderBetween(a, b, radius, material) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius * 0.92, direction.length(), 24),
    material
  );
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  bee.add(mesh);
  return mesh;
}

function makeHeart() {
  const shape = new THREE.Shape();
  shape.moveTo(0, -0.22);
  shape.bezierCurveTo(-0.42, 0.1, -0.43, 0.42, -0.18, 0.48);
  shape.bezierCurveTo(-0.03, 0.52, 0.08, 0.4, 0, 0.25);
  shape.bezierCurveTo(0.08, 0.4, 0.25, 0.52, 0.4, 0.42);
  shape.bezierCurveTo(0.62, 0.28, 0.38, -0.02, 0, -0.22);
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.08,
    bevelEnabled: true,
    bevelSegments: 3,
    bevelSize: 0.035,
    bevelThickness: 0.025
  });
  geometry.center();
  return geometry;
}

function makeWingShape() {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(0.55, 0.08, 1.0, 0.52, 0.9, 1.18);
  shape.bezierCurveTo(0.82, 1.62, 0.27, 1.72, -0.03, 1.42);
  shape.bezierCurveTo(-0.3, 1.15, -0.28, 0.42, 0, 0);
  return new THREE.ShapeGeometry(shape, 32);
}

function addWing(position, rotation, material, scaleX) {
  const wing = new THREE.Mesh(makeWingShape(), material);
  wing.position.copy(position);
  wing.rotation.set(rotation.x, rotation.y, rotation.z);
  wing.scale.set(scaleX, 1, 1);
  wing.renderOrder = 3;
  bee.add(wing);
  return wing;
}

const body = smoothSphere("rounded jellybean body", new THREE.Vector3(0.25, 1.42, 0), new THREE.Vector3(1.62, 0.94, 0.82), yellow, 64);
body.rotation.z = -0.035;

smoothSphere("head", new THREE.Vector3(-1.12, 1.58, 0.08), new THREE.Vector3(1.03, 1.04, 0.94), yellowLight, 64);

addTorus(new THREE.Vector3(-0.02, 1.43, 0), new THREE.Vector3(1, 1.01, 0.96), matteBlack);
addTorus(new THREE.Vector3(0.82, 1.43, 0), new THREE.Vector3(0.92, 0.97, 0.92), matteBlack);

smoothSphere("tail tip", new THREE.Vector3(1.68, 1.43, 0), new THREE.Vector3(0.34, 0.5, 0.46), matteBlack, 40);

const eyeLeft = smoothSphere("left bead eye", new THREE.Vector3(-1.42, 1.84, 0.83), new THREE.Vector3(0.205, 0.27, 0.13), glossyBlack, 40);
const eyeRight = smoothSphere("right bead eye", new THREE.Vector3(-0.87, 1.84, 0.86), new THREE.Vector3(0.205, 0.27, 0.13), glossyBlack, 40);

const eyeSparkle = new THREE.MeshBasicMaterial({ color: 0xffffff });
smoothSphere("eye sparkle left", new THREE.Vector3(-1.49, 1.94, 0.955), new THREE.Vector3(0.052, 0.065, 0.025), eyeSparkle, 20);
smoothSphere("eye sparkle right", new THREE.Vector3(-0.94, 1.94, 0.985), new THREE.Vector3(0.052, 0.065, 0.025), eyeSparkle, 20);

const cheekL = smoothSphere("left blush", new THREE.Vector3(-1.64, 1.36, 0.84), new THREE.Vector3(0.22, 0.095, 0.035), blushMat, 32);
cheekL.rotation.z = -0.18;
const cheekR = smoothSphere("right blush", new THREE.Vector3(-0.65, 1.36, 0.86), new THREE.Vector3(0.22, 0.095, 0.035), blushMat, 32);
cheekR.rotation.z = 0.18;

const smileCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-1.29, 1.51, 0.94),
  new THREE.Vector3(-1.17, 1.42, 0.985),
  new THREE.Vector3(-1.03, 1.51, 0.98)
]);
const smile = new THREE.Mesh(new THREE.TubeGeometry(smileCurve, 16, 0.035, 12, false), matteBlack);
smile.castShadow = true;
bee.add(smile);

const antennaMat = new THREE.MeshStandardMaterial({ color: 0x282027, roughness: 0.52 });
function addAntenna(x, lean) {
  const base = new THREE.Vector3(x, 2.36, 0.12);
  const mid = new THREE.Vector3(x + lean * 0.12, 2.7, 0.1);
  const tip = new THREE.Vector3(x + lean * 0.32, 2.92, 0.12);
  const curve = new THREE.CatmullRomCurve3([base, mid, tip]);
  const stem = new THREE.Mesh(new THREE.TubeGeometry(curve, 20, 0.045, 12, false), antennaMat);
  stem.castShadow = true;
  bee.add(stem);
  const heart = new THREE.Mesh(makeHeart(), heartMat);
  heart.position.copy(tip);
  heart.scale.setScalar(0.22);
  heart.rotation.z = lean * 0.2;
  heart.castShadow = true;
  bee.add(heart);
}
addAntenna(-1.48, -1);
addAntenna(-0.75, 1);

addWing(new THREE.Vector3(-0.55, 1.88, -0.52), new THREE.Euler(-0.12, 0.08, -0.18), wingPinkMat, 1.0);
addWing(new THREE.Vector3(-0.43, 1.88, -0.5), new THREE.Euler(-0.15, 0.04, 0.18), wingMat, -1.0);
addWing(new THREE.Vector3(0.42, 1.86, -0.48), new THREE.Euler(-0.18, 0.02, -0.3), wingMat, 0.86);
addWing(new THREE.Vector3(0.52, 1.86, -0.45), new THREE.Euler(-0.16, -0.03, 0.3), wingPinkMat, -0.86);

const legPairs = [
  [-0.82, -0.72, -0.53, 0.39],
  [0.12, -0.73, 0.51, 0.39],
  [0.98, -0.63, 0.48, 0.39]
];

for (const [x, y, z, footZ] of legPairs) {
  const leftStart = new THREE.Vector3(x, y, -0.42);
  const leftEnd = new THREE.Vector3(x - 0.06, y - 0.19, -0.62);
  const rightStart = new THREE.Vector3(x, y, 0.42);
  const rightEnd = new THREE.Vector3(x + 0.06, y - 0.19, 0.62);
  cylinderBetween(leftStart, leftEnd, 0.105, matteBlack);
  cylinderBetween(rightStart, rightEnd, 0.105, matteBlack);
  smoothSphere("left foot", leftEnd.add(new THREE.Vector3(0, -0.05, -0.03)), new THREE.Vector3(0.22, 0.16, 0.15), matteBlack, 28);
  smoothSphere("right foot", rightEnd.add(new THREE.Vector3(0, -0.05, 0.03)), new THREE.Vector3(0.22, 0.16, 0.15), matteBlack, 28);
}

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(8, 96),
  new THREE.MeshStandardMaterial({ color: 0xffedc4, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

const shadowDisc = new THREE.Mesh(
  new THREE.CircleGeometry(1.9, 64),
  new THREE.MeshBasicMaterial({ color: 0xd59e72, transparent: true, opacity: 0.12 })
);
shadowDisc.rotation.x = -Math.PI / 2;
shadowDisc.scale.set(1.5, 0.56, 1);
shadowDisc.position.set(0.1, 0.006, 0);
scene.add(shadowDisc);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
