<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Origami Sailboat</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(180deg, #dcefff 0%, #f8fbff 70%, #d4e5f1 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdcefff, 12, 25);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(7.2, 5.3, 8.2);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 5;
controls.maxDistance = 14;
controls.target.set(0, 1.45, 0);

const hemi = new THREE.HemisphereLight(0xf4fbff, 0x7192a8, 2.2);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 4.5);
key.position.set(-5, 9, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 9;
key.shadow.camera.bottom = -5;
key.shadow.bias = -0.0002;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8bc9ef, 1.5);
fill.position.set(5, 3, -6);
scene.add(fill);

const boat = new THREE.Group();
boat.rotation.y = -0.12;
scene.add(boat);

const paperMaterial = new THREE.MeshStandardMaterial({
  vertexColors: true,
  side: THREE.DoubleSide,
  roughness: 0.72,
  metalness: 0,
  flatShading: true
});

const creaseMaterial = new THREE.LineBasicMaterial({
  color: 0x527e9b,
  transparent: true,
  opacity: 0.52
});

const darkCreaseMaterial = new THREE.LineBasicMaterial({
  color: 0x345c75,
  transparent: true,
  opacity: 0.72
});

function colorArray(value) {
  const color = new THREE.Color(value);
  return [color.r, color.g, color.b];
}

function makePanel(a, b, c, ca, cb, cc) {
  const geometry = new THREE.BufferGeometry();
  const positions = [
    a.x, a.y, a.z,
    b.x, b.y, b.z,
    c.x, c.y, c.z
  ];
  const colors = [
    ...colorArray(ca),
    ...colorArray(cb),
    ...colorArray(cc)
  ];
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, paperMaterial);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  boat.add(mesh);
  return mesh;
}

function makeFold(a, b, material = creaseMaterial) {
  const geometry = new THREE.BufferGeometry().setFromPoints([a, b]);
  const line = new THREE.Line(geometry, material);
  boat.add(line);
  return line;
}

function makeRod(a, b, radius, material) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const midpoint = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
  const geometry = new THREE.CylinderGeometry(radius, radius, direction.length(), 10);
  const rod = new THREE.Mesh(geometry, material);
  rod.position.copy(midpoint);
  rod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  rod.castShadow = true;
  boat.add(rod);
  return rod;
}

const white = 0xfafcff;
const blue = 0x8fc9e7;
const paleBlue = 0xc7e7f5;
const skyBlue = 0x5ba5ce;
const shadowBlue = 0x729fba;

const bow = new THREE.Vector3(0, 0.66, -2.72);
const portBow = new THREE.Vector3(-0.02, 0.56, -2.55);
const starBow = new THREE.Vector3(0.02, 0.56, -2.55);
const portShoulder = new THREE.Vector3(-1.48, 0.58, -1.05);
const starShoulder = new THREE.Vector3(1.48, 0.58, -1.05);
const portStern = new THREE.Vector3(-1.62, 0.6, 1.95);
const starStern = new THREE.Vector3(1.62, 0.6, 1.95);
const keelBow = new THREE.Vector3(0, -0.42, -2.28);
const keelMid = new THREE.Vector3(0, -0.52, -0.45);
const keelStern = new THREE.Vector3(0, -0.34, 1.78);

makePanel(bow, portShoulder, keelBow, white, paleBlue, shadowBlue);
makePanel(bow, keelBow, starShoulder, white, shadowBlue, blue);
makePanel(portShoulder, portStern, keelMid, paleBlue, white, shadowBlue);
makePanel(portShoulder, keelMid, keelBow, paleBlue, shadowBlue, blue);
makePanel(starShoulder, keelBow, keelMid, blue, shadowBlue, skyBlue);
makePanel(starShoulder, keelMid, starStern, blue, shadowBlue, paleBlue);
makePanel(portStern, starStern, keelStern, white, paleBlue, shadowBlue);
makePanel(portStern, keelStern, keelMid, paleBlue, shadowBlue, blue);
makePanel(keelMid, keelStern, starStern, shadowBlue, blue, paleBlue);

const floorLeft = new THREE.Vector3(-1.18, 0.18, 0.72);
const floorRight = new THREE.Vector3(1.18, 0.18, 0.72);
const floorFront = new THREE.Vector3(0, 0.35, -1.16);
makePanel(floorFront, floorLeft, floorRight, white, paleBlue, blue);
makeFold(floorFront, floorLeft, darkCreaseMaterial);
makeFold(floorFront, floorRight, darkCreaseMaterial);

makeFold(bow, keelBow, darkCreaseMaterial);
makeFold(keelBow, keelMid, creaseMaterial);
makeFold(keelMid, keelStern, darkCreaseMaterial);
makeFold(portShoulder, keelMid, creaseMaterial);
makeFold(starShoulder, keelMid, creaseMaterial);
makeFold(portStern, keelStern, creaseMaterial);
makeFold(starStern, keelStern, creaseMaterial);
makeFold(portShoulder, portStern, creaseMaterial);
makeFold(starShoulder, starStern, creaseMaterial);
makeFold(portBow, keelBow, creaseMaterial);
makeFold(starBow, keelBow, creaseMaterial);

const mastBase = new THREE.Vector3(0, 0.25, 0.02);
const mastTop = new THREE.Vector3(0, 4.58, 0.02);
const sailTip = new THREE.Vector3(2.62, 1.44, -0.02);
const sailMid = new THREE.Vector3(1.02, 2.25, 0.34);
const sailLow = new THREE.Vector3(1.28, 1.18, 0.2);
const sailFoot = new THREE.Vector3(0, 0.72, 0.02);

makePanel(mastTop, sailMid, sailTip, white, paleBlue, blue);
makePanel(mastTop, sailFoot, sailMid, white, skyBlue, paleBlue);
makePanel(sailFoot, sailTip, sailMid, paleBlue, blue, shadowBlue);
makePanel(sailTip, sailFoot, mastTop, blue, white, paleBlue);

makeFold(mastTop, sailMid, darkCreaseMaterial);
makeFold(sailMid, sailTip, creaseMaterial);
makeFold(sailMid, sailFoot, darkCreaseMaterial);
makeFold(sailFoot, sailTip, creaseMaterial);
makeFold(mastTop, sailTip, creaseMaterial);

const woodMaterial = new THREE.MeshStandardMaterial({
  color: 0x34586d,
  roughness: 0.6,
  metalness: 0.05
});
const mast = makeRod(mastBase, mastTop, 0.045, woodMaterial);
mast.castShadow = true;

const boomStart = new THREE.Vector3(-0.03, 1.08, 0.02);
const boomEnd = new THREE.Vector3(2.58, 1.43, -0.02);
makeRod(boomStart, boomEnd, 0.035, woodMaterial);

const knotGeometry = new THREE.SphereGeometry(0.08, 12, 8);
const knot = new THREE.Mesh(knotGeometry, woodMaterial);
knot.position.copy(mastBase);
knot.castShadow = true;
boat.add(knot);

const waterMaterial = new THREE.MeshStandardMaterial({
  color: 0xb8d8e6,
  transparent: true,
  opacity: 0.24,
  roughness: 0.35,
  metalness: 0
});
const water = new THREE.Mesh(new THREE.CircleGeometry(5.8, 96), waterMaterial);
water.rotation.x = -Math.PI / 2;
water.position.y = -0.76;
water.receiveShadow = true;
scene.add(water);

const shadowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.ShadowMaterial({ color: 0x416b80, opacity: 0.16 })
);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.position.y = -0.78;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.addEventListener("resize", resize);
animate();
</script>
</body>
</html>
