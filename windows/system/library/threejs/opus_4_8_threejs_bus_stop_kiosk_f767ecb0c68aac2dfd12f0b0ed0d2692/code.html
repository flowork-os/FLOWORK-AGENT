<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Glass-and-Metal Bus-Stop Kiosk</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9dcdf; }
  #app { position: fixed; inset: 0; }
</style>

<!-- three.js + OrbitControls via ES-module importmap (jsDelivr CDN, three@0.160.0) -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =============================================================
   RENDERER  — antialias, ACES tone mapping, sRGB, soft shadows
   ============================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

/* =============================================================
   SCENE + CAMERA
   ============================================================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdadde1); // neutral studio backdrop

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);

/* =============================================================
   LIGHTING — hemisphere fill + directional key (shadows) + fill
   ============================================================= */
const hemi = new THREE.HemisphereLight(0xf4f8ff, 0x8a8478, 0.75);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
keyLight.position.set(6, 9, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 40;
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -6;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xbcd0ff, 0.55);
fillLight.position.set(-5, 4, -4);
scene.add(fillLight);

/* =============================================================
   MATERIALS  (realistic per-part color / roughness / metalness)
   ============================================================= */
const matFrame = new THREE.MeshStandardMaterial({   // slim structural metalwork
  color: 0x33383e, metalness: 0.95, roughness: 0.38
});
const matRoof = new THREE.MeshStandardMaterial({    // brushed aluminium canopy
  color: 0x9ba1a8, metalness: 0.85, roughness: 0.42
});
const matRoofUnder = new THREE.MeshStandardMaterial({
  color: 0x6d7278, metalness: 0.8, roughness: 0.55
});
const matGlass = new THREE.MeshPhysicalMaterial({   // tempered glass panels
  color: 0xcfe7ec, metalness: 0.0, roughness: 0.06,
  transmission: 0.92, thickness: 0.4, ior: 1.46,
  transparent: true, opacity: 0.5, side: THREE.DoubleSide,
  clearcoat: 0.4, clearcoatRoughness: 0.1
});
const matBench = new THREE.MeshStandardMaterial({    // slatted metal bench seat
  color: 0x55606b, metalness: 0.75, roughness: 0.5
});
const matAdFrame = new THREE.MeshStandardMaterial({  // advertising case housing
  color: 0x24272b, metalness: 0.9, roughness: 0.35
});

/* =============================================================
   DIMENSIONS (metres — real-world framing scale)
   ============================================================= */
const LEN      = 3.6;   // shelter length (X)
const DEPTH    = 1.4;   // shelter depth  (Z)
const POST_H   = 2.4;   // post height
const POST_W   = 0.08;  // post cross-section
const ROOF_TH  = 0.12;  // canopy thickness (visible)

const zBack  = -DEPTH / 2;   // back plane
const zFront =  DEPTH / 2;   // front (open) plane

const kiosk = new THREE.Group();
kiosk.name = 'BusStopKiosk';

/* helper: named box mesh with shadows */
function addBox(name, w, h, d, mat, x, y, z, parent = kiosk) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.name = name;
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* =============================================================
   1) SLIM METAL POST FRAME  (four corner posts + top rails)
   ============================================================= */
const postFrame = new THREE.Group();
postFrame.name = 'PostFrame';
kiosk.add(postFrame);

const px = LEN / 2 - POST_W;      // post X inset
const pzB = zBack + POST_W;        // back posts Z
const pzF = zFront - POST_W;       // front posts Z
const postPositions = [
  ['Post_BackLeft',   -px, pzB],
  ['Post_BackRight',   px, pzB],
  ['Post_FrontLeft',  -px, pzF],
  ['Post_FrontRight',  px, pzF],
];
postPositions.forEach(([nm, x, z]) => {
  addBox(nm, POST_W, POST_H, POST_W, matFrame, x, POST_H / 2, z, postFrame);
});

// top perimeter rails tying the posts together just under the canopy
const railY = POST_H - 0.06;
addBox('Rail_Back',  LEN, 0.09, POST_W, matFrame, 0, railY, pzB, postFrame);
addBox('Rail_Front', LEN, 0.09, POST_W, matFrame, 0, railY, pzF, postFrame);
addBox('Rail_Left',  POST_W, 0.09, DEPTH - 2 * POST_W, matFrame, -px, railY, 0, postFrame);
addBox('Rail_Right', POST_W, 0.09, DEPTH - 2 * POST_W, matFrame,  px, railY, 0, postFrame);

/* =============================================================
   2) FLAT CANTILEVERED ROOF CANOPY (with visible thickness)
   ============================================================= */
const roofGroup = new THREE.Group();
roofGroup.name = 'RoofCanopy';
kiosk.add(roofGroup);

const roofLen   = LEN + 0.5;        // overhang on the ends
const roofDepth = DEPTH + 0.7;      // cantilever forward
const roofZ     = 0.15;             // shifted forward for cantilever look
const roofY     = POST_H + ROOF_TH / 2;

addBox('Roof_Slab', roofLen, ROOF_TH, roofDepth, matRoof, 0, roofY, roofZ, roofGroup);
// thin fascia strip on the front edge for a crisp cantilever line
addBox('Roof_Fascia', roofLen, ROOF_TH * 0.55, 0.03, matRoofUnder,
       0, roofY, roofZ + roofDepth / 2, roofGroup);

/* =============================================================
   3) THREE GLASS PANELS  (back + left side + right side)
   ============================================================= */
const glassGroup = new THREE.Group();
glassGroup.name = 'GlassPanels';
kiosk.add(glassGroup);

const GLASS_T   = 0.02;
const glassH    = 1.6;
const glassY    = 0.5 + glassH / 2;   // floats above ground, sits under top rail

// back glass — long panel spanning the rear
const backGlass = addBox('Glass_Back', LEN - 2 * POST_W - 0.04, glassH, GLASS_T,
                         matGlass, 0, glassY, zBack + POST_W, glassGroup);

// side glass panels (partial depth, leaving the front open as an entry)
const sideGlassD = DEPTH - 2 * POST_W - 0.35;
const sideGlassZ = zBack + POST_W + sideGlassD / 2 + 0.02;
addBox('Glass_Left',  GLASS_T, glassH, sideGlassD, matGlass, -px, glassY, sideGlassZ, glassGroup);
addBox('Glass_Right', GLASS_T, glassH, sideGlassD, matGlass,  px, glassY, sideGlassZ, glassGroup);

// slim metal glazing gaskets framing the back glass top & bottom
addBox('Gasket_BackTop',    LEN - 2 * POST_W, 0.04, POST_W, matFrame, 0, glassY + glassH / 2, zBack + POST_W, glassGroup);
addBox('Gasket_BackBottom', LEN - 2 * POST_W, 0.04, POST_W, matFrame, 0, glassY - glassH / 2, zBack + POST_W, glassGroup);

/* =============================================================
   4) BENCH mounted along the back  (slatted seat + supports)
   ============================================================= */
const benchGroup = new THREE.Group();
benchGroup.name = 'Bench';
kiosk.add(benchGroup);

const benchLen   = LEN - 1.0;
const benchSeatY = 0.46;
const benchZ     = zBack + POST_W + 0.28;   // in front of the back glass
const slatCount  = 5;
const slatW      = 0.06;
const slatGap    = 0.02;
const benchDepth = slatCount * slatW + (slatCount - 1) * slatGap;

for (let i = 0; i < slatCount; i++) {
  const z = benchZ - benchDepth / 2 + slatW / 2 + i * (slatW + slatGap);
  addBox('Bench_Slat_' + i, benchLen, 0.035, slatW, matBench, 0, benchSeatY, z, benchGroup);
}
// two cantilever brackets mounting the bench to the back
[-benchLen / 2 + 0.35, benchLen / 2 - 0.35].forEach((x, i) => {
  addBox('Bench_Bracket_' + i, 0.05, benchSeatY, benchDepth + 0.02, matFrame,
         x, benchSeatY / 2, benchZ, benchGroup);
  // vertical stanchion connecting bracket up to the back rail
  addBox('Bench_Stanchion_' + i, 0.05, benchSeatY + 0.02, 0.05, matFrame,
         x, benchSeatY / 2, zBack + POST_W + 0.04, benchGroup);
});

/* =============================================================
   5) MOUNTED ADVERTISING SIGN PANEL  (illuminated poster case)
   Mounted on the right end of the shelter, facing outward (+X).
   ============================================================= */
const adGroup = new THREE.Group();
adGroup.name = 'AdvertisingPanel';
kiosk.add(adGroup);

const adW = 0.09;    // thickness (along X, mounted just outside right posts)
const adH = 1.95;    // poster case height
const adD = 1.05;    // width along Z
const adX = px + POST_W / 2 + adW / 2 + 0.005;  // just outside the right posts
const adY = 0.42 + adH / 2;
const adZ = 0.0;

// housing / case
addBox('Ad_Case', adW, adH, adD, matAdFrame, adX, adY, adZ, adGroup);

// procedural poster texture (CanvasTexture — no external assets)
function makePosterTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 950;
  const g = c.getContext('2d');
  // gradient background
  const grad = g.createLinearGradient(0, 0, 0, c.height);
  grad.addColorStop(0, '#1b6fb3');
  grad.addColorStop(0.55, '#2b8fd6');
  grad.addColorStop(1, '#0f3f66');
  g.fillStyle = grad;
  g.fillRect(0, 0, c.width, c.height);
  // abstract skyline strip
  g.fillStyle = 'rgba(255,255,255,0.10)';
  for (let i = 0; i < 12; i++) {
    const bw = 30 + (i * 37) % 60;
    const bh = 120 + ((i * 91) % 260);
    g.fillRect(i * 46, c.height - bh - 70, bw, bh);
  }
  // headline text
  g.fillStyle = '#ffffff';
  g.textAlign = 'center';
  g.font = 'bold 118px Arial, sans-serif';
  g.fillText('CITY', c.width / 2, 260);
  g.fillText('TRANSIT', c.width / 2, 380);
  // rule + sub text
  g.fillStyle = '#ffd24a';
  g.fillRect(90, 430, c.width - 180, 12);
  g.fillStyle = '#eaf4ff';
  g.font = 'bold 52px Arial, sans-serif';
  g.fillText('ride • connect • go', c.width / 2, 520);
  // route badge
  g.fillStyle = '#ffd24a';
  g.beginPath(); g.arc(c.width / 2, 720, 110, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#0f3f66';
  g.font = 'bold 150px Arial, sans-serif';
  g.fillText('42', c.width / 2, 772);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

const posterTex = makePosterTexture();
const matPoster = new THREE.MeshStandardMaterial({
  map: posterTex,
  emissive: 0xffffff,
  emissiveMap: posterTex,
  emissiveIntensity: 0.35,   // subtle backlit look
  roughness: 0.5,
  metalness: 0.0
});
// poster face on the outward (+X) side of the case
const poster = new THREE.Mesh(new THREE.PlaneGeometry(adD - 0.14, adH - 0.14), matPoster);
poster.name = 'Ad_Poster';
poster.position.set(adX + adW / 2 + 0.002, adY, adZ);
poster.rotation.y = Math.PI / 2;   // face +X
poster.castShadow = false;
poster.receiveShadow = false;
adGroup.add(poster);

/* =============================================================
   Centre the kiosk horizontally at the origin, resting on ground
   ============================================================= */
scene.add(kiosk);
{
  const box = new THREE.Box3().setFromObject(kiosk);
  const c = box.getCenter(new THREE.Vector3());
  kiosk.position.x -= c.x;    // centre in X
  kiosk.position.z -= c.z;    // centre in Z
  kiosk.position.y -= box.min.y; // rest exactly on y = 0
}

/* =============================================================
   GROUND — soft contact-shadow plane the kiosk rests on
   ============================================================= */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 64),
  new THREE.MeshStandardMaterial({ color: 0xc7cace, roughness: 0.95, metalness: 0.0 })
);
ground.name = 'Ground';
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* =============================================================
   CONTROLS — damping + gentle autorotate
   ============================================================= */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 3;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.5; // stay above ground

/* =============================================================
   AUTO-FRAME CAMERA to the kiosk bounding box
   ============================================================= */
function frameObject(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const fov = camera.fov * Math.PI / 180;
  let dist = (maxDim / 2) / Math.tan(fov / 2);
  dist *= 1.45;

  camera.position.set(center.x + dist * 0.85, center.y + dist * 0.42, center.z + dist * 0.95);
  camera.near = dist / 100;
  camera.far = dist * 100;
  camera.updateProjectionMatrix();

  controls.target.copy(center);
  controls.update();
}
frameObject(kiosk);

/* =============================================================
   RESIZE
   ============================================================= */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* =============================================================
   RENDER LOOP
   ============================================================= */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
