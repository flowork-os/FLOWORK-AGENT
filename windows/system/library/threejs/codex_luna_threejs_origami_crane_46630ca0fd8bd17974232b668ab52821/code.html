<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Origami Paper Crane</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #d9d4cb; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9d4cb);
scene.fog = new THREE.Fog(0xd9d4cb, 8, 18);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.2, 3.7, 7.2);
camera.lookAt(0, 1.25, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.target.set(0, 1.25, 0);
controls.minDistance = 4;
controls.maxDistance = 11;

scene.add(new THREE.HemisphereLight(0xf8f5ed, 0x766f68, 2.1));

const key = new THREE.DirectionalLight(0xfff8e9, 3.6);
key.position.set(-4, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0xc8d7e5, 1.15);
fill.position.set(5, 3, -4);
scene.add(fill);

const paperFront = new THREE.MeshStandardMaterial({
  color: 0xf2eee3,
  roughness: 0.82,
  metalness: 0,
  side: THREE.DoubleSide
});
const paperLight = new THREE.MeshStandardMaterial({
  color: 0xfff9e9,
  roughness: 0.84,
  side: THREE.DoubleSide
});
const paperShade = new THREE.MeshStandardMaterial({
  color: 0xd9d0c1,
  roughness: 0.88,
  side: THREE.DoubleSide
});
const paperReverse = new THREE.MeshStandardMaterial({
  color: 0xb8c6bd,
  roughness: 0.86,
  side: THREE.DoubleSide
});
const paperWarm = new THREE.MeshStandardMaterial({
  color: 0xe7d8c5,
  roughness: 0.86,
  side: THREE.DoubleSide
});
const creaseMaterial = new THREE.LineBasicMaterial({
  color: 0x8e887f,
  transparent: true,
  opacity: 0.72
});
const darkCreaseMaterial = new THREE.LineBasicMaterial({
  color: 0x706c66,
  transparent: true,
  opacity: 0.62
});

const crane = new THREE.Group();
scene.add(crane);

function point(x, y, z) {
  return new THREE.Vector3(x, y, z);
}

function triangle(a, b, c, material) {
  const geometry = new THREE.BufferGeometry();
  const vertices = new Float32Array([
    a.x, a.y, a.z,
    b.x, b.y, b.z,
    c.x, c.y, c.z
  ]);
  geometry.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  crane.add(mesh);
  return mesh;
}

function crease(points, material = creaseMaterial) {
  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  const line = new THREE.Line(geometry, material);
  crane.add(line);
  return line;
}

function quad(a, b, c, d, material1, material2 = material1) {
  triangle(a, b, c, material1);
  triangle(a, c, d, material2);
}

const base = {
  apex: point(0, 0.22, 0.04),
  front: point(0, 0.72, 0.72),
  right: point(0.68, 0.66, -0.03),
  back: point(0, 0.62, -0.82),
  left: point(-0.68, 0.66, -0.03)
};

triangle(base.apex, base.front, base.right, paperLight);
triangle(base.apex, base.right, base.back, paperShade);
triangle(base.apex, base.back, base.left, paperReverse);
triangle(base.apex, base.left, base.front, paperFront);
crease([base.front, base.apex, base.back], darkCreaseMaterial);
crease([base.left, base.apex, base.right]);

const bodyCenter = point(0, 1.03, -0.02);
const bodyFront = point(0, 1.18, 0.58);
const bodyBack = point(0, 1.08, -0.74);
const bodyLeft = point(-0.62, 1.03, -0.02);
const bodyRight = point(0.62, 1.03, -0.02);
const bodyTop = point(0, 1.52, -0.02);

triangle(bodyCenter, bodyFront, bodyRight, paperLight);
triangle(bodyCenter, bodyRight, bodyBack, paperWarm);
triangle(bodyCenter, bodyBack, bodyLeft, paperReverse);
triangle(bodyCenter, bodyLeft, bodyFront, paperFront);
triangle(bodyTop, bodyRight, bodyCenter, paperShade);
triangle(bodyTop, bodyCenter, bodyLeft, paperFront);
crease([bodyFront, bodyCenter, bodyBack], darkCreaseMaterial);
crease([bodyLeft, bodyTop, bodyRight]);

const leftWingRoot = point(-0.22, 1.27, -0.10);
const leftWingRidge = point(-0.68, 1.93, -0.31);
const leftWingHigh = point(-1.72, 2.42, -0.72);
const leftWingTip = point(-2.12, 1.22, -1.02);
const leftWingLow = point(-0.86, 0.91, -0.57);

triangle(leftWingRoot, leftWingRidge, leftWingLow, paperFront);
triangle(leftWingRidge, leftWingHigh, leftWingLow, paperLight);
triangle(leftWingHigh, leftWingTip, leftWingLow, paperShade);
triangle(leftWingRoot, leftWingLow, leftWingTip, paperReverse);
crease([leftWingRoot, leftWingRidge, leftWingHigh], darkCreaseMaterial);
crease([leftWingRidge, leftWingLow, leftWingTip]);
crease([leftWingHigh, leftWingTip]);

const rightWingRoot = point(0.22, 1.27, -0.10);
const rightWingRidge = point(0.68, 1.93, -0.31);
const rightWingHigh = point(1.72, 2.42, -0.72);
const rightWingTip = point(2.12, 1.22, -1.02);
const rightWingLow = point(0.86, 0.91, -0.57);

triangle(rightWingRoot, rightWingLow, rightWingRidge, paperLight);
triangle(rightWingRidge, rightWingLow, rightWingHigh, paperFront);
triangle(rightWingHigh, rightWingLow, rightWingTip, paperShade);
triangle(rightWingRoot, rightWingTip, rightWingLow, paperReverse);
crease([rightWingRoot, rightWingRidge, rightWingHigh], darkCreaseMaterial);
crease([rightWingRidge, rightWingLow, rightWingTip]);
crease([rightWingHigh, rightWingTip]);

const tailRoot = point(0, 1.10, -0.48);
const tailLeft = point(-0.34, 1.08, -1.30);
const tailRight = point(0.34, 1.08, -1.30);
const tailTip = point(0, 1.00, -2.28);
const tailRidge = point(0, 1.28, -1.20);

triangle(tailRoot, tailLeft, tailRidge, paperReverse);
triangle(tailRoot, tailRidge, tailRight, paperFront);
triangle(tailLeft, tailTip, tailRidge, paperShade);
triangle(tailRidge, tailTip, tailRight, paperLight);
crease([tailLeft, tailRidge, tailRight], darkCreaseMaterial);
crease([tailRoot, tailRidge, tailTip]);

const neckBaseLeft = point(-0.25, 1.29, 0.28);
const neckBaseRight = point(0.25, 1.29, 0.28);
const neckMid = point(0, 2.08, 0.76);
const neckTip = point(0, 2.76, 1.22);
const neckSideLeft = point(-0.22, 2.14, 0.83);
const neckSideRight = point(0.22, 2.14, 0.83);

triangle(neckBaseLeft, neckMid, neckBaseRight, paperShade);
triangle(neckBaseLeft, neckSideLeft, neckMid, paperFront);
triangle(neckBaseRight, neckMid, neckSideRight, paperLight);
triangle(neckSideLeft, neckTip, neckMid, paperFront);
triangle(neckMid, neckTip, neckSideRight, paperShade);
crease([neckBaseLeft, neckMid, neckBaseRight], darkCreaseMaterial);
crease([neckSideLeft, neckTip, neckSideRight]);
crease([neckBaseLeft, neckSideLeft, neckTip, neckSideRight, neckBaseRight]);

const headCenter = point(0, 2.77, 1.30);
const headBack = point(0, 2.82, 0.92);
const headLeft = point(-0.30, 2.76, 1.21);
const headRight = point(0.30, 2.76, 1.21);
const headTop = point(0, 3.04, 1.35);

triangle(headCenter, headBack, headLeft, paperShade);
triangle(headCenter, headRight, headBack, paperFront);
triangle(headTop, headLeft, headCenter, paperLight);
triangle(headTop, headCenter, headRight, paperWarm);
crease([headLeft, headTop, headRight], darkCreaseMaterial);

const beakBase = point(0, 2.77, 1.48);
const beakUpper = point(0, 2.88, 1.54);
const beakTip = point(0, 2.76, 2.18);
const beakLeft = point(-0.12, 2.76, 1.53);
const beakRight = point(0.12, 2.76, 1.53);

triangle(beakBase, beakUpper, beakTip, paperLight);
triangle(beakBase, beakTip, beakLeft, paperFront);
triangle(beakLeft, beakTip, beakRight, paperWarm);
triangle(beakRight, beakTip, beakUpper, paperShade);
crease([beakUpper, beakTip, beakBase], darkCreaseMaterial);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0xd9d4cb, roughness: 0.92, metalness: 0 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

const contact = new THREE.Mesh(
  new THREE.CircleGeometry(1.45, 64),
  new THREE.MeshBasicMaterial({ color: 0xaaa49b, transparent: true, opacity: 0.12, depthWrite: false })
);
contact.rotation.x = -Math.PI / 2;
contact.position.set(0, 0.012, -0.05);
contact.scale.set(1.35, 0.56, 1);
scene.add(contact);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  crane.position.y = Math.sin(t * 0.8) * 0.018;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
