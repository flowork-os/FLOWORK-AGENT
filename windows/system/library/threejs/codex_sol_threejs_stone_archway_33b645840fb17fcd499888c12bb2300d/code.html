<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Stone Archway</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #c8d2d8; }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 20px;
      bottom: 18px;
      color: rgba(35, 39, 38, 0.72);
      font: 12px/1.4 system-ui, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Stone Archway · Drag to orbit · Scroll to zoom</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcbd5da);
    scene.fog = new THREE.Fog(0xcbd5da, 10, 24);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 60);
    camera.position.set(6.2, 4.3, 7.4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.05, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;
    controls.minDistance = 4.2;
    controls.maxDistance = 13;
    controls.maxPolarAngle = Math.PI * 0.48;

    const hemi = new THREE.HemisphereLight(0xe8f2f5, 0x6e6658, 2.05);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff2d7, 4.2);
    sun.position.set(-4.5, 8.5, 5.5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -6;
    sun.shadow.camera.right = 6;
    sun.shadow.camera.top = 8;
    sun.shadow.camera.bottom = -3;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 22;
    sun.shadow.bias = -0.00035;
    sun.shadow.normalBias = 0.025;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x9bb4c4, 1.1);
    fill.position.set(5, 3, -5);
    scene.add(fill);

    const stonePalette = [
      0x978d7b, 0xa09683, 0x8c8373, 0xaaa08c,
      0x928875, 0x9d927e, 0x887f70, 0xa59a85
    ];

    function stoneMaterial(index, roughness = 0.91) {
      return new THREE.MeshStandardMaterial({
        color: stonePalette[index % stonePalette.length],
        roughness,
        metalness: 0,
        flatShading: false
      });
    }

    function hash(n) {
      return (Math.sin(n * 127.1 + 311.7) * 43758.5453) % 1;
    }

    function variation(n, amount) {
      return (Math.abs(hash(n)) - 0.5) * amount;
    }

    const archway = new THREE.Group();
    scene.add(archway);

    function addBlock(x, y, z, width, height, depth, seed, materialIndex, bevel = 0.025) {
      const shape = new THREE.Shape();
      const hw = width * 0.5;
      const hh = height * 0.5;
      shape.moveTo(-hw + bevel, -hh);
      shape.lineTo(hw - bevel, -hh);
      shape.quadraticCurveTo(hw, -hh, hw, -hh + bevel);
      shape.lineTo(hw, hh - bevel);
      shape.quadraticCurveTo(hw, hh, hw - bevel, hh);
      shape.lineTo(-hw + bevel, hh);
      shape.quadraticCurveTo(-hw, hh, -hw, hh - bevel);
      shape.lineTo(-hw, -hh + bevel);
      shape.quadraticCurveTo(-hw, -hh, -hw + bevel, -hh);

      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth,
        bevelEnabled: true,
        bevelSegments: 1,
        bevelSize: bevel * 0.55,
        bevelThickness: bevel * 0.55,
        curveSegments: 2
      });
      geometry.translate(0, 0, -depth * 0.5);
      geometry.computeVertexNormals();

      const mesh = new THREE.Mesh(geometry, stoneMaterial(materialIndex));
      mesh.position.set(
        x + variation(seed, 0.018),
        y + variation(seed + 3, 0.012),
        z + variation(seed + 8, 0.012)
      );
      mesh.rotation.set(
        variation(seed + 5, 0.008),
        variation(seed + 9, 0.008),
        variation(seed + 12, 0.008)
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      archway.add(mesh);
      return mesh;
    }

    const openingHalfWidth = 1.05;
    const pierWidth = 0.72;
    const pierDepth = 0.68;
    const springY = 2.22;
    const mortar = 0.035;
    const courseHeight = 0.37;
    const courses = 6;

    for (const side of [-1, 1]) {
      const pierCenter = side * (openingHalfWidth + pierWidth * 0.5);

      addBlock(
        pierCenter, 0.11, 0,
        pierWidth + 0.19, 0.22, pierDepth + 0.18,
        50 + side, 3, 0.025
      );

      for (let row = 0; row < courses; row++) {
        const y = 0.24 + row * courseHeight + courseHeight * 0.5;
        const offset = row % 2 === 0 ? 0 : 0.025 * side;
        const split = row % 3 !== 1;

        if (split) {
          const blockWidth = (pierWidth - mortar) * 0.5;
          for (let column = 0; column < 2; column++) {
            const x = pierCenter + offset + (column === 0 ? -1 : 1) * (blockWidth + mortar) * 0.5;
            addBlock(
              x, y, 0,
              blockWidth, courseHeight - mortar, pierDepth,
              row * 19 + column * 7 + (side > 0 ? 80 : 20),
              row + column + (side > 0 ? 2 : 5)
            );
          }
        } else {
          addBlock(
            pierCenter + offset, y, 0,
            pierWidth, courseHeight - mortar, pierDepth,
            row * 23 + (side > 0 ? 90 : 30),
            row + (side > 0 ? 4 : 1)
          );
        }
      }

      addBlock(
        pierCenter, springY - 0.07, 0,
        pierWidth + 0.11, 0.24, pierDepth + 0.09,
        120 + side, side > 0 ? 1 : 5, 0.024
      );
    }

    const innerRadius = openingHalfWidth;
    const outerRadius = 1.49;
    const archDepth = 0.73;
    const voussoirCount = 13;
    const angularGap = 0.018;

    function createVoussoir(a0, a1, innerR, outerR, depth, materialIndex, isKeystone = false) {
      const shape = new THREE.Shape();
      const segments = 8;

      shape.moveTo(
        outerR * Math.cos(a0),
        springY + outerR * Math.sin(a0)
      );

      for (let i = 1; i <= segments; i++) {
        const angle = THREE.MathUtils.lerp(a0, a1, i / segments);
        shape.lineTo(
          outerR * Math.cos(angle),
          springY + outerR * Math.sin(angle)
        );
      }

      for (let i = segments; i >= 0; i--) {
        const angle = THREE.MathUtils.lerp(a0, a1, i / segments);
        shape.lineTo(
          innerR * Math.cos(angle),
          springY + innerR * Math.sin(angle)
        );
      }
      shape.closePath();

      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth,
        steps: 1,
        bevelEnabled: true,
        bevelSegments: 1,
        bevelSize: isKeystone ? 0.018 : 0.014,
        bevelThickness: isKeystone ? 0.018 : 0.014,
        curveSegments: 2
      });
      geometry.translate(0, 0, -depth * 0.5);
      geometry.computeVertexNormals();

      const mesh = new THREE.Mesh(geometry, stoneMaterial(materialIndex, 0.9));
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      if (isKeystone) {
        mesh.position.z = 0.035;
      }

      archway.add(mesh);
      return mesh;
    }

    const segmentAngle = Math.PI / voussoirCount;

    for (let i = 0; i < voussoirCount; i++) {
      const centerAngle = (i + 0.5) * segmentAngle;
      const isKeystone = i === Math.floor(voussoirCount / 2);
      const a0 = i * segmentAngle + angularGap;
      const a1 = (i + 1) * segmentAngle - angularGap;

      let localInner = innerRadius;
      let localOuter = outerRadius;

      if (isKeystone) {
        localInner -= 0.055;
        localOuter += 0.12;
      } else {
        localOuter += variation(i + 220, 0.018);
      }

      const block = createVoussoir(
        a0,
        a1,
        localInner,
        localOuter,
        isKeystone ? archDepth + 0.07 : archDepth,
        isKeystone ? 3 : (i + 2) % stonePalette.length,
        isKeystone
      );

      if (!isKeystone) {
        block.position.z += variation(i + 260, 0.012);
      }

      block.userData.centerAngle = centerAngle;
    }

    const crownY = springY + outerRadius;
    const copingY = crownY + 0.23;
    const fullWidth = 2 * (openingHalfWidth + pierWidth);
    const copingPieces = 5;
    const copingGap = 0.035;
    const copingWidth = fullWidth / copingPieces;

    for (let i = 0; i < copingPieces; i++) {
      const x = -fullWidth * 0.5 + copingWidth * (i + 0.5);
      addBlock(
        x, copingY, 0,
        copingWidth - copingGap, 0.38, pierDepth + 0.09,
        310 + i * 11, i + 1, 0.026
      );
    }

    for (let i = 0; i < 4; i++) {
      const width = fullWidth / 4;
      const x = -fullWidth * 0.5 + width * (i + 0.5);
      addBlock(
        x, copingY + 0.265, 0,
        width - 0.03, 0.16, pierDepth + 0.19,
        380 + i * 13, i + 4, 0.02
      );
    }

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x8f927e,
      roughness: 1,
      metalness: 0
    });
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(14, 96),
      groundMaterial
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.015;
    ground.receiveShadow = true;
    scene.add(ground);

    const pathMaterial = new THREE.MeshStandardMaterial({
      color: 0xaaa18e,
      roughness: 0.98
    });
    const path = new THREE.Mesh(
      new THREE.PlaneGeometry(2.4, 12),
      pathMaterial
    );
    path.rotation.x = -Math.PI / 2;
    path.position.set(0, 0.003, 1.6);
    path.receiveShadow = true;
    scene.add(path);

    const pebbleGeometry = new THREE.DodecahedronGeometry(0.035, 0);
    const pebbleMaterial = new THREE.MeshStandardMaterial({
      color: 0x747364,
      roughness: 1
    });
    const pebbles = new THREE.InstancedMesh(pebbleGeometry, pebbleMaterial, 90);
    pebbles.castShadow = true;
    pebbles.receiveShadow = true;
    const dummy = new THREE.Object3D();

    for (let i = 0; i < 90; i++) {
      const angle = i * 2.399963;
      const radius = 2.3 + (i % 17) * 0.22;
      dummy.position.set(
        Math.cos(angle) * radius,
        0.025,
        Math.sin(angle) * radius
      );
      const scale = 0.45 + Math.abs(hash(i + 700)) * 1.15;
      dummy.scale.set(scale, scale * 0.55, scale * 0.85);
      dummy.rotation.set(
        Math.abs(hash(i + 2)) * Math.PI,
        Math.abs(hash(i + 4)) * Math.PI,
        Math.abs(hash(i + 7)) * Math.PI
      );
      dummy.updateMatrix();
      pebbles.setMatrixAt(i, dummy.matrix);
    }
    scene.add(pebbles);

    const backdrop = new THREE.Mesh(
      new THREE.SphereGeometry(22, 48, 24, 0, Math.PI * 2, 0, Math.PI * 0.52),
      new THREE.MeshBasicMaterial({
        color: 0xcbd5da,
        side: THREE.BackSide,
        fog: false
      })
    );
    backdrop.position.y = -0.2;
    scene.add(backdrop);

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
