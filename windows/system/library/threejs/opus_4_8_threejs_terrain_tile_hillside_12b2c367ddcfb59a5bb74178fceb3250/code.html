<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocky Hillside — Tabletop Terrain Tile</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14161a; }
  #app { position: fixed; inset: 0; }
  #label {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    color: #9aa3ad; letter-spacing: .04em; user-select: none; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="label">rocky hillside · procedural terrain tile · drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ *
 *  Tunable constants (world units ~ centimetres, wargaming scale)
 * ------------------------------------------------------------------ */
const TILE          = 18;          // square tile edge
const HALF          = TILE / 2;
const BASE_H        = 1.6;         // slab thickness
const HILL          = 5.0;         // hillside rise, front -> back
const TERRAIN_BASE  = 0.6;         // interior baseline height above slab top
const BORDER        = 1.4;         // flat rim band width
const RIM_H         = 0.0;         // rim meets slab top
const PATH_AMP      = 3.0;         // winding footpath sway
const PATH_AMP2     = 1.3;
const PATH_HALF     = 1.6;         // path half-width
const PATH_DEPTH    = 0.4;         // how far the path is worn in

/* ------------------------------------------------------------------ *
 *  Deterministic pseudo-random + value-noise helpers
 * ------------------------------------------------------------------ */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20260706);

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp  = (a, b, t) => a + (b - a) * t;
function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}

function hash2(x, y) {
  const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return h - Math.floor(h);
}
function valueNoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy),     b = hash2(ix + 1, iy);
  const c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
}
function fbm(x, y, oct) {
  let amp = 0.5, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) {
    sum += amp * valueNoise(x * freq, y * freq);
    norm += amp; amp *= 0.5; freq *= 2;
  }
  return sum / norm;
}
function noise3(x, y, z) {
  return (fbm(x, y, 3) + fbm(y, z, 3) + fbm(z, x, 3)) / 3;
}

/* ------------------------------------------------------------------ *
 *  Terrain height + colour field
 * ------------------------------------------------------------------ */
const cGrass    = new THREE.Color(0x445024);
const cGrassDry = new THREE.Color(0x726f38);
const cRock     = new THREE.Color(0x726c62);
const cDirt     = new THREE.Color(0x5e4a2e);

function pathCenterX(z) {
  return PATH_AMP  * Math.sin((z / TILE) * Math.PI * 1.6 + 0.6)
       + PATH_AMP2 * Math.sin((z / TILE) * Math.PI * 3.1);
}

const _col = new THREE.Color();
function sampleTerrain(x, z) {
  // slope: front (z = +HALF) low, back (z = -HALF) high
  let t = clamp((HALF - z) / TILE, 0, 1);
  const slope = smoothstep(0.08, 0.85, t);
  let h = TERRAIN_BASE + slope * HILL;

  // broad + fine terrain noise (more relief up the hill)
  const n1     = fbm(x * 0.12 + 10, z * 0.12 + 5, 5);
  const ridged = fbm(x * 0.30 + 40, z * 0.30 + 20, 4);
  h += (n1 - 0.5) * 1.6 * (0.3 + 0.7 * slope);
  h += (ridged - 0.5) * 0.6;

  // shallow winding footpath (worn channel)
  const d = Math.abs(x - pathCenterX(z));
  const pathMask = 1 - smoothstep(PATH_HALF * 0.45, PATH_HALF, d);
  h -= pathMask * PATH_DEPTH;
  h += pathMask * (fbm(x * 0.9, z * 0.9, 2) - 0.5) * 0.08; // gravel jitter

  // flatten the tile rim so terrain seats cleanly on the slab
  const edge = Math.min(HALF - Math.abs(x), HALF - Math.abs(z));
  const edgeT = smoothstep(0.0, BORDER, edge);
  h = lerp(RIM_H, h, edgeT);
  h = Math.max(h, 0.0);

  // --- colour ---
  let rockMask = smoothstep(0.5, 0.95, slope) * 0.7
               + smoothstep(0.62, 0.9, ridged) * 0.6;
  rockMask = clamp(rockMask, 0, 1) * edgeT;

  _col.copy(cGrass).lerp(cGrassDry, clamp(n1 * 1.2, 0, 1));
  _col.lerp(cRock, rockMask);
  _col.lerp(cDirt, clamp(pathMask * 1.15, 0, 1) * edgeT);
  _col.multiplyScalar(0.8 + 0.35 * n1);

  return { h, r: _col.r, g: _col.g, b: _col.b };
}
const heightAt = (x, z) => sampleTerrain(x, z).h;

/* ------------------------------------------------------------------ *
 *  Renderer / scene / camera
 * ------------------------------------------------------------------ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
scene.fog = new THREE.Fog(0x14161a, 46, 96);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(17, 12, 19);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.target.set(0, 1.6, 0);
controls.minDistance = 14;
controls.maxDistance = 48;
controls.maxPolarAngle = Math.PI * 0.49;

/* ------------------------------------------------------------------ *
 *  Lighting: hemisphere fill + key + fill + rim, soft shadows
 * ------------------------------------------------------------------ */
scene.add(new THREE.HemisphereLight(0x9fb4cc, 0x3a3026, 0.6));
scene.add(new THREE.AmbientLight(0xffffff, 0.08));

const key = new THREE.DirectionalLight(0xfff2e0, 2.4);
key.position.set(16, 22, 12);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 70;
key.shadow.camera.left = -13;
key.shadow.camera.right = 13;
key.shadow.camera.top = 13;
key.shadow.camera.bottom = -13;
key.shadow.bias = -0.0003;
key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9bb8ff, 0.5);
fill.position.set(-14, 10, -4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9b0, 0.9);
rim.position.set(-6, 8, -16);
scene.add(rim);

/* ------------------------------------------------------------------ *
 *  Shadow-catching studio ground (receives shadows only)
 * ------------------------------------------------------------------ */
const shadowGround = new THREE.Mesh(
  new THREE.PlaneGeometry(240, 240),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
shadowGround.rotation.x = -Math.PI / 2;
shadowGround.position.y = -BASE_H;
shadowGround.receiveShadow = true;
scene.add(shadowGround);

/* ------------------------------------------------------------------ *
 *  THE ONE OBJECT — a single centred group
 * ------------------------------------------------------------------ */
const tile = new THREE.Group();
scene.add(tile);

/* --- slab base --- */
const slabMat = new THREE.MeshStandardMaterial({ color: 0x3e3427, roughness: 0.95, metalness: 0.0 });
const slab = new THREE.Mesh(new THREE.BoxGeometry(TILE, BASE_H, TILE), slabMat);
slab.position.y = -BASE_H / 2;           // top face at y = 0
slab.castShadow = true;
slab.receiveShadow = true;
tile.add(slab);

/* --- sloped hillside surface (displaced plane, vertex-coloured) --- */
const SEG = 200;
const terrainGeo = new THREE.PlaneGeometry(TILE, TILE, SEG, SEG);
terrainGeo.rotateX(-Math.PI / 2);
{
  const pos = terrainGeo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const s = sampleTerrain(x, z);
    pos.setY(i, s.h);
    colors[i * 3] = s.r; colors[i * 3 + 1] = s.g; colors[i * 3 + 2] = s.b;
  }
  terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  terrainGeo.computeVertexNormals();
}
const terrainMat = new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.98, metalness: 0.0
});
const terrain = new THREE.Mesh(terrainGeo, terrainMat);
terrain.castShadow = true;
terrain.receiveShadow = true;
tile.add(terrain);

/* --- protruding rocky crags --- */
function makeRockGeo(size, seed) {
  const g = new THREE.IcosahedronGeometry(size, 2);
  const p = g.attributes.position;
  const dir = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    dir.set(p.getX(i), p.getY(i), p.getZ(i)).normalize();
    const disp   = noise3(dir.x * 2.2 + seed, dir.y * 2.2 + seed * 1.7, dir.z * 2.2 + seed * 0.3);
    const ridges = Math.abs(noise3(dir.x * 5 + seed, dir.y * 5, dir.z * 5) - 0.5);
    const scale  = 1 + (disp - 0.5) * 0.75 - ridges * 0.28;
    p.setXYZ(i, dir.x * size * scale, dir.y * size * scale, dir.z * size * scale);
  }
  g.computeVertexNormals();
  return g;
}
const cragMats = [
  new THREE.MeshStandardMaterial({ color: 0x6f6a60, roughness: 0.95, metalness: 0, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0x807a6f, roughness: 0.92, metalness: 0, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0x5b564d, roughness: 0.97, metalness: 0, flatShading: true }),
];
const CRAGS = 11;
for (let i = 0; i < CRAGS; i++) {
  const x = (rng() * 2 - 1) * (HALF - 3.0);
  const z = -HALF + 2.2 + rng() * (TILE - 4.4);
  // skip if sitting right in the worn path
  if (Math.abs(x - pathCenterX(z)) < PATH_HALF * 0.8) continue;
  const upBias = z < 0 ? (-z / HALF) * 1.1 : 0;
  const size = 0.7 + rng() * 0.85 + upBias;
  const rock = new THREE.Mesh(makeRockGeo(size, i * 3.13 + 1), cragMats[i % cragMats.length]);
  rock.position.set(x, heightAt(x, z) - size * 0.32, z);
  rock.rotation.set((rng() - 0.5) * 0.5, rng() * Math.PI * 2, (rng() - 0.5) * 0.5);
  rock.scale.set(0.85 + rng() * 0.5, 0.9 + rng() * 0.6, 0.85 + rng() * 0.5);
  rock.castShadow = true;
  rock.receiveShadow = true;
  tile.add(rock);
}

/* --- one broken low retaining wall (path passes through the breach) --- */
function buildWall(parent) {
  const stoneMats = [
    new THREE.MeshStandardMaterial({ color: 0x8a8175, roughness: 0.9, metalness: 0 }),
    new THREE.MeshStandardMaterial({ color: 0x736b60, roughness: 0.92, metalness: 0 }),
    new THREE.MeshStandardMaterial({ color: 0x9a9184, roughness: 0.88, metalness: 0 }),
  ];
  const g = new THREE.Group();
  const z0 = 2.6, bw = 1.1, bh = 0.5, bd = 0.85;
  const x0 = -6.4, x1 = 5.9;
  const gapStart = 3.1, gapEnd = 5.3;   // breach lines up with the footpath

  for (let course = 0; course < 2; course++) {
    const offset = course % 2 ? bw * 0.5 : 0;
    for (let x = x0 + offset; x <= x1; x += bw * 1.02) {
      if (x > gapStart && x < gapEnd) continue;         // the break
      if (course === 1 && rng() < 0.35) continue;       // tumbled-away top stones
      const zc = z0 + Math.sin(x * 0.25) * 0.5;         // gently follows the contour
      const baseH = heightAt(x, zc);
      const block = new THREE.Mesh(
        new THREE.BoxGeometry(bw * (0.9 + rng() * 0.15), bh * (0.85 + rng() * 0.2), bd * (0.9 + rng() * 0.15)),
        stoneMats[Math.floor(rng() * stoneMats.length)]
      );
      block.position.set(
        x + (rng() - 0.5) * 0.06,
        baseH + bh * course + bh * 0.5 - 0.05,
        zc + (rng() - 0.5) * 0.06
      );
      block.rotation.set(
        (rng() - 0.5) * 0.08,
        (rng() - 0.5) * 0.18,
        (rng() - 0.5) * 0.08 + (course === 1 ? (rng() - 0.5) * 0.18 : 0)
      );
      block.castShadow = true; block.receiveShadow = true;
      g.add(block);
    }
  }

  // rubble tumbled downslope from the breach
  for (let i = 0; i < 5; i++) {
    const x = gapStart + (gapEnd - gapStart) * rng() + (rng() - 0.5);
    const zc = z0 + 1.1 + rng() * 1.4;
    const baseH = heightAt(x, zc);
    const block = new THREE.Mesh(
      new THREE.BoxGeometry(bw * (0.65 + rng() * 0.3), bh * (0.8 + rng() * 0.3), bd * (0.65 + rng() * 0.3)),
      stoneMats[Math.floor(rng() * stoneMats.length)]
    );
    block.position.set(x, baseH + bh * 0.35, zc);
    block.rotation.set(rng() * Math.PI, rng() * Math.PI, rng() * Math.PI);
    block.castShadow = true; block.receiveShadow = true;
    g.add(block);
  }
  parent.add(g);
}
buildWall(tile);

/* --- scattered pebbles for detail (mostly along the path) --- */
const pebbleMat = new THREE.MeshStandardMaterial({ color: 0x746d62, roughness: 0.95, metalness: 0, flatShading: true });
const pebbleGeo = new THREE.IcosahedronGeometry(1, 0);
for (let i = 0; i < 26; i++) {
  const alongPath = rng() < 0.6;
  let x, z;
  if (alongPath) {
    z = -HALF + 1.5 + rng() * (TILE - 3);
    x = pathCenterX(z) + (rng() - 0.5) * (PATH_HALF * 1.8);
  } else {
    x = (rng() * 2 - 1) * (HALF - 1.5);
    z = (rng() * 2 - 1) * (HALF - 1.5);
  }
  const s = 0.1 + rng() * 0.22;
  const peb = new THREE.Mesh(pebbleGeo, pebbleMat);
  peb.position.set(x, heightAt(x, z) + s * 0.35, z);
  peb.scale.set(s * (0.8 + rng() * 0.6), s * (0.6 + rng() * 0.5), s * (0.8 + rng() * 0.6));
  peb.rotation.set(rng() * Math.PI, rng() * Math.PI, rng() * Math.PI);
  peb.castShadow = true; peb.receiveShadow = true;
  tile.add(peb);
}

/* ------------------------------------------------------------------ *
 *  Resize + render loop
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
