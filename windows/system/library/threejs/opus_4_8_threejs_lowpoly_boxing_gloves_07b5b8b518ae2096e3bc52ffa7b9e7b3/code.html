<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Low-Poly Boxing Gloves</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #16181c; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ *
 *  Renderer / Scene / Camera
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1c20);
scene.fog = new THREE.Fog(0x1a1c20, 1.6, 6.0);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(0.72, 0.46, 0.95);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.minDistance = 0.5;
controls.maxDistance = 3.2;
controls.target.set(0, 0.20, 0);

/* ------------------------------------------------------------------ *
 *  Lighting : hemisphere ambient + directional key + fill + rim
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0x93a6c4, 0x241a1c, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e6, 3.0);
key.position.set(1.5, 2.3, 1.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.2;
key.shadow.camera.far = 8;
key.shadow.camera.left = -1.2;
key.shadow.camera.right = 1.2;
key.shadow.camera.top = 1.2;
key.shadow.camera.bottom = -1.2;
key.shadow.bias = -0.0012;
key.shadow.normalBias = 0.012;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fb4ff, 0.85);
fill.position.set(-1.9, 0.9, 1.1);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd0c0, 1.25);
rim.position.set(-0.6, 1.2, -2.1);
scene.add(rim);

/* ground : shadow only */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(14, 14),
  new THREE.ShadowMaterial({ opacity: 0.4 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ *
 *  Materials : flat shaded, chunky
 * ------------------------------------------------------------------ */
const matRed = new THREE.MeshStandardMaterial({
  color: 0xc41230, roughness: 0.55, metalness: 0.0, flatShading: true
});
const matRedDark = new THREE.MeshStandardMaterial({
  color: 0x8e0a20, roughness: 0.62, metalness: 0.0, flatShading: true
});
const matWhite = new THREE.MeshStandardMaterial({
  color: 0xf3efe6, roughness: 0.75, metalness: 0.0, flatShading: true
});
const matCream = new THREE.MeshStandardMaterial({
  color: 0xd9d2c2, roughness: 0.8, metalness: 0.0, flatShading: true
});
const matDark = new THREE.MeshStandardMaterial({
  color: 0x2b2226, roughness: 0.8, metalness: 0.05, flatShading: true
});

/* ------------------------------------------------------------------ *
 *  Helpers
 * ------------------------------------------------------------------ */
function faceted(geo) {
  geo = geo.toNonIndexed();
  geo.computeVertexNormals();
  return geo;
}

function addMesh(parent, geo, mat) {
  const m = new THREE.Mesh(faceted(geo), mat);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* Low-poly rounded box built from a subdivided box pushed toward a sphere. */
function chunkyBox(w, h, d, radius, seg = 2) {
  const geo = new THREE.BoxGeometry(w, h, d, seg, seg, seg);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  const half = new THREE.Vector3(w / 2, h / 2, d / 2);
  const inner = new THREE.Vector3(
    Math.max(0.0001, half.x - radius),
    Math.max(0.0001, half.y - radius),
    Math.max(0.0001, half.z - radius)
  );
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    // clamp to inner core, then push out along the offset by radius
    const cx = THREE.MathUtils.clamp(v.x, -inner.x, inner.x);
    const cy = THREE.MathUtils.clamp(v.y, -inner.y, inner.y);
    const cz = THREE.MathUtils.clamp(v.z, -inner.z, inner.z);
    const dx = v.x - cx, dy = v.y - cy, dz = v.z - cz;
    const len = Math.hypot(dx, dy, dz);
    if (len > 1e-6) {
      const s = radius / len;
      pos.setXYZ(i, cx + dx * s, cy + dy * s, cz + dz * s);
    }
  }
  pos.needsUpdate = true;
  return geo;
}

/* ------------------------------------------------------------------ *
 *  One glove  (built pointing +Z, thumb on +X, cuff at -Z)
 *  Units: metres. A real glove ~ 0.30m long, 0.17m tall.
 * ------------------------------------------------------------------ */
function buildGlove() {
  const g = new THREE.Group();

  /* --- main padded mitt: big chunky puck ------------------------- */
  const body = addMesh(g, chunkyBox(0.150, 0.165, 0.185, 0.062, 2), matRed);
  body.position.set(0, 0, 0.030);
  body.scale.set(1.0, 1.0, 1.0);

  /* --- knuckle dome : faceted low-poly sphere front of the mitt --- */
  const knuckleGeo = new THREE.SphereGeometry(0.086, 7, 5);
  const knuckle = addMesh(g, knuckleGeo, matRed);
  knuckle.scale.set(0.86, 0.95, 0.80);
  knuckle.position.set(0, 0.004, 0.108);
  knuckle.rotation.y = Math.PI / 7;

  /* --- angular knuckle ridge plate (slightly darker facet band) --- */
  const ridge = addMesh(g, chunkyBox(0.128, 0.052, 0.052, 0.020, 1), matRedDark);
  ridge.position.set(0, 0.052, 0.118);
  ridge.rotation.x = -0.28;

  /* --- padded top crease : a second flat plane over the mitt ----- */
  const crease = addMesh(g, chunkyBox(0.136, 0.028, 0.150, 0.012, 1), matRedDark);
  crease.position.set(0, 0.074, 0.030);
  crease.rotation.x = 0.06;

  /* --- palm underside slab (slightly darker) --------------------- */
  const palm = addMesh(g, chunkyBox(0.130, 0.040, 0.150, 0.018, 1), matRedDark);
  palm.position.set(0, -0.072, 0.024);

  /* --- thumb : chunky angular stub off the +X side --------------- */
  const thumb = new THREE.Group();
  const thumbBase = addMesh(thumb, chunkyBox(0.062, 0.070, 0.098, 0.028, 1), matRed);
  thumbBase.position.set(0, 0, 0.012);
  const thumbTip = addMesh(thumb, new THREE.SphereGeometry(0.037, 6, 4), matRed);
  thumbTip.scale.set(0.9, 0.95, 0.85);
  thumbTip.position.set(0, 0, 0.058);
  thumb.position.set(0.080, -0.026, 0.036);
  thumb.rotation.set(0.10, 0.50, -0.14);
  g.add(thumb);

  /* --- trim band where mitt meets cuff --------------------------- */
  const trim = addMesh(g, chunkyBox(0.152, 0.166, 0.028, 0.026, 1), matCream);
  trim.position.set(0, -0.002, -0.072);

  /* --- cuff : tapered faceted collar ----------------------------- */
  const cuffGeo = new THREE.CylinderGeometry(0.078, 0.070, 0.115, 8, 1, true);
  const cuff = addMesh(g, cuffGeo, matRed);
  cuff.scale.set(1.0, 1.0, 0.86);
  cuff.rotation.x = Math.PI / 2;
  cuff.rotation.y = Math.PI / 8;
  cuff.position.set(0, -0.002, -0.142);

  /* solid cuff cap so the tube is not hollow-looking from behind */
  const cuffCore = addMesh(g, chunkyBox(0.128, 0.140, 0.100, 0.030, 1), matRedDark);
  cuffCore.position.set(0, -0.002, -0.142);

  /* cuff opening rim */
  const cuffRing = addMesh(g, new THREE.TorusGeometry(0.070, 0.014, 4, 9), matRedDark);
  cuffRing.scale.set(1.0, 0.86, 1.0);
  cuffRing.position.set(0, -0.002, -0.198);

  /* dark inner hole */
  const hole = addMesh(g, new THREE.CylinderGeometry(0.058, 0.052, 0.040, 8), matDark);
  hole.scale.set(1.0, 1.0, 0.86);
  hole.rotation.x = Math.PI / 2;
  hole.position.set(0, -0.002, -0.196);

  /* --- lace panel : recessed cream strip along the cuff top ------ */
  const lacePanel = addMesh(g, chunkyBox(0.052, 0.020, 0.140, 0.008, 1), matCream);
  lacePanel.position.set(0, 0.070, -0.130);
  lacePanel.rotation.x = -0.04;

  /* --- faceted white lace loops (low-poly torus "X" ties) -------- */
  const laceGroup = new THREE.Group();
  const zs = [-0.078, -0.118, -0.158];
  zs.forEach((z, i) => {
    const s = 1 - i * 0.09;
    for (const sign of [-1, 1]) {
      const loop = addMesh(laceGroup, new THREE.TorusGeometry(0.026 * s, 0.0085, 3, 7), matWhite);
      loop.position.set(sign * 0.021 * s, 0.070 - i * 0.004, z);
      loop.rotation.set(Math.PI / 2, 0, sign * 0.55);
      loop.scale.set(1, 0.72, 1);
    }
    // crossing tie bar
    const bar = addMesh(laceGroup, chunkyBox(0.062 * s, 0.010, 0.012, 0.004, 1), matWhite);
    bar.position.set(0, 0.080 - i * 0.004, z);
    bar.rotation.z = (i % 2 === 0 ? 1 : -1) * 0.30;
  });
  g.add(laceGroup);

  /* --- lace tail knot at the back --------------------------------- */
  const knot = addMesh(g, new THREE.IcosahedronGeometry(0.019, 0), matWhite);
  knot.position.set(0, 0.070, -0.186);
  const tailA = addMesh(g, chunkyBox(0.011, 0.011, 0.060, 0.004, 1), matWhite);
  tailA.position.set(-0.022, 0.052, -0.206);
  tailA.rotation.set(0.55, 0.35, 0.2);
  const tailB = addMesh(g, chunkyBox(0.011, 0.011, 0.052, 0.004, 1), matWhite);
  tailB.position.set(0.024, 0.048, -0.204);
  tailB.rotation.set(0.65, -0.40, -0.2);

  /* --- wrist strap band across the cuff --------------------------- */
  const strap = addMesh(g, chunkyBox(0.148, 0.152, 0.030, 0.024, 1), matRedDark);
  strap.position.set(0, -0.002, -0.176);

  return g;
}

/* ------------------------------------------------------------------ *
 *  The single object : a PAIR joined at the wrists
 * ------------------------------------------------------------------ */
const gloves = new THREE.Group();

const left = buildGlove();
left.position.set(-0.108, 0.215, 0.012);
left.rotation.set(-0.18, 0.34, 0.16);
gloves.add(left);

const right = buildGlove();
right.scale.x = -1;                 // mirror for the opposite hand
right.position.set(0.108, 0.215, 0.012);
right.rotation.set(-0.18, -0.34, -0.16);
gloves.add(right);

/* --- the join : a faceted lace wrap binding the two wrists -------- */
const joinGroup = new THREE.Group();

const wrap = new THREE.Mesh(
  faceted(new THREE.CylinderGeometry(0.030, 0.030, 0.150, 7, 1)),
  matWhite
);
wrap.castShadow = true; wrap.receiveShadow = true;
wrap.rotation.z = Math.PI / 2;
wrap.rotation.y = 0.12;
wrap.position.set(0, 0.238, -0.115);
joinGroup.add(wrap);

/* binding rings around the wrap */
[-0.038, 0, 0.038].forEach((x, i) => {
  const ring = new THREE.Mesh(
    faceted(new THREE.TorusGeometry(0.034, 0.0085, 3, 8)),
    matCream
  );
  ring.castShadow = true; ring.receiveShadow = true;
  ring.rotation.y = Math.PI / 2;
  ring.rotation.x = 0.1 * (i - 1);
  ring.position.set(x, 0.238, -0.115);
  joinGroup.add(ring);
});

/* hanging lace tails from the join */
const hang1 = new THREE.Mesh(faceted(chunkyBox(0.012, 0.090, 0.012, 0.004, 1)), matWhite);
hang1.castShadow = true; hang1.receiveShadow = true;
hang1.position.set(-0.020, 0.185, -0.132);
hang1.rotation.set(0.10, 0, 0.22);
joinGroup.add(hang1);

const hang2 = new THREE.Mesh(faceted(chunkyBox(0.012, 0.070, 0.012, 0.004, 1)), matWhite);
hang2.castShadow = true; hang2.receiveShadow = true;
hang2.position.set(0.024, 0.196, -0.126);
hang2.rotation.set(-0.08, 0, -0.28);
joinGroup.add(hang2);

const knotBig = new THREE.Mesh(faceted(new THREE.IcosahedronGeometry(0.026, 0)), matWhite);
knotBig.castShadow = true; knotBig.receiveShadow = true;
knotBig.position.set(0.002, 0.226, -0.140);
joinGroup.add(knotBig);

gloves.add(joinGroup);

/* ------------------------------------------------------------------ *
 *  Center + seat the whole object on the ground
 * ------------------------------------------------------------------ */
gloves.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(gloves);
const center = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3());

const root = new THREE.Group();
root.add(gloves);
gloves.position.x -= center.x;
gloves.position.z -= center.z;
gloves.position.y -= box.min.y - 0.004;   // rest just above the shadow plane
scene.add(root);

controls.target.set(0, size.y * 0.5, 0);
camera.position.set(size.y * 1.55, size.y * 1.15, size.y * 1.95);
controls.update();

/* ------------------------------------------------------------------ *
 *  Resize + Render loop
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
