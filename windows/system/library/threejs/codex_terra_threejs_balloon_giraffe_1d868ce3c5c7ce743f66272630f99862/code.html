<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balloon Giraffe</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff2d7; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfff1d3);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(8.4, 5.5, 10.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.target.set(0, 2.7, 0);
controls.minDistance = 7;
controls.maxDistance = 18;

const yellowMat = new THREE.MeshPhysicalMaterial({
  color: 0xffc51a,
  roughness: 0.15,
  metalness: 0.0,
  clearcoat: 0.9,
  clearcoatRoughness: 0.08,
  sheen: 0.25,
  sheenColor: new THREE.Color(0xfff0a0)
});

const brownMat = new THREE.MeshPhysicalMaterial({
  color: 0x6d3217,
  roughness: 0.18,
  clearcoat: 0.85,
  clearcoatRoughness: 0.1
});

const darkMat = new THREE.MeshPhysicalMaterial({
  color: 0x24100a,
  roughness: 0.22,
  clearcoat: 0.7,
  clearcoatRoughness: 0.12
});

const pinkMat = new THREE.MeshPhysicalMaterial({
  color: 0xe98273,
  roughness: 0.25,
  clearcoat: 0.6,
  clearcoatRoughness: 0.16
});

const giraffe = new THREE.Group();
scene.add(giraffe);

function alignBetween(object, start, end) {
  const midpoint = start.clone().add(end).multiplyScalar(0.5);
  const direction = end.clone().sub(start);
  object.position.copy(midpoint);
  object.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
}

function balloonTube(start, end, radius, material, bulges = 4) {
  const length = start.distanceTo(end);
  const geometry = new THREE.CapsuleGeometry(radius, Math.max(0.02, length - radius * 1.72), 10, bulges);
  geometry.scale(1, 1, 1);
  const mesh = new THREE.Mesh(geometry, material);
  alignBetween(mesh, start, end);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  giraffe.add(mesh);
  return mesh;
}

function balloonSphere(position, scale, material) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), material);
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  giraffe.add(mesh);
  return mesh;
}

function knot(position, radius = 0.22, material = yellowMat) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 16, 12), material);
  mesh.position.copy(position);
  mesh.scale.set(1.15, 0.72, 0.88);
  mesh.rotation.set(0.25, 0.5, -0.25);
  mesh.castShadow = true;
  giraffe.add(mesh);
  return mesh;
}

function addSpot(position, scale, rotation) {
  const spot = balloonSphere(position, scale, brownMat);
  spot.rotation.set(rotation.x, rotation.y, rotation.z);
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(16, 96),
  new THREE.MeshStandardMaterial({ color: 0xffe5ba, roughness: 0.82, metalness: 0 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const shadowRing = new THREE.Mesh(
  new THREE.CircleGeometry(2.6, 64),
  new THREE.MeshBasicMaterial({ color: 0xb97445, transparent: true, opacity: 0.16, depthWrite: false })
);
shadowRing.rotation.x = -Math.PI / 2;
shadowRing.position.y = 0.012;
shadowRing.scale.set(1.35, 0.52, 1);
scene.add(shadowRing);

const body = balloonSphere(new THREE.Vector3(0, 2.15, 0), new THREE.Vector3(1.62, 1.04, 0.91), yellowMat);
body.rotation.z = -0.05;

const chestKnot = knot(new THREE.Vector3(-0.78, 2.2, 0.02), 0.27);
chestKnot.rotation.y = 0.55;

const hipKnot = knot(new THREE.Vector3(1.23, 2.05, 0.02), 0.25);
hipKnot.rotation.y = -0.35;

const legPositions = [
  { x: -0.92, z: -0.48, angle: -0.16 },
  { x: -0.85, z: 0.48, angle: 0.11 },
  { x: 1.03, z: -0.48, angle: 0.12 },
  { x: 1.1, z: 0.45, angle: -0.14 }
];

for (const leg of legPositions) {
  const upper = new THREE.Vector3(leg.x, 1.76, leg.z);
  const knee = new THREE.Vector3(leg.x + leg.angle, 0.88, leg.z + leg.angle * 0.25);
  const hoof = new THREE.Vector3(leg.x + leg.angle * 0.65, 0.34, leg.z + leg.angle * 0.45);
  balloonTube(upper, knee, 0.27, yellowMat, 5);
  knot(knee, 0.2);
  balloonTube(knee, hoof, 0.235, yellowMat, 4);
  const foot = balloonSphere(new THREE.Vector3(hoof.x + 0.08, 0.24, hoof.z), new THREE.Vector3(0.39, 0.20, 0.28), darkMat);
  foot.rotation.y = -0.15;
}

const tailBase = new THREE.Vector3(1.4, 2.25, 0.03);
const tailMiddle = new THREE.Vector3(2.05, 1.8, 0.13);
const tailEnd = new THREE.Vector3(2.12, 1.28, 0.15);
balloonTube(tailBase, tailMiddle, 0.135, yellowMat, 4);
balloonTube(tailMiddle, tailEnd, 0.12, yellowMat, 3);
knot(tailMiddle, 0.14);
const tailTuft = balloonSphere(new THREE.Vector3(2.13, 1.14, 0.15), new THREE.Vector3(0.23, 0.3, 0.2), brownMat);

const neckPoints = [
  new THREE.Vector3(-0.78, 2.55, 0),
  new THREE.Vector3(-1.05, 3.25, 0.02),
  new THREE.Vector3(-0.91, 4.05, 0.01),
  new THREE.Vector3(-0.78, 4.83, 0.04),
  new THREE.Vector3(-0.72, 5.5, 0.04)
];

for (let i = 0; i < neckPoints.length - 1; i++) {
  balloonTube(neckPoints[i], neckPoints[i + 1], 0.34 - i * 0.018, yellowMat, 5);
  if (i > 0) knot(neckPoints[i], 0.22);
}
knot(neckPoints[0], 0.28);
knot(neckPoints[neckPoints.length - 1], 0.23);

const head = balloonSphere(new THREE.Vector3(-0.58, 5.72, 0.02), new THREE.Vector3(0.85, 0.57, 0.57), yellowMat);
head.rotation.z = -0.13;

const muzzle = balloonSphere(new THREE.Vector3(-1.19, 5.55, 0.02), new THREE.Vector3(0.42, 0.30, 0.43), yellowMat);
muzzle.rotation.z = 0.12;

const nostrilA = balloonSphere(new THREE.Vector3(-1.43, 5.6, -0.22), new THREE.Vector3(0.065, 0.045, 0.08), darkMat);
const nostrilB = balloonSphere(new THREE.Vector3(-1.43, 5.6, 0.22), new THREE.Vector3(0.065, 0.045, 0.08), darkMat);
nostrilA.rotation.y = 0.4;
nostrilB.rotation.y = -0.4;

const earLeftStart = new THREE.Vector3(-0.53, 5.97, -0.35);
const earLeftEnd = new THREE.Vector3(-0.37, 6.15, -0.83);
const earRightStart = new THREE.Vector3(-0.53, 5.97, 0.35);
const earRightEnd = new THREE.Vector3(-0.37, 6.15, 0.83);
balloonTube(earLeftStart, earLeftEnd, 0.17, yellowMat, 3);
balloonTube(earRightStart, earRightEnd, 0.17, yellowMat, 3);
balloonSphere(earLeftEnd, new THREE.Vector3(0.22, 0.13, 0.27), yellowMat);
balloonSphere(earRightEnd, new THREE.Vector3(0.22, 0.13, 0.27), yellowMat);

const ossiconeBases = [
  new THREE.Vector3(-0.7, 6.12, -0.23),
  new THREE.Vector3(-0.7, 6.12, 0.23)
];
for (const base of ossiconeBases) {
  const top = base.clone().add(new THREE.Vector3(0.04, 0.42, 0));
  balloonTube(base, top, 0.12, yellowMat, 3);
  balloonSphere(top, new THREE.Vector3(0.18, 0.16, 0.16), brownMat);
}

const eyeWhiteMat = new THREE.MeshPhysicalMaterial({
  color: 0xfffff4,
  roughness: 0.16,
  clearcoat: 0.6
});

for (const side of [-1, 1]) {
  const eye = balloonSphere(new THREE.Vector3(-0.88, 5.9, side * 0.49), new THREE.Vector3(0.15, 0.15, 0.08), eyeWhiteMat);
  eye.rotation.y = side * 0.3;
  const pupil = balloonSphere(new THREE.Vector3(-0.94, 5.91, side * 0.555), new THREE.Vector3(0.07, 0.085, 0.04), darkMat);
  pupil.rotation.y = side * 0.4;
  const lash = balloonTube(
    new THREE.Vector3(-0.91, 6.04, side * 0.52),
    new THREE.Vector3(-0.98, 6.14, side * 0.58),
    0.025,
    darkMat,
    3
  );
  lash.rotation.z = side * 0.3;
}

addSpot(new THREE.Vector3(0.18, 2.97, -0.84), new THREE.Vector3(0.35, 0.27, 0.08), new THREE.Euler(0.2, 0, 0.25));
addSpot(new THREE.Vector3(0.82, 2.36, -0.88), new THREE.Vector3(0.27, 0.20, 0.075), new THREE.Euler(0, 0.3, -0.4));
addSpot(new THREE.Vector3(-0.34, 1.92, -0.91), new THREE.Vector3(0.28, 0.20, 0.075), new THREE.Euler(0, 0, 0.15));
addSpot(new THREE.Vector3(-0.45, 3.73, -0.33), new THREE.Vector3(0.22, 0.30, 0.08), new THREE.Euler(0, 0.15, 0.25));
addSpot(new THREE.Vector3(-1.14, 4.38, -0.32), new THREE.Vector3(0.2, 0.26, 0.08), new THREE.Euler(0, 0, -0.25));
addSpot(new THREE.Vector3(-0.61, 4.91, -0.33), new THREE.Vector3(0.25, 0.19, 0.075), new THREE.Euler(0, 0, 0.2));
addSpot(new THREE.Vector3(-0.42, 5.81, -0.54), new THREE.Vector3(0.25, 0.20, 0.055), new THREE.Euler(0.1, 0.2, 0.45));
addSpot(new THREE.Vector3(-0.25, 5.47, 0.53), new THREE.Vector3(0.24, 0.18, 0.055), new THREE.Euler(-0.1, 0.2, -0.2));
addSpot(new THREE.Vector3(1.38, 2.12, 0.51), new THREE.Vector3(0.25, 0.18, 0.07), new THREE.Euler(0, 0.25, 0.3));
addSpot(new THREE.Vector3(-0.95, 1.3, -0.7), new THREE.Vector3(0.17, 0.23, 0.06), new THREE.Euler(0, 0, 0.2));
addSpot(new THREE.Vector3(1.08, 1.11, -0.66), new THREE.Vector3(0.16, 0.23, 0.06), new THREE.Euler(0, 0, -0.15));

const hemi = new THREE.HemisphereLight(0xfff5d7, 0x9c5936, 2.1);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4da, 4.0);
key.position.set(-5, 9, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0002;
scene.add(key);

const fill = new THREE.PointLight(0xffb76e, 42, 15, 2);
fill.position.set(4, 4.5, -4);
scene.add(fill);

const rim = new THREE.PointLight(0xffefbd, 28, 14, 2);
rim.position.set(-4, 6.5, -5);
scene.add(rim);

const backdrop = new THREE.Mesh(
  new THREE.SphereGeometry(20, 48, 32),
  new THREE.MeshBasicMaterial({ color: 0xfff1d7, side: THREE.BackSide })
);
backdrop.position.y = 4;
scene.add(backdrop);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
