<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cast-Iron Fire Hydrant</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #15181b; }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 24px;
      bottom: 20px;
      color: rgba(255,255,255,.72);
      font: 12px/1.5 system-ui, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Cast-Iron Fire Hydrant</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x171b1f);
    scene.fog = new THREE.Fog(0x171b1f, 13, 27);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 80);
    camera.position.set(7.6, 5.2, 9.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.25, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.minDistance = 7;
    controls.maxDistance = 18;
    controls.maxPolarAngle = Math.PI * 0.48;

    const redPaint = new THREE.MeshStandardMaterial({
      color: 0x9d1712,
      roughness: 0.72,
      metalness: 0.22
    });
    const redDark = new THREE.MeshStandardMaterial({
      color: 0x64100d,
      roughness: 0.8,
      metalness: 0.28
    });
    const redEdge = new THREE.MeshStandardMaterial({
      color: 0xb7251c,
      roughness: 0.65,
      metalness: 0.2
    });
    const bareIron = new THREE.MeshStandardMaterial({
      color: 0x292b2b,
      roughness: 0.58,
      metalness: 0.78
    });
    const exposedIron = new THREE.MeshStandardMaterial({
      color: 0x413b35,
      roughness: 0.82,
      metalness: 0.62,
      side: THREE.DoubleSide
    });
    const rust = new THREE.MeshStandardMaterial({
      color: 0x5e2412,
      roughness: 1,
      metalness: 0.12,
      side: THREE.DoubleSide
    });
    const chainMaterial = new THREE.MeshStandardMaterial({
      color: 0x252321,
      roughness: 0.62,
      metalness: 0.82
    });

    const hydrant = new THREE.Group();
    hydrant.rotation.y = -0.12;
    scene.add(hydrant);

    function mesh(geometry, material, parent = hydrant) {
      const object = new THREE.Mesh(geometry, material);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function cylinder(radiusTop, radiusBottom, height, material, segments = 48) {
      return mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments, 1, false), material);
    }

    function addBoltRing(y, radius, count, boltRadius, boltHeight, material, phase = 0) {
      for (let i = 0; i < count; i++) {
        const angle = phase + i / count * Math.PI * 2;
        const bolt = mesh(new THREE.CylinderGeometry(boltRadius, boltRadius, boltHeight, 6), material);
        bolt.position.set(Math.sin(angle) * radius, y, Math.cos(angle) * radius);
      }
    }

    const baseFoot = cylinder(1.58, 1.7, 0.25, redDark, 64);
    baseFoot.position.y = 0.2;

    const baseLip = cylinder(1.67, 1.67, 0.13, redPaint, 64);
    baseLip.position.y = 0.38;

    const baseSlope = cylinder(1.18, 1.5, 0.38, redPaint, 64);
    baseSlope.position.y = 0.61;

    const barrel = cylinder(1.04, 1.15, 2.55, redPaint, 64);
    barrel.position.y = 1.94;

    const lowerBand = cylinder(1.17, 1.17, 0.22, redEdge, 64);
    lowerBand.position.y = 0.87;

    const upperShoulder = cylinder(1.2, 1.05, 0.28, redPaint, 64);
    upperShoulder.position.y = 3.32;

    const bonnetFlange = cylinder(1.3, 1.3, 0.22, redDark, 64);
    bonnetFlange.position.y = 3.52;

    const bonnetRing = cylinder(1.36, 1.36, 0.14, redEdge, 64);
    bonnetRing.position.y = 3.65;

    const dome = mesh(
      new THREE.SphereGeometry(1.19, 64, 24, 0, Math.PI * 2, 0, Math.PI / 2),
      redPaint
    );
    dome.scale.y = 0.76;
    dome.position.y = 3.68;

    const crown = cylinder(0.42, 0.53, 0.2, redDark, 48);
    crown.position.y = 4.62;

    const nutBase = cylinder(0.29, 0.34, 0.16, bareIron, 6);
    nutBase.position.y = 4.79;

    const operatingNut = cylinder(0.245, 0.245, 0.38, bareIron, 5);
    operatingNut.position.y = 5.04;
    operatingNut.rotation.y = 0.18;

    addBoltRing(3.77, 1.1, 8, 0.105, 0.15, bareIron, Math.PI / 8);
    addBoltRing(0.48, 1.34, 8, 0.105, 0.15, bareIron, Math.PI / 8);

    function addNozzle(options) {
      const {
        direction,
        center,
        baseRadius,
        outerRadius,
        length,
        capMaterial,
        capDepth,
        capSides = 48
      } = options;

      const group = new THREE.Group();
      group.position.copy(center);
      hydrant.add(group);

      const axisIsX = Math.abs(direction.x) > 0.5;
      const sign = axisIsX ? Math.sign(direction.x) : Math.sign(direction.z);
      const orient = object => {
        if (axisIsX) object.rotation.z = -sign * Math.PI / 2;
        else object.rotation.x = sign * Math.PI / 2;
      };

      const collar = mesh(
        new THREE.CylinderGeometry(baseRadius * 1.16, baseRadius, 0.34, 48),
        redDark,
        group
      );
      orient(collar);
      collar.position.copy(direction.clone().multiplyScalar(0.05));

      const neck = mesh(
        new THREE.CylinderGeometry(outerRadius * 0.78, outerRadius * 0.82, length, 48),
        redPaint,
        group
      );
      orient(neck);
      neck.position.copy(direction.clone().multiplyScalar(length * 0.48 + 0.13));

      const flange = mesh(
        new THREE.CylinderGeometry(outerRadius, outerRadius, 0.24, 48),
        redEdge,
        group
      );
      orient(flange);
      flange.position.copy(direction.clone().multiplyScalar(length + 0.15));

      const cap = mesh(
        new THREE.CylinderGeometry(outerRadius * 0.88, outerRadius * 0.88, capDepth, capSides),
        capMaterial,
        group
      );
      orient(cap);
      cap.position.copy(direction.clone().multiplyScalar(length + 0.15 + capDepth * 0.55));

      const capFace = mesh(
        new THREE.CylinderGeometry(outerRadius * 0.63, outerRadius * 0.7, capDepth * 0.45, capSides),
        capMaterial,
        group
      );
      orient(capFace);
      capFace.position.copy(direction.clone().multiplyScalar(length + 0.15 + capDepth * 1.05));

      const capNut = mesh(
        new THREE.CylinderGeometry(outerRadius * 0.2, outerRadius * 0.2, capDepth * 0.54, 5),
        bareIron,
        group
      );
      orient(capNut);
      capNut.position.copy(direction.clone().multiplyScalar(length + 0.15 + capDepth * 1.48));

      const lugCount = axisIsX ? 4 : 6;
      for (let i = 0; i < lugCount; i++) {
        const angle = i / lugCount * Math.PI * 2;
        const lug = mesh(
          new THREE.BoxGeometry(0.16, 0.25, 0.22),
          redDark,
          group
        );

        if (axisIsX) {
          const radial = new THREE.Vector3(0, Math.cos(angle), Math.sin(angle));
          lug.position.copy(direction.clone().multiplyScalar(length + 0.15));
          lug.position.add(radial.multiplyScalar(outerRadius * 0.96));
          lug.rotation.x = angle;
        } else {
          const radial = new THREE.Vector3(Math.sin(angle), Math.cos(angle), 0);
          lug.position.copy(direction.clone().multiplyScalar(length + 0.15));
          lug.position.add(radial.multiplyScalar(outerRadius * 0.96));
          lug.rotation.z = -angle;
        }
      }

      return {
        group,
        chainAnchor: center.clone().add(direction.clone().multiplyScalar(length + 0.2))
      };
    }

    const frontNozzle = addNozzle({
      direction: new THREE.Vector3(0, 0, 1),
      center: new THREE.Vector3(0, 2.2, 0.86),
      baseRadius: 0.9,
      outerRadius: 0.86,
      length: 0.86,
      capMaterial: redDark,
      capDepth: 0.34,
      capSides: 48
    });

    const leftNozzle = addNozzle({
      direction: new THREE.Vector3(-1, 0, 0),
      center: new THREE.Vector3(-0.86, 2.55, 0),
      baseRadius: 0.57,
      outerRadius: 0.53,
      length: 0.58,
      capMaterial: redDark,
      capDepth: 0.27,
      capSides: 36
    });

    const rightNozzle = addNozzle({
      direction: new THREE.Vector3(1, 0, 0),
      center: new THREE.Vector3(0.86, 2.55, 0),
      baseRadius: 0.57,
      outerRadius: 0.53,
      length: 0.58,
      capMaterial: redDark,
      capDepth: 0.27,
      capSides: 36
    });

    function addChain(start, end, sag, linkCount, linkScale = 1) {
      const midpoint = start.clone().lerp(end, 0.5);
      midpoint.y -= sag;
      const curve = new THREE.QuadraticBezierCurve3(start, midpoint, end);
      const linkGeometry = new THREE.TorusGeometry(0.09 * linkScale, 0.024 * linkScale, 7, 12);

      for (let i = 0; i < linkCount; i++) {
        const t = i / (linkCount - 1);
        const link = mesh(linkGeometry, chainMaterial);
        link.position.copy(curve.getPoint(t));
        const tangent = curve.getTangent(t).normalize();
        link.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tangent);
        link.rotateOnAxis(tangent, i % 2 ? Math.PI / 2 : 0);
      }
    }

    addChain(
      new THREE.Vector3(-1.63, 2.49, 0),
      new THREE.Vector3(-0.98, 1.14, 0.25),
      0.42,
      18,
      0.92
    );
    addChain(
      new THREE.Vector3(1.63, 2.49, 0),
      new THREE.Vector3(1.02, 1.2, -0.22),
      0.42,
      18,
      0.92
    );

    function addBodyChip(angle, y, width, height, material = exposedIron, radius = 1.048) {
      const geometry = new THREE.CircleGeometry(0.5, 7);
      const chip = mesh(geometry, material);
      chip.scale.set(width, height, 1);
      chip.position.set(Math.sin(angle) * radius, y, Math.cos(angle) * radius);
      chip.rotation.y = angle;
      chip.rotation.z = angle * 0.41 + y * 0.23;
      chip.receiveShadow = false;
    }

    const chips = [
      [0.15, 1.16, 0.28, 0.1, exposedIron],
      [-0.42, 1.48, 0.12, 0.25, rust],
      [0.72, 1.76, 0.18, 0.09, exposedIron],
      [-1.12, 2.02, 0.24, 0.12, exposedIron],
      [2.3, 1.34, 0.17, 0.08, rust],
      [2.82, 2.5, 0.1, 0.23, exposedIron],
      [-2.44, 2.88, 0.22, 0.09, rust],
      [0.43, 3.0, 0.14, 0.07, exposedIron],
      [1.52, 1.08, 0.1, 0.18, exposedIron],
      [-0.04, 2.94, 0.08, 0.06, rust]
    ];
    for (const chipData of chips) addBodyChip(...chipData);

    function addDomeChip(angle, elevation, width, height) {
      const radius = 1.195;
      const horizontal = Math.cos(elevation) * radius;
      const chip = mesh(new THREE.CircleGeometry(0.5, 7), exposedIron);
      chip.scale.set(width, height, 1);
      chip.position.set(
        Math.sin(angle) * horizontal,
        3.68 + Math.sin(elevation) * radius * 0.76,
        Math.cos(angle) * horizontal
      );
      chip.lookAt(new THREE.Vector3(0, 3.68, 0));
      chip.rotateY(Math.PI);
      chip.rotateZ(angle * 0.3);
    }

    addDomeChip(0.2, 0.47, 0.2, 0.08);
    addDomeChip(-1.1, 0.67, 0.1, 0.16);
    addDomeChip(2.5, 0.3, 0.14, 0.07);

    const badge = new THREE.Group();
    badge.position.set(0, 2.23, 1.055);
    hydrant.add(badge);

    const badgeRing = mesh(new THREE.TorusGeometry(0.31, 0.055, 10, 32), redEdge, badge);
    const hVertical1 = mesh(new THREE.BoxGeometry(0.07, 0.35, 0.055), redEdge, badge);
    hVertical1.position.set(-0.12, 0, 0.012);
    const hVertical2 = mesh(new THREE.BoxGeometry(0.07, 0.35, 0.055), redEdge, badge);
    hVertical2.position.set(0.12, 0, 0.012);
    const hCross = mesh(new THREE.BoxGeometry(0.28, 0.07, 0.055), redEdge, badge);
    hCross.position.z = 0.012;

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x292b2a,
      roughness: 0.96,
      metalness: 0
    });
    const ground = new THREE.Mesh(new THREE.CircleGeometry(13, 96), groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0.065;
    ground.receiveShadow = true;
    scene.add(ground);

    const curbMaterial = new THREE.MeshStandardMaterial({
      color: 0x3b3d3b,
      roughness: 0.94
    });
    const curb = new THREE.Mesh(new THREE.BoxGeometry(14, 0.35, 1.2), curbMaterial);
    curb.position.set(0, -0.05, -5.2);
    curb.receiveShadow = true;
    curb.castShadow = true;
    scene.add(curb);

    scene.add(new THREE.HemisphereLight(0xb9d3e6, 0x2b1c14, 1.7));

    const keyLight = new THREE.DirectionalLight(0xffe2c0, 4.3);
    keyLight.position.set(5, 9, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -6;
    keyLight.shadow.camera.right = 6;
    keyLight.shadow.camera.top = 8;
    keyLight.shadow.camera.bottom = -3;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 24;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x6daeff, 2.1);
    rimLight.position.set(-6, 5, -5);
    scene.add(rimLight);

    const fillLight = new THREE.PointLight(0xff6d3b, 15, 10, 2);
    fillLight.position.set(3.5, 2.4, 4.5);
    scene.add(fillLight);

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
