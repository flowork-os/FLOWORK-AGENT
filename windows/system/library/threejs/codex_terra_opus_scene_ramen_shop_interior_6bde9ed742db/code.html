let seed = 981237;
function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a, b) { return a + (b - a) * rand(); }
function mat(color, rough = .7, metal = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
}
function mesh(geo, material, x=0, y=0, z=0) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}
function group() {
  const g = new THREE.Group();
  scene.add(g);
  return g;
}
function box(w,h,d,material,x,y,z,bevel=0) {
  let geo;
  if (bevel) {
    geo = new THREE.BoxGeometry(w,h,d,2,2,2);
    const p = geo.attributes.position;
    for(let i=0;i<p.count;i++){
      const vx=p.getX(i), vy=p.getY(i), vz=p.getZ(i);
      const sx=Math.sign(vx), sy=Math.sign(vy), sz=Math.sign(vz);
      if(Math.abs(vx)>w*.45) p.setX(i, vx-sx*bevel);
      if(Math.abs(vy)>h*.45) p.setY(i, vy-sy*bevel);
      if(Math.abs(vz)>d*.45) p.setZ(i, vz-sz*bevel);
    }
    geo.computeVertexNormals();
  } else geo = new THREE.BoxGeometry(w,h,d);
  return mesh(geo,material,x,y,z);
}
function cylinder(r1,r2,h,material,x,y,z,segments=16) {
  return mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material,x,y,z);
}
function sphere(r, material, x,y,z, sx=1,sy=1,sz=1) {
  const m=mesh(new THREE.SphereGeometry(r,20,14),material,x,y,z);
  m.scale.set(sx,sy,sz);
  return m;
}
function canvasTexture(draw, w=256, h=256) {
  const c=document.createElement("canvas");
  c.width=w;c.height=h;
  const ctx=c.getContext("2d");
  draw(ctx,w,h);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}

    c.lineWidth=range(1,3);c.beginPath();c.moveTo(0,y+range(-2,2));
    for(let x=0;x<w;x+=25)c.lineTo(x,y+Math.sin(x*.06+y)*2+range(-2,2));
    c.stroke();
  }
},512,512);

function signTexture(text, subtitle="") {
  return canvasTexture((c,w,h)=>{
    c.fillStyle="#d6bd8c";c.fillRect(0,0,w,h);
    c.strokeStyle="#4a301d";c.lineWidth=9;c.strokeRect(7,7,w-14,h-14);
    c.fillStyle="#201419";c.font="bold 58px serif";c.textAlign="center";
    c.fillText(text,w/2,h*.55);
    if(subtitle){c.font="16px sans-serif";c.fillText(subtitle,w/2,h*.82);}
    for(let i=0;i<18;i++){c.fillStyle="rgba(80,40,20,.12)";c.fillRect(rand()*w,rand()*h,2,2);}
  },256,170);
}

}

  const lid=mesh(new THREE.SphereGeometry(.36*scale,18,8,0,Math.PI*2,0,Math.PI/2),mat(0x4b4d4c,.32,.62),x,1.98,z);

function ramen(x,z,variant=0) {
  const g=group();

  const rim=mesh(new THREE.TorusGeometry(.45,.055,10,24),ceramic,x,2.91,z);
  rim.rotation.x=Math.PI/2;
  const broth=cylinder(.39,.39,.025,soup,x,2.915,z,24);
  g.add(bowl,rim,broth);
  for(let i=0;i<18;i++){
    const noodle=mesh(new THREE.TorusGeometry(.16+rand()*.14,.018,5,12,Math.PI*1.2),riceMat,x,2.945,z);
    noodle.scale.set(1,.23,1);
    noodle.rotation.set(0,rand()*Math.PI,0);
    noodle.position.x+=range(-.07,.07);noodle.position.z+=range(-.07,.07);
    g.add(noodle);
  }
  for(let i=0;i<3;i++){
    const scallion=cylinder(.025,.025,.03,mat(0x4f9b4a,.72),x+range(-.22,.22),2.97,z+range(-.18,.18),8);
    g.add(scallion);
  }
  const egg=sphere(.105,riceMat,x+.16,2.97,z-.08,1, .25,1);
  const yolk=sphere(.052,mat(0xf5a832,.48),x+.16,2.994,z-.08,1,.2,1);
  const nori=box(.18,.27,.018,noriMat,x-.19,3.06,z+.08);
  nori.rotation.x=-.28;
  const c1=box(.035,.035,.9,mat(0x4d2313,.52),x-.14,3.2,z+.04);
  const c2=box(.035,.035,.9,mat(0x4d2313,.52),x+.02,3.22,z+.07);
  c1.rotation.set(.15,.28,-.9);c2.rotation.set(.12,.18,-.88);
  g.add(egg,yolk,nori,c1,c2);
  return {g, x, z};
}

function lantern(x,y,z,scale=1) {
  const g=group();
  const paper=mat(0xffc56d,.8);
  paper.emissive=new THREE.Color(0xe96c28);
  paper.emissiveIntensity=.45;
  const body=cylinder(.23*scale,.23*scale,.54*scale,paper,x,y,z,18);
  body.scale.set(1,1,1);
  const top=cylinder(.15*scale,.15*scale,.06*scale,brass,x,y+.3*scale,z,16);
  const bottom=cylinder(.15*scale,.15*scale,.06*scale,brass,x,y-.3*scale,z,16);
  const cord=box(.018,.45*scale,.018,charcoal,x,y+.55*scale,z);
  const tassel=box(.04,.16*scale,.04,redWood,x,y-.4*scale,z);
  for(let a=0;a<4;a++){
    const stripe=mesh(new THREE.TorusGeometry(.235*scale,.011*scale,5,18),redWood,x,y-.17*scale+a*.115*scale,z);
    stripe.rotation.x=Math.PI/2;g.add(stripe);
  }
  g.add(body,top,bottom,cord,tassel);
  const light=new THREE.PointLight(0xffa34c,1.7*scale,3.7*scale,2);
  light.position.set(x,y,z);scene.add(light);
  return g;
}

const steamParticles=[];
function steam(x,y,z,count=7,spread=.16) {
  const texture=canvasTexture((c,w,h)=>{
    const g=c.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
    g.addColorStop(0,"rgba(255,247,224,.65)");
    g.addColorStop(.35,"rgba(255,235,207,.25)");
    g.addColorStop(1,"rgba(255,240,220,0)");
    c.fillStyle=g;c.fillRect(0,0,w,h);
  },64,64);
  const material=new THREE.SpriteMaterial({map:texture,transparent:true,depthWrite:false,opacity:.42,blending:THREE.NormalBlending});
  for(let i=0;i<count;i++){
    const s=new THREE.Sprite(material.clone());
    s.position.set(x+range(-spread,spread),y+rand()*.45,z+range(-spread,spread));
    const q=range(.14,.29);s.scale.set(q,q,q);
    s.userData={x,z,base:y,phase:rand()*Math.PI*2,speed:range(.38,.7),spread};
    scene.add(s);steamParticles.push(s);
  }
}

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  lanterns.forEach((l,i)=>{
    l.rotation.z=Math.sin(t*.75+i*.9)*.035;
    l.position.y=Math.sin(t*.55+i)*.018;
  });
  steamParticles.forEach((s,i)=>{
    const d=s.userData;
    const u=(t*d.speed+d.phase)%1;
    s.position.x=d.x+Math.sin(t*1.7+d.phase)*d.spread*(.35+u);
    s.position.z=d.z+Math.cos(t*1.3+d.phase)*d.spread*(.35+u);
    s.position.y=d.base+u*1.05;
    const k=.12+u*.24;
    s.scale.set(k,k,k);
    s.material.opacity=(1-u)*.34;
  });
  doorway.children.forEach(o=>{
    if(o.userData.noren){
      const d=o.userData.noren;
      o.position.x=d.baseX+Math.sin(t*1.1+d.phase)*.025;
      o.rotation.z=Math.sin(t*1.1+d.phase)*.045;
    }
  });
  stoveGlow.material.opacity=.7+Math.sin(t*9)*.25;
  fireLight.intensity=4.3+Math.sin(t*8)*.7+Math.sin(t*15)*.28;
  counterLight.intensity=2.8+Math.sin(t*.8)*.18;
  controls.update();
  renderer.render(scene,camera);
}
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
animate();
</script>
</body>
</html>
