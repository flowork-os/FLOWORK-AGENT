<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kawaii Milk Carton</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #17181d;
  }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   Renderer / Scene / Camera
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1d23);
scene.fog = new THREE.Fog(0x1b1d23, 9, 22);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.6, 2.0, 5.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 2.6;
controls.maxDistance = 12;
controls.target.set(0, 1.05, 0);
controls.maxPolarAngle = Math.PI * 0.52;
controls.update();

/* ============================================================
   Lighting: hemisphere + key + fill + rim
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xdfe9ff, 0x2a2b33, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e6, 2.35);
key.position.set(3.4, 5.6, 4.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 22;
key.shadow.camera.left = -4.5;
key.shadow.camera.right = 4.5;
key.shadow.camera.top = 4.5;
key.shadow.camera.bottom = -4.5;
key.shadow.bias = -0.0012;
key.shadow.normalBias = 0.022;
key.shadow.radius = 3.5;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd6ff, 0.7);
fill.position.set(-4.2, 2.2, 3.0);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9ec, 1.15);
rim.position.set(-2.0, 3.2, -4.6);
scene.add(rim);

const bounce = new THREE.PointLight(0xffffff, 6.0, 9, 2);
bounce.position.set(0, 0.5, 2.6);
scene.add(bounce);

/* ============================================================
   Ground: shadow-only
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   Materials
   ============================================================ */
const PASTEL_BLUE = 0x9fd3f2;
const CREAM_WHITE = 0xfaf7f2;

const matCartonWhite = new THREE.MeshPhysicalMaterial({
  color: CREAM_WHITE,
  roughness: 0.30,
  metalness: 0.0,
  clearcoat: 0.85,
  clearcoatRoughness: 0.16,
  sheen: 0.25,
  sheenColor: new THREE.Color(0xffffff)
});

const matCartonBlue = new THREE.MeshPhysicalMaterial({
  color: PASTEL_BLUE,
  roughness: 0.26,
  metalness: 0.0,
  clearcoat: 0.9,
  clearcoatRoughness: 0.14,
  sheen: 0.3,
  sheenColor: new THREE.Color(0xdff2ff)
});

const matBlueDeep = new THREE.MeshPhysicalMaterial({
  color: 0x6fb8e6,
  roughness: 0.3,
  clearcoat: 0.8,
  clearcoatRoughness: 0.18
});

const matNavy = new THREE.MeshStandardMaterial({ color: 0x2f4c66, roughness: 0.45 });
const matEyeWhite = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, roughness: 0.12, clearcoat: 1.0, clearcoatRoughness: 0.05
});
const matEyeDark = new THREE.MeshPhysicalMaterial({
  color: 0x241f2b, roughness: 0.08, clearcoat: 1.0, clearcoatRoughness: 0.04
});
const matGlint = new THREE.MeshBasicMaterial({ color: 0xffffff });
const matBlush = new THREE.MeshBasicMaterial({
  color: 0xff9fb4, transparent: true, opacity: 0.62
});
const matMouth = new THREE.MeshStandardMaterial({ color: 0x3a2130, roughness: 0.5 });
const matTongue = new THREE.MeshStandardMaterial({ color: 0xff7f9a, roughness: 0.45 });
const matSparkle = new THREE.MeshBasicMaterial({ color: 0xfff4b0 });
const matCowBlack = new THREE.MeshStandardMaterial({ color: 0x3b3a44, roughness: 0.55 });
const matCowPink = new THREE.MeshStandardMaterial({ color: 0xffb3c6, roughness: 0.55 });
const matCap = new THREE.MeshPhysicalMaterial({
  color: 0xffe1a8, roughness: 0.25, clearcoat: 0.9, clearcoatRoughness: 0.1
});

/* ============================================================
   Root object
   ============================================================ */
const carton = new THREE.Group();
scene.add(carton);

/* ---- dimensions (meters-ish; a chubby ~20cm carton) ---- */
const W = 0.70;        // half-width X of body
const D = 0.62;        // half-depth Z of body
const BODY_BOTTOM = 0.02;
const BODY_TOP = 1.34;  // where the gable starts
const GABLE_TOP = 1.86; // ridge height
const RIDGE_HALF = 0.055; // half thickness of ridge fin in X
const FIN_TOP = 2.02;   // top of the crimped fin

/* ============================================================
   Helper: build the chubby body as an extruded rounded box
   with a slight barrel bulge (chubby look).
   ============================================================ */
function makeChubbyBody() {
  // Rounded square cross-section profile in XZ, lofted along Y with a bulge.
  const RADIAL = 96;   // points around cross-section
  const RINGS = 40;    // vertical segments

  const cornerR = 0.20;

  // Superellipse-ish rounded square: parametric by angle with rounded corners.
  function crossSection(t, scale) {
    // t in [0,1) around the perimeter of a rounded rectangle
    const hw = Math.max(W * scale - cornerR, 0.001);
    const hd = Math.max(D * scale - cornerR, 0.001);
    const r = cornerR;
    const ang = t * Math.PI * 2;
    // Use squircle formulation, guaranteed finite
    const c = Math.cos(ang);
    const s = Math.sin(ang);
    const n = 4.5; // squircle exponent -> rounded square
    const ac = Math.pow(Math.abs(c), 2 / n);
    const as = Math.pow(Math.abs(s), 2 / n);
    const x = Math.sign(c) * ac * (hw + r);
    const z = Math.sign(s) * as * (hd + r);
    return [x, z];
  }

  const positions = [];
  const normals = [];
  const uvs = [];
  const indices = [];

  for (let j = 0; j <= RINGS; j++) {
    const v = j / RINGS;
    const y = BODY_BOTTOM + v * (BODY_TOP - BODY_BOTTOM);
    // chubby bulge: widest around 45% height
    const bulge = 1.0 + 0.075 * Math.sin(Math.PI * Math.min(Math.max(v, 0), 1));
    // slight taper near very bottom & top for softness
    const soften = 1.0 - 0.05 * Math.pow(Math.abs(v * 2 - 1), 6);
    const scale = bulge * soften;

    for (let i = 0; i <= RADIAL; i++) {
      const t = i / RADIAL;
      const [x, z] = crossSection(t, scale);
      positions.push(x, y, z);
      const nl = Math.hypot(x, z) || 1;
      normals.push(x / nl, 0.06, z / nl);
      uvs.push(t, v);
    }
  }

  for (let j = 0; j < RINGS; j++) {
    for (let i = 0; i < RADIAL; i++) {
      const a = j * (RADIAL + 1) + i;
      const b = a + 1;
      const c = a + (RADIAL + 1);
      const d = c + 1;
      indices.push(a, c, b);
      indices.push(b, c, d);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

const bodyGeo = makeChubbyBody();
const body = new THREE.Mesh(bodyGeo, matCartonWhite);
body.castShadow = true;
body.receiveShadow = true;
carton.add(body);

/* Bottom cap (rounded plate) */
const bottomCap = new THREE.Mesh(
  new THREE.CylinderGeometry(W * 0.99, W * 0.86, 0.09, 48),
  matCartonWhite
);
bottomCap.position.y = BODY_BOTTOM + 0.02;
bottomCap.scale.z = D / W;
bottomCap.castShadow = true;
bottomCap.receiveShadow = true;
carton.add(bottomCap);

/* ============================================================
   Gable top: two slanted roof faces + two triangular side gables
   Built explicitly from vertices so it is exact and non-degenerate.
   ============================================================ */
function makeGableGeometry() {
  const bw = W * 1.03;   // matches bulged body at top-ish
  const bd = D * 1.03;
  const rx = RIDGE_HALF;

  // Bottom rectangle corners (y = BODY_TOP)
  // Ridge runs along X axis at y = GABLE_TOP, spanning -bw..bw in X, +-rx in Z
  const b0 = [-bw, BODY_TOP, -bd];
  const b1 = [ bw, BODY_TOP, -bd];
  const b2 = [ bw, BODY_TOP,  bd];
  const b3 = [-bw, BODY_TOP,  bd];

  const r0 = [-bw, GABLE_TOP, -rx];
  const r1 = [ bw, GABLE_TOP, -rx];
  const r2 = [ bw, GABLE_TOP,  rx];
  const r3 = [-bw, GABLE_TOP,  rx];

  const verts = [];
  function tri(a, b, c) {
    verts.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
  }
  function quad(a, b, c, d) { tri(a, b, c); tri(a, c, d); }

  // Front slanted roof (+Z side): b3 -> b2 -> r2 -> r3
  quad(b3, b2, r2, r3);
  // Back slanted roof (-Z side): b1 -> b0 -> r0 -> r1
  quad(b1, b0, r0, r1);
  // Left triangular gable (-X): b0 -> b3 -> r3 -> r0
  quad(b0, b3, r3, r0);
  // Right triangular gable (+X): b2 -> b1 -> r1 -> r2
  quad(b2, b1, r1, r2);
  // Top of ridge (small strip)
  quad(r3, r2, r1, r0);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.computeVertexNormals();
  return geo;
}

const gable = new THREE.Mesh(makeGableGeometry(), matCartonBlue);
gable.castShadow = true;
gable.receiveShadow = true;
carton.add(gable);

/* Crimped fin on top of the gable ridge */
const fin = new THREE.Mesh(
  new THREE.BoxGeometry(W * 2.06, FIN_TOP - GABLE_TOP, RIDGE_HALF * 2.1),
  matCartonBlue
);
fin.position.set(0, (GABLE_TOP + FIN_TOP) / 2, 0);
fin.castShadow = true;
fin.receiveShadow = true;
carton.add(fin);

/* Crimp ribs along the fin */
const ribGeo = new THREE.BoxGeometry(0.035, (FIN_TOP - GABLE_TOP) * 0.86, RIDGE_HALF * 2.45);
for (let i = -6; i <= 6; i++) {
  const rib = new THREE.Mesh(ribGeo, matBlueDeep);
  rib.position.set(i * 0.105, (GABLE_TOP + FIN_TOP) / 2, 0);
  rib.castShadow = true;
  carton.add(rib);
}

/* Fin top rounded edge */
const finTopEdge = new THREE.Mesh(
  new THREE.CylinderGeometry(RIDGE_HALF * 1.05, RIDGE_HALF * 1.05, W * 2.06, 20, 1, false),
  matBlueDeep
);
finTopEdge.rotation.z = Math.PI / 2;
finTopEdge.position.set(0, FIN_TOP, 0);
finTopEdge.castShadow = true;
carton.add(finTopEdge);

/* ============================================================
   Screw cap on the front roof slope (cute detail)
   ============================================================ */
const capGroup = new THREE.Group();
{
  const roofRise = GABLE_TOP - BODY_TOP;
  const roofRun = D * 1.03 - RIDGE_HALF;
  const slopeAngle = Math.atan2(roofRise, roofRun); // rotation about X

  const capBase = new THREE.Mesh(
    new THREE.CylinderGeometry(0.115, 0.125, 0.05, 32),
    matCap
  );
  const capTop = new THREE.Mesh(
    new THREE.CylinderGeometry(0.10, 0.115, 0.075, 32),
    matCap
  );
  capTop.position.y = 0.058;
  // ridges on the cap
  const capRidgeGeo = new THREE.BoxGeometry(0.012, 0.075, 0.028);
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const r = new THREE.Mesh(capRidgeGeo, matCap);
    r.position.set(Math.cos(a) * 0.108, 0.058, Math.sin(a) * 0.108);
    r.rotation.y = -a;
    r.castShadow = true;
    capGroup.add(r);
  }
  capBase.castShadow = true;
  capTop.castShadow = true;
  capGroup.add(capBase, capTop);

  // place mid-way up the +Z roof slope
  const tPos = 0.42;
  const py = GABLE_TOP - roofRise * tPos;
  const pz = RIDGE_HALF + roofRun * tPos;
  capGroup.position.set(W * 0.46, py, pz);
  capGroup.rotation.x = -(Math.PI / 2 - slopeAngle);
}
carton.add(capGroup);

/* ============================================================
   Printed panels: pastel-blue wrap bands (extruded thin shells
   that hug the body silhouette so they don't z-fight).
   ============================================================ */
function makeBandGeometry(yBottom, yTop, inflate) {
  const RADIAL = 96;
  const cornerR = 0.20;
  const positions = [];
  const indices = [];
  const uvs = [];

  function section(t, scale) {
    const hw = W * scale - cornerR;
    const hd = D * scale - cornerR;
    const ang = t * Math.PI * 2;
    const c = Math.cos(ang), s = Math.sin(ang);
    const n = 4.5;
    const ac = Math.pow(Math.abs(c), 2 / n);
    const as = Math.pow(Math.abs(s), 2 / n);
    return [Math.sign(c) * ac * (hw + cornerR), Math.sign(s) * as * (hd + cornerR)];
  }

  const RINGS = 10;
  for (let j = 0; j <= RINGS; j++) {
    const v = j / RINGS;
    const y = yBottom + v * (yTop - yBottom);
    const vv = (y - BODY_BOTTOM) / (BODY_TOP - BODY_BOTTOM);
    const bulge = 1.0 + 0.075 * Math.sin(Math.PI * Math.min(Math.max(vv, 0), 1));
    const soften = 1.0 - 0.05 * Math.pow(Math.abs(vv * 2 - 1), 6);
    const scale = bulge * soften * inflate;
    for (let i = 0; i <= RADIAL; i++) {
      const t = i / RADIAL;
      const [x, z] = section(t, scale);
      positions.push(x, y, z);
      uvs.push(t, v);
    }
  }
  for (let j = 0; j < RINGS; j++) {
    for (let i = 0; i < RADIAL; i++) {
      const a = j * (RADIAL + 1) + i;
      const b = a + 1;
      const c = a + (RADIAL + 1);
      const d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

// Lower blue band (like printed base of carton)
const bandLow = new THREE.Mesh(makeBandGeometry(0.06, 0.44, 1.006), matCartonBlue);
bandLow.castShadow = true;
bandLow.receiveShadow = true;
carton.add(bandLow);

// Thin accent stripe
const stripe = new THREE.Mesh(makeBandGeometry(0.47, 0.525, 1.008), matBlueDeep);
carton.add(stripe);

// Upper blue band right under the gable
const bandHigh = new THREE.Mesh(makeBandGeometry(1.15, 1.335, 1.006), matCartonBlue);
bandHigh.castShadow = true;
carton.add(bandHigh);

/* ============================================================
   Utility: surface point + outward normal on the front (+Z) face
   so decals sit flush on the bulged body.
   ============================================================ */
function frontZ(y, xFrac) {
  // Approximate the +Z surface at given world y and x fraction (-1..1)
  const vv = THREE.MathUtils.clamp((y - BODY_BOTTOM) / (BODY_TOP - BODY_BOTTOM), 0, 1);
  const bulge = 1.0 + 0.075 * Math.sin(Math.PI * vv);
  const soften = 1.0 - 0.05 * Math.pow(Math.abs(vv * 2 - 1), 6);
  const scale = bulge * soften;
  const n = 4.5;
  // squircle: |x/(A)|^n + |z/(B)|^n = 1 approx, solve for z
  const A = W * scale;
  const B = D * scale;
  const xr = THREE.MathUtils.clamp(Math.abs(xFrac), 0, 0.97);
  const inner = Math.max(1 - Math.pow(xr, n), 1e-4);
  return B * Math.pow(inner, 1 / n);
}

/* ============================================================
   Printed cow (simple, cartoon) on the front lower panel
   ============================================================ */
const cowGroup = new THREE.Group();
{
  const cy = 0.72;     // cow center height
  const zBase = frontZ(cy, 0) + 0.004;

  // helper to place a flat-ish disc/shape onto the front
  function put(mesh, x, y, extraZ = 0) {
    const z = frontZ(y, x / W) + 0.005 + extraZ;
    mesh.position.set(x, y, z);
    cowGroup.add(mesh);
    return mesh;
  }

  const cowWhite = new THREE.MeshStandardMaterial({ color: 0xfdfcf9, roughness: 0.4 });

  // Head (rounded)
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.155, 32, 24), cowWhite);
  head.scale.set(1.0, 0.88, 0.28);
  put(head, 0, cy + 0.055);

  // Muzzle
  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.095, 28, 20), matCowPink);
  muzzle.scale.set(1.15, 0.8, 0.3);
  put(muzzle, 0, cy - 0.035, 0.012);

  // Nostrils
  for (const sx of [-1, 1]) {
    const nos = new THREE.Mesh(new THREE.SphereGeometry(0.018, 16, 12), matCowBlack);
    nos.scale.set(1, 1.2, 0.35);
    put(nos, sx * 0.038, cy - 0.03, 0.028);
  }

  // Ears
  for (const sx of [-1, 1]) {
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.062, 20, 16), cowWhite);
    ear.scale.set(1.25, 0.7, 0.25);
    const e = put(ear, sx * 0.175, cy + 0.10);
    e.rotation.z = sx * 0.5;
  }

  // Horns (tiny)
  for (const sx of [-1, 1]) {
    const horn = new THREE.Mesh(new THREE.SphereGeometry(0.03, 16, 12), matCap);
    horn.scale.set(0.9, 1.1, 0.3);
    put(horn, sx * 0.085, cy + 0.185);
  }

  // Cow eyes
  for (const sx of [-1, 1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.026, 18, 14), matCowBlack);
    e.scale.set(1, 1.15, 0.35);
    put(e, sx * 0.062, cy + 0.085, 0.02);
  }

  // Spots on the head
  const spotA = new THREE.Mesh(new THREE.SphereGeometry(0.055, 20, 16), matCowBlack);
  spotA.scale.set(1.1, 0.85, 0.2);
  put(spotA, -0.10, cy + 0.135, 0.012);

  const spotB = new THREE.Mesh(new THREE.SphereGeometry(0.042, 20, 16), matCowBlack);
  spotB.scale.set(1.0, 0.9, 0.2);
  put(spotB, 0.115, cy + 0.02, 0.012);

  // little printed "milk drop" beside the cow
  for (const sx of [-1, 1]) {
    const drop = new THREE.Mesh(new THREE.SphereGeometry(0.045, 20, 16), matCartonBlue);
    drop.scale.set(0.85, 1.15, 0.16);
    put(drop, sx * 0.40, cy + 0.02, 0.0);
  }
  void zBase;
}
carton.add(cowGroup);

/* ============================================================
   Rounded cartoon typography: "MILK" built from tube/capsule strokes
   ============================================================ */
function strokeMesh(points, radius, material) {
  const pts = points.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.0);
  const geo = new THREE.TubeGeometry(curve, Math.max(12, pts.length * 8), radius, 12, false);
  const m = new THREE.Mesh(geo, material);
  m.castShadow = false;
  return m;
}

function buildWord() {
  const g = new THREE.Group();
  const R = 0.028;
  const baseY = 1.02;
  const h = 0.15;
  const mat = matNavy;

  // Letter layout along X, letters drawn in local XY then pushed onto surface Z
  function surfPt(x, y) { return [x, y, frontZ(y, x / W) + 0.010]; }

  function addStroke(pts2d) {
    const p3 = pts2d.map(([x, y]) => surfPt(x, y));
    g.add(strokeMesh(p3, R, mat));
  }
  function addDot(x, y, r = R * 1.05) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), mat);
    const p = surfPt(x, y);
    s.position.set(p[0], p[1], p[2]);
    g.add(s);
  }

  const yb = baseY, yt = baseY + h;

  // M
  const mx = -0.34;
  addStroke([[mx - 0.055, yb], [mx - 0.055, yt]]);
  addStroke([[mx - 0.055, yt], [mx, yb + h * 0.42], [mx + 0.055, yt]]);
  addStroke([[mx + 0.055, yt], [mx + 0.055, yb]]);

  // I
  const ix = -0.175;
  addStroke([[ix, yb], [ix, yt - 0.03]]);
  addDot(ix, yt + 0.035, R * 1.15);

  // L
  const lx = -0.045;
  addStroke([[lx, yt], [lx, yb], [lx + 0.085, yb]]);

  // K
  const kx = 0.135;
  addStroke([[kx, yb], [kx, yt]]);
  addStroke([[kx + 0.085, yt], [kx, yb + h * 0.48]]);
  addStroke([[kx, yb + h * 0.48], [kx + 0.09, yb]]);

  // trailing sparkle stars beside the word
  for (const [sx, sy, ss] of [[0.325, yt + 0.02, 0.75], [0.365, yb + 0.03, 0.5]]) {
    const star = makeStar(0.035 * ss + 0.018, matSparkle);
    const p = surfPt(sx, sy);
    star.position.set(p[0], p[1], p[2]);
    g.add(star);
  }

  g.position.x = 0.06;
  return g;
}

function makeStar(size, material) {
  const grp = new THREE.Group();
  const a = new THREE.Mesh(new THREE.SphereGeometry(size, 12, 8), material);
  a.scale.set(0.22, 1.0, 0.22);
  const b = new THREE.Mesh(new THREE.SphereGeometry(size, 12, 8), material);
  b.scale.set(1.0, 0.22, 0.22);
  grp.add(a, b);
  return grp;
}

carton.add(buildWord());

/* ============================================================
   FACE — oversized sparkling eyes, blush, big smile
   Placed on the upper front of the body.
   ============================================================ */
const face = new THREE.Group();
carton.add(face);

const EYE_Y = 0.72 + 0.0; // will be reassigned below
const faceY = 1.02;

// Because the cow print lives low-center, put the face on the upper area:
// eyes around y = 1.16, mouth around y = 1.02 -> but bandHigh is at 1.15.
// Instead: face occupies the mid-upper zone between stripe and bandHigh.
const eyeY = 1.00;
const mouthY = 0.86;

/* Reposition: move cow lower and word will conflict — adjust groups */
cowGroup.position.y = -0.30;   // cow slides toward the bottom band area
cowGroup.position.x = 0.0;

/* Move the word to the lower-left area under the face */
scene.updateMatrixWorld(false);

function surfacePoint(x, y, offset) {
  const z = frontZ(y, x / W) + offset;
  return new THREE.Vector3(x, y, z);
}

/* ---- Eyes ---- */
function makeEye(sideX) {
  const g = new THREE.Group();
  const p = surfacePoint(sideX, eyeY, 0.0);

  // eye white base (big kawaii oval)
  const whiteGeo = new THREE.SphereGeometry(0.175, 40, 30);
  const white = new THREE.Mesh(whiteGeo, matEyeWhite);
  white.scale.set(0.86, 1.0, 0.34);
  white.position.set(0, 0, 0.012);
  g.add(white);

  // dark iris
  const iris = new THREE.Mesh(new THREE.SphereGeometry(0.148, 40, 30), matEyeDark);
  iris.scale.set(0.84, 1.0, 0.34);
  iris.position.set(0, -0.004, 0.028);
  g.add(iris);

  // colored inner ring (soft blue)
  const ring = new THREE.Mesh(
    new THREE.SphereGeometry(0.104, 32, 24),
    new THREE.MeshStandardMaterial({ color: 0x4fa8dc, roughness: 0.2 })
  );
  ring.scale.set(0.84, 0.86, 0.22);
  ring.position.set(0, -0.030, 0.046);
  g.add(ring);

  // pupil
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.058, 24, 18), matEyeDark);
  pupil.scale.set(1, 1, 0.3);
  pupil.position.set(0, -0.030, 0.058);
  g.add(pupil);

  // big glint
  const glint = new THREE.Mesh(new THREE.SphereGeometry(0.048, 24, 18), matGlint);
  glint.scale.set(1, 1.1, 0.25);
  glint.position.set(-0.045 * Math.sign(sideX || 1), 0.055, 0.062);
  g.add(glint);

  // small glint
  const glint2 = new THREE.Mesh(new THREE.SphereGeometry(0.026, 20, 14), matGlint);
  glint2.scale.set(1, 1, 0.25);
  glint2.position.set(0.052 * Math.sign(sideX || 1), -0.062, 0.058);
  g.add(glint2);

  // lower sparkle sheen
  const sheen = new THREE.Mesh(new THREE.SphereGeometry(0.062, 24, 16), new THREE.MeshBasicMaterial({
    color: 0xbfe6ff, transparent: true, opacity: 0.55
  }));
  sheen.scale.set(1.1, 0.5, 0.2);
  sheen.position.set(0, -0.088, 0.05);
  g.add(sheen);

  // top eyelash / lid accent
  const lid = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.017, 12, 40, Math.PI * 0.72), matEyeDark);
  lid.rotation.z = Math.PI * 0.14;
  lid.position.set(0, 0.006, 0.04);
  lid.scale.set(0.9, 1.0, 0.6);
  g.add(lid);

  g.position.copy(p);
  // gentle outward tilt so they follow the curved front
  g.rotation.y = -sideX * 0.28;
  return g;
}

face.add(makeEye(-0.30));
face.add(makeEye(0.30));

/* ---- Blush cheeks ---- */
function makeBlush(sideX) {
  const g = new THREE.Group();
  const p = surfacePoint(sideX, eyeY - 0.155, 0.004);
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.10, 28, 20), matBlush);
  b.scale.set(1.25, 0.78, 0.16);
  g.add(b);

  // little highlight lines on the blush
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xff7f9c, transparent: true, opacity: 0.55 });
  for (let i = -1; i <= 1; i++) {
    const ln = new THREE.Mesh(new THREE.CapsuleGeometry(0.008, 0.055, 4, 8), lineMat);
    ln.rotation.z = 0.35;
    ln.position.set(i * 0.048, 0, 0.02);
    g.add(ln);
  }
  g.position.copy(p);
  g.rotation.y = -sideX * 0.30;
  return g;
}
face.add(makeBlush(-0.475));
face.add(makeBlush(0.475));

/* ---- Big open smile ---- */
function makeSmile() {
  const g = new THREE.Group();

  // Build a "D"-shaped open mouth: half-disc facing +Z
  const shape = new THREE.Shape();
  const rw = 0.175, rh = 0.115;
  shape.moveTo(-rw, 0);
  shape.bezierCurveTo(-rw, -rh * 1.75, rw, -rh * 1.75, rw, 0);
  shape.bezierCurveTo(rw * 0.55, 0.045, -rw * 0.55, 0.045, -rw, 0);

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: 0.055,
    bevelEnabled: true,
    bevelThickness: 0.014,
    bevelSize: 0.014,
    bevelSegments: 4,
    curveSegments: 24
  });
  geo.center();
  const mouth = new THREE.Mesh(geo, matMouth);
  g.add(mouth);

  // tongue
  const tongue = new THREE.Mesh(new THREE.SphereGeometry(0.075, 24, 18), matTongue);
  tongue.scale.set(1.15, 0.62, 0.55);
  tongue.position.set(0, -0.052, 0.03);
  g.add(tongue);

  const p = surfacePoint(0, mouthY, -0.012);
  g.position.copy(p);
  return g;
}
face.add(makeSmile());

/* Reposition word lower-left so it doesn't collide with the face */
/* (buildWord already sits at ~y 1.02; move that group down/right) */
carton.children.forEach(c => { /* no-op guard */ });

/* We rebuild placement: find the word group (last added before face) */
/* Simpler: explicitly track it */
// (handled below by tagging)

/* ============================================================
   Arms — tiny stubby arms raised cheerfully
   ============================================================ */
function makeArm(sideX) {
  const g = new THREE.Group();
  const mat = matCartonWhite;

  // upper stub
  const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.085, 0.20, 10, 20), mat);
  upper.castShadow = true;
  upper.position.set(0, 0.13, 0);
  g.add(upper);

  // mitten hand
  const hand = new THREE.Mesh(new THREE.SphereGeometry(0.115, 28, 22), matCartonBlue);
  hand.scale.set(1.0, 0.92, 0.86);
  hand.position.set(0, 0.30, 0);
  hand.castShadow = true;
  g.add(hand);

  // thumb nub
  const thumb = new THREE.Mesh(new THREE.SphereGeometry(0.045, 18, 14), matCartonBlue);
  thumb.position.set(-sideX * 0.095, 0.265, 0.02);
  thumb.scale.set(0.9, 1.1, 0.9);
  g.add(thumb);

  // little cuff ring
  const cuff = new THREE.Mesh(new THREE.TorusGeometry(0.088, 0.022, 12, 26), matBlueDeep);
  cuff.rotation.x = Math.PI / 2;
  cuff.position.set(0, 0.205, 0);
  g.add(cuff);

  // attach on the side of the body
  const shoulderY = 0.98;
  const bulgeScale = 1.0 + 0.075 * Math.sin(Math.PI * ((shoulderY - BODY_BOTTOM) / (BODY_TOP - BODY_BOTTOM)));
  g.position.set(sideX * W * bulgeScale * 0.96, shoulderY, 0.02);
  g.rotation.z = sideX * 0.72;   // raised cheerfully outward/up
  g.rotation.x = -0.12;
  return g;
}

const armL = makeArm(-1);
const armR = makeArm(1);
carton.add(armL, armR);

/* ============================================================
   Tiny feet so it stands cutely
   ============================================================ */
function makeFoot(sideX) {
  const f = new THREE.Mesh(new THREE.SphereGeometry(0.15, 28, 20), matCartonBlue);
  f.scale.set(1.15, 0.52, 1.5);
  f.position.set(sideX * 0.30, 0.055, 0.34);
  f.castShadow = true;
  f.receiveShadow = true;
  return f;
}
carton.add(makeFoot(-1), makeFoot(1));

/* ============================================================
   Floating sparkles around the character
   ============================================================ */
const sparkles = new THREE.Group();
const sparkleData = [];
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * Math.PI * 2 + 0.4;
  const r = 1.25 + (i % 3) * 0.22;
  const y = 0.55 + ((i * 7) % 11) * 0.13;
  const s = makeStar(0.028 + ((i % 4) * 0.006), matSparkle);
  s.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
  s.userData.baseY = y;
  s.userData.phase = i * 0.7;
  sparkles.add(s);
  sparkleData.push(s);
}
scene.add(sparkles);

/* ============================================================
   Re-place the typography group cleanly (below the face)
   ============================================================ */
(function fixWordPlacement() {
  // The word group was added right before `face`; identify by children type
  for (const child of carton.children) {
    if (child.isGroup && child !== face && child !== capGroup && child !== cowGroup &&
        child !== armL && child !== armR && child.children.length > 6 &&
        child.userData.tagged !== true) {
      // this is the word group
      child.userData.tagged = true;
      child.position.y = -0.36;   // slide down to lower panel
      child.position.x = 0.0;
      child.scale.setScalar(0.92);
      break;
    }
  }
})();

/* Nudge the cow print to sit on the lower-left of the body */
cowGroup.position.set(0, -0.34, 0);
cowGroup.scale.setScalar(0.82);

/* ============================================================
   Center the whole carton on origin (X/Z) and rest on ground
   ============================================================ */
carton.updateMatrixWorld(true);
const bbox = new THREE.Box3();
carton.traverse(o => {
  if (o.isMesh && o.geometry) {
    if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
    const bb = o.geometry.boundingBox;
    if (bb && isFinite(bb.min.x) && isFinite(bb.max.x)) {
      const tmp = bb.clone().applyMatrix4(o.matrixWorld);
      bbox.union(tmp);
    }
  }
});
if (!bbox.isEmpty()) {
  const center = new THREE.Vector3();
  bbox.getCenter(center);
  carton.position.x -= center.x;
  carton.position.z -= center.z;
  carton.position.y -= bbox.min.y;
  controls.target.set(0, (bbox.max.y - bbox.min.y) * 0.5, 0);
  controls.update();
}

/* ============================================================
   Animate
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // gentle squash-stretch breathing
  const breathe = 1 + Math.sin(t * 1.5) * 0.014;
  carton.scale.set(1 / Math.sqrt(breathe), breathe, 1 / Math.sqrt(breathe));

  // little hop bob
  carton.position.y = Math.max(0, Math.abs(Math.sin(t * 1.5)) * 0.02);

  // arms wiggle cheerfully
  armL.rotation.z = -0.72 - Math.sin(t * 2.4) * 0.16;
  armR.rotation.z = 0.72 + Math.sin(t * 2.4) * 0.16;

  // sparkles twinkle & float
  for (const s of sparkleData) {
    const ph = s.userData.phase;
    s.position.y = s.userData.baseY + Math.sin(t * 1.1 + ph) * 0.09;
    s.rotation.z = t * 0.6 + ph;
    const sc = 0.75 + Math.abs(Math.sin(t * 2.0 + ph)) * 0.5;
    s.scale.setScalar(sc);
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ============================================================
   Resize
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>
</body>
</html>
