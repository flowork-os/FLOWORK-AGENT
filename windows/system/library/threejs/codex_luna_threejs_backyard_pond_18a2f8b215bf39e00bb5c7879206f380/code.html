<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backyard Pond Edge</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9eaf9b; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cad98);
scene.fog = new THREE.Fog(0x9cad98, 20, 38);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(10.8, 8.5, 11.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.42;
controls.target.set(0, 0.55, 0);

const hemi = new THREE.HemisphereLight(0xdce8d2, 0x4d513e, 2.15);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff1d3, 3.5);
sun.position.set(-8, 13, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -15;
sun.shadow.camera.right = 15;
sun.shadow.camera.top = 15;
sun.shadow.camera.bottom = -15;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 35;
sun.shadow.bias = -0.0005;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x9fc7d5, 0.55);
fill.position.set(8, 6, -10);
scene.add(fill);

const groundMat = new THREE.MeshStandardMaterial({ color: 0x667253, roughness: 1 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(42, 42), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const soilMat = new THREE.MeshStandardMaterial({ color: 0x75694d, roughness: 1 });
const soil = new THREE.Mesh(new THREE.CircleGeometry(7.4, 64), soilMat);
soil.rotation.x = -Math.PI / 2;
soil.scale.set(1.22, 0.72, 1);
soil.position.y = 0.012;
soil.receiveShadow = true;
scene.add(soil);

const grassMat = new THREE.MeshStandardMaterial({ color: 0x526649, roughness: 1 });
for (let i = 0; i < 95; i++) {
  const a = i * 2.39996;
  const r = 5.9 + (i % 11) * 0.18;
  const x = Math.cos(a) * r * 1.08;
  const z = Math.sin(a) * r * 0.62;
  const tuft = new THREE.Group();
  const count = 3 + (i % 3);
  for (let j = 0; j < count; j++) {
    const blade = new THREE.Mesh(new THREE.ConeGeometry(0.018, 0.3 + (j % 2) * 0.12, 4), grassMat);
    blade.position.set((j - 1) * 0.035, 0.15, (j % 2) * 0.025);
    blade.rotation.z = (j - 1) * 0.18;
    blade.castShadow = true;
    tuft.add(blade);
  }
  tuft.position.set(x, 0, z);
  tuft.rotation.y = a;
  scene.add(tuft);
}

const linerMat = new THREE.MeshStandardMaterial({ color: 0x111619, roughness: 0.62, metalness: 0.05 });
const liner = new THREE.Mesh(new THREE.TorusGeometry(1, 0.17, 14, 96), linerMat);
liner.rotation.x = -Math.PI / 2;
liner.scale.set(5.48, 3.72, 1);
liner.position.y = 0.22;
liner.castShadow = true;
liner.receiveShadow = true;
scene.add(liner);

const waterMat = new THREE.MeshPhysicalMaterial({
  color: 0x2e7f89,
  roughness: 0.16,
  metalness: 0.06,
  transmission: 0.08,
  transparent: true,
  opacity: 0.9,
  clearcoat: 0.7,
  clearcoatRoughness: 0.12
});
const water = new THREE.Mesh(new THREE.CircleGeometry(1, 96), waterMat);
water.rotation.x = -Math.PI / 2;
water.scale.set(5.12, 3.38, 1);
water.position.y = 0.27;
water.receiveShadow = true;
scene.add(water);

const rippleMat = new THREE.MeshBasicMaterial({ color: 0x9bc8c2, transparent: true, opacity: 0.22 });
for (let i = 0; i < 7; i++) {
  const ripple = new THREE.Mesh(new THREE.TorusGeometry(0.34 + i * 0.21, 0.012, 8, 64), rippleMat);
  ripple.rotation.x = -Math.PI / 2;
  ripple.scale.set(1.7, 0.68, 1);
  ripple.position.set(-1.2 + i * 0.55, 0.285 + i * 0.003, 0.35 - i * 0.08);
  scene.add(ripple);
}

const stoneColors = [0x8b8b79, 0x9b9987, 0x76786c, 0xa6a18e, 0x6e756b];
const stoneMats = stoneColors.map((color) => new THREE.MeshStandardMaterial({
  color,
  roughness: 0.93,
  metalness: 0
}));

function makeStone(angle, index) {
  const radiusX = 5.32 + (index % 3) * 0.08;
  const radiusZ = 3.52 + (index % 4) * 0.06;
  const x = Math.cos(angle) * radiusX;
  const z = Math.sin(angle) * radiusZ;
  const stone = new THREE.Mesh(new THREE.IcosahedronGeometry(0.78, 2), stoneMats[index % stoneMats.length]);
  const sx = 0.78 + (index % 4) * 0.08;
  const sz = 0.58 + ((index * 3) % 4) * 0.07;
  stone.scale.set(sx, 0.52 + (index % 3) * 0.08, sz);
  stone.position.set(x, 0.48 + (index % 3) * 0.025, z);
  stone.rotation.set(
    0.08 * Math.sin(index * 1.8),
    angle + 0.7 * Math.sin(index),
    0.12 * Math.cos(index * 1.3)
  );
  stone.castShadow = true;
  stone.receiveShadow = true;
  scene.add(stone);
}

const stoneCount = 27;
for (let i = 0; i < stoneCount; i++) {
  makeStone((i / stoneCount) * Math.PI * 2 + 0.025 * Math.sin(i * 4.1), i);
}

const pebbleMat = new THREE.MeshStandardMaterial({ color: 0xaaa58d, roughness: 1 });
for (let i = 0; i < 34; i++) {
  const angle = i * 2.71;
  const radius = 4.75 + (i % 7) * 0.25;
  const pebble = new THREE.Mesh(new THREE.IcosahedronGeometry(0.16 + (i % 3) * 0.045, 1), pebbleMat);
  pebble.scale.y = 0.55;
  pebble.position.set(Math.cos(angle) * radius * 1.08, 0.16, Math.sin(angle) * radius * 0.65);
  pebble.rotation.set(i * 0.5, i, i * 0.25);
  pebble.castShadow = true;
  scene.add(pebble);
}

const stemMat = new THREE.MeshStandardMaterial({ color: 0x4f713d, roughness: 0.8 });
const leafMat = new THREE.MeshStandardMaterial({ color: 0x3d6339, roughness: 0.85, side: THREE.DoubleSide });
const cattailMat = new THREE.MeshStandardMaterial({ color: 0x704526, roughness: 0.82 });

function pointCylinder(mesh, base, tip) {
  const direction = new THREE.Vector3().subVectors(tip, base);
  mesh.position.copy(base).add(tip).multiplyScalar(0.5);
  mesh.scale.set(1, direction.length(), 1);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
}

function addCattail(x, z, lean, height) {
  const base = new THREE.Vector3(x, 0.35, z);
  const stemTop = new THREE.Vector3(x + lean * 0.22, height, z + lean * 0.12);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.05, 1, 8), stemMat);
  pointCylinder(stem, base, stemTop);
  stem.castShadow = true;
  scene.add(stem);

  const headBase = new THREE.Vector3(stemTop.x, stemTop.y - 0.06, stemTop.z);
  const head = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.12, 0.58, 12), cattailMat);
  head.position.copy(headBase);
  head.rotation.z = -lean * 0.04;
  head.castShadow = true;
  scene.add(head);

  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.105, 12, 8), cattailMat);
  cap.scale.y = 0.42;
  cap.position.set(headBase.x, headBase.y + 0.3, headBase.z);
  cap.castShadow = true;
  scene.add(cap);

  for (let i = 0; i < 3; i++) {
    const leafBase = new THREE.Vector3(x, 0.38 + i * 0.1, z);
    const side = i % 2 === 0 ? 1 : -1;
    const leafTip = new THREE.Vector3(x + side * (0.28 + i * 0.07), 1.2 + i * 0.34, z + (i - 1) * 0.08);
    const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.045, leafTip.distanceTo(leafBase), 5), leafMat);
    pointCylinder(leaf, leafBase, leafTip);
    leaf.castShadow = true;
    scene.add(leaf);
  }
}

addCattail(-2.65, -2.25, -0.32, 3.0);
addCattail(-3.45, -1.45, -0.18, 2.45);
addCattail(1.55, -3.02, 0.18, 2.75);
addCattail(2.35, -2.65, 0.38, 2.25);
addCattail(3.35, -1.55, 0.23, 2.55);

const driftMat = new THREE.MeshStandardMaterial({ color: 0x594735, roughness: 1 });
const drift = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.22, 2.0, 10), driftMat);
drift.position.set(-4.25, 0.3, 1.25);
drift.rotation.set(0.2, -0.45, 1.0);
drift.castShadow = true;
scene.add(drift);

for (let i = 0; i < 9; i++) {
  const flowerMat = new THREE.MeshStandardMaterial({ color: i % 2 ? 0xa7b875 : 0xc2c78d, roughness: 0.9 });
  const flower = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 8), flowerMat);
  const a = i * 3.8;
  flower.position.set(Math.cos(a) * (6.1 + (i % 3) * 0.15), 0.23, Math.sin(a) * (6.1 + (i % 3) * 0.15) * 0.64);
  flower.scale.y = 0.72;
  flower.castShadow = true;
  scene.add(flower);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

animate();
</script>
</body>
</html>
