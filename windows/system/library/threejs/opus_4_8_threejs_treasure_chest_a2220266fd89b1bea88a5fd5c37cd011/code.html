<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fantasy Treasure Chest</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16171c; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- Renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ---------- Scene + environment ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16171c);
scene.fog = new THREE.Fog(0x16171c, 12, 26);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;

/* ---------- Camera ---------- */
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3.8, 2.7, 4.7);

/* ---------- Controls ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.target.set(0, 0.95, 0);
controls.minDistance = 3;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.5;

/* ---------- Lights ---------- */
scene.add(new THREE.HemisphereLight(0xbcd0ff, 0x2a2018, 0.45));

const key = new THREE.DirectionalLight(0xfff0d4, 2.4);
key.position.set(4.6, 6.6, 4.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 26;
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -5;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fb0d8, 0.6);
fill.position.set(-5, 3, -1);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffcf8a, 1.6);
rim.position.set(-3.6, 4.6, -5.6);
scene.add(rim);

const treasureGlow = new THREE.PointLight(0xffbf5a, 8, 3.4, 2);
scene.add(treasureGlow);

/* ---------- Shadow-only ground ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- Materials ---------- */
function woodMat(hex, rough = 0.72) {
  return new THREE.MeshStandardMaterial({ color: hex, roughness: rough, metalness: 0.0 });
}
const woods = [woodMat(0x8a5326), woodMat(0x7a4620), woodMat(0x965d2d)];
const woodLid = [
  new THREE.MeshStandardMaterial({ color: 0x8a5326, roughness: 0.72, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x7a4620, roughness: 0.72, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x965d2d, roughness: 0.72, side: THREE.DoubleSide })
];
const woodCore = new THREE.MeshStandardMaterial({ color: 0x633a1a, roughness: 0.8, side: THREE.DoubleSide });
const woodDark = woodMat(0x4a2c14, 0.85);

const ironMat = new THREE.MeshStandardMaterial({ color: 0x272730, roughness: 0.45, metalness: 0.95 });
const ironDark = new THREE.MeshStandardMaterial({ color: 0x191920, roughness: 0.5, metalness: 0.9 });

const goldMat = new THREE.MeshStandardMaterial({ color: 0xffcf57, roughness: 0.22, metalness: 1.0, emissive: 0x5a3a00, emissiveIntensity: 0.22 });
const goldDeep = new THREE.MeshStandardMaterial({ color: 0xd99a2b, roughness: 0.3, metalness: 1.0, emissive: 0x3a2400, emissiveIntensity: 0.3 });
const coinMats = [
  new THREE.MeshStandardMaterial({ color: 0xffd766, roughness: 0.26, metalness: 1.0, emissive: 0x6b4600, emissiveIntensity: 0.5 }),
  new THREE.MeshStandardMaterial({ color: 0xf5b83d, roughness: 0.3, metalness: 1.0, emissive: 0x5a3600, emissiveIntensity: 0.45 })
];
function gemMat(color, emissive) {
  return new THREE.MeshPhysicalMaterial({
    color, roughness: 0.06, metalness: 0.0, clearcoat: 1.0, clearcoatRoughness: 0.08,
    emissive, emissiveIntensity: 0.55, ior: 1.8, reflectivity: 0.7
  });
}

/* ---------- Helpers ---------- */
function rbox(w, h, d, r = 0.03, s = 2) {
  r = Math.min(r, Math.min(w, h, d) * 0.5 - 0.001);
  if (r <= 0) return new THREE.BoxGeometry(w, h, d);
  return new RoundedBoxGeometry(w, h, d, s, r);
}
function add(parent, geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* ---------- Dimensions ---------- */
const BW = 2.6, BH = 1.5, BD = 1.7;   // body width / height / depth
const R = BD / 2;                       // dome radius
const BOT = 0.16;                       // wall bottom (feet below)
const TOP = BOT + BH;                   // body top / hinge height
const wallT = 0.14;
const gap = 0.028;

const chest = new THREE.Group();
scene.add(chest);

/* ---------- Wooden body staves ---------- */
const nF = 7;
const pw = (BW - gap * (nF - 1)) / nF;
for (let i = 0; i < nF; i++) {
  const x = -BW / 2 + pw / 2 + i * (pw + gap);
  add(chest, rbox(pw * 0.9, BH, wallT, 0.03), woods[i % 3], x, BOT + BH / 2, R - wallT / 2);
  add(chest, rbox(pw * 0.9, BH, wallT, 0.03), woods[(i + 1) % 3], x, BOT + BH / 2, -R + wallT / 2);
}
const nS = 5;
const pd = (BD - gap * (nS - 1)) / nS;
for (let j = 0; j < nS; j++) {
  const z = -BD / 2 + pd / 2 + j * (pd + gap);
  add(chest, rbox(wallT, BH, pd * 0.9, 0.03), woods[j % 3], -BW / 2 + wallT / 2, BOT + BH / 2, z);
  add(chest, rbox(wallT, BH, pd * 0.9, 0.03), woods[(j + 2) % 3], BW / 2 - wallT / 2, BOT + BH / 2, z);
}
/* interior shell (blocks see-through) */
add(chest, rbox(BW - 0.05, BH - 0.03, BD - 0.05, 0.02), woodDark, 0, BOT + BH / 2, 0);

/* ---------- Feet ---------- */
[[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
  add(chest, rbox(0.34, 0.24, 0.34, 0.06), woods[1], sx * (BW / 2 - 0.2), 0.12, sz * (BD / 2 - 0.2));
});

/* ---------- Iron horizontal bands ---------- */
function band(y) {
  const t = 0.05, bh = 0.15;
  add(chest, rbox(BW + 0.05, bh, t, 0.015), ironMat, 0, y, R + 0.015);
  add(chest, rbox(BW + 0.05, bh, t, 0.015), ironMat, 0, y, -R - 0.015);
  add(chest, rbox(t, bh, BD + 0.05, 0.015), ironMat, BW / 2 + 0.015, y, 0);
  add(chest, rbox(t, bh, BD + 0.05, 0.015), ironMat, -BW / 2 - 0.015, y, 0);
}
band(BOT + 0.3);
band(TOP - 0.28);

/* vertical front/back straps */
[-0.78, 0.78].forEach((x) => {
  add(chest, rbox(0.12, BH * 0.94, 0.05, 0.015), ironDark, x, BOT + BH / 2, R + 0.02);
  add(chest, rbox(0.12, BH * 0.94, 0.05, 0.015), ironDark, x, BOT + BH / 2, -R - 0.02);
});

/* ---------- Corner brackets ---------- */
function bracket(sx, sz, y, hgt) {
  add(chest, rbox(0.26, hgt, 0.05, 0.015), ironMat, sx * (BW / 2 - 0.13), y, sz * (BD / 2 + 0.02));
  add(chest, rbox(0.05, hgt, 0.26, 0.015), ironMat, sx * (BW / 2 + 0.02), y, sz * (BD / 2 - 0.13));
}
[[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
  bracket(sx, sz, TOP - 0.17, 0.34);
  bracket(sx, sz, BOT + 0.17, 0.34);
});

/* ---------- Side handles ---------- */
function handle(sx) {
  add(chest, rbox(0.16, 0.3, 0.05, 0.02), ironDark, sx * (BW / 2 + 0.015), 0.9, 0);
  const ring = add(chest, new THREE.TorusGeometry(0.15, 0.032, 10, 24), ironMat, sx * (BW / 2 + 0.06), 0.86, 0);
  ring.rotation.y = Math.PI / 2;
}
handle(-1);
handle(1);

/* ---------- Hinges (back) ---------- */
[-0.72, 0.72].forEach((x) => {
  const hg = add(chest, new THREE.CylinderGeometry(0.07, 0.07, 0.34, 14), ironMat, x, TOP, -R + 0.02);
  hg.rotation.z = Math.PI / 2;
  add(chest, rbox(0.16, 0.42, 0.05, 0.015), ironDark, x, TOP - 0.21, -R - 0.02);
});

/* ---------- Ornate golden lock plate ---------- */
const lock = new THREE.Group();
lock.position.set(0, 0.92, R);
add(lock, rbox(0.82, 1.0, 0.05, 0.03), goldDeep, 0, 0, 0.02);
add(lock, rbox(0.64, 0.8, 0.06, 0.02), goldMat, 0, 0, 0.05);
const crest = add(lock, new THREE.SphereGeometry(0.14, 18, 14), goldMat, 0, 0.44, 0.05);
crest.scale.set(1.6, 0.9, 0.55);
const boss = add(lock, new THREE.CylinderGeometry(0.17, 0.17, 0.07, 22), goldMat, 0, -0.02, 0.09);
boss.rotation.x = Math.PI / 2;
const keyhole = add(lock, new THREE.CylinderGeometry(0.05, 0.05, 0.07, 16), ironDark, 0, 0.01, 0.15);
keyhole.rotation.x = Math.PI / 2;
add(lock, rbox(0.05, 0.16, 0.05, 0.01), ironDark, 0, -0.1, 0.15);
[[-0.24, 0.34], [0.24, 0.34], [-0.28, 0.0], [0.28, 0.0], [-0.22, -0.32], [0.22, -0.32]].forEach(([sx, sy]) => {
  add(lock, new THREE.SphereGeometry(0.036, 12, 12), goldMat, sx, sy, 0.085);
});
chest.add(lock);

/* ---------- Domed hinged lid (open) ---------- */
const lidPivot = new THREE.Group();
lidPivot.position.set(0, TOP, -R);
const lid = new THREE.Group();
lid.position.set(0, 0, R);
lidPivot.add(lid);
chest.add(lidPivot);

/* solid dome core */
const core = add(lid, new THREE.CylinderGeometry(R - 0.03, R - 0.03, BW - 0.02, 32, 1, false, 0, Math.PI), woodCore, 0, 0, 0);
core.rotation.z = Math.PI / 2;

/* raised wooden ribs / staves over the dome */
const nRib = 9;
const ribW = (BW - gap * (nRib - 1)) / nRib;
for (let i = 0; i < nRib; i++) {
  const x = -BW / 2 + ribW / 2 + i * (ribW + gap);
  const rib = add(lid, new THREE.CylinderGeometry(R, R, ribW * 0.92, 22, 1, true, 0, Math.PI), woodLid[i % 3], x, 0, 0);
  rib.rotation.z = Math.PI / 2;
}
/* iron bands over the dome */
[-0.58, 0.58].forEach((x) => {
  const b = add(lid, new THREE.TorusGeometry(R + 0.02, 0.05, 10, 28, Math.PI), ironMat, x, 0, 0);
  b.rotation.y = Math.PI / 2;
});
/* iron end rims */
[-1, 1].forEach((s) => {
  const rimT = add(lid, new THREE.TorusGeometry(R, 0.045, 10, 28, Math.PI), ironMat, s * (BW / 2 - 0.02), 0, 0);
  rimT.rotation.y = Math.PI / 2;
});
lidPivot.rotation.x = -2.0;

/* ---------- Treasure: gold fill mound ---------- */
const mound = add(chest, new THREE.IcosahedronGeometry(0.92, 1), goldDeep, 0, TOP - 0.02, 0.0);
mound.scale.set(1.05, 0.5, 0.7);

/* ---------- Coins ---------- */
const coinGeo = new THREE.CylinderGeometry(0.135, 0.135, 0.03, 20);
function coin(x, y, z, big = false) {
  const m = add(chest, coinGeo, coinMats[(Math.random() * 2) | 0], x, y, z);
  if (big) m.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
  else m.rotation.set((Math.random() - 0.5) * 0.6, Math.random() * Math.PI, (Math.random() - 0.5) * 0.6);
  return m;
}
/* mounded pile on top */
for (let i = 0; i < 70; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = Math.sqrt(Math.random());
  const x = Math.cos(a) * r * 0.95;
  const z = Math.sin(a) * r * 0.6;
  const y = TOP + 0.02 + (1 - r) * 0.42 - Math.random() * 0.12;
  coin(x, y, z, true);
}
/* spill cascading over the front lip */
for (let i = 0; i < 18; i++) {
  const s = i / 17;
  const x = (Math.random() - 0.5) * (0.5 + s * 0.9) - 0.05;
  const z = R + 0.02 + s * 0.55 + Math.random() * 0.06;
  const y = TOP - 0.05 - s * (TOP - 0.14) + (Math.random() - 0.5) * 0.06;
  coin(x, Math.max(y, 0.05), z, true);
}
/* pool of coins on the ground in front */
for (let i = 0; i < 24; i++) {
  const x = (Math.random() - 0.5) * 1.5;
  const z = R + 0.22 + Math.random() * 0.75;
  const y = 0.03 + Math.random() * 0.08;
  coin(x, y, z, false);
}

/* ---------- Gems ---------- */
const gems = [
  { geo: new THREE.OctahedronGeometry(0.17, 0), mat: gemMat(0xff3b57, 0x5c0010), pos: [0.12, TOP + 0.16, 0.24] },
  { geo: new THREE.IcosahedronGeometry(0.15, 0), mat: gemMat(0x3f7bff, 0x001a55), pos: [-0.3, TOP + 0.05, 0.02] },
  { geo: new THREE.DodecahedronGeometry(0.15, 0), mat: gemMat(0x2fd07a, 0x00401f), pos: [0.36, TOP + 0.0, -0.16] }
];
gems.forEach((g) => {
  const m = add(chest, g.geo, g.mat, g.pos[0], g.pos[1], g.pos[2]);
  m.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
});

/* place treasure glow inside the pile */
treasureGlow.position.set(0, TOP + 0.15, 0.15);

/* ---------- Resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- Render loop ---------- */
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
