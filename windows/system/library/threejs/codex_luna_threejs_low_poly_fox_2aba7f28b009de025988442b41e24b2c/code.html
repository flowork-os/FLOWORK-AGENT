<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Low Poly Fox</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e8c49b;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8c49b);
scene.fog = new THREE.Fog(0xe8c49b, 7, 14);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.1, 2.65, 6.4);
camera.lookAt(0, 1.35, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.065;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.15;
controls.minDistance = 3.6;
controls.maxDistance = 9;
controls.minPolarAngle = 0.45;
controls.maxPolarAngle = 1.45;
controls.target.set(0, 1.35, 0);

scene.add(new THREE.HemisphereLight(0xffe8c7, 0x77503d, 2.1));

const key = new THREE.DirectionalLight(0xfff0d2, 3.4);
key.position.set(-4, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -2;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 16;
scene.add(key);

const rim = new THREE.DirectionalLight(0xb7cfff, 1.1);
rim.position.set(4, 3, -5);
scene.add(rim);

const orange = new THREE.MeshStandardMaterial({
  color: 0xc95b2c,
  roughness: 0.9,
  metalness: 0,
  flatShading: true
});
const orangeLight = new THREE.MeshStandardMaterial({
  color: 0xe27a3f,
  roughness: 0.92,
  flatShading: true
});
const orangeDark = new THREE.MeshStandardMaterial({
  color: 0x99401f,
  roughness: 0.95,
  flatShading: true
});
const cream = new THREE.MeshStandardMaterial({
  color: 0xffdca6,
  roughness: 0.94,
  flatShading: true
});
const creamLight = new THREE.MeshStandardMaterial({
  color: 0xffe9c6,
  roughness: 0.94,
  flatShading: true
});
const dark = new THREE.MeshStandardMaterial({
  color: 0x30251f,
  roughness: 0.88,
  flatShading: true
});
const noseMat = new THREE.MeshStandardMaterial({
  color: 0x171315,
  roughness: 0.7,
  flatShading: true
});
const eyeMat = new THREE.MeshStandardMaterial({
  color: 0x111014,
  roughness: 0.72,
  flatShading: true
});
const eyeGlint = new THREE.MeshBasicMaterial({ color: 0xfff6dc });

const fox = new THREE.Group();
fox.position.y = 0.06;
scene.add(fox);

function mesh(geometry, material, position, scale) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(position[0], position[1], position[2]);
  if (scale) object.scale.set(scale[0], scale[1], scale[2]);
  object.castShadow = true;
  object.receiveShadow = true;
  fox.add(object);
  return object;
}

function ico(material, position, scale, detail = 1) {
  return mesh(new THREE.IcosahedronGeometry(1, detail), material, position, scale);
}

function cone(material, position, radius, height, radialSegments = 5, scale = [1, 1, 1]) {
  return mesh(new THREE.ConeGeometry(radius, height, radialSegments, 1), material, position, scale);
}

function segment(material, start, end, radiusStart, radiusEnd, sides = 6) {
  const a = new THREE.Vector3(...start);
  const b = new THREE.Vector3(...end);
  const direction = b.clone().sub(a);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(radiusEnd, radiusStart, length, sides, 1);
  const object = new THREE.Mesh(geometry, material);
  object.position.copy(a.clone().add(b).multiplyScalar(0.5));
  object.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  object.castShadow = true;
  object.receiveShadow = true;
  fox.add(object);
  return object;
}

function addEye(x, z) {
  const eye = ico(eyeMat, [x, 2.19, z], [0.075, 0.095, 0.052], 1);
  const glint = new THREE.Mesh(new THREE.IcosahedronGeometry(0.018, 1), eyeGlint);
  glint.position.set(x - 0.018, 2.218, z + 0.045);
  glint.castShadow = false;
  fox.add(glint);
  return eye;
}

const body = ico(orange, [0, 1.16, 0], [0.88, 1.08, 0.68], 2);
body.rotation.z = -0.035;

ico(orangeDark, [-0.53, 0.68, 0.08], [0.52, 0.62, 0.56], 1);
ico(orangeDark, [0.53, 0.68, 0.08], [0.52, 0.62, 0.56], 1);

ico(cream, [0, 1.16, 0.59], [0.48, 0.76, 0.17], 2);
ico(creamLight, [0, 1.47, 0.665], [0.36, 0.48, 0.115], 1);

const leftFrontLeg = segment(orangeLight, [-0.34, 1.02, 0.42], [-0.37, 0.38, 0.46], 0.19, 0.145, 5);
const rightFrontLeg = segment(orangeLight, [0.34, 1.02, 0.42], [0.37, 0.38, 0.46], 0.19, 0.145, 5);
leftFrontLeg.rotation.z = -0.035;
rightFrontLeg.rotation.z = 0.035;

ico(dark, [-0.38, 0.29, 0.49], [0.22, 0.14, 0.27], 1);
ico(dark, [0.38, 0.29, 0.49], [0.22, 0.14, 0.27], 1);

ico(orangeLight, [0, 2.02, 0.02], [0.68, 0.65, 0.63], 2);
ico(orange, [0, 1.91, 0.48], [0.56, 0.39, 0.34], 1);

const leftEar = cone(orange, [-0.37, 2.69, 0.02], 0.34, 0.91, 4, [1, 1, 0.9]);
leftEar.rotation.z = -0.12;
const rightEar = cone(orange, [0.37, 2.69, 0.02], 0.34, 0.91, 4, [1, 1, 0.9]);
rightEar.rotation.z = 0.12;

const leftInnerEar = cone(cream, [-0.37, 2.68, 0.255], 0.17, 0.58, 4, [1, 1, 0.72]);
leftInnerEar.rotation.z = -0.12;
const rightInnerEar = cone(cream, [0.37, 2.68, 0.255], 0.17, 0.58, 4, [1, 1, 0.72]);
rightInnerEar.rotation.z = 0.12;

addEye(-0.245, 0.565);
addEye(0.245, 0.565);

ico(creamLight, [-0.2, 1.98, 0.64], [0.29, 0.25, 0.18], 1);
ico(creamLight, [0.2, 1.98, 0.64], [0.29, 0.25, 0.18], 1);
ico(noseMat, [0, 1.91, 0.84], [0.13, 0.1, 0.1], 1);
ico(creamLight, [0, 1.77, 0.76], [0.19, 0.13, 0.11], 1);

const tailPoints = [
  [0.55, 0.95, -0.3],
  [0.9, 0.83, -0.34],
  [1.2, 0.63, -0.3],
  [1.38, 0.42, -0.22]
];
segment(orangeDark, tailPoints[0], tailPoints[1], 0.47, 0.43, 7);
segment(orange, tailPoints[1], tailPoints[2], 0.43, 0.31, 7);
segment(orangeLight, tailPoints[2], tailPoints[3], 0.32, 0.19, 6);
ico(creamLight, [1.47, 0.32, -0.18], [0.32, 0.3, 0.28], 1);

const tailTuft = cone(creamLight, [1.57, 0.25, -0.14], 0.2, 0.43, 6, [1, 1, 0.9]);
tailTuft.rotation.z = Math.PI / 2.15;

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(8, 64),
  new THREE.MeshStandardMaterial({ color: 0xd9ad7d, roughness: 1, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

const shadowDisc = new THREE.Mesh(
  new THREE.CircleGeometry(1.55, 32),
  new THREE.MeshBasicMaterial({ color: 0x9a684f, transparent: true, opacity: 0.2, depthWrite: false })
);
shadowDisc.rotation.x = -Math.PI / 2;
shadowDisc.scale.set(1.18, 0.55, 1);
shadowDisc.position.set(0, 0.006, 0.08);
scene.add(shadowDisc);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
