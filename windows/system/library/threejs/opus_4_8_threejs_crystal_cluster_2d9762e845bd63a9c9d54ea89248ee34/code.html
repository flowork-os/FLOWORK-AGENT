<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amethyst Crystal Cluster</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111114; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: rgba(210, 200, 225, 0.55); letter-spacing: 0.02em; user-select: none;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="hint">Amethyst specimen — drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ */
/*  Renderer                                                          */
/* ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

/* ------------------------------------------------------------------ */
/*  Scene & Camera                                                    */
/* ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111114);

const camera = new THREE.PerspectiveCamera(
  42, window.innerWidth / window.innerHeight, 0.1, 200
);
camera.position.set(6.2, 4.0, 7.4);

/* Studio environment for realistic gemstone reflection / refraction */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ */
/*  Lighting : key + fill + rim  (+ hemisphere ambient)               */
/* ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xbcc4ff, 0x241c2c, 0.45);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff1e2, 3.1);
key.position.set(6, 9, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 40;
key.shadow.camera.left = -9;
key.shadow.camera.right = 9;
key.shadow.camera.top = 9;
key.shadow.camera.bottom = -9;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 6;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fb6ff, 0.85);
fill.position.set(-7, 3.5, -2.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xff7ae0, 1.35);
rim.position.set(-3.5, 4.5, -6.5);
scene.add(rim);

/* small cool sparkle from the front */
const sparkle = new THREE.PointLight(0xd8c8ff, 12, 22, 2.0);
sparkle.position.set(2.5, 3.2, 4.0);
scene.add(sparkle);

/* ------------------------------------------------------------------ */
/*  Ground plane : receives shadows only                              */
/* ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.ShadowMaterial({ opacity: 0.38 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -2.0;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ */
/*  THE single centered object : amethyst cluster on a rock           */
/* ------------------------------------------------------------------ */
const specimen = new THREE.Group();
scene.add(specimen);

/* --- rough dark rock base (displaced icosphere, faceted) --------- */
function makeRock() {
  const geo = new THREE.IcosahedronGeometry(2.2, 3);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = v.clone().normalize();
    const noise =
        0.26 * Math.sin(n.x * 5.0) * Math.sin(n.y * 5.0) * Math.sin(n.z * 5.0)
      + 0.13 * Math.sin(n.x * 11.0 + 1.0) * Math.sin(n.z * 9.0)
      + 0.08 * Math.cos(n.y * 17.0 + 0.5);
    v.multiplyScalar(1 + noise * 0.34);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    color: 0x2b2630,
    roughness: 0.94,
    metalness: 0.12,
    flatShading: true,
    envMapIntensity: 0.35
  });
  const rock = new THREE.Mesh(geo, mat);
  rock.scale.set(1.0, 0.55, 1.0);
  rock.position.y = -1.0;
  rock.castShadow = true;
  rock.receiveShadow = true;
  return rock;
}
specimen.add(makeRock());

/* --- single crystal : hex prism + pyramidal tip, vertex-tinted --- */
const C_BASE = new THREE.Color(0xc7b0e8); // pale lavender at the base
const C_TIP  = new THREE.Color(0x53268c); // deep amethyst at the point

function createCrystalGeometry(radius, prismH, tipH) {
  const sides = 6;
  const step = (Math.PI * 2) / sides;
  const bottom = [], top = [];
  for (let i = 0; i < sides; i++) {
    const a = i * step;
    const x = Math.cos(a) * radius;
    const z = Math.sin(a) * radius;
    bottom.push(new THREE.Vector3(x, 0, z));
    top.push(new THREE.Vector3(x, prismH, z));
  }
  const apex = new THREE.Vector3(0, prismH + tipH, 0);
  const baseCenter = new THREE.Vector3(0, 0, 0);

  const positions = [];
  const tri = (a, b, c) => positions.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);

  for (let i = 0; i < sides; i++) {
    const j = (i + 1) % sides;
    // prism side wall (two triangles, outward winding)
    tri(bottom[i], top[j], bottom[j]);
    tri(bottom[i], top[i], top[j]);
    // pyramidal tip facet
    tri(top[i], apex, top[j]);
    // base cap (hidden inside the rock)
    tri(bottom[i], bottom[j], baseCenter);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));

  // height-based purple gradient (deeper toward the tip)
  const colors = [];
  const maxH = prismH + tipH;
  const c = new THREE.Color();
  for (let i = 0; i < positions.length; i += 3) {
    const t = THREE.MathUtils.clamp(positions[i + 1] / maxH, 0, 1);
    c.copy(C_BASE).lerp(C_TIP, Math.pow(t, 0.85));
    colors.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  return geo;
}

const crystalMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  vertexColors: true,
  metalness: 0.0,
  roughness: 0.05,
  transmission: 1.0,
  ior: 1.62,
  thickness: 1.2,
  attenuationColor: new THREE.Color(0x6f3caa),
  attenuationDistance: 1.7,
  clearcoat: 0.55,
  clearcoatRoughness: 0.08,
  specularIntensity: 1.0,
  envMapIntensity: 1.25,
  flatShading: true
});

/* cluster layout : one tall centre point + radiating shards --------- */
const crystalDefs = [
  { x:  0.00, z:  0.00, r: 0.44, h: 2.7, t: 1.05, tilt: 0.03 },
  { x: -0.42, z: -0.34, r: 0.32, h: 2.35, t: 0.92, tilt: 0.09 },
  { x:  0.16, z:  0.54, r: 0.30, h: 2.05, t: 0.82, tilt: 0.13 },
  { x:  0.70, z: -0.12, r: 0.26, h: 1.65, t: 0.66, tilt: 0.22 },
  { x:  0.32, z: -0.92, r: 0.34, h: 2.10, t: 0.86, tilt: 0.24 },
  { x:  0.92, z:  0.24, r: 0.28, h: 1.80, t: 0.74, tilt: 0.30 },
  { x: -0.72, z:  0.60, r: 0.26, h: 1.55, t: 0.62, tilt: 0.36 },
  { x: -0.94, z: -0.52, r: 0.24, h: 1.35, t: 0.56, tilt: 0.44 },
  { x:  0.62, z:  0.94, r: 0.22, h: 1.15, t: 0.52, tilt: 0.50 },
  { x: -0.30, z:  1.02, r: 0.21, h: 0.98, t: 0.46, tilt: 0.52 },
  { x:  1.18, z: -0.42, r: 0.20, h: 1.00, t: 0.50, tilt: 0.56 },
  { x: -1.16, z:  0.16, r: 0.22, h: 1.22, t: 0.56, tilt: 0.50 }
];

const UP = new THREE.Vector3(0, 1, 0);
for (const d of crystalDefs) {
  const mesh = new THREE.Mesh(createCrystalGeometry(d.r, d.h, d.t), crystalMat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  // seat the base slightly inside the rock
  mesh.position.set(d.x, -0.2, d.z);

  // lean the shard outward from the cluster centre, plus a random spin
  const az = Math.atan2(d.z, d.x);
  const dir = new THREE.Vector3(
    Math.cos(az) * Math.sin(d.tilt),
    Math.cos(d.tilt),
    Math.sin(az) * Math.sin(d.tilt)
  ).normalize();
  const tiltQ = new THREE.Quaternion().setFromUnitVectors(UP, dir);
  const spinQ = new THREE.Quaternion().setFromAxisAngle(UP, Math.random() * Math.PI * 2);
  mesh.quaternion.copy(tiltQ).multiply(spinQ);

  specimen.add(mesh);
}

/* ------------------------------------------------------------------ */
/*  Controls                                                          */
/* ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 4.0;
controls.maxDistance = 22.0;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 0.9, 0);
controls.update();

/* ------------------------------------------------------------------ */
/*  Resize + render loop                                              */
/* ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
