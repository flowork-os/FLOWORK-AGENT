<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gingerbread House</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14141a; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ---------- scene / camera ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15151b);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.4, 4.2, 7.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.target.set(0, 1.3, 0);
controls.minDistance = 4.5;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.52;

/* ---------- lighting ---------- */
const hemi = new THREE.HemisphereLight(0xfff2df, 0x241a12, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff0da, 2.4);
key.position.set(7, 10, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 36;
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 9;
key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd2ff, 0.55);
fill.position.set(-6, 4, 5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffcf95, 1.0);
rim.position.set(-4, 5.5, -6);
scene.add(rim);

/* ---------- ground (receives shadows only) ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.33 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- procedural textures ---------- */
function makeStripeTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#fbfaf3';
  g.fillRect(0, 0, 128, 128);
  g.strokeStyle = '#d1272b';
  g.lineWidth = 26;
  for (let i = -128; i < 256; i += 52) {
    g.beginPath();
    g.moveTo(i, 0);
    g.lineTo(i + 128, 128);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
const stripeTex = makeStripeTexture();

function makePeppermintTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  g.clearRect(0, 0, 256, 256);
  g.fillStyle = '#fbfaf3';
  g.beginPath();
  g.arc(128, 128, 124, 0, Math.PI * 2);
  g.fill();
  g.strokeStyle = '#d1272b';
  g.lineWidth = 20;
  g.lineCap = 'round';
  const arms = 6;
  for (let a = 0; a < arms; a++) {
    g.beginPath();
    for (let t = 0; t <= 1; t += 0.02) {
      const ang = a * (Math.PI * 2 / arms) + t * 1.7;
      const r = t * 116;
      const x = 128 + Math.cos(ang) * r;
      const y = 128 + Math.sin(ang) * r;
      if (t === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.stroke();
  }
  g.lineWidth = 14;
  g.beginPath();
  g.arc(128, 128, 115, 0, Math.PI * 2);
  g.stroke();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
const pepTex = makePeppermintTexture();

/* ---------- materials ---------- */
const gingerbread = new THREE.MeshStandardMaterial({ color: 0x8a4a24, roughness: 0.85, metalness: 0.0 });
const roofMat     = new THREE.MeshStandardMaterial({ color: 0x793e1e, roughness: 0.82, metalness: 0.0 });
const doorMat     = new THREE.MeshStandardMaterial({ color: 0x5d3216, roughness: 0.8,  metalness: 0.0 });
const icing       = new THREE.MeshStandardMaterial({ color: 0xfffdf8, roughness: 0.16, metalness: 0.0 });
const glassMat    = new THREE.MeshStandardMaterial({ color: 0x6a3d12, roughness: 0.4, metalness: 0.0, emissive: 0xffab52, emissiveIntensity: 0.5 });
const pepSide     = new THREE.MeshStandardMaterial({ color: 0xf1cccc, roughness: 0.25, metalness: 0.0 });
const pepCap      = new THREE.MeshPhysicalMaterial({ map: pepTex, roughness: 0.15, metalness: 0.0, clearcoat: 0.7, clearcoatRoughness: 0.2 });

/* ---------- root object ---------- */
const house = new THREE.Group();
scene.add(house);

/* ---------- dimensions ---------- */
const halfW = 1.5, wallH = 1.8, gableH = 1.1, depth = 2.4;
const peakY = wallH + gableH;                 // 2.9
const bevel = 0.02;
const FRONTZ = depth / 2 + bevel + 0.02;       // front face of body (~1.24)
const theta = Math.atan2(gableH, halfW);
const roofLen = Math.hypot(halfW, gableH);
const panelLen = roofLen + 0.5;
const roofDepth = depth + 0.55;
const roofThick = 0.14;

/* ---------- house body (extruded gingerbread) ---------- */
const shape = new THREE.Shape();
shape.moveTo(-halfW, 0);
shape.lineTo(halfW, 0);
shape.lineTo(halfW, wallH);
shape.lineTo(0, peakY);
shape.lineTo(-halfW, wallH);
shape.closePath();
const bodyGeo = new THREE.ExtrudeGeometry(shape, {
  depth: depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2
});
bodyGeo.translate(0, 0, -depth / 2);
const body = new THREE.Mesh(bodyGeo, gingerbread);
body.castShadow = true;
body.receiveShadow = true;
house.add(body);

/* ---------- roof panels ---------- */
const roofGeo = new THREE.BoxGeometry(panelLen, roofThick, roofDepth);
function roofPanel(sign) {
  const m = new THREE.Mesh(roofGeo, roofMat);
  m.castShadow = true;
  m.receiveShadow = true;
  const dir = new THREE.Vector2(sign * halfW, -gableH).normalize();
  const normal = new THREE.Vector2(-dir.y, dir.x);
  if (normal.y < 0) normal.multiplyScalar(-1);
  const peak = new THREE.Vector2(0, peakY);
  const center = peak.clone()
    .add(dir.clone().multiplyScalar(panelLen / 2))
    .add(normal.clone().multiplyScalar(0.05));
  m.position.set(center.x, center.y, 0);
  m.rotation.z = Math.atan2(dir.y, dir.x);
  return m;
}
house.add(roofPanel(1));
house.add(roofPanel(-1));

/* ---------- icing beads (batched into one InstancedMesh) ---------- */
const beadData = [];
function bead(r, x, y, z) { beadData.push([x, y, z, r]); }
function beadSeg(ax, ay, az, bx, by, bz, r) {
  const dx = bx - ax, dy = by - ay, dz = bz - az;
  const len = Math.hypot(dx, dy, dz);
  const n = Math.max(1, Math.round(len / (r * 1.4)));
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    bead(r, ax + dx * t, ay + dy * t, az + dz * t);
  }
}
function beadCurve(points, r) {
  const curve = new THREE.CatmullRomCurve3(points);
  const len = curve.getLength();
  const n = Math.max(2, Math.round(len / (r * 1.4)));
  const p = new THREE.Vector3();
  for (let i = 0; i <= n; i++) {
    curve.getPointAt(i / n, p);
    bead(r, p.x, p.y, p.z);
  }
}

// vertical corner piping
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  beadSeg(sx * (halfW + bevel), 0.05, sz * (depth / 2 + bevel),
          sx * (halfW + bevel), wallH - 0.02, sz * (depth / 2 + bevel), 0.055);
}

// ridge cap
beadSeg(0, 2.96, -roofDepth / 2 + 0.05, 0, 2.96, roofDepth / 2 - 0.05, 0.062);

// rake (gable edge) piping + eave lines + scallops per side
function roofTrim(sign) {
  const dir = new THREE.Vector2(sign * halfW, -gableH).normalize();
  const normal = new THREE.Vector2(-dir.y, dir.x);
  if (normal.y < 0) normal.multiplyScalar(-1);
  const peak = new THREE.Vector2(0, peakY);
  const startTop = peak.clone().add(normal.clone().multiplyScalar(0.05));
  const outerTop = peak.clone().add(dir.clone().multiplyScalar(panelLen)).add(normal.clone().multiplyScalar(0.05));
  const eaveX = outerTop.x - normal.x * roofThick;
  const eaveY = outerTop.y - normal.y * roofThick;

  // rakes front + back
  for (const zf of [roofDepth / 2 - 0.04, -roofDepth / 2 + 0.04]) {
    beadSeg(startTop.x, startTop.y, zf, outerTop.x, outerTop.y, zf, 0.05);
  }
  // eave piping line along depth
  beadSeg(eaveX, eaveY + 0.05, -roofDepth / 2 + 0.05, eaveX, eaveY + 0.05, roofDepth / 2 - 0.05, 0.05);

  // hanging scallops beneath the eave
  const z0 = -roofDepth / 2 + 0.22, z1 = roofDepth / 2 - 0.22, count = 9;
  const w = (z1 - z0) / count;
  for (let i = 0; i < count; i++) {
    const zc = z0 + w * (i + 0.5);
    const pts = [];
    for (let s = 0; s <= 7; s++) {
      const a = Math.PI * (s / 7);
      pts.push(new THREE.Vector3(eaveX, eaveY - Math.sin(a) * 0.16, zc - Math.cos(a) * w * 0.55));
    }
    beadCurve(pts, 0.045);
  }
}
roofTrim(1);
roofTrim(-1);

/* ---------- windows (icing frame + glowing candy glass) ---------- */
function makeWindow(w, h) {
  const g = new THREE.Group();
  const glass = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.05), glassMat);
  g.add(glass);
  const barMat = icing;
  const bars = [
    [w + 0.14, 0.075, 0, h / 2],
    [w + 0.14, 0.075, 0, -h / 2],
  ];
  bars.forEach(([bw, bh, x, y]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(bw, bh, 0.1), barMat);
    m.position.set(x, y, 0.02); m.castShadow = true; g.add(m);
  });
  [[-w / 2], [w / 2]].forEach(([x]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.075, h + 0.14, 0.1), barMat);
    m.position.set(x, 0, 0.02); m.castShadow = true; g.add(m);
  });
  const mv = new THREE.Mesh(new THREE.BoxGeometry(0.05, h, 0.08), barMat);
  mv.position.z = 0.04; g.add(mv);
  const mh = new THREE.Mesh(new THREE.BoxGeometry(w, 0.05, 0.08), barMat);
  mh.position.z = 0.04; g.add(mh);
  return g;
}
// front windows flanking the door
[-0.98, 0.98].forEach((x) => {
  const wnd = makeWindow(0.55, 0.6);
  wnd.position.set(x, 1.05, FRONTZ + 0.02);
  house.add(wnd);
});
// side windows
[[1, halfW + bevel + 0.03], [-1, -(halfW + bevel + 0.03)]].forEach(([sign, xpos]) => {
  const wnd = makeWindow(0.5, 0.55);
  wnd.position.set(xpos, 1.0, 0);
  wnd.rotation.y = sign * Math.PI / 2;
  house.add(wnd);
});
// round gable window
const roundWin = new THREE.Group();
const rwFrame = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.05, 14, 32), icing);
rwFrame.castShadow = true;
const rwGlass = new THREE.Mesh(new THREE.CircleGeometry(0.19, 32), glassMat);
rwGlass.position.z = -0.02;
roundWin.add(rwFrame, rwGlass);
roundWin.position.set(0, 2.12, FRONTZ + 0.02);
house.add(roundWin);

/* ---------- candy-cane doorframe + door ---------- */
function makeCane(len, radius) {
  const tex = stripeTex.clone();
  tex.needsUpdate = true;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, Math.max(2, Math.round(len * 3.2)));
  const mat = new THREE.MeshPhysicalMaterial({ map: tex, roughness: 0.22, clearcoat: 0.85, clearcoatRoughness: 0.18, metalness: 0.0 });
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, len, 22, 1), mat);
  m.castShadow = true;
  return m;
}
// door panel
const doorPanel = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.35, 0.09), doorMat);
doorPanel.position.set(0, 0.675, FRONTZ - 0.02);
doorPanel.castShadow = true;
house.add(doorPanel);
// icing panels line on the door
const doorLine = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.04), icing);
doorLine.position.set(0, 0.9, FRONTZ + 0.03);
house.add(doorLine);
// posts
for (const sx of [-0.5, 0.5]) {
  const post = makeCane(1.42, 0.075);
  post.position.set(sx, 0.71, FRONTZ + 0.06);
  house.add(post);
}
// lintel
const lintel = makeCane(1.16, 0.075);
lintel.rotation.z = Math.PI / 2;
lintel.position.set(0, 1.44, FRONTZ + 0.06);
house.add(lintel);

/* ---------- decorations: gumdrops & peppermints ---------- */
const gumColors = [0xe23b3b, 0x2fa84f, 0xf0a500, 0x9b3bd1, 0x2f7fd1, 0xe86bb0, 0x39c0c0];
function makeGumdrop(color, radius) {
  const mat = new THREE.MeshPhysicalMaterial({
    color, roughness: 0.28, metalness: 0.0, clearcoat: 0.65, clearcoatRoughness: 0.22,
    transmission: 0.12, ior: 1.35, thickness: radius
  });
  const dome = new THREE.Mesh(new THREE.SphereGeometry(radius, 20, 16, 0, Math.PI * 2, 0, Math.PI * 0.60), mat);
  dome.scale.y = 1.25;
  const rim = Math.cos(Math.PI * 0.60) * radius * 1.25; // negative
  dome.position.y = -rim;
  dome.castShadow = true;
  const cap = new THREE.Mesh(new THREE.CircleGeometry(Math.sin(Math.PI * 0.60) * radius, 20), mat);
  cap.rotation.x = Math.PI / 2;
  const g = new THREE.Group();
  g.add(dome, cap);
  return g;
}
let gi = 0;
function placeGumdrop(x, z, r) {
  const g = makeGumdrop(gumColors[gi++ % gumColors.length], r);
  g.position.set(x, 0, z);
  house.add(g);
}
// base perimeter gumdrops
[-1.35, -1.0, -0.72, 0.72, 1.0, 1.35].forEach((x) => placeGumdrop(x, FRONTZ + 0.18, 0.15));
[-1.3, -0.78, -0.26, 0.26, 0.78, 1.3].forEach((x) => placeGumdrop(x, -(FRONTZ + 0.18), 0.15));
[-0.9, -0.3, 0.3, 0.9].forEach((z) => { placeGumdrop(halfW + 0.22, z, 0.16); placeGumdrop(-(halfW + 0.22), z, 0.16); });

// gumdrops along the ridge
[-0.8, -0.3, 0.3, 0.8].forEach((z) => {
  const g = makeGumdrop(gumColors[gi++ % gumColors.length], 0.14);
  g.position.set(0, 2.9, z);
  house.add(g);
});

// door knob
const knob = makeGumdrop(0xf0a500, 0.06);
knob.position.set(0.28, 0.62, FRONTZ + 0.05);
house.add(knob);

function makePeppermint(radius) {
  const geo = new THREE.CylinderGeometry(radius, radius, 0.05, 32, 1);
  return new THREE.Mesh(geo, [pepSide, pepCap, pepCap]);
}
// front-wall peppermints
[[-1.18, 0.55], [1.18, 0.55]].forEach(([x, y]) => {
  const p = makePeppermint(0.17);
  p.rotation.x = Math.PI / 2;
  p.position.set(x, y, FRONTZ + 0.02);
  p.castShadow = true;
  house.add(p);
});
// side-wall peppermints
[[1, halfW + bevel + 0.02], [-1, -(halfW + bevel + 0.02)]].forEach(([sign, xpos]) => {
  const p = makePeppermint(0.16);
  p.rotation.z = -sign * Math.PI / 2;
  p.position.set(xpos, 0.5, sign > 0 ? 0.55 : -0.55);
  p.castShadow = true;
  house.add(p);
});
// roof peppermints (aligned to slope)
const up = new THREE.Vector3(0, 1, 0);
function roofPeppermint(sign, xAbs, z) {
  const dir = new THREE.Vector2(sign * halfW, -gableH).normalize();
  const normal = new THREE.Vector3(-dir.y, dir.x, 0);
  if (normal.y < 0) normal.multiplyScalar(-1);
  const gy = wallH + gableH * (1 - xAbs / halfW);
  const p = makePeppermint(0.16);
  p.quaternion.setFromUnitVectors(up, normal);
  p.position.set(sign * xAbs, gy + 0.13, z);
  p.castShadow = true;
  house.add(p);
}
roofPeppermint(1, 0.6, 0.45);
roofPeppermint(1, 0.95, -0.55);
roofPeppermint(-1, 0.6, -0.4);
roofPeppermint(-1, 0.95, 0.5);

/* ---------- chimney ---------- */
const chimney = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.6, 0.34), roofMat);
chimney.position.set(-0.68, 2.42, -0.5);
chimney.castShadow = true;
chimney.receiveShadow = true;
house.add(chimney);
// icing snow rim on chimney
const cx = -0.68, cz = -0.5, ctop = 2.72, ch = 0.17;
beadSeg(cx - ch, ctop, cz - ch, cx + ch, ctop, cz - ch, 0.05);
beadSeg(cx + ch, ctop, cz - ch, cx + ch, ctop, cz + ch, 0.05);
beadSeg(cx + ch, ctop, cz + ch, cx - ch, ctop, cz + ch, 0.05);
beadSeg(cx - ch, ctop, cz + ch, cx - ch, ctop, cz - ch, 0.05);
const chimTop = makeGumdrop(0xe23b3b, 0.1);
chimTop.position.set(cx, ctop + 0.02, cz);
house.add(chimTop);

/* ---------- build the icing InstancedMesh ---------- */
const beadInst = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 8), icing, beadData.length);
const dummy = new THREE.Object3D();
for (let i = 0; i < beadData.length; i++) {
  const [x, y, z, r] = beadData[i];
  dummy.position.set(x, y, z);
  dummy.scale.setScalar(r);
  dummy.updateMatrix();
  beadInst.setMatrixAt(i, dummy.matrix);
}
beadInst.instanceMatrix.needsUpdate = true;
beadInst.castShadow = false;
beadInst.receiveShadow = false;
house.add(beadInst);

/* ---------- center the single object ---------- */
house.position.y = 0;

/* ---------- resize + render loop ---------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
