<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Koi Streamer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #030714;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030714);
scene.fog = new THREE.FogExp2(0x030714, 0.055);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(-3.5, 2.1, 5.7);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 3.2;
controls.maxDistance = 9;
controls.target.set(0, 0.05, 0);

scene.add(new THREE.HemisphereLight(0x9edcff, 0x12051e, 1.8));

const keyLight = new THREE.DirectionalLight(0xd4f8ff, 3.2);
keyLight.position.set(-3, 5, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
scene.add(keyLight);

const magentaLight = new THREE.PointLight(0xff2ea6, 18, 8, 2);
magentaLight.position.set(1.5, 0.5, 2.2);
scene.add(magentaLight);

const cyanLight = new THREE.PointLight(0x18e9ff, 20, 8, 2);
cyanLight.position.set(-2.6, 1.4, -1.5);
scene.add(cyanLight);

const pathPoints = [
  new THREE.Vector3(-1.85, 0.04, 0.02),
  new THREE.Vector3(-1.35, 0.16, 0.10),
  new THREE.Vector3(-0.82, -0.08, -0.04),
  new THREE.Vector3(-0.25, 0.17, 0.07),
  new THREE.Vector3(0.35, -0.10, -0.08),
  new THREE.Vector3(0.92, 0.12, 0.03),
  new THREE.Vector3(1.42, -0.03, 0.00)
];

const curve = new THREE.CatmullRomCurve3(pathPoints, false, "catmullrom", 0.45);

function createBodyGeometry() {
  const longitudinal = 64;
  const radial = 28;
  const vertices = [];
  const normals = [];
  const uvs = [];
  const indices = [];
  const frames = curve.computeFrenetFrames(longitudinal, false);

  for (let i = 0; i <= longitudinal; i++) {
    const t = i / longitudinal;
    const center = curve.getPointAt(t);
    const radius = 0.49 * Math.pow(1 - t, 0.72) + 0.105;
    const ringWave = 1 + 0.035 * Math.sin(t * 31.0);

    for (let j = 0; j < radial; j++) {
      const a = (j / radial) * Math.PI * 2;
      const radialDirection = frames.normals[i].clone().multiplyScalar(Math.cos(a))
        .add(frames.binormals[i].clone().multiplyScalar(Math.sin(a)));
      const localRadius = radius * ringWave * (1 + 0.045 * Math.sin(a * 3 + t * 19));
      const point = center.clone().add(radialDirection.clone().multiplyScalar(localRadius));
      vertices.push(point.x, point.y, point.z);
      normals.push(radialDirection.x, radialDirection.y, radialDirection.z);
      uvs.push(t, j / radial);
    }
  }

  for (let i = 0; i < longitudinal; i++) {
    for (let j = 0; j < radial; j++) {
      const next = (j + 1) % radial;
      const a = i * radial + j;
      const b = i * radial + next;
      const c = (i + 1) * radial + next;
      const d = (i + 1) * radial + j;
      indices.push(a, b, d, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
  geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeBoundingSphere();
  return geometry;
}

const holoVertex = `
  uniform float time;
  varying vec3 vNormal;
  varying vec3 vWorld;
  varying vec2 vUv;
  void main() {
    vUv = uv;
    vec3 displaced = position;
    float wave = sin(position.x * 7.0 + time * 1.8) * 0.012
                + sin(position.y * 11.0 - time * 1.3) * 0.008;
    displaced += normal * wave;
    vec4 worldPosition = modelMatrix * vec4(displaced, 1.0);
    vWorld = worldPosition.xyz;
    vNormal = normalize(normalMatrix * normal);
    gl_Position = projectionMatrix * viewMatrix * worldPosition;
  }
`;

const holoFragment = `
  uniform float time;
  varying vec3 vNormal;
  varying vec3 vWorld;
  varying vec2 vUv;

  vec3 hsv2rgb(vec3 c) {
    vec3 p = abs(fract(c.xxx + vec3(0.0, 0.6667, 0.3333)) * 6.0 - 3.0);
    return c.z * mix(vec3(1.0), clamp(p - 1.0, 0.0, 1.0), c.y);
  }

  void main() {
    vec3 viewDirection = normalize(cameraPosition - vWorld);
    float fresnel = pow(1.0 - max(dot(normalize(vNormal), viewDirection), 0.0), 2.0);
    float hue = fract(0.54 + vWorld.y * 0.22 + vWorld.x * 0.12 + sin(vWorld.z * 3.0) * 0.13 + time * 0.018);
    vec3 iridescence = hsv2rgb(vec3(hue, 0.82, 1.0));

    vec2 cells = vec2(vUv.x * 42.0, vUv.y * 15.0);
    cells.y += mod(floor(cells.x), 2.0) * 0.5;
    vec2 cell = fract(cells) - 0.5;
    float scaleArc = 1.0 - smoothstep(0.08, 0.18, abs(length(cell * vec2(1.15, 1.0)) - 0.27));
    float scaleGlow = scaleArc * (0.3 + 0.7 * smoothstep(0.0, 0.5, fresnel));

    float scan = 0.93 + 0.07 * sin(vUv.y * 240.0 + time * 8.0);
    float shimmer = 0.5 + 0.5 * sin(vUv.x * 34.0 - vUv.y * 19.0 + time * 3.2);

    vec3 base = mix(iridescence, vec3(0.1, 0.9, 1.0), fresnel * 0.42);
    base += vec3(1.0, 0.12, 0.63) * scaleGlow * 0.42;
    base += vec3(1.0, 0.72, 0.16) * shimmer * fresnel * 0.22;
    base *= scan;

    float alpha = 0.82 + fresnel * 0.16;
    gl_FragColor = vec4(base, alpha);
  }
`;

const holoMaterials = [];

function makeHoloMaterial() {
  const material = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 } },
    vertexShader: holoVertex,
    fragmentShader: holoFragment,
    transparent: true,
    depthWrite: true,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending
  });
  holoMaterials.push(material);
  return material;
}

const body = new THREE.Mesh(createBodyGeometry(), makeHoloMaterial());
body.castShadow = true;
body.receiveShadow = true;
scene.add(body);

function makeTail(sign) {
  const segments = 24;
  const vertices = [];
  const uvs = [];
  const indices = [];

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const x = 1.28 + t * 0.92;
    const y = sign * (0.05 + 0.68 * t * t);
    const z = 0.03 + Math.sin(t * Math.PI * 2.0 + sign) * 0.13 * t;
    const width = 0.20 * (1 - t) + 0.025;
    vertices.push(x, y, z - width, x, y, z + width);
    uvs.push(t, 0, t, 1);
  }

  for (let i = 0; i < segments; i++) {
    const a = i * 2;
    indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const mesh = new THREE.Mesh(geometry, makeHoloMaterial());
  mesh.castShadow = true;
  return mesh;
}

scene.add(makeTail(1));
scene.add(makeTail(-1));

const mouthTangent = curve.getTangentAt(0).normalize();
const mouthQuaternion = new THREE.Quaternion().setFromUnitVectors(
  new THREE.Vector3(0, 0, 1),
  mouthTangent
);

const mouthRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.505, 0.075, 14, 64),
  makeHoloMaterial()
);
mouthRing.position.copy(curve.getPointAt(0));
mouthRing.quaternion.copy(mouthQuaternion);
mouthRing.scale.set(1.0, 1.0, 1.08);
mouthRing.castShadow = true;
scene.add(mouthRing);

const mouthInner = new THREE.Mesh(
  new THREE.CircleGeometry(0.445, 48),
  new THREE.MeshBasicMaterial({
    color: 0x05081b,
    transparent: true,
    opacity: 0.86,
    side: THREE.DoubleSide
  })
);
mouthInner.position.copy(curve.getPointAt(0)).add(mouthTangent.clone().multiplyScalar(-0.015));
mouthInner.quaternion.copy(mouthQuaternion);
scene.add(mouthInner);

const lipGlow = new THREE.Mesh(
  new THREE.TorusGeometry(0.595, 0.018, 8, 64),
  new THREE.MeshBasicMaterial({
    color: 0x41eaff,
    transparent: true,
    opacity: 0.72,
    blending: THREE.AdditiveBlending
  })
);
lipGlow.position.copy(curve.getPointAt(0));
lipGlow.quaternion.copy(mouthQuaternion);
scene.add(lipGlow);

function makeFin(sign, vertical) {
  const origin = curve.getPointAt(0.27);
  const points = vertical
    ? [
        origin.clone().add(new THREE.Vector3(0.05, 0.10, 0)),
        origin.clone().add(new THREE.Vector3(0.48, sign * 0.58, 0)),
        origin.clone().add(new THREE.Vector3(0.58, sign * 0.05, 0.18))
      ]
    : [
        origin.clone().add(new THREE.Vector3(0.05, 0, sign * 0.16)),
        origin.clone().add(new THREE.Vector3(0.46, -0.20, sign * 0.72)),
        origin.clone().add(new THREE.Vector3(0.68, -0.02, sign * 0.18))
      ];

  const positions = [];
  for (const point of points) positions.push(point.x, point.y, point.z);

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex([0, 1, 2]);
  geometry.computeVertexNormals();

  const fin = new THREE.Mesh(geometry, makeHoloMaterial());
  fin.material.opacity = 0.68;
  fin.castShadow = true;
  return fin;
}

scene.add(makeFin(1, false));
scene.add(makeFin(-1, false));
scene.add(makeFin(1, true));

const tailBand = new THREE.Mesh(
  new THREE.TorusGeometry(0.17, 0.032, 10, 32),
  makeHoloMaterial()
);
tailBand.position.copy(curve.getPointAt(0.985));
tailBand.quaternion.setFromUnitVectors(
  new THREE.Vector3(0, 0, 1),
  curve.getTangentAt(0.985).normalize()
);
scene.add(tailBand);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  for (const material of holoMaterials) material.uniforms.time.value = elapsed;

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
