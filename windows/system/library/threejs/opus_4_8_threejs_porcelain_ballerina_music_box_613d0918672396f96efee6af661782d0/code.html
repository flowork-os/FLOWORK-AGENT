<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
scene.fog = new THREE.Fog(0x14161a, 1.6, 5.2);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(0.52, 0.34, 0.72);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.minDistance = 0.30;
controls.maxDistance = 2.2;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 0.175, 0);
controls.update();

/* ============================================================
   PROCEDURAL TEXTURES  (crackle glaze, cobalt scrollwork, plinth)
   ============================================================ */

// --- tiny deterministic PRNG so the look is stable across reloads ---
let _seed = 20260720;
function rnd() {
  _seed ^= _seed << 13; _seed >>>= 0;
  _seed ^= _seed >> 17; _seed >>>= 0;
  _seed ^= _seed << 5;  _seed >>>= 0;
  return _seed / 4294967296;
}

/**
 * Crackle glaze: a network of fine craze lines drawn as a subtle
 * roughness / normal perturbation. Returns { rough, normal }.
 */
function makeCrackleMaps(size = 1024, cellCount = 190, lineAlpha = 0.30) {
  // Build a jittered point set, connect near neighbours -> craze web
  const pts = [];
  for (let i = 0; i < cellCount; i++) pts.push([rnd() * size, rnd() * size]);

  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');

  // base roughness (glossy glaze)
  g.fillStyle = '#2b2b2b';
  g.fillRect(0, 0, size, size);

  // faint mottling of the glaze pool
  for (let i = 0; i < 420; i++) {
    const x = rnd() * size, y = rnd() * size, r = 18 + rnd() * 90;
    const v = 34 + Math.floor(rnd() * 26);
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, `rgba(${v},${v},${v},0.16)`);
    grd.addColorStop(1, `rgba(${v},${v},${v},0)`);
    g.fillStyle = grd;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }

  // craze lines: connect each point to its 3 nearest neighbours with
  // a slightly wobbly poly-line (a real crackle web branches like this)
  g.lineCap = 'round';
  g.lineJoin = 'round';
  for (let i = 0; i < pts.length; i++) {
    const [ax, ay] = pts[i];
    // nearest neighbours (with horizontal wrap for seamless-ish tiling)
    const order = [];
    for (let j = 0; j < pts.length; j++) {
      if (j === i) continue;
      let dx = pts[j][0] - ax, dy = pts[j][1] - ay;
      if (dx > size / 2) dx -= size; if (dx < -size / 2) dx += size;
      if (dy > size / 2) dy -= size; if (dy < -size / 2) dy += size;
      order.push([dx * dx + dy * dy, dx, dy]);
    }
    order.sort((p, q) => p[0] - q[0]);
    const links = 2 + (rnd() < 0.45 ? 1 : 0);
    for (let k = 0; k < links && k < order.length; k++) {
      const [, dx, dy] = order[k];
      const steps = 5;
      const w = 0.55 + rnd() * 0.85;
      const a = lineAlpha * (0.45 + rnd() * 0.55);
      g.strokeStyle = `rgba(232,232,232,${a.toFixed(3)})`;
      g.lineWidth = w;
      g.beginPath();
      g.moveTo(ax, ay);
      for (let s = 1; s <= steps; s++) {
        const t = s / steps;
        const jx = (rnd() - 0.5) * 9 * (1 - Math.abs(t - 0.5) * 2 + 0.25);
        const jy = (rnd() - 0.5) * 9 * (1 - Math.abs(t - 0.5) * 2 + 0.25);
        g.lineTo(ax + dx * t + jx, ay + dy * t + jy);
      }
      g.stroke();
    }
  }

  const rough = new THREE.CanvasTexture(c);
  rough.wrapS = rough.wrapT = THREE.RepeatWrapping;
  rough.colorSpace = THREE.NoColorSpace;
  rough.anisotropy = renderer.capabilities.getMaxAnisotropy();

  // Derive a normal map from the luminance of the crackle canvas (sobel)
  const src = g.getImageData(0, 0, size, size).data;
  const nc = document.createElement('canvas');
  nc.width = nc.height = size;
  const ng = nc.getContext('2d');
  const out = ng.createImageData(size, size);
  const L = (x, y) => {
    const xx = (x + size) % size, yy = (y + size) % size;
    return src[(yy * size + xx) * 4] / 255;
  };
  const strength = 2.4;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const dx = (L(x + 1, y) - L(x - 1, y)) * strength;
      const dy = (L(x, y + 1) - L(x, y - 1)) * strength;
      let nx = -dx, ny = -dy, nz = 1.0;
      const inv = 1 / Math.hypot(nx, ny, nz);
      nx *= inv; ny *= inv; nz *= inv;
      const o = (y * size + x) * 4;
      out.data[o]     = Math.floor((nx * 0.5 + 0.5) * 255);
      out.data[o + 1] = Math.floor((ny * 0.5 + 0.5) * 255);
      out.data[o + 2] = Math.floor((nz * 0.5 + 0.5) * 255);
      out.data[o + 3] = 255;
    }
  }
  ng.putImageData(out, 0, 0);
  const normal = new THREE.CanvasTexture(nc);
  normal.wrapS = normal.wrapT = THREE.RepeatWrapping;
  normal.colorSpace = THREE.NoColorSpace;
  normal.anisotropy = renderer.capabilities.getMaxAnisotropy();

  return { rough, normal };
}

/**
 * Cobalt scrollwork painted on the tutu disc.
 * Drawn in polar layout so it reads correctly on a ring/disc UV.
 * u = around the disc, v = radius (0 inner .. 1 outer) for our custom UVs.
 */
function makeTutuTexture(size = 1024) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const g = c.getContext('2d');

  // bone-white porcelain ground
  g.fillStyle = '#f4f1ea';
  g.fillRect(0, 0, size, size);

  // faint warm pooling near the outer edge (glaze thickens at rims)
  const pool = g.createLinearGradient(0, 0, 0, size);
  pool.addColorStop(0.0, 'rgba(226,219,205,0.55)');
  pool.addColorStop(0.22, 'rgba(244,241,234,0.0)');
  pool.addColorStop(0.80, 'rgba(244,241,234,0.0)');
  pool.addColorStop(1.0, 'rgba(214,206,190,0.75)');
  g.fillStyle = pool;
  g.fillRect(0, 0, size, size);

  const COBALT = '#1f3f95';
  const COBALT_SOFT = 'rgba(41,74,166,0.55)';
  const COBALT_PALE = 'rgba(72,106,190,0.30)';

  const REP = 14;               // scroll motifs around the disc
  const cell = size / REP;

  // helper: a single scroll motif drawn into a cell (x0..x0+cell, full height band)
  function scrollMotif(x0, yTop, yBot) {
    const w = cell, h = yBot - yTop;
    const cx = x0 + w * 0.5;
    g.save();
    g.lineCap = 'round';
    g.lineJoin = 'round';

    // central stem
    g.strokeStyle = COBALT;
    g.lineWidth = Math.max(1.6, h * 0.030);
    g.beginPath();
    g.moveTo(cx, yBot);
    g.bezierCurveTo(cx + w * 0.10, yTop + h * 0.66, cx - w * 0.10, yTop + h * 0.34, cx, yTop + h * 0.06);
    g.stroke();

    // symmetric volutes (the "scroll" spirals)
    for (const s of [-1, 1]) {
      g.strokeStyle = COBALT;
      g.lineWidth = Math.max(1.3, h * 0.024);
      g.beginPath();
      g.moveTo(cx, yTop + h * 0.62);
      g.bezierCurveTo(
        cx + s * w * 0.34, yTop + h * 0.60,
        cx + s * w * 0.44, yTop + h * 0.32,
        cx + s * w * 0.20, yTop + h * 0.24
      );
      g.bezierCurveTo(
        cx + s * w * 0.06, yTop + h * 0.20,
        cx + s * w * 0.06, yTop + h * 0.40,
        cx + s * w * 0.22, yTop + h * 0.40
      );
      g.stroke();

      // leaflet
      g.fillStyle = COBALT_SOFT;
      g.beginPath();
      g.moveTo(cx + s * w * 0.06, yTop + h * 0.78);
      g.quadraticCurveTo(cx + s * w * 0.40, yTop + h * 0.80, cx + s * w * 0.30, yTop + h * 0.94);
      g.quadraticCurveTo(cx + s * w * 0.16, yTop + h * 0.86, cx + s * w * 0.06, yTop + h * 0.78);
      g.fill();

      // small dot accents
      g.fillStyle = COBALT_PALE;
      g.beginPath();
      g.arc(cx + s * w * 0.36, yTop + h * 0.50, Math.max(1.5, h * 0.020), 0, Math.PI * 2);
      g.fill();
    }

    // crown bud
    g.fillStyle = COBALT;
    g.beginPath();
    g.ellipse(cx, yTop + h * 0.055, w * 0.055, h * 0.045, 0, 0, Math.PI * 2);
    g.fill();

    g.restore();
  }

  // motif band sits in the mid/outer radius
  const bandTop = size * 0.30, bandBot = size * 0.80;
  for (let i = 0; i < REP; i++) scrollMotif(i * cell, bandTop, bandBot);

  // concentric cobalt rule lines (constant v => horizontal lines)
  function rule(v, lw, alpha) {
    g.strokeStyle = `rgba(31,63,149,${alpha})`;
    g.lineWidth = lw;
    g.beginPath();
    g.moveTo(0, v * size);
    g.lineTo(size, v * size);
    g.stroke();
  }
  rule(0.245, 3.0, 0.92);
  rule(0.275, 1.4, 0.60);
  rule(0.850, 1.6, 0.65);
  rule(0.885, 4.2, 0.95);

  // fine dentil ticks along the outer rule
  g.strokeStyle = 'rgba(31,63,149,0.85)';
  g.lineWidth = 2.2;
  for (let i = 0; i < REP * 4; i++) {
    const x = (i + 0.5) * (size / (REP * 4));
    g.beginPath();
    g.moveTo(x, size * 0.845);
    g.lineTo(x, size * 0.812);
    g.stroke();
  }

  // hand-painted imperfection: slight bleed blur pass
  g.globalAlpha = 0.22;
  g.filter = 'blur(1.4px)';
  g.drawImage(c, 0, 0);
  g.filter = 'none';
  g.globalAlpha = 1;

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

/**
 * Plinth surface: bone-white with a cobalt band + gold hairline near the top.
 * UV: u = around, v = 0 bottom .. 1 top (CylinderGeometry convention).
 */
function makePlinthTexture(size = 1024) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const g = c.getContext('2d');

  g.fillStyle = '#efeade';
  g.fillRect(0, 0, size, size);

  // subtle vertical shading so flutes read even before lighting
  for (let i = 0; i < 900; i++) {
    const x = rnd() * size, y = rnd() * size, r = 10 + rnd() * 55;
    const v = 226 + Math.floor(rnd() * 20);
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, `rgba(${v},${v - 4},${v - 12},0.20)`);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }

  // cobalt band near the top of the plinth (v large = top)
  g.fillStyle = 'rgba(31,63,149,0.94)';
  g.fillRect(0, size * 0.115, size, size * 0.030);
  g.fillStyle = 'rgba(31,63,149,0.55)';
  g.fillRect(0, size * 0.160, size, size * 0.010);

  // repeating cobalt dot-and-dash frieze
  const N = 40;
  for (let i = 0; i < N; i++) {
    const x = (i + 0.5) * (size / N);
    g.fillStyle = 'rgba(31,63,149,0.80)';
    g.beginPath(); g.arc(x, size * 0.205, size * 0.0060, 0, Math.PI * 2); g.fill();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

const crackle = makeCrackleMaps(1024, 190, 0.34);
const crackleFine = makeCrackleMaps(512, 120, 0.26);

/* ============================================================
   MATERIALS
   ============================================================ */
const ENV_INTENSITY = 1.0;

// Skin / limbs: glazed bone-white porcelain with crackle
const matPorcelain = new THREE.MeshPhysicalMaterial({
  color: 0xf6f2ea,
  roughness: 0.16,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.055,
  sheen: 0.35,
  sheenColor: new THREE.Color(0xfff4e6),
  sheenRoughness: 0.7,
  transmission: 0.0,
  reflectivity: 0.55,
  envMapIntensity: ENV_INTENSITY,
  roughnessMap: crackle.rough,
  normalMap: crackle.normal,
  normalScale: new THREE.Vector2(0.28, 0.28)
});
matPorcelain.roughnessMap.repeat.set(2, 2);
matPorcelain.normalMap.repeat.set(2, 2);

// Slightly warmer porcelain for the face / bun so it separates a touch
const matPorcelainWarm = matPorcelain.clone();
matPorcelainWarm.color = new THREE.Color(0xf7f1e6);
matPorcelainWarm.roughnessMap = crackleFine.rough;
matPorcelainWarm.normalMap = crackleFine.normal;
matPorcelainWarm.normalScale = new THREE.Vector2(0.22, 0.22);

// Hair: pale blond-ivory ceramic, a touch warmer and less glossy
const matHair = new THREE.MeshPhysicalMaterial({
  color: 0xe6d6bb,
  roughness: 0.24,
  metalness: 0.0,
  clearcoat: 0.85,
  clearcoatRoughness: 0.10,
  envMapIntensity: ENV_INTENSITY,
  roughnessMap: crackleFine.rough,
  normalMap: crackleFine.normal,
  normalScale: new THREE.Vector2(0.30, 0.30)
});

// Bodice: bone-white glaze, cooler
const matBodice = new THREE.MeshPhysicalMaterial({
  color: 0xf2eee5,
  roughness: 0.14,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.05,
  envMapIntensity: ENV_INTENSITY,
  roughnessMap: crackle.rough,
  normalMap: crackle.normal,
  normalScale: new THREE.Vector2(0.22, 0.22)
});

// Gold luster line on the bodice
const matGold = new THREE.MeshPhysicalMaterial({
  color: 0xc9a227,
  roughness: 0.22,
  metalness: 1.0,
  clearcoat: 0.5,
  clearcoatRoughness: 0.15,
  envMapIntensity: ENV_INTENSITY * 1.35
});

// Cobalt accents (sash, hair ribbon)
const matCobalt = new THREE.MeshPhysicalMaterial({
  color: 0x21418f,
  roughness: 0.12,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.05,
  envMapIntensity: ENV_INTENSITY
});

// Tutu: painted disc, double sided
const tutuTex = makeTutuTexture(1024);
const matTutu = new THREE.MeshPhysicalMaterial({
  map: tutuTex,
  color: 0xffffff,
  roughness: 0.17,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.06,
  side: THREE.DoubleSide,
  envMapIntensity: ENV_INTENSITY,
  roughnessMap: crackleFine.rough,
  normalMap: crackleFine.normal,
  normalScale: new THREE.Vector2(0.16, 0.16),
  sheen: 0.4,
  sheenColor: new THREE.Color(0xffffff),
  sheenRoughness: 0.6
});

// Plinth body
const plinthTex = makePlinthTexture(1024);
const matPlinth = new THREE.MeshPhysicalMaterial({
  map: plinthTex,
  roughness: 0.20,
  metalness: 0.0,
  clearcoat: 0.95,
  clearcoatRoughness: 0.08,
  envMapIntensity: ENV_INTENSITY,
  roughnessMap: crackle.rough,
  normalMap: crackle.normal,
  normalScale: new THREE.Vector2(0.30, 0.30)
});
const matPlinthPlain = new THREE.MeshPhysicalMaterial({
  color: 0xeee9dd,
  roughness: 0.20,
  metalness: 0.0,
  clearcoat: 0.95,
  clearcoatRoughness: 0.08,
  envMapIntensity: ENV_INTENSITY,
  roughnessMap: crackle.rough,
  normalMap: crackle.normal,
  normalScale: new THREE.Vector2(0.30, 0.30)
});

/* ============================================================
   GEOMETRY HELPERS
   ============================================================ */

/** Tapered limb along a CatmullRom curve with a radius profile function. */
function limb(points, radiusFn, tubularSegments = 40, radialSegments = 16) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), false, 'catmullrom', 0.35);
  const geo = new THREE.TubeGeometry(curve, tubularSegments, 1, radialSegments, false);
  // Re-scale radii per-ring using the TubeGeometry frames
  const frames = curve.computeFrenetFrames(tubularSegments, false);
  const pos = geo.attributes.position;
  const nrm = geo.attributes.normal;
  const v = new THREE.Vector3(), n = new THREE.Vector3(), P = new THREE.Vector3();
  for (let i = 0; i <= tubularSegments; i++) {
    const t = i / tubularSegments;
    const r = radiusFn(t);
    curve.getPointAt(t, P);
    const N = frames.normals[i], B = frames.binormals[i];
    for (let j = 0; j <= radialSegments; j++) {
      const idx = i * (radialSegments + 1) + j;
      const ang = (j / radialSegments) * Math.PI * 2;
      const sx = -r * Math.cos(ang), sy = -r * Math.sin(ang);
      v.set(P.x + sx * N.x + sy * B.x, P.y + sx * N.y + sy * B.y, P.z + sx * N.z + sy * B.z);
      pos.setXYZ(idx, v.x, v.y, v.z);
      n.set(sx * N.x + sy * B.x, sx * N.y + sy * B.y, sx * N.z + sy * B.z).normalize();
      nrm.setXYZ(idx, n.x, n.y, n.z);
    }
  }
  pos.needsUpdate = true;
  nrm.needsUpdate = true;
  geo.computeBoundingSphere();
  return geo;
}

/** Lathe from a profile of [radius, height] pairs. */
function lathe(profile, segments = 64) {
  const pts = profile.map(p => new THREE.Vector2(Math.max(p[0], 1e-5), p[1]));
  const geo = new THREE.LatheGeometry(pts, segments);
  geo.computeVertexNormals();
  return geo;
}

function mesh(geo, mat, parent) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}

/* ============================================================
   THE FIGURINE
   Scale: full piece ~ 0.26 m tall (a real mantel figurine).
   Plinth top sits at y = 0.030
   ============================================================ */
const figure = new THREE.Group();
scene.add(figure);

/* ---------- PLINTH: small round fluted base ---------- */
const plinth = new THREE.Group();
figure.add(plinth);

// Main fluted drum built as a lathe with a scalloped (fluted) cross-section.
// Build it manually so we can modulate radius by angle => real flutes.
function flutedDrum(profile, flutes = 22, fluteDepth = 0.0016, segments = 176) {
  const geo = lathe(profile, segments);
  const pos = geo.attributes.position;
  const V = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    V.fromBufferAttribute(pos, i);
    const r = Math.hypot(V.x, V.z);
    if (r < 1e-6) continue;
    const a = Math.atan2(V.z, V.x);
    // flutes fade out at the very top and bottom rims
    const y = V.y;
    const band = THREE.MathUtils.smoothstep(y, 0.0035, 0.010) * (1 - THREE.MathUtils.smoothstep(y, 0.0215, 0.0265));
    const d = (0.5 - 0.5 * Math.cos(flutes * a)) * fluteDepth * band;
    const nr = r - d;
    pos.setXYZ(i, (V.x / r) * nr, y, (V.z / r) * nr);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

// profile: [radius, y]  — bottom foot ring, fluted body, moulded top
const plinthProfile = [
  [0.0000, 0.0000],
  [0.0520, 0.0000],
  [0.0530, 0.0012],
  [0.0524, 0.0034],
  [0.0492, 0.0052],
  [0.0480, 0.0080],
  [0.0474, 0.0150],
  [0.0478, 0.0200],
  [0.0492, 0.0232],
  [0.0524, 0.0258],
  [0.0534, 0.0282],
  [0.0522, 0.0300],
  [0.0470, 0.0306],
  [0.0300, 0.0310],
  [0.0000, 0.0312]
];
const plinthMesh = mesh(flutedDrum(plinthProfile, 22, 0.0018, 192), matPlinth, plinth);
plinthMesh.material.map.repeat.set(1, 1);

// gold hairline ring around the plinth top moulding
const goldRing = mesh(new THREE.TorusGeometry(0.0533, 0.00075, 10, 160), matGold, plinth);
goldRing.rotation.x = Math.PI / 2;
goldRing.position.y = 0.0270;

/* ---------- TUTU: thin ruffled disc ---------- */
/**
 * Ruffled annulus: radius modulated by angle (ruffles) and a gentle downward
 * droop toward the rim. Custom UVs: u = angle, v = normalized radius.
 */
function tutuDisc({ rInner = 0.017, rOuter = 0.070, ruffles = 34, ruffleAmp = 0.0022,
                    droop = 0.010, lift = 0.0, radial = 44, angular = 320, thickness = 0.0016 }) {
  const positions = [], uvs = [], indices = [];
  const rings = radial + 1, segs = angular;

  const shape = (rt) => {
    // rt in 0..1 across the annulus; the skirt lifts a hair then droops
    const s = Math.pow(rt, 1.9);
    return lift * Math.sin(rt * Math.PI) - droop * s;
  };

  for (let i = 0; i < rings; i++) {
    const rt = i / (rings - 1);
    for (let j = 0; j <= segs; j++) {
      const a = (j / segs) * Math.PI * 2;
      // ruffle amplitude grows toward the rim, with a secondary harmonic
      const amp = ruffleAmp * Math.pow(rt, 1.6);
      const wob = Math.sin(ruffles * a) * amp + Math.sin(ruffles * 2 * a + 0.7) * amp * 0.32;
      const r = rInner + (rOuter - rInner) * rt + wob;
      // vertical flutter follows the ruffle phase (pleats)
      const flut = Math.cos(ruffles * a) * 0.0026 * Math.pow(rt, 2.3);
      const y = shape(rt) + flut;
      positions.push(Math.cos(a) * r, y, Math.sin(a) * r);
      uvs.push(j / segs, rt);
    }
  }
  const rowLen = segs + 1;
  for (let i = 0; i < rings - 1; i++) {
    for (let j = 0; j < segs; j++) {
      const a0 = i * rowLen + j, b0 = a0 + 1, c0 = a0 + rowLen, d0 = c0 + 1;
      indices.push(a0, c0, b0, b0, c0, d0);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

function buildArm(side) {
  // side: -1 = her right (screen +/-X), +1 = other
  const s = side;
  const pts = [
    [ s * 0.0150, 0.0468,  0.0000],   // shoulder
    [ s * 0.0225, 0.0560, -0.0030],   // upper arm rising outward
    [ s * 0.0250, 0.0680, -0.0050],   // elbow, softly bent
    [ s * 0.0205, 0.0800, -0.0040],   // forearm sweeping inward & up
    [ s * 0.0120, 0.0890, -0.0022],   // wrist
    [ s * 0.0058, 0.0932, -0.0010]    // hand base
  ];
  const geo = limb(pts, t => {
    const upper = 0.0052 - 0.0014 * t;
    const delt  = 0.0016 * Math.exp(-Math.pow((t - 0.06) / 0.16, 2));
    const elbow = -0.0004 * Math.exp(-Math.pow((t - 0.40) / 0.10, 2));
    const wrist = -0.0014 * Math.pow(Math.max(0, t - 0.70) / 0.30, 1.2);
    return Math.max(0.0022, upper + delt + elbow + wrist);
  }, 52, 18);
  const arm = mesh(geo, matPorcelain, torso);

  // hand: small flattened teardrop with fingers implied by a taper
  const hand = new THREE.Group();
  hand.position.set(s * 0.0058, 0.0932, -0.0010);
  hand.rotation.z = -s * 0.65;
  hand.rotation.x = -0.25;
  torso.add(hand);
  const hg = lathe([
    [0.0000, 0.0000],
    [0.0030, 0.0006],
    [0.0034, 0.0032],
    [0.0031, 0.0062],
    [0.0024, 0.0092],
    [0.0014, 0.0116],
    [0.0000, 0.0128]
  ], 26);
  const hm = mesh(hg, matPorcelain, hand);
  hm.scale.set(1.0, 1.0, 0.60);
  return arm;
}

const bounce = new THREE.PointLight(0xffe2c0, 0.35, 1.1, 2.0);
bounce.position.set(0.10, 0.02, 0.18);
scene.add(bounce);

// subtle specular sparkle source high above (reads as a softbox on the glaze)
const top = new THREE.SpotLight(0xffffff, 3.2, 2.0, Math.PI * 0.30, 0.75, 1.6);
top.position.set(0.06, 0.85, 0.10);
top.target.position.set(0, 0.14, 0);
scene.add(top);
scene.add(top.target);

/* --- Procedural environment for glaze reflections (softbox rig) --- */
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();

  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0x0e1014);

  const panel = (color, intensity, pos, scl, rotY) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide })
    );
    m.position.set(...pos);
    m.scale.set(scl[0], scl[1], 1);
    if (rotY !== undefined) m.rotation.y = rotY;
    m.lookAt(0, 0, 0);
    envScene.add(m);
  };

  // big soft key box, cool fill box, warm rim strip, bright ceiling
  panel(0xffffff, 3.0, [ 2.2, 2.0,  1.6], [3.2, 2.6]);
  panel(0xc8d8ff, 1.2, [-2.6, 1.0,  1.2], [3.0, 2.4]);
  panel(0xffd9b0, 1.6, [-1.2, 1.6, -2.6], [2.6, 1.6]);

  const ceil = new THREE.Mesh(
    new THREE.PlaneGeometry(9, 9),
    new THREE.MeshBasicMaterial({ color: 0x9fb0c8, side: THREE.DoubleSide })
  );
  ceil.rotation.x = Math.PI / 2;
  ceil.position.y = 3.4;
  envScene.add(ceil);

  const floorEnv = new THREE.Mesh(
    new THREE.PlaneGeometry(9, 9),
    new THREE.MeshBasicMaterial({ color: 0x14161a, side: THREE.DoubleSide })
  );
  floorEnv.rotation.x = -Math.PI / 2;
  floorEnv.position.y = -2.2;
  envScene.add(floorEnv);

  const envRT = pmrem.fromScene(envScene, 0.04);
  scene.environment = envRT.texture;
  pmrem.dispose();
  envScene.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) o.material.dispose();
  });
}

/* ============================================================
   RESIZE + RENDER LOOP
   ============================================================ */
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
