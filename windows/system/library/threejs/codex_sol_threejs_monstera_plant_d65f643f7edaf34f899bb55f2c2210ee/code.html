<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Monstera</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #e8e4dc;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(30, 39, 31, 0.6);
      font: 500 12px/1.4 system-ui, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Monstera deliciosa</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe9e6df);
    scene.fog = new THREE.Fog(0xe9e6df, 13, 24);

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 60);
    camera.position.set(7.4, 5.2, 8.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.7, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;
    controls.minDistance = 5.5;
    controls.maxDistance = 16;
    controls.maxPolarAngle = Math.PI * 0.49;

    scene.add(new THREE.HemisphereLight(0xf7fbf2, 0x6b665b, 2.05));

    const key = new THREE.DirectionalLight(0xfff6df, 4.1);
    key.position.set(-5, 9, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -7;
    key.shadow.camera.right = 7;
    key.shadow.camera.top = 8;
    key.shadow.camera.bottom = -3;
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 22;
    key.shadow.bias = -0.00018;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xbdd9cb, 1.25);
    fill.position.set(6, 5, -5);
    scene.add(fill);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(12, 96),
      new THREE.MeshStandardMaterial({ color: 0xd8d2c7, roughness: 0.88, metalness: 0 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const plant = new THREE.Group();
    scene.add(plant);

    const potMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xc7a98c,
      roughness: 0.38,
      metalness: 0,
      clearcoat: 0.34,
      clearcoatRoughness: 0.42
    });

    const potProfile = [
      new THREE.Vector2(0.76, 0.06),
      new THREE.Vector2(0.82, 0.14),
      new THREE.Vector2(0.88, 0.52),
      new THREE.Vector2(0.96, 1.22),
      new THREE.Vector2(1.00, 1.39),
      new THREE.Vector2(1.00, 1.49),
      new THREE.Vector2(0.86, 1.54),
      new THREE.Vector2(0.72, 1.55)
    ];
    const pot = new THREE.Mesh(new THREE.LatheGeometry(potProfile, 64), potMaterial);
    pot.castShadow = true;
    pot.receiveShadow = true;
    plant.add(pot);

    const rim = new THREE.Mesh(
      new THREE.TorusGeometry(0.92, 0.075, 18, 64),
      potMaterial
    );
    rim.rotation.x = Math.PI / 2;
    rim.position.y = 1.48;
    rim.castShadow = true;
    plant.add(rim);

    const soil = new THREE.Mesh(
      new THREE.CircleGeometry(0.84, 64),
      new THREE.MeshStandardMaterial({ color: 0x352b22, roughness: 1 })
    );
    soil.rotation.x = -Math.PI / 2;
    soil.position.y = 1.49;
    soil.receiveShadow = true;
    plant.add(soil);

    const stemMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x315f35,
      roughness: 0.48,
      clearcoat: 0.18
    });

    const leafMaterials = [
      new THREE.MeshPhysicalMaterial({
        color: 0x176232,
        roughness: 0.3,
        metalness: 0,
        clearcoat: 0.42,
        clearcoatRoughness: 0.24,
        side: THREE.DoubleSide
      }),
      new THREE.MeshPhysicalMaterial({
        color: 0x24733b,
        roughness: 0.32,
        clearcoat: 0.38,
        clearcoatRoughness: 0.26,
        side: THREE.DoubleSide
      }),
      new THREE.MeshPhysicalMaterial({
        color: 0x0e512b,
        roughness: 0.29,
        clearcoat: 0.46,
        clearcoatRoughness: 0.22,
        side: THREE.DoubleSide
      })
    ];

    function ellipseHole(shape, x, y, rx, ry, angle) {
      const path = new THREE.Path();
      const count = 28;
      for (let i = 0; i <= count; i++) {
        const a = Math.PI * 2 * i / count;
        const px = x + Math.cos(a) * rx * Math.cos(angle) - Math.sin(a) * ry * Math.sin(angle);
        const py = y + Math.cos(a) * rx * Math.sin(angle) + Math.sin(a) * ry * Math.cos(angle);
        if (i === 0) path.moveTo(px, py);
        else path.lineTo(px, py);
      }
      shape.holes.push(path);
    }

    function createLeafGeometry(width, length, fenestrated = true, droop = 0.1) {
      const left = [
        [0, -0.49], [-0.18, -0.64], [-0.43, -0.67], [-0.7, -0.56],
        [-0.91, -0.36], [-0.98, -0.1], [-0.91, 0.06],
        [-0.52, 0.09], [-0.9, 0.24], [-0.82, 0.43],
        [-0.43, 0.45], [-0.73, 0.59], [-0.59, 0.76],
        [-0.27, 0.73], [-0.39, 0.86], [-0.18, 0.98], [0, 1.08]
      ];
      const points = left.map(p => new THREE.Vector2(p[0] * width * 0.5, p[1] * length * 0.62));
      for (let i = left.length - 2; i >= 0; i--) {
        points.push(new THREE.Vector2(-left[i][0] * width * 0.5, left[i][1] * length * 0.62));
      }

      const shape = new THREE.Shape(points);
      if (fenestrated) {
        ellipseHole(shape, -width * 0.19, length * 0.12, width * 0.065, length * 0.13, -0.3);
        ellipseHole(shape,  width * 0.19, length * 0.12, width * 0.065, length * 0.13,  0.3);
        ellipseHole(shape, -width * 0.27, length * 0.31, width * 0.052, length * 0.105, -0.48);
        ellipseHole(shape,  width * 0.27, length * 0.31, width * 0.052, length * 0.105,  0.48);
        if (width > 1.45) {
          ellipseHole(shape, -width * 0.13, length * 0.42, width * 0.042, length * 0.09, -0.18);
          ellipseHole(shape,  width * 0.13, length * 0.42, width * 0.042, length * 0.09,  0.18);
        }
      }

      const geometry = new THREE.ShapeGeometry(shape, 10);
      const pos = geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const nx = x / Math.max(width * 0.5, 0.001);
        const ny = (y + length * 0.3) / length;
        const ridge = 0.075 * (1 - Math.min(1, Math.abs(nx)));
        const curl = -droop * Math.max(0, ny) * Math.max(0, ny);
        const edgeWave = 0.018 * Math.sin(ny * 19 + nx * 6) * Math.abs(nx);
        pos.setZ(i, ridge + curl + edgeWave);
      }
      geometry.computeVertexNormals();
      return geometry;
    }

    function tubeBetween(points, radius, material, radialSegments = 10) {
      const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
      const mesh = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 30, radius, radialSegments, false),
        material
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return { mesh, curve };
    }

    function orientLeaf(group, axis, facing) {
      const y = axis.clone().normalize();
      let z = facing.clone().normalize();
      let x = new THREE.Vector3().crossVectors(y, z);
      if (x.lengthSq() < 0.001) x.set(1, 0, 0);
      x.normalize();
      z = new THREE.Vector3().crossVectors(x, y).normalize();
      const matrix = new THREE.Matrix4().makeBasis(x, y, z);
      group.quaternion.setFromRotationMatrix(matrix);
    }

    const leafSpecs = [
      { end: [-2.55, 4.25, 0.35], bend: [-0.75, 3.05, 0.15], w: 2.15, l: 2.55, face: [-0.1, 0.5, 1], roll: -0.13, mat: 0, drop: 0.18 },
      { end: [ 2.42, 4.48, 0.15], bend: [ 0.82, 3.25, 0.08], w: 2.12, l: 2.48, face: [0.1, 0.45, 1], roll: 0.12, mat: 1, drop: 0.12 },
      { end: [-1.35, 5.55,-0.75], bend: [-0.48, 4.08,-0.32], w: 1.95, l: 2.35, face: [-0.15, 0.55, 0.8], roll: -0.07, mat: 2, drop: 0.08 },
      { end: [ 1.35, 5.70,-0.48], bend: [ 0.48, 4.22,-0.24], w: 1.82, l: 2.22, face: [0.2, 0.65, 0.75], roll: 0.1, mat: 0, drop: 0.07 },
      { end: [ 0.15, 6.28, 0.38], bend: [ 0.05, 4.65, 0.18], w: 1.72, l: 2.12, face: [0, 0.4, 1], roll: 0.03, mat: 1, drop: 0.05 },
      { end: [-2.05, 3.40,-1.12], bend: [-0.72, 2.82,-0.55], w: 1.72, l: 2.08, face: [-0.2, 0.1, 1], roll: -0.25, mat: 1, drop: 0.27 },
      { end: [ 2.15, 3.24,-0.92], bend: [ 0.78, 2.76,-0.45], w: 1.62, l: 1.98, face: [0.2, 0.05, 1], roll: 0.28, mat: 2, drop: 0.3 },
      { end: [-0.15, 4.72, 1.35], bend: [-0.08, 3.55, 0.72], w: 1.58, l: 1.95, face: [0, 0.32, 1], roll: -0.03, mat: 0, drop: 0.12 },
      { end: [ 1.15, 3.72, 1.28], bend: [ 0.45, 3.05, 0.67], w: 1.35, l: 1.72, face: [0.15, 0.25, 1], roll: 0.22, mat: 1, drop: 0.2 }
    ];

    leafSpecs.forEach((spec, index) => {
      const start = new THREE.Vector3(
        (index % 3 - 1) * 0.13,
        1.48,
        ((index * 7) % 5 - 2) * 0.09
      );
      const bend = new THREE.Vector3(...spec.bend);
      const end = new THREE.Vector3(...spec.end);
      const stem = tubeBetween([start, bend, end], 0.055 + spec.w * 0.006, stemMaterial, 10);
      plant.add(stem.mesh);

      const tangent = stem.curve.getTangent(1).normalize();
      const leafAxis = tangent.clone().multiplyScalar(0.35)
        .add(end.clone().sub(bend).normalize().multiplyScalar(0.65))
        .normalize();

      const leafGroup = new THREE.Group();
      leafGroup.position.copy(end);
      orientLeaf(leafGroup, leafAxis, new THREE.Vector3(...spec.face));
      leafGroup.rotateY(spec.roll);

      const leaf = new THREE.Mesh(
        createLeafGeometry(spec.w, spec.l, index !== 8, spec.drop),
        leafMaterials[spec.mat]
      );
      leaf.position.y = spec.l * 0.28;
      leaf.castShadow = true;
      leaf.receiveShadow = true;
      leafGroup.add(leaf);

      const ribStart = new THREE.Vector3(0, -spec.l * 0.28, 0.05);
      const ribEnd = new THREE.Vector3(0, spec.l * 0.88, -spec.drop * 0.72 + 0.04);
      const rib = tubeBetween(
        [
          ribStart,
          new THREE.Vector3(0, spec.l * 0.26, 0.09),
          ribEnd
        ],
        0.018 + spec.w * 0.004,
        new THREE.MeshStandardMaterial({ color: 0x82a85b, roughness: 0.5 }),
        7
      ).mesh;
      rib.position.y = spec.l * 0.28;
      leafGroup.add(rib);

      for (let side of [-1, 1]) {
        for (let j = 0; j < 4; j++) {
          const yy = spec.l * (0.12 + j * 0.16);
          const reach = spec.w * (0.32 - j * 0.025);
          const vein = tubeBetween(
            [
              new THREE.Vector3(0, yy, 0.055),
              new THREE.Vector3(side * reach * 0.55, yy + spec.l * 0.08, 0.045),
              new THREE.Vector3(side * reach, yy + spec.l * 0.13, 0.012)
            ],
            0.007,
            new THREE.MeshStandardMaterial({ color: 0x78a45b, roughness: 0.55 }),
            5
          ).mesh;
          vein.position.y = spec.l * 0.28;
          leafGroup.add(vein);
        }
      }
      plant.add(leafGroup);
    });

    const smallStalks = [
      [-0.35, 1.52, 0.2, -0.48, 2.28, 0.3],
      [0.25, 1.52, -0.15, 0.38, 2.18, -0.28],
      [0.05, 1.52, 0.25, 0.12, 2.42, 0.5]
    ];
    smallStalks.forEach(s => {
      plant.add(tubeBetween([
        new THREE.Vector3(s[0], s[1], s[2]),
        new THREE.Vector3(s[3] * 0.7, (s[1] + s[4]) * 0.5, s[5] * 0.7),
        new THREE.Vector3(s[3], s[4], s[5])
      ], 0.045, stemMaterial, 8).mesh);
    });

    const saucer = new THREE.Mesh(
      new THREE.CylinderGeometry(1.08, 1.15, 0.11, 64),
      new THREE.MeshPhysicalMaterial({
        color: 0xb89a7e,
        roughness: 0.4,
        clearcoat: 0.25
      })
    );
    saucer.position.y = 0.055;
    saucer.castShadow = true;
    saucer.receiveShadow = true;
    plant.add(saucer);

    plant.rotation.y = -0.18;

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    }
    addEventListener('resize', resize);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      plant.rotation.z = Math.sin(t * 0.28) * 0.003;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
