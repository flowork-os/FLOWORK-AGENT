<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gingerbread House</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f7d9a9; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf7d9a9);
scene.fog = new THREE.Fog(0xf7d9a9, 12, 24);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.2, 4.7, 7.4);
camera.lookAt(0, 0.85, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 5;
controls.maxDistance = 12;
controls.target.set(0, 0.8, 0);

const baked = new THREE.MeshStandardMaterial({ color: 0x9a4d25, roughness: 0.72, metalness: 0.02 });
const bakedLight = new THREE.MeshStandardMaterial({ color: 0xb76532, roughness: 0.68 });
const roofMat = new THREE.MeshStandardMaterial({ color: 0x743518, roughness: 0.78 });
const icing = new THREE.MeshStandardMaterial({ color: 0xfff8e7, roughness: 0.25, metalness: 0.02 });
const icingShadow = new THREE.MeshStandardMaterial({ color: 0xf0d8b4, roughness: 0.35 });
const redCandy = new THREE.MeshStandardMaterial({ color: 0xd32f2f, roughness: 0.2, metalness: 0.05 });
const greenCandy = new THREE.MeshStandardMaterial({ color: 0x3d9b59, roughness: 0.18, metalness: 0.04 });
const yellowCandy = new THREE.MeshStandardMaterial({ color: 0xf3c542, roughness: 0.18, metalness: 0.04 });
const blueCandy = new THREE.MeshStandardMaterial({ color: 0x4aa7c7, roughness: 0.18, metalness: 0.04 });
const glassMat = new THREE.MeshStandardMaterial({ color: 0x315c68, roughness: 0.22, metalness: 0.08 });
const doorMat = new THREE.MeshStandardMaterial({ color: 0x64311d, roughness: 0.6 });
const goldMat = new THREE.MeshStandardMaterial({ color: 0xf1b93a, roughness: 0.25, metalness: 0.3 });

function mesh(geometry, material, position = [0, 0, 0], rotation = [0, 0, 0]) {
  const item = new THREE.Mesh(geometry, material);
  item.position.set(...position);
  item.rotation.set(...rotation);
  item.castShadow = true;
  item.receiveShadow = true;
  scene.add(item);
  return item;
}

function cylinderBetween(a, b, radius, material, radial = 12) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const direction = end.clone().sub(start);
  const item = mesh(new THREE.CylinderGeometry(radius, radius, direction.length(), radial), material);
  item.position.copy(start.clone().add(end).multiplyScalar(0.5));
  item.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  return item;
}

function icingLine(a, b, radius = 0.075) {
  return cylinderBetween(a, b, radius, icing, 12);
}

function gumdrop(position, color, scale = 1) {
  const item = mesh(new THREE.SphereGeometry(0.22 * scale, 20, 14), color, position);
  item.scale.set(1, 1.12, 1);
  return item;
}

function icingDot(position, scale = 1) {
  return mesh(new THREE.SphereGeometry(0.09 * scale, 16, 12), icing, position);
}

function windowUnit(x, y, z, scale = 1) {
  mesh(new THREE.BoxGeometry(0.72 * scale, 0.7 * scale, 0.08), glassMat, [x, y, z]);
  mesh(new THREE.BoxGeometry(0.11 * scale, 0.82 * scale, 0.13), icing, [x - 0.43 * scale, y, z + 0.02]);
  mesh(new THREE.BoxGeometry(0.11 * scale, 0.82 * scale, 0.13), icing, [x + 0.43 * scale, y, z + 0.02]);
  mesh(new THREE.BoxGeometry(0.98 * scale, 0.11 * scale, 0.13), icing, [x, y - 0.42 * scale, z + 0.02]);
  mesh(new THREE.BoxGeometry(0.98 * scale, 0.11 * scale, 0.13), icing, [x, y + 0.42 * scale, z + 0.02]);
  mesh(new THREE.BoxGeometry(0.08 * scale, 0.7 * scale, 0.14), icing, [x, y, z + 0.04]);
  mesh(new THREE.BoxGeometry(0.72 * scale, 0.08 * scale, 0.14), icing, [x, y, z + 0.04]);
  icingDot([x - 0.48 * scale, y + 0.48 * scale, z + 0.08], 0.72 * scale);
  icingDot([x + 0.48 * scale, y + 0.48 * scale, z + 0.08], 0.72 * scale);
}

function peppermint(x, y, z, scale = 1) {
  mesh(new THREE.CylinderGeometry(0.34 * scale, 0.34 * scale, 0.12 * scale, 32), icing, [x, y, z], [Math.PI / 2, 0, 0]);
  for (let index = 0; index < 4; index++) {
    const stripe = mesh(new THREE.BoxGeometry(0.1 * scale, 0.62 * scale, 0.035 * scale), redCandy, [x, y, z + 0.075 * scale]);
    stripe.rotation.z = index * Math.PI / 4;
  }
  icingDot([x, y, z + 0.11 * scale], 0.11 * scale);
}

function candyCaneFrame() {
  const points = [
    [-0.72, -1.05, 1.59],
    [-0.72, 0.12, 1.59],
    [-0.66, 0.42, 1.59],
    [-0.48, 0.68, 1.59],
    [-0.22, 0.82, 1.59],
    [0, 0.86, 1.59],
    [0.22, 0.82, 1.59],
    [0.48, 0.68, 1.59],
    [0.66, 0.42, 1.59],
    [0.72, 0.12, 1.59],
    [0.72, -1.05, 1.59]
  ];
  for (let index = 0; index < points.length - 1; index++) {
    cylinderBetween(points[index], points[index + 1], 0.145, icing, 14);
    cylinderBetween(points[index], points[index + 1], 0.095, index % 2 === 0 ? redCandy : icing, 12);
  }
  for (let index = 1; index < points.length - 1; index += 2) {
    mesh(new THREE.SphereGeometry(0.105, 14, 10), redCandy, points[index]);
  }
}

mesh(new THREE.CylinderGeometry(3.55, 3.75, 0.32, 64), icingShadow, [0, -1.28, 0]);
mesh(new THREE.CylinderGeometry(3.15, 3.15, 0.12, 64), icing, [0, -1.09, 0]);

mesh(new THREE.BoxGeometry(3.35, 2.45, 3.05), baked, [0, 0.08, 0]);
mesh(new THREE.BoxGeometry(3.42, 0.16, 3.12), icingShadow, [0, 1.28, 0]);

const gableShape = new THREE.Shape();
gableShape.moveTo(-1.72, 1.22);
gableShape.lineTo(0, 2.72);
gableShape.lineTo(1.72, 1.22);
gableShape.closePath();
const gableGeometry = new THREE.ExtrudeGeometry(gableShape, { depth: 0.18, bevelEnabled: false });
mesh(gableGeometry, bakedLight, [0, 0, 1.46]);

mesh(new THREE.BoxGeometry(2.06, 0.22, 3.38), roofMat, [-0.78, 2.05, 0], [0, 0, -0.64]);
mesh(new THREE.BoxGeometry(2.06, 0.22, 3.38), roofMat, [0.78, 2.05, 0], [0, 0, 0.64]);

icingLine([-1.73, 1.36, 1.59], [0, 2.78, 1.59], 0.085);
icingLine([0, 2.78, 1.59], [1.73, 1.36, 1.59], 0.085);
icingLine([-1.73, 1.36, -1.59], [0, 2.78, -1.59], 0.085);
icingLine([0, 2.78, -1.59], [1.73, 1.36, -1.59], 0.085);
icingLine([-1.87, 1.35, 1.59], [-0.06, 2.83, 1.59], 0.14);
icingLine([0.06, 2.83, 1.59], [1.87, 1.35, 1.59], 0.14);

windowUnit(-1.02, 0.52, 1.58, 0.92);
windowUnit(1.02, 0.52, 1.58, 0.92);

mesh(new THREE.BoxGeometry(1.3, 1.55, 0.12), doorMat, [0, -0.27, 1.6]);
mesh(new THREE.BoxGeometry(0.08, 1.4, 0.14), icing, [-0.49, -0.24, 1.68]);
mesh(new THREE.BoxGeometry(0.08, 1.4, 0.14), icing, [0.49, -0.24, 1.68]);
candyCaneFrame();
mesh(new THREE.SphereGeometry(0.08, 16, 12), goldMat, [0.34, -0.25, 1.69]);
mesh(new THREE.BoxGeometry(0.76, 0.12, 0.12), icing, [0, 0.58, 1.68]);

peppermint(-1.03, 2.1, 1.63, 0.72);
peppermint(1.03, 2.1, 1.63, 0.72);

const frontSweets = [
  [-1.48, -0.95, redCandy, 0.85],
  [-0.98, -1.0, yellowCandy, 0.78],
  [1.1, -1.0, greenCandy, 0.9],
  [1.56, -0.92, redCandy, 0.78],
  [-1.62, 0.02, blueCandy, 0.72],
  [1.62, 0.04, yellowCandy, 0.72],
  [-1.43, 1.22, greenCandy, 0.66],
  [1.43, 1.22, redCandy, 0.66]
];
for (const sweet of frontSweets) {
  gumdrop([sweet[0], sweet[1], 1.63], sweet[2], sweet[3]);
}

for (let index = -5; index <= 5; index++) {
  const x = index * 0.28;
  icingDot([x, 1.38 + 0.05 * Math.cos(index), 1.67], 0.78);
}
for (let index = -4; index <= 4; index++) {
  icingDot([index * 0.34, -1.12, 1.67], 0.72);
}

const sideSweets = [
  [-1.74, 0.86, -0.55, redCandy],
  [-1.74, -0.2, 0.2, yellowCandy],
  [-1.74, -0.9, 0.8, greenCandy],
  [1.74, 0.85, -0.55, blueCandy],
  [1.74, -0.22, 0.2, redCandy],
  [1.74, -0.88, 0.8, yellowCandy]
];
for (const sweet of sideSweets) {
  gumdrop([sweet[0], sweet[1], sweet[2]], sweet[3], 0.72);
}

for (let index = 0; index < 7; index++) {
  const x = -1.52 + index * 0.5;
  gumdrop([x, 1.48, -1.62], [redCandy, greenCandy, yellowCandy][index % 3], 0.48);
}

const warmLight = new THREE.PointLight(0xffb45a, 2.2, 5.5);
warmLight.position.set(0, 0.15, 2.5);
warmLight.castShadow = true;
scene.add(warmLight);

const keyLight = new THREE.DirectionalLight(0xfff0d1, 3.1);
keyLight.position.set(-4, 7, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -6;
scene.add(keyLight);

const fillLight = new THREE.HemisphereLight(0xffe8c7, 0x8c482e, 1.6);
scene.add(fillLight);

const backgroundGlow = new THREE.PointLight(0xffd49c, 1.2, 10);
backgroundGlow.position.set(3, 2, -4);
scene.add(backgroundGlow);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
