<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Houseplant</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #e8e4dc; }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 20px;
      bottom: 18px;
      color: rgba(40, 46, 37, 0.68);
      font: 12px/1.4 system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Procedural houseplant · centimeter scale</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xe8e4dc);
    scene.fog = new THREE.Fog(0xe8e4dc, 105, 210);

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 400);
    camera.position.set(72, 51, 78);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 29, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.45;
    controls.minDistance = 55;
    controls.maxDistance = 180;
    controls.maxPolarAngle = Math.PI * 0.49;

    const hemi = new THREE.HemisphereLight(0xf5f2e8, 0x6e7567, 2.2);
    scene.add(hemi);

    const keyLight = new THREE.DirectionalLight(0xfff3dd, 4.4);
    keyLight.position.set(-45, 82, 55);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -65;
    keyLight.shadow.camera.right = 65;
    keyLight.shadow.camera.top = 90;
    keyLight.shadow.camera.bottom = -35;
    keyLight.shadow.camera.near = 10;
    keyLight.shadow.camera.far = 180;
    keyLight.shadow.bias = -0.00035;
    keyLight.shadow.normalBias = 0.025;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xcfe2ff, 1.35);
    fillLight.position.set(55, 44, -42);
    scene.add(fillLight);

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0xd5d0c5,
      roughness: 0.88,
      metalness: 0
    });
    const floor = new THREE.Mesh(new THREE.CircleGeometry(145, 96), floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const plant = new THREE.Group();
    scene.add(plant);

    const ceramicMaterial = new THREE.MeshStandardMaterial({
      color: 0xb96d47,
      roughness: 0.48,
      metalness: 0,
      side: THREE.DoubleSide
    });
    const ceramicDarkMaterial = new THREE.MeshStandardMaterial({
      color: 0x925137,
      roughness: 0.58,
      side: THREE.DoubleSide
    });
    const soilMaterial = new THREE.MeshStandardMaterial({
      color: 0x30241b,
      roughness: 1
    });
    const stemMaterial = new THREE.MeshStandardMaterial({
      color: 0x426a36,
      roughness: 0.72
    });

    function lathe(points, material, segments = 96) {
      const mesh = new THREE.Mesh(new THREE.LatheGeometry(points, segments), material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    const saucerProfile = [
      new THREE.Vector2(0.5, 0.35),
      new THREE.Vector2(11.0, 0.35),
      new THREE.Vector2(13.6, 0.7),
      new THREE.Vector2(14.2, 1.35),
      new THREE.Vector2(14.1, 2.2),
      new THREE.Vector2(13.55, 3.05),
      new THREE.Vector2(12.8, 3.35),
      new THREE.Vector2(12.45, 2.55),
      new THREE.Vector2(12.7, 1.8),
      new THREE.Vector2(10.7, 1.35),
      new THREE.Vector2(0.5, 1.35)
    ];
    const saucer = lathe(saucerProfile, ceramicMaterial);
    plant.add(saucer);

    const saucerInset = new THREE.Mesh(
      new THREE.CylinderGeometry(11.7, 11.7, 0.16, 96),
      ceramicDarkMaterial
    );
    saucerInset.position.y = 1.48;
    saucerInset.receiveShadow = true;
    plant.add(saucerInset);

    const potProfile = [
      new THREE.Vector2(8.0, 2.35),
      new THREE.Vector2(8.6, 2.35),
      new THREE.Vector2(11.15, 16.1),
      new THREE.Vector2(12.05, 16.55),
      new THREE.Vector2(12.25, 18.0),
      new THREE.Vector2(11.95, 18.65),
      new THREE.Vector2(10.7, 18.65),
      new THREE.Vector2(10.55, 17.65),
      new THREE.Vector2(8.25, 3.45)
    ];
    const pot = lathe(potProfile, ceramicMaterial);
    plant.add(pot);

    const foot = new THREE.Mesh(
      new THREE.TorusGeometry(8.15, 0.34, 14, 96),
      ceramicDarkMaterial
    );
    foot.rotation.x = Math.PI / 2;
    foot.position.y = 2.58;
    foot.castShadow = true;
    plant.add(foot);

    const soil = new THREE.Mesh(
      new THREE.CylinderGeometry(10.52, 10.28, 0.72, 96),
      soilMaterial
    );
    soil.position.y = 17.55;
    soil.receiveShadow = true;
    plant.add(soil);

    const rimHighlight = new THREE.Mesh(
      new THREE.TorusGeometry(11.6, 0.48, 20, 96),
      ceramicMaterial
    );
    rimHighlight.rotation.x = Math.PI / 2;
    rimHighlight.position.y = 18.18;
    rimHighlight.castShadow = true;
    plant.add(rimHighlight);

    let seed = 92741;
    function random() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    function range(min, max) {
      return min + (max - min) * random();
    }

    function createLeafGeometry(length, width, arch, droop) {
      const across = 10;
      const along = 24;
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let iy = 0; iy <= along; iy++) {
        const t = iy / along;
        const envelope = Math.pow(Math.max(0.018, Math.sin(Math.PI * t)), 0.68);
        const halfWidth = width * 0.5 * envelope;
        const centerHeight =
          arch * Math.sin(Math.PI * t) -
          droop * t * t +
          0.12 * Math.sin(t * Math.PI * 2);

        for (let ix = 0; ix <= across; ix++) {
          const s = ix / across;
          const side = s * 2 - 1;
          const x = side * halfWidth;
          const edgeCurl = -0.34 * Math.pow(Math.abs(side), 2.3) * envelope;
          const rib = 0.2 * (1 - Math.abs(side)) * Math.sin(Math.PI * t);
          positions.push(x, length * t, centerHeight + edgeCurl + rib);
          uvs.push(s, t);
        }
      }

      for (let iy = 0; iy < along; iy++) {
        for (let ix = 0; ix < across; ix++) {
          const a = iy * (across + 1) + ix;
          const b = a + 1;
          const c = a + across + 1;
          const d = c + 1;
          indices.push(a, c, b, b, c, d);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    const leafMaterials = [
      new THREE.MeshStandardMaterial({
        color: 0x3e793c,
        roughness: 0.62,
        side: THREE.DoubleSide
      }),
      new THREE.MeshStandardMaterial({
        color: 0x4e8945,
        roughness: 0.6,
        side: THREE.DoubleSide
      }),
      new THREE.MeshStandardMaterial({
        color: 0x2f6634,
        roughness: 0.65,
        side: THREE.DoubleSide
      }),
      new THREE.MeshStandardMaterial({
        color: 0x5a914d,
        roughness: 0.58,
        side: THREE.DoubleSide
      })
    ];

    const yAxis = new THREE.Vector3(0, 1, 0);

    function addLeaf(index) {
      const central = index < 7;
      const angle = index * 2.399963 + range(-0.28, 0.28);
      const rootRadius = central ? range(0.5, 2.7) : range(1.5, 6.0);
      const root = new THREE.Vector3(
        Math.cos(angle) * rootRadius,
        17.9,
        Math.sin(angle) * rootRadius
      );

      const stemHeight = central ? range(18, 27) : range(8.5, 19);
      const stemReach = central ? range(1.5, 6.0) : range(5.0, 12.0);
      const stemEnd = new THREE.Vector3(
        root.x + Math.cos(angle) * stemReach,
        root.y + stemHeight,
        root.z + Math.sin(angle) * stemReach
      );

      const bend = new THREE.Vector3(
        root.x + Math.cos(angle) * stemReach * 0.28 + range(-1.2, 1.2),
        root.y + stemHeight * 0.48,
        root.z + Math.sin(angle) * stemReach * 0.28 + range(-1.2, 1.2)
      );
      const curve = new THREE.CatmullRomCurve3([root, bend, stemEnd]);
      const stemRadius = central ? range(0.25, 0.34) : range(0.18, 0.29);
      const stem = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 18, stemRadius, 7, false),
        stemMaterial
      );
      stem.castShadow = true;
      plant.add(stem);

      const length = central ? range(16.5, 23.5) : range(15.0, 25.0);
      const width = length * range(0.36, 0.49);
      const elevation = central ? range(0.36, 0.78) : range(-0.18, 0.38);
      const outward = new THREE.Vector3(
        Math.cos(angle) * Math.cos(elevation),
        Math.sin(elevation),
        Math.sin(angle) * Math.cos(elevation)
      ).normalize();

      const arch = range(1.1, 2.5);
      const droop = central ? range(0.2, 1.2) : range(1.0, 3.8);
      const leafGroup = new THREE.Group();
      leafGroup.position.copy(stemEnd);
      leafGroup.quaternion.setFromUnitVectors(yAxis, outward);
      leafGroup.rotateY(range(-0.22, 0.22));

      const leaf = new THREE.Mesh(
        createLeafGeometry(length, width, arch, droop),
        leafMaterials[index % leafMaterials.length]
      );
      leaf.castShadow = true;
      leaf.receiveShadow = true;
      leafGroup.add(leaf);

      const veinPoints = [];
      for (let i = 0; i <= 12; i++) {
        const t = i / 12;
        const z =
          arch * Math.sin(Math.PI * t) -
          droop * t * t +
          0.34;
        veinPoints.push(new THREE.Vector3(0, length * t, z));
      }
      const veinCurve = new THREE.CatmullRomCurve3(veinPoints);
      const veinMaterial = new THREE.MeshStandardMaterial({
        color: index % 3 === 0 ? 0x8eaa58 : 0x6f944b,
        roughness: 0.7
      });
      const vein = new THREE.Mesh(
        new THREE.TubeGeometry(veinCurve, 18, 0.075, 5, false),
        veinMaterial
      );
      vein.castShadow = true;
      leafGroup.add(vein);

      plant.add(leafGroup);
    }

    for (let i = 0; i < 27; i++) addLeaf(i);

    const pebbleGeometry = new THREE.DodecahedronGeometry(0.42, 0);
    const pebbleMaterial = new THREE.MeshStandardMaterial({
      color: 0x625346,
      roughness: 1
    });
    for (let i = 0; i < 34; i++) {
      const a = range(0, Math.PI * 2);
      const r = Math.sqrt(random()) * 9.6;
      const pebble = new THREE.Mesh(pebbleGeometry, pebbleMaterial);
      pebble.position.set(Math.cos(a) * r, 17.98, Math.sin(a) * r);
      pebble.scale.set(range(0.45, 1.15), range(0.2, 0.48), range(0.45, 1.15));
      pebble.rotation.set(range(0, Math.PI), range(0, Math.PI), range(0, Math.PI));
      pebble.castShadow = true;
      plant.add(pebble);
    }

    const backdrop = new THREE.Mesh(
      new THREE.PlaneGeometry(300, 170),
      new THREE.MeshStandardMaterial({
        color: 0xe2ded5,
        roughness: 1
      })
    );
    backdrop.position.set(0, 75, -92);
    backdrop.receiveShadow = true;
    scene.add(backdrop);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
