<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portable Generator</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1a1d21}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d21);
scene.fog = new THREE.Fog(0x1a1d21, 12, 26);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(4.2, 2.6, 4.6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.HemisphereLight(0xcfd8e3, 0x2a2620, 0.55));
const key = new THREE.DirectionalLight(0xfff2e0, 2.2);
key.position.set(5, 7, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -4;
key.shadow.camera.right = key.shadow.camera.top = 4;
key.shadow.bias = -0.0005;
key.shadow.radius = 6;
scene.add(key);
const rim = new THREE.DirectionalLight(0x8fb8ff, 0.7);
rim.position.set(-5, 3, -4);
scene.add(rim);

// Ground with soft shadow
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(12, 64),
  new THREE.MeshStandardMaterial({ color: 0x24282d, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Materials
const mBody   = new THREE.MeshStandardMaterial({ color: 0xd9481f, roughness: 0.45, metalness: 0.25 }); // engine red-orange
const mFrame  = new THREE.MeshStandardMaterial({ color: 0x2b2e33, roughness: 0.5,  metalness: 0.6 });  // black tube frame
const mSteel  = new THREE.MeshStandardMaterial({ color: 0x9aa2ab, roughness: 0.35, metalness: 0.85 });
const mDark   = new THREE.MeshStandardMaterial({ color: 0x1c1e22, roughness: 0.7,  metalness: 0.2 });
const mPanel  = new THREE.MeshStandardMaterial({ color: 0x33373d, roughness: 0.55, metalness: 0.4 });
const mRubber = new THREE.MeshStandardMaterial({ color: 0x141517, roughness: 0.9,  metalness: 0 });
const mYellow = new THREE.MeshStandardMaterial({ color: 0xe8b820, roughness: 0.5,  metalness: 0.2 });
const mMuff   = new THREE.MeshStandardMaterial({ color: 0x6f7378, roughness: 0.3,  metalness: 0.9 });

const gen = new THREE.Group();
scene.add(gen);
function add(parent, geo, mat, x=0, y=0, z=0, rx=0, ry=0, rz=0){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}

// ---- Tubular roll frame (open cage) ----
const R = 0.045, FW = 0.62, FL = 1.05, FH = 1.02, FY0 = 0.14;
const tube = (len) => new THREE.CylinderGeometry(R, R, len, 16);
const knee = () => new THREE.SphereGeometry(R*1.05, 12, 12);
for (const sx of [-1, 1]) {
  const x = sx*FW;
  // uprights
  add(gen, tube(FH), mFrame,  x, FY0+FH/2,  FL);
  add(gen, tube(FH), mFrame,  x, FY0+FH/2, -FL);
  // top rails (long)
  add(gen, tube(FL*2), mFrame, x, FY0+FH, 0, Math.PI/2, 0, 0);
  // bottom rails
  add(gen, tube(FL*2), mFrame, x, FY0, 0, Math.PI/2, 0, 0);
  // corner knees
  for (const sz of [-1, 1]) {
    add(gen, knee(), mFrame, x, FY0+FH, sz*FL);
    add(gen, knee(), mFrame, x, FY0,   sz*FL);
  }
}
// top cross bars
for (const sz of [-1, 1]) add(gen, tube(FW*2), mFrame, 0, FY0+FH, sz*FL, 0, 0, Math.PI/2);
// bottom cross bars
for (const sz of [-1, 1]) add(gen, tube(FW*2), mFrame, 0, FY0, sz*FL, 0, 0, Math.PI/2);

// Base skid plate
add(gen, new THREE.BoxGeometry(FW*2-0.06, 0.06, FL*2-0.06), mDark, 0, FY0+0.02, 0);

// ---- Central engine block volume ----
const engine = add(gen, new THREE.BoxGeometry(0.95, 0.62, 1.05), mBody, 0, 0.55, -0.12);
// cooling fins on engine top
for (let i = 0; i < 5; i++)
  add(gen, new THREE.BoxGeometry(0.86, 0.03, 0.09), mDark, 0, 0.88, -0.5 + i*0.19);
// cylinder head hump
add(gen, new THREE.BoxGeometry(0.5, 0.2, 0.42), mDark, -0.1, 0.95, -0.12);
// alternator can (rear)
add(gen, new THREE.CylinderGeometry(0.26, 0.26, 0.45, 24), mSteel, 0, 0.55, -0.85, Math.PI/2, 0, 0);
add(gen, new THREE.CylinderGeometry(0.27, 0.27, 0.06, 24), mDark, 0, 0.55, -1.06, Math.PI/2, 0, 0);

// ---- Pull-start housing (right side) ----
const pull = new THREE.Group();
pull.position.set(0.5, 0.58, 0.18);
pull.rotation.z = -Math.PI/2;
gen.add(pull);
add(pull, new THREE.CylinderGeometry(0.28, 0.3, 0.1, 28), mDark, 0, 0.03, 0);
add(pull, new THREE.CylinderGeometry(0.09, 0.09, 0.05, 20), mBody, 0, 0.09, 0);
// vent slots
for (let i = 0; i < 8; i++) {
  const a = i/8*Math.PI*2;
  add(pull, new THREE.BoxGeometry(0.12, 0.02, 0.035), mSteel, Math.cos(a)*0.18, 0.085, Math.sin(a)*0.18, 0, -a, 0);
}
// pull handle (T-grip) with rope
add(pull, new THREE.BoxGeometry(0.14, 0.05, 0.05), mRubber, 0, 0.14, 0.24);
add(pull, new THREE.CylinderGeometry(0.008, 0.008, 0.1, 8), mDark, 0, 0.1, 0.2, Math.PI/4, 0, 0);

// ---- Fuel tank on top with cap ----
const tank = add(gen, new THREE.BoxGeometry(1.1, 0.3, 1.5), mBody, 0, FY0+FH-0.14, -0.05);
tank.geometry = new THREE.BoxGeometry(1.1, 0.3, 1.5, 1, 1, 1);
// tank edge chamfer illusion via top slab
add(gen, new THREE.BoxGeometry(1.0, 0.06, 1.4), mBody, 0, FY0+FH+0.03, -0.05);
// fuel cap
add(gen, new THREE.CylinderGeometry(0.11, 0.12, 0.07, 24), mDark, -0.3, FY0+FH+0.1, 0.45);
add(gen, new THREE.BoxGeometry(0.19, 0.03, 0.055), mDark, -0.3, FY0+FH+0.14, 0.45);
// fuel gauge
add(gen, new THREE.CylinderGeometry(0.07, 0.07, 0.03, 20), mSteel, 0.3, FY0+FH+0.09, 0.45);
add(gen, new THREE.CylinderGeometry(0.05, 0.05, 0.035, 20),
  new THREE.MeshStandardMaterial({ color: 0xf3efe4, roughness: 0.3 }), 0.3, FY0+FH+0.095, 0.45);
// yellow warning stripe on tank
add(gen, new THREE.BoxGeometry(1.11, 0.07, 1.51), mYellow, 0, FY0+FH-0.14, -0.05);

// ---- Control panel with outlets (front face) ----
const panel = new THREE.Group();
panel.position.set(0, 0.6, 0.99);
gen.add(panel);
add(panel, new THREE.BoxGeometry(0.92, 0.66, 0.07), mPanel, 0, 0, 0);
add(panel, new THREE.BoxGeometry(0.96, 0.7, 0.03), mDark, 0, 0, -0.03);
// outlets: two duplex sockets
for (const ox of [-0.22, 0.22]) {
  add(panel, new THREE.BoxGeometry(0.17, 0.26, 0.03), mYellow, ox, -0.08, 0.045);
  for (const oy of [-0.145, -0.015]) {
    add(panel, new THREE.CylinderGeometry(0.055, 0.055, 0.025, 20), mDark, ox, oy, 0.06, Math.PI/2, 0, 0);
    // slots
    add(panel, new THREE.BoxGeometry(0.01, 0.03, 0.01), mPanel, ox-0.022, oy+0.008, 0.072);
    add(panel, new THREE.BoxGeometry(0.01, 0.03, 0.01), mPanel, ox+0.022, oy+0.008, 0.072);
    add(panel, new THREE.CylinderGeometry(0.007, 0.007, 0.01, 8), mPanel, ox, oy-0.025, 0.072, Math.PI/2, 0, 0);
  }
}
// meter / dial
add(panel, new THREE.CylinderGeometry(0.09, 0.09, 0.04, 24), mSteel, -0.28, 0.2, 0.045, Math.PI/2, 0, 0);
add(panel, new THREE.CylinderGeometry(0.07, 0.07, 0.045, 24),
  new THREE.MeshStandardMaterial({ color: 0xd8e6da, roughness: 0.25, emissive: 0x1c2a1e, emissiveIntensity: 0.4 }),
  -0.28, 0.2, 0.047, Math.PI/2, 0, 0);
// main switch / key knob
add(panel, new THREE.CylinderGeometry(0.055, 0.06, 0.06, 20), mDark, 0.02, 0.2, 0.05, Math.PI/2, 0, 0);
add(panel, new THREE.BoxGeometry(0.02, 0.08, 0.03), mBody, 0.02, 0.2, 0.075);
// breaker buttons
for (let i = 0; i < 3; i++)
  add(panel, new THREE.CylinderGeometry(0.025, 0.025, 0.03, 14), i===1?mBody:mDark, 0.22+i*0.09, 0.22, 0.05, Math.PI/2, 0, 0);
// indicator LEDs
for (let i = 0; i < 3; i++)
  add(panel, new THREE.SphereGeometry(0.014, 10, 10),
    new THREE.MeshStandardMaterial({ color: [0x30d158, 0xffd60a, 0xff453a][i], emissive: [0x30d158, 0xffd60a, 0xff453a][i], emissiveIntensity: 0.9 }),
    0.24+i*0.08, 0.08, 0.055);

// ---- Muffler (left side, horizontal can) ----
const muff = new THREE.Group();
muff.position.set(-0.62, 0.86, -0.55);
gen.add(muff);
add(muff, new THREE.CylinderGeometry(0.14, 0.14, 0.72, 24), mMuff, 0, 0, 0, Math.PI/2, 0, 0);
add(muff, new THREE.CylinderGeometry(0.145, 0.145, 0.04, 24), mDark, 0, 0, 0.34, Math.PI/2, 0, 0);
add(muff, new THREE.CylinderGeometry(0.145, 0.145, 0.04, 24), mDark, 0, 0, -0.34, Math.PI/2, 0, 0);
// exhaust tip
add(muff, new THREE.CylinderGeometry(0.045, 0.05, 0.14, 16), mDark, 0, -0.03, -0.43, Math.PI/2+0.25, 0, 0);
// heat shield (perforated slat)
add(muff, new THREE.BoxGeometry(0.05, 0.2, 0.6), mSteel, 0.14, 0.05, 0);
// exhaust pipe from engine
add(gen, new THREE.CylinderGeometry(0.04, 0.04, 0.35, 12), mSteel, -0.45, 0.75, -0.35, 0, 0, Math.PI/3);

// ---- Wheels (rear axle) ----
const axleZ = -0.85, wheelR = 0.24;
add(gen, new THREE.CylinderGeometry(0.035, 0.035, FW*2+0.34, 12), mSteel, 0, wheelR, axleZ, 0, 0, Math.PI/2);
for (const sx of [-1, 1]) {
  const w = new THREE.Group();
  w.position.set(sx*(FW+0.14), wheelR, axleZ);
  w.rotation.z = Math.PI/2;
  gen.add(w);
  add(w, new THREE.TorusGeometry(wheelR-0.065, 0.065, 14, 28), mRubber, 0, 0, 0, Math.PI/2, 0, 0);
  add(w, new THREE.CylinderGeometry(wheelR-0.1, wheelR-0.1, 0.07, 20), mYellow, 0, 0, 0);
  add(w, new THREE.CylinderGeometry(0.05, 0.05, 0.1, 12), mDark, 0, 0, 0);
}
// front feet (rubber pads)
for (const sx of [-1, 1])
  add(gen, new THREE.BoxGeometry(0.16, 0.1, 0.2), mRubber, sx*FW, 0.05, FL-0.1);

// ---- Fold-down handles (front, angled down when stowed) ----
for (const sx of [-1, 1]) {
  const h = new THREE.Group();
  h.position.set(sx*FW, FY0+FH, FL);
  h.rotation.x = 0.85; // folded partway down
  gen.add(h);
  add(h, tube(0.85), mFrame, 0, 0, 0.425, Math.PI/2, 0, 0);
  add(h, knee(), mFrame, 0, 0, 0);
  // grip
  add(h, new THREE.CylinderGeometry(R*1.45, R*1.45, 0.28, 14), mRubber, 0, 0, 0.72, Math.PI/2, 0, 0);
  // pivot bolt
  add(h, new THREE.CylinderGeometry(0.055, 0.055, 0.13, 14), mSteel, 0, 0, 0, 0, 0, Math.PI/2);
}
// handle cross brace
add(gen, tube(FW*2), mFrame, 0, FY0+FH-Math.sin(0.85)*0.0, FL, 0, 0, Math.PI/2);

// lift gen so wheels rest on ground
gen.position.y = 0;

// Contact shadow darkener (subtle)
const blob = new THREE.Mesh(
  new THREE.CircleGeometry(1.9, 40),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.28 })
);
blob.rotation.x = -Math.PI/2;
blob.position.y = 0.002;
blob.scale.set(1, 1.25, 1);
scene.add(blob);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.65, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 2.5;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI/2 - 0.03;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
