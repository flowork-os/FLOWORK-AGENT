import * as THREE from "three";

let seed = 923815;
function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a,b){ return a + (b-a)*rand(); }
function pick(a){ return a[(rand()*a.length)|0]; }

const texCanvas = document.createElement("canvas");

  const a = range(.015,.11), v = (range(50,145)|0);
  tx.fillStyle = `rgba(${v},${Math.max(22,v-25)},${Math.max(10,v-60)},${a})`;

function mesh(g,m,x=0,y=0,z=0){
  const o = new THREE.Mesh(g,m);
  o.position.set(x,y,z);
  o.castShadow = true;
  o.receiveShadow = true;
  scene.add(o);
  return o;
}
function box(w,h,d,m,x,y,z){
  return mesh(new THREE.BoxGeometry(w,h,d),m,x,y,z);
}
function cyl(r,h,m,x,y,z,seg=16){
  return mesh(new THREE.CylinderGeometry(r,r,h,seg),m,x,y,z);
}
function sphere(r,m,x,y,z){
  return mesh(new THREE.SphereGeometry(r,24,16),m,x,y,z);
}
function group(){ const g=new THREE.Group(); scene.add(g); return g; }

function book(w,h,d,color){
  const m = new THREE.MeshStandardMaterial({color,roughness:.54});
  const b = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  body.castShadow=body.receiveShadow=true; b.add(body);
  const spine = new THREE.Mesh(new THREE.BoxGeometry(w+.025,h+.04,.06),new THREE.MeshStandardMaterial({color:new THREE.Color(color).multiplyScalar(.65),roughness:.48}));
  spine.position.z=d/2+.01; b.add(spine);
  return b;
}
const bookColors=[0x532018,0x1a3150,0x384222,0x4c3823,0x6a4b1d,0x371825,0x203637,0x6c2820];

function bookshelf(x,z,w=5.3,h=12.7,rot=0){
  const g=group(); g.position.set(x,0,z); g.rotation.y=rot;
  const postGeo=new THREE.BoxGeometry(.23,h,.3);
  for(const sx of [-w/2,w/2]) {
    const p=new THREE.Mesh(postGeo,trimWood); p.position.set(sx,h/2,0);p.castShadow=p.receiveShadow=true;g.add(p);
    for(let y=1.1;y<h;y+=2.25){
      const cap=new THREE.Mesh(new THREE.SphereGeometry(.16,10,8),darkBrass);cap.position.set(sx,y,0);g.add(cap);
    }
  }
  const top=new THREE.Mesh(new THREE.BoxGeometry(w+.45,.42,.52),trimWood);top.position.set(0,h-.1,0);g.add(top);
  const crown=new THREE.Mesh(new THREE.BoxGeometry(w+.8,.22,.72),darkBrass);crown.position.set(0,h+.2,0);g.add(crown);
  for(let y=.55;y<h-.3;y+=2.15){
    const sh=new THREE.Mesh(new THREE.BoxGeometry(w,.16,.55),shelfWood);sh.position.set(0,y,0);sh.castShadow=sh.receiveShadow=true;g.add(sh);
    let cx=-w/2+.18;
    while(cx<w/2-.13){
      const bw=range(.12,.27), bh=range(.62,1.44), bd=range(.22,.42);
      if(cx+bw>w/2-.1) break;
      const b=book(bw,bh,bd,pick(bookColors));
      b.position.set(cx+bw/2,y+.08+bh/2,.02); b.rotation.z=range(-.075,.075);g.add(b);
      cx+=bw+range(.025,.08);
    }
  }
  const foot=new THREE.Mesh(new THREE.BoxGeometry(w+.32,.35,.66),trimWood);foot.position.set(0,.18,0);g.add(foot);
  return g;
}

    const wheel=new THREE.Mesh(new THREE.TorusGeometry(.16,.045,8,16),brass);wheel.position.set(sx,.45,.08);wheel.rotation.x=Math.PI/2;g.add(wheel);

    const rung=new THREE.Mesh(new THREE.BoxGeometry(.93,.07,.12),brass);rung.position.set(0,y,0);g.add(rung);
  }
  const platform=new THREE.Mesh(new THREE.BoxGeometry(1.3,.12,.65),trimWood);platform.position.set(0,5.85,-.05);g.add(platform);
}

function desk(x,z,rot=0){
  const g=group();g.position.set(x,0,z);g.rotation.y=rot;
  const top=new THREE.Mesh(new THREE.BoxGeometry(5.4,.24,1.5),wood);top.position.y=2.42;top.castShadow=top.receiveShadow=true;g.add(top);
  for(const sx of [-2.35,2.35]) for(const sz of [-.55,.55]){
    const leg=new THREE.Mesh(new THREE.BoxGeometry(.24,2.35,.24),trimWood);leg.position.set(sx,1.2,sz);leg.castShadow=true;g.add(leg);
  }
  const shelf=new THREE.Mesh(new THREE.BoxGeometry(4.8,.12,.55),trimWood);shelf.position.set(0,1.2,.28);g.add(shelf);
  for(const sx of [-1.65,0,1.65]) bankerLamp(g,sx,2.57,0);
  for(let i=0;i<4;i++){
    const b=book(range(.22,.42),range(.16,.32),range(.6,.95),pick(bookColors));
    b.rotation.x=Math.PI/2;b.rotation.z=range(-.08,.08);b.position.set(range(-2,2),2.65,range(-.3,.3));g.add(b);
  }
  return g;
}
const lampLights=[];
function bankerLamp(parent,x,y,z){
  const base=new THREE.Mesh(new THREE.CylinderGeometry(.18,.24,.09,16),brass);base.position.set(x,y,z);parent.add(base);
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(.035,.045,.5,12),brass);stem.position.set(x,y+.28,z);parent.add(stem);
  const arm=new THREE.Mesh(new THREE.CylinderGeometry(.025,.035,.55,10),brass);arm.position.set(x,y+.58,z);arm.rotation.z=Math.PI/2;parent.add(arm);
  const shade=new THREE.Mesh(new THREE.CylinderGeometry(.24,.34,.25,20,1,true),greenGlass);shade.position.set(x+.45,y+.62,z);shade.rotation.z=-Math.PI/2;parent.add(shade);
  const glow=new THREE.PointLight(0xffc56b,.72,4.3,2);glow.position.set(x+.43,y+.48,z);parent.add(glow);lampLights.push(glow);
}

function archedWindow(x,y,z,rot=0){
  const g=group();g.position.set(x,y,z);g.rotation.y=rot;
  const w=2.55,h=5.2,r=w/2;
  const frameMat=trimWood;
  const side1=new THREE.Mesh(new THREE.BoxGeometry(.17,h,.18),frameMat);side1.position.x=-w/2;g.add(side1);
  const side2=side1.clone();side2.position.x=w/2;g.add(side2);
  const sill=new THREE.Mesh(new THREE.BoxGeometry(w+.25,.22,.28),frameMat);sill.position.y=-h/2;g.add(sill);
  const arch=new THREE.Mesh(new THREE.TorusGeometry(r,.1,10,24,Math.PI),frameMat);arch.position.y=h/2;arch.rotation.z=Math.PI;g.add(arch);
  const pane=new THREE.Mesh(new THREE.PlaneGeometry(w-.25,h),glass);pane.position.z=-.03;g.add(pane);
  const bar=new THREE.Mesh(new THREE.BoxGeometry(.1,h,.08),frameMat);g.add(bar);
  const cross=new THREE.Mesh(new THREE.BoxGeometry(w,.08,.08),frameMat);cross.position.y=.3;g.add(cross);
}

const sconces=[];
function sconce(x,y,z){
  const g=group();g.position.set(x,y,z);
  const plate=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.06,16),darkBrass);plate.rotation.x=Math.PI/2;g.add(plate);
  const arm=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.48,10),brass);arm.position.z=.24;arm.rotation.x=Math.PI/2;g.add(arm);
  const flame=new THREE.Mesh(new THREE.SphereGeometry(.11,12,8),new THREE.MeshBasicMaterial({color:0xffc568}));flame.position.z=.48;g.add(flame);
  const light=new THREE.PointLight(0xffa34d,1.2,6,2);light.position.z=.5;g.add(light);sconces.push({light,flame});
}

  const tick=new THREE.Mesh(new THREE.BoxGeometry(.04,.15,.03),black);
  tick.position.set(Math.sin(a)*.7,Math.cos(a)*.7,.02);tick.rotation.z=-a;clock.add(tick);
}
const minute=new THREE.Mesh(new THREE.BoxGeometry(.045,.58,.04),black);minute.position.y=.27;minute.position.z=.04;clock.add(minute);
const hour=new THREE.Mesh(new THREE.BoxGeometry(.06,.38,.04),black);hour.position.y=.17;hour.position.z=.05;clock.add(hour);

const clockwork = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clockwork.getElapsedTime();
  globeGroup.rotation.y=t*.105;
  minute.rotation.z=-t*.15;
  hour.rotation.z=-t*.0125;
  const p=dust.geometry.attributes.position;
  for(let i=0;i<dustCount;i++){
    const off=offsets[i];
    p.array[i*3]+=Math.sin(t*.55+off)*.0009;
    p.array[i*3+1]+=Math.cos(t*.31+off)*.00032;
    if(p.array[i*3+1]>14.5)p.array[i*3+1]=.4;
  }
  p.needsUpdate=true;
  sconces.forEach((s,i)=>{
    const flicker=.88+Math.sin(t*7+i*2.7)*.08+Math.sin(t*13+i)*.04;
    s.light.intensity=1.2*flicker;
    s.flame.scale.setScalar(flicker);
  });
  lampLights.forEach((l,i)=>l.intensity=.67+Math.sin(t*2.3+i)*.055);
  rail.rotation.y=Math.sin(t*.2)*.002;
  controls.update();
  renderer.render(scene,camera);
}
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
animate();
</script>
</body>
</html>
