<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1950s Retro Diner</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#120d16}
  canvas{display:block}
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================= CONFIG / PALETTE ================= */
const ROOM = { w: 26, d: 18, h: 4.6 };            // diner shell dimensions
const PAL = {
  night:      0x120d16,   // window night sky
  fog:        0x1c1420,   // interior haze tint
  cream:      0xf6e8cf,   // upper walls / ceiling
  wainscot:   0xc22b33,   // lower wall band red
  vinylRed:   0xd12030,   // booth + stool upholstery
  vinylSeam:  0x8e1420,
  formica:    0xf2f5ef,   // table / counter tops
  counterTeal:0x2fa39b,   // counter + door panels
  chrome:     0xf4f7fa,
  steel:      0x9aa3ab,
  floorLight: '#efe9da',
  floorDark:  '#20201f',
  neonPink:   0xff3fa4,
  neonCyan:   0x2ee6ff,
  burgerBun:  0xd98a3f,
  shakePink:  0xffc4d8,
  warmLamp:   0xffd9a0
};

/* ================= PRNG / HELPERS ================= */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(19551958);
const rand = (a, b) => a + (b - a) * rng();
const pick = arr => arr[Math.floor(rng() * arr.length)];

function makeCanvas(w, h, draw){
  const c = document.createElement('canvas');
  c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 8; tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function box(w, h, d, mat, x = 0, y = 0, z = 0, shadow = true){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true;
  return m;
}
function cyl(rt, rb, h, mat, x = 0, y = 0, z = 0, seg = 20){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  return m;
}

/* ================= PROCEDURAL TEXTURES ================= */
const checkerFloorTex = makeCanvas(512, 512, (g) => {
  const n = 8, s = 512 / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++){
    g.fillStyle = (i + j) % 2 ? PAL.floorDark : PAL.floorLight;
    g.fillRect(i * s, j * s, s, s);
    g.fillStyle = 'rgba(255,255,255,0.05)';
    g.fillRect(i * s, j * s, s, 4);                     // tile seam highlight
  }
});
checkerFloorTex.wrapS = checkerFloorTex.wrapT = THREE.RepeatWrapping;
checkerFloorTex.repeat.set(6.5, 4.5);

const checkerBandTex = makeCanvas(256, 32, (g) => {
  for (let i = 0; i < 16; i++) for (let j = 0; j < 2; j++){
    g.fillStyle = (i + j) % 2 ? '#111111' : '#f5efe2';
    g.fillRect(i * 16, j * 16, 16, 16);
  }
});
checkerBandTex.wrapS = THREE.RepeatWrapping;

const menuTex = makeCanvas(1024, 320, (g, w, h) => {
  g.fillStyle = '#23201d'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#d8b56a'; g.lineWidth = 10; g.strokeRect(14, 14, w - 28, h - 28);
  g.fillStyle = '#ffd9a0'; g.font = 'bold 64px Georgia'; g.textAlign = 'center';
  g.fillText("ROSIE'S DINER  •  MENU", w / 2, 92);
  g.font = '38px Georgia'; g.fillStyle = '#f3e6c8'; g.textAlign = 'left';
  const items = [['CHEESEBURGER', '25¢', 70, 170], ['MILKSHAKE', '15¢', 70, 240],
                 ['APPLE PIE', '10¢', 610, 170], ['COFFEE', '5¢', 610, 240]];
  for (const [n, p, x, y] of items){ g.fillText(n, x, y); g.fillText(p, x + 330, y); }
});

const posterTex = (title, sub, tint) => makeCanvas(256, 340, (g, w, h) => {
  g.fillStyle = '#f1e4c8'; g.fillRect(0, 0, w, h);
  g.fillStyle = tint; g.fillRect(0, 0, w, 120);
  g.beginPath(); g.arc(w / 2, 195, 58, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#26221e'; g.textAlign = 'center';
  g.font = 'bold 44px Georgia'; g.fillText(title, w / 2, 80);
  g.font = 'bold 26px Georgia'; g.fillText(sub, w / 2, 305);
});

const neonTex = (text, color) => makeCanvas(512, 192, (g, w) => {
  g.font = 'bold 118px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineJoin = 'round'; g.shadowColor = color; g.shadowBlur = 42;
  g.strokeStyle = color; g.lineWidth = 12;
  for (let i = 0; i < 3; i++) g.strokeText(text, w / 2, 100);
  g.shadowBlur = 0; g.strokeStyle = '#ffffff'; g.lineWidth = 4;
  g.strokeText(text, w / 2, 100);
});

const nightTex = makeCanvas(1024, 256, (g, w, h) => {
  const sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#0b0a1c'); sky.addColorStop(0.7, '#241536'); sky.addColorStop(1, '#3a1d3c');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  const r2 = mulberry32(77);
  for (let i = 0; i < 90; i++){ g.fillStyle = 'rgba(255,255,240,0.8)'; g.fillRect(r2() * w, r2() * h * 0.5, 2, 2); }
  for (let x = 0; x < w; ){
    const bw = 40 + r2() * 70, bh = 40 + r2() * 90;
    g.fillStyle = '#0a0812'; g.fillRect(x, h - bh, bw, bh);
    g.fillStyle = 'rgba(255,214,140,0.85)';
    for (let wx = x + 6; wx < x + bw - 8; wx += 14)
      for (let wy = h - bh + 8; wy < h - 10; wy += 16)
        if (r2() > 0.55) g.fillRect(wx, wy, 6, 8);
    x += bw + 14;
  }
});

const clockTex = makeCanvas(256, 256, (g) => {
  g.fillStyle = '#fdf7ea'; g.beginPath(); g.arc(128, 128, 124, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#222'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = 'bold 30px Georgia';
  for (let i = 1; i <= 12; i++){
    const a = i / 12 * Math.PI * 2;
    g.fillText(String(i), 128 + Math.sin(a) * 98, 128 - Math.cos(a) * 98);
  }
  g.font = '18px Georgia'; g.fillText('DINER TIME', 128, 66);
});

const grilleTex = makeCanvas(256, 256, (g, w, h) => {
  g.fillStyle = '#5a4632'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#2c2117';
  for (let y = 8; y < h; y += 18) g.fillRect(0, y, w, 8);
  g.fillStyle = '#caa24a'; g.fillRect(w / 2 - 8, 0, 16, h);
});

const steamTex = makeCanvas(64, 64, (g) => {
  const grad = g.createRadialGradient(32, 32, 4, 32, 32, 30);
  grad.addColorStop(0, 'rgba(255,255,255,0.55)'); grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
});

/* ================= MATERIALS ================= */
const MAT = {
  floor:    new THREE.MeshStandardMaterial({ map: checkerFloorTex, roughness: 0.32, metalness: 0.08 }),
  cream:    new THREE.MeshStandardMaterial({ color: PAL.cream, roughness: 0.9 }),
  wainscot: new THREE.MeshStandardMaterial({ color: PAL.wainscot, roughness: 0.55 }),
  ceiling:  new THREE.MeshStandardMaterial({ color: 0xf1e9dc, roughness: 0.95 }),
  chrome:   new THREE.MeshStandardMaterial({ color: PAL.chrome, metalness: 1.0, roughness: 0.12 }),
  steel:    new THREE.MeshStandardMaterial({ color: PAL.steel, metalness: 0.9, roughness: 0.35 }),
  vinyl:    new THREE.MeshStandardMaterial({ color: PAL.vinylRed, roughness: 0.42 }),
  vinylDark:new THREE.MeshStandardMaterial({ color: PAL.vinylSeam, roughness: 0.5 }),
  formica:  new THREE.MeshStandardMaterial({ color: PAL.formica, roughness: 0.25, metalness: 0.05 }),
  teal:     new THREE.MeshStandardMaterial({ color: PAL.counterTeal, roughness: 0.4 }),
  glass:    new THREE.MeshPhysicalMaterial({ color: 0xdff4ff, transparent: true, opacity: 0.16, roughness: 0.05, metalness: 0, side: THREE.DoubleSide, depthWrite: false }),
  mirror:   new THREE.MeshStandardMaterial({ color: 0xbcdce4, metalness: 0.55, roughness: 0.22 }),
  darkWood: new THREE.MeshStandardMaterial({ color: 0x4a3220, roughness: 0.7 }),
  black:    new THREE.MeshStandardMaterial({ color: 0x191919, roughness: 0.6 }),
  mustard:  new THREE.MeshStandardMaterial({ color: 0xf2c230, roughness: 0.5 }),
  bulb:     new THREE.MeshStandardMaterial({ color: 0xfff2d0, emissive: 0xffe0a6, emissiveIntensity: 2.2 })
};

/* ================= RENDERER / SCENE / CAMERA ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.06;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.night);
scene.fog = new THREE.Fog(PAL.fog, 16, 55);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 120);
camera.position.set(4.8, 2.75, 2.7);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.2, 1.55, -0.5);
controls.enableDamping = true;
controls.autoRotate = true; controls.autoRotateSpeed = 0.9;
controls.minDistance = 3.5; controls.maxDistance = 6.8;
controls.maxPolarAngle = 1.5; controls.minPolarAngle = 1.05;

/* ================= BUILDER: ROOM SHELL ================= */
function buildRoom(){
  const g = new THREE.Group();
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), MAT.floor);
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), MAT.ceiling);
  ceil.rotation.x = Math.PI / 2; ceil.position.y = ROOM.h;
  g.add(floor, ceil);
  // back + side walls: red wainscot below, cream above, chrome rail + checker band between
  const wallSet = (len, x, z, ry) => {
    const w = new THREE.Group();
    const band = new THREE.Mesh(new THREE.PlaneGeometry(len, 0.23),
      new THREE.MeshStandardMaterial({ map: checkerBandTex.clone(), roughness: 0.8 }));
    band.material.map.repeat.set(len, 1);
    band.position.set(0, 1.38, 0.13);
    w.add(box(len, 1.15, 0.25, MAT.wainscot, 0, 0.575, 0, false),
          box(len, ROOM.h - 1.45, 0.25, MAT.cream, 0, 1.45 + (ROOM.h - 1.45) / 2, 0, false),
          box(len, 0.07, 0.3, MAT.chrome, 0, 1.19, 0, false), band);
    w.position.set(x, 0, z); w.rotation.y = ry;
    return w;
  };
  g.add(wallSet(ROOM.w, 0, -ROOM.d / 2, 0),
        wallSet(ROOM.d, -ROOM.w / 2, 0, Math.PI / 2),
        wallSet(ROOM.d, ROOM.w / 2, 0, -Math.PI / 2));
  // front window wall: sill + header strips, mullions, glass, glazed double door
  const fz = ROOM.d / 2;
  g.add(box(ROOM.w, 1.0, 0.25, MAT.wainscot, 0, 0.5, fz, false),
        box(ROOM.w, ROOM.h - 3.5, 0.25, MAT.cream, 0, 3.5 + (ROOM.h - 3.5) / 2, fz, false),
        box(ROOM.w, 0.08, 0.3, MAT.chrome, 0, 1.02, fz, false));
  for (const mx of [-13, -9.4, -5.8, -2.2, 2.2, 5.8, 9.4, 13])
    g.add(box(0.22, 2.6, 0.28, MAT.steel, mx, 2.25, fz, false));
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, 2.5), MAT.glass);
  glass.position.set(0, 2.25, fz); glass.rotation.y = Math.PI;
  const door = new THREE.Group();
  for (const s of [-1, 1]){
    const dg = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 1.7), MAT.glass);
    dg.position.set(s * 0.55, 2.05, -0.06); dg.rotation.y = Math.PI;
    door.add(box(1.05, 3.2, 0.1, MAT.teal, s * 0.55, 1.6, 0), dg,
             box(0.5, 0.07, 0.12, MAT.chrome, s * 0.35, 1.35, -0.04));
  }
  // welcome mat + night-city backdrop seen through the glass
  door.position.set(0, 0, fz - 0.02);
  const mat = box(2.6, 0.03, 1.3, new THREE.MeshStandardMaterial({ color: 0x7a1f24, roughness: 1 }), 0, 0.02, fz - 1.1, false);
  const night = new THREE.Mesh(new THREE.PlaneGeometry(60, 15), new THREE.MeshBasicMaterial({ map: nightTex, fog: false }));
  night.position.set(0, 4.5, fz + 6); night.rotation.y = Math.PI;
  g.add(glass, door, mat, night);
  return g;
}

/* ================= BUILDER: LUNCH COUNTER + BACK BAR ================= */
function buildCounter(){
  const g = new THREE.Group();
  const L = 15, backZ = -2.4;
  g.add(box(L, 1.0, 1.3, MAT.teal, 0, 0.56, 0),                  // body
        box(L, 0.14, 0.06, MAT.chrome, 0, 0.62, 0.66),           // chrome belt
        box(L, 0.12, 1.2, MAT.black, 0, 0.06, 0),                // kick
        box(L + 0.5, 0.09, 1.6, MAT.formica, 0, 1.1, 0),         // formica top
        box(L + 0.5, 0.05, 0.05, MAT.chrome, 0, 1.1, 0.82),      // top edge trim
        box(L - 1, 1.05, 0.7, MAT.teal, 0, 0.525, backZ),        // back bar cabinet
        box(L - 1, 0.07, 0.8, MAT.formica, 0, 1.09, backZ));
  // mirror strip + shelves with glassware + menu board
  const mirror = new THREE.Mesh(new THREE.PlaneGeometry(L - 2, 1.4), MAT.mirror);
  mirror.position.set(0, 2.15, backZ - 0.34);
  for (const sy of [1.7, 2.3]) g.add(box(L - 2, 0.05, 0.35, MAT.chrome, 0, sy, backZ - 0.15, false));
  const glasses = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.055, 0.045, 0.16, 10), MAT.glass, 32);
  const dum = new THREE.Object3D();
  for (let i = 0; i < 32; i++){
    dum.position.set(-6 + (i % 16) * 0.8 + rand(-0.05, 0.05), (i < 16 ? 1.7 : 2.3) + 0.11, backZ - 0.15 + rand(-0.06, 0.06));
    dum.updateMatrix(); glasses.setMatrixAt(i, dum.matrix);
  }
  const menu = new THREE.Mesh(new THREE.PlaneGeometry(6.1, 1.9), new THREE.MeshBasicMaterial({ map: menuTex }));
  menu.position.set(0, 3.6, backZ - 0.33);
  g.add(mirror, glasses, menu);
  // coffee machine on the back bar
  const machine = new THREE.Group();
  machine.add(box(0.75, 0.62, 0.45, MAT.steel, 0, 1.44, 0),
              box(0.8, 0.06, 0.5, MAT.chrome, 0, 1.16, 0),
              cyl(0.13, 0.13, 0.3, MAT.chrome, -0.18, 1.32, 0.28),
              cyl(0.1, 0.12, 0.16, MAT.glass, 0.2, 1.24, 0.28, 14),
              box(0.3, 0.1, 0.02, MAT.black, 0, 1.6, 0.24, false));
  machine.position.set(4.6, 0, backZ + 0.05);
  // cash register at the end of the counter
  const register = new THREE.Group();
  register.add(box(0.55, 0.3, 0.45, MAT.steel, 0, 0.15, 0),
               box(0.5, 0.22, 0.3, MAT.chrome, 0, 0.38, -0.05),
               box(0.4, 0.16, 0.04, MAT.black, 0, 0.55, -0.08));
  register.position.set(7.1, 1.14, 0);
  g.add(machine, register);
  // ketchup + napkin sets spaced along the top
  for (let i = 0; i < 4; i++){
    const s = new THREE.Group();
    s.add(cyl(0.035, 0.035, 0.16, MAT.vinyl, 0, 0.08, 0, 10),
          cyl(0.012, 0.03, 0.05, MAT.vinyl, 0, 0.19, 0, 8),
          box(0.16, 0.12, 0.07, MAT.chrome, 0.18, 0.06, 0));
    s.position.set(-6.8 + i * 4.4, 1.145, 0.1); s.rotation.y = rand(0, 6.28);
    g.add(s);
  }
  return g;
}

/* ================= BUILDER: SWIVEL STOOL ================= */
function buildStool(){
  const g = new THREE.Group();
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.035, 10, 24), MAT.vinylDark);
  rim.rotation.x = Math.PI / 2; rim.position.y = 0.85; rim.castShadow = true;
  g.add(cyl(0.3, 0.36, 0.06, MAT.chrome, 0, 0.03, 0, 24),        // base
        cyl(0.055, 0.07, 0.62, MAT.chrome, 0, 0.37, 0, 14),      // column
        cyl(0.2, 0.2, 0.045, MAT.chrome, 0, 0.7, 0),             // seat plate
        cyl(0.26, 0.26, 0.12, MAT.vinyl, 0, 0.79, 0, 24), rim);  // cushion + welt
  return g;
}

/* ================= BUILDER: BOOTH (vinyl benches + chrome-edged table) ================= */
function buildBooth(){
  const g = new THREE.Group();
  const bench = (dir) => {
    const b = new THREE.Group();
    const back = box(0.22, 0.95, 1.9, MAT.vinyl, -0.38, 0.95, 0);
    back.rotation.z = -0.1;
    b.add(box(0.9, 0.42, 1.9, MAT.vinylDark, 0, 0.21, 0),             // base
          box(0.82, 0.16, 1.84, MAT.vinyl, 0, 0.5, 0),                // seat cushion
          back,
          box(0.26, 0.08, 1.92, MAT.chrome, -0.46, 1.42, 0, false));  // chrome cap
    b.position.x = dir * -1.45; b.rotation.y = dir < 0 ? Math.PI : 0;
    return b;
  };
  const edge = new THREE.Mesh(new THREE.BoxGeometry(1.56, 0.05, 1.11), MAT.chrome);
  edge.position.y = 0.79; edge.castShadow = true;
  g.add(bench(1), bench(-1), edge,                                // chrome edge banding
        cyl(0.3, 0.36, 0.05, MAT.chrome, 0, 0.03, 0),             // pedestal foot
        cyl(0.05, 0.05, 0.72, MAT.chrome, 0, 0.41, 0, 12),
        box(1.5, 0.07, 1.05, MAT.formica, 0, 0.8, 0));            // table top
  // table props: napkin dispenser, ketchup + mustard, menu card
  const props = new THREE.Group();
  const card = box(0.14, 0.18, 0.02, MAT.formica, -0.18, 0.09, 0.05, false);
  card.rotation.z = 0.25;
  props.add(box(0.16, 0.14, 0.1, MAT.chrome, 0, 0.07, 0),
            cyl(0.035, 0.035, 0.17, MAT.vinyl, 0.16, 0.085, 0.08, 10),
            cyl(0.035, 0.035, 0.17, MAT.mustard, 0.16, 0.085, -0.08, 10), card);
  props.position.set(rand(-0.1, 0.1), 0.835, rand(-0.25, 0.25)); props.rotation.y = rand(-0.4, 0.4);
  g.add(props);
  return g;
}

/* ================= BUILDER: DINETTE SET / GUMBALL MACHINE ================= */
function buildDinette(){
  const g = new THREE.Group();
  const band = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.028, 8, 36), MAT.chrome);
  band.rotation.x = Math.PI / 2; band.position.y = 0.76;
  g.add(cyl(0.34, 0.4, 0.05, MAT.chrome, 0, 0.03, 0),
        cyl(0.05, 0.05, 0.7, MAT.chrome, 0, 0.4, 0, 12),
        cyl(0.62, 0.62, 0.06, MAT.formica, 0, 0.76, 0, 28), band);
  for (const a of [rand(0, 6.28), rand(0, 6.28) + Math.PI]){
    const ch = new THREE.Group();
    ch.add(box(0.42, 0.05, 0.42, MAT.vinyl, 0, 0.47, 0),
           box(0.42, 0.5, 0.06, MAT.vinyl, 0, 0.76, -0.2));       // backrest away from table
    for (const [lx, lz] of [[-0.17, -0.17], [0.17, -0.17], [-0.17, 0.17], [0.17, 0.17]])
      ch.add(cyl(0.02, 0.02, 0.45, MAT.chrome, lx, 0.22, lz, 8));
    ch.position.set(Math.sin(a), 0, Math.cos(a));
    ch.lookAt(0, 0, 0);                                           // face the table
    g.add(ch);
  }
  return g;
}
function buildGumball(){
  const g = new THREE.Group();
  const globe = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 12), MAT.glass);
  globe.position.y = 0.72;
  g.add(cyl(0.15, 0.2, 0.52, MAT.vinyl, 0, 0.26, 0, 14),
        cyl(0.19, 0.19, 0.06, MAT.chrome, 0, 0.55, 0, 14),
        globe, cyl(0.03, 0.06, 0.09, MAT.vinyl, 0, 0.92, 0, 10));
  const gums = new THREE.InstancedMesh(new THREE.SphereGeometry(0.032, 8, 6),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35 }), 24);
  const d = new THREE.Object3D(), col = new THREE.Color();
  for (let i = 0; i < 24; i++){
    const a = rand(0, 6.28), r = rand(0, 0.12);
    d.position.set(Math.cos(a) * r, 0.62 + rand(0, 0.09), Math.sin(a) * r);
    d.updateMatrix(); gums.setMatrixAt(i, d.matrix);
    gums.setColorAt(i, col.setHSL(rng(), 0.85, 0.55));
  }
  g.add(gums);
  return g;
}

/* ================= BUILDER: GLOWING JUKEBOX ================= */
const jukeGlowMats = [];
function buildJukebox(){
  const g = new THREE.Group();
  const shape = new THREE.Shape();
  shape.moveTo(-0.75, 0); shape.lineTo(-0.75, 1.32);
  shape.absarc(0, 1.32, 0.75, Math.PI, 0, true);
  shape.lineTo(0.75, 0); shape.lineTo(-0.75, 0);
  const body = new THREE.Mesh(
    new THREE.ExtrudeGeometry(shape, { depth: 0.7, bevelEnabled: true, bevelSize: 0.03, bevelThickness: 0.03 }),
    MAT.darkWood);
  body.castShadow = true; body.receiveShadow = true;
  // glowing arch tubes (pink outer, cyan inner) + side columns
  const mkGlow = (color) => {
    const m = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 2.6, roughness: 0.4 });
    jukeGlowMats.push(m); return m;
  };
  const outer = new THREE.Mesh(new THREE.TorusGeometry(0.66, 0.035, 10, 40, Math.PI), mkGlow(PAL.neonPink));
  const inner = new THREE.Mesh(new THREE.TorusGeometry(0.53, 0.028, 10, 40, Math.PI), mkGlow(PAL.neonCyan));
  outer.position.set(0, 1.32, 0.74); inner.position.set(0, 1.3, 0.75);
  g.add(body, outer, inner);
  for (const s of [-1, 1])
    g.add(cyl(0.035, 0.035, 1.3, mkGlow(s < 0 ? PAL.neonPink : PAL.neonCyan), s * 0.66, 0.66, 0.74, 10),
          cyl(0.028, 0.028, 1.28, mkGlow(s < 0 ? PAL.neonCyan : PAL.neonPink), s * 0.53, 0.64, 0.75, 10));
  // record window, spinning record, speaker grille, chrome details, button row
  const windowPane = new THREE.Mesh(new THREE.CircleGeometry(0.42, 24, 0, Math.PI),
    new THREE.MeshStandardMaterial({ color: 0x120b18, emissive: 0x2a1030, emissiveIntensity: 0.8 }));
  windowPane.position.set(0, 1.32, 0.745);
  const record = cyl(0.19, 0.19, 0.015, MAT.black, 0, 1.44, 0.765, 24);
  const label = cyl(0.06, 0.06, 0.017, MAT.vinyl, 0, 1.44, 0.766, 14);
  record.rotation.x = label.rotation.x = Math.PI / 2; record.name = 'record';
  const grille = new THREE.Mesh(new THREE.PlaneGeometry(1.05, 0.75),
    new THREE.MeshStandardMaterial({ map: grilleTex, roughness: 0.8 }));
  grille.position.set(0, 0.5, 0.755);
  g.add(windowPane, record, label, grille,
        box(1.2, 0.07, 0.05, MAT.chrome, 0, 0.95, 0.74, false),
        box(1.4, 0.1, 0.75, MAT.chrome, 0, 0.05, 0.35, false));
  const btn = new THREE.InstancedMesh(new THREE.BoxGeometry(0.07, 0.05, 0.03), MAT.chrome, 8);
  const d = new THREE.Object3D();
  for (let i = 0; i < 8; i++){ d.position.set(-0.42 + i * 0.12, 1.04, 0.76); d.updateMatrix(); btn.setMatrixAt(i, d.matrix); }
  g.add(btn);
  return g;
}

/* ================= BUILDER: PIE DISPLAY CASE ================= */
function buildPieCase(){
  const g = new THREE.Group();
  g.add(box(1.5, 0.08, 0.85, MAT.chrome, 0, 0.04, 0),
        box(1.4, 0.03, 0.75, MAT.glass, 0, 0.42, 0, false),
        box(1.5, 0.05, 0.85, MAT.chrome, 0, 0.82, 0, false));
  for (const [px, pz] of [[-0.72, -0.4], [0.72, -0.4], [-0.72, 0.4], [0.72, 0.4]])
    g.add(box(0.06, 0.8, 0.06, MAT.chrome, px, 0.42, pz, false)); // corner posts
  for (const [pw, ry, px, pz] of [[1.38, 0, 0, 0.41], [1.38, Math.PI, 0, -0.41], [0.78, Math.PI / 2, -0.7, 0], [0.78, -Math.PI / 2, 0.7, 0]]){
    const pane = new THREE.Mesh(new THREE.PlaneGeometry(pw, 0.72), MAT.glass);
    pane.rotation.y = ry; pane.position.set(px, 0.44, pz);
    g.add(pane);
  }
  // pies: crimped crust + domed filling, two per shelf level
  const crust = new THREE.MeshStandardMaterial({ color: 0xc98d4b, roughness: 0.8 });
  const fillColors = [0xa33b1e, 0x7a2d3a, 0xd7a13c, 0x5c3a22];
  for (const sy of [0.1, 0.46]) for (const sx of [-0.36, 0.36]){
    const pie = new THREE.Group();
    const filling = new THREE.Mesh(new THREE.SphereGeometry(0.2, 18, 10, 0, Math.PI * 2, 0, Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: pick(fillColors), roughness: 0.6 }));
    filling.scale.set(1, 0.42, 1); filling.position.y = 0.08; filling.castShadow = true;
    pie.add(cyl(0.24, 0.2, 0.09, crust, 0, 0.045, 0, 18), filling);
    pie.position.set(sx, sy, rand(-0.12, 0.12)); pie.rotation.y = rand(0, 6.28);
    g.add(pie);
  }
  return g;
}

/* ================= BUILDER: COUNTER FOOD (milkshake + burger plate) ================= */
function buildMilkshake(){
  const g = new THREE.Group();
  const cream = new THREE.Mesh(new THREE.SphereGeometry(0.085, 14, 10),
    new THREE.MeshStandardMaterial({ color: 0xfff6ea, roughness: 0.7 }));
  cream.scale.y = 0.75; cream.position.y = 0.33; cream.castShadow = true;
  const cherry = new THREE.Mesh(new THREE.SphereGeometry(0.028, 10, 8),
    new THREE.MeshStandardMaterial({ color: 0xb3132a, roughness: 0.3 }));
  const straw = cyl(0.012, 0.012, 0.3, new THREE.MeshStandardMaterial({ color: 0xff6f8e, roughness: 0.6 }), 0.05, 0.42, 0, 8);
  cherry.position.y = 0.41; straw.rotation.z = -0.3;
  g.add(cyl(0.09, 0.05, 0.3, MAT.glass, 0, 0.16, 0, 14),
        cyl(0.075, 0.05, 0.24, new THREE.MeshStandardMaterial({ color: PAL.shakePink, roughness: 0.5 }), 0, 0.16, 0, 14),
        cream, cherry, straw);
  return g;
}
function buildBurgerPlate(){
  const g = new THREE.Group();
  const bunMat = new THREE.MeshStandardMaterial({ color: PAL.burgerBun, roughness: 0.75 });
  const cheese = box(0.21, 0.012, 0.21, new THREE.MeshStandardMaterial({ color: 0xf5b52c, roughness: 0.5 }), 0, 0.107, 0, false);
  const top = new THREE.Mesh(new THREE.SphereGeometry(0.12, 18, 10, 0, Math.PI * 2, 0, Math.PI / 2), bunMat);
  cheese.rotation.y = 0.4; top.position.y = 0.13; top.scale.y = 0.62; top.castShadow = true;
  g.add(cyl(0.26, 0.2, 0.03, new THREE.MeshStandardMaterial({ color: 0xfdfdf6, roughness: 0.3 }), 0, 0.015, 0, 22),
        cyl(0.11, 0.12, 0.04, bunMat, 0, 0.05, 0, 18),            // bottom bun
        cyl(0.125, 0.125, 0.035, new THREE.MeshStandardMaterial({ color: 0x5b3420, roughness: 0.9 }), 0, 0.085, 0, 18),
        cheese,
        cyl(0.13, 0.13, 0.015, new THREE.MeshStandardMaterial({ color: 0x6fae3d, roughness: 0.8 }), 0, 0.122, 0, 18),
        top);
  const fries = new THREE.InstancedMesh(new THREE.BoxGeometry(0.02, 0.11, 0.02),
    new THREE.MeshStandardMaterial({ color: 0xf0c05a, roughness: 0.7 }), 9);
  const d = new THREE.Object3D();
  for (let i = 0; i < 9; i++){
    d.position.set(0.18 + rand(-0.03, 0.03), 0.07, rand(-0.05, 0.05));
    d.rotation.set(rand(-0.25, 0.25), rand(0, 3), rand(-0.25, 0.25));
    d.updateMatrix(); fries.setMatrixAt(i, d.matrix);
  }
  g.add(fries);
  return g;
}

/* ================= BUILDER: CEILING FAN / PENDANT / NEON / CLOCK ================= */
function buildCeilingFan(){
  const g = new THREE.Group();
  const blades = new THREE.Group(); blades.name = 'blades';
  for (let i = 0; i < 4; i++){
    const b = box(1.1, 0.02, 0.22, MAT.darkWood, 0.62, 0, 0);
    b.rotation.z = 0.06;
    const holder = new THREE.Group();
    holder.rotation.y = i * Math.PI / 2;
    holder.add(b); blades.add(holder);
  }
  const globe = new THREE.Mesh(new THREE.SphereGeometry(0.11, 14, 10), MAT.bulb);
  blades.position.y = -0.62; globe.position.y = -0.72;
  g.add(cyl(0.04, 0.04, 0.5, MAT.steel, 0, -0.25, 0, 10),
        cyl(0.16, 0.2, 0.16, MAT.steel, 0, -0.55, 0, 16), blades, globe);
  return g;
}
function buildPendant(){
  const g = new THREE.Group();
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 8), MAT.bulb);
  bulb.position.y = -0.97;
  g.add(cyl(0.015, 0.015, 0.85, MAT.black, 0, -0.42, 0, 8),
        cyl(0.24, 0.08, 0.2, MAT.chrome, 0, -0.9, 0), bulb);
  return g;
}
const neonMats = [];
function buildNeonSign(text, colorHex, width){
  const g = new THREE.Group();
  const cssColor = '#' + colorHex.toString(16).padStart(6, '0');
  const m = new THREE.MeshBasicMaterial({ map: neonTex(text, cssColor), transparent: true, side: THREE.DoubleSide, depthWrite: false });
  neonMats.push(m);
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(width, width * 0.375), m);
  const frame = new THREE.Mesh(new THREE.TorusGeometry(width * 0.52, 0.02, 8, 40),
    new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 2.4 }));
  plane.rotation.y = Math.PI; frame.scale.y = 0.45;
  g.add(plane, frame);
  return g;
}
function buildClock(){
  const g = new THREE.Group();
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.06, 12, 32), MAT.chrome);
  const face = new THREE.Mesh(new THREE.CircleGeometry(0.42, 32), new THREE.MeshBasicMaterial({ map: clockTex }));
  face.position.z = 0.02;
  const hp = new THREE.Group(); hp.add(box(0.05, 0.2, 0.015, MAT.black, 0, 0.09, 0.045, false)); hp.name = 'hourPivot';
  const mp = new THREE.Group(); mp.add(box(0.035, 0.32, 0.015, MAT.black, 0, 0.14, 0.05, false)); mp.name = 'minutePivot';
  g.add(rim, face, hp, mp);
  return g;
}

/* ================= ASSEMBLY / LAYOUT ================= */
scene.add(buildRoom());
const counter = buildCounter();
counter.position.set(0.5, 0, -6.1);
scene.add(counter);

for (let i = 0; i < 7; i++){
  const stool = buildStool();
  stool.position.set(-6.1 + i * 2.15, 0, -4.55); stool.rotation.y = rand(0, Math.PI * 2);
  scene.add(stool);
}
// booths along the front windows and the left wall
for (const [bx, bz, ry] of [[-9.9, 7.3, 0], [-4.9, 7.3, 0], [4.9, 7.3, 0], [9.9, 7.3, 0],
                            [-11.75, -0.6, Math.PI / 2], [-11.75, 3.6, Math.PI / 2]]){
  const booth = buildBooth();
  booth.position.set(bx, 0, bz); booth.rotation.y = ry;
  scene.add(booth);
}
for (const [dx, dz] of [[-5.6, 0.6], [5.9, 1.4]]){
  const dinette = buildDinette();
  dinette.position.set(dx, 0, dz); scene.add(dinette);
}

const jukebox = buildJukebox();
jukebox.position.set(-10.7, 0, -6.7); jukebox.rotation.y = Math.PI / 4;
const pieCase = buildPieCase();
pieCase.position.set(-5.2, 1.145, -6.2);
const shake = buildMilkshake();
shake.position.set(0.6, 1.145, -5.95);
const burger = buildBurgerPlate();
burger.position.set(1.5, 1.145, -5.85);
const gumball = buildGumball();
gumball.position.set(2.1, 0, 8.0);
scene.add(jukebox, pieCase, shake, burger, gumball);

const fans = [];
for (const fx of [-4.5, 4.5]){
  const fan = buildCeilingFan();
  fan.position.set(fx, ROOM.h, 0.4); fans.push(fan.getObjectByName('blades'));
  scene.add(fan);
}
const pendantLights = [];
for (const px of [-5.5, -0.5, 4.5]){
  const p = buildPendant();
  p.position.set(px, ROOM.h, -5.6);
  const pl = new THREE.PointLight(PAL.warmLamp, 10, 7, 2);
  pl.position.set(px, ROOM.h - 1.05, -5.6);
  scene.add(p, pl); pendantLights.push(pl);
}
// neon: DINER + OPEN hang in the front windows, EAT glows over the back bar
for (const [txt, col, wdt, nx, ny, nz, ry] of [['DINER', PAL.neonPink, 3.2, 4.2, 2.6, 8.68, 0],
    ['OPEN', PAL.neonCyan, 2.3, -4.6, 2.5, 8.68, 0], ['EAT', PAL.neonPink, 2.2, -5.3, 3.6, -8.8, Math.PI]]){
  const sign = buildNeonSign(txt, col, wdt);
  sign.position.set(nx, ny, nz); sign.rotation.y = ry;
  scene.add(sign);
}
const clock = buildClock();
clock.position.set(5.8, 3.55, -8.83); scene.add(clock);

for (const [t, s, c, wz] of [['EAT', 'ROUTE 66', '#c22b33', -3.5], ['SODA', 'FLOATS 10¢', '#2fa39b', 4.5]]){
  const poster = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 2.0),
    new THREE.MeshStandardMaterial({ map: posterTex(t, s, c), roughness: 0.9 }));
  poster.position.set(12.86, 2.8, wz); poster.rotation.y = -Math.PI / 2;
  scene.add(poster);
}
// coffee steam: small fading sprites rising from the machine
const steamPuffs = [];
for (let i = 0; i < 7; i++){
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: steamTex, transparent: true, opacity: 0.35, depthWrite: false }));
  sp.scale.setScalar(0.22); sp.userData.phase = rand(0, 1); sp.position.set(4.9, 2.0, -8.4);
  scene.add(sp); steamPuffs.push(sp);
}

/* ================= LIGHTING RIG ================= */
scene.add(new THREE.AmbientLight(0xfff1e0, 0.34), new THREE.HemisphereLight(0xffe7c9, 0x3a2a26, 0.42));

const key = new THREE.DirectionalLight(0xfff0dc, 2.1);           // warm key through the front glass
key.position.set(6, 8, 12); key.target.position.set(0, 0, -2);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -15; key.shadow.camera.right = 15;
key.shadow.camera.top = 12; key.shadow.camera.bottom = -12;
key.shadow.camera.near = 1; key.shadow.camera.far = 40; key.shadow.bias = -0.0004;
scene.add(key, key.target);

const neonPinkLight = new THREE.PointLight(PAL.neonPink, 9, 30, 1);   // washes the chrome in pink
neonPinkLight.position.set(4.2, 2.6, 7.9);
const neonCyanLight = new THREE.PointLight(PAL.neonCyan, 7, 28, 1);   // and cyan from the window
neonCyanLight.position.set(-4.6, 2.5, 7.9);
const jukeLight = new THREE.PointLight(PAL.neonPink, 12, 9, 2);       // corner glow by the jukebox
jukeLight.position.set(-9.9, 1.6, -5.9);
const eatLight = new THREE.PointLight(PAL.neonPink, 10, 8, 2);        // EAT sign spill on the back bar
eatLight.position.set(-5.3, 3.4, -8.0);
scene.add(neonPinkLight, neonCyanLight, jukeLight, eatLight);

/* ================= ANIMATION LOOP ================= */
const clockTimer = new THREE.Clock();
const record = jukebox.getObjectByName('record');
const hourPivot = clock.getObjectByName('hourPivot'), minutePivot = clock.getObjectByName('minutePivot');

function animate(){
  requestAnimationFrame(animate);
  const t = clockTimer.getElapsedTime();

  // 1) ceiling fans spin slowly
  for (const b of fans) b.rotation.y = t * 1.5;

  // 2) neon flicker: pink DINER buzzes, cyan OPEN and pink EAT breathe
  const flick = 0.82 + 0.18 * Math.sin(t * 21.0) * Math.sin(t * 3.7) * Math.sin(t * 0.9);
  neonMats[0].opacity = flick; neonPinkLight.intensity = 9 * flick;
  const flick2 = 0.9 + 0.1 * Math.sin(t * 13.0 + 2.0);
  neonMats[1].opacity = flick2; neonCyanLight.intensity = 7 * flick2;
  neonMats[2].opacity = 0.85 + 0.15 * Math.sin(t * 2.2);

  // 3) jukebox bubbler tubes cycle hue, record spins (spill light stays pink)
  for (let i = 0; i < jukeGlowMats.length; i++){
    const hue = (t * 0.08 + i * 0.16) % 1;
    jukeGlowMats[i].emissive.setHSL(hue, 0.95, 0.55);
    jukeGlowMats[i].color.setHSL(hue, 0.95, 0.55);
  }
  record.rotation.y = t * 2.4;

  // 4) coffee steam drifts upward and fades
  for (const sp of steamPuffs){
    const p = (t * 0.14 + sp.userData.phase) % 1;
    sp.position.set(4.9 + Math.sin((p + sp.userData.phase) * 9) * 0.08, 1.78 + p * 0.9, -8.4);
    sp.material.opacity = 0.35 * Math.sin(p * Math.PI);
    sp.scale.setScalar(0.14 + p * 0.3);
  }

  // 5) wall clock keeps diner time; pendants breathe faintly
  minutePivot.rotation.z = -t * 0.15; hourPivot.rotation.z = -t * 0.0125 - 2.1;
  for (let i = 0; i < pendantLights.length; i++)
    pendantLights[i].intensity = 10 + Math.sin(t * 2 + i * 2.1) * 0.7;

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ================= RESIZE ================= */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
