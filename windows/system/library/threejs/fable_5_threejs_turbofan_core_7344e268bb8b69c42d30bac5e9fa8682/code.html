<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turbofan Core — Cutaway</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14171c; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14171c);
scene.fog = new THREE.Fog(0x14171c, 22, 45);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.2, 3.4, 8.4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xe8f0ff, 0x22201a, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(6, 10, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -8;
key.shadow.camera.right = key.shadow.camera.top = 8;
key.shadow.camera.near = 1; key.shadow.camera.far = 30;
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight(0x9ecbff, 0.9);
rim.position.set(-7, 4, -6);
scene.add(rim);

// ---------- materials ----------
const M = {
  casing:  new THREE.MeshStandardMaterial({ color: 0x9aa3b0, metalness: .9,  roughness: .3, side: THREE.DoubleSide }),
  dark:    new THREE.MeshStandardMaterial({ color: 0x2e3540, metalness: .85, roughness: .45 }),
  blade:   new THREE.MeshStandardMaterial({ color: 0xc9ced8, metalness: .95, roughness: .25 }),
  stator:  new THREE.MeshStandardMaterial({ color: 0x6f7a88, metalness: .9,  roughness: .4 }),
  hub:     new THREE.MeshStandardMaterial({ color: 0x525c68, metalness: .9,  roughness: .4 }),
  spinner: new THREE.MeshStandardMaterial({ color: 0xe6e9ee, metalness: .6,  roughness: .3 }),
  comb:    new THREE.MeshStandardMaterial({ color: 0x5a2a12, emissive: 0xff5200, emissiveIntensity: 1.6, roughness: .6, metalness: .3 }),
  turbine: new THREE.MeshStandardMaterial({ color: 0x8a6b52, emissive: 0x661a00, emissiveIntensity: .35, metalness: .95, roughness: .38 }),
  shaft:   new THREE.MeshStandardMaterial({ color: 0x3a4048, metalness: .95, roughness: .3 })
};

// ---------- engine (built along +Y = front, rotated to lie along X) ----------
const engine = new THREE.Group();
const spool = new THREE.Group();          // rotating parts
engine.add(spool);
const GAP = 1.6;                          // cutaway wedge (radians), faces camera

function shell(rt, rb, h, y, mat = M.casing) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 64, 1, true, GAP / 2, Math.PI * 2 - GAP), mat);
  m.position.y = y; return m;
}
function ring(r, tube, y, mat = M.dark) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 16, 72), mat);
  m.rotation.x = Math.PI / 2; m.position.y = y; return m;
}
function blisk(hub, tip, chord, n, mat, pitch) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(hub, hub, chord, 32), M.hub));
  const len = tip - hub, r = hub + len / 2;
  const im = new THREE.InstancedMesh(new THREE.BoxGeometry(len, chord * 0.92, Math.min(0.05, chord * 0.3)), mat, n);
  const o = new THREE.Object3D(); o.rotation.order = 'YXZ';
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    o.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
    o.rotation.set(pitch, -a, 0);
    o.updateMatrix(); im.setMatrixAt(i, o.matrix);
  }
  g.add(im); return g;
}

// shaft
const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 7.4, 24), M.shaft);
shaft.position.y = 0.1; spool.add(shaft);

// intake lip + fan + spinner
engine.add(ring(1.85, 0.24, 3.8, M.casing));
engine.add(shell(2.05, 2.05, 1.1, 3.2));
const fan = blisk(0.42, 1.85, 0.5, 22, M.blade, 0.9);
fan.position.y = 3.2; spool.add(fan);
const spinner = new THREE.Mesh(new THREE.ConeGeometry(0.44, 1.0, 32), M.spinner);
spinner.position.y = 3.9; spool.add(spinner);

// compressor: stages of increasing then decreasing radius
const coreHub = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.62, 2.3, 32), M.hub);
coreHub.position.y = 1.3; spool.add(coreHub);
engine.add(shell(1.45, 1.05, 2.2, 1.4));
[1.02, 1.12, 1.2, 1.16, 1.06, 0.94, 0.82].forEach((tip, i) => {
  const rotor = i % 2 === 0;
  const b = blisk(0.42 + i * 0.03, tip, 0.16, 26 + i * 2, rotor ? M.blade : M.stator, rotor ? 0.7 : -0.7);
  b.position.y = 2.25 - i * 0.32;
  (rotor ? spool : engine).add(b);
});

// annular combustor
engine.add(shell(1.28, 1.28, 1.05, -0.35));
engine.add(ring(0.8, 0.3, -0.35, M.comb));
engine.add(ring(0.8, 0.34, -0.35, M.dark).translateY ? ring(0.8, 0.05, 0.05, M.dark) : null);
const glow = new THREE.PointLight(0xff6a22, 30, 6, 2);
glow.position.y = -0.35; engine.add(glow);

// turbine
engine.add(shell(1.18, 1.42, 1.15, -1.6));
[[0.95, -1.2], [1.1, -1.6], [1.22, -2.0]].forEach(([tip, y], i) => {
  const b = blisk(0.5 + i * 0.05, tip, 0.22, 30, M.turbine, -0.8);
  b.position.y = y; spool.add(b);
});

// exhaust nozzle + cone
engine.add(shell(1.38, 0.9, 1.0, -2.7));
const cone = new THREE.Mesh(new THREE.ConeGeometry(0.55, 1.3, 32), M.dark);
cone.rotation.x = Math.PI; cone.position.y = -2.9; engine.add(cone);

// section divider rings so stages read distinctly
[[2.06, 2.68], [1.47, 2.52], [1.07, 0.32], [1.29, 0.2], [1.29, -0.9],
 [1.19, -1.03], [1.43, -2.17], [1.4, -2.22], [0.92, -3.18]].forEach(([r, y]) => engine.add(ring(r, 0.05, y)));

engine.traverse(o => { if (o && o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
engine.rotation.z = -Math.PI / 2;         // axis horizontal, intake toward +X
scene.add(engine);

// ---------- ground shadow ----------
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity: 0.3 }));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -2.6;
ground.receiveShadow = true;
scene.add(ground);

// ---------- controls / loop ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.minDistance = 4;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.52;

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  spool.rotation.y -= clock.getDelta() * 1.4;
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
