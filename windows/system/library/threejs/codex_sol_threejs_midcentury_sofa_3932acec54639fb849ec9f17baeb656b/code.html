<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mid-Century Sofa</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #e8e3da;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe8e3da);
  scene.fog = new THREE.Fog(0xe8e3da, 11, 22);

  const camera = new THREE.PerspectiveCamera(
    36,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );
  camera.position.set(5.4, 3.2, 6.8);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.25, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.55;
  controls.minDistance = 4.5;
  controls.maxDistance = 12;
  controls.minPolarAngle = Math.PI * 0.22;
  controls.maxPolarAngle = Math.PI * 0.48;

  const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

  function createFabricTexture(baseColor) {
    const size = 256;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const context = canvas.getContext('2d');

    context.fillStyle = baseColor;
    context.fillRect(0, 0, size, size);

    for (let y = 0; y < size; y += 3) {
      context.fillStyle = y % 6 === 0
        ? 'rgba(255,255,255,0.045)'
        : 'rgba(25,25,20,0.035)';
      context.fillRect(0, y, size, 1);
    }

    for (let x = 0; x < size; x += 4) {
      context.fillStyle = x % 8 === 0
        ? 'rgba(255,255,255,0.028)'
        : 'rgba(20,20,15,0.025)';
      context.fillRect(x, 0, 1, size);
    }

    for (let i = 0; i < 2800; i++) {
      const shade = Math.random() > 0.5 ? 255 : 20;
      const alpha = 0.015 + Math.random() * 0.025;
      context.fillStyle = `rgba(${shade},${shade},${shade},${alpha})`;
      context.fillRect(
        Math.random() * size,
        Math.random() * size,
        1 + Math.random(),
        1 + Math.random()
      );
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(4, 4);
    texture.anisotropy = maxAnisotropy;
    return texture;
  }

  function createWeaveBumpTexture() {
    const size = 128;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const context = canvas.getContext('2d');
    context.fillStyle = '#808080';
    context.fillRect(0, 0, size, size);

    for (let y = 0; y < size; y += 3) {
      context.fillStyle = y % 6 === 0 ? '#999999' : '#707070';
      context.fillRect(0, y, size, 1);
    }
    for (let x = 0; x < size; x += 3) {
      context.fillStyle = x % 6 === 0
        ? 'rgba(180,180,180,0.45)'
        : 'rgba(75,75,75,0.35)';
      context.fillRect(x, 0, 1, size);
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(7, 7);
    texture.anisotropy = maxAnisotropy;
    return texture;
  }

  const fabricMap = createFabricTexture('#6f8078');
  const fabricBump = createWeaveBumpTexture();

  const upholstery = new THREE.MeshStandardMaterial({
    color: 0x778980,
    map: fabricMap,
    bumpMap: fabricBump,
    bumpScale: 0.018,
    roughness: 0.92,
    metalness: 0
  });

  const upholsteryDark = new THREE.MeshStandardMaterial({
    color: 0x5b6963,
    map: fabricMap,
    bumpMap: fabricBump,
    bumpScale: 0.014,
    roughness: 0.95,
    metalness: 0
  });

  const pipingMaterial = new THREE.MeshStandardMaterial({
    color: 0x53615b,
    roughness: 0.86
  });

  const woodMaterial = new THREE.MeshStandardMaterial({
    color: 0x6e3f22,
    roughness: 0.56,
    metalness: 0
  });

  const footMaterial = new THREE.MeshStandardMaterial({
    color: 0x29241f,
    roughness: 0.5
  });

  const sofa = new THREE.Group();
  sofa.rotation.y = -0.08;
  scene.add(sofa);

  function addRoundedBox(name, size, position, radius, material, segments = 5) {
    const geometry = new RoundedBoxGeometry(
      size.x,
      size.y,
      size.z,
      segments,
      radius
    );
    geometry.computeVertexNormals();
    const mesh = new THREE.Mesh(geometry, material);
    mesh.name = name;
    mesh.position.copy(position);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    sofa.add(mesh);
    return mesh;
  }

  addRoundedBox(
    'low upholstered frame',
    new THREE.Vector3(5.75, 0.48, 2.12),
    new THREE.Vector3(0, 0.86, 0.04),
    0.11,
    upholsteryDark
  );

  addRoundedBox(
    'rear support',
    new THREE.Vector3(5.25, 1.52, 0.34),
    new THREE.Vector3(0, 1.58, -0.88),
    0.1,
    upholsteryDark
  );

  addRoundedBox(
    'left thin armrest',
    new THREE.Vector3(0.35, 1.18, 2.02),
    new THREE.Vector3(-2.71, 1.47, 0.02),
    0.13,
    upholstery
  );

  addRoundedBox(
    'right thin armrest',
    new THREE.Vector3(0.35, 1.18, 2.02),
    new THREE.Vector3(2.71, 1.47, 0.02),
    0.13,
    upholstery
  );

  const seatWidth = 1.62;
  const seatCenters = [-1.68, 0, 1.68];

  for (let i = 0; i < 3; i++) {
    const x = seatCenters[i];
    addRoundedBox(
      `seat cushion ${i + 1}`,
      new THREE.Vector3(seatWidth, 0.38, 1.72),
      new THREE.Vector3(x, 1.2, 0.06),
      0.14,
      upholstery,
      7
    );

    const seamGeometry = new THREE.TorusGeometry(0.035, 0.012, 7, 18);
    const seam = new THREE.Mesh(seamGeometry, pipingMaterial);
    seam.position.set(x, 1.395, 0.79);
    seam.rotation.y = Math.PI * 0.5;
    seam.scale.set(1, 1, 0.8);
    seam.castShadow = true;
    sofa.add(seam);

    const back = addRoundedBox(
      `back cushion ${i + 1}`,
      new THREE.Vector3(seatWidth, 1.42, 0.43),
      new THREE.Vector3(x, 2.02, -0.63),
      0.17,
      upholstery,
      7
    );
    back.rotation.x = -0.105;
  }

  function createLeg(x, z, outwardX, outwardZ) {
    const height = 0.78;
    const geometry = new THREE.CylinderGeometry(0.075, 0.13, height, 16, 1);
    const leg = new THREE.Mesh(geometry, woodMaterial);
    leg.position.set(x, 0.43, z);
    leg.rotation.order = 'ZXY';
    leg.rotation.z = outwardX * 0.16;
    leg.rotation.x = outwardZ * 0.13;
    leg.castShadow = true;
    leg.receiveShadow = true;
    sofa.add(leg);

    const capGeometry = new THREE.CylinderGeometry(0.066, 0.07, 0.055, 16);
    const cap = new THREE.Mesh(capGeometry, footMaterial);
    cap.position.set(
      x + outwardX * 0.06,
      0.055,
      z + outwardZ * 0.05
    );
    cap.rotation.order = 'ZXY';
    cap.rotation.z = outwardX * 0.16;
    cap.rotation.x = outwardZ * 0.13;
    cap.castShadow = true;
    sofa.add(cap);
  }

  createLeg(-2.35, 0.68, -1, 1);
  createLeg(2.35, 0.68, 1, 1);
  createLeg(-2.35, -0.62, -1, -1);
  createLeg(2.35, -0.62, 1, -1);

  const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0xd8d0c4,
    roughness: 0.94,
    metalness: 0
  });
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(9, 96),
    floorMaterial
  );
  floor.rotation.x = -Math.PI * 0.5;
  floor.position.y = 0.01;
  floor.receiveShadow = true;
  scene.add(floor);

  const rugMaterial = new THREE.MeshStandardMaterial({
    color: 0xc2ae92,
    roughness: 1
  });
  const rug = new THREE.Mesh(
    new RoundedBoxGeometry(7.25, 0.035, 4.45, 4, 0.15),
    rugMaterial
  );
  rug.position.set(0, 0.025, 0.55);
  rug.receiveShadow = true;
  scene.add(rug);

  const ambient = new THREE.HemisphereLight(0xfff8e9, 0x6d716e, 2.15);
  scene.add(ambient);

  const keyLight = new THREE.DirectionalLight(0xfff1d7, 4.2);
  keyLight.position.set(-4.5, 7.5, 5.5);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.left = -6;
  keyLight.shadow.camera.right = 6;
  keyLight.shadow.camera.top = 6;
  keyLight.shadow.camera.bottom = -4;
  keyLight.shadow.camera.near = 0.5;
  keyLight.shadow.camera.far = 18;
  keyLight.shadow.bias = -0.0004;
  keyLight.shadow.normalBias = 0.025;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xcbd9e5, 1.45);
  fillLight.position.set(5, 4, -4);
  scene.add(fillLight);

  const warmLight = new THREE.PointLight(0xffc98d, 16, 9, 2);
  warmLight.position.set(-4, 3.6, -2.7);
  scene.add(warmLight);

  const contactShadow = new THREE.Mesh(
    new THREE.PlaneGeometry(5.8, 1.9),
    new THREE.MeshBasicMaterial({
      color: 0x493e35,
      transparent: true,
      opacity: 0.07,
      depthWrite: false
    })
  );
  contactShadow.rotation.x = -Math.PI * 0.5;
  contactShadow.position.set(0, 0.055, 0.02);
  scene.add(contactShadow);

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
</script>
</body>
</html>
