<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steampunk Orrery Clock</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100d0a}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x100d0a);
scene.fog = new THREE.FogExp2(0x100d0a, 0.038);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.8, 6.6, 12.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 8;
controls.maxDistance = 23;
controls.maxPolarAngle = Math.PI * 0.56;

const brass = new THREE.MeshStandardMaterial({ color: 0x9a661c, metalness: 0.88, roughness: 0.28 });
const brassBright = new THREE.MeshStandardMaterial({ color: 0xd7a54a, metalness: 0.93, roughness: 0.18 });
const brassDark = new THREE.MeshStandardMaterial({ color: 0x4c3216, metalness: 0.83, roughness: 0.36 });
const copper = new THREE.MeshStandardMaterial({ color: 0x9b4423, metalness: 0.86, roughness: 0.29 });
const copperBright = new THREE.MeshStandardMaterial({ color: 0xd16b32, metalness: 0.88, roughness: 0.22 });
const iron = new THREE.MeshStandardMaterial({ color: 0x1b2020, metalness: 0.82, roughness: 0.42 });
const blackMetal = new THREE.MeshStandardMaterial({ color: 0x090b0b, metalness: 0.72, roughness: 0.34 });
const patina = new THREE.MeshStandardMaterial({ color: 0x245f51, metalness: 0.45, roughness: 0.62 });
const cream = new THREE.MeshStandardMaterial({ color: 0xd8c99f, roughness: 0.68 });
const red = new THREE.MeshStandardMaterial({ color: 0x7f2118, metalness: 0.2, roughness: 0.5 });
const glass = new THREE.MeshPhysicalMaterial({
  color: 0xb7d0c9, transparent: true, opacity: 0.2, transmission: 0.6,
  roughness: 0.12, metalness: 0, clearcoat: 1, side: THREE.DoubleSide,
  depthWrite: false
});
const glow = new THREE.MeshStandardMaterial({
  color: 0xe89b2e, emissive: 0xff6a08, emissiveIntensity: 1.8,
  metalness: 0.48, roughness: 0.22
});

const root = new THREE.Group();
root.rotation.y = -0.05;
scene.add(root);

function mesh(geometry, material, parent = root) {
  const m = new THREE.Mesh(geometry, material);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function cylinderBetween(a, b, radius, material, parent = root, radial = 16) {
  const d = new THREE.Vector3().subVectors(b, a);
  const m = mesh(new THREE.CylinderGeometry(radius, radius, d.length(), radial), material, parent);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  return m;
}

function tube(points, radius, material, parent = root, closed = false) {
  const curve = new THREE.CatmullRomCurve3(points, closed, 'catmullrom', 0.55);
  return mesh(new THREE.TubeGeometry(curve, 72, radius, 10, closed), material, parent);
}

function rivet(pos, scale = 1, material = brassBright, parent = root) {
  const r = mesh(new THREE.SphereGeometry(0.075 * scale, 12, 8), material, parent);
  r.position.copy(pos);
  r.scale.set(1, 1, 0.48);
  return r;
}

function gear(teeth, innerR, outerR, depth, material) {
  const shape = new THREE.Shape();
  const count = teeth * 4;
  for (let i = 0; i < count; i++) {
    const toothPhase = i % 4;
    const radius = toothPhase === 1 || toothPhase === 2 ? outerR : outerR * 0.87;
    const a = i / count * Math.PI * 2;
    const x = Math.cos(a) * radius;
    const y = Math.sin(a) * radius;
    if (i === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
  }
  shape.closePath();
  const hole = new THREE.Path();
  hole.absellipse(0, 0, innerR, innerR, 0, Math.PI * 2, false, 0);
  shape.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: true, bevelSegments: 2,
    bevelSize: Math.min(0.055, depth * 0.25), bevelThickness: 0.035,
    curveSegments: 16
  });
  g.center();
  return mesh(g, material);
}

function torusAt(x, y, z, major, minor, material, rx = 0, ry = 0, rz = 0, parent = root) {
  const t = mesh(new THREE.TorusGeometry(major, minor, 12, 48), material, parent);
  t.position.set(x, y, z);
  t.rotation.set(rx, ry, rz);
  return t;
}

function box(size, pos, material, parent = root, bevelLike = false) {
  const b = mesh(new THREE.BoxGeometry(size.x, size.y, size.z, 2, 2, 2), material, parent);
  b.position.copy(pos);
  if (bevelLike) {
    const edge = new THREE.LineSegments(
      new THREE.EdgesGeometry(b.geometry),
      new THREE.LineBasicMaterial({ color: 0xd7a54a, transparent: true, opacity: 0.45 })
    );
    b.add(edge);
  }
  return b;
}

// Heavy tabletop plinth
const lower = mesh(new THREE.CylinderGeometry(3.7, 4.05, 0.42, 12, 1), brassDark);
lower.position.y = 0.23;
const upper = mesh(new THREE.CylinderGeometry(3.45, 3.62, 0.34, 12, 1), brass);
upper.position.y = 0.58;
torusAt(0, 0.48, 0, 3.63, 0.095, brassBright, Math.PI / 2);
torusAt(0, 0.77, 0, 3.42, 0.075, brassBright, Math.PI / 2);

for (let i = 0; i < 12; i++) {
  const a = i / 12 * Math.PI * 2;
  rivet(new THREE.Vector3(Math.cos(a) * 3.48, 0.62, Math.sin(a) * 3.48), 1.08);
}

for (const x of [-2.45, 2.45]) {
  const foot = mesh(new THREE.SphereGeometry(0.44, 20, 12), brassDark);
  foot.scale.set(1.3, 0.55, 1);
  foot.position.set(x, 0.04, 0.45);
}

// Rear arched clock frame
const frame = new THREE.Group();
root.add(frame);
tube([
  new THREE.Vector3(-2.7, 0.75, -0.48),
  new THREE.Vector3(-2.75, 2.35, -0.54),
  new THREE.Vector3(-2.2, 4.65, -0.58),
  new THREE.Vector3(0, 5.65, -0.62),
  new THREE.Vector3(2.2, 4.65, -0.58),
  new THREE.Vector3(2.75, 2.35, -0.54),
  new THREE.Vector3(2.7, 0.75, -0.48)
], 0.19, brassDark, frame);
tube([
  new THREE.Vector3(-2.55, 0.82, -0.43),
  new THREE.Vector3(-2.58, 2.35, -0.45),
  new THREE.Vector3(-2.02, 4.5, -0.48),
  new THREE.Vector3(0, 5.43, -0.5),
  new THREE.Vector3(2.02, 4.5, -0.48),
  new THREE.Vector3(2.58, 2.35, -0.45),
  new THREE.Vector3(2.55, 0.82, -0.43)
], 0.055, brassBright, frame);

// Copper pipe loops behind the clockwork
tube([
  new THREE.Vector3(-2.8, 1.05, -0.9),
  new THREE.Vector3(-3.25, 2.15, -1.0),
  new THREE.Vector3(-3.0, 4.45, -1.03),
  new THREE.Vector3(-1.6, 5.3, -1.0),
  new THREE.Vector3(-0.9, 4.72, -0.96)
], 0.11, copper);
tube([
  new THREE.Vector3(2.65, 0.9, -1.02),
  new THREE.Vector3(3.18, 1.85, -1.08),
  new THREE.Vector3(3.03, 3.82, -1.1),
  new THREE.Vector3(2.15, 4.7, -1.05),
  new THREE.Vector3(1.25, 4.28, -0.98)
], 0.12, copperBright);
tube([
  new THREE.Vector3(-1.95, 0.82, -1.15),
  new THREE.Vector3(-1.25, 1.7, -1.18),
  new THREE.Vector3(-1.5, 3.02, -1.2),
  new THREE.Vector3(-0.7, 3.85, -1.17)
], 0.075, patina);
for (const p of [[-3.13,2.2,-1],[2.98,2.15,-1.08],[-1.35,1.72,-1.18]]) {
  torusAt(p[0], p[1], p[2], 0.15, 0.035, brassBright, 0, Math.PI / 2);
}

// Exposed escapement cogs
const cogs = [];
function addGear(teeth, inner, outer, depth, mat, pos, rot = 0) {
  const g = gear(teeth, inner, outer, depth, mat);
  g.position.copy(pos);
  g.rotation.z = rot;
  cogs.push(g);
  torusAt(pos.x, pos.y, pos.z + depth * 0.58, inner * 0.58, 0.06, brassBright);
  return g;
}
addGear(18, 0.42, 1.0, 0.18, brass, new THREE.Vector3(-1.2, 2.83, -0.2), 0.08);
addGear(14, 0.31, 0.72, 0.2, copper, new THREE.Vector3(0.45, 2.35, -0.06), 0.2);
addGear(12, 0.24, 0.58, 0.18, brassBright, new THREE.Vector3(1.48, 3.03, -0.18), 0);
addGear(10, 0.18, 0.44, 0.16, iron, new THREE.Vector3(-0.1, 4.55, -0.34), 0.12);

for (const [x, y] of [[-1.2,2.83],[0.45,2.35],[1.48,3.03],[-0.1,4.55]]) {
  cylinderBetween(new THREE.Vector3(x,y,-0.75), new THREE.Vector3(x,y,0.27), 0.08, blackMetal);
  rivet(new THREE.Vector3(x,y,0.31), 1.2, brassBright);
}

// Escapement fork and pendulum
const fork = new THREE.Group();
root.add(fork);
cylinderBetween(new THREE.Vector3(-0.2, 4.22, 0.18), new THREE.Vector3(0.05, 3.72, 0.2), 0.055, iron, fork);
cylinderBetween(new THREE.Vector3(0.05, 3.72, 0.2), new THREE.Vector3(0.48, 4.16, 0.2), 0.055, iron, fork);
cylinderBetween(new THREE.Vector3(0.04, 3.7, 0.16), new THREE.Vector3(0.04, 1.42, 0.16), 0.045, brassBright);
const bob = mesh(new THREE.SphereGeometry(0.42, 24, 16), brass);
bob.scale.set(0.82, 1.12, 0.42);
bob.position.set(0.04, 1.52, 0.18);
torusAt(0.04, 1.52, 0.39, 0.31, 0.045, brassBright);

// Central pierced sun gear
const sun = addGear(24, 0.58, 1.38, 0.28, brassBright, new THREE.Vector3(0, 3.64, 0.62), 0.04);
for (let i = 0; i < 8; i++) {
  const a = i * Math.PI / 4;
  const spoke = box(
    new THREE.Vector3(0.82, 0.12, 0.16),
    new THREE.Vector3(Math.cos(a) * 0.78, 3.64 + Math.sin(a) * 0.78, 0.82),
    brass
  );
  spoke.rotation.z = a;
}
torusAt(0, 3.64, 0.86, 0.47, 0.105, brassDark);
torusAt(0, 3.64, 0.94, 0.25, 0.085, glow);
const sunCore = mesh(new THREE.SphereGeometry(0.19, 24, 16), glow);
sunCore.position.set(0, 3.64, 0.96);

// Three curved orbital armatures
const armData = [
  {
    points: [[0.15,3.85,0.96],[0.65,4.8,1.04],[1.65,5.22,1.02],[2.7,4.75,0.98]],
    planet: [2.7,4.75,1.04], radius: 0.35, mat: copperBright, ring: true
  },
  {
    points: [[-0.2,3.55,0.9],[-0.95,4.05,1.0],[-1.75,3.75,1.08],[-2.65,3.0,1.0]],
    planet: [-2.65,3.0,1.08], radius: 0.3, mat: patina, ring: false
  },
  {
    points: [[0.12,3.4,0.88],[0.85,2.9,0.98],[1.65,2.0,1.02],[2.42,1.45,1.05]],
    planet: [2.42,1.45,1.12], radius: 0.26, mat: brassBright, ring: false
  }
];

for (const data of armData) {
  const points = data.points.map(p => new THREE.Vector3(...p));
  tube(points, 0.075, brassBright);
  tube(points.map(p => p.clone().add(new THREE.Vector3(0, 0, -0.075))), 0.035, patina);
  const end = new THREE.Vector3(...data.planet);
  cylinderBetween(end.clone().add(new THREE.Vector3(0, -0.42, -0.06)), end, 0.055, copper);
  const planet = mesh(new THREE.SphereGeometry(data.radius, 28, 18), data.mat);
  planet.position.copy(end);
  const cap = mesh(new THREE.SphereGeometry(data.radius * 1.015, 28, 18, 0, Math.PI * 2, 0, Math.PI * 0.48), brassDark);
  cap.position.copy(end);
  cap.rotation.z = 0.45;
  if (data.ring) {
    const ring = torusAt(end.x, end.y, end.z, data.radius * 1.55, 0.035, brassBright);
    ring.rotation.x = 1.15;
    ring.rotation.z = 0.35;
  }
  rivet(end.clone().add(new THREE.Vector3(0, -0.43, 0.02)), 0.8, copperBright);
}

// Tiny riveted boiler
const boiler = new THREE.Group();
root.add(boiler);
const boilerBody = mesh(new THREE.CylinderGeometry(0.64, 0.7, 1.45, 24), copper, boiler);
boilerBody.position.set(-2.55, 1.42, 0.45);
const boilerTop = mesh(new THREE.SphereGeometry(0.64, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), copperBright, boiler);
boilerTop.position.set(-2.55, 2.14, 0.45);
const boilerBottom = torusAt(-2.55, 0.75, 0.45, 0.62, 0.08, brassDark, Math.PI / 2, 0, 0, boiler);
torusAt(-2.55, 1.05, 0.45, 0.67, 0.055, brassBright, Math.PI / 2, 0, 0, boiler);
torusAt(-2.55, 1.78, 0.45, 0.63, 0.055, brassBright, Math.PI / 2, 0, 0, boiler);
const chimney = mesh(new THREE.CylinderGeometry(0.16, 0.22, 0.72, 16), brassDark, boiler);
chimney.position.set(-2.55, 2.58, 0.45);
const chimneyLip = torusAt(-2.55, 2.94, 0.45, 0.19, 0.055, brassBright, Math.PI / 2, 0, 0, boiler);
for (let i = 0; i < 8; i++) {
  const a = i / 8 * Math.PI * 2;
  rivet(new THREE.Vector3(-2.55 + Math.cos(a) * 0.68, 1.77, 0.45 + Math.sin(a) * 0.68), 0.7, brassBright, boiler);
}
tube([
  new THREE.Vector3(-2.1, 2.1, 0.42),
  new THREE.Vector3(-1.82, 2.35, 0.42),
  new THREE.Vector3(-1.85, 2.9, 0.36)
], 0.075, copperBright, boiler);

// Pressure gauge at base
const gauge = new THREE.Group();
root.add(gauge);
gauge.position.set(1.55, 1.18, 1.0);
gauge.rotation.x = -0.08;

const gaugeCase = mesh(new THREE.CylinderGeometry(0.78, 0.82, 0.28, 40), brassDark, gauge);
gaugeCase.rotation.x = Math.PI / 2;
const face = mesh(new THREE.CircleGeometry(0.68, 48), cream, gauge);
face.position.z = 0.151;
torusAt(0, 0, 0.2, 0.73, 0.09, brassBright, 0, 0, 0, gauge);

for (let i = 0; i <= 16; i++) {
  const a = Math.PI * 0.76 + i / 16 * Math.PI * 1.48;
  const outer = new THREE.Vector3(Math.cos(a) * 0.58, Math.sin(a) * 0.58, 0.177);
  const inner = new THREE.Vector3(Math.cos(a) * (i % 4 === 0 ? 0.43 : 0.49), Math.sin(a) * (i % 4 === 0 ? 0.43 : 0.49), 0.178);
  cylinderBetween(inner, outer, i % 4 === 0 ? 0.016 : 0.009, blackMetal, gauge, 8);
}
const needleAngle = 2.05;
cylinderBetween(
  new THREE.Vector3(0, 0, 0.205),
  new THREE.Vector3(Math.cos(needleAngle) * 0.48, Math.sin(needleAngle) * 0.48, 0.205),
  0.025, red, gauge, 8
);
rivet(new THREE.Vector3(0, 0, 0.225), 1.25, brassDark, gauge);
const gaugeGlass = mesh(new THREE.CircleGeometry(0.69, 48), glass, gauge);
gaugeGlass.position.z = 0.245;

// Cracks on gauge glass
const crackMaterial = new THREE.LineBasicMaterial({ color: 0x35433e, transparent: true, opacity: 0.75 });
const crackOrigin = new THREE.Vector3(0.27, 0.23, 0.255);
const crackBranches = [
  [[0.27,0.23],[0.08,0.05],[-0.12,-0.13],[-0.32,-0.36]],
  [[0.27,0.23],[0.42,0.08],[0.55,-0.04],[0.61,-0.18]],
  [[0.27,0.23],[0.18,0.42],[0.11,0.61]],
  [[0.27,0.23],[0.43,0.34],[0.57,0.43]],
  [[0.08,0.05],[0.2,-0.13],[0.15,-0.27]]
];
for (const branch of crackBranches) {
  const pts = branch.map(p => new THREE.Vector3(p[0], p[1], 0.258));
  gauge.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), crackMaterial));
}
for (let i = 0; i < 4; i++) {
  const a = i / 4 * Math.PI * 2 + 0.35;
  rivet(new THREE.Vector3(Math.cos(a) * 0.7, Math.sin(a) * 0.7, 0.29), 0.62, brassBright, gauge);
}

// Gauge support
cylinderBetween(new THREE.Vector3(1.55, 0.73, 0.62), new THREE.Vector3(1.55, 0.91, 0.95), 0.12, brassDark);
const valve = mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.38, 12), copper);
valve.position.set(2.55, 0.96, 0.85);
torusAt(2.55, 1.18, 0.85, 0.25, 0.045, brassBright, Math.PI / 2);
for (let i = 0; i < 4; i++) {
  const a = i * Math.PI / 2;
  cylinderBetween(
    new THREE.Vector3(2.55 + Math.cos(a) * 0.08, 1.18, 0.85 + Math.sin(a) * 0.08),
    new THREE.Vector3(2.55 + Math.cos(a) * 0.31, 1.18, 0.85 + Math.sin(a) * 0.31),
    0.025, brassBright
  );
}

// Patina streaks and oxidized seams
tube([
  new THREE.Vector3(-2.1, 0.78, 1.05),
  new THREE.Vector3(-1.45, 0.82, 1.2),
  new THREE.Vector3(-0.85, 0.8, 1.28)
], 0.035, patina);
tube([
  new THREE.Vector3(0.35, 0.77, 1.45),
  new THREE.Vector3(0.7, 0.82, 1.55),
  new THREE.Vector3(1.02, 0.78, 1.48)
], 0.025, patina);
for (const p of [[-2.9,1.2,0.9],[-2.2,1.55,1.08],[2.74,2.52,-0.36],[2.34,4.15,-0.42]]) {
  const stain = mesh(new THREE.SphereGeometry(0.13, 14, 8), patina);
  stain.position.set(...p);
  stain.scale.set(1.8, 0.38, 0.24);
}

// Ground and lighting
const ground = mesh(new THREE.CircleGeometry(13, 96), new THREE.MeshStandardMaterial({
  color: 0x17120e, roughness: 0.84, metalness: 0.05
}));
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.22;
ground.receiveShadow = true;
ground.castShadow = false;

const hemi = new THREE.HemisphereLight(0x8aa0a8, 0x1c0d06, 1.3);
scene.add(hemi);

const key = new THREE.SpotLight(0xffd18d, 180, 30, Math.PI / 5, 0.55, 1.4);
key.position.set(6, 11, 8);
key.target.position.set(0, 2.5, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0003;
scene.add(key, key.target);

const warm = new THREE.PointLight(0xff6b27, 45, 12, 2);
warm.position.set(-4, 2.4, 3.5);
scene.add(warm);

const rim = new THREE.DirectionalLight(0x6ea6b8, 2.3);
rim.position.set(-6, 7, -6);
scene.add(rim);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  cogs.forEach((g, i) => {
    g.rotation.z += (i % 2 ? -1 : 1) * (0.0018 + i * 0.00035);
  });
  sun.rotation.z += 0.001;
  fork.rotation.z = Math.sin(t * 2.4) * 0.035;
  glow.emissiveIntensity = 1.55 + Math.sin(t * 2.1) * 0.28;
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
