<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1990s Point-and-Shoot Film Camera</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1c1f}
  canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1c1f);
scene.fog = new THREE.Fog(0x1a1c1f, 12, 24);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
camera.position.set(4.2, 2.6, 5.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

// ---------- Scuffed plastic texture (procedural) ----------
function scuffTexture(base, scuff, n = 512){
  const c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,n,n);
  // subtle mottling
  for(let i=0;i<2600;i++){
    g.fillStyle = `rgba(${Math.random()>.5?255:0},${Math.random()>.5?255:0},${Math.random()>.5?255:0},${Math.random()*0.035})`;
    g.fillRect(Math.random()*n, Math.random()*n, Math.random()*3+1, Math.random()*3+1);
  }
  // scuff streaks
  for(let i=0;i<70;i++){
    g.strokeStyle = scuff; g.globalAlpha = 0.05 + Math.random()*0.09;
    g.lineWidth = 0.5 + Math.random()*1.4;
    const x = Math.random()*n, y = Math.random()*n, a = Math.random()*Math.PI;
    const l = 12 + Math.random()*55;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*l, y+Math.sin(a)*l); g.stroke();
  }
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function roughTexture(n = 512){
  const c = document.createElement('canvas'); c.width = c.height = n;
  const g = c.getContext('2d');
  g.fillStyle = '#8a8a8a'; g.fillRect(0,0,n,n);
  for(let i=0;i<9000;i++){
    const v = 100 + Math.random()*110|0;
    g.fillStyle = `rgb(${v},${v},${v})`;
    g.fillRect(Math.random()*n, Math.random()*n, Math.random()*2+1, Math.random()*2+1);
  }
  for(let i=0;i<60;i++){
    g.strokeStyle = '#e8e8e8'; g.globalAlpha = 0.25; g.lineWidth = 1;
    const x = Math.random()*n, y = Math.random()*n, a = Math.random()*Math.PI, l = 15+Math.random()*50;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*l, y+Math.sin(a)*l); g.stroke();
  }
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const greyMap  = scuffTexture('#9a9a98', '#dcdcda');
const blackMap = scuffTexture('#28282a', '#606062');
const rMap = roughTexture();

const greyPlastic = new THREE.MeshStandardMaterial({ map: greyMap, roughness: 0.62, metalness: 0.05, roughnessMap: rMap });
const blackPlastic = new THREE.MeshStandardMaterial({ map: blackMap, roughness: 0.55, metalness: 0.08, roughnessMap: rMap });
const darkMatte = new THREE.MeshStandardMaterial({ color: 0x141416, roughness: 0.8, metalness: 0.05 });
const lensGlass = new THREE.MeshPhysicalMaterial({ color: 0x1b2340, roughness: 0.05, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.6 });
const vfGlass = new THREE.MeshPhysicalMaterial({ color: 0x223344, roughness: 0.08, metalness: 0, clearcoat: 1 });
const flashMat = new THREE.MeshPhysicalMaterial({ color: 0xf5edd8, roughness: 0.22, metalness: 0, transmission: 0.35, thickness: 0.2, clearcoat: 0.8 });
const redMat = new THREE.MeshStandardMaterial({ color: 0xaa1622, roughness: 0.35, emissive: 0x300000 });

// ---------- Camera model ----------
const cam = new THREE.Group();

// Body: rounded rectangular plastic shell
const body = new THREE.Mesh(new RoundedBoxGeometry(3.2, 1.9, 1.15, 6, 0.22), greyPlastic);
cam.add(body);

// Black rubber grip panel (right side, front)
const grip = new THREE.Mesh(new RoundedBoxGeometry(0.78, 1.72, 0.16, 4, 0.07), blackPlastic);
grip.position.set(1.12, 0, 0.545);
cam.add(grip);

// Front faceplate accent stripe
const stripe = new THREE.Mesh(new RoundedBoxGeometry(3.0, 0.1, 0.04, 2, 0.02), blackPlastic);
stripe.position.set(0, -0.62, 0.585);
cam.add(stripe);

// Lens barrel (protruding, stepped)
const lensGroup = new THREE.Group();
lensGroup.position.set(-0.25, -0.05, 0.575);
const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.66, 0.34, 48), blackPlastic);
b1.rotation.x = Math.PI/2; b1.position.z = 0.17; lensGroup.add(b1);
const b2 = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.53, 0.3, 48), blackPlastic);
b2.rotation.x = Math.PI/2; b2.position.z = 0.46; lensGroup.add(b2);
const ring = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.035, 12, 48), darkMatte);
ring.position.z = 0.61; lensGroup.add(ring);
const glass = new THREE.Mesh(new THREE.CircleGeometry(0.42, 48), lensGlass);
glass.position.z = 0.615; lensGroup.add(glass);
const innerRing = new THREE.Mesh(new THREE.RingGeometry(0.28, 0.42, 48), darkMatte);
innerRing.position.z = 0.62; lensGroup.add(innerRing);
const elem = new THREE.Mesh(new THREE.SphereGeometry(0.26, 32, 16, 0, Math.PI*2, 0, Math.PI/2), lensGlass);
elem.rotation.x = Math.PI/2; elem.position.z = 0.58; lensGroup.add(elem);
// surround bezel on body
const bezel = new THREE.Mesh(new THREE.CylinderGeometry(0.74, 0.74, 0.06, 48), greyPlastic);
bezel.rotation.x = Math.PI/2; bezel.position.z = 0.02; lensGroup.add(bezel);
cam.add(lensGroup);

// Flash window (top-left front)
const flashFrame = new THREE.Mesh(new RoundedBoxGeometry(0.72, 0.36, 0.07, 3, 0.03), blackPlastic);
flashFrame.position.set(-1.15, 0.62, 0.585);
cam.add(flashFrame);
const flash = new THREE.Mesh(new RoundedBoxGeometry(0.6, 0.26, 0.05, 3, 0.02), flashMat);
flash.position.set(-1.15, 0.62, 0.615);
cam.add(flash);

// Viewfinder window (front, top-center-right) + rear eyepiece
const vfFrame = new THREE.Mesh(new RoundedBoxGeometry(0.42, 0.26, 0.06, 3, 0.02), blackPlastic);
vfFrame.position.set(0.55, 0.64, 0.585);
cam.add(vfFrame);
const vf = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.17), vfGlass);
vf.position.set(0.55, 0.64, 0.617);
cam.add(vf);
const vfRear = new THREE.Mesh(new RoundedBoxGeometry(0.34, 0.24, 0.05, 3, 0.02), blackPlastic);
vfRear.position.set(0.55, 0.64, -0.585);
cam.add(vfRear);
const vfRearGlass = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.14), vfGlass);
vfRearGlass.rotation.y = Math.PI;
vfRearGlass.position.set(0.55, 0.64, -0.613);
cam.add(vfRearGlass);

// Small AF / red-eye window next to viewfinder
const af = new THREE.Mesh(new THREE.PlaneGeometry(0.14, 0.14), new THREE.MeshStandardMaterial({ color: 0x331111, roughness: 0.15 }));
af.position.set(0.12, 0.64, 0.586);
cam.add(af);

// Top plate detail + shutter button
const topPlate = new THREE.Mesh(new RoundedBoxGeometry(0.95, 0.07, 0.9, 3, 0.03), blackPlastic);
topPlate.position.set(1.05, 0.955, 0);
cam.add(topPlate);
const shutterBase = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.19, 0.06, 32), darkMatte);
shutterBase.position.set(1.05, 1.0, 0.12);
cam.add(shutterBase);
const shutter = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.07, 32), greyPlastic);
shutter.position.set(1.05, 1.05, 0.12);
cam.add(shutter);
// tiny power LED
const led = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 8), redMat);
led.position.set(0.62, 0.985, -0.15);
cam.add(led);
// frame-counter window on top
const counter = new THREE.Mesh(new RoundedBoxGeometry(0.3, 0.03, 0.22, 2, 0.01), vfGlass);
counter.position.set(-0.35, 0.965, -0.2);
cam.add(counter);

// Battery-door seam (bottom-right side): recessed groove lines + door panel
const seamMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.9 });
const doorPanel = new THREE.Mesh(new RoundedBoxGeometry(0.02, 0.85, 0.8, 2, 0.01), greyPlastic);
doorPanel.position.set(1.605, -0.35, 0);
cam.add(doorPanel);
function seamLine(w, h, d, x, y, z){
  const s = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), seamMat);
  s.position.set(x, y, z); cam.add(s);
}
seamLine(0.012, 0.015, 0.82, 1.612, 0.08, 0);     // top seam of door
seamLine(0.012, 0.86, 0.015, 1.612, -0.35, 0.41);  // front seam
seamLine(0.012, 0.86, 0.015, 1.612, -0.35, -0.41); // rear seam
// door thumb-notch
const notch = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.03, 20, 1, false, 0, Math.PI), darkMatte);
notch.rotation.z = Math.PI/2; notch.rotation.y = Math.PI/2;
notch.position.set(1.61, 0.05, 0);
cam.add(notch);

// Rear film-door seam hint + thumb ridge
seamLine(3.0, 0.012, 0.015, 0, 0.35, -0.585);
const thumb = new THREE.Mesh(new RoundedBoxGeometry(0.55, 0.5, 0.06, 3, 0.02), blackPlastic);
thumb.position.set(1.25, 0.4, -0.575);
cam.add(thumb);

cam.traverse(o => { if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
cam.position.y = 1.15;
cam.rotation.y = -0.35;
scene.add(cam);

// ---------- Ground + soft shadow ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 64),
  new THREE.MeshStandardMaterial({ color: 0x232529, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xbfd4e8, 0x2a2620, 0.55));
const key = new THREE.DirectionalLight(0xfff2e0, 2.2);
key.position.set(4, 6, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -4;
key.shadow.camera.right = key.shadow.camera.top = 4;
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
scene.add(key);
const fill = new THREE.DirectionalLight(0x8fb0dd, 0.6);
fill.position.set(-5, 3, -2);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.9);
rim.position.set(-2, 4, -6);
scene.add(rim);

// ---------- Controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 3;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.52;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
