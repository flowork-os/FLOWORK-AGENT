<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Dragon</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: radial-gradient(circle at 50% 38%, #261a38 0%, #090611 55%, #020205 100%);
}
canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05030a);
scene.fog = new THREE.FogExp2(0x08040f, 0.028);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.4, 4.8, 8.6);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.72;
controls.minDistance = 6;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI * 0.76;

scene.add(new THREE.HemisphereLight(0x987bff, 0x160b22, 1.8));

const key = new THREE.SpotLight(0xe8dcff, 900, 30, Math.PI / 7, 0.45, 1.4);
key.position.set(5, 9, 6);
key.target.position.set(0, 1.5, 0);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.bias = -0.0003;
scene.add(key, key.target);

const violetLight = new THREE.PointLight(0x9c35ff, 90, 12, 1.7);
violetLight.position.set(-4, 3.2, 2.5);
scene.add(violetLight);

const rim = new THREE.DirectionalLight(0x72d9ff, 3.2);
rim.position.set(-4, 6, -5);
scene.add(rim);

const warm = new THREE.PointLight(0xff8de9, 65, 10, 2);
warm.position.set(4, 1, -3);
scene.add(warm);

const crystal = new THREE.MeshPhysicalMaterial({
  color: 0x8a42d1,
  roughness: 0.12,
  metalness: 0.02,
  transmission: 0.62,
  thickness: 1.25,
  ior: 1.76,
  transparent: true,
  opacity: 0.94,
  attenuationColor: new THREE.Color(0x6f18a8),
  attenuationDistance: 2.8,
  specularIntensity: 1.5,
  specularColor: new THREE.Color(0xf3ddff),
  clearcoat: 1,
  clearcoatRoughness: 0.08,
  iridescence: 0.22,
  iridescenceIOR: 1.45,
  iridescenceThicknessRange: [120, 420],
  flatShading: true,
  side: THREE.DoubleSide
});

const paleCrystal = crystal.clone();
paleCrystal.color.set(0xc89aff);
paleCrystal.transmission = 0.5;
paleCrystal.opacity = 0.9;

const darkCrystal = crystal.clone();
darkCrystal.color.set(0x35104f);
darkCrystal.transmission = 0.3;
darkCrystal.opacity = 1;

const eyeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffd8ff,
  emissive: 0xd442ff,
  emissiveIntensity: 4,
  roughness: 0.04,
  metalness: 0.05,
  transmission: 0.15
});

const dragon = new THREE.Group();
dragon.rotation.y = -0.22;
scene.add(dragon);

function addMesh(geometry, material = crystal, position = [0, 0, 0], scale = [1, 1, 1]) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(...position);
  mesh.scale.set(...scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  dragon.add(mesh);
  return mesh;
}

function segment(a, b, radiusA, radiusB = radiusA, material = crystal, radial = 7) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const delta = end.clone().sub(start);
  const length = delta.length();
  const geometry = new THREE.CylinderGeometry(radiusB, radiusA, length, radial, 1, false);
  const mesh = addMesh(geometry, material);
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
  return mesh;
}

function coneBetween(base, tip, radius, material = crystal, radial = 6) {
  const a = new THREE.Vector3(...base);
  const b = new THREE.Vector3(...tip);
  const length = a.distanceTo(b);
  const mesh = addMesh(new THREE.ConeGeometry(radius, length, radial, 1, false), material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  return mesh;
}

function facetedEllipsoid(position, scale, detail = 1, material = crystal) {
  return addMesh(new THREE.IcosahedronGeometry(1, detail), material, position, scale);
}

function tube(points, radiiScale = 1, material = crystal, tubular = 7) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), false, 'centripetal');
  const mesh = addMesh(new THREE.TubeGeometry(curve, Math.max(24, points.length * 8), radiiScale, tubular, false), material);
  return mesh;
}

function wing(vertices, faces, material = paleCrystal) {
  const positions = [];
  for (const face of faces) {
    for (const index of face) positions.push(...vertices[index]);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.computeVertexNormals();
  return addMesh(geometry, material);
}

function mirroredPoint(p, side) {
  return [p[0], p[1], p[2] * side];
}

facetedEllipsoid([0, 1.62, 0], [1.22, 0.86, 0.82], 2);
facetedEllipsoid([-0.65, 1.92, 0], [0.72, 0.72, 0.62], 1);

tube([
  [-0.62, 2.03, 0],
  [-0.92, 2.42, 0.02],
  [-0.82, 2.92, 0.03],
  [-0.42, 3.33, 0.02],
  [0.03, 3.48, 0]
], 0.34);

facetedEllipsoid([0.22, 3.55, 0], [0.62, 0.5, 0.52], 1);
facetedEllipsoid([0.67, 3.48, 0], [0.52, 0.31, 0.34], 1);
facetedEllipsoid([0.93, 3.43, 0], [0.3, 0.22, 0.26], 0, paleCrystal);

segment([0.19, 3.35, 0.27], [0.74, 3.42, 0.25], 0.13, 0.09, paleCrystal);
segment([0.19, 3.35, -0.27], [0.74, 3.42, -0.25], 0.13, 0.09, paleCrystal);

facetedEllipsoid([0.62, 3.62, 0.31], [0.105, 0.105, 0.08], 1, eyeMaterial);
facetedEllipsoid([0.62, 3.62, -0.31], [0.105, 0.105, 0.08], 1, eyeMaterial);

coneBetween([0.03, 3.88, 0.25], [-0.12, 4.52, 0.36], 0.14, paleCrystal, 6);
coneBetween([0.03, 3.88, -0.25], [-0.12, 4.52, -0.36], 0.14, paleCrystal, 6);
coneBetween([-0.19, 3.68, 0.35], [-0.65, 4.08, 0.52], 0.11, crystal, 5);
coneBetween([-0.19, 3.68, -0.35], [-0.65, 4.08, -0.52], 0.11, crystal, 5);

for (let i = 0; i < 5; i++) {
  const x = -0.83 + i * 0.16;
  const y = 2.28 + i * 0.22;
  coneBetween([x, y, 0], [x - 0.32, y + 0.18, 0], 0.11 - i * 0.009, paleCrystal, 5);
}

const tail = tube([
  [0.66, 1.6, 0],
  [1.25, 1.26, 0.12],
  [1.66, 0.83, 0.52],
  [1.52, 0.42, 1.12],
  [0.91, 0.28, 1.52],
  [0.13, 0.3, 1.64],
  [-0.62, 0.5, 1.42],
  [-1.1, 0.82, 0.98],
  [-1.28, 1.14, 0.51]
], 0.25);
tail.scale.set(1, 1, 1);

const tailTip = coneBetween([-1.28, 1.14, 0.51], [-1.48, 1.42, 0.12], 0.24, paleCrystal, 6);

for (const side of [-1, 1]) {
  segment(
    mirroredPoint([-0.58, 1.66, 0.38], side),
    mirroredPoint([-1.18, 1.03, 0.58], side),
    0.24, 0.17
  );
  segment(
    mirroredPoint([-1.18, 1.03, 0.58], side),
    mirroredPoint([-0.84, 0.47, 0.72], side),
    0.17, 0.12
  );
  for (let c = 0; c < 3; c++) {
    const z = (0.57 + c * 0.13) * side;
    coneBetween([-0.87 + c * 0.08, 0.48, z], [-0.52 + c * 0.1, 0.26, z + 0.08 * side], 0.075, paleCrystal, 5);
  }

  segment(
    mirroredPoint([0.34, 2.02, 0.48], side),
    mirroredPoint([0.82, 1.44, 0.72], side),
    0.19, 0.13
  );
  segment(
    mirroredPoint([0.82, 1.44, 0.72], side),
    mirroredPoint([0.52, 0.98, 0.88], side),
    0.13, 0.09
  );
  for (let c = 0; c < 3; c++) {
    const z = (0.81 + c * 0.1) * side;
    coneBetween([0.53 + c * 0.07, 1.0, z], [0.82 + c * 0.1, 0.78, z + 0.07 * side], 0.065, paleCrystal, 5);
  }
}

const wingVertices = [
  [-0.3, 2.75, 0.28],
  [-1.15, 3.28, 0.52],
  [-2.42, 3.62, 0.72],
  [-1.8, 2.67, 0.82],
  [-2.1, 1.74, 0.78],
  [-1.05, 2.14, 0.56],
  [-0.5, 1.94, 0.38]
];
const wingFaces = [
  [0, 1, 5],
  [1, 2, 3],
  [1, 3, 5],
  [3, 4, 5],
  [5, 4, 6],
  [0, 5, 6]
];
wing(wingVertices, wingFaces);

const oppositeWingVertices = wingVertices.map(v => [v[0], v[1], -v[2]]);
wing(oppositeWingVertices, wingFaces.map(f => [f[0], f[2], f[1]]));

for (const side of [-1, 1]) {
  segment(mirroredPoint([-0.28, 2.74, 0.28], side), mirroredPoint([-2.42, 3.62, 0.72], side), 0.085, 0.045, paleCrystal, 5);
  segment(mirroredPoint([-1.13, 3.27, 0.52], side), mirroredPoint([-2.1, 1.74, 0.78], side), 0.055, 0.035, paleCrystal, 5);
  segment(mirroredPoint([-0.5, 2.05, 0.39], side), mirroredPoint([-1.78, 2.68, 0.82], side), 0.06, 0.035, paleCrystal, 5);
}

for (let i = 0; i < 7; i++) {
  const angle = -0.95 + i * 0.31;
  const x = 0.15 + Math.cos(angle) * 0.86;
  const y = 1.66 + Math.sin(angle) * 0.57;
  coneBetween([x, y, 0], [x + 0.16, y + 0.15, 0], 0.085, paleCrystal, 5);
}

const sparklePositions = [];
const sparkleColors = [];
let seed = 9743;
function random() {
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
}
for (let i = 0; i < 145; i++) {
  const theta = random() * Math.PI * 2;
  const r = Math.sqrt(random()) * 0.82;
  const x = Math.cos(theta) * r - 0.05;
  const z = Math.sin(theta) * r * 0.68;
  const y = 1.2 + random() * 1.05;
  sparklePositions.push(x, y, z);
  const brightness = 0.65 + random() * 0.35;
  sparkleColors.push(brightness, 0.55 + brightness * 0.35, 1);
}
for (let i = 0; i < 40; i++) {
  const t = random();
  sparklePositions.push(-0.72 + t * 0.9, 2.1 + t * 1.4, (random() - 0.5) * 0.35);
  sparkleColors.push(0.9, 0.72, 1);
}
const sparkleGeometry = new THREE.BufferGeometry();
sparkleGeometry.setAttribute('position', new THREE.Float32BufferAttribute(sparklePositions, 3));
sparkleGeometry.setAttribute('color', new THREE.Float32BufferAttribute(sparkleColors, 3));
const sparkles = new THREE.Points(sparkleGeometry, new THREE.PointsMaterial({
  size: 0.035,
  vertexColors: true,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true
}));
dragon.add(sparkles);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(6.5, 64),
  new THREE.MeshStandardMaterial({
    color: 0x090611,
    roughness: 0.34,
    metalness: 0.18,
    transparent: true,
    opacity: 0.78
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.02;
ground.receiveShadow = true;
scene.add(ground);

const halo = new THREE.Mesh(
  new THREE.RingGeometry(1.45, 2.65, 64),
  new THREE.MeshBasicMaterial({
    color: 0x7f32ce,
    transparent: true,
    opacity: 0.13,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
halo.rotation.x = -Math.PI / 2;
halo.position.y = 0.035;
scene.add(halo);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  sparkles.material.opacity = 0.72 + Math.sin(time * 2.2) * 0.16;
  sparkleGeometry.rotateY(0.0008);
  violetLight.intensity = 88 + Math.sin(time * 1.4) * 15;
  halo.material.opacity = 0.1 + Math.sin(time * 1.1) * 0.025;
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
