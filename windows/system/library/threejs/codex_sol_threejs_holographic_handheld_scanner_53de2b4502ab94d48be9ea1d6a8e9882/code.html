<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Handheld Scanner</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, #111a2d 0%, #070b14 42%, #020307 100%);
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040a);
scene.fog = new THREE.FogExp2(0x02040a, 0.065);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.2, 3.25, 6.3);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 4;
controls.maxDistance = 11;
controls.maxPolarAngle = Math.PI * 0.78;

scene.add(new THREE.HemisphereLight(0x86cfff, 0x12051c, 1.25));

const keyLight = new THREE.DirectionalLight(0xa9eaff, 3.2);
keyLight.position.set(4, 7, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -4;
scene.add(keyLight);

const magentaLight = new THREE.PointLight(0xff2bd6, 18, 8, 2);
magentaLight.position.set(-3, 2.4, 1.5);
scene.add(magentaLight);

const cyanLight = new THREE.PointLight(0x17e9ff, 20, 8, 2);
cyanLight.position.set(2.8, 1.6, -2.8);
scene.add(cyanLight);

const goldLight = new THREE.PointLight(0xffb52e, 10, 6, 2);
goldLight.position.set(2.3, 3.8, 2.3);
scene.add(goldLight);

const scanner = new THREE.Group();
scanner.rotation.set(-0.05, 0.28, 0.02);
scanner.position.y = 0.25;
scene.add(scanner);

const shellMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x25364a,
  metalness: 0.72,
  roughness: 0.2,
  clearcoat: 1,
  clearcoatRoughness: 0.13,
  iridescence: 1,
  iridescenceIOR: 1.7,
  iridescenceThicknessRange: [120, 760],
  emissive: 0x091529,
  emissiveIntensity: 0.5
});

const darkMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x070b13,
  metalness: 0.88,
  roughness: 0.28,
  clearcoat: 0.85,
  clearcoatRoughness: 0.18
});

const translucentShellMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x4eefff,
  metalness: 0.25,
  roughness: 0.18,
  transmission: 0.16,
  transparent: true,
  opacity: 0.22,
  depthWrite: false,
  iridescence: 1,
  iridescenceIOR: 1.5,
  iridescenceThicknessRange: [100, 520],
  emissive: 0x0b7180,
  emissiveIntensity: 0.85
});

const cyanGlow = new THREE.MeshBasicMaterial({
  color: 0x54f7ff,
  transparent: true,
  opacity: 0.95,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const magentaGlow = new THREE.MeshBasicMaterial({
  color: 0xff45db,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

function addEdgeGlow(mesh, color = 0x4cecff, opacity = 0.38) {
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(mesh.geometry, 22),
    new THREE.LineBasicMaterial({
      color,
      transparent: true,
      opacity,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    })
  );
  edges.position.copy(mesh.position);
  edges.rotation.copy(mesh.rotation);
  edges.scale.copy(mesh.scale);
  mesh.parent.add(edges);
  return edges;
}

const body = new THREE.Mesh(
  new RoundedBoxGeometry(0.98, 0.76, 2.18, 5, 0.2),
  shellMaterial
);
body.position.set(0, 0.68, 0);
body.castShadow = true;
body.receiveShadow = true;
scanner.add(body);
addEdgeGlow(body);

const upperShell = new THREE.Mesh(
  new RoundedBoxGeometry(0.78, 0.28, 1.55, 4, 0.11),
  translucentShellMaterial
);
upperShell.position.set(0, 1.08, 0.05);
scanner.add(upperShell);
addEdgeGlow(upperShell, 0xff4edb, 0.28);

const nose = new THREE.Mesh(
  new RoundedBoxGeometry(0.82, 0.58, 0.78, 4, 0.14),
  shellMaterial
);
nose.position.set(0, 0.69, -1.25);
nose.castShadow = true;
scanner.add(nose);
addEdgeGlow(nose, 0x77f7ff, 0.5);

const sideInset = new THREE.Mesh(
  new RoundedBoxGeometry(0.035, 0.38, 1.22, 3, 0.08),
  darkMaterial
);
sideInset.position.set(0.501, 0.68, 0.12);
scanner.add(sideInset);

const sideAccent = new THREE.Mesh(
  new RoundedBoxGeometry(0.025, 0.055, 0.9, 3, 0.025),
  cyanGlow
);
sideAccent.position.set(0.524, 0.82, -0.02);
scanner.add(sideAccent);

const grip = new THREE.Mesh(
  new RoundedBoxGeometry(0.64, 1.65, 0.7, 5, 0.18),
  shellMaterial
);
grip.position.set(0, -0.23, 0.48);
grip.rotation.x = -0.21;
grip.castShadow = true;
grip.receiveShadow = true;
scanner.add(grip);
addEdgeGlow(grip, 0xff58db, 0.32);

const gripInset = new THREE.Mesh(
  new RoundedBoxGeometry(0.67, 1.05, 0.12, 3, 0.05),
  darkMaterial
);
gripInset.position.set(0, -0.32, 0.793);
gripInset.rotation.x = -0.21;
scanner.add(gripInset);

for (let i = 0; i < 5; i++) {
  const groove = new THREE.Mesh(
    new RoundedBoxGeometry(0.5, 0.035, 0.045, 2, 0.014),
    translucentShellMaterial
  );
  groove.position.set(0, 0.02 - i * 0.19, 0.865 + i * 0.04);
  groove.rotation.x = -0.21;
  scanner.add(groove);
}

const triggerGuard = new THREE.Mesh(
  new THREE.TorusGeometry(0.3, 0.055, 10, 32, Math.PI * 1.58),
  darkMaterial
);
triggerGuard.rotation.set(0, Math.PI / 2, -0.34);
triggerGuard.position.set(0, 0.14, -0.06);
scanner.add(triggerGuard);

const trigger = new THREE.Mesh(
  new RoundedBoxGeometry(0.13, 0.42, 0.12, 3, 0.045),
  magentaGlow
);
trigger.rotation.x = -0.26;
trigger.position.set(0, 0.23, 0.04);
scanner.add(trigger);

const emitterHousing = new THREE.Mesh(
  new THREE.CylinderGeometry(0.34, 0.42, 0.28, 48, 1, false),
  darkMaterial
);
emitterHousing.rotation.x = Math.PI / 2;
emitterHousing.position.set(0, 0.72, -1.68);
emitterHousing.castShadow = true;
scanner.add(emitterHousing);

const emitterRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.285, 0.055, 12, 64),
  cyanGlow
);
emitterRing.position.set(0, 0.72, -1.835);
scanner.add(emitterRing);

const emitterCore = new THREE.Mesh(
  new THREE.CircleGeometry(0.235, 48),
  new THREE.MeshBasicMaterial({
    color: 0x8cffff,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide
  })
);
emitterCore.position.set(0, 0.72, -1.84);
scanner.add(emitterCore);

const lensHalo = new THREE.Mesh(
  new THREE.CircleGeometry(0.42, 48),
  new THREE.MeshBasicMaterial({
    color: 0x20ddff,
    transparent: true,
    opacity: 0.11,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide
  })
);
lensHalo.position.set(0, 0.72, -1.855);
scanner.add(lensHalo);

const topProjector = new THREE.Mesh(
  new THREE.CylinderGeometry(0.18, 0.25, 0.18, 32),
  darkMaterial
);
topProjector.position.set(0, 1.26, -0.78);
scanner.add(topProjector);

const projectorLens = new THREE.Mesh(
  new THREE.CircleGeometry(0.155, 32),
  cyanGlow
);
projectorLens.rotation.x = -Math.PI / 2;
projectorLens.position.set(0, 1.36, -0.78);
scanner.add(projectorLens);

const indicatorMaterials = [];
const indicatorMeshes = [];
const indicatorColors = [0x56faff, 0xff4bd8, 0xffc54d, 0x65faff];

for (let i = 0; i < 4; i++) {
  const material = new THREE.MeshBasicMaterial({
    color: indicatorColors[i],
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  indicatorMaterials.push(material);

  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 12), material);
  dot.position.set(0.545, 0.55, -0.37 + i * 0.23);
  scanner.add(dot);
  indicatorMeshes.push(dot);

  const halo = new THREE.Mesh(
    new THREE.CircleGeometry(0.09, 24),
    new THREE.MeshBasicMaterial({
      color: indicatorColors[i],
      transparent: true,
      opacity: 0.13,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide
    })
  );
  halo.rotation.y = Math.PI / 2;
  halo.position.set(0.554, 0.55, -0.37 + i * 0.23);
  scanner.add(halo);
}

const fanVertexShader = `
  varying vec3 vPosition;
  varying vec3 vWorldPosition;
  void main() {
    vPosition = position;
    vec4 world = modelMatrix * vec4(position, 1.0);
    vWorldPosition = world.xyz;
    gl_Position = projectionMatrix * viewMatrix * world;
  }
`;

const fanFragmentShader = `
  uniform float uTime;
  varying vec3 vPosition;
  varying vec3 vWorldPosition;
  void main() {
    float heightFade = smoothstep(1.25, 2.75, vPosition.y);
    float bands = 0.5 + 0.5 * sin(vPosition.y * 34.0 - uTime * 6.0);
    float fineBands = 0.5 + 0.5 * sin(vPosition.y * 93.0 + uTime * 3.5);
    float shimmer = 0.5 + 0.5 * sin(
      vWorldPosition.x * 9.0 +
      vWorldPosition.z * 12.0 -
      uTime * 4.0
    );
    vec3 cyan = vec3(0.08, 0.92, 1.0);
    vec3 magenta = vec3(1.0, 0.12, 0.78);
    vec3 gold = vec3(1.0, 0.65, 0.12);
    vec3 color = mix(cyan, magenta, smoothstep(-1.0, 1.0, vPosition.x));
    color = mix(color, gold, shimmer * 0.2);
    float alpha = (0.035 + bands * 0.055 + fineBands * 0.018) * (0.45 + heightFade);
    gl_FragColor = vec4(color * (1.2 + shimmer * 0.7), alpha);
  }
`;

const fanGeometry = new THREE.BufferGeometry();
const fanVertices = new Float32Array([
   0, 1.36, -0.78,  -1.28, 2.85, -1.18,   1.28, 2.85, -1.18,
   0, 1.36, -0.78,   1.10, 2.74,  0.34,  -1.10, 2.74,  0.34,
   0, 1.36, -0.78,  -1.10, 2.74,  0.34,  -1.28, 2.85, -1.18,
   0, 1.36, -0.78,   1.28, 2.85, -1.18,   1.10, 2.74,  0.34
]);
fanGeometry.setAttribute('position', new THREE.BufferAttribute(fanVertices, 3));
fanGeometry.computeVertexNormals();

const fanMaterial = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: fanVertexShader,
  fragmentShader: fanFragmentShader,
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending
});

const dataFan = new THREE.Mesh(fanGeometry, fanMaterial);
dataFan.renderOrder = 2;
scanner.add(dataFan);

const fanLineMaterial = new THREE.LineBasicMaterial({
  color: 0x62f6ff,
  transparent: true,
  opacity: 0.32,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const apex = new THREE.Vector3(0, 1.36, -0.78);
const corners = [
  new THREE.Vector3(-1.28, 2.85, -1.18),
  new THREE.Vector3(1.28, 2.85, -1.18),
  new THREE.Vector3(1.10, 2.74, 0.34),
  new THREE.Vector3(-1.10, 2.74, 0.34)
];

const fanGridPositions = [];

for (let i = 0; i < corners.length; i++) {
  fanGridPositions.push(
    apex.x, apex.y, apex.z,
    corners[i].x, corners[i].y, corners[i].z
  );
}

for (let i = 1; i <= 7; i++) {
  const t = i / 8;
  const ring = corners.map((corner) => apex.clone().lerp(corner, t));
  for (let j = 0; j < 4; j++) {
    const a = ring[j];
    const b = ring[(j + 1) % 4];
    fanGridPositions.push(a.x, a.y, a.z, b.x, b.y, b.z);
  }
}

for (let i = 1; i < 8; i++) {
  const t = i / 8;
  const frontLeft = apex.clone().lerp(corners[0], t);
  const frontRight = apex.clone().lerp(corners[1], t);
  const backLeft = apex.clone().lerp(corners[3], t);
  const backRight = apex.clone().lerp(corners[2], t);
  const spanT = i / 8;
  const frontPoint = frontLeft.clone().lerp(frontRight, spanT);
  const backPoint = backLeft.clone().lerp(backRight, spanT);
  fanGridPositions.push(
    frontPoint.x, frontPoint.y, frontPoint.z,
    backPoint.x, backPoint.y, backPoint.z
  );
}

const fanGridGeometry = new THREE.BufferGeometry();
fanGridGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(fanGridPositions, 3)
);
const fanGrid = new THREE.LineSegments(fanGridGeometry, fanLineMaterial);
fanGrid.renderOrder = 3;
scanner.add(fanGrid);

const readout = new THREE.Group();
readout.position.set(0, 2.23, 0.15);
readout.rotation.x = -0.05;
scanner.add(readout);

const panel = new THREE.Mesh(
  new RoundedBoxGeometry(1.55, 0.72, 0.018, 4, 0.09),
  new THREE.MeshBasicMaterial({
    color: 0x18ddeb,
    transparent: true,
    opacity: 0.095,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
readout.add(panel);

const panelBorderShape = new THREE.Shape();
panelBorderShape.moveTo(-0.68, -0.3);
panelBorderShape.lineTo(0.68, -0.3);
panelBorderShape.lineTo(0.77, -0.21);
panelBorderShape.lineTo(0.77, 0.21);
panelBorderShape.lineTo(0.68, 0.3);
panelBorderShape.lineTo(-0.68, 0.3);
panelBorderShape.lineTo(-0.77, 0.21);
panelBorderShape.lineTo(-0.77, -0.21);
panelBorderShape.closePath();

const borderPoints = panelBorderShape.getPoints(32).map(
  (point) => new THREE.Vector3(point.x, point.y, 0.016)
);
const panelBorder = new THREE.LineLoop(
  new THREE.BufferGeometry().setFromPoints(borderPoints),
  new THREE.LineBasicMaterial({
    color: 0x78fbff,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
readout.add(panelBorder);

const readoutBars = [];
for (let i = 0; i < 6; i++) {
  const width = 0.16 + ((i * 37) % 7) * 0.055;
  const material = new THREE.MeshBasicMaterial({
    color: i === 4 ? 0xff55d9 : 0x72f9ff,
    transparent: true,
    opacity: 0.72,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const bar = new THREE.Mesh(
    new RoundedBoxGeometry(width, 0.035, 0.012, 2, 0.012),
    material
  );
  bar.position.set(-0.48 + width * 0.5, 0.19 - i * 0.078, 0.026);
  readout.add(bar);
  readoutBars.push(bar);
}

const reticleMaterial = new THREE.LineBasicMaterial({
  color: 0xffd064,
  transparent: true,
  opacity: 0.82,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const reticlePositions = [
  0.32, 0.15, 0.03, 0.52, 0.15, 0.03,
  0.52, 0.15, 0.03, 0.58, 0.09, 0.03,
  0.58, 0.09, 0.03, 0.58, -0.09, 0.03,
  0.58, -0.09, 0.03, 0.52, -0.15, 0.03,
  0.52, -0.15, 0.03, 0.32, -0.15, 0.03,
  0.32, -0.15, 0.03, 0.26, -0.09, 0.03,
  0.26, -0.09, 0.03, 0.26, 0.09, 0.03,
  0.26, 0.09, 0.03, 0.32, 0.15, 0.03,
  0.37, 0.0, 0.03, 0.47, 0.0, 0.03,
  0.42, -0.05, 0.03, 0.42, 0.05, 0.03
];

const reticleGeometry = new THREE.BufferGeometry();
reticleGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(reticlePositions, 3)
);
readout.add(new THREE.LineSegments(reticleGeometry, reticleMaterial));

const scanBeam = new THREE.Mesh(
  new THREE.PlaneGeometry(1.42, 0.018),
  new THREE.MeshBasicMaterial({
    color: 0xd9ffff,
    transparent: true,
    opacity: 0.78,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide
  })
);
scanBeam.position.z = 0.04;
readout.add(scanBeam);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(5.5, 96),
  new THREE.MeshStandardMaterial({
    color: 0x050812,
    metalness: 0.35,
    roughness: 0.58,
    transparent: true,
    opacity: 0.72
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.04;
floor.receiveShadow = true;
scene.add(floor);

const floorRing = new THREE.Mesh(
  new THREE.RingGeometry(1.35, 1.37, 96),
  new THREE.MeshBasicMaterial({
    color: 0x24dcea,
    transparent: true,
    opacity: 0.14,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide
  })
);
floorRing.rotation.x = -Math.PI / 2;
floorRing.position.y = -1.025;
scene.add(floorRing);

const shadowGlow = new THREE.Mesh(
  new THREE.CircleGeometry(1.25, 64),
  new THREE.MeshBasicMaterial({
    color: 0x1cd6e8,
    transparent: true,
    opacity: 0.06,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
shadowGlow.rotation.x = -Math.PI / 2;
shadowGlow.position.y = -1.02;
scene.add(shadowGlow);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const time = clock.getElapsedTime();
  fanMaterial.uniforms.uTime.value = time;

  const hue = 0.54 + Math.sin(time * 0.45) * 0.08;
  shellMaterial.emissive.setHSL(hue, 0.8, 0.055);
  shellMaterial.iridescenceIOR = 1.55 + Math.sin(time * 0.7) * 0.18;

  indicatorMaterials.forEach((material, index) => {
    material.opacity = 0.45 + 0.5 * Math.pow(
      0.5 + 0.5 * Math.sin(time * 3.2 - index * 0.85),
      2
    );
    const scale = 0.85 + material.opacity * 0.25;
    indicatorMeshes[index].scale.setScalar(scale);
  });

  fanLineMaterial.opacity = 0.24 + Math.sin(time * 2.2) * 0.07;
  emitterRing.scale.setScalar(1 + Math.sin(time * 4.1) * 0.035);
  lensHalo.scale.setScalar(1.03 + Math.sin(time * 2.8) * 0.09);

  scanBeam.position.y = Math.sin(time * 1.8) * 0.25;
  scanBeam.material.opacity = 0.46 + Math.sin(time * 4.5) * 0.22;

  readout.position.y = 2.23 + Math.sin(time * 1.25) * 0.035;
  readout.rotation.z = Math.sin(time * 0.8) * 0.012;

  readoutBars.forEach((bar, index) => {
    bar.material.opacity = 0.4 + 0.4 * (
      0.5 + 0.5 * Math.sin(time * 2.6 + index * 0.7)
    );
  });

  floorRing.material.opacity = 0.1 + Math.sin(time * 1.7) * 0.035;

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

animate();
</script>
</body>
</html>
