<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wooden Toy Train Engine</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14161a; }
  #c { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------------------
   Renderer
--------------------------------------------------------------------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;

/* ---------------------------------------------------------------------------
   Scene + procedural studio environment (no external assets)
--------------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171b);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------------------------------------------------------------------------
   Camera + controls
--------------------------------------------------------------------------- */
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(6.2, 4.0, 7.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.enablePan = false;
controls.minDistance = 4.5;
controls.maxDistance = 16;
controls.minPolarAngle = 0.15;
controls.maxPolarAngle = Math.PI * 0.5 - 0.02;

/* ---------------------------------------------------------------------------
   Lighting: hemisphere fill + key + fill + rim, soft shadows
--------------------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0xbcd4ff, 0x2a2320, 0.45);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e6, 2.4);
key.position.set(5, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 26;
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -5;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fb8ff, 0.55);
fill.position.set(-6, 4, -3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xbcd2ff, 1.1);
rim.position.set(-4, 5, -7);
scene.add(rim);

/* ---------------------------------------------------------------------------
   Ground plane that only receives shadows
--------------------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------------
   Materials — smooth matte painted-wood look
--------------------------------------------------------------------------- */
const RED    = 0xd23c2e;
const DARKRED = 0x9e2b21;
const BLUE   = 0x2f6fb2;
const YELLOW = 0xf2b134;
const NAVY   = 0x273450;
const WINDOW = 0x172032;

function paint(color, { rough = 0.55, metal = 0.0, env = 0.4, emissive = null, ei = 0 } = {}) {
  const m = new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
  m.envMapIntensity = env;
  if (emissive !== null) { m.emissive = new THREE.Color(emissive); m.emissiveIntensity = ei; }
  return m;
}
const metalMat = paint(0x9aa1aa, { rough: 0.34, metal: 0.8, env: 0.95 });

const boilerMat  = paint(RED);
const smokeboxMat = paint(RED, { rough: 0.5 });
const doorMat    = paint(DARKRED);
const chassisMat = paint(BLUE);
const cabinMat   = paint(BLUE);
const roofMat    = paint(RED);
const domeMat    = paint(YELLOW);
const bandMat    = paint(YELLOW, { rough: 0.45, metal: 0.25, env: 0.7 });
const stackMat   = paint(NAVY, { rough: 0.5 });
const beamMat    = paint(YELLOW);
const windowMat  = paint(WINDOW, { rough: 0.25, metal: 0.1, env: 0.9 });
const lensMat    = paint(0xfff2c0, { emissive: 0xffd27a, ei: 0.7, rough: 0.3 });
const wheelTireMat = paint(YELLOW);
const wheelHubMat  = paint(RED);

/* ---------------------------------------------------------------------------
   Geometry helpers
--------------------------------------------------------------------------- */
function roundedRectShape(w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

// A box (W x H x D) with softly rounded edges — the toy-paint look.
function roundedBoxGeom(W, H, D, r) {
  r = Math.min(r, W / 2 - 0.001, H / 2 - 0.001, D / 2 - 0.001);
  const shape = roundedRectShape(W - 2 * r, H - 2 * r, Math.max(0.001, r * 0.6));
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: D - 2 * r,
    bevelEnabled: true,
    bevelThickness: r,
    bevelSize: r,
    bevelSegments: 5,
    curveSegments: 18,
    steps: 1
  });
  geo.center();
  geo.computeVertexNormals();
  return geo;
}

const train = new THREE.Group();

function add(geo, mat, x = 0, y = 0, z = 0, parent = train) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* ---------------------------------------------------------------------------
   Wheels (turned, solid wooden discs)
--------------------------------------------------------------------------- */
function createWheel(radius, width, side, withCrank) {
  const g = new THREE.Group();

  const tire = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, width, 48), wheelTireMat);
  tire.castShadow = tire.receiveShadow = true;
  g.add(tire);

  const groove = new THREE.Mesh(new THREE.TorusGeometry(radius * 0.72, 0.02, 12, 44), wheelHubMat);
  groove.rotation.x = Math.PI / 2;
  groove.position.y = width / 2 + 0.001;
  groove.castShadow = true;
  g.add(groove);

  const hub = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.3, radius * 0.3, width + 0.08, 30), wheelHubMat);
  hub.castShadow = true;
  g.add(hub);

  const cap = new THREE.Mesh(new THREE.SphereGeometry(radius * 0.16, 20, 16), metalMat);
  cap.position.y = (width + 0.08) / 2;
  cap.castShadow = true;
  g.add(cap);

  if (withCrank) {
    const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.14, 20), metalMat);
    pin.position.set(radius * 0.55, width / 2 + 0.05, 0);
    pin.castShadow = true;
    g.add(pin);
    const pinCap = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 12), metalMat);
    pinCap.position.set(radius * 0.55, width / 2 + 0.12, 0);
    g.add(pinCap);
  }

  g.rotation.x = side > 0 ? Math.PI / 2 : -Math.PI / 2;
  return g;
}

const bigR = 0.5, bigW = 0.16, bigZ = 0.64;
const bigXs = [-1.15, -0.35];
const smallR = 0.3, smallW = 0.14, smallZ = 0.6, smallX = 0.95;

for (const side of [1, -1]) {
  for (const x of bigXs) {
    const w = createWheel(bigR, bigW, side, true);
    w.position.set(x, bigR, side * bigZ);
    train.add(w);
  }
  const lw = createWheel(smallR, smallW, side, false);
  lw.position.set(smallX, smallR, side * smallZ);
  train.add(lw);

  // coupling / side rod linking the two driving wheels
  const rod = add(
    roundedBoxGeom(1.0, 0.11, 0.05, 0.02),
    metalMat,
    (bigXs[0] + bigXs[1]) / 2, bigR, side * (bigZ + bigW / 2 + 0.05)
  );
  rod.rotation.z = 0;
}

/* ---------------------------------------------------------------------------
   Chassis / footplate
--------------------------------------------------------------------------- */
add(roundedBoxGeom(3.65, 0.24, 1.15, 0.06), chassisMat, -0.225, 0.72, 0);

/* ---------------------------------------------------------------------------
   Boiler + smokebox + door + bands
--------------------------------------------------------------------------- */
const boilerR = 0.58, boilerCY = 1.32;
const boiler = add(new THREE.CylinderGeometry(boilerR, boilerR, 2.3, 48, 1), boilerMat, -0.25, boilerCY, 0);
boiler.rotation.z = Math.PI / 2;

// boiler bands
for (const bx of [0.45, -0.05, -0.55, -1.05]) {
  const band = add(new THREE.TorusGeometry(boilerR + 0.006, 0.028, 14, 48), bandMat, bx, boilerCY, 0);
  band.rotation.y = Math.PI / 2;
}

// smokebox (slightly larger front drum)
const smokebox = add(new THREE.CylinderGeometry(0.6, 0.6, 0.22, 48), smokeboxMat, 0.9, boilerCY, 0);
smokebox.rotation.z = Math.PI / 2;

// smokebox door
const door = add(new THREE.CircleGeometry(0.5, 44), doorMat, 1.012, boilerCY, 0);
door.rotation.y = Math.PI / 2;
add(new THREE.SphereGeometry(0.05, 16, 12), metalMat, 1.03, boilerCY, 0);         // door boss
add(new THREE.BoxGeometry(0.02, 0.34, 0.05), metalMat, 1.03, boilerCY, 0);        // door strap

/* ---------------------------------------------------------------------------
   Steam dome, sand dome, whistle
--------------------------------------------------------------------------- */
function dome(x, r, h) {
  add(new THREE.CylinderGeometry(r, r, h, 36), domeMat, x, 1.80 + h / 2, 0);
  add(new THREE.SphereGeometry(r, 36, 20, 0, Math.PI * 2, 0, Math.PI / 2), domeMat, x, 1.80 + h, 0);
  const b = add(new THREE.TorusGeometry(r + 0.01, 0.02, 12, 40), bandMat, x, 1.80 + 0.03, 0);
  b.rotation.x = Math.PI / 2;
}
dome(-0.15, 0.24, 0.12);   // steam dome
dome(-0.6, 0.17, 0.10);    // sand dome

// whistle
add(new THREE.CylinderGeometry(0.032, 0.032, 0.16, 18), metalMat, -0.88, 2.0, 0.07);
add(new THREE.SphereGeometry(0.045, 16, 12), metalMat, -0.88, 2.08, 0.07);

/* ---------------------------------------------------------------------------
   Smokestack (chimney) with flared cap
--------------------------------------------------------------------------- */
add(new THREE.CylinderGeometry(0.15, 0.16, 0.36, 36), stackMat, 0.5, 1.98, 0);
add(new THREE.CylinderGeometry(0.24, 0.16, 0.12, 36), stackMat, 0.5, 2.22, 0);   // flare
const stackRim = add(new THREE.TorusGeometry(0.155, 0.022, 12, 36), bandMat, 0.5, 1.83, 0);
stackRim.rotation.x = Math.PI / 2;

/* ---------------------------------------------------------------------------
   Headlamp
--------------------------------------------------------------------------- */
add(new THREE.BoxGeometry(0.14, 0.12, 0.14), domeMat, 0.83, 1.74, 0);            // bracket
const lampBody = add(new THREE.CylinderGeometry(0.13, 0.13, 0.18, 28), domeMat, 0.95, 1.82, 0);
lampBody.rotation.z = Math.PI / 2;
const lens = add(new THREE.CircleGeometry(0.1, 28), lensMat, 1.05, 1.82, 0);
lens.rotation.y = Math.PI / 2;

const lampGlow = new THREE.PointLight(0xffd27a, 0.45, 3.2, 2);
lampGlow.position.set(1.15, 1.82, 0);
train.add(lampGlow);

/* ---------------------------------------------------------------------------
   Cabin + roof + windows
--------------------------------------------------------------------------- */
const cabX = -1.5, cabCY = 1.365;
add(roundedBoxGeom(0.95, 1.05, 1.25, 0.12), cabinMat, cabX, cabCY, 0);
add(roundedBoxGeom(1.04, 0.16, 1.44, 0.05), roofMat, cabX, 1.965, 0);            // roof

// windows
add(new THREE.BoxGeometry(0.44, 0.4, 0.04), windowMat, cabX - 0.02, 1.62, 0.63);   // side +Z
add(new THREE.BoxGeometry(0.44, 0.4, 0.04), windowMat, cabX - 0.02, 1.62, -0.63);  // side -Z
add(new THREE.BoxGeometry(0.05, 0.34, 0.48), windowMat, -1.03, 1.62, 0);           // front (toward boiler)
add(new THREE.BoxGeometry(0.05, 0.34, 0.52), windowMat, -1.97, 1.6, 0);            // rear

/* ---------------------------------------------------------------------------
   Front buffer beam + buffers + couplers
--------------------------------------------------------------------------- */
add(roundedBoxGeom(0.2, 0.55, 1.15, 0.05), beamMat, 1.45, 0.72, 0);

for (const bz of [0.34, -0.34]) {
  const shank = add(new THREE.CylinderGeometry(0.05, 0.05, 0.14, 20), metalMat, 1.6, 0.82, bz);
  shank.rotation.z = Math.PI / 2;
  add(new THREE.CylinderGeometry(0.09, 0.09, 0.05, 24), metalMat, 1.68, 0.82, bz).rotation.z = Math.PI / 2;
}
// couplers
add(roundedBoxGeom(0.16, 0.1, 0.12, 0.03), metalMat, 1.62, 0.6, 0);
add(roundedBoxGeom(0.16, 0.1, 0.12, 0.03), metalMat, -2.06, 0.62, 0);

/* ---------------------------------------------------------------------------
   Center the single object on the ground, then frame it
--------------------------------------------------------------------------- */
scene.add(train);

const box = new THREE.Box3().setFromObject(train);
const center = box.getCenter(new THREE.Vector3());
train.position.x -= center.x;
train.position.z -= center.z;
train.position.y -= box.min.y;

const boxAfter = new THREE.Box3().setFromObject(train);
const targetY = (boxAfter.max.y) * 0.5;
controls.target.set(0, targetY, 0);
key.target.position.set(0, targetY, 0);
scene.add(key.target);
controls.update();

/* ---------------------------------------------------------------------------
   Resize + render loop
--------------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
