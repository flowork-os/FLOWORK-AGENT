<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carved Wood Zither</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #120b08; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x120b08);
scene.fog = new THREE.Fog(0x120b08, 14, 28);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(11, 8.2, 12);
camera.lookAt(0, 0.25, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 9;
controls.maxDistance = 19;
controls.target.set(0, 0.15, 0);

scene.add(new THREE.HemisphereLight(0xffd9a8, 0x1c0e09, 2.0));

const keyLight = new THREE.DirectionalLight(0xffd0a0, 4.2);
keyLight.position.set(-5, 11, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -9;
keyLight.shadow.camera.right = 9;
keyLight.shadow.camera.top = 9;
keyLight.shadow.camera.bottom = -9;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x9b9dff, 1.7);
rimLight.position.set(8, 5, -8);
scene.add(rimLight);

const warmFill = new THREE.PointLight(0xff925c, 1.0, 18);
warmFill.position.set(-2, 2.5, -5);
scene.add(warmFill);

const wood = new THREE.MeshStandardMaterial({
  color: 0x67351f,
  roughness: 0.37,
  metalness: 0.02
});
const woodEdge = new THREE.MeshStandardMaterial({
  color: 0x3b1a11,
  roughness: 0.5
});
const darkWood = new THREE.MeshStandardMaterial({
  color: 0x1d0b08,
  roughness: 0.7
});
const relief = new THREE.MeshStandardMaterial({
  color: 0x9a5930,
  roughness: 0.34
});
const grainMaterial = new THREE.MeshStandardMaterial({
  color: 0x2d120c,
  roughness: 0.62
});
const bone = new THREE.MeshStandardMaterial({
  color: 0xe4c99c,
  roughness: 0.46
});
const metal = new THREE.MeshStandardMaterial({
  color: 0x17110d,
  roughness: 0.23,
  metalness: 0.72
});
const stringMaterial = new THREE.MeshStandardMaterial({
  color: 0xd9b875,
  roughness: 0.3,
  metalness: 0.5
});

const zither = new THREE.Group();
zither.rotation.y = -0.12;
scene.add(zither);

const bodyShape = new THREE.Shape();
bodyShape.moveTo(-5.2, -1.82);
bodyShape.lineTo(4.9, -1.12);
bodyShape.lineTo(4.9, 1.12);
bodyShape.lineTo(-5.2, 1.82);
bodyShape.lineTo(-5.55, 1.58);
bodyShape.lineTo(-5.72, 0.92);
bodyShape.lineTo(-5.72, -0.92);
bodyShape.lineTo(-5.55, -1.58);
bodyShape.closePath();

const bodyGeometry = new THREE.ExtrudeGeometry(bodyShape, {
  depth: 0.72,
  bevelEnabled: true,
  bevelSegments: 2,
  bevelSize: 0.16,
  bevelThickness: 0.13,
  curveSegments: 8
});
bodyGeometry.rotateX(-Math.PI / 2);
bodyGeometry.translate(0, -0.36, 0);

const body = new THREE.Mesh(bodyGeometry, wood);
body.castShadow = true;
body.receiveShadow = true;
zither.add(body);

function addBox(width, height, depth, x, y, z, material, bevel = 0) {
  const geometry = new THREE.BoxGeometry(width, height, depth);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  zither.add(mesh);
  return mesh;
}

function addTube(points, radius, material, closed = false, tubularSegments = 80) {
  const curve = new THREE.CatmullRomCurve3(points, closed, "catmullrom", 0.5);
  const geometry = new THREE.TubeGeometry(curve, tubularSegments, radius, 7, closed);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  zither.add(mesh);
  return mesh;
}

function widthAt(x) {
  return 1.82 - ((x + 5.2) / 10.1) * 0.70;
}

function addGrain(zOffset, phase, scale) {
  const points = [];
  for (let i = 0; i <= 18; i++) {
    const x = -5.35 + i * 0.57;
    const wobble = Math.sin(i * 0.78 + phase) * 0.055 + Math.sin(i * 1.9 + phase) * 0.025;
    const z = zOffset + wobble + Math.sin((x + phase) * 0.7) * 0.035;
    points.push(new THREE.Vector3(x, 0.405 + Math.sin(i * 0.62 + phase) * 0.006, z));
  }
  addTube(points, 0.012 * scale, grainMaterial, false, 70);
}

for (let i = 0; i < 15; i++) {
  const zPosition = -1.42 + i * 0.205;
  addGrain(zPosition, i * 0.8, i % 3 === 0 ? 1.35 : 1);
}

const topRailLeft = [];
const topRailRight = [];
for (let i = 0; i <= 16; i++) {
  const x = -5.05 + i * 0.62;
  const w = widthAt(x);
  topRailLeft.push(new THREE.Vector3(x, 0.445, w - 0.18));
  topRailRight.push(new THREE.Vector3(x, 0.445, -w + 0.18));
}
addTube(topRailLeft, 0.085, woodEdge, false, 80);
addTube(topRailRight, 0.085, woodEdge, false, 80);

function leaf(x, z, angle, side) {
  const geometry = new THREE.SphereGeometry(0.14, 10, 6);
  const mesh = new THREE.Mesh(geometry, relief);
  mesh.position.set(x, 0.51, z);
  mesh.scale.set(0.34, 0.11, 0.18);
  mesh.rotation.y = angle;
  mesh.rotation.z = side * 0.18;
  mesh.castShadow = true;
  zither.add(mesh);
}

for (let i = 0; i < 9; i++) {
  const x = -4.55 + i * 1.02;
  const w = widthAt(x) - 0.28;
  const sway = Math.sin(i * 1.55) * 0.13;
  const vineA = [];
  const vineB = [];
  for (let j = 0; j <= 7; j++) {
    const t = j / 7;
    const xx = x - 0.48 + t * 0.96;
    vineA.push(new THREE.Vector3(xx, 0.505, w + Math.sin(t * Math.PI) * 0.19 + sway));
    vineB.push(new THREE.Vector3(xx, 0.505, -w - Math.sin(t * Math.PI) * 0.19 - sway));
  }
  addTube(vineA, 0.038, relief, false, 24);
  addTube(vineB, 0.038, relief, false, 24);
  leaf(x - 0.17, w + 0.17 + sway, -0.48, 1);
  leaf(x + 0.19, w + 0.17 + sway, 0.48, -1);
  leaf(x - 0.17, -w - 0.17 - sway, 0.48, -1);
  leaf(x + 0.19, -w - 0.17 - sway, -0.48, 1);
}

const soundholeX = 0.5;
const soundhole = new THREE.Mesh(
  new THREE.CylinderGeometry(0.82, 0.82, 0.085, 48),
  darkWood
);
soundhole.rotation.x = Math.PI / 2;
soundhole.position.set(soundholeX, 0.43, 0);
soundhole.castShadow = true;
zither.add(soundhole);

const innerRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.86, 0.055, 8, 48),
  relief
);
innerRing.rotation.x = Math.PI / 2;
innerRing.position.set(soundholeX, 0.49, 0);
innerRing.castShadow = true;
zither.add(innerRing);

function rosetteLoop(rotation, phase) {
  const points = [];
  const count = 96;
  for (let i = 0; i < count; i++) {
    const t = (i / count) * Math.PI * 2;
    const a = t + rotation;
    const radiusX = 1.02 + 0.12 * Math.sin(3 * t + phase);
    const radiusZ = 0.88 + 0.10 * Math.sin(3 * t + phase);
    points.push(new THREE.Vector3(
      soundholeX + Math.cos(a) * radiusX,
      0.535,
      Math.sin(a) * radiusZ
    ));
  }
  addTube(points, 0.052, relief, true, 96);
}

rosetteLoop(0, 0);
rosetteLoop(Math.PI / 3, 2.1);
rosetteLoop(-Math.PI / 3, 4.2);

const rosetteCenter = new THREE.Mesh(
  new THREE.CylinderGeometry(0.22, 0.22, 0.07, 24),
  relief
);
rosetteCenter.rotation.x = Math.PI / 2;
rosetteCenter.position.set(soundholeX, 0.54, 0);
rosetteCenter.castShadow = true;
zither.add(rosetteCenter);

for (let i = 0; i < 7; i++) {
  const pinZ = -0.78 + i * 0.26;
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.44, 12), bone);
  pin.position.set(4.78, 0.63, pinZ);
  pin.castShadow = true;
  zither.add(pin);

  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.115, 12, 8), bone);
  cap.scale.set(1.35, 0.62, 0.85);
  cap.position.set(4.78, 0.88, pinZ);
  cap.castShadow = true;
  zither.add(cap);

  const collar = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.018, 6, 16), metal);
  collar.rotation.x = Math.PI / 2;
  collar.position.set(4.78, 0.55, pinZ);
  zither.add(collar);
}

for (let i = 0; i < 7; i++) {
  const pinZ = -0.78 + i * 0.26;
  const string = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 9.15, 6), stringMaterial);
  string.rotation.z = Math.PI / 2;
  string.position.set(0.15, 0.62 + i * 0.003, pinZ);
  string.castShadow = true;
  zither.add(string);
}

for (let i = 0; i < 5; i++) {
  const x = -4.7 + i * 0.32;
  const accent = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.18, 6), relief);
  accent.rotation.z = Math.PI / 2;
  accent.position.set(x, 0.5, widthAt(x) - 0.12);
  zither.add(accent);
}

const baseShadow = new THREE.Mesh(
  new THREE.CircleGeometry(8.5, 64),
  new THREE.MeshBasicMaterial({ color: 0x090504, transparent: true, opacity: 0.38 })
);
baseShadow.rotation.x = -Math.PI / 2;
baseShadow.position.y = -0.73;
baseShadow.scale.set(1.1, 0.48, 1);
scene.add(baseShadow);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0x170d09, roughness: 0.88, metalness: 0 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.77;
floor.receiveShadow = true;
scene.add(floor);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
