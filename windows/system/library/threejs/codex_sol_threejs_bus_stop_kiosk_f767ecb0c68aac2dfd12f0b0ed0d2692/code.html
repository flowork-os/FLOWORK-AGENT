<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass and Metal Bus Stop Kiosk</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #cbd7df;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 22px;
      bottom: 20px;
      padding: 10px 14px;
      color: rgba(255,255,255,.88);
      background: rgba(16,25,31,.66);
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 4px;
      font: 500 12px/1.35 system-ui, sans-serif;
      letter-spacing: .09em;
      text-transform: uppercase;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Metropolitan Transit · Shelter 04</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xc9d6de);
    scene.fog = new THREE.Fog(0xc9d6de, 18, 42);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(7.4, 4.8, 8.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.45, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.45;
    controls.minDistance = 5.5;
    controls.maxDistance = 16;
    controls.maxPolarAngle = Math.PI * 0.48;

    const hemi = new THREE.HemisphereLight(0xeaf6ff, 0x56605a, 2.1);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff1d8, 4.2);
    sun.position.set(-5, 9, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -8;
    sun.shadow.camera.right = 8;
    sun.shadow.camera.top = 8;
    sun.shadow.camera.bottom = -8;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 25;
    sun.shadow.bias = -0.0003;
    scene.add(sun);

    const kiosk = new THREE.Group();
    kiosk.rotation.y = -0.08;
    scene.add(kiosk);

    const metal = new THREE.MeshStandardMaterial({
      color: 0x30383c,
      metalness: 0.82,
      roughness: 0.27
    });
    const darkMetal = new THREE.MeshStandardMaterial({
      color: 0x151b1e,
      metalness: 0.9,
      roughness: 0.2
    });
    const brushedMetal = new THREE.MeshStandardMaterial({
      color: 0x8f999d,
      metalness: 0.88,
      roughness: 0.3
    });
    const roofMaterial = new THREE.MeshStandardMaterial({
      color: 0x434d52,
      metalness: 0.78,
      roughness: 0.3
    });
    const glass = new THREE.MeshPhysicalMaterial({
      color: 0xaed6df,
      metalness: 0,
      roughness: 0.08,
      transmission: 0.67,
      transparent: true,
      opacity: 0.48,
      thickness: 0.035,
      ior: 1.48,
      clearcoat: 0.8,
      clearcoatRoughness: 0.08,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const seatMaterial = new THREE.MeshStandardMaterial({
      color: 0x9a482f,
      metalness: 0.05,
      roughness: 0.48
    });
    const white = new THREE.MeshStandardMaterial({
      color: 0xf2f1e9,
      roughness: 0.72
    });
    const yellow = new THREE.MeshStandardMaterial({
      color: 0xffb51b,
      roughness: 0.42,
      emissive: 0x2c1700,
      emissiveIntensity: 0.12
    });
    const blue = new THREE.MeshStandardMaterial({
      color: 0x145b87,
      roughness: 0.34
    });

    function addBox(name, size, position, material, parent = kiosk, cast = true, receive = true) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material);
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder(name, radius, height, position, material, parent = kiosk, segments = 24) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, segments), material);
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    const width = 4.65;
    const depth = 1.75;
    const floorY = 0.12;
    const topY = 3.12;
    const post = 0.105;
    const rearZ = -0.68;
    const frontZ = 0.82;

    addBox('concrete pad', [5.55, 0.18, 2.65], [0, 0.01, 0.05],
      new THREE.MeshStandardMaterial({ color: 0xb6b5ad, roughness: 0.9, metalness: 0 }));

    const padEdgeMaterial = new THREE.MeshStandardMaterial({ color: 0x777a77, roughness: 0.8 });
    addBox('front curb edge', [5.55, 0.14, 0.09], [0, -0.07, 1.34], padEdgeMaterial);
    addBox('rear curb edge', [5.55, 0.14, 0.09], [0, -0.07, -1.24], padEdgeMaterial);

    const postXs = [-width / 2, 0, width / 2];
    for (const x of postXs) {
      addBox('rear structural post', [post, 2.9, post], [x, 1.56, rearZ], metal);
      addBox('post foot', [0.25, 0.06, 0.25], [x, 0.17, rearZ], darkMetal);
      for (const sx of [-0.075, 0.075]) {
        for (const sz of [-0.075, 0.075]) {
          addCylinder('anchor bolt', 0.012, 0.028, [x + sx, 0.22, rearZ + sz], brushedMetal);
        }
      }
    }

    addBox('left front post', [post, 2.9, post], [-width / 2, 1.56, frontZ], metal);
    addBox('right front post', [post, 2.9, post], [width / 2, 1.56, frontZ], metal);

    addBox('rear lower rail', [width + post, 0.075, 0.075], [0, 0.34, rearZ], darkMetal);
    addBox('rear upper rail', [width + post, 0.08, 0.075], [0, 2.88, rearZ], darkMetal);
    addBox('left lower side rail', [0.075, 0.075, depth], [-width / 2, 0.34, 0.07], darkMetal);
    addBox('left upper side rail', [0.075, 0.08, depth], [-width / 2, 2.88, 0.07], darkMetal);
    addBox('right lower side rail', [0.075, 0.075, depth], [width / 2, 0.34, 0.07], darkMetal);
    addBox('right upper side rail', [0.075, 0.08, depth], [width / 2, 2.88, 0.07], darkMetal);

    addBox('back glass left', [2.17, 2.42, 0.025], [-1.16, 1.61, rearZ], glass, kiosk, false, false);
    addBox('back glass right', [2.17, 2.42, 0.025], [1.16, 1.61, rearZ], glass, kiosk, false, false);
    addBox('left side glass', [0.025, 2.42, 1.37], [-width / 2, 1.61, 0.07], glass, kiosk, false, false);
    addBox('right side glass', [0.025, 2.42, 1.37], [width / 2, 1.61, 0.07], glass, kiosk, false, false);

    const dotMaterial = new THREE.MeshBasicMaterial({
      color: 0xe8f2f3,
      transparent: true,
      opacity: 0.72,
      depthWrite: false
    });
    for (let i = 0; i < 31; i++) {
      const x = -2.15 + i * 0.143;
      addBox('glass safety marking', [0.052, 0.052, 0.012], [x, 1.47, rearZ + 0.022], dotMaterial, kiosk, false, false);
    }

    addBox('roof canopy', [5.15, 0.16, 2.15], [0, topY, 0.16], roofMaterial);
    addBox('roof underside', [4.96, 0.025, 1.96], [0, topY - 0.095, 0.16], darkMetal, kiosk, false);
    addBox('roof front fascia', [5.15, 0.22, 0.08], [0, topY + 0.01, 1.23], darkMetal);
    addBox('roof rear fascia', [5.15, 0.22, 0.08], [0, topY + 0.01, -0.91], darkMetal);

    for (const x of [-1.58, 0, 1.58]) {
      const arm = addBox('cantilever support', [0.07, 0.08, 1.62], [x, 2.91, 0.08], brushedMetal);
      arm.rotation.x = -0.045;
    }

    const bench = new THREE.Group();
    bench.position.set(-0.25, 0, -0.21);
    kiosk.add(bench);

    addBox('bench seat', [3.1, 0.14, 0.52], [0, 0.71, 0], seatMaterial, bench);
    addBox('bench front trim', [3.1, 0.08, 0.08], [0, 0.72, 0.28], darkMetal, bench);
    addBox('bench backrest', [3.1, 0.62, 0.105], [0, 1.13, -0.23], seatMaterial, bench);
    addBox('backrest top trim', [3.1, 0.065, 0.12], [0, 1.46, -0.23], darkMetal, bench);
    for (const x of [-1.25, 0, 1.25]) {
      addBox('seat support', [0.08, 0.59, 0.08], [x, 0.43, -0.03], darkMetal, bench);
      const brace = addBox('seat brace', [0.07, 0.07, 0.5], [x, 0.57, -0.03], darkMetal, bench);
      brace.rotation.x = -0.35;
      addBox('bench foot', [0.25, 0.045, 0.2], [x, 0.16, -0.08], darkMetal, bench);
    }

    const adGroup = new THREE.Group();
    adGroup.position.set(1.68, 1.66, -0.58);
    kiosk.add(adGroup);

    addBox('advert frame', [1.12, 2.13, 0.105], [0, 0, 0], darkMetal, adGroup);
    addBox('advert face', [0.94, 1.92, 0.018], [0, 0, 0.064], white, adGroup, false);
    addBox('advert blue field', [0.79, 0.75, 0.012], [0, 0.39, 0.078], blue, adGroup, false);
    addBox('advert yellow block', [0.79, 0.16, 0.014], [0, -0.14, 0.079], yellow, adGroup, false);
    addBox('advert line 1', [0.62, 0.045, 0.014], [-0.085, -0.43, 0.079], darkMetal, adGroup, false);
    addBox('advert line 2', [0.49, 0.035, 0.014], [-0.15, -0.54, 0.079], brushedMetal, adGroup, false);
    addBox('advert line 3', [0.57, 0.035, 0.014], [-0.11, -0.64, 0.079], brushedMetal, adGroup, false);
    addBox('advert footer', [0.26, 0.15, 0.014], [-0.265, -0.83, 0.079], blue, adGroup, false);

    const routePost = new THREE.Group();
    routePost.position.set(-2.75, 0, -0.15);
    kiosk.add(routePost);
    addBox('route sign pole', [0.095, 2.48, 0.095], [0, 1.34, 0], darkMetal, routePost);
    addBox('route pole foot', [0.25, 0.05, 0.25], [0, 0.16, 0], darkMetal, routePost);
    addBox('route sign enclosure', [0.72, 0.92, 0.105], [0, 2.34, 0], darkMetal, routePost);
    addBox('route sign face', [0.62, 0.81, 0.012], [0, 2.34, 0.059], white, routePost, false);
    addBox('route header', [0.62, 0.21, 0.014], [0, 2.64, 0.067], yellow, routePost, false);
    addBox('route number mark', [0.28, 0.28, 0.014], [0, 2.31, 0.067], blue, routePost, false);
    for (let i = 0; i < 3; i++) {
      addBox('schedule line', [0.44 - i * 0.05, 0.025, 0.014], [-0.05, 2.05 - i * 0.075, 0.067], brushedMetal, routePost, false);
    }

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x727b75,
      roughness: 0.96,
      metalness: 0
    });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.09;
    ground.receiveShadow = true;
    scene.add(ground);

    const sidewalkMaterial = new THREE.MeshStandardMaterial({
      color: 0x9fa39e,
      roughness: 0.94
    });
    const sidewalk = new THREE.Mesh(new THREE.PlaneGeometry(15, 7), sidewalkMaterial);
    sidewalk.rotation.x = -Math.PI / 2;
    sidewalk.position.set(0, -0.075, 0);
    sidewalk.receiveShadow = true;
    scene.add(sidewalk);

    const seamMaterial = new THREE.MeshBasicMaterial({ color: 0x858985 });
    for (let x = -6; x <= 6; x += 2) {
      const seam = new THREE.Mesh(new THREE.PlaneGeometry(0.018, 7), seamMaterial);
      seam.rotation.x = -Math.PI / 2;
      seam.position.set(x, -0.068, 0);
      scene.add(seam);
    }
    for (let z = -2; z <= 2; z += 2) {
      const seam = new THREE.Mesh(new THREE.PlaneGeometry(15, 0.018), seamMaterial);
      seam.rotation.x = -Math.PI / 2;
      seam.position.set(0, -0.067, z);
      scene.add(seam);
    }

    const tactile = new THREE.Group();
    tactile.position.set(0, 0, 1.7);
    scene.add(tactile);
    addBox('tactile strip', [5.8, 0.025, 0.52], [0, -0.045, 0], yellow, tactile, false);
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 28; col++) {
        const stud = new THREE.Mesh(
          new THREE.CylinderGeometry(0.035, 0.045, 0.018, 12),
          yellow
        );
        stud.position.set(-2.7 + col * 0.2, -0.023, -0.17 + row * 0.17);
        stud.castShadow = false;
        tactile.add(stud);
      }
    }

    const road = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 10),
      new THREE.MeshStandardMaterial({ color: 0x303535, roughness: 0.98 })
    );
    road.rotation.x = -Math.PI / 2;
    road.position.set(0, -0.07, 8);
    road.receiveShadow = true;
    scene.add(road);

    const lineMaterial = new THREE.MeshBasicMaterial({ color: 0xe4dca4 });
    for (let x = -25; x <= 25; x += 5) {
      const roadLine = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 0.08), lineMaterial);
      roadLine.rotation.x = -Math.PI / 2;
      roadLine.position.set(x, -0.058, 6.6);
      scene.add(roadLine);
    }

    function addTree(x, z, scale) {
      const tree = new THREE.Group();
      tree.position.set(x, -0.06, z);
      scene.add(tree);
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.11 * scale, 0.16 * scale, 1.75 * scale, 10),
        new THREE.MeshStandardMaterial({ color: 0x554133, roughness: 1 })
      );
      trunk.position.y = 0.88 * scale;
      trunk.castShadow = true;
      tree.add(trunk);
      const crownMaterial = new THREE.MeshStandardMaterial({
        color: 0x526f58,
        roughness: 0.92
      });
      const crown = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.82 * scale, 2),
        crownMaterial
      );
      crown.scale.set(0.85, 1.25, 0.85);
      crown.position.y = 2.15 * scale;
      crown.castShadow = true;
      tree.add(crown);
    }

    addTree(-7.2, -3.7, 1.15);
    addTree(6.6, -4.6, 1.3);
    addTree(-9.5, 3.2, 0.95);

    const trash = new THREE.Group();
    trash.position.set(3.25, 0, -0.2);
    kiosk.add(trash);
    addCylinder('trash bin', 0.28, 0.72, [0, 0.49, 0], darkMetal, trash, 32);
    addCylinder('trash rim', 0.3, 0.065, [0, 0.87, 0], brushedMetal, trash, 32);
    const opening = new THREE.Mesh(
      new THREE.CylinderGeometry(0.19, 0.19, 0.012, 32),
      new THREE.MeshStandardMaterial({ color: 0x050607, roughness: 0.7 })
    );
    opening.position.set(0, 0.905, 0);
    trash.add(opening);

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
