<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carved Wood Hornbill</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #17110d;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17110d);
scene.fog = new THREE.FogExp2(0x17110d, 0.028);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.7, 5.6, 10.5);
camera.lookAt(0.25, 3.0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.25, 2.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.72;
controls.minDistance = 7;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.78;

const hemi = new THREE.HemisphereLight(0xffe0ae, 0x281912, 2.25);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffd39a, 5.2);
key.position.set(5, 9, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 9;
key.shadow.camera.bottom = -3;
key.shadow.camera.near = 1;
key.shadow.camera.far = 25;
key.shadow.bias = -0.0004;
scene.add(key);

const rim = new THREE.DirectionalLight(0xb87948, 2.3);
rim.position.set(-7, 5, -5);
scene.add(rim);

const fill = new THREE.PointLight(0xffc173, 1.4, 15);
fill.position.set(4, 3, -5);
scene.add(fill);

const mahogany = new THREE.MeshPhysicalMaterial({
  color: 0x743315,
  roughness: 0.43,
  metalness: 0,
  clearcoat: 0.25,
  clearcoatRoughness: 0.62,
  sheen: 0.35,
  sheenColor: new THREE.Color(0xc06a2e)
});

const mahoganyDark = new THREE.MeshStandardMaterial({
  color: 0x35160c,
  roughness: 0.62
});

const mahoganyMid = new THREE.MeshPhysicalMaterial({
  color: 0x8d431d,
  roughness: 0.48,
  clearcoat: 0.18,
  clearcoatRoughness: 0.65
});

const maple = new THREE.MeshPhysicalMaterial({
  color: 0xe5b969,
  roughness: 0.16,
  clearcoat: 0.8,
  clearcoatRoughness: 0.17,
  sheen: 0.35,
  sheenColor: new THREE.Color(0xffd99b)
});

const mapleLight = new THREE.MeshPhysicalMaterial({
  color: 0xf1cf87,
  roughness: 0.2,
  clearcoat: 0.72,
  clearcoatRoughness: 0.2
});

const eyeMat = new THREE.MeshPhysicalMaterial({
  color: 0x130a06,
  roughness: 0.12,
  clearcoat: 0.9
});

const bird = new THREE.Group();
bird.rotation.y = -0.08;
scene.add(bird);

function mesh(geometry, material, position, scale, rotation = [0, 0, 0]) {
  const m = new THREE.Mesh(geometry, material);
  m.position.set(...position);
  m.scale.set(...scale);
  m.rotation.set(...rotation);
  m.castShadow = true;
  m.receiveShadow = true;
  bird.add(m);
  return m;
}

function facetedEllipsoid(position, scale, material = mahogany, detail = 2) {
  const g = new THREE.IcosahedronGeometry(1, detail);
  g.computeVertexNormals();
  return mesh(g, material, position, scale);
}

function taperedTube(curve, radii, radialSegments, tubularSegments, material, flatten = 1) {
  const frames = curve.computeFrenetFrames(tubularSegments, false);
  const positions = [];
  const indices = [];
  const uvs = [];

  for (let i = 0; i <= tubularSegments; i++) {
    const t = i / tubularSegments;
    const p = curve.getPointAt(t);
    const r = radii(t);
    const normal = frames.normals[i];
    const binormal = frames.binormals[i];

    for (let j = 0; j < radialSegments; j++) {
      const a = j / radialSegments * Math.PI * 2;
      const cx = Math.cos(a) * r;
      const cy = Math.sin(a) * r * flatten;
      positions.push(
        p.x + normal.x * cx + binormal.x * cy,
        p.y + normal.y * cx + binormal.y * cy,
        p.z + normal.z * cx + binormal.z * cy
      );
      uvs.push(t, j / radialSegments);
    }
  }

  for (let i = 0; i < tubularSegments; i++) {
    for (let j = 0; j < radialSegments; j++) {
      const a = i * radialSegments + j;
      const b = i * radialSegments + (j + 1) % radialSegments;
      const c = (i + 1) * radialSegments + (j + 1) % radialSegments;
      const d = (i + 1) * radialSegments + j;
      indices.push(a, b, d, b, c, d);
    }
  }

  const start = positions.length / 3;
  const p0 = curve.getPointAt(0);
  positions.push(p0.x, p0.y, p0.z);
  uvs.push(0, 0.5);
  const end = positions.length / 3;
  const p1 = curve.getPointAt(1);
  positions.push(p1.x, p1.y, p1.z);
  uvs.push(1, 0.5);

  for (let j = 0; j < radialSegments; j++) {
    indices.push(start, (j + 1) % radialSegments, j);
    const a = tubularSegments * radialSegments + j;
    const b = tubularSegments * radialSegments + (j + 1) % radialSegments;
    indices.push(end, a, b);
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(indices);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, material);
  m.castShadow = true;
  m.receiveShadow = true;
  bird.add(m);
  return m;
}

function curveRidge(points, radius, material, segments = 24) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const g = new THREE.TubeGeometry(curve, segments, radius, 6, false);
  const m = new THREE.Mesh(g, material);
  m.castShadow = true;
  bird.add(m);
  return m;
}

const stump = mesh(
  new THREE.CylinderGeometry(0.86, 1.02, 1.42, 11, 4, false),
  mahoganyMid,
  [0, 0.72, 0],
  [1, 1, 1],
  [0, 0.12, 0]
);

const stumpTop = mesh(
  new THREE.CylinderGeometry(0.865, 0.865, 0.06, 11),
  mahoganyDark,
  [0, 1.45, 0],
  [1, 1, 1]
);

for (let i = 0; i < 7; i++) {
  const angle = i * Math.PI * 2 / 7 + 0.25;
  curveRidge([
    [Math.cos(angle) * 0.93, 0.16, Math.sin(angle) * 0.93],
    [Math.cos(angle + 0.08) * 0.91, 0.74, Math.sin(angle + 0.08) * 0.91],
    [Math.cos(angle - 0.05) * 0.82, 1.38, Math.sin(angle - 0.05) * 0.82]
  ], 0.018, mahoganyDark, 12);
}

for (let i = 0; i < 3; i++) {
  const ring = mesh(
    new THREE.TorusGeometry(0.23 + i * 0.18, 0.014, 5, 30),
    mahoganyMid,
    [0, 1.486, 0],
    [1, 1, 1],
    [Math.PI / 2, 0, 0]
  );
  ring.castShadow = false;
}

facetedEllipsoid([-0.15, 3.05, 0], [1.18, 1.64, 0.92], mahogany, 2);
facetedEllipsoid([-0.12, 3.33, 0.1], [0.88, 1.28, 0.79], mahoganyMid, 2);
facetedEllipsoid([0.32, 4.55, 0], [0.92, 0.92, 0.79], mahogany, 2);
facetedEllipsoid([0.88, 4.7, 0], [0.67, 0.64, 0.66], mahoganyMid, 2);

const throat = facetedEllipsoid([0.65, 3.85, 0.04], [0.64, 1.0, 0.7], mahoganyMid, 1);
throat.rotation.z = -0.18;

for (let i = 0; i < 9; i++) {
  const x = -0.55 + (i % 3) * 0.38;
  const y = 2.38 + Math.floor(i / 3) * 0.46;
  const z = 0.82 - Math.abs(x + 0.15) * 0.08;
  const slash = curveRidge([
    [x - 0.17, y + 0.13, z],
    [x, y - 0.02, z + 0.025],
    [x + 0.15, y - 0.16, z]
  ], 0.022, mahoganyDark, 8);
  slash.material = mahoganyDark;
}

const wing = facetedEllipsoid([-0.42, 3.15, 0.76], [0.93, 1.3, 0.25], mahoganyDark, 2);
wing.rotation.z = -0.17;

const wingInset = facetedEllipsoid([-0.38, 3.25, 0.94], [0.78, 1.12, 0.12], mahoganyMid, 2);
wingInset.rotation.z = -0.17;

for (let i = 0; i < 7; i++) {
  const sx = -0.89 + i * 0.14;
  const sy = 3.75 - i * 0.07;
  curveRidge([
    [sx, sy, 1.045],
    [sx + 0.13, sy - 0.46, 1.075],
    [sx + 0.3, sy - 0.94, 1.015]
  ], 0.025, mahoganyDark, 14);
}

for (let i = 0; i < 5; i++) {
  curveRidge([
    [-0.72 + i * 0.2, 3.98 - i * 0.03, 1.01],
    [-0.53 + i * 0.2, 3.69 - i * 0.05, 1.07],
    [-0.31 + i * 0.18, 3.43 - i * 0.07, 1.04]
  ], 0.018, maple, 12);
}

const tailAngles = [-0.16, -0.05, 0.07];
tailAngles.forEach((a, i) => {
  const tail = mesh(
    new THREE.CapsuleGeometry(0.22, 1.72, 5, 8),
    i === 1 ? mahoganyMid : mahogany,
    [-0.75 - i * 0.16, 1.9, (i - 1) * 0.27],
    [1, 1, 0.82],
    [0, 0, 0.34 + a]
  );
  tail.rotation.z = 0.34 + a;
});

for (let i = 0; i < 8; i++) {
  const y = 1.05 + i * 0.23;
  curveRidge([
    [-1.35 + i * 0.025, y + 0.16, 0.36],
    [-1.03 + i * 0.02, y, 0.42],
    [-0.72 + i * 0.015, y - 0.17, 0.38]
  ], 0.025, mahoganyDark, 10);
}

const beakCurve = new THREE.CubicBezierCurve3(
  new THREE.Vector3(1.16, 4.78, 0),
  new THREE.Vector3(2.15, 5.03, 0),
  new THREE.Vector3(3.35, 4.55, 0),
  new THREE.Vector3(3.62, 4.05, 0)
);
taperedTube(
  beakCurve,
  t => 0.48 * Math.pow(1 - t, 0.56) + 0.035,
  20,
  48,
  maple,
  0.7
);

const lowerBillCurve = new THREE.CubicBezierCurve3(
  new THREE.Vector3(1.13, 4.55, 0),
  new THREE.Vector3(2.03, 4.5, 0),
  new THREE.Vector3(3.16, 4.18, 0),
  new THREE.Vector3(3.6, 4.03, 0)
);
taperedTube(
  lowerBillCurve,
  t => 0.24 * Math.pow(1 - t, 0.7) + 0.022,
  18,
  40,
  mapleLight,
  0.66
);

curveRidge([
  [1.28, 4.55, 0.36],
  [2.0, 4.51, 0.3],
  [2.82, 4.29, 0.19],
  [3.51, 4.04, 0.04]
], 0.025, mahoganyDark, 32);

const casqueCurve = new THREE.CubicBezierCurve3(
  new THREE.Vector3(1.08, 5.0, 0),
  new THREE.Vector3(1.55, 5.8, 0),
  new THREE.Vector3(2.4, 5.75, 0),
  new THREE.Vector3(2.72, 4.91, 0)
);
taperedTube(
  casqueCurve,
  t => 0.29 * Math.sin(Math.PI * Math.min(t, 0.98)) + 0.09,
  20,
  42,
  maple,
  0.74
);

curveRidge([
  [1.19, 5.08, 0.25],
  [1.55, 5.48, 0.31],
  [2.13, 5.48, 0.28],
  [2.58, 5.02, 0.18]
], 0.026, mapleLight, 28);

const eyeSocket = mesh(
  new THREE.SphereGeometry(0.185, 20, 14),
  mapleLight,
  [0.93, 4.91, 0.6],
  [1.25, 1, 0.55]
);
const eye = mesh(
  new THREE.SphereGeometry(0.105, 20, 14),
  eyeMat,
  [1.0, 4.93, 0.69],
  [1, 1, 0.55]
);
const glint = mesh(
  new THREE.SphereGeometry(0.025, 10, 8),
  new THREE.MeshBasicMaterial({ color: 0xffefd1 }),
  [1.035, 4.98, 0.745],
  [1, 1, 0.5]
);

const footMaterial = mahoganyDark;
for (const z of [-0.34, 0.34]) {
  const leg = mesh(
    new THREE.CylinderGeometry(0.09, 0.11, 0.52, 7),
    footMaterial,
    [-0.02, 1.62, z],
    [1, 1, 1],
    [0, 0, -0.06]
  );

  for (let i = -1; i <= 1; i++) {
    const toe = curveRidge([
      [-0.04, 1.48, z + i * 0.08],
      [0.18, 1.43, z + i * 0.1],
      [0.42, 1.47, z + i * 0.11]
    ], 0.035, footMaterial, 10);
    toe.castShadow = true;
  }
}

for (let i = 0; i < 6; i++) {
  const angle = -0.55 + i * 0.21;
  curveRidge([
    [-0.7, 2.25 + i * 0.1, -0.68],
    [-0.16, 2.42 + i * 0.08, -0.82],
    [0.4, 2.58 + i * 0.04, -0.63]
  ], 0.019, mahoganyDark, 10);
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(7.5, 64),
  new THREE.MeshStandardMaterial({
    color: 0x21140e,
    roughness: 0.95,
    metalness: 0
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.01;
floor.receiveShadow = true;
scene.add(floor);

const halo = new THREE.Mesh(
  new THREE.CircleGeometry(3.2, 64),
  new THREE.MeshBasicMaterial({
    color: 0x5a2d16,
    transparent: true,
    opacity: 0.13,
    depthWrite: false
  })
);
halo.rotation.x = -Math.PI / 2;
halo.position.y = 0.005;
scene.add(halo);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
