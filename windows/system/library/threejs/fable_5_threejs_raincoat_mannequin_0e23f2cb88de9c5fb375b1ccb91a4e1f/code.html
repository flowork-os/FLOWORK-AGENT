<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raincoat Mannequin</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#dfe3e6}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe3e6);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
camera.position.set(2.7, 1.9, 3.4);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f94, 0.9));
const key = new THREE.DirectionalLight(0xfff2e0, 2.2);
key.position.set(3, 6, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -2.5;
key.shadow.camera.right = key.shadow.camera.top = 2.5;
key.shadow.camera.near = 1; key.shadow.camera.far = 15;
key.shadow.bias = -0.0004;
scene.add(key);
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.5);
fill.position.set(-4, 2.5, -3);
scene.add(fill);

// ---------- Materials ----------
const matBody = new THREE.MeshStandardMaterial({color:0xe9e5de, roughness:0.9});
const matCoat = new THREE.MeshStandardMaterial({color:0xd9a13b, roughness:0.5, side:THREE.DoubleSide});
const matBelt = new THREE.MeshStandardMaterial({color:0x9c7017, roughness:0.55});
const matBoot = new THREE.MeshStandardMaterial({color:0x2e4034, roughness:0.35});
const matBase = new THREE.MeshStandardMaterial({color:0x34363c, roughness:0.5, metalness:0.3});
const matBuckle = new THREE.MeshStandardMaterial({color:0xb8b8bc, roughness:0.3, metalness:0.85});

const mannequin = new THREE.Group();
const add = (geo, mat, x=0, y=0, z=0) => {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  mannequin.add(m);
  return m;
};
const lathe = pts => new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), 48);

// ---------- Display base ----------
add(new THREE.CylinderGeometry(0.85, 0.9, 0.1, 64), matBase, 0, 0.05, 0);
add(new THREE.CylinderGeometry(0.7, 0.72, 0.025, 64), matBuckle, 0, 0.112, 0);

// ---------- Head & neck ----------
const head = add(new THREE.SphereGeometry(0.105, 32, 24), matBody, 0, 1.70, 0);
head.scale.set(1, 1.22, 1.05);
add(new THREE.CylinderGeometry(0.045, 0.052, 0.14, 24), matBody, 0, 1.53, 0);

// ---------- Raincoat (knee-length, flared) ----------
add(lathe([[0.345,0.55],[0.29,0.75],[0.235,0.98],[0.218,1.08],[0.24,1.25],[0.248,1.34],[0.215,1.42],[0.13,1.47],[0.058,1.48]]), matCoat);
// Collar
add(lathe([[0.075,1.44],[0.125,1.47],[0.18,1.54],[0.19,1.585]]), matCoat);
// Belt + buckle
add(new THREE.CylinderGeometry(0.235, 0.235, 0.07, 48), matBelt, 0, 1.04, 0);
add(new THREE.BoxGeometry(0.095, 0.085, 0.02), matBuckle, 0, 1.04, 0.23);

// ---------- Arms (sleeved) + hands ----------
for (const s of [-1, 1]) {
  const arm = new THREE.Group();
  arm.position.set(s * 0.235, 1.40, 0);
  arm.rotation.z = -s * 0.17;
  const sleeve = new THREE.Mesh(new THREE.CapsuleGeometry(0.062, 0.44, 8, 20), matCoat);
  sleeve.position.y = -0.27;
  const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.068, 0.068, 0.05, 24), matBelt);
  cuff.position.y = -0.48;
  const hand = new THREE.Mesh(new THREE.SphereGeometry(0.055, 24, 18), matBody);
  hand.position.y = -0.58;
  hand.scale.set(0.8, 1.3, 0.9);
  arm.add(sleeve, cuff, hand);
  mannequin.add(arm);
}

// ---------- Rain boots ----------
for (const s of [-1, 1]) {
  add(new THREE.CylinderGeometry(0.074, 0.082, 0.42, 24), matBoot, s * 0.105, 0.32, 0);
  const foot = add(new THREE.CapsuleGeometry(0.08, 0.14, 8, 20), matBoot, s * 0.105, 0.18, 0.085);
  foot.rotation.x = Math.PI / 2;
  add(new THREE.CylinderGeometry(0.086, 0.088, 0.045, 24), matBoot, s * 0.105, 0.125, 0);
}

mannequin.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
scene.add(mannequin);

// ---------- Soft ground shadow ----------
const ground = new THREE.Mesh(new THREE.CircleGeometry(7, 64), new THREE.ShadowMaterial({opacity:0.28}));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 1.5;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI / 2 + 0.05;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
