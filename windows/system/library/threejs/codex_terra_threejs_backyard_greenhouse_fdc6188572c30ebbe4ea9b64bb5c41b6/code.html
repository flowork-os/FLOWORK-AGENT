<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backyard Greenhouse</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#b8d3e4}
  canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8d3e4);
scene.fog = new THREE.Fog(0xb8d3e4, 18, 43);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.8, 5.8, 9.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.42;
controls.minDistance = 6;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI * 0.48;

scene.add(new THREE.HemisphereLight(0xd9efff, 0x59613c, 2.4));
const sun = new THREE.DirectionalLight(0xfff2d2, 4.2);
sun.position.set(-7, 11, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -10;
sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10;
sun.shadow.camera.bottom = -10;
sun.shadow.bias = -0.0002;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(70, 70),
  new THREE.MeshStandardMaterial({ color: 0x607d4d, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const greenhouse = new THREE.Group();
greenhouse.position.y = 0.1;
scene.add(greenhouse);

const W = 4.4, D = 5.5, eave = 2.65, ridge = 4.25, roofRun = Math.sqrt((W / 2) ** 2 + (ridge - eave) ** 2);
const frameMat = new THREE.MeshStandardMaterial({ color: 0x9ba8a8, metalness: 0.83, roughness: 0.27 });
const darkFrameMat = new THREE.MeshStandardMaterial({ color: 0x566364, metalness: 0.8, roughness: 0.3 });
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xa9d8d2, transparent: true, opacity: 0.32, roughness: 0.12,
  metalness: 0.05, transmission: 0.12, side: THREE.DoubleSide, depthWrite: false
});
const roofGlassMat = glassMat.clone();
roofGlassMat.opacity = 0.27;

function beamBetween(a, b, radius = 0.055, material = frameMat) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, direction.length(), 10), material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  greenhouse.add(mesh);
  return mesh;
}
function box(w, h, d, material, x, y, z, group = greenhouse) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  group.add(m);
  return m;
}
function glassPanel(w, h, center, rotationY = 0) {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), glassMat);
  p.position.copy(center);
  p.rotation.y = rotationY;
  greenhouse.add(p);
}
function roofPanel(a, b, c, d, material = roofGlassMat) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([
    a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z,
    a.x,a.y,a.z,c.x,c.y,c.z,d.x,d.y,d.z
  ], 3));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, material);
  greenhouse.add(m);
}

const corners = [
  new THREE.Vector3(-W/2,0,-D/2), new THREE.Vector3(W/2,0,-D/2),
  new THREE.Vector3(-W/2,0,D/2), new THREE.Vector3(W/2,0,D/2)
];
for (const p of corners) beamBetween(p, p.clone().setY(eave), 0.065);
beamBetween(corners[0].clone().setY(eave), corners[1].clone().setY(eave), 0.065);
beamBetween(corners[2].clone().setY(eave), corners[3].clone().setY(eave), 0.065);
beamBetween(corners[0].clone().setY(eave), corners[2].clone().setY(eave), 0.065);
beamBetween(corners[1].clone().setY(eave), corners[3].clone().setY(eave), 0.065);

const ridgeA = new THREE.Vector3(0,ridge,-D/2), ridgeB = new THREE.Vector3(0,ridge,D/2);
beamBetween(ridgeA, ridgeB, 0.065);
for (const z of [-D/2, D/2]) {
  beamBetween(new THREE.Vector3(-W/2,eave,z), new THREE.Vector3(0,ridge,z), 0.065);
  beamBetween(new THREE.Vector3(W/2,eave,z), new THREE.Vector3(0,ridge,z), 0.065);
}

const bayZ = [-D/2, -D/6, D/6, D/2];
for (const z of bayZ) {
  if (z !== -D/2 && z !== D/2) {
    beamBetween(new THREE.Vector3(-W/2,0,z), new THREE.Vector3(-W/2,eave,z), 0.045);
    beamBetween(new THREE.Vector3(W/2,0,z), new THREE.Vector3(W/2,eave,z), 0.045);
    beamBetween(new THREE.Vector3(0,ridge,z), new THREE.Vector3(-W/2,eave,z), 0.045);
    beamBetween(new THREE.Vector3(0,ridge,z), new THREE.Vector3(W/2,eave,z), 0.045);
  }
}
for (const x of [-W/2, 0, W/2]) {
  beamBetween(new THREE.Vector3(x,0,-D/2), new THREE.Vector3(x,eave,-D/2), 0.045);
  beamBetween(new THREE.Vector3(x,eave,-D/2), new THREE.Vector3(0,ridge,-D/2), 0.045);
}

for (let i=0;i<3;i++) {
  const z = -D/2 + D/6 + i * D/3;
  glassPanel(D/3 - 0.08, eave - 0.12, new THREE.Vector3(-W/2 - 0.008, eave/2, z), Math.PI/2);
  glassPanel(D/3 - 0.08, eave - 0.12, new THREE.Vector3(W/2 + 0.008, eave/2, z), Math.PI/2);
}
for (let i=0;i<2;i++) {
  const x = -W/4 + i*W/2;
  glassPanel(W/2 - 0.08, eave - 0.12, new THREE.Vector3(x,eave/2,D/2 + 0.008), 0);
}
for (let i=0;i<3;i++) {
  const z0 = -D/2 + i*D/3, z1 = z0 + D/3 - 0.04;
  roofPanel(
    new THREE.Vector3(-W/2,eave,z0), new THREE.Vector3(0,ridge,z0),
    new THREE.Vector3(0,ridge,z1), new THREE.Vector3(-W/2,eave,z1)
  );
  roofPanel(
    new THREE.Vector3(0,ridge,z0), new THREE.Vector3(W/2,eave,z0),
    new THREE.Vector3(W/2,eave,z1), new THREE.Vector3(0,ridge,z1)
  );
}
for (const side of [-1,1]) {
  const x0 = side < 0 ? -W/2 : 0, x1 = side < 0 ? 0 : W/2;
  roofPanel(
    new THREE.Vector3(x0, side < 0 ? eave : ridge, D/2+0.008),
    new THREE.Vector3(x1, side < 0 ? ridge : eave, D/2+0.008),
    new THREE.Vector3(x1, side < 0 ? ridge : eave, D/2+0.008),
    new THREE.Vector3(x0, side < 0 ? eave : ridge, D/2+0.008)
  );
}

const door = new THREE.Group();
door.position.set(0, 0, -D/2 - 0.045);
greenhouse.add(door);
const doorW = 1.35, doorH = 2.35;
const doorGlass = new THREE.Mesh(new THREE.PlaneGeometry(doorW-0.13,doorH-0.13), glassMat);
doorGlass.position.y = doorH/2;
door.add(doorGlass);
function doorBeam(x1,y1,x2,y2) {
  const a = new THREE.Vector3(x1,y1,0), b = new THREE.Vector3(x2,y2,0);
  const dir = new THREE.Vector3().subVectors(b,a);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,dir.length(),10), darkFrameMat);
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
  door.add(m);
}
doorBeam(-doorW/2,0,-doorW/2,doorH); doorBeam(doorW/2,0,doorW/2,doorH);
doorBeam(-doorW/2,0,doorW/2,0); doorBeam(-doorW/2,doorH,doorW/2,doorH);
doorBeam(0,0,0,doorH);
const handle = new THREE.Mesh(new THREE.TorusGeometry(.095,.022,8,16,Math.PI), darkFrameMat);
handle.rotation.set(Math.PI/2,0,0);
handle.position.set(doorW*.29,1.2,-.08);
door.add(handle);

const benchMat = new THREE.MeshStandardMaterial({ color: 0x5c3923, roughness: 0.75 });
const soilMat = new THREE.MeshStandardMaterial({ color: 0x2d1c13, roughness: 1 });
for (const x of [-1.2, 1.15]) {
  box(1.42, 0.12, 3.65, benchMat, x, 1.12, .32);
  for (const z of [-1.25, 1.55]) {
    box(.1, 1.05, .1, benchMat, x-.58, .55, z);
    box(.1, 1.05, .1, benchMat, x+.58, .55, z);
  }
  for (let z=-.85; z<1.3; z+=.7) {
    const pot = new THREE.Mesh(new THREE.CylinderGeometry(.18,.14,.28,12), new THREE.MeshStandardMaterial({color:0x9b5634,roughness:.8}));
    pot.position.set(x + (z % 1 > .1 ? .32 : -.28), 1.32, z);
    pot.castShadow = true;
    greenhouse.add(pot);
    const soil = new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.012,12), soilMat);
    soil.position.set(pot.position.x,1.465,z);
    greenhouse.add(soil);
  }
}

const path = new THREE.Mesh(
  new THREE.BoxGeometry(2.05,.08,3.2),
  new THREE.MeshStandardMaterial({color:0x827d6f,roughness:1})
);
path.position.set(0,.01,-4.0);
path.receiveShadow = true;
scene.add(path);

const stones = new THREE.InstancedMesh(
  new THREE.DodecahedronGeometry(.11,0),
  new THREE.MeshStandardMaterial({color:0x7c846f,roughness:1}), 35
);
const dummy = new THREE.Object3D();
for(let i=0;i<35;i++){
  const angle=i*2.399, radius=3.7+(i%5)*.27;
  dummy.position.set(Math.cos(angle)*radius, .06, Math.sin(angle)*radius);
  dummy.scale.setScalar(.45+(i%4)*.18);
  dummy.rotation.set(i,.4*i,.2*i);
  dummy.updateMatrix();
  stones.setMatrixAt(i,dummy.matrix);
}
stones.castShadow = true;
stones.receiveShadow = true;
scene.add(stones);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
