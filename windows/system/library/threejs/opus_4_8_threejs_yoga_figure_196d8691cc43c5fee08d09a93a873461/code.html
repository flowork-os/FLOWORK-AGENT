<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seated Yoga Figure — Procedural three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17181c; }
  #app { position: fixed; inset: 0; }
  .hint {
    position: fixed; left: 16px; bottom: 14px; z-index: 2;
    font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: rgba(220,225,235,0.55); letter-spacing: .3px; user-select: none;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">drag to orbit · scroll to zoom · figure auto-rotates</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ *
 *  Renderer
 * ------------------------------------------------------------------ */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

/* ------------------------------------------------------------------ *
 *  Scene / Camera
 * ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17181c);
scene.fog = new THREE.Fog(0x17181c, 5.5, 13);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(1.45, 0.9, 2.15);

// Soft studio reflections for the standard materials
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ *
 *  Lighting  (Hemisphere ambient + directional key/fill/rim)
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0x9fb8c8, 0x2a2622, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff1e0, 2.3);
key.position.set(2.5, 4.5, 3.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 15;
key.shadow.camera.left = -1.3;
key.shadow.camera.right = 1.3;
key.shadow.camera.top = 1.5;
key.shadow.camera.bottom = -0.4;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0xffe4c8, 0.45);
fill.position.set(-3.0, 1.6, 2.2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xbcd2ff, 1.5);
rim.position.set(-2.2, 2.6, -3.2);
scene.add(rim);

/* ------------------------------------------------------------------ *
 *  Ground plane — receives shadows only
 * ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ *
 *  Materials
 * ------------------------------------------------------------------ */
const skinMat = new THREE.MeshStandardMaterial({
  color: 0xcf9a77, roughness: 0.62, metalness: 0.0, envMapIntensity: 0.55
});
const topMat = new THREE.MeshStandardMaterial({           // fitted top
  color: 0x4a6b78, roughness: 0.82, metalness: 0.0, envMapIntensity: 0.5
});
const bottomMat = new THREE.MeshStandardMaterial({        // leggings
  color: 0x2f333b, roughness: 0.9, metalness: 0.0, envMapIntensity: 0.4
});
const hairMat = new THREE.MeshStandardMaterial({
  color: 0x2a2320, roughness: 0.68, metalness: 0.0, envMapIntensity: 0.5
});

/* ------------------------------------------------------------------ *
 *  The single centered object: the seated yoga figure
 * ------------------------------------------------------------------ */
const figure = new THREE.Group();
scene.add(figure);

const UP = new THREE.Vector3(0, 1, 0);

// Capsule limb spanning point a -> point b
function limb(a, b, r, mat) {
  const A = new THREE.Vector3(a[0], a[1], a[2]);
  const B = new THREE.Vector3(b[0], b[1], b[2]);
  const dir = new THREE.Vector3().subVectors(B, A);
  const len = dir.length();
  const cylLen = Math.max(0.001, len - 1.4 * r);
  const mesh = new THREE.Mesh(new THREE.CapsuleGeometry(r, cylLen, 14, 28), mat);
  mesh.quaternion.setFromUnitVectors(UP, dir.normalize());
  mesh.position.copy(A).add(B).multiplyScalar(0.5);
  mesh.castShadow = true; mesh.receiveShadow = true;
  figure.add(mesh);
  return mesh;
}

// Sphere / joint / soft blob
function ball(pos, r, mat, scale, rot) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 24), mat);
  mesh.position.set(pos[0], pos[1], pos[2]);
  if (scale) mesh.scale.set(scale[0], scale[1], scale[2]);
  if (rot) mesh.rotation.set(rot[0], rot[1], rot[2]);
  mesh.castShadow = true; mesh.receiveShadow = true;
  figure.add(mesh);
  return mesh;
}

/* ---- Torso (fitted top), built as a revolved, tapered profile ---- */
const torsoProfile = [
  [0.001, 0.060], [0.140, 0.100], [0.150, 0.150],
  [0.128, 0.255], [0.132, 0.340], [0.150, 0.440],
  [0.152, 0.520], [0.140, 0.575], [0.110, 0.605],
  [0.088, 0.618], [0.001, 0.622]
].map(p => new THREE.Vector2(p[0], p[1]));

const torso = new THREE.Mesh(new THREE.LatheGeometry(torsoProfile, 64), topMat);
torso.scale.set(1.06, 1.0, 0.72);      // wider side-to-side, shallower front-to-back
torso.castShadow = true; torso.receiveShadow = true;
figure.add(torso);

// Pelvis / seat mass that grounds the pose
ball([0, 0.12, 0.03], 0.15, bottomMat, [1.18, 0.74, 1.02]);

/* ---- Neck + Head ---- */
limb([0, 0.575, 0.0], [0, 0.72, 0.006], 0.05, skinMat);   // neck
const head = ball([0, 0.80, 0.012], 0.095, skinMat, [0.95, 1.12, 1.0]); // head
ball([0, 0.795, 0.09], 0.02, skinMat, [1.0, 1.0, 1.1]);   // nose
ball([0.086, 0.80, 0.006], 0.02, skinMat, [0.7, 1.0, 1.0]); // ears
ball([-0.086, 0.80, 0.006], 0.02, skinMat, [0.7, 1.0, 1.0]);

// Hair cap (crown) + tied bun at the back
const hairCap = new THREE.Mesh(
  new THREE.SphereGeometry(0.102, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.62),
  hairMat
);
hairCap.position.set(0, 0.80, 0.0);
hairCap.scale.set(0.98, 1.12, 1.02);
hairCap.castShadow = true; hairCap.receiveShadow = true;
figure.add(hairCap);
ball([0, 0.845, -0.088], 0.045, hairMat, [1.0, 1.0, 0.9]); // bun

/* ---- Arms, hands, legs, feet (mirrored left/right) ---- */
for (const s of [1, -1]) {
  // Shoulder joint
  ball([0.185 * s, 0.575, 0.0], 0.06, topMat);

  // Upper arm (short sleeve = top color), forearm (skin)
  const shoulder = [0.185 * s, 0.575, 0.0];
  const elbow    = [0.250 * s, 0.350, 0.060];
  const hand     = [0.285 * s, 0.150, 0.215];
  limb(shoulder, elbow, 0.052, topMat);
  ball(elbow, 0.046, skinMat);
  limb(elbow, hand, 0.044, skinMat);

  // Hand resting palm-down on the knee
  ball([0.285 * s, 0.150, 0.220], 0.058, skinMat, [1.15, 0.5, 1.0]);

  // Leg: thigh (hip -> knee), knee cap, shin (crosses to opposite side)
  const hip   = [0.100 * s, 0.140, 0.060];
  const knee  = [0.285 * s, 0.090, 0.225];
  const ankle = [-0.055 * s, 0.060, 0.300 + 0.02 * s];
  limb(hip, knee, 0.088, bottomMat);          // thigh
  ball(knee, 0.076, bottomMat);               // knee
  limb(knee, ankle, 0.070, bottomMat);        // shin (folded/crossed)

  // Bare foot tucked near the front-center
  ball(ankle, 0.058, skinMat, [0.95, 0.5, 1.35], [0, -0.5 * s, 0]);
}

// Lift a hair above ground so nothing dips beneath the shadow plane
figure.position.y = 0.006;

/* ------------------------------------------------------------------ *
 *  Controls
 * ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.target.set(0, 0.42, 0);
controls.minDistance = 1.0;
controls.maxDistance = 5.0;
controls.maxPolarAngle = Math.PI * 0.52;
controls.update();

/* ------------------------------------------------------------------ *
 *  Resize + Render loop
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
