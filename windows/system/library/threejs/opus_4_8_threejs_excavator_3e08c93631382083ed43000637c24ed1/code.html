<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Articulated Hydraulic Excavator</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15171b; }
  #app { position: fixed; inset: 0; }
  .hint {
    position: fixed; left: 14px; bottom: 12px; z-index: 10;
    font: 12px/1.4 system-ui, sans-serif; color: #8b93a1;
    letter-spacing: .04em; user-select: none; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">Articulated hydraulic excavator · drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ */
/* Renderer                                                            */
/* ------------------------------------------------------------------ */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

/* ------------------------------------------------------------------ */
/* Scene & camera                                                      */
/* ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171b);
scene.fog = new THREE.Fog(0x15171b, 26, 70);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);

// Studio image-based lighting for believable metals
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ */
/* Lighting: hemi + key + fill + rim                                   */
/* ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0x9db4d0, 0x2a2620, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e6, 2.5);
key.position.set(8, 11, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
const sc = key.shadow.camera;
sc.near = 1; sc.far = 45; sc.left = -9; sc.right = 9; sc.top = 9; sc.bottom = -9;
scene.add(key);
scene.add(key.target);

const fill = new THREE.DirectionalLight(0xbcd2ff, 0.55);
fill.position.set(-9, 5, -3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.25);
rim.position.set(-5, 7, -9);
scene.add(rim);

/* ------------------------------------------------------------------ */
/* Materials                                                           */
/* ------------------------------------------------------------------ */
const matYellow = new THREE.MeshStandardMaterial({ color: 0xf4b41a, metalness: 0.35, roughness: 0.5, envMapIntensity: 0.7 });
const matYellowDark = new THREE.MeshStandardMaterial({ color: 0xd99c10, metalness: 0.35, roughness: 0.55, envMapIntensity: 0.6 });
const matDarkMetal = new THREE.MeshStandardMaterial({ color: 0x2d3138, metalness: 0.85, roughness: 0.42, envMapIntensity: 0.9 });
const matFrame = new THREE.MeshStandardMaterial({ color: 0x33373f, metalness: 0.7, roughness: 0.5, envMapIntensity: 0.8 });
const matRubber = new THREE.MeshStandardMaterial({ color: 0x161719, metalness: 0.1, roughness: 0.92, envMapIntensity: 0.4 });
const matPad = new THREE.MeshStandardMaterial({ color: 0x202226, metalness: 0.5, roughness: 0.8, envMapIntensity: 0.5 });
const matRod = new THREE.MeshStandardMaterial({ color: 0xccd1d7, metalness: 1.0, roughness: 0.18, envMapIntensity: 1.0 });
const matBarrel = new THREE.MeshStandardMaterial({ color: 0x30343c, metalness: 0.9, roughness: 0.32, envMapIntensity: 1.0 });
const matSteel = new THREE.MeshStandardMaterial({ color: 0x3a3d43, metalness: 0.9, roughness: 0.4, envMapIntensity: 0.9 });
const matTooth = new THREE.MeshStandardMaterial({ color: 0xb9bec6, metalness: 1.0, roughness: 0.3, envMapIntensity: 1.0 });
const matBlack = new THREE.MeshStandardMaterial({ color: 0x121316, metalness: 0.5, roughness: 0.6, envMapIntensity: 0.5 });
const matGlass = new THREE.MeshStandardMaterial({
  color: 0x0e2233, metalness: 0.2, roughness: 0.06, envMapIntensity: 1.2,
  transparent: true, opacity: 0.42, emissive: 0x18324a, emissiveIntensity: 0.35
});

/* ------------------------------------------------------------------ */
/* Helpers                                                             */
/* ------------------------------------------------------------------ */
function mesh(geo, mat, parent, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  m.position.set(x, y, z);
  if (parent) parent.add(m);
  return m;
}
function box(w, h, d, mat, parent, x, y, z) {
  return mesh(new THREE.BoxGeometry(w, h, d), mat, parent, x, y, z);
}
// beam laid along a 2D segment (a->b) in the XY plane, width along Z
function beam(ax, ay, bx, by, h, w, mat, parent, extra = 0) {
  const dx = bx - ax, dy = by - ay;
  const len = Math.hypot(dx, dy) + extra;
  const m = mesh(new THREE.BoxGeometry(len, h, w), mat, parent, (ax + bx) / 2, (ay + by) / 2, 0);
  m.rotation.z = Math.atan2(dy, dx);
  return m;
}
function pinAt(parent, radius, length, mat) {
  const g = new THREE.CylinderGeometry(radius, radius, length, 20);
  const m = mesh(g, mat, parent);
  m.rotation.x = Math.PI / 2; // axis along Z
  return m;
}
const worldPos = (obj) => obj.getWorldPosition(new THREE.Vector3());

// solid cylinder between two world points
function cylBetween(p1, p2, r1, r2, mat, seg = 18) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  if (len < 1e-4) return null;
  const geo = new THREE.CylinderGeometry(r1, r2, len, seg);
  geo.translate(0, len / 2, 0);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  m.position.copy(p1);
  return m;
}
// hydraulic ram: dark barrel + chrome rod between base(p1) and rod-end(p2)
function hydraulic(p1, p2, barrelR, rodR) {
  const g = new THREE.Group();
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const L = dir.length();
  if (L < 1e-4) return g;
  const u = dir.clone().normalize();
  const barrelEnd = p1.clone().add(u.clone().multiplyScalar(L * 0.6));
  const rodStart = p1.clone().add(u.clone().multiplyScalar(L * 0.32));
  g.add(cylBetween(p1, barrelEnd, barrelR, barrelR, matBarrel));
  g.add(cylBetween(rodStart, p2, rodR, rodR, matRod));
  // clevis eyes
  const e1 = cylBetween(
    p1.clone().add(u.clone().multiplyScalar(-0.02)),
    p1.clone().add(u.clone().multiplyScalar(0.05)), barrelR * 1.15, barrelR * 1.15, matDarkMetal);
  const e2 = cylBetween(
    p2.clone().add(u.clone().multiplyScalar(-0.05)),
    p2.clone().add(u.clone().multiplyScalar(0.04)), rodR * 1.6, rodR * 1.6, matDarkMetal);
  if (e1) g.add(e1);
  if (e2) g.add(e2);
  return g;
}

/* ------------------------------------------------------------------ */
/* Excavator root                                                      */
/* ------------------------------------------------------------------ */
const excavator = new THREE.Group();
scene.add(excavator);

/* ---- dimensions (metres) ---- */
const TRK_STRAIGHT = 3.0;   // straight length of track belt
const TRK_R = 0.44;         // idler/sprocket radius
const TRK_W = 0.6;          // track width
const PAD_T = 0.06;         // grouser thickness
const GAUGE = 1.9;          // centre-to-centre of tracks
const TRK_Y = TRK_R + PAD_T; // lifts belt so grousers touch y=0

/* ---- one track ---- */
function stadiumShape(len, r) {
  const half = len / 2;
  const s = new THREE.Shape();
  s.moveTo(-half, r);
  s.lineTo(half, r);
  s.absarc(half, 0, r, Math.PI / 2, -Math.PI / 2, true);
  s.lineTo(-half, -r);
  s.absarc(-half, 0, r, Math.PI * 1.5, Math.PI / 2, true);
  return s;
}
function stadiumSample(len, r, s, total) {
  const half = len / 2, straight = len, semi = Math.PI * r;
  s = ((s % total) + total) % total;
  if (s < straight) return { x: -half + s, y: r, nx: 0, ny: 1, t: 0 };
  s -= straight;
  if (s < semi) { const a = Math.PI / 2 - (s / semi) * Math.PI; return { x: half + r * Math.cos(a), y: r * Math.sin(a), nx: Math.cos(a), ny: Math.sin(a), t: a - Math.PI / 2 }; }
  s -= semi;
  if (s < straight) return { x: half - s, y: -r, nx: 0, ny: -1, t: Math.PI };
  s -= straight;
  const a = -Math.PI / 2 - (s / semi) * Math.PI;
  return { x: -half + r * Math.cos(a), y: r * Math.sin(a), nx: Math.cos(a), ny: Math.sin(a), t: a - Math.PI / 2 };
}
function buildTrack() {
  const g = new THREE.Group();
  // rubber belt (extruded stadium)
  const beltGeo = new THREE.ExtrudeGeometry(stadiumShape(TRK_STRAIGHT, TRK_R), { depth: TRK_W, bevelEnabled: false });
  beltGeo.translate(0, 0, -TRK_W / 2);
  mesh(beltGeo, matRubber, g);

  // grouser pads around the perimeter
  const total = 2 * TRK_STRAIGHT + 2 * Math.PI * TRK_R;
  const pitch = 0.24;
  const n = Math.round(total / pitch);
  const padGeo = new THREE.BoxGeometry(0.17, PAD_T, TRK_W * 1.08);
  for (let i = 0; i < n; i++) {
    const p = stadiumSample(TRK_STRAIGHT, TRK_R, i * (total / n), total);
    const m = mesh(padGeo, matPad, g, p.x + p.nx * (PAD_T / 2), p.y + p.ny * (PAD_T / 2), 0);
    m.rotation.z = p.t;
  }
  // side sprocket/idler hubs on both faces
  const half = TRK_STRAIGHT / 2;
  for (const ex of [-half, half]) {
    for (const zf of [-1, 1]) {
      const hub = mesh(new THREE.CylinderGeometry(TRK_R * 0.55, TRK_R * 0.55, 0.05, 24), matDarkMetal, g, ex, 0, zf * (TRK_W / 2 + 0.005));
      hub.rotation.x = Math.PI / 2;
      const cap = mesh(new THREE.CylinderGeometry(TRK_R * 0.2, TRK_R * 0.2, 0.09, 16), matFrame, g, ex, 0, zf * (TRK_W / 2 + 0.02));
      cap.rotation.x = Math.PI / 2;
    }
  }
  // bottom rollers (visible along the belt line)
  for (const rx of [-1.0, -0.33, 0.33, 1.0]) {
    for (const zf of [-1, 1]) {
      const rl = mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.05, 18), matFrame, g, rx, -TRK_R + 0.16, zf * (TRK_W / 2 + 0.006));
      rl.rotation.x = Math.PI / 2;
    }
  }
  return g;
}
const trackL = buildTrack(); trackL.position.set(0, TRK_Y, GAUGE / 2); excavator.add(trackL);
const trackR = buildTrack(); trackR.position.set(0, TRK_Y, -GAUGE / 2); excavator.add(trackR);

/* ---- undercarriage frame + slew ring ---- */
box(2.9, 0.44, GAUGE + 0.15, matFrame, excavator, 0, 0.55, 0);           // centre car-body
box(3.1, 0.18, 0.28, matDarkMetal, excavator, 0, 0.78, GAUGE / 2);        // track frame beams
box(3.1, 0.18, 0.28, matDarkMetal, excavator, 0, 0.78, -GAUGE / 2);
const slewRing = mesh(new THREE.CylinderGeometry(1.12, 1.2, 0.2, 48), matDarkMetal, excavator, 0, 0.9, 0);
for (let i = 0; i < 28; i++) {                                            // bolt ring
  const a = (i / 28) * Math.PI * 2;
  mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.06, 8), matFrame, excavator, Math.cos(a) * 1.0, 1.0, Math.sin(a) * 1.0);
}

/* ------------------------------------------------------------------ */
/* Rotating superstructure (house)                                     */
/* ------------------------------------------------------------------ */
const slew = new THREE.Group();
slew.position.y = 1.0;   // sits on the slew ring
excavator.add(slew);

// rotating deck
const deck = mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.14, 48), matDarkMetal, slew, 0, 0.02, 0);

// main body / engine housing
box(2.4, 0.85, 2.42, matYellow, slew, -0.1, 0.52, 0);
// hood top detail (louvres)
for (let i = 0; i < 5; i++) box(0.05, 0.02, 1.6, matBlack, slew, -0.75 + i * 0.18, 0.955, -0.35);
// exhaust stack
const exhaust = mesh(new THREE.CylinderGeometry(0.07, 0.08, 0.55, 16), matDarkMetal, slew, 0.55, 1.2, -0.85);
mesh(new THREE.CylinderGeometry(0.09, 0.07, 0.08, 16), matDarkMetal, slew, 0.55, 1.48, -0.85);

// counterweight (rear)
box(1.0, 1.32, 2.5, matYellowDark, slew, -1.75, 0.55, 0);
for (const zr of [-0.7, 0, 0.7]) box(0.06, 1.0, 0.14, matFrame, slew, -2.26, 0.55, zr); // rear ribs
box(0.9, 0.16, 2.2, matDarkMetal, slew, -1.75, -0.02, 0);  // weight base lip

// operator cab (front-left)
const cab = new THREE.Group(); slew.add(cab);
box(1.0, 0.95, 1.15, matYellow, cab, 0.55, 1.42, 0.72);        // cab shell
// window glazing
box(0.03, 0.66, 0.92, matGlass, cab, 1.06, 1.5, 0.72);         // windshield
box(0.9, 0.6, 0.03, matGlass, cab, 0.55, 1.5, 1.305);          // side glass
box(0.9, 0.5, 0.03, matGlass, cab, 0.5, 1.5, 0.135);           // inner glass
box(1.02, 0.06, 1.17, matYellowDark, cab, 0.55, 1.905, 0.72);  // roof cap
// grab rail on cab
const rail = mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.85, 10), matBlack, cab, 1.08, 1.15, 0.2);

// headlights
mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.06, 16), matTooth, slew, 1.06, 0.75, 0.55).rotation.z = Math.PI / 2;

// boom mounting ears
const boomPivotPos = new THREE.Vector3(1.15, 0.55, -0.15); // in slew-local space
for (const zf of [0.22, -0.52]) box(0.5, 0.7, 0.08, matYellowDark, slew, 1.12, 0.55, zf);

/* ------------------------------------------------------------------ */
/* Articulated arm: boom -> stick -> bucket                            */
/* ------------------------------------------------------------------ */
const BOOM_ANGLE = 0.42;
const STICK_ANGLE = -1.0;
const BUCKET_ANGLE = -1.25;

// ---- BOOM ----
const boom = new THREE.Group();
boom.position.copy(boomPivotPos);
boom.rotation.z = BOOM_ANGLE;
slew.add(boom);
pinAt(boom, 0.1, TRK_W + 0.2, matDarkMetal); // boom foot pin

// bent boom made of two beams: foot(0,0) -> peak(2.3,1.0) -> tip(4.6,0.2)
beam(0, 0, 2.3, 1.0, 0.55, 0.46, matYellow, boom, 0.15);
beam(2.3, 1.0, 4.6, 0.2, 0.5, 0.44, matYellow, boom, 0.15);
box(0.5, 0.5, 0.5, matYellowDark, boom, 2.3, 1.0, 0);       // knuckle at peak
pinAt(boom, 0.09, 0.66, matDarkMetal).position.set(4.6, 0.2, 0); // stick pin

// boom empties for cylinders
const eBoomBellyL = new THREE.Object3D(); eBoomBellyL.position.set(1.85, -0.32, 0.4); boom.add(eBoomBellyL);
const eBoomBellyR = new THREE.Object3D(); eBoomBellyR.position.set(1.85, -0.32, -0.4); boom.add(eBoomBellyR);
const eStickCylFoot = new THREE.Object3D(); eStickCylFoot.position.set(2.15, 0.72, 0); boom.add(eStickCylFoot);

// ---- STICK ----
const stick = new THREE.Group();
stick.position.set(4.6, 0.2, 0);
stick.rotation.z = STICK_ANGLE;
boom.add(stick);
beam(0, 0, 2.8, 0, 0.42, 0.4, matYellow, stick, 0.1);
box(0.46, 0.62, 0.44, matYellowDark, stick, 0.1, 0.12, 0);  // stick heel
pinAt(stick, 0.08, 0.6, matDarkMetal).position.set(2.8, 0, 0); // bucket pin

const eStickCylRod = new THREE.Object3D(); eStickCylRod.position.set(0.5, 0.52, 0); stick.add(eStickCylRod);
const eBucketCylFoot = new THREE.Object3D(); eBucketCylFoot.position.set(0.32, 0.46, 0); stick.add(eBucketCylFoot);
const eStickLink = new THREE.Object3D(); eStickLink.position.set(2.5, 0.22, 0); stick.add(eStickLink);

// ---- BUCKET ----
const bucket = new THREE.Group();
bucket.position.set(2.8, 0, 0);
bucket.rotation.z = BUCKET_ANGLE;
stick.add(bucket);

const A = [0, 0], B = [0.05, -0.72], C = [0.8, -0.6], D = [0.85, -0.42];
const BW = 0.9;
// side plates (extruded profile)
const sideShape = new THREE.Shape();
sideShape.moveTo(A[0], A[1]); sideShape.lineTo(B[0], B[1]); sideShape.lineTo(C[0], C[1]); sideShape.lineTo(D[0], D[1]); sideShape.closePath();
const sideGeo = new THREE.ExtrudeGeometry(sideShape, { depth: 0.04, bevelEnabled: false });
mesh(sideGeo, matYellow, bucket, 0, 0, BW / 2 - 0.04);
mesh(sideGeo, matYellow, bucket, 0, 0, -BW / 2);
// scoop skin: back wall + curved bottom
beam(A[0], A[1], B[0], B[1], 0.06, BW, matYellow, bucket);
beam(B[0], B[1], C[0], C[1], 0.06, BW, matYellow, bucket);
beam(C[0], C[1], D[0], D[1], 0.06, BW, matSteel, bucket);   // lip
// mount ears + pin
box(0.24, 0.24, BW + 0.08, matYellowDark, bucket, 0.06, -0.06, 0);
pinAt(bucket, 0.07, BW + 0.14, matDarkMetal);
// teeth along the cutting edge
const toothDir = Math.atan2(C[1] - B[1], C[0] - B[0]);
for (let i = 0; i < 5; i++) {
  const tz = -0.34 + i * 0.17;
  const t = mesh(new THREE.ConeGeometry(0.05, 0.24, 4), matTooth, bucket, 0.9, -0.575, tz);
  t.rotation.z = toothDir - Math.PI / 2;
}
// bucket linkage empties
const eLinkPivot = new THREE.Object3D(); eLinkPivot.position.set(0.12, 0.42, 0); bucket.add(eLinkPivot);
const eBucketLink = new THREE.Object3D(); eBucketLink.position.set(0.05, 0.02, 0); bucket.add(eBucketLink);

// house cylinder base empties
const eBoomBaseL = new THREE.Object3D(); eBoomBaseL.position.set(0.85, 0.18, 0.42); slew.add(eBoomBaseL);
const eBoomBaseR = new THREE.Object3D(); eBoomBaseR.position.set(0.85, 0.18, -0.42); slew.add(eBoomBaseR);

/* ------------------------------------------------------------------ */
/* Hydraulics & linkage (need world positions -> build last)          */
/* ------------------------------------------------------------------ */
excavator.updateMatrixWorld(true);
const hyd = new THREE.Group();
excavator.add(hyd);

// boom lift rams (pair)
hyd.add(hydraulic(worldPos(eBoomBaseL), worldPos(eBoomBellyL), 0.085, 0.05));
hyd.add(hydraulic(worldPos(eBoomBaseR), worldPos(eBoomBellyR), 0.085, 0.05));
// stick ram
hyd.add(hydraulic(worldPos(eStickCylFoot), worldPos(eStickCylRod), 0.09, 0.055));
// bucket ram + 4-bar linkage
hyd.add(hydraulic(worldPos(eBucketCylFoot), worldPos(eLinkPivot), 0.075, 0.045));
hyd.add(cylBetween(worldPos(eLinkPivot), worldPos(eBucketLink), 0.035, 0.035, matSteel));
hyd.add(cylBetween(worldPos(eLinkPivot), worldPos(eStickLink), 0.035, 0.035, matSteel));

/* ------------------------------------------------------------------ */
/* Ground plane (receives shadows only)                                */
/* ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 120),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.001;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ */
/* Frame the object, aim lights & controls                             */
/* ------------------------------------------------------------------ */
excavator.updateMatrixWorld(true);
const bbox = new THREE.Box3().setFromObject(excavator);
const center = bbox.getCenter(new THREE.Vector3());
const size = bbox.getSize(new THREE.Vector3());
const maxDim = Math.max(size.x, size.y, size.z);

camera.position.set(center.x + maxDim * 1.05, center.y + maxDim * 0.62, maxDim * 1.25);

key.position.set(center.x + 8, center.y + 11, center.z + 6);
key.target.position.copy(center);
fill.position.set(center.x - 9, center.y + 5, center.z - 3);
rim.position.set(center.x - 5, center.y + 7, center.z - 9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.minDistance = maxDim * 0.7;
controls.maxDistance = maxDim * 3.2;
controls.maxPolarAngle = Math.PI * 0.49;
controls.target.copy(center);
controls.update();

/* ------------------------------------------------------------------ */
/* Resize + render loop                                                */
/* ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
