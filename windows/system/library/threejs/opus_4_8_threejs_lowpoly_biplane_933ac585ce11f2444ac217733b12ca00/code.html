<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Low-Poly Vintage Biplane</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15171a; }
  #app { position: fixed; inset: 0; }
  .label {
    position: fixed; left: 16px; bottom: 14px;
    font: 13px/1.4 system-ui, sans-serif; color: #cfc7b3;
    letter-spacing: .04em; opacity: .55; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="label">Vintage Biplane — drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------------------------------------------------------- Renderer */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

/* ------------------------------------------------------------------- Scene */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171a);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(7.6, 4.4, 9.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 5.5;
controls.maxDistance = 26;
controls.maxPolarAngle = Math.PI * 0.54;
controls.target.set(0, 1.55, 0);

/* ---------------------------------------------------------------- Lighting */
const hemi = new THREE.HemisphereLight(0x3a4048, 0x0c0d0f, 0.6);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2dd, 3.1);
key.position.set(6.5, 9.5, 5.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 40;
key.shadow.camera.left = -9;
key.shadow.camera.right = 9;
key.shadow.camera.top = 9;
key.shadow.camera.bottom = -9;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fb4c8, 0.85);
fill.position.set(-7, 3.5, 4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9a8, 2.0);
rim.position.set(-4, 5, -8);
scene.add(rim);

/* ----------------------------------------------------------------- Ground */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.ShadowMaterial({ opacity: 0.4 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* -------------------------------------------------------------- Materials */
const matRed = new THREE.MeshStandardMaterial({ color: 0xb01e28, roughness: 0.55, metalness: 0.12, flatShading: true });
const matRedDS = new THREE.MeshStandardMaterial({ color: 0xb01e28, roughness: 0.55, metalness: 0.12, flatShading: true, side: THREE.DoubleSide });
const matCream = new THREE.MeshStandardMaterial({ color: 0xf0e6c8, roughness: 0.62, metalness: 0.05, flatShading: true, side: THREE.DoubleSide });
const matStrut = new THREE.MeshStandardMaterial({ color: 0x9a9ea3, roughness: 0.4, metalness: 0.65, flatShading: true });
const matDark = new THREE.MeshStandardMaterial({ color: 0x23201d, roughness: 0.7, metalness: 0.2, flatShading: true });
const matWood = new THREE.MeshStandardMaterial({ color: 0x6b4423, roughness: 0.55, metalness: 0.1, flatShading: true });
const matHub = new THREE.MeshStandardMaterial({ color: 0xb8bcc0, roughness: 0.35, metalness: 0.8, flatShading: true });
const matTire = new THREE.MeshStandardMaterial({ color: 0x1c1a18, roughness: 0.85, metalness: 0.05, flatShading: true });
const matWire = new THREE.MeshStandardMaterial({ color: 0x3a3d40, roughness: 0.5, metalness: 0.7, flatShading: true });

/* ------------------------------------------------------------------ Plane */
const plane = new THREE.Group();
scene.add(plane);
let propeller;

function add(geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  plane.add(m);
  return m;
}

/* Strut helper: box aligned from point a to point b */
function strut(a, b, w, mat, parent = plane) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, len, w), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* -------- Fuselage (faceted octagonal lathe, nose toward +Z) -------- */
const L = 4.9;
const profile = [
  new THREE.Vector2(0.03, 0.0),
  new THREE.Vector2(0.18, 0.35),
  new THREE.Vector2(0.34, 1.1),
  new THREE.Vector2(0.48, 2.0),
  new THREE.Vector2(0.55, 2.9),
  new THREE.Vector2(0.54, 3.6),
  new THREE.Vector2(0.50, 4.4),
  new THREE.Vector2(0.46, 4.9)
];
const fuseGeo = new THREE.LatheGeometry(profile, 8);
fuseGeo.rotateX(Math.PI / 2);
fuseGeo.translate(0, 0, -L / 2);
add(fuseGeo, matRed);

/* -------- Engine cowling (12-gon radial) -------- */
const cowlGeo = new THREE.CylinderGeometry(0.52, 0.5, 0.5, 12);
cowlGeo.rotateX(Math.PI / 2);
add(cowlGeo, matRed, 0, 0, 2.55);

/* dark backing disc */
const discGeo = new THREE.CylinderGeometry(0.36, 0.36, 0.06, 12);
discGeo.rotateX(Math.PI / 2);
add(discGeo, matDark, 0, 0, 2.79);

/* radial engine cylinders */
for (let i = 0; i < 9; i++) {
  const a = (i / 9) * Math.PI * 2;
  const cg = new THREE.CylinderGeometry(0.06, 0.07, 0.16, 6);
  cg.rotateX(Math.PI / 2);
  add(cg, matStrut, Math.cos(a) * 0.33, Math.sin(a) * 0.33, 2.72);
}

/* -------- Propeller (blocky, spins) -------- */
propeller = new THREE.Group();
propeller.position.set(0, 0, 2.92);
plane.add(propeller);
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.22, 8), matHub);
hub.rotation.x = Math.PI / 2;
hub.castShadow = true; hub.receiveShadow = true;
propeller.add(hub);
const blade = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.85, 0.06), matWood);
blade.castShadow = true; blade.receiveShadow = true;
propeller.add(blade);

/* -------- Wing builder (tapered, angled tips) -------- */
function buildWing(halfSpan, rootHalf, tipHalf, thickness, mat) {
  const inner = halfSpan * 0.82;
  const s = new THREE.Shape();
  s.moveTo(-inner, rootHalf);
  s.lineTo(inner, rootHalf);
  s.lineTo(halfSpan, tipHalf);
  s.lineTo(halfSpan, -tipHalf);
  s.lineTo(inner, -rootHalf);
  s.lineTo(-inner, -rootHalf);
  s.lineTo(-halfSpan, -tipHalf);
  s.lineTo(-halfSpan, tipHalf);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: thickness, bevelEnabled: false });
  g.rotateX(Math.PI / 2);
  g.translate(0, thickness / 2, 0);
  const m = new THREE.Mesh(g, mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

const lowerWingY = -0.35, upperWingY = 1.72;
const lowerWing = buildWing(3.6, 0.62, 0.42, 0.11, matCream);
lowerWing.position.set(0, lowerWingY, 0.1);
plane.add(lowerWing);

const upperWing = buildWing(4.1, 0.66, 0.44, 0.12, matCream);
upperWing.position.set(0, upperWingY, 0.3);
plane.add(upperWing);

/* -------- Struts (interplane + cabane) + bracing wires -------- */
const topL = lowerWingY + 0.06;   // -0.29
const botU = upperWingY - 0.06;   // 1.66
for (const sx of [-1, 1]) {
  const lf = new THREE.Vector3(sx * 2.7, topL, 0.7);
  const lr = new THREE.Vector3(sx * 2.7, topL, -0.4);
  const uf = new THREE.Vector3(sx * 2.75, botU, 0.7);
  const ur = new THREE.Vector3(sx * 2.75, botU, -0.4);
  strut(lf, uf, 0.1, matStrut);
  strut(lr, ur, 0.1, matStrut);
  strut(lf, ur, 0.03, matWire);
  strut(lr, uf, 0.03, matWire);

  // cabane struts (fuselage top -> upper wing centre)
  const ff = new THREE.Vector3(sx * 0.28, 0.5, 0.55);
  const fr = new THREE.Vector3(sx * 0.28, 0.5, -0.05);
  const cf = new THREE.Vector3(sx * 0.5, botU, 0.6);
  const cr = new THREE.Vector3(sx * 0.5, botU, -0.02);
  strut(ff, cf, 0.08, matStrut);
  strut(fr, cr, 0.08, matStrut);
}

/* -------- Tail surfaces -------- */
const stab = buildWing(1.5, 0.72, 0.4, 0.1, matRedDS);
stab.position.set(0, 0.05, -2.05);
plane.add(stab);

/* vertical fin (extruded profile) */
const finShape = new THREE.Shape();
finShape.moveTo(0.55, 0);
finShape.lineTo(0.2, 0.95);
finShape.lineTo(-0.35, 0.9);
finShape.lineTo(-0.55, 0);
finShape.closePath();
const finGeo = new THREE.ExtrudeGeometry(finShape, { depth: 0.08, bevelEnabled: false });
finGeo.rotateY(-Math.PI / 2);
finGeo.translate(0.04, 0, 0);
add(finGeo, matRedDS, 0, 0.12, -2.05);

/* -------- Cockpit -------- */
const cockpit = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.14, 8), matDark);
cockpit.position.set(0, 0.48, 0.8);
cockpit.castShadow = true; cockpit.receiveShadow = true;
plane.add(cockpit);
add(new THREE.BoxGeometry(0.3, 0.2, 0.26), matRed, 0, 0.56, 0.52); // headrest
const wsGeo = new THREE.BoxGeometry(0.4, 0.14, 0.04);
const ws = add(wsGeo, matDark, 0, 0.6, 1.02);                       // windscreen
ws.rotation.x = -0.45;

/* -------- Landing gear + wheels -------- */
for (const sx of [-1, 1]) {
  const top1 = new THREE.Vector3(sx * 0.3, -0.35, 1.55);
  const top2 = new THREE.Vector3(sx * 0.3, -0.35, 0.9);
  const axle = new THREE.Vector3(sx * 0.9, -1.15, 1.25);
  strut(top1, axle, 0.07, matStrut);
  strut(top2, axle, 0.07, matStrut);

  const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.16, 14), matTire);
  wheel.rotation.z = Math.PI / 2;
  wheel.position.set(sx * 0.92, -1.45, 1.25);
  wheel.castShadow = true; wheel.receiveShadow = true;
  plane.add(wheel);

  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.18, 8), matHub);
  cap.rotation.z = Math.PI / 2;
  cap.position.set(sx * 0.92, -1.45, 1.25);
  cap.castShadow = true; cap.receiveShadow = true;
  plane.add(cap);
}
/* tail skid */
strut(new THREE.Vector3(0, -0.15, -2.2), new THREE.Vector3(0, -0.55, -2.55), 0.06, matStrut);

/* -------------------------------------------------- Recenter & seat ground */
const box = new THREE.Box3().setFromObject(plane);
const size = box.getSize(new THREE.Vector3());
const center = box.getCenter(new THREE.Vector3());
plane.position.x -= center.x;
plane.position.z -= center.z;
plane.position.y -= box.min.y;          // rest wheels on ground (y = 0)
controls.target.set(0, size.y * 0.48, 0);

/* ----------------------------------------------------------------- Resize */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ------------------------------------------------------------------- Loop */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  if (propeller) propeller.rotation.z += dt * 7.0;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
