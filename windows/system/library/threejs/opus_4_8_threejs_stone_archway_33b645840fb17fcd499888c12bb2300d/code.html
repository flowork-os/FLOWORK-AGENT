<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stone Archway</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111316; }
  #app { position: fixed; inset: 0; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 system-ui, sans-serif; color: rgba(220,225,230,0.55);
    letter-spacing: .02em; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hint">Stone Archway — drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- helpers ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);

/* Neutral studio gradient background */
function bgTexture() {
  const c = document.createElement('canvas');
  c.width = 8; c.height = 256;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0.0, '#33373d');
  g.addColorStop(0.5, '#22262b');
  g.addColorStop(1.0, '#101215');
  x.fillStyle = g; x.fillRect(0, 0, 8, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* Procedural grayscale stone detail (used for bump + roughness) */
function detailTexture() {
  const s = 512;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const x = c.getContext('2d');
  x.fillStyle = '#808080';
  x.fillRect(0, 0, s, s);
  // coarse mottling
  for (let i = 0; i < 650; i++) {
    const px = Math.random() * s, py = Math.random() * s, r = 8 + Math.random() * 42;
    const v = (90 + Math.random() * 110) | 0;
    x.globalAlpha = 0.05 + Math.random() * 0.10;
    x.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')';
    x.beginPath(); x.arc(px, py, r, 0, Math.PI * 2); x.fill();
  }
  // fine speckle / pitting
  for (let i = 0; i < 11000; i++) {
    const px = Math.random() * s, py = Math.random() * s, r = 0.6 + Math.random() * 1.7;
    const v = (55 + Math.random() * 150) | 0;
    x.globalAlpha = 0.22;
    x.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')';
    x.fillRect(px, py, r, r);
  }
  x.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1.6, 1.6);
  return t;
}

const detail = detailTexture();

function stoneMat(h, s, l) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(h, s, l),
    roughness: 0.97,
    metalness: 0.0,
    bumpMap: detail,
    bumpScale: 0.02,
    roughnessMap: detail
  });
}

/* ---------- scene ---------- */
const app = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = bgTexture();

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.2, 3.2, 6.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.target.set(0, 1.65, 0);
controls.minDistance = 4;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.495;

/* ---------- lighting ---------- */
const hemi = new THREE.HemisphereLight(0xbfd4e6, 0x2b2622, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2df, 2.5);
key.position.set(5, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 30;
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -2;
key.shadow.bias = -0.0003;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
key.target.position.set(0, 1.5, 0);
scene.add(key);
scene.add(key.target);

const fill = new THREE.DirectionalLight(0x9fb4c8, 0.65);
fill.position.set(-5.5, 3, -1.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.15);
rim.position.set(-3.5, 4.5, -6);
scene.add(rim);

/* ---------- ground (shadow catcher only) ---------- */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(16, 64),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- the archway (ONE centered object) ---------- */
const arch = new THREE.Group();
scene.add(arch);

// dimensions (meters)
const D        = 0.60;          // main depth
const rIn      = 0.75;          // intrados radius -> 1.5 m clear opening
const ring     = 0.40;          // voussoir ring thickness
const rOut     = rIn + ring;    // extrados radius = 1.15
const H        = 2.10;          // springing height (top of piers)
const wallHoleR= rOut + 0.025;  // spandrel wall cut-out radius
const topY     = H + wallHoleR + 0.05; // flat top of spandrel wall / coping base
const pierIn   = 0.75;
const pierOut  = 1.20;
const pierCx   = (pierIn + pierOut) / 2; // 0.975
const Wt       = pierOut;        // spandrel half-width
const baseTop  = 0.28;

function addBox(w, h, d, x, y, z, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  arch.add(m);
  return m;
}

/* piers, plinths, imposts (mirrored left/right) */
for (const side of [-1, 1]) {
  const cx = side * pierCx;
  // base plinth (wider)
  addBox(0.66, baseTop, D + 0.12, cx, baseTop / 2, 0, stoneMat(0.09, 0.13, rnd(0.52, 0.58)));
  // pier shaft
  addBox(pierOut - pierIn, (H - 0.12) - baseTop, D, cx, (baseTop + (H - 0.12)) / 2, 0,
         stoneMat(0.09, 0.14, rnd(0.44, 0.54)));
  // impost band at springing (wider ledge)
  addBox(0.62, 0.12, D + 0.08, cx, H - 0.06, 0, stoneMat(0.09, 0.12, rnd(0.54, 0.60)));
}

/* spandrel wall: rectangle with a semicircular arch cut out of the bottom-center */
{
  const sh = new THREE.Shape();
  sh.moveTo(-Wt, H);
  sh.lineTo(-wallHoleR, H);
  sh.absarc(0, H, wallHoleR, Math.PI, 0, true); // upper semicircle
  sh.lineTo(Wt, H);
  sh.lineTo(Wt, topY);
  sh.lineTo(-Wt, topY);
  sh.closePath();

  const geo = new THREE.ExtrudeGeometry(sh, {
    depth: D, bevelEnabled: false, curveSegments: 72, steps: 1
  });
  geo.translate(0, 0, -D / 2);
  const wall = new THREE.Mesh(geo, stoneMat(0.09, 0.12, 0.49));
  wall.castShadow = true; wall.receiveShadow = true;
  arch.add(wall);
}

/* voussoir ring + keystone */
function wedge(a1, a2, ri, ro, depth) {
  const sh = new THREE.Shape();
  sh.moveTo(ri * Math.cos(a1), ri * Math.sin(a1));
  sh.lineTo(ro * Math.cos(a1), ro * Math.sin(a1));
  sh.lineTo(ro * Math.cos(a2), ro * Math.sin(a2));
  sh.lineTo(ri * Math.cos(a2), ri * Math.sin(a2));
  sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, {
    depth: depth, bevelEnabled: true,
    bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 1, steps: 1
  });
  g.translate(0, 0, -depth / 2);
  g.computeVertexNormals();
  return g;
}

{
  const N = 13;                         // total voussoirs (odd -> centered keystone)
  const gap = 0.010;                    // mortar joint (rad)
  const wKey = Math.PI / 9;             // keystone angular width
  const wNorm = (Math.PI - wKey) / (N - 1);
  const half = (N - 1) / 2;

  const spans = [];
  let a = 0;
  for (let i = 0; i < half; i++) { spans.push([a, a + wNorm, false]); a += wNorm; }
  spans.push([a, a + wKey, true]); a += wKey;
  for (let i = 0; i < half; i++) { spans.push([a, a + wNorm, false]); a += wNorm; }

  for (const [s0, s1, isKey] of spans) {
    const a1 = s0 + gap / 2;
    const a2 = s1 - gap / 2;
    let ri, ro, depth, mat;
    if (isKey) {
      ri = rIn - 0.06;        // keystone drops below the intrados
      ro = rOut;
      depth = D + 0.08;       // proud, chunkier
      mat = stoneMat(0.095, 0.14, 0.62);
    } else {
      ri = rIn + rnd(-0.006, 0.006);
      ro = rOut + rnd(-0.008, 0.018);
      depth = D + 0.03;
      mat = stoneMat(0.09, 0.14, rnd(0.44, 0.56));
    }
    const m = new THREE.Mesh(wedge(a1, a2, ri, ro, depth), mat);
    m.position.set(0, H, rnd(-0.006, 0.006));
    m.castShadow = true; m.receiveShadow = true;
    arch.add(m);
  }
}

/* flat coping course (row of coping stones with joints) */
{
  const copHalf = 1.32;
  const copH = 0.22;
  const copD = 0.78;                 // overhangs front/back
  const copBottom = topY;
  const count = 5;
  const joint = 0.02;
  const totalW = copHalf * 2;
  const stoneW = (totalW - joint * (count - 1)) / count;
  for (let i = 0; i < count; i++) {
    const cx = -copHalf + stoneW / 2 + i * (stoneW + joint);
    addBox(stoneW, copH, copD, cx, copBottom + copH / 2, 0,
           stoneMat(0.09, 0.12, rnd(0.55, 0.61)));
  }
}

/* ---------- render loop ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
