<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crocheted Sea Otter</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dce8e6}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdce8e6);
scene.fog = new THREE.Fog(0xdce8e6, 12, 24);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.2, 4.8, 9.6);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.25;
controls.target.set(0, 0.55, 0);

scene.add(new THREE.HemisphereLight(0xf6ffff, 0x78908b, 2.2));

const key = new THREE.DirectionalLight(0xfff3df, 4.1);
key.position.set(-5, 9, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -6;
scene.add(key);

const fill = new THREE.DirectionalLight(0xb4d9e2, 1.8);
fill.position.set(6, 3, -7);
scene.add(fill);

const brown = new THREE.MeshStandardMaterial({color:0x70452f, roughness:.92});
const brownDark = new THREE.MeshStandardMaterial({color:0x4c2a20, roughness:.9});
const yarn = new THREE.MeshStandardMaterial({color:0x82543a, roughness:.96});
const cream = new THREE.MeshStandardMaterial({color:0xe8d3ae, roughness:.9});
const pad = new THREE.MeshStandardMaterial({color:0xe9a58d, roughness:.86});
const black = new THREE.MeshStandardMaterial({color:0x090908, roughness:.18, metalness:.12});
const noseMat = new THREE.MeshStandardMaterial({color:0x261b18, roughness:.3});
const groundMat = new THREE.MeshStandardMaterial({color:0xb8ceca, roughness:1});

const otter = new THREE.Group();
scene.add(otter);

function sphere(name, pos, scale, mat, segments=32) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, segments, segments), mat);
  m.name = name;
  m.position.set(...pos);
  m.scale.set(...scale);
  m.castShadow = true;
  m.receiveShadow = true;
  otter.add(m);
  return m;
}

function torus(pos, scale, rot, mat, major=.17, tube=.052) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(major, tube, 9, 18), mat);
  m.position.set(...pos);
  m.scale.set(...scale);
  m.rotation.set(...rot);
  m.castShadow = true;
  m.receiveShadow = true;
  otter.add(m);
  return m;
}

function capsule(pos, scale, mat, rotation=[0,0,0]) {
  const g = new THREE.Group();
  g.position.set(...pos);
  g.rotation.set(...rotation);
  const mid = new THREE.Mesh(new THREE.CylinderGeometry(1,1,1,24), mat);
  mid.scale.set(scale[0], scale[1], scale[2]);
  mid.castShadow = mid.receiveShadow = true;
  g.add(mid);
  otter.add(g);
  return g;
}

const body = sphere("rounded crocheted body", [0, -.15, 0], [2.38, 2.85, 1.48], brown, 40);
const belly = sphere("soft belly", [0, .05, 1.13], [1.72, 2.12, .42], yarn, 36);

for (let row=0; row<9; row++) {
  const y = -1.35 + row*.34;
  const width = 1.6 * Math.sqrt(Math.max(.12, 1 - Math.pow((y+.05)/2.35,2)));
  const count = Math.max(3, Math.floor(width/.34));
  for (let i=0; i<count; i++) {
    const x = count===1 ? 0 : -width + (2*width*i/(count-1));
    const front = 1.29 + .18 * (1 - (x*x/3.7 + (y*y)/6.0));
    const s = .82 + .08*Math.sin(i*2.4+row);
    torus([x, y, front], [s, 1.08, .72], [0,0,(i%2?-.16:.16)], row%2 ? yarn : brownDark, .155, .047);
  }
}

for (let i=0;i<22;i++) {
  const a = i/22*Math.PI*2;
  const x = Math.cos(a)*1.8;
  const y = -.1 + Math.sin(a)*2.05;
  const z = .18 + Math.cos(a)*.88;
  torus([x,y,z], [.72,.92,.68], [0,0,a*.12], brownDark, .14, .045);
}

const head = new THREE.Group();
head.position.set(.12, 2.28, .05);
head.rotation.z = -.06;
otter.add(head);

const headMesh = new THREE.Mesh(new THREE.SphereGeometry(1,40,32), brown);
headMesh.scale.set(1.7,1.52,1.37);
headMesh.castShadow = headMesh.receiveShadow = true;
head.add(headMesh);

for (let r=0;r<5;r++) {
  const y = -.95 + r*.39;
  const width = 1.25 * Math.sqrt(Math.max(.1, 1 - Math.pow((y+.05)/1.4,2)));
  for (let i=0;i<Math.max(3,Math.floor(width/.37));i++) {
    const n=Math.max(3,Math.floor(width/.37));
    const x=n===1?0:-width+2*width*i/(n-1);
    const z=1.18+.16*(1-(x*x/2.8+y*y/2));
    const loop = new THREE.Mesh(new THREE.TorusGeometry(.14,.045,9,17), r%2?yarn:brownDark);
    loop.position.set(x,y,z);
    loop.scale.set(.92,1.08,.7);
    loop.castShadow=true;
    head.add(loop);
  }
}

function addToHead(mesh) { mesh.castShadow=true; mesh.receiveShadow=true; head.add(mesh); return mesh; }

const earL = new THREE.Mesh(new THREE.SphereGeometry(1,24,18), brownDark);
earL.scale.set(.48,.55,.28); earL.position.set(-1.42,.18,.03); addToHead(earL);
const earR = earL.clone(); earR.position.x=1.42; addToHead(earR);

const muzzleL = new THREE.Mesh(new THREE.SphereGeometry(1,32,24), cream);
muzzleL.scale.set(.82,.58,.43); muzzleL.position.set(-.43,-.2,1.28); addToHead(muzzleL);
const muzzleR = muzzleL.clone(); muzzleR.position.x=.43; addToHead(muzzleR);

const nose = new THREE.Mesh(new THREE.SphereGeometry(1,24,18), noseMat);
nose.scale.set(.34,.23,.25); nose.position.set(0,-.03,1.69); addToHead(nose);

const mouth = new THREE.Mesh(new THREE.TorusGeometry(.19,.026,8,20,Math.PI), noseMat);
mouth.rotation.set(Math.PI/2,0,0);
mouth.position.set(0,-.27,1.61);
addToHead(mouth);

for (const x of [-.62,.62]) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(.22,24,20), black);
  eye.position.set(x,.43,1.18);
  addToHead(eye);
  const glint = new THREE.Mesh(new THREE.SphereGeometry(.055,12,12), new THREE.MeshBasicMaterial({color:0xffffff}));
  glint.position.set(x-.06,.5,1.37);
  addToHead(glint);
}

for (const side of [-1,1]) {
  for (let i=0;i<3;i++) {
    const pts=[new THREE.Vector3(side*.48,-.16,1.62),new THREE.Vector3(side*(.95+i*.08),-.22-i*.08,1.66-i*.04)];
    const geo=new THREE.BufferGeometry().setFromPoints(pts);
    const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0x5a3b2d,transparent:true,opacity:.65}));
    head.add(line);
  }
}

const leftArm = capsule([-0.52,.62,1.32],[.34,.98,.34],brown,[0,0,-.48]);
const rightArm = capsule([.52,.62,1.32],[.34,.98,.34],brown,[0,0,.48]);

sphere("left paw",[-.28,.18,1.76],[.45,.55,.28],brown,28);
sphere("right paw",[.28,.18,1.76],[.45,.55,.28],brown,28);
sphere("left peach pad",[-.28,.18,2.025],[.25,.3,.06],pad,24);
sphere("right peach pad",[.28,.18,2.025],[.25,.3,.06],pad,24);

for (const x of [-.28,.28]) {
  for (let i=-1;i<=1;i++) sphere("tiny paw toe",[x+i*.105,.08,2.075],[.055,.075,.025],pad,16);
}

sphere("left hind foot",[-1.12,-2.02,.76],[.7,.88,.55],brown,28);
sphere("right hind foot",[1.12,-2.02,.76],[.7,.88,.55],brown,28);
sphere("left hind pad",[-1.12,-2.13,1.22],[.42,.48,.1],pad,24);
sphere("right hind pad",[1.12,-2.13,1.22],[.42,.48,.1],pad,24);

const tail = capsule([0,-3.0,-.16],[.52,1.55,.5],brown,[0,0,0]);
tail.rotation.z = .12;
sphere("tail tip",[.2,-4.12,-.15],[.53,.68,.5],brown,28);

const ground = new THREE.Mesh(new THREE.CircleGeometry(8,64), groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = -4.02;
ground.receiveShadow = true;
scene.add(ground);

const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(2.7,48),
  new THREE.MeshBasicMaterial({color:0x718c88,transparent:true,opacity:.18})
);
shadow.rotation.x=-Math.PI/2;
shadow.scale.set(1,.46,1);
shadow.position.set(0,-3.99,.2);
scene.add(shadow);

let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  otter.position.y = Math.sin(t*1.35)*.045;
  otter.rotation.z = Math.sin(t*.72)*.012;
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
