<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faceted Owl Sculpture</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #171b20; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171b20);
scene.fog = new THREE.Fog(0x171b20, 10, 25);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.2, 3.8, 8.5);
camera.lookAt(0, 0.75, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 5;
controls.maxDistance = 13;
controls.target.set(0, 0.85, 0);

const stone = new THREE.MeshStandardMaterial({
  color: 0x7d8588,
  roughness: 0.88,
  metalness: 0.02,
  flatShading: true
});
const stoneLight = new THREE.MeshStandardMaterial({
  color: 0x9ba1a0,
  roughness: 0.9,
  flatShading: true
});
const stoneDark = new THREE.MeshStandardMaterial({
  color: 0x555e62,
  roughness: 0.92,
  flatShading: true
});
const stoneWarm = new THREE.MeshStandardMaterial({
  color: 0x8c8174,
  roughness: 0.94,
  flatShading: true
});
const eyeSocket = new THREE.MeshStandardMaterial({
  color: 0x252b2f,
  roughness: 0.72,
  flatShading: true
});
const pupilMaterial = new THREE.MeshStandardMaterial({
  color: 0x080b0d,
  roughness: 0.52,
  flatShading: true
});
const beakMaterial = new THREE.MeshStandardMaterial({
  color: 0x9b7654,
  roughness: 0.86,
  flatShading: true
});

const owl = new THREE.Group();
scene.add(owl);

const bodyGeometry = new THREE.IcosahedronGeometry(1.45, 2);
const body = new THREE.Mesh(bodyGeometry, stone);
body.scale.set(1.0, 1.38, 0.76);
body.position.set(0, 0.15, 0);
body.castShadow = true;
body.receiveShadow = true;
owl.add(body);

const chestGeometry = new THREE.IcosahedronGeometry(1.22, 1);
const chest = new THREE.Mesh(chestGeometry, stoneLight);
chest.scale.set(0.7, 1.15, 0.34);
chest.position.set(0, 0.02, 0.73);
chest.castShadow = true;
owl.add(chest);

const headGeometry = new THREE.IcosahedronGeometry(1.16, 1);
const head = new THREE.Mesh(headGeometry, stone);
head.scale.set(1.2, 0.91, 0.82);
head.position.set(0, 1.9, 0.03);
head.castShadow = true;
owl.add(head);

function createWing(sign) {
  const vertices = new Float32Array([
    0, 0.72, 0.42,
    sign * 0.88, 0.43, 0.13,
    sign * 0.82, -0.73, 0.12,
    sign * 0.25, -1.38, 0.24,
    sign * 0.38, -0.28, 0.66,
    0, 0.72, 0.02,
    sign * 0.88, 0.43, -0.19,
    sign * 0.82, -0.73, -0.19,
    sign * 0.25, -1.38, -0.08,
    sign * 0.38, -0.28, -0.02
  ]);
  const indices = [
    0, 1, 4, 1, 2, 4, 2, 3, 4, 3, 0, 4,
    5, 9, 6, 6, 9, 7, 7, 9, 8, 8, 9, 5,
    0, 5, 6, 0, 6, 1,
    1, 6, 7, 1, 7, 2,
    2, 7, 8, 2, 8, 3,
    3, 8, 9, 3, 9, 4,
    4, 9, 5, 4, 5, 0
  ];
  const wingGeometry = new THREE.BufferGeometry();
  wingGeometry.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
  wingGeometry.setIndex(indices);
  wingGeometry.computeVertexNormals();
  const wing = new THREE.Mesh(wingGeometry, stoneDark);
  wing.position.set(0, 0.62, 0.32);
  wing.castShadow = true;
  wing.receiveShadow = true;
  return wing;
}

owl.add(createWing(-1));
owl.add(createWing(1));

const earGeometry = new THREE.ConeGeometry(0.61, 1.42, 4, 1);
const leftEar = new THREE.Mesh(earGeometry, stone);
leftEar.position.set(-0.73, 3.0, 0.03);
leftEar.rotation.y = Math.PI / 4;
leftEar.rotation.z = -0.08;
leftEar.castShadow = true;
owl.add(leftEar);

const rightEar = new THREE.Mesh(earGeometry, stone);
rightEar.position.set(0.73, 3.0, 0.03);
rightEar.rotation.y = Math.PI / 4;
rightEar.rotation.z = 0.08;
rightEar.castShadow = true;
owl.add(rightEar);

function addEye(x) {
  const socketGeometry = new THREE.CircleGeometry(0.49, 8);
  const socket = new THREE.Mesh(socketGeometry, eyeSocket);
  socket.position.set(x, 2.04, 0.94);
  socket.castShadow = true;
  owl.add(socket);

  const irisGeometry = new THREE.CircleGeometry(0.29, 8);
  const iris = new THREE.Mesh(irisGeometry, stoneWarm);
  iris.position.set(x, 2.04, 0.955);
  owl.add(iris);

  const pupilGeometry = new THREE.CircleGeometry(0.135, 6);
  const pupil = new THREE.Mesh(pupilGeometry, pupilMaterial);
  pupil.position.set(x, 2.04, 0.972);
  owl.add(pupil);

  const glintGeometry = new THREE.CircleGeometry(0.038, 5);
  const glint = new THREE.Mesh(glintGeometry, stoneLight);
  glint.position.set(x - 0.055, 2.105, 0.983);
  owl.add(glint);
}

addEye(-0.47);
addEye(0.47);

const browGeometry = new THREE.ConeGeometry(0.53, 0.68, 4);
const leftBrow = new THREE.Mesh(browGeometry, stoneLight);
leftBrow.position.set(-0.49, 2.48, 0.7);
leftBrow.rotation.set(-0.9, 0, -0.52);
leftBrow.scale.set(1, 0.65, 0.5);
leftBrow.castShadow = true;
owl.add(leftBrow);

const rightBrow = new THREE.Mesh(browGeometry, stoneLight);
rightBrow.position.set(0.49, 2.48, 0.7);
rightBrow.rotation.set(-0.9, 0, 0.52);
rightBrow.scale.set(1, 0.65, 0.5);
rightBrow.castShadow = true;
owl.add(rightBrow);

const beakGeometry = new THREE.ConeGeometry(0.45, 0.92, 4, 1);
const beak = new THREE.Mesh(beakGeometry, beakMaterial);
beak.position.set(0, 1.66, 1.12);
beak.rotation.x = Math.PI / 2;
beak.rotation.z = Math.PI / 4;
beak.castShadow = true;
owl.add(beak);

const throatGeometry = new THREE.ConeGeometry(0.58, 0.88, 5);
const throat = new THREE.Mesh(throatGeometry, stoneDark);
throat.position.set(0, 0.88, 0.71);
throat.rotation.x = Math.PI;
throat.scale.set(0.8, 1.0, 0.55);
throat.castShadow = true;
owl.add(throat);

const perchGeometry = new THREE.CylinderGeometry(0.24, 0.31, 3.5, 7);
const perch = new THREE.Mesh(perchGeometry, stoneWarm);
perch.position.set(0, -1.58, 0.02);
perch.rotation.z = Math.PI / 2;
perch.castShadow = true;
perch.receiveShadow = true;
owl.add(perch);

function addFoot(x) {
  const footGroup = new THREE.Group();
  footGroup.position.set(x, -1.2, 0.27);

  const ankleGeometry = new THREE.CylinderGeometry(0.12, 0.15, 0.55, 5);
  const ankle = new THREE.Mesh(ankleGeometry, stoneDark);
  ankle.position.y = -0.17;
  ankle.castShadow = true;
  footGroup.add(ankle);

  for (let index = 0; index < 2; index += 1) {
    const toeGeometry = new THREE.ConeGeometry(0.095, 0.48, 4);
    const toe = new THREE.Mesh(toeGeometry, stoneWarm);
    toe.position.set((index - 0.5) * 0.18, -0.47, 0.13);
    toe.rotation.x = Math.PI / 2;
    toe.rotation.z = (index - 0.5) * 0.25;
    toe.castShadow = true;
    footGroup.add(toe);
  }
  owl.add(footGroup);
}

addFoot(-0.49);
addFoot(0.49);

const floorGeometry = new THREE.CircleGeometry(8, 48);
const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x20262a,
  roughness: 1,
  metalness: 0
});
const floor = new THREE.Mesh(floorGeometry, floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.95;
floor.receiveShadow = true;
scene.add(floor);

const hemisphere = new THREE.HemisphereLight(0xbfc8cc, 0x20252a, 2.1);
scene.add(hemisphere);

const keyLight = new THREE.DirectionalLight(0xfff1d7, 4.2);
keyLight.position.set(-4, 7, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -4;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x8aa8c4, 2.5);
rimLight.position.set(4, 4, -5);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0xd5b68e, 1.5, 10);
fillLight.position.set(0, 1.5, 5);
scene.add(fillLight);

function handleResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.addEventListener("resize", handleResize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
