<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cyberpunk Rain Alley</title>
<style>
html,body{margin:0;overflow:hidden;background:#02030a}canvas{display:block}
#label{position:fixed;left:18px;bottom:14px;color:#b8dfff;font:11px monospace;letter-spacing:3px;opacity:.55;pointer-events:none}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="label">SHINJUKU // RAIN SECTOR 09</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const rng = (() => { let s = 0x1a2b3c4d; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); })();
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040d);
scene.fog = new THREE.FogExp2(0x07101d, .055);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, .1, 120);
camera.position.set(10, 6.4, 14);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.2, -7);
controls.enableDamping = true;
controls.dampingFactor = .045;
controls.autoRotate = true;
controls.autoRotateSpeed = .26;
controls.minDistance = 7;
controls.maxDistance = 23;
controls.maxPolarAngle = Math.PI * .49;

const group = new THREE.Group();
scene.add(group);
const box = (w,h,d,mat,x=0,y=0,z=0) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; group.add(m); return m;
};
const cyl = (r1,r2,h,mat,x=0,y=0,z=0,rot) => {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,12), mat);
  m.position.set(x,y,z); if(rot)m.rotation.set(...rot); m.castShadow=m.receiveShadow=true; group.add(m); return m;
};
const dark = new THREE.MeshStandardMaterial({color:0x07101a,roughness:.78,metalness:.38});
const wall = new THREE.MeshStandardMaterial({color:0x101827,roughness:.9,metalness:.18});
const steel = new THREE.MeshStandardMaterial({color:0x293646,roughness:.34,metalness:.86});
const rusty = new THREE.MeshStandardMaterial({color:0x33272b,roughness:.8,metalness:.45});
const black = new THREE.MeshStandardMaterial({color:0x03060a,roughness:.55,metalness:.7});
const wet = new THREE.MeshPhysicalMaterial({color:0x071420,roughness:.2,metalness:.72,clearcoat:1,clearcoatRoughness:.14});
const glow = c => new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:3.5,roughness:.3,metalness:.2});

function canvasTexture(draw, w=512, h=512) {
  const c=document.createElement('canvas'); c.width=w;c.height=h;
  const x=c.getContext('2d'); draw(x,w,h);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
const asphaltTex = canvasTexture((x,w,h)=>{
  x.fillStyle='#07101b';x.fillRect(0,0,w,h);
  for(let i=0;i<9000;i++){const v=(rng()*32)|0;x.fillStyle=`rgba(${v},${v+8},${v+18},${rng()*.3})`;x.fillRect(rng()*w,rng()*h,1,1)}
  for(let i=0;i<35;i++){x.strokeStyle='rgba(100,160,190,.07)';x.lineWidth=rng()*2;x.beginPath();x.moveTo(rng()*w,0);x.lineTo(rng()*w,h);x.stroke()}
});
asphaltTex.wrapS=asphaltTex.wrapT=THREE.RepeatWrapping; asphaltTex.repeat.set(4,9);
const groundMat = new THREE.MeshPhysicalMaterial({map:asphaltTex,color:0x0a1822,roughness:.23,metalness:.7,clearcoat:1});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(18,42),groundMat);
floor.rotation.x=-Math.PI/2; floor.position.set(0,0,-8); floor.receiveShadow=true; group.add(floor);

box(3.2,11,28,wall,-7.1,5.5,-8);
box(3.2,11,28,wall,7.1,5.5,-8);
box(14.5,11,1.6,dark,0,5.5,-20.8);
for(const side of [-1,1]) for(let i=0;i<18;i++){
  const y=.5+rng()*10, z=-20+rng()*23;
  box(.08,.08,.06,glow(rng()>.5?0x00bfff:0xff126f),side*5.48,y,z);
}
for(let i=0;i<23;i++){
  const z=-19+rng()*21, x=(rng()-.5)*12;
  const pipe=cyl(.08,.08,2+rng()*6,steel,x,2+rng()*5,z);
  if(rng()>.55) pipe.rotation.z=Math.PI/2;
}

function neonSign(x,y,z,w,h,text,color,rot=0) {
  const tex=canvasTexture((c,W,H)=>{
    c.fillStyle='#07101a';c.fillRect(0,0,W,H);
    c.strokeStyle='#'+color.getHexString();c.shadowColor=c.strokeStyle;c.shadowBlur=26;c.lineWidth=14;c.strokeRect(22,22,W-44,H-44);
    c.fillStyle='#fff';c.shadowColor=c.strokeStyle;c.shadowBlur=30;c.font=`bold ${Math.floor(H*.58)}px sans-serif`;
    c.textAlign='center';c.textBaseline='middle';c.fillText(text,W/2,H/2+4);
  },512,256);
  const m=new THREE.MeshStandardMaterial({map:tex,emissive:color,emissiveMap:tex,emissiveIntensity:2.8,roughness:.4});
  const s=box(w,h,.12,m,x,y,z);s.rotation.y=rot;
  const l=new THREE.PointLight(color,4,5);l.position.set(x,y,z+(z>-10?1:-1));group.add(l);
  return s;
}
const signs=[
  neonSign(-5.42,7.5,-4.5,2.6,1.2,'夜 麺',new THREE.Color(0xff236d),-.04),
  neonSign(5.43,6.2,-8.5,2.2,2.8,'VOID',new THREE.Color(0x00dfff),.02),
  neonSign(-5.43,3.7,-11.5,1.7,2.7,'酒',new THREE.Color(0xffc21b),-.03),
  neonSign(5.43,8.7,-14.2,2.4,1.05,'電 気',new THREE.Color(0xbb4dff),.03)
];

function acUnit(x,y,z,side) {
  const g=new THREE.Group();group.add(g);g.position.set(x,y,z);
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.35,.82,.5),steel);body.castShadow=true;g.add(body);
  const fan=new THREE.Mesh(new THREE.CylinderGeometry(.26,.26,.03,16),black);fan.rotation.x=Math.PI/2;fan.position.z=.27;g.add(fan);
  for(let i=0;i<4;i++){const blade=new THREE.Mesh(new THREE.BoxGeometry(.08,.38,.03),steel);blade.rotation.z=i*Math.PI/2+.5;blade.position.z=.3;g.add(blade)}
  box(.1,.1,.5,rusty,x-side*.78,y-.5,z);
  return g;
}
for(const side of [-1,1]) for(let i=0;i<5;i++) acUnit(side*5.45,2.2+i*1.55,-3-rng()*13,side);

const stall=new THREE.Group(); group.add(stall); stall.position.set(-2.9,0,-8.7);
const canopyMat=glow(0xff7427);
const canopy=new THREE.Mesh(new THREE.BoxGeometry(4.2,.25,2.15),canopyMat);canopy.position.y=3.45;canopy.castShadow=true;stall.add(canopy);
box(4.2,.1,2.2,canopyMat,-2.9,3.45,-8.7);
for(const x of [-1.9,1.9]) for(const z of [-.85,.85]) {
  const p=new THREE.Mesh(new THREE.CylinderGeometry(.065,.065,3.35,8),steel);p.position.set(x,1.72,z);stall.add(p);
}
const counter=new THREE.Mesh(new THREE.BoxGeometry(4,.25,1.45),rusty);counter.position.set(0,1.1,.03);stall.add(counter);
const back=new THREE.Mesh(new THREE.BoxGeometry(3.8,2.35,.16),dark);back.position.set(0,2.15,-.85);stall.add(back);
const lanternMat=glow(0xffd166);
for(let i=0;i<4;i++){const l=new THREE.Mesh(new THREE.CylinderGeometry(.17,.17,.5,12),lanternMat);l.position.set(-1.45+i*.95,2.95,.8);stall.add(l)}
const noodleSign=neonSign(-2.9,3.15,-7.57,2.8,.7,'RAMEN',new THREE.Color(0xffbf3f));
const pot=new THREE.Mesh(new THREE.CylinderGeometry(.4,.48,.32,20),steel);pot.position.set(-2.9,1.37,-8.2);group.add(pot);

function dumpster(x,z,c) {
  box(1.7,1.15,1.05,new THREE.MeshStandardMaterial({color:c,roughness:.7,metalness:.65}),x,.62,z);
  box(1.82,.12,1.16,steel,x,1.25,z);
  for(const dx of [-.65,.65]) cyl(.08,.08,.24,black,x+dx,.12,z+.36);
}
dumpster(4.55,-4.2,0x183b3d); dumpster(4.25,-14.2,0x40242a);
for(let i=0;i<14;i++) {
  const b=new THREE.Mesh(new THREE.BoxGeometry(.35+rng()*.35,.16+rng()*.3,.28+rng()*.25),rusty);
  b.position.set(4+rng()*1.8,.15,-4-rng()*10);b.rotation.y=rng()*2; b.castShadow=true;group.add(b);
}

for(let i=0;i<10;i++){
  const z=-2-i*1.8;
  box(1.15,.03,.5,black,0,.025,z);
  for(let j=0;j<5;j++) box(.06,.04,.46,steel,-.45+j*.225,.05,z);
}
const puddles=[];
for(let i=0;i<16;i++){
  const p=new THREE.Mesh(new THREE.CircleGeometry(.35+rng()*1.1,18),new THREE.MeshPhysicalMaterial({color:0x071b2a,metalness:.8,roughness:.08,clearcoat:1}));
  p.rotation.x=-Math.PI/2;p.scale.y=.35+rng()*.35;p.position.set((rng()-.5)*10,.012,-1-rng()*17);group.add(p);puddles.push(p);
}

const cableMat=new THREE.MeshStandardMaterial({color:0x020305,roughness:.75});
for(let i=0;i<15;i++){
  const curve=new THREE.CatmullRomCurve3([
    new THREE.Vector3(-6.8,8+rng()*2,-1-rng()*18),
    new THREE.Vector3(-2+rng()*4,6.4+rng()*2,-4-rng()*14),
    new THREE.Vector3(6.8,7+rng()*3,-1-rng()*18)
  ]);
  const cable=new THREE.Mesh(new THREE.TubeGeometry(curve,24,.025+rng()*.025,6,false),cableMat);group.add(cable);
}

const drone=new THREE.Group();group.add(drone);drone.position.set(1.4,5.8,-6.5);
const core=new THREE.Mesh(new THREE.SphereGeometry(.34,16,10),steel);drone.add(core);
for(let i=0;i<4;i++){const a=i*Math.PI/2;const arm=new THREE.Mesh(new THREE.BoxGeometry(.9,.06,.08),black);arm.rotation.y=a;drone.add(arm);const pod=new THREE.Mesh(new THREE.SphereGeometry(.13,10,8),glow(0x00dfff));pod.position.set(Math.cos(a)*.48,0,Math.sin(a)*.48);drone.add(pod)}
const droneLight=new THREE.PointLight(0x00dfff,5,6);drone.add(droneLight);

const rainGeo=new THREE.BufferGeometry(), drops=[];
const rainCount=2600, pos=new Float32Array(rainCount*6);
for(let i=0;i<rainCount;i++){
  const x=(rng()-.5)*17,y=rng()*13,z=-rng()*24+2;
  pos.set([x,y,z,x-.035,y-.48,z],i*6);drops.push({i,y});
}
rainGeo.setAttribute('position',new THREE.BufferAttribute(pos,3));
const rain=new THREE.LineSegments(rainGeo,new THREE.LineBasicMaterial({color:0x7ab8dd,transparent:true,opacity:.34}));
scene.add(rain);

const steamGroups=[];
function steam(x,z) {
  const g=new THREE.Group();group.add(g);g.position.set(x,.08,z);steamGroups.push(g);
  const mat=new THREE.SpriteMaterial({map:canvasTexture((c,w,h)=>{const q=c.createRadialGradient(w/2,h/2,2,w/2,h/2,w/2);q.addColorStop(0,'rgba(190,245,255,.4)');q.addColorStop(1,'rgba(190,245,255,0)');c.fillStyle=q;c.fillRect(0,0,w,h)}),transparent:true,depthWrite:false});
  for(let i=0;i<8;i++){const s=new THREE.Sprite(mat.clone());s.position.set((rng()-.5)*.5,i*.25,(rng()-.5)*.5);s.scale.set(.8+i*.08,.8+i*.08,1);g.add(s)}
}
steam(3.1,-7.2);steam(-.4,-13.5);steam(4.8,-15.5);

const ambient=new THREE.HemisphereLight(0x386a94,0x07030b,1.2);scene.add(ambient);
const moon=new THREE.DirectionalLight(0x769dff,2.1);moon.position.set(-5,12,4);moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);moon.shadow.camera.left=-12;moon.shadow.camera.right=12;moon.shadow.camera.top=12;moon.shadow.camera.bottom=-12;scene.add(moon);
const pink=new THREE.PointLight(0xff156f,18,13,2);pink.position.set(-5.6,5,-5);scene.add(pink);
const cyan=new THREE.PointLight(0x00bfff,14,13,2);cyan.position.set(5.5,4,-10);scene.add(cyan);
const orange=new THREE.PointLight(0xff762c,18,9,2);orange.position.set(-2.8,3,-8);scene.add(orange);

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  const a=rainGeo.attributes.position.array;
  for(let i=0;i<rainCount;i++){let y=a[i*6+1]-.38;if(y<0)y=11+rng()*2;a[i*6+1]=y;a[i*6+4]=y-.48}
  rainGeo.attributes.position.needsUpdate=true;
  drone.position.y=5.8+Math.sin(t*1.8)*.18;drone.rotation.y=t*.7;
  signs.forEach((s,i)=>s.material.emissiveIntensity=2.1+Math.sin(t*(2+i*.37)+i)*.8);
  steamGroups.forEach((g,i)=>{g.children.forEach((s,j)=>{s.position.y=((j*.25+t*.35+i)%2.3);s.material.opacity=.25*(1-s.position.y/2.5)});g.rotation.y=t*.13});
  puddles.forEach((p,i)=>p.material.color.setHSL(.57,.55,.055+Math.sin(t*2+i)*.008));
  controls.update();renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
