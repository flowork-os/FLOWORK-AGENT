<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADA Access Ramp</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #aeb8bf; }
    canvas { display: block; width: 100%; height: 100%; }
    .caption {
      position: fixed;
      left: 24px;
      bottom: 20px;
      padding: 9px 13px;
      border-radius: 7px;
      color: #eef3f4;
      background: rgba(25, 32, 35, .68);
      font: 600 12px/1.35 system-ui, sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="caption">Accessible ramp · 1:12 slope</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xaeb8bf);
    scene.fog = new THREE.Fog(0xaeb8bf, 18, 38);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(8.8, 6.3, 11.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.target.set(0, 0.62, 0.9);
    controls.minDistance = 7;
    controls.maxDistance = 24;
    controls.maxPolarAngle = Math.PI * 0.48;

    const concrete = new THREE.MeshStandardMaterial({
      color: 0xbfc2bd, roughness: 0.86, metalness: 0.02
    });
    const concreteEdge = new THREE.MeshStandardMaterial({
      color: 0x969b98, roughness: 0.9, metalness: 0.01
    });
    const darkConcrete = new THREE.MeshStandardMaterial({
      color: 0x777d7b, roughness: 0.92
    });
    const railMaterial = new THREE.MeshStandardMaterial({
      color: 0x263036, roughness: 0.28, metalness: 0.78
    });
    const seamMaterial = new THREE.MeshStandardMaterial({
      color: 0x6f7774, roughness: 0.96
    });
    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x657463, roughness: 1
    });
    const pavingMaterial = new THREE.MeshStandardMaterial({
      color: 0x818a87, roughness: 0.95
    });

    function box(size, position, material, rotationX = 0) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), material);
      mesh.position.set(...position);
      mesh.rotation.x = rotationX;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function cylinderBetween(a, b, radius, material, radialSegments = 20) {
      const start = new THREE.Vector3(...a);
      const end = new THREE.Vector3(...b);
      const direction = new THREE.Vector3().subVectors(end, start);
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, direction.length(), radialSegments),
        material
      );
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function edgeLines(mesh, color = 0x767d7b) {
      const lines = new THREE.LineSegments(
        new THREE.EdgesGeometry(mesh.geometry),
        new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.34 })
      );
      lines.position.copy(mesh.position);
      lines.rotation.copy(mesh.rotation);
      lines.scale.copy(mesh.scale);
      scene.add(lines);
    }

    const slopeRun = 9;
    const rise = 0.75;
    const slope = Math.atan2(rise, slopeRun);
    const deckThickness = 0.18;
    const rampWidth = 1.55;
    const lowZ = -4.5;
    const highZ = 4.5;
    const deckCenterY = 0.465;

    const ground = box([30, 0.16, 30], [0, -0.08, 0], groundMaterial);
    ground.castShadow = false;

    for (let z = -13; z <= 13; z += 1.35) {
      const pathTile = box([2.1, 0.025, 1.22], [0, 0.012, z], pavingMaterial);
      pathTile.castShadow = false;
    }

    const rampDeck = box(
      [rampWidth, deckThickness, slopeRun],
      [0, deckCenterY, 0],
      concrete,
      -slope
    );
    edgeLines(rampDeck);

    const topLanding = box([rampWidth, deckThickness, 2.45], [0, 0.84, 5.72], concrete);
    edgeLines(topLanding);

    function rampTopY(z) {
      return deckCenterY + Math.sin(slope) * z + Math.cos(slope) * deckThickness / 2;
    }

    for (let z = -3.65; z <= 3.65; z += 1.05) {
      const seam = box(
        [rampWidth - 0.08, 0.008, 0.018],
        [0, rampTopY(z) + 0.006, z],
        seamMaterial,
        -slope
      );
      seam.castShadow = false;
    }

    const curbWidth = 0.13;
    const curbHeight = 0.105;
    for (const x of [-0.71, 0.71]) {
      const curb = box(
        [curbWidth, curbHeight, slopeRun],
        [x, deckCenterY + 0.105, 0],
        concreteEdge,
        -slope
      );
      edgeLines(curb, 0x686e6c);
    }

    const supportBeamY = deckCenterY - 0.19;
    for (const x of [-0.59, 0.59]) {
      box([0.16, 0.17, slopeRun - 0.18], [x, supportBeamY, 0], darkConcrete, -slope);
    }

    for (const z of [-3.35, -1.15, 1.05, 3.25]) {
      const top = rampTopY(z) - 0.11;
      const height = Math.max(0.18, top - 0.08);
      for (const x of [-0.59, 0.59]) {
        box([0.19, height, 0.19], [x, height / 2, z], darkConcrete);
      }
    }

    for (const z of [5.15, 6.27]) {
      for (const x of [-0.66, 0.66]) {
        box([0.2, 0.84, 0.2], [x, 0.42, z], darkConcrete);
      }
    }

    const railX = [-0.91, 0.91];
    const postZ = [-4.25, -2.55, -0.85, 0.85, 2.55, 4.25];
    const railHeight = 0.91;
    const lowerRailHeight = 0.43;

    for (const x of railX) {
      for (const z of postZ) {
        const bottom = rampTopY(z) + 0.015;
        cylinderBetween([x, bottom, z], [x, bottom + railHeight, z], 0.043, railMaterial);
      }

      cylinderBetween(
        [x, rampTopY(-4.52) + railHeight, -4.52],
        [x, rampTopY(4.52) + railHeight, 4.52],
        0.052,
        railMaterial
      );
      cylinderBetween(
        [x, rampTopY(-4.52) + lowerRailHeight, -4.52],
        [x, rampTopY(4.52) + lowerRailHeight, 4.52],
        0.034,
        railMaterial
      );

      for (const z of [5.18, 6.3]) {
        cylinderBetween([x, 0.94, z], [x, 1.85, z], 0.043, railMaterial);
      }
      cylinderBetween([x, 1.85, 4.52], [x, 1.85, 6.58], 0.052, railMaterial);
      cylinderBetween([x, 1.37, 4.52], [x, 1.37, 6.58], 0.034, railMaterial);
    }

    cylinderBetween([-0.91, 1.85, 6.58], [0.91, 1.85, 6.58], 0.052, railMaterial);
    cylinderBetween([-0.91, 1.37, 6.58], [0.91, 1.37, 6.58], 0.034, railMaterial);

    const landingThreshold = box([1.42, 0.012, 0.08], [0, 0.942, 4.52], seamMaterial);
    landingThreshold.castShadow = false;

    const hemi = new THREE.HemisphereLight(0xeaf2f5, 0x53605a, 2.0);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff4df, 3.2);
    sun.position.set(-7, 11, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -11;
    sun.shadow.camera.right = 11;
    sun.shadow.camera.top = 12;
    sun.shadow.camera.bottom = -8;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 35;
    sun.shadow.bias = -0.0002;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xb8d5e8, 0.8);
    fill.position.set(8, 5, -10);
    scene.add(fill);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      controls.update(clock.getDelta());
      renderer.render(scene, camera);
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    animate();
  </script>
</body>
</html>
