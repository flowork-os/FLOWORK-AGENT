<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rooftop Garden Terrace</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101526;
    }
    canvas {
      display: block;
    }
    #label {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(255, 244, 220, 0.84);
      font: 500 12px/1.5 system-ui, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 2px 12px #000;
    }
    #label span {
      display: block;
      margin-top: 2px;
      color: rgba(255, 225, 175, 0.52);
      font-size: 9px;
      letter-spacing: 0.12em;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="label">Rooftop Garden Terrace<span>Dusk above the city</span></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x555c72, 0.011);

    const camera = new THREE.PerspectiveCamera(
      44,
      innerWidth / innerHeight,
      0.1,
      300
    );
    camera.position.set(25, 19, 29);

    const renderer = new THREE.WebGLRenderer({
      antialias: true
    });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.2, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.22;
    controls.minDistance = 17;
    controls.maxDistance = 65;
    controls.maxPolarAngle = Math.PI * 0.48;

    let seed = 190734863;
    function random() {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let t = seed;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }

    function rand(min, max) {
      return min + (max - min) * random();
    }

    function choose(items) {
      return items[Math.floor(random() * items.length)];
    }

    const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

    function canvasTexture(draw, size = 512) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext('2d');
      draw(context, size);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = maxAnisotropy;
      return texture;
    }

    const concreteTexture = canvasTexture((context, size) => {
      context.fillStyle = '#777a78';
      context.fillRect(0, 0, size, size);
      for (let i = 0; i < 9000; i++) {
        const value = Math.floor(rand(85, 145));
        const alpha = rand(0.025, 0.12);
        context.fillStyle = `rgba(${value},${value},${value},${alpha})`;
        const dot = rand(0.4, 2.2);
        context.fillRect(random() * size, random() * size, dot, dot);
      }
      context.strokeStyle = 'rgba(45,48,47,0.22)';
      context.lineWidth = 2;
      context.beginPath();
      context.moveTo(0, size * 0.5);
      context.lineTo(size, size * 0.5);
      context.moveTo(size * 0.5, 0);
      context.lineTo(size * 0.5, size);
      context.stroke();
    });
    concreteTexture.wrapS = THREE.RepeatWrapping;
    concreteTexture.wrapT = THREE.RepeatWrapping;
    concreteTexture.repeat.set(5, 4);

    const woodTexture = canvasTexture((context, size) => {
      context.fillStyle = '#82583a';
      context.fillRect(0, 0, size, size);
      for (let y = 0; y < size; y += 32) {
        context.fillStyle = y % 64 ? '#795036' : '#895e3e';
        context.fillRect(0, y, size, 30);
        context.strokeStyle = 'rgba(35,20,13,0.3)';
        context.beginPath();
        context.moveTo(0, y + 30);
        context.lineTo(size, y + 30);
        context.stroke();
        for (let i = 0; i < 10; i++) {
          context.strokeStyle = `rgba(46,24,14,${rand(0.05, 0.16)})`;
          context.beginPath();
          context.moveTo(rand(0, size), y + rand(4, 25));
          context.bezierCurveTo(
            rand(0, size),
            y + rand(3, 27),
            rand(0, size),
            y + rand(3, 27),
            rand(0, size),
            y + rand(3, 27)
          );
          context.stroke();
        }
      }
    });
    woodTexture.wrapS = THREE.RepeatWrapping;
    woodTexture.wrapT = THREE.RepeatWrapping;
    woodTexture.repeat.set(2, 2);

    const pavingNormal = canvasTexture((context, size) => {
      context.fillStyle = '#8080ff';
      context.fillRect(0, 0, size, size);
      for (let i = 0; i < 1800; i++) {
        const shade = Math.floor(rand(110, 150));
        context.fillStyle = `rgb(${shade},${shade},255)`;
        context.fillRect(random() * size, random() * size, 1, 1);
      }
    });

    const materials = {
      concrete: new THREE.MeshStandardMaterial({
        color: 0x8b8d89,
        map: concreteTexture,
        normalMap: pavingNormal,
        normalScale: new THREE.Vector2(0.18, 0.18),
        roughness: 0.92
      }),
      parapet: new THREE.MeshStandardMaterial({
        color: 0xc3bbae,
        roughness: 0.86
      }),
      wood: new THREE.MeshStandardMaterial({
        color: 0x9a6947,
        map: woodTexture,
        roughness: 0.72
      }),
      darkWood: new THREE.MeshStandardMaterial({
        color: 0x4b3328,
        roughness: 0.75
      }),
      steel: new THREE.MeshStandardMaterial({
        color: 0x343a3b,
        metalness: 0.75,
        roughness: 0.34
      }),
      blackSteel: new THREE.MeshStandardMaterial({
        color: 0x161a1a,
        metalness: 0.7,
        roughness: 0.3
      }),
      copper: new THREE.MeshStandardMaterial({
        color: 0x8e6044,
        metalness: 0.55,
        roughness: 0.43
      }),
      soil: new THREE.MeshStandardMaterial({
        color: 0x38291d,
        roughness: 1
      }),
      leaf: new THREE.MeshStandardMaterial({
        color: 0x3d7445,
        roughness: 0.82,
        side: THREE.DoubleSide
      }),
      leafLight: new THREE.MeshStandardMaterial({
        color: 0x69934f,
        roughness: 0.8,
        side: THREE.DoubleSide
      }),
      glass: new THREE.MeshPhysicalMaterial({
        color: 0xaecfc8,
        transparent: true,
        opacity: 0.32,
        roughness: 0.14,
        metalness: 0,
        transmission: 0.2,
        side: THREE.DoubleSide,
        depthWrite: false
      }),
      cushion: new THREE.MeshStandardMaterial({
        color: 0xb9694e,
        roughness: 0.92
      }),
      cushionCream: new THREE.MeshStandardMaterial({
        color: 0xd7c8aa,
        roughness: 0.94
      }),
      ceramic: new THREE.MeshStandardMaterial({
        color: 0x455c60,
        roughness: 0.52
      }),
      water: new THREE.MeshPhysicalMaterial({
        color: 0x4c7f91,
        roughness: 0.15,
        metalness: 0.1
      })
    };

    function mesh(geometry, material, x = 0, y = 0, z = 0) {
      const object = new THREE.Mesh(geometry, material);
      object.position.set(x, y, z);
      object.castShadow = true;
      object.receiveShadow = true;
      return object;
    }

    function box(width, height, depth, material, x = 0, y = 0, z = 0) {
      return mesh(
        new THREE.BoxGeometry(width, height, depth),
        material,
        x,
        y,
        z
      );
    }

    function cylinder(
      radiusTop,
      radiusBottom,
      height,
      segments,
      material,
      x = 0,
      y = 0,
      z = 0
    ) {
      return mesh(
        new THREE.CylinderGeometry(
          radiusTop,
          radiusBottom,
          height,
          segments
        ),
        material,
        x,
        y,
        z
      );
    }

    function addEdgeBox(parent, width, height, depth, material, x, y, z) {
      const object = box(width, height, depth, material, x, y, z);
      parent.add(object);
      return object;
    }

    const skyGeometry = new THREE.SphereGeometry(150, 48, 24);
    const skyMaterial = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: {
        topColor: { value: new THREE.Color(0x17213d) },
        horizonColor: { value: new THREE.Color(0xba705f) },
        bottomColor: { value: new THREE.Color(0x3d4558) },
        offset: { value: 7 },
        exponent: { value: 0.72 }
      },
      vertexShader: `
        varying vec3 vWorldPosition;
        void main() {
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 horizonColor;
        uniform vec3 bottomColor;
        uniform float offset;
        uniform float exponent;
        varying vec3 vWorldPosition;
        void main() {
          float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;
          float upper = pow(max(h, 0.0), exponent);
          float lower = smoothstep(-0.35, 0.05, h);
          vec3 lowMix = mix(bottomColor, horizonColor, lower);
          vec3 color = mix(lowMix, topColor, upper);
          gl_FragColor = vec4(color, 1.0);
        }
      `
    });
    scene.add(new THREE.Mesh(skyGeometry, skyMaterial));

    const moon = mesh(
      new THREE.SphereGeometry(1.15, 24, 16),
      new THREE.MeshBasicMaterial({ color: 0xffe0bd }),
      -31,
      28,
      -66
    );
    scene.add(moon);

    const ambient = new THREE.HemisphereLight(0x8f9cc6, 0x322b26, 1.35);
    scene.add(ambient);

    const duskLight = new THREE.DirectionalLight(0xffbaa0, 2.2);
    duskLight.position.set(-18, 27, 12);
    duskLight.castShadow = true;
    duskLight.shadow.mapSize.set(2048, 2048);
    duskLight.shadow.camera.left = -30;
    duskLight.shadow.camera.right = 30;
    duskLight.shadow.camera.top = 28;
    duskLight.shadow.camera.bottom = -28;
    duskLight.shadow.camera.near = 1;
    duskLight.shadow.camera.far = 80;
    duskLight.shadow.bias = -0.0002;
    scene.add(duskLight);

    const roof = box(36, 0.8, 27, materials.concrete, 0, -0.45, 0);
    scene.add(roof);

    const deck = box(15.5, 0.22, 11, materials.wood, 5.3, 0.15, 3.2);
    scene.add(deck);

    const parapetGroup = new THREE.Group();
    parapetGroup.add(box(37, 1.15, 0.65, materials.parapet, 0, 0.4, -13.2));
    parapetGroup.add(box(37, 1.15, 0.65, materials.parapet, 0, 0.4, 13.2));
    parapetGroup.add(box(0.65, 1.15, 27, materials.parapet, -18.2, 0.4, 0));
    parapetGroup.add(box(0.65, 1.15, 27, materials.parapet, 18.2, 0.4, 0));
    parapetGroup.add(box(37.2, 0.16, 0.9, materials.copper, 0, 1.04, -13.2));
    parapetGroup.add(box(37.2, 0.16, 0.9, materials.copper, 0, 1.04, 13.2));
    parapetGroup.add(box(0.9, 0.16, 27, materials.copper, -18.2, 1.04, 0));
    parapetGroup.add(box(0.9, 0.16, 27, materials.copper, 18.2, 1.04, 0));
    scene.add(parapetGroup);

    const skyline = new THREE.Group();
    const windowMaterial = new THREE.MeshBasicMaterial({
      color: 0xffc675
    });
    const darkWindowMaterial = new THREE.MeshBasicMaterial({
      color: 0x273047
    });
    const buildingMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x202938, roughness: 0.95 }),
      new THREE.MeshStandardMaterial({ color: 0x2c3140, roughness: 0.95 }),
      new THREE.MeshStandardMaterial({ color: 0x34333c, roughness: 0.95 }),
      new THREE.MeshStandardMaterial({ color: 0x242b35, roughness: 0.95 })
    ];

    function createBuilding(x, z, width, height, depth) {
      const group = new THREE.Group();
      const body = box(
        width,
        height,
        depth,
        choose(buildingMaterials),
        x,
        height * 0.5 - 1.2,
        z
      );
      body.castShadow = false;
      group.add(body);

      const faceZ = z + depth * 0.5 + 0.012;
      const columns = Math.max(2, Math.floor(width / 1.2));
      const rows = Math.max(2, Math.floor(height / 1.35));

      for (let row = 0; row < rows; row++) {
        for (let column = 0; column < columns; column++) {
          if (random() < 0.43) {
            const window = mesh(
              new THREE.PlaneGeometry(0.28, 0.38),
              random() < 0.72 ? windowMaterial : darkWindowMaterial,
              x - width * 0.5 + (column + 0.5) * width / columns,
              row * 1.05 + 0.4,
              faceZ
            );
            window.castShadow = false;
            group.add(window);
          }
        }
      }

      if (random() < 0.28) {
        group.add(
          box(
            width * 0.46,
            rand(0.5, 1.4),
            depth * 0.45,
            materials.steel,
            x,
            height - 0.9,
            z
          )
        );
      }
      return group;
    }

    for (let i = 0; i < 23; i++) {
      const angle = -0.98 + i / 22 * 1.96;
      const radius = rand(46, 66);
      const x = Math.sin(angle) * radius;
      const z = -Math.cos(angle) * radius - 5;
      skyline.add(
        createBuilding(
          x,
          z,
          rand(3.8, 8),
          rand(7, 25),
          rand(4, 8)
        )
      );
    }
    scene.add(skyline);

    function createPlanter(width, depth, x, z) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      const sideHeight = 1.35;
      group.add(box(width, sideHeight, 0.28, materials.wood, 0, 0.7, -depth * 0.5));
      group.add(box(width, sideHeight, 0.28, materials.wood, 0, 0.7, depth * 0.5));
      group.add(box(0.28, sideHeight, depth, materials.wood, -width * 0.5, 0.7, 0));
      group.add(box(0.28, sideHeight, depth, materials.wood, width * 0.5, 0.7, 0));
      group.add(box(width - 0.35, 0.3, depth - 0.35, materials.soil, 0, 1.05, 0));

      for (let i = 0; i < Math.floor(width * depth * 0.7); i++) {
        const px = rand(-width * 0.42, width * 0.42);
        const pz = rand(-depth * 0.38, depth * 0.38);
        const kind = random();

        if (kind < 0.45) {
          const stem = cylinder(
            0.025,
            0.035,
            rand(0.45, 0.8),
            6,
            materials.leaf,
            px,
            1.45,
            pz
          );
          group.add(stem);
          const leafCount = 3 + Math.floor(random() * 3);
          for (let j = 0; j < leafCount; j++) {
            const leaf = mesh(
              new THREE.SphereGeometry(0.16, 8, 5),
              j % 2 ? materials.leaf : materials.leafLight,
              px + rand(-0.18, 0.18),
              1.35 + j * 0.12,
              pz + rand(-0.14, 0.14)
            );
            leaf.scale.set(1.4, 0.42, 0.68);
            leaf.rotation.y = rand(0, Math.PI);
            group.add(leaf);
          }
        } else if (kind < 0.77) {
          const plant = new THREE.Group();
          plant.position.set(px, 1.24, pz);
          for (let j = 0; j < 6; j++) {
            const leaf = mesh(
              new THREE.SphereGeometry(0.18, 8, 5),
              materials.leafLight
            );
            const a = j / 6 * Math.PI * 2;
            leaf.position.set(Math.cos(a) * 0.17, 0.14, Math.sin(a) * 0.17);
            leaf.scale.set(0.65, 1.6, 0.45);
            leaf.rotation.z = Math.cos(a) * 0.55;
            plant.add(leaf);
          }
          group.add(plant);
        } else {
          const stemHeight = rand(0.45, 0.76);
          group.add(
            cylinder(
              0.018,
              0.025,
              stemHeight,
              6,
              materials.leaf,
              px,
              1.25 + stemHeight * 0.5,
              pz
            )
          );
          const petalColor = choose([0xe78187, 0xf0b65d, 0xd798d9, 0xf4df8a]);
          const flowerMat = new THREE.MeshStandardMaterial({
            color: petalColor,
            roughness: 0.8
          });
          for (let j = 0; j < 6; j++) {
            const petal = mesh(
              new THREE.SphereGeometry(0.09, 7, 5),
              flowerMat,
              px + Math.cos(j / 6 * Math.PI * 2) * 0.1,
              1.27 + stemHeight,
              pz + Math.sin(j / 6 * Math.PI * 2) * 0.1
            );
            petal.scale.set(1.2, 0.35, 0.7);
            group.add(petal);
          }
          group.add(
            mesh(
              new THREE.SphereGeometry(0.07, 8, 6),
              new THREE.MeshStandardMaterial({ color: 0x56351f }),
              px,
              1.28 + stemHeight,
              pz
            )
          );
        }
      }
      scene.add(group);
      return group;
    }

    createPlanter(5.4, 2.2, -13.2, -8.9);
    createPlanter(5.4, 2.2, -6.9, -8.9);
    createPlanter(4.2, 2.0, -13.6, -4.8);
    createPlanter(4.2, 2.0, -8.6, -4.8);

    const pergola = new THREE.Group();
    pergola.position.set(5.2, 0, 3.1);

    const pergolaWidth = 14;
    const pergolaDepth = 9.5;
    const pergolaHeight = 5.5;

    for (const x of [-pergolaWidth * 0.5, pergolaWidth * 0.5]) {
      for (const z of [-pergolaDepth * 0.5, pergolaDepth * 0.5]) {
        pergola.add(box(0.38, pergolaHeight, 0.38, materials.darkWood, x, 2.75, z));
        pergola.add(box(0.75, 0.18, 0.75, materials.steel, x, 0.14, z));
      }
    }

    pergola.add(
      box(
        pergolaWidth + 0.6,
        0.38,
        0.42,
        materials.darkWood,
        0,
        pergolaHeight,
        -pergolaDepth * 0.5
      )
    );
    pergola.add(
      box(
        pergolaWidth + 0.6,
        0.38,
        0.42,
        materials.darkWood,
        0,
        pergolaHeight,
        pergolaDepth * 0.5
      )
    );
    pergola.add(
      box(
        0.42,
        0.38,
        pergolaDepth + 0.6,
        materials.darkWood,
        -pergolaWidth * 0.5,
        pergolaHeight,
        0
      )
    );
    pergola.add(
      box(
        0.42,
        0.38,
        pergolaDepth + 0.6,
        materials.darkWood,
        pergolaWidth * 0.5,
        pergolaHeight,
        0
      )
    );

    for (let i = 0; i < 9; i++) {
      const x = -pergolaWidth * 0.5 + i * pergolaWidth / 8;
      pergola.add(
        box(
          0.18,
          0.22,
          pergolaDepth + 0.9,
          materials.wood,
          x,
          pergolaHeight + 0.25,
          0
        )
      );
    }
    scene.add(pergola);

    const vines = [];
    function createVine(baseX, baseZ, height, direction = 1) {
      const group = new THREE.Group();
      group.position.set(baseX, 0.35, baseZ);
      const points = [];

      for (let i = 0; i < 18; i++) {
        const t = i / 17;
        points.push(
          new THREE.Vector3(
            Math.sin(t * Math.PI * 5 + baseX) * 0.16,
            t * height,
            Math.cos(t * Math.PI * 4 + baseZ) * 0.16
          )
        );
      }

      const curve = new THREE.CatmullRomCurve3(points);
      const stem = mesh(
        new THREE.TubeGeometry(curve, 35, 0.035, 6, false),
        materials.leaf
      );
      group.add(stem);

      for (let i = 2; i < 17; i += 2) {
        const point = points[i];
        const leaf = mesh(
          new THREE.SphereGeometry(0.18, 8, 5),
          i % 4 ? materials.leaf : materials.leafLight
        );
        leaf.position.copy(point);
        leaf.position.x += direction * 0.18;
        leaf.scale.set(1.25, 0.35, 0.62);
        leaf.rotation.z = direction * 0.55;
        group.add(leaf);
      }

      pergola.add(group);
      vines.push(group);
    }

    createVine(-6.9, -4.6, 5.1, 1);
    createVine(6.9, -4.6, 5.1, -1);
    createVine(-6.9, 4.6, 5.1, 1);
    createVine(6.9, 4.6, 5.1, -1);

    const hangingVines = new THREE.Group();
    for (let i = 0; i < 28; i++) {
      const x = rand(-6.5, 6.5);
      const z = rand(-4.3, 4.3);
      const length = rand(0.35, 1.1);
      hangingVines.add(
        cylinder(
          0.015,
          0.025,
          length,
          6,
          materials.leaf,
          x,
          pergolaHeight - length * 0.5,
          z
        )
      );
      const leaf = mesh(
        new THREE.SphereGeometry(0.13, 7, 5),
        random() < 0.5 ? materials.leaf : materials.leafLight,
        x + rand(-0.08, 0.08),
        pergolaHeight - length,
        z
      );
      leaf.scale.set(0.8, 0.3, 1.2);
      hangingVines.add(leaf);
    }
    pergola.add(hangingVines);

    const bulbMaterial = new THREE.MeshStandardMaterial({
      color: 0xffd5a1,
      emissive: 0xff9b45,
      emissiveIntensity: 3.2,
      roughness: 0.35
    });
    const cableMaterial = new THREE.MeshBasicMaterial({
      color: 0x171515
    });
    const lightStrands = [];

    function createLightStrand(start, end, sag, bulbs) {
      const group = new THREE.Group();
      const nodes = [];

      for (let i = 0; i <= 32; i++) {
        const t = i / 32;
        const point = start.clone().lerp(end, t);
        point.y -= Math.sin(t * Math.PI) * sag;
        nodes.push(point);
      }

      const curve = new THREE.CatmullRomCurve3(nodes);
      const cable = mesh(
        new THREE.TubeGeometry(curve, 48, 0.018, 5, false),
        cableMaterial
      );
      cable.castShadow = false;
      group.add(cable);

      for (let i = 1; i < bulbs; i++) {
        const t = i / bulbs;
        const point = curve.getPoint(t);
        const socket = cylinder(
          0.055,
          0.055,
          0.12,
          8,
          materials.blackSteel,
          point.x,
          point.y - 0.06,
          point.z
        );
        group.add(socket);
        const bulb = mesh(
          new THREE.SphereGeometry(0.095, 10, 7),
          bulbMaterial,
          point.x,
          point.y - 0.18,
          point.z
        );
        bulb.castShadow = false;
        group.add(bulb);

        if (i % 4 === 0) {
          const glow = new THREE.PointLight(0xffa85c, 0.34, 4.2, 2);
          glow.position.copy(bulb.position);
          group.add(glow);
        }
      }

      pergola.add(group);
      lightStrands.push({
        group,
        phase: rand(0, Math.PI * 2),
        baseRotation: group.rotation.z
      });
    }

    createLightStrand(
      new THREE.Vector3(-6.7, 5.25, -4.2),
      new THREE.Vector3(6.7, 5.25, 4.2),
      0.8,
      13
    );
    createLightStrand(
      new THREE.Vector3(-6.7, 5.1, 4.2),
      new THREE.Vector3(6.7, 5.1, -4.2),
      0.72,
      13
    );
    createLightStrand(
      new THREE.Vector3(-6.6, 5.35, 0),
      new THREE.Vector3(6.6, 5.35, 0),
      1.1,
      12
    );

    function createChair(x, z, rotation) {
      const group = new THREE.Group();
      group.position.set(x, 0.28, z);
      group.rotation.y = rotation;

      const frameMat = materials.blackSteel;
      const seat = box(2.4, 0.25, 2.05, materials.cushionCream, 0, 1.0, 0);
      seat.geometry.translate(0, 0, -0.05);
      group.add(seat);

      const back = box(2.4, 0.3, 2.5, materials.cushion, 0, 2.0, -0.72);
      back.rotation.x = -0.58;
      group.add(back);

      for (const side of [-1, 1]) {
        group.add(box(0.1, 0.1, 2.2, frameMat, side * 1.1, 0.64, 0));
        group.add(box(0.1, 1.05, 0.1, frameMat, side * 1.1, 0.55, 0.8));
        group.add(box(0.1, 1.05, 0.1, frameMat, side * 1.1, 0.55, -0.8));
        group.add(box(0.15, 0.15, 2.0, frameMat, side * 1.18, 1.42, -0.1));
      }

      scene.add(group);
      return group;
    }

    createChair(1.0, 7.0, Math.PI);
    createChair(9.5, 7.0, Math.PI);
    createChair(1.0, -0.6, 0);
    createChair(9.5, -0.6, 0);

    const fireTable = new THREE.Group();
    fireTable.position.set(5.2, 0.3, 3.2);
    fireTable.add(box(4.0, 0.85, 2.1, materials.blackSteel, 0, 0.45, 0));
    fireTable.add(box(4.25, 0.18, 2.35, materials.copper, 0, 0.95, 0));
    fireTable.add(box(2.75, 0.18, 0.72, materials.soil, 0, 1.07, 0));

    for (let i = 0; i < 22; i++) {
      const coal = mesh(
        new THREE.DodecahedronGeometry(rand(0.07, 0.16), 0),
        new THREE.MeshStandardMaterial({
          color: random() < 0.28 ? 0x9e3e1d : 0x2d2826,
          emissive: random() < 0.28 ? 0x661800 : 0x000000,
          emissiveIntensity: 1.8,
          roughness: 1
        }),
        rand(-1.25, 1.25),
        1.2,
        rand(-0.25, 0.25)
      );
      fireTable.add(coal);
    }

    const flameMaterial = new THREE.MeshBasicMaterial({
      color: 0xffb03d,
      transparent: true,
      opacity: 0.75,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const flames = [];

    for (let i = 0; i < 13; i++) {
      const flame = mesh(
        new THREE.SphereGeometry(0.18, 8, 6),
        flameMaterial,
        rand(-1.15, 1.15),
        rand(1.35, 1.72),
        rand(-0.18, 0.18)
      );
      flame.scale.set(rand(0.45, 0.8), rand(1.5, 2.7), rand(0.45, 0.75));
      flame.userData.phase = rand(0, Math.PI * 2);
      flame.castShadow = false;
      flames.push(flame);
      fireTable.add(flame);
    }

    const fireLight = new THREE.PointLight(0xff7a32, 4.8, 12, 2);
    fireLight.position.set(0, 2.0, 0);
    fireLight.castShadow = true;
    fireLight.shadow.mapSize.set(512, 512);
    fireTable.add(fireLight);
    scene.add(fireTable);

    const greenhouse = new THREE.Group();
    greenhouse.position.set(-12.5, 0.2, 7.8);
    greenhouse.add(box(5.2, 0.3, 4.0, materials.steel, 0, 0.15, 0));

    for (const x of [-2.5, 2.5]) {
      for (const z of [-1.9, 1.9]) {
        greenhouse.add(box(0.13, 4.25, 0.13, materials.steel, x, 2.2, z));
      }
    }

    greenhouse.add(box(5.15, 0.13, 0.13, materials.steel, 0, 4.3, -1.9));
    greenhouse.add(box(5.15, 0.13, 0.13, materials.steel, 0, 4.3, 1.9));
    greenhouse.add(box(0.13, 0.13, 4, materials.steel, -2.5, 4.3, 0));
    greenhouse.add(box(0.13, 0.13, 4, materials.steel, 2.5, 4.3, 0));

    const roofLeft = box(2.95, 0.08, 4.05, materials.glass, -1.3, 4.95, 0);
    roofLeft.rotation.z = -0.48;
    greenhouse.add(roofLeft);

    const roofRight = box(2.95, 0.08, 4.05, materials.glass, 1.3, 4.95, 0);
    roofRight.rotation.z = 0.48;
    greenhouse.add(roofRight);

    greenhouse.add(box(5, 4, 0.06, materials.glass, 0, 2.2, -1.86));
    greenhouse.add(box(5, 4, 0.06, materials.glass, 0, 2.2, 1.86));
    greenhouse.add(box(0.06, 4, 3.75, materials.glass, -2.46, 2.2, 0));
    greenhouse.add(box(0.06, 4, 3.75, materials.glass, 2.46, 2.2, 0));

    for (let shelf = 0; shelf < 2; shelf++) {
      greenhouse.add(
        box(
          4.25,
          0.12,
          1.1,
          materials.steel,
          0,
          1.1 + shelf * 1.25,
          -0.55
        )
      );
      for (let i = 0; i < 5; i++) {
        const px = -1.7 + i * 0.85;
        greenhouse.add(
          cylinder(
            0.24,
            0.19,
            0.38,
            12,
            materials.ceramic,
            px,
            1.38 + shelf * 1.25,
            -0.55
          )
        );
        const plant = mesh(
          new THREE.SphereGeometry(0.28, 8, 6),
          i % 2 ? materials.leaf : materials.leafLight,
          px,
          1.76 + shelf * 1.25,
          -0.55
        );
        plant.scale.set(0.8, 1.3, 0.8);
        greenhouse.add(plant);
      }
    }

    const greenhouseLight = new THREE.PointLight(0xffd9a0, 1.7, 8, 2);
    greenhouseLight.position.set(0, 3.1, 0);
    greenhouse.add(greenhouseLight);
    scene.add(greenhouse);

    const tankGroup = new THREE.Group();
    tankGroup.position.set(13.6, 0.1, -7.9);

    for (const x of [-1.7, 1.7]) {
      for (const z of [-1.4, 1.4]) {
        const leg = box(0.2, 4.7, 0.2, materials.blackSteel, x, 2.35, z);
        leg.rotation.z = x * 0.025;
        tankGroup.add(leg);
      }
    }

    tankGroup.add(box(4.2, 0.22, 3.5, materials.blackSteel, 0, 4.65, 0));
    tankGroup.add(box(4.8, 0.12, 0.12, materials.blackSteel, 0, 2.6, -1.45));
    tankGroup.add(box(4.8, 0.12, 0.12, materials.blackSteel, 0, 2.6, 1.45));

    const tank = cylinder(2.05, 2.05, 3.5, 28, materials.water, 0, 6.45, 0);
    tank.rotation.z = Math.PI * 0.5;
    tankGroup.add(tank);

    for (let i = -2; i <= 2; i++) {
      const ring = mesh(
        new THREE.TorusGeometry(2.07, 0.055, 8, 32),
        materials.steel,
        i * 0.72,
        6.45,
        0
      );
      ring.rotation.y = Math.PI * 0.5;
      tankGroup.add(ring);
    }

    tankGroup.add(
      cylinder(0.42, 0.42, 0.35, 18, materials.steel, 0, 8.3, 0)
    );
    tankGroup.add(box(0.14, 3.8, 0.14, materials.steel, 2.05, 2.6, 1.65));

    for (let i = 0; i < 6; i++) {
      tankGroup.add(
        box(
          0.85,
          0.07,
          0.18,
          materials.steel,
          2.05,
          0.8 + i * 0.62,
          1.65
        )
      );
    }
    scene.add(tankGroup);

    const treeCrowns = [];
    function createPottedTree(x, z, scale = 1) {
      const group = new THREE.Group();
      group.position.set(x, 0.1, z);
      group.scale.setScalar(scale);

      const pot = cylinder(
        0.72,
        0.52,
        1.25,
        20,
        materials.ceramic,
        0,
        0.65,
        0
      );
      group.add(pot);
      group.add(
        cylinder(
          0.62,
          0.62,
          0.12,
          18,
          materials.soil,
          0,
          1.28,
          0
        )
      );

      const trunk = cylinder(
        0.13,
        0.2,
        3.6,
        9,
        materials.darkWood,
        0,
        3.0,
        0
      );
      group.add(trunk);

      const crown = new THREE.Group();
      crown.position.y = 4.55;

      for (let i = 0; i < 12; i++) {
        const foliage = mesh(
          new THREE.IcosahedronGeometry(rand(0.48, 0.82), 1),
          i % 3 ? materials.leaf : materials.leafLight,
          rand(-0.72, 0.72),
          rand(-0.45, 0.75),
          rand(-0.68, 0.68)
        );
        foliage.scale.set(rand(0.8, 1.3), rand(0.8, 1.25), rand(0.8, 1.25));
        crown.add(foliage);
      }

      group.add(crown);
      treeCrowns.push({
        crown,
        phase: rand(0, Math.PI * 2),
        strength: rand(0.012, 0.028)
      });
      scene.add(group);
    }

    createPottedTree(-16, 9.9, 1.05);
    createPottedTree(15.6, 9.6, 1.05);
    createPottedTree(16.1, 1.8, 0.9);
    createPottedTree(-16.2, -1.2, 0.86);

    function createLantern(x, z) {
      const group = new THREE.Group();
      group.position.set(x, 0.15, z);
      group.add(box(0.55, 0.08, 0.55, materials.blackSteel, 0, 0, 0));
      group.add(box(0.08, 0.9, 0.08, materials.blackSteel, -0.22, 0.45, -0.22));
      group.add(box(0.08, 0.9, 0.08, materials.blackSteel, 0.22, 0.45, -0.22));
      group.add(box(0.08, 0.9, 0.08, materials.blackSteel, -0.22, 0.45, 0.22));
      group.add(box(0.08, 0.9, 0.08, materials.blackSteel, 0.22, 0.45, 0.22));
      group.add(box(0.58, 0.08, 0.58, materials.blackSteel, 0, 0.92, 0));

      const candle = cylinder(
        0.09,
        0.09,
        0.32,
        12,
        materials.cushionCream,
        0,
        0.3,
        0
      );
      group.add(candle);

      const flame = mesh(
        new THREE.SphereGeometry(0.06, 8, 5),
        bulbMaterial,
        0,
        0.52,
        0
      );
      flame.scale.y = 1.6;
      group.add(flame);

      const light = new THREE.PointLight(0xffa052, 0.6, 3.5, 2);
      light.position.set(0, 0.62, 0);
      group.add(light);
      scene.add(group);
    }

    createLantern(-3.7, 11.3);
    createLantern(4.7, 11.3);
    createLantern(14.6, 11.2);
    createLantern(-4.1, -11.1);

    const hose = new THREE.Group();
    const hosePoints = [];
    for (let i = 0; i < 30; i++) {
      const a = i / 29 * Math.PI * 2.7;
      hosePoints.push(
        new THREE.Vector3(
          -3.2 + Math.cos(a) * (1.25 + i * 0.008),
          0.14,
          -8.6 + Math.sin(a) * (0.9 + i * 0.006)
        )
      );
    }
    const hoseCurve = new THREE.CatmullRomCurve3(hosePoints);
    hose.add(
      mesh(
        new THREE.TubeGeometry(hoseCurve, 70, 0.055, 7, false),
        new THREE.MeshStandardMaterial({
          color: 0x365e45,
          roughness: 0.8
        })
      )
    );
    scene.add(hose);

    const wateringCan = new THREE.Group();
    wateringCan.position.set(-4.2, 0.15, -6.7);
    wateringCan.add(
      cylinder(0.48, 0.5, 0.95, 16, materials.copper, 0, 0.5, 0)
    );

    const spout = cylinder(
      0.12,
      0.2,
      1.25,
      12,
      materials.copper,
      0.75,
      0.72,
      0
    );
    spout.rotation.z = -Math.PI * 0.5;
    wateringCan.add(spout);

    const handle = mesh(
      new THREE.TorusGeometry(0.58, 0.07, 8, 20, Math.PI),
      materials.copper,
      -0.15,
      1.0,
      0
    );
    handle.rotation.y = Math.PI * 0.5;
    wateringCan.add(handle);
    scene.add(wateringCan);

    const birdGroup = new THREE.Group();
    birdGroup.position.set(-9, 12, -18);
    const birdMat = new THREE.MeshBasicMaterial({
      color: 0x111522,
      side: THREE.DoubleSide
    });

    for (let i = 0; i < 5; i++) {
      const bird = new THREE.Group();
      bird.position.set(i * 2.2, Math.sin(i) * 0.7, rand(-2, 2));

      const leftWing = mesh(
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(-0.55, 0.18, 0),
          new THREE.Vector3(-0.95, 0, 0)
        ]),
        birdMat
      );
      leftWing.geometry.setIndex([0, 1, 2]);

      const rightWing = mesh(
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(0.55, 0.18, 0),
          new THREE.Vector3(0.95, 0, 0)
        ]),
        birdMat
      );
      rightWing.geometry.setIndex([0, 1, 2]);

      bird.add(leftWing, rightWing);
      bird.userData.phase = rand(0, Math.PI * 2);
      birdGroup.add(bird);
    }
    scene.add(birdGroup);

    const clock = new THREE.Clock();

    function animate() {
      const time = clock.getElapsedTime();

      for (const strand of lightStrands) {
        strand.group.rotation.z =
          strand.baseRotation +
          Math.sin(time * 0.72 + strand.phase) * 0.012;
        strand.group.rotation.x =
          Math.cos(time * 0.58 + strand.phase) * 0.006;
      }

      for (const vine of vines) {
        vine.rotation.z =
          Math.sin(time * 0.55 + vine.position.x) * 0.015;
      }

      hangingVines.rotation.z = Math.sin(time * 0.48) * 0.01;

      for (const tree of treeCrowns) {
        tree.crown.rotation.z =
          Math.sin(time * 0.62 + tree.phase) * tree.strength;
        tree.crown.rotation.x =
          Math.cos(time * 0.47 + tree.phase) * tree.strength * 0.65;
      }

      for (const flame of flames) {
        const wave = Math.sin(time * 8.5 + flame.userData.phase);
        flame.scale.y = 1.7 + wave * 0.42;
        flame.position.y += Math.sin(time * 11 + flame.userData.phase) * 0.0015;
        flame.position.x += Math.cos(time * 7 + flame.userData.phase) * 0.0008;
      }

      fireLight.intensity =
        4.35 +
        Math.sin(time * 10.7) * 0.4 +
        Math.sin(time * 17.3) * 0.22;

      bulbMaterial.emissiveIntensity =
        3.05 + Math.sin(time * 2.1) * 0.12;

      birdGroup.position.x = -9 + (time * 0.55) % 22;
      birdGroup.position.y = 12 + Math.sin(time * 0.3) * 0.5;

      birdGroup.children.forEach((bird, index) => {
        bird.position.y =
          Math.sin(time * 1.8 + bird.userData.phase) * 0.35;
        bird.rotation.z =
          Math.sin(time * 3.4 + index) * 0.08;
      });

      moon.position.y = 28 + Math.sin(time * 0.05) * 0.12;

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    animate();
  </script>
</body>
</html>
