<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streetlight</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d21; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d21);
scene.fog = new THREE.Fog(0x1a1d21, 25, 60);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(9, 6.5, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.6, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 4;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.52;

// Lighting
scene.add(new THREE.HemisphereLight(0x8fa3bf, 0x2b2b2e, 0.6));
const key = new THREE.DirectionalLight(0xfff2e0, 1.6);
key.position.set(8, 12, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -8;
key.shadow.camera.right = key.shadow.camera.top = 8;
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight(0x6f8fc0, 0.5);
rim.position.set(-6, 5, -8);
scene.add(rim);

// Ground
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 64),
  new THREE.MeshStandardMaterial({ color: 0x25282c, roughness: 0.95, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Soft radial shadow blob under the base
const blobCanvas = document.createElement('canvas');
blobCanvas.width = blobCanvas.height = 256;
const bctx = blobCanvas.getContext('2d');
const grad = bctx.createRadialGradient(128, 128, 10, 128, 128, 128);
grad.addColorStop(0, 'rgba(0,0,0,0.45)');
grad.addColorStop(1, 'rgba(0,0,0,0)');
bctx.fillStyle = grad;
bctx.fillRect(0, 0, 256, 256);
const blob = new THREE.Mesh(
  new THREE.PlaneGeometry(4.5, 4.5),
  new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(blobCanvas), transparent: true, depthWrite: false })
);
blob.rotation.x = -Math.PI / 2;
blob.position.y = 0.005;
scene.add(blob);

// Materials
const grey = new THREE.MeshStandardMaterial({ color: 0x7d838a, metalness: 0.75, roughness: 0.38 });
const darkGrey = new THREE.MeshStandardMaterial({ color: 0x565b61, metalness: 0.7, roughness: 0.45 });
const panelMat = new THREE.MeshStandardMaterial({ color: 0x4a4f55, metalness: 0.6, roughness: 0.55 });
const lensMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, emissive: 0xfff3d8, emissiveIntensity: 1.6, roughness: 0.3, metalness: 0.0
});

const lamp = new THREE.Group();
scene.add(lamp);

function add(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  lamp.add(mesh);
  return mesh;
}

// Base plinth
const base = add(new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.42, 0.22, 32), darkGrey));
base.position.y = 0.11;
const baseCap = add(new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.34, 0.14, 32), darkGrey));
baseCap.position.y = 0.29;

// Tapered pole
const POLE_H = 6.2;
const pole = add(new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.16, POLE_H, 24), grey));
pole.position.y = 0.36 + POLE_H / 2;
const poleTop = add(new THREE.Mesh(new THREE.SphereGeometry(0.078, 16, 12), grey));
poleTop.position.y = 0.36 + POLE_H;

// Access-panel door near the base
const door = add(new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.5, 0.03), panelMat));
door.position.set(0, 0.75, 0.145);
const latch = add(new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.02, 12), darkGrey));
latch.rotation.x = Math.PI / 2;
latch.position.set(0.035, 0.75, 0.165);

// Curved mounting arm (sweeps out along +X near the top)
const armY = 0.36 + POLE_H - 0.15;
const armCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, armY, 0),
  new THREE.Vector3(0.35, armY + 0.42, 0),
  new THREE.Vector3(0.95, armY + 0.62, 0),
  new THREE.Vector3(1.55, armY + 0.66, 0)
]);
add(new THREE.Mesh(new THREE.TubeGeometry(armCurve, 32, 0.05, 12, false), grey));
const armTip = add(new THREE.Mesh(new THREE.SphereGeometry(0.052, 12, 10), grey));
armTip.position.set(1.55, armY + 0.66, 0);

// Rectangular LED luminaire head
const headY = armY + 0.66;
const head = new THREE.Group();
head.position.set(1.85, headY, 0);
head.rotation.z = -0.04;
lamp.add(head);

const housing = new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.12, 0.42), grey);
housing.castShadow = true;
housing.receiveShadow = true;
head.add(housing);

const spine = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.06, 0.3), darkGrey);
spine.position.y = 0.09;
spine.castShadow = true;
head.add(spine);

// LED lens panel (underside)
const lens = new THREE.Mesh(new THREE.BoxGeometry(0.88, 0.02, 0.32), lensMat);
lens.position.y = -0.065;
head.add(lens);

// LED dot grid detail
const dotGeo = new THREE.CylinderGeometry(0.028, 0.028, 0.01, 10);
const dotMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 2.2 });
for (let i = 0; i < 6; i++) {
  for (let j = 0; j < 2; j++) {
    const dot = new THREE.Mesh(dotGeo, dotMat);
    dot.position.set(-0.36 + i * 0.145, -0.077, -0.08 + j * 0.16);
    head.add(dot);
  }
}

// Warm light cast from the luminaire
const lampLight = new THREE.SpotLight(0xffe6b8, 60, 14, Math.PI / 4, 0.6, 2);
lampLight.position.set(1.85, headY - 0.1, 0);
lampLight.target.position.set(1.85, 0, 0);
lampLight.castShadow = true;
lampLight.shadow.mapSize.set(1024, 1024);
lampLight.shadow.bias = -0.0004;
lamp.add(lampLight, lampLight.target);

// Faint warm pool on the ground under the head
const pool = new THREE.Mesh(
  new THREE.CircleGeometry(1.9, 48),
  new THREE.MeshBasicMaterial({ color: 0xffdf9e, transparent: true, opacity: 0.08, depthWrite: false })
);
pool.rotation.x = -Math.PI / 2;
pool.position.set(1.85, 0.01, 0);
scene.add(pool);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
