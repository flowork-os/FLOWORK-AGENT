<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue and White Porcelain Teapot</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(circle at 50% 35%, #f8f6f0 0%, #d8e0e4 58%, #abb8bf 100%);
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe6ecee);
scene.fog = new THREE.Fog(0xe6ecee, 13, 24);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 50);
camera.position.set(7.1, 4.1, 8.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setAnimationLoop(render);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.15, 0.32, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.72;
controls.minDistance = 6;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.49;

const porcelain = new THREE.MeshPhysicalMaterial({
  color: 0xfffdf8,
  roughness: 0.19,
  metalness: 0,
  clearcoat: 1,
  clearcoatRoughness: 0.11,
  ior: 1.52,
  specularIntensity: 1,
  specularColor: new THREE.Color(0xffffff)
});

const cobalt = new THREE.MeshPhysicalMaterial({
  color: 0x073f98,
  roughness: 0.22,
  metalness: 0,
  clearcoat: 0.9,
  clearcoatRoughness: 0.13,
  side: THREE.DoubleSide
});

const deepCobalt = new THREE.MeshPhysicalMaterial({
  color: 0x03275f,
  roughness: 0.3,
  clearcoat: 0.65,
  clearcoatRoughness: 0.18
});

function createPorcelainTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 2048;
  canvas.height = 1024;
  const ctx = canvas.getContext('2d');

  const baseGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  baseGradient.addColorStop(0, '#fffefa');
  baseGradient.addColorStop(0.48, '#f9f8f2');
  baseGradient.addColorStop(1, '#fffdf8');
  ctx.fillStyle = baseGradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = '#064397';
  ctx.fillStyle = '#064397';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  function horizontalBand(y, width) {
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }

  horizontalBand(92, 16);
  horizontalBand(121, 5);
  horizontalBand(845, 5);
  horizontalBand(878, 17);
  horizontalBand(913, 4);

  function leaf(x, y, angle, length, width) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(width, -length * 0.22, width, -length * 0.76, 0, -length);
    ctx.bezierCurveTo(-width, -length * 0.76, -width, -length * 0.22, 0, 0);
    ctx.fill();
    ctx.restore();
  }

  function blossom(cx, cy, scale) {
    for (let i = 0; i < 6; i++) {
      leaf(cx, cy, i * Math.PI / 3, 71 * scale, 25 * scale);
    }
    ctx.fillStyle = '#f9f8f2';
    ctx.beginPath();
    ctx.arc(cx, cy, 15 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#064397';
    ctx.beginPath();
    ctx.arc(cx, cy, 8 * scale, 0, Math.PI * 2);
    ctx.fill();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * 24 * scale, cy + Math.sin(a) * 24 * scale, 4.5 * scale, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function floralPanel(cx, cy, scale) {
    ctx.lineWidth = 8 * scale;
    ctx.beginPath();
    ctx.moveTo(cx - 8 * scale, cy + 202 * scale);
    ctx.bezierCurveTo(cx - 25 * scale, cy + 110 * scale, cx + 28 * scale, cy + 72 * scale, cx, cy);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx - 8 * scale, cy + 172 * scale);
    ctx.bezierCurveTo(cx - 92 * scale, cy + 132 * scale, cx - 104 * scale, cy + 64 * scale, cx - 118 * scale, cy + 20 * scale);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx + 2 * scale, cy + 133 * scale);
    ctx.bezierCurveTo(cx + 77 * scale, cy + 106 * scale, cx + 88 * scale, cy + 50 * scale, cx + 100 * scale, cy + 10 * scale);
    ctx.stroke();

    leaf(cx - 56 * scale, cy + 133 * scale, -1.02, 73 * scale, 22 * scale);
    leaf(cx - 83 * scale, cy + 83 * scale, 1.02, 68 * scale, 21 * scale);
    leaf(cx + 45 * scale, cy + 103 * scale, 1.03, 75 * scale, 23 * scale);
    leaf(cx + 61 * scale, cy + 57 * scale, -1.05, 66 * scale, 20 * scale);
    leaf(cx - 9 * scale, cy + 174 * scale, 0.83, 67 * scale, 21 * scale);

    blossom(cx, cy, scale);
    blossom(cx - 120 * scale, cy + 8 * scale, scale * 0.54);
    blossom(cx + 103 * scale, cy - 1 * scale, scale * 0.49);

    for (const offset of [-160, -133, 132, 157]) {
      ctx.beginPath();
      ctx.arc(cx + offset * scale, cy + 76 * scale, 7 * scale, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  for (let x = 170; x < canvas.width + 300; x += 410) {
    floralPanel(x, 425, 0.92);
  }

  ctx.globalAlpha = 0.48;
  ctx.lineWidth = 3;
  for (let x = 0; x < canvas.width; x += 32) {
    const y = 892 + Math.sin(x * 0.045) * 7;
    ctx.beginPath();
    ctx.arc(x, y, 3.2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);
  texture.wrapS = THREE.RepeatWrapping;
  texture.needsUpdate = true;
  return texture;
}

const decoratedPorcelain = porcelain.clone();
decoratedPorcelain.map = createPorcelainTexture();
decoratedPorcelain.needsUpdate = true;

const teapot = new THREE.Group();
teapot.rotation.y = -0.14;
scene.add(teapot);

const bodyProfile = [
  new THREE.Vector2(0.05, -1.23),
  new THREE.Vector2(0.54, -1.22),
  new THREE.Vector2(1.02, -1.11),
  new THREE.Vector2(1.40, -0.86),
  new THREE.Vector2(1.65, -0.48),
  new THREE.Vector2(1.76, -0.02),
  new THREE.Vector2(1.72, 0.48),
  new THREE.Vector2(1.55, 0.88),
  new THREE.Vector2(1.28, 1.14),
  new THREE.Vector2(0.98, 1.27),
  new THREE.Vector2(0.68, 1.30),
  new THREE.Vector2(0.48, 1.28)
];

const bodyGeometry = new THREE.LatheGeometry(bodyProfile, 128);
bodyGeometry.computeVertexNormals();
const body = new THREE.Mesh(bodyGeometry, decoratedPorcelain);
body.castShadow = true;
body.receiveShadow = true;
teapot.add(body);

function horizontalRing(radius, tube, y, material = cobalt) {
  const geometry = new THREE.TorusGeometry(radius, tube, 12, 128);
  const ring = new THREE.Mesh(geometry, material);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = y;
  ring.castShadow = true;
  teapot.add(ring);
  return ring;
}

horizontalRing(0.54, 0.044, 1.285);
horizontalRing(1.00, 0.028, 1.22);
horizontalRing(1.36, 0.029, -0.92);
horizontalRing(1.17, 0.026, -1.08);

const footGeometry = new THREE.CylinderGeometry(0.84, 0.98, 0.18, 96);
const foot = new THREE.Mesh(footGeometry, porcelain);
foot.position.y = -1.29;
foot.castShadow = true;
foot.receiveShadow = true;
teapot.add(foot);
horizontalRing(0.96, 0.034, -1.37);

const lidProfile = [
  new THREE.Vector2(0.13, 1.29),
  new THREE.Vector2(0.73, 1.29),
  new THREE.Vector2(1.08, 1.34),
  new THREE.Vector2(1.22, 1.43),
  new THREE.Vector2(1.15, 1.57),
  new THREE.Vector2(0.97, 1.72),
  new THREE.Vector2(0.70, 1.85),
  new THREE.Vector2(0.40, 1.93),
  new THREE.Vector2(0.16, 1.96),
  new THREE.Vector2(0.05, 1.96)
];

const lid = new THREE.Mesh(new THREE.LatheGeometry(lidProfile, 128), porcelain);
lid.castShadow = true;
lid.receiveShadow = true;
teapot.add(lid);

horizontalRing(1.18, 0.037, 1.43);
horizontalRing(0.77, 0.026, 1.82);

for (let i = 0; i < 12; i++) {
  const angle = i * Math.PI * 2 / 12;
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 10), cobalt);
  dot.scale.set(1, 0.65, 0.28);
  dot.position.set(Math.sin(angle) * 0.92, 1.66, Math.cos(angle) * 0.92);
  dot.lookAt(new THREE.Vector3(0, 1.66, 0));
  dot.rotateY(Math.PI);
  teapot.add(dot);
}

const knobStem = new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.25, 0.19, 48), porcelain);
knobStem.position.y = 2.03;
knobStem.castShadow = true;
teapot.add(knobStem);

const knob = new THREE.Mesh(new THREE.SphereGeometry(0.32, 48, 28), porcelain);
knob.scale.y = 0.78;
knob.position.y = 2.20;
knob.castShadow = true;
teapot.add(knob);

const knobCap = new THREE.Mesh(new THREE.SphereGeometry(0.17, 32, 18), cobalt);
knobCap.scale.set(1, 0.36, 1);
knobCap.position.y = 2.40;
knobCap.castShadow = true;
teapot.add(knobCap);

const spoutCurve = new THREE.CubicBezierCurve3(
  new THREE.Vector3(1.37, 0.45, 0),
  new THREE.Vector3(2.05, 0.52, 0),
  new THREE.Vector3(2.22, 1.51, 0),
  new THREE.Vector3(3.03, 1.47, 0)
);

const spoutGeometry = new THREE.TubeGeometry(spoutCurve, 80, 0.245, 32, false);
const spout = new THREE.Mesh(spoutGeometry, porcelain);
spout.castShadow = true;
spout.receiveShadow = true;
teapot.add(spout);

const spoutRoot = new THREE.Mesh(new THREE.SphereGeometry(0.48, 48, 28), porcelain);
spoutRoot.scale.set(1.05, 0.84, 0.78);
spoutRoot.position.set(1.38, 0.43, 0);
spoutRoot.castShadow = true;
teapot.add(spoutRoot);

function alignedCylinder(radiusTop, radiusBottom, length, position, direction, material, radialSegments = 48) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, length, radialSegments),
    material
  );
  mesh.position.copy(position);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.clone().normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  teapot.add(mesh);
  return mesh;
}

const spoutEnd = spoutCurve.getPoint(1);
const spoutDirection = spoutCurve.getTangent(1).normalize();

alignedCylinder(
  0.285,
  0.272,
  0.11,
  spoutEnd.clone().addScaledVector(spoutDirection, -0.055),
  spoutDirection,
  cobalt
);

alignedCylinder(
  0.335,
  0.292,
  0.18,
  spoutEnd.clone().addScaledVector(spoutDirection, 0.055),
  spoutDirection,
  porcelain
);

const mouth = alignedCylinder(
  0.238,
  0.238,
  0.012,
  spoutEnd.clone().addScaledVector(spoutDirection, 0.151),
  spoutDirection,
  deepCobalt
);
mouth.receiveShadow = false;

const handleCurve = new THREE.CubicBezierCurve3(
  new THREE.Vector3(-1.38, 0.76, 0),
  new THREE.Vector3(-3.07, 1.25, 0),
  new THREE.Vector3(-3.05, -1.22, 0),
  new THREE.Vector3(-1.38, -0.73, 0)
);

const handle = new THREE.Mesh(
  new THREE.TubeGeometry(handleCurve, 96, 0.205, 28, false),
  porcelain
);
handle.castShadow = true;
handle.receiveShadow = true;
teapot.add(handle);

const handleInsetCurve = new THREE.CubicBezierCurve3(
  new THREE.Vector3(-1.48, 0.73, 0),
  new THREE.Vector3(-2.87, 1.06, 0),
  new THREE.Vector3(-2.85, -1.01, 0),
  new THREE.Vector3(-1.48, -0.69, 0)
);

const handleAccent = new THREE.Mesh(
  new THREE.TubeGeometry(handleInsetCurve, 96, 0.038, 12, false),
  cobalt
);
handleAccent.castShadow = true;
teapot.add(handleAccent);

for (const attachment of [
  { x: -1.40, y: 0.75, sy: 0.42 },
  { x: -1.40, y: -0.73, sy: 0.38 }
]) {
  const mount = new THREE.Mesh(new THREE.SphereGeometry(0.38, 40, 24), porcelain);
  mount.scale.set(0.95, attachment.sy / 0.38, 0.82);
  mount.position.set(attachment.x, attachment.y, 0);
  mount.castShadow = true;
  teapot.add(mount);

  const medallion = new THREE.Mesh(new THREE.SphereGeometry(0.17, 24, 16), cobalt);
  medallion.scale.set(0.28, 1, 1);
  medallion.position.set(attachment.x - 0.34, attachment.y, 0);
  medallion.castShadow = true;
  teapot.add(medallion);
}

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(8, 128),
  new THREE.MeshStandardMaterial({
    color: 0xdce2e1,
    roughness: 0.82,
    metalness: 0
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.405;
ground.receiveShadow = true;
scene.add(ground);

const backdrop = new THREE.Mesh(
  new THREE.CircleGeometry(13, 128),
  new THREE.MeshBasicMaterial({
    color: 0xe8edef,
    transparent: true,
    opacity: 0.32,
    side: THREE.DoubleSide,
    depthWrite: false
  })
);
backdrop.position.set(0, 2.3, -7);
scene.add(backdrop);

const hemisphere = new THREE.HemisphereLight(0xeef7ff, 0x6e655b, 2.05);
scene.add(hemisphere);

const keyLight = new THREE.DirectionalLight(0xfff5e8, 4.4);
keyLight.position.set(5.5, 8.5, 6.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -5;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 24;
keyLight.shadow.bias = -0.00025;
keyLight.shadow.normalBias = 0.025;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x9fc9ff, 2.0);
fillLight.position.set(-5, 3.2, 5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 2.7);
rimLight.position.set(-2.5, 5.5, -6);
scene.add(rimLight);

const warmBounce = new THREE.PointLight(0xffd5ac, 1.15, 12, 2);
warmBounce.position.set(2.5, -0.3, 3.5);
scene.add(warmBounce);

function render() {
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>
</body>
</html>
