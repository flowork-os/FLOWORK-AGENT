<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bronze-Age Helmet</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1012; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ *
 *  Renderer
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const maxAniso = renderer.capabilities.getMaxAnisotropy();

/* ------------------------------------------------------------------ *
 *  Scene & camera
 * ------------------------------------------------------------------ */
const scene = new THREE.Scene();

function makeCanvas(s){ const c = document.createElement('canvas'); c.width = c.height = s; return c; }

// Neutral dark studio backdrop (soft radial vignette)
(function(){
  const c = makeCanvas(512); const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(256, 210, 30, 256, 300, 380);
  g.addColorStop(0.0, '#33373d');
  g.addColorStop(0.55, '#1c1f23');
  g.addColorStop(1.0, '#0c0e10');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
})();

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.05, 50);
camera.position.set(0.34, 0.19, 0.44);

// Image-based lighting for believable metal reflections
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ *
 *  Lighting: hemisphere + key/fill/rim, soft shadows
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0x9fb4c8, 0x2a2018, 0.35);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e0, 2.3);
key.position.set(0.6, 0.95, 0.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.2;
key.shadow.camera.far = 3;
key.shadow.camera.left = -0.35;
key.shadow.camera.right = 0.35;
key.shadow.camera.top = 0.35;
key.shadow.camera.bottom = -0.35;
key.shadow.bias = -0.0005;
key.shadow.normalBias = 0.02;
key.shadow.radius = 3;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd0e0, 0.5);
fill.position.set(-0.7, 0.25, 0.35);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xcfe0ff, 1.25);
rim.position.set(-0.35, 0.45, -0.7);
scene.add(rim);

/* ------------------------------------------------------------------ *
 *  Procedural patinated-bronze textures
 * ------------------------------------------------------------------ */
const BLOBS = [];
for (let i = 0; i < 190; i++){
  BLOBS.push({ x: Math.random(), y: Math.random(), r: 0.02 + Math.random() * 0.13, t: Math.random() });
}

function paintMap(kind){
  const S = 1024;
  const c = makeCanvas(S);
  const ctx = c.getContext('2d');
  ctx.fillStyle = kind === 'color' ? '#7c5a30' : kind === 'rough' ? '#8f8f8f' : '#e6e6e6';
  ctx.fillRect(0, 0, S, S);

  for (const b of BLOBS){
    const x = b.x * S, y = b.y * S, r = b.r * S;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    let col, a;
    if (b.t < 0.55){                       // verdigris patina
      col = kind === 'color' ? 'rgba(70,132,104,' : kind === 'rough' ? 'rgba(222,222,222,' : 'rgba(38,38,38,';
      a = 0.35 + 0.4 * (1 - b.t / 0.55);
    } else if (b.t < 0.78){                // dark corrosion pitting
      col = kind === 'color' ? 'rgba(40,54,44,' : kind === 'rough' ? 'rgba(200,200,200,' : 'rgba(52,52,52,';
      a = 0.5;
    } else {                               // worn / polished bare metal
      col = kind === 'color' ? 'rgba(196,150,86,' : kind === 'rough' ? 'rgba(88,88,88,' : 'rgba(255,255,255,';
      a = 0.45;
    }
    g.addColorStop(0, col + a + ')');
    g.addColorStop(1, col + '0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }

  // fine speckle / hammered grain
  for (let i = 0; i < 2400; i++){
    const x = Math.random() * S, y = Math.random() * S, s = Math.random() * 1.6 + 0.4;
    if (kind === 'color') ctx.fillStyle = 'rgba(' + (Math.random() < 0.5 ? '22,32,26' : '210,180,120') + ',' + (0.05 + Math.random() * 0.12) + ')';
    else if (kind === 'rough') ctx.fillStyle = 'rgba(255,255,255,' + (0.04 + Math.random() * 0.1) + ')';
    else ctx.fillStyle = 'rgba(0,0,0,' + (0.04 + Math.random() * 0.08) + ')';
    ctx.fillRect(x, y, s, s);
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = maxAniso;
  if (kind === 'color') tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const colorTex = paintMap('color');
const roughTex = paintMap('rough');
const metalTex = paintMap('metal');
[colorTex, roughTex, metalTex].forEach(t => t.repeat.set(2.4, 1.6));

const bronze = new THREE.MeshStandardMaterial({
  map: colorTex,
  roughnessMap: roughTex,
  metalnessMap: metalTex,
  bumpMap: roughTex,
  bumpScale: 0.02,
  metalness: 1.0,
  roughness: 1.0,
  envMapIntensity: 0.85,
  side: THREE.DoubleSide
});

const rivetMat = new THREE.MeshStandardMaterial({
  color: 0x8a6a3c, metalness: 1.0, roughness: 0.42, envMapIntensity: 1.0
});

/* ------------------------------------------------------------------ *
 *  Geometry helpers
 * ------------------------------------------------------------------ */
const R = 0.115;   // rim radius
const H = 0.20;    // dome height
const WALL = 0.011;

// Turn an outer profile into a closed thin shell (gives visible edge thickness)
function shellProfile(outer, wall){
  const out = outer.map(p => p.clone());
  const inner = [];
  for (let i = 0; i < out.length; i++){
    const a = out[Math.max(0, i - 1)];
    const b = out[Math.min(out.length - 1, i + 1)];
    let tx = b.x - a.x, ty = b.y - a.y;
    const L = Math.hypot(tx, ty) || 1; tx /= L; ty /= L;
    const nx = ty, ny = -tx;                      // outward normal
    inner.push(new THREE.Vector2(Math.max(0.001, out[i].x - nx * wall), out[i].y - ny * wall));
  }
  inner.reverse();
  return out.concat(inner).concat([out[0].clone()]);
}

// Rounded dome skull with hand-hammered dents
function domeGeometry(){
  const outer = [];
  const N = 54;
  for (let i = 0; i <= N; i++){
    const t = i / N;
    const a = t * Math.PI / 2;
    const r = R * Math.pow(Math.cos(a), 1.04);
    const y = H * Math.pow(Math.sin(a), 0.92);
    outer.push(new THREE.Vector2(Math.max(0.004, r), y));
  }
  const geo = new THREE.LatheGeometry(shellProfile(outer, WALL), 128);

  // Dents: displace toward an interior centre so wall thickness is preserved
  const pos = geo.attributes.position;
  const c = new THREE.Vector3(0, H * 0.45, 0);
  const dents = [
    { p: new THREE.Vector3( 0.075, 0.11,  0.055), r: 0.050, d: 0.013 },
    { p: new THREE.Vector3(-0.090, 0.05, -0.030), r: 0.045, d: 0.010 },
    { p: new THREE.Vector3( 0.020, 0.165,-0.050), r: 0.040, d: 0.008 },
    { p: new THREE.Vector3(-0.045, 0.09,  0.100), r: 0.050, d: 0.010 }
  ];
  const v = new THREE.Vector3(), dir = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++){
    v.fromBufferAttribute(pos, i);
    dir.subVectors(c, v).normalize();
    let amt = 0;
    for (const d of dents){
      const dist = v.distanceTo(d.p);
      amt += d.d * Math.exp(-(dist * dist) / (d.r * d.r));
    }
    amt += 0.0016 * Math.sin(v.x * 95) * Math.sin(v.y * 82) * Math.cos(v.z * 88); // hammered ripple
    v.addScaledVector(dir, amt);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

// Raised central ridge / crest sweeping front-to-back over the dome
function crestGeometry(){
  const M = 64;
  const path = [], out = [], hs = [];
  const c = new THREE.Vector3(0, H * 0.45, 0);
  for (let i = 0; i <= M; i++){
    const s = i / M;
    const ang = (s - 0.5) * Math.PI;              // -90°(back) .. +90°(front)
    const a = Math.PI / 2 - Math.abs(ang);        // 0 at rim, 90° at top
    const r = R * Math.pow(Math.cos(a), 1.04);
    const y = H * Math.pow(Math.sin(a), 0.92);
    const z = Math.sign(ang || 1e-6) * r;
    const P = new THREE.Vector3(0, y, z);
    path.push(P);
    out.push(P.clone().sub(c).normalize());
    hs.push(0.28 + 0.72 * Math.pow(Math.sin(s * Math.PI), 0.7));
  }
  const cross = [[-1, 0], [-0.62, 0.5], [0, 1], [0.62, 0.5], [1, 0]];
  const K = cross.length;
  const halfW = 0.014, baseH = 0.032, embed = 0.006;

  const verts = [], uvs = [], idx = [];
  for (let i = 0; i <= M; i++){
    for (let k = 0; k < K; k++){
      const w = cross[k][0] * halfW;
      const h = cross[k][1] * baseH * hs[i] - embed;
      verts.push(
        path[i].x + w + out[i].x * h,
        path[i].y + out[i].y * h,
        path[i].z + out[i].z * h
      );
      uvs.push(i / M, k / (K - 1));
    }
  }
  for (let i = 0; i < M; i++){
    for (let k = 0; k < K - 1; k++){
      const a0 = i * K + k, a1 = i * K + k + 1, b0 = (i + 1) * K + k, b1 = (i + 1) * K + k + 1;
      idx.push(a0, b0, a1, a1, b0, b1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// Partial lathe used for the flared neck guard and the cheek guards
function skirtGeometry(outer, wall, phiStart, phiLen, seg){
  return new THREE.LatheGeometry(shellProfile(outer, wall), seg, phiStart, phiLen);
}

// Flared neck guard profile (kicks outward & down at the back)
const neckOuter = [];
for (let i = 0; i <= 20; i++){
  const t = i / 20;
  neckOuter.push(new THREE.Vector2(R * 0.992 + 0.06 * Math.pow(t, 1.35), -0.08 * t));
}

// Cheek guard profile (hangs down, curves inward toward the jaw)
const cheekOuter = [];
for (let i = 0; i <= 22; i++){
  const t = i / 22;
  const y = -0.105 * Math.sin(t * Math.PI / 2);
  const r = R * 0.985 - 0.02 * Math.pow(t, 1.8);
  cheekOuter.push(new THREE.Vector2(Math.max(0.02, r), y));
}

/* ------------------------------------------------------------------ *
 *  Assemble the single helmet object
 * ------------------------------------------------------------------ */
const helmet = new THREE.Group();

const parts = [
  new THREE.Mesh(domeGeometry(), bronze),                                        // skull
  new THREE.Mesh(crestGeometry(), bronze),                                       // central ridge / crest
  new THREE.Mesh(skirtGeometry(neckOuter, 0.008, Math.PI - 1.25, 2.5, 80), bronze), // neck guard (back)
  new THREE.Mesh(skirtGeometry(cheekOuter, 0.007, 0.5, 0.8, 44), bronze),        // right cheek guard
  new THREE.Mesh(skirtGeometry(cheekOuter, 0.007, 4.9832, 0.8, 44), bronze)      // left cheek guard
];
for (const m of parts){ m.castShadow = true; m.receiveShadow = true; helmet.add(m); }

// Decorative rivets along the front brow
const rivetGeo = new THREE.SphereGeometry(0.006, 16, 12);
for (let i = 0; i < 9; i++){
  const phi = -0.85 + (1.7 * i / 8);
  const r = R * 0.99 * 1.005, y = 0.03;
  const rivet = new THREE.Mesh(rivetGeo, rivetMat);
  rivet.position.set(r * Math.sin(phi), y, r * Math.cos(phi));
  rivet.scale.set(1, 0.55, 1);
  rivet.castShadow = true;
  helmet.add(rivet);
}

// Slightly ovoid (front-to-back) like a real head, then centre at origin
helmet.scale.set(1, 1, 1.05);
scene.add(helmet);

let box = new THREE.Box3().setFromObject(helmet);
const center = box.getCenter(new THREE.Vector3());
helmet.position.sub(center);
box = new THREE.Box3().setFromObject(helmet);

/* ------------------------------------------------------------------ *
 *  Ground plane that only receives shadows
 * ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 6),
  new THREE.ShadowMaterial({ opacity: 0.4 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = box.min.y - 0.001;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ *
 *  Controls
 * ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 0.3;
controls.maxDistance = 1.5;
controls.target.set(0, 0, 0);
controls.update();

/* ------------------------------------------------------------------ *
 *  Loop & resize
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
