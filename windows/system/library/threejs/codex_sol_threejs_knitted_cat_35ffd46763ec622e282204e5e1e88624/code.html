<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amigurumi Crocheted Cat</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eee5d8;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeee5d8);
scene.fog = new THREE.Fog(0xeee5d8, 12, 22);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(7.2, 5.2, 10.5);
camera.lookAt(0, 2.3, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.35, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 7;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.54;

const hemi = new THREE.HemisphereLight(0xfff5df, 0x655e69, 2.25);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffe5c4, 4.5);
keyLight.position.set(5, 8, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -4;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 24;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xc8d9ff, 1.65);
fillLight.position.set(-5, 4, 3);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xffc8a4, 28, 16, 2);
rimLight.position.set(1, 6, -5);
scene.add(rimLight);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xd9cbbb,
  roughness: 0.92,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(7.5, 96), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.02;
floor.receiveShadow = true;
scene.add(floor);

const yarnColor = 0xb97852;
const yarnLight = 0xd39a73;
const yarnDark = 0x8d543b;
const creamColor = 0xe9d3b3;
const pinkColor = 0xb96b69;
const threadColor = 0x342d2c;

const yarnMaterial = new THREE.MeshStandardMaterial({
  color: yarnColor,
  roughness: 0.96,
  metalness: 0,
  bumpScale: 0.18
});
const stitchMaterial = new THREE.MeshStandardMaterial({
  color: yarnLight,
  roughness: 1,
  metalness: 0
});
const darkStitchMaterial = new THREE.MeshStandardMaterial({
  color: yarnDark,
  roughness: 1,
  metalness: 0
});
const creamMaterial = new THREE.MeshStandardMaterial({
  color: creamColor,
  roughness: 0.98,
  metalness: 0
});
const pinkMaterial = new THREE.MeshStandardMaterial({
  color: pinkColor,
  roughness: 0.9,
  metalness: 0
});
const threadMaterial = new THREE.MeshStandardMaterial({
  color: threadColor,
  roughness: 0.82,
  metalness: 0
});

const cat = new THREE.Group();
cat.rotation.y = -0.08;
scene.add(cat);

const up = new THREE.Vector3(0, 1, 0);
const zAxis = new THREE.Vector3(0, 0, 1);
const tempMatrix = new THREE.Matrix4();
const tempQuaternion = new THREE.Quaternion();
const tempScale = new THREE.Vector3();
const tempPosition = new THREE.Vector3();

function setShadows(object) {
  object.traverse(child => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });
}

function ellipsoid(position, scale, material, segments = 48) {
  const geometry = new THREE.SphereGeometry(1, segments, Math.floor(segments * 0.65));
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  cat.add(mesh);
  return mesh;
}

function addCrochetStitches(position, radii, rows, columns, material, offset = 0.018) {
  const rodGeometry = new THREE.CylinderGeometry(0.027, 0.031, 1, 6, 1, false);
  const count = rows * columns * 2;
  const instanced = new THREE.InstancedMesh(rodGeometry, material, count);
  let index = 0;

  for (let row = 0; row < rows; row++) {
    const phi = 0.22 + (Math.PI - 0.44) * (row + 0.5) / rows;
    const rowShift = row % 2 ? 0.5 : 0;

    for (let col = 0; col < columns; col++) {
      const theta = Math.PI * 2 * (col + rowShift) / columns;
      const sinPhi = Math.sin(phi);
      const cosPhi = Math.cos(phi);
      const cosTheta = Math.cos(theta);
      const sinTheta = Math.sin(theta);

      const surface = new THREE.Vector3(
        radii.x * sinPhi * cosTheta,
        radii.y * cosPhi,
        radii.z * sinPhi * sinTheta
      );

      const normal = new THREE.Vector3(
        surface.x / (radii.x * radii.x),
        surface.y / (radii.y * radii.y),
        surface.z / (radii.z * radii.z)
      ).normalize();

      const longitude = new THREE.Vector3(
        -radii.x * sinPhi * sinTheta,
        0,
        radii.z * sinPhi * cosTheta
      ).normalize();

      const latitude = new THREE.Vector3(
        radii.x * cosPhi * cosTheta,
        -radii.y * sinPhi,
        radii.z * cosPhi * sinTheta
      ).normalize();

      const center = surface.addScaledVector(normal, offset).add(position);
      const length = Math.min(0.16, (Math.PI * 2 * Math.max(radii.x, radii.z) * sinPhi / columns) * 0.62);
      const halfGap = length * 0.22;

      for (let side = -1; side <= 1; side += 2) {
        const direction = latitude.clone().multiplyScalar(0.76).addScaledVector(longitude, side * 0.65).normalize();
        const segmentCenter = center.clone()
          .addScaledVector(longitude, side * halfGap)
          .addScaledVector(latitude, length * 0.18);

        tempQuaternion.setFromUnitVectors(up, direction);
        tempScale.set(1, length, 1);
        tempMatrix.compose(segmentCenter, tempQuaternion, tempScale);
        instanced.setMatrixAt(index++, tempMatrix);
      }
    }
  }

  instanced.count = index;
  instanced.castShadow = true;
  instanced.receiveShadow = true;
  cat.add(instanced);
  return instanced;
}

function addCrochetedEllipsoid(position, scale, rows, columns, baseMaterial = yarnMaterial, detailMaterial = stitchMaterial) {
  const mesh = ellipsoid(position, scale, baseMaterial);
  addCrochetStitches(position, scale, rows, columns, detailMaterial);
  return mesh;
}

function tube(points, radius, material, tubularSegments = 28, radialSegments = 7, closed = false) {
  const curve = new THREE.CatmullRomCurve3(points, closed, 'centripetal');
  const geometry = new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, closed);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  cat.add(mesh);
  return mesh;
}

function addTail() {
  const points = [
    new THREE.Vector3(0.92, 1.55, -0.48),
    new THREE.Vector3(1.48, 1.25, -0.38),
    new THREE.Vector3(1.88, 0.77, -0.10),
    new THREE.Vector3(1.85, 0.34, 0.34),
    new THREE.Vector3(1.50, 0.23, 0.64),
    new THREE.Vector3(1.20, 0.48, 0.75),
    new THREE.Vector3(1.30, 0.78, 0.72)
  ];
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const tailGeometry = new THREE.TubeGeometry(curve, 64, 0.285, 14, false);
  const tail = new THREE.Mesh(tailGeometry, yarnMaterial);
  tail.castShadow = true;
  tail.receiveShadow = true;
  cat.add(tail);

  const ringGeometry = new THREE.TorusGeometry(1, 0.055, 5, 14);
  const ringCount = 26;
  const rings = new THREE.InstancedMesh(ringGeometry, stitchMaterial, ringCount);

  for (let i = 0; i < ringCount; i++) {
    const t = 0.035 + i / (ringCount - 1) * 0.93;
    curve.getPointAt(t, tempPosition);
    const tangent = curve.getTangentAt(t).normalize();
    tempQuaternion.setFromUnitVectors(zAxis, tangent);
    tempScale.set(0.285, 0.285, 0.285);
    tempMatrix.compose(tempPosition, tempQuaternion, tempScale);
    rings.setMatrixAt(i, tempMatrix);
  }
  rings.castShadow = true;
  cat.add(rings);

  addCrochetedEllipsoid(
    new THREE.Vector3(1.30, 0.80, 0.72),
    new THREE.Vector3(0.33, 0.34, 0.33),
    5,
    8,
    yarnMaterial,
    stitchMaterial
  );
}

addTail();

addCrochetedEllipsoid(
  new THREE.Vector3(0, 1.63, 0),
  new THREE.Vector3(1.28, 1.62, 1.08),
  19,
  28
);

addCrochetedEllipsoid(
  new THREE.Vector3(0, 3.38, 0.08),
  new THREE.Vector3(1.42, 1.22, 1.25),
  17,
  30
);

addCrochetedEllipsoid(
  new THREE.Vector3(-0.76, 0.48, 0.51),
  new THREE.Vector3(0.68, 0.46, 0.78),
  7,
  13
);
addCrochetedEllipsoid(
  new THREE.Vector3(0.76, 0.48, 0.51),
  new THREE.Vector3(0.68, 0.46, 0.78),
  7,
  13
);

const leftArm = addCrochetedEllipsoid(
  new THREE.Vector3(-1.02, 1.73, 0.45),
  new THREE.Vector3(0.43, 1.05, 0.48),
  11,
  11
);
leftArm.rotation.z = -0.26;

const rightArm = addCrochetedEllipsoid(
  new THREE.Vector3(1.02, 1.73, 0.45),
  new THREE.Vector3(0.43, 1.05, 0.48),
  11,
  11
);
rightArm.rotation.z = 0.26;

function createEar(x, tilt) {
  const earGroup = new THREE.Group();
  earGroup.position.set(x, 4.38, -0.02);
  earGroup.rotation.z = tilt;

  const outer = new THREE.Mesh(
    new THREE.ConeGeometry(0.69, 1.38, 24, 8, false),
    yarnMaterial
  );
  outer.scale.z = 0.72;
  outer.position.y = 0.26;
  outer.castShadow = true;
  earGroup.add(outer);

  const inner = new THREE.Mesh(
    new THREE.ConeGeometry(0.38, 0.86, 20, 5, false),
    pinkMaterial
  );
  inner.scale.z = 0.17;
  inner.position.set(0, 0.20, 0.49);
  inner.castShadow = true;
  earGroup.add(inner);

  const rowGeometry = new THREE.TorusGeometry(1, 0.035, 5, 20, Math.PI);
  for (let i = 0; i < 5; i++) {
    const y = -0.19 + i * 0.21;
    const width = 0.50 * (1 - (y + 0.20) / 1.25);
    if (width <= 0.08) continue;
    const row = new THREE.Mesh(rowGeometry, stitchMaterial);
    row.scale.set(width, width * 0.34, width);
    row.rotation.x = Math.PI / 2;
    row.rotation.z = Math.PI;
    row.position.set(0, y, 0.51);
    earGroup.add(row);
  }

  cat.add(earGroup);
}
createEar(-0.83, -0.12);
createEar(0.83, 0.12);

addCrochetedEllipsoid(
  new THREE.Vector3(-0.35, 3.06, 1.10),
  new THREE.Vector3(0.54, 0.40, 0.31),
  6,
  10,
  creamMaterial,
  new THREE.MeshStandardMaterial({ color: 0xf4dfc1, roughness: 1 })
);
addCrochetedEllipsoid(
  new THREE.Vector3(0.35, 3.06, 1.10),
  new THREE.Vector3(0.54, 0.40, 0.31),
  6,
  10,
  creamMaterial,
  new THREE.MeshStandardMaterial({ color: 0xf4dfc1, roughness: 1 })
);

function embroideredEye(x) {
  const points = [
    new THREE.Vector3(x - 0.18, 3.56, 1.218),
    new THREE.Vector3(x, 3.47, 1.274),
    new THREE.Vector3(x + 0.18, 3.57, 1.218)
  ];
  tube(points, 0.048, threadMaterial, 16, 7);

  tube([
    new THREE.Vector3(x - 0.16, 3.56, 1.22),
    new THREE.Vector3(x - 0.23, 3.62, 1.20)
  ], 0.028, threadMaterial, 5, 6);
}
embroideredEye(-0.49);
embroideredEye(0.49);

const noseGeometry = new THREE.BufferGeometry();
noseGeometry.setAttribute('position', new THREE.Float32BufferAttribute([
  -0.16,  0.07, 0.02,
   0.16,  0.07, 0.02,
   0.00, -0.12, 0.08,
  -0.16,  0.07, 0.02,
   0.00, -0.12, 0.08,
   0.00,  0.00, -0.07,
   0.16,  0.07, 0.02,
   0.00,  0.00, -0.07,
   0.00, -0.12, 0.08,
  -0.16,  0.07, 0.02,
   0.00,  0.00, -0.07,
   0.16,  0.07, 0.02
], 3));
noseGeometry.computeVertexNormals();
const nose = new THREE.Mesh(noseGeometry, pinkMaterial);
nose.position.set(0, 3.14, 1.43);
nose.castShadow = true;
cat.add(nose);

tube([
  new THREE.Vector3(0, 3.03, 1.43),
  new THREE.Vector3(0, 2.91, 1.41)
], 0.027, threadMaterial, 5, 6);

tube([
  new THREE.Vector3(0, 2.92, 1.41),
  new THREE.Vector3(-0.10, 2.84, 1.39),
  new THREE.Vector3(-0.22, 2.88, 1.34)
], 0.026, threadMaterial, 10, 6);

tube([
  new THREE.Vector3(0, 2.92, 1.41),
  new THREE.Vector3(0.10, 2.84, 1.39),
  new THREE.Vector3(0.22, 2.88, 1.34)
], 0.026, threadMaterial, 10, 6);

for (const side of [-1, 1]) {
  for (let i = 0; i < 3; i++) {
    const y = 3.10 - i * 0.13;
    tube([
      new THREE.Vector3(side * 0.44, y, 1.34),
      new THREE.Vector3(side * 0.79, y + (1 - i) * 0.025, 1.29),
      new THREE.Vector3(side * 1.04, y + (1 - i) * 0.055, 1.19)
    ], 0.014, threadMaterial, 10, 5);
  }
}

function addPawSeams(x) {
  for (let i = -1; i <= 1; i++) {
    tube([
      new THREE.Vector3(x + i * 0.14, 0.39, 1.24),
      new THREE.Vector3(x + i * 0.15, 0.48, 1.26)
    ], 0.018, darkStitchMaterial, 4, 5);
  }
}
addPawSeams(-0.76);
addPawSeams(0.76);

const collar = new THREE.Mesh(
  new THREE.TorusGeometry(0.98, 0.065, 8, 64),
  new THREE.MeshStandardMaterial({ color: 0x6f8472, roughness: 0.88 })
);
collar.rotation.x = Math.PI / 2;
collar.position.set(0, 2.52, 0.06);
collar.scale.z = 1.02;
collar.castShadow = true;
cat.add(collar);

const bell = new THREE.Mesh(
  new THREE.SphereGeometry(0.13, 20, 14),
  new THREE.MeshStandardMaterial({
    color: 0xc89a45,
    roughness: 0.42,
    metalness: 0.35
  })
);
bell.position.set(0, 2.43, 1.04);
bell.scale.set(1, 1.12, 0.68);
bell.castShadow = true;
cat.add(bell);

setShadows(cat);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  cat.position.y = 0.045 + Math.sin(time * 1.35) * 0.012;
  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>
</body>
</html>
