<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kawaii Cactus</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1e26; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ---------- Scene & Camera ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x22252e);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3.4, 2.6, 5.2);

// ---------- Controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 3;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 1.15, 0);

// ---------- Lighting ----------
const hemi = new THREE.HemisphereLight(0xbfd7ff, 0x3a2c25, 0.55);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
keyLight.position.set(4, 6.5, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 25;
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -6;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.radius = 6;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x9ec7ff, 0.6);
fillLight.position.set(-5, 2.5, 2);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffd9ec, 1.1);
rimLight.position.set(-2.5, 4, -5);
scene.add(rimLight);

// ---------- Toon gradient map ----------
function makeToonGradient() {
  const c = document.createElement('canvas');
  c.width = 4; c.height = 1;
  const ctx = c.getContext('2d');
  const shades = ['#5c5c5c', '#9a9a9a', '#cfcfcf', '#ffffff'];
  for (let i = 0; i < shades.length; i++) {
    ctx.fillStyle = shades[i];
    ctx.fillRect(i, 0, 1, 1);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const gradient = makeToonGradient();

function toon(color) {
  return new THREE.MeshToonMaterial({ color: new THREE.Color(color), gradientMap: gradient });
}

// ---------- Materials ----------
const bodyMat   = toon(0x77c66a);
const bodyDark  = toon(0x5faa54);
const potMat    = toon(0xcf7a4e);
const potRimMat = toon(0xe08a5c);
const soilMat   = toon(0x5a4634);
const flowerMat = toon(0xff9ec4);
const flowerCore= toon(0xffe08a);
const cheekMat  = new THREE.MeshBasicMaterial({ color: 0xff9db0, transparent: true, opacity: 0.85 });
const faceMat   = new THREE.MeshToonMaterial({ color: 0x3a2b2b, gradientMap: gradient });
const spineMat  = toon(0xe9f6d8);

// ---------- The ONE centered object ----------
const cactus = new THREE.Group();

// Pot
const pot = new THREE.Group();
const potBody = new THREE.Mesh(
  new THREE.CylinderGeometry(0.78, 0.58, 1.05, 40),
  potMat
);
potBody.position.y = 0.52;
potBody.castShadow = true; potBody.receiveShadow = true;
pot.add(potBody);

const potRim = new THREE.Mesh(
  new THREE.CylinderGeometry(0.9, 0.82, 0.28, 40),
  potRimMat
);
potRim.position.y = 1.08;
potRim.castShadow = true; potRim.receiveShadow = true;
pot.add(potRim);

const soil = new THREE.Mesh(
  new THREE.CylinderGeometry(0.8, 0.8, 0.14, 40),
  soilMat
);
soil.position.y = 1.14;
soil.receiveShadow = true;
pot.add(soil);
cactus.add(pot);

// Cactus body (plump rounded)
const body = new THREE.Group();
body.position.y = 1.18;

const mainBody = new THREE.Mesh(
  new THREE.SphereGeometry(0.72, 40, 40),
  bodyMat
);
mainBody.scale.set(1, 1.55, 1);
mainBody.position.y = 0.92;
mainBody.castShadow = true; mainBody.receiveShadow = true;
body.add(mainBody);

// vertical ridges for a cactus look
const ridgeCount = 8;
for (let i = 0; i < ridgeCount; i++) {
  const a = (i / ridgeCount) * Math.PI * 2;
  const ridge = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.055, 1.4, 6, 12),
    bodyDark
  );
  ridge.position.set(Math.cos(a) * 0.685, 0.92, Math.sin(a) * 0.685);
  ridge.scale.set(1, 1.02, 1);
  ridge.castShadow = true;
  body.add(ridge);
}

// Arms (two little stubby arms raised)
function makeArm(side) {
  const arm = new THREE.Group();
  const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.18, 0.28, 8, 16), bodyMat);
  upper.castShadow = true; upper.receiveShadow = true;
  arm.add(upper);
  const fore = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 0.3, 8, 16), bodyMat);
  fore.position.set(0, 0.34, 0);
  fore.castShadow = true; fore.receiveShadow = true;
  arm.add(fore);
  arm.position.set(side * 0.66, 0.86, 0);
  arm.rotation.z = side * 0.62;
  return arm;
}
body.add(makeArm(1));
body.add(makeArm(-1));

// Face
const face = new THREE.Group();
face.position.set(0, 1.02, 0.66);

const eyeGeo = new THREE.SphereGeometry(0.075, 20, 20);
const eyeL = new THREE.Mesh(eyeGeo, faceMat);
const eyeR = new THREE.Mesh(eyeGeo, faceMat);
eyeL.position.set(-0.2, 0.06, 0);
eyeR.position.set(0.2, 0.06, 0);
face.add(eyeL, eyeR);

// tiny sparkle highlights
const hiGeo = new THREE.SphereGeometry(0.024, 12, 12);
const hiMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const hiL = new THREE.Mesh(hiGeo, hiMat); hiL.position.set(-0.175, 0.095, 0.06);
const hiR = new THREE.Mesh(hiGeo, hiMat); hiR.position.set(0.225, 0.095, 0.06);
face.add(hiL, hiR);

// Smiling mouth (torus arc)
const mouth = new THREE.Mesh(
  new THREE.TorusGeometry(0.11, 0.022, 12, 30, Math.PI),
  faceMat
);
mouth.rotation.z = Math.PI;
mouth.position.set(0, -0.09, 0.02);
face.add(mouth);

// Rosy cheeks
const cheekGeo = new THREE.CircleGeometry(0.09, 24);
const cheekL = new THREE.Mesh(cheekGeo, cheekMat);
const cheekR = new THREE.Mesh(cheekGeo, cheekMat);
cheekL.position.set(-0.34, -0.05, 0.0);
cheekR.position.set(0.34, -0.05, 0.0);
cheekL.rotation.y = -0.35; cheekR.rotation.y = 0.35;
face.add(cheekL, cheekR);

// curve the face onto the body
face.children.forEach(c => {
  const r = 0.72;
  const off = c.position.length();
});
body.add(face);

// Spine dots
const spineGeo = new THREE.ConeGeometry(0.02, 0.09, 8);
const bodyRadius = 0.72;
for (let i = 0; i < 60; i++) {
  const y = 0.35 + Math.random() * 1.1;
  const a = Math.random() * Math.PI * 2;
  // keep spines off the face front
  if (Math.abs(((a + Math.PI) % (Math.PI * 2)) - Math.PI) < 0.6 && y > 0.7 && y < 1.35) continue;
  const yn = (y - 0.92) / (0.72 * 1.55);
  const rXZ = bodyRadius * Math.sqrt(Math.max(0, 1 - yn * yn));
  const spine = new THREE.Mesh(spineGeo, spineMat);
  spine.position.set(Math.cos(a) * rXZ, y, Math.sin(a) * rXZ);
  spine.lookAt(new THREE.Vector3(Math.cos(a) * rXZ * 2, y, Math.sin(a) * rXZ * 2));
  spine.rotateX(Math.PI / 2);
  spine.castShadow = true;
  body.add(spine);
}

// Flower on top
const flower = new THREE.Group();
flower.position.set(0.12, 1.98, 0.08);
const petalGeo = new THREE.SphereGeometry(0.13, 18, 18);
for (let i = 0; i < 5; i++) {
  const a = (i / 5) * Math.PI * 2;
  const petal = new THREE.Mesh(petalGeo, flowerMat);
  petal.scale.set(1, 0.5, 1.35);
  petal.position.set(Math.cos(a) * 0.16, 0, Math.sin(a) * 0.16);
  petal.rotation.y = -a;
  petal.castShadow = true;
  flower.add(petal);
}
const core = new THREE.Mesh(new THREE.SphereGeometry(0.09, 18, 18), flowerCore);
core.scale.set(1, 0.7, 1);
core.castShadow = true;
flower.add(core);
body.add(flower);

cactus.add(body);
scene.add(cactus);

// ---------- Ground plane (shadow only) ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.32 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

// ---------- Animate ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  // gentle idle bob
  body.position.y = 1.18 + Math.sin(t * 1.6) * 0.02;
  flower.rotation.y += 0.01;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
