<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Pitcher Plant</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05080d;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 42%, transparent 38%, rgba(0, 3, 8, 0.22) 70%, rgba(0, 0, 0, 0.62) 100%);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05080d);
scene.fog = new THREE.FogExp2(0x05080d, 0.032);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.8, 3.6, 8.8);
camera.lookAt(0, 1.15, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 5.5;
controls.maxDistance = 15;
controls.minPolarAngle = 0.45;
controls.maxPolarAngle = Math.PI * 0.78;

function makeEnvironment() {
  const environmentScene = new THREE.Scene();
  environmentScene.background = new THREE.Color(0x07101a);

  const roomMaterial = new THREE.MeshBasicMaterial({
    color: 0x172433,
    side: THREE.BackSide
  });
  const room = new THREE.Mesh(new THREE.BoxGeometry(18, 18, 18), roomMaterial);
  environmentScene.add(room);

  const panelData = [
    { p: [-5.8, 1.5, 0], s: [0.7, 8.0], r: [0, Math.PI / 2, 0], c: 0xeaf7ff, i: 4.0 },
    { p: [5.2, 2.0, -1.5], s: [1.1, 7.0], r: [0, -Math.PI / 2, 0], c: 0x6fa6cf, i: 3.2 },
    { p: [0, 6.2, -1.5], s: [8.0, 1.0], r: [Math.PI / 2, 0, 0], c: 0xf8fbff, i: 3.4 },
    { p: [-1.5, 0.2, -7.0], s: [7.0, 0.75], r: [0, 0, 0], c: 0x4d7499, i: 2.7 },
    { p: [2.7, -1.5, 5.5], s: [2.0, 7.0], r: [0, Math.PI, 0], c: 0xd7e7f3, i: 2.3 },
    { p: [-3.0, 2.0, 5.8], s: [0.55, 6.0], r: [0, Math.PI, 0], c: 0x30587c, i: 3.0 }
  ];

  for (const data of panelData) {
    const panelMaterial = new THREE.MeshBasicMaterial({
      color: data.c,
      side: THREE.DoubleSide,
      toneMapped: false
    });
    panelMaterial.color.multiplyScalar(data.i);
    const panel = new THREE.Mesh(new THREE.PlaneGeometry(data.s[0], data.s[1]), panelMaterial);
    panel.position.set(...data.p);
    panel.rotation.set(...data.r);
    environmentScene.add(panel);
  }

  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  pmremGenerator.compileCubemapShader();
  const target = pmremGenerator.fromScene(environmentScene, 0.045);
  pmremGenerator.dispose();
  return target.texture;
}

const environmentTexture = makeEnvironment();
scene.environment = environmentTexture;

const chromeMaterial = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color(0xc9d5df),
  metalness: 1,
  roughness: 0.075,
  clearcoat: 1,
  clearcoatRoughness: 0.055,
  envMapIntensity: 2.4
});

const lipMaterial = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color(0xe6eef3),
  metalness: 1,
  roughness: 0.045,
  clearcoat: 1,
  clearcoatRoughness: 0.025,
  envMapIntensity: 2.8
});

const darkChromeMaterial = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color(0x111923),
  metalness: 0.92,
  roughness: 0.17,
  clearcoat: 1,
  clearcoatRoughness: 0.08,
  envMapIntensity: 1.65,
  side: THREE.DoubleSide
});

const plant = new THREE.Group();
plant.rotation.set(0.035, -0.12, -0.075);
plant.position.y = -0.55;
scene.add(plant);

function createPitcherBody() {
  const profile = [
    new THREE.Vector2(0.025, -2.03),
    new THREE.Vector2(0.17, -1.98),
    new THREE.Vector2(0.36, -1.84),
    new THREE.Vector2(0.55, -1.55),
    new THREE.Vector2(0.69, -1.15),
    new THREE.Vector2(0.74, -0.72),
    new THREE.Vector2(0.67, -0.34),
    new THREE.Vector2(0.53, 0.02),
    new THREE.Vector2(0.46, 0.39),
    new THREE.Vector2(0.52, 0.72),
    new THREE.Vector2(0.64, 1.00),
    new THREE.Vector2(0.78, 1.20),
    new THREE.Vector2(0.87, 1.29)
  ];

  const geometry = new THREE.LatheGeometry(profile, 160);
  const positions = geometry.attributes.position;
  const vertex = new THREE.Vector3();

  for (let index = 0; index < positions.count; index++) {
    vertex.fromBufferAttribute(positions, index);
    const angle = Math.atan2(vertex.z, vertex.x);
    const normalizedHeight = (vertex.y + 2.03) / 3.32;

    const verticalRipple =
      0.025 * Math.sin(vertex.y * 7.2 + angle * 2.0) +
      0.016 * Math.sin(vertex.y * 13.0 - angle * 3.0);

    const pouredAsymmetry =
      1 +
      0.055 * Math.sin(angle - 0.5) * Math.pow(normalizedHeight, 1.3) +
      0.025 * Math.cos(angle * 3.0 + vertex.y * 1.7);

    const radius = Math.hypot(vertex.x, vertex.z);
    const modifiedRadius = Math.max(0.002, radius * pouredAsymmetry + verticalRipple * radius);

    vertex.x = Math.cos(angle) * modifiedRadius;
    vertex.z = Math.sin(angle) * modifiedRadius * (0.91 + 0.035 * Math.sin(vertex.y * 2.1));
    vertex.x += 0.035 * Math.sin(normalizedHeight * Math.PI * 1.8);
    vertex.z += 0.018 * Math.sin(vertex.y * 4.0);

    positions.setXYZ(index, vertex.x, vertex.y, vertex.z);
  }

  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();

  const mesh = new THREE.Mesh(geometry, chromeMaterial);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function createPeristomeGeometry(majorX, majorZ, tubeRadius, yLevel) {
  const majorSegments = 160;
  const tubeSegments = 28;
  const positions = [];
  const indices = [];

  for (let majorIndex = 0; majorIndex <= majorSegments; majorIndex++) {
    const theta = (majorIndex / majorSegments) * Math.PI * 2;
    const wave =
      0.030 * Math.sin(theta * 3.0 + 0.45) +
      0.014 * Math.sin(theta * 7.0 - 0.7);
    const radiusVariation = 1 + 0.035 * Math.sin(theta * 4.0 + 0.2);
    const centerX = majorX * radiusVariation * Math.cos(theta);
    const centerZ = majorZ * (1 + 0.018 * Math.cos(theta * 5.0)) * Math.sin(theta);

    for (let tubeIndex = 0; tubeIndex <= tubeSegments; tubeIndex++) {
      const phi = (tubeIndex / tubeSegments) * Math.PI * 2;
      const localTube = tubeRadius * (1 + 0.10 * Math.sin(theta * 5.0 + phi));
      const radialX = Math.cos(theta);
      const radialZ = Math.sin(theta);
      positions.push(
        centerX + radialX * localTube * Math.cos(phi),
        yLevel + wave + localTube * Math.sin(phi),
        centerZ + radialZ * localTube * Math.cos(phi)
      );
    }
  }

  const rowLength = tubeSegments + 1;
  for (let majorIndex = 0; majorIndex < majorSegments; majorIndex++) {
    for (let tubeIndex = 0; tubeIndex < tubeSegments; tubeIndex++) {
      const a = majorIndex * rowLength + tubeIndex;
      const b = a + rowLength;
      const c = b + 1;
      const d = a + 1;
      indices.push(a, b, d, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  return geometry;
}

const pitcherBody = createPitcherBody();
plant.add(pitcherBody);

const peristome = new THREE.Mesh(
  createPeristomeGeometry(0.86, 0.69, 0.135, 1.30),
  lipMaterial
);
peristome.castShadow = true;
peristome.receiveShadow = true;
plant.add(peristome);

const throatGeometry = new THREE.CylinderGeometry(0.66, 0.48, 0.54, 96, 1, true);
const throat = new THREE.Mesh(throatGeometry, darkChromeMaterial);
throat.position.y = 1.04;
throat.scale.z = 0.82;
throat.castShadow = true;
plant.add(throat);

const cavityGeometry = new THREE.CircleGeometry(0.635, 96);
const cavity = new THREE.Mesh(cavityGeometry, darkChromeMaterial);
cavity.rotation.x = -Math.PI / 2;
cavity.position.set(0, 1.175, 0);
cavity.scale.y = 0.82;
plant.add(cavity);

function createOrganicLidGeometry() {
  const angularSegments = 96;
  const radialSegments = 14;
  const positions = [];
  const indices = [];
  const topRings = [];
  const bottomRings = [];

  positions.push(0, 0.17, 0);
  const topCenter = 0;

  for (let radialIndex = 1; radialIndex <= radialSegments; radialIndex++) {
    const ring = [];
    const radius = radialIndex / radialSegments;

    for (let angularIndex = 0; angularIndex < angularSegments; angularIndex++) {
      const angle = angularIndex / angularSegments * Math.PI * 2;
      const outline = 1 + 0.07 * Math.sin(angle * 3.0) - 0.035 * Math.cos(angle * 5.0);
      const x = 0.92 * radius * outline * Math.cos(angle);
      const z = 0.70 * radius * (1 + 0.10 * Math.cos(angle)) * Math.sin(angle);
      const crown = 0.17 * (1 - radius * radius);
      const saddle = 0.065 * Math.cos(angle * 2.0) * radius * radius;
      ring.push(positions.length / 3);
      positions.push(x, crown + saddle, z);
    }
    topRings.push(ring);
  }

  const bottomCenter = positions.length / 3;
  positions.push(0, -0.085, 0);

  for (let radialIndex = 1; radialIndex <= radialSegments; radialIndex++) {
    const ring = [];
    const radius = radialIndex / radialSegments;

    for (let angularIndex = 0; angularIndex < angularSegments; angularIndex++) {
      const angle = angularIndex / angularSegments * Math.PI * 2;
      const outline = 1 + 0.07 * Math.sin(angle * 3.0) - 0.035 * Math.cos(angle * 5.0);
      const x = 0.92 * radius * outline * Math.cos(angle);
      const z = 0.70 * radius * (1 + 0.10 * Math.cos(angle)) * Math.sin(angle);
      const lowerCurve = -0.085 * (1 - radius * radius);
      const saddle = 0.030 * Math.cos(angle * 2.0) * radius * radius;
      ring.push(positions.length / 3);
      positions.push(x, lowerCurve + saddle, z);
    }
    bottomRings.push(ring);
  }

  for (let angularIndex = 0; angularIndex < angularSegments; angularIndex++) {
    const next = (angularIndex + 1) % angularSegments;
    indices.push(topCenter, topRings[0][angularIndex], topRings[0][next]);
    indices.push(bottomCenter, bottomRings[0][next], bottomRings[0][angularIndex]);
  }

  for (let radialIndex = 0; radialIndex < radialSegments - 1; radialIndex++) {
    for (let angularIndex = 0; angularIndex < angularSegments; angularIndex++) {
      const next = (angularIndex + 1) % angularSegments;
      const topA = topRings[radialIndex][angularIndex];
      const topB = topRings[radialIndex + 1][angularIndex];
      const topC = topRings[radialIndex + 1][next];
      const topD = topRings[radialIndex][next];
      indices.push(topA, topB, topD, topB, topC, topD);

      const bottomA = bottomRings[radialIndex][angularIndex];
      const bottomB = bottomRings[radialIndex][next];
      const bottomC = bottomRings[radialIndex + 1][next];
      const bottomD = bottomRings[radialIndex + 1][angularIndex];
      indices.push(bottomA, bottomB, bottomD, bottomB, bottomC, bottomD);
    }
  }

  const topOuter = topRings[radialSegments - 1];
  const bottomOuter = bottomRings[radialSegments - 1];

  for (let angularIndex = 0; angularIndex < angularSegments; angularIndex++) {
    const next = (angularIndex + 1) % angularSegments;
    indices.push(
      topOuter[angularIndex],
      bottomOuter[angularIndex],
      topOuter[next],
      bottomOuter[angularIndex],
      bottomOuter[next],
      topOuter[next]
    );
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  return geometry;
}

const lidAssembly = new THREE.Group();
lidAssembly.position.set(-0.03, 2.02, -0.02);
lidAssembly.rotation.set(-0.16, 0.03, -0.09);
plant.add(lidAssembly);

const lid = new THREE.Mesh(createOrganicLidGeometry(), chromeMaterial);
lid.castShadow = true;
lid.receiveShadow = true;
lidAssembly.add(lid);

const dripProfile = [
  new THREE.Vector2(0.012, 0.07),
  new THREE.Vector2(0.075, 0.035),
  new THREE.Vector2(0.115, -0.06),
  new THREE.Vector2(0.105, -0.18),
  new THREE.Vector2(0.075, -0.32),
  new THREE.Vector2(0.035, -0.45),
  new THREE.Vector2(0.004, -0.54)
];
const dripGeometry = new THREE.LatheGeometry(dripProfile, 64);
const drip = new THREE.Mesh(dripGeometry, lipMaterial);
drip.position.set(0.08, -0.025, 0.58);
drip.scale.set(0.86, 1.0, 0.86);
drip.castShadow = true;
lidAssembly.add(drip);

function createTube(points, radius, radialSegments, material) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal', 0.5);
  const geometry = new THREE.TubeGeometry(curve, Math.max(80, points.length * 18), radius, radialSegments, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const lidStalk = createTube([
  new THREE.Vector3(0.00, 1.34, -0.61),
  new THREE.Vector3(-0.02, 1.53, -0.67),
  new THREE.Vector3(-0.07, 1.76, -0.60),
  new THREE.Vector3(-0.08, 1.98, -0.46),
  new THREE.Vector3(-0.04, 2.05, -0.30)
], 0.075, 18, chromeMaterial);
plant.add(lidStalk);

const tendrilPoints = [
  new THREE.Vector3(-0.08, 1.30, -0.64),
  new THREE.Vector3(-0.14, 1.75, -0.75),
  new THREE.Vector3(0.02, 2.25, -0.69),
  new THREE.Vector3(0.43, 2.76, -0.52),
  new THREE.Vector3(0.92, 3.13, -0.22),
  new THREE.Vector3(1.20, 3.45, 0.10),
  new THREE.Vector3(1.06, 3.78, 0.27),
  new THREE.Vector3(0.63, 3.96, 0.28),
  new THREE.Vector3(0.18, 3.82, 0.15),
  new THREE.Vector3(-0.02, 3.48, -0.04),
  new THREE.Vector3(0.12, 3.18, -0.16),
  new THREE.Vector3(0.43, 3.10, -0.19),
  new THREE.Vector3(0.66, 3.28, -0.10),
  new THREE.Vector3(0.64, 3.52, 0.02)
];
const tendril = createTube(tendrilPoints, 0.082, 20, chromeMaterial);
plant.add(tendril);

const attachment = new THREE.Mesh(new THREE.SphereGeometry(0.13, 32, 24), chromeMaterial);
attachment.position.set(-0.08, 1.31, -0.63);
attachment.scale.set(1.0, 1.25, 0.9);
attachment.castShadow = true;
plant.add(attachment);

const tip = new THREE.Mesh(new THREE.SphereGeometry(0.086, 28, 20), chromeMaterial);
tip.position.copy(tendrilPoints[tendrilPoints.length - 1]);
tip.scale.set(0.8, 1.2, 0.8);
tip.castShadow = true;
plant.add(tip);

const floorMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x091019,
  metalness: 0.72,
  roughness: 0.31,
  envMapIntensity: 0.85
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(7.0, 128), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.67;
floor.receiveShadow = true;
scene.add(floor);

const haloMaterial = new THREE.MeshBasicMaterial({
  color: 0x18344f,
  transparent: true,
  opacity: 0.22,
  side: THREE.DoubleSide,
  depthWrite: false
});
const halo = new THREE.Mesh(new THREE.RingGeometry(1.3, 3.9, 128), haloMaterial);
halo.rotation.x = -Math.PI / 2;
halo.position.y = -2.655;
scene.add(halo);

const hemisphereLight = new THREE.HemisphereLight(0xa7d2f2, 0x07101b, 1.15);
scene.add(hemisphereLight);

const keyLight = new THREE.SpotLight(0xf2f8ff, 950, 22, Math.PI / 5.2, 0.45, 1.2);
keyLight.position.set(-5.5, 7.5, 5.5);
keyLight.target.position.set(0, 0.7, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 22;
keyLight.shadow.bias = -0.00025;
scene.add(keyLight, keyLight.target);

const rimLight = new THREE.SpotLight(0x6daee6, 720, 20, Math.PI / 4.5, 0.55, 1.3);
rimLight.position.set(5.2, 4.6, -5.5);
rimLight.target.position.set(0.2, 1.2, 0);
scene.add(rimLight, rimLight.target);

const sideLight = new THREE.PointLight(0xdbefff, 115, 9, 1.5);
sideLight.position.set(-3.0, 0.2, 3.1);
scene.add(sideLight);

const blueLight = new THREE.PointLight(0x326b9d, 85, 8, 1.7);
blueLight.position.set(3.2, -0.8, -2.7);
scene.add(blueLight);

const clock = new THREE.Clock();

renderer.setAnimationLoop(() => {
  const elapsed = clock.getElapsedTime();
  haloMaterial.opacity = 0.19 + Math.sin(elapsed * 0.55) * 0.025;
  controls.update();
  renderer.render(scene, camera);
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
