function prepareMesh(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function lumpyGeometry(radius, widthSegments, heightSegments, sx, sy, sz, phase = 0) {
  const geometry = new THREE.SphereGeometry(radius, widthSegments, heightSegments);
  const position = geometry.attributes.position;
  const vector = new THREE.Vector3();

  for (let i = 0; i < position.count; i++) {
    vector.fromBufferAttribute(position, i);
    const nx = vector.x / radius;
    const ny = vector.y / radius;
    const nz = vector.z / radius;
    const broad =
      Math.sin(nx * 4.7 + phase) * 0.018 +
      Math.sin(ny * 6.1 - phase * 0.8) * 0.014 +
      Math.sin(nz * 5.3 + phase * 1.3) * 0.016 +
      Math.sin((nx + ny - nz) * 10.2 + phase) * 0.007;
    const thumb =
      Math.sin(nx * 15.0 + ny * 8.0 + phase) *
      Math.sin(nz * 13.0 - ny * 5.0) * 0.0045;
    const factor = 1 + broad + thumb;
    position.setXYZ(
      i,
      vector.x * factor * sx,
      vector.y * factor * sy,
      vector.z * factor * sz
    );
  }

  geometry.computeVertexNormals();
  return geometry;
}

function lumpyMesh(radius, sx, sy, sz, material, phase = 0, segments = 64) {
  return prepareMesh(new THREE.Mesh(
    lumpyGeometry(radius, segments, Math.max(32, Math.floor(segments * 0.7)), sx, sy, sz, phase),
    material
  ));
}

function cylinderBetween(start, end, radius, material, radialSegments = 8) {
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius * 0.92, length, radialSegments, 1, false),
    material
  );
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.clone().normalize()
  );
  return prepareMesh(mesh);
}

function curveTube(points, radius, material, tubularSegments = 28, radialSegments = 7, closed = false) {
  const curve = new THREE.CatmullRomCurve3(points, closed, 'centripetal');
  return prepareMesh(new THREE.Mesh(
    new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, closed),
    material
  ));
}

function taperedBezier(start, control, end, startRadius, endRadius, material, segments = 30, sides = 12) {
  const positions = [];
  const indices = [];
  const curve = new THREE.QuadraticBezierCurve3(start, control, end);
  const tangent = new THREE.Vector3();
  const side = new THREE.Vector3();
  const up = new THREE.Vector3();

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const point = curve.getPoint(t);
    curve.getTangent(t, tangent).normalize();

    side.set(1, 0, 0);
    if (Math.abs(tangent.dot(side)) > 0.9) side.set(0, 0, 1);
    side.cross(tangent).normalize();
    up.crossVectors(tangent, side).normalize();

    const radius = THREE.MathUtils.lerp(startRadius, endRadius, Math.pow(t, 0.72));
    for (let j = 0; j < sides; j++) {
      const angle = (j / sides) * Math.PI * 2;
      const offset = side.clone().multiplyScalar(Math.cos(angle) * radius)
        .add(up.clone().multiplyScalar(Math.sin(angle) * radius));
      positions.push(point.x + offset.x, point.y + offset.y, point.z + offset.z);
    }
  }

  for (let i = 0; i < segments; i++) {
    for (let j = 0; j < sides; j++) {
      const next = (j + 1) % sides;
      const a = i * sides + j;
      const b = i * sides + next;
      const c = (i + 1) * sides + next;
      const d = (i + 1) * sides + j;
      indices.push(a, b, d, b, c, d);
    }
  }

  const startCenter = positions.length / 3;
  positions.push(start.x, start.y, start.z);
  const endCenter = positions.length / 3;
  positions.push(end.x, end.y, end.z);

  for (let j = 0; j < sides; j++) {
    const next = (j + 1) % sides;
    indices.push(startCenter, next, j);
    const endBase = segments * sides;
    indices.push(endCenter, endBase + j, endBase + next);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return prepareMesh(new THREE.Mesh(geometry, material));
}

function addFlipper(side) {
  const flipper = lumpyMesh(1, 0.98, 0.24, 0.66, clayMaterial, side < 0 ? 3.1 : 4.6, 56);
  flipper.position.set(side * 1.93, 0.43, 0.34);
  flipper.rotation.y = side * -0.23;
  flipper.rotation.z = side * -0.13;
  walrus.add(flipper);

  const wrist = lumpyMesh(1, 0.58, 0.36, 0.55, clayDarkMaterial, side + 3, 48);
  wrist.position.set(side * 1.55, 0.68, 0.03);
  wrist.rotation.z = side * -0.22;
  walrus.add(wrist);

  for (let i = 0; i < 3; i++) {
    const x = side * (2.25 + i * 0.15);
    const seam = curveTube([
      new THREE.Vector3(x, 0.49, 0.78 - i * 0.08),
      new THREE.Vector3(x + side * 0.02, 0.46, 0.56 - i * 0.07),
      new THREE.Vector3(x - side * 0.04, 0.45, 0.38 - i * 0.06)
    ], 0.018, seamMaterial, 12, 6);
    walrus.add(seam);
  }
}

function addThumbprint(cx, cy, cz, width, height, count, tilt = 0) {
  for (let ring = 0; ring < count; ring++) {
    const scale = 1 - ring * 0.18;
    const points = [];
    const start = -Math.PI * 0.78;
    const end = Math.PI * 0.78;
    for (let i = 0; i < 18; i++) {
      const angle = THREE.MathUtils.lerp(start, end, i / 17);
      const px = Math.cos(angle) * width * scale;
      const py = Math.sin(angle) * height * scale;
      const rx = px * Math.cos(tilt) - py * Math.sin(tilt);
      const ry = px * Math.sin(tilt) + py * Math.cos(tilt);
      points.push(new THREE.Vector3(cx + rx, cy + ry, cz + ring * 0.002));
    }
    const line = curveTube(points, 0.009, seamMaterial, 24, 5);
    line.material = seamMaterial.clone();
    line.material.transparent = true;
    line.material.opacity = 0.4;
    walrus.add(line);
  }
}

  [-0.96, 3.65, 1.59, -1.78, 3.51, 1.72],

  const start = new THREE.Vector3(data[0], data[1], data[2]);
  const end = new THREE.Vector3(data[3], data[4], data[5]);

}

  ],

  ]

  new THREE.CircleGeometry(2.8, 64),
  new THREE.MeshBasicMaterial({
    color: 0x4c4139,

    depthWrite: false
  })

contactShadow.rotation.x = -Math.PI / 2;
contactShadow.scale.set(1.35, 0.72, 1);

walrus.traverse((object) => {
  if (object.isMesh) {
    object.castShadow = true;
    object.receiveShadow = true;
  }
});

function resize() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(width, height);
}
window.addEventListener('resize', resize);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  walrus.position.y = Math.sin(elapsed * 1.15) * 0.008;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
