<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Chrome Hammerhead</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 32%, #dce2e5 0%, #879197 35%, #31383d 72%, #101417 100%);
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x707a80);
scene.fog = new THREE.FogExp2(0x707a80, 0.032);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(-6.8, 3.5, 8.5);
camera.lookAt(0, 0.15, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
const room = new RoomEnvironment(renderer);
scene.environment = pmrem.fromScene(room, 0.04).texture;
room.dispose();
pmrem.dispose();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 6;
controls.maxDistance = 16;
controls.target.set(0, 0.12, 0);

const chrome = new THREE.MeshPhysicalMaterial({
  color: 0xe8edf0,
  metalness: 1,
  roughness: 0.055,
  clearcoat: 1,
  clearcoatRoughness: 0.035,
  envMapIntensity: 2.25
});

const darkChrome = new THREE.MeshPhysicalMaterial({
  color: 0x080b0d,
  metalness: 0.96,
  roughness: 0.13,
  clearcoat: 1,
  envMapIntensity: 1.35
});

const shark = new THREE.Group();
shark.rotation.z = -0.025;
shark.position.y = 0.25;
scene.add(shark);

function signedPow(value, exponent) {
  return Math.sign(value) * Math.pow(Math.abs(value), exponent);
}

function makeSuperellipsoid(rx, ry, rz, eLat, eLon, widthSegments = 72, heightSegments = 36) {
  const positions = [];
  const indices = [];

  for (let iy = 0; iy <= heightSegments; iy++) {
    const latitude = -Math.PI / 2 + Math.PI * iy / heightSegments;
    const cv = Math.cos(latitude);
    const sv = Math.sin(latitude);

    for (let ix = 0; ix <= widthSegments; ix++) {
      const longitude = Math.PI * 2 * ix / widthSegments;
      const cu = Math.cos(longitude);
      const su = Math.sin(longitude);

      positions.push(
        rx * signedPow(cv, eLat) * signedPow(cu, eLon),
        ry * signedPow(sv, eLat),
        rz * signedPow(cv, eLat) * signedPow(su, eLon)
      );
    }
  }

  for (let iy = 0; iy < heightSegments; iy++) {
    for (let ix = 0; ix < widthSegments; ix++) {
      const a = iy * (widthSegments + 1) + ix;
      const b = a + widthSegments + 1;
      indices.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function makeBody() {
  const longitudinal = 96;
  const radial = 64;
  const positions = [];
  const indices = [];

  for (let i = 0; i <= longitudinal; i++) {
    const t = i / longitudinal;
    const x = THREE.MathUtils.lerp(-1.55, 2.12, t);
    const swell = Math.pow(Math.sin(Math.PI * (0.08 + t * 0.88)), 0.62);
    const taper = 1 - 0.58 * t;
    const baseY = 0.13 + 0.08 * Math.sin(t * Math.PI);
    const ry = 0.105 + 0.63 * swell * taper;
    const rz = 0.115 + 0.72 * swell * taper;

    for (let j = 0; j <= radial; j++) {
      const a = j / radial * Math.PI * 2;
      const flank = Math.pow(Math.abs(Math.sin(a)), 1.7);
      const ripple =
        1 +
        0.035 * Math.sin(t * 41 - a * 3.0) * flank +
        0.022 * Math.sin(t * 73 + a * 5.0) * flank * (0.25 + 0.75 * t);
      const moltenRidge =
        0.025 * Math.sin(t * 29 + Math.cos(a) * 2.4) *
        Math.pow(Math.abs(Math.sin(a)), 3);

      positions.push(
        x,
        baseY + Math.sin(a) * ry * ripple + moltenRidge,
        Math.cos(a) * rz * ripple
      );
    }
  }

  for (let i = 0; i < longitudinal; i++) {
    for (let j = 0; j < radial; j++) {
      const a = i * (radial + 1) + j;
      const b = a + radial + 1;
      indices.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function makeExtrudedBlade(points, depth, bevelSize, bevelSegments = 5) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
  shape.closePath();

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth,
    steps: 1,
    bevelEnabled: true,
    bevelThickness: bevelSize,
    bevelSize,
    bevelSegments,
    curveSegments: 12
  });
  geometry.center();
  geometry.computeVertexNormals();
  return geometry;
}

const body = new THREE.Mesh(makeBody(), chrome);
body.castShadow = true;
body.receiveShadow = true;
shark.add(body);

const head = new THREE.Mesh(
  makeSuperellipsoid(0.77, 0.43, 2.28, 0.54, 0.34),
  chrome
);
head.position.set(-1.62, 0.16, 0);
head.rotation.z = -0.035;
head.castShadow = true;
head.receiveShadow = true;
shark.add(head);

const crown = new THREE.Mesh(
  makeSuperellipsoid(0.76, 0.42, 0.82, 0.72, 0.78, 56, 28),
  chrome
);
crown.position.set(-1.28, 0.11, 0);
crown.castShadow = true;
shark.add(crown);

const tailGeometry = makeExtrudedBlade([
  [-0.12, 0.12],
  [0.28, 0.22],
  [0.68, 0.74],
  [1.18, 1.28],
  [1.06, 0.54],
  [0.78, 0.12],
  [0.70, 0.00],
  [0.78, -0.12],
  [1.06, -0.54],
  [1.18, -1.28],
  [0.68, -0.74],
  [0.28, -0.22],
  [-0.12, -0.12]
], 0.12, 0.055, 7);

const tail = new THREE.Mesh(tailGeometry, chrome);
tail.position.set(2.18, 0.15, 0);
tail.castShadow = true;
tail.receiveShadow = true;
shark.add(tail);

const dorsalGeometry = makeExtrudedBlade([
  [-0.65, 0.00],
  [-0.28, 0.30],
  [0.06, 1.43],
  [0.19, 1.66],
  [0.32, 0.48],
  [0.72, 0.00]
], 0.105, 0.045, 6);

const dorsal = new THREE.Mesh(dorsalGeometry, chrome);
dorsal.position.set(0.12, 0.66, 0);
dorsal.castShadow = true;
shark.add(dorsal);

const pectoralGeometry = makeExtrudedBlade([
  [-0.52, 0.00],
  [-0.10, 0.16],
  [1.16, 0.65],
  [0.61, 0.02],
  [0.03, -0.16]
], 0.095, 0.04, 5);
pectoralGeometry.rotateX(Math.PI / 2);

const nearFin = new THREE.Mesh(pectoralGeometry, chrome);
nearFin.position.set(-0.18, -0.25, 0.54);
nearFin.rotation.y = -0.12;
nearFin.rotation.z = -0.12;
nearFin.castShadow = true;
shark.add(nearFin);

const farFin = new THREE.Mesh(pectoralGeometry.clone(), chrome);
farFin.scale.z = -1;
farFin.position.set(-0.10, -0.21, -0.53);
farFin.rotation.y = 0.12;
farFin.rotation.z = -0.09;
farFin.castShadow = true;
shark.add(farFin);

const eyeSocketGeometry = new THREE.SphereGeometry(1, 40, 24);
for (const side of [-1, 1]) {
  const socket = new THREE.Mesh(eyeSocketGeometry, darkChrome);
  socket.scale.set(0.20, 0.125, 0.055);
  socket.position.set(-1.70, 0.24, side * 2.255);
  socket.rotation.x = side < 0 ? Math.PI : 0;
  shark.add(socket);

  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(0.163, 0.022, 12, 48),
    chrome
  );
  rim.scale.y = 0.67;
  rim.position.set(-1.70, 0.24, side * 2.282);
  rim.rotation.y = 0.05;
  shark.add(rim);
}

const gillMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x5b6367,
  metalness: 1,
  roughness: 0.12,
  envMapIntensity: 1.5
});

for (const side of [-1, 1]) {
  for (let i = 0; i < 3; i++) {
    const gill = new THREE.Mesh(
      new THREE.TorusGeometry(0.29 + i * 0.018, 0.012, 8, 36, Math.PI * 0.68),
      gillMaterial
    );
    gill.scale.set(0.56, 1, 0.55);
    gill.position.set(-1.02 + i * 0.11, 0.08, side * (0.62 - i * 0.018));
    gill.rotation.set(Math.PI / 2, side * 0.20, side > 0 ? 2.43 : -0.71);
    shark.add(gill);
  }
}

const rippleMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xdde3e6,
  metalness: 1,
  roughness: 0.075,
  clearcoat: 1,
  envMapIntensity: 2
});

for (const side of [-1, 1]) {
  for (let i = 0; i < 4; i++) {
    const ripple = new THREE.Mesh(
      new THREE.TorusGeometry(0.20 + i * 0.075, 0.014, 8, 48, Math.PI * 1.25),
      rippleMaterial
    );
    ripple.scale.set(1.8, 0.72, 0.5);
    ripple.position.set(0.28 + i * 0.31, 0.13 + Math.sin(i) * 0.08, side * (0.58 - i * 0.08));
    ripple.rotation.set(Math.PI / 2, 0.18 * side, side > 0 ? 0.38 : -2.76);
    shark.add(ripple);
  }
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(18, 96),
  new THREE.MeshStandardMaterial({
    color: 0x626b70,
    roughness: 0.34,
    metalness: 0.12,
    transparent: true,
    opacity: 0.82
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.62;
floor.receiveShadow = true;
scene.add(floor);

const key = new THREE.RectAreaLight(0xffffff, 13, 4.5, 7);
key.position.set(-2.5, 6, 4.5);
key.lookAt(0, 0, 0);
scene.add(key);

const sideLight = new THREE.RectAreaLight(0xb8ddff, 9, 3, 6);
sideLight.position.set(5, 2.5, -4);
sideLight.lookAt(0.4, 0.1, 0);
scene.add(sideLight);

const topLight = new THREE.DirectionalLight(0xffffff, 3.2);
topLight.position.set(-3, 7, 4);
topLight.castShadow = true;
topLight.shadow.mapSize.set(2048, 2048);
topLight.shadow.camera.near = 0.5;
topLight.shadow.camera.far = 20;
topLight.shadow.camera.left = -6;
topLight.shadow.camera.right = 6;
topLight.shadow.camera.top = 5;
topLight.shadow.camera.bottom = -5;
topLight.shadow.bias = -0.00025;
scene.add(topLight);

const rimLight = new THREE.DirectionalLight(0xd7ebff, 2.2);
rimLight.position.set(4, 3, -6);
scene.add(rimLight);

const fill = new THREE.HemisphereLight(0xffffff, 0x20262a, 1.8);
scene.add(fill);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
