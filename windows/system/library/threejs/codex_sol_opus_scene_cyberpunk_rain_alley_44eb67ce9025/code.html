<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyberpunk Rain Alley</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02030a;
    }

    canvas {
      display: block;
    }

    #title {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(180, 230, 255, 0.72);
      font: 10px/1.5 monospace;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 0 12px #00bfff;
    }

    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 50% 48%,
          transparent 42%,
          rgba(0, 0, 8, 0.2) 70%,
          rgba(0, 0, 8, 0.68) 100%
        );
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="title">Sector 09 · Night Market</div>
  <div id="vignette"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02040b);
    scene.fog = new THREE.FogExp2(0x07101b, 0.035);

    const camera = new THREE.PerspectiveCamera(
      54,
      window.innerWidth / window.innerHeight,
      0.1,
      120
    );
    camera.position.set(0.6, 5.3, 13.8);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setAnimationLoop(animate);
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.4, -8.5);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.18;
    controls.minDistance = 7;
    controls.maxDistance = 25;
    controls.minPolarAngle = 0.75;
    controls.maxPolarAngle = 1.48;
    controls.enablePan = false;

    let seed = 729341;
    function random() {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let value = Math.imul(seed ^ seed >>> 15, 1 | seed);
      value = value + Math.imul(value ^ value >>> 7, 61 | value) ^ value;
      return ((value ^ value >>> 14) >>> 0) / 4294967296;
    }

    function range(min, max) {
      return min + (max - min) * random();
    }

    function choose(values) {
      return values[Math.floor(random() * values.length)];
    }

    function canvasTexture(width, height, painter) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d');
      painter(context, width, height);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = Math.min(renderer.capabilities.getMaxAnisotropy(), 8);
      texture.needsUpdate = true;
      return texture;
    }

    const wallTexture = canvasTexture(512, 1024, (ctx, w, h) => {
      const gradient = ctx.createLinearGradient(0, 0, w, h);
      gradient.addColorStop(0, '#171d25');
      gradient.addColorStop(0.45, '#0d121a');
      gradient.addColorStop(1, '#070a10');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);

      for (let y = 0; y < h; y += 64) {
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(0, y, w, 3);
        ctx.fillStyle = 'rgba(110,140,155,0.08)';
        ctx.fillRect(0, y + 3, w, 1);
      }

      for (let x = 0; x < w; x += 128) {
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        ctx.fillRect(x, 0, 3, h);
      }

      for (let i = 0; i < 150; i++) {
        const x = random() * w;
        const y = random() * h;
        const radius = range(1, 7);
        ctx.fillStyle = `rgba(35,55,62,${range(0.04, 0.18)})`;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = 0; i < 24; i++) {
        const x = random() * w;
        const y = random() * h;
        ctx.strokeStyle = `rgba(0,0,0,${range(0.12, 0.35)})`;
        ctx.lineWidth = range(1, 5);
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + range(-18, 18), y + range(40, 180));
        ctx.stroke();
      }
    });
    wallTexture.wrapS = THREE.RepeatWrapping;
    wallTexture.wrapT = THREE.RepeatWrapping;
    wallTexture.repeat.set(2, 3);

    const pavementTexture = canvasTexture(1024, 1024, (ctx, w, h) => {
      ctx.fillStyle = '#111820';
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 2200; i++) {
        const shade = Math.floor(range(20, 62));
        const alpha = range(0.03, 0.2);
        ctx.fillStyle = `rgba(${shade},${shade + 5},${shade + 11},${alpha})`;
        ctx.fillRect(random() * w, random() * h, range(1, 8), range(1, 8));
      }

      for (let i = 0; i < 30; i++) {
        ctx.strokeStyle = `rgba(1,3,7,${range(0.25, 0.65)})`;
        ctx.lineWidth = range(1, 5);
        ctx.beginPath();
        let x = random() * w;
        let y = random() * h;
        ctx.moveTo(x, y);
        for (let j = 0; j < 8; j++) {
          x += range(-45, 45);
          y += range(15, 70);
          ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      const glow = ctx.createRadialGradient(
        w * 0.45,
        h * 0.5,
        20,
        w * 0.45,
        h * 0.5,
        w * 0.5
      );
      glow.addColorStop(0, 'rgba(70,90,105,0.13)');
      glow.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, w, h);
    });
    pavementTexture.wrapS = THREE.RepeatWrapping;
    pavementTexture.wrapT = THREE.RepeatWrapping;
    pavementTexture.repeat.set(2, 8);

    const steamTexture = canvasTexture(128, 128, (ctx, w, h) => {
      const gradient = ctx.createRadialGradient(
        w * 0.5,
        h * 0.5,
        3,
        w * 0.5,
        h * 0.5,
        w * 0.48
      );
      gradient.addColorStop(0, 'rgba(235,248,255,0.72)');
      gradient.addColorStop(0.24, 'rgba(195,225,240,0.38)');
      gradient.addColorStop(0.58, 'rgba(135,175,195,0.13)');
      gradient.addColorStop(1, 'rgba(90,120,140,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);
    });

    const hologramScanTexture = canvasTexture(256, 512, (ctx, w, h) => {
      ctx.clearRect(0, 0, w, h);
      const gradient = ctx.createLinearGradient(0, 0, 0, h);
      gradient.addColorStop(0, 'rgba(0,255,255,0.02)');
      gradient.addColorStop(0.5, 'rgba(40,255,255,0.22)');
      gradient.addColorStop(1, 'rgba(0,160,255,0.03)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);

      for (let y = 0; y < h; y += 8) {
        ctx.fillStyle = y % 16 === 0
          ? 'rgba(180,255,255,0.12)'
          : 'rgba(0,0,0,0.1)';
        ctx.fillRect(0, y, w, 2);
      }

      ctx.strokeStyle = 'rgba(110,255,255,0.7)';
      ctx.lineWidth = 4;
      ctx.strokeRect(8, 8, w - 16, h - 16);
      ctx.strokeStyle = 'rgba(255,75,210,0.55)';
      ctx.beginPath();
      ctx.moveTo(w * 0.18, h * 0.63);
      ctx.lineTo(w * 0.5, h * 0.24);
      ctx.lineTo(w * 0.82, h * 0.63);
      ctx.lineTo(w * 0.66, h * 0.78);
      ctx.lineTo(w * 0.34, h * 0.78);
      ctx.closePath();
      ctx.stroke();

      ctx.fillStyle = 'rgba(190,255,255,0.86)';
      ctx.font = 'bold 28px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('NEXUS', w / 2, h * 0.87);
      ctx.font = '18px monospace';
      ctx.fillText('未来 // 09', w / 2, h * 0.93);
    });

    const darkMetal = new THREE.MeshStandardMaterial({
      color: 0x101820,
      roughness: 0.58,
      metalness: 0.74
    });

    const blackMetal = new THREE.MeshStandardMaterial({
      color: 0x05080c,
      roughness: 0.42,
      metalness: 0.88
    });

    const wornMetal = new THREE.MeshStandardMaterial({
      color: 0x39444b,
      roughness: 0.74,
      metalness: 0.62
    });

    const copperMaterial = new THREE.MeshStandardMaterial({
      color: 0x6d4635,
      roughness: 0.55,
      metalness: 0.68
    });

    const rubberMaterial = new THREE.MeshStandardMaterial({
      color: 0x08090c,
      roughness: 0.93,
      metalness: 0.05
    });

    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x172b3f,
      roughness: 0.12,
      metalness: 0.1,
      transmission: 0.25,
      thickness: 0.4,
      transparent: true,
      opacity: 0.72
    });

    function emissiveMaterial(color, intensity = 2.5) {
      return new THREE.MeshStandardMaterial({
        color,
        emissive: color,
        emissiveIntensity: intensity,
        roughness: 0.32,
        metalness: 0.18
      });
    }

    function box(
      width,
      height,
      depth,
      material,
      x,
      y,
      z,
      castShadow = true,
      receiveShadow = true
    ) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, depth),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;
      scene.add(mesh);
      return mesh;
    }

    function cylinder(
      radiusTop,
      radiusBottom,
      height,
      segments,
      material,
      x,
      y,
      z
    ) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(
          radiusTop,
          radiusBottom,
          height,
          segments
        ),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    const pavementMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x1b252e,
      map: pavementTexture,
      roughness: 0.2,
      metalness: 0.56,
      clearcoat: 1,
      clearcoatRoughness: 0.13
    });

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(9.2, 47),
      pavementMaterial
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(0, 0, -7.7);
    ground.receiveShadow = true;
    scene.add(ground);

    const wallMaterial = new THREE.MeshStandardMaterial({
      color: 0x222b33,
      map: wallTexture,
      roughness: 0.92,
      metalness: 0.08
    });

    box(0.62, 15, 48, wallMaterial, -4.75, 7.5, -7.7, false, true);
    box(0.62, 15, 48, wallMaterial, 4.75, 7.5, -7.7, false, true);
    box(10.1, 15, 0.7, wallMaterial, 0, 7.5, -31.4, false, true);

    const curbMaterial = new THREE.MeshStandardMaterial({
      color: 0x232d33,
      roughness: 0.75,
      metalness: 0.25
    });

    box(0.3, 0.22, 47, curbMaterial, -4.32, 0.11, -7.7);
    box(0.3, 0.22, 47, curbMaterial, 4.32, 0.11, -7.7);

    for (let side = -1; side <= 1; side += 2) {
      for (let z = 10; z > -30; z -= 4.1) {
        const beam = box(
          0.15,
          13.5,
          0.23,
          blackMetal,
          side * 4.39,
          6.75,
          z,
          false,
          true
        );
        beam.rotation.y = 0;
      }
    }

    const puddleMaterialCyan = new THREE.MeshBasicMaterial({
      color: 0x00b7ff,
      transparent: true,
      opacity: 0.14,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const puddleMaterialPink = new THREE.MeshBasicMaterial({
      color: 0xff168f,
      transparent: true,
      opacity: 0.12,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const puddles = [];
    for (let i = 0; i < 18; i++) {
      const puddle = new THREE.Mesh(
        new THREE.CircleGeometry(range(0.25, 1.05), 32),
        i % 2 === 0 ? puddleMaterialCyan : puddleMaterialPink
      );
      puddle.scale.set(range(0.45, 1.8), range(0.3, 0.8), 1);
      puddle.rotation.x = -Math.PI / 2;
      puddle.rotation.z = random() * Math.PI;
      puddle.position.set(range(-3.55, 3.55), 0.018, range(-29, 11));
      scene.add(puddle);
      puddles.push(puddle);
    }

    const reflectionStrips = [];
    const reflectionColors = [0x00eaff, 0xff147f, 0x8a44ff, 0xffa000];
    for (let i = 0; i < 15; i++) {
      const color = choose(reflectionColors);
      const material = new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: range(0.04, 0.12),
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      const strip = new THREE.Mesh(
        new THREE.PlaneGeometry(range(0.08, 0.32), range(1.2, 5.2)),
        material
      );
      strip.rotation.x = -Math.PI / 2;
      strip.rotation.z = range(-0.08, 0.08);
      strip.position.set(range(-3.6, 3.6), 0.024, range(-27, 9));
      scene.add(strip);
      reflectionStrips.push(strip);
    }

    const ambient = new THREE.HemisphereLight(0x183b66, 0x09040b, 0.75);
    scene.add(ambient);

    const moonLight = new THREE.DirectionalLight(0x7eb9ff, 1.4);
    moonLight.position.set(-4, 15, 8);
    moonLight.target.position.set(0, 0, -10);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.set(1024, 1024);
    moonLight.shadow.camera.left = -10;
    moonLight.shadow.camera.right = 10;
    moonLight.shadow.camera.top = 14;
    moonLight.shadow.camera.bottom = -5;
    moonLight.shadow.camera.near = 1;
    moonLight.shadow.camera.far = 55;
    moonLight.shadow.bias = -0.0004;
    scene.add(moonLight, moonLight.target);

    function createNeonSign(config) {
      const group = new THREE.Group();
      group.position.set(config.x, config.y, config.z);
      group.rotation.y = config.side < 0 ? Math.PI / 2 : -Math.PI / 2;
      scene.add(group);

      const texture = canvasTexture(384, 768, (ctx, w, h) => {
        ctx.fillStyle = '#05070c';
        ctx.fillRect(0, 0, w, h);

        const glow = ctx.createRadialGradient(
          w / 2,
          h / 2,
          10,
          w / 2,
          h / 2,
          h * 0.65
        );
        glow.addColorStop(0, config.glow + '55');
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = config.glow;
        ctx.lineWidth = 10;
        ctx.shadowColor = config.glow;
        ctx.shadowBlur = 28;
        ctx.strokeRect(16, 16, w - 32, h - 32);

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = config.glow;
        ctx.shadowBlur = 36;
        ctx.font = `bold ${config.vertical ? 112 : 86}px sans-serif`;

        const characters = Array.from(config.text);
        if (config.vertical) {
          const spacing = h / (characters.length + 1);
          characters.forEach((character, index) => {
            ctx.fillText(character, w / 2, spacing * (index + 1));
          });
        } else {
          ctx.save();
          ctx.translate(w / 2, h / 2);
          ctx.rotate(-Math.PI / 2);
          ctx.fillText(config.text, 0, 0);
          ctx.restore();
        }

        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(220,245,255,0.7)';
        ctx.font = '22px monospace';
        ctx.fillText('OPEN // 24H', w / 2, h - 52);
      });

      const frame = new THREE.Mesh(
        new THREE.BoxGeometry(config.width + 0.18, config.height + 0.18, 0.18),
        blackMetal
      );
      frame.castShadow = true;
      group.add(frame);

      const panelMaterial = new THREE.MeshStandardMaterial({
        map: texture,
        emissive: new THREE.Color(config.color),
        emissiveMap: texture,
        emissiveIntensity: config.intensity,
        roughness: 0.3,
        metalness: 0.15
      });

      const panel = new THREE.Mesh(
        new THREE.PlaneGeometry(config.width, config.height),
        panelMaterial
      );
      panel.position.z = 0.101;
      group.add(panel);

      const armTop = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, 0.12, config.arm),
        blackMetal
      );
      armTop.position.set(0, config.height * 0.36, -config.arm * 0.5);
      group.add(armTop);

      const armBottom = armTop.clone();
      armBottom.position.y = -config.height * 0.36;
      group.add(armBottom);

      const light = new THREE.PointLight(
        config.color,
        config.lightIntensity,
        6,
        2
      );
      light.position.set(0, 0, 1.1);
      group.add(light);

      return {
        group,
        panelMaterial,
        light,
        baseIntensity: config.intensity,
        phase: range(0, Math.PI * 2),
        speed: range(2.2, 5.6)
      };
    }

    const signs = [
      createNeonSign({
        x: -4.18,
        y: 6.4,
        z: 3.4,
        side: -1,
        width: 1.15,
        height: 3.2,
        arm: 1.25,
        text: '電脳',
        vertical: true,
        glow: '#00eaff',
        color: 0x00d9ff,
        intensity: 3.2,
        lightIntensity: 10
      }),
      createNeonSign({
        x: 4.15,
        y: 7.8,
        z: -1.8,
        side: 1,
        width: 1.35,
        height: 3.7,
        arm: 1.15,
        text: '夢街',
        vertical: true,
        glow: '#ff2b9d',
        color: 0xff168f,
        intensity: 3.6,
        lightIntensity: 12
      }),
      createNeonSign({
        x: -4.15,
        y: 8.9,
        z: -8.3,
        side: -1,
        width: 1.05,
        height: 2.8,
        arm: 1.05,
        text: '龍',
        vertical: true,
        glow: '#9c4dff',
        color: 0x8b36ff,
        intensity: 3.4,
        lightIntensity: 9
      }),
      createNeonSign({
        x: 4.15,
        y: 5.1,
        z: -13.7,
        side: 1,
        width: 1.2,
        height: 2.9,
        arm: 1.35,
        text: '夜市',
        vertical: true,
        glow: '#ffae00',
        color: 0xff8a00,
        intensity: 3.1,
        lightIntensity: 8
      }),
      createNeonSign({
        x: -4.14,
        y: 6.9,
        z: -20.8,
        side: -1,
        width: 1.25,
        height: 3.1,
        arm: 1.2,
        text: '麺',
        vertical: true,
        glow: '#21ff81',
        color: 0x16ff6a,
        intensity: 3.3,
        lightIntensity: 8
      })
    ];

    function createSmallWallSign(side, y, z, color, label) {
      const texture = canvasTexture(512, 192, (ctx, w, h) => {
        ctx.fillStyle = '#07090e';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = color;
        ctx.lineWidth = 8;
        ctx.strokeRect(8, 8, w - 16, h - 16);
        ctx.font = 'bold 68px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 24;
        ctx.fillText(label, w / 2, h / 2);
      });

      const material = new THREE.MeshStandardMaterial({
        map: texture,
        emissiveMap: texture,
        emissive: new THREE.Color(color),
        emissiveIntensity: 2.2,
        roughness: 0.4
      });

      const sign = new THREE.Mesh(
        new THREE.PlaneGeometry(2.4, 0.9),
        material
      );
      sign.position.set(side * 4.42, y, z);
      sign.rotation.y = side < 0 ? Math.PI / 2 : -Math.PI / 2;
      scene.add(sign);
      return material;
    }

    const smallSignMaterials = [
      createSmallWallSign(-1, 3.2, -3.2, '#00ccff', 'K-09 // 酒'),
      createSmallWallSign(1, 9.7, -6.2, '#ff3cba', 'VOID ARCADE'),
      createSmallWallSign(-1, 10.8, -15.4, '#ffb000', 'ラーメン'),
      createSmallWallSign(1, 3.1, -23.8, '#22ff99', '地下入口')
    ];

    const stall = new THREE.Group();
    stall.position.set(2.15, 0, -6.8);
    scene.add(stall);

    function stallBox(width, height, depth, material, x, y, z) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, depth),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      stall.add(mesh);
      return mesh;
    }

    stallBox(3.35, 0.9, 2.25, darkMetal, 0, 0.58, 0);
    stallBox(3.55, 0.16, 2.45, wornMetal, 0, 1.09, 0);
    stallBox(0.12, 2.4, 0.12, blackMetal, -1.58, 2.15, -0.93);
    stallBox(0.12, 2.4, 0.12, blackMetal, 1.58, 2.15, -0.93);
    stallBox(0.12, 2.4, 0.12, blackMetal, -1.58, 2.15, 0.93);
    stallBox(0.12, 2.4, 0.12, blackMetal, 1.58, 2.15, 0.93);

    const canopyTexture = canvasTexture(512, 256, (ctx, w, h) => {
      ctx.fillStyle = '#8c102c';
      ctx.fillRect(0, 0, w, h);

      for (let x = 0; x < w; x += 64) {

        }

        const life = particle.life;
        const angle = life * Math.PI * 3;
        particle.sprite.position.x =
          particle.origin.x +
          Math.sin(angle) * particle.spread * 0.65 +
          particle.drift * life;
        particle.sprite.position.y =
          particle.origin.y + life * particle.height;
        particle.sprite.position.z =
          particle.origin.z +
          Math.cos(angle * 0.8) * particle.spread * 0.45;

        const expansion = particle.baseScale * (0.65 + life * 1.7);
        particle.sprite.scale.set(expansion, expansion * 1.12, 1);
        particle.sprite.material.opacity =
          Math.sin(life * Math.PI) * 0.22;
        particle.sprite.material.rotation += delta * particle.drift * 0.4;
      }
    }

    function animateSigns(time) {
      signs.forEach((sign, index) => {
        const softPulse =
          0.88 + Math.sin(time * sign.speed + sign.phase) * 0.1;
        const glitch =
          Math.sin(time * 19 + sign.phase * 3) > 0.985 ? 0.16 : 1;
        const intensity = sign.baseIntensity * softPulse * glitch;
        sign.panelMaterial.emissiveIntensity = intensity;
        sign.light.intensity =
          (7 + index) * softPulse * glitch;
      });

      smallSignMaterials.forEach((material, index) => {
        material.emissiveIntensity =
          1.9 + Math.sin(time * (2.2 + index * 0.3) + index) * 0.28;
      });

      lanterns.forEach((lantern) => {
        lantern.material.emissiveIntensity =
          3.25 + Math.sin(time * 3.1 + lantern.phase) * 0.35;
        lantern.group.rotation.z =
          Math.sin(time * 0.9 + lantern.phase) * 0.025;
      });
    }

    function animateHolograms(time) {
      holograms.forEach((hologram, index) => {
        const flicker =
          0.38 +
          Math.sin(time * (4.2 + index) + hologram.phase) * 0.08 +
          (Math.sin(time * 31 + hologram.phase) > 0.94 ? -0.25 : 0);
        hologram.material.opacity = Math.max(0.1, flicker);
        hologram.panel.position.y =
          Math.sin(time * 1.4 + hologram.phase) * 0.06;
        hologram.panel.scale.x =
          1 + Math.sin(time * 18 + hologram.phase) * 0.012;
        hologram.glow.intensity = 3.5 + flicker * 4;
      });
    }

    function animateDrone(time, delta) {
      drone.position.y = 6.35 + Math.sin(time * 1.65) * 0.22;
      drone.position.x = -0.5 + Math.sin(time * 0.42) * 0.5;
      drone.rotation.z = Math.sin(time * 1.1) * 0.045;
      drone.rotation.y = Math.sin(time * 0.33) * 0.16;
      droneRotors.forEach((rotor, index) => {
        rotor.rotation.y += delta * (35 + index * 2);
      });
      droneEyeMaterial.emissiveIntensity =
        5.5 + Math.sin(time * 7) * 1.5;
      droneLight.intensity = 16 + Math.sin(time * 2.2) * 3;
    }

    function animateEnvironment(time, delta) {
      acUnits.forEach((unit, index) => {
        unit.fan.rotation.z -= delta * (2.5 + index * 0.22);
      });

      droplets.forEach((drop) => {
        const cycle = (time * 0.55 + drop.offset) % 1;
        drop.mesh.position.y = drop.origin.y - cycle * 2.4;
        drop.mesh.scale.setScalar(0.7 + cycle * 0.65);
        drop.mesh.material.opacity = 0.75 * (1 - cycle);
      });

      splashRings.forEach((splash) => {
        splash.life += delta * splash.speed;
        if (splash.life > 1) {
          splash.life -= 1;
          splash.ring.position.set(
            range(-4, 4),
            0.045,
            range(-29, 11)
          );
        }
        const scale = 0.4 + splash.life * 3.6;
        splash.ring.scale.setScalar(scale);
        splash.ring.material.opacity =
          (1 - splash.life) * 0.24;
      });

      puddles.forEach((puddle, index) => {
        puddle.material.opacity =
          (index % 2 === 0 ? 0.11 : 0.09) +
          Math.sin(time * 1.2 + index) * 0.018;
      });

      reflectionStrips.forEach((strip, index) => {
        strip.material.opacity =
          0.06 +
          Math.sin(time * 2.5 + index * 0.7) * 0.025;
      });

      canopyLight.intensity = 17 + Math.sin(time * 2.4) * 1.2;
    }

    function animate() {
      const delta = Math.min(clock.getDelta(), 0.05);
      const time = clock.elapsedTime;

      animateRain(delta);
      animateSteam(delta);
      animateSigns(time);
      animateHolograms(time);
      animateDrone(time, delta);
      animateEnvironment(time, delta);

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
