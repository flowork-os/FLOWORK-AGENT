<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick-Built Dragon</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #10191a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10191a);
scene.fog = new THREE.Fog(0x10191a, 18, 34);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(8.8, 5.4, 10.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 7;
controls.maxDistance = 22;
controls.target.set(0, 1.9, 0);

const emerald = new THREE.MeshStandardMaterial({
  color: 0x138448,
  roughness: 0.25,
  metalness: 0.08
});
const emeraldDark = new THREE.MeshStandardMaterial({
  color: 0x075b36,
  roughness: 0.3,
  metalness: 0.1
});
const emeraldLight = new THREE.MeshStandardMaterial({
  color: 0x25a95a,
  roughness: 0.22,
  metalness: 0.08
});
const orange = new THREE.MeshStandardMaterial({
  color: 0xf06b24,
  roughness: 0.24,
  metalness: 0.05
});
const orangeDark = new THREE.MeshStandardMaterial({
  color: 0xb74417,
  roughness: 0.3,
  metalness: 0.08
});
const hingeMaterial = new THREE.MeshStandardMaterial({
  color: 0x5b3020,
  roughness: 0.34,
  metalness: 0.12
});
const wingMaterial = new THREE.MeshStandardMaterial({
  color: 0xf6d447,
  roughness: 0.18,
  metalness: 0.03,
  transparent: true,
  opacity: 0.72,
  side: THREE.DoubleSide,
  depthWrite: false
});
const wingEdgeMaterial = new THREE.MeshStandardMaterial({
  color: 0xffe778,
  roughness: 0.2,
  metalness: 0.02
});
const darkMaterial = new THREE.MeshStandardMaterial({
  color: 0x18201d,
  roughness: 0.38,
  metalness: 0.18
});
const eyeMaterial = new THREE.MeshStandardMaterial({
  color: 0xffe36e,
  roughness: 0.16,
  metalness: 0.04,
  emissive: 0x6d4307,
  emissiveIntensity: 0.22
});
const blackMaterial = new THREE.MeshStandardMaterial({
  color: 0x090c0a,
  roughness: 0.22,
  metalness: 0.05
});

const dragon = new THREE.Group();
dragon.rotation.y = -0.16;
scene.add(dragon);

function positionsForSpan(span, count) {
  if (count <= 1) return [0];
  const values = [];
  const margin = Math.min(0.15, span * 0.2);
  const usable = span - margin * 2;
  for (let index = 0; index < count; index += 1) {
    values.push(-usable / 2 + usable * index / (count - 1));
  }
  return values;
}

function makeBrick(parent, x, y, z, sx, sy, sz, material, addStuds = true) {
  const brickGroup = new THREE.Group();
  const brickMesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), material);
  brickMesh.castShadow = true;
  brickMesh.receiveShadow = true;
  brickGroup.add(brickMesh);

  if (addStuds && sx > 0.3 && sz > 0.3) {
    const xCount = Math.max(1, Math.floor(sx / 0.42));
    const zCount = Math.max(1, Math.floor(sz / 0.42));
    const xValues = positionsForSpan(sx, xCount);
    const zValues = positionsForSpan(sz, zCount);
    const studGeometry = new THREE.CylinderGeometry(0.115, 0.115, 0.085, 16);
    for (const studX of xValues) {
      for (const studZ of zValues) {
        const stud = new THREE.Mesh(studGeometry, material);
        stud.position.set(studX, sy / 2 + 0.042, studZ);
        stud.castShadow = true;
        stud.receiveShadow = true;
        brickGroup.add(stud);
      }
    }
  }

  brickGroup.position.set(x, y, z);
  parent.add(brickGroup);
  return brickGroup;
}

function makeTube(parent, x, y, z, length, radius, material, axis = "x") {
  const tube = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, length, 14),
    material
  );
  if (axis === "x") tube.rotation.z = Math.PI / 2;
  if (axis === "z") tube.rotation.x = Math.PI / 2;
  tube.position.set(x, y, z);
  tube.castShadow = true;
  tube.receiveShadow = true;
  parent.add(tube);
  return tube;
}

function makeBall(parent, x, y, z, radius, material) {
  const ball = new THREE.Mesh(new THREE.SphereGeometry(radius, 20, 14), material);
  ball.position.set(x, y, z);
  ball.castShadow = true;
  ball.receiveShadow = true;
  parent.add(ball);
  return ball;
}

function makeBeam(parent, start, end, thickness, material) {
  const direction = new THREE.Vector3().subVectors(end, start);
  const beam = new THREE.Mesh(
    new THREE.BoxGeometry(thickness, thickness, direction.length()),
    material
  );
  beam.position.copy(start).add(end).multiplyScalar(0.5);
  beam.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 0, 1),
    direction.normalize()
  );
  beam.castShadow = true;
  beam.receiveShadow = true;
  parent.add(beam);
  return beam;
}

function makeWedge(parent, x, y, z) {
  const wedgeLength = 1.3;
  const wedgeWidth = 0.92;
  const wedgeVertices = new Float32Array([
    -wedgeLength / 2, -0.28, -wedgeWidth / 2,
    -wedgeLength / 2, -0.28, wedgeWidth / 2,
    -wedgeLength / 2, 0.22, -wedgeWidth / 2,
    -wedgeLength / 2, 0.22, wedgeWidth / 2,
    wedgeLength / 2, -0.28, -wedgeWidth / 2,
    wedgeLength / 2, -0.28, wedgeWidth / 2,
    wedgeLength / 2, 0.58, -wedgeWidth / 2,
    wedgeLength / 2, 0.58, wedgeWidth / 2
  ]);
  const wedgeIndices = [
    0, 1, 3, 0, 3, 2,
    4, 6, 7, 4, 7, 5,
    0, 4, 5, 0, 5, 1,
    2, 3, 7, 2, 7, 6,
    0, 2, 6, 0, 6, 4,
    1, 5, 7, 1, 7, 3
  ];
  const wedgeGeometry = new THREE.BufferGeometry();
  wedgeGeometry.setAttribute("position", new THREE.BufferAttribute(wedgeVertices, 3));
  wedgeGeometry.setIndex(wedgeIndices);
  wedgeGeometry.computeVertexNormals();

  const wedge = new THREE.Mesh(wedgeGeometry, emeraldLight);
  wedge.position.set(x, y, z);
  wedge.castShadow = true;
  wedge.receiveShadow = true;
  parent.add(wedge);

  const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.08, 0.7), darkMaterial);
  mouth.position.set(x - 0.1, y - 0.285, z);
  mouth.castShadow = true;
  parent.add(mouth);

  const nostrilGeometry = new THREE.CylinderGeometry(0.105, 0.105, 0.11, 16);
  for (const nostrilZ of [-0.24, 0.24]) {
    const nostril = new THREE.Mesh(nostrilGeometry, blackMaterial);
    nostril.position.set(x - 0.39, y + 0.25, z + nostrilZ);
    nostril.castShadow = true;
    parent.add(nostril);
  }
}

function makeWing(side) {
  const wingShape = new THREE.Shape();
  wingShape.moveTo(0, 0);
  wingShape.lineTo(0.82, 0.48);
  wingShape.lineTo(2.28, 1.48);
  wingShape.lineTo(3.35, 1.98);
  wingShape.lineTo(2.84, 1.08);
  wingShape.lineTo(1.58, 0.23);
  wingShape.lineTo(0, 0);

  const wingGeometry = new THREE.ExtrudeGeometry(wingShape, {
    depth: 0.12,
    bevelEnabled: false
  });
  wingGeometry.computeVertexNormals();

  const wing = new THREE.Mesh(wingGeometry, wingMaterial);
  wing.rotation.y = -Math.PI / 2;
  wing.scale.x = side;
  wing.position.set(0.45, 2.02, side * 0.93);
  wing.castShadow = true;
  wing.receiveShadow = true;
  dragon.add(wing);

  const rootPoint = new THREE.Vector3(0.38, 2.03, side * 0.98);
  const ribA = new THREE.Vector3(0.38, 2.03 + 0.58, side * (0.98 + 1.55));
  const ribB = new THREE.Vector3(0.38, 2.03 + 1.3, side * (0.98 + 2.65));
  const ribC = new THREE.Vector3(0.38, 2.03 + 1.77, side * (0.98 + 3.05));
  makeBeam(dragon, rootPoint, ribB, 0.075, wingEdgeMaterial);
  makeBeam(dragon, new THREE.Vector3(0.38, 2.03, side * 0.98), ribC, 0.075, wingEdgeMaterial);
  makeBeam(dragon, ribA, ribC, 0.065, wingEdgeMaterial);

  const axle = new THREE.Mesh(
    new THREE.CylinderGeometry(0.19, 0.19, 0.58, 18),
    hingeMaterial
  );
  axle.rotation.x = Math.PI / 2;
  axle.position.set(0.43, 2.03, side * 1.01);
  axle.castShadow = true;
  dragon.add(axle);

  makeBrick(dragon, 0.43, 2.03, side * 0.75, 0.42, 0.28, 0.42, hingeMaterial, false);
  makeBrick(dragon, 0.43, 2.03, side * 1.27, 0.42, 0.28, 0.42, hingeMaterial, false);
}

makeBrick(dragon, -0.05, 1.55, 0, 3.1, 1.42, 1.9, emerald, true);
makeBrick(dragon, 0.15, 2.28, 0, 2.48, 0.52, 1.55, emeraldLight, true);
makeBrick(dragon, -0.82, 2.63, 0, 0.72, 0.26, 1.48, emeraldDark, true);
makeBrick(dragon, 0.18, 0.28, 0, 2.36, 0.22, 1.46, emeraldDark, false);

for (const undersideZ of [-0.58, 0, 0.58]) {
  makeTube(dragon, 0, 0.42, undersideZ, 2.25, 0.12, emeraldDark, "x");
}

const legLocations = [
  [-0.98, 0.73],
  [0.98, 0.73],
  [-0.98, -0.73],
  [0.98, -0.73]
];

for (const legLocation of legLocations) {
  const legX = legLocation[0];
  const legZ = legLocation[1];
  makeBrick(dragon, legX, 0.72, legZ, 0.62, 0.88, 0.62, emerald, true);
  makeBrick(dragon, legX + 0.1, 0.22, legZ, 0.78, 0.28, 0.78, emeraldLight, true);
  makeBrick(dragon, legX + 0.27, 0.12, legZ + (legZ > 0 ? 0.06 : -0.06), 0.25, 0.18, 0.18, orangeDark, true);
}

const tailSegments = [
  [-1.65, 1.75, 1.35, 0.7, 1.35],
  [-2.55, 1.48, 1.1, 0.56, 1.05],
  [-3.28, 1.22, 0.86, 0.44, 0.78],
  [-3.92, 1.02, 0.63, 0.32, 0.56],
  [-4.42, 0.89, 0.42, 0.24, 0.38]
];

for (const tailSegment of tailSegments) {
  makeBrick(
    dragon,
    tailSegment[0],
    tailSegment[1],
    0,
    tailSegment[2],
    tailSegment[3],
    tailSegment[4],
    emerald,
    true
  );
}

for (const spineX of [-1.28, -0.55, 0.18, 0.9, 1.48]) {
  makeBrick(dragon, spineX, 2.72, 0, 0.42, 0.24, 0.72, orange, true);
}

makeBrick(dragon, 1.18, 2.58, 0, 0.78, 0.32, 1.18, emeraldDark, true);
makeBrick(dragon, 1.3, 2.97, 0, 0.62, 0.5, 0.98, emerald, true);
makeBall(dragon, 1.42, 3.27, 0, 0.24, hingeMaterial);
makeBrick(dragon, 1.55, 3.48, 0, 0.66, 0.48, 0.9, emeraldLight, true);
makeBall(dragon, 1.82, 3.7, 0, 0.23, hingeMaterial);
makeBrick(dragon, 2.08, 3.88, 0, 0.72, 0.46, 0.92, emerald, true);
makeWedge(dragon, 2.72, 3.91, 0);

for (const eyeZ of [-0.45, 0.45]) {
  makeBall(dragon, 2.62, 4.22, eyeZ, 0.17, eyeMaterial);
  makeBall(dragon, 2.73, 4.23, eyeZ + (eyeZ > 0 ? 0.08 : -0.08), 0.075, blackMaterial);
}

for (const hornZ of [-0.31, 0.31]) {
  const horn = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.45, 12), orangeDark);
  horn.position.set(1.9, 4.26, hornZ);
  horn.rotation.z = -0.25;
  horn.castShadow = true;
  dragon.add(horn);
}

makeWing(1);
makeWing(-1);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x253332,
  roughness: 0.75,
  metalness: 0.02
});
const floor = new THREE.Mesh(new THREE.CylinderGeometry(8.5, 8.5, 0.35, 64), floorMaterial);
floor.position.y = -0.16;
floor.receiveShadow = true;
scene.add(floor);

const backdrop = new THREE.Mesh(
  new THREE.CircleGeometry(7.8, 64),
  new THREE.MeshBasicMaterial({ color: 0x172323, side: THREE.DoubleSide })
);
backdrop.rotation.x = -Math.PI / 2;
backdrop.position.y = 0.015;
scene.add(backdrop);

const hemiLight = new THREE.HemisphereLight(0xbfe8d5, 0x15201e, 2.2);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(0xfff3cf, 4.2);
keyLight.position.set(6, 10, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -10;
keyLight.shadow.camera.right = 10;
keyLight.shadow.camera.top = 12;
keyLight.shadow.camera.bottom = -4;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 30;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x62b9ff, 2.3);
rimLight.position.set(-8, 5, -8);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0xff8c42, 1.35, 18, 2);
fillLight.position.set(1, 4, 5);
scene.add(fillLight);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

function resizeScene() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.addEventListener("resize", resizeScene);
animate();
</script>
</body>
</html>
