<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toon Mushroom Cottage</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #9fd9df;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd9df);
scene.fog = new THREE.Fog(0x9fd9df, 14, 28);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(8.2, 5.6, 10.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 7;
controls.maxDistance = 15;
controls.target.set(0, 3.1, 0);

const hemi = new THREE.HemisphereLight(0xd9ffff, 0x557447, 2.5);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff4d2, 4.2);
keyLight.position.set(-5, 9, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -8;
keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 10;
keyLight.shadow.camera.bottom = -3;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0x8ed9ff, 18, 16, 2);
fillLight.position.set(5, 3, 5);
scene.add(fillLight);

function toonMaterial(color) {
  return new THREE.MeshToonMaterial({ color });
}

function finish(mesh, cast = true, receive = true) {
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  return mesh;
}

function makeLathe(points, material, segments = 64) {
  const geometry = new THREE.LatheGeometry(
    points.map(point => new THREE.Vector2(point[0], point[1])),
    segments
  );
  geometry.computeVertexNormals();
  return finish(new THREE.Mesh(geometry, material));
}

const cottage = new THREE.Group();
scene.add(cottage);

const stalkMaterial = toonMaterial(0xffe7b2);
const stalk = makeLathe([
  [0.0, 0.0],
  [0.76, 0.02],
  [1.08, 0.22],
  [1.22, 0.62],
  [1.28, 1.35],
  [1.34, 2.08],
  [1.40, 2.55],
  [1.32, 2.88],
  [1.12, 3.10],
  [0.0, 3.16]
], stalkMaterial);
cottage.add(stalk);

const lowerBand = finish(new THREE.Mesh(
  new THREE.TorusGeometry(1.13, 0.12, 16, 64),
  toonMaterial(0xe8b878)
));
lowerBand.rotation.x = Math.PI / 2;
lowerBand.position.y = 0.33;
cottage.add(lowerBand);

const roofMaterial = toonMaterial(0xd9433f);
const roof = makeLathe([
  [0.0, 3.02],
  [0.78, 3.03],
  [1.42, 3.08],
  [2.08, 3.18],
  [2.43, 3.40],
  [2.50, 3.73],
  [2.38, 4.18],
  [2.10, 4.67],
  [1.73, 5.08],
  [1.22, 5.38],
  [0.62, 5.56],
  [0.0, 5.62]
], roofMaterial, 96);
cottage.add(roof);

const scallopMaterial = toonMaterial(0xc93438);
for (let index = 0; index < 12; index++) {
  const angle = (index / 12) * Math.PI * 2;
  const scallop = finish(new THREE.Mesh(
    new THREE.SphereGeometry(0.52, 32, 20),
    scallopMaterial
  ));
  scallop.scale.set(1.08, 0.72, 0.74);
  scallop.position.set(Math.cos(angle) * 2.13, 3.18, Math.sin(angle) * 2.13);
  cottage.add(scallop);
}

const spotMaterial = toonMaterial(0xfff3d0);
const spots = [
  [0.0, 5.52, 0.0, 0.48, 0.18, 0.48],
  [-0.95, 5.08, 0.28, 0.48, 0.16, 0.38],
  [0.92, 5.12, 0.34, 0.52, 0.17, 0.42],
  [-1.62, 4.50, 0.22, 0.40, 0.14, 0.31],
  [1.52, 4.48, 0.24, 0.42, 0.14, 0.33],
  [-0.35, 4.43, 1.53, 0.47, 0.15, 0.38],
  [0.78, 4.08, 1.43, 0.38, 0.14, 0.30],
  [-1.02, 3.92, 1.18, 0.34, 0.13, 0.27],
  [0.20, 5.03, -1.15, 0.36, 0.14, 0.30],
  [-1.35, 4.15, -0.72, 0.39, 0.14, 0.31]
];

for (const spotData of spots) {
  const spot = finish(new THREE.Mesh(
    new THREE.SphereGeometry(1, 32, 20),
    spotMaterial
  ));
  spot.position.set(spotData[0], spotData[1], spotData[2]);
  spot.scale.set(spotData[3], spotData[4], spotData[5]);
  cottage.add(spot);
}

const doorShape = new THREE.Shape();
doorShape.moveTo(-0.58, 0);
doorShape.lineTo(0.58, 0);
doorShape.lineTo(0.58, 1.05);
doorShape.quadraticCurveTo(0.58, 1.78, 0, 1.92);
doorShape.quadraticCurveTo(-0.58, 1.78, -0.58, 1.05);
doorShape.closePath();

const door = finish(new THREE.Mesh(
  new THREE.ExtrudeGeometry(doorShape, {
    depth: 0.16,
    bevelEnabled: true,
    bevelSegments: 3,
    bevelSize: 0.045,
    bevelThickness: 0.045,
    curveSegments: 16
  }),
  toonMaterial(0x70433b)
));
door.position.set(0, 0.43, 1.31);
cottage.add(door);

const doorFrame = finish(new THREE.Mesh(
  new THREE.TorusGeometry(0.83, 0.075, 12, 48, Math.PI),
  toonMaterial(0xf4c875)
));
doorFrame.rotation.z = Math.PI;
doorFrame.rotation.y = Math.PI / 2;
doorFrame.scale.set(1, 1.2, 1);
doorFrame.position.set(0, 1.48, 1.44);
cottage.add(doorFrame);

const knob = finish(new THREE.Mesh(
  new THREE.SphereGeometry(0.075, 16, 12),
  toonMaterial(0xffd76f)
));
knob.position.set(0.32, 1.08, 1.52);
cottage.add(knob);

function addWindow(x, y, z) {
  const frame = finish(new THREE.Mesh(
    new THREE.CylinderGeometry(0.40, 0.40, 0.15, 32),
    toonMaterial(0xf3c46e)
  ));
  frame.rotation.x = Math.PI / 2;
  frame.position.set(x, y, z);
  cottage.add(frame);

  const glass = finish(new THREE.Mesh(
    new THREE.CircleGeometry(0.31, 32),
    toonMaterial(0x78c9d2)
  ));
  glass.position.set(x, y, z + 0.085);
  cottage.add(glass);

  const mullionVertical = finish(new THREE.Mesh(
    new THREE.BoxGeometry(0.045, 0.58, 0.035),
    toonMaterial(0xf7db91)
  ));
  mullionVertical.position.set(x, y, z + 0.13);
  cottage.add(mullionVertical);

  const mullionHorizontal = finish(new THREE.Mesh(
    new THREE.BoxGeometry(0.58, 0.045, 0.035),
    toonMaterial(0xf7db91)
  ));
  mullionHorizontal.position.set(x, y, z + 0.13);
  cottage.add(mullionHorizontal);
}

addWindow(-0.82, 2.12, 1.13);
addWindow(0.82, 2.12, 1.13);

const chimney = finish(new THREE.Mesh(
  new THREE.CylinderGeometry(0.25, 0.30, 0.72, 16),
  toonMaterial(0xd38b6b)
));
chimney.position.set(1.22, 5.12, -0.15);
chimney.rotation.z = -0.12;
cottage.add(chimney);

const chimneyCap = finish(new THREE.Mesh(
  new THREE.CylinderGeometry(0.34, 0.34, 0.12, 16),
  toonMaterial(0xa96152)
));
chimneyCap.position.set(1.25, 5.50, -0.15);
chimneyCap.rotation.z = -0.12;
cottage.add(chimneyCap);

const ground = finish(new THREE.Mesh(
  new THREE.CircleGeometry(8, 96),
  toonMaterial(0x73b66c)
), false, true);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.04;
scene.add(ground);

const shadowPatch = finish(new THREE.Mesh(
  new THREE.CircleGeometry(2.75, 64),
  new THREE.MeshBasicMaterial({ color: 0x4e8b5d, transparent: true, opacity: 0.28 })
), false, false);
shadowPatch.rotation.x = -Math.PI / 2;
shadowPatch.scale.set(1, 0.42, 1);
shadowPatch.position.y = 0.005;
scene.add(shadowPatch);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
