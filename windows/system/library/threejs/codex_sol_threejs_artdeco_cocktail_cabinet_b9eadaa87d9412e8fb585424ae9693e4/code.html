<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Deco Cocktail Cabinet</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #08090b;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x090a0d);
  scene.fog = new THREE.FogExp2(0x090a0d, 0.025);

  const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(10.5, 6.7, 14.5);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  const roomEnvironment = new RoomEnvironment();
  scene.environment = pmremGenerator.fromScene(roomEnvironment, 0.04).texture;
  roomEnvironment.dispose();
  pmremGenerator.dispose();

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 4.05, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.enablePan = false;
  controls.minDistance = 9;
  controls.maxDistance = 24;
  controls.minPolarAngle = 0.7;
  controls.maxPolarAngle = 1.62;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.55;

  const ebony = new THREE.MeshPhysicalMaterial({
    color: 0x08090b,
    metalness: 0.12,
    roughness: 0.16,
    clearcoat: 1,
    clearcoatRoughness: 0.075
  });

  const ebonySoft = new THREE.MeshPhysicalMaterial({
    color: 0x111217,
    metalness: 0.05,
    roughness: 0.24,
    clearcoat: 0.85,
    clearcoatRoughness: 0.12
  });

  const blackInset = new THREE.MeshStandardMaterial({
    color: 0x020304,
    metalness: 0.3,
    roughness: 0.2
  });

  const brass = new THREE.MeshPhysicalMaterial({
    color: 0xd7a844,
    metalness: 1,
    roughness: 0.16,
    clearcoat: 0.75,
    clearcoatRoughness: 0.1
  });

  const paleBrass = new THREE.MeshPhysicalMaterial({
    color: 0xffd77a,
    metalness: 1,
    roughness: 0.12,
    clearcoat: 1,
    clearcoatRoughness: 0.08
  });

  const darkBrass = new THREE.MeshStandardMaterial({
    color: 0x6f4317,
    metalness: 0.95,
    roughness: 0.27
  });

  const cabinet = new THREE.Group();
  cabinet.rotation.y = -0.06;
  scene.add(cabinet);

  function addBox(parent, width, height, depth, x, y, z, material, bevelScale = null) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
    mesh.position.set(x, y, z);
    if (bevelScale) mesh.scale.set(bevelScale.x, bevelScale.y, bevelScale.z);
    parent.add(mesh);
    return mesh;
  }

  function addCylinder(parent, radiusTop, radiusBottom, height, segments, x, y, z, material, rotationZ = 0) {
    const mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments, 1, false),
      material
    );
    mesh.position.set(x, y, z);
    mesh.rotation.z = rotationZ;
    parent.add(mesh);
    return mesh;
  }

  const body = new THREE.Group();
  cabinet.add(body);

  addBox(body, 4.76, 5.8, 1.52, 0, 4.12, 0, ebonySoft);
  addBox(body, 4.42, 5.47, 0.10, 0, 4.12, 0.795, blackInset);

  addBox(body, 2.105, 5.18, 0.13, -1.075, 4.12, 0.865, ebony);
  addBox(body, 2.105, 5.18, 0.13, 1.075, 4.12, 0.865, ebony);

  addBox(body, 4.92, 0.25, 1.68, 0, 1.22, 0, ebony);
  addBox(body, 4.98, 0.12, 1.72, 0, 1.35, 0, brass);
  addBox(body, 4.98, 0.10, 1.72, 0, 6.96, 0, brass);

  addBox(body, 0.16, 5.48, 1.66, -2.43, 4.12, 0, darkBrass);
  addBox(body, 0.16, 5.48, 1.66, 2.43, 4.12, 0, darkBrass);

  const frontZ = 0.955;
  addBox(body, 4.63, 0.105, 0.075, 0, 1.51, frontZ, brass);
  addBox(body, 4.63, 0.105, 0.075, 0, 6.73, frontZ, brass);
  addBox(body, 0.105, 5.31, 0.075, -2.26, 4.12, frontZ, brass);
  addBox(body, 0.105, 5.31, 0.075, 2.26, 4.12, frontZ, brass);

  const doorCenters = [-1.075, 1.075];
  for (const doorX of doorCenters) {
    const halfWidth = 0.965;
    const left = doorX - halfWidth;
    const right = doorX + halfWidth;
    const lower = 1.70;
    const upper = 6.54;

    addBox(body, 1.93, 0.045, 0.045, doorX, lower, 1.005, brass);
    addBox(body, 1.93, 0.045, 0.045, doorX, upper, 1.005, brass);
    addBox(body, 0.045, 4.88, 0.045, left, 4.12, 1.005, brass);
    addBox(body, 0.045, 4.88, 0.045, right, 4.12, 1.005, brass);

    for (let i = 0; i < 5; i++) {
      const y = 1.87 + i * 1.12;
      addBox(body, 0.052, 0.052, 0.055, left, y, 1.035, paleBrass);
      addBox(body, 0.052, 0.052, 0.055, right, y, 1.035, paleBrass);
    }
  }

  const flutingX = [-2.31, -2.21, -2.11, 2.11, 2.21, 2.31];
  for (const x of flutingX) {
    addCylinder(body, 0.035, 0.035, 5.22, 12, x, 4.12, 0.982, brass);
  }

  addBox(body, 0.035, 5.17, 0.05, 0, 4.12, 1.025, darkBrass);

  const sunburst = new THREE.Group();
  body.add(sunburst);

  const sunCenterY = 3.75;
  const bounds = {
    left: -1.94,
    right: 1.94,
    bottom: 1.76 - sunCenterY,
    top: 6.48 - sunCenterY
  };

  function rayBoundaryDistance(dx, dy) {
    const candidates = [];
    if (dx > 0.0001) candidates.push(bounds.right / dx);
    if (dx < -0.0001) candidates.push(bounds.left / dx);
    if (dy > 0.0001) candidates.push(bounds.top / dy);
    if (dy < -0.0001) candidates.push(bounds.bottom / dy);
    return Math.min(...candidates.filter(value => value > 0));
  }

  const rayCount = 32;
  for (let i = 0; i < rayCount; i++) {
    const angle = (i / rayCount) * Math.PI * 2;
    const dx = Math.cos(angle);
    const dy = Math.sin(angle);
    const innerRadius = i % 2 === 0 ? 0.34 : 0.43;
    const outerDistance = rayBoundaryDistance(dx, dy) - 0.06;
    const length = Math.max(0.1, outerDistance - innerRadius);
    const width = i % 4 === 0 ? 0.052 : (i % 2 === 0 ? 0.038 : 0.025);
    const middle = innerRadius + length * 0.5;
    const ray = new THREE.Mesh(
      new THREE.BoxGeometry(length, width, 0.028),
      i % 4 === 0 ? paleBrass : brass
    );
    ray.position.set(dx * middle, sunCenterY + dy * middle, 1.036);
    ray.rotation.z = angle;
    sunburst.add(ray);
  }

  const centerDisc = new THREE.Mesh(
    new THREE.CircleGeometry(0.28, 48),
    paleBrass
  );
  centerDisc.position.set(0, sunCenterY, 1.07);
  sunburst.add(centerDisc);

  const centerRing = new THREE.Mesh(
    new THREE.TorusGeometry(0.34, 0.035, 12, 48),
    darkBrass
  );
  centerRing.position.set(0, sunCenterY, 1.075);
  sunburst.add(centerRing);

  const centerDiamond = addBox(sunburst, 0.23, 0.23, 0.05, 0, sunCenterY, 1.105, ebony);
  centerDiamond.rotation.z = Math.PI * 0.25;

  for (const x of [-0.17, 0.17]) {
    const backplate = new THREE.Mesh(
      new THREE.CylinderGeometry(0.105, 0.105, 0.035, 24),
      darkBrass
    );
    backplate.rotation.x = Math.PI * 0.5;
    backplate.position.set(x, 4.0, 1.11);
    body.add(backplate);

    const handle = addBox(body, 0.105, 0.78, 0.105, x, 4.0, 1.19, paleBrass);
    const topCap = addCylinder(body, 0.075, 0.075, 0.15, 16, x, 4.39, 1.19, brass, Math.PI * 0.5);
    const bottomCap = addCylinder(body, 0.075, 0.075, 0.15, 16, x, 3.61, 1.19, brass, Math.PI * 0.5);
    topCap.rotation.x = Math.PI * 0.5;
    bottomCap.rotation.x = Math.PI * 0.5;
    handle.rotation.z = 0;
  }

  const crown = new THREE.Group();
  cabinet.add(crown);

  addBox(crown, 5.12, 0.30, 1.77, 0, 7.10, 0, ebony);
  addBox(crown, 5.18, 0.075, 1.82, 0, 6.98, 0, paleBrass);

  addBox(crown, 4.30, 0.30, 1.57, 0, 7.39, 0, ebonySoft);
  addBox(crown, 4.36, 0.065, 1.62, 0, 7.25, 0, brass);

  addBox(crown, 3.36, 0.31, 1.38, 0, 7.69, 0, ebony);
  addBox(crown, 3.42, 0.06, 1.43, 0, 7.54, 0, brass);

  addBox(crown, 2.30, 0.30, 1.18, 0, 7.99, 0, ebonySoft);
  addBox(crown, 2.36, 0.06, 1.23, 0, 7.85, 0, paleBrass);

  addBox(crown, 1.12, 0.22, 0.98, 0, 8.25, 0, ebony);
  addBox(crown, 1.18, 0.055, 1.03, 0, 8.15, 0, brass);

  const crownFrontZ = 0.92;
  const crownDiamond = addBox(crown, 0.32, 0.32, 0.055, 0, 7.67, crownFrontZ, paleBrass);
  crownDiamond.rotation.z = Math.PI * 0.25;
  addBox(crown, 0.055, 0.48, 0.06, -0.42, 7.67, crownFrontZ, brass);
  addBox(crown, 0.055, 0.48, 0.06, 0.42, 7.67, crownFrontZ, brass);

  const legs = new THREE.Group();
  cabinet.add(legs);

  const legPositions = [
    [-1.82, 0.48],
    [1.82, 0.48],
    [-1.82, -0.48],
    [1.82, -0.48]
  ];

  for (const [x, z] of legPositions) {
    const leg = addCylinder(legs, 0.19, 0.115, 1.12, 4, x, 0.68, z, ebony);
    leg.rotation.y = Math.PI * 0.25;

    const collar = addCylinder(legs, 0.15, 0.15, 0.14, 4, x, 0.19, z, brass);
    collar.rotation.y = Math.PI * 0.25;

    const foot = addCylinder(legs, 0.115, 0.13, 0.22, 4, x, 0.08, z, paleBrass);
    foot.rotation.y = Math.PI * 0.25;
  }

  addBox(legs, 4.22, 0.20, 1.22, 0, 1.17, 0, ebony);
  addBox(legs, 4.34, 0.07, 1.30, 0, 1.06, 0, brass);

  const sideAccentGeometry = new THREE.BoxGeometry(0.035, 3.7, 0.055);
  for (const side of [-1, 1]) {
    const sideGroup = new THREE.Group();
    sideGroup.position.x = side * 2.39;
    sideGroup.position.y = 4.15;
    sideGroup.rotation.y = Math.PI * 0.5;
    cabinet.add(sideGroup);

    for (const offset of [-0.34, 0, 0.34]) {
      const accent = new THREE.Mesh(sideAccentGeometry, brass);
      accent.position.x = offset;
      accent.position.z = 0.84;
      sideGroup.add(accent);
    }
  }

  cabinet.traverse(object => {
    if (object.isMesh) {
      object.castShadow = true;
      object.receiveShadow = true;
    }
  });

  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(18, 96),
    new THREE.MeshPhysicalMaterial({
      color: 0x111216,
      metalness: 0.18,
      roughness: 0.3,
      clearcoat: 0.72,
      clearcoatRoughness: 0.14
    })
  );
  floor.rotation.x = -Math.PI * 0.5;
  floor.position.y = -0.04;
  floor.receiveShadow = true;
  scene.add(floor);

  const floorRing = new THREE.Mesh(
    new THREE.RingGeometry(3.8, 3.84, 96),
    new THREE.MeshStandardMaterial({
      color: 0x8b6527,
      metalness: 0.9,
      roughness: 0.25,
      side: THREE.DoubleSide
    })
  );
  floorRing.rotation.x = -Math.PI * 0.5;
  floorRing.position.y = -0.025;
  scene.add(floorRing);

  const hemisphereLight = new THREE.HemisphereLight(0xb9c7df, 0x2c1608, 1.35);
  scene.add(hemisphereLight);

  const keyLight = new THREE.DirectionalLight(0xffe3b0, 4.4);
  keyLight.position.set(6, 11, 8);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.left = -6;
  keyLight.shadow.camera.right = 6;
  keyLight.shadow.camera.top = 11;
  keyLight.shadow.camera.bottom = -2;
  keyLight.shadow.camera.near = 1;
  keyLight.shadow.camera.far = 28;
  keyLight.shadow.bias = -0.0003;
  scene.add(keyLight);

  const rimLight = new THREE.SpotLight(0x8fb8ff, 190, 30, 0.42, 0.65, 1.3);
  rimLight.position.set(-7, 8, -5);
  rimLight.target.position.set(0, 4.2, 0);
  scene.add(rimLight);
  scene.add(rimLight.target);

  const warmLight = new THREE.SpotLight(0xffa840, 150, 25, 0.5, 0.7, 1.4);
  warmLight.position.set(6, 4, 7);
  warmLight.target.position.set(0, 3.7, 0.5);
  scene.add(warmLight);
  scene.add(warmLight.target);

  const topLight = new THREE.PointLight(0xffd38c, 38, 14, 1.6);
  topLight.position.set(0, 10, 2);
  scene.add(topLight);

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const elapsed = clock.getElapsedTime();
    topLight.intensity = 38 + Math.sin(elapsed * 0.7) * 1.4;
    controls.update();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  animate();
</script>
</body>
</html>
