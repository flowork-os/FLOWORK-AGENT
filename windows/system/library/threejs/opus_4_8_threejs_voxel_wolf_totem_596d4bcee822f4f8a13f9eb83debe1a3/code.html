<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voxel Wolf Totem</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14161a; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: rgba(226, 232, 240, 0.45); letter-spacing: 0.14em; text-transform: uppercase;
    pointer-events: none; user-select: none; white-space: nowrap;
  }
</style>
</head>
<body>
<div id="hint">Voxel Wolf Totem &mdash; drag to orbit &middot; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------------------
// Renderer / scene / camera
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
scene.fog = new THREE.Fog(0x14161a, 46, 96);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(20, 16, 24);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.72;
controls.minDistance = 12;
controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 8.5, 0);

// ---------------------------------------------------------------------------
// Lighting: hemisphere ambient + key + fill + rim
// ---------------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0x9fb6cc, 0x2a2118, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2df, 2.5);
key.position.set(13, 21, 11);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 70;
key.shadow.camera.left = -16;
key.shadow.camera.right = 16;
key.shadow.camera.top = 24;
key.shadow.camera.bottom = -8;
key.shadow.bias = -0.0008;
key.shadow.normalBias = 0.025;
key.shadow.radius = 2.2;
scene.add(key);

const fill = new THREE.DirectionalLight(0x7fa8d8, 0.62);
fill.position.set(-14, 9, 13);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x88e6ff, 0.9);
rim.position.set(-8, 13, -16);
scene.add(rim);

const eyeGlow = new THREE.PointLight(0x36e8ff, 3.0, 16, 2.0);
eyeGlow.position.set(0, 15.6, 2.6);
scene.add(eyeGlow);

// ---------------------------------------------------------------------------
// Shadow-only ground
// ---------------------------------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(160, 160),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// Faint grid to seat the object in the studio (no shadows, subtle).
const grid = new THREE.GridHelper(80, 40, 0x2c3240, 0x21262f);
grid.material.transparent = true;
grid.material.opacity = 0.3;
grid.position.y = 0.002;
scene.add(grid);

// ---------------------------------------------------------------------------
// Voxel palette & materials
// ---------------------------------------------------------------------------
const PALETTE = {
  slate:      { color: 0x7d8894, rough: 0.86, metal: 0.0 },
  slateDark:  { color: 0x5d6772, rough: 0.88, metal: 0.0 },
  charcoal:   { color: 0x363c44, rough: 0.92, metal: 0.0 },
  charcoal2:  { color: 0x272c33, rough: 0.94, metal: 0.0 },
  cream:      { color: 0xefe6cf, rough: 0.62, metal: 0.0 },
  nose:       { color: 0x1c1f24, rough: 0.55, metal: 0.05 },
  ochre:      { color: 0xc98a2e, rough: 0.83, metal: 0.0 },
  ochreLight: { color: 0xe0a844, rough: 0.8,  metal: 0.0 },
  umber:      { color: 0x6e4423, rough: 0.9,  metal: 0.0 },
  umberDark:  { color: 0x4c2e18, rough: 0.92, metal: 0.0 },
  stone:      { color: 0x555c66, rough: 0.95, metal: 0.0 }
};

const materials = {};
for (const [name, def] of Object.entries(PALETTE)) {
  materials[name] = new THREE.MeshStandardMaterial({
    color: new THREE.Color(def.color),
    roughness: def.rough,
    metalness: def.metal,
    flatShading: true
  });
}
// Emissive cyan eye material.
materials.eye = new THREE.MeshStandardMaterial({
  color: 0x0a5f6d,
  emissive: new THREE.Color(0x3ff0ff),
  emissiveIntensity: 1.65,
  roughness: 0.35,
  metalness: 0.0,
  flatShading: true
});

// ---------------------------------------------------------------------------
// Voxel accumulation: one merged-by-material instanced set, hard 1-unit cubes
// ---------------------------------------------------------------------------
const buckets = new Map(); // materialName -> array of [x,y,z]
const occupied = new Set(); // "x,y,z" -> prevents z-fighting duplicates

function key3(x, y, z) { return x + ',' + y + ',' + z; }

/** Place a single 1-unit voxel at integer grid coords (cube center = coord+0.5). */
function vox(x, y, z, mat) {
  x = Math.round(x); y = Math.round(y); z = Math.round(z);
  const k = key3(x, y, z);
  if (occupied.has(k)) return;
  occupied.add(k);
  if (!buckets.has(mat)) buckets.set(mat, []);
  buckets.get(mat).push([x, y, z]);
}

/** Inclusive integer box of voxels. */
function box(x0, x1, y0, y1, z0, z1, mat) {
  for (let x = x0; x <= x1; x++)
    for (let y = y0; y <= y1; y++)
      for (let z = z0; z <= z1; z++)
        vox(x, y, z, mat);
}

/** Mirror helper: place at +x and -x-1 so the model is symmetric about x = 0. */
function voxM(x, y, z, mat) {
  vox(x, y, z, mat);
  vox(-x - 1, y, z, mat);
}
function boxM(x0, x1, y0, y1, z0, z1, mat) {
  box(x0, x1, y0, y1, z0, z1, mat);
  box(-x1 - 1, -x0 - 1, y0, y1, z0, z1, mat);
}

// ===========================================================================
// MODEL
// Grid convention: y = 0 is ground. +z is the front (wolf faces +z, tilted up).
// Symmetric about the plane x = 0 (voxels straddle it, so widths are even).
// ===========================================================================

// --- Ground plinth / footing -----------------------------------------------
boxM(0, 4, 0, 0, -4, 3, 'stone');       // wide flat foot, 10 x 1 x 8
boxM(0, 3, 1, 1, -3, 2, 'umberDark');   // step in

// --- Base pillar: banded ochre / umber with notched pixel pattern ----------
// Pillar core spans x:[-3,2] (6 wide), z:[-3,2] (6 deep), y from 2 up to 10.
const PILLAR_Y0 = 2;
const PILLAR_Y1 = 10;

function bandMaterial(y, x, z) {
  // Horizontal banding, 2 voxels tall per band, alternating ochre / umber.
  const band = Math.floor((y - PILLAR_Y0) / 2);
  const isOchre = band % 2 === 0;
  // Notched pixel pattern: carve a checker of darker blocks on the outer skin.
  const onSkin = (x === -3 || x === 2 || z === -3 || z === 2);
  const notch = ((x + z + y) % 3 === 0);
  if (isOchre) {
    if (onSkin && notch) return 'umber';
    return (y - PILLAR_Y0) % 2 === 0 ? 'ochre' : 'ochreLight';
  } else {
    if (onSkin && notch) return 'ochre';
    return (y - PILLAR_Y0) % 2 === 0 ? 'umber' : 'umberDark';
  }
}

for (let y = PILLAR_Y0; y <= PILLAR_Y1; y++) {
  for (let x = -3; x <= 2; x++) {
    for (let z = -3; z <= 2; z++) {
      vox(x, y, z, bandMaterial(y, x, z));
    }
  }
}

// Ledge rings (chunky stair-stepped cornices) at two heights.
function ledge(y, mat) {
  // A ring one voxel wider than the pillar on all four sides.
  for (let x = -4; x <= 3; x++) {
    for (let z = -4; z <= 3; z++) {
      const outer = (x === -4 || x === 3 || z === -4 || z === 3);
      if (outer) vox(x, y, z, mat);
    }
  }
}
ledge(4, 'umberDark');
ledge(9, 'umberDark');

// Notched corner pegs: little protruding pixels marking the pillar corners.
const cornerXZ = [[-4, -4], [3, -4], [-4, 3], [3, 3]];
for (const [cx, cz] of cornerXZ) {
  for (let y = 5; y <= 8; y += 3) {
    vox(cx, y, cz, 'ochre');
  }
}

// Carved chevron notches on the front face of the pillar (pixel pattern).
for (let i = 0; i < 3; i++) {
  const y = 3 + i * 3;
  voxM(0, y, 3, 'ochreLight');
  voxM(1, y + 1, 3, 'umberDark');
  voxM(2, y, 3, 'ochreLight');
}
// Matching notches on the rear face.
for (let i = 0; i < 3; i++) {
  const y = 3 + i * 3;
  voxM(0, y, -4, 'umber');
  voxM(2, y, -4, 'umber');
}

// --- Neck / collar: transition from pillar to head -------------------------
// Charcoal collar band, slightly wider, then a slate neck column.
boxM(0, 3, 11, 11, -4, 3, 'charcoal2');  // flared collar 8 x 1 x 8
boxM(0, 3, 12, 12, -3, 2, 'charcoal');
boxM(0, 2, 13, 15, -3, 2, 'slateDark');  // neck 6 wide
boxM(0, 2, 16, 16, -3, 2, 'charcoal');

// Ruff / mane spikes around the collar (stair-stepped fur pixels).
const ruff = [
  [3, 12, 2], [3, 12, -3], [3, 13, 0], [3, 13, -1],
  [2, 12, 3], [1, 12, 3], [2, 12, -4], [1, 12, -4],
  [3, 14, 1], [3, 14, -2]
];
for (const [x, y, z] of ruff) voxM(x, y, z, 'charcoal');

// ===========================================================================
// WOLF HEAD — howling: chin lifted, muzzle angled up toward +z / +y
// Skull occupies roughly y 16..22, z -4..4
// ===========================================================================

// --- Cranium block ---------------------------------------------------------
boxM(0, 2, 17, 20, -4, 1, 'slate');       // main skull 6w x 4h x 6d
boxM(0, 2, 21, 21, -3, 0, 'slateDark');   // top plate, inset (stair step)
boxM(0, 1, 22, 22, -2, -1, 'charcoal');   // crown pixel

// Darker back-of-skull shading.
boxM(0, 2, 17, 20, -5, -5, 'charcoal');
boxM(0, 2, 21, 21, -4, -4, 'charcoal2');

// Brow ridge: charcoal band across the front of the skull.
boxM(0, 2, 20, 20, 2, 2, 'charcoal');
boxM(0, 2, 19, 19, 2, 2, 'slateDark');

// Cheek blocks, stepping outward for a blocky jaw.
boxM(3, 3, 17, 19, -3, 0, 'slateDark');
boxM(3, 3, 18, 18, 1, 1, 'charcoal');

// --- Ears: tall stair-stepped triangular stacks ----------------------------
// Right ear (mirrored to left). Base at x 1..2, tapering upward.
function buildEar() {
  boxM(1, 2, 22, 22, -3, -1, 'slate');
  boxM(1, 2, 23, 23, -3, -2, 'slate');
  boxM(2, 2, 24, 24, -3, -2, 'slateDark');
  boxM(2, 2, 25, 25, -3, -3, 'charcoal');
  // Inner ear notch, darker.
  voxM(1, 22, -2, 'charcoal2');
  voxM(1, 23, -3, 'charcoal2');
  // Outer flare pixel.
  voxM(3, 22, -3, 'slateDark');
  voxM(3, 23, -3, 'charcoal');
}
buildEar();

// Fill between skull top and ear bases so the ears sit on solid geometry.
boxM(0, 2, 22, 22, -3, -3, 'slateDark');

// --- Muzzle: angled up and forward (howl) ----------------------------------
// The muzzle rises as it moves forward: each z step gains height.
// Segments defined as [zStart, zEnd, yBottom, yTop, halfWidth]
const muzzleSegs = [
  { z0: 2,  z1: 2,  y0: 17, y1: 19, hw: 2 },
  { z0: 3,  z1: 3,  y0: 17, y1: 19, hw: 2 },
  { z0: 4,  z1: 4,  y0: 18, y1: 20, hw: 1 },
  { z0: 5,  z1: 5,  y0: 19, y1: 21, hw: 1 },
  { z0: 6,  z1: 6,  y0: 20, y1: 22, hw: 1 }
];
for (const s of muzzleSegs) {
  boxM(0, s.hw - 1, s.y0, s.y1, s.z0, s.z1, 'slate');
}

// Muzzle bridge top shading (charcoal ridge running up the snout).
voxM(0, 20, 3, 'slateDark');
voxM(0, 21, 4, 'slateDark');
voxM(0, 22, 5, 'slateDark');
voxM(0, 23, 6, 'charcoal');

// Nose: dark voxel block at the very tip of the raised snout.
boxM(0, 0, 22, 23, 7, 7, 'nose');
boxM(0, 0, 23, 23, 6, 6, 'nose');

// --- Lower jaw: dropped open, howling ------------------------------------
// Jaw hinges near z=2 at the cheek and drops forward/down.
const jawSegs = [
  { z0: 2, z1: 2, y0: 15, y1: 16, hw: 2 },
  { z0: 3, z1: 3, y0: 15, y1: 16, hw: 2 },
  { z0: 4, z1: 4, y0: 16, y1: 17, hw: 1 },
  { z0: 5, z1: 5, y0: 17, y1: 18, hw: 1 }
];
for (const s of jawSegs) {
  boxM(0, s.hw - 1, s.y0, s.y1, s.z0, s.z1, 'charcoal');
}
// Chin tip, slate to catch light.
boxM(0, 0, 18, 18, 5, 5, 'slateDark');
// Jaw underside darker.
boxM(0, 1, 14, 14, 2, 3, 'charcoal2');

// Dark mouth cavity between upper muzzle and lower jaw.
boxM(0, 1, 16, 16, 3, 3, 'charcoal2');
boxM(0, 0, 17, 17, 4, 4, 'charcoal2');

// --- Fangs: cream voxels, upper canines down, lower canines up ------------
// Upper fangs hang from the muzzle's lower edge.
voxM(1, 16, 3, 'cream');
voxM(1, 16, 2, 'cream');
voxM(0, 17, 4, 'cream');
voxM(1, 15, 3, 'cream');   // long canine tip
// Lower fangs rise from the jaw.
voxM(1, 17, 3, 'cream');
voxM(0, 18, 4, 'cream');
voxM(1, 17, 2, 'cream');
// Small incisor row at the front of the jaw.
voxM(0, 19, 5, 'cream');

// --- Eyes: two glowing cyan voxels, set under the brow --------------------
voxM(1, 19, 2, 'eye');
// Dark socket surround so the glow reads as a pixel.
voxM(2, 19, 2, 'charcoal2');
voxM(1, 18, 2, 'charcoal2');
voxM(1, 20, 2, 'charcoal2');

// --- Fur / marking accents on the skull -----------------------------------
voxM(2, 20, -1, 'charcoal');
voxM(2, 20, -3, 'charcoal');
voxM(0, 21, -2, 'charcoal2');
voxM(2, 17, -4, 'charcoal2');

// --- Totem "wings"/side fins on the pillar shoulders ----------------------
// Blocky stepped flanges, ochre-tipped, echoing carved totem forms.
for (let i = 0; i < 3; i++) {
  voxM(4 + i, 10 - i, 0, 'umber');
  voxM(4 + i, 10 - i, -1, 'umberDark');
  voxM(4 + i, 11 - i, 0, 'ochre');
  voxM(4 + i, 11 - i, -1, 'ochre');
}

// ===========================================================================
// Build instanced meshes from the buckets
// ===========================================================================
const CUBE = new THREE.BoxGeometry(1, 1, 1);
// Slight bevel-free hard edges are desired; keep the plain box.

const totem = new THREE.Group();

const dummy = new THREE.Object3D();
let totalVoxels = 0;

// Compute bounds for centering.
let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, minZ = Infinity, maxZ = -Infinity;
for (const list of buckets.values()) {
  for (const [x, y, z] of list) {
    if (x < minX) minX = x; if (x + 1 > maxX) maxX = x + 1;
    if (y < minY) minY = y; if (y + 1 > maxY) maxY = y + 1;
    if (z < minZ) minZ = z; if (z + 1 > maxZ) maxZ = z + 1;
  }
}
const cx = (minX + maxX) / 2;
const cz = (minZ + maxZ) / 2;

for (const [matName, list] of buckets.entries()) {
  const mat = materials[matName] || materials.slate;
  const mesh = new THREE.InstancedMesh(CUBE, mat, list.length);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  for (let i = 0; i < list.length; i++) {
    const [x, y, z] = list[i];
    dummy.position.set(x + 0.5 - cx, y + 0.5 - minY, z + 0.5 - cz);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.set(1, 1, 1);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
  mesh.frustumCulled = false;
  totem.add(mesh);
  totalVoxels += list.length;
}

// Scale the whole totem to a pleasant on-screen size.
const HEIGHT_UNITS = maxY - minY;
const TARGET_HEIGHT = 17;
const s = TARGET_HEIGHT / HEIGHT_UNITS;
totem.scale.setScalar(s);
totem.position.set(0, 0, 0);
scene.add(totem);

// Reposition the eye glow light to the actual (scaled) eye location.
eyeGlow.position.set(0, (19 + 0.5 - minY) * s, (2 + 0.9 - cz) * s);
controls.target.set(0, TARGET_HEIGHT * 0.5, 0);

// Subtle cyan glow billboards over each eye for a soft bloom-ish halo.
const haloMat = new THREE.SpriteMaterial({
  color: 0x5ef2ff,
  transparent: true,
  opacity: 0.42,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});
for (const ex of [1, -2]) {
  const halo = new THREE.Sprite(haloMat);
  halo.scale.setScalar(1.9 * s);
  halo.position.set((ex + 0.5 - cx) * s, (19 + 0.5 - minY) * s, (2 + 1.0 - cz) * s);
  totem.add(halo);
}

// ---------------------------------------------------------------------------
// Resize + render loop
// ---------------------------------------------------------------------------
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  // Gentle pulse on the eye glow.
  const pulse = 1.45 + Math.sin(t * 1.9) * 0.28;
  materials.eye.emissiveIntensity = pulse;
  eyeGlow.intensity = 2.4 + Math.sin(t * 1.9) * 0.7;
  haloMat.opacity = 0.36 + Math.sin(t * 1.9) * 0.09;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
