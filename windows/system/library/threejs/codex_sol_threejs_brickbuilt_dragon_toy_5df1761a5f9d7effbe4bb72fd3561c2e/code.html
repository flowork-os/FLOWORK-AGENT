<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick-Built Emerald Dragon</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #d8e7e0; }
  canvas { display: block; }
  .label {
    position: fixed;
    left: 20px;
    bottom: 18px;
    color: #173a32;
    font: 600 12px/1.4 system-ui, sans-serif;
    letter-spacing: .12em;
    text-transform: uppercase;
    pointer-events: none;
    opacity: .68;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="label">Emerald Brick Dragon · Drag to orbit</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8e7e0);
scene.fog = new THREE.Fog(0xd8e7e0, 17, 32);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(9.5, 6.5, 11.5);
camera.lookAt(0, 1.8, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.72;
controls.target.set(0, 1.65, 0);
controls.minDistance = 7;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.48;

const hemi = new THREE.HemisphereLight(0xeefcff, 0x567064, 2.2);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4d8, 4.2);
key.position.set(6, 10, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -10;
key.shadow.camera.right = 10;
key.shadow.camera.top = 10;
key.shadow.camera.bottom = -10;
key.shadow.camera.near = 1;
key.shadow.camera.far = 28;
key.shadow.bias = -0.00025;
scene.add(key);

const fill = new THREE.DirectionalLight(0xb8ddff, 2.0);
fill.position.set(-8, 6, -5);
scene.add(fill);

const rim = new THREE.PointLight(0xffb74b, 22, 18, 2);
rim.position.set(2, 5, -5);
scene.add(rim);

const plastic = (color, roughness = 0.22, metalness = 0.02) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness });

const emerald = plastic(0x087c4b, 0.2);
const emeraldDark = plastic(0x035936, 0.23);
const emeraldLight = plastic(0x10a968, 0.18);
const orange = plastic(0xf27618, 0.18);
const orangeDark = plastic(0xc9470d, 0.22);
const yellow = plastic(0xffcc22, 0.2);
const black = plastic(0x111815, 0.2);
const ivory = plastic(0xf5ead3, 0.28);
const eyeWhite = plastic(0xf9fff8, 0.12);
const pupil = plastic(0x111412, 0.12);
const socket = plastic(0x19382d, 0.25);
const wingMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffc51b,
  roughness: 0.16,
  metalness: 0,
  transparent: true,
  opacity: 0.72,
  transmission: 0.16,
  thickness: 0.14,
  side: THREE.DoubleSide,
  depthWrite: false
});
const wingFrameMaterial = plastic(0xe78a13, 0.2);

const dragon = new THREE.Group();
dragon.rotation.y = -0.12;
scene.add(dragon);

const pitch = 0.56;
const brickHeight = 0.36;
const plateHeight = 0.15;
const studRadius = 0.17;
const studHeight = 0.105;

const boxCache = new Map();
const cylinderCache = new Map();

function boxGeometry(w, h, d) {
  const key = `${w.toFixed(3)}:${h.toFixed(3)}:${d.toFixed(3)}`;
  if (!boxCache.has(key)) boxCache.set(key, new THREE.BoxGeometry(w, h, d));
  return boxCache.get(key);
}

function cylinderGeometry(radius, height, segments = 24) {
  const key = `${radius.toFixed(3)}:${height.toFixed(3)}:${segments}`;
  if (!cylinderCache.has(key)) {
    cylinderCache.set(key, new THREE.CylinderGeometry(radius, radius, height, segments));
  }
  return cylinderCache.get(key);
}

function meshOf(geometry, material, cast = true, receive = true) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  return mesh;
}

function addStud(parent, x, y, z, material, scale = 1) {
  const stud = meshOf(
    cylinderGeometry(studRadius * scale, studHeight * scale, 28),
    material
  );
  stud.position.set(x, y, z);
  parent.add(stud);
  return stud;
}

function addTube(parent, x, y, z, material, scale = 1) {
  const tube = meshOf(
    new THREE.TorusGeometry(0.145 * scale, 0.045 * scale, 8, 24),
    material
  );
  tube.position.set(x, y, z);
  tube.rotation.x = Math.PI / 2;
  parent.add(tube);
  return tube;
}

function addBrick(parent, options) {
  const {
    x = 0, y = 0, z = 0,
    nx = 2, nz = 2,
    height = brickHeight,
    material = emerald,
    studs = true,
    tubes = false,
    rotationY = 0
  } = options;

  const group = new THREE.Group();
  group.position.set(x, y, z);
  group.rotation.y = rotationY;
  parent.add(group);

  const width = nx * pitch - 0.035;
  const depth = nz * pitch - 0.035;
  const body = meshOf(boxGeometry(width, height, depth), material);
  group.add(body);

  if (studs) {
    for (let ix = 0; ix < nx; ix++) {
      for (let iz = 0; iz < nz; iz++) {
        addStud(
          group,
          (ix - (nx - 1) / 2) * pitch,
          height / 2 + studHeight / 2,
          (iz - (nz - 1) / 2) * pitch,
          material
        );
      }
    }
  }

  if (tubes) {
    const tx = Math.max(1, nx - 1);
    const tz = Math.max(1, nz - 1);
    for (let ix = 0; ix < tx; ix++) {
      for (let iz = 0; iz < tz; iz++) {
        addTube(
          group,
          (ix - (tx - 1) / 2) * pitch,
          -height / 2 - 0.012,
          (iz - (tz - 1) / 2) * pitch,
          emeraldDark,
          1
        );
      }
    }
  }
  return group;
}

function addRodBetween(parent, a, b, radius, material, segments = 20) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const rod = meshOf(new THREE.CylinderGeometry(radius, radius, length, segments), material);
  rod.position.copy(a).add(b).multiplyScalar(0.5);
  rod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  parent.add(rod);
  return rod;
}

function addBall(parent, position, radius, material) {
  const ball = meshOf(new THREE.SphereGeometry(radius, 28, 18), material);
  ball.position.copy(position);
  parent.add(ball);
  return ball;
}

function addCone(parent, position, radius, height, material, rotation = null) {
  const cone = meshOf(new THREE.ConeGeometry(radius, height, 4), material);
  cone.position.copy(position);
  if (rotation) cone.rotation.set(rotation.x, rotation.y, rotation.z);
  parent.add(cone);
  return cone;
}

function createWedgeGeometry(width, heightBack, heightFront, depth) {
  const w = width / 2;
  const d = depth / 2;
  const hb = heightBack / 2;
  const hfTop = -heightBack / 2 + heightFront;
  const yBottom = -heightBack / 2;
  const vertices = new Float32Array([
    -w, yBottom, -d,  w, yBottom, -d,
    -w, hb,      -d,  w, hb,      -d,
    -w, yBottom,  d,  w, yBottom,  d,
    -w, hfTop,    d,  w, hfTop,    d
  ]);
  const indices = [
    0,1,2, 1,3,2,
    4,6,5, 5,6,7,
    0,4,1, 1,4,5,
    2,3,6, 3,7,6,
    0,2,4, 4,2,6,
    1,5,3, 5,7,3
  ];
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

// Four broad clawed legs
const legData = [
  [-1.15, 0.62,  0.75, -0.18],
  [ 1.15, 0.62,  0.75,  0.18],
  [-1.15, 0.62, -0.85,  0.14],
  [ 1.15, 0.62, -0.85, -0.14]
];

for (const [x, y, z, angle] of legData) {
  const leg = new THREE.Group();
  leg.position.set(x, y, z);
  leg.rotation.z = angle;
  dragon.add(leg);

  addBrick(leg, { y: 0.25, nx: 1, nz: 2, height: 0.72, material: emeraldDark });
  addBrick(leg, { y: -0.18, z: 0.18, nx: 1, nz: 2, height: plateHeight, material: emeraldLight });

  const clawZ = 0.58;
  addCone(leg, new THREE.Vector3(-0.14, -0.27, clawZ), 0.10, 0.38, ivory,
    new THREE.Euler(Math.PI / 2, 0, 0));
  addCone(leg, new THREE.Vector3(0.14, -0.27, clawZ), 0.10, 0.38, ivory,
    new THREE.Euler(Math.PI / 2, 0, 0));
}

// Layered torso
addBrick(dragon, { y: 1.18, z: -0.1, nx: 5, nz: 5, height: 0.42, material: emeraldDark, tubes: true });
addBrick(dragon, { y: 1.58, z: 0.02, nx: 5, nz: 4, height: 0.42, material: emerald });
addBrick(dragon, { y: 1.97, z: 0.08, nx: 4, nz: 4, height: 0.38, material: emeraldLight });
addBrick(dragon, { y: 2.31, z: 0.02, nx: 3, nz: 3, height: 0.29, material: emerald });

// Belly plates and visible underside tubes
addBrick(dragon, { y: 0.93, z: 0.05, nx: 3, nz: 4, height: plateHeight, material: yellow, studs: false, tubes: true });
for (let z = -0.65; z <= 0.75; z += 0.47) {
  addTube(dragon, -0.28, 0.83, z, orangeDark, 1.08);
  addTube(dragon,  0.28, 0.83, z, orangeDark, 1.08);
}

// Orange stepped dorsal bricks
addBrick(dragon, { y: 2.61, z: -0.62, nx: 1, nz: 1, height: plateHeight, material: orange });
addCone(dragon, new THREE.Vector3(0, 2.92, -0.62), 0.23, 0.58, orange, new THREE.Euler(0, Math.PI / 4, 0));
addBrick(dragon, { y: 2.64, z: 0.03, nx: 1, nz: 1, height: plateHeight, material: orange });
addCone(dragon, new THREE.Vector3(0, 3.00, 0.03), 0.25, 0.67, orange, new THREE.Euler(0, Math.PI / 4, 0));
addBrick(dragon, { y: 2.55, z: 0.68, nx: 1, nz: 1, height: plateHeight, material: orange });
addCone(dragon, new THREE.Vector3(0, 2.86, 0.68), 0.21, 0.55, orange, new THREE.Euler(0, Math.PI / 4, 0));

// Wings with translucent plates and brick-built leading edges
function createWing(side) {
  const wing = new THREE.Group();
  wing.position.set(side * 1.32, 2.22, 0.25);
  wing.rotation.z = side * -0.11;
  dragon.add(wing);

  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.lineTo(side * 1.35, -0.55);
  shape.lineTo(side * 3.95, -1.75);
  shape.lineTo(side * 3.28, -0.15);
  shape.lineTo(side * 4.55, 1.05);
  shape.lineTo(side * 2.28, 0.92);
  shape.lineTo(side * 1.18, 1.58);
  shape.lineTo(0, 0);
  shape.closePath();

  const membraneGeometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.07,
    bevelEnabled: false,
    curveSegments: 1
  });
  membraneGeometry.rotateX(Math.PI / 2);
  const membrane = meshOf(membraneGeometry, wingMaterial, true, false);
  membrane.renderOrder = 1;
  wing.add(membrane);

  const points = [
    new THREE.Vector3(0, 0.06, 0),
    new THREE.Vector3(side * 1.18, 0.06, -1.58),
    new THREE.Vector3(side * 2.28, 0.06, -0.92),
    new THREE.Vector3(side * 4.55, 0.06, -1.05),
    new THREE.Vector3(side * 3.28, 0.06, 0.15),
    new THREE.Vector3(side * 3.95, 0.06, 1.75),
    new THREE.Vector3(side * 1.35, 0.06, 0.55),
    new THREE.Vector3(0, 0.06, 0)
  ];

  for (let i = 0; i < points.length - 1; i++) {
    addRodBetween(wing, points[i], points[i + 1], 0.075, wingFrameMaterial, 16);
  }
  addRodBetween(wing, points[0], points[3], 0.062, orangeDark, 14);
  addRodBetween(wing, points[0], points[5], 0.062, orangeDark, 14);

  const hinge = meshOf(cylinderGeometry(0.19, 0.72, 24), orangeDark);
  hinge.position.set(-side * 0.10, 0.02, 0);
  hinge.rotation.z = Math.PI / 2;
  wing.add(hinge);

  const clipA = meshOf(new THREE.TorusGeometry(0.27, 0.075, 10, 24, Math.PI * 1.55), socket);
  clipA.position.set(side * 0.13, 0.02, -0.22);
  clipA.rotation.x = Math.PI / 2;
  clipA.rotation.z = side > 0 ? 0.2 : Math.PI - 0.2;
  wing.add(clipA);

  for (let i = 1; i <= 4; i++) {
    const t = i / 5;
    addStud(
      wing,
      side * (0.16 + t * 3.3),
      0.17,
      0.04 + Math.sin(t * Math.PI) * 0.25,
      yellow,
      0.75
    );
  }
}
createWing(-1);
createWing(1);

// Tapered brick-plate tail
const tail = new THREE.Group();
tail.position.set(0, 1.55, -1.45);
dragon.add(tail);

const tailSegments = [
  { z: -0.35, y: 0.04, nx: 3, nz: 2, a: 0.00 },
  { z: -1.15, y: 0.00, nx: 3, nz: 2, a: 0.03 },
  { z: -1.92, y: -0.08, nx: 2, nz: 2, a: 0.08 },
  { z: -2.58, y: -0.20, nx: 2, nz: 2, a: 0.13 },
  { z: -3.14, y: -0.32, nx: 1, nz: 2, a: 0.19 },
  { z: -3.60, y: -0.40, nx: 1, nz: 1, a: 0.25 }
];

for (let i = 0; i < tailSegments.length; i++) {
  const s = tailSegments[i];
  addBrick(tail, {
    x: Math.sin(i * 0.58) * 0.13,
    y: s.y,
    z: s.z,
    nx: s.nx,
    nz: s.nz,
    height: i < 2 ? brickHeight : plateHeight,
    material: i % 2 ? emerald : emeraldLight,
    tubes: true,
    rotationY: s.a * Math.sin(i * 0.8)
  });
  if (i < 5) {
    addCone(
      tail,
      new THREE.Vector3(Math.sin(i * 0.58) * 0.13, s.y + 0.36, s.z),
      0.14 + (5 - i) * 0.012,
      0.42,
      i % 2 ? orangeDark : orange,
      new THREE.Euler(0, Math.PI / 4, 0)
    );
  }
}
const tailTip = meshOf(new THREE.ConeGeometry(0.24, 0.95, 4), emeraldDark);
tailTip.position.set(-0.04, -0.42, -4.15);
tailTip.rotation.x = -Math.PI / 2;
tailTip.rotation.z = Math.PI / 4;
tail.add(tailTip);

// Arched neck with exposed ball joints
const neckPoints = [
  new THREE.Vector3(0, 2.12, 1.35),
  new THREE.Vector3(0, 2.58, 1.78),
  new THREE.Vector3(0, 3.02, 2.05),
  new THREE.Vector3(0, 3.38, 2.38),
  new THREE.Vector3(0, 3.52, 2.86)
];

for (let i = 0; i < neckPoints.length; i++) {
  const p = neckPoints[i];
  addBall(dragon, p, i === 0 ? 0.43 : 0.37, i % 2 ? socket : emeraldDark);
  if (i < neckPoints.length - 1) {
    addRodBetween(dragon, p, neckPoints[i + 1], 0.32, emerald, 24);
  }
  if (i > 0 && i < 4) {
    addBrick(dragon, {
      x: p.x,
      y: p.y + 0.26,
      z: p.z - 0.08,
      nx: 1,
      nz: 1,
      height: plateHeight,
      material: orange,
      rotationY: Math.PI / 4
    });
  }
}

// Head brick and wedge snout
const head = new THREE.Group();
head.position.set(0, 3.55, 3.12);
dragon.add(head);

addBrick(head, { y: 0.02, z: 0.02, nx: 3, nz: 2, height: 0.65, material: emerald, studs: true });

const snout = meshOf(createWedgeGeometry(1.45, 0.58, 0.31, 1.22), emeraldLight);
snout.position.set(0, -0.12, 1.05);
head.add(snout);

addStud(head, -0.34, 0.075, 1.48, emeraldDark, 0.72);
addStud(head,  0.34, 0.075, 1.48, emeraldDark, 0.72);

const lowerJaw = meshOf(boxGeometry(1.35, 0.16, 1.02), emeraldDark);
lowerJaw.position.set(0, -0.48, 1.04);
lowerJaw.rotation.x = -0.07;
head.add(lowerJaw);

for (const x of [-0.42, 0, 0.42]) {
  const tooth = meshOf(new THREE.ConeGeometry(0.075, 0.27, 4), ivory);
  tooth.position.set(x, -0.57, 1.32);
  tooth.rotation.z = Math.PI;
  tooth.rotation.y = Math.PI / 4;
  head.add(tooth);
}

// Eyes on small side-facing tiles
for (const side of [-1, 1]) {
  const eyeBase = meshOf(boxGeometry(0.15, 0.39, 0.42), orange);
  eyeBase.position.set(side * 0.83, 0.17, 0.24);
  head.add(eyeBase);

  const eyeball = meshOf(new THREE.SphereGeometry(0.17, 22, 14), eyeWhite);
  eyeball.position.set(side * 0.91, 0.22, 0.38);
  head.add(eyeball);

  const iris = meshOf(new THREE.SphereGeometry(0.078, 18, 12), yellow);
  iris.position.set(side * 0.965, 0.225, 0.48);
  head.add(iris);

  const dot = meshOf(new THREE.SphereGeometry(0.038, 16, 10), pupil);
  dot.position.set(side * 0.995, 0.23, 0.536);
  head.add(dot);
}

// Brows, horns, cheek studs
for (const side of [-1, 1]) {
  const brow = meshOf(boxGeometry(0.58, 0.13, 0.18), emeraldDark);
  brow.position.set(side * 0.48, 0.48, 0.33);
  brow.rotation.z = side * -0.16;
  head.add(brow);

  const horn = meshOf(new THREE.ConeGeometry(0.16, 0.72, 6), ivory);
  horn.position.set(side * 0.53, 0.67, -0.25);
  horn.rotation.x = -0.55;
  horn.rotation.z = side * -0.22;
  head.add(horn);

  const cheek = addStud(head, side * 0.78, -0.12, 0.63, orange, 0.83);
  cheek.rotation.z = Math.PI / 2;
}

// Small ear fins
for (const side of [-1, 1]) {
  const earShape = new THREE.Shape();
  earShape.moveTo(0, 0);
  earShape.lineTo(side * 0.65, 0.30);
  earShape.lineTo(side * 0.25, -0.35);
  earShape.closePath();
  const earGeo = new THREE.ShapeGeometry(earShape);
  const ear = meshOf(earGeo, orange);
  ear.position.set(side * 0.63, 0.28, -0.22);
  ear.rotation.y = side * 0.55;
  head.add(ear);
}

// Ground and soft display shadow
const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0xc5d8d0,
  roughness: 0.84,
  metalness: 0
});
const ground = meshOf(new THREE.CircleGeometry(12, 96), groundMaterial, false, true);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.05;
scene.add(ground);

const pedestal = meshOf(new THREE.CylinderGeometry(4.5, 4.8, 0.18, 64), plastic(0xb7ccc3, 0.55), false, true);
pedestal.position.y = 0.12;
scene.add(pedestal);

const ring = meshOf(new THREE.TorusGeometry(4.58, 0.055, 10, 96), plastic(0x8ca99e, 0.35), false, true);
ring.rotation.x = Math.PI / 2;
ring.position.y = 0.22;
scene.add(ring);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  dragon.position.y = 0.15 + Math.sin(elapsed * 1.25) * 0.018;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
