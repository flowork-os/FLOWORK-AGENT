<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus-Stop Kiosk — Procedural three.js</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #141518; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ---------- Scene / Camera ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141518);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.6, 2.5, 6.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 3;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.495;

// Environment reflections (procedural, no external assets)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

// ---------- Lighting ----------
const hemi = new THREE.HemisphereLight(0x8fa3b8, 0x1c1d20, 0.35);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e2, 2.6);
key.position.set(6, 8, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5.5;
key.shadow.camera.right = 5.5;
key.shadow.camera.top = 5.5;
key.shadow.camera.bottom = -5.5;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 30;
key.shadow.bias = -0.0002;
key.shadow.normalBias = 0.02;
scene.add(key);
scene.add(key.target);

const fill = new THREE.DirectionalLight(0xbdd0e8, 0.7);
fill.position.set(-7, 3.5, 3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xdde8ff, 1.1);
rim.position.set(-3, 5.5, -7);
scene.add(rim);

// warm glow under the canopy (fakes the LED strip)
const canopyGlow = new THREE.PointLight(0xffe9c4, 8, 7, 2);
canopyGlow.position.set(0, 2.25, 0.1);
scene.add(canopyGlow);

// ---------- Ground: shadow-catcher only ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.35 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Materials ----------
const matFrame = new THREE.MeshStandardMaterial({ color: 0x2e3238, metalness: 0.85, roughness: 0.38, envMapIntensity: 0.6 });
const matRoof  = new THREE.MeshStandardMaterial({ color: 0x9aa0a4, metalness: 0.9,  roughness: 0.32, envMapIntensity: 0.6 });
const matSteel = new THREE.MeshStandardMaterial({ color: 0xb4b8bc, metalness: 1.0,  roughness: 0.25, envMapIntensity: 0.7 });
const matWood  = new THREE.MeshStandardMaterial({ color: 0x9c6b3f, metalness: 0.0,  roughness: 0.62, envMapIntensity: 0.4 });
const matGlass = new THREE.MeshPhysicalMaterial({
  color: 0xd6ecea, metalness: 0, roughness: 0.06,
  transmission: 1.0, ior: 1.52, thickness: 0.03,
  envMapIntensity: 1.1, transparent: true
});
const matStrip = new THREE.MeshStandardMaterial({ color: 0xfff4dd, emissive: 0xffe9c4, emissiveIntensity: 2.2, roughness: 0.4 });

// ---------- Procedural poster texture ----------
function makePosterTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 768;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 768);
  g.addColorStop(0.00, '#0e1f3d');
  g.addColorStop(0.45, '#27528e');
  g.addColorStop(0.72, '#e28f52');
  g.addColorStop(1.00, '#f4c07a');
  x.fillStyle = g; x.fillRect(0, 0, 512, 768);
  // sun
  x.fillStyle = '#ffd9a0';
  x.beginPath(); x.arc(256, 430, 88, 0, Math.PI * 2); x.fill();
  // far ridge
  x.fillStyle = '#1b3a63';
  x.beginPath();
  x.moveTo(0, 560); x.lineTo(120, 445); x.lineTo(230, 560); x.lineTo(330, 472);
  x.lineTo(430, 570); x.lineTo(512, 505); x.lineTo(512, 768); x.lineTo(0, 768);
  x.closePath(); x.fill();
  // near ridge
  x.fillStyle = '#122a4a';
  x.beginPath();
  x.moveTo(0, 655); x.lineTo(150, 585); x.lineTo(300, 665); x.lineTo(420, 605);
  x.lineTo(512, 660); x.lineTo(512, 768); x.lineTo(0, 768);
  x.closePath(); x.fill();
  // headline
  x.textAlign = 'center';
  x.fillStyle = '#ffffff';
  x.font = '700 52px Helvetica, Arial, sans-serif';
  x.fillText('EXPLORE MORE', 256, 118);
  x.fillStyle = 'rgba(255,255,255,0.85)';
  x.font = '400 25px Helvetica, Arial, sans-serif';
  x.fillText('WEEKEND PASSES  ·  ROUTE 42', 256, 162);
  // footer band
  x.fillStyle = 'rgba(10,18,32,0.88)';
  x.fillRect(0, 700, 512, 68);
  x.fillStyle = '#ffffff';
  x.font = '600 28px Helvetica, Arial, sans-serif';
  x.fillText('CITY TRANSIT', 256, 743);
  // border
  x.strokeStyle = 'rgba(255,255,255,0.6)';
  x.lineWidth = 6;
  x.strokeRect(12, 12, 488, 744);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
const posterTex = makePosterTexture();
const matPoster = new THREE.MeshStandardMaterial({
  map: posterTex, emissive: 0xffffff, emissiveMap: posterTex,
  emissiveIntensity: 0.9, roughness: 0.5, metalness: 0
});

// ---------- Helpers ----------
const kiosk = new THREE.Group();
scene.add(kiosk);

function box(w, h, d, mat, x, y, z, cast = true, receive = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = cast;
  m.receiveShadow = receive;
  kiosk.add(m);
  return m;
}

function tube(a, b, r, mat) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 14), mat);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  m.castShadow = true;
  m.receiveShadow = true;
  kiosk.add(m);
  return m;
}

// =====================================================================
//  Dimensions (metres, real-world framing scale)
//  Shelter ~4.5 m wide, roof ~1.8 m deep at ~2.6 m, seat at 0.46 m
// =====================================================================

// ---------- Slim post frame (4 posts along the back) ----------
const POST_X = [-2.02, -0.675, 0.675, 2.02];
for (const px of POST_X) {
  box(0.09, 2.32, 0.09, matFrame, px, 1.16, -0.62);          // post
  box(0.16, 0.02, 0.16, matFrame, px, 0.01, -0.62);          // base plate
}
// header rail tying the post tops together
box(4.14, 0.09, 0.09, matFrame, 0, 2.34, -0.62);

// ---------- Cantilevered roof canopy ----------
// cantilever arms from each post, plus diagonal steel struts
for (const px of POST_X) {
  box(0.07, 0.10, 1.60, matFrame, px, 2.42, 0.14);           // arm reaching forward
  tube(new THREE.Vector3(px, 1.92, -0.60), new THREE.Vector3(px, 2.39, 0.60), 0.02, matSteel);
}
// roof slab (visible thickness) + darker fascia band around the edge
box(4.38, 0.10, 1.68, matRoof, 0, 2.515, 0.14);              // slab
box(4.50, 0.16, 0.05, matFrame, 0, 2.52, 1.015);             // front fascia
box(4.50, 0.16, 0.05, matFrame, 0, 2.52, -0.735);            // back fascia
box(0.05, 0.16, 1.71, matFrame, -2.225, 2.52, 0.14);         // left fascia
box(0.05, 0.16, 1.71, matFrame,  2.225, 2.52, 0.14);         // right fascia
// LED strip under the canopy
box(3.90, 0.02, 0.10, matStrip, 0, 2.462, 0.30, false, false);

// ---------- Three glass panels: back + two sides ----------
// back glass (one pane running behind the posts)
box(3.94, 2.14, 0.012, matGlass, 0, 1.19, -0.60, false, false);
box(4.14, 0.12, 0.055, matFrame, 0, 0.08,  -0.60);           // bottom rail
box(4.14, 0.055, 0.055, matFrame, 0, 2.265, -0.60);          // top channel

// side glass panels + slim front edge members
for (const sx of [-2.02, 2.02]) {
  box(0.012, 2.14, 1.22, matGlass, sx, 1.19, 0.01, false, false);
  box(0.055, 0.12, 1.30, matFrame, sx, 0.08,  0.01);         // bottom rail
  box(0.055, 0.055, 1.30, matFrame, sx, 2.265, 0.01);        // top channel
  box(0.07, 2.32, 0.07, matFrame, sx, 1.16, 0.62);           // front edge post
  box(0.14, 0.02, 0.14, matFrame, sx, 0.01, 0.62);           // its base plate
}

// ---------- Bench mounted along the back ----------
// mounting rails across the posts
box(2.70, 0.09, 0.05, matFrame, 0, 0.36, -0.565);
box(2.70, 0.07, 0.05, matFrame, 0, 0.18, -0.565);
// cantilever seat brackets
for (const bx of [-1.15, 0, 1.15]) {
  box(0.05, 0.05, 0.46, matSteel, bx, 0.425, -0.345);        // horizontal arm
  tube(new THREE.Vector3(bx, 0.19, -0.55), new THREE.Vector3(bx, 0.405, -0.15), 0.015, matSteel);
  box(0.05, 0.46, 0.05, matSteel, bx, 0.62, -0.565);         // backrest upright
}
// seat slats (seat height 0.46 m)
const SLAT_Z = [-0.519, -0.431, -0.343, -0.255, -0.167];
for (const sz of SLAT_Z) {
  box(2.70, 0.045, 0.072, matWood, 0, 0.4375, sz);
}
// backrest slats
box(2.70, 0.075, 0.04, matWood, 0, 0.70, -0.535);
box(2.70, 0.075, 0.04, matWood, 0, 0.83, -0.535);

// ---------- Mounted advertising sign panel (lightbox at right end) ----------
box(0.13, 1.84, 1.26, matFrame, 2.18, 1.30, -0.01);          // lightbox body
// feet + base plates
for (const fz of [-0.32, 0.30]) {
  box(0.10, 0.38, 0.09, matFrame, 2.18, 0.19, fz);
  box(0.16, 0.02, 0.15, matFrame, 2.18, 0.01, fz);
}
// standoff mounts tying the lightbox to the shelter end frame
tube(new THREE.Vector3(2.05, 0.90, -0.60), new THREE.Vector3(2.13, 0.90, -0.60), 0.02, matSteel);
tube(new THREE.Vector3(2.05, 1.90, -0.60), new THREE.Vector3(2.13, 1.90, -0.60), 0.02, matSteel);
// illuminated poster faces (outer + inner)
const posterGeo = new THREE.PlaneGeometry(1.10, 1.66);
const posterOut = new THREE.Mesh(posterGeo, matPoster);
posterOut.rotation.y = Math.PI / 2;
posterOut.position.set(2.2475, 1.30, -0.01);
kiosk.add(posterOut);
const posterIn = new THREE.Mesh(posterGeo, matPoster);
posterIn.rotation.y = -Math.PI / 2;
posterIn.position.set(2.1125, 1.30, -0.01);
kiosk.add(posterIn);

// centre the whole kiosk on the origin
kiosk.position.z = -0.14;

// ---------- Resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Animate ----------
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
