<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coral Reef Garden</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#031c38}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x041d3b);
scene.fog = new THREE.FogExp2(0x06355b, 0.035);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 100);
camera.position.set(15, 9, 19);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, -3);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;
controls.minDistance = 10;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.49;

let seed = 481516;
function rnd(){
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function rand(a,b){ return a + (b-a)*rnd(); }
function choose(arr){ return arr[Math.floor(rnd()*arr.length)]; }

const mats = {};
function mat(color, rough=0.72, metal=0, extra={}){
  return new THREE.MeshStandardMaterial({
    color, roughness:rough, metalness:metal,
    ...extra
  });
}
mats.sand = mat(0xc7a76a, 0.96);
mats.sandDark = mat(0x98744c, 1);
mats.rock = mat(0x355d68, 0.95);
mats.rockDark = mat(0x21434f, 1);
mats.pink = mat(0xe8589b, 0.82);
mats.coral = mat(0xff7958, 0.8);
mats.orange = mat(0xff9a48, 0.78);
mats.violet = mat(0x895cc7, 0.8);
mats.purple = mat(0x653d9e, 0.84);
mats.anemone = mat(0xb94aa8, 0.72);
mats.anemoneTip = mat(0xffb56b, 0.62);
mats.fishOrange = mat(0xf47a28, 0.5);
mats.fishWhite = mat(0xffe8c4, 0.55);
mats.fishBlack = mat(0x07162b, 0.42);
mats.turtle = mat(0x4f956b, 0.82);
mats.turtleDark = mat(0x235345, 0.9);
mats.shell = mat(0x6b8e67, 0.77);
mats.shellMark = mat(0x30554d, 0.82);
mats.kelp = mat(0x176f5f, 0.76);
mats.fan = mat(0x9d5c9c, 0.8);
mats.anchor = mat(0x374d58, 0.45, 0.7);
mats.eyeglow = mat(0xfff6c4, 0.25, 0, {emissive:0xffbb55, emissiveIntensity:0.8});
mats.water = new THREE.MeshBasicMaterial({color:0x146a9d, transparent:true, opacity:0.075, side:THREE.DoubleSide});

function canvasTexture(draw, w=512, h=512){
  const c=document.createElement("canvas");
  c.width=w;c.height=h;
  const ctx=c.getContext("2d");
  draw(ctx,w,h);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}

const sandTexture = canvasTexture((ctx,w,h)=>{
  ctx.fillStyle="#b99560";ctx.fillRect(0,0,w,h);
  for(let i=0;i<1600;i++){
    const x=rnd()*w,y=rnd()*h,r=rand(.4,2.4);
    ctx.fillStyle=`rgba(${rand(90,180)|0},${rand(65,135)|0},${rand(35,85)|0},${rand(.08,.3)})`;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
});
mats.sand.map=sandTexture;

const backdropTexture = canvasTexture((ctx,w,h)=>{
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"#0c76a6");g.addColorStop(.5,"#07517d");g.addColorStop(1,"#031e42");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  for(let i=0;i<18;i++){
    const x=rand(0,w), width=rand(20,70);
    const ray=ctx.createLinearGradient(x,0,x+rand(-90,90),h);
    ray.addColorStop(0,"rgba(120,235,255,.18)");
    ray.addColorStop(1,"rgba(40,155,220,0)");
    ctx.fillStyle=ray;
    ctx.beginPath();ctx.moveTo(x-width/2,0);ctx.lineTo(x+width/2,0);
    ctx.lineTo(x+rand(-140,140),h);ctx.lineTo(x+rand(-140,140)-width,h);ctx.closePath();ctx.fill();
  }
});
const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(58,32),
  new THREE.MeshBasicMaterial({map:backdropTexture, transparent:true, opacity:.92})
);
backdrop.position.set(0,11,-16);
scene.add(backdrop);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(58,38), mats.sand);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.18;
floor.receiveShadow=true;
scene.add(floor);

const waterVolume = new THREE.Mesh(new THREE.BoxGeometry(54,28,34), mats.water);
waterVolume.position.set(0,13,-1);
scene.add(waterVolume);

const hemi = new THREE.HemisphereLight(0x7ce9ff,0x08243b,2.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0x9cecff,3.5);
sun.position.set(-8,20,8);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-18;sun.shadow.camera.right=18;
sun.shadow.camera.top=22;sun.shadow.camera.bottom=-8;
sun.shadow.bias=-0.0002;
scene.add(sun);
const cyanFill = new THREE.PointLight(0x19a9d4,22,28,2);
cyanFill.position.set(-8,6,5);
scene.add(cyanFill);
const violetFill = new THREE.PointLight(0x743fc7,18,22,2);
violetFill.position.set(9,5,-7);
scene.add(violetFill);

function shadowMesh(geometry, material){
  const m=new THREE.Mesh(geometry,material);
  m.castShadow=true;m.receiveShadow=true;
  return m;
}
function addRock(x,z,s){
  const g=new THREE.Group();
  const base=shadowMesh(new THREE.DodecahedronGeometry(s,1),mats.rock);
  base.scale.set(1.35,.62,1);
  base.position.y=s*.42;
  g.add(base);
  for(let i=0;i<4;i++){
    const peb=shadowMesh(new THREE.DodecahedronGeometry(s*rand(.18,.38),1),mats.rockDark);
    peb.position.set(rand(-s,s),s*.65+rand(0,s*.3),rand(-s*.7,s*.7));
    g.add(peb);
  }
  g.position.set(x,0,z);
  scene.add(g);
  return g;
}
addRock(-9,-5,2.5);addRock(-2,-7,2.15);addRock(7,-7,2.6);
addRock(11,0,1.45);addRock(-12,2,1.8);

function tube(points, radius, material, segments=8){
  const curve=new THREE.CatmullRomCurve3(points);
  return shadowMesh(new THREE.TubeGeometry(curve,Math.max(8,points.length*5),radius,segments,false),material);
}
function coralBranch(x,y,z,scale,color,branches=5){
  const g=new THREE.Group();
  for(let i=0;i<branches;i++){
    const angle=i/branches*Math.PI*2+rand(-.3,.3);
    const h=rand(1.4,2.5)*scale;
    const p=[
      new THREE.Vector3(0,0,0),
      new THREE.Vector3(Math.cos(angle)*.22*scale,.48*scale,Math.sin(angle)*.22*scale),
      new THREE.Vector3(Math.cos(angle)*.48*scale,h*.65,Math.sin(angle)*.48*scale),
      new THREE.Vector3(Math.cos(angle)*rand(.55,.9)*scale,h,Math.sin(angle)*rand(.55,.9)*scale)
    ];
    g.add(tube(p,.09*scale,color,7));
    if(i%2===0){
      const side=angle+rand(.55,1.05);
      const top=p[3].clone();
      const q=[top,top.clone().add(new THREE.Vector3(Math.cos(side)*.2*scale,.25*scale,Math.sin(side)*.2*scale)),top.clone().add(new THREE.Vector3(Math.cos(side)*.5*scale,.65*scale,Math.sin(side)*.5*scale))];
      g.add(tube(q,.055*scale,color,7));
    }
  }
  g.position.set(x,y,z);
  g.rotation.y=rand(0,Math.PI*2);
  scene.add(g);
  return g;
}
coralBranch(-8,1.1,-5,1.35,mats.pink,7);
coralBranch(-2.8,1.25,-7,1.1,mats.orange,8);
coralBranch(7.7,1.3,-6.7,1.45,mats.violet,7);
coralBranch(10.2,1,-1.3,.85,mats.coral,6);

function brainCoral(x,y,z,s,color){
  const g=new THREE.Group();
  const dome=shadowMesh(new THREE.SphereGeometry(1,28,18,0,Math.PI*2,0,Math.PI/2),color);
  dome.scale.set(1.55*s,.85*s,1.15*s);
  g.add(dome);
  for(let j=0;j<11;j++){
    const a=j/11*Math.PI*2;
    const r=rand(.22,.78)*s;
    const path=[];
    for(let k=0;k<6;k++){
      const u=k/5;
      path.push(new THREE.Vector3(
        Math.cos(a+Math.sin(u*8+j)*.16)*r*(1-u*.24),
        .18*s+u*.58*s,
        Math.sin(a+Math.sin(u*8+j)*.16)*r*(1-u*.24)
      ));
    }
    g.add(tube(path,.035*s,mats.shellMark,6));
  }
  g.position.set(x,y,z);
  scene.add(g);
}
brainCoral(-5.8,.5,-1.8,1.7,mats.coral);
brainCoral(3.2,.45,-5.8,1.6,mats.pink);
brainCoral(8.8,.55,-1.8,1.2,mats.orange);

function anemone(x,y,z,s){
  const g=new THREE.Group();
  const base=shadowMesh(new THREE.SphereGeometry(.65*s,18,12),mats.anemone);
  base.scale.y=.55;base.position.y=.25*s;g.add(base);
  for(let i=0;i<18;i++){
    const a=i/18*Math.PI*2;
    const h=rand(1.1,1.8)*s;
    const p=[
      new THREE.Vector3(Math.cos(a)*.34*s,.35*s,Math.sin(a)*.34*s),
      new THREE.Vector3(Math.cos(a)*.5*s,h*.45,Math.sin(a)*.5*s),
      new THREE.Vector3(Math.cos(a+rand(-.4,.4))*.45*s,h,Math.sin(a+rand(-.4,.4))*.45*s)
    ];
    const t=tube(p,.055*s,mats.anemone,7);
    g.add(t);
    const tip=shadowMesh(new THREE.SphereGeometry(.095*s,8,6),mats.anemoneTip);
    tip.position.copy(p[2]);g.add(tip);
  }
  g.position.set(x,y,z);
  scene.add(g);
  return g;
}
const anemones=[anemone(-1.1,.05,-2.8,1.2),anemone(5.5,.05,-3.5,.9),anemone(11,.05,-5,.7)];

function seaFan(x,y,z,s,color){
  const g=new THREE.Group();
  for(let i=0;i<13;i++){
    const u=i/12;
    const xx=(u-.5)*2.5*s;
    const p=[new THREE.Vector3(0,0,0),new THREE.Vector3(xx*.45,.8*s,0),new THREE.Vector3(xx,1.7*s+Math.sin(u*4)*.2*s,0)];
    g.add(tube(p,.025*s,color,5));
  }
  for(let j=0;j<5;j++){
    const p=[new THREE.Vector3(0,0,0),new THREE.Vector3(rand(-.5,.5)*s,1*s,0),new THREE.Vector3(rand(-1,1)*s,1.8*s,0)];
    g.add(tube(p,.04*s,color,5));
  }
  g.position.set(x,y,z);g.rotation.y=rand(0,Math.PI*2);
  scene.add(g);return g;
}
const fans=[seaFan(-11,.6,-3.7,1.8,mats.fan),seaFan(1.8,.7,-8,1.4,mats.pink),seaFan(12,.4,-7,1.1,mats.violet)];

function kelp(x,z,s){
  const g=new THREE.Group();
  for(let i=0;i<6;i++){
    const a=rand(0,Math.PI*2), h=rand(4,7)*s;
    const p=[new THREE.Vector3(Math.cos(a)*.15,0,Math.sin(a)*.15),
      new THREE.Vector3(Math.cos(a+.35)*.45,h*.32,Math.sin(a+.35)*.45),
      new THREE.Vector3(Math.cos(a-.25)*.7,h*.67,Math.sin(a-.25)*.7),
      new THREE.Vector3(Math.cos(a+.18)*.65,h,Math.sin(a+.18)*.65)];
    const leaf=tube(p,.11*s,mats.kelp,7);
    g.add(leaf);
    for(let j=1;j<4;j++){
      const leaf2=shadowMesh(new THREE.SphereGeometry(.16*s,9,6),mats.kelp);
      leaf2.scale.set(.45,1.8,.12);
      leaf2.position.copy(p[j]);leaf2.rotation.z=rand(-.8,.8);g.add(leaf2);
    }
  }
  g.position.set(x,0,z);scene.add(g);return g;
}
const kelps=[kelp(-13,-8,1),kelp(-10,3,.8),kelp(13,3,.85),kelp(5,1,.7)];

function fish(x,y,z,s,color,heading=0){
  const g=new THREE.Group();
  const body=shadowMesh(new THREE.SphereGeometry(1,18,12),color);
  body.scale.set(1.18*s,.48*s,.42*s);g.add(body);
  const tail=shadowMesh(new THREE.ConeGeometry(.48*s,.9*s,4),color);
  tail.rotation.z=Math.PI/2;tail.position.x=-1.05*s;g.add(tail);
  const fin=shadowMesh(new THREE.ConeGeometry(.23*s,.55*s,4),color);
  fin.rotation.z=Math.PI/2;fin.position.set(.05*s,.36*s,0);g.add(fin);
  const eye=shadowMesh(new THREE.SphereGeometry(.075*s,8,6),mats.eyeglow);
  eye.position.set(.73*s,.13*s,.36*s);g.add(eye);
  const pupil=shadowMesh(new THREE.SphereGeometry(.035*s,6,4),mats.fishBlack);
  pupil.position.set(.77*s,.13*s,.39*s);g.add(pupil);
  g.position.set(x,y,z);g.rotation.y=heading;scene.add(g);return g;
}
function clownfish(x,y,z,s,heading){
  const g=fish(x,y,z,s,mats.fishOrange,heading);
  for(const xx of [-.35,.18]){
    const stripe=shadowMesh(new THREE.TorusGeometry(.26*s,.045*s,6,12,Math.PI),mats.fishWhite);
    stripe.rotation.y=Math.PI/2;stripe.rotation.z=Math.PI/2;stripe.position.x=xx*s;g.add(stripe);
  }
  return g;
}
const clownies=[clownfish(-1.6,2.1,-2.6,.65,.2),clownfish(-.35,2.8,-2.5,.48,-.35),clownfish(5.15,1.6,-3.2,.43,2.8)];

const school=[];
for(let i=0;i<18;i++){
  const row=Math.floor(i/6), col=i%6;
  const f=fish(-8+col*1.15+row*.3,6.5+row*.48+Math.sin(col)*.3,-4+row*.5,.18+row*.025,mats.fishWhite,.05);
  f.children[1].material=mats.violet;
  school.push({g:f,phase:rand(0,Math.PI*2),base:f.position.clone()});
}

function turtle(){
  const g=new THREE.Group();
  const shell=shadowMesh(new THREE.SphereGeometry(1.35,24,16),mats.shell);
  shell.scale.set(1.42,.55,1);g.add(shell);
  const rim=shadowMesh(new THREE.SphereGeometry(1.42,24,16),mats.shellMark);
  rim.scale.set(1.45,.16,1.03);rim.position.y=.12;g.add(rim);
  const head=shadowMesh(new THREE.SphereGeometry(.42,16,10),mats.turtle);
  head.position.set(1.7,.02,0);head.scale.set(1.25,.85,.85);g.add(head);
  const eye=shadowMesh(new THREE.SphereGeometry(.07,8,6),mats.eyeglow);
  eye.position.set(1.96,.17,.3);g.add(eye);
  for(const side of [-1,1]){
    const flipper=shadowMesh(new THREE.SphereGeometry(.65,14,8),mats.turtle);
    flipper.scale.set(1.65,.16,.38);
    flipper.position.set(.45,-.05,side*1.28);
    flipper.rotation.y=side*.2;g.add(flipper);
    const rear=shadowMesh(new THREE.SphereGeometry(.45,14,8),mats.turtleDark);
    rear.scale.set(1.2,.18,.3);rear.position.set(-.9,-.05,side*.92);g.add(rear);
  }
  for(let i=0;i<5;i++){
    const mark=shadowMesh(new THREE.TorusGeometry(.28,.035,6,12),mats.shellMark);
    mark.rotation.x=Math.PI/2;mark.position.set(rand(-.65,.65),.48,rand(-.5,.5));g.add(mark);
  }
  g.position.set(-7,3,-10);g.rotation.y=-.45;scene.add(g);return g;
}
const turtleObj=turtle();

function starfish(x,z,s,color=0xd96c4b){
  const g=new THREE.Group();
  for(let i=0;i<5;i++){
    const arm=shadowMesh(new THREE.CapsuleGeometry(.16*s,.65*s,5,10),mat(color,.86));
    arm.rotation.z=Math.PI/2;arm.rotation.y=i/5*Math.PI*2;
    arm.position.set(Math.cos(i/5*Math.PI*2)*.38*s, .08, Math.sin(i/5*Math.PI*2)*.38*s);
    g.add(arm);
  }
  const center=shadowMesh(new THREE.SphereGeometry(.33*s,12,8),mat(color,.86));center.position.y=.1;g.add(center);
  g.position.set(x,0,z);scene.add(g);
}
starfish(-9,-1.1,.72);starfish(4,-1.5,.55,0xf18b42);starfish(7,-10,.48,0xc94b55);

function anchor(){
  const g=new THREE.Group();
  const shaft=shadowMesh(new THREE.CylinderGeometry(.16,.21,3.7,12),mats.anchor);
  shaft.rotation.z=Math.PI/2;shaft.position.y=1.2;g.add(shaft);
  const ring=shadowMesh(new THREE.TorusGeometry(.48,.13,10,20),mats.anchor);
  ring.rotation.x=Math.PI/2;ring.position.set(1.95,2.8,0);g.add(ring);
  const cross=shadowMesh(new THREE.CylinderGeometry(.13,.16,2.2,12),mats.anchor);
  cross.rotation.z=Math.PI/2;cross.position.set(-.72,.15,0);g.add(cross);
  for(const side of [-1,1]){
    const arm=shadowMesh(new THREE.CylinderGeometry(.13,.18,1.75,12),mats.anchor);
    arm.rotation.z=side*.58;arm.position.set(-1.7,.35,0);g.add(arm);
    const claw=shadowMesh(new THREE.ConeGeometry(.22,.55,8),mats.anchor);
    claw.rotation.z=side*.9;claw.position.set(-2.3,-.1,0);g.add(claw);
  }
  g.rotation.z=-.25;g.rotation.y=.3;g.position.set(3.8,.05,-.7);scene.add(g);return g;
}
const anchorObj=anchor();

const bubbleMat=new THREE.MeshBasicMaterial({color:0xa6efff,transparent:true,opacity:.48});
const bubbles=[];
function bubbleStream(x,y,z,count){
  const g=new THREE.Group();
  for(let i=0;i<count;i++){
    const b=new THREE.Mesh(new THREE.SphereGeometry(rand(.045,.13),10,8),bubbleMat);
    b.position.set(rand(-.25,.25),rand(0,5),rand(-.25,.25));
    g.add(b);bubbles.push({mesh:b,base:b.position.clone(),phase:rand(0,6.28),root:g});
  }
  g.position.set(x,y,z);scene.add(g);
}
bubbleStream(-4,.2,-5,24);
bubbleStream(6,.2,-4,19);
bubbleStream(10,.2,-8,15);

const causticTexture=canvasTexture((ctx,w,h)=>{
  ctx.clearRect(0,0,w,h);
  for(let i=0;i<70;i++){
    ctx.strokeStyle=`rgba(140,245,255,${rand(.06,.18)})`;
    ctx.lineWidth=rand(1,4);
    ctx.beginPath();ctx.moveTo(rand(0,w),0);
    ctx.bezierCurveTo(rand(0,w),h*.3,rand(0,w),h*.7,rand(0,w),h);
    ctx.stroke();
  }
},512,512);
const causticMat=new THREE.MeshBasicMaterial({map:causticTexture,transparent:true,opacity:.3,depthWrite:false,blending:THREE.AdditiveBlending});
const caustic=new THREE.Mesh(new THREE.PlaneGeometry(25,18),causticMat);
caustic.position.set(0,13,-2);caustic.rotation.x=Math.PI/2;
scene.add(caustic);

const floatingParticles=[];
const particleMat=new THREE.MeshBasicMaterial({color:0x9be8ed,transparent:true,opacity:.55});
for(let i=0;i<115;i++){
  const p=new THREE.Mesh(new THREE.SphereGeometry(rand(.012,.035),5,4),particleMat);
  p.position.set(rand(-17,17),rand(.4,18),rand(-14,8));
  scene.add(p);floatingParticles.push({p,phase:rand(0,6.28),speed:rand(.08,.22)});
}

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();

  anemones.forEach((a,i)=>{
    a.rotation.z=Math.sin(t*.8+i)*.055;
    a.rotation.x=Math.cos(t*.65+i)*.035;
  });
  fans.forEach((f,i)=>{
    f.rotation.z=Math.sin(t*.55+i*1.8)*.12;
    f.rotation.x=Math.cos(t*.42+i)*.06;
  });
  kelps.forEach((k,i)=>{
    k.rotation.z=Math.sin(t*.46+i)*.075;
    k.rotation.x=Math.cos(t*.32+i)*.04;
  });
  school.forEach((o,i)=>{
    o.g.position.x=o.base.x+Math.sin(t*.22+o.phase)*.55;
    o.g.position.y=o.base.y+Math.sin(t*.65+o.phase)*.16;
    o.g.position.z=o.base.z+Math.cos(t*.19+o.phase)*.45;
    o.g.rotation.z=Math.sin(t*.65+o.phase)*.06;
  });
  clownies.forEach((f,i)=>{
    f.position.y+=Math.sin(t*1.4+i)*.0025;
    f.rotation.z=Math.sin(t*1.5+i)*.04;
  });
  turtleObj.position.y=3+Math.sin(t*.48)*.22;
  turtleObj.rotation.z=Math.sin(t*.55)*.045;
  turtleObj.rotation.x=Math.cos(t*.4)*.035;
  bubbles.forEach((o,i)=>{
    const y=(o.base.y+t*(.38+o.phase*.01))%5.8;
    o.mesh.position.y=y;
    o.mesh.position.x=o.base.x+Math.sin(t*1.1+o.phase)*.18;
    o.mesh.position.z=o.base.z+Math.cos(t*.9+o.phase)*.15;
    o.mesh.scale.setScalar(.8+Math.sin(t*2+o.phase)*.18);
  });
  floatingParticles.forEach(o=>{
    o.p.position.y+=o.speed*.006;
    o.p.position.x+=Math.sin(t*.4+o.phase)*.0008;
    if(o.p.position.y>18)o.p.position.y=.4;
  });
  caustic.material.opacity=.22+Math.sin(t*.8)*.07;
  controls.update();
  renderer.render(scene,camera);
}
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
animate();
</script>
</body>
</html>
