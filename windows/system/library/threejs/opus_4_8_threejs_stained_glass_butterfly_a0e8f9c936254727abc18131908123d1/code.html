<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stained Glass Butterfly</title>
<style>
  html, body { margin: 0; height: 100%; background: #07080b; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  .hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    color: #9fb0c4; font: 12px/1.4 system-ui, sans-serif; letter-spacing: .04em;
    opacity: .55; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- Renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

/* ---------- Scene / Camera ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c11);
scene.fog = new THREE.FogExp2(0x0a0c11, 0.012);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0.2, 0.5, 7.0);

/* Soft studio IBL for realistic glass reflections/transmission */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;

/* ---------- Controls ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 4.2;
controls.maxDistance = 12;
controls.minPolarAngle = 0.35;
controls.maxPolarAngle = 2.55;
controls.target.set(0, -0.05, 0);

/* ---------- Lighting ---------- */
const hemi = new THREE.HemisphereLight(0x4c5f82, 0x0a0a0c, 0.35);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff1dc, 1.15);
key.position.set(3.2, 4.5, 5.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 22;
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -5;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0x88aaff, 0.35);
fill.position.set(-4.5, 1.2, 3.0);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 0.55);
rim.position.set(-1.0, 2.4, -4.5);
scene.add(rim);

/* Warm backlight that pours through the translucent panels */
const backLight = new THREE.PointLight(0xffe2ad, 5.5, 22, 1.6);
backLight.position.set(0, 0.2, -2.6);
scene.add(backLight);

/* ---------- Soft glow halo behind the glass (procedural canvas) ---------- */
function makeGlowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
  g.addColorStop(0.00, 'rgba(255,229,187,0.95)');
  g.addColorStop(0.22, 'rgba(255,193,124,0.55)');
  g.addColorStop(0.52, 'rgba(122,86,64,0.16)');
  g.addColorStop(1.00, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const halo = new THREE.Mesh(
  new THREE.PlaneGeometry(12, 12),
  new THREE.MeshBasicMaterial({
    map: makeGlowTexture(), transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, toneMapped: false, opacity: 0.85
  })
);
halo.position.set(0, 0.1, -3.3);
scene.add(halo);

/* ---------- Ground (shadow catcher only) ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.98;
ground.receiveShadow = true;
scene.add(ground);

/* ================= Materials ================= */
function glass(hex) {
  return new THREE.MeshPhysicalMaterial({
    color: hex, metalness: 0.0, roughness: 0.18,
    transmission: 0.9, thickness: 0.45, ior: 1.46,
    clearcoat: 0.25, clearcoatRoughness: 0.35,
    emissive: hex, emissiveIntensity: 0.42,
    side: THREE.DoubleSide
  });
}
const glassMats = {
  amber:  glass(0xffb020),
  teal:   glass(0x17a89b),
  rose:   glass(0xe0487f),
  cobalt: glass(0x2b5fd0)
};
const cameMat = new THREE.MeshStandardMaterial({ color: 0x161419, roughness: 0.55, metalness: 0.6, side: THREE.DoubleSide });
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x121014, roughness: 0.5, metalness: 0.4 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.4, metalness: 0.2 });

/* ================= Geometry helpers ================= */
const P = (x, y) => new THREE.Vector2(x, y);
const lerp2 = (a, b, t) => new THREE.Vector2(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t);
const domeZ = (x, y) => -(0.20 * Math.pow(x / 2.7, 2) + 0.05 * Math.pow(y / 1.7, 2));

const glassDepth = 0.08;
const cameW = 0.045;
const cameDepth = 0.12;

function shapeFromPoints(pts) {
  const s = new THREE.Shape();
  s.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) s.lineTo(pts[i].x, pts[i].y);
  s.closePath();
  return s;
}
function centroid(pts) {
  let x = 0, y = 0;
  for (const p of pts) { x += p.x; y += p.y; }
  return { x: x / pts.length, y: y / pts.length };
}
function cameBox(a, b, z) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const len = Math.hypot(dx, dy);
  if (len < 1e-4) return null;
  const g = new THREE.BoxGeometry(len, cameW, cameDepth);
  const m = new THREE.Matrix4().makeRotationZ(Math.atan2(dy, dx));
  m.setPosition((a.x + b.x) / 2, (a.y + b.y) / 2, z);
  g.applyMatrix4(m);
  return g;
}
function cameNode(p, z) {
  const g = new THREE.CylinderGeometry(cameW * 0.62, cameW * 0.62, cameDepth, 8);
  g.rotateX(Math.PI / 2);
  g.translate(p.x, p.y, z);
  return g;
}
function addGlassCell(group, finalPts, key) {
  const geo = new THREE.ExtrudeGeometry(shapeFromPoints(finalPts), {
    depth: glassDepth, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.01, bevelSegments: 1
  });
  const c = centroid(finalPts);
  const m = new THREE.Mesh(geo, glassMats[key]);
  m.position.z = domeZ(c.x, c.y) - glassDepth / 2;
  m.castShadow = true;
  group.add(m);
}
function addCellCames(finalPts, cameArr) {
  const c = centroid(finalPts);
  const z = domeZ(c.x, c.y) + glassDepth * 0.5;
  const n = finalPts.length;
  for (let k = 0; k < n; k++) {
    const a = finalPts[k], b = finalPts[(k + 1) % n];
    const g = cameBox(a, b, z); if (g) cameArr.push(g);
    cameArr.push(cameNode(a, z));
  }
}

/* ================= Wing builder ================= */
/* Fans ornate glass cells out from a wing "root" toward a smooth free edge. */
function buildWing(cfg, sign, group, cameArr) {
  const K = 5, samplesPerSector = 8;
  const N = K * samplesPerSector;
  const curve = new THREE.SplineCurve(cfg.ctrl.map(p => P(p[0], p[1])));
  const B = curve.getPoints(N);            // N+1 boundary points (positive-x space)
  const R = P(cfg.root[0], cfg.root[1]);
  const f = cfg.f;                          // radial ring fractions incl. final 1.0
  const rings = f.length - 1;

  const S = (v) => new THREE.Vector2(v.x * sign, v.y); // apply mirror at the end

  // Central hub cell (fan from root)
  const hub = [R];
  for (let i = 0; i <= K; i++) hub.push(lerp2(R, B[i * samplesPerSector], f[0]));
  const hubFinal = hub.map(S);
  addGlassCell(group, hubFinal, cfg.hub);
  addCellCames(hubFinal, cameArr);

  // Sectored ring cells
  for (let i = 0; i < K; i++) {
    const idxLo = i * samplesPerSector;
    const idxHi = (i + 1) * samplesPerSector;
    for (let j = 0; j < rings; j++) {
      const inner = f[j], outer = f[j + 1];
      let pts;
      if (j === rings - 1) {
        // outermost cell hugs the curved free edge
        pts = [lerp2(R, B[idxLo], inner), B[idxLo].clone()];
        for (let s = idxLo + 1; s <= idxHi; s++) pts.push(B[s].clone());
        pts.push(lerp2(R, B[idxHi], inner));
      } else {
        pts = [
          lerp2(R, B[idxLo], inner),
          lerp2(R, B[idxLo], outer),
          lerp2(R, B[idxHi], outer),
          lerp2(R, B[idxHi], inner)
        ];
      }
      const finalPts = pts.map(S);
      addGlassCell(group, finalPts, cfg.colorFn(i, j));
      addCellCames(finalPts, cameArr);
    }
  }
}

/* ================= Eyespot decoration ================= */
function addEyespot(group, cx, cy, R, outerKey, innerKey, sign) {
  const x = cx * sign, y = cy;
  const zf = domeZ(x, y) + glassDepth * 0.5 + 0.02;

  function disk(radius, mat, z) {
    const g = new THREE.CylinderGeometry(radius, radius, 0.05, 40);
    g.rotateX(Math.PI / 2);
    const m = new THREE.Mesh(g, mat);
    m.position.set(x, y, z);
    m.castShadow = true;
    group.add(m);
  }
  function ring(radius, z) {
    const g = new THREE.TorusGeometry(radius, cameW * 0.6, 8, 44);
    const m = new THREE.Mesh(g, cameMat);
    m.position.set(x, y, z);
    group.add(m);
  }
  disk(R, glassMats[outerKey], zf);
  ring(R, zf + 0.02);
  disk(R * 0.6, glassMats[innerKey], zf + 0.035);
  ring(R * 0.6, zf + 0.05);
  disk(R * 0.2, darkMat, zf + 0.06);
}

/* ================= Wing configs ================= */
const foreCfg = {
  ctrl: [[0.15,0.95],[0.7,1.45],[1.5,1.55],[2.35,1.35],[2.85,0.85],[2.7,0.35],[2.05,0.05],[0.9,-0.02],[0.2,0.05]],
  root: [0.28, 0.55],
  f: [0.16, 0.42, 0.7, 1.0],
  colorFn: (i, j) => j === 0 ? 'cobalt' : j === 1 ? 'teal' : (i % 2 ? 'rose' : 'amber'),
  hub: 'amber'
};
const hindCfg = {
  ctrl: [[0.2,0.02],[1.1,-0.05],[1.95,-0.35],[2.05,-0.8],[1.6,-1.15],[1.05,-1.4],[0.6,-1.35],[0.28,-1.05]],
  root: [0.32, -0.3],
  f: [0.18, 0.46, 0.74, 1.0],
  colorFn: (i, j) => j === 0 ? 'rose' : j === 1 ? 'cobalt' : (i % 2 ? 'teal' : 'amber'),
  hub: 'teal'
};

/* ================= Assemble one mirrored side ================= */
function assembleSide(sign) {
  const group = new THREE.Group();
  const cameArr = [];
  buildWing(foreCfg, sign, group, cameArr);
  buildWing(hindCfg, sign, group, cameArr);
  addEyespot(group, 1.72, 0.7, 0.34, 'cobalt', 'amber', sign);
  addEyespot(group, 1.15, -0.72, 0.30, 'rose', 'teal', sign);

  if (cameArr.length) {
    const merged = mergeGeometries(cameArr, false);
    const cameMesh = new THREE.Mesh(merged, cameMat);
    cameMesh.castShadow = true;
    group.add(cameMesh);
  }
  return group;
}

/* ================= Body, head, antennae ================= */
function buildBody() {
  const g = new THREE.Group();

  // Lathe profile: tail -> abdomen -> thorax -> neck -> head
  const profile = [
    P(0.02, -1.75), P(0.07, -1.55), P(0.13, -1.2), P(0.16, -0.85),
    P(0.18, -0.4), P(0.20, 0.1), P(0.185, 0.55), P(0.13, 0.95),
    P(0.11, 1.2), P(0.16, 1.42), P(0.14, 1.56), P(0.03, 1.63)
  ];
  const body = new THREE.Mesh(new THREE.LatheGeometry(profile, 28), bodyMat);
  body.castShadow = true;
  g.add(body);

  // Abdomen segmentation rings
  for (const yr of [[-1.4, 0.11], [-1.1, 0.145], [-0.8, 0.17], [-0.5, 0.185]]) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(yr[1], 0.018, 8, 26), cameMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = yr[0];
    g.add(ring);
  }

  // Eyes
  for (const s of [1, -1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 16), darkMat);
    eye.position.set(0.095 * s, 1.5, 0.12);
    g.add(eye);
  }

  // Antennae
  for (const s of [1, -1]) {
    const c = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0.05 * s, 1.55, 0.03),
      new THREE.Vector3(0.30 * s, 1.98, 0.14),
      new THREE.Vector3(0.52 * s, 2.22, 0.20)
    ]);
    const ant = new THREE.Mesh(new THREE.TubeGeometry(c, 24, 0.017, 6, false), cameMat);
    ant.castShadow = true;
    g.add(ant);
    const club = new THREE.Mesh(new THREE.SphereGeometry(0.05, 14, 14), cameMat);
    club.position.set(0.52 * s, 2.22, 0.20);
    g.add(club);
  }
  return g;
}

/* ================= The single centered object ================= */
const butterfly = new THREE.Group();
butterfly.add(assembleSide(1));
butterfly.add(assembleSide(-1));
butterfly.add(buildBody());
butterfly.position.y = 0.0;
scene.add(butterfly);

/* ================= Resize ================= */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ================= Render loop ================= */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
