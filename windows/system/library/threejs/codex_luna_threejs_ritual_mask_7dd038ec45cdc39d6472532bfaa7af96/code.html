<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carved Wooden Ritual Mask</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #160f0c;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const TAU = Math.PI * 2;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x160f0c);
scene.fog = new THREE.Fog(0x160f0c, 9, 18);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.25, 9.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 6.2;
controls.maxDistance = 13;
controls.target.set(0, 0.25, 0);

const wood = new THREE.MeshStandardMaterial({
  color: 0x79401f,
  roughness: 0.78,
  metalness: 0.02
});
const woodLight = new THREE.MeshStandardMaterial({
  color: 0xb66d35,
  roughness: 0.72
});
const woodDark = new THREE.MeshStandardMaterial({
  color: 0x3b1b12,
  roughness: 0.9
});
const edgeWood = new THREE.MeshStandardMaterial({
  color: 0x4b2415,
  roughness: 0.88
});
const cavityMat = new THREE.MeshStandardMaterial({
  color: 0x100b08,
  roughness: 0.96
});
const redPaint = new THREE.MeshStandardMaterial({
  color: 0x8e2f22,
  roughness: 0.88,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.82
});
const ochrePaint = new THREE.MeshStandardMaterial({
  color: 0xc28a31,
  roughness: 0.84,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.78
});
const bluePaint = new THREE.MeshStandardMaterial({
  color: 0x31535a,
  roughness: 0.9,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.68
});

const maskGroup = new THREE.Group();
maskGroup.rotation.y = -0.055;
maskGroup.position.y = 0.08;
scene.add(maskGroup);

function surfaceZ(x, y) {
  const radial = Math.min(1, (x * x) / (2.42 * 2.42) + (y * y) / (3.28 * 3.28));
  return 0.22 - 0.30 * (1 - radial);
}

function createFacePlate() {
  const shape = new THREE.Shape();
  shape.absellipse(0, 0, 2.42, 3.28, 0, TAU, false, 0);

  const eyeCenters = [
    [-0.91, 0.74],
    [0.91, 0.74]
  ];

  for (const center of eyeCenters) {
    const hole = new THREE.Path();
    hole.absellipse(center[0], center[1], 0.49, 0.285, 0, TAU, true, 0);
    shape.holes.push(hole);
  }

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.22,
    steps: 1,
    curveSegments: 48,
    bevelEnabled: true,
    bevelSegments: 3,
    bevelSize: 0.045,
    bevelThickness: 0.055
  });

  const positions = geometry.attributes.position;
  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i);
    const y = positions.getY(i);
    const radial = Math.min(1, (x * x) / (2.42 * 2.42) + (y * y) / (3.28 * 3.28));
    const bend = -0.30 * (1 - radial);
    positions.setZ(i, positions.getZ(i) + bend);
  }

  positions.needsUpdate = true;
  geometry.computeVertexNormals();

  const mesh = new THREE.Mesh(geometry, [wood, edgeWood]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  maskGroup.add(mesh);
}

function createEllipseMesh(x, y, rx, ry, z, material, segments = 48) {
  const shape = new THREE.Shape();
  shape.absellipse(x, y, rx, ry, 0, TAU, false, 0);
  const geometry = new THREE.ShapeGeometry(shape, segments);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.z = z;
  mesh.castShadow = true;
  maskGroup.add(mesh);
  return mesh;
}

function addTube(points, radius, material, closed = false, tubularSegments = 48, radialSegments = 7, offset = 0.04) {
  const curvePoints = points.map((point) => {
    const x = point[0];
    const y = point[1];
    return new THREE.Vector3(x, y, surfaceZ(x, y) + offset);
  });
  const curve = new THREE.CatmullRomCurve3(curvePoints, closed, "centripetal", 0.5);
  const geometry = new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, closed);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  maskGroup.add(mesh);
  return mesh;
}

function addEllipseTube(cx, cy, rx, ry, zOffset, radius, material, segments = 72) {
  const points = [];
  for (let i = 0; i < segments; i++) {
    const angle = (i / segments) * TAU;
    points.push([
      cx + rx * Math.cos(angle),
      cy + ry * Math.sin(angle)
    ]);
  }
  return addTube(points, radius, material, true, segments, 8, zOffset);
}

function addPolygon(points, z, material) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) {
    shape.lineTo(points[i][0], points[i][1]);
  }
  shape.closePath();

  const geometry = new THREE.ShapeGeometry(shape, 8);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.z = z;
  mesh.castShadow = true;
  maskGroup.add(mesh);
  return mesh;
}

function createMouth() {
  const mouthShape = new THREE.Shape();
  mouthShape.moveTo(-0.73, -1.03);
  mouthShape.quadraticCurveTo(-0.38, -0.80, 0, -0.88);
  mouthShape.quadraticCurveTo(0.38, -0.80, 0.73, -1.03);
  mouthShape.quadraticCurveTo(0.57, -1.47, 0, -1.57);
  mouthShape.quadraticCurveTo(-0.57, -1.47, -0.73, -1.03);

  const geometry = new THREE.ExtrudeGeometry(mouthShape, {
    depth: 0.075,
    bevelEnabled: true,
    bevelSegments: 2,
    bevelSize: 0.028,
    bevelThickness: 0.02,
    curveSegments: 16
  });
  const mesh = new THREE.Mesh(geometry, cavityMat);
  mesh.position.z = surfaceZ(0, -1.2) - 0.055;
  mesh.castShadow = true;
  maskGroup.add(mesh);

  addTube([
    [-0.67, -1.035],
    [-0.34, -0.94],
    [0, -0.99],
    [0.34, -0.94],
    [0.67, -1.035]
  ], 0.058, woodLight, false, 32, 7, 0.05);

  addTube([
    [-0.52, -1.39],
    [-0.22, -1.47],
    [0, -1.49],
    [0.22, -1.47],
    [0.52, -1.39]
  ], 0.045, edgeWood, false, 32, 7, 0.035);

  addTube([
    [-0.84, -1.02],
    [-0.72, -1.14],
    [-0.62, -1.22]
  ], 0.035, woodDark, false, 20, 6, 0.045);

  addTube([
    [0.84, -1.02],
    [0.72, -1.14],
    [0.62, -1.22]
  ], 0.035, woodDark, false, 20, 6, 0.045);
}

function createNose() {
  const bridgeGeometry = new THREE.CylinderGeometry(0.20, 0.36, 0.92, 6, 1, false);
  const bridge = new THREE.Mesh(bridgeGeometry, wood);
  bridge.position.set(0, 0.48, 0.12);
  bridge.rotation.z = 0.02;
  bridge.castShadow = true;
  bridge.receiveShadow = true;
  maskGroup.add(bridge);

  const noseGeometry = new THREE.ConeGeometry(0.55, 1.06, 7, 1, false);
  const nose = new THREE.Mesh(noseGeometry, woodLight);
  nose.rotation.x = Math.PI / 2;
  nose.position.set(0, 0.02, 0.46);
  nose.scale.y = 0.9;
  nose.castShadow = true;
  nose.receiveShadow = true;
  maskGroup.add(nose);

  const leftWingGeometry = new THREE.ConeGeometry(0.24, 0.48, 6, 1, false);
  const leftWing = new THREE.Mesh(leftWingGeometry, wood);
  leftWing.rotation.x = Math.PI / 2;
  leftWing.rotation.z = -0.62;
  leftWing.position.set(-0.31, 0.03, 0.29);
  leftWing.castShadow = true;
  maskGroup.add(leftWing);

  const rightWing = leftWing.clone();
  rightWing.rotation.z = 0.62;
  rightWing.position.x = 0.31;
  maskGroup.add(rightWing);

  addTube([
    [-0.13, 1.02],
    [-0.12, 0.68],
    [-0.08, 0.35],
    [0, 0.06]
  ], 0.045, woodDark, false, 28, 6, 0.085);

  addTube([
    [0.13, 1.02],
    [0.12, 0.68],
    [0.08, 0.35],
    [0, 0.06]
  ], 0.045, woodLight, false, 28, 6, 0.11);
}

function createEyes() {
  const eyes = [
    [-0.91, 0.74, -1],
    [0.91, 0.74, 1]
  ];

  for (const eye of eyes) {
    const cx = eye[0];
    const cy = eye[1];
    const side = eye[2];

    createEllipseMesh(cx, cy, 0.445, 0.245, -0.35, cavityMat, 48);

    const rimPoints = [];
    for (let i = 0; i < 64; i++) {
      const angle = (i / 64) * TAU;
      rimPoints.push([
        cx + 0.515 * Math.cos(angle),
        cy + 0.305 * Math.sin(angle) + 0.035 * Math.cos(angle)
      ]);
    }
    addTube(rimPoints, 0.065, woodDark, true, 64, 7, 0.065);

    addTube([
      [cx - side * 0.42, cy + 0.09],
      [cx - side * 0.17, cy + 0.19],
      [cx + side * 0.15, cy + 0.18],
      [cx + side * 0.42, cy + 0.08]
    ], 0.048, woodLight, false, 28, 6, 0.105);

    addTube([
      [cx - side * 0.35, cy - 0.11],
      [cx, cy - 0.18],
      [cx + side * 0.36, cy - 0.095]
    ], 0.035, edgeWood, false, 28, 6, 0.075);
  }
}

function createCarvedRidges() {
  addTube([
    [-1.80, 1.88],
    [-1.34, 2.12],
    [-0.82, 2.25],
    [-0.30, 2.16]
  ], 0.075, woodLight, false, 40, 7, 0.085);

  addTube([
    [1.80, 1.88],
    [1.34, 2.12],
    [0.82, 2.25],
    [0.30, 2.16]
  ], 0.075, woodLight, false, 40, 7, 0.085);

  addTube([
    [-1.72, 1.64],
    [-1.28, 1.81],
    [-0.84, 1.86],
    [-0.48, 1.73]
  ], 0.028, edgeWood, false, 34, 6, 0.07);

  addTube([
    [1.72, 1.64],
    [1.28, 1.81],
    [0.84, 1.86],
    [0.48, 1.73]
  ], 0.028, edgeWood, false, 34, 6, 0.07);

  const leftRidges = [
    [[-1.82, 1.35], [-1.98, 0.98], [-2.00, 0.60], [-1.87, 0.25]],
    [[-1.67, 1.25], [-1.78, 0.87], [-1.75, 0.49], [-1.59, 0.15]],
    [[-1.53, 0.05], [-1.68, -0.34], [-1.70, -0.70], [-1.55, -0.96]],
    [[-1.34, -0.04], [-1.44, -0.41], [-1.40, -0.77], [-1.26, -1.02]]
  ];

  for (const ridge of leftRidges) {
    addTube(ridge, 0.035, woodLight, false, 30, 6, 0.065);
    const darkRidge = ridge.map((point) => [point[0] + 0.075, point[1] - 0.035]);
    addTube(darkRidge, 0.018, edgeWood, false, 30, 5, 0.045);
  }

  for (const ridge of leftRidges) {
    const mirrored = ridge.map((point) => [-point[0], point[1]]);
    addTube(mirrored, 0.035, woodLight, false, 30, 6, 0.065);
    const darkMirrored = mirrored.map((point) => [point[0] - 0.075, point[1] - 0.035]);
    addTube(darkMirrored, 0.018, edgeWood, false, 30, 5, 0.045);
  }

  addTube([
    [-0.42, -1.82],
    [-0.19, -1.92],
    [0.02, -1.94],
    [0.26, -1.88],
    [0.47, -1.76]
  ], 0.045, woodLight, false, 32, 6, 0.06);

  addTube([
    [-0.45, -2.16],
    [-0.18, -2.25],
    [0.12, -2.25],
    [0.43, -2.13]
  ], 0.027, edgeWood, false, 32, 6, 0.055);
}

function createPaintWear() {
  addPolygon([
    [-0.28, 2.62],
    [0.03, 2.72],
    [0.26, 2.48],
    [0.16, 2.19],
    [-0.10, 2.28]
  ], surfaceZ(0, 2.42) + 0.075, ochrePaint);

  addPolygon([
    [0.24, 2.34],
    [0.42, 2.28],
    [0.36, 2.08],
    [0.17, 2.13]
  ], surfaceZ(0.3, 2.2) + 0.08, redPaint);

  addPolygon([
    [-2.02, 0.36],
    [-1.70, 0.58],
    [-1.49, 0.38],
    [-1.63, 0.05],
    [-1.94, 0.07]
  ], surfaceZ(-1.78, 0.3) + 0.075, redPaint);

  addPolygon([
    [2.02, 0.36],
    [1.70, 0.58],
    [1.49, 0.38],
    [1.63, 0.05],
    [1.94, 0.07]
  ], surfaceZ(1.78, 0.3) + 0.075, redPaint);

  addPolygon([
    [-2.08, -0.22],
    [-1.88, -0.08],
    [-1.73, -0.32],
    [-1.82, -0.62],
    [-2.08, -0.54]
  ], surfaceZ(-1.92, -0.36) + 0.07, ochrePaint);

  addPolygon([
    [2.08, -0.22],
    [1.88, -0.08],
    [1.73, -0.32],
    [1.82, -0.62],
    [2.08, -0.54]
  ], surfaceZ(1.92, -0.36) + 0.07, ochrePaint);

  addPolygon([
    [-0.42, -2.42],
    [-0.18, -2.53],
    [0.04, -2.43],
    [0.01, -2.18],
    [-0.24, -2.14]
  ], surfaceZ(-0.2, -2.35) + 0.065, bluePaint);

  addPolygon([
    [0.50, 1.52],
    [0.72, 1.64],
    [0.79, 1.43],
    [0.60, 1.32]
  ], surfaceZ(0.65, 1.47) + 0.08, ochrePaint);

  addPolygon([
    [-0.74, 1.49],
    [-0.56, 1.59],
    [-0.51, 1.39],
    [-0.68, 1.29]
  ], surfaceZ(-0.62, 1.45) + 0.08, bluePaint);

  addTube([
    [-2.14, 1.03],
    [-2.02, 0.82],
    [-2.06, 0.59]
  ], 0.055, ochrePaint, false, 20, 6, 0.09);

  addTube([
    [2.14, 1.03],
    [2.02, 0.82],
    [2.06, 0.59]
  ], 0.055, ochrePaint, false, 20, 6, 0.09);
}

function createBorderAndOrnaments() {
  addEllipseTube(0, 0, 2.46, 3.31, 0.015, 0.082, edgeWood, 96);
  addEllipseTube(0, 0, 2.40, 3.25, 0.055, 0.027, woodLight, 96);

  const crownGeometry = new THREE.ConeGeometry(0.46, 0.82, 7, 1, false);
  const crown = new THREE.Mesh(crownGeometry, wood);
  crown.position.set(0, 3.52, -0.01);
  crown.castShadow = true;
  crown.receiveShadow = true;
  maskGroup.add(crown);

  const crownTip = new THREE.Mesh(
    new THREE.ConeGeometry(0.18, 0.48, 6, 1, false),
    woodLight
  );
  crownTip.position.set(0, 4.14, 0.03);
  crownTip.castShadow = true;
  maskGroup.add(crownTip);

  addTube([
    [-0.34, 3.23],
    [-0.20, 3.50],
    [0, 3.71],
    [0.20, 3.50],
    [0.34, 3.23]
  ], 0.035, woodLight, false, 36, 6, 0.08);

  const sides = [-1, 1];
  for (const side of sides) {
    const diskGeometry = new THREE.CylinderGeometry(0.35, 0.35, 0.18, 10);
    const disk = new THREE.Mesh(diskGeometry, woodDark);
    disk.rotation.x = Math.PI / 2;
    disk.position.set(side * 2.35, 0.18, 0.08);
    disk.castShadow = true;
    maskGroup.add(disk);

    createEllipseMesh(side * 2.35, 0.18, 0.20, 0.20, 0.19, woodLight, 32);
    addEllipseTube(side * 2.35, 0.18, 0.28, 0.28, 0.06, 0.035, edgeWood, 40);

    const peg = new THREE.Mesh(
      new THREE.CylinderGeometry(0.08, 0.08, 0.3, 8),
      woodLight
    );
    peg.rotation.x = Math.PI / 2;
    peg.position.set(side * 2.35, 0.18, 0.27);
    peg.castShadow = true;
    maskGroup.add(peg);
  }
}

createFacePlate();
createEyes();
createNose();
createMouth();
createCarvedRidges();
createPaintWear();
createBorderAndOrnaments();

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x241713,
  roughness: 0.92,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -3.48;
floor.receiveShadow = true;
scene.add(floor);

const pedestal = new THREE.Mesh(
  new THREE.CylinderGeometry(0.82, 0.98, 0.38, 8),
  new THREE.MeshStandardMaterial({ color: 0x3b2117, roughness: 0.9 })
);
pedestal.position.set(0, -3.25, -0.1);
pedestal.castShadow = true;
pedestal.receiveShadow = true;
scene.add(pedestal);

const pedestalTop = new THREE.Mesh(
  new THREE.CylinderGeometry(0.72, 0.82, 0.08, 8),
  new THREE.MeshStandardMaterial({ color: 0x6b351c, roughness: 0.8 })
);
pedestalTop.position.set(0, -3.03, -0.1);
pedestalTop.castShadow = true;
scene.add(pedestalTop);

const hemisphere = new THREE.HemisphereLight(0x9b6e52, 0x160d0a, 1.65);
scene.add(hemisphere);

const keyLight = new THREE.SpotLight(0xffc28a, 270, 18, Math.PI / 5, 0.52, 1.35);
keyLight.position.set(4.8, 6.3, 7.2);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 20;
keyLight.target.position.set(0, 0.4, 0);
scene.add(keyLight);
scene.add(keyLight.target);

const fillLight = new THREE.PointLight(0x536b83, 18, 11, 2);
fillLight.position.set(-4.5, 1.4, 4.5);
scene.add(fillLight);

const rimLight = new THREE.SpotLight(0xd97d45, 150, 15, Math.PI / 4, 0.6, 1.5);
rimLight.position.set(-3.5, 4.8, -3.5);
rimLight.target.position.set(0, 1.1, 0);
scene.add(rimLight);
scene.add(rimLight.target);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
