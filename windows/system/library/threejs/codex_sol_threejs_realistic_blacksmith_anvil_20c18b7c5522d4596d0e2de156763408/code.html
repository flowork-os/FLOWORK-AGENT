<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blacksmith Anvil</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #100f0e; }
    canvas { display: block; }
    .caption {
      position: fixed;
      left: 20px;
      bottom: 16px;
      color: rgba(225, 215, 196, 0.55);
      font: 11px/1.4 Georgia, serif;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="caption">Cast Iron · Forged &amp; Worn</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x100f0e);
    scene.fog = new THREE.FogExp2(0x100f0e, 0.055);

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(5.4, 3.55, 6.3);
    camera.lookAt(0.15, 1.25, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.15, 1.25, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.45;
    controls.minDistance = 4.2;
    controls.maxDistance = 10;
    controls.maxPolarAngle = Math.PI * 0.49;

    function mulberry32(seed) {
      return function () {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    const random = mulberry32(927461);

    function makeScaleTexture(size, faceTexture = false) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext('2d');
      const image = context.createImageData(size, size);

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const index = (y * size + x) * 4;
          const coarse =
            Math.sin(x * 0.083) * 5 +
            Math.sin(y * 0.071) * 4 +
            Math.sin((x + y) * 0.031) * 5;
          const grain = (random() - 0.5) * (faceTexture ? 20 : 34);
          const value = faceTexture
            ? Math.max(58, Math.min(142, 105 + coarse + grain))
            : Math.max(18, Math.min(73, 39 + coarse + grain));

          if (faceTexture) {
            image.data[index] = value;
            image.data[index + 1] = value + 2;
            image.data[index + 2] = value + 1;
          } else {
            image.data[index] = value + 4;
            image.data[index + 1] = value + 1;
            image.data[index + 2] = value;
          }
          image.data[index + 3] = 255;
        }
      }
      context.putImageData(image, 0, 0);

      if (faceTexture) {
        context.lineCap = 'round';
        for (let i = 0; i < 180; i++) {
          const x = random() * size;
          const y = random() * size;
          const length = 5 + random() * 46;
          const angle = (random() - 0.5) * 0.8;
          context.strokeStyle = random() > 0.42
            ? `rgba(225,230,224,${0.04 + random() * 0.14})`
            : `rgba(15,17,16,${0.08 + random() * 0.18})`;
          context.lineWidth = 0.45 + random() * 1.5;
          context.beginPath();
          context.moveTo(x, y);
          context.lineTo(x + Math.cos(angle) * length, y + Math.sin(angle) * length);
          context.stroke();
        }

        for (let i = 0; i < 75; i++) {
          const radius = 0.7 + random() * 4.2;
          const x = random() * size;
          const y = random() * size;
          const gradient = context.createRadialGradient(x, y, 0, x, y, radius);
          gradient.addColorStop(0, 'rgba(10,11,10,0.62)');
          gradient.addColorStop(0.48, 'rgba(36,38,36,0.38)');
          gradient.addColorStop(0.72, 'rgba(205,210,203,0.16)');
          gradient.addColorStop(1, 'rgba(100,100,96,0)');
          context.fillStyle = gradient;
          context.beginPath();
          context.arc(x, y, radius, 0, Math.PI * 2);
          context.fill();
        }
      } else {
        for (let i = 0; i < 105; i++) {
          const x = random() * size;
          const top = random() * size * 0.45;
          const length = 18 + random() * 145;
          const width = 1 + random() * 7;
          const gradient = context.createLinearGradient(x, top, x, top + length);
          gradient.addColorStop(0, 'rgba(135,53,20,0)');
          gradient.addColorStop(0.18, `rgba(142,57,22,${0.06 + random() * 0.18})`);
          gradient.addColorStop(0.68, `rgba(93,38,17,${0.04 + random() * 0.13})`);
          gradient.addColorStop(1, 'rgba(60,25,13,0)');
          context.strokeStyle = gradient;
          context.lineWidth = width;
          context.beginPath();
          context.moveTo(x, top);
          context.bezierCurveTo(
            x + (random() - 0.5) * 12, top + length * 0.3,
            x + (random() - 0.5) * 9, top + length * 0.7,
            x + (random() - 0.5) * 13, top + length
          );
          context.stroke();
        }

        for (let i = 0; i < 240; i++) {
          const x = random() * size;
          const y = random() * size;
          const radius = 0.5 + random() * 3.5;
          context.fillStyle = `rgba(8,8,7,${0.08 + random() * 0.28})`;
          context.beginPath();
          context.arc(x, y, radius, 0, Math.PI * 2);
          context.fill();
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    const scaleTexture = makeScaleTexture(512, false);
    scaleTexture.repeat.set(1.7, 1.25);

    const faceTexture = makeScaleTexture(1024, true);
    faceTexture.repeat.set(1.2, 1.2);

    const bodyMaterial = new THREE.MeshStandardMaterial({
      color: 0x393634,
      map: scaleTexture,
      bumpMap: scaleTexture,
      bumpScale: 0.065,
      metalness: 0.82,
      roughness: 0.67
    });

    const faceMaterial = new THREE.MeshStandardMaterial({
      color: 0xb1b3ae,
      map: faceTexture,
      bumpMap: faceTexture,
      bumpScale: 0.018,
      metalness: 0.94,
      roughness: 0.3
    });

    const edgeMaterial = new THREE.MeshStandardMaterial({
      color: 0x595955,
      metalness: 0.9,
      roughness: 0.43
    });

    const darkIronMaterial = new THREE.MeshStandardMaterial({
      color: 0x11100f,
      metalness: 0.65,
      roughness: 0.84
    });

    const rustMaterial = new THREE.MeshStandardMaterial({
      color: 0x743218,
      metalness: 0.35,
      roughness: 0.93,
      transparent: true,
      opacity: 0.58,
      depthWrite: false,
      polygonOffset: true,
      polygonOffsetFactor: -2
    });

    const anvil = new THREE.Group();
    anvil.rotation.y = -0.08;
    scene.add(anvil);

    const bodyShape = new THREE.Shape();
    bodyShape.moveTo(-1.34, 2.18);
    bodyShape.lineTo(0.77, 2.18);
    bodyShape.lineTo(0.72, 1.94);
    bodyShape.bezierCurveTo(0.67, 1.77, 0.48, 1.66, 0.34, 1.57);
    bodyShape.bezierCurveTo(0.25, 1.47, 0.28, 1.22, 0.37, 0.91);
    bodyShape.bezierCurveTo(0.43, 0.74, 0.71, 0.63, 0.96, 0.55);
    bodyShape.lineTo(0.92, 0.27);
    bodyShape.lineTo(-1.04, 0.27);
    bodyShape.lineTo(-1.11, 0.55);
    bodyShape.bezierCurveTo(-0.84, 0.64, -0.58, 0.75, -0.53, 0.92);
    bodyShape.bezierCurveTo(-0.43, 1.22, -0.41, 1.46, -0.5, 1.57);
    bodyShape.bezierCurveTo(-0.67, 1.69, -1.02, 1.78, -1.27, 1.92);
    bodyShape.closePath();

    const bodyGeometry = new THREE.ExtrudeGeometry(bodyShape, {
      depth: 1.08,
      steps: 1,
      bevelEnabled: true,
      bevelSegments: 3,
      bevelSize: 0.055,
      bevelThickness: 0.055,
      curveSegments: 12
    });
    bodyGeometry.translate(0, 0, -0.54);
    bodyGeometry.computeVertexNormals();

    const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
    body.castShadow = true;
    body.receiveShadow = true;
    anvil.add(body);

    const footGeometry = new RoundedBoxGeometry(2.22, 0.27, 1.36, 4, 0.07);
    const foot = new THREE.Mesh(footGeometry, bodyMaterial);
    foot.position.set(-0.03, 0.27, 0);
    foot.castShadow = true;
    foot.receiveShadow = true;
    anvil.add(foot);

    const faceGeometry = new RoundedBoxGeometry(2.55, 0.27, 1.38, 4, 0.045);
    const face = new THREE.Mesh(faceGeometry, faceMaterial);
    face.position.set(-0.47, 2.31, 0);
    face.castShadow = true;
    face.receiveShadow = true;
    anvil.add(face);

    const heelUndersideGeometry = new THREE.BoxGeometry(0.45, 0.19, 1.16);
    const heelUnderside = new THREE.Mesh(heelUndersideGeometry, bodyMaterial);
    heelUnderside.position.set(-1.53, 2.15, 0);
    heelUnderside.castShadow = true;
    heelUnderside.receiveShadow = true;
    anvil.add(heelUnderside);

    function createHornGeometry() {
      const rings = [
        { x: 0.72, width: 0.69, top: 2.445, bottom: 1.86 },
        { x: 0.97, width: 0.61, top: 2.438, bottom: 1.91 },
        { x: 1.24, width: 0.50, top: 2.420, bottom: 1.97 },
        { x: 1.50, width: 0.38, top: 2.390, bottom: 2.04 },
        { x: 1.74, width: 0.27, top: 2.345, bottom: 2.10 },
        { x: 1.96, width: 0.15, top: 2.290, bottom: 2.15 },
        { x: 2.14, width: 0.035, top: 2.225, bottom: 2.19 }
      ];
      const vertices = [];
      const indices = [];
      const segments = 12;

      for (const ring of rings) {
        const centerY = (ring.top + ring.bottom) * 0.5;
        const radiusY = (ring.top - ring.bottom) * 0.5;
        for (let segment = 0; segment < segments; segment++) {
          const angle = segment / segments * Math.PI * 2;
          const sine = Math.sin(angle);
          const cosine = Math.cos(angle);
          let y = centerY + sine * radiusY;
          let z = cosine * ring.width;

          if (sine > 0.58) {
            const blend = Math.min(1, (sine - 0.58) / 0.42);
            y = THREE.MathUtils.lerp(y, ring.top, blend);
            z *= 1 - blend * 0.12;
          }
          vertices.push(ring.x, y, z);
        }
      }

      for (let ring = 0; ring < rings.length - 1; ring++) {
        for (let segment = 0; segment < segments; segment++) {
          const next = (segment + 1) % segments;
          const a = ring * segments + segment;
          const b = ring * segments + next;
          const c = (ring + 1) * segments + next;
          const d = (ring + 1) * segments + segment;
          indices.push(a, b, d, b, c, d);
        }
      }

      const rootCenterIndex = vertices.length / 3;
      vertices.push(rings[0].x, (rings[0].top + rings[0].bottom) * 0.5, 0);
      for (let segment = 0; segment < segments; segment++) {
        indices.push(
          rootCenterIndex,
          (segment + 1) % segments,
          segment
        );
      }

      const tipCenterIndex = vertices.length / 3;
      const finalRingOffset = (rings.length - 1) * segments;
      vertices.push(
        rings[rings.length - 1].x + 0.035,
        (rings[rings.length - 1].top + rings[rings.length - 1].bottom) * 0.5,
        0
      );
      for (let segment = 0; segment < segments; segment++) {
        indices.push(
          tipCenterIndex,
          finalRingOffset + segment,
          finalRingOffset + (segment + 1) % segments
        );
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    const horn = new THREE.Mesh(createHornGeometry(), faceMaterial);
    horn.castShadow = true;
    horn.receiveShadow = true;
    anvil.add(horn);

    const hornUndersideGeometry = createHornGeometry();
    const hornUnderside = new THREE.Mesh(hornUndersideGeometry, bodyMaterial);
    hornUnderside.scale.set(1.001, 0.93, 1.002);
    hornUnderside.position.y = -0.015;
    hornUnderside.material = bodyMaterial;
    hornUnderside.renderOrder = -1;
    anvil.add(hornUnderside);

    const hardyOpeningGeometry = new RoundedBoxGeometry(0.29, 0.022, 0.29, 2, 0.025);
    const hardyOpening = new THREE.Mesh(hardyOpeningGeometry, darkIronMaterial);
    hardyOpening.position.set(-1.13, 2.458, 0.18);
    hardyOpening.castShadow = false;
    hardyOpening.receiveShadow = true;
    anvil.add(hardyOpening);

    const hardyInteriorGeometry = new BoxGeometrySafe(0.205, 0.22, 0.205);
    function BoxGeometrySafe(width, height, depth) {
      return new THREE.BoxGeometry(width, height, depth, 1, 1, 1);
    }
    const hardyInterior = new THREE.Mesh(hardyInteriorGeometry, darkIronMaterial);
    hardyInterior.position.set(-1.13, 2.35, 0.18);
    anvil.add(hardyInterior);

    const hardyWalls = [
      { position: [-1.13, 2.466, 0.043], scale: [0.32, 0.014, 0.035] },
      { position: [-1.13, 2.466, 0.317], scale: [0.32, 0.014, 0.035] },
      { position: [-1.267, 2.466, 0.18], scale: [0.035, 0.014, 0.25] },
      { position: [-0.993, 2.466, 0.18], scale: [0.035, 0.014, 0.25] }
    ];
    for (const wall of hardyWalls) {
      const geometry = new THREE.BoxGeometry(...wall.scale);
      const mesh = new THREE.Mesh(geometry, edgeMaterial);
      mesh.position.set(...wall.position);
      anvil.add(mesh);
    }

    const pritchelGeometry = new THREE.CylinderGeometry(0.055, 0.07, 0.035, 20);
    const pritchel = new THREE.Mesh(pritchelGeometry, darkIronMaterial);
    pritchel.position.set(-0.82, 2.466, -0.31);
    pritchel.castShadow = false;
    anvil.add(pritchel);

    const pitMaterial = new THREE.MeshStandardMaterial({
      color: 0x2c2d2b,
      metalness: 0.82,
      roughness: 0.62,
      transparent: true,
      opacity: 0.68
    });

    for (let i = 0; i < 42; i++) {
      const x = -1.58 + random() * 2.2;
      const z = -0.58 + random() * 1.16;
      if (Math.abs(x + 1.13) < 0.23 && Math.abs(z - 0.18) < 0.23) continue;
      if (Math.abs(x + 0.82) < 0.1 && Math.abs(z + 0.31) < 0.1) continue;

      const radius = 0.008 + random() * 0.022;
      const pit = new THREE.Mesh(new THREE.CircleGeometry(radius, 10), pitMaterial);
      pit.rotation.x = -Math.PI / 2;
      pit.position.set(x, 2.451 + random() * 0.001, z);
      pit.scale.y = 0.45 + random() * 0.8;
      anvil.add(pit);
    }

    const scarMaterial = new THREE.MeshStandardMaterial({
      color: 0xc1c2bc,
      metalness: 1,
      roughness: 0.21,
      transparent: true,
      opacity: 0.42
    });

    for (let i = 0; i < 24; i++) {
      const length = 0.05 + random() * 0.25;
      const scar = new THREE.Mesh(
        new THREE.BoxGeometry(length, 0.0025, 0.003 + random() * 0.006),
        scarMaterial
      );
      scar.position.set(-1.48 + random() * 2.05, 2.454, -0.54 + random() * 1.08);
      scar.rotation.y = (random() - 0.5) * 0.65;
      anvil.add(scar);
    }

    function makeRustStreak(x, y, z, length, width, side) {
      const shape = new THREE.Shape();
      shape.moveTo(-width * 0.5, 0);
      shape.bezierCurveTo(-width * 0.2, -length * 0.3, -width * 0.55, -length * 0.72, 0, -length);
      shape.bezierCurveTo(width * 0.38, -length * 0.7, width * 0.2, -length * 0.25, width * 0.5, 0);
      shape.closePath();
      const geometry = new THREE.ShapeGeometry(shape, 8);
      const mesh = new THREE.Mesh(geometry, rustMaterial);
      mesh.position.set(x, y, z);
      if (side === 'front') {
        mesh.rotation.set(0, 0, 0);
      } else {
        mesh.rotation.set(0, Math.PI, 0);
      }
      anvil.add(mesh);
    }

    makeRustStreak(-0.93, 2.14, 0.598, 0.64, 0.075, 'front');
    makeRustStreak(-0.41, 2.15, 0.598, 0.41, 0.045, 'front');
    makeRustStreak(0.17, 2.13, 0.598, 0.72, 0.055, 'front');
    makeRustStreak(0.54, 2.12, 0.598, 0.37, 0.035, 'front');
    makeRustStreak(-0.65, 2.14, -0.598, 0.54, 0.052, 'back');
    makeRustStreak(0.32, 2.13, -0.598, 0.46, 0.045, 'back');

    const baseChipMaterial = new THREE.MeshStandardMaterial({
      color: 0x171614,
      metalness: 0.66,
      roughness: 0.8
    });

    for (let i = 0; i < 14; i++) {
      const chip = new THREE.Mesh(
        new THREE.BoxGeometry(0.035 + random() * 0.08, 0.012, 0.012 + random() * 0.035),
        baseChipMaterial
      );
      chip.position.set(-0.95 + random() * 1.85, 0.414, random() > 0.5 ? 0.684 : -0.684);
      chip.rotation.y = random() * Math.PI;
      anvil.add(chip);
    }

    const floorTextureCanvas = document.createElement('canvas');
    floorTextureCanvas.width = 512;
    floorTextureCanvas.height = 512;
    const floorContext = floorTextureCanvas.getContext('2d');
    const floorImage = floorContext.createImageData(512, 512);
    for (let i = 0; i < floorImage.data.length; i += 4) {
      const value = 31 + Math.floor(random() * 17);
      floorImage.data[i] = value + 4;
      floorImage.data[i + 1] = value + 1;
      floorImage.data[i + 2] = value;
      floorImage.data[i + 3] = 255;
    }
    floorContext.putImageData(floorImage, 0, 0);

    for (let i = 0; i < 70; i++) {
      floorContext.fillStyle = `rgba(5,4,3,${0.04 + random() * 0.13})`;
      floorContext.beginPath();
      floorContext.arc(random() * 512, random() * 512, 3 + random() * 24, 0, Math.PI * 2);
      floorContext.fill();
    }

    const floorTexture = new THREE.CanvasTexture(floorTextureCanvas);
    floorTexture.colorSpace = THREE.SRGBColorSpace;
    floorTexture.wrapS = THREE.RepeatWrapping;
    floorTexture.wrapT = THREE.RepeatWrapping;
    floorTexture.repeat.set(8, 8);

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x37322e,
      map: floorTexture,
      bumpMap: floorTexture,
      bumpScale: 0.08,
      roughness: 0.98,
      metalness: 0.05
    });

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0.125;
    floor.receiveShadow = true;
    scene.add(floor);

    const ambientLight = new THREE.HemisphereLight(0x8d9eb0, 0x29150d, 1.15);
    scene.add(ambientLight);

    const keyLight = new THREE.SpotLight(0xffd2a0, 85, 16, Math.PI / 5.5, 0.48, 1.45);
    keyLight.position.set(-3.8, 7.1, 4.8);
    keyLight.target.position.set(0.1, 1.15, 0);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.bias = -0.00035;
    keyLight.shadow.normalBias = 0.025;
    scene.add(keyLight, keyLight.target);

    const rimLight = new THREE.DirectionalLight(0x7799c8, 2.8);
    rimLight.position.set(4.5, 4.2, -5.5);
    scene.add(rimLight);

    const forgeGlow = new THREE.PointLight(0xff571f, 8.5, 7, 2);
    forgeGlow.position.set(-3.5, 1.15, -2.2);
    scene.add(forgeGlow);

    const fillLight = new THREE.DirectionalLight(0xffe0bd, 1.15);
    fillLight.position.set(1.5, 5.5, 5);
    scene.add(fillLight);

    const contactGlowMaterial = new THREE.MeshBasicMaterial({
      color: 0x7d2410,
      transparent: true,
      opacity: 0.1,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const contactGlow = new THREE.Mesh(new THREE.CircleGeometry(2.2, 64), contactGlowMaterial);
    contactGlow.rotation.x = -Math.PI / 2;
    contactGlow.position.set(-1.45, 0.135, -0.7);
    scene.add(contactGlow);

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    }
    addEventListener('resize', resize);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      forgeGlow.intensity = 8.2 + Math.sin(elapsed * 2.2) * 0.35 + Math.sin(elapsed * 5.7) * 0.15;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
