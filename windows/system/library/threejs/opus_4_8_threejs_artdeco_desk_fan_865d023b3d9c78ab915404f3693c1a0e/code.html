<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Art Deco Desk Fan — 1930s</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14161a; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    font: 12px/1.4 "Futura", "Century Gothic", "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(232, 222, 200, 0.42); pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="hint">Art Deco Desk Fan &nbsp;·&nbsp; drag to orbit &nbsp;·&nbsp; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171b);
scene.fog = new THREE.Fog(0x15171b, 4.2, 11.0);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(1.45, 1.02, 1.95);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 0.9;
controls.maxDistance = 6.0;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 0.42, 0);

/* ============================================================
   ENVIRONMENT (procedural studio gradient for crisp chrome)
   ============================================================ */

function makeStudioEnvironment() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');

  // vertical studio gradient: bright ceiling softbox -> dark floor
  const g = ctx.createLinearGradient(0, 0, 0, size);
  g.addColorStop(0.00, '#ffffff');
  g.addColorStop(0.24, '#cfd6dd');
  g.addColorStop(0.47, '#6d757e');
  g.addColorStop(0.52, '#2f3439');
  g.addColorStop(1.00, '#0b0c0e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);

  // a couple of soft highlight panels so chrome shows deco-style streaks
  const panel = (x, y, w, h, a) => {
    const rg = ctx.createRadialGradient(x + w / 2, y + h / 2, 1, x + w / 2, y + h / 2, Math.max(w, h) / 2);
    rg.addColorStop(0, 'rgba(255,255,255,' + a + ')');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(x, y, w, h);
  };
  panel(10, 60, 90, 70, 0.55);
  panel(150, 40, 96, 80, 0.42);
  panel(60, 150, 140, 60, 0.14);

  const tex = new THREE.CanvasTexture(canvas);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;

  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const env = pmrem.fromEquirectangular(tex).texture;
  pmrem.dispose();
  tex.dispose();
  return env;
}
const envMap = makeStudioEnvironment();
scene.environment = envMap;

/* ============================================================
   MATERIALS
   ============================================================ */

const MAT = {
  chrome: new THREE.MeshPhysicalMaterial({
    color: 0xf2f5f8, metalness: 1.0, roughness: 0.045,
    envMap, envMapIntensity: 1.45, clearcoat: 0.6, clearcoatRoughness: 0.03
  }),
  chromeSoft: new THREE.MeshStandardMaterial({
    color: 0xe6ebef, metalness: 1.0, roughness: 0.12, envMap, envMapIntensity: 1.3
  }),
  nickel: new THREE.MeshStandardMaterial({
    color: 0xcfd2d1, metalness: 1.0, roughness: 0.26, envMap, envMapIntensity: 1.15
  }),
  nickelDeep: new THREE.MeshStandardMaterial({
    color: 0xb9bec0, metalness: 1.0, roughness: 0.34, envMap, envMapIntensity: 1.0
  }),
  gold: new THREE.MeshStandardMaterial({
    color: 0xd8a94a, metalness: 1.0, roughness: 0.16, envMap, envMapIntensity: 1.35
  }),
  goldDark: new THREE.MeshStandardMaterial({
    color: 0xb1832f, metalness: 1.0, roughness: 0.28, envMap, envMapIntensity: 1.15
  }),
  aluminum: new THREE.MeshPhysicalMaterial({
    color: 0xdfe4e8, metalness: 1.0, roughness: 0.085,
    envMap, envMapIntensity: 1.4, clearcoat: 0.4, clearcoatRoughness: 0.06,
    side: THREE.DoubleSide
  }),
  bakelite: new THREE.MeshPhysicalMaterial({
    color: 0x121316, metalness: 0.0, roughness: 0.18,
    clearcoat: 1.0, clearcoatRoughness: 0.05, envMap, envMapIntensity: 0.85,
    reflectivity: 0.5
  }),
  bakeliteMatte: new THREE.MeshPhysicalMaterial({
    color: 0x0d0e10, metalness: 0.0, roughness: 0.32,
    clearcoat: 0.7, clearcoatRoughness: 0.14, envMap, envMapIntensity: 0.6
  }),
  ivory: new THREE.MeshPhysicalMaterial({
    color: 0xe9e0c8, metalness: 0.0, roughness: 0.22,
    clearcoat: 0.85, clearcoatRoughness: 0.08, envMap, envMapIntensity: 0.7
  }),
  felt: new THREE.MeshStandardMaterial({ color: 0x1a1215, metalness: 0.0, roughness: 0.95 }),
  cordRubber: new THREE.MeshStandardMaterial({ color: 0x17181b, metalness: 0.0, roughness: 0.62 })
};

/* ============================================================
   HELPERS
   ============================================================ */

function mesh(geo, mat, castShadow = true, receiveShadow = true) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = castShadow;
  m.receiveShadow = receiveShadow;
  return m;
}

/**
 * Lathe profile helper: takes an array of [radius, y] pairs and returns
 * a LatheGeometry. Guards against zero/negative radii producing degenerates.
 */
function lathe(points2, segments = 96) {
  const pts = points2.map(p => new THREE.Vector2(Math.max(p[0], 0.00035), p[1]));
  return new THREE.LatheGeometry(pts, segments);
}

/** Sweep a small circular cross-section along a THREE.Curve. */
function tube(curve, radius, tubularSegments = 96, radialSegments = 10) {
  return new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, false);
}

/** Extrude a THREE.Shape with crisp bevel. */
function extrude(shape, depth, bevel = 0.004, bevelSegments = 2) {
  return new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: bevel > 0,
    bevelThickness: bevel,
    bevelSize: bevel,
    bevelSegments,
    curveSegments: 32
  });
}

/* ============================================================
   THE FAN (one single object group)
   ============================================================ */

const fan = new THREE.Group();
scene.add(fan);

/* ---------- 1. STEPPED ZIGGURAT BASE (black bakelite) ---------- */

const base = new THREE.Group();
fan.add(base);

// Rounded-rectangle plan for each ziggurat tier.
function roundedRectShape(w, d, r) {
  const s = new THREE.Shape();
  const hw = w / 2, hd = d / 2, rr = Math.min(r, hw - 0.001, hd - 0.001);
  s.moveTo(-hw + rr, -hd);
  s.lineTo(hw - rr, -hd);
  s.quadraticCurveTo(hw, -hd, hw, -hd + rr);
  s.lineTo(hw, hd - rr);
  s.quadraticCurveTo(hw, hd, hw - rr, hd);
  s.lineTo(-hw + rr, hd);
  s.quadraticCurveTo(-hw, hd, -hw, hd - rr);
  s.lineTo(-hw, -hd + rr);
  s.quadraticCurveTo(-hw, -hd, -hw, -hd + rr);
  s.closePath();
  return s;
}

// Tier spec: [width, depth, height, cornerRadius]
const TIERS = [
  { w: 0.400, d: 0.300, h: 0.030, r: 0.030 },
  { w: 0.340, d: 0.252, h: 0.028, r: 0.026 },
  { w: 0.282, d: 0.206, h: 0.026, r: 0.022 },
  { w: 0.226, d: 0.164, h: 0.024, r: 0.018 }
];

let tierY = 0;
const tierTops = [];
TIERS.forEach((t, i) => {
  const g = extrude(roundedRectShape(t.w, t.d, t.r), t.h, 0.0035, 2);
  g.rotateX(-Math.PI / 2);          // extrusion now runs along -Y ... normalize below
  g.translate(0, tierY + t.h, 0);   // rotateX(-90) sends +Z depth to -Y; shift up by h
  const m = mesh(g, i === 0 ? MAT.bakeliteMatte : MAT.bakelite);
  base.add(m);

  // Thin chrome reveal line capping each tier (deco banding)
  const bandGeo = extrude(roundedRectShape(t.w + 0.004, t.d + 0.004, t.r + 0.002), 0.0045, 0.0012, 1);
  bandGeo.rotateX(-Math.PI / 2);
  bandGeo.translate(0, tierY + t.h + 0.0045, 0);
  base.add(mesh(bandGeo, MAT.chromeSoft));

  tierY += t.h + 0.0045;
  tierTops.push({ y: tierY, w: t.w, d: t.d });
});

const baseTopY = tierY;

// Felt-ish underside pad so the base doesn't float visually
{
  const padGeo = extrude(roundedRectShape(TIERS[0].w - 0.03, TIERS[0].d - 0.03, 0.02), 0.004, 0, 1);
  padGeo.rotateX(-Math.PI / 2);
  padGeo.translate(0, 0.004, 0);
  const pad = mesh(padGeo, MAT.felt, false, true);
  pad.position.y = -0.0035;
  base.add(pad);
}

/* ---------- 1b. INLAID IVORY CHEVRONS ---------- */
/**
 * Chevron inlay strip lying flush on a tier's vertical face.
 * Built as a flat extruded shape (very shallow) and pushed 0.1mm proud.
 */
function chevronShape(width, height, thickness, count) {
  const s = new THREE.Shape();
  const seg = width / count;
  const half = width / 2;
  const t = thickness;

  // zigzag going right, upper edge
  s.moveTo(-half, -height / 2);
  for (let i = 0; i < count; i++) {
    const x0 = -half + i * seg;
    s.lineTo(x0 + seg / 2, height / 2);
    s.lineTo(x0 + seg, -height / 2);
  }
  // return path offset downward by t forming a constant-width zigzag ribbon
  s.lineTo(half, -height / 2 - t);
  for (let i = count - 1; i >= 0; i--) {
    const x0 = -half + i * seg;
    s.lineTo(x0 + seg / 2, height / 2 - t);
    s.lineTo(x0, -height / 2 - t);
  }
  s.closePath();
  return s;
}

function addChevronBand(parent, width, y, z, count, height, rotY) {
  const g = extrude(chevronShape(width, height, height * 0.42, count), 0.0022, 0.0006, 1);
  const m = mesh(g, MAT.ivory);
  m.position.set(0, y, z);
  if (rotY) { m.rotation.y = rotY; m.position.set(z * Math.sin(rotY), y, z * Math.cos(rotY)); }
  parent.add(m);
}

// front & back faces of tier 0 and tier 1
{
  const t0 = TIERS[0], t1 = TIERS[1];
  const y0 = t0.h * 0.5;
  const y1 = tierTops[0].y + t1.h * 0.5;

  addChevronBand(base, t0.w * 0.62, y0, t0.d / 2 + 0.0012, 5, 0.0135, 0);
  addChevronBand(base, t0.w * 0.62, y0, t0.d / 2 + 0.0012, 5, 0.0135, Math.PI);
  addChevronBand(base, t1.w * 0.58, y1, t1.d / 2 + 0.0012, 4, 0.0120, 0);
  addChevronBand(base, t1.w * 0.58, y1, t1.d / 2 + 0.0012, 4, 0.0120, Math.PI);

  // side faces (rotate 90°)
  addChevronBand(base, t0.d * 0.56, y0, t0.w / 2 + 0.0012, 4, 0.0135, Math.PI / 2);
  addChevronBand(base, t0.d * 0.56, y0, t0.w / 2 + 0.0012, 4, 0.0135, -Math.PI / 2);
}

// Ivory pinstripe medallion on the top step, framing the column
{
  const ringGeo = new THREE.RingGeometry(0.062, 0.0675, 64);
  ringGeo.rotateX(-Math.PI / 2);
  const ring = new THREE.Mesh(ringGeo, MAT.ivory);
  ring.position.y = baseTopY + 0.0006;
  ring.receiveShadow = true;
  base.add(ring);
}

/* ---------- 2. COLUMN / NECK ---------- */

const column = new THREE.Group();
column.position.y = baseTopY;
fan.add(column);

// Stepped chrome collar rising out of the ziggurat
{
  const collar = lathe([
    [0.0560, 0.000],
    [0.0560, 0.010],
    [0.0505, 0.010],
    [0.0505, 0.020],
    [0.0450, 0.020],
    [0.0450, 0.030],
    [0.0395, 0.030],
    [0.0395, 0.041],
    [0.0320, 0.046],
    [0.0300, 0.056]
  ], 84);
  column.add(mesh(collar, MAT.chrome));

  // gold accent ring at the collar waist
  const gr = new THREE.TorusGeometry(0.0405, 0.0028, 12, 72);
  gr.rotateX(Math.PI / 2);
  const grm = mesh(gr, MAT.gold);
  grm.position.y = 0.0255;
  column.add(grm);
}

// Fluted stem (vertical reeds — deco "fluting")
const STEM_H = 0.115;
{
  const stem = lathe([
    [0.0300, 0.000],
    [0.0288, 0.020],
    [0.0272, 0.050],
    [0.0268, 0.080],
    [0.0280, 0.100],
    [0.0300, STEM_H]
  ], 84);
  const stemMesh = mesh(stem, MAT.nickel);
  stemMesh.position.y = 0.052;
  column.add(stemMesh);

  // reeds
  const FLUTES = 16;
  for (let i = 0; i < FLUTES; i++) {
    const a = (i / FLUTES) * Math.PI * 2;
    const fl = new THREE.CapsuleGeometry(0.0026, STEM_H - 0.03, 4, 8);
    const fm = mesh(fl, MAT.chromeSoft);
    fm.position.set(Math.cos(a) * 0.0292, 0.052 + STEM_H * 0.5, Math.sin(a) * 0.0292);
    column.add(fm);
  }

  // gold band at top of stem
  const tg = new THREE.TorusGeometry(0.0312, 0.0032, 12, 72);
  tg.rotateX(Math.PI / 2);
  const tgm = mesh(tg, MAT.gold);
  tgm.position.y = 0.052 + STEM_H - 0.004;
  column.add(tgm);
}

const YOKE_Y = 0.052 + STEM_H + 0.012;

// Yoke / tilt knuckle
{
  const knuckle = lathe([
    [0.0000, 0.000],
    [0.0300, 0.000],
    [0.0345, 0.008],
    [0.0345, 0.020],
    [0.0300, 0.028],
    [0.0000, 0.028]
  ], 72);
  const km = mesh(knuckle, MAT.chrome);
  km.position.y = YOKE_Y - 0.014;
  column.add(km);

  // side tilt bosses (chrome discs on each flank)
  [-1, 1].forEach(s => {
    const g = new THREE.CylinderGeometry(0.0135, 0.0135, 0.010, 40);
    g.rotateZ(Math.PI / 2);
    const m = mesh(g, MAT.chrome);
    m.position.set(s * 0.0345, YOKE_Y, 0);
    column.add(m);

    const gg = new THREE.CylinderGeometry(0.0055, 0.0055, 0.013, 24);
    gg.rotateZ(Math.PI / 2);
    const gm = mesh(gg, MAT.gold);
    gm.position.set(s * 0.0375, YOKE_Y, 0);
    column.add(gm);
  });
}

/* ---------- 3. HEAD (motor bullet + cage + blades) ---------- */
/**
 * Head is built along +Z (facing forward), then tilted slightly up.
 */
const head = new THREE.Group();
head.position.set(0, YOKE_Y + 0.010, 0);
head.rotation.x = -0.055; // gentle upward tilt
fan.add(head);

// ---- 3a. Fluted bullet motor housing (brushed nickel, gold bands) ----
const MOTOR_R = 0.062;
const bulletPts = [
  [0.0000, -0.150],
  [0.0170, -0.150],
  [0.0300, -0.1465],
  [0.0410, -0.1385],
  [0.0498, -0.1265],
  [0.0562, -0.1105],
  [0.0600, -0.0905],
  [0.0618, -0.0660],
  [0.0620, -0.0300],
  [0.0620,  0.0100],
  [0.0616,  0.0300],
  [0.0600,  0.0380],
  [0.0560,  0.0410],
  [0.0470,  0.0425],
  [0.0350,  0.0435],
  [0.0230,  0.0440],
  [0.0130,  0.0442],
  [0.0000,  0.0443]
];
{
  const bulletGeo = lathe(bulletPts, 96);
  bulletGeo.rotateX(Math.PI / 2); // lathe Y axis -> Z axis (forward)
  const bullet = mesh(bulletGeo, MAT.nickel);
  head.add(bullet);

  // Fluting: thin recessed reeds around the barrel
  const REEDS = 24;
  for (let i = 0; i < REEDS; i++) {
    const a = (i / REEDS) * Math.PI * 2;
    const g = new THREE.CapsuleGeometry(0.0030, 0.098, 4, 8);
    g.rotateX(Math.PI / 2);
    const m = mesh(g, MAT.nickelDeep);
    m.position.set(Math.cos(a) * 0.0605, Math.sin(a) * 0.0605, -0.048);
    head.add(m);
  }

  // Gold bands around the bullet
  const bands = [
    { z:  0.030, r: 0.0608, t: 0.0035, mat: MAT.gold },
    { z:  0.014, r: 0.0624, t: 0.0026, mat: MAT.goldDark },
    { z: -0.008, r: 0.0628, t: 0.0032, mat: MAT.gold },
    { z: -0.098, r: 0.0570, t: 0.0030, mat: MAT.gold },
    { z: -0.118, r: 0.0480, t: 0.0026, mat: MAT.goldDark }
  ];
  bands.forEach(b => {
    const g = new THREE.TorusGeometry(b.r, b.t, 14, 84);
    const m = mesh(g, b.mat);
    m.position.z = b.z;
    head.add(m);
  });

  // Rear ventilation slots (thin dark slits)
  const SLOTS = 14;
  for (let i = 0; i < SLOTS; i++) {
    const a = (i / SLOTS) * Math.PI * 2 + 0.1;
    const g = new THREE.BoxGeometry(0.0055, 0.0035, 0.030);
    const m = mesh(g, MAT.bakeliteMatte);
    m.position.set(Math.cos(a) * 0.0592, Math.sin(a) * 0.0592, -0.112);
    m.rotation.z = a;
    head.add(m);
  }

  // Rear tail cap ornament
  const tailGeo = lathe([
    [0.0000, 0.000],
    [0.0155, 0.000],
    [0.0165, 0.006],
    [0.0130, 0.014],
    [0.0070, 0.020],
    [0.0000, 0.022]
  ], 48);
  tailGeo.rotateX(-Math.PI / 2);
  const tail = mesh(tailGeo, MAT.gold);
  tail.position.z = -0.150;
  head.add(tail);
}

// ---- 3b. Front nose / cage mounting hub ----
const HUB_Z = 0.0443;
{
  const noseGeo = lathe([
    [0.0000, 0.000],
    [0.0290, 0.000],
    [0.0300, 0.006],
    [0.0290, 0.012],
    [0.0230, 0.017],
    [0.0000, 0.019]
  ], 64);
  noseGeo.rotateX(-Math.PI / 2);
  const nose = mesh(noseGeo, MAT.chrome);
  nose.position.z = HUB_Z;
  head.add(nose);
}

/* ---------- 4. BLADES (four polished aluminum) ---------- */

const rotor = new THREE.Group();
rotor.position.z = HUB_Z + 0.030;
head.add(rotor);

// Spinner hub
{
  const spinner = lathe([
    [0.0000, 0.000],
    [0.0245, 0.000],
    [0.0258, 0.006],
    [0.0250, 0.016],
    [0.0210, 0.024],
    [0.0130, 0.030],
    [0.0000, 0.032]
  ], 56);
  spinner.rotateX(-Math.PI / 2);
  rotor.add(mesh(spinner, MAT.aluminum));

  const backPlate = new THREE.CylinderGeometry(0.026, 0.026, 0.006, 48);
  backPlate.rotateX(Math.PI / 2);
  const bp = mesh(backPlate, MAT.chromeSoft);
  bp.position.z = -0.004;
  rotor.add(bp);
}

/**
 * A single paddle blade: a swept, twisted aluminum sheet built from a
 * parametric grid (span x chord) so it curves like a real stamped blade.
 */
function makeBlade() {
  const SPAN = 26, CHORD = 14;
  const rInner = 0.026, rOuter = 0.152;
  const positions = [];
  const normals = [];
  const indices = [];

  for (let i = 0; i <= SPAN; i++) {
    const u = i / SPAN;                 // 0 at root, 1 at tip
    const r = rInner + (rOuter - rInner) * u;

    // chord width: narrow root, wide belly, rounded paddle tip
    const widthProfile = 0.030 + 0.072 * Math.sin(Math.pow(u, 0.72) * Math.PI * 0.86);
    const pitch = THREE.MathUtils.lerp(0.62, 0.30, u); // radians, washout toward tip
    const cosP = Math.cos(pitch), sinP = Math.sin(pitch);

    for (let j = 0; j <= CHORD; j++) {
      const v = j / CHORD - 0.5;        // -0.5 .. 0.5 across chord
      const c = v * widthProfile;

      // camber: gentle scoop across the chord
      const camber = (0.25 - v * v) * 0.055 * (0.35 + 0.65 * u);

      // sweep the blade backward slightly along rotation direction
      const sweep = 0.30 * u * u;

      const along = c * cosP - camber * sinP;   // along tangential direction
      const outZ = c * sinP + camber * cosP;    // out of disc plane

      const ang = sweep + along / Math.max(r, 0.02);
      const x = Math.cos(ang) * r;
      const y = Math.sin(ang) * r;
      const z = outZ;

      positions.push(x, y, z);
      normals.push(0, 0, 1); // replaced by computeVertexNormals
    }
  }

  const stride = CHORD + 1;
  for (let i = 0; i < SPAN; i++) {
    for (let j = 0; j < CHORD; j++) {
      const a = i * stride + j;
      const b = a + 1;
      const c2 = a + stride;
      const d = c2 + 1;
      indices.push(a, c2, b, b, c2, d);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

const bladeGeo = makeBlade();
for (let i = 0; i < 4; i++) {
  const b = mesh(bladeGeo, MAT.aluminum);
  b.rotation.z = (i / 4) * Math.PI * 2;
  rotor.add(b);
}

/* ---------- 5. SUNBURST CAGE ---------- */

const CAGE_R = 0.175;          // outer rim radius
const CAGE_FRONT_Z = HUB_Z + 0.128;   // apex of the front dome
const CAGE_BACK_Z = HUB_Z - 0.012;    // where rear guard meets housing

const cage = new THREE.Group();
head.add(cage);

/**
 * Front guard profile: from the center medallion out to the rim.
 * Returns a point on the dome for parameter t in [0,1].
 */
function frontGuardPoint(t) {
  const r = THREE.MathUtils.lerp(0.020, CAGE_R, t);
  // flattened dome: mostly flat near rim, domed at center
  const z = CAGE_FRONT_Z - (CAGE_FRONT_Z - (HUB_Z + 0.052)) * Math.pow(t, 1.55);
  return new THREE.Vector3(0, r, z);
}

/** Rear guard profile mirrored back toward the motor. */
function rearGuardPoint(t) {
  const r = THREE.MathUtils.lerp(0.062, CAGE_R, t);
  const z = THREE.MathUtils.lerp(CAGE_BACK_Z - 0.052, HUB_Z + 0.040, Math.pow(t, 1.25));
  return new THREE.Vector3(0, r, z);
}

// --- 5a. Radiating sunburst wires (front) ---
const SPOKES = 40;
{
  const proto = [];
  const N = 22;
  for (let i = 0; i <= N; i++) proto.push(frontGuardPoint(i / N));
  const protoCurve = new THREE.CatmullRomCurve3(proto);
  const spokeGeo = tube(protoCurve, 0.0016, 40, 8);

  for (let i = 0; i < SPOKES; i++) {
    const a = (i / SPOKES) * Math.PI * 2;
    const m = mesh(spokeGeo, MAT.chrome);
    m.rotation.z = a;
    cage.add(m);
  }
}

// --- 5b. Rear guard wires ---
{
  const proto = [];
  const N = 18;
  for (let i = 0; i <= N; i++) proto.push(rearGuardPoint(i / N));
  const protoCurve = new THREE.CatmullRomCurve3(proto);
  const spokeGeo = tube(protoCurve, 0.0015, 36, 8);

  for (let i = 0; i < SPOKES; i++) {
    const a = (i / SPOKES) * Math.PI * 2 + Math.PI / SPOKES;
    const m = mesh(spokeGeo, MAT.chromeSoft);
    m.rotation.z = a;
    cage.add(m);
  }
}

// --- 5c. Concentric hoops on the front guard (deco ripple rings) ---
{
  const hoopTs = [0.30, 0.52, 0.72, 0.88];
  hoopTs.forEach((t, idx) => {
    const p = frontGuardPoint(t);
    const g = new THREE.TorusGeometry(p.y, idx === 3 ? 0.0018 : 0.0014, 10, 128);
    const m = mesh(g, MAT.chrome);
    m.position.z = p.z;
    cage.add(m);
  });

  // rear hoops
  [0.34, 0.66].forEach(t => {
    const p = rearGuardPoint(t);
    const g = new THREE.TorusGeometry(p.y, 0.0014, 10, 120);
    const m = mesh(g, MAT.chromeSoft);
    m.position.z = p.z;
    cage.add(m);
  });
}

// --- 5d. Outer rim: a deco stepped chrome band binding front & rear ---
{
  const rimPts = [
    [CAGE_R - 0.0060, HUB_Z + 0.0520],
    [CAGE_R + 0.0025, HUB_Z + 0.0520],
    [CAGE_R + 0.0072, HUB_Z + 0.0470],
    [CAGE_R + 0.0086, HUB_Z + 0.0330],
    [CAGE_R + 0.0086, HUB_Z + 0.0170],
    [CAGE_R + 0.0072, HUB_Z + 0.0060],
    [CAGE_R + 0.0025, HUB_Z + 0.0000],
    [CAGE_R - 0.0060, HUB_Z + 0.0000]
  ];
  // Build the rim as a lathe around Y, then rotate so its axis is Z.
  const rimProfile = rimPts.map(p => new THREE.Vector2(p[0], p[1]));
  const rimGeo = new THREE.LatheGeometry(rimProfile, 128);
  rimGeo.rotateX(-Math.PI / 2);
  // Lathe was built around Y with "y" holding our z-values; after rotateX(-90)
  // the profile's y maps to +z automatically. Re-center not needed.
  const rim = mesh(rimGeo, MAT.chrome);
  cage.add(rim);

  // gold pinstripes on the rim
  [HUB_Z + 0.0455, HUB_Z + 0.0075].forEach(z => {
    const g = new THREE.TorusGeometry(CAGE_R + 0.0080, 0.0016, 10, 128);
    const m = mesh(g, MAT.gold);
    m.position.z = z;
    cage.add(m);
  });

  // inner reinforcing ring behind the rim
  const innerRing = new THREE.TorusGeometry(CAGE_R - 0.0055, 0.0022, 10, 128);
  const irm = mesh(innerRing, MAT.chromeSoft);
  irm.position.z = HUB_Z + 0.026;
  cage.add(irm);
}

// --- 5e. Center medallion: the sunburst boss ---
{
  const med = new THREE.Group();
  med.position.z = CAGE_FRONT_Z - 0.004;
  cage.add(med);

  const discGeo = lathe([
    [0.0000, 0.000],
    [0.0250, 0.000],
    [0.0255, 0.004],
    [0.0230, 0.009],
    [0.0175, 0.013],
    [0.0100, 0.0155],
    [0.0000, 0.0165]
  ], 64);
  discGeo.rotateX(-Math.PI / 2);
  med.add(mesh(discGeo, MAT.chrome));

  // gold sunburst rays on the medallion face
  const RAYS = 12;
  for (let i = 0; i < RAYS; i++) {
    const a = (i / RAYS) * Math.PI * 2;
    const g = new THREE.BoxGeometry(0.0030, 0.0135, 0.0022);
    const m = mesh(g, MAT.gold);
    m.position.set(Math.cos(a) * 0.0165, Math.sin(a) * 0.0165, 0.0110);
    m.rotation.z = a - Math.PI / 2;
    med.add(m);
  }

  const capGeo = new THREE.SphereGeometry(0.0072, 32, 20);
  const cap = mesh(capGeo, MAT.gold);
  cap.position.z = 0.0165;
  med.add(cap);

  const ringGeo = new THREE.TorusGeometry(0.0248, 0.0022, 10, 72);
  const rm = mesh(ringGeo, MAT.gold);
  rm.position.z = 0.0022;
  med.add(rm);
}

// --- 5f. Three cage struts anchoring the rim back to the housing ---
{
  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * Math.PI * 2 + Math.PI / 2;
    const p0 = new THREE.Vector3(Math.cos(a) * 0.058, Math.sin(a) * 0.058, HUB_Z - 0.010);
    const p1 = new THREE.Vector3(Math.cos(a) * 0.112, Math.sin(a) * 0.112, HUB_Z + 0.004);
    const p2 = new THREE.Vector3(Math.cos(a) * 0.160, Math.sin(a) * 0.160, HUB_Z + 0.016);
    const p3 = new THREE.Vector3(Math.cos(a) * (CAGE_R - 0.002), Math.sin(a) * (CAGE_R - 0.002), HUB_Z + 0.026);
    const curve = new THREE.CatmullRomCurve3([p0, p1, p2, p3]);
    cage.add(mesh(tube(curve, 0.0026, 40, 8), MAT.chrome));
  }
}

/* ---------- 6. LEVER SWITCH ON FAN-SHAPED ESCUTCHEON ---------- */

const switchGroup = new THREE.Group();
// sits on the top step of the ziggurat, forward-right of the column
switchGroup.position.set(0.0, baseTopY + 0.0008, TIERS[3].d / 2 - 0.006);
fan.add(switchGroup);

/** Fan-shaped (segment of an annulus) escutcheon plate. */
function fanShape(rIn, rOut, spreadDeg) {
  const s = new THREE.Shape();
  const half = THREE.MathUtils.degToRad(spreadDeg) / 2;
  const steps = 28;

  s.moveTo(Math.cos(-half) * rIn, Math.sin(-half) * rIn);
  for (let i = 0; i <= steps; i++) {
    const a = -half + (i / steps) * (half * 2);
    s.lineTo(Math.cos(a) * rOut, Math.sin(a) * rOut);
  }
  for (let i = steps; i >= 0; i--) {
    const a = -half + (i / steps) * (half * 2);
    s.lineTo(Math.cos(a) * rIn, Math.sin(a) * rIn);
  }
  s.closePath();
  return s;
}

{
  // Escutcheon plate lying flat on the base, fanning forward (+Z)
  const plateGeo = extrude(fanShape(0.012, 0.048, 108), 0.0030, 0.0008, 2);
  plateGeo.rotateX(-Math.PI / 2);       // plate now lies in XZ plane
  plateGeo.rotateY(-Math.PI / 2);       // fan opens toward +Z
  const plate = mesh(plateGeo, MAT.chrome);
  plate.position.y = 0.0030;
  switchGroup.add(plate);

  // ivory inlay wedge inside the fan plate
  const inlayGeo = extrude(fanShape(0.019, 0.040, 88), 0.0012, 0.0004, 1);
  inlayGeo.rotateX(-Math.PI / 2);
  inlayGeo.rotateY(-Math.PI / 2);
  const inlay = mesh(inlayGeo, MAT.ivory);
  inlay.position.y = 0.00405;
  switchGroup.add(inlay);

  // gold speed detent pips: OFF / 1 / 2 / 3
  for (let i = 0; i < 4; i++) {
    const a = THREE.MathUtils.degToRad(-42 + i * 28);
    const g = new THREE.CylinderGeometry(0.0016, 0.0016, 0.0018, 16);
    const m = mesh(g, MAT.gold);
    m.position.set(Math.sin(a) * 0.0335, 0.0043, Math.cos(a) * 0.0335);
    switchGroup.add(m);
  }

  // pivot boss
  const bossGeo = lathe([
    [0.0000, 0.000],
    [0.0100, 0.000],
    [0.0105, 0.003],
    [0.0085, 0.007],
    [0.0000, 0.009]
  ], 40);
  const boss = mesh(bossGeo, MAT.chrome);
  boss.position.y = 0.0030;
  switchGroup.add(boss);

  // the lever itself — small bakelite paddle on a chrome arm
  const lever = new THREE.Group();
  lever.position.y = 0.0090;
  lever.rotation.y = THREE.MathUtils.degToRad(-16); // set to speed "2"
  switchGroup.add(lever);

  const armGeo = new THREE.BoxGeometry(0.0042, 0.0028, 0.030);
  const arm = mesh(armGeo, MAT.chrome);
  arm.position.z = 0.016;
  lever.add(arm);

  const knobGeo = lathe([
    [0.0000, 0.000],
    [0.0048, 0.000],
    [0.0056, 0.004],
    [0.0050, 0.011],
    [0.0032, 0.015],
    [0.0000, 0.016]
  ], 32);
  const knob = mesh(knobGeo, MAT.bakelite);
  knob.position.set(0, 0.0006, 0.030);
  lever.add(knob);

  const knobRing = new THREE.TorusGeometry(0.0052, 0.0009, 8, 40);
  knobRing.rotateX(Math.PI / 2);
  const kr = mesh(knobRing, MAT.gold);
  kr.position.set(0, 0.0050, 0.030);
  lever.add(kr);
}

/* ---------- 7. CORD exiting the rear of the base ---------- */
{
  const cordCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.0, 0.016, -TIERS[0].d / 2 + 0.004),
    new THREE.Vector3(-0.02, 0.014, -0.20),
    new THREE.Vector3(-0.10, 0.007, -0.30),
    new THREE.Vector3(-0.24, 0.006, -0.30),
    new THREE.Vector3(-0.36, 0.006, -0.20)
  ]);
  const cord = mesh(tube(cordCurve, 0.0060, 120, 10), MAT.cordRubber);
  fan.add(cord);

  // chrome strain relief where the cord leaves the base
  const srGeo = lathe([
    [0.0000, 0.000],
    [0.0110, 0.000],
    [0.0105, 0.008],
    [0.0080, 0.020],
    [0.0068, 0.028]
  ], 32);
  srGeo.rotateX(Math.PI / 2);
  const sr = mesh(srGeo, MAT.chrome);
  sr.position.set(0, 0.016, -TIERS[0].d / 2 + 0.002);
  fan.add(sr);
}

/* ============================================================
   CENTER THE SINGLE OBJECT
   ============================================================ */

fan.updateMatrixWorld(true);
{
  const box = new THREE.Box3().setFromObject(fan);
  const center = new THREE.Vector3();
  box.getCenter(center);
  // center in X/Z, keep the base sitting on y = 0
  fan.position.x -= center.x;
  fan.position.z -= center.z;
  fan.updateMatrixWorld(true);

  const box2 = new THREE.Box3().setFromObject(fan);
  const size = new THREE.Vector3();
  box2.getSize(size);
  controls.target.set(0, box2.min.y + size.y * 0.52, 0);
  controls.update();
}

/* ============================================================
   GROUND (shadow catcher)
   ============================================================ */

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(24, 24),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.0005;
ground.receiveShadow = true;
scene.add(ground);

// faint reflective floor disc for studio feel (non-shadow-catching)
{
  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(1.35, 96),
    new THREE.MeshStandardMaterial({
      color: 0x1b1e23, metalness: 0.72, roughness: 0.46,
      envMap, envMapIntensity: 0.4
    })
  );
  disc.rotation.x = -Math.PI / 2;
  disc.position.y = -0.0016;
  disc.receiveShadow = true;
  scene.add(disc);
}

/* ============================================================
   LIGHTING — key + fill + rim
   ============================================================ */

scene.add(new THREE.HemisphereLight(0xbfd4e8, 0x14100c, 0.42));

const key = new THREE.DirectionalLight(0xfff3e0, 2.5);
key.position.set(1.5, 2.35, 1.7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.4;
key.shadow.camera.far = 8;
key.shadow.camera.left = -0.7;
key.shadow.camera.right = 0.7;
key.shadow.camera.top = 0.7;
key.shadow.camera.bottom = -0.7;
key.shadow.bias = -0.0007;
key.shadow.normalBias = 0.012;
key.target.position.set(0, 0.30, 0);
scene.add(key);
scene.add(key.target);

const fill = new THREE.DirectionalLight(0xa9c6e6, 0.85);
fill.position.set(-2.1, 1.05, 1.15);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9a0, 1.55);
rim.position.set(-0.9, 1.5, -2.2);
scene.add(rim);

// tight practical highlight to make the chrome cage sparkle
const spark = new THREE.PointLight(0xffffff, 0.85, 3.2, 2.0);
spark.position.set(0.42, 0.78, 0.66);
scene.add(spark);

const spark2 = new THREE.PointLight(0xcfe4ff, 0.55, 3.0, 2.0);
spark2.position.set(-0.5, 0.52, 0.30);
scene.add(spark2);

/* ============================================================
   ANIMATE
   ============================================================ */

const clock = new THREE.Clock();

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  // slow, dignified blade turn (display speed, not blur speed)
  rotor.rotation.z -= dt * 1.9;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
