<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyberpunk Hoverbike</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030407}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030407);
scene.fog = new THREE.FogExp2(0x030407, 0.035);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.5, 4.4, 10.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.65, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 6;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.86;

const hemi = new THREE.HemisphereLight(0x5577aa, 0x080307, 1.4);
scene.add(hemi);

const key = new THREE.SpotLight(0x84aaff, 95, 30, Math.PI / 5, 0.55, 1.4);
key.position.set(5, 10, 7);
key.target.position.set(0, 1, 0);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
scene.add(key, key.target);

const pinkLight = new THREE.PointLight(0xff168f, 30, 10, 2);
pinkLight.position.set(-2, 2.2, -2);
scene.add(pinkLight);

const greenLight = new THREE.PointLight(0xaaff22, 10, 5, 2);
greenLight.position.set(2.6, 3.3, 0);
scene.add(greenLight);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(15, 96),
  new THREE.MeshStandardMaterial({ color: 0x080a0e, roughness: 0.78, metalness: 0.28 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const ring = new THREE.Mesh(
  new THREE.RingGeometry(4.2, 4.24, 96),
  new THREE.MeshBasicMaterial({ color: 0xff087f, transparent: true, opacity: 0.28, side: THREE.DoubleSide })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.012;
scene.add(ring);

const grid = new THREE.GridHelper(30, 30, 0x301127, 0x101522);
grid.position.y = 0.018;
grid.material.transparent = true;
grid.material.opacity = 0.32;
scene.add(grid);

const bike = new THREE.Group();
bike.position.y = 1.05;
bike.rotation.y = -0.12;
scene.add(bike);

const mat = {
  carbon: new THREE.MeshPhysicalMaterial({ color: 0x090b0f, metalness: 0.62, roughness: 0.26, clearcoat: 0.75, clearcoatRoughness: 0.28 }),
  black: new THREE.MeshStandardMaterial({ color: 0x101319, metalness: 0.82, roughness: 0.31 }),
  dark: new THREE.MeshStandardMaterial({ color: 0x222831, metalness: 0.78, roughness: 0.42 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x7d8790, metalness: 0.93, roughness: 0.25 }),
  armor: new THREE.MeshStandardMaterial({ color: 0x48505a, metalness: 0.84, roughness: 0.52 }),
  seat: new THREE.MeshStandardMaterial({ color: 0x151318, roughness: 0.8, metalness: 0.12 }),
  pink: new THREE.MeshStandardMaterial({ color: 0xff087f, emissive: 0xff0077, emissiveIntensity: 8, roughness: 0.25 }),
  green: new THREE.MeshStandardMaterial({ color: 0xb7ff24, emissive: 0x75ff00, emissiveIntensity: 6, transparent: true, opacity: 0.82, side: THREE.DoubleSide }),
  cyan: new THREE.MeshStandardMaterial({ color: 0x21c7ff, emissive: 0x0077ff, emissiveIntensity: 5 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x08090b, roughness: 0.88 }),
  copper: new THREE.MeshStandardMaterial({ color: 0xb56b3c, metalness: 0.8, roughness: 0.38 }),
  tape: new THREE.MeshStandardMaterial({ color: 0xd9d3b3, roughness: 0.83, side: THREE.DoubleSide })
};

function mesh(geometry, material, position, rotation, parent = bike) {
  const o = new THREE.Mesh(geometry, material);
  if (position) o.position.set(...position);
  if (rotation) o.rotation.set(...rotation);
  o.castShadow = true;
  o.receiveShadow = true;
  parent.add(o);
  return o;
}

function roundedBox(w, h, d, r, material, position, rotation, parent = bike) {
  const shape = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  shape.moveTo(x + r, y);
  shape.lineTo(x + w - r, y);
  shape.quadraticCurveTo(x + w, y, x + w, y + r);
  shape.lineTo(x + w, y + h - r);
  shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  shape.lineTo(x + r, y + h);
  shape.quadraticCurveTo(x, y + h, x, y + h - r);
  shape.lineTo(x, y + r);
  shape.quadraticCurveTo(x, y, x + r, y);
  const g = new THREE.ExtrudeGeometry(shape, { depth: d, bevelEnabled: true, bevelSize: r * 0.35, bevelThickness: r * 0.35, bevelSegments: 2 });
  g.center();
  return mesh(g, material, position, rotation, parent);
}

function tube(points, radius, material, parent = bike, segments = 48) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  return mesh(new THREE.TubeGeometry(curve, segments, radius, 8, false), material, null, null, parent);
}

function bolt(position, rotation, parent = bike, scale = 1) {
  const b = mesh(new THREE.CylinderGeometry(0.075 * scale, 0.075 * scale, 0.045, 8), mat.steel, position, rotation, parent);
  return b;
}

function decalGlyph(parent, position, rotation, glyph, color = '#17191c', scale = 1) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 256, 128);
  ctx.fillStyle = 'rgba(220,214,184,0.96)';
  ctx.fillRect(7, 15, 242, 96);
  ctx.strokeStyle = 'rgba(60,55,50,0.3)';
  ctx.lineWidth = 5;
  ctx.setLineDash([14, 7]);
  ctx.strokeRect(10, 18, 236, 90);
  ctx.fillStyle = color;
  ctx.font = '900 70px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(glyph, 128, 65);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const material = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide, depthWrite: false });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(1.25 * scale, 0.62 * scale), material);
  plane.position.set(...position);
  plane.rotation.set(...rotation);
  parent.add(plane);
}

const spine = tube([
  [-2.65, 1.24, 0], [-1.6, 1.62, 0], [-0.35, 1.86, 0], [1.12, 2.0, 0], [2.25, 2.42, 0]
], 0.13, mat.dark);

tube([[-1.8,1.55,-0.45],[-0.4,1.2,-0.62],[1.55,1.55,-0.5]],0.085,mat.steel);
tube([[-1.8,1.55,0.45],[-0.4,1.2,0.62],[1.55,1.55,0.5]],0.085,mat.steel);

const body = roundedBox(3.55, 0.9, 1.38, 0.34, mat.carbon, [-0.25, 1.8, 0], [0, 0, -0.08]);
body.scale.set(1, 1, 0.92);

const nose = mesh(new THREE.ConeGeometry(0.78, 2.25, 6), mat.carbon, [2.05, 2.05, 0], [0, 0, -Math.PI / 2]);
nose.scale.z = 0.82;

const tail = mesh(new THREE.ConeGeometry(0.72, 1.9, 5), mat.carbon, [-2.22, 1.9, 0], [0, 0, Math.PI / 2]);
tail.scale.z = 0.8;

roundedBox(2.0, 0.36, 0.92, 0.18, mat.seat, [-0.75, 2.47, 0], [0, 0, -0.035]);
roundedBox(0.48, 0.62, 0.96, 0.14, mat.seat, [-1.7, 2.52, 0], [0, 0, 0.32]);

mesh(new THREE.BoxGeometry(3.15, 0.055, 0.055), mat.pink, [0.08, 2.1, -0.705], [0, 0, -0.08]);
mesh(new THREE.BoxGeometry(3.15, 0.055, 0.055), mat.pink, [0.08, 2.1, 0.705], [0, 0, -0.08]);
mesh(new THREE.BoxGeometry(1.0, 0.05, 0.07), mat.pink, [-2.05, 2.12, -0.51], [0, 0, 0.3]);
mesh(new THREE.BoxGeometry(1.0, 0.05, 0.07), mat.pink, [-2.05, 2.12, 0.51], [0, 0, 0.3]);

decalGlyph(bike, [0.05, 2.16, -0.716], [0, Math.PI, -0.08], '鬼 07', '#151518', 0.8);

function thrustPod(z) {
  const pod = new THREE.Group();
  pod.position.set(-0.05, 0.85, z);
  bike.add(pod);

  const outer = mesh(new THREE.CylinderGeometry(0.67, 0.67, 1.5, 32, 1, true), mat.black, [0,0,0], [0,0,Math.PI/2], pod);
  outer.scale.z = 1.08;

  mesh(new THREE.TorusGeometry(0.67, 0.13, 12, 32), mat.armor, [-0.75,0,0], [0,Math.PI/2,0], pod);
  mesh(new THREE.TorusGeometry(0.67, 0.13, 12, 32), mat.armor, [0.75,0,0], [0,Math.PI/2,0], pod);

  const fanHub = mesh(new THREE.CylinderGeometry(0.16, 0.16, 1.63, 16), mat.steel, [0,0,0], [0,0,Math.PI/2], pod);
  for (let i = 0; i < 7; i++) {
    const a = i * Math.PI * 2 / 7;
    const blade = mesh(new THREE.BoxGeometry(0.045, 0.42, 0.13), mat.dark, [-0.78, Math.sin(a)*0.25, Math.cos(a)*0.25], [a,0,0], pod);
    blade.rotation.x = a;
  }

  mesh(new THREE.CircleGeometry(0.54, 32), new THREE.MeshBasicMaterial({
    color: 0xff168f, transparent: true, opacity: 0.12, side: THREE.DoubleSide
  }), [-0.79,0,0], [0,-Math.PI/2,0], pod);

  for (const x of [-0.74, 0.74]) {
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4;
      bolt([x, Math.sin(a)*0.62, Math.cos(a)*0.62], [0,0,Math.PI/2], pod, 0.72);
    }
  }
  return pod;
}
thrustPod(-0.92);
thrustPod(0.92);

tube([[-1.2,1.54,-0.52],[-0.7,1.08,-0.92],[-0.1,0.86,-0.92]],0.11,mat.dark);
tube([[-1.2,1.54,0.52],[-0.7,1.08,0.92],[-0.1,0.86,0.92]],0.11,mat.dark);
tube([[1.1,1.72,-0.5],[0.8,1.08,-0.92],[0.4,0.86,-0.92]],0.09,mat.dark);
tube([[1.1,1.72,0.5],[0.8,1.08,0.92],[0.4,0.86,0.92]],0.09,mat.dark);

for (let i = 0; i < 5; i++) {
  const z = -0.42 + i * 0.18;
  const colors = [mat.pink, mat.cyan, mat.copper, mat.rubber, mat.pink];
  tube([
    [-1.95,1.55,z],[-2.5,1.26,z*1.25],[-2.05,0.9,z*1.65],[-1.2,0.76,z*2.0]
  ],0.027,colors[i],bike,32);
}

const armor = roundedBox(1.65, 0.75, 0.09, 0.08, mat.armor, [-0.82, 1.22, 1.36], [0.03, -0.08, -0.15]);
armor.geometry.translate(0, 0, 0);
for (const x of [-1.48, -0.17]) {
  for (const y of [0.94, 1.47]) bolt([x, y, 1.42], [Math.PI/2,0,0], bike, 0.9);
}
decalGlyph(bike, [-0.82, 1.23, 1.417], [0.03, 0, -0.15], 'X//13', '#a81855', 0.72);

tube([[1.45,2.03,-0.35],[2.0,2.58,-0.42],[2.48,2.82,-0.48]],0.09,mat.steel);
tube([[1.45,2.03,0.35],[2.0,2.58,0.42],[2.48,2.82,0.48]],0.09,mat.steel);
tube([[2.25,2.75,-0.85],[2.46,2.82,0],[2.25,2.75,0.85]],0.065,mat.black);

for (const z of [-0.88, 0.88]) {
  roundedBox(0.38,0.15,0.48,0.07,mat.rubber,[2.24,2.75,z],[0,0,-0.04]);
  mesh(new THREE.CylinderGeometry(0.06,0.06,0.12,12),mat.pink,[2.2,2.81,z],[Math.PI/2,0,0]);
}

const holo = new THREE.Group();
holo.position.set(2.08, 3.15, 0);
holo.rotation.z = -0.14;
bike.add(holo);
mesh(new THREE.BoxGeometry(0.055,0.68,1.12),mat.green,[0,0,0],[0,0,0],holo);
mesh(new THREE.BoxGeometry(0.065,0.03,1.22),mat.green,[0,0.37,0],[0,0,0],holo);
mesh(new THREE.BoxGeometry(0.065,0.03,1.22),mat.green,[0,-0.37,0],[0,0,0],holo);
for (let i = 0; i < 4; i++) {
  mesh(new THREE.BoxGeometry(0.07,0.025,0.12 + i*0.06),mat.green,[0.035,-0.22+i*0.14,-0.32+i*0.2],[0,0,0],holo);
}

mesh(new THREE.BoxGeometry(0.1,0.26,0.74),mat.black,[2.3,2.42,0],[0,0,-0.15]);
mesh(new THREE.BoxGeometry(0.04,0.13,0.52),mat.cyan,[2.37,2.44,0],[0,0,-0.15]);

const fins = [
  [-2.35,1.82,-0.58,-0.35],[-2.35,1.82,0.58,0.35],
  [0.6,1.25,-1.38,-0.18],[0.6,1.25,1.38,0.18]
];
for (const [x,y,z,ry] of fins) {
  const fin = mesh(new THREE.ConeGeometry(0.34,1.05,3),mat.carbon,[x,y,z],[Math.PI/2,ry,Math.PI/2]);
  fin.scale.z = 0.22;
}

for (const z of [-0.5, 0.5]) {
  tube([[-1.25,1.95,z],[-1.8,2.15,z],[-2.15,2.0,z]],0.025,mat.copper);
  for (let i=0;i<3;i++) {
    mesh(new THREE.TorusGeometry(0.08,0.015,6,12),mat.steel,[-1.62-i*0.15,2.1,z],[Math.PI/2,0,0]);
  }
}

const hoverGlow = new THREE.Mesh(
  new THREE.CircleGeometry(2.5,64),
  new THREE.MeshBasicMaterial({ color:0xff087f, transparent:true, opacity:0.09, depthWrite:false })
);
hoverGlow.rotation.x = -Math.PI/2;
hoverGlow.position.y = 0.08;
scene.add(hoverGlow);

const dustGeo = new THREE.BufferGeometry();
const dustPos = [];
for (let i=0;i<180;i++) {
  const a = Math.random()*Math.PI*2;
  const r = 4 + Math.random()*9;
  dustPos.push(Math.cos(a)*r, 0.08+Math.random()*4.5, Math.sin(a)*r);
}
dustGeo.setAttribute('position',new THREE.Float32BufferAttribute(dustPos,3));
const dust = new THREE.Points(dustGeo,new THREE.PointsMaterial({
  color:0x5d68a0,size:0.025,transparent:true,opacity:0.46,depthWrite:false
}));
scene.add(dust);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  bike.position.y = 1.05 + Math.sin(t * 1.25) * 0.045;
  bike.rotation.z = Math.sin(t * 0.72) * 0.008;
  holo.visible = Math.sin(t * 19) > -0.88;
  hoverGlow.material.opacity = 0.075 + Math.sin(t * 2.4) * 0.018;
  pinkLight.intensity = 28 + Math.sin(t * 3.1) * 3;
  dust.rotation.y = t * 0.015;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
