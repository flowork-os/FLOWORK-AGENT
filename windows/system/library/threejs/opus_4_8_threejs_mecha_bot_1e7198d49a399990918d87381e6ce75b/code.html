<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mecha Unit — Procedural three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15161a; }
  #app { position: fixed; inset: 0; }
  .hud {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #7f8794; letter-spacing: .08em; text-transform: uppercase;
    user-select: none; pointer-events: none;
  }
  .hud b { color: #cfe0ff; }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud"><b>MK-IV "BULWARK"</b> · procedural mecha unit · drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------- Renderer */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

/* ------------------------------------------------------------------- Scene */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15161a);
scene.fog = new THREE.Fog(0x15161a, 16, 38);

// Studio image-based lighting for believable hard-surface metal
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ Camera */
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.4, 3.6, 7.0);

/* ---------------------------------------------------------------- Controls */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.target.set(0, 2.55, 0);
controls.minDistance = 4.5;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI * 0.52;

/* ------------------------------------------------------------------ Lights */
scene.add(new THREE.HemisphereLight(0x9fb4d6, 0x1a1b22, 0.55));

const key = new THREE.DirectionalLight(0xfff2e2, 2.5);
key.position.set(6.5, 10.5, 6.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 32;
key.shadow.camera.left = -7;  key.shadow.camera.right = 7;
key.shadow.camera.top = 8;    key.shadow.camera.bottom = -1;
key.shadow.bias = -0.0004;
key.shadow.radius = 3;
scene.add(key);

const fill = new THREE.DirectionalLight(0x7fa8ff, 0.55);
fill.position.set(-7, 4.5, 3.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xc4d8ff, 1.7);
rim.position.set(-4.5, 6.5, -8.5);
scene.add(rim);

/* -------------------------------------------------------------- Ground pad */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 64),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* --------------------------------------------------------- Hazard texture */
function makeHazardTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#f2bf0c';
  g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#1b1b1e';
  g.save();
  g.translate(64, 64); g.rotate(Math.PI / 4); g.translate(-64, -64);
  for (let x = -160; x < 260; x += 44) g.fillRect(x, -160, 22, 448);
  g.restore();
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1.6, 1.6);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* -------------------------------------------------------------- Materials */
const matGrey     = new THREE.MeshStandardMaterial({ color: 0x969ca6, metalness: 0.95, roughness: 0.4 });
const matGreyDark = new THREE.MeshStandardMaterial({ color: 0x565c66, metalness: 0.92, roughness: 0.46 });
const matDark     = new THREE.MeshStandardMaterial({ color: 0x22252b, metalness: 0.7,  roughness: 0.55 });
const matHazard   = new THREE.MeshStandardMaterial({ map: makeHazardTexture(), metalness: 0.35, roughness: 0.6 });
const matBlue     = new THREE.MeshStandardMaterial({ color: 0x08152c, metalness: 0.4, roughness: 0.3, emissive: 0x2f7bff, emissiveIntensity: 2.3 });
const matVisor    = new THREE.MeshStandardMaterial({ color: 0x03131f, metalness: 0.4, roughness: 0.25, emissive: 0x39ccff, emissiveIntensity: 2.5 });
const matCore     = new THREE.MeshStandardMaterial({ color: 0x062a4d, metalness: 0.25, roughness: 0.2, emissive: 0x33a2ff, emissiveIntensity: 3.0 });

/* -------------------------------------------------------------- Robot root */
const robot = new THREE.Group();
scene.add(robot);

function box(w, h, d, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  robot.add(m);
  return m;
}
function cyl(rt, rb, h, mat, x, y, z, seg = 24) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  robot.add(m);
  return m;
}
function sph(r, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 24, 18), mat);
  m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  robot.add(m);
  return m;
}

/* ------------------------------------------------------------------- Legs */
function buildLeg(side) {
  const x = 0.52 * side;

  // Big foot
  box(1.0, 0.30, 1.55, matDark,     x, 0.15, 0.18);
  box(1.0, 0.14, 1.55, matGrey,     x, 0.32, 0.18);
  box(0.9, 0.16, 0.34, matHazard,   x, 0.24, 0.98);   // toe hazard cap
  box(0.42,0.12, 0.30, matBlue,     x, 0.30, -0.55);  // heel light

  // Ankle joint
  box(0.42, 0.42, 0.52, matDark,    x, 0.56, 0.04);

  // Shin / lower leg
  box(0.72, 0.92, 0.74, matGrey,    x, 1.06, 0);
  box(0.52, 0.72, 0.22, matGreyDark,x, 1.02, 0.44);   // front greave
  box(0.44, 0.10, 0.05, matBlue,    x, 1.20, 0.56);   // shin light

  // Knee
  const knee = cyl(0.30, 0.30, 0.76, matDark, x, 1.56, 0.02, 22);
  knee.rotation.z = Math.PI / 2;
  box(0.34, 0.30, 0.24, matGreyDark, x, 1.60, 0.30);  // kneecap

  // Thigh
  box(0.78, 0.86, 0.76, matGrey,    x, 2.06, 0);
  box(0.24, 0.62, 0.80, matHazard,  x + 0.42 * side, 2.06, 0);   // outer hazard stripe
  box(0.44, 0.12, 0.05, matBlue,    x, 2.30, 0.42);
}
buildLeg(-1);
buildLeg(1);

/* ------------------------------------------------------------ Pelvis/waist */
box(1.48, 0.55, 0.86, matGreyDark, 0, 2.60, 0);
sph(0.28, matDark,  0.54, 2.55, 0);
sph(0.28, matDark, -0.54, 2.55, 0);
box(0.56, 0.42, 0.42, matHazard, 0, 2.52, 0.34);        // crotch guard
box(1.06, 0.50, 0.76, matDark,   0, 2.94, 0);           // abdomen
box(1.02, 0.20, 0.80, matHazard, 0, 2.78, 0.02);        // hazard belt

/* ------------------------------------------------------------------ Torso */
box(1.98, 1.18, 1.02, matGrey, 0, 3.72, 0);             // main chest block

const chestL = box(0.82, 0.72, 0.42, matGreyDark, -0.56, 4.02, 0.42);
chestL.rotation.x = -0.18;
const chestR = box(0.82, 0.72, 0.42, matGreyDark,  0.56, 4.02, 0.42);
chestR.rotation.x = -0.18;
box(1.62, 0.18, 0.06, matHazard, 0, 4.24, 0.50);        // upper hazard trim
box(0.16, 0.52, 0.10, matBlue,  0.72, 3.68, 0.50);      // chest vent lights
box(0.16, 0.52, 0.10, matBlue, -0.72, 3.68, 0.50);

// Reactor core
const coreRing = new THREE.Mesh(new THREE.TorusGeometry(0.30, 0.08, 18, 36), matGreyDark);
coreRing.position.set(0, 3.68, 0.51);
coreRing.castShadow = true; robot.add(coreRing);
cyl(0.30, 0.30, 0.12, matDark, 0, 3.68, 0.44, 28).rotation.x = Math.PI / 2;
const coreGlow = sph(0.24, matCore, 0, 3.68, 0.52);

const coreLight = new THREE.PointLight(0x3aa2ff, 2.2, 5.5, 2.0);
coreLight.position.set(0, 3.68, 0.7);
robot.add(coreLight);

// Collar / neck base + shoulder connectors
box(0.72, 0.32, 0.64, matDark, 0, 4.30, 0);
box(0.52, 0.42, 0.52, matDark,  0.98, 3.96, 0);
box(0.52, 0.42, 0.52, matDark, -0.98, 3.96, 0);

/* ---------------------------------------------------------- Backpack / jets */
box(1.12, 1.02, 0.46, matGreyDark, 0, 3.82, -0.70);
box(0.92, 0.30, 0.20, matHazard,   0, 4.18, -0.74);
for (const s of [-1, 1]) {
  const noz = cyl(0.17, 0.24, 0.52, matDark, 0.38 * s, 3.18, -0.82, 20);
  noz.rotation.x = 0.30;
  const inner = cyl(0.11, 0.11, 0.14, matBlue, 0.38 * s, 3.02, -0.90, 16);
  inner.rotation.x = 0.30;
}

/* -------------------------------------------------------------------- Arms */
function buildArm(side) {
  const x = 1.16 * side;

  // Shoulder ball + layered pauldrons
  sph(0.34, matDark, x, 4.02, 0);
  const p1 = box(0.98, 0.62, 1.18, matGrey,     x + 0.16 * side, 4.16, 0);
  const p2 = box(0.82, 0.30, 1.02, matGreyDark, x + 0.20 * side, 4.50, 0);
  p1.rotation.z = -0.15 * side;
  p2.rotation.z = -0.15 * side;
  box(0.86, 0.34, 0.20, matHazard, x + 0.16 * side, 4.10, 0.52);   // pauldron hazard
  box(0.14, 0.40, 0.16, matBlue,   x + 0.56 * side, 4.16, 0);      // shoulder light

  // Upper arm
  box(0.50, 0.86, 0.52, matDark, x, 3.46, 0);

  // Elbow
  const el = cyl(0.24, 0.24, 0.56, matDark, x, 3.00, 0, 18);
  el.rotation.z = Math.PI / 2;

  // Forearm
  box(0.58, 0.92, 0.58, matGrey,     x, 2.54, 0);
  box(0.22, 0.60, 0.60, matHazard,   x - 0.32 * side, 2.54, 0);
  box(0.46, 0.10, 0.05, matBlue,     x, 2.74, 0.32);

  // Wrist + fist
  cyl(0.20, 0.20, 0.20, matDark, x, 2.04, 0, 16);
  box(0.60, 0.52, 0.64, matGreyDark, x, 1.74, 0.02);   // fist
  box(0.62, 0.20, 0.66, matDark,     x, 1.92, 0.04);   // knuckle ridge
  box(0.62, 0.16, 0.20, matHazard,   x, 1.58, 0.34);   // finger fronts
}
buildArm(-1);
buildArm(1);

/* -------------------------------------------------------------------- Head */
cyl(0.20, 0.20, 0.30, matDark, 0, 4.52, 0, 16);         // neck
box(0.74, 0.44, 0.66, matGrey, 0, 4.80, 0);             // head base

const dome = new THREE.Mesh(
  new THREE.SphereGeometry(0.40, 30, 20, 0, Math.PI * 2, 0, Math.PI * 0.55),
  matGrey
);
dome.position.set(0, 5.00, 0);
dome.castShadow = true; robot.add(dome);

box(0.62, 0.16, 0.14, matVisor, 0, 4.82, 0.30);         // glowing visor
box(0.50, 0.10, 0.10, matHazard, 0, 4.62, 0.30);        // chin vent
box(0.12, 0.30, 0.32, matDark,  0.44, 4.80, 0);         // ear pods
box(0.12, 0.30, 0.32, matDark, -0.44, 4.80, 0);
box(0.08, 0.10, 0.10, matBlue,  0.50, 4.80, 0.06);
box(0.08, 0.10, 0.10, matBlue, -0.50, 4.80, 0.06);

// Antenna
const ant = cyl(0.028, 0.028, 0.58, matGrey, 0.30, 5.34, -0.06, 10);
ant.rotation.z = -0.16;
sph(0.055, matBlue, 0.235, 5.62, -0.06);

/* --------------------------------------------------------- Center the unit */
robot.updateWorldMatrix(true, true);
const bbox = new THREE.Box3().setFromObject(robot);
const center = bbox.getCenter(new THREE.Vector3());
robot.position.x -= center.x;       // center horizontally over the pad
robot.position.z -= center.z;

/* ----------------------------------------------------------------- Resize */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

/* -------------------------------------------------------------- Animation */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Reactor + emissive pulse
  matCore.emissiveIntensity  = 2.7 + Math.sin(t * 2.2) * 0.9;
  coreLight.intensity        = 2.0 + Math.sin(t * 2.2) * 0.8;
  matBlue.emissiveIntensity  = 2.1 + Math.sin(t * 3.0 + 1.0) * 0.5;
  matVisor.emissiveIntensity = 2.4 + Math.sin(t * 1.5) * 0.35;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
