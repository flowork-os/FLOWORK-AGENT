<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dune Field</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#f3e7cf}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3e7cf);
scene.fog = new THREE.Fog(0xf3e7cf, 55, 130);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 300);
camera.position.set(16, 10, 20);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.maxPolarAngle = 1.45;
controls.minDistance = 8;
controls.maxDistance = 60;

// seeded random
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---- dune height field (smooth ridges + fine wind ripples) ----
const dune = (x, z) =>
  0.9 * (1.5 * Math.sin(x * 0.075 + Math.sin(z * 0.06) * 1.4) +
         1.0 * Math.sin(x * 0.05 - z * 0.055 + 2.1) +
         0.45 * Math.sin(x * 0.16 + z * 0.13 + 0.5) +
         0.25 * Math.sin(z * 0.21 - x * 0.09));
const ripple = (x, z) =>
  0.05 * Math.sin((x + 1.1 * Math.sin(z * 0.35) + 0.4 * Math.sin(z * 0.9)) * 2.2) +
  0.02 * Math.sin(x * 4.1 + z * 1.3);
const H = (x, z) => dune(x, z) + ripple(x, z);

const field = new THREE.Group();
scene.add(field);

// ---- sand ----
const geo = new THREE.PlaneGeometry(90, 90, 300, 300);
geo.rotateX(-Math.PI / 2);
const pos = geo.attributes.position;
for (let i = 0; i < pos.count; i++) pos.setY(i, H(pos.getX(i), pos.getZ(i)));
geo.computeVertexNormals();

// micro-ripple bump texture
const cv = document.createElement('canvas'); cv.width = cv.height = 256;
const cx = cv.getContext('2d');
const im = cx.createImageData(256, 256);
for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
  const v = 128 + 80 * Math.sin(x * 0.35 + 3 * Math.sin(y * 0.05)) + 28 * Math.sin(y * 0.3 + x * 0.1);
  const i = (y * 256 + x) * 4;
  im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255;
}
cx.putImageData(im, 0, 0);
const bump = new THREE.CanvasTexture(cv);
bump.wrapS = bump.wrapT = THREE.RepeatWrapping;
bump.repeat.set(16, 16);

const sand = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
  color: 0xdcb887, roughness: 0.96, metalness: 0, bumpMap: bump, bumpScale: 0.35
}));
sand.receiveShadow = true;
sand.castShadow = true;
field.add(sand);

// ---- materials ----
const wood = new THREE.MeshStandardMaterial({ color: 0x8f7354, roughness: 0.9 });
const woodDark = new THREE.MeshStandardMaterial({ color: 0x6e563e, roughness: 0.95 });

// ---- fence posts with wire ----
const fence = new THREE.Group();
const postGeo = new THREE.CylinderGeometry(0.05, 0.068, 1.25, 7);
const tops = [];
for (let i = 0; i <= 13; i++) {
  const x = -19 + i * 3;
  const z = -5.5 + Math.sin(x * 0.12) * 3.2;
  const y = H(x, z);
  const p = new THREE.Mesh(postGeo, woodDark);
  p.position.set(x, y + 0.55, z);
  p.rotation.set((rnd() - 0.5) * 0.16, rnd() * 6.28, (rnd() - 0.5) * 0.16);
  p.castShadow = true;
  fence.add(p);
  tops.push(new THREE.Vector3(x, y + 1.05, z));
}
const wireMat = new THREE.LineBasicMaterial({ color: 0x55483a, transparent: true, opacity: 0.85 });
for (const dy of [0, -0.28, -0.56]) {
  const pts = tops.map(v => new THREE.Vector3(v.x, v.y + dy, v.z));
  const curve = new THREE.CatmullRomCurve3(pts);
  fence.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(220)), wireMat));
}
field.add(fence);

// ---- boardwalk ----
const walk = new THREE.Group();
const a = new THREE.Vector3(-9, 0, 7.5), b = new THREE.Vector3(9.5, 0, 1.5);
const dir = b.clone().sub(a); const len = dir.length(); dir.normalize();
const yaw = Math.atan2(dir.x, dir.z);
const perp = new THREE.Vector3(dir.z, 0, -dir.x);
const plankGeo = new THREE.BoxGeometry(1.7, 0.07, 0.42);
const legGeo = new THREE.BoxGeometry(0.09, 1, 0.09);
const n = Math.floor(len / 0.52);
for (let i = 0; i <= n; i++) {
  const p = a.clone().addScaledVector(dir, i * 0.52);
  const y = dune(p.x, p.z) + 0.34;
  const dh = dune(p.x + dir.x * 0.5, p.z + dir.z * 0.5) - dune(p.x - dir.x * 0.5, p.z - dir.z * 0.5);
  const m = new THREE.Mesh(plankGeo, wood);
  m.rotation.order = 'YXZ';
  m.position.set(p.x, y + (rnd() - 0.5) * 0.012, p.z);
  m.rotation.y = yaw + (rnd() - 0.5) * 0.03;
  m.rotation.x = -Math.atan2(dh, 1);
  m.castShadow = m.receiveShadow = true;
  walk.add(m);
  if (i % 5 === 0) for (const off of [-0.62, 0.62]) {
    const q = p.clone().addScaledVector(perp, off);
    const gy = H(q.x, q.z);
    const h = Math.max(0.25, y - gy + 0.1);
    const leg = new THREE.Mesh(legGeo, woodDark);
    leg.scale.y = h;
    leg.position.set(q.x, gy + h / 2 - 0.06, q.z);
    leg.castShadow = true;
    walk.add(leg);
  }
}
field.add(walk);

// ---- lighting ----
scene.add(new THREE.HemisphereLight(0xfdf3e0, 0xc79f6b, 0.55));
const sun = new THREE.DirectionalLight(0xffe4b8, 2.3);
sun.position.set(-22, 26, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 5, far: 90 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.08;
sun.shadow.radius = 4;
scene.add(sun);
scene.add(new THREE.DirectionalLight(0xcfe0f0, 0.25).position.set(18, 12, -20).clone() && new THREE.AmbientLight(0xfff2dd, 0.12));

// ---- loop ----
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
