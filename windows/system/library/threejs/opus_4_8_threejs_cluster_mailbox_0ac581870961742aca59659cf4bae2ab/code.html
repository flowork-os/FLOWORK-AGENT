<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cluster Mailbox Unit — three.js</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #16181b; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: rgba(220,226,232,0.55); user-select: none; pointer-events: none;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">Cluster Mailbox Unit — drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------------------
   Renderer
--------------------------------------------------------------------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

/* ---------------------------------------------------------------------------
   Scene & camera
--------------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16181b);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.4, 1.55, 2.9);

// Subtle interior environment so the metal reflects something (avoids black metals)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------------------------------------------------------------------------
   Controls
--------------------------------------------------------------------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.target.set(0, 1.0, 0);
controls.minDistance = 1.6;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.53;
controls.update();

/* ---------------------------------------------------------------------------
   Lighting: hemisphere + key/fill/rim
--------------------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0xbcc6d0, 0x202226, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(3.2, 4.8, 3.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 20;
key.shadow.camera.left = -2.2;
key.shadow.camera.right = 2.2;
key.shadow.camera.top = 3.0;
key.shadow.camera.bottom = -0.6;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0xdbe6f2, 0.55);
fill.position.set(-3.5, 2.2, 1.8);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xa9bccf, 0.85);
rim.position.set(-1.8, 3.2, -3.6);
scene.add(rim);

/* ---------------------------------------------------------------------------
   Ground plane (shadow-catcher only)
--------------------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------------
   Materials — postal grey palette
--------------------------------------------------------------------------- */
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x84878c, metalness: 0.55, roughness: 0.55, envMapIntensity: 1.0 });
const trimMat = new THREE.MeshStandardMaterial({ color: 0x74777c, metalness: 0.6, roughness: 0.5 });
const backingMat = new THREE.MeshStandardMaterial({ color: 0x33363a, metalness: 0.4, roughness: 0.75 });
const doorMat = new THREE.MeshStandardMaterial({ color: 0x9a9da2, metalness: 0.6, roughness: 0.42, envMapIntensity: 1.0 });
const parcelDoorMat = new THREE.MeshStandardMaterial({ color: 0x8e9196, metalness: 0.6, roughness: 0.44 });
const lockMat = new THREE.MeshStandardMaterial({ color: 0x2a2b2d, metalness: 0.95, roughness: 0.3 });
const escutcheonMat = new THREE.MeshStandardMaterial({ color: 0xb8bbbf, metalness: 0.85, roughness: 0.32 });
const handleMat = new THREE.MeshStandardMaterial({ color: 0xc7cacd, metalness: 0.9, roughness: 0.28 });
const cardMat = new THREE.MeshStandardMaterial({ color: 0xe9e9e5, metalness: 0.0, roughness: 0.92 });
const hingeMat = new THREE.MeshStandardMaterial({ color: 0x54575b, metalness: 0.5, roughness: 0.6 });
const pedestalMat = new THREE.MeshStandardMaterial({ color: 0x6c6f73, metalness: 0.55, roughness: 0.55 });
const hoodMat = new THREE.MeshStandardMaterial({ color: 0x7c7f84, metalness: 0.55, roughness: 0.5 });

/* ---------------------------------------------------------------------------
   Dimensions (metres)
--------------------------------------------------------------------------- */
const W = 0.90, H = 1.10, D = 0.40;   // cabinet body
const pedestalTopY = 0.45;            // bottom of cabinet above ground
const cabinetCenterY = pedestalTopY + H / 2; // 1.0

const marginX = 0.03;
const usableW = W - 2 * marginX;      // 0.84
const areaLeft = -usableW / 2;        // -0.42

const topUsable = H / 2 - 0.03;       // 0.52
const botUsable = -(H / 2 - 0.03);    // -0.52
const parcelSectionH = 0.34;
const sectionGap = 0.03;

const smallTop = topUsable;                              // 0.52
const smallBot = botUsable + parcelSectionH + sectionGap; // -0.15
const parcelTop = smallBot - sectionGap;                 // -0.18
const parcelBot = botUsable;                             // -0.52

const COLS = 5, ROWS = 6;
const cellW = usableW / COLS;
const cellH = (smallTop - smallBot) / ROWS;
const doorW = cellW - 0.012;
const doorH = cellH - 0.012;

const frontZ = D / 2;                 // 0.20
const smallDoorCenterZ = 0.235;       // door front ~0.25
const parcelDoorCenterZ = 0.2325;     // door front ~0.25

/* ---------------------------------------------------------------------------
   Root group
--------------------------------------------------------------------------- */
const unit = new THREE.Group();
scene.add(unit);

/* ----- Pedestal ----- */
const pedestal = new THREE.Group();
unit.add(pedestal);

const basePlate = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.05, 0.42), pedestalMat);
basePlate.position.y = 0.025;
basePlate.castShadow = true; basePlate.receiveShadow = true;
pedestal.add(basePlate);

const column = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.43, 0.26), pedestalMat);
column.position.y = 0.05 + 0.43 / 2;
column.castShadow = true; column.receiveShadow = true;
pedestal.add(column);

/* ----- Cabinet ----- */
const cabinet = new THREE.Group();
cabinet.position.y = cabinetCenterY;
unit.add(cabinet);

const body = new THREE.Mesh(new THREE.BoxGeometry(W, H, D), bodyMat);
body.castShadow = true; body.receiveShadow = true;
cabinet.add(body);

// top & bottom trim caps
const topCap = new THREE.Mesh(new THREE.BoxGeometry(W + 0.02, 0.03, D + 0.02), trimMat);
topCap.position.y = H / 2;
topCap.castShadow = true; topCap.receiveShadow = true;
cabinet.add(topCap);

const bottomCap = new THREE.Mesh(new THREE.BoxGeometry(W + 0.02, 0.03, D + 0.02), trimMat);
bottomCap.position.y = -H / 2;
bottomCap.castShadow = true; bottomCap.receiveShadow = true;
cabinet.add(bottomCap);

// dark recessed backing behind the doors (creates seam shadows)
const backing = new THREE.Mesh(new THREE.BoxGeometry(usableW + 0.02, H - 0.04, 0.02), backingMat);
backing.position.set(0, 0, frontZ + 0.01);
backing.receiveShadow = true;
cabinet.add(backing);

/* ---------------------------------------------------------------------------
   Reusable door part geometries
--------------------------------------------------------------------------- */
const smallPanelGeo = new THREE.BoxGeometry(doorW, doorH, 0.03);
const smallCardGeo  = new THREE.BoxGeometry(doorW * 0.6, doorH * 0.24, 0.004);
const smallEscGeo   = new THREE.BoxGeometry(0.028, 0.028, 0.006);
const smallLockGeo  = new THREE.CylinderGeometry(0.007, 0.007, 0.016, 16);
const smallHingeGeo = new THREE.BoxGeometry(0.006, doorH * 0.9, 0.01);

function makeSmallDoor() {
  const g = new THREE.Group();

  const panel = new THREE.Mesh(smallPanelGeo, doorMat);
  panel.castShadow = true; panel.receiveShadow = true;
  g.add(panel);

  // hinge strip (left edge)
  const hinge = new THREE.Mesh(smallHingeGeo, hingeMat);
  hinge.position.set(-doorW * 0.46, 0, 0.012);
  g.add(hinge);

  // tenant name card holder near the top
  const card = new THREE.Mesh(smallCardGeo, cardMat);
  card.position.set(0, doorH * 0.24, 0.0165);
  g.add(card);

  // lock escutcheon + knob/handle (right side)
  const esc = new THREE.Mesh(smallEscGeo, escutcheonMat);
  esc.position.set(doorW * 0.30, -doorH * 0.14, 0.016);
  g.add(esc);

  const lock = new THREE.Mesh(smallLockGeo, lockMat);
  lock.rotation.x = Math.PI / 2;
  lock.position.set(doorW * 0.30, -doorH * 0.14, 0.026);
  lock.castShadow = true;
  g.add(lock);

  return g;
}

// build the grid of small compartment doors
for (let r = 0; r < ROWS; r++) {
  for (let c = 0; c < COLS; c++) {
    const x = areaLeft + cellW * (c + 0.5);
    const y = smallTop - cellH * (r + 0.5);
    const door = makeSmallDoor();
    door.position.set(x, y, smallDoorCenterZ);
    cabinet.add(door);
  }
}

/* ----- Parcel lockers (two larger doors below) ----- */
const parcelW = usableW / 2 - 0.02;      // 0.40
const parcelH = (parcelTop - parcelBot) - 0.02; // 0.32
const parcelPanelGeo = new THREE.BoxGeometry(parcelW, parcelH, 0.035);
const parcelLabelGeo = new THREE.BoxGeometry(parcelW * 0.5, parcelH * 0.16, 0.004);
const parcelHingeGeo = new THREE.BoxGeometry(0.008, parcelH * 0.94, 0.012);
const parcelBarGeo = new THREE.CylinderGeometry(0.012, 0.012, 0.16, 18);
const parcelPostGeo = new THREE.BoxGeometry(0.02, 0.02, 0.03);
const parcelLockGeo = new THREE.CylinderGeometry(0.01, 0.01, 0.02, 18);

function makeParcelDoor() {
  const g = new THREE.Group();

  const panel = new THREE.Mesh(parcelPanelGeo, parcelDoorMat);
  panel.castShadow = true; panel.receiveShadow = true;
  g.add(panel);

  // hinge strip (left edge)
  const hinge = new THREE.Mesh(parcelHingeGeo, hingeMat);
  hinge.position.set(-parcelW * 0.46, 0, 0.015);
  g.add(hinge);

  // placard / label plate
  const label = new THREE.Mesh(parcelLabelGeo, cardMat);
  label.position.set(0, parcelH * 0.30, 0.020);
  g.add(label);

  // vertical pull handle (right side) on two stand-off posts
  const bar = new THREE.Mesh(parcelBarGeo, handleMat);
  bar.position.set(parcelW * 0.36, -parcelH * 0.02, 0.052);
  bar.castShadow = true;
  g.add(bar);

  const postTop = new THREE.Mesh(parcelPostGeo, handleMat);
  postTop.position.set(parcelW * 0.36, -parcelH * 0.02 + 0.075, 0.033);
  g.add(postTop);

  const postBot = new THREE.Mesh(parcelPostGeo, handleMat);
  postBot.position.set(parcelW * 0.36, -parcelH * 0.02 - 0.075, 0.033);
  g.add(postBot);

  // lock below the handle
  const lock = new THREE.Mesh(parcelLockGeo, lockMat);
  lock.rotation.x = Math.PI / 2;
  lock.position.set(parcelW * 0.36, -parcelH * 0.32, 0.028);
  lock.castShadow = true;
  g.add(lock);

  return g;
}

const parcelCenterY = (parcelTop + parcelBot) / 2;
for (let c = 0; c < 2; c++) {
  const x = areaLeft + (usableW / 2) * (c + 0.5);
  const door = makeParcelDoor();
  door.position.set(x, parcelCenterY, parcelDoorCenterZ);
  cabinet.add(door);
}

/* ---------------------------------------------------------------------------
   Peaked rain hood (gable roof, extruded triangular prism)
--------------------------------------------------------------------------- */
const hoodWidth = W + 0.12;   // spans left-right
const hoodDepth = D + 0.16;   // front-back overhang
const peakH = 0.16;

const hoodShape = new THREE.Shape();
hoodShape.moveTo(-hoodDepth / 2, 0);
hoodShape.lineTo(hoodDepth / 2, 0);
hoodShape.lineTo(0, peakH);
hoodShape.lineTo(-hoodDepth / 2, 0);

const hoodGeo = new THREE.ExtrudeGeometry(hoodShape, { depth: hoodWidth, bevelEnabled: false });
hoodGeo.translate(0, 0, -hoodWidth / 2); // centre along the ridge

const hood = new THREE.Mesh(hoodGeo, hoodMat);
hood.rotation.y = -Math.PI / 2;          // ridge now runs left-right (along X)
hood.position.set(0, H / 2 + 0.015, 0);
hood.castShadow = true; hood.receiveShadow = true;
cabinet.add(hood);

/* ---------------------------------------------------------------------------
   Animation loop
--------------------------------------------------------------------------- */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ---------------------------------------------------------------------------
   Resize handling
--------------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
