<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artist's Loft Studio</title>
<style>
  html,body{margin:0;overflow:hidden;background:#9db6c5}
  canvas{display:block}
  #caption{position:fixed;left:20px;bottom:18px;color:#fff8e5;font:12px/1.4 Georgia,serif;letter-spacing:.12em;text-shadow:0 2px 5px #392b25;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="caption">ATELIER · MORNING LIGHT</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaec7d2);
scene.fog = new THREE.FogExp2(0xb5c3bd, 0.018);

const camera = new THREE.PerspectiveCamera(44, innerWidth / innerHeight, 0.1, 100);
camera.position.set(10.5, 7.2, 13.5);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;
controls.minDistance = 7;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.49;

let seed = 48271;
const rnd = () => {
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
};
const range = (a,b) => a + (b-a)*rnd();
const pick = a => a[Math.floor(rnd()*a.length)];

const texCanvas = (w,h,draw) => {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  draw(x,w,h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
};

const plasterTex = texCanvas(512,512,(x,w,h)=>{
  x.fillStyle='#d3c5ad'; x.fillRect(0,0,w,h);
  for(let i=0;i<1800;i++){
    const a=range(.015,.10), v=Math.floor(range(150,235));
    x.fillStyle=`rgba(${v},${v-7},${v-18},${a})`;
    x.fillRect(rnd()*w,rnd()*h,range(1,8),range(1,4));
  }
});
plasterTex.repeat.set(5,3);

const woodTex = texCanvas(512,512,(x,w,h)=>{
  x.fillStyle='#77513a'; x.fillRect(0,0,w,h);
  for(let i=0;i<130;i++){
    const y=rnd()*h;
    x.strokeStyle=`rgba(${range(35,100)},${range(18,55)},${range(7,30)},.34)`;
    x.lineWidth=range(.3,2.4); x.beginPath();
    x.moveTo(0,y);
    for(let q=0;q<w;q+=22) x.lineTo(q,y+Math.sin(q*.035+i)*range(-3,3));
    x.stroke();
  }
  for(let i=0;i<90;i++){
    x.fillStyle='rgba(45,20,10,.18)';
    x.beginPath();x.ellipse(rnd()*w,rnd()*h,range(2,11),range(1,3),rnd()*3,0,7);x.fill();
  }
});
woodTex.repeat.set(3,1);

const floorTex = texCanvas(1024,1024,(x,w,h)=>{
  x.fillStyle='#9d7354';x.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=85){
    x.fillStyle='rgba(65,37,24,.46)';x.fillRect(0,y,w,4);
    for(let k=0;k<100;k++){
      x.fillStyle='rgba(245,214,164,.06)';
      x.fillRect(rnd()*w,y+rnd()*80,range(1,30),range(.3,1.5));
    }
  }
  for(let i=0;i<300;i++){
    x.fillStyle=`rgba(${range(45,110)},${range(20,65)},${range(10,45)},.10)`;
    x.fillRect(rnd()*w,rnd()*h,range(2,15),range(1,3));
  }
});
floorTex.repeat.set(4,4);

const brickTex = texCanvas(1024,512,(x,w,h)=>{
  x.fillStyle='#b36c55';x.fillRect(0,0,w,h);
  const bw=118,bh=49;
  for(let row=0;row<12;row++){
    for(let col=-1;col<11;col++){
      const ox=(row%2?bw*.5:0)+col*bw, oy=row*bh;
      const r=Math.floor(range(130,190)), g=Math.floor(range(62,104)), b=Math.floor(range(48,75));
      x.fillStyle=`rgb(${r},${g},${b})`;
      x.fillRect(ox+3,oy+3,bw-6,bh-6);
      x.fillStyle='rgba(255,210,170,.12)';
      x.fillRect(ox+5,oy+5,bw-10,3);
      for(let s=0;s<7;s++){
        x.fillStyle='rgba(60,24,18,.12)';
        x.fillRect(ox+rnd()*bw,oy+rnd()*bh,range(2,10),range(1,3));
      }
    }
  }
});
brickTex.repeat.set(3.5,2);

const canvasTex = texCanvas(640,800,(x,w,h)=>{
  x.fillStyle='#e7d8b6';x.fillRect(0,0,w,h);
  for(let i=0;i<2700;i++){
    x.fillStyle=`rgba(103,77,48,${range(.01,.06)})`;
    x.fillRect(rnd()*w,rnd()*h,range(1,4),range(1,4));
  }
  x.globalAlpha=.9;
  const strokes=[
    ['#315e75',45,70,540,300,32],['#e59250',95,220,560,340,40],
    ['#d95442',75,490,515,440,33],['#f1c76d',85,100,440,600,22],
    ['#406d5d',370,90,495,700,36],['#f8dfab',105,365,545,210,18]
  ];
  for(const [c,x1,y1,x2,y2,l] of strokes){
    x.strokeStyle=c;x.lineWidth=l;x.lineCap='round';x.beginPath();
    x.moveTo(x1,y1);
    x.bezierCurveTo((x1+x2)/2+range(-100,100),y1+range(-80,80),(x1+x2)/2+range(-100,100),y2+range(-80,80),x2,y2);
    x.stroke();
  }
  x.globalAlpha=.38;
  for(let i=0;i<45;i++){
    x.fillStyle=pick(['#cd5343','#285a70','#e3a453','#f4d77f','#51806a']);
    x.fillRect(range(50,w-50),range(45,h-45),range(5,45),range(3,15));
  }
});
const paintingTex = new THREE.CanvasTexture(canvasTex.image);
paintingTex.colorSpace = THREE.SRGBColorSpace;

const mat = {
  wood:new THREE.MeshStandardMaterial({map:woodTex,color:0xffffff,roughness:.72}),
  darkWood:new THREE.MeshStandardMaterial({color:0x4b2d20,roughness:.75}),
  metal:new THREE.MeshStandardMaterial({color:0x313b3e,roughness:.38,metalness:.78}),
  brass:new THREE.MeshStandardMaterial({color:0xa87939,roughness:.34,metalness:.8}),
  plaster:new THREE.MeshStandardMaterial({map:plasterTex,color:0xffffff,roughness:.96}),
  brick:new THREE.MeshStandardMaterial({map:brickTex,roughness:.9}),
  glass:new THREE.MeshPhysicalMaterial({color:0x9dcde3,transparent:true,opacity:.36,roughness:.08,metalness:.08,transmission:.12,side:THREE.DoubleSide}),
  linen:new THREE.MeshStandardMaterial({color:0xe5d2ac,roughness:.92,side:THREE.DoubleSide}),
  clay:new THREE.MeshStandardMaterial({color:0xad7051,roughness:.91}),
  white:new THREE.MeshStandardMaterial({color:0xf2e3c6,roughness:.8}),
  black:new THREE.MeshStandardMaterial({color:0x252527,roughness:.65})
};

function mesh(geo, material, x=0,y=0,z=0, cast=true){
  const m=new THREE.Mesh(geo,material);
  m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;
  scene.add(m);return m;
}
function box(w,h,d,material,x=0,y=0,z=0){
  return mesh(new THREE.BoxGeometry(w,h,d),material,x,y,z);
}
function cyl(rt,rb,h,material,x=0,y=0,z=0,seg=12){
  return mesh(new THREE.CylinderGeometry(rt,rb,h,seg),material,x,y,z);
}
function group(){const g=new THREE.Group();scene.add(g);return g;}
function addBox(g,w,h,d,m,x,y,z,rx=0,ry=0,rz=0){
  const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  o.position.set(x,y,z);o.rotation.set(rx,ry,rz);o.castShadow=o.receiveShadow=true;g.add(o);return o;
}
function addCyl(g,a,b,h,m,x,y,z,rx=0,ry=0,rz=0){
  const o=new THREE.Mesh(new THREE.CylinderGeometry(a,b,h,12),m);
  o.position.set(x,y,z);o.rotation.set(rx,ry,rz);o.castShadow=o.receiveShadow=true;g.add(o);return o;
}

const floor = mesh(new THREE.PlaneGeometry(22,19),new THREE.MeshStandardMaterial({map:floorTex,roughness:.78}),0,0,0,false);
floor.rotation.x=-Math.PI/2;
const backWall=box(18,8.5,.28,mat.brick,0,4.25,-6.2);
const leftWall=box(.25,8.5,12,mat.plaster,-8.9,4.25,-.4);
const ceiling=box(18,.2,12,mat.plaster,0,8.45,-.4);

for(let i=0;i<6;i++) box(.18,.26,12,mat.darkWood,-7.4+i*2.9,8.06,-.4);

const windows=group();
for(let k=0;k<3;k++){
  const x=-4.6+k*3.35;
  addBox(windows,2.72,4.25,.13,mat.glass,x,5.48,-6.02);
  addBox(windows,2.92,.16,.22,mat.metal,x,7.62,-5.88);
  addBox(windows,2.92,.16,.22,mat.metal,x,3.34,-5.88);
  addBox(windows,.16,4.43,.22,mat.metal,x-1.38,5.48,-5.88);
  addBox(windows,.16,4.43,.22,mat.metal,x+1.38,5.48,-5.88);
  addBox(windows,.1,4.2,.12,mat.metal,x,5.48,-5.82);
  addBox(windows,2.74,.1,.12,mat.metal,x,5.48,-5.82);
}
const sill=box(10.3,.18,.46,mat.darkWood,-1.25,3.23,-5.73);

const skylight=group();
addBox(skylight,5.2,.09,3.1,mat.glass,1.4,8.31,-1.3);
for(let i=-2;i<=2;i++)addBox(skylight,.1,.15,3.35,mat.metal,1.4+i*1.03,8.24,-1.3);
for(let i=-1;i<=1;i++)addBox(skylight,5.4,.15,.1,mat.metal,1.4,8.24,-1.3+i*1.05);

const beam=box(15,.36,.46,mat.darkWood,0,7.63,.8);
const drapes=[];
function drape(x,z,color){
  const g=group();
  const geo=new THREE.PlaneGeometry(2.15,4.25,16,20);
  const p=geo.attributes.position;
  for(let i=0;i<p.count;i++){
    const px=p.getX(i), py=p.getY(i);
    p.setZ(i,Math.sin(px*5.2)*.13+Math.sin(py*3)*.055);
  }
  geo.computeVertexNormals();
  const fabric=new THREE.MeshStandardMaterial({color,roughness:.92,side:THREE.DoubleSide});
  const cloth=new THREE.Mesh(geo,fabric);
  cloth.position.set(x,5.43,z);cloth.castShadow=true;cloth.receiveShadow=true;g.add(cloth);
  addCyl(g,.055,.055,2.3,mat.brass,x,7.62,z,0,0,Math.PI/2);
  for(let n=-.85;n<.9;n+=.34)addCyl(g,.055,.055,.12,mat.brass,x+n,7.62,z,0,0,0);
  drapes.push({g,phase:rnd()*6});
}
drape(-3.0,.98,0xb45e4d);
drape(-.6,.98,0xd9ad71);
drape(3.0,.98,0x6e8990);

const easel=group();
easel.position.set(.6,0,1.05);
function eBox(w,h,d,m,x,y,z,r=0){return addBox(easel,w,h,d,m,x,y,z,0,0,r);}
eBox(.22,5.7,.24,mat.wood,-1.18,3.0,0,.13);
eBox(.22,5.7,.24,mat.wood,1.18,3.0,0,-.13);
eBox(.22,4.1,.24,mat.wood,0,2.9,.86,0);
eBox(2.75,.18,.3,mat.darkWood,0,4.38,.08,0);
eBox(2.55,.18,.42,mat.wood,0,1.43,.18,0);
eBox(.16,1.1,.16,mat.wood,-1.18,.56,0,.39);
eBox(.16,1.1,.16,mat.wood,1.18,.56,0,-.39);
const frame=addBox(easel,3.16,4.12,.13,mat.darkWood,0,3.38,.12);
const painting=addBox(easel,2.9,3.85,.09,new THREE.MeshStandardMaterial({map:paintingTex,roughness:.86}),0,3.38,.22);
addBox(easel,.16,4.15,.18,mat.wood,-1.53,3.38,.21);
addBox(easel,.16,4.15,.18,mat.wood,1.53,3.38,.21);
addBox(easel,3.18,.16,.18,mat.wood,0,5.45,.21);
addBox(easel,3.18,.16,.18,mat.wood,0,1.31,.21);

const palette=mesh(new THREE.SphereGeometry(.55,18,12),new THREE.MeshStandardMaterial({color:0xbd7a42,roughness:.75}),2.2,1.36,1.25);
palette.scale.set(1.24,.15,.87);
const thumbHole=mesh(new THREE.TorusGeometry(.12,.055,8,16),mat.darkWood,2.52,1.46,1.17);
thumbHole.rotation.x=Math.PI/2;
for(const [a,c] of [[0,'#d64d42'],[1.2,'#edc152'],[2.1,'#356278'],[3,'#e8d5a5'],[4.1,'#508162']]){
  const p=mesh(new THREE.SphereGeometry(.11,10,8),new THREE.MeshStandardMaterial({color:c,roughness:.58}),2.2+Math.cos(a)*.42,1.48,1.25+Math.sin(a)*.28);
  p.scale.y=.28;
}

const cart=group();
cart.position.set(4.7,0,1.05);
addBox(cart,2.15,.16,1.3,mat.metal,0,2.45,0);
addBox(cart,1.92,.12,1.12,mat.darkWood,0,1.55,0);
addBox(cart,1.92,.12,1.12,mat.darkWood,0,.72,0);
for(const x of [-.88,.88])for(const z of [-.48,.48]){
  addCyl(cart,.08,.08,2.3,mat.metal,x,1.15,z);
  const wheel=new THREE.Mesh(new THREE.TorusGeometry(.17,.055,8,14),mat.black);
  wheel.position.set(x,.18,z);wheel.rotation.y=Math.PI/2;cart.add(wheel);
}
for(let i=0;i<7;i++){
  const x=range(-.67,.67),z=range(-.37,.37);
  addCyl(cart,.065,.08,range(.18,.34),new THREE.MeshStandardMaterial({color:pick([0xd84339,0xe3b64d,0x3e7890,0xe5d7b4]),roughness:.55}),x,2.65,z);
  addCyl(cart,.035,.035,.12,mat.metal,x,2.86,z);
}
for(let i=0;i<11;i++){
  const brush=new THREE.Group();
  const x=range(-.8,.8),z=range(-.42,.42),h=range(.65,1.0);
  addCyl(brush,.022,.028,h,new THREE.MeshStandardMaterial({color:pick([0x6a3422,0xa46131,0x36241e]),roughness:.58}),0,h/2,0,0,0,range(-.35,.35));
  addCyl(brush,.04,.025,.24,new THREE.MeshStandardMaterial({color:0xd9c19b,roughness:.8}),0,h+.06,0,0,0,range(-.35,.35));
  brush.position.set(x,2.58,z);cart.add(brush);
}

const stack=group();
stack.position.set(-5.7,0,-5.28);
for(let i=0;i<4;i++){
  const w=range(1.25,2.25),h=range(1.8,3.0);
  const g=new THREE.Group();
  const fr=new THREE.Mesh(new THREE.BoxGeometry(w+.15,h+.15,.11),mat.darkWood);
  const art=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({color:pick([0xd9bf8e,0x8b9d91,0xc77b5e]),roughness:.88}));
  art.position.z=.064;g.add(fr,art);
  g.position.set(i*.5-.4,h/2,-i*.07);g.rotation.y=range(-.15,.15);g.rotation.z=range(-.08,.08);
  g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});stack.add(g);
}

const stand=group();
stand.position.set(-3.8,0,.9);
addCyl(stand,.72,.82,.22,mat.darkWood,0,.16,0);
addCyl(stand,.18,.25,2.3,mat.wood,0,1.3,0);
addBox(stand,1.45,.18,1.45,mat.darkWood,0,2.5,0);
const bust=group();stand.add(bust);
addCyl(bust,.34,.43,.72,mat.clay,0,2.96,0);
const head=new THREE.Mesh(new THREE.SphereGeometry(.46,22,16),mat.clay);
head.position.set(0,3.55,0);head.scale.set(.84,1.12,.8);head.castShadow=true;bust.add(head);
const nose=new THREE.Mesh(new THREE.ConeGeometry(.1,.24,8),mat.clay);
nose.position.set(0,3.55,.39);nose.rotation.x=Math.PI/2;bust.add(nose);
for(const x of [-.18,.18]){
  const eye=new THREE.Mesh(new THREE.SphereGeometry(.045,8,6),mat.darkWood);
  eye.position.set(x,3.64,.34);bust.add(eye);
}
const neck=addCyl(bust,.22,.27,.42,mat.clay,0,3.05,0);
const shoulder=new THREE.Mesh(new THREE.SphereGeometry(.65,16,10),mat.clay);
shoulder.position.set(0,2.84,0);shoulder.scale.set(1,.42,.62);shoulder.castShadow=true;bust.add(shoulder);

const ladder=group();
ladder.position.set(6.05,0,-4.95);ladder.rotation.z=-.16;
for(const x of [-.43,.43])addBox(ladder,.14,5.1,.15,mat.wood,x,2.55,0);
for(let y=.65;y<4.8;y+=.63)addBox(ladder,1.0,.11,.15,mat.wood,0,y,0);
ladder.rotation.y=-.1;

const stool=group();
stool.position.set(2.8,0,-.75);
addCyl(stool,.54,.49,.17,mat.wood,0,2.05,0);
for(let i=0;i<3;i++){
  const a=i*Math.PI*2/3;
  const leg=addCyl(stool,.07,.1,1.9,mat.darkWood,Math.cos(a)*.32,1.04,Math.sin(a)*.32);
  leg.rotation.z=Math.cos(a)*.18;leg.rotation.x=-Math.sin(a)*.18;
}
addCyl(stool,.12,.12,.55,mat.metal,0,1.66,0);

const paintColors=[0xd94638,0xf1b94d,0x36708d,0xe4e0c9,0x577c55,0x593e87];
for(let i=0;i<115;i++){
  const x=range(-6.5,6.7),z=range(-4.4,4.5);
  if(Math.hypot(x-.6,z-1.05)<1.2)continue;
  const drop=mesh(new THREE.CircleGeometry(range(.025,.12),10),new THREE.MeshStandardMaterial({color:pick(paintColors),roughness:.4}),x,.012,z,false);
  drop.rotation.x=-Math.PI/2;drop.scale.y=range(.35,1.4);
}
for(let i=0;i<8;i++){
  const tube=group();
  tube.position.set(range(-1.2,1.5),.08,range(2.5,4.3));
  tube.rotation.set(range(-.2,.2),range(0,6),range(-.2,.2));
  addCyl(tube,.085,.11,.44,new THREE.MeshStandardMaterial({color:pick(paintColors),roughness:.5}),0,.22,0);
  addCyl(tube,.055,.055,.09,mat.metal,0,.49,0);
}

const lamp=group();
lamp.position.set(4.5,7.5,1.2);
addCyl(lamp,.022,.022,1.15,mat.metal,0,-.58,0);
const shade=new THREE.Mesh(new THREE.ConeGeometry(.58,.38,24,1,true),new THREE.MeshStandardMaterial({color:0xc47e43,side:THREE.DoubleSide,roughness:.55}));
shade.position.y=-1.25;shade.rotation.x=Math.PI;shade.castShadow=true;lamp.add(shade);
const bulb=new THREE.Mesh(new THREE.SphereGeometry(.18,12,8),new THREE.MeshStandardMaterial({color:0xffd47b,emissive:0xffaa3d,emissiveIntensity:1.2}));
bulb.position.y=-1.16;lamp.add(bulb);

const dustGeo=new THREE.BufferGeometry();
const dustN=260, dustPos=new Float32Array(dustN*3);
for(let i=0;i<dustN;i++){
  dustPos[i*3]=range(-7.8,7.8);dustPos[i*3+1]=range(.2,7.7);dustPos[i*3+2]=range(-5.5,4.8);
}
dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));
const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xffefd0,size:.032,transparent:true,opacity:.55,depthWrite:false}));
scene.add(dust);

const hemi=new THREE.HemisphereLight(0xc2e7f6,0x6f4630,1.8);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffedc4,4.0);
sun.position.set(-5.5,10,2.5);sun.target.position.set(0,0,-1);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-9;sun.shadow.camera.right=9;sun.shadow.camera.top=9;sun.shadow.camera.bottom=-9;
sun.shadow.bias=-.00035;scene.add(sun);scene.add(sun.target);
const windowGlow=new THREE.SpotLight(0xffdfa0,450,15,Math.PI*.25,.55,1.2);
windowGlow.position.set(-2.2,7,-5.0);windowGlow.target.position.set(.2,0,1.2);
windowGlow.castShadow=true;windowGlow.shadow.mapSize.set(1024,1024);scene.add(windowGlow,windowGlow.target);
const lampLight=new THREE.PointLight(0xffb153,22,6,2);
lampLight.position.set(4.5,6.1,1.2);lampLight.castShadow=true;scene.add(lampLight);

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  drapes.forEach((d,i)=>{
    d.g.rotation.y=Math.sin(t*.55+d.phase)*.045;
    d.g.position.z=Math.sin(t*.7+d.phase)*.055;
  });
  lamp.rotation.z=Math.sin(t*.72)*.07;
  lampLight.intensity=21+Math.sin(t*2.3)*1.5;
  dust.rotation.y=t*.012;
  const a=dust.geometry.attributes.position.array;
  for(let i=1;i<a.length;i+=3)a[i]+=(Math.sin(t*.7+i)*.000035);
  dust.geometry.attributes.position.needsUpdate=true;
  bust.rotation.y=Math.sin(t*.23)*.045;
  controls.update();
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
animate();
</script>
