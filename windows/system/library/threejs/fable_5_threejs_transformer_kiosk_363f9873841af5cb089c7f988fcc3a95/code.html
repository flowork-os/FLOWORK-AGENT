<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pad-Mounted Transformer Kiosk</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#10151a}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x10151a);
scene.fog=new THREE.Fog(0x10151a,9,20);
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;

const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,100);
camera.position.set(3.4,2.1,4.3);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.72,0);
controls.enableDamping=true;controls.dampingFactor=0.06;
controls.autoRotate=true;controls.autoRotateSpeed=1.1;
controls.minDistance=2.2;controls.maxDistance=10;controls.maxPolarAngle=1.52;

scene.add(new THREE.HemisphereLight(0xbfd4e2,0x2c3128,0.3));
const key=new THREE.DirectionalLight(0xfff0dd,1.9);
key.position.set(4.2,6,3.2);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=key.shadow.camera.bottom=-2.6;
key.shadow.camera.right=key.shadow.camera.top=2.6;
key.shadow.camera.near=1;key.shadow.camera.far=18;
key.shadow.bias=-0.0004;key.shadow.radius=4;
scene.add(key);
const fill=new THREE.DirectionalLight(0x8fa6bd,0.4);
fill.position.set(-5,3,-4);scene.add(fill);

const M={
 green:new THREE.MeshStandardMaterial({color:0x3f5b46,roughness:0.48,metalness:0.28}),
 greenDark:new THREE.MeshStandardMaterial({color:0x2b4033,roughness:0.58,metalness:0.22}),
 seam:new THREE.MeshStandardMaterial({color:0x18231b,roughness:0.85}),
 concrete:new THREE.MeshStandardMaterial({color:0x9b9c93,roughness:0.96}),
 steel:new THREE.MeshStandardMaterial({color:0x9aa1a6,roughness:0.35,metalness:0.85}),
 iron:new THREE.MeshStandardMaterial({color:0x4c5257,roughness:0.45,metalness:0.7}),
 galv:new THREE.MeshStandardMaterial({color:0xaab1b5,roughness:0.4,metalness:0.8}),
 ceramic:new THREE.MeshStandardMaterial({color:0xd9dfda,roughness:0.28}),
 face:new THREE.MeshStandardMaterial({color:0xf4f2ea,roughness:0.6}),
 glass:new THREE.MeshPhysicalMaterial({color:0xffffff,roughness:0.08,metalness:0,transmission:0.92,thickness:0.03,ior:1.4})
};

const K=new THREE.Group();scene.add(K);
function B(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;K.add(o);return o;}
function shadowed(o){o.castShadow=o.receiveShadow=true;return o;}

// concrete pad + cabinet shell
B(2.3,0.14,1.8,M.concrete,0,0.07,0);
B(1.8,1.15,1.25,M.green,0,0.715,0);          // cabinet body
B(1.86,0.07,1.31,M.greenDark,0,0.175,0);      // base skirt
B(1.88,0.05,1.34,M.green,0,1.315,0);          // roof cap
B(1.82,0.03,1.29,M.greenDark,0,1.278,0);      // drip lip
// panel seams
B(1.66,0.94,0.03,M.seam,0,0.715,0.62);        // front door recess
B(1.74,0.012,0.008,M.seam,0,1.21,0.627);      // front horizontal seam
B(1.5,0.85,0.02,M.greenDark,0,0.7,-0.626);    // rear panel line
for(const s of[-1,1])for(const z of[-0.3,0.3])B(0.006,0.98,0.012,M.seam,0.901*s,0.72,z);
// doors
for(const s of[-1,1])B(0.79,0.9,0.035,M.green,0.415*s,0.715,0.645);
// hinges
for(const s of[-1,1])for(const y of[0.42,0.715,1.01]){
 const h=shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.013,0.013,0.1,12),M.iron));
 h.position.set(0.8*s,y,0.667);K.add(h);
}
// handles + padlock hasp
for(const s of[-1,1])B(0.03,0.16,0.026,M.steel,0.1*s,0.72,0.678);
B(0.08,0.2,0.018,M.iron,0,0.72,0.668);
const bolt=shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,0.026,5),M.steel));
bolt.rotation.x=Math.PI/2;bolt.position.set(0,0.78,0.681);K.add(bolt);
const loop=shadowed(new THREE.Mesh(new THREE.TorusGeometry(0.022,0.006,10,24),M.steel));
loop.position.set(0,0.66,0.681);K.add(loop);

// louvered vents
function louverBank(w,rows){
 const g=new THREE.Group();
 const fr=shadowed(new THREE.Mesh(new THREE.BoxGeometry(w+0.07,rows*0.05+0.07,0.014),M.greenDark));
 fr.position.z=0.002;g.add(fr);
 for(let i=0;i<rows;i++){
  const sl=shadowed(new THREE.Mesh(new THREE.BoxGeometry(w,0.012,0.05),M.green));
  sl.rotation.x=-0.8;sl.position.set(0,(i-(rows-1)/2)*0.05,0.018);g.add(sl);
 }
 return g;
}
for(const s of[-1,1]){
 const v=louverBank(0.55,6);v.position.set(0.415*s,0.46,0.664);K.add(v);
 const sv=louverBank(0.5,5);sv.rotation.y=s*Math.PI/2;sv.position.set(0.903*s,0.95,-0.1);K.add(sv);
}

// warning + nameplate textures
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}
const warnTex=canvasTex(256,180,g=>{
 g.fillStyle='#f2c500';g.fillRect(0,0,256,180);
 g.strokeStyle='#141414';g.lineWidth=10;g.strokeRect(6,6,244,168);
 g.fillStyle='#b3261e';g.fillRect(16,16,224,52);
 g.fillStyle='#fff';g.font='bold 36px Arial';g.textAlign='center';g.textBaseline='middle';
 g.fillText('DANGER',128,43);
 g.fillStyle='#141414';g.font='bold 25px Arial';
 g.fillText('HIGH VOLTAGE',128,102);g.fillText('KEEP OUT',128,140);
});
const plateTex=canvasTex(256,160,g=>{
 g.fillStyle='#c9cdc9';g.fillRect(0,0,256,160);
 g.strokeStyle='#6a6f6a';g.lineWidth=6;g.strokeRect(4,4,248,152);
 g.fillStyle='#2b2f2b';g.font='bold 20px Arial';g.textAlign='center';
 g.fillText('PADMOUNT TRANSFORMER',128,32);
 g.font='14px Arial';g.textAlign='left';
 ['KVA 750    3 PH  60 Hz','HV 13800 V    LV 400/230 V','SERIAL PMT-2216-07','OIL FR3    MASS 2140 kg'].forEach((t,i)=>g.fillText(t,18,62+i*24));
});
const warn=new THREE.Mesh(new THREE.PlaneGeometry(0.24,0.17),new THREE.MeshStandardMaterial({map:warnTex,roughness:0.55}));
warn.position.set(-0.415,0.98,0.6641);K.add(warn);
const plate=new THREE.Mesh(new THREE.PlaneGeometry(0.19,0.12),new THREE.MeshStandardMaterial({map:plateTex,roughness:0.45,metalness:0.3}));
plate.position.set(0.415,0.74,0.6641);K.add(plate);

// meter
const meter=new THREE.Group();meter.position.set(0.415,0.98,0.664);K.add(meter);
const rim=shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.09,0.06,28),M.galv));
rim.rotation.x=Math.PI/2;rim.position.z=0.02;meter.add(rim);
const mf=new THREE.Mesh(new THREE.CircleGeometry(0.068,28),M.face);mf.position.z=0.051;meter.add(mf);
const reg=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.024,0.006),M.seam);reg.position.set(0,0.014,0.053);meter.add(reg);
const needle=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.004,0.003),new THREE.MeshStandardMaterial({color:0xb3261e}));
needle.position.set(0,-0.022,0.054);needle.rotation.z=0.5;meter.add(needle);
const dome=new THREE.Mesh(new THREE.SphereGeometry(0.082,28,14,0,Math.PI*2,0,Math.PI/2),M.glass);
dome.rotation.x=Math.PI/2;dome.scale.z=0.65;dome.position.z=0.05;meter.add(dome);

// bushings on roof
function bushing(x,z){
 const g=new THREE.Group();g.position.set(x,1.34,z);K.add(g);
 const add=(geo,m,y)=>{const o=shadowed(new THREE.Mesh(geo,m));o.position.y=y;g.add(o);return o;};
 add(new THREE.CylinderGeometry(0.065,0.078,0.05,24),M.galv,0.025);
 add(new THREE.CylinderGeometry(0.034,0.034,0.3,20),M.ceramic,0.2);
 for(let i=0;i<4;i++)add(new THREE.SphereGeometry(0.058,24,12),M.ceramic,0.115+i*0.062).scale.y=0.42;
 add(new THREE.CylinderGeometry(0.02,0.026,0.05,16),M.ceramic,0.38);
 add(new THREE.CylinderGeometry(0.009,0.009,0.09,12),M.steel,0.43);
 add(new THREE.SphereGeometry(0.017,12,8),M.steel,0.478);
}
bushing(-0.45,-0.32);bushing(0,-0.32);bushing(0.45,-0.32);

// conduit stubs on the pad
function conduit(x,z,h){
 const c=shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.034,0.034,h,16),M.galv));
 c.position.set(x,0.14+h/2,z);K.add(c);
 const cp=shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.044,0.044,0.05,16),M.galv));
 cp.position.set(x,0.14+h-0.02,z);K.add(cp);
}
conduit(1.02,-0.22,0.42);conduit(1.02,0.08,0.34);conduit(-1.02,-0.1,0.38);

// ground
const ground=new THREE.Mesh(new THREE.CircleGeometry(9,64),new THREE.MeshStandardMaterial({color:0x191f22,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script>
</body>
</html>
