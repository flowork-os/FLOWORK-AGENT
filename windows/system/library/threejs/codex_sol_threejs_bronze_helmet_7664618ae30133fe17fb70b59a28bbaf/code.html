<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bronze Age Helmet</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171916;
    }
    canvas { display: block; }
    .caption {
      position: fixed;
      left: 24px;
      bottom: 20px;
      color: rgba(231, 220, 190, 0.72);
      font: 11px/1.5 Georgia, serif;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 1px 5px #000;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="caption">Patinated Bronze · Late Bronze Age</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x171916);
    scene.fog = new THREE.Fog(0x171916, 8, 16);

    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 50);
    camera.position.set(4.7, 2.8, 6.7);
    camera.lookAt(0, 0.35, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.32, -0.12);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.enablePan = false;
    controls.minDistance = 4.5;
    controls.maxDistance = 11;
    controls.maxPolarAngle = Math.PI * 0.76;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;

    const bronzeMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      vertexColors: true,
      metalness: 0.82,
      roughness: 0.47
    });

    const edgeMaterial = new THREE.MeshStandardMaterial({
      color: 0x745129,
      metalness: 0.86,
      roughness: 0.39
    });

    const darkBronzeMaterial = new THREE.MeshStandardMaterial({
      color: 0x362b1d,
      metalness: 0.62,
      roughness: 0.72,
      side: THREE.BackSide
    });

    const patinaMaterial = new THREE.MeshStandardMaterial({
      color: 0x315e4e,
      metalness: 0.42,
      roughness: 0.82
    });

    const helmet = new THREE.Group();
    helmet.rotation.y = -0.12;
    helmet.position.y = 0.32;
    scene.add(helmet);

    const bronzeBase = new THREE.Color(0x8d6835);
    const bronzeLight = new THREE.Color(0xba8b48);
    const bronzeDark = new THREE.Color(0x493c28);
    const verdigris = new THREE.Color(0x376b59);

    function angleDifference(a, b) {
      return Math.atan2(Math.sin(a - b), Math.cos(a - b));
    }

    function shellGeometry(rx, ry, rz, inner = false) {
      const radialSegments = 96;
      const verticalSegments = 44;
      const thetaMax = 1.47;
      const positions = [];
      const colors = [];
      const indices = [];
      const dents = [
        { theta: 0.64, phi: 0.88, size: 0.115, depth: 0.035 },
        { theta: 0.92, phi: 2.68, size: 0.15, depth: 0.045 },
        { theta: 0.47, phi: 4.15, size: 0.11, depth: 0.028 },
        { theta: 1.12, phi: 5.55, size: 0.14, depth: 0.038 }
      ];

      for (let iy = 0; iy <= verticalSegments; iy++) {
        const theta = thetaMax * iy / verticalSegments;
        const st = Math.sin(theta);
        const ct = Math.cos(theta);

        for (let ix = 0; ix <= radialSegments; ix++) {
          const phi = Math.PI * 2 * ix / radialSegments;
          let dentAmount = 0;

          if (!inner) {
            for (const dent of dents) {
              const dt = theta - dent.theta;
              const dp = angleDifference(phi, dent.phi) * Math.max(0.35, Math.sin(theta));
              const distanceSquared = dt * dt + dp * dp;
              dentAmount += dent.depth * Math.exp(-distanceSquared / (2 * dent.size * dent.size));
            }
          }

          const irregularity = inner ? 0 : (
            Math.sin(phi * 7 + theta * 13) * 0.0035 +
            Math.sin(phi * 17 - theta * 9) * 0.0018
          );
          const scale = 1 - dentAmount + irregularity;
          const x = rx * st * Math.cos(phi) * scale;
          const y = 0.48 + ry * ct * scale;
          const z = rz * st * Math.sin(phi) * scale;
          positions.push(x, y, z);

          const variation =
            0.5 +
            0.25 * Math.sin(phi * 5.7 + theta * 8.1) +
            0.18 * Math.sin(phi * 13.2 - theta * 4.6);
          const corrosion =
            Math.max(0, Math.sin(phi * 3.1 + theta * 11.3) - 0.72) *
            Math.max(0.15, Math.sin(theta));

          const color = bronzeBase.clone();
          color.lerp(variation > 0.56 ? bronzeLight : bronzeDark, Math.abs(variation - 0.5) * 0.33);
          if (dentAmount > 0.008) color.lerp(bronzeDark, Math.min(0.65, dentAmount * 11));
          color.lerp(verdigris, Math.min(0.46, corrosion * 0.48));
          colors.push(color.r, color.g, color.b);
        }
      }

      for (let iy = 0; iy < verticalSegments; iy++) {
        for (let ix = 0; ix < radialSegments; ix++) {
          const a = iy * (radialSegments + 1) + ix;
          const b = a + radialSegments + 1;
          const c = b + 1;
          const d = a + 1;
          indices.push(a, b, d, b, c, d);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    const dome = new THREE.Mesh(shellGeometry(1.42, 1.61, 1.54), bronzeMaterial);
    dome.castShadow = true;
    dome.receiveShadow = true;
    helmet.add(dome);

    const innerDome = new THREE.Mesh(
      shellGeometry(1.33, 1.50, 1.45, true),
      darkBronzeMaterial
    );
    innerDome.position.y = 0.005;
    helmet.add(innerDome);

    class EllipseCurve3 extends THREE.Curve {
      getPoint(t, target = new THREE.Vector3()) {
        const angle = t * Math.PI * 2;
        return target.set(
          1.41 * Math.cos(angle),
          0.505 + 0.018 * Math.sin(angle * 2),
          1.53 * Math.sin(angle)
        );
      }
    }

    const rimGeometry = new THREE.TubeGeometry(new EllipseCurve3(), 128, 0.075, 9, true);
    const rim = new THREE.Mesh(rimGeometry, edgeMaterial);
    rim.castShadow = true;
    helmet.add(rim);

    function createRidgeGeometry() {
      const sections = 32;
      const positions = [];
      const indices = [];
      const colors = [];

      for (let i = 0; i <= sections; i++) {
        const t = i / sections;
        const z = THREE.MathUtils.lerp(-1.34, 1.34, t);
        const normalized = z / 1.54;
        const domeY = 0.48 + 1.61 * Math.sqrt(Math.max(0, 1 - normalized * normalized));
        const taper = Math.sin(Math.PI * t);
        const halfWidth = 0.055 + 0.075 * taper;
        const height = 0.07 + 0.22 * Math.pow(taper, 0.7);

        positions.push(
          -halfWidth, domeY - 0.005, z,
           halfWidth, domeY - 0.005, z,
           0, domeY + height, z
        );

        const c1 = bronzeBase.clone().lerp(bronzeLight, 0.18 + 0.15 * taper);
        const c2 = bronzeBase.clone().lerp(bronzeDark, 0.12);
        colors.push(
          c2.r, c2.g, c2.b,
          c1.r, c1.g, c1.b,
          c1.r, c1.g, c1.b
        );
      }

      for (let i = 0; i < sections; i++) {
        const a = i * 3;
        const b = a + 3;
        indices.push(
          a, b, a + 2,
          b, b + 2, a + 2,
          a + 2, b + 2, a + 1,
          a + 1, b + 2, b + 1,
          a + 1, b + 1, a,
          a, b + 1, b
        );
      }

      indices.push(0, 2, 1);
      const end = sections * 3;
      indices.push(end, end + 1, end + 2);

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    const ridge = new THREE.Mesh(createRidgeGeometry(), bronzeMaterial);
    ridge.castShadow = true;
    ridge.receiveShadow = true;
    helmet.add(ridge);

    function createNeckGuardGeometry() {
      const widthSegments = 32;
      const depthSegments = 16;
      const positions = [];
      const colors = [];
      const indices = [];
      const row = widthSegments + 1;

      for (let side = 0; side < 2; side++) {
        for (let j = 0; j <= depthSegments; j++) {
          const v = j / depthSegments;
          const halfWidth = 1.18 + 0.38 * v;
          for (let i = 0; i <= widthSegments; i++) {
            const u = i / widthSegments * 2 - 1;
            const x = u * halfWidth;
            const arch = 0.10 * (1 - u * u);
            const y = 0.51 - 0.73 * v - 0.20 * v * v + arch - side * 0.09;
            const z = -1.25 - 0.93 * v + 0.10 * u * u;
            positions.push(x, y, z);

            const mottling = 0.5 + 0.5 * Math.sin(u * 16 + v * 21);
            const color = bronzeBase.clone().lerp(
              mottling > 0.67 ? verdigris : bronzeDark,
              mottling > 0.67 ? 0.22 : 0.11
            );
            colors.push(color.r, color.g, color.b);
          }
        }
      }

      const layerSize = row * (depthSegments + 1);
      for (let side = 0; side < 2; side++) {
        const offset = side * layerSize;
        for (let j = 0; j < depthSegments; j++) {
          for (let i = 0; i < widthSegments; i++) {
            const a = offset + j * row + i;
            const b = a + row;
            if (side === 0) {
              indices.push(a, b, a + 1, b, b + 1, a + 1);
            } else {
              indices.push(a, a + 1, b, b, a + 1, b + 1);
            }
          }
        }
      }

      function connectBoundary(topA, topB) {
        const bottomA = topA + layerSize;
        const bottomB = topB + layerSize;
        indices.push(topA, bottomA, topB, topB, bottomA, bottomB);
      }

      for (let i = 0; i < widthSegments; i++) {
        connectBoundary(i, i + 1);
        const far = depthSegments * row;
        connectBoundary(far + i + 1, far + i);
      }
      for (let j = 0; j < depthSegments; j++) {
        connectBoundary(j * row, (j + 1) * row);
        connectBoundary((j + 1) * row + widthSegments, j * row + widthSegments);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    const neckGuard = new THREE.Mesh(createNeckGuardGeometry(), bronzeMaterial);
    neckGuard.castShadow = true;
    neckGuard.receiveShadow = true;
    helmet.add(neckGuard);

    const cheekShape = new THREE.Shape();
    cheekShape.moveTo(-0.12, 0.40);
    cheekShape.bezierCurveTo(-0.38, 0.39, -0.72, 0.34, -0.93, 0.19);
    cheekShape.bezierCurveTo(-1.08, 0.02, -1.01, -0.30, -0.82, -0.61);
    cheekShape.lineTo(-0.48, -1.13);
    cheekShape.bezierCurveTo(-0.33, -1.34, -0.06, -1.28, 0.01, -1.02);
    cheekShape.bezierCurveTo(0.06, -0.72, -0.05, -0.34, -0.02, -0.08);
    cheekShape.lineTo(-0.12, 0.40);

    const cheekGeometry = new THREE.ExtrudeGeometry(cheekShape, {
      depth: 0.115,
      bevelEnabled: true,
      bevelSegments: 3,
      bevelSize: 0.035,
      bevelThickness: 0.025,
      curveSegments: 16
    });
    cheekGeometry.rotateY(Math.PI / 2);
    cheekGeometry.computeVertexNormals();

    const rightCheek = new THREE.Mesh(cheekGeometry, edgeMaterial);
    rightCheek.position.set(1.29, 0.01, 0);
    rightCheek.rotation.z = -0.055;
    rightCheek.castShadow = true;
    rightCheek.receiveShadow = true;
    helmet.add(rightCheek);

    const leftCheek = rightCheek.clone();
    leftCheek.position.x = -1.29;
    leftCheek.scale.x = -1;
    leftCheek.rotation.z = 0.055;
    helmet.add(leftCheek);

    const rivetGeometry = new THREE.SphereGeometry(0.085, 20, 12);
    const rivetPositions = [
      [1.35, 0.27, 0.27], [-1.35, 0.27, 0.27],
      [1.34, -0.28, 0.72], [-1.34, -0.28, 0.72],
      [1.30, 0.46, -0.56], [-1.30, 0.46, -0.56],
      [1.04, 0.32, -1.28], [-1.04, 0.32, -1.28]
    ];

    for (const position of rivetPositions) {
      const rivet = new THREE.Mesh(rivetGeometry, edgeMaterial);
      rivet.position.set(position[0], position[1], position[2]);
      rivet.scale.set(0.52, 1, 1);
      rivet.castShadow = true;
      helmet.add(rivet);
    }

    const patinaPatches = [
      { p: [0.95, 1.40, 0.66], s: [0.18, 0.035, 0.12], r: [-0.45, 0.55, 0.15] },
      { p: [-0.76, 1.73, -0.42], s: [0.14, 0.025, 0.09], r: [0.45, -0.65, 0.2] },
      { p: [1.32, 0.83, -0.22], s: [0.16, 0.024, 0.10], r: [0.15, 0.1, 1.05] },
      { p: [-0.62, 0.70, 1.30], s: [0.13, 0.024, 0.07], r: [1.15, 0.1, -0.2] },
      { p: [0.56, 1.92, -0.08], s: [0.09, 0.018, 0.055], r: [0.4, 0.2, 0.7] }
    ];

    const patchGeometry = new THREE.SphereGeometry(1, 18, 10);
    for (const patch of patinaPatches) {
      const stain = new THREE.Mesh(patchGeometry, patinaMaterial);
      stain.position.fromArray(patch.p);
      stain.scale.fromArray(patch.s);
      stain.rotation.set(patch.r[0], patch.r[1], patch.r[2]);
      helmet.add(stain);
    }

    const standMaterial = new THREE.MeshStandardMaterial({
      color: 0x24211b,
      roughness: 0.92,
      metalness: 0.05
    });

    const standStem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.11, 0.15, 2.0, 24),
      standMaterial
    );
    standStem.position.y = -1.36;
    standStem.castShadow = true;
    standStem.receiveShadow = true;
    scene.add(standStem);

    const standTop = new THREE.Mesh(
      new THREE.SphereGeometry(0.45, 28, 16),
      standMaterial
    );
    standTop.scale.set(1, 0.38, 1);
    standTop.position.y = -0.39;
    standTop.castShadow = true;
    scene.add(standTop);

    const base = new THREE.Mesh(
      new THREE.CylinderGeometry(0.78, 0.92, 0.18, 48),
      standMaterial
    );
    base.position.y = -2.37;
    base.castShadow = true;
    base.receiveShadow = true;
    scene.add(base);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0x25251f,
        roughness: 0.94,
        metalness: 0.02
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -2.47;
    floor.receiveShadow = true;
    scene.add(floor);

    const hemisphere = new THREE.HemisphereLight(0xd8decb, 0x342b20, 1.45);
    scene.add(hemisphere);

    const keyLight = new THREE.DirectionalLight(0xffe0aa, 4.1);
    keyLight.position.set(4.5, 6.5, 5.0);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -4;
    keyLight.shadow.camera.right = 4;
    keyLight.shadow.camera.top = 5;
    keyLight.shadow.camera.bottom = -4;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 18;
    keyLight.shadow.bias = -0.00015;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x84b8a8, 2.2);
    rimLight.position.set(-5, 3.8, -4.5);
    scene.add(rimLight);

    const fillLight = new THREE.PointLight(0xc78b54, 1.8, 12, 2);
    fillLight.position.set(-3.5, 0.6, 4.5);
    scene.add(fillLight);

    const warmGlow = new THREE.PointLight(0xffb461, 0.7, 7, 2);
    warmGlow.position.set(2.2, -1.6, -2.6);
    scene.add(warmGlow);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
