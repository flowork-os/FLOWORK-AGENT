<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blue-and-White Porcelain Teapot</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0f12; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="app"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ *
 *  Renderer
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

/* ------------------------------------------------------------------ *
 *  Scene + Camera
 * ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141619);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3.5, 1.6, 3.9);

/* Image-based lighting for crisp porcelain glaze reflections */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ *
 *  Lighting  (hemisphere fill + key + fill + rim)
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xdfe8ff, 0x1b1e24, 0.45);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff6ea, 2.3);
keyLight.position.set(4.2, 6.0, 4.0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.radius = 5;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.02;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 30;
keyLight.shadow.camera.left = -3;
keyLight.shadow.camera.right = 3;
keyLight.shadow.camera.top = 3;
keyLight.shadow.camera.bottom = -3;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xbcd2ff, 0.55);
fillLight.position.set(-4.5, 2.2, 2.5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffffff, 1.25);
rimLight.position.set(-2.5, 4.0, -5.0);
scene.add(rimLight);

/* ------------------------------------------------------------------ *
 *  Ground plane — receives shadows only
 * ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ *
 *  Procedural cobalt blue-and-white texture (canvas)
 * ------------------------------------------------------------------ */
function drawFlower(g, x, y, s, rot) {
  g.save();
  g.translate(x, y);
  g.rotate(rot);

  // soft cobalt wash halo
  g.fillStyle = 'rgba(74,116,196,0.28)';
  g.beginPath();
  g.arc(0, 0, s * 1.2, 0, Math.PI * 2);
  g.fill();

  const petals = 7;
  for (let i = 0; i < petals; i++) {
    g.save();
    g.rotate((i / petals) * Math.PI * 2);
    const pg = g.createLinearGradient(0, -s * 1.2, 0, -s * 0.1);
    pg.addColorStop(0, '#39५fb0'.replace('५', '5'));
    pg.addColorStop(0, '#395fb0');
    pg.addColorStop(1, '#9ab6e4');
    g.fillStyle = pg;
    g.beginPath();
    g.ellipse(0, -s * 0.72, s * 0.32, s * 0.62, 0, 0, Math.PI * 2);
    g.fill();
    g.lineWidth = s * 0.05;
    g.strokeStyle = '#16265b';
    g.stroke();
    g.restore();
  }

  // flower centre
  g.beginPath();
  g.arc(0, 0, s * 0.36, 0, Math.PI * 2);
  g.fillStyle = '#20397e';
  g.fill();
  g.beginPath();
  g.arc(0, 0, s * 0.21, 0, Math.PI * 2);
  g.fillStyle = '#122250';
  g.fill();

  // pale stamen dots
  g.fillStyle = '#e6edff';
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    g.beginPath();
    g.arc(Math.cos(a) * s * 0.27, Math.sin(a) * s * 0.27, s * 0.032, 0, Math.PI * 2);
    g.fill();
  }
  g.restore();
}

function drawLeaf(g, x, y, s, rot) {
  g.save();
  g.translate(x, y);
  g.rotate(rot);
  const lg = g.createLinearGradient(0, -s, 0, s);
  lg.addColorStop(0, '#3a63b4');
  lg.addColorStop(1, '#7099d2');
  g.fillStyle = lg;
  g.beginPath();
  g.moveTo(0, -s);
  g.quadraticCurveTo(s * 0.55, 0, 0, s);
  g.quadraticCurveTo(-s * 0.55, 0, 0, -s);
  g.fill();
  g.strokeStyle = '#16265b';
  g.lineWidth = s * 0.07;
  g.beginPath();
  g.moveTo(0, -s);
  g.lineTo(0, s);
  g.stroke();
  g.restore();
}

function makePorcelainTexture(opts) {
  const w = opts.w, h = opts.h;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');

  // warm-white porcelain base with faint vertical gradient
  const bg = g.createLinearGradient(0, 0, 0, h);
  bg.addColorStop(0.0, '#f1efe6');
  bg.addColorStop(0.5, '#faf8f1');
  bg.addColorStop(1.0, '#eceadf');
  g.fillStyle = bg;
  g.fillRect(0, 0, w, h);

  // subtle ceramic mottle
  for (let i = 0; i < 40; i++) {
    const gx = ((i * 137.5) % w);
    const gy = ((i * 89.3) % h);
    g.fillStyle = 'rgba(210,214,205,0.06)';
    g.beginPath();
    g.ellipse(gx, gy, 60, 40, i, 0, Math.PI * 2);
    g.fill();
  }

  const line = '#20397e';
  const mid = '#2c50a0';
  function band(y, lw) {
    g.strokeStyle = line;
    g.lineWidth = lw;
    g.beginPath();
    g.moveTo(0, y);
    g.lineTo(w, y);
    g.stroke();
  }

  if (opts.topBands) {
    band(h * 0.150, h * 0.006);
    band(h * 0.180, h * 0.013);
    band(h * 0.198, h * 0.004);
  }
  if (opts.botBands) {
    band(h * 0.800, h * 0.004);
    band(h * 0.820, h * 0.013);
    band(h * 0.850, h * 0.006);
  }

  // scrolling floral band
  const cy = h * (opts.cy || 0.5);
  const amp = h * (opts.amp || 0.10);
  const periods = opts.periods || 3;

  // vine
  g.strokeStyle = mid;
  g.lineWidth = h * 0.006;
  g.beginPath();
  for (let x = 0; x <= w; x += 6) {
    const yy = cy + amp * Math.sin((x / w) * Math.PI * 2 * periods);
    if (x === 0) g.moveTo(x, yy); else g.lineTo(x, yy);
  }
  g.stroke();

  const bloom = periods * 2;
  const fs = h * (opts.fScale || 0.12);
  for (let k = 0; k < bloom; k++) {
    const t = (k + 0.5) / bloom;
    const x = w * t;
    const y = cy + amp * Math.sin(t * Math.PI * 2 * periods);
    // leaves flanking each bloom
    drawLeaf(g, x - fs * 1.5, y + fs * 0.5, fs * 0.85, -0.6 + Math.sin(k) * 0.3);
    drawLeaf(g, x + fs * 1.5, y - fs * 0.5, fs * 0.75, 2.4 + Math.cos(k) * 0.3);
    drawFlower(g, x, y, fs * (0.85 + 0.25 * ((k % 2))), k * 0.7);
  }

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.needsUpdate = true;
  return tex;
}

/* ------------------------------------------------------------------ *
 *  Materials
 * ------------------------------------------------------------------ */
const bodyTex = makePorcelainTexture({ w: 2048, h: 1024, topBands: true, botBands: true, cy: 0.5, amp: 0.10, periods: 3, fScale: 0.11 });
const lidTex  = makePorcelainTexture({ w: 1024, h: 512,  topBands: true, botBands: false, cy: 0.62, amp: 0.06, periods: 4, fScale: 0.075 });

const bodyMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  map: bodyTex,
  roughness: 0.32,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.06,
  envMapIntensity: 1.05
});

const lidMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  map: lidTex,
  roughness: 0.32,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.06,
  envMapIntensity: 1.05
});

const whiteMat = new THREE.MeshPhysicalMaterial({
  color: 0xf7f5ee,
  roughness: 0.28,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.05,
  envMapIntensity: 1.1
});

const blueMat = new THREE.MeshPhysicalMaterial({
  color: 0x274488,
  roughness: 0.3,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.07,
  envMapIntensity: 1.15
});

/* ------------------------------------------------------------------ *
 *  Helper: tapered tube along a curve (for spout & handle)
 * ------------------------------------------------------------------ */
function taperedTube(curve, tubularSegments, radialSegments, radiusFn) {
  const frames = curve.computeFrenetFrames(tubularSegments, false);
  const positions = [], uvs = [], indices = [];
  const P = new THREE.Vector3();

  for (let i = 0; i <= tubularSegments; i++) {
    const u = i / tubularSegments;
    curve.getPoint(u, P);
    const N = frames.normals[i];
    const B = frames.binormals[i];
    const r = radiusFn(u);
    for (let j = 0; j <= radialSegments; j++) {
      const v = (j / radialSegments) * Math.PI * 2;
      const sin = Math.sin(v), cos = -Math.cos(v);
      const nx = cos * N.x + sin * B.x;
      const ny = cos * N.y + sin * B.y;
      const nz = cos * N.z + sin * B.z;
      positions.push(P.x + r * nx, P.y + r * ny, P.z + r * nz);
      uvs.push(u, j / radialSegments);
    }
  }

  for (let i = 1; i <= tubularSegments; i++) {
    for (let j = 1; j <= radialSegments; j++) {
      const a = (radialSegments + 1) * (i - 1) + (j - 1);
      const b = (radialSegments + 1) * i + (j - 1);
      const c = (radialSegments + 1) * i + j;
      const d = (radialSegments + 1) * (i - 1) + j;
      indices.push(a, b, d);
      indices.push(b, c, d);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

/* ------------------------------------------------------------------ *
 *  Build the teapot
 * ------------------------------------------------------------------ */
const teapot = new THREE.Group();

function toProfile(pairs) {
  const pts = pairs.map(p => new THREE.Vector2(p[0], p[1]));
  const sampled = new THREE.SplineCurve(pts).getPoints(64);
  return sampled.map(p => new THREE.Vector2(Math.max(0, p.x), p.y));
}

/* --- Body (lathe) --- */
const bodyProfile = toProfile([
  [0.00, 0.00],
  [0.34, 0.00],
  [0.42, 0.03],
  [0.44, 0.09],
  [0.52, 0.22],
  [0.66, 0.40],
  [0.77, 0.58],
  [0.81, 0.74],
  [0.79, 0.92],
  [0.71, 1.10],
  [0.60, 1.24],
  [0.50, 1.34],
  [0.47, 1.40]
]);
const bodyGeo = new THREE.LatheGeometry(bodyProfile, 180);
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.castShadow = true;
body.receiveShadow = true;
teapot.add(body);

/* --- Lid (lathe) with capped underside --- */
const lidProfile = toProfile([
  [0.00, 1.400],
  [0.30, 1.400],
  [0.46, 1.405],
  [0.52, 1.430],
  [0.50, 1.470],
  [0.44, 1.520],
  [0.34, 1.580],
  [0.20, 1.640],
  [0.09, 1.680],
  [0.00, 1.700]
]);
const lidGeo = new THREE.LatheGeometry(lidProfile, 180);
const lid = new THREE.Mesh(lidGeo, lidMat);
lid.position.y = 0.018;
lid.castShadow = true;
lid.receiveShadow = true;
teapot.add(lid);

/* --- Knob on the lid --- */
const knob = new THREE.Mesh(new THREE.SphereGeometry(0.11, 48, 32), blueMat);
knob.scale.set(1.0, 0.78, 1.0);
knob.position.set(0, 1.718 + 0.018, 0);
knob.castShadow = true;
knob.receiveShadow = true;
teapot.add(knob);

const knobStem = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.075, 0.06, 32), whiteMat);
knobStem.position.set(0, 1.678 + 0.018, 0);
knobStem.castShadow = true;
teapot.add(knobStem);

/* --- Spout (tapered tube) --- */
const spoutCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.45, 0.48, 0),
  new THREE.Vector3(0.80, 0.55, 0),
  new THREE.Vector3(1.02, 0.80, 0),
  new THREE.Vector3(1.12, 1.10, 0),
  new THREE.Vector3(1.19, 1.40, 0)
]);
const spoutGeo = taperedTube(spoutCurve, 90, 40, (u) => 0.075 + (0.26 - 0.075) * Math.pow(1 - u, 1.35));
const spout = new THREE.Mesh(spoutGeo, whiteMat);
spout.castShadow = true;
spout.receiveShadow = true;
teapot.add(spout);

/* thin cobalt accent ring near spout tip */
const spoutRing = new THREE.Mesh(new THREE.TorusGeometry(0.083, 0.014, 20, 48), blueMat);
spoutRing.position.set(1.185, 1.36, 0);
spoutRing.rotation.set(Math.PI / 2, 0, -0.28);
teapot.add(spoutRing);

/* --- Loop handle (tapered tube) --- */
const handleCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.55, 1.16, 0),
  new THREE.Vector3(-0.98, 1.20, 0),
  new THREE.Vector3(-1.20, 0.95, 0),
  new THREE.Vector3(-1.14, 0.62, 0),
  new THREE.Vector3(-0.82, 0.42, 0),
  new THREE.Vector3(-0.58, 0.40, 0)
]);
const handleGeo = taperedTube(handleCurve, 100, 32, (u) => 0.072 + 0.020 * Math.sin(u * Math.PI));
const handle = new THREE.Mesh(handleGeo, whiteMat);
handle.castShadow = true;
handle.receiveShadow = true;
teapot.add(handle);

/* --- Crisp cobalt line rings (foot + neck + lid edge) --- */
const footRing = new THREE.Mesh(new THREE.TorusGeometry(0.435, 0.011, 20, 120), blueMat);
footRing.position.set(0, 0.055, 0);
footRing.rotation.x = Math.PI / 2;
teapot.add(footRing);

const neckRing = new THREE.Mesh(new THREE.TorusGeometry(0.485, 0.010, 20, 120), blueMat);
neckRing.position.set(0, 1.385, 0);
neckRing.rotation.x = Math.PI / 2;
teapot.add(neckRing);

const lidEdgeRing = new THREE.Mesh(new THREE.TorusGeometry(0.515, 0.010, 20, 120), blueMat);
lidEdgeRing.position.set(0, 1.430 + 0.018, 0);
lidEdgeRing.rotation.x = Math.PI / 2;
teapot.add(lidEdgeRing);

scene.add(teapot);

/* ------------------------------------------------------------------ *
 *  Controls
 * ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.minDistance = 2.4;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 0.85, 0);
controls.update();

/* ------------------------------------------------------------------ *
 *  Resize
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

/* ------------------------------------------------------------------ *
 *  Render loop
 * ------------------------------------------------------------------ */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
