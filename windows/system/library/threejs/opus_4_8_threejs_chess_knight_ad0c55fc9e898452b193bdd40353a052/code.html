<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carved Wooden Chess Knight — Staunton</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9d9dd; }
  #info {
    position: fixed; left: 12px; bottom: 10px; z-index: 10;
    font: 12px/1.4 system-ui, sans-serif; color: #4b4b52;
    letter-spacing: .02em; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="info">Carved wooden chess knight · drag to orbit · scroll to zoom</div>

<!-- three.js + OrbitControls loaded ONLY via importmap from jsDelivr -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================================
   Carved wooden chess knight (tournament Staunton style)
   Units are roughly centimetres: the finished piece is ~6.4 cm tall with a
   ~3.4 cm turned base, matching a real tournament knight.
   ========================================================================= */

/* ---------------------------------------------------------------------------
   Renderer
   ------------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ---------------------------------------------------------------------------
   Scene + neutral studio background (soft radial gradient)
   ------------------------------------------------------------------------ */
const scene = new THREE.Scene();

function makeStudioBackground() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(256, 210, 40, 256, 256, 380);
  g.addColorStop(0, '#f1f1f3');
  g.addColorStop(0.6, '#d9d9de');
  g.addColorStop(1, '#bdbdc4');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 512, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
scene.background = makeStudioBackground();

/* ---------------------------------------------------------------------------
   Camera
   ------------------------------------------------------------------------ */
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);

/* ---------------------------------------------------------------------------
   Lighting: hemisphere fill + directional key (shadows) + soft fill + rim
   ------------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xf2f2ff, 0x4a3a2a, 0.55);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff2e0, 2.3);
keyLight.position.set(4.5, 7.5, 4.0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 30;
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.02;
keyLight.shadow.radius = 4;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xbcccff, 0.5);
fillLight.position.set(-5, 3, -2);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffd9b0, 0.6);
rimLight.position.set(-3, 5, -6);
scene.add(rimLight);

/* ---------------------------------------------------------------------------
   Procedural wood-grain texture (CanvasTexture)
   ------------------------------------------------------------------------ */
function lerpC(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}

function makeWoodTexture() {
  const w = 512, h = 512;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(w, h);

  const dark  = [86, 52, 24];   // deep grain lines
  const mid   = [150, 96, 48];  // body of the wood
  const light = [190, 138, 82]; // warm highlights

  // deterministic value noise
  const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
  function vnoise(x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi), b = hash(xi + 1, yi), cc = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
    return a + (b - a) * u + (cc - a) * v + (a - b - cc + d) * u * v;
  }

  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      // wavy warp so grain lines meander like real turned wood
      const warp = Math.sin(y * 0.025) * 14 + vnoise(x * 0.02, y * 0.02) * 22;
      const gx = x + warp;
      // growth-ring style banding running along the grain
      let band = Math.sin(gx * 0.16) * 0.5 + 0.5;
      band = Math.pow(band, 1.5);
      // fine longitudinal streaks + broad tonal variation
      const fine = vnoise(x * 0.5, y * 0.06) * 0.35;
      let t = band * 0.6 + fine + vnoise(x * 0.01, y * 0.01) * 0.2;
      t = Math.min(1, Math.max(0, t));
      const lo = lerpC(dark, mid, t);
      const col = lerpC(lo, light, Math.max(0, t - 0.5) * 2 * 0.6);
      const i = (y * w + x) * 4;
      img.data[i] = col[0]; img.data[i + 1] = col[1]; img.data[i + 2] = col[2]; img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

const woodTex = makeWoodTexture();

// Varnished tournament-wood look: slight clearcoat for a polished sheen.
function woodMaterial(tint, rough) {
  return new THREE.MeshPhysicalMaterial({
    map: woodTex,
    color: tint,
    roughness: rough,
    metalness: 0.0,
    clearcoat: 0.3,
    clearcoatRoughness: 0.45
  });
}

const headMat = woodMaterial(0xffffff, 0.5);   // texture supplies the colour
const baseMat = woodMaterial(0xf0e0cb, 0.55);  // faintly warmer/darker turned base
const darkMat = new THREE.MeshStandardMaterial({ color: 0x2a1a0d, roughness: 0.4, metalness: 0.0 });

/* ---------------------------------------------------------------------------
   Helpers to build carved (extruded) parts from a smooth silhouette
   ------------------------------------------------------------------------ */

// Build a closed, smoothed silhouette in the X/Y plane and extrude it in Z.
function extrudeSilhouette(keyPts, depth, bevel) {
  const v3 = keyPts.map(p => new THREE.Vector3(p[0], p[1], 0));
  const curve = new THREE.CatmullRomCurve3(v3, true, 'centripetal', 0.5);
  const pts2 = curve.getPoints(200).map(v => new THREE.Vector2(v.x, v.y));
  if (THREE.ShapeUtils.isClockWise(pts2)) pts2.reverse(); // ensure CCW → outward normals
  const shape = new THREE.Shape(pts2);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth, steps: 1,
    bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3
  });
  geo.translate(0, 0, -depth / 2); // centre across the Z (width) axis
  geo.computeVertexNormals();
  return geo;
}

/* ---------------------------------------------------------------------------
   The knight group
   ------------------------------------------------------------------------ */
const knight = new THREE.Group();
knight.name = 'woodenChessKnight';

/* --- 1. Turned circular base -------------------------------------------- */
// Lathe profile (radius, height): flared foot, cove, bead and rising collar.
const baseProfile = [
  [0.00, 0.00], [1.70, 0.00], [1.72, 0.10], [1.60, 0.24],
  [1.34, 0.37], [1.20, 0.52], [1.18, 0.64], [1.29, 0.74],
  [1.13, 0.88], [0.85, 1.08], [0.62, 1.28], [0.56, 1.42],
  [0.67, 1.52], [0.50, 1.64], [0.00, 1.66]
].map(p => new THREE.Vector2(p[0], p[1]));

const baseGeo = new THREE.LatheGeometry(baseProfile, 72);
const base = new THREE.Mesh(baseGeo, baseMat);
base.name = 'turnedBase';
base.castShadow = true;
base.receiveShadow = true;
knight.add(base);

/* --- 2. Neck + carved horse head (single carved silhouette) ------------- */
// Side profile, muzzle pointing +X, mane/back toward -X.
// Note the jaw point (index 3) juts forward over the recessed throat and the
// muzzle tip (index 5) overhangs the chin — these give the classic undercuts.
const headKeyPts = [
  [ 0.55, 1.20],  // 0  bottom of throat / neck front
  [ 0.60, 2.05],  // 1  throat (recessed)
  [ 0.78, 2.85],  // 2  lower jaw rising
  [ 1.30, 3.35],  // 3  defined jaw corner (overhangs throat → undercut)
  [ 1.95, 3.55],  // 4  chin / lower muzzle
  [ 2.42, 3.90],  // 5  muzzle tip (overhangs chin → undercut)
  [ 2.38, 4.32],  // 6  top of muzzle
  [ 1.95, 4.70],  // 7  bridge of the nose
  [ 1.55, 5.25],  // 8  forehead
  [ 1.15, 5.70],  // 9  poll (top of head)
  [ 0.70, 5.55],  // 10 behind the poll
  [ 0.30, 4.95],  // 11 crest of the neck
  [-0.05, 4.10],  // 12 upper mane line
  [-0.35, 3.15],  // 13 back of the neck
  [-0.48, 2.25],  // 14 lower back of neck
  [-0.35, 1.35]   // 15 bottom back of neck
];

const headGeo = extrudeSilhouette(headKeyPts, 1.15, 0.08);
const head = new THREE.Mesh(headGeo, headMat);
head.name = 'neckAndHead';
head.castShadow = true;
head.receiveShadow = true;
knight.add(head);

/* --- 3. Carved mane (scalloped crest of locks along the back) ----------- */
function buildMane(spinePts, depth, bevel) {
  const v3 = spinePts.map(p => new THREE.Vector3(p[0], p[1], 0));
  const curve = new THREE.CatmullRomCurve3(v3, false, 'centripetal', 0.5);
  const N = 100;
  const inner = [], outer = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const p = curve.getPoint(t);
    const tan = curve.getTangent(t);
    // outward normal (rotate tangent -90° in the X/Y plane), forced toward -X (back)
    let nx = tan.y, ny = -tan.x;
    const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
    if (nx > 0) { nx = -nx; ny = -ny; }
    // scalloped protrusion → individual carved locks, tapering at both ends
    const env = Math.pow(Math.sin(Math.PI * t), 0.5);
    const amp = (0.17 + 0.14 * Math.abs(Math.sin(t * Math.PI * 6))) * env;
    inner.push(new THREE.Vector2(p.x - nx * 0.04, p.y - ny * 0.04)); // bite into neck
    outer.push(new THREE.Vector2(p.x + nx * amp,  p.y + ny * amp));
  }
  const loop = inner.concat(outer.reverse());
  if (THREE.ShapeUtils.isClockWise(loop)) loop.reverse();
  const geo = new THREE.ExtrudeGeometry(new THREE.Shape(loop), {
    depth, steps: 1,
    bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 2
  });
  geo.translate(0, 0, -depth / 2);
  geo.computeVertexNormals();
  return geo;
}

const maneSpine = [
  [ 1.10, 5.75], [ 0.68, 5.55], [ 0.28, 4.95],
  [-0.05, 4.15], [-0.30, 3.25], [-0.45, 2.45], [-0.45, 1.90]
];
const mane = new THREE.Mesh(buildMane(maneSpine, 1.05, 0.05), headMat);
mane.name = 'carvedMane';
mane.castShadow = true;
mane.receiveShadow = true;
knight.add(mane);

/* --- 4. Ears (two small carved cones at the poll) ----------------------- */
function makeEar(side) {
  const ear = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.75, 16), headMat);
  ear.position.set(0.98, 6.02, 0.30 * side);
  ear.rotation.z = 0.32;          // lean back toward the mane
  ear.rotation.x = -0.15 * side;  // splay outward
  ear.castShadow = true;
  ear.receiveShadow = true;
  ear.name = side > 0 ? 'earLeft' : 'earRight';
  return ear;
}
knight.add(makeEar(1), makeEar(-1));

/* --- 5. Eyes (almond, one on each cheek) -------------------------------- */
function makeEye(side) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.14, 20, 16), darkMat);
  eye.scale.set(0.85, 1.25, 0.55);
  eye.position.set(1.55, 5.02, 0.52 * side);
  eye.rotation.z = -0.3;
  eye.name = side > 0 ? 'eyeLeft' : 'eyeRight';
  eye.castShadow = true;
  return eye;
}
knight.add(makeEye(1), makeEye(-1));

/* --- 6. Nostrils (dark bumps on the muzzle front) ----------------------- */
function makeNostril(side) {
  const n = new THREE.Mesh(new THREE.SphereGeometry(0.10, 12, 12), darkMat);
  n.position.set(2.40, 3.98, 0.16 * side);
  n.name = side > 0 ? 'nostrilLeft' : 'nostrilRight';
  return n;
}
knight.add(makeNostril(1), makeNostril(-1));

/* --- 7. Mouth line (carved groove on each cheek under the muzzle) ------- */
function makeMouth(side) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.055, 0.04), darkMat);
  m.position.set(1.95, 3.66, 0.50 * side);
  m.rotation.z = -0.22;
  m.name = side > 0 ? 'mouthLeft' : 'mouthRight';
  return m;
}
knight.add(makeMouth(1), makeMouth(-1));

scene.add(knight);

/* ---------------------------------------------------------------------------
   Ground: soft neutral plane that receives the contact shadow
   ------------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0xdadade, roughness: 0.95, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------------
   Centre the piece on the origin and rest it on the ground
   (base is already radially centred on the Y axis; just drop it to y=0)
   ------------------------------------------------------------------------ */
let box = new THREE.Box3().setFromObject(knight);
knight.position.y -= box.min.y;

/* ---------------------------------------------------------------------------
   OrbitControls with damping + gentle auto-rotate
   ------------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minPolarAngle = 0.15;
controls.maxPolarAngle = Math.PI * 0.5 + 0.12;

/* ---------------------------------------------------------------------------
   Auto-frame the camera to the model's bounding box
   ------------------------------------------------------------------------ */
function frameObject() {
  box = new THREE.Box3().setFromObject(knight);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const fov = camera.fov * Math.PI / 180;
  let dist = (maxDim / 2) / Math.tan(fov / 2);
  dist *= 1.55;

  // Mostly along +Z (the extrude axis) so the recognizable profile faces us.
  camera.position.set(center.x + dist * 0.30, center.y + size.y * 0.10, center.z + dist * 0.95);
  camera.near = dist / 100;
  camera.far = dist * 100;
  camera.updateProjectionMatrix();

  controls.target.set(center.x, center.y, center.z);
  controls.minDistance = maxDim * 0.6;
  controls.maxDistance = dist * 3;
  controls.update();
}
frameObject();

/* ---------------------------------------------------------------------------
   Resize handling
   ------------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------------------------------------------------------------------------
   Render loop
   ------------------------------------------------------------------------ */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
