<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roman Senator Bust</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17191d}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17191d);
scene.fog = new THREE.Fog(0x17191d, 10, 22);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.8, 4.6, 9.3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.target.set(0, 3.0, 0);

const marble = new THREE.MeshStandardMaterial({
  color: 0xd8d5ca,
  roughness: 0.72,
  metalness: 0.02
});
const marbleLight = new THREE.MeshStandardMaterial({
  color: 0xe4e0d4,
  roughness: 0.66
});
const marbleShadow = new THREE.MeshStandardMaterial({
  color: 0xb9b7ae,
  roughness: 0.8
});
const hairMat = new THREE.MeshStandardMaterial({
  color: 0xaba99f,
  roughness: 0.88
});
const eyeMat = new THREE.MeshStandardMaterial({
  color: 0x4d4a43,
  roughness: 0.45
});
const pedestalMat = new THREE.MeshStandardMaterial({
  color: 0xc8c4b8,
  roughness: 0.76
});
const darkChipMat = new THREE.MeshStandardMaterial({
  color: 0x817f78,
  roughness: 0.9
});

function addMesh(geometry, material, position, scale, rotation) {
  const mesh = new THREE.Mesh(geometry, material);
  if (position) mesh.position.set(position[0], position[1], position[2]);
  if (scale) mesh.scale.set(scale[0], scale[1], scale[2]);
  if (rotation) mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function tube(points, radius, material, radialSegments = 7) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geometry = new THREE.TubeGeometry(curve, 18, radius, radialSegments, false);
  return addMesh(geometry, material);
}

function panel(points, depth, material, zPosition) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
  shape.closePath();
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: true,
    bevelSegments: 2,
    bevelSize: 0.035,
    bevelThickness: 0.035,
    curveSegments: 2
  });
  geometry.translate(0, 0, -depth * 0.5);
  return addMesh(geometry, material, [0, 0, zPosition]);
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(18, 96),
  new THREE.MeshStandardMaterial({ color: 0x24262a, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.035;
floor.receiveShadow = true;
scene.add(floor);

const pedestalShape = new THREE.Shape();
pedestalShape.moveTo(-2.05, -1.3);
pedestalShape.lineTo(1.52, -1.3);
pedestalShape.lineTo(1.73, -1.17);
pedestalShape.lineTo(1.61, -0.98);
pedestalShape.lineTo(1.91, -0.84);
pedestalShape.lineTo(2.05, -0.72);
pedestalShape.lineTo(2.05, 1.3);
pedestalShape.lineTo(-2.05, 1.3);
pedestalShape.closePath();

const pedestalGeometry = new THREE.ExtrudeGeometry(pedestalShape, {
  depth: 0.72,
  bevelEnabled: true,
  bevelSegments: 3,
  bevelSize: 0.08,
  bevelThickness: 0.08
});
pedestalGeometry.rotateX(-Math.PI / 2);
pedestalGeometry.translate(0, 0.39, 0);
const pedestal = new THREE.Mesh(pedestalGeometry, pedestalMat);
pedestal.castShadow = true;
pedestal.receiveShadow = true;
scene.add(pedestal);

addMesh(new THREE.BoxGeometry(4.3, 0.18, 2.82), marbleLight, [0, 0.83, 0], null, null);

const chip = addMesh(
  new THREE.TetrahedronGeometry(0.26, 0),
  darkChipMat,
  [1.69, 0.93, -1.23],
  [1.3, 0.42, 0.7],
  [0.2, 0.5, -0.25]
);

const torsoProfile = [
  new THREE.Vector2(0.72, 0.86),
  new THREE.Vector2(0.82, 1.05),
  new THREE.Vector2(1.03, 1.32),
  new THREE.Vector2(1.34, 1.62),
  new THREE.Vector2(1.48, 1.94),
  new THREE.Vector2(1.41, 2.22),
  new THREE.Vector2(1.17, 2.43),
  new THREE.Vector2(0.84, 2.53),
  new THREE.Vector2(0.60, 2.58)
];
const torso = addMesh(new THREE.LatheGeometry(torsoProfile, 48), marble, [0, 0.81, 0]);
torso.castShadow = true;
torso.receiveShadow = true;

addMesh(new THREE.SphereGeometry(1, 32, 20), marbleShadow, [0, 2.28, 0], [1.72, 0.58, 0.72]);

const togaPanelPoints = [
  [-1.62, 1.16], [-1.29, 1.38], [-0.86, 1.75], [-0.48, 2.17],
  [-0.18, 2.46], [0.23, 2.42], [0.58, 2.19], [0.83, 1.83],
  [0.72, 1.45], [0.45, 1.13], [-0.25, 1.02], [-0.98, 1.03]
];
panel(togaPanelPoints, 0.22, marbleLight, 0.52);

const shoulderDrape = new THREE.SphereGeometry(1, 32, 20);
addMesh(shoulderDrape, marbleLight, [-1.03, 2.22, 0.03], [0.72, 1.32, 0.57], [0.05, 0.12, -0.23]);

tube([
  new THREE.Vector3(-1.45, 2.48, 0.57),
  new THREE.Vector3(-0.92, 2.29, 0.68),
  new THREE.Vector3(-0.42, 2.02, 0.72),
  new THREE.Vector3(0.16, 1.74, 0.69),
  new THREE.Vector3(0.68, 1.39, 0.62)
], 0.105, marbleShadow, 8);

const foldCurves = [
  [[-1.23,1.22,0.67],[-0.77,1.42,0.75],[-0.37,1.78,0.78],[-0.05,2.19,0.72]],
  [[-0.86,1.14,0.69],[-0.42,1.34,0.77],[-0.02,1.63,0.8],[0.35,1.99,0.72]],
  [[-0.45,1.11,0.68],[-0.04,1.25,0.76],[0.36,1.48,0.77],[0.63,1.76,0.68]],
  [[0.02,1.1,0.65],[0.35,1.19,0.72],[0.65,1.38,0.68],[0.8,1.61,0.58]],
  [[-1.32,1.55,0.68],[-1.02,1.72,0.76],[-0.77,1.94,0.78],[-0.57,2.18,0.71]]
];
for (const curve of foldCurves) {
  tube(curve.map(p => new THREE.Vector3(p[0], p[1], p[2])), 0.038, marbleShadow, 6);
}

addMesh(new THREE.CylinderGeometry(0.38, 0.48, 0.48, 32), marble, [0, 2.68, 0], null, null);
addMesh(new THREE.SphereGeometry(1, 48, 32), marble, [0, 3.55, 0.02], [0.91, 1.16, 0.78]);

addMesh(new THREE.SphereGeometry(0.25, 24, 16), marble, [-0.86, 3.58, 0.02], [0.52, 0.82, 0.7]);
addMesh(new THREE.SphereGeometry(0.25, 24, 16), marble, [0.86, 3.58, 0.02], [0.52, 0.82, 0.7]);

addMesh(new THREE.CylinderGeometry(0.115, 0.16, 0.45, 20), marbleLight, [0, 3.5, 0.73], null, [Math.PI / 2, 0, 0]);
addMesh(new THREE.ConeGeometry(0.16, 0.48, 20), marbleLight, [0, 3.53, 0.83], [1, 1, 1], [Math.PI / 2, 0, 0]);
addMesh(new THREE.SphereGeometry(0.18, 20, 12), marble, [0, 3.27, 0.76], [1.25, 0.55, 0.65]);

const browGeometry = new THREE.SphereGeometry(1, 20, 12);
addMesh(browGeometry, marbleShadow, [-0.34, 3.78, 0.69], [0.31, 0.075, 0.09], [0, 0, -0.08]);
addMesh(browGeometry, marbleShadow, [0.34, 3.78, 0.69], [0.31, 0.075, 0.09], [0, 0, 0.08]);

const eyeGeometry = new THREE.SphereGeometry(0.075, 16, 10);
addMesh(eyeGeometry, eyeMat, [-0.31, 3.66, 0.74], [1, 0.72, 0.55]);
addMesh(eyeGeometry, eyeMat, [0.31, 3.66, 0.74], [1, 0.72, 0.55]);

tube([
  new THREE.Vector3(-0.35, 3.17, 0.72),
  new THREE.Vector3(-0.16, 3.12, 0.79),
  new THREE.Vector3(0.05, 3.13, 0.79),
  new THREE.Vector3(0.31, 3.19, 0.72)
], 0.035, marbleShadow, 6);

const hairPositions = [
  [-0.72,4.18,0.02,0.25,0.20,0.20],[-0.48,4.34,0.03,0.28,0.22,0.21],[-0.18,4.39,0.04,0.27,0.22,0.22],
  [0.14,4.39,0.04,0.27,0.22,0.22],[0.45,4.31,0.03,0.28,0.21,0.21],[0.68,4.15,0.02,0.23,0.2,0.2],
  [-0.82,4.00,0.08,0.18,0.25,0.21],[0.80,3.98,0.08,0.18,0.25,0.21],
  [-0.77,3.78,0.13,0.13,0.24,0.17],[0.76,3.77,0.13,0.13,0.24,0.17]
];
for (const h of hairPositions) {
  addMesh(new THREE.IcosahedronGeometry(1, 1), hairMat, [h[0],h[1],h[2]], [h[3],h[4],h[5]], [0.1,0.2,0.2]);
}

const hairGrooves = [
  [[-0.59,4.25,0.2],[-0.43,4.38,0.22]],
  [[-0.27,4.3,0.23],[-0.13,4.43,0.23]],
  [[0.08,4.31,0.23],[0.2,4.42,0.2]],
  [[0.42,4.24,0.2],[0.56,4.34,0.17]]
];
for (const groove of hairGrooves) {
  tube(groove.map(p => new THREE.Vector3(p[0],p[1],p[2])), 0.025, marbleShadow, 5);
}

const key = new THREE.DirectionalLight(0xfff1d4, 3.2);
key.position.set(-4.5, 8.5, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -2;
key.shadow.bias = -0.0005;
scene.add(key);

const fill = new THREE.DirectionalLight(0xb8cfff, 1.15);
fill.position.set(5, 4, 4);
scene.add(fill);

const rim = new THREE.PointLight(0xffc996, 1.0, 12);
rim.position.set(1.8, 5.8, -3.7);
scene.add(rim);

scene.add(new THREE.HemisphereLight(0xc5d0e8, 0x34302b, 0.8));

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
}
addEventListener("resize", resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
