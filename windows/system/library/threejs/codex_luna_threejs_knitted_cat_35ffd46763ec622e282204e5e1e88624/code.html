<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amigurumi Cat</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eadcc9}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeadcc9);
scene.fog = new THREE.Fog(0xeadcc9, 8, 18);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2.5, 8.2);
camera.lookAt(0, 1.75, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.25;
controls.minDistance = 5.7;
controls.maxDistance = 11;
controls.target.set(0, 1.75, 0);

scene.add(new THREE.HemisphereLight(0xfff4df, 0x9b7765, 2.2));

const keyLight = new THREE.DirectionalLight(0xffe9c7, 3.5);
keyLight.position.set(-4, 7, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -3;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xb9d9ff, 1.1, 12);
fillLight.position.set(4, 3.5, 4);
scene.add(fillLight);

const yarn = new THREE.MeshStandardMaterial({
  color: 0xc78371,
  roughness: 0.92,
  metalness: 0,
  flatShading: false
});
const yarnDark = new THREE.MeshStandardMaterial({
  color: 0xa9645c,
  roughness: 0.95
});
const yarnLight = new THREE.MeshStandardMaterial({
  color: 0xd69a82,
  roughness: 0.92
});
const cream = new THREE.MeshStandardMaterial({
  color: 0xf2d3b7,
  roughness: 0.9
});
const innerEar = new THREE.MeshStandardMaterial({
  color: 0xe9a7a0,
  roughness: 0.86
});
const dark = new THREE.MeshStandardMaterial({
  color: 0x34252a,
  roughness: 0.72
});
const noseMat = new THREE.MeshStandardMaterial({
  color: 0x6c3036,
  roughness: 0.78
});
const padMat = new THREE.MeshStandardMaterial({
  color: 0xd98d88,
  roughness: 0.88
});

function addMesh(geometry, material, position, scale, rotation) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(position[0], position[1], position[2]);
  if (scale) object.scale.set(scale[0], scale[1], scale[2]);
  if (rotation) object.rotation.set(rotation[0], rotation[1], rotation[2]);
  object.castShadow = true;
  object.receiveShadow = true;
  scene.add(object);
  return object;
}

function stitchRing(x, y, z, sx, sy, rotZ, material) {
  const geometry = new THREE.TorusGeometry(0.075, 0.018, 6, 10);
  const ring = addMesh(geometry, material || yarnLight, [x, y, z], [sx, sy, 1], [0, 0, rotZ || 0]);
  return ring;
}

function bodyStitches() {
  const rows = 9;
  for (let row = 0; row < rows; row++) {
    const y = 0.48 + row * 0.205;
    const halfWidth = 0.66 + Math.sin((row / (rows - 1)) * Math.PI) * 0.28;
    const count = 8;
    for (let col = 0; col < count; col++) {
      const x = -halfWidth + (col / (count - 1)) * halfWidth * 2;
      const normalized = x / (halfWidth + 0.001);
      const front = 0.55 + 0.17 * (1 - normalized * normalized);
      const stagger = row % 2 ? 0.09 : 0;
      stitchRing(x + stagger, y, front, 0.88, 1.28, 0.12 * Math.sin(col + row), row % 3 === 0 ? yarnLight : yarnDark);
    }
  }
}

function headStitches() {
  for (let row = 0; row < 8; row++) {
    const y = 1.78 + row * 0.19;
    const halfWidth = 0.76 + Math.sin((row / 7) * Math.PI) * 0.12;
    const count = 9;
    for (let col = 0; col < count; col++) {
      const x = -halfWidth + (col / (count - 1)) * halfWidth * 2;
      const normalized = x / (halfWidth + 0.001);
      const front = 0.68 + 0.18 * (1 - normalized * normalized);
      stitchRing(x + (row % 2 ? 0.06 : 0), y, front, 0.82, 1.22, -0.08 * Math.cos(col), row % 2 ? yarnLight : yarnDark);
    }
  }
}

const body = addMesh(
  new THREE.SphereGeometry(1, 48, 32),
  yarn,
  [0, 1.08, 0],
  [1.12, 1.38, 0.82]
);

const belly = addMesh(
  new THREE.SphereGeometry(1, 40, 28),
  cream,
  [0, 0.96, 0.68],
  [0.69, 0.86, 0.12]
);

bodyStitches();

const haunchLeft = addMesh(
  new THREE.SphereGeometry(1, 32, 24),
  yarnDark,
  [-0.72, 0.62, 0.06],
  [0.52, 0.62, 0.48]
);
const haunchRight = addMesh(
  new THREE.SphereGeometry(1, 32, 24),
  yarnDark,
  [0.72, 0.62, 0.06],
  [0.52, 0.62, 0.48]
);

const head = addMesh(
  new THREE.SphereGeometry(1, 48, 32),
  yarn,
  [0, 2.45, 0.02],
  [1.2, 1.08, 0.91]
);

headStitches();

function makeEar(x, angle, material) {
  const shape = new THREE.Shape();
  shape.moveTo(-0.44, -0.42);
  shape.lineTo(0, 0.58);
  shape.lineTo(0.44, -0.42);
  shape.closePath();
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.22,
    bevelEnabled: true,
    bevelSegments: 2,
    bevelSize: 0.035,
    bevelThickness: 0.035
  });
  geometry.center();
  return addMesh(geometry, material, [x, 3.2, 0.02], [0.78, 0.92, 0.8], [0, 0, angle]);
}

makeEar(-0.77, -0.27, yarnDark);
makeEar(0.77, 0.27, yarnDark);

function makeInnerEar(x, angle) {
  const shape = new THREE.Shape();
  shape.moveTo(-0.27, -0.26);
  shape.lineTo(0, 0.38);
  shape.lineTo(0.27, -0.26);
  shape.closePath();
  const geometry = new THREE.ShapeGeometry(shape);
  const ear = addMesh(geometry, innerEar, [x, 3.22, 0.155], [0.78, 0.88, 1], [0, 0, angle]);
  ear.castShadow = false;
  return ear;
}

makeInnerEar(-0.77, -0.27);
makeInnerEar(0.77, 0.27);

const muzzleLeft = addMesh(
  new THREE.SphereGeometry(1, 28, 20),
  cream,
  [-0.25, 2.16, 0.77],
  [0.43, 0.34, 0.17]
);
const muzzleRight = addMesh(
  new THREE.SphereGeometry(1, 28, 20),
  cream,
  [0.25, 2.16, 0.77],
  [0.43, 0.34, 0.17]
);

function makeEye(x) {
  const eye = addMesh(new THREE.SphereGeometry(0.13, 24, 18), dark, [x, 2.57, 0.81], [1, 1.16, 0.48]);
  const glint = addMesh(new THREE.SphereGeometry(0.035, 12, 8), cream, [x - 0.04, 2.62, 0.875], [1, 1, 0.35]);
  glint.castShadow = false;
}
makeEye(-0.41);
makeEye(0.41);

const nose = addMesh(
  new THREE.SphereGeometry(0.13, 20, 16),
  noseMat,
  [0, 2.12, 0.98],
  [1.18, 0.78, 0.5],
  [0, 0, 0]
);

const mouthCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 2.04, 1.035),
  new THREE.Vector3(0, 1.98, 1.045),
  new THREE.Vector3(-0.11, 1.94, 1.025)
]);
const mouthCurve2 = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 2.04, 1.035),
  new THREE.Vector3(0, 1.98, 1.045),
  new THREE.Vector3(0.11, 1.94, 1.025)
]);
const mouthMat = new THREE.MeshBasicMaterial({ color: 0x563039 });
const mouth1 = new THREE.Mesh(new THREE.TubeGeometry(mouthCurve, 12, 0.018, 6, false), mouthMat);
const mouth2 = new THREE.Mesh(new THREE.TubeGeometry(mouthCurve2, 12, 0.018, 6, false), mouthMat);
mouth1.castShadow = false;
mouth2.castShadow = false;
scene.add(mouth1, mouth2);

function whisker(points) {
  const curve = new THREE.CatmullRomCurve3(points);
  const line = new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.012, 5, false), mouthMat);
  line.castShadow = false;
  scene.add(line);
}
whisker([new THREE.Vector3(-0.22, 2.12, 0.91), new THREE.Vector3(-0.65, 2.2, 0.94), new THREE.Vector3(-0.96, 2.28, 0.88)]);
whisker([new THREE.Vector3(-0.22, 2.05, 0.92), new THREE.Vector3(-0.65, 2.06, 0.94), new THREE.Vector3(-0.99, 2.02, 0.87)]);
whisker([new THREE.Vector3(0.22, 2.12, 0.91), new THREE.Vector3(0.65, 2.2, 0.94), new THREE.Vector3(0.96, 2.28, 0.88)]);
whisker([new THREE.Vector3(0.22, 2.05, 0.92), new THREE.Vector3(0.65, 2.06, 0.94), new THREE.Vector3(0.99, 2.02, 0.87)]);

function paw(x, y, z, sx, sy, sz) {
  const leg = addMesh(new THREE.SphereGeometry(1, 28, 20), yarnDark, [x, y, z], [sx, sy, sz]);
  const pad = addMesh(new THREE.SphereGeometry(1, 20, 14), padMat, [x, y - sy * 0.18, z + sz * 0.88], [sx * 0.48, sy * 0.38, 0.07]);
  pad.castShadow = false;
  return leg;
}

paw(-0.49, 0.67, 0.62, 0.3, 0.52, 0.32);
paw(0.49, 0.67, 0.62, 0.3, 0.52, 0.32);

const armLeft = addMesh(
  new THREE.SphereGeometry(1, 30, 22),
  yarnLight,
  [-0.88, 1.25, 0.28],
  [0.3, 0.72, 0.32],
  [0, 0, -0.16]
);
const armRight = addMesh(
  new THREE.SphereGeometry(1, 30, 22),
  yarnLight,
  [0.88, 1.25, 0.28],
  [0.3, 0.72, 0.32],
  [0, 0, 0.16]
);

for (let index = 0; index < 4; index++) {
  const y = 1.05 + index * 0.16;
  stitchRing(-0.9, y, 0.57, 0.72, 1.1, -0.12, yarn);
  stitchRing(0.9, y, 0.57, 0.72, 1.1, 0.12, yarn);
}

const tailPath = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.82, 0.48, -0.2),
  new THREE.Vector3(1.28, 0.25, -0.12),
  new THREE.Vector3(1.55, 0.57, -0.02),
  new THREE.Vector3(1.58, 1.02, 0.02),
  new THREE.Vector3(1.31, 1.25, 0.1),
  new THREE.Vector3(1.08, 1.13, 0.17),
  new THREE.Vector3(1.12, 0.91, 0.24)
]);
const tail = new THREE.Mesh(new THREE.TubeGeometry(tailPath, 48, 0.2, 16, false), yarnDark);
tail.castShadow = true;
tail.receiveShadow = true;
scene.add(tail);

const tailTip = addMesh(new THREE.SphereGeometry(1, 24, 16), yarnLight, [1.1, 0.91, 0.24], [0.22, 0.23, 0.2]);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(5.5, 64),
  new THREE.MeshStandardMaterial({ color: 0xd9c4ad, roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.02;
floor.receiveShadow = true;
scene.add(floor);

const shadowDisc = new THREE.Mesh(
  new THREE.CircleGeometry(1.65, 64),
  new THREE.MeshBasicMaterial({ color: 0x9b7667, transparent: true, opacity: 0.16, depthWrite: false })
);
shadowDisc.rotation.x = -Math.PI / 2;
shadowDisc.position.set(0, 0.012, 0);
shadowDisc.scale.set(1.25, 0.62, 1);
scene.add(shadowDisc);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  head.position.y = 2.45 + Math.sin(elapsed * 1.5) * 0.008;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
