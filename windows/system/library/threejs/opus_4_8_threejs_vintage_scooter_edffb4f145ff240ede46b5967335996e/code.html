<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vintage Scooter — three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #202226; }
  #c { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- Renderer ---------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* ---------------- Scene / Camera ---------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202226);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.7, 1.55, 3.25);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.target.set(0, 0.55, 0);
controls.minDistance = 1.8;
controls.maxDistance = 9;
controls.maxPolarAngle = 1.52;

/* ---------------- Environment (reflections) ---------------- */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------------- Lighting ---------------- */
const hemi = new THREE.HemisphereLight(0xbcd6e8, 0x2a2622, 0.55);
scene.add(hemi);

const ambient = new THREE.AmbientLight(0x404050, 0.25);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xfff2e0, 2.4);
key.position.set(3.2, 4.6, 3.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 16;
key.shadow.camera.left = -2.2;
key.shadow.camera.right = 2.2;
key.shadow.camera.top = 2.2;
key.shadow.camera.bottom = -2.2;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fc0e0, 0.7);
fill.position.set(-3.5, 2.2, 2.4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.3);
rim.position.set(-2.2, 3.2, -4.6);
scene.add(rim);

/* ---------------- Ground (shadow catcher only) ---------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.38 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------- Materials ---------------- */
const bodyColor = 0x8ecdbf; // retro seafoam pastel
const paintMat = new THREE.MeshPhysicalMaterial({
  color: bodyColor, metalness: 0.35, roughness: 0.32,
  clearcoat: 1.0, clearcoatRoughness: 0.18, envMapIntensity: 1.0,
  side: THREE.DoubleSide
});
const chromeMat = new THREE.MeshStandardMaterial({ color: 0xd7dce0, metalness: 1.0, roughness: 0.16, envMapIntensity: 1.3 });
const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x2b2d31, metalness: 0.85, roughness: 0.4 });
const tireMat = new THREE.MeshStandardMaterial({ color: 0x161619, metalness: 0.0, roughness: 0.85 });
const seatMat = new THREE.MeshStandardMaterial({ color: 0x4a3324, metalness: 0.1, roughness: 0.55 });
const seamMat = new THREE.MeshStandardMaterial({ color: 0xcdb497, metalness: 0.1, roughness: 0.5 });
const centerSeamMat = new THREE.MeshStandardMaterial({ color: 0x2a1d13, roughness: 0.6 });
const mirrorMat = new THREE.MeshStandardMaterial({ color: 0xf2f6f8, metalness: 1.0, roughness: 0.02, envMapIntensity: 1.4 });
const lensMat = new THREE.MeshPhysicalMaterial({ color: 0xfff3cf, emissive: 0xffe39a, emissiveIntensity: 0.9, roughness: 0.08, metalness: 0.0, clearcoat: 1.0 });
const redMat = new THREE.MeshStandardMaterial({ color: 0xd11414, emissive: 0x5a0505, emissiveIntensity: 0.6, roughness: 0.3 });
const floorMatDark = new THREE.MeshStandardMaterial({ color: 0x1c1d20, metalness: 0.2, roughness: 0.7 });
const gripMat = new THREE.MeshStandardMaterial({ color: 0x141416, roughness: 0.7 });
const badgeMat = new THREE.MeshStandardMaterial({ color: 0x2a4d8f, metalness: 0.4, roughness: 0.4 });

/* ---------------- Helpers ---------------- */
function cylinderBetween(p1, p2, r, mat) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(r, r, len, 16);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(p1).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  return mesh;
}

function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}
function roundedBox(w, h, d, r, mat) {
  r = Math.min(r, w / 2 - 0.001, h / 2 - 0.001);
  const shape = roundedRectShape(w, h, r);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: d, bevelEnabled: false, curveSegments: 6 });
  geo.translate(0, 0, -d / 2);
  return new THREE.Mesh(geo, mat);
}

function createWheel() {
  const g = new THREE.Group();
  const tire = new THREE.Mesh(new THREE.TorusGeometry(0.185, 0.062, 20, 44), tireMat);
  tire.rotation.y = Math.PI / 2;
  g.add(tire);

  const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.155, 0.155, 0.088, 36), paintMat);
  disc.rotation.z = Math.PI / 2;
  g.add(disc);

  const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.10, 0.10, 28), darkMetalMat);
  drum.rotation.z = Math.PI / 2;
  g.add(drum);

  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.11, 20), chromeMat);
  hub.rotation.z = Math.PI / 2;
  g.add(hub);

  [-1, 1].forEach(s => {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 12, 0, Math.PI * 2, 0, Math.PI / 2), chromeMat);
    cap.rotation.z = -s * Math.PI / 2;
    cap.position.x = s * 0.055;
    g.add(cap);
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * Math.PI * 2;
      const lug = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.02, 10), chromeMat);
      lug.rotation.z = Math.PI / 2;
      lug.position.set(s * 0.046, Math.cos(a) * 0.09, Math.sin(a) * 0.09);
      g.add(lug);
    }
  });
  return g;
}

function createMirror(s) {
  const g = new THREE.Group();
  const back = new THREE.Mesh(new THREE.SphereGeometry(0.05, 20, 14), chromeMat);
  back.scale.set(1.15, 1.5, 0.5);
  g.add(back);
  const face = new THREE.Mesh(new THREE.CircleGeometry(0.045, 28), mirrorMat);
  face.scale.set(1.15, 1.5, 1);
  face.position.z = -0.028;
  face.rotation.y = Math.PI;
  g.add(face);
  g.rotation.y = s * 0.4;
  g.rotation.x = 0.2;
  return g;
}

/* ---------------- Build the scooter ---------------- */
const scooter = new THREE.Group();

// Wheels
const wheelF = createWheel(); wheelF.position.set(0, 0.247, 0.62); scooter.add(wheelF);
const wheelR = createWheel(); wheelR.position.set(0, 0.247, -0.60); scooter.add(wheelR);

// Rear body pod (surface of revolution -> bulbous teardrop cowl)
const podPts = [
  [0.001, 0.10], [0.16, 0.115], [0.27, 0.155], [0.335, 0.235], [0.373, 0.33],
  [0.377, 0.44], [0.352, 0.53], [0.298, 0.60], [0.216, 0.655], [0.116, 0.687], [0.001, 0.696]
].map(p => new THREE.Vector2(p[0], p[1]));
const podGeo = new THREE.LatheGeometry(podPts, 56);
podGeo.scale(0.9, 1, 1.35);
podGeo.translate(0, 0, -0.34);
scooter.add(new THREE.Mesh(podGeo, paintMat));

// Front leg shield (curved vertical panel)
const shieldGeo = new THREE.CylinderGeometry(0.30, 0.355, 0.66, 40, 1, true, -1.15, 2.3);
const shield = new THREE.Mesh(shieldGeo, paintMat);
shield.position.set(0, 0.60, 0.40);
shield.rotation.x = -0.12;
scooter.add(shield);

// Leg-shield badge
const badge = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, 0.012, 20), chromeMat);
badge.rotation.x = Math.PI / 2; badge.position.set(0, 0.62, 0.735); scooter.add(badge);
const badgeC = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.014, 20), badgeMat);
badgeC.rotation.x = Math.PI / 2; badgeC.position.set(0, 0.62, 0.737); scooter.add(badgeC);

// Floorboard (step-through frame floor) + rubber ribs
const floor = roundedBox(0.34, 0.055, 0.52, 0.03, floorMatDark);
floor.position.set(0, 0.255, 0.19);
scooter.add(floor);
for (let i = 0; i < 5; i++) {
  const ribM = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.012, 0.012), chromeMat);
  ribM.position.set(0, 0.285, 0.03 + i * 0.075);
  scooter.add(ribM);
}

// Headset / handlebar cowl
const headset = new THREE.Mesh(new THREE.SphereGeometry(0.14, 24, 18), paintMat);
headset.scale.set(1.0, 0.85, 1.15);
headset.position.set(0, 0.97, 0.34);
scooter.add(headset);

// Fork + hub link to front wheel
scooter.add(cylinderBetween(new THREE.Vector3(0.0, 0.90, 0.37), new THREE.Vector3(0.03, 0.30, 0.60), 0.028, darkMetalMat));
scooter.add(cylinderBetween(new THREE.Vector3(0.03, 0.30, 0.60), new THREE.Vector3(0.0, 0.247, 0.62), 0.03, chromeMat));

// Front fender (mudguard over front wheel)
const fenderGeo = new THREE.CylinderGeometry(0.295, 0.295, 0.145, 28, 1, true, -0.45, 2.05);
fenderGeo.rotateZ(Math.PI / 2);
const fender = new THREE.Mesh(fenderGeo, paintMat);
fender.position.set(0, 0.247, 0.62);
scooter.add(fender);

// Handlebars
const hbCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.30, 1.045, 0.30),
  new THREE.Vector3(-0.16, 1.062, 0.335),
  new THREE.Vector3(0, 1.068, 0.345),
  new THREE.Vector3(0.16, 1.062, 0.335),
  new THREE.Vector3(0.30, 1.045, 0.30)
]);
scooter.add(new THREE.Mesh(new THREE.TubeGeometry(hbCurve, 40, 0.016, 16, false), chromeMat));

// Grips, mirror stalks + mirror heads
[-1, 1].forEach(s => {
  const inner = new THREE.Vector3(s * 0.30, 1.045, 0.30);
  const outer = new THREE.Vector3(s * 0.365, 1.04, 0.285);
  scooter.add(cylinderBetween(inner, outer, 0.024, gripMat));

  const stBot = new THREE.Vector3(s * 0.285, 1.06, 0.31);
  const stTop = new THREE.Vector3(s * 0.33, 1.21, 0.28);
  scooter.add(cylinderBetween(stBot, stTop, 0.009, chromeMat));

  const m = createMirror(s);
  m.position.copy(stTop);
  scooter.add(m);
});

// Headlight
const hl = new THREE.Group();
const bucket = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.062, 0.06, 28), chromeMat);
bucket.rotation.x = Math.PI / 2; hl.add(bucket);
const hlRim = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.013, 16, 32), chromeMat);
hlRim.position.z = 0.03; hl.add(hlRim);
const lens = new THREE.Mesh(new THREE.SphereGeometry(0.07, 26, 18, 0, Math.PI * 2, 0, Math.PI * 0.5), lensMat);
lens.rotation.x = Math.PI / 2; lens.position.z = 0.028; hl.add(lens);
hl.position.set(0, 0.95, 0.47);
hl.rotation.x = 0.12;
scooter.add(hl);

const glow = new THREE.PointLight(0xffe6ad, 0.5, 1.6, 2);
glow.position.set(0, 0.95, 0.6);
scooter.add(glow);

// Seat (single seat) + seams
const seatGeo = new THREE.CapsuleGeometry(0.135, 0.33, 10, 24);
seatGeo.rotateX(Math.PI / 2);
const seat = new THREE.Mesh(seatGeo, seatMat);
seat.scale.set(1.05, 0.7, 1.0);
seat.position.set(0, 0.72, -0.16);
scooter.add(seat);

// Piping seam around the seat edge
const pipeGeo = new THREE.TorusGeometry(0.15, 0.012, 12, 48);
pipeGeo.rotateX(Math.PI / 2);
pipeGeo.scale(0.95, 1, 1.95);
const pipe = new THREE.Mesh(pipeGeo, seamMat);
pipe.position.set(0, 0.70, -0.16);
scooter.add(pipe);

// Center top seam
const seamCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 0.810, 0.12),
  new THREE.Vector3(0, 0.815, -0.02),
  new THREE.Vector3(0, 0.815, -0.18),
  new THREE.Vector3(0, 0.805, -0.34),
  new THREE.Vector3(0, 0.785, -0.44)
]);
scooter.add(new THREE.Mesh(new THREE.TubeGeometry(seamCurve, 40, 0.006, 10, false), centerSeamMat));

// Muffler hint (rear right)
scooter.add(cylinderBetween(new THREE.Vector3(0.18, 0.14, -0.55), new THREE.Vector3(0.28, 0.16, -0.82), 0.035, darkMetalMat));

// Rear light
const rlHousing = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.05, 0.05, 20), chromeMat);
rlHousing.rotation.x = Math.PI / 2; rlHousing.position.set(0, 0.5, -0.84); scooter.add(rlHousing);
const rlLens = new THREE.Mesh(new THREE.SphereGeometry(0.045, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.5), redMat);
rlLens.rotation.x = -Math.PI / 2; rlLens.position.set(0, 0.5, -0.87); scooter.add(rlLens);

// Center kickstand
scooter.add(cylinderBetween(new THREE.Vector3(-0.12, 0.18, -0.05), new THREE.Vector3(0.12, 0.18, -0.05), 0.018, darkMetalMat));
[-1, 1].forEach(s => {
  scooter.add(cylinderBetween(new THREE.Vector3(s * 0.11, 0.18, -0.05), new THREE.Vector3(s * 0.15, 0.012, -0.21), 0.016, darkMetalMat));
});
scooter.add(cylinderBetween(new THREE.Vector3(-0.15, 0.02, -0.21), new THREE.Vector3(0.15, 0.02, -0.21), 0.014, darkMetalMat));

/* ---------------- Center + ground the object ---------------- */
const bbox = new THREE.Box3().setFromObject(scooter);
const ctr = bbox.getCenter(new THREE.Vector3());
scooter.position.x -= ctr.x;
scooter.position.z -= ctr.z;
scooter.position.y -= bbox.min.y;

scooter.traverse(o => {
  if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
});

scene.add(scooter);

/* ---------------- Resize ---------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------------- Animate ---------------- */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
