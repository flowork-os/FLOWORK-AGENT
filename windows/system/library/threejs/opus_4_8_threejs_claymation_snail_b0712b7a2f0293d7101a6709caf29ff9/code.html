<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Claymation Snail</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1f2026; }
  #app { position: fixed; inset: 0; }
  .hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: 12px/1.4 system-ui, sans-serif; color: #b9b4ad; letter-spacing: .04em;
    opacity: .55; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   Small math helpers
   ============================================================ */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}

/* ---- procedural value noise (deterministic, no Math.random in shape) ---- */
function hash3(x, y, z) {
  let n = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
  return n - Math.floor(n);
}
function vnoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const w = zf * zf * (3 - 2 * zf);
  const g = (a, b, c) => hash3(xi + a, yi + b, zi + c);
  const lerp = (a, b, t) => a + (b - a) * t;
  const x00 = lerp(g(0, 0, 0), g(1, 0, 0), u);
  const x10 = lerp(g(0, 1, 0), g(1, 1, 0), u);
  const x01 = lerp(g(0, 0, 1), g(1, 0, 1), u);
  const x11 = lerp(g(0, 1, 1), g(1, 1, 1), u);
  const y0 = lerp(x00, x10, v);
  const y1 = lerp(x01, x11, v);
  return lerp(y0, y1, w) * 2 - 1; // -1..1
}
function fbm(x, y, z) {
  let a = 0, amp = 0.5, f = 1;
  for (let o = 0; o < 4; o++) { a += amp * vnoise(x * f, y * f, z * f); f *= 2; amp *= 0.5; }
  return a;
}

/* ============================================================
   Generic swept tube along a parametric path, with varying radius.
   Reused for shell, body, eye-stalks, feelers and the smile.
   Uses a projection-minimizing frame to avoid twisting.
   ============================================================ */
function sweep(pathFn, radFn, segsU, segsV, opts = {}) {
  const capStart = opts.capStart !== false;
  const capEnd = opts.capEnd !== false;
  const pos = [], uv = [], idx = [];
  const pts = [], tans = [];

  for (let i = 0; i <= segsU; i++) pts.push(pathFn(i / segsU));
  for (let i = 0; i <= segsU; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(segsU, i + 1)];
    tans.push(new THREE.Vector3().subVectors(b, a).normalize());
  }

  // initial normal perpendicular to first tangent
  let normal = new THREE.Vector3(0, 0, 1);
  if (Math.abs(tans[0].dot(normal)) > 0.9) normal.set(0, 1, 0);
  normal.addScaledVector(tans[0], -tans[0].dot(normal)).normalize();

  const T = new THREE.Vector3(), B = new THREE.Vector3(), dir = new THREE.Vector3();
  for (let i = 0; i <= segsU; i++) {
    const u = i / segsU;
    T.copy(tans[i]);
    normal.addScaledVector(T, -T.dot(normal));
    if (normal.lengthSq() < 1e-8) normal.set(0, 0, 1).addScaledVector(T, -T.dot(new THREE.Vector3(0, 0, 1)));
    normal.normalize();
    B.crossVectors(T, normal).normalize();
    const r = radFn(u);
    for (let j = 0; j < segsV; j++) {
      const v = (j / segsV) * Math.PI * 2;
      dir.set(0, 0, 0).addScaledVector(normal, Math.cos(v) * r).addScaledVector(B, Math.sin(v) * r);
      pos.push(pts[i].x + dir.x, pts[i].y + dir.y, pts[i].z + dir.z);
      uv.push(u, j / segsV);
    }
  }
  for (let i = 0; i < segsU; i++) {
    for (let j = 0; j < segsV; j++) {
      const a = i * segsV + j, b = i * segsV + (j + 1) % segsV;
      const c = (i + 1) * segsV + j, d = (i + 1) * segsV + (j + 1) % segsV;
      idx.push(a, c, b, b, c, d);
    }
  }
  if (capStart) {
    const ci = pos.length / 3;
    pos.push(pts[0].x, pts[0].y, pts[0].z); uv.push(0.5, 0.5);
    for (let j = 0; j < segsV; j++) idx.push(ci, (j + 1) % segsV, j);
  }
  if (capEnd) {
    const off = segsU * segsV, ci = pos.length / 3;
    pos.push(pts[segsU].x, pts[segsU].y, pts[segsU].z); uv.push(0.5, 0.5);
    for (let j = 0; j < segsV; j++) idx.push(ci, off + j, off + (j + 1) % segsV);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* ---- push vertices along their normals with fbm => hand-sculpted lumps ---- */
function clayMorph(geo, freq, amp, seed = 0) {
  geo.computeVertexNormals();
  const p = geo.attributes.position, n = geo.attributes.normal;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const lump = fbm(x * freq + seed, y * freq + seed * 2.3, z * freq + seed * 1.7);
    const fine = fbm(x * freq * 3.1 + 11, y * freq * 3.1, z * freq * 3.1 - 7);
    const d = lump * amp + fine * amp * 0.28;
    p.setX(i, x + n.getX(i) * d);
    p.setY(i, y + n.getY(i) * d);
    p.setZ(i, z + n.getZ(i) * d);
  }
  p.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

/* ---- flatten the underside into a soft "foot" sole ---- */
function flattenBottom(geo, minY) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) if (p.getY(i) < minY) p.setY(i, minY);
  p.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

/* ============================================================
   Procedural bump map: soft thumb-print dimples on plasticine
   ============================================================ */
function makeClayBump() {
  const s = 512;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, s, s);
  const blob = (x, y, r, a, dark) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, dark ? `rgba(64,64,64,${a})` : `rgba(190,190,190,${a})`);
    g.addColorStop(1, 'rgba(128,128,128,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  };
  // thumb-print dimples (paired dark/light rim reads as a concave press)
  for (let i = 0; i < 260; i++) {
    const x = Math.random() * s, y = Math.random() * s, r = 8 + Math.random() * 26;
    blob(x, y, r, 0.5, true);
    blob(x - r * 0.28, y - r * 0.28, r * 0.7, 0.35, false);
  }
  // fine grain
  for (let i = 0; i < 1600; i++) blob(Math.random() * s, Math.random() * s, 2 + Math.random() * 4, 0.25, Math.random() < 0.5);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 3);
  return tex;
}
const bumpTex = makeClayBump();

/* ---- matte plasticine material ---- */
function clay(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(color),
    roughness: opts.rough ?? 0.82,
    metalness: 0.0,
    bumpMap: bumpTex,
    bumpScale: opts.bump ?? 0.02,
    side: THREE.DoubleSide,
    flatShading: false,
  });
}
function glossy(color, rough = 0.28) {
  return new THREE.MeshStandardMaterial({ color: new THREE.Color(color), roughness: rough, metalness: 0.0, side: THREE.DoubleSide });
}

/* ---- warm pastel clay palette ---- */
const COL = {
  body:  0xF3CBA0,
  shell: 0xE68C6B,
  stalk: 0xF0C097,
  cheek: 0xE88A80,
  white: 0xFBF6EE,
  pupil: 0x40332C,
  mouth: 0x8A4A3A,
};

/* ============================================================
   Build the ONE snail
   ============================================================ */
const snail = new THREE.Group();

// ---------- FOOT / BODY ----------
const bodyMat = clay(COL.body);
const bodyPath = (u) => {
  const x = -1.15 + 2.55 * u;
  const lift = smoothstep(0.55, 1.0, u);
  const y = 0.34 + 0.66 * lift * lift;
  return new THREE.Vector3(x, y, 0);
};
const bodyRad = (u) => {
  const tail = smoothstep(0.0, 0.22, u);
  const headTip = 1 - smoothstep(0.86, 1.0, u) * 0.5;
  const belly = 0.86 + 0.24 * Math.sin(u * Math.PI);
  return (0.15 + 0.24 * tail) * headTip * belly;
};
const bodyGeo = sweep(bodyPath, bodyRad, 150, 30);
clayMorph(bodyGeo, 3.4, 0.03, 4.0);
flattenBottom(bodyGeo, 0.055);
const body = new THREE.Mesh(bodyGeo, bodyMat);
snail.add(body);

// ---------- HEAD (rounder face) ----------
const HEAD = new THREE.Vector3(1.28, 0.98, 0);
const headGeo = new THREE.SphereGeometry(0.34, 40, 32);
clayMorph(headGeo, 3.8, 0.02, 9.0);
const head = new THREE.Mesh(headGeo, bodyMat);
head.position.copy(HEAD);
snail.add(head);

// ---------- SPIRAL SHELL ----------
const shellMat = clay(COL.shell, { rough: 0.8 });
const shellTurns = 3.0;
const tMax = shellTurns * Math.PI * 2;
const shellPath = (u) => {
  const t = u * tMax;
  const r = 0.30 + 0.42 * (t / (Math.PI * 2));  // Archimedean growth => visible groove
  return new THREE.Vector3(r * Math.cos(t), r * Math.sin(t), 0.16 * (1 - u));
};
const shellRad = (u) => 0.08 + 0.18 * u;          // thin apex -> fat aperture
const shellGeo = sweep(shellPath, shellRad, 460, 22);
clayMorph(shellGeo, 3.2, 0.018, 21.0);
const shell = new THREE.Mesh(shellGeo, shellMat);
shell.scale.setScalar(0.42);
shell.position.set(-0.15, 0.85, 0);
shell.rotation.set(-0.10, 0.18, -2.0);
snail.add(shell);

// ---------- EYE-STALKS + EYES ----------
const stalkMat = clay(COL.stalk);
function eyeStalk(side) {
  const base = new THREE.Vector3(1.22, 1.16, 0.15 * side);
  const path = (u) => {
    const s = Math.sin(u * Math.PI * 0.5);
    const curl = 1 - Math.cos(u * Math.PI * 0.85);
    const y = base.y + 0.60 * s - 0.10 * smoothstep(0.8, 1.0, u);
    const x = base.x + 0.16 * curl;
    const z = base.z + side * 0.10 * s;
    return new THREE.Vector3(x, y, z);
  };
  const rad = (u) => 0.072 - 0.02 * u + 0.02 * Math.max(0, Math.sin(u * Math.PI));
  const g = clayMorph(sweep(path, rad, 60, 14), 4.5, 0.008, side * 3 + 5);
  snail.add(new THREE.Mesh(g, stalkMat));

  const tip = path(1);
  // eyeball
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.135, 28, 24), glossy(COL.white, 0.22));
  eye.position.copy(tip);
  snail.add(eye);
  // pupil
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.07, 20, 18), glossy(COL.pupil, 0.2));
  pupil.position.copy(tip).add(new THREE.Vector3(0.086, 0.0, -side * 0.03));
  snail.add(pupil);
  // glint
  const glint = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 10),
    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.6, roughness: 0.4 }));
  glint.position.copy(tip).add(new THREE.Vector3(0.11, 0.055, -side * 0.05));
  snail.add(glint);
}
eyeStalk(1); eyeStalk(-1);

// ---------- LOWER FEELERS ----------
function feeler(side) {
  const path = (u) => new THREE.Vector3(
    1.50 + 0.24 * u,
    0.86 - 0.24 * u,
    side * (0.09 + 0.04 * u)
  );
  const g = clayMorph(sweep(path, (u) => 0.033 - 0.014 * u, 26, 10), 5, 0.006, side + 2);
  snail.add(new THREE.Mesh(g, stalkMat));
}
feeler(1); feeler(-1);

// ---------- CHEEKS ----------
function cheek(side) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.1, 18, 16), clay(COL.cheek, { rough: 0.85, bump: 0.01 }));
  m.position.set(1.44, 0.84, side * 0.22);
  m.scale.set(1.0, 0.8, 0.5);
  snail.add(m);
}
cheek(1); cheek(-1);

// ---------- SMILE ----------
const smileGeo = sweep(
  (u) => new THREE.Vector3(1.58, 0.80 - 0.05 * Math.cos((u - 0.5) * Math.PI), (u - 0.5) * 0.22),
  () => 0.02, 30, 8
);
snail.add(new THREE.Mesh(smileGeo, glossy(COL.mouth, 0.6)));

/* ---- shadows for every part ---- */
snail.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

/* ============================================================
   Scene / renderer
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x212228);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.7, 2.1, 4.7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

/* center the snail: horizontally at origin, resting on the ground ---- */
scene.add(snail);
snail.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(snail);
const center = box.getCenter(new THREE.Vector3());
snail.position.x -= center.x;
snail.position.z -= center.z;
snail.position.y -= box.min.y;
const objHeight = box.max.y - box.min.y;

/* ============================================================
   Lighting: hemisphere + warm key + cool fill + rim
   ============================================================ */
scene.add(new THREE.HemisphereLight(0xfff2df, 0x2a2620, 0.55));

const key = new THREE.DirectionalLight(0xfff0dc, 2.7);
key.position.set(4.2, 6.0, 4.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 5;
key.shadow.bias = -0.0002;
key.shadow.normalBias = 0.02;
const sc = key.shadow.camera;
sc.near = 0.5; sc.far = 25; sc.left = -4; sc.right = 4; sc.top = 4; sc.bottom = -4;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd6ff, 0.7);
fill.position.set(-5.0, 2.6, 2.4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffe9cf, 1.7);
rim.position.set(-3.2, 4.0, -5.2);
scene.add(rim);

/* ---- ground plane that only receives shadows ---- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   Controls
   ============================================================ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 3;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.53;
controls.target.set(0, objHeight * 0.5, 0);
controls.update();

/* ============================================================
   Resize + render loop
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
