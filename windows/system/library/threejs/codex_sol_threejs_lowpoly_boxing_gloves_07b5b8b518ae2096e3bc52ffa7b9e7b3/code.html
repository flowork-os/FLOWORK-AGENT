<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low-Poly Boxing Gloves</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #e8e1d5; }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e1d5);
scene.fog = new THREE.Fog(0xe8e1d5, 11, 22);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.9, 3.8, 8.6);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.target.set(0, -0.05, 0);
controls.minDistance = 6;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI * 0.49;

const red = new THREE.MeshStandardMaterial({
  color: 0xc9152c,
  roughness: 0.72,
  metalness: 0,
  flatShading: true
});
const darkRed = new THREE.MeshStandardMaterial({
  color: 0x8c0d20,
  roughness: 0.82,
  flatShading: true
});
const brightRed = new THREE.MeshStandardMaterial({
  color: 0xe5263e,
  roughness: 0.68,
  flatShading: true
});
const white = new THREE.MeshStandardMaterial({
  color: 0xfff8e9,
  roughness: 0.74,
  flatShading: true
});
const seam = new THREE.MeshStandardMaterial({
  color: 0x670918,
  roughness: 0.88,
  flatShading: true
});

function shadow(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function facetedBlob(radius, detail, scale, material) {
  const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(radius, detail), material);
  mesh.scale.set(scale.x, scale.y, scale.z);
  return shadow(mesh);
}

function makeCylinderBetween(a, b, radius, material, radialSegments = 6) {
  const delta = new THREE.Vector3().subVectors(b, a);
  const length = delta.length();
  const geometry = new THREE.CylinderGeometry(radius, radius, length, radialSegments, 1, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
  return shadow(mesh);
}

function createCuffGeometry() {
  const verts = new Float32Array([
    -0.72, -0.68, -0.48,   0.72, -0.68, -0.48,
     0.72, -0.68,  0.48,  -0.72, -0.68,  0.48,
    -0.62,  0.68, -0.43,   0.62,  0.68, -0.43,
     0.62,  0.68,  0.43,  -0.62,  0.68,  0.43
  ]);
  const indices = [
    0,2,1, 0,3,2,
    4,5,6, 4,6,7,
    0,1,5, 0,5,4,
    1,2,6, 1,6,5,
    2,3,7, 2,7,6,
    3,0,4, 3,4,7
  ];
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function createGlove(side) {
  const glove = new THREE.Group();

  const cuff = shadow(new THREE.Mesh(createCuffGeometry(), red));
  cuff.position.y = -1.62;
  cuff.scale.set(1.08, 1, 1.08);
  glove.add(cuff);

  const cuffBottom = shadow(new THREE.Mesh(
    new THREE.BoxGeometry(1.62, 0.18, 1.08, 1, 1, 1),
    darkRed
  ));
  cuffBottom.position.set(0, -2.28, -0.01);
  glove.add(cuffBottom);

  const wrist = facetedBlob(1, 1, new THREE.Vector3(0.72, 0.82, 0.63), darkRed);
  wrist.position.set(0, -0.72, -0.02);
  glove.add(wrist);

  const palm = facetedBlob(1, 2, new THREE.Vector3(1.03, 1.34, 0.82), red);
  palm.position.set(-0.03 * side, 0.35, 0);
  palm.rotation.z = -0.08 * side;
  glove.add(palm);

  const knuckles = facetedBlob(1, 2, new THREE.Vector3(1.2, 1.03, 0.93), brightRed);
  knuckles.position.set(-0.15 * side, 1.24, 0.03);
  knuckles.rotation.z = -0.18 * side;
  glove.add(knuckles);

  const crown = facetedBlob(1, 1, new THREE.Vector3(0.94, 0.65, 0.84), red);
  crown.position.set(-0.27 * side, 1.83, -0.05);
  crown.rotation.z = -0.22 * side;
  glove.add(crown);

  const thumbBase = facetedBlob(1, 1, new THREE.Vector3(0.64, 0.83, 0.67), darkRed);
  thumbBase.position.set(0.72 * side, 0.13, 0.28);
  thumbBase.rotation.z = -0.55 * side;
  glove.add(thumbBase);

  const thumb = facetedBlob(1, 1, new THREE.Vector3(0.58, 0.9, 0.62), red);
  thumb.position.set(0.87 * side, 0.68, 0.34);
  thumb.rotation.z = -0.78 * side;
  glove.add(thumb);

  const thumbTip = facetedBlob(1, 1, new THREE.Vector3(0.5, 0.58, 0.57), brightRed);
  thumbTip.position.set(0.67 * side, 1.18, 0.38);
  glove.add(thumbTip);

  const crease = makeCylinderBetween(
    new THREE.Vector3(0.42 * side, 0.73, 0.75),
    new THREE.Vector3(0.66 * side, 0.1, 0.7),
    0.045,
    seam,
    5
  );
  glove.add(crease);

  const trimFront = shadow(new THREE.Mesh(
    new THREE.BoxGeometry(1.42, 0.16, 0.09),
    white
  ));
  trimFront.position.set(0, -1.04, 0.515);
  glove.add(trimFront);

  const trimLeft = shadow(new THREE.Mesh(
    new THREE.BoxGeometry(0.09, 0.16, 0.94),
    white
  ));
  trimLeft.position.set(-0.69, -1.04, 0);
  glove.add(trimLeft);

  const trimRight = trimLeft.clone();
  trimRight.position.x = 0.69;
  trimRight.castShadow = true;
  glove.add(trimRight);

  const eyeletGeometry = new THREE.CylinderGeometry(0.09, 0.09, 0.055, 8);
  const laceRows = [-1.34, -1.62, -1.9];

  for (let i = 0; i < laceRows.length; i++) {
    const y = laceRows[i];
    const leftEye = shadow(new THREE.Mesh(eyeletGeometry, white));
    leftEye.rotation.x = Math.PI / 2;
    leftEye.position.set(-0.31, y, 0.548);
    glove.add(leftEye);

    const rightEye = leftEye.clone();
    rightEye.position.x = 0.31;
    rightEye.castShadow = true;
    glove.add(rightEye);
  }

  for (let i = 0; i < laceRows.length - 1; i++) {
    const y0 = laceRows[i];
    const y1 = laceRows[i + 1];
    glove.add(makeCylinderBetween(
      new THREE.Vector3(-0.31, y0, 0.59),
      new THREE.Vector3(0.31, y1, 0.59),
      0.045,
      white,
      5
    ));
    glove.add(makeCylinderBetween(
      new THREE.Vector3(0.31, y0, 0.6),
      new THREE.Vector3(-0.31, y1, 0.6),
      0.045,
      white,
      5
    ));
  }

  const topLace = makeCylinderBetween(
    new THREE.Vector3(-0.31, -1.34, 0.59),
    new THREE.Vector3(0.31, -1.34, 0.59),
    0.04,
    white,
    5
  );
  glove.add(topLace);

  const sideSeam = makeCylinderBetween(
    new THREE.Vector3(-0.67 * side, -2.11, 0.3),
    new THREE.Vector3(-0.59 * side, -1.18, 0.42),
    0.035,
    seam,
    5
  );
  glove.add(sideSeam);

  return glove;
}

const gloves = new THREE.Group();

const leftGlove = createGlove(1);
leftGlove.position.set(-0.82, 0.14, 0.02);
leftGlove.rotation.set(-0.07, -0.12, 0.23);
gloves.add(leftGlove);

const rightGlove = createGlove(-1);
rightGlove.position.set(0.82, 0.14, -0.05);
rightGlove.rotation.set(0.07, 0.12, -0.23);
gloves.add(rightGlove);

const joiningLace = new THREE.Group();
joiningLace.add(makeCylinderBetween(
  new THREE.Vector3(-0.42, -1.94, 0.71),
  new THREE.Vector3(0.42, -2.02, 0.71),
  0.055,
  white,
  6
));
joiningLace.add(makeCylinderBetween(
  new THREE.Vector3(-0.16, -1.99, 0.72),
  new THREE.Vector3(-0.5, -2.34, 0.78),
  0.045,
  white,
  5
));
joiningLace.add(makeCylinderBetween(
  new THREE.Vector3(0.16, -1.99, 0.72),
  new THREE.Vector3(0.5, -2.34, 0.78),
  0.045,
  white,
  5
));
const knot = facetedBlob(1, 1, new THREE.Vector3(0.17, 0.13, 0.12), white);
knot.position.set(0, -2, 0.74);
joiningLace.add(knot);
gloves.add(joiningLace);

gloves.rotation.x = -0.08;
gloves.position.y = 0.35;
scene.add(gloves);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xd7cdbd,
  roughness: 0.96,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(7.5, 64), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.3;
floor.receiveShadow = true;
scene.add(floor);

const pedestal = new THREE.Mesh(
  new THREE.CylinderGeometry(2.65, 2.85, 0.18, 12),
  new THREE.MeshStandardMaterial({
    color: 0xbcae9c,
    roughness: 0.9,
    flatShading: true
  })
);
pedestal.position.y = -2.2;
pedestal.receiveShadow = true;
pedestal.castShadow = true;
scene.add(pedestal);

const hemi = new THREE.HemisphereLight(0xfff5df, 0x6e7180, 2.25);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff0dc, 4.4);
key.position.set(-4.5, 7, 5.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -5;
key.shadow.camera.near = 1;
key.shadow.camera.far = 20;
key.shadow.bias = -0.0005;
scene.add(key);

const rim = new THREE.DirectionalLight(0xaac9ff, 2.2);
rim.position.set(5, 3, -5);
scene.add(rim);

const fill = new THREE.DirectionalLight(0xff8f84, 1.1);
fill.position.set(-4, 0, 2);
scene.add(fill);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
}
addEventListener('resize', resize);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  gloves.position.y = 0.35 + Math.sin(t * 1.15) * 0.035;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
