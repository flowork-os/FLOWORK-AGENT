<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bronze Age Helmet</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #11100d;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15130f);
scene.fog = new THREE.Fog(0x15130f, 7, 15);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.6, 2.5, 4.7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.25;
controls.minDistance = 3;
controls.maxDistance = 8;
controls.target.set(0, 0.85, 0);

const bronze = new THREE.MeshStandardMaterial({
  color: 0x875d32,
  metalness: 0.78,
  roughness: 0.31
});
const darkBronze = new THREE.MeshStandardMaterial({
  color: 0x4d3926,
  metalness: 0.7,
  roughness: 0.48
});
const patina = new THREE.MeshStandardMaterial({
  color: 0x31534b,
  metalness: 0.42,
  roughness: 0.62
});
const polishedEdge = new THREE.MeshStandardMaterial({
  color: 0xb18045,
  metalness: 0.88,
  roughness: 0.22
});

function addMesh(geometry, material, position = [0, 0, 0], rotation = [0, 0, 0], scale = [1, 1, 1]) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(...position);
  mesh.rotation.set(...rotation);
  mesh.scale.set(...scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

const domeProfile = [
  new THREE.Vector2(0.035, 1.67),
  new THREE.Vector2(0.22, 1.70),
  new THREE.Vector2(0.52, 1.63),
  new THREE.Vector2(0.79, 1.46),
  new THREE.Vector2(1.02, 1.20),
  new THREE.Vector2(1.19, 0.88),
  new THREE.Vector2(1.25, 0.61),
  new THREE.Vector2(1.25, 0.53),
  new THREE.Vector2(1.105, 0.53),
  new THREE.Vector2(1.07, 0.68),
  new THREE.Vector2(0.96, 1.00),
  new THREE.Vector2(0.75, 1.29),
  new THREE.Vector2(0.48, 1.47),
  new THREE.Vector2(0.22, 1.55),
  new THREE.Vector2(0.035, 1.54)
];
addMesh(new THREE.LatheGeometry(domeProfile, 96), bronze);

addMesh(
  new THREE.TorusGeometry(1.205, 0.072, 12, 96),
  polishedEdge,
  [0, 0.55, 0],
  [Math.PI / 2, 0, 0]
);

function createRidge() {
  const sections = [-1.06, -0.78, -0.45, 0, 0.45, 0.78, 1.06];
  const vertices = [];
  const indices = [];
  for (const z of sections) {
    const ratio = Math.min(Math.abs(z) / 1.12, 1);
    const domeY = 1.67 - 0.8 * Math.pow(ratio, 1.65);
    const width = 0.14 - 0.035 * ratio;
    const topWidth = width * 0.56;
    const bottomY = domeY - 0.025;
    const topY = domeY + 0.19 - 0.045 * ratio;
    vertices.push(
      -width, bottomY, z,
       width, bottomY, z,
      -topWidth, topY, z,
       topWidth, topY, z
    );
  }
  for (let i = 0; i < sections.length - 1; i++) {
    const a = i * 4;
    const b = (i + 1) * 4;
    indices.push(
      a, b, a + 2, a + 2, b, b + 2,
      a + 1, a + 3, b + 1, b + 1, a + 3, b + 3,
      a + 2, b + 2, a + 3, a + 3, b + 2, b + 3
    );
  }
  indices.push(0, 2, 1, 1, 2, 3);
  const n = (sections.length - 1) * 4;
  indices.push(n, n + 1, n + 2, n + 1, n + 3, n + 2);
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}
addMesh(createRidge(), polishedEdge);

const guardShape = new THREE.Shape();
guardShape.moveTo(-0.95, 0.62);
guardShape.lineTo(0.95, 0.62);
guardShape.lineTo(1.14, 0.25);
guardShape.lineTo(1.04, 0.04);
guardShape.lineTo(-1.04, 0.04);
guardShape.lineTo(-1.14, 0.25);
guardShape.closePath();

addMesh(
  new THREE.ExtrudeGeometry(guardShape, {
    depth: 0.18,
    bevelEnabled: true,
    bevelSegments: 3,
    bevelSize: 0.035,
    bevelThickness: 0.035,
    curveSegments: 8
  }),
  bronze,
  [0, 0, 0.78]
);

const cheekShape = new THREE.Shape();
cheekShape.moveTo(-0.52, 0.86);
cheekShape.lineTo(0.17, 0.80);
cheekShape.lineTo(0.38, 0.59);
cheekShape.lineTo(0.29, 0.16);
cheekShape.lineTo(-0.08, 0.05);
cheekShape.lineTo(-0.42, 0.22);
cheekShape.closePath();

const cheekGeometry = new THREE.ExtrudeGeometry(cheekShape, {
  depth: 0.13,
  bevelEnabled: true,
  bevelSegments: 3,
  bevelSize: 0.035,
  bevelThickness: 0.03,
  curveSegments: 8
});

addMesh(cheekGeometry, bronze, [-1.115, 0, 0], [0, Math.PI / 2, 0]);
addMesh(cheekGeometry, bronze, [1.115, 0, 0], [0, -Math.PI / 2, 0]);

const cheekRimGeometry = new THREE.TorusGeometry(0.06, 0.018, 8, 20);
for (const side of [-1, 1]) {
  addMesh(cheekRimGeometry, polishedEdge, [side * 1.19, 0.46, -0.32], [0, Math.PI / 2, 0], [1, 2.8, 1]);
  addMesh(
    new THREE.SphereGeometry(0.085, 16, 12),
    polishedEdge,
    [side * 1.24, 0.77, -0.14],
    [0, 0, 0],
    [1, 1, 0.7]
  );
  addMesh(
    new THREE.SphereGeometry(0.085, 16, 12),
    polishedEdge,
    [side * 1.23, 0.32, -0.2],
    [0, 0, 0],
    [1, 1, 0.7]
  );
}

const dentData = [
  [0.77, 1.20, -0.72, 0.16, 0.055, 0.10],
  [-0.84, 1.08, -0.36, 0.12, 0.045, 0.08],
  [0.92, 0.86, 0.22, 0.13, 0.04, 0.09],
  [-0.67, 1.42, 0.28, 0.10, 0.035, 0.07]
];

for (const [x, y, z, sx, sy, sz] of dentData) {
  addMesh(
    new THREE.SphereGeometry(1, 16, 10),
    darkBronze,
    [x, y, z],
    [0.2, 0.4, 0.1],
    [sx, sy, sz]
  );
}

const patinaData = [
  [0.43, 1.48, -0.42, 0.12, 0.035, 0.08],
  [-0.51, 1.31, 0.50, 0.15, 0.04, 0.07],
  [0.88, 0.82, -0.12, 0.10, 0.025, 0.11],
  [-0.91, 0.96, 0.30, 0.09, 0.03, 0.08],
  [0.23, 1.61, 0.35, 0.08, 0.025, 0.06]
];

for (const [x, y, z, sx, sy, sz] of patinaData) {
  addMesh(
    new THREE.SphereGeometry(1, 14, 8),
    patina,
    [x, y, z],
    [0.4, 0.1, 0.5],
    [sx, sy, sz]
  );
}

for (const z of [-0.9, -0.48, 0, 0.48, 0.9]) {
  addMesh(
    new THREE.SphereGeometry(0.045, 16, 10),
    polishedEdge,
    [0, 0.57, z],
    [0, 0, 0],
    [1, 0.65, 1]
  );
}

const floor = new THREE.Mesh(
  new THREE.CylinderGeometry(3.8, 4.2, 0.16, 96),
  new THREE.MeshStandardMaterial({ color: 0x29231b, roughness: 0.86, metalness: 0.05 })
);
floor.position.y = -0.13;
floor.receiveShadow = true;
scene.add(floor);

const hemi = new THREE.HemisphereLight(0xc7d0c7, 0x2b170b, 2.0);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffd5a0, 3.6);
key.position.set(-3.5, 6, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -2;
scene.add(key);

const fill = new THREE.PointLight(0x6f9da0, 22, 8, 2);
fill.position.set(3, 1.8, -3);
scene.add(fill);

const warmRim = new THREE.SpotLight(0xff8c42, 16, 10, Math.PI / 5, 0.5, 1.5);
warmRim.position.set(0, 4.5, -4);
warmRim.target.position.set(0, 0.8, 0);
scene.add(warmRim, warmRim.target);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

animate();
</script>
</body>
</html>
