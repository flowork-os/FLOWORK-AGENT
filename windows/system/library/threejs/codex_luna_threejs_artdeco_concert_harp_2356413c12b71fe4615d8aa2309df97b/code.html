<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Deco Concert Harp</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080a12;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080a12);
scene.fog = new THREE.Fog(0x080a12, 14, 28);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(8.6, 5.9, 11.5);
camera.lookAt(0, 3.25, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.25, 3.25, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.065;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 7;
controls.maxDistance = 17;
controls.maxPolarAngle = Math.PI * 0.48;

const blackLacquer = new THREE.MeshPhysicalMaterial({
  color: 0x030509,
  metalness: 0.78,
  roughness: 0.17,
  clearcoat: 1,
  clearcoatRoughness: 0.08
});

const blackEdge = new THREE.MeshPhysicalMaterial({
  color: 0x0b0d14,
  metalness: 0.68,
  roughness: 0.24,
  clearcoat: 1,
  clearcoatRoughness: 0.12
});

const gold = new THREE.MeshPhysicalMaterial({
  color: 0xb7832e,
  metalness: 0.92,
  roughness: 0.23
});

const brightGold = new THREE.MeshPhysicalMaterial({
  color: 0xf0c866,
  metalness: 0.9,
  roughness: 0.18
});

const stringMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xd9b45e,
  metalness: 0.86,
  roughness: 0.2
});

const lightStringMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xe6ded0,
  metalness: 0.55,
  roughness: 0.25
});

const floorMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x11151e,
  metalness: 0.52,
  roughness: 0.3
});

const harp = new THREE.Group();
harp.position.set(0, 0, 0);
scene.add(harp);

function addBlock(size, position, material, rotationZ = 0) {
  const geometry = new THREE.BoxGeometry(size[0], size[1], size[2]);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(position[0], position[1], position[2]);
  mesh.rotation.z = rotationZ;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  harp.add(mesh);
  return mesh;
}

function addBeam(pointA, pointB, width, depth, material) {
  const direction = pointB.clone().sub(pointA);
  const length = direction.length();
  const geometry = new THREE.BoxGeometry(length, width, depth);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(pointA).add(pointB).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  harp.add(mesh);
  return mesh;
}

function addExtrudedPanel(points, depth, material, zPosition, bevelSize) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i += 1) {
    shape.lineTo(points[i][0], points[i][1]);
  }
  shape.closePath();

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: true,
    bevelSegments: 2,
    bevelSize,
    bevelThickness: bevelSize,
    steps: 1
  });
  geometry.computeVertexNormals();

  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.z = zPosition;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  harp.add(mesh);
  return mesh;
}

function addSphere(radius, position, material, widthSegments = 16, heightSegments = 10) {
  const geometry = new THREE.SphereGeometry(radius, widthSegments, heightSegments);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(position);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  harp.add(mesh);
  return mesh;
}

function addCylinder(radius, height, position, material, radialSegments = 12, rotationX = 0, rotationZ = 0) {
  const geometry = new THREE.CylinderGeometry(radius, radius, height, radialSegments);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(position);
  mesh.rotation.x = rotationX;
  mesh.rotation.z = rotationZ;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  harp.add(mesh);
  return mesh;
}

addBlock([7.2, 0.14, 5.2], [0, -0.18, 0], floorMaterial);
const stage = new THREE.Mesh(
  new THREE.CylinderGeometry(3.65, 3.65, 0.18, 64),
  new THREE.MeshPhysicalMaterial({ color: 0x0b0e16, metalness: 0.72, roughness: 0.25 })
);
stage.position.set(-0.15, -0.06, 0);
stage.castShadow = true;
stage.receiveShadow = true;
scene.add(stage);

const stageTrim = new THREE.Mesh(
  new THREE.TorusGeometry(3.45, 0.035, 8, 96),
  brightGold
);
stageTrim.rotation.x = Math.PI / 2;
stageTrim.position.set(-0.15, 0.04, 0);
stageTrim.castShadow = true;
scene.add(stageTrim);

addBlock([0.86, 0.18, 0.9], [-2.15, 0.28, 0], gold);
addBlock([0.66, 0.16, 0.72], [-2.15, 0.46, 0], blackLacquer);
addBlock([0.76, 0.12, 0.8], [-2.15, 0.57, 0], brightGold);
addBlock([0.57, 5.2, 0.62], [-2.15, 3.16, 0], gold);
addBlock([0.29, 4.66, 0.045], [-2.15, 3.2, 0.34], blackLacquer);
addBlock([0.075, 4.92, 0.08], [-2.43, 3.2, 0.35], brightGold);
addBlock([0.075, 4.92, 0.08], [-1.87, 3.2, 0.35], brightGold);

for (let y = 0.92; y <= 5.42; y += 0.72) {
  addBeam(
    new THREE.Vector3(-2.31, y + 0.16, 0.395),
    new THREE.Vector3(-2.15, y - 0.13, 0.395),
    0.052,
    0.045,
    brightGold
  );
  addBeam(
    new THREE.Vector3(-2.15, y - 0.13, 0.395),
    new THREE.Vector3(-1.99, y + 0.16, 0.395),
    0.052,
    0.045,
    brightGold
  );
}

addBlock([0.86, 0.18, 0.92], [-2.15, 5.84, 0], gold);
addBlock([0.72, 0.15, 0.82], [-2.15, 6.01, 0], blackLacquer);
addBlock([0.62, 0.13, 0.72], [-2.15, 6.15, 0], brightGold);
addBlock([0.44, 0.12, 0.58], [-2.15, 6.28, 0], gold);

const rearPanelPoints = [
  [-2.32, 0.55],
  [-1.45, 0.34],
  [1.64, 4.52],
  [1.49, 5.18],
  [-2.06, 1.08]
];
addExtrudedPanel(rearPanelPoints, 0.62, blackEdge, -0.2, 0.035);

const frontPanelPoints = [
  [-2.12, 0.72],
  [-1.62, 0.64],
  [1.43, 4.63],
  [1.29, 4.94],
  [-1.93, 1.03]
];
addExtrudedPanel(frontPanelPoints, 0.18, blackLacquer, 0.29, 0.025);

const panelEdges = [
  [[-2.12, 0.72], [-1.62, 0.64]],
  [[-1.62, 0.64], [1.43, 4.63]],
  [[1.43, 4.63], [1.29, 4.94]],
  [[1.29, 4.94], [-1.93, 1.03]],
  [[-1.93, 1.03], [-2.12, 0.72]]
];

for (const edge of panelEdges) {
  addBeam(
    new THREE.Vector3(edge[0][0], edge[0][1], 0.505),
    new THREE.Vector3(edge[1][0], edge[1][1], 0.505),
    0.065,
    0.052,
    brightGold
  );
}

addBeam(
  new THREE.Vector3(-1.84, 0.94, 0.535),
  new THREE.Vector3(1.22, 4.79, 0.535),
  0.026,
  0.035,
  gold
);

const lowerAccentA = new THREE.Vector3(-1.68, 0.72, 0.53);
const lowerAccentB = new THREE.Vector3(1.35, 4.68, 0.53);
addBeam(lowerAccentA, lowerAccentB, 0.025, 0.034, gold);

for (let i = 0; i < 5; i += 1) {
  const t = (i + 1) / 6;
  const x = -1.95 + (1.3 + 1.95) * t;
  const y = 1.0 + (4.87 - 1.0) * t;
  addSphere(0.052, new THREE.Vector3(x, y, 0.57), brightGold, 12, 8);
}

const neckPoints = [
  new THREE.Vector3(-2.15, 6.28, 0),
  new THREE.Vector3(-1.36, 6.34, 0),
  new THREE.Vector3(-0.46, 6.12, 0),
  new THREE.Vector3(0.46, 5.78, 0),
  new THREE.Vector3(1.35, 5.08, 0)
];

for (let i = 0; i < neckPoints.length - 1; i += 1) {
  const first = neckPoints[i];
  const second = neckPoints[i + 1];
  addBeam(first, second, 0.48, 0.6, blackEdge);
  addBeam(
    new THREE.Vector3(first.x, first.y + 0.18, 0.36),
    new THREE.Vector3(second.x, second.y + 0.18, 0.36),
    0.055,
    0.05,
    brightGold
  );
  addBeam(
    new THREE.Vector3(first.x, first.y - 0.18, 0.38),
    new THREE.Vector3(second.x, second.y - 0.18, 0.38),
    0.04,
    0.045,
    gold
  );
}

addBeam(
  new THREE.Vector3(-1.56, 6.11, 0.45),
  new THREE.Vector3(1.2, 5.09, 0.45),
  0.075,
  0.11,
  brightGold
);

const crownCenter = new THREE.Vector3(-1.42, 6.3, 0.49);
const crownDisc = addCylinder(0.38, 0.1, crownCenter, blackLacquer, 32, Math.PI / 2);
crownDisc.rotation.z = 0;

for (let i = 0; i < 8; i += 1) {
  const angle = (20 + i * 20) * Math.PI / 180;
  const radius = 0.73 + (i % 2) * 0.11;
  const endPoint = new THREE.Vector3(
    crownCenter.x + Math.cos(angle) * radius,
    crownCenter.y + Math.sin(angle) * radius,
    0.565
  );
  addBeam(crownCenter.clone().setZ(0.565), endPoint, 0.06, 0.055, brightGold);
}
addSphere(0.115, new THREE.Vector3(crownCenter.x, crownCenter.y, 0.61), brightGold, 20, 12);

addBlock([0.28, 0.9, 0.08], [-1.42, 6.7, 0.46], gold);
addBlock([0.58, 0.08, 0.1], [-1.42, 6.25, 0.45], brightGold);

const diamond = addBlock([0.19, 0.19, 0.055], [-2.15, 5.58, 0.405], brightGold, Math.PI / 4);
diamond.castShadow = true;

const stringCount = 30;
for (let i = 0; i < stringCount; i += 1) {
  const fraction = i / (stringCount - 1);
  const x = -1.53 + fraction * 2.69;
  const bottomY = 1.08 + fraction * 3.17;
  const topY = 6.11 - fraction * 0.99;
  const length = topY - bottomY;
  const material = i % 5 === 0 ? lightStringMaterial : stringMaterial;

  addCylinder(
    0.014 + (1 - fraction) * 0.008,
    length,
    new THREE.Vector3(x, (bottomY + topY) * 0.5, 0.64),
    material,
    8
  );

  addCylinder(
    0.046,
    0.17,
    new THREE.Vector3(x, topY, 0.665),
    brightGold,
    10,
    Math.PI / 2
  );

  addSphere(0.035, new THREE.Vector3(x, bottomY, 0.67), brightGold, 10, 7);
}

const soundboardBadge = addCylinder(
  0.27,
  0.055,
  new THREE.Vector3(-1.76, 1.13, 0.59),
  blackLacquer,
  24,
  Math.PI / 2
);
soundboardBadge.rotation.z = Math.PI / 4;

for (let i = 0; i < 4; i += 1) {
  const badgeY = 0.94 + i * 0.12;
  addBeam(
    new THREE.Vector3(-1.92, badgeY, 0.64),
    new THREE.Vector3(-1.67, badgeY + 0.17, 0.64),
    0.022,
    0.028,
    brightGold
  );
}

harp.traverse((object) => {
  if (object.isMesh) {
    object.castShadow = true;
    object.receiveShadow = true;
  }
});

const hemisphere = new THREE.HemisphereLight(0x9baed0, 0x171015, 2.2);
scene.add(hemisphere);

const keyLight = new THREE.DirectionalLight(0xffe2ad, 4.1);
keyLight.position.set(-5, 9, 8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 10;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 25;
scene.add(keyLight);

const rimLight = new THREE.PointLight(0x6d8dff, 10, 15, 2);
rimLight.position.set(4, 5, -4);
scene.add(rimLight);

const warmLight = new THREE.SpotLight(0xffbf6b, 18, 18, Math.PI / 7, 0.55, 1.5);
warmLight.position.set(-4, 8, 5);
warmLight.target.position.set(-0.8, 3.1, 0);
warmLight.castShadow = true;
warmLight.shadow.mapSize.set(1024, 1024);
scene.add(warmLight);
scene.add(warmLight.target);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
