const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(

  antialias: true,
  powerPreference: "high-performance"
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;
controls.minDistance = 10;
controls.maxDistance = 34;
controls.maxPolarAngle = Math.PI * 0.48;
controls.target.set(0, 3.6, -1.5);

const clock = new THREE.Clock();
const seeded = 0x6d2b79;
let randomState = seeded;

function random() {
  randomState = (randomState * 1664525 + 1013904223) >>> 0;
  return randomState / 4294967296;
}

function randomRange(min, max) {
  return min + (max - min) * random();
}

function randomSign() {
  return random() < 0.5 ? -1 : 1;
}

function standardMaterial(color, roughness = 0.65, metalness = 0.05) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness
  });
}

function glowMaterial(color, intensity = 1.5, opacity = 1) {
  return new THREE.MeshBasicMaterial({
    color,
    transparent: opacity < 1,
    opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
}

function addMesh(geometry, material, position = [0, 0, 0], scale = [1, 1, 1]) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(position[0], position[1], position[2]);
  object.scale.set(scale[0], scale[1], scale[2]);
  object.castShadow = true;
  object.receiveShadow = true;
  scene.add(object);
  return object;
}

function cylinderBetween(start, end, radius, material, radialSegments = 12) {
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
  const geometry = new THREE.CylinderGeometry(
    radius,
    radius * 0.92,
    length,
    radialSegments
  );
  const object = new THREE.Mesh(geometry, material);
  object.position.copy(midpoint);
  object.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  object.castShadow = true;
  object.receiveShadow = true;
  scene.add(object);
  return object;
}

function makeStoneTexture() {
  const canvas = document.createElement("canvas");
  canvas.width = 256;
  canvas.height = 256;
  const context = canvas.getContext("2d");
  context.fillStyle = "#697184";
  context.fillRect(0, 0, 256, 256);

  for (let i = 0; i < 850; i += 1) {
    const x = random() * 256;
    const y = random() * 256;
    const size = randomRange(1, 4);
    const shade = Math.floor(randomRange(70, 145));
    context.fillStyle = `rgba(${shade},${shade + 5},${shade + 14},${randomRange(0.08, 0.28)})`;
    context.fillRect(x, y, size, size);
  }

  for (let i = 0; i < 18; i += 1) {
    context.strokeStyle = "rgba(22, 29, 49, 0.28)";
    context.lineWidth = randomRange(1, 3);
    context.beginPath();
    context.moveTo(random() * 256, random() * 256);
    context.lineTo(random() * 256, random() * 256);
    context.stroke();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(3, 3);
  return texture;
}

function makeBannerTexture(baseColor, trimColor) {
  const canvas = document.createElement("canvas");
  canvas.width = 128;
  canvas.height = 256;
  const context = canvas.getContext("2d");
  context.fillStyle = baseColor;
  context.fillRect(0, 0, 128, 256);
  context.fillStyle = trimColor;
  context.fillRect(0, 0, 12, 256);
  context.fillRect(116, 0, 12, 256);
  context.beginPath();
  context.moveTo(12, 205);
  context.lineTo(64, 256);
  context.lineTo(116, 205);
  context.lineTo(116, 256);
  context.lineTo(12, 256);
  context.closePath();
  context.fill();
  context.strokeStyle = "rgba(255,255,255,0.42)";
  context.lineWidth = 4;
  context.beginPath();
  context.moveTo(64, 30);
  context.lineTo(64, 175);
  context.moveTo(38, 84);
  context.lineTo(90, 84);
  context.moveTo(45, 135);
  context.lineTo(83, 135);
  context.stroke();
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function createSpellbook(index) {
  const book = new THREE.Group();
  const hueColors = [0x592d83, 0x254e76, 0x7d3c4a, 0x2d675f, 0x7b5b2b];
  const coverColor = hueColors[index % hueColors.length];

  const coverBottom = new THREE.Mesh(
    new THREE.BoxGeometry(1.08, 0.12, 0.76),
    new THREE.MeshStandardMaterial({
      color: coverColor,
      roughness: 0.58,
      metalness: 0.12
    })
  );
  coverBottom.castShadow = true;
  book.add(coverBottom);

  const pages = new THREE.Mesh(
    new THREE.BoxGeometry(0.93, 0.22, 0.62),
    parchmentMaterial
  );
  pages.position.y = 0.14;
  pages.castShadow = true;
  book.add(pages);

  const coverTop = new THREE.Mesh(
    new THREE.BoxGeometry(1.08, 0.12, 0.76),
    new THREE.MeshStandardMaterial({
      color: coverColor,
      roughness: 0.55,
      metalness: 0.18
    })
  );
  coverTop.position.y = 0.3;
  coverTop.castShadow = true;
  book.add(coverTop);

  const clasp = new THREE.Mesh(
    new THREE.BoxGeometry(0.1, 0.12, 0.48),
    brassMaterial
  );
  clasp.position.set(0, 0.37, 0);
  clasp.castShadow = true;
  book.add(clasp);

  const rune = new THREE.Mesh(
    new THREE.RingGeometry(0.11, 0.15, 6),
    glowMaterial(0x82eaff, 1.2, 0.75)
  );
  rune.rotation.x = -Math.PI / 2;
  rune.position.y = 0.37;
  book.add(rune);

  book.rotation.set(
    randomRange(-0.28, 0.28),
    randomRange(-Math.PI, Math.PI),
    randomRange(-0.2, 0.2)
  );
  book.userData.floatPhase = randomRange(0, Math.PI * 2);
  book.userData.floatHeight = randomRange(0.04, 0.12);
  return book;
}

const spellbooks = [];
for (let i = 0; i < 5; i += 1) {
  const book = createSpellbook(i);
  const angle = (i / 5) * Math.PI * 2;
  const radius = randomRange(3.65, 4.25);
  book.position.set(
    Math.cos(angle) * radius,
    randomRange(0.45, 1.45),
    Math.sin(angle) * radius
  );

  book.userData.orbitRadius = radius;
  book.userData.orbitSpeed = randomRange(0.1, 0.19) * randomSign();

  spellbooks.push(book);
}

const bannerData = [];

function createBanner(x, z, rotationY, baseColor, trimColor) {
  const poleGroup = new THREE.Group();
  poleGroup.position.set(x, -1.78, z);
  poleGroup.rotation.y = rotationY;
  scene.add(poleGroup);

  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.055, 0.075, 5.2, 12),
    darkBrassMaterial
  );
  pole.position.y = 2.58;
  pole.castShadow = true;
  poleGroup.add(pole);

  const finial = new THREE.Mesh(
    new THREE.SphereGeometry(0.19, 16, 10),
    brassMaterial
  );
  finial.position.y = 5.22;
  finial.castShadow = true;
  poleGroup.add(finial);

  const bannerGeometry = new THREE.PlaneGeometry(1.62, 3.25, 10, 14);
  const bannerTexture = makeBannerTexture(baseColor, trimColor);
  const bannerMaterial = new THREE.MeshStandardMaterial({
    map: bannerTexture,
    side: THREE.DoubleSide,
    roughness: 0.8,
    metalness: 0.03
  });
  const banner = new THREE.Mesh(bannerGeometry, bannerMaterial);
  banner.position.set(0.78, 3.68, 0);
  banner.rotation.y = -Math.PI / 2;
  banner.castShadow = true;
  poleGroup.add(banner);

  bannerData.push({
    geometry: bannerGeometry,
    phase: randomRange(0, Math.PI * 2),
    strength: randomRange(0.14, 0.27)
  });
}

function makeLightningBolt(x, y, z, scale) {
  const positions = [];
  let current = new THREE.Vector3(x, y, z);
  for (let i = 0; i < 8; i += 1) {
    const next = new THREE.Vector3(
      current.x + randomRange(-0.72, 0.72) * scale,
      current.y - randomRange(0.55, 1.05) * scale,
      current.z + randomRange(-0.28, 0.28) * scale
    );
    positions.push(current.x, current.y, current.z);
    positions.push(next.x, next.y, next.z);
    current = next;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(positions, 3)
  );
  const material = new THREE.LineBasicMaterial({
    color: 0xb9eaff,
    transparent: true,
    opacity: 0.95,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const bolt = new THREE.LineSegments(geometry, material);
  lightningGroup.add(bolt);
  return bolt;
}

const animate = () => {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  const pulse = 1 + Math.sin(elapsed * 2.2) * 0.07;
  orbCore.scale.setScalar(pulse);
  orbAura.scale.setScalar(1 + Math.sin(elapsed * 1.7) * 0.13);
  orbLight.intensity = 4.2 + Math.sin(elapsed * 2.4) * 0.8;

  for (const child of orbAnchor.children) {
    if (child.geometry && child.geometry.type === "TorusGeometry") {
      child.rotation.y += child.userData.spin * 0.012;
      child.rotation.x += child.userData.spin * 0.006;
    }
  }

  bookOrbit.rotation.y = elapsed * 0.075;
  for (const book of spellbooks) {
    book.userData.orbitAngle += book.userData.orbitSpeed * 0.01;
    book.position.x = Math.cos(book.userData.orbitAngle) * book.userData.orbitRadius;
    book.position.z = Math.sin(book.userData.orbitAngle) * book.userData.orbitRadius;
    book.position.y += Math.sin(elapsed * 1.2 + book.userData.floatPhase) * 0.0025;
    book.rotation.y += 0.003 * randomSign();
  }

  for (let i = 0; i < cloudBlobs.length; i += 1) {
    const cloudData = cloudBlobs[i];
    const cloud = cloudData.object;
    cloud.position.x =
      cloudData.origin.x +
      Math.sin(elapsed * cloudData.speed + cloudData.phase) * 0.65;
    cloud.position.y =
      cloudData.origin.y +
      Math.sin(elapsed * cloudData.speed * 0.7 + cloudData.phase) * 0.24;
    cloud.rotation.y += 0.0008 * (i % 2 === 0 ? 1 : -1);
  }

  for (let i = 0; i < stormRings.length; i += 1) {
    stormRings[i].rotation.z += 0.0008 * (i % 2 === 0 ? 1 : -1);
    stormRings[i].material.opacity =
      0.18 + Math.sin(elapsed * 0.8 + i) * 0.05;
  }

  for (const data of bannerData) {
    const positions = data.geometry.attributes.position;
    for (let i = 0; i < positions.count; i += 1) {
      const x = positions.getX(i);
      const y = positions.getY(i);
      const wave =
        Math.sin(y * 2.1 + elapsed * 3.4 + data.phase) *
        data.strength *
        (0.35 + (x + 0.81) / 1.62);
      positions.setZ(i, wave);
    }
    positions.needsUpdate = true;
  }

  const torchChildren = torchGroup.children;
  for (let i = 0; i < torchChildren.length; i += 1) {
    const torch = torchChildren[i];
    const flicker = 1 + Math.sin(elapsed * 9 + i) * 0.14;
    torch.userData.flame.scale.y = 1.65 * flicker;
    torch.userData.light.intensity = 1.35 + Math.sin(elapsed * 8 + i) * 0.3;
  }

  const lightningCycle = elapsed % 12.5;
  if (lightningCycle > 8.5 && lightningCycle < 8.72) {
    lightningGroup.visible = true;
    const fadeIn = Math.min((lightningCycle - 8.5) / 0.035, 1);
    const fadeOut = Math.min((8.72 - lightningCycle) / 0.12, 1);
    lightningFlash.intensity = 18 * fadeIn * fadeOut;
  } else {
    lightningGroup.visible = false;
    lightningFlash.intensity = 0;
  }

  ambientDust.rotation.y = elapsed * 0.004;
  controls.update();
  renderer.render(scene, camera);
};

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
