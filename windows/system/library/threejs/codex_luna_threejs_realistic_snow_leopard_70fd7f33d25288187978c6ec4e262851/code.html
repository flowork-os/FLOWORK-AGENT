<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snow Leopard Prowl</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#10151a}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10161b);
scene.fog = new THREE.Fog(0x10161b, 9, 18);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.4, 3.4, 6.8);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 4;
controls.maxDistance = 11;
controls.target.set(0, 1.5, 0);

const hemi = new THREE.HemisphereLight(0xbfd6df, 0x20252a, 2.0);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff1d7, 4.2);
key.position.set(4, 8, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -4;
scene.add(key);

const rim = new THREE.DirectionalLight(0x9bbdce, 2.4);
rim.position.set(-5, 5, -6);
scene.add(rim);

const groundMaterial = new THREE.MeshStandardMaterial({ color:0x293238, roughness:0.95 });
const ground = new THREE.Mesh(new THREE.CircleGeometry(8, 96), groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const fur = new THREE.MeshStandardMaterial({ color:0x737b7c, roughness:0.92, metalness:0.02 });
const darkFur = new THREE.MeshStandardMaterial({ color:0x202326, roughness:0.98 });
const cream = new THREE.MeshStandardMaterial({ color:0xd9d2bc, roughness:0.94 });
const pink = new THREE.MeshStandardMaterial({ color:0xd89191, roughness:0.72 });
const eyeMat = new THREE.MeshPhysicalMaterial({ color:0xb8e8c3, roughness:0.18, transmission:0.05, clearcoat:0.5 });
const pupilMat = new THREE.MeshStandardMaterial({ color:0x08100d, roughness:0.35 });
const noseMat = new THREE.MeshStandardMaterial({ color:0xc98283, roughness:0.42 });
const whiskerMat = new THREE.LineBasicMaterial({ color:0xf1eee0, transparent:true, opacity:0.9 });

const leopard = new THREE.Group();
scene.add(leopard);

function sphere(name, position, scale, material, segments=32) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, segments, Math.max(16, segments/2)), material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.scale.set(scale[0], scale[1], scale[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  leopard.add(mesh);
  return mesh;
}

function cylinderBetween(name, a, b, radius, material, radial=14) {
  const start = new THREE.Vector3(a[0], a[1], a[2]);
  const end = new THREE.Vector3(b[0], b[1], b[2]);
  const direction = end.clone().sub(start);
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius * 1.08, direction.length(), radial), material);
  mesh.name = name;
  mesh.position.copy(start.clone().add(end).multiplyScalar(0.5));
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  leopard.add(mesh);
  return mesh;
}

function rosette(position, normal, size, rotation=0) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(size, size*0.22, 8, 16), darkFur);
  ring.position.set(position[0], position[1], position[2]);
  ring.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), new THREE.Vector3(normal[0],normal[1],normal[2]).normalize());
  ring.rotateY(rotation);
  ring.scale.set(1.25, 1, 0.78);
  ring.castShadow = true;
  leopard.add(ring);
  const center = sphere("rosette center", [
    position[0] + normal[0]*0.018,
    position[1] + normal[1]*0.018,
    position[2] + normal[2]*0.018
  ], [size*.42,size*.18,size*.28], darkFur, 16);
  center.quaternion.copy(ring.quaternion);
}

sphere("deep torso", [0,1.55,0], [2.05,1.05,0.86], fur, 48);
sphere("raised shoulders", [0.78,1.74,0], [1.05,1.18,0.94], fur, 40);
sphere("cream belly", [-0.05,1.02,0], [1.45,0.34,0.7], cream, 36);
sphere("neck ruff", [1.23,1.82,0], [0.72,0.9,0.75], fur, 36);
sphere("head", [1.7,2.03,0], [0.82,0.72,0.68], fur, 40);
sphere("muzzle", [2.27,1.88,0], [0.52,0.35,0.42], cream, 32);
sphere("jaw", [2.22,1.72,0], [0.42,0.25,0.34], cream, 28);

const earL = new THREE.Mesh(new THREE.ConeGeometry(0.34,0.58,24), fur);
earL.position.set(1.42,2.67,0.38);
earL.rotation.z = -0.25;
earL.castShadow = true;
leopard.add(earL);
const earR = earL.clone();
earR.position.z = -0.38;
earR.rotation.z = 0.25;
leopard.add(earR);
sphere("left ear lining", [1.43,2.68,0.365], [0.2,0.28,0.08], pink, 20);
sphere("right ear lining", [1.43,2.68,-0.365], [0.2,0.28,0.08], pink, 20);

sphere("left eye", [2.08,2.18,0.54], [0.13,0.14,0.08], eyeMat, 24);
sphere("right eye", [2.08,2.18,-0.54], [0.13,0.14,0.08], eyeMat, 24);
sphere("left pupil", [2.16,2.18,0.605], [0.038,0.085,0.018], pupilMat, 16);
sphere("right pupil", [2.16,2.18,-0.605], [0.038,0.085,0.018], pupilMat, 16);
sphere("nose", [2.7,1.9,0], [0.16,0.12,0.14], noseMat, 24);

function addWhiskers(side) {
  const z = side * 0.22;
  const starts = [
    [2.48,1.91,z],
    [2.5,1.84,z],
    [2.46,1.77,z]
  ];
  const ends = [
    [3.18,2.02,side*0.48],
    [3.28,1.87,side*0.52],
    [3.12,1.69,side*0.5]
  ];
  for (let i=0;i<starts.length;i++) {
    const points = [
      new THREE.Vector3(...starts[i]),
      new THREE.Vector3((starts[i][0]+ends[i][0])/2, starts[i][1]+0.03, starts[i][2]),
      new THREE.Vector3(...ends[i])
    ];
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    leopard.add(new THREE.Line(geometry, whiskerMat));
  }
}
addWhiskers(1);
addWhiskers(-1);

const legs = [
  {hip:[-0.85,1.35,0.58], knee:[-0.92,0.72,0.58], paw:[-1.08,0.18,0.6]},
  {hip:[-0.78,1.35,-0.58], knee:[-0.6,0.7,-0.62], paw:[-0.42,0.16,-0.64]},
  {hip:[0.84,1.48,0.6], knee:[0.95,0.72,0.62], paw:[1.18,0.18,0.62]},
  {hip:[0.82,1.48,-0.6], knee:[1.18,1.05,-0.68], paw:[1.72,1.28,-0.68], lifted:true}
];

for (let i=0;i<legs.length;i++) {
  const leg = legs[i];
  sphere("leg shoulder", leg.hip, [0.48,0.55,0.43], fur, 28);
  cylinderBetween("upper leg", leg.hip, leg.knee, 0.27, fur);
  if (!leg.lifted) {
    cylinderBetween("lower leg", leg.knee, leg.paw, 0.2, cream);
    sphere("paw", leg.paw, [0.34,0.16,0.25], darkFur, 24);
    for (let toe=0;toe<3;toe++) {
      sphere("toe", [leg.paw[0]+0.12*toe,leg.paw[1]+0.04,leg.paw[2]+(toe-1)*0.1], [0.1,0.07,0.08], darkFur, 16);
    }
  } else {
    cylinderBetween("lifted forearm", leg.knee, leg.paw, 0.2, cream);
    sphere("lifted paw", leg.paw, [0.32,0.17,0.23], darkFur, 24);
  }
}

const tailCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-1.55,1.55,0),
  new THREE.Vector3(-2.35,1.45,0.12),
  new THREE.Vector3(-2.95,2.05,0.18),
  new THREE.Vector3(-3.08,2.95,0.05),
  new THREE.Vector3(-2.72,3.5,-0.08)
]);
const tail = new THREE.Mesh(new THREE.TubeGeometry(tailCurve, 48, 0.38, 18, false), fur);
tail.scale.set(1,1,0.94);
tail.castShadow = true;
tail.receiveShadow = true;
leopard.add(tail);
sphere("tail tip", [-2.72,3.5,-0.08], [0.42,0.43,0.4], fur, 24);

const rosettes = [
  [[-0.98,1.92,0.78],[0,0,1],0.18], [[-0.35,2.18,0.72],[0,0,1],0.16],
  [[0.38,2.2,0.65],[0.1,0,1],0.2], [[0.94,1.82,0.82],[0,0,1],0.17],
  [[-1.45,1.47,0.7],[-0.2,0,1],0.15], [[-0.62,1.36,0.83],[0,0,1],0.19],
  [[0.05,1.42,0.84],[0,0,1],0.16], [[0.7,1.36,0.78],[0,0,1],0.13],
  [[-0.9,2.28,0.2],[0,1,0],0.14], [[-0.15,2.45,0.1],[0,1,0],0.15],
  [[0.58,2.48,0.1],[0,1,0],0.13], [[1.18,2.16,0.2],[0,1,0],0.12],
  [[-0.7,1.58,-0.84],[0,0,-1],0.18], [[0.12,2.05,-0.8],[0,0,-1],0.17],
  [[0.72,1.76,-0.87],[0,0,-1],0.16], [[-1.55,1.85,-0.52],[-0.2,0,-1],0.14],
  [[1.43,2.34,0.45],[0,0.5,0.86],0.1], [[1.55,2.37,-0.45],[0,0.5,-0.86],0.1]
];
for (let i=0;i<rosettes.length;i++) rosette(rosettes[i][0],rosettes[i][1],rosettes[i][2],i*0.7);

for (let i=0;i<18;i++) {
  const x = -1.18 + i*0.13;
  const hair = new THREE.Mesh(new THREE.ConeGeometry(0.035,0.34+(i%3)*0.05,6), cream);
  hair.position.set(x,2.54+(i%2)*0.04,0.02);
  hair.rotation.z = Math.PI/2;
  hair.rotation.y = (i%4-1.5)*0.13;
  hair.castShadow = true;
  leopard.add(hair);
}

for (let i=0;i<12;i++) {
  const a = -0.9 + i*0.17;
  const tuft = new THREE.Mesh(new THREE.ConeGeometry(0.045,0.32,6), fur);
  tuft.position.set(a,2.53,0);
  tuft.rotation.z = Math.PI/2;
  tuft.rotation.y = (i%3-1)*0.18;
  leopard.add(tuft);
}

const shadowMat = new THREE.MeshBasicMaterial({ color:0x080b0d, transparent:true, opacity:0.28 });
const shadow = new THREE.Mesh(new THREE.EllipseCurve ? new THREE.CircleGeometry(2.6,64) : new THREE.CircleGeometry(2.6,64), shadowMat);
shadow.rotation.x = -Math.PI/2;
shadow.scale.set(1,0.32,1);
shadow.position.set(-0.1,0.012,0);
scene.add(shadow);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
