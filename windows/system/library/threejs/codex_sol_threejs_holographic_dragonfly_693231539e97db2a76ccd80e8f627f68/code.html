<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Dragonfly</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #030510;
    }
    canvas { display: block; }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 45%, transparent 35%, rgba(1, 2, 10, 0.35) 72%, rgba(0, 0, 5, 0.8) 100%);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="vignette"></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030510);
    scene.fog = new THREE.FogExp2(0x050714, 0.035);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(7.3, 5.3, 8.6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.28;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.05, 0.65);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;
    controls.minDistance = 7;
    controls.maxDistance = 18;
    controls.enablePan = false;

    scene.add(new THREE.HemisphereLight(0x91b8ff, 0x150823, 1.35));

    const keyLight = new THREE.DirectionalLight(0xbfd7ff, 4.2);
    keyLight.position.set(4, 8, 3);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    scene.add(keyLight);

    const magentaLight = new THREE.PointLight(0xff2bd6, 18, 18, 2);
    magentaLight.position.set(-5, 1.5, 2);
    scene.add(magentaLight);

    const cyanLight = new THREE.PointLight(0x20eaff, 20, 18, 2);
    cyanLight.position.set(4.5, -1, -2);
    scene.add(cyanLight);

    const violetLight = new THREE.PointLight(0x7040ff, 13, 14, 2);
    violetLight.position.set(0, 4, 5);
    scene.add(violetLight);

    const dragonfly = new THREE.Group();
    dragonfly.rotation.x = -0.05;
    scene.add(dragonfly);

    function holographicMaterial(color, iridescence = 1) {
      return new THREE.MeshPhysicalMaterial({
        color,
        metalness: 0.64,
        roughness: 0.18,
        clearcoat: 1,
        clearcoatRoughness: 0.08,
        iridescence,
        iridescenceIOR: 1.72,
        iridescenceThicknessRange: [120, 920],
        sheen: 0.65,
        sheenColor: new THREE.Color(0x8deeff),
        sheenRoughness: 0.22,
        envMapIntensity: 1.5
      });
    }

    const thoraxMaterial = holographicMaterial(0x143861);
    const headMaterial = holographicMaterial(0x102d4d);
    const jointMaterial = holographicMaterial(0x8e45b8);
    const legMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x182944,
      emissive: 0x07182c,
      emissiveIntensity: 1.4,
      metalness: 0.82,
      roughness: 0.22,
      iridescence: 1,
      iridescenceIOR: 1.6,
      iridescenceThicknessRange: [180, 700]
    });

    const thorax = new THREE.Mesh(new THREE.SphereGeometry(0.72, 40, 24), thoraxMaterial);
    thorax.scale.set(0.86, 0.72, 1.35);
    thorax.position.set(0, 0, -0.45);
    thorax.castShadow = true;
    dragonfly.add(thorax);

    const thoraxPlate = new THREE.Mesh(
      new THREE.SphereGeometry(0.73, 32, 18, 0, Math.PI * 2, 0, Math.PI * 0.48),
      holographicMaterial(0x4d176f)
    );
    thoraxPlate.scale.set(0.87, 0.73, 1.18);
    thoraxPlate.rotation.x = Math.PI;
    thoraxPlate.position.set(0, 0.02, -0.55);
    dragonfly.add(thoraxPlate);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.56, 36, 24), headMaterial);
    head.scale.set(1.05, 0.82, 0.83);
    head.position.set(0, 0.025, -1.42);
    head.castShadow = true;
    dragonfly.add(head);

    const neck = new THREE.Mesh(new THREE.SphereGeometry(0.34, 24, 16), jointMaterial);
    neck.scale.set(1, 0.82, 0.7);
    neck.position.set(0, 0, -1.03);
    dragonfly.add(neck);

    const eyeMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x07111f,
      metalness: 0.72,
      roughness: 0.08,
      clearcoat: 1,
      clearcoatRoughness: 0.02,
      iridescence: 1,
      iridescenceIOR: 2,
      iridescenceThicknessRange: [100, 1100],
      emissive: 0x160d38,
      emissiveIntensity: 1.9
    });

    const eyeOverlayMaterial = new THREE.MeshBasicMaterial({
      color: 0x70f7ff,
      wireframe: true,
      transparent: true,
      opacity: 0.16,
      blending: THREE.AdditiveBlending
    });

    for (const side of [-1, 1]) {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 20), eyeMaterial);
      eye.scale.set(0.9, 1.05, 1.15);
      eye.position.set(side * 0.39, 0.105, -1.61);
      eye.rotation.y = side * 0.28;
      dragonfly.add(eye);

      const facets = new THREE.Mesh(new THREE.IcosahedronGeometry(0.407, 2), eyeOverlayMaterial);
      facets.scale.copy(eye.scale);
      facets.position.copy(eye.position);
      facets.rotation.copy(eye.rotation);
      dragonfly.add(facets);

      const eyeGlint = new THREE.Mesh(
        new THREE.SphereGeometry(0.065, 16, 10),
        new THREE.MeshBasicMaterial({
          color: side < 0 ? 0xffa4f2 : 0x92ffff,
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending
        })
      );
      eyeGlint.position.set(side * 0.43, 0.31, -1.83);
      dragonfly.add(eyeGlint);
    }

    const abdomenColors = [
      0x174f72, 0x315f86, 0x513c85, 0x6b347e,
      0x254f72, 0x33477d, 0x58376f, 0x214b66,
      0x302f61, 0x162d4d
    ];

    let abdomenZ = 0.36;
    for (let i = 0; i < 10; i++) {
      const length = i < 2 ? 0.52 : 0.48;
      const radius = 0.39 - i * 0.027;
      const segment = new THREE.Mesh(
        new THREE.SphereGeometry(1, 28, 16),
        holographicMaterial(abdomenColors[i])
      );
      segment.scale.set(radius, radius * 0.82, length * 0.62);
      segment.position.set(
        Math.sin(i * 0.65) * 0.018,
        Math.sin(i * 0.8) * 0.012,
        abdomenZ
      );
      segment.castShadow = true;
      dragonfly.add(segment);

      if (i < 9) {
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(radius * 0.83, 0.026, 7, 28),
          jointMaterial
        );
        ring.position.set(0, 0, abdomenZ + length * 0.43);
        dragonfly.add(ring);
      }
      abdomenZ += length * 0.84;
    }

    const tailTip = new THREE.Mesh(
      new THREE.ConeGeometry(0.16, 0.5, 20),
      holographicMaterial(0x621f79)
    );
    tailTip.rotation.x = Math.PI / 2;
    tailTip.position.set(0, 0, abdomenZ + 0.08);
    dragonfly.add(tailTip);

    const wingUniforms = {
      time: { value: 0 },
      tint: { value: new THREE.Color(0xb8f5ff) }
    };

    const wingMaterial = new THREE.ShaderMaterial({
      uniforms: wingUniforms,
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vWorldPosition;
        varying vec3 vWorldNormal;

        void main() {
          vUv = uv;
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          vWorldNormal = normalize(mat3(modelMatrix) * normal);
          gl_Position = projectionMatrix * viewMatrix * worldPosition;
        }
      `,
      fragmentShader: `
        uniform float time;
        uniform vec3 tint;
        varying vec2 vUv;
        varying vec3 vWorldPosition;
        varying vec3 vWorldNormal;

        vec3 spectrum(float x) {
          return 0.55 + 0.45 * cos(6.2831853 * (x + vec3(0.0, 0.33, 0.67)));
        }

        void main() {
          vec3 viewDir = normalize(cameraPosition - vWorldPosition);
          float facing = abs(dot(normalize(vWorldNormal), viewDir));
          float fresnel = pow(1.0 - facing, 2.2);
          float phase = vWorldPosition.x * 0.56
                      + vWorldPosition.z * 0.85
                      + sin(vWorldPosition.x * 2.4 + time * 0.85) * 0.19
                      - time * 0.11;
          vec3 rainbow = spectrum(phase);
          float fine = pow(0.5 + 0.5 * sin(phase * 21.0 + facing * 14.0), 8.0);
          float sweep = pow(0.5 + 0.5 * sin(phase * 6.5 - time * 1.3), 12.0);
          vec3 color = mix(tint * 0.42, rainbow, 0.72);
          color += rainbow * fine * 0.9;
          color += vec3(0.8, 0.95, 1.0) * fresnel * 0.75;
          color += rainbow * sweep * 1.1;
          float alpha = 0.20 + fresnel * 0.36 + fine * 0.09 + sweep * 0.12;
          gl_FragColor = vec4(color, min(alpha, 0.78));
        }
      `,
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      blending: THREE.NormalBlending
    });

    const veinMaterial = new THREE.MeshBasicMaterial({
      color: 0x82eaff,
      transparent: true,
      opacity: 0.58,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const rimMaterial = new THREE.LineBasicMaterial({
      color: 0xd5faff,
      transparent: true,
      opacity: 0.72,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const wings = [];

    function addVein(group, start, control1, control2, end, radius = 0.011) {
      const curve = new THREE.CubicBezierCurve3(
        new THREE.Vector3(start[0], 0.022, start[1]),
        new THREE.Vector3(control1[0], 0.024, control1[1]),
        new THREE.Vector3(control2[0], 0.024, control2[1]),
        new THREE.Vector3(end[0], 0.022, end[1])
      );
      const tube = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 24, radius, 5, false),
        veinMaterial
      );
      group.add(tube);
    }

    function makeWing(side, kind) {
      const shape = new THREE.Shape();
      const isFront = kind === 'front';

      shape.moveTo(0, 0);
      if (isFront) {
        shape.bezierCurveTo(0.75, -0.3, 2.7, -0.91, 4.35, -0.6);
        shape.bezierCurveTo(4.13, -0.25, 2.35, 0.17, 0.14, 0.2);
        shape.bezierCurveTo(0.02, 0.13, -0.02, 0.05, 0, 0);
      } else {
        shape.bezierCurveTo(0.7, -0.08, 2.42, -0.12, 3.72, 0.36);
        shape.bezierCurveTo(3.3, 0.88, 1.55, 1.32, 0.12, 0.34);
        shape.bezierCurveTo(0.03, 0.22, -0.02, 0.08, 0, 0);
      }

      const geometry = new THREE.ShapeGeometry(shape, 40);
      geometry.computeVertexNormals();

      const group = new THREE.Group();
      const membrane = new THREE.Mesh(geometry, wingMaterial);
      membrane.rotation.x = Math.PI / 2;
      membrane.renderOrder = 2;
      group.add(membrane);

      const perimeterPoints = shape.getPoints(100).map(
        p => new THREE.Vector3(p.x, 0.028, p.y)
      );
      const perimeterGeometry = new THREE.BufferGeometry().setFromPoints(perimeterPoints);
      const perimeter = new THREE.LineLoop(perimeterGeometry, rimMaterial);
      perimeter.renderOrder = 3;
      group.add(perimeter);

      if (isFront) {
        addVein(group, [0.05, 0.03], [1.0, -0.2], [2.8, -0.43], [4.25, -0.57], 0.016);
        addVein(group, [0.08, 0.07], [1.1, 0.05], [2.55, -0.1], [3.93, -0.35]);
        addVein(group, [0.16, 0.12], [1.0, 0.17], [2.3, 0.06], [3.45, -0.15]);
        addVein(group, [0.8, -0.12], [1.2, -0.35], [1.45, -0.51], [1.65, -0.58]);
        addVein(group, [1.5, -0.24], [1.8, -0.48], [2.05, -0.65], [2.3, -0.72]);
        addVein(group, [2.25, -0.3], [2.55, -0.5], [2.8, -0.64], [3.1, -0.69]);
        addVein(group, [3.0, -0.37], [3.25, -0.49], [3.5, -0.55], [3.79, -0.6]);
        addVein(group, [1.05, 0.08], [1.28, -0.05], [1.42, -0.2], [1.55, -0.35]);
        addVein(group, [2.0, 0.08], [2.18, -0.04], [2.32, -0.18], [2.45, -0.43]);
      } else {
        addVein(group, [0.04, 0.07], [1.0, 0.12], [2.65, 0.25], [3.66, 0.37], 0.016);
        addVein(group, [0.1, 0.16], [1.15, 0.46], [2.45, 0.62], [3.42, 0.55]);
        addVein(group, [0.13, 0.25], [0.9, 0.77], [1.85, 0.93], [2.75, 0.78]);
        addVein(group, [0.7, 0.27], [0.9, 0.12], [1.03, 0.02], [1.25, -0.06]);
        addVein(group, [1.38, 0.49], [1.6, 0.27], [1.82, 0.12], [2.1, 0.03]);
        addVein(group, [2.08, 0.63], [2.3, 0.45], [2.5, 0.29], [2.73, 0.2]);
        addVein(group, [2.76, 0.66], [2.94, 0.54], [3.14, 0.43], [3.42, 0.35]);
        addVein(group, [0.7, 0.52], [0.92, 0.45], [1.08, 0.34], [1.25, 0.18]);
        addVein(group, [1.55, 0.8], [1.72, 0.66], [1.9, 0.48], [2.08, 0.29]);
      }

      group.scale.x = side;
      group.position.z = isFront ? -0.63 : -0.08;
      group.rotation.z = side * (isFront ? 0.035 : 0.055);
      group.userData.side = side;
      group.userData.kind = kind;
      group.userData.baseAngle = isFront ? 0.035 : 0.055;
      wings.push(group);
      dragonfly.add(group);
    }

    makeWing(-1, 'front');
    makeWing(1, 'front');
    makeWing(-1, 'hind');
    makeWing(1, 'hind');

    function cylinderBetween(start, end, radius, material, radialSegments = 8) {
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius * 0.82, length, radialSegments),
        material
      );
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.clone().normalize()
      );
      return mesh;
    }

    const legData = [
      [-0.38, -0.18, -0.8, -0.75, -0.62, -1.0, -1.0, -0.8, -1.45],
      [ 0.38, -0.18, -0.8,  0.75, -0.62, -1.0,  1.0, -0.8, -1.45],
      [-0.48, -0.22, -0.42, -0.9, -0.75, -0.25, -1.17, -0.92, 0.05],
      [ 0.48, -0.22, -0.42,  0.9, -0.75, -0.25,  1.17, -0.92, 0.05],
      [-0.4, -0.2, -0.08, -0.74, -0.7, 0.35, -0.96, -0.83, 0.82],
      [ 0.4, -0.2, -0.08,  0.74, -0.7, 0.35,  0.96, -0.83, 0.82]
    ];

    for (const values of legData) {
      const hip = new THREE.Vector3(values[0], values[1], values[2]);
      const knee = new THREE.Vector3(values[3], values[4], values[5]);
      const foot = new THREE.Vector3(values[6], values[7], values[8]);
      dragonfly.add(cylinderBetween(hip, knee, 0.035, legMaterial));
      dragonfly.add(cylinderBetween(knee, foot, 0.022, legMaterial, 7));

      const joint = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 8), jointMaterial);
      joint.position.copy(knee);
      dragonfly.add(joint);
    }

    function addAntenna(side) {
      const curve = new THREE.CubicBezierCurve3(
        new THREE.Vector3(side * 0.21, 0.12, -1.82),
        new THREE.Vector3(side * 0.32, 0.28, -2.05),
        new THREE.Vector3(side * 0.48, 0.34, -2.32),
        new THREE.Vector3(side * 0.62, 0.26, -2.56)
      );
      const antenna = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 32, 0.014, 6, false),
        legMaterial
      );
      dragonfly.add(antenna);

      const tip = new THREE.Mesh(
        new THREE.SphereGeometry(0.035, 12, 8),
        new THREE.MeshBasicMaterial({
          color: side < 0 ? 0xff55d7 : 0x5fffff,
          blending: THREE.AdditiveBlending
        })
      );
      tip.position.copy(curve.getPoint(1));
      dragonfly.add(tip);
    }

    addAntenna(-1);
    addAntenna(1);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      wingUniforms.time.value = elapsed;

      for (let i = 0; i < wings.length; i++) {
        const wing = wings[i];
        const side = wing.userData.side;
        const isFront = wing.userData.kind === 'front';
        const flutter = Math.sin(elapsed * 3.1 + (isFront ? 0 : 0.72)) * 0.022;
        const tremor = Math.sin(elapsed * 11.0 + i * 1.7) * 0.004;
        wing.rotation.z = side * (wing.userData.baseAngle + flutter + tremor);
      }

      dragonfly.position.y = Math.sin(elapsed * 1.25) * 0.055;
      dragonfly.rotation.z = Math.sin(elapsed * 0.7) * 0.012;
      magentaLight.intensity = 17 + Math.sin(elapsed * 1.1) * 2;
      cyanLight.intensity = 19 + Math.cos(elapsed * 1.35) * 2;

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
