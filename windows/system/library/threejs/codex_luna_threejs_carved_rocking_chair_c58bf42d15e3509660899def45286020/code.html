<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carved Walnut Rocking Chair</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1b120d}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b120d);
scene.fog = new THREE.Fog(0x1b120d, 11, 22);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(6.8, 4.8, 8.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 5;
controls.maxDistance = 13;
controls.target.set(0, 2.55, 0);

const walnut = new THREE.MeshStandardMaterial({
  color: 0x6b321b,
  roughness: 0.34,
  metalness: 0.02,
  flatShading: false
});
const walnutLight = new THREE.MeshStandardMaterial({
  color: 0x8c4b28,
  roughness: 0.3,
  metalness: 0.015
});
const walnutDark = new THREE.MeshStandardMaterial({
  color: 0x32150d,
  roughness: 0.46,
  metalness: 0.01
});
const carved = new THREE.MeshStandardMaterial({
  color: 0xa66538,
  roughness: 0.32,
  metalness: 0.02
});
const groove = new THREE.MeshStandardMaterial({
  color: 0x26100a,
  roughness: 0.52,
  metalness: 0
});

const chair = new THREE.Group();
chair.position.y = 0.05;
scene.add(chair);

function tube(points, radius, material, closed = false, segments = 20, radial = 8) {
  const curve = new THREE.CatmullRomCurve3(points);
  curve.closed = closed;
  const geometry = new THREE.TubeGeometry(curve, segments, radius, radial, closed);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  chair.add(mesh);
  return mesh;
}

function box(size, position, material, rotation = new THREE.Euler()) {
  const geometry = new THREE.BoxGeometry(size.x, size.y, size.z, 2, 2, 2);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(position);
  mesh.rotation.copy(rotation);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  chair.add(mesh);
  return mesh;
}

function cylinderBetween(a, b, radius, material, radial = 10) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(radius, radius * 1.08, length, radial, 2);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  chair.add(mesh);
  return mesh;
}

function grainLine(points, radius = 0.018) {
  return tube(points, radius, groove, false, 18, 5);
}

const runnerLeft = [
  new THREE.Vector3(-1.05, 0.38, -1.58),
  new THREE.Vector3(-1.05, 0.18, -1.04),
  new THREE.Vector3(-1.05, 0.10, -0.35),
  new THREE.Vector3(-1.05, 0.10, 0.42),
  new THREE.Vector3(-1.05, 0.18, 1.08),
  new THREE.Vector3(-1.05, 0.42, 1.52)
];
const runnerRight = runnerLeft.map(point => new THREE.Vector3(-point.x, point.y, point.z));
tube(runnerLeft, 0.19, walnutDark, false, 32, 12);
tube(runnerRight, 0.19, walnutDark, false, 32, 12);

grainLine([
  new THREE.Vector3(-1.18, 0.31, -1.47),
  new THREE.Vector3(-1.18, 0.18, -0.75),
  new THREE.Vector3(-1.18, 0.15, 0.18),
  new THREE.Vector3(-1.18, 0.29, 1.26)
], 0.023);
grainLine([
  new THREE.Vector3(0.92, 0.29, -1.47),
  new THREE.Vector3(0.92, 0.15, -0.58),
  new THREE.Vector3(0.92, 0.13, 0.45),
  new THREE.Vector3(0.92, 0.31, 1.30)
], 0.022);

const legPairs = [
  [-0.92, -1.03, -0.82, 1.82],
  [0.92, -1.03, 0.82, 1.82],
  [-0.92, 1.03, -0.82, 1.82],
  [0.92, 1.03, 0.82, 1.82]
];
for (const leg of legPairs) {
  const x0 = leg[0], z0 = leg[1], x1 = leg[2], z1 = leg[3];
  cylinderBetween(
    new THREE.Vector3(x0, 0.28, z0),
    new THREE.Vector3(x1, 1.94, z1),
    0.14,
    walnut
  );
}

box(new THREE.Vector3(2.55, 0.30, 2.08), new THREE.Vector3(0, 2.03, 0), walnutLight);
box(new THREE.Vector3(2.35, 0.17, 1.92), new THREE.Vector3(0, 2.22, -0.01), walnut);

for (let index = -2; index <= 2; index++) {
  const x = index * 0.39;
  const top = new THREE.Vector3(x, 4.42 - Math.abs(index) * 0.035, -0.79);
  const bottom = new THREE.Vector3(x * 0.96, 2.31, -0.76);
  cylinderBetween(bottom, top, 0.065, walnutLight, 9);
  if (index !== 0) {
    cylinderBetween(
      new THREE.Vector3(x, 2.36, -0.76),
      new THREE.Vector3(x * 0.96, 4.1, -0.79),
      0.025,
      groove,
      6
    );
  }
}

const backSideLeft = new THREE.Vector3(-1.08, 2.30, -0.71);
const backSideRight = new THREE.Vector3(1.08, 2.30, -0.71);
const backTopLeft = new THREE.Vector3(-1.19, 4.48, -0.79);
const backTopRight = new THREE.Vector3(1.19, 4.48, -0.79);
cylinderBetween(backSideLeft, backTopLeft, 0.14, walnut, 12);
cylinderBetween(backSideRight, backTopRight, 0.14, walnut, 12);

const crestCurve = [
  new THREE.Vector3(-1.34, 4.43, -0.78),
  new THREE.Vector3(-0.92, 4.67, -0.78),
  new THREE.Vector3(-0.32, 4.78, -0.78),
  new THREE.Vector3(0, 4.75, -0.78),
  new THREE.Vector3(0.32, 4.78, -0.78),
  new THREE.Vector3(0.92, 4.67, -0.78),
  new THREE.Vector3(1.34, 4.43, -0.78)
];
tube(crestCurve, 0.20, walnutLight, false, 28, 12);

const lowerCrest = [
  new THREE.Vector3(-1.18, 4.31, -0.78),
  new THREE.Vector3(-0.56, 4.47, -0.78),
  new THREE.Vector3(0, 4.52, -0.78),
  new THREE.Vector3(0.56, 4.47, -0.78),
  new THREE.Vector3(1.18, 4.31, -0.78)
];
tube(lowerCrest, 0.085, walnutDark, false, 24, 8);

grainLine([
  new THREE.Vector3(-1.23, 4.56, -0.57),
  new THREE.Vector3(-0.65, 4.73, -0.57),
  new THREE.Vector3(0.05, 4.83, -0.57),
  new THREE.Vector3(0.69, 4.72, -0.57),
  new THREE.Vector3(1.20, 4.56, -0.57)
], 0.023);

function leafGeometry() {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.quadraticCurveTo(0.28, 0.14, 0.62, 0.50);
  shape.quadraticCurveTo(0.26, 0.56, 0.03, 0.40);
  shape.quadraticCurveTo(-0.11, 0.22, 0, 0);
  const settings = {
    depth: 0.075,
    bevelEnabled: true,
    bevelThickness: 0.018,
    bevelSize: 0.018,
    bevelSegments: 2,
    curveSegments: 8
  };
  return new THREE.ExtrudeGeometry(shape, settings);
}

function addLeaf(x, y, scale, mirrored) {
  const mesh = new THREE.Mesh(leafGeometry(), carved);
  mesh.position.set(x, y, -0.565);
  mesh.rotation.z = mirrored ? -0.55 : 0.55;
  mesh.scale.set(mirrored ? -scale : scale, scale, 1);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  chair.add(mesh);

  const veinPoints = mirrored ? [
    new THREE.Vector3(x, y, -0.474),
    new THREE.Vector3(x - scale * 0.25, y + scale * 0.14, -0.474),
    new THREE.Vector3(x - scale * 0.49, y + scale * 0.34, -0.474)
  ] : [
    new THREE.Vector3(x, y, -0.474),
    new THREE.Vector3(x + scale * 0.25, y + scale * 0.14, -0.474),
    new THREE.Vector3(x + scale * 0.49, y + scale * 0.34, -0.474)
  ];
  const curve = new THREE.CatmullRomCurve3(veinPoints);
  const vein = new THREE.Mesh(new THREE.TubeGeometry(curve, 10, 0.018, 5, false), walnutDark);
  vein.castShadow = true;
  chair.add(vein);
}

addLeaf(-0.88, 4.45, 0.67, false);
addLeaf(-0.40, 4.55, 0.48, true);
addLeaf(0.88, 4.45, 0.67, true);
addLeaf(0.40, 4.55, 0.48, false);

const centerRosette = new THREE.Group();
centerRosette.position.set(0, 4.60, -0.47);
chair.add(centerRosette);
for (let index = 0; index < 8; index++) {
  const angle = index * Math.PI / 4;
  const petal = new THREE.Mesh(
    new THREE.SphereGeometry(0.16, 10, 6),
    carved
  );
  petal.scale.set(0.45, 1, 0.16);
  petal.position.set(Math.cos(angle) * 0.18, Math.sin(angle) * 0.18, 0);
  petal.rotation.z = angle;
  petal.castShadow = true;
  centerRosette.add(petal);
}
const rosetteCore = new THREE.Mesh(new THREE.SphereGeometry(0.105, 12, 8), walnutDark);
rosetteCore.scale.z = 0.25;
rosetteCore.castShadow = true;
centerRosette.add(rosetteCore);

const armY = 3.20;
for (const side of [-1, 1]) {
  cylinderBetween(
    new THREE.Vector3(side * 0.98, 2.30, -0.07),
    new THREE.Vector3(side * 1.04, armY, -0.06),
    0.105,
    walnut,
    10
  );
  cylinderBetween(
    new THREE.Vector3(side * 0.98, 2.35, 0.82),
    new THREE.Vector3(side * 1.04, armY, 0.82),
    0.10,
    walnut,
    10
  );

  const armPoints = [
    new THREE.Vector3(side * 1.06, armY, 0.92),
    new THREE.Vector3(side * 1.14, 3.27, 0.55),
    new THREE.Vector3(side * 1.10, 3.30, 0.08),
    new THREE.Vector3(side * 0.98, 3.22, -0.40),
    new THREE.Vector3(side * 0.83, 3.14, -0.70)
  ];
  tube(armPoints, 0.13, walnutLight, false, 24, 10);

  const armGroove = armPoints.map(point => new THREE.Vector3(point.x, point.y + 0.075, point.z + 0.025));
  grainLine(armGroove, 0.018);

  const scroll = new THREE.Mesh(
    new THREE.TorusGeometry(0.22, 0.055, 8, 18, Math.PI * 1.62),
    walnutDark
  );
  scroll.position.set(side * 0.86, 3.11, -0.72);
  scroll.rotation.x = Math.PI / 2;
  scroll.rotation.z = side > 0 ? 0.2 : -0.2;
  scroll.scale.set(1, 0.72, 1);
  scroll.castShadow = true;
  chair.add(scroll);
}

const seatPeg = new THREE.Mesh(
  new THREE.CylinderGeometry(0.09, 0.11, 0.10, 12),
  carved
);
seatPeg.position.set(0, 2.32, 0.77);
seatPeg.castShadow = true;
chair.add(seatPeg);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(9, 96),
  new THREE.MeshStandardMaterial({ color: 0x241813, roughness: 0.8, metalness: 0 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.10;
floor.receiveShadow = true;
scene.add(floor);

const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 16),
  new THREE.MeshStandardMaterial({ color: 0x21140f, roughness: 0.95 })
);
backdrop.position.set(0, 6.5, -4.6);
backdrop.receiveShadow = true;
scene.add(backdrop);

const hemisphere = new THREE.HemisphereLight(0xffd8a6, 0x170d09, 2.1);
scene.add(hemisphere);

const keyLight = new THREE.DirectionalLight(0xffd0a0, 4.0);
keyLight.position.set(-4.5, 8.5, 6.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 22;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x8f9dcc, 2.0);
rimLight.position.set(5, 5, -5);
scene.add(rimLight);

const warmFill = new THREE.PointLight(0xff9b52, 1.3, 8, 2);
warmFill.position.set(-2.8, 2.8, 3.4);
scene.add(warmFill);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  chair.rotation.y = Math.sin(elapsed * 0.35) * 0.018;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
