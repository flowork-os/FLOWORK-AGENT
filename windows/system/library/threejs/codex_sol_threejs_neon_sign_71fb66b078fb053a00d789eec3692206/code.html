<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon OPEN Sign</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #030407;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020307);
scene.fog = new THREE.FogExp2(0x020307, 0.025);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.6, 16.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.45,
  0.55,
  0.23
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.enablePan = false;
controls.minDistance = 11;
controls.maxDistance = 24;
controls.minPolarAngle = Math.PI * 0.32;
controls.maxPolarAngle = Math.PI * 0.68;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.38;

scene.add(new THREE.HemisphereLight(0x46546f, 0x080609, 0.38));

const keyLight = new THREE.DirectionalLight(0xb8c8ff, 1.35);
keyLight.position.set(-5, 7, 10);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.left = -9;
keyLight.shadow.camera.right = 9;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -7;
scene.add(keyLight);

const rimLight = new THREE.PointLight(0x4969ff, 22, 18, 2);
rimLight.position.set(6, 3, 7);
scene.add(rimLight);

const wallMaterial = new THREE.MeshStandardMaterial({
  color: 0x07090e,
  roughness: 0.92,
  metalness: 0.05
});
const wall = new THREE.Mesh(new THREE.PlaneGeometry(32, 20), wallMaterial);
wall.position.z = -0.62;
wall.receiveShadow = true;
scene.add(wall);

const sign = new THREE.Group();
sign.rotation.x = -0.015;
scene.add(sign);

const panelMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x090b11,
  roughness: 0.38,
  metalness: 0.36,
  clearcoat: 0.45,
  clearcoatRoughness: 0.42
});
const panel = new THREE.Mesh(new RoundedBoxGeometry(12, 5.8, 0.42, 6, 0.18), panelMaterial);
panel.castShadow = true;
panel.receiveShadow = true;
panel.position.z = -0.18;
sign.add(panel);

const innerFace = new THREE.Mesh(
  new THREE.PlaneGeometry(11.25, 5.05),
  new THREE.MeshPhysicalMaterial({
    color: 0x05070b,
    roughness: 0.31,
    metalness: 0.28,
    clearcoat: 0.3,
    clearcoatRoughness: 0.6
  })
);
innerFace.position.z = 0.045;
sign.add(innerFace);

const frameMaterial = new THREE.MeshStandardMaterial({
  color: 0x252a34,
  roughness: 0.3,
  metalness: 0.85
});

function addFrameBar(width, height, x, y) {
  const mesh = new THREE.Mesh(new RoundedBoxGeometry(width, height, 0.23, 3, 0.07), frameMaterial);
  mesh.position.set(x, y, 0.12);
  mesh.castShadow = true;
  sign.add(mesh);
}
addFrameBar(12.18, 0.16, 0, 2.91);
addFrameBar(12.18, 0.16, 0, -2.91);
addFrameBar(0.16, 5.68, -6.01, 0);
addFrameBar(0.16, 5.68, 6.01, 0);

const bracketMaterial = new THREE.MeshStandardMaterial({
  color: 0x3b414c,
  roughness: 0.3,
  metalness: 0.88
});
const screwMaterial = new THREE.MeshStandardMaterial({
  color: 0x7d8795,
  roughness: 0.22,
  metalness: 0.95
});

for (const x of [-5.42, 5.42]) {
  for (const y of [-2.36, 2.36]) {
    const bracket = new THREE.Mesh(new RoundedBoxGeometry(0.48, 0.28, 0.16, 3, 0.06), bracketMaterial);
    bracket.position.set(x, y, 0.25);
    bracket.castShadow = true;
    sign.add(bracket);

    const screw = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.065, 20), screwMaterial);
    screw.rotation.x = Math.PI / 2;
    screw.position.set(x, y, 0.36);
    sign.add(screw);
  }
}

const pink = new THREE.Color(0xff197f);
const cyan = new THREE.Color(0x19e9ff);
const warmWhite = new THREE.Color(0xffeaf5);

function pointsToCurve(points, closed = false) {
  const vectors = points.map(([x, y]) => new THREE.Vector3(x, y, 0));
  if (vectors.length === 2) return new THREE.LineCurve3(vectors[0], vectors[1]);
  return new THREE.CatmullRomCurve3(vectors, closed, 'centripetal', 0.45);
}

function addTube(points, color, closed = false) {
  const curve = pointsToCurve(points, closed);
  const segments = Math.max(24, points.length * 12);

  const reflection = new THREE.Mesh(
    new THREE.TubeGeometry(curve, segments, 0.25, 10, closed),
    new THREE.MeshBasicMaterial({
      color,
      transparent: true,
      opacity: 0.07,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    })
  );
  reflection.position.z = 0.17;
  reflection.scale.set(1.015, 1.015, 0.45);
  sign.add(reflection);

  const halo = new THREE.Mesh(
    new THREE.TubeGeometry(curve, segments, 0.145, 12, closed),
    new THREE.MeshBasicMaterial({
      color,
      transparent: true,
      opacity: 0.2,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    })
  );
  halo.position.z = 0.38;
  sign.add(halo);

  const glass = new THREE.Mesh(
    new THREE.TubeGeometry(curve, segments, 0.092, 14, closed),
    new THREE.MeshPhysicalMaterial({
      color: color.clone().multiplyScalar(0.78),
      emissive: color,
      emissiveIntensity: 7.5,
      roughness: 0.16,
      metalness: 0,
      transmission: 0.08,
      thickness: 0.12,
      clearcoat: 1,
      clearcoatRoughness: 0.12
    })
  );
  glass.position.z = 0.43;
  glass.castShadow = true;
  sign.add(glass);

  const core = new THREE.Mesh(
    new THREE.TubeGeometry(curve, segments, 0.036, 10, closed),
    new THREE.MeshBasicMaterial({ color: warmWhite })
  );
  core.position.z = 0.475;
  sign.add(core);
}

const oPoints = [];
for (let i = 0; i < 32; i++) {
  const a = (i / 32) * Math.PI * 2;
  oPoints.push([-4.38 + Math.cos(a) * 0.94, Math.sin(a) * 1.75]);
}
addTube(oPoints, pink, true);

addTube([[-2.65, -1.75], [-2.65, 1.75]], cyan);
addTube([
  [-2.65, 1.74],
  [-1.94, 1.74],
  [-1.48, 1.48],
  [-1.29, 0.95],
  [-1.45, 0.43],
  [-1.93, 0.18],
  [-2.65, 0.18]
], cyan);

addTube([[-0.45, -1.75], [-0.45, 1.75]], pink);
addTube([[-0.45, 1.75], [1.18, 1.75]], pink);
addTube([[-0.45, 0.06], [0.91, 0.06]], pink);
addTube([[-0.45, -1.75], [1.18, -1.75]], pink);

addTube([[2.05, -1.75], [2.05, 1.75]], cyan);
addTube([[2.05, 1.75], [4.28, -1.75]], cyan);
addTube([[4.28, -1.75], [4.28, 1.75]], cyan);

const pinkFill = new THREE.PointLight(pink, 28, 9, 2);
pinkFill.position.set(-2.7, 0.2, 2.2);
sign.add(pinkFill);

const cyanFill = new THREE.PointLight(cyan, 29, 9, 2);
cyanFill.position.set(2.6, 0.2, 2.2);
sign.add(cyanFill);

const bottomGlow = new THREE.PointLight(0x6633ff, 8, 9, 2);
bottomGlow.position.set(0, -2.4, 1.2);
sign.add(bottomGlow);

const cableMaterial = new THREE.MeshStandardMaterial({
  color: 0x11131a,
  roughness: 0.75,
  metalness: 0.15
});
const cableCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(5.15, -2.35, 0.28),
  new THREE.Vector3(5.28, -2.65, 0.22),
  new THREE.Vector3(5.14, -2.9, 0.08)
], false, 'centripetal');
const cable = new THREE.Mesh(new THREE.TubeGeometry(cableCurve, 24, 0.055, 8, false), cableMaterial);
sign.add(cable);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  const pulse = 1 + Math.sin(elapsed * 1.7) * 0.018 + Math.sin(elapsed * 6.1) * 0.006;
  pinkFill.intensity = 28 * pulse;
  cyanFill.intensity = 29 * (2 - pulse);
  controls.update();
  composer.render();
}

window.addEventListener('resize', () => {
  const width = window.innerWidth;
  const height = window.innerHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(width, height);
  composer.setSize(width, height);
});

animate();
</script>
</body>
</html>
