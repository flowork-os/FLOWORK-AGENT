<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Underground Subway Platform</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #050607;
    }
    canvas {
      display: block;
    }
    #title {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(224, 228, 220, 0.72);
      font: 11px/1.4 Arial, sans-serif;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 1px 4px #000;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="title">Canal Street · Downtown Platform</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07090a);
    scene.fog = new THREE.FogExp2(0x111719, 0.022);

    const camera = new THREE.PerspectiveCamera(
      52,
      window.innerWidth / window.innerHeight,
      0.1,
      140
    );
    camera.position.set(18, 7.5, 18);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.4, 0.8);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.24;
    controls.minDistance = 9;
    controls.maxDistance = 42;
    controls.maxPolarAngle = Math.PI * 0.48;

    let seed = 184730;
    function random() {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    function rand(min, max) {
      return min + (max - min) * random();
    }

    const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

    function canvasTexture(width, height, draw, repeatX = 1, repeatY = 1) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      draw(ctx, width, height);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(repeatX, repeatY);
      texture.anisotropy = maxAnisotropy;
      return texture;
    }

    const concreteTexture = canvasTexture(256, 256, (ctx, w, h) => {
      ctx.fillStyle = '#444744';
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 9000; i++) {
        const v = Math.floor(rand(42, 96));
        const a = rand(0.025, 0.13);
        ctx.fillStyle = `rgba(${v},${v + 2},${v},${a})`;
        ctx.fillRect(rand(0, w), rand(0, h), rand(1, 4), rand(1, 4));
      }
      for (let i = 0; i < 25; i++) {
        ctx.strokeStyle = `rgba(20,18,16,${rand(0.05, 0.18)})`;
        ctx.lineWidth = rand(0.4, 1.4);
        ctx.beginPath();
        let x = rand(0, w);
        let y = rand(0, h);
        ctx.moveTo(x, y);
        for (let j = 0; j < 5; j++) {
          x += rand(-20, 20);
          y += rand(4, 22);
          ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }, 12, 3);

    const floorTexture = canvasTexture(512, 512, (ctx, w, h) => {
      ctx.fillStyle = '#343936';
      ctx.fillRect(0, 0, w, h);
      const size = 42;
      ctx.lineWidth = 2;
      for (let y = 0; y <= h; y += size) {
        for (let x = 0; x <= w; x += size) {
          const shade = Math.floor(rand(47, 66));
          ctx.fillStyle = `rgb(${shade},${shade + 4},${shade + 2})`;
          ctx.fillRect(x + 2, y + 2, size - 3, size - 3);
        }
      }
      ctx.strokeStyle = 'rgba(13,15,14,0.72)';
      for (let x = 0; x <= w; x += size) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 0; y <= h; y += size) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
      for (let i = 0; i < 180; i++) {
        ctx.fillStyle = `rgba(8,10,9,${rand(0.03, 0.18)})`;
        ctx.beginPath();
        ctx.ellipse(
          rand(0, w),
          rand(0, h),
          rand(2, 24),
          rand(1, 8),
          rand(0, Math.PI),
          0,
          Math.PI * 2
        );
        ctx.fill();
      }
    }, 8, 3);

    const tileTexture = canvasTexture(256, 512, (ctx, w, h) => {
      ctx.fillStyle = '#aaa99f';
      ctx.fillRect(0, 0, w, h);
      const tw = 64;
      const th = 48;
      for (let y = 0; y < h; y += th) {
        for (let x = 0; x < w; x += tw) {
          const d = Math.floor(rand(-10, 10));
          ctx.fillStyle = `rgb(${188 + d},${187 + d},${175 + d})`;
          ctx.fillRect(x + 3, y + 3, tw - 5, th - 5);
          ctx.fillStyle = `rgba(255,255,245,${rand(0.03, 0.12)})`;
          ctx.fillRect(x + 5, y + 5, tw - 10, 3);
        }
      }
      ctx.strokeStyle = 'rgba(42,45,43,0.72)';
      ctx.lineWidth = 3;
      for (let x = 0; x <= w; x += tw) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 0; y <= h; y += th) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }
      for (let i = 0; i < 60; i++) {
        ctx.fillStyle = `rgba(36,35,29,${rand(0.02, 0.15)})`;
        ctx.fillRect(rand(0, w), rand(0, h), rand(2, 15), rand(3, 28));
      }
    }, 2, 4);

    const yellowTexture = canvasTexture(256, 128, (ctx, w, h) => {
      ctx.fillStyle = '#c8a510';
      ctx.fillRect(0, 0, w, h);
      for (let y = 7; y < h; y += 14) {
        for (let x = 7; x < w; x += 14) {
          ctx.fillStyle = random() > 0.1 ? '#e3c334' : '#9d8112';
          ctx.beginPath();
          ctx.arc(x, y, 2.7, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      for (let i = 0; i < 80; i++) {
        ctx.fillStyle = `rgba(40,35,15,${rand(0.04, 0.2)})`;
        ctx.fillRect(rand(0, w), rand(0, h), rand(1, 12), rand(1, 5));
      }
    }, 16, 1);

    const metalTexture = canvasTexture(512, 256, (ctx, w, h) => {
      const gradient = ctx.createLinearGradient(0, 0, 0, h);
      gradient.addColorStop(0, '#afb5b5');
      gradient.addColorStop(0.18, '#6f7778');
      gradient.addColorStop(0.5, '#bbc0be');
      gradient.addColorStop(0.72, '#5e6668');
      gradient.addColorStop(1, '#89908f');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 450; i++) {
        ctx.fillStyle = `rgba(255,255,255,${rand(0.01, 0.055)})`;
        ctx.fillRect(0, rand(0, h), w, rand(0.3, 1.5));
      }
      for (let i = 0; i < 30; i++) {
        ctx.fillStyle = `rgba(40,32,24,${rand(0.02, 0.11)})`;
        ctx.fillRect(rand(0, w), rand(0, h), rand(2, 30), rand(1, 5));
      }
    }, 5, 1);

    const wallMaterial = new THREE.MeshStandardMaterial({
      map: concreteTexture,
      color: 0x777a76,
      roughness: 0.96,
      metalness: 0.02,
      side: THREE.BackSide
    });
    const floorMaterial = new THREE.MeshStandardMaterial({
      map: floorTexture,
      roughness: 0.93,
      metalness: 0.05
    });
    const tileMaterial = new THREE.MeshStandardMaterial({
      map: tileTexture,
      roughness: 0.78,
      metalness: 0.02
    });
    const yellowMaterial = new THREE.MeshStandardMaterial({
      map: yellowTexture,
      color: 0xf0c71c,
      roughness: 0.82
    });
    const darkMetal = new THREE.MeshStandardMaterial({
      color: 0x161c1d,
      roughness: 0.5,
      metalness: 0.75
    });
    const blackRubber = new THREE.MeshStandardMaterial({
      color: 0x111313,
      roughness: 0.9
    });

    function mesh(geometry, material, x, y, z, cast = true, receive = true) {
      const object = new THREE.Mesh(geometry, material);
      object.position.set(x, y, z);
      object.castShadow = cast;
      object.receiveShadow = receive;
      scene.add(object);
      return object;
    }

    const platform = mesh(
      new THREE.BoxGeometry(64, 0.65, 11.5),
      floorMaterial,
      0,
      0,
      3.85
    );

    const platformFace = mesh(
      new THREE.BoxGeometry(64, 1.5, 0.35),
      new THREE.MeshStandardMaterial({
        color: 0x272a28,
        roughness: 1
      }),
      0,
      -0.45,
      -2.03
    );

    const warningStrip = mesh(
      new THREE.BoxGeometry(64, 0.09, 1.05),
      yellowMaterial,
      0,
      0.37,
      -1.55
    );

    const trackBed = mesh(
      new THREE.BoxGeometry(70, 0.25, 4),
      new THREE.MeshStandardMaterial({
        color: 0x171918,
        roughness: 1
      }),
      0,
      -1.18,
      -4.25
    );

    const railMaterial = new THREE.MeshStandardMaterial({
      color: 0x6d7472,
      roughness: 0.36,
      metalness: 0.92
    });

    for (const z of [-3.3, -5.35]) {
      mesh(
        new THREE.BoxGeometry(70, 0.14, 0.12),
        railMaterial,
        0,
        -0.85,
        z
      );
    }

    const sleeperMaterial = new THREE.MeshStandardMaterial({
      color: 0x30261f,
      roughness: 1
    });

    for (let x = -34; x <= 34; x += 1.15) {
      mesh(
        new THREE.BoxGeometry(0.22, 0.13, 3.2),
        sleeperMaterial,
        x,
        -1.04,
        -4.3,
        false,
        true
      );
    }

    const ceiling = mesh(
      new THREE.CylinderGeometry(
        10.8,
        10.8,
        66,
        48,
        1,
        true,
        0,
        Math.PI
      ),
      wallMaterial,
      0,
      0.5,
      3.1,
      false,
      true
    );
    ceiling.rotation.z = Math.PI * 0.5;

    const rearWall = mesh(
      new THREE.BoxGeometry(66, 7.5, 0.45),
      new THREE.MeshStandardMaterial({
        map: tileTexture,
        color: 0x696d69,
        roughness: 0.92
      }),
      0,
      3.25,
      10.15
    );

    const tunnelWall = mesh(
      new THREE.BoxGeometry(66, 7, 0.4),
      new THREE.MeshStandardMaterial({
        map: concreteTexture,
        color: 0x292e2e,
        roughness: 1
      }),
      0,
      2.2,
      -6.45
    );

    for (let x = -30; x <= 30; x += 6) {
      const rib = new THREE.Mesh(
        new THREE.TorusGeometry(10.3, 0.09, 6, 32, Math.PI),
        darkMetal
      );
      rib.position.set(x, 0.5, 3.1);
      rib.rotation.y = Math.PI * 0.5;
      rib.castShadow = true;
      scene.add(rib);
    }

    function createPillar(x, z) {
      const group = new THREE.Group();
      const shaft = new THREE.Mesh(
        new THREE.BoxGeometry(1.25, 6.2, 1.25),
        tileMaterial
      );
      shaft.position.y = 3.42;
      shaft.castShadow = true;
      shaft.receiveShadow = true;
      group.add(shaft);

      const base = new THREE.Mesh(
        new THREE.BoxGeometry(1.48, 0.38, 1.48),
        new THREE.MeshStandardMaterial({
          color: 0x343937,
          roughness: 0.9
        })
      );
      base.position.y = 0.52;
      base.castShadow = true;
      group.add(base);

      const cap = base.clone();
      cap.position.y = 6.3;
      group.add(cap);

      const stripe = new THREE.Mesh(
        new THREE.BoxGeometry(1.31, 0.28, 1.31),
        new THREE.MeshStandardMaterial({
          color: 0x1e454b,
          roughness: 0.7
        })
      );
      stripe.position.y = 4.05;
      group.add(stripe);

      const grime = new THREE.Mesh(
        new THREE.PlaneGeometry(0.8, 1.5),
        new THREE.MeshBasicMaterial({
          color: 0x332d26,
          transparent: true,
          opacity: rand(0.07, 0.16),
          depthWrite: false
        })
      );
      grime.position.set(0, 1.35, 0.631);
      group.add(grime);

      group.position.set(x, 0, z);
      scene.add(group);
    }

    for (let x = -27; x <= 27; x += 9) {
      createPillar(x, 5.8);
    }

    function makeTextTexture(text, subtext, fg, bg, width = 1024) {
      return canvasTexture(width, 256, (ctx, w, h) => {
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = fg;
        ctx.font = 'bold 108px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, w / 2, h * 0.43);
        if (subtext) {
          ctx.font = '32px Arial';
          ctx.fillText(subtext, w / 2, h * 0.78);
        }
      });
    }

    function createHangingSign(x, z, text) {
      const group = new THREE.Group();
      const signTexture = makeTextTexture(
        text,
        'Downtown & Brooklyn',
        '#f0f2ea',
        '#152123'
      );
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(5.6, 1.2, 0.16),
        new THREE.MeshStandardMaterial({
          color: 0x182022,
          roughness: 0.45,
          metalness: 0.45
        })
      );
      body.position.y = 6.25;
      body.castShadow = true;
      group.add(body);

      const face = new THREE.Mesh(
        new THREE.PlaneGeometry(5.35, 0.98),
        new THREE.MeshStandardMaterial({
          map: signTexture,
          emissiveMap: signTexture,
          emissive: 0x172626,
          emissiveIntensity: 0.55,
          roughness: 0.55
        })
      );
      face.position.set(0, 6.25, 0.086);
      group.add(face);

      for (const dx of [-2.2, 2.2]) {
        const rod = new THREE.Mesh(
          new THREE.CylinderGeometry(0.025, 0.025, 2.5, 8),
          darkMetal
        );
        rod.position.set(dx, 7.45, 0);
        group.add(rod);
      }

      group.position.set(x, 0, z);
      scene.add(group);
    }

    createHangingSign(-8, 3.5, 'DOWNTOWN');
    createHangingSign(17, 3.5, 'EXIT  ↑');

    function createBench(x, z, rotation = 0) {
      const group = new THREE.Group();
      const seatMaterial = new THREE.MeshStandardMaterial({
        color: 0x6e3025,
        roughness: 0.62,
        metalness: 0.12
      });

      for (let i = -2; i <= 2; i++) {
        const slat = new THREE.Mesh(
          new THREE.BoxGeometry(3.8, 0.12, 0.16),
          seatMaterial
        );
        slat.position.set(0, 1.0 + i * 0.12, i < 0 ? -0.26 : -0.1);
        slat.rotation.x = i * 0.02;
        slat.castShadow = true;
        group.add(slat);
      }

      for (let i = 0; i < 4; i++) {
        const back = new THREE.Mesh(
          new THREE.BoxGeometry(3.8, 0.13, 0.17),
          seatMaterial
        );
        back.position.set(0, 1.45 + i * 0.18, 0.2 + i * 0.04);
        back.rotation.x = -0.12;
        back.castShadow = true;
        group.add(back);
      }

      for (const dx of [-1.55, 1.55]) {
        const leg = new THREE.Mesh(
          new THREE.BoxGeometry(0.1, 0.8, 0.1),
          darkMetal
        );
        leg.position.set(dx, 0.75, 0);
        leg.castShadow = true;
        group.add(leg);

        const foot = new THREE.Mesh(
          new THREE.BoxGeometry(0.55, 0.08, 0.65),
          darkMetal
        );
        foot.position.set(dx, 0.4, 0);
        group.add(foot);
      }

      group.position.set(x, 0, z);
      group.rotation.y = rotation;
      scene.add(group);
    }

    createBench(-15, 3.2);
    createBench(7, 7.7, Math.PI);
    createBench(22, 3.2);

    function createRouteMap(x, z) {
      const group = new THREE.Group();
      const routeTexture = canvasTexture(768, 400, (ctx, w, h) => {
        ctx.fillStyle = '#e9e5d4';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#152025';
        ctx.font = 'bold 42px Arial';
        ctx.fillText('CITY TRANSIT', 34, 54);
        ctx.font = '20px Arial';
        ctx.fillText('Downtown service map', 36, 88);

        const routes = [
          { color: '#d34635', y: 145, phase: 0 },
          { color: '#2c71b8', y: 215, phase: 16 },
          { color: '#2d9b63', y: 285, phase: -12 }
        ];

        for (const route of routes) {
          ctx.strokeStyle = route.color;
          ctx.lineWidth = 12;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(35, route.y);
          for (let i = 1; i <= 7; i++) {
            const px = 35 + i * 94;
            const py = route.y + Math.sin(i * 1.4 + route.phase) * 26;
            ctx.lineTo(px, py);
          }
          ctx.stroke();

          for (let i = 0; i <= 7; i++) {
            const px = 35 + i * 94;
            const py = route.y + Math.sin(i * 1.4 + route.phase) * 26;
            ctx.fillStyle = '#f5f1df';
            ctx.beginPath();
            ctx.arc(px, py, 9, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = route.color;
            ctx.lineWidth = 5;
            ctx.stroke();
          }
        }
      });

      const frame = new THREE.Mesh(
        new THREE.BoxGeometry(5.2, 3.25, 0.28),
        darkMetal
      );
      frame.position.y = 3.1;
      frame.castShadow = true;
      group.add(frame);

      const map = new THREE.Mesh(
        new THREE.PlaneGeometry(4.85, 2.86),
        new THREE.MeshStandardMaterial({
          map: routeTexture,
          emissiveMap: routeTexture,
          emissive: 0x64675d,
          emissiveIntensity: 0.7,
          roughness: 0.42
        })
      );
      map.position.set(0, 3.1, 0.15);
      group.add(map);

      const glow = new THREE.PointLight(0xdfe9cc, 2.5, 6, 2);
      glow.position.set(0, 3.2, 1);
      group.add(glow);

      group.position.set(x, 0, z);
      group.rotation.y = Math.PI;
      scene.add(group);
    }

    createRouteMap(-2, 9.7);

    function createVendingMachine(x, z, color, label) {
      const group = new THREE.Group();
      const labelTexture = canvasTexture(256, 512, (ctx, w, h) => {
        const gradient = ctx.createLinearGradient(0, 0, 0, h);
        gradient.addColorStop(0, color);
        gradient.addColorStop(1, '#181d20');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.font = 'bold 38px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(label, w / 2, 55);

        for (let row = 0; row < 5; row++) {
          for (let col = 0; col < 4; col++) {
            const px = 34 + col * 56;
            const py = 105 + row * 62;
            ctx.fillStyle = `hsl(${Math.floor(rand(0, 360))},55%,55%)`;
            ctx.fillRect(px, py, 34, 42);
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.fillRect(px + 4, py + 4, 6, 30);
          }
        }

        ctx.fillStyle = '#111';
        ctx.fillRect(178, 420, 50, 32);
        ctx.fillStyle = '#a9e28a';
        ctx.fillRect(185, 426, 35, 8);
      });

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.65, 3.6, 1.05),
        new THREE.MeshStandardMaterial({
          color: 0x252b2d,
          roughness: 0.48,
          metalness: 0.52
        })
      );
      body.position.y = 2.15;
      body.castShadow = true;
      group.add(body);

      const face = new THREE.Mesh(
        new THREE.PlaneGeometry(1.43, 3.25),
        new THREE.MeshStandardMaterial({
          map: labelTexture,
          emissiveMap: labelTexture,
          emissive: 0x263033,
          emissiveIntensity: 0.35,
          roughness: 0.32
        })
      );
      face.position.set(0, 2.22, 0.531);
      group.add(face);

      const topLight = new THREE.PointLight(0xe5f3db, 0.65, 3);
      topLight.position.set(0, 3.5, 0.8);
      group.add(topLight);

      group.position.set(x, 0, z);
      scene.add(group);
    }

    createVendingMachine(11.5, 9.5, '#254f6e', 'COLD DRINKS');
    createVendingMachine(13.35, 9.5, '#812f27', 'SNACKS');

    function createStairs() {
      const group = new THREE.Group();
      const stairMaterial = new THREE.MeshStandardMaterial({
        color: 0x505551,
        roughness: 0.92
      });

      for (let i = 0; i < 10; i++) {
        const step = new THREE.Mesh(
          new THREE.BoxGeometry(5.1, 0.28, 0.78),
          stairMaterial
        );
        step.position.set(0, 0.5 + i * 0.27, 8.4 - i * 0.58);
        step.castShadow = true;
        step.receiveShadow = true;
        group.add(step);
      }

      for (const side of [-2.25, 2.25]) {
        const handrail = new THREE.Mesh(
          new THREE.CylinderGeometry(0.055, 0.055, 6.6, 12),
          railMaterial
        );
        handrail.position.set(side, 2.45, 5.8);
        handrail.rotation.x = Math.atan2(5.8, 2.7);
        group.add(handrail);

        for (let i = 0; i < 5; i++) {
          const post = new THREE.Mesh(
            new THREE.CylinderGeometry(0.038, 0.038, 1.15, 10),
            railMaterial
          );
          post.position.set(side, 1.15 + i * 0.55, 8 - i * 1.15);
          group.add(post);
        }
      }

      const opening = new THREE.Mesh(
        new THREE.BoxGeometry(6.3, 4.1, 0.35),
        new THREE.MeshStandardMaterial({
          color: 0x080b0c,
          roughness: 1
        })
      );
      opening.position.set(0, 3.8, 3.1);
      group.add(opening);

      group.position.set(25.5, 0, 1.2);
      group.rotation.y = -Math.PI * 0.5;
      scene.add(group);
    }

    createStairs();

    const train = new THREE.Group();
    train.position.set(-19, -0.14, -4.4);
    scene.add(train);

    const trainBodyMaterial = new THREE.MeshStandardMaterial({
      map: metalTexture,
      color: 0xaeb7b5,
      roughness: 0.38,
      metalness: 0.82
    });

    const trainBody = new THREE.Mesh(
      new THREE.BoxGeometry(34, 4.3, 3.1),
      trainBodyMaterial
    );
    trainBody.position.y = 2.15;
    trainBody.castShadow = true;
    trainBody.receiveShadow = true;
    train.add(trainBody);

    const trainRoof = new THREE.Mesh(
      new THREE.CylinderGeometry(1.55, 1.55, 34, 24, 1, false, 0, Math.PI),
      trainBodyMaterial
    );
    trainRoof.rotation.z = Math.PI * 0.5;
    trainRoof.position.y = 4.25;
    train.add(trainRoof);

    const blueStripe = new THREE.Mesh(
      new THREE.BoxGeometry(34.05, 0.34, 0.045),
      new THREE.MeshStandardMaterial({
        color: 0x174a72,
        roughness: 0.4,
        metalness: 0.4
      })
    );
    blueStripe.position.set(0, 1.52, 1.574);
    train.add(blueStripe);

    const windowMaterial = new THREE.MeshStandardMaterial({
      color: 0xc7d7c9,
      emissive: 0xe8dba2,
      emissiveIntensity: 2.4,
      roughness: 0.18,
      metalness: 0.05
    });

    const darkGlass = new THREE.MeshStandardMaterial({
      color: 0x16252a,
      emissive: 0x162017,
      emissiveIntensity: 0.3,
      roughness: 0.2,
      metalness: 0.5
    });

    const doorPairs = [];
    const windowXs = [-14.6, -13.1, -9.7, -8.2, -4.8, -3.3, 0.1, 1.6, 5, 6.5, 9.9, 11.4, 14.8];

    for (const x of windowXs) {
      const windowMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(1.12, 1.22),
        random() > 0.15 ? windowMaterial : darkGlass
      );
      windowMesh.position.set(x, 2.85, 1.577);
      train.add(windowMesh);

      const windowFrame = new THREE.Mesh(
        new THREE.BoxGeometry(1.29, 1.39, 0.055),
        darkMetal
      );
      windowFrame.position.set(x, 2.85, 1.552);
      train.add(windowFrame);
      train.remove(windowMesh);
      train.add(windowFrame);
      train.add(windowMesh);
    }

    for (const doorX of [-11.25, -6.3, -1.35, 3.6, 8.55, 13.5]) {
      const pair = new THREE.Group();
      const leftDoor = new THREE.Mesh(
        new THREE.BoxGeometry(0.88, 3.18, 0.09),
        trainBodyMaterial
      );
      const rightDoor = leftDoor.clone();
      leftDoor.position.set(-0.46, 2.0, 1.59);
      rightDoor.position.set(0.46, 2.0, 1.59);
      leftDoor.castShadow = true;
      rightDoor.castShadow = true;
      pair.add(leftDoor, rightDoor);

      for (const dx of [-0.46, 0.46]) {
        const glass = new THREE.Mesh(
          new THREE.PlaneGeometry(0.59, 1.04),
          darkGlass
        );
        glass.position.set(dx, 2.52, 1.642);
        pair.add(glass);
      }

      const divider = new THREE.Mesh(
        new THREE.BoxGeometry(0.07, 3.2, 0.11),
        darkMetal
      );
      divider.position.set(0, 2, 1.65);
      pair.add(divider);

      pair.position.x = doorX;
      train.add(pair);
      doorPairs.push({ pair, leftDoor, rightDoor });
    }

    const endCab = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 3.4, 2.7),
      new THREE.MeshStandardMaterial({
        color: 0x283337,
        roughness: 0.45,
        metalness: 0.5
      })
    );
    endCab.position.set(17.05, 2.12, 0);
    train.add(endCab);

    for (const y of [1.35, 3.15]) {
      const lamp = new THREE.Mesh(
        new THREE.CircleGeometry(0.12, 16),
        new THREE.MeshStandardMaterial({
          color: 0xffdf9f,
          emissive: 0xffb74e,
          emissiveIntensity: 3
        })
      );
      lamp.rotation.y = Math.PI * 0.5;
      lamp.position.set(17.12, y, 0.9);
      train.add(lamp);
    }

    for (let x = -15; x <= 15; x += 4.9) {
      for (const z of [-1.25, 1.25]) {
        const wheel = new THREE.Mesh(
          new THREE.CylinderGeometry(0.37, 0.37, 0.22, 18),
          blackRubber
        );
        wheel.rotation.z = Math.PI * 0.5;
        wheel.position.set(x, 0.25, z);
        train.add(wheel);
      }
    }

    const trainLight = new THREE.PointLight(0xffd89b, 10, 9, 2);
    trainLight.position.set(12, 2.8, 2.2);
    trainLight.castShadow = false;
    train.add(trainLight);

    const fluorescentFixtures = [];
    function createFluorescent(x, z, flicker = false) {
      const group = new THREE.Group();
      const housing = new THREE.Mesh(
        new THREE.BoxGeometry(4.5, 0.16, 0.62),
        new THREE.MeshStandardMaterial({
          color: 0x494e4c,
          roughness: 0.65,
          metalness: 0.45
        })
      );
      housing.position.y = 7.7;
      housing.castShadow = true;
      group.add(housing);

      const tubeMaterial = new THREE.MeshStandardMaterial({
        color: 0xeaf2dd,
        emissive: 0xd9f0d2,
        emissiveIntensity: 3.2,
        roughness: 0.2
      });

      for (const dz of [-0.17, 0.17]) {
        const tube = new THREE.Mesh(
          new THREE.CylinderGeometry(0.045, 0.045, 4.05, 12),
          tubeMaterial
        );
        tube.rotation.z = Math.PI * 0.5;
        tube.position.set(0, 7.61, dz);
        group.add(tube);
      }

      const light = new THREE.RectAreaLight(0xddebd5, 5.2, 4.2, 1.2);
      light.position.set(0, 7.25, 0);
      light.rotation.x = -Math.PI * 0.5;
      group.add(light);

      group.position.set(x, 0, z);
      scene.add(group);
      fluorescentFixtures.push({ group, light, tubeMaterial, flicker });
    }

    createFluorescent(-23, 3.1);
    createFluorescent(-12, 3.1, true);
    createFluorescent(-1, 3.1);
    createFluorescent(10, 3.1);
    createFluorescent(21, 3.1, true);

    const ambient = new THREE.HemisphereLight(0x9eb5af, 0x1c1814, 0.48);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xbfd3ca, 1.1);
    keyLight.position.set(8, 14, 9);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -28;
    keyLight.shadow.camera.right = 28;
    keyLight.shadow.camera.top = 18;
    keyLight.shadow.camera.bottom = -18;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 45;
    keyLight.shadow.bias = -0.00025;
    scene.add(keyLight);

    const tunnelGlow = new THREE.PointLight(0xe1b56f, 3.4, 18, 2);
    tunnelGlow.position.set(-24, 2, -5.2);
    scene.add(tunnelGlow);

    function createTrashCan(x, z) {
      const group = new THREE.Group();
      const can = new THREE.Mesh(
        new THREE.CylinderGeometry(0.43, 0.48, 1.15, 20, 1, true),
        new THREE.MeshStandardMaterial({
          color: 0x313a3a,
          roughness: 0.6,
          metalness: 0.68
        })
      );
      can.position.y = 0.95;
      can.castShadow = true;
      group.add(can);

      for (let i = 0; i < 10; i++) {
        const bar = new THREE.Mesh(
          new THREE.BoxGeometry(0.035, 1.05, 0.035),
          darkMetal
        );
        const a = i / 10 * Math.PI * 2;
        bar.position.set(Math.cos(a) * 0.43, 0.95, Math.sin(a) * 0.43);
        group.add(bar);
      }

      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(0.44, 0.045, 8, 20),
        darkMetal
      );
      rim.position.y = 1.5;
      rim.rotation.x = Math.PI * 0.5;
      group.add(rim);

      group.position.set(x, 0, z);
      scene.add(group);
    }

    createTrashCan(-9.5, 7.8);
    createTrashCan(18.5, 7.8);

    const pipes = new THREE.Group();
    scene.add(pipes);

    for (let i = 0; i < 4; i++) {
      const pipe = new THREE.Mesh(
        new THREE.CylinderGeometry(0.08 + i * 0.012, 0.08 + i * 0.012, 57, 10),
        new THREE.MeshStandardMaterial({
          color: i === 2 ? 0x6c4837 : 0x3d4443,
          roughness: 0.58,
          metalness: 0.72
        })
      );
      pipe.rotation.z = Math.PI * 0.5;
      pipe.position.set(0, 6.1 + i * 0.25, 9.75);
      pipe.castShadow = true;
      pipes.add(pipe);
    }

    for (let x = -27; x <= 27; x += 6) {
      const bracket = new THREE.Mesh(
        new THREE.BoxGeometry(0.09, 1.05, 0.09),
        darkMetal
      );
      bracket.position.set(x, 6.45, 9.58);
      pipes.add(bracket);
    }

    const paperMaterial = new THREE.MeshStandardMaterial({
      color: 0xd6d0ba,
      roughness: 0.86,
      side: THREE.DoubleSide
    });
    const papers = [];

    for (let i = 0; i < 18; i++) {
      const geometry = new THREE.PlaneGeometry(
        rand(0.18, 0.42),
        rand(0.22, 0.52),
        2,
        2
      );
      const positions = geometry.attributes.position;
      for (let j = 0; j < positions.count; j++) {
        positions.setZ(j, rand(-0.025, 0.025));
      }
      positions.needsUpdate = true;
      geometry.computeVertexNormals();

      const paper = new THREE.Mesh(geometry, paperMaterial.clone());
      paper.material.color.offsetHSL(
        rand(-0.03, 0.03),
        rand(-0.08, 0.03),
        rand(-0.08, 0.05)
      );
      paper.position.set(rand(-27, 28), 0.4, rand(-0.7, 8.7));
      paper.rotation.set(-Math.PI * 0.5, rand(-0.18, 0.18), rand(0, Math.PI * 2));
      paper.receiveShadow = true;
      scene.add(paper);
      papers.push({
        mesh: paper,
        phase: rand(0, Math.PI * 2),
        speed: rand(0.55, 1.3),
        lift: rand(0.03, 0.19),
        drift: rand(0.02, 0.09)
      });
    }

    for (let i = 0; i < 28; i++) {
      const gum = new THREE.Mesh(
        new THREE.CircleGeometry(rand(0.025, 0.075), 12),
        new THREE.MeshBasicMaterial({
          color: random() > 0.5 ? 0x252724 : 0x514c42,
          transparent: true,
          opacity: rand(0.35, 0.75),
          depthWrite: false
        })
      );
      gum.rotation.x = -Math.PI * 0.5;
      gum.position.set(rand(-29, 29), 0.379, rand(-0.9, 9));
      scene.add(gum);
    }

    function createCable(x, z, length) {
      const cable = new THREE.Mesh(
        new THREE.CylinderGeometry(0.018, 0.018, length, 7),
        new THREE.MeshStandardMaterial({
          color: 0x121413,
          roughness: 0.9
        })
      );
      cable.position.set(x, 7.8 - length * 0.5, z);
      cable.rotation.z = rand(-0.08, 0.08);
      scene.add(cable);
    }

    createCable(-18, 7.5, 1.5);
    createCable(4.5, 8.7, 2.1);
    createCable(15, 7.9, 1.1);

    const clockTexture = canvasTexture(256, 256, (ctx, w, h) => {
      ctx.fillStyle = '#ede8d6';
      ctx.beginPath();
      ctx.arc(w / 2, h / 2, 118, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#1d2223';
      ctx.lineWidth = 12;
      ctx.stroke();

      ctx.translate(w / 2, h / 2);
      for (let i = 0; i < 12; i++) {
        ctx.rotate(Math.PI / 6);
        ctx.fillStyle = '#202526';
        ctx.fillRect(-3, -99, 6, 16);
      }
      ctx.rotate(-Math.PI * 2);
      ctx.strokeStyle = '#202526';
      ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -68);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(49, 18);
      ctx.stroke();
      ctx.fillStyle = '#b6372b';
      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, Math.PI * 2);
      ctx.fill();
    });

    const clock = new THREE.Mesh(
      new THREE.CircleGeometry(0.72, 48),
      new THREE.MeshStandardMaterial({
        map: clockTexture,
        roughness: 0.36
      })
    );
    clock.position.set(-21.8, 5.5, 9.91);
    clock.rotation.y = Math.PI;
    scene.add(clock);

    const dustCount = 650;
    const dustGeometry = new THREE.BufferGeometry();
    const dustPositions = new Float32Array(dustCount * 3);
    const dustPhases = new Float32Array(dustCount);

    for (let i = 0; i < dustCount; i++) {
      dustPositions[i * 3] = rand(-34, 34);
      dustPositions[i * 3 + 1] = rand(0.45, 8.3);
      dustPositions[i * 3 + 2] = rand(-5.8, 10);
      dustPhases[i] = rand(0, Math.PI * 2);
    }

    dustGeometry.setAttribute(
      'position',
      new THREE.BufferAttribute(dustPositions, 3)
    );

    const dust = new THREE.Points(
      dustGeometry,
      new THREE.PointsMaterial({
        color: 0xb9b6a2,
        size: 0.025,
        transparent: true,
        opacity: 0.28,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      })
    );
    scene.add(dust);

    const clockTimer = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const time = clockTimer.getElapsedTime();
      const arrivalCycle = (time % 36) / 36;
      let trainX;

      if (arrivalCycle < 0.28) {
        const p = arrivalCycle / 0.28;
        const eased = 1 - Math.pow(1 - p, 3);
        trainX = -38 + eased * 19;
      } else if (arrivalCycle < 0.78) {
        trainX = -19;
      } else {
        const p = (arrivalCycle - 0.78) / 0.22;
        trainX = -19 + p * 47;
      }

      train.position.x = trainX;
      train.position.y = -0.14 + Math.sin(time * 7.5) * 0.008;

      const doorOpen =
        arrivalCycle > 0.36 && arrivalCycle < 0.69
          ? Math.min(
              1,
              (arrivalCycle - 0.36) * 18,
              (0.69 - arrivalCycle) * 18
            )
          : 0;

      for (const item of doorPairs) {
        item.leftDoor.position.x = -0.46 - doorOpen * 0.39;
        item.rightDoor.position.x = 0.46 + doorOpen * 0.39;
      }

      for (const fixture of fluorescentFixtures) {
        if (fixture.flicker) {
          const noisy =
            Math.sin(time * 37.1) +
            Math.sin(time * 73.7) * 0.55 +
            Math.sin(time * 151.3) * 0.22;
          const dropout = noisy < -1.25 ? 0.08 : 1;
          fixture.light.intensity = 5.2 * dropout * (0.88 + noisy * 0.07);
          fixture.tubeMaterial.emissiveIntensity =
            3.2 * dropout * (0.9 + noisy * 0.05);
        }
      }

      for (const item of papers) {
        const flutter = Math.sin(time * item.speed * 4 + item.phase);
        const gust = Math.max(0, 1 - Math.abs(trainX + 19) / 15);
        item.mesh.position.y =
          0.405 + Math.max(0, flutter) * item.lift * (0.25 + gust);
        item.mesh.rotation.x =
          -Math.PI * 0.5 + flutter * 0.15 * (0.3 + gust);
        item.mesh.rotation.z += item.drift * 0.008 * (1 + gust * 8);
        item.mesh.position.x +=
          Math.sin(time * 1.2 + item.phase) * 0.0007 * (1 + gust * 9);

        if (item.mesh.position.x > 31) item.mesh.position.x = -31;
        if (item.mesh.position.x < -31) item.mesh.position.x = 31;
      }

      const positions = dustGeometry.attributes.position.array;
      for (let i = 0; i < dustCount; i++) {
        positions[i * 3] +=
          Math.sin(time * 0.35 + dustPhases[i]) * 0.0008;
        positions[i * 3 + 1] +=
          Math.sin(time * 0.52 + dustPhases[i] * 1.7) * 0.00045;
      }
      dustGeometry.attributes.position.needsUpdate = true;

      tunnelGlow.intensity = 3.4 + Math.sin(time * 1.7) * 0.2;
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    animate();
  </script>
</body>
</html>
