<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Mantis Figurine</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #071012; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x071012);
scene.fog = new THREE.FogExp2(0x071012, 0.026);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.2, 5.7, 11.5);
camera.lookAt(0, 3.2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.25, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 7;
controls.maxDistance = 19;
controls.maxPolarAngle = Math.PI * 0.78;

const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

const jadeGlass = new THREE.MeshPhysicalMaterial({
  color: 0xa9ffe0,
  metalness: 0,
  roughness: 0.08,
  transmission: 0.92,
  thickness: 0.75,
  ior: 1.47,
  transparent: true,
  opacity: 0.84,
  attenuationColor: new THREE.Color(0x72d9b5),
  attenuationDistance: 2.8,
  clearcoat: 1,
  clearcoatRoughness: 0.05,
  side: THREE.DoubleSide
});

const paleGlass = new THREE.MeshPhysicalMaterial({
  color: 0xd9fff1,
  metalness: 0,
  roughness: 0.035,
  transmission: 0.96,
  thickness: 0.38,
  ior: 1.5,
  transparent: true,
  opacity: 0.78,
  attenuationColor: new THREE.Color(0xa6f5d7),
  attenuationDistance: 4,
  clearcoat: 1,
  clearcoatRoughness: 0.02,
  side: THREE.DoubleSide
});

const darkJadeGlass = new THREE.MeshPhysicalMaterial({
  color: 0x4ac89a,
  metalness: 0.02,
  roughness: 0.1,
  transmission: 0.78,
  thickness: 0.65,
  ior: 1.48,
  transparent: true,
  opacity: 0.9,
  attenuationColor: new THREE.Color(0x148465),
  attenuationDistance: 1.8,
  clearcoat: 1
});

const eyeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x163d2d,
  metalness: 0.05,
  roughness: 0.04,
  transmission: 0.4,
  thickness: 0.5,
  ior: 1.55,
  clearcoat: 1,
  clearcoatRoughness: 0
});

const wingMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffddb0,
  emissive: 0x8b3d0b,
  emissiveIntensity: 0.12,
  metalness: 0,
  roughness: 0.12,
  transmission: 0.94,
  thickness: 0.08,
  ior: 1.38,
  transparent: true,
  opacity: 0.36,
  side: THREE.DoubleSide,
  depthWrite: false,
  clearcoat: 0.8
});

const amberMaterial = new THREE.MeshBasicMaterial({
  color: 0xffb353,
  transparent: true,
  opacity: 0.52,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const pedestalMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xe9ffff,
  metalness: 0,
  roughness: 0.035,
  transmission: 0.96,
  thickness: 1.2,
  ior: 1.52,
  transparent: true,
  opacity: 0.68,
  attenuationColor: new THREE.Color(0xb5ecdf),
  attenuationDistance: 5,
  clearcoat: 1,
  side: THREE.DoubleSide
});

const mantis = new THREE.Group();
scene.add(mantis);

function ellipsoid(name, position, scale, material, detail = 40) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(1, detail, Math.max(18, Math.floor(detail * 0.65))),
    material
  );
  mesh.name = name;
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mantis.add(mesh);
  return mesh;
}

function tube(name, points, radius, material, radialSegments = 9) {
  const curve = points.length === 3
    ? new THREE.QuadraticBezierCurve3(points[0], points[1], points[2])
    : new THREE.CatmullRomCurve3(points);
  const mesh = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 28, radius, radialSegments, false),
    material
  );
  mesh.name = name;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mantis.add(mesh);
  return mesh;
}

function segment(name, start, end, radius, material, radialSegments = 10) {
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius * 0.88, radius, length, radialSegments, 1, false),
    material
  );
  mesh.name = name;
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mantis.add(mesh);
  return mesh;
}

function joint(position, radius, material = jadeGlass) {
  return ellipsoid('Glass joint', position, new THREE.Vector3(radius, radius, radius), material, 24);
}

function spine(position, direction, length, radius = 0.018) {
  const end = position.clone().add(direction.clone().normalize().multiplyScalar(length));
  segment('Raptorial spine', position, end, radius, paleGlass, 6);
}

function mirroredPoint(point, side) {
  return new THREE.Vector3(point.x * side, point.y, point.z);
}

const abdomen = ellipsoid(
  'Air-bubbled abdomen',
  new THREE.Vector3(0, 3.45, -0.02),
  new THREE.Vector3(0.58, 1.43, 0.53),
  jadeGlass,
  56
);
abdomen.rotation.z = -0.055;

ellipsoid(
  'Abdomen tip',
  new THREE.Vector3(0.07, 2.27, -0.03),
  new THREE.Vector3(0.29, 0.48, 0.28),
  darkJadeGlass,
  36
).rotation.z = -0.1;

for (let i = 0; i < 7; i++) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.47 - i * 0.025, 0.018, 7, 48),
    paleGlass
  );
  ring.position.set(0.002 + i * 0.011, 2.72 + i * 0.24, 0);
  ring.rotation.x = Math.PI / 2;
  ring.rotation.z = -0.055;
  mantis.add(ring);
}

const bubbles = new THREE.Group();
bubbles.name = 'Suspended air bubbles';
mantis.add(bubbles);
let seed = 1837;
function random() {
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
}
const bubbleMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  roughness: 0,
  transmission: 1,
  thickness: 0.02,
  ior: 1.01,
  transparent: true,
  opacity: 0.38,
  side: THREE.BackSide,
  depthWrite: false
});
for (let i = 0; i < 23; i++) {
  const y = 2.45 + random() * 1.95;
  const normalized = (y - 3.45) / 1.45;
  const allowed = 0.42 * Math.sqrt(Math.max(0.12, 1 - normalized * normalized));
  const angle = random() * Math.PI * 2;
  const radial = Math.sqrt(random()) * allowed * 0.72;
  const radius = 0.018 + random() * 0.045;
  const bubble = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 12, 8),
    bubbleMaterial
  );
  bubble.position.set(
    Math.cos(angle) * radial + 0.035,
    y,
    Math.sin(angle) * radial
  );
  bubbles.add(bubble);
}

tube(
  'Arched thorax',
  [
    new THREE.Vector3(0, 4.25, 0),
    new THREE.Vector3(-0.08, 4.92, 0.04),
    new THREE.Vector3(0.05, 5.34, 0.14)
  ],
  0.24,
  jadeGlass,
  16
);
ellipsoid(
  'Thorax collar',
  new THREE.Vector3(0.02, 4.58, 0.03),
  new THREE.Vector3(0.32, 0.45, 0.29),
  darkJadeGlass,
  36
);

const neckStart = new THREE.Vector3(0.05, 5.15, 0.13);
const neckEnd = new THREE.Vector3(0.04, 5.47, 0.24);
segment('Neck', neckStart, neckEnd, 0.14, paleGlass, 12);

const head = ellipsoid(
  'Triangular mantis head',
  new THREE.Vector3(0.04, 5.69, 0.3),
  new THREE.Vector3(0.52, 0.34, 0.34),
  jadeGlass,
  42
);
head.rotation.x = -0.12;

for (const side of [-1, 1]) {
  const eye = ellipsoid(
    'Faceted eye',
    new THREE.Vector3(0.04 + side * 0.42, 5.76, 0.39),
    new THREE.Vector3(0.19, 0.25, 0.17),
    eyeMaterial,
    18
  );
  eye.rotation.z = side * 0.22;

  tube(
    'Antenna',
    [
      new THREE.Vector3(0.04 + side * 0.22, 5.93, 0.34),
      new THREE.Vector3(0.04 + side * 0.52, 6.42, 0.38),
      new THREE.Vector3(0.04 + side * 0.82, 6.78, 0.29),
      new THREE.Vector3(0.04 + side * 1.02, 7.04, 0.16)
    ],
    0.018,
    paleGlass,
    6
  );
}

ellipsoid(
  'Mouth crystal',
  new THREE.Vector3(0.04, 5.51, 0.57),
  new THREE.Vector3(0.15, 0.11, 0.11),
  darkJadeGlass,
  24
);

for (const side of [-1, 1]) {
  const hip = mirroredPoint(new THREE.Vector3(0.31, 4.94, 0.12), side);
  const elbow = mirroredPoint(new THREE.Vector3(0.98, 5.36, 0.33), side);
  const wrist = mirroredPoint(new THREE.Vector3(1.28, 4.68, 0.56), side);
  const claw = mirroredPoint(new THREE.Vector3(0.55, 4.73, 0.72), side);

  segment('Foreleg coxa', hip, elbow, 0.115, jadeGlass, 12);
  joint(elbow, 0.14, darkJadeGlass);
  segment('Raptorial femur', elbow, wrist, 0.105, jadeGlass, 12);
  joint(wrist, 0.115, paleGlass);
  segment('Folded raptorial tibia', wrist, claw, 0.072, paleGlass, 10);
  tube(
    'Foreclaw',
    [
      claw,
      mirroredPoint(new THREE.Vector3(0.4, 4.67, 0.77), side),
      mirroredPoint(new THREE.Vector3(0.3, 4.8, 0.71), side)
    ],
    0.034,
    darkJadeGlass,
    7
  );

  const femurDir = new THREE.Vector3().subVectors(wrist, elbow);
  const tibiaDir = new THREE.Vector3().subVectors(claw, wrist);
  for (let i = 1; i <= 6; i++) {
    const p = elbow.clone().lerp(wrist, i / 7);
    const outward = new THREE.Vector3(side * 0.55, 0.22, 0.55);
    spine(p, outward, 0.12 + i * 0.014);
  }
  for (let i = 1; i <= 6; i++) {
    const p = wrist.clone().lerp(claw, i / 7);
    const inward = new THREE.Vector3(-side * 0.5, 0.08, 0.58);
    spine(p, inward, 0.1 + (6 - i) * 0.012);
  }

  const midHip = mirroredPoint(new THREE.Vector3(0.28, 4.24, -0.04), side);
  const midKnee = mirroredPoint(new THREE.Vector3(1.18, 3.75, 0.03), side);
  const midAnkle = mirroredPoint(new THREE.Vector3(1.72, 2.68, 0.22), side);
  const midFoot = mirroredPoint(new THREE.Vector3(1.48, 1.72, 0.46), side);
  segment('Middle leg femur', midHip, midKnee, 0.075, jadeGlass, 9);
  joint(midKnee, 0.09);
  segment('Middle leg tibia', midKnee, midAnkle, 0.052, paleGlass, 8);
  segment('Middle leg tarsus', midAnkle, midFoot, 0.031, paleGlass, 7);
  tube(
    'Middle foot',
    [
      midFoot,
      mirroredPoint(new THREE.Vector3(1.42, 1.6, 0.6), side),
      mirroredPoint(new THREE.Vector3(1.24, 1.58, 0.67), side)
    ],
    0.025,
    paleGlass,
    6
  );

  const rearHip = mirroredPoint(new THREE.Vector3(0.28, 3.72, -0.13), side);
  const rearKnee = mirroredPoint(new THREE.Vector3(1.02, 3.27, -0.35), side);
  const rearAnkle = mirroredPoint(new THREE.Vector3(1.7, 2.3, -0.26), side);
  const rearFoot = mirroredPoint(new THREE.Vector3(1.22, 1.66, 0.02), side);
  segment('Rear leg femur', rearHip, rearKnee, 0.08, jadeGlass, 9);
  joint(rearKnee, 0.095);
  segment('Rear leg tibia', rearKnee, rearAnkle, 0.052, paleGlass, 8);
  segment('Rear leg tarsus', rearAnkle, rearFoot, 0.031, paleGlass, 7);
  tube(
    'Rear foot',
    [
      rearFoot,
      mirroredPoint(new THREE.Vector3(1.08, 1.58, 0.13), side),
      mirroredPoint(new THREE.Vector3(0.86, 1.58, 0.16), side)
    ],
    0.024,
    paleGlass,
    6
  );
}

function makeWing(side) {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(side * 0.34, -0.12, side * 0.82, -0.86, side * 0.76, -1.62);
  shape.bezierCurveTo(side * 0.7, -2.15, side * 0.34, -2.63, side * 0.1, -2.82);
  shape.bezierCurveTo(side * 0.02, -2.2, -side * 0.06, -1.1, 0, 0);
  const geometry = new THREE.ShapeGeometry(shape, 40);
  const wing = new THREE.Mesh(geometry, wingMaterial);
  wing.position.set(side * 0.04, 4.79, -0.38);
  wing.rotation.y = side * 0.2;
  wing.rotation.z = side * 0.08;
  wing.castShadow = true;
  mantis.add(wing);

  const edgePoints = [
    new THREE.Vector3(side * 0.04, 4.79, -0.36),
    new THREE.Vector3(side * 0.55, 4.18, -0.43),
    new THREE.Vector3(side * 0.68, 3.18, -0.38),
    new THREE.Vector3(side * 0.14, 2.04, -0.26)
  ];
  tube('Amber wing rim', edgePoints, 0.018, amberMaterial, 6);

  const veinStarts = [
    new THREE.Vector3(side * 0.03, 4.7, -0.345),
    new THREE.Vector3(side * 0.1, 4.58, -0.35),
    new THREE.Vector3(side * 0.11, 4.4, -0.35)
  ];
  const veinEnds = [
    new THREE.Vector3(side * 0.5, 3.84, -0.39),
    new THREE.Vector3(side * 0.55, 3.23, -0.37),
    new THREE.Vector3(side * 0.25, 2.47, -0.29)
  ];
  for (let i = 0; i < veinStarts.length; i++) {
    segment('Wing vein', veinStarts[i], veinEnds[i], 0.009, amberMaterial, 5);
  }
}
makeWing(-1);
makeWing(1);

const pedestal = new THREE.Group();
pedestal.name = 'Clear crystal pedestal';
scene.add(pedestal);

const base = new THREE.Mesh(
  new THREE.CylinderGeometry(2.05, 2.22, 0.34, 64, 2),
  pedestalMaterial
);
base.position.y = 0.31;
base.castShadow = true;
base.receiveShadow = true;
pedestal.add(base);

const bevel = new THREE.Mesh(
  new THREE.CylinderGeometry(1.67, 2.02, 0.22, 64, 1),
  pedestalMaterial
);
bevel.position.y = 0.59;
bevel.castShadow = true;
bevel.receiveShadow = true;
pedestal.add(bevel);

const plinth = new THREE.Mesh(
  new THREE.CylinderGeometry(1.6, 1.72, 0.88, 64, 2),
  pedestalMaterial
);
plinth.position.y = 1.01;
plinth.castShadow = true;
plinth.receiveShadow = true;
pedestal.add(plinth);

const topDisc = new THREE.Mesh(
  new THREE.CylinderGeometry(1.7, 1.6, 0.16, 64, 1),
  paleGlass
);
topDisc.position.y = 1.52;
topDisc.castShadow = true;
topDisc.receiveShadow = true;
pedestal.add(topDisc);

for (let i = 0; i < 12; i++) {
  const angle = (i / 12) * Math.PI * 2;
  const shardGeometry = new THREE.PlaneGeometry(0.07 + (i % 3) * 0.035, 0.85 + (i % 4) * 0.17);
  const shardMaterial = new THREE.MeshBasicMaterial({
    color: i % 2 ? 0x9dffe2 : 0xffd28a,
    transparent: true,
    opacity: 0.1 + (i % 3) * 0.035,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide
  });
  const shard = new THREE.Mesh(shardGeometry, shardMaterial);
  shard.position.set(Math.cos(angle) * 1.25, 0.034, Math.sin(angle) * 1.25);
  shard.rotation.x = -Math.PI / 2;
  shard.rotation.z = -angle + (i % 2 ? 0.24 : -0.22);
  pedestal.add(shard);
}

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x081315,
  roughness: 0.31,
  metalness: 0.16
});
const ground = new THREE.Mesh(new THREE.CircleGeometry(18, 96), groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.105;
ground.receiveShadow = true;
scene.add(ground);

const halo = new THREE.Mesh(
  new THREE.RingGeometry(2.25, 4.8, 96),
  new THREE.MeshBasicMaterial({
    color: 0x1c766c,
    transparent: true,
    opacity: 0.085,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    depthWrite: false
  })
);
halo.rotation.x = -Math.PI / 2;
halo.position.y = 0.12;
scene.add(halo);

scene.add(new THREE.HemisphereLight(0xbfffea, 0x101016, 1.45));

const key = new THREE.SpotLight(0xe8fff7, 190, 24, Math.PI / 5, 0.42, 1.2);
key.position.set(5.5, 9.5, 7);
key.target.position.set(0, 3.2, 0);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.bias = -0.0004;
scene.add(key, key.target);

const amberRim = new THREE.SpotLight(0xffa347, 145, 20, Math.PI / 5.5, 0.55, 1.3);
amberRim.position.set(-6, 6.2, -4);
amberRim.target.position.set(0, 3.5, 0);
scene.add(amberRim, amberRim.target);

const cyanRim = new THREE.PointLight(0x63ffe0, 58, 12, 1.6);
cyanRim.position.set(3.8, 2.3, -4.2);
scene.add(cyanRim);

const baseLight = new THREE.PointLight(0xd8fff4, 36, 7, 1.7);
baseLight.position.set(0, 1.05, 1.3);
scene.add(baseLight);

const warmBaseLight = new THREE.PointLight(0xffb461, 20, 5, 1.8);
warmBaseLight.position.set(-1.25, 0.55, -0.4);
scene.add(warmBaseLight);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
