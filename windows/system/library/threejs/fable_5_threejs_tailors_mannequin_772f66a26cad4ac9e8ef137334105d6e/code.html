<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tailor's Mannequin</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e8e4dd}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e4dd);
scene.fog = new THREE.Fog(0xe8e4dd, 8, 18);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 50);
camera.position.set(2.3, 1.6, 2.7);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

// --- Lights ---
scene.add(new THREE.HemisphereLight(0xfffaf0, 0x8a857c, 0.75));
const key = new THREE.DirectionalLight(0xfff2e0, 2.0);
key.position.set(3.5, 5.5, 2.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -3;
key.shadow.camera.right = key.shadow.camera.top = 3;
key.shadow.radius = 7;
key.shadow.blurSamples = 20;
key.shadow.bias = -0.0002;
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.5);
fill.position.set(-4, 2, -3);
scene.add(fill);

// --- Materials ---
const fabricMat = new THREE.MeshPhysicalMaterial({
  color: 0xb4a48e, roughness: 0.95, metalness: 0,
  sheen: 0.6, sheenRoughness: 0.75, sheenColor: new THREE.Color(0xe8dcc8)
});
const metalMat = new THREE.MeshStandardMaterial({ color: 0x3a3632, roughness: 0.45, metalness: 0.85 });
const woodMat  = new THREE.MeshStandardMaterial({ color: 0x5c4634, roughness: 0.6, metalness: 0.05 });

const mannequin = new THREE.Group();
scene.add(mannequin);

// --- Torso (lathe profile: hip -> waist -> bust -> shoulders -> neck) ---
const P = [
  [0.001,0.00],[0.14,0.015],[0.205,0.07],[0.24,0.17],[0.25,0.28],[0.238,0.38],
  [0.205,0.50],[0.168,0.615],[0.172,0.71],[0.20,0.83],[0.228,0.945],[0.218,1.04],
  [0.178,1.14],[0.132,1.235],[0.10,1.30],[0.066,1.365],[0.056,1.41],[0.052,1.44],
  [0.045,1.455],[0.02,1.465],[0.001,1.468]
].map(p => new THREE.Vector2(p[0], p[1]));
const torso = new THREE.Mesh(new THREE.LatheGeometry(P, 64), fabricMat);
torso.scale.z = 0.76;
torso.position.y = 0.78;
torso.castShadow = torso.receiveShadow = true;
mannequin.add(torso);

// --- Neck cap button ---
const cap = new THREE.Mesh(new THREE.SphereGeometry(0.052, 32, 16, 0, Math.PI*2, 0, Math.PI/2), woodMat);
cap.scale.set(1, 0.55, 0.8);
cap.position.y = 0.78 + 1.462;
cap.castShadow = true;
mannequin.add(cap);

// --- Pole ---
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.86, 24), metalMat);
pole.position.y = 0.43;
pole.castShadow = true;
mannequin.add(pole);

// collar where pole meets torso
const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.06, 0.06, 24), metalMat);
collar.position.y = 0.76;
collar.castShadow = true;
mannequin.add(collar);

// --- Weighted round base ---
const base = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.36, 0.06, 48), metalMat);
base.position.y = 0.03;
base.castShadow = base.receiveShadow = true;
mannequin.add(base);
const baseDome = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.30, 0.05, 48), metalMat);
baseDome.position.y = 0.085;
baseDome.castShadow = true;
mannequin.add(baseDome);

// --- Ground (soft shadow catcher) ---
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 64),
  new THREE.ShadowMaterial({ opacity: 0.28 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// --- Controls ---
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 1.6;
controls.maxDistance = 7;
controls.maxPolarAngle = Math.PI/2 - 0.02;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
