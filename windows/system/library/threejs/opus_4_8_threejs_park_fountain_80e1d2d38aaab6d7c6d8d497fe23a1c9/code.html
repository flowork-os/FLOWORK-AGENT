<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Park Fountain</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15171a; }
  #scene { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- Renderer ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* ---------- Scene & Camera ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171a);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(5.4, 3.4, 6.2);

/* ---------- Environment (procedural, for PBR reflections) ---------- */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------- Lighting: hemisphere + key + fill + rim ---------- */
const hemi = new THREE.HemisphereLight(0xbfd4ff, 0x3c352b, 0.45);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2df, 2.2);
key.position.set(6, 8.5, 4.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 40;
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -5;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);
scene.add(key.target);

const fill = new THREE.DirectionalLight(0x8ea6c6, 0.5);
fill.position.set(-6, 3.5, -2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xcfe0ff, 0.85);
rim.position.set(-4, 4.5, -6.5);
scene.add(rim);

/* ---------- Procedural weathered-stone textures ---------- */
function makeColorTexture() {
  const s = 1024;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d');
  x.fillStyle = '#b6ac9a'; x.fillRect(0, 0, s, s);
  // mottled grain
  for (let i = 0; i < 5200; i++) {
    const px = Math.random() * s, py = Math.random() * s;
    const r = Math.pow(Math.random(), 2) * 40 + 2;
    const base = 175 + (Math.random() * 60 - 30);
    x.fillStyle = `rgba(${base | 0},${(base * 0.93) | 0},${(base * 0.80) | 0},${Math.random() * 0.10})`;
    x.beginPath(); x.arc(px, py, r, 0, 6.283); x.fill();
  }
  // dark weathering / water-run streaks
  for (let i = 0; i < 140; i++) {
    const px = Math.random() * s, py = Math.random() * s;
    const w = Math.random() * 6 + 1, h = Math.random() * 420 + 90;
    const g = Math.random() * 35 + 40;
    x.fillStyle = `rgba(${g | 0},${(g * 1.02) | 0},${(g * 0.85) | 0},${Math.random() * 0.06})`;
    x.fillRect(px, py, w, h);
  }
  // greenish moss / lichen patches
  for (let i = 0; i < 460; i++) {
    const px = Math.random() * s, py = Math.random() * s;
    const r = Math.pow(Math.random(), 2) * 24 + 2;
    x.fillStyle = `rgba(${(68 + Math.random() * 42) | 0},${(82 + Math.random() * 42) | 0},${(50 + Math.random() * 30) | 0},${Math.random() * 0.05})`;
    x.beginPath(); x.arc(px, py, r, 0, 6.283); x.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.repeat.set(3, 2);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function makeRoughTexture() {
  const s = 1024;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d');
  x.fillStyle = '#b9b9b9'; x.fillRect(0, 0, s, s);
  for (let i = 0; i < 9000; i++) {
    const px = Math.random() * s, py = Math.random() * s;
    const r = Math.pow(Math.random(), 2) * 30 + 1;
    const v = Math.random() * 160 + 60;
    x.fillStyle = `rgba(${v | 0},${v | 0},${v | 0},${Math.random() * 0.10})`;
    x.beginPath(); x.arc(px, py, r, 0, 6.283); x.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3, 2);
  return t;
}

const stoneColor = makeColorTexture();
const stoneRough = makeRoughTexture();

const stoneMat = new THREE.MeshStandardMaterial({
  map: stoneColor,
  roughnessMap: stoneRough,
  bumpMap: stoneRough,
  bumpScale: 0.012,
  color: 0xf2ede2,
  roughness: 0.96,
  metalness: 0.0,
  envMapIntensity: 0.55,
  side: THREE.DoubleSide
});

/* ---------- Fountain group (single centered object) ---------- */
const fountain = new THREE.Group();
scene.add(fountain);

function latheMesh(points, seg = 96) {
  const pts = points.map(p => new THREE.Vector2(p[0], p[1]));
  const geo = new THREE.LatheGeometry(pts, seg);
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, stoneMat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

/* Ground apron (small stone disc under the fountain) */
const apron = new THREE.Mesh(
  new THREE.CylinderGeometry(2.62, 2.74, 0.14, 72),
  stoneMat
);
apron.position.y = -0.07;
apron.castShadow = true;
apron.receiveShadow = true;
fountain.add(apron);

/* Lower tiered basin: outer wall -> coping rim -> inner bowl (visible thickness) */
const lowerBasin = latheMesh([
  [0.00, 0.00],
  [1.95, 0.00],   // flat underside / base edge
  [2.03, 0.10],   // base flare
  [2.06, 0.32],
  [2.05, 0.56],
  [2.03, 0.70],   // up to rim
  [2.09, 0.76],   // coping outer lip
  [2.11, 0.80],   // coping outer top
  [1.86, 0.80],   // coping flat top (inner edge) -> visible rim thickness
  [1.82, 0.73],   // inner top edge
  [1.80, 0.58],   // inner wall
  [1.78, 0.34],
  [1.72, 0.17],   // inner floor rise
  [1.45, 0.13],   // inner floor
  [0.34, 0.12]
]);
fountain.add(lowerBasin);

/* Central pedestal (baluster) rising from basin floor */
const pedestal = latheMesh([
  [0.00, 0.12],
  [0.50, 0.12],   // plinth
  [0.50, 0.22],
  [0.41, 0.30],
  [0.28, 0.42],
  [0.20, 0.56],   // waist
  [0.18, 0.82],
  [0.21, 1.04],
  [0.28, 1.16],
  [0.42, 1.26],   // flare to support
  [0.51, 1.31],
  [0.51, 1.37],
  [0.00, 1.37]
]);
fountain.add(pedestal);

/* Smaller upper bowl on the pedestal */
const upperBowl = latheMesh([
  [0.00, 1.34],
  [0.56, 1.34],   // underside meets pedestal top
  [0.82, 1.41],   // flare out
  [0.99, 1.53],
  [1.06, 1.66],
  [1.11, 1.74],   // coping outer lip
  [1.13, 1.78],   // coping outer top
  [0.96, 1.78],   // coping flat top (inner edge)
  [0.92, 1.71],   // inner top edge
  [0.87, 1.60],
  [0.80, 1.50],
  [0.66, 1.46],   // inner floor
  [0.30, 1.45]
]);
fountain.add(upperBowl);

/* Central finial / spout at the top */
const finial = latheMesh([
  [0.00, 1.45],
  [0.11, 1.47],
  [0.10, 1.56],
  [0.055, 1.63],
  [0.10, 1.71],
  [0.13, 1.80],
  [0.065, 1.88],
  [0.00, 1.94]
], 48);
fountain.add(finial);

/* ---------- Water surfaces ---------- */
function makeWater(radius, y) {
  const geo = new THREE.CircleGeometry(radius, 120);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0x2b4c58,
    roughness: 0.08,
    metalness: 0.0,
    transparent: true,
    opacity: 0.86,
    clearcoat: 1.0,
    clearcoatRoughness: 0.12,
    envMapIntensity: 1.1,
    side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.y = y;
  mesh.receiveShadow = true;
  mesh.userData.base = geo.attributes.position.array.slice();
  return mesh;
}

const lowerWater = makeWater(1.70, 0.53);
const upperWater = makeWater(0.80, 1.60);
fountain.add(lowerWater);
fountain.add(upperWater);

function rippleWater(mesh, t, amp) {
  const g = mesh.geometry, p = g.attributes.position, base = mesh.userData.base;
  for (let i = 0; i < p.count; i++) {
    const x = base[i * 3], z = base[i * 3 + 2];
    const d = Math.sqrt(x * x + z * z);
    p.array[i * 3 + 1] = Math.sin(d * 7.0 - t * 2.0) * amp
                       + Math.sin((x + z) * 4.0 + t * 1.3) * amp * 0.65;
  }
  p.needsUpdate = true;
  g.computeVertexNormals();
}

/* ---------- Shadow-catching ground plane ---------- */
const shadowGround = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.32 })
);
shadowGround.rotation.x = -Math.PI / 2;
shadowGround.position.y = 0.0;
shadowGround.receiveShadow = true;
scene.add(shadowGround);

/* ---------- Controls ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 4.5;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.49;
controls.target.set(0, 0.85, 0);
controls.update();

/* ---------- Resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

/* ---------- Animate ---------- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  rippleWater(lowerWater, t, 0.006);
  rippleWater(upperWater, t, 0.004);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
