<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marble Bust</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#d8d5cf}canvas{display:block}</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8d5cf);
scene.fog = new THREE.Fog(0xd8d5cf, 9, 26);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
camera.position.set(2.6, 2.1, 4.4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// Lights
scene.add(new THREE.HemisphereLight(0xfff5e8, 0x44464e, 0.45));
const key = new THREE.DirectionalLight(0xfff1de, 2.4);
key.position.set(3.5, 6, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -2.5;
key.shadow.camera.right = key.shadow.camera.top = 2.5;
key.shadow.camera.near = 0.5; key.shadow.camera.far = 15;
key.shadow.bias = -0.0004;
scene.add(key);
const rim = new THREE.DirectionalLight(0xbdccff, 0.6);
rim.position.set(-4, 3, -3);
scene.add(rim);

// Ground
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(16, 48),
  new THREE.MeshStandardMaterial({ color: 0xcac7c0, roughness: 0.95 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Materials
const marble = new THREE.MeshPhysicalMaterial({ color: 0xf5f2ea, roughness: 0.34, metalness: 0, clearcoat: 0.2, clearcoatRoughness: 0.6, envMapIntensity: 0.55 });
const chipMat = new THREE.MeshStandardMaterial({ color: 0xd9d2c3, roughness: 0.95, flatShading: true, envMapIntensity: 0.3 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x1c1a18, roughness: 1 });
const plaqueMat = new THREE.MeshStandardMaterial({ color: 0xb4aea1, roughness: 0.6, envMapIntensity: 0.4 });

const SG = new THREE.SphereGeometry(1, 32, 24);
const curlGeo = new THREE.SphereGeometry(1, 10, 8);
const bust = new THREE.Group();
scene.add(bust);

const hash = n => Math.abs(Math.sin(n) * 43758.5453) % 1;
function blob(mat, x, y, z, sx, sy, sz, rx=0, ry=0, rz=0, parent=bust, geo=SG) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.rotation.set(rx, ry, rz);
  m.castShadow = true;
  parent.add(m);
  return m;
}
function box(mat, w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  bust.add(m);
  return m;
}

// Square plinth + socle
box(marble, 1.15, 0.60, 1.15, 0, 0.30, 0);
box(marble, 1.30, 0.09, 1.30, 0, 0.645, 0);
box(plaqueMat, 0.52, 0.15, 0.02, 0, 0.30, 0.585);
const socle = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.40, 0.30, 40), marble);
socle.position.y = 0.84; socle.castShadow = true;
bust.add(socle);

// Chest / shoulders (truncated classical torso)
blob(marble, 0, 1.05, 0, 0.55, 0.28, 0.42);
blob(marble, 0, 1.30, 0, 0.72, 0.40, 0.40);
blob(marble, 0, 1.20, 0.06, 0.50, 0.45, 0.34);
blob(marble, -0.55, 1.42, 0, 0.24, 0.20, 0.28);
blob(marble, 0.55, 1.42, 0, 0.24, 0.20, 0.28);

// Neck
const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.20, 0.55, 24), marble);
neck.position.set(0, 1.65, 0.02); neck.castShadow = true;
bust.add(neck);

// Head group (slightly turned)
const headG = new THREE.Group();
headG.position.set(0, 2.05, 0.02);
headG.rotation.y = 0.18;
bust.add(headG);

blob(marble, 0, 0, 0, 0.41, 0.525, 0.46, 0, 0, 0, headG);                 // cranium
blob(marble, 0, -0.27, 0.08, 0.225, 0.18, 0.24, 0, 0, 0, headG);          // jaw
blob(marble, 0, -0.40, 0.31, 0.12, 0.10, 0.11, 0, 0, 0, headG);           // chin
blob(marble, -0.20, -0.10, 0.28, 0.12, 0.10, 0.14, 0, 0, 0, headG);       // cheeks
blob(marble, 0.20, -0.10, 0.28, 0.12, 0.10, 0.14, 0, 0, 0, headG);
blob(marble, -0.40, -0.03, -0.02, 0.05, 0.11, 0.07, 0, 0, 0.15, headG);   // ears
blob(marble, 0.40, -0.03, -0.02, 0.05, 0.11, 0.07, 0, 0, -0.15, headG);
blob(marble, 0, 0.14, 0.30, 0.27, 0.05, 0.14, 0, 0, 0, headG);            // brow ridge

// Eyes with drilled hollow pupils
for (const s of [-1, 1]) {
  blob(marble, s*0.16, 0.07, 0.36, 0.085, 0.085, 0.085, 0, 0, 0, headG);
  blob(darkMat, s*0.16, 0.065, 0.435, 0.034, 0.034, 0.03, 0, 0, 0, headG); // drilled pupil
  const iris = new THREE.Mesh(new THREE.TorusGeometry(0.048, 0.009, 8, 24), chipMat);
  iris.position.set(s*0.16, 0.065, 0.438); iris.castShadow = true;
  headG.add(iris);
}

// Nose bridge + chipped/broken tip
const nose = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.10, 0.32, 6), marble);
nose.position.set(0, -0.01, 0.445); nose.rotation.x = -0.3; nose.castShadow = true;
headG.add(nose);
const chip = new THREE.Mesh(new THREE.IcosahedronGeometry(0.085, 0), chipMat);
chip.position.set(0.015, -0.16, 0.50); chip.scale.set(1, 0.8, 0.9); chip.rotation.set(0.4, 0.8, 0.2);
chip.castShadow = true;
headG.add(chip);

// Lips
blob(marble, 0, -0.26, 0.415, 0.15, 0.042, 0.055, 0, 0, 0, headG);
blob(marble, 0, -0.315, 0.405, 0.11, 0.048, 0.055, 0, 0, 0, headG);

// Stylized curled hair (golden-spiral cap, face carved out)
const N = 170;
for (let i = 0; i < N; i++) {
  const t = (i + 0.5) / N, y = 1 - 2*t, r = Math.sqrt(Math.max(0, 1 - y*y)), a = i * 2.399963;
  const dx = Math.cos(a)*r, dz = Math.sin(a)*r;
  if (y < -0.12) continue;
  if (dz > 0.30 && y < 0.52) continue;
  const h1 = hash(i*127.1 + 13), h2 = hash(i*311.7 + 7), s = 0.07 + 0.05*h1;
  blob(marble, dx*0.43, y*0.55, dz*0.48, s, s*0.8, s, h1*3, h2*3, h1*2, headG, curlGeo);
}
// nape + sideburn curls
[[-0.15,-0.30,-0.34],[0,-0.30,-0.39],[0.15,-0.30,-0.34],[-0.38,-0.12,0.08],[0.38,-0.12,0.08]]
  .forEach((p,i)=>blob(marble, p[0], p[1], p[2], 0.085, 0.07, 0.085, i, i*2, i, headG, curlGeo));

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.45, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 2;
controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI * 0.52;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
