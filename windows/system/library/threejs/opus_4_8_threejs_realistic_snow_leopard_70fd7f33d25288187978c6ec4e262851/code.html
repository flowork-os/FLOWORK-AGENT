<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Snow Leopard Prowling</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14161a; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: rgba(235,240,248,0.42); letter-spacing: 0.04em; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="hint">Snow Leopard &mdash; drag to orbit &middot; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   Renderer / Scene / Camera
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
scene.fog = new THREE.Fog(0x14161a, 9, 26);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 200);
camera.position.set(3.1, 1.35, 3.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 1.8;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 0.62, 0);

/* ============================================================
   Lighting: hemisphere + key + fill + rim
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xb9cbe4, 0x2b2a28, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e0, 2.5);
key.position.set(3.4, 5.0, 3.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 20;
key.shadow.camera.left = -3.2;
key.shadow.camera.right = 3.2;
key.shadow.camera.top = 3.2;
key.shadow.camera.bottom = -3.2;
key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fb6d4, 0.62);
fill.position.set(-4.0, 2.0, 2.4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xdce9ff, 1.5);
rim.position.set(-2.2, 3.0, -4.4);
scene.add(rim);

const bounce = new THREE.PointLight(0x6f7d92, 0.32, 12, 2.0);
bounce.position.set(0, -0.4, 1.6);
scene.add(bounce);

/* ============================================================
   Shadow-only ground
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   Procedural fur texture: smoke-grey with black rosettes,
   fading to cream on the belly (via vertical gradient in V).
   ============================================================ */
function makeNoise(seed) {
  let s = seed >>> 0;
  return function () {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5;  s >>>= 0;
    return s / 4294967296;
  };
}

function drawRosette(ctx, x, y, r, rand, solid) {
  // Snow leopard rosette: a broken dark ring around a slightly darker grey core.
  if (solid) {
    ctx.fillStyle = 'rgba(24,22,22,0.92)';
    ctx.beginPath();
    ctx.ellipse(x, y, r * 0.55, r * 0.48, rand() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
    return;
  }
  // core
  ctx.fillStyle = 'rgba(96,92,90,0.55)';
  ctx.beginPath();
  ctx.ellipse(x, y, r * 0.72, r * 0.62, rand() * Math.PI, 0, Math.PI * 2);
  ctx.fill();

  // broken ring made of 5-8 arcs / blobs
  const n = 5 + Math.floor(rand() * 4);
  const rot = rand() * Math.PI * 2;
  for (let i = 0; i < n; i++) {
    const a = rot + (i / n) * Math.PI * 2 + (rand() - 0.5) * 0.35;
    const rr = r * (0.88 + (rand() - 0.5) * 0.22);
    const px = x + Math.cos(a) * rr;
    const py = y + Math.sin(a) * rr * 0.86;
    const w = r * (0.30 + rand() * 0.20);
    const h = r * (0.20 + rand() * 0.14);
    ctx.fillStyle = 'rgba(20,18,18,' + (0.62 + rand() * 0.3).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(px, py, w, h, a + Math.PI / 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function makeFurCanvas() {
  const W = 1024, H = 512;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  // Base vertical gradient: V=0 (top of texture) -> back/spine smoke grey,
  // V=1 -> belly cream. We map geometry so v ~ 0 is dorsal.
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, '#8d9199');
  g.addColorStop(0.24, '#9aa0a8');
  g.addColorStop(0.48, '#adb2b7');
  g.addColorStop(0.68, '#cfc9bd');
  g.addColorStop(0.84, '#eae3d5');
  g.addColorStop(1.00, '#f6f0e4');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const rand = makeNoise(20260720);

  // Fine fur speckle / grain across the whole hide
  for (let i = 0; i < 26000; i++) {
    const x = rand() * W;
    const y = rand() * H;
    const v = y / H;
    const light = rand() > 0.5;
    const a = 0.05 + rand() * 0.10;
    const shade = light ? 255 : (v > 0.62 ? 150 : 60);
    ctx.fillStyle = 'rgba(' + shade + ',' + shade + ',' + (shade + (light ? 0 : 4)) + ',' + a.toFixed(3) + ')';
    const len = 2 + rand() * 7;
    ctx.fillRect(x, y, 1.1, len);
  }

  // Rosettes: dense on the dorsal half, thinning toward the belly.
  for (let i = 0; i < 620; i++) {
    const x = rand() * W;
    const yv = Math.pow(rand(), 0.72); // bias toward the back
    const y = yv * H * 0.80;
    const v = y / H;
    // fade out entirely near the belly
    if (v > 0.60 && rand() > (1.0 - (v - 0.60) / 0.30)) continue;
    const r = (10 + rand() * 20) * (1.0 - v * 0.35);
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, 1.0 - Math.max(0, (v - 0.45)) * 2.1));
    drawRosette(ctx, x, y, r, rand, v < 0.16 && rand() > 0.45);
    ctx.restore();
  }

  // Small solid spots scattered near the spine and flanks
  for (let i = 0; i < 420; i++) {
    const x = rand() * W;
    const y = Math.pow(rand(), 0.9) * H * 0.55;
    const v = y / H;
    const r = 2.2 + rand() * 5.0;
    ctx.globalAlpha = Math.max(0, 1.0 - v * 1.7);
    ctx.fillStyle = 'rgba(22,20,20,0.85)';
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * 0.82, rand() * 3.14, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Soft blur-ish pass: overlay translucent grain to knit spots into fur
  for (let i = 0; i < 14000; i++) {
    const x = rand() * W;
    const y = rand() * H;
    const v = y / H;
    const base = v > 0.66 ? 240 : 168;
    ctx.fillStyle = 'rgba(' + base + ',' + base + ',' + (base - 6) + ',' + (0.030 + rand() * 0.055).toFixed(3) + ')';
    ctx.fillRect(x, y, 1.6 + rand() * 2.2, 1.0 + rand() * 3.0);
  }

  return c;
}

function canvasToBumpCanvas(src) {
  const W = src.width, H = src.height;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.drawImage(src, 0, 0);
  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const l = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114);
    // invert-ish so dark markings read as slightly deeper fur clumps
    const v = Math.max(0, Math.min(255, 128 + (l - 150) * 0.55));
    d[i] = d[i + 1] = d[i + 2] = v;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}

const furCanvas = makeFurCanvas();
const furTex = new THREE.CanvasTexture(furCanvas);
furTex.colorSpace = THREE.SRGBColorSpace;
furTex.wrapS = THREE.RepeatWrapping;
furTex.wrapT = THREE.ClampToEdgeWrapping;
furTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

const bumpTex = new THREE.CanvasTexture(canvasToBumpCanvas(furCanvas));
bumpTex.wrapS = THREE.RepeatWrapping;
bumpTex.wrapT = THREE.ClampToEdgeWrapping;

/* Tail texture: cream-grey with heavy black rings toward the tip */
function makeTailCanvas() {
  const W = 1024, H = 256;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0.0, '#9aa0a8');
  g.addColorStop(0.35, '#b9bcc0');
  g.addColorStop(0.72, '#d8d4cb');
  g.addColorStop(1.0, '#a9a49c');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  const rand = makeNoise(918273);
  // rosettes near base, becoming rings near tip
  for (let i = 0; i < 240; i++) {
    const u = rand();
    const x = u * W * 0.62;
    const y = rand() * H;
    drawRosette(ctx, x, y, 9 + rand() * 13, rand, false);
  }
  // dark broad rings on the distal half
  const ringCount = 6;
  for (let i = 0; i < ringCount; i++) {
    const t = 0.60 + (i / ringCount) * 0.40;
    const x = t * W;
    const w = 18 + i * 3;
    ctx.fillStyle = 'rgba(26,23,22,' + (0.42 + i * 0.085).toFixed(3) + ')';
    ctx.fillRect(x - w / 2, 0, w, H);
  }
  // black tip
  ctx.fillStyle = 'rgba(20,18,18,0.94)';
  ctx.fillRect(W * 0.955, 0, W * 0.045, H);

  // grain
  for (let i = 0; i < 16000; i++) {
    const x = rand() * W, y = rand() * H;
    const light = rand() > 0.45;
    const s = light ? 255 : 70;
    ctx.fillStyle = 'rgba(' + s + ',' + s + ',' + s + ',' + (0.04 + rand() * 0.09).toFixed(3) + ')';
    ctx.fillRect(x, y, 1.2, 2 + rand() * 6);
  }
  return c;
}

const tailCanvas = makeTailCanvas();
const tailTex = new THREE.CanvasTexture(tailCanvas);
tailTex.colorSpace = THREE.SRGBColorSpace;
tailTex.wrapS = THREE.ClampToEdgeWrapping;
tailTex.wrapT = THREE.RepeatWrapping;
tailTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const tailBump = new THREE.CanvasTexture(canvasToBumpCanvas(tailCanvas));
tailBump.wrapS = THREE.ClampToEdgeWrapping;
tailBump.wrapT = THREE.RepeatWrapping;

/* Head texture: pale, small spots on brow/cheeks */
function makeHeadCanvas() {
  const W = 512, H = 512;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, '#9ba0a7');
  g.addColorStop(0.42, '#c3c2be');
  g.addColorStop(0.70, '#e6e0d3');
  g.addColorStop(1.00, '#f7f1e5');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  const rand = makeNoise(4477);
  for (let i = 0; i < 380; i++) {
    const x = rand() * W;
    const y = Math.pow(rand(), 0.8) * H * 0.66;
    const v = y / H;
    const r = 2.0 + rand() * 5.5;
    ctx.globalAlpha = Math.max(0, 1 - v * 1.35);
    ctx.fillStyle = 'rgba(28,25,24,0.8)';
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * 0.8, rand() * 3.1, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (let i = 0; i < 12000; i++) {
    const x = rand() * W, y = rand() * H;
    const v = y / H;
    const light = rand() > 0.5;
    const s = light ? 250 : (v > 0.66 ? 170 : 80);
    ctx.fillStyle = 'rgba(' + s + ',' + s + ',' + s + ',' + (0.04 + rand() * 0.08).toFixed(3) + ')';
    ctx.fillRect(x, y, 1.1, 1.5 + rand() * 4);
  }
  return c;
}
const headCanvas = makeHeadCanvas();
const headTex = new THREE.CanvasTexture(headCanvas);
headTex.colorSpace = THREE.SRGBColorSpace;
headTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
const headBump = new THREE.CanvasTexture(canvasToBumpCanvas(headCanvas));

/* ============================================================
   Materials
   ============================================================ */
const furMat = new THREE.MeshStandardMaterial({
  map: furTex,
  bumpMap: bumpTex,
  bumpScale: 0.012,
  roughness: 0.92,
  metalness: 0.0
});

const tailMat = new THREE.MeshStandardMaterial({
  map: tailTex,
  bumpMap: tailBump,
  bumpScale: 0.014,
  roughness: 0.95,
  metalness: 0.0
});

const headMat = new THREE.MeshStandardMaterial({
  map: headTex,
  bumpMap: headBump,
  bumpScale: 0.010,
  roughness: 0.9,
  metalness: 0.0
});

const creamMat = new THREE.MeshStandardMaterial({ color: 0xf2ecdf, roughness: 0.95, metalness: 0.0 });
const greyMat  = new THREE.MeshStandardMaterial({ color: 0xa9adb2, roughness: 0.93, metalness: 0.0 });
const darkMat  = new THREE.MeshStandardMaterial({ color: 0x22201f, roughness: 0.75, metalness: 0.0 });
const noseMat  = new THREE.MeshStandardMaterial({ color: 0xdb9d9f, roughness: 0.45, metalness: 0.0 });
const clawMat  = new THREE.MeshStandardMaterial({ color: 0x2a2724, roughness: 0.5,  metalness: 0.05 });

const eyeMat = new THREE.MeshStandardMaterial({
  color: 0xbcd7b6, roughness: 0.16, metalness: 0.0,
  emissive: 0x4c6b52, emissiveIntensity: 0.32
});
const pupilMat = new THREE.MeshStandardMaterial({ color: 0x0d0f0d, roughness: 0.2, metalness: 0.0 });
const corneaMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, roughness: 0.03, metalness: 0.0,
  transmission: 0.0, transparent: true, opacity: 0.30,
  clearcoat: 1.0, clearcoatRoughness: 0.02
});
const whiskerMat = new THREE.MeshStandardMaterial({
  color: 0xfaf7ef, roughness: 0.4, metalness: 0.0,
  emissive: 0x2b2f36, emissiveIntensity: 0.35
});
const guardHairMat = new THREE.LineBasicMaterial({
  color: 0xe8eef7, transparent: true, opacity: 0.55
});

/* ============================================================
   Helpers
   ============================================================ */
const leopard = new THREE.Group();
scene.add(leopard);

function markShadows(obj) {
  obj.traverse(function (o) {
    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
  });
}

// Catmull-Rom-ish smooth curve from control points
function curveFrom(points, closed, tension) {
  const pts = points.map(function (p) { return new THREE.Vector3(p[0], p[1], p[2]); });
  const c = new THREE.CatmullRomCurve3(pts, !!closed, 'catmullrom', tension === undefined ? 0.5 : tension);
  return c;
}

/**
 * Build a swept tube along a curve with a per-t radius profile and optional
 * elliptical cross-section (widthScale/heightScale per t).
 */
function sweptBody(curve, segments, radialSegs, radiusFn, widthFn, heightFn, uvMode) {
  const positions = [];
  const normals = [];
  const uvs = [];
  const indices = [];

  const frames = curve.computeFrenetFrames(segments, false);
  const P = new THREE.Vector3();
  const N = new THREE.Vector3();
  const B = new THREE.Vector3();
  const vtx = new THREE.Vector3();

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    curve.getPointAt(t, P);
    N.copy(frames.normals[i]);
    B.copy(frames.binormals[i]);
    const r = Math.max(0.0006, radiusFn(t));
    const wS = widthFn ? widthFn(t) : 1.0;
    const hS = heightFn ? heightFn(t) : 1.0;

    for (let j = 0; j <= radialSegs; j++) {
      const a = (j / radialSegs) * Math.PI * 2;
      const cx = Math.cos(a) * r * wS;
      const cy = Math.sin(a) * r * hS;
      vtx.copy(P).addScaledVector(N, cx).addScaledVector(B, cy);
      positions.push(vtx.x, vtx.y, vtx.z);

      // approximate normal
      const nx = N.x * (cx / (wS * wS)) + B.x * (cy / (hS * hS));
      const ny = N.y * (cx / (wS * wS)) + B.y * (cy / (hS * hS));
      const nz = N.z * (cx / (wS * wS)) + B.z * (cy / (hS * hS));
      const nl = Math.hypot(nx, ny, nz) || 1;
      normals.push(nx / nl, ny / nl, nz / nl);

      // UV: u along length, v around circumference remapped so that the
      // "top" (dorsal, angle ~ +90deg in binormal) is v=0 and belly is v=1.
      const ang = j / radialSegs; // 0..1
      let v;
      if (uvMode === 'radial') {
        v = ang;
      } else {
        // fold: dorsal (a = PI/2) -> 0 ; ventral (a = -PI/2) -> 1
        const aa = (a - Math.PI / 2 + Math.PI * 4) % (Math.PI * 2);
        v = aa <= Math.PI ? aa / Math.PI : (Math.PI * 2 - aa) / Math.PI;
      }
      uvs.push(t, v);
    }
  }

  for (let i = 0; i < segments; i++) {
    for (let j = 0; j < radialSegs; j++) {
      const a = i * (radialSegs + 1) + j;
      const b = a + radialSegs + 1;
      indices.push(a, b, a + 1);
      indices.push(b, b + 1, a + 1);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

/* ============================================================
   BODY
   Coordinate convention: +X forward (head), -X back (tail),
   +Y up, +Z to the leopard's LEFT side.
   Prowl: shoulders high & hunched, head low, back slightly arched.
   ============================================================ */

const BODY_LEN = 1.12; // nose->rump base scale used implicitly by curve

// Spine curve: from base of neck junction at rump to shoulders.
// Points: rump(-0.60) ... loin ... shoulder hump(+0.36) ... neck base(+0.55)
const spineCurve = curveFrom([
  [-0.66, 0.665, 0.0],
  [-0.46, 0.700, 0.0],
  [-0.22, 0.706, 0.0],
  [ 0.02, 0.700, 0.0],
  [ 0.24, 0.716, 0.0],
  [ 0.40, 0.746, 0.0],   // raised shoulder blades
  [ 0.52, 0.742, 0.0],
  [ 0.60, 0.716, 0.0]
], false, 0.5);

function torsoRadius(t) {
  // t: 0 = rump, 1 = neck base
  // Chest (t~0.72) deepest; waist (t~0.30) narrower; rump (t~0.06) broad.
  const rump   = 0.150 * Math.exp(-Math.pow((t - 0.07) / 0.20, 2));
  const loin   = 0.128 * Math.exp(-Math.pow((t - 0.34) / 0.26, 2));
  const belly  = 0.138 * Math.exp(-Math.pow((t - 0.55) / 0.24, 2));
  const chest  = 0.163 * Math.exp(-Math.pow((t - 0.76) / 0.20, 2));
  const shoul  = 0.120 * Math.exp(-Math.pow((t - 0.92) / 0.16, 2));
  let r = Math.max(rump, Math.max(loin, Math.max(belly, Math.max(chest, shoul))));
  // blend for smoothness
  r = r * 0.72 + (rump + loin + belly + chest + shoul) * 0.18;
  // taper the very ends
  r *= 0.90 + 0.10 * Math.sin(Math.PI * Math.min(1, Math.max(0, t)));
  const endFade = Math.min(1, t / 0.05) * Math.min(1, (1 - t) / 0.05);
  r *= 0.55 + 0.45 * Math.pow(endFade, 0.5);
  return r;
}

function torsoWidth(t) {
  // barrel is wider than tall in the ribcage; rump broad too
  return 1.02 + 0.16 * Math.exp(-Math.pow((t - 0.72) / 0.24, 2)) + 0.10 * Math.exp(-Math.pow((t - 0.10) / 0.18, 2));
}
function torsoHeight(t) {
  // deep chest -> taller cross section forward, plus shoulder hump
  return 1.10 + 0.30 * Math.exp(-Math.pow((t - 0.78) / 0.22, 2)) + 0.10 * Math.exp(-Math.pow((t - 0.30) / 0.30, 2));
}

const torsoGeo = sweptBody(spineCurve, 190, 44, torsoRadius, torsoWidth, torsoHeight);
const torso = new THREE.Mesh(torsoGeo, furMat);
leopard.add(torso);

// Slight fur "loft" shell over the torso for the thick-coat silhouette
const coatGeo = sweptBody(spineCurve, 150, 40, function (t) {
  return torsoRadius(t) * 1.045 + 0.007;
}, torsoWidth, torsoHeight);
const coat = new THREE.Mesh(coatGeo, new THREE.MeshStandardMaterial({
  map: furTex, roughness: 1.0, metalness: 0.0,
  transparent: true, opacity: 0.42, depthWrite: false, side: THREE.DoubleSide
}));
coat.renderOrder = 2;
leopard.add(coat);

/* ---- Shoulder blades (visibly raised in the prowl) ---- */
function makeScapula(side) {
  const g = new THREE.SphereGeometry(0.088, 24, 18);
  g.scale(1.35, 1.0, 0.62);
  const m = new THREE.Mesh(g, furMat);
  m.position.set(0.375, 0.760, side * 0.108);
  m.rotation.z = -0.16;
  m.rotation.x = side * 0.10;
  return m;
}
leopard.add(makeScapula(1));
leopard.add(makeScapula(-1));

/* ---- Haunches ---- */

// Whiskers — long and white
function addWhiskers() {
  const grp = new THREE.Group();
  const rows = 4;
  const perRow = 5;
  for (let s = -1; s <= 1; s += 2) {
    for (let r = 0; r < rows; r++) {
      for (let i = 0; i < perRow; i++) {
        const rowT = r / (rows - 1);
        const iT = i / (perRow - 1);
        const originY = -0.024 - rowT * 0.030;
        const originZ = s * (0.026 + rowT * 0.008);
        const origin = new THREE.Vector3(0.152, originY, originZ);

        const spread = (iT - 0.5) * 1.05;
        const len = 0.20 + (1 - Math.abs(spread)) * 0.10 - rowT * 0.03;

        const dirY = 0.10 - rowT * 0.34 + spread * 0.30;
        const dirZ = s * (0.55 + Math.abs(spread) * 0.55);
        const dirX = 0.92 - Math.abs(spread) * 0.20;

        const dir = new THREE.Vector3(dirX, dirY, dirZ).normalize();
        const droop = -0.055 - rowT * 0.03;

        const p0 = origin.clone();
        const p1 = origin.clone().addScaledVector(dir, len * 0.35);
        p1.y += droop * 0.25;
        const p2 = origin.clone().addScaledVector(dir, len * 0.70);
        p2.y += droop * 0.72;
        const p3 = origin.clone().addScaledVector(dir, len);
        p3.y += droop;

        const curve = new THREE.CatmullRomCurve3([p0, p1, p2, p3]);
        const geo = new THREE.TubeGeometry(curve, 14, 0.00075, 5, false);
        const m = new THREE.Mesh(geo, whiskerMat);
        grp.add(m);
      }
    }
  }
  // brow whiskers
  for (let s = -1; s <= 1; s += 2) {
    for (let i = 0; i < 3; i++) {
      const origin = new THREE.Vector3(0.070, 0.062 + i * 0.006, s * (0.040 + i * 0.010));
      const dir = new THREE.Vector3(0.72, 0.42 + i * 0.05, s * 0.52).normalize();
      const len = 0.13 + i * 0.012;
      const p0 = origin.clone();
      const p1 = origin.clone().addScaledVector(dir, len * 0.5);
      const p2 = origin.clone().addScaledVector(dir, len);
      p2.y += 0.012;
      const curve = new THREE.CatmullRomCurve3([p0, p1, p2]);
      const geo = new THREE.TubeGeometry(curve, 10, 0.0007, 5, false);
      grp.add(new THREE.Mesh(geo, whiskerMat));
    }
  }
  return grp;
}
head.add(addWhiskers());

function makeLeg(cfg) {
  const grp = new THREE.Group();

  const curve = curveFrom(cfg.points, false, 0.5);
  const geo = sweptBody(curve, 80, 24, function (t) {
    return cfg.radius(t);
  }, function () { return 1.0; }, function (t) { return cfg.height ? cfg.height(t) : 1.0; });
  const mat = cfg.material || furMat;
  const legMesh = new THREE.Mesh(geo, mat);
  grp.add(legMesh);

  // Paw
  const pawGeo = new THREE.SphereGeometry(cfg.pawR, 22, 16);
  pawGeo.scale(1.30, 0.72, 1.12);
  const paw = new THREE.Mesh(pawGeo, creamMat);
  const pawPos = cfg.points[cfg.points.length - 1];
  paw.position.set(pawPos[0] + cfg.pawOffset[0], pawPos[1] + cfg.pawOffset[1], pawPos[2] + cfg.pawOffset[2]);
  paw.rotation.y = cfg.pawYaw || 0;
  paw.rotation.z = cfg.pawPitch || 0;
  grp.add(paw);

  // Toes
  const toeCount = 4;
  for (let i = 0; i < toeCount; i++) {
    const tT = (i / (toeCount - 1) - 0.5);
    const tg = new THREE.SphereGeometry(cfg.pawR * 0.40, 14, 11);
    tg.scale(1.25, 0.80, 1.0);
    const toe = new THREE.Mesh(tg, creamMat);
    const fwd = cfg.pawR * 1.16 * Math.cos(cfg.pawYaw || 0);
    const sideward = cfg.pawR * 1.16 * Math.sin(cfg.pawYaw || 0);
    toe.position.set(
      paw.position.x + fwd - Math.abs(tT) * cfg.pawR * 0.24 + tT * sideward * 0.0,
      paw.position.y - cfg.pawR * 0.06,
      paw.position.z + tT * cfg.pawR * 0.86 + sideward * 0.0
    );
    grp.add(toe);

    // subtle claw hint
    const cg = new THREE.ConeGeometry(cfg.pawR * 0.10, cfg.pawR * 0.30, 8);
    cg.rotateZ(-Math.PI / 2);
    const claw = new THREE.Mesh(cg, clawMat);
    claw.position.set(
      toe.position.x + cfg.pawR * 0.42,
      toe.position.y - cfg.pawR * 0.10,
      toe.position.z
    );
    grp.add(claw);
  }

  return grp;
}

const legRadiusFront = function (t) {
  // t=0 shoulder, t=1 wrist
  const upper = 0.082 * Math.exp(-Math.pow((t - 0.02) / 0.30, 2));
  const elbow = 0.058 * Math.exp(-Math.pow((t - 0.42) / 0.24, 2));
  const wrist = 0.040 * Math.exp(-Math.pow((t - 0.92) / 0.30, 2));
  return Math.max(0.030, Math.max(upper, Math.max(elbow, wrist)));
};
const legRadiusHind = function (t) {
  const thigh = 0.100 * Math.exp(-Math.pow((t - 0.02) / 0.28, 2));
  const stifle = 0.070 * Math.exp(-Math.pow((t - 0.36) / 0.22, 2));
  const hock = 0.048 * Math.exp(-Math.pow((t - 0.66) / 0.20, 2));
  const cannon = 0.040 * Math.exp(-Math.pow((t - 0.95) / 0.26, 2));
  return Math.max(0.032, Math.max(thigh, Math.max(stifle, Math.max(hock, cannon))));
};

const tailCurve = curveFrom([

  [-1.242, 1.040, 0.062],

  [-0.902, 1.244, -0.026],
  [-0.780, 1.226, -0.048]
], false, 0.5);

function tailRadius(t) {
  // very thick through most of the length; slight taper, plump tip
  const base = 0.098;
  const mid  = 0.092;
  const tip  = 0.070;
  let r;
  if (t < 0.10) {
    const k = t / 0.10;
    r = 0.112 * (1 - k) + base * k;
  } else if (t < 0.62) {
    const k = (t - 0.10) / 0.52;
    r = base * (1 - k) + mid * k;
  } else {
    const k = (t - 0.62) / 0.38;
    r = mid * (1 - k) + tip * k;
  }
  // gentle fur "puff" waves along the tail
  r *= 1.0 + 0.035 * Math.sin(t * 26.0);
  // round off the very tip
  r *= 1.0 - 0.42 * Math.pow(Math.max(0, (t - 0.955) / 0.045), 1.6);
  return r;
}

/* ============================================================
   Guard hairs — fine light lines along the spine, shoulders,
   haunches and tail that catch the rim light.
   ============================================================ */
function buildGuardHairs() {
  const positions = [];
  const rand = makeNoise(777123);

  function emitAlong(curve, count, radiusFn, lengthFn, spreadAngle, ellipseW, ellipseH) {
    const frames = curve.computeFrenetFrames(Math.max(24, count), false);
    const N = new THREE.Vector3(), B = new THREE.Vector3(), P = new THREE.Vector3();
    for (let i = 0; i < count; i++) {
      const t = i / (count - 1 || 1);
      const fi = Math.min(frames.normals.length - 1, Math.round(t * (frames.normals.length - 1)));
      curve.getPointAt(Math.min(0.999, Math.max(0.001, t)), P);
      N.copy(frames.normals[fi]);
      B.copy(frames.binormals[fi]);

      const clump = 3;
      for (let k = 0; k < clump; k++) {
        const a = Math.PI / 2 + (rand() - 0.5) * spreadAngle;
        const r = radiusFn(t);
        const wS = ellipseW ? ellipseW(t) : 1.0;
        const hS = ellipseH ? ellipseH(t) : 1.0;
        const cx = Math.cos(a) * r * wS;
        const cy = Math.sin(a) * r * hS;

        const base = new THREE.Vector3().copy(P).addScaledVector(N, cx).addScaledVector(B, cy);
        const outward = new THREE.Vector3().addScaledVector(N, cx).addScaledVector(B, cy).normalize();

        const len = lengthFn(t) * (0.55 + rand() * 0.85);
        const tipv = base.clone().addScaledVector(outward, len);
        // hairs lean slightly backward (-X) and jitter
        tipv.x -= len * (0.22 + rand() * 0.28);
        tipv.z += (rand() - 0.5) * len * 0.35;
        tipv.y += len * 0.12;

        positions.push(base.x, base.y, base.z, tipv.x, tipv.y, tipv.z);
      }
    }
  }

  emitAlong(spineCurve, 130, function (t) { return torsoRadius(t) * 1.02; },
    function (t) { return 0.026 + 0.020 * Math.exp(-Math.pow((t - 0.85) / 0.20, 2)); },
    1.5, torsoWidth, torsoHeight);

  emitAlong(neckCurve, 40, function (t) { return (0.128 - 0.030 * t) * 1.05; },
    function () { return 0.028; }, 2.0, function () { return 1.02; }, function (t) { return 1.16 - 0.10 * t; });

  emitAlong(tailCurve, 150, function (t) { return tailRadius(t) * 1.02; },
    function () { return 0.030; }, 5.6, null, null);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  return new THREE.LineSegments(geo, guardHairMat);
}
const guardHairs = buildGuardHairs();
leopard.add(guardHairs);

/* Extra soft fringe of guard hairs on the tail (radial, all around) */
function buildTailFringe() {
  const positions = [];
  const rand = makeNoise(31337);
  const frames = tailCurve.computeFrenetFrames(200, false);
  const P = new THREE.Vector3(), N = new THREE.Vector3(), B = new THREE.Vector3();
  for (let i = 0; i <= 200; i++) {
    const t = i / 200;
    curveSample(t, P);
    N.copy(frames.normals[i]);
    B.copy(frames.binormals[i]);
    const r = tailRadius(t);
    const per = 4;
    for (let k = 0; k < per; k++) {
      const a = rand() * Math.PI * 2;
      const cx = Math.cos(a) * r;
      const cy = Math.sin(a) * r;
      const base = new THREE.Vector3().copy(P).addScaledVector(N, cx).addScaledVector(B, cy);
      const outward = new THREE.Vector3().addScaledVector(N, cx).addScaledVector(B, cy).normalize();
      const len = 0.018 + rand() * 0.026;
      const tipv = base.clone().addScaledVector(outward, len);
      tipv.y -= len * 0.25;
      positions.push(base.x, base.y, base.z, tipv.x, tipv.y, tipv.z);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  return new THREE.LineSegments(geo, new THREE.LineBasicMaterial({
    color: 0xdfe6f0, transparent: true, opacity: 0.34
  }));
}
function curveSample(t, target) {
  tailCurve.getPointAt(Math.min(0.9995, Math.max(0.0005, t)), target);
}
leopard.add(buildTailFringe());

rim.target.position.set(0, size.y * 0.45, 0);
scene.add(rim.target);
fill.target.position.set(0, size.y * 0.45, 0);
scene.add(fill.target);

/* ============================================================
   Resize + render loop
   ============================================================ */
window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
