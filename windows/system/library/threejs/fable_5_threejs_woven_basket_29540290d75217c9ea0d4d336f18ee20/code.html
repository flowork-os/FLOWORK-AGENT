<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Woven Basket</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a241c; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a241c);
scene.fog = new THREE.Fog(0x2a241c, 10, 22);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.4, 2.6, 4.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 2.5;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.52;

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xfff2dc, 0x40352a, 0.55));

const key = new THREE.DirectionalLight(0xffe8c8, 2.2);
key.position.set(4, 6, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4; key.shadow.camera.right = 4;
key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0005;
key.shadow.radius = 6;
scene.add(key);

const fill = new THREE.DirectionalLight(0xa8c4e0, 0.5);
fill.position.set(-5, 3, -3);
scene.add(fill);

const rim = new THREE.PointLight(0xffd9a0, 6, 12);
rim.position.set(-2, 3.5, 2.5);
scene.add(rim);

// ---------- Ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(12, 48),
  new THREE.MeshStandardMaterial({ color: 0x3a3126, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Soft radial contact shadow
const shTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 20, 128, 128, 128);
  grad.addColorStop(0, 'rgba(0,0,0,0.5)');
  grad.addColorStop(0.6, 'rgba(0,0,0,0.22)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const softShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(4.4, 4.4),
  new THREE.MeshBasicMaterial({ map: shTex, transparent: true, depthWrite: false })
);
softShadow.rotation.x = -Math.PI / 2;
softShadow.position.y = 0.005;
scene.add(softShadow);

// ---------- Materials (natural wicker tones) ----------
function wickerMat(hex, rough = 0.72) {
  return new THREE.MeshStandardMaterial({ color: hex, roughness: rough, metalness: 0.02 });
}
const matWeaveA = wickerMat(0xb8843f); // warm honey
const matWeaveB = wickerMat(0xa06f33); // deeper tan
const matStake  = wickerMat(0x8a5a28, 0.8); // darker vertical stakes
const matRim    = wickerMat(0x96632c, 0.75);
const matHandle = wickerMat(0x8f5e2a, 0.78);
const matInner  = wickerMat(0x9c7440, 0.85);

// ---------- Basket parameters ----------
const basket = new THREE.Group();
scene.add(basket);

const NSTAKES = 22;            // vertical stakes (odd/even alternation via rows)
const ROWS = 13;               // horizontal weaver rows
const H0 = 0.16;               // first row height
const ROWSTEP = 0.135;
const WEAVER_R = 0.062;        // weaver strand radius
const STAKE_R = 0.05;

// Basket profile: radius as function of height (rounded belly, open top)
function profileR(y) {
  const t = y / 1.95;
  return 0.92 + 0.62 * Math.sin(Math.PI * Math.min(t, 1) * 0.82);
}

// ---------- Base (woven bottom, gives wall thickness a floor) ----------
const base = new THREE.Mesh(
  new THREE.CylinderGeometry(0.98, 0.92, 0.14, 48),
  matInner
);
base.position.y = 0.09;
base.castShadow = base.receiveShadow = true;
basket.add(base);

// Spiral groove detail on base top
for (let i = 0; i < 4; i++) {
  const r = 0.2 + i * 0.22;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.035, 8, 48), i % 2 ? matWeaveA : matWeaveB);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = 0.165;
  ring.castShadow = true;
  basket.add(ring);
}

// ---------- Vertical stakes ----------
for (let i = 0; i < NSTAKES; i++) {
  const a = (i / NSTAKES) * Math.PI * 2;
  const pts = [];
  for (let s = 0; s <= 16; s++) {
    const y = 0.1 + (s / 16) * 1.95;
    const r = profileR(y - 0.1) + 0.01;
    pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const stake = new THREE.Mesh(new THREE.TubeGeometry(curve, 24, STAKE_R, 8), matStake);
  stake.castShadow = stake.receiveShadow = true;
  basket.add(stake);
}

// ---------- Horizontal weavers with over-under pattern ----------
// Each row is a closed tube whose radius modulates in/out around each stake,
// phase-shifted per row to produce the over-under weave.
const SEGS = NSTAKES * 12;
for (let row = 0; row < ROWS; row++) {
  const y0 = H0 + row * ROWSTEP;
  const baseR = profileR(y0);
  const phase = (row % 2) * Math.PI; // alternate over/under each row
  const pts = [];
  for (let s = 0; s < SEGS; s++) {
    const a = (s / SEGS) * Math.PI * 2;
    // over-under: sinusoid with NSTAKES periods around circumference
    const weave = Math.sin(a * NSTAKES + phase) * (STAKE_R + WEAVER_R * 0.55);
    // subtle organic irregularity
    const wob = 0.012 * Math.sin(a * 3 + row * 1.7) + 0.008 * Math.sin(a * 7 + row);
    const r = baseR + weave + wob;
    const y = y0 + 0.01 * Math.sin(a * 5 + row * 2.1);
    pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
  }
  const curve = new THREE.CatmullRomCurve3(pts, true);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, SEGS, WEAVER_R, 8, true), row % 2 ? matWeaveB : matWeaveA);
  tube.castShadow = tube.receiveShadow = true;
  basket.add(tube);
}

// Inner wall shell — gives the wall visible thickness when looking inside
const innerPts = [];
for (let s = 0; s <= 20; s++) {
  const y = 0.15 + (s / 20) * 1.85;
  innerPts.push(new THREE.Vector2(profileR(y - 0.1) - WEAVER_R - STAKE_R - 0.015, y));
}
const innerWall = new THREE.Mesh(new THREE.LatheGeometry(innerPts, 48), matInner);
innerWall.material = matInner.clone();
innerWall.material.side = THREE.DoubleSide;
innerWall.receiveShadow = true;
basket.add(innerWall);

// ---------- Rolled rim (slightly irregular twisted torus) ----------
const rimY = H0 + (ROWS - 1) * ROWSTEP + 0.12;
const rimBaseR = profileR(rimY - 0.05);
(function makeRim() {
  const pts = [];
  const N = 220;
  for (let s = 0; s < N; s++) {
    const a = (s / N) * Math.PI * 2;
    const irr = 0.03 * Math.sin(a * 4 + 0.7) + 0.02 * Math.sin(a * 9 + 2.1); // irregular
    const r = rimBaseR + irr;
    const y = rimY + 0.028 * Math.sin(a * 6) + 0.015 * Math.sin(a * 3 + 1);
    pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
  }
  const curve = new THREE.CatmullRomCurve3(pts, true);
  const rimTube = new THREE.Mesh(new THREE.TubeGeometry(curve, N, 0.105, 10, true), matRim);
  rimTube.castShadow = rimTube.receiveShadow = true;
  basket.add(rimTube);
  // Twisted wrap strands around the rim for a rolled/lashed look
  for (let k = 0; k < 2; k++) {
    const wrapPts = [];
    for (let s = 0; s <= N * 2; s++) {
      const a = (s / (N * 2)) * Math.PI * 2;
      const twist = a * 30 + k * Math.PI;
      const irr = 0.03 * Math.sin(a * 4 + 0.7) + 0.02 * Math.sin(a * 9 + 2.1);
      const rr = rimBaseR + irr + Math.cos(twist) * 0.105;
      const y = rimY + 0.028 * Math.sin(a * 6) + 0.015 * Math.sin(a * 3 + 1) + Math.sin(twist) * 0.105;
      wrapPts.push(new THREE.Vector3(Math.cos(a) * rr, y, Math.sin(a) * rr));
    }
    const wc = new THREE.CatmullRomCurve3(wrapPts, true);
    const wrap = new THREE.Mesh(new THREE.TubeGeometry(wc, N * 2, 0.026, 6, true), k ? matWeaveA : matWeaveB);
    wrap.castShadow = true;
    basket.add(wrap);
  }
})();

// ---------- Woven handle (arched, twisted strands) ----------
(function makeHandle() {
  const span = rimBaseR * 0.96;
  const top = rimY + 1.15;
  const arc = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-span, rimY - 0.25, 0),
    new THREE.Vector3(-span * 1.01, rimY + 0.35, 0),
    new THREE.Vector3(-span * 0.62, top * 0.94, 0),
    new THREE.Vector3(0, top, 0),
    new THREE.Vector3(span * 0.62, top * 0.94, 0),
    new THREE.Vector3(span * 1.01, rimY + 0.35, 0),
    new THREE.Vector3(span, rimY - 0.25, 0)
  ]);
  // Core
  const core = new THREE.Mesh(new THREE.TubeGeometry(arc, 80, 0.075, 10), matHandle);
  core.castShadow = true;
  basket.add(core);
  // Twisted wrapping strands
  const N = 240;
  for (let k = 0; k < 3; k++) {
    const pts = [];
    for (let s = 0; s <= N; s++) {
      const t = s / N;
      const p = arc.getPoint(t);
      const tan = arc.getTangent(t).normalize();
      const upv = new THREE.Vector3(0, 1, 0);
      let n = new THREE.Vector3().crossVectors(tan, upv).normalize();
      if (n.lengthSq() < 0.01) n = new THREE.Vector3(0, 0, 1);
      const b = new THREE.Vector3().crossVectors(tan, n).normalize();
      const ang = t * Math.PI * 22 + (k * Math.PI * 2) / 3;
      const off = n.multiplyScalar(Math.cos(ang) * 0.075).add(b.multiplyScalar(Math.sin(ang) * 0.075));
      pts.push(p.clone().add(off));
    }
    const strand = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), N, 0.028, 6),
      [matWeaveA, matWeaveB, matStake][k]
    );
    strand.castShadow = true;
    basket.add(strand);
  }
  // Handle attachment lashings at the rim
  for (const sx of [-1, 1]) {
    const lash = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.045, 8, 24), matStake);
    lash.position.set(sx * span, rimY + 0.02, 0);
    lash.rotation.y = Math.PI / 2;
    lash.rotation.x = 0.25 * sx;
    lash.castShadow = true;
    basket.add(lash);
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), matRim);
    knob.position.set(sx * (span + 0.02), rimY - 0.18, 0);
    knob.castShadow = true;
    basket.add(knob);
  }
})();

basket.rotation.y = 0.4;

// ---------- Animate ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
