<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Crocheted Sea Otter — Amigurumi</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #16171a; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    font: 12px/1.4 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: rgba(255,255,255,0.42); letter-spacing: 0.08em; text-transform: uppercase;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="hint">drag to orbit &nbsp;·&nbsp; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   Renderer / Scene / Camera
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x191a1d);
scene.fog = new THREE.Fog(0x191a1d, 3.2, 9.0);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(0.95, 0.72, 1.55);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.target.set(0, 0.10, 0);
controls.minDistance = 0.75;
controls.maxDistance = 5.0;
controls.maxPolarAngle = Math.PI * 0.52;
controls.update();

/* ============================================================
   Lighting: hemisphere ambience + key / fill / rim
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xbfd4e6, 0x2a2622, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e0, 2.5);
key.position.set(1.5, 2.25, 1.35);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 8;
key.shadow.camera.left = -1.2;
key.shadow.camera.right = 1.2;
key.shadow.camera.top = 1.2;
key.shadow.camera.bottom = -1.2;
key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.012;
key.shadow.radius = 3;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fc4e8, 0.62);
fill.position.set(-1.9, 0.85, 1.1);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd7b0, 1.15);
rim.position.set(-0.9, 1.35, -2.0);
scene.add(rim);

const bounce = new THREE.PointLight(0xffe3c8, 0.30, 4.0, 2.0);
bounce.position.set(0.15, -0.28, 0.55);
scene.add(bounce);

/* ============================================================
   Shadow-catching ground
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.245;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   Yarn palette
   ============================================================ */
const COL = {
  cocoa:      new THREE.Color(0x5c3c28),
  cocoaDark:  new THREE.Color(0x452c1c),
  cream:      new THREE.Color(0xe8d7bc),
  creamWarm:  new THREE.Color(0xdcc39f),
  peach:      new THREE.Color(0xf0bfa4),
  nose:       new THREE.Color(0x3b2419),
  eye:        new THREE.Color(0x120c08),
  whisker:    new THREE.Color(0xf2e6d4)
};

/* Fuzzy-ish yarn material: rough, slightly waxy fibre look. */
function yarnMat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color: color,
    roughness: opts.roughness !== undefined ? opts.roughness : 0.95,
    metalness: 0.0,
    flatShading: !!opts.flat
  });
}

const MAT = {
  cocoa:     yarnMat(COL.cocoa,     { roughness: 0.96 }),
  cocoaDark: yarnMat(COL.cocoaDark, { roughness: 0.97 }),
  cream:     yarnMat(COL.cream,     { roughness: 0.93 }),
  creamWarm: yarnMat(COL.creamWarm, { roughness: 0.94 }),
  peach:     yarnMat(COL.peach,     { roughness: 0.90 }),
  nose:      new THREE.MeshStandardMaterial({ color: COL.nose, roughness: 0.42, metalness: 0.05 }),
  eye:       new THREE.MeshPhysicalMaterial({
    color: COL.eye, roughness: 0.06, metalness: 0.0,
    clearcoat: 1.0, clearcoatRoughness: 0.03
  }),
  whisker:   new THREE.MeshStandardMaterial({ color: COL.whisker, roughness: 0.7 })
};

/* ============================================================
   Deterministic pseudo-random (wobbly handmade charm, but stable)
   ============================================================ */
let _seed = 20260721;
function rnd() {
  _seed = (_seed * 1664525 + 1013904223) % 4294967296;
  return _seed / 4294967296;
}
function rr(a, b) { return a + (b - a) * rnd(); }

/* ============================================================
   Shared stitch geometry
   A single-crochet stitch is modelled as a small squashed torus
   (the raised loop) — instanced many thousands of times along
   procedural spirals.
   ============================================================ */
const STITCH_GEO = new THREE.TorusGeometry(1.0, 0.46, 7, 12);
STITCH_GEO.scale(1.0, 0.78, 0.62); // squash the loop so it reads as a flattened yarn stitch

const BAR_GEO = new THREE.CapsuleGeometry(0.5, 1.0, 4, 10); // yarn strand segment

/* ============================================================
   Amigurumi surface builder
   ----------------------------------------------------------
   Given an implicit-ish parametric surface function
     f(u, v) -> {p: Vec3, n: Vec3}
   lay out stitches along a continuous spiral in v (rounds) and
   u (stitches per round), like real crochet worked in a spiral.
   ============================================================ */

function buildAmigurumi(opts) {
  const {
    surface,          // (u, v) => THREE.Vector3   (u in [0,1) around, v in [0,1] pole-to-pole)
    rounds,           // number of rounds
    stitchesAt,       // (v) => stitch count for that round
    stitchScale,      // (v) => scale of each stitch
    material,
    matPicker,        // optional (u, v) => material  (for colour blocking)
    materials,        // optional array of materials matching matPicker indices
    wobble = 0.0,     // positional jitter
    castShadow = true,
    receiveShadow = true,
    tilt = 0.0        // spiral offset per round (crochet spirals drift)
  } = opts;

  // Bucket transforms per material index
  const buckets = new Map();
  const dummy = new THREE.Object3D();
  const eps = 0.0015;

  const pA = new THREE.Vector3(), pB = new THREE.Vector3(), pC = new THREE.Vector3();
  const tU = new THREE.Vector3(), tV = new THREE.Vector3(), nrm = new THREE.Vector3();
  const m3 = new THREE.Matrix4();

  for (let r = 0; r < rounds; r++) {
    const v = rounds === 1 ? 0.5 : r / (rounds - 1);
    const n = Math.max(3, Math.round(stitchesAt(v)));
    const spiralOffset = (r * tilt) / n;

    for (let s = 0; s < n; s++) {
      const u = (s / n + spiralOffset) % 1;

      surface(u, v, pA);
      surface((u + eps) % 1, v, pB);
      surface(u, Math.min(1, Math.max(0, v + eps)), pC);

      tU.subVectors(pB, pA);
      tV.subVectors(pC, pA);
      if (tU.lengthSq() < 1e-12 || tV.lengthSq() < 1e-12) continue;
      nrm.crossVectors(tU, tV);
      if (nrm.lengthSq() < 1e-14) continue;
      nrm.normalize();
      tU.normalize();
      // Re-orthogonalise
      tV.crossVectors(nrm, tU).normalize();

      // Ensure outward-facing normals (surfaces are convex-ish about their local center)
      // handled per-surface via consistent parameterisation.

      const sc = stitchScale(v, u);
      if (!(sc > 0)) continue;

      const wob = wobble;
      const jx = (rnd() - 0.5) * wob;
      const jy = (rnd() - 0.5) * wob;
      const jz = (rnd() - 0.5) * wob;

      // Build orientation: torus lies in its local XY plane, axis = local Z.
      // We want the loop plane tangent-ish to the surface, axis along the normal.
      m3.makeBasis(tU, tV, nrm);
      dummy.quaternion.setFromRotationMatrix(m3);
      // small random roll for handmade irregularity
      dummy.rotateZ((rnd() - 0.5) * 0.55);
      dummy.rotateX((rnd() - 0.5) * 0.30);

      dummy.position.copy(pA).addScaledVector(nrm, sc * 0.30);
      dummy.position.x += jx; dummy.position.y += jy; dummy.position.z += jz;

      const sJit = 1 + (rnd() - 0.5) * 0.24;
      dummy.scale.set(sc * sJit * 1.18, sc * sJit, sc * sJit * 0.95);
      dummy.updateMatrix();

      let mi = 0;
      if (matPicker) mi = matPicker(u, v, pA) | 0;
      if (!buckets.has(mi)) buckets.set(mi, []);
      buckets.get(mi).push(dummy.matrix.clone());
    }
  }

  const group = new THREE.Group();
  buckets.forEach((list, mi) => {
    const mat = materials ? (materials[mi] || materials[0]) : material;
    const inst = new THREE.InstancedMesh(STITCH_GEO, mat, list.length);
    inst.castShadow = castShadow;
    inst.receiveShadow = receiveShadow;
    for (let i = 0; i < list.length; i++) inst.setMatrixAt(i, list[i]);
    inst.instanceMatrix.needsUpdate = true;
    group.add(inst);
  });
  return group;
}

/* A smooth inner "stuffing" shell so no background shows between stitches. */
function stuffing(geometry, material) {
  const m = new THREE.Mesh(geometry, material);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

/* ============================================================
   THE OTTER
   ----------------------------------------------------------
   Orientation: otter floats on its BACK.
     +X = toward head (nose)
     -X = toward tail
     +Y = up (belly / face up)
   Everything is assembled into `otter`, centered at origin.
   ============================================================ */
const otter = new THREE.Group();
scene.add(otter);

/* ---------- helpers for ellipsoidal surfaces ---------- */
function ellipsoidSurface(cx, cy, cz, rx, ry, rz, deform) {
  return function (u, v, out) {
    const theta = v * Math.PI;              // 0..PI  (pole to pole along local Y)
    const phi = u * Math.PI * 2.0;
    const st = Math.sin(theta), ct = Math.cos(theta);
    let x = st * Math.cos(phi);
    let y = ct;
    let z = st * Math.sin(phi);
    let px = cx + x * rx;
    let py = cy + y * ry;
    let pz = cz + z * rz;
    if (deform) deform(px, py, pz, u, v, out);
    else out.set(px, py, pz);
    return out;
  };
}

/* =========================================================
   1. BODY — chunky ellipsoid lying along X, belly up
   ========================================================= */
const BODY = { cx: -0.03, cy: 0.0, cz: 0.0, rx: 0.335, ry: 0.225, rz: 0.215 };

const bodyGroup = new THREE.Group();
otter.add(bodyGroup);

// The body surface is an ellipsoid whose local "pole axis" runs along X
// (nose-to-tail), so rounds spiral around the barrel like real amigurumi.
function bodySurface(u, v, out) {
  const theta = v * Math.PI;
  const phi = u * Math.PI * 2.0;
  const st = Math.sin(theta), ct = Math.cos(theta);

  // local axis = X
  let ax = ct;                 // -1 (tail) .. +1 (head)
  let ay = st * Math.cos(phi);
  let az = st * Math.sin(phi);

  // taper toward the tail, plump toward the chest
  const taper = 1.0 - 0.30 * Math.pow(Math.max(0, -ax), 1.6);
  // belly bulge (upward, +Y) — the rounded floating tummy
  const bellyBulge = 1.0 + 0.20 * Math.max(0, ay) * (1.0 - Math.abs(ax) * 0.55);
  // slight back flattening (the otter rests on its back)
  const backFlat = 1.0 - 0.12 * Math.max(0, -ay);

  const rx = BODY.rx;
  const ry = BODY.ry * taper * bellyBulge * backFlat;
  const rz = BODY.rz * taper * (1.0 + 0.05 * Math.max(0, ay));

  out.set(
    BODY.cx + ax * rx,
    BODY.cy + ay * ry + 0.012 * Math.sin(ax * 3.0),
    BODY.cz + az * rz
  );
  return out;
}

// Colour blocking: cream belly patch on the up-facing (+Y) chest/tummy
function bodyMatPick(u, v, p) {
  const yLocal = (p.y - BODY.cy);
  const xLocal = (p.x - BODY.cx);
  // cream oval on the tummy
  const t = yLocal / (BODY.ry * 1.15);
  const along = xLocal / BODY.rx;
  const patch = t > 0.42 - 0.10 * Math.cos(along * 1.7) && along > -0.62 && along < 0.86;
  if (patch) return 1;
  // subtle darker dorsal
  if (t < -0.55) return 2;
  return 0;
}

const bodyStitches = buildAmigurumi({
  surface: bodySurface,
  rounds: 42,
  stitchesAt: (v) => {
    const theta = v * Math.PI;
    return 8 + 46 * Math.sin(theta);
  },
  stitchScale: () => 0.0245,
  matPicker: bodyMatPick,
  materials: [MAT.cocoa, MAT.creamWarm, MAT.cocoaDark],
  wobble: 0.0035,
  tilt: 1.0
});
bodyGroup.add(bodyStitches);

// Inner stuffing shell (slightly smaller, hides gaps)
{
  const g = new THREE.SphereGeometry(1, 48, 32);
  const pos = g.attributes.position;
  const v3 = new THREE.Vector3();
  const tmp = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v3.fromBufferAttribute(pos, i);
    // map sphere point -> our body surface params
    const ax = v3.y;                      // use sphere's y as the axis param
    const len = Math.sqrt(v3.x * v3.x + v3.z * v3.z);
    const phi = Math.atan2(v3.z, v3.x);
    const theta = Math.acos(THREE.MathUtils.clamp(ax, -1, 1));
    const u = ((phi / (Math.PI * 2)) + 1) % 1;
    const vv = theta / Math.PI;
    bodySurface(u, vv, tmp);
    // shrink toward body center a touch
    tmp.sub(new THREE.Vector3(BODY.cx, BODY.cy, BODY.cz)).multiplyScalar(0.955)
       .add(new THREE.Vector3(BODY.cx, BODY.cy, BODY.cz));
    pos.setXYZ(i, tmp.x, tmp.y, tmp.z);
    void len;
  }
  g.computeVertexNormals();
  const shell = stuffing(g, MAT.cocoa);
  bodyGroup.add(shell);
}

/* =========================================================
   2. HEAD — slightly lopsided, tilted up out of the water
   ========================================================= */
const headGroup = new THREE.Group();
headGroup.position.set(0.315, 0.135, 0.0);
headGroup.rotation.set(0.10, 0.0, -0.30);   // lopsided handmade tilt
headGroup.rotation.z += -0.05;
otter.add(headGroup);

const HEAD_R = 0.165;

function headSurface(u, v, out) {
  const theta = v * Math.PI;
  const phi = u * Math.PI * 2.0;
  const st = Math.sin(theta), ct = Math.cos(theta);

  // local pole axis = Y (top of head to chin)
  let ay = ct;
  let ax = st * Math.cos(phi);
  let az = st * Math.sin(phi);

  // lopsided: one cheek fuller than the other
  const lop = 1.0 + 0.085 * Math.max(0, az) - 0.035 * Math.max(0, -az);
  // squash slightly front-to-back, widen cheeks
  const rx = HEAD_R * 0.98 * (1.0 + 0.10 * Math.max(0, ax));
  const ry = HEAD_R * 0.90 * (1.0 - 0.06 * Math.max(0, -ay));
  const rz = HEAD_R * 1.02 * lop;

  // muzzle push: bulge forward+down at the front-lower quadrant
  const muzz = Math.max(0, ax) * Math.max(0, 0.55 - ay) * 1.05;

  out.set(
    ax * rx + muzz * 0.085,
    ay * ry - muzz * 0.030 + 0.004 * Math.cos(phi * 3.0),
    az * rz
  );
  return out;
}

function headMatPick(u, v, p) {
  // cream muzzle: front + slightly lower
  const fx = p.x / (HEAD_R * 1.15);
  const fy = p.y / (HEAD_R * 1.0);
  const fz = p.z / (HEAD_R * 1.15);
  const d = Math.sqrt(
    Math.pow((fx - 0.86) * 1.05, 2) +
    Math.pow((fy + 0.20) * 0.92, 2) +
    Math.pow(fz * 0.80, 2)
  );
  if (d < 0.92) return 1;   // cream muzzle / cheeks
  return 0;
}

const headStitches = buildAmigurumi({
  surface: headSurface,
  rounds: 30,
  stitchesAt: (v) => 7 + 34 * Math.sin(v * Math.PI),
  stitchScale: () => 0.0225,
  matPicker: headMatPick,
  materials: [MAT.cocoa, MAT.cream],
  wobble: 0.0032,
  tilt: 1.0
});
headGroup.add(headStitches);

// head stuffing shell
{
  const g = new THREE.SphereGeometry(1, 40, 28);
  const pos = g.attributes.position;
  const v3 = new THREE.Vector3(), tmp = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v3.fromBufferAttribute(pos, i);
    const theta = Math.acos(THREE.MathUtils.clamp(v3.y, -1, 1));
    const phi = Math.atan2(v3.z, v3.x);
    const u = ((phi / (Math.PI * 2)) + 1) % 1;
    const vv = theta / Math.PI;
    headSurface(u, vv, tmp);
    tmp.multiplyScalar(0.95);
    pos.setXYZ(i, tmp.x, tmp.y, tmp.z);
  }
  g.computeVertexNormals();
  headGroup.add(stuffing(g, MAT.cocoa));
}

/* ---------- muzzle: two little cream cheek puffs ---------- */
function cheekPuff(sign) {
  const grp = new THREE.Group();
  const R = 0.052;
  const surf = (u, v, out) => {
    const theta = v * Math.PI, phi = u * Math.PI * 2;
    const st = Math.sin(theta), ct = Math.cos(theta);
    out.set(st * Math.cos(phi) * R * 1.05, ct * R * 0.86, st * Math.sin(phi) * R * 0.95);
    return out;
  };
  grp.add(buildAmigurumi({
    surface: surf,
    rounds: 14,
    stitchesAt: (v) => 5 + 15 * Math.sin(v * Math.PI),
    stitchScale: () => 0.0135,
    material: MAT.cream,
    wobble: 0.0016,
    tilt: 1.0
  }));
  const inner = new THREE.Mesh(new THREE.SphereGeometry(R * 0.90, 22, 16), MAT.cream);
  inner.scale.set(1.05, 0.86, 0.95);
  inner.castShadow = true; inner.receiveShadow = true;
  grp.add(inner);
  grp.position.set(0.148, -0.036, sign * 0.043);
  return grp;
}
headGroup.add(cheekPuff(1));
headGroup.add(cheekPuff(-1));

/* ---------- nose: little embroidered triangle ---------- */
{
  const noseGeo = new THREE.SphereGeometry(0.030, 20, 14);
  noseGeo.scale(0.80, 0.72, 1.15);
  const nose = new THREE.Mesh(noseGeo, MAT.nose);
  nose.position.set(0.192, 0.006, 0.0);
  nose.castShadow = true;
  headGroup.add(nose);

  // stitched mouth line: two tiny yarn strands
  const mouthMat = MAT.nose;
  for (const s of [1, -1]) {
    const seg = new THREE.Mesh(BAR_GEO, mouthMat);
    seg.scale.set(0.0055, 0.030, 0.0055);
    seg.position.set(0.176, -0.031, s * 0.017);
    seg.rotation.set(s * 0.55, 0, Math.PI / 2 - s * 0.25);
    seg.castShadow = true;
    headGroup.add(seg);
  }
  // philtrum
  const phil = new THREE.Mesh(BAR_GEO, mouthMat);
  phil.scale.set(0.005, 0.017, 0.005);
  phil.position.set(0.188, -0.019, 0);
  phil.rotation.set(0, 0, 0.25);
  headGroup.add(phil);
}

/* ---------- safety eyes ---------- */
function safetyEye(sign) {
  const g = new THREE.Group();
  const dome = new THREE.Mesh(new THREE.SphereGeometry(0.0235, 24, 18), MAT.eye);
  dome.scale.set(1.0, 1.0, 1.0);
  dome.castShadow = true;
  g.add(dome);
  // tiny specular highlight bead
  const hl = new THREE.Mesh(
    new THREE.SphereGeometry(0.0062, 12, 10),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  hl.position.set(0.0155, 0.0115, 0.0075);
  g.add(hl);
  // faint cocoa "eye ring" where the yarn puckers around the shank
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.0255, 0.0055, 6, 18),
    MAT.cocoaDark
  );
  ring.rotation.y = Math.PI / 2;
  ring.position.x = -0.006;
  g.add(ring);

  g.position.set(0.116, 0.052, sign * 0.070);
  g.rotation.y = -sign * 0.55;
  g.rotation.z = sign * 0.06;
  // deliberate slight asymmetry — handmade
  if (sign > 0) { g.position.y += 0.006; g.position.x -= 0.003; }
  return g;
}
headGroup.add(safetyEye(1));
headGroup.add(safetyEye(-1));

/* ---------- whiskers ---------- */
{
  const wMat = MAT.whisker;
  const whiskerGeo = new THREE.CylinderGeometry(0.0011, 0.0007, 1, 5, 1);
  for (const s of [1, -1]) {
    for (let i = 0; i < 3; i++) {
      const w = new THREE.Mesh(whiskerGeo, wMat);
      const len = 0.085 + i * 0.012;
      w.scale.set(1, len, 1);
      w.position.set(0.170, -0.012 - i * 0.012, s * 0.040);
      w.rotation.z = Math.PI / 2 - 0.18 + i * 0.16;
      w.rotation.x = -s * (0.55 + i * 0.10);
      w.translateY(len * 0.5);
      w.castShadow = false;
      headGroup.add(w);
    }
  }
}

/* ---------- ears: tiny crocheted nubs ---------- */
function ear(sign) {
  const g = new THREE.Group();
  const R = 0.030;
  const surf = (u, v, out) => {
    const theta = v * Math.PI, phi = u * Math.PI * 2;
    const st = Math.sin(theta), ct = Math.cos(theta);
    out.set(st * Math.cos(phi) * R * 0.62, ct * R, st * Math.sin(phi) * R * 0.95);
    return out;
  };
  g.add(buildAmigurumi({
    surface: surf,
    rounds: 10,
    stitchesAt: (v) => 4 + 11 * Math.sin(v * Math.PI),
    stitchScale: () => 0.0118,
    material: MAT.cocoaDark,
    wobble: 0.0012,
    tilt: 1.0
  }));
  const core = new THREE.Mesh(new THREE.SphereGeometry(R * 0.86, 16, 12), MAT.cocoaDark);
  core.scale.set(0.62, 1.0, 0.95);
  core.castShadow = true;
  g.add(core);
  g.position.set(-0.026, 0.104, sign * 0.128);
  g.rotation.x = sign * 0.30;
  g.rotation.z = 0.22;
  return g;
}
headGroup.add(ear(1));
headGroup.add(ear(-1));

/* =========================================================
   3. BELLY PATCH — a raised cream oval of stitches on the tummy
   ========================================================= */
{
  const patch = new THREE.Group();
  const rounds = 13;
  const cx = 0.03, cy = BODY.ry * 0.92, cz = 0.0;
  const ra = 0.175, rb = 0.115;
  const dummy = new THREE.Object3D();
  const list = [];
  const p = new THREE.Vector3();
  for (let r = 1; r <= rounds; r++) {
    const t = r / rounds;
    const n = Math.max(6, Math.round(6 + 32 * t));
    for (let s = 0; s < n; s++) {
      const a = (s / n + r * 0.11) * Math.PI * 2;
      const ex = Math.cos(a) * ra * t;
      const ez = Math.sin(a) * rb * t;
      const px = cx + ex;
      const pz = cz + ez;
      // project onto body top
      const nx = (px - BODY.cx) / BODY.rx;
      const nz = pz / BODY.rz;
      const q = 1 - nx * nx - nz * nz;
      if (q <= 0.02) continue;
      const py = BODY.cy + Math.sqrt(q) * BODY.ry * 1.20 * (1 + 0.05);
      p.set(px, py + 0.010, pz);
      dummy.position.copy(p);
      dummy.rotation.set(Math.PI / 2 + (rnd() - 0.5) * 0.3, (rnd() - 0.5) * 0.4, a + (rnd() - 0.5) * 0.4);
      const sc = 0.0225 * (1 + (rnd() - 0.5) * 0.2);
      dummy.scale.set(sc * 1.15, sc, sc * 0.9);
      dummy.updateMatrix();
      list.push(dummy.matrix.clone());
    }
  }
  const inst = new THREE.InstancedMesh(STITCH_GEO, MAT.cream, list.length);
  for (let i = 0; i < list.length; i++) inst.setMatrixAt(i, list[i]);
  inst.instanceMatrix.needsUpdate = true;
  inst.castShadow = true; inst.receiveShadow = true;
  patch.add(inst);
  otter.add(patch);
}

/* =========================================================
   4. PAWS — stubby forepaws pressed together over the belly
   ========================================================= */
function forepaw(sign) {
  const g = new THREE.Group();

  // upper arm + paw as one stubby crocheted limb (capsule-ish)
  const LEN = 0.135, R = 0.049;
  const limbSurface = (u, v, out) => {
    const t = v;                       // 0 = shoulder, 1 = paw tip
    const phi = u * Math.PI * 2;
    // capsule profile
    let rad;
    if (t < 0.16) rad = R * Math.sqrt(Math.max(0, 1 - Math.pow((0.16 - t) / 0.16, 2))) * 0.92 + R * 0.10;
    else if (t > 0.80) rad = R * 1.06 * Math.sqrt(Math.max(0, 1 - Math.pow((t - 0.80) / 0.24, 2))) + R * 0.05;
    else rad = R * (0.94 + 0.16 * Math.sin((t - 0.16) * 3.0));
    const y = -t * LEN;
    // gentle inward curve so paws meet
    const bend = Math.pow(t, 1.7) * 0.045;
    out.set(
      Math.cos(phi) * rad + bend * 0.55,
      y,
      Math.sin(phi) * rad * 0.92 - sign * bend
    );
    return out;
  };

  g.add(buildAmigurumi({
    surface: limbSurface,
    rounds: 22,
    stitchesAt: () => 15,
    stitchScale: (v) => 0.0155 * (v > 0.82 ? 1.02 : 1.0),
    matPicker: (u, v) => (v > 0.72 && Math.cos(u * Math.PI * 2) > 0.05 ? 1 : 0),
    materials: [MAT.cocoa, MAT.peach],
    wobble: 0.0015,
    tilt: 1.0
  }));

  // inner limb shell
  {
    const g2 = new THREE.CylinderGeometry(1, 1, 1, 20, 24, false);
    const pos = g2.attributes.position;
    const v3 = new THREE.Vector3(), tmp = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v3.fromBufferAttribute(pos, i);
      const phi = Math.atan2(v3.z, v3.x);
      const u = ((phi / (Math.PI * 2)) + 1) % 1;
      const vv = THREE.MathUtils.clamp(0.5 - v3.y, 0, 1);
      limbSurface(u, vv, tmp);
      tmp.x *= 0.93; tmp.z *= 0.93;
      pos.setXYZ(i, tmp.x, tmp.y, tmp.z);
    }
    g2.computeVertexNormals();
    const shell = new THREE.Mesh(g2, MAT.cocoa);
    shell.castShadow = true; shell.receiveShadow = true;
    g.add(shell);
  }

  // pale peach paw pad
  const padGeo = new THREE.SphereGeometry(0.036, 20, 14);
  padGeo.scale(1.0, 0.55, 0.85);
  const pad = new THREE.Mesh(padGeo, MAT.peach);
  pad.position.set(0.020, -LEN - 0.008, -sign * 0.030);
  pad.rotation.z = 0.5;
  pad.rotation.x = -sign * 0.4;
  pad.castShadow = true;
  g.add(pad);

  // three tiny toe beads on each pad
  for (let i = 0; i < 3; i++) {
    const toe = new THREE.Mesh(new THREE.SphereGeometry(0.0105, 12, 10), MAT.peach);
    const a = -0.55 + i * 0.55;
    toe.position.set(
      0.033 + Math.cos(a) * 0.004,
      -LEN - 0.020 + Math.sin(a) * 0.012,
      -sign * (0.030 + Math.cos(a) * 0.020)
    );
    toe.castShadow = true;
    g.add(toe);
  }

  // attach at shoulder, angled so paws press together over the belly
  g.position.set(0.150, 0.145, sign * 0.115);
  g.rotation.set(sign * 0.62, 0.0, sign * 0.30 + 0.10);
  g.rotation.x += sign * 0.28;
  g.rotation.z += -0.62;
  return g;
}
const pawL = forepaw(1);
const pawR = forepaw(-1);
otter.add(pawL, pawR);

/* =========================================================
   5. HIND FLIPPERS — webbed paddles sticking up
   ========================================================= */
function hindFlipper(sign) {
  const g = new THREE.Group();
  const L = 0.115, W = 0.070, T = 0.030;

  const flipSurf = (u, v, out) => {
    const t = v;
    const phi = u * Math.PI * 2;
    // widening paddle
    const widen = 0.42 + 0.95 * Math.pow(t, 0.85);
    const rx = W * widen * 0.5;
    const rz = T * (0.95 - 0.30 * t) * 0.5 + 0.008;
    // rounded caps
    let cap = 1.0;
    if (t < 0.12) cap = Math.sqrt(Math.max(0.02, 1 - Math.pow((0.12 - t) / 0.12, 2)));
    if (t > 0.88) cap = Math.sqrt(Math.max(0.02, 1 - Math.pow((t - 0.88) / 0.14, 2)));
    out.set(
      Math.cos(phi) * rx * cap,
      -t * L,
      Math.sin(phi) * rz * cap * 1.6
    );
    return out;
  };

  g.add(buildAmigurumi({
    surface: flipSurf,
    rounds: 18,
    stitchesAt: () => 16,
    stitchScale: () => 0.0135,
    matPicker: (u, v) => (v > 0.55 && Math.sin(u * Math.PI * 2) > 0.15 ? 1 : 0),
    materials: [MAT.cocoaDark, MAT.peach],
    wobble: 0.0012,
    tilt: 1.0
  }));

  // shell
  {
    const g2 = new THREE.CylinderGeometry(1, 1, 1, 18, 22, false);
    const pos = g2.attributes.position;
    const v3 = new THREE.Vector3(), tmp = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v3.fromBufferAttribute(pos, i);
      const phi = Math.atan2(v3.z, v3.x);
      const u = ((phi / (Math.PI * 2)) + 1) % 1;
      const vv = THREE.MathUtils.clamp(0.5 - v3.y, 0, 1);
      flipSurf(u, vv, tmp);
      tmp.x *= 0.90; tmp.z *= 0.90;
      pos.setXYZ(i, tmp.x, tmp.y, tmp.z);
    }
    g2.computeVertexNormals();
    const shell = new THREE.Mesh(g2, MAT.cocoaDark);
    shell.castShadow = true; shell.receiveShadow = true;
    g.add(shell);
  }

  // webbing toe separations (little peach lines)
  for (let i = 0; i < 3; i++) {
    const sep = new THREE.Mesh(BAR_GEO, MAT.peach);
    sep.scale.set(0.0045, 0.038, 0.0045);
    sep.position.set(-0.020 + i * 0.020, -L * 0.86, 0.020);
    sep.castShadow = true;
    g.add(sep);
  }

  g.position.set(-0.245, 0.075, sign * 0.105);
  g.rotation.set(sign * 0.22, 0.0, Math.PI * 0.92 + sign * 0.12);
  g.rotation.x += -0.35;
  return g;
}
otter.add(hindFlipper(1));
otter.add(hindFlipper(-1));

/* =========================================================
   6. TAIL — stuffed sausage, tapering, lying back and down
   ========================================================= */
{
  const tail = new THREE.Group();
  const L = 0.30;

  const tailPath = (t) => new THREE.Vector3(
    -t * L,
    0.008 - Math.sin(t * 1.5) * 0.045 - t * t * 0.02,
    Math.sin(t * 2.1) * 0.016
  );

  const tailSurf = (u, v, out) => {
    const t = v;
    const phi = u * Math.PI * 2;
    const c = tailPath(t);
    // tangent
    const c2 = tailPath(Math.min(1, t + 0.01));
    const tan = c2.clone().sub(c);
    if (tan.lengthSq() < 1e-12) tan.set(-1, 0, 0);
    tan.normalize();
    const up = new THREE.Vector3(0, 1, 0);
    const side = new THREE.Vector3().crossVectors(tan, up);
    if (side.lengthSq() < 1e-10) side.set(0, 0, 1);
    side.normalize();
    const nrm = new THREE.Vector3().crossVectors(side, tan).normalize();

    // sausage radius: fat near base, taper to rounded tip
    let rad = 0.062 * (1.0 - 0.62 * Math.pow(t, 1.25));
    if (t < 0.10) rad *= Math.sqrt(Math.max(0.05, 1 - Math.pow((0.10 - t) / 0.12, 2))) * 0.9 + 0.30;
    if (t > 0.90) rad *= Math.sqrt(Math.max(0.03, 1 - Math.pow((t - 0.90) / 0.115, 2)));
    // flatten the sausage slightly (sea otter tails are flattish)
    const rs = rad * 1.12;
    const rn = rad * 0.80;

    out.set(
      c.x + side.x * Math.cos(phi) * rs + nrm.x * Math.sin(phi) * rn,
      c.y + side.y * Math.cos(phi) * rs + nrm.y * Math.sin(phi) * rn,
      c.z + side.z * Math.cos(phi) * rs + nrm.z * Math.sin(phi) * rn
    );
    return out;
  };

  tail.add(buildAmigurumi({
    surface: tailSurf,
    rounds: 34,
    stitchesAt: (v) => Math.max(7, Math.round(20 - 9 * v)),
    stitchScale: (v) => 0.0165 * (1 - 0.30 * v),
    material: MAT.cocoa,
    wobble: 0.0018,
    tilt: 1.0
  }));

  // tail shell
  {
    const g2 = new THREE.CylinderGeometry(1, 1, 1, 22, 40, false);
    const pos = g2.attributes.position;
    const v3 = new THREE.Vector3(), tmp = new THREE.Vector3();
    const center = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v3.fromBufferAttribute(pos, i);
      const phi = Math.atan2(v3.z, v3.x);
      const u = ((phi / (Math.PI * 2)) + 1) % 1;
      const vv = THREE.MathUtils.clamp(0.5 - v3.y, 0, 1);
      tailSurf(u, vv, tmp);
      const c = tailPath(vv);
      center.copy(c);
      tmp.sub(center).multiplyScalar(0.92).add(center);
      pos.setXYZ(i, tmp.x, tmp.y, tmp.z);
    }
    g2.computeVertexNormals();
    const shell = new THREE.Mesh(g2, MAT.cocoa);
    shell.castShadow = true; shell.receiveShadow = true;
    tail.add(shell);
  }

  tail.position.set(-0.30, -0.015, 0.0);
  tail.rotation.z = -0.12;
  tail.rotation.y = 0.10;
  otter.add(tail);
}

/* =========================================================
   7. A few visible seam / drawstring details
   ========================================================= */
{
  // magic-ring pucker at the tail-end of the body spiral
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.020, 0.008, 8, 16),
    MAT.cocoaDark
  );
  ring.rotation.y = Math.PI / 2;
  ring.position.set(-0.365, 0.0, 0.0);
  ring.castShadow = true;
  otter.add(ring);

  // small yarn tail-end poking out (loose end, very amigurumi)
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.360, 0.005, 0.012),
    new THREE.Vector3(-0.392, 0.030, 0.030),
    new THREE.Vector3(-0.404, 0.010, 0.056),
    new THREE.Vector3(-0.386, -0.014, 0.070)
  ]);
  const yarnEnd = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 40, 0.0055, 8, false),
    MAT.cocoa
  );
  yarnEnd.castShadow = true;
  otter.add(yarnEnd);
}

/* =========================================================
   Center & seat the assembled otter
   ========================================================= */
{
  const box = new THREE.Box3().setFromObject(otter);
  const center = new THREE.Vector3();
  box.getCenter(center);
  otter.position.x -= center.x;
  otter.position.z -= center.z;
  // seat it just above the shadow plane
  otter.position.y -= box.min.y + 0.235;
  const size = new THREE.Vector3();
  box.getSize(size);
  void size;
}

// gentle overall pose: a touch of roll, like it's bobbing
otter.rotation.z = 0.04;
otter.rotation.x = -0.02;

/* ============================================================
   Animate
   ============================================================ */
let t0 = 0;
function animate(now) {
  requestAnimationFrame(animate);
  const t = (now || 0) * 0.001;
  if (!t0) t0 = t;
  const e = t - t0;

  // slow bobbing float
  otter.position.y += Math.sin(e * 1.05) * 0.00022;
  otter.rotation.z = 0.04 + Math.sin(e * 0.75) * 0.018;
  otter.rotation.x = -0.02 + Math.sin(e * 0.53 + 1.1) * 0.012;

  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
