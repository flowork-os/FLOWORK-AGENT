<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inflatable Flamingo</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f4a8c5;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5abc7);
scene.fog = new THREE.Fog(0xf5abc7, 9, 18);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(6.8, 4.4, 8.8);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.15;
controls.minDistance = 5.8;
controls.maxDistance = 13;
controls.target.set(0, 2.15, 0);

const hemi = new THREE.HemisphereLight(0xffe8f2, 0x8b496d, 2.25);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffffff, 4.2);
keyLight.position.set(-4.5, 8, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -3;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const rimLight = new THREE.PointLight(0xffc2dd, 2.6, 12, 2);
rimLight.position.set(4, 5.5, -4);
scene.add(rimLight);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xd982aa,
  roughness: 0.82,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.18;
floor.receiveShadow = true;
scene.add(floor);

const pink = new THREE.MeshPhysicalMaterial({
  color: 0xf24991,
  roughness: 0.2,
  metalness: 0.02,
  clearcoat: 0.82,
  clearcoatRoughness: 0.12,
  sheen: 0.25,
  sheenColor: 0xffb6d4
});

const lightPink = new THREE.MeshPhysicalMaterial({
  color: 0xff72ad,
  roughness: 0.18,
  metalness: 0.01,
  clearcoat: 0.9,
  clearcoatRoughness: 0.1
});

const seamMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xff91bd,
  roughness: 0.24,
  metalness: 0,
  clearcoat: 0.72,
  clearcoatRoughness: 0.16
});

const darkPink = new THREE.MeshPhysicalMaterial({
  color: 0xd92d73,
  roughness: 0.24,
  metalness: 0,
  clearcoat: 0.72,
  clearcoatRoughness: 0.15
});

const blackMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x16151c,
  roughness: 0.15,
  metalness: 0.08,
  clearcoat: 0.75,
  clearcoatRoughness: 0.08
});

const orangeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xf36b32,
  roughness: 0.22,
  metalness: 0,
  clearcoat: 0.7,
  clearcoatRoughness: 0.12
});

const whiteMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });

const flamingo = new THREE.Group();
flamingo.position.y = 0.15;
scene.add(flamingo);

function makeSphere(name, position, scale, material) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.scale.set(scale[0], scale[1], scale[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  flamingo.add(mesh);
  return mesh;
}

function makeTube(name, curve, radius, material, tubularSegments = 64, radialSegments = 20) {
  const mesh = new THREE.Mesh(
    new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, false),
    material
  );
  mesh.name = name;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  flamingo.add(mesh);
  return mesh;
}

function closedLoop(points, radius, material, name) {
  const curve = new THREE.CatmullRomCurve3(points, true, "catmullrom", 0.5);
  return makeTube(name, curve, radius, material, 72, 16);
}

makeSphere("inflated body", [0, 1.48, 0], [2.28, 1.35, 1.3], pink);
makeSphere("belly highlight", [-0.42, 1.66, 1.03], [1.2, 0.7, 0.16], lightPink);

const bodySeamPoints = [];
for (let i = 0; i < 24; i++) {
  const angle = (i / 24) * Math.PI * 2;
  bodySeamPoints.push(new THREE.Vector3(
    Math.cos(angle) * 2.08,
    1.48 + Math.sin(angle) * 0.98,
    Math.sin(angle) * 1.12
  ));
}
closedLoop(bodySeamPoints, 0.075, seamMaterial, "body welded seam");

makeSphere("left wing", [-0.64, 1.55, 1.02], [1.02, 0.9, 0.3], darkPink);
makeSphere("right wing", [-0.64, 1.55, -1.02], [1.02, 0.9, 0.3], darkPink);

const wingSeamFront = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-1.38, 1.05, 1.29),
  new THREE.Vector3(-0.9, 0.83, 1.37),
  new THREE.Vector3(-0.1, 1.02, 1.37),
  new THREE.Vector3(0.22, 1.58, 1.29),
  new THREE.Vector3(-0.22, 2.12, 1.22),
  new THREE.Vector3(-0.95, 2.12, 1.18),
  new THREE.Vector3(-1.4, 1.7, 1.2)
]);
makeTube("front wing seam", wingSeamFront, 0.065, seamMaterial, 48, 12);

const wingSeamBack = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-1.38, 1.05, -1.29),
  new THREE.Vector3(-0.9, 0.83, -1.37),
  new THREE.Vector3(-0.1, 1.02, -1.37),
  new THREE.Vector3(0.22, 1.58, -1.29),
  new THREE.Vector3(-0.22, 2.12, -1.22),
  new THREE.Vector3(-0.95, 2.12, -1.18),
  new THREE.Vector3(-1.4, 1.7, -1.2)
]);
makeTube("back wing seam", wingSeamBack, 0.065, seamMaterial, 48, 12);

const neckCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.92, 2.03, 0),
  new THREE.Vector3(1.38, 2.55, 0),
  new THREE.Vector3(1.4, 3.05, 0),
  new THREE.Vector3(0.72, 3.55, 0),
  new THREE.Vector3(0.68, 4.03, 0),
  new THREE.Vector3(1.15, 4.42, 0)
]);
makeTube("S curved neck", neckCurve, 0.35, pink, 96, 28);

makeSphere("neck base weld", [0.91, 2.08, 0], [0.52, 0.38, 0.47], seamMaterial);
makeSphere("neck upper weld", [1.08, 4.32, 0], [0.4, 0.32, 0.4], seamMaterial);

makeSphere("flamingo head", [1.2, 4.68, 0], [0.7, 0.62, 0.58], lightPink);
makeSphere("head cheek", [1.5, 4.46, 0.02], [0.34, 0.27, 0.3], pink);

const eye = makeSphere("shiny eye", [1.52, 4.88, 0.48], [0.105, 0.105, 0.105], blackMaterial);
makeSphere("eye catchlight", [1.56, 4.94, 0.565], [0.031, 0.031, 0.031], whiteMaterial);

const upperBeak = new THREE.Mesh(new THREE.ConeGeometry(0.27, 0.82, 32), orangeMaterial);
upperBeak.name = "orange beak";
upperBeak.rotation.z = Math.PI / 2;
upperBeak.position.set(1.86, 4.53, 0.02);
upperBeak.scale.set(1, 1, 0.82);
upperBeak.castShadow = true;
upperBeak.receiveShadow = true;
flamingo.add(upperBeak);

const beakTip = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.3, 32), blackMaterial);
beakTip.name = "black beak tip";
beakTip.rotation.z = Math.PI / 2;
beakTip.position.set(2.31, 4.53, 0.02);
beakTip.castShadow = true;
beakTip.receiveShadow = true;
flamingo.add(beakTip);

makeSphere("tucked front leg", [0.44, 0.38, 0.66], [0.48, 0.42, 0.4], pink);
makeSphere("tucked back leg", [-0.58, 0.34, -0.62], [0.55, 0.4, 0.42], pink);
makeSphere("front foot", [0.72, 0.12, 0.73], [0.7, 0.18, 0.36], lightPink);
makeSphere("back foot", [-0.88, 0.11, -0.68], [0.72, 0.18, 0.36], lightPink);

const footSeamFront = new THREE.TorusGeometry(0.42, 0.045, 10, 32, Math.PI * 1.5);
const frontFootRing = new THREE.Mesh(footSeamFront, seamMaterial);
frontFootRing.rotation.x = Math.PI / 2;
frontFootRing.rotation.z = -0.2;
frontFootRing.position.set(0.73, 0.17, 0.73);
frontFootRing.scale.set(1, 0.5, 1);
frontFootRing.castShadow = true;
flamingo.add(frontFootRing);

const footSeamBack = new THREE.Mesh(new THREE.TorusGeometry(0.43, 0.045, 10, 32, Math.PI * 1.5), seamMaterial);
footSeamBack.rotation.x = Math.PI / 2;
footSeamBack.rotation.z = 0.2;
footSeamBack.position.set(-0.88, 0.17, -0.68);
footSeamBack.scale.set(1, 0.5, 1);
footSeamBack.castShadow = true;
flamingo.add(footSeamBack);

const tail = makeSphere("rounded tail", [-1.96, 1.72, 0], [0.58, 0.68, 0.75], pink);
tail.rotation.z = -0.28;

const groundShadow = new THREE.Mesh(
  new THREE.CircleGeometry(3.1, 64),
  new THREE.MeshBasicMaterial({ color: 0xc76b98, transparent: true, opacity: 0.22 })
);
groundShadow.rotation.x = -Math.PI / 2;
groundShadow.position.set(0, -0.165, 0);
groundShadow.scale.set(1.25, 0.6, 1);
scene.add(groundShadow);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
