<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Old Tram Street</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1d2733}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x8d8590, 0.012);
scene.background = new THREE.Color(0x403b53);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(48,window.innerWidth/window.innerHeight,.1,240);
camera.position.set(18,12,21);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .055;
controls.autoRotate = true;
controls.autoRotateSpeed = .35;
controls.target.set(0,3,-2);
controls.minDistance = 12;
controls.maxDistance = 48;
controls.maxPolarAngle = Math.PI*.47;

const rand = (()=>{let s=734291;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}})();
const pick = (a,b)=>a+(b-a)*rand();
const mat = (color,rough=.8,metal=0,emissive=0,emissiveColor=color)=>{
  return new THREE.MeshStandardMaterial({
    color,roughness:rough,metalness:metal,
    emissive:emissiveColor,emissiveIntensity:emissive
  });
};
const mats = {
  cobble:mat(0x67646b,.98),
  curb:mat(0xaaa29b,.85),
  rail:mat(0x302d31,.3,.75),
  railGlow:mat(0x887c72,.25,.7),
  cream:mat(0xe6d0a5,.72),
  tramRed:mat(0x9c332f,.6),
  darkRed:mat(0x542126,.7),
  brass:mat(0xb08b4a,.3,.75),
  black:mat(0x17191c,.42,.35),
  glass:mat(0x263a43,.13,.15,.18,0xb36a36),
  window:mat(0x17232c,.2,.15),
  wallA:mat(0xb07a60,.98),
  wallB:mat(0x8b6260,.97),
  wallC:mat(0xc09a71,.97),
  wallD:mat(0x68767b,.98),
  plaster:mat(0xd1b891,.98),
  wood:mat(0x513b36,.85),
  awning:mat(0x53716e,.85),
  awningRed:mat(0x9b4039,.85),
  leaf:mat(0x35543d,.9),
  flower:mat(0xd76258,.75),
  flower2:mat(0xe8b85f,.75),
  lamp:mat(0x11151a,.3,.5),
  gold:mat(0xd2a65e,.3,.65),
  mailbox:mat(0xa52e2a,.65),
  pigeon:mat(0x6e747b,.8),
  ground:mat(0x77747a,.98)
};

function box(name,x,y,z,sx,sy,sz,material,group=scene){
  const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),material);
  m.name=name;m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;group.add(m);return m;
}
function cyl(name,x,y,z,r,h,material,radial=12,group=scene){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,radial),material);
  m.name=name;m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;group.add(m);return m;
}
function sphere(name,x,y,z,r,material,group=scene){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),material);
  m.name=name;m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;group.add(m);return m;
}
function plane(name,x,y,z,sx,sy,material,rot=[-Math.PI/2,0,0],group=scene){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(sx,sy),material);
  m.name=name;m.position.set(x,y,z);m.rotation.set(...rot);m.receiveShadow=true;group.add(m);return m;
}
function between(a,b,r,material,group=scene){
  const d=new THREE.Vector3().subVectors(b,a);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),8),material);
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
  m.castShadow=true;group.add(m);return m;
}
function canvasTexture(draw,w=256,h=256){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');draw(x,w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
const cobbleTex=canvasTexture((x,w,h)=>{
  x.fillStyle='#77757a';x.fillRect(0,0,w,h);
  for(let i=0;i<180;i++){
    const px=rand()*w,py=rand()*h,rx=pick(4,13),ry=pick(2.5,7);
    x.fillStyle=['#65646a','#858186','#706e73','#969095'][Math.floor(rand()*4)];
    x.beginPath();x.ellipse(px,py,rx,ry,pick(-.3,.3),0,Math.PI*2);x.fill();
    x.strokeStyle='rgba(30,28,32,.25)';x.lineWidth=1;x.stroke();
  }
},512,512);
cobbleTex.repeat.set(7,24);
const cobbleMat=mat(0xffffff,1);cobbleMat.map=cobbleTex;

const skyTex=canvasTexture((x,w,h)=>{
  const g=x.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#252d49');g.addColorStop(.48,'#675c75');g.addColorStop(1,'#d28b70');
  x.fillStyle=g;x.fillRect(0,0,w,h);
  x.fillStyle='rgba(255,215,169,.25)';x.beginPath();x.arc(w*.72,h*.41,42,0,Math.PI*2);x.fill();
},1024,512);
const sky=new THREE.Mesh(new THREE.SphereGeometry(100,32,16),new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide}));
scene.add(sky);

const ground=plane('cobblestone street',0,0,0,32,100,cobbleMat);
box('left curb',-6.5,.18,0,.45,.36,80,mats.curb);
box('right curb',6.5,.18,0,.45,.36,80,mats.curb);
plane('left pavement',-9,.3,0,5,80,mat(0x9a8b86,.96));
plane('right pavement',9,.3,0,5,80,mat(0x9a8b86,.96));

for(const x of [-1.45,1.45]){
  box('embedded rail',x,.22,0,.13,.16,86,mats.rail);
  box('rail highlight',x,.31,0,.055,.045,86,mats.railGlow);
}
for(let z=-39;z<41;z+=2.1) box('rail sleeper',0,.13,z,4.5,.12,.19,mats.wood);

function makeBuilding(side,z,width,height,material,style=0){
  const x=side*10;
  const g=new THREE.Group();g.position.z=z;scene.add(g);
  box('narrow building',x,height/2,.0,width,height,8,material,g);
  box('shop fascia',x-side*width*.03,2.55,side*4.08,width*.94,.65,.15,mats.wood,g);
  const doorX=x+side*width*.26;
  box('shop door',doorX,1.45,side*4.13,width*.18,2.7,.12,mats.wood,g);
  const doorGlass=box('door glass',doorX,1.62,side*4.21,width*.12,1.95,.035,mats.glass,g);
  const upper=height>8?2:1;
  for(let row=0;row<upper;row++){
    const yy=5.1+row*3.05;
    for(let col=-1;col<=1;col++){
      const wx=x+col*width*.27;
      box('tall window',wx,yy,side*4.1,width*.16,1.45,.12,mats.window,g);
      box('window frame',wx,yy,side*4.19,.06,1.5,.08,mats.gold,g);
      box('window sill',wx,yy-.83,side*4.25,width*.22,.12,.18,mats.curb,g);
      if(row===0){
        box('flower box',wx,yy-.9,side*4.36,width*.2,.18,.28,mats.wood,g);
        for(let k=0;k<3;k++) sphere('flower',wx+(k-1)*.12,yy-.76,side*4.48,.07,k%2?mats.flower:mats.flower2,g);
      }
    }
  }
  const aw=width*.56;
  const awMat=style%2?mats.awningRed:mats.awning;
  const awning=box('striped awning',x-side*width*.05,3.35,side*4.55,aw,.18,1.25,awMat,g);
  awning.rotation.x=side*.22;
  for(let k=0;k<5;k++){
    const stripe=box('awning stripe',x-side*width*.05+(k-2)*aw*.22,3.31,side*4.57,.08,.2,1.28,k%2?mats.cream:awMat,g);
    stripe.rotation.x=side*.22;
  }
  if(style!==2){
    const balconyY=height>8?8.1:6.2;
    box('balcony rail',x-side*width*.05,balconyY,side*4.65,width*.58,.1,.16,mats.black,g);
    box('balcony floor',x-side*width*.05,balconyY-.14,side*4.6,width*.66,.16,1.15,mats.wood,g);
    for(let k=-2;k<=2;k++) cyl('balcony spindle',x-side*width*.05+k*width*.12,balconyY-.55,side*4.66,.035,1.1,mats.black,8,g);
    for(let k=-1;k<=1;k++) box('balcony planter',x-side*width*.05+k*.32,balconyY-.35,side*4.95,.25,.22,.25,mats.wood,g);
  }
  return g;
}
makeBuilding(-1,-15,7,11,mats.wallA,0);
makeBuilding(-1,-4,7,9,mats.wallC,1);
makeBuilding(-1,8,7,12,mats.wallD,2);
makeBuilding(-1,20,7,10,mats.wallB,1);
makeBuilding(1,-17,7,10,mats.wallC,1);
makeBuilding(1,-5,7,12,mats.wallB,0);
makeBuilding(1,8,7,9,mats.wallA,2);
makeBuilding(1,20,7,11,mats.wallD,1);

const tram=new THREE.Group();tram.position.set(0,0,-5);scene.add(tram);
box('tram lower body',0,1.75,0,3.7,2.25,9.2,mats.tramRed,tram);
box('tram cream upper',0,3.45,0,3.55,1.4,8.9,mats.cream,tram);
box('tram roof',0,4.25,0,3.9,.28,9.25,mats.darkRed,tram);
box('tram belt',0,2.55,0,3.76,.28,9.25,mats.darkRed,tram);
for(const zz of [-3.3,-1.1,1.1,3.3]){
  for(const xx of [-1.79,1.79]){
    const w=box('tram window',xx*.985,3.48,zz, .07,1.05,1.55,mats.glass,tram);
    w.rotation.y=0;
  }
}
for(const zz of [-3.3,-1.1,1.1,3.3]){
  box('window mullion',0,3.48,zz-0.83,3.64,1.13,.1,mats.cream,tram);
}
box('tram front window',0,3.45,4.47,2.25,1.05,.08,mats.glass,tram);
box('tram rear window',0,3.45,-4.47,2.25,1.05,.08,mats.glass,tram);
for(const z of [-3.8,3.8]){
  box('tram bumper',0,.68,z,2.9,.24,.25,mats.black,tram);
  for(const x of [-1.22,1.22]) cyl('tram lamp',x,2.08,z+(z>0?.1:-.1),.2,.12,mats.gold,16,tram).rotation.x=Math.PI/2;
}
for(const z of [-2.8,2.8]){
  for(const x of [-1.35,1.35]){
    const wh=new THREE.Mesh(new THREE.TorusGeometry(.48,.13,10,20),mats.black);
    wh.position.set(x,.62,z);wh.rotation.y=Math.PI/2;wh.castShadow=true;tram.add(wh);
    cyl('wheel hub',x,.62,z,.12,.18,mats.gold,12,tram).rotation.z=Math.PI/2;
  }
}
const interiorLights=[];
for(const z of [-3.2,-1.6,0,1.6,3.2]){
  const l=cyl('warm interior lamp',0,4.05,z,.12,.8,mat(0xffc36c,.3,0,2.2,0xff9a38),12,tram);
  l.rotation.z=Math.PI/2;interiorLights.push(l);
}
box('tram destination sign',0,4.13,4.52,1.25,.28,.08,mat(0xf4b75a,.5,0,1.5,0xd87938),tram);
const pantograph=new THREE.Group();tram.add(pantograph);
between(new THREE.Vector3(-.75,4.4,0),new THREE.Vector3(0,6.4,0),.045,mats.black,pantograph);
between(new THREE.Vector3(.75,4.4,0),new THREE.Vector3(0,6.4,0),.045,mats.black,pantograph);
between(new THREE.Vector3(-.75,4.4,0),new THREE.Vector3(.75,4.4,0),.045,mats.black,pantograph);
between(new THREE.Vector3(-.75,6.4,0),new THREE.Vector3(.75,6.4,0),.045,mats.brass,pantograph);

const wireGroup=new THREE.Group();scene.add(wireGroup);
for(const z of [-25,-12,1,14,28]){
  cyl('catenary pole',-5.8,5.0,z,.09,10,mats.black,8,wireGroup);
  cyl('catenary pole',5.8,5.0,z,.09,10,mats.black,8,wireGroup);
  between(new THREE.Vector3(-5.8,9.7,z),new THREE.Vector3(5.8,9.7,z),.035,mats.black,wireGroup);
  between(new THREE.Vector3(-5.8,9.7,z),new THREE.Vector3(5.8,9.7,z+.3),.025,mats.black,wireGroup);
}
between(new THREE.Vector3(0,9.55,-35),new THREE.Vector3(0,9.55,35),.045,mats.black,wireGroup);
between(new THREE.Vector3(-5.8,9.7,-25),new THREE.Vector3(5.8,9.7,-12),.025,mats.black,wireGroup);

function streetLamp(x,z){
  const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  cyl('lamp post',0,3.05,0,.12,5.8,mats.lamp,12,g);
  cyl('lamp base',0,.25,0,.34,.3,mats.lamp,12,g);
  const arm=between(new THREE.Vector3(0,5.55,0),new THREE.Vector3(-Math.sign(x)*.7,5.8,0),.075,mats.lamp,g);
  sphere('lamp globe',-Math.sign(x)*.78,5.72,0,.28,mat(0xffc16d,.35,0,1.8,0xff8634),g);
  const light=new THREE.PointLight(0xffb36a,1.8,8,2);light.position.set(-Math.sign(x)*.78,5.7,0);light.castShadow=true;g.add(light);
  return g;
}
streetLamp(-6, -12);streetLamp(6,-1);streetLamp(-6,13);streetLamp(6,25);

function mailbox(x,z){
  const g=new THREE.Group();g.position.set(x,.2,z);scene.add(g);
  cyl('mailbox body',0,1.55,0,.48,1.2,mats.mailbox,16,g);g.children[0].rotation.z=Math.PI/2;
  box('mail slot',-Math.sign(x)*.47,1.55,0,.04,.16,.45,mats.gold,g);
  cyl('mailbox post',0,.72,0,.09,1.6,mats.black,10,g);
  return g;
}
mailbox(-5.7,5);

function cafeTable(x,z){
  const g=new THREE.Group();g.position.set(x,.25,z);scene.add(g);
  cyl('cafe table',0,1.3,0,.72,.12,mats.gold,20,g);
  cyl('table leg',0,.7,0,.09,1.25,mats.black,10,g);
  for(const dx of [-.25,.25]) for(const dz of [-.25,.25]) cyl('chair leg',dx,.48,dz,.045,.8,mats.black,8,g);
  for(const dx of [-.55,.55]) box('chair seat',dx,.92,0,.45,.1,.45,mats.darkRed,g);
  cyl('flower pot',0,1.53,0,.17,.25,mats.wood,12,g);
  for(let i=0;i<5;i++) sphere('table flower',pick(-.15,.15),1.75,pick(-.15,.15),.09,i%2?mats.flower:mats.flower2,g);
}
cafeTable(-5.5,-8);cafeTable(-5.1,-5);cafeTable(5.25,-10);

function tree(x,z){
  const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  cyl('tree trunk',0,1.8,0,.18,3.3,mats.wood,9,g);
  for(let i=0;i<6;i++) sphere('tree crown',pick(-.7,.7),pick(3.2,4.6),pick(-.6,.6),pick(.45,.75),mats.leaf,g);
}
tree(-5.45,17);tree(5.35,17);

const pigeons=[];
function pigeon(x,z,scale=1){
  const g=new THREE.Group();g.position.set(x,.32,z);g.scale.setScalar(scale);scene.add(g);
  sphere('pigeon body',0,.2,0,.18,mats.pigeon,g);
  sphere('pigeon head',0,.42,.05,.12,mats.pigeon,g);
  const beak=box('beak',0,.42,.17,.055,.045,.14,mats.gold,g);
  const wingL=new THREE.Mesh(new THREE.SphereGeometry(.16,8,6),mats.pigeon);wingL.scale.set(.7,.25,1);wingL.position.set(-.13,.22,0);wingL.rotation.z=.25;g.add(wingL);
  const wingR=wingL.clone();wingR.position.x=.13;wingR.rotation.z=-.25;g.add(wingR);
  pigeons.push({g,phase:rand()*6});
}
pigeon(-2.5,7,.9);pigeon(2.8,10,.8);pigeon(1.8,-13,1);pigeon(-3.2,-17,.7);pigeon(3.5,19,.7);

const fogMats=[];
function hangingBanner(x,z,color){
  const g=new THREE.Group();g.position.set(x,6.3,z);scene.add(g);
  between(new THREE.Vector3(-1.1,0,0),new THREE.Vector3(1.1,0,0),.035,mats.black,g);
  const b=box('street banner',x>0?-.65:.65,-.55,0,.9,1.1,.06,mat(color,.9),g);
  b.rotation.z=x>0?-.08:.08;fogMats.push(b);
}
hangingBanner(-6.1,-7,0x47716d);hangingBanner(6.1,6,0x9b493f);

for(let i=0;i<18;i++){
  const x=pick(-5.5,5.5),z=pick(-30,30);
  if(Math.abs(x)<2.2)continue;
  cyl('bollard',x,.48,z,.13,.75,mats.black,10);
}

const moon=sphere('moon',-22,28,-50,3.2,mat(0xffdca4,.9,0,.1,0xffc477));
const moonLight=new THREE.DirectionalLight(0x9da9d7,1.4);
moonLight.position.set(-20,28,-25);moonLight.castShadow=true;
moonLight.shadow.mapSize.set(2048,2048);
moonLight.shadow.camera.left=-25;moonLight.shadow.camera.right=25;moonLight.shadow.camera.top=35;moonLight.shadow.camera.bottom=-20;
scene.add(moonLight);

const fill=new THREE.HemisphereLight(0x8c9ec7,0x3a302f,1.35);scene.add(fill);
const sun=new THREE.DirectionalLight(0xffb18b,.85);sun.position.set(-18,20,18);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);

const distantArch=new THREE.Group();distantArch.position.set(0,0,-34);scene.add(distantArch);
box('distant facade',0,6,0,24,12,1,mats.wallD,distantArch);
box('distant arch opening',0,3.8,.55,7.5,7.5,.5,mats.window,distantArch);
for(let i=-2;i<=2;i++) box('distant window',i*3,7,.6,1.6,2.5,.1,mats.glass,distantArch);

const clock=new THREE.Group();clock.position.set(0,7.8,-33.4);scene.add(clock);
cyl('clock face',0,0,.12,1.05,.18,mats.cream,32,clock).rotation.x=Math.PI/2;
cyl('clock rim',0,0,.22,1.15,.12,mats.gold,32,clock).rotation.x=Math.PI/2;
between(new THREE.Vector3(0,0,.3),new THREE.Vector3(.45,.25,.3),.045,mats.black,clock);
between(new THREE.Vector3(0,0,.31),new THREE.Vector3(-.12,.58,.31),.045,mats.black,clock);

const animate=()=>{
  requestAnimationFrame(animate);
  const t=performance.now()*.001;
  tram.position.y=Math.sin(t*1.4)*.012;
  pantograph.rotation.z=Math.sin(t*.8)*.025;
  for(let i=0;i<pigeons.length;i++){
    const p=pigeons[i];
    p.g.position.y=.32+Math.max(0,Math.sin(t*1.7+p.phase))*.025;
    p.g.rotation.y=Math.sin(t*.5+p.phase)*.08;
  }
  for(let i=0;i<interiorLights.length;i++) interiorLights[i].material.emissiveIntensity=1.75+Math.sin(t*3+i)*.12;
  fogMats.forEach((m,i)=>m.rotation.y=Math.sin(t*.7+i)*.035);
  controls.update();
  renderer.render(scene,camera);
};
animate();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
});
</script>
</body>
</html>
