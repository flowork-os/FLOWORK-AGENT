<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amigurumi Octopus</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #121319; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 12px; bottom: 12px;
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #8a8f9c; letter-spacing: .3px; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="hint">drag to orbit · scroll to zoom · little crocheted octopus</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ---------------------------------------------------------------- scene / camera
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14151b);
scene.fog = new THREE.Fog(0x14151b, 11, 26);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0.2, 2.1, 6.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 3.5;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.92;
controls.target.set(0, 1.35, 0);

// ---------------------------------------------------------------- environment (subtle reflections)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------------------------------------------------------------- lighting
const hemi = new THREE.HemisphereLight(0xcfe6ff, 0x2a2233, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e6, 2.4);
key.position.set(5, 8.5, 5.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 30;
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -7;
key.shadow.bias = -0.0004;
key.shadow.radius = 5;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fc4ff, 0.55);
fill.position.set(-6, 3.5, 3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9f0, 1.3);
rim.position.set(-3.5, 5.5, -6);
scene.add(rim);

// ---------------------------------------------------------------- ground (shadow-only)
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(16, 64),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// ---------------------------------------------------------------- palette & helpers
const teal   = new THREE.Color(0x1cb3a8);
const purple = new THREE.Color(0x763fae);
const bottomC = teal.clone().lerp(purple, 0.42);

const R = 1.16;            // head radius
const headCenterY = 1.72; // head centre height (local to octopus group)
const baseY = 1.12;       // tentacle attachment height

function lumps(x, y, z) {
  return Math.sin(x * 4.1 + 1.0) * Math.sin(y * 3.7 + 2.0) * Math.sin(z * 4.3 + 0.5)
       + 0.5 * Math.sin(x * 7.3) * Math.sin(y * 6.9) * Math.sin(z * 7.7);
}

// point on the head sphere front hemisphere, given surface offsets (x, y from centre)
function onHead(x, y) {
  const z2 = R * R - x * x - y * y;
  const z = Math.sqrt(Math.max(0.0001, z2));
  return new THREE.Vector3(x, headCenterY + y, z);
}

// ---------------------------------------------------------------- procedural stitch bump texture
function makeStitchTexture() {
  const S = 4, size = 256, cell = size / S;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#7c7c7c';
  ctx.fillRect(0, 0, size, size);

  function drawStitch(cx, cy) {
    const r = cell * 0.44;
    const g = ctx.createRadialGradient(cx, cy - cell * 0.06, r * 0.1, cx, cy, r);
    g.addColorStop(0.0, '#dcdcdc');
    g.addColorStop(0.55, '#9a9a9a');
    g.addColorStop(1.0, '#565656');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(cx, cy, r * 0.9, r * 1.05, 0, 0, Math.PI * 2);
    ctx.fill();
    // little "V" of a single crochet stitch
    ctx.strokeStyle = 'rgba(60,60,60,0.45)';
    ctx.lineWidth = cell * 0.06;
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.5, cy - r * 0.42);
    ctx.lineTo(cx, cy + r * 0.5);
    ctx.lineTo(cx + r * 0.5, cy - r * 0.42);
    ctx.stroke();
  }

  for (let row = -1; row <= S; row++) {
    const offset = (row % 2 === 0) ? 0 : cell * 0.5; // bricked rows
    for (let col = -1; col <= S; col++) {
      drawStitch(col * cell + cell * 0.5 + offset, row * cell + cell * 0.5);
    }
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

const stitchTex = makeStitchTexture();

const yarnMat = new THREE.MeshPhysicalMaterial({
  vertexColors: true,
  roughness: 0.92,
  metalness: 0.0,
  bumpMap: stitchTex,
  bumpScale: 0.022,
  sheen: 1.0,
  sheenRoughness: 0.8,
  sheenColor: new THREE.Color(0x9fe4dc),
  envMapIntensity: 0.35
});

// ---------------------------------------------------------------- octopus group
const octopus = new THREE.Group();
octopus.position.y = 0.12;
scene.add(octopus);

// ------------------------------- head (bulbous, lumpy, ombré) -------------------
const headGeo = new THREE.SphereGeometry(R, 112, 72);
{
  const pos = headGeo.attributes.position;
  const v = new THREE.Vector3();
  const colors = [];
  const amp = 0.045;
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const len = v.length();
    const nx = v.x / len, ny = v.y / len, nz = v.z / len;
    const d = amp * lumps(v.x, v.y, v.z);
    pos.setXYZ(i, v.x + nx * d, v.y + ny * d, v.z + nz * d);

    const p = THREE.MathUtils.clamp((v.y + R) / (2 * R), 0, 1); // 0 bottom, 1 top
    const c = bottomC.clone().lerp(teal, THREE.MathUtils.smoothstep(p, 0.05, 0.95));
    c.offsetHSL(0, 0, 0.05 * Math.sin(v.y * 18.0 + v.x * 13.0));
    colors.push(c.r, c.g, c.b);
  }
  headGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  const uv = headGeo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * 10, uv.getY(i) * 6);
  headGeo.computeVertexNormals();
}
const head = new THREE.Mesh(headGeo, yarnMat);
head.position.set(0, headCenterY, 0);
head.castShadow = true;
head.receiveShadow = true;
octopus.add(head);

// tiny magic-ring knot at the top
const knot = new THREE.Mesh(
  new THREE.SphereGeometry(0.13, 24, 18),
  new THREE.MeshPhysicalMaterial({
    color: teal.clone().lerp(purple, 0.25), roughness: 0.95, metalness: 0,
    sheen: 1, sheenColor: new THREE.Color(0x9fe4dc), envMapIntensity: 0.3
  })
);
knot.position.set(0, headCenterY + R - 0.03, 0);
knot.scale.set(1.0, 0.6, 1.0);
knot.castShadow = true;
octopus.add(knot);

// ------------------------------- tentacles (spiraling, curly, tapered) ----------
function taperedTube(points, radiusFn, tubularSeg, radialSeg, uAround, vLen, colorFn) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.5);
  const frames = curve.computeFrenetFrames(tubularSeg, false);
  const positions = [], normals = [], uvs = [], colors = [], indices = [];
  const P = new THREE.Vector3(), normal = new THREE.Vector3();

  for (let i = 0; i <= tubularSeg; i++) {
    const t = i / tubularSeg;
    curve.getPointAt(t, P);
    const N = frames.normals[i], B = frames.binormals[i];
    const r = radiusFn(t);
    for (let j = 0; j <= radialSeg; j++) {
      const ang = (j / radialSeg) * Math.PI * 2;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      normal.set(ca * N.x + sa * B.x, ca * N.y + sa * B.y, ca * N.z + sa * B.z).normalize();
      const lr = r * (1 + 0.05 * Math.sin(ang * 3 + t * 40)); // soft lumpiness
      positions.push(P.x + lr * normal.x, P.y + lr * normal.y, P.z + lr * normal.z);
      normals.push(normal.x, normal.y, normal.z);
      uvs.push((j / radialSeg) * uAround, t * vLen);
      const col = colorFn(t, j / radialSeg);
      colors.push(col.r, col.g, col.b);
    }
  }
  for (let i = 0; i < tubularSeg; i++) {
    for (let j = 0; j < radialSeg; j++) {
      const a = i * (radialSeg + 1) + j;
      const b = (i + 1) * (radialSeg + 1) + j;
      const c = (i + 1) * (radialSeg + 1) + j + 1;
      const d = i * (radialSeg + 1) + j + 1;
      indices.push(a, b, d, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  g.setIndex(indices);
  return g;
}

function tentacleColorFn(t, u) {
  const c = teal.clone().lerp(purple, THREE.MathUtils.smoothstep(t, 0, 1));
  const n = 0.05 * Math.sin(t * 40.0) + 0.03 * Math.sin(u * Math.PI * 2 * 3 + t * 9);
  c.offsetHSL(0, 0.02 * Math.sin(t * 6.0), n);
  return c;
}

const NTENT = 8;
for (let i = 0; i < NTENT; i++) {
  const theta = (i / NTENT) * Math.PI * 2;
  const sign = (i % 2 === 0) ? 1 : -1;

  const reach = 2.02 + 0.14 * Math.sin(i * 1.3);
  const drop  = 1.05 + 0.08 * Math.cos(i * 0.9);
  const turns = 2.15 + 0.35 * Math.sin(i * 2.1);
  const coil0 = 0.4;
  const phase = i * 1.7;

  const N = 26;
  const pts = [];
  for (let k = 0; k <= N; k++) {
    const t = k / N;
    const curl = THREE.MathUtils.smoothstep(t, 0.12, 1.0);
    const coilR = coil0 * curl;
    const ang = phase + t * turns * Math.PI * 2;

    const x = reach * (0.04 + 0.96 * t);
    const yBase = -drop * (0.35 * t + 0.65 * t * t);
    const y = yBase - coilR * Math.cos(ang) + coilR;
    const z = sign * coilR * Math.sin(ang);

    // rotate local (x,z) around Y by theta, then offset to attachment point on head
    const wx = x * Math.cos(theta) - z * Math.sin(theta);
    const wz = x * Math.sin(theta) + z * Math.cos(theta);
    const rb = 0.66;
    pts.push(new THREE.Vector3(
      rb * Math.cos(theta) + wx,
      baseY + y,
      rb * Math.sin(theta) + wz
    ));
  }

  const radiusFn = (t) => 0.30 * (1 - t) * (1 - t) + 0.055 + 0.045 * Math.sin(t * Math.PI);
  const geo = taperedTube(pts, radiusFn, 90, 12, 3, 5.2, tentacleColorFn);
  const mesh = new THREE.Mesh(geo, yarnMat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  octopus.add(mesh);
}

// ------------------------------- eyes (glossy safety-eye buttons) ---------------
const eyeMat = new THREE.MeshPhysicalMaterial({
  color: 0x0a0a12, roughness: 0.12, metalness: 0.0,
  clearcoat: 1.0, clearcoatRoughness: 0.08, envMapIntensity: 1.0
});
const glintMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

function addEye(xOff, yOff) {
  const s = onHead(xOff, yOff);
  const n = s.clone().sub(new THREE.Vector3(0, headCenterY, 0)).normalize();

  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.17, 32, 24), eyeMat);
  eye.position.copy(s).addScaledVector(n, -0.055);
  eye.scale.set(1, 1, 0.82);
  eye.castShadow = true;
  octopus.add(eye);

  const glint = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 10), glintMat);
  glint.position.copy(s).addScaledVector(n, 0.075).add(new THREE.Vector3(-0.045, 0.055, 0.0));
  octopus.add(glint);
}
addEye(-0.40, 0.06);
addEye( 0.40, 0.06);

// ------------------------------- embroidered smile -----------------------------
{
  const M = 24;
  const mpts = [];
  for (let k = 0; k <= M; k++) {
    const sN = -1 + 2 * (k / M);
    const x = 0.34 * sN;
    const y = -0.30 + 0.15 * sN * sN;   // corners lift up -> smile
    const z2 = (R * 0.99) * (R * 0.99) - x * x - y * y;
    const z = Math.sqrt(Math.max(0.0001, z2));
    mpts.push(new THREE.Vector3(x, headCenterY + y, z + 0.005));
  }
  const smileGeo = new THREE.TubeGeometry(
    new THREE.CatmullRomCurve3(mpts), 48, 0.03, 8, false
  );
  const smileMat = new THREE.MeshStandardMaterial({
    color: 0x2c1730, roughness: 0.85, metalness: 0.0
  });
  const smile = new THREE.Mesh(smileGeo, smileMat);
  smile.castShadow = true;
  octopus.add(smile);
}

// ------------------------------- blush cheeks ----------------------------------
{
  const blushGeo = new THREE.CircleGeometry(0.15, 28);
  const blushMat = new THREE.MeshStandardMaterial({
    color: 0xff8fb0, transparent: true, opacity: 0.5, roughness: 1.0, metalness: 0.0
  });
  for (const sgn of [-1, 1]) {
    const s = onHead(sgn * 0.6, -0.12);
    const n = s.clone().sub(new THREE.Vector3(0, headCenterY, 0)).normalize();
    const m = new THREE.Mesh(blushGeo, blushMat);
    m.position.copy(s).addScaledVector(n, 0.012);
    m.lookAt(s.clone().addScaledVector(n, 1));
    octopus.add(m);
  }
}

// ---------------------------------------------------------------- resize / loop
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  octopus.position.y = 0.12 + Math.sin(t * 1.4) * 0.02; // gentle breathing
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
