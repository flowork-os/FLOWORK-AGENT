<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procedural Playground</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16181b; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------------------------------------------------------- Renderer */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

/* ------------------------------------------------------------------- Scene */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16181b);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(7.5, 5.0, 9.0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.target.set(0, 1.05, 0);
controls.minDistance = 5;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.495;

/* ---------------------------------------------------------------- Lighting */
const hemi = new THREE.HemisphereLight(0xbcd4ff, 0x4a3a28, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2d8, 2.7);
key.position.set(6.5, 9.5, 5.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 40;
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -8;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 3;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fb8ff, 0.55);
fill.position.set(-7, 4.5, -2.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 0.8);
rim.position.set(-4.5, 5.5, -8.5);
scene.add(rim);

/* ------------------------------------------------- Shadow-catcher ground */
const catcher = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.ShadowMaterial({ opacity: 0.32 })
);
catcher.rotation.x = -Math.PI / 2;
catcher.position.y = 0.05;
catcher.receiveShadow = true;
scene.add(catcher);

/* ------------------------------------------------------------- Materials */
function mat(color, o = {}) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: o.roughness ?? 0.6,
    metalness: o.metalness ?? 0.0,
    side: o.side ?? THREE.FrontSide
  });
}
const plasticRed    = mat(0xd23b2e, { roughness: 0.5 });
const plasticBlue   = mat(0x2f6fd0, { roughness: 0.5 });
const plasticYellow = mat(0xf3c11c, { roughness: 0.5 });
const plasticGreen  = mat(0x37a13f, { roughness: 0.5 });
const slideYellow   = mat(0xf3c11c, { roughness: 0.35, side: THREE.DoubleSide });
const slideRed      = mat(0xd23b2e, { roughness: 0.4,  side: THREE.DoubleSide });
const metalGrey     = mat(0x9199a3, { roughness: 0.4, metalness: 0.85 });
const chainMat      = mat(0x8b929c, { roughness: 0.45, metalness: 0.9 });
const wood          = mat(0x6f4a2a, { roughness: 0.9 });
const mulch         = mat(0xc9a86a, { roughness: 1.0 });

/* ---------------------------------------------------------------- Helpers */
function box(w, h, d, m, x, y, z) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
const _up = new THREE.Vector3(0, 1, 0);
function tube(p1, p2, radius, m, seg = 12) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(radius, radius, len, seg);
  const mesh = new THREE.Mesh(geo, m);
  mesh.position.copy(p1).add(p2).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(_up, dir.clone().normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
const V = (x, y, z) => new THREE.Vector3(x, y, z);

/* =================================================================== Build */
const playground = new THREE.Group();

/* --- Ground base (mulch / sand) --- */
const base = box(7.0, 0.2, 3.6, mulch, 0, -0.04, 0); // top at y=0.06
base.castShadow = false;
base.receiveShadow = true;
playground.add(base);

/* --- Low perimeter curb (timber) --- */
const cH = 0.20, cY = 0.16, cT = 0.16;
playground.add(box(7.16, cH, cT, wood, 0, cY,  1.8));
playground.add(box(7.16, cH, cT, wood, 0, cY, -1.8));
playground.add(box(cT, cH, 3.60, wood,  3.5, cY, 0));
playground.add(box(cT, cH, 3.60, wood, -3.5, cY, 0));

/* =========================================================== Slide tower */
const tower = new THREE.Group();
const GY = 0.06;                     // ground (mulch top) level
const deckTop = 1.20;
const cx = -2.0;                     // tower centre x
const corners = [
  [cx - 0.5, -0.5], [cx - 0.5, 0.5],
  [cx + 0.5, -0.5], [cx + 0.5, 0.5]
];
const postTop = 2.05;

// posts
for (const [px, pz] of corners) {
  tower.add(tube(V(px, GY, pz), V(px, postTop, pz), 0.05, plasticBlue));
}

// deck
tower.add(box(1.0, 0.08, 1.0, plasticGreen, cx, deckTop - 0.04, 0));

// guard rails on the two z-faces
function guard(zface) {
  const yTop = 1.55, yMid = 1.20;
  tower.add(tube(V(cx - 0.5, yTop, zface), V(cx + 0.5, yTop, zface), 0.025, plasticYellow));
  tower.add(tube(V(cx - 0.5, yMid, zface), V(cx + 0.5, yMid, zface), 0.025, plasticYellow));
  tower.add(tube(V(cx, yMid, zface), V(cx, yTop, zface), 0.022, plasticBlue));
  tower.add(tube(V(cx - 0.25, yMid, zface), V(cx - 0.25, yTop, zface), 0.02, plasticBlue));
  tower.add(tube(V(cx + 0.25, yMid, zface), V(cx + 0.25, yTop, zface), 0.02, plasticBlue));
}
guard(-0.5);
guard(0.5);

// roof (hip pyramid) + finial
const roof = new THREE.Mesh(new THREE.ConeGeometry(0.9, 0.62, 4), plasticRed);
roof.position.set(cx, postTop + 0.31, 0);
roof.rotation.y = Math.PI / 4;
roof.castShadow = true;
roof.receiveShadow = true;
tower.add(roof);
const finial = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 12), plasticYellow);
finial.position.set(cx, postTop + 0.66, 0);
finial.castShadow = true;
tower.add(finial);

// ladder (leaning, on the back / -x face)
{
  const bL = V(-2.78, GY, -0.33), tL = V(-2.52, 1.34, -0.33);
  const bR = V(-2.78, GY,  0.33), tR = V(-2.52, 1.34,  0.33);
  tower.add(tube(bL, tL, 0.03, plasticBlue));
  tower.add(tube(bR, tR, 0.03, plasticBlue));
  for (const t of [0.10, 0.27, 0.44, 0.61, 0.78, 0.95]) {
    const pL = new THREE.Vector3().lerpVectors(bL, tL, t);
    const pR = new THREE.Vector3().lerpVectors(bR, tR, t);
    tower.add(tube(pL, pR, 0.022, plasticYellow, 10));
  }
}

// curved slide (extruded side-silhouette swept in Z)
{
  const ctrl = [
    V(-1.50, 1.24, 0), V(-1.28, 1.20, 0), V(-0.98, 1.00, 0),
    V(-0.55, 0.68, 0), V(-0.05, 0.42, 0), V( 0.45, 0.29, 0),
    V( 0.90, 0.245, 0), V( 1.25, 0.235, 0)
  ];
  const curve = new THREE.CatmullRomCurve3(ctrl, false, 'centripetal');
  const pts = curve.getPoints(90);
  const width = 0.62;

  // bed slab
  const thick = 0.06;
  const bedShape = new THREE.Shape();
  bedShape.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) bedShape.lineTo(pts[i].x, pts[i].y);
  for (let i = pts.length - 1; i >= 0; i--) bedShape.lineTo(pts[i].x, pts[i].y - thick);
  bedShape.closePath();
  const bedGeo = new THREE.ExtrudeGeometry(bedShape, { depth: width, bevelEnabled: false, steps: 1 });
  bedGeo.translate(0, 0, -width / 2);
  const bed = new THREE.Mesh(bedGeo, slideYellow);
  bed.castShadow = true; bed.receiveShadow = true;
  tower.add(bed);

  // side rails
  const railH = 0.14, railW = 0.06;
  const railShape = new THREE.Shape();
  railShape.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) railShape.lineTo(pts[i].x, pts[i].y);
  for (let i = pts.length - 1; i >= 0; i--) railShape.lineTo(pts[i].x, pts[i].y + railH);
  railShape.closePath();
  const railGeo = new THREE.ExtrudeGeometry(railShape, { depth: railW, bevelEnabled: false, steps: 1 });
  const railA = new THREE.Mesh(railGeo, slideRed);
  railA.position.z = width / 2 - railW;
  railA.castShadow = true; railA.receiveShadow = true;
  const railB = new THREE.Mesh(railGeo, slideRed);
  railB.position.z = -width / 2;
  railB.castShadow = true; railB.receiveShadow = true;
  tower.add(railA, railB);
}
playground.add(tower);

/* ============================================================ Swing set */
const swings = new THREE.Group();
const sx = 2.0;                    // swing centre x
const beamY = 2.10;
const beamZ = 1.2;

// top beam
swings.add(tube(V(sx, beamY, -beamZ), V(sx, beamY, beamZ), 0.05, plasticRed));

// A-frames at both ends
for (const zEnd of [-beamZ, beamZ]) {
  swings.add(tube(V(sx, beamY, zEnd), V(sx - 0.78, GY, zEnd), 0.045, plasticBlue));
  swings.add(tube(V(sx, beamY, zEnd), V(sx + 0.78, GY, zEnd), 0.045, plasticBlue));
}

// individual swing (built in a pivoted local frame)
function buildSwing(zc, angle) {
  const g = new THREE.Group();
  g.position.set(sx, beamY, zc);
  g.rotation.z = angle;
  const chainTopY = -0.05;
  const seatY = -1.55;
  const dz = 0.16;
  g.add(tube(V(0, chainTopY, -dz), V(0, seatY + 0.03, -dz), 0.012, chainMat, 8));
  g.add(tube(V(0, chainTopY,  dz), V(0, seatY + 0.03,  dz), 0.012, chainMat, 8));
  g.add(box(0.16, 0.04, 0.36, plasticBlue, 0, seatY, 0));
  return g;
}
swings.add(buildSwing(-0.55, 0.20));
swings.add(buildSwing( 0.55, -0.13));
playground.add(swings);

/* ----------------------------------------------------- Centre the object */
scene.add(playground);
{
  const bb = new THREE.Box3().setFromObject(playground);
  const c = new THREE.Vector3();
  bb.getCenter(c);
  playground.position.x -= c.x;
  playground.position.z -= c.z;
}

/* ------------------------------------------------------------------- Loop */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
