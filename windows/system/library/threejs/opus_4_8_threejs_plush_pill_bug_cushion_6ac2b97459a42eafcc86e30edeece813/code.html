<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plush Pill Bug</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #17181c; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: rgba(235,232,240,0.42); letter-spacing: 0.09em; text-transform: uppercase;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="hint">Plush Pill Bug &nbsp;·&nbsp; drag to orbit &nbsp;·&nbsp; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   Renderer / Scene / Camera
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1b20);
scene.fog = new THREE.Fog(0x1a1b20, 1.6, 6.2);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(0.62, 0.44, 0.86);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.minDistance = 0.42;
controls.maxDistance = 3.2;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 0.105, 0);

/* ============================================================
   Lighting : hemisphere ambience + key / fill / rim
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xd9dcea, 0x3a3340, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3e6, 2.35);
key.position.set(0.75, 1.15, 0.72);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.1;
key.shadow.camera.far = 6;
key.shadow.camera.left = -0.7;
key.shadow.camera.right = 0.7;
key.shadow.camera.top = 0.7;
key.shadow.camera.bottom = -0.7;
key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.011;
key.shadow.radius = 3.2;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbfc9e8, 0.62);
fill.position.set(-0.95, 0.42, 0.55);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xe6d5ff, 1.15);
rim.position.set(-0.35, 0.62, -1.05);
scene.add(rim);

const bounce = new THREE.PointLight(0xffe8d8, 0.30, 2.4, 2.0);
bounce.position.set(0.12, -0.06, 0.42);
scene.add(bounce);

/* ============================================================
   Ground : shadow-only catcher + a soft dark disc for grounding
   ============================================================ */
const shadowFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(8, 8),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
shadowFloor.rotation.x = -Math.PI / 2;
shadowFloor.position.y = 0;
shadowFloor.receiveShadow = true;
scene.add(shadowFloor);

const backdropDisc = new THREE.Mesh(
  new THREE.CircleGeometry(2.4, 96),
  new THREE.MeshStandardMaterial({ color: 0x24242b, roughness: 1.0, metalness: 0.0 })
);
backdropDisc.rotation.x = -Math.PI / 2;
backdropDisc.position.y = -0.0015;
backdropDisc.receiveShadow = true;
scene.add(backdropDisc);

/* ============================================================
   Fabric texture helpers (procedural canvas textures)
   ============================================================ */
function makeCanvas(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  return c;
}

// Deterministic pseudo-random
let _seed = 1337;
function rnd() {
  _seed = (_seed * 1664525 + 1013904223) % 4294967296;
  return _seed / 4294967296;
}

/** Fuzzy minky-fleece bump/roughness map: soft fiber speckle + faint nap streaks. */
function makeFuzzTexture(size = 512, density = 26000, strength = 0.55) {
  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#808080';
  ctx.fillRect(0, 0, size, size);

  // fiber loft: thousands of tiny soft dots
  for (let i = 0; i < density; i++) {
    const x = rnd() * size;
    const y = rnd() * size;
    const r = 0.6 + rnd() * 2.2;
    const v = rnd();
    const shade = v > 0.5 ? 255 : 0;
    const a = 0.035 + rnd() * 0.075 * strength;
    ctx.fillStyle = `rgba(${shade},${shade},${shade},${a})`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // gentle nap streaks (fleece direction)
  ctx.lineCap = 'round';
  for (let i = 0; i < 900; i++) {
    const x = rnd() * size;
    const y = rnd() * size;
    const len = 4 + rnd() * 16;
    const ang = (-0.35 + rnd() * 0.7);
    const shade = rnd() > 0.5 ? 235 : 25;
    ctx.strokeStyle = `rgba(${shade},${shade},${shade},${0.03 + rnd() * 0.05})`;
    ctx.lineWidth = 0.7 + rnd() * 1.4;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    ctx.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

/** Slightly coarser weave for felt parts (legs / antennae). */
function makeFeltTexture(size = 256) {
  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#808080';
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < 9000; i++) {
    const x = rnd() * size, y = rnd() * size;
    const shade = rnd() > 0.5 ? 255 : 0;
    ctx.fillStyle = `rgba(${shade},${shade},${shade},${0.05 + rnd() * 0.11})`;
    ctx.fillRect(x, y, 1 + rnd() * 2, 1 + rnd() * 2);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

const fuzzTex = makeFuzzTexture(512, 30000, 0.6);
fuzzTex.repeat.set(3, 3);
const fuzzTexFine = makeFuzzTexture(512, 22000, 0.42);
fuzzTexFine.repeat.set(4, 4);
const feltTex = makeFeltTexture(256);
feltTex.repeat.set(2, 2);

/* ============================================================
   Materials
   ============================================================ */
const SHELL_COLOR   = 0x9aa0ad; // dove grey minky fleece
const SHELL_DEEP    = 0x848a99;
const BELLY_COLOR   = 0xb9a6c6; // heather lilac
const CREAM         = 0xf2e9d8; // contrasting topstitch
const FELT_LEG      = 0xc7b2cf;

function shellMaterial(color, rough = 0.96) {
  const m = new THREE.MeshPhysicalMaterial({
    color: color,
    roughness: rough,
    metalness: 0.0,
    sheen: 1.0,
    sheenRoughness: 0.82,
    sheenColor: new THREE.Color(0xf0eef7),
    clearcoat: 0.0,
    bumpMap: fuzzTex,
    bumpScale: 0.0035,
    roughnessMap: fuzzTexFine,
    flatShading: false
  });
  return m;
}

const matShell      = shellMaterial(SHELL_COLOR, 0.95);
const matShellAlt   = shellMaterial(SHELL_DEEP, 0.97);
const matBelly      = (() => {
  const m = shellMaterial(BELLY_COLOR, 0.99);
  m.sheenColor = new THREE.Color(0xf6ecff);
  m.bumpScale = 0.0028;
  return m;
})();

const matHead = shellMaterial(0xa3a8b5, 0.94);

const matFelt = new THREE.MeshPhysicalMaterial({
  color: FELT_LEG,
  roughness: 1.0,
  metalness: 0.0,
  sheen: 0.7,
  sheenRoughness: 0.95,
  sheenColor: new THREE.Color(0xf2e9f7),
  bumpMap: feltTex,
  bumpScale: 0.0022
});

const matThread = new THREE.MeshStandardMaterial({
  color: CREAM,
  roughness: 0.72,
  metalness: 0.0
});

const matEye = new THREE.MeshPhysicalMaterial({
  color: 0x2b2430,
  roughness: 0.42,
  metalness: 0.0,
  sheen: 0.6,
  sheenColor: new THREE.Color(0x6b5f74),
  clearcoat: 0.35,
  clearcoatRoughness: 0.55
});

/* ============================================================
   Pill bug construction
   --------------------------------------------------------
   The body is a curled tube: a "spine" curve in the XY plane
   that starts flat-ish at the head and curls upward/back so the
   creature reads as half-curled. Eight armour bands ride along
   that spine as thick, cross-sectionally-rounded shells.
   ============================================================ */

const bug = new THREE.Group();
scene.add(bug);

// ---- Spine ----------------------------------------------------
// Parameter t in [0,1]: 0 = head end, 1 = tail (telson) end.
// Curl: heading angle sweeps from slightly nose-down to strongly
// curled back and over, producing a comma/half-roll silhouette.

const SPINE_LEN = 0.62;          // arc length of body
const CURL_TOTAL = Math.PI * 1.02; // just over half a turn -> "half curled"

function spineAngle(t) {
  // ease-in curl: nearly straight at the head, tightening toward tail
  const e = t * t * (3 - 2 * t);          // smoothstep
  return -0.30 + CURL_TOTAL * (0.30 * t + 0.70 * e);
}

// integrate to get spine points
const SPINE_SAMPLES = 400;
const spinePts = [];
{
  let x = 0, y = 0;
  const ds = SPINE_LEN / SPINE_SAMPLES;
  for (let i = 0; i <= SPINE_SAMPLES; i++) {
    const t = i / SPINE_SAMPLES;
    spinePts.push(new THREE.Vector3(x, y, 0));
    const a = spineAngle(t);
    x += Math.cos(a) * ds;
    y += Math.sin(a) * ds;
  }
}
// re-center so the body sits nicely around origin
{
  const box = new THREE.Box3().setFromPoints(spinePts);
  const c = new THREE.Vector3();
  box.getCenter(c);
  for (const p of spinePts) { p.x -= c.x; p.y -= c.y; }
}
const spineCurve = new THREE.CatmullRomCurve3(spinePts, false, 'catmullrom', 0.5);

function spinePoint(t) {
  return spineCurve.getPointAt(THREE.MathUtils.clamp(t, 0, 1));
}
function spineTangent(t) {
  return spineCurve.getTangentAt(THREE.MathUtils.clamp(t, 0, 1)).normalize();
}
// "up" (outward, shell side) is tangent rotated +90deg in XY
function spineNormal(t) {
  const tg = spineTangent(t);
  return new THREE.Vector3(-tg.y, tg.x, 0).normalize();
}

// ---- Body width / height profile -------------------------------
// Pudgy: widest around t=0.32, tapering to a rounded tail.
function halfWidth(t) {
  const w = 0.128 * Math.pow(Math.sin(Math.PI * Math.pow(THREE.MathUtils.clamp(t, 0, 1), 0.72)), 0.62);
  return Math.max(w, 0.012);
}
function shellRise(t) {
  // how tall the domed armour sits above the spine
  const s = Math.sin(Math.PI * Math.pow(THREE.MathUtils.clamp(t, 0, 1), 0.68));
  return 0.030 + 0.062 * Math.pow(Math.max(s, 0), 0.75);
}
function bellyDrop(t) {
  const s = Math.sin(Math.PI * Math.pow(THREE.MathUtils.clamp(t, 0, 1), 0.70));
  return 0.020 + 0.036 * Math.pow(Math.max(s, 0), 0.8);
}

/* ------------------------------------------------------------
   Band geometry builder.

   For a band spanning [t0,t1] we build a closed-ish shell:
   a grid over (u along body, v around cross-section). The
   cross-section is a superellipse-ish rounded arc from one
   lateral edge, over the top, to the other lateral edge — plus
   a slightly tucked bottom lip so the band reads as a padded,
   stuffed cushion piece rather than a paper strip.
   ------------------------------------------------------------ */

function crossSection(v, hw, rise, drop, puff) {
  // v in [0,1] goes: right lower lip -> right side -> top -> left side -> left lower lip
  const ang = -Math.PI * 0.16 + v * (Math.PI * 1.32); // slightly past horizontal on both sides
  const ca = Math.cos(ang), sa = Math.sin(ang);
  // superellipse blend for a soft, cushiony section
  const n = 2.35 + puff * 0.9;
  const ax = Math.sign(ca) * Math.pow(Math.abs(ca), 2 / n);
  const ay = Math.sign(sa) * Math.pow(Math.abs(sa), 2 / n);
  const lateral = ax * hw;
  const vertical = ay >= 0 ? ay * rise : ay * drop;
  return { lateral, vertical };
}

function buildBandGeometry(t0, t1, opts) {
  const US = opts.us || 26;
  const VS = opts.vs || 40;
  const inflate = opts.inflate !== undefined ? opts.inflate : 1.0;
  const widen = opts.widen !== undefined ? opts.widen : 1.0;
  const pucker = opts.pucker !== undefined ? opts.pucker : 1.0;
  const liftEnd = opts.liftEnd !== undefined ? opts.liftEnd : 0.0;

  const positions = [];
  const normals = [];
  const uvs = [];
  const indices = [];

  const gridRows = US + 1;
  const gridCols = VS + 1;

  // helper: point on band surface
  const P = new Array(gridRows);
  for (let i = 0; i < gridRows; i++) P[i] = new Array(gridCols);

  for (let i = 0; i < gridRows; i++) {
    const u = i / US;
    const t = THREE.MathUtils.lerp(t0, t1, u);
    const base = spinePoint(t);
    const tan = spineTangent(t);
    const nrm = spineNormal(t);          // "up" from spine
    const side = new THREE.Vector3(0, 0, 1); // lateral axis (z)

    // Overlapping band: the leading edge (u=0) tucks slightly under the
    // previous band; the trailing edge (u=1) flares out a touch. This creates
    // the classic segmented-armour overlap.
    const overlapTuck = Math.pow(1 - u, 2.4);
    const flare = Math.pow(u, 2.6);

    const hw = halfWidth(t) * widen * (1 + 0.055 * flare - 0.075 * overlapTuck);
    const rise = shellRise(t) * inflate * (1 + 0.10 * flare - 0.16 * overlapTuck) + liftEnd * flare;
    const drop = bellyDrop(t) * (1 + 0.05 * flare - 0.10 * overlapTuck);

    // puff amount peaks mid-band (stuffed pillow between two seams)
    const puff = Math.sin(Math.PI * u);

    for (let j = 0; j < gridCols; j++) {
      const v = j / VS;
      const cs = crossSection(v, hw, rise, drop, puff * 0.9);

      // seam puckering: gentle scalloping around the section, strongest at seams
      const seamNear = Math.pow(Math.max(0, 1 - Math.min(u, 1 - u) * 5.2), 2.0);
      const ripple = Math.sin(v * Math.PI * 9.0) * 0.0016 * seamNear * pucker;
      // stuffing bulge across the band
      const bulge = 1.0 + 0.055 * puff;

      const lat = cs.lateral * bulge + ripple * 0.6;
      const vert = cs.vertical * bulge + ripple;

      const p = new THREE.Vector3()
        .copy(base)
        .addScaledVector(nrm, vert)
        .addScaledVector(side, lat);

      // tiny along-body loft wobble so nothing looks CAD-perfect
      p.addScaledVector(tan, Math.sin(v * Math.PI * 5.0 + u * 3.1) * 0.0009 * pucker);

      P[i][j] = p;
    }
  }

  for (let i = 0; i < gridRows; i++) {
    for (let j = 0; j < gridCols; j++) {
      const p = P[i][j];
      positions.push(p.x, p.y, p.z);
      uvs.push(j / VS, i / US);
    }
  }

  for (let i = 0; i < US; i++) {
    for (let j = 0; j < VS; j++) {
      const a = i * gridCols + j;
      const b = a + 1;
      const c = a + gridCols;
      const d = c + 1;
      indices.push(a, c, b);
      indices.push(b, c, d);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return { geo, grid: P, gridRows, gridCols };
}

/* ---- Band layout: 8 overlapping fabric bands -------------------- */
const BAND_COUNT = 8;
const BODY_T0 = 0.075;   // head occupies the very front
const BODY_T1 = 0.985;

const bands = [];
for (let k = 0; k < BAND_COUNT; k++) {
  const a = k / BAND_COUNT;
  const b = (k + 1) / BAND_COUNT;
  // overlap: each band extends past its nominal end
  const t0 = THREE.MathUtils.lerp(BODY_T0, BODY_T1, a) - (k === 0 ? 0 : 0.016);
  const t1 = THREE.MathUtils.lerp(BODY_T0, BODY_T1, b) + (k === BAND_COUNT - 1 ? 0 : 0.020);
  bands.push({ t0: THREE.MathUtils.clamp(t0, 0, 1), t1: THREE.MathUtils.clamp(t1, 0, 1), index: k });
}

const shellGroup = new THREE.Group();
bug.add(shellGroup);

const bandRecords = [];

bands.forEach((band, k) => {
  const alt = k % 2 === 0;
  const built = buildBandGeometry(band.t0, band.t1, {
    us: 30,
    vs: 46,
    inflate: 1.0 + 0.015 * Math.sin(k * 1.7),
    widen: 1.0,
    pucker: 1.0,
    liftEnd: 0.0016
  });
  const mat = alt ? matShell : matShellAlt;
  const mesh = new THREE.Mesh(built.geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  shellGroup.add(mesh);
  bandRecords.push({ band, built, mesh });
});

/* ============================================================
   Belly / underside : soft heather-lilac stuffed underbody
   ============================================================ */
{
  const US = 130, VS = 34;
  const positions = [], uvs = [], indices = [];
  const rows = US + 1, cols = VS + 1;

  for (let i = 0; i < rows; i++) {
    const u = i / US;
    const t = THREE.MathUtils.lerp(BODY_T0 - 0.03, BODY_T1, u);
    const base = spinePoint(t);
    const nrm = spineNormal(t);
    const side = new THREE.Vector3(0, 0, 1);
    const hw = halfWidth(t) * 0.965;
    const drop = bellyDrop(t) * 1.02;

    for (let j = 0; j < cols; j++) {
      const v = j / VS;
      // arc from right lip, under the belly, to left lip
      const ang = Math.PI * (-0.13) - v * (Math.PI * 0.74);
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const n = 2.5;
      const ax = Math.sign(ca) * Math.pow(Math.abs(ca), 2 / n);
      const ay = Math.sign(sa) * Math.pow(Math.abs(sa), 2 / n);
      const lat = ax * hw;
      const vert = ay * drop;
      // soft stuffing pucker
      const rip = Math.sin(v * Math.PI * 7.0 + u * 6.0) * 0.0009;
      const p = new THREE.Vector3()
        .copy(base)
        .addScaledVector(nrm, vert + rip)
        .addScaledVector(side, lat);
      positions.push(p.x, p.y, p.z);
      uvs.push(v, u);
    }
  }
  for (let i = 0; i < US; i++) {
    for (let j = 0; j < VS; j++) {
      const a = i * cols + j, b = a + 1, c = a + cols, d = c + 1;
      indices.push(a, b, c);
      indices.push(b, d, c);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const belly = new THREE.Mesh(geo, matBelly);
  belly.castShadow = true;
  belly.receiveShadow = true;
  bug.add(belly);
}

/* ============================================================
   Head : rounded plush cephalon at the front of the body
   ============================================================ */
const headGroup = new THREE.Group();
bug.add(headGroup);

const headT = 0.052;
const headPos = spinePoint(headT);
const headTan = spineTangent(headT);
const headNrm = spineNormal(headT);
{
  const m = new THREE.Matrix4();
  const zAxis = new THREE.Vector3(0, 0, 1);
  const xAxis = headTan.clone();
  const yAxis = headNrm.clone();
  m.makeBasis(xAxis, yAxis, zAxis);
  headGroup.quaternion.setFromRotationMatrix(m);
  headGroup.position.copy(headPos);
}

const headW = halfWidth(headT + 0.02) * 1.02;
const headGeo = new THREE.SphereGeometry(1, 56, 40);
{
  const pos = headGeo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    // squash into a wide, low plush head; flatten the front face slightly
    const sx = 0.062, sy = 0.050, sz = headW * 1.02;
    v.set(v.x * sx, v.y * sy, v.z * sz);
    // flatten front (positive x) to give a "sewn face panel"
    if (v.x > 0) v.x *= 1.0 - 0.20 * (v.x / sx);
    // fabric loft wobble
    const w = Math.sin(v.z * 52) * Math.cos(v.y * 46) * 0.0008;
    v.multiplyScalar(1 + w * 6);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  headGeo.computeVertexNormals();
}
const headMesh = new THREE.Mesh(headGeo, matHead);
headMesh.position.set(0.028, -0.006, 0);
headMesh.castShadow = true;
headMesh.receiveShadow = true;
headGroup.add(headMesh);

// small brow band across the head (a sewn strip, matches the shell bands)
{
  const browGeo = new THREE.TorusGeometry(0.049, 0.0125, 14, 40, Math.PI * 1.06);
  const brow = new THREE.Mesh(browGeo, matShell);
  brow.rotation.y = Math.PI / 2;
  brow.rotation.x = Math.PI * 0.5;
  brow.rotation.z = 0;
  brow.position.set(0.006, 0.006, 0);
  brow.scale.set(1.0, 1.0, 1.18);
  brow.castShadow = true;
  brow.receiveShadow = true;
  headGroup.add(brow);
}

/* ---- Embroidered dot eyes ---- */
function makeEye(zSign) {
  const g = new THREE.Group();
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.0092, 22, 16), matEye);
  eye.scale.set(0.78, 1.0, 1.0);
  eye.castShadow = false;
  eye.receiveShadow = false;
  g.add(eye);

  // tiny embroidery satin-stitch ring around the dot
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.0098, 0.0016, 8, 22), matThread);
  ring.rotation.y = Math.PI / 2;
  ring.position.x = -0.001;
  g.add(ring);

  // catchlight
  const spark = new THREE.Mesh(
    new THREE.SphereGeometry(0.0026, 12, 10),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.35, emissive: 0x8f8fa0, emissiveIntensity: 0.3 })
  );
  spark.position.set(0.0055, 0.0035, 0.0022 * zSign);
  g.add(spark);

  g.position.set(0.0455, 0.0125, zSign * headW * 0.60);
  g.rotation.z = -0.16;
  g.rotation.y = zSign * 0.42;
  return g;
}
headGroup.add(makeEye(1));
headGroup.add(makeEye(-1));

// blush patches (soft felt discs)
function makeBlush(zSign) {
  const m = new THREE.MeshStandardMaterial({
    color: 0xd8a8b4, roughness: 1.0, metalness: 0.0, transparent: true, opacity: 0.42
  });
  const b = new THREE.Mesh(new THREE.CircleGeometry(0.0125, 24), m);
  b.position.set(0.0405, -0.006, zSign * headW * 0.74);
  b.rotation.y = Math.PI * 0.5 * zSign * 0.86;
  b.lookAt(new THREE.Vector3(0.30, -0.02, zSign * 0.30));
  return b;
}
headGroup.add(makeBlush(1));
headGroup.add(makeBlush(-1));

/* ---- Antennae : little felt tapered rods ---- */
function makeAntenna(zSign) {
  const g = new THREE.Group();
  const pts = [];
  for (let i = 0; i <= 12; i++) {
    const s = i / 12;
    pts.push(new THREE.Vector3(
      s * 0.052,
      0.004 + Math.sin(s * 1.5) * 0.012 - s * s * 0.004,
      zSign * (0.010 + s * 0.030)
    ));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const tubeGeo = new THREE.TubeGeometry(curve, 26, 0.0055, 10, false);
  // taper
  {
    const pos = tubeGeo.attributes.position;
    const v = new THREE.Vector3();
    const count = pos.count;
    const segs = 27; // tubularSegments + 1
    const radial = 11; // radialSegments + 1
    for (let i = 0; i < count; i++) {
      const seg = Math.floor(i / radial);
      const s = seg / (segs - 1);
      v.fromBufferAttribute(pos, i);
      const c = curve.getPointAt(Math.min(s, 1));
      const scale = 1.0 - 0.62 * s;
      v.sub(c).multiplyScalar(scale).add(c);
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    tubeGeo.computeVertexNormals();
  }
  const tube = new THREE.Mesh(tubeGeo, matFelt);
  tube.castShadow = true;
  g.add(tube);

  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.0035, 12, 10), matFelt);
  tip.position.copy(curve.getPointAt(1));
  g.add(tip);

  g.position.set(0.030, 0.006, 0);
  return g;
}
headGroup.add(makeAntenna(1));
headGroup.add(makeAntenna(-1));

/* ============================================================
   Topstitching : cream running stitch along every seam
   ------------------------------------------------------------
   Each seam is the cross-section curve at a given t; we place
   short capsule "stitches" tangentially along it with gaps.
   ============================================================ */

const stitchGeoCache = new Map();
function stitchGeometry(len) {
  const key = len.toFixed(4);
  if (!stitchGeoCache.has(key)) {
    const g = new THREE.CapsuleGeometry(0.00165, len, 4, 8);
    g.rotateZ(Math.PI / 2); // align along local X
    stitchGeoCache.set(key, g);
  }
  return stitchGeoCache.get(key);
}

function stitchLineFromPoints(points, opts) {
  // points: array of Vector3 forming a polyline; place dashes along it
  const stitchLen = opts.stitchLen || 0.011;
  const gap = opts.gap || 0.0085;
  const lift = opts.lift || 0.0016;
  const centersOut = [];

  // build cumulative lengths
  const segLen = [];
  let total = 0;
  for (let i = 0; i < points.length - 1; i++) {
    const d = points[i].distanceTo(points[i + 1]);
    segLen.push(d);
    total += d;
  }
  if (total < 1e-5) return [];

  const period = stitchLen + gap;
  const n = Math.max(1, Math.floor(total / period));
  const actualPeriod = total / n;

  function pointAtLen(L) {
    let acc = 0;
    for (let i = 0; i < segLen.length; i++) {
      if (acc + segLen[i] >= L) {
        const f = segLen[i] > 1e-9 ? (L - acc) / segLen[i] : 0;
        const p = new THREE.Vector3().lerpVectors(points[i], points[i + 1], f);
        const dir = new THREE.Vector3().subVectors(points[i + 1], points[i]).normalize();
        return { p, dir };
      }
      acc += segLen[i];
    }
    const last = points[points.length - 1];
    const dir = new THREE.Vector3().subVectors(points[points.length - 1], points[points.length - 2]).normalize();
    return { p: last.clone(), dir };
  }

  for (let i = 0; i < n; i++) {
    const L = (i + 0.5) * actualPeriod;
    const { p, dir } = pointAtLen(L);
    if (!isFinite(dir.x) || dir.lengthSq() < 1e-9) continue;
    centersOut.push({ p, dir, lift });
  }
  return centersOut;
}

// Build seam polylines from the band grids (edge rows) and along the sides.
const stitchInstances = [];

function outwardAt(p) {
  // approximate outward direction: from nearest spine point to p
  // (cheap: use the XY component from the body center + lateral)
  return null;
}

bandRecords.forEach((rec, k) => {
  const { built, band } = rec;
  const { grid, gridRows, gridCols } = built;

  // --- leading seam (row 0) and trailing seam (last row): across the shell
  const seamRows = [];
  if (k > 0) seamRows.push(1);
  seamRows.push(gridRows - 2);

  seamRows.forEach((rowIdx) => {
    const pts = [];
    // limit to the visible upper arc (skip the tucked-under lips)
    const j0 = Math.round(gridCols * 0.07);
    const j1 = Math.round(gridCols * 0.93);
    for (let j = j0; j <= j1; j++) pts.push(grid[rowIdx][j].clone());
    // push stitches slightly outward along their local surface normal
    const centers = stitchLineFromPoints(pts, { stitchLen: 0.0105, gap: 0.0082 });
    centers.forEach(c => {
      // outward normal approximated from the cross-section center
      const t = THREE.MathUtils.lerp(band.t0, band.t1, rowIdx / (gridRows - 1));
      const base = spinePoint(t);
      const outward = new THREE.Vector3().subVectors(c.p, base).normalize();
      stitchInstances.push({ p: c.p.clone().addScaledVector(outward, 0.0022), dir: c.dir, len: 0.0105 });
    });
  });

  // --- lateral edge topstitch running along the band's side hems
  [Math.round(gridCols * 0.045), Math.round(gridCols * 0.955)].forEach((colIdx) => {
    const pts = [];
    for (let i = 1; i < gridRows - 1; i++) pts.push(grid[i][colIdx].clone());
    const centers = stitchLineFromPoints(pts, { stitchLen: 0.0085, gap: 0.0075 });
    centers.forEach(c => {
      const idxT = 0.5;
      const t = THREE.MathUtils.lerp(band.t0, band.t1, idxT);
      const base = spinePoint(t);
      const outward = new THREE.Vector3().subVectors(c.p, base).normalize();
      stitchInstances.push({ p: c.p.clone().addScaledVector(outward, 0.0020), dir: c.dir, len: 0.0085 });
    });
  });
});

// Head seam: a centre-back stitch line over the head crown
{
  const pts = [];
  for (let i = 0; i <= 24; i++) {
    const s = i / 24;
    const ang = Math.PI * (0.02 + s * 0.9);
    const localX = Math.cos(ang) * 0.062 * 0.94;
    const localY = Math.sin(ang) * 0.050 * 0.99;
    const p = new THREE.Vector3(localX + 0.028, localY - 0.006, 0);
    p.applyQuaternion(headGroup.quaternion).add(headGroup.position);
    pts.push(p);
  }
  const centers = stitchLineFromPoints(pts, { stitchLen: 0.0085, gap: 0.0072 });
  centers.forEach(c => {
    stitchInstances.push({ p: c.p, dir: c.dir, len: 0.0085 });
  });
}

// Belly hem topstitch: runs along both lower lateral edges of the underside
[1, -1].forEach((zSign) => {
  const pts = [];
  for (let i = 0; i <= 90; i++) {
    const u = i / 90;
    const t = THREE.MathUtils.lerp(BODY_T0 - 0.01, BODY_T1 - 0.01, u);
    const base = spinePoint(t);
    const nrm = spineNormal(t);
    const side = new THREE.Vector3(0, 0, 1);
    const hw = halfWidth(t) * 0.90;
    const drop = bellyDrop(t) * 0.62;
    const p = new THREE.Vector3().copy(base)
      .addScaledVector(nrm, -drop * 0.55)
      .addScaledVector(side, zSign * hw);
    pts.push(p);
  }
  const centers = stitchLineFromPoints(pts, { stitchLen: 0.0095, gap: 0.0080 });
  centers.forEach(c => {
    stitchInstances.push({ p: c.p, dir: c.dir, len: 0.0095 });
  });
});

// Instance all the stitches efficiently, grouped by length
{
  const byLen = new Map();
  stitchInstances.forEach(s => {
    const k = s.len.toFixed(4);
    if (!byLen.has(k)) byLen.set(k, []);
    byLen.get(k).push(s);
  });

  const dummy = new THREE.Object3D();
  const xAxis = new THREE.Vector3(1, 0, 0);
  byLen.forEach((list, k) => {
    const len = parseFloat(k);
    const geo = stitchGeometry(len);
    const im = new THREE.InstancedMesh(geo, matThread, list.length);
    im.castShadow = true;
    im.receiveShadow = false;
    list.forEach((s, i) => {
      dummy.position.copy(s.p);
      const d = s.dir.clone();
      if (d.lengthSq() < 1e-9) d.set(1, 0, 0);
      d.normalize();
      dummy.quaternion.setFromUnitVectors(xAxis, d);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      im.setMatrixAt(i, dummy.matrix);
    });
    im.instanceMatrix.needsUpdate = true;
    bug.add(im);
  });
}

/* ============================================================
   Legs : tiny felt nubs in a neat row underneath
   ============================================================ */
const legsGroup = new THREE.Group();
bug.add(legsGroup);

const LEG_PAIRS = 7;
function makeLeg(t, zSign, index) {
  const base = spinePoint(t);
  const nrm = spineNormal(t);          // outward (shell) direction
  const tan = spineTangent(t);
  const side = new THREE.Vector3(0, 0, 1);

  const hw = halfWidth(t) * 0.80;
  const drop = bellyDrop(t) * 0.86;

  const attach = new THREE.Vector3().copy(base)
    .addScaledVector(nrm, -drop * 0.72)
    .addScaledVector(side, zSign * hw * 0.82);

  // leg direction: downward-outward relative to the body
  const down = nrm.clone().multiplyScalar(-1);
  const outDir = new THREE.Vector3()
    .addScaledVector(down, 0.80)
    .addScaledVector(side, zSign * 0.62)
    .addScaledVector(tan, -0.10)
    .normalize();

  const legLen = 0.036 + 0.006 * Math.sin(index * 1.3);
  const pts = [];
  for (let i = 0; i <= 8; i++) {
    const s = i / 8;
    const p = new THREE.Vector3().copy(attach)
      .addScaledVector(outDir, legLen * s)
      // slight inward curl of the little felt foot
      .addScaledVector(down, legLen * 0.30 * s * s)
      .addScaledVector(tan, -legLen * 0.10 * s * s);
    pts.push(p);
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const geo = new THREE.TubeGeometry(curve, 14, 0.0068, 9, false);

  // taper toward the foot
  {
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    const radial = 10;
    const segs = 15;
    for (let i = 0; i < pos.count; i++) {
      const seg = Math.floor(i / radial);
      const s = Math.min(seg / (segs - 1), 1);
      v.fromBufferAttribute(pos, i);
      const c = curve.getPointAt(s);
      const scale = 1.06 - 0.42 * s;
      v.sub(c).multiplyScalar(scale).add(c);
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();
  }

  const g = new THREE.Group();
  const mesh = new THREE.Mesh(geo, matFelt);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  g.add(mesh);

  const foot = new THREE.Mesh(new THREE.SphereGeometry(0.0052, 14, 12), matFelt);
  foot.position.copy(curve.getPointAt(1));
  foot.scale.set(1.25, 0.85, 1.0);
  foot.castShadow = true;
  foot.receiveShadow = true;
  g.add(foot);

  return g;
}

for (let i = 0; i < LEG_PAIRS; i++) {
  const t = THREE.MathUtils.lerp(0.115, 0.66, i / (LEG_PAIRS - 1));
  legsGroup.add(makeLeg(t, 1, i));
  legsGroup.add(makeLeg(t, -1, i));
}

/* ============================================================
   Tail plate (telson) : final small rounded plush cap
   ============================================================ */
{
  const tT = 0.985;
  const base = spinePoint(tT);
  const tan = spineTangent(tT);
  const nrm = spineNormal(tT);
  const geo = new THREE.SphereGeometry(1, 32, 24);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    v.set(v.x * 0.022, v.y * 0.030, v.z * halfWidth(tT) * 1.10);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, matShellAlt);
  const mtx = new THREE.Matrix4().makeBasis(tan.clone(), nrm.clone(), new THREE.Vector3(0, 0, 1));
  m.quaternion.setFromRotationMatrix(mtx);
  m.position.copy(base).addScaledVector(nrm, 0.004);
  m.castShadow = true;
  m.receiveShadow = true;
  bug.add(m);
}

/* ============================================================
   Fiber loft : a fine halo of short fuzz strands over the shell
   (sampled from the band grids, drawn as thin tapered spikes)
   ============================================================ */
{
  const fuzzMat = new THREE.MeshStandardMaterial({
    color: 0xb6bcc9,
    roughness: 1.0,
    metalness: 0.0,
    transparent: true,
    opacity: 0.34,
    depthWrite: false,
    side: THREE.DoubleSide
  });

  const positions = [];
  const strandCount = 2600;
  const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tmpC = new THREE.Vector3();
  const nrmTmp = new THREE.Vector3();

  for (let s = 0; s < strandCount; s++) {
    const rec = bandRecords[Math.floor(rnd() * bandRecords.length)];
    const { grid, gridRows, gridCols } = rec.built;
    const i = 1 + Math.floor(rnd() * (gridRows - 3));
    const jf = 0.10 + rnd() * 0.80;
    const j = Math.max(1, Math.min(gridCols - 2, Math.floor(jf * (gridCols - 1))));

    const p = grid[i][j];
    // local normal from neighbours
    tmpA.subVectors(grid[i + 1][j], grid[i - 1][j]);
    tmpB.subVectors(grid[i][j + 1], grid[i][j - 1]);
    nrmTmp.crossVectors(tmpB, tmpA);
    if (nrmTmp.lengthSq() < 1e-12) continue;
    nrmTmp.normalize();
    // ensure it points outward (away from spine-ish center)
    const t = THREE.MathUtils.lerp(rec.band.t0, rec.band.t1, i / (gridRows - 1));
    const spineP = spinePoint(t);
    tmpC.subVectors(p, spineP);
    if (nrmTmp.dot(tmpC) < 0) nrmTmp.multiplyScalar(-1);

    const len = 0.0035 + rnd() * 0.0055;
    const jitter = new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5).multiplyScalar(0.0022);
    const tip = new THREE.Vector3().copy(p).addScaledVector(nrmTmp, len).add(jitter);

    // build a very thin triangle (base width ~0.0011)
    const perp = new THREE.Vector3(rnd() - 0.5, rnd() - 0.5, rnd() - 0.5);
    perp.cross(nrmTmp);
    if (perp.lengthSq() < 1e-10) perp.set(1, 0, 0);
    perp.normalize().multiplyScalar(0.00055);

    const b0 = new THREE.Vector3().copy(p).add(perp);
    const b1 = new THREE.Vector3().copy(p).sub(perp);
    positions.push(b0.x, b0.y, b0.z, b1.x, b1.y, b1.z, tip.x, tip.y, tip.z);
  }

  if (positions.length > 0) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    g.computeVertexNormals();
    const fuzzMesh = new THREE.Mesh(g, fuzzMat);
    fuzzMesh.castShadow = false;
    fuzzMesh.receiveShadow = false;
    bug.add(fuzzMesh);
  }
}

/* ============================================================
   Final placement : sit the bug on the ground, center it
   ============================================================ */
bug.rotation.y = -Math.PI * 0.18;
bug.updateMatrixWorld(true);
{
  const box = new THREE.Box3().setFromObject(bug);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();
  box.getSize(size);
  box.getCenter(center);
  // center horizontally, rest on floor with a tiny squish contact
  bug.position.x -= center.x;
  bug.position.z -= center.z;
  bug.position.y -= box.min.y;
  bug.updateMatrixWorld(true);

  const box2 = new THREE.Box3().setFromObject(bug);
  const c2 = new THREE.Vector3();
  box2.getCenter(c2);
  controls.target.set(0, c2.y, 0);

  // frame the camera to the object's size
  const radius = Math.max(size.x, size.y, size.z);
  const dist = radius * 2.55;
  camera.position.set(dist * 0.62, c2.y + radius * 0.72, dist * 0.86);
  controls.minDistance = radius * 0.85;
  controls.maxDistance = radius * 9;

  // tighten shadow camera around the object
  const r = radius * 1.25;
  key.shadow.camera.left = -r;
  key.shadow.camera.right = r;
  key.shadow.camera.top = r;
  key.shadow.camera.bottom = -r;
  key.shadow.camera.updateProjectionMatrix();

  key.target.position.set(0, c2.y * 0.5, 0);
  scene.add(key.target);
  fill.target.position.set(0, c2.y * 0.5, 0);
  scene.add(fill.target);
  rim.target.position.set(0, c2.y * 0.6, 0);
  scene.add(rim.target);

  bounce.position.set(radius * 0.4, c2.y * 0.4, radius * 1.4);
}
controls.update();

/* ============================================================
   Resize + render loop
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
