<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapel Apse — procedural three.js</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#141518;}
  canvas{display:block;}
  #hint{position:fixed;left:12px;bottom:10px;font:12px/1.4 system-ui,sans-serif;
        color:#8a8c92;letter-spacing:.02em;user-select:none;pointer-events:none;}
</style>
</head>
<body>
<div id="hint">Chapel apse — drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ *
 *  Renderer
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

/* ------------------------------------------------------------------ *
 *  Scene / camera
 * ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1b1e);
scene.fog = new THREE.Fog(0x1a1b1e, 22, 55);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(8.5, 5.0, 8.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 5;
controls.maxDistance = 28;
controls.minPolarAngle = 0.2;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 2.7, 0);

/* ------------------------------------------------------------------ *
 *  Lighting  (hemisphere ambient + key/fill/rim)
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xbcd0e8, 0x3b3324, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2df, 2.4);
key.position.set(-6.5, 9.5, 7.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 42;
key.shadow.camera.left = -10;
key.shadow.camera.right = 10;
key.shadow.camera.top = 11;
key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key);
const keyTarget = new THREE.Object3D();
keyTarget.position.set(0, 2.7, 0);
scene.add(keyTarget);
key.target = keyTarget;

const fill = new THREE.DirectionalLight(0x9fb4d6, 0.55);
fill.position.set(8, 4, -3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd7a3, 0.9);
rim.position.set(2, 6.5, -9);
scene.add(rim);

/* ------------------------------------------------------------------ *
 *  Procedural textures
 * ------------------------------------------------------------------ */
function makeStoneTexture(){
  const s = 512;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d');
  // base limestone
  x.fillStyle = '#b9ac93';
  x.fillRect(0,0,s,s);
  // broad blotchy shading
  for(let i=0;i<70;i++){
    const r = 40 + Math.random()*120;
    const g = x.createRadialGradient(Math.random()*s, Math.random()*s, 2,
                                     Math.random()*s, Math.random()*s, r);
    const t = Math.random();
    g.addColorStop(0, t>0.5 ? 'rgba(160,150,128,0.10)' : 'rgba(90,80,62,0.10)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0,0,s,s);
  }
  // fine grain
  const img = x.getImageData(0,0,s,s), d = img.data;
  for(let i=0;i<d.length;i+=4){
    const n = (Math.random()-0.5)*22;
    d[i]+=n; d[i+1]+=n; d[i+2]+=n;
  }
  x.putImageData(img,0,0);
  // ashlar courses: 4 courses / metre (0.25 m each) -> 128 px, blocks 0.5 m -> 256 px
  const ch = 128;
  x.lineWidth = 3;
  x.strokeStyle = 'rgba(58,50,38,0.55)';
  for(let cy=0; cy<=s; cy+=ch){
    x.beginPath(); x.moveTo(0,cy+0.5); x.lineTo(s,cy+0.5); x.stroke();
  }
  x.lineWidth = 2;
  x.strokeStyle = 'rgba(58,50,38,0.5)';
  let row = 0;
  for(let cy=0; cy<s; cy+=ch){
    const off = (row%2)*128;
    for(let vx=off; vx<=s+128; vx+=256){
      const px = ((vx % s)+s) % s;
      x.beginPath(); x.moveTo(px+0.5, cy); x.lineTo(px+0.5, cy+ch); x.stroke();
    }
    row++;
  }
  // highlight along tops of courses
  x.strokeStyle = 'rgba(210,200,178,0.25)';
  x.lineWidth = 1;
  for(let cy=2; cy<=s; cy+=ch){
    x.beginPath(); x.moveTo(0,cy+0.5); x.lineTo(s,cy+0.5); x.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = MAX_ANISO;
  return tex;
}

function makeRoofTexture(){
  const s = 256;
  const c = document.createElement('canvas'); c.width = c.height = s;
  const x = c.getContext('2d');
  // joint / mortar background
  x.fillStyle = '#30343c';
  x.fillRect(0,0,s,s);
  const th = 34;   // course height
  const tw = 34;   // tile width
  let row = 0;
  for(let ry=0; ry<s; ry+=th){
    const off = (row%2)*(tw/2);
    for(let rx=-tw; rx<s+tw; rx+=tw){
      const shade = 66 + (Math.random()*24-12);
      const r = Math.max(30, shade-6), g = Math.max(30, shade-2), b = Math.max(38, shade+8);
      x.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
      // rounded-ish slate tile
      x.fillRect(rx+off+1.5, ry+1.5, tw-3, th-3);
      x.fillStyle = 'rgba(255,255,255,0.05)';
      x.fillRect(rx+off+1.5, ry+1.5, tw-3, 2);
    }
    row++;
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(10, 6);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = MAX_ANISO;
  return tex;
}

/* ------------------------------------------------------------------ *
 *  Materials
 * ------------------------------------------------------------------ */
const stoneTex = makeStoneTexture();
const stoneMat = new THREE.MeshStandardMaterial({
  map: stoneTex, bumpMap: stoneTex, bumpScale: 0.02,
  color: 0xffffff, roughness: 0.96, metalness: 0.0,
  side: THREE.DoubleSide
});

const roofTex = makeRoofTexture();
const roofMat = new THREE.MeshStandardMaterial({
  map: roofTex, bumpMap: roofTex, bumpScale: 0.03,
  color: 0xffffff, roughness: 0.75, metalness: 0.04,
  side: THREE.DoubleSide
});

const glassMat = new THREE.MeshStandardMaterial({
  color: 0x1d2530, roughness: 0.22, metalness: 0.1,
  emissive: 0x3a2a12, emissiveIntensity: 0.6,
  side: THREE.DoubleSide
});

/* ------------------------------------------------------------------ *
 *  Geometry helper — a solid curved masonry block (portion of a
 *  cylindrical shell). Non-indexed, flat-shaded, UVs in metres.
 * ------------------------------------------------------------------ */
function curvedShell(a0, a1, y0, y1, ri, ro, seg){
  const pos = [], uv = [];
  const rm = (ri+ro)/2;
  const P = (a,r,y)=>[Math.cos(a)*r, y, Math.sin(a)*r];
  function quad(A,B,C,D, uA,uB,uC,uD){
    pos.push(...A,...B,...C, ...A,...C,...D);
    uv.push(...uA,...uB,...uC, ...uA,...uC,...uD);
  }
  for(let i=0;i<seg;i++){
    const aa = a0 + (a1-a0)*i/seg;
    const ab = a0 + (a1-a0)*(i+1)/seg;
    const oa0=P(aa,ro,y0), oa1=P(aa,ro,y1), ob0=P(ab,ro,y0), ob1=P(ab,ro,y1);
    const ia0=P(aa,ri,y0), ia1=P(aa,ri,y1), ib0=P(ab,ri,y0), ib1=P(ab,ri,y1);
    // outer
    quad(oa0,ob0,ob1,oa1, [aa*ro,y0],[ab*ro,y0],[ab*ro,y1],[aa*ro,y1]);
    // inner
    quad(ia0,ia1,ib1,ib0, [aa*ri,y0],[aa*ri,y1],[ab*ri,y1],[ab*ri,y0]);
    // top
    quad(ia1,oa1,ob1,ib1, [aa*rm,ri],[aa*rm,ro],[ab*rm,ro],[ab*rm,ri]);
    // bottom
    quad(ia0,ib0,ob0,oa0, [aa*rm,ri],[ab*rm,ri],[ab*rm,ro],[aa*rm,ro]);
  }
  // radial end caps
  function cap(a){
    const i0=P(a,ri,y0), i1=P(a,ri,y1), o0=P(a,ro,y0), o1=P(a,ro,y1);
    quad(i0,o0,o1,i1, [ri,y0],[ro,y0],[ro,y1],[ri,y1]);
  }
  cap(a0); cap(a1);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  g.computeVertexNormals();
  return g;
}

/* ------------------------------------------------------------------ *
 *  Build the apse
 * ------------------------------------------------------------------ */
const apse = new THREE.Group();
scene.add(apse);

function addMesh(geo, mat, cast=true, receive=true){
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast;
  m.receiveShadow = receive;
  apse.add(m);
  return m;
}

// --- dimensions (metres) ---
const Ri = 3.0, Ro = 3.5;                // wall inner / outer radius
const rm = (Ri+Ro)/2;
const ySill = 1.1;                       // window sill
const ySpring = 3.4;                     // arch springline / impost
const yWallTop = 4.8;                    // eave
const N = 5;                             // number of windows
const wAng = 0.34;                       // window angular width (rad)
const pAng = (Math.PI - N*wAng)/(N+1);   // pier angular width
const WIN_HALF = rm * wAng / 2;          // semicircular arch rise
const yApex = ySpring + WIN_HALF;        // top of arches
const rGlass = 3.12;                     // glazing radius (recessed)
const A0 = Math.PI/2, A1 = 3*Math.PI/2;  // arc spans the -X half

// --- continuous horizontal courses (full semicircle) ---
addMesh(curvedShell(A0, A1, 0.0,       ySill,     Ri, Ro,        96), stoneMat);           // base wall
addMesh(curvedShell(A0, A1, yApex,     yWallTop,  Ri, Ro,        96), stoneMat);           // spandrel band above arches
// proud plinth
addMesh(curvedShell(A0, A1, 0.0,       0.46,      Ro, Ro+0.14,   96), stoneMat);
// sill string course
addMesh(curvedShell(A0, A1, ySill-0.05, ySill+0.05, Ro-0.02, Ro+0.12, 96), stoneMat);
// impost / springline string course
addMesh(curvedShell(A0, A1, ySpring-0.04, ySpring+0.04, Ro-0.02, Ro+0.10, 96), stoneMat);
// eave cornice
addMesh(curvedShell(A0, A1, yWallTop-0.22, yWallTop+0.06, Ro-0.02, Ro+0.22, 96), stoneMat);

// --- spandrel filler that gives each window its arched head ---
function addSpandrel(wa0, wa1){
  const c = (wa0+wa1)/2;
  const half = rm*(wa1-wa0)/2;
  const slices = 20;
  for(let i=0;i<slices;i++){
    const sa = wa0 + (wa1-wa0)*i/slices;
    const sb = wa0 + (wa1-wa0)*(i+1)/slices;
    const a  = (sa+sb)/2;
    const dx = rm*(a - c);
    const archY = ySpring + Math.sqrt(Math.max(0, half*half - dx*dx));
    if(yApex - archY > 0.004){
      addMesh(curvedShell(sa, sb, archY, yApex, Ri, Ro, 1), stoneMat);
    }
  }
}

// --- one glazed & traceried window ---
function addWindow(wa0, wa1){
  const c = (wa0+wa1)/2;
  // glass (rectangular panel; the arched stone opening masks the head)
  addMesh(curvedShell(wa0, wa1, ySill, yApex, rGlass-0.03, rGlass+0.03, 10),
          glassMat, false, false);
  addSpandrel(wa0, wa1);
  // vertical mullion
  addMesh(curvedShell(c-0.007, c+0.007, ySill, yApex-0.04, rGlass-0.02, rGlass+0.09, 2), stoneMat);
  // transoms
  addMesh(curvedShell(wa0+0.015, wa1-0.015, ySpring-0.045, ySpring+0.045, rGlass-0.02, rGlass+0.09, 6), stoneMat);
  addMesh(curvedShell(wa0+0.015, wa1-0.015, 2.10-0.045, 2.10+0.045, rGlass-0.02, rGlass+0.09, 6), stoneMat);
}

// --- buttress: stepped, weathered, extruded profile (radial x, height y) ---
function makeButtressGeo(){
  const s = new THREE.Shape();
  s.moveTo(-0.18, 0.0);
  s.lineTo( 0.74, 0.0);
  s.lineTo( 0.74, 2.10);
  s.lineTo( 0.50, 2.45);   // lower set-off weathering
  s.lineTo( 0.50, 3.55);
  s.lineTo(-0.18, 4.20);   // top weathering sloping back to the wall
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.82, bevelEnabled: false, steps: 1 });
  g.translate(0, 0, -0.41); // centre the width
  return g;
}
const buttressGeo = makeButtressGeo();
function addButtress(theta){
  const m = new THREE.Mesh(buttressGeo, stoneMat);
  m.castShadow = m.receiveShadow = true;
  const Rb = Ro - 0.1;
  m.position.set(Math.cos(theta)*Rb, 0, Math.sin(theta)*Rb);
  m.rotation.y = -theta;   // local +X -> radial outward
  apse.add(m);
}

// --- lay out piers, windows and buttresses around the semicircle ---
let ang = A0;
for(let k=0;k<=N;k++){
  const pa0 = ang, pa1 = ang + pAng;
  // pier
  addMesh(curvedShell(pa0, pa1, ySill, yApex, Ri, Ro, 6), stoneMat);
  addButtress((pa0+pa1)/2);
  ang = pa1;
  if(k < N){
    const wa0 = ang, wa1 = ang + wAng;
    addWindow(wa0, wa1);
    ang = wa1;
  }
}

/* ------------------------------------------------------------------ *
 *  Half-conical roof
 * ------------------------------------------------------------------ */
const Hroof = 2.7;
const Rroof = Ro + 0.35;
const yRoofApex = yWallTop + Hroof;

const coneGeo = new THREE.ConeGeometry(Rroof, Hroof, 64, 1, false, Math.PI, Math.PI);
const roof = new THREE.Mesh(coneGeo, roofMat);
roof.position.y = yWallTop + Hroof/2;
roof.castShadow = true;
roof.receiveShadow = true;
apse.add(roof);

// gable triangle closing the roof's axial cut (plane x = 0)
{
  const p = [ 0, yWallTop,  Rroof,
              0, yWallTop, -Rroof,
              0, yRoofApex, 0 ];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute([0,0, 1,0, 0.5,1], 2));
  g.computeVertexNormals();
  addMesh(g, stoneMat);
}

// small finial at the roof apex
{
  const fin = new THREE.Group();
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.09, 0.35, 8), stoneMat);
  stem.position.y = 0.17;
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), stoneMat);
  ball.position.y = 0.42;
  const cap = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.2, 10), stoneMat);
  cap.position.y = 0.6;
  [stem, ball, cap].forEach(m => { m.castShadow = true; fin.add(m); });
  fin.position.set(0, yRoofApex, 0);
  apse.add(fin);
}

/* ------------------------------------------------------------------ *
 *  Centre the object at the origin
 * ------------------------------------------------------------------ */
{
  const box = new THREE.Box3().setFromObject(apse);
  const c = box.getCenter(new THREE.Vector3());
  apse.position.x -= c.x;
  apse.position.z -= c.z;
}

/* ------------------------------------------------------------------ *
 *  Ground plane (subtle studio floor, receives shadows only)
 * ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(45, 64),
  new THREE.MeshStandardMaterial({ color: 0x2a2b2f, roughness: 1.0, metalness: 0.0 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = 0;
ground.receiveShadow = true;
ground.castShadow = false;
scene.add(ground);

/* ------------------------------------------------------------------ *
 *  Resize + render loop
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
