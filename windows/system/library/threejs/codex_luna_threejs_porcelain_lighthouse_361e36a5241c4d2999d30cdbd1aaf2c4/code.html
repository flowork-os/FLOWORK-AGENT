<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Porcelain Lighthouse</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #dce7ee; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdce8ef);
scene.fog = new THREE.Fog(0xdce8ef, 15, 28);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.2, 5.7, 8.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 6;
controls.maxDistance = 15;
controls.target.set(0, 3.05, 0);

const porcelain = new THREE.MeshPhysicalMaterial({
  color: 0xf8f7f1,
  roughness: 0.16,
  metalness: 0,
  clearcoat: 0.9,
  clearcoatRoughness: 0.1
});
const porcelainShadow = new THREE.MeshPhysicalMaterial({
  color: 0xe8e7df,
  roughness: 0.22,
  clearcoat: 0.8,
  clearcoatRoughness: 0.12
});
const cobalt = new THREE.MeshPhysicalMaterial({
  color: 0x123f91,
  roughness: 0.2,
  metalness: 0.02,
  clearcoat: 0.75,
  clearcoatRoughness: 0.11
});
const gold = new THREE.MeshPhysicalMaterial({
  color: 0xd6a83d,
  metalness: 0.88,
  roughness: 0.2,
  clearcoat: 0.55
});
const darkMetal = new THREE.MeshStandardMaterial({
  color: 0x192b3a,
  metalness: 0.8,
  roughness: 0.28
});
const glass = new THREE.MeshPhysicalMaterial({
  color: 0xaed9e8,
  transparent: true,
  opacity: 0.28,
  roughness: 0.06,
  metalness: 0,
  transmission: 0.35,
  thickness: 0.08,
  side: THREE.DoubleSide
});
const warmGlass = new THREE.MeshStandardMaterial({
  color: 0xffd477,
  emissive: 0xff9b28,
  emissiveIntensity: 1.9,
  transparent: true,
  opacity: 0.8
});

const lighthouse = new THREE.Group();
lighthouse.rotation.y = -0.16;
scene.add(lighthouse);

function mesh(geometry, material, y = 0) {
  const object = new THREE.Mesh(geometry, material);
  object.position.y = y;
  object.castShadow = true;
  object.receiveShadow = true;
  lighthouse.add(object);
  return object;
}

function cylinderBetween(a, b, radius, material, radialSegments = 16) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const direction = new THREE.Vector3().subVectors(end, start);
  const object = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, direction.length(), radialSegments),
    material
  );
  object.position.copy(start).add(end).multiplyScalar(0.5);
  object.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  object.castShadow = true;
  object.receiveShadow = true;
  lighthouse.add(object);
  return object;
}

mesh(new THREE.CylinderGeometry(1.82, 1.92, 0.3, 96), porcelainShadow, 0.15);
mesh(new THREE.CylinderGeometry(1.68, 1.78, 0.22, 96), porcelain, 0.4);
mesh(new THREE.TorusGeometry(1.58, 0.13, 20, 96), cobalt, 0.54);
mesh(new THREE.CylinderGeometry(1.43, 1.5, 0.24, 96), porcelain, 0.69);

const towerHeight = 4.45;
const towerBottom = 1.33;
const towerTop = 0.93;
mesh(new THREE.CylinderGeometry(towerTop, towerBottom, towerHeight, 96, 8), porcelain, 2.95);

for (let ringIndex = 0; ringIndex < 4; ringIndex++) {
  const ringY = 1.05 + ringIndex * 1.27;
  const ringRadius = towerBottom + (towerTop - towerBottom) * ((ringY - 0.73) / towerHeight);
  mesh(new THREE.TorusGeometry(ringRadius + 0.025, 0.045, 12, 64), porcelainShadow, ringY);
}

const spiralPoints = [];
const spiralTurns = 3.15;
const spiralSteps = 230;
for (let i = 0; i <= spiralSteps; i++) {
  const u = i / spiralSteps;
  const angle = u * Math.PI * 2 * spiralTurns + 0.22;
  const y = 0.98 + u * 4.0;
  const radius = towerBottom + (towerTop - towerBottom) * ((y - 0.73) / towerHeight) + 0.055;
  spiralPoints.push(new THREE.Vector3(Math.cos(angle) * radius, y, Math.sin(angle) * radius));
}
const spiralCurve = new THREE.CatmullRomCurve3(spiralPoints);
const spiral = new THREE.Mesh(
  new THREE.TubeGeometry(spiralCurve, 260, 0.095, 12, false),
  cobalt
);
spiral.castShadow = true;
spiral.receiveShadow = true;
lighthouse.add(spiral);

mesh(new THREE.CylinderGeometry(1.13, 1.19, 0.2, 96), porcelain, 5.2);
mesh(new THREE.TorusGeometry(1.11, 0.095, 16, 96), cobalt, 5.34);
mesh(new THREE.CylinderGeometry(1.02, 1.02, 0.13, 96), porcelainShadow, 5.48);

const galleryRailHeight = 0.47;
const galleryRadius = 1.02;
for (let i = 0; i < 18; i++) {
  const angle = (i / 18) * Math.PI * 2;
  const x = Math.cos(angle) * galleryRadius;
  const z = Math.sin(angle) * galleryRadius;
  cylinderBetween([x, 5.43, z], [x, 5.43 + galleryRailHeight, z], 0.027, gold, 10);
}
const lowerRail = new THREE.Mesh(new THREE.TorusGeometry(galleryRadius, 0.035, 10, 96), gold);
lowerRail.rotation.x = Math.PI / 2;
lowerRail.position.y = 5.56;
lowerRail.castShadow = true;
lighthouse.add(lowerRail);
const upperRail = new THREE.Mesh(new THREE.TorusGeometry(galleryRadius, 0.045, 10, 96), gold);
upperRail.rotation.x = Math.PI / 2;
upperRail.position.y = 5.91;
upperRail.castShadow = true;
lighthouse.add(upperRail);

mesh(new THREE.CylinderGeometry(0.89, 0.89, 0.9, 64), glass, 5.88);
for (let i = 0; i < 10; i++) {
  const angle = (i / 10) * Math.PI * 2;
  const x = Math.cos(angle) * 0.9;
  const z = Math.sin(angle) * 0.9;
  cylinderBetween([x, 5.47, z], [x, 6.31, z], 0.035, darkMetal, 10);
}
mesh(new THREE.CylinderGeometry(0.92, 0.92, 0.08, 64), darkMetal, 6.32);
mesh(new THREE.SphereGeometry(0.31, 32, 20), warmGlass, 5.91);

const lampGlow = new THREE.PointLight(0xffb84c, 3.2, 5.2, 2);
lampGlow.position.set(0, 5.91, 0);
lighthouse.add(lampGlow);

mesh(new THREE.CylinderGeometry(0.98, 0.8, 0.13, 64), cobalt, 6.4);
mesh(new THREE.SphereGeometry(0.82, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), porcelain, 6.48);
mesh(new THREE.TorusGeometry(0.73, 0.055, 14, 64), cobalt, 6.5);

const vaneMast = cylinderBetween([0, 6.48, 0], [0, 7.68, 0], 0.045, gold, 14);
vaneMast.castShadow = true;
mesh(new THREE.SphereGeometry(0.1, 20, 12), gold, 7.68);

const arrow = cylinderBetween([-0.78, 7.68, 0], [0.78, 7.68, 0], 0.035, gold, 12);
arrow.rotation.z = 0.08;
const arrowHead = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.35, 16), gold);
arrowHead.rotation.z = -Math.PI / 2;
arrowHead.position.set(0.92, 7.68, 0);
arrowHead.castShadow = true;
lighthouse.add(arrowHead);

const fin = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.58, 4), gold);
fin.scale.set(0.8, 1.1, 0.16);
fin.rotation.z = Math.PI / 2;
fin.position.set(-0.42, 7.68, 0);
fin.castShadow = true;
lighthouse.add(fin);

mesh(new THREE.TorusGeometry(0.2, 0.027, 10, 32), gold, 7.25).rotation.x = Math.PI / 2;

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(16, 96),
  new THREE.MeshStandardMaterial({ color: 0xc4d5dc, roughness: 0.82, metalness: 0 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.02;
floor.receiveShadow = true;
scene.add(floor);

const hemi = new THREE.HemisphereLight(0xf5fbff, 0x78909d, 2.0);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4dc, 4.0);
key.position.set(5, 10, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 10;
key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0005;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fc9ff, 1.3);
fill.position.set(-6, 4, -5);
scene.add(fill);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
