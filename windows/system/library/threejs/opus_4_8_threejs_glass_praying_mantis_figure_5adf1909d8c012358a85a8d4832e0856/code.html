<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   Renderer / Scene / Camera
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0e10);
scene.fog = new THREE.FogExp2(0x0c0e10, 0.028);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.02, 120);
camera.position.set(0.34, 0.30, 0.52);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.target.set(0, 0.145, 0);
controls.minDistance = 0.20;
controls.maxDistance = 1.60;
controls.maxPolarAngle = Math.PI * 0.53;

/* ============================================================
   Procedural studio environment (for glass reflections/refraction)
   ============================================================ */
function buildEnvironment() {
  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0x0a0c0e);

  const panelGeo = new THREE.PlaneGeometry(1, 1);

  function panel(color, intensity, w, h, pos, look) {
    const m = new THREE.Mesh(
      panelGeo,
      new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide })
    );
    m.scale.set(w, h, 1);
    m.position.set(pos[0], pos[1], pos[2]);
    m.lookAt(new THREE.Vector3(look[0], look[1], look[2]));
    envScene.add(m);
    return m;
  }

  // Big soft key softbox (upper-left front)
  panel(0xffffff, 5.0, 7, 5, [-5, 6, 5], [0, 0, 0]);
  // Cool fill from right
  panel(0x9fd8ff, 1.9, 6, 6, [7, 2.2, 1.5], [0, 0, 0]);
  // Amber kicker from behind
  panel(0xffb066, 2.6, 5, 2.6, [-1.5, 1.6, -7], [0, 0, 0]);
  // Jade bounce from below-left
  panel(0x86ffd2, 0.85, 6, 4, [-3.5, -3.2, -2.5], [0, 0, 0]);
  // Overhead broad source
  panel(0xf2fbff, 2.2, 9, 9, [0, 9, 0], [0, 0, 0]);
  // Dark floor to give glass a horizon line
  panel(0x0a0d0f, 1.0, 16, 16, [0, -3.2, 0], [0, 1, 0]);

  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const rt = pmrem.fromScene(envScene, 0.035);
  pmrem.dispose();
  panelGeo.dispose();
  envScene.traverse(o => { if (o.material) o.material.dispose(); });
  return rt.texture;
}
const envMap = buildEnvironment();
scene.environment = envMap;

/* ============================================================
   Materials — lampworked glass palette
   ============================================================ */
const MAT = {};

// Pale jade body glass — thick, hollow-feeling, slightly milky
MAT.jade = new THREE.MeshPhysicalMaterial({
  color: 0xcdeee0,
  metalness: 0.0,
  roughness: 0.035,
  transmission: 1.0,
  thickness: 0.030,
  ior: 1.52,
  attenuationColor: new THREE.Color(0x63c9a4),
  attenuationDistance: 0.16,
  clearcoat: 1.0,
  clearcoatRoughness: 0.03,
  envMapIntensity: 1.5,
  specularIntensity: 1.0,
  transparent: true,
  side: THREE.DoubleSide,
  depthWrite: false
});

// Deeper jade for thorax / head accents
MAT.jadeDeep = MAT.jade.clone();
MAT.jadeDeep.attenuationColor = new THREE.Color(0x3fae86);
MAT.jadeDeep.attenuationDistance = 0.10;
MAT.jadeDeep.thickness = 0.042;

// Nearly clear glass for hollow limbs — thin walls, big refraction
MAT.limb = new THREE.MeshPhysicalMaterial({
  color: 0xe8fff8,
  metalness: 0.0,
  roughness: 0.02,
  transmission: 1.0,
  thickness: 0.010,
  ior: 1.55,
  attenuationColor: new THREE.Color(0x9be6cd),
  attenuationDistance: 0.30,
  clearcoat: 1.0,
  clearcoatRoughness: 0.02,
  envMapIntensity: 1.7,
  transparent: true,
  side: THREE.DoubleSide,
  depthWrite: false
});

// Wafer-thin wing sheets
MAT.wing = new THREE.MeshPhysicalMaterial({
  color: 0xf2fffb,
  metalness: 0.0,
  roughness: 0.06,
  transmission: 0.985,
  thickness: 0.0016,
  ior: 1.47,
  attenuationColor: new THREE.Color(0xbfeede),
  attenuationDistance: 1.2,
  clearcoat: 1.0,
  clearcoatRoughness: 0.05,
  iridescence: 0.55,
  iridescenceIOR: 1.32,
  iridescenceThicknessRange: [180, 520],
  envMapIntensity: 1.4,
  transparent: true,
  opacity: 0.62,
  side: THREE.DoubleSide,
  depthWrite: false
});

// Amber edge glow along the wing borders + antenna tips
MAT.amberGlow = new THREE.MeshStandardMaterial({
  color: 0xffb257,
  emissive: 0xff9a35,
  emissiveIntensity: 2.1,
  roughness: 0.35,
  metalness: 0.0,
  transparent: true,
  opacity: 0.9
});

// Amber-tinted glass (wing veins / leg joints)
MAT.amberGlass = new THREE.MeshPhysicalMaterial({
  color: 0xffd6a0,
  metalness: 0.0,
  roughness: 0.05,
  transmission: 0.95,
  thickness: 0.006,
  ior: 1.5,
  attenuationColor: new THREE.Color(0xff9b3d),
  attenuationDistance: 0.05,
  emissive: 0xff8c28,
  emissiveIntensity: 0.55,
  clearcoat: 1.0,
  envMapIntensity: 1.4,
  transparent: true,
  side: THREE.DoubleSide,
  depthWrite: false
});

// Suspended air bubbles inside the abdomen (inverted-normal glass beads)
MAT.bubble = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0.0,
  roughness: 0.0,
  transmission: 1.0,
  thickness: 0.002,
  ior: 1.0 / 1.52,     // air bubble inside glass => relative IOR < 1
  clearcoat: 1.0,
  clearcoatRoughness: 0.0,
  envMapIntensity: 2.0,
  transparent: true,
  opacity: 0.85,
  side: THREE.DoubleSide,
  depthWrite: false
});

// Pedestal — very clear optical crystal
MAT.pedestal = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0.0,
  roughness: 0.015,
  transmission: 1.0,
  thickness: 0.075,
  ior: 1.62,
  attenuationColor: new THREE.Color(0xdff3ff),
  attenuationDistance: 0.55,
  clearcoat: 1.0,
  clearcoatRoughness: 0.01,
  envMapIntensity: 1.8,
  transparent: true,
  side: THREE.DoubleSide,
  depthWrite: false,
  dispersion: 1.6
});

// Tiny dark eye pupils (annealed glass dot)
MAT.pupil = new THREE.MeshPhysicalMaterial({
  color: 0x0d1a16,
  roughness: 0.08,
  metalness: 0.0,
  clearcoat: 1.0,
  envMapIntensity: 1.0
});

/* ============================================================
   Geometry helpers
   ============================================================ */

// Lathe profile from a set of [radius, y] samples, smoothed
function latheFromProfile(points, segments = 48, phiLength = Math.PI * 2) {
  const pts = points.map(p => new THREE.Vector2(Math.max(p[0], 1e-5), p[1]));
  const g = new THREE.LatheGeometry(pts, segments, 0, phiLength);
  g.computeVertexNormals();
  return g;
}

// Sample a spun profile: r(t) function over y range
function spunProfile(y0, y1, steps, radiusFn) {
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const y = THREE.MathUtils.lerp(y0, y1, t);
    pts.push([Math.max(radiusFn(t), 0.00015), y]);
  }
  return pts;
}

// A tapered tube along a Catmull-Rom curve, with radius(t)
function taperedTube(pointsArr, radiusFn, tubularSegments = 48, radialSegments = 12, closed = false) {
  const curve = new THREE.CatmullRomCurve3(
    pointsArr.map(p => new THREE.Vector3(p[0], p[1], p[2])),
    closed,
    'catmullrom',
    0.5
  );
  const geo = new THREE.TubeGeometry(curve, tubularSegments, 1, radialSegments, closed);
  // Re-shape the tube radius per ring (TubeGeometry builds rings of radialSegments+1 verts)
  const pos = geo.attributes.position;
  const nrm = geo.attributes.normal;
  const rings = tubularSegments + 1;
  const perRing = radialSegments + 1;
  const frames = curve.computeFrenetFrames(tubularSegments, closed);
  const P = new THREE.Vector3();
  for (let i = 0; i < rings; i++) {
    const t = i / tubularSegments;
    const r = Math.max(radiusFn(t), 0.00012);
    curve.getPointAt(Math.min(t, 1), P);
    const N = frames.normals[Math.min(i, frames.normals.length - 1)];
    const B = frames.binormals[Math.min(i, frames.binormals.length - 1)];
    for (let j = 0; j < perRing; j++) {
      const idx = i * perRing + j;
      const v = (j / radialSegments) * Math.PI * 2;
      const nx = -(Math.cos(v) * N.x + Math.sin(v) * B.x);
      const ny = -(Math.cos(v) * N.y + Math.sin(v) * B.y);
      const nz = -(Math.cos(v) * N.z + Math.sin(v) * B.z);
      const len = Math.hypot(nx, ny, nz) || 1;
      const ux = nx / len, uy = ny / len, uz = nz / len;
      pos.setXYZ(idx, P.x - ux * r, P.y - uy * r, P.z - uz * r);
      nrm.setXYZ(idx, -ux, -uy, -uz);
    }
  }
  pos.needsUpdate = true;
  nrm.needsUpdate = true;
  geo.computeBoundingSphere();
  return geo;
}

// Flat wafer sheet (wing blade) in the XZ plane, tapering to a point,
// with a gentle lengthwise camber so it reads as blown glass, not cardboard.
function wingSheet(length, width, thickness, camber, segsU = 42, segsV = 16) {
  const g = new THREE.PlaneGeometry(length, width, segsU, segsV);
  g.rotateX(-Math.PI / 2);          // now spans X (length) and Z (width)
  const pos = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const u = (v.x + length / 2) / length;          // 0 at base -> 1 at tip
    const w = v.z / (width / 2);                    // -1 .. 1 across chord
    // Chord envelope: broad near base, tapering to a rounded point
    const env = Math.pow(Math.sin(Math.PI * Math.min(Math.max(u, 0), 1)), 0.42);
    const chord = env * (0.55 + 0.45 * (1 - u * 0.55));
    const z = v.z * chord;
    // Longitudinal droop + slight cupping across the chord
    const y = -camber * u * u * 1.0 + camber * 0.30 * (1 - w * w) * u;
    // Give it real (if wafer-thin) volume
    const t = thickness * (0.35 + 0.65 * (1 - w * w)) * (1 - 0.55 * u);
    pos.setXYZ(i, v.x, y + t * 0.5, z);
  }
  pos.needsUpdate = true;
  g.computeVertexNormals();
  return g;
}

// Outline strip that follows a wing's leading/trailing edge — the amber glow rim
function wingRim(length, width, camber, radius) {
  const pts = [];
  const N = 26;
  for (let i = 0; i <= N; i++) {
    const u = i / N;
    const x = -length / 2 + u * length;
    const env = Math.pow(Math.sin(Math.PI * Math.min(Math.max(u, 0.0001), 0.9999)), 0.42);
    const chord = env * (0.55 + 0.45 * (1 - u * 0.55));
    const z = (width / 2) * chord;
    const y = -camber * u * u + camber * 0.30 * 0 * u;
    pts.push([x, y, z]);
  }
  for (let i = N; i >= 0; i--) {
    const u = i / N;
    const x = -length / 2 + u * length;
    const env = Math.pow(Math.sin(Math.PI * Math.min(Math.max(u, 0.0001), 0.9999)), 0.42);
    const chord = env * (0.55 + 0.45 * (1 - u * 0.55));
    const z = -(width / 2) * chord;
    const y = -camber * u * u;
    pts.push([x, y, z]);
  }
  const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], p[1], p[2])), true, 'catmullrom', 0.5);
  return new THREE.TubeGeometry(curve, 190, radius, 6, true);
}

/* ============================================================
   THE FIGURINE
   Scale note: real mantis body ~85 mm. Units = meters.
   Figurine (mantis + pedestal) stands ~ 0.22 m tall.
   ============================================================ */
const figurine = new THREE.Group();
scene.add(figurine);

const mantis = new THREE.Group();
figurine.add(mantis);

// ---------- Pedestal: small clear disc with a faceted, bevelled rim ----------
const pedestal = new THREE.Group();
figurine.add(pedestal);

{
  // Lathe profile of a small optical puck: chamfered base, concave waist, domed top
  const prof = [];
  prof.push([0.0000, 0.0000]);
  prof.push([0.0380, 0.0000]);
  prof.push([0.0440, 0.0055]);
  prof.push([0.0455, 0.0125]);
  prof.push([0.0425, 0.0210]);
  prof.push([0.0375, 0.0272]);
  prof.push([0.0390, 0.0300]);
  prof.push([0.0355, 0.0322]);
  prof.push([0.0250, 0.0334]);
  prof.push([0.0120, 0.0340]);
  prof.push([0.0000, 0.0342]);

  const puck = new THREE.Mesh(latheFromProfile(prof, 64), MAT.pedestal);
  puck.castShadow = true;
  puck.receiveShadow = true;
  pedestal.add(puck);

  // Faceted collar — 16 flat facets catching the key light
  const facetGeo = new THREE.BoxGeometry(0.0135, 0.0125, 0.0062);
  const facetMat = MAT.pedestal.clone();
  facetMat.thickness = 0.02;
  const collar = new THREE.Group();
  const FACETS = 16;
  for (let i = 0; i < FACETS; i++) {
    const a = (i / FACETS) * Math.PI * 2;
    const f = new THREE.Mesh(facetGeo, facetMat);
    f.position.set(Math.cos(a) * 0.0437, 0.0128, Math.sin(a) * 0.0437);
    f.rotation.y = -a;
    f.rotation.x = 0.16;
    f.castShadow = true;
    collar.add(f);
  }
  pedestal.add(collar);

  // A polished top inlay ring that reads as the glued seat
  const seat = new THREE.Mesh(
    new THREE.TorusGeometry(0.0155, 0.0018, 12, 56),
    MAT.pedestal
  );
  seat.rotation.x = Math.PI / 2;
  seat.position.y = 0.0338;
  pedestal.add(seat);
}

const BODY_Y = 0.0342;   // top of pedestal — the mantis stands from here
mantis.position.y = BODY_Y;

/* ---------- Abdomen: spun jade glass, upswept mantis-style ---------- */
const abdomenGroup = new THREE.Group();
mantis.add(abdomenGroup);

const ABD_LEN = 0.088;
{
  // Build the abdomen as a lathe along +X then bend it upward along a curve.
  const steps = 56;
  const radial = 30;
  const geo = new THREE.BufferGeometry();
  const verts = [];
  const idx = [];

  // Centerline of the abdomen: from the waist (0,0,0) sweeping back and curving UP
  const spine = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.000, 0.0000, 0),
    new THREE.Vector3(-0.020, 0.0035, 0),
    new THREE.Vector3(-0.042, 0.0130, 0),
    new THREE.Vector3(-0.060, 0.0290, 0),
    new THREE.Vector3(-0.066, 0.0470, 0),
    new THREE.Vector3(-0.062, 0.0610, 0)
  ], false, 'catmullrom', 0.5);

  const frames = spine.computeFrenetFrames(steps, false);
  const P = new THREE.Vector3();
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    spine.getPointAt(t, P);
    // Radius: swells at 1/3 then tapers to a rounded tip
    const bulge = Math.sin(Math.PI * Math.pow(t, 0.72));
    const r = 0.0135 * (0.34 + 0.66 * bulge) * (1 - 0.30 * t) + 0.0011;
    const N = frames.normals[Math.min(i, frames.normals.length - 1)];
    const B = frames.binormals[Math.min(i, frames.binormals.length - 1)];
    for (let j = 0; j <= radial; j++) {
      const a = (j / radial) * Math.PI * 2;
      // Slightly flattened cross-section (taller than wide) like a real abdomen
      const rx = Math.cos(a) * r * 0.86;
      const ry = Math.sin(a) * r * 1.10;
      verts.push(
        P.x + N.x * rx + B.x * ry,
        P.y + N.y * rx + B.y * ry,
        P.z + N.z * rx + B.z * ry
      );
    }
  }
  for (let i = 0; i < steps; i++) {
    for (let j = 0; j < radial; j++) {
      const a = i * (radial + 1) + j;
      const b = a + radial + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();

  const abdomen = new THREE.Mesh(geo, MAT.jade);
  abdomen.castShadow = true;
  abdomenGroup.add(abdomen);

  // Segment rings — subtle lampworked constrictions
  for (let s = 1; s <= 6; s++) {
    const t = 0.12 + s * 0.115;
    if (t > 0.92) break;
    spine.getPointAt(t, P);
    const tan = spine.getTangentAt(t);
    const bulge = Math.sin(Math.PI * Math.pow(t, 0.72));
    const r = 0.0135 * (0.34 + 0.66 * bulge) * (1 - 0.30 * t) + 0.0011;
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(r * 0.99, 0.00055, 8, 34),
      MAT.jadeDeep
    );
    ring.position.copy(P);
    ring.scale.set(0.86, 1.10, 1);
    ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tan.clone().normalize());
    abdomenGroup.add(ring);
  }

  // ---- Suspended air bubbles inside the abdomen ----
  // Deterministic pseudo-random placement along the spine interior.
  let seed = 20260721;
  const rnd = () => {
    seed = (seed * 1664525 + 1013904223) % 4294967296;
    return seed / 4294967296;
  };
  const bubbleGeoBig = new THREE.SphereGeometry(1, 16, 12);
  const bubbles = new THREE.Group();
  for (let i = 0; i < 34; i++) {
    const t = 0.06 + rnd() * 0.84;
    spine.getPointAt(t, P);
    const bulge = Math.sin(Math.PI * Math.pow(t, 0.72));
    const rMax = 0.0135 * (0.34 + 0.66 * bulge) * (1 - 0.30 * t);
    const fi = Math.min(Math.floor(t * steps), frames.normals.length - 1);
    const N = frames.normals[fi];
    const B = frames.binormals[fi];
    const ang = rnd() * Math.PI * 2;
    const rad = Math.sqrt(rnd()) * rMax * 0.60;
    const bx = Math.cos(ang) * rad * 0.86;
    const by = Math.sin(ang) * rad * 1.05;
    const size = (0.00055 + rnd() * 0.00135) * (0.55 + 0.7 * bulge);
    const b = new THREE.Mesh(bubbleGeoBig, MAT.bubble);
    b.position.set(
      P.x + N.x * bx + B.x * by,
      P.y + N.y * bx + B.y * by,
      P.z + N.z * bx + B.z * by
    );
    // Bubbles in lampwork stretch along the pull direction
    b.scale.set(size, size * (0.8 + rnd() * 0.9), size);
    bubbles.add(b);
  }
  abdomenGroup.add(bubbles);

  // A couple of larger "seed" bubbles near the widest part
  for (let i = 0; i < 3; i++) {
    const t = 0.22 + i * 0.15;
    spine.getPointAt(t, P);
    const b = new THREE.Mesh(bubbleGeoBig, MAT.bubble);
    const s = 0.0026 - i * 0.0004;
    b.position.set(P.x + (i - 1) * 0.002, P.y + 0.0012, (i - 1) * 0.0018);
    b.scale.set(s, s * 1.25, s);
    abdomenGroup.add(b);
  }
}

/* ---------- Thorax (prothorax): long, arched, jade ---------- */
const THORAX_LEN = 0.052;
const thoraxGroup = new THREE.Group();
mantis.add(thoraxGroup);

// The thorax rises forward-and-up from the waist at (0,0,0)
const thoraxSpine = [
  [0.000, 0.000, 0],
  [0.012, 0.014, 0],
  [0.024, 0.030, 0],
  [0.034, 0.048, 0],
  [0.038, 0.064, 0]
];
{
  const geo = taperedTube(
    thoraxSpine,
    t => {
      // Wider at the base (where wings attach), pinched at the neck
      const w = 0.0115 * (1 - 0.62 * Math.pow(t, 1.25)) + 0.0016;
      const flare = 1 + 0.32 * Math.exp(-Math.pow((t - 0.16) / 0.16, 2));
      return w * flare;
    },
    64, 22
  );
  const thorax = new THREE.Mesh(geo, MAT.jade);
  thorax.castShadow = true;
  thoraxGroup.add(thorax);

  // Dorsal keel ridge — a fine drawn cane laid on top of the arch
  const keel = new THREE.Mesh(
    taperedTube(
      [
        [0.001, 0.0098, 0],
        [0.0135, 0.0235, 0],
        [0.0255, 0.0392, 0],
        [0.0352, 0.0562, 0],
        [0.0385, 0.0688, 0]
      ],
      t => 0.00095 * (1 - 0.5 * t) + 0.0002,
      40, 8
    ),
    MAT.jadeDeep
  );
  thoraxGroup.add(keel);

  // Small collar where the thorax meets the abdomen (the waist bead)
  const waist = new THREE.Mesh(new THREE.SphereGeometry(0.0092, 24, 18), MAT.jadeDeep);
  waist.scale.set(1.0, 0.92, 0.95);
  waist.castShadow = true;
  thoraxGroup.add(waist);
}

/* ---------- Head ---------- */
const headPivot = new THREE.Group();
headPivot.position.set(0.0395, 0.0672, 0);
mantis.add(headPivot);
headPivot.rotation.z = -0.30;

{
  // Triangular mantis head: wide at the eyes, tapering to the mandibles
  const headGeo = new THREE.SphereGeometry(0.0088, 28, 22);
  const p = headGeo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const uy = v.y / 0.0088;                 // -1 (chin) .. 1 (crown)
    const taper = 0.52 + 0.48 * (uy * 0.5 + 0.5); // narrow toward chin
    v.x *= 0.80 * taper;
    v.z *= 1.26 * taper;
    v.y *= 0.92;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  p.needsUpdate = true;
  headGeo.computeVertexNormals();

  const head = new THREE.Mesh(headGeo, MAT.jade);
  head.castShadow = true;
  headPivot.add(head);

  // Compound eyes — bulbous, on the outer corners
  const eyeGeo = new THREE.SphereGeometry(0.0042, 22, 18);
  for (const s of [-1, 1]) {
    const eye = new THREE.Mesh(eyeGeo, MAT.jadeDeep);
    eye.position.set(0.0018, 0.0022, s * 0.0082);
    eye.scale.set(0.92, 1.12, 0.95);
    eye.castShadow = true;
    headPivot.add(eye);

    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.00105, 14, 12), MAT.pupil);
    pupil.position.set(0.0038, 0.0026, s * 0.0098);
    headPivot.add(pupil);
  }

  // Mandible / face plate
  const face = new THREE.Mesh(new THREE.SphereGeometry(0.0038, 18, 14), MAT.jade);
  face.position.set(0.0035, -0.0052, 0);
  face.scale.set(1.05, 0.85, 0.9);
  headPivot.add(face);

  // Antennae — hair-thin drawn glass with amber tips
  for (const s of [-1, 1]) {
    const ant = new THREE.Mesh(
      taperedTube(
        [
          [0.0035, 0.0060, s * 0.0035],
          [0.0135, 0.0140, s * 0.0072],
          [0.0250, 0.0186, s * 0.0128],
          [0.0362, 0.0182, s * 0.0206],
          [0.0448, 0.0132, s * 0.0292]
        ],
        t => 0.00042 * (1 - 0.72 * t) + 0.00008,
        44, 7
      ),
      MAT.limb
    );
    headPivot.add(ant);

    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.00062, 12, 10), MAT.amberGlow);
    tip.position.set(0.0448, 0.0132, s * 0.0292);
    headPivot.add(tip);
  }
}

/* ---------- Raptorial forelegs, folded in the "praying" pose ---------- */
function buildForeleg(side) {
  const g = new THREE.Group();

  // Coxa: long, rising from the front of the thorax
  const coxa = new THREE.Mesh(
    taperedTube(
      [
        [0.000, 0.000, 0],
        [0.0075, 0.0090, side * 0.0022],
        [0.0150, 0.0182, side * 0.0038],
        [0.0212, 0.0272, side * 0.0044]
      ],
      t => 0.0030 * (1 - 0.30 * t) + 0.0007,
      36, 14
    ),
    MAT.limb
  );
  coxa.castShadow = true;
  g.add(coxa);

  // Femur: the thick grasping segment, angled forward and DOWN from the elbow
  const femurPts = [
    [0.0212, 0.0272, side * 0.0044],
    [0.0272, 0.0202, side * 0.0074],
    [0.0330, 0.0122, side * 0.0098],
    [0.0374, 0.0044, side * 0.0110],
    [0.0398, -0.0022, side * 0.0114]
  ];
  const femur = new THREE.Mesh(
    taperedTube(
      femurPts,
      t => {
        const swell = Math.sin(Math.PI * Math.pow(Math.min(Math.max(t, 0), 1), 0.85));
        return 0.0018 + 0.0030 * swell;
      },
      44, 16
    ),
    MAT.limb
  );
  femur.castShadow = true;
  g.add(femur);

  // Femoral spines — tiny clear glass thorns on the inner edge
  const spineGeo = new THREE.ConeGeometry(0.00048, 0.0026, 7);
  for (let i = 0; i < 6; i++) {
    const t = 0.14 + i * 0.145;
    const a = femurPts[0], b = femurPts[femurPts.length - 1];
    // sample along the polyline approximately via a curve
    const curve = new THREE.CatmullRomCurve3(femurPts.map(q => new THREE.Vector3(q[0], q[1], q[2])), false, 'catmullrom', 0.5);
    const pt = curve.getPointAt(Math.min(t, 1));
    const tan = curve.getTangentAt(Math.min(t, 1));
    const sp = new THREE.Mesh(spineGeo, MAT.limb);
    // Push the spine to the inner-lower face
    const inward = new THREE.Vector3(0, 0, -side).multiplyScalar(0.0016);
    const down = new THREE.Vector3(tan.y, -tan.x, 0).normalize().multiplyScalar(0.0030);
    sp.position.copy(pt).add(inward).add(down.clone().multiplyScalar(0.55));
    sp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), down.clone().normalize());
    g.add(sp);
    void a; void b;
  }

  // Tibia: folded back UP against the femur (the classic praying fold)
  const tibiaPts = [
    [0.0398, -0.0022, side * 0.0114],
    [0.0376, 0.0056, side * 0.0128],
    [0.0334, 0.0136, side * 0.0136],
    [0.0282, 0.0206, side * 0.0138],
    [0.0232, 0.0252, side * 0.0134]
  ];
  const tibia = new THREE.Mesh(
    taperedTube(tibiaPts, t => 0.00185 * (1 - 0.42 * t) + 0.00048, 40, 13),
    MAT.limb
  );
  tibia.castShadow = true;
  g.add(tibia);

  // Tibial spines facing the femur
  {
    const curve = new THREE.CatmullRomCurve3(tibiaPts.map(q => new THREE.Vector3(q[0], q[1], q[2])), false, 'catmullrom', 0.5);
    const tsGeo = new THREE.ConeGeometry(0.00034, 0.0019, 6);
    for (let i = 0; i < 7; i++) {
      const t = 0.08 + i * 0.125;
      const pt = curve.getPointAt(Math.min(t, 0.999));
      const tan = curve.getTangentAt(Math.min(t, 0.999));
      const sp = new THREE.Mesh(tsGeo, MAT.limb);
      const dir = new THREE.Vector3(tan.y, -tan.x, 0).normalize();
      sp.position.copy(pt).add(dir.clone().multiplyScalar(0.0020)).add(new THREE.Vector3(0, 0, -side * 0.0006));
      sp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      g.add(sp);
    }
  }

  // Tarsus: the delicate foot curling off the tibia tip
  const tarsus = new THREE.Mesh(
    taperedTube(
      [
        [0.0232, 0.0252, side * 0.0134],
        [0.0186, 0.0286, side * 0.0128],
        [0.0138, 0.0300, side * 0.0116],
        [0.0096, 0.0288, side * 0.0102]
      ],
      t => 0.00058 * (1 - 0.55 * t) + 0.00016,
      30, 8
    ),
    MAT.limb
  );
  g.add(tarsus);

  // Elbow joint bead — amber-tinted glass accent
  const joint = new THREE.Mesh(new THREE.SphereGeometry(0.0030, 18, 14), MAT.amberGlass);
  joint.position.set(0.0212, 0.0272, side * 0.0044);
  g.add(joint);

  const knee = new THREE.Mesh(new THREE.SphereGeometry(0.0024, 16, 12), MAT.amberGlass);
  knee.position.set(0.0398, -0.0022, side * 0.0114);
  g.add(knee);

  return g;
}

{
  const foreAttach = new THREE.Group();
  foreAttach.position.set(0.0300, 0.0392, 0);
  mantis.add(foreAttach);
  for (const s of [-1, 1]) {
    const leg = buildForeleg(s);
    leg.rotation.z = 0.10;
    foreAttach.add(leg);
  }
}

/* ---------- Four walking legs ---------- */
function buildWalkingLeg(side, opts) {
  const g = new THREE.Group();
  const { out, back, femLen, tibLen, hipY } = opts;

  // Femur goes up-and-out from the body, then the tibia drops to the pedestal.
  const kneeX = back * 0.55 - femLen * 0.32;
  const kneeY = hipY + femLen * 0.62;
  const kneeZ = side * out;

  const footX = kneeX + back * 0.30 - tibLen * 0.20;
  const footY = -BODY_Y + 0.0016;       // rest on the pedestal top
  const footZ = side * (out + tibLen * 0.34);

  const femur = new THREE.Mesh(
    taperedTube(
      [
        [0, hipY, side * 0.0055],
        [kneeX * 0.35 + 0.0015, hipY + femLen * 0.30, side * (0.0055 + out * 0.34)],
        [kneeX * 0.72, hipY + femLen * 0.52, side * (0.0055 + out * 0.72)],
        [kneeX, kneeY, kneeZ]
      ],
      t => 0.00135 * (1 - 0.38 * t) + 0.00042,
      36, 11
    ),
    MAT.limb
  );
  femur.castShadow = true;
  g.add(femur);

  const tibia = new THREE.Mesh(
    taperedTube(
      [
        [kneeX, kneeY, kneeZ],
        [kneeX + (footX - kneeX) * 0.30, kneeY - tibLen * 0.34, kneeZ + (footZ - kneeZ) * 0.30],
        [kneeX + (footX - kneeX) * 0.66, kneeY - tibLen * 0.70, kneeZ + (footZ - kneeZ) * 0.66],
        [footX, footY + 0.0035, footZ]
      ],
      t => 0.00105 * (1 - 0.50 * t) + 0.00030,
      36, 10
    ),
    MAT.limb
  );
  tibia.castShadow = true;
  g.add(tibia);

  // Tarsus — curls in to touch the glass pedestal
  const tarsus = new THREE.Mesh(
    taperedTube(
      [
        [footX, footY + 0.0035, footZ],
        [footX - 0.0022, footY + 0.0012, footZ - side * 0.0018],
        [footX - 0.0050, footY + 0.0002, footZ - side * 0.0044],
        [footX - 0.0074, footY + 0.0004, footZ - side * 0.0070]
      ],
      t => 0.00046 * (1 - 0.55 * t) + 0.00013,
      28, 8
    ),
    MAT.limb
  );
  g.add(tarsus);

  // Knee bead
  const knee = new THREE.Mesh(new THREE.SphereGeometry(0.00145, 14, 11), MAT.amberGlass);
  knee.position.set(kneeX, kneeY, kneeZ);
  g.add(knee);

  return g;
}

{
  const legRoot = new THREE.Group();
  mantis.add(legRoot);

  // Mid legs attach near the waist, hind legs further back along the abdomen.
  const configs = [
    { anchor: [-0.0035, 0.0015, 0], out: 0.0125, back: -0.0090, femLen: 0.0250, tibLen: 0.0300, hipY: 0.0000 },
    { anchor: [-0.0230, 0.0060, 0], out: 0.0120, back: -0.0165, femLen: 0.0300, tibLen: 0.0345, hipY: 0.0000 }
  ];

  for (const cfg of configs) {
    for (const s of [-1, 1]) {
      const leg = buildWalkingLeg(s, cfg);
      leg.position.set(cfg.anchor[0], cfg.anchor[1], cfg.anchor[2]);
      legRoot.add(leg);
    }
  }
}

/* ---------- Wings: wafer-thin transparent sheets with amber edge glow ---------- */
{
  const wingRoot = new THREE.Group();
  // Attach at the base of the thorax arch, just above the waist
  wingRoot.position.set(0.0035, 0.0090, 0);
  mantis.add(wingRoot);

  // Outer tegmina (leathery forewing analogue) + inner hindwing, per side
  const layers = [
    { len: 0.080, wid: 0.0300, thick: 0.00070, camber: 0.0075, yaw: 0.15, pitch: -0.10, roll: 0.30, y: 0.0022, mat: MAT.wing, rim: 0.00052 },
    { len: 0.068, wid: 0.0262, thick: 0.00050, camber: 0.0062, yaw: 0.30, pitch: -0.06, roll: 0.14, y: -0.0010, mat: MAT.wing, rim: 0.00040 }
  ];

  for (const s of [-1, 1]) {
    layers.forEach((L, li) => {
      const holder = new THREE.Group();
      holder.position.set(0, L.y, s * (0.0038 + li * 0.0022));
      // Wings sweep BACK over the abdomen: local +X points backwards
      holder.rotation.y = Math.PI + s * L.yaw;
      holder.rotation.z = L.pitch;
      holder.rotation.x = s * L.roll;
      wingRoot.add(holder);

      const sheetMesh = new THREE.Mesh(wingSheet(L.len, L.wid, L.thick, L.camber), L.mat);
      sheetMesh.position.x = L.len / 2 - 0.002;
      sheetMesh.castShadow = false;
      holder.add(sheetMesh);

      // Amber glowing rim
      const rim = new THREE.Mesh(wingRim(L.len, L.wid, L.camber, L.rim), MAT.amberGlow);
      rim.position.x = L.len / 2 - 0.002;
      holder.add(rim);

      // Faint radiating veins drawn as hair-thin amber-glass canes
      const veinCount = 7;
      for (let vI = 0; vI < veinCount; vI++) {
        const spread = (vI / (veinCount - 1)) * 2 - 1;   // -1..1
        const pts = [];
        const N = 16;
        for (let k = 0; k <= N; k++) {
          const u = k / N;
          const x = -L.len / 2 + u * L.len;
          const env = Math.pow(Math.sin(Math.PI * Math.min(Math.max(u, 0.0001), 0.9999)), 0.42);
          const chord = env * (0.55 + 0.45 * (1 - u * 0.55));
          const z = spread * (L.wid / 2) * chord * (0.30 + 0.70 * u);
          const w = spread;
          const y = -L.camber * u * u + L.camber * 0.30 * (1 - w * w) * u + L.thick * 0.55;
          pts.push(new THREE.Vector3(x, y, z));
        }
        const vGeo = new THREE.TubeGeometry(
          new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5),
          40, L.rim * 0.42, 5, false
        );
        const vein = new THREE.Mesh(vGeo, MAT.amberGlass);
        vein.position.x = L.len / 2 - 0.002;
        holder.add(vein);
      }

      // A thicker costal spar along the leading edge
      {
        const pts = [];
        const N = 20;
        for (let k = 0; k <= N; k++) {
          const u = k / N;
          const x = -L.len / 2 + u * L.len;
          const env = Math.pow(Math.sin(Math.PI * Math.min(Math.max(u, 0.0001), 0.9999)), 0.42);
          const chord = env * (0.55 + 0.45 * (1 - u * 0.55));
          const z = -(L.wid / 2) * chord * 0.96;
          const y = -L.camber * u * u + L.thick * 0.6;
          pts.push(new THREE.Vector3(x, y, z));
        }
        const spar = new THREE.Mesh(
          new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5), 60, L.rim * 1.15, 6, false),
          MAT.amberGlow
        );
        spar.position.x = L.len / 2 - 0.002;
        holder.add(spar);
      }
    });
  }
}

/* ============================================================
   Caustics — bright slivers cast on the base by the glass
   ============================================================ */
const causticGroup = new THREE.Group();
causticGroup.position.y = 0.0005;
scene.add(causticGroup);

const causticMats = [];
{
  // Each sliver is a thin elongated shape with an additive gradient shader.
  const slivers = 26;
  let s2 = 987654321;
  const rnd2 = () => { s2 = (s2 * 1103515245 + 12345) % 2147483648; return s2 / 2147483648; };

  const vs = `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `;
  const fs = `
    varying vec2 vUv;
    uniform vec3 uColor;
    uniform float uTime;
    uniform float uPhase;
    uniform float uIntensity;
    void main() {
      vec2 p = vUv - 0.5;
      // Elongated caustic filament: sharp across, soft along
      float across = exp(-pow(abs(p.y) * 7.5, 2.0));
      float along  = exp(-pow(abs(p.x) * 2.3, 3.0));
      float core   = exp(-pow(abs(p.y) * 26.0, 2.0));
      float flick  = 0.72 + 0.28 * sin(uTime * 0.8 + uPhase) * sin(uTime * 0.31 + uPhase * 1.7);
      float a = (across * 0.55 + core * 0.85) * along * uIntensity * flick;
      if (a < 0.002) discard;
      gl_FragColor = vec4(uColor * a, a);
    }
  `;

  const planeGeo = new THREE.PlaneGeometry(1, 1, 1, 1);
  const palette = [0xbdfff0, 0xd9fff4, 0xffd6a0, 0xa9f2ff, 0xffe9c2];

  for (let i = 0; i < slivers; i++) {
    const ang = rnd2() * Math.PI * 2;
    const dist = 0.030 + Math.pow(rnd2(), 0.65) * 0.115;
    const len = 0.020 + rnd2() * 0.075;
    const wid = 0.0035 + rnd2() * 0.012;
    const col = new THREE.Color(palette[Math.floor(rnd2() * palette.length)]);

    const mat = new THREE.ShaderMaterial({
      vertexShader: vs,
      fragmentShader: fs,
      uniforms: {
        uColor: { value: col },
        uTime: { value: 0 },
        uPhase: { value: rnd2() * 6.283 },
        uIntensity: { value: 0.35 + rnd2() * 0.95 }
      },
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: true,
      side: THREE.DoubleSide
    });
    causticMats.push(mat);

    const m = new THREE.Mesh(planeGeo, mat);
    m.scale.set(len, wid, 1);
    m.rotation.x = -Math.PI / 2;
    m.rotation.z = ang + (rnd2() - 0.5) * 1.1;
    m.position.set(Math.cos(ang) * dist, 0, Math.sin(ang) * dist);
    m.renderOrder = 2;
    causticGroup.add(m);
  }

  // A soft warm pool right under the pedestal
  const poolMat = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(0x9fe9d4) },
      uTime: { value: 0 },
      uPhase: { value: 1.3 },
      uIntensity: { value: 0.20 }
    },
    vertexShader: vs,
    fragmentShader: `
      varying vec2 vUv;
      uniform vec3 uColor;
      uniform float uTime;
      uniform float uIntensity;
      void main() {
        float d = length(vUv - 0.5) * 2.0;
        float a = smoothstep(1.0, 0.0, d);
        a = pow(a, 2.2) * uIntensity * (0.85 + 0.15 * sin(uTime * 0.6));
        if (a < 0.002) discard;
        gl_FragColor = vec4(uColor * a, a);
      }
    `,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide
  });
  causticMats.push(poolMat);
  const pool = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), poolMat);
  pool.scale.set(0.30, 0.30, 1);
  pool.rotation.x = -Math.PI / 2;
  pool.renderOrder = 1;
  causticGroup.add(pool);
}

/* ============================================================
   Ground plane — shadow catcher only
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 6),

ground.rotation.x = -Math.PI / 2;

/* ============================================================

const hemi = new THREE.HemisphereLight(0xbfe9ff, 0x16211d, 0.55);

const key = new THREE.DirectionalLight(0xffffff, 3.1);
key.position.set(0.34, 0.52, 0.30);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.05;
key.shadow.camera.far = 2.2;
key.shadow.camera.left = -0.20;
key.shadow.camera.right = 0.20;
key.shadow.camera.top = 0.24;
key.shadow.camera.bottom = -0.06;
key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.0035;
key.shadow.radius = 3.5;

const fill = new THREE.DirectionalLight(0x8fd3ff, 0.85);
fill.position.set(-0.44, 0.24, 0.34);

const rim = new THREE.DirectionalLight(0xffb066, 2.0);
rim.position.set(-0.24, 0.34, -0.46);

// Warm underlight that fires up through the pedestal — sells the refraction
const underGlow = new THREE.PointLight(0xffc48a, 0.55, 0.55, 2.0);
underGlow.position.set(0.0, 0.008, 0.0);
scene.add(underGlow);

// Cool sparkle light near the wings
const wingSpark = new THREE.PointLight(0xa9f7e0, 0.42, 0.40, 2.0);
wingSpark.position.set(-0.05, 0.16, 0.05);
scene.add(wingSpark);

/* ============================================================
   Frame & animate
   ============================================================ */
// Center the figurine horizontally on the world origin.
figurine.updateMatrixWorld(true);
{
  const box = new THREE.Box3().setFromObject(figurine);
  const c = box.getCenter(new THREE.Vector3());
  figurine.position.x -= c.x;
  figurine.position.z -= c.z;
  figurine.updateMatrixWorld(true);
  const box2 = new THREE.Box3().setFromObject(figurine);
  controls.target.set(0, (box2.min.y + box2.max.y) * 0.5, 0);
  controls.update();
}

const clock = new THREE.Clock();

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  for (const m of causticMats) m.uniforms.uTime.value = t;

  // Gentle breathing of the amber edge glow
  MAT.amberGlow.emissiveIntensity = 1.85 + 0.45 * Math.sin(t * 0.7);
  MAT.amberGlass.emissiveIntensity = 0.45 + 0.22 * Math.sin(t * 0.9 + 1.2);

  // Caustics drift with the turntable so they read as light through glass
  causticGroup.rotation.y = -t * 0.035;

  controls.update();
  renderer.render(scene, camera);
}
animate();
