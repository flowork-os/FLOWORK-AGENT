<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industrial Dump Truck</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #9db2bd;
      font-family: Arial, sans-serif;
    }
    canvas { display: block; }
    #label {
      position: fixed;
      top: 20px;
      left: 22px;
      color: #172026;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(255,255,255,.45);
    }
    #label strong {
      display: block;
      font-size: 18px;
      letter-spacing: .12em;
    }
    #label span {
      display: block;
      margin-top: 5px;
      font-size: 11px;
      letter-spacing: .08em;
      opacity: .72;
    }
    #bedButton {
      position: fixed;
      right: 22px;
      bottom: 22px;
      border: 1px solid rgba(255,255,255,.48);
      border-radius: 5px;
      padding: 11px 16px;
      color: white;
      background: rgba(24,31,34,.78);
      font-weight: bold;
      font-size: 11px;
      letter-spacing: .12em;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }
    #bedButton:hover { background: rgba(42,51,54,.9); }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="label">
    <strong>HD–65 DUMPER</strong>
    <span>DRAG TO ORBIT · SCROLL TO ZOOM</span>
  </div>
  <button id="bedButton">RAISE BED</button>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9eb3bd);
    scene.fog = new THREE.Fog(0x9eb3bd, 18, 42);

    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(10.5, 7.2, 11.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.45, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.42;
    controls.minDistance = 7;
    controls.maxDistance = 25;
    controls.maxPolarAngle = Math.PI * 0.49;

    const hemi = new THREE.HemisphereLight(0xd8efff, 0x554a39, 2.1);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff1d5, 4.5);
    sun.position.set(-8, 13, 7);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -12;
    sun.shadow.camera.right = 12;
    sun.shadow.camera.top = 11;
    sun.shadow.camera.bottom = -8;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 35;
    sun.shadow.bias = -0.00035;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xa9c9df, 1.0);
    fill.position.set(8, 5, -8);
    scene.add(fill);

    const yellow = new THREE.MeshStandardMaterial({
      color: 0xe8a900,
      roughness: 0.62,
      metalness: 0.28
    });
    const yellowDark = new THREE.MeshStandardMaterial({
      color: 0xb97500,
      roughness: 0.72,
      metalness: 0.3
    });
    const steel = new THREE.MeshStandardMaterial({
      color: 0x252a2c,
      roughness: 0.7,
      metalness: 0.68
    });
    const darkSteel = new THREE.MeshStandardMaterial({
      color: 0x121719,
      roughness: 0.74,
      metalness: 0.58
    });
    const rubber = new THREE.MeshStandardMaterial({
      color: 0x111212,
      roughness: 0.93,
      metalness: 0.02
    });
    const rim = new THREE.MeshStandardMaterial({
      color: 0x9b9689,
      roughness: 0.48,
      metalness: 0.82
    });
    const glass = new THREE.MeshStandardMaterial({
      color: 0x18333c,
      roughness: 0.18,
      metalness: 0.38
    });
    const interior = new THREE.MeshStandardMaterial({
      color: 0x62420e,
      roughness: 0.92,
      metalness: 0.12,
      side: THREE.DoubleSide
    });
    const chrome = new THREE.MeshStandardMaterial({
      color: 0xc5c9c7,
      roughness: 0.24,
      metalness: 0.95
    });
    const red = new THREE.MeshStandardMaterial({
      color: 0x8d0d07,
      emissive: 0x360300,
      emissiveIntensity: 1.2,
      roughness: 0.35
    });
    const lamp = new THREE.MeshStandardMaterial({
      color: 0xffe4a0,
      emissive: 0xffa62f,
      emissiveIntensity: 2.1,
      roughness: 0.22
    });

    function mesh(geometry, material, position, rotation, parent = scene) {
      const object = new THREE.Mesh(geometry, material);
      if (position) object.position.set(position[0], position[1], position[2]);
      if (rotation) object.rotation.set(rotation[0], rotation[1], rotation[2]);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function box(size, position, material = steel, rotation, parent = scene) {
      return mesh(
        new THREE.BoxGeometry(size[0], size[1], size[2]),
        material,
        position,
        rotation,
        parent
      );
    }

    function cylinder(radiusTop, radiusBottom, height, segments, position, material, rotation, parent = scene) {
      return mesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
        material,
        position,
        rotation,
        parent
      );
    }

    const groundGeometry = new THREE.PlaneGeometry(44, 44, 70, 70);
    const groundPositions = groundGeometry.attributes.position;
    const groundColors = [];
    const colorA = new THREE.Color(0x625b49);
    const colorB = new THREE.Color(0x81755c);

    for (let i = 0; i < groundPositions.count; i++) {
      const x = groundPositions.getX(i);
      const y = groundPositions.getY(i);
      const r = Math.sin(x * 1.73 + y * 0.41) * 0.035 +
                Math.sin(y * 2.17 - x * 0.31) * 0.025 +
                Math.sin((x + y) * 4.3) * 0.012;
      const flatten = Math.min(1, Math.max(0.2, (Math.abs(x) - 5) * 0.25 + 0.25));
      groundPositions.setZ(i, r * flatten);
      const mix = 0.34 + 0.22 * Math.sin(x * 0.63) * Math.sin(y * 0.77);
      const c = colorA.clone().lerp(colorB, mix);
      groundColors.push(c.r, c.g, c.b);
    }
    groundGeometry.setAttribute('color', new THREE.Float32BufferAttribute(groundColors, 3));
    groundGeometry.computeVertexNormals();

    const groundMaterial = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 1,
      metalness: 0
    });
    const ground = mesh(groundGeometry, groundMaterial, [0, -0.015, 0], [-Math.PI / 2, 0, 0]);
    ground.receiveShadow = true;
    ground.castShadow = false;

    const random = (() => {
      let seed = 8731;
      return () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };
    })();

    const rockMaterial = new THREE.MeshStandardMaterial({
      color: 0x595445,
      roughness: 1
    });
    for (let i = 0; i < 45; i++) {
      const angle = random() * Math.PI * 2;
      const radius = 6 + random() * 13;
      const scale = 0.04 + random() * 0.13;
      const rock = mesh(
        new THREE.DodecahedronGeometry(scale, 0),
        rockMaterial,
        [Math.cos(angle) * radius, scale * 0.45, Math.sin(angle) * radius],
        [random() * 2, random() * 2, random() * 2]
      );
      rock.scale.y = 0.45 + random() * 0.5;
    }

    const truck = new THREE.Group();
    truck.rotation.y = -0.08;
    scene.add(truck);

    box([7.3, 0.32, 1.02], [0.05, 1.18, -0.64], darkSteel, null, truck);
    box([7.3, 0.32, 1.02], [0.05, 1.18, 0.64], darkSteel, null, truck);
    box([0.3, 0.28, 2.18], [-2.65, 1.18, 0], steel, null, truck);
    box([0.3, 0.28, 2.18], [1.28, 1.18, 0], steel, null, truck);
    box([0.3, 0.28, 2.18], [2.77, 1.18, 0], steel, null, truck);
    box([5.3, 0.16, 0.18], [0.35, 1.47, -0.9], chrome, null, truck);
    box([5.3, 0.16, 0.18], [0.35, 1.47, 0.9], chrome, null, truck);

    const cabShape = new THREE.Shape();
    cabShape.moveTo(-3.78, 1.18);
    cabShape.lineTo(-1.62, 1.18);
    cabShape.lineTo(-1.62, 3.43);
    cabShape.lineTo(-3.37, 3.43);
    cabShape.lineTo(-3.78, 3.08);
    cabShape.closePath();

    const cabGeometry = new THREE.ExtrudeGeometry(cabShape, {
      depth: 2.16,
      bevelEnabled: true,
      bevelSegments: 2,
      bevelSize: 0.045,
      bevelThickness: 0.045,
      curveSegments: 1
    });
    cabGeometry.translate(0, 0, -1.08);
    mesh(cabGeometry, yellow, [0, 0, 0], null, truck);

    box([2.08, 0.16, 2.25], [-2.65, 3.52, 0], yellowDark, null, truck);
    box([2.28, 0.25, 2.28], [-2.68, 1.3, 0], yellowDark, null, truck);
    box([0.23, 0.52, 2.26], [-3.83, 1.72, 0], yellow, null, truck);

    box([0.045, 0.68, 1.58], [-3.795, 2.75, 0], glass, [0, 0, -0.11], truck);
    box([0.92, 0.72, 0.035], [-2.75, 2.82, -1.108], glass, null, truck);
    box([0.92, 0.72, 0.035], [-2.75, 2.82, 1.108], glass, null, truck);
    box([0.45, 0.72, 0.035], [-1.95, 2.82, -1.108], glass, null, truck);
    box([0.45, 0.72, 0.035], [-1.95, 2.82, 1.108], glass, null, truck);

    box([0.035, 1.35, 0.018], [-2.18, 2.0, -1.131], darkSteel, null, truck);
    box([0.035, 1.35, 0.018], [-2.18, 2.0, 1.131], darkSteel, null, truck);
    box([0.45, 0.055, 0.04], [-2.45, 2.23, -1.14], darkSteel, null, truck);
    box([0.45, 0.055, 0.04], [-2.45, 2.23, 1.14], darkSteel, null, truck);

    box([0.14, 0.7, 1.48], [-3.92, 2.03, 0], darkSteel, null, truck);
    for (let i = 0; i < 5; i++) {
      box([0.035, 0.48, 1.53], [-4.005, 1.82 + i * 0.105, 0], chrome, null, truck);
    }

    box([0.22, 0.28, 2.5], [-4.0, 1.15, 0], chrome, null, truck);
    box([0.22, 0.12, 0.72], [-4.04, 1.37, -0.74], darkSteel, null, truck);
    box([0.22, 0.12, 0.72], [-4.04, 1.37, 0.74], darkSteel, null, truck);

    box([0.08, 0.28, 0.42], [-4.045, 1.76, -0.76], lamp, null, truck);
    box([0.08, 0.28, 0.42], [-4.045, 1.76, 0.76], lamp, null, truck);

    box([0.55, 0.14, 0.22], [-1.78, 1.55, -1.19], steel, null, truck);
    box([0.55, 0.14, 0.22], [-1.78, 1.55, 1.19], steel, null, truck);
    box([0.95, 0.12, 0.26], [-2.3, 1.52, -1.28], steel, null, truck);
    box([0.95, 0.12, 0.26], [-2.3, 1.52, 1.28], steel, null, truck);

    for (const side of [-1, 1]) {
      box([0.055, 0.055, 0.55], [-3.2, 3.12, side * 1.33], chrome, null, truck);
      box([0.3, 0.42, 0.065], [-3.2, 3.12, side * 1.63], darkSteel, null, truck);
      box([0.25, 0.34, 0.025], [-3.2, 3.12, side * 1.67], glass, null, truck);
    }

    cylinder(0.13, 0.15, 2.5, 16, [-1.38, 2.35, 0.93], darkSteel, null, truck);
    cylinder(0.2, 0.16, 0.55, 16, [-1.38, 3.64, 0.93], darkSteel, null, truck);
    cylinder(0.12, 0.12, 0.28, 16, [-1.38, 3.97, 0.93], chrome, null, truck);

    function addWheel(x, z, width, parent) {
      const wheelGroup = new THREE.Group();
      wheelGroup.position.set(x, 0.83, z);
      parent.add(wheelGroup);

      cylinder(0.82, 0.82, width, 28, [0, 0, 0], rubber, [Math.PI / 2, 0, 0], wheelGroup);
      cylinder(0.47, 0.47, width + 0.025, 24, [0, 0, 0], rim, [Math.PI / 2, 0, 0], wheelGroup);
      cylinder(0.18, 0.18, width + 0.06, 20, [0, 0, 0], darkSteel, [Math.PI / 2, 0, 0], wheelGroup);

      for (let i = 0; i < 18; i++) {
        const theta = i / 18 * Math.PI * 2;
        const tread = box(
          [0.34, 0.14, width + 0.05],
          [0.855 * Math.cos(theta), 0.855 * Math.sin(theta), 0],
          rubber,
          [0, 0, theta + Math.PI / 2],
          wheelGroup
        );
        tread.castShadow = true;
      }

      for (let i = 0; i < 8; i++) {
        const theta = i / 8 * Math.PI * 2;
        cylinder(
          0.035, 0.035, width + 0.075, 8,
          [0.31 * Math.cos(theta), 0.31 * Math.sin(theta), 0],
          darkSteel,
          [Math.PI / 2, 0, 0],
          wheelGroup
        );
      }
    }

    addWheel(-2.62, -1.18, 0.42, truck);
    addWheel(-2.62, 1.18, 0.42, truck);

    for (const axleX of [1.18, 2.7]) {
      addWheel(axleX, -0.97, 0.36, truck);
      addWheel(axleX, -1.37, 0.36, truck);
      addWheel(axleX, 0.97, 0.36, truck);
      addWheel(axleX, 1.37, 0.36, truck);
    }

    for (const axleX of [-2.62, 1.18, 2.7]) {
      cylinder(0.13, 0.13, 2.7, 16, [axleX, 0.83, 0], darkSteel, [Math.PI / 2, 0, 0], truck);
      box([0.16, 0.32, 0.7], [axleX, 1.2, 0], steel, null, truck);
    }

    const tank = cylinder(0.37, 0.37, 1.55, 24, [-0.7, 1.0, -1.22], chrome, [Math.PI / 2, 0, 0], truck);
    tank.scale.z = 1;
    box([0.1, 0.82, 0.1], [-1.02, 1.0, -1.57], darkSteel, null, truck);
    box([0.1, 0.82, 0.1], [-0.38, 1.0, -1.57], darkSteel, null, truck);

    box([1.25, 0.62, 0.72], [-0.56, 1.0, 1.16], darkSteel, null, truck);
    for (let i = 0; i < 4; i++) {
      box([0.08, 0.03, 0.76], [-0.98 + i * 0.28, 1.325, 1.16], steel, null, truck);
    }

    const bedPivot = new THREE.Group();
    bedPivot.position.set(3.38, 1.72, 0);
    truck.add(bedPivot);

    box([4.35, 0.17, 2.32], [-1.86, 0.02, 0], interior, null, bedPivot);
    box([4.42, 0.16, 0.22], [-1.88, -0.13, -1.0], yellowDark, null, bedPivot);
    box([4.42, 0.16, 0.22], [-1.88, -0.13, 1.0], yellowDark, null, bedPivot);

    const sideShape = new THREE.Shape();
    sideShape.moveTo(-4.08, -0.02);
    sideShape.lineTo(0.34, -0.02);
    sideShape.lineTo(0.25, 1.48);
    sideShape.lineTo(-3.72, 1.69);
    sideShape.lineTo(-4.08, 1.5);
    sideShape.closePath();

    const sideGeometry = new THREE.ExtrudeGeometry(sideShape, {
      depth: 0.12,
      bevelEnabled: false
    });
    mesh(sideGeometry, yellow, [0, 0, -1.18], null, bedPivot);
    mesh(sideGeometry, yellow, [0, 0, 1.06], null, bedPivot);

    box([0.18, 1.64, 2.34], [-3.98, 0.79, 0], yellow, [0, 0, -0.03], bedPivot);
    box([0.17, 1.5, 2.3], [0.25, 0.73, 0], yellowDark, [0, 0, 0.06], bedPivot);
    box([0.04, 1.28, 2.02], [0.155, 0.73, 0], interior, [0, 0, 0.06], bedPivot);

    box([0.16, 0.16, 2.55], [-4.02, 1.57, 0], yellowDark, null, bedPivot);
    box([0.16, 0.16, 2.55], [0.24, 1.48, 0], yellowDark, null, bedPivot);

    for (const z of [-1.255, 1.255]) {
      for (let i = 0; i < 6; i++) {
        const x = -3.62 + i * 0.72;
        const rib = box([0.12, 1.42, 0.12], [x, 0.72, z], yellowDark, [0, 0, -0.075], bedPivot);
        rib.castShadow = true;
      }
      box([4.24, 0.13, 0.14], [-1.84, 0.16, z], yellowDark, null, bedPivot);
      box([4.0, 0.12, 0.14], [-1.89, 1.43, z], yellowDark, [0, 0, -0.045], bedPivot);
    }

    for (const z of [-0.76, 0.76]) {
      box([0.08, 0.28, 0.32], [0.35, 0.47, z], red, [0, 0, 0.06], bedPivot);
    }

    cylinder(0.14, 0.14, 2.54, 20, [0.31, 1.43, 0], darkSteel, [Math.PI / 2, 0, 0], bedPivot);
    cylinder(0.15, 0.15, 2.55, 20, [0.27, -0.08, 0], darkSteel, [Math.PI / 2, 0, 0], bedPivot);

    const hydraulicMaterial = new THREE.MeshStandardMaterial({
      color: 0x343a3b,
      roughness: 0.38,
      metalness: 0.85
    });
    const ramMaterial = new THREE.MeshStandardMaterial({
      color: 0xd0d2cb,
      roughness: 0.18,
      metalness: 0.96
    });

    function makeHydraulic(z) {
      const assembly = new THREE.Group();
      truck.add(assembly);

      const outer = cylinder(0.115, 0.115, 1, 16, [0, 0, 0], hydraulicMaterial, null, assembly);
      const inner = cylinder(0.065, 0.065, 1, 16, [0, 0, 0], ramMaterial, null, assembly);
      const pinA = cylinder(0.16, 0.16, 0.18, 16, [0, 0, 0], darkSteel, [Math.PI / 2, 0, 0], assembly);
      const pinB = cylinder(0.14, 0.14, 0.18, 16, [0, 0, 0], darkSteel, [Math.PI / 2, 0, 0], assembly);

      return { assembly, outer, inner, pinA, pinB, z };
    }

    const hydraulics = [makeHydraulic(-0.53), makeHydraulic(0.53)];
    const up = new THREE.Vector3(0, 1, 0);
    const basePoint = new THREE.Vector3();
    const attachPoint = new THREE.Vector3();
    const midpoint = new THREE.Vector3();
    const direction = new THREE.Vector3();

    function orientCylinder(object, a, b, lengthScale = 1) {
      direction.subVectors(b, a);
      const length = Math.max(0.001, direction.length());
      midpoint.addVectors(a, b).multiplyScalar(0.5);
      object.position.copy(midpoint);
      object.quaternion.setFromUnitVectors(up, direction.normalize());
      object.scale.set(1, length * lengthScale, 1);
    }

    function updateHydraulics() {
      truck.updateMatrixWorld(true);

      for (const h of hydraulics) {
        basePoint.set(0.35, 1.28, h.z);
        attachPoint.set(-2.55, -0.03, h.z);
        bedPivot.localToWorld(attachPoint);
        truck.worldToLocal(attachPoint);

        const split = basePoint.clone().lerp(attachPoint, 0.58);
        orientCylinder(h.outer, basePoint, split);
        orientCylinder(h.inner, split, attachPoint);
        h.pinA.position.copy(basePoint);
        h.pinB.position.copy(attachPoint);
      }
    }

    const button = document.getElementById('bedButton');
    let bedRaised = false;
    let targetBedAngle = 0.025;

    button.addEventListener('click', () => {
      bedRaised = !bedRaised;
      targetBedAngle = bedRaised ? -0.72 : 0.025;
      button.textContent = bedRaised ? 'LOWER BED' : 'RAISE BED';
    });

    window.addEventListener('keydown', event => {
      if (event.code === 'Space') {
        event.preventDefault();
        button.click();
      }
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.04);
      const blend = 1 - Math.pow(0.025, delta);
      bedPivot.rotation.z += (targetBedAngle - bedPivot.rotation.z) * blend;
      updateHydraulics();
      controls.update();
      renderer.render(scene, camera);
    }

    bedPivot.rotation.z = 0.025;
    updateHydraulics();
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
