<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diamond Solitaire Ring</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #e9e4df;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeeeae6);
scene.fog = new THREE.Fog(0xeeeae6, 11, 22);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.05, 50);
camera.position.set(6.2, 4.25, 7.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 5;
controls.maxDistance = 13;
controls.maxPolarAngle = Math.PI * 0.78;

const ring = new THREE.Group();
ring.rotation.y = -0.12;
scene.add(ring);

const metal = new THREE.MeshPhysicalMaterial({
  color: 0xe8c982,
  metalness: 1,
  roughness: 0.105,
  clearcoat: 1,
  clearcoatRoughness: 0.07,
  envMapIntensity: 1.7
});

const darkMetal = new THREE.MeshPhysicalMaterial({
  color: 0xb28b49,
  metalness: 1,
  roughness: 0.16,
  clearcoat: 0.7
});

const band = new THREE.Mesh(
  new THREE.TorusGeometry(1.72, 0.205, 32, 160),
  metal
);
band.castShadow = true;
band.receiveShadow = true;
ring.add(band);

function cylinderBetween(a, b, radius, material, radialSegments = 18) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius * 1.04, direction.length(), radialSegments, 1),
    material
  );
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.clone().normalize()
  );
  mesh.castShadow = true;
  return mesh;
}

const shoulderGeometry = new THREE.CapsuleGeometry(0.22, 0.72, 8, 20);
for (const side of [-1, 1]) {
  const shoulder = new THREE.Mesh(shoulderGeometry, metal);
  shoulder.position.set(side * 0.52, 1.78, 0);
  shoulder.rotation.z = side * 0.74;
  shoulder.scale.set(1, 1, 0.9);
  shoulder.castShadow = true;
  ring.add(shoulder);
}

const basket = new THREE.Mesh(
  new THREE.TorusGeometry(0.61, 0.075, 16, 64),
  darkMetal
);
basket.rotation.x = Math.PI / 2;
basket.position.y = 2.13;
basket.scale.z = 0.94;
basket.castShadow = true;
ring.add(basket);

for (const z of [-1, 1]) {
  const rail = cylinderBetween(
    new THREE.Vector3(-0.55, 2.11, z * 0.31),
    new THREE.Vector3(0.55, 2.11, z * 0.31),
    0.052,
    darkMetal,
    14
  );
  ring.add(rail);
}

const prongAngles = [
  Math.PI * 0.25,
  Math.PI * 0.75,
  Math.PI * 1.25,
  Math.PI * 1.75
];

for (const angle of prongAngles) {
  const start = new THREE.Vector3(
    Math.cos(angle) * 0.54,
    2.02,
    Math.sin(angle) * 0.54
  );
  const end = new THREE.Vector3(
    Math.cos(angle) * 0.67,
    2.79,
    Math.sin(angle) * 0.67
  );
  ring.add(cylinderBetween(start, end, 0.067, metal, 16));

  const claw = new THREE.Mesh(
    new THREE.SphereGeometry(0.105, 20, 12),
    metal
  );
  claw.position.copy(end);
  claw.scale.set(0.82, 1.25, 0.82);
  claw.castShadow = true;
  ring.add(claw);
}

function createDiamondGeometry() {
  const positions = [];
  const tableCount = 8;
  const girdleCount = 16;

  const table = [];
  const girdleTop = [];
  const girdleBottom = [];
  const pavilion = [];

  for (let i = 0; i < tableCount; i++) {
    const angle = i / tableCount * Math.PI * 2 + Math.PI / 8;
    table.push(new THREE.Vector3(
      Math.cos(angle) * 0.46,
      0.65,
      Math.sin(angle) * 0.46
    ));
    pavilion.push(new THREE.Vector3(
      Math.cos(angle) * 0.43,
      -0.49,
      Math.sin(angle) * 0.43
    ));
  }

  for (let i = 0; i < girdleCount; i++) {
    const angle = i / girdleCount * Math.PI * 2;
    const radius = i % 2 === 0 ? 0.80 : 0.79;
    girdleTop.push(new THREE.Vector3(
      Math.cos(angle) * radius,
      0.045,
      Math.sin(angle) * radius
    ));
    girdleBottom.push(new THREE.Vector3(
      Math.cos(angle) * radius,
      -0.055,
      Math.sin(angle) * radius
    ));
  }

  const tip = new THREE.Vector3(0, -1.08, 0);
  const tableCenter = new THREE.Vector3(0, 0.65, 0);

  function face(a, b, c) {
    positions.push(
      a.x, a.y, a.z,
      b.x, b.y, b.z,
      c.x, c.y, c.z
    );
  }

  for (let i = 0; i < tableCount; i++) {
    face(tableCenter, table[i], table[(i + 1) % tableCount]);
  }

  for (let i = 0; i < tableCount; i++) {
    const next = (i + 1) % tableCount;
    const g0 = (i * 2) % girdleCount;
    const g1 = (i * 2 + 1) % girdleCount;
    const g2 = (i * 2 + 2) % girdleCount;
    face(table[i], girdleTop[g0], girdleTop[g1]);
    face(table[i], girdleTop[g1], table[next]);
    face(table[next], girdleTop[g1], girdleTop[g2]);
  }

  for (let i = 0; i < girdleCount; i++) {
    const next = (i + 1) % girdleCount;
    face(girdleTop[i], girdleBottom[i], girdleBottom[next]);
    face(girdleTop[i], girdleBottom[next], girdleTop[next]);
  }

  for (let i = 0; i < tableCount; i++) {
    const next = (i + 1) % tableCount;
    const g0 = (i * 2) % girdleCount;
    const g1 = (i * 2 + 1) % girdleCount;
    const g2 = (i * 2 + 2) % girdleCount;
    face(pavilion[i], girdleBottom[g1], girdleBottom[g0]);
    face(pavilion[i], pavilion[next], girdleBottom[g1]);
    face(pavilion[next], girdleBottom[g2], girdleBottom[g1]);
    face(tip, pavilion[next], pavilion[i]);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  return geometry;
}

const diamondMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0,
  roughness: 0.025,
  transmission: 1,
  thickness: 2.2,
  ior: 2.417,
  dispersion: 0.12,
  reflectivity: 1,
  clearcoat: 1,
  clearcoatRoughness: 0,
  attenuationColor: new THREE.Color(0xe9f6ff),
  attenuationDistance: 7,
  envMapIntensity: 3.2,
  side: THREE.DoubleSide,
  transparent: true,
  opacity: 0.985
});

const diamond = new THREE.Mesh(createDiamondGeometry(), diamondMaterial);
diamond.position.y = 2.60;
diamond.rotation.y = Math.PI / 16;
diamond.castShadow = true;
ring.add(diamond);

const girdleHighlight = new THREE.Mesh(
  new THREE.TorusGeometry(0.795, 0.012, 6, 64),
  new THREE.MeshPhysicalMaterial({
    color: 0xdff7ff,
    metalness: 0,
    roughness: 0,
    transmission: 0.75,
    opacity: 0.65,
    transparent: true,
    emissive: 0x8ccfff,
    emissiveIntensity: 0.12
  })
);
girdleHighlight.rotation.x = Math.PI / 2;
girdleHighlight.position.y = 2.595;
ring.add(girdleHighlight);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xded8d2,
  roughness: 0.86,
  metalness: 0
});
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(12, 128),
  floorMaterial
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.94;
floor.receiveShadow = true;
scene.add(floor);

const softDisc = new THREE.Mesh(
  new THREE.CircleGeometry(3.7, 96),
  new THREE.MeshStandardMaterial({
    color: 0xeee9e4,
    roughness: 0.93,
    transparent: true,
    opacity: 0.72
  })
);
softDisc.rotation.x = -Math.PI / 2;
softDisc.position.y = -1.925;
softDisc.receiveShadow = true;
scene.add(softDisc);

scene.add(new THREE.HemisphereLight(0xfffbf4, 0x645b68, 1.75));

const key = new THREE.DirectionalLight(0xfff4df, 5.2);
key.position.set(4.5, 7.5, 5.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0003;
key.shadow.radius = 5;
scene.add(key);

const fill = new THREE.RectAreaLight(0xcfe7ff, 7, 4, 5);
fill.position.set(-4, 4.5, 3);
fill.lookAt(0, 1.2, 0);
scene.add(fill);

const rim = new THREE.RectAreaLight(0xffd7ad, 9, 3, 4);
rim.position.set(3, 3.5, -4);
rim.lookAt(0, 1.4, 0);
scene.add(rim);

const sparkleColors = [0x9bdcff, 0xffb5d9, 0xfff0b0, 0xb5b7ff];
const sparkleLights = [];
for (let i = 0; i < 4; i++) {
  const light = new THREE.PointLight(sparkleColors[i], 6, 5, 2);
  light.position.set(
    Math.cos(i * Math.PI / 2) * 2.3,
    3.0 + (i % 2) * 0.6,
    Math.sin(i * Math.PI / 2) * 2.3
  );
  scene.add(light);
  sparkleLights.push(light);
}

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  sparkleLights.forEach((light, i) => {
    const angle = t * (0.32 + i * 0.035) + i * Math.PI / 2;
    light.position.x = Math.cos(angle) * (2.15 + i * 0.08);
    light.position.z = Math.sin(angle) * (2.15 + i * 0.08);
    light.position.y = 2.85 + Math.sin(t * 0.7 + i) * 0.48;
    light.intensity = 4.8 + Math.sin(t * 1.7 + i * 1.9) * 1.4;
  });

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
