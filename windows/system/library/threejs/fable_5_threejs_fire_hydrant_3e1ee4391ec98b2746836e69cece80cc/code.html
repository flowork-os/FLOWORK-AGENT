<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fire Hydrant</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1a1d22}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d22);
scene.fog = new THREE.Fog(0x1a1d22, 12, 30);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(3.2, 2.4, 4.2);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.05, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 2.5;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.52;

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0x8fa3c0, 0x2b2620, 0.55));
const key = new THREE.DirectionalLight(0xfff1de, 2.2);
key.position.set(5, 7, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -4;
key.shadow.camera.right = key.shadow.camera.top = 4;
key.shadow.bias = -0.0004;
key.shadow.radius = 6;
scene.add(key);
const rim = new THREE.DirectionalLight(0x7fa8ff, 0.7);
rim.position.set(-5, 3, -4);
scene.add(rim);
const fill = new THREE.PointLight(0xffd9a8, 8, 12);
fill.position.set(-2, 1.5, 3);
scene.add(fill);

// ---------- Chipped paint texture ----------
function makePaintMaps(){
  const S = 1024;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  // base red with subtle tonal variation
  g.fillStyle = '#b3221c'; g.fillRect(0,0,S,S);
  for(let i=0;i<2600;i++){
    const x=Math.random()*S, y=Math.random()*S, r=2+Math.random()*22;
    const t=Math.random();
    g.fillStyle = t<0.5 ? 'rgba(140,20,15,0.10)' : 'rgba(220,70,50,0.08)';
    g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  // grime streaks
  for(let i=0;i<160;i++){
    const x=Math.random()*S, y=Math.random()*S;
    g.strokeStyle='rgba(60,30,20,0.06)'; g.lineWidth=1+Math.random()*3;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+(Math.random()-0.5)*20, y+40+Math.random()*120); g.stroke();
  }
  // rough map canvas
  const rc = document.createElement('canvas'); rc.width = rc.height = S;
  const rg = rc.getContext('2d');
  rg.fillStyle = '#a0a0a0'; rg.fillRect(0,0,S,S); // painted = fairly rough
  // metal map canvas
  const mc = document.createElement('canvas'); mc.width = mc.height = S;
  const mg = mc.getContext('2d');
  mg.fillStyle = '#000'; mg.fillRect(0,0,S,S);
  // chips: jagged blobs revealing bare metal
  const chip = (cx,cy,base)=>{
    const n = 7+Math.floor(Math.random()*6);
    const pts=[];
    for(let k=0;k<n;k++){
      const a=k/n*Math.PI*2, r=base*(0.5+Math.random());
      pts.push([cx+Math.cos(a)*r, cy+Math.sin(a)*r*0.8]);
    }
    const path=(ctx)=>{ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(const p of pts)ctx.lineTo(p[0],p[1]);ctx.closePath();};
    // dark rust rim
    path(g); g.fillStyle='rgba(70,35,25,0.9)'; g.save(); g.lineWidth=6; g.strokeStyle='rgba(70,35,25,0.9)'; g.stroke(); g.restore();
    // bare metal core
    g.save(); g.translate(cx,cy); g.scale(0.82,0.82); g.translate(-cx,-cy);
    path(g); g.fillStyle='#9a9d9f'; g.fill();
    path(g); g.fillStyle='rgba(255,255,255,0.25)'; g.fill();
    g.restore();
    // metalness / smoothness in chip
    mg.save(); mg.translate(cx,cy); mg.scale(0.82,0.82); mg.translate(-cx,-cy);
    path(mg); mg.fillStyle='#e8e8e8'; mg.fill(); mg.restore();
    rg.save(); rg.translate(cx,cy); rg.scale(0.82,0.82); rg.translate(-cx,-cy);
    path(rg); rg.fillStyle='#484848'; rg.fill(); rg.restore();
  };
  for(let i=0;i<46;i++) chip(Math.random()*S, Math.random()*S, 8+Math.random()*26);
  for(let i=0;i<70;i++) chip(Math.random()*S, Math.random()*S, 3+Math.random()*7);
  const map = new THREE.CanvasTexture(c);
  const roughnessMap = new THREE.CanvasTexture(rc);
  const metalnessMap = new THREE.CanvasTexture(mc);
  for(const t of [map, roughnessMap, metalnessMap]){
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.colorSpace = THREE.NoColorSpace;
    t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  }
  map.colorSpace = THREE.SRGBColorSpace;
  return {map, roughnessMap, metalnessMap};
}
const paintMaps = makePaintMaps();

const paint = new THREE.MeshStandardMaterial({
  color: 0xffffff, ...paintMaps, roughness: 1, metalness: 1
});
const paintPlain = new THREE.MeshStandardMaterial({ color: 0xb3221c, roughness: 0.45, metalness: 0.15 });
const bareMetal = new THREE.MeshStandardMaterial({ color: 0x8f9296, roughness: 0.42, metalness: 0.9 });
const chainMetal = new THREE.MeshStandardMaterial({ color: 0x6e7176, roughness: 0.5, metalness: 0.85 });

// ---------- Hydrant ----------
const hydrant = new THREE.Group();
scene.add(hydrant);
const add = (geo, mat, x=0,y=0,z=0)=>{
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x,y,z);
  m.castShadow = m.receiveShadow = true;
  hydrant.add(m);
  return m;
};

// Flanged base
add(new THREE.CylinderGeometry(0.52, 0.58, 0.10, 48), paint, 0, 0.05, 0);
add(new THREE.CylinderGeometry(0.44, 0.52, 0.14, 48), paint, 0, 0.17, 0);
// base bolts
for(let i=0;i<8;i++){
  const a = i/8*Math.PI*2 + Math.PI/8;
  const b = add(new THREE.CylinderGeometry(0.035, 0.035, 0.05, 6), bareMetal, Math.cos(a)*0.5, 0.105, Math.sin(a)*0.5);
  b.rotation.y = a;
}

// Barrel body
add(new THREE.CylinderGeometry(0.34, 0.40, 1.35, 48), paint, 0, 0.24 + 0.675, 0);

// Mid collar flange (bonnet joint)
add(new THREE.CylinderGeometry(0.41, 0.41, 0.09, 48), paint, 0, 1.62, 0);
for(let i=0;i<8;i++){
  const a = i/8*Math.PI*2;
  const b = add(new THREE.CylinderGeometry(0.03, 0.03, 0.045, 6), bareMetal, Math.cos(a)*0.385, 1.665, Math.sin(a)*0.385);
  b.rotation.y = a;
}

// Domed bonnet
const dome = add(new THREE.SphereGeometry(0.37, 48, 24, 0, Math.PI*2, 0, Math.PI/2), paint, 0, 1.66, 0);
dome.scale.y = 1.15;
// bonnet ridge
add(new THREE.TorusGeometry(0.30, 0.028, 12, 48).rotateX(Math.PI/2), paintPlain, 0, 1.90, 0);

// Pentagon operating nut
add(new THREE.CylinderGeometry(0.10, 0.115, 0.16, 5), paintPlain, 0, 2.12, 0);
add(new THREE.CylinderGeometry(0.045, 0.09, 0.05, 5), paintPlain, 0, 2.22, 0);

// ---------- Nozzle builder ----------
function nozzle(angle, radius, capR, len, y){
  const grp = new THREE.Group();
  grp.position.y = y;
  grp.rotation.y = angle;
  const mk = (geo, mat, z)=>{
    const m = new THREE.Mesh(geo, mat);
    m.rotation.x = Math.PI/2;
    m.position.z = z;
    m.castShadow = m.receiveShadow = true;
    grp.add(m);
    return m;
  };
  const r0 = 0.36;
  mk(new THREE.CylinderGeometry(radius, radius*1.18, len, 32), paintPlain, r0 + len/2 - 0.06);
  // cap with hex nut
  const capZ = r0 + len - 0.06;
  mk(new THREE.CylinderGeometry(capR, capR, 0.09, 32), paintPlain, capZ + 0.045);
  mk(new THREE.CylinderGeometry(capR*0.5, capR*0.55, 0.10, 6), paintPlain, capZ + 0.13);
  // chain lug on cap
  const lug = new THREE.Mesh(new THREE.TorusGeometry(0.035, 0.012, 8, 16), chainMetal);
  lug.position.set(0, -capR*0.75, capZ + 0.05);
  lug.castShadow = true;
  grp.add(lug);
  // chain: catenary of small torus links from cap lug to barrel
  const start = new THREE.Vector3(0, -capR*0.75, capZ + 0.05);
  const endA = angle => new THREE.Vector3(0, -capR*0.75 - 0.42, 0.30);
  const end = endA();
  const links = 11;
  for(let i=0;i<=links;i++){
    const t = i/links;
    const p = new THREE.Vector3().lerpVectors(start, end, t);
    p.y -= Math.sin(t*Math.PI)*0.14; // sag
    const link = new THREE.Mesh(new THREE.TorusGeometry(0.028, 0.009, 6, 12), chainMetal);
    link.position.copy(p);
    link.rotation.set(Math.random()*0.6, Math.random()*0.6, i%2 ? Math.PI/2 : 0);
    link.lookAt(new THREE.Vector3().lerpVectors(start,end,Math.min(1,t+0.1)).setY(p.y-0.02));
    if(i%2) link.rotateZ(Math.PI/2);
    link.castShadow = true;
    grp.add(link);
  }
  hydrant.add(grp);
}

// Large front pumper nozzle + two smaller side nozzles
nozzle(0, 0.36, 0.20, 0.30, 0.95);              // front (faces +Z)
nozzle(Math.PI/2, 0.36, 0.145, 0.24, 1.02);     // right
nozzle(-Math.PI/2, 0.36, 0.145, 0.24, 1.02);    // left
// front pumper barrel & cap slightly beefier
{
  const grp = new THREE.Group(); grp.position.y = 0.95;
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.155,0.175,0.34,32), paintPlain);
  m.rotation.x = Math.PI/2; m.position.z = 0.36+0.11; m.castShadow = m.receiveShadow = true;
  grp.add(m); hydrant.add(grp);
}

// ---------- Ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 64).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({color: 0x3a3f46, roughness: 0.95, metalness: 0})
);
ground.receiveShadow = true;
scene.add(ground);
// soft contact shadow disc
const shadowTex = (()=> {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128,128,10,128,128,128);
  grad.addColorStop(0,'rgba(0,0,0,0.45)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
})();
const softShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(2.4, 2.4).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({map: shadowTex, transparent: true, depthWrite: false})
);
softShadow.position.y = 0.005;
scene.add(softShadow);

// ---------- Loop ----------
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(()=>{
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
