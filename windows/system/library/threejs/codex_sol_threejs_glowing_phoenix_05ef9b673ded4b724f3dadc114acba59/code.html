<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowing Phoenix</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #180906 0%, #050203 55%, #010102 100%);
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020103);
scene.fog = new THREE.FogExp2(0x080204, 0.035);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.1, 15.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.38;
controls.enablePan = false;
controls.minDistance = 10;
controls.maxDistance = 24;
controls.target.set(0, -0.6, 0);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  1.45,
  0.7,
  0.15
);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

const phoenix = new THREE.Group();
phoenix.rotation.x = -0.04;
scene.add(phoenix);

const hotMaterial = new THREE.MeshStandardMaterial({
  color: 0xffe3a0,
  emissive: 0xff7a18,
  emissiveIntensity: 4.5,
  roughness: 0.35,
  metalness: 0.05
});

const goldMaterial = new THREE.MeshStandardMaterial({
  color: 0xff9e27,
  emissive: 0xff3a08,
  emissiveIntensity: 3.2,
  roughness: 0.48,
  metalness: 0.03
});

const emberMaterial = new THREE.MeshStandardMaterial({
  color: 0xb51b08,
  emissive: 0xff2400,
  emissiveIntensity: 3,
  roughness: 0.55
});

const darkEmberMaterial = new THREE.MeshStandardMaterial({
  color: 0x4f0905,
  emissive: 0xa50c02,
  emissiveIntensity: 2.4,
  roughness: 0.65
});

const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0xffffdd });
const blackEyeMaterial = new THREE.MeshBasicMaterial({ color: 0x140300 });

const plumeMaterial = new THREE.ShaderMaterial({
  side: THREE.DoubleSide,
  transparent: true,
  depthWrite: true,
  uniforms: {
    time: { value: 0 },
    opacity: { value: 0.98 }
  },
  vertexShader: `
    attribute float aHeat;
    varying float vHeat;
    varying vec3 vNormalWorld;
    varying vec3 vWorldPosition;
    void main() {
      vHeat = aHeat;
      vNormalWorld = normalize(mat3(modelMatrix) * normal);
      vec4 world = modelMatrix * vec4(position, 1.0);
      vWorldPosition = world.xyz;
      gl_Position = projectionMatrix * viewMatrix * world;
    }
  `,
  fragmentShader: `
    uniform float time;
    uniform float opacity;
    varying float vHeat;
    varying vec3 vNormalWorld;
    varying vec3 vWorldPosition;

    vec3 palette(float t) {
      vec3 whiteHot = vec3(3.8, 2.8, 1.35);
      vec3 gold = vec3(2.8, 0.75, 0.08);
      vec3 scarlet = vec3(1.45, 0.055, 0.012);
      vec3 ember = vec3(0.20, 0.003, 0.001);
      if (t < 0.28) return mix(whiteHot, gold, t / 0.28);
      if (t < 0.72) return mix(gold, scarlet, (t - 0.28) / 0.44);
      return mix(scarlet, ember, (t - 0.72) / 0.28);
    }

    void main() {
      vec3 viewDir = normalize(cameraPosition - vWorldPosition);
      float rim = pow(1.0 - abs(dot(normalize(vNormalWorld), viewDir)), 2.2);
      float pulse = 0.93 + 0.07 * sin(time * 2.4 + vWorldPosition.y * 3.0 + vWorldPosition.x);
      vec3 color = palette(clamp(vHeat, 0.0, 1.0)) * pulse;
      color += vec3(1.25, 0.22, 0.025) * rim;
      gl_FragColor = vec4(color, opacity);
    }
  `
});

function ellipsoid(radius, scale, material, position) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 24), material);
  mesh.scale.copy(scale);
  mesh.position.copy(position);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  phoenix.add(mesh);
  return mesh;
}

function makeTaperedTube(points, startRadius, endRadius, material, radialSegments = 8, tubularSegments = 36, heatStart = 0, heatEnd = 1) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.45);
  const positions = [];
  const normals = [];
  const heats = [];
  const indices = [];
  const zAxis = new THREE.Vector3(0, 0, 1);
  const xAxis = new THREE.Vector3(1, 0, 0);

  for (let i = 0; i <= tubularSegments; i++) {
    const t = i / tubularSegments;
    const point = curve.getPointAt(t);
    const tangent = curve.getTangentAt(t).normalize();
    let normal = new THREE.Vector3().crossVectors(tangent, zAxis);
    if (normal.lengthSq() < 0.0001) normal.crossVectors(tangent, xAxis);
    normal.normalize();
    const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
    const taper = Math.pow(1 - t, 0.55);
    const radius = THREE.MathUtils.lerp(endRadius, startRadius, taper);

    for (let j = 0; j < radialSegments; j++) {
      const angle = j / radialSegments * Math.PI * 2;
      const radial = normal.clone().multiplyScalar(Math.cos(angle))
        .add(binormal.clone().multiplyScalar(Math.sin(angle)));
      const p = point.clone().addScaledVector(radial, radius);
      positions.push(p.x, p.y, p.z);
      normals.push(radial.x, radial.y, radial.z);
      heats.push(THREE.MathUtils.lerp(heatStart, heatEnd, t));
    }
  }

  for (let i = 0; i < tubularSegments; i++) {
    for (let j = 0; j < radialSegments; j++) {
      const a = i * radialSegments + j;
      const b = i * radialSegments + (j + 1) % radialSegments;
      const c = (i + 1) * radialSegments + (j + 1) % radialSegments;
      const d = (i + 1) * radialSegments + j;
      indices.push(a, b, d, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geometry.setAttribute('aHeat', new THREE.Float32BufferAttribute(heats, 1));
  geometry.setIndex(indices);
  geometry.computeBoundingSphere();

  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  phoenix.add(mesh);
  return mesh;
}

function makeRibbonFeather(points, width, zOffset = 0, heatStart = 0.08, heatEnd = 1) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.48);
  const segments = 34;
  const positions = [];
  const heats = [];
  const indices = [];
  const zAxis = new THREE.Vector3(0, 0, 1);

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const point = curve.getPointAt(t);
    point.z += zOffset;
    const tangent = curve.getTangentAt(t).normalize();
    let side = new THREE.Vector3().crossVectors(zAxis, tangent);
    if (side.lengthSq() < 0.0001) side.set(1, 0, 0);
    side.normalize();

    const baseTaper = Math.sin(Math.PI * Math.pow(t, 0.8));
    const tipTaper = Math.pow(1 - t, 0.22);
    const halfWidth = width * Math.max(0.012, baseTaper * tipTaper);
    const left = point.clone().addScaledVector(side, halfWidth);
    const ridge = point.clone();
    ridge.z += 0.055 * Math.sin(Math.PI * t);
    const right = point.clone().addScaledVector(side, -halfWidth);

    positions.push(left.x, left.y, left.z);
    positions.push(ridge.x, ridge.y, ridge.z);
    positions.push(right.x, right.y, right.z);
    const heat = THREE.MathUtils.lerp(heatStart, heatEnd, Math.pow(t, 1.05));
    heats.push(heat, heat, heat);
  }

  for (let i = 0; i < segments; i++) {
    const a = i * 3;
    const b = a + 1;
    const c = a + 2;
    const d = a + 3;
    const e = a + 4;
    const f = a + 5;
    indices.push(a, d, b, b, d, e, b, e, c, c, e, f);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('aHeat', new THREE.Float32BufferAttribute(heats, 1));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();

  const mesh = new THREE.Mesh(geometry, plumeMaterial);
  mesh.castShadow = true;
  phoenix.add(mesh);
  return mesh;
}

function makeConeBetween(start, end, radius, material) {
  const direction = end.clone().sub(start);
  const length = direction.length();
  const mesh = new THREE.Mesh(new THREE.ConeGeometry(radius, length, 20), material);
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  phoenix.add(mesh);
  return mesh;
}

ellipsoid(1, new THREE.Vector3(0.72, 1.45, 0.64), hotMaterial, new THREE.Vector3(0, 0.15, 0.05));
ellipsoid(0.74, new THREE.Vector3(0.73, 1.12, 0.68), goldMaterial, new THREE.Vector3(0, -0.55, -0.02));
ellipsoid(0.48, new THREE.Vector3(0.86, 0.92, 0.8), hotMaterial, new THREE.Vector3(0, 1.75, 0.04));

makeTaperedTube([
  new THREE.Vector3(0, 0.72, 0),
  new THREE.Vector3(0.04, 1.15, 0.02),
  new THREE.Vector3(-0.04, 1.55, 0.02),
  new THREE.Vector3(0, 1.82, 0.04)
], 0.38, 0.28, hotMaterial, 12, 28, 0, 0.2);

const beakStart = new THREE.Vector3(0, 1.72, 0.43);
const beakEnd = new THREE.Vector3(0, 1.55, 1.28);
makeConeBetween(beakStart, beakEnd, 0.18, goldMaterial);

for (const side of [-1, 1]) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.075, 16, 12), eyeMaterial);
  eye.position.set(side * 0.25, 1.91, 0.39);
  phoenix.add(eye);

  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.034, 12, 8), blackEyeMaterial);
  pupil.position.set(side * 0.255, 1.91, 0.458);
  phoenix.add(pupil);
}

for (let i = 0; i < 5; i++) {
  const side = (i - 2) * 0.11;
  makeTaperedTube([
    new THREE.Vector3(side * 0.28, 2.05, -0.05),
    new THREE.Vector3(side * 0.65, 2.42 + Math.abs(side) * 0.3, -0.06),
    new THREE.Vector3(side, 2.72 - Math.abs(side) * 0.5, -0.12)
  ], 0.105, 0.018, plumeMaterial, 7, 18, 0.05, 0.78);
}

for (const side of [-1, 1]) {
  makeTaperedTube([
    new THREE.Vector3(side * 0.35, 0.75, -0.05),
    new THREE.Vector3(side * 1.65, 1.55, -0.12),
    new THREE.Vector3(side * 3.65, 2.0, -0.18),
    new THREE.Vector3(side * 5.55, 1.65, -0.16)
  ], 0.24, 0.055, plumeMaterial, 9, 45, 0.02, 0.72);

  for (let i = 0; i < 14; i++) {
    const q = i / 13;
    const rootX = side * (0.28 + q * 1.9);
    const rootY = 0.72 + q * 0.8;
    const tipX = side * (3.05 + q * 3.55);
    const tipY = 3.2 - q * 3.5;
    const sweep = 0.25 + q * 0.85;

    makeRibbonFeather([
      new THREE.Vector3(rootX, rootY, -0.12 + i * 0.006),
      new THREE.Vector3(side * (1.7 + q * 1.3), 1.95 - q * 0.35, -0.14),
      new THREE.Vector3(side * (3.0 + q * 2.2), 2.6 - q * 1.6, -0.12),
      new THREE.Vector3(tipX, tipY - sweep * 0.25, -0.08)
    ], 0.48 - q * 0.08, -0.035 + i * 0.003, 0.04 + q * 0.07, 0.78 + q * 0.22);
  }

  for (let i = 0; i < 10; i++) {
    const q = i / 9;
    makeRibbonFeather([
      new THREE.Vector3(side * (0.34 + q * 1.5), 0.95 + q * 0.55, 0.02),
      new THREE.Vector3(side * (1.4 + q * 1.3), 2.0 + q * 0.15, 0.01),
      new THREE.Vector3(side * (2.5 + q * 1.5), 3.15 - q * 0.2, 0.02),
      new THREE.Vector3(side * (3.45 + q * 2.1), 3.45 - q * 0.55, 0.03)
    ], 0.39, 0.03 + i * 0.004, 0.02, 0.75 + q * 0.2);
  }

  for (let i = 0; i < 6; i++) {
    const q = i / 5;
    makeRibbonFeather([
      new THREE.Vector3(side * 0.42, 0.6 - q * 0.12, 0.08),
      new THREE.Vector3(side * (1.15 + q * 0.4), 0.45 - q * 0.45, 0.1),
      new THREE.Vector3(side * (2.35 + q * 0.65), 0.15 - q * 0.95, 0.08),
      new THREE.Vector3(side * (3.55 + q * 0.65), -0.2 - q * 1.1, 0.04)
    ], 0.4, 0.06, 0.08, 0.96);
  }
}

const tailSpecs = [
  { x: -2.3, y: -5.7, bend: -1.5, width: 0.48 },
  { x: -1.25, y: -6.25, bend: -0.75, width: 0.55 },
  { x: -0.38, y: -6.65, bend: -0.18, width: 0.61 },
  { x: 0.38, y: -6.65, bend: 0.18, width: 0.61 },
  { x: 1.25, y: -6.25, bend: 0.75, width: 0.55 },
  { x: 2.3, y: -5.7, bend: 1.5, width: 0.48 }
];

tailSpecs.forEach((spec, index) => {
  makeRibbonFeather([
    new THREE.Vector3((index - 2.5) * 0.12, -0.55, -0.08),
    new THREE.Vector3(spec.bend * 0.25, -2.0, -0.07),
    new THREE.Vector3(spec.bend * 0.7, -4.1, -0.04),
    new THREE.Vector3(spec.x, spec.y, 0)
  ], spec.width, -0.08 + index * 0.012, 0.02, 1);
});

for (const side of [-1, 1]) {
  for (let i = 0; i < 3; i++) {
    makeRibbonFeather([
      new THREE.Vector3(side * (0.16 + i * 0.08), -0.55, 0.02),
      new THREE.Vector3(side * (0.85 + i * 0.25), -1.8, 0.05),
      new THREE.Vector3(side * (2.2 + i * 0.55), -3.0, 0.08),
      new THREE.Vector3(side * (3.7 + i * 0.55), -3.75 - i * 0.35, 0.1)
    ], 0.4, 0.02, 0.08, 1);
  }
}

for (const side of [-1, 1]) {
  makeTaperedTube([
    new THREE.Vector3(side * 0.26, -0.67, 0.33),
    new THREE.Vector3(side * 0.31, -1.2, 0.42),
    new THREE.Vector3(side * 0.25, -1.62, 0.45)
  ], 0.095, 0.06, darkEmberMaterial, 7, 18, 0.2, 0.8);

  for (let toe = -1; toe <= 1; toe++) {
    makeTaperedTube([
      new THREE.Vector3(side * 0.25, -1.58, 0.44),
      new THREE.Vector3(side * (0.27 + toe * 0.12), -1.72, 0.65),
      new THREE.Vector3(side * (0.28 + toe * 0.17), -1.69, 0.86)
    ], 0.04, 0.012, darkEmberMaterial, 6, 12, 0.35, 0.85);
  }
}

const innerGlow = new THREE.Mesh(
  new THREE.SphereGeometry(0.78, 24, 18),
  new THREE.MeshBasicMaterial({
    color: 0xff5a0a,
    transparent: true,
    opacity: 0.15,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
innerGlow.scale.set(1.2, 1.8, 1);
innerGlow.position.set(0, 0.2, -0.25);
phoenix.add(innerGlow);

const warmLight = new THREE.PointLight(0xff5a16, 85, 18, 1.7);
warmLight.position.set(0, 0.2, 2.2);
warmLight.castShadow = true;
warmLight.shadow.mapSize.set(1024, 1024);
scene.add(warmLight);

const upperLight = new THREE.PointLight(0xffbb62, 45, 12, 2);
upperLight.position.set(0, 3.5, 3);
scene.add(upperLight);

const rimLight = new THREE.DirectionalLight(0x7120ff, 1.2);
rimLight.position.set(-4, 5, -5);
scene.add(rimLight);

scene.add(new THREE.HemisphereLight(0x240c35, 0x180200, 0.6));

const emberCount = 260;
const emberPositions = new Float32Array(emberCount * 3);
const emberColors = new Float32Array(emberCount * 3);
const emberSizes = new Float32Array(emberCount);
const emberSeeds = [];

for (let i = 0; i < emberCount; i++) {
  const region = Math.random();
  let x;
  let y;
  let z;

  if (region < 0.48) {
    const side = Math.random() < 0.5 ? -1 : 1;
    x = side * THREE.MathUtils.randFloat(4.3, 6.8);
    y = THREE.MathUtils.randFloat(0.3, 4.1);
    z = THREE.MathUtils.randFloat(-0.5, 0.8);
  } else if (region < 0.76) {
    x = THREE.MathUtils.randFloatSpread(4.8);
    y = THREE.MathUtils.randFloat(-5.7, -0.3);
    z = THREE.MathUtils.randFloat(-0.3, 0.9);
  } else {
    x = THREE.MathUtils.randFloatSpread(3.0);
    y = THREE.MathUtils.randFloat(-0.5, 4.3);
    z = THREE.MathUtils.randFloat(-0.7, 1.0);
  }

  emberPositions[i * 3] = x;
  emberPositions[i * 3 + 1] = y;
  emberPositions[i * 3 + 2] = z;

  const color = new THREE.Color().setHSL(THREE.MathUtils.randFloat(0.015, 0.105), 1, THREE.MathUtils.randFloat(0.48, 0.82));
  emberColors[i * 3] = color.r * 2;
  emberColors[i * 3 + 1] = color.g * 1.4;
  emberColors[i * 3 + 2] = color.b;

  emberSizes[i] = THREE.MathUtils.randFloat(1.5, 5);
  emberSeeds.push({
    baseX: x,
    baseY: y,
    phase: Math.random() * Math.PI * 2,
    speed: THREE.MathUtils.randFloat(0.16, 0.55),
    sway: THREE.MathUtils.randFloat(0.05, 0.32),
    range: THREE.MathUtils.randFloat(1.2, 3.8)
  });
}

const emberGeometry = new THREE.BufferGeometry();
emberGeometry.setAttribute('position', new THREE.BufferAttribute(emberPositions, 3));
emberGeometry.setAttribute('color', new THREE.BufferAttribute(emberColors, 3));
emberGeometry.setAttribute('size', new THREE.BufferAttribute(emberSizes, 1));

const emberPointsMaterial = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  vertexColors: true,
  blending: THREE.AdditiveBlending,
  uniforms: { time: { value: 0 } },
  vertexShader: `
    attribute float size;
    varying vec3 vColor;
    varying float vTwinkle;
    uniform float time;
    void main() {
      vColor = color;
      vTwinkle = 0.55 + 0.45 * sin(time * 4.0 + position.x * 2.7 + position.y);
      vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = size * (16.0 / max(1.0, -mvPosition.z));
      gl_Position = projectionMatrix * mvPosition;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    varying float vTwinkle;
    void main() {
      vec2 p = gl_PointCoord - 0.5;
      float d = length(p);
      if (d > 0.5) discard;
      float alpha = smoothstep(0.5, 0.0, d);
      alpha *= alpha * vTwinkle;
      gl_FragColor = vec4(vColor * (1.2 + alpha * 1.8), alpha);
    }
  `
});

const embers = new THREE.Points(emberGeometry, emberPointsMaterial);
scene.add(embers);

const hazeGeometry = new THREE.BufferGeometry();
const hazeCount = 90;
const hazePositions = new Float32Array(hazeCount * 3);
for (let i = 0; i < hazeCount; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = THREE.MathUtils.randFloat(7, 18);
  hazePositions[i * 3] = Math.cos(angle) * radius;
  hazePositions[i * 3 + 1] = THREE.MathUtils.randFloat(-8, 9);
  hazePositions[i * 3 + 2] = THREE.MathUtils.randFloat(-10, -3);
}
hazeGeometry.setAttribute('position', new THREE.BufferAttribute(hazePositions, 3));
const haze = new THREE.Points(
  hazeGeometry,
  new THREE.PointsMaterial({
    color: 0x7d2419,
    size: 0.055,
    transparent: true,
    opacity: 0.4,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
scene.add(haze);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  plumeMaterial.uniforms.time.value = elapsed;
  emberPointsMaterial.uniforms.time.value = elapsed;

  const positions = emberGeometry.attributes.position.array;
  for (let i = 0; i < emberCount; i++) {
    const seed = emberSeeds[i];
    const rise = (elapsed * seed.speed) % seed.range;
    positions[i * 3] = seed.baseX + Math.sin(elapsed * 1.4 + seed.phase + rise) * seed.sway;
    positions[i * 3 + 1] = seed.baseY + rise;
    positions[i * 3 + 2] += Math.sin(elapsed * 0.9 + seed.phase) * 0.0007;
  }
  emberGeometry.attributes.position.needsUpdate = true;

  innerGlow.scale.x = 1.2 + Math.sin(elapsed * 2.2) * 0.035;
  innerGlow.scale.y = 1.8 + Math.sin(elapsed * 2.0 + 0.7) * 0.05;
  warmLight.intensity = 82 + Math.sin(elapsed * 3.1) * 7 + Math.sin(elapsed * 7.3) * 2;
  phoenix.position.y = Math.sin(elapsed * 1.15) * 0.045;
  phoenix.rotation.z = Math.sin(elapsed * 0.55) * 0.012;
  haze.rotation.z = elapsed * 0.004;

  controls.update();
  composer.render();
}

animate();
