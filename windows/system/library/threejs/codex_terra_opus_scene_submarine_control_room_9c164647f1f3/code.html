<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Submarine Control Room</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#07100e}
canvas{display:block}
#label{position:fixed;left:18px;bottom:15px;color:#94a89d;font:11px/1.35 monospace;letter-spacing:.12em;opacity:.68;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">SSV ARGONAUT · CONTROL ROOM · DEPTH 184M</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07100e);
scene.fog = new THREE.FogExp2(0x07100e, 0.055);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 80);
camera.position.set(8.8, 5.5, 10.5);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.34;
controls.minDistance = 5;
controls.maxDistance = 17;
controls.maxPolarAngle = Math.PI * 0.48;

let seed = 918273;
const rand = () => {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
};
const range = (a,b) => a + (b-a) * rand();

const texCanvas = (w,h,paint) => {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const x = c.getContext("2d");
  paint(x,w,h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
};

const steelTexture = texCanvas(256,256,(x,w,h) => {
  x.fillStyle="#34413d"; x.fillRect(0,0,w,h);
  for(let i=0;i<5000;i++){
    const a=Math.floor(range(8,32));
    x.fillStyle=`rgba(${a},${a+8},${a+5},${range(.02,.13)})`;
    x.fillRect(rand()*w,rand()*h,1+rand()*3,1);
  }
  for(let i=0;i<22;i++){
    x.strokeStyle="rgba(185,190,163,.055)";
    x.lineWidth=1; x.beginPath(); x.moveTo(0,rand()*h); x.lineTo(w,rand()*h); x.stroke();
  }
});
steelTexture.repeat.set(2,2);

const floorTexture = texCanvas(256,256,(x,w,h) => {
  x.fillStyle="#1d2a28"; x.fillRect(0,0,w,h);
  x.strokeStyle="rgba(151,158,127,.18)"; x.lineWidth=3;
  for(let y=0;y<h;y+=42){ x.beginPath(); x.moveTo(0,y); x.lineTo(w,y); x.stroke(); }
  for(let i=0;i<1400;i++){
    x.fillStyle=`rgba(2,8,7,${range(.05,.22)})`;
    x.fillRect(rand()*w,rand()*h,2,2);
  }
});
floorTexture.repeat.set(5,5);

const green = new THREE.MeshStandardMaterial({color:0x29443d,roughness:.72,metalness:.76,map:steelTexture});
const dark = new THREE.MeshStandardMaterial({color:0x111a19,roughness:.6,metalness:.88});
const edge = new THREE.MeshStandardMaterial({color:0x657168,roughness:.43,metalness:.9});
const brass = new THREE.MeshStandardMaterial({color:0x806235,roughness:.38,metalness:.85});
const copper = new THREE.MeshStandardMaterial({color:0x8a4528,roughness:.38,metalness:.85});
const rubber = new THREE.MeshStandardMaterial({color:0x101514,roughness:.92,metalness:.05});
const red = new THREE.MeshStandardMaterial({color:0x5a100d,roughness:.42,metalness:.3,emissive:0x250000});
const paper = new THREE.MeshStandardMaterial({color:0xa99d71,roughness:.9,metalness:0});
const glowGreen = new THREE.MeshStandardMaterial({color:0x25e887,emissive:0x10b653,emissiveIntensity:2.4,roughness:.28});
const warm = new THREE.MeshStandardMaterial({color:0xffa844,emissive:0xff5e18,emissiveIntensity:2,roughness:.35});
const alertMat = new THREE.MeshStandardMaterial({color:0xef1712,emissive:0xe60000,emissiveIntensity:2.5,roughness:.25});

const group = (...items) => {
  const g = new THREE.Group();
  items.forEach(i=>g.add(i));
  return g;
};
const box = (w,h,d,mat,pos=[0,0,0]) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(...pos); m.castShadow=m.receiveShadow=true; return m;
};
const cyl = (r1,r2,h,mat,pos=[0,0,0],rot=null,seg=20) => {
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),mat);
  m.position.set(...pos); if(rot)m.rotation.set(...rot);
  m.castShadow=m.receiveShadow=true; return m;
};
const sphere = (r,mat,pos=[0,0,0]) => {
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,20,12),mat);
  m.position.set(...pos);m.castShadow=m.receiveShadow=true;return m;
};

const floor = box(15,.22,12,new THREE.MeshStandardMaterial({color:0x25332f,map:floorTexture,roughness:.7,metalness:.55}),[0,-.12,0]);
scene.add(floor);

const ceiling = box(15,.22,12,dark,[0,6.4,0]);
scene.add(ceiling);

function wallPanel(x,y,z,w,h,rotY=0){
  const g=new THREE.Group();
  g.position.set(x,y,z);g.rotation.y=rotY;
  const slab=box(w,h,.16,green,[0,0,0]); g.add(slab);
  for(let i=0;i<4;i++){
    const xx=(i<2?-1:1)*(w*.44);
    const yy=(i%2?-1:1)*(h*.42);
    g.add(sphere(.045,brass,[xx,yy,.11]));
  }
  g.add(box(w-.22,.025,.05,edge,[0,0,.11]));
  g.add(box(.025,h-.22,.05,edge,[0,0,.11]));
  scene.add(g); return g;
}
for(let x=-6.4;x<=6.4;x+=2.16) wallPanel(x,3,-5.76,2.06,5.8);
for(let z=-3.8;z<=4.8;z+=2.16) {
  wallPanel(-7.38,3,z,2.06,5.8,Math.PI/2);
  wallPanel(7.38,3,z,2.06,5.8,Math.PI/2);
}

for(let x=-6.4;x<=6.4;x+=2.16) scene.add(cyl(.055,.055,6.0,edge,[x,3,-5.58]));
for(let z=-4.8;z<=4.8;z+=2.16) {
  scene.add(cyl(.055,.055,6.0,edge,[-7.2,3,z]));
  scene.add(cyl(.055,.055,6.0,edge,[7.2,3,z]));
}

const pipes=[];
function pipe(points,r=.11,mat=copper){
  const g=new THREE.Group();
  for(let i=0;i<points.length-1;i++){
    const a=new THREE.Vector3(...points[i]), b=new THREE.Vector3(...points[i+1]);
    const d=b.clone().sub(a), mid=a.clone().add(b).multiplyScalar(.5);
    const m=cyl(r,r,d.length(),mat,mid.toArray());
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
    g.add(m);
    if(i>0) g.add(sphere(r*1.16,mat,a.toArray()));
  }
  scene.add(g); return g;
}
pipe([[-6.9,5.55,-5.35],[-3.2,5.55,-5.35],[-3.2,4.78,-5.35],[-.7,4.78,-5.35]],.13,copper);
pipe([[6.9,5.75,-5.36],[3.8,5.75,-5.36],[3.8,4.25,-5.36],[2.25,4.25,-5.36]],.1,brass);
pipe([[-7.05,1.0,4.9],[-7.05,3.8,4.9],[-7.05,3.8,2.6]],.16,copper);
pipe([[6.98,.8,4.8],[6.98,2.7,4.8],[5.1,2.7,4.8],[5.1,3.65,4.8]],.12,copper);
pipe([[-6.7,5.98,4.8],[6.65,5.98,4.8]],.1,edge);

function valve(x,y,z,r=.36,rot=0){
  const g=new THREE.Group(); g.position.set(x,y,z); g.rotation.z=rot;
  g.add(cyl(r*.26,r*.26,.15,brass,[0,0,0],[Math.PI/2,0,0],16));
  const ring=new THREE.Mesh(new THREE.TorusGeometry(r,.045,8,24),brass);
  ring.rotation.x=Math.PI/2; ring.position.z=.09; g.add(ring);
  for(let i=0;i<5;i++){
    const a=i*Math.PI*2/5;
    const spoke=box(r*.82,.06,.055,brass,[Math.cos(a)*r*.4,Math.sin(a)*r*.4,.11]);
    spoke.rotation.z=a;g.add(spoke);
  }
  g.userData.spin=range(-.28,.28); scene.add(g); return g;
}
const valves=[];
[[-5.65,4.3,-5.55,.38],[-4.7,2.7,-5.55,.32],[-3.8,3.8,-5.55,.28],
 [5.75,4.35,-5.55,.38],[4.8,2.85,-5.55,.3],[5.8,1.72,-5.55,.27],
 [-7.08,3.15,1.45,.31],[-7.08,4.7,2.9,.25]]
.forEach(v=>valves.push(valve(...v)));

function gauge(x,y,z,scale=1){
  const g=new THREE.Group();g.position.set(x,y,z);g.scale.setScalar(scale);
  const body=cyl(.3,.3,.13,dark,[0,0,0],[Math.PI/2,0,0],24);g.add(body);
  const face=cyl(.252,.252,.014,new THREE.MeshStandardMaterial({color:0xb6b99b,roughness:.76}),[0,0,.075],[Math.PI/2,0,0],24);g.add(face);
  const rim=new THREE.Mesh(new THREE.TorusGeometry(.265,.035,8,24),brass);rim.rotation.x=Math.PI/2;rim.position.z=.09;g.add(rim);
  for(let i=0;i<9;i++){
    const a=-2.3+i*.575;
    const tick=box(.013,.058,.01,dark,[Math.cos(a)*.2,Math.sin(a)*.2,.1]);tick.rotation.z=a;g.add(tick);
  }
  const needle=box(.015,.19,.018,red,[.06,.1,.115]);needle.rotation.z=-.58;g.add(needle);
  g.userData.needle=needle;g.userData.base=-.58;scene.add(g);return g;
}
const gauges=[];
for(let i=0;i<7;i++) gauges.push(gauge(-6.85,1.2+i*.58,-2.55+(i%2)*.58,.78));
for(let i=0;i<5;i++) gauges.push(gauge(6.84,1.55+i*.68,-.6+(i%2)*.64,.72));

const periscope=new THREE.Group(); scene.add(periscope);
periscope.position.set(-.85,0,-.35);
periscope.add(cyl(.38,.42,5.75,edge,[0,2.88,0],null,28));
periscope.add(cyl(.29,.29,5.95,dark,[0,3,0],null,28));
periscope.add(cyl(.43,.43,.3,brass,[0,4.82,0],null,28));
periscope.add(cyl(.52,.52,.18,dark,[0,5.66,0],null,28));
periscope.add(box(.95,.36,.72,dark,[0,5.75,0]));
periscope.add(cyl(.12,.12,1.1,edge,[.7,5.75,0],[0,0,Math.PI/2]));
periscope.add(cyl(.18,.18,.18,brass,[1.24,5.75,0],[0,0,Math.PI/2]));
function handle(y,side){
  const h=new THREE.Group();h.position.set(0,y,0);
  h.add(cyl(.075,.075,.82,brass,[side*.55,0,0],[0,0,Math.PI/2]));
  h.add(cyl(.12,.12,.34,rubber,[side*.96,0,0],[0,0,Math.PI/2]));
  h.add(cyl(.07,.07,.58,brass,[side*.31,-.25,0],[0,0,Math.PI/2]));
  periscope.add(h);return h;
}
const handles=[handle(3.15,1),handle(3.15,-1)];
periscope.add(cyl(.58,.58,.16,dark,[0,.18,0],null,30));
periscope.add(cyl(.72,.72,.09,brass,[0,.08,0],null,30));

const sonar=new THREE.Group();scene.add(sonar);sonar.position.set(2.45,2.35,-4.86);
sonar.add(box(2.15,2.2,.42,dark,[0,0,0]));
sonar.add(box(1.88,1.87,.06,edge,[0,.03,.25]));
const sonarFace=new THREE.Mesh(new THREE.CircleGeometry(.78,48),new THREE.MeshBasicMaterial({color:0x052d1a}));
sonarFace.position.set(0,.05,.3);sonar.add(sonarFace);
const sonarLines=new THREE.Group();sonar.add(sonarLines);
for(let r=.2;r<.8;r+=.19){
  const ring=new THREE.Mesh(new THREE.RingGeometry(r-.009,r+.009,48),new THREE.MeshBasicMaterial({color:0x18bd67,transparent:true,opacity:.47,side:THREE.DoubleSide}));
  ring.position.z=.315;sonarLines.add(ring);
}
for(let i=0;i<8;i++){
  const a=i*Math.PI/4;
  const line=box(.012,.78,.008,glowGreen,[Math.cos(a)*.39,.05+Math.sin(a)*.39,.32]);
  line.rotation.z=a-Math.PI/2;sonarLines.add(line);
}
const sweep=new THREE.Mesh(new THREE.CircleGeometry(.75,36,0,.38),new THREE.MeshBasicMaterial({color:0x31ff94,transparent:true,opacity:.28,side:THREE.DoubleSide}));
sweep.position.set(0,.05,.33);sonar.add(sweep);
const sweepLine=box(.025,.75,.012,glowGreen,[0,.425,.34]);sonar.add(sweepLine);
sonar.add(box(.9,.08,.05,brass,[0,-1.0,.27]));
for(let i=0;i<4;i++) sonar.add(cyl(.06,.06,.1,brass,[-.75+i*.5,-.72,.29],[Math.PI/2,0,0],12));
const sonarLight=new THREE.PointLight(0x16e874,1.5,4,2);sonarLight.position.set(2.45,2.4,-4.25);scene.add(sonarLight);

const table=new THREE.Group();scene.add(table);table.position.set(2.15,0,1.55);table.rotation.y=-.32;
table.add(box(3.15,.16,2.15,brass,[0,1.65,0]));
table.add(box(2.86,.08,1.86,new THREE.MeshStandardMaterial({color:0x34514b,roughness:.7,metalness:.35}),[0,1.76,0]));
for(const [x,z] of [[-1.27,-.82],[1.27,-.82],[-1.27,.82],[1.27,.82]]) table.add(cyl(.11,.14,1.65,edge,[x,.82,z],null,12));
const chart=box(1.65,.018,1.12,paper,[.1,1.82,.04]);chart.rotation.y=.08;table.add(chart);
for(let i=0;i<9;i++){
  const line=box(1.42,.009,.012,new THREE.MeshBasicMaterial({color:0x506c60}),[.1,1.84,-.4+i*.1]);
  line.rotation.y=.08;table.add(line);
}
const compass=cyl(.28,.28,.1,brass,[-.88,1.9,-.48],null,24);table.add(compass);
const compFace=cyl(.22,.22,.012,new THREE.MeshStandardMaterial({color:0xd9d0a3}),[-.88,1.96,-.48],null,24);table.add(compFace);
const radio=box(.72,.38,.58,dark,[.93,2.02,-.52]);table.add(radio);
for(let i=0;i<3;i++)table.add(cyl(.075,.075,.04,warm,[.72+i*.2,2.03,-.84],[Math.PI/2,0,0],12));
table.add(cyl(.04,.04,.62,edge,[1.13,2.37,-.5],[-.2,0,.12],10));

const bunks=new THREE.Group();scene.add(bunks);bunks.position.set(-5.75,1.72,3.9);bunks.rotation.y=Math.PI/2;
bunks.add(box(2.45,3.6,.15,dark,[0,0,0]));
for(let level=0;level<2;level++){
  const y=-.65+level*1.42;
  bunks.add(box(2.2,.13,.92,edge,[0,y,0]));
  bunks.add(box(1.98,.12,.72,new THREE.MeshStandardMaterial({color:level?0x526058:0x46554d,roughness:.95}),[0,y+.12,.03]));
  bunks.add(box(2.12,.52,.07,green,[0,y+.42,-.44]));
  bunks.add(box(.55,.18,.1,paper,[-.6,y+.25,.42]));
}
for(const x of [-1.05,1.05]) bunks.add(cyl(.06,.06,3.3,edge,[x,0,.35]));
bunks.add(box(2.5,.1,1.15,dark,[0,-1.78,0]));

const consoleUnit=new THREE.Group();scene.add(consoleUnit);consoleUnit.position.set(-4.15,1.45,-3.98);consoleUnit.rotation.y=.24;
consoleUnit.add(box(2.35,2.7,.62,dark,[0,0,0]));
consoleUnit.add(box(2.12,2.43,.04,green,[0,.03,.34]));
for(let r=0;r<3;r++)for(let c=0;c<4;c++){
  const lamp=new THREE.Mesh(new THREE.CircleGeometry(.07,12),new THREE.MeshBasicMaterial({color:(r+c)%4===0?0xff6728:0x55bc68}));
  lamp.position.set(-.72+c*.48,.62-r*.5,.38);consoleUnit.add(lamp);
}
for(let i=0;i<3;i++) {
  const g=gauge(-.66+i*.66,-.82,.4,.58);
  consoleUnit.add(g);scene.remove(g);
}
consoleUnit.add(box(1.45,.23,.7,edge,[0,-1.4,.3]));

const alertRotor=new THREE.Group();scene.add(alertRotor);alertRotor.position.set(-.1,5.94,-3.75);
alertRotor.add(cyl(.22,.22,.18,brass,[0,0,0],null,20));
const alertLens=sphere(.24,alertMat,[.38,.06,0]);alertRotor.add(alertLens);
const alertBeam=new THREE.PointLight(0xff1610,2.2,5,2);alertRotor.add(alertBeam);alertBeam.position.set(.45,.1,0);

for(let i=0;i<14;i++){
  const x=range(-6.6,6.6), z=range(-4.8,4.7);
  if(Math.hypot(x+.85,z+.35)<1.1 || (x>1&&x<4&&z>0&&z<3))continue;
  const crate=box(range(.24,.48),range(.18,.42),range(.24,.48),dark,[x,.15,z]);
  crate.rotation.y=range(0,Math.PI);
}

const overhead=new THREE.PointLight(0xa8c8a3,1.6,12,2);
overhead.position.set(0,5.8,1.2);overhead.castShadow=true;overhead.shadow.mapSize.set(1024,1024);scene.add(overhead);
const leftLight=new THREE.PointLight(0xffa05b,1.25,7,2);
leftLight.position.set(-5,3.4,1);scene.add(leftLight);
const rightLight=new THREE.PointLight(0x4c936a,1.0,7,2);
rightLight.position.set(5,2.8,-1);scene.add(rightLight);
scene.add(new THREE.HemisphereLight(0x668e79,0x0d1714,.65));

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  controls.update();

  sweep.rotation.z=-t*1.55;
  sweepLine.rotation.z=-t*1.55;
  sonarLines.children.forEach((o,i)=>{ if(i<4)o.material.opacity=.28+.19*Math.sin(t*2-i); });
  sonarLight.intensity=1.0+Math.max(0,Math.sin(t*2.2))*1.5;

  alertRotor.rotation.y=t*1.2;
  alertBeam.intensity=1.4+Math.sin(t*3.7)*.45;
  alertLens.material.emissiveIntensity=1.7+Math.sin(t*3.7)*.8;

  periscope.rotation.y=Math.sin(t*.17)*.035;
  handles.forEach((h,i)=>h.rotation.z=Math.sin(t*.7+i)*.025);

  gauges.forEach((g,i)=>{
    g.userData.needle.rotation.z=g.userData.base+Math.sin(t*(1.2+i*.08)+i)*.045+Math.sin(t*6+i)*.012;
  });
  valves.forEach((v,i)=>v.rotation.z+=v.userData.spin*.0015*(1+Math.sin(t*.6+i)*.3));

  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
