<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portable Generator</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #101419; }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 24px;
      top: 20px;
      color: #dce5e8;
      font: 600 13px/1.4 Arial, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.78;
      pointer-events: none;
    }
    .label span {
      display: block;
      margin-top: 5px;
      color: #7e9197;
      font-size: 10px;
      letter-spacing: 0.13em;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">FIELD POWER <span>PORTABLE GENERATOR · UTILITY SERIES</span></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101419);
    scene.fog = new THREE.Fog(0x101419, 10, 24);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(6.2, 4.1, 7.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.15;
    controls.target.set(0, 1.25, 0);

    const colors = {
      frame: 0x20262a,
      frameEdge: 0x30383c,
      engine: 0x252b2d,
      engineTop: 0x343b3d,
      tank: 0xb94b20,
      tankLight: 0xd2652d,
      black: 0x111517,
      rubber: 0x181c1d,
      steel: 0x8c9695,
      steelDark: 0x485154,
      brass: 0xb87c37,
      yellow: 0xd5a52a,
      blue: 0x438da4,
      red: 0xd34a32,
      white: 0xd8dedb
    };

    const mats = {
      frame: new THREE.MeshStandardMaterial({ color: colors.frame, roughness: 0.34, metalness: 0.78 }),
      frameEdge: new THREE.MeshStandardMaterial({ color: colors.frameEdge, roughness: 0.28, metalness: 0.86 }),
      engine: new THREE.MeshStandardMaterial({ color: colors.engine, roughness: 0.62, metalness: 0.35 }),
      engineTop: new THREE.MeshStandardMaterial({ color: colors.engineTop, roughness: 0.5, metalness: 0.5 }),
      tank: new THREE.MeshStandardMaterial({ color: colors.tank, roughness: 0.3, metalness: 0.18 }),
      tankLight: new THREE.MeshStandardMaterial({ color: colors.tankLight, roughness: 0.28, metalness: 0.16 }),
      black: new THREE.MeshStandardMaterial({ color: colors.black, roughness: 0.42, metalness: 0.18 }),
      rubber: new THREE.MeshStandardMaterial({ color: colors.rubber, roughness: 0.91, metalness: 0.03 }),
      steel: new THREE.MeshStandardMaterial({ color: colors.steel, roughness: 0.3, metalness: 0.82 }),
      steelDark: new THREE.MeshStandardMaterial({ color: colors.steelDark, roughness: 0.4, metalness: 0.72 }),
      brass: new THREE.MeshStandardMaterial({ color: colors.brass, roughness: 0.27, metalness: 0.78 }),
      yellow: new THREE.MeshStandardMaterial({ color: colors.yellow, roughness: 0.42, metalness: 0.2 }),
      blue: new THREE.MeshStandardMaterial({ color: colors.blue, roughness: 0.33, metalness: 0.16 }),
      red: new THREE.MeshStandardMaterial({ color: colors.red, roughness: 0.35, metalness: 0.18 }),
      white: new THREE.MeshStandardMaterial({ color: colors.white, roughness: 0.5, metalness: 0.1 })
    };

    function addMesh(geometry, material, position, rotation) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(position[0], position[1], position[2]);
      if (rotation) mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function box(size, material, position, rotation) {
      return addMesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material, position, rotation);
    }

    function cylinder(radius, height, material, position, rotation, segments = 32) {
      return addMesh(new THREE.CylinderGeometry(radius, radius, height, segments), material, position, rotation);
    }

    function tubeBetween(start, end, radius, material) {
      const startVector = new THREE.Vector3(start[0], start[1], start[2]);
      const endVector = new THREE.Vector3(end[0], end[1], end[2]);
      const direction = new THREE.Vector3().subVectors(endVector, startVector);
      const midpoint = new THREE.Vector3().addVectors(startVector, endVector).multiplyScalar(0.5);
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, direction.length(), 20), material);
      mesh.position.copy(midpoint);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function torus(major, minor, material, position, rotation) {
      return addMesh(new THREE.TorusGeometry(major, minor, 16, 40), material, position, rotation);
    }

    function bolt(position, material = mats.steel) {
      return cylinder(0.055, 0.025, material, position, [Math.PI / 2, 0, 0], 16);
    }

    const machine = new THREE.Group();
    scene.add(machine);

    function moveToMachine(object) {
      scene.remove(object);
      machine.add(object);
    }

    const engine = box([2.65, 1.52, 1.45], mats.engine, [0, 1.18, 0]);
    moveToMachine(engine);
    const engineTop = box([2.15, 0.22, 1.28], mats.engineTop, [0, 2.02, 0]);
    moveToMachine(engineTop);

    for (let index = -2; index <= 2; index++) {
      const fin = box([2.2, 0.055, 1.34], mats.frameEdge, [0, 1.48 + index * 0.115, 0]);
      moveToMachine(fin);
    }

    const crankCover = cylinder(0.58, 0.15, mats.black, [-1.08, 1.18, 0.78], [Math.PI / 2, 0, 0], 40);
    moveToMachine(crankCover);
    const crankRing = torus(0.48, 0.075, mats.steelDark, [-1.08, 1.18, 0.87], [Math.PI / 2, 0, 0]);
    moveToMachine(crankRing);
    const pullHub = cylinder(0.12, 0.12, mats.yellow, [-1.08, 1.18, 0.96], [Math.PI / 2, 0, 0], 24);
    moveToMachine(pullHub);
    const pullHandle = tubeBetween([-1.08, 1.18, 1.0], [-0.78, 1.18, 1.17], 0.035, mats.yellow);
    moveToMachine(pullHandle);

    const fuelTank = box([2.9, 0.62, 1.45], mats.tank, [0, 2.42, 0]);
    moveToMachine(fuelTank);
    const tankTop = box([2.55, 0.12, 1.24], mats.tankLight, [0, 2.78, 0]);
    moveToMachine(tankTop);
    const tankStripe = box([0.12, 0.64, 1.48], mats.yellow, [0.72, 2.43, 0]);
    moveToMachine(tankStripe);

    const fuelNeck = cylinder(0.22, 0.22, mats.brass, [0.78, 2.92, 0], [0, 0, 0], 32);
    moveToMachine(fuelNeck);
    const fuelCap = cylinder(0.31, 0.14, mats.black, [0.78, 3.08, 0], [0, 0, 0], 32);
    moveToMachine(fuelCap);
    const capGrip = torus(0.23, 0.035, mats.steelDark, [0.78, 3.16, 0], [0, 0, 0]);
    moveToMachine(capGrip);

    const panel = box([2.45, 0.72, 0.13], mats.frameEdge, [0, 1.52, 0.82]);
    moveToMachine(panel);
    const panelInset = box([2.12, 0.52, 0.035], mats.black, [0, 1.52, 0.9]);
    moveToMachine(panelInset);

    const outletPositions = [-0.72, -0.22];
    for (const outletX of outletPositions) {
      const outletBase = cylinder(0.25, 0.08, mats.steelDark, [outletX, 1.58, 0.96], [Math.PI / 2, 0, 0], 32);
      moveToMachine(outletBase);
      const outletFace = cylinder(0.19, 0.09, mats.white, [outletX, 1.58, 1.02], [Math.PI / 2, 0, 0], 32);
      moveToMachine(outletFace);
      const outletHole = cylinder(0.095, 0.095, mats.black, [outletX, 1.58, 1.08], [Math.PI / 2, 0, 0], 24);
      moveToMachine(outletHole);
    }

    const switchBase = box([0.34, 0.22, 0.08], mats.steelDark, [0.38, 1.56, 0.98]);
    moveToMachine(switchBase);
    const switchLever = box([0.1, 0.26, 0.11], mats.red, [0.38, 1.69, 1.04], [0.15, 0, 0]);
    moveToMachine(switchLever);

    const indicator = cylinder(0.095, 0.06, mats.blue, [0.84, 1.62, 1.0], [Math.PI / 2, 0, 0], 24);
    moveToMachine(indicator);
    const indicatorRing = torus(0.12, 0.025, mats.steel, [0.84, 1.62, 1.04], [Math.PI / 2, 0, 0]);
    moveToMachine(indicatorRing);

    const muffler = cylinder(0.34, 0.95, mats.steelDark, [1.55, 1.2, 0.12], [0, 0, Math.PI / 2], 32);
    moveToMachine(muffler);
    const mufflerEnd = cylinder(0.27, 0.1, mats.black, [2.04, 1.2, 0.12], [0, 0, Math.PI / 2], 32);
    moveToMachine(mufflerEnd);
    const exhaust = cylinder(0.13, 0.48, mats.steel, [2.3, 1.2, 0.12], [0, 0, Math.PI / 2], 24);
    moveToMachine(exhaust);
    const mufflerGuard = tubeBetween([1.25, 0.86, 0.12], [1.25, 1.55, 0.12], 0.045, mats.frame);
    moveToMachine(mufflerGuard);

    const framePoints = [
      [[-1.9, 0.35, -1.0], [-1.9, 2.48, -1.0]],
      [[1.9, 0.35, -1.0], [1.9, 2.48, -1.0]],
      [[-1.9, 0.35, 1.0], [-1.9, 2.48, 1.0]],
      [[1.9, 0.35, 1.0], [1.9, 2.48, 1.0]],
      [[-1.9, 0.35, -1.0], [1.9, 0.35, -1.0]],
      [[-1.9, 0.35, 1.0], [1.9, 0.35, 1.0]],
      [[-1.9, 2.48, -1.0], [1.9, 2.48, -1.0]],
      [[-1.9, 2.48, 1.0], [1.9, 2.48, 1.0]],
      [[-1.9, 0.35, -1.0], [-1.9, 0.35, 1.0]],
      [[1.9, 0.35, -1.0], [1.9, 0.35, 1.0]]
    ];
    for (const framePair of framePoints) {
      const frameTube = tubeBetween(framePair[0], framePair[1], 0.105, mats.frame);
      moveToMachine(frameTube);
    }

    for (const sideX of [-1.9, 1.9]) {
      const axle = cylinder(0.16, 0.42, mats.steelDark, [sideX, 0.62, -0.72], [0, 0, Math.PI / 2], 24);
      moveToMachine(axle);
      const wheel = torus(0.62, 0.2, mats.rubber, [sideX + (sideX < 0 ? -0.18 : 0.18), 0.62, -0.72], [0, Math.PI / 2, 0]);
      moveToMachine(wheel);
      const hub = cylinder(0.24, 0.22, mats.steel, [sideX + (sideX < 0 ? -0.3 : 0.3), 0.62, -0.72], [0, 0, Math.PI / 2], 32);
      moveToMachine(hub);
      const hubCap = cylinder(0.12, 0.24, mats.black, [sideX + (sideX < 0 ? -0.43 : 0.43), 0.62, -0.72], [0, 0, Math.PI / 2], 24);
      moveToMachine(hubCap);
    }

    for (const handleX of [-1.42, 1.42]) {
      const pivot = cylinder(0.15, 0.16, mats.brass, [handleX, 1.02, -1.0], [0, Math.PI / 2, 0], 24);
      moveToMachine(pivot);
      const handleLeg = tubeBetween([handleX, 1.02, -1.0], [handleX, 1.14, -1.78], 0.085, mats.frameEdge);
      moveToMachine(handleLeg);
    }
    const handleBar = tubeBetween([-1.42, 1.14, -1.78], [1.42, 1.14, -1.78], 0.105, mats.frameEdge);
    moveToMachine(handleBar);
    const grip = cylinder(0.13, 1.2, mats.rubber, [0, 1.14, -1.78], [0, 0, Math.PI / 2], 28);
    moveToMachine(grip);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({ color: 0x1a2022, roughness: 0.9, metalness: 0.05 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.04;
    floor.receiveShadow = true;
    scene.add(floor);

    const backdrop = new THREE.Mesh(
      new THREE.CircleGeometry(8, 64),
      new THREE.MeshBasicMaterial({ color: 0x101419, side: THREE.DoubleSide })
    );
    backdrop.rotation.x = -Math.PI / 2;
    backdrop.position.y = -0.045;
    scene.add(backdrop);

    const hemisphere = new THREE.HemisphereLight(0xaec4ce, 0x16191b, 1.55);
    scene.add(hemisphere);

    const keyLight = new THREE.DirectionalLight(0xffe8cb, 4.2);
    keyLight.position.set(5, 8, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -6;
    keyLight.shadow.camera.right = 6;
    keyLight.shadow.camera.top = 7;
    keyLight.shadow.camera.bottom = -3;
    keyLight.shadow.bias = -0.0002;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x8fb8ce, 2.3);
    rimLight.position.set(-5, 4, -6);
    scene.add(rimLight);

    const warmLight = new THREE.PointLight(0xff8a47, 18, 7, 2);
    warmLight.position.set(2.7, 2.5, 3.5);
    scene.add(warmLight);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
