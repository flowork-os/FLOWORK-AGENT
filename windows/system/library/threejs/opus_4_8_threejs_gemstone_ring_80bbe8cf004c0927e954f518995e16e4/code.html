<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diamond Solitaire Ring — three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a0d; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .caption {
    position: fixed; left: 0; right: 0; bottom: 14px;
    text-align: center; color: rgba(230,230,240,0.35);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="caption">Diamond Solitaire · drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ *
 *  Renderer
 * ------------------------------------------------------------------ */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

/* ------------------------------------------------------------------ *
 *  Scene + Camera
 * ------------------------------------------------------------------ */
const scene = new THREE.Scene();

// Neutral dark studio backdrop (soft radial vignette)
function makeBackgroundTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(512, 430, 60, 512, 512, 760);
  g.addColorStop(0.0, '#20212a');
  g.addColorStop(0.45, '#14151b');
  g.addColorStop(1.0, '#08080b');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1024, 1024);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
scene.background = makeBackgroundTexture();

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.9, 2.45, 3.7);

/* ------------------------------------------------------------------ *
 *  Environment map (studio reflections for metal + gem refraction)
 * ------------------------------------------------------------------ */
const pmrem = new THREE.PMREMGenerator(renderer);
const envMap = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envMap;

/* ------------------------------------------------------------------ *
 *  Lighting: hemisphere fill + key + rim + colored sparkle points
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xbfd2ff, 0x21160c, 0.55);
scene.add(hemi);

scene.add(new THREE.AmbientLight(0xffffff, 0.12));

const keyLight = new THREE.DirectionalLight(0xfff4e6, 3.3);
keyLight.position.set(4.2, 7.0, 5.0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.radius = 7;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.02;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 25;
keyLight.shadow.camera.left = -4;
keyLight.shadow.camera.right = 4;
keyLight.shadow.camera.top = 4;
keyLight.shadow.camera.bottom = -4;
keyLight.target.position.set(0, 2.0, 0);
scene.add(keyLight);
scene.add(keyLight.target);

const fillLight = new THREE.DirectionalLight(0xdfe8ff, 0.9);
fillLight.position.set(-5.5, 3.0, 2.5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xbcd6ff, 2.4);
rimLight.position.set(-2.5, 4.5, -6.0);
scene.add(rimLight);

// Small colored lights to give the gem colorful "fire" glints
const sparkCool = new THREE.PointLight(0x9cc4ff, 6.0, 9, 2);
sparkCool.position.set(2.2, 3.4, 2.0);
scene.add(sparkCool);

const sparkWarm = new THREE.PointLight(0xffc184, 5.0, 9, 2);
sparkWarm.position.set(-2.0, 3.1, 1.6);
scene.add(sparkWarm);

/* ------------------------------------------------------------------ *
 *  Soft surface the ring rests on (receives shadows, does not cast)
 * ------------------------------------------------------------------ */
function makeSurfaceTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(512, 512, 40, 512, 512, 512);
  g.addColorStop(0.0, '#33343d');
  g.addColorStop(0.5, '#1a1b22');
  g.addColorStop(1.0, '#0a0a0d');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1024, 1024);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const surface = new THREE.Mesh(
  new THREE.CircleGeometry(22, 96),
  new THREE.MeshStandardMaterial({
    map: makeSurfaceTexture(),
    roughness: 0.92,
    metalness: 0.0,
    envMapIntensity: 0.25
  })
);
surface.rotation.x = -Math.PI / 2;
surface.position.y = 0;
surface.receiveShadow = true;
surface.castShadow = false;
scene.add(surface);

/* ------------------------------------------------------------------ *
 *  Materials
 * ------------------------------------------------------------------ */
const goldMat = new THREE.MeshPhysicalMaterial({
  color: 0xffd47a,
  metalness: 1.0,
  roughness: 0.085,
  envMapIntensity: 1.75,
  clearcoat: 0.35,
  clearcoatRoughness: 0.12
});

const diamondMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0.0,
  roughness: 0.0,
  transmission: 1.0,
  ior: 2.42,                 // diamond
  thickness: 0.55,
  attenuationColor: new THREE.Color(0xffffff),
  attenuationDistance: 6.0,
  envMapIntensity: 2.7,
  clearcoat: 1.0,
  clearcoatRoughness: 0.0,
  iridescence: 0.22,         // fakes a hint of dispersion / fire
  iridescenceIOR: 1.35,
  iridescenceThicknessRange: [120, 420],
  specularIntensity: 1.0,
  reflectivity: 1.0,
  transparent: true,
  side: THREE.DoubleSide,
  flatShading: true          // crisp mirror facets
});

/* ------------------------------------------------------------------ *
 *  Procedural round brilliant-cut diamond geometry
 *  (table + crown facets + girdle + pavilion facets to a culet)
 * ------------------------------------------------------------------ */
function createBrilliantGeometry() {
  const Rg = 1.0;          // girdle radius (unit)
  const tableR = 0.53;     // table radius (fraction of girdle)
  const crownH = 0.30;     // table height above girdle top
  const girdleH = 0.06;    // girdle thickness
  const pavD = 0.90;       // pavilion depth below girdle bottom

  const gTopY = girdleH / 2;
  const gBotY = -girdleH / 2;
  const tableY = gTopY + crownH;
  const culetY = gBotY - pavD;

  const positions = [];
  const indices = [];
  const addV = (x, y, z) => { positions.push(x, y, z); return positions.length / 3 - 1; };

  const Ng = 16; // girdle segments
  const Nt = 8;  // table corners / crown mains

  const girTop = [], girBot = [];
  for (let j = 0; j < Ng; j++) {
    const a = (j / Ng) * Math.PI * 2;
    const x = Math.cos(a) * Rg, z = Math.sin(a) * Rg;
    girTop.push(addV(x, gTopY, z));
    girBot.push(addV(x, gBotY, z));
  }

  const table = [];
  for (let k = 0; k < Nt; k++) {
    const a = (k / Nt) * Math.PI * 2; // aligned above girdle point 2k
    table.push(addV(Math.cos(a) * tableR, tableY, Math.sin(a) * tableR));
  }
  const tableCenter = addV(0, tableY, 0);
  const culet = addV(0, culetY, 0);

  // Table (flat top) fan
  for (let k = 0; k < Nt; k++) {
    const k2 = (k + 1) % Nt;
    indices.push(tableCenter, table[k], table[k2]);
  }

  // Crown facets: star + bezel-like facets between table and girdle
  for (let k = 0; k < Nt; k++) {
    const kt = (k + 1) % Nt;
    const g0 = (2 * k) % Ng;
    const g1 = (2 * k + 1) % Ng;
    const g2 = (2 * k + 2) % Ng;
    indices.push(table[k], girTop[g1], girTop[g0]);   // upper-girdle facet
    indices.push(table[k], table[kt], girTop[g1]);    // star facet
    indices.push(table[kt], girTop[g2], girTop[g1]);  // upper-girdle facet
  }

  // Girdle band
  for (let j = 0; j < Ng; j++) {
    const j2 = (j + 1) % Ng;
    indices.push(girTop[j], girBot[j], girBot[j2]);
    indices.push(girTop[j], girBot[j2], girTop[j2]);
  }

  // Pavilion facets down to the culet
  for (let j = 0; j < Ng; j++) {
    const j2 = (j + 1) % Ng;
    indices.push(culet, girBot[j2], girBot[j]);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

/* ------------------------------------------------------------------ *
 *  Assemble the ONE ring object
 * ------------------------------------------------------------------ */
const ring = new THREE.Group();

// Band proportions
const R_band = 0.90;   // mean radius
const r_tube = 0.12;   // tube radius

// Polished band (torus in XY plane; diamond sits at +Y top)
const band = new THREE.Mesh(
  new THREE.TorusGeometry(R_band, r_tube, 48, 220),
  goldMat
);
band.castShadow = true;
band.receiveShadow = true;
ring.add(band);

// Diamond
const dScale = 0.42;
const diamondGeo = createBrilliantGeometry();
diamondGeo.scale(dScale, dScale, dScale);
const diamond = new THREE.Mesh(diamondGeo, diamondMat);
const Dy = 1.532;              // lifts culet just above the band/basket
diamond.position.set(0, Dy, 0);
diamond.castShadow = true;
diamond.receiveShadow = false;
ring.add(diamond);

// Girdle radius in world units for prong placement
const girWorldR = 1.0 * dScale; // 0.42

// Gallery / basket rings under the stone
const gallery = new THREE.Mesh(new THREE.TorusGeometry(0.30, 0.026, 20, 80), goldMat);
gallery.rotation.x = Math.PI / 2;
gallery.position.y = 1.33;
gallery.castShadow = true;
ring.add(gallery);

const collar = new THREE.Mesh(new THREE.TorusGeometry(girWorldR * 0.98, 0.02, 18, 80), goldMat);
collar.rotation.x = Math.PI / 2;
collar.position.y = Dy - 0.02;
collar.castShadow = true;
ring.add(collar);

// Four prongs holding the girdle, curling over the crown edge
const prongAngles = [Math.PI / 4, 3 * Math.PI / 4, 5 * Math.PI / 4, 7 * Math.PI / 4];
for (const a of prongAngles) {
  const dx = Math.cos(a), dz = Math.sin(a);
  const pts = [
    new THREE.Vector3(dx * 0.30, 1.03, dz * 0.30),   // root at basket / band top
    new THREE.Vector3(dx * 0.40, 1.30, dz * 0.40),
    new THREE.Vector3(dx * 0.45, 1.50, dz * 0.45),   // rise alongside pavilion
    new THREE.Vector3(dx * (girWorldR + 0.02), Dy, dz * (girWorldR + 0.02)), // grip girdle
    new THREE.Vector3(dx * 0.37, Dy + 0.07, dz * 0.37) // curl inward over the crown
  ];
  const curve = new THREE.CatmullRomCurve3(pts);
  const prong = new THREE.Mesh(new THREE.TubeGeometry(curve, 60, 0.032, 16, false), goldMat);
  prong.castShadow = true;
  prong.receiveShadow = true;
  ring.add(prong);

  const bead = new THREE.Mesh(new THREE.SphereGeometry(0.05, 20, 20), goldMat);
  bead.position.set(dx * 0.37, Dy + 0.07, dz * 0.37);
  bead.castShadow = true;
  ring.add(bead);
}

// Rest the band's lowest point on the surface (y = 0), centered on X/Z
ring.position.y = R_band + r_tube; // 1.02
scene.add(ring);

/* ------------------------------------------------------------------ *
 *  Controls
 * ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.enablePan = false;
controls.minDistance = 2.6;
controls.maxDistance = 10;
controls.minPolarAngle = 0.15;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 1.55, 0);
controls.update();

/* ------------------------------------------------------------------ *
 *  Resize + render loop
 * ------------------------------------------------------------------ */
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
