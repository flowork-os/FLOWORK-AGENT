<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tall Bookshelf — procedural three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d9d9dc; }
  #app { position: fixed; inset: 0; }
</style>

<!-- Requirement 1: three.js + OrbitControls ONLY via importmap on jsDelivr, three@0.160.0 -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------------------
// Renderer  (antialias, ACES tone mapping, sRGB output, soft shadows)
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

// ---------------------------------------------------------------------------
// Scene + neutral studio background
// ---------------------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9d9dc);

// ---------------------------------------------------------------------------
// Camera + OrbitControls
// ---------------------------------------------------------------------------
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 1.2;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.52; // keep the camera at or above floor level

// ---------------------------------------------------------------------------
// Lighting: hemisphere fill + directional key (shadows) + subtle fill
// ---------------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8577, 0.55);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff4e6, 2.4);
keyLight.position.set(3.2, 4.6, 3.0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 20;
keyLight.shadow.camera.left = -2.2;
keyLight.shadow.camera.right = 2.2;
keyLight.shadow.camera.top = 3.0;
keyLight.shadow.camera.bottom = -0.5;
keyLight.shadow.bias = -0.0002;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xdfe7ff, 0.5);
fillLight.position.set(-4.0, 2.5, -2.0);
scene.add(fillLight);

// ---------------------------------------------------------------------------
// Procedural wood-grain texture (CanvasTexture — no external assets)
// ---------------------------------------------------------------------------
function makeWoodTexture(baseHex, streakHex) {
  const w = 512, h = 512;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');

  // base fill
  ctx.fillStyle = baseHex;
  ctx.fillRect(0, 0, w, h);

  // long vertical grain streaks with gentle waviness
  ctx.lineWidth = 1;
  for (let i = 0; i < 240; i++) {
    const x = Math.random() * w;
    const alpha = 0.03 + Math.random() * 0.10;
    ctx.strokeStyle = streakHex;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    let px = x;
    ctx.moveTo(px, 0);
    for (let y = 0; y <= h; y += 24) {
      px += (Math.random() - 0.5) * 6;
      ctx.lineTo(px, y);
    }
    ctx.stroke();
  }

  // a few darker knots / mineral streaks
  ctx.globalAlpha = 0.06;
  for (let i = 0; i < 6; i++) {
    const x = Math.random() * w, y = Math.random() * h;
    const r = 6 + Math.random() * 18;
    const g = ctx.createRadialGradient(x, y, 1, x, y, r);
    g.addColorStop(0, streakHex);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

const woodTex = makeWoodTexture('#b07a45', '#6e4520');

// ---------------------------------------------------------------------------
// Materials
// ---------------------------------------------------------------------------
const woodMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,          // let the texture drive the colour
  map: woodTex,
  roughness: 0.68,
  metalness: 0.0,
});

const backMat = new THREE.MeshStandardMaterial({
  color: 0x9a6a3c,          // slightly darker recessed back panel
  roughness: 0.82,
  metalness: 0.0,
});

const holeMat = new THREE.MeshStandardMaterial({
  color: 0x1c130c,          // dark drilled peg holes
  roughness: 0.95,
  metalness: 0.0,
});

// ---------------------------------------------------------------------------
// Bookshelf dimensions (metres — realistic proportions)
// ---------------------------------------------------------------------------
const W  = 0.90;   // overall width  (x)
const H  = 2.00;   // overall height (y)
const D  = 0.30;   // overall depth  (z)
const T  = 0.020;  // board thickness (2 cm)
const BACK_T   = 0.006;   // thin back panel (6 mm)
const BACK_REC = 0.030;   // how far the back panel is recessed from the rear edge

const innerW = W - 2 * T;  // clear width between side panels

// The whole shelf is built with its base sitting on y = 0 so it rests on the floor.
const bookshelf = new THREE.Group();
bookshelf.name = 'TallBookshelf';

// helper to build a named box mesh
function board(name, sx, sy, sz, x, y, z, material = woodMat) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), material);
  mesh.name = name;
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// --- Two side panels (full height) --------------------------------------
const sideX = W / 2 - T / 2;                 // centre-x of each side panel
const leftPanel  = board('SidePanel_Left',  T, H, D, -sideX, H / 2, 0);
const rightPanel = board('SidePanel_Right', T, H, D,  sideX, H / 2, 0);
bookshelf.add(leftPanel, rightPanel);

// --- Horizontal shelves (top, bottom + evenly spaced middle shelves) -----
// Shelves are set back a touch from the rear so the recessed back sits behind them.
const shelfDepth = D - (BACK_REC + BACK_T) + 0.004;
const shelfZ = (D / 2 - shelfDepth / 2) - 0.002;  // pushed toward the front face

const NUM_BOARDS = 6;                         // -> 5 open compartments
const bottomY = T / 2;                        // bottom board centre
const topY    = H - T / 2;                    // top board centre
const shelvesGroup = new THREE.Group();
shelvesGroup.name = 'Shelves';

for (let i = 0; i < NUM_BOARDS; i++) {
  const t = i / (NUM_BOARDS - 1);
  const y = THREE.MathUtils.lerp(bottomY, topY, t);
  let name = 'Shelf_' + i;
  if (i === 0) name = 'BottomBoard';
  else if (i === NUM_BOARDS - 1) name = 'TopBoard';
  shelvesGroup.add(board(name, innerW, T, shelfDepth, 0, y, shelfZ));
}
bookshelf.add(shelvesGroup);

// --- Slightly recessed thin back panel -----------------------------------
const backZ = -D / 2 + BACK_REC + BACK_T / 2;
const backPanel = board(
  'BackPanel',
  innerW + 2 * (T * 0.5),          // tucks a little into grooves in the sides
  H - 2 * T,                        // between bottom and top boards
  BACK_T,
  0, H / 2, backZ,
  backMat
);
bookshelf.add(backPanel);

// --- Rows of small adjustable shelf-peg holes on the inner sides ---------
const pegGroup = new THREE.Group();
pegGroup.name = 'ShelfPegHoles';

const holeGeo = new THREE.CylinderGeometry(0.0045, 0.0045, 0.010, 12);
holeGeo.rotateZ(Math.PI / 2);     // orient the cylinder along the x-axis

const innerFaceLeft  = -sideX + T / 2;   // inner surface of the left panel
const innerFaceRight =  sideX - T / 2;   // inner surface of the right panel

// two vertical columns per side: one near the front edge, one near the back
const colZ = [ D / 2 - 0.035, -D / 2 + BACK_REC + 0.030 ];

const pegYStart = 0.12;
const pegYEnd   = H - 0.12;
const pegStep   = 0.045;

for (const [faceX, dir] of [[innerFaceLeft, 1], [innerFaceRight, -1]]) {
  for (const z of colZ) {
    for (let y = pegYStart; y <= pegYEnd + 1e-6; y += pegStep) {
      const hole = new THREE.Mesh(holeGeo, holeMat);
      // seat the hole flush with the inner face, recessed slightly into the wood
      hole.position.set(faceX + dir * 0.003, y, z);
      hole.castShadow = false;
      hole.receiveShadow = true;
      pegGroup.add(hole);
    }
  }
}
bookshelf.add(pegGroup);

// Center the shelf horizontally on the origin (already symmetric); base rests on y = 0.
scene.add(bookshelf);

// ---------------------------------------------------------------------------
// Soft ground / contact-shadow plane the object rests on
// ---------------------------------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0xcfcfd2, roughness: 0.95, metalness: 0.0 })
);
ground.name = 'Ground';
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// ---------------------------------------------------------------------------
// Auto-frame the camera to the bookshelf bounding box
// ---------------------------------------------------------------------------
function frameObject(object3D) {
  const box = new THREE.Box3().setFromObject(object3D);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  const maxDim = Math.max(size.x, size.y, size.z);
  const fov = THREE.MathUtils.degToRad(camera.fov);
  let dist = (maxDim / 2) / Math.tan(fov / 2);
  dist *= 1.7; // comfortable margin

  camera.position.set(center.x + dist * 0.75, center.y + size.y * 0.18, center.z + dist);
  camera.near = dist / 100;
  camera.far = dist * 100;
  camera.updateProjectionMatrix();

  controls.target.copy(center);
  controls.update();
}
frameObject(bookshelf);

// ---------------------------------------------------------------------------
// Resize handling
// ---------------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------------------
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
