<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marble Lion Head</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101216}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101216);
scene.fog = new THREE.Fog(0x101216, 13, 25);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.2, 10.5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
controls.minDistance = 7;
controls.maxDistance = 15;
controls.target.set(0,0.5,0);

const marble = new THREE.MeshStandardMaterial({
  color:0xd8d7d0,
  roughness:0.29,
  metalness:0.02
});
const polished = new THREE.MeshStandardMaterial({
  color:0xe8e7df,
  roughness:0.18,
  metalness:0.025
});
const edgeMarble = new THREE.MeshStandardMaterial({
  color:0xc9c8c1,
  roughness:0.42
});
const recess = new THREE.MeshStandardMaterial({
  color:0x8d8e8a,
  roughness:0.72
});
const darkStone = new THREE.MeshStandardMaterial({
  color:0x202125,
  roughness:0.9
});
const gumStone = new THREE.MeshStandardMaterial({
  color:0xb9b5ad,
  roughness:0.42
});

const lion = new THREE.Group();
lion.position.y = -0.15;
scene.add(lion);

function mesh(geometry, material, position, scale, rotation) {
  const item = new THREE.Mesh(geometry,material);
  if(position) item.position.set(position.x,position.y,position.z);
  if(scale) item.scale.set(scale.x,scale.y,scale.z);
  if(rotation) item.rotation.set(rotation.x,rotation.y,rotation.z);
  item.castShadow = true;
  item.receiveShadow = true;
  lion.add(item);
  return item;
}

function sphere(material,position,scale,segments=48) {
  return mesh(new THREE.SphereGeometry(1,segments,segments),material,position,scale);
}

function tube(points,radius,material,closed=false) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geometry = new THREE.TubeGeometry(curve,Math.max(16,points.length*8),radius,12,closed);
  return mesh(geometry,material);
}

function scroll(side,y,z,outer,turns,thickness,material) {
  const points = [];
  const count = 42;
  for(let i=0;i<count;i++){
    const t = i/(count-1);
    const a = Math.PI*2*turns*t + Math.PI*0.18;
    const radius = outer*(1-t*0.77);
    const x = side*(2.42 - t*0.52) + side*Math.cos(a)*radius;
    const yy = y + Math.sin(a)*radius*0.82 + t*0.18;
    const zz = z + Math.sin(a)*radius*0.25 - t*0.34;
    points.push(new THREE.Vector3(x,yy,zz));
  }
  return tube(points,thickness,material);
}

function ridge(side,y,z,width,height,angle,material) {
  const points = [
    new THREE.Vector3(side*0.14,y+height*0.15,z),
    new THREE.Vector3(side*(width*0.42),y+height*0.78,z+0.06),
    new THREE.Vector3(side*width,y+height*0.38,z+0.02),
    new THREE.Vector3(side*(width+0.22),y-0.04,z-0.08)
  ];
  const r = tube(points,0.14,material);
  r.rotation.z = side*angle;
  return r;
}

const maneCore = sphere(edgeMarble,{x:0,y:0.55,z:-0.12},{x:3.28,y:3.7,z:1.08},64);
maneCore.scale.z = 0.92;

const innerMane = sphere(recess,{x:0,y:0.63,z:-0.39},{x:2.78,y:3.18,z:0.48},48);

const head = sphere(marble,{x:0,y:0.55,z:0.18},{x:2.18,y:2.67,z:1.24},64);
const forehead = sphere(polished,{x:0,y:1.82,z:0.93},{x:1.4,y:1.42,z:0.63},48);

for(const side of [-1,1]){
  scroll(side,2.26,-0.02,0.92,1.25,0.23,polished);
  scroll(side,1.53,-0.16,0.9,1.3,0.27,marble);
  scroll(side,0.76,-0.28,0.88,1.35,0.25,polished);
  scroll(side,-0.05,-0.34,0.78,1.4,0.23,edgeMarble);
  scroll(side,-0.78,-0.3,0.66,1.45,0.2,polished);
  scroll(side,2.98,-0.1,0.58,1.2,0.19,edgeMarble);
  ridge(side,2.75,-0.08,2.62,0.44,0.22,recess);
  ridge(side,1.93,-0.24,2.83,0.42,-0.18,recess);
  ridge(side,1.05,-0.3,2.9,0.38,0.16,recess);
  ridge(side,0.12,-0.34,2.86,0.34,-0.13,recess);
}

const browL = tube([
  new THREE.Vector3(-1.55,1.83,1.14),
  new THREE.Vector3(-0.92,2.14,1.34),
  new THREE.Vector3(-0.23,1.99,1.42)
],0.22,edgeMarble);
const browR = tube([
  new THREE.Vector3(1.55,1.83,1.14),
  new THREE.Vector3(0.92,2.14,1.34),
  new THREE.Vector3(0.23,1.99,1.42)
],0.22,edgeMarble);

for(const side of [-1,1]){
  const socket = sphere(recess,{x:side*0.77,y:1.55,z:1.32},{x:0.61,y:0.49,z:0.19},40);
  const eye = sphere(polished,{x:side*0.77,y:1.54,z:1.48},{x:0.39,y:0.31,z:0.12},40);
  eye.rotation.z = side*0.12;
  tube([
    new THREE.Vector3(side*0.31,1.37,1.49),
    new THREE.Vector3(side*0.76,1.28,1.58),
    new THREE.Vector3(side*1.27,1.37,1.48)
  ],0.075,recess);
}

const noseBridge = sphere(polished,{x:0,y:1.13,z:1.48},{x:0.72,y:0.83,z:0.42},48);
const nose = sphere(edgeMarble,{x:0,y:0.74,z:1.75},{x:0.68,y:0.46,z:0.27},48);
const noseCenter = tube([
  new THREE.Vector3(0,0.98,1.72),
  new THREE.Vector3(0,0.69,1.84),
  new THREE.Vector3(0,0.46,1.69)
],0.075,recess);

for(const side of [-1,1]){
  tube([
    new THREE.Vector3(side*0.17,0.83,1.87),
    new THREE.Vector3(side*0.45,0.91,1.86),
    new THREE.Vector3(side*0.59,0.76,1.8)
  ],0.07,recess);
  sphere(polished,{x:side*0.88,y:0.54,z:1.34},{x:0.78,y:0.72,z:0.54},48);
  tube([
    new THREE.Vector3(side*0.26,0.4,1.56),
    new THREE.Vector3(side*0.76,0.27,1.61),
    new THREE.Vector3(side*1.22,0.35,1.42)
  ],0.105,edgeMarble);
}

const mouthUpper = sphere(marble,{x:0,y:0.18,z:1.09},{x:1.4,y:0.78,z:0.52},48);
const throat = sphere(darkStone,{x:0,y:-0.27,z:1.21},{x:1.18,y:0.76,z:0.25},48);
const throatChannel = tube([
  new THREE.Vector3(-0.82,-0.03,1.48),
  new THREE.Vector3(-0.42,-0.25,1.53),
  new THREE.Vector3(0,-0.34,1.55),
  new THREE.Vector3(0.42,-0.25,1.53),
  new THREE.Vector3(0.82,-0.03,1.48)
],0.12,darkStone);

const jaw = sphere(polished,{x:0,y:-0.84,z:0.99},{x:1.47,y:0.72,z:0.62},48);
tube([
  new THREE.Vector3(-1.18,-0.55,1.35),
  new THREE.Vector3(-0.64,-0.68,1.5),
  new THREE.Vector3(0,-0.72,1.53),
  new THREE.Vector3(0.64,-0.68,1.5),
  new THREE.Vector3(1.18,-0.55,1.35)
],0.11,gumStone);

for(const side of [-1,1]){
  const fang = mesh(new THREE.ConeGeometry(0.16,0.63,24),polished,
    {x:side*0.71,y:-0.05,z:1.63},{x:1,y:1,z:1},
    {x:0,y:0, z:side*0.04});
  fang.rotation.x = Math.PI;
  fang.rotation.z = side*0.04;
  const lowerFang = mesh(new THREE.ConeGeometry(0.12,0.42,20),edgeMarble,
    {x:side*1.0,y:-0.43,z:1.48},{x:1,y:1,z:1},
    {x:0,y:0,z:-side*0.12});
  lowerFang.rotation.x = 0;
  tube([
    new THREE.Vector3(side*0.22,-1.16,1.42),
    new THREE.Vector3(side*0.72,-1.22,1.51),
    new THREE.Vector3(side*1.2,-1.04,1.39)
  ],0.08,recess);
}

const chin = sphere(edgeMarble,{x:0,y:-1.38,z:0.99},{x:0.96,y:0.43,z:0.48},40);

const veinMaterial = new THREE.MeshStandardMaterial({
  color:0x686b6b,
  roughness:0.62,
  metalness:0.02
});
const veinFine = new THREE.MeshStandardMaterial({
  color:0x9b9d9b,
  roughness:0.5
});

tube([
  new THREE.Vector3(1.94,1.54,1.07),
  new THREE.Vector3(1.63,1.1,1.28),
  new THREE.Vector3(1.42,0.65,1.41),
  new THREE.Vector3(1.08,0.16,1.43),
  new THREE.Vector3(0.72,-0.25,1.36)
],0.045,veinMaterial);

tube([
  new THREE.Vector3(1.84,1.36,1.08),
  new THREE.Vector3(1.5,0.96,1.18),
  new THREE.Vector3(1.29,0.57,1.34)
],0.022,veinFine);

tube([
  new THREE.Vector3(1.62,0.83,1.21),
  new THREE.Vector3(1.27,0.45,1.25),
  new THREE.Vector3(1.08,0.08,1.28)
],0.025,veinFine);

tube([
  new THREE.Vector3(2.01,1.72,0.98),
  new THREE.Vector3(1.76,1.42,1.13),
  new THREE.Vector3(1.57,1.09,1.2)
],0.018,veinFine);

tube([
  new THREE.Vector3(1.04,-0.04,1.3),
  new THREE.Vector3(0.84,-0.42,1.27),
  new THREE.Vector3(0.64,-0.63,1.19)
],0.021,veinMaterial);

const chiselMaterial = new THREE.MeshStandardMaterial({
  color:0xa8a8a1,
  roughness:0.88
});
for(const side of [-1,1]){
  for(let i=0;i<5;i++){
    const x = side*(1.72 - i*0.2);
    const y = 2.55 - i*0.68;
    const mark = mesh(new THREE.BoxGeometry(0.12,0.42,0.08),chiselMaterial,
      {x,y,z:0.98},{x:1,y:1,z:1},{x:0,y:side*0.08,z:side*0.3});
    mark.castShadow = false;
  }
}

const pedestal = new THREE.Mesh(
  new THREE.CylinderGeometry(2.15,2.45,0.42,64),
  new THREE.MeshStandardMaterial({color:0x4d5050,roughness:0.55})
);
pedestal.position.set(0,-2.72,-0.25);
pedestal.castShadow = true;
pedestal.receiveShadow = true;
scene.add(pedestal);

const pedestalTop = new THREE.Mesh(
  new THREE.CylinderGeometry(1.82,2.15,0.13,64),
  polished
);
pedestalTop.position.set(0,-2.48,-0.25);
pedestalTop.castShadow = true;
pedestalTop.receiveShadow = true;
scene.add(pedestalTop);

const hemi = new THREE.HemisphereLight(0xcbd4df,0x222328,2.0);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff5df,4.4);
key.position.set(-5,7,8);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -6;
key.shadow.bias = -0.0002;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9eb9d8,2.0);
fill.position.set(5,2,5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xd5d9ff,2.8);
rim.position.set(0,5,-7);
scene.add(rim);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(18,64),
  new THREE.MeshStandardMaterial({color:0x15171b,roughness:0.86})
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -2.95;
floor.receiveShadow = true;
scene.add(floor);

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
