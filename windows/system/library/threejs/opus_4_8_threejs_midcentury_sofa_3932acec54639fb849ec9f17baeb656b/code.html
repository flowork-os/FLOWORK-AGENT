<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mid-Century Three-Seat Sofa</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ececee; }
  #app { width: 100vw; height: 100vh; display: block; }
</style>

<!-- ES module imports: three.js + OrbitControls via jsDelivr CDN only -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="app"></canvas>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================================
   MID-CENTURY THREE-SEAT SOFA
   - Low rectangular upholstered frame
   - 3 separate seat cushions + 3 separate back cushions
   - Thin armrests
   - Four splayed, tapered wooden legs
   All geometry is built procedurally; textures via CanvasTexture.
   Units are meters (real-world scale).
   ========================================================================== */

/* ---------------------------------------------------------------------------
   Renderer
   ------------------------------------------------------------------------- */
const canvas = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* ---------------------------------------------------------------------------
   Scene & Camera
   ------------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xededf0); // neutral studio background

const camera = new THREE.PerspectiveCamera(
  42, window.innerWidth / window.innerHeight, 0.05, 500
);

/* ---------------------------------------------------------------------------
   Lighting: hemisphere fill + directional key (shadows) + soft fill
   ------------------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0xffffff, 0x9a9488, 0.65);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff4e6, 2.4);
keyLight.position.set(3.2, 5.0, 3.6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 20;
keyLight.shadow.camera.left = -2.6;
keyLight.shadow.camera.right = 2.6;
keyLight.shadow.camera.top = 2.6;
keyLight.shadow.camera.bottom = -2.6;
keyLight.shadow.bias = -0.0002;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xbcd0ff, 0.55);
fillLight.position.set(-4.0, 2.5, -2.5);
scene.add(fillLight);

/* ---------------------------------------------------------------------------
   Procedural textures (CanvasTexture)
   ------------------------------------------------------------------------- */

// Subtle woven fabric texture for upholstery.
function makeFabricTexture(hexColor) {
  const size = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const c = new THREE.Color(hexColor);

  // Base color fill
  ctx.fillStyle = `rgb(${(c.r*255)|0},${(c.g*255)|0},${(c.b*255)|0})`;
  ctx.fillRect(0, 0, size, size);

  // Per-pixel fine noise (thread irregularity)
  const img = ctx.getImageData(0, 0, size, size);
  const d = img.data;
  const clamp = (v) => v < 0 ? 0 : v > 255 ? 255 : v;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 24;
    d[i]   = clamp(d[i]   + n);
    d[i+1] = clamp(d[i+1] + n);
    d[i+2] = clamp(d[i+2] + n);
  }
  ctx.putImageData(img, 0, 0);

  // Woven grid: faint vertical + horizontal threads
  ctx.globalAlpha = 0.05;
  ctx.strokeStyle = '#000';
  for (let x = 0; x < size; x += 3) {
    ctx.beginPath(); ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, size); ctx.stroke();
  }
  ctx.strokeStyle = '#fff';
  for (let y = 0; y < size; y += 3) {
    ctx.beginPath(); ctx.moveTo(0, y + 0.5); ctx.lineTo(size, y + 0.5); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 3);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

// Simple walnut wood grain for the legs.
function makeWoodTexture(baseHex) {
  const w = 128, h = 256;
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const base = new THREE.Color(baseHex);

  ctx.fillStyle = `rgb(${(base.r*255)|0},${(base.g*255)|0},${(base.b*255)|0})`;
  ctx.fillRect(0, 0, w, h);

  // Vertical grain streaks with gentle waviness
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * w;
    const shade = (Math.random() - 0.5) * 0.35;
    const gc = base.clone().offsetHSL(0, 0, shade);
    ctx.strokeStyle = `rgba(${(gc.r*255)|0},${(gc.g*255)|0},${(gc.b*255)|0},0.5)`;
    ctx.lineWidth = 0.5 + Math.random() * 1.6;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    const bend = (Math.random() - 0.5) * 8;
    ctx.bezierCurveTo(x + bend, h * 0.33, x - bend, h * 0.66, x + bend * 0.5, h);
    ctx.stroke();
  }

  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, 1);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

/* ---------------------------------------------------------------------------
   Geometry helpers
   ------------------------------------------------------------------------- */

// A rounded-rectangle Shape (centered on origin) used for extrusion.
function roundedRectShape(w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

// Rounded box: width(x) x height(y) x depth(z), soft rounded edges.
// (Cushions and upholstered parts read as plush with this.)
function roundedBoxGeometry(width, height, depth, radius) {
  const bevel = Math.min(radius, depth / 2 - 0.001, width / 2 - 0.001, height / 2 - 0.001);
  const shape = roundedRectShape(width, height, radius);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: depth - bevel * 2,
    bevelEnabled: true,
    bevelThickness: bevel,
    bevelSize: bevel,
    bevelSegments: 4,
    curveSegments: 8,
  });
  geo.center();
  geo.computeVertexNormals();
  return geo;
}

// Tapered cylindrical leg oriented between an upper anchor and lower foot point.
function makeLeg(top, bottom, rTop, rBottom, material) {
  const len = top.distanceTo(bottom);
  const geo = new THREE.CylinderGeometry(rTop, rBottom, len, 20, 1);
  const mesh = new THREE.Mesh(geo, material);
  // Orient default +Y axis along (top - bottom)
  const dir = new THREE.Vector3().subVectors(top, bottom).normalize();
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  mesh.quaternion.copy(q);
  mesh.position.copy(top).add(bottom).multiplyScalar(0.5); // midpoint
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

/* ---------------------------------------------------------------------------
   Materials
   ------------------------------------------------------------------------- */
const FABRIC_COLOR = 0x5f8078; // muted teal-green upholstery

const fabricMat = new THREE.MeshStandardMaterial({
  map: makeFabricTexture(FABRIC_COLOR),
  color: 0xffffff,
  roughness: 0.92,
  metalness: 0.0,
});

// Slightly softer-looking cushion fabric (own texture instance for larger weave)
const cushionTex = makeFabricTexture(FABRIC_COLOR);
cushionTex.repeat.set(2, 2);
const cushionMat = new THREE.MeshStandardMaterial({
  map: cushionTex,
  color: 0xffffff,
  roughness: 0.95,
  metalness: 0.0,
});

const woodMat = new THREE.MeshStandardMaterial({
  map: makeWoodTexture(0x6b4a2e), // walnut
  color: 0xffffff,
  roughness: 0.42,
  metalness: 0.05,
});

/* ---------------------------------------------------------------------------
   Build the sofa
   ------------------------------------------------------------------------- */
const sofa = new THREE.Group();
sofa.name = 'MidCenturySofa';

// Overall proportions
const W = 2.10;   // total width (x)
const D = 0.88;   // total depth (z)
const armW = 0.09;                // thin armrest thickness
const innerW = W - 2 * armW;      // usable seat width between arms

// Vertical layout
const legTopY   = 0.20;   // where legs meet the frame
const frameTopY = 0.34;   // top of upholstered base
const frameH    = frameTopY - legTopY + 0.02; // small overlap into legs

// Helper to register named parts
function addPart(mesh, name) {
  mesh.name = name;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  sofa.add(mesh);
  return mesh;
}

/* ---- Upholstered base frame (low rectangular block) --------------------- */
const frame = new THREE.Mesh(
  roundedBoxGeometry(W, frameH, D, 0.03),
  fabricMat
);
frame.position.set(0, legTopY - 0.02 + frameH / 2, 0);
addPart(frame, 'baseFrame');

/* ---- Back rest panel (upholstered support the back cushions lean on) ---- */
const backH = 0.80 - frameTopY;             // height above the frame top
const backPanel = new THREE.Mesh(
  roundedBoxGeometry(innerW + 0.02, backH, 0.12, 0.03),
  fabricMat
);
backPanel.position.set(0, frameTopY + backH / 2, -D / 2 + 0.07);
backPanel.rotation.x = -0.05; // subtle recline
addPart(backPanel, 'backRestPanel');

/* ---- Armrests (thin vertical panels either side) ----------------------- */
const armH = 0.26;
const armDepth = 0.80;
const armY = frameTopY + armH / 2;
for (const side of [-1, 1]) {
  const arm = new THREE.Mesh(
    roundedBoxGeometry(armW, armH, armDepth, 0.045),
    fabricMat
  );
  arm.position.set(side * (W / 2 - armW / 2), armY, -0.02);
  addPart(arm, side < 0 ? 'armLeft' : 'armRight');
}

/* ---- Seat cushions (3 separate, plush) --------------------------------- */
const seatGap = 0.012;
const seatDepth = 0.60;
const seatThick = 0.14;
const seatW = (innerW - 2 * seatGap) / 3;
const seatCenterZ = D / 2 - seatDepth / 2 - 0.04; // toward the front
const seatY = frameTopY + seatThick / 2;
for (let i = 0; i < 3; i++) {
  const cushion = new THREE.Mesh(
    roundedBoxGeometry(seatW - 0.01, seatThick, seatDepth, 0.05),
    cushionMat
  );
  const x = (i - 1) * (seatW + seatGap);
  cushion.position.set(x, seatY, seatCenterZ);
  addPart(cushion, 'seatCushion_' + (i + 1));
}

/* ---- Back cushions (3 separate, leaning against back panel) ------------- */
const backCushW = seatW - 0.01;
const backCushH = 0.40;
const backCushThick = 0.15;
const backCushY = frameTopY + seatThick + backCushH / 2 - 0.06;
const backCushZ = -D / 2 + 0.13 + backCushThick / 2;
for (let i = 0; i < 3; i++) {
  const bc = new THREE.Mesh(
    roundedBoxGeometry(backCushW, backCushH, backCushThick, 0.05),
    cushionMat
  );
  const x = (i - 1) * (seatW + seatGap);
  bc.position.set(x, backCushY, backCushZ);
  bc.rotation.x = -0.10; // recline so the top leans back
  addPart(bc, 'backCushion_' + (i + 1));
}

/* ---- Four splayed tapered wooden legs ---------------------------------- */
const cornerX = W / 2 - 0.16;   // inset from sides
const cornerZ = D / 2 - 0.16;   // inset from front/back
const splayX = 0.07, splayZ = 0.05;
const legRTop = 0.030, legRBottom = 0.014;
let legIndex = 0;
for (const sx of [-1, 1]) {
  for (const sz of [-1, 1]) {
    const top = new THREE.Vector3(sx * cornerX, legTopY, sz * cornerZ);
    const bottom = new THREE.Vector3(
      sx * (cornerX + splayX), 0.0, sz * (cornerZ + splayZ)
    );
    const leg = makeLeg(top, bottom, legRTop, legRBottom, woodMat);
    leg.name = 'leg_' + (++legIndex);
    sofa.add(leg);
  }
}

scene.add(sofa);

/* ---------------------------------------------------------------------------
   Ground / contact-shadow plane
   ------------------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0xdadade, roughness: 1.0, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------------
   OrbitControls
   ------------------------------------------------------------------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 1.5;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.5; // don't dip below the floor

/* ---------------------------------------------------------------------------
   Auto-frame camera to the sofa's bounding box
   ------------------------------------------------------------------------- */
function frameObject(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const fov = camera.fov * Math.PI / 180;
  let dist = maxDim / (2 * Math.tan(fov / 2));
  dist *= 1.55; // a little breathing room

  camera.position.set(
    center.x + dist * 0.85,
    center.y + dist * 0.45,
    center.z + dist * 0.95
  );
  camera.near = Math.max(0.05, dist / 100);
  camera.far = dist * 100;
  camera.updateProjectionMatrix();

  controls.target.copy(center);
  controls.update();
}
frameObject(sofa);

/* ---------------------------------------------------------------------------
   Resize handling
   ------------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------------------------------------------------------------------------
   Render loop
   ------------------------------------------------------------------------- */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
