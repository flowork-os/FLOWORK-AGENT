<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amigurumi Octopus</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #161326; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171428);
scene.fog = new THREE.Fog(0x171428, 10, 24);

const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 3.1, 11.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 7;
controls.maxDistance = 16;
controls.target.set(0, 1.15, 0);
controls.maxPolarAngle = Math.PI * 0.49;

const root = new THREE.Group();
root.rotation.y = -0.12;
scene.add(root);

const teal = new THREE.Color(0x29bdb8);
const aqua = new THREE.Color(0x62cfc5);
const indigo = new THREE.Color(0x6852ba);
const purple = new THREE.Color(0x9a5ab7);
const yarnBase = new THREE.MeshStandardMaterial({
  color: 0x51bcb9,
  roughness: 0.82,
  metalness: 0,
  flatShading: false
});

function yarnColor(t) {
  const c = new THREE.Color();
  if (t < 0.52) c.lerpColors(teal, aqua, t / 0.52);
  else c.lerpColors(aqua, purple, (t - 0.52) / 0.48);
  return c;
}

function makeYarnMaterial(color) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: 0.9,
    metalness: 0,
    sheen: 0.18,
    sheenColor: color.clone().lerp(new THREE.Color(0xffffff), 0.25)
  });
}

function addCrochetStitches(parent, radius, yMin, yMax, rows, columns, phase) {
  const stitchGeometry = new THREE.SphereGeometry(0.092, 9, 7);
  for (let row = 0; row < rows; row++) {
    const v = row / (rows - 1);
    const y = THREE.MathUtils.lerp(yMin, yMax, v);
    const profile = Math.sqrt(Math.max(0.05, 1 - Math.pow((y - 1.56) / 2.28, 2)));
    const ringRadius = radius * profile;
    for (let col = 0; col < columns; col++) {
      const a = (col / columns) * Math.PI * 2 + (row % 2 ? Math.PI / columns : 0) + phase;
      const wobble = 1 + 0.03 * Math.sin(row * 5.7 + col * 3.1);
      const mesh = new THREE.Mesh(stitchGeometry, makeYarnMaterial(yarnColor(v)));
      mesh.position.set(
        Math.cos(a) * ringRadius * wobble,
        y + 0.018 * Math.sin(col * 2.7 + row),
        Math.sin(a) * ringRadius * wobble
      );
      mesh.scale.set(1.25, 0.56, 0.85);
      mesh.rotation.set(0.25 * Math.sin(a), a + Math.PI / 2, 0.28 * Math.cos(a * 2));
      parent.add(mesh);
    }
  }
}

const bodyGeometry = new THREE.SphereGeometry(2.18, 58, 44);
const bodyPosition = bodyGeometry.attributes.position;
for (let i = 0; i < bodyPosition.count; i++) {
  const x = bodyPosition.getX(i);
  const y = bodyPosition.getY(i);
  const z = bodyPosition.getZ(i);
  const r = Math.sqrt(x * x + y * y + z * z) || 1;
  const nx = x / r;
  const ny = y / r;
  const nz = z / r;
  const lumpy = 0.045 * Math.sin(nx * 8.0 + ny * 3.7) * Math.cos(nz * 7.0)
    + 0.026 * Math.sin(nx * 15.0 - nz * 11.0 + ny * 4.0);
  bodyPosition.setXYZ(i, x + nx * lumpy, y * 1.08 + ny * lumpy, z + nz * lumpy);
}
bodyGeometry.computeVertexNormals();

const body = new THREE.Mesh(bodyGeometry, yarnBase);
body.position.y = 2.72;
body.scale.set(1, 1.06, 0.95);
body.castShadow = true;
body.receiveShadow = true;
root.add(body);

addCrochetStitches(root, 2.22, 0.83, 4.82, 22, 33, 0.12);

const topCap = new THREE.Mesh(
  new THREE.SphereGeometry(0.82, 28, 20),
  makeYarnMaterial(new THREE.Color(0x40beba))
);
topCap.position.set(0, 5.03, 0);
topCap.scale.set(1.18, 0.33, 1.08);
topCap.castShadow = true;
root.add(topCap);

function createTentacle(index) {
  const angle = index / 8 * Math.PI * 2 + Math.PI / 8;
  const points = [];
  const radial = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
  const side = new THREE.Vector3(-Math.sin(angle), 0, Math.cos(angle));
  const base = radial.clone().multiplyScalar(1.28);
  for (let j = 0; j <= 52; j++) {
    const t = j / 52;
    const outward = 1.0 + t * 2.3;
    const swirl = Math.sin(t * Math.PI * 3.15 + index * 0.73) * (0.26 + 0.48 * t);
    const curl = Math.sin(t * Math.PI * 5.0 + index * 1.28) * 0.18;
    const p = base.clone()
      .add(radial.clone().multiplyScalar(outward))
      .add(side.clone().multiplyScalar(swirl));
    p.y = 0.57 - 0.38 * t + 0.16 * Math.sin(t * Math.PI * 2.4 + index);
    p.add(radial.clone().multiplyScalar(curl));
    points.push(p);
  }
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal', 0.38);
  const tube = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 100, 0.29, 10, false),
    makeYarnMaterial(yarnColor(index / 9))
  );
  tube.castShadow = true;
  tube.receiveShadow = true;
  root.add(tube);

  const stitchGeo = new THREE.TorusGeometry(0.302, 0.036, 7, 12);
  for (let s = 0; s < 18; s++) {
    const t = (s + 0.45) / 18;
    const p = curve.getPointAt(t);
    const tangent = curve.getTangentAt(t).normalize();
    const stitch = new THREE.Mesh(stitchGeo, makeYarnMaterial(yarnColor((index + t * 3) / 10)));
    stitch.position.copy(p);
    stitch.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tangent);
    stitch.scale.set(1, 0.8, 1);
    stitch.castShadow = true;
    root.add(stitch);
  }
}

for (let i = 0; i < 8; i++) createTentacle(i);

const face = new THREE.Group();
face.position.z = 2.04;
face.position.y = 2.85;
root.add(face);

function createEye(x) {
  const eyeGroup = new THREE.Group();
  eyeGroup.position.set(x, 0.28, 0);

  const rim = new THREE.Mesh(
    new THREE.SphereGeometry(0.315, 24, 18),
    new THREE.MeshStandardMaterial({ color: 0x34304a, roughness: 0.72 })
  );
  rim.scale.set(1, 1, 0.36);
  rim.castShadow = true;
  eyeGroup.add(rim);

  const black = new THREE.Mesh(
    new THREE.SphereGeometry(0.255, 24, 18),
    new THREE.MeshStandardMaterial({ color: 0x11111a, roughness: 0.34, metalness: 0.05 })
  );
  black.position.z = 0.075;
  black.scale.set(1, 1, 0.34);
  eyeGroup.add(black);

  const glint = new THREE.Mesh(
    new THREE.SphereGeometry(0.065, 12, 10),
    new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.25 })
  );
  glint.position.set(-0.075, 0.085, 0.16);
  eyeGroup.add(glint);

  face.add(eyeGroup);
}

createEye(-0.67);
createEye(0.67);

const smilePoints = [];
for (let i = 0; i <= 28; i++) {
  const t = i / 28;
  const x = THREE.MathUtils.lerp(-0.43, 0.43, t);
  const y = -0.18 - 0.23 * Math.sin(t * Math.PI);
  smilePoints.push(new THREE.Vector3(x, y, 0.15));
}
const smileCurve = new THREE.CatmullRomCurve3(smilePoints);
const smile = new THREE.Mesh(
  new THREE.TubeGeometry(smileCurve, 52, 0.052, 8, false),
  new THREE.MeshStandardMaterial({ color: 0x5b3155, roughness: 0.82 })
);
smile.castShadow = true;
face.add(smile);

const blushMaterial = new THREE.MeshStandardMaterial({ color: 0xe48cae, roughness: 0.86, transparent: true, opacity: 0.55 });
for (const x of [-1.12, 1.12]) {
  const blush = new THREE.Mesh(new THREE.SphereGeometry(0.24, 18, 12), blushMaterial);
  blush.position.set(x, -0.25, 0.02);
  blush.scale.set(1.35, 0.56, 0.22);
  face.add(blush);
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(7.4, 96),
  new THREE.MeshStandardMaterial({ color: 0x292242, roughness: 0.95, metalness: 0 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.48;
floor.receiveShadow = true;
scene.add(floor);

const hemi = new THREE.HemisphereLight(0xa7ddec, 0x2a183c, 2.2);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe5d0, 4.4);
key.position.set(-5, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -7;
scene.add(key);

const fill = new THREE.PointLight(0x9567ff, 30, 12, 2);
fill.position.set(4, 3.2, -3);
scene.add(fill);

const rimLight = new THREE.PointLight(0x4ed7d0, 20, 10, 2);
rimLight.position.set(-4, 4, -4);
scene.add(rimLight);

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  root.position.y = 0.05 * Math.sin(elapsed * 1.2);
  topCap.rotation.y = elapsed * 0.12;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
