<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stone Fireplace Pavilion</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111214; }
  #app { position: fixed; inset: 0; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: rgba(220,220,225,0.45); letter-spacing: 0.02em; pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hint">Stone Fireplace Pavilion — drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------------------------------------------------------------------
   Renderer
--------------------------------------------------------------------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

/* ---------------------------------------------------------------------------
   Scene & Camera
--------------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111214);
scene.fog = new THREE.Fog(0x111214, 16, 42);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(6.2, 3.4, 7.4);

/* ---------------------------------------------------------------------------
   Controls
--------------------------------------------------------------------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.enablePan = false;
controls.minDistance = 4.5;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 1.8, 0);

/* ---------------------------------------------------------------------------
   Lighting : hemisphere ambient + directional key + fill + rim
--------------------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0x9fb4cc, 0x2a241d, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff1dd, 2.7);
key.position.set(6.5, 8.5, 5.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 34;
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -2;
key.shadow.bias = -0.0003;
key.shadow.normalBias = 0.025;
key.target.position.set(0, 1.7, 0);
scene.add(key);
scene.add(key.target);

const fill = new THREE.DirectionalLight(0xbcd2ff, 0.55);
fill.position.set(-7, 4, 3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffe4bf, 1.0);
rim.position.set(-4, 5.5, -7.5);
scene.add(rim);

/* ---------------------------------------------------------------------------
   Ground plane : receives shadows only
--------------------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.16;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------------
   Deterministic pseudo-random helpers
--------------------------------------------------------------------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260706);

function hash3(x, y, z) {
  const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453;
  return s - Math.floor(s);
}

/* ---------------------------------------------------------------------------
   Stone material palette & rugged geometry
--------------------------------------------------------------------------- */
const PALETTE = [0x8d867a, 0x9a938a, 0x7c766c, 0xa39b8f, 0x6f6960, 0x847d70, 0x958c7e];

function stoneColor(base) {
  const c = new THREE.Color(base != null ? base : PALETTE[Math.floor(rand() * PALETTE.length)]);
  const hsl = {};
  c.getHSL(hsl);
  c.setHSL(
    hsl.h + (rand() - 0.5) * 0.02,
    THREE.MathUtils.clamp(hsl.s * (0.8 + rand() * 0.45), 0, 1),
    THREE.MathUtils.clamp(hsl.l * (0.82 + rand() * 0.34), 0, 1)
  );
  return c;
}

function sootColor() {
  const c = new THREE.Color(0x2b2521);
  const hsl = {};
  c.getHSL(hsl);
  c.setHSL(hsl.h, hsl.s * (0.6 + rand() * 0.5), hsl.l * (0.6 + rand() * 0.7));
  return c;
}

// Rugged stone: subdivided box with noise-displaced vertices, flat-shaded.
function makeStoneGeo(w, h, d) {
  const g = new THREE.BoxGeometry(w, h, d, 2, 2, 2);
  const pos = g.attributes.position;
  const seed = rand() * 1000;
  const amp = Math.min(0.028, Math.min(w, h, d) * 0.16);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const nx = hash3(x * 13.1 + seed, y * 7.7 + seed, z * 11.3 + seed) - 0.5;
    const ny = hash3(x * 5.3 - seed, y * 9.1 + seed, z * 3.7 - seed) - 0.5;
    const nz = hash3(x * 8.9 + seed, y * 2.3 - seed, z * 6.1 + seed) - 0.5;
    pos.setXYZ(i, x + nx * amp, y + ny * amp, z + nz * amp);
  }
  g.computeVertexNormals();
  return g;
}

const pavilion = new THREE.Group();
scene.add(pavilion);

function addStone(cx, cy, cz, w, h, d, opts) {
  opts = opts || {};
  const geo = makeStoneGeo(Math.max(0.05, w), Math.max(0.05, h), Math.max(0.05, d));
  const mat = new THREE.MeshStandardMaterial({
    color: opts.color || stoneColor(),
    roughness: opts.roughness != null ? opts.roughness : 0.96,
    metalness: 0.0,
    flatShading: true
  });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(cx, cy, cz);
  if (opts.rot) m.rotation.set(opts.rot.x || 0, opts.rot.y || 0, opts.rot.z || 0);
  m.castShadow = true;
  m.receiveShadow = true;
  pavilion.add(m);
  return m;
}

/* ---------------------------------------------------------------------------
   Global masonry dimensions (metres)
--------------------------------------------------------------------------- */
const massHalfW = 1.25;   // chimney mass half-width in X
const massHalfD = 0.50;   // chimney mass half-depth in Z (front-back)
const wallTop   = 3.90;   // top of the stacked mass (cap sits above)
const fbHalf    = 0.60;   // firebox half-width
const spring    = 1.20;   // spring line (top of vertical jambs)
const archR     = 0.60;   // arch inner radius (= firebox half-width)
const voussoirD = 0.34;   // radial depth of arch ring
const Ro        = archR + voussoirD; // outer clearance radius for surrounding blocks
const mortar    = 0.025;  // joint gap

/* ---------------------------------------------------------------------------
   Fill a horizontal course segment with irregular stacked blocks
--------------------------------------------------------------------------- */
function segStones(x0, x1, y0, y1, zc, zdepth, colFn) {
  const segW = x1 - x0;
  if (segW <= 0.06) return;
  const n = Math.max(1, Math.round(segW / 0.46));
  const cuts = [x0];
  for (let k = 1; k < n; k++) {
    const base = x0 + segW * (k / n);
    cuts.push(base + (rand() - 0.5) * (segW / n) * 0.42);
  }
  cuts.push(x1);
  const cy = (y0 + y1) / 2;
  for (let k = 0; k < n; k++) {
    const a = cuts[k], b = cuts[k + 1];
    const bw = b - a;
    if (bw <= 0.04) continue;
    addStone(
      (a + b) / 2,
      cy,
      zc + (rand() - 0.5) * 0.03,
      bw - mortar,
      (y1 - y0) - mortar,
      zdepth * (0.94 + rand() * 0.06),
      { color: colFn ? colFn() : stoneColor() }
    );
  }
}

/* ---------------------------------------------------------------------------
   Build the chimney mass with an arched firebox opening
--------------------------------------------------------------------------- */
function buildMass() {
  let y = 0;
  while (y < wallTop - 0.001) {
    const h = 0.30 * (0.85 + 0.35 * rand());
    const y0 = y, y1 = Math.min(y + h, wallTop);
    const cy = (y0 + y1) / 2;

    // outer opening half-width (leaves room for the voussoir ring)
    let openHalf = 0;
    if (cy < spring) {
      openHalf = fbHalf;
    } else {
      const dy = cy - spring;
      openHalf = dy < Ro ? Math.sqrt(Ro * Ro - dy * dy) : 0;
    }

    if (openHalf > 0) {
      segStones(-massHalfW, -openHalf, y0, y1, 0, 2 * massHalfD);
      segStones(openHalf, massHalfW, y0, y1, 0, 2 * massHalfD);
    } else {
      segStones(-massHalfW, massHalfW, y0, y1, 0, 2 * massHalfD);
    }
    y = y1;
  }
}

/* ---------------------------------------------------------------------------
   Firebox back wall (sooty stacked stone set toward the rear)
--------------------------------------------------------------------------- */
function buildFireboxBack() {
  const backTop = spring + archR; // 1.80
  const zc = -massHalfD + 0.22;   // recessed toward the back
  let y = 0;
  while (y < backTop - 0.001) {
    const h = 0.27 * (0.85 + 0.35 * rand());
    const y0 = y, y1 = Math.min(y + h, backTop);
    const cy = (y0 + y1) / 2;
    let inHalf;
    if (cy < spring) {
      inHalf = fbHalf;
    } else {
      const dy = cy - spring;
      inHalf = dy < archR ? Math.sqrt(archR * archR - dy * dy) : 0;
    }
    if (inHalf > 0.06) segStones(-inHalf, inHalf, y0, y1, zc, 0.42, sootColor);
    y = y1;
  }
}

/* ---------------------------------------------------------------------------
   Voussoir arch ring + keystone
--------------------------------------------------------------------------- */
function buildArch() {
  const N = 13;
  const midIdx = Math.round((N - 1) / 2);
  const arcSeg = (Math.PI * archR) / (N - 1);
  for (let i = 0; i < N; i++) {
    const isKey = i === midIdx;
    const theta = Math.PI * (i / (N - 1)); // 0..PI, right spring -> over top -> left spring
    const vd = isKey ? voussoirD * 1.28 : voussoirD;
    const rMid = archR + vd / 2;
    const x = Math.cos(theta) * rMid;
    const y = spring + Math.sin(theta) * rMid;
    const tang = arcSeg * (isKey ? 1.35 : 1.08);
    const depth = 2 * massHalfD + (isKey ? 0.12 : 0.0);
    const zoff = isKey ? 0.06 : 0.0;
    addStone(
      x, y, zoff,
      vd - 0.02,             // radial (local X)
      tang,                  // tangential (local Y)
      depth * (0.96 + rand() * 0.05),
      { color: stoneColor(isKey ? 0xbdb3a3 : 0xa79e90), rot: { z: theta }, roughness: 0.9 }
    );
  }
}

/* ---------------------------------------------------------------------------
   Flanking stone piers (buttress-like, protruding forward & outward)
--------------------------------------------------------------------------- */
function buildPier(sign) {
  const cx = sign * 1.16;
  const z0 = -0.12, z1 = 0.92;
  const zc = (z0 + z1) / 2;
  const zdepth = z1 - z0;
  const pw = 0.56;
  const top = 2.55;
  let y = 0;
  while (y < top - 0.001) {
    const h = 0.33 * (0.85 + 0.32 * rand());
    const y0 = y, y1 = Math.min(y + h, top);
    addStone(
      cx + (rand() - 0.5) * 0.02,
      (y0 + y1) / 2,
      zc + (rand() - 0.5) * 0.02,
      pw - mortar,
      (y1 - y0) - mortar,
      zdepth * (0.95 + rand() * 0.05),
      { color: stoneColor(0x7c766c) }
    );
    y = y1;
  }
  // pier cap (overhanging dressed block)
  addStone(cx, top + 0.09, zc, pw + 0.20, 0.18, zdepth + 0.20, { color: stoneColor(0x9a938a), roughness: 0.85 });
}

/* ---------------------------------------------------------------------------
   Stepped chimney cap (corbelled drip cap + capstone)
--------------------------------------------------------------------------- */
function buildCap() {
  let y = wallTop;
  const steps = [
    { hw: 1.30, hd: 0.55, h: 0.16, color: 0x847d70, r: 0.9 },
    { hw: 1.42, hd: 0.64, h: 0.16, color: 0x9a938a, r: 0.85 },
    { hw: 1.55, hd: 0.73, h: 0.22, color: 0xa79e90, r: 0.8 }
  ];
  for (const s of steps) {
    addStone(0, y + s.h / 2, 0, s.hw * 2, s.h, s.hd * 2, { color: stoneColor(s.color), roughness: s.r });
    y += s.h;
  }
}

/* ---------------------------------------------------------------------------
   Hearth slab base (flagstones + front apron)
--------------------------------------------------------------------------- */
function buildHearth() {
  const cols = [-1.55, -0.5, 0.5, 1.55];
  const rows = [-0.58, 0.02, 0.62, 1.25];
  for (let i = 0; i < cols.length - 1; i++) {
    for (let j = 0; j < rows.length - 1; j++) {
      const x0 = cols[i], x1 = cols[i + 1];
      const z0 = rows[j], z1 = rows[j + 1];
      const h = 0.17 * (0.9 + 0.2 * rand());
      addStone(
        (x0 + x1) / 2,
        -0.16 + h / 2,
        (z0 + z1) / 2,
        (x1 - x0) - 0.05,
        h,
        (z1 - z0) - 0.05,
        { color: stoneColor(0x8d867a), rot: { y: (rand() - 0.5) * 0.03 }, roughness: 0.92 }
      );
    }
  }
}

/* ---------------------------------------------------------------------------
   Ember bed + interior fire glow
--------------------------------------------------------------------------- */
const ember = new THREE.Mesh(
  new THREE.BoxGeometry(0.95, 0.12, 0.34, 3, 1, 2),
  new THREE.MeshStandardMaterial({ color: 0x2a1206, roughness: 1.0, emissive: 0xff4d12, emissiveIntensity: 1.3 })
);
ember.position.set(0, 0.06, -0.02);
ember.castShadow = false;
ember.receiveShadow = true;
pavilion.add(ember);

const fireLight = new THREE.PointLight(0xff5a1e, 7.0, 3.4, 2);
fireLight.position.set(0, 0.55, 0.02);
pavilion.add(fireLight);

/* ---------------------------------------------------------------------------
   Assemble
--------------------------------------------------------------------------- */
buildMass();
buildFireboxBack();
buildArch();
buildPier(-1);
buildPier(1);
buildCap();
buildHearth();

// keep the single object precisely centered on the origin (X/Z)
pavilion.position.set(0, 0, 0);

/* ---------------------------------------------------------------------------
   Resize
--------------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------------------------------------------------------------------------
   Animation loop
--------------------------------------------------------------------------- */
function animate() {
  requestAnimationFrame(animate);
  const t = performance.now() * 0.001;
  const flicker = 7.0 + Math.sin(t * 11.0) * 1.6 + Math.sin(t * 23.3) * 1.0;
  fireLight.intensity = Math.max(3.0, flicker);
  ember.material.emissiveIntensity = 1.15 + 0.35 * Math.sin(t * 13.0) + 0.2 * Math.sin(t * 29.0);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
