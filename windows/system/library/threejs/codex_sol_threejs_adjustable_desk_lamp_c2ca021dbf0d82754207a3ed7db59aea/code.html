<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adjustable Desk Lamp</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d9d5cc;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 24px;
      bottom: 20px;
      color: rgba(30, 32, 31, 0.72);
      font: 500 12px/1.5 system-ui, sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Articulated Task Lamp · Millimeter Scale</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd9d5cc);
    scene.fog = new THREE.Fog(0xd9d5cc, 1500, 3000);

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 1, 5000);
    camera.position.set(980, 690, 1180);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 330, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;
    controls.minDistance = 650;
    controls.maxDistance = 2300;
    controls.maxPolarAngle = Math.PI * 0.48;

    const matteBlack = new THREE.MeshStandardMaterial({
      color: 0x202321,
      roughness: 0.56,
      metalness: 0.72
    });
    const edgeBlack = new THREE.MeshStandardMaterial({
      color: 0x111311,
      roughness: 0.38,
      metalness: 0.82
    });
    const jointMetal = new THREE.MeshStandardMaterial({
      color: 0x3d403d,
      roughness: 0.33,
      metalness: 0.9
    });
    const springMetal = new THREE.MeshStandardMaterial({
      color: 0x8b8e89,
      roughness: 0.28,
      metalness: 0.95
    });
    const shadeInterior = new THREE.MeshStandardMaterial({
      color: 0xe8dfca,
      roughness: 0.48,
      metalness: 0.15,
      side: THREE.BackSide
    });
    const brass = new THREE.MeshStandardMaterial({
      color: 0xa47b3e,
      roughness: 0.32,
      metalness: 0.86
    });
    const rubber = new THREE.MeshStandardMaterial({
      color: 0x090a09,
      roughness: 0.9,
      metalness: 0.02
    });
    const bulbMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xfff1cc,
      emissive: 0xffc875,
      emissiveIntensity: 2.2,
      roughness: 0.25,
      transmission: 0.1
    });

    function shadow(mesh, cast = true, receive = true) {
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      return mesh;
    }

    function cylinderBetween(a, b, radius, material, radialSegments = 20) {
      const delta = new THREE.Vector3().subVectors(b, a);
      const length = delta.length();
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, radialSegments, 1, false),
        material
      );
      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
      return shadow(mesh);
    }

    function jointAt(position, radius, width) {
      const group = new THREE.Group();
      group.position.copy(position);

      const hub = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, width, 40),
        matteBlack
      );
      hub.rotation.x = Math.PI / 2;
      shadow(hub);
      group.add(hub);

      const capGeometry = new THREE.CylinderGeometry(radius * 0.72, radius * 0.72, 3.5, 32);
      for (const z of [-width * 0.52, width * 0.52]) {
        const cap = new THREE.Mesh(capGeometry, jointMetal);
        cap.rotation.x = Math.PI / 2;
        cap.position.z = z;
        shadow(cap);
        group.add(cap);

        const screw = new THREE.Mesh(
          new THREE.CylinderGeometry(radius * 0.18, radius * 0.18, 5, 20),
          edgeBlack
        );
        screw.rotation.x = Math.PI / 2;
        screw.position.z = z * 1.035;
        shadow(screw);
        group.add(screw);
      }
      return group;
    }

    function createSpring(start, end, coils, radius, wireRadius, material, phase = 0) {
      const axis = new THREE.Vector3().subVectors(end, start);
      const length = axis.length();
      const direction = axis.clone().normalize();
      const reference = Math.abs(direction.y) < 0.9
        ? new THREE.Vector3(0, 1, 0)
        : new THREE.Vector3(1, 0, 0);
      const basisA = new THREE.Vector3().crossVectors(direction, reference).normalize();
      const basisB = new THREE.Vector3().crossVectors(direction, basisA).normalize();
      const points = [];
      const steps = coils * 14;

      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const angle = phase + t * coils * Math.PI * 2;
        const taper = Math.min(1, t * 7, (1 - t) * 7);
        const point = start.clone().addScaledVector(direction, length * t);
        point.addScaledVector(basisA, Math.cos(angle) * radius * taper);
        point.addScaledVector(basisB, Math.sin(angle) * radius * taper);
        points.push(point);
      }

      const curve = new THREE.CatmullRomCurve3(points);
      const tube = new THREE.Mesh(
        new THREE.TubeGeometry(curve, steps * 2, wireRadius, 8, false),
        material
      );
      return shadow(tube);
    }

    const lamp = new THREE.Group();
    lamp.rotation.y = -0.18;
    scene.add(lamp);

    const baseTop = 37;
    const base = new THREE.Mesh(
      new THREE.CylinderGeometry(126, 134, 27, 64, 2),
      matteBlack
    );
    base.position.y = 20;
    shadow(base);
    lamp.add(base);

    const baseBevel = new THREE.Mesh(
      new THREE.TorusGeometry(129, 5, 10, 64),
      edgeBlack
    );
    baseBevel.rotation.x = Math.PI / 2;
    baseBevel.position.y = 31;
    shadow(baseBevel);
    lamp.add(baseBevel);

    const foot = new THREE.Mesh(
      new THREE.CylinderGeometry(121, 126, 8, 64),
      rubber
    );
    foot.position.y = 4;
    shadow(foot);
    lamp.add(foot);

    const pedestal = new THREE.Mesh(
      new THREE.CylinderGeometry(38, 46, 34, 48),
      matteBlack
    );
    pedestal.position.y = baseTop + 10;
    shadow(pedestal);
    lamp.add(pedestal);

    const lowerPivot = new THREE.Vector3(0, 76, 0);
    const elbow = new THREE.Vector3(-132, 405, 0);
    const headPivot = new THREE.Vector3(82, 681, 0);

    lamp.add(jointAt(lowerPivot, 34, 58));
    lamp.add(jointAt(elbow, 31, 64));
    lamp.add(jointAt(headPivot, 27, 58));

    const armOffset = 18;
    const lowerStart = lowerPivot.clone().add(new THREE.Vector3(-7, 14, 0));
    const lowerEnd = elbow.clone().add(new THREE.Vector3(4, -13, 0));
    const upperStart = elbow.clone().add(new THREE.Vector3(13, 11, 0));
    const upperEnd = headPivot.clone().add(new THREE.Vector3(-11, -10, 0));

    for (const z of [-armOffset, armOffset]) {
      const a1 = lowerStart.clone();
      const b1 = lowerEnd.clone();
      a1.z = z;
      b1.z = z;
      lamp.add(cylinderBetween(a1, b1, 10.5, matteBlack));

      const a2 = upperStart.clone();
      const b2 = upperEnd.clone();
      a2.z = z;
      b2.z = z;
      lamp.add(cylinderBetween(a2, b2, 10.5, matteBlack));
    }

    const lowerCrossbars = [0.31, 0.68];
    for (const t of lowerCrossbars) {
      const center = lowerStart.clone().lerp(lowerEnd, t);
      const a = center.clone().setZ(-armOffset);
      const b = center.clone().setZ(armOffset);
      lamp.add(cylinderBetween(a, b, 6, jointMetal, 16));
    }

    const upperCrossbars = [0.35, 0.72];
    for (const t of upperCrossbars) {
      const center = upperStart.clone().lerp(upperEnd, t);
      const a = center.clone().setZ(-armOffset);
      const b = center.clone().setZ(armOffset);
      lamp.add(cylinderBetween(a, b, 6, jointMetal, 16));
    }

    const lowerSpringStart = lowerPivot.clone().add(new THREE.Vector3(-31, 54, 28));
    const lowerSpringEnd = elbow.clone().lerp(lowerPivot, 0.22).add(new THREE.Vector3(8, 6, 28));
    lamp.add(createSpring(lowerSpringStart, lowerSpringEnd, 21, 12, 2.5, springMetal));

    const upperSpringStart = elbow.clone().add(new THREE.Vector3(25, 38, -29));
    const upperSpringEnd = headPivot.clone().lerp(elbow, 0.23).add(new THREE.Vector3(-8, -3, -29));
    lamp.add(createSpring(upperSpringStart, upperSpringEnd, 18, 11, 2.4, springMetal, Math.PI));

    const springHooks = [
      [lowerPivot.clone().add(new THREE.Vector3(-20, 32, 28)), lowerSpringStart],
      [lowerSpringEnd, elbow.clone().add(new THREE.Vector3(-5, -12, 28))],
      [elbow.clone().add(new THREE.Vector3(18, 21, -29)), upperSpringStart],
      [upperSpringEnd, headPivot.clone().add(new THREE.Vector3(-13, -17, -29))]
    ];
    for (const pair of springHooks) {
      lamp.add(cylinderBetween(pair[0], pair[1], 2.6, springMetal, 10));
    }

    const shadeDirection = new THREE.Vector3(0.28, -0.95, 0.08).normalize();
    const neckEnd = headPivot.clone().addScaledVector(shadeDirection, 57);
    lamp.add(cylinderBetween(headPivot, neckEnd, 17, matteBlack));

    const collar = new THREE.Mesh(
      new THREE.CylinderGeometry(29, 25, 42, 36),
      matteBlack
    );
    collar.position.copy(neckEnd).addScaledVector(shadeDirection, 18);
    collar.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), shadeDirection);
    shadow(collar);
    lamp.add(collar);

    const shadeHeight = 158;
    const shadeCenter = neckEnd.clone().addScaledVector(shadeDirection, 104);
    const shadeGeometry = new THREE.CylinderGeometry(43, 118, shadeHeight, 64, 1, true);
    const shadeOuter = new THREE.Mesh(shadeGeometry, matteBlack);
    shadeOuter.position.copy(shadeCenter);
    shadeOuter.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), shadeDirection);
    shadow(shadeOuter);
    lamp.add(shadeOuter);

    const innerShade = new THREE.Mesh(
      new THREE.CylinderGeometry(40, 113, shadeHeight - 5, 64, 1, true),
      shadeInterior
    );
    innerShade.position.copy(shadeCenter).addScaledVector(shadeDirection, 2);
    innerShade.quaternion.copy(shadeOuter.quaternion);
    innerShade.receiveShadow = true;
    lamp.add(innerShade);

    const rimCenter = shadeCenter.clone().addScaledVector(shadeDirection, shadeHeight * 0.5);
    const rim = new THREE.Mesh(
      new THREE.TorusGeometry(116, 4.8, 12, 64),
      edgeBlack
    );
    rim.position.copy(rimCenter);
    rim.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), shadeDirection);
    shadow(rim);
    lamp.add(rim);

    const bulbCenter = shadeCenter.clone().addScaledVector(shadeDirection, 48);
    const socket = new THREE.Mesh(
      new THREE.CylinderGeometry(25, 25, 48, 32),
      brass
    );
    socket.position.copy(shadeCenter).addScaledVector(shadeDirection, -35);
    socket.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), shadeDirection);
    shadow(socket);
    lamp.add(socket);

    const bulb = new THREE.Mesh(
      new THREE.SphereGeometry(34, 36, 24),
      bulbMaterial
    );
    bulb.scale.set(1, 1.18, 1);
    bulb.position.copy(bulbCenter);
    bulb.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), shadeDirection);
    shadow(bulb);
    lamp.add(bulb);

    const switchHousing = new THREE.Mesh(
      new THREE.CylinderGeometry(10, 10, 18, 24),
      edgeBlack
    );
    switchHousing.rotation.z = Math.PI / 2;
    switchHousing.position.set(26, 53, 0);
    shadow(switchHousing);
    lamp.add(switchHousing);

    const cablePoints = [
      new THREE.Vector3(0, 47, -43),
      new THREE.Vector3(-22, 122, -38),
      new THREE.Vector3(-106, 382, -38),
      new THREE.Vector3(-93, 433, -38),
      new THREE.Vector3(58, 659, -35),
      new THREE.Vector3(83, 681, -24)
    ];
    const cableCurve = new THREE.CatmullRomCurve3(cablePoints);
    const cable = new THREE.Mesh(
      new THREE.TubeGeometry(cableCurve, 80, 3.3, 9, false),
      rubber
    );
    shadow(cable);
    lamp.add(cable);

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0xbab5aa,
      roughness: 0.92,
      metalness: 0
    });
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(1700, 96),
      floorMaterial
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    floor.receiveShadow = true;
    scene.add(floor);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(520, 522, 96),
      new THREE.MeshBasicMaterial({
        color: 0x9f9a91,
        transparent: true,
        opacity: 0.25,
        side: THREE.DoubleSide
      })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.3;
    scene.add(ring);

    const hemisphere = new THREE.HemisphereLight(0xf3f5f2, 0x6f695f, 2.0);
    scene.add(hemisphere);

    const keyLight = new THREE.DirectionalLight(0xfff4df, 4.2);
    keyLight.position.set(720, 1080, 650);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -700;
    keyLight.shadow.camera.right = 700;
    keyLight.shadow.camera.top = 1000;
    keyLight.shadow.camera.bottom = -300;
    keyLight.shadow.camera.near = 100;
    keyLight.shadow.camera.far = 2200;
    keyLight.shadow.bias = -0.00025;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xb8d0e3, 1.5);
    fillLight.position.set(-650, 500, 800);
    scene.add(fillLight);

    const lampLight = new THREE.SpotLight(0xffd791, 65000, 1050, Math.PI * 0.24, 0.55, 1.6);
    lampLight.position.copy(bulbCenter);
    lampLight.castShadow = true;
    lampLight.shadow.mapSize.set(1024, 1024);
    lampLight.shadow.bias = -0.0002;
    lampLight.target.position.copy(bulbCenter).addScaledVector(shadeDirection, 700);
    scene.add(lampLight);
    scene.add(lampLight.target);

    const warmGlow = new THREE.PointLight(0xffcb76, 3400, 280, 2);
    warmGlow.position.copy(bulbCenter).addScaledVector(shadeDirection, 25);
    scene.add(warmGlow);

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    }
    addEventListener('resize', resize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
