<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low-Poly Pronghorn</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #d9d1bd; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xd8d2c2);
  scene.fog = new THREE.Fog(0xd8d2c2, 15, 28);

  const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 60);
  camera.position.set(8.5, 5.6, 9.5);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 2.7, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.7;
  controls.minDistance = 7;
  controls.maxDistance = 18;
  controls.maxPolarAngle = Math.PI * 0.48;

  const hemi = new THREE.HemisphereLight(0xfff7df, 0x6d6657, 2.1);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xffedca, 4.2);
  sun.position.set(6, 10, 7);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -7;
  sun.shadow.camera.right = 7;
  sun.shadow.camera.top = 9;
  sun.shadow.camera.bottom = -3;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 24;
  sun.shadow.bias = -0.0007;
  scene.add(sun);

  const fill = new THREE.DirectionalLight(0xb8d2df, 1.0);
  fill.position.set(-5, 5, -7);
  scene.add(fill);

  const material = (color, roughness = 0.9) => new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness: 0,
    flatShading: true
  });

  const tanMaterials = [
    material(0xb8793e),
    material(0xc98b4e),
    material(0xa86634),
    material(0xd09a5d),
    material(0x92552e)
  ];
  const neckMaterials = [
    material(0xaf6e38),
    material(0xc28649),
    material(0x95532d),
    material(0xd19a59)
  ];
  const whiteMaterials = [
    material(0xeee6d1),
    material(0xfff8e8),
    material(0xd9d0bb),
    material(0xf3ecd9)
  ];
  const cocoaMaterials = [
    material(0x3b251b),
    material(0x513024),
    material(0x2a1b16),
    material(0x68402a)
  ];
  const blackMaterial = material(0x171514);
  const hoofMaterial = material(0x211b18);
  const eyeMaterial = new THREE.MeshStandardMaterial({
    color: 0x090807,
    roughness: 0.25,
    metalness: 0.05
  });

  function facetedGeometry(source, count, offset = 0) {
    const geometry = source.index ? source.toNonIndexed() : source.clone();
    geometry.clearGroups();
    const triangleCount = geometry.attributes.position.count / 3;
    for (let i = 0; i < triangleCount; i++) {
      const index = (i * 7 + Math.floor(i / 3) * 3 + offset) % count;
      geometry.addGroup(i * 3, 3, index);
    }
    geometry.computeVertexNormals();
    return geometry;
  }

  function facetedMesh(geometry, materials, offset = 0) {
    const mesh = new THREE.Mesh(
      facetedGeometry(geometry, materials.length, offset),
      materials
    );
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }

  function segment(a, b, radiusA, radiusB, materials, sides = 4, offset = 0) {
    const start = new THREE.Vector3(...a);
    const end = new THREE.Vector3(...b);
    const direction = end.clone().sub(start);
    const length = direction.length();
    const geometry = new THREE.CylinderGeometry(
      radiusB,
      radiusA,
      length,
      sides,
      1,
      false
    );
    const mesh = facetedMesh(geometry, materials, offset);
    mesh.position.copy(start).add(end).multiplyScalar(0.5);
    mesh.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      direction.normalize()
    );
    return mesh;
  }

  function wedgeGeometry(length, rearHeight, frontHeight, rearWidth, frontWidth) {
    const x0 = -length * 0.5;
    const x1 = length * 0.5;
    const vertices = [
      x0, -rearHeight * 0.5, -rearWidth * 0.5,
      x0, -rearHeight * 0.5,  rearWidth * 0.5,
      x0,  rearHeight * 0.5, -rearWidth * 0.5,
      x0,  rearHeight * 0.5,  rearWidth * 0.5,
      x1, -frontHeight * 0.5, -frontWidth * 0.5,
      x1, -frontHeight * 0.5,  frontWidth * 0.5,
      x1,  frontHeight * 0.5, -frontWidth * 0.5,
      x1,  frontHeight * 0.5,  frontWidth * 0.5
    ];
    const faces = [
      0, 1, 3, 0, 3, 2,
      4, 6, 7, 4, 7, 5,
      0, 4, 5, 0, 5, 1,
      2, 3, 7, 2, 7, 6,
      0, 2, 6, 0, 6, 4,
      1, 5, 7, 1, 7, 3
    ];
    const positions = [];
    for (const index of faces) {
      positions.push(
        vertices[index * 3],
        vertices[index * 3 + 1],
        vertices[index * 3 + 2]
      );
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.computeVertexNormals();
    return geometry;
  }

  function triangleMesh(points, mat) {
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(points.flat(), 3)
    );
    geometry.computeVertexNormals();
    const mesh = new THREE.Mesh(geometry, mat);
    mesh.castShadow = true;
    mesh.material.side = THREE.DoubleSide;
    return mesh;
  }

  const pronghorn = new THREE.Group();
  pronghorn.rotation.y = -0.08;
  scene.add(pronghorn);

  const body = facetedMesh(
    new THREE.IcosahedronGeometry(1, 2),
    tanMaterials,
    1
  );
  body.scale.set(2.35, 1.02, 0.83);
  body.position.set(-0.15, 2.78, 0);
  pronghorn.add(body);

  const shoulder = facetedMesh(
    new THREE.IcosahedronGeometry(1, 1),
    neckMaterials,
    2
  );
  shoulder.scale.set(0.9, 1.08, 0.78);
  shoulder.position.set(1.35, 3.05, 0);
  shoulder.rotation.z = -0.18;
  pronghorn.add(shoulder);

  const rump = facetedMesh(
    new THREE.IcosahedronGeometry(1, 1),
    whiteMaterials,
    0
  );
  rump.scale.set(0.86, 0.86, 0.79);
  rump.position.set(-1.72, 2.89, 0);
  pronghorn.add(rump);

  const rumpCap = facetedMesh(
    new THREE.IcosahedronGeometry(1, 1),
    tanMaterials,
    3
  );
  rumpCap.scale.set(0.72, 0.43, 0.82);
  rumpCap.position.set(-1.38, 3.45, 0);
  pronghorn.add(rumpCap);

  const belly = facetedMesh(
    new THREE.IcosahedronGeometry(1, 1),
    whiteMaterials,
    2
  );
  belly.scale.set(1.25, 0.34, 0.77);
  belly.position.set(-0.2, 2.22, 0);
  pronghorn.add(belly);

  const neck = segment(
    [1.22, 3.25, 0],
    [1.72, 4.47, 0],
    0.62,
    0.37,
    neckMaterials,
    5,
    1
  );
  pronghorn.add(neck);

  const throat = segment(
    [1.48, 3.42, 0],
    [1.94, 4.35, 0],
    0.3,
    0.18,
    whiteMaterials,
    4,
    0
  );
  throat.scale.z = 1.45;
  pronghorn.add(throat);

  const head = facetedMesh(
    wedgeGeometry(1.28, 0.76, 0.48, 0.67, 0.45),
    neckMaterials,
    1
  );
  head.position.set(2.13, 4.57, 0);
  head.rotation.z = -0.02;
  pronghorn.add(head);

  const cheekLeft = triangleMesh([
    [1.71, 4.52, 0.346],
    [2.31, 4.28, 0.246],
    [2.24, 4.72, 0.29]
  ], whiteMaterials[1]);
  pronghorn.add(cheekLeft);

  const cheekRight = triangleMesh([
    [1.71, 4.52, -0.346],
    [2.24, 4.72, -0.29],
    [2.31, 4.28, -0.246]
  ], whiteMaterials[2]);
  pronghorn.add(cheekRight);

  const muzzle = facetedMesh(
    wedgeGeometry(0.72, 0.49, 0.34, 0.46, 0.32),
    cocoaMaterials,
    2
  );
  muzzle.position.set(2.91, 4.48, 0);
  muzzle.rotation.z = -0.06;
  pronghorn.add(muzzle);

  const nose = facetedMesh(
    new THREE.IcosahedronGeometry(1, 0),
    [blackMaterial],
    0
  );
  nose.scale.set(0.22, 0.21, 0.25);
  nose.position.set(3.28, 4.43, 0);
  pronghorn.add(nose);

  const eyeGeometry = new THREE.SphereGeometry(0.075, 6, 4);
  for (const side of [-1, 1]) {
    const eye = new THREE.Mesh(eyeGeometry, eyeMaterial);
    eye.position.set(2.2, 4.75, side * 0.34);
    eye.scale.set(1, 1, 0.65);
    eye.castShadow = true;
    pronghorn.add(eye);

    const brow = segment(
      [1.95, 4.81, side * 0.335],
      [2.28, 4.88, side * 0.325],
      0.045,
      0.028,
      cocoaMaterials,
      3,
      side > 0 ? 1 : 2
    );
    pronghorn.add(brow);
  }

  for (const side of [-1, 1]) {
    const ear = segment(
      [1.68, 4.79, side * 0.25],
      [1.38, 5.25, side * 0.72],
      0.2,
      0.025,
      neckMaterials,
      3,
      side > 0 ? 0 : 2
    );
    pronghorn.add(ear);

    const innerEar = segment(
      [1.63, 4.84, side * 0.27],
      [1.4, 5.18, side * 0.64],
      0.09,
      0.018,
      cocoaMaterials,
      3,
      1
    );
    pronghorn.add(innerEar);
  }

  for (const side of [-1, 1]) {
    const z = side * 0.25;

    pronghorn.add(segment(
      [1.72, 4.87, z],
      [1.56, 5.48, side * 0.27],
      0.13,
      0.105,
      cocoaMaterials,
      5,
      side > 0 ? 0 : 2
    ));

    pronghorn.add(segment(
      [1.56, 5.46, side * 0.27],
      [1.36, 5.94, side * 0.22],
      0.105,
      0.018,
      cocoaMaterials,
      5,
      side > 0 ? 2 : 1
    ));

    pronghorn.add(segment(
      [1.59, 5.34, side * 0.27],
      [2.01, 5.66, side * 0.25],
      0.085,
      0.012,
      cocoaMaterials,
      4,
      side > 0 ? 1 : 3
    ));
  }

  const legSpecs = [
    { x: 1.22, z: 0.48, kneeX: 1.12, hoofX: 1.22, phase: 0 },
    { x: 1.22, z: -0.48, kneeX: 1.38, hoofX: 1.52, phase: 2 },
    { x: -1.38, z: 0.48, kneeX: -1.48, hoofX: -1.56, phase: 1 },
    { x: -1.38, z: -0.48, kneeX: -1.2, hoofX: -1.08, phase: 3 }
  ];

  for (const leg of legSpecs) {
    const hip = [leg.x, 2.55, leg.z];
    const knee = [leg.kneeX, 1.28, leg.z * 0.96];
    const ankle = [leg.hoofX, 0.31, leg.z * 0.94];

    pronghorn.add(segment(
      hip,
      knee,
      0.18,
      0.125,
      leg.x > 0 ? neckMaterials : tanMaterials,
      3,
      leg.phase
    ));

    const sockTop = [
      knee[0] + (ankle[0] - knee[0]) * 0.18,
      knee[1] + (ankle[1] - knee[1]) * 0.18,
      knee[2]
    ];

    pronghorn.add(segment(
      knee,
      sockTop,
      0.13,
      0.105,
      whiteMaterials,
      3,
      leg.phase + 1
    ));

    pronghorn.add(segment(
      sockTop,
      ankle,
      0.105,
      0.07,
      cocoaMaterials,
      3,
      leg.phase + 2
    ));

    const hoof = facetedMesh(
      wedgeGeometry(0.34, 0.17, 0.12, 0.18, 0.1),
      [hoofMaterial],
      0
    );
    hoof.position.set(leg.hoofX + 0.07, 0.2, leg.z * 0.94);
    hoof.rotation.z = -0.08;
    pronghorn.add(hoof);
  }

  const tailBase = new THREE.Vector3(-2.35, 3.28, 0);
  const tailTriangles = [
    [
      [tailBase.x, tailBase.y, 0.03],
      [-2.82, 3.62, 0.03],
      [-2.55, 3.15, 0.03]
    ],
    [
      [-2.5, 3.36, 0.05],
      [-2.98, 3.43, 0.05],
      [-2.65, 3.08, 0.05]
    ],
    [
      [-2.53, 3.31, -0.04],
      [-2.88, 3.72, -0.04],
      [-2.76, 3.17, -0.04]
    ]
  ];
  pronghorn.add(triangleMesh(tailTriangles[0], whiteMaterials[1]));
  pronghorn.add(triangleMesh(tailTriangles[1], cocoaMaterials[1]));
  pronghorn.add(triangleMesh(tailTriangles[2], whiteMaterials[2]));

  const groundMaterial = new THREE.MeshStandardMaterial({
    color: 0xbeb49d,
    roughness: 1,
    metalness: 0
  });
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(10, 64),
    groundMaterial
  );
  ground.rotation.x = -Math.PI * 0.5;
  ground.position.y = 0.1;
  ground.receiveShadow = true;
  scene.add(ground);

  const shadowPatch = new THREE.Mesh(
    new THREE.CircleGeometry(3.8, 32),
    new THREE.MeshBasicMaterial({
      color: 0x817762,
      transparent: true,
      opacity: 0.09,
      depthWrite: false
    })
  );
  shadowPatch.rotation.x = -Math.PI * 0.5;
  shadowPatch.position.set(-0.1, 0.112, 0);
  shadowPatch.scale.set(1.35, 0.75, 1);
  scene.add(shadowPatch);

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
