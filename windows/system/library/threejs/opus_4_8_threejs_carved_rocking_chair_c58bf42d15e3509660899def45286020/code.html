<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carved Walnut Rocking Chair</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#15120f;}
  canvas{display:block;}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- Renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

/* ---------- Scene & Camera ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15120f);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(1.75, 1.18, 2.15);

/* ---------- Environment (soft studio reflections for satin glow) ---------- */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------- Lighting ---------- */
const hemi = new THREE.HemisphereLight(0x9fb2c4, 0x2b241d, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff1dc, 2.4);
key.position.set(3.2, 5.0, 3.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 5;
key.shadow.bias = -0.0004;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 18;
key.shadow.camera.left = -1.8;
key.shadow.camera.right = 1.8;
key.shadow.camera.top = 1.8;
key.shadow.camera.bottom = -1.8;
scene.add(key);

const fill = new THREE.DirectionalLight(0x88a6cc, 0.55);
fill.position.set(-4.0, 2.2, 2.0);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9a8, 1.35);
rim.position.set(-2.4, 3.6, -3.8);
scene.add(rim);

/* ---------- Procedural walnut grain textures ---------- */
function grainCanvas(isBump){
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  const g = c.getContext('2d');
  g.fillStyle = isBump ? '#808080' : '#5c3a22';
  g.fillRect(0, 0, 1024, 1024);

  if(!isBump){
    const grd = g.createLinearGradient(0, 0, 1024, 0);
    grd.addColorStop(0.0, '#4c2f18');
    grd.addColorStop(0.5, '#623d24');
    grd.addColorStop(1.0, '#472b16');
    g.globalAlpha = 0.55; g.fillStyle = grd; g.fillRect(0, 0, 1024, 1024); g.globalAlpha = 1;
  }

  for(let i = 0; i < 240; i++){
    const y0 = Math.random() * 1024;
    const amp = 6 + Math.random() * 26;
    const freq = 0.5 + Math.random() * 1.8;
    const phase = Math.random() * 6.283;
    let col;
    if(isBump){
      const v = Math.random() < 0.5 ? 90 : 175;
      col = `rgba(${v},${v},${v},${0.06 + Math.random() * 0.12})`;
    } else {
      col = Math.random() < 0.5
        ? `rgba(38,22,10,${0.05 + Math.random() * 0.13})`
        : `rgba(126,86,50,${0.04 + Math.random() * 0.10})`;
    }
    g.strokeStyle = col;
    g.lineWidth = 0.6 + Math.random() * 1.9;
    g.beginPath();
    for(let x = 0; x <= 1024; x += 8){
      const y = y0 + Math.sin((x / 1024) * Math.PI * 2 * freq + phase) * amp;
      if(x === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.stroke();
  }

  for(let k = 0; k < 6; k++){
    const cx = Math.random() * 1024, cy = Math.random() * 1024;
    const rot = Math.random() * 3.14;
    for(let r = 2; r < 30; r += 2.2){
      const a = Math.max(0, (isBump ? 0.22 : 0.28) - r * 0.007);
      g.strokeStyle = isBump ? `rgba(70,70,70,${a})` : `rgba(28,16,7,${a})`;
      g.lineWidth = 1.4;
      g.beginPath();
      g.ellipse(cx, cy, r * 1.5, r, rot, 0, 6.29);
      g.stroke();
    }
  }
  return c;
}

const maxAniso = renderer.capabilities.getMaxAnisotropy();
const woodMap = new THREE.CanvasTexture(grainCanvas(false));
woodMap.wrapS = woodMap.wrapT = THREE.RepeatWrapping;
woodMap.colorSpace = THREE.SRGBColorSpace;
woodMap.repeat.set(2, 2);
woodMap.anisotropy = maxAniso;

const woodBump = new THREE.CanvasTexture(grainCanvas(true));
woodBump.wrapS = woodBump.wrapT = THREE.RepeatWrapping;
woodBump.repeat.set(2, 2);
woodBump.anisotropy = maxAniso;

/* ---------- Materials: hand-rubbed satin walnut ---------- */
const woodSmooth = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  map: woodMap,
  bumpMap: woodBump,
  bumpScale: 0.02,
  roughness: 0.52,
  metalness: 0.0,
  clearcoat: 0.32,
  clearcoatRoughness: 0.55,
  envMapIntensity: 0.75
});

const woodCarved = woodSmooth.clone();
woodCarved.flatShading = true;        // visible chisel facets
woodCarved.side = THREE.DoubleSide;
woodCarved.roughness = 0.58;

/* ---------- Helpers ---------- */
const chair = new THREE.Group();
const YUP = new THREE.Vector3(0, 1, 0);

function part(mesh){ mesh.castShadow = true; mesh.receiveShadow = true; return mesh; }

function turnedPoints(length, maxR){
  const seg = [
    [0.00,0.55],[0.03,0.92],[0.06,0.58],[0.10,0.44],[0.15,0.86],
    [0.22,0.95],[0.30,0.60],[0.44,0.50],[0.58,0.50],[0.68,0.90],
    [0.76,0.95],[0.84,0.56],[0.92,0.82],[0.97,0.56],[1.00,0.55]
  ];
  return seg.map(s => new THREE.Vector2(Math.max(0.001, maxR * s[1]), s[0] * length));
}

function latheBetween(a, b, maxR, mat){
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const geo = new THREE.LatheGeometry(turnedPoints(len, maxR), 14);
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(a);
  m.quaternion.setFromUnitVectors(YUP, dir.clone().normalize());
  return part(m);
}

function cylinderBetween(a, b, r1, r2, mat, sx = 1, sz = 1, seg = 14){
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(r1, r2, len, seg);
  geo.translate(0, len / 2, 0);
  if(sx !== 1 || sz !== 1) geo.scale(sx, 1, sz);
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(a);
  m.quaternion.setFromUnitVectors(YUP, dir.clone().normalize());
  return part(m);
}

function roundedRect(w, h, r){
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

/* ---------- Curved runners (rockers) ---------- */
const R = 1.30, TH = 0.40, HR = 0.06, WR = 0.05;
function makeRunner(){
  const shape = new THREE.Shape();
  let first = true;
  for(let a = -TH; a <= TH + 1e-6; a += 0.02){
    const z = R * Math.sin(a), y = R - R * Math.cos(a);
    if(first){ shape.moveTo(z, y); first = false; } else shape.lineTo(z, y);
  }
  for(let a = TH; a >= -TH - 1e-6; a -= 0.02){
    const z = (R - HR) * Math.sin(a), y = R - (R - HR) * Math.cos(a);
    shape.lineTo(z, y);
  }
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: WR, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.008, bevelSegments: 1, steps: 1
  });
  geo.rotateY(-Math.PI / 2);
  geo.translate(WR / 2, 0, 0);
  return geo;
}
for(const s of [-1, 1]){
  const m = new THREE.Mesh(makeRunner(), woodSmooth);
  m.position.x = s * 0.20;
  chair.add(part(m));
}

/* ---------- Legs & stretchers ---------- */
for(const s of [-1, 1]){
  chair.add(latheBetween(new THREE.Vector3(s*0.19,0.075,0.20), new THREE.Vector3(s*0.19,0.44,0.21), 0.030, woodCarved));
  chair.add(latheBetween(new THREE.Vector3(s*0.19,0.072,-0.18), new THREE.Vector3(s*0.19,0.46,-0.19), 0.030, woodCarved));
  chair.add(cylinderBetween(new THREE.Vector3(s*0.19,0.23,0.19), new THREE.Vector3(s*0.19,0.23,-0.17), 0.014,0.014, woodCarved));
}
chair.add(cylinderBetween(new THREE.Vector3(-0.19,0.19,0.20), new THREE.Vector3(0.19,0.19,0.20), 0.015,0.015, woodCarved));
chair.add(cylinderBetween(new THREE.Vector3(-0.19,0.17,-0.18), new THREE.Vector3(0.19,0.17,-0.18), 0.015,0.015, woodCarved));

/* ---------- Seat ---------- */
(() => {
  const geo = new THREE.ExtrudeGeometry(roundedRect(0.48, 0.46, 0.05), {
    depth: 0.04, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.01, bevelSegments: 2, steps: 1
  });
  geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, woodSmooth);
  m.position.y = 0.40;
  chair.add(part(m));
})();

/* ---------- Spindled back (leaning group) ---------- */
const LEAN = -0.16;
const BACK_POS = new THREE.Vector3(0, 0.45, -0.20);
function backL2W(x, y, z){
  const c = Math.cos(LEAN), s = Math.sin(LEAN);
  return new THREE.Vector3(x + BACK_POS.x, y*c - z*s + BACK_POS.y, y*s + z*c + BACK_POS.z);
}
const backGroup = new THREE.Group();
backGroup.position.copy(BACK_POS);
backGroup.rotation.x = LEAN;

for(const s of [-1, 1]){
  backGroup.add(latheBetween(new THREE.Vector3(s*0.19,0,0), new THREE.Vector3(s*0.19,0.62,0), 0.024, woodCarved));
  const fin = new THREE.Mesh(new THREE.SphereGeometry(0.032, 16, 12), woodCarved);
  fin.position.set(s*0.19, 0.635, 0);
  backGroup.add(part(fin));
}
backGroup.add(cylinderBetween(new THREE.Vector3(-0.19,0.11,0), new THREE.Vector3(0.19,0.11,0), 0.02,0.02, woodCarved));
for(const x of [-0.15,-0.09,-0.03,0.03,0.09,0.15]){
  backGroup.add(latheBetween(new THREE.Vector3(x,0.13,0), new THREE.Vector3(x,0.47,0), 0.015, woodCarved));
}

/* Crest rail (arched) */
(() => {
  const cs = new THREE.Shape();
  cs.moveTo(-0.21, 0);
  cs.lineTo(0.21, 0);
  cs.lineTo(0.21, 0.11);
  cs.quadraticCurveTo(0.0, 0.34, -0.21, 0.11);
  cs.lineTo(-0.21, 0);
  const geo = new THREE.ExtrudeGeometry(cs, {
    depth: 0.05, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.008, bevelSegments: 1, steps: 1
  });
  geo.translate(0, 0, -0.025);
  const m = new THREE.Mesh(geo, woodSmooth);
  m.position.set(0, 0.44, 0);
  backGroup.add(part(m));
})();

/* Ornate relief-carved leaf motifs on the crest */
function makeLeaf(scale){
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.bezierCurveTo(0.035, 0.02, 0.040, 0.075, 0.012, 0.112);
  s.bezierCurveTo(0.007, 0.126, 0.003, 0.132, 0, 0.14);
  s.bezierCurveTo(-0.003, 0.132, -0.007, 0.126, -0.012, 0.112);
  s.bezierCurveTo(-0.040, 0.075, -0.035, 0.02, 0, 0);
  const geo = new THREE.ExtrudeGeometry(s, {
    depth: 0.014, bevelEnabled: true, bevelThickness: 0.004, bevelSize: 0.004, bevelSegments: 1, steps: 1
  });
  geo.scale(scale, scale, 1);
  return geo;
}
const zFace = 0.026;
const leaves = [
  [0.0, 0.505, 1.15, 0.0],
  [0.085, 0.492, 0.9, 0.5], [-0.085, 0.492, 0.9, -0.5],
  [0.155, 0.478, 0.7, 0.95], [-0.155, 0.478, 0.7, -0.95],
  [0.0, 0.60, 0.6, 0.0]
];
for(const [x, y, sc, rot] of leaves){
  const m = new THREE.Mesh(makeLeaf(sc), woodCarved);
  m.position.set(x, y, zFace);
  m.rotation.z = rot;
  backGroup.add(part(m));
}
for(const bx of [-0.04, 0, 0.04]){
  const berry = new THREE.Mesh(new THREE.SphereGeometry(0.014, 12, 10), woodCarved);
  berry.position.set(bx, 0.575, zFace + 0.006);
  backGroup.add(part(berry));
}

chair.add(backGroup);

/* ---------- Scrolled armrests ---------- */
function makeScroll(center){
  const pts = [];
  const R0 = 0.07;
  for(let i = 0; i <= 48; i++){
    const t = i / 48;
    const ang = t * 2.3 * Math.PI;
    const r = R0 * (1 - 0.68 * t);
    pts.push(new THREE.Vector3(
      center.x,
      center.y - R0 + Math.cos(ang) * r,
      center.z + Math.sin(ang) * r
    ));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const geo = new THREE.TubeGeometry(curve, 64, 0.024, 12, false);
  return part(new THREE.Mesh(geo, woodCarved));
}
for(const s of [-1, 1]){
  const armBack = backL2W(s * 0.19, 0.30, 0);
  const armFront = new THREE.Vector3(s * 0.205, 0.685, 0.235);
  chair.add(cylinderBetween(armBack, armFront, 0.028, 0.028, woodSmooth, 1.6, 0.7, 16));
  chair.add(latheBetween(new THREE.Vector3(s*0.205,0.45,0.19), new THREE.Vector3(s*0.205,0.665,0.215), 0.02, woodCarved));
  chair.add(makeScroll(armFront));
}

/* ---------- Center & add ---------- */
chair.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(chair);
const center = box.getCenter(new THREE.Vector3());
chair.position.x -= center.x;
chair.position.z -= center.z;
scene.add(chair);

/* ---------- Shadow-only ground ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- Controls ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.target.set(0, 0.55, 0);
controls.minDistance = 1.3;
controls.maxDistance = 6.0;
controls.maxPolarAngle = Math.PI * 0.52;
controls.update();

/* ---------- Resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

/* ---------- Render loop ---------- */
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
