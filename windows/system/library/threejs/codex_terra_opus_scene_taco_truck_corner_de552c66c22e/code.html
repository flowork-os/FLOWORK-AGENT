import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf2a171, 28, 76);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const clock = new THREE.Clock();
const mixers = [];
const swayers = [];
const flutterers = [];
let seed = 738291;
const rand = () => {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
};
const range = (a,b) => a + (b-a)*rand();

const C = {
  cream:0xfff0c7, yellow:0xffbf38, orange:0xf57532, red:0xd94238,
  teal:0x087d87, darkTeal:0x05545c, blue:0x1876a2, navy:0x17344d,
  mint:0x58b79a, lime:0x9bca37, green:0x3c914b, brown:0x7e482f,
  wood:0xb76e3e, darkWood:0x65402b, charcoal:0x21333c, asphalt:0x42464c,
  concrete:0x8b8982, pink:0xf16a72, purple:0x7b4e93, white:0xfff7df
};

function mat(color, rough=.7, metal=0) {
  return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
}
const M = {};
for (const [k,v] of Object.entries(C)) M[k] = mat(v);
M.glass = new THREE.MeshStandardMaterial({color:0x8fd8dd,roughness:.14,metalness:.08,transparent:true,opacity:.55});
M.black = mat(0x172126,.45,.4);
M.light = new THREE.MeshStandardMaterial({color:C.yellow,emissive:0xff8b29,emissiveIntensity:1.1,roughness:.45});
M.chalk = new THREE.MeshStandardMaterial({color:0x1c3434,roughness:.95});
M.tire = new THREE.MeshStandardMaterial({color:0x17191b,roughness:.85});
M.chrome = new THREE.MeshStandardMaterial({color:0xaeb8b6,roughness:.18,metalness:.9});

function group(parent=scene) {
  const g = new THREE.Group();
  parent.add(g);
  return g;
}
function box(parent, x,y,z, material, px=0,py=0,pz=0, bevel=0) {
  const geo = bevel ? new THREE.BoxGeometry(x,y,z,2,2,2) : new THREE.BoxGeometry(x,y,z);
  const mesh = new THREE.Mesh(geo,material);
  mesh.position.set(px,py,pz);
  mesh.castShadow = mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function cyl(parent, rt,rb,h,material,px=0,py=0,pz=0,segments=16) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,segments),material);
  mesh.position.set(px,py,pz);
  mesh.castShadow = mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function sphere(parent,r,material,px=0,py=0,pz=0) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r,18,12),material);
  mesh.position.set(px,py,pz);
  mesh.castShadow = mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function plane(parent,w,h,material,px=0,py=0,pz=0,rx=-Math.PI/2) {
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w,h),material);
  mesh.position.set(px,py,pz);
  mesh.rotation.x = rx;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function roundedRectShape(w,h,r) {
  const s = new THREE.Shape(), x=-w/2, y=-h/2;
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y);
  return s;
}
function signTexture(lines, bg="#173b40", fg="#fff0c7") {
  const c = document.createElement("canvas");
  c.width=512; c.height=320;
  const x=c.getContext("2d");
  x.fillStyle=bg; x.fillRect(0,0,c.width,c.height);
  x.strokeStyle="#d3c791"; x.lineWidth=9; x.strokeRect(15,15,482,290);
  x.fillStyle=fg; x.textAlign="center";
  x.font="bold 50px sans-serif"; x.fillText(lines[0],256,74);
  x.font="bold 28px sans-serif";
  lines.slice(1).forEach((s,i)=>x.fillText(s,256,126+i*46));
  const t = new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  return new THREE.MeshStandardMaterial({map:t,roughness:.82});
}
function stripeTexture() {
  const c=document.createElement("canvas"); c.width=c.height=256;
  const x=c.getContext("2d");
  x.fillStyle="#ffc241"; x.fillRect(0,0,256,256);
  x.strokeStyle="#d94a3c"; x.lineWidth=36;
  for(let i=-256;i<512;i+=92){x.beginPath();x.moveTo(i,0);x.lineTo(i+256,256);x.stroke()}
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(1,1);
  t.colorSpace=THREE.SRGBColorSpace;
  return new THREE.MeshStandardMaterial({map:t,roughness:.72});
}
function makeText(text, color="#fff4ce", bg="rgba(0,0,0,0)") {
  const c=document.createElement("canvas"); c.width=1024;c.height=256;
  const x=c.getContext("2d"); x.fillStyle=bg;x.fillRect(0,0,1024,256);
  x.fillStyle=color;x.textAlign="center";x.textBaseline="middle";
  x.font="900 155px sans-serif";x.fillText(text,512,136);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  return new THREE.MeshBasicMaterial({map:t,transparent:true,side:THREE.DoubleSide});
}

const curb = box(world,26,.34,.46,M.cream,-2,.22,.64);
for(let i=0;i<7;i++) box(world,2.15,.035,.16,M.concrete,-12+i*3.65,.27,.28);

const roadLine = mat(0xf0c861);
for(let x=-23;x<23;x+=5) box(world,2.6,.012,.22,roadLine,x,.015,-4.5);
for(let i=0;i<18;i++) {

function building(x,z,w,h,color) {
  const b=group(world);

function makeTruck() {
  const t=group(world);
  t.position.set(-.7,.27,4.4);
  const body=box(t,9.2,4.25,4.15,M.teal,0,2.15,0);
  const roof=box(t,9.55,.3,4.4,M.cream,0,4.4,0);
  const cab=box(t,2.35,3.25,4.12,M.blue,3.48,1.73,0);
  const windshield=box(t,.035,1.42,2.72,M.glass,4.67,2.6,0);
  const hood=box(t,.84,.5,4.08,M.blue,4.57,.68,0);
  box(t,5.8,.56,4.2,M.yellow,-1.2,.58,0);
  box(t,5.9,.22,4.28,M.red,-1.18,1.12,0);
  box(t,2.12,.12,4.27,M.cream,3.48,3.42,0);

  const serveFrame=box(t,4.7,2.1,.18,M.cream,-1.25,2.74,-2.1);
  const voidPanel=box(t,4.34,1.72,.04,M.charcoal,-1.25,2.74,-2.22);
  const hatch=box(t,4.82,.16,2.0,M.yellow,-1.25,4.22,-1.22);
  hatch.rotation.x=-.62;
  const hatchStripe=box(t,4.84,.025,.37,M.red,-1.25,4.1,-.64);
  hatchStripe.rotation.x=-.62;
  const counter=box(t,5.4,.22,1.08,M.wood,-1.25,1.82,-2.62);
  counter.rotation.x=.02;

  for(const x of [-3.55,-1.25,1.05]) {
    const wheel=group(t);
    cyl(wheel,.64,.64,.42,M.tire,x,.65,-2.13,20);
    wheel.rotation.x=Math.PI/2;
    const hub=cyl(wheel,.24,.24,.45,M.chrome,0,0,0,16);
    hub.rotation.x=Math.PI/2;
  }
  for(const x of [-3.55,-1.25,1.05]) {
    const wheel=group(t);
    cyl(wheel,.64,.64,.42,M.tire,x,.65,2.13,20);
    wheel.rotation.x=Math.PI/2;
    const hub=cyl(wheel,.24,.24,.45,M.chrome,0,0,0,16);
    hub.rotation.x=Math.PI/2;
  }

  const logo=new THREE.Mesh(new THREE.PlaneGeometry(4.3,1.05),makeText("TACO  SOL", "#fff6cd"));
  logo.position.set(-1.2,3.72,-2.215);
  t.add(logo);

  const taco=group(t);
  taco.position.set(-3.85,3.75,-2.3);
  const shell=new THREE.Mesh(new THREE.TorusGeometry(.38,.115,8,20,Math.PI),M.yellow);
  shell.rotation.z=Math.PI;
  taco.add(shell);
  sphere(taco,.13,M.green,-.16,-.02,.02);
  sphere(taco,.12,M.red,.08,.03,.02);
  taco.rotation.z=.13;

  for(let i=0;i<4;i++) {
    const can=cyl(t,.12,.12,.38,M.light,-2.95+i*.55,2.12,-2.73,14);
    can.rotation.x=Math.PI/2;
  }
  return t;
}
const truck=makeTruck();

function stool(x,z) {

function palm() {
  const p=group(world);
  p.position.set(9.8,.1,-1.8);
  for(let i=0;i<8;i++) {
    const seg=cyl(p,.23-i*.012,.28-i*.012,.88,M.darkWood,Math.sin(i*.23)*.16,1+i*.72,0,12);
    seg.rotation.z=-.13;
  }
  const crown=group(p);
  crown.position.set(1.25,6.8,0);
  for(let i=0;i<9;i++) {
    const leaf=group(crown);
    leaf.rotation.y=i*Math.PI*2/9;
    leaf.rotation.z=.18+rand()*.2;
    const blade=new THREE.Mesh(new THREE.ConeGeometry(.35,3.35,5,1,true),M.green);
    blade.rotation.z=Math.PI/2;
    blade.position.x=1.45;
    blade.scale.y=.45;
    blade.castShadow=true;
    leaf.add(blade);
    swayers.push({object:leaf, base:leaf.rotation.z, phase:i*.8});
  }
  return p;
}
palm();

function makeBunting() {
  const b=group(world);
  const a=new THREE.Vector3(-8.55,7.12,1.1);
  const c=new THREE.Vector3(-1.2,5.45,-1.7);
  const d=new THREE.Vector3(6.3,5.65,1.8);
  const points=[a,c,d];
  for(let segment=0;segment<2;segment++) {
    const p1=points[segment],p2=points[segment+1];
    const count=12;
    for(let i=0;i<=count;i++) {
      const q=i/count;
      const pos=new THREE.Vector3().lerpVectors(p1,p2,q);
      pos.y-=Math.sin(q*Math.PI)*.42;
      sphere(b,.027,M.darkWood,pos.x,pos.y,pos.z);
    }
    for(let i=1;i<count;i++) {
      const q=(i+.5)/count;
      const pos=new THREE.Vector3().lerpVectors(p1,p2,q);
      pos.y-=Math.sin(q*Math.PI)*.42;
      const colors=[M.pink,M.yellow,M.teal,M.cream,M.purple];
      const sh=new THREE.Shape();
      sh.moveTo(-.24,0);sh.lineTo(.24,0);sh.lineTo(.18,-.42);sh.lineTo(0,-.52);sh.lineTo(-.18,-.42);sh.closePath();
      const flag=new THREE.Mesh(new THREE.ShapeGeometry(sh),colors[i%colors.length]);
      flag.position.copy(pos);
      flag.rotation.y=.08;
      flag.castShadow=true;
      b.add(flag);
      flutterers.push({object:flag,phase:i*.72+segment*2,base:pos.y});
    }
  }
}
makeBunting();

}

function animate() {
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();

  mixers.forEach((bulb,i)=>{
    const pulse=.78+Math.sin(t*2.2+i*.82)*.22;
    bulb.material.emissiveIntensity=pulse*1.45;
    bulb.scale.setScalar(.92+pulse*.1);
  });

  flutterers.forEach(f=>{
    f.object.position.y=f.base+Math.sin(t*2.15+f.phase)*.08;
    f.object.rotation.y=.12+Math.sin(t*2.15+f.phase)*.22;
    f.object.rotation.z=Math.sin(t*1.6+f.phase)*.075;
  });

  swayers.forEach(s=>{
    s.object.rotation.z=s.base+Math.sin(t*.72+s.phase)*.075;
  });

  ambientDust.forEach(d=>{
    d.object.position.x+=Math.sin(t*d.speed+d.phase)*.002;
    d.object.position.y+=Math.cos(t*d.speed*.7+d.phase)*.0012;
  });

  truck.position.y=.27+Math.sin(t*.9)*.012;
  lampPost.rotation.z=Math.sin(t*.38)*.003;
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
