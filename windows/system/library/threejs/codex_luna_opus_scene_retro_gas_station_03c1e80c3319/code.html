<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desert Retro Gas Station</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#19131a}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd7815e, 42, 145);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(43, innerWidth/innerHeight, .1, 260);
camera.position.set(23,14,27);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .045;
controls.autoRotate = true;
controls.autoRotateSpeed = .38;
controls.target.set(0,4,0);
controls.minDistance = 13;
controls.maxDistance = 62;
controls.maxPolarAngle = Math.PI*.48;

const clock = new THREE.Clock();
const rng = (()=>{let s=19840717;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}})();

const C = {
  asphalt:0x75615a, concrete:0xa28b7d, crack:0x4b3c38,
  cream:0xf3d6a0, fadedCream:0xcaa97b, red:0xa93d31,
  darkRed:0x672b2c, teal:0x236e70, aqua:0x62a9a0,
  mustard:0xd28a39, chrome:0xb7b6ab, black:0x181719,
  rubber:0x201d1d, glass:0x183e42, wood:0x674536,
  sand:0xc38a62, dune:0xd99b68, cactus:0x4e7761
};

function mat(color, rough=.72, metal=0, emissive=0, intensity=0){
  return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,
    emissive,emissiveIntensity:intensity});
}
function box(w,h,d,material,x=0,y=0,z=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; return m;
}
function cyl(r,h,material,x=0,y=0,z=0,radial=16){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,radial),material);
  m.position.set(x,y,z); m.castShadow=true; m.receiveShadow=true; return m;
}
function sphere(r,material,x=0,y=0,z=0,scale=1){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,12),material);
  m.position.set(x,y,z); m.scale.set(scale,scale,scale); m.castShadow=true; m.receiveShadow=true; return m;
}
function roundedBox(w,h,d,material,r=.18){
  const shape=new THREE.Shape();
  shape.moveTo(-w/2+r,-h/2);shape.lineTo(w/2-r,-h/2);
  shape.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);
  shape.lineTo(w/2,h/2-r);shape.quadraticCurveTo(w/2,h/2,w/2-r,h/2);
  shape.lineTo(-w/2+r,h/2);shape.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);
  shape.lineTo(-w/2,-h/2+r);shape.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);
  const g=new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:true,bevelSize:.035,bevelThickness:.035,bevelSegments:2});
  g.center();
  const m=new THREE.Mesh(g,material);m.castShadow=true;m.receiveShadow=true;return m;
}
function label(text,w,h,color,bg,font='bold 34px Arial'){
  const c=document.createElement('canvas');c.width=512;c.height=256;
  const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,512,256);
  x.fillStyle=color;x.font=font;x.textAlign='center';x.textBaseline='middle';
  x.fillText(text,256,130);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  return new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent:true}));
}
function line(points,color,width=.035){
  const g=new THREE.BufferGeometry().setFromPoints(points);
  const m=new THREE.Line(g,new THREE.LineBasicMaterial({color,linewidth:width}));
  return m;
}

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(180,32,16),
  new THREE.MeshBasicMaterial({color:0xc66c58,side:THREE.BackSide})
);
scene.add(sky);

const hemi=new THREE.HemisphereLight(0xffc38e,0x392e35,2.1);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffa067,4.5);
sun.position.set(-32,34,18);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-55;sun.shadow.camera.right=55;
sun.shadow.camera.top=48;sun.shadow.camera.bottom=-34;
sun.shadow.bias=-.0005;
scene.add(sun);
const sunsetDisc=sphere(7,mat(0xffc06c,1,0,0xffa13f,.4),-38,25,-70);
sunsetDisc.castShadow=false;

function makeCrackedTexture(){
  const c=document.createElement('canvas');c.width=1024;c.height=1024;
  const x=c.getContext('2d');x.fillStyle='#988477';x.fillRect(0,0,1024,1024);
  for(let i=0;i<900;i++){
    const v=115+Math.floor(rng()*35);x.fillStyle=`rgb(${v+8},${v},${v-4})`;
    x.fillRect(rng()*1024,rng()*1024,1+rng()*5,1+rng()*3);
  }
  x.strokeStyle='rgba(53,42,40,.72)';x.lineWidth=3;
  for(let i=0;i<45;i++){
    let px=rng()*1024,py=rng()*1024;x.beginPath();x.moveTo(px,py);
    for(let j=0;j<4+rng()*5;j++){px+=(rng()-.5)*115;py+=(rng()-.5)*115;x.lineTo(px,py)}
    x.stroke();
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(5,5);
  t.colorSpace=THREE.SRGBColorSpace;return t;
}
const concreteMat=new THREE.MeshStandardMaterial({map:makeCrackedTexture(),roughness:.96});
const ground=box(130,.35,105,concreteMat,0,-.2,0);ground.receiveShadow=true;

const horizonMat=mat(0xaa6957);
const duneMat=mat(C.dune);
for(let i=0;i<14;i++){
  const d=sphere(10+rng()*12,duneMat,-57+i*9,3+rng()*2,-33-rng()*5,1);
  d.scale.set(2.5+rng()*2,.34+rng()*.35,1);
  d.castShadow=false;
}
for(let i=0;i<11;i++){
  const d=sphere(10,duneMat,-55+i*11,2+rng()*2,35+rng()*4);
  d.scale.set(2.5+rng()*2,.3+rng()*.3,1);
  d.castShadow=false;
}
const road=box(130,.08,10,mat(0x3e3a3a),0,.02,17);
road.receiveShadow=true;

function addCactus(x,z,s=1){
  const group=new THREE.Group();group.position.set(x,0,z);
  const cm=mat(C.cactus,.9);
  const trunk=cyl(.38*s,3.1*s,cm,0,1.55*s,0,10);group.add(trunk);
  trunk.rotation.z=(rng()-.5)*.08;
  const side=rng()>.5?1:-1;
  const arm=cyl(.25*s,1.3*s,cm,side*.62*s,1.9*s,0,9);arm.rotation.z=side*Math.PI/2;group.add(arm);
  const elbow=cyl(.25*s,.9*s,cm,side*1.02*s,2.47*s,0,9);group.add(elbow);
  if(rng()>.4){const a=cyl(.22*s,1*s,cm,-side*.52*s,1.25*s,0,9);a.rotation.z=-side*Math.PI/2;group.add(a)}
  group.traverse(o=>{o.castShadow=true;o.receiveShadow=true});
  scene.add(group);return group;
}
addCactus(-22,-13,1.25);addCactus(31,-21,.85);addCactus(34,8,1.35);addCactus(-38,21,.75);
for(let i=0;i<18;i++){
  const x=-49+rng()*96,z=-29+rng()*59;
  if(Math.abs(x)<23&&Math.abs(z)<14)continue;
  const rock=sphere(.25+rng()*.6,mat(0x8c6556),x,.18,z);
  rock.scale.y=.45;rock.rotation.y=rng()*6;
}

const station=new THREE.Group();station.position.set(0,0,-5);scene.add(station);

const office=box(13,5.4,7.3,mat(C.cream),0,3,-1);
station.add(office);
const trim=mat(C.red);
station.add(box(13.35,.24,7.6,trim,0,5.68,-1));
station.add(box(13.35,.18,7.6,trim,0,.2,-1));
const sideBand=box(13.15,1.05,7.42,mat(C.teal),0,4.5,-1);station.add(sideBand);
station.add(box(13.2,.12,7.5,mat(C.cream),0,3.94,-1));

const sign=label('SUNSET  66',8.1,1.25,'#fff0c2','#a63b32','bold 42px Arial');
sign.position.set(0,5.08,2.75);sign.rotation.y=Math.PI;station.add(sign);
const signFrame=box(8.6,1.55,.18,trim,0,5.1,2.84);station.add(signFrame);station.add(sign);

function windowPanel(x,y,z,w,h,rot=0){
  const frame=box(w+.28,h+.28,.18,mat(C.red),x,y,z);frame.rotation.y=rot;station.add(frame);
  const glass=box(w,h,.2,mat(C.glass,.2,0),x,y,z-.05);glass.rotation.y=rot;station.add(glass);
  for(let i=-1;i<=1;i+=2){const mull=box(.09,h,.24,mat(C.cream),x+i*w*.25,y,z-.17);mull.rotation.y=rot;station.add(mull)}
}
windowPanel(-3.8,3.05,2.78,2.1,1.65);
windowPanel(0,3.05,2.78,2.1,1.65);
windowPanel(3.8,3.05,2.78,2.1,1.65);

const garage=box(4.5,4.1,.22,mat(0x463b39),0,2.42,-4.7);station.add(garage);
for(let i=-2;i<=2;i++){const slat=box(.1,3.75,.28,mat(0x8a6960),i*.75,2.4,-4.84);station.add(slat)}
station.add(box(4.8,.2,.3,trim,0,4.55,-4.8));
const garageLamp=new THREE.PointLight(0xffb56a,1.8,10);garageLamp.position.set(0,3.5,-5.6);station.add(garageLamp);
const lampGlow=sphere(.19,mat(0xffd39a,.2,0,0xffad58,4),0,3.5,-5.65);station.add(lampGlow);

const canopy=new THREE.Group();canopy.position.set(0,0,5.6);station.add(canopy);
canopy.add(box(17,.42,8.1,mat(C.cream),0,7.15,0));
canopy.add(box(17.25,.28,8.35,trim,0,6.92,0));
canopy.add(box(16.8,.55,.3,mat(C.teal),0,6.68,-3.91));
canopy.add(box(16.8,.55,.3,mat(C.teal),0,6.68,3.91));
for(const x of [-7.3,7.3]){
  canopy.add(cyl(.28,6.7,trim,x,3.35,0,12));
  canopy.add(cyl(.39,.16,mat(C.cream),x,.1,0,12));
}
const wing=new THREE.Group();wing.position.set(0,7.2,0);canopy.add(wing);
wing.add(box(6.7,.12,.18,mat(C.red),0,.05,0));
wing.add(box(.18,.12,3.9,mat(C.red),0,.05,0));
for(const side of [-1,1]){
  const feather=box(3,.1,.16,mat(C.red),side*2,.05,0);
  feather.rotation.z=side*.19;wing.add(feather);
  const feather2=box(2.4,.1,.14,mat(C.red),side*2.2,.05,.65);
  feather2.rotation.z=side*.28;wing.add(feather2);
}
const wingLamp=new THREE.PointLight(0xffb16d,1.2,15);wingLamp.position.set(0,6.4,0);canopy.add(wingLamp);

function pump(x){
  const g=new THREE.Group();g.position.set(x,0,5.1);station.add(g);
  const body=roundedBox(1.25,2.7,.72,mat(C.red),.16);body.position.y=1.55;g.add(body);
  const cap=roundedBox(1.36,.23,.8,mat(C.cream),.08);cap.position.y=2.95;g.add(cap);
  const face=roundedBox(.86,1.02,.04,mat(0xeee4c7),.04);face.position.set(0,2.13,.39);g.add(face);
  const display=box(.58,.3,.035,mat(0x353638,.28,0,0x241c1c,.3),0,2.39,.43);g.add(display);
  const nozzle=cyl(.11,.48,mat(C.black),-.38,1.48,.46,10);nozzle.rotation.z=Math.PI/2;g.add(nozzle);
  const hose=new THREE.Mesh(new THREE.TorusGeometry(.42,.035,7,20,Math.PI*1.65),new THREE.MeshStandardMaterial({color:C.black,roughness:.6}));
  hose.position.set(.28,1.1,.42);hose.rotation.z=-.2;g.add(hose);
  const base=box(1.5,.15,.9,mat(C.teal),0,.18,0);g.add(base);
  return g;
}
pump(-2.55);pump(2.55);

function tire(x,z,scale=1){
  const t=new THREE.Mesh(new THREE.TorusGeometry(.64*scale,.22*scale,12,22),mat(C.rubber,.95));
  t.position.set(x,.72*scale,z);t.rotation.x=Math.PI/2;t.castShadow=true;t.receiveShadow=true;scene.add(t);return t;
}
tire(10,1.8,1);tire(10,1.8,.84).position.y=1.86;tire(10,1.8,.68).position.y=2.78;

function pickup(){
  const g=new THREE.Group();g.position.set(10,0,7);g.rotation.y=-.14;scene.add(g);
  const bodyMat=mat(0x4d7070,.62);
  g.add(box(5.5,1.1,2.35,bodyMat,0,1.25,0));
  g.add(box(3.1,1.35,2.25,bodyMat,-.85,2.25,0));
  const hood=box(1.65,.55,2.18,bodyMat,1.65,2.08,0);g.add(hood);
  const cab=box(2.25,1.55,2.16,bodyMat,-1.1,2.72,0);g.add(cab);
  const roof=box(2.35,.15,2.28,mat(C.cream),-1.1,3.52,0);g.add(roof);
  const windshield=box(.08,.82,1.82,mat(C.glass,.18),.02,2.85,0);windshield.rotation.z=-.25;g.add(windshield);
  for(const z of [-1.19,1.19]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.68,.68,.34,20),mat(C.rubber,.9));wheel.rotation.x=Math.PI/2;wheel.position.set(-1.45, .75,z);wheel.castShadow=true;g.add(wheel);const hub=cyl(.25,.37,mat(C.chrome,.25,1),-1.45,.75,z,16);hub.rotation.x=Math.PI/2;g.add(hub)}
  g.add(box(2.7,.12,2.55,mat(C.red),-.95,1.76,0));
  g.add(box(.65,.17,2.45,mat(C.chrome,.3,1),1.25,1.7,0));
  const head=mat(0xffd29a,.25,0,0xffb765,1.5);
  for(const z of [-.72,.72])g.add(cyl(.2,.06,head,2.53,1.62,z,16));
  const bumper=box(.22,.24,2.7,mat(C.chrome,.2,1),2.8,1.1,0);g.add(bumper);
  return g;
}
pickup();

function vending(){
  const g=new THREE.Group();g.position.set(-9,0,1.2);scene.add(g);
  g.add(roundedBox(1.5,3.2,.85,mat(C.teal),.1));
  const panel=box(1.12,1.55,.04,mat(0x183638,.2),0,1.88,.45);g.add(panel);
  const logo=label('SODA',1.08,.32,'#fff1c5','#b53d31','bold 35px Arial');logo.position.set(0,2.9,.49);g.add(logo);
  for(let i=0;i<3;i++){const can=cyl(.15,.44,[mat(C.red),mat(C.mustard),mat(C.aqua)][i],-.35+i*.35,1.7,.51,12);can.rotation.z=Math.PI/2;g.add(can)}
  const glow=new THREE.PointLight(0x68e2d4,.5,5);glow.position.set(0,2,.7);g.add(glow);
  return g;
}
vending();

const pole=new THREE.Group();pole.position.set(-13,0,-8);scene.add(pole);
pole.add(cyl(.16,9.4,mat(C.chrome,.28,1),0,4.7,0,12));
pole.add(cyl(.42,.18,mat(C.concrete),0,.1,0,12));
const signBoard=new THREE.Group();signBoard.position.set(0,9.15,0);pole.add(signBoard);
signBoard.add(box(3.7,1.5,.25,mat(C.red),0,0,0));
signBoard.add(box(3.25,1.05,.29,mat(C.cream),0,0,.02));
const signText=label('SUNSET',2.8,.62,'#a53832','#f1d09b','bold 42px Arial');signText.position.set(0,0,.2);signBoard.add(signText);
signBoard.add(cyl(.18,.36,mat(C.chrome,.25,1),0,-.9,0,12));
const signLight=new THREE.PointLight(0xffbf72,1.3,9);signLight.position.set(0,8.7,2);pole.add(signLight);

function tumbleweed(x,z){
  const g=new THREE.Group();g.position.set(x,.48,z);
  const tw=mat(0x765746,.95);
  for(let i=0;i<12;i++){
    const a=rng()*Math.PI*2, b=rng()*Math.PI*2;
    const p=new THREE.Vector3(Math.cos(a)*.65,Math.sin(a)*.45,Math.sin(b)*.58);
    const l=line([new THREE.Vector3(-p.x,-p.y,-p.z),p],0x765746,.04);g.add(l);
  }
  scene.add(g);return g;
}
const tumble=tumbleweed(-15,8);

for(let i=0;i<22;i++){
  const x=-48+rng()*96,z=-28+rng()*52;
  if(Math.abs(x)<17&&z>-7&&z<15)continue;
  const bush=sphere(.25+rng()*.45,mat(0x5d604a),x,.3,z);
  bush.scale.set(1.8,.45,1.1);bush.castShadow=true;
}
for(let i=0;i<9;i++){
  const x=-40+rng()*78,z=-27+rng()*20;
  const post=cyl(.12,.8,mat(0x5b4038),x,.4,z,7);
  post.rotation.z=(rng()-.5)*.4;
}

const moonlessClouds=new THREE.Group();scene.add(moonlessClouds);
for(let i=0;i<7;i++){
  const cl=new THREE.Group();cl.position.set(-35+i*12,21+rng()*4,-45);
  for(let j=0;j<4;j++)cl.add(sphere(2+rng()*2,mat(0x9b5b59),j*2.5,0,rng()*1.5,1));
  cl.scale.y=.32;cl.traverse(o=>o.castShadow=false);moonlessClouds.add(cl);
}

const animateItems={};
animateItems.sign=signBoard;
animateItems.tumble=tumble;
animateItems.wing=wing;
const flicker=garageLamp;

function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  animateItems.sign.rotation.y=Math.sin(t*.5)*.22;
  animateItems.tumble.rotation.y=t*.45;
  animateItems.tumble.position.x=-15+Math.sin(t*.16)*.7;
  animateItems.wing.rotation.z=Math.sin(t*.7)*.018;
  flicker.intensity=1.55+Math.sin(t*8)*.18+Math.sin(t*13)*.08;
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
