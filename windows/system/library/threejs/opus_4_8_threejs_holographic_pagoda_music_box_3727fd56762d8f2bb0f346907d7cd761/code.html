<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Holographic Music Box</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0b10; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: 12px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: rgba(220,230,255,0.42); letter-spacing: 0.12em; text-transform: uppercase;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="hint">Holographic Music Box &middot; drag to orbit &middot; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0b10);
scene.fog = new THREE.FogExp2(0x0a0b10, 0.035);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.02, 100);
camera.position.set(0.34, 0.30, 0.46);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.minDistance = 0.22;
controls.maxDistance = 1.6;
controls.target.set(0, 0.085, 0);
controls.maxPolarAngle = Math.PI * 0.495;

/* ============================================================
   ENVIRONMENT MAP (procedural, for iridescent reflections)
   ============================================================ */
function makeEnvTexture() {
  const size = 512;
  const c = document.createElement('canvas');
  c.width = size; c.height = size / 2;
  const ctx = c.getContext('2d');

  // dark studio gradient
  const g = ctx.createLinearGradient(0, 0, 0, c.height);
  g.addColorStop(0.00, '#12141d');
  g.addColorStop(0.42, '#1b1f2c');
  g.addColorStop(0.55, '#0d0f16');
  g.addColorStop(1.00, '#05060a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, c.width, c.height);

  // colored studio "strip lights" -> gives the shell prismatic highlights
  const lights = [
    { x: 0.13, y: 0.24, w: 0.16, h: 0.16, col: 'rgba(90,255,235,1)' },
    { x: 0.40, y: 0.16, w: 0.13, h: 0.20, col: 'rgba(180,120,255,1)' },
    { x: 0.66, y: 0.28, w: 0.15, h: 0.14, col: 'rgba(255,205,120,1)' },
    { x: 0.88, y: 0.20, w: 0.12, h: 0.18, col: 'rgba(255,120,190,1)' },
    { x: 0.26, y: 0.62, w: 0.22, h: 0.10, col: 'rgba(70,150,255,0.8)' },
    { x: 0.76, y: 0.66, w: 0.20, h: 0.10, col: 'rgba(120,255,190,0.7)' }
  ];
  ctx.globalCompositeOperation = 'lighter';
  for (const L of lights) {
    const cx = L.x * c.width, cy = L.y * c.height;
    const rx = L.w * c.width, ry = L.h * c.height;
    const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
    rg.addColorStop(0.0, L.col);
    rg.addColorStop(0.35, L.col.replace(/,\s*[\d.]+\)$/, ',0.35)'));
    rg.addColorStop(1.0, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, ry / Math.max(rx, ry));
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(0, 0, Math.max(rx, ry), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  // bright overhead band
  const band = ctx.createLinearGradient(0, 0, 0, c.height * 0.30);
  band.addColorStop(0, 'rgba(255,255,255,0.55)');
  band.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = band;
  ctx.fillRect(0, 0, c.width, c.height * 0.30);
  ctx.globalCompositeOperation = 'source-over';

  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envTex = makeEnvTexture();
const envRT = pmrem.fromEquirectangular(envTex);
scene.environment = envRT.texture;
envTex.dispose();
pmrem.dispose();

/* ============================================================
   PROCEDURAL TEXTURES
   ============================================================ */

// Diffraction-film normal map: fine concentric grating + subtle grain
function makeGratingNormalMap(size = 512, rings = 190, amp = 0.55) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const d = img.data;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size;
      const dx = u - 0.5, dy = v - 0.5;
      const r = Math.sqrt(dx * dx + dy * dy);
      // radial grating height field
      const h = Math.sin(r * rings) * 0.5 + Math.sin((u + v) * rings * 0.35) * 0.18;
      // derivative approximations
      const nx = Math.cos(r * rings) * rings * (r > 1e-5 ? dx / r : 0) * 0.0012
               + Math.cos((u + v) * rings * 0.35) * 0.0006 * rings * 0.35;
      const ny = Math.cos(r * rings) * rings * (r > 1e-5 ? dy / r : 0) * 0.0012
               + Math.cos((u + v) * rings * 0.35) * 0.0006 * rings * 0.35;
      const gx = -nx * amp, gy = -ny * amp, gz = 1.0;
      const len = Math.sqrt(gx * gx + gy * gy + gz * gz);
      const i = (y * size + x) * 4;
      d[i]     = Math.max(0, Math.min(255, ((gx / len) * 0.5 + 0.5) * 255));
      d[i + 1] = Math.max(0, Math.min(255, ((gy / len) * 0.5 + 0.5) * 255));
      d[i + 2] = Math.max(0, Math.min(255, ((gz / len) * 0.5 + 0.5) * 255));
      d[i + 3] = 255;
      void h;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

// Soft rainbow gradient strip (used as emissive/edge tint source on sprites)
function makeRainbowTexture(w = 256, h = 8, alphaFalloff = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, w, 0);
  const stops = [
    [0.00, '#2fffe0'],
    [0.16, '#4fd8ff'],
    [0.32, '#7b7bff'],
    [0.48, '#c46bff'],
    [0.62, '#ff6ec7'],
    [0.76, '#ffb457'],
    [0.88, '#ffe98a'],
    [1.00, '#2fffe0']
  ];
  for (const [p, col] of stops) g.addColorStop(p, col);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  if (alphaFalloff) {
    const fade = ctx.createLinearGradient(0, 0, 0, h);
    fade.addColorStop(0.0, 'rgba(0,0,0,1)');
    fade.addColorStop(0.5, 'rgba(0,0,0,0)');
    fade.addColorStop(1.0, 'rgba(0,0,0,1)');
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = fade;
    ctx.fillRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'source-over';
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// Radial glow sprite
function makeGlowTexture(size = 256, inner = 'rgba(255,255,255,1)') {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0.0, inner);
  g.addColorStop(0.22, 'rgba(255,255,255,0.45)');
  g.addColorStop(0.55, 'rgba(255,255,255,0.10)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const gratingNormal = makeGratingNormalMap(512, 200, 0.6);
const rainbowTex = makeRainbowTexture();
const glowTex = makeGlowTexture();

/* ============================================================
   IRIDESCENT SHELL MATERIAL
   Physical material + custom onBeforeCompile thin-film tint that
   shifts teal -> violet -> gold with viewing angle.
   ============================================================ */
const iridUniformHolders = [];

function makeIridescentMaterial(opts = {}) {
  const mat = new THREE.MeshPhysicalMaterial({
    color: opts.color || new THREE.Color(0x0d1420),
    metalness: opts.metalness !== undefined ? opts.metalness : 0.92,
    roughness: opts.roughness !== undefined ? opts.roughness : 0.16,
    clearcoat: 1.0,
    clearcoatRoughness: 0.06,
    envMapIntensity: opts.envMapIntensity !== undefined ? opts.envMapIntensity : 1.5,
    iridescence: 1.0,
    iridescenceIOR: 1.8,
    iridescenceThicknessRange: opts.thicknessRange || [180, 780],
    normalMap: opts.normalMap !== undefined ? opts.normalMap : gratingNormal,
    normalScale: new THREE.Vector2(opts.normalScale || 0.16, opts.normalScale || 0.16),
    side: opts.side || THREE.FrontSide,
    transparent: !!opts.transparent,
    opacity: opts.opacity !== undefined ? opts.opacity : 1.0
  });
  if (mat.normalMap) {
    mat.normalMap.repeat.set(opts.repeat || 3, opts.repeat || 3);
  }

  const uniforms = {
    uTime: { value: 0 },
    uFilmStrength: { value: opts.filmStrength !== undefined ? opts.filmStrength : 1.0 },
    uFilmFreq: { value: opts.filmFreq !== undefined ? opts.filmFreq : 3.4 },
    uFringe: { value: opts.fringe !== undefined ? opts.fringe : 1.0 }
  };

  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uTime = uniforms.uTime;
    shader.uniforms.uFilmStrength = uniforms.uFilmStrength;
    shader.uniforms.uFilmFreq = uniforms.uFilmFreq;
    shader.uniforms.uFringe = uniforms.uFringe;

    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `
        #include <common>
        varying vec3 vHoloPos;
      `)
      .replace('#include <begin_vertex>', `
        #include <begin_vertex>
        vHoloPos = transformed;
      `);

    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `
        #include <common>
        uniform float uTime;
        uniform float uFilmStrength;
        uniform float uFilmFreq;
        uniform float uFringe;
        varying vec3 vHoloPos;

        // smooth spectral ramp: teal -> blue -> violet -> magenta -> gold -> teal
        vec3 spectrum(float t) {
          t = fract(t);
          return 0.5 + 0.5 * cos(6.28318 * (vec3(1.0, 1.0, 1.0) * t
                 + vec3(0.00, 0.33, 0.67)));
        }
        vec3 holoRamp(float t) {
          vec3 s = spectrum(t);
          // bias toward teal / violet / gold family
          s = mix(s, s * vec3(0.85, 1.12, 1.06), 0.35);
          return s;
        }
      `)
      .replace('#include <dithering_fragment>', `
        #include <dithering_fragment>
        {
          vec3 V = normalize( vViewPosition );
          vec3 N = normalize( normal );
          float fres = 1.0 - clamp(dot(N, V), 0.0, 1.0);

          // angle-dependent phase + positional grating -> diffraction bands
          float bands = sin( (vHoloPos.y * 46.0 + vHoloPos.x * 21.0) ) * 0.06;
          float phase = fres * uFilmFreq + bands + uTime * 0.045;
          vec3 tint = holoRamp(phase);

          // broad film wash
          float wash = pow(fres, 1.25) * uFilmStrength;
          gl_FragColor.rgb += tint * wash * 0.55;

          // sharp rainbow rim fringe along silhouettes/bevels
          float rim = pow(fres, 6.0);
          vec3 fringeCol = holoRamp(phase * 1.7 + 0.25);
          gl_FragColor.rgb += fringeCol * rim * 1.35 * uFringe;

          gl_FragColor.rgb = min(gl_FragColor.rgb, vec3(6.0));
        }
      `);
  };
  mat.customProgramCacheKey = () => 'holo-irid-' + (opts.key || 'default');

  iridUniformHolders.push(uniforms);
  return mat;
}

/* ============================================================
   HELPER: octagon shape / prism geometry
   ============================================================ */
const OCT_SIDES = 8;

function octagonShape(radius, cornerRadius = 0) {
  const shape = new THREE.Shape();
  const pts = [];
  for (let i = 0; i < OCT_SIDES; i++) {
    const a = (i / OCT_SIDES) * Math.PI * 2 + Math.PI / OCT_SIDES;
    pts.push(new THREE.Vector2(Math.cos(a) * radius, Math.sin(a) * radius));
  }
  if (cornerRadius <= 0) {
    shape.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i].x, pts[i].y);
    shape.closePath();
    return shape;
  }
  // rounded corners
  for (let i = 0; i < pts.length; i++) {
    const prev = pts[(i - 1 + pts.length) % pts.length];
    const cur = pts[i];
    const next = pts[(i + 1) % pts.length];
    const v1 = new THREE.Vector2().subVectors(prev, cur).normalize();
    const v2 = new THREE.Vector2().subVectors(next, cur).normalize();
    const p1 = new THREE.Vector2().copy(cur).addScaledVector(v1, cornerRadius);
    const p2 = new THREE.Vector2().copy(cur).addScaledVector(v2, cornerRadius);
    if (i === 0) shape.moveTo(p1.x, p1.y);
    else shape.lineTo(p1.x, p1.y);
    shape.quadraticCurveTo(cur.x, cur.y, p2.x, p2.y);
  }
  shape.closePath();
  return shape;
}

function beveledOctPrism(radius, height, bevel, curveSegments = 4) {
  const shape = octagonShape(radius - bevel, radius * 0.055);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: Math.max(0.0001, height - bevel * 2),
    bevelEnabled: true,
    bevelThickness: bevel,
    bevelSize: bevel,
    bevelOffset: 0,
    bevelSegments: 3,
    curveSegments: curveSegments,
    steps: 1
  });
  geo.rotateX(-Math.PI / 2);          // extrude along +Y
  geo.translate(0, bevel, 0);          // base sits at y=0
  geo.computeVertexNormals();
  return geo;
}

/* ============================================================
   DIMENSIONS (metres) — realistic small music box
   ============================================================ */
const R_BODY   = 0.062;   // octagon circumradius ~6.2cm
const H_BODY   = 0.052;   // body height
const H_PLINTH = 0.012;   // base plinth
const H_LID    = 0.020;   // lid slab thickness
const BEVEL    = 0.0035;

const musicBox = new THREE.Group();
scene.add(musicBox);

/* ---------- shared materials ---------- */
const shellMat = makeIridescentMaterial({
  key: 'shell',
  color: new THREE.Color(0x0b1018),
  metalness: 0.95, roughness: 0.14,
  thicknessRange: [200, 820],
  filmStrength: 1.15, filmFreq: 3.2, fringe: 1.0,
  repeat: 3.2, normalScale: 0.18, envMapIntensity: 1.7
});

const plinthMat = makeIridescentMaterial({
  key: 'plinth',
  color: new THREE.Color(0x080b12),
  metalness: 0.98, roughness: 0.22,
  thicknessRange: [300, 640],
  filmStrength: 0.8, filmFreq: 2.4, fringe: 0.85,
  repeat: 2.2, normalScale: 0.12, envMapIntensity: 1.3
});

const lidMat = makeIridescentMaterial({
  key: 'lid',
  color: new THREE.Color(0x0c1220),
  metalness: 0.94, roughness: 0.12,
  thicknessRange: [160, 900],
  filmStrength: 1.3, filmFreq: 3.9, fringe: 1.15,
  repeat: 3.6, normalScale: 0.2, envMapIntensity: 1.8
});

const hardwareMat = makeIridescentMaterial({
  key: 'hw',
  color: new THREE.Color(0x1a1410),
  metalness: 1.0, roughness: 0.06,
  thicknessRange: [120, 560],
  filmStrength: 1.5, filmFreq: 5.0, fringe: 1.6,
  normalMap: null, envMapIntensity: 2.4
});

const interiorMat = new THREE.MeshPhysicalMaterial({
  color: 0x0a1a22,
  metalness: 0.35,
  roughness: 0.55,
  clearcoat: 0.6,
  clearcoatRoughness: 0.35,
  envMapIntensity: 0.7,
  side: THREE.DoubleSide
});

const brassMat = new THREE.MeshPhysicalMaterial({
  color: 0xd8a24a,
  metalness: 1.0,
  roughness: 0.18,
  clearcoat: 0.8,
  clearcoatRoughness: 0.15,
  iridescence: 0.85,
  iridescenceIOR: 1.6,
  iridescenceThicknessRange: [140, 500],
  envMapIntensity: 2.0
});

/* ============================================================
   PLINTH (base) + FEET
   ============================================================ */
const plinth = new THREE.Mesh(beveledOctPrism(R_BODY * 1.09, H_PLINTH, BEVEL, 5), plinthMat);
plinth.castShadow = true;
plinth.receiveShadow = true;
musicBox.add(plinth);

// thin rainbow reveal line between plinth and body
function edgeRingMesh(radius, y, tubeR, colorScale = 1) {
  const geo = new THREE.TorusGeometry(radius, tubeR, 8, OCT_SIDES * 6);
  geo.rotateX(-Math.PI / 2);
  const mat = new THREE.MeshBasicMaterial({
    map: rainbowTex,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    opacity: 0.85 * colorScale,
    toneMapped: false
  });
  const m = new THREE.Mesh(geo, mat);
  m.position.y = y;
  return m;
}

// small feet
const footGeo = new THREE.SphereGeometry(0.0042, 16, 12);
for (let i = 0; i < 4; i++) {
  const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
  const foot = new THREE.Mesh(footGeo, hardwareMat);
  foot.position.set(Math.cos(a) * R_BODY * 0.72, 0.0012, Math.sin(a) * R_BODY * 0.72);
  foot.scale.set(1, 0.55, 1);
  foot.castShadow = true;
  musicBox.add(foot);
}
plinth.position.y = 0.003;

const BODY_Y = plinth.position.y + H_PLINTH;

/* ============================================================
   BODY SHELL (octagonal, hollow-looking with interior)
   ============================================================ */
const body = new THREE.Mesh(beveledOctPrism(R_BODY, H_BODY, BEVEL, 5), shellMat);
body.position.y = BODY_Y;
body.castShadow = true;
body.receiveShadow = true;
musicBox.add(body);

// interior cavity: a slightly smaller inverted octagon well
const WELL_R = R_BODY * 0.80;
const WELL_D = H_BODY * 0.62;
const wellGeo = new THREE.CylinderGeometry(WELL_R, WELL_R * 0.94, WELL_D, OCT_SIDES, 1, true);
const well = new THREE.Mesh(wellGeo, interiorMat);
well.position.y = BODY_Y + H_BODY - WELL_D / 2 + 0.0005;
well.rotation.y = Math.PI / OCT_SIDES;
well.receiveShadow = true;
musicBox.add(well);

const wellFloorGeo = new THREE.CircleGeometry(WELL_R * 0.95, OCT_SIDES);
wellFloorGeo.rotateX(-Math.PI / 2);
const wellFloor = new THREE.Mesh(wellFloorGeo, interiorMat);
wellFloor.position.y = BODY_Y + H_BODY - WELL_D;
wellFloor.rotation.y = Math.PI / OCT_SIDES;
wellFloor.receiveShadow = true;
musicBox.add(wellFloor);

// inner rim lip (top face ring), sits flush with body top
const lipGeo = new THREE.RingGeometry(WELL_R, R_BODY * 0.985, OCT_SIDES, 1);
lipGeo.rotateX(-Math.PI / 2);
const lip = new THREE.Mesh(lipGeo, shellMat);
lip.position.y = BODY_Y + H_BODY + 0.0002;
lip.rotation.y = Math.PI / OCT_SIDES;
musicBox.add(lip);

/* ---------- vertical rainbow fringe strips on each body facet ---------- */
const facetFringeMat = new THREE.MeshBasicMaterial({
  map: rainbowTex,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  opacity: 0.55,
  toneMapped: false,
  side: THREE.DoubleSide
});
for (let i = 0; i < OCT_SIDES; i++) {
  const a = (i / OCT_SIDES) * Math.PI * 2;
  const r = R_BODY * Math.cos(Math.PI / OCT_SIDES) + 0.0009;
  const strip = new THREE.Mesh(new THREE.PlaneGeometry(0.0022, H_BODY * 0.82), facetFringeMat);
  // place at the shared vertical corner between facets
  const ca = a + Math.PI / OCT_SIDES;
  const cr = R_BODY + 0.0006;
  strip.position.set(Math.cos(ca) * cr, BODY_Y + H_BODY * 0.5, Math.sin(ca) * cr);
  strip.lookAt(new THREE.Vector3(Math.cos(ca) * cr * 3, BODY_Y + H_BODY * 0.5, Math.sin(ca) * cr * 3));
  musicBox.add(strip);
  void r;
}

// horizontal rainbow reveal lines
const revealTop = edgeRingMesh(R_BODY * 0.999, BODY_Y + H_BODY - 0.0012, 0.00075, 1.0);
const revealBot = edgeRingMesh(R_BODY * 1.0, BODY_Y + 0.0016, 0.00065, 0.8);
const revealPlinth = edgeRingMesh(R_BODY * 1.089, plinth.position.y + H_PLINTH - 0.0012, 0.0007, 0.7);
musicBox.add(revealTop, revealBot, revealPlinth);

/* ============================================================
   HINGE HARDWARE (prismatic glint)
   ============================================================ */
const HINGE_ANGLE = Math.PI * 0.75;           // hinge sits at back-left-ish facet
const hingeDir = new THREE.Vector3(Math.cos(HINGE_ANGLE), 0, Math.sin(HINGE_ANGLE));
const HINGE_R = R_BODY * Math.cos(Math.PI / OCT_SIDES);
const hingeX = hingeDir.x * HINGE_R;
const hingeZ = hingeDir.z * HINGE_R;
const HINGE_Y = BODY_Y + H_BODY + 0.0015;

const hingeGroup = new THREE.Group();
hingeGroup.position.set(hingeX, HINGE_Y, hingeZ);
hingeGroup.rotation.y = -HINGE_ANGLE;   // local +X runs along the facet tangent
musicBox.add(hingeGroup);

// hinge barrel (knuckles)
const barrelLen = R_BODY * 0.66;
const knuckleCount = 5;
for (let i = 0; i < knuckleCount; i++) {
  const t = (i + 0.5) / knuckleCount;
  const g = new THREE.CylinderGeometry(0.0032, 0.0032, barrelLen / knuckleCount * 0.86, 20, 1);

   ============================================================ */
const clock = new THREE.Clock();
const motePosAttr = moteGeo.getAttribute('position');

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta(), 0.05);

  // iridescence phase drift
  for (const u of iridUniformHolders) u.uTime.value = t;

  // dancer pirouette + gentle bob
  dancer.rotation.y += dt * 1.35;
  dancer.position.y = SPINDLE_H - 0.0015 + Math.sin(t * 1.6) * 0.0016;
  dancer.rotation.z = THREE.MathUtils.degToRad(3) + Math.sin(t * 1.3) * 0.02;

  // music drum turns
  drumGroup.rotation.x += dt * 0.9;

  // wind-up key slowly unwinds
  keyWing.rotation.z -= dt * 0.55;

  // halos counter-rotate
  halos.forEach((h, i) => {
    h.rotation.z += dt * (0.4 + i * 0.25) * (i % 2 ? -1 : 1);
    h.rotation.y = Math.sin(t * (0.3 + i * 0.12)) * 0.25;
  });
  haloGroup.rotation.y += dt * 0.22;

  // rainbow texture scroll on fringe elements = shifting spectral edges
  rainbowTex.offset.x = (t * 0.045) % 1;

  // hinge glint pulse
  hingeGlint.material.opacity = 0.45 + 0.35 * Math.pow(Math.abs(Math.sin(t * 0.9)), 3);

  // lid breathes very slightly (as if resonating with the music)
  lidPivot.rotation.x = LID_OPEN + Math.sin(t * 0.7) * 0.012;

  // motes rise and recycle
  for (let i = 0; i < MOTES; i++) {
    let y = motePosAttr.getY(i);
    y += dt * (0.006 + moteSeed[i] * 0.014);
    if (y > 0.14) y = 0.004;
    motePosAttr.setY(i, y);
    const x = motePosAttr.getX(i), z = motePosAttr.getZ(i);
    const ang = dt * 0.18 * (0.5 + moteSeed[i]);
    const ca = Math.cos(ang), sa = Math.sin(ang);
    motePosAttr.setX(i, x * ca - z * sa);
    motePosAttr.setZ(i, x * sa + z * ca);
  }
  motePosAttr.needsUpdate = true;

  // subtle light shimmer
  dancerLight.intensity = 0.75 + Math.sin(t * 2.1) * 0.12;
  rim.intensity = 1.35 + Math.sin(t * 0.6) * 0.2;

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ============================================================
   RESIZE
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
