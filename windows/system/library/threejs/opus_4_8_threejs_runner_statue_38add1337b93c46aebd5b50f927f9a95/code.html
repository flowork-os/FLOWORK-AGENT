<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Park Statue — The Runner</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15171a; }
  #app { position: fixed; inset: 0; }
  #caption {
    position: fixed; left: 16px; bottom: 14px;
    font: 13px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #b9beC6; letter-spacing: .3px; user-select: none; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  #caption b { color: #e6c79a; font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<div id="caption"><b>The Runner</b> — cast bronze on a granite plinth · drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------------------------------------------------------------- Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

// ---------------------------------------------------------------- Scene / Camera
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171a);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(4.6, 2.7, 5.6);

// Studio environment for realistic metal reflections
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------------------------------------------------------------- Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.target.set(0, 1.8, 0);
controls.minDistance = 3.2;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.5;

// ---------------------------------------------------------------- Lighting
const hemi = new THREE.HemisphereLight(0x93b4d6, 0x2c241d, 0.4);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e0, 2.3);
key.position.set(5, 8.5, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 30;
key.shadow.camera.left = -3.2;
key.shadow.camera.right = 3.2;
key.shadow.camera.top = 3.6;
key.shadow.camera.bottom = -0.6;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
key.target.position.set(0, 1.6, 0);
scene.add(key);
scene.add(key.target);

const fill = new THREE.DirectionalLight(0x8ba7ff, 0.5);
fill.position.set(-6, 3, 2.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9a0, 1.7);
rim.position.set(-3.5, 5, -6);
scene.add(rim);

// ---------------------------------------------------------------- Ground (shadow-only)
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.001;
ground.receiveShadow = true;
scene.add(ground);

// ---------------------------------------------------------------- Procedural textures
function makeNoise(size, lo, hi, rx, ry) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let i = 0; i < size * size; i++) {
    const v = lo + Math.random() * (hi - lo);
    img.data[i * 4] = v; img.data[i * 4 + 1] = v; img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  return t;
}

// ---------------------------------------------------------------- Materials
const bronze = new THREE.MeshStandardMaterial({
  color: 0x6c4a28,
  metalness: 0.88,
  roughness: 0.52,
  roughnessMap: makeNoise(256, 110, 175, 2, 2),
  envMapIntensity: 1.1
});
const bronzeDark = new THREE.MeshStandardMaterial({
  color: 0x4f3418, metalness: 0.9, roughness: 0.6, envMapIntensity: 1.0
});
const stone = new THREE.MeshStandardMaterial({
  color: 0x9a968d,
  metalness: 0.0,
  roughness: 0.94,
  roughnessMap: makeNoise(256, 150, 235, 2, 2),
  bumpMap: makeNoise(512, 30, 225, 3, 3),
  bumpScale: 0.006
});
const stoneDark = stone.clone(); stoneDark.color = new THREE.Color(0x817d75);

// ---------------------------------------------------------------- Helpers
function M(mesh) { mesh.castShadow = true; mesh.receiveShadow = true; return mesh; }

// A bone: pivot at the top joint, extends down `len`, exposes .end group at the far joint.
function makeBone(len, radius, mat) {
  const g = new THREE.Group();
  const mesh = M(new THREE.Mesh(new THREE.CapsuleGeometry(radius, len, 8, 18), mat));
  mesh.position.y = -len / 2;
  g.add(mesh);
  const end = new THREE.Group();
  end.position.y = -len;
  g.add(end);
  g.end = end;
  return g;
}

function makeArm(mat, shoulderX, upperRotX, upperRotZ, foreRotX) {
  const shoulder = new THREE.Group();
  shoulder.position.set(shoulderX, 0.02, 0);
  const delt = M(new THREE.Mesh(new THREE.SphereGeometry(0.078, 18, 14), mat));
  delt.scale.set(1.1, 1.0, 1.0);
  shoulder.add(delt);

  const upper = makeBone(0.29, 0.05, mat);
  upper.rotation.set(upperRotX, 0, upperRotZ);
  shoulder.add(upper);

  const elbow = M(new THREE.Mesh(new THREE.SphereGeometry(0.046, 16, 12), mat));
  upper.end.add(elbow);

  const fore = makeBone(0.26, 0.04, mat);
  fore.rotation.set(foreRotX, 0, 0);
  upper.end.add(fore);

  const hand = M(new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.11, 0.085), mat));
  hand.position.y = -0.055;
  fore.end.add(hand);

  return shoulder;
}

function makeLeg(mat, hipX, thighRotX, shinRotX, ankleRotX) {
  const hip = new THREE.Group();
  hip.position.set(hipX, -0.02, 0);

  const thigh = makeBone(0.46, 0.085, mat);
  thigh.rotation.x = thighRotX;
  thigh.rotation.z = hipX < 0 ? 0.03 : -0.03;
  hip.add(thigh);

  const knee = M(new THREE.Mesh(new THREE.SphereGeometry(0.07, 18, 14), mat));
  thigh.end.add(knee);

  const shin = makeBone(0.44, 0.058, mat);
  shin.rotation.x = shinRotX;
  thigh.end.add(shin);

  const ankle = M(new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 12), mat));
  shin.end.add(ankle);

  const footGrp = new THREE.Group();
  footGrp.rotation.x = ankleRotX;
  shin.end.add(footGrp);

  const foot = M(new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.055, 0.27), mat));
  foot.position.set(0, -0.025, 0.085);
  footGrp.add(foot);
  const toe = M(new THREE.Mesh(new THREE.BoxGeometry(0.095, 0.045, 0.06), mat));
  toe.position.set(0, -0.03, 0.215);
  footGrp.add(toe);

  hip.footMesh = foot;
  return hip;
}

// ---------------------------------------------------------------- Pedestal (stone plinth)
const CAP_TOP = 1.17;
const pedestal = new THREE.Group();

const base = M(new THREE.Mesh(new THREE.BoxGeometry(1.05, 0.22, 0.85), stoneDark));
base.position.y = 0.11;
pedestal.add(base);

const shaft = M(new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.85, 0.58), stone));
shaft.position.y = 0.645;
pedestal.add(shaft);

const molding = M(new THREE.Mesh(new THREE.BoxGeometry(0.80, 0.06, 0.66), stoneDark));
molding.position.y = 1.04;
pedestal.add(molding);

const cap = M(new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.09, 0.70), stone));
cap.position.y = 1.115;
pedestal.add(cap);

// Bronze plaque on the front face
const plaque = M(new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.15, 0.012), bronzeDark));
plaque.position.set(0, 0.62, 0.296);
pedestal.add(plaque);

// ---------------------------------------------------------------- Runner figure
function buildRunner(mat) {
  const fig = new THREE.Group();

  // Pelvis
  const pelvis = M(new THREE.Mesh(new THREE.SphereGeometry(0.145, 24, 18), mat));
  pelvis.scale.set(1.25, 0.8, 0.9);
  fig.add(pelvis);

  // Spine / torso (leaning forward into the stride)
  const spine = new THREE.Group();
  spine.position.set(0, 0.07, 0);
  spine.rotation.x = 0.15;
  fig.add(spine);

  const torso = M(new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.125, 0.5, 24, 1), mat));
  torso.position.y = 0.25;
  spine.add(torso);

  const chestMass = M(new THREE.Mesh(new THREE.SphereGeometry(0.16, 20, 16), mat));
  chestMass.scale.set(1.28, 0.85, 0.85);
  chestMass.position.y = 0.42;
  spine.add(chestMass);

  // Shoulders / neck / head
  const chest = new THREE.Group();
  chest.position.set(0, 0.5, 0);
  spine.add(chest);

  const neck = M(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.063, 0.11, 16), mat));
  neck.position.y = 0.05;
  neck.rotation.x = -0.12;
  chest.add(neck);

  const head = M(new THREE.Mesh(new THREE.SphereGeometry(0.115, 28, 22), mat));
  head.scale.set(0.9, 1.08, 0.98);
  head.position.set(0, 0.20, 0.02);
  head.rotation.x = 0.06;
  chest.add(head);

  // Arms — right forward, left trailing (contralateral to the legs)
  chest.add(makeArm(mat,  0.185,  0.60, -0.12,  1.70));  // right, driving forward, elbow flexed
  chest.add(makeArm(mat, -0.185, -0.85,  0.12, -1.55));  // left, swung back, elbow flexed

  // Legs — right planted (stance), left driven forward with high knee (swing)
  const stance = makeLeg(mat,  0.11, -0.12,  0.06,  0.06);
  const swing  = makeLeg(mat, -0.11,  1.15, -1.55, -0.35);
  fig.add(stance);
  fig.add(swing);

  fig.userData.stanceFoot = stance.footMesh;
  return fig;
}

const runner = buildRunner(bronze);

// Plant the stance foot dead-centre on the plinth cap; sole flush with the stone.
runner.updateMatrixWorld(true);
const fb = new THREE.Box3().setFromObject(runner.userData.stanceFoot);
const footCenter = fb.getCenter(new THREE.Vector3());
runner.position.set(-footCenter.x, CAP_TOP - fb.min.y, -footCenter.z);

// Integral cast base plate under the planted foot
const basePlate = M(new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.03, 0.44), bronzeDark));
basePlate.position.set(0, CAP_TOP + 0.015, 0.02);
pedestal.add(basePlate);

// ---------------------------------------------------------------- The single centered object
const statue = new THREE.Group();
statue.add(pedestal);
statue.add(runner);
scene.add(statue);

// ---------------------------------------------------------------- Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------------------------------------------------------- Render loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
