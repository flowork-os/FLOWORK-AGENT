<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Skateboard</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #010106;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 47%, transparent 28%, rgba(0, 0, 10, 0.28) 68%, rgba(0, 0, 5, 0.76) 100%);
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x010106);
    scene.fog = new THREE.FogExp2(0x010106, 0.045);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(6.8, 4.25, 6.6);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.72;
    controls.enablePan = false;
    controls.minDistance = 5.6;
    controls.maxDistance = 14;
    controls.target.set(0, -0.05, 0);

    const composer = new EffectComposer(renderer);
    composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      1.48,
      0.72,
      0.08
    );
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    const MAGENTA = new THREE.Color().setRGB(4.8, 0.015, 2.35);
    const CYAN = new THREE.Color().setRGB(0.015, 3.7, 5.0);
    const SOFT_MAGENTA = new THREE.Color().setRGB(1.8, 0.01, 0.72);
    const SOFT_CYAN = new THREE.Color().setRGB(0.01, 1.45, 2.0);

    const pulseMaterials = [];

    function neonMaterial(color, opacity = 1, pulse = false) {
      const material = new THREE.LineBasicMaterial({
        color,
        transparent: true,
        opacity,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        toneMapped: false
      });
      if (pulse) {
        material.userData.baseOpacity = opacity;
        material.userData.phase = Math.random() * Math.PI * 2;
        material.userData.speed = 0.65 + Math.random() * 0.8;
        pulseMaterials.push(material);
      }
      return material;
    }

    const magentaStrong = neonMaterial(MAGENTA, 0.98);
    const cyanStrong = neonMaterial(CYAN, 0.98);
    const magentaFine = neonMaterial(SOFT_MAGENTA, 0.58, true);
    const cyanFine = neonMaterial(SOFT_CYAN, 0.58, true);
    const hardwareMaterial = neonMaterial(MAGENTA, 0.72);
    const wheelMaterial = neonMaterial(CYAN, 0.95);
    const spokeMaterial = neonMaterial(MAGENTA, 0.67, true);

    function lineFromPoints(points, material, closed = false) {
      const vertices = points.map((point) =>
        point instanceof THREE.Vector3
          ? point
          : new THREE.Vector3(point[0], point[1], point[2])
      );

      if (closed && vertices.length > 1) {
        vertices.push(vertices[0].clone());
      }

      const geometry = new THREE.BufferGeometry().setFromPoints(vertices);
      return new THREE.Line(geometry, material);
    }

    function segmentsFromPairs(pairs, material) {
      const positions = [];
      for (const [a, b] of pairs) {
        positions.push(a.x, a.y, a.z, b.x, b.y, b.z);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3)
      );
      return new THREE.LineSegments(geometry, material);
    }

    function edgedGeometry(geometry, material, threshold = 18) {
      return new THREE.LineSegments(
        new THREE.EdgesGeometry(geometry, threshold),
        material
      );
    }

    const board = new THREE.Group();
    board.rotation.z = -0.025;
    scene.add(board);

    const halfLength = 2.95;
    const halfWidth = 0.79;
    const shoulder = halfLength - halfWidth;
    const deckThickness = 0.115;

    function smoothstep(edge0, edge1, value) {
      const t = THREE.MathUtils.clamp(
        (value - edge0) / (edge1 - edge0),
        0,
        1
      );
      return t * t * (3 - 2 * t);
    }

    function widthAt(x) {
      const ax = Math.abs(x);
      if (ax <= shoulder) return halfWidth;
      const dx = ax - shoulder;
      return Math.sqrt(Math.max(0, halfWidth * halfWidth - dx * dx));
    }

    function deckY(x, z) {
      const width = Math.max(widthAt(x), 0.001);
      const lateral = Math.abs(z) / width;
      const concave = 0.112 * Math.pow(lateral, 2.25);
      const kick = 0.355 * Math.pow(
        smoothstep(1.92, halfLength, Math.abs(x)),
        1.6
      );
      return concave + kick;
    }

    function topPoint(x, z) {
      return new THREE.Vector3(x, deckY(x, z), z);
    }

    function bottomPoint(x, z) {
      return new THREE.Vector3(x, deckY(x, z) - deckThickness, z);
    }

    function perimeterPoints(bottom = false, samples = 84) {
      const points = [];

      for (let i = 0; i <= samples; i++) {
        const x = -halfLength + (2 * halfLength * i) / samples;
        const z = widthAt(x);
        points.push(bottom ? bottomPoint(x, z) : topPoint(x, z));
      }

      for (let i = samples; i >= 0; i--) {
        const x = -halfLength + (2 * halfLength * i) / samples;
        const z = -widthAt(x);
        points.push(bottom ? bottomPoint(x, z) : topPoint(x, z));
      }

      return points;
    }

    board.add(lineFromPoints(perimeterPoints(false), magentaStrong, true));
    board.add(lineFromPoints(perimeterPoints(true), cyanStrong, true));

    const longitudinalFractions = [-0.8, -0.58, -0.36, -0.17, 0, 0.17, 0.36, 0.58, 0.8];

    longitudinalFractions.forEach((fraction, index) => {
      const points = [];
      const samples = 100;

      for (let i = 0; i <= samples; i++) {
        const x = -halfLength + (2 * halfLength * i) / samples;
        const z = fraction * widthAt(x);
        points.push(topPoint(x, z));
      }

      board.add(
        lineFromPoints(
          points,
          index % 2 === 0 ? cyanFine : magentaFine
        )
      );
    });

    const crossSections = 25;

    for (let i = 1; i < crossSections; i++) {
      const x = -halfLength + (2 * halfLength * i) / crossSections;
      const width = widthAt(x);
      if (width < 0.05) continue;

      const points = [];
      const samples = 28;

      for (let j = 0; j <= samples; j++) {
        const z = -width + (2 * width * j) / samples;
        points.push(topPoint(x, z));
      }

      board.add(
        lineFromPoints(
          points,
          i % 4 < 2 ? magentaFine : cyanFine
        )
      );
    }

    const sideRibs = [];
    const ribCount = 26;

    for (let i = 0; i <= ribCount; i++) {
      const x = -halfLength + (2 * halfLength * i) / ribCount;
      const width = widthAt(x);

      if (width > 0.03) {
        sideRibs.push([
          topPoint(x, width),
          bottomPoint(x, width)
        ]);
        sideRibs.push([
          topPoint(x, -width),
          bottomPoint(x, -width)
        ]);
      }
    }

    board.add(segmentsFromPairs(sideRibs, cyanFine));

    for (const x of [-1.62, 1.62]) {
      const width = widthAt(x);
      const lowerCurve = [];

      for (let i = 0; i <= 24; i++) {
        const z = -width + (2 * width * i) / 24;
        lowerCurve.push(bottomPoint(x, z));
      }

      board.add(lineFromPoints(lowerCurve, magentaStrong));
    }

    function makeCircle(radius, segments, plane, offset, material) {
      const points = [];

      for (let i = 0; i <= segments; i++) {
        const angle = (i / segments) * Math.PI * 2;
        const c = Math.cos(angle) * radius;
        const s = Math.sin(angle) * radius;

        if (plane === "xy") {
          points.push(new THREE.Vector3(offset.x + c, offset.y + s, offset.z));
        } else if (plane === "xz") {
          points.push(new THREE.Vector3(offset.x + c, offset.y, offset.z + s));
        } else {
          points.push(new THREE.Vector3(offset.x, offset.y + c, offset.z + s));
        }
      }

      return lineFromPoints(points, material);
    }

    function createTruck(xPosition) {
      const truck = new THREE.Group();

      const baseGeometry = new THREE.BoxGeometry(0.72, 0.105, 0.53);
      const base = edgedGeometry(baseGeometry, hardwareMaterial, 10);
      base.position.set(xPosition, -0.205, 0);
      truck.add(base);

      const axleGeometry = new THREE.CylinderGeometry(0.055, 0.055, 1.54, 12, 1, true);
      axleGeometry.rotateX(Math.PI / 2);
      const axle = edgedGeometry(axleGeometry, cyanStrong, 10);
      axle.position.set(xPosition, -0.505, 0);
      truck.add(axle);

      const hangerPairs = [
        [
          new THREE.Vector3(xPosition - 0.3, -0.245, -0.21),
          new THREE.Vector3(xPosition - 0.12, -0.505, -0.6)
        ],
        [
          new THREE.Vector3(xPosition + 0.3, -0.245, -0.21),
          new THREE.Vector3(xPosition + 0.12, -0.505, -0.6)
        ],
        [
          new THREE.Vector3(xPosition - 0.3, -0.245, 0.21),
          new THREE.Vector3(xPosition - 0.12, -0.505, 0.6)
        ],
        [
          new THREE.Vector3(xPosition + 0.3, -0.245, 0.21),
          new THREE.Vector3(xPosition + 0.12, -0.505, 0.6)
        ],
        [
          new THREE.Vector3(xPosition - 0.12, -0.505, -0.6),
          new THREE.Vector3(xPosition + 0.12, -0.505, -0.6)
        ],
        [
          new THREE.Vector3(xPosition - 0.12, -0.505, 0.6),
          new THREE.Vector3(xPosition + 0.12, -0.505, 0.6)
        ]
      ];
      truck.add(segmentsFromPairs(hangerPairs, hardwareMaterial));

      const kingpinGeometry = new THREE.CylinderGeometry(0.075, 0.075, 0.31, 10, 1, true);
      const kingpin = edgedGeometry(kingpinGeometry, magentaStrong, 8);
      kingpin.position.set(xPosition, -0.365, 0);
      kingpin.rotation.z = 0.13 * Math.sign(xPosition);
      truck.add(kingpin);

      for (const side of [-1, 1]) {
        const wheelCenter = new THREE.Vector3(
          xPosition,
          -0.505,
          side * 0.72
        );
        const innerZ = side * 0.61;
        const outerZ = side * 0.83;

        truck.add(
          makeCircle(
            0.27,
            28,
            "xy",
            new THREE.Vector3(xPosition, -0.505, innerZ),
            wheelMaterial
          )
        );
        truck.add(
          makeCircle(
            0.27,
            28,
            "xy",
            new THREE.Vector3(xPosition, -0.505, outerZ),
            wheelMaterial
          )
        );
        truck.add(
          makeCircle(
            0.105,
            18,
            "xy",
            new THREE.Vector3(xPosition, -0.505, outerZ + side * 0.002),
            magentaStrong
          )
        );

        const treadPairs = [];
        const spokePairs = [];

        for (let i = 0; i < 12; i++) {
          const angle = (i / 12) * Math.PI * 2;
          const c = Math.cos(angle) * 0.27;
          const s = Math.sin(angle) * 0.27;

          treadPairs.push([
            new THREE.Vector3(xPosition + c, -0.505 + s, innerZ),
            new THREE.Vector3(xPosition + c, -0.505 + s, outerZ)
          ]);

          if (i % 2 === 0) {
            spokePairs.push([
              wheelCenter.clone().setZ(outerZ),
              new THREE.Vector3(
                xPosition + Math.cos(angle) * 0.215,
                -0.505 + Math.sin(angle) * 0.215,
                outerZ
              )
            ]);
          }
        }

        truck.add(segmentsFromPairs(treadPairs, cyanFine));
        truck.add(segmentsFromPairs(spokePairs, spokeMaterial));
      }

      return truck;
    }

    board.add(createTruck(-1.62));
    board.add(createTruck(1.62));

    const boltPairs = [];

    for (const truckX of [-1.62, 1.62]) {
      for (const dx of [-0.22, 0.22]) {
        for (const dz of [-0.22, 0.22]) {
          const x = truckX + dx;
          const y = deckY(x, dz) + 0.008;
          const radius = 0.035;
          const points = [];

          for (let i = 0; i < 10; i++) {
            const angle = (i / 10) * Math.PI * 2;
            points.push(
              new THREE.Vector3(
                x + Math.cos(angle) * radius,
                y,
                dz + Math.sin(angle) * radius
              )
            );
          }

          for (let i = 0; i < points.length; i++) {
            boltPairs.push([points[i], points[(i + 1) % points.length]]);
          }
        }
      }
    }

    board.add(segmentsFromPairs(boltPairs, cyanStrong));

    const undersideRails = [];

    for (const zFraction of [-0.62, 0, 0.62]) {
      const points = [];

      for (let i = 0; i <= 70; i++) {
        const x = -2.72 + (5.44 * i) / 70;
        const z = zFraction * widthAt(x);
        points.push(bottomPoint(x, z));
      }

      board.add(lineFromPoints(points, magentaFine));
    }

    const haloGeometry = new THREE.RingGeometry(2.3, 3.8, 96);
    const haloMaterial = new THREE.MeshBasicMaterial({
      color: new THREE.Color().setRGB(0.02, 0.05, 0.14),
      transparent: true,
      opacity: 0.09,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide,
      toneMapped: false
    });
    const halo = new THREE.Mesh(haloGeometry, haloMaterial);
    halo.rotation.x = -Math.PI / 2;
    halo.position.y = -1.03;
    halo.scale.set(1.25, 0.62, 1);
    scene.add(halo);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();

      for (const material of pulseMaterials) {
        const pulse =
          0.74 +
          0.26 * Math.sin(
            elapsed * material.userData.speed * 2.2 +
            material.userData.phase
          );
        material.opacity = material.userData.baseOpacity * pulse;
      }

      bloomPass.strength =
        1.42 + Math.sin(elapsed * 1.35) * 0.11 +
        Math.sin(elapsed * 0.47) * 0.05;

      haloMaterial.opacity = 0.072 + Math.sin(elapsed * 1.1) * 0.018;

      controls.update();
      composer.render();
    }

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const pixelRatio = Math.min(window.devicePixelRatio, 2);

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      renderer.setPixelRatio(pixelRatio);
      renderer.setSize(width, height);
      composer.setPixelRatio(pixelRatio);
      composer.setSize(width, height);
    }

    window.addEventListener("resize", resize);
    animate();
  </script>
</body>
</html>
