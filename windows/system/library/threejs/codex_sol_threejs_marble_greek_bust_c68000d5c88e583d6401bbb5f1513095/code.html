function createMarbleMaterial(color = 0xf0eee8, roughness = 0.32) {
  const material = new THREE.MeshPhysicalMaterial({
    color,
    roughness,
    metalness: 0,
    clearcoat: 0.2,
    clearcoatRoughness: 0.48,
    transmission: 0.025,
    thickness: 0.65,
    ior: 1.48,
    sheen: 0.08,
    sheenColor: new THREE.Color(0xffffff)
  });

  material.onBeforeCompile = shader => {
    shader.vertexShader = shader.vertexShader
      .replace(
        '#include <common>',
        '#include <common>\nvarying vec3 vMarblePosition;'
      )
      .replace(
        '#include <begin_vertex>',
        '#include <begin_vertex>\nvMarblePosition = position;'
      );

    shader.fragmentShader = shader.fragmentShader
      .replace(
        '#include <common>',
        '#include <common>\nvarying vec3 vMarblePosition;'
      )
      .replace(
        '#include <map_fragment>',
        `#include <map_fragment>
        vec3 mp = vMarblePosition;
        float broad = sin(mp.y * 3.1 + sin(mp.x * 2.3) * 1.4 + mp.z * 1.7);
        float fineA = sin(mp.y * 10.7 + mp.x * 6.4 + sin(mp.z * 5.2) * 2.1);
        float fineB = sin(mp.y * 21.0 - mp.x * 8.3 + mp.z * 3.8);
        float vein = smoothstep(0.87, 0.985, abs(broad * 0.72 + fineA * 0.22 + fineB * 0.06));
        float cloud = 0.5 + 0.5 * sin(mp.x * 1.7 + mp.y * 1.15 + mp.z * 2.05);
        diffuseColor.rgb *= 0.975 + cloud * 0.025;
        diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vec3(0.70, 0.72, 0.74), vein * 0.16);`
      );
  };
  material.customProgramCacheKey = () => 'procedural-carrara-v1';
  return material;
}

const marble = createMarbleMaterial();
const paleMarble = createMarbleMaterial(0xf5f3ed, 0.28);
const weatheredMarble = createMarbleMaterial(0xe8e5de, 0.39);
const recessMaterial = new THREE.MeshStandardMaterial({

  roughness: 0.8,

const bust = new THREE.Group();
bust.rotation.y = -0.08;
scene.add(bust);

function addMesh(geometry, material, position, scale, parent = bust) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function box(width, height, depth, y, material = marble) {
  const mesh = addMesh(
    new THREE.BoxGeometry(width, height, depth, 4, 2, 4),
    material,
    new THREE.Vector3(0, y, 0),
    new THREE.Vector3(1, 1, 1)
  );
  return mesh;
}

function tubeFromPoints(points, radius, material = marble, segments = 36) {
  const curve = new THREE.CatmullRomCurve3(points);
  return addMesh(
    new THREE.TubeGeometry(curve, segments, radius, 7, false),
    material,
    new THREE.Vector3(),
    new THREE.Vector3(1, 1, 1)
  );
}

];

bust.add(headGroup);

addMesh(

addMesh(

addMesh(

function createNoseGeometry() {
  const vertices = new Float32Array([
    -0.16,  0.34, 0.00,
     0.16,  0.34, 0.00,
    -0.13, -0.28, 0.02,
     0.13, -0.28, 0.02,
     0.00,  0.23, 0.42,
     0.00, -0.30, 0.52,
    -0.20, -0.34, 0.29,
     0.20, -0.34, 0.29
  ]);
  const indices = [
    0,1,4, 1,3,4, 3,5,4, 3,7,5,
    7,6,5, 2,5,6, 0,5,2, 0,4,5,
    0,2,1, 1,2,3, 2,6,3, 3,6,7
  ];
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

addMesh(

addMesh(

  weatheredMarble,
  new THREE.Vector3(0.43, 3.69, 0.49),

);

let randomState = 91357;
function random() {
  randomState = (randomState * 16807) % 2147483647;
  return (randomState - 1) / 2147483646;
}

function addCurl(x, y, z, radius, depth, tiltX = 0, tiltY = 0) {
  const curl = addMesh(
    new THREE.TorusGeometry(radius, depth, 10, 22),
    weatheredMarble,
    new THREE.Vector3(x, y, z),
    new THREE.Vector3(1, 1, 0.72),
    headGroup
  );
  curl.rotation.x = tiltX;
  curl.rotation.y = tiltY;
  curl.rotation.z = (random() - 0.5) * 0.45;
  return curl;
}

const hairRows = [
  { y: 5.20, count: 5, width: 0.52, z: 0.24 },
  { y: 5.03, count: 7, width: 0.75, z: 0.49 },
  { y: 4.84, count: 8, width: 0.86, z: 0.59 },
  { y: 4.68, count: 7, width: 0.79, z: 0.62 }
];

for (const row of hairRows) {
  for (let i = 0; i < row.count; i++) {
    const t = row.count === 1 ? 0.5 : i / (row.count - 1);
    const x = (t - 0.5) * row.width * 2;
    const edgeDrop = Math.pow(Math.abs(x) / (row.width + 0.001), 1.8) * 0.09;
    addCurl(
      x + (random() - 0.5) * 0.045,
      row.y - edgeDrop + (random() - 0.5) * 0.035,
      row.z - Math.abs(x) * 0.08,
      0.105 + random() * 0.035,
      0.034 + random() * 0.018,
      (random() - 0.5) * 0.25,
      (random() - 0.5) * 0.35
    );
  }
}

for (const side of [-1, 1]) {
  for (let i = 0; i < 6; i++) {
    const y = 4.62 - i * 0.17;
    addCurl(
      side * (0.78 + random() * 0.07),
      y,
      0.34 - i * 0.025,
      0.12 + random() * 0.025,
      0.04,
      0.05,
      side * 0.45
    );
  }
}

const beardRows = [
  { y: 3.81, count: 5, width: 0.55, z: 0.75 },
  { y: 3.62, count: 6, width: 0.62, z: 0.70 },
  { y: 3.42, count: 5, width: 0.53, z: 0.63 },
  { y: 3.22, count: 4, width: 0.39, z: 0.52 },
  { y: 3.05, count: 3, width: 0.25, z: 0.40 }
];

for (const row of beardRows) {
  for (let i = 0; i < row.count; i++) {
    const t = row.count === 1 ? 0.5 : i / (row.count - 1);
    const x = (t - 0.5) * row.width * 2;
    addCurl(
      x + (random() - 0.5) * 0.035,
      row.y + (random() - 0.5) * 0.035,
      row.z - Math.abs(x) * 0.11,
      0.105 + random() * 0.035,
      0.035 + random() * 0.016,
      (random() - 0.5) * 0.22,
      x * 0.42
    );
  }
}

for (const side of [-1, 1]) {
  tubeFromPoints([
    new THREE.Vector3(side * 0.16, 4.02, 0.77),

}

floor.rotation.x = -Math.PI / 2;

backdrop.position.set(0, 6, -6);
backdrop.receiveShadow = true;
scene.add(backdrop);

const keyLight = new THREE.DirectionalLight(0xfff2df, 4.4);
keyLight.position.set(5.5, 8.5, 6.5);
keyLight.castShadow = true;

keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -2;

rimLight.target.position.set(0, 3.8, 0);
scene.add(rimLight, rimLight.target);

const warmLight = new THREE.PointLight(0xffcfa4, 0.8, 10, 2);
warmLight.position.set(3, 2.5, 3.8);
scene.add(warmLight);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  warmLight.intensity = 0.78 + Math.sin(elapsed * 0.35) * 0.025;
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
