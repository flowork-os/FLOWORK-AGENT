<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADA Access Ramp</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: linear-gradient(#cbd9e2, #eef1ed);
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 22px;
      bottom: 20px;
      padding: 10px 14px;
      color: #263238;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(50,60,65,.16);
      border-radius: 7px;
      box-shadow: 0 3px 14px rgba(0,0,0,.1);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    .label strong { display: block; font-size: 14px; letter-spacing: .04em; }
    .label span { font-size: 11px; color: #607078; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">
    <strong>ACCESSIBLE RAMP</strong>
    <span>1:12 slope · 915 mm clear width</span>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd9e3e8);
    scene.fog = new THREE.Fog(0xd9e3e8, 22, 42);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(9.2, 6.1, 11.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.75, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.45;
    controls.minDistance = 6;
    controls.maxDistance = 28;
    controls.maxPolarAngle = Math.PI * 0.48;

    const hemi = new THREE.HemisphereLight(0xeaf6ff, 0x67705e, 1.75);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff4dc, 3.3);
    sun.position.set(-7, 12, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -12;
    sun.shadow.camera.right = 12;
    sun.shadow.camera.top = 12;
    sun.shadow.camera.bottom = -12;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 35;
    sun.shadow.bias = -0.00015;
    scene.add(sun);

    const concrete = new THREE.MeshStandardMaterial({
      color: 0xa8a8a1,
      roughness: 0.91,
      metalness: 0.02
    });
    const concreteEdge = new THREE.MeshStandardMaterial({
      color: 0x8c8d88,
      roughness: 0.95
    });
    const steel = new THREE.MeshStandardMaterial({
      color: 0xc3c9ca,
      roughness: 0.28,
      metalness: 0.82
    });
    const darkSteel = new THREE.MeshStandardMaterial({
      color: 0x596064,
      roughness: 0.34,
      metalness: 0.74
    });
    const tactileMat = new THREE.MeshStandardMaterial({
      color: 0xd8a929,
      roughness: 0.72,
      metalness: 0.02
    });
    const asphalt = new THREE.MeshStandardMaterial({
      color: 0x555a58,
      roughness: 1
    });
    const grass = new THREE.MeshStandardMaterial({
      color: 0x63785c,
      roughness: 1
    });

    function mesh(geometry, material, cast = true, receive = true) {
      const object = new THREE.Mesh(geometry, material);
      object.castShadow = cast;
      object.receiveShadow = receive;
      scene.add(object);
      return object;
    }

    function cylinderBetween(a, b, radius, material, radialSegments = 16) {
      const start = new THREE.Vector3(...a);
      const end = new THREE.Vector3(...b);
      const delta = end.clone().sub(start);
      const length = delta.length();
      const object = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, radialSegments),
        material
      );
      object.position.copy(start).add(end).multiplyScalar(0.5);
      object.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        delta.normalize()
      );
      object.castShadow = true;
      object.receiveShadow = true;
      scene.add(object);
      return object;
    }

    const run = 9.6;
    const rise = 0.80;
    const rampWidth = 1.22;
    const deckThickness = 0.16;
    const lowZ = 5.1;
    const highZ = lowZ - run;
    const lowY = 0.13;
    const highY = lowY + rise;
    const slopeAngle = Math.atan2(rise, run);
    const slopedLength = Math.hypot(run, rise);
    const centerZ = (lowZ + highZ) * 0.5;
    const centerY = (lowY + highY) * 0.5;

    const ramp = mesh(
      new THREE.BoxGeometry(rampWidth, deckThickness, slopedLength),
      concrete
    );
    ramp.position.set(0, centerY - deckThickness * 0.5, centerZ);
    ramp.rotation.x = slopeAngle;

    const landingLength = 1.82;
    const landingCenterZ = highZ - landingLength * 0.5;
    const landing = mesh(
      new THREE.BoxGeometry(rampWidth, 0.20, landingLength),
      concrete
    );
    landing.position.set(0, highY - 0.10, landingCenterZ);

    const upperWalk = mesh(
      new THREE.BoxGeometry(4.8, 0.20, 2.3),
      concrete
    );
    upperWalk.position.set(0, highY - 0.10, highZ - landingLength - 1.15);

    const lowPad = mesh(
      new THREE.BoxGeometry(3.7, 0.14, 2.25),
      concrete
    );
    lowPad.position.set(0, lowY - 0.07, lowZ + 1.125);

    const curbWidth = 0.095;
    const curbHeight = 0.105;
    for (const side of [-1, 1]) {
      const curb = mesh(
        new THREE.BoxGeometry(curbWidth, curbHeight, slopedLength),
        concreteEdge
      );
      curb.position.set(
        side * (rampWidth * 0.5 - curbWidth * 0.5),
        centerY + curbHeight * 0.5,
        centerZ
      );
      curb.rotation.x = slopeAngle;

      const landingCurb = mesh(
        new THREE.BoxGeometry(curbWidth, curbHeight, landingLength),
        concreteEdge
      );
      landingCurb.position.set(
        side * (rampWidth * 0.5 - curbWidth * 0.5),
        highY + curbHeight * 0.5,
        landingCenterZ
      );
    }

    function surfaceY(z) {
      const t = THREE.MathUtils.clamp((lowZ - z) / run, 0, 1);
      return lowY + rise * t;
    }

    const railX = rampWidth * 0.5 + 0.035;
    const railHeight = 0.865;
    const lowerRailHeight = 0.48;
    const postRadius = 0.025;
    const railRadius = 0.032;

    const rampPostZ = [5.02, 3.45, 1.85, 0.25, -1.35, -2.95, highZ];
    const landingEndZ = highZ - landingLength + 0.08;

    for (const side of [-1, 1]) {
      const x = side * railX;

      for (const z of rampPostZ) {
        const y = surfaceY(z);
        cylinderBetween(
          [x, y + 0.015, z],
          [x, y + railHeight + 0.015, z],
          postRadius,
          darkSteel
        );

        const foot = mesh(
          new THREE.CylinderGeometry(0.064, 0.064, 0.012, 24),
          darkSteel
        );
        foot.position.set(x, y + 0.006, z);
      }

      cylinderBetween(
        [x, lowY + railHeight, lowZ + 0.28],
        [x, highY + railHeight, highZ - 0.02],
        railRadius,
        steel,
        20
      );
      cylinderBetween(
        [x, lowY + lowerRailHeight, lowZ],
        [x, highY + lowerRailHeight, highZ],
        0.022,
        steel,
        16
      );

      const landingPosts = [highZ - landingLength * 0.52, landingEndZ];
      for (const z of landingPosts) {
        cylinderBetween(
          [x, highY + 0.015, z],
          [x, highY + railHeight + 0.015, z],
          postRadius,
          darkSteel
        );
        const foot = mesh(
          new THREE.CylinderGeometry(0.064, 0.064, 0.012, 24),
          darkSteel
        );
        foot.position.set(x, highY + 0.006, z);
      }

      cylinderBetween(
        [x, highY + railHeight, highZ],
        [x, highY + railHeight, landingEndZ - 0.24],
        railRadius,
        steel,
        20
      );
      cylinderBetween(
        [x, highY + lowerRailHeight, highZ],
        [x, highY + lowerRailHeight, landingEndZ],
        0.022,
        steel,
        16
      );

      cylinderBetween(
        [x, lowY + railHeight, lowZ + 0.28],
        [x, lowY + railHeight, lowZ + 0.62],
        railRadius,
        steel,
        20
      );
      cylinderBetween(
        [x, highY + railHeight, landingEndZ - 0.24],
        [x, highY + railHeight, landingEndZ - 0.52],
        railRadius,
        steel,
        20
      );

      cylinderBetween(
        [x, lowY + railHeight, lowZ + 0.62],
        [x, lowY + railHeight - 0.11, lowZ + 0.62],
        railRadius,
        steel,
        20
      );
      cylinderBetween(
        [x, highY + railHeight, landingEndZ - 0.52],
        [x, highY + railHeight - 0.11, landingEndZ - 0.52],
        railRadius,
        steel,
        20
      );
    }

    const tactile = mesh(
      new THREE.BoxGeometry(1.03, 0.018, 0.52),
      tactileMat
    );
    tactile.position.set(0, lowY + 0.011, lowZ + 0.68);

    const dotGeometry = new THREE.SphereGeometry(0.025, 12, 7, 0, Math.PI * 2, 0, Math.PI * 0.5);
    for (let row = 0; row < 4; row++) {
      for (let col = 0; col < 9; col++) {
        const dot = mesh(dotGeometry, tactileMat, false, true);
        dot.position.set(
          -0.44 + col * 0.11,
          lowY + 0.025,
          lowZ + 0.50 + row * 0.115
        );
      }
    }

    const jointMat = new THREE.MeshStandardMaterial({
      color: 0x696b68,
      roughness: 0.9
    });
    for (let i = 1; i < 6; i++) {
      const z = lowZ - i * run / 6;
      const line = mesh(
        new THREE.BoxGeometry(rampWidth - 0.18, 0.006, 0.012),
        jointMat,
        false,
        true
      );
      line.position.set(0, surfaceY(z) + 0.006, z);
      line.rotation.x = slopeAngle;
    }

    const ground = mesh(
      new THREE.PlaneGeometry(38, 38),
      grass,
      false,
      true
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.015;

    const path = mesh(
      new THREE.BoxGeometry(4.4, 0.045, 8.5),
      asphalt,
      false,
      true
    );
    path.position.set(0, 0.012, 10.45);

    const borderMat = new THREE.MeshStandardMaterial({
      color: 0x7d8077,
      roughness: 0.95
    });
    for (const x of [-2.28, 2.28]) {
      const edge = mesh(
        new THREE.BoxGeometry(0.16, 0.13, 8.5),
        borderMat
      );
      edge.position.set(x, 0.05, 10.45);
    }

    const wallMat = new THREE.MeshStandardMaterial({
      color: 0xc8c1b5,
      roughness: 0.88
    });
    const wall = mesh(
      new THREE.BoxGeometry(10, 2.7, 0.32),
      wallMat
    );
    wall.position.set(0, 1.35, highZ - landingLength - 2.3);

    const baseTrim = mesh(
      new THREE.BoxGeometry(10.1, 0.22, 0.38),
      concreteEdge
    );
    baseTrim.position.set(0, 0.11, highZ - landingLength - 2.11);

    const doorMat = new THREE.MeshStandardMaterial({
      color: 0x36505a,
      roughness: 0.4,
      metalness: 0.35
    });
    const door = mesh(
      new THREE.BoxGeometry(1.28, 2.15, 0.08),
      doorMat
    );
    door.position.set(0, highY + 1.075, highZ - landingLength - 2.11);

    const frameMat = new THREE.MeshStandardMaterial({
      color: 0xb9bec0,
      roughness: 0.3,
      metalness: 0.78
    });
    for (const x of [-0.70, 0.70]) {
      const frame = mesh(
        new THREE.BoxGeometry(0.09, 2.28, 0.10),
        frameMat
      );
      frame.position.set(x, highY + 1.14, highZ - landingLength - 2.05);
    }
    const frameTop = mesh(
      new THREE.BoxGeometry(1.49, 0.09, 0.10),
      frameMat
    );
    frameTop.position.set(0, highY + 2.28, highZ - landingLength - 2.05);

    const handle = cylinderBetween(
      [0.43, highY + 0.90, highZ - landingLength - 2.00],
      [0.43, highY + 1.22, highZ - landingLength - 2.00],
      0.018,
      steel,
      16
    );

    const bollardMat = new THREE.MeshStandardMaterial({
      color: 0xd6d1bd,
      roughness: 0.45,
      metalness: 0.15
    });
    for (const x of [-2.75, 2.75]) {
      const bollard = mesh(
        new THREE.CylinderGeometry(0.07, 0.085, 0.78, 20),
        bollardMat
      );
      bollard.position.set(x, 0.39, 7.25);
    }

    const shadowPad = mesh(
      new THREE.CircleGeometry(8.5, 64),
      new THREE.MeshBasicMaterial({
        color: 0x384037,
        transparent: true,
        opacity: 0.05,
        depthWrite: false
      }),
      false,
      false
    );
    shadowPad.rotation.x = -Math.PI / 2;
    shadowPad.position.set(0, 0.003, 0.7);

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
