<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpine Lake Shore</title>
<style>
html, body { margin: 0; overflow: hidden; background: #a8c5d0; }
canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xb7ced0, 0.0062);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(25, 14, 30);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;
controls.minDistance = 12;
controls.maxDistance = 75;
controls.maxPolarAngle = Math.PI * 0.48;
controls.target.set(0, 5, -7);

const clock = new THREE.Clock();
let seed = 41273;
function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a, b) { return a + (b - a) * rand(); }

const mat = {
  meadow: new THREE.MeshStandardMaterial({ color: 0x718c54, roughness: 1 }),
  grassDark: new THREE.MeshStandardMaterial({ color: 0x405f3c, roughness: 1 }),
  earth: new THREE.MeshStandardMaterial({ color: 0x5c4937, roughness: 1 }),
  water: new THREE.MeshPhysicalMaterial({
    color: 0x4b91a0, roughness: 0.08, metalness: 0.1,
    transmission: 0.04, transparent: true, opacity: 0.84
  }),
  waterDark: new THREE.MeshStandardMaterial({ color: 0x35717f, roughness: 0.18, transparent: true, opacity: 0.55 }),
  rock: new THREE.MeshStandardMaterial({ color: 0x5e6a68, roughness: 0.92 }),
  rockLight: new THREE.MeshStandardMaterial({ color: 0x82908a, roughness: 0.88 }),
  rockDark: new THREE.MeshStandardMaterial({ color: 0x3d4b4b, roughness: 1 }),
  pine: new THREE.MeshStandardMaterial({ color: 0x254b3a, roughness: 0.96 }),
  pineLight: new THREE.MeshStandardMaterial({ color: 0x37664a, roughness: 0.96 }),
  trunk: new THREE.MeshStandardMaterial({ color: 0x5a3928, roughness: 1 }),
  cabin: new THREE.MeshStandardMaterial({ color: 0x795034, roughness: 0.92 }),
  cabinDark: new THREE.MeshStandardMaterial({ color: 0x4b3024, roughness: 1 }),
  roof: new THREE.MeshStandardMaterial({ color: 0x323c3b, roughness: 0.95 }),
  snow: new THREE.MeshStandardMaterial({ color: 0xeaf2ee, roughness: 0.76 }),
  flowerWhite: new THREE.MeshStandardMaterial({ color: 0xf4eee1, roughness: 0.65 }),
  flowerYellow: new THREE.MeshStandardMaterial({ color: 0xf4c64f, roughness: 0.7 }),
  flowerBlue: new THREE.MeshStandardMaterial({ color: 0x7da8d4, roughness: 0.7 }),
  ember: new THREE.MeshStandardMaterial({ color: 0xff6b20, emissive: 0xff2a05, emissiveIntensity: 3.5 }),
  smoke: new THREE.MeshStandardMaterial({ color: 0xcbd5d0, transparent: true, opacity: 0.19, depthWrite: false }),
  rope: new THREE.MeshStandardMaterial({ color: 0xb19567, roughness: 1 }),
  glass: new THREE.MeshStandardMaterial({ color: 0x8bc8ca, emissive: 0x244d51, emissiveIntensity: 1.4, roughness: 0.25 })
};

function add(mesh, parent = scene) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function box(w, h, d, material, x = 0, y = 0, z = 0, parent = scene) {
  const m = add(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material), parent);
  m.position.set(x, y, z);
  return m;
}
function cyl(r1, r2, h, material, x = 0, y = 0, z = 0, parent = scene, radial = 8) {
  const m = add(new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, radial), material), parent);
  m.position.set(x, y, z);
  return m;
}
function sphere(r, material, x = 0, y = 0, z = 0, parent = scene, scale = 1) {
  const m = add(new THREE.Mesh(new THREE.SphereGeometry(r, 12, 8), material), parent);
  m.position.set(x, y, z);
  m.scale.setScalar(scale);
  return m;
}
function cone(r, h, material, x = 0, y = 0, z = 0, parent = scene, radial = 8) {
  const m = add(new THREE.Mesh(new THREE.ConeGeometry(r, h, radial), material), parent);
  m.position.set(x, y, z);
  return m;
}
function makeLine(points, material, parent = scene, tube = 0.025) {
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = add(new THREE.Mesh(new THREE.TubeGeometry(curve, 16, tube, 5, false), material), parent);
  return mesh;
}

const hemi = new THREE.HemisphereLight(0xdcecf0, 0x394a38, 2.1);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe4bc, 3.6);
sun.position.set(-24, 35, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -48;
sun.shadow.camera.right = 48;
sun.shadow.camera.top = 45;
sun.shadow.camera.bottom = -35;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 110;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8cc8e0, 0.65);
fill.position.set(32, 18, -30);
scene.add(fill);

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(180, 32, 16),
  new THREE.MeshBasicMaterial({ color: 0x9dbbc8, side: THREE.BackSide, fog: false })
);
scene.add(sky);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(150, 130, 40, 40), mat.meadow);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.18;
ground.receiveShadow = true;
scene.add(ground);

const shore = new THREE.Mesh(new THREE.PlaneGeometry(104, 42, 1, 1), mat.earth);
shore.rotation.x = -Math.PI / 2;
shore.position.set(0, -0.08, 12);
shore.receiveShadow = true;
scene.add(shore);

const lake = new THREE.Mesh(new THREE.PlaneGeometry(105, 62, 70, 45), mat.water);
lake.rotation.x = -Math.PI / 2;
lake.position.set(0, 0.06, -15);
lake.receiveShadow = true;
scene.add(lake);

const waterLines = new THREE.Group();
scene.add(waterLines);
for (let i = 0; i < 34; i++) {
  const z = range(-42, 8);
  const x = range(-46, 46);
  const len = range(1.5, 7);
  const line = new THREE.Mesh(
    new THREE.PlaneGeometry(len, 0.018),
    new THREE.MeshBasicMaterial({ color: 0xafd5d2, transparent: true, opacity: range(0.08, 0.23) })
  );
  line.rotation.x = -Math.PI / 2;
  line.position.set(x, 0.105, z);
  waterLines.add(line);
}

function mountain(x, z, scale, color, snowAmount = 0.35) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.scale.setScalar(scale);
  scene.add(g);
  const body = cone(12, 27, new THREE.MeshStandardMaterial({ color, roughness: 1 }), 0, 13.5, 0, g, 7);
  body.rotation.y = range(0, Math.PI);
  if (snowAmount > 0) {
    const cap = cone(5.2 * snowAmount + 1.1, 7.5 * snowAmount + 2.6, mat.snow, 0, 25.5, 0, g, 7);
    cap.rotation.y = body.rotation.y;
  }
  return g;
}
mountain(-31, -48, 1.55, 0x657c79, 0.92);
mountain(-8, -53, 1.8, 0x587471, 1.0);
mountain(18, -50, 1.45, 0x657d7b, 0.76);
mountain(40, -45, 1.15, 0x718984, 0.56);
mountain(-50, -35, 1.05, 0x718a81, 0.45);

function boulder(x, y, z, s, material = mat.rock) {
  const b = sphere(1, material, x, y + s * 0.55, z, scene);
  b.scale.set(s * 1.35, s * 0.72, s);
  b.rotation.set(range(-0.2, 0.2), range(0, Math.PI), range(-0.15, 0.15));
  return b;
}
for (let i = 0; i < 28; i++) {
  const x = range(-48, 48);
  const z = range(4, 19);
  const s = range(0.18, 0.8) * (z < 9 ? 1.35 : 1);
  boulder(x, 0, z, s, rand() > 0.72 ? mat.rockLight : mat.rock);
}
for (let i = 0; i < 11; i++) {
  const x = range(-48, 48);
  boulder(x, 0, 7 + range(-1, 1), range(0.35, 1.0), mat.rockDark);
}

function pine(x, z, s = 1, parent = scene) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.scale.setScalar(s);
  parent.add(g);
  cyl(0.19, 0.27, 2.8, mat.trunk, 0, 1.4, 0, g, 7);
  const tiers = [
    { r: 1.45, h: 3.2, y: 3.0 },
    { r: 1.12, h: 2.9, y: 4.45 },
    { r: 0.78, h: 2.5, y: 5.75 }
  ];
  tiers.forEach((t, i) => {
    const c = cone(t.r, t.h, i === 1 ? mat.pineLight : mat.pine, 0, t.y, 0, g, 9);
    c.rotation.y = range(0, Math.PI);
  });
  return g;
}
for (let i = 0; i < 26; i++) {
  const side = rand() > 0.5 ? 1 : -1;
  const x = side * range(29, 48);
  const z = range(-1, 15);
  pine(x, z, range(0.75, 1.35));
}
for (let i = 0; i < 13; i++) pine(range(-48, 48), range(8, 22), range(0.55, 0.9));

function grassTuft(x, z, s = 1) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.scale.setScalar(s);
  scene.add(g);
  for (let i = 0; i < 5; i++) {
    const blade = makeLine([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(range(-0.08, 0.08), range(0.25, 0.45), range(-0.05, 0.05)),
      new THREE.Vector3(range(-0.22, 0.22), range(0.55, 0.8), range(-0.13, 0.13))
    ], mat.grassDark, g, 0.026);
    blade.rotation.y = i * 1.2;
  }
}
for (let i = 0; i < 110; i++) grassTuft(range(-47, 47), range(5, 25), range(0.45, 1.15));

function flower(x, z, material) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  scene.add(g);
  makeLine([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, range(0.32, 0.6), 0)], mat.grassDark, g, 0.018);
  for (let i = 0; i < 5; i++) {
    const p = sphere(0.075, material, Math.cos(i * 1.256) * 0.11, 0.57 + Math.sin(i * 1.256) * 0.04, Math.sin(i * 1.256) * 0.11, g);
    p.scale.set(1.0, 0.55, 1.25);
  }
  sphere(0.055, mat.flowerYellow, 0, 0.59, 0, g);
}
for (let i = 0; i < 33; i++) {
  const colors = [mat.flowerWhite, mat.flowerYellow, mat.flowerBlue];
  flower(range(-37, 38), range(8, 24), colors[Math.floor(rand() * colors.length)]);
}

function buildCabin() {
  const g = new THREE.Group();
  g.position.set(-22, 0, 9);
  scene.add(g);
  box(9, 4.8, 6.4, mat.cabin, 0, 2.4, 0, g);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(5.8, 7.8, 4), mat.roof);
  roof.rotation.y = Math.PI / 4;
  roof.scale.z = 0.62;
  roof.position.set(0, 5.8, 0);
  add(roof, g);
  box(9.2, 0.34, 6.6, mat.snow, 0, 8.0, 0, g);
  box(1.55, 2.8, 0.22, mat.cabinDark, -1.9, 1.5, -3.22, g);
  for (let x of [-3.2, 3.0]) {
    box(1.25, 1.2, 0.18, mat.glass, x, 2.65, -3.25, g);
    box(0.1, 1.25, 0.2, mat.cabinDark, x, 2.65, -3.38, g);
    box(1.3, 0.1, 0.2, mat.cabinDark, x, 2.65, -3.4, g);
  }
  const chimney = box(0.72, 3.0, 0.72, mat.cabinDark, 2.1, 7.3, 0.2, g);
  box(0.95, 0.25, 0.95, mat.roof, 2.1, 8.85, 0.2, g);
  for (let i = 0; i < 4; i++) {
    const puff = sphere(range(0.28, 0.48), mat.smoke, 2.1 + range(-0.2, 0.2), 9.35 + i * 0.65, 0.2 + range(-0.2, 0.2), g);
    puff.userData.phase = rand() * 4;
    puff.userData.baseX = puff.position.x;
    puff.userData.baseZ = puff.position.z;
    smokePuffs.push(puff);
  }
  for (let i = 0; i < 5; i++) box(0.12, 5.0, 0.18, mat.cabinDark, -4.55 + i * 2.2, 2.5, 3.25, g);
  return g;
}
const smokePuffs = [];
buildCabin();

function buildDock() {
  const g = new THREE.Group();
  g.position.set(15, 0.35, 8);
  g.rotation.y = -0.08;
  scene.add(g);
  box(4.8, 0.32, 2.1, mat.trunk, 0, 0, 0, g);
  for (let x of [-1.8, 1.8]) for (let z of [-0.7, 0.7]) cyl(0.19, 0.22, 1.25, mat.trunk, x, -0.58, z, g, 8);
  for (let i = 0; i < 5; i++) box(0.82, 0.38, 2.18, mat.cabin, -1.65 + i * 0.82, 0.2, 0, g);
  const post = cyl(0.12, 0.12, 1.4, mat.rope, 2.3, 0.8, 0, g, 7);
  post.rotation.z = -0.2;
  return g;
}
buildDock();

function buildBoat() {
  const g = new THREE.Group();
  g.position.set(11.2, 0.28, -1.2);
  g.rotation.y = -0.3;
  scene.add(g);
  const hull = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 8), mat.cabin);
  hull.scale.set(2.55, 0.42, 0.9);
  hull.position.y = 0.15;
  add(hull, g);
  box(4.0, 0.24, 0.9, mat.cabinDark, 0, 0.55, 0, g);
  for (let x of [-1.3, 0, 1.3]) box(0.12, 0.08, 1.45, mat.rope, x, 0.72, 0, g);
  const oar = box(0.1, 0.1, 4.3, mat.rope, 0.5, 1.0, 0, g);
  oar.rotation.y = Math.PI * 0.42;
  oar.rotation.z = 0.18;
  g.userData.origin = g.position.clone();
  return g;
}
const boat = buildBoat();

function torusRing(radius, tube, material, x, y, z, parent = scene) {
  const t = add(new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 8, 48), material), parent);
  t.rotation.x = -Math.PI / 2;
  t.position.set(x, y, z);
  return t;
}
const ripples = [];
for (let i = 0; i < 5; i++) {
  const r = torusRing(1.0 + i * 0.58, 0.018, new THREE.MeshBasicMaterial({
    color: 0xb5d7d2, transparent: true, opacity: 0.28, depthWrite: false
  }), 11.2, 0.12 + i * 0.003, -1.2);
  r.userData.offset = i * 0.9;
  ripples.push(r);
}

function buildCampfire() {
  const g = new THREE.Group();
  g.position.set(-8, 0, 11);
  scene.add(g);
  for (let i = 0; i < 11; i++) {
    const a = i / 11 * Math.PI * 2;
    boulder(Math.cos(a) * 1.15 + g.position.x, 0, Math.sin(a) * 1.15 + g.position.z, 0.28, mat.rockDark);
  }
  const log1 = box(2.3, 0.25, 0.25, mat.trunk, 0, 0.35, 0, g);
  log1.rotation.y = 0.65;
  const log2 = box(2.3, 0.25, 0.25, mat.trunk, 0, 0.5, 0, g);
  log2.rotation.y = -0.65;
  const fire = new THREE.Group();
  g.add(fire);
  for (let i = 0; i < 7; i++) {
    const f = cone(range(0.22, 0.34), range(1.0, 1.8), mat.ember, range(-0.35, 0.35), 1.0, range(-0.3, 0.3), fire, 7);
    f.rotation.z = range(-0.35, 0.35);
    f.rotation.x = range(-0.35, 0.35);
    f.userData.phase = rand() * 5;
  }
  const light = new THREE.PointLight(0xff7130, 2.4, 10);
  light.position.set(0, 1.4, 0);
  fire.add(light);
  g.userData.fire = fire;
  return g;
}
const campfire = buildCampfire();

function buildLogPile() {
  const g = new THREE.Group();
  g.position.set(-14, 0, 17);
  scene.add(g);
  for (let i = 0; i < 7; i++) {
    const log = cyl(0.28, 0.28, 3.5, mat.trunk, (i % 2) * 0.14, 0.35 + Math.floor(i / 2) * 0.43, 0, g, 9);
    log.rotation.z = Math.PI / 2;
    log.rotation.y = i % 2 ? 0.12 : -0.12;
  }
}
buildLogPile();

function buildReeds() {
  const g = new THREE.Group();
  scene.add(g);
  for (let i = 0; i < 45; i++) {
    const x = range(-39, 40);
    const z = range(3.1, 6.0);
    const h = range(0.6, 1.6);
    makeLine([
      new THREE.Vector3(x, 0.05, z),
      new THREE.Vector3(x + range(-0.18, 0.18), h * 0.65, z + range(-0.08, 0.08)),
      new THREE.Vector3(x + range(-0.3, 0.3), h, z + range(-0.12, 0.12))
    ], mat.grassDark, g, 0.025);
  }
}
buildReeds();

const mist = new THREE.Group();
scene.add(mist);
for (let i = 0; i < 13; i++) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(1, 16, 8),
    new THREE.MeshBasicMaterial({ color: 0xe1ece7, transparent: true, opacity: range(0.045, 0.11), depthWrite: false })
  );
  m.scale.set(range(2.5, 6), range(0.18, 0.42), range(0.7, 1.4));
  m.position.set(range(-33, 33), range(0.35, 1.0), range(-1, 4));
  m.userData.phase = rand() * 10;
  m.userData.startX = m.position.x;
  mist.add(m);
}

function addBird(x, y, z) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  const wingMat = new THREE.MeshBasicMaterial({ color: 0x35494b, side: THREE.DoubleSide });
  const left = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.16), wingMat);
  const right = left.clone();
  left.position.x = -0.42;
  right.position.x = 0.42;
  left.rotation.z = 0.25;
  right.rotation.z = -0.25;
  g.add(left, right);
  scene.add(g);
}
addBird(-4, 17, -23);
addBird(3, 18, -25);
addBird(10, 16, -22);

const moonGlow = new THREE.Mesh(
  new THREE.SphereGeometry(2.8, 16, 8),
  new THREE.MeshBasicMaterial({ color: 0xd5e6df, transparent: true, opacity: 0.08 })
);
moonGlow.position.set(-25, 28, -70);
scene.add(moonGlow);

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  boat.position.y = boat.userData.origin.y + Math.sin(t * 0.9) * 0.035;
  boat.rotation.z = Math.sin(t * 0.55) * 0.018;
  boat.rotation.y = -0.3 + Math.sin(t * 0.21) * 0.025;

  ripples.forEach((r, i) => {
    const p = (t * 0.36 + r.userData.offset) % 4.6;
    const s = 0.72 + p * 0.18;
    r.scale.set(s, s, s);
    r.material.opacity = Math.max(0, 0.3 - p * 0.06);
  });

  smokePuffs.forEach((p, i) => {
    p.position.y = 9.1 + ((t * 0.48 + i * 0.78) % 3.8);
    p.position.x = p.userData.baseX + Math.sin(t * 0.75 + p.userData.phase) * (0.35 + i * 0.035);
    p.position.z = p.userData.baseZ + Math.cos(t * 0.55 + p.userData.phase) * 0.18;
    p.scale.setScalar(0.72 + 0.13 * Math.sin(t + i));
    p.material.opacity = 0.17 + 0.035 * Math.sin(t * 0.6 + i);
  });

  campfire.userData.fire.children.forEach((f, i) => {
    if (f.isMesh) {
      f.scale.y = 0.76 + 0.32 * Math.sin(t * 5 + f.userData.phase);
      f.rotation.z += Math.sin(t * 3.5 + i) * 0.002;
    }
  });
  campfire.userData.fire.children[7].intensity = 2.0 + Math.sin(t * 8) * 0.55;

  mist.children.forEach((m, i) => {
    m.position.x = m.userData.startX + Math.sin(t * 0.12 + m.userData.phase) * 2.4;
    m.position.y += Math.sin(t * 0.23 + i) * 0.0009;
    m.material.opacity = 0.06 + 0.035 * (0.5 + 0.5 * Math.sin(t * 0.3 + m.userData.phase));
  });

  waterLines.children.forEach((line, i) => {
    line.position.x += Math.sin(t * 0.1 + i) * 0.0012;
  });

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
