<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Jellyfish</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #06121b;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06121b);
scene.fog = new THREE.FogExp2(0x06121b, 0.028);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.5, 3.4, 11.5);
camera.lookAt(0, -0.3, 0);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance'
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.45, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.enablePan = false;
controls.minDistance = 7;
controls.maxDistance = 22;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.42;

const jellyfish = new THREE.Group();
jellyfish.position.y = 0.45;
scene.add(jellyfish);

const aquaGlass = new THREE.MeshPhysicalMaterial({
  color: 0xb8fff5,
  roughness: 0.08,
  metalness: 0,
  transmission: 0.96,
  thickness: 0.62,
  ior: 1.38,
  transparent: true,
  opacity: 0.82,
  attenuationColor: new THREE.Color(0x70eadb),
  attenuationDistance: 3.6,
  clearcoat: 1,
  clearcoatRoughness: 0.06,
  side: THREE.DoubleSide,
  depthWrite: false
});

const roseGlass = new THREE.MeshPhysicalMaterial({
  color: 0xffb8d2,
  roughness: 0.12,
  metalness: 0,
  transmission: 0.9,
  thickness: 0.32,
  ior: 1.34,
  transparent: true,
  opacity: 0.67,
  attenuationColor: new THREE.Color(0xff8fb9),
  attenuationDistance: 2.7,
  clearcoat: 0.8,
  clearcoatRoughness: 0.1,
  side: THREE.DoubleSide,
  depthWrite: false
});

const paleGlass = new THREE.MeshPhysicalMaterial({
  color: 0xe5ffff,
  roughness: 0.1,
  metalness: 0,
  transmission: 0.97,
  thickness: 0.2,
  ior: 1.36,
  transparent: true,
  opacity: 0.64,
  attenuationColor: new THREE.Color(0xa9fff6),
  attenuationDistance: 4,
  clearcoat: 1,
  clearcoatRoughness: 0.04,
  side: THREE.DoubleSide,
  depthWrite: false
});

const glowMaterial = new THREE.MeshBasicMaterial({
  color: 0x9ffbed,
  transparent: true,
  opacity: 0.09,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  side: THREE.DoubleSide
});

function createBellGeometry() {
  const radialSegments = 112;
  const verticalSegments = 48;
  const positions = [];
  const normals = [];
  const uvs = [];
  const indices = [];

  for (let iy = 0; iy <= verticalSegments; iy++) {
    const v = iy / verticalSegments;
    const theta = v * Math.PI * 0.5;
    const sinTheta = Math.sin(theta);
    const cosTheta = Math.cos(theta);

    for (let ix = 0; ix <= radialSegments; ix++) {
      const u = ix / radialSegments;
      const angle = u * Math.PI * 2;
      const edgeRipple = Math.pow(v, 7) * 0.055 * Math.sin(angle * 16);
      const radius = 2.4 * sinTheta * (1 + edgeRipple);
      const x = radius * Math.cos(angle);
      const z = radius * Math.sin(angle);
      const y = 1.72 * cosTheta + 0.08 * Math.pow(sinTheta, 4);

      positions.push(x, y, z);

      const nx = Math.cos(angle) * sinTheta;
      const ny = cosTheta * 1.38;
      const nz = Math.sin(angle) * sinTheta;
      const length = Math.hypot(nx, ny, nz);
      normals.push(nx / length, ny / length, nz / length);
      uvs.push(u, 1 - v);
    }
  }

  for (let iy = 0; iy < verticalSegments; iy++) {
    for (let ix = 0; ix < radialSegments; ix++) {
      const a = iy * (radialSegments + 1) + ix;
      const b = a + radialSegments + 1;
      indices.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeBoundingSphere();
  return geometry;
}

const bell = new THREE.Mesh(createBellGeometry(), aquaGlass);
bell.position.y = 1.18;
bell.castShadow = true;
bell.renderOrder = 4;
jellyfish.add(bell);

const innerBell = new THREE.Mesh(
  new THREE.SphereGeometry(1, 72, 32, 0, Math.PI * 2, 0, Math.PI * 0.47),
  roseGlass
);
innerBell.scale.set(1.94, 1.28, 1.94);
innerBell.position.y = 1.18;
innerBell.renderOrder = 3;
jellyfish.add(innerBell);

const softCore = new THREE.Mesh(
  new THREE.SphereGeometry(1, 48, 24),
  glowMaterial
);
softCore.scale.set(1.47, 0.72, 1.47);
softCore.position.y = 1.62;
softCore.renderOrder = 2;
jellyfish.add(softCore);

const underside = new THREE.Mesh(
  new THREE.CircleGeometry(2.29, 112),
  paleGlass
);
underside.rotation.x = Math.PI * 0.5;
underside.position.y = 1.18;
underside.renderOrder = 1;
jellyfish.add(underside);

const rimGroup = new THREE.Group();
rimGroup.position.y = 1.19;
jellyfish.add(rimGroup);

for (let i = 0; i < 4; i++) {
  const radius = 2.28 - i * 0.075;
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(radius, 0.026 - i * 0.003, 10, 128),
    i % 2 === 0 ? paleGlass : roseGlass
  );
  ring.rotation.x = Math.PI * 0.5;
  ring.position.y = i * 0.027 - 0.03;
  ring.renderOrder = 6;
  rimGroup.add(ring);
}

for (let i = 0; i < 16; i++) {
  const angle = i / 16 * Math.PI * 2;
  const ridgeCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.25 * Math.cos(angle), 2.82, 0.25 * Math.sin(angle)),
    new THREE.Vector3(1.02 * Math.cos(angle), 2.62, 1.02 * Math.sin(angle)),
    new THREE.Vector3(1.78 * Math.cos(angle), 2.12, 1.78 * Math.sin(angle)),
    new THREE.Vector3(2.31 * Math.cos(angle), 1.22, 2.31 * Math.sin(angle))
  ]);
  const ridge = new THREE.Mesh(
    new THREE.TubeGeometry(ridgeCurve, 30, 0.018, 6, false),
    i % 4 === 0 ? roseGlass : paleGlass
  );
  ridge.renderOrder = 7;
  jellyfish.add(ridge);
}

function makeTentacle(index, count) {
  const angle = index / count * Math.PI * 2 + 0.22;
  const startRadius = 1.28 + 0.34 * Math.sin(index * 2.17);
  const start = new THREE.Vector3(
    Math.cos(angle) * startRadius,
    1.13,
    Math.sin(angle) * startRadius
  );

  const points = [];
  const length = 4.8 + (index % 4) * 0.5;
  const curlDirection = index % 2 === 0 ? 1 : -1;

  for (let j = 0; j <= 28; j++) {
    const t = j / 28;
    const sway = Math.sin(t * Math.PI * (1.6 + (index % 3) * 0.25) + index * 0.8);
    const curl = Math.pow(t, 1.65) * curlDirection;
    const radialDrift = 0.28 * sway + 0.2 * curl;
    const x = start.x + Math.cos(angle + Math.PI * 0.5) * radialDrift
      + Math.cos(angle) * Math.sin(t * 4.4 + index) * 0.11;
    const z = start.z + Math.sin(angle + Math.PI * 0.5) * radialDrift
      + Math.sin(angle) * Math.sin(t * 4.4 + index) * 0.11;
    const y = start.y - length * t + 0.18 * Math.sin(t * Math.PI * 3 + index);
    points.push(new THREE.Vector3(x, y, z));
  }

  const curve = new THREE.CatmullRomCurve3(points);
  const geometry = new THREE.TubeGeometry(curve, 100, 0.045, 8, false);
  const mesh = new THREE.Mesh(geometry, index % 3 === 0 ? roseGlass : paleGlass);
  mesh.userData.phase = index * 0.73;
  mesh.userData.baseRotation = angle;
  mesh.renderOrder = 5;
  mesh.castShadow = true;
  return mesh;
}

const tentacles = new THREE.Group();
jellyfish.add(tentacles);

for (let i = 0; i < 13; i++) {
  tentacles.add(makeTentacle(i, 13));
}

function createRibbonGeometry(seed, width, length) {
  const segments = 70;
  const positions = [];
  const uvs = [];
  const indices = [];

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const y = 1.08 - t * length;
    const spiral = t * Math.PI * (2.3 + seed * 0.13) + seed;
    const radius = 0.24 + 0.18 * Math.sin(t * Math.PI);
    const centerX = Math.cos(spiral) * radius + Math.sin(t * 7 + seed) * 0.12;
    const centerZ = Math.sin(spiral) * radius + Math.cos(t * 6 + seed) * 0.1;
    const taper = Math.pow(1 - t, 0.45);
    const ripple = Math.sin(t * Math.PI * 10 + seed * 1.7) * 0.18;
    const localWidth = width * taper * (1 + ripple);
    const sideX = Math.cos(spiral + Math.PI * 0.5) * localWidth;
    const sideZ = Math.sin(spiral + Math.PI * 0.5) * localWidth;

    positions.push(centerX - sideX, y, centerZ - sideZ);
    positions.push(centerX + sideX, y + Math.sin(t * 12 + seed) * 0.035, centerZ + sideZ);
    uvs.push(0, t, 1, t);
  }

  for (let i = 0; i < segments; i++) {
    const a = i * 2;
    indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const oralArms = new THREE.Group();
jellyfish.add(oralArms);

for (let i = 0; i < 5; i++) {
  const arm = new THREE.Mesh(
    createRibbonGeometry(i + 1, 0.32 + i * 0.025, 3.7 + i * 0.24),
    i % 2 === 0 ? roseGlass : aquaGlass
  );
  arm.rotation.y = i / 5 * Math.PI * 2;
  arm.renderOrder = 5;
  oralArms.add(arm);

  const tipAngle = (3.7 + i * 0.24) * 0.14 + i;
  const tip = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 16, 12),
    i % 2 === 0 ? roseGlass : aquaGlass
  );
  tip.scale.set(0.75, 1.45, 0.75);
  tip.position.set(
    Math.cos(tipAngle) * 0.22,
    1.08 - (3.7 + i * 0.24),
    Math.sin(tipAngle) * 0.22
  );
  oralArms.add(tip);
}

for (let i = 0; i < 8; i++) {
  const angle = i / 8 * Math.PI * 2;
  const lobe = new THREE.Mesh(
    new THREE.SphereGeometry(0.52, 28, 18),
    i % 2 === 0 ? roseGlass : paleGlass
  );
  lobe.scale.set(1.2, 0.24, 0.62);
  lobe.position.set(Math.cos(angle) * 1.18, 1.08, Math.sin(angle) * 1.18);
  lobe.rotation.y = -angle;
  lobe.renderOrder = 4;
  jellyfish.add(lobe);
}

const floorMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x07151e,
  roughness: 0.26,
  metalness: 0.18,
  clearcoat: 0.65,
  clearcoatRoughness: 0.22
});

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(18, 96),
  floorMaterial
);
floor.rotation.x = -Math.PI * 0.5;
floor.position.y = -5.05;
floor.receiveShadow = true;
scene.add(floor);

const halo = new THREE.Mesh(
  new THREE.RingGeometry(2.2, 6.2, 96),
  new THREE.MeshBasicMaterial({
    color: 0x42d7dd,
    transparent: true,
    opacity: 0.075,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    depthWrite: false
  })
);
halo.rotation.x = -Math.PI * 0.5;
halo.position.y = -5.035;
scene.add(halo);

scene.add(new THREE.HemisphereLight(0x9beeff, 0x07101a, 1.5));

const keyLight = new THREE.DirectionalLight(0xc9ffff, 5.2);
keyLight.position.set(5, 8, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -8;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 30;
keyLight.shadow.bias = -0.0002;
scene.add(keyLight);

const roseLight = new THREE.PointLight(0xff6fae, 20, 13, 2);
roseLight.position.set(-4.3, 2.8, 3.5);
scene.add(roseLight);

const aquaLight = new THREE.PointLight(0x4effe6, 24, 14, 2);
aquaLight.position.set(4.6, 0.3, -3.2);
scene.add(aquaLight);

const topLight = new THREE.SpotLight(0xffffff, 48, 25, 0.43, 0.65, 1.4);
topLight.position.set(0, 10, 2);
topLight.target.position.set(0, 0, 0);
topLight.castShadow = true;
scene.add(topLight, topLight.target);

const lowerLight = new THREE.PointLight(0x61e9ff, 10, 10, 2);
lowerLight.position.set(0, -4.2, 1.2);
scene.add(lowerLight);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  bell.scale.y = 1 + Math.sin(elapsed * 1.15) * 0.012;
  innerBell.scale.y = 1.28 + Math.sin(elapsed * 1.15 + 0.3) * 0.018;
  rimGroup.scale.setScalar(1 + Math.sin(elapsed * 1.15) * 0.008);

  tentacles.children.forEach((tentacle, index) => {
    tentacle.rotation.y =
      Math.sin(elapsed * 0.48 + tentacle.userData.phase) * 0.035;
    tentacle.rotation.x =
      Math.sin(elapsed * 0.55 + index * 0.47) * 0.012;
  });

  oralArms.rotation.y = Math.sin(elapsed * 0.24) * 0.055;
  oralArms.rotation.z = Math.sin(elapsed * 0.37) * 0.012;
  jellyfish.position.y = 0.45 + Math.sin(elapsed * 0.56) * 0.11;
  jellyfish.rotation.z = Math.sin(elapsed * 0.31) * 0.025;

  roseLight.position.x = Math.cos(elapsed * 0.22) * 4.4;
  roseLight.position.z = Math.sin(elapsed * 0.22) * 4.4;
  aquaLight.position.x = Math.cos(elapsed * 0.18 + Math.PI) * 4.8;
  aquaLight.position.z = Math.sin(elapsed * 0.18 + Math.PI) * 4.8;

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

animate();
</script>
</body>
</html>
