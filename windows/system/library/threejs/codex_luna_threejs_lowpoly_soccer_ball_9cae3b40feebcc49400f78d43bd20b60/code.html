<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low-Poly Soccer Ball</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090b10;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090b10);
    scene.fog = new THREE.Fog(0x090b10, 8, 18);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0.35, 6.7);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.85;
    controls.enablePan = false;
    controls.minDistance = 4.1;
    controls.maxDistance = 10;
    controls.target.set(0, 0, 0);

    const hemisphereLight = new THREE.HemisphereLight(
      0xb8c9e8,
      0x11141b,
      1.8
    );
    scene.add(hemisphereLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 3.4);
    keyLight.position.set(-4.5, 6.5, 5.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 18;
    keyLight.shadow.camera.left = -5;
    keyLight.shadow.camera.right = 5;
    keyLight.shadow.camera.top = 5;
    keyLight.shadow.camera.bottom = -5;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x7892c8, 1.25);
    fillLight.position.set(5, 1.5, -4);
    scene.add(fillLight);

    const rimLight = new THREE.PointLight(0x9db5e8, 18, 12, 2);
    rimLight.position.set(-2.5, 3.2, -4.5);
    scene.add(rimLight);

    const phi = (1 + Math.sqrt(5)) / 2;
    const scale = 1.34;

    const vertexData = [
      [-1, phi, 0],
      [1, phi, 0],
      [-1, -phi, 0],
      [1, -phi, 0],
      [0, -1, phi],
      [0, 1, phi],
      [0, -1, -phi],
      [0, 1, -phi],
      [phi, 0, -1],
      [phi, 0, 1],
      [-phi, 0, -1],
      [-phi, 0, 1]
    ];

    const vertices = vertexData.map((value) =>
      new THREE.Vector3(value[0], value[1], value[2]).multiplyScalar(scale)
    );

    const faces = [
      [0, 11, 5],
      [0, 5, 1],
      [0, 1, 7],
      [0, 7, 10],
      [0, 10, 11],
      [1, 5, 9],
      [5, 11, 4],
      [11, 10, 2],
      [10, 7, 6],
      [7, 1, 8],
      [3, 9, 4],
      [3, 4, 2],
      [3, 2, 6],
      [3, 6, 8],
      [3, 8, 9],
      [4, 9, 5],
      [2, 4, 11],
      [6, 2, 10],
      [8, 6, 7],
      [9, 8, 1]
    ];

    const blackMaterial = new THREE.MeshStandardMaterial({
      color: 0x080a0d,
      roughness: 1,
      metalness: 0,
      flatShading: true
    });

    const whiteMaterial = new THREE.MeshStandardMaterial({
      color: 0xe8e7df,
      roughness: 1,
      metalness: 0,
      flatShading: true
    });

    const ball = new THREE.Group();
    ball.rotation.set(0.16, -0.24, 0.05);
    scene.add(ball);

    function orientOutward(points) {
      const edgeA = new THREE.Vector3().subVectors(points[1], points[0]);
      const edgeB = new THREE.Vector3().subVectors(points[2], points[0]);
      const normal = new THREE.Vector3().crossVectors(edgeA, edgeB);
      if (normal.dot(points[0]) < 0) {
        points.reverse();
      }
      return points;
    }

    function createPanel(points, material) {
      const positions = [];
      const indices = [];

      for (const point of points) {
        positions.push(point.x, point.y, point.z);
      }

      for (let index = 1; index < points.length - 1; index += 1) {
        indices.push(0, index, index + 1);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3)
      );
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      geometry.computeBoundingSphere();

      const mesh = new THREE.Mesh(geometry, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      ball.add(mesh);
    }

    const edgePoint = (from, to, amount) =>
      from.clone().lerp(to, amount);

    for (const face of faces) {
      const a = vertices[face[0]];
      const b = vertices[face[1]];
      const c = vertices[face[2]];

      const hexagon = [
        edgePoint(a, b, 1 / 3),
        edgePoint(b, a, 1 / 3),
        edgePoint(b, c, 1 / 3),
        edgePoint(c, b, 1 / 3),
        edgePoint(c, a, 1 / 3),
        edgePoint(a, c, 1 / 3)
      ];

      createPanel(orientOutward(hexagon), whiteMaterial);
    }

    for (let vertexIndex = 0; vertexIndex < vertices.length; vertexIndex += 1) {
      const vertex = vertices[vertexIndex];
      const neighborSet = new Set();

      for (const face of faces) {
        if (face.includes(vertexIndex)) {
          for (const index of face) {
            if (index !== vertexIndex) {
              neighborSet.add(index);
            }
          }
        }
      }

      const normal = vertex.clone().normalize();
      const reference = Math.abs(normal.y) < 0.9
        ? new THREE.Vector3(0, 1, 0)
        : new THREE.Vector3(1, 0, 0);
      const axisA = new THREE.Vector3()
        .crossVectors(reference, normal)
        .normalize();
      const axisB = new THREE.Vector3()
        .crossVectors(normal, axisA)
        .normalize();

      const pentagon = Array.from(neighborSet)
        .map((neighborIndex) => {
          const point = edgePoint(vertex, vertices[neighborIndex], 1 / 3);
          const angle = Math.atan2(
            point.dot(axisB),
            point.dot(axisA)
          );
          return { point, angle };
        })
        .sort((first, second) => first.angle - second.angle)
        .map((entry) => entry.point);

      createPanel(orientOutward(pentagon), blackMaterial);
    }

    const clock = new THREE.Clock();

    function render() {
      const elapsed = clock.getElapsedTime();
      ball.position.y = Math.sin(elapsed * 1.15) * 0.045;
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(render);
    }

    function handleResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", handleResize);
    render();
  </script>
</body>
</html>
