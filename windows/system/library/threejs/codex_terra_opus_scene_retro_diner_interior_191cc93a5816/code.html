<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1950s Retro Diner</title>
<style>
  html,body{margin:0;overflow:hidden;background:#080a12}
  canvas{display:block}
  #label{position:fixed;left:18px;bottom:15px;color:#ffe7ef;font:600 12px/1.2 Arial,sans-serif;letter-spacing:.22em;text-shadow:0 0 12px #ff2f88;pointer-events:none;opacity:.82}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">STARLITE DINER · OPEN ALL NIGHT</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07101a);
scene.fog = new THREE.FogExp2(0x111625, 0.026);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 120);
camera.position.set(15, 10, 18);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;
controls.minDistance = 8;
controls.maxDistance = 34;
controls.maxPolarAngle = Math.PI * 0.49;

let seed = 19560214;
const rand = () => {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
};

const clock = new THREE.Clock();
const animated = [];
const chrome = new THREE.MeshStandardMaterial({ color:0xc9d5df, metalness:0.95, roughness:0.16 });
const darkChrome = new THREE.MeshStandardMaterial({ color:0x26313d, metalness:0.9, roughness:0.19 });
const redVinyl = new THREE.MeshStandardMaterial({ color:0x9d1026, roughness:0.32, metalness:0.08 });
const redTrim = new THREE.MeshStandardMaterial({ color:0xef2947, metalness:0.28, roughness:0.2 });
const cream = new THREE.MeshStandardMaterial({ color:0xffe5ad, roughness:0.68 });
const creamGloss = new THREE.MeshStandardMaterial({ color:0xffe2a2, roughness:0.24, metalness:0.05 });
const black = new THREE.MeshStandardMaterial({ color:0x101318, roughness:0.38, metalness:0.2 });
const glass = new THREE.MeshPhysicalMaterial({ color:0xbddfff, transparent:true, opacity:0.22, roughness:0.05, metalness:0.05, transmission:0.18, side:THREE.DoubleSide });
const pieGold = new THREE.MeshStandardMaterial({ color:0xe88c36, roughness:0.72 });
const burgerBun = new THREE.MeshStandardMaterial({ color:0xd89039, roughness:0.72 });
const lettuce = new THREE.MeshStandardMaterial({ color:0x55a740, roughness:0.8 });
const patty = new THREE.MeshStandardMaterial({ color:0x47281d, roughness:0.9 });

function mat(color, rough=0.55, metal=0) {
  return new THREE.MeshStandardMaterial({ color, roughness:rough, metalness:metal });
}
function mesh(g, m, p, r, s, parent=scene) {
  const o = new THREE.Mesh(g, m);
  if (p) o.position.set(...p);
  if (r) o.rotation.set(...r);
  if (s) o.scale.set(...s);
  o.castShadow = true;
  o.receiveShadow = true;
  parent.add(o);
  return o;
}
function box(x,y,z,m,p,r) { return mesh(new THREE.BoxGeometry(x,y,z),m,p,r); }
function cyl(rt,rb,h,m,p,r) { return mesh(new THREE.CylinderGeometry(rt,rb,h,32),m,p,r); }
function sphere(r,m,p,s) { return mesh(new THREE.SphereGeometry(r,32,20),m,p,null,s); }
function roundedBox(w,h,d,rad,m,p) {
  const shape = new THREE.Shape();
  const x=-w/2, y=-h/2;
  shape.moveTo(x+rad,y); shape.lineTo(x+w-rad,y); shape.quadraticCurveTo(x+w,y,x+w,y+rad);
  shape.lineTo(x+w,y+h-rad); shape.quadraticCurveTo(x+w,y+h,x+w-rad,y+h);
  shape.lineTo(x+rad,y+h); shape.quadraticCurveTo(x,y+h,x,y+h-rad);
  shape.lineTo(x,y+rad); shape.quadraticCurveTo(x,y,x+rad,y);
  const g = new THREE.ExtrudeGeometry(shape,{depth:d,bevelEnabled:true,bevelThickness:.09,bevelSize:.08,bevelSegments:3});
  g.center();
  return mesh(g,m,p);
}
function torus(R,t,m,p,r) { return mesh(new THREE.TorusGeometry(R,t,12,48),m,p,r); }

function canvasTexture(draw, w=512, h=512) {
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  draw(c.getContext("2d"),w,h);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}
const wallTex=canvasTexture((ctx,w,h)=>{
  ctx.fillStyle="#172132";ctx.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=36){ctx.fillStyle=y%72?"#26354a":"#31445a";ctx.fillRect(0,y,w,34)}
  ctx.strokeStyle="rgba(9,13,24,.55)";ctx.lineWidth=3;
  for(let y=0;y<h;y+=36){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
  for(let y=0;y<h;y+=72)for(let x=(y/72)%2?18:0;x<w;x+=72){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+36);ctx.stroke()}
},512,384);
wallTex.repeat.set(4,2);
const wallMat=new THREE.MeshStandardMaterial({map:wallTex,roughness:.82});

const floorTex=canvasTexture((ctx,w,h)=>{
  const n=8, q=w/n;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    ctx.fillStyle=(x+y)%2 ? "#eee1bd" : "#163044";
    ctx.fillRect(x*q,y*q,q,q);
    ctx.strokeStyle="rgba(40,30,25,.25)";ctx.lineWidth=3;ctx.strokeRect(x*q,y*q,q,q);
  }
},512,512);
floorTex.repeat.set(6,6);
const floorMat=new THREE.MeshStandardMaterial({map:floorTex,roughness:.38,metalness:.03});

mesh(new THREE.PlaneGeometry(32,25),floorMat,[0,0,0],[-Math.PI/2,0,0]);
box(31,10,.35,wallMat,[0,5,-10.5]);
box(.35,10,22,wallMat,[-15.5,5,.5]);
box(.35,10,22,wallMat,[15.5,5,.5]);
box(31,.25,22,mat(0x111925,.82),[0,10,0]);

const stripeMat=new THREE.MeshStandardMaterial({color:0xd12742,roughness:.3,metalness:.12});
box(31,.46,.12,stripeMat,[0,6.85,-10.27]);
box(31,.15,.18,creamGloss,[0,6.48,-10.22]);
box(31,.15,.18,creamGloss,[0,7.27,-10.22]);

function addWindow(x,z,w,h) {
  const g=new THREE.Group(); scene.add(g);
  box(w+.35,h+.35,.18,darkChrome,[x,h/2+2,z]);
  const skyMat=new THREE.MeshBasicMaterial({color:0x102a46});
  const pane=mesh(new THREE.PlaneGeometry(w,h),skyMat,[x,h/2+2,z+.11]);
  g.add(pane);
  for(let i=0;i<12;i++){
    const sx=x-w/2+rand()*w, sy=2+rand()*h;
    sphere(.02, new THREE.MeshBasicMaterial({color:0xe8f4ff}),[sx,sy,z+.13]);
  }
  box(.10,h,.18,chrome,[x,h/2+2,z-.02]);
  box(w,.10,.18,chrome,[x,2+h/2,z-.02]);
  return g;
}
addWindow(-8,-10.15,7.2,4.2);
addWindow(7.5,-10.15,6.4,4.2);

function neonText(text, color, pos, size=0.7) {
  const c=document.createElement("canvas"); c.width=1024; c.height=256;
  const ctx=c.getContext("2d");
  ctx.clearRect(0,0,c.width,c.height);
  ctx.font=`italic 900 ${142}px Arial`;
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.shadowColor=color;ctx.shadowBlur=30;ctx.fillStyle=color;
  ctx.fillText(text,512,133);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const material=new THREE.MeshBasicMaterial({map:t,transparent:true,depthWrite:false,side:THREE.DoubleSide});
  const o=mesh(new THREE.PlaneGeometry(size*4.4,size),material,pos);
  o.renderOrder=3;
  const light=new THREE.PointLight(color,2.5,7,2);
  light.position.set(pos[0],pos[1],pos[2]+1.2);scene.add(light);
  return o;
}
neonText("EAT",0xff3c8d,[-8.1,5.55,-9.98],.78);
neonText("OPEN",0x31e7ff,[7.3,5.55,-9.98],.62);

function booth(x,z,flip=false) {
  const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);
  const side=flip?-1:1;
  roundedBox(4.6,1.35,.42,.22,redVinyl,[0,1.05,-1.08*side]).parent.remove(roundedBox);
  const back=roundedBox(4.6,1.35,.42,.22,redVinyl,[0,1.05,-1.08*side]);
  back.rotation.x=0.05*side;
  box(4.78,.12,.12,chrome,[0,1.7,-1.29*side]);
  for(const xx of [-2.05,2.05]) {
    box(.32,.82,2.15,redVinyl,[xx,.48,0]);
    box(.10,.92,2.28,chrome,[xx*1.03,.55,0]);
  }
  const seat=roundedBox(3.9,.32,1.62,.17,redVinyl,[0,.73,-.08*side]);
  box(3.98,.1,1.70,chrome,[0,.55,-.08*side]);
  const tableTop=roundedBox(3.25,.15,1.35,.18,creamGloss,[0,1.65,.2*side]);
  box(3.3,.08,1.4,chrome,[0,1.57,.2*side]);
  cyl(.12,.2,1.5,chrome,[0,.8,.2*side]);
  cyl(.65,.65,.08,darkChrome,[0,.08,.2*side]);
  g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
}
booth(-8,-3.7,false);
booth(-8,2.3,false);
booth(7,-3.7,true);

function counter() {
  const g=new THREE.Group();scene.add(g);
  box(12.6,1.2,2.55,mat(0x7d1428,.37,.12),[6.8,1.15,5.8]);
  box(12.95,.18,2.85,creamGloss,[6.8,1.84,5.8]);
  box(13.15,.13,3.03,chrome,[6.8,1.92,5.8]);
  box(12.8,.14,.18,redTrim,[6.8,.72,4.49]);
  for(let x=.75;x<13;x+=1.7) {
    box(.13,1.12,.1,chrome,[x,1.15,4.44]);
    box(.13,1.12,.1,chrome,[x,1.15,7.16]);
  }
  box(12.9,.7,.12,black,[6.8,2.65,7.1]);
  box(12.8,.17,.2,chrome,[6.8,2.94,7.1]);
  for(let x=1.2;x<13;x+=2.7) {
    const shelf=box(1.48,.09,.34,creamGloss,[x,2.55,6.92]);
    for(let j=0;j<3;j++) cyl(.09,.09,.7,glass,[x-.43+j*.42,2.94,6.92]);
  }
}
counter();

function stool(x,z) {
  const g=new THREE.Group();scene.add(g);
  cyl(.34,.48,.10,darkChrome,[x,.08,z]);
  cyl(.07,.10,1.23,chrome,[x,.7,z]);
  cyl(.48,.55,.16,redVinyl,[x,1.3,z]);
  torus(.49,.055,chrome,[x,1.30,z]);
  const ring=torus(.34,.035,chrome,[x,.59,z],[Math.PI/2,0,0]);
  g.add(ring);
  animated.push({type:"stool",object:g,phase:rand()*6.28});
}
for(let i=0;i<6;i++) stool(1.3+i*2.15,3.75);

function jukebox(x,z) {
  const g=new THREE.Group();scene.add(g);
  const outer=roundedBox(2.2,3.8,.72,.65,redTrim,[x,2,z]);
  const arch=torus(.76,.14,chrome,[x,3.16,z-.42],[0,0,0]);
  arch.scale.y=1.34;
  const inner=roundedBox(1.5,2.5,.22,.4,new THREE.MeshStandardMaterial({color:0x172843,emissive:0x102040,emissiveIntensity:1}),[x,2.05,z-.45]);
  const grille=mesh(new THREE.CylinderGeometry(.48,.48,.08,32),pieGold,[x,1.25,z-.58],[Math.PI/2,0,0]);
  for(let i=0;i<9;i++) {
    const a=i/9*Math.PI*2;
    sphere(.055,new THREE.MeshStandardMaterial({color:0xffb047,emissive:0x7f2f00,emissiveIntensity:1}),[x+Math.cos(a)*.31,1.25+Math.sin(a)*.31,z-.64]);
  }
  for(let y=1.8;y<3.25;y+=.38) box(1.08,.06,.08,chrome,[x,y,z-.60]);
  const glow=new THREE.PointLight(0xff376f,2.8,7,2);
  glow.position.set(x,2.1,z-1.2);scene.add(glow);
  animated.push({type:"juke",object:inner,light:glow,phase:0});
}
jukebox(-12.1,6.1);

function pieCase(x,z) {
  const g=new THREE.Group();scene.add(g);
  box(3.45,.18,1.75,chrome,[x,1.55,z]);
  box(3.2,.92,1.55,glass,[x,2.08,z]);
  box(3.48,.10,1.8,chrome,[x,2.56,z]);
  for(const xx of [-1.48,1.48]) for(const zz of [-.75,.75]) cyl(.05,.05,1.05,chrome,[x+xx,2.05,z+zz]);
  for(let level=0;level<2;level++) {
    box(2.95,.06,1.35,creamGloss,[x,1.75+level*.57,z]);
    for(let i=0;i<3;i++) {
      const pie=cyl(.31,.31,.12,pieGold,[x-.85+i*.85,1.87+level*.57,z]);
      mesh(new THREE.TorusGeometry(.22,.035,8,20),creamGloss,[x-.85+i*.85,1.95+level*.57,z],[Math.PI/2,0,0]);
    }
  }
  const l=new THREE.PointLight(0xffd485,1.5,5,2);l.position.set(x,2.4,z+1);scene.add(l);
}
pieCase(-3.4,7.15);

function milkshake(x,z) {
  cyl(.16,.22,.62,glass,[x,2.27,z]);
  cyl(.22,.16,.07,chrome,[x,1.92,z]);
  cyl(.18,.18,.10,chrome,[x,2.60,z]);
  sphere(.17,new THREE.MeshStandardMaterial({color:0xffb9cc,roughness:.45}),[x,2.60,z]);
  cyl(.025,.025,.8,mat(0xfae5e1,.4),[x+.1,2.92,z],[0,0,-.25]);
}
function burger(x,z) {
  cyl(.48,.48,.08,creamGloss,[x,2.0,z]);
  cyl(.31,.37,.16,burgerBun,[x,2.09,z]);
  cyl(.39,.39,.09,lettuce,[x,2.23,z]);
  cyl(.34,.34,.13,patty,[x,2.31,z]);
  sphere(.36,burgerBun,[x,2.47,z],[1,0.58,1]);
  for(let i=0;i<9;i++) sphere(.016,creamGloss,[x+(rand()-.5)*.34,2.67,z+(rand()-.5)*.25]);
}
milkshake(8.4,5.45);
burger(6.85,5.45);

function fan(x,z) {
  const g=new THREE.Group();scene.add(g);
  cyl(.09,.09,1.05,darkChrome,[x,9.1,z]);
  const hub=sphere(.16,chrome,[x,8.55,z]);
  const blades=new THREE.Group();blades.position.set(x,8.55,z);scene.add(blades);
  for(let i=0;i<4;i++) {
    const b=mesh(new THREE.BoxGeometry(.18,.035,1.4),darkChrome,[0,0,.74],[0,i*Math.PI/2,.18]);
    blades.add(b);
  }
  animated.push({type:"fan",object:blades,phase:rand()*4});
}
fan(-4,-1.8);
fan(7,-1.4);

function pendant(x,z) {
  cyl(.025,.025,1.25,black,[x,8.9,z]);
  const shade=mesh(new THREE.ConeGeometry(.42,.18,32,1,true),redTrim,[x,8.2,z],[Math.PI,0,0]);
  const bulb=new THREE.PointLight(0xffc879,1.2,6,2);
  bulb.position.set(x,8.03,z);scene.add(bulb);
}
for(let x=-11;x<=12;x+=4.6) pendant(x,-1);

function wallPoster(x,y,text,c1,c2) {
  const c=document.createElement("canvas");c.width=512;c.height=720;const ctx=c.getContext("2d");
  ctx.fillStyle=c1;ctx.fillRect(0,0,512,720);
  ctx.fillStyle=c2;ctx.beginPath();ctx.arc(256,265,165,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff3cd";ctx.font="900 70px Arial";ctx.textAlign="center";ctx.fillText(text,256,555);
  ctx.font="bold 31px Arial";ctx.fillText("THE REAL AMERICAN TASTE",256,605);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  box(2.02,2.82,.08,chrome,[x,y,-10.13]);
  mesh(new THREE.PlaneGeometry(1.82,2.62),new THREE.MeshBasicMaterial({map:t}),[x,y,-10.19]);
}
wallPoster(-1.3,4.2,"COLA",0x163d65,0xe43e41);
wallPoster(12.2,4.2,"PIE!",0xe53b50,0xffc64a);

function plants() {
  const potMat=mat(0xd95135,.52);
  for(const [x,z] of [[-13,8.4],[13,8.0]]) {
    cyl(.38,.29,.65,potMat,[x,.34,z]);
    for(let i=0;i<9;i++) {
      const a=i/9*Math.PI*2;
      const leaf=mesh(new THREE.SphereGeometry(.23,12,8),mat(0x245d38,.75),[x+Math.cos(a)*.28,.86+rand()*.28,z+Math.sin(a)*.28],[rand(),a,rand()]);
      leaf.scale.set(.55,1.7,.38);
    }
  }
}
plants();

const signGlow=new THREE.PointLight(0xff287c,4.2,11,2);
signGlow.position.set(-8,5,-7.4);scene.add(signGlow);
const cyanGlow=new THREE.PointLight(0x20ddec,3.4,10,2);
cyanGlow.position.set(7.5,5,-7.4);scene.add(cyanGlow);

const hemi=new THREE.HemisphereLight(0x6aa9d5,0x351628,1.55);
scene.add(hemi);
const key=new THREE.SpotLight(0xffdec0,110,36,Math.PI*.3,.38,1.5);
key.position.set(1,9,5);key.target.position.set(0,0,0);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);key.shadow.bias=-.0002;scene.add(key,key.target);
const rim=new THREE.PointLight(0x396bff,25,25,2);
rim.position.set(-10,6,5);scene.add(rim);
const fill=new THREE.PointLight(0xff466a,18,20,2);
fill.position.set(9,4,-5);scene.add(fill);

for(let i=0;i<22;i++) {
  const dust=mesh(new THREE.SphereGeometry(.015,6,5),new THREE.MeshBasicMaterial({color:0xffe9c7,transparent:true,opacity:.35}),[
    (rand()-.5)*27,1+rand()*8,(rand()-.5)*18
  ]);
  animated.push({type:"dust",object:dust,phase:rand()*6.28,baseY:dust.position.y});
}

const ceilingBands = new THREE.Group();scene.add(ceilingBands);
for(let z=-8;z<10;z+=4) {
  const band=box(30,.08,.18,chrome,[0,9.88,z]);
  ceilingBands.add(band);
}

function animate() {
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  for(const a of animated) {
    if(a.type==="fan") a.object.rotation.y=t*1.35+a.phase;
    if(a.type==="stool") a.object.rotation.y=Math.sin(t*.42+a.phase)*.035;
    if(a.type==="juke") {
      a.object.material.emissiveIntensity=1.25+Math.sin(t*2.5)*.45;
      a.light.intensity=2.35+Math.sin(t*2.5)*.7;
    }
    if(a.type==="dust") {
      a.object.position.y=a.baseY+Math.sin(t*.42+a.phase)*.12;
      a.object.position.x+=Math.sin(t*.21+a.phase)*.0008;
    }
  }
  signGlow.intensity=3.7+Math.sin(t*3.1)*.5;
  controls.update();
  renderer.render(scene,camera);
}
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
animate();
</script>
</body>
</html>
