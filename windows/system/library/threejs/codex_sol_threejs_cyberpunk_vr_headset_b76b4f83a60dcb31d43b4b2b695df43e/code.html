<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk VR Headset</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020309;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 18px;
      bottom: 16px;
      color: rgba(122, 244, 255, 0.65);
      font: 10px/1.4 monospace;
      letter-spacing: 0.24em;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">NEURAL OPTICS // MK-IV</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020309);
    scene.fog = new THREE.FogExp2(0x020309, 0.045);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(6.7, 3.6, 8.8);
    camera.lookAt(0, 1.45, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.45, -0.2);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;
    controls.minDistance = 5.5;
    controls.maxDistance = 14;
    controls.maxPolarAngle = Math.PI * 0.72;

    const hemi = new THREE.HemisphereLight(0x6abfff, 0x120516, 1.15);
    scene.add(hemi);

    const key = new THREE.SpotLight(0x8deaff, 75, 24, Math.PI / 5, 0.55, 1.3);
    key.position.set(-5, 8, 7);
    key.target.position.set(0, 1.2, 0);
    key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024);
    scene.add(key, key.target);

    const magentaLight = new THREE.PointLight(0xff168f, 28, 10, 2);
    magentaLight.position.set(4.2, 2.4, 3.5);
    scene.add(magentaLight);

    const cyanLight = new THREE.PointLight(0x00d9ff, 22, 9, 2);
    cyanLight.position.set(-4.2, 1.1, 2.6);
    scene.add(cyanLight);

    const rearLight = new THREE.DirectionalLight(0x7850ff, 2.8);
    rearLight.position.set(1, 5, -6);
    scene.add(rearLight);

    const matte = new THREE.MeshStandardMaterial({
      color: 0x090b11,
      roughness: 0.66,
      metalness: 0.62
    });

    const armor = new THREE.MeshStandardMaterial({
      color: 0x141823,
      roughness: 0.36,
      metalness: 0.82
    });

    const rubber = new THREE.MeshStandardMaterial({
      color: 0x050609,
      roughness: 0.93,
      metalness: 0.08
    });

    const metal = new THREE.MeshStandardMaterial({
      color: 0x333945,
      roughness: 0.28,
      metalness: 0.95
    });

    const cyanGlow = new THREE.MeshStandardMaterial({
      color: 0x00bcd8,
      emissive: 0x00e5ff,
      emissiveIntensity: 5.2,
      roughness: 0.2,
      metalness: 0.15
    });

    const magentaGlow = new THREE.MeshStandardMaterial({
      color: 0xd00067,
      emissive: 0xff008c,
      emissiveIntensity: 5.8,
      roughness: 0.2,
      metalness: 0.15
    });

    function shapeFrom(points) {
      const shape = new THREE.Shape();
      shape.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
      shape.closePath();
      return shape;
    }

    function plate(points, depth, material, bevel = 0.06) {
      const geometry = new THREE.ExtrudeGeometry(shapeFrom(points), {
        depth,
        bevelEnabled: bevel > 0,
        bevelSegments: 3,
        steps: 1,
        bevelSize: bevel,
        bevelThickness: bevel
      });
      geometry.translate(0, 0, -depth * 0.5);
      geometry.computeVertexNormals();
      const mesh = new THREE.Mesh(geometry, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function cylinderBetween(a, b, radius, material, radialSegments = 8) {
      const direction = new THREE.Vector3().subVectors(b, a);
      const length = direction.length();
      const geometry = new THREE.CylinderGeometry(radius, radius, length, radialSegments);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      mesh.castShadow = true;
      return mesh;
    }

    function box(width, height, depth, material, x, y, z, rx = 0, ry = 0, rz = 0) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
      mesh.position.set(x, y, z);
      mesh.rotation.set(rx, ry, rz);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    const headset = new THREE.Group();
    headset.position.y = 1.55;
    scene.add(headset);

    const housingOutline = [
      [-2.35, 0.62], [-2.12, 1.02], [-1.35, 1.18], [-0.48, 1.25],
      [0.48, 1.25], [1.35, 1.18], [2.12, 1.02], [2.35, 0.62],
      [2.28, -0.53], [1.83, -0.92], [0.72, -1.05], [0.32, -0.82],
      [-0.32, -0.82], [-0.72, -1.05], [-1.83, -0.92], [-2.28, -0.53]
    ];

    const housing = plate(housingOutline, 0.72, matte, 0.09);
    housing.position.z = 0;
    headset.add(housing);

    const rearCushion = plate([
      [-2.15, 0.72], [-1.88, 0.98], [-0.8, 1.12], [0.8, 1.12],
      [1.88, 0.98], [2.15, 0.72], [2.06, -0.54], [1.55, -0.83],
      [0.6, -0.94], [0.28, -0.69], [-0.28, -0.69], [-0.6, -0.94],
      [-1.55, -0.83], [-2.06, -0.54]
    ], 0.26, rubber, 0.08);
    rearCushion.position.z = -0.47;
    headset.add(rearCushion);

    const lensOutline = [
      [-2.02, 0.62], [-1.72, 0.88], [-0.75, 1.00], [0, 0.94],
      [0.75, 1.00], [1.72, 0.88], [2.02, 0.62], [1.94, -0.42],
      [1.56, -0.68], [0.57, -0.78], [0.24, -0.56], [-0.24, -0.56],
      [-0.57, -0.78], [-1.56, -0.68], [-1.94, -0.42]
    ];

    const lensMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x071925,
      emissive: 0x001b28,
      emissiveIntensity: 1.2,
      metalness: 0.78,
      roughness: 0.12,
      clearcoat: 1,
      clearcoatRoughness: 0.07,
      reflectivity: 1,
      transparent: true,
      opacity: 0.9
    });

    const lens = plate(lensOutline, 0.1, lensMaterial, 0.035);
    lens.position.z = 0.405;
    headset.add(lens);

    const upperLeftPanel = plate([
      [-2.13, 0.72], [-1.82, 1.02], [-0.58, 1.16],
      [-0.2, 0.94], [-0.9, 0.72], [-1.78, 0.58]
    ], 0.15, armor, 0.025);
    upperLeftPanel.position.z = 0.39;
    headset.add(upperLeftPanel);

    const upperRightPanel = plate([
      [2.13, 0.72], [1.82, 1.02], [0.58, 1.16],
      [0.2, 0.94], [0.9, 0.72], [1.78, 0.58]
    ], 0.15, armor, 0.025);
    upperRightPanel.position.z = 0.39;
    headset.add(upperRightPanel);

    const lowerLeftPanel = plate([
      [-2.18, -0.38], [-1.82, -0.78], [-0.72, -0.93],
      [-0.42, -0.72], [-0.78, -0.55], [-1.76, -0.47]
    ], 0.14, armor, 0.025);
    lowerLeftPanel.position.z = 0.39;
    headset.add(lowerLeftPanel);

    const lowerRightPanel = plate([
      [2.18, -0.38], [1.82, -0.78], [0.72, -0.93],
      [0.42, -0.72], [0.78, -0.55], [1.76, -0.47]
    ], 0.14, armor, 0.025);
    lowerRightPanel.position.z = 0.39;
    headset.add(lowerRightPanel);

    const bridge = plate([
      [-0.35, 1.08], [0, 0.89], [0.35, 1.08],
      [0.28, 1.28], [-0.28, 1.28]
    ], 0.22, metal, 0.025);
    bridge.position.z = 0.43;
    headset.add(bridge);

    const edgePoints = lensOutline.map(p => new THREE.Vector3(p[0], p[1], 0.49));
    for (let i = 0; i < edgePoints.length; i++) {
      const next = (i + 1) % edgePoints.length;
      const mat = i < 5 || i > 12 ? cyanGlow : magentaGlow;
      const strip = cylinderBetween(edgePoints[i], edgePoints[next], 0.022, mat, 7);
      headset.add(strip);
    }

    const sideLeft = plate([
      [-0.42, 0.67], [0.24, 0.82], [0.44, 0.43],
      [0.35, -0.5], [-0.28, -0.58], [-0.48, -0.25]
    ], 0.42, armor, 0.04);
    sideLeft.rotation.y = Math.PI * 0.5;
    sideLeft.position.set(-2.33, 0.04, -0.08);
    headset.add(sideLeft);

    const sideRight = sideLeft.clone();
    sideRight.rotation.y = -Math.PI * 0.5;
    sideRight.position.x = 2.33;
    headset.add(sideRight);

    const hingeGeometry = new THREE.CylinderGeometry(0.31, 0.31, 0.18, 16);
    const leftHinge = new THREE.Mesh(hingeGeometry, metal);
    leftHinge.rotation.z = Math.PI * 0.5;
    leftHinge.position.set(-2.48, 0.08, -0.12);
    leftHinge.castShadow = true;
    headset.add(leftHinge);

    const rightHinge = leftHinge.clone();
    rightHinge.position.x = 2.48;
    headset.add(rightHinge);

    for (const side of [-1, 1]) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.22, 0.025, 8, 24),
        side < 0 ? cyanGlow : magentaGlow
      );
      ring.position.set(side * 2.58, 0.08, -0.12);
      ring.rotation.y = Math.PI * 0.5;
      headset.add(ring);

      const arm = box(0.24, 0.34, 1.42, armor, side * 2.42, 0.27, -0.92, 0, side * 0.05, 0);
      headset.add(arm);
    }

    const bandCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-2.42, 0.38, -1.35),
      new THREE.Vector3(-2.32, 0.78, -2.12),
      new THREE.Vector3(-1.55, 1.18, -2.72),
      new THREE.Vector3(0, 1.34, -2.98),
      new THREE.Vector3(1.55, 1.18, -2.72),
      new THREE.Vector3(2.32, 0.78, -2.12),
      new THREE.Vector3(2.42, 0.38, -1.35)
    ]);

    const band = new THREE.Mesh(
      new THREE.TubeGeometry(bandCurve, 72, 0.19, 10, false),
      rubber
    );
    band.castShadow = true;
    headset.add(band);

    const bandRailCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-2.34, 0.54, -1.5),
      new THREE.Vector3(-1.4, 1.12, -2.62),
      new THREE.Vector3(0, 1.31, -2.87),
      new THREE.Vector3(1.4, 1.12, -2.62),
      new THREE.Vector3(2.34, 0.54, -1.5)
    ]);
    const bandRail = new THREE.Mesh(
      new THREE.TubeGeometry(bandRailCurve, 60, 0.025, 7, false),
      cyanGlow
    );
    headset.add(bandRail);

    const cableMaterials = [magentaGlow, cyanGlow, metal];
    for (let i = 0; i < 3; i++) {
      const side = i === 1 ? -1 : 1;
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(side * (2.29 + i * 0.035), -0.18 + i * 0.08, -0.22),
        new THREE.Vector3(side * (2.68 + i * 0.04), -0.16 + i * 0.08, -0.62),
        new THREE.Vector3(side * (2.64 + i * 0.04), 0.03 + i * 0.08, -1.12),
        new THREE.Vector3(side * (2.43 + i * 0.03), 0.24 + i * 0.08, -1.52)
      ]);
      const cable = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 30, i === 2 ? 0.035 : 0.023, 7, false),
        cableMaterials[i]
      );
      cable.castShadow = true;
      headset.add(cable);
    }

    for (const side of [-1, 1]) {
      const clip = box(0.12, 0.38, 0.18, metal, side * 2.57, 0.06, -0.92, 0, 0, side * 0.12);
      headset.add(clip);
    }

    for (let i = -4; i <= 4; i++) {
      if (i === 0) continue;
      const vent = box(0.19, 0.035, 0.08, metal, i * 0.22, 1.235 - Math.abs(i) * 0.012, 0.27, 0, 0, i * 0.015);
      headset.add(vent);
    }

    const screwGeometry = new THREE.CylinderGeometry(0.045, 0.045, 0.035, 12);
    for (const [x, y] of [[-1.78, 0.77], [1.78, 0.77], [-1.78, -0.62], [1.78, -0.62]]) {
      const screw = new THREE.Mesh(screwGeometry, metal);
      screw.rotation.x = Math.PI * 0.5;
      screw.position.set(x, y, 0.535);
      headset.add(screw);
    }

    const logo = new THREE.Group();
    logo.position.set(1.29, -0.64, 0.57);
    logo.rotation.z = -0.09;
    const l1 = cylinderBetween(
      new THREE.Vector3(-0.27, 0.16, 0),
      new THREE.Vector3(0, -0.14, 0),
      0.022,
      magentaGlow,
      7
    );
    const l2 = cylinderBetween(
      new THREE.Vector3(0, -0.14, 0),
      new THREE.Vector3(0.27, 0.16, 0),
      0.022,
      cyanGlow,
      7
    );
    const l3 = cylinderBetween(
      new THREE.Vector3(-0.13, 0.15, 0),
      new THREE.Vector3(0.13, 0.15, 0),
      0.012,
      cyanGlow,
      6
    );
    logo.add(l1, l2, l3);
    headset.add(logo);

    const hudCanvas = document.createElement('canvas');
    hudCanvas.width = 1024;
    hudCanvas.height = 384;
    const hudContext = hudCanvas.getContext('2d');
    const hudTexture = new THREE.CanvasTexture(hudCanvas);
    hudTexture.colorSpace = THREE.SRGBColorSpace;
    hudTexture.minFilter = THREE.LinearFilter;
    hudTexture.magFilter = THREE.LinearFilter;

    const hudMaterial = new THREE.MeshBasicMaterial({
      map: hudTexture,
      transparent: true,
      opacity: 0.82,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide
    });

    const hud = new THREE.Mesh(new THREE.PlaneGeometry(3.42, 1.18), hudMaterial);
    hud.position.set(0, 0.03, 0.535);
    headset.add(hud);

    function drawHUD(time) {
      const ctx = hudContext;
      const w = hudCanvas.width;
      const h = hudCanvas.height;
      ctx.clearRect(0, 0, w, h);

      ctx.globalAlpha = 0.18;
      for (let y = 0; y < h; y += 6) {
        ctx.fillStyle = y % 12 === 0 ? '#00eaff' : '#ff138f';
        ctx.fillRect(0, y, w, 1);
      }

      ctx.globalAlpha = 0.78;
      ctx.strokeStyle = '#25efff';
      ctx.lineWidth = 3;
      ctx.strokeRect(70, 62, 245, 235);
      ctx.beginPath();
      ctx.moveTo(70, 112);
      ctx.lineTo(42, 112);
      ctx.lineTo(42, 252);
      ctx.lineTo(70, 252);
      ctx.stroke();

      ctx.strokeStyle = '#ff168f';
      ctx.beginPath();
      ctx.arc(512, 190, 74, 0, Math.PI * 2);
      ctx.arc(512, 190, 41, 0, Math.PI * 2);
      ctx.moveTo(416, 190);
      ctx.lineTo(608, 190);
      ctx.moveTo(512, 94);
      ctx.lineTo(512, 286);
      ctx.stroke();

      const sweep = (time * 0.09) % (Math.PI * 2);
      ctx.strokeStyle = '#72ffff';
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.arc(512, 190, 57, sweep, sweep + 0.75);
      ctx.stroke();

      ctx.strokeStyle = '#00eaff';
      ctx.lineWidth = 2;
      ctx.strokeRect(700, 82, 250, 205);
      for (let i = 0; i < 7; i++) {
        const length = 50 + Math.sin(time * 0.004 + i * 1.7) * 35;
        ctx.fillStyle = i === 3 ? '#ff168f' : '#00dff5';
        ctx.fillRect(728, 112 + i * 22, 90 + length, 5);
      }

      ctx.font = '22px monospace';
      ctx.fillStyle = '#9effff';
      ctx.fillText('OPTIC LINK', 88, 94);
      ctx.fillText('SYNC  99.7%', 88, 274);
      ctx.fillStyle = '#ff58ae';
      ctx.fillText('TARGET LOCK', 446, 338);
      ctx.fillStyle = '#5cf5ff';
      ctx.fillText('NRL-04', 720, 65);

      const pulse = 0.4 + Math.sin(time * 0.008) * 0.25;
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#ff008c';
      ctx.fillRect(340, 70 + Math.sin(time * 0.012) * 80, 310, 3);

      if (Math.sin(time * 0.021) > 0.92) {
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(180, 132, 660, 9);
        ctx.fillStyle = '#ff008c';
        ctx.fillRect(310, 221, 470, 5);
      }

      hudTexture.needsUpdate = true;
    }

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(12, 96),
      new THREE.MeshStandardMaterial({
        color: 0x060711,
        roughness: 0.6,
        metalness: 0.55
      })
    );
    floor.rotation.x = -Math.PI * 0.5;
    floor.position.y = 0.03;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(22, 44, 0x7b145e, 0x082b3c);
    grid.position.y = 0.045;
    grid.material.transparent = true;
    grid.material.opacity = 0.34;
    scene.add(grid);

    const pedestalGlow = new THREE.Mesh(
      new THREE.RingGeometry(2.5, 2.58, 96),
      new THREE.MeshBasicMaterial({
        color: 0x00dcff,
        transparent: true,
        opacity: 0.68,
        side: THREE.DoubleSide
      })
    );
    pedestalGlow.rotation.x = -Math.PI * 0.5;
    pedestalGlow.position.y = 0.06;
    scene.add(pedestalGlow);

    const particlesGeometry = new THREE.BufferGeometry();
    const particleCount = 180;
    const particlePositions = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount; i++) {
      const radius = 5 + Math.random() * 10;
      const angle = Math.random() * Math.PI * 2;
      particlePositions[i * 3] = Math.cos(angle) * radius;
      particlePositions[i * 3 + 1] = Math.random() * 9;
      particlePositions[i * 3 + 2] = Math.sin(angle) * radius - 2;
    }
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    const particles = new THREE.Points(
      particlesGeometry,
      new THREE.PointsMaterial({
        color: 0x42ddff,
        size: 0.025,
        transparent: true,
        opacity: 0.55,
        depthWrite: false
      })
    );
    scene.add(particles);

    const clock = new THREE.Clock();
    let frame = 0;

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      frame++;

      controls.update();
      particles.rotation.y = elapsed * 0.018;
      hudMaterial.opacity = 0.7 + Math.sin(elapsed * 7.2) * 0.08;
      cyanLight.intensity = 20 + Math.sin(elapsed * 2.1) * 4;
      magentaLight.intensity = 25 + Math.sin(elapsed * 2.7 + 1.2) * 5;
      pedestalGlow.material.opacity = 0.48 + Math.sin(elapsed * 2.4) * 0.14;

      if (frame % 3 === 0) drawHUD(performance.now());

      renderer.render(scene, camera);
    }

    drawHUD(0);
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
