<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inflatable T-Rex Pool Toy</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16181b; }
  #app { position: fixed; inset: 0; }
  .hud {
    position: fixed; left: 14px; bottom: 12px; z-index: 10;
    font: 12px/1.35 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    color: rgba(255,255,255,0.55); letter-spacing: 0.02em; user-select: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .hud b { color: rgba(190, 240, 120, 0.9); font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud"><b>Inflatable T-Rex</b> — drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- Renderer ---------- */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

/* ---------- Scene & camera ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x181a1d);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3.9, 2.15, 5.6);

/* ---------- Environment (glossy vinyl reflections) ---------- */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.045).texture;

/* ---------- Controls ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.target.set(0, 1.38, 0);
controls.minDistance = 3.2;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.5 + 0.14;

/* ---------- Lighting ---------- */
const hemi = new THREE.HemisphereLight(0xcfe0ff, 0x20180e, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3e2, 2.3);
key.position.set(4.5, 7.5, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 28;
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -6;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 6;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd2ff, 0.6);
fill.position.set(-6, 3.2, 2.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.35);
rim.position.set(-3.5, 4.5, -6);
scene.add(rim);

/* ---------- Materials ---------- */
const vinyl = new THREE.MeshPhysicalMaterial({
  color: 0x8fd516,
  roughness: 0.34,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.16,
  sheen: 0.5,
  sheenRoughness: 0.5,
  sheenColor: new THREE.Color(0xffffff),
  envMapIntensity: 1.25,
});

const vinylBelly = vinyl.clone();
vinylBelly.color = new THREE.Color(0xc4ec52);

const seamMat = vinyl.clone();
seamMat.color = new THREE.Color(0x9fe22c);
seamMat.roughness = 0.28;
seamMat.clearcoatRoughness = 0.1;

const eyeWhite = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, roughness: 0.12, clearcoat: 1.0, clearcoatRoughness: 0.06, envMapIntensity: 1.1,
});
const eyeBlack = new THREE.MeshPhysicalMaterial({
  color: 0x14161a, roughness: 0.08, clearcoat: 1.0, clearcoatRoughness: 0.04, envMapIntensity: 1.4,
});
const mouthMat = new THREE.MeshPhysicalMaterial({
  color: 0x6e1c22, roughness: 0.3, clearcoat: 1.0, clearcoatRoughness: 0.2, envMapIntensity: 0.8,
});
const toothMat = new THREE.MeshPhysicalMaterial({
  color: 0xfbfbf2, roughness: 0.25, clearcoat: 1.0, clearcoatRoughness: 0.1, envMapIntensity: 1.0,
});
const plugMat = new THREE.MeshPhysicalMaterial({
  color: 0xe4f6a4, roughness: 0.2, metalness: 0.0, clearcoat: 1.0, clearcoatRoughness: 0.08,
  transmission: 0.25, thickness: 0.3, ior: 1.4, envMapIntensity: 1.2,
});

/* ---------- T-Rex group ---------- */
const trex = new THREE.Group();
scene.add(trex);

const SPH = new THREE.SphereGeometry(1, 48, 32);

function blob(px, py, pz, rx, ry, rz, mat = vinyl) {
  const m = new THREE.Mesh(SPH, mat);
  m.scale.set(rx, ry, rz);
  m.position.set(px, py, pz);
  m.castShadow = true;
  m.receiveShadow = true;
  trex.add(m);
  return m;
}

function ring(px, py, pz, radius, tube = 0.045, rotX = Math.PI / 2, rotY = 0) {
  const g = new THREE.TorusGeometry(radius, tube, 14, 44);
  const m = new THREE.Mesh(g, seamMat);
  m.position.set(px, py, pz);
  m.rotation.set(rotX, rotY, 0);
  m.castShadow = true;
  m.receiveShadow = true;
  trex.add(m);
  return m;
}

function seamTube(points, radius = 0.05) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const g = new THREE.TubeGeometry(curve, 64, radius, 12, false);
  const m = new THREE.Mesh(g, seamMat);
  m.castShadow = true;
  m.receiveShadow = true;
  trex.add(m);
  return m;
}

/* ----- Legs & feet ----- */
for (const s of [-1, 1]) {
  blob(s * 0.42, 0.58, 0.00, 0.37, 0.53, 0.44);          // thigh
  blob(s * 0.42, 0.24, 0.10, 0.31, 0.30, 0.38);          // lower leg
  const foot = blob(s * 0.42, 0.14, 0.34, 0.33, 0.17, 0.46); // foot
  foot.receiveShadow = true;
  // toes
  for (const tx of [-0.19, 0, 0.19]) {
    blob(s * 0.42 + tx, 0.11, 0.72, 0.135, 0.115, 0.16);
  }
  ring(s * 0.42, 0.58, 0.00, 0.37, 0.035, 0, 0);         // thigh seam
  ring(s * 0.42, 0.30, 0.08, 0.31, 0.032, 0, 0);         // ankle seam
}

/* ----- Body / belly ----- */
blob(0, 0.90, 0.06, 0.84, 0.72, 0.86);   // lower belly
blob(0, 1.40, 0.00, 0.82, 0.74, 0.84);   // mid belly
blob(0, 1.86, -0.06, 0.63, 0.60, 0.68);  // chest
blob(0, 2.16, 0.14, 0.44, 0.42, 0.46);   // neck
blob(0, 1.06, 0.56, 0.56, 0.64, 0.36, vinylBelly); // lighter belly patch

/* ----- Head ----- */
blob(0, 2.47, 0.46, 0.60, 0.55, 0.62);   // head
blob(0, 2.30, 0.98, 0.47, 0.37, 0.47);   // snout / muzzle
blob(0, 2.50, 0.92, 0.44, 0.34, 0.42);   // upper snout bridge

/* brows */
for (const s of [-1, 1]) {
  blob(s * 0.28, 2.80, 0.78, 0.23, 0.13, 0.20);
}

/* eyes */
for (const s of [-1, 1]) {
  blob(s * 0.27, 2.58, 0.86, 0.18, 0.18, 0.18, eyeWhite);
  const pupil = new THREE.Mesh(SPH, eyeBlack);
  pupil.scale.set(0.10, 0.10, 0.10);
  pupil.position.set(s * 0.30, 2.55, 1.00);
  trex.add(pupil);
  const hi = new THREE.Mesh(SPH, eyeWhite);
  hi.scale.set(0.035, 0.035, 0.035);
  hi.position.set(s * 0.35, 2.63, 1.06);
  trex.add(hi);
}

/* nostrils */
for (const s of [-1, 1]) {
  const n = new THREE.Mesh(SPH, eyeBlack);
  n.scale.set(0.045, 0.035, 0.045);
  n.position.set(s * 0.13, 2.52, 1.26);
  trex.add(n);
}

/* ----- Cartoon grin + teeth ----- */
const mouthCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.42, 2.42, 0.82),
  new THREE.Vector3(-0.26, 2.22, 1.14),
  new THREE.Vector3( 0.00, 2.15, 1.26),
  new THREE.Vector3( 0.26, 2.22, 1.14),
  new THREE.Vector3( 0.42, 2.42, 0.82),
]);
const mouthGeo = new THREE.TubeGeometry(mouthCurve, 48, 0.052, 12, false);
const mouthMesh = new THREE.Mesh(mouthGeo, mouthMat);
mouthMesh.castShadow = true;
trex.add(mouthMesh);

for (const t of [0.30, 0.42, 0.50, 0.58, 0.70]) {
  const p = mouthCurve.getPoint(t);
  const tooth = new THREE.Mesh(SPH, toothMat);
  tooth.scale.set(0.052, 0.04, 0.035);
  tooth.position.set(p.x * 0.94, p.y + 0.058, p.z - 0.015);
  trex.add(tooth);
}

/* ----- Tiny stubby arms ----- */
for (const s of [-1, 1]) {
  blob(s * 0.60, 1.72, 0.36, 0.17, 0.22, 0.18);   // upper arm
  blob(s * 0.66, 1.50, 0.55, 0.15, 0.16, 0.17);   // hand
  for (const c of [-0.06, 0.06]) {                // two little claws
    blob(s * 0.66 + c, 1.40, 0.65, 0.05, 0.09, 0.06);
  }
}

/* ----- Puffed tail ----- */
blob(0, 0.98, -0.72, 0.56, 0.54, 0.56);
blob(0, 1.08, -1.20, 0.43, 0.42, 0.46);
blob(0, 1.28, -1.58, 0.31, 0.31, 0.35);
blob(0, 1.52, -1.90, 0.19, 0.19, 0.23);
ring(0, 1.02, -0.96, 0.44, 0.04, 0, 0);
ring(0, 1.16, -1.40, 0.33, 0.038, -0.2, 0);
ring(0, 1.40, -1.74, 0.23, 0.034, -0.4, 0);

/* ----- Welded body seams ----- */
ring(0, 0.90, 0.06, 0.85, 0.05, Math.PI / 2, 0);   // belly equator
ring(0, 1.40, 0.00, 0.83, 0.05, Math.PI / 2, 0);   // mid equator
ring(0, 1.86, -0.06, 0.63, 0.045, Math.PI / 2, 0); // chest equator

// dorsal seam (head -> tail tip)
seamTube([
  [0, 3.00, 0.48],
  [0, 2.62, 0.14],
  [0, 2.22, -0.14],
  [0, 1.82, -0.38],
  [0, 1.52, -0.72],
  [0, 1.42, -1.14],
  [0, 1.55, -1.52],
  [0, 1.70, -1.86],
], 0.055);

// ventral seam (chin -> lower belly)
seamTube([
  [0, 2.14, 1.02],
  [0, 1.74, 0.86],
  [0, 1.34, 0.86],
  [0, 0.94, 0.80],
  [0, 0.58, 0.58],
], 0.05);

/* ----- Air-plug valve nub ----- */
const valve = new THREE.Group();
{
  const flange = new THREE.Mesh(new THREE.TorusGeometry(0.10, 0.035, 16, 32), plugMat);
  flange.castShadow = true;
  valve.add(flange);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.075, 0.16, 24), plugMat);
  stem.rotation.x = Math.PI / 2;
  stem.position.z = 0.09;
  stem.castShadow = true;
  valve.add(stem);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.092, 0.088, 0.06, 24), plugMat);
  cap.rotation.x = Math.PI / 2;
  cap.position.z = 0.18;
  cap.castShadow = true;
  valve.add(cap);
  const capTop = new THREE.Mesh(SPH, plugMat);
  capTop.scale.set(0.092, 0.092, 0.05);
  capTop.position.z = 0.21;
  valve.add(capTop);
}
valve.position.set(0.70, 1.30, 0.42);
valve.rotation.y = Math.PI / 2 - 0.32;
trex.add(valve);

/* ---------- Ground (shadow catcher) ---------- */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 64),
  new THREE.ShadowMaterial({ opacity: 0.38 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- Resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- Animate ---------- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  // subtle bouncy "inflated" breathing
  const b = Math.sin(t * 1.5);
  trex.scale.set(1 + b * 0.008, 1 - b * 0.010, 1 + b * 0.008);
  trex.position.y = Math.abs(Math.sin(t * 1.5)) * 0.02;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
