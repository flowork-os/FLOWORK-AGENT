<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Papercraft Armadillo Lizard</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14151a; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #b9b2a4; letter-spacing: .04em; text-shadow: 0 1px 3px #000a;
    pointer-events: none; user-select: none;
  }
  #hud b { color: #e8dcc6; font-weight: 600; letter-spacing: .09em; }
</style>
</head>
<body>
<div id="hud"><b>PAPERCRAFT ARMADILLO LIZARD</b><br />folded cardstock · glue tabs · drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================================
   RENDERER / SCENE / CAMERA
   ========================================================================== */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16171c);
scene.fog = new THREE.Fog(0x16171c, 12, 30);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 200);
camera.position.set(2.9, 2.15, 3.55);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.72;
controls.minDistance = 1.6;
controls.maxDistance = 12;
controls.target.set(0, 0.42, 0);
controls.maxPolarAngle = Math.PI * 0.495;

/* ============================================================================
   LIGHTING  — raking key + cool fill + warm rim, soft shadows
   ========================================================================== */

const hemi = new THREE.HemisphereLight(0xa9c4e0, 0x2a2620, 0.42);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2dc, 2.55);
key.position.set(3.1, 3.0, 2.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.4;
key.shadow.camera.far = 16;
key.shadow.camera.left = -2.6;
key.shadow.camera.right = 2.6;
key.shadow.camera.top = 2.6;
key.shadow.camera.bottom = -2.6;
key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.012;
key.shadow.radius = 2.6;
scene.add(key);

// Low raking light to make fold lines and warped facets read.
const rake = new THREE.DirectionalLight(0xffd9a8, 1.05);
rake.position.set(-1.4, 0.55, 3.3);
scene.add(rake);

const fill = new THREE.DirectionalLight(0x9dbadd, 0.62);
fill.position.set(-3.4, 1.5, 1.1);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffb87a, 1.15);
rim.position.set(-1.6, 2.2, -3.4);
scene.add(rim);

const bounce = new THREE.PointLight(0xffe6c2, 0.35, 7, 2);
bounce.position.set(0, -0.25, 0);
scene.add(bounce);

/* ============================================================================
   GROUND — shadow catcher only
   ========================================================================== */

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================================
   PAPER MATERIALS
   ========================================================================== */

const PAPER = {
  sand:       0xdcc396,
  sandLight:  0xe8d6ad,
  ochre:      0xc08c3e,
  ochreDeep:  0xa8722c,
  sienna:     0x9a4a24,
  siennaDeep: 0x7d3a1c,
  cream:      0xefe3c8,
  tab:        0xe6d9bb,
  belly:      0xf0e6cf,
  dark:       0x5d3b22
};

// Subtle fibrous paper roughness map, generated procedurally on a canvas.
function makePaperRoughness(size = 512) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const d = img.data;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = (y * size + x) * 4;
      // fine grain + horizontal fiber streaks
      const grain = Math.random() * 26;
      const fiber = Math.sin(y * 1.7 + Math.sin(x * 0.13) * 2.0) * 8;
      const v = Math.max(0, Math.min(255, 196 + grain + fiber));
      d[i] = d[i + 1] = d[i + 2] = v;
      d[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 3);
  return tex;
}
const roughTex = makePaperRoughness(512);

const matCache = new Map();
function paper(color, opts = {}) {
  const rough = opts.roughness !== undefined ? opts.roughness : 0.93;
  const side = opts.side !== undefined ? opts.side : THREE.DoubleSide;
  const key = color + '|' + rough + '|' + side + '|' + (opts.flat !== false);
  if (matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshStandardMaterial({
    color: color,
    roughness: rough,
    metalness: 0.0,
    flatShading: opts.flat !== false,
    side: side,
    roughnessMap: roughTex,
    vertexColors: !!opts.vertexColors
  });
  matCache.set(key, m);
  return m;
}

// Line material for creases / fold lines
const foldMat = new THREE.LineBasicMaterial({
  color: 0x8f7245, transparent: true, opacity: 0.42
});
const foldMatSoft = new THREE.LineBasicMaterial({
  color: 0xa38a62, transparent: true, opacity: 0.26
});

/* ============================================================================
   SMALL MATH HELPERS
   ========================================================================== */

const TAU = Math.PI * 2;
const lerp = THREE.MathUtils.lerp;
const clamp = THREE.MathUtils.clamp;
const smooth = THREE.MathUtils.smoothstep;

// deterministic pseudo-random
let _seed = 20260721;
function rnd() {
  _seed = (_seed * 1664525 + 1013904223) % 4294967296;
  return _seed / 4294967296;
}
function rr(a, b) { return a + (b - a) * rnd(); }

/**
 * Adds slight "paper warp" to a geometry: pushes vertices along their normal
 * by a low-frequency noise so flat facets bow very subtly, catching light.
 */
function warpPaper(geo, amount = 0.006, freq = 5.0) {
  geo.computeVertexNormals();
  const pos = geo.attributes.position;
  const nor = geo.attributes.normal;
  const v = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    n.fromBufferAttribute(nor, i);
    const w =
      Math.sin(v.x * freq + v.y * freq * 0.6) * 0.5 +
      Math.sin(v.z * freq * 1.3 - v.y * freq * 0.8) * 0.35 +
      Math.sin((v.x + v.z) * freq * 0.7) * 0.25;
    v.addScaledVector(n, w * amount);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

/** Wireframe-ish crease overlay from a geometry's triangle edges (subset). */
function creaseLines(geo, material, keep = 1.0) {
  const eg = new THREE.EdgesGeometry(geo, 18);
  if (keep >= 1.0) return new THREE.LineSegments(eg, material);
  const src = eg.attributes.position.array;
  const out = [];
  for (let i = 0; i < src.length; i += 6) {
    if (rnd() < keep) {
      for (let k = 0; k < 6; k++) out.push(src[i + k]);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(out, 3));
  return new THREE.LineSegments(g, material);
}

/* ============================================================================
   GLUE TAB — a small trapezoid flap of paper, slightly bent
   ========================================================================== */

function glueTabGeometry(width = 0.05, depth = 0.03, inset = 0.011) {
  // A trapezoid in local XZ plane; +Z is the direction the tab folds out.
  const hw = width * 0.5;
  const g = new THREE.BufferGeometry();
  const verts = new Float32Array([
    -hw, 0, 0,
     hw, 0, 0,
     hw - inset, 0.004, depth,
    -hw, 0, 0,
     hw - inset, 0.004, depth,
    -hw + inset, 0.004, depth
  ]);
  g.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  g.computeVertexNormals();
  return g;
}
const TAB_GEO_S = glueTabGeometry(0.042, 0.024, 0.010);
const TAB_GEO_M = glueTabGeometry(0.062, 0.032, 0.014);
const TAB_GEO_L = glueTabGeometry(0.085, 0.042, 0.018);

const tabMatA = paper(PAPER.tab, { roughness: 0.95 });
const tabMatB = paper(PAPER.cream, { roughness: 0.95 });

/**
 * Place a glue tab at a world-ish position, oriented so that:
 *  - its local +Z (fold-out direction) points along `out`
 *  - its local X (tab width) points along `along`
 */
const _m4 = new THREE.Matrix4();
const _xAxis = new THREE.Vector3();
const _yAxis = new THREE.Vector3();
const _zAxis = new THREE.Vector3();

function makeTab(pos, along, out, size = 1, bend = 0.55) {
  const geo = size < 0.85 ? TAB_GEO_S : (size > 1.25 ? TAB_GEO_L : TAB_GEO_M);
  const mesh = new THREE.Mesh(geo, rnd() < 0.5 ? tabMatA : tabMatB);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  _zAxis.copy(out).normalize();
  _xAxis.copy(along).normalize();
  // orthonormalize
  _xAxis.addScaledVector(_zAxis, -_xAxis.dot(_zAxis));
  if (_xAxis.lengthSq() < 1e-8) _xAxis.set(1, 0, 0).addScaledVector(_zAxis, -_zAxis.x);
  _xAxis.normalize();
  _yAxis.crossVectors(_zAxis, _xAxis).normalize();

  _m4.makeBasis(_xAxis, _yAxis, _zAxis);
  mesh.quaternion.setFromRotationMatrix(_m4);
  mesh.position.copy(pos);
  // tilt the tab slightly (paper never lies perfectly flat)
  mesh.rotateX(bend * rr(0.6, 1.25));
  mesh.rotateZ(rr(-0.12, 0.12));
  const s = rr(0.9, 1.15);
  mesh.scale.set(s, s, s);
  return mesh;
}

/* ============================================================================
   BODY SPINE — the armadillo lizard curled nose-to-tail into a ring
   ========================================================================== */

/**
 * Parametric curve of the animal's centerline, t in [0,1]:
 *   t=0   -> nose
 *   ~0.12 -> back of head
 *   ~0.55 -> hips
 *   t=1   -> tail tip (held in the mouth: closes the ring)
 * The path is a ring in the XZ plane with a slight helical rise so the tail
 * tucks under/into the jaws rather than intersecting them dead-on.
 */
const RING_R = 0.62;          // ring radius
const RING_H = 0.10;          // vertical wobble of the ring

function spineAngle(t) {
  // Nose at angle 0, tail tip wrapping most of the way around.
  // Slightly non-uniform: head region occupies less arc, tail more.
  const e = t * t * (3 - 2 * t) * 0.28 + t * 0.72; // gentle easing
  return -e * (TAU * 0.955) - 0.02;
}

function spinePoint(t, target) {
  const a = spineAngle(t);
  // Radius shrinks slightly along the tail so the tip curls inward to the jaws
  const rTail = smooth(t, 0.62, 1.0);
  const r = RING_R * (1 - 0.10 * rTail) + 0.012 * Math.sin(t * 19.0);
  // Height: head slightly raised, mid-body low, tail tip rising to meet mouth
  const y =
    0.40 +
    RING_H * Math.sin(t * Math.PI * 1.0) * 0.55 +
    0.05 * smooth(t, 0.70, 1.0) +
    0.012 * Math.sin(t * 26.0);
  const v = target || new THREE.Vector3();
  return v.set(Math.cos(a) * r, y, Math.sin(a) * r);
}

// Precompute frames (position, tangent, normal, binormal) along the spine.
const SEG = 168;
const frames = [];
{
  const p0 = new THREE.Vector3(), p1 = new THREE.Vector3();
  let prevUp = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i <= SEG; i++) {
    const t = i / SEG;
    const p = spinePoint(t);
    spinePoint(Math.max(0, t - 0.0025), p0);
    spinePoint(Math.min(1, t + 0.0025), p1);
    const tan = p1.clone().sub(p0).normalize();
    // Keep "up" roughly world-up but let it twist a little (paper model tilt)
    const twist = Math.sin(t * Math.PI * 2.0) * 0.10;
    const up = new THREE.Vector3(0, 1, 0)
      .applyAxisAngle(tan, twist)
      .normalize();
    const bin = new THREE.Vector3().crossVectors(tan, up).normalize();
    const nor = new THREE.Vector3().crossVectors(bin, tan).normalize();
    frames.push({ t, p, tan, nor, bin });
    prevUp = nor;
  }
}

function frameAt(t) {
  const f = clamp(t, 0, 1) * SEG;
  const i = Math.min(SEG, Math.max(0, Math.round(f)));
  return frames[i];
}

/** Convert local (right, up, forward-offset) into world coords at param t. */
function local(t, right, up, fwd = 0) {
  const fr = frameAt(t);
  return fr.p.clone()
    .addScaledVector(fr.bin, right)
    .addScaledVector(fr.nor, up)
    .addScaledVector(fr.tan, fwd);
}

/* ---- Body cross-section profile ------------------------------------------ */

/** Half-width of the body at param t (armadillo lizards are flat & broad). */
function bodyWidth(t) {
  const head = 0.100 * Math.exp(-Math.pow((t - 0.055) / 0.075, 2));
  const neck = -0.022 * Math.exp(-Math.pow((t - 0.155) / 0.045, 2));
  const trunk = 0.128 * Math.exp(-Math.pow((t - 0.375) / 0.215, 2));
  const hips = 0.052 * Math.exp(-Math.pow((t - 0.585) / 0.085, 2));
  const tail = 0.072 * Math.pow(clamp(1 - (t - 0.60) / 0.42, 0, 1), 0.85);
  const base = 0.030;
  const w = base + head + neck + trunk + hips + (t > 0.58 ? tail : 0);
  return Math.max(0.020, w * 0.92);
}

/** Half-height of the body at param t (dorsoventrally flattened). */
function bodyHeight(t) {
  const head = 0.058 * Math.exp(-Math.pow((t - 0.060) / 0.080, 2));
  const trunk = 0.082 * Math.exp(-Math.pow((t - 0.370) / 0.230, 2));
  const tail = 0.052 * Math.pow(clamp(1 - (t - 0.60) / 0.44, 0, 1), 0.9);
  const base = 0.024;
  const h = base + head + trunk + (t > 0.58 ? tail : 0);
  return Math.max(0.016, h * 0.90);
}

/**
 * Cross-section shape: a faceted, low, wide "shield" — flat belly,
 * gently domed back, angular papercraft corners.
 * Returns array of {r,u} in cross-section coords (right, up), unit-ish.
 */
const SECTION = (() => {
  // Angles chosen to produce distinct facets: back, shoulders, flanks, belly.
  const pts = [];
  const N = 14;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * TAU;
    let r = Math.cos(a), u = Math.sin(a);
    // squash toward a flattened hexagonal shield
    const k = Math.pow(Math.abs(Math.cos(a)), 1.35) * Math.sign(Math.cos(a));
    r = k * 1.0;
    u = Math.pow(Math.abs(Math.sin(a)), 1.55) * Math.sign(Math.sin(a));
    // flatten the belly (u < 0)
    if (u < 0) u *= 0.62;
    pts.push({ r, u, a });
  }
  return pts;
})();

/* ============================================================================
   BODY SHELL MESH — faceted paper tube built from the spine
   ========================================================================== */

const armadillo = new THREE.Group();

function buildBodyShell() {
  const T0 = 0.012, T1 = 0.995;
  const RINGS = 74;
  const N = SECTION.length;

  const positions = [];
  const colors = [];
  const ringPts = [];

  const cSand = new THREE.Color(PAPER.sand);
  const cSandL = new THREE.Color(PAPER.sandLight);
  const cOchre = new THREE.Color(PAPER.ochre);
  const cSienna = new THREE.Color(PAPER.sienna);
  const cBelly = new THREE.Color(PAPER.belly);
  const tmp = new THREE.Color();

  for (let i = 0; i <= RINGS; i++) {
    const t = lerp(T0, T1, i / RINGS);
    const w = bodyWidth(t);
    const h = bodyHeight(t);
    const fr = frameAt(t);
    const row = [];
    for (let j = 0; j < N; j++) {
      const s = SECTION[j];
      // slight faceting jitter so paper looks hand-cut
      const jitter = 1 + 0.018 * Math.sin(i * 2.3 + j * 5.1);
      const p = fr.p.clone()
        .addScaledVector(fr.bin, s.r * w * jitter)
        .addScaledVector(fr.nor, s.u * h * jitter);
      row.push(p);
    }
    ringPts.push({ t, row, w, h, fr });
  }

  function colorFor(t, u) {
    // belly = cream, flanks = sand, back = ochre with sienna banding
    if (u < -0.45) return tmp.copy(cBelly);
    const band = Math.sin(t * 46.0) * 0.5 + 0.5;
    if (u > 0.35) {
      tmp.copy(cOchre).lerp(cSienna, band * 0.55 + 0.12);
    } else {
      tmp.copy(cSand).lerp(cSandL, band * 0.6);
      tmp.lerp(cOchre, 0.22 + 0.18 * band);
    }
    // head & tail slightly deeper
    const dk = smooth(t, 0.0, 0.10) * 0.0 + smooth(t, 0.78, 1.0) * 0.22;
    tmp.lerp(cSienna, dk);
    return tmp;
  }

  function push(p, t, u) {
    positions.push(p.x, p.y, p.z);
    const c = colorFor(t, u);
    colors.push(c.r, c.g, c.b);
  }

  for (let i = 0; i < RINGS; i++) {
    const A = ringPts[i], B = ringPts[i + 1];
    for (let j = 0; j < N; j++) {
      const j2 = (j + 1) % N;
      const a0 = A.row[j], a1 = A.row[j2];
      const b0 = B.row[j], b1 = B.row[j2];
      const uA = SECTION[j].u, uB = SECTION[j2].u;
      // two triangles, flat-shaded facets
      push(a0, A.t, uA); push(b0, B.t, uA); push(b1, B.t, uB);
      push(a0, A.t, uA); push(b1, B.t, uB); push(a1, A.t, uB);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  warpPaper(geo, 0.0045, 7.0);

  const mat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.94,
    metalness: 0.0,
    flatShading: true,
    side: THREE.DoubleSide,
    roughnessMap: roughTex
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  armadillo.add(mesh);

  // Fold lines along the shell facets
  const lines = creaseLines(geo, foldMatSoft, 0.5);
  armadillo.add(lines);

  return ringPts;
}

const ringPts = buildBodyShell();

/* ============================================================================
   SCALE PLATES — overlapping cut-paper rows stepping outward
   ========================================================================== */

/**
 * A single scale plate: a flat, slightly creased quad/pentagon of cardstock
 * with a soft peak down its midline (a shallow fold).
 */
function plateGeometry(w, l, peak, taper = 0.72) {
  const hw = w * 0.5, hl = l * 0.5;
  const tw = hw * taper;
  const v = [];
  const idx = [];
  // 6 verts: back-left, back-right, mid-left, mid-right (raised ridge), tip
  const pts = [
    [-hw, 0, -hl],       // 0 back left
    [ hw, 0, -hl],       // 1 back right
    [-tw, peak * 0.35, hl * 0.12], // 2 mid left
    [ tw, peak * 0.35, hl * 0.12], // 3 mid right
    [ 0,  peak, -hl * 0.15],       // 4 ridge back
    [ 0,  peak * 0.75, hl ]        // 5 tip (front)
  ];
  for (const p of pts) v.push(p[0], p[1], p[2]);
  idx.push(0, 4, 1);
  idx.push(0, 2, 4);
  idx.push(1, 4, 3);
  idx.push(2, 5, 4);
  idx.push(4, 5, 3);
  // underside (so the plate reads as paper with thickness at the edge)
  idx.push(0, 1, 3);
  idx.push(0, 3, 2);

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/** Sharply creased paper cone (spike) — few segments = crisp folded facets. */
function spikeGeometry(radius, height, seg = 5) {
  const v = [];
  const apex = [0, height, 0];
  const ring = [];
  for (let i = 0; i < seg; i++) {
    const a = (i / seg) * TAU + 0.3;
    // slight irregular radius: hand-cut paper
    const rr2 = radius * (1 + 0.10 * Math.sin(i * 2.7));
    ring.push([Math.cos(a) * rr2, 0, Math.sin(a) * rr2]);
  }
  for (let i = 0; i < seg; i++) {
    const a = ring[i], b = ring[(i + 1) % seg];
    v.push(a[0], a[1], a[2], b[0], b[1], b[2], apex[0], apex[1], apex[2]);
  }
  // base cap
  for (let i = 1; i < seg - 1; i++) {
    const a = ring[0], b = ring[i], c = ring[i + 1];
    v.push(a[0], a[1], a[2], c[0], c[1], c[2], b[0], b[1], b[2]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  g.computeVertexNormals();
  return g;
}

// Shared spike geometries at a few sizes (instanced by scaling)
const SPIKE_GEOS = [
  spikeGeometry(0.020, 0.062, 5),
  spikeGeometry(0.024, 0.082, 5),
  spikeGeometry(0.028, 0.104, 6),
  spikeGeometry(0.017, 0.048, 4)
];
SPIKE_GEOS.forEach(g => warpPaper(g, 0.0016, 22));

const PLATE_GEOS = {};
function getPlate(w, l, peak) {
  const k = w.toFixed(3) + '_' + l.toFixed(3) + '_' + peak.toFixed(3);
  if (!PLATE_GEOS[k]) {
    PLATE_GEOS[k] = warpPaper(plateGeometry(w, l, peak), 0.0022, 26);
  }
  return PLATE_GEOS[k];
}

const matSand = paper(PAPER.sand);
const matSandL = paper(PAPER.sandLight);
const matOchre = paper(PAPER.ochre);
const matOchreD = paper(PAPER.ochreDeep);
const matSienna = paper(PAPER.sienna);
const matSiennaD = paper(PAPER.siennaDeep);
const matCream = paper(PAPER.cream);
const matDark = paper(PAPER.dark, { roughness: 0.85 });

const ROW_MATS = [matSand, matSandL, matOchre, matOchreD, matSienna, matSiennaD];

/** Pick a plate colour that steps outward in rows: sand → ochre → sienna. */
function rowMaterial(rowIdx, t) {
  // rowIdx: 0 = spine ridge, increasing = down the flank
  const band = (Math.sin(t * 34.0 + rowIdx * 1.7) * 0.5 + 0.5);
  if (rowIdx <= 1) return band > 0.55 ? matSienna : matSiennaD;
  if (rowIdx <= 3) return band > 0.5 ? matOchre : matSienna;
  if (rowIdx <= 5) return band > 0.5 ? matOchre : matOchreD;
  if (rowIdx <= 7) return band > 0.45 ? matSand : matOchre;
  return band > 0.5 ? matSandL : matSand;
}

const plateGroup = new THREE.Group();
const spikeGroup = new THREE.Group();
const tabGroup = new THREE.Group();
armadillo.add(plateGroup, spikeGroup, tabGroup);

/**
 * Lay out rows of overlapping scale plates around the body, stepping outward.
 * Rows run longitudinally; within each row, plates overlap like roof shingles.
 */
function buildScalePlates() {
  // Angular positions (in section-space) for each longitudinal row.
  // -1 = belly, 0 = flank, +1 = spine.
  const ROWS = [];
  const NROW = 11;
  for (let k = 0; k < NROW; k++) {
    // spread rows from top (spine) around to lower flank on both sides
    const f = k / (NROW - 1);           // 0 .. 1
    const ang = lerp(Math.PI * 0.5, -Math.PI * 0.22, f); // up -> lower flank
    ROWS.push({ ang, idx: k });
  }

  const T_START = 0.035;
  const T_END = 0.985;

  for (const row of ROWS) {
    for (const side of (row.idx === 0 ? [0] : [1, -1])) {
      // plate density: more on the body, fewer/finer on the tail
      const count = 46;
      for (let i = 0; i < count; i++) {
        const ti = i / (count - 1);
        const t = lerp(T_START, T_END, ti);
        const fr = frameAt(t);
        const w = bodyWidth(t);
        const h = bodyHeight(t);

        // Skip plates over the face (nose/jaw) — keep the head clean
        if (t < 0.028) continue;
        // Belly rows: only along the trunk
        if (row.ang < -0.05 && (t < 0.20 || t > 0.66)) continue;

        const a = row.ang + (side === 0 ? 0 : 0) ;
        const dirR = Math.cos(a) * (side === 0 ? 0 : side);
        const dirU = Math.sin(a);

        // Surface point + outward normal, using the shield section shape
        const rr2 = dirR * w;
        const uu = dirU * h * (dirU < 0 ? 0.62 : 1.0);
        const surf = fr.p.clone()
          .addScaledVector(fr.bin, rr2)
          .addScaledVector(fr.nor, uu);

        const nrm = fr.bin.clone().multiplyScalar(dirR / Math.max(w, 1e-4))
          .addScaledVector(fr.nor, dirU / Math.max(h, 1e-4));
        if (nrm.lengthSq() < 1e-8) nrm.copy(fr.nor);
        nrm.normalize();

        // Plates step OUTWARD row by row (cut-paper layering)
        const step = 0.0075 + row.idx * 0.0026;
        const pos = surf.clone().addScaledVector(nrm, step);

        // Size: broad on trunk, tapering on tail & neck
        const bodyScale = clamp(w / 0.14, 0.45, 1.25);
        const pw = lerp(0.052, 0.030, row.idx / NROW) * bodyScale * rr(0.92, 1.08);
        const pl = lerp(0.046, 0.030, row.idx / NROW) * bodyScale * 1.15;
        const peak = lerp(0.016, 0.008, row.idx / NROW) * bodyScale;

        const geo = getPlate(
          Math.round(pw * 500) / 500,
          Math.round(pl * 500) / 500,
          Math.round(peak * 500) / 500
        );
        const mesh = new THREE.Mesh(geo, rowMaterial(row.idx, t));
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        // Orient: plate +Y along surface normal, +Z along body tangent
        _zAxis.copy(fr.tan).normalize();
        _yAxis.copy(nrm).normalize();
        _xAxis.crossVectors(_yAxis, _zAxis).normalize();
        _zAxis.crossVectors(_xAxis, _yAxis).normalize();
        _m4.makeBasis(_xAxis, _yAxis, _zAxis);
        mesh.quaternion.setFromRotationMatrix(_m4);
        mesh.position.copy(pos);
        // shingle tilt: front edge lifts off the body
        mesh.rotateX(rr(-0.34, -0.16));
        mesh.rotateY(rr(-0.09, 0.09));
        mesh.rotateZ(rr(-0.07, 0.07) + (side === 0 ? 0 : side * 0.05));
        plateGroup.add(mesh);

        // ---- Spikes: the classic armadillo-lizard keeled spiny scales ------
        const wantSpike =
          (row.idx <= 6) &&
          (i % (row.idx <= 2 ? 2 : 3) === (row.idx % 2)) &&
          t > 0.055;

        if (wantSpike) {
          const sizeIdx =
            row.idx <= 1 ? 2 :
            row.idx <= 3 ? 1 :
            row.idx <= 5 ? 0 : 3;
          const sg = SPIKE_GEOS[sizeIdx];
          const smat = row.idx <= 2 ? matSiennaD : (row.idx <= 4 ? matSienna : matOchreD);
          const sp = new THREE.Mesh(sg, smat);
          sp.castShadow = true;
          sp.receiveShadow = true;
          sp.position.copy(pos).addScaledVector(nrm, 0.004);
          sp.quaternion.copy(mesh.quaternion);
          // Spikes sweep backward along the body (toward the tail)
          sp.rotateX(rr(0.52, 0.80));
          sp.rotateZ(rr(-0.14, 0.14));
          const ss = bodyScale * rr(0.82, 1.12) * (t > 0.72 ? 0.86 : 1.0);
          sp.scale.set(ss, ss * rr(0.95, 1.22), ss);
          spikeGroup.add(sp);

          // Glue tab at the spike's base seam
          if (rnd() < 0.5) {
            const tb = makeTab(
              sp.position.clone().addScaledVector(fr.tan, -0.012),
              fr.bin, nrm, 0.7, 0.5
            );
            tabGroup.add(tb);
          }
        }

        // ---- Glue tabs along the plate seams -------------------------------
        if (i % 3 === 0 && rnd() < 0.75) {
          const tabPos = pos.clone()
            .addScaledVector(fr.tan, -pl * 0.55)
            .addScaledVector(nrm, -0.002);
          const tb = makeTab(tabPos, fr.bin, nrm, 0.9, 0.75);
          tabGroup.add(tb);
        }
      }
    }
  }
}
buildScalePlates();

/* ============================================================================
   LONGITUDINAL SEAM TABS — visible glue tabs along every major body seam
   ========================================================================== */

function buildSeamTabs() {
  // Seams run along the shoulder line, the flank line, and the belly edge.
  const seams = [
    { ang: Math.PI * 0.30, size: 1.2 },
    { ang: Math.PI * 0.02, size: 1.0 },
    { ang: -Math.PI * 0.26, size: 0.9 }
  ];
  for (const seam of seams) {
    for (const side of [1, -1]) {
      const count = 40;
      for (let i = 0; i < count; i++) {
        const t = lerp(0.05, 0.98, i / (count - 1));
        if (seam.ang < 0 && (t < 0.18 || t > 0.70)) continue;
        const fr = frameAt(t);
        const w = bodyWidth(t), h = bodyHeight(t);
        const dirR = Math.cos(seam.ang) * side;
        const dirU = Math.sin(seam.ang);
        const surf = fr.p.clone()
          .addScaledVector(fr.bin, dirR * w)
          .addScaledVector(fr.nor, dirU * h * (dirU < 0 ? 0.62 : 1.0));
        const nrm = fr.bin.clone().multiplyScalar(dirR / Math.max(w, 1e-4))
          .addScaledVector(fr.nor, dirU / Math.max(h, 1e-4)).normalize();
        const tb = makeTab(
          surf.addScaledVector(nrm, 0.004),
          fr.tan, nrm, seam.size, 0.95
        );
        tabGroup.add(tb);
      }
    }
  }
}
buildSeamTabs();

/* ============================================================================
   HEAD — faceted paper wedge with jaw, eyes, and a spiny crown
   ========================================================================== */

function buildHead() {
  const head = new THREE.Group();

  const tHead = 0.045;
  const fr = frameAt(tHead);

  // --- Cranium: a low, faceted wedge (folded from one sheet) ---------------
  const hw = 0.085, hh = 0.052, hl = 0.135;
  const V = [
    // snout tip
    [ 0.000,  0.000,  hl * 1.06],   // 0
    // snout upper
    [-0.030,  0.030,  hl * 0.60],   // 1
    [ 0.030,  0.030,  hl * 0.60],   // 2
    // brow / eye ridge
    [-hw * 0.92,  hh * 0.86, -hl * 0.02],  // 3
    [ hw * 0.92,  hh * 0.86, -hl * 0.02],  // 4
    // back of skull (top)
    [-hw * 0.74,  hh * 0.72, -hl * 0.86],  // 5
    [ hw * 0.74,  hh * 0.72, -hl * 0.86],  // 6
    // cheek / jaw corners
    [-hw * 1.02, -hh * 0.30, -hl * 0.10],  // 7
    [ hw * 1.02, -hh * 0.30, -hl * 0.10],  // 8
    // lower snout
    [-0.032, -0.026,  hl * 0.62],   // 9
    [ 0.032, -0.026,  hl * 0.62],   // 10
    // back of skull (bottom)
    [-hw * 0.72, -hh * 0.52, -hl * 0.84],  // 11
    [ hw * 0.72, -hh * 0.52, -hl * 0.84],  // 12
    // crown midline peak
    [ 0.000,  hh * 1.02, -hl * 0.40]       // 13
  ];
  const F = [
    // top of snout
    [0, 1, 2],
    [1, 3, 4], [1, 4, 2],
    // crown
    [3, 13, 4],
    [3, 5, 13], [13, 6, 4], [5, 6, 13],
    // sides
    [1, 7, 3], [2, 4, 8],
    [3, 7, 5], [4, 6, 8],
    [1, 9, 7], [2, 8, 10],
    // jaw / underside
    [0, 9, 1], [0, 2, 10],
    [9, 11, 7], [10, 8, 12],
    [9, 10, 11], [10, 12, 11],
    [0, 10, 9],
    [7, 11, 5], [8, 6, 12],
    // back cap
    [5, 11, 12], [5, 12, 6]
  ];

  const pos = [];
  const col = [];
  const cA = new THREE.Color(PAPER.ochre);
  const cB = new THREE.Color(PAPER.sand);
  const cC = new THREE.Color(PAPER.sienna);
  const tmpC = new THREE.Color();
  for (const f of F) {
    for (let k = 0; k < 3; k++) {
      const p = V[f[k]];
      pos.push(p[0], p[1], p[2]);
      const up = clamp(p[1] / hh, -1, 1);
      tmpC.copy(cB).lerp(cA, clamp(up * 0.5 + 0.5, 0, 1));
      if (up > 0.55) tmpC.lerp(cC, 0.35);
      col.push(tmpC.r, tmpC.g, tmpC.b);
    }
  }
  const hg = new THREE.BufferGeometry();
  hg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  hg.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  warpPaper(hg, 0.0022, 16);

  const hmat = new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.93, metalness: 0,
    flatShading: true, side: THREE.DoubleSide, roughnessMap: roughTex
  });
  const hmesh = new THREE.Mesh(hg, hmat);
  hmesh.castShadow = true;
  hmesh.receiveShadow = true;
  head.add(hmesh);
  head.add(creaseLines(hg, foldMat, 0.85));

  // --- Lower jaw (a separate folded piece, slightly open) ------------------
  const jw = 0.062, jh = 0.026, jl = 0.118;
  const JV = [
    [0, 0, jl * 1.0],
    [-jw * 0.42, jh * 0.5, jl * 0.52], [jw * 0.42, jh * 0.5, jl * 0.52],
    [-jw, jh * 0.62, -jl * 0.55], [jw, jh * 0.62, -jl * 0.55],
    [-jw * 0.55, -jh * 0.7, jl * 0.42], [jw * 0.55, -jh * 0.7, jl * 0.42],
    [-jw * 0.88, -jh * 0.85, -jl * 0.55], [jw * 0.88, -jh * 0.85, -jl * 0.55]
  ];
  const JF = [
    [0, 1, 2], [1, 3, 4], [1, 4, 2],
    [0, 5, 1], [0, 2, 6],
    [1, 5, 7], [1, 7, 3], [2, 4, 8], [2, 8, 6],
    [0, 6, 5], [5, 6, 8], [5, 8, 7],
    [3, 7, 8], [3, 8, 4]
  ];
  const jpos = [];
  for (const f of JF) for (let k = 0; k < 3; k++) {
    const p = JV[f[k]]; jpos.push(p[0], p[1], p[2]);
  }
  const jg = new THREE.BufferGeometry();
  jg.setAttribute('position', new THREE.Float32BufferAttribute(jpos, 3));
  warpPaper(jg, 0.002, 20);
  const jaw = new THREE.Mesh(jg, paper(PAPER.cream, { roughness: 0.94 }));
  jaw.castShadow = true; jaw.receiveShadow = true;
  jaw.position.set(0, -0.032, 0.010);
  jaw.rotation.x = 0.20;
  head.add(jaw);
  head.add(creaseLines(jg, foldMatSoft, 0.7).translateY(-0.032).translateZ(0.010));

  // --- Eyes: folded paper cones/discs, dark pupil --------------------------
  for (const s of [1, -1]) {
    const socketGeo = spikeGeometry(0.019, 0.014, 6);
    const socket = new THREE.Mesh(socketGeo, matOchreD);
    socket.castShadow = true;
    socket.position.set(s * hw * 0.80, hh * 0.62, hl * 0.10);
    socket.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      new THREE.Vector3(s * 0.86, 0.42, 0.28).normalize()
    );
    head.add(socket);

    const pupil = new THREE.Mesh(
      new THREE.CircleGeometry(0.0105, 7),
      new THREE.MeshStandardMaterial({
        color: 0x241408, roughness: 0.55, metalness: 0.0, flatShading: true,
        side: THREE.DoubleSide
      })
    );
    pupil.position.set(s * hw * 0.845, hh * 0.665, hl * 0.115);
    pupil.quaternion.copy(socket.quaternion);
    pupil.rotateX(-Math.PI / 2);
    head.add(pupil);

    // Nostril notch
    const nose = new THREE.Mesh(new THREE.CircleGeometry(0.005, 5), matDark);
    nose.position.set(s * 0.017, 0.020, hl * 0.92);
    nose.rotation.x = -0.25;
    nose.rotation.y = s * 0.5;
    head.add(nose);
  }

  // --- Occipital / temporal spike crown ------------------------------------
  const crownSpikes = [
    { p: [ 0.000, hh * 1.02, -hl * 0.55], d: [ 0.00, 0.86, -0.52], s: 1.15 },
    { p: [ hw * 0.55, hh * 0.90, -hl * 0.62], d: [ 0.52, 0.72, -0.46], s: 1.0 },
    { p: [-hw * 0.55, hh * 0.90, -hl * 0.62], d: [-0.52, 0.72, -0.46], s: 1.0 },
    { p: [ hw * 0.92, hh * 0.46, -hl * 0.55], d: [ 0.86, 0.34, -0.38], s: 0.95 },
    { p: [-hw * 0.92, hh * 0.46, -hl * 0.55], d: [-0.86, 0.34, -0.38], s: 0.95 },
    { p: [ hw * 0.98, hh * 0.10, -hl * 0.28], d: [ 0.94, 0.10, -0.32], s: 0.8 },
    { p: [-hw * 0.98, hh * 0.10, -hl * 0.28], d: [-0.94, 0.10, -0.32], s: 0.8 },
    { p: [ hw * 0.86, hh * 0.80, -hl * 0.12], d: [ 0.62, 0.74, 0.24], s: 0.7 },
    { p: [-hw * 0.86, hh * 0.80, -hl * 0.12], d: [-0.62, 0.74, 0.24], s: 0.7 }
  ];
  for (const cs of crownSpikes) {
    const m = new THREE.Mesh(SPIKE_GEOS[2], matSiennaD);
    m.castShadow = true; m.receiveShadow = true;
    m.position.set(cs.p[0], cs.p[1], cs.p[2]);
    m.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      new THREE.Vector3(cs.d[0], cs.d[1], cs.d[2]).normalize()
    );
    m.scale.setScalar(cs.s);
    head.add(m);

    const tb = makeTab(
      new THREE.Vector3(cs.p[0] * 0.92, cs.p[1] * 0.92, cs.p[2] * 0.92),
      new THREE.Vector3(1, 0, 0),
      new THREE.Vector3(cs.d[0], cs.d[1], cs.d[2]).normalize(),
      0.7, 0.6
    );
    head.add(tb);
  }

  // --- Head scale plates (small overlapping cut-paper pieces) --------------
  for (let i = 0; i < 18; i++) {
    const u = rr(-1, 1), v2 = rr(-0.5, 0.9);
    const g = getPlate(0.030, 0.028, 0.008);
    const m = new THREE.Mesh(g, i % 3 === 0 ? matSienna : (i % 3 === 1 ? matOchre : matSand));
    m.castShadow = true; m.receiveShadow = true;
    const px = u * hw * 0.85;
    const py = hh * (0.55 + 0.35 * (1 - Math.abs(u))) * 0.95;
    const pz = v2 * hl * 0.55 - hl * 0.10;
    m.position.set(px, py + 0.006, pz);
    m.rotation.set(rr(-0.35, -0.05), rr(-0.4, 0.4), u * 0.5 + rr(-0.1, 0.1));
    head.add(m);
  }

  // --- Glue tabs along head seams ------------------------------------------
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * TAU;
    const px = Math.cos(a) * hw * 0.98;
    const py = hh * 0.15 + Math.sin(a) * hh * 0.5;
    const pz = -hl * 0.30 + Math.sin(a * 2) * hl * 0.25;
    const n = new THREE.Vector3(Math.cos(a), Math.sin(a) * 0.8, 0.12).normalize();
    head.add(makeTab(new THREE.Vector3(px, py, pz), new THREE.Vector3(0, 0, 1), n, 0.9, 0.85));
  }

  // Position the head at the nose end of the spine.
  const frH = frameAt(tHead);
  head.position.copy(frH.p);
  _zAxis.copy(frH.tan).multiplyScalar(-1).normalize(); // head faces backward along t
  _yAxis.copy(frH.nor).normalize();
  _xAxis.crossVectors(_yAxis, _zAxis).normalize();
  _yAxis.crossVectors(_zAxis, _xAxis).normalize();
  _m4.makeBasis(_xAxis, _yAxis, _zAxis);
  head.quaternion.setFromRotationMatrix(_m4);
  head.rotateY(0.10);
  head.rotateX(-0.06);

  armadillo.add(head);
  return head;
}
const headGroup = buildHead();

/* ============================================================================
   LIMBS — folded paper legs, tucked against the coiled body
   ========================================================================== */

/** A tapered faceted paper tube between two points (a folded limb segment). */
function limbSegment(len, r0, r1, seg = 5) {
  const v = [];
  const ring0 = [], ring1 = [];
  for (let i = 0; i < seg; i++) {
    const a = (i / seg) * TAU + 0.4;
    ring0.push([Math.cos(a) * r0, 0, Math.sin(a) * r0]);
    ring1.push([Math.cos(a) * r1 * (1 + 0.08 * Math.sin(i * 3.1)), len, Math.sin(a) * r1]);
  }
  for (let i = 0; i < seg; i++) {
    const j = (i + 1) % seg;
    const a0 = ring0[i], a1 = ring0[j], b0 = ring1[i], b1 = ring1[j];
    v.push(a0[0], a0[1], a0[2], b0[0], b0[1], b0[2], b1[0], b1[1], b1[2]);
    v.push(a0[0], a0[1], a0[2], b1[0], b1[1], b1[2], a1[0], a1[1], a1[2]);
  }
  for (let i = 1; i < seg - 1; i++) {
    const a = ring0[0], b = ring0[i], c = ring0[i + 1];
    v.push(a[0], a[1], a[2], c[0], c[1], c[2], b[0], b[1], b[2]);
    const d = ring1[0], e = ring1[i], f = ring1[i + 1];
    v.push(d[0], d[1], d[2], e[0], e[1], e[2], f[0], f[1], f[2]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  warpPaper(g, 0.0014, 30);
  return g;
}

const UPPER_GEO = limbSegment(0.088, 0.030, 0.023, 5);
const LOWER_GEO = limbSegment(0.082, 0.023, 0.016, 5);
const FOOT_GEO = limbSegment(0.030, 0.017, 0.011, 4);

/** A folded paper toe (thin creased wedge). */
function toeGeometry(len, w) {
  const v = [];
  const P = [
    [0, 0, 0],
    [-w, 0.004, len * 0.55],
    [ w, 0.004, len * 0.55],
    [0, 0.001, len],
    [0, -0.006, len * 0.45]
  ];
  const Fc = [[0, 1, 2], [1, 3, 2], [0, 4, 1], [0, 2, 4], [1, 4, 3], [2, 3, 4]];
  for (const f of Fc) for (let k = 0; k < 3; k++) {
    const p = P[f[k]]; v.push(p[0], p[1], p[2]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  g.computeVertexNormals();
  return g;
}
const TOE_GEO = toeGeometry(0.030, 0.007);

function buildLeg(tAttach, side, isFront) {
  const g = new THREE.Group();
  const fr = frameAt(tAttach);
  const w = bodyWidth(tAttach), h = bodyHeight(tAttach);

  // Attach point on the lower flank
  const ang = -0.30;
  const dirR = Math.cos(ang) * side;
  const dirU = Math.sin(ang);
  const base = fr.p.clone()
    .addScaledVector(fr.bin, dirR * w * 0.96)
    .addScaledVector(fr.nor, dirU * h * 0.66);

  const outward = fr.bin.clone().multiplyScalar(side)
    .addScaledVector(fr.nor, -0.55).normalize();

  const legMat = paper(PAPER.ochre, { roughness: 0.93 });
  const footMat = paper(PAPER.sand, { roughness: 0.93 });

  // Upper limb — angled outward and downward, hugging the coil
  const upper = new THREE.Mesh(UPPER_GEO, legMat);
  upper.castShadow = true; upper.receiveShadow = true;
  upper.position.copy(base);
  const upDir = outward.clone()
    .addScaledVector(fr.tan, isFront ? 0.42 : -0.40)
    .normalize();
  upper.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), upDir);
  g.add(upper);

  const elbow = base.clone().addScaledVector(upDir, 0.086);

  // Lower limb — folds back and downward
  const lower = new THREE.Mesh(LOWER_GEO, legMat);
  lower.castShadow = true; lower.receiveShadow = true;
  lower.position.copy(elbow);
  const loDir = upDir.clone()
    .addScaledVector(fr.nor, -1.05)
    .addScaledVector(fr.tan, isFront ? -0.32 : 0.30)
    .normalize();
  lower.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), loDir);
  g.add(lower);

  const wrist = elbow.clone().addScaledVector(loDir, 0.080);

  // Foot
  const foot = new THREE.Mesh(FOOT_GEO, footMat);
  foot.castShadow = true; foot.receiveShadow = true;
  foot.position.copy(wrist);
  const ftDir = loDir.clone().addScaledVector(fr.tan, isFront ? -0.75 : 0.72).normalize();
  foot.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), ftDir);
  g.add(foot);

  const ankle = wrist.clone().addScaledVector(ftDir, 0.026);

  // Toes — five splayed creased wedges
  const sideVec = new THREE.Vector3().crossVectors(ftDir, fr.nor).normalize();
  for (let k = 0; k < 5; k++) {
    const spread = (k - 2) / 2;
    const toe = new THREE.Mesh(TOE_GEO, footMat);
    toe.castShadow = true;
    toe.position.copy(ankle);
    const tdir = ftDir.clone()
      .addScaledVector(sideVec, spread * 0.55)
      .addScaledVector(fr.nor, -0.12)
      .normalize();
    // toe geometry extends along +Z
    _zAxis.copy(tdir);
    _yAxis.copy(fr.nor).addScaledVector(_zAxis, -fr.nor.dot(_zAxis));
    if (_yAxis.lengthSq() < 1e-8) _yAxis.set(0, 1, 0);
    _yAxis.normalize();
    _xAxis.crossVectors(_yAxis, _zAxis).normalize();
    _m4.makeBasis(_xAxis, _yAxis, _zAxis);
    toe.quaternion.setFromRotationMatrix(_m4);
    const ts = 1 - Math.abs(spread) * 0.22;
    toe.scale.set(ts, ts, ts * (k === 3 ? 1.15 : 1.0));
    g.add(toe);
  }

  // Spiky scales + glue tabs on the limb
  for (let k = 0; k < 7; k++) {
    const f = k / 6;
    const p = base.clone().lerp(elbow, f);
    const n = outward.clone().applyAxisAngle(upDir, f * 2.1).normalize();
    const sp = new THREE.Mesh(SPIKE_GEOS[3], matSienna);
    sp.castShadow = true;
    sp.position.copy(p).addScaledVector(n, 0.020);
    sp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), n);
    sp.scale.setScalar(rr(0.7, 1.0));
    g.add(sp);
    if (k % 2 === 0) g.add(makeTab(p.clone().addScaledVector(n, 0.018), upDir, n, 0.8, 0.8));
  }
  for (let k = 0; k < 5; k++) {
    const f = k / 4;
    const p = elbow.clone().lerp(wrist, f);
    const n = outward.clone().applyAxisAngle(loDir, f * 1.8 + 0.6).normalize();
    g.add(makeTab(p.clone().addScaledVector(n, 0.014), loDir, n, 0.65, 0.8));
    if (k % 2 === 1) {
      const sp = new THREE.Mesh(SPIKE_GEOS[3], matOchreD);
      sp.castShadow = true;
      sp.position.copy(p).addScaledVector(n, 0.014);
      sp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), n);
      sp.scale.setScalar(0.7);
      g.add(sp);
    }
  }

  return g;
}

armadillo.add(buildLeg(0.215, 1, true));
armadillo.add(buildLeg(0.215, -1, true));
armadillo.add(buildLeg(0.560, 1, false));
armadillo.add(buildLeg(0.560, -1, false));

/* ============================================================================
   TAIL TIP — big whorled spike rings, gripped by the jaws
   ========================================================================== */

function buildTailRings() {
  const g = new THREE.Group();
  const RINGS = 13;
  for (let r = 0; r < RINGS; r++) {
    const t = lerp(0.635, 0.985, r / (RINGS - 1));
    const fr = frameAt(t);
    const w = bodyWidth(t), h = bodyHeight(t);
    const n = 9;
    const taper = 1 - 0.42 * (r / (RINGS - 1));
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + r * 0.28;
      const dirR = Math.cos(a), dirU = Math.sin(a);
      const surf = fr.p.clone()
        .addScaledVector(fr.bin, dirR * w * 0.98)
        .addScaledVector(fr.nor, dirU * h * (dirU < 0 ? 0.62 : 1.0) * 0.98);
      const nrm = fr.bin.clone().multiplyScalar(dirR / Math.max(w, 1e-4))
        .addScaledVector(fr.nor, dirU / Math.max(h, 1e-4)).normalize();

      const sp = new THREE.Mesh(SPIKE_GEOS[i % 2 === 0 ? 1 : 0], (r % 2 === 0) ? matSienna : matSiennaD);
      sp.castShadow = true; sp.receiveShadow = true;
      sp.position.copy(surf).addScaledVector(nrm, 0.004);
      const dir = nrm.clone().addScaledVector(fr.tan, 0.62).normalize();
      sp.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      const ss = taper * rr(0.9, 1.16);
      sp.scale.set(ss, ss * 1.15, ss);
      g.add(sp);

      if (i % 3 === 0) {
        g.add(makeTab(surf.clone().addScaledVector(nrm, 0.003), fr.bin, nrm, 0.8, 0.9));
      }
    }
    // Ring seam band: a thin folded collar of paper
    const collarPts = [];
    for (let i = 0; i <= 14; i++) {
      const a = (i / 14) * TAU;
      collarPts.push(new THREE.Vector3(
        Math.cos(a) * w * 1.06,
        Math.sin(a) * h * (Math.sin(a) < 0 ? 0.62 : 1.0) * 1.06,
        0
      ));
    }
    const cgeo = new THREE.BufferGeometry().setFromPoints(collarPts);
    const collar = new THREE.Line(cgeo, foldMat);
    collar.position.copy(fr.p);
    _zAxis.copy(fr.tan); _yAxis.copy(fr.nor); _xAxis.copy(fr.bin);
    _m4.makeBasis(_xAxis, _yAxis, _zAxis);
    collar.quaternion.setFromRotationMatrix(_m4);
    g.add(collar);
  }
  armadillo.add(g);
}
buildTailRings();

/* ============================================================================
   BACKBONE FOLD LINE — a visible crease running the full length
   ========================================================================== */

function buildSpineCrease() {
  const pts = [];
  for (let i = 0; i <= 220; i++) {
    const t = lerp(0.03, 0.99, i / 220);
    const fr = frameAt(t);
    pts.push(fr.p.clone().addScaledVector(fr.nor, bodyHeight(t) * 1.02));
  }
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  armadillo.add(new THREE.Line(g, foldMat));

  // Belly seam crease
  const pts2 = [];
  for (let i = 0; i <= 220; i++) {
    const t = lerp(0.03, 0.99, i / 220);
    const fr = frameAt(t);
    pts2.push(fr.p.clone().addScaledVector(fr.nor, -bodyHeight(t) * 0.66));
  }
  const g2 = new THREE.BufferGeometry().setFromPoints(pts2);
  armadillo.add(new THREE.Line(g2, foldMatSoft));
}
buildSpineCrease();

/* ============================================================================
   BASE — a small folded-paper plinth so the ring reads as a display piece
   ========================================================================== */

function buildBase() {
  const g = new THREE.Group();
  const R = 0.98, r = 0.86, hgt = 0.055;
  const N = 16;
  const pos = [];
  const top = [], bot = [], outT = [], outB = [];
  for (let i = 0; i < N; i++) {
    const a = (i / N) * TAU;
    outT.push(new THREE.Vector3(Math.cos(a) * R, hgt, Math.sin(a) * R));
    outB.push(new THREE.Vector3(Math.cos(a) * R * 1.02, 0.0, Math.sin(a) * R * 1.02));
    top.push(new THREE.Vector3(Math.cos(a) * r, hgt, Math.sin(a) * r));
  }
  function tri(a, b, c) { pos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z); }
  const center = new THREE.Vector3(0, hgt, 0);
  for (let i = 0; i < N; i++) {
    const j = (i + 1) % N;
    // top annulus + inner disc
    tri(outT[i], top[i], top[j]);
    tri(outT[i], top[j], outT[j]);
    tri(top[i], center, top[j]);
    // rim wall
    tri(outT[i], outB[j], outB[i]);
    tri(outT[i], outT[j], outB[j]);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  warpPaper(geo, 0.0025, 6);
  const m = new THREE.Mesh(geo, paper(0xcfc3a8, { roughness: 0.97 }));
  m.receiveShadow = true;
  m.castShadow = true;
  g.add(m);
  g.add(creaseLines(geo, foldMatSoft, 0.6));

  // Glue tabs around the plinth rim
  for (let i = 0; i < N; i++) {
    const a = ((i + 0.5) / N) * TAU;
    const p = new THREE.Vector3(Math.cos(a) * R, hgt * 0.5, Math.sin(a) * R);
    const n = new THREE.Vector3(Math.cos(a), 0.1, Math.sin(a)).normalize();
    g.add(makeTab(p, new THREE.Vector3(0, 1, 0), n, 1.3, 0.9));
  }
  return g;
}
const base = buildBase();

/* ============================================================================
   ASSEMBLE + CENTER
   ========================================================================== */

const model = new THREE.Group();
model.add(armadillo);
model.add(base);
scene.add(model);

// Center horizontally and sit the model on the ground plane.
{
  const box = new THREE.Box3().setFromObject(model);
  const c = box.getCenter(new THREE.Vector3());
  model.position.x -= c.x;
  model.position.z -= c.z;
  const box2 = new THREE.Box3().setFromObject(model);
  model.position.y -= box2.min.y;

  const box3 = new THREE.Box3().setFromObject(model);
  const size = box3.getSize(new THREE.Vector3());
  const ctr = box3.getCenter(new THREE.Vector3());
  controls.target.set(0, ctr.y, 0);
  const dist = Math.max(size.x, size.z) * 1.85;
  camera.position.set(dist * 0.62, ctr.y + size.y * 1.55, dist * 0.78);
  controls.update();

  key.target.position.set(0, ctr.y, 0);
  scene.add(key.target);
  bounce.position.set(0, ctr.y - 0.05, 0);
}

// Slight overall tilt: a handmade model never sits perfectly square.
model.rotation.z = 0.012;
model.rotation.x = 0.008;

/* ============================================================================
   RESIZE + RENDER LOOP
   ========================================================================== */

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
