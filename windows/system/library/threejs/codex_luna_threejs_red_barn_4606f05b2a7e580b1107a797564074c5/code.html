<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weathered Red Barn</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b9c7c5}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8c5c4);
scene.fog = new THREE.Fog(0xb8c5c4, 38, 100);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 180);
camera.position.set(24, 15, 27);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 16;
controls.maxDistance = 58;
controls.maxPolarAngle = Math.PI * 0.48;
controls.target.set(0, 5.7, 0);

const red = new THREE.MeshStandardMaterial({ color: 0x7e2925, roughness: 0.92, metalness: 0.02 });
const redDark = new THREE.MeshStandardMaterial({ color: 0x59221f, roughness: 0.95 });
const redLight = new THREE.MeshStandardMaterial({ color: 0x934039, roughness: 0.9 });
const wood = new THREE.MeshStandardMaterial({ color: 0x4b2920, roughness: 0.94 });
const woodLight = new THREE.MeshStandardMaterial({ color: 0x684035, roughness: 0.9 });
const trim = new THREE.MeshStandardMaterial({ color: 0x38231d, roughness: 0.92 });
const metal = new THREE.MeshStandardMaterial({ color: 0x515354, roughness: 0.72, metalness: 0.68 });
const metalDark = new THREE.MeshStandardMaterial({ color: 0x303536, roughness: 0.85, metalness: 0.55 });
const glass = new THREE.MeshStandardMaterial({ color: 0x334d4d, roughness: 0.2, metalness: 0.08 });
const concrete = new THREE.MeshStandardMaterial({ color: 0x918f83, roughness: 1 });
const groundMat = new THREE.MeshStandardMaterial({ color: 0x667153, roughness: 1 });

function box(name, size, position, material, rotation = null) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  if (rotation) mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function roofSegment(x1, y1, x2, y2, material, z = 0, depth = 18.7) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const length = Math.sqrt(dx * dx + dy * dy);
  const angle = Math.atan2(dy, dx);
  return box("corrugated roof panel", [length + 0.16, 0.18, depth],
    [(x1 + x2) / 2, (y1 + y2) / 2, z], material, [0, 0, angle]);
}

function fascia(x1, y1, x2, y2, z) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  const length = Math.sqrt(dx * dx + dy * dy);
  return box("roof fascia", [length, 0.24, 0.28],
    [(x1 + x2) / 2, (y1 + y2) / 2, z], trim, [0, 0, Math.atan2(dy, dx)]);
}

function plankLinesFront() {
  for (let x = -6.7; x <= 6.7; x += 0.72) {
    box("front siding seam", [0.035, 5.7, 0.035], [x, 3.05, -9.08], redDark);
  }
}

function plankLinesSide() {
  for (let z = -8.2; z <= 8.2; z += 0.72) {
    box("side siding seam", [0.035, 5.7, 0.035], [7.08, 3.05, z], redDark);
  }
}

function frontWindow(x, y, w, h) {
  box("window recess", [w, h, 0.12], [x, y, -9.18], glass);
  box("window top frame", [w + 0.28, 0.18, 0.22], [x, y + h / 2 + 0.1, -9.3], trim);
  box("window bottom frame", [w + 0.28, 0.18, 0.22], [x, y - h / 2 - 0.1, -9.3], trim);
  box("window left frame", [0.18, h, 0.22], [x - w / 2 - 0.1, y, -9.3], trim);
  box("window right frame", [0.18, h, 0.22], [x + w / 2 + 0.1, y, -9.3], trim);
  box("window mullion vertical", [0.09, h, 0.24], [x, y, -9.35], trim);
  box("window mullion horizontal", [w, 0.09, 0.24], [x, y, -9.35], trim);
}

function sideWindow(z, y, w, h) {
  box("side window glass", [0.12, h, w], [7.18, y, z], glass);
  box("side window top", [0.24, 0.18, w + 0.28], [7.28, y + h / 2 + 0.1, z], trim);
  box("side window bottom", [0.24, 0.18, w + 0.28], [7.28, y - h / 2 - 0.1, z], trim);
  box("side window front", [0.24, h, 0.18], [7.28, y, z - w / 2 - 0.1], trim);
  box("side window back", [0.24, h, 0.18], [7.28, y, z + w / 2 + 0.1], trim);
  box("side window mullion", [0.24, h, 0.08], [7.32, y, z], trim);
}

box("barn body", [14, 6, 18], [0, 3, 0], red);
box("right side weathered board", [0.11, 5.8, 17.7], [7.08, 3, 0], redLight);
box("left side shadow board", [0.11, 5.8, 17.7], [-7.08, 3, 0], redDark);
plankLinesFront();
plankLinesSide();

const gableShape = new THREE.Shape();
gableShape.moveTo(-7, 0);
gableShape.lineTo(7, 0);
gableShape.lineTo(0, 5.5);
gableShape.lineTo(-7, 0);
const gable = new THREE.Mesh(
  new THREE.ExtrudeGeometry(gableShape, { depth: 0.28, bevelEnabled: false }),
  red
);
gable.position.set(0, 6, -9.14);
gable.castShadow = true;
gable.receiveShadow = true;
scene.add(gable);

roofSegment(-7, 6, -5, 8.55, metal);
roofSegment(-5, 8.55, 0, 11.55, metal);
roofSegment(7, 6, 5, 8.55, metal);
roofSegment(5, 8.55, 0, 11.55, metal);

for (let x = -6.8; x <= -5.1; x += 0.3) {
  const y = 6 + (x + 7) * 1.275;
  const a = Math.atan2(2.55, 2);
  box("roof rib", [0.08, 0.13, 18.9], [x, y + 0.13, 0], metalDark, [0, 0, a]);
}
for (let x = -4.8; x <= -0.25; x += 0.3) {
  const y = 8.55 + (x + 5) * 0.6;
  const a = Math.atan2(3, 5);
  box("roof rib", [0.08, 0.13, 18.9], [x, y + 0.13, 0], metalDark, [0, 0, a]);
}
for (let x = 0.25; x <= 4.8; x += 0.3) {
  const y = 11.55 - x * 0.6;
  const a = -Math.atan2(3, 5);
  box("roof rib", [0.08, 0.13, 18.9], [x, y + 0.13, 0], metalDark, [0, 0, a]);
}
for (let x = 5.1; x <= 6.8; x += 0.3) {
  const y = 8.55 - (x - 5) * 1.275;
  const a = -Math.atan2(2.55, 2);
  box("roof rib", [0.08, 0.13, 18.9], [x, y + 0.13, 0], metalDark, [0, 0, a]);
}

fascia(-7, 6, -5, 8.55, -9.5);
fascia(-5, 8.55, 0, 11.55, -9.5);
fascia(7, 6, 5, 8.55, -9.5);
fascia(5, 8.55, 0, 11.55, -9.5);

box("left barn door", [3.9, 5.1, 0.25], [-2, 3.0, -9.42], wood);
box("right barn door", [3.9, 5.1, 0.25], [2, 3.0, -9.42], woodLight);
box("door header", [8.55, 0.34, 0.38], [0, 5.68, -9.55], trim);
box("door left jamb", [0.34, 5.55, 0.38], [-4.28, 2.95, -9.55], trim);
box("door right jamb", [0.34, 5.55, 0.38], [4.28, 2.95, -9.55], trim);
box("door center seam", [0.18, 5.05, 0.3], [0, 3.0, -9.62], trim);

for (const x of [-3.3, -2.45, -1.6, 1.6, 2.45, 3.3]) {
  box("door board seam", [0.055, 4.9, 0.05], [x, 3, -9.59], trim);
}
for (const side of [-1, 1]) {
  const angle = side * 0.57;
  box("diagonal door brace", [0.18, 5.0, 0.18], [side * 2, 3.05, -9.68], woodLight, [0, 0, angle]);
}
frontWindow(-5.35, 7.4, 1.65, 1.45);
frontWindow(5.35, 7.4, 1.65, 1.45);
sideWindow(-2.4, 3.85, 2.1, 1.65);
sideWindow(3.4, 3.85, 2.1, 1.65);

box("concrete threshold", [9.1, 0.38, 1.35], [0, 0.19, -9.82], concrete);
box("threshold front bevel", [8.8, 0.16, 0.22], [0, 0.47, -10.4], concrete);

box("ground", [90, 0.25, 90], [0, -0.18, 0], groundMat);

const pathMat = new THREE.MeshStandardMaterial({ color: 0x887b66, roughness: 1 });
box("worn approach", [11, 0.04, 15], [0, -0.035, -16], pathMat);

const roofVentMat = new THREE.MeshStandardMaterial({ color: 0x3a3d3b, roughness: 0.8, metalness: 0.45 });
box("roof vent base", [1.5, 0.25, 1.2], [0, 11.8, 1.8], roofVentMat);
box("roof vent cap", [1.9, 0.18, 1.55], [0, 12.25, 1.8], roofVentMat);
for (let x = -0.65; x <= 0.65; x += 0.26) {
  box("vent slat", [0.08, 0.42, 1.1], [x, 12.02, 1.8], metalDark);
}

const sun = new THREE.DirectionalLight(0xffe5c1, 3.1);
sun.position.set(-23, 31, 22);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30;
sun.shadow.camera.right = 30;
sun.shadow.camera.top = 35;
sun.shadow.camera.bottom = -20;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 90;
scene.add(sun);

const fill = new THREE.HemisphereLight(0xb6d1d8, 0x4e493b, 1.7);
scene.add(fill);

const warm = new THREE.PointLight(0xffb36c, 1.3, 16, 2);
warm.position.set(0, 3.2, -10.4);
scene.add(warm);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
