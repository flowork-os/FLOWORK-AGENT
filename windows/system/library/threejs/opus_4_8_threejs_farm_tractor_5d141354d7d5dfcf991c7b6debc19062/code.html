<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Farm Tractor</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #121316; }
  #app { position: fixed; inset: 0; }
  .hint {
    position: fixed; left: 14px; bottom: 12px; z-index: 10;
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: rgba(230,235,240,0.55); letter-spacing: .3px; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">Drag to orbit · scroll to zoom · auto-rotating</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ */
/*  Renderer                                                          */
/* ------------------------------------------------------------------ */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

/* ------------------------------------------------------------------ */
/*  Scene & Camera                                                    */
/* ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121316);
scene.fog = new THREE.Fog(0x121316, 13, 42);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(4.8, 2.6, 6.0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.target.set(0, 0.9, 0);
controls.minDistance = 3.5;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.52;

/* ------------------------------------------------------------------ */
/*  Lighting                                                          */
/* ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xbcd2e8, 0x2a2620, 0.55);
scene.add(hemi);

const ambient = new THREE.AmbientLight(0xffffff, 0.12);
scene.add(ambient);

// Key light (warm) — casts the soft shadow
const key = new THREE.DirectionalLight(0xfff2df, 2.5);
key.position.set(5.5, 8.5, 5.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 32;
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -5;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);

// Fill light (cool, soft, no shadow)
const fill = new THREE.DirectionalLight(0x9fb6d6, 0.55);
fill.position.set(-6.5, 4.0, -2.0);
scene.add(fill);

// Rim / back light
const rim = new THREE.DirectionalLight(0xdfe8ff, 1.25);
rim.position.set(-3.5, 5.5, -7.0);
scene.add(rim);

/* ------------------------------------------------------------------ */
/*  Ground plane (only receives shadows)                              */
/* ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({ color: 0x1a1c20, roughness: 1.0, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ */
/*  Materials                                                         */
/* ------------------------------------------------------------------ */
const bodyPaint  = new THREE.MeshStandardMaterial({ color: 0x2f7d33, metalness: 0.35, roughness: 0.42 });
const fenderMat  = new THREE.MeshStandardMaterial({ color: 0x2f7d33, metalness: 0.35, roughness: 0.42, side: THREE.DoubleSide });
const rimMat     = new THREE.MeshStandardMaterial({ color: 0xf4c20c, metalness: 0.45, roughness: 0.42 });
const rubberMat  = new THREE.MeshStandardMaterial({ color: 0x141414, metalness: 0.05, roughness: 0.9 });
const treadMat   = new THREE.MeshStandardMaterial({ color: 0x0c0c0c, metalness: 0.05, roughness: 0.95 });
const darkMetal  = new THREE.MeshStandardMaterial({ color: 0x2b2c30, metalness: 0.85, roughness: 0.38 });
const steelMat   = new THREE.MeshStandardMaterial({ color: 0x9aa0a6, metalness: 1.0,  roughness: 0.28 });
const engineMat  = new THREE.MeshStandardMaterial({ color: 0x25272b, metalness: 0.7,  roughness: 0.5 });
const grilleMat  = new THREE.MeshStandardMaterial({ color: 0x878d92, metalness: 0.9,  roughness: 0.4 });
const weightMat  = new THREE.MeshStandardMaterial({ color: 0x3a3d41, metalness: 0.55, roughness: 0.6 });
const seatMat    = new THREE.MeshStandardMaterial({ color: 0x1b1b1d, metalness: 0.1,  roughness: 0.6 });
const plasticMat = new THREE.MeshStandardMaterial({ color: 0x141414, metalness: 0.2,  roughness: 0.55 });
const lightMat   = new THREE.MeshStandardMaterial({ color: 0xfff3cf, emissive: 0xffe08a, emissiveIntensity: 0.7, roughness: 0.2, metalness: 0.1 });

/* ------------------------------------------------------------------ */
/*  Helpers                                                           */
/* ------------------------------------------------------------------ */
function addBox(parent, w, h, d, mat, x, y, z, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  parent.add(m);
  return m;
}

function cylinderBetween(p1, p2, radius, mat, seg = 18) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, len, seg), mat);
  m.position.copy(p1).add(p2).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  return m;
}

/* ------------------------------------------------------------------ */
/*  Wheel builder                                                     */
/* ------------------------------------------------------------------ */
function addChevron(g, r, a, width) {
  const grp = new THREE.Group();
  const len = width * 0.46, th = 0.09, tang = 0.14;
  const l = new THREE.Mesh(new THREE.BoxGeometry(len, th, tang), treadMat);
  l.position.set(-width * 0.24, r + 0.015, 0);
  l.rotation.y = 0.42;
  const rgt = new THREE.Mesh(new THREE.BoxGeometry(len, th, tang), treadMat);
  rgt.position.set(width * 0.24, r + 0.015, 0);
  rgt.rotation.y = -0.42;
  grp.add(l, rgt);
  grp.rotation.x = a;
  g.add(grp);
}

function makeWheel(r, width, type) {
  const g = new THREE.Group();

  // Tire carcass
  const tire = new THREE.Mesh(new THREE.CylinderGeometry(r, r, width, 48, 1, false), rubberMat);
  tire.rotation.z = Math.PI / 2;
  g.add(tire);

  // Sidewall shading rings
  const sw = new THREE.Mesh(new THREE.TorusGeometry(r * 0.78, 0.03, 8, 40), rubberMat);
  sw.rotation.y = Math.PI / 2; sw.position.x = width * 0.5; g.add(sw);
  const sw2 = sw.clone(); sw2.position.x = -width * 0.5; g.add(sw2);

  // Rim (painted)
  const rimR = r * 0.52;
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(rimR, rimR, width * 0.86, 32), rimMat);
  rim.rotation.z = Math.PI / 2; g.add(rim);

  // Hub
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.17, r * 0.17, width * 0.96, 20), steelMat);
  hub.rotation.z = Math.PI / 2; g.add(hub);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.09, r * 0.09, width * 1.02, 16), rimMat);
  cap.rotation.z = Math.PI / 2; g.add(cap);

  // Bolts
  const bolts = type === 'rear' ? 8 : 6;
  for (let i = 0; i < bolts; i++) {
    const a = (i / bolts) * Math.PI * 2;
    const b = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, width * 0.9, 8), steelMat);
    b.rotation.z = Math.PI / 2;
    b.position.set(0, Math.cos(a) * rimR * 0.62, Math.sin(a) * rimR * 0.62);
    g.add(b);
  }

  // Tread
  if (type === 'rear') {
    const N = 18;
    for (let i = 0; i < N; i++) addChevron(g, r, (i / N) * Math.PI * 2, width);
  } else {
    [-0.3, 0, 0.3].forEach(off => {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(r + 0.006, 0.022, 8, 44), treadMat);
      ring.rotation.y = Math.PI / 2;
      ring.position.x = off * width;
      g.add(ring);
    });
  }
  return g;
}

/* ------------------------------------------------------------------ */
/*  Steering wheel builder                                            */
/* ------------------------------------------------------------------ */
function makeSteeringWheel(radius) {
  const g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(radius, 0.022, 12, 40), plasticMat);
  g.add(ring);
  const up = new THREE.Vector3(0, 1, 0);
  [90, 210, 330].forEach(deg => {
    const a = THREE.MathUtils.degToRad(deg);
    const dir = new THREE.Vector3(Math.cos(a), Math.sin(a), 0);
    const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, radius * 0.92, 8), darkMetal);
    spoke.position.copy(dir).multiplyScalar(radius * 0.5);
    spoke.quaternion.setFromUnitVectors(up, dir);
    g.add(spoke);
  });
  const boss = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.06, 16), darkMetal);
  boss.rotation.x = Math.PI / 2;
  g.add(boss);
  return g;
}

/* ------------------------------------------------------------------ */
/*  Build the tractor (front = +Z)                                    */
/* ------------------------------------------------------------------ */
const tractor = new THREE.Group();

const rearR = 0.85, rearW = 0.42, rearX = 1.05, rearZ = -1.15;
const frontR = 0.48, frontW = 0.30, frontX = 0.72, frontZ = 1.45;

/* --- Frame rails --- */
addBox(tractor, 0.1, 0.12, 2.6, darkMetal, -0.18, 0.55, 0.2);
addBox(tractor, 0.1, 0.12, 2.6, darkMetal,  0.18, 0.55, 0.2);

/* --- Rear transmission / final-drive housing --- */
addBox(tractor, 0.72, 0.85, 0.9, engineMat, 0, 0.7, -1.0);
addBox(tractor, 0.9, 0.55, 0.55, engineMat, 0, 0.62, -0.5); // bell housing

/* --- Rear axle shafts + wheels --- */
[-1, 1].forEach(s => {
  const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, (rearX - 0.32), 12), darkMetal);
  axle.rotation.z = Math.PI / 2;
  axle.position.set(s * (0.32 + (rearX - 0.32) / 2), rearR, rearZ);
  tractor.add(axle);

  const w = makeWheel(rearR, rearW, 'rear');
  w.position.set(s * rearX, rearR, rearZ);
  tractor.add(w);
});

/* --- Rear fenders (curved half-pipe over the tires) --- */
[-1, 1].forEach(s => {
  const fender = new THREE.Mesh(
    new THREE.CylinderGeometry(rearR + 0.13, rearR + 0.13, rearW + 0.16, 28, 1, true, 0, Math.PI),
    fenderMat
  );
  fender.rotation.z = Math.PI / 2;
  fender.position.set(s * rearX, rearR, rearZ);
  tractor.add(fender);
  // little support bracket
  addBox(tractor, 0.05, 0.5, 0.06, darkMetal, s * (rearX - 0.34), rearR + 0.25, rearZ - 0.1);
});

/* --- Operator platform floor --- */
addBox(tractor, 0.86, 0.06, 0.95, darkMetal, 0, 0.66, -0.15);

/* --- Front bolster + axle + wheels --- */
addBox(tractor, 0.34, 0.32, 0.3, engineMat, 0, 0.56, frontZ - 0.05);
addBox(tractor, (frontX * 2 - 0.06), 0.12, 0.14, darkMetal, 0, frontR, frontZ); // axle beam
const pivot = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.2, 12), darkMetal);
pivot.position.set(0, frontR + 0.06, frontZ); tractor.add(pivot);

[-1, 1].forEach(s => {
  const w = makeWheel(frontR, frontW, 'front');
  w.position.set(s * frontX, frontR, frontZ);
  tractor.add(w);
});

/* --- Engine block (under hood) --- */
addBox(tractor, 0.62, 0.5, 1.2, engineMat, 0, 0.72, 0.9);

/* --- Hood --- */
addBox(tractor, 0.74, 0.6, 1.35, bodyPaint, 0, 1.06, 0.95);
addBox(tractor, 0.52, 0.1, 1.28, bodyPaint, 0, 1.4, 0.95);   // rounded top ridge
// side louvers
[-1, 1].forEach(s => {
  for (let i = 0; i < 4; i++) {
    addBox(tractor, 0.02, 0.02, 0.42, engineMat, s * 0.375, 0.92 + i * 0.09, 1.25);
  }
});

/* --- Dashboard / cowl behind hood --- */
addBox(tractor, 0.66, 0.5, 0.14, bodyPaint, 0, 1.06, 0.3);

/* --- Grille (front face) --- */
addBox(tractor, 0.7, 0.56, 0.06, grilleMat, 0, 1.05, 1.63);
for (let i = 0; i < 7; i++) {
  const x = -0.28 + i * (0.56 / 6);
  addBox(tractor, 0.03, 0.5, 0.02, steelMat, x, 1.05, 1.67);
}

/* --- Headlights --- */
[-1, 1].forEach(s => {
  const housing = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.06, 16), bodyPaint);
  housing.rotation.x = Math.PI / 2;
  housing.position.set(s * 0.29, 1.24, 1.6);
  tractor.add(housing);
  const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.03, 16), lightMat);
  lens.rotation.x = Math.PI / 2;
  lens.position.set(s * 0.29, 1.24, 1.64);
  tractor.add(lens);
});

/* --- Front ballast weight (stacked suitcase weights) --- */
addBox(tractor, 0.2, 0.16, 0.24, darkMetal, 0, 0.7, 1.55);        // bracket
addBox(tractor, 0.5, 0.52, 0.26, weightMat, 0, 0.72, 1.86);       // main block
addBox(tractor, 0.46, 0.08, 0.24, weightMat, 0, 0.99, 1.86);      // top cap
[0.6, 0.72, 0.84].forEach(yy => {
  addBox(tractor, 0.52, 0.025, 0.28, engineMat, 0, yy, 1.86);     // ribs
});

/* --- Exhaust stack --- */
const exX = 0.3, exZ = 1.28;
const flange = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.06, 16), darkMetal);
flange.position.set(exX, 1.37, exZ); tractor.add(flange);
const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.055, 0.98, 18), darkMetal);
pipe.position.set(exX, 1.88, exZ); tractor.add(pipe);
const rainCap = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.1, 16), darkMetal);
rainCap.position.set(exX, 2.36, exZ + 0.03);
rainCap.rotation.x = 0.5; tractor.add(rainCap);

/* --- Steering column + wheel --- */
const colBase = new THREE.Vector3(0, 0.92, 0.32);
const colTop  = new THREE.Vector3(0, 1.5, 0.02);
tractor.add(cylinderBetween(colBase, colTop, 0.03, darkMetal));

const sw = makeSteeringWheel(0.2);
sw.position.copy(colTop);
const colDir = new THREE.Vector3().subVectors(colTop, colBase).normalize();
sw.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), colDir);
tractor.add(sw);

/* --- Seat --- */
tractor.add(cylinderBetween(
  new THREE.Vector3(0, 0.68, -0.72),
  new THREE.Vector3(0, 1.06, -0.78), 0.05, darkMetal));
const seatPan = addBox(tractor, 0.44, 0.09, 0.42, seatMat, 0, 1.12, -0.8, -0.08, 0, 0);
const backrest = addBox(tractor, 0.44, 0.42, 0.09, seatMat, 0, 1.36, -0.99, -0.22, 0, 0);

/* --- Rear drawbar / hitch --- */
addBox(tractor, 0.12, 0.1, 0.5, darkMetal, 0, 0.45, -1.62);
addBox(tractor, 0.06, 0.22, 0.06, darkMetal, 0, 0.5, -1.82);

/* ------------------------------------------------------------------ */
/*  Shadows + centering                                               */
/* ------------------------------------------------------------------ */
tractor.traverse(o => {
  if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
});

// Center horizontally over the origin (keep wheels grounded on Y)
const bbox = new THREE.Box3().setFromObject(tractor);
const center = bbox.getCenter(new THREE.Vector3());
tractor.position.x -= center.x;
tractor.position.z -= center.z;

scene.add(tractor);

/* ------------------------------------------------------------------ */
/*  Resize + render loop                                              */
/* ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
