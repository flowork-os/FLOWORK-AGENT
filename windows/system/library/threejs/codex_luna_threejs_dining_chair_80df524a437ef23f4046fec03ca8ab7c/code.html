<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Walnut Dining Chair</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d8d1c7;
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .label {
      position: fixed;
      left: 28px;
      bottom: 24px;
      color: rgba(48, 37, 29, 0.72);
      letter-spacing: 0.18em;
      font-size: 10px;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }

    .label span {
      display: block;
      margin-top: 7px;
      color: rgba(48, 37, 29, 0.42);
      letter-spacing: 0.1em;
      font-size: 9px;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="label">Walnut dining chair<span>Procedural furniture study / 01</span></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd8d1c7);
    scene.fog = new THREE.Fog(0xd8d1c7, 3.8, 7.5);

    const camera = new THREE.PerspectiveCamera(33, window.innerWidth / window.innerHeight, 0.05, 20);
    camera.position.set(1.65, 1.22, 2.05);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.58, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.minDistance = 0.9;
    controls.maxDistance = 4.2;
    controls.maxPolarAngle = Math.PI * 0.48;

    const walnut = new THREE.MeshStandardMaterial({
      color: 0x633a22,
      roughness: 0.38,
      metalness: 0.02
    });

    const walnutDark = new THREE.MeshStandardMaterial({
      color: 0x3d2115,
      roughness: 0.43,
      metalness: 0.02
    });

    const walnutLight = new THREE.MeshStandardMaterial({
      color: 0x8a5634,
      roughness: 0.34,
      metalness: 0.015
    });

    const endGrain = new THREE.MeshStandardMaterial({
      color: 0x4b2919,
      roughness: 0.48,
      metalness: 0.01
    });

    const brass = new THREE.MeshStandardMaterial({
      color: 0x9a7650,
      roughness: 0.28,
      metalness: 0.42
    });

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0xb9aa99,
      roughness: 0.82,
      metalness: 0
    });

    const rugMaterial = new THREE.MeshStandardMaterial({
      color: 0x8e8175,
      roughness: 0.92,
      metalness: 0
    });

    function addBox(parent, name, width, height, depth, position, material, castShadow, receiveShadow) {
      const geometry = new THREE.BoxGeometry(width, height, depth);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.name = name;
      mesh.position.copy(position);
      mesh.castShadow = castShadow !== false;
      mesh.receiveShadow = receiveShadow !== false;
      parent.add(mesh);
      return mesh;
    }

    function addBeam(parent, name, start, end, width, depth, material) {
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();
      const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
      const geometry = new THREE.BoxGeometry(width, length, depth);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.name = name;
      mesh.position.copy(midpoint);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder(parent, name, radius, height, position, material, rotation) {
      const geometry = new THREE.CylinderGeometry(radius, radius, height, 24);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.name = name;
      mesh.position.copy(position);
      if (rotation) {
        mesh.rotation.set(rotation.x, rotation.y, rotation.z);
      }
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    const chair = new THREE.Group();
    chair.name = "DiningChair";
    scene.add(chair);

    const seatWidth = 0.48;
    const seatDepth = 0.46;
    const seatTop = 0.53;
    const seatThickness = 0.065;
    const seatBottom = seatTop - seatThickness;

    addBox(
      chair,
      "Seat slab",
      seatWidth,
      seatThickness,
      seatDepth,
      new THREE.Vector3(0, seatTop - seatThickness * 0.5, 0),
      walnutLight
    );

    addBox(
      chair,
      "Seat front edge",
      seatWidth + 0.012,
      0.075,
      0.032,
      new THREE.Vector3(0, seatTop - 0.005, 0.222),
      walnut
    );

    addBox(
      chair,
      "Seat left edge",
      0.032,
      0.072,
      seatDepth - 0.015,
      new THREE.Vector3(-0.224, seatTop - 0.006, 0),
      walnut
    );

    addBox(
      chair,
      "Seat right edge",
      0.032,
      0.072,
      seatDepth - 0.015,
      new THREE.Vector3(0.224, seatTop - 0.006, 0),
      walnut
    );

    const apronY = 0.445;
    addBox(chair, "Front apron", 0.39, 0.105, 0.045, new THREE.Vector3(0, apronY, 0.194), walnut);
    addBox(chair, "Rear apron", 0.39, 0.105, 0.045, new THREE.Vector3(0, apronY, -0.194), walnutDark);
    addBox(chair, "Left apron", 0.045, 0.105, 0.34, new THREE.Vector3(-0.198, apronY, 0), walnut);
    addBox(chair, "Right apron", 0.045, 0.105, 0.34, new THREE.Vector3(0.198, apronY, 0), walnut);

    const legTopY = seatBottom + 0.012;
    const legBottomY = 0.035;
    const legTopX = 0.177;
    const legTopZ = 0.165;
    const legBottomX = 0.218;
    const legBottomZ = 0.205;

    const legPositions = [
      { name: "Front left leg", top: new THREE.Vector3(-legTopX, legTopY, legTopZ), bottom: new THREE.Vector3(-legBottomX, legBottomY, legBottomZ) },
      { name: "Front right leg", top: new THREE.Vector3(legTopX, legTopY, legTopZ), bottom: new THREE.Vector3(legBottomX, legBottomY, legBottomZ) },
      { name: "Rear left leg", top: new THREE.Vector3(-legTopX, legTopY, -legTopZ), bottom: new THREE.Vector3(-legBottomX, legBottomY, -legBottomZ) },
      { name: "Rear right leg", top: new THREE.Vector3(legTopX, legTopY, -legTopZ), bottom: new THREE.Vector3(legBottomX, legBottomY, -legBottomZ) }
    ];

    for (let legIndex = 0; legIndex < legPositions.length; legIndex += 1) {
      const leg = legPositions[legIndex];
      addBeam(chair, leg.name, leg.bottom, leg.top, 0.058, 0.058, walnut);
      addBox(
        chair,
        leg.name + " foot",
        0.07,
        0.025,
        0.07,
        new THREE.Vector3(leg.bottom.x, 0.018, leg.bottom.z),
        endGrain
      );
    }

    const stretcherY = 0.205;
    addBeam(chair, "Front stretcher", new THREE.Vector3(-0.201, stretcherY, 0.192), new THREE.Vector3(0.201, stretcherY, 0.192), 0.038, 0.038, walnutDark);
    addBeam(chair, "Rear stretcher", new THREE.Vector3(-0.201, stretcherY, -0.192), new THREE.Vector3(0.201, stretcherY, -0.192), 0.038, 0.038, walnutDark);
    addBeam(chair, "Left stretcher", new THREE.Vector3(-0.201, stretcherY, -0.192), new THREE.Vector3(-0.201, stretcherY, 0.192), 0.038, 0.038, walnutDark);
    addBeam(chair, "Right stretcher", new THREE.Vector3(0.201, stretcherY, -0.192), new THREE.Vector3(0.201, stretcherY, 0.192), 0.038, 0.038, walnutDark);

    const dowelRotation = new THREE.Vector3(Math.PI * 0.5, 0, 0);
    addCylinder(chair, "Front left dowel", 0.012, 0.008, new THREE.Vector3(-0.13, 0.447, 0.219), brass, dowelRotation);
    addCylinder(chair, "Front right dowel", 0.012, 0.008, new THREE.Vector3(0.13, 0.447, 0.219), brass, dowelRotation);

    const backPostBottomY = seatTop - 0.025;
    const backPostTopY = 1.205;
    const backPostZ = -0.192;

    addBeam(
      chair,
      "Back left post",
      new THREE.Vector3(-0.202, backPostBottomY, backPostZ),
      new THREE.Vector3(-0.202, backPostTopY, backPostZ - 0.01),
      0.068,
      0.068,
      walnut
    );

    addBeam(
      chair,
      "Back right post",
      new THREE.Vector3(0.202, backPostBottomY, backPostZ),
      new THREE.Vector3(0.202, backPostTopY, backPostZ - 0.01),
      0.068,
      0.068,
      walnut
    );

    addBox(
      chair,
      "Back top rail",
      0.445,
      0.082,
      0.075,
      new THREE.Vector3(0, 1.17, -0.198),
      walnut
    );

    addBox(
      chair,
      "Back lower rail",
      0.39,
      0.062,
      0.052,
      new THREE.Vector3(0, 0.605, -0.198),
      walnutDark
    );

    const slatCount = 5;
    const slatWidth = 0.047;
    const slatHeight = 0.54;
    const slatSpacing = 0.073;

    for (let slatIndex = 0; slatIndex < slatCount; slatIndex += 1) {
      const slatX = (slatIndex - 2) * slatSpacing;
      addBox(
        chair,
        "Back slat " + (slatIndex + 1),
        slatWidth,
        slatHeight,
        0.034,
        new THREE.Vector3(slatX, 0.885, -0.183),
        slatIndex % 2 === 0 ? walnutLight : walnut
      );
    }

    addBox(
      chair,
      "Back crest highlight",
      0.34,
      0.018,
      0.012,
      new THREE.Vector3(0, 1.211, -0.158),
      walnutLight
    );

    const seatPinPositions = [-0.16, 0.16];
    for (let pinIndex = 0; pinIndex < seatPinPositions.length; pinIndex += 1) {
      addCylinder(
        chair,
        "Seat pin " + (pinIndex + 1),
        0.009,
        0.006,
        new THREE.Vector3(seatPinPositions[pinIndex], seatTop + 0.002, 0.155),
        brass,
        new THREE.Vector3(0, 0, 0)
      );
    }

    const rug = new THREE.Mesh(
      new THREE.CylinderGeometry(1.12, 1.12, 0.018, 96),
      rugMaterial
    );
    rug.name = "Round woven rug";
    rug.position.set(0, -0.014, 0);
    rug.receiveShadow = true;
    scene.add(rug);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(12, 12),
      floorMaterial
    );
    floor.name = "Studio floor";
    floor.rotation.x = -Math.PI * 0.5;
    floor.position.y = -0.026;
    floor.receiveShadow = true;
    scene.add(floor);

    const hemisphere = new THREE.HemisphereLight(0xf6eee3, 0x66584e, 2.05);
    scene.add(hemisphere);

    const keyLight = new THREE.DirectionalLight(0xffe5c7, 3.25);
    keyLight.position.set(2.6, 3.6, 2.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.near = 0.2;
    keyLight.shadow.camera.far = 7;
    keyLight.shadow.camera.left = -2.5;
    keyLight.shadow.camera.right = 2.5;
    keyLight.shadow.camera.top = 3;
    keyLight.shadow.camera.bottom = -1.5;
    keyLight.shadow.bias = -0.00025;
    scene.add(keyLight);
    keyLight.target.position.set(0, 0.55, 0);
    scene.add(keyLight.target);

    const fillLight = new THREE.PointLight(0xd4e2ff, 1.1, 4.5, 2);
    fillLight.position.set(-2.3, 1.7, 1.7);
    scene.add(fillLight);

    const rimLight = new THREE.PointLight(0xffb77e, 1.25, 4, 2);
    rimLight.position.set(1.2, 1.65, -2.2);
    scene.add(rimLight);

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", resize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
