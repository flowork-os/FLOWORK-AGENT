<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowering Moth Orchid</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #dfe8e2; }
canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe8e2);
scene.fog = new THREE.Fog(0xdfe8e2, 7, 14);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.3, -7.2, 4.3);
camera.lookAt(0.55, 0.1, 2.05);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 4;
controls.maxDistance = 10;
controls.target.set(0.5, 0, 2.05);

scene.add(new THREE.HemisphereLight(0xf4fff5, 0x5a6659, 2.1));

const keyLight = new THREE.DirectionalLight(0xfff4dd, 3.3);
keyLight.position.set(-4, -4, 8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -4;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xd8eaff, 1.0);
fillLight.position.set(5, 2, 5);
scene.add(fillLight);

const greenMaterial = new THREE.MeshStandardMaterial({
  color: 0x275c3a,
  roughness: 0.28,
  metalness: 0.02,
  side: THREE.DoubleSide
});

const leafMaterial = new THREE.MeshStandardMaterial({
  color: 0x285f3b,
  roughness: 0.2,
  metalness: 0.02,
  side: THREE.DoubleSide
});

const stemMaterial = new THREE.MeshStandardMaterial({
  color: 0x47783d,
  roughness: 0.55
});

const potMaterial = new THREE.MeshStandardMaterial({
  color: 0x927061,
  roughness: 0.32,
  metalness: 0.02
});

const rimMaterial = new THREE.MeshStandardMaterial({
  color: 0xb28b79,
  roughness: 0.28
});

const soilMaterial = new THREE.MeshStandardMaterial({
  color: 0x30251d,
  roughness: 1
});

const petalMaterial = new THREE.MeshStandardMaterial({
  color: 0xf7dce5,
  roughness: 0.38,
  metalness: 0,
  side: THREE.DoubleSide
});

const petalShadowMaterial = new THREE.MeshStandardMaterial({
  color: 0xeebdce,
  roughness: 0.42,
  side: THREE.DoubleSide
});

const lipMaterial = new THREE.MeshStandardMaterial({
  color: 0xb94c70,
  roughness: 0.3,
  side: THREE.DoubleSide
});

const yellowMaterial = new THREE.MeshStandardMaterial({
  color: 0xe9c968,
  roughness: 0.34
});

function createLeaf(length, width, curve, material) {
  const segments = 28;
  const across = 8;
  const positions = [];
  const indices = [];

  for (let i = 0; i <= segments; i++) {
    const u = i / segments;
    const x = u * length;
    const halfWidth = width * Math.pow(Math.sin(Math.PI * u), 0.62) * (0.94 - 0.18 * u);
    const zCenter = curve * Math.sin(Math.PI * u) - 0.12 * u * u;
    for (let j = 0; j <= across; j++) {
      const v = j / across * 2 - 1;
      const y = halfWidth * v;
      const z = zCenter + 0.035 * Math.sin(Math.PI * u) * (1 - v * v);
      positions.push(x, y, z);
    }
  }

  for (let i = 0; i < segments; i++) {
    for (let j = 0; j < across; j++) {
      const a = i * (across + 1) + j;
      const b = a + 1;
      const c = a + across + 1;
      const d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const leaf = new THREE.Mesh(geometry, material);
  leaf.castShadow = true;
  leaf.receiveShadow = true;
  return leaf;
}

const leaves = [
  { l: 2.25, w: 0.72, c: 0.17, p: [0.02, 0.04, 0.54], r: [0.02, -0.22, -0.26] },
  { l: 2.0, w: 0.68, c: 0.13, p: [0.02, 0.02, 0.58], r: [0.01, 0.28, 0.16] },
  { l: 1.55, w: 0.58, c: 0.12, p: [0.02, 0.02, 0.62], r: [0.08, -0.03, 1.05] }
];

for (const data of leaves) {
  const leaf = createLeaf(data.l, data.w, data.c, leafMaterial);
  leaf.position.set(...data.p);
  leaf.rotation.set(...data.r);
  scene.add(leaf);
}

const pot = new THREE.Mesh(
  new THREE.CylinderGeometry(0.92, 0.7, 1.05, 64, 1, false),
  potMaterial
);
pot.position.set(0, 0, 0.1);
pot.castShadow = true;
pot.receiveShadow = true;
scene.add(pot);

const potRim = new THREE.Mesh(
  new THREE.TorusGeometry(0.84, 0.105, 16, 64),
  rimMaterial
);
potRim.position.set(0, 0, 0.64);
potRim.rotation.x = Math.PI / 2;
potRim.castShadow = true;
scene.add(potRim);

const soil = new THREE.Mesh(
  new THREE.CylinderGeometry(0.76, 0.76, 0.045, 64),
  soilMaterial
);
soil.position.set(0, 0, 0.66);
soil.receiveShadow = true;
scene.add(soil);

const potHighlight = new THREE.Mesh(
  new THREE.TorusGeometry(0.735, 0.018, 8, 64),
  new THREE.MeshStandardMaterial({ color: 0xc39c89, roughness: 0.32 })
);
potHighlight.position.set(0, 0, 0.43);
potHighlight.rotation.x = Math.PI / 2;
scene.add(potHighlight);

const stemPoints = [
  new THREE.Vector3(0.02, 0.03, 0.68),
  new THREE.Vector3(-0.02, 0.04, 1.45),
  new THREE.Vector3(-0.12, 0.08, 2.22),
  new THREE.Vector3(0.05, 0.1, 2.9),
  new THREE.Vector3(0.48, 0.12, 3.43),
  new THREE.Vector3(1.16, 0.1, 3.66),
  new THREE.Vector3(1.84, 0.04, 3.48),
  new THREE.Vector3(2.28, -0.02, 3.02)
];
const stemCurve = new THREE.CatmullRomCurve3(stemPoints);
const stem = new THREE.Mesh(
  new THREE.TubeGeometry(stemCurve, 96, 0.034, 10, false),
  stemMaterial
);
stem.castShadow = true;
scene.add(stem);

const support = new THREE.Mesh(
  new THREE.CylinderGeometry(0.022, 0.022, 3.45, 12),
  new THREE.MeshStandardMaterial({ color: 0x5c645b, roughness: 0.48 })
);
support.position.set(-0.25, 0.09, 2.18);
support.castShadow = true;
scene.add(support);

function addSupportClip(z, rotationZ) {
  const clip = new THREE.Group();
  const bar = new THREE.Mesh(
    new THREE.BoxGeometry(0.34, 0.055, 0.09),
    new THREE.MeshStandardMaterial({ color: 0x758278, roughness: 0.35 })
  );
  bar.position.set(0.13, 0, z);
  bar.rotation.z = rotationZ;
  clip.add(bar);
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.07, 0.018, 8, 24),
    new THREE.MeshStandardMaterial({ color: 0x68766c, roughness: 0.4 })
  );
  ring.rotation.y = Math.PI / 2;
  ring.position.set(0, 0, z);
  clip.add(ring);
  clip.position.set(-0.25, 0.09, 0);
  scene.add(clip);
}
addSupportClip(1.5, 0.08);
addSupportClip(2.62, -0.07);

function createPetal(length, width, material, thickness = 0.08) {
  const uCount = 18;
  const vCount = 8;
  const positions = [];
  const indices = [];

  for (let i = 0; i <= uCount; i++) {
    const u = i / uCount;
    const taper = Math.pow(Math.sin(Math.PI * u), 0.48);
    const centerLift = thickness * Math.sin(Math.PI * u) * (0.72 + 0.28 * u);
    for (let j = 0; j <= vCount; j++) {
      const v = j / vCount * 2 - 1;
      const y = width * taper * v;
      const x = length * u;
      const z = centerLift * (1 - v * v) - 0.035 * u * u;
      positions.push(x, y, z);
    }
  }

  for (let i = 0; i < uCount; i++) {
    for (let j = 0; j < vCount; j++) {
      const a = i * (vCount + 1) + j;
      const b = a + 1;
      const c = a + vCount + 1;
      const d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  return mesh;
}

function createBloom(scale, tilt, side) {
  const bloom = new THREE.Group();
  bloom.scale.setScalar(scale);
  bloom.rotation.z = tilt;

  const petalSpecs = [
    { a: Math.PI * 0.5, l: 0.62, w: 0.27, m: petalMaterial, t: 0.075 },
    { a: Math.PI * 0.5 + 2.18, l: 0.57, w: 0.28, m: petalShadowMaterial, t: 0.09 },
    { a: Math.PI * 0.5 - 2.18, l: 0.57, w: 0.28, m: petalShadowMaterial, t: 0.09 },
    { a: 0.18, l: 0.5, w: 0.24, m: petalMaterial, t: 0.085 },
    { a: Math.PI - 0.18, l: 0.5, w: 0.24, m: petalMaterial, t: 0.085 }
  ];

  for (const spec of petalSpecs) {
    const petal = createPetal(spec.l, spec.w, spec.m, spec.t);
    petal.rotation.z = spec.a;
    petal.rotation.x = -0.13 + 0.08 * Math.sin(spec.a);
    bloom.add(petal);
  }

  const lip = createPetal(0.48, 0.27, lipMaterial, 0.12);
  lip.rotation.z = -Math.PI / 2;
  lip.rotation.x = -0.18;
  lip.scale.y = 0.92;
  bloom.add(lip);

  const column = new THREE.Mesh(
    new THREE.SphereGeometry(0.105, 20, 12),
    yellowMaterial
  );
  column.scale.set(0.75, 0.52, 0.65);
  column.position.set(0, 0, 0.09);
  column.castShadow = true;
  bloom.add(column);

  const centerMark = new THREE.Mesh(
    new THREE.SphereGeometry(0.034, 12, 8),
    new THREE.MeshStandardMaterial({ color: 0x8c4b40, roughness: 0.38 })
  );
  centerMark.position.set(0.02, -0.035, 0.16);
  bloom.add(centerMark);

  bloom.rotation.y = -0.2 + side * 0.12;
  return bloom;
}

const flowerTs = [0.56, 0.65, 0.74, 0.83, 0.91, 0.975];
const sideOffsets = [-0.06, 0.07, -0.04, 0.08, -0.02, 0.04];

for (let i = 0; i < flowerTs.length; i++) {
  const t = flowerTs[i];
  const point = stemCurve.getPointAt(t);
  const tangent = stemCurve.getTangentAt(t).normalize();
  const flower = createBloom(0.84 + (i % 2) * 0.05, -0.18 + i * 0.08, sideOffsets[i]);
  flower.position.copy(point);
  flower.position.x += sideOffsets[i] * 0.18;
  flower.position.y += (i % 2 === 0 ? -0.025 : 0.025);
  flower.rotation.x = -0.24 + tangent.z * 0.16;
  flower.rotation.y = 0.18 * Math.sin(i * 1.7);
  scene.add(flower);
}

const budPoint = stemCurve.getPointAt(0.49);
const bud = new THREE.Mesh(
  new THREE.SphereGeometry(0.17, 20, 16),
  petalShadowMaterial
);
bud.scale.set(0.7, 0.7, 1.35);
bud.position.copy(budPoint);
bud.rotation.y = -0.3;
bud.castShadow = true;
scene.add(bud);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(12, 96),
  new THREE.MeshStandardMaterial({ color: 0xcbd6cc, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 18),
  new THREE.MeshStandardMaterial({ color: 0xdfe8e2, roughness: 1 })
);
backdrop.position.set(0, 3.5, -3.8);
backdrop.rotation.x = 0;
backdrop.receiveShadow = true;
scene.add(backdrop);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  support.rotation.z = Math.sin(elapsed * 0.45) * 0.002;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
