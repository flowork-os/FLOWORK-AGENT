<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cluster Mailbox Unit — Procedural three.js</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #17181b; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ---------- Scene / Camera ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1b1f);
scene.fog = new THREE.Fog(0x1a1b1f, 8, 16);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 60);
camera.position.set(2.35, 1.55, 2.75);

// Soft studio reflections for the metals (fully procedural)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------- Controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 1.4;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.495;

// ---------- Lighting: key + fill + rim + hemi ----------
const hemi = new THREE.HemisphereLight(0x8fa3b8, 0x232529, 0.5);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff1df, 2.6);
key.position.set(3.2, 4.4, 2.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -1.7;
key.shadow.camera.right = 1.7;
key.shadow.camera.top = 2.2;
key.shadow.camera.bottom = -1.2;
key.shadow.camera.near = 1;
key.shadow.camera.far = 12;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.target.position.set(0, 0.9, 0);
scene.add(key, key.target);

const fill = new THREE.DirectionalLight(0xb9c8e2, 0.45);
fill.position.set(-3.0, 1.6, 3.0);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xdde8ff, 1.5);
rim.position.set(-2.4, 3.4, -3.4);
scene.add(rim);

// ---------- Ground (shadow catcher only) ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(6, 64),
  new THREE.ShadowMaterial({ opacity: 0.38 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Materials (postal grey family) ----------
function std(p) { return new THREE.MeshStandardMaterial(Object.assign({ envMapIntensity: 0.65 }, p)); }
const bodyMat     = std({ color: 0x84898f, metalness: 0.68, roughness: 0.42 });
const doorMat     = std({ color: 0x99a0a6, metalness: 0.72, roughness: 0.30 });
const trimMat     = std({ color: 0x6b7075, metalness: 0.62, roughness: 0.50 });
const hoodMat     = std({ color: 0x71767c, metalness: 0.66, roughness: 0.36 });
const pedestalMat = std({ color: 0x585d62, metalness: 0.60, roughness: 0.55 });
const darkMat     = std({ color: 0x25272a, metalness: 0.82, roughness: 0.34 });
const steelMat    = std({ color: 0xb9bec3, metalness: 0.90, roughness: 0.25 });
const labelMat    = std({ color: 0xd8dbde, metalness: 0.10, roughness: 0.60, envMapIntensity: 0.3 });

// ---------- Helpers ----------
function box(w, h, d, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
function cyl(r, len, mat, seg = 20) {
  const g = new THREE.CylinderGeometry(r, r, len, seg);
  g.rotateX(Math.PI / 2); // axis along Z (points out of the door face)
  const m = new THREE.Mesh(g, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// ---------- Dimensions (metres, realistic CBU proportions) ----------
const W = 0.78, H = 1.02, D = 0.44;      // cabinet
const frontZ = D / 2;
const PED_H = 0.55;                       // pedestal height

const unit = new THREE.Group();           // the ONE centered object
scene.add(unit);

// ---------- Pedestal ----------
const basePlate = box(0.46, 0.022, 0.36, pedestalMat);
basePlate.position.y = 0.011;
unit.add(basePlate);

// anchor bolts
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.009, 0.009, 0.018, 12), darkMat);
  bolt.castShadow = true;
  bolt.position.set(sx * 0.19, 0.028, sz * 0.14);
  unit.add(bolt);
}

const column = box(0.19, PED_H - 0.02, 0.25, pedestalMat);
column.position.y = 0.022 + (PED_H - 0.02) / 2 - 0.01;
unit.add(column);

const topPlate = box(0.48, 0.02, 0.34, pedestalMat);
topPlate.position.y = PED_H - 0.01;
unit.add(topPlate);

// ---------- Cabinet ----------
const cabinet = new THREE.Group();
cabinet.position.y = PED_H + H / 2;
unit.add(cabinet);

const shell = box(W, H, D, bodyMat);
cabinet.add(shell);

// Front perimeter trim (master-door frame)
const trimT = 0.008, trimW = 0.03;
const trimZ = frontZ + trimT / 2;
const trims = [
  [W, trimW, 0, H / 2 - trimW / 2],           // top
  [W, trimW, 0, -H / 2 + trimW / 2],          // bottom
  [trimW, H - 2 * trimW, -W / 2 + trimW / 2, 0], // left
  [trimW, H - 2 * trimW, W / 2 - trimW / 2, 0]   // right
];
for (const [tw, th, tx, ty] of trims) {
  const t = box(tw, th, trimT, trimMat);
  t.position.set(tx, ty, trimZ);
  cabinet.add(t);
}

// Piano hinge along the left edge of the master door
const hinge = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, H - 0.05, 14), steelMat);
hinge.castShadow = true;
hinge.position.set(-W / 2 + 0.004, 0, frontZ + 0.004);
cabinet.add(hinge);

// Master arrow-lock on the right stile
const masterLock = cyl(0.014, 0.02, darkMat);
masterLock.position.set(W / 2 - trimW / 2, 0.12, frontZ + trimT + 0.008);
cabinet.add(masterLock);

// ---------- Front-face layout ----------
const sideMargin = 0.048, topMargin = 0.05, bottomMargin = 0.055;
const midGap = 0.022, colGap = 0.014, rowGap = 0.008;
const parcelH = 0.30;
const rows = 8, cols = 2;
const smallZoneH = H - topMargin - bottomMargin - midGap - parcelH;
const doorH = (smallZoneH - (rows - 1) * rowGap) / rows;                 // ≈ 67 mm
const doorW = (W - 2 * sideMargin - colGap) / cols;                      // ≈ 335 mm
const colX = [-(colGap / 2 + doorW / 2), colGap / 2 + doorW / 2];
const firstRowY = H / 2 - topMargin - doorH / 2;

// ---------- Small tenant compartment doors (16, locked, with handles) ----------
for (let r = 0; r < rows; r++) {
  for (let c = 0; c < cols; c++) {
    const x = colX[c];
    const y = firstRowY - r * (doorH + rowGap);

    const door = box(doorW, doorH, 0.011, doorMat);
    door.position.set(x, y, frontZ + 0.0055);
    cabinet.add(door);

    // lock cylinder (right side of door)
    const lock = cyl(0.0095, 0.014, darkMat);
    lock.position.set(x + doorW / 2 - 0.045, y, frontZ + 0.011 + 0.006);
    cabinet.add(lock);

    // keyway slot
    const key = box(0.0025, 0.011, 0.003, steelMat);
    key.position.set(x + doorW / 2 - 0.045, y, frontZ + 0.011 + 0.013);
    cabinet.add(key);

    // pull handle lip along the bottom edge
    const handle = box(0.055, 0.010, 0.016, trimMat);
    handle.position.set(x, y - doorH / 2 + 0.010, frontZ + 0.011 + 0.006);
    cabinet.add(handle);

    // resident number label holder
    const label = box(0.052, 0.02, 0.0025, labelMat);
    label.position.set(x - doorW / 2 + 0.06, y, frontZ + 0.011 + 0.0015);
    cabinet.add(label);
  }
}

// Mid rail between tenant doors and parcel lockers
const railY = H / 2 - topMargin - smallZoneH - midGap / 2;
const rail = box(W - 2 * trimW, 0.016, trimT, trimMat);
rail.position.set(0, railY, trimZ);
cabinet.add(rail);

// ---------- Parcel-locker doors (2, larger, below) ----------
const parcelY = railY - midGap / 2 - parcelH / 2;
for (let c = 0; c < cols; c++) {
  const x = colX[c];

  const pdoor = box(doorW, parcelH, 0.013, doorMat);
  pdoor.position.set(x, parcelY, frontZ + 0.0065);
  cabinet.add(pdoor);

  // embossed stiffener ribs
  for (const dy of [-0.07, 0.07]) {
    const rib = box(doorW - 0.05, 0.012, 0.004, doorMat);
    rib.position.set(x, parcelY + dy, frontZ + 0.013 + 0.002);
    cabinet.add(rib);
  }

  // vertical pull-bar handle with standoffs
  const hx = x + doorW / 2 - 0.05;
  const bar = box(0.014, 0.13, 0.014, trimMat);
  bar.position.set(hx, parcelY - 0.02, frontZ + 0.013 + 0.024);
  cabinet.add(bar);
  for (const dy of [-0.05, 0.05]) {
    const standoff = box(0.012, 0.012, 0.022, trimMat);
    standoff.position.set(hx, parcelY - 0.02 + dy, frontZ + 0.013 + 0.011);
    cabinet.add(standoff);
  }

  // parcel lock
  const plock = cyl(0.012, 0.016, darkMat);
  plock.position.set(hx, parcelY + 0.095, frontZ + 0.013 + 0.007);
  cabinet.add(plock);
  const pkey = box(0.003, 0.014, 0.003, steelMat);
  pkey.position.set(hx, parcelY + 0.095, frontZ + 0.013 + 0.015);
  cabinet.add(pkey);

  // label holder
  const plabel = box(0.06, 0.022, 0.0025, labelMat);
  plabel.position.set(x - doorW / 2 + 0.065, parcelY + 0.11, frontZ + 0.013 + 0.0015);
  cabinet.add(plabel);
}

// ---------- Peaked rain hood ----------
const hoodW = W + 0.09, hoodD = D + 0.09, lip = 0.032, peak = 0.105;
const shape = new THREE.Shape();
shape.moveTo(-hoodD / 2, 0);
shape.lineTo(-hoodD / 2, lip);
shape.lineTo(0, peak);
shape.lineTo(hoodD / 2, lip);
shape.lineTo(hoodD / 2, 0);
shape.closePath();
const hoodGeo = new THREE.ExtrudeGeometry(shape, { depth: hoodW, bevelEnabled: false });
hoodGeo.rotateY(Math.PI / 2);        // ridge runs along cabinet width
hoodGeo.translate(-hoodW / 2, 0, 0);
const hood = new THREE.Mesh(hoodGeo, hoodMat);
hood.castShadow = true;
hood.receiveShadow = true;
hood.position.y = H / 2 + 0.012;
cabinet.add(hood);

// crown lip under the hood
const crown = box(W + 0.05, 0.014, D + 0.05, hoodMat);
crown.position.y = H / 2 + 0.006;
cabinet.add(crown);

// ---------- Resize / animate ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
