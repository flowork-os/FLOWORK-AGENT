<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kawaii Cactus</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f8eee7;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf8eee7);
  scene.fog = new THREE.Fog(0xf8eee7, 13, 22);

  const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(6.3, 5.1, 9.2);
  camera.lookAt(0, 2.55, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 2.55, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.85;
  controls.enablePan = false;
  controls.minDistance = 7;
  controls.maxDistance = 14;
  controls.minPolarAngle = Math.PI * 0.25;
  controls.maxPolarAngle = Math.PI * 0.57;

  const hemi = new THREE.HemisphereLight(0xfffbf5, 0xb8c6b3, 2.4);
  scene.add(hemi);

  const keyLight = new THREE.DirectionalLight(0xfff0dc, 4.2);
  keyLight.position.set(5, 8, 6);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.left = -6;
  keyLight.shadow.camera.right = 6;
  keyLight.shadow.camera.top = 8;
  keyLight.shadow.camera.bottom = -3;
  keyLight.shadow.camera.near = 1;
  keyLight.shadow.camera.far = 22;
  keyLight.shadow.bias = -0.00025;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xc8e8ff, 1.25);
  fillLight.position.set(-5, 4, 4);
  scene.add(fillLight);

  const cactusGreen = new THREE.MeshToonMaterial({ color: 0x69b96c });
  const cactusLight = new THREE.MeshToonMaterial({ color: 0x78c97a });
  const terracotta = new THREE.MeshToonMaterial({ color: 0xd9825b });
  const terracottaLight = new THREE.MeshToonMaterial({ color: 0xeb9b73 });
  const soilMaterial = new THREE.MeshToonMaterial({ color: 0x5d4037 });
  const darkMaterial = new THREE.MeshToonMaterial({ color: 0x302729 });
  const cheekMaterial = new THREE.MeshToonMaterial({ color: 0xf48d9d });
  const spineMaterial = new THREE.MeshToonMaterial({ color: 0xe9f0c8 });
  const petalMaterial = new THREE.MeshToonMaterial({ color: 0xf487aa });
  const petalLightMaterial = new THREE.MeshToonMaterial({ color: 0xffa6bf });
  const flowerCenterMaterial = new THREE.MeshToonMaterial({ color: 0xffd36b });
  const groundMaterial = new THREE.MeshToonMaterial({ color: 0xf2ddd2 });

  const character = new THREE.Group();
  character.rotation.y = 0.02;
  scene.add(character);

  function prepare(mesh, cast = true, receive = true) {
    mesh.castShadow = cast;
    mesh.receiveShadow = receive;
    return mesh;
  }

  const potBody = prepare(new THREE.Mesh(
    new THREE.CylinderGeometry(1.02, 0.72, 1.18, 48, 1, false),
    terracotta
  ));
  potBody.position.y = 0.74;
  character.add(potBody);

  const potBase = prepare(new THREE.Mesh(
    new THREE.CylinderGeometry(0.75, 0.69, 0.18, 48),
    terracotta
  ));
  potBase.position.y = 0.13;
  character.add(potBase);

  const potRim = prepare(new THREE.Mesh(
    new THREE.CylinderGeometry(1.13, 1.08, 0.34, 48),
    terracottaLight
  ));
  potRim.position.y = 1.29;
  character.add(potRim);

  const rimHighlight = prepare(new THREE.Mesh(
    new THREE.TorusGeometry(1.095, 0.075, 16, 64),
    terracottaLight
  ));
  rimHighlight.rotation.x = Math.PI / 2;
  rimHighlight.position.y = 1.45;
  character.add(rimHighlight);

  const soil = prepare(new THREE.Mesh(
    new THREE.CylinderGeometry(0.95, 0.95, 0.08, 48),
    soilMaterial
  ), false, true);
  soil.position.y = 1.48;
  character.add(soil);

  const body = prepare(new THREE.Mesh(
    new THREE.CapsuleGeometry(0.86, 1.75, 12, 32),
    cactusGreen
  ));
  body.position.y = 2.9;
  character.add(body);

  function createArm(side) {
    const arm = new THREE.Group();

    const lower = prepare(new THREE.Mesh(
      new THREE.CapsuleGeometry(0.31, 0.55, 10, 24),
      side < 0 ? cactusGreen : cactusLight
    ));
    lower.rotation.z = side * -0.92;
    lower.position.set(side * 0.88, 3.05, 0);
    arm.add(lower);

    const raised = prepare(new THREE.Mesh(
      new THREE.CapsuleGeometry(0.3, 0.58, 10, 24),
      side < 0 ? cactusGreen : cactusLight
    ));
    raised.rotation.z = side * -0.1;
    raised.position.set(side * 1.19, 3.4, 0);
    arm.add(raised);

    return arm;
  }

  character.add(createArm(-1));
  character.add(createArm(1));

  function addFaceSphere(x, y, z, scale, material) {
    const mesh = prepare(new THREE.Mesh(
      new THREE.SphereGeometry(0.16, 24, 16),
      material
    ));
    mesh.position.set(x, y, z);
    mesh.scale.set(scale.x, scale.y, scale.z);
    character.add(mesh);
    return mesh;
  }

  addFaceSphere(-0.3, 3.12, 0.82, new THREE.Vector3(0.72, 1.05, 0.42), darkMaterial);
  addFaceSphere(0.3, 3.12, 0.82, new THREE.Vector3(0.72, 1.05, 0.42), darkMaterial);

  const eyeSparkleGeometry = new THREE.SphereGeometry(0.025, 12, 8);
  for (const x of [-0.325, 0.275]) {
    const sparkle = new THREE.Mesh(
      eyeSparkleGeometry,
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    sparkle.position.set(x, 3.175, 0.884);
    character.add(sparkle);
  }

  addFaceSphere(-0.58, 2.88, 0.75, new THREE.Vector3(1.25, 0.7, 0.25), cheekMaterial);
  addFaceSphere(0.58, 2.88, 0.75, new THREE.Vector3(1.25, 0.7, 0.25), cheekMaterial);

  const smileCurve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(-0.28, 2.82, 0.858),
    new THREE.Vector3(0, 2.56, 0.91),
    new THREE.Vector3(0.28, 2.82, 0.858)
  );
  const smile = prepare(new THREE.Mesh(
    new THREE.TubeGeometry(smileCurve, 24, 0.045, 10, false),
    darkMaterial
  ));
  character.add(smile);

  const spineGeometry = new THREE.SphereGeometry(0.047, 10, 8);
  const spinePositions = [
    [-0.53, 3.72, 0.63], [0.03, 3.82, 0.81], [0.55, 3.61, 0.62],
    [-0.66, 3.34, 0.49], [0.65, 3.27, 0.52],
    [-0.67, 2.69, 0.49], [0.67, 2.59, 0.48],
    [-0.47, 2.21, 0.66], [0.13, 2.15, 0.81], [0.54, 2.34, 0.61],
    [-0.27, 4.18, 0.68], [0.35, 4.12, 0.66],
    [-1.17, 3.68, 0.25], [-1.35, 3.3, 0.22],
    [1.17, 3.72, 0.25], [1.35, 3.33, 0.22]
  ];

  for (const position of spinePositions) {
    const dot = prepare(new THREE.Mesh(spineGeometry, spineMaterial));
    dot.position.set(position[0], position[1], position[2]);
    character.add(dot);
  }

  const flower = new THREE.Group();
  flower.position.set(-0.14, 4.77, 0.08);
  flower.rotation.z = -0.18;
  flower.rotation.x = -0.08;
  character.add(flower);

  for (let i = 0; i < 5; i++) {
    const angle = i * Math.PI * 2 / 5 + Math.PI / 2;
    const petal = prepare(new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 24, 16),
      i % 2 === 0 ? petalLightMaterial : petalMaterial
    ));
    petal.position.set(Math.cos(angle) * 0.31, Math.sin(angle) * 0.31, 0);
    petal.scale.set(0.65, 1.2, 0.38);
    petal.rotation.z = angle - Math.PI / 2;
    flower.add(petal);
  }

  const flowerCenter = prepare(new THREE.Mesh(
    new THREE.SphereGeometry(0.2, 24, 16),
    flowerCenterMaterial
  ));
  flowerCenter.position.z = 0.13;
  flowerCenter.scale.z = 0.65;
  flower.add(flowerCenter);

  const ground = prepare(new THREE.Mesh(
    new THREE.CylinderGeometry(3.25, 3.45, 0.18, 72),
    groundMaterial
  ), false, true);
  ground.position.y = -0.08;
  scene.add(ground);

  const groundTop = new THREE.Mesh(
    new THREE.CircleGeometry(3.22, 72),
    new THREE.MeshToonMaterial({ color: 0xf7e7df })
  );
  groundTop.rotation.x = -Math.PI / 2;
  groundTop.position.y = 0.015;
  groundTop.receiveShadow = true;
  scene.add(groundTop);

  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(1.45, 48),
    new THREE.MeshBasicMaterial({
      color: 0x9d7465,
      transparent: true,
      opacity: 0.12,
      depthWrite: false
    })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.set(0.2, 0.025, 0.28);
  shadow.scale.set(1.25, 0.72, 1);
  scene.add(shadow);

  function resize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
  }

  addEventListener('resize', resize);

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();
    flower.rotation.z = -0.18 + Math.sin(time * 1.8) * 0.025;
    character.position.y = Math.sin(time * 1.35) * 0.018;
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
