<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Bus Shelter</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#aebbc1}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaebbc1);
scene.fog = new THREE.Fog(0xaebbc1, 18, 42);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(42,window.innerWidth/window.innerHeight,.1,100);
camera.position.set(7.4,4.5,6.9);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .06;
controls.autoRotate = true;
controls.autoRotateSpeed = .65;
controls.target.set(0,1.35,0);

scene.add(new THREE.HemisphereLight(0xdbe9ed,0x5b655e,2.0));

const sun = new THREE.DirectionalLight(0xfff0d5,3.3);
sun.position.set(-7,10,7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = -12;
sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;
sun.shadow.camera.bottom = -8;
sun.shadow.bias = -0.0003;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x9fc8e8,.65);
fill.position.set(7,5,-6);
scene.add(fill);

const steel = new THREE.MeshStandardMaterial({color:0x263238,metalness:.82,roughness:.28});
const steelEdge = new THREE.MeshStandardMaterial({color:0x45545a,metalness:.88,roughness:.22});
const roofMat = new THREE.MeshStandardMaterial({color:0x36474b,metalness:.72,roughness:.3});
const concrete = new THREE.MeshStandardMaterial({color:0x89908c,roughness:.9});
const darkRubber = new THREE.MeshStandardMaterial({color:0x182022,roughness:.7});
const wood = new THREE.MeshStandardMaterial({color:0x9a633d,roughness:.55});
const woodLight = new THREE.MeshStandardMaterial({color:0xb77a4b,roughness:.5});
const glass = new THREE.MeshPhysicalMaterial({
  color:0x9ed6dc,transparent:true,opacity:.24,roughness:.05,
  metalness:.05,transmission:.18,side:THREE.DoubleSide,depthWrite:false
});
const glassEdge = new THREE.MeshStandardMaterial({color:0x60777b,metalness:.7,roughness:.3});

function box(w,h,d,material,x=0,y=0,z=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  m.position.set(x,y,z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}
function cyl(radius,height,material,x=0,y=0,z=0,rotZ=0,rotX=0,segments=24){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,height,segments),material);
  m.position.set(x,y,z);
  m.rotation.z=rotZ;
  m.rotation.x=rotX;
  m.castShadow=true;
  m.receiveShadow=true;
  scene.add(m);
  return m;
}
function roundedPost(x,z,h=2.72){
  const p = new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,h,16),steelEdge);
  p.position.set(x,h/2,z);
  p.castShadow=true;
  p.receiveShadow=true;
  scene.add(p);
  return p;
}

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60,60),
  new THREE.MeshStandardMaterial({color:0x68736f,roughness:1})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.025;
ground.receiveShadow=true;
scene.add(ground);

box(16,.16,3.2,new THREE.MeshStandardMaterial({color:0x3e4645,roughness:.95}),0,-.1,-2.6);
box(16,.12,1.15,concrete,0,.0,-.72);
for(let i=-7;i<8;i++){
  box(.9,.012,.06,new THREE.MeshStandardMaterial({color:0xabb0a9,roughness:1}),i*1.1,.068,-1.2);
}

const shelter = new THREE.Group();
scene.add(shelter);

const W=5.55, D=1.85, H=2.78, backZ=.64, frontZ=-1.03;

box(W+.22,.18,D+.16,roofMat,0,H+.06,-.18);
box(W+.26,.12,.16,steel,0,H-.02,frontZ-.02);
box(W+.26,.12,.14,steel,0,H-.02,backZ+.08);
cyl(.075,W+.38,steelEdge,0,H-.06,frontZ-.10,0,Math.PI/2,28);

for(const x of [-W/2,W/2]){
  roundedPost(x,frontZ,H);
  roundedPost(x,backZ,H);
  box(.14,.12,D+.18,steelEdge,x,.18,-.18);
}
for(const x of [-W/2,W/2]){
  box(.13,.14,D+.18,steelEdge,x,H-.16,-.18);
}
box(W-.16,.08,.08,steelEdge,0,.24,frontZ-.01);
box(W-.16,.08,.08,steelEdge,0,.24,backZ+.02);

const backGlass = new THREE.Mesh(new THREE.BoxGeometry(W-.27,2.38,.035),glass);
backGlass.position.set(0,1.43,backZ);
backGlass.receiveShadow=true;
scene.add(backGlass);

const leftGlass = new THREE.Mesh(new THREE.BoxGeometry(.035,2.38,D-.2),glass);
leftGlass.position.set(-W/2,1.43,-.18);
leftGlass.receiveShadow=true;
scene.add(leftGlass);

const rightGlass = leftGlass.clone();
rightGlass.position.x=W/2;
scene.add(rightGlass);

for(const x of [-W/2+.23,W/2-.23]){
  box(.035,2.4,.055,glassEdge,x,1.43,backZ+.03);
  box(.035,2.4,.055,glassEdge,x,1.43,frontZ-.03);
}
for(const z of [backZ-.18,frontZ+.18]){
  box(W-.3,.035,.04,glassEdge,0,1.43,z);
}
for(const x of [-1.8,0,1.8]){
  box(.025,2.3,.04,glassEdge,x,1.44,backZ+.035);
}

box(4.72,.13,.56,wood,0,1.02,.38);
box(4.72,.09,.48,woodLight,0,1.115,.38);
box(4.72,.10,.10,wood,-0.0,1.63,.57);
box(4.72,.62,.09,wood,0,1.42,.61);
for(const x of [-2.05,-.7,.7,2.05]){
  box(.11,.9,.11,steel,x,.55,.38);
  box(.26,.08,.18,steel,x,.11,.38);
}
for(const x of [-2.15,2.15]){
  cyl(.055,.74,steel,x,.54,.38);
}

const adFrame = new THREE.Group();
scene.add(adFrame);
box(.16,2.32,.12,steelEdge,-2.82,1.43,-.18);
box(.16,2.32,.12,steelEdge,-2.82,1.43,.56);
box(.16,.12,.88,steelEdge,-2.82,2.58,.19,0,0);
box(.16,.12,.88,steelEdge,-2.82,.28,.19,0,0);
box(.12,2.1,.74,darkRubber,-2.84,1.43,.19);

function posterTexture(){
  const c=document.createElement("canvas");
  c.width=512;c.height=760;
  const g=c.getContext("2d");
  const grad=g.createLinearGradient(0,0,512,760);
  grad.addColorStop(0,"#102c3c");grad.addColorStop(.55,"#176b78");grad.addColorStop(1,"#e2a04f");
  g.fillStyle=grad;g.fillRect(0,0,512,760);
  g.fillStyle="#f8e9c9";g.font="bold 46px Arial";g.fillText("RIDE",42,78);
  g.font="bold 39px Arial";g.fillText("THE",42,125);g.fillText("MOMENT",42,172);
  g.strokeStyle="#f8e9c9";g.lineWidth=8;
  g.beginPath();g.arc(256,385,128,Math.PI*1.05,Math.PI*1.95);g.stroke();
  g.fillStyle="#f3c56c";g.beginPath();g.arc(256,383,82,0,Math.PI*2);g.fill();
  g.fillStyle="#176b78";g.beginPath();g.arc(222,364,14,0,Math.PI*2);g.fill();
  g.beginPath();g.arc(291,364,14,0,Math.PI*2);g.fill();
  g.strokeStyle="#176b78";g.lineWidth=9;g.beginPath();g.arc(256,385,43,.2,Math.PI-.2);g.stroke();
  g.fillStyle="#f8e9c9";g.font="bold 27px Arial";g.fillText("EVERY DAY IS",43,659);
  g.font="bold 35px Arial";g.fillText("A NEW ROUTE",43,704);
  return new THREE.CanvasTexture(c);
}
const posterMat = new THREE.MeshBasicMaterial({map:posterTexture(),side:THREE.DoubleSide});
const poster = new THREE.Mesh(new THREE.PlaneGeometry(.72,1.96),posterMat);
poster.rotation.y=-Math.PI/2;
poster.position.set(-2.91,.98,.19);
scene.add(poster);

const signPole = cyl(.035,1.05,steel,-2.45,3.28,-.95);
const sign = new THREE.Mesh(new THREE.CylinderGeometry(.21,.21,.07,32),new THREE.MeshStandardMaterial({color:0x157a86,metalness:.5,roughness:.35}));
sign.rotation.z=Math.PI/2;
sign.position.set(-2.45,3.82,-.95);
sign.castShadow=true;
scene.add(sign);
const signTexCanvas=document.createElement("canvas");
signTexCanvas.width=256;signTexCanvas.height=256;
const sg=signTexCanvas.getContext("2d");
sg.fillStyle="#157a86";sg.fillRect(0,0,256,256);
sg.fillStyle="#f4ead4";sg.beginPath();sg.arc(128,128,78,0,Math.PI*2);sg.fill();
sg.fillStyle="#157a86";sg.font="bold 115px Arial";sg.textAlign="center";sg.textBaseline="middle";sg.fillText("H",128,132);
const signFace=new THREE.Mesh(new THREE.CircleGeometry(.185,32),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(signTexCanvas)}));
signFace.rotation.y=Math.PI/2;
signFace.position.set(-2.491,3.82,-.95);
scene.add(signFace);

for(let i=0;i<5;i++){
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.16,.018,8,24),new THREE.MeshStandardMaterial({color:0x809095,metalness:.7,roughness:.3}));
  ring.rotation.x=Math.PI/2;
  ring.position.set(-2.25+i*1.12,2.79,-.18);
  scene.add(ring);
}

const lightBar = box(3.8,.06,.08,new THREE.MeshStandardMaterial({color:0xd7e7d7,emissive:0x6b9f91,emissiveIntensity:1.4}),0,2.66,.57);
const point = new THREE.PointLight(0xc9ffe4,1.25,4.5);
point.position.set(0,2.55,.15);
scene.add(point);

const treeMat=new THREE.MeshStandardMaterial({color:0x526652,roughness:1});
for(const x of [-7,8]){
  cyl(.18,2.2,new THREE.MeshStandardMaterial({color:0x5b4637,roughness:1}),x,1.1,2.5);
  const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.35,1),treeMat);
  crown.position.set(x,2.8,2.5);
  crown.scale.set(1,1.25,1);
  crown.castShadow=true;
  scene.add(crown);
}

window.addEventListener("resize",()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
