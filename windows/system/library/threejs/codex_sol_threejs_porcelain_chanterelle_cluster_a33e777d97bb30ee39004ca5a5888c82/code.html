<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Porcelain Chanterelle Cluster</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #eee8db;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeee8db);
scene.fog = new THREE.Fog(0xeee8db, 10, 22);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(6.3, 4.5, 7.4);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.75, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 5;
controls.maxDistance = 13;
controls.maxPolarAngle = Math.PI * 0.48;

const hemi = new THREE.HemisphereLight(0xfffbef, 0x8c745d, 2.25);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff0d4, 4.4);
keyLight.position.set(4.5, 7.5, 5.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -3;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 18;
keyLight.shadow.bias = -0.00025;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xffc99c, 1.7);
fillLight.position.set(-5, 3.5, 3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xd9e8ff, 1.35);
rimLight.position.set(2, 5, -6);
scene.add(rimLight);

const porcelainMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  vertexColors: true,
  roughness: 0.19,
  metalness: 0,
  clearcoat: 0.82,
  clearcoatRoughness: 0.16,
  sheen: 0.25,
  sheenColor: new THREE.Color(0xffdfad),
  side: THREE.DoubleSide
});

const ridgeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xf2b766,
  roughness: 0.27,
  clearcoat: 0.62,
  clearcoatRoughness: 0.2,
  sheen: 0.18,
  sheenColor: new THREE.Color(0xffd39d)
});

const rimMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffe4a1,
  roughness: 0.18,
  clearcoat: 0.9,
  clearcoatRoughness: 0.13
});

const baseMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xf8d990,
  roughness: 0.2,
  clearcoat: 0.86,
  clearcoatRoughness: 0.15,
  sheen: 0.25,
  sheenColor: new THREE.Color(0xffd2a2)
});

const paleGold = new THREE.Color(0xffe5a5);
const cream = new THREE.Color(0xfff1c5);
const apricot = new THREE.Color(0xf3a064);
const softApricot = new THREE.Color(0xf8bd7d);

function ease(value) {
  const x = THREE.MathUtils.clamp(value, 0, 1);
  return x * x * (3 - 2 * x);
}

function radialWave(theta, phase, strength = 1) {
  return strength * (
    0.055 * Math.sin(theta * 3 + phase) +
    0.032 * Math.sin(theta * 5 - phase * 0.7) +
    0.019 * Math.sin(theta * 7 + phase * 1.6)
  );
}

function bodyRadius(t, stemRadius, capRadius) {
  const lower = stemRadius * (0.87 + 0.16 * Math.sin(Math.PI * t));
  const flare = ease((t - 0.48) / 0.52);
  return THREE.MathUtils.lerp(lower, capRadius, Math.pow(flare, 1.28));
}

function colorForSurface(theta, t, isCap, phase) {
  const color = cream.clone().lerp(paleGold, isCap ? 0.46 : 0.62);
  const paintedBand = 0.5 + 0.5 * Math.sin(theta * 2.15 + phase);
  const brokenEdge = 0.5 + 0.5 * Math.sin(theta * 5.1 - phase * 1.3);
  const blush = isCap
    ? Math.max(0, paintedBand * 0.72 + brokenEdge * 0.28 - 0.43) * (0.28 + 0.72 * t)
    : Math.max(0, paintedBand - 0.7) * ease((t - 0.48) / 0.52) * 0.42;
  color.lerp(isCap ? apricot : softApricot, blush * 0.72);
  return color;
}

function createBodyGeometry(height, stemRadius, capRadius, phase) {
  const radialSegments = 72;
  const verticalSegments = 38;
  const positions = [];
  const colors = [];
  const indices = [];

  for (let j = 0; j <= verticalSegments; j++) {
    const t = j / verticalSegments;
    const baseR = bodyRadius(t, stemRadius, capRadius);
    const bendX = 0.035 * Math.sin(t * Math.PI) * Math.sin(phase);
    const bendZ = 0.026 * Math.sin(t * Math.PI) * Math.cos(phase);

    for (let i = 0; i <= radialSegments; i++) {
      const theta = i / radialSegments * Math.PI * 2;
      const upperInfluence = Math.pow(t, 4.5);
      const wave = radialWave(theta, phase);
      const radius = baseR * (1 + wave * upperInfluence);
      const yWave = capRadius * upperInfluence * (
        0.058 * Math.sin(theta * 3 + phase) +
        0.028 * Math.sin(theta * 6 - phase)
      );
      positions.push(
        bendX + Math.cos(theta) * radius,
        height * t + yWave,
        bendZ + Math.sin(theta) * radius
      );
      const color = colorForSurface(theta, t, false, phase);
      colors.push(color.r, color.g, color.b);
    }
  }

  const row = radialSegments + 1;
  for (let j = 0; j < verticalSegments; j++) {
    for (let i = 0; i < radialSegments; i++) {
      const a = j * row + i;
      const b = a + 1;
      const c = (j + 1) * row + i;
      const d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  return geometry;
}

function createCapGeometry(height, stemRadius, capRadius, phase) {
  const radialSegments = 72;
  const ringSegments = 24;
  const positions = [0, height - capRadius * 0.43, 0];
  const centerColor = colorForSurface(0, 0, true, phase);
  const colors = [centerColor.r, centerColor.g, centerColor.b];
  const indices = [];

  for (let ring = 1; ring <= ringSegments; ring++) {
    const s = ring / ringSegments;
    const shaped = Math.pow(s, 0.84);
    const baseRadius = THREE.MathUtils.lerp(stemRadius * 0.16, capRadius, shaped);
    const bowlRise = capRadius * (0.43 * Math.pow(s, 1.34));
    const broadRipple = capRadius * 0.035 * Math.sin(s * Math.PI * 2.3 + phase);

    for (let i = 0; i <= radialSegments; i++) {
      const theta = i / radialSegments * Math.PI * 2;
      const edge = Math.pow(s, 4.1);
      const wave = radialWave(theta, phase);
      const radius = baseRadius * (1 + wave * edge);
      const y = height - capRadius * 0.43 + bowlRise + broadRipple * s +
        capRadius * edge * (
          0.058 * Math.sin(theta * 3 + phase) +
          0.028 * Math.sin(theta * 6 - phase)
        );
      positions.push(Math.cos(theta) * radius, y, Math.sin(theta) * radius);
      const color = colorForSurface(theta, s, true, phase);
      colors.push(color.r, color.g, color.b);
    }
  }

  for (let i = 0; i < radialSegments; i++) {
    indices.push(0, 2 + i, 1 + i);
  }

  const row = radialSegments + 1;
  for (let ring = 1; ring < ringSegments; ring++) {
    const innerStart = 1 + (ring - 1) * row;
    const outerStart = 1 + ring * row;
    for (let i = 0; i < radialSegments; i++) {
      const a = innerStart + i;
      const b = a + 1;
      const c = outerStart + i;
      const d = c + 1;
      indices.push(a, d, c, a, b, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  return geometry;
}

function createRimCurve(height, capRadius, phase) {
  const points = [];
  const count = 96;
  for (let i = 0; i < count; i++) {
    const theta = i / count * Math.PI * 2;
    const wave = radialWave(theta, phase);
    const radius = capRadius * (1 + wave);
    const y = height + capRadius * (
      0.058 * Math.sin(theta * 3 + phase) +
      0.028 * Math.sin(theta * 6 - phase)
    );
    points.push(new THREE.Vector3(
      Math.cos(theta) * radius,
      y,
      Math.sin(theta) * radius
    ));
  }
  return new THREE.CatmullRomCurve3(points, true, 'centripetal');
}

function addGills(group, height, stemRadius, capRadius, phase, count) {
  for (let g = 0; g < count; g++) {
    const theta = phase * 0.12 + g / count * Math.PI * 2;
    const alternating = g % 3;
    const startU = alternating === 0 ? 0.05 : alternating === 1 ? 0.18 : 0.31;
    const points = [];
    const pointCount = 12;

    for (let p = 0; p < pointCount; p++) {
      const u = startU + (1 - startU) * p / (pointCount - 1);
      const flare = Math.pow(u, 1.26);
      const radius = THREE.MathUtils.lerp(stemRadius * (1.02 + startU * 0.42), capRadius * 0.965, flare);
      const angularDrift = 0.055 * Math.sin(u * Math.PI) * Math.sin(theta * 2 + phase);
      const angle = theta + angularDrift;
      const rimWave = radialWave(angle, phase) * Math.pow(u, 4);
      const adjustedRadius = radius * (1 + rimWave);
      const y = THREE.MathUtils.lerp(
        height * (0.48 + startU * 0.13),
        height - capRadius * 0.025,
        Math.pow(u, 0.74)
      ) - 0.024;
      points.push(new THREE.Vector3(
        Math.cos(angle) * adjustedRadius,
        y,
        Math.sin(angle) * adjustedRadius
      ));
    }

    const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
    const thickness = capRadius * (g % 2 === 0 ? 0.018 : 0.014);
    const geometry = new THREE.TubeGeometry(curve, 34, thickness, 5, false);
    const ridge = new THREE.Mesh(geometry, ridgeMaterial);
    ridge.castShadow = true;
    ridge.receiveShadow = true;
    group.add(ridge);
  }
}

function createMushroom(config) {
  const group = new THREE.Group();
  const { height, stemRadius, capRadius, phase } = config;

  const body = new THREE.Mesh(
    createBodyGeometry(height, stemRadius, capRadius, phase),
    porcelainMaterial
  );
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  const cap = new THREE.Mesh(
    createCapGeometry(height, stemRadius, capRadius, phase),
    porcelainMaterial
  );
  cap.castShadow = true;
  cap.receiveShadow = true;
  group.add(cap);

  const rimCurve = createRimCurve(height, capRadius, phase);
  const rimGeometry = new THREE.TubeGeometry(rimCurve, 128, capRadius * 0.035, 7, true);
  const rim = new THREE.Mesh(rimGeometry, rimMaterial);
  rim.castShadow = true;
  rim.receiveShadow = true;
  group.add(rim);

  addGills(group, height, stemRadius, capRadius, phase, config.gills);

  group.position.copy(config.position);
  group.rotation.set(config.rotation.x, config.rotation.y, config.rotation.z);
  return group;
}

const cluster = new THREE.Group();

const baseCore = new THREE.Mesh(new THREE.SphereGeometry(0.82, 48, 28), baseMaterial);
baseCore.scale.set(1.25, 0.42, 0.92);
baseCore.position.set(0, 0.22, 0);
baseCore.castShadow = true;
baseCore.receiveShadow = true;
cluster.add(baseCore);

const baseLobeA = new THREE.Mesh(new THREE.SphereGeometry(0.52, 36, 24), baseMaterial);
baseLobeA.scale.set(1.15, 0.45, 0.9);
baseLobeA.position.set(-0.48, 0.22, 0.05);
baseLobeA.castShadow = true;
baseLobeA.receiveShadow = true;
cluster.add(baseLobeA);

const baseLobeB = new THREE.Mesh(new THREE.SphereGeometry(0.5, 36, 24), baseMaterial);
baseLobeB.scale.set(1.1, 0.43, 0.92);
baseLobeB.position.set(0.48, 0.21, 0.04);
baseLobeB.castShadow = true;
baseLobeB.receiveShadow = true;
cluster.add(baseLobeB);

const mushrooms = [
  {
    height: 3.05,
    stemRadius: 0.25,
    capRadius: 0.91,
    phase: 0.45,
    gills: 20,
    position: new THREE.Vector3(0, 0.28, 0.05),
    rotation: new THREE.Euler(0.025, -0.1, -0.045)
  },
  {
    height: 2.42,
    stemRadius: 0.22,
    capRadius: 0.75,
    phase: 2.15,
    gills: 17,
    position: new THREE.Vector3(-0.39, 0.26, 0.05),
    rotation: new THREE.Euler(-0.055, 0.16, 0.255)
  },
  {
    height: 2.62,
    stemRadius: 0.23,
    capRadius: 0.79,
    phase: 4.1,
    gills: 18,
    position: new THREE.Vector3(0.42, 0.25, 0.08),
    rotation: new THREE.Euler(0.1, -0.19, -0.245)
  }
];

for (const config of mushrooms) {
  cluster.add(createMushroom(config));
}

cluster.rotation.y = -0.22;
cluster.position.y = 0.01;
scene.add(cluster);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xe7dfd0,
  roughness: 0.72,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.03;
floor.receiveShadow = true;
scene.add(floor);

const shadowDiscMaterial = new THREE.MeshBasicMaterial({
  color: 0x8d6d4e,
  transparent: true,
  opacity: 0.055,
  depthWrite: false
});
const shadowDisc = new THREE.Mesh(new THREE.CircleGeometry(2.05, 64), shadowDiscMaterial);
shadowDisc.rotation.x = -Math.PI / 2;
shadowDisc.position.set(0, -0.015, 0.08);
scene.add(shadowDisc);

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
