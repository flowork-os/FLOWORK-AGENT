<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Standing Person</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d8dce2;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdce1e7);
scene.fog = new THREE.Fog(0xdce1e7, 5.5, 12);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 30);
camera.position.set(3.2, 2.15, 4.7);
camera.lookAt(0, 1.02, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.02, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 2.6;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.49;

const hemi = new THREE.HemisphereLight(0xf5f8ff, 0x70747a, 1.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2df, 3.2);
key.position.set(3.5, 5.5, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -2.5;
key.shadow.camera.right = 2.5;
key.shadow.camera.top = 3.5;
key.shadow.camera.bottom = -1.5;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 12;
key.shadow.bias = -0.00025;
scene.add(key);

const fill = new THREE.DirectionalLight(0xb7ceff, 1.05);
fill.position.set(-4, 2.8, 2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.4);
rim.position.set(1, 3, -4);
scene.add(rim);

const groundMat = new THREE.MeshStandardMaterial({
  color: 0xbfc5cc,
  roughness: 0.9,
  metalness: 0
});
const ground = new THREE.Mesh(new THREE.CircleGeometry(5.5, 96), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const person = new THREE.Group();
person.rotation.y = -0.12;
scene.add(person);

const skin = new THREE.MeshStandardMaterial({ color: 0xb97854, roughness: 0.72 });
const skinLight = new THREE.MeshStandardMaterial({ color: 0xc98964, roughness: 0.72 });
const jacket = new THREE.MeshStandardMaterial({ color: 0x455765, roughness: 0.82 });
const jacketDark = new THREE.MeshStandardMaterial({ color: 0x293842, roughness: 0.86 });
const shirt = new THREE.MeshStandardMaterial({ color: 0xe6e1d7, roughness: 0.85 });
const denim = new THREE.MeshStandardMaterial({ color: 0x344d69, roughness: 0.9 });
const denimDark = new THREE.MeshStandardMaterial({ color: 0x26394f, roughness: 0.92 });
const shoe = new THREE.MeshStandardMaterial({ color: 0xe7e4dc, roughness: 0.8 });
const sole = new THREE.MeshStandardMaterial({ color: 0x303236, roughness: 0.88 });
const hair = new THREE.MeshStandardMaterial({ color: 0x241a17, roughness: 0.94 });
const eye = new THREE.MeshStandardMaterial({ color: 0x201a18, roughness: 0.55 });
const metal = new THREE.MeshStandardMaterial({ color: 0x9aa1a4, roughness: 0.4, metalness: 0.45 });

function addMesh(geometry, material, position, scale = [1, 1, 1], parent = person) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(...position);
  mesh.scale.set(...scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function capsuleBetween(a, b, radius, material, radialSegments = 12) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const direction = end.clone().sub(start);
  const length = direction.length();
  const cylinderLength = Math.max(0.001, length - radius * 2);
  const mesh = new THREE.Mesh(
    new THREE.CapsuleGeometry(radius, cylinderLength, 6, radialSegments),
    material
  );
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  person.add(mesh);
  return mesh;
}

function roundedBox(size, radius, segments, material, position, parent = person) {
  return addMesh(
    new RoundedBoxGeometry(size[0], size[1], size[2], segments, radius),
    material,
    position,
    [1, 1, 1],
    parent
  );
}

// Shoes and soles
for (const side of [-1, 1]) {
  roundedBox([0.27, 0.075, 0.47], 0.035, 4, sole, [side * 0.17, 0.045, 0.055]);
  const upper = roundedBox([0.25, 0.13, 0.42], 0.065, 5, shoe, [side * 0.17, 0.118, 0.035]);
  upper.rotation.x = -0.035;
  addMesh(
    new THREE.BoxGeometry(0.205, 0.012, 0.018),
    denimDark,
    [side * 0.17, 0.168, -0.025]
  );
  for (let i = 0; i < 3; i++) {
    const lace = addMesh(
      new THREE.CylinderGeometry(0.006, 0.006, 0.17, 8),
      sole,
      [side * 0.17, 0.186, 0.03 + i * 0.045]
    );
    lace.rotation.z = Math.PI / 2;
    lace.rotation.x = -0.05;
  }
}

// Legs: subtly asymmetric relaxed stance
capsuleBetween([-0.165, 0.18, 0], [-0.175, 0.69, 0.005], 0.112, denim);
capsuleBetween([-0.175, 0.69, 0.005], [-0.155, 1.09, 0], 0.145, denim);
capsuleBetween([0.17, 0.18, 0.015], [0.185, 0.67, 0.01], 0.11, denim);
capsuleBetween([0.185, 0.67, 0.01], [0.155, 1.09, 0], 0.145, denim);

addMesh(new THREE.TorusGeometry(0.105, 0.007, 6, 20), denimDark, [-0.176, 0.668, 0.108])
  .rotation.set(Math.PI / 2, 0, 0);
addMesh(new THREE.TorusGeometry(0.103, 0.007, 6, 20), denimDark, [0.183, 0.65, 0.112])
  .rotation.set(Math.PI / 2, 0, 0);

// Hips and waistband
const hips = addMesh(
  new THREE.CapsuleGeometry(0.29, 0.13, 8, 16),
  denim,
  [0, 1.055, 0],
  [1, 0.72, 0.72]
);
roundedBox([0.51, 0.055, 0.25], 0.022, 4, denimDark, [0, 1.137, 0]);
addMesh(new THREE.BoxGeometry(0.035, 0.035, 0.014), metal, [0, 1.14, 0.132]);

// Shirt visible beneath the open jacket
const shirtTorso = addMesh(
  new THREE.CapsuleGeometry(0.265, 0.36, 8, 18),
  shirt,
  [0, 1.39, 0],
  [1.02, 1, 0.63]
);

// Jacket body, split at the front to imply an opening
const jacketBody = addMesh(
  new THREE.CapsuleGeometry(0.31, 0.38, 8, 18),
  jacket,
  [0, 1.41, -0.015],
  [1.12, 1, 0.72]
);
jacketBody.scale.z = 0.67;

const opening = addMesh(
  new THREE.BoxGeometry(0.105, 0.48, 0.035),
  shirt,
  [0, 1.405, 0.205]
);
opening.rotation.z = 0.015;

const leftPlacket = roundedBox([0.052, 0.48, 0.035], 0.012, 3, jacketDark, [-0.07, 1.405, 0.228]);
leftPlacket.rotation.z = -0.055;
const rightPlacket = roundedBox([0.052, 0.48, 0.035], 0.012, 3, jacketDark, [0.07, 1.405, 0.228]);
rightPlacket.rotation.z = 0.055;

// Collar and lapels
const collarL = roundedBox([0.13, 0.245, 0.035], 0.025, 4, jacketDark, [-0.105, 1.61, 0.22]);
collarL.rotation.z = -0.48;
const collarR = roundedBox([0.13, 0.245, 0.035], 0.025, 4, jacketDark, [0.105, 1.61, 0.22]);
collarR.rotation.z = 0.48;

roundedBox([0.22, 0.12, 0.045], 0.022, 4, jacketDark, [-0.195, 1.34, 0.225]).rotation.z = -0.03;
roundedBox([0.22, 0.12, 0.045], 0.022, 4, jacketDark, [0.195, 1.34, 0.225]).rotation.z = 0.03;

for (const x of [-0.03, 0.03]) {
  addMesh(new THREE.SphereGeometry(0.013, 12, 8), metal, [x, 1.22, 0.249]);
}

// Shoulders and relaxed arms
capsuleBetween([-0.285, 1.58, 0], [-0.43, 1.29, 0.015], 0.105, jacket);
capsuleBetween([-0.43, 1.29, 0.015], [-0.405, 1.03, 0.105], 0.088, jacket);
capsuleBetween([0.285, 1.58, 0], [0.435, 1.3, 0], 0.105, jacket);
capsuleBetween([0.435, 1.3, 0], [0.42, 1.045, 0.09], 0.088, jacket);

addMesh(new THREE.TorusGeometry(0.087, 0.009, 7, 24), jacketDark, [-0.405, 1.055, 0.105])
  .rotation.set(Math.PI / 2, 0, 0);
addMesh(new THREE.TorusGeometry(0.087, 0.009, 7, 24), jacketDark, [0.42, 1.07, 0.09])
  .rotation.set(Math.PI / 2, 0, 0);

// Hands
const leftHand = addMesh(
  new THREE.CapsuleGeometry(0.071, 0.07, 7, 14),
  skin,
  [-0.402, 0.966, 0.115],
  [0.82, 1, 0.72]
);
leftHand.rotation.z = -0.06;
const rightHand = addMesh(
  new THREE.CapsuleGeometry(0.071, 0.07, 7, 14),
  skin,
  [0.417, 0.978, 0.1],
  [0.82, 1, 0.72]
);
rightHand.rotation.z = 0.06;

// Neck
addMesh(new THREE.CylinderGeometry(0.102, 0.115, 0.18, 20), skin, [0, 1.715, 0]);

// Head and jaw
const headGroup = new THREE.Group();
headGroup.position.set(0, 1.83, 0.015);
headGroup.rotation.z = -0.018;
headGroup.rotation.y = 0.025;
person.add(headGroup);

addMesh(
  new THREE.SphereGeometry(0.19, 32, 24),
  skinLight,
  [0, 0.01, 0],
  [0.88, 1.12, 0.91],
  headGroup
);
addMesh(
  new THREE.SphereGeometry(0.145, 24, 18),
  skinLight,
  [0, -0.075, 0.018],
  [0.92, 0.85, 0.92],
  headGroup
);

// Ears
addMesh(new THREE.SphereGeometry(0.035, 16, 10), skin, [-0.171, 0.012, 0], [0.72, 1.08, 0.48], headGroup);
addMesh(new THREE.SphereGeometry(0.035, 16, 10), skin, [0.171, 0.012, 0], [0.72, 1.08, 0.48], headGroup);

// Hair cap and sides
const hairCap = addMesh(
  new THREE.SphereGeometry(0.194, 32, 18, 0, Math.PI * 2, 0, Math.PI * 0.54),
  hair,
  [0, 0.055, -0.006],
  [0.9, 1.03, 0.92],
  headGroup
);
hairCap.rotation.x = -0.03;

addMesh(
  new THREE.SphereGeometry(0.178, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.46),
  hair,
  [0, 0.08, -0.03],
  [0.96, 1, 0.95],
  headGroup
).rotation.x = Math.PI;

// Face
for (const x of [-0.062, 0.062]) {
  addMesh(new THREE.SphereGeometry(0.013, 14, 10), eye, [x, 0.035, 0.169], [1, 0.72, 0.5], headGroup);
  const brow = addMesh(
    new THREE.CapsuleGeometry(0.008, 0.045, 4, 8),
    hair,
    [x, 0.07, 0.166],
    [1, 1, 0.7],
    headGroup
  );
  brow.rotation.z = Math.PI / 2 + x * 0.8;
}

const nose = addMesh(
  new THREE.ConeGeometry(0.025, 0.065, 16),
  skin,
  [0, -0.005, 0.192],
  [0.78, 1, 0.78],
  headGroup
);
nose.rotation.x = Math.PI / 2;

const mouth = addMesh(
  new THREE.TorusGeometry(0.033, 0.006, 6, 24, Math.PI * 0.78),
  new THREE.MeshStandardMaterial({ color: 0x713d37, roughness: 0.8 }),
  [0, -0.073, 0.174],
  [1, 0.55, 0.7],
  headGroup
);
mouth.rotation.z = Math.PI * 0.11;

// Soft contact shadow
const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(0.55, 48),
  new THREE.MeshBasicMaterial({
    color: 0x4b5058,
    transparent: true,
    opacity: 0.15,
    depthWrite: false
  })
);
shadow.scale.set(1, 0.5, 1);
shadow.rotation.x = -Math.PI / 2;
shadow.position.y = 0.003;
scene.add(shadow);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  person.position.y = Math.sin(t * 1.15) * 0.002;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
