<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taco Truck Corner</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f6a86c;
    }
    canvas { display: block; }
    #title {
      position: fixed;
      left: 22px;
      top: 18px;
      z-index: 2;
      color: #fff8dc;
      font: 700 18px/1.15 system-ui, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-shadow: 0 2px 12px rgba(70, 25, 35, .45);
      pointer-events: none;
    }
    #title span {
      display: block;
      margin-top: 4px;
      color: #ffe29b;
      font-size: 10px;
      letter-spacing: .22em;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="title">La Esquina<span>Tacos · Sunset · Good Times</span></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xd98772, 0.016);

    const camera = new THREE.PerspectiveCamera(
      42,
      innerWidth / innerHeight,
      0.1,
      120
    );
    camera.position.set(15, 10, 18);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.13;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(-0.4, 2.2, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.32;
    controls.minDistance = 11;
    controls.maxDistance = 35;
    controls.maxPolarAngle = Math.PI * 0.48;

    function mulberry32(seed) {
      return function () {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    const random = mulberry32(738251);

    function rand(min, max) {
      return min + (max - min) * random();
    }

    function choose(array) {
      return array[Math.floor(random() * array.length)];
    }

    function mat(color, roughness = 0.72, metalness = 0.02) {
      return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness
      });
    }

    function box(name, size, position, material, rotation = null) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(size[0], size[1], size[2]),
        material
      );
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      if (rotation) {
        mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
      }
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function cylinder(
      name,
      radiusTop,
      radiusBottom,
      height,
      segments,
      position,
      material,
      rotation = null
    ) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(
          radiusTop,
          radiusBottom,
          height,
          segments
        ),
        material
      );
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      if (rotation) {
        mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
      }
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function canvasTexture(width, height, draw) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d');
      draw(context, width, height);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    const skyTexture = canvasTexture(32, 512, (ctx, width, height) => {
      const gradient = ctx.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, '#5b62a9');
      gradient.addColorStop(0.36, '#e46f84');
      gradient.addColorStop(0.7, '#f6a360');
      gradient.addColorStop(1, '#ffd38c');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
    });

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(58, 40, 24),
      new THREE.MeshBasicMaterial({
        map: skyTexture,
        side: THREE.BackSide,
        fog: false
      })
    );
    sky.scale.y = 0.72;
    scene.add(sky);

    const sun = new THREE.Mesh(
      new THREE.CircleGeometry(3.2, 48),
      new THREE.MeshBasicMaterial({
        color: 0xffd58b,
        transparent: true,
        opacity: 0.78,
        fog: false
      })
    );
    sun.position.set(-18, 12, -36);
    sun.lookAt(camera.position);
    scene.add(sun);

    const hemi = new THREE.HemisphereLight(0xbfc8ff, 0x8f4b35, 2.0);
    scene.add(hemi);

    const sunsetLight = new THREE.DirectionalLight(0xffb26c, 4.1);
    sunsetLight.position.set(-12, 17, 10);
    sunsetLight.castShadow = true;
    sunsetLight.shadow.mapSize.set(2048, 2048);
    sunsetLight.shadow.camera.left = -18;
    sunsetLight.shadow.camera.right = 18;
    sunsetLight.shadow.camera.top = 16;
    sunsetLight.shadow.camera.bottom = -12;
    sunsetLight.shadow.camera.near = 1;
    sunsetLight.shadow.camera.far = 50;
    sunsetLight.shadow.bias = -0.0004;
    scene.add(sunsetLight);

    const fillLight = new THREE.DirectionalLight(0x697de3, 1.15);
    fillLight.position.set(10, 9, -10);
    scene.add(fillLight);

    const asphalt = mat(0x45464e, 0.96);
    const concrete = mat(0xb79e8c, 0.96);
    const curbMat = mat(0xe4d4bd, 0.9);
    const wallMat = mat(0xd48872, 0.9);

    box(
      'street',
      [40, 0.35, 23],
      [0, -0.25, 4.4],
      asphalt
    );

    box(
      'sidewalk',
      [40, 0.42, 8],
      [0, 0.02, -7.2],
      concrete
    );

    box(
      'curb',
      [40, 0.55, 0.5],
      [0, 0.02, -3.1],
      curbMat
    );

    box(
      'back wall',
      [40, 5.5, 0.5],
      [0, 2.55, -11.2],
      wallMat
    );

    const lanePaint = mat(0xf2cc68, 0.82);
    for (let x = -17; x <= 17; x += 5.5) {
      box(
        'lane dash',
        [2.7, 0.035, 0.15],
        [x, -0.055, 10.3],
        lanePaint
      );
    }

    const sidewalkLine = mat(0x8f786e, 1);
    for (let x = -18; x < 20; x += 3.2) {
      box(
        'sidewalk joint',
        [0.025, 0.012, 7.5],
        [x, 0.24, -7.2],
        sidewalkLine
      );
    }

    const muralTexture = canvasTexture(1024, 256, (ctx, width, height) => {
      ctx.fillStyle = '#f04f54';
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#f8c34b';
      ctx.beginPath();
      ctx.arc(150, 136, 95, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#22a69a';
      for (let i = 0; i < 8; i++) {
        ctx.save();
        ctx.translate(150, 136);
        ctx.rotate(i * Math.PI / 4);
        ctx.fillRect(72, -11, 145, 22);
        ctx.restore();
      }

      ctx.fillStyle = '#fff0c8';
      ctx.font = '900 66px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('LA ESQUINA', 590, 96);

      ctx.fillStyle = '#fff0c8';
      ctx.font = '900 45px sans-serif';
      ctx.fillText('TACOS', 590, 164);

      ctx.strokeStyle = '#292243';
      ctx.lineWidth = 9;
      ctx.strokeRect(18, 18, width - 36, height - 36);
    });

    const menuTexture = canvasTexture(512, 768, (ctx, width, height) => {
      ctx.fillStyle = '#152e2b';
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = '#e8c96c';
      ctx.lineWidth = 12;
      ctx.strokeRect(18, 18, width - 36, height - 36);

      ctx.fillStyle = '#f8e9bd';
      ctx.textAlign = 'center';
      ctx.font = 'bold 64px cursive';
      ctx.fillText('TACOS', width / 2, 100);

      ctx.font = 'bold 31px sans-serif';
      ctx.textAlign = 'left';
      const rows = [
        ['AL PASTOR', '$4'],
        ['CARNITAS', '$4'],
        ['NOPALES', '$3'],
        ['PESCADO', '$5'],
        ['HORCHATA', '$3']
      ];

      rows.forEach((row, index) => {
        const y = 205 + index * 92;
        ctx.fillStyle = index % 2 ? '#9edeb0' : '#f8e9bd';
        ctx.fillText(row[0], 48, y);
        ctx.textAlign = 'right';
        ctx.fillText(row[1], 465, y);
        ctx.textAlign = 'left';
      });

      ctx.fillStyle = '#ef6f61';
      ctx.textAlign = 'center';
      ctx.font = 'bold 28px sans-serif';
      ctx.fillText('SALSA WITH EVERYTHING!', width / 2, 695);
    });

    const signTexture = canvasTexture(768, 256, (ctx, width, height) => {
      ctx.fillStyle = '#f7d566';
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = '#e94e55';
      ctx.lineWidth = 18;
      ctx.strokeRect(14, 14, width - 28, height - 28);
      ctx.fillStyle = '#263959';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '900 96px sans-serif';
      ctx.fillText('¡TACOS!', width / 2, height / 2 + 5);
    });

    const truck = new THREE.Group();
    truck.position.set(-0.7, 0.35, -1.0);
    scene.add(truck);

    function truckBox(name, size, position, material, rotation = null) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(size[0], size[1], size[2]),
        material
      );
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      if (rotation) {
        mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
      }
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      truck.add(mesh);
      return mesh;
    }

    const red = mat(0xe95150, 0.58, 0.08);
    const cream = mat(0xffe5b0, 0.72);
    const teal = mat(0x198f91, 0.62, 0.06);
    const dark = mat(0x17252c, 0.72);
    const metal = mat(0xa6b2b4, 0.34, 0.72);
    const glass = new THREE.MeshStandardMaterial({
      color: 0x68a7b8,
      roughness: 0.16,
      metalness: 0.08,
      transparent: true,
      opacity: 0.67
    });

    truckBox(
      'truck main body',
      [7.5, 3.25, 3.4],
      [-0.7, 2.05, 0],
      red
    );

    truckBox(
      'cream roof band',
      [7.65, 0.42, 3.52],
      [-0.7, 3.72, 0],
      cream
    );

    truckBox(
      'lower teal band',
      [7.55, 0.58, 3.45],
      [-0.7, 0.72, 0],
      teal
    );

    const muralPanel = new THREE.Mesh(
      new THREE.PlaneGeometry(4.25, 1.05),
      new THREE.MeshStandardMaterial({
        map: muralTexture,
        roughness: 0.66
      })
    );
    muralPanel.position.set(-1.45, 1.22, -1.706);
    muralPanel.rotation.y = Math.PI;
    muralPanel.castShadow = true;
    truck.add(muralPanel);

    truckBox(
      'cab nose',
      [1.65, 1.85, 3.2],
      [3.75, 1.48, 0],
      cream
    );

    truckBox(
      'cab hood',
      [1.55, 0.78, 3.0],
      [4.28, 1.1, 0],
      cream
    );

    truckBox(
      'cab windshield',
      [0.08, 0.88, 2.65],
      [3.83, 2.24, 0],
      glass,
      [0, 0, -0.18]
    );

    truckBox(
      'front bumper',
      [0.22, 0.25, 3.25],
      [5.05, 0.63, 0],
      metal
    );

    truckBox(
      'rear bumper',
      [0.24, 0.24, 3.5],
      [-4.56, 0.62, 0],
      metal
    );

    const wheelMaterial = mat(0x19191d, 0.94);
    const hubMaterial = mat(0xd7c9a5, 0.4, 0.5);

    for (const x of [-3.3, 3.25]) {
      for (const z of [-1.72, 1.72]) {
        const wheel = new THREE.Mesh(
          new THREE.CylinderGeometry(0.62, 0.62, 0.34, 24),
          wheelMaterial
        );
        wheel.position.set(x, 0.65, z);
        wheel.rotation.x = Math.PI / 2;
        wheel.castShadow = true;
        truck.add(wheel);

        const hub = new THREE.Mesh(
          new THREE.CylinderGeometry(0.28, 0.28, 0.36, 16),
          hubMaterial
        );
        hub.position.copy(wheel.position);
        hub.rotation.x = Math.PI / 2;
        hub.castShadow = true;
        truck.add(hub);
      }
    }

    truckBox(
      'serving window recess',
      [3.55, 1.72, 0.08],
      [-1.2, 2.45, 1.725],
      dark
    );

    const interiorGlow = new THREE.PointLight(0xffb552, 10, 7, 2);
    interiorGlow.position.set(-1.25, 2.55, 1.25);
    truck.add(interiorGlow);

    truckBox(
      'serving sill',
      [4.25, 0.18, 0.9],
      [-1.2, 1.53, 2.06],
      metal
    );

    const plywood = mat(0xc98a4f, 0.82);
    truckBox(
      'plywood counter top',
      [4.7, 0.18, 1.0],
      [-1.0, 1.26, 2.28],
      plywood
    );

    truckBox(
      'counter support left',
      [0.14, 1.1, 0.14],
      [-3.05, 0.73, 2.35],
      metal
    );

    truckBox(
      'counter support right',
      [0.14, 1.1, 0.14],
      [1.05, 0.73, 2.35],
      metal
    );

    const hatch = truckBox(
      'raised serving hatch',
      [3.85, 0.16, 1.62],
      [-1.2, 3.48, 2.12],
      teal,
      [-0.62, 0, 0]
    );
    hatch.castShadow = true;

    const menu = new THREE.Mesh(
      new THREE.PlaneGeometry(0.95, 1.42),
      new THREE.MeshStandardMaterial({
        map: menuTexture,
        roughness: 0.78
      })
    );
    menu.position.set(1.0, 2.35, 1.75);
    truck.add(menu);

    const menuFrame = truckBox(
      'menu frame',
      [1.1, 1.58, 0.08],
      [1.0, 2.35, 1.71],
      plywood
    );
    menuFrame.position.z = 1.7;
    menu.position.z = 1.755;

    const roofSign = new THREE.Mesh(
      new THREE.BoxGeometry(3.25, 1.08, 0.18),
      [
        metal,
        metal,
        metal,
        metal,
        new THREE.MeshStandardMaterial({
          map: signTexture,
          roughness: 0.62
        }),
        metal
      ]
    );
    roofSign.position.set(-0.45, 4.45, 0.15);
    roofSign.castShadow = true;
    truck.add(roofSign);

    const bottles = new THREE.Group();
    truck.add(bottles);

    for (let i = 0; i < 7; i++) {
      const bottleMat = mat(
        choose([0x46b6a4, 0xf2bf48, 0xed5a5a, 0x80bce0]),
        0.34,
        0.08
      );
      const bottle = new THREE.Mesh(
        new THREE.CylinderGeometry(0.055, 0.07, 0.34, 10),
        bottleMat
      );
      bottle.position.set(-2.65 + i * 0.38, 1.7, 1.86);
      bottle.castShadow = true;
      bottles.add(bottle);

      const cap = new THREE.Mesh(
        new THREE.CylinderGeometry(0.035, 0.035, 0.06, 10),
        metal
      );
      cap.position.set(
        bottle.position.x,
        bottle.position.y + 0.2,
        bottle.position.z
      );
      bottles.add(cap);
    }

    function createStool(x, z, color) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      scene.add(group);

      const seat = new THREE.Mesh(
        new THREE.CylinderGeometry(0.38, 0.42, 0.18, 20),
        mat(color, 0.58)
      );
      seat.position.y = 1.12;
      seat.castShadow = true;
      group.add(seat);

      for (let i = 0; i < 4; i++) {
        const angle = i * Math.PI / 2 + Math.PI / 4;
        const leg = new THREE.Mesh(
          new THREE.CylinderGeometry(0.035, 0.045, 1.05, 8),
          metal
        );
        leg.position.set(
          Math.cos(angle) * 0.25,
          0.57,
          Math.sin(angle) * 0.25
        );
        leg.rotation.z = Math.cos(angle) * 0.09;
        leg.rotation.x = Math.sin(angle) * 0.09;
        leg.castShadow = true;
        group.add(leg);
      }
    }

    createStool(-3.0, 2.25, 0xf4c94e);
    createStool(-1.45, 2.25, 0x32a6a0);
    createStool(0.1, 2.25, 0xef5a60);

    const lamppost = new THREE.Group();
    lamppost.position.set(7.1, 0.25, -2.25);
    scene.add(lamppost);

    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.17, 7.4, 14),
      mat(0x263743, 0.48, 0.58)
    );
    pole.position.y = 3.7;
    pole.castShadow = true;
    lamppost.add(pole);

    const poleBase = new THREE.Mesh(
      new THREE.CylinderGeometry(0.42, 0.52, 0.45, 16),
      dark
    );
    poleBase.position.y = 0.22;
    poleBase.castShadow = true;
    lamppost.add(poleBase);

    const arm = new THREE.Mesh(
      new THREE.TorusGeometry(0.85, 0.11, 10, 24, Math.PI),
      dark
    );
    arm.position.set(-0.82, 7.0, 0);
    arm.rotation.z = Math.PI / 2;
    lamppost.add(arm);

    const lampShade = new THREE.Mesh(
      new THREE.ConeGeometry(0.48, 0.45, 20, 1, true),
      dark
    );
    lampShade.position.set(-1.58, 6.85, 0);
    lampShade.rotation.z = Math.PI;
    lampShade.castShadow = true;
    lamppost.add(lampShade);

    const lampBulb = new THREE.Mesh(
      new THREE.SphereGeometry(0.2, 16, 12),
      new THREE.MeshStandardMaterial({
        color: 0xffd57c,
        emissive: 0xff9a31,
        emissiveIntensity: 3
      })
    );
    lampBulb.position.set(-1.58, 6.62, 0);
    lamppost.add(lampBulb);

    const lampLight = new THREE.PointLight(0xffa53f, 15, 10, 2);
    lampLight.position.copy(lampBulb.position);
    lampLight.castShadow = true;
    lampLight.shadow.mapSize.set(512, 512);
    lamppost.add(lampLight);

    function curveBetween(points, material, radius = 0.018) {
      const curve = new THREE.CatmullRomCurve3(points);
      const mesh = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 48, radius, 6, false),
        material
      );
      mesh.castShadow = true;
      scene.add(mesh);
      return curve;
    }

    const cableCurve = curveBetween(
      [
        new THREE.Vector3(-3.6, 5.0, 0.2),
        new THREE.Vector3(-0.3, 4.7, 0.0),
        new THREE.Vector3(3.2, 5.0, -0.7),
        new THREE.Vector3(5.55, 6.82, -2.25)
      ],
      dark,
      0.025
    );

    const bulbMeshes = [];
    const bulbLights = [];

    for (let i = 1; i < 17; i++) {
      const t = i / 17;
      const point = cableCurve.getPoint(t);
      const bulbMaterial = new THREE.MeshStandardMaterial({
        color: 0xffdb82,
        emissive: 0xff9a35,
        emissiveIntensity: 2.2
      });

      const bulb = new THREE.Mesh(
        new THREE.SphereGeometry(0.095, 12, 8),
        bulbMaterial
      );
      bulb.position.copy(point);
      bulb.position.y -= 0.13;
      bulb.userData.phase = rand(0, Math.PI * 2);
      scene.add(bulb);
      bulbMeshes.push(bulb);

      if (i % 4 === 0) {
        const light = new THREE.PointLight(0xffaa45, 2.6, 3.4, 2);
        light.position.copy(bulb.position);
        scene.add(light);
        bulbLights.push(light);
      }
    }

    const palm = new THREE.Group();
    palm.position.set(-7.0, 0.12, -5.9);
    scene.add(palm);

    const trunkSegments = [];
    let trunkY = 0;

    for (let i = 0; i < 8; i++) {
      const height = 0.9;
      const segment = new THREE.Mesh(
        new THREE.CylinderGeometry(
          0.25 - i * 0.012,
          0.32 - i * 0.012,
          height,
          9
        ),
        mat(i % 2 ? 0x8c5838 : 0x9e6741, 0.95)
      );
      segment.position.set(
        Math.sin(i * 0.48) * 0.11,
        trunkY + height / 2,
        Math.cos(i * 0.4) * 0.05
      );
      segment.rotation.z = -0.025 * i;
      segment.castShadow = true;
      palm.add(segment);
      trunkSegments.push(segment);
      trunkY += 0.82;
    }

    const leafMaterial = mat(0x287c55, 0.78);
    const leafMaterialLight = mat(0x4da760, 0.78);
    const palmLeaves = [];

    function palmLeaf(angle, tilt, scale, material) {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0);
      shape.quadraticCurveTo(1.2, 0.42, 3.0, 0.08);
      shape.quadraticCurveTo(1.35, -0.12, 0, 0);

      const leaf = new THREE.Mesh(
        new THREE.ShapeGeometry(shape, 12),
        material
      );
      leaf.position.set(-0.18, 6.55, 0);
      leaf.rotation.set(tilt, angle, -0.08);
      leaf.scale.setScalar(scale);
      leaf.castShadow = true;
      leaf.userData.baseZ = leaf.rotation.z;
      leaf.userData.phase = angle;
      palm.add(leaf);
      palmLeaves.push(leaf);
    }

    for (let i = 0; i < 11; i++) {
      palmLeaf(
        i / 11 * Math.PI * 2,
        rand(-0.25, 0.24),
        rand(0.82, 1.12),
        i % 2 ? leafMaterial : leafMaterialLight
      );
    }

    const coconuts = mat(0x6f4a2e, 0.9);
    for (let i = 0; i < 4; i++) {
      const coconut = new THREE.Mesh(
        new THREE.SphereGeometry(0.22, 12, 8),
        coconuts
      );
      coconut.position.set(
        Math.cos(i * 1.7) * 0.25,
        6.35 + rand(-0.12, 0.12),
        Math.sin(i * 1.7) * 0.25
      );
      coconut.castShadow = true;
      palm.add(coconut);
    }

    function createCrate(x, y, z, scale = 1) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.scale.setScalar(scale);
      scene.add(group);

      const wood = mat(0xad6b36, 0.9);
      const slats = [
        [0, -0.36, 0, 1.45, 0.14, 0.88],
        [0, 0.36, 0, 1.45, 0.14, 0.88],
        [-0.65, 0, 0, 0.14, 0.78, 0.88],
        [0.65, 0, 0, 0.14, 0.78, 0.88]
      ];

      slats.forEach(s => {
        const slat = new THREE.Mesh(
          new THREE.BoxGeometry(s[3], s[4], s[5]),
          wood
        );
        slat.position.set(s[0], s[1], s[2]);
        slat.castShadow = true;
        group.add(slat);
      });

      for (let i = 0; i < 9; i++) {
        const lime = new THREE.Mesh(
          new THREE.SphereGeometry(rand(0.11, 0.15), 12, 8),
          mat(choose([0x74bd35, 0x8dc840, 0x57a82d]), 0.82)
        );
        lime.position.set(
          rand(-0.48, 0.48),
          rand(-0.16, 0.32),
          rand(-0.3, 0.3)
        );
        lime.castShadow = true;
        group.add(lime);
      }
    }

    createCrate(-5.0, 0.63, -2.3, 1);
    createCrate(-4.75, 1.45, -2.35, 0.86);
    createCrate(-5.95, 0.55, -2.5, 0.82);

    const cooler = new THREE.Group();
    cooler.position.set(3.25, 0.24, 1.9);
    scene.add(cooler);

    const coolerBody = new THREE.Mesh(
      new THREE.BoxGeometry(1.55, 0.95, 1.05),
      mat(0x54a9c7, 0.55)
    );
    coolerBody.position.y = 0.48;
    coolerBody.castShadow = true;
    cooler.add(coolerBody);

    const coolerLid = new THREE.Mesh(
      new THREE.BoxGeometry(1.68, 0.16, 1.16),
      cream
    );
    coolerLid.position.set(0, 1.0, -0.12);
    coolerLid.rotation.x = -0.22;
    coolerLid.castShadow = true;
    cooler.add(coolerLid);

    const ice = new THREE.Mesh(
      new THREE.BoxGeometry(1.25, 0.14, 0.78),
      new THREE.MeshStandardMaterial({
        color: 0xcdefff,
        roughness: 0.22,
        transparent: true,
        opacity: 0.75
      })
    );
    ice.position.set(0, 0.98, 0.04);
    cooler.add(ice);

    for (let i = 0; i < 8; i++) {
      const can = new THREE.Mesh(
        new THREE.CylinderGeometry(0.09, 0.09, 0.36, 12),
        mat(choose([0xe64f4e, 0xf5ca4d, 0x3ca5a5]), 0.3, 0.25)
      );
      can.position.set(
        rand(-0.48, 0.48),
        1.13,
        rand(-0.24, 0.28)
      );
      can.rotation.z = rand(-0.35, 0.35);
      can.castShadow = true;
      cooler.add(can);
    }

    const cone = new THREE.Group();
    cone.position.set(5.8, 0.05, 2.2);
    cone.rotation.y = -0.18;
    scene.add(cone);

    const coneOrange = mat(0xf06b35, 0.72);
    const coneWhite = mat(0xf5e7cf, 0.7);

    const coneBase = new THREE.Mesh(
      new THREE.BoxGeometry(0.9, 0.12, 0.9),
      coneOrange
    );
    coneBase.position.y = 0.06;
    coneBase.castShadow = true;
    cone.add(coneBase);

    const coneBody = new THREE.Mesh(
      new THREE.ConeGeometry(0.38, 1.25, 20),
      coneOrange
    );
    coneBody.position.y = 0.72;
    coneBody.castShadow = true;
    cone.add(coneBody);

    const coneStripe = new THREE.Mesh(
      new THREE.CylinderGeometry(0.25, 0.31, 0.18, 20),
      coneWhite
    );
    coneStripe.position.y = 0.72;
    coneStripe.castShadow = true;
    cone.add(coneStripe);

    const buntingFlags = [];
    const buntingMaterialColors = [
      0xef4d5a,
      0xf7c748,
      0x2aa9a0,
      0x7c59a7,
      0xf08336
    ];

    const buntingCurve = curveBetween(
      [
        new THREE.Vector3(-8.0, 6.2, -5.1),
        new THREE.Vector3(-3.5, 5.25, -3.8),
        new THREE.Vector3(1.5, 5.35, -4.1),
        new THREE.Vector3(6.8, 6.3, -3.0)
      ],
      dark,
      0.018
    );

    const flagShape = new THREE.Shape();
    flagShape.moveTo(-0.32, 0);
    flagShape.lineTo(0.32, 0);
    flagShape.lineTo(0.32, -0.55);
    flagShape.lineTo(0, -0.4);
    flagShape.lineTo(-0.32, -0.55);
    flagShape.closePath();

    for (let i = 1; i < 24; i++) {
      const point = buntingCurve.getPoint(i / 24);
      const flag = new THREE.Mesh(
        new THREE.ShapeGeometry(flagShape),
        new THREE.MeshStandardMaterial({
          color: buntingMaterialColors[i % buntingMaterialColors.length],
          roughness: 0.75,
          side: THREE.DoubleSide
        })
      );
      flag.position.copy(point);
      flag.rotation.y = rand(-0.12, 0.12);
      flag.userData.phase = rand(0, Math.PI * 2);
      flag.userData.baseY = flag.rotation.y;
      flag.castShadow = true;
      scene.add(flag);
      buntingFlags.push(flag);
    }

    function createPlanter(x, z, color) {
      const pot = new THREE.Mesh(
        new THREE.CylinderGeometry(0.42, 0.3, 0.55, 12),
        mat(color, 0.9)
      );
      pot.position.set(x, 0.5, z);
      pot.castShadow = true;
      scene.add(pot);

      for (let i = 0; i < 7; i++) {
        const blade = new THREE.Mesh(
          new THREE.ConeGeometry(0.08, rand(0.6, 1.05), 7),
          mat(choose([0x3a7d45, 0x589a4b, 0x779f4b]), 0.84)
        );
        blade.position.set(
          x + rand(-0.22, 0.22),
          1.0 + rand(0, 0.18),
          z + rand(-0.2, 0.2)
        );
        blade.rotation.z = rand(-0.35, 0.35);
        blade.castShadow = true;
        scene.add(blade);
      }
    }

    createPlanter(9.2, -7.5, 0x507e83);
    createPlanter(-10.2, -8.0, 0xd36b4c);

    const roofVent = cylinder(
      'roof vent',
      0.42,
      0.42,
      0.35,
      18,
      [-1.0, 4.75, -1.1],
      metal
    );
    roofVent.position.x -= 0.7;
    roofVent.position.z += 0.1;

    const antenna = cylinder(
      'antenna',
      0.025,
      0.035,
      1.35,
      8,
      [1.15, 5.18, -1.3],
      dark
    );
    antenna.rotation.z = -0.12;

    const antennaBall = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 10, 8),
      mat(0xf1c84f, 0.5)
    );
    antennaBall.position.set(1.07, 5.85, -1.3);
    antennaBall.castShadow = true;
    scene.add(antennaBall);

    const smallProps = new THREE.Group();
    scene.add(smallProps);

    for (let i = 0; i < 5; i++) {
      const napkin = new THREE.Mesh(
        new THREE.BoxGeometry(0.18, 0.12, 0.18),
        mat(choose([0xffffff, 0xf6d75b, 0xeb665e]), 0.78)
      );
      napkin.position.set(
        -3.1 + i * 0.7,
        1.67,
        1.43
      );
      napkin.castShadow = true;
      smallProps.add(napkin);
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();

      buntingFlags.forEach((flag, index) => {
        flag.rotation.y =
          flag.userData.baseY +
          Math.sin(elapsed * 2.2 + flag.userData.phase) * 0.18;
        flag.rotation.z =
          Math.sin(elapsed * 1.65 + index * 0.55) * 0.035;
      });

      palmLeaves.forEach((leaf, index) => {
        leaf.rotation.z =
          leaf.userData.baseZ +
          Math.sin(elapsed * 1.05 + leaf.userData.phase) *
          (0.035 + index * 0.001);
        leaf.rotation.x +=
          Math.sin(elapsed * 0.72 + index) * 0.00012;
      });

      bulbMeshes.forEach((bulb, index) => {
        const pulse =
          1.85 +
          Math.sin(elapsed * 2.4 + bulb.userData.phase) * 0.34 +
          Math.sin(elapsed * 6.7 + index) * 0.08;
        bulb.material.emissiveIntensity = pulse;
      });

      bulbLights.forEach((light, index) => {
        light.intensity =
          2.4 + Math.sin(elapsed * 2.1 + index * 1.8) * 0.38;
      });

      lampLight.intensity =
        14.5 + Math.sin(elapsed * 1.4) * 0.7;

      roofSign.rotation.z =
        Math.sin(elapsed * 0.65) * 0.006;

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    animate();
  </script>
</body>
</html>
