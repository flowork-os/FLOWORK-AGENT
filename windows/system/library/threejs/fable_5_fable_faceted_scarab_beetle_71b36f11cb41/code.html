<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faceted Emerald Scarab</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #08100e; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08100e);
scene.fog = new THREE.Fog(0x08100e, 9, 18);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 60);
camera.position.set(3.4, 2.5, 4.9);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

// ---------- lights ----------
const key = new THREE.DirectionalLight(0xfff2dd, 2.4);
key.position.set(4, 7, 3);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -4; key.shadow.camera.right = 4;
key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
key.shadow.camera.near = 1; key.shadow.camera.far = 20;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);

const rim = new THREE.PointLight(0x35e8c8, 26, 0, 2);
rim.position.set(-4, 2.5, -3);
scene.add(rim);

const amber = new THREE.PointLight(0xffb54d, 18, 0, 2);
amber.position.set(2.6, 1.3, 4);
scene.add(amber);

scene.add(new THREE.HemisphereLight(0x9fe8d8, 0x0c1a14, 0.5));

// ---------- materials ----------
const emeraldMat = new THREE.MeshPhysicalMaterial({
  color: 0x0b7a4e, metalness: 0.1, roughness: 0.12, flatShading: true,
  clearcoat: 1, clearcoatRoughness: 0.18,
  transmission: 0.35, thickness: 1.1, ior: 1.7,
  attenuationColor: new THREE.Color(0x11e69a), attenuationDistance: 1.4,
  envMapIntensity: 1.4
});
const tealMat = emeraldMat.clone();
tealMat.color.set(0x0e7f7c);
tealMat.attenuationColor.set(0x2be8d4);
const bellyMat = new THREE.MeshPhysicalMaterial({
  color: 0x0a3d2c, metalness: 0.2, roughness: 0.3, flatShading: true,
  clearcoat: 0.6, clearcoatRoughness: 0.3, envMapIntensity: 0.8
});
const goldMat = new THREE.MeshStandardMaterial({
  color: 0xd9a13e, metalness: 1, roughness: 0.28, flatShading: true, envMapIntensity: 1.3
});
const eyeMat = new THREE.MeshPhysicalMaterial({
  color: 0x062018, metalness: 0.4, roughness: 0.05, flatShading: true,
  clearcoat: 1, clearcoatRoughness: 0.05, envMapIntensity: 1.6
});

// ---------- helpers ----------
const beetle = new THREE.Group();
scene.add(beetle);

function addMesh(geo, mat) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  beetle.add(m);
  return m;
}

// symmetric crystalline jitter (function of |x| keeps left/right mirror symmetry)
function facet(geo, amp) {
  const p = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const ax = Math.abs(v.x);
    const n = Math.sin(ax * 9.7 + v.y * 7.3) * Math.cos(v.z * 8.1 + ax * 3.3)
            + 0.6 * Math.sin(v.y * 5.1 + v.z * 6.7);
    v.multiplyScalar(1 + amp * n);
    p.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

function gem(det, sx, sy, sz, amp) {
  const g = new THREE.IcosahedronGeometry(1, det);
  facet(g, amp);
  g.scale(sx, sy, sz);
  return g;
}

const UP = new THREE.Vector3(0, 1, 0);
function limb(a, b, r0, r1) {
  const d = new THREE.Vector3().subVectors(b, a);
  const len = d.length();
  const m = addMesh(new THREE.CylinderGeometry(r1, r0, len, 5, 1), goldMat);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(UP, d.normalize());
  return m;
}
function V(a, s) { return new THREE.Vector3(a[0] * s, a[1], a[2]); }

// ---------- body (head faces +z) ----------
// belly / underbody
addMesh(gem(1, 0.8, 0.5, 1.15, 0.04), bellyMat).position.set(0, 0.6, -0.25);

// domed elytra (wing cases) — pair leaning toward the central seam
const elytraGeo = gem(1, 0.62, 0.58, 1.08, 0.05);
const eL = addMesh(elytraGeo, emeraldMat);
eL.position.set(-0.5, 0.78, -0.32);
eL.rotation.set(-0.06, 0, -0.14);
const eR = addMesh(elytraGeo, emeraldMat);
eR.position.set(0.5, 0.78, -0.32);
eR.rotation.set(-0.06, 0, 0.14);

// pronotum (thorax shield) — teal gem
addMesh(gem(1, 0.68, 0.48, 0.52, 0.06), tealMat).position.set(0, 0.82, 0.52);

// horned head — amber-gold
addMesh(gem(1, 0.4, 0.28, 0.34, 0.07), goldMat).position.set(0, 0.6, 1.02);
const horn = addMesh(new THREE.ConeGeometry(0.11, 0.6, 5), goldMat);
horn.position.set(0, 0.95, 1.12);
horn.rotation.x = 0.55;

// eyes — dark emerald gems
for (const s of [1, -1]) {
  addMesh(new THREE.OctahedronGeometry(0.09), eyeMat).position.set(0.37 * s, 0.66, 1.14);
}

// antennae with clubbed tips
for (const s of [1, -1]) {
  const tip = V([0.44, 0.84, 1.55], s);
  limb(V([0.2, 0.55, 1.28], s), tip, 0.03, 0.02);
  addMesh(new THREE.OctahedronGeometry(0.07), goldMat).position.copy(tip);
}

// six angular legs: hip -> knee (raised) -> tapered foot at the ground
const LEGS = [
  [[0.60, 0.55,  0.60], [1.12, 0.80,  0.90], [1.32, 0.02,  1.30]],
  [[0.72, 0.52,  0.02], [1.32, 0.78, -0.05], [1.58, 0.02, -0.20]],
  [[0.66, 0.50, -0.68], [1.20, 0.72, -1.02], [1.48, 0.02, -1.55]]
];
for (const s of [1, -1]) {
  for (const [h, k, f] of LEGS) {
    const H = V(h, s), K = V(k, s), F = V(f, s);
    limb(H, K, 0.10, 0.075);
    limb(K, F, 0.07, 0.022);
    addMesh(new THREE.OctahedronGeometry(0.1), goldMat).position.copy(K);
  }
}

// ---------- ground with soft shadow ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 48).rotateX(-Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x0b1713, roughness: 0.95, metalness: 0, envMapIntensity: 0.3 })
);
ground.receiveShadow = true;
scene.add(ground);

const shadowCatcher = new THREE.Mesh(
  new THREE.CircleGeometry(9, 48).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.35 })
);
shadowCatcher.position.y = 0.001;
shadowCatcher.receiveShadow = true;
scene.add(shadowCatcher);

// ---------- controls / loop ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.7, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.6;
controls.minDistance = 2.5;
controls.maxDistance = 11;
controls.maxPolarAngle = Math.PI / 2 - 0.03;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
