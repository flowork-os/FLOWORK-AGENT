<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barrel Cactus</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eef1f4; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f4);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.2, 3.2, 5.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 3;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.55;

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0xb0a898, 0.55));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
sun.position.set(5, 8, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -4; sun.shadow.camera.right = 4;
sun.shadow.camera.top = 4; sun.shadow.camera.bottom = -4;
sun.shadow.bias = -0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdde8ff, 0.4);
fill.position.set(-4, 3, -3);
scene.add(fill);

// ---------- Ground (soft shadow catcher) ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(8, 64),
  new THREE.ShadowMaterial({ opacity: 0.22 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const disc = new THREE.Mesh(
  new THREE.CircleGeometry(3.2, 64),
  new THREE.MeshStandardMaterial({ color: 0xe3e6ea, roughness: 0.95 })
);
disc.rotation.x = -Math.PI / 2;
disc.position.y = -0.001;
disc.receiveShadow = true;
scene.add(disc);

const plant = new THREE.Group();
scene.add(plant);

// ---------- Pot ----------
const potMat = new THREE.MeshStandardMaterial({ color: 0xb9623c, roughness: 0.85 });
const potPts = [];
potPts.push(new THREE.Vector2(0, 0));
potPts.push(new THREE.Vector2(0.72, 0));
potPts.push(new THREE.Vector2(0.72, 0.04));
potPts.push(new THREE.Vector2(0.78, 0.08));
potPts.push(new THREE.Vector2(0.94, 0.72));
potPts.push(new THREE.Vector2(1.02, 0.74));
potPts.push(new THREE.Vector2(1.04, 0.88));
potPts.push(new THREE.Vector2(0.98, 0.9));
potPts.push(new THREE.Vector2(0.90, 0.9));
const pot = new THREE.Mesh(new THREE.LatheGeometry(potPts, 64), potMat);
pot.castShadow = true;
pot.receiveShadow = true;
plant.add(pot);

// Soil
const soil = new THREE.Mesh(
  new THREE.CylinderGeometry(0.9, 0.9, 0.08, 48),
  new THREE.MeshStandardMaterial({ color: 0x5b4632, roughness: 1 })
);
soil.position.y = 0.84;
soil.receiveShadow = true;
plant.add(soil);

// ---------- Cactus body: squat ribbed sphere-ish barrel ----------
const RIBS = 13;
const ribDepth = 0.16;
const bodyR = 0.85;
const squash = 0.88;
const baseY = 0.86;

const bodyGeo = new THREE.SphereGeometry(bodyR, RIBS * 12, 48);
const pos = bodyGeo.attributes.position;
const v = new THREE.Vector3();
for (let i = 0; i < pos.count; i++) {
  v.fromBufferAttribute(pos, i);
  const theta = Math.atan2(v.z, v.x);
  const phi = Math.asin(THREE.MathUtils.clamp(v.y / bodyR, -1, 1)); // -PI/2..PI/2
  // rib profile: cos wave, fade at poles
  const fade = Math.pow(Math.cos(phi), 0.6);
  const wave = Math.pow(0.5 + 0.5 * Math.cos(theta * RIBS), 0.75); // sharpened ridges
  const s = 1 + ribDepth * (wave - 0.5) * fade;
  v.x *= s; v.z *= s;
  v.y *= squash;
  pos.setXYZ(i, v.x, v.y, v.z);
}
bodyGeo.computeVertexNormals();
const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4e7a3a, roughness: 0.72 });
const body = new THREE.Mesh(bodyGeo, bodyMat);
body.position.y = baseY + bodyR * squash * 0.82;
body.castShadow = true;
body.receiveShadow = true;
plant.add(body);

// Crown fuzz at top
const crown = new THREE.Mesh(
  new THREE.SphereGeometry(0.16, 24, 16),
  new THREE.MeshStandardMaterial({ color: 0xe8dfc8, roughness: 1 })
);
crown.scale.y = 0.55;
crown.position.y = body.position.y + bodyR * squash * 0.97;
crown.castShadow = true;
plant.add(crown);

// ---------- Spine clusters along rib ridges ----------
const spineMat = new THREE.MeshStandardMaterial({ color: 0xf2e6c9, roughness: 0.6 });
const areoleMat = new THREE.MeshStandardMaterial({ color: 0xddd2b4, roughness: 1 });
const spineGeo = new THREE.ConeGeometry(0.012, 0.16, 5);
spineGeo.translate(0, 0.08, 0);
const areoleGeo = new THREE.SphereGeometry(0.035, 10, 8);

const spinesPerCluster = 6;
const rows = 7;
const clusters = [];
for (let r = 0; r < RIBS; r++) {
  const theta = (r / RIBS) * Math.PI * 2;
  for (let j = 1; j <= rows; j++) {
    const phi = -Math.PI * 0.32 + (j / (rows + 1)) * Math.PI * 0.78;
    const rad = bodyR * (1 + ribDepth * 0.5 * Math.pow(Math.cos(phi), 0.6));
    const p = new THREE.Vector3(
      Math.cos(phi) * Math.cos(theta) * rad,
      Math.sin(phi) * rad * squash,
      Math.cos(phi) * Math.sin(theta) * rad
    );
    clusters.push({ p, phi, theta });
  }
}

const areoles = new THREE.InstancedMesh(areoleGeo, areoleMat, clusters.length);
const spines = new THREE.InstancedMesh(spineGeo, spineMat, clusters.length * spinesPerCluster);
const m = new THREE.Matrix4();
const q = new THREE.Quaternion();
const up = new THREE.Vector3(0, 1, 0);
let si = 0;
clusters.forEach((c, i) => {
  const world = c.p.clone().add(body.position);
  const normal = c.p.clone().normalize();
  m.compose(world, new THREE.Quaternion(), new THREE.Vector3(1, 0.8, 1));
  areoles.setMatrixAt(i, m);
  for (let k = 0; k < spinesPerCluster; k++) {
    const ang = (k / spinesPerCluster) * Math.PI * 2 + i * 0.7;
    const tilt = 0.55 + 0.1 * Math.sin(i * 3.1 + k);
    // build direction: normal tilted outward
    const tangent = new THREE.Vector3().crossVectors(up, normal).normalize();
    if (tangent.lengthSq() < 0.01) tangent.set(1, 0, 0);
    const bitangent = new THREE.Vector3().crossVectors(normal, tangent);
    const dir = normal.clone()
      .addScaledVector(tangent, Math.cos(ang) * tilt)
      .addScaledVector(bitangent, Math.sin(ang) * tilt)
      .normalize();
    q.setFromUnitVectors(up, dir);
    const scl = 0.9 + 0.35 * ((i * 7 + k * 13) % 5) / 5;
    m.compose(world.clone().addScaledVector(normal, 0.01), q, new THREE.Vector3(1, scl, 1));
    spines.setMatrixAt(si++, m);
  }
});
areoles.castShadow = true;
spines.castShadow = true;
plant.add(areoles, spines);

// ---------- Resize + loop ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
