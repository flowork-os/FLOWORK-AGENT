<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartoon Cargo Trike</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dff4ef}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdff4ef);
scene.fog = new THREE.Fog(0xdff4ef, 11, 24);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.8, 5.2, 8.6);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 5;
controls.maxDistance = 15;
controls.target.set(0, 1.75, -0.25);

const cream = new THREE.MeshStandardMaterial({color:0xffe9bd, roughness:.72});
const creamLight = new THREE.MeshStandardMaterial({color:0xfff4d5, roughness:.65});
const orange = new THREE.MeshStandardMaterial({color:0xf47b3d, roughness:.7});
const orangeDark = new THREE.MeshStandardMaterial({color:0xc74e2f, roughness:.75});
const mint = new THREE.MeshStandardMaterial({color:0x83d8bd, roughness:.65});
const mintDark = new THREE.MeshStandardMaterial({color:0x378f83, roughness:.7});
const outline = new THREE.MeshStandardMaterial({color:0x25343a, roughness:.85});
const tireMat = new THREE.MeshStandardMaterial({color:0x26383b, roughness:.92});
const brass = new THREE.MeshStandardMaterial({color:0xd99736, metalness:.72, roughness:.28});
const lampMat = new THREE.MeshStandardMaterial({color:0xffc84d, emissive:0xff8c22, emissiveIntensity:1.5, roughness:.25});
const glass = new THREE.MeshStandardMaterial({color:0xbceee0, transparent:true, opacity:.72, roughness:.1});

const trike = new THREE.Group();
scene.add(trike);

function rounded(w,h,d,material,r=.12,segments=5){
  const mesh = new THREE.Mesh(new RoundedBoxGeometry(w,h,d,segments,r), material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function cyl(radius,depth,material,segments=32){
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,depth,segments),material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function torus(R,r,material){
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(R,r,16,40),material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function tube(points,radius,material){
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve,48,radius,12,false),material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const chassis = rounded(1.15,.34,3.55,outline,.15);
chassis.position.set(0,.78,.05);
trike.add(chassis);

const chassisTop = rounded(.82,.25,3.2,mintDark,.1);
chassisTop.position.set(0,.98,.05);
trike.add(chassisTop);

const frontAxle = rounded(2.95,.22,.32,outline,.1);
frontAxle.position.set(0,.73,-1.48);
trike.add(frontAxle);

const rearFork = tube([
  new THREE.Vector3(0,.87,1.15),
  new THREE.Vector3(0,1.25,.72),
  new THREE.Vector3(0,1.35,.1),
  new THREE.Vector3(0,1.45,-.55)
],.13,outline);
trike.add(rearFork);

const rearForkAccent = tube([
  new THREE.Vector3(0,.98,1.12),
  new THREE.Vector3(0,1.3,.7),
  new THREE.Vector3(0,1.38,.1),
  new THREE.Vector3(0,1.5,-.48)
],.055,mint);
trike.add(rearForkAccent);

function addWheel(x,z,scale=1){
  const wheel = new THREE.Group();
  wheel.position.set(x,.67,z);
  wheel.rotation.z = Math.PI/2;
  const tire = torus(.58,.22,tireMat);
  tire.scale.set(scale,scale,scale);
  wheel.add(tire);
  const side = cyl(.38,.13,creamLight,32);
  side.rotation.z = Math.PI/2;
  side.position.x = x < 0 ? -.17 : .17;
  wheel.add(side);
  const rim = cyl(.29,.16,mint,32);
  rim.rotation.z = Math.PI/2;
  rim.position.x = x < 0 ? -.25 : .25;
  wheel.add(rim);
  const hub = cyl(.11,.22,orangeDark,24);
  hub.rotation.z = Math.PI/2;
  hub.position.x = x < 0 ? -.37 : .37;
  wheel.add(hub);
  trike.add(wheel);
}
addWheel(-1.36,-1.5,1.08);
addWheel(1.36,-1.5,1.08);

const rearWheel = new THREE.Group();
rearWheel.position.set(0,.67,1.35);
rearWheel.rotation.z = Math.PI/2;
rearWheel.add(torus(.59,.23,tireMat));
const rearSide = cyl(.39,.14,creamLight,32);
rearSide.rotation.z = Math.PI/2;
rearSide.position.x = .18;
rearWheel.add(rearSide);
const rearRim = cyl(.29,.17,mint,32);
rearRim.rotation.z = Math.PI/2;
rearRim.position.x = .27;
rearWheel.add(rearRim);
const rearHub = cyl(.11,.2,orangeDark,24);
rearHub.rotation.z = Math.PI/2;
rearHub.position.x = .39;
rearWheel.add(rearHub);
trike.add(rearWheel);

const crateShadow = rounded(2.95,2.12,2.18,outline,.2);
crateShadow.position.set(0,2.03,-1.18);
trike.add(crateShadow);

const crate = rounded(2.68,1.91,1.96,orange,.18);
crate.position.set(0,2.08,-1.2);
trike.add(crate);

const crateTop = rounded(2.48,.16,1.75,creamLight,.07);
crateTop.position.set(0,3.06,-1.2);
trike.add(crateTop);

for(const x of [-1.1,0,1.1]){
  const slat = rounded(.16,1.54,.1,orangeDark,.045);
  slat.position.set(x,2.02,-2.205);
  trike.add(slat);
}
for(const y of [1.48,2.55]){
  const rail = rounded(2.58,.14,.12,creamLight,.05);
  rail.position.set(0,y,-2.23);
  trike.add(rail);
}

const crateSidePanel = rounded(2.38,1.46,.08,orangeDark,.06);
crateSidePanel.position.set(1.36,2.08,-1.2);
trike.add(crateSidePanel);
const sideInset = rounded(1.92,1.05,.07,orange,.05);
sideInset.position.set(1.42,2.08,-1.2);
trike.add(sideInset);

const bumper = rounded(2.3,.22,.25,creamLight,.09);
bumper.position.set(0,1.03,-2.22);
trike.add(bumper);

const seatPost = cyl(.1,.8,outline,20);
seatPost.position.set(0,1.55,.92);
trike.add(seatPost);

const seatBase = rounded(1.22,.22,.75,outline,.1);
seatBase.position.set(0,1.94,1.02);
trike.add(seatBase);

const seat = rounded(1.06,.19,.63,cream,.09);
seat.position.set(0,2.08,1.02);
trike.add(seat);

const seatBack = rounded(1.0,.65,.18,mint,.1);
seatBack.position.set(0,2.34,1.31);
trike.add(seatBack);

const handleOutline = tube([
  new THREE.Vector3(-.72,3.55,-.62),
  new THREE.Vector3(-.52,3.35,-.58),
  new THREE.Vector3(-.2,3.22,-.55),
  new THREE.Vector3(0,3.18,-.53),
  new THREE.Vector3(.2,3.22,-.55),
  new THREE.Vector3(.52,3.35,-.58),
  new THREE.Vector3(.72,3.55,-.62)
],.105,outline);
trike.add(handleOutline);

const handle = tube([
  new THREE.Vector3(-.62,3.52,-.64),
  new THREE.Vector3(-.45,3.38,-.61),
  new THREE.Vector3(-.18,3.28,-.58),
  new THREE.Vector3(0,3.24,-.56),
  new THREE.Vector3(.18,3.28,-.58),
  new THREE.Vector3(.45,3.38,-.61),
  new THREE.Vector3(.62,3.52,-.64)
],.055,mint);
trike.add(handle);

for(const x of [-.73,.73]){
  const grip = rounded(.16,.28,.22,orangeDark,.07);
  grip.position.set(x,3.59,-.62);
  grip.rotation.z = x < 0 ? -.25 : .25;
  trike.add(grip);
}

const lampRing = torus(.35,.105,outline);
lampRing.position.set(-.52,3.42,-1.72);
lampRing.rotation.x = Math.PI/2;
trike.add(lampRing);

const lamp = new THREE.Mesh(new THREE.SphereGeometry(.27,32,20),lampMat);
lamp.position.set(-.52,3.42,-1.78);
lamp.scale.set(1,.92,.42);
lamp.castShadow = true;
trike.add(lamp);

const lampHighlight = new THREE.Mesh(new THREE.SphereGeometry(.07,16,12),creamLight);
lampHighlight.position.set(-.61,3.53,-1.94);
trike.add(lampHighlight);

const bellBase = cyl(.2,.1,outline,24);
bellBase.position.set(.55,3.32,-1.52);
trike.add(bellBase);

const bell = new THREE.Group();
bell.position.set(.55,3.52,-1.52);
bell.add(torus(.22,.075,brass));
const bellCap = new THREE.Mesh(new THREE.SphereGeometry(.2,24,16,0,Math.PI*2,0,Math.PI/2),brass);
bellCap.position.y = .02;
bell.add(bellCap);
const bellCurl = tube([
  new THREE.Vector3(.18,.11,0),
  new THREE.Vector3(.3,.28,0),
  new THREE.Vector3(.49,.32,0),
  new THREE.Vector3(.58,.18,0),
  new THREE.Vector3(.48,.08,0)
],.035,brass);
bell.add(bellCurl);
const bellClapper = cyl(.045,.16,brass,16);
bellClapper.position.set(0,-.12,0);
bell.add(bellClapper);
trike.add(bell);

const frontFender = tube([
  new THREE.Vector3(-1.72,1.1,-1.82),
  new THREE.Vector3(-1.7,1.45,-1.5),
  new THREE.Vector3(-1.35,1.68,-1.18),
  new THREE.Vector3(-.98,1.7,-.94)
],.1,creamLight);
frontFender.rotation.y = .02;
trike.add(frontFender);

const frontFender2 = frontFender.clone();
frontFender2.position.x = 1.96;
frontFender2.scale.x = -1;
trike.add(frontFender2);

const pedalRing = torus(.25,.06,outline);
pedalRing.position.set(0,1.18,.25);
pedalRing.rotation.x = Math.PI/2;
trike.add(pedalRing);
const pedalArm = rounded(.07,.07,.6,brass,.025);
pedalArm.position.set(.27,1.18,.25);
pedalArm.rotation.y = Math.PI/2;
trike.add(pedalArm);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(8,64),
  new THREE.MeshStandardMaterial({color:0xb8ddd4,roughness:1})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = .02;
ground.receiveShadow = true;
scene.add(ground);

const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(3.15,64),
  new THREE.MeshBasicMaterial({color:0x5a8b88,transparent:true,opacity:.16,depthWrite:false})
);
shadow.rotation.x = -Math.PI/2;
shadow.scale.set(1,.48,1);
shadow.position.set(0,.035,.05);
scene.add(shadow);

scene.add(new THREE.HemisphereLight(0xfff4d9,0x6caaa5,2.2));

const key = new THREE.DirectionalLight(0xfff1d0,4.2);
key.position.set(-5,9,6);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0005;
scene.add(key);

const rim = new THREE.DirectionalLight(0x8adbd1,2.2);
rim.position.set(5,5,-6);
scene.add(rim);

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
