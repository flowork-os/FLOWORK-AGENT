<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classical Marble Bust</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171715;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 24px;
      bottom: 20px;
      color: rgba(245, 241, 231, 0.72);
      font: 11px/1.5 Georgia, serif;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 1px 8px #000;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Marble Portrait · Roman Imperial Style</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181816);
    scene.fog = new THREE.FogExp2(0x181816, 0.025);

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(7.3, 5.5, 10.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.25, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.48;
    controls.minDistance = 7;
    controls.maxDistance = 18;
    controls.minPolarAngle = 0.55;
    controls.maxPolarAngle = 1.72;

    const marble = new THREE.MeshPhysicalMaterial({
      color: 0xe7e3d8,
      roughness: 0.52,
      metalness: 0,
      clearcoat: 0.09,
      clearcoatRoughness: 0.72
    });

    const marbleLight = new THREE.MeshPhysicalMaterial({
      color: 0xf0ede4,
      roughness: 0.48,
      clearcoat: 0.08,
      clearcoatRoughness: 0.7
    });

    const marbleShadow = new THREE.MeshStandardMaterial({
      color: 0xb9b4a9,
      roughness: 0.78
    });

    const cavityMaterial = new THREE.MeshStandardMaterial({
      color: 0x242321,
      roughness: 0.95
    });

    const veinMaterial = new THREE.MeshStandardMaterial({
      color: 0x9f9b93,
      roughness: 0.8,
      transparent: true,
      opacity: 0.35
    });

    function sculptMesh(geometry, material = marble) {
      const object = new THREE.Mesh(geometry, material);
      object.castShadow = true;
      object.receiveShadow = true;
      return object;
    }

    function ellipsoid(rx, ry, rz, material = marble, segments = 48) {
      const object = sculptMesh(new THREE.SphereGeometry(1, segments, Math.max(24, segments / 2)), material);
      object.scale.set(rx, ry, rz);
      return object;
    }

    function addEllipsoid(parent, position, scale, material = marble, segments = 48) {
      const object = ellipsoid(scale.x, scale.y, scale.z, material, segments);
      object.position.copy(position);
      parent.add(object);
      return object;
    }

    function tubeBetween(points, radius, material, tubularSegments = 28) {
      const curve = new THREE.CatmullRomCurve3(points);
      return sculptMesh(new THREE.TubeGeometry(curve, tubularSegments, radius, 7, false), material);
    }

    const sculpture = new THREE.Group();
    sculpture.rotation.y = -0.06;
    scene.add(sculpture);

    const lowerBase = sculptMesh(new THREE.BoxGeometry(2.45, 0.22, 2.05));
    lowerBase.position.y = 0.11;
    sculpture.add(lowerBase);

    const baseStep = sculptMesh(new THREE.BoxGeometry(2.18, 0.19, 1.82), marbleLight);
    baseStep.position.y = 0.315;
    sculpture.add(baseStep);

    const plinth = sculptMesh(new THREE.BoxGeometry(1.76, 1.32, 1.43));
    plinth.position.y = 1.05;
    sculpture.add(plinth);

    const plinthTop = sculptMesh(new THREE.BoxGeometry(1.98, 0.19, 1.63), marbleLight);
    plinthTop.position.y = 1.79;
    sculpture.add(plinthTop);

    const insetPanel = sculptMesh(new THREE.BoxGeometry(1.34, 0.73, 0.025), marbleShadow);
    insetPanel.position.set(0, 1.05, 0.727);
    sculpture.add(insetPanel);

    const panelFace = sculptMesh(new THREE.BoxGeometry(1.27, 0.66, 0.022), marble);
    panelFace.position.set(0, 1.05, 0.745);
    sculpture.add(panelFace);

    const torso = new THREE.Group();
    sculpture.add(torso);

    addEllipsoid(torso, new THREE.Vector3(0, 2.47, 0), new THREE.Vector3(1.42, 0.84, 0.58));
    addEllipsoid(torso, new THREE.Vector3(0, 2.78, 0.08), new THREE.Vector3(1.1, 0.66, 0.52), marbleLight);

    const leftShoulder = addEllipsoid(
      torso,
      new THREE.Vector3(-1.12, 2.47, -0.02),
      new THREE.Vector3(0.62, 0.43, 0.5)
    );
    leftShoulder.rotation.z = -0.22;

    const rightShoulder = addEllipsoid(
      torso,
      new THREE.Vector3(1.12, 2.47, -0.02),
      new THREE.Vector3(0.62, 0.43, 0.5)
    );
    rightShoulder.rotation.z = 0.22;

    const chestPlane = addEllipsoid(
      torso,
      new THREE.Vector3(0, 2.64, 0.42),
      new THREE.Vector3(0.94, 0.49, 0.22),
      marbleLight
    );

    const collarLeft = tubeBetween([
      new THREE.Vector3(-0.66, 2.88, 0.47),
      new THREE.Vector3(-0.38, 2.75, 0.55),
      new THREE.Vector3(-0.08, 2.68, 0.57)
    ], 0.038, marbleShadow);
    torso.add(collarLeft);

    const collarRight = tubeBetween([
      new THREE.Vector3(0.66, 2.88, 0.47),
      new THREE.Vector3(0.38, 2.75, 0.55),
      new THREE.Vector3(0.08, 2.68, 0.57)
    ], 0.038, marbleShadow);
    torso.add(collarRight);

    addEllipsoid(torso, new THREE.Vector3(-0.34, 2.87, 0.44), new THREE.Vector3(0.31, 0.22, 0.16), marbleLight);
    addEllipsoid(torso, new THREE.Vector3(0.34, 2.87, 0.44), new THREE.Vector3(0.31, 0.22, 0.16), marbleLight);

    const neck = sculptMesh(new THREE.CylinderGeometry(0.43, 0.56, 1.15, 48));
    neck.position.set(0, 3.45, -0.03);
    neck.scale.z = 0.88;
    torso.add(neck);

    addEllipsoid(torso, new THREE.Vector3(-0.34, 3.38, 0.18), new THREE.Vector3(0.16, 0.57, 0.2), marbleShadow);
    addEllipsoid(torso, new THREE.Vector3(0.34, 3.38, 0.18), new THREE.Vector3(0.16, 0.57, 0.2), marbleShadow);

    const head = new THREE.Group();
    head.position.set(0, 4.48, 0.015);
    head.rotation.z = -0.025;
    head.rotation.y = 0.025;
    sculpture.add(head);

    addEllipsoid(head, new THREE.Vector3(0, 0.12, 0), new THREE.Vector3(0.78, 1.02, 0.68), marble);
    addEllipsoid(head, new THREE.Vector3(0, -0.36, 0.13), new THREE.Vector3(0.62, 0.65, 0.57), marbleLight);
    addEllipsoid(head, new THREE.Vector3(0, -0.79, 0.15), new THREE.Vector3(0.35, 0.27, 0.38), marbleLight);

    addEllipsoid(head, new THREE.Vector3(-0.77, 0.02, -0.01), new THREE.Vector3(0.16, 0.31, 0.12), marble);
    addEllipsoid(head, new THREE.Vector3(0.77, 0.02, -0.01), new THREE.Vector3(0.16, 0.31, 0.12), marble);

    const leftEarInset = ellipsoid(0.075, 0.19, 0.035, marbleShadow);
    leftEarInset.position.set(-0.865, 0.02, 0.025);
    leftEarInset.rotation.y = 0.35;
    head.add(leftEarInset);

    const rightEarInset = ellipsoid(0.075, 0.19, 0.035, marbleShadow);
    rightEarInset.position.set(0.865, 0.02, 0.025);
    rightEarInset.rotation.y = -0.35;
    head.add(rightEarInset);

    addEllipsoid(head, new THREE.Vector3(-0.29, 0.23, 0.6), new THREE.Vector3(0.27, 0.13, 0.09), marbleShadow);
    addEllipsoid(head, new THREE.Vector3(0.29, 0.23, 0.6), new THREE.Vector3(0.27, 0.13, 0.09), marbleShadow);

    const leftEye = addEllipsoid(
      head,
      new THREE.Vector3(-0.285, 0.205, 0.675),
      new THREE.Vector3(0.205, 0.085, 0.075),
      marbleLight
    );
    leftEye.rotation.z = -0.035;

    const rightEye = addEllipsoid(
      head,
      new THREE.Vector3(0.285, 0.205, 0.675),
      new THREE.Vector3(0.205, 0.085, 0.075),
      marbleLight
    );
    rightEye.rotation.z = 0.035;

    function addDrilledPupil(x, y, z) {
      const rim = sculptMesh(new THREE.TorusGeometry(0.047, 0.012, 10, 28), marbleShadow);
      rim.position.set(x, y, z);
      head.add(rim);

      const hollow = sculptMesh(new THREE.CylinderGeometry(0.034, 0.028, 0.026, 24), cavityMaterial);
      hollow.rotation.x = Math.PI / 2;
      hollow.position.set(x, y, z + 0.006);
      head.add(hollow);

      const inner = ellipsoid(0.018, 0.018, 0.012, cavityMaterial, 24);
      inner.position.set(x, y, z + 0.024);
      head.add(inner);
    }

    addDrilledPupil(-0.285, 0.205, 0.755);
    addDrilledPupil(0.285, 0.205, 0.755);

    const leftUpperLid = tubeBetween([
      new THREE.Vector3(-0.49, 0.225, 0.7),
      new THREE.Vector3(-0.285, 0.31, 0.73),
      new THREE.Vector3(-0.09, 0.23, 0.7)
    ], 0.026, marble);
    head.add(leftUpperLid);

    const rightUpperLid = tubeBetween([
      new THREE.Vector3(0.09, 0.23, 0.7),
      new THREE.Vector3(0.285, 0.31, 0.73),
      new THREE.Vector3(0.49, 0.225, 0.7)
    ], 0.026, marble);
    head.add(rightUpperLid);

    const leftBrow = tubeBetween([
      new THREE.Vector3(-0.53, 0.43, 0.61),
      new THREE.Vector3(-0.31, 0.51, 0.68),
      new THREE.Vector3(-0.08, 0.43, 0.66)
    ], 0.04, marbleShadow);
    head.add(leftBrow);

    const rightBrow = tubeBetween([
      new THREE.Vector3(0.08, 0.43, 0.66),
      new THREE.Vector3(0.31, 0.51, 0.68),
      new THREE.Vector3(0.53, 0.43, 0.61)
    ], 0.04, marbleShadow);
    head.add(rightBrow);

    addEllipsoid(head, new THREE.Vector3(0, 0.11, 0.66), new THREE.Vector3(0.13, 0.49, 0.13), marbleLight);

    const noseGeometry = new THREE.BufferGeometry();
    const noseVertices = new Float32Array([
      -0.11,  0.37, 0.64,
       0.11,  0.37, 0.64,
      -0.095,-0.20, 0.69,
       0.09, -0.17, 0.69,
      -0.14, -0.30, 0.72,
       0.035,-0.27, 0.75,
      -0.07,  0.15, 1.04,
       0.07,  0.15, 1.02,
      -0.09, -0.20, 1.09,
       0.025,-0.16, 1.04
    ]);
    const noseIndices = [
      0, 1, 6, 1, 7, 6,
      0, 6, 2, 2, 6, 8,
      1, 3, 7, 3, 9, 7,
      6, 7, 8, 7, 9, 8,
      2, 8, 4, 4, 8, 5,
      3, 5, 9, 3, 4, 5,
      2, 4, 3, 3, 4, 5,
      8, 9, 5
    ];
    noseGeometry.setAttribute('position', new THREE.BufferAttribute(noseVertices, 3));
    noseGeometry.setIndex(noseIndices);
    noseGeometry.computeVertexNormals();
    const nose = sculptMesh(noseGeometry, marbleLight);
    head.add(nose);

    const chipFaceGeometry = new THREE.BufferGeometry();
    chipFaceGeometry.setAttribute('position', new THREE.Float32BufferAttribute([
      0.022, -0.274, 0.752,
      0.095, -0.205, 0.79,
      0.026, -0.158, 1.038,
      0.005, -0.267, 1.006,
      0.108, -0.224, 0.85
    ], 3));
    chipFaceGeometry.setIndex([0, 1, 4, 0, 4, 3, 3, 4, 2]);
    chipFaceGeometry.computeVertexNormals();
    head.add(sculptMesh(chipFaceGeometry, marbleShadow));

    addEllipsoid(head, new THREE.Vector3(-0.13, -0.27, 0.73), new THREE.Vector3(0.13, 0.075, 0.1), marbleLight);

    const philtrum = tubeBetween([
      new THREE.Vector3(-0.045, -0.36, 0.67),
      new THREE.Vector3(0, -0.43, 0.705),
      new THREE.Vector3(0.045, -0.36, 0.67)
    ], 0.018, marbleShadow, 18);
    head.add(philtrum);

    addEllipsoid(head, new THREE.Vector3(0, -0.49, 0.68), new THREE.Vector3(0.31, 0.1, 0.085), marbleLight);

    const mouthLine = tubeBetween([
      new THREE.Vector3(-0.31, -0.52, 0.65),
      new THREE.Vector3(-0.14, -0.55, 0.71),
      new THREE.Vector3(0, -0.535, 0.735),
      new THREE.Vector3(0.15, -0.55, 0.71),
      new THREE.Vector3(0.31, -0.51, 0.65)
    ], 0.021, cavityMaterial, 32);
    head.add(mouthLine);

    addEllipsoid(head, new THREE.Vector3(0, -0.61, 0.64), new THREE.Vector3(0.27, 0.105, 0.085), marble);
    addEllipsoid(head, new THREE.Vector3(0, -0.74, 0.55), new THREE.Vector3(0.38, 0.16, 0.11), marbleLight);

    const hairCap = addEllipsoid(
      head,
      new THREE.Vector3(0, 0.55, -0.09),
      new THREE.Vector3(0.82, 0.73, 0.7),
      marbleShadow
    );
    hairCap.rotation.x = -0.08;

    let seed = 24681357;
    function random() {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    }

    const curls = [];
    for (let row = 0; row < 5; row++) {
      const count = 10 + row * 2;
      const phiStart = 0.2 + row * 0.2;
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 + row * 0.19;
        const y = 0.98 - row * 0.22 + (random() - 0.5) * 0.08;
        const radiusX = 0.67 + row * 0.035;
        const radiusZ = 0.57 + row * 0.025;
        const frontBias = Math.cos(angle);
        if (row > 2 && frontBias > 0.68 && Math.abs(Math.sin(angle)) < 0.52) continue;
        curls.push({
          x: Math.sin(angle) * radiusX,
          y,
          z: Math.cos(angle) * radiusZ - 0.08,
          s: 0.105 + random() * 0.055,
          r: angle + phiStart
        });
      }
    }

    for (const curlData of curls) {
      const curlGroup = new THREE.Group();
      curlGroup.position.set(curlData.x, curlData.y, curlData.z);
      curlGroup.rotation.set(
        (random() - 0.5) * 0.7,
        curlData.r,
        (random() - 0.5) * 0.7
      );

      const curl = sculptMesh(
        new THREE.TorusGeometry(curlData.s, curlData.s * 0.34, 8, 18, Math.PI * 1.72),
        marbleShadow
      );
      curlGroup.add(curl);

      const center = ellipsoid(
        curlData.s * 0.42,
        curlData.s * 0.42,
        curlData.s * 0.27,
        cavityMaterial,
        18
      );
      center.position.z = 0.008;
      curlGroup.add(center);
      head.add(curlGroup);
    }

    const templeCurlLeft = tubeBetween([
      new THREE.Vector3(-0.72, 0.54, 0.38),
      new THREE.Vector3(-0.79, 0.34, 0.45),
      new THREE.Vector3(-0.72, 0.15, 0.43)
    ], 0.08, marbleShadow);
    head.add(templeCurlLeft);

    const templeCurlRight = tubeBetween([
      new THREE.Vector3(0.72, 0.54, 0.38),
      new THREE.Vector3(0.79, 0.34, 0.45),
      new THREE.Vector3(0.72, 0.15, 0.43)
    ], 0.08, marbleShadow);
    head.add(templeCurlRight);

    const marbleVein = tubeBetween([
      new THREE.Vector3(-0.51, 0.42, 0.699),
      new THREE.Vector3(-0.44, 0.58, 0.648),
      new THREE.Vector3(-0.39, 0.71, 0.59)
    ], 0.008, veinMaterial, 18);
    head.add(marbleVein);

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x2a2925,
      roughness: 0.94,
      metalness: 0
    });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(28, 28), floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.015;
    floor.receiveShadow = true;
    scene.add(floor);

    const backdrop = new THREE.Mesh(
      new THREE.PlaneGeometry(24, 14),
      new THREE.MeshStandardMaterial({ color: 0x20201d, roughness: 1 })
    );
    backdrop.position.set(0, 6, -5.5);
    backdrop.receiveShadow = true;
    scene.add(backdrop);

    const hemi = new THREE.HemisphereLight(0xe9edf2, 0x3b3024, 1.35);
    scene.add(hemi);

    const key = new THREE.SpotLight(0xfff2dc, 130, 30, 0.48, 0.48, 1.25);
    key.position.set(5.2, 9.1, 6.3);
    key.target.position.set(0, 3.5, 0);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 25;
    key.shadow.bias = -0.00025;
    key.shadow.normalBias = 0.025;
    scene.add(key, key.target);

    const fill = new THREE.DirectionalLight(0xaabeda, 2.1);
    fill.position.set(-5, 4.5, 4);
    scene.add(fill);

    const rim = new THREE.SpotLight(0xffd7ad, 70, 24, 0.55, 0.7, 1.4);
    rim.position.set(-4.5, 7, -4);
    rim.target.position.set(0, 4, 0);
    scene.add(rim, rim.target);

    const lowFill = new THREE.PointLight(0xd9e5ff, 5, 8, 2);
    lowFill.position.set(1.5, 1.2, 3.5);
    scene.add(lowFill);

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      lowFill.intensity = 4.8 + Math.sin(elapsed * 0.35) * 0.2;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
