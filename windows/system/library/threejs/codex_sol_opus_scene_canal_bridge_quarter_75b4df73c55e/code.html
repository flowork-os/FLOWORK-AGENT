<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

<script type="importmap">

  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

</head>
<body>
<div id="caption">Canal Bridge Quarter · Dusk</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x536071, 0.018);

const camera = new THREE.PerspectiveCamera(
  48,
  innerWidth / innerHeight,
  0.1,
  180
);
camera.position.set(28, 17, 31);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, -2);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.22;
controls.minDistance = 18;
controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI * 0.48;

let seed = 904178;
function random() {
  seed |= 0;
  seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function rand(a, b) {
  return a + (b - a) * random();
}
function choose(array) {
  return array[Math.floor(random() * array.length)];
}

function canvasTexture(width, height, painter, repeatX = 1, repeatY = 1) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const context = canvas.getContext('2d');
  painter(context, width, height);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(repeatX, repeatY);
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const skyTexture = canvasTexture(32, 512, (ctx, w, h) => {
  const gradient = ctx.createLinearGradient(0, 0, 0, h);
  gradient.addColorStop(0, '#17213f');
  gradient.addColorStop(0.44, '#59637c');
  gradient.addColorStop(0.73, '#b87972');
  gradient.addColorStop(1, '#e2a876');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 65; i++) {
    const x = random() * w;
    const y = random() * h * 0.48;
    const a = random() * 0.45;
    ctx.fillStyle = `rgba(255,245,220,${a})`;
    ctx.fillRect(x, y, 1, 1);
  }
});

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(115, 48, 24),
  new THREE.MeshBasicMaterial({
    map: skyTexture,
    side: THREE.BackSide,
    fog: false
  })
);
scene.add(sky);

const moon = new THREE.Mesh(
  new THREE.SphereGeometry(1.15, 24, 16),
  new THREE.MeshBasicMaterial({ color: 0xffe4b8, fog: false })
);
moon.position.set(-26, 28, -57);
scene.add(moon);

const hemisphere = new THREE.HemisphereLight(0x7182aa, 0x2b2723, 1.35);
scene.add(hemisphere);

const duskLight = new THREE.DirectionalLight(0xffb487, 2.1);
duskLight.position.set(-18, 30, 16);
duskLight.castShadow = true;
duskLight.shadow.mapSize.set(2048, 2048);
duskLight.shadow.camera.left = -38;
duskLight.shadow.camera.right = 38;
duskLight.shadow.camera.top = 38;
duskLight.shadow.camera.bottom = -38;
duskLight.shadow.camera.near = 1;
duskLight.shadow.camera.far = 90;
duskLight.shadow.bias = -0.0004;
scene.add(duskLight);

const fillLight = new THREE.DirectionalLight(0x748cc8, 0.55);
fillLight.position.set(18, 16, -24);
scene.add(fillLight);

const waterTexture = canvasTexture(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#173c3b';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 480; i++) {
    const y = random() * h;
    const x = random() * w;
    const length = rand(8, 68);
    const alpha = rand(0.025, 0.12);
    ctx.strokeStyle = random() > 0.45
      ? `rgba(158,195,172,${alpha})`
      : `rgba(9,24,30,${alpha})`;
    ctx.lineWidth = rand(0.5, 2);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(
      x + length * 0.5,
      y + rand(-2, 2),
      x + length,
      y
    );
    ctx.stroke();
  }
}, 2, 7);

waterTexture.colorSpace = THREE.NoColorSpace;

const waterMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x1e5550,
  map: waterTexture,
  roughness: 0.28,
  metalness: 0.12,
  clearcoat: 0.5,
  clearcoatRoughness: 0.25,
  transparent: true,
  opacity: 0.96
});

const water = new THREE.Mesh(
  new THREE.PlaneGeometry(15.5, 100, 1, 1),
  waterMaterial
);
water.rotation.x = -Math.PI / 2;
water.position.set(0, 0.03, -8);
water.receiveShadow = true;
scene.add(water);

const rippleMaterial = new THREE.MeshBasicMaterial({
  color: 0xd7bd86,
  transparent: true,
  opacity: 0.13,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const reflectionStrips = [];
for (let i = 0; i < 28; i++) {
  const strip = new THREE.Mesh(
    new THREE.PlaneGeometry(rand(0.08, 0.3), rand(1.3, 5.5)),
    rippleMaterial.clone()
  );
  strip.rotation.x = -Math.PI / 2;
  strip.rotation.z = rand(-0.08, 0.08);
  strip.position.set(
    choose([-1, 1]) * rand(2.7, 6.5),
    0.055,
    rand(-42, 27)
  );
  strip.material.opacity = rand(0.035, 0.15);
  scene.add(strip);
  reflectionStrips.push(strip);
}

const cobbleTexture = canvasTexture(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#766e65';
  ctx.fillRect(0, 0, w, h);
  for (let row = 0; row < 22; row++) {
    const y = row * 24;
    const offset = row % 2 ? -18 : 0;
    for (let x = offset; x < w; x += 38) {
      ctx.fillStyle = choose(['#82786e', '#6b665f', '#8b8074']);
      ctx.strokeStyle = '#554f4a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x + 2, y + 2, 33, 19, 4);
      ctx.fill();
      ctx.stroke();
    }
  }
}, 5, 13);

const stoneTexture = canvasTexture(512, 256, (ctx, w, h) => {
  ctx.fillStyle = '#81776a';
  ctx.fillRect(0, 0, w, h);
  for (let row = 0; row < 12; row++) {
    const y = row * 22;
    const offset = row % 2 ? -28 : 0;
    for (let x = offset; x < w; x += 56) {
      ctx.fillStyle = choose(['#958878', '#746b61', '#887b6d']);
      ctx.strokeStyle = '#5e574f';
      ctx.lineWidth = 2;
      ctx.fillRect(x + 2, y + 2, 51, 17);
      ctx.strokeRect(x + 2, y + 2, 51, 17);
    }
  }
}, 3, 2);

const brickTexture = canvasTexture(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#8f5848';
  ctx.fillRect(0, 0, w, h);
  for (let y = 0, row = 0; y < h; y += 19, row++) {
    const offset = row % 2 ? -23 : 0;
    for (let x = offset; x < w; x += 47) {
      const value = Math.floor(rand(85, 145));
      ctx.fillStyle = `rgb(${value + 35},${value * 0.55},${value * 0.42})`;
      ctx.fillRect(x + 2, y + 2, 42, 14);
    }
  }
  ctx.globalAlpha = 0.12;
  for (let i = 0; i < 900; i++) {
    ctx.fillStyle = '#2f211e';
    ctx.fillRect(random() * w, random() * h, 1, 1);
  }
}, 2, 3);

function material(color, options = {}) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: options.roughness ?? 0.76,
    metalness: options.metalness ?? 0,
    map: options.map || null,
    side: options.side || THREE.FrontSide
  });
}

const cobbleMaterial = material(0x777069, { map: cobbleTexture });
const stoneMaterial = material(0x8b8174, { map: stoneTexture });
const darkStoneMaterial = material(0x514e49, { roughness: 0.9 });
const ironMaterial = material(0x171b20, { roughness: 0.42, metalness: 0.72 });
const woodMaterial = material(0x5c3828, { roughness: 0.72 });
const creamMaterial = material(0xe7d4b6);
const greenMaterial = material(0x30584b);
const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x8da6b1,
  roughness: 0.18,
  metalness: 0.05,
  transparent: true,
  opacity: 0.55
});
const litWindowMaterial = new THREE.MeshStandardMaterial({
  color: 0xffc76c,
  emissive: 0xff8d32,
  emissiveIntensity: 2.4,
  roughness: 0.42
});

function shadowObject(object) {
  object.traverse(child => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });
  return object;
}

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 110),
  material(0x4a5147)
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.25;
ground.receiveShadow = true;
scene.add(ground);

for (const side of [-1, 1]) {
  const quay = new THREE.Mesh(
    new THREE.BoxGeometry(14, 0.65, 100),
    cobbleMaterial
  );
  quay.position.set(side * 14.7, 0.06, -8);
  quay.receiveShadow = true;
  quay.castShadow = true;
  scene.add(quay);

  const canalWall = new THREE.Mesh(
    new THREE.BoxGeometry(0.7, 2.6, 100),
    stoneMaterial
  );
  canalWall.position.set(side * 8.1, -0.65, -8);
  canalWall.castShadow = true;
  canalWall.receiveShadow = true;
  scene.add(canalWall);

  const coping = new THREE.Mesh(
    new THREE.BoxGeometry(0.95, 0.28, 100),
    darkStoneMaterial
  );
  coping.position.set(side * 8.05, 0.52, -8);
  scene.add(coping);
}

function archWallShape() {
  const shape = new THREE.Shape();
  shape.moveTo(-10.1, 0);
  shape.lineTo(10.1, 0);
  shape.lineTo(10.1, 5.35);
  shape.lineTo(-10.1, 5.35);
  shape.closePath();

  const hole = new THREE.Path();
  hole.moveTo(-5.4, 0);
  hole.lineTo(-5.4, 1.2);
  hole.absarc(0, 1.2, 5.4, Math.PI, 0, true);
  hole.lineTo(5.4, 0);
  hole.closePath();
  shape.holes.push(hole);
  return shape;
}

const bridge = new THREE.Group();
const bridgeWall = new THREE.Mesh(
  new THREE.ExtrudeGeometry(archWallShape(), {
    depth: 5.2,
    bevelEnabled: true,
    bevelSize: 0.12,
    bevelThickness: 0.12,
    bevelSegments: 2,
    curveSegments: 24
  }),
  stoneMaterial
);
bridgeWall.position.set(0, -0.02, -2.6);
bridge.add(bridgeWall);

const bridgeDeck = new THREE.Mesh(
  new THREE.BoxGeometry(20.8, 0.5, 5.8),
  cobbleMaterial
);
bridgeDeck.position.y = 5.38;
bridge.add(bridgeDeck);

for (const z of [-2.78, 2.78]) {
  const parapet = new THREE.Mesh(
    new THREE.BoxGeometry(21.2, 0.85, 0.38),
    stoneMaterial
  );
  parapet.position.set(0, 5.85, z);
  bridge.add(parapet);

  for (let x = -9.5; x <= 9.5; x += 1.9) {
    const cap = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 0.22, 0.55),
      darkStoneMaterial
    );
    cap.position.set(x, 6.36, z);
    bridge.add(cap);
  }
}
shadowObject(bridge);
scene.add(bridge);

function createRailing(length = 13) {
  const group = new THREE.Group();
  const top = new THREE.Mesh(
    new THREE.CylinderGeometry(0.075, 0.075, length, 8),
    ironMaterial
  );
  top.rotation.x = Math.PI / 2;
  top.position.y = 1.55;
  group.add(top);

  const lower = top.clone();
  lower.position.y = 0.75;
  group.add(lower);

  for (let z = -length / 2; z <= length / 2; z += 1.05) {
    const post = new THREE.Mesh(
      new THREE.CylinderGeometry(0.065, 0.085, 1.65, 8),
      ironMaterial
    );
    post.position.set(0, 0.77, z);
    group.add(post);

    const finial = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 10, 7),
      ironMaterial
    );
    finial.position.set(0, 1.65, z);
    group.add(finial);
  }
  return shadowObject(group);
}

for (const side of [-1, 1]) {
  for (const z of [-17, 11, 28]) {
    const railing = createRailing(12);
    railing.position.set(side * 8.45, 0.55, z);
    scene.add(railing);
  }
}

function gableShape(width, height, style) {
  const shape = new THREE.Shape();
  shape.moveTo(-width / 2, 0);
  shape.lineTo(width / 2, 0);
  shape.lineTo(width / 2, height);

  if (style === 'step') {
    const steps = 4;
    for (let i = 0; i < steps; i++) {
      const x = width / 2 - (i + 1) * width / (steps * 2);
      const y = height + (i + 1) * 0.62;
      shape.lineTo(x + width / (steps * 2), y);
      shape.lineTo(x, y);
    }
    for (let i = steps - 1; i >= 0; i--) {
      const x = -width / 2 + i * width / (steps * 2);
      const y = height + (i + 1) * 0.62;
      shape.lineTo(x, y);
      shape.lineTo(x - width / (steps * 2), y - 0.62);
    }
  } else if (style === 'bell') {
    shape.bezierCurveTo(
      width * 0.43,
      height + 0.8,
      width * 0.28,
      height + 2.55,
      0,
      height + 3.05
    );
    shape.bezierCurveTo(
      -width * 0.28,
      height + 2.55,
      -width * 0.43,
      height + 0.8,
      -width / 2,
      height
    );
  } else {
    shape.lineTo(0, height + 3.1);
    shape.lineTo(-width / 2, height);
  }

  shape.closePath();
  return shape;
}

function makeWindow(width, height, lit) {
  const group = new THREE.Group();
  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(width + 0.22, height + 0.22, 0.18),
    creamMaterial
  );
  group.add(frame);

  const pane = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, 0.21),
    lit ? litWindowMaterial : glassMaterial
  );
  pane.position.z = 0.04;
  group.add(pane);

  const mullionV = new THREE.Mesh(
    new THREE.BoxGeometry(0.07, height, 0.25),
    creamMaterial
  );
  mullionV.position.z = 0.13;
  group.add(mullionV);

  const mullionH = new THREE.Mesh(
    new THREE.BoxGeometry(width, 0.07, 0.25),
    creamMaterial
  );
  mullionH.position.z = 0.13;
  group.add(mullionH);
  return group;
}

const facadeColors = [
  0x8e4a3d,
  0xb66c45,
  0x41645f,
  0x515b73,
  0xb09972,
  0x784c47,
  0x9c885e
];

function makeHouse(width, floors, color, style, facing) {
  const group = new THREE.Group();
  const floorHeight = 2.35;
  const bodyHeight = floors * floorHeight;
  const shape = gableShape(width, bodyHeight, style);

  const houseMaterial = material(color, {
    map: color === 0x8e4a3d || color === 0x784c47 ? brickTexture : null
  });

  const body = new THREE.Mesh(
    new THREE.ExtrudeGeometry(shape, {
      depth: 4.3,
      bevelEnabled: true,
      bevelSize: 0.06,
      bevelThickness: 0.06,
      bevelSegments: 1,
      curveSegments: 12
    }),
    houseMaterial
  );
  body.position.z = -2.15;
  group.add(body);

  const faceZ = facing * 2.18;
  const columns = width > 4.2 ? 2 : 1;

  for (let floor = 0; floor < floors; floor++) {
    for (let column = 0; column < columns; column++) {
      const lit = random() > 0.42;
      const window = makeWindow(0.82, 1.18, lit);
      window.position.set(
        columns === 1 ? 0 : (column ? 1 : -1) * width * 0.22,
        1.35 + floor * floorHeight,
        faceZ
      );
      window.rotation.y = facing < 0 ? Math.PI : 0;
      group.add(window);
    }
  }

  const attic = makeWindow(0.65, 0.82, random() > 0.45);
  attic.position.set(0, bodyHeight + 1.05, faceZ);
  attic.rotation.y = facing < 0 ? Math.PI : 0;
  group.add(attic);

  const door = new THREE.Mesh(
    new THREE.BoxGeometry(0.9, 1.75, 0.22),
    material(choose([0x263f3b, 0x49302b, 0x1f3244, 0x5b291f]))
  );
  door.position.set(
    columns === 2 ? -width * 0.22 : 0,
    0.9,
    faceZ + facing * 0.03
  );
  door.rotation.y = facing < 0 ? Math.PI : 0;
  group.add(door);

  const knob = new THREE.Mesh(
    new THREE.SphereGeometry(0.06, 8, 6),
    material(0xb38a42, { metalness: 0.65, roughness: 0.25 })
  );
  knob.position.set(
    door.position.x + 0.28,
    0.92,
    faceZ + facing * 0.16
  );
  group.add(knob);

  const foundation = new THREE.Mesh(
    new THREE.BoxGeometry(width + 0.12, 0.48, 4.45),
    darkStoneMaterial
  );
  foundation.position.y = 0.22;
  group.add(foundation);

  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(width + 0.25, 0.15, 4.7),
    material(0x342c2d)
  );
  roof.position.y = bodyHeight + (style === 'triangle' ? 1.6 : 2.1);
  roof.rotation.z = style === 'triangle' ? 0.45 : 0;
  roof.visible = false;
  group.add(roof);

  return shadowObject(group);
}

for (const side of [-1, 1]) {
  let z = -37;
  while (z < 38) {
    const width = rand(3.35, 4.8);
    const floors = Math.floor(rand(3, 5));
    const house = makeHouse(
      width,
      floors,
      choose(facadeColors),
      choose(['step', 'bell', 'triangle']),
      -side
    );
    house.position.set(side * rand(12.2, 13.5), 0.4, z);
    house.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;
    house.rotation.z = rand(-0.012, 0.012);
    scene.add(house);
    z += width + rand(0.18, 0.52);
  }
}

function createLamp() {
  const group = new THREE.Group();

  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.28, 0.39, 0.32, 12),
    ironMaterial
  );
  base.position.y = 0.16;
  group.add(base);

  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.075, 0.12, 3.7, 10),
    ironMaterial
  );
  pole.position.y = 2.05;
  group.add(pole);

  const collar = new THREE.Mesh(
    new THREE.TorusGeometry(0.2, 0.055, 8, 16),
    ironMaterial
  );
  collar.rotation.x = Math.PI / 2;
  collar.position.y = 3.35;
  group.add(collar);

  const lantern = new THREE.Group();
  lantern.position.y = 4.1;

  const glow = new THREE.Mesh(
    new THREE.CylinderGeometry(0.27, 0.38, 0.72, 8),
    new THREE.MeshStandardMaterial({
      color: 0xffcd79,
      emissive: 0xff8a2e,
      emissiveIntensity: 3.5,
      transparent: true,
      opacity: 0.82
    })
  );
  lantern.add(glow);

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(0.52, 0.34, 8),
    ironMaterial
  );
  roof.position.y = 0.52;
  lantern.add(roof);

  const cap = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 8, 6),
    ironMaterial
  );
  cap.position.y = 0.75;
  lantern.add(cap);

  for (let i = 0; i < 4; i++) {
    const bar = new THREE.Mesh(
      new THREE.BoxGeometry(0.045, 0.82, 0.045),
      ironMaterial
    );
    const angle = i * Math.PI / 2;
    bar.position.set(Math.cos(angle) * 0.3, 0, Math.sin(angle) * 0.3);
    lantern.add(bar);
  }

  const light = new THREE.PointLight(0xffa64d, 5.5, 11, 2);
  light.position.y = 0.05;
  light.castShadow = false;
  lantern.add(light);
  group.add(lantern);
  group.userData.light = light;
  return shadowObject(group);
}

const lamps = [];
for (const side of [-1, 1]) {
  for (const z of [-25, -10, 8, 23]) {
    const lamp = createLamp();
    lamp.position.set(side * 9.35, 0.55, z);
    scene.add(lamp);
    lamps.push(lamp);
  }
}

function tubeBetween(a, b, radius, mat, segments = 8) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, length, segments),
    mat
  );
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  return mesh;
}

function createBicycle(color = 0x29343a) {
  const group = new THREE.Group();
  const bikeMaterial = material(color, { metalness: 0.62, roughness: 0.35 });
  const tireMaterial = material(0x111315, { roughness: 0.88 });

  for (const x of [-0.72, 0.72]) {
    const wheel = new THREE.Mesh(
      new THREE.TorusGeometry(0.48, 0.045, 8, 24),
      tireMaterial
    );
    wheel.position.set(x, 0.48, 0);
    group.add(wheel);

    for (let i = 0; i < 8; i++) {
      const angle = i * Math.PI / 4;
      group.add(tubeBetween(
        new THREE.Vector3(x, 0.48, 0),
        new THREE.Vector3(
          x + Math.cos(angle) * 0.43,
          0.48 + Math.sin(angle) * 0.43,
          0
        ),
        0.008,
        bikeMaterial,
        5
      ));
    }
  }

  const crank = new THREE.Vector3(0, 0.53, 0);
  const seatJoint = new THREE.Vector3(-0.25, 1.25, 0);
  const handleJoint = new THREE.Vector3(0.52, 1.22, 0);
  const rearHub = new THREE.Vector3(-0.72, 0.48, 0);
  const frontHub = new THREE.Vector3(0.72, 0.48, 0);

  [
    [rearHub, crank],
    [crank, seatJoint],
    [seatJoint, rearHub],
    [seatJoint, handleJoint],
    [handleJoint, frontHub],
    [crank, handleJoint]
  ].forEach(pair => group.add(
    tubeBetween(pair[0], pair[1], 0.035, bikeMaterial)
  ));

  const seat = new THREE.Mesh(
    new THREE.BoxGeometry(0.38, 0.09, 0.16),
    material(0x39241c)
  );
  seat.position.set(-0.28, 1.33, 0);
  group.add(seat);

  const handle = tubeBetween(
    new THREE.Vector3(0.45, 1.25, -0.3),
    new THREE.Vector3(0.45, 1.25, 0.3),
    0.025,
    bikeMaterial
  );
  group.add(handle);

  const basket = new THREE.Mesh(
    new THREE.BoxGeometry(0.38, 0.3, 0.32),
    material(0x76563b)
  );
  basket.position.set(0.56, 1.08, -0.28);
  group.add(basket);

  return shadowObject(group);
}

for (let i = 0; i < 7; i++) {
  const side = i % 2 ? -1 : 1;
  const bike = createBicycle(choose([0x22333a, 0x4a2422, 0x314431]));
  bike.position.set(side * 9.0, 0.56, -28 + i * 9.3);
  bike.rotation.y = side > 0 ? Math.PI / 2 : -Math.PI / 2;
  bike.rotation.z = side * rand(0.02, 0.09);
  scene.add(bike);
}

function createBoat() {
  const group = new THREE.Group();

  const hullShape = new THREE.Shape();
  hullShape.moveTo(-3.3, 0);
  hullShape.quadraticCurveTo(-2.8, -0.9, 0, -1.05);
  hullShape.quadraticCurveTo(2.8, -0.9, 3.3, 0);
  hullShape.lineTo(2.65, 0.62);
  hullShape.lineTo(-2.65, 0.62);
  hullShape.closePath();

  const hull = new THREE.Mesh(
    new THREE.ExtrudeGeometry(hullShape, {
      depth: 1.75,
      bevelEnabled: true,
      bevelSegments: 2,
      bevelSize: 0.12,
      bevelThickness: 0.12
    }),
    material(0x6d3527)
  );
  hull.position.z = -0.875;
  group.add(hull);

  const inner = new THREE.Mesh(
    new THREE.BoxGeometry(5.1, 0.25, 1.38),
    material(0x2b2420)
  );
  inner.position.y = 0.45;
  group.add(inner);

  for (let x = -2; x <= 2; x += 1) {
    const plank = new THREE.Mesh(
      new THREE.BoxGeometry(0.08, 0.12, 1.62),
      material(0x9a6740)
    );
    plank.position.set(x, 0.65, 0);
    group.add(plank);
  }

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.25, 0.75, 1.2),
    material(0x31554b)
  );
  cabin.position.set(0.9, 0.92, 0);
  group.add(cabin);

  for (const x of [-1.75, 1.75]) {
    const planter = new THREE.Mesh(
      new THREE.BoxGeometry(0.85, 0.28, 0.38),
      woodMaterial
    );
    planter.position.set(x, 0.88, -0.72);
    group.add(planter);

    for (let i = 0; i < 7; i++) {
      const stem = new THREE.Mesh(
        new THREE.CylinderGeometry(0.018, 0.025, rand(0.22, 0.42), 5),
        greenMaterial
      );
      stem.position.set(
        x + rand(-0.34, 0.34),
        1.12,
        -0.72 + rand(-0.12, 0.12)
      );
      group.add(stem);

      const flower = new THREE.Mesh(
        new THREE.SphereGeometry(0.07, 7, 5),
        material(choose([0xf28b83, 0xf0c258, 0xc996ca, 0xf1e3d0]))
      );
      flower.position.copy(stem.position);
      flower.position.y += 0.22;
      group.add(flower);
    }
  }

  const rope = tubeBetween(
    new THREE.Vector3(-3, 0.45, -0.7),
    new THREE.Vector3(-4.2, 0.9, -1.5),
    0.025,
    material(0xa58b67),
    6
  );
  group.add(rope);
  return shadowObject(group);
}

const boat = createBoat();
boat.position.set(4.3, 0.15, 13);
boat.rotation.y = Math.PI / 2;
scene.add(boat);

function createDuck(scale = 1) {
  const group = new THREE.Group();
  const bodyMaterial = material(0x4f3f31);
  const headMaterial = material(0x315341);

  const body = new THREE.Mesh(
    new THREE.SphereGeometry(0.38, 14, 9),
    bodyMaterial
  );
  body.scale.set(1.4, 0.72, 0.82);
  body.position.y = 0.24;
  group.add(body);

  const neck = new THREE.Mesh(
    new THREE.CylinderGeometry(0.13, 0.18, 0.38, 10),
    headMaterial
  );
  neck.position.set(0.33, 0.55, 0);
  neck.rotation.z = -0.2;
  group.add(neck);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.21, 12, 8),
    headMaterial
  );
  head.position.set(0.39, 0.79, 0);
  group.add(head);

  const bill = new THREE.Mesh(
    new THREE.ConeGeometry(0.11, 0.3, 6),
    material(0xdd9e3d)
  );
  bill.rotation.z = -Math.PI / 2;
  bill.position.set(0.65, 0.76, 0);
  group.add(bill);

  for (const z of [-0.13, 0.13]) {
    const eye = new THREE.Mesh(
      new THREE.SphereGeometry(0.025, 6, 4),
      material(0x050505)
    );
    eye.position.set(0.5, 0.86, z);
    group.add(eye);
  }

  group.scale.setScalar(scale);
  return shadowObject(group);
}

const ducks = [];
for (let i = 0; i < 4; i++) {
  const duck = createDuck(rand(0.68, 0.9));
  duck.position.set(rand(-2.1, 2.1), 0.08, -10 - i * 1.5);
  duck.rotation.y = rand(-0.12, 0.12);
  duck.userData.offset = i * 1.7;
  scene.add(duck);
  ducks.push(duck);
}

const laundryGroup = new THREE.Group();
scene.add(laundryGroup);

const laundryStart = new THREE.Vector3(-12.1, 9.4, -16);
const laundryEnd = new THREE.Vector3(12.1, 8.4, -16);
const laundryPoints = [];
for (let i = 0; i <= 32; i++) {
  const t = i / 32;
  laundryPoints.push(new THREE.Vector3(
    THREE.MathUtils.lerp(laundryStart.x, laundryEnd.x, t),
    THREE.MathUtils.lerp(laundryStart.y, laundryEnd.y, t)
      - Math.sin(Math.PI * t) * 1.0,
    laundryStart.z
  ));
}

const laundryCurve = new THREE.CatmullRomCurve3(laundryPoints);
const laundryLine = new THREE.Mesh(
  new THREE.TubeGeometry(laundryCurve, 48, 0.025, 5, false),
  material(0x453a30)
);
laundryGroup.add(laundryLine);

const cloths = [];
for (let i = 0; i < 10; i++) {
  const t = 0.12 + i * 0.082;
  const point = laundryCurve.getPoint(t);
  const width = rand(0.65, 1.05);
  const height = rand(0.75, 1.25);
  const cloth = new THREE.Mesh(
    new THREE.PlaneGeometry(width, height, 4, 4),
    material(choose([
      0xe1d2b9,
      0xb75f54,
      0x648596,
      0xc9aa62,
      0x797393
    ]), { side: THREE.DoubleSide })
  );
  cloth.position.copy(point);
  cloth.position.y -= height * 0.5;
  cloth.userData.base = cloth.position.clone();
  cloth.userData.phase = rand(0, Math.PI * 2);
  cloth.userData.amplitude = rand(0.04, 0.11);
  laundryGroup.add(cloth);
  cloths.push(cloth);

  for (const offset of [-width * 0.32, width * 0.32]) {
    const peg = new THREE.Mesh(
      new THREE.BoxGeometry(0.05, 0.2, 0.06),
      woodMaterial
    );
    peg.position.copy(point);
    peg.position.x += offset;
    laundryGroup.add(peg);
  }
}

function createFlowerPot() {
  const group = new THREE.Group();
  const pot = new THREE.Mesh(
    new THREE.CylinderGeometry(0.28, 0.2, 0.38, 10),
    material(0xa85b3f)
  );
  pot.position.y = 0.19;
  group.add(pot);

  for (let i = 0; i < 6; i++) {
    const leaf = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 7, 5),
      greenMaterial
    );
    leaf.scale.set(0.55, 1.45, 0.45);
    leaf.position.set(rand(-0.18, 0.18), rand(0.48, 0.75), rand(-0.15, 0.15));
    leaf.rotation.z = rand(-0.8, 0.8);
    group.add(leaf);
  }
  return shadowObject(group);
}

for (let i = 0; i < 12; i++) {
  const side = i % 2 ? -1 : 1;
  const pot = createFlowerPot();
  pot.position.set(side * rand(10.3, 11.2), 0.42, rand(-34, 32));
  scene.add(pot);
}

const clock = new THREE.Clock();
const tempColor = new THREE.Color();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  waterTexture.offset.y = elapsed * 0.012;
  waterTexture.offset.x = Math.sin(elapsed * 0.12) * 0.018;

  boat.position.y = 0.15 + Math.sin(elapsed * 0.82) * 0.07;
  boat.rotation.z = Math.sin(elapsed * 0.67) * 0.018;

  ducks.forEach((duck, index) => {
    const phase = elapsed * 0.38 + duck.userData.offset;
    duck.position.z = -10 - index * 1.5 + Math.sin(phase) * 2.2;
    duck.position.x += Math.sin(elapsed * 0.8 + index) * 0.0015;
    duck.position.y = 0.08 + Math.sin(elapsed * 2 + index) * 0.018;
  });

  cloths.forEach(cloth => {
    const wave = Math.sin(elapsed * 1.7 + cloth.userData.phase);
    cloth.rotation.y = wave * cloth.userData.amplitude;
    cloth.rotation.x = Math.sin(elapsed * 1.25 + cloth.userData.phase) * 0.035;
    cloth.position.z = cloth.userData.base.z + wave * 0.055;
  });

  lamps.forEach((lamp, index) => {
    const flicker =
      1 +
      Math.sin(elapsed * 7.3 + index * 2.1) * 0.025 +
      Math.sin(elapsed * 17.1 + index) * 0.012;
    lamp.userData.light.intensity = 5.5 * flicker;
  });

  reflectionStrips.forEach((strip, index) => {
    strip.material.opacity =
      0.055 +
      Math.max(0, Math.sin(elapsed * 1.8 + index * 0.71)) * 0.075;
    strip.scale.y = 0.82 + Math.sin(elapsed * 0.9 + index) * 0.18;
  });

  const duskPulse = 0.04 * Math.sin(elapsed * 0.18);
  tempColor.setRGB(1, 0.67 + duskPulse, 0.5);
  duskLight.color.lerp(tempColor, 0.01);

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

animate();
</script>
