<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Commuter Bicycle</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #d9e1e5; }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 22px;
      top: 18px;
      color: #263238;
      font: 600 14px/1.4 system-ui, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
      pointer-events: none;
      opacity: .72;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">City Commuter</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdce4e7);
    scene.fog = new THREE.Fog(0xdce4e7, 4.5, 9);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.01, 30);
    camera.position.set(1.65, 1.25, 2.35);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.55, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.minDistance = 1.5;
    controls.maxDistance = 4.2;
    controls.maxPolarAngle = Math.PI * 0.49;

    const hemi = new THREE.HemisphereLight(0xeaf5ff, 0x667064, 2.1);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xfff2dd, 4.2);
    key.position.set(-2.8, 4.5, 3.4);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -2.4;
    key.shadow.camera.right = 2.4;
    key.shadow.camera.top = 2.4;
    key.shadow.camera.bottom = -1;
    key.shadow.bias = -0.00025;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0x9fc7e8, 1.5);
    fill.position.set(3, 2.2, -3);
    scene.add(fill);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(4.5, 96),
      new THREE.MeshStandardMaterial({ color: 0xcbd3d1, roughness: 0.9, metalness: 0 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.receiveShadow = true;
    scene.add(ground);

    const bike = new THREE.Group();
    bike.rotation.y = -0.08;
    scene.add(bike);

    const frameMat = new THREE.MeshStandardMaterial({
      color: 0x174d48, metalness: 0.62, roughness: 0.25
    });
    const frameEdgeMat = new THREE.MeshStandardMaterial({
      color: 0x0d302e, metalness: 0.55, roughness: 0.28
    });
    const blackMat = new THREE.MeshStandardMaterial({
      color: 0x111315, metalness: 0.12, roughness: 0.55
    });
    const rubberMat = new THREE.MeshStandardMaterial({
      color: 0x080909, metalness: 0, roughness: 0.83
    });
    const metalMat = new THREE.MeshStandardMaterial({
      color: 0xaeb7ba, metalness: 0.92, roughness: 0.2
    });
    const darkMetalMat = new THREE.MeshStandardMaterial({
      color: 0x30363a, metalness: 0.83, roughness: 0.27
    });
    const rotorMat = new THREE.MeshStandardMaterial({
      color: 0xc7ced0, metalness: 0.95, roughness: 0.18,
      side: THREE.DoubleSide
    });
    const saddleMat = new THREE.MeshStandardMaterial({
      color: 0x42271c, metalness: 0.05, roughness: 0.7
    });
    const reflectorMat = new THREE.MeshStandardMaterial({
      color: 0xff9d18, emissive: 0x7a2900, emissiveIntensity: 0.35,
      roughness: 0.3
    });

    function mesh(geometry, material, parent = bike) {
      const object = new THREE.Mesh(geometry, material);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function cylinderBetween(a, b, radius, material, radialSegments = 12, parent = bike) {
      const start = new THREE.Vector3(a.x, a.y, a.z);
      const end = new THREE.Vector3(b.x, b.y, b.z);
      const delta = end.clone().sub(start);
      const length = delta.length();
      const object = mesh(
        new THREE.CylinderGeometry(radius, radius, length, radialSegments, 1, false),
        material,
        parent
      );
      object.position.copy(start).add(end).multiplyScalar(0.5);
      object.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
      return object;
    }

    function torusAt(x, y, z, major, tube, material, radial = 10, tubular = 64, parent = bike) {
      const object = mesh(new THREE.TorusGeometry(major, tube, radial, tubular), material, parent);
      object.position.set(x, y, z);
      return object;
    }

    const rear = new THREE.Vector3(-0.58, 0.375, 0);
    const front = new THREE.Vector3(0.58, 0.375, 0);
    const crank = new THREE.Vector3(-0.055, 0.34, 0);
    const seatTop = new THREE.Vector3(-0.205, 0.89, 0);
    const headLow = new THREE.Vector3(0.375, 0.69, 0);
    const headHigh = new THREE.Vector3(0.325, 0.91, 0);

    function createWheel(center, isFront) {
      const group = new THREE.Group();
      bike.add(group);

      torusAt(center.x, center.y, 0, 0.355, 0.025, rubberMat, 14, 96, group);
      torusAt(center.x, center.y, 0, 0.321, 0.008, metalMat, 8, 96, group);

      cylinderBetween(
        new THREE.Vector3(center.x, center.y, -0.057),
        new THREE.Vector3(center.x, center.y, 0.057),
        0.017, darkMetalMat, 16, group
      );

      const spokeCount = 28;
      for (let i = 0; i < spokeCount; i++) {
        const rimAngle = i / spokeCount * Math.PI * 2;
        const flangeAngle = rimAngle + (i % 2 === 0 ? 0.28 : -0.28);
        const side = i % 2 === 0 ? -0.045 : 0.045;
        const hubPoint = new THREE.Vector3(
          center.x + Math.cos(flangeAngle) * 0.025,
          center.y + Math.sin(flangeAngle) * 0.025,
          side
        );
        const rimPoint = new THREE.Vector3(
          center.x + Math.cos(rimAngle) * 0.312,
          center.y + Math.sin(rimAngle) * 0.312,
          0
        );
        cylinderBetween(hubPoint, rimPoint, 0.00115, metalMat, 5, group);
      }

      const rotorZ = -0.063;
      torusAt(center.x, center.y, rotorZ, 0.073, 0.0045, rotorMat, 6, 48, group);
      torusAt(center.x, center.y, rotorZ, 0.025, 0.0035, rotorMat, 6, 32, group);
      for (let i = 0; i < 6; i++) {
        const a = i * Math.PI / 3;
        cylinderBetween(
          new THREE.Vector3(center.x + Math.cos(a) * 0.026, center.y + Math.sin(a) * 0.026, rotorZ),
          new THREE.Vector3(center.x + Math.cos(a + 0.12) * 0.069, center.y + Math.sin(a + 0.12) * 0.069, rotorZ),
          0.0032, rotorMat, 6, group
        );
      }

      const caliper = mesh(new THREE.BoxGeometry(0.025, 0.055, 0.025), darkMetalMat, group);
      caliper.position.set(
        center.x + (isFront ? -0.062 : 0.062),
        center.y + 0.065,
        -0.074
      );
      caliper.rotation.z = isFront ? -0.35 : 0.35;

      const valve = cylinderBetween(
        new THREE.Vector3(center.x + 0.005, center.y - 0.309, 0),
        new THREE.Vector3(center.x + 0.005, center.y - 0.342, 0),
        0.002, darkMetalMat, 6, group
      );
      valve.castShadow = false;
    }

    createWheel(rear, false);
    createWheel(front, true);

    cylinderBetween(crank, seatTop, 0.024, frameMat, 16);
    cylinderBetween(seatTop, headHigh, 0.022, frameMat, 16);
    cylinderBetween(headLow, crank, 0.026, frameMat, 16);
    cylinderBetween(headHigh, headLow, 0.029, frameEdgeMat, 18);

    cylinderBetween(new THREE.Vector3(rear.x, rear.y, -0.034), new THREE.Vector3(crank.x, crank.y, -0.034), 0.014, frameMat, 12);
    cylinderBetween(new THREE.Vector3(rear.x, rear.y, 0.034), new THREE.Vector3(crank.x, crank.y, 0.034), 0.014, frameMat, 12);
    cylinderBetween(new THREE.Vector3(rear.x, rear.y, -0.035), new THREE.Vector3(seatTop.x - 0.015, seatTop.y - 0.075, -0.035), 0.012, frameMat, 12);
    cylinderBetween(new THREE.Vector3(rear.x, rear.y, 0.035), new THREE.Vector3(seatTop.x - 0.015, seatTop.y - 0.075, 0.035), 0.012, frameMat, 12);

    cylinderBetween(new THREE.Vector3(headLow.x, headLow.y, -0.034), new THREE.Vector3(front.x, front.y, -0.047), 0.013, frameEdgeMat, 12);
    cylinderBetween(new THREE.Vector3(headLow.x, headLow.y, 0.034), new THREE.Vector3(front.x, front.y, 0.047), 0.013, frameEdgeMat, 12);

    cylinderBetween(
      new THREE.Vector3(seatTop.x, seatTop.y - 0.015, 0),
      new THREE.Vector3(-0.235, 1.015, 0),
      0.014, darkMetalMat, 14
    );

    const saddleBase = mesh(new THREE.SphereGeometry(1, 28, 12), saddleMat);
    saddleBase.scale.set(0.145, 0.035, 0.083);
    saddleBase.position.set(-0.255, 1.03, 0);
    saddleBase.rotation.z = -0.055;

    const saddleNose = mesh(new THREE.SphereGeometry(1, 20, 10), saddleMat);
    saddleNose.scale.set(0.105, 0.027, 0.038);
    saddleNose.position.set(-0.13, 1.026, 0);
    saddleNose.rotation.z = -0.055;

    const steererTop = new THREE.Vector3(0.305, 1.005, 0);
    cylinderBetween(headHigh, steererTop, 0.013, darkMetalMat, 14);
    const stemEnd = new THREE.Vector3(0.42, 1.025, 0);
    cylinderBetween(steererTop, stemEnd, 0.015, darkMetalMat, 14);
    cylinderBetween(
      new THREE.Vector3(stemEnd.x, stemEnd.y, -0.285),
      new THREE.Vector3(stemEnd.x, stemEnd.y, 0.285),
      0.012, darkMetalMat, 14
    );

    for (const side of [-1, 1]) {
      const grip = cylinderBetween(
        new THREE.Vector3(stemEnd.x, stemEnd.y, side * 0.225),
        new THREE.Vector3(stemEnd.x, stemEnd.y, side * 0.31),
        0.016, rubberMat, 14
      );
      grip.rotation.x += side * 0.02;

      const brake = cylinderBetween(
        new THREE.Vector3(stemEnd.x - 0.005, stemEnd.y - 0.012, side * 0.18),
        new THREE.Vector3(stemEnd.x + 0.015, stemEnd.y - 0.065, side * 0.145),
        0.006, darkMetalMat, 8
      );
      brake.castShadow = true;
    }

    cylinderBetween(
      new THREE.Vector3(crank.x, crank.y, -0.082),
      new THREE.Vector3(crank.x, crank.y, 0.105),
      0.019, darkMetalMat, 16
    );
    torusAt(crank.x, crank.y, 0.112, 0.086, 0.006, darkMetalMat, 8, 64);

    for (let i = 0; i < 5; i++) {
      const angle = i * Math.PI * 2 / 5;
      cylinderBetween(
        new THREE.Vector3(crank.x + Math.cos(angle) * 0.019, crank.y + Math.sin(angle) * 0.019, 0.112),
        new THREE.Vector3(crank.x + Math.cos(angle) * 0.078, crank.y + Math.sin(angle) * 0.078, 0.112),
        0.004, darkMetalMat, 7
      );
    }

    const crankAngle = 0.55;
    const crankArmA = new THREE.Vector3(crank.x + Math.cos(crankAngle) * 0.16, crank.y + Math.sin(crankAngle) * 0.16, 0.125);
    const crankArmB = new THREE.Vector3(crank.x - Math.cos(crankAngle) * 0.16, crank.y - Math.sin(crankAngle) * 0.16, -0.095);
    cylinderBetween(new THREE.Vector3(crank.x, crank.y, 0.12), crankArmA, 0.009, metalMat, 10);
    cylinderBetween(new THREE.Vector3(crank.x, crank.y, -0.09), crankArmB, 0.009, metalMat, 10);

    function pedalAt(point) {
      const axleEnd = point.clone().add(new THREE.Vector3(0, 0, point.z > 0 ? 0.055 : -0.055));
      cylinderBetween(point, axleEnd, 0.006, metalMat, 8);
      const pedal = mesh(new THREE.BoxGeometry(0.09, 0.015, 0.045), blackMat);
      pedal.position.copy(axleEnd);
      pedal.rotation.z = crankAngle;
    }
    pedalAt(crankArmA);
    pedalAt(crankArmB);

    const rearCogZ = 0.105;
    torusAt(rear.x, rear.y, rearCogZ, 0.047, 0.004, darkMetalMat, 7, 40);
    torusAt(rear.x, rear.y, rearCogZ + 0.008, 0.037, 0.003, darkMetalMat, 7, 40);

    const chainMat = new THREE.MeshStandardMaterial({
      color: 0x5b5e5d, metalness: 0.9, roughness: 0.32
    });
    cylinderBetween(
      new THREE.Vector3(rear.x + 0.005, rear.y + 0.047, 0.125),
      new THREE.Vector3(crank.x + 0.01, crank.y + 0.086, 0.125),
      0.0032, chainMat, 6
    );
    cylinderBetween(
      new THREE.Vector3(rear.x + 0.008, rear.y - 0.043, 0.125),
      new THREE.Vector3(crank.x - 0.01, crank.y - 0.085, 0.125),
      0.0032, chainMat, 6
    );
    torusAt(rear.x, rear.y, 0.125, 0.048, 0.003, chainMat, 6, 48);
    torusAt(crank.x, crank.y, 0.125, 0.087, 0.003, chainMat, 6, 64);

    const derailleurPivot = new THREE.Vector3(rear.x - 0.015, rear.y - 0.065, 0.145);
    const derailleurLower = new THREE.Vector3(rear.x + 0.025, rear.y - 0.155, 0.145);
    cylinderBetween(
      new THREE.Vector3(rear.x, rear.y, 0.125),
      derailleurPivot, 0.011, darkMetalMat, 10
    );
    cylinderBetween(derailleurPivot, derailleurLower, 0.009, darkMetalMat, 10);
    torusAt(derailleurLower.x, derailleurLower.y, derailleurLower.z, 0.022, 0.005, darkMetalMat, 7, 32);
    const derailleurBody = mesh(new THREE.BoxGeometry(0.055, 0.035, 0.035), darkMetalMat);
    derailleurBody.position.set(rear.x - 0.005, rear.y - 0.045, 0.145);
    derailleurBody.rotation.z = -0.45;

    const bottleLineA = new THREE.Vector3(0.11, 0.57, 0.03);
    const bottleLineB = new THREE.Vector3(0.22, 0.68, 0.03);
    const bolt1 = mesh(new THREE.SphereGeometry(0.009, 12, 8), metalMat);
    bolt1.position.copy(bottleLineA);
    const bolt2 = mesh(new THREE.SphereGeometry(0.009, 12, 8), metalMat);
    bolt2.position.copy(bottleLineB);

    const cageMat = new THREE.MeshStandardMaterial({
      color: 0x8d9799, metalness: 0.88, roughness: 0.25
    });
    cylinderBetween(new THREE.Vector3(0.105, 0.55, 0.045), new THREE.Vector3(0.19, 0.49, 0.07), 0.0035, cageMat, 7);
    cylinderBetween(new THREE.Vector3(0.19, 0.49, 0.07), new THREE.Vector3(0.28, 0.62, 0.07), 0.0035, cageMat, 7);
    cylinderBetween(new THREE.Vector3(0.28, 0.62, 0.07), new THREE.Vector3(0.22, 0.7, 0.045), 0.0035, cageMat, 7);
    cylinderBetween(new THREE.Vector3(0.19, 0.49, 0.07), new THREE.Vector3(0.19, 0.49, -0.035), 0.0035, cageMat, 7);

    const rearReflector = mesh(new THREE.BoxGeometry(0.012, 0.055, 0.03), reflectorMat);
    rearReflector.position.set(-0.49, 0.68, -0.04);
    rearReflector.rotation.z = -0.55;

    const frontReflector = mesh(new THREE.BoxGeometry(0.012, 0.06, 0.033), reflectorMat);
    frontReflector.position.set(0.48, 0.68, -0.045);
    frontReflector.rotation.z = 0.48;

    const kickstand = cylinderBetween(
      new THREE.Vector3(-0.12, 0.31, -0.045),
      new THREE.Vector3(-0.25, 0.035, -0.15),
      0.006, darkMetalMat, 9
    );
    const standFoot = mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.026, 10), rubberMat);
    standFoot.position.set(-0.25, 0.025, -0.15);
    standFoot.rotation.z = Math.PI / 2;

    const contactShadows = [];
    for (const x of [rear.x, front.x]) {
      const shadow = new THREE.Mesh(
        new THREE.CircleGeometry(0.2, 40),
        new THREE.MeshBasicMaterial({
          color: 0x66706e, transparent: true, opacity: 0.13,
          depthWrite: false
        })
      );
      shadow.rotation.x = -Math.PI / 2;
      shadow.scale.set(1, 0.22, 1);
      shadow.position.set(x, 0.003, 0);
      scene.add(shadow);
      contactShadows.push(shadow);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
