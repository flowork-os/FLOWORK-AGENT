<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brushed Aluminum Stag Beetle</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d10; }
  #c { display: block; width: 100%; height: 100%; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 -apple-system, system-ui, sans-serif;
    color: #7d8794; letter-spacing: .3px; user-select: none; pointer-events: none;
    text-shadow: 0 1px 2px #000;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Machined Stag Beetle — brushed aluminum &amp; anodized bronze · drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------- Renderer */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* ---------------------------------------------------------- Scene / Camera */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0e11);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(7.5, 4.8, 9.5);

/* Studio environment for crisp metal reflections */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------------------------------------------------------- Controls */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.minDistance = 5;
controls.maxDistance = 26;
controls.maxPolarAngle = Math.PI * 0.52;

/* ---------------------------------------------------------- Lighting */
const hemi = new THREE.HemisphereLight(0xbfd0e6, 0x1a1712, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e0, 2.6);
key.position.set(6.5, 10, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 40;
key.shadow.camera.left = -9;
key.shadow.camera.right = 9;
key.shadow.camera.top = 9;
key.shadow.camera.bottom = -9;
key.shadow.bias = -0.0002;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fb6d8, 0.8);
fill.position.set(-8, 4.5, 3.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd7a0, 1.6);
rim.position.set(-4.5, 5.5, -8);
scene.add(rim);

/* ---------------------------------------------------------- Brushed grain texture */
function brushedTexture() {
  const s = 512;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  const g = 128;
  ctx.fillStyle = `rgb(${g},${g},${g})`;
  ctx.fillRect(0, 0, s, s);
  // fine directional streaks (horizontal in UV -> aligned along part length)
  for (let i = 0; i < 9000; i++) {
    const y = Math.random() * s;
    const v = (Math.random() - 0.5) * 90;
    const c = Math.max(0, Math.min(255, g + v));
    ctx.strokeStyle = `rgba(${c},${c},${c},${0.05 + Math.random() * 0.08})`;
    ctx.lineWidth = Math.random() * 1.4 + 0.2;
    const x0 = Math.random() * s;
    const len = 40 + Math.random() * 260;
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(x0 + len, y + (Math.random() - 0.5) * 2.5);
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.NoColorSpace;
  tex.anisotropy = 8;
  tex.repeat.set(3, 3);
  return tex;
}
const grain = brushedTexture();

/* ---------------------------------------------------------- Materials */
const alu = new THREE.MeshPhysicalMaterial({
  color: 0xc4c8cd, metalness: 1.0, roughness: 0.40,
  roughnessMap: grain, bumpMap: grain, bumpScale: 0.006,
  anisotropy: 0.9, anisotropyRotation: 0.0,
  clearcoat: 0.12, clearcoatRoughness: 0.5,
  envMapIntensity: 1.15, side: THREE.DoubleSide
});

const bronze = new THREE.MeshPhysicalMaterial({
  color: 0xa06a30, metalness: 1.0, roughness: 0.33,
  roughnessMap: grain, bumpMap: grain, bumpScale: 0.005,
  anisotropy: 0.8,
  clearcoat: 0.4, clearcoatRoughness: 0.35,
  iridescence: 0.22, iridescenceIOR: 1.6,
  envMapIntensity: 1.3, side: THREE.DoubleSide
});

const satin = new THREE.MeshPhysicalMaterial({
  color: 0xa9adb2, metalness: 0.96, roughness: 0.52,
  roughnessMap: grain, bumpMap: grain, bumpScale: 0.004,
  anisotropy: 0.6,
  envMapIntensity: 1.05, side: THREE.DoubleSide
});

const dark = new THREE.MeshStandardMaterial({
  color: 0x16181c, metalness: 0.9, roughness: 0.32, envMapIntensity: 0.9
});

const eyeMat = new THREE.MeshPhysicalMaterial({
  color: 0x090a0c, metalness: 0.5, roughness: 0.12,
  clearcoat: 1.0, clearcoatRoughness: 0.08, envMapIntensity: 1.4
});

/* ---------------------------------------------------------- Build helpers */
const beetle = new THREE.Group();
scene.add(beetle);

function addMesh(m) {
  m.castShadow = true;
  m.receiveShadow = true;
  beetle.add(m);
  return m;
}

/* connect two points with a tapered cylinder (r1 at a, r2 at b) */
function buildBone(a, b, r1, r2, mat) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(r2, r1, len, 18, 1, false);
  geo.translate(0, len / 2, 0);
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(a);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  return m;
}

/* swept tapered tube from a curve with a radius function */
function taperedTube(curve, tubular, radial, radiusFn) {
  const frames = curve.computeFrenetFrames(tubular, false);
  const pos = [], idx = [];
  const P = new THREE.Vector3(), N = new THREE.Vector3(), B = new THREE.Vector3(), v = new THREE.Vector3();
  for (let i = 0; i <= tubular; i++) {
    const t = i / tubular;
    curve.getPointAt(t, P);
    N.copy(frames.normals[i]); B.copy(frames.binormals[i]);
    const r = radiusFn(t);
    for (let j = 0; j <= radial; j++) {
      const th = (j / radial) * Math.PI * 2;
      const c = Math.cos(th), sn = Math.sin(th);
      v.set(c * N.x + sn * B.x, c * N.y + sn * B.y, c * N.z + sn * B.z).normalize();
      pos.push(P.x + r * v.x, P.y + r * v.y, P.z + r * v.z);
    }
  }
  for (let i = 0; i < tubular; i++) {
    for (let j = 0; j < radial; j++) {
      const a = (radial + 1) * i + j;
      const b = (radial + 1) * (i + 1) + j;
      const c = (radial + 1) * (i + 1) + j + 1;
      const d = (radial + 1) * i + j + 1;
      idx.push(a, b, d, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* ---------------------------------------------------------- Body core (aluminum) */
// Head
const head = new THREE.Mesh(new THREE.SphereGeometry(0.58, 40, 32), alu);
head.scale.set(1.15, 0.6, 0.92);
head.position.set(0, 0.06, 0.18);
addMesh(head);

// Clypeus / face plate
const clypeus = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.16, 0.34), alu);
clypeus.position.set(0, 0.0, 0.55);
addMesh(clypeus);

// Neck
const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.5, 0.35, 28), alu);
neck.rotation.x = Math.PI / 2;
neck.position.set(0, 0.08, -0.25);
addMesh(neck);

// Pronotum (thoracic shield) — domed brushed plate
const pronotum = new THREE.Mesh(new THREE.SphereGeometry(1.0, 44, 32), alu);
pronotum.scale.set(1.28, 0.56, 0.95);
pronotum.position.set(0, 0.14, -0.95);
addMesh(pronotum);

// Pronotum lower body block (underside/thorax)
const thorax = new THREE.Mesh(new THREE.SphereGeometry(0.95, 36, 28), alu);
thorax.scale.set(1.05, 0.6, 0.95);
thorax.position.set(0, -0.15, -0.95);
addMesh(thorax);

// Scutellum — small triangular plate between elytra
const scut = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.35, 3), alu);
scut.rotation.x = Math.PI / 2;
scut.rotation.z = Math.PI;
scut.position.set(0, 0.5, -1.7);
addMesh(scut);

/* ---------------------------------------------------------- Elytra (anodized bronze wing casings) */
function elytron(sign) {
  const e = new THREE.Mesh(new THREE.SphereGeometry(1.0, 48, 36), bronze);
  e.scale.set(0.92, 0.9, 1.95);
  e.position.set(sign * 0.47, 0.2, -3.45);
  e.rotation.z = sign * -0.05;
  addMesh(e);

  // subtle longitudinal ridge lines (plating grain)
  for (let k = 0; k < 3; k++) {
    const rc = new THREE.CatmullRomCurve3([
      new THREE.Vector3(sign * (0.35 + k * 0.25), 0.95 - k * 0.18, -1.7),
      new THREE.Vector3(sign * (0.55 + k * 0.28), 1.02 - k * 0.2, -3.3),
      new THREE.Vector3(sign * (0.42 + k * 0.24), 0.85 - k * 0.2, -4.7),
      new THREE.Vector3(sign * (0.18 + k * 0.14), 0.55 - k * 0.16, -5.15)
    ]);
    const rg = taperedTube(rc, 60, 8, () => 0.018);
    addMesh(new THREE.Mesh(rg, bronze));
  }
}
elytron(1);
elytron(-1);

// Central elytral seam
const seamCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 0.62, -1.65),
  new THREE.Vector3(0, 1.02, -3.3),
  new THREE.Vector3(0, 0.72, -4.9),
  new THREE.Vector3(0, 0.4, -5.35)
]);
addMesh(new THREE.Mesh(taperedTube(seamCurve, 70, 8, () => 0.03), dark));

// Abdomen tip
const abd = new THREE.Mesh(new THREE.SphereGeometry(0.45, 28, 22), alu);
abd.scale.set(0.9, 0.7, 0.8);
abd.position.set(0, 0.05, -5.35);
addMesh(abd);

/* ---------------------------------------------------------- Per-side features (mandibles, antennae, eyes, legs) */
function makeSide(sign) {
  /* --- Mandible: huge branching curved milled blade --- */
  const mCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(sign * 0.28, 0.02, 0.42),
    new THREE.Vector3(sign * 0.55, 0.12, 1.05),
    new THREE.Vector3(sign * 0.80, 0.30, 1.75),
    new THREE.Vector3(sign * 0.74, 0.54, 2.45),
    new THREE.Vector3(sign * 0.42, 0.70, 2.95),
    new THREE.Vector3(sign * 0.10, 0.62, 3.30)
  ]);
  const mGeo = taperedTube(mCurve, 120, 18, t => 0.26 * Math.pow(1 - t, 0.85) + 0.028);
  // flatten slightly toward a blade
  mGeo.scale(1, 0.82, 1);
  addMesh(new THREE.Mesh(mGeo, alu));

  // mandible base knuckle
  const knuckle = new THREE.Mesh(new THREE.SphereGeometry(0.24, 24, 18), alu);
  knuckle.position.set(sign * 0.28, 0.02, 0.42);
  addMesh(knuckle);

  // inner teeth / branching tines
  const tineT = [0.34, 0.5, 0.64, 0.78];
  const tineLen = [0.42, 0.5, 0.4, 0.3];
  tineT.forEach((t, i) => {
    const base = mCurve.getPointAt(t);
    const tip = new THREE.Vector3(
      base.x - sign * tineLen[i] * 0.9,
      base.y + tineLen[i] * 0.5,
      base.z + tineLen[i] * 0.35
    );
    addMesh(buildBone(base, tip, 0.11 - i * 0.014, 0.006, alu));
  });

  /* --- Compound eye --- */
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.17, 24, 18), eyeMat);
  eye.scale.set(1, 0.9, 0.8);
  eye.position.set(sign * 0.55, 0.12, 0.28);
  addMesh(eye);

  /* --- Geniculate antenna --- */
  const aBase = new THREE.Vector3(sign * 0.42, 0.02, 0.6);
  const aElbow = new THREE.Vector3(sign * 0.95, 0.22, 1.25);
  const aClub = new THREE.Vector3(sign * 1.18, 0.42, 1.75);
  addMesh(buildBone(aBase, aElbow, 0.055, 0.045, satin)); // scape
  const jb = new THREE.Mesh(new THREE.SphereGeometry(0.06, 14, 12), satin);
  jb.position.copy(aElbow); addMesh(jb);
  addMesh(buildBone(aElbow, aClub, 0.045, 0.035, satin)); // funicle
  // lamellate club (comb of flat plates)
  const clubDir = new THREE.Vector3().subVectors(aClub, aElbow).normalize();
  for (let i = 0; i < 5; i++) {
    const plate = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.02, 0.11), bronze);
    const p = aClub.clone().addScaledVector(clubDir, i * 0.06);
    plate.position.copy(p);
    plate.position.x += sign * 0.06;
    plate.lookAt(p.clone().add(clubDir));
    plate.rotation.z += sign * 0.5;
    addMesh(plate);
  }

  /* --- Legs (satin metal, sharp barbs) --- */
  const legJoints = [
    // front (reaches forward)
    [[0.52, -0.18, -0.55], [1.30, -0.72, 0.10], [1.85, -1.35, 0.72], [2.10, -1.55, 1.28]],
    // middle
    [[0.58, -0.18, -1.02], [1.48, -0.78, -1.06], [2.08, -1.40, -1.10], [2.38, -1.60, -1.16]],
    // hind (reaches back)
    [[0.52, -0.18, -1.58], [1.30, -0.72, -2.35], [1.85, -1.35, -2.98], [2.10, -1.55, -3.48]]
  ];
  const radii = [[0.17, 0.12], [0.12, 0.08], [0.085, 0.03]];

  legJoints.forEach(J => {
    const pts = J.map(p => new THREE.Vector3(p[0] * sign, p[1], p[2]));
    // coxa knob at hip
    const coxa = new THREE.Mesh(new THREE.SphereGeometry(0.19, 18, 14), satin);
    coxa.position.copy(pts[0]); addMesh(coxa);
    // three articulated segments
    for (let i = 0; i < 3; i++) {
      addMesh(buildBone(pts[i], pts[i + 1], radii[i][0], radii[i][1], satin));
      const jt = new THREE.Mesh(new THREE.SphereGeometry(radii[i][1] * 1.25, 14, 12), satin);
      jt.position.copy(pts[i + 1]); addMesh(jt);
    }
    // barbs at the foot
    const ankle = pts[2], toe = pts[3];
    const dir = new THREE.Vector3().subVectors(toe, ankle).normalize();
    const up = new THREE.Vector3(0, 1, 0);
    const perp = new THREE.Vector3().crossVectors(dir, up).normalize();
    for (const s of [-1, 1]) {
      const tip = toe.clone()
        .addScaledVector(dir, 0.30)
        .addScaledVector(perp, 0.09 * s)
        .add(new THREE.Vector3(0, -0.04, 0));
      addMesh(buildBone(toe, tip, 0.05, 0.004, satin));
    }
  });
}
makeSide(1);
makeSide(-1);

/* ---------------------------------------------------------- Sit on ground + frame */
let box = new THREE.Box3().setFromObject(beetle);
beetle.position.y -= box.min.y;          // rest feet on y = 0
box.setFromObject(beetle);
const center = box.getCenter(new THREE.Vector3());
controls.target.set(0, center.y, center.z);
controls.update();

/* ---------------------------------------------------------- Shadow-only ground */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------- Resize + loop */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
