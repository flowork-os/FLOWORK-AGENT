<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Classic Red Glass Phone Booth</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #11151b;
    }
    canvas {
      display: block;
    }
    #label {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(255,255,255,.62);
      font: 11px/1.4 Arial, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="label">London Telephone No. 1</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x11151b);
    scene.fog = new THREE.Fog(0x11151b, 12, 24);

    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(7.2, 5.3, 8.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.45, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.minDistance = 5.4;
    controls.maxDistance = 14;
    controls.maxPolarAngle = Math.PI * 0.48;

    const booth = new THREE.Group();
    scene.add(booth);

    const red = new THREE.MeshStandardMaterial({
      color: 0x9e171c,
      roughness: 0.29,
      metalness: 0.42
    });
    const redDark = new THREE.MeshStandardMaterial({
      color: 0x641015,
      roughness: 0.34,
      metalness: 0.48
    });
    const redEdge = new THREE.MeshStandardMaterial({
      color: 0xc42b2f,
      roughness: 0.26,
      metalness: 0.3
    });
    const blackMetal = new THREE.MeshStandardMaterial({
      color: 0x17191b,
      roughness: 0.23,
      metalness: 0.82
    });
    const brass = new THREE.MeshStandardMaterial({
      color: 0xd39b39,
      roughness: 0.22,
      metalness: 0.8
    });
    const glass = new THREE.MeshPhysicalMaterial({
      color: 0x80b7c3,
      roughness: 0.08,
      metalness: 0.08,
      transmission: 0.74,
      transparent: true,
      opacity: 0.52,
      thickness: 0.035,
      ior: 1.46,
      side: THREE.DoubleSide
    });
    const glassDark = new THREE.MeshPhysicalMaterial({
      color: 0x2e707d,
      roughness: 0.1,
      metalness: 0.06,
      transmission: 0.56,
      transparent: true,
      opacity: 0.42,
      thickness: 0.03,
      ior: 1.45,
      side: THREE.DoubleSide
    });
    const interior = new THREE.MeshStandardMaterial({
      color: 0x282729,
      roughness: 0.72,
      metalness: 0.12
    });
    const rubber = new THREE.MeshStandardMaterial({
      color: 0x090a0b,
      roughness: 0.7,
      metalness: 0.08
    });

    function box(name, size, position, material, parent = booth) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material);
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function cylinder(name, radius, height, position, material, rotation = [0, 0, 0], parent = booth, segments = 24) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, segments), material);
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function pane(position, size, material = glass, parent = booth) {
      const p = box("glass pane", size, position, material, parent);
      p.castShadow = false;
      p.receiveShadow = true;
      return p;
    }

    function addWindowGrid(side, y0, y1, rows, cols, inset = 0.11) {
      const h = y1 - y0;
      const cellH = h / rows;
      if (side === "back") {
        const x0 = -0.91, width = 1.82;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const cw = width / cols;
            pane([
              x0 + cw * (c + 0.5),
              y0 + cellH * (r + 0.5),
              0.955
            ], [cw - inset, cellH - inset, 0.025], glassDark);
          }
        }
      }
      if (side === "left" || side === "right") {
        const z0 = -0.82, depth = 1.64;
        const x = side === "left" ? -1.095 : 1.095;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const cd = depth / cols;
            pane([
              x,
              y0 + cellH * (r + 0.5),
              z0 + cd * (c + 0.5)
            ], [0.025, cellH - inset, cd - inset], glass);
          }
        }
      }
    }

    const W = 2.25;
    const D = 2.0;
    const H = 4.65;
    const baseY = 0.18;
    const roofY = 4.52;

    box("floor base", [W + 0.22, 0.22, D + 0.22], [0, 0.11, 0], redDark);
    box("floor inset", [W - 0.12, 0.08, D - 0.12], [0, 0.26, 0], interior);

    const postX = 1.03;
    const postZ = 0.88;
    [ [-postX, baseY, -postZ], [postX, baseY, -postZ], [-postX, baseY, postZ], [postX, baseY, postZ] ]
      .forEach((p, i) => box("corner upright " + i, [0.18, H, 0.18], [p[0], H / 2, p[2]], red));

    box("front lintel", [W, 0.23, 0.18], [0, roofY - 0.12, -postZ], redEdge);
    box("back lintel", [W, 0.23, 0.18], [0, roofY - 0.12, postZ], red);
    box("left lintel", [0.18, 0.23, D - 0.18], [-postX, roofY - 0.12, 0], red);
    box("right lintel", [0.18, 0.23, D - 0.18], [postX, roofY - 0.12, 0], red);

    const lowerTop = 1.02;
    const upperBottom = 1.16;

    addWindowGrid("back", lowerTop, roofY - 0.28, 4, 4);
    addWindowGrid("left", lowerTop, roofY - 0.28, 4, 3);
    addWindowGrid("right", lowerTop, roofY - 0.28, 4, 3);

    pane([0, 0.66, 0.96], [1.82, 0.72, 0.025], glassDark);
    pane([-1.095, 0.66, 0], [0.025, 0.72, 1.64], glassDark);
    pane([1.095, 0.66, 0], [0.025, 0.72, 1.64], glassDark);

    box("back lower rail", [1.84, 0.14, 0.17], [0, 1.02, 0.94], red);
    box("left lower rail", [0.17, 0.14, 1.66], [-1.04, 1.02, 0], red);
    box("right lower rail", [0.17, 0.14, 1.66], [1.04, 1.02, 0], red);

    const door = new THREE.Group();
    door.position.set(-0.88, 0.28, -1.12);
    door.rotation.y = -0.035;
    booth.add(door);

    box("door bottom rail", [1.78, 0.18, 0.14], [0.89, 0, 0], redEdge, door);
    box("door top rail", [1.78, 0.18, 0.14], [0.89, 4.14, 0], redEdge, door);
    box("door hinge stile", [0.16, 4.22, 0.14], [0.09, 2.07, 0], red, door);
    box("door latch stile", [0.16, 4.22, 0.14], [1.69, 2.07, 0], red, door);

    const doorCellW = 1.48 / 2;
    const doorCellH = 3.76 / 3;
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 2; c++) {
        pane([
          0.17 + doorCellW * (c + 0.5),
          0.27 + doorCellH * (r + 0.5),
          -0.006
        ], [doorCellW - 0.1, doorCellH - 0.1, 0.025], glass, door);
      }
    }
    box("door mullion vertical", [0.12, 3.9, 0.13], [0.89, 2.08, 0], red, door);
    box("door mullion horizontal 1", [1.55, 0.12, 0.13], [0.89, 1.51, 0], red, door);
    box("door mullion horizontal 2", [1.55, 0.12, 0.13], [0.89, 2.76, 0], red, door);

    cylinder("handle mount", 0.075, 0.12, [1.43, 2.1, -0.1], brass, [Math.PI / 2, 0, 0], door);
    cylinder("door handle", 0.045, 0.42, [1.43, 2.1, -0.18], brass, [Math.PI / 2, 0, 0], door);
    cylinder("handle end", 0.075, 0.08, [1.43, 2.1, -0.39], brass, [Math.PI / 2, 0, 0], door);

    box("shelf", [1.62, 0.12, 0.5], [0, 1.56, 0.42], redDark);
    box("shelf front trim", [1.66, 0.11, 0.08], [0, 1.53, 0.19], redEdge);

    const phone = new THREE.Group();
    phone.position.set(0.19, 1.72, 0.38);
    booth.add(phone);
    box("telephone body", [0.44, 0.25, 0.26], [0, 0, 0], blackMetal, phone);
    box("telephone top", [0.32, 0.11, 0.22], [0, 0.17, 0], blackMetal, phone);
    cylinder("dial", 0.11, 0.025, [0, 0.24, -0.13], brass, [Math.PI / 2, 0, 0], phone, 32);
    cylinder("dial center", 0.035, 0.035, [0, 0.25, -0.15], rubber, [Math.PI / 2, 0, 0], phone, 24);

    const receiver = new THREE.Group();
    receiver.position.set(0, 0.34, 0);
    receiver.rotation.z = 0.05;
    phone.add(receiver);
    box("receiver grip", [0.46, 0.12, 0.12], [0, 0, 0], rubber, receiver);
    cylinder("receiver left end", 0.11, 0.19, [-0.23, 0, 0], rubber, [0, 0, Math.PI / 2], receiver);
    cylinder("receiver right end", 0.11, 0.19, [0.23, 0, 0], rubber, [0, 0, Math.PI / 2], receiver);

    box("ceiling", [1.9, 0.12, 1.68], [0, 4.42, 0], redDark);
    box("ceiling inner panel", [1.58, 0.025, 1.38], [0, 4.35, 0], interior);

    const roof = new THREE.Group();
    roof.position.y = 4.7;
    booth.add(roof);
    box("roof slab", [2.55, 0.2, 2.28], [0, 0, 0], red);
    box("roof upper slab", [2.28, 0.14, 2.0], [0, 0.17, 0], redEdge);

    const crownShape = new THREE.Shape();
    crownShape.moveTo(-0.88, 0);
    crownShape.lineTo(-0.75, 0.58);
    crownShape.lineTo(-0.42, 0.3);
    crownShape.lineTo(0, 0.72);
    crownShape.lineTo(0.42, 0.3);
    crownShape.lineTo(0.75, 0.58);
    crownShape.lineTo(0.88, 0);
    crownShape.closePath();

    const crownGeo = new THREE.ExtrudeGeometry(crownShape, {
      depth: 0.12,
      bevelEnabled: true,
      bevelSegments: 2,
      bevelSize: 0.035,
      bevelThickness: 0.035
    });
    crownGeo.center();
    const crown = new THREE.Mesh(crownGeo, brass);
    crown.position.set(0, 0.72, -0.08);
    crown.rotation.x = 0;
    crown.castShadow = true;
    roof.add(crown);

    const signCanvas = document.createElement("canvas");
    signCanvas.width = 1024;
    signCanvas.height = 256;
    const ctx = signCanvas.getContext("2d");
    ctx.fillStyle = "#8f151b";
    ctx.fillRect(0, 0, 1024, 256);
    ctx.strokeStyle = "#d29b3d";
    ctx.lineWidth = 18;
    ctx.strokeRect(12, 12, 1000, 232);
    ctx.fillStyle = "#f4d485";
    ctx.font = "bold 106px Georgia, serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("TELEPHONE", 512, 132);
    const signTexture = new THREE.CanvasTexture(signCanvas);
    signTexture.colorSpace = THREE.SRGBColorSpace;
    const signMat = new THREE.MeshStandardMaterial({
      map: signTexture,
      roughness: 0.3,
      metalness: 0.25
    });
    box("roof sign", [1.82, 0.48, 0.11], [0, 0.45, -0.12], signMat, roof);
    box("sign top trim", [1.92, 0.06, 0.15], [0, 0.72, -0.12], brass, roof);
    box("sign bottom trim", [1.92, 0.06, 0.15], [0, 0.18, -0.12], brass, roof);

    const lamp = new THREE.PointLight(0xffd49a, 2.1, 5.4, 2);
    lamp.position.set(0, 3.95, 0.25);
    lamp.castShadow = true;
    lamp.shadow.mapSize.set(512, 512);
    booth.add(lamp);
    const lampShade = new THREE.Mesh(
      new THREE.CylinderGeometry(0.22, 0.34, 0.15, 24),
      new THREE.MeshStandardMaterial({ color: 0xe3a73f, roughness: 0.28, metalness: 0.45 })
    );
    lampShade.position.set(0, 4.18, 0.25);
    lampShade.castShadow = true;
    booth.add(lampShade);

    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x252b31,
      roughness: 0.9,
      metalness: 0.05
    });
    const ground = new THREE.Mesh(new THREE.CircleGeometry(18, 64), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const backWall = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 14),
      new THREE.MeshStandardMaterial({ color: 0x1a2027, roughness: 0.95 })
    );
    backWall.position.set(0, 6.5, -5.5);
    backWall.receiveShadow = true;
    scene.add(backWall);

    scene.add(new THREE.HemisphereLight(0x9eb5c8, 0x211d1b, 1.7));

    const key = new THREE.DirectionalLight(0xffe4c4, 4.5);
    key.position.set(-5, 9, 7);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -7;
    key.shadow.camera.right = 7;
    key.shadow.camera.top = 9;
    key.shadow.camera.bottom = -3;
    key.shadow.bias = -0.0002;
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x86a8d8, 2.2);
    rim.position.set(5, 5, -6);
    scene.add(rim);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
