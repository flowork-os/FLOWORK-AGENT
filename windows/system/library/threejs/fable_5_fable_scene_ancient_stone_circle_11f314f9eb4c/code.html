<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ancient Stone Circle</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b101c}
  canvas{display:block}
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================================================
   1. CONFIG & PALETTE — every colour and tuning constant in one place
   ================================================================ */
const CFG = { seed: 41520818, fogNear: 34, fogFar: 120, camPos: [19.5, 12.5, 19.5], camTarget: [0, 2.8, 0] };
const PAL = {
  fog: '#141d2b', moor: '#232c1f',
  stoneTint: '#b9c0bd', rune: '#7fe8ff',
  wood: '#4a3a26', iron: '#20242a',
  flame: '#ffb347', flameCore: '#ffe8b0',
  raven: '#101318', beak: '#3a3f46',
  heather: '#39442f', bloom: '#8a5fa8',
  mist: '#9fb4c8', moon: '#f4f0e2',
  ember: '#ff9a4d',
};

/* ================================================================
   2. SEEDED PRNG & SMALL HELPERS — all randomness flows through rng
   ================================================================ */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(CFG.seed);
const R  = (a, b) => a + (b - a) * rng();
const RI = (a, b) => Math.floor(R(a, b + 1));
const UP = new THREE.Vector3(0, 1, 0);
const sh = (m) => { m.castShadow = true; m.receiveShadow = true; return m; };
/* rolling moorland height — kept flat inside the ring of stones */
const groundH = (x, z) => {
  const f = Math.min(1, Math.max(0, (Math.hypot(x, z) - 13) / 14));
  return f * (0.7 * Math.sin(x * 0.11 + 0.8) * Math.cos(z * 0.13 - 1.1) + 0.4 * Math.sin((x + z) * 0.17));
};
/* position-hash so weathering keeps shared box vertices welded */
const vHash = (x, y, z, k) => {
  const s = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719 + k * 94.673) * 43758.5453;
  return s - Math.floor(s);
};

/* ================================================================
   3. RENDERER / SCENE / CAMERA / CONTROLS
   ================================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(new THREE.Color(PAL.fog), CFG.fogNear, CFG.fogFar);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
camera.position.set(...CFG.camPos);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(...CFG.camTarget);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.autoRotate = true; controls.autoRotateSpeed = 0.85;
controls.minDistance = 14; controls.maxDistance = 46;
controls.maxPolarAngle = 1.45;

/* ================================================================
   4. PROCEDURAL CANVAS TEXTURES
   ================================================================ */
function makeTex(size, painter, rx = 1, ry = 1){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  painter(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
/* weathered granite: mottles, cracks and pale lichen rosettes */
const stoneTex = makeTex(256, (g, s) => {
  g.fillStyle = '#6f746e'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 700; i++){
    const v = 95 + rng() * 40 | 0;
    g.fillStyle = `rgba(${v},${v + 4},${v - 2},${0.2 + rng() * 0.3})`;
    g.beginPath(); g.arc(rng() * s, rng() * s, 1 + rng() * 4, 0, 7); g.fill();
  }
  for (let i = 0; i < 14; i++){
    g.strokeStyle = `rgba(28,30,26,${0.3 + rng() * 0.3})`;
    g.lineWidth = 0.6 + rng() * 1.2;
    let x = rng() * s, y = rng() * s;
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 5; k++){ x += R(-22, 22); y += R(8, 26); g.lineTo(x, y); }
    g.stroke();
  }
  for (let i = 0; i < 22; i++){
    g.fillStyle = `rgba(${140 + rng() * 30 | 0},${150 + rng() * 30 | 0},${120 + rng() * 20 | 0},${0.10 + rng() * 0.16})`;
    g.beginPath(); g.arc(rng() * s, rng() * s, 2 + rng() * 7, 0, 7); g.fill();
  }
});
/* dark moorland: peaty greens with heather-purple and grey flecks */
const moorTex = makeTex(512, (g, s) => {
  g.fillStyle = '#1d2418'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 1000; i++){
    const sd = rng();
    g.fillStyle = `rgba(${26 + sd * 34 | 0},${36 + sd * 40 | 0},${20 + sd * 24 | 0},${0.25 + rng() * 0.35})`;
    g.beginPath(); g.arc(rng() * s, rng() * s, 1 + rng() * 6, 0, 7); g.fill();
  }
  for (let i = 0; i < 90; i++){
    g.fillStyle = `rgba(${96 + rng() * 40 | 0},${60 + rng() * 26 | 0},${120 + rng() * 40 | 0},${0.10 + rng() * 0.18})`;
    g.beginPath(); g.arc(rng() * s, rng() * s, 1 + rng() * 3.5, 0, 7); g.fill();
  }
  for (let i = 0; i < 60; i++){
    const v = 70 + rng() * 40 | 0;
    g.fillStyle = `rgba(${v},${v},${v},${0.12 + rng() * 0.14})`;
    g.beginPath(); g.arc(rng() * s, rng() * s, 1 + rng() * 2.5, 0, 7); g.fill();
  }
}, 8, 8);
/* night sky: indigo gradient, star field, wisps of high cloud */
const skyTex = makeTex(1024, (g, s) => {
  const gr = g.createLinearGradient(0, 0, 0, s);
  gr.addColorStop(0, '#05070f'); gr.addColorStop(0.45, '#0c1424');
  gr.addColorStop(0.78, '#1b2a3c'); gr.addColorStop(1, '#27394a');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 420; i++){
    const y = rng() * s * 0.72, mag = rng();
    g.fillStyle = `rgba(255,255,${230 + rng() * 25 | 0},${0.25 + mag * 0.7})`;
    g.beginPath(); g.arc(rng() * s, y, mag < 0.92 ? 0.7 + rng() * 0.9 : 1.6 + rng(), 0, 7); g.fill();
  }
  for (let i = 0; i < 26; i++){
    g.fillStyle = `rgba(120,140,170,${0.04 + rng() * 0.08})`;
    const cx = rng() * s, cy = s * 0.2 + rng() * s * 0.45;
    g.beginPath(); g.ellipse(cx, cy, 30 + rng() * 90, 6 + rng() * 14, R(-0.3, 0.3), 0, 7); g.fill();
  }
});
/* glowing rune strokes on transparency — shared by stones and altar */
const runeTex = makeTex(256, (g, s) => {
  g.clearRect(0, 0, s, s);
  g.strokeStyle = 'rgba(190,245,255,0.95)';
  g.lineWidth = 5; g.lineCap = 'round';
  const cols = 3, rows = 4;
  for (let cx = 0; cx < cols; cx++) for (let cy = 0; cy < rows; cy++){
    const ox = (cx + 0.5) * s / cols, oy = (cy + 0.5) * s / rows, r0 = s / 11;
    const n = RI(2, 4);
    for (let k = 0; k < n; k++){
      g.beginPath();
      g.moveTo(ox + R(-r0, r0), oy + R(-r0, r0));
      g.lineTo(ox + R(-r0, r0), oy + R(-r0, r0));
      if (rng() < 0.5) g.lineTo(ox + R(-r0, r0), oy + R(-r0, r0));
      g.stroke();
    }
    if (rng() < 0.35){ g.beginPath(); g.arc(ox, oy, r0 * 0.55, 0, 7); g.stroke(); }
  }
});
/* soft blotchy alpha for drifting ground-fog sheets */
const fogTex = makeTex(256, (g, s) => {
  g.clearRect(0, 0, s, s);
  for (let i = 0; i < 46; i++){
    const gr2 = g.createRadialGradient(rng() * s, rng() * s, 2, rng() * s, rng() * s, 30 + rng() * 60);
    gr2.addColorStop(0, `rgba(200,215,230,${0.10 + rng() * 0.12})`);
    gr2.addColorStop(1, 'rgba(200,215,230,0)');
    g.fillStyle = gr2; g.fillRect(0, 0, s, s);
  }
});
/* round radial glow used by sprites (moon halo, embers, flames) */
const glowTex = makeTex(128, (g, s) => {
  const gr = g.createRadialGradient(s / 2, s / 2, 2, s / 2, s / 2, s / 2);
  gr.addColorStop(0, 'rgba(255,250,235,1)');
  gr.addColorStop(0.35, 'rgba(255,240,210,0.5)');
  gr.addColorStop(1, 'rgba(255,235,200,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
});

/* ================================================================
   5. MATERIALS — the shared palette of surfaces
   ================================================================ */
const MAT = {
  stone:   new THREE.MeshStandardMaterial({ map: stoneTex, color: PAL.stoneTint, roughness: 0.95 }),
  moor:    new THREE.MeshStandardMaterial({ map: moorTex, roughness: 1.0 }),
  wood:    new THREE.MeshStandardMaterial({ color: PAL.wood, roughness: 0.9 }),
  iron:    new THREE.MeshStandardMaterial({ color: PAL.iron, roughness: 0.6, metalness: 0.55 }),
  flame:   new THREE.MeshStandardMaterial({ color: PAL.flameCore, emissive: PAL.flame, emissiveIntensity: 2.6 }),
  raven:   new THREE.MeshStandardMaterial({ color: PAL.raven, roughness: 0.45, metalness: 0.2 }),
  beak:    new THREE.MeshStandardMaterial({ color: PAL.beak, roughness: 0.5 }),
  heather: new THREE.MeshStandardMaterial({ color: PAL.heather, roughness: 1.0, flatShading: true }),
  bloom:   new THREE.MeshStandardMaterial({ color: PAL.bloom, roughness: 0.8, flatShading: true }),
  moon:    new THREE.MeshBasicMaterial({ color: PAL.moon, fog: false }),
};
/* registries the animation loop reads from */
const runeMats = [], torchFlames = [], torchLights = [], fogSheets = [], cloudSprites = [], ravenHeads = [];
const stoneAngles = [];

/* ================================================================
   6. BUILDERS — each focal structure is its own named group factory
   ================================================================ */
/* weathered megalith geometry: tapered, hash-jittered so seams stay welded */
function makeMegalithGeo(w, h, d, k){
  const geo = new THREE.BoxGeometry(w, h, d, 2, 3, 2);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++){
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const taper = 1 - 0.2 * (y / h + 0.5);
    p.setX(i, x * taper + (vHash(x, y, z, k) - 0.5) * 0.16);
    p.setZ(i, z * taper + (vHash(x, y, z, k + 7) - 0.5) * 0.16);
    p.setY(i, y + (vHash(x, y, z, k + 13) - 0.5) * 0.1);
  }
  geo.translate(0, h / 2, 0);
  geo.computeVertexNormals();
  return geo;
}

/* Standing stone with a faintly glowing rune panel on its inner face.
   The rune material is cloned per stone so the pulse can travel. */
function buildStandingStone(w, h, d, ang){
  const g = new THREE.Group();
  g.add(sh(new THREE.Mesh(makeMegalithGeo(w, h, d, RI(1, 999)), MAT.stone)));
  const runeMat = new THREE.MeshBasicMaterial({ map: runeTex, transparent: true, color: PAL.rune,
    opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
  runeMat.userData.ang = ang;
  const rune = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.6, h * 0.55), runeMat);
  rune.position.set(0, h * 0.52, d / 2 + 0.05);
  g.add(rune);
  runeMats.push(runeMat);
  return g;
}

/* Central altar: two plinth blocks, a broad slab, a rune ring carved
   into the top, and a small offering bowl with dying embers. */
let altarRuneMat = null;
function buildAltar(){
  const g = new THREE.Group();
  for (const sx of [-0.95, 0.95]){
    const блок = new THREE.Mesh(makeMegalithGeo(1.5, 1.0, 1.6, RI(1, 999)), MAT.stone);
    блок.position.x = sx;
    g.add(sh(блок));
  }
  const slab = new THREE.Mesh(makeMegalithGeo(4.0, 0.55, 2.2, RI(1, 999)), MAT.stone);
  slab.position.y = 0.95;
  g.add(sh(slab));
  altarRuneMat = new THREE.MeshBasicMaterial({ map: runeTex, transparent: true, color: PAL.rune,
    opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
  const topRune = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 1.7), altarRuneMat);
  topRune.rotation.x = -Math.PI / 2;
  topRune.position.y = 1.56;
  g.add(topRune);
  const bowl = new THREE.Mesh(new THREE.SphereGeometry(0.3, 10, 6, 0, Math.PI * 2, 0, Math.PI * 0.5), MAT.iron);
  bowl.rotation.x = Math.PI;
  bowl.position.set(1.15, 1.62, 0.4);
  g.add(bowl);
  const embers = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), MAT.flame);
  embers.scale.y = 0.4;
  embers.position.set(1.15, 1.66, 0.4);
  g.add(embers);
  return g;
}

/* Guttering torch on a leaning stake: iron collar, emissive flame
   cone, sprite glow, optional real point light. */
function buildTorch(pos, withLight){
  const g = new THREE.Group();
  const stake = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.1, 2.4, 6), MAT.wood);
  stake.position.y = 1.2;
  g.add(sh(stake));
  const collar = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.035, 6, 12), MAT.iron);
  collar.rotation.x = Math.PI / 2;
  collar.position.y = 2.28;
  g.add(collar);
  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.52, 7), MAT.flame);
  flame.position.y = 2.62;
  g.add(flame);
  const sprMat = new THREE.SpriteMaterial({ map: glowTex, color: PAL.flame, transparent: true,
    opacity: 0.75, depthWrite: false, blending: THREE.AdditiveBlending, fog: false });
  const spr = new THREE.Sprite(sprMat);
  spr.scale.set(1.5, 1.5, 1);
  spr.position.y = 2.66;
  g.add(spr);
  let light = null;
  if (withLight){
    light = new THREE.PointLight(0xff9e4a, 22, 15, 1.9);
    light.position.y = 2.7;
    g.add(light);
    torchLights.push(light);
  }
  g.position.copy(pos);
  g.rotation.z = R(-0.06, 0.06); g.rotation.x = R(-0.06, 0.06);
  torchFlames.push({ flame, sprMat, light, ph: R(0, 6.28) });
  return g;
}

/* Raven: glossy black body, swivelling head with beak, folded wings
   and a fanned tail — perched, scanning the moor. */
function buildRaven(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 8), MAT.raven);
  body.scale.set(1, 0.85, 1.5);
  body.position.y = 0.2;
  g.add(sh(body));
  for (const sx of [-1, 1]){
    const wing = new THREE.Mesh(new THREE.SphereGeometry(0.16, 8, 6), MAT.raven);
    wing.scale.set(0.45, 0.7, 1.35);
    wing.position.set(sx * 0.14, 0.24, -0.02);
    g.add(wing);
  }
  const tail = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.42, 6), MAT.raven);
  tail.scale.z = 0.4;
  tail.rotation.x = 1.25;
  tail.position.set(0, 0.16, -0.4);
  g.add(tail);
  const head = new THREE.Group();
  head.position.set(0, 0.38, 0.24);
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.11, 9, 7), MAT.raven);
  head.add(skull);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.18, 6), MAT.beak);
  beak.rotation.x = Math.PI / 2;
  beak.position.set(0, -0.01, 0.16);
  head.add(beak);
  head.userData.ph = R(0, 6.28);
  ravenHeads.push(head);
  g.add(head);
  return g;
}

/* Drifting sheets of ground fog — big soft alpha planes that slowly
   rotate and breathe just above the heather. */
function buildGroundFog(){
  for (let i = 0; i < 6; i++){
    const mat = new THREE.MeshBasicMaterial({ map: fogTex, transparent: true, color: PAL.mist,
      opacity: R(0.14, 0.24), depthWrite: false, fog: false });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(R(26, 40), R(26, 40)), mat);
    m.rotation.x = -Math.PI / 2;
    m.rotation.z = R(0, 6.28);
    m.position.set(R(-8, 8), R(0.5, 1.4), R(-8, 8));
    fogSheets.push({ m, sp: R(0.01, 0.03) * (rng() < 0.5 ? -1 : 1), ph: R(0, 6.28), baseO: mat.opacity });
    scene.add(m);
  }
}

/* Full moon with halo, part-veiled by slow dark cloud banks. */
function buildMoonAndClouds(){
  const moonPos = new THREE.Vector3(-70, 62, -55);
  const moon = new THREE.Mesh(new THREE.SphereGeometry(7, 24, 18), MAT.moon);
  moon.position.copy(moonPos);
  scene.add(moon);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: '#cfdcf5',
    transparent: true, opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending, fog: false }));
  halo.scale.set(34, 34, 1);
  halo.position.copy(moonPos);
  scene.add(halo);
  for (let i = 0; i < 4; i++){
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: fogTex, color: '#141d2c',
      transparent: true, opacity: R(0.55, 0.8), depthWrite: false, fog: false }));
    spr.scale.set(R(30, 46), R(8, 14), 1);
    const bx = moonPos.x + R(-14, 14);
    spr.position.set(bx, moonPos.y + R(-8, 8), moonPos.z + R(4, 10));
    cloudSprites.push({ spr, bx, sp: R(0.03, 0.07), ph: R(0, 6.28) });
    scene.add(spr);
  }
  return moonPos;
}

/* ================================================================
   7. INSTANCED MOOR DRESSING — boulders and flowering heather
   ================================================================ */
const boulderMats = [], bushMats = [], bloomMats = [];
const dummyO = new THREE.Object3D();
function addBoulder(x, z){
  dummyO.position.set(x, groundH(x, z) + 0.1, z);
  dummyO.rotation.set(R(0, 3), R(0, 3), R(0, 3));
  dummyO.scale.set(R(0.5, 1.9), R(0.4, 1.2), R(0.5, 1.9));
  dummyO.updateMatrix(); boulderMats.push(dummyO.matrix.clone());
}
function addHeather(x, z){
  const y = groundH(x, z);
  dummyO.position.set(x, y + 0.12, z);
  dummyO.rotation.set(0, R(0, 6.28), 0);
  dummyO.scale.set(R(0.9, 1.8), R(0.5, 0.9), R(0.9, 1.8));
  dummyO.updateMatrix(); bushMats.push(dummyO.matrix.clone());
  for (let k = 0; k < 3; k++){
    dummyO.position.set(x + R(-0.3, 0.3), y + R(0.25, 0.45), z + R(-0.3, 0.3));
    dummyO.rotation.set(R(0, 3), R(0, 3), R(0, 3));
    dummyO.scale.setScalar(R(0.5, 1.1));
    dummyO.updateMatrix(); bloomMats.push(dummyO.matrix.clone());
  }
}
function finalizeMoorDressing(){
  const mk = (geo, mat, mats, cast) => {
    const inst = new THREE.InstancedMesh(geo, mat, mats.length);
    mats.forEach((m, i) => inst.setMatrixAt(i, m));
    inst.castShadow = cast; inst.receiveShadow = true;
    scene.add(inst);
  };
  mk(new THREE.DodecahedronGeometry(0.45, 0), MAT.stone, boulderMats, true);
  mk(new THREE.IcosahedronGeometry(0.32, 0), MAT.heather, bushMats, false);
  mk(new THREE.IcosahedronGeometry(0.09, 0), MAT.bloom, bloomMats, false);
}

/* ================================================================
   8. GROUND & SKY
   ================================================================ */
function buildGround(){
  const geo = new THREE.PlaneGeometry(150, 150, 72, 72);
  geo.rotateX(-Math.PI / 2);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, groundH(p.getX(i), p.getZ(i)));
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, MAT.moor);
  m.receiveShadow = true;
  scene.add(m);
}
function buildSky(){
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(170, 28, 16),
    new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false })));
}
