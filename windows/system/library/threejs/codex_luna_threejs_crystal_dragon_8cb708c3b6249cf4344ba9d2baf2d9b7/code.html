<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amethyst Crystal Dragon</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090612;
    }
    canvas {
      display: block;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 42%, rgba(3, 1, 10, 0.42) 100%);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090612);
scene.fog = new THREE.FogExp2(0x090612, 0.075);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.25, 2.65, 5.25);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 3.2;
controls.maxDistance = 8;
controls.target.set(0, 1.22, 0);

scene.add(new THREE.HemisphereLight(0xbda8ff, 0x11091d, 1.7));

const key = new THREE.DirectionalLight(0xe4d8ff, 4.2);
key.position.set(-3.5, 6, 4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -3;
key.shadow.camera.right = 3;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -2;
scene.add(key);

const rim = new THREE.PointLight(0x8d5cff, 8, 7, 2);
rim.position.set(2.8, 2.5, -2.2);
scene.add(rim);

const glow = new THREE.PointLight(0xff79df, 5, 5, 2);
glow.position.set(-2, 1.1, 2.2);
scene.add(glow);

const crystal = new THREE.MeshPhysicalMaterial({
  color: 0x8d4dcc,
  roughness: 0.12,
  metalness: 0.08,
  transmission: 0.72,
  thickness: 0.65,
  ior: 1.46,
  transparent: true,
  opacity: 0.91,
  clearcoat: 0.7,
  clearcoatRoughness: 0.16,
  side: THREE.DoubleSide
});

const crystalDark = new THREE.MeshPhysicalMaterial({
  color: 0x4b207d,
  roughness: 0.18,
  metalness: 0.12,
  transmission: 0.54,
  thickness: 0.8,
  ior: 1.48,
  transparent: true,
  opacity: 0.9,
  clearcoat: 0.8,
  side: THREE.DoubleSide
});

const crystalEdge = new THREE.MeshPhysicalMaterial({
  color: 0xd59cff,
  roughness: 0.08,
  metalness: 0.05,
  transmission: 0.62,
  thickness: 0.35,
  ior: 1.42,
  transparent: true,
  opacity: 0.82,
  emissive: 0x21072f,
  emissiveIntensity: 0.32,
  side: THREE.DoubleSide
});

const sparkleMaterial = new THREE.MeshStandardMaterial({
  color: 0xf2caff,
  emissive: 0xc85cff,
  emissiveIntensity: 2.5,
  roughness: 0.15,
  metalness: 0.2
});

const dragon = new THREE.Group();
dragon.position.y = 0.12;
scene.add(dragon);

function mesh(geometry, material, position, scale, rotation) {
  const object = new THREE.Mesh(geometry, material);
  if (position) object.position.copy(position);
  if (scale) object.scale.copy(scale);
  if (rotation) object.rotation.set(rotation.x, rotation.y, rotation.z);
  object.castShadow = true;
  object.receiveShadow = true;
  dragon.add(object);
  return object;
}

function ico(position, scale, material = crystal, detail = 1) {
  return mesh(new THREE.IcosahedronGeometry(1, detail), material, position, scale);
}

function tube(points, radius, material = crystal, tubularSegments = 32, radialSegments = 7) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geometry = new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, false);
  return mesh(geometry, material);
}

function cone(position, radius, height, material = crystal, rotation = new THREE.Euler()) {
  return mesh(new THREE.ConeGeometry(radius, height, 6), material, position, null, rotation);
}

function wing(side) {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.lineTo(0.68, 0.44);
  shape.lineTo(1.32, 1.34);
  shape.lineTo(1.08, 0.18);
  shape.lineTo(1.72, 0.58);
  shape.lineTo(1.44, -0.15);
  shape.lineTo(0.86, -0.48);
  shape.lineTo(0.32, -0.35);
  shape.closePath();

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.075,
    bevelEnabled: true,
    bevelSegments: 1,
    bevelSize: 0.025,
    bevelThickness: 0.025,
    curveSegments: 1
  });
  geometry.center();

  const wingMesh = new THREE.Mesh(geometry, crystalEdge);
  wingMesh.position.set(side * 0.48, 1.65, -0.18);
  wingMesh.rotation.set(0.16, side * 0.34, side * 0.18);
  wingMesh.scale.set(side, 1, 1);
  wingMesh.castShadow = true;
  wingMesh.receiveShadow = true;
  dragon.add(wingMesh);

  const ribs = [
    [[0.05, 0.03, 0.07], [0.92, 0.7, 0.07]],
    [[0.09, 0.02, 0.07], [1.34, 0.42, 0.07]],
    [[0.12, 0.01, 0.07], [1.16, -0.22, 0.07]]
  ];
  for (const pair of ribs) {
    const a = new THREE.Vector3(pair[0][0], pair[0][1], pair[0][2]);
    const b = new THREE.Vector3(pair[1][0], pair[1][1], pair[1][2]);
    const mid = a.clone().add(b).multiplyScalar(0.5);
    const rib = new THREE.Mesh(
      new THREE.CylinderGeometry(0.022, 0.035, a.distanceTo(b), 5),
      crystal
    );
    rib.position.copy(mid);
    rib.rotation.z = Math.atan2(b.y - a.y, b.x - a.x);
    rib.rotation.y = Math.PI / 2;
    rib.scale.x = side;
    rib.castShadow = true;
    wingMesh.add(rib);
  }
}

ico(new THREE.Vector3(0, 1.22, 0), new THREE.Vector3(0.78, 0.94, 0.62), crystal, 2);

tube([
  new THREE.Vector3(0, 0.58, 0.12),
  new THREE.Vector3(0.58, 0.38, 0.06),
  new THREE.Vector3(0.95, 0.22, -0.2),
  new THREE.Vector3(0.58, 0.1, -0.62),
  new THREE.Vector3(-0.2, 0.1, -0.78),
  new THREE.Vector3(-0.86, 0.14, -0.42),
  new THREE.Vector3(-1.05, 0.32, 0.12)
], 0.18, crystalDark, 48, 8);

tube([
  new THREE.Vector3(0, 1.55, 0.02),
  new THREE.Vector3(-0.1, 1.9, 0.04),
  new THREE.Vector3(0.2, 2.2, 0.08),
  new THREE.Vector3(0.06, 2.48, 0.1)
], 0.23, crystal, 30, 8);

ico(new THREE.Vector3(0.08, 2.62, 0.1), new THREE.Vector3(0.5, 0.38, 0.42), crystal, 1);
ico(new THREE.Vector3(0.08, 2.48, 0.48), new THREE.Vector3(0.34, 0.23, 0.3), crystalEdge, 1);

const jaw = mesh(
  new THREE.ConeGeometry(0.22, 0.52, 6),
  crystalDark,
  new THREE.Vector3(0.08, 2.39, 0.5),
  new THREE.Vector3(1, 1, 1),
  new THREE.Euler(Math.PI / 2, 0, 0)
);
jaw.rotation.z = Math.PI;

for (const side of [-1, 1]) {
  ico(new THREE.Vector3(side * 0.27, 2.72, 0.18), new THREE.Vector3(0.13, 0.16, 0.13), crystal, 1);
  cone(new THREE.Vector3(side * 0.28, 2.98, 0.13), 0.085, 0.48, crystalEdge);
  ico(new THREE.Vector3(side * 0.19, 2.57, 0.48), new THREE.Vector3(0.055, 0.055, 0.055), sparkleMaterial, 1);

  const foreleg = tube([
    new THREE.Vector3(side * 0.43, 1.16, 0.24),
    new THREE.Vector3(side * 0.62, 0.77, 0.32),
    new THREE.Vector3(side * 0.5, 0.42, 0.38)
  ], 0.13, crystal, 18, 6);
  ico(new THREE.Vector3(side * 0.5, 0.35, 0.4), new THREE.Vector3(0.22, 0.1, 0.28), crystalEdge, 1);

  const hindleg = tube([
    new THREE.Vector3(side * 0.53, 1.0, -0.16),
    new THREE.Vector3(side * 0.82, 0.7, -0.22),
    new THREE.Vector3(side * 0.72, 0.36, 0.02)
  ], 0.18, crystalDark, 18, 6);
  ico(new THREE.Vector3(side * 0.72, 0.29, 0.04), new THREE.Vector3(0.27, 0.11, 0.34), crystalEdge, 1);
}

wing(-1);
wing(1);

const scaleSpots = [
  [0.42, 1.53, 0.46, 0.14],
  [-0.38, 1.44, 0.5, 0.13],
  [0.5, 1.27, 0.49, 0.12],
  [-0.48, 1.2, 0.5, 0.12],
  [0.38, 1.0, 0.48, 0.11],
  [-0.32, 0.96, 0.5, 0.11],
  [0.18, 1.7, 0.54, 0.1],
  [-0.18, 1.82, 0.52, 0.1]
];

for (const [x, y, z, s] of scaleSpots) {
  ico(new THREE.Vector3(x, y, z), new THREE.Vector3(s, s * 0.72, s * 0.35), crystalEdge, 1);
}

for (let i = 0; i < 18; i++) {
  const angle = i * 2.39996;
  const radius = 0.16 + (i % 4) * 0.08;
  const y = 0.72 + (i % 6) * 0.27;
  const x = Math.cos(angle) * radius * 1.7;
  const z = Math.sin(angle) * radius + 0.14;
  ico(new THREE.Vector3(x, y, z), new THREE.Vector3(0.035, 0.035, 0.035), sparkleMaterial, 1);
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(4.5, 64),
  new THREE.MeshStandardMaterial({
    color: 0x100a1c,
    roughness: 0.32,
    metalness: 0.35
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.02;
floor.receiveShadow = true;
scene.add(floor);

const pedestalGlow = new THREE.PointLight(0x622bb8, 1.8, 3.5, 2);
pedestalGlow.position.set(0, 0.08, 0);
scene.add(pedestalGlow);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

animate();
</script>
</body>
</html>
