<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Machined Aluminum Stag Beetle</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090b0d;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080a0c);
scene.fog = new THREE.Fog(0x080a0c, 12, 24);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.8, 3.7, 7.4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.065;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 4.2;
controls.maxDistance = 13;
controls.target.set(0, -0.05, -0.35);

const aluminum = new THREE.MeshStandardMaterial({
  color: 0x9da7aa,
  metalness: 0.96,
  roughness: 0.29
});

const darkAluminum = new THREE.MeshStandardMaterial({
  color: 0x4e595d,
  metalness: 0.98,
  roughness: 0.24
});

const bronze = new THREE.MeshStandardMaterial({
  color: 0x9a4d22,
  metalness: 0.91,
  roughness: 0.25
});

const bronzeEdge = new THREE.MeshStandardMaterial({
  color: 0xd08142,
  metalness: 0.94,
  roughness: 0.19
});

const satin = new THREE.MeshStandardMaterial({
  color: 0x737d80,
  metalness: 0.94,
  roughness: 0.38
});

const blackMetal = new THREE.MeshStandardMaterial({
  color: 0x111518,
  metalness: 0.86,
  roughness: 0.24
});

const eyeMaterial = new THREE.MeshStandardMaterial({
  color: 0x050607,
  metalness: 0.55,
  roughness: 0.1
});

function addBrushedGrain(material, amount = 0.045) {
  material.onBeforeCompile = (shader) => {
    shader.vertexShader = shader.vertexShader
      .replace("#include <common>", "#include <common>\nvarying vec3 vGrainPosition;")
      .replace("#include <begin_vertex>", "#include <begin_vertex>\nvGrainPosition = transformed;");
    shader.fragmentShader = shader.fragmentShader
      .replace("#include <common>", "#include <common>\nvarying vec3 vGrainPosition;")
      .replace("#include <color_fragment>",
        `#include <color_fragment>
        float grainWave = sin(vGrainPosition.z * 210.0 + sin(vGrainPosition.x * 31.0) * 1.7);
        float microGrain = sin(vGrainPosition.x * 530.0 + vGrainPosition.y * 21.0) * 0.35;
        diffuseColor.rgb *= 1.0 + (grainWave * ${amount.toFixed(3)} + microGrain * ${amount.toFixed(3)});`);
  };
  material.needsUpdate = true;
}
addBrushedGrain(aluminum, 0.042);
addBrushedGrain(darkAluminum, 0.032);
addBrushedGrain(satin, 0.028);

const beetle = new THREE.Group();
beetle.rotation.y = -0.12;
scene.add(beetle);

function ellipsoid(material, position, scale, segments = 32) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, segments, 20), material);
  mesh.position.set(position.x, position.y, position.z);
  mesh.scale.set(scale.x, scale.y, scale.z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  beetle.add(mesh);
  return mesh;
}

function cylinderBetween(material, start, end, radius, radialSegments = 10) {
  const a = new THREE.Vector3(start.x, start.y, start.z);
  const b = new THREE.Vector3(end.x, end.y, end.z);
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius * 0.86, length, radialSegments, 1),
    material
  );
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  beetle.add(mesh);
  return mesh;
}

function coneAlong(material, base, tip, radius, height) {
  const a = new THREE.Vector3(base.x, base.y, base.z);
  const b = new THREE.Vector3(tip.x, tip.y, tip.z);
  const direction = new THREE.Vector3().subVectors(b, a).normalize();
  const center = a.clone().add(direction.clone().multiplyScalar(height * 0.5));
  const mesh = new THREE.Mesh(new THREE.ConeGeometry(radius, height, 7), material);
  mesh.position.copy(center);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
  mesh.castShadow = true;
  beetle.add(mesh);
  return mesh;
}

function tube(material, points, radius, radialSegments = 10, tubularSegments = 24) {
  const curve = new THREE.CatmullRomCurve3(points.map((point) => new THREE.Vector3(point.x, point.y, point.z)));
  const mesh = new THREE.Mesh(
    new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, false),
    material
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  beetle.add(mesh);
  return mesh;
}

ellipsoid(aluminum, { x: 0, y: 0.06, z: 0.58 }, { x: 1.05, y: 0.83, z: 1.52 });
ellipsoid(darkAluminum, { x: 0, y: 0.03, z: -0.62 }, { x: 0.98, y: 0.79, z: 0.88 });
ellipsoid(aluminum, { x: 0, y: 0.02, z: -1.28 }, { x: 0.92, y: 0.67, z: 0.62 });

ellipsoid(bronze, { x: -0.39, y: 0.49, z: 0.28 }, { x: 0.57, y: 0.25, z: 1.22 });
ellipsoid(bronze, { x: 0.39, y: 0.49, z: 0.28 }, { x: 0.57, y: 0.25, z: 1.22 });

const seam = new THREE.Mesh(
  new THREE.BoxGeometry(0.055, 0.12, 2.16),
  blackMetal
);
seam.position.set(0, 0.72, 0.28);
seam.castShadow = true;
beetle.add(seam);

for (const side of [-1, 1]) {
  ellipsoid(bronzeEdge, { x: side * 0.69, y: 0.47, z: 0.25 }, { x: 0.035, y: 0.045, z: 1.04 }, 16);
  ellipsoid(eyeMaterial, { x: side * 0.66, y: 0.18, z: -1.47 }, { x: 0.2, y: 0.16, z: 0.18 }, 20);
  ellipsoid(blackMetal, { x: side * 0.81, y: 0.06, z: -1.25 }, { x: 0.11, y: 0.09, z: 0.22 }, 16);
}

const mandiblePaths = [
  [
    { x: -0.45, y: 0.02, z: -1.49 },
    { x: -0.82, y: 0.11, z: -1.78 },
    { x: -1.08, y: 0.2, z: -2.13 },
    { x: -1.18, y: 0.25, z: -2.47 },
    { x: -1.02, y: 0.28, z: -2.71 },
    { x: -0.73, y: 0.27, z: -2.78 }
  ],
  [
    { x: 0.45, y: 0.02, z: -1.49 },
    { x: 0.82, y: 0.11, z: -1.78 },
    { x: 1.08, y: 0.2, z: -2.13 },
    { x: 1.18, y: 0.25, z: -2.47 },
    { x: 1.02, y: 0.28, z: -2.71 },
    { x: 0.73, y: 0.27, z: -2.78 }
  ]
];

for (const path of mandiblePaths) {
  tube(aluminum, path, 0.13, 12, 30);
  tube(bronzeEdge, path.slice(1, 4), 0.035, 8, 16);
}

const branchPaths = [
  [
    { x: -0.91, y: 0.14, z: -1.9 },
    { x: -1.38, y: 0.16, z: -1.99 },
    { x: -1.67, y: 0.22, z: -2.18 },
    { x: -1.79, y: 0.25, z: -2.42 }
  ],
  [
    { x: 0.91, y: 0.14, z: -1.9 },
    { x: 1.38, y: 0.16, z: -1.99 },
    { x: 1.67, y: 0.22, z: -2.18 },
    { x: 1.79, y: 0.25, z: -2.42 }
  ]
];

for (const path of branchPaths) {
  tube(darkAluminum, path, 0.085, 10, 20);
  const end = path[path.length - 1];
  const previous = path[path.length - 2];
  coneAlong(aluminum, previous, end, 0.12, 0.26);
}

for (const side of [-1, 1]) {
  const antenna = [
    { x: side * 0.47, y: 0.32, z: -1.52 },
    { x: side * 0.77, y: 0.61, z: -1.73 },
    { x: side * 1.02, y: 0.68, z: -1.98 },
    { x: side * 1.15, y: 0.64, z: -2.12 }
  ];
  tube(satin, antenna, 0.035, 7, 14);
  ellipsoid(bronzeEdge, antenna[antenna.length - 1], { x: 0.055, y: 0.055, z: 0.055 }, 12);
}

const legOrigins = [-0.88, 0, 0.88];
for (const side of [-1, 1]) {
  for (let index = 0; index < legOrigins.length; index += 1) {
    const z = legOrigins[index];
    const forward = index === 0 ? -0.24 : index === 2 ? 0.24 : 0;
    const root = { x: side * 0.62, y: -0.28, z };
    const joint = { x: side * 1.08, y: -0.58, z: z + forward };
    const ankle = { x: side * 1.62, y: -0.89, z: z + forward * 2.2 };
    const foot = { x: side * 1.92, y: -0.94, z: z + forward * 2.45 };

    cylinderBetween(satin, root, joint, 0.095, 10);
    cylinderBetween(aluminum, joint, ankle, 0.072, 9);
    cylinderBetween(satin, ankle, foot, 0.047, 8);
    ellipsoid(darkAluminum, joint, { x: 0.12, y: 0.12, z: 0.12 }, 12);

    const barbTip = { x: side * 2.18, y: -0.95, z: foot.z - 0.04 };
    coneAlong(aluminum, foot, barbTip, 0.075, 0.28);

    const clawStart = { x: side * 1.99, y: -0.94, z: foot.z };
    const clawOne = { x: side * 2.18, y: -0.93, z: foot.z + 0.13 };
    const clawTwo = { x: side * 2.16, y: -0.93, z: foot.z - 0.13 };
    cylinderBetween(darkAluminum, clawStart, clawOne, 0.026, 7);
    cylinderBetween(darkAluminum, clawStart, clawTwo, 0.026, 7);
    coneAlong(aluminum, clawOne, { x: side * 2.27, y: -0.94, z: foot.z + 0.17 }, 0.035, 0.14);
    coneAlong(aluminum, clawTwo, { x: side * 2.25, y: -0.94, z: foot.z - 0.17 }, 0.035, 0.14);
  }
}

for (const z of [-1.05, -0.55, 0, 0.55, 1.05]) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.82, 0.018, 6, 48), bronzeEdge);
  ring.rotation.x = Math.PI / 2;
  ring.position.set(0, 0.06, z);
  ring.scale.set(1, 1, 0.58);
  ring.castShadow = true;
  beetle.add(ring);
}

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(8, 96),
  new THREE.MeshStandardMaterial({ color: 0x111518, metalness: 0.35, roughness: 0.72 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.08;
ground.receiveShadow = true;
scene.add(ground);

const keyLight = new THREE.DirectionalLight(0xffe8d0, 4.2);
keyLight.position.set(-4.5, 7.5, 5.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -5;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 20;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x8eb8d0, 3.1);
rimLight.position.set(5, 3, -6);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0xc4d9df, 1.3, 12);
fillLight.position.set(-3, 1.8, -3);
scene.add(fillLight);

scene.add(new THREE.HemisphereLight(0x9fb7c2, 0x171719, 0.75));

const clock = new THREE.Clock();

function animate() {
  const elapsed = clock.getElapsedTime();
  beetle.position.y = Math.sin(elapsed * 1.25) * 0.025;
  controls.update();
  renderer.render(scene, camera);
}

renderer.setAnimationLoop(animate);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
