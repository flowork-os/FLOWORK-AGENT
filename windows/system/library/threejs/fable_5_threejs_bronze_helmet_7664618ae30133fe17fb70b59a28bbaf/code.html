<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bronze Helmet</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16130f; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16130f);
scene.fog = new THREE.Fog(0x16130f, 12, 28);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.2, 2.6, 5.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 3;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.55;

// ---------- Lighting ----------
const key = new THREE.DirectionalLight(0xfff0d8, 2.6);
key.position.set(5, 7, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -5;
key.shadow.camera.right = key.shadow.camera.top = 5;
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fb5d9, 0.7);
fill.position.set(-6, 3, -3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9a0, 1.1);
rim.position.set(-2, 4, -7);
scene.add(rim);

scene.add(new THREE.HemisphereLight(0x4a5a6e, 0x2a2016, 0.55));

// ---------- Procedural patina textures ----------
function makeTextures(size = 512) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  // base bronze
  g.fillStyle = '#7a5a2c';
  g.fillRect(0, 0, size, size);
  // mottled bronze variation
  for (let i = 0; i < 2600; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const r = 2 + Math.random() * 14;
    const t = Math.random();
    const col = t < 0.55
      ? `rgba(${120 + Math.random() * 60 | 0},${85 + Math.random() * 40 | 0},${35 + Math.random() * 25 | 0},0.10)`
      : `rgba(${60 + Math.random() * 30 | 0},${50 + Math.random() * 25 | 0},${25 + Math.random() * 15 | 0},0.12)`;
    g.fillStyle = col;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  // green patina blooms
  for (let i = 0; i < 240; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const r = 4 + Math.random() * 26;
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    const gr = 90 + Math.random() * 60 | 0;
    grad.addColorStop(0, `rgba(${40 + Math.random() * 30 | 0},${gr},${70 + Math.random() * 40 | 0},${0.16 + Math.random() * 0.2})`);
    grad.addColorStop(1, 'rgba(60,110,80,0)');
    g.fillStyle = grad;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  // fine speckle
  for (let i = 0; i < 5000; i++) {
    g.fillStyle = Math.random() < 0.5 ? 'rgba(30,25,15,0.14)' : 'rgba(200,170,110,0.09)';
    g.fillRect(Math.random() * size, Math.random() * size, 1.5, 1.5);
  }
  const map = new THREE.CanvasTexture(c);
  map.wrapS = map.wrapT = THREE.RepeatWrapping;
  map.colorSpace = THREE.SRGBColorSpace;

  // roughness map: patina rough, worn bronze smoother
  const rc = document.createElement('canvas');
  rc.width = rc.height = size;
  const rg = rc.getContext('2d');
  rg.fillStyle = '#8a8a8a';
  rg.fillRect(0, 0, size, size);
  for (let i = 0; i < 900; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const r = 3 + Math.random() * 20;
    rg.fillStyle = Math.random() < 0.45 ? 'rgba(230,230,230,0.25)' : 'rgba(70,70,70,0.22)';
    rg.beginPath(); rg.arc(x, y, r, 0, 7); rg.fill();
  }
  const rough = new THREE.CanvasTexture(rc);
  rough.wrapS = rough.wrapT = THREE.RepeatWrapping;

  return { map, rough };
}
const tex = makeTextures();

const bronzeMat = new THREE.MeshStandardMaterial({
  map: tex.map,
  roughnessMap: tex.rough,
  color: 0xc9a869,
  metalness: 0.85,
  roughness: 0.55,
  side: THREE.DoubleSide
});

// ---------- Helmet geometry helpers ----------
const seeded = (() => { let s = 42; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

// dents: a few spherical depressions applied to vertices
const dents = [];
for (let i = 0; i < 6; i++) {
  const th = seeded() * Math.PI * 2;
  const ph = 0.25 + seeded() * 0.9;
  dents.push({
    p: new THREE.Vector3(Math.sin(ph) * Math.cos(th), Math.cos(ph) + 0.15, Math.sin(ph) * Math.sin(th)).multiplyScalar(1.02),
    r: 0.18 + seeded() * 0.22,
    d: 0.03 + seeded() * 0.05
  });
}
function applyDents(geo, worldOffset = new THREE.Vector3()) {
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).add(worldOffset);
    for (const dn of dents) {
      const dist = v.distanceTo(dn.p);
      if (dist < dn.r) {
        const f = Math.cos((dist / dn.r) * Math.PI * 0.5);
        const dir = v.clone().sub(new THREE.Vector3(0, 0.9, 0)).normalize();
        pos.setXYZ(i,
          pos.getX(i) - dir.x * dn.d * f,
          pos.getY(i) - dir.y * dn.d * f,
          pos.getZ(i) - dir.z * dn.d * f);
      }
    }
  }
  geo.computeVertexNormals();
  return geo;
}

const helmet = new THREE.Group();

// ---- Dome skull with visible edge thickness (lathe: outer up, rim fold, inner down) ----
(() => {
  const pts = [];
  const R = 1.0, thick = 0.045;
  // outer surface: from bottom rim up over the crown
  for (let i = 0; i <= 40; i++) {
    const a = (i / 40) * Math.PI * 0.52; // from equator-ish to top
    const ang = Math.PI * 0.52 - a;
    // slightly egg-shaped dome
    pts.push(new THREE.Vector2(Math.sin(ang) * R * (1 + 0.04 * Math.cos(ang)), Math.cos(ang) * R * 1.12));
  }
  // fold over the top down the inner surface
  for (let i = 40; i >= 0; i--) {
    const ang = Math.PI * 0.52 - (i / 40) * Math.PI * 0.52;
    pts.push(new THREE.Vector2(Math.max(0.001, Math.sin(ang) * (R - thick) * (1 + 0.04 * Math.cos(ang))), Math.cos(ang) * R * 1.12 - thick * 0.5));
  }
  const geo = new THREE.LatheGeometry(pts.reverse(), 96);
  geo.translate(0, 0, 0);
  applyDents(geo);
  const dome = new THREE.Mesh(geo, bronzeMat);
  dome.castShadow = dome.receiveShadow = true;
  helmet.add(dome);

  // rolled rim band at the base edge
  const rimY = Math.cos(Math.PI * 0.52) * R * 1.12;
  const rimR = Math.sin(Math.PI * 0.52) * R * (1 + 0.04 * Math.cos(Math.PI * 0.52));
  const band = new THREE.Mesh(new THREE.TorusGeometry(rimR, 0.032, 12, 96), bronzeMat);
  band.rotation.x = Math.PI / 2;
  band.position.y = rimY;
  band.castShadow = band.receiveShadow = true;
  helmet.add(band);
})();

// ---- Raised central ridge / crest (front-to-back) ----
(() => {
  const crestCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0.62, 0.92),
    new THREE.Vector3(0, 1.02, 0.62),
    new THREE.Vector3(0, 1.22, 0.18),
    new THREE.Vector3(0, 1.22, -0.18),
    new THREE.Vector3(0, 1.0, -0.64),
    new THREE.Vector3(0, 0.6, -0.94)
  ]);
  // flattened fin cross-section via scaled tube
  const geo = new THREE.TubeGeometry(crestCurve, 60, 0.085, 10, false);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setX(i, pos.getX(i) * 0.42);                 // thin fin
    pos.setY(i, pos.getY(i) + Math.max(0, (0.085 - Math.abs(pos.getX(i)) * 2)) * 0.9); // raise center
  }
  geo.computeVertexNormals();
  const crest = new THREE.Mesh(geo, bronzeMat);
  crest.castShadow = crest.receiveShadow = true;
  helmet.add(crest);

  // small crest knob at apex
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.075, 24, 16), bronzeMat);
  knob.position.set(0, 1.3, 0);
  knob.castShadow = true;
  helmet.add(knob);
})();

// ---- Flared neck guard at the back ----
(() => {
  const shape = [];
  // lathe-like partial flare built from a parametric sheet
  const seg = 40, rings = 14;
  const geo = new THREE.PlaneGeometry(1, 1, seg, rings);
  const pos = geo.attributes.position;
  const baseY = 0.29, baseR = 1.0;
  for (let i = 0; i < pos.count; i++) {
    const u = pos.getX(i) + 0.5;         // 0..1 across arc
    const v = pos.getY(i) + 0.5;         // 0..1 down the flare
    const arc = Math.PI * (0.62 + 0.5 * v);          // widens as it drops
    const th = Math.PI + (u - 0.5) * arc;            // centered at back (-Z)
    const flare = v * 0.42;
    const r = baseR * (1 + flare * 0.85) - 0.02;
    const y = baseY - v * 0.46 + Math.pow(v, 2) * 0.10;
    // edge taper
    const edge = 1 - Math.pow(Math.abs(u - 0.5) * 2, 3) * 0.25;
    pos.setXYZ(i, Math.sin(th) * r * edge, y, Math.cos(th) * r * edge);
  }
  geo.computeVertexNormals();
  applyDents(geo);
  const guard = new THREE.Mesh(geo, bronzeMat);
  guard.castShadow = guard.receiveShadow = true;
  helmet.add(guard);

  // rolled edge on the neck-guard lip
  const lipPts = [];
  for (let i = 0; i <= seg; i++) {
    const u = i / seg;
    const arc = Math.PI * 1.12;
    const th = Math.PI + (u - 0.5) * arc;
    const edge = 1 - Math.pow(Math.abs(u - 0.5) * 2, 3) * 0.25;
    const r = (baseR * 1.357 - 0.02) * edge;
    lipPts.push(new THREE.Vector3(Math.sin(th) * r, baseY - 0.36, Math.cos(th) * r));
  }
  const lip = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(lipPts), 60, 0.026, 8, false), bronzeMat);
  lip.castShadow = true;
  helmet.add(lip);
})();

// ---- Cheek guards (left & right) ----
function cheekGuard(sign) {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(0.34, -0.02, 0.44, -0.18, 0.42, -0.42);
  shape.bezierCurveTo(0.40, -0.62, 0.26, -0.78, 0.10, -0.82);
  shape.bezierCurveTo(-0.06, -0.78, -0.16, -0.6, -0.18, -0.4);
  shape.bezierCurveTo(-0.20, -0.18, -0.14, -0.02, 0, 0);
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.035, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.015, bevelSegments: 3, curveSegments: 24 });
  // curve the plate around the head
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    pos.setZ(i, pos.getZ(i) - x * x * 0.35);
  }
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, bronzeMat);
  m.castShadow = m.receiveShadow = true;
  const g = new THREE.Group();
  g.add(m);
  m.position.set(-0.12, 0, 0);
  g.position.set(sign * 0.93, 0.34, 0.22);
  g.rotation.y = sign * -Math.PI / 2 + sign * 0.28;
  g.rotation.z = sign * 0.06;
  // hinge detail
  const hinge = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.3, 12), bronzeMat);
  hinge.rotation.x = Math.PI / 2;
  hinge.position.set(0.05, 0.03, 0.02);
  hinge.castShadow = true;
  g.add(hinge);
  helmet.add(g);
}
cheekGuard(1);
cheekGuard(-1);

// ---- Brow rivets around the rim ----
for (let i = 0; i < 14; i++) {
  const th = (i / 14) * Math.PI * 2 + 0.1;
  const r = Math.sin(Math.PI * 0.52) * 1.0 * 1.01;
  const riv = new THREE.Mesh(new THREE.SphereGeometry(0.026, 12, 8), bronzeMat);
  riv.position.set(Math.cos(th) * r, 0.36, Math.sin(th) * r);
  riv.castShadow = true;
  helmet.add(riv);
}

helmet.position.y = 0.85;
helmet.rotation.y = Math.PI; // face the camera-ish
scene.add(helmet);

// ---------- Ground + soft shadow ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 64),
  new THREE.MeshStandardMaterial({ color: 0x241d15, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// subtle contact shadow disc
const shadowTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 10, 128, 128, 128);
  grad.addColorStop(0, 'rgba(0,0,0,0.45)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const contact = new THREE.Mesh(
  new THREE.PlaneGeometry(4.2, 4.2),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
);
contact.rotation.x = -Math.PI / 2;
contact.position.y = 0.002;
scene.add(contact);

// ---------- Resize + loop ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
