<script type="module">

controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.target.set(0, 1.45, 0);
controls.minDistance = 4.0;

controls.maxPolarAngle = Math.PI * 0.52;

/* ============================================================
   LIGHTING
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xbcd6ff, 0x2a2118, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e0, 2.5);
key.position.set(5.5, 8.5, 5.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 4;
key.shadow.bias = -0.0006;
key.shadow.normalBias = 0.022;
{
  const c = key.shadow.camera;
  c.near = 1; c.far = 30;
  c.left = -7; c.right = 7; c.top = 7; c.bottom = -7;
  c.updateProjectionMatrix();
}
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fc4ff, 0.75);
fill.position.set(-6.0, 3.0, 4.0);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9a8, 1.7);
rim.position.set(-3.2, 4.6, -7.0);
scene.add(rim);

const bounce = new THREE.PointLight(0xffc9a0, 0.35, 14, 2);
bounce.position.set(0, -0.4, 2.6);
scene.add(bounce);

/* shadow-only ground */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.36 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   MATERIALS
   ============================================================ */
const matBody = new THREE.MeshPhysicalMaterial({

  roughness: 0.28,
  metalness: 0.0,
  clearcoat: 0.85,

  sheenColor: new THREE.Color(0xff8a7a),
  sheenRoughness: 0.5
});

const matBodyDark = new THREE.MeshPhysicalMaterial({
  color: 0xb01d24,
  roughness: 0.34,
  metalness: 0.0,
  clearcoat: 0.7,
  clearcoatRoughness: 0.3
});

const matDark = new THREE.MeshStandardMaterial({
  color: 0x2b1d1c,
  roughness: 0.55,
  metalness: 0.0
});

const matLimb = new THREE.MeshPhysicalMaterial({
  color: 0x8f2020,
  roughness: 0.38,
  metalness: 0.0,
  clearcoat: 0.5,
  clearcoatRoughness: 0.35
});

const matFoot = new THREE.MeshStandardMaterial({
  color: 0x3a2320,
  roughness: 0.65,
  metalness: 0.0
});

const matEye = new THREE.MeshPhysicalMaterial({
  color: 0x14161c,
  roughness: 0.05,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.03,
  reflectivity: 0.6
});

const matEyeWhite = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 0.12,
  metalness: 0.0,
  emissive: 0xffffff,
  emissiveIntensity: 0.35
});

const matMandible = new THREE.MeshPhysicalMaterial({
  color: 0xf0e2c4,
  roughness: 0.3,
  metalness: 0.0,
  clearcoat: 0.6,
  clearcoatRoughness: 0.25
});

const matLeaf = new THREE.MeshPhysicalMaterial({
  color: 0x63b73a,
  roughness: 0.42,
  metalness: 0.0,
  clearcoat: 0.55,
  clearcoatRoughness: 0.35,
  sheen: 0.5,
  sheenColor: new THREE.Color(0xd4ff9a),
  side: THREE.DoubleSide
});

const matLeafVein = new THREE.MeshStandardMaterial({
  color: 0x3f8a26,
  roughness: 0.5,
  metalness: 0.0
});

const matStem = new THREE.MeshStandardMaterial({
  color: 0x4f8f2c,
  roughness: 0.55,
  metalness: 0.0
});

/* ============================================================
   HELPERS
   ============================================================ */
function markShadows(obj) {
  obj.traverse((o) => {
    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
  });
}

/** A smooth tube along a Catmull-Rom curve with a varying radius profile. */
function taperedTube(points, radiusFn, tubularSegments = 48, radialSegments = 16) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => p.clone()), false, 'catmullrom', 0.5);
  const geo = new THREE.TubeGeometry(curve, tubularSegments, 1, radialSegments, false);
  // Re-scale each ring to the desired radius profile.
  const pos = geo.attributes.position;
  const nrm = geo.attributes.normal;
  const rings = tubularSegments + 1;
  const perRing = radialSegments + 1;
  const frames = curve.computeFrenetFrames(tubularSegments, false);
  const tmpCenter = new THREE.Vector3();
  const tmpP = new THREE.Vector3();
  for (let i = 0; i < rings; i++) {
    const t = i / tubularSegments;
    const r = Math.max(0.0015, radiusFn(t));
    curve.getPointAt(Math.min(1, Math.max(0, t)), tmpCenter);
    for (let j = 0; j < perRing; j++) {
      const idx = i * perRing + j;
      tmpP.fromBufferAttribute(pos, idx);
      // direction from center (unit, because base radius was 1)
      tmpP.sub(tmpCenter).normalize().multiplyScalar(r).add(tmpCenter);
      pos.setXYZ(idx, tmpP.x, tmpP.y, tmpP.z);
    }
  }
  void nrm; void frames;
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

function sphere(r, wSeg = 32, hSeg = 24) {
  return new THREE.SphereGeometry(r, wSeg, hSeg);
}

/* ============================================================
   ANT ROOT
   ============================================================ */
const ant = new THREE.Group();
scene.add(ant);

/* ------------------------------------------------------------
   GASTER (rear segment) — big glossy candy-red teardrop
   ------------------------------------------------------------ */
const gaster = new THREE.Group();
{
  const g = sphere(0.62, 44, 34);
  const p = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    // Elongate along -Z (rear), taper toward the waist (+Z)
    const zN = v.z / 0.62;                    // -1 .. 1
    const taper = 0.72 + 0.34 * (1 - Math.pow(Math.max(0, zN), 1.5));
    v.x *= taper * 0.94;
    v.y *= taper * 1.02;
    v.z *= 1.30;
    // slight downward droop at the tail
    v.y -= 0.10 * Math.pow(Math.max(0, -zN), 2.0);
    p.setXYZ(i, v.x, v.y, v.z);
  }
  p.needsUpdate = true;
  g.computeVertexNormals();

  const mesh = new THREE.Mesh(g, matBody);
  gaster.add(mesh);

  // subtle darker segment bands (thin rings) for cartoon detail
  for (let i = 0; i < 2; i++) {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.44 - i * 0.09, 0.020, 10, 44),
      matBodyDark
    );
    ring.position.z = -0.20 - i * 0.30;
    ring.scale.set(1.0, 1.06, 1.0);
    gaster.add(ring);
  }
}
gaster.position.set(0, 1.30, -1.05);
gaster.rotation.x = 0.16;
ant.add(gaster);

/* ------------------------------------------------------------
   PETIOLE / WAISTS — thin dark connectors
   ------------------------------------------------------------ */
function makeWaist(from, to, r0, r1) {
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(r1, r0, len, 20, 1, false);
  const mesh = new THREE.Mesh(geo, matDark);
  mesh.position.copy(from).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  return mesh;
}

const waistA = makeWaist(
  new THREE.Vector3(0, 1.33, -0.58),
  new THREE.Vector3(0, 1.44, -0.16),
  0.155, 0.115
);
ant.add(waistA);

// little petiole node bump
const node = new THREE.Mesh(sphere(0.135, 24, 18), matDark);
node.position.set(0, 1.44, -0.34);
node.scale.set(0.9, 1.15, 0.9);
ant.add(node);

/* ------------------------------------------------------------
   MESOSOMA (thorax) — rounded barrel with a soft hump
   ------------------------------------------------------------ */
const thorax = new THREE.Group();
{
  const g = sphere(0.44, 40, 30);
  const p = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const zN = v.z / 0.44;
    v.z *= 1.28;
    v.x *= 0.90 - 0.06 * zN;
    v.y *= 0.94 + 0.10 * Math.exp(-Math.pow((zN + 0.05) * 1.6, 2));
    p.setXYZ(i, v.x, v.y, v.z);
  }
  p.needsUpdate = true;
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, matBody);
  thorax.add(mesh);

  // tiny spines on top (leafcutter flavour), stylized & soft
  for (const s of [-1, 1]) {
    const spine = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.17, 14), matBodyDark);
    spine.position.set(s * 0.14, 0.34, -0.22);
    spine.rotation.set(-0.55, 0, -s * 0.30);
    thorax.add(spine);
  }
}
thorax.position.set(0, 1.44, 0.28);
thorax.rotation.x = -0.05;
ant.add(thorax);

/* neck waist */
const waistB = makeWaist(
  new THREE.Vector3(0, 1.47, 0.70),
  new THREE.Vector3(0, 1.55, 0.96),
  0.135, 0.115
);
ant.add(waistB);

/* ------------------------------------------------------------
   HEAD — oversized, slightly heart-shaped
   ------------------------------------------------------------ */
const head = new THREE.Group();
head.position.set(0, 1.60, 1.24);
head.rotation.x = -0.10;
ant.add(head);

{
  const g = sphere(0.72, 48, 36);
  const p = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const yN = v.y / 0.72;
    const zN = v.z / 0.72;
    v.x *= 1.02;
    v.y *= 0.94;
    v.z *= 0.86;
    // flatten the face slightly, round the back of the head
    v.z -= 0.06 * Math.pow(Math.max(0, zN), 2);
    // heart-shaped notch at the top-rear
    const notch = Math.max(0, yN) * Math.max(0, -zN);
    v.y -= 0.16 * Math.pow(notch, 1.4);
    p.setXYZ(i, v.x, v.y, v.z);
  }
  p.needsUpdate = true;
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, matBody);
  head.add(mesh);
}

/* cheek highlights: soft darker jaw base */
{
  const jawBase = new THREE.Mesh(sphere(0.34, 28, 20), matBodyDark);
  jawBase.position.set(0, -0.26, 0.50);
  jawBase.scale.set(1.05, 0.52, 0.55);
  head.add(jawBase);
}

/* ---- BIG GLOSSY EYES ---- */
function makeEye(side) {
  const eye = new THREE.Group();

  // dark glossy dome
  const ball = new THREE.Mesh(sphere(0.235, 34, 26), matEye);
  ball.scale.set(1.0, 1.14, 0.86);
  eye.add(ball);

  // white sclera ring behind (cartoon pop)
  const rimRing = new THREE.Mesh(new THREE.TorusGeometry(0.235, 0.028, 12, 40), matBodyDark);
  rimRing.scale.set(1.0, 1.14, 1.0);
  rimRing.position.z = -0.02;
  eye.add(rimRing);

  // specular highlights
  const hi1 = new THREE.Mesh(sphere(0.075, 20, 14), matEyeWhite);
  hi1.position.set(-0.075 * side, 0.095, 0.185);
  hi1.scale.set(1, 0.85, 0.5);
  eye.add(hi1);

  const hi2 = new THREE.Mesh(sphere(0.035, 16, 12), matEyeWhite);
  hi2.position.set(0.085 * side, -0.085, 0.19);
  hi2.scale.set(1, 0.9, 0.5);
  eye.add(hi2);

  eye.position.set(side * 0.52, 0.14, 0.40);
  eye.rotation.y = side * 0.44;
  eye.rotation.x = -0.06;
  return eye;
}
head.add(makeEye(1));
head.add(makeEye(-1));

/* three tiny ocelli on the forehead */
for (let i = -1; i <= 1; i++) {
  const oc = new THREE.Mesh(sphere(0.035, 14, 10), matEye);
  oc.position.set(i * 0.16, 0.52, 0.17 - Math.abs(i) * 0.03);
  head.add(oc);
}

/* ---- COMICALLY LARGE MANDIBLES ---- */
function makeMandible(side) {
  const grp = new THREE.Group();

  const pts = [
    new THREE.Vector3(0.00, 0.00, 0.00),
    new THREE.Vector3(side * 0.20, -0.09, 0.26),
    new THREE.Vector3(side * 0.30, -0.16, 0.60),
    new THREE.Vector3(side * 0.22, -0.14, 0.92),
    new THREE.Vector3(side * 0.07, -0.03, 1.12),
    new THREE.Vector3(-side * 0.02, 0.10, 1.20)
  ];
  const geo = taperedTube(pts, (t) => 0.155 * (1 - 0.62 * t * t) + 0.012, 56, 18);
  const mesh = new THREE.Mesh(geo, matMandible);
  grp.add(mesh);

  // flat blade widening on the inner face
  const blade = new THREE.Mesh(sphere(0.20, 26, 18), matMandible);
  blade.position.set(side * 0.26, -0.13, 0.58);
  blade.scale.set(0.45, 0.72, 1.35);
  blade.rotation.y = -side * 0.22;
  grp.add(blade);

  // little serration teeth along the inner edge
  for (let i = 0; i < 3; i++) {
    const t = 0.35 + i * 0.18;
    const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.11, 10), matMandible);
    tooth.position.set(side * (0.28 - i * 0.03), -0.19 + i * 0.015, 0.48 + i * 0.20);
    tooth.rotation.z = side * 1.35;
    tooth.rotation.y = -side * 0.2;
    grp.add(tooth);
  }

  grp.position.set(side * 0.20, -0.36, 0.44);
  grp.rotation.set(0.10, 0, -side * 0.10);
  return grp;
}
head.add(makeMandible(1));
head.add(makeMandible(-1));

/* small labrum / mouth nub between the jaws */
{
  const mouth = new THREE.Mesh(sphere(0.13, 20, 14), matDark);
  mouth.position.set(0, -0.40, 0.52);
  mouth.scale.set(1.1, 0.7, 0.8);
  head.add(mouth);
}

/* ---- EXAGGERATED ANTENNAE with ball tips ---- */
function makeAntenna(side) {
  const grp = new THREE.Group();

  // scape (lower straight-ish segment) + funiculus (curving up & out)
  const pts = [
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(side * 0.16, 0.26, 0.10),
    new THREE.Vector3(side * 0.38, 0.52, 0.04),
    new THREE.Vector3(side * 0.62, 0.78, -0.10),
    new THREE.Vector3(side * 0.72, 1.06, -0.26),
    new THREE.Vector3(side * 0.62, 1.30, -0.40),
    new THREE.Vector3(side * 0.44, 1.44, -0.44)
  ];
  const geo = taperedTube(pts, (t) => 0.062 * (1 - 0.35 * t) + 0.004, 72, 14);
  grp.add(new THREE.Mesh(geo, matLimb));

  // elbow joint bead
  const elbow = new THREE.Mesh(sphere(0.075, 18, 14), matBodyDark);
  elbow.position.set(side * 0.40, 0.545, 0.02);
  grp.add(elbow);

  // ball tip
  const tip = new THREE.Mesh(sphere(0.115, 24, 18), matBodyDark);
  tip.position.set(side * 0.44, 1.45, -0.445);
  grp.add(tip);

  const gloss = new THREE.Mesh(sphere(0.035, 14, 10), matEyeWhite);
  gloss.position.set(side * 0.40, 1.505, -0.375);
  gloss.scale.set(1, 0.7, 0.6);
  grp.add(gloss);

  grp.position.set(side * 0.26, 0.44, 0.34);
  return grp;
}
head.add(makeAntenna(1));
head.add(makeAntenna(-1));

/* ============================================================
   SIX BENT NOODLE LEGS
   ============================================================ */
/**
 * Builds one leg: coxa bump -> femur up/out -> knee -> tibia down -> rounded foot.
 * cfg: { z, side, spread, lift, footZ, footSpread }
 */
function makeLeg(cfg) {
  const grp = new THREE.Group();
  const s = cfg.side;

  const hip   = new THREE.Vector3(0, 0, 0);
  const knee  = new THREE.Vector3(s * cfg.spread, cfg.lift, cfg.kneeZ);
  const ankle = new THREE.Vector3(s * cfg.footSpread * 0.94, -0.52, cfg.footZ * 0.85);
  const foot  = new THREE.Vector3(s * cfg.footSpread, -0.86, cfg.footZ);

  const pts = [
    hip,
    new THREE.Vector3(s * cfg.spread * 0.42, cfg.lift * 0.72, cfg.kneeZ * 0.40),
    knee,
    new THREE.Vector3(
      s * (cfg.spread * 0.72 + cfg.footSpread * 0.30),
      cfg.lift * 0.20,
      (cfg.kneeZ * 0.55 + cfg.footZ * 0.45)
    ),
    ankle,
    foot
  ];

  const geo = taperedTube(pts, (t) => {
    // thicker at the hip, thin noodle mid, tiny at the ankle
    const r = 0.098 * (1 - 0.58 * t) + 0.026;
    return r;
  }, 78, 14);
  grp.add(new THREE.Mesh(geo, matLimb));

  // coxa (hip) bump
  const coxa = new THREE.Mesh(sphere(0.115, 20, 14), matBodyDark);
  coxa.position.copy(hip);
  grp.add(coxa);

  // knee bead
  const kneeBall = new THREE.Mesh(sphere(0.082, 18, 14), matBodyDark);
  kneeBall.position.copy(knee);
  grp.add(kneeBall);

  // soft rounded foot
  const footBall = new THREE.Mesh(sphere(0.125, 24, 18), matFoot);
  footBall.position.copy(foot);
  footBall.scale.set(1.15, 0.80, 1.30);
  grp.add(footBall);

  grp.position.set(s * 0.24, cfg.hipY, cfg.z);
  return grp;
}

const legRoot = new THREE.Group();
ant.add(legRoot);

const legConfigs = [
  // front pair — reach forward
  { z: 0.62, hipY: 1.30, spread: 0.62, lift: 0.40, kneeZ: 0.86, footSpread: 0.92, footZ: 1.32 },
  // middle pair — out to the sides
  { z: 0.24, hipY: 1.28, spread: 0.80, lift: 0.38, kneeZ: 0.16, footSpread: 1.16, footZ: 0.26 },
  // rear pair — sweep back
  { z: -0.14, hipY: 1.28, spread: 0.70, lift: 0.36, kneeZ: -0.52, footSpread: 1.00, footZ: -1.06 }
];

for (const cfg of legConfigs) {
  for (const side of [1, -1]) {
    legRoot.add(makeLeg(Object.assign({ side }, cfg)));
  }
}

/* ============================================================
   THE LEAF — scalloped, held overhead like a parasol
   ============================================================ */
function makeScallopedLeaf(len = 2.5, wid = 1.55, lobes = 9) {
  const shape = new THREE.Shape();
  const half = [];
  const N = 130;
  for (let i = 0; i <= N; i++) {
    const t = i / N;                       // 0 = base, 1 = tip
    // base leaf half-width profile (ovate, pointed tip)
    const base = Math.sin(Math.pow(t, 0.62) * Math.PI) * (wid * 0.5);
    // scalloped edge
    const scallop = 1 + 0.085 * Math.sin(t * Math.PI * lobes * 2 - Math.PI / 2);
    const taperTip = Math.pow(1 - t, 0.35);
    const w = Math.max(0.0, base * scallop * (0.30 + 0.70 * taperTip));
    half.push(new THREE.Vector2(t * len, w));
  }
  shape.moveTo(0, 0);
  for (const p of half) shape.lineTo(p.x, p.y);
  for (let i = half.length - 1; i >= 0; i--) shape.lineTo(half[i].x, -half[i].y);
  shape.lineTo(0, 0);

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: 0.012,
    bevelEnabled: true,
    bevelThickness: 0.022,
    bevelSize: 0.022,
    bevelSegments: 3,
    curveSegments: 12,
    steps: 1
  });
  geo.center();
  geo.rotateX(-Math.PI / 2);   // lay flat in XZ, thickness along Y

  // Curve it into a gentle parasol dome + midrib crease.
  const p = geo.attributes.position;
  const v = new THREE.Vector3();
  const bb = new THREE.Box3().setFromBufferAttribute(p);
  const sizeX = Math.max(1e-5, bb.max.x - bb.min.x);
  const sizeZ = Math.max(1e-5, bb.max.z - bb.min.z);
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const nx = (v.x - bb.min.x) / sizeX;          // 0..1 along length
    const nz = (v.z - (bb.min.z + bb.max.z) * 0.5) / (sizeZ * 0.5); // -1..1 across
    // longitudinal droop (tips bend down)
    v.y -= 0.42 * Math.pow(Math.abs(nx - 0.42) * 1.75, 2.0);
    // lateral cupping (edges bend down)
    v.y -= 0.30 * nz * nz;
    // slight midrib ridge
    v.y += 0.055 * Math.exp(-Math.pow(nz * 3.2, 2));
    p.setXYZ(i, v.x, v.y, v.z);
  }
  p.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

const leafGroup = new THREE.Group();
{
  const blade = new THREE.Mesh(makeScallopedLeaf(2.6, 1.65, 9), matLeaf);
  leafGroup.add(blade);

  // midrib
  const ribGeo = taperedTube([
    new THREE.Vector3(-1.28, 0.055, 0),
    new THREE.Vector3(-0.55, 0.10, 0),
    new THREE.Vector3(0.15, 0.02, 0),
    new THREE.Vector3(0.80, -0.15, 0),
    new THREE.Vector3(1.26, -0.36, 0)
  ], (t) => 0.042 * (1 - 0.72 * t) + 0.008, 48, 12);
  leafGroup.add(new THREE.Mesh(ribGeo, matLeafVein));

  // side veins
  for (let i = 0; i < 5; i++) {
    const t = i / 4;
    const x0 = -1.05 + t * 1.75;
    const y0 = 0.085 - 0.34 * Math.pow(Math.max(0, t - 0.2), 1.8);
    const spanZ = 0.60 * Math.sin(Math.pow(1 - Math.abs(t - 0.28), 1.0) * Math.PI * 0.72) + 0.16;
    for (const s of [1, -1]) {
      const vein = taperedTube([
        new THREE.Vector3(x0, y0, 0),
        new THREE.Vector3(x0 + 0.20, y0 - 0.04, s * spanZ * 0.45),
        new THREE.Vector3(x0 + 0.40, y0 - 0.16, s * spanZ * 0.90)
      ], (u) => 0.020 * (1 - 0.7 * u) + 0.004, 22, 8);
      leafGroup.add(new THREE.Mesh(vein, matLeafVein));
    }
  }

  // stem / petiole, pointing back toward the mandibles
  const stemGeo = taperedTube([
    new THREE.Vector3(-1.28, 0.05, 0),
    new THREE.Vector3(-1.58, 0.00, 0),
    new THREE.Vector3(-1.86, -0.10, 0)
  ], (t) => 0.050 * (1 - 0.30 * t) + 0.008, 26, 12);
  leafGroup.add(new THREE.Mesh(stemGeo, matStem));
}

/* Position the leaf overhead like a parasol, gripped by the mandibles.
   Mandible tips sit near head-local (0, -0.26, 1.64) → world ≈ (0, 1.36, 2.85)… we
   instead angle the leaf steeply so its stem passes right between the jaws. */
leafGroup.rotation.set(0, 0, THREE.MathUtils.degToRad(58));
leafGroup.position.set(0.10, 3.22, 1.16);
leafGroup.scale.setScalar(1.06);
ant.add(leafGroup);

/* a short "grip" tube from the jaws to the leaf stem so the hold reads clearly */
{
  const gripGeo = taperedTube([
    new THREE.Vector3(0.00, 1.30, 1.78),
    new THREE.Vector3(-0.28, 1.72, 1.62),
    new THREE.Vector3(-0.62, 2.20, 1.44),
    new THREE.Vector3(-0.86, 2.62, 1.30)
  ], (t) => 0.052 - 0.010 * t, 40, 12);
  ant.add(new THREE.Mesh(gripGeo, matStem));
}

/* tiny "grip band" where the jaws close on the stem */
{
  const band = new THREE.Mesh(new THREE.TorusGeometry(0.10, 0.028, 10, 24), matDark);
  band.position.set(-0.12, 1.48, 1.70);
  band.rotation.set(0.0, 0.35, 0.72);
  ant.add(band);
}

/* ============================================================
   FINALIZE
   ============================================================ */
markShadows(ant);

// Center the ant horizontally and rest its feet on the ground plane.
{
  const box = new THREE.Box3().setFromObject(ant);
  const center = new THREE.Vector3();
  box.getCenter(center);
  ant.position.x -= center.x;
  ant.position.z -= center.z;
  ant.position.y -= box.min.y;   // feet touch y = 0
}

// Re-aim the orbit target at the new visual center.
{
  const box = new THREE.Box3().setFromObject(ant);
  const c = new THREE.Vector3();
  box.getCenter(c);
  controls.target.set(0, c.y * 0.94, 0);
  controls.update();
}

/* ============================================================
   ANIMATION
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // gentle idle bob + antenna-ish sway
  ant.rotation.z = Math.sin(t * 0.8) * 0.012;
  head.rotation.z = Math.sin(t * 1.1 + 0.5) * 0.03;
  leafGroup.rotation.x = Math.sin(t * 0.9) * 0.035;

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>
</body>
</html>
