<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terraced Rice Fields</title>
<style>
  html,body{margin:0;overflow:hidden;background:#f5a35c}
  canvas{display:block}
  #label{position:fixed;left:18px;bottom:15px;color:#fff5dd;font:12px/1.35 system-ui,sans-serif;letter-spacing:.12em;text-shadow:0 2px 8px #4b2a1b;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">TERRACED RICE FIELDS · SUNRISE</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2a267);
scene.fog = new THREE.FogExp2(0xf3b275, 0.018);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 220);
camera.position.set(20, 14, 25);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.minDistance = 13;
controls.maxDistance = 44;
controls.maxPolarAngle = Math.PI * 0.485;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.22;

let seed = 23941;
const rnd = () => {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
};
const range = (a,b) => a + (b-a)*rnd();
const pick = a => a[Math.floor(rnd()*a.length)];

const V = THREE.Vector3;
const G = THREE.Group;
const objects = [];
const palms = [];
const waterSurfaces = [];
const birds = [];
const smoke = [];

const hemi = new THREE.HemisphereLight(0xffc797, 0x486331, 2.1);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffb25c, 4.2);
sun.position.set(-20, 22, -13);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = -38;
sun.shadow.camera.right = 38;
sun.shadow.camera.top = 34;
sun.shadow.camera.bottom = -25;
sun.shadow.bias = -0.0004;
scene.add(sun);

const warmFill = new THREE.PointLight(0xff8b4c, 34, 45, 2);
warmFill.position.set(-13, 8, -11);
scene.add(warmFill);

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(105, 32, 18),
  new THREE.ShaderMaterial({
    side:THREE.BackSide,
    depthWrite:false,
    uniforms:{},
    vertexShader:`varying vec3 p; void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`varying vec3 p; void main(){float h=normalize(p).y*.5+.5; vec3 a=vec3(1.,.45,.22);vec3 b=vec3(.30,.55,.73);vec3 c=vec3(.98,.73,.43); vec3 col=mix(a,c,smoothstep(.15,.53,h));col=mix(col,b,smoothstep(.52,1.,h));gl_FragColor=vec4(col,1.);}`
  })
);
scene.add(sky);

const sunDisc = new THREE.Mesh(
  new THREE.CircleGeometry(3.15, 48),
  new THREE.MeshBasicMaterial({color:0xffe0a2, transparent:true, opacity:.92, fog:false})
);
sunDisc.position.set(-20, 12, -36);
sunDisc.lookAt(camera.position);
scene.add(sunDisc);

function mat(color, rough=1, metal=0) {
  return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,flatShading:true});
}
const groundMat = mat(0x536b32);
const earthMat = mat(0x74502d);
const bundMat = mat(0x5a6f29);
const grassMat = mat(0x789330);
const leafMat = mat(0x2e6c32);
const leafLightMat = mat(0x4f8c37);
const woodMat = mat(0x5a321d);
const woodLightMat = mat(0x8a5130);
const roofMat = mat(0x69331d);
const mudMat = mat(0x725337);

function mesh(geo, material, x=0,y=0,z=0) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x,y,z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

const backdrop = mesh(new THREE.PlaneGeometry(135, 135), groundMat, 0, -2.35, 0);
backdrop.rotation.x = -Math.PI/2;
scene.add(backdrop);

const hills = new G();
for(let i=0;i<22;i++){
  const x=range(-49,49), z=range(-48,-18);
  const s=range(7,18), h=range(5,15);
  const mound=mesh(new THREE.DodecahedronGeometry(s,1), pick([mat(0x466c38),mat(0x567a3e),mat(0x627f42)]),x,h*.25-2,z);
  mound.scale.y=h/s*.55;
  hills.add(mound);
}
scene.add(hills);

const terraceData = [
  {z: 7.0, y:2.3, sx:13.5, sz:5.0, bend:-.35},
  {z: 3.1, y:1.0, sx:15.2, sz:5.2, bend:-.15},
  {z:-1.1, y:-.35,sx:16.8, sz:5.5, bend:.05},
  {z:-5.7, y:-1.72,sx:18.7, sz:5.8, bend:.24},
  {z:-10.6,y:-3.12,sx:21.0, sz:6.2, bend:.43}
];

function terraceShape(d, inset=0) {
  const pts=[];
  const n=44;
  for(let i=0;i<n;i++){
    const t=i/(n-1);
    const a=Math.PI*(1.08-.16*t);
    const x=Math.cos(a)*(d.sx-inset);
    const z=Math.sin(a)*(d.sz-inset)+d.z+d.bend*Math.cos(a)*3;
    pts.push(new THREE.Vector2(x,z));
  }
  for(let i=n-1;i>=0;i--){
    const t=i/(n-1);
    const a=Math.PI*(1.08-.16*t);
    const x=Math.cos(a)*(d.sx-inset)*.73;
    const z=Math.sin(a)*(d.sz-inset)*.30+d.z+1.05+d.bend*Math.cos(a)*2;
    pts.push(new THREE.Vector2(x,z));
  }
  return new THREE.Shape(pts);
}

const waterMat = new THREE.MeshPhysicalMaterial({
  color:0x6caea1,
  roughness:.13,
  metalness:.02,
  transmission:.08,
  transparent:true,
  opacity:.88,
  clearcoat:.7,
  clearcoatRoughness:.12,
  side:THREE.DoubleSide
});

for(const d of terraceData){
  const shape=terraceShape(d,0);
  const embankment=mesh(new THREE.ExtrudeGeometry(shape,{depth:.82,bevelEnabled:true,bevelSize:.17,bevelThickness:.15,bevelSegments:2}),earthMat,0,d.y-.8,0);
  embankment.rotation.x=-Math.PI/2;
  scene.add(embankment);

  const rim=mesh(new THREE.ExtrudeGeometry(terraceShape(d,.16),{depth:.23,bevelEnabled:true,bevelSize:.11,bevelThickness:.08,bevelSegments:2}),bundMat,0,d.y-.12,0);
  rim.rotation.x=-Math.PI/2;
  scene.add(rim);

  const water=mesh(new THREE.ShapeGeometry(terraceShape(d,.53)),waterMat,0,d.y+.025,0);
  water.rotation.x=-Math.PI/2;
  water.userData = {baseY:d.y+.025, phase:rnd()*10, width:d.sx};
  waterSurfaces.push(water);
  scene.add(water);

  const grassGeo=new THREE.ConeGeometry(.045,.6,4);
  for(let i=0;i<95;i++){
    const a=range(.13,3.05);
    const outer=i%2===0;
    const sx=outer?d.sx-.03:d.sx*.73;
    const sz=outer?d.sz-.05:d.sz*.30;
    const x=Math.cos(a)*sx;
    const z=Math.sin(a)*sz+d.z+(outer?d.bend*Math.cos(a)*3:1.05+d.bend*Math.cos(a)*2);
    const blade=mesh(grassGeo,pick([grassMat,leafLightMat,bundMat]),x,d.y+.12,z);
    blade.rotation.z=range(-.3,.3);
    blade.scale.setScalar(range(.65,1.25));
    scene.add(blade);
  }

  const rice = new G();
  for(let row=0;row<7;row++){
    for(let col=0;col<18;col++){
      const u=(col/17-.5)*1.52;
      const v=row/6;
      const x=u*d.sx*.82 + Math.sin(v*3.2)*.3;
      const z=d.z + .4 + v*d.sz*.45 + Math.sin(u*3)*.35;
      if(Math.abs(x)>d.sx*.75) continue;
      const clump=new G();
      for(let b=0;b<4;b++){
        const blade=mesh(new THREE.PlaneGeometry(.042,range(.34,.55)),pick([leafMat,leafLightMat]),0,0,0);
        blade.position.set(range(-.07,.07),.2,range(-.07,.07));
        blade.rotation.y=range(0,Math.PI);
        blade.rotation.z=range(-.34,.34);
        clump.add(blade);
      }
      clump.position.set(x,d.y+.035,z);
      clump.userData={phase:rnd()*6, row};
      rice.add(clump);
    }
  }
  rice.userData.rice=true;
  objects.push(rice);
  scene.add(rice);
}

function makePath(){
  const path=new G();
  const points=[
    new V(-16,-2.1,-13),new V(-10,-.7,-9),new V(-6,.1,-5),
    new V(-9,1.45,-1),new V(-4,2.7,3),new V(0,3.7,7)
  ];
  for(let i=0;i<points.length-1;i++){
    const a=points[i],b=points[i+1],dir=new V().subVectors(b,a);
    const len=dir.length();
    const stone=mesh(new THREE.BoxGeometry(1.45,.10,len+1.1),mat(0x9a7548),0,0,0);
    stone.position.copy(a).lerp(b,.5);
    stone.position.y-=.03;
    stone.rotation.y=Math.atan2(dir.x,dir.z);
    stone.rotation.z=range(-.025,.025);
    path.add(stone);
  }
  scene.add(path);
}
makePath();

function makeHut(x,y,z){
  const hut=new G();
  const posts=[
    [-2,-1.5,-1.35],[2,-1.5,-1.35],[-2,-1.5,1.35],[2,-1.5,1.35]
  ];
  for(const p of posts){
    const post=mesh(new THREE.CylinderGeometry(.13,.17,3.2,7),woodMat,p[0],p[1]+1.4,p[2]);
    post.rotation.z=range(-.035,.035);
    hut.add(post);
  }
  const floor=mesh(new THREE.BoxGeometry(5,.22,3.3),woodLightMat,0,.08,0);
  hut.add(floor);
  for(let i=0;i<11;i++){
    const plank=mesh(new THREE.BoxGeometry(.3,.08,3.5),pick([woodMat,woodLightMat]),-2.25+i*.45,.22,0);
    hut.add(plank);
  }
  const walls=new G();
  for(let i=0;i<8;i++){
    const slat=mesh(new THREE.BoxGeometry(.39,1.8,.12),pick([woodMat,woodLightMat]),-1.65+i*.47,1.12,-1.53);
    walls.add(slat);
  }
  for(let i=0;i<6;i++){
    const slat=mesh(new THREE.BoxGeometry(.12,1.8,.40),woodMat,-2.42,1.12,-1.15+i*.46);
    walls.add(slat);
  }
  hut.add(walls);
  const roof=mesh(new THREE.ConeGeometry(3.65,1.45,4),roofMat,0,2.42,0);
  roof.rotation.y=Math.PI*.25;
  roof.scale.z=.74;
  hut.add(roof);
  for(let i=0;i<5;i++){
    const stair=mesh(new THREE.BoxGeometry(1.35,.15,.45),woodLightMat,0,-.1-i*.22,1.82+i*.30);
    hut.add(stair);
  }
  const pot=mesh(new THREE.SphereGeometry(.27,10,7),mat(0x5e4634),1.55,.47,1.52);
  pot.scale.y=.8;
  hut.add(pot);
  hut.position.set(x,y,z);
  hut.rotation.y=-.32;
  scene.add(hut);
}
makeHut(6.1,1.12,4.6);

function makePalm(x,y,z,scale=1){
  const palm=new G();
  const trunk=new G();
  for(let i=0;i<8;i++){
    const seg=mesh(new THREE.CylinderGeometry(.20-i*.009,.25-i*.01,.76,7),pick([woodMat,woodLightMat]),0,i*.66,0);
    seg.rotation.z=.025*Math.sin(i*.6);
    seg.position.x=.08*Math.sin(i*.5);
    trunk.add(seg);
  }
  palm.add(trunk);
  const crown=new G();
  crown.position.y=5.15;
  for(let i=0;i<9;i++){
    const frond=new G();
    const stem=mesh(new THREE.CylinderGeometry(.035,.055,2.65,5),leafMat,0,0,0);
    stem.rotation.z=Math.PI/2.55;
    stem.position.x=1.18;
    frond.add(stem);
    const blade=mesh(new THREE.ConeGeometry(.52,2.7,5),i%2?leafMat:leafLightMat,2.22,-.13,0);
    blade.rotation.z=Math.PI/2;
    blade.scale.y=.38;
    frond.add(blade);
    frond.rotation.y=i*Math.PI*2/9;
    frond.rotation.z=range(-.15,.15);
    crown.add(frond);
  }
  palm.add(crown);
  palm.position.set(x,y,z);
  palm.scale.setScalar(scale);
  palm.userData={crown,phase:rnd()*8};
  palms.push(palm);
  scene.add(palm);
}
makePalm(-14,-1.5,-4,1.28);
makePalm(-11,-1.5,-7,.88);
makePalm(13,-2.0,-9,1.23);
makePalm(16,-2.0,-7,.8);
makePalm(12,.2,4,.72);

function makeBuffalo(){
  const b=new G();
  const hide=mat(0x343632,.88);
  const body=mesh(new THREE.SphereGeometry(1.36,14,10),hide,0,1.24,0);
  body.scale.set(1.35,.82,.72);
  b.add(body);
  const neck=mesh(new THREE.CylinderGeometry(.46,.62,1.3,10),hide,1.48,1.12,.05);
  neck.rotation.z=-.66;
  b.add(neck);
  const head=mesh(new THREE.SphereGeometry(.62,12,9),hide,1.95,.87,.06);
  head.scale.set(1,.88,.78);
  b.add(head);
  for(const z of [-.55,.55]) for(const x of [-.82,.72]){
    const leg=mesh(new THREE.CylinderGeometry(.13,.17,1.15,7),hide,x,.48,z);
    b.add(leg);
    const hoof=mesh(new THREE.SphereGeometry(.18,7,5),mat(0x212522),x,.0,z);
    hoof.scale.set(1.1,.4,1.3);
    b.add(hoof);
  }
  for(const z of [-.32,.32]){
    const horn=mesh(new THREE.TorusGeometry(.43,.06,6,12,Math.PI*.8),mat(0xcbb989,.65),2.25,1.15,z);
    horn.rotation.x=Math.PI/2;
    horn.rotation.z=-.55;
    b.add(horn);
  }
  const ear=mesh(new THREE.SphereGeometry(.18,7,5),hide,2.02,1.18,.54);
  ear.scale.set(1,.3,1.5);
  b.add(ear);
  const tail=mesh(new THREE.CylinderGeometry(.025,.045,1.2,5),hide,-1.65,1.18,0);
  tail.rotation.z=-.9;
  b.add(tail);
  b.position.set(-6.8,-1.8,-10.7);
  b.rotation.y=.32;
  b.userData={head,tail,phase:0};
  objects.push(b);
  scene.add(b);
}
makeBuffalo();

const pool = mesh(new THREE.CircleGeometry(3.15,36),new THREE.MeshPhysicalMaterial({
  color:0x6d8270,roughness:.2,metalness:.02,transparent:true,opacity:.9
}),-7.8,-2.17,-11.4);
pool.rotation.x=-Math.PI/2;
waterSurfaces.push(pool);
scene.add(pool);

for(let i=0;i<35;i++){
  const a=rnd()*Math.PI*2,r=Math.sqrt(rnd())*3.35;
  const tuft=new G();
  for(let j=0;j<5;j++){
    const blade=mesh(new THREE.ConeGeometry(.05,range(.4,.8),4),grassMat,0,.28,0);
    blade.rotation.z=range(-.5,.5);
    tuft.add(blade);
  }
  tuft.position.set(-7.8+Math.cos(a)*r,-2.08,-11.4+Math.sin(a)*r*.55);
  scene.add(tuft);
}

function makeRock(x,y,z,s=1){
  const r=mesh(new THREE.DodecahedronGeometry(s,1),pick([mat(0x7c694d),mat(0x685b45),mat(0x8d744e)]),x,y,z);
  r.scale.y=range(.42,.75);
  r.rotation.set(rnd(),rnd(),rnd());
  scene.add(r);
}
for(let i=0;i<58;i++){
  const angle=rnd()*Math.PI*2;
  const r=range(18,31);
  makeRock(Math.cos(angle)*r,range(-2.1,-.9),Math.sin(angle)*r-3,range(.15,.7));
}

function makeEgret(x,y,z,scale=1){
  const bird=new G();
  const white=mat(0xfff6db,.72);
  const body=mesh(new THREE.SphereGeometry(.22,8,6),white,0,0,0);
  body.scale.set(1.1,1.45,.78);
  bird.add(body);
  const neck=mesh(new THREE.CylinderGeometry(.045,.075,.5,6),white,.1,.38,0);
  neck.rotation.z=-.28;
  bird.add(neck);
  const head=mesh(new THREE.SphereGeometry(.11,7,5),white,.0,.64,0);
  bird.add(head);
  const beak=mesh(new THREE.ConeGeometry(.045,.28,5),mat(0xd59a35),-.14,.64,0);
  beak.rotation.z=-Math.PI/2;
  bird.add(beak);
  const wings=[];
  for(const side of [-1,1]){
    const wing=mesh(new THREE.ConeGeometry(.22,.92,5),white,side*.24,.08,0);
    wing.rotation.z=side*Math.PI/2;
    bird.add(wing);
    wings.push(wing);
  }
  bird.position.set(x,y,z);
  bird.scale.setScalar(scale);
  bird.userData={wings,phase:rnd()*9,baseY:y};
  birds.push(bird);
  scene.add(bird);
}
makeEgret(-1,6.2,-7,.9);
makeEgret(2,7.6,-10,.72);
makeEgret(-10,-.83,-3,.8);
makeEgret(9,.44,1,.72);

function makeSmoke(){
  const group=new G();
  for(let i=0;i<7;i++){
    const puff=mesh(new THREE.SphereGeometry(.38+i*.07,8,6),new THREE.MeshStandardMaterial({
      color:0xd7d1b9,transparent:true,opacity:.32,roughness:1,depthWrite:false
    }),0,i*.34,0);
    puff.position.x=Math.sin(i*1.8)*.2;
    group.add(puff);
  }
  group.position.set(6.2,4.5,4.4);
  group.userData={phase:0};
  smoke.push(group);
  scene.add(group);
}
makeSmoke();

const fireflies = new G();
const fireMat = new THREE.MeshBasicMaterial({color:0xffd974,transparent:true,opacity:.8});
for(let i=0;i<36;i++){
  const dot=new THREE.Mesh(new THREE.SphereGeometry(.035,5,4),fireMat);
  dot.position.set(range(-17,17),range(-.6,4.8),range(-12,9));
  dot.userData={base:dot.position.clone(),phase:rnd()*8};
  fireflies.add(dot);
}
scene.add(fireflies);

function animate(t){
  requestAnimationFrame(animate);
  const time=t*.001;

  for(const w of waterSurfaces){
    const p=w.userData.phase || 0;
    w.position.y=(w.userData.baseY ?? w.position.y)+Math.sin(time*1.9+p)*.014;
    w.material.roughness=.12+Math.sin(time*1.2+p)*.045;
  }

  for(const o of objects){
    if(o.userData.rice){
      o.children.forEach((clump,i)=>{
        clump.rotation.z=Math.sin(time*1.35+clump.userData.phase+i*.17)*.13;
      });
    } else if(o.userData.head){
      o.userData.head.rotation.z=Math.sin(time*.72)*.12;
      o.userData.tail.rotation.y=Math.sin(time*2.1)*.38;
    }
  }

  for(const p of palms){
    p.userData.crown.rotation.z=Math.sin(time*.72+p.userData.phase)*.07;
    p.userData.crown.children.forEach((f,i)=>{
      f.rotation.z=Math.sin(time*1.15+i*.78+p.userData.phase)*.1;
    });
  }

  for(const b of birds){
    const airborne=b.userData.baseY>2;
    if(airborne){
      b.position.y=b.userData.baseY+Math.sin(time*2+b.userData.phase)*.32;
      b.position.x+=Math.sin(time*.4+b.userData.phase)*.004;
      b.userData.wings.forEach((w,i)=>w.rotation.x=Math.sin(time*7+b.userData.phase)*(.75)*(i?1:-1));
    } else {
      b.rotation.y=Math.sin(time*.8+b.userData.phase)*.2;
    }
  }

  for(const s of smoke){
    s.position.x=6.2+Math.sin(time*.45)*.22;
    s.children.forEach((p,i)=>{
      p.position.x=Math.sin(time*.8+i)*(.15+i*.035);
      p.position.z=Math.cos(time*.65+i)*.08;
      p.material.opacity=.28+Math.sin(time+i)*.06;
    });
  }

  fireflies.children.forEach(d=>{
    const q=d.userData;
    d.position.x=q.base.x+Math.sin(time*1.2+q.phase)*.24;
    d.position.y=q.base.y+Math.sin(time*1.8+q.phase)*.18;
    d.material.opacity=.3+.55*(.5+.5*Math.sin(time*3+q.phase));
  });

  sunDisc.lookAt(camera.position);
  controls.update();
  renderer.render(scene,camera);
}
animate(0);

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
