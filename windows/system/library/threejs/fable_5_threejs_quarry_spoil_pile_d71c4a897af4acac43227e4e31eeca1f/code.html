<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quarry Spoil Pile</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#cfdde6}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// ---------- helpers ----------
let seed=7;
const rnd=()=> (seed=(seed*16807)%2147483647)/2147483647;
const hash=(i,j)=>{const n=Math.sin(i*127.1+j*311.7)*43758.5453;return n-Math.floor(n);};
const vnoise=(x,y)=>{const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);
  return hash(i,j)*(1-u)*(1-v)+hash(i+1,j)*u*(1-v)+hash(i,j+1)*(1-u)*v+hash(i+1,j+1)*u*v;};
const fbm=(x,y)=>vnoise(x,y)*.55+vnoise(x*2.17,y*2.17)*.3+vnoise(x*4.9,y*4.9)*.15;
const smooth=t=>{t=Math.min(1,Math.max(0,t));return t*t*(3-2*t);};
const srgb=(r,g,b)=>new THREE.Color(r,g,b).convertSRGBToLinear();

// ---------- terrain field (meters, north = -Z) ----------
const roadCx=z=>14+3.2*Math.sin(z*0.09+0.6);           // road centerline, runs N-S past east base
const roadY=z=>0.25*Math.sin(z*0.05+1)+0.12;           // gentle grade
function terrain(x,z){
  let y=(fbm(x*0.06+3,z*0.06+3)-0.5)*2.6+(fbm(x*0.22+9,z*0.22+9)-0.5)*0.5; // undulating ground
  const r=Math.hypot(x,z);
  let pf=0;                                            // pile pad: compacted, slightly recessed
  if(r<13){pf=1-smooth(Math.max(0,r-6)/7);y=y*(1-pf)+(-0.12)*pf;}
  const d=Math.abs(x-roadCx(z)),w=3.1,sh=2.8;
  let rd=0;                                            // graded road with crown + shoulders
  if(d<w+sh){rd=d<w?1:1-smooth((d-w)/sh);
    const t=roadY(z)+0.05*Math.max(0,1-(d/w)*(d/w));
    y=y*(1-rd)+t*rd;}
  return {y,rd,pf,r,d};
}

// ---------- scene ----------
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xcfdde6);
scene.fog=new THREE.Fog(0xcfdde6,80,220);

const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,500);
camera.position.set(30,17,34);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,2.5,0);
controls.enableDamping=true;
controls.autoRotate=true;
controls.autoRotateSpeed=0.7;
controls.minDistance=12;controls.maxDistance=110;
controls.maxPolarAngle=Math.PI*0.49;

// ---------- lighting ----------
scene.add(new THREE.HemisphereLight(0xbfd4e2,0x8a7a5f,0.65));
const sun=new THREE.DirectionalLight(0xfff0da,2.1);
sun.position.set(24,32,14);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-45;sun.shadow.camera.right=45;
sun.shadow.camera.top=45;sun.shadow.camera.bottom=-45;
sun.shadow.camera.far=120;
sun.shadow.bias=-0.0005;sun.shadow.radius=4;
scene.add(sun);

// ---------- ground with road ----------
{
  const g=new THREE.PlaneGeometry(90,90,150,150);
  g.rotateX(-Math.PI/2);
  const p=g.attributes.position,cols=[];
  const cEarth=srgb(0.43,0.37,0.28),cGrass=srgb(0.47,0.45,0.30),
        cRoad=srgb(0.63,0.58,0.48),cRut=srgb(0.52,0.47,0.39),cPad=srgb(0.50,0.46,0.40);
  const c=new THREE.Color();
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),z=p.getZ(i),t=terrain(x,z);
    p.setY(i,t.y);
    const n=fbm(x*0.35+1,z*0.35+1);
    c.copy(cEarth).lerp(cGrass,smooth((n-0.35)*2.2));           // patchy dry ground
    c.multiplyScalar(0.85+0.3*fbm(x*1.3,z*1.3));                 // fine mottle
    if(t.pf>0)c.lerp(cPad,t.pf*0.85);                            // gravel spill near pile
    if(t.rd>0){const rc=(t.d>1.1&&t.d<1.9)?cRut:cRoad;           // wheel ruts
      c.lerp(rc,t.rd*0.95);}
    cols.push(c.r,c.g,c.b);
  }
  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  g.computeVertexNormals();
  const ground=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.96,metalness:0}));
  ground.receiveShadow=true;
  scene.add(ground);
}

// ---------- spoil pile (irregular truncated cone of loose rock) ----------
const pileMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.98,metalness:0,flatShading:true});
{
  const H=6.8,R=9.6;
  const g=new THREE.CylinderGeometry(1.4,R,H,110,26);
  const p=g.attributes.position,cols=[];
  const cA=srgb(0.50,0.45,0.38),cB=srgb(0.35,0.31,0.26),cC=srgb(0.58,0.54,0.47);
  const c=new THREE.Color();
  for(let i=0;i<p.count;i++){
    let x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const f=(y+H/2)/H,a=Math.atan2(z,x);
    const gully=0.07*Math.pow(Math.max(0,Math.sin(a*9+2.2)),1.6)*(1-f*0.8);
    const bump=1+(fbm(x*0.33+4,z*0.33+4)-0.5)*(0.55-0.3*f)-gully;
    x*=bump;z*=bump;
    y+=(fbm(x*0.5+9,z*0.5+9)-0.5)*0.55*(1-Math.abs(f-0.5)*1.1);
    p.setXYZ(i,x,y,z);
    const n=fbm(x*0.55+2,z*0.55+f*4);
    c.copy(cA).lerp(cB,smooth((n-0.3)*2));
    c.lerp(cC,smooth((f-0.55)*1.6)*0.4*fbm(a*2+8,f*3));          // fresher scree upslope
    cols.push(c.r,c.g,c.b);
  }
  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
  const pile=new THREE.Mesh(g,pileMat);
  pile.position.y=H/2-0.15;
  pile.castShadow=pile.receiveShadow=true;
  scene.add(pile);

  const sk=new THREE.CylinderGeometry(9.0,11.8,1.5,90,3);        // talus skirt at the toe
  const sp=sk.attributes.position,scols=[];
  for(let i=0;i<sp.count;i++){
    let x=sp.getX(i),y=sp.getY(i),z=sp.getZ(i);
    const b=1+(fbm(x*0.4+6,z*0.4+6)-0.5)*0.28;
    sp.setXYZ(i,x*b,y,z*b);
    const n=fbm(x*0.6+3,z*0.6+3);
    c.copy(cA).lerp(cB,smooth((n-0.3)*2));
    scols.push(c.r,c.g,c.b);
  }
  sk.setAttribute('color',new THREE.Float32BufferAttribute(scols,3));
  const skirt=new THREE.Mesh(sk,pileMat);
  skirt.position.y=0.55;
  skirt.castShadow=skirt.receiveShadow=true;
  scene.add(skirt);
}

// ---------- scattered rocks ----------
{
  const rockGeo=new THREE.DodecahedronGeometry(1,0);
  const rockMat=new THREE.MeshStandardMaterial({color:srgb(0.45,0.41,0.35),roughness:0.95,flatShading:true});
  const N=85,inst=new THREE.InstancedMesh(rockGeo,rockMat,N);
  const d=new THREE.Object3D();
  for(let i=0;i<N;i++){
    let x,z;
    if(i<60){const a=rnd()*Math.PI*2,r=10+rnd()*3.2;x=Math.cos(a)*r;z=Math.sin(a)*r;} // toe scatter
    else if(i<72){z=(rnd()-0.5)*70;x=roadCx(z)+(rnd()<0.5?-1:1)*(3.4+rnd()*1.4);}     // road shoulders
    else{x=(rnd()-0.5)*70;z=(rnd()-0.5)*70;}
    const t=terrain(x,z);if(t.rd>0.6&&i>=72){continue;}
    const s=0.14+rnd()*rnd()*0.45;
    d.position.set(x,t.y+s*0.35,z);
    d.rotation.set(rnd()*3,rnd()*3,rnd()*3);
    d.scale.set(s*(0.7+rnd()*0.6),s*(0.55+rnd()*0.5),s*(0.7+rnd()*0.6));
    d.updateMatrix();
    inst.setMatrixAt(i,d.matrix);
  }
  inst.castShadow=inst.receiveShadow=true;
  scene.add(inst);
}

// ---------- loop ----------
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script>
</body>
</html>
