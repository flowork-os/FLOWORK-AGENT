<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Classical Marble Bust — Procedural three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #171719; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: rgba(230,228,222,0.55); letter-spacing: .3px; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hint">Marble portrait bust · drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------------------------------------------------------------- Renderer */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

/* ------------------------------------------------------------------- Scene */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171719);

/* Subtle image-based lighting from a procedural studio room (no assets) */
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

/* ------------------------------------------------------------------ Camera */
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.5, 1.85, 3.6);

/* ---------------------------------------------------------------- Controls */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.45, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 2.2;
controls.maxDistance = 8.5;
controls.maxPolarAngle = Math.PI * 0.52;
controls.update();

/* --------------------------------------------------------------- Lighting */
const hemi = new THREE.HemisphereLight(0xbcc4d0, 0x2b2620, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e6, 2.3);
key.position.set(3.5, 6.0, 4.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 20;
key.shadow.camera.left = -3;
key.shadow.camera.right = 3;
key.shadow.camera.top = 4;
key.shadow.camera.bottom = -1;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.target.position.set(0, 1.8, 0);
scene.add(key);
scene.add(key.target);

const fill = new THREE.DirectionalLight(0xdfe6ff, 0.65);
fill.position.set(-4.0, 2.5, 2.2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.3);
rim.position.set(-2.0, 4.0, -5.0);
scene.add(rim);

/* ------------------------------------------------------------- Materials */
const marble = new THREE.MeshPhysicalMaterial({
  color: 0xeae4d6,
  roughness: 0.55,
  metalness: 0.0,
  clearcoat: 0.25,
  clearcoatRoughness: 0.55,
  sheen: 0.25,
  sheenColor: new THREE.Color(0xffffff),
  envMapIntensity: 0.85
});

const stone = new THREE.MeshPhysicalMaterial({
  color: 0xd9d6cd,
  roughness: 0.7,
  metalness: 0.0,
  clearcoat: 0.1,
  clearcoatRoughness: 0.7,
  envMapIntensity: 0.6
});

const darkHole = new THREE.MeshStandardMaterial({
  color: 0x0a0a0a,
  roughness: 0.75,
  metalness: 0.0
});

/* ------------------------------------------------------------------- Bust */
const bust = new THREE.Group();
scene.add(bust);

function addMesh(geometry, material, x, y, z) {
  const m = new THREE.Mesh(geometry, material);
  if (x !== undefined) m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  bust.add(m);
  return m;
}

/* --- Plinth (square, two-tier) --- */
const plinthBase = addMesh(new THREE.BoxGeometry(1.1, 0.78, 1.1), stone, 0, 0.39, 0);
const plinthCap  = addMesh(new THREE.BoxGeometry(1.25, 0.16, 1.25), stone, 0, 0.86, 0);
plinthBase.castShadow = true; plinthCap.castShadow = true;

/* --- Torso / upper chest + neck (lathed surface of revolution, thinned in Z) --- */
const torsoProfile = [
  new THREE.Vector2(0.000, 0.90),
  new THREE.Vector2(0.600, 0.90),
  new THREE.Vector2(0.660, 1.12),
  new THREE.Vector2(0.700, 1.34),
  new THREE.Vector2(0.585, 1.55),
  new THREE.Vector2(0.400, 1.73),
  new THREE.Vector2(0.275, 1.92),
  new THREE.Vector2(0.225, 2.08),
  new THREE.Vector2(0.215, 2.22)
];
const torsoGeo = new THREE.LatheGeometry(torsoProfile, 56);
const torso = addMesh(torsoGeo, marble);
torso.scale.set(1.0, 1.0, 0.8);      // thin front-to-back like a real bust

/* --- Head (egg-shaped ellipsoid), face toward +Z --- */
const HEAD = new THREE.Vector3(0, 2.5, 0);
const headR = 0.36;
const headSX = 0.92, headSY = 1.04, headSZ = 0.90;
const head = addMesh(new THREE.SphereGeometry(headR, 64, 48), marble, HEAD.x, HEAD.y, HEAD.z);
head.scale.set(headSX, headSY, headSZ);

/* --- Jaw / chin subtle bump --- */
addMesh(new THREE.SphereGeometry(0.13, 32, 24), marble, 0, 2.27, 0.22)
  .scale.set(1.3, 0.9, 0.9);

/* --- Cheek fullness --- */
addMesh(new THREE.SphereGeometry(0.11, 24, 18), marble, 0.17, 2.44, 0.20).scale.set(1.0, 0.9, 0.8);
addMesh(new THREE.SphereGeometry(0.11, 24, 18), marble, -0.17, 2.44, 0.20).scale.set(1.0, 0.9, 0.8);

/* --- Brow ridge (heavy classical brow) --- */
const browL = addMesh(new THREE.SphereGeometry(0.09, 24, 16), marble, 0.125, 2.615, 0.255);
browL.scale.set(1.5, 0.5, 0.6); browL.rotation.z = 0.18;
const browR = addMesh(new THREE.SphereGeometry(0.09, 24, 16), marble, -0.125, 2.615, 0.255);
browR.scale.set(1.5, 0.5, 0.6); browR.rotation.z = -0.18;

/* --- Eyes: blank marble eyeballs with drilled hollow pupils --- */
function makeEye(sx) {
  const eyeball = addMesh(new THREE.SphereGeometry(0.065, 32, 24), marble, sx * 0.135, 2.55, 0.235);
  eyeball.scale.set(1.25, 0.85, 0.9);
  // upper lid
  const lid = addMesh(new THREE.SphereGeometry(0.075, 24, 16), marble, sx * 0.135, 2.585, 0.245);
  lid.scale.set(1.3, 0.55, 0.7);
  // drilled pupil (dark recessed hole)
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.024, 20, 16), darkHole);
  pupil.position.set(sx * 0.135, 2.552, 0.285);
  bust.add(pupil);
}
makeEye(1);
makeEye(-1);

/* --- Nose: truncated (broken/chipped) form — the flat cap reads as the break --- */
const noseGeo = new THREE.CylinderGeometry(0.028, 0.062, 0.26, 8, 1);
const nose = addMesh(noseGeo, marble, 0, 2.51, 0.26);
nose.rotation.x = -0.55;   // tilt so the broken tip points down & forward
nose.rotation.z = 0.12;    // slight asymmetry — a chipped, imperfect edge

/* --- Lips (subtle) --- */
const upperLip = addMesh(new THREE.SphereGeometry(0.09, 24, 16), marble, 0, 2.37, 0.28);
upperLip.scale.set(1.25, 0.35, 0.5);
const lowerLip = addMesh(new THREE.SphereGeometry(0.09, 24, 16), marble, 0, 2.335, 0.285);
lowerLip.scale.set(1.05, 0.42, 0.5);

/* --- Ears --- */
const earL = addMesh(new THREE.SphereGeometry(0.11, 24, 18), marble, 0.322, 2.50, -0.02);
earL.scale.set(0.4, 1.1, 0.75);
const earR = addMesh(new THREE.SphereGeometry(0.11, 24, 18), marble, -0.322, 2.50, -0.02);
earR.scale.set(0.4, 1.1, 0.75);

/* --- Stylized hair: rows of carved curls over crown, back, sides + forehead fringe --- */
(function buildHair() {
  const curlGeos = [];
  const dTheta = 0.19, dPhi = 0.35;
  const NT = 11, NP = 18;
  for (let ti = 0; ti < NT; ti++) {
    const theta = 0.12 + ti * dTheta;      // 0 = crown
    const sinT = Math.sin(theta);
    const cosT = Math.cos(theta);
    for (let pi = 0; pi < NP; pi++) {
      const phi = pi * dPhi;
      const nx = sinT * Math.cos(phi);
      const ny = cosT;
      const nz = sinT * Math.sin(phi);

      // leave the face open (front & below the forehead)
      if (nz > 0.28 && ny < 0.34) continue;
      // don't drape below the head onto the neck
      if (ny < -0.5) continue;

      const rr = 1.03;
      const px = HEAD.x + headSX * headR * nx * rr;
      const py = HEAD.y + headSY * headR * ny * rr;
      const pz = HEAD.z + headSZ * headR * nz * rr;

      const cr = Math.max(0.035, 0.058 + 0.02 * Math.sin(ti * 1.7 + pi * 0.9));
      const g = new THREE.SphereGeometry(cr, 12, 10);
      g.translate(px, py, pz);
      curlGeos.push(g);
    }
  }
  if (curlGeos.length) {
    const merged = mergeGeometries(curlGeos, false);
    if (merged) {
      merged.computeVertexNormals();
      const hair = new THREE.Mesh(merged, marble);
      hair.castShadow = true;
      hair.receiveShadow = true;
      bust.add(hair);
    }
  }
})();

/* ------------------------------------------------ Ground (receives shadow) */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.4 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.001;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ Resize */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ------------------------------------------------------------------ Render */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
