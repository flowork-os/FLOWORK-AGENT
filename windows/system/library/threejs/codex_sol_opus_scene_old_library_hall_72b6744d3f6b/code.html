<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Old Library Hall</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090806;
    }
    canvas { display: block; }
    #title {
      position: fixed;
      left: 28px;
      bottom: 24px;
      color: rgba(232, 218, 185, 0.72);
      font: 12px Georgia, serif;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 2px 8px #000;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="title">The Astronomer's Library</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x100d09);
    scene.fog = new THREE.FogExp2(0x17130e, 0.018);

    const camera = new THREE.PerspectiveCamera(
      48,
      innerWidth / innerHeight,
      0.1,
      180
    );
    camera.position.set(22, 13, 28);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 6.8, -3);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.22;
    controls.minDistance = 17;
    controls.maxDistance = 48;
    controls.maxPolarAngle = Math.PI * 0.49;

    let seed = 673421;
    function random() {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }

    function rand(a, b) {
      return a + (b - a) * random();
    }

    function choose(array) {
      return array[Math.floor(random() * array.length)];
    }

    function canvasTexture(draw, width = 512, height = 512) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d');
      draw(context, width, height);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    const woodTexture = canvasTexture((ctx, w, h) => {
      ctx.fillStyle = '#402718';
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 85; i++) {
        const y = random() * h;
        ctx.strokeStyle = `rgba(22,10,4,${rand(0.08, 0.24)})`;
        ctx.lineWidth = rand(1, 6);
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x <= w; x += 20) {
          ctx.lineTo(x, y + Math.sin(x * 0.025 + i) * rand(1, 7));
        }
        ctx.stroke();
      }
      for (let i = 0; i < 18; i++) {
        const x = random() * w;
        const y = random() * h;
        ctx.strokeStyle = 'rgba(120,76,42,0.18)';
        ctx.beginPath();
        ctx.ellipse(x, y, rand(10, 38), rand(3, 10), 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    });
    woodTexture.wrapS = woodTexture.wrapT = THREE.RepeatWrapping;
    woodTexture.repeat.set(4, 2);

    const floorTexture = canvasTexture((ctx, w, h) => {
      ctx.fillStyle = '#2c2119';
      ctx.fillRect(0, 0, w, h);
      const size = 64;
      for (let y = 0; y < h; y += size) {
        for (let x = 0; x < w; x += size) {
          const alternate = ((x + y) / size) % 2;
          ctx.fillStyle = alternate ? '#36271c' : '#2a1d16';
          ctx.fillRect(x + 2, y + 2, size - 4, size - 4);
          ctx.strokeStyle = 'rgba(9,5,3,0.42)';
          ctx.strokeRect(x, y, size, size);
        }
      }
      for (let i = 0; i < 1200; i++) {
        ctx.fillStyle = `rgba(210,175,120,${rand(0.008, 0.04)})`;
        ctx.fillRect(random() * w, random() * h, 1, 1);
      }
    });
    floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
    floorTexture.repeat.set(8, 12);

    const plasterTexture = canvasTexture((ctx, w, h) => {
      ctx.fillStyle = '#746754';
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 6000; i++) {
        const v = Math.floor(rand(35, 110));
        ctx.fillStyle = `rgba(${v},${v - 8},${v - 18},${rand(0.01, 0.05)})`;
        ctx.fillRect(random() * w, random() * h, rand(1, 5), rand(1, 5));
      }
    });
    plasterTexture.wrapS = plasterTexture.wrapT = THREE.RepeatWrapping;
    plasterTexture.repeat.set(5, 2);

    const rugTexture = canvasTexture((ctx, w, h) => {
      ctx.fillStyle = '#321415';
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = '#a17c45';
      ctx.lineWidth = 16;
      ctx.strokeRect(24, 24, w - 48, h - 48);
      ctx.strokeStyle = '#5d3425';
      ctx.lineWidth = 9;
      ctx.strokeRect(48, 48, w - 96, h - 96);
      for (let i = 0; i < 12; i++) {
        const x = 76 + i * 32;
        ctx.save();
        ctx.translate(x, h / 2);
        ctx.rotate(Math.PI / 4);
        ctx.strokeStyle = i % 2 ? '#8b6539' : '#29392f';
        ctx.lineWidth = 5;
        ctx.strokeRect(-18, -18, 36, 36);
        ctx.restore();
      }
      ctx.strokeStyle = 'rgba(208,169,99,0.35)';
      ctx.lineWidth = 2;
      for (let y = 82; y < h - 80; y += 28) {
        ctx.beginPath();
        ctx.moveTo(68, y);
        ctx.lineTo(w - 68, y);
        ctx.stroke();
      }
    });

    const MAT = {
      darkWood: new THREE.MeshStandardMaterial({
        color: 0x3a2114,
        map: woodTexture,
        roughness: 0.72
      }),
      wood: new THREE.MeshStandardMaterial({
        color: 0x603b22,
        map: woodTexture,
        roughness: 0.62
      }),
      brass: new THREE.MeshStandardMaterial({
        color: 0x9b7130,
        metalness: 0.82,
        roughness: 0.28
      }),
      oldBrass: new THREE.MeshStandardMaterial({
        color: 0x675123,
        metalness: 0.72,
        roughness: 0.42
      }),
      iron: new THREE.MeshStandardMaterial({
        color: 0x171715,
        metalness: 0.72,
        roughness: 0.52
      }),
      plaster: new THREE.MeshStandardMaterial({
        color: 0x6e6252,
        map: plasterTexture,
        roughness: 0.95
      }),
      stone: new THREE.MeshStandardMaterial({
        color: 0x554d42,
        roughness: 0.92
      }),
      greenGlass: new THREE.MeshPhysicalMaterial({
        color: 0x17523a,
        emissive: 0x0a2a18,
        emissiveIntensity: 0.35,
        transmission: 0.1,
        transparent: true,
        opacity: 0.91,
        roughness: 0.25,
        side: THREE.DoubleSide
      }),
      page: new THREE.MeshStandardMaterial({
        color: 0xcdbf99,
        roughness: 0.9,
        side: THREE.DoubleSide
      }),
      leather: new THREE.MeshStandardMaterial({
        color: 0x40221b,
        roughness: 0.78
      })
    };

    function mesh(geometry, material, parent = scene) {
      const object = new THREE.Mesh(geometry, material);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function box(w, h, d, material, x, y, z, parent = scene) {
      const object = mesh(new THREE.BoxGeometry(w, h, d), material, parent);
      object.position.set(x, y, z);
      return object;
    }

    function cylinder(rt, rb, h, segments, material, x, y, z, parent = scene) {
      const object = mesh(
        new THREE.CylinderGeometry(rt, rb, h, segments),
        material,
        parent
      );
      object.position.set(x, y, z);
      return object;
    }

    const architecture = new THREE.Group();
    scene.add(architecture);

    const floor = mesh(
      new THREE.PlaneGeometry(38, 55),
      new THREE.MeshStandardMaterial({
        color: 0x504033,
        map: floorTexture,
        roughness: 0.85
      }),
      architecture
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, 0, -5);

    box(38, 18, 0.65, MAT.plaster, 0, 9, -28, architecture);
    box(0.65, 18, 55, MAT.plaster, -19, 9, -5, architecture);
    box(0.65, 18, 55, MAT.plaster, 19, 9, -5, architecture);

    for (let x = -15; x <= 15; x += 6) {
      box(0.45, 18, 0.8, MAT.stone, x, 9, -27.55, architecture);
      cylinder(0.36, 0.45, 1.2, 12, MAT.stone, x, 0.6, -27.1, architecture);
      cylinder(0.48, 0.36, 1.0, 12, MAT.stone, x, 17.5, -27.1, architecture);
    }

    const ceiling = mesh(
      new THREE.PlaneGeometry(38, 55),
      new THREE.MeshStandardMaterial({
        color: 0x30291f,
        roughness: 0.9,
        side: THREE.DoubleSide
      }),
      architecture
    );
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.set(0, 18, -5);

    for (let z = -26; z <= 19; z += 7.5) {
      box(38, 0.7, 0.8, MAT.darkWood, 0, 17.45, z, architecture);
    }

    const rug = mesh(
      new THREE.PlaneGeometry(9.5, 32),
      new THREE.MeshStandardMaterial({
        map: rugTexture,
        color: 0x8e7060,
        roughness: 0.92
      }),
      architecture
    );
    rug.rotation.x = -Math.PI / 2;
    rug.position.set(0, 0.025, -4);

    function createArchedWindow(x, z, rotationY) {
      const group = new THREE.Group();
      group.position.set(x, 8.4, z);
      group.rotation.y = rotationY;
      architecture.add(group);

      box(0.48, 8, 5.1, MAT.stone, 0, -0.4, 0, group);

      const glassMat = new THREE.MeshPhysicalMaterial({
        color: 0x9da89c,
        emissive: 0xa88355,
        emissiveIntensity: 0.32,
        transmission: 0.42,
        transparent: true,
        opacity: 0.55,
        roughness: 0.22
      });

      box(0.5, 5.8, 3.8, glassMat, -0.28, -1.1, 0, group);

      const archShape = new THREE.Shape();
      archShape.moveTo(-1.9, 0);
      archShape.lineTo(-1.9, 1.2);
      archShape.absarc(0, 1.2, 1.9, Math.PI, 0, true);
      archShape.lineTo(1.9, 0);
      archShape.closePath();

      const arch = mesh(
        new THREE.ExtrudeGeometry(archShape, {
          depth: 0.18,
          bevelEnabled: false
        }),
        glassMat,
        group
      );
      arch.rotation.y = Math.PI / 2;
      arch.position.set(-0.38, 1.8, 0);

      for (const y of [-2.7, -0.7, 1.3]) {
        box(0.58, 0.12, 4.2, MAT.iron, -0.48, y, 0, group);
      }
      for (const zz of [-1.35, 0, 1.35]) {
        box(0.58, 7.2, 0.1, MAT.iron, -0.49, -0.2, zz, group);
      }

      const sill = box(1.0, 0.35, 5.2, MAT.stone, -0.05, -4.25, 0, group);
      sill.castShadow = true;
    }

    for (const z of [-19, -9, 1, 11]) {
      createArchedWindow(-18.65, z, 0);
    }

    function createBookshelf(x, z, rotationY = 0, width = 5.4) {
      const shelf = new THREE.Group();
      shelf.position.set(x, 0, z);
      shelf.rotation.y = rotationY;
      scene.add(shelf);

      box(width, 0.55, 1.25, MAT.darkWood, 0, 0.45, 0, shelf);
      box(width, 0.45, 1.42, MAT.darkWood, 0, 14.2, 0, shelf);
      box(0.48, 13.7, 1.25, MAT.darkWood, -width / 2, 7.25, 0, shelf);
      box(0.48, 13.7, 1.25, MAT.darkWood, width / 2, 7.25, 0, shelf);
      box(width - 0.5, 13.3, 0.22, MAT.wood, 0, 7.25, 0.5, shelf);

      for (let level = 0; level < 6; level++) {
        const y = 1.1 + level * 2.18;
        box(width - 0.32, 0.25, 1.42, MAT.darkWood, 0, y, -0.02, shelf);

        let cursor = -width / 2 + 0.42;
        while (cursor < width / 2 - 0.45) {
          const bw = rand(0.16, 0.36);
          const bh = rand(1.25, 1.86);
          const colors = [
            0x572b25, 0x24372f, 0x564426, 0x392643,
            0x6a3b23, 0x253444, 0x4a2421, 0x65552f
          ];
          const bookMat = new THREE.MeshStandardMaterial({
            color: choose(colors),
            roughness: 0.82
          });
          const book = box(
            bw,
            bh,
            rand(0.72, 1.0),
            bookMat,
            cursor + bw / 2,
            y + 0.16 + bh / 2,
            -0.16 + rand(-0.04, 0.04),
            shelf
          );
          book.rotation.z = random() < 0.12 ? rand(-0.12, 0.12) : 0;

          if (random() < 0.22) {
            box(
              Math.max(0.025, bw * 0.09),
              bh * 0.88,
              0.025,
              MAT.brass,
              cursor + bw / 2,
              y + 0.16 + bh / 2,
              -0.68,
              shelf
            );
          }
          cursor += bw + rand(0.015, 0.055);
        }
      }

      box(width + 0.38, 0.2, 1.55, MAT.brass, 0, 12.85, -0.2, shelf);
      return shelf;
    }

    for (const z of [-23.4, -17.4, -11.4, -5.4, 0.6, 6.6, 12.6, 18.6]) {
      createBookshelf(17.95, z, Math.PI / 2, 5.25);
    }

    for (const z of [-23.4, -17.4, -11.4, -5.4, 0.6, 6.6, 12.6, 18.6]) {
      if (z !== -5.4 && z !== 6.6) {
        createBookshelf(-17.95, z, -Math.PI / 2, 5.25);
      }
    }

    for (const x of [-14.8, -8.8, -2.8, 3.2, 9.2, 15.2]) {
      createBookshelf(x, -27.25, 0, 5.4);
    }

    function createLadder(x, z, rotationY = 0, lean = -0.12) {
      const ladder = new THREE.Group();
      ladder.position.set(x, 0.5, z);
      ladder.rotation.y = rotationY;
      ladder.rotation.z = lean;
      scene.add(ladder);

      const railMat = MAT.oldBrass;
      const left = cylinder(0.085, 0.085, 11.5, 10, railMat, -0.72, 5.7, 0, ladder);
      const right = cylinder(0.085, 0.085, 11.5, 10, railMat, 0.72, 5.7, 0, ladder);
      left.rotation.z = 0;
      right.rotation.z = 0;

      for (let y = 0.65; y < 11; y += 0.78) {
        const rung = cylinder(0.06, 0.06, 1.45, 8, railMat, 0, y, 0, ladder);
        rung.rotation.z = Math.PI / 2;
      }

      for (const xx of [-0.72, 0.72]) {
        const wheel = mesh(
          new THREE.TorusGeometry(0.18, 0.05, 8, 16),
          MAT.brass,
          ladder
        );
        wheel.position.set(xx, 11.45, 0);
        wheel.rotation.y = Math.PI / 2;
      }
    }

    createLadder(16.4, -8, 0, -0.1);
    createLadder(16.35, 9.5, 0, 0.08);
    createLadder(-7, -25.65, Math.PI / 2, -0.08);

    function createDesk(z) {
      const desk = new THREE.Group();
      desk.position.set(0, 0, z);
      scene.add(desk);

      box(9.3, 0.52, 3.2, MAT.wood, 0, 3.25, 0, desk);
      box(8.8, 0.18, 2.72, MAT.leather, 0, 3.56, 0, desk);

      for (const x of [-4.05, 4.05]) {
        for (const zz of [-1.15, 1.15]) {
          const leg = cylinder(
            0.18,
            0.26,
            3.0,
            12,
            MAT.darkWood,
            x,
            1.55,
            zz,
            desk
          );
          cylinder(0.31, 0.18, 0.22, 12, MAT.darkWood, x, 0.15, zz, desk);
        }
      }

      box(8.2, 0.2, 0.2, MAT.darkWood, 0, 1.25, 1.15, desk);

      createLamp(-2.8, 3.6, 0, desk);
      createLamp(2.8, 3.6, 0, desk);

      if (random() > 0.3) {
        createBookPile(rand(-1.2, 1.2), 3.68, rand(-0.9, 0.9), desk, 3);
      }
      return desk;
    }

    const lampLights = [];

    function createLamp(x, y, z, parent) {
      const lamp = new THREE.Group();
      lamp.position.set(x, y, z);
      parent.add(lamp);

      cylinder(0.48, 0.58, 0.12, 24, MAT.brass, 0, 0.06, 0, lamp);
      cylinder(0.07, 0.1, 1.15, 12, MAT.brass, 0, 0.66, 0, lamp);

      const shade = mesh(
        new THREE.CylinderGeometry(0.7, 0.42, 0.55, 24, 1, true),
        MAT.greenGlass,
        lamp
      );
      shade.position.y = 1.3;

      cylinder(0.13, 0.13, 0.08, 16, MAT.brass, 0, 1.62, 0, lamp);

      const glow = new THREE.PointLight(0x9ecf79, 2.0, 5.2, 2);
      glow.position.set(0, 1.12, 0);
      glow.castShadow = false;
      lamp.add(glow);
      lampLights.push({
        light: glow,
        material: shade.material,
        phase: rand(0, Math.PI * 2)
      });
    }

    createDesk(-13);
    createDesk(-4);
    createDesk(5);
    createDesk(14);

    function createChair(x, z, rotationY = 0) {
      const chair = new THREE.Group();
      chair.position.set(x, 0, z);
      chair.rotation.y = rotationY;
      scene.add(chair);

      box(2.0, 0.28, 1.9, MAT.darkWood, 0, 1.65, 0, chair);
      box(1.72, 0.18, 1.62, MAT.leather, 0, 1.84, 0, chair);

      for (const xx of [-0.75, 0.75]) {
        for (const zz of [-0.68, 0.68]) {
          cylinder(0.1, 0.14, 1.62, 10, MAT.darkWood, xx, 0.82, zz, chair);
        }
      }

      box(1.95, 2.2, 0.25, MAT.darkWood, 0, 2.85, 0.75, chair);
      box(1.56, 1.52, 0.16, MAT.leather, 0, 2.9, 0.59, chair);
    }

    for (const z of [-13, -4, 5, 14]) {
      createChair(-5.8, z, Math.PI / 2);
      createChair(5.8, z, -Math.PI / 2);
    }

    function createBookPile(x, y, z, parent = scene, count = 4) {
      const pile = new THREE.Group();
      pile.position.set(x, y, z);
      parent.add(pile);

      let currentY = 0;
      for (let i = 0; i < count; i++) {
        const width = rand(1.0, 1.7);
        const depth = rand(0.75, 1.15);
        const height = rand(0.13, 0.26);
        const color = choose([
          0x4d241f, 0x263c35, 0x624624,
          0x29384b, 0x4b3045, 0x6c3523
        ]);
        const cover = new THREE.MeshStandardMaterial({
          color,
          roughness: 0.82
        });
        const book = new THREE.Group();
        book.rotation.y = rand(-0.18, 0.18);
        book.position.y = currentY;
        pile.add(book);

        box(width, height, depth, cover, 0, height / 2, 0, book);
        box(
          width - 0.08,
          height * 0.58,
          depth + 0.018,
          MAT.page,
          0.03,
          height / 2,
          0,
          book
        );
        box(0.08, height + 0.035, depth + 0.06, cover, -width / 2, height / 2, 0, book);
        currentY += height + 0.03;
      }
      return pile;
    }

    createBookPile(-9.5, 0.03, -2.5, scene, 6);
    createBookPile(10.6, 0.03, 7.8, scene, 5);
    createBookPile(-11.4, 0.03, 15.3, scene, 7);

    function createOpenAtlas() {
      const atlas = new THREE.Group();
      atlas.position.set(0, 3.77, -4);
      atlas.rotation.y = -0.18;
      scene.add(atlas);

      const mapTexture = canvasTexture((ctx, w, h) => {
        ctx.fillStyle = '#d5c69d';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = '#987951';
        ctx.lineWidth = 4;
        ctx.strokeRect(12, 12, w - 24, h - 24);
        ctx.fillStyle = '#7c8b68';
        for (let i = 0; i < 23; i++) {
          ctx.beginPath();
          const cx = rand(30, w - 30);
          const cy = rand(30, h - 30);
          ctx.ellipse(cx, cy, rand(10, 45), rand(7, 28), rand(0, 3), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.strokeStyle = 'rgba(75,72,50,0.45)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 12; i++) {
          ctx.beginPath();
          ctx.moveTo(0, i * h / 12);
          ctx.bezierCurveTo(w * .3, i * 36 + 15, w * .7, i * 35 - 12, w, i * h / 12);
          ctx.stroke();
        }
      }, 512, 256);

      const atlasPage = new THREE.MeshStandardMaterial({
        map: mapTexture,
        roughness: 0.88,
        side: THREE.DoubleSide
      });

      const leftShape = new THREE.Shape();
      leftShape.moveTo(-2.4, -1.4);
      leftShape.quadraticCurveTo(-1.2, -1.55, 0, -1.3);
      leftShape.lineTo(0, 1.3);
      leftShape.quadraticCurveTo(-1.2, 1.55, -2.4, 1.35);
      leftShape.closePath();

      const leftPage = mesh(new THREE.ShapeGeometry(leftShape, 18), atlasPage, atlas);
      leftPage.rotation.x = -Math.PI / 2;
      leftPage.rotation.y = 0.08;
      leftPage.position.x = -0.02;

      const rightPage = leftPage.clone();
      rightPage.scale.x = -1;
      rightPage.position.x = 0.02;
      rightPage.rotation.y = -0.08;
      atlas.add(rightPage);

      box(4.95, 0.09, 2.95, MAT.leather, 0, -0.09, 0, atlas);
    }

    createOpenAtlas();

    const mezzanine = new THREE.Group();
    scene.add(mezzanine);

    box(37, 0.55, 3.2, MAT.darkWood, 0, 10.0, -25.1, mezzanine);
    box(3.0, 0.55, 48, MAT.darkWood, 17.1, 10.0, -3.5, mezzanine);
    box(3.0, 0.55, 48, MAT.darkWood, -17.1, 10.0, -3.5, mezzanine);

    function railingLine(start, end, alongX) {
      const length = alongX ? Math.abs(end - start) : Math.abs(end - start);
      const count = Math.floor(length / 1.4);
      for (let i = 0; i <= count; i++) {
        const t = i / count;
        const p = THREE.MathUtils.lerp(start, end, t);
        if (alongX) {
          cylinder(0.055, 0.065, 1.65, 8, MAT.brass, p, 10.95, -23.55, mezzanine);
        } else {
          cylinder(0.055, 0.065, 1.65, 8, MAT.brass, 15.55, 10.95, p, mezzanine);
          cylinder(0.055, 0.065, 1.65, 8, MAT.brass, -15.55, 10.95, p, mezzanine);
        }
      }
      if (alongX) {
        const rail = cylinder(0.08, 0.08, Math.abs(end - start), 10, MAT.brass, 0, 11.78, -23.55, mezzanine);
        rail.rotation.z = Math.PI / 2;
      } else {
        for (const x of [-15.55, 15.55]) {
          const rail = cylinder(0.08, 0.08, Math.abs(end - start), 10, MAT.brass, x, 11.78, (start + end) / 2, mezzanine);
          rail.rotation.x = Math.PI / 2;
        }
      }
    }

    railingLine(-15.6, 15.6, true);
    railingLine(-22.8, 20, false);

    const spiral = new THREE.Group();
    spiral.position.set(13.4, 0, 16.2);
    scene.add(spiral);

    cylinder(0.14, 0.18, 11.7, 12, MAT.iron, 0, 5.85, 0, spiral);

    const stepCount = 30;
    for (let i = 0; i < stepCount; i++) {
      const angle = i * 0.42;
      const y = 0.35 + i * 0.34;
      const step = box(2.45, 0.16, 0.62, MAT.darkWood, 1.15, y, 0, spiral);
      step.rotation.y = -angle;
      step.position.x = Math.cos(angle) * 1.15;
      step.position.z = Math.sin(angle) * 1.15;

      const postAngle = angle + 0.15;
      cylinder(
        0.045,
        0.055,
        1.05,
        8,
        MAT.brass,
        Math.cos(postAngle) * 2.25,
        y + 0.55,
        Math.sin(postAngle) * 2.25,
        spiral
      );
    }

    const handrailCurve = new THREE.CatmullRomCurve3(
      Array.from({ length: 90 }, (_, i) => {
        const t = i / 89;
        const angle = t * (stepCount - 1) * 0.42 + 0.15;
        return new THREE.Vector3(
          Math.cos(angle) * 2.25,
          1.25 + t * 9.86,
          Math.sin(angle) * 2.25
        );
      })
    );
    mesh(
      new THREE.TubeGeometry(handrailCurve, 180, 0.075, 8, false),
      MAT.brass,
      spiral
    );

    function createGlobe() {
      const globe = new THREE.Group();
      globe.position.set(-11.7, 3.25, 10.5);
      scene.add(globe);

      cylinder(0.65, 0.92, 0.3, 24, MAT.darkWood, 0, -3.05, 0, globe);
      cylinder(0.18, 0.3, 2.6, 16, MAT.wood, 0, -1.65, 0, globe);
      cylinder(0.42, 0.55, 0.18, 20, MAT.brass, 0, -0.36, 0, globe);

      const globeTexture = canvasTexture((ctx, w, h) => {
        const gradient = ctx.createLinearGradient(0, 0, 0, h);
        gradient.addColorStop(0, '#304a4b');
        gradient.addColorStop(0.5, '#47625b');
        gradient.addColorStop(1, '#263d43');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = '#a89562';
        for (let i = 0; i < 38; i++) {
          const x = random() * w;
          const y = random() * h;
          ctx.beginPath();
          ctx.ellipse(x, y, rand(8, 38), rand(5, 22), rand(0, 3), 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.strokeStyle = 'rgba(35,39,34,0.42)';
        ctx.lineWidth = 1;
        for (let i = 1; i < 12; i++) {
          ctx.beginPath();
          ctx.moveTo(0, i * h / 12);
          ctx.lineTo(w, i * h / 12);
          ctx.stroke();
        }
        for (let i = 1; i < 24; i++) {
          ctx.beginPath();
          ctx.moveTo(i * w / 24, 0);
          ctx.lineTo(i * w / 24, h);
          ctx.stroke();
        }
      }, 768, 384);

      const sphere = mesh(
        new THREE.SphereGeometry(2.22, 48, 32),
        new THREE.MeshStandardMaterial({
          map: globeTexture,
          roughness: 0.65,
          metalness: 0.05
        }),
        globe
      );
      sphere.rotation.z = -0.22;

      const ring = mesh(
        new THREE.TorusGeometry(2.48, 0.085, 12, 72),
        MAT.brass,
        globe
      );
      ring.rotation.y = Math.PI / 2;
      ring.rotation.x = -0.22;

      globe.userData.sphere = sphere;
      return globe;
    }

    const globe = createGlobe();

    const chandelier = new THREE.Group();
    chandelier.position.set(0, 14.7, -6);
    scene.add(chandelier);

    cylinder(0.08, 0.08, 3.0, 10, MAT.iron, 0, 1.5, 0, chandelier);
    const chandelierRing = mesh(
      new THREE.TorusGeometry(2.6, 0.11, 10, 48),
      MAT.oldBrass,
      chandelier
    );
    chandelierRing.rotation.x = Math.PI / 2;

    const chandelierLights = [];
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * Math.PI * 2;
      const x = Math.cos(a) * 2.6;
      const z = Math.sin(a) * 2.6;
      cylinder(0.1, 0.14, 0.65, 10, MAT.brass, x, -0.15, z, chandelier);

      const flameMat = new THREE.MeshBasicMaterial({ color: 0xffc56c });
      const flame = mesh(
        new THREE.SphereGeometry(0.09, 10, 8),
        flameMat,
        chandelier
      );
      flame.scale.y = 2.1;
      flame.position.set(x, 0.25, z);

      const light = new THREE.PointLight(0xffad63, 1.15, 9, 2);
      light.position.set(x, 0.1, z);
      chandelier.add(light);
      chandelierLights.push({ light, flame, phase: rand(0, 6.28) });
    }

    const ambient = new THREE.HemisphereLight(0x394458, 0x24150c, 0.9);
    scene.add(ambient);

    const evening = new THREE.DirectionalLight(0xffc27a, 4.2);
    evening.position.set(-23, 15, 11);
    evening.target.position.set(4, 1, -6);
    evening.castShadow = true;
    evening.shadow.mapSize.set(2048, 2048);
    evening.shadow.camera.left = -24;
    evening.shadow.camera.right = 24;
    evening.shadow.camera.top = 22;
    evening.shadow.camera.bottom = -12;
    evening.shadow.camera.near = 2;
    evening.shadow.camera.far = 70;
    evening.shadow.bias = -0.00035;
    scene.add(evening, evening.target);

    const warmFill = new THREE.PointLight(0xc17c46, 38, 26, 2);
    warmFill.position.set(0, 9, -20);
    warmFill.castShadow = true;
    warmFill.shadow.mapSize.set(1024, 1024);
    scene.add(warmFill);

    const blueFill = new THREE.DirectionalLight(0x60728f, 0.75);
    blueFill.position.set(12, 17, 8);
    scene.add(blueFill);

    const rayMaterial = new THREE.MeshBasicMaterial({
      color: 0xffc987,
      transparent: true,
      opacity: 0.055,
      depthWrite: false,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending
    });

    const lightRays = [];
    for (let i = 0; i < 4; i++) {
      const ray = mesh(
        new THREE.CylinderGeometry(1.4, 4.3, 22, 6, 1, true),
        rayMaterial.clone()
      );
      ray.position.set(-12.5, 7.2, -18 + i * 10);
      ray.rotation.z = -Math.PI * 0.39;
      ray.rotation.y = 0.08;
      ray.castShadow = false;
      ray.receiveShadow = false;
      ray.userData.phase = rand(0, Math.PI * 2);
      lightRays.push(ray);
    }

    const dustCount = 1800;
    const dustPositions = new Float32Array(dustCount * 3);
    const dustPhases = new Float32Array(dustCount);
    for (let i = 0; i < dustCount; i++) {
      dustPositions[i * 3] = rand(-18, 18);
      dustPositions[i * 3 + 1] = rand(0.4, 17.2);
      dustPositions[i * 3 + 2] = rand(-27, 21);
      dustPhases[i] = rand(0, Math.PI * 2);
    }

    const dustGeometry = new THREE.BufferGeometry();
    dustGeometry.setAttribute(
      'position',
      new THREE.BufferAttribute(dustPositions, 3)
    );

    const dustMaterial = new THREE.PointsMaterial({
      color: 0xffd7a0,
      size: 0.035,
      transparent: true,
      opacity: 0.52,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const dust = new THREE.Points(dustGeometry, dustMaterial);
    scene.add(dust);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      globe.userData.sphere.rotation.y = elapsed * 0.075;

      chandelier.rotation.y = Math.sin(elapsed * 0.22) * 0.035;

      for (const item of lampLights) {
        item.light.intensity =
          1.85 + Math.sin(elapsed * 2.2 + item.phase) * 0.08;
      }

      for (const item of chandelierLights) {
        const flicker =
          1 + Math.sin(elapsed * 7.2 + item.phase) * 0.08 +
          Math.sin(elapsed * 13.7 + item.phase) * 0.035;
        item.light.intensity = 1.15 * flicker;
        item.flame.scale.y = 2.1 * flicker;
      }

      for (const ray of lightRays) {
        ray.material.opacity =
          0.045 + Math.sin(elapsed * 0.35 + ray.userData.phase) * 0.012;
      }

      const positions = dustGeometry.attributes.position.array;
      for (let i = 0; i < dustCount; i++) {
        positions[i * 3] +=
          Math.sin(elapsed * 0.12 + dustPhases[i]) * 0.00045;
        positions[i * 3 + 1] +=
          0.0018 + Math.sin(elapsed * 0.28 + dustPhases[i]) * 0.0005;
        positions[i * 3 + 2] +=
          Math.cos(elapsed * 0.1 + dustPhases[i]) * 0.00035;

        if (positions[i * 3 + 1] > 17.4) {
          positions[i * 3 + 1] = 0.35;
        }
      }
      dustGeometry.attributes.position.needsUpdate = true;

      controls.update();
      renderer.render(scene, camera);
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
