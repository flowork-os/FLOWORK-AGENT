<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papercraft Lotus</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #f4e6ed;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4e6ed);
scene.fog = new THREE.Fog(0xf4e6ed, 13, 25);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 40);
camera.position.set(0, 6.4, 10.8);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 6.5;
controls.maxDistance = 17;
controls.target.set(0, 0, 1.15);
controls.update();

const hemiLight = new THREE.HemisphereLight(0xfff4f8, 0x75596b, 2.25);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(0xffdce8, 4.2);
keyLight.position.set(-5.5, 4.5, 9);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 2048;
keyLight.shadow.mapSize.height = 2048;
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -7;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 22;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xcdb8ff, 1.3);
fillLight.position.set(6, -3, 5);
scene.add(fillLight);

const warmLight = new THREE.PointLight(0xffb7bb, 1.1, 10, 2);
warmLight.position.set(0, 0.8, 4);
scene.add(warmLight);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xd9c2d0,
  roughness: 0.94,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 96), floorMaterial);
floor.position.z = -0.12;
floor.receiveShadow = true;
scene.add(floor);

function petalPoint(petal, t, across, lift = 0) {
  const sine = Math.pow(Math.sin(Math.PI * t), 0.62);
  const width = petal.maxWidth * (0.035 + 0.965 * sine) * (1 - 0.18 * t);
  const edge = Math.abs(across);
  const tipProgress = Math.max(0, (t - 0.7) / 0.3);
  const centerHeight =
    petal.baseZ +
    petal.arch * Math.sin(Math.PI * 0.92 * t) +
    petal.curl * Math.pow(tipProgress, 2);
  const foldedHeight = petal.cup * (1 - edge * edge);
  return new THREE.Vector3(
    width * across,
    petal.innerRadius + petal.length * t,
    centerHeight + foldedHeight + lift
  );
}

function makePetalGeometry(petal) {
  const rows = 11;
  const columns = 8;
  const positions = [];
  const colors = [];
  const indices = [];
  const baseColor = new THREE.Color(petal.baseColor);
  const tipColor = new THREE.Color(0xfff8f1);

  for (let row = 0; row <= rows; row++) {
    const t = row / rows;
    for (let column = 0; column <= columns; column++) {
      const across = column / columns * 2 - 1;
      const point = petalPoint(petal, t, across);
      positions.push(point.x, point.y, point.z);

      const blend = Math.min(1, Math.pow(t, 0.78) * 0.9 + (1 - Math.abs(across)) * 0.1);
      const color = new THREE.Color().lerpColors(baseColor, tipColor, blend);
      colors.push(color.r, color.g, color.b);
    }
  }

  for (let row = 0; row < rows; row++) {
    for (let column = 0; column < columns; column++) {
      const a = row * (columns + 1) + column;
      const b = a + 1;
      const c = a + columns + 1;
      const d = c + 1;
      indices.push(a, b, c, b, d, c);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function makeTabGeometry(petal) {
  const halfWidth = petal.maxWidth * 0.22;
  const positions = [
    -halfWidth, petal.innerRadius - 0.055, petal.baseZ + 0.055,
     halfWidth, petal.innerRadius - 0.055, petal.baseZ + 0.055,
     0,         petal.innerRadius + 0.2,   petal.baseZ + 0.085
  ];
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex([0, 1, 2]);
  geometry.computeVertexNormals();
  return geometry;
}

function addLongitudinalLine(group, petal, across, tStart, tEnd, material) {
  const points = [];
  const count = 9;
  for (let i = 0; i <= count; i++) {
    const t = tStart + (tEnd - tStart) * i / count;
    points.push(petalPoint(petal, t, across, 0.026));
  }
  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  group.add(new THREE.Line(geometry, material));
}

function addCrossLine(group, petal, t, material) {
  const points = [];
  const count = 9;
  for (let i = 0; i <= count; i++) {
    const across = -0.86 + 1.72 * i / count;
    points.push(petalPoint(petal, t, across, 0.028));
  }
  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  group.add(new THREE.Line(geometry, material));
}

const petalMaterialCache = new Map();
const scoreMaterial = new THREE.LineBasicMaterial({
  color: 0xa94f75,
  transparent: true,
  opacity: 0.52,
  depthWrite: false
});
const edgeMaterial = new THREE.LineBasicMaterial({
  color: 0x984265,
  transparent: true,
  opacity: 0.72,
  depthWrite: false
});
const tabMaterial = new THREE.MeshStandardMaterial({
  color: 0xffe4e3,
  roughness: 0.78,
  metalness: 0,
  side: THREE.DoubleSide
});
const glueMaterial = new THREE.MeshStandardMaterial({
  color: 0xf8b5c8,
  roughness: 0.7,
  metalness: 0,
  transparent: true,
  opacity: 0.8
});
const seamGeometry = new THREE.BoxGeometry(0.045, 0.38, 0.025);

function makePetalMaterial(colorValue) {
  if (!petalMaterialCache.has(colorValue)) {
    petalMaterialCache.set(colorValue, new THREE.MeshStandardMaterial({
      vertexColors: true,
      color: 0xffffff,
      roughness: 0.83,
      metalness: 0,
      side: THREE.DoubleSide
    }));
  }
  return petalMaterialCache.get(colorValue);
}

function addPetal(petal, angle) {
  const group = new THREE.Group();
  group.rotation.z = angle;

  const geometry = makePetalGeometry(petal);
  const mesh = new THREE.Mesh(geometry, makePetalMaterial(petal.baseColor));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  group.add(mesh);

  addLongitudinalLine(group, petal, 0, 0.08, 0.91, scoreMaterial);
  addLongitudinalLine(group, petal, -0.74, 0.13, 0.85, edgeMaterial);
  addLongitudinalLine(group, petal, 0.74, 0.13, 0.85, edgeMaterial);
  addCrossLine(group, petal, 0.37, scoreMaterial);
  addCrossLine(group, petal, 0.67, scoreMaterial);

  const tab = new THREE.Mesh(makeTabGeometry(petal), tabMaterial);
  tab.castShadow = true;
  group.add(tab);

  const seam = new THREE.Mesh(seamGeometry, glueMaterial);
  seam.position.set(petal.maxWidth * 0.58, petal.innerRadius + 0.16, petal.baseZ + 0.095);
  seam.rotation.z = -0.06;
  seam.castShadow = true;
  group.add(seam);

  scene.add(group);
}

const rings = [
  {
    count: 15,
    phase: 0.02,
    innerRadius: 0.18,
    length: 3.65,
    maxWidth: 0.86,
    baseZ: 0.23,
    arch: 0.1,
    curl: 0.34,
    cup: 0.15,
    baseColor: 0xd35d8d
  },
  {
    count: 13,
    phase: Math.PI / 13,
    innerRadius: 0.15,
    length: 3.08,
    maxWidth: 0.8,
    baseZ: 0.43,
    arch: 0.27,
    curl: 0.57,
    cup: 0.17,
    baseColor: 0xdc719e
  },
  {
    count: 11,
    phase: Math.PI / 11 + 0.13,
    innerRadius: 0.12,
    length: 2.57,
    maxWidth: 0.68,
    baseZ: 0.68,
    arch: 0.43,
    curl: 0.82,
    cup: 0.18,
    baseColor: 0xe488aa
  },
  {
    count: 9,
    phase: Math.PI / 9 + 0.28,
    innerRadius: 0.1,
    length: 2.08,
    maxWidth: 0.55,
    baseZ: 0.92,
    arch: 0.57,
    curl: 1.05,
    cup: 0.16,
    baseColor: 0xed9fba
  }
];

for (let ringIndex = 0; ringIndex < rings.length; ringIndex++) {
  const ring = rings[ringIndex];
  for (let petalIndex = 0; petalIndex < ring.count; petalIndex++) {
    const angle = ring.phase + petalIndex / ring.count * Math.PI * 2;
    addPetal(ring, angle);
  }
}

function addBeadedCenter() {
  const center = new THREE.Group();
  center.position.z = 1.38;

  const cardMaterial = new THREE.MeshStandardMaterial({
    color: 0xffeee4,
    roughness: 0.74,
    metalness: 0
  });
  const cardEdgeMaterial = new THREE.MeshStandardMaterial({
    color: 0xe9a9b7,
    roughness: 0.75,
    metalness: 0
  });
  const beadPinkMaterial = new THREE.MeshStandardMaterial({
    color: 0xd96591,
    roughness: 0.32,
    metalness: 0.05
  });
  const beadCreamMaterial = new THREE.MeshStandardMaterial({
    color: 0xffd7bf,
    roughness: 0.3,
    metalness: 0.03
  });
  const beadGoldMaterial = new THREE.MeshStandardMaterial({
    color: 0xe9a74d,
    roughness: 0.28,
    metalness: 0.18
  });

  const card = new THREE.Mesh(
    new THREE.CylinderGeometry(0.74, 0.68, 0.17, 48),
    cardEdgeMaterial
  );
  card.rotation.x = Math.PI / 2;
  card.castShadow = true;
  card.receiveShadow = true;
  center.add(card);

  const cardTop = new THREE.Mesh(
    new THREE.CylinderGeometry(0.66, 0.66, 0.035, 48),
    cardMaterial
  );
  cardTop.rotation.x = Math.PI / 2;
  cardTop.position.z = 0.1;
  cardTop.receiveShadow = true;
  center.add(cardTop);

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.49, 0.035, 10, 48),
    cardEdgeMaterial
  );
  ring.position.z = 0.15;
  ring.rotation.x = Math.PI / 2;
  ring.castShadow = true;
  center.add(ring);

  const beadGeometry = new THREE.SphereGeometry(0.105, 18, 12);
  for (let i = 0; i < 12; i++) {
    const angle = i / 12 * Math.PI * 2 + Math.PI / 12;
    const bead = new THREE.Mesh(
      beadGeometry,
      i % 3 === 0 ? beadCreamMaterial : beadPinkMaterial
    );
    bead.position.set(Math.cos(angle) * 0.39, Math.sin(angle) * 0.39, 0.21);
    bead.castShadow = true;
    center.add(bead);
  }

  const goldGeometry = new THREE.SphereGeometry(0.075, 16, 10);
  for (let i = 0; i < 8; i++) {
    const angle = i / 8 * Math.PI * 2;
    const bead = new THREE.Mesh(goldGeometry, beadGoldMaterial);
    bead.position.set(Math.cos(angle) * 0.22, Math.sin(angle) * 0.22, 0.25);
    bead.castShadow = true;
    center.add(bead);
  }

  const centralBead = new THREE.Mesh(
    new THREE.SphereGeometry(0.17, 24, 16),
    beadGoldMaterial
  );
  centralBead.position.z = 0.28;
  centralBead.castShadow = true;
  center.add(centralBead);

  const centralHighlight = new THREE.Mesh(
    new THREE.SphereGeometry(0.075, 16, 12),
    beadCreamMaterial
  );
  centralHighlight.position.set(-0.055, 0.08, 0.39);
  center.add(centralHighlight);

  scene.add(center);
}

addBeadedCenter();

const subtlePetalShadow = new THREE.Mesh(
  new THREE.CircleGeometry(3.15, 96),
  new THREE.MeshBasicMaterial({
    color: 0xb27f9c,
    transparent: true,
    opacity: 0.06,
    depthWrite: false
  })
);
subtlePetalShadow.position.z = -0.105;
scene.add(subtlePetalShadow);

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.addEventListener("resize", resize);

function animate() {
  controls.update();
  renderer.render(scene, camera);
}

renderer.setAnimationLoop(animate);
</script>
</body>
</html>
