<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plush Astronaut Doll</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #d9e6ee; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9e6ee);
scene.fog = new THREE.Fog(0xd9e6ee, 12, 24);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.2, 4.8, 11.5);
camera.lookAt(0, 2.8, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.75, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.enablePan = false;
controls.minDistance = 7;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.78;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;

scene.add(new THREE.HemisphereLight(0xf8fcff, 0x78869a, 2.0));

const keyLight = new THREE.DirectionalLight(0xfff4df, 4.2);
keyLight.position.set(5, 9, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 9;
keyLight.shadow.camera.bottom = -3;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 24;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xbfd9ff, 2.1);
fillLight.position.set(-6, 5, 4);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xf4d4ff, 1.8);
rimLight.position.set(3, 6, -7);
scene.add(rimLight);

function makeFabricTexture(base, fleck, size = 256) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, size, size);

  const image = ctx.getImageData(0, 0, size, size);
  const data = image.data;
  for (let i = 0; i < data.length; i += 4) {
    const n = (Math.random() - 0.5) * 18;
    data[i] = Math.max(0, Math.min(255, data[i] + n));
    data[i + 1] = Math.max(0, Math.min(255, data[i + 1] + n));
    data[i + 2] = Math.max(0, Math.min(255, data[i + 2] + n));
  }
  ctx.putImageData(image, 0, 0);

  ctx.globalAlpha = 0.23;
  ctx.strokeStyle = fleck;
  ctx.lineWidth = 1;
  for (let i = 0; i < 900; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const length = 1 + Math.random() * 4;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + Math.random() * 2, y - 1, x + length, y + Math.random() * 2);
    ctx.stroke();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(3, 3);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const whiteFabric = makeFabricTexture('#eeeae0', '#ffffff');
const blueFabric = makeFabricTexture('#244d72', '#7795ad');
const feltTexture = makeFabricTexture('#d36a4d', '#efaa89');
const soleTexture = makeFabricTexture('#bec8cf', '#eef3f5');

const whiteMat = new THREE.MeshStandardMaterial({
  color: 0xf2eee4,
  map: whiteFabric,
  roughness: 0.98,
  metalness: 0
});
const cuffMat = new THREE.MeshStandardMaterial({
  color: 0xc8d3d7,
  map: soleTexture,
  roughness: 0.95
});
const darkThread = new THREE.MeshStandardMaterial({
  color: 0x263b4a,
  roughness: 0.9
});
const paleThread = new THREE.MeshStandardMaterial({
  color: 0xb6bec0,
  roughness: 1
});
const blueThread = new THREE.MeshStandardMaterial({
  color: 0x315c7d,
  map: blueFabric,
  roughness: 0.95
});
const patchMat = new THREE.MeshStandardMaterial({
  color: 0xc95e43,
  map: feltTexture,
  roughness: 1
});
const goldThread = new THREE.MeshStandardMaterial({
  color: 0xe9b64f,
  roughness: 0.85
});
const visorMat = new THREE.MeshPhysicalMaterial({
  color: 0x173447,
  roughness: 0.23,
  metalness: 0.18,
  clearcoat: 0.45,
  clearcoatRoughness: 0.35
});

function shadows(object) {
  object.traverse(child => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });
  return object;
}

function sphere(parent, position, scale, material, segments = 48) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, segments, Math.floor(segments * 0.7)), material);
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  parent.add(mesh);
  return mesh;
}

function capsuleBetween(parent, start, end, radius, material, radialSegments = 24) {
  const center = start.clone().add(end).multiplyScalar(0.5);
  const distance = start.distanceTo(end);
  const cylinderLength = Math.max(0.05, distance - radius * 2);
  const geometry = new THREE.CapsuleGeometry(radius, cylinderLength, 8, radialSegments);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(center);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    end.clone().sub(start).normalize()
  );
  parent.add(mesh);
  return mesh;
}

function tube(parent, points, radius, material, closed = false, segments = 64) {
  const curve = new THREE.CatmullRomCurve3(points, closed, 'centripetal');
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, segments, radius, 8, closed), material);
  parent.add(mesh);
  return mesh;
}

function ovalPoints(cx, cy, cz, rx, ry, count = 48) {
  const points = [];
  for (let i = 0; i < count; i++) {
    const a = i / count * Math.PI * 2;
    points.push(new THREE.Vector3(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, cz));
  }
  return points;
}

function stitchLine(parent, points, material, stitchLength = 0.075, gap = 0.052, radius = 0.018) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const total = curve.getLength();
  const steps = Math.floor(total / (stitchLength + gap));
  for (let i = 0; i < steps; i++) {
    const a = (i * (stitchLength + gap)) / total;
    const b = Math.min(1, (i * (stitchLength + gap) + stitchLength) / total);
    const p1 = curve.getPointAt(a);
    const p2 = curve.getPointAt(b);
    capsuleBetween(parent, p1, p2, radius, material, 8);
  }
}

function ring(parent, position, rotation, majorRadius, tubeRadius, material, scaleX = 1) {
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(majorRadius, tubeRadius, 8, 48), material);
  mesh.position.copy(position);
  mesh.rotation.set(rotation.x, rotation.y, rotation.z);
  mesh.scale.x = scaleX;
  parent.add(mesh);
  return mesh;
}

const doll = new THREE.Group();
doll.rotation.y = -0.08;
scene.add(doll);

const torso = sphere(doll, new THREE.Vector3(0, 3.05, 0), new THREE.Vector3(1.38, 1.72, 0.92), whiteMat);
torso.rotation.x = -0.035;

const waist = ring(
  doll,
  new THREE.Vector3(0, 2.15, 0.03),
  new THREE.Vector3(Math.PI / 2, 0, 0),
  0.94,
  0.055,
  paleThread,
  1.18
);

const verticalBodySeam = [
  new THREE.Vector3(0, 1.62, 0.82),
  new THREE.Vector3(0, 2.45, 0.96),
  new THREE.Vector3(0, 3.35, 0.98),
  new THREE.Vector3(0, 4.28, 0.69)
];
stitchLine(doll, verticalBodySeam, paleThread, 0.085, 0.06, 0.017);

const shoulderQuiltLeft = [
  new THREE.Vector3(-1.12, 3.04, 0.68),
  new THREE.Vector3(-0.78, 3.23, 0.9),
  new THREE.Vector3(-0.4, 3.34, 0.98)
];
const shoulderQuiltRight = shoulderQuiltLeft.map(p => new THREE.Vector3(-p.x, p.y, p.z));
stitchLine(doll, shoulderQuiltLeft, paleThread, 0.07, 0.05, 0.015);
stitchLine(doll, shoulderQuiltRight, paleThread, 0.07, 0.05, 0.015);

const leftUpper = new THREE.Vector3(-1.03, 3.62, 0);
const leftElbow = new THREE.Vector3(-1.76, 3.02, 0.08);
const leftWrist = new THREE.Vector3(-2.12, 2.38, 0.18);
const rightUpper = new THREE.Vector3(1.03, 3.62, 0);
const rightElbow = new THREE.Vector3(1.78, 3.12, 0.04);
const rightWrist = new THREE.Vector3(2.16, 2.55, 0.16);

capsuleBetween(doll, leftUpper, leftElbow, 0.48, whiteMat);
capsuleBetween(doll, leftElbow, leftWrist, 0.44, whiteMat);
capsuleBetween(doll, rightUpper, rightElbow, 0.48, whiteMat);
capsuleBetween(doll, rightElbow, rightWrist, 0.44, whiteMat);

const leftHand = sphere(doll, new THREE.Vector3(-2.23, 2.13, 0.2), new THREE.Vector3(0.57, 0.63, 0.48), whiteMat);
leftHand.rotation.z = -0.38;
const rightHand = sphere(doll, new THREE.Vector3(2.28, 2.31, 0.18), new THREE.Vector3(0.57, 0.63, 0.48), whiteMat);
rightHand.rotation.z = 0.38;

sphere(doll, new THREE.Vector3(-2.57, 2.22, 0.32), new THREE.Vector3(0.22, 0.31, 0.22), whiteMat, 28);
sphere(doll, new THREE.Vector3(2.61, 2.42, 0.3), new THREE.Vector3(0.22, 0.31, 0.22), whiteMat, 28);

ring(doll, new THREE.Vector3(-2.02, 2.48, 0.17), new THREE.Vector3(1.1, 0.05, -0.52), 0.38, 0.075, cuffMat, 1.06);
ring(doll, new THREE.Vector3(2.04, 2.66, 0.14), new THREE.Vector3(1.1, -0.05, 0.52), 0.38, 0.075, cuffMat, 1.06);

const leftHip = new THREE.Vector3(-0.65, 2.0, 0);
const leftAnkle = new THREE.Vector3(-0.78, 0.78, 0.03);
const rightHip = new THREE.Vector3(0.65, 2.0, 0);
const rightAnkle = new THREE.Vector3(0.82, 0.78, 0.03);

capsuleBetween(doll, leftHip, leftAnkle, 0.57, whiteMat);
capsuleBetween(doll, rightHip, rightAnkle, 0.57, whiteMat);

ring(doll, new THREE.Vector3(-0.76, 0.82, 0.06), new THREE.Vector3(Math.PI / 2, 0, 0), 0.48, 0.065, cuffMat, 1.03);
ring(doll, new THREE.Vector3(0.8, 0.82, 0.06), new THREE.Vector3(Math.PI / 2, 0, 0), 0.48, 0.065, cuffMat, 1.03);

const leftBoot = sphere(doll, new THREE.Vector3(-0.8, 0.45, 0.22), new THREE.Vector3(0.72, 0.48, 0.86), whiteMat);
leftBoot.rotation.x = 0.1;
leftBoot.rotation.z = -0.08;
const rightBoot = sphere(doll, new THREE.Vector3(0.84, 0.45, 0.22), new THREE.Vector3(0.72, 0.48, 0.86), whiteMat);
rightBoot.rotation.x = 0.1;
rightBoot.rotation.z = 0.08;

const soleGeometry = new THREE.SphereGeometry(1, 36, 24, 0, Math.PI * 2, Math.PI * 0.48, Math.PI * 0.52);
const leftSole = new THREE.Mesh(soleGeometry, cuffMat);
leftSole.position.set(-0.8, 0.34, 0.26);
leftSole.scale.set(0.7, 0.45, 0.87);
leftSole.rotation.x = 0.08;
doll.add(leftSole);
const rightSole = leftSole.clone();
rightSole.position.x = 0.84;
doll.add(rightSole);

const helmetNeck = ring(
  doll,
  new THREE.Vector3(0, 4.42, 0),
  new THREE.Vector3(Math.PI / 2, 0, 0),
  1.05,
  0.14,
  cuffMat,
  1.08
);

const helmet = sphere(doll, new THREE.Vector3(0, 5.25, 0), new THREE.Vector3(1.65, 1.52, 1.37), whiteMat, 64);
helmet.rotation.x = -0.03;

const visor = sphere(doll, new THREE.Vector3(0, 5.33, 1.155), new THREE.Vector3(1.23, 0.91, 0.25), visorMat, 64);
visor.rotation.x = -0.04;

const visorHighlight = new THREE.Mesh(
  new THREE.SphereGeometry(1, 32, 20, 0, Math.PI * 0.55, 0, Math.PI * 0.45),
  new THREE.MeshBasicMaterial({ color: 0x7898a9, transparent: true, opacity: 0.22, depthWrite: false })
);
visorHighlight.position.set(-0.38, 5.67, 1.39);
visorHighlight.scale.set(0.46, 0.22, 0.045);
visorHighlight.rotation.z = 0.18;
doll.add(visorHighlight);

tube(doll, ovalPoints(0, 5.33, 1.38, 1.31, 0.99, 64), 0.075, blueThread, true, 96);

const visorStitchPoints = ovalPoints(0, 5.33, 1.463, 1.41, 1.08, 72);
for (let i = 0; i < visorStitchPoints.length; i += 2) {
  const a = visorStitchPoints[i];
  const b = visorStitchPoints[(i + 1) % visorStitchPoints.length];
  capsuleBetween(doll, a, b, 0.018, paleThread, 7);
}

const helmetTopSeam = [
  new THREE.Vector3(0, 6.72, -0.02),
  new THREE.Vector3(0, 6.66, 0.42),
  new THREE.Vector3(0, 6.48, 0.82),
  new THREE.Vector3(0, 6.24, 1.04)
];
stitchLine(doll, helmetTopSeam, paleThread, 0.07, 0.048, 0.017);

const earLeft = sphere(doll, new THREE.Vector3(-1.55, 5.22, 0), new THREE.Vector3(0.27, 0.58, 0.72), whiteMat, 36);
const earRight = sphere(doll, new THREE.Vector3(1.55, 5.22, 0), new THREE.Vector3(0.27, 0.58, 0.72), whiteMat, 36);
ring(doll, new THREE.Vector3(-1.75, 5.22, 0.02), new THREE.Vector3(0, Math.PI / 2, 0), 0.41, 0.035, paleThread, 1.25);
ring(doll, new THREE.Vector3(1.75, 5.22, 0.02), new THREE.Vector3(0, Math.PI / 2, 0), 0.41, 0.035, paleThread, 1.25);

const patch = new THREE.Mesh(new THREE.BoxGeometry(0.92, 0.68, 0.08, 6, 6, 1), patchMat);
patch.position.set(0.43, 3.47, 0.934);
patch.rotation.z = -0.035;
doll.add(patch);

const patchBorder = [
  new THREE.Vector3(-0.02, 3.14, 0.99),
  new THREE.Vector3(0.88, 3.14, 0.99),
  new THREE.Vector3(0.88, 3.8, 0.99),
  new THREE.Vector3(-0.02, 3.8, 0.99),
  new THREE.Vector3(-0.02, 3.14, 0.99)
];
stitchLine(doll, patchBorder, goldThread, 0.055, 0.034, 0.013);

const planet = new THREE.Mesh(new THREE.SphereGeometry(0.13, 20, 14), goldThread);
planet.position.set(0.43, 3.48, 1.003);
planet.scale.y = 0.72;
doll.add(planet);
ring(doll, new THREE.Vector3(0.43, 3.48, 1.018), new THREE.Vector3(Math.PI / 2, 0, 0.28), 0.2, 0.022, goldThread, 1.35);

const controlPanel = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.34, 0.07), blueThread);
controlPanel.position.set(-0.53, 3.02, 0.965);
controlPanel.rotation.z = 0.025;
doll.add(controlPanel);

const buttonColors = [0xe7b64e, 0xd56650, 0x87b9ad];
for (let i = 0; i < 3; i++) {
  const button = new THREE.Mesh(
    new THREE.SphereGeometry(0.045, 14, 10),
    new THREE.MeshStandardMaterial({ color: buttonColors[i], roughness: 0.85 })
  );
  button.position.set(-0.71 + i * 0.18, 3.03, 1.017);
  button.scale.z = 0.35;
  doll.add(button);
}

const pocketSeam = [
  new THREE.Vector3(-0.62, 2.55, 0.91),
  new THREE.Vector3(-0.34, 2.43, 0.96),
  new THREE.Vector3(0, 2.4, 0.98),
  new THREE.Vector3(0.34, 2.43, 0.96),
  new THREE.Vector3(0.62, 2.55, 0.91)
];
stitchLine(doll, pocketSeam, blueThread, 0.075, 0.05, 0.016);

const threadKnots = [
  [-1.32, 3.64, 0.45], [1.33, 3.65, 0.44],
  [-0.72, 1.14, 0.48], [0.75, 1.14, 0.48],
  [-2.29, 2.08, 0.63], [2.34, 2.26, 0.61]
];
for (const [x, y, z] of threadKnots) {
  sphere(doll, new THREE.Vector3(x, y, z), new THREE.Vector3(0.035, 0.035, 0.018), paleThread, 12);
}

shadows(doll);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(12, 96),
  new THREE.MeshStandardMaterial({ color: 0xcbdbe3, roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.04;
floor.receiveShadow = true;
scene.add(floor);

const backdropGlow = new THREE.Mesh(
  new THREE.CircleGeometry(5.2, 64),
  new THREE.MeshBasicMaterial({ color: 0xeaf4f7, transparent: true, opacity: 0.5, depthWrite: false })
);
backdropGlow.position.set(0, 4.2, -4.2);
scene.add(backdropGlow);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
}
window.addEventListener('resize', resize);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  doll.position.y = Math.sin(t * 1.15) * 0.025;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
