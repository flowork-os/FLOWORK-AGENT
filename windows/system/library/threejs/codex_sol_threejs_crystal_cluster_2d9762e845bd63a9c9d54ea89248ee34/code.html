<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amethyst Crystal Cluster</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 38%, #211831 0%, #0d0b14 55%, #050509 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 45%, rgba(0, 0, 0, 0.48) 110%);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="vignette"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x09070e);
    scene.fog = new THREE.FogExp2(0x09070e, 0.025);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(9.2, 6.6, 10.5);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.15, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.minDistance = 7;
    controls.maxDistance = 20;
    controls.minPolarAngle = Math.PI * 0.22;
    controls.maxPolarAngle = Math.PI * 0.49;

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const environmentScene = new RoomEnvironment();
    scene.environment = pmremGenerator.fromScene(environmentScene, 0.04).texture;
    pmremGenerator.dispose();

    const specimen = new THREE.Group();
    specimen.rotation.y = -0.18;
    scene.add(specimen);

    function createCrystalGeometry(radius, height, shoulderRatio, phase, tipOffsetX, tipOffsetZ) {
      const positions = [];
      const colors = [];
      const shoulder = height * shoulderRatio;
      const baseColor = new THREE.Color();

      function addTriangle(a, b, c, shade, hueShift = 0) {
        positions.push(
          a.x, a.y, a.z,
          b.x, b.y, b.z,
          c.x, c.y, c.z
        );

        baseColor.setHSL(0.735 + hueShift, 0.35, THREE.MathUtils.clamp(shade, 0.52, 0.98));
        for (let i = 0; i < 3; i++) {
          colors.push(baseColor.r, baseColor.g, baseColor.b);
        }
      }

      const bottom = [];
      const upper = [];

      for (let i = 0; i < 6; i++) {
        const angle = phase + i * Math.PI / 3;
        const subtle = 1 + 0.025 * Math.sin(i * 2.71 + height);
        bottom.push(new THREE.Vector3(
          Math.cos(angle) * radius * subtle,
          0,
          Math.sin(angle) * radius * subtle
        ));
        upper.push(new THREE.Vector3(
          Math.cos(angle) * radius * subtle,
          shoulder,
          Math.sin(angle) * radius * subtle
        ));
      }

      const apex = new THREE.Vector3(tipOffsetX, height, tipOffsetZ);
      const bottomCenter = new THREE.Vector3(0, 0, 0);

      for (let i = 0; i < 6; i++) {
        const next = (i + 1) % 6;
        const sideShade = 0.68 + 0.075 * Math.cos(phase + i * Math.PI / 3 - 0.7);
        const tipShade = 0.74 + 0.105 * Math.sin(phase + i * 1.27);

        addTriangle(bottom[i], upper[i], upper[next], sideShade, i % 2 === 0 ? 0.008 : -0.006);
        addTriangle(bottom[i], upper[next], bottom[next], sideShade, i % 2 === 0 ? 0.008 : -0.006);
        addTriangle(upper[i], apex, upper[next], tipShade, 0.012);
        addTriangle(bottom[i], bottom[next], bottomCenter, 0.58, -0.01);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.computeVertexNormals();
      geometry.computeBoundingSphere();
      return geometry;
    }

    function createCrystalMaterial(color, attenuationColor, roughness) {
      return new THREE.MeshPhysicalMaterial({
        color,
        vertexColors: true,
        metalness: 0,
        roughness,
        transmission: 0.82,
        thickness: 1.35,
        ior: 1.72,
        attenuationColor,
        attenuationDistance: 3.8,
        clearcoat: 1,
        clearcoatRoughness: 0.055,
        specularIntensity: 1,
        specularColor: new THREE.Color(0xf2ddff),
        envMapIntensity: 1.65,
        side: THREE.FrontSide
      });
    }

    const crystalMaterials = [
      createCrystalMaterial(0x8e45d7, 0x6e1daf, 0.105),
      createCrystalMaterial(0xa052dc, 0x7723bd, 0.085),
      createCrystalMaterial(0x7540c8, 0x4e168f, 0.125),
      createCrystalMaterial(0xb05ae3, 0x8428c2, 0.075)
    ];

    const crystalData = [
      { x: 0.00, z: 0.05, y: 0.52, r: 0.61, h: 5.35, s: 0.73, rx: -0.025, rz: 0.025, m: 0 },
      { x: -1.12, z: 0.18, y: 0.42, r: 0.52, h: 4.18, s: 0.75, rx: 0.035, rz: 0.16, m: 1 },
      { x: 1.12, z: 0.10, y: 0.45, r: 0.55, h: 4.50, s: 0.72, rx: -0.02, rz: -0.15, m: 2 },
      { x: -0.42, z: -0.92, y: 0.38, r: 0.47, h: 3.92, s: 0.71, rx: -0.14, rz: 0.05, m: 3 },
      { x: 0.68, z: -0.88, y: 0.39, r: 0.43, h: 3.55, s: 0.76, rx: -0.14, rz: -0.08, m: 1 },
      { x: -1.63, z: -0.45, y: 0.30, r: 0.39, h: 3.05, s: 0.72, rx: -0.08, rz: 0.22, m: 2 },
      { x: 1.69, z: -0.38, y: 0.28, r: 0.42, h: 3.20, s: 0.74, rx: -0.07, rz: -0.24, m: 0 },
      { x: -1.48, z: 0.95, y: 0.25, r: 0.34, h: 2.68, s: 0.70, rx: 0.14, rz: 0.18, m: 3 },
      { x: 1.48, z: 0.92, y: 0.26, r: 0.36, h: 2.82, s: 0.76, rx: 0.15, rz: -0.19, m: 1 },
      { x: -0.45, z: 1.28, y: 0.28, r: 0.31, h: 2.42, s: 0.73, rx: 0.19, rz: 0.05, m: 2 },
      { x: 0.54, z: 1.30, y: 0.27, r: 0.32, h: 2.58, s: 0.71, rx: 0.18, rz: -0.06, m: 0 },
      { x: -2.00, z: 0.28, y: 0.20, r: 0.28, h: 2.06, s: 0.75, rx: 0.05, rz: 0.30, m: 1 },
      { x: 2.02, z: 0.33, y: 0.20, r: 0.29, h: 2.16, s: 0.72, rx: 0.05, rz: -0.30, m: 3 }
    ];

    crystalData.forEach((data, index) => {
      const phase = 0.15 + index * 0.47;
      const geometry = createCrystalGeometry(
        data.r,
        data.h,
        data.s,
        phase,
        data.r * 0.09 * Math.sin(index * 1.73),
        data.r * 0.08 * Math.cos(index * 1.31)
      );

      const crystal = new THREE.Mesh(geometry, crystalMaterials[data.m]);
      crystal.position.set(data.x, data.y, data.z);
      crystal.rotation.order = 'YXZ';
      crystal.rotation.y = phase * 0.6;
      crystal.rotation.x = data.rx;
      crystal.rotation.z = data.rz;
      crystal.castShadow = true;
      crystal.receiveShadow = true;
      specimen.add(crystal);
    });

    function createRockGeometry() {
      const source = new THREE.IcosahedronGeometry(1, 3);
      const geometry = source.index ? source.toNonIndexed() : source.clone();
      const position = geometry.getAttribute('position');
      const vertexColors = [];
      const color = new THREE.Color();

      for (let i = 0; i < position.count; i++) {
        let x = position.getX(i);
        let y = position.getY(i);
        let z = position.getZ(i);

        const variation =
          1 +
          0.085 * Math.sin(x * 11.7 + z * 6.3) +
          0.055 * Math.sin(y * 17.1 - x * 4.2);

        x *= 3.05 * variation;
        z *= 2.38 * variation;
        y = Math.max(-0.43, y * 0.82 + 0.08 * Math.sin(x * 3.1 + z * 4.7));

        position.setXYZ(i, x, y, z);

        const lightness = THREE.MathUtils.clamp(
          0.20 + y * 0.055 + 0.025 * Math.sin(x * 5.4 - z * 3.7),
          0.12,
          0.29
        );
        color.setHSL(0.755, 0.18, lightness);
        vertexColors.push(color.r, color.g, color.b);
      }

      geometry.setAttribute('color', new THREE.Float32BufferAttribute(vertexColors, 3));
      geometry.computeVertexNormals();
      geometry.computeBoundingSphere();
      return geometry;
    }

    const rockMaterial = new THREE.MeshStandardMaterial({
      color: 0x2b2533,
      vertexColors: true,
      roughness: 0.88,
      metalness: 0.08,
      envMapIntensity: 0.45,
      flatShading: true
    });

    const rock = new THREE.Mesh(createRockGeometry(), rockMaterial);
    rock.position.y = 0.22;
    rock.rotation.y = 0.27;
    rock.castShadow = true;
    rock.receiveShadow = true;
    specimen.add(rock);

    const chipMaterial = new THREE.MeshStandardMaterial({
      color: 0x44334f,
      roughness: 0.72,
      metalness: 0.04,
      flatShading: true
    });

    const chipData = [
      [-2.33, 0.11, -0.65, 0.46, 0.28, 0.55],
      [2.25, 0.10, -0.72, 0.52, 0.31, 0.43],
      [-1.92, 0.08, 1.18, 0.42, 0.25, 0.38],
      [1.96, 0.08, 1.10, 0.38, 0.23, 0.46],
      [0.12, 0.04, -1.91, 0.48, 0.22, 0.39]
    ];

    chipData.forEach((entry, index) => {
      const chip = new THREE.Mesh(
        new THREE.IcosahedronGeometry(1, 0),
        chipMaterial
      );
      chip.position.set(entry[0], entry[1], entry[2]);
      chip.scale.set(entry[3], entry[4], entry[5]);
      chip.rotation.set(index * 0.31, index * 0.83, index * 0.17);
      chip.castShadow = true;
      chip.receiveShadow = true;
      specimen.add(chip);
    });

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x100d15,
      roughness: 0.93,
      metalness: 0.02
    });
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(18, 96),
      groundMaterial
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.22;
    ground.receiveShadow = true;
    scene.add(ground);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(3.7, 8.5, 96),
      new THREE.MeshBasicMaterial({
        color: 0x25132f,
        transparent: true,
        opacity: 0.16,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = -0.205;
    scene.add(ring);

    const hemisphereLight = new THREE.HemisphereLight(0x9a7bc5, 0x100b15, 1.25);
    scene.add(hemisphereLight);

    const keyLight = new THREE.SpotLight(0xeedcff, 115, 30, Math.PI / 5.5, 0.45, 1.35);
    keyLight.position.set(6.5, 10, 7);
    keyLight.target.position.set(0, 2.1, 0);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 28;
    keyLight.shadow.bias = -0.00025;
    scene.add(keyLight, keyLight.target);

    const rimLight = new THREE.SpotLight(0x863cff, 95, 28, Math.PI / 4.5, 0.55, 1.4);
    rimLight.position.set(-7, 7, -6);
    rimLight.target.position.set(0, 2.3, 0);
    scene.add(rimLight, rimLight.target);

    const fillLight = new THREE.PointLight(0x5b8cff, 34, 18, 1.55);
    fillLight.position.set(4.5, 2.8, -5);
    scene.add(fillLight);

    const warmLight = new THREE.PointLight(0xff91dc, 22, 14, 1.7);
    warmLight.position.set(-4, 1.7, 4.8);
    scene.add(warmLight);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      rimLight.intensity = 91 + Math.sin(elapsed * 0.65) * 5;
      fillLight.position.y = 2.9 + Math.sin(elapsed * 0.42) * 0.18;

      controls.update();
      renderer.render(scene, camera);
    }

    function handleResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('resize', handleResize);
    animate();
  </script>
</body>
</html>
