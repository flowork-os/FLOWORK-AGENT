<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geodesic Glass Terrarium</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #171815;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 43%, transparent 35%, rgba(13, 12, 10, 0.24) 80%, rgba(8, 7, 6, 0.55) 100%);
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x25251f);
  scene.fog = new THREE.FogExp2(0x25251f, 0.025);

  const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(7.2, 5.5, 8.2);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 2.05, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.65;
  controls.minDistance = 6;
  controls.maxDistance = 14;
  controls.maxPolarAngle = Math.PI * 0.49;

  const terrarium = new THREE.Group();
  scene.add(terrarium);

  const rand = (() => {
    let seed = 91357;
    return () => {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    };
  })();

  const brassMaterial = new THREE.MeshStandardMaterial({
    color: 0xb88735,
    metalness: 0.9,
    roughness: 0.24
  });

  const darkBrassMaterial = new THREE.MeshStandardMaterial({
    color: 0x735124,
    metalness: 0.82,
    roughness: 0.33
  });

  const soilMaterial = new THREE.MeshStandardMaterial({
    color: 0x352318,
    roughness: 1,
    metalness: 0
  });

  const baseGeometry = new THREE.CylinderGeometry(1.27, 1.33, 0.22, 48);
  const base = new THREE.Mesh(baseGeometry, darkBrassMaterial);
  base.position.y = 0.16;
  base.castShadow = true;
  base.receiveShadow = true;
  terrarium.add(base);

  const insetGeometry = new THREE.CylinderGeometry(1.18, 1.21, 0.13, 48);
  const inset = new THREE.Mesh(insetGeometry, soilMaterial);
  inset.position.y = 0.31;
  inset.receiveShadow = true;
  terrarium.add(inset);

  const soilGeometry = new THREE.SphereGeometry(1.16, 40, 16, 0, Math.PI * 2, 0, Math.PI * 0.46);
  const soil = new THREE.Mesh(soilGeometry, soilMaterial);
  soil.scale.set(1, 0.32, 1);
  soil.position.y = 0.38;
  soil.rotation.x = Math.PI;
  soil.receiveShadow = true;
  terrarium.add(soil);

  const rimGeometry = new THREE.TorusGeometry(1.255, 0.042, 10, 64);
  const rim = new THREE.Mesh(rimGeometry, brassMaterial);
  rim.rotation.x = Math.PI / 2;
  rim.position.y = 0.29;
  rim.castShadow = true;
  terrarium.add(rim);

  const pebbleColors = [0xc7b89e, 0x8e8778, 0x6e6658, 0xd3c7b0, 0x9c8065];
  const pebbleMaterials = pebbleColors.map(color => new THREE.MeshStandardMaterial({
    color,
    roughness: 0.82,
    metalness: 0
  }));

  const pebbleGeometry = new THREE.DodecahedronGeometry(0.13, 1);
  for (let i = 0; i < 33; i++) {
    const angle = rand() * Math.PI * 2;
    const radius = 0.25 + Math.sqrt(rand()) * 0.77;
    const pebble = new THREE.Mesh(
      pebbleGeometry,
      pebbleMaterials[Math.floor(rand() * pebbleMaterials.length)]
    );
    pebble.position.set(
      Math.cos(angle) * radius,
      0.43 + rand() * 0.035,
      Math.sin(angle) * radius
    );
    pebble.scale.set(
      0.65 + rand() * 0.8,
      0.42 + rand() * 0.38,
      0.65 + rand() * 0.8
    );
    pebble.rotation.set(rand() * 2, rand() * Math.PI, rand() * 2);
    pebble.castShadow = true;
    pebble.receiveShadow = true;
    terrarium.add(pebble);
  }

  const leafProfile = [
    new THREE.Vector2(0.025, 0),
    new THREE.Vector2(0.13, 0.09),
    new THREE.Vector2(0.22, 0.34),
    new THREE.Vector2(0.25, 0.62),
    new THREE.Vector2(0.18, 0.88),
    new THREE.Vector2(0.075, 1.08),
    new THREE.Vector2(0.004, 1.18)
  ];
  const leafGeometry = new THREE.LatheGeometry(leafProfile, 14);
  leafGeometry.computeVertexNormals();

  const leafMaterials = [
    new THREE.MeshStandardMaterial({ color: 0x71935f, roughness: 0.68, flatShading: true }),
    new THREE.MeshStandardMaterial({ color: 0x86a86e, roughness: 0.66, flatShading: true }),
    new THREE.MeshStandardMaterial({ color: 0x587d50, roughness: 0.72, flatShading: true })
  ];

  const plant = new THREE.Group();
  plant.position.set(-0.06, 0.46, 0.02);
  terrarium.add(plant);

  const up = new THREE.Vector3(0, 1, 0);

  function addLeaf(angle, tilt, scale, height, materialIndex) {
    const direction = new THREE.Vector3(
      Math.cos(angle) * Math.sin(tilt),
      Math.cos(tilt),
      Math.sin(angle) * Math.sin(tilt)
    ).normalize();

    const leaf = new THREE.Mesh(leafGeometry, leafMaterials[materialIndex]);
    leaf.scale.set(scale, height, scale * 0.82);
    leaf.position.copy(direction).multiplyScalar(0.08);
    leaf.quaternion.setFromUnitVectors(up, direction);
    leaf.rotateY((rand() - 0.5) * 0.35);
    leaf.castShadow = true;
    leaf.receiveShadow = true;
    plant.add(leaf);
  }

  for (let i = 0; i < 9; i++) {
    addLeaf(
      i / 9 * Math.PI * 2 + 0.12,
      0.82 + (i % 2) * 0.13,
      0.88 + rand() * 0.16,
      0.82 + rand() * 0.12,
      i % 3
    );
  }

  for (let i = 0; i < 7; i++) {
    addLeaf(
      i / 7 * Math.PI * 2 + 0.42,
      0.48 + (i % 2) * 0.08,
      0.66 + rand() * 0.1,
      0.78 + rand() * 0.1,
      (i + 1) % 3
    );
  }

  for (let i = 0; i < 5; i++) {
    addLeaf(
      i / 5 * Math.PI * 2,
      0.18 + rand() * 0.12,
      0.43 + rand() * 0.08,
      0.64 + rand() * 0.08,
      1
    );
  }

  const glassGeometry = new THREE.IcosahedronGeometry(2.2, 1);
  const glassMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xd8f2e9,
    metalness: 0,
    roughness: 0.08,
    transmission: 0.94,
    thickness: 0.09,
    ior: 1.46,
    transparent: true,
    opacity: 0.32,
    clearcoat: 1,
    clearcoatRoughness: 0.08,
    side: THREE.DoubleSide,
    depthWrite: false,
    flatShading: true
  });

  const glass = new THREE.Mesh(glassGeometry, glassMaterial);
  glass.position.y = 2.26;
  glass.renderOrder = 4;
  glass.castShadow = false;
  terrarium.add(glass);

  const edgeGeometry = new THREE.EdgesGeometry(glassGeometry, 1);
  const edgePositions = edgeGeometry.attributes.position;
  const edgeCount = edgePositions.count / 2;
  const strutGeometry = new THREE.CylinderGeometry(0.017, 0.017, 1, 6, 1);
  const struts = new THREE.InstancedMesh(strutGeometry, brassMaterial, edgeCount);
  const start = new THREE.Vector3();
  const end = new THREE.Vector3();
  const midpoint = new THREE.Vector3();
  const direction = new THREE.Vector3();
  const quaternion = new THREE.Quaternion();
  const scale = new THREE.Vector3();
  const matrix = new THREE.Matrix4();
  const yAxis = new THREE.Vector3(0, 1, 0);

  for (let i = 0; i < edgeCount; i++) {
    start.fromBufferAttribute(edgePositions, i * 2);
    end.fromBufferAttribute(edgePositions, i * 2 + 1);
    midpoint.copy(start).add(end).multiplyScalar(0.5);
    midpoint.y += 2.26;
    direction.copy(end).sub(start);
    const length = direction.length();
    direction.normalize();
    quaternion.setFromUnitVectors(yAxis, direction);
    scale.set(1, length, 1);
    matrix.compose(midpoint, quaternion, scale);
    struts.setMatrixAt(i, matrix);
  }
  struts.instanceMatrix.needsUpdate = true;
  struts.castShadow = true;
  struts.receiveShadow = true;
  struts.renderOrder = 5;
  terrarium.add(struts);

  const vertexPositions = glassGeometry.attributes.position;
  const seenVertices = new Map();
  const jointGeometry = new THREE.SphereGeometry(0.035, 10, 8);
  const joints = [];

  for (let i = 0; i < vertexPositions.count; i++) {
    const x = vertexPositions.getX(i);
    const y = vertexPositions.getY(i);
    const z = vertexPositions.getZ(i);
    const key = `${x.toFixed(4)},${y.toFixed(4)},${z.toFixed(4)}`;
    if (!seenVertices.has(key)) {
      seenVertices.set(key, true);
      joints.push(new THREE.Vector3(x, y + 2.26, z));
    }
  }

  const jointMesh = new THREE.InstancedMesh(jointGeometry, brassMaterial, joints.length);
  const identityQuaternion = new THREE.Quaternion();
  const jointScale = new THREE.Vector3(1, 1, 1);
  for (let i = 0; i < joints.length; i++) {
    matrix.compose(joints[i], identityQuaternion, jointScale);
    jointMesh.setMatrixAt(i, matrix);
  }
  jointMesh.instanceMatrix.needsUpdate = true;
  jointMesh.castShadow = true;
  jointMesh.renderOrder = 6;
  terrarium.add(jointMesh);

  const capGeometry = new THREE.CylinderGeometry(0.12, 0.16, 0.13, 12);
  const cap = new THREE.Mesh(capGeometry, brassMaterial);
  cap.position.y = 4.51;
  cap.castShadow = true;
  terrarium.add(cap);

  const loopGeometry = new THREE.TorusGeometry(0.13, 0.025, 8, 24);
  const loop = new THREE.Mesh(loopGeometry, brassMaterial);
  loop.position.y = 4.66;
  loop.castShadow = true;
  terrarium.add(loop);

  const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0x514b3f,
    roughness: 0.92,
    metalness: 0
  });
  const floor = new THREE.Mesh(new THREE.CircleGeometry(15, 96), floorMaterial);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0.035;
  floor.receiveShadow = true;
  scene.add(floor);

  const halo = new THREE.Mesh(
    new THREE.CircleGeometry(3.5, 64),
    new THREE.MeshBasicMaterial({
      color: 0xbfa87a,
      transparent: true,
      opacity: 0.045,
      depthWrite: false
    })
  );
  halo.rotation.x = -Math.PI / 2;
  halo.position.y = 0.045;
  scene.add(halo);

  const hemisphere = new THREE.HemisphereLight(0xdde7dc, 0x33261c, 2.1);
  scene.add(hemisphere);

  const keyLight = new THREE.DirectionalLight(0xffe0ad, 4.2);
  keyLight.position.set(5, 8, 5);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.left = -5;
  keyLight.shadow.camera.right = 5;
  keyLight.shadow.camera.top = 6;
  keyLight.shadow.camera.bottom = -2;
  keyLight.shadow.camera.near = 1;
  keyLight.shadow.camera.far = 20;
  keyLight.shadow.bias = -0.0004;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xa9d5d1, 2.2);
  fillLight.position.set(-5, 4, 2);
  scene.add(fillLight);

  const warmLight = new THREE.PointLight(0xffa75e, 14, 10, 2);
  warmLight.position.set(2.8, 2.5, -3.5);
  scene.add(warmLight);

  const topLight = new THREE.SpotLight(0xfff2d1, 34, 16, Math.PI / 5, 0.55, 1.2);
  topLight.position.set(-1.5, 8, 4);
  topLight.target.position.set(0, 1.8, 0);
  scene.add(topLight, topLight.target);

  function resize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  }
  window.addEventListener('resize', resize);

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
