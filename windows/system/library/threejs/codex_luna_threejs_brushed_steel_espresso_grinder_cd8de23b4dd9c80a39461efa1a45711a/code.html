<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brushed Steel Grinder</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111416;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111416);
scene.fog = new THREE.Fog(0x111416, 7, 15);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.7, 2.55, 5.1);
camera.lookAt(0, 0.15, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 3.2;
controls.maxDistance = 8;
controls.target.set(0, 0.15, 0);

scene.add(new THREE.HemisphereLight(0xbac5ca, 0x17191a, 2.0));

const keyLight = new THREE.DirectionalLight(0xf5eee3, 3.2);
keyLight.position.set(4, 6, 4);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -4;
keyLight.shadow.camera.right = 4;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -4;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x8ca9bb, 1.7);
rimLight.position.set(-4, 3, -4);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0xd7b990, 0.9, 8);
fillLight.position.set(2, 1.2, 3);
scene.add(fillLight);

const steel = new THREE.MeshStandardMaterial({
  color: 0x7d8584,
  metalness: 0.88,
  roughness: 0.34
});
const steelDark = new THREE.MeshStandardMaterial({
  color: 0x515957,
  metalness: 0.82,
  roughness: 0.42
});
const steelEdge = new THREE.MeshStandardMaterial({
  color: 0x9ba19f,
  metalness: 0.9,
  roughness: 0.28
});
const rubber = new THREE.MeshStandardMaterial({
  color: 0x202524,
  metalness: 0.08,
  roughness: 0.7
});
const walnut = new THREE.MeshStandardMaterial({
  color: 0x6a321b,
  metalness: 0.05,
  roughness: 0.3
});
const walnutDark = new THREE.MeshStandardMaterial({
  color: 0x35160d,
  metalness: 0.02,
  roughness: 0.46
});

function addMesh(geometry, material, position = [0, 0, 0], rotation = [0, 0, 0]) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(position[0], position[1], position[2]);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function cylinderBetween(a, b, radius, material, radialSegments = 24) {
  const start = new THREE.Vector3(a[0], a[1], a[2]);
  const end = new THREE.Vector3(b[0], b[1], b[2]);
  const delta = new THREE.Vector3().subVectors(end, start);
  const length = delta.length();
  const geometry = new THREE.CylinderGeometry(radius, radius, length, radialSegments);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    delta.normalize()
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

const body = addMesh(
  new THREE.CylinderGeometry(0.82, 0.82, 1.96, 96, 12),
  steel,
  [0, -0.04, 0]
);

const lowerShoulder = addMesh(
  new THREE.CylinderGeometry(0.76, 0.82, 0.16, 96),
  steelEdge,
  [0, -1.03, 0]
);

const upperShoulder = addMesh(
  new THREE.CylinderGeometry(0.82, 0.77, 0.13, 96),
  steelEdge,
  [0, 0.96, 0]
);

addMesh(
  new THREE.TorusGeometry(0.79, 0.026, 12, 96),
  steelEdge,
  [0, 0.965, 0],
  [Math.PI / 2, 0, 0]
);

addMesh(
  new THREE.TorusGeometry(0.79, 0.022, 12, 96),
  steelDark,
  [0, -1.045, 0],
  [Math.PI / 2, 0, 0]
);

const grainMaterials = [steelDark, steel, steelEdge];
for (let i = 0; i < 62; i++) {
  const y = -0.94 + i * 0.0305;
  addMesh(
    new THREE.TorusGeometry(0.823, 0.0032 + (i % 3) * 0.001, 6, 96),
    grainMaterials[i % grainMaterials.length],
    [0, y, 0],
    [Math.PI / 2, 0, 0]
  );
}

const gripBand = addMesh(
  new THREE.CylinderGeometry(0.846, 0.846, 0.43, 96),
  steelDark,
  [0, -0.12, 0]
);

for (let i = 0; i < 48; i++) {
  const angle = (i / 48) * Math.PI * 2;
  const radius = 0.854;
  const x = Math.cos(angle) * radius;
  const z = Math.sin(angle) * radius;
  const flute = new THREE.Mesh(
    new THREE.BoxGeometry(0.026, 0.39, 0.026),
    i % 4 === 0 ? steelEdge : steel
  );
  flute.position.set(x, -0.12, z);
  flute.rotation.set(0, -angle, (i % 2 === 0 ? 1 : -1) * 0.22);
  flute.castShadow = true;
  flute.receiveShadow = true;
  scene.add(flute);
}

for (let y of [-0.345, 0.105]) {
  addMesh(
    new THREE.TorusGeometry(0.848, 0.018, 10, 96),
    steelEdge,
    [0, y, 0],
    [Math.PI / 2, 0, 0]
  );
}

const dome = new THREE.Mesh(
  new THREE.SphereGeometry(0.79, 96, 32, 0, Math.PI * 2, 0, Math.PI / 2),
  steel
);
dome.position.y = 0.985;
dome.castShadow = true;
dome.receiveShadow = true;
scene.add(dome);

addMesh(
  new THREE.CylinderGeometry(0.31, 0.31, 0.075, 64),
  steelDark,
  [0, 1.725, 0]
);

addMesh(
  new THREE.TorusGeometry(0.34, 0.025, 12, 64),
  steelEdge,
  [0, 1.755, 0],
  [Math.PI / 2, 0, 0]
);

const collar = addMesh(
  new THREE.CylinderGeometry(0.75, 0.75, 0.27, 96),
  steelDark,
  [0, -1.18, 0]
);

for (let i = 0; i < 7; i++) {
  addMesh(
    new THREE.TorusGeometry(0.756, 0.018, 10, 96),
    i % 2 ? steelEdge : steel,
    [0, -1.065 - i * 0.038, 0],
    [Math.PI / 2, 0, 0]
  );
}

addMesh(
  new THREE.CylinderGeometry(0.71, 0.68, 0.64, 96, 8),
  steel,
  [0, -1.59, 0]
);

addMesh(
  new THREE.TorusGeometry(0.69, 0.028, 12, 96),
  steelEdge,
  [0, -1.91, 0],
  [Math.PI / 2, 0, 0]
);

addMesh(
  new THREE.TorusGeometry(0.715, 0.022, 12, 96),
  steelDark,
  [0, -1.28, 0],
  [Math.PI / 2, 0, 0]
);

addMesh(
  new THREE.CylinderGeometry(0.62, 0.62, 0.025, 96),
  rubber,
  [0, -1.915, 0]
);

const pivot = new THREE.Mesh(
  new THREE.SphereGeometry(0.13, 32, 20),
  steelEdge
);
pivot.position.set(0, 1.76, 0.02);
pivot.castShadow = true;
scene.add(pivot);

const armStart = [0, 1.78, 0.02];
const armEnd = [0.15, 2.48, 0.08];
cylinderBetween(armStart, armEnd, 0.075, steelDark, 20);

const upperJoint = new THREE.Mesh(
  new THREE.SphereGeometry(0.095, 24, 16),
  steelEdge
);
upperJoint.position.set(armEnd[0], armEnd[1], armEnd[2]);
upperJoint.castShadow = true;
scene.add(upperJoint);

const knobStem = cylinderBetween(
  [0.15, 2.48, 0.08],
  [0.15, 2.66, 0.08],
  0.055,
  steelDark,
  20
);

const knob = addMesh(
  new THREE.SphereGeometry(0.17, 40, 24),
  walnut,
  [0.15, 2.79, 0.08]
);
knob.scale.set(0.78, 1.22, 0.78);

addMesh(
  new THREE.TorusGeometry(0.126, 0.012, 8, 32),
  walnutDark,
  [0.15, 2.79, 0.08],
  [Math.PI / 2, 0, 0]
);

const topCap = addMesh(
  new THREE.CylinderGeometry(0.18, 0.18, 0.045, 48),
  walnutDark,
  [0.15, 2.955, 0.08]
);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(8, 96),
  new THREE.MeshStandardMaterial({ color: 0x181b1c, roughness: 0.88, metalness: 0.04 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.94;
floor.receiveShadow = true;
scene.add(floor);

const backGlow = new THREE.Mesh(
  new THREE.CircleGeometry(4.5, 64),
  new THREE.MeshBasicMaterial({ color: 0x20292b, transparent: true, opacity: 0.2 })
);
backGlow.position.set(-2.8, 2.2, -3.3);
backGlow.rotation.y = -0.4;
scene.add(backGlow);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

animate();
</script>
</body>
</html>
