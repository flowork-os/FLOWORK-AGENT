<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Origami Sailboat</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #dcecf3;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xdcecf3);
  scene.fog = new THREE.Fog(0xdcecf3, 13, 24);

  const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(7.4, 4.6, 8.6);
  camera.lookAt(0, 1.15, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.15, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.65;
  controls.minDistance = 7;
  controls.maxDistance = 16;
  controls.maxPolarAngle = Math.PI * 0.76;

  scene.add(new THREE.HemisphereLight(0xf7fcff, 0x8da6ae, 2.25));

  const keyLight = new THREE.DirectionalLight(0xffffff, 4.2);
  keyLight.position.set(-5, 9, 7);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.left = -7;
  keyLight.shadow.camera.right = 7;
  keyLight.shadow.camera.top = 8;
  keyLight.shadow.camera.bottom = -5;
  keyLight.shadow.camera.near = 1;
  keyLight.shadow.camera.far = 24;
  keyLight.shadow.bias = -0.0004;
  keyLight.shadow.normalBias = 0.025;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0x9ed9ff, 1.35);
  fillLight.position.set(6, 4, -6);
  scene.add(fillLight);

  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(10, 96),
    new THREE.ShadowMaterial({ color: 0x557784, opacity: 0.18 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -1.17;
  floor.receiveShadow = true;
  scene.add(floor);

  const boat = new THREE.Group();
  boat.rotation.y = -0.13;
  boat.position.y = 0.02;
  scene.add(boat);

  const paperMaterial = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.82,
    metalness: 0,
    side: THREE.DoubleSide
  });

  const edgeMaterial = new THREE.LineBasicMaterial({
    color: 0x426f87,
    transparent: true,
    opacity: 0.5,
    depthWrite: false
  });

  const deepCreaseMaterial = new THREE.LineBasicMaterial({
    color: 0x294e65,
    transparent: true,
    opacity: 0.68,
    depthWrite: false
  });

  function paperColor(x, y, z, shade = 1) {
    const low = new THREE.Color(0x79b9dc);
    const high = new THREE.Color(0xf9fdff);
    const t = THREE.MathUtils.clamp((y + 1.15) / 5.15, 0, 1);
    const sideTint = THREE.MathUtils.clamp(0.52 + x * 0.055 - z * 0.035, 0.25, 0.78);
    const color = low.clone().lerp(high, 0.3 + t * 0.68);
    color.lerp(new THREE.Color(0xd5f1ff), sideTint * 0.12);
    color.multiplyScalar(shade);
    return color;
  }

  function createFacetedMesh(triangles) {
    const positions = [];
    const colors = [];
    for (const triangle of triangles) {
      const shade = triangle.shade ?? 1;
      for (const point of triangle.points) {
        positions.push(point[0], point[1], point[2]);
        const color = paperColor(point[0], point[1], point[2], shade);
        colors.push(color.r, color.g, color.b);
      }
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geometry.computeVertexNormals();
    const mesh = new THREE.Mesh(geometry, paperMaterial);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }

  const L = [-3.05, 0.04, 0];
  const R = [3.05, 0.04, 0];
  const FL = [-1.62, 0.15, 0.82];
  const FM = [0, 0.18, 0.94];
  const FR = [1.62, 0.15, 0.82];
  const BL = [-1.62, 0.15, -0.82];
  const BM = [0, 0.18, -0.94];
  const BR = [1.62, 0.15, -0.82];
  const KL = [-1.46, -0.75, 0];
  const KC = [0, -1.03, 0];
  const KR = [1.46, -0.75, 0];
  const CI = [0, -0.19, 0];

  const hullTriangles = [
    { points: [L, FL, KL], shade: 0.96 },
    { points: [FL, FM, KC], shade: 1.00 },
    { points: [FL, KC, KL], shade: 0.88 },
    { points: [FM, FR, KC], shade: 0.95 },
    { points: [FR, KR, KC], shade: 0.84 },
    { points: [FR, R, KR], shade: 0.91 },
    { points: [L, KL, BL], shade: 0.79 },
    { points: [BL, KL, KC], shade: 0.83 },
    { points: [BL, KC, BM], shade: 0.9 },
    { points: [BM, KC, BR], shade: 0.86 },
    { points: [BR, KC, KR], shade: 0.78 },
    { points: [BR, KR, R], shade: 0.82 },
    { points: [L, BL, CI], shade: 0.86 },
    { points: [L, CI, FL], shade: 0.94 },
    { points: [FL, CI, FM], shade: 1.02 },
    { points: [FM, CI, BM], shade: 0.93 },
    { points: [BM, CI, BL], shade: 0.81 },
    { points: [FM, CI, FR], shade: 0.98 },
    { points: [FR, CI, R], shade: 0.92 },
    { points: [R, CI, BR], shade: 0.83 },
    { points: [BR, CI, BM], shade: 0.78 }
  ];

  const hull = createFacetedMesh(hullTriangles);
  boat.add(hull);

  function makeLine(points, material = edgeMaterial) {
    const geometry = new THREE.BufferGeometry().setFromPoints(
      points.map(point => new THREE.Vector3(point[0], point[1], point[2]))
    );
    const line = new THREE.Line(geometry, material);
    line.renderOrder = 3;
    return line;
  }

  function makeSegments(segmentPairs, material = edgeMaterial) {
    const positions = [];
    for (const pair of segmentPairs) {
      positions.push(...pair[0], ...pair[1]);
    }
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    const lines = new THREE.LineSegments(geometry, material);
    lines.renderOrder = 3;
    return lines;
  }

  boat.add(makeLine([
    [-3.05, 0.055, 0.01],
    [-1.62, 0.165, 0.83],
    [0, 0.195, 0.95],
    [1.62, 0.165, 0.83],
    [3.05, 0.055, 0.01]
  ], deepCreaseMaterial));

  boat.add(makeLine([
    [-3.05, 0.055, -0.01],
    [-1.62, 0.165, -0.83],
    [0, 0.195, -0.95],
    [1.62, 0.165, -0.83],
    [3.05, 0.055, -0.01]
  ], deepCreaseMaterial));

  boat.add(makeSegments([
    [L, KL], [FL, KL], [FL, KC], [FM, KC], [FR, KC], [FR, KR], [R, KR],
    [L, BL], [BL, KC], [BM, KC], [BR, KC], [BR, R],
    [L, CI], [FL, CI], [FM, CI], [FR, CI], [R, CI], [BL, CI], [BM, CI], [BR, CI]
  ]));

  const foldedSpine = createFacetedMesh([
    {
      points: [
        [-0.18, 0.12, -0.035],
        [-0.11, 3.98, -0.02],
        [0.035, 0.18, 0.06]
      ],
      shade: 0.89
    },
    {
      points: [
        [-0.11, 3.98, -0.02],
        [0.08, 0.18, -0.04],
        [0.035, 0.18, 0.06]
      ],
      shade: 0.77
    }
  ]);
  boat.add(foldedSpine);

  const sailA = new THREE.Vector3(-0.07, 0.31, 0.025);
  const sailB = new THREE.Vector3(2.72, 0.53, 0.025);
  const sailC = new THREE.Vector3(-0.08, 3.91, 0.025);
  const sailDivisions = 10;
  const sailPositions = [];
  const sailColors = [];
  const sailIndices = [];
  const sailLookup = [];

  function sailPoint(u, v) {
    const w = 1 - u - v;
    const point = sailA.clone().multiplyScalar(w)
      .add(sailB.clone().multiplyScalar(u))
      .add(sailC.clone().multiplyScalar(v));
    const bulge = 7.8 * u * v * w;
    point.z += bulge + 0.015 * u;
    return point;
  }

  let sailIndex = 0;
  for (let row = 0; row <= sailDivisions; row++) {
    sailLookup[row] = [];
    for (let column = 0; column <= sailDivisions - row; column++) {
      const u = column / sailDivisions;
      const v = row / sailDivisions;
      const point = sailPoint(u, v);
      sailLookup[row][column] = sailIndex++;
      sailPositions.push(point.x, point.y, point.z);
      const color = paperColor(point.x, point.y, point.z, 1.02 - u * 0.055);
      sailColors.push(color.r, color.g, color.b);
    }
  }

  for (let row = 0; row < sailDivisions; row++) {
    const count = sailDivisions - row;
    for (let column = 0; column < count; column++) {
      const a = sailLookup[row][column];
      const b = sailLookup[row][column + 1];
      const c = sailLookup[row + 1][column];
      sailIndices.push(a, b, c);
      if (column < count - 1) {
        const d = sailLookup[row + 1][column + 1];
        sailIndices.push(b, d, c);
      }
    }
  }

  const sailGeometry = new THREE.BufferGeometry();
  sailGeometry.setAttribute('position', new THREE.Float32BufferAttribute(sailPositions, 3));
  sailGeometry.setAttribute('color', new THREE.Float32BufferAttribute(sailColors, 3));
  sailGeometry.setIndex(sailIndices);
  sailGeometry.computeVertexNormals();

  const sail = new THREE.Mesh(sailGeometry, paperMaterial);
  sail.castShadow = true;
  sail.receiveShadow = true;
  boat.add(sail);

  function sailCrease(samples, coordinateFunction, material = edgeMaterial) {
    const points = [];
    for (let i = 0; i <= samples; i++) {
      const pair = coordinateFunction(i / samples);
      const point = sailPoint(pair[0], pair[1]);
      point.z += 0.008;
      points.push([point.x, point.y, point.z]);
    }
    return makeLine(points, material);
  }

  boat.add(sailCrease(32, t => [t * 0.72, 0.19 * (1 - t)], deepCreaseMaterial));
  boat.add(sailCrease(32, t => [0.18 * (1 - t), t * 0.77], edgeMaterial));
  boat.add(sailCrease(28, t => [0.05 + t * 0.63, 0.34], edgeMaterial));
  boat.add(sailCrease(28, t => [0.32, 0.04 + t * 0.49], edgeMaterial));
  boat.add(sailCrease(28, t => [t * 0.47, 0.69 * (1 - t)], edgeMaterial));

  const sailOutlinePoints = [];
  for (let i = 0; i <= 24; i++) {
    const point = sailPoint(i / 24, 0);
    point.z += 0.009;
    sailOutlinePoints.push([point.x, point.y, point.z]);
  }
  for (let i = 1; i <= 24; i++) {
    const t = i / 24;
    const point = sailPoint(1 - t, t);
    point.z += 0.009;
    sailOutlinePoints.push([point.x, point.y, point.z]);
  }
  for (let i = 1; i <= 24; i++) {
    const point = sailPoint(0, 1 - i / 24);
    point.z += 0.009;
    sailOutlinePoints.push([point.x, point.y, point.z]);
  }
  boat.add(makeLine(sailOutlinePoints, deepCreaseMaterial));

  const smallFold = createFacetedMesh([
    {
      points: [
        [-0.2, 0.19, 0.02],
        [-1.25, 0.21, 0.16],
        [-0.16, 1.4, 0.035]
      ],
      shade: 0.93
    },
    {
      points: [
        [-1.25, 0.21, 0.16],
        [-0.16, 1.4, 0.035],
        [-0.18, 0.2, -0.02]
      ],
      shade: 0.82
    }
  ]);
  boat.add(smallFold);

  boat.add(makeSegments([
    [[-0.2, 0.205, 0.03], [-1.25, 0.225, 0.17]],
    [[-1.25, 0.225, 0.17], [-0.16, 1.415, 0.045]]
  ], edgeMaterial));

  const ambientDisc = new THREE.Mesh(
    new THREE.CircleGeometry(4.4, 72),
    new THREE.MeshBasicMaterial({
      color: 0xaacbd8,
      transparent: true,
      opacity: 0.07,
      depthWrite: false
    })
  );
  ambientDisc.rotation.x = -Math.PI / 2;
  ambientDisc.position.y = -1.155;
  scene.add(ambientDisc);

  function resize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
  }

  addEventListener('resize', resize);

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const elapsed = clock.getElapsedTime();
    boat.position.y = 0.02 + Math.sin(elapsed * 1.05) * 0.025;
    boat.rotation.z = Math.sin(elapsed * 0.72) * 0.012;
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
