let seed = 874231;
function random() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(min, max) {
  return min + (max - min) * random();
}

function canvasTexture(kind) {
  const canvas = document.createElement("canvas");
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext("2d");

  if (kind === "wood") {
    ctx.fillStyle = "#5b301b";
    ctx.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 40; i++) {
      const y = i * 7 + range(-3, 3);
      ctx.strokeStyle = i % 3 === 0 ? "#8c5430" : "#3a1d13";
      ctx.globalAlpha = range(0.18, 0.48);
      ctx.lineWidth = range(1, 4);
      ctx.beginPath();
      ctx.moveTo(0, y);
      for (let x = 0; x <= 256; x += 18) {
        ctx.lineTo(x, y + Math.sin(x * 0.07 + i) * range(1, 5));
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (let i = 0; i < 80; i++) {
      ctx.fillStyle = i % 2 ? "#351b13" : "#aa6840";
      ctx.globalAlpha = 0.12;
      ctx.fillRect(range(0, 256), range(0, 256), range(1, 8), range(1, 3));
    }
    ctx.globalAlpha = 1;
  }

  if (kind === "stone") {
    ctx.fillStyle = "#504b48";
    ctx.fillRect(0, 0, 256, 256);
    for (let y = 0; y < 256; y += 34) {
      const offset = (y / 34 % 2) * 18;
      for (let x = -30; x < 280; x += 58) {
        const px = x + offset + range(-4, 4);
        const py = y + range(-3, 3);
        ctx.fillStyle = ["#625d57", "#746d65", "#403e3d", "#81776b"][Math.floor(random() * 4)];
        ctx.beginPath();
        ctx.roundRect(px, py, 52 + range(-5, 5), 28 + range(-4, 4), 7);
        ctx.fill();
        ctx.strokeStyle = "#302e2d";
        ctx.globalAlpha = 0.7;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
  }

  if (kind === "knit") {
    ctx.fillStyle = "#657b82";
    ctx.fillRect(0, 0, 256, 256);
    ctx.strokeStyle = "#a7bab7";
    ctx.lineWidth = 4;
    for (let x = -256; x < 512; x += 18) {
      ctx.beginPath();
      for (let y = -20; y < 280; y += 14) {
        ctx.moveTo(x + Math.sin(y * 0.13) * 4, y);
        ctx.lineTo(x + 10 + Math.sin(y * 0.13) * 4, y + 8);
      }
      ctx.stroke();
    }
    ctx.strokeStyle = "#415b63";
    ctx.lineWidth = 2;
    for (let y = 5; y < 256; y += 22) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(256, y);
      ctx.stroke();
    }
  }

  if (kind === "rug") {
    ctx.fillStyle = "#6e3329";
    ctx.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 500; i++) {
      const edge = Math.min(i % 256, 255 - i % 256);
      ctx.fillStyle = i % 5 === 0 ? "#bf7658" : "#8c4635";
      ctx.globalAlpha = range(0.25, 0.7);
      ctx.fillRect(range(0, 256), range(0, 256), range(2, 12), range(1, 3));
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "#d0906b";
    ctx.lineWidth = 5;
    ctx.strokeRect(10, 10, 236, 236);
  }

  if (kind === "frost") {
    ctx.clearRect(0, 0, 256, 256);
    ctx.strokeStyle = "rgba(220,240,246,0.6)";
    ctx.lineWidth = 2;
    for (let i = 0; i < 22; i++) {
      const x = range(0, 256);
      const y = range(0, 256);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + range(-34, 34), y + range(8, 38));
      ctx.moveTo(x, y);
      ctx.lineTo(x + range(-18, 18), y + range(-28, 28));
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(220,240,246,0.16)";
    for (let i = 0; i < 35; i++) {
      ctx.beginPath();
      ctx.arc(range(0, 256), range(0, 256), range(5, 20), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.anisotropy = 4;
  return texture;
}

function box(w, h, d, x, y, z, material, cast = true, receive = true) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  scene.add(mesh);
  return mesh;
}

function cylinder(radiusTop, radiusBottom, height, x, y, z, material, segments = 16, rotation = null) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
    material
  );
  mesh.position.set(x, y, z);
  if (rotation) {
    mesh.rotation.set(rotation.x, rotation.y, rotation.z);
  }
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function sphere(radius, x, y, z, material, scale = null) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 20, 14), material);
  mesh.position.set(x, y, z);
  if (scale) {
    mesh.scale.set(scale.x, scale.y, scale.z);
  }
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function torus(radius, tube, x, y, z, material, rotation = null) {

  }

}

const flameClock = new THREE.Clock();

function animate() {
  const elapsed = flameClock.getElapsedTime();

  for (const part of fireParts) {
    const pulse = 0.88 + Math.sin(elapsed * part.speed + part.phase) * 0.14;
    const sway = Math.sin(elapsed * part.speed * 0.8 + part.phase) * 0.12;
    part.mesh.scale.set(
      part.baseScale.x * (pulse + sway * 0.12),
      part.baseScale.y * pulse,
      part.baseScale.z * (pulse - sway * 0.08)
    );
    part.mesh.rotation.y = Math.sin(elapsed * 1.3 + part.phase) * 0.18;
    part.mesh.rotation.z = Math.sin(elapsed * 1.7 + part.phase) * 0.1;
  }

  fireLight.intensity = 6.2 + Math.sin(elapsed * 7.1) * 0.55 + Math.sin(elapsed * 12.7) * 0.25;
  lampLight.intensity = 3.5 + Math.sin(elapsed * 4.7) * 0.18;
  lanternLight.intensity = 1.55 + Math.sin(elapsed * 3.8) * 0.12;
  candleLight.intensity = 1.0 + Math.sin(elapsed * 8.4) * 0.13;

  lanternFlame.scale.y = 1.45 + Math.sin(elapsed * 5.5) * 0.18;
  candleFlame.scale.y = 1.45 + Math.sin(elapsed * 8.1) * 0.16;

  for (const flake of snowflakes) {
    const data = flake.userData;
    flake.position.y -= data.speed * 0.008;
    flake.position.x = data.homeX + Math.sin(elapsed * 0.5 + data.phase) * 0.25;
    flake.rotation.z += 0.01;
    if (flake.position.y < 3.65) {
      flake.position.y = 7.45;
    }
  }

  for (const puff of steam) {
    const data = puff.userData;
    const travel = (elapsed * 0.22 + data.phase) % 1.8;
    puff.position.y = data.startY + travel * 0.65;
    puff.position.x = -1.67 + Math.sin(elapsed * 1.2 + data.phase) * data.drift;
    puff.position.z = 2.6 + Math.cos(elapsed * 1.1 + data.phase) * data.drift;
    puff.scale.setScalar(0.65 + travel * 0.42);
    puff.material.opacity = 0.25 * (1 - travel / 1.8);
  }

  for (const dust of ceilingDust) {
    const data = dust.userData;
    dust.position.x = data.base.x + Math.sin(elapsed * 0.2 + data.phase) * 0.4;
    dust.position.y = data.base.y + Math.sin(elapsed * 0.35 + data.phase) * 0.24;
    dust.position.z = data.base.z + Math.cos(elapsed * 0.25 + data.phase) * 0.35;
  }

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

renderer.setAnimationLoop(animate);
