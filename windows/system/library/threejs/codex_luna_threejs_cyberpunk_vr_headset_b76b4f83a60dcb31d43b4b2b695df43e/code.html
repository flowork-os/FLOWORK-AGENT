<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyberpunk VR Headset</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03040a}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03040a);
scene.fog = new THREE.Fog(0x03040a, 8, 18);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.35, 6.4);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.target.set(0,1.45,0);

const black = new THREE.MeshStandardMaterial({color:0x080a10, metalness:.72, roughness:.3});
const dark = new THREE.MeshStandardMaterial({color:0x11151d, metalness:.6, roughness:.38});
const edge = new THREE.MeshStandardMaterial({color:0x1c222c, metalness:.8, roughness:.25});
const cyan = new THREE.MeshStandardMaterial({color:0x15d8ff, emissive:0x00cfff, emissiveIntensity:5, metalness:.2, roughness:.22});
const magenta = new THREE.MeshStandardMaterial({color:0xff1bbd, emissive:0xff008f, emissiveIntensity:5, metalness:.2, roughness:.22});
const cyanLine = new THREE.LineBasicMaterial({color:0x42eaff, transparent:true, opacity:.86});
const pinkLine = new THREE.LineBasicMaterial({color:0xff38c7, transparent:true, opacity:.88});
const lensMat = new THREE.MeshPhysicalMaterial({
  color:0x101c27, metalness:.78, roughness:.12, transparent:true, opacity:.88,
  transmission:.08, clearcoat:1, clearcoatRoughness:.08, emissive:0x06121b,
  emissiveIntensity:.7
});

const headset = new THREE.Group();
headset.position.y = 1.42;
scene.add(headset);

function box(name, size, position, material, rotation={x:0,y:0,z:0}) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0],size[1],size[2]), material);
  mesh.name = name;
  mesh.position.set(position[0],position[1],position[2]);
  mesh.rotation.set(rotation.x,rotation.y,rotation.z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  headset.add(mesh);
  return mesh;
}

function panel(points, depth, z, material) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0],points[0][1]);
  for(let i=1;i<points.length;i++) shape.lineTo(points[i][0],points[i][1]);
  shape.closePath();
  const geometry = new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:true,bevelSegments:1,bevelSize:.025,bevelThickness:.025});
  geometry.translate(0,0,-depth/2);
  const mesh = new THREE.Mesh(geometry,material);
  mesh.position.z = z;
  mesh.castShadow = true;
  headset.add(mesh);
  return mesh;
}

function tube(points, radius, material) {
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve,32,radius,8,false),material);
  mesh.castShadow = true;
  headset.add(mesh);
  return mesh;
}

function line(points, material, closed=false) {
  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  const mesh = closed ? new THREE.LineLoop(geometry,material) : new THREE.Line(geometry,material);
  headset.add(mesh);
  return mesh;
}

box("rear chassis",[3.35,1.34,.72],[0,0,0],black,{x:0,y:0,z:0});
box("top crown",[2.95,.42,.86],[0,.72,-.02],dark,{x:-.08,y:0,z:0});
box("lower jaw",[2.8,.3,.75],[0,-.68,.03],black,{x:.08,y:0,z:0});
box("left temple",[.42,1.18,1.02],[-1.58,0,-.02],dark,{x:0,y:-.13,z:-.05});
box("right temple",[.42,1.18,1.02],[1.58,0,-.02],dark,{x:0,y:.13,z:.05});

const visor = new THREE.Mesh(new THREE.SphereGeometry(1,64,32),lensMat);
visor.scale.set(1.43,.57,.26);
visor.position.set(0,.02,.48);
visor.castShadow = true;
headset.add(visor);

panel([[-1.48,.48],[-.82,.67],[0,.69],[.82,.67],[1.48,.48],[1.3,.3],[.72,.4],[0,.44],[-.72,.4],[-1.3,.3]],.1,.4,edge);
panel([[-1.38,-.47],[-.7,-.58],[0,-.55],[.7,-.58],[1.38,-.47],[1.18,-.3],[.55,-.37],[0,-.34],[-.55,-.37],[-1.18,-.3]],.1,.42,black);

box("cyan brow strip",[1.9,.045,.035],[0,.57,.53],cyan,{x:0,y:0,z:0});
box("magenta left strip",[.055,.76,.035],[-1.43,.01,.5],magenta,{x:0,y:0,z:.08});
box("cyan right strip",[.055,.76,.035],[1.43,.01,.5],cyan,{x:0,y:0,z:-.08});
box("magenta chin strip",[1.45,.04,.035],[0,-.54,.52],magenta);

box("left hinge",[.18,.55,.18],[-1.73,-.03,.38],magenta,{x:0,y:.18,z:.12});
box("right hinge",[.18,.55,.18],[1.73,-.03,.38],cyan,{x:0,y:-.18,z:-.12});

const hud = new THREE.Group();
headset.add(hud);
function hudLine(points, material) {
  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  const item = new THREE.Line(geometry,material);
  hud.add(item);
  return item;
}
hudLine([new THREE.Vector3(-1.08,.12,.765),new THREE.Vector3(-.42,.12,.765),new THREE.Vector3(-.25,.24,.765),new THREE.Vector3(.35,.24,.765)],cyanLine);
hudLine([new THREE.Vector3(.53,.24,.765),new THREE.Vector3(.9,.24,.765),new THREE.Vector3(1.08,.08,.765)],pinkLine);
hudLine([new THREE.Vector3(-.92,-.18,.765),new THREE.Vector3(-.6,-.32,.765),new THREE.Vector3(-.08,-.32,.765)],pinkLine);
hudLine([new THREE.Vector3(.18,-.32,.765),new THREE.Vector3(.65,-.2,.765),new THREE.Vector3(.94,-.2,.765)],cyanLine);
const hudRing = new THREE.Mesh(new THREE.RingGeometry(.25,.27,32),new THREE.MeshBasicMaterial({color:0x39eaff,transparent:true,opacity:.8,side:THREE.DoubleSide}));
hudRing.position.set(0,.02,.77);
hud.add(hudRing);
hudLine([new THREE.Vector3(-.38,.02,.78),new THREE.Vector3(.38,.02,.78)],pinkLine);
hudLine([new THREE.Vector3(0,-.38,.78),new THREE.Vector3(0,.38,.78)],cyanLine);
const hudBox = hudLine([
  new THREE.Vector3(-.72,.37,.77),new THREE.Vector3(-.32,.37,.77),
  new THREE.Vector3(-.32,-.4,.77),new THREE.Vector3(-.72,-.4,.77),
  new THREE.Vector3(-.72,.37,.77)
],pinkLine);

const cableMat = new THREE.MeshStandardMaterial({color:0x090b12,metalness:.65,roughness:.28});
const cableGlow = new THREE.MeshStandardMaterial({color:0x72104f,emissive:0x41002f,emissiveIntensity:2.2,metalness:.35,roughness:.3});
tube([new THREE.Vector3(-1.64,.42,-.28),new THREE.Vector3(-1.9,.18,-.58),new THREE.Vector3(-1.74,-.34,-.64),new THREE.Vector3(-1.42,-.55,-.35)],.055,cableMat);
tube([new THREE.Vector3(-1.58,.32,-.31),new THREE.Vector3(-1.84,.03,-.65),new THREE.Vector3(-1.66,-.27,-.72),new THREE.Vector3(-1.35,-.49,-.4)],.018,cableGlow);
tube([new THREE.Vector3(1.64,.42,-.28),new THREE.Vector3(1.9,.18,-.58),new THREE.Vector3(1.74,-.34,-.64),new THREE.Vector3(1.42,-.55,-.35)],.055,cableMat);
tube([new THREE.Vector3(1.58,.32,-.31),new THREE.Vector3(1.84,.03,-.65),new THREE.Vector3(1.66,-.27,-.72),new THREE.Vector3(1.35,-.49,-.4)],.018,cyan);

const logo = new THREE.Group();
headset.add(logo);
const logoMat = new THREE.LineBasicMaterial({color:0xff30c3,transparent:true,opacity:.95});
const logoPts = [
  new THREE.Vector3(-.24,-.2,.79),new THREE.Vector3(0,-.04,.79),
  new THREE.Vector3(.24,-.2,.79),new THREE.Vector3(0,-.36,.79),
  new THREE.Vector3(-.24,-.2,.79),
  new THREE.Vector3(0,-.04,.79),new THREE.Vector3(0,-.36,.79)
];
logo.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(logoPts),logoMat));

const ledLeft = new THREE.PointLight(0xff008e,2.2,4);
ledLeft.position.set(-2,.2,1);
headset.add(ledLeft);
const ledRight = new THREE.PointLight(0x00d9ff,2.4,4);
ledRight.position.set(2,.2,1);
headset.add(ledRight);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(6,64),
  new THREE.MeshStandardMaterial({color:0x050711,metalness:.15,roughness:.72})
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -.9;
floor.receiveShadow = true;
scene.add(floor);

const ring = new THREE.Mesh(
  new THREE.RingGeometry(2.15,2.18,96),
  new THREE.MeshBasicMaterial({color:0x1b3150,transparent:true,opacity:.45,side:THREE.DoubleSide})
);
ring.rotation.x = -Math.PI/2;
ring.position.y = -.895;
scene.add(ring);

scene.add(new THREE.HemisphereLight(0x304b78,0x050509,1.15));
const key = new THREE.DirectionalLight(0x9bc9ff,2.1);
key.position.set(-4,5,6);
key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
scene.add(key);
const rim = new THREE.PointLight(0xff006f,5,8);
rim.position.set(0,2.2,-2.8);
scene.add(rim);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  hud.rotation.z = Math.sin(t*.55)*.008;
  hud.position.x = Math.sin(t*1.7)*.012;
  hud.visible = Math.sin(t*18.0) > -.92;
  hudRing.rotation.z = t*.7;
  ledLeft.intensity = 1.8 + Math.sin(t*3.2)*.5;
  ledRight.intensity = 2.1 + Math.sin(t*2.7+1)*.55;
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
