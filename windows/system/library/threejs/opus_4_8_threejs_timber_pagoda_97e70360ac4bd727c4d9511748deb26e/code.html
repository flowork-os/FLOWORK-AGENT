<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Timber Pagoda Garden Structure</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #161719; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 -apple-system, Segoe UI, Roboto, sans-serif;
    color: rgba(230,225,215,0.45); letter-spacing: .3px; user-select: none;
    pointer-events: none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hint">drag to orbit · scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------------------------------------------------------- *
 *  Renderer / Scene / Camera
 * ---------------------------------------------------------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const BG = new THREE.Color(0x161719);
scene.background = BG;
scene.fog = new THREE.Fog(BG, 22, 60);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(8.5, 5.4, 10);

/* ---------------------------------------------------------------- *
 *  Lighting: hemisphere ambient + key / fill / rim
 * ---------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0xcfd8e6, 0x2a2420, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2df, 2.6);
key.position.set(7, 11.5, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 42;
key.shadow.camera.left = -9;
key.shadow.camera.right = 9;
key.shadow.camera.top = 11;
key.shadow.camera.bottom = -2;
key.shadow.bias = -0.0004;
key.shadow.radius = 3;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd0ff, 0.5);
fill.position.set(-9, 5, -3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffca8a, 1.15);
rim.position.set(-5, 7, -9);
scene.add(rim);

/* ---------------------------------------------------------------- *
 *  Ground plane (shadow-catcher only)
 * ---------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(140, 140),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------- *
 *  Procedural textures (canvas — no external assets)
 * ---------------------------------------------------------------- */
function cvs(s) { const c = document.createElement('canvas'); c.width = c.height = s; return c; }

function woodTex(base, dark, rep) {
  const c = cvs(512), x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 260; i++) {
    x.globalAlpha = 0.05 + Math.random() * 0.12;
    x.strokeStyle = Math.random() < 0.6 ? dark : '#d9c3a0';
    x.lineWidth = 0.6 + Math.random() * 2.4;
    x.beginPath();
    let px = Math.random() * 512; x.moveTo(px, 0);
    for (let y = 0; y <= 512; y += 10) { px += (Math.random() - 0.5) * 3; x.lineTo(px, y); }
    x.stroke();
  }
  x.globalAlpha = 0.5;
  for (let k = 0; k < 5; k++) {
    const kx = Math.random() * 512, ky = Math.random() * 512, r = 4 + Math.random() * 10;
    const g = x.createRadialGradient(kx, ky, 1, kx, ky, r);
    g.addColorStop(0, dark); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.beginPath(); x.arc(kx, ky, r, 0, 7); x.fill();
  }
  x.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rep, rep);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function stoneTex(base) {
  const c = cvs(256), x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 3200; i++) {
    const l = 118 + ((Math.random() - 0.5) * 46) | 0;
    x.fillStyle = 'rgba(' + l + ',' + l + ',' + (l - 8) + ',0.06)';
    x.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2, 2);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function tileTex(base, dark) {
  const c = cvs(512), x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0, 0, 512, 512);
  const rows = 14, rh = 512 / rows;
  for (let r = 0; r < rows; r++) {
    const y = r * rh;
    x.globalAlpha = 0.5; x.fillStyle = dark; x.fillRect(0, y + rh - 3, 512, 3);
    for (let px = 0; px < 512; px += 26) {
      x.globalAlpha = 0.18; x.fillStyle = dark; x.fillRect(px - 1, y, 2, rh);
      x.globalAlpha = 0.06; x.fillStyle = '#ffffff'; x.fillRect(px + 11, y, 2, rh);
    }
  }
  x.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(6, 6);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ---------------------------------------------------------------- *
 *  Materials — natural timber palette
 * ---------------------------------------------------------------- */
const woodMat      = new THREE.MeshStandardMaterial({ map: woodTex('#7a5230', '#42280f', 3), roughness: 0.82, metalness: 0.03 });
const beamMat      = new THREE.MeshStandardMaterial({ map: woodTex('#6f4a2b', '#3a220e', 2), roughness: 0.85, metalness: 0.03 });
const deckMat      = new THREE.MeshStandardMaterial({ map: woodTex('#87613a', '#4a3018', 4), roughness: 0.8,  metalness: 0.02 });
const bracketMat   = new THREE.MeshStandardMaterial({ map: woodTex('#6a4526', '#3a220e', 1), roughness: 0.8,  metalness: 0.03 });
const tileMat      = new THREE.MeshStandardMaterial({ map: tileTex('#5c4126', '#2e1d0e'),    roughness: 0.72, metalness: 0.05, side: THREE.DoubleSide });
const roofUnderMat = new THREE.MeshStandardMaterial({ map: woodTex('#8a5f38', '#4a2f18', 3), roughness: 0.85, metalness: 0.02, side: THREE.DoubleSide });
const ridgeMat     = new THREE.MeshStandardMaterial({ color: 0x4a3520, roughness: 0.7, metalness: 0.05 });
const stoneMat     = new THREE.MeshStandardMaterial({ map: stoneTex('#8f8c85'), color: 0x9a968e, roughness: 0.95, metalness: 0.0 });
const bronzeMat    = new THREE.MeshStandardMaterial({ color: 0x8a6a2e, roughness: 0.35, metalness: 0.9 });

/* ---------------------------------------------------------------- *
 *  Geometry helpers
 * ---------------------------------------------------------------- */
function mkBox(w, h, d, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.castShadow = true; m.receiveShadow = true; return m;
}
function meshS(geo, mat) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true; return m;
}
function place(obj, x, y, z) { obj.position.set(x, y, z); return obj; }
function vpost(x, z, y0, y1, w, mat) {
  const m = mkBox(w, y1 - y0, w, mat);
  m.position.set(x, (y0 + y1) / 2, z);
  return m;
}
function cyl(rt, rb, h, seg, mat) { return meshS(new THREE.CylinderGeometry(rt, rb, h, seg), mat); }
function strut(a, b, w, mat) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = mkBox(w, w, len, mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir.clone().normalize());
  return m;
}

/* ---------------------------------------------------------------- *
 *  Restrained ornamental bracket cluster (dougong-style)
 * ---------------------------------------------------------------- */
function bracket(mat) {
  const g = new THREE.Group();
  g.add(place(mkBox(0.28, 0.16, 0.28, mat), 0, 0.08, 0));    // base block (dou)
  g.add(place(mkBox(0.95, 0.11, 0.16, mat), 0, 0.20, 0));    // arm along x (gong)
  g.add(place(mkBox(0.16, 0.11, 0.95, mat), 0, 0.20, 0));    // arm along z
  const e = 0.42;
  [[e, 0], [-e, 0], [0, e], [0, -e]].forEach(p =>
    g.add(place(mkBox(0.16, 0.12, 0.16, mat), p[0], 0.31, p[1])));
  g.add(place(mkBox(0.20, 0.12, 0.20, mat), 0, 0.31, 0));    // center block
  return g;
}

/* ---------------------------------------------------------------- *
 *  Curved hip roof with wide upturned eaves (custom BufferGeometry)
 * ---------------------------------------------------------------- */
function buildRoofGeometry(size, apexLocal, cornerLift, thickness, N) {
  const positions = [], uvs = [], indices = [];
  const H = (u, v) => {
    const a = Math.abs(u), b = Math.abs(v), m = Math.max(a, b), corner = a * b;
    return apexLocal * (1 - Math.pow(m, 0.72)) + cornerLift * Math.pow(m, 2.6) * corner;
  };
  const row = N + 1;
  const gv = (i, j) => i * row + j;

  // top surface
  for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
    const u = i / N * 2 - 1, v = j / N * 2 - 1;
    positions.push(u * size, H(u, v), v * size);
    uvs.push(i / N, j / N);
  }
  const bo = row * row;
  // bottom (underside) surface
  for (let i = 0; i <= N; i++) for (let j = 0; j <= N; j++) {
    const u = i / N * 2 - 1, v = j / N * 2 - 1;
    positions.push(u * size, H(u, v) - thickness, v * size);
    uvs.push(i / N, j / N);
  }
  // top faces
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const a = gv(i, j), b = gv(i + 1, j), c = gv(i + 1, j + 1), d = gv(i, j + 1);
    indices.push(a, d, c, a, c, b);
  }
  const topCount = indices.length;
  // bottom faces
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const a = bo + gv(i, j), b = bo + gv(i + 1, j), c = bo + gv(i + 1, j + 1), d = bo + gv(i, j + 1);
    indices.push(a, c, d, a, b, c);
  }
  // rim (eave edge thickness)
  const edge = (iF, jF) => {
    for (let k = 0; k < N; k++) {
      const t0 = gv(iF(k), jF(k)), t1 = gv(iF(k + 1), jF(k + 1));
      indices.push(t0, t1, bo + t1, t0, bo + t1, bo + t0);
    }
  };
  edge(k => k, () => 0);
  edge(k => k, () => N);
  edge(() => 0, k => k);
  edge(() => N, k => k);

  const restCount = indices.length - topCount;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(indices);
  g.addGroup(0, topCount, 0);        // tiles on top
  g.addGroup(topCount, restCount, 1); // timber underside + rim
  g.computeVertexNormals();
  return g;
}

function buildTier(eaveY, size, apexLocal, cornerLift, thickness) {
  const g = new THREE.Group();
  const roof = new THREE.Mesh(
    buildRoofGeometry(size, apexLocal, cornerLift, thickness, 26),
    [tileMat, roofUnderMat]
  );
  roof.castShadow = true; roof.receiveShadow = true;
  g.add(roof);

  // hip ridges + upturned corner tips
  const apex = new THREE.Vector3(0, apexLocal + 0.02, 0);
  [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([sx, sz]) => {
    const cp = new THREE.Vector3(sx * size, cornerLift + 0.04, sz * size);
    g.add(strut(apex, cp, 0.1, ridgeMat));
    const tip = new THREE.Vector3(sx * (size + 0.28), cornerLift + 0.34, sz * (size + 0.28));
    g.add(strut(cp, tip, 0.09, ridgeMat));
  });
  const boss = cyl(0.14, 0.17, 0.18, 8, ridgeMat);
  boss.position.y = apexLocal + 0.05;
  g.add(boss);

  g.position.y = eaveY;
  return g;
}

/* ---------------------------------------------------------------- *
 *  Crowning finial (sorin)
 * ---------------------------------------------------------------- */
function finial(mat) {
  const g = new THREE.Group();
  g.add(place(cyl(0.16, 0.22, 0.14, 12, ridgeMat), 0, 0.07, 0));
  g.add(place(cyl(0.045, 0.05, 1.0, 12, mat), 0, 0.6, 0));
  for (let i = 0; i < 5; i++) {
    const r = 0.2 - i * 0.03;
    const t = meshS(new THREE.TorusGeometry(r, 0.028, 8, 22), mat);
    t.rotation.x = Math.PI / 2;
    t.position.y = 0.32 + i * 0.13;
    g.add(t);
  }
  g.add(place(meshS(new THREE.SphereGeometry(0.12, 18, 14), mat), 0, 1.06, 0));
  g.add(place(cyl(0.0, 0.03, 0.24, 8, mat), 0, 1.28, 0));
  return g;
}

/* ---------------------------------------------------------------- *
 *  Perimeter railing
 * ---------------------------------------------------------------- */
function makeRail(len) {
  const g = new THREE.Group();
  g.add(place(mkBox(len, 0.10, 0.10, beamMat), 0, 1.18, 0));
  g.add(place(mkBox(len, 0.08, 0.08, beamMat), 0, 0.76, 0));
  const n = Math.round(len / 0.4);
  for (let i = 0; i <= n; i++) {
    const x = -len / 2 + i * (len / n);
    g.add(place(mkBox(0.05, 0.40, 0.05, beamMat), x, 0.97, 0));
  }
  return g;
}

/* ---------------------------------------------------------------- *
 *  Assemble the single centered structure
 * ---------------------------------------------------------------- */
const pagoda = new THREE.Group();
const P = 1.55;   // ground corner-post offset

// stepped stone plinth + timber deck
pagoda.add(place(mkBox(4.4, 0.28, 4.4, stoneMat), 0, 0.14, 0));
pagoda.add(place(mkBox(4.0, 0.26, 4.0, stoneMat), 0, 0.41, 0));
pagoda.add(place(mkBox(3.7, 0.09, 3.7, deckMat), 0, 0.585, 0));

// corner column bases + posts
const corners = [[P, P], [P, -P], [-P, P], [-P, -P]];
corners.forEach(([x, z]) => {
  pagoda.add(place(mkBox(0.34, 0.16, 0.34, stoneMat), x, 0.71, z));
  pagoda.add(vpost(x, z, 0.79, 3.0, 0.2, woodMat));
});

// head beams around post tops
[P, -P].forEach(z => pagoda.add(place(mkBox(2 * P + 0.24, 0.20, 0.18, beamMat), 0, 2.86, z)));
[P, -P].forEach(x => pagoda.add(place(mkBox(0.18, 0.20, 2 * P + 0.24, beamMat), x, 2.86, 0)));

// railing on all four sides (symmetrical)
const railLen = 2 * P - 0.24;
[[0, P, 0], [0, -P, 0], [P, 0, Math.PI / 2], [-P, 0, Math.PI / 2]].forEach(([x, z, ry]) => {
  const r = makeRail(railLen);
  r.position.set(x, 0, z);
  r.rotation.y = ry;
  pagoda.add(r);
});

// brackets: four corners + four edge midpoints
[[P, P], [P, -P], [-P, P], [-P, -P], [P, 0], [-P, 0], [0, P], [0, -P]].forEach(([x, z]) => {
  const b = bracket(bracketMat);
  b.position.set(x, 3.0, z);
  pagoda.add(b);
});

// tier 1 roof (widest, lowest)
pagoda.add(buildTier(3.2, 2.7, 1.2, 0.55, 0.16));

// tier 2 story + roof
const P2 = 1.05;
[[P2, P2], [P2, -P2], [-P2, P2], [-P2, -P2]].forEach(([x, z]) => {
  pagoda.add(vpost(x, z, 3.8, 4.85, 0.16, woodMat));
  const b = bracket(bracketMat);
  b.scale.set(0.6, 0.6, 0.6);
  b.position.set(x, 4.8, z);
  pagoda.add(b);
});
[P2, -P2].forEach(z => pagoda.add(place(mkBox(2 * P2 + 0.2, 0.16, 0.14, beamMat), 0, 4.72, z)));
[P2, -P2].forEach(x => pagoda.add(place(mkBox(0.14, 0.16, 2 * P2 + 0.2, beamMat), x, 4.72, 0)));
pagoda.add(buildTier(4.85, 1.95, 0.95, 0.42, 0.14));

// tier 3 story + roof (smallest)
const P3 = 0.72;
[[P3, P3], [P3, -P3], [-P3, P3], [-P3, -P3]].forEach(([x, z]) => {
  pagoda.add(vpost(x, z, 5.35, 6.1, 0.13, woodMat));
  const b = bracket(bracketMat);
  b.scale.set(0.44, 0.44, 0.44);
  b.position.set(x, 6.02, z);
  pagoda.add(b);
});
[P3, -P3].forEach(z => pagoda.add(place(mkBox(2 * P3 + 0.16, 0.13, 0.12, beamMat), 0, 6.0, z)));
[P3, -P3].forEach(x => pagoda.add(place(mkBox(0.12, 0.13, 2 * P3 + 0.16, beamMat), x, 6.0, 0)));
pagoda.add(buildTier(6.1, 1.35, 0.72, 0.32, 0.12));

// finial
const fin = finial(bronzeMat);
fin.position.y = 6.82;
pagoda.add(fin);

scene.add(pagoda);

/* ---------------------------------------------------------------- *
 *  Controls
 * ---------------------------------------------------------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.target.set(0, 3.3, 0);
controls.minDistance = 6;
controls.maxDistance = 26;
controls.maxPolarAngle = Math.PI * 0.495;
controls.update();

/* ---------------------------------------------------------------- *
 *  Render loop + resize
 * ---------------------------------------------------------------- */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
