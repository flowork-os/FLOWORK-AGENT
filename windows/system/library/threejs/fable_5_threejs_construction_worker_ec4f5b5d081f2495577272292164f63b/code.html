<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Construction Worker</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#dfe7ec}canvas{display:block}</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe7ec);
scene.fog = new THREE.Fog(0xdfe7ec, 12, 26);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.0, 1.9, 4.4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// --- lighting ---
scene.add(new THREE.HemisphereLight(0xf7fbff, 0x8d8578, 0.85));
const key = new THREE.DirectionalLight(0xfff1dd, 1.7);
key.position.set(4, 6, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -3;
key.shadow.camera.right = key.shadow.camera.top = 3;
key.shadow.camera.near = 1;
key.shadow.camera.far = 15;
key.shadow.bias = -0.0004;
scene.add(key);
const rim = new THREE.DirectionalLight(0xcfe0ff, 0.5);
rim.position.set(-4, 3, -4);
scene.add(rim);

// --- ground with soft shadow ---
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(10, 64),
  new THREE.MeshStandardMaterial({ color: 0xd3dbe0, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// --- materials ---
const M = (c, r = 0.8, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
const skin = M(0xd99e7c, 0.6);
const shirt = M(0x51626f, 0.85);
const vest = new THREE.MeshStandardMaterial({ color: 0xff6a00, roughness: 0.75, emissive: 0x8f2b00, emissiveIntensity: 0.15 });
const stripe = new THREE.MeshStandardMaterial({ color: 0xe8edf2, roughness: 0.3, metalness: 0.3, emissive: 0xaab3bc, emissiveIntensity: 0.5 });
const pants = M(0x39424e, 0.9);
const boot = M(0x7a5230, 0.8);
const steel = M(0xc9ced4, 0.25, 0.9);
const hatM = M(0xf7c81e, 0.35);
const dark = M(0x2e2a26, 0.5);

// --- worker ---
const worker = new THREE.Group();
scene.add(worker);
const add = (geo, mat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1, parent = worker) => {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.scale.set(sx, sy, sz);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
};

// hips + legs (relaxed stance, feet slightly apart & turned out)
add(new THREE.CylinderGeometry(0.235, 0.25, 0.2, 24), pants, 0, 0.97);
for (const s of [-1, 1]) {
  add(new THREE.CapsuleGeometry(0.095, 0.6, 6, 16), pants, s * 0.13, 0.58, 0, 0, 0, s * 0.03);
  const foot = new THREE.Group();
  foot.position.set(s * 0.14, 0, 0.02);
  foot.rotation.y = s * 0.18;
  worker.add(foot);
  add(new THREE.CylinderGeometry(0.1, 0.105, 0.16, 16), boot, 0, 0.2, 0, 0, 0, 0, 1, 1, 1, foot);
  add(new THREE.BoxGeometry(0.18, 0.13, 0.3), boot, 0, 0.1, 0.05, 0, 0, 0, 1, 1, 1, foot);
  add(new THREE.SphereGeometry(0.088, 16, 12), steel, 0, 0.085, 0.19, 0, 0, 0, 1, 0.8, 1, foot); // steel toe
  add(new THREE.BoxGeometry(0.19, 0.05, 0.35), dark, 0, 0.028, 0.05, 0, 0, 0, 1, 1, 1, foot);   // sole
}

// torso (shirt) + hi-vis vest with reflective stripes
add(new THREE.CapsuleGeometry(0.24, 0.42, 6, 20), shirt, 0, 1.2);
add(new THREE.CylinderGeometry(0.27, 0.3, 0.52, 24, 1, true), vest, 0, 1.19);
add(new THREE.CylinderGeometry(0.305, 0.305, 0.055, 24, 1, true), stripe, 0, 1.06);            // horizontal band
for (const s of [-1, 1]) {
  add(new THREE.SphereGeometry(0.095, 16, 12), vest, s * 0.26, 1.42);                          // vest shoulders
  for (const z of [-1, 1])
    add(new THREE.BoxGeometry(0.055, 0.36, 0.02), stripe, s * 0.1, 1.24, z * 0.285, z * -0.05); // vertical strips
}

// arms (shirt sleeves) + hands, hanging relaxed
for (const s of [-1, 1]) {
  add(new THREE.CapsuleGeometry(0.066, 0.52, 6, 14), shirt, s * 0.345, 1.06, 0.01, 0.04, 0, s * 0.1);
  add(new THREE.SphereGeometry(0.07, 14, 12), skin, s * 0.375, 0.72, 0.03, 0, 0, 0, 1, 1.2, 1);
}

// neck + head (generic face)
add(new THREE.CylinderGeometry(0.07, 0.08, 0.12, 14), skin, 0, 1.47);
add(new THREE.SphereGeometry(0.17, 28, 22), skin, 0, 1.62, 0, 0, 0, 0, 0.95, 1.05, 0.95);
for (const s of [-1, 1]) {
  add(new THREE.SphereGeometry(0.035, 10, 8), skin, s * 0.155, 1.62, 0, 0, 0, 0, 0.6, 1, 1);   // ears
  add(new THREE.SphereGeometry(0.018, 10, 8), dark, s * 0.06, 1.655, 0.148);                   // eyes
  add(new THREE.BoxGeometry(0.05, 0.012, 0.012), M(0x5a4632, 0.7), s * 0.06, 1.7, 0.15);       // brows
}
add(new THREE.SphereGeometry(0.028, 10, 8), skin, 0, 1.615, 0.165, 0, 0, 0, 1, 1.2, 1);        // nose
add(new THREE.BoxGeometry(0.06, 0.013, 0.012), M(0xb5806b, 0.7), 0, 1.545, 0.152);             // mouth

// hard hat: dome, ellipse brim, top ridge
add(new THREE.SphereGeometry(0.21, 28, 18, 0, Math.PI * 2, 0, Math.PI / 2), hatM, 0, 1.72, 0, 0, 0, 0, 1, 0.82, 1.05);
add(new THREE.CylinderGeometry(0.245, 0.26, 0.028, 28), hatM, 0, 1.715, 0.01, 0, 0, 0, 1, 1, 1.2);
add(new THREE.BoxGeometry(0.055, 0.03, 0.3), hatM, 0, 1.885, 0);

// --- controls ---
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.6;
controls.minDistance = 2;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI / 2 - 0.02;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
