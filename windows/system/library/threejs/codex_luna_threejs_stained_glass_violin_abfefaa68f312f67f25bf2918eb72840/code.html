<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stained Glass Violin</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080b18;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b18);
scene.fog = new THREE.Fog(0x080b18, 12, 22);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.35, 12.2);
camera.lookAt(0, 0.35, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 8;
controls.maxDistance = 16;
controls.target.set(0, 0.35, 0);

const violin = new THREE.Group();
violin.rotation.y = -0.08;
scene.add(violin);

const amber = new THREE.MeshPhysicalMaterial({
  color: 0xd97825,
  emissive: 0x7e2f0b,
  emissiveIntensity: 0.42,
  roughness: 0.22,
  metalness: 0.04,
  transmission: 0.08,
  thickness: 0.18,
  transparent: true,
  opacity: 0.96,
  side: THREE.DoubleSide
});

const amberLight = new THREE.MeshPhysicalMaterial({
  color: 0xffb83e,
  emissive: 0xb64c0b,
  emissiveIntensity: 0.55,
  roughness: 0.2,
  metalness: 0.03,

  opacity: 0.95,
  side: THREE.DoubleSide
});

const ruby = new THREE.MeshPhysicalMaterial({

  side: THREE.DoubleSide
});

const rubyLight = new THREE.MeshPhysicalMaterial({
  color: 0xd94147,
  emissive: 0x8c1023,
  emissiveIntensity: 0.46,
  roughness: 0.2,
  metalness: 0.04,
  transmission: 0.08,
  thickness: 0.16,

  opacity: 0.95,
  side: THREE.DoubleSide
});

const cobalt = new THREE.MeshPhysicalMaterial({
  color: 0x164c9c,
  emissive: 0x08265e,
  emissiveIntensity: 0.52,
  roughness: 0.2,
  metalness: 0.06,
  transmission: 0.08,
  thickness: 0.18,
  transparent: true,
  opacity: 0.96,
  side: THREE.DoubleSide
});

const cobaltLight = new THREE.MeshPhysicalMaterial({
  color: 0x2384c4,
  emissive: 0x0b477b,
  emissiveIntensity: 0.46,
  roughness: 0.19,
  metalness: 0.05,
  transmission: 0.08,
  thickness: 0.16,
  transparent: true,
  opacity: 0.95,
  side: THREE.DoubleSide
});

const lead = new THREE.MeshStandardMaterial({
  color: 0x151522,
  emissive: 0x070812,
  emissiveIntensity: 0.3,
  roughness: 0.3,
  metalness: 0.72
});

const leadHighlight = new THREE.MeshStandardMaterial({
  color: 0x3d3640,
  emissive: 0x17101b,
  emissiveIntensity: 0.35,
  roughness: 0.22,
  metalness: 0.8

const woodDark = new THREE.MeshStandardMaterial({
  color: 0x28141b,
  emissive: 0x19060c,
  emissiveIntensity: 0.4,
  roughness: 0.34,
  metalness: 0.2
});

const ivory = new THREE.MeshStandardMaterial({
  color: 0xffd98d,
  emissive: 0xa75b20,
  emissiveIntensity: 0.7,
  roughness: 0.24,
  metalness: 0.2
});

function makeBodyShape() {
  const shape = new THREE.Shape();
  shape.moveTo(0, -3.25);
  shape.bezierCurveTo(-0.72, -3.6, -1.82, -3.28, -2.05, -2.32);
  shape.bezierCurveTo(-2.25, -1.48, -1.64, -0.98, -1.04, -0.58);
  shape.bezierCurveTo(-0.72, -0.36, -0.7, 0.02, -1.02, 0.4);
  shape.bezierCurveTo(-1.58, 0.94, -1.68, 1.68, -1.28, 2.15);
  shape.bezierCurveTo(-0.91, 2.58, -0.39, 2.65, 0, 2.66);
  shape.bezierCurveTo(0.39, 2.65, 0.91, 2.58, 1.28, 2.15);
  shape.bezierCurveTo(1.68, 1.68, 1.58, 0.94, 1.02, 0.4);
  shape.bezierCurveTo(0.7, 0.02, 0.72, -0.36, 1.04, -0.58);
  shape.bezierCurveTo(1.64, -0.98, 2.25, -1.48, 2.05, -2.32);
  shape.bezierCurveTo(1.82, -3.28, 0.72, -3.6, 0, -3.25);
  return shape;
}

function makeExtruded(shape, material, depth, bevelSize, zPosition) {
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth,
    curveSegments: 12,
    bevelEnabled: true,
    bevelSegments: 2,
    bevelThickness: bevelSize,
    bevelSize,
    steps: 1
  });
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.z = zPosition;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  violin.add(mesh);
  return mesh;
}

function makePolygon(points, material, zPosition) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let index = 1; index < points.length; index += 1) {
    shape.lineTo(points[index][0], points[index][1]);
  }
  shape.closePath();
  const geometry = new THREE.ShapeGeometry(shape);
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.z = zPosition;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  violin.add(mesh);
  return mesh;
}

function makeTube(points, radius, material, zPosition, tubularSegments = 36) {
  const curvePoints = points.map((point) => new THREE.Vector3(point[0], point[1], zPosition));
  const curve = new THREE.CatmullRomCurve3(curvePoints, false, "centripetal", 0.5);
  const geometry = new THREE.TubeGeometry(curve, tubularSegments, radius, 7, false);
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  violin.add(mesh);
  return mesh;
}

function makeSphere(radius, material, x, y, z) {
  const geometry = new THREE.SphereGeometry(radius, 16, 10);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  violin.add(mesh);
  return mesh;
}

const bodyShape = makeBodyShape();
makeExtruded(bodyShape, lead, 0.48, 0.065, -0.24);

const bodyPanels = [
  {
    points: [[-0.04, -3.12], [-0.58, -3.04], [-0.98, -2.63], [-0.64, -1.82], [-0.13, -1.66], [0, -2.26]],
    material: amberLight
  },
  {
    points: [[0.04, -3.12], [0.58, -3.04], [0.98, -2.63], [0.64, -1.82], [0.13, -1.66], [0, -2.26]],
    material: rubyLight
  },
  {
    points: [[-0.63, -1.83], [-0.98, -2.63], [-1.54, -2.67], [-1.88, -2.13], [-1.76, -1.51], [-1.16, -1.32]],
    material: ruby
  },
  {
    points: [[0.63, -1.83], [0.98, -2.63], [1.54, -2.67], [1.88, -2.13], [1.76, -1.51], [1.16, -1.32]],
    material: amber
  },
  {
    points: [[-1.16, -1.32], [-1.76, -1.51], [-1.86, -1.02], [-1.46, -0.66], [-1.01, -0.57], [-0.7, -0.42]],
    material: cobalt
  },
  {
    points: [[1.16, -1.32], [1.76, -1.51], [1.86, -1.02], [1.46, -0.66], [1.01, -0.57], [0.7, -0.42]],
    material: cobaltLight
  },
  {
    points: [[-0.7, -0.42], [-1.01, -0.57], [-1.47, 0.03], [-1.51, 0.73], [-0.91, 1.08], [-0.54, 0.61], [0, 0.5]],
    material: amber
  },
  {
    points: [[0.7, -0.42], [1.01, -0.57], [1.47, 0.03], [1.51, 0.73], [0.91, 1.08], [0.54, 0.61], [0, 0.5]],
    material: ruby
  },
  {
    points: [[-0.54, 0.61], [-0.91, 1.08], [-1.43, 1.55], [-1.31, 2.06], [-0.84, 2.39], [-0.42, 1.78], [0, 1.58], [0, 0.5]],
    material: cobaltLight
  },
  {
    points: [[0.54, 0.61], [0.91, 1.08], [1.43, 1.55], [1.31, 2.06], [0.84, 2.39], [0.42, 1.78], [0, 1.58], [0, 0.5]],
    material: amberLight
  },
  {
    points: [[-0.84, 2.39], [-1.31, 2.06], [-0.82, 2.53], [-0.2, 2.6], [-0.42, 1.78]],
    material: rubyLight
  },
  {
    points: [[0.84, 2.39], [1.31, 2.06], [0.82, 2.53], [0.2, 2.6], [0.42, 1.78]],
    material: cobalt
  },
  {
    points: [[-0.42, 1.78], [-0.2, 2.6], [0, 2.63], [0, 1.58]],
    material: amber
  },
  {
    points: [[0.42, 1.78], [0.2, 2.6], [0, 2.63], [0, 1.58]],
    material: ruby
  }
];

for (const panel of bodyPanels) {
  makePolygon(panel.points, panel.material, 0.275);
}

makeTube([[-1.9, -2.16], [-1.96, -1.74], [-1.74, -1.34], [-1.27, -1.04], [-0.98, -0.62]], 0.045, leadHighlight, 0.34);
makeTube([[1.9, -2.16], [1.96, -1.74], [1.74, -1.34], [1.27, -1.04], [0.98, -0.62]], 0.045, leadHighlight, 0.34);
makeTube([[-1.47, 0.04], [-0.98, 0.22], [-0.63, 0.5], [-0.46, 0.82]], 0.038, leadHighlight, 0.345);
makeTube([[1.47, 0.04], [0.98, 0.22], [0.63, 0.5], [0.46, 0.82]], 0.038, leadHighlight, 0.345);
makeTube([[-1.53, 1.55], [-0.98, 1.56], [-0.55, 1.78], [-0.2, 2.35]], 0.04, leadHighlight, 0.345);
makeTube([[1.53, 1.55], [0.98, 1.56], [0.55, 1.78], [0.2, 2.35]], 0.04, leadHighlight, 0.345);
makeTube([[0, -3.0], [0, -2.25], [0, -1.65], [0, -0.6]], 0.035, leadHighlight, 0.35);

function addFHole(side) {
  const direction = side < 0 ? -1 : 1;
  const holePoints = [
    [direction * 0.98, 0.94],
    [direction * 1.18, 0.79],
    [direction * 1.23, 0.55],
    [direction * 1.09, 0.34],
    [direction * 0.98, 0.11],
    [direction * 1.04, -0.12],
    [direction * 1.28, -0.3],
    [direction * 1.34, -0.55],
    [direction * 1.2, -0.76]
  ];
  makeTube(holePoints, 0.065, lead, 0.39, 42);
  makeTube([
    [direction * 1.12, 0.55],
    [direction * 1.43, 0.48]
  ], 0.042, lead, 0.39, 14);
  makeTube([
    [direction * 1.12, -0.31],
    [direction * 1.43, -0.43]
  ], 0.042, lead, 0.39, 14);
  makeSphere(0.09, lead, direction * 1.19, 0.93, 0.39);
  makeSphere(0.09, lead, direction * 1.21, -0.78, 0.39);
}

addFHole(-1);
addFHole(1);

const neckShape = new THREE.Shape();
neckShape.moveTo(-0.31, 1.62);
neckShape.lineTo(-0.24, 4.3);
neckShape.lineTo(0.24, 4.3);
neckShape.lineTo(0.31, 1.62);
neckShape.closePath();
makeExtruded(neckShape, lead, 0.36, 0.035, -0.16);

const fingerboardShape = new THREE.Shape();
fingerboardShape.moveTo(-0.14, 4.18);
fingerboardShape.lineTo(0.14, 4.18);
fingerboardShape.lineTo(0.34, 0.37);
fingerboardShape.lineTo(-0.34, 0.37);
fingerboardShape.closePath();
makeExtruded(fingerboardShape, woodDark, 0.12, 0.018, 0.21);

makePolygon([
  [-0.19, 3.96],
  [0.19, 3.96],
  [0.23, 3.26],
  [-0.23, 3.26]
], cobalt, 0.29);

makePolygon([
  [-0.25, 3.15],
  [0.25, 3.15],
  [0.29, 2.25],
  [-0.29, 2.25]
], amber, 0.29);

makePolygon([
  [-0.3, 2.15],
  [0.3, 2.15],
  [0.33, 1.38],
  [-0.33, 1.38]
], ruby, 0.29);

makeTube([[-0.24, 3.96], [-0.27, 3.1], [-0.31, 2.15], [-0.34, 1.38], [-0.34, 0.48]], 0.026, leadHighlight, 0.36, 30);
makeTube([[0.24, 3.96], [0.27, 3.1], [0.31, 2.15], [0.34, 1.38], [0.34, 0.48]], 0.026, leadHighlight, 0.36, 30);

const pegboxGeometry = new THREE.BoxGeometry(0.76, 0.7, 0.4);
const pegbox = new THREE.Mesh(pegboxGeometry, lead);
pegbox.position.set(0, 4.48, -0.02);
pegbox.castShadow = true;
pegbox.receiveShadow = true;
violin.add(pegbox);

const pegboxGlass = new THREE.BoxGeometry(0.49, 0.45, 0.06);
const pegboxGlassMesh = new THREE.Mesh(pegboxGlass, rubyLight);
pegboxGlassMesh.position.set(0, 4.48, 0.23);
pegboxGlassMesh.castShadow = true;
violin.add(pegboxGlassMesh);

const scrollRingGeometry = new THREE.TorusGeometry(0.33, 0.075, 12, 32);
const scrollRing = new THREE.Mesh(scrollRingGeometry, leadHighlight);
scrollRing.position.set(0, 4.78, 0.28);
scrollRing.castShadow = true;
violin.add(scrollRing);

const scrollCoreGeometry = new THREE.TorusGeometry(0.17, 0.045, 10, 24);
const scrollCore = new THREE.Mesh(scrollCoreGeometry, amberLight);
scrollCore.position.set(0, 4.78, 0.3);
scrollCore.castShadow = true;
violin.add(scrollCore);

function addPeg(x, y, rotation) {
  const shaftGeometry = new THREE.CylinderGeometry(0.055, 0.055, 0.75, 10);
  const shaft = new THREE.Mesh(shaftGeometry, lead);
  shaft.position.set(x, y, 0.06);
  shaft.rotation.z = Math.PI / 2;
  shaft.rotation.y = rotation;
  shaft.castShadow = true;
  violin.add(shaft);

  const knobGeometry = new THREE.SphereGeometry(0.12, 12, 8);
  const knob = new THREE.Mesh(knobGeometry, rubyLight);
  knob.position.set(x + (x < 0 ? -0.36 : 0.36), y, 0.06);
  knob.scale.set(1.25, 0.7, 0.75);
  knob.castShadow = true;
  violin.add(knob);
}

addPeg(-0.39, 4.27, 0.08);
addPeg(0.39, 4.48, -0.08);
addPeg(-0.39, 4.66, 0.08);
addPeg(0.39, 4.84, -0.08);

const tailpieceShape = new THREE.Shape();
tailpieceShape.moveTo(-0.37, -2.68);
tailpieceShape.bezierCurveTo(-0.32, -2.18, -0.24, -1.65, -0.13, -1.26);
tailpieceShape.lineTo(0.13, -1.26);
tailpieceShape.bezierCurveTo(0.24, -1.65, 0.32, -2.18, 0.37, -2.68);
tailpieceShape.bezierCurveTo(0.18, -2.86, -0.18, -2.86, -0.37, -2.68);
tailpieceShape.closePath();
makeExtruded(tailpieceShape, lead, 0.19, 0.025, 0.36);

makePolygon([
  [-0.2, -2.56],
  [0, -2.72],
  [0.2, -2.56],
  [0.13, -2.05],
  [-0.13, -2.05]
], cobaltLight, 0.47);

makePolygon([
  [-0.13, -1.96],
  [0.13, -1.96],
  [0.1, -1.45],
  [-0.1, -1.45]
], amberLight, 0.47);

const endpinGeometry = new THREE.CylinderGeometry(0.075, 0.075, 0.5, 12);
const endpin = new THREE.Mesh(endpinGeometry, leadHighlight);
endpin.position.set(0, -2.96, 0.4);
endpin.rotation.z = Math.PI / 2;
endpin.castShadow = true;
violin.add(endpin);

const bridgeGeometry = new THREE.BoxGeometry(1.18, 0.1, 0.1);
const bridge = new THREE.Mesh(bridgeGeometry, ivory);
bridge.position.set(0, -0.2, 0.48);
bridge.castShadow = true;
violin.add(bridge);

const bridgeFootGeometry = new THREE.BoxGeometry(0.1, 0.5, 0.09);
const bridgeLeftFoot = new THREE.Mesh(bridgeFootGeometry, ivory);
bridgeLeftFoot.position.set(-0.43, -0.42, 0.47);
bridgeLeftFoot.rotation.z = -0.08;
bridgeLeftFoot.castShadow = true;
violin.add(bridgeLeftFoot);

const bridgeRightFoot = new THREE.Mesh(bridgeFootGeometry, ivory);
bridgeRightFoot.position.set(0.43, -0.42, 0.47);
bridgeRightFoot.rotation.z = 0.08;
bridgeRightFoot.castShadow = true;
violin.add(bridgeRightFoot);

makeTube([[-0.52, -0.2], [0, -0.13], [0.52, -0.2]], 0.025, leadHighlight, 0.55, 18);

const stringMaterials = [
  new THREE.MeshStandardMaterial({ color: 0xffe7b0, emissive: 0xb86732, emissiveIntensity: 1.0, metalness: 0.75, roughness: 0.2 }),
  new THREE.MeshStandardMaterial({ color: 0xfff0c4, emissive: 0xc17c42, emissiveIntensity: 0.9, metalness: 0.8, roughness: 0.18 }),
  new THREE.MeshStandardMaterial({ color: 0xe8d2a5, emissive: 0x8c633b, emissiveIntensity: 0.75, metalness: 0.8, roughness: 0.2 }),
  new THREE.MeshStandardMaterial({ color: 0xc9b18b, emissive: 0x694829, emissiveIntensity: 0.65, metalness: 0.8, roughness: 0.22 })
];

const stringX = [-0.105, -0.035, 0.035, 0.105];
for (let index = 0; index < stringX.length; index += 1) {
  const x = stringX[index];
  makeTube([
    [x * 0.72, -2.64],
    [x, -1.25],
    [x * 0.92, 0.2],
    [x * 0.88, 2.2],
    [x * 0.72, 4.73]
  ], 0.014 + index * 0.002, stringMaterials[index], 0.58, 52);
}

const fineLeadGeometry = new THREE.CylinderGeometry(0.025, 0.025, 0.82, 8);
for (const x of [-0.52, 0.52]) {
  const fineLead = new THREE.Mesh(fineLeadGeometry, leadHighlight);
  fineLead.position.set(x, -0.2, 0.55);
  fineLead.rotation.z = Math.PI / 2;
  fineLead.castShadow = true;
  violin.add(fineLead);
}

const haloGeometry = new THREE.CircleGeometry(3.4, 64);
const haloMaterial = new THREE.MeshBasicMaterial({
  color: 0x9b4a24,
  transparent: true,
  opacity: 0.045,
  side: THREE.DoubleSide,
  depthWrite: false
});
const halo = new THREE.Mesh(haloGeometry, haloMaterial);
halo.position.set(0, 0.35, -0.78);
halo.scale.set(0.7, 1.45, 1);
violin.add(halo);

const ambientLight = new THREE.HemisphereLight(0x667cb8, 0x160d18, 1.5);
scene.add(ambientLight);

const warmBackLight = new THREE.PointLight(0xff7c32, 8, 13, 2);
warmBackLight.position.set(0, 0.3, -2.8);
warmBackLight.castShadow = true;
warmBackLight.shadow.mapSize.set(1024, 1024);
scene.add(warmBackLight);

const keyLight = new THREE.SpotLight(0xffd1a0, 7, 18, Math.PI / 5, 0.5, 1.4);
keyLight.position.set(-4.8, 5.5, 7);
keyLight.target = violin;
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
scene.add(keyLight);

const rimLight = new THREE.PointLight(0x3d72ff, 4, 12, 2);
rimLight.position.set(4, 1.5, 4);
scene.add(rimLight);

const lowFill = new THREE.PointLight(0xc9375d, 2.4, 10, 2);
lowFill.position.set(-3, -3.5, 3);
scene.add(lowFill);

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.addEventListener("resize", onResize);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  halo.material.opacity = 0.038 + Math.sin(elapsed * 1.8) * 0.008;
  warmBackLight.intensity = 7.6 + Math.sin(elapsed * 1.6) * 0.45;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
