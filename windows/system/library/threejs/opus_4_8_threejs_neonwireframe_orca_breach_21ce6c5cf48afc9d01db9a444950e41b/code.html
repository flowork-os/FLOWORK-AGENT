<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Neon Wireframe Orca — Breach</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #04060a;
  }
  #app { position: fixed; inset: 0; }
  .hud {
    position: fixed;
    left: 18px;
    bottom: 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(120, 240, 255, 0.55);
    text-shadow: 0 0 12px rgba(0, 220, 255, 0.55);
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud">Orcinus orca &nbsp;//&nbsp; wireframe breach study</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const container = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070c);
scene.fog = new THREE.FogExp2(0x05070c, 0.018);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(9.5, 4.2, 12.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 6;
controls.maxDistance = 46;
controls.target.set(0, 1.1, 0);

/* ============================================================
   PALETTE
   ============================================================ */
const CYAN      = new THREE.Color(0x24e8ff);
const CYAN_DEEP = new THREE.Color(0x0aa8ff);
const MAGENTA   = new THREE.Color(0xff2fbd);
const MAG_DEEP  = new THREE.Color(0xc41c8f);
const WHITEHOT  = new THREE.Color(0xd8fbff);

/* ============================================================
   LIGHTING  (key + fill + rim + hemisphere)
   ============================================================ */
const hemi = new THREE.HemisphereLight(0x1b3a5c, 0x03060a, 0.55);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0x9fe9ff, 1.35);
keyLight.position.set(7, 12, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 60;
keyLight.shadow.camera.left = -14;
keyLight.shadow.camera.right = 14;
keyLight.shadow.camera.top = 14;
keyLight.shadow.camera.bottom = -14;
keyLight.shadow.radius = 4;
keyLight.shadow.bias = -0.0009;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xff5cc8, 0.42);
fillLight.position.set(-9, 3.5, 6);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x63b8ff, 0.75);
rimLight.position.set(-4, 6, -11);
scene.add(rimLight);

// Local glow sources that read as "the wires are emitting"
const coreGlow = new THREE.PointLight(0x1fd8ff, 14.0, 22, 2.0);
coreGlow.position.set(0, 2.2, 0);
scene.add(coreGlow);

const bellyGlow = new THREE.PointLight(0xff2fbd, 7.0, 16, 2.0);
bellyGlow.position.set(0.4, 0.9, 0.9);
scene.add(bellyGlow);

/* ============================================================
   GROUND — shadow catcher only (invisible plane, dark void)
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(160, 160),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -3.4;
ground.receiveShadow = true;
scene.add(ground);

// Faint reflective "sea surface" grid so the void has a horizon hint
const grid = new THREE.GridHelper(120, 60, 0x0e4a63, 0x082c3c);
grid.position.y = -3.399;
grid.material.transparent = true;
grid.material.opacity = 0.16;
grid.material.depthWrite = false;
scene.add(grid);

/* ============================================================
   MATERIALS — glowing tube wires + soft halo sheath
   ============================================================ */
function wireMat(color, emissiveBoost) {
  const m = new THREE.MeshStandardMaterial({
    color: color.clone().multiplyScalar(0.25),
    emissive: color.clone(),
    emissiveIntensity: emissiveBoost,
    roughness: 0.32,
    metalness: 0.0
  });
  return m;
}

function haloMat(color, opacity) {
  return new THREE.MeshBasicMaterial({
    color: color.clone(),
    transparent: true,
    opacity: opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.BackSide
  });
}

const MAT = {
  cyan:      wireMat(CYAN, 2.6),
  cyanDeep:  wireMat(CYAN_DEEP, 2.0),
  magenta:   wireMat(MAGENTA, 2.9),
  magDeep:   wireMat(MAG_DEEP, 2.2),
  white:     wireMat(WHITEHOT, 3.2)
};

const HALO = {
  cyan:     haloMat(CYAN, 0.16),
  cyanDeep: haloMat(CYAN_DEEP, 0.13),
  magenta:  haloMat(MAGENTA, 0.19),
  magDeep:  haloMat(MAG_DEEP, 0.15),
  white:    haloMat(WHITEHOT, 0.14)
};

/* ============================================================
   ORCA — parametric body model
   The body is defined by a spine curve + elliptical cross-sections.
   Nothing is skinned: only the EDGES are drawn as tubes, so the
   interior stays completely open and hollow.
   ============================================================ */

const orca = new THREE.Group();
scene.add(orca);

// --- Spine: t in [0,1], 0 = snout, 1 = fluke notch -----------
// A gentle arch so the animal reads as arcing out of the water.
function spine(t) {
  const x = 0;
  // length axis (z): snout forward (+z) to tail back (-z)
  const z = THREE.MathUtils.lerp(4.55, -4.75, t);
  // dorsal-ventral arch: body curves like a drawn bow (breach arc)
  const arch = Math.sin(Math.PI * Math.pow(t, 0.92)) * 0.72;
  const drop = -0.55 * Math.pow(t, 2.1);       // tailstock dips slightly
  const y = arch + drop - 0.12;
  return new THREE.Vector3(x, y, z);
}

// Half-width (x radius) profile of the body — fusiform, widest ~35%
function halfWidth(t) {
  if (t <= 0.0) return 0.02;
  // Rounded melon at the nose, thick barrel, tapering peduncle
  const nose  = Math.pow(Math.min(1, t / 0.14), 0.62);
  const barrel = Math.pow(Math.sin(Math.PI * Math.min(1, (t * 0.86 + 0.055))), 0.72);
  const taper  = 1.0 - 0.86 * smoothstep(0.62, 0.99, t);
  const w = 1.14 * nose * barrel * taper;
  return Math.max(0.028, w);
}

// Half-height (y radius) — taller than wide through the thorax
function halfHeight(t) {
  if (t <= 0.0) return 0.02;
  const nose   = Math.pow(Math.min(1, t / 0.13), 0.55);
  const barrel = Math.pow(Math.sin(Math.PI * Math.min(1, (t * 0.84 + 0.07))), 0.66);
  const taper  = 1.0 - 0.80 * smoothstep(0.60, 0.99, t);
  const h = 1.38 * nose * barrel * taper;
  return Math.max(0.030, h);
}

function smoothstep(edge0, edge1, x) {
  const t = THREE.MathUtils.clamp((x - edge0) / (edge1 - edge0), 0, 1);
  return t * t * (3 - 2 * t);
}

// Superellipse exponent: belly flatter, back rounder -> whale-like section
function sectionPoint(t, theta) {
  const c = spine(t);
  const rw = halfWidth(t);
  const rh = halfHeight(t);

  const ct = Math.cos(theta);
  const st = Math.sin(theta);

  // superellipse (n slightly > 2 gives a fuller, less circular hull)
  const n = 2.35;
  const ax = Math.pow(Math.abs(ct), 2 / n) * Math.sign(ct);
  const ay = Math.pow(Math.abs(st), 2 / n) * Math.sign(st);

  // Ventral flattening (belly is a touch flatter than the back)
  const ventral = st < 0 ? (1.0 - 0.16 * Math.abs(st)) : 1.0;

  return new THREE.Vector3(
    c.x + rw * ax,
    c.y + rh * ay * ventral,
    c.z
  );
}

// Frame at a spine parameter (for appendages that must follow the arch)
function spineTangent(t) {
  const e = 0.004;
  const a = spine(Math.max(0, t - e));
  const b = spine(Math.min(1, t + e));
  return b.sub(a).normalize();
}

/* ------------------------------------------------------------
   Tube builder — every wire is a glowing tube + additive halo
   ------------------------------------------------------------ */
const TUBE_SEG_SCALE = 1.0;

function addTube(parent, points, radius, matKey, opts) {
  opts = opts || {};
  const closed = !!opts.closed;
  if (!points || points.length < 2) return null;

  // strip duplicate/degenerate points to avoid NaN in the curve frames
  const clean = [];
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    if (!isFinite(p.x) || !isFinite(p.y) || !isFinite(p.z)) continue;
    if (clean.length === 0 || clean[clean.length - 1].distanceTo(p) > 1e-4) clean.push(p.clone());
  }
  if (closed && clean.length > 2 && clean[0].distanceTo(clean[clean.length - 1]) < 1e-4) clean.pop();
  if (clean.length < 2) return null;

  const curve = new THREE.CatmullRomCurve3(clean, closed, opts.curveType || 'centripetal', 0.5);
  const segs = Math.max(8, Math.round((opts.segments || clean.length * 3) * TUBE_SEG_SCALE));
  const radial = opts.radial || 7;

  const geo = new THREE.TubeGeometry(curve, segs, radius, radial, closed);
  const mesh = new THREE.Mesh(geo, MAT[matKey]);
  mesh.castShadow = true;
  mesh.receiveShadow = false;
  parent.add(mesh);

  // Additive halo sheath — the "faint bloom" around each strand
  const haloGeo = new THREE.TubeGeometry(curve, segs, radius * (opts.haloScale || 3.4), radial, closed);
  const halo = new THREE.Mesh(haloGeo, HALO[matKey]);
  halo.renderOrder = 2;
  parent.add(halo);

  // Second, wider and fainter sheath for a soft outer bloom
  const halo2Geo = new THREE.TubeGeometry(curve, Math.max(8, Math.round(segs * 0.6)), radius * (opts.haloScale || 3.4) * 2.0, 6, closed);
  const halo2Mat = HALO[matKey].clone();
  halo2Mat.opacity = HALO[matKey].opacity * 0.34;
  const halo2 = new THREE.Mesh(halo2Geo, halo2Mat);
  halo2.renderOrder = 1;
  parent.add(halo2);

  return mesh;
}

// Node bead — small glowing sphere at wire intersections
const beadGeo = new THREE.SphereGeometry(1, 10, 8);
function addBead(parent, pos, radius, matKey) {
  const b = new THREE.Mesh(beadGeo, MAT[matKey]);
  b.position.copy(pos);
  b.scale.setScalar(radius);
  b.castShadow = true;
  parent.add(b);

  const h = new THREE.Mesh(beadGeo, HALO[matKey]);
  h.position.copy(pos);
  h.scale.setScalar(radius * 3.0);
  h.renderOrder = 2;
  parent.add(h);
  return b;
}

/* ------------------------------------------------------------
   BODY: longitudinal stringers + transverse ribs
   ------------------------------------------------------------ */
const body = new THREE.Group();
orca.add(body);

const R_MAIN = 0.036;   // main contour wire radius
const R_RIB  = 0.024;   // rib radius
const R_FINE = 0.017;   // fine detail

// ---- Longitudinal stringers (running nose -> tail) ----
const STRINGER_ANGLES = [
  Math.PI / 2,                 // dorsal ridge (top)
  Math.PI / 2 + Math.PI / 4,
  Math.PI,                     // port flank
  Math.PI + Math.PI / 4,
  -Math.PI / 2,                // ventral keel (belly)
  -Math.PI / 4,
  0,                           // starboard flank
  Math.PI / 4
];

const T_SAMPLES = 90;
function stringerPoints(theta, tStart, tEnd) {
  const pts = [];
  for (let i = 0; i <= T_SAMPLES; i++) {
    const t = THREE.MathUtils.lerp(tStart, tEnd, i / T_SAMPLES);
    pts.push(sectionPoint(t, theta));
  }
  return pts;
}

STRINGER_ANGLES.forEach((a, idx) => {
  const isSpineLine = (Math.abs(a - Math.PI / 2) < 1e-6);
  const isKeel = (Math.abs(a + Math.PI / 2) < 1e-6);
  const key = isSpineLine ? 'white' : (isKeel ? 'cyanDeep' : 'cyan');
  const r = (isSpineLine || isKeel) ? R_MAIN * 1.12 : R_MAIN * 0.88;
  addTube(body, stringerPoints(a, 0.004, 0.985), r, key, { segments: 220, radial: 8, haloScale: 3.2 });
});

// ---- Transverse ribs (the "ribcage") ----
const RIB_TS = [];
for (let i = 0; i < 26; i++) {
  // denser through the thorax, sparser toward the tail stock
  const u = i / 25;
  RIB_TS.push(0.045 + 0.92 * Math.pow(u, 1.14));
}

RIB_TS.forEach((t, i) => {
  const pts = [];
  const N = 56;
  for (let k = 0; k < N; k++) {
    const th = (k / N) * Math.PI * 2;
    pts.push(sectionPoint(t, th));
  }
  const thin = i > 17;
  addTube(body, pts, thin ? R_RIB * 0.78 : R_RIB, i % 4 === 0 ? 'cyan' : 'cyanDeep', {
    closed: true,
    segments: 96,
    radial: 6,
    haloScale: 3.6
  });
});

// ---- Nose cap: converging melon wires ----
{
  const capPts = [];
  const tip = spine(0.0);
  tip.z += 0.06;
  for (let k = 0; k < 8; k++) {
    const th = (k / 8) * Math.PI * 2;
    const pts = [tip.clone()];
    for (let i = 1; i <= 10; i++) {
      const t = THREE.MathUtils.lerp(0.0, 0.10, i / 10);
      pts.push(sectionPoint(t, th));
    }
    addTube(body, pts, R_FINE, 'cyan', { segments: 40, radial: 6 });
  }
  addBead(body, tip, 0.055, 'white');
}

// ---- Tail stock convergence to the fluke root ----
{
  const rootT = 0.985;
  const root = spine(1.0);
  for (let k = 0; k < 8; k++) {
    const th = (k / 8) * Math.PI * 2;
    addTube(body, [sectionPoint(rootT, th), root.clone()], R_FINE, 'cyanDeep', { segments: 12, radial: 6 });
  }
  addBead(body, root, 0.05, 'cyan');
}

/* ------------------------------------------------------------
   DORSAL FIN — tall, erect, slightly recurved (adult male)
   ------------------------------------------------------------ */
function buildDorsal() {
  const g = new THREE.Group();

  const baseT0 = 0.335;
  const baseT1 = 0.545;
  const rootFront = sectionPoint(baseT0, Math.PI / 2);
  const rootBack  = sectionPoint(baseT1, Math.PI / 2);

  const height = 2.55;
  const tipZ = rootBack.z + 0.16;
  const tipY = Math.max(rootFront.y, rootBack.y) + height;

  // Outline: leading edge sweeps back, trailing edge slightly concave
  const outline = [];
  const LE_STEPS = 22;
  for (let i = 0; i <= LE_STEPS; i++) {
    const u = i / LE_STEPS;
    // leading edge: from root front up to tip, swept aft
    const y = THREE.MathUtils.lerp(rootFront.y, tipY, Math.pow(u, 0.94));
    const z = THREE.MathUtils.lerp(rootFront.z, tipZ + 0.06, Math.pow(u, 1.42));
    outline.push(new THREE.Vector3(0, y, z));
  }
  const TE_STEPS = 18;
  for (let i = 1; i <= TE_STEPS; i++) {
    const u = i / TE_STEPS;
    // trailing edge back down to root rear, gently concave (falcate)
    const y = THREE.MathUtils.lerp(tipY, rootBack.y, Math.pow(u, 0.86));
    const bow = Math.sin(Math.PI * u) * 0.30; // concave notch
    const z = THREE.MathUtils.lerp(tipZ - 0.02, rootBack.z, u) - bow;
    outline.push(new THREE.Vector3(0, y, z));
  }

  addTube(g, outline, R_MAIN * 1.05, 'cyan', { closed: false, segments: 180, radial: 8, haloScale: 3.3 });

  // Fin "spars" — internal chordwise wires so the fin reads as a hollow frame
  const SPARS = 7;
  for (let s = 1; s <= SPARS; s++) {
    const u = s / (SPARS + 1);
    const y = THREE.MathUtils.lerp(rootFront.y + 0.06, tipY - 0.10, u);

    // find leading & trailing z at this height by re-evaluating the profiles
    const uLE = Math.pow(THREE.MathUtils.clamp((y - rootFront.y) / (tipY - rootFront.y), 0, 1), 1 / 0.94);
    const zLE = THREE.MathUtils.lerp(rootFront.z, tipZ + 0.06, Math.pow(uLE, 1.42));

    const uTE = Math.pow(THREE.MathUtils.clamp((tipY - y) / (tipY - rootBack.y), 0, 1), 1 / 0.86);
    const bow = Math.sin(Math.PI * uTE) * 0.30;
    const zTE = THREE.MathUtils.lerp(tipZ - 0.02, rootBack.z, uTE) - bow;

    const mid = new THREE.Vector3(0, y + 0.02, (zLE + zTE) * 0.5);
    addTube(g, [
      new THREE.Vector3(0, y, zLE),
      mid,
      new THREE.Vector3(0, y, zTE)
    ], R_FINE, s % 2 === 0 ? 'cyanDeep' : 'cyan', { segments: 26, radial: 6, haloScale: 3.8 });
  }

  // Vertical mid-spar
  addTube(g, [
    new THREE.Vector3(0, rootFront.y + 0.02, (rootFront.z + rootBack.z) * 0.5),
    new THREE.Vector3(0, (rootFront.y + tipY) * 0.5, (rootFront.z + rootBack.z) * 0.5 - 0.16),
    new THREE.Vector3(0, tipY - 0.05, tipZ + 0.02)
  ], R_FINE, 'cyanDeep', { segments: 40, radial: 6 });

  // Root fairing wires that tie the fin into the ribcage
  for (let k = 0; k < 5; k++) {
    const u = k / 4;
    const t = THREE.MathUtils.lerp(baseT0, baseT1, u);
    const p = sectionPoint(t, Math.PI / 2);
    const side = sectionPoint(t, Math.PI / 2 + 0.55);
    const side2 = sectionPoint(t, Math.PI / 2 - 0.55);
    addTube(g, [side, p.clone().add(new THREE.Vector3(0, 0.10, 0)), side2], R_FINE * 0.85, 'cyanDeep', { segments: 16, radial: 5 });
  }

  addBead(g, new THREE.Vector3(0, tipY, tipZ + 0.04), 0.052, 'white');

  return g;
}
orca.add(buildDorsal());

/* ------------------------------------------------------------
   PECTORAL FLIPPERS — broad, rounded paddles (orca hallmark)
   ------------------------------------------------------------ */
function buildPectoral(sideSign) {
  const g = new THREE.Group();

  const rootT = 0.225;
  const rootTheta = sideSign > 0 ? -0.42 : Math.PI + 0.42;
  const root = sectionPoint(rootT, rootTheta);
  const rootBack = sectionPoint(rootT + 0.085, rootTheta - sideSign * 0.10);

  // Local frame: sweep out (x), back (-z), and down (-y)
  const span = 1.62;
  const out = new THREE.Vector3(sideSign, 0, 0);
  const back = new THREE.Vector3(0, 0, -1);
  const down = new THREE.Vector3(0, -1, 0);

  function pf(u, v) {
    // u along span [0..1], v across chord [0..1] (0 = leading, 1 = trailing)
    const chord = THREE.MathUtils.lerp(0.95, 0.30, Math.pow(u, 1.25));
    const sweep = 0.62 * Math.pow(u, 1.15);
    const droop = 0.52 * Math.pow(u, 1.55);
    const p = root.clone()
      .addScaledVector(out, span * u)
      .addScaledVector(back, sweep + chord * v)
      .addScaledVector(down, droop + 0.10 * Math.sin(Math.PI * v));
    return p;
  }

  // Outline: leading edge out, rounded tip, trailing edge back
  const outline = [];
  for (let i = 0; i <= 16; i++) outline.push(pf(i / 16, 0));
  for (let i = 1; i < 6; i++) {
    // rounded tip arc
    const v = i / 6;
    outline.push(pf(1.0 + 0.035 * Math.sin(Math.PI * v), v));
  }
  for (let i = 16; i >= 0; i--) outline.push(pf(i / 16, 1));

  addTube(g, outline, R_MAIN * 0.92, 'cyan', { closed: true, segments: 140, radial: 7, haloScale: 3.3 });

  // Chordwise ribs
  for (let s = 1; s <= 5; s++) {
    const u = s / 6;
    addTube(g, [pf(u, 0), pf(u, 0.5), pf(u, 1)], R_FINE, 'cyanDeep', { segments: 22, radial: 5, haloScale: 3.8 });
  }
  // Spanwise spar
  const spar = [];
  for (let i = 0; i <= 14; i++) spar.push(pf(i / 14, 0.45));
  addTube(g, spar, R_FINE, 'cyanDeep', { segments: 50, radial: 5 });

  // Root attachment fan
  addTube(g, [root, rootBack], R_FINE, 'cyanDeep', { segments: 10, radial: 5 });
  addBead(g, pf(1.0, 0.15), 0.04, 'cyan');

  return g;
}
orca.add(buildPectoral(1));
orca.add(buildPectoral(-1));

/* ------------------------------------------------------------
   FLUKE — two broad lobes with a central notch
   ------------------------------------------------------------ */
function buildFluke() {
  const g = new THREE.Group();

  const rootC = spine(1.0);
  const notch = rootC.clone().add(new THREE.Vector3(0, 0.02, -0.28));

  function lobe(sideSign) {
    const span = 1.95;
    const out = new THREE.Vector3(sideSign, 0, 0);

    function ff(u, v) {
      // u across span, v chord (0 leading edge, 1 trailing edge)
      const chord = THREE.MathUtils.lerp(1.28, 0.34, Math.pow(u, 1.15));
      const sweep = 0.52 * Math.pow(u, 1.25);
      const rise  = 0.30 * Math.pow(u, 1.5);   // flukes lift at the tips
      const p = rootC.clone()
        .addScaledVector(out, span * u)
        .add(new THREE.Vector3(0, rise + 0.06 * Math.sin(Math.PI * v), -(sweep + chord * v)));
      return p;
    }

    const outline = [];
    outline.push(rootC.clone().add(new THREE.Vector3(0, 0, 0.06)));
    for (let i = 1; i <= 16; i++) outline.push(ff(i / 16, 0));
    for (let i = 1; i < 5; i++) {
      const v = i / 5;
      outline.push(ff(1.0 + 0.02 * Math.sin(Math.PI * v), v));
    }
    for (let i = 16; i >= 1; i--) outline.push(ff(i / 16, 1));
    outline.push(notch.clone());

    addTube(g, outline, R_MAIN * 0.95, 'cyan', { closed: true, segments: 170, radial: 7, haloScale: 3.2 });

    for (let s = 1; s <= 6; s++) {
      const u = s / 7;
      addTube(g, [ff(u, 0), ff(u, 0.5), ff(u, 1)], R_FINE, 'cyanDeep', { segments: 26, radial: 5, haloScale: 3.8 });
    }
    const spar = [];
    for (let i = 0; i <= 14; i++) spar.push(ff(Math.max(0.02, i / 14), 0.42));
    addTube(g, spar, R_FINE, 'cyanDeep', { segments: 50, radial: 5 });

    addBead(g, ff(1.0, 0.12), 0.045, 'cyan');
  }

  lobe(1);
  lobe(-1);

  // Central keel between the lobes
  addTube(g, [rootC.clone().add(new THREE.Vector3(0, 0.02, 0.10)), notch.clone()], R_FINE * 1.2, 'white', { segments: 14, radial: 6 });
  addBead(g, notch, 0.04, 'white');

  return g;
}
orca.add(buildFluke());

/* ------------------------------------------------------------
   MAGENTA ACCENTS
     • eye patch (both sides)
     • belly / ventral field
     • saddle patch behind the dorsal fin
     • mouth line + blowhole (fine white/magenta)
   ------------------------------------------------------------ */

// Helper: project a closed 2D loop (in (t, theta) space) onto the hull
function hullLoop(pairs) {
  return pairs.map(p => sectionPoint(p[0], p[1]));
}

// ---- EYE PATCH (oval, angled, just above & behind the mouth line) ----
function buildEyePatch(sideSign) {
  const g = new THREE.Group();
  const tC = 0.148;                     // along body
  const thC = sideSign > 0 ? -0.30 : Math.PI + 0.30;  // slightly below the mid-flank

  const pairs = [];
  const N = 44;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    // ellipse in (t, theta), rotated to slant up-and-back
    const eu = 0.052 * Math.cos(a);
    const ev = 0.30 * Math.sin(a);
    const rot = sideSign > 0 ? 0.42 : -0.42;
    const du = eu * Math.cos(rot) - (ev * 0.10) * Math.sin(rot);
    const dv = ev * Math.cos(rot) + (eu * 4.0) * Math.sin(rot);
    pairs.push([THREE.MathUtils.clamp(tC + du, 0.02, 0.98), thC + dv * sideSign]);
  }
  addTube(g, hullLoop(pairs), R_RIB * 0.95, 'magenta', { closed: true, segments: 90, radial: 6, haloScale: 3.9 });

  // Inner eye ring + pupil bead
  const eyeT = 0.118;
  const eyeTh = sideSign > 0 ? -0.44 : Math.PI + 0.44;
  const inner = [];
  for (let i = 0; i < 20; i++) {
    const a = (i / 20) * Math.PI * 2;
    inner.push([eyeT + 0.016 * Math.cos(a), eyeTh + 0.085 * Math.sin(a)]);
  }
  addTube(g, hullLoop(inner), R_FINE * 0.8, 'magDeep', { closed: true, segments: 40, radial: 5, haloScale: 4.2 });
  addBead(g, sectionPoint(eyeT, eyeTh).multiplyScalar(1.004), 0.035, 'magenta');

  return g;
}
orca.add(buildEyePatch(1));
orca.add(buildEyePatch(-1));

// ---- SADDLE PATCH (grey saddle just aft of the dorsal fin) ----
function buildSaddle(sideSign) {
  const g = new THREE.Group();
  const pairs = [];
  const N = 46;
  const tC = 0.575;
  const thC = Math.PI / 2 + sideSign * 0.62;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    // crescent-ish: wider fore-aft, hugging the back
    const du = 0.085 * Math.cos(a) + 0.012 * Math.cos(2 * a);
    const dv = 0.52 * Math.sin(a) * (1.0 - 0.22 * Math.cos(a));
    pairs.push([THREE.MathUtils.clamp(tC + du, 0.02, 0.97), thC + dv * sideSign]);
  }
  addTube(g, hullLoop(pairs), R_RIB * 0.85, 'magDeep', { closed: true, segments: 96, radial: 6, haloScale: 3.9 });
  return g;
}
orca.add(buildSaddle(1));
orca.add(buildSaddle(-1));

// ---- BELLY FIELD: magenta ventral panel with cross-hatching ----
function buildBelly() {
  const g = new THREE.Group();

  // Ventral boundary lines (port + starboard), sweeping from throat to
  // the genital region where the white field pinches inward.
  function bellyEdge(sideSign) {
    const pts = [];
    const N = 60;
    for (let i = 0; i <= N; i++) {
      const u = i / N;
      const t = THREE.MathUtils.lerp(0.075, 0.80, u);
      // widest amidships, pinching fore and aft
      const spread = 0.30 + 0.62 * Math.sin(Math.PI * Math.pow(u, 0.88));
      const th = -Math.PI / 2 + sideSign * spread;
      pts.push(sectionPoint(t, th));
    }
    return pts;
  }

  const edgeR = bellyEdge(1);
  const edgeL = bellyEdge(-1);
  addTube(g, edgeR, R_RIB * 1.05, 'magenta', { segments: 150, radial: 7, haloScale: 3.6 });
  addTube(g, edgeL, R_RIB * 1.05, 'magenta', { segments: 150, radial: 7, haloScale: 3.6 });

  // Cross ties across the belly (ladder rungs) — keeps interior hollow
  for (let i = 1; i < 13; i++) {
    const u = i / 13;
    const t = THREE.MathUtils.lerp(0.10, 0.78, u);
    const spread = 0.30 + 0.62 * Math.sin(Math.PI * Math.pow(u, 0.88));
    const pts = [];
    for (let k = 0; k <= 10; k++) {
      const th = THREE.MathUtils.lerp(-Math.PI / 2 - spread, -Math.PI / 2 + spread, k / 10);
      pts.push(sectionPoint(t, th));
    }
    addTube(g, pts, R_FINE * 0.9, i % 3 === 0 ? 'magenta' : 'magDeep', { segments: 26, radial: 5, haloScale: 4.0 });
  }

  // Ventral centre stripe
  const centre = [];
  for (let i = 0; i <= 60; i++) {
    centre.push(sectionPoint(THREE.MathUtils.lerp(0.07, 0.84, i / 60), -Math.PI / 2));
  }
  addTube(g, centre, R_FINE * 1.1, 'magDeep', { segments: 130, radial: 6, haloScale: 3.6 });

  // Aft flank flashes (the tail-ward prongs of the white ventral field)
  [1, -1].forEach(s => {
    const pts = [];
    for (let i = 0; i <= 20; i++) {
      const u = i / 20;
      const t = THREE.MathUtils.lerp(0.72, 0.92, u);
      const th = -Math.PI / 2 + s * (0.85 - 0.62 * u);
      pts.push(sectionPoint(t, th));
    }
    addTube(g, pts, R_FINE, 'magDeep', { segments: 44, radial: 5 });
  });

  return g;
}
orca.add(buildBelly());

// ---- MOUTH LINE + BLOWHOLE ----
function buildFace() {
  const g = new THREE.Group();

  [1, -1].forEach(s => {
    const pts = [];
    for (let i = 0; i <= 26; i++) {
      const u = i / 26;
      const t = THREE.MathUtils.lerp(0.012, 0.185, u);
      // mouth line drops from the rostrum tip back and down
      const th = THREE.MathUtils.lerp(-Math.PI / 2 + 0.12, -0.62, Math.pow(u, 0.8));
      const theta = s > 0 ? th : (Math.PI - th);
      pts.push(sectionPoint(t, theta));
    }
    addTube(g, pts, R_FINE * 1.15, 'white', { segments: 60, radial: 6, haloScale: 3.5 });
  });

  // Blowhole ring on the dorsal surface behind the melon
  const bh = [];
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2;
    bh.push([0.145 + 0.022 * Math.cos(a), Math.PI / 2 + 0.16 * Math.sin(a)]);
  }
  addTube(g, hullLoop(bh), R_FINE * 0.85, 'white', { closed: true, segments: 40, radial: 5, haloScale: 4.2 });

  return g;
}
orca.add(buildFace());

/* ------------------------------------------------------------
   BREACH POSE: rotate the whole animal so it arcs up out of the void
   ------------------------------------------------------------ */
orca.rotation.x = -THREE.MathUtils.degToRad(34);   // nose pitched skyward
orca.rotation.z = THREE.MathUtils.degToRad(12);    // slight roll, mid-twist
orca.rotation.y = THREE.MathUtils.degToRad(-14);

// Centre the finished animal on the origin, then lift it into the void
{
  const box = new THREE.Box3().setFromObject(orca);
  const centre = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  orca.position.sub(centre);
  orca.position.y += size.y * 0.10 + 1.1;

  // Keep the shadow catcher just under the animal
  const box2 = new THREE.Box3().setFromObject(orca);
  ground.position.y = box2.min.y - 1.15;
  grid.position.y = ground.position.y + 0.001;
  controls.target.set(0, (box2.min.y + box2.max.y) * 0.5, 0);
  coreGlow.position.set(0, controls.target.y, 0);
  bellyGlow.position.set(0, controls.target.y - 0.9, 0.8);

  const radius = size.length();
  camera.position.set(radius * 0.72, radius * 0.34 + controls.target.y, radius * 0.95);
  controls.minDistance = radius * 0.55;
  controls.maxDistance = radius * 3.2;
}
controls.update();

/* ------------------------------------------------------------
   AMBIENT SPARK FIELD — faint drifting motes for depth
   ------------------------------------------------------------ */
const sparks = (() => {
  const COUNT = 700;
  const pos = new Float32Array(COUNT * 3);
  const col = new Float32Array(COUNT * 3);
  const c = new THREE.Color();
  for (let i = 0; i < COUNT; i++) {
    const r = 9 + Math.pow(Math.random(), 0.6) * 26;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(THREE.MathUtils.clamp(Math.random() * 2 - 1, -1, 1));
    pos[i * 3 + 0] = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.cos(ph) * 0.55 + 2.0;
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
    c.copy(Math.random() < 0.78 ? CYAN : MAGENTA).multiplyScalar(0.35 + Math.random() * 0.65);
    col[i * 3 + 0] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.075,
    vertexColors: true,
    transparent: true,
    opacity: 0.55,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true
  });
  const p = new THREE.Points(geo, mat);
  scene.add(p);
  return p;
})();

/* ------------------------------------------------------------
   RESIZE
   ------------------------------------------------------------ */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

/* ------------------------------------------------------------
   ANIMATE — subtle wire pulse (the "bloom breathes")
   ------------------------------------------------------------ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  const pulse = 0.85 + 0.15 * Math.sin(t * 1.35);
  MAT.cyan.emissiveIntensity     = 2.6 * pulse;
  MAT.cyanDeep.emissiveIntensity = 2.0 * (0.88 + 0.12 * Math.sin(t * 1.35 + 0.8));
  MAT.magenta.emissiveIntensity  = 2.9 * (0.82 + 0.18 * Math.sin(t * 1.9 + 1.6));
  MAT.magDeep.emissiveIntensity  = 2.2 * (0.86 + 0.14 * Math.sin(t * 1.9 + 2.1));
  MAT.white.emissiveIntensity    = 3.2 * (0.90 + 0.10 * Math.sin(t * 2.4));

  HALO.cyan.opacity    = 0.16 * pulse;
  HALO.magenta.opacity = 0.19 * (0.80 + 0.20 * Math.sin(t * 1.9 + 1.6));

  coreGlow.intensity = 14.0 * (0.85 + 0.15 * Math.sin(t * 1.35));
  bellyGlow.intensity = 7.0 * (0.80 + 0.20 * Math.sin(t * 1.9 + 1.6));

  sparks.rotation.y = t * 0.012;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
