<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claymation Pancake Stack</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #f1d8b2; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf1d8b2);
scene.fog = new THREE.Fog(0xf1d8b2, 13, 24);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.6, 5.7, 9.2);
camera.lookAt(0, 2.25, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.72;
controls.minDistance = 7;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.48;

scene.add(new THREE.HemisphereLight(0xffead0, 0x8d6149, 2.25));

const key = new THREE.DirectionalLight(0xffd8a0, 4.3);
key.position.set(-5, 9, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -5;
key.shadow.camera.near = 0.1;
key.shadow.camera.far = 25;
key.shadow.bias = -0.00025;
scene.add(key);

const rim = new THREE.DirectionalLight(0xffb15d, 1.45);
rim.position.set(6, 5, -6);
scene.add(rim);

const fill = new THREE.PointLight(0xfff1d1, 1.2, 18);
fill.position.set(3, 4, 5);
scene.add(fill);

const pancakeMat = new THREE.MeshStandardMaterial({
  color: 0xc97832,
  roughness: 0.91,
  metalness: 0,
  bumpScale: 0.15
});
const edgeMat = new THREE.MeshStandardMaterial({
  color: 0xa85325,
  roughness: 0.96
});
const highlightMat = new THREE.MeshStandardMaterial({
  color: 0xe49a4d,
  roughness: 0.94
});
const dimpleMat = new THREE.MeshStandardMaterial({
  color: 0x9f4d27,
  roughness: 1
});
const syrupMat = new THREE.MeshPhysicalMaterial({
  color: 0x8f3008,
  roughness: 0.24,
  metalness: 0,
  transmission: 0.03,
  transparent: true,
  opacity: 0.94,
  clearcoat: 0.75,
  clearcoatRoughness: 0.18
});
const syrupEdgeMat = syrupMat.clone();
syrupEdgeMat.color.setHex(0xb84d0b);
const butterMat = new THREE.MeshStandardMaterial({
  color: 0xffdf72,
  roughness: 0.67,
  metalness: 0
});
const butterLightMat = new THREE.MeshStandardMaterial({
  color: 0xffeda0,
  roughness: 0.72
});

const stack = new THREE.Group();
stack.rotation.y = -0.18;
scene.add(stack);

function seeded(seed) {
  const x = Math.sin(seed * 91.731 + 17.13) * 43758.5453;
  return x - Math.floor(x);
}

function pancakeGeometry(radius, height, seed) {
  const segments = 96;
  const rings = 14;
  const positions = [];
  const indices = [];

  for (let j = 0; j <= rings; j++) {
    const v = j / rings;
    const y = (v - 0.5) * height;
    const bulge = 1 + 0.075 * Math.sin(Math.PI * v);
    const edgeRound = 0.93 + 0.07 * Math.sin(Math.PI * v);
    for (let i = 0; i < segments; i++) {
      const a = i / segments * Math.PI * 2;
      const waviness =
        0.033 * Math.sin(a * 3 + seed * 1.7) +
        0.019 * Math.sin(a * 7 - seed * 0.9) +
        0.012 * Math.sin(a * 13 + seed);
      const verticalWarp =
        0.026 * Math.sin(a * 4 + seed + v * 4.2) +
        0.012 * Math.sin(a * 9 - seed * 2);
      const r = radius * bulge * edgeRound * (1 + waviness);
      positions.push(
        Math.cos(a) * r,
        y + verticalWarp,
        Math.sin(a) * r
      );
    }
  }

  for (let j = 0; j < rings; j++) {
    for (let i = 0; i < segments; i++) {
      const next = (i + 1) % segments;
      const a = j * segments + i;
      const b = j * segments + next;
      const c = (j + 1) * segments + next;
      const d = (j + 1) * segments + i;
      indices.push(a, b, d, b, c, d);
    }
  }

  const topCenter = positions.length / 3;
  positions.push(0, height * 0.5 + 0.012, 0);
  const bottomCenter = positions.length / 3;
  positions.push(0, -height * 0.5 - 0.012, 0);

  for (let i = 0; i < segments; i++) {
    const next = (i + 1) % segments;
    const topA = rings * segments + i;
    const topB = rings * segments + next;
    indices.push(topCenter, topA, topB);
    indices.push(bottomCenter, next, i);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function makePancake(y, radius, height, seed, x, z, tiltX, tiltZ) {
  const group = new THREE.Group();
  group.position.set(x, y, z);
  group.rotation.set(tiltX, seed * 0.08, tiltZ);

  const cake = new THREE.Mesh(pancakeGeometry(radius, height, seed), pancakeMat);
  cake.castShadow = true;
  cake.receiveShadow = true;
  group.add(cake);

  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(radius * 0.982, height * 0.14, 10, 96),
    edgeMat
  );
  rim.rotation.x = Math.PI / 2;
  rim.scale.set(1.01, 1, 0.98);
  rim.position.y = -height * 0.05;
  rim.castShadow = true;
  group.add(rim);

  for (let i = 0; i < 13; i++) {
    const a = seeded(seed * 20 + i) * Math.PI * 2;
    const py = (seeded(seed * 31 + i) - 0.5) * height * 0.52;
    const rr = radius * (0.99 + (seeded(seed * 43 + i) - 0.5) * 0.035);
    const mark = new THREE.Mesh(
      new THREE.SphereGeometry(0.075 + seeded(seed * 59 + i) * 0.055, 12, 8),
      i % 4 === 0 ? highlightMat : dimpleMat
    );
    mark.position.set(Math.cos(a) * rr, py, Math.sin(a) * rr);
    mark.scale.set(1.45, 0.56, 0.3);
    mark.lookAt(new THREE.Vector3(Math.cos(a) * (rr + 1), py, Math.sin(a) * (rr + 1)));
    group.add(mark);
  }

  for (let i = 0; i < 9; i++) {
    const a = seeded(seed * 71 + i) * Math.PI * 2;
    const r = radius * (0.2 + seeded(seed * 83 + i) * 0.65);
    const dimple = new THREE.Mesh(
      new THREE.SphereGeometry(0.07 + seeded(seed * 97 + i) * 0.045, 12, 8),
      dimpleMat
    );
    dimple.position.set(Math.cos(a) * r, height * 0.505, Math.sin(a) * r);
    dimple.scale.set(1.1, 0.15, 0.9);
    group.add(dimple);
  }

  stack.add(group);
  return group;
}

const bottom = makePancake(0.82, 2.55, 0.72, 1.3, -0.10, 0.03, -0.018, 0.026);
const middle = makePancake(1.57, 2.42, 0.70, 2.7, 0.11, -0.03, 0.032, -0.042);
const top = makePancake(2.31, 2.30, 0.68, 4.6, -0.03, 0.02, -0.018, 0.052);

function irregularDisc(radius, height, seed, material) {
  const geometry = new THREE.CylinderGeometry(radius, radius * 1.02, height, 64, 3);
  const p = geometry.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i);
    const y = p.getY(i);
    const z = p.getZ(i);
    const a = Math.atan2(z, x);
    const edge = Math.sqrt(x * x + z * z) / radius;
    const wave = 1 + edge * (
      0.07 * Math.sin(a * 3 + seed) +
      0.035 * Math.sin(a * 7 - seed * 1.3)
    );
    p.setXYZ(i, x * wave, y + 0.018 * Math.sin(a * 5 + seed), z * wave);
  }
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const syrupTop = irregularDisc(1.48, 0.115, 7.1, syrupMat);
syrupTop.position.set(0.18, 2.70, 0.05);
syrupTop.scale.set(1.08, 1, 0.86);
syrupTop.rotation.y = 0.36;
top.add(syrupTop);

function createDrip(parent, x, z, length, width, leanX = 0, leanZ = 0) {
  const drip = new THREE.Group();
  drip.position.set(x, 2.62, z);

  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(width, Math.max(0.08, length - width * 2), 7, 16),
    syrupMat
  );
  body.position.y = -length * 0.48;
  body.scale.set(1, 1, 0.72);
  body.rotation.z = leanZ;
  body.rotation.x = leanX;
  body.castShadow = true;
  drip.add(body);

  const bead = new THREE.Mesh(
    new THREE.SphereGeometry(width * 1.16, 18, 12),
    syrupEdgeMat
  );
  bead.position.y = -length + width * 0.15;
  bead.scale.set(1, 1.14, 0.76);
  bead.castShadow = true;
  drip.add(bead);
  parent.add(drip);
}

createDrip(stack, 2.02, 0.35, 1.25, 0.19, 0.02, -0.05);
createDrip(stack, -1.66, 1.12, 0.76, 0.15, -0.05, 0.03);
createDrip(stack, 0.75, -1.94, 0.93, 0.17, 0.04, -0.02);
createDrip(stack, -0.74, -2.03, 0.50, 0.12, 0.02, 0.01);

const syrupRibbon = new THREE.Mesh(
  new THREE.TorusGeometry(1.57, 0.10, 10, 64, Math.PI * 1.12),
  syrupMat
);
syrupRibbon.position.set(0.12, 2.64, 0.02);
syrupRibbon.rotation.set(Math.PI / 2, 0.1, -0.25);
syrupRibbon.scale.set(1.05, 0.84, 1);
syrupRibbon.castShadow = true;
stack.add(syrupRibbon);

const butter = new THREE.Group();
butter.position.set(0.14, 3.12, -0.02);
butter.rotation.set(-0.08, -0.28, 0.11);
stack.add(butter);

const butterCube = new THREE.Mesh(
  new RoundedBoxGeometry(1.16, 0.48, 0.95, 5, 0.14),
  butterMat
);
butterCube.castShadow = true;
butterCube.receiveShadow = true;
butter.add(butterCube);

const butterTop = new THREE.Mesh(
  new RoundedBoxGeometry(0.92, 0.035, 0.70, 4, 0.09),
  butterLightMat
);
butterTop.position.set(-0.08, 0.255, -0.06);
butter.add(butterTop);

for (let i = 0; i < 5; i++) {
  const groove = new THREE.Mesh(
    new THREE.TorusGeometry(0.20 + i * 0.045, 0.015, 6, 24, Math.PI * 0.72),
    butterMat
  );
  groove.position.set(-0.13, 0.282, -0.03 + i * 0.017);
  groove.rotation.set(Math.PI / 2, 0, 0.28);
  groove.scale.y = 0.55;
  butter.add(groove);
}

const meltFront = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.115, 0.24, 6, 14),
  butterMat
);
meltFront.position.set(0.36, -0.34, 0.43);
meltFront.rotation.z = -0.12;
meltFront.scale.z = 0.62;
meltFront.castShadow = true;
butter.add(meltFront);

const meltSide = new THREE.Mesh(
  new THREE.SphereGeometry(0.18, 16, 12),
  butterMat
);
meltSide.position.set(-0.49, -0.20, -0.18);
meltSide.scale.set(0.72, 1.5, 0.83);
meltSide.castShadow = true;
butter.add(meltSide);

const meltPuddle = irregularDisc(0.66, 0.075, 11.4, butterMat);
meltPuddle.position.set(0.12, 2.78, -0.03);
meltPuddle.scale.set(1.3, 1, 0.75);
stack.add(meltPuddle);

const fingerprintMat = new THREE.MeshStandardMaterial({
  color: 0xf4c95e,
  roughness: 0.9
});
for (let i = 0; i < 3; i++) {
  const print = new THREE.Mesh(
    new THREE.TorusGeometry(0.16 + i * 0.065, 0.012, 5, 28, Math.PI * 1.35),
    fingerprintMat
  );
  print.position.set(-0.12, 0.285 + i * 0.002, 0.02);
  print.rotation.set(Math.PI / 2, 0, -0.42);
  print.scale.y = 0.72;
  butter.add(print);
}

const plateMat = new THREE.MeshStandardMaterial({
  color: 0xf4cfa4,
  roughness: 0.86
});
const plate = new THREE.Mesh(
  new THREE.CylinderGeometry(3.25, 3.03, 0.18, 96),
  plateMat
);
plate.position.y = 0.34;
plate.scale.z = 0.92;
plate.castShadow = true;
plate.receiveShadow = true;
stack.add(plate);

const plateRim = new THREE.Mesh(
  new THREE.TorusGeometry(2.87, 0.22, 14, 96),
  plateMat
);
plateRim.position.y = 0.47;
plateRim.rotation.x = Math.PI / 2;
plateRim.scale.y = 0.92;
plateRim.castShadow = true;
plateRim.receiveShadow = true;
stack.add(plateRim);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(13, 96),
  new THREE.MeshStandardMaterial({ color: 0xe8c69f, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.18;
ground.receiveShadow = true;
scene.add(ground);

const contactShadow = new THREE.Mesh(
  new THREE.CircleGeometry(3.2, 64),
  new THREE.MeshBasicMaterial({
    color: 0x70412c,
    transparent: true,
    opacity: 0.12,
    depthWrite: false
  })
);
contactShadow.rotation.x = -Math.PI / 2;
contactShadow.position.y = 0.195;
contactShadow.scale.set(1, 0.72, 1);
scene.add(contactShadow);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
