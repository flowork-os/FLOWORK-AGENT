<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Industrial Gate Valve</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #11161a;
    }
    canvas { display: block; }
    .caption {
      position: fixed;
      left: 24px;
      bottom: 20px;
      color: rgba(225, 232, 234, 0.72);
      font: 500 11px/1.5 system-ui, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="caption">Cast Steel Gate Valve · Rising Stem</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x182126);
    scene.fog = new THREE.FogExp2(0x182126, 0.027);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(10.5, 7.2, 12);
    camera.lookAt(0, 1.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.35, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.minDistance = 8;
    controls.maxDistance = 26;
    controls.maxPolarAngle = Math.PI * 0.49;

    const castIron = new THREE.MeshStandardMaterial({
      color: 0x33484b,
      roughness: 0.63,
      metalness: 0.72
    });
    const castIronDark = new THREE.MeshStandardMaterial({
      color: 0x213237,
      roughness: 0.72,
      metalness: 0.67
    });
    const edgeMetal = new THREE.MeshStandardMaterial({
      color: 0x52666a,
      roughness: 0.44,
      metalness: 0.82
    });
    const steel = new THREE.MeshStandardMaterial({
      color: 0x8c9694,
      roughness: 0.28,
      metalness: 0.94
    });
    const darkSteel = new THREE.MeshStandardMaterial({
      color: 0x30383a,
      roughness: 0.38,
      metalness: 0.9
    });
    const wheelMaterial = new THREE.MeshStandardMaterial({
      color: 0x9a2f22,
      roughness: 0.5,
      metalness: 0.7
    });
    const wheelEdgeMaterial = new THREE.MeshStandardMaterial({
      color: 0xc04a32,
      roughness: 0.4,
      metalness: 0.75
    });
    const cavityMaterial = new THREE.MeshStandardMaterial({
      color: 0x070a0b,
      roughness: 0.92,
      metalness: 0.18
    });
    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x202a2d,
      roughness: 0.93,
      metalness: 0.12
    });

    const valve = new THREE.Group();
    valve.rotation.y = -0.12;
    scene.add(valve);

    function mesh(geometry, material, parent = valve) {
      const object = new THREE.Mesh(geometry, material);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function cylinderX(radiusTop, radiusBottom, length, segments, material, x, y, z) {
      const object = mesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, length, segments),
        material
      );
      object.rotation.z = Math.PI / 2;
      object.position.set(x, y, z);
      return object;
    }

    function cylinderBetween(a, b, radius, material, radialSegments = 12) {
      const direction = new THREE.Vector3().subVectors(b, a);
      const length = direction.length();
      const object = mesh(
        new THREE.CylinderGeometry(radius, radius, length, radialSegments),
        material
      );
      object.position.copy(a).add(b).multiplyScalar(0.5);
      object.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      return object;
    }

    const body = mesh(new THREE.SphereGeometry(1, 64, 36), castIron);
    body.scale.set(2.08, 1.52, 1.38);
    body.position.y = 0.02;

    const lowerBoss = mesh(new THREE.CylinderGeometry(0.77, 0.96, 0.52, 32), castIronDark);
    lowerBoss.position.y = -1.25;

    const bottomCap = mesh(new THREE.CylinderGeometry(0.93, 0.93, 0.2, 32), edgeMetal);
    bottomCap.position.y = -1.56;

    cylinderX(1.02, 1.02, 4.8, 48, castIronDark, 0, 0, 0);

    const bodyRibA = mesh(new THREE.TorusGeometry(1.18, 0.09, 10, 48), edgeMetal);
    bodyRibA.rotation.y = Math.PI / 2;
    bodyRibA.scale.set(1, 1.04, 1.18);
    bodyRibA.position.x = -1.45;

    const bodyRibB = bodyRibA.clone();
    bodyRibB.position.x = 1.45;
    valve.add(bodyRibB);

    function createPipeEnd(side) {
      const xNeck = side * 2.3;
      const xFlange = side * 3.03;
      const xFace = side * 3.28;

      cylinderX(1.08, 1.08, 1.38, 48, castIron, xNeck, 0, 0);
      cylinderX(1.56, 1.56, 0.5, 64, castIron, xFlange, 0, 0);
      cylinderX(1.63, 1.63, 0.12, 64, edgeMetal, xFace, 0, 0);

      const raisedFace = mesh(new THREE.TorusGeometry(1.03, 0.115, 14, 64), edgeMetal);
      raisedFace.rotation.y = Math.PI / 2;
      raisedFace.position.set(side * 3.355, 0, 0);

      const bore = mesh(new THREE.CircleGeometry(0.9, 64), cavityMaterial);
      bore.rotation.y = side > 0 ? Math.PI / 2 : -Math.PI / 2;
      bore.position.set(side * 3.421, 0, 0);

      const innerLip = mesh(new THREE.TorusGeometry(0.9, 0.055, 10, 64), steel);
      innerLip.rotation.y = Math.PI / 2;
      innerLip.position.set(side * 3.435, 0, 0);

      for (let i = 0; i < 10; i++) {
        const angle = i * Math.PI * 2 / 10;
        const y = Math.cos(angle) * 1.29;
        const z = Math.sin(angle) * 1.29;

        const recess = cylinderX(
          0.18, 0.18, 0.035, 20, cavityMaterial,
          side * 3.442, y, z
        );

        const stud = cylinderX(
          0.1, 0.1, 0.22, 12, darkSteel,
          side * 3.46, y, z
        );

        const bolt = cylinderX(
          0.17, 0.17, 0.13, 6, steel,
          side * 3.54, y, z
        );
        bolt.rotation.x = angle * 0.5;
      }
    }

    createPipeEnd(-1);
    createPipeEnd(1);

    const bonnetBase = mesh(new THREE.CylinderGeometry(1.47, 1.47, 0.28, 48), castIron);
    bonnetBase.position.y = 1.43;

    const bonnetSeam = mesh(new THREE.CylinderGeometry(1.53, 1.53, 0.1, 48), edgeMetal);
    bonnetSeam.position.y = 1.55;

    const bonnet = mesh(new THREE.CylinderGeometry(0.72, 1.22, 1.18, 48), castIron);
    bonnet.position.y = 2.05;

    const bonnetShoulder = mesh(new THREE.CylinderGeometry(0.77, 0.77, 0.22, 48), edgeMetal);
    bonnetShoulder.position.y = 2.69;

    const packingBody = mesh(new THREE.CylinderGeometry(0.51, 0.63, 0.7, 40), castIronDark);
    packingBody.position.y = 3.12;

    const gland = mesh(new THREE.CylinderGeometry(0.57, 0.57, 0.18, 40), edgeMetal);
    gland.position.y = 3.49;

    const glandNut = mesh(new THREE.CylinderGeometry(0.43, 0.43, 0.32, 8), steel);
    glandNut.position.y = 3.72;

    for (let i = 0; i < 10; i++) {
      const angle = i * Math.PI * 2 / 10;
      const x = Math.cos(angle) * 1.18;
      const z = Math.sin(angle) * 1.18;

      const stud = mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.34, 12), darkSteel);
      stud.position.set(x, 1.65, z);

      const lowerNut = mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.13, 6), steel);
      lowerNut.position.set(x, 1.73, z);
      lowerNut.rotation.y = angle;

      const washer = mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.035, 20), darkSteel);
      washer.position.set(x, 1.65, z);
    }

    const yokeRing = mesh(new THREE.TorusGeometry(0.68, 0.12, 14, 48), castIron);
    yokeRing.rotation.x = Math.PI / 2;
    yokeRing.position.y = 4.62;

    const yokeLeftA = new THREE.Vector3(-0.58, 3.58, 0);
    const yokeLeftB = new THREE.Vector3(-0.7, 4.62, 0);
    const yokeRightA = new THREE.Vector3(0.58, 3.58, 0);
    const yokeRightB = new THREE.Vector3(0.7, 4.62, 0);
    cylinderBetween(yokeLeftA, yokeLeftB, 0.13, castIron, 16);
    cylinderBetween(yokeRightA, yokeRightB, 0.13, castIron, 16);

    const yokeCross = mesh(new THREE.CylinderGeometry(0.73, 0.73, 0.2, 40), castIronDark);
    yokeCross.position.y = 4.64;

    const stem = mesh(new THREE.CylinderGeometry(0.135, 0.135, 2.95, 24), steel);
    stem.position.y = 4.8;

    const threadPoints = [];
    const turns = 12;
    const threadStart = 3.92;
    const threadEnd = 5.5;
    const samples = 180;
    for (let i = 0; i <= samples; i++) {
      const t = i / samples;
      const angle = t * Math.PI * 2 * turns;
      threadPoints.push(new THREE.Vector3(
        Math.cos(angle) * 0.148,
        THREE.MathUtils.lerp(threadStart, threadEnd, t),
        Math.sin(angle) * 0.148
      ));
    }
    const threadCurve = new THREE.CatmullRomCurve3(threadPoints);
    const thread = mesh(new THREE.TubeGeometry(threadCurve, 240, 0.018, 6, false), darkSteel);

    const wheelGroup = new THREE.Group();
    wheelGroup.position.y = 5.58;
    valve.add(wheelGroup);

    const wheelRim = mesh(
      new THREE.TorusGeometry(1.66, 0.14, 18, 96),
      wheelMaterial,
      wheelGroup
    );
    wheelRim.rotation.x = Math.PI / 2;

    const wheelHighlight = mesh(
      new THREE.TorusGeometry(1.66, 0.045, 8, 96),
      wheelEdgeMaterial,
      wheelGroup
    );
    wheelHighlight.rotation.x = Math.PI / 2;
    wheelHighlight.position.y = 0.115;

    const hub = mesh(
      new THREE.CylinderGeometry(0.35, 0.35, 0.34, 32),
      wheelMaterial,
      wheelGroup
    );

    const hubNut = mesh(
      new THREE.CylinderGeometry(0.25, 0.25, 0.21, 8),
      steel,
      wheelGroup
    );
    hubNut.position.y = 0.27;

    const spokeCount = 6;
    for (let i = 0; i < spokeCount; i++) {
      const angle = i * Math.PI * 2 / spokeCount;
      const start = new THREE.Vector3(
        Math.cos(angle) * 0.27,
        0,
        Math.sin(angle) * 0.27
      );
      const end = new THREE.Vector3(
        Math.cos(angle) * 1.55,
        0,
        Math.sin(angle) * 1.55
      );
      const direction = new THREE.Vector3().subVectors(end, start);
      const spoke = mesh(
        new THREE.CylinderGeometry(0.075, 0.105, direction.length(), 12),
        wheelMaterial,
        wheelGroup
      );
      spoke.position.copy(start).add(end).multiplyScalar(0.5);
      spoke.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
    }

    const identificationPlate = mesh(
      new THREE.BoxGeometry(0.92, 0.48, 0.055),
      edgeMetal
    );
    identificationPlate.position.set(0, 0.55, 1.34);
    identificationPlate.rotation.x = -0.08;

    const plateInset = mesh(
      new THREE.BoxGeometry(0.72, 0.29, 0.025),
      darkSteel
    );
    plateInset.position.set(0, 0.55, 1.378);
    plateInset.rotation.x = -0.08;

    const floor = mesh(
      new THREE.CircleGeometry(22, 96),
      floorMaterial,
      scene
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.68;
    floor.receiveShadow = true;
    floor.castShadow = false;

    const ringMarkMaterial = new THREE.MeshBasicMaterial({
      color: 0x526166,
      transparent: true,
      opacity: 0.16,
      depthWrite: false
    });
    for (const radius of [5, 8, 12, 16]) {
      const mark = new THREE.Mesh(
        new THREE.RingGeometry(radius - 0.018, radius + 0.018, 96),
        ringMarkMaterial
      );
      mark.rotation.x = -Math.PI / 2;
      mark.position.y = -1.672;
      scene.add(mark);
    }

    const hemisphere = new THREE.HemisphereLight(0xaecbd2, 0x172025, 2.2);
    scene.add(hemisphere);

    const keyLight = new THREE.DirectionalLight(0xffeee0, 5.2);
    keyLight.position.set(7, 11, 8);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -8;
    keyLight.shadow.camera.right = 8;
    keyLight.shadow.camera.top = 10;
    keyLight.shadow.camera.bottom = -6;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 35;
    keyLight.shadow.bias = -0.0002;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x70b7d8, 3.6);
    rimLight.position.set(-8, 6, -7);
    scene.add(rimLight);

    const warmFill = new THREE.PointLight(0xff7d52, 32, 16, 2);
    warmFill.position.set(5, 1, -5);
    scene.add(warmFill);

    valve.traverse((object) => {
      if (object.isMesh) {
        object.castShadow = true;
        object.receiveShadow = true;
      }
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
