<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Food Truck</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#f4eee1}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4eee1);
scene.fog = new THREE.Fog(0xf4eee1, 18, 40);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.5, 4.2, 8.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 5;
controls.maxDistance = 18;
controls.maxPolarAngle = 1.45;

scene.add(new THREE.HemisphereLight(0xfffaf0, 0xd8c7a8, 0.9));
const sun = new THREE.DirectionalLight(0xfff2df, 2.2);
sun.position.set(6, 9, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -7;
sun.shadow.camera.right = sun.shadow.camera.top = 7;
sun.shadow.camera.near = 2;
sun.shadow.camera.far = 25;
sun.shadow.bias = -0.0005;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdfeaff, 0.5);
fill.position.set(-6, 4, -6);
scene.add(fill);

const ground = new THREE.Mesh(new THREE.CircleGeometry(12, 48), new THREE.MeshStandardMaterial({ color: 0xe9e0cc, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const M = (c, r = 0.6, m = 0) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m });
const cream = M(0xfdf5e6, 0.55), red = M(0xe8503c, 0.5), teal = M(0x2fa8a0, 0.5);
const dark = M(0x30313a, 0.8), metal = M(0xb9bdc4, 0.35, 0.7), wood = M(0xc98a4b, 0.7);
const glass = M(0x9fd3e4, 0.15, 0.4);
const glow = new THREE.MeshStandardMaterial({ color: 0xffc98a, emissive: 0xffa54d, emissiveIntensity: 1.1 });
const lamp = new THREE.MeshStandardMaterial({ color: 0xfff6d8, emissive: 0xffdf9e, emissiveIntensity: 0.9, roughness: 0.3 });
const tail = new THREE.MeshStandardMaterial({ color: 0xd23c30, emissive: 0xb01f14, emissiveIntensity: 0.7 });

const truck = new THREE.Group();
truck.position.x = 0.1;
scene.add(truck);

function box(w, h, d, mat, x, y, z, rx = 0, ry = 0, rz = 0, parent = truck) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
function cyl(r, h, mat, x, y, z, rx = 0, rz = 0, seg = 20) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, 0, rz);
  m.castShadow = m.receiveShadow = true;
  truck.add(m);
  return m;
}

// chassis + body
box(5.2, 0.18, 1.7, dark, 0, 0.6, 0);
box(3.4, 2.05, 2.1, cream, -0.9, 1.75, 0);
box(3.44, 0.34, 2.16, teal, -0.9, 1.05, 0);   // livery bands
box(3.44, 0.1, 2.16, red, -0.9, 1.3, 0);

// driver cab
box(0.9, 1.35, 2.02, cream, 1.25, 1.4, 0);
box(1.1, 0.12, 2.06, red, 1.35, 2.13, 0);      // cab roof
box(0.8, 0.6, 1.94, cream, 2.25, 1.02, 0);     // hood
box(0.82, 0.61, 0.5, red, 2.25, 1.02, 0);      // hood stripe
box(0.06, 0.9, 1.7, glass, 1.88, 1.75, 0, 0, 0, 0.28); // windshield
box(0.7, 0.6, 2.06, glass, 1.3, 1.75, 0);      // side windows
box(0.25, 0.22, 2.1, metal, 2.7, 0.62, 0);     // front bumper
box(0.06, 0.3, 1.2, dark, 2.68, 1.05, 0);      // grille
box(0.2, 0.22, 2.1, metal, -2.68, 0.62, 0);    // rear bumper

// serving window (open, hinged flap up) — +Z side
box(2.24, 1.34, 0.1, M(0x3a3230, 0.9), -0.9, 2.0, 0.99);   // interior
box(2.0, 0.1, 0.02, glow, -0.9, 2.35, 1.045);              // warm interior light
box(2.3, 0.1, 0.1, cream, -0.9, 2.6, 1.06);                // frame
box(2.3, 0.1, 0.1, cream, -0.9, 1.4, 1.06);
box(0.1, 1.3, 0.1, cream, -2.0, 2.0, 1.06);
box(0.1, 1.3, 0.1, cream, 0.2, 2.0, 1.06);

// hinged striped awning flap
const awn = new THREE.Group();
awn.position.set(-0.9, 2.62, 1.1);
awn.rotation.x = -2.1;
truck.add(awn);
for (let i = 0; i < 6; i++)
  box(0.383, 1.2, 0.05, i % 2 ? cream : red, -0.958 + i * 0.383, -0.6, 0, 0, 0, 0, awn);
box(2.34, 0.06, 0.08, teal, 0, -1.2, 0, 0, 0, 0, awn);

// fold-out counter + struts
box(2.3, 0.07, 0.6, wood, -0.9, 1.45, 1.32);
box(0.05, 0.05, 0.58, metal, -1.8, 1.26, 1.3, -0.56);
box(0.05, 0.05, 0.58, metal, 0, 1.26, 1.3, -0.56);

// menu board on brackets by the window
box(0.04, 0.04, 0.26, dark, 0.35, 2.5, 1.18);
box(0.04, 0.04, 0.26, dark, 0.65, 2.5, 1.18);
box(0.025, 0.18, 0.025, dark, 0.35, 2.41, 1.3);
box(0.025, 0.18, 0.025, dark, 0.65, 2.41, 1.3);
box(0.55, 0.65, 0.04, dark, 0.5, 1.98, 1.29);
box(0.45, 0.09, 0.012, red, 0.5, 2.22, 1.315);
box(0.4, 0.035, 0.012, cream, 0.5, 2.07, 1.315);
box(0.4, 0.035, 0.012, cream, 0.5, 1.95, 1.315);
box(0.4, 0.035, 0.012, cream, 0.5, 1.83, 1.315);

// roof: exhaust hood + chimney, cheery sign
box(1.0, 0.3, 0.95, metal, -1.7, 2.93, 0);
cyl(0.13, 0.5, metal, -1.7, 3.3, 0);
cyl(0.2, 0.05, metal, -1.7, 3.58, 0);
box(0.06, 0.15, 0.06, dark, -0.75, 2.85, 0);
box(0.06, 0.15, 0.06, dark, 0.45, 2.85, 0);
box(1.6, 0.42, 0.16, red, -0.15, 3.13, 0);
box(1.5, 0.18, 0.17, cream, -0.15, 3.13, 0);

// generator box at the rear
box(0.55, 0.5, 0.85, metal, -2.9, 0.78, 0);
for (let i = 0; i < 3; i++) box(0.02, 0.06, 0.7, dark, -3.18, 0.65 + i * 0.13, 0);
cyl(0.05, 0.08, dark, -2.9, 1.06, 0.25);

// logo roundel on the other side
cyl(0.55, 0.05, teal, -0.9, 1.95, -1.07, Math.PI / 2, 0, 32);
cyl(0.42, 0.05, cream, -0.9, 1.95, -1.09, Math.PI / 2, 0, 32);
cyl(0.16, 0.05, red, -0.9, 1.95, -1.11, Math.PI / 2, 0, 32);

// wheels + arches, doors, lights (mirrored)
const tire = M(0x24242a, 0.95), hub = M(0xd8d8de, 0.35, 0.8);
function wheel(x, z) {
  cyl(0.42, 0.3, tire, x, 0.42, z, Math.PI / 2, 0, 24);
  cyl(0.22, 0.32, hub, x, 0.42, z, Math.PI / 2, 0, 16);
  cyl(0.07, 0.36, metal, x, 0.42, z, Math.PI / 2, 0, 12);
}
function arch(x, z) {
  const a = new THREE.Mesh(new THREE.TorusGeometry(0.58, 0.085, 10, 24, Math.PI), red);
  a.position.set(x, 0.42, z);
  a.castShadow = true;
  truck.add(a);
}
for (const s of [1, -1]) {
  wheel(1.75, 0.88 * s); wheel(-1.6, 0.88 * s);
  arch(1.75, 1.02 * s); arch(-1.6, 1.06 * s);
  box(0.75, 1.0, 0.02, M(0xf1e6d2, 0.55), 1.3, 1.25, 1.035 * s);          // cab doors
  box(0.15, 0.04, 0.04, dark, 1.05, 1.55, 1.05 * s);                      // handles
  box(0.04, 0.04, 0.22, dark, 1.8, 1.95, 1.12 * s);                       // mirror arms
  box(0.07, 0.2, 0.12, dark, 1.8, 1.95, 1.26 * s);
  cyl(0.1, 0.08, lamp, 2.68, 1.18, 0.72 * s, 0, Math.PI / 2, 16);         // headlights
  box(0.05, 0.2, 0.12, tail, -2.72, 1.1, 0.9 * s);                        // tail lights
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function tick() {
  requestAnimationFrame(tick);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
