<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Raincoat Mannequin — Procedural three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15161a; }
  #app { position: fixed; inset: 0; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #8b8f98; letter-spacing: .02em; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hint">Drag to orbit · scroll to zoom · auto-rotating display</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ */
/* Renderer                                                            */
/* ------------------------------------------------------------------ */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

/* ------------------------------------------------------------------ */
/* Scene & camera                                                      */
/* ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15161a);
scene.fog = new THREE.Fog(0x15161a, 7, 18);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.6, 1.55, 3.15);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 2.0;
controls.maxDistance = 8.0;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 0.95, 0);

/* ------------------------------------------------------------------ */
/* Lighting: hemisphere ambient + key / fill / rim                     */
/* ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xbfd4ff, 0x1c1d22, 0.55);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
keyLight.position.set(3.2, 5.2, 3.0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 22;
keyLight.shadow.camera.left = -2.2;
keyLight.shadow.camera.right = 2.2;
keyLight.shadow.camera.top = 2.6;
keyLight.shadow.camera.bottom = -0.3;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.radius = 3;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x9fb4d0, 0.7);
fillLight.position.set(-4.0, 2.2, 2.5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xdfe8ff, 1.35);
rimLight.position.set(-2.5, 3.4, -4.2);
scene.add(rimLight);

/* ------------------------------------------------------------------ */
/* Ground plane — only receives shadows                                */
/* ------------------------------------------------------------------ */
const shadowGround = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
shadowGround.rotation.x = -Math.PI / 2;
shadowGround.position.y = -0.06;
shadowGround.receiveShadow = true;
scene.add(shadowGround);

/* ------------------------------------------------------------------ */
/* Materials                                                           */
/* ------------------------------------------------------------------ */
const mannequinMat = new THREE.MeshStandardMaterial({
  color: 0xdad5cc, roughness: 0.82, metalness: 0.0
});

const coatMat = new THREE.MeshPhysicalMaterial({
  color: 0xf2c015, roughness: 0.55, metalness: 0.0,
  clearcoat: 0.65, clearcoatRoughness: 0.32, side: THREE.DoubleSide
});

const collarMat = new THREE.MeshPhysicalMaterial({
  color: 0xe0ad10, roughness: 0.5, metalness: 0.0,
  clearcoat: 0.6, clearcoatRoughness: 0.3
});

const beltMat = new THREE.MeshStandardMaterial({
  color: 0x4a3218, roughness: 0.55, metalness: 0.05
});

const buckleMat = new THREE.MeshStandardMaterial({
  color: 0xcbb45a, roughness: 0.3, metalness: 0.9
});

const buttonMat = new THREE.MeshStandardMaterial({
  color: 0x2a2a2e, roughness: 0.4, metalness: 0.2
});

const bootMat = new THREE.MeshPhysicalMaterial({
  color: 0x243447, roughness: 0.4, metalness: 0.0,
  clearcoat: 0.75, clearcoatRoughness: 0.25
});

const soleMat = new THREE.MeshStandardMaterial({
  color: 0x14181f, roughness: 0.85, metalness: 0.0
});

const baseMat = new THREE.MeshStandardMaterial({
  color: 0x2b2c33, roughness: 0.35, metalness: 0.75
});

const baseInlayMat = new THREE.MeshStandardMaterial({
  color: 0x3a3b44, roughness: 0.5, metalness: 0.55
});

/* helper */
function mesh(geo, mat, opts = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = opts.cast !== false;
  m.receiveShadow = opts.receive === true;
  if (opts.pos) m.position.set(opts.pos[0], opts.pos[1], opts.pos[2]);
  if (opts.rot) m.rotation.set(opts.rot[0], opts.rot[1], opts.rot[2]);
  if (opts.scale) m.scale.set(opts.scale[0], opts.scale[1], opts.scale[2]);
  return m;
}

/* ------------------------------------------------------------------ */
/* The single centered object: the figure                             */
/* ------------------------------------------------------------------ */
const figure = new THREE.Group();
scene.add(figure);

/* ---- Display base (round pedestal) ---- */
const baseGroup = new THREE.Group();
baseGroup.add(mesh(new THREE.CylinderGeometry(0.5, 0.52, 0.03, 72), baseMat, { pos: [0, -0.045, 0], receive: true }));
baseGroup.add(mesh(new THREE.CylinderGeometry(0.44, 0.5, 0.045, 72), baseMat, { pos: [0, -0.0175, 0], receive: true }));
baseGroup.add(mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.008, 72), baseInlayMat, { pos: [0, 0.006, 0], receive: true }));
baseGroup.add(mesh(new THREE.TorusGeometry(0.44, 0.012, 16, 72), buckleMat, { pos: [0, 0.004, 0], rot: [Math.PI / 2, 0, 0] }));
figure.add(baseGroup);

/* ---- Legs (visible under hem, inside boots) ---- */
function makeLeg(sign) {
  const g = new THREE.Group();
  // thigh -> ankle capsule
  g.add(mesh(new THREE.CapsuleGeometry(0.082, 0.6, 12, 20), mannequinMat, { pos: [0, 0.5, 0] }));
  g.position.set(sign * 0.1, 0, 0);
  return g;
}
figure.add(makeLeg(1));
figure.add(makeLeg(-1));

/* ---- Rain boots ---- */
function makeBoot(sign) {
  const g = new THREE.Group();
  // shaft
  g.add(mesh(new THREE.CylinderGeometry(0.1, 0.093, 0.36, 28), bootMat, { pos: [0, 0.26, 0] }));
  // rounded top rim
  g.add(mesh(new THREE.TorusGeometry(0.098, 0.016, 14, 28), bootMat, { pos: [0, 0.44, 0], rot: [Math.PI / 2, 0, 0] }));
  // foot (elongated forward)
  g.add(mesh(new THREE.SphereGeometry(0.1, 26, 20), bootMat, { pos: [0, 0.075, 0.055], scale: [0.9, 0.62, 1.75] }));
  // sole
  g.add(mesh(new THREE.CylinderGeometry(0.075, 0.082, 0.03, 24), soleMat, { pos: [0, 0.016, 0.06], scale: [1.05, 1, 2.0] }));
  g.position.set(sign * 0.1, 0, 0);
  return g;
}
figure.add(makeBoot(1));
figure.add(makeBoot(-1));

/* ---- Neck & head (smooth, featureless) ---- */
figure.add(mesh(new THREE.CylinderGeometry(0.052, 0.06, 0.14, 24), mannequinMat, { pos: [0, 1.45, 0] }));
figure.add(mesh(new THREE.SphereGeometry(0.108, 40, 32), mannequinMat, { pos: [0, 1.6, 0.004], scale: [0.94, 1.16, 1.02] }));

/* ---- The raincoat (lathe silhouette, flattened front-to-back) ---- */
const coatProfile = [
  [0.300, 0.50],
  [0.293, 0.58],
  [0.278, 0.68],
  [0.252, 0.78],
  [0.218, 0.90],
  [0.188, 0.98],
  [0.170, 1.02],
  [0.172, 1.10],
  [0.183, 1.20],
  [0.196, 1.30],
  [0.202, 1.37],
  [0.176, 1.42],
  [0.120, 1.45],
  [0.142, 1.50]
].map(p => new THREE.Vector2(p[0], p[1]));

const coatGroup = new THREE.Group();
coatGroup.scale.set(1, 1, 0.78);   // flatten so shoulders read wider than deep

const coatBody = mesh(new THREE.LatheGeometry(coatProfile, 96), coatMat, { receive: true });
coatBody.castShadow = true;
coatGroup.add(coatBody);

// collar roll
coatGroup.add(mesh(new THREE.TorusGeometry(0.125, 0.032, 18, 40), collarMat, { pos: [0, 1.465, 0.01], rot: [Math.PI / 2, 0, 0] }));

// belt
coatGroup.add(mesh(new THREE.TorusGeometry(0.171, 0.026, 18, 56), beltMat, { pos: [0, 1.01, 0], rot: [Math.PI / 2, 0, 0] }));

figure.add(coatGroup);

// belt buckle (front, accounts for the group's z-flatten so place directly on figure)
figure.add(mesh(new THREE.BoxGeometry(0.07, 0.05, 0.02), buckleMat, { pos: [0, 1.01, 0.152] }));

// buttons down the front placket
const buttonRows = [1.28, 1.20, 1.12];
for (const y of buttonRows) {
  // radius at y from profile, scaled by coat z-flatten
  let r = 0.185;
  for (let i = 0; i < coatProfile.length - 1; i++) {
    const a = coatProfile[i], b = coatProfile[i + 1];
    if (y >= a.y && y <= b.y) { const t = (y - a.y) / (b.y - a.y); r = a.x + (b.x - a.x) * t; break; }
  }
  const z = r * 0.78 + 0.006;
  figure.add(mesh(new THREE.SphereGeometry(0.014, 16, 12), buttonMat, { pos: [0, y, z] }));
}

// subtle front seam / placket ridge
figure.add(mesh(new THREE.BoxGeometry(0.018, 0.78, 0.01), collarMat, { pos: [0, 0.98, 0.152] }));

/* ---- Arms with coat sleeves + featureless hands ---- */
function makeArm(sign) {
  const g = new THREE.Group();
  g.position.set(sign * 0.18, 1.4, 0);
  g.rotation.z = sign * 0.14;   // hang slightly outward
  // sleeve
  const sleeve = mesh(new THREE.CapsuleGeometry(0.062, 0.3, 12, 20), coatMat, { pos: [0, -0.21, 0] });
  sleeve.receiveShadow = true;
  g.add(sleeve);
  // cuff
  g.add(mesh(new THREE.TorusGeometry(0.062, 0.014, 14, 26), collarMat, { pos: [0, -0.39, 0], rot: [Math.PI / 2, 0, 0] }));
  // hand
  g.add(mesh(new THREE.SphereGeometry(0.058, 26, 20), mannequinMat, { pos: [0, -0.45, 0.005], scale: [0.9, 1.1, 0.85] }));
  return g;
}
figure.add(makeArm(1));
figure.add(makeArm(-1));

/* ------------------------------------------------------------------ */
/* Resize                                                              */
/* ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

/* ------------------------------------------------------------------ */
/* Animation loop                                                      */
/* ------------------------------------------------------------------ */
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
