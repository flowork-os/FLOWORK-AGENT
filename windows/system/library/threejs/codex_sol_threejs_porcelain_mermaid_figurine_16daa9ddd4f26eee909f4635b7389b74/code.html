function shadowify(object) {
  object.traverse((child) => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });
  return object;
}

function ellipsoid(radius, scale, material, position) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 32, 20),
    material
  );
  mesh.scale.copy(scale);
  mesh.position.copy(position);
  return mesh;
}

function cylinderBetween(a, b, radiusA, radiusB, material, radialSegments = 18) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(radiusB, radiusA, length, radialSegments, 2, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  return mesh;
}

function tubeFromPoints(points, radius, material, tubularSegments = 48, radialSegments = 10) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const geometry = new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, false);
  return new THREE.Mesh(geometry, material);
}

function taperedTube(curve, radiusAt, tubularSegments, radialSegments, material) {
  const frames = curve.computeFrenetFrames(tubularSegments, false);
  const positions = [];
  const indices = [];
  const uv = [];
  const point = new THREE.Vector3();

  for (let i = 0; i <= tubularSegments; i++) {
    const t = i / tubularSegments;
    curve.getPointAt(t, point);
    const radius = Math.max(0.015, radiusAt(t));
    const normal = frames.normals[i];
    const binormal = frames.binormals[i];

    for (let j = 0; j <= radialSegments; j++) {
      const angle = (j / radialSegments) * Math.PI * 2;
      const offset = new THREE.Vector3()
        .copy(normal)
        .multiplyScalar(Math.cos(angle) * radius)
        .addScaledVector(binormal, Math.sin(angle) * radius);
      positions.push(point.x + offset.x, point.y + offset.y, point.z + offset.z);
      uv.push(t, j / radialSegments);
    }
  }

  const row = radialSegments + 1;
  for (let i = 0; i < tubularSegments; i++) {
    for (let j = 0; j < radialSegments; j++) {
      const a = i * row + j;
      const b = (i + 1) * row + j;
      const c = (i + 1) * row + j + 1;
      const d = i * row + j + 1;
      indices.push(a, b, d, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  return new THREE.Mesh(geometry, material);
}

function makeShell(material, scale = 1) {
  const shell = new THREE.Group();
  const shape = new THREE.Shape();
  shape.moveTo(0, -0.16);
  shape.bezierCurveTo(-0.46, -0.02, -0.48, 0.38, 0, 0.54);
  shape.bezierCurveTo(0.48, 0.38, 0.46, -0.02, 0, -0.16);

  const body = new THREE.Mesh(
    new THREE.ExtrudeGeometry(shape, {
      depth: 0.1,
      bevelEnabled: true,
      bevelSegments: 3,
      bevelSize: 0.035,
      bevelThickness: 0.035,
      curveSegments: 12
    }),
    material
  );
  body.position.z = -0.05;
  shell.add(body);

  for (let i = -2; i <= 2; i++) {
    const endX = i * 0.15;
    const ridge = tubeFromPoints([
      new THREE.Vector3(0, -0.08, 0.09),
      new THREE.Vector3(endX * 0.45, 0.18, 0.12),
      new THREE.Vector3(endX, 0.42 - Math.abs(i) * 0.025, 0.08)
    ], 0.013, gold, 16, 6);
    shell.add(ridge);
  }
  shell.scale.setScalar(scale);
  return shell;
}

function addArm(points) {
  const group = new THREE.Group();
  for (let i = 0; i < points.length - 1; i++) {
    const segment = cylinderBetween(
      points[i],
      points[i + 1],
      i === 0 ? 0.145 : 0.125,
      i === points.length - 2 ? 0.09 : 0.12,
      warmPorcelain,
      20
    );
    group.add(segment);
    if (i < points.length - 2) {
      group.add(ellipsoid(
        0.13,
        new THREE.Vector3(1, 1.05, 1),
        warmPorcelain,
        points[i + 1].clone()
      ));
    }
  }
  const hand = ellipsoid(
    0.15,
    new THREE.Vector3(0.65, 1.25, 0.5),
    warmPorcelain,
    points[points.length - 1].clone()
  );
  group.add(hand);
  return group;
}

scene.add(frontGlow);

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}
window.addEventListener('resize', resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
