<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Procedural Bonsai Pine</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101712; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101812);
scene.fog = new THREE.Fog(0x101812, 14, 33);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(10.5, 6.8, 12.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.38;
controls.minDistance = 6;
controls.maxDistance = 26;
controls.maxPolarAngle = Math.PI * 0.485;

const world = new THREE.Group();
scene.add(world);

const barkMaterial = new THREE.MeshStandardMaterial({
  color: 0x473527,
  roughness: 0.96,
  metalness: 0.0
});
const barkDarkMaterial = new THREE.MeshStandardMaterial({
  color: 0x241b15,
  roughness: 1
});
const cutMaterial = new THREE.MeshStandardMaterial({
  color: 0x946642,
  roughness: 0.9
});
const soilMaterial = new THREE.MeshStandardMaterial({
  color: 0x18130d,
  roughness: 1
});
const potMaterial = new THREE.MeshStandardMaterial({
  color: 0x273a32,
  roughness: 0.48,
  metalness: 0.08
});
const potRimMaterial = new THREE.MeshStandardMaterial({
  color: 0x345447,
  roughness: 0.36,
  metalness: 0.1
});
const wireMaterial = new THREE.MeshStandardMaterial({
  color: 0x5a4936,
  roughness: 0.31,
  metalness: 0.82
});
const needleMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x183c25, roughness: 0.82 }),
  new THREE.MeshStandardMaterial({ color: 0x245837, roughness: 0.8 }),
  new THREE.MeshStandardMaterial({ color: 0x0d291a, roughness: 0.87 })
];

const random = (seed) => {
  const value = Math.sin(seed * 127.1 + 311.7) * 43758.5453123;
  return value - Math.floor(value);
};

function cylinderBetween(a, b, rA, rB, material, radialSegments = 9) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  if (length < 0.001) return null;
  const geometry = new THREE.CylinderGeometry(rB, rA, length, radialSegments, 4, false);
  geometry.rotateY(random(a.x * 31 + a.z * 19) * 0.4);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  world.add(mesh);
  return mesh;
}

function tubeAlong(points, radius, material, tubularSegments = 40, radialSegments = 7) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const geometry = new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  world.add(mesh);
  return { mesh, curve };
}

function makeBarkRidge(a, b, radius, seed) {
  const offset = new THREE.Vector3(
    (random(seed) - 0.5) * radius * 1.35,
    0,
    (random(seed + 2) - 0.5) * radius * 1.35
  );
  const start = a.clone().lerp(b, 0.08).add(offset);
  const end = a.clone().lerp(b, 0.93).add(offset.multiplyScalar(0.68));
  cylinderBetween(start, end, radius * (0.035 + random(seed + 4) * 0.025), radius * 0.024, barkDarkMaterial, 5);
}

const potBase = new THREE.Mesh(new THREE.BoxGeometry(8.2, 0.9, 5.35), potMaterial);
potBase.position.y = 0.15;
potBase.castShadow = true;
potBase.receiveShadow = true;
world.add(potBase);

const potTop = new THREE.Mesh(new THREE.BoxGeometry(8.7, 0.34, 5.85), potRimMaterial);
potTop.position.y = 0.65;
potTop.castShadow = true;
potTop.receiveShadow = true;
world.add(potTop);

const soil = new THREE.Mesh(new THREE.BoxGeometry(7.85, 0.16, 4.98), soilMaterial);
soil.position.y = 0.85;
soil.receiveShadow = true;
world.add(soil);

for (const x of [-3.18, 3.18]) {
  for (const z of [-1.95, 1.95]) {
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.24, 0.62), potMaterial);
    foot.position.set(x, -0.42, z);
    foot.castShadow = true;
    foot.receiveShadow = true;
    world.add(foot);
  }
}

const rootStarts = [
  new THREE.Vector3(-0.08, 0.95, 0.0),
  new THREE.Vector3(0.04, 0.98, 0.02),
  new THREE.Vector3(0.0, 1.0, -0.04),
  new THREE.Vector3(0.12, 1.03, 0.0),
  new THREE.Vector3(-0.1, 0.99, 0.04),
  new THREE.Vector3(0.08, 0.96, -0.08)
];
for (let i = 0; i < 11; i++) {
  const angle = (i / 11) * Math.PI * 2 + random(i + 70) * 0.26;
  const length = 1.35 + random(i + 11) * 1.55;
  const start = rootStarts[i % rootStarts.length].clone();
  const middle = new THREE.Vector3(
    Math.cos(angle) * length * 0.54,
    0.89 + random(i + 9) * 0.18,
    Math.sin(angle) * length * 0.54
  );
  const end = new THREE.Vector3(
    Math.cos(angle) * length,
    0.9,
    Math.sin(angle) * length * 0.76
  );
  tubeAlong([start, middle, end], 0.14 + random(i + 32) * 0.12, barkMaterial, 18, 7);
}

const trunkPoints = [
  new THREE.Vector3(0.0, 0.95, 0.0),
  new THREE.Vector3(-0.22, 1.72, 0.10),
  new THREE.Vector3(0.12, 2.56, -0.08),
  new THREE.Vector3(-0.18, 3.38, 0.08),
  new THREE.Vector3(0.10, 4.27, -0.12),
  new THREE.Vector3(-0.03, 5.15, 0.02),
  new THREE.Vector3(0.20, 5.92, -0.08),
  new THREE.Vector3(0.05, 6.73, 0.03)
];
const trunk = tubeAlong(trunkPoints, 0.44, barkMaterial, 96, 11).mesh;
trunk.scale.set(1, 1, 1);

for (let i = 0; i < trunkPoints.length - 1; i++) {
  const a = trunkPoints[i];
  const b = trunkPoints[i + 1];
  const trunkRadius = 0.33 - i * 0.026;
  for (let j = 0; j < 8; j++) makeBarkRidge(a, b, trunkRadius, i * 23 + j);
}

const branchTips = [];

function makeBranch(points, baseRadius, seed, addNeedles = true) {
  tubeAlong(points, baseRadius, barkMaterial, Math.max(20, points.length * 16), 7);
  for (let i = 0; i < points.length - 1; i++) {
    const r = Math.max(0.025, baseRadius * (1 - i / (points.length + 0.5)));
    for (let j = 0; j < 3; j++) makeBarkRidge(points[i], points[i + 1], r, seed * 13 + i * 5 + j);
  }
  if (addNeedles) branchTips.push({ point: points[points.length - 1].clone(), seed, radius: baseRadius });
}

const branchSpecs = [
  { y: 2.15, angle: 0.20, length: 3.7, rise: 0.42, r: 0.20 },
  { y: 2.45, angle: 2.72, length: 3.15, rise: 0.62, r: 0.18 },
  { y: 2.86, angle: 4.18, length: 3.85, rise: 0.35, r: 0.18 },
  { y: 3.46, angle: 1.30, length: 3.45, rise: 0.38, r: 0.16 },
  { y: 3.82, angle: 3.50, length: 2.9, rise: 0.55, r: 0.145 },
  { y: 4.30, angle: 5.32, length: 3.1, rise: 0.36, r: 0.135 },
  { y: 4.84, angle: 2.15, length: 2.55, rise: 0.46, r: 0.12 },
  { y: 5.25, angle: 4.42, length: 2.15, rise: 0.55, r: 0.105 },
  { y: 5.78, angle: 0.65, length: 1.85, rise: 0.68, r: 0.09 }
];

branchSpecs.forEach((spec, index) => {
  const direction = new THREE.Vector3(Math.cos(spec.angle), 0, Math.sin(spec.angle));
  const side = new THREE.Vector3(-direction.z, 0, direction.x);
  const start = new THREE.Vector3(
    trunkPoints[Math.min(trunkPoints.length - 2, Math.floor(spec.y - 0.9))].x,
    spec.y,
    trunkPoints[Math.min(trunkPoints.length - 2, Math.floor(spec.y - 0.9))].z
  );
  const elbow = start.clone()
    .addScaledVector(direction, spec.length * 0.38)
    .addScaledVector(side, (random(index + 3) - 0.5) * 0.34)
    .add(new THREE.Vector3(0, spec.rise * 0.22, 0));
  const tip = start.clone()
    .addScaledVector(direction, spec.length)
    .addScaledVector(side, (random(index + 8) - 0.5) * 0.5)
    .add(new THREE.Vector3(0, spec.rise, 0));
  makeBranch([start, elbow, tip], spec.r, index + 10);
  for (let child = 0; child < 2; child++) {
    const childStart = start.clone().lerp(tip, 0.43 + child * 0.22);
    const childDirection = direction.clone()
      .applyAxisAngle(new THREE.Vector3(0, 1, 0), (child === 0 ? -0.64 : 0.58) + (random(index * 4 + child) - 0.5) * 0.25);
    const childTip = childStart.clone()
      .addScaledVector(childDirection, spec.length * (0.31 + child * 0.03))
      .add(new THREE.Vector3(0, 0.28 + random(index + child) * 0.22, 0));
    makeBranch([childStart, childStart.clone().lerp(childTip, 0.55).add(new THREE.Vector3(0, 0.08, 0)), childTip], spec.r * 0.43, index * 8 + child + 100);
  }
});

makeBranch([
  trunkPoints[6].clone(),
  new THREE.Vector3(0.1, 7.3, -0.02),
  new THREE.Vector3(-0.34, 8.05, 0.14),
  new THREE.Vector3(0.0, 8.62, -0.04)
], 0.1, 222);

for (let i = 0; i < branchSpecs.length; i++) {
  const spec = branchSpecs[i];
  const direction = new THREE.Vector3(Math.cos(spec.angle), 0, Math.sin(spec.angle));
  const anchor = new THREE.Vector3(0, spec.y + 0.08, 0).addScaledVector(direction, 0.38);
  const wireEnd = anchor.clone().addScaledVector(direction, spec.length * 0.74).add(new THREE.Vector3(0, spec.rise * 0.44 + 0.03, 0));
  const wireCurve = new THREE.CatmullRomCurve3([
    anchor,
    anchor.clone().lerp(wireEnd, 0.4).add(new THREE.Vector3(0, 0.12, 0)),
    wireEnd
  ]);
  const wire = new THREE.Mesh(new THREE.TubeGeometry(wireCurve, 28, 0.022, 6, false), wireMaterial);
  wire.castShadow = true;
  world.add(wire);
}

const needleGeometry = new THREE.ConeGeometry(0.028, 0.52, 5, 1);
needleGeometry.translate(0, 0.26, 0);

function foliagePad(center, sx, sy, sz, seed) {
  const group = new THREE.Group();
  const count = Math.floor(125 + sx * sz * 30);
  for (let i = 0; i < count; i++) {
    const t = i + seed * 131;
    const theta = random(t) * Math.PI * 2;
    const radial = Math.sqrt(random(t + 1));
    const x = Math.cos(theta) * sx * radial;
    const z = Math.sin(theta) * sz * radial;
    const edge = 1 - radial;
    const y = (random(t + 2) - 0.5) * sy * (0.5 + edge * 0.8);
    const needle = new THREE.Mesh(needleGeometry, needleMaterials[Math.floor(random(t + 3) * needleMaterials.length)]);
    needle.position.set(x, y, z);
    needle.rotation.set(
      (random(t + 4) - 0.5) * 1.45,
      random(t + 5) * Math.PI * 2,
      (random(t + 6) - 0.5) * 1.45
    );
    needle.scale.setScalar(0.72 + random(t + 7) * 0.74);
    group.add(needle);
  }
  group.position.copy(center);
  world.add(group);
}

branchTips.forEach((tip, i) => {
  const heightFactor = Math.max(0, Math.min(1, (tip.point.y - 2) / 6.7));
  const width = 1.35 - heightFactor * 0.55;
  foliagePad(
    tip.point.clone().add(new THREE.Vector3(0, 0.16, 0)),
    width * (0.85 + random(i) * 0.26),
    0.48 + random(i + 30) * 0.18,
    width * (0.52 + random(i + 40) * 0.18),
    i + 11
  );
});

foliagePad(new THREE.Vector3(-0.03, 8.5, -0.03), 1.0, 0.7, 0.85, 700);

for (let i = 0; i < 90; i++) {
  const angle = random(i + 200) * Math.PI * 2;
  const radius = Math.sqrt(random(i + 222)) * 3.55;
  const pebble = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.035 + random(i + 240) * 0.08, 0),
    new THREE.MeshStandardMaterial({
      color: random(i + 260) > 0.5 ? 0x4b4030 : 0x2d2920,
      roughness: 1
    })
  );
  pebble.position.set(Math.cos(angle) * radius, 0.97, Math.sin(angle) * radius * 0.58);
  pebble.rotation.set(random(i) * 2, random(i + 1) * 2, random(i + 2) * 2);
  pebble.scale.y = 0.52;
  pebble.castShadow = true;
  world.add(pebble);
}

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(70, 70),
  new THREE.MeshStandardMaterial({ color: 0x263127, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.55;
ground.receiveShadow = true;
scene.add(ground);

const hemi = new THREE.HemisphereLight(0xcde6db, 0x26301f, 1.7);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff1d2, 4.1);
keyLight.position.set(8, 13, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -10;
keyLight.shadow.camera.right = 10;
keyLight.shadow.camera.top = 12;
keyLight.shadow.camera.bottom = -5;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 35;
keyLight.shadow.bias = -0.00015;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x8db5a3, 1.25);
rimLight.position.set(-10, 7, -8);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0x9ac7ab, 20, 18, 2);
fillLight.position.set(-4, 5, 4);
scene.add(fillLight);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
