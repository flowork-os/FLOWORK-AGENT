<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rooftop Garden Terrace</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2b2a4a}
  canvas{display:block}
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================ 1. CONFIG & PALETTE ============================ */
const SEED = 0xD05C;
const PAL = {
  skyTop:'#1e2142', skyMid:'#4c3a68', skyLow:'#a05a72', horizon:'#e8926b',
  fog:0x3a3355, deck:'#8a7460', corten:0x8a4b32, concrete:0x9a968c,
  woodWarm:0x7a5c40, steel:0x5a6068, charcoal:0x2e2c2a,
  bulb:0xffd9a0, fire:0xff7a30, growGlow:0xd8a8ff,
  cushions:[0xc96f4a,0xe8dcc4,0x8a9b7c,0x5f7d8c],
  greens:[0x567a42,0x68904c,0x7aa458,0x46652f],
  vines:[0x5f8348,0x729a54,0x86ad62,0x4e7040],
  blooms:[0xd9534f,0xe8a13c,0xd977a8,0xf0ead6,0x9b59b6],
  towerWin:['#ffd9a0','#ffe8c8','#a8c8e8']
};
const ROOF_W = 22, ROOF_D = 15.4, PARA_H = 1.05;

/* ============================ 2. PRNG & HELPERS ============================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng = mulberry32(SEED);
const rr = (a,b)=>a+rng()*(b-a);
const pick = a=>a[Math.floor(rng()*a.length)];
const dummy = new THREE.Object3D();

function mesh(geo,mat,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);
  m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;return m;}
const box=(w,h,d,mat,x,y,z)=>mesh(new THREE.BoxGeometry(w,h,d),mat,x,y,z);
const cyl=(rt,rb,h,seg,mat,x,y,z)=>mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat,x,y,z);
function scatterInstanced(geo,mat,count,place,colors){
  const im=new THREE.InstancedMesh(geo,mat,count);
  const col=new THREE.Color();
  for(let i=0;i<count;i++){
    dummy.position.set(0,0,0);dummy.rotation.set(0,0,0);dummy.scale.set(1,1,1);
    place(dummy,i);dummy.updateMatrix();im.setMatrixAt(i,dummy.matrix);
    if(colors)im.setColorAt(i,col.setHex(pick(colors)));
  }
  im.castShadow=true;
  return im;
}

/* ============================ 3. CANVAS TEXTURES ============================ */
function canvasTex(w,h,draw,repX=1,repY=1){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repX,repY);
  t.anisotropy=4;return t;
}
const deckTex = canvasTex(512,512,(g,w,h)=>{
  g.fillStyle=PAL.deck;g.fillRect(0,0,w,h);
  const bw=w/6;
  for(let i=0;i<6;i++){
    g.fillStyle=`hsl(${rr(24,32)},${rr(18,26)}%,${rr(38,48)}%)`;
    g.fillRect(i*bw+1,0,bw-2,h);
    g.strokeStyle='rgba(40,26,16,0.35)';g.lineWidth=2;
    g.strokeRect(i*bw+1,0,bw-2,h);
    for(let s=0;s<26;s++){g.strokeStyle=`rgba(60,40,24,${rr(0.08,0.2)})`;g.lineWidth=1;
      const x0=i*bw+rr(4,bw-6),y0=rr(0,h);
      g.beginPath();g.moveTo(x0,y0);g.lineTo(x0+rr(-3,3),y0+rr(20,70));g.stroke();}
  }
},5,3.4);
const skyTex = canvasTex(1024,512,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,PAL.skyTop);gr.addColorStop(0.45,PAL.skyMid);
  gr.addColorStop(0.7,PAL.skyLow);gr.addColorStop(0.88,PAL.horizon);
  gr.addColorStop(1,'#c97a5e');g.fillStyle=gr;g.fillRect(0,0,w,h);
  for(let i=0;i<130;i++){g.fillStyle=`rgba(255,244,226,${rr(0.12,0.65)})`;
    g.fillRect(rr(0,w),rr(0,h*0.42),1.4,1.4);}
  const mx=w*0.72,my=h*0.2;                                       // dusk moon + halo
  const halo=g.createRadialGradient(mx,my,4,mx,my,70);
  halo.addColorStop(0,'rgba(247,234,210,0.7)');halo.addColorStop(1,'rgba(247,234,210,0)');
  g.fillStyle=halo;g.beginPath();g.arc(mx,my,70,0,7);g.fill();
  g.fillStyle='#f7ead2';g.beginPath();g.arc(mx,my,15,0,7);g.fill();
  g.fillStyle='rgba(200,180,160,0.35)';g.beginPath();g.arc(mx-5,my+3,4,0,7);g.fill();
});
function towerTex(litProb,winCol){
  return canvasTex(128,256,(g,w,h)=>{
    g.fillStyle='#141a2e';g.fillRect(0,0,w,h);
    for(let r=1;r<15;r++)for(let c=0;c<6;c++){
      if(rng()<litProb){g.fillStyle=rng()<0.85?winCol:'#7ea8c8';
        g.globalAlpha=rr(0.5,1);
        g.fillRect(c*20+6,r*16+4,10,8);g.globalAlpha=1;}
    }
  });
}
const facadeTex = canvasTex(256,128,(g,w,h)=>{                    // host-building face
  g.fillStyle='#232733';g.fillRect(0,0,w,h);
  for(let r=0;r<3;r++)for(let c=0;c<10;c++){
    g.fillStyle=rng()<0.22?'#ffd9a0':'#1a1e2a';
    g.fillRect(c*25+8,r*40+12,11,16);}
},2,1);
const rugTex = canvasTex(256,256,(g,w,h)=>{
  const cols=['#b5654a','#d9b98c','#8a9b7c','#e8dcc4'];
  for(let r=12;r>0;r--){g.fillStyle=cols[r%4];
    g.beginPath();g.arc(w/2,h/2,r*10.5,0,7);g.fill();}
});

/* ============================ 4. MATERIALS ============================ */
const M = {
  deck:new THREE.MeshStandardMaterial({map:deckTex,roughness:0.9}),
  concrete:new THREE.MeshStandardMaterial({color:PAL.concrete,roughness:0.95}),
  paraCap:new THREE.MeshStandardMaterial({color:0xb0aca0,roughness:0.85}),
  corten:new THREE.MeshStandardMaterial({color:PAL.corten,roughness:0.8,metalness:0.25}),
  soil:new THREE.MeshStandardMaterial({color:0x33261a,roughness:1}),
  wood:new THREE.MeshStandardMaterial({color:PAL.woodWarm,roughness:0.85}),
  woodLight:new THREE.MeshStandardMaterial({color:0x9a7a56,roughness:0.8}),
  steel:new THREE.MeshStandardMaterial({color:PAL.steel,roughness:0.4,metalness:0.8}),
  charcoal:new THREE.MeshStandardMaterial({color:PAL.charcoal,roughness:0.9}),
  leaf:new THREE.MeshStandardMaterial({color:0x4a6b3a,roughness:0.95}),
  glass:new THREE.MeshStandardMaterial({color:0xbfd8e2,transparent:true,opacity:0.2,
    roughness:0.12,metalness:0.1,side:THREE.DoubleSide,depthWrite:false}),
  bulb:new THREE.MeshBasicMaterial({color:PAL.bulb}),
  wire:new THREE.LineBasicMaterial({color:0x22201e}),
  flameA:new THREE.MeshBasicMaterial({color:0xff8a2a,transparent:true,opacity:0.85}),
  flameB:new THREE.MeshBasicMaterial({color:0xffd050,transparent:true,opacity:0.9}),
  ember:new THREE.MeshBasicMaterial({color:0xff9a40,transparent:true,opacity:0.8}),
  grow:new THREE.MeshStandardMaterial({color:0x6a4a8a,emissive:PAL.growGlow,emissiveIntensity:1.6}),
  terracotta:new THREE.MeshStandardMaterial({color:0x9a5a40,roughness:0.85}),
  lantern:new THREE.MeshStandardMaterial({color:0x3a3632,emissive:0xffc070,emissiveIntensity:1.8})
};
const FX = {sways:[],flames:[],canopies:[],towerMats:[],fan:null,beacon:null,
  fireLight:null,embers:null,catTail:null};

/* ============================ 5. BUILDER FUNCTIONS ============================ */
function buildRoofBase(){
  const g=new THREE.Group();
  const deck=mesh(new THREE.BoxGeometry(ROOF_W,0.1,ROOF_D),M.deck,0,-0.05,0);
  deck.material=[M.concrete,M.concrete,M.deck,M.concrete,M.concrete,M.concrete];
  g.add(deck);
  for(const [w,d,x,z] of [[ROOF_W+0.7,0.35,0,-ROOF_D/2-0.17],[ROOF_W+0.7,0.35,0,ROOF_D/2+0.17],
                          [0.35,ROOF_D,-ROOF_W/2-0.17,0],[0.35,ROOF_D,ROOF_W/2+0.17,0]]){
    const wall=box(w,PARA_H,d,M.concrete,x,PARA_H/2,z);g.add(wall);
    g.add(box(w+0.1,0.08,d+0.12,M.paraCap,x,PARA_H+0.04,z));
  }
  for(const s of [-1,1]){                                         // gravel margins
    g.add(box(ROOF_W-0.7,0.05,0.55,M.charcoal,0,0.03,s*(ROOF_D/2-0.45)));
    g.add(box(0.55,0.05,ROOF_D-1.9,M.charcoal,s*(ROOF_W/2-0.45),0.03,0));
  }
  const body=new THREE.MeshStandardMaterial({map:facadeTex,emissive:0xffffff,
    emissiveMap:facadeTex,emissiveIntensity:0.9,roughness:0.9});
  const host=new THREE.Mesh(new THREE.BoxGeometry(ROOF_W+0.9,8,ROOF_D+0.9),
    [body,body,M.concrete,M.concrete,body,body]);                 // building below
  host.position.y=-4.1;host.receiveShadow=true;g.add(host);
  return g;
}
function buildSkyline(){
  const g=new THREE.Group();
  for(const p of [[0.35,'#ffd9a0'],[0.2,'#ffe8c8'],[0.5,'#a8c8e8']]){
    const tx=towerTex(p[0],p[1]);
    FX.towerMats.push(new THREE.MeshStandardMaterial({color:0x10141f,map:tx,
      emissive:0xffffff,emissiveMap:tx,emissiveIntensity:1.25,roughness:0.9}));
  }
  const topMat=new THREE.MeshStandardMaterial({color:0x0d1018,roughness:1});
  let tallest=null,tallH=0;
  for(let i=0;i<16;i++){
    const a=i/16*Math.PI*2+rr(-0.12,0.12),r=rr(30,44);
    const w=rr(4,7),d=rr(4,7),h=rr(8,23),tm=pick(FX.towerMats);
    const t=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[tm,tm,topMat,topMat,tm,tm]);
    t.position.set(Math.cos(a)*r,-9+h/2,Math.sin(a)*r);
    t.rotation.y=rr(-0.3,0.3);t.castShadow=t.receiveShadow=false;
    g.add(t);
    if(rng()<0.4)g.add(box(w*0.35,rr(1,2.2),d*0.35,topMat,t.position.x,-9+h+rr(0.5,1.1),t.position.z));
    if(h>tallH){tallH=h;tallest=t;}
  }
  const mastY=-9+tallH;
  g.add(cyl(0.05,0.12,3.4,6,M.steel,tallest.position.x,mastY+1.7,tallest.position.z));
  FX.beacon=mesh(new THREE.SphereGeometry(0.22,8,6),
    new THREE.MeshBasicMaterial({color:0xff3524}),tallest.position.x,mastY+3.5,tallest.position.z);
  g.add(FX.beacon);
  return g;
}
function buildPergola(){
  const g=new THREE.Group(),W=5.4,D=4,H=2.55;
  for(const sx of [-1,1])for(const sz of [-1,1])
    g.add(box(0.14,H,0.14,M.wood,sx*W/2,H/2,sz*D/2));
  for(const sz of [-1,1])g.add(box(W+0.7,0.16,0.12,M.wood,0,H+0.08,sz*D/2));
  for(let i=0;i<8;i++)g.add(box(0.09,0.07,D+0.7,M.woodLight,-W/2+0.2+i*(W-0.4)/7,H+0.2,0));
  g.add(scatterInstanced(new THREE.SphereGeometry(0.16,7,6),M.leaf,52,(o,i)=>{ // vines
    if(i<28){const e=i%2?1:-1;o.position.set(rr(-W/2-0.3,W/2+0.3),H+rr(0.1,0.42),e*(D/2+rr(-0.16,0.16)));}
    else if(i<40){const sx=i%2?1:-1,sz=i<34?1:-1;
      o.position.set(sx*W/2+rr(-0.12,0.12),rr(0.3,H),sz*D/2+rr(-0.12,0.12));}
    else o.position.set(rr(-W/2,W/2),H+0.25+rr(-0.5,0),rr(-D/2,D/2));
    o.scale.set(rr(0.7,1.5),rr(0.6,1.1),rr(0.7,1.5));
  },PAL.vines));
  const zig=[];                                                   // bulbs under the slats
  for(let i=0;i<3;i++)zig.push(new THREE.Vector3(-W/2+0.4+i*(W-0.8)/2,H-0.02,(i%2?-1:1)*(D/2-0.5)));
  for(let i=0;i<2;i++)g.add(stringSpan(zig[i],zig[i+1],0.28));
  const bench=box(1.7,0.12,0.5,M.woodLight,0,0.42,-D/2+0.35);     // built-in bench
  bench.add(box(1.7,0.42,0.1,M.wood,0,-0.21,-0.2));
  for(const s of [-1,1])bench.add(box(0.12,0.42,0.44,M.wood,s*0.75,-0.24,0));
  g.add(bench);
  const pl=new THREE.PointLight(PAL.bulb,9,7,2);pl.position.set(0,H-0.4,0);g.add(pl);
  return g;
}
function buildPlanterBed(len,kind){
  const g=new THREE.Group(),wd=1.15,h=0.55;
  const shell=box(len,h,wd,M.corten,0,h/2,0);g.add(shell);
  g.add(box(len+0.1,0.06,wd+0.1,M.corten,0,h+0.02,0));
  g.add(box(len-0.14,0.05,wd-0.14,M.soil,0,h-0.03,0));
  const area=(o)=>{o.position.set(rr(-len/2+0.25,len/2-0.25),h+0.06,rr(-wd/2+0.22,wd/2-0.22));};
  if(kind==='lettuce'){
    g.add(scatterInstanced(new THREE.SphereGeometry(0.15,8,6),M.leaf,10,(o,i)=>{
      o.position.set(-len/2+0.35+(i%5)*(len-0.7)/4,h+0.08,(i<5?-1:1)*0.26);
      o.scale.set(1,0.68,1);},[0x8fae5c,0x7d9b4e,0x9cbb6a]));
  }else if(kind==='tomato'){
    for(let i=0;i<3;i++)g.add(cyl(0.02,0.02,0.95,5,M.wood,-len/2+0.5+i*(len-1)/2,h+0.45,0));
    g.add(scatterInstanced(new THREE.SphereGeometry(0.14,7,6),M.leaf,9,(o,i)=>{
      o.position.set(-len/2+0.5+(i%3)*(len-1)/2+rr(-0.1,0.1),h+0.25+Math.floor(i/3)*0.3,rr(-0.12,0.12));
      o.scale.setScalar(rr(0.8,1.2));},PAL.greens));
    g.add(scatterInstanced(new THREE.SphereGeometry(0.05,7,6),
      new THREE.MeshStandardMaterial({color:0xd9432f,roughness:0.5}),9,(o,i)=>{
      o.position.set(-len/2+0.5+(i%3)*(len-1)/2+rr(-0.14,0.14),h+rr(0.22,0.6),rr(-0.14,0.14));}));
  }else if(kind==='carrot'){
    g.add(scatterInstanced(new THREE.ConeGeometry(0.07,0.24,5),M.leaf,14,(o,i)=>{
      area(o);o.position.y=h+0.12;o.rotation.z=rr(-0.2,0.2);},[0x3d5c33,0x4a6b3a]));
  }else{
    g.add(scatterInstanced(new THREE.SphereGeometry(0.12,7,6),M.leaf,8,(o)=>{
      area(o);o.scale.set(1,0.8,1);},PAL.greens));
    g.add(scatterInstanced(new THREE.SphereGeometry(0.05,7,6),
      new THREE.MeshLambertMaterial({color:0xffffff}),16,(o)=>{
      area(o);o.position.y=h+rr(0.14,0.26);},PAL.blooms));
  }
  return g;
}
function buildLoungeChair(cushHex){
  const g=new THREE.Group();
  const cush=new THREE.MeshStandardMaterial({color:cushHex,roughness:0.95});
  for(const s of [-1,1]){
    g.add(box(0.08,0.1,1.2,M.wood,s*0.36,0.22,0));
    for(const lz of [-0.5,0.5])g.add(box(0.07,0.22,0.07,M.wood,s*0.36,0.11,lz));
  }
  g.add(box(0.72,0.06,1.2,M.woodLight,0,0.29,0));
  g.add(box(0.66,0.14,0.78,cush,0,0.39,0.17));
  const back=box(0.66,0.6,0.14,cush,0,0.62,-0.35);back.rotation.x=-0.42;g.add(back);
  g.add(box(0.3,0.12,0.18,new THREE.MeshStandardMaterial({color:0xe8dcc4,roughness:0.95}),0,0.82,-0.44));
  return g;
}
function buildFireTable(){
  const g=new THREE.Group();
  g.add(box(1.2,0.42,1.2,M.concrete,0,0.21,0));
  g.add(box(1.28,0.05,1.28,M.paraCap,0,0.44,0));
  g.add(box(0.8,0.04,0.8,M.charcoal,0,0.47,0));
  g.add(scatterInstanced(new THREE.SphereGeometry(0.05,6,5),
    new THREE.MeshStandardMaterial({color:0x4a4642,roughness:0.9}),14,(o)=>{
    o.position.set(rr(-0.32,0.32),0.5,rr(-0.32,0.32));o.scale.setScalar(rr(0.7,1.4));}));
  const f1=mesh(new THREE.ConeGeometry(0.2,0.55,8),M.flameA,0,0.75,0);
  const f2=mesh(new THREE.ConeGeometry(0.12,0.42,8),M.flameB,0.06,0.72,0.04);
  const f3=mesh(new THREE.ConeGeometry(0.09,0.34,8),M.flameB,-0.07,0.7,-0.05);
  for(const f of [f1,f2,f3]){f.castShadow=false;g.add(f);FX.flames.push(f);}
  FX.fireLight=new THREE.PointLight(PAL.fire,26,9,2);
  FX.fireLight.position.set(0,0.9,0);g.add(FX.fireLight);
  FX.embers=scatterInstanced(new THREE.SphereGeometry(0.02,5,4),M.ember,10,(o)=>{
    o.position.set(0,-2,0);});
  FX.embers.castShadow=false;FX.embers.frustumCulled=false;g.add(FX.embers);
  return g;
}
function buildGreenhouse(){
  const g=new THREE.Group(),W=1.25,H=1.75,D=0.62;
  for(const sx of [-1,1])for(const sz of [-1,1])
    g.add(box(0.045,H,0.045,M.steel,sx*W/2,H/2,sz*D/2));
  for(const y of [0.05,H-0.28,H]){
    g.add(box(W,0.045,0.045,M.steel,0,y,-D/2),box(W,0.045,0.045,M.steel,0,y,D/2));
    g.add(box(0.045,0.045,D,M.steel,-W/2,y,0),box(0.045,0.045,D,M.steel,W/2,y,0));
  }
  for(const sz of [-1,1])g.add(mesh(new THREE.PlaneGeometry(W-0.06,H-0.1),M.glass,0,H/2,sz*D/2));
  for(const sx of [-1,1]){
    const p=mesh(new THREE.PlaneGeometry(D-0.06,H-0.1),M.glass,sx*W/2,H/2,0);
    p.rotation.y=Math.PI/2;g.add(p);
  }
  const lid=mesh(new THREE.PlaneGeometry(W+0.14,D+0.2),M.glass,0,H+0.06,0);
  lid.rotation.x=-Math.PI/2+0.12;g.add(lid);
  for(const y of [0.5,1.05]){
    g.add(box(W-0.1,0.035,D-0.1,M.woodLight,0,y,0));
    g.add(scatterInstanced(new THREE.CylinderGeometry(0.05,0.04,0.09,7),M.terracotta,4,(o,i)=>{
      o.position.set(-W/2+0.2+i*(W-0.4)/3,y+0.06,rr(-0.1,0.1));}));
    g.add(scatterInstanced(new THREE.ConeGeometry(0.045,0.16,5),M.leaf,4,(o,i)=>{
      o.position.set(-W/2+0.2+i*(W-0.4)/3,y+0.17,rr(-0.08,0.08));},PAL.greens));
  }
  g.add(box(W-0.15,0.035,0.06,M.grow,0,H-0.12,0));               // grow-light strip
  return g;
}
function buildWaterTank(){
  const g=new THREE.Group();
  for(const sx of [-1,1])for(const sz of [-1,1]){
    const leg=cyl(0.045,0.05,1.45,7,M.steel,sx*0.68,0.72,sz*0.68);
    leg.rotation.set(sx*0.06,0,-sz*0.06);g.add(leg);
  }
  g.add(box(1.9,0.1,1.9,M.steel,0,1.5,0));
  const tank=cyl(0.78,0.72,1.5,14,M.wood,0,2.3,0);g.add(tank);
  for(const y of [1.75,2.3,2.85])
    g.add(mesh(new THREE.TorusGeometry(0.78,0.025,6,20).rotateX(Math.PI/2),M.steel,0,y,0));
  g.add(cyl(0.06,0.8,0.5,12,M.charcoal,0,3.3,0));
  g.add(cyl(0.035,0.035,1.5,6,M.steel,0.55,0.75,0.55));

function buildPottedTree(){
  const g=new THREE.Group();

}
function buildHVAC(){
  const g=new THREE.Group();

function buildHerbShelf(){
  const g=new THREE.Group(),W=1.5;
  for(const s of [-1,1]){
    g.add(box(0.06,1.35,0.06,M.wood,s*W/2,0.67,0.12));

  }

    g.add(box(W,0.04,0.3,M.woodLight,0,y,0.1-ti*0.05));
    g.add(scatterInstanced(new THREE.CylinderGeometry(0.06,0.05,0.11,8),M.terracotta,3,(o,i)=>{
      o.position.set(-W/2+0.3+i*(W-0.6)/2,y+0.075,0.1-ti*0.05);}));
    g.add(scatterInstanced(new THREE.ConeGeometry(0.05,0.17,5),M.leaf,3,(o,i)=>{
      o.position.set(-W/2+0.3+i*(W-0.6)/2,y+0.2,0.1-ti*0.05);o.rotation.z=rr(-0.15,0.15);},PAL.vines));

}
function buildVent(){

function buildSolarPanel(){

  g.add(box(0.06,0.42,0.06,M.steel,-0.6,0.21,0.33),box(0.06,0.42,0.06,M.steel,0.6,0.21,0.33));

function buildBirdhouse(){
  const g=new THREE.Group();

  g.add(box(0.3,0.28,0.26,M.woodLight,0,1.68,0));
  g.add(mesh(new THREE.ConeGeometry(0.26,0.18,4),M.corten,0,1.9,0).rotateY(Math.PI/4));

function buildPotStack(){
  const g=new THREE.Group();
  g.add(cyl(0.16,0.12,0.2,9,M.terracotta,0,0.1,0));
  g.add(cyl(0.15,0.11,0.2,9,M.terracotta,0,0.24,0.02));
  g.add(cyl(0.14,0.1,0.2,9,M.terracotta,0,0.38,-0.01));

function buildTrailingPlanter(len){
  const g=new THREE.Group();
  g.add(box(len,0.24,0.28,M.corten,0,0,0));
  g.add(scatterInstanced(new THREE.SphereGeometry(0.1,7,6),M.leaf,8,(o)=>{
    o.position.set(rr(-len/2+0.1,len/2-0.1),0.15,rr(-0.06,0.06));
    o.scale.setScalar(rr(0.8,1.3));},PAL.vines));
  g.add(scatterInstanced(new THREE.SphereGeometry(0.06,6,5),M.leaf,9,(o,i)=>{
    o.position.set(rr(-len/2+0.1,len/2-0.1),-rr(0.15,0.6),0.16);},PAL.vines));

function buildCat(){
  const g=new THREE.Group();
  const fur=new THREE.MeshStandardMaterial({color:0x26221f,roughness:0.95});
  g.add(mesh(new THREE.ConeGeometry(0.17,0.42,10),fur,0,0.21,0));
  g.add(mesh(new THREE.SphereGeometry(0.11,9,8),fur,0,0.4,0.03));
  g.add(mesh(new THREE.SphereGeometry(0.095,9,8),fur,0,0.52,0.05));
  for(const s of [-1,1])
    g.add(mesh(new THREE.ConeGeometry(0.035,0.08,4),fur,s*0.05,0.61,0.04));
  const eyeM=new THREE.MeshBasicMaterial({color:0xffb84a});
  for(const s of [-1,1])
    g.add(mesh(new THREE.SphereGeometry(0.013,6,5),eyeM,s*0.038,0.53,0.13));
  const tail=new THREE.Group();tail.position.set(0.1,0.05,-0.1);
  tail.add(mesh(new THREE.TorusGeometry(0.13,0.02,5,12,2.6),fur,0.1,0,0).rotateX(Math.PI/2));
  g.add(tail);FX.catTail=tail;
  return g;
}
function stringSpan(a,b,sag){
  const outer=new THREE.Group();outer.position.copy(a);
  const d=new THREE.Vector3().subVectors(b,a);
  const lxz=Math.hypot(d.x,d.z);
  outer.rotation.y=Math.atan2(-d.z,d.x);
  const inner=new THREE.Group();
  const curve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(0,0,0),
    new THREE.Vector3(lxz/2,d.y/2-sag*2,0),new THREE.Vector3(lxz,d.y,0));
  inner.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(20)),M.wire));
  const n=Math.max(4,Math.round(lxz*1.15));
  const bulbs=scatterInstanced(new THREE.SphereGeometry(0.045,7,6),M.bulb,n,(o,i)=>{
    const p=curve.getPoint((i+1)/(n+1));o.position.set(p.x,p.y-0.05,p.z);});
  bulbs.castShadow=false;inner.add(bulbs);
  outer.add(inner);
  FX.sways.push(inner);
  return outer;
}

/* ============================ 6. RENDERER / CAMERA / CONTROLS ============================ */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(PAL.fog,26,78);
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,240);
camera.position.set(10.5,8.5,12.5);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.autoRotate=true;
controls.autoRotateSpeed=0.9;
controls.target.set(0,1.1,0);
controls.minDistance=9;
controls.maxDistance=26;
controls.maxPolarAngle=1.42;

/* ============================ 7. ASSEMBLY & LAYOUT ============================ */
scene.add(new THREE.Mesh(new THREE.SphereGeometry(100,28,18),
  new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,fog:false})));
const ground=mesh(new THREE.PlaneGeometry(240,240).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({color:0x14121f,roughness:1}),0,-9,0);
ground.castShadow=false;scene.add(ground);

scene.add(buildRoofBase());
scene.add(buildSkyline());

const pergola=buildPergola();
pergola.position.set(-5.2,0,-3.2);scene.add(pergola);

const beds=[['lettuce',-6.5,6.5,0],['tomato',-3,6.5,0],['flower',0.5,6.5,0],
            ['carrot',1.4,-6.5,0],['flower',-1.5,-6.5,0]];
for(const [kind,bx,bz] of beds){
  const b=buildPlanterBed(3,kind);b.position.set(bx,0,bz);scene.add(b);
}

const fire=buildFireTable();
fire.position.set(3.2,0,1.2);scene.add(fire);
const rug=mesh(new THREE.CircleGeometry(2.5,26).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({map:rugTex,roughness:0.95}),3.2,0.015,1.2);
rug.castShadow=false;scene.add(rug);
const chairAngles=[2.4,3.6,0.6];
chairAngles.forEach((a,i)=>{
  const ch=buildLoungeChair(PAL.cushions[i%4]);
  ch.position.set(3.2+Math.cos(a)*1.9,0,1.2+Math.sin(a)*1.9);
  ch.rotation.y=-a-Math.PI/2;
  scene.add(ch);
});
const st=buildSideTable();st.position.set(4.9,0,3.1);scene.add(st);

const green=buildGreenhouse();
green.position.set(5.6,0,-6.55);scene.add(green);

const tank=buildWaterTank();
tank.position.set(9.3,0,-5.7);scene.add(tank);

for(const [tx,tz] of [[-9.8,-6.4],[9.9,1.8],[-9.7,6.3]]){
  const tr=buildPottedTree();tr.position.set(tx,0,tz);tr.rotation.y=rr(0,6.28);scene.add(tr);
}
const bulk=buildBulkhead();
bulk.position.set(-9.6,0,3.6);bulk.rotation.y=Math.PI/2;scene.add(bulk);
const hvac=buildHVAC();
hvac.position.set(-4.9,0,6.6);hvac.rotation.y=Math.PI;scene.add(hvac);
const can=buildWateringCan();
can.position.set(2,0,5.7);can.rotation.y=rr(0,6.28);scene.add(can);

const P=(x,y,z)=>new THREE.Vector3(x,y,z);                        // string-light web
scene.add(stringSpan(P(-8.6,2.4,3.2),P(-2.5,2.5,-1.2),0.5));
scene.add(stringSpan(P(-2.5,2.55,-5.2),P(8.45,3.6,-6.35),0.55));
scene.add(stringSpan(P(8.45,3.6,-6.35),P(8.9,2.6,5.9),0.6));
scene.add(stringSpan(P(8.9,2.6,5.9),P(-8.6,2.4,3.2),0.75));
const pole=cyl(0.04,0.06,2.6,7,M.steel,8.9,1.3,5.9);scene.add(pole);
const overhead=new THREE.PointLight(PAL.bulb,11,9,2);
overhead.position.set(2.5,2.6,2.5);scene.add(overhead);

const herbs=buildHerbShelf();                                     // supporting props
herbs.position.set(-10.55,0,-1.2);herbs.rotation.y=Math.PI/2;scene.add(herbs);
for(const [lx,lz,lh] of [[-2.1,-0.5,0.55],[-1.7,0.15,0.38],[1.4,3.4,0.45]]){
  const fl=buildFloorLantern(lh);fl.position.set(lx,0,lz);scene.add(fl);
}
for(const [vx,vz,vr] of [[0.9,-4.4,0.7],[-3.4,4.6,2.4]]){
  const v=buildVent();v.position.set(vx,0,vz);v.rotation.y=vr;scene.add(v);
}
const solar=buildSolarPanel();
solar.position.set(8.5,0,3.0);solar.rotation.y=-0.4;scene.add(solar);
const bird=buildBirdhouse();
bird.position.set(-7.2,0,6.5);bird.rotation.y=0.6;scene.add(bird);
const pots=buildPotStack();
pots.position.set(4.3,0,6.4);pots.rotation.y=rr(0,6.28);scene.add(pots);
for(const [px,pz,pr] of [[-4.6,7.5,0],[5.4,7.5,0],[10.78,-3.2,-Math.PI/2]]){
  const tp=buildTrailingPlanter(1.6);tp.position.set(px,1.02,pz);tp.rotation.y=pr;scene.add(tp);
}
const cat=buildCat();
cat.position.set(5.6,1.13,7.85);cat.rotation.y=Math.PI;scene.add(cat);

/* ============================ 8. LIGHTING RIG ============================ */
scene.add(new THREE.HemisphereLight(0x6b6a9e,0x3a3230,0.55));
const key=new THREE.DirectionalLight(0x8fa3d8,0.85);
key.position.set(16,18,10);
key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-14;key.shadow.camera.right=14;
key.shadow.camera.top=14;key.shadow.camera.bottom=-14;
key.shadow.camera.near=4;key.shadow.camera.far=60;
key.shadow.bias=-0.0005;
scene.add(key);
const sunset=new THREE.DirectionalLight(0xff9a5a,0.5);
sunset.position.set(-24,6,-14);scene.add(sunset);

/* ============================ 9. ANIMATION LOOP ============================ */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  FX.sways.forEach((s,i)=>{s.rotation.x=Math.sin(t*0.85+i*1.9)*0.055+Math.sin(t*1.7+i)*0.02;});
  FX.flames.forEach((f,i)=>{                                      // fire flicker
    f.scale.set(1+Math.sin(t*11+i*2.6)*0.16,1+Math.sin(t*9.3+i*1.7)*0.24,1+Math.cos(t*10+i)*0.16);
    f.rotation.y=t*(1.2+i*0.4);
  });
  FX.fireLight.intensity=26*(0.86+0.14*Math.sin(t*10.7)+0.06*Math.sin(t*23));
  for(let i=0;i<10;i++){                                          // rising embers
    const k=((t*0.5+i*0.23)%1+1)%1;
    dummy.position.set(Math.sin(i*2.4+t*0.8)*0.14*(1-k*0.4),0.55+k*1.35,Math.cos(i*1.9)*0.14);
    dummy.scale.setScalar(1-k*0.75);dummy.rotation.set(0,0,0);dummy.updateMatrix();
    FX.embers.setMatrixAt(i,dummy.matrix);
  }
  FX.embers.instanceMatrix.needsUpdate=true;
  M.ember.opacity=0.55+0.25*Math.sin(t*7);
  FX.canopies.forEach((c,i)=>{c.rotation.z=Math.sin(t*0.7+i*2.1)*0.045;
    c.rotation.x=Math.cos(t*0.55+i)*0.03;});
  if(FX.fan)FX.fan.rotation.z=t*2.4;
  FX.towerMats.forEach((m,i)=>{m.emissiveIntensity=1.25+0.12*Math.sin(t*0.5+i*2.2);});
  FX.beacon.scale.setScalar(0.7+0.6*Math.max(0,Math.sin(t*2.6)));
  M.grow.emissiveIntensity=1.6+0.25*Math.sin(t*1.3);
  controls.update();
  renderer.render(scene,camera);
}
animate();

/* ============================ 10. RESIZE ============================ */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
