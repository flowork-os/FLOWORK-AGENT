<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Pedestrian Footbridge</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #101923; }
canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bb7c4);
scene.fog = new THREE.Fog(0x9bb7c4, 38, 105);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 180);
camera.position.set(17, 11, 18);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.target.set(0, 2.2, 0);
controls.minDistance = 8;
controls.maxDistance = 55;
controls.maxPolarAngle = Math.PI * 0.48;

const concrete = new THREE.MeshStandardMaterial({ color: 0x778087, roughness: 0.88, metalness: 0.02 });
const concreteDark = new THREE.MeshStandardMaterial({ color: 0x596168, roughness: 0.94 });
const steel = new THREE.MeshStandardMaterial({ color: 0x26343b, roughness: 0.34, metalness: 0.78 });
const steelEdge = new THREE.MeshStandardMaterial({ color: 0x40545b, roughness: 0.28, metalness: 0.86 });
const wood = new THREE.MeshStandardMaterial({ color: 0x9a6540, roughness: 0.78, metalness: 0.02 });
const woodSide = new THREE.MeshStandardMaterial({ color: 0x68412d, roughness: 0.86 });
const waterMaterial = new THREE.MeshStandardMaterial({
  color: 0x2f7180,
  roughness: 0.2,
  metalness: 0.12,
  transparent: true,
  opacity: 0.86
});
const grassMaterial = new THREE.MeshStandardMaterial({ color: 0x50694b, roughness: 1 });
const stoneMaterial = new THREE.MeshStandardMaterial({ color: 0x67726e, roughness: 1 });

function meshBox(name, size, position, material, cast = true, receive = true) {
  const object = new THREE.Mesh(new THREE.BoxGeometry(size.x, size.y, size.z), material);
  object.name = name;
  object.position.copy(position);
  object.castShadow = cast;
  object.receiveShadow = receive;
  scene.add(object);
  return object;
}

function beam(name, a, b, thickness, material, square = false) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const direction = end.clone().sub(start);
  const length = direction.length();
  const midpoint = start.clone().add(end).multiplyScalar(0.5);
  let object;
  if (square) {
    object = new THREE.Mesh(
      new THREE.BoxGeometry(thickness, length, thickness),
      material
    );
  } else {
    object = new THREE.Mesh(
      new THREE.CylinderGeometry(thickness * 0.5, thickness * 0.5, length, 12),
      material
    );
  }
  object.name = name;
  object.position.copy(midpoint);
  object.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  object.castShadow = true;
  object.receiveShadow = true;
  scene.add(object);
  return object;
}

function cylinder(name, radius, height, position, material, radialSegments = 16) {
  const object = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, radialSegments), material);
  object.name = name;
  object.position.copy(position);
  object.castShadow = true;
  object.receiveShadow = true;
  scene.add(object);
  return object;
}

const ground = meshBox("ground", new THREE.Vector3(110, 0.35, 90), new THREE.Vector3(0, -0.28, 0), grassMaterial, false, true);
const water = meshBox("river", new THREE.Vector3(43, 0.12, 15), new THREE.Vector3(0, 0.06, 0), waterMaterial, false, false);

for (let i = 0; i < 34; i++) {
  const x = -20 + Math.random() * 40;
  const z = -10 + Math.random() * 20;
  if (Math.abs(z) < 3.7 && Math.abs(x) < 15) continue;
  const radius = 0.12 + Math.random() * 0.32;
  const stone = new THREE.Mesh(new THREE.DodecahedronGeometry(radius, 0), stoneMaterial);
  stone.position.set(x, radius * 0.72, z);
  stone.rotation.set(Math.random(), Math.random(), Math.random());
  stone.castShadow = true;
  stone.receiveShadow = true;
  scene.add(stone);
}

const bridgeGroup = new THREE.Group();
scene.add(bridgeGroup);

function addToBridge(object) {
  scene.remove(object);
  bridgeGroup.add(object);
  return object;
}

const abutmentPositions = [-13.25, 13.25];
for (const x of abutmentPositions) {
  addToBridge(meshBox("abutment", new THREE.Vector3(2.3, 2.85, 6.6), new THREE.Vector3(x, 1.35, 0), concrete));
  addToBridge(meshBox("abutment_cap", new THREE.Vector3(2.7, 0.34, 6.95), new THREE.Vector3(x, 2.92, 0), concreteDark));
  addToBridge(meshBox("front_pier_face", new THREE.Vector3(0.18, 2.4, 5.5), new THREE.Vector3(x + (x < 0 ? 1.17 : -1.17), 1.35, 0), concreteDark));
  for (const z of [-2.65, 2.65]) {
    addToBridge(meshBox("wing_wall", new THREE.Vector3(2.9, 1.65, 0.34), new THREE.Vector3(x + (x < 0 ? -0.85 : 0.85), 0.82, z), concrete));
  }
}

const deckLength = 25.2;
const deckWidth = 4.35;
addToBridge(meshBox("steel_deck_pan", new THREE.Vector3(deckLength, 0.34, deckWidth), new THREE.Vector3(0, 3.16, 0), steel));
addToBridge(meshBox("deck_underplate", new THREE.Vector3(deckLength + 0.3, 0.18, deckWidth + 0.18), new THREE.Vector3(0, 2.91, 0), steelEdge));

for (let i = 0; i < 28; i++) {
  const x = -12.6 + i * 0.933;
  addToBridge(meshBox("timber_deck_board", new THREE.Vector3(0.82, 0.18, 4.18), new THREE.Vector3(x, 3.43, 0), i % 3 === 0 ? woodSide : wood));
}

for (let i = 0; i < 10; i++) {
  const x = -11.7 + i * 2.6;
  for (const z of [-1.83, 1.83]) {
    addToBridge(beam("cross_girder", [x, 2.7, z], [x, 2.7, -z], 0.18, steelEdge, true));
  }
}

const trussX = [-12.25, -9.8, -7.35, -4.9, -2.45, 0, 2.45, 4.9, 7.35, 9.8, 12.25];
for (const z of [-2.0, 2.0]) {
  addToBridge(beam("lower_chord", [-12.5, 2.56, z], [12.5, 2.56, z], 0.24, steel, true));
  addToBridge(beam("upper_chord", [-12.5, 4.42, z], [12.5, 4.42, z], 0.2, steelEdge, true));
  for (const x of trussX) {
    addToBridge(beam("truss_vertical", [x, 2.6, z], [x, 4.4, z], 0.13, steel, true));
  }
  for (let i = 0; i < trussX.length - 1; i++) {
    const x1 = trussX[i];
    const x2 = trussX[i + 1];
    const direction = i % 2 === 0 ? 1 : -1;
    addToBridge(beam("truss_diagonal", [x1, 2.62, z], [x2, 4.38, z], 0.12, steel, true));
    if (direction < 0) {
      addToBridge(beam("truss_diagonal_back", [x1, 4.38, z], [x2, 2.62, z], 0.1, steelEdge, true));
    }
  }
}

for (const z of [-2.18, 2.18]) {
  addToBridge(beam("handrail", [-12.55, 5.72, z], [12.55, 5.72, z], 0.13, steelEdge));
  addToBridge(beam("rail_midrail", [-12.55, 4.96, z], [12.55, 4.96, z], 0.09, steel));
  for (let i = 0; i < 21; i++) {
    const x = -12.25 + i * 1.225;
    addToBridge(beam("railing_post", [x, 3.48, z], [x, 5.75, z], 0.105, steelEdge));
  }
}

for (const x of [-12.25, -9.8, -7.35, -4.9, -2.45, 0, 2.45, 4.9, 7.35, 9.8, 12.25]) {
  addToBridge(beam("floor_crossbeam", [x, 2.56, -2.0], [x, 2.56, 2.0], 0.16, steel, true));
}

for (const z of [-1.95, 1.95]) {
  addToBridge(beam("end_brace", [-12.45, 2.62, z], [-12.45, 4.42, z], 0.16, steel, true));
  addToBridge(beam("end_brace", [12.45, 2.62, z], [12.45, 4.42, z], 0.16, steel, true));
}

for (const x of [-12.25, 12.25]) {
  for (const z of [-2.0, 2.0]) {
    addToBridge(cylinder("bearing", 0.22, 0.12, new THREE.Vector3(x, 2.78, z), steel, 20));
  }
}

const lampMaterial = new THREE.MeshStandardMaterial({ color: 0x18252a, roughness: 0.38, metalness: 0.72 });
const lampGlow = new THREE.MeshStandardMaterial({ color: 0xffd79a, emissive: 0xff9e3d, emissiveIntensity: 2.3 });
for (const x of [-10.8, 0, 10.8]) {
  for (const z of [-2.55, 2.55]) {
    addToBridge(beam("lamp_stem", [x, 5.62, z], [x, 6.42, z], 0.075, lampMaterial));
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), lampGlow);
    bulb.position.set(x, 6.48, z);
    bulb.castShadow = true;
    bridgeGroup.add(bulb);
    const light = new THREE.PointLight(0xffb86a, 0.65, 5.5, 2);
    light.position.set(x, 6.47, z);
    bridgeGroup.add(light);
  }
}

for (let i = 0; i < 11; i++) {
  const x = -12 + i * 2.4;
  const ripple = new THREE.Mesh(
    new THREE.TorusGeometry(0.35 + (i % 3) * 0.1, 0.012, 5, 32),
    new THREE.MeshBasicMaterial({ color: 0x79b5b8, transparent: true, opacity: 0.32 })
  );
  ripple.rotation.x = Math.PI / 2;
  ripple.position.set(x, 0.14, (i % 2 ? 1.6 : -1.4));
  scene.add(ripple);
}

const hemisphere = new THREE.HemisphereLight(0xd9ecf2, 0x304237, 2.1);
scene.add(hemisphere);

const sun = new THREE.DirectionalLight(0xffe4bd, 3.3);
sun.position.set(-18, 27, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -28;
sun.shadow.camera.right = 28;
sun.shadow.camera.top = 28;
sun.shadow.camera.bottom = -18;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 75;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x9ec8db, 0.85);
fill.position.set(20, 12, -16);
scene.add(fill);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  water.material.opacity = 0.82 + Math.sin(elapsed * 0.7) * 0.035;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
