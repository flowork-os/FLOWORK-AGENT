const stoneMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  vertexColors: true,
  roughness: 0.93,
  metalness: 0.01,
  flatShading: true
});

const paleStoneMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  vertexColors: true,
  roughness: 0.9,
  metalness: 0.01,
  flatShading: true
});

const darkStoneMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  vertexColors: true,
  roughness: 0.98,
  metalness: 0,
  flatShading: true
});

const crackMaterial = new THREE.MeshStandardMaterial({
  color: 0x312f2a,
  roughness: 1,
  metalness: 0

const earthMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  vertexColors: true,
  roughness: 1,
  metalness: 0,
  flatShading: true
});

function hash3(x, y, z) {
  return THREE.MathUtils.euclideanModulo(
    Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453,
    1
  );
}

function colorGeometry(geometry, baseHex, variation = 0.13, staining = 0.07) {
  const position = geometry.attributes.position;
  const base = new THREE.Color(baseHex);
  const color = new THREE.Color();
  const colors = new Float32Array(position.count * 3);

  for (let i = 0; i < position.count; i++) {
    const x = position.getX(i);
    const y = position.getY(i);
    const z = position.getZ(i);
    const grain = hash3(x * 2.3, y * 2.3, z * 2.3);
    const broad = Math.sin(x * 1.7 + z * 0.8) * Math.sin(y * 2.1 - z);
    const streak = Math.max(0, Math.sin(x * 3.7 + z * 2.9) * 0.5 + 0.5);
    const value = 1 + (grain - 0.5) * variation + broad * 0.035 - streak * staining;
    color.copy(base).multiplyScalar(value);
    colors[i * 3] = color.r;
    colors[i * 3 + 1] = color.g;
    colors[i * 3 + 2] = color.b;
  }

  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.computeVertexNormals();
  return geometry;
}

function stoneMesh(geometry, baseHex = 0x8f8b80, material = stoneMaterial) {
  colorGeometry(geometry, baseHex);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function beveledBoxGeometry(width, height, depth, bevel = 0.12) {
  const b = Math.min(bevel, width * 0.2, height * 0.2, depth * 0.2);
  const shape = new THREE.Shape();
  shape.moveTo(-width / 2, -height / 2);
  shape.lineTo(width / 2, -height / 2);
  shape.lineTo(width / 2, height / 2);
  shape.lineTo(-width / 2, height / 2);
  shape.closePath();

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: Math.max(0.01, depth - b * 2),
    bevelEnabled: true,
    bevelSegments: 1,
    steps: 1,
    bevelSize: b,
    bevelThickness: b,
    curveSegments: 1
  });
  geometry.translate(0, 0, -(depth - b * 2) / 2);
  return geometry;
}

function addBlock(parent, width, height, depth, y, baseHex, bevel = 0.1, material = stoneMaterial) {
  const mesh = stoneMesh(
    beveledBoxGeometry(width, height, depth, bevel),
    baseHex,
    material
  );
  mesh.position.y = y;
  parent.add(mesh);
  return mesh;
}

function rectangularFrustumGeometry(bottomWidth, bottomDepth, topWidth, topDepth, height) {
  const y0 = -height / 2;
  const y1 = height / 2;
  const vertices = new Float32Array([
    -bottomWidth / 2, y0, -bottomDepth / 2,
     bottomWidth / 2, y0, -bottomDepth / 2,
     bottomWidth / 2, y0,  bottomDepth / 2,
    -bottomWidth / 2, y0,  bottomDepth / 2,
    -topWidth / 2, y1, -topDepth / 2,
     topWidth / 2, y1, -topDepth / 2,
     topWidth / 2, y1,  topDepth / 2,
    -topWidth / 2, y1,  topDepth / 2
  ]);
  const indices = [
    0, 2, 1, 0, 3, 2,
    4, 5, 6, 4, 6, 7,
    0, 1, 5, 0, 5, 4,
    1, 2, 6, 1, 6, 5,
    2, 3, 7, 2, 7, 6,
    3, 0, 4, 3, 4, 7
  ];
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function ringBodyGeometry(levels, segments = 10) {
  const positions = [];
  const indices = [];

  for (let level = 0; level < levels.length; level++) {
    const data = levels[level];
    for (let i = 0; i < segments; i++) {
      const angle = (i / segments) * Math.PI * 2;
      const irregularity = 1 + 0.025 * Math.sin(i * 5.13 + level * 1.7);
      positions.push(
        Math.cos(angle) * data.width * 0.5 * irregularity + (data.offsetX || 0),
        data.y,
        Math.sin(angle) * data.depth * 0.5 * irregularity + (data.offsetZ || 0)
      );
    }
  }

  for (let level = 0; level < levels.length - 1; level++) {
    for (let i = 0; i < segments; i++) {
      const next = (i + 1) % segments;
      const a = level * segments + i;
      const b = level * segments + next;
      const c = (level + 1) * segments + next;
      const d = (level + 1) * segments + i;
      indices.push(a, b, c, a, c, d);
    }
  }

  const bottomCenter = positions.length / 3;
  positions.push(levels[0].offsetX || 0, levels[0].y, levels[0].offsetZ || 0);
  const topCenter = positions.length / 3;
  const top = levels[levels.length - 1];
  positions.push(top.offsetX || 0, top.y, top.offsetZ || 0);

  for (let i = 0; i < segments; i++) {
    const next = (i + 1) % segments;
    indices.push(bottomCenter, next, i);
    const topOffset = (levels.length - 1) * segments;
    indices.push(topCenter, topOffset + i, topOffset + next);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function cylinderBetween(start, end, radiusTop, radiusBottom, radialSegments, baseHex) {
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(
    radiusTop,
    radiusBottom,
    length,
    radialSegments,
    1,
    false
  );
  const mesh = stoneMesh(geometry, baseHex);
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.clone().normalize()
  );
  return mesh;
}

function addCrack(parent, points, radius = 0.035) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geometry = new THREE.TubeGeometry(curve, 12, radius, 4, false);
  const mesh = new THREE.Mesh(geometry, crackMaterial);
  mesh.castShadow = false;
  parent.add(mesh);
  return mesh;
}

const groundGeometry = new THREE.PlaneGeometry(110, 110, 70, 70);
const groundPosition = groundGeometry.attributes.position;
for (let i = 0; i < groundPosition.count; i++) {
  const x = groundPosition.getX(i);
  const y = groundPosition.getY(i);
  const distance = Math.sqrt(x * x + y * y);
  const noise =
    Math.sin(x * 0.34) * Math.cos(y * 0.29) * 0.22 +
    (hash3(x, y, 2.7) - 0.5) * 0.15;
  groundPosition.setZ(i, noise - Math.max(0, distance - 30) * 0.015);
}
groundGeometry.computeVertexNormals();
colorGeometry(groundGeometry, 0x57594f, 0.22, 0.05);
const ground = new THREE.Mesh(groundGeometry, earthMaterial);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.38;
ground.receiveShadow = true;
scene.add(ground);

const monument = new THREE.Group();
scene.add(monument);

addBlock(monument, 14.8, 0.72, 12.4, 0.05, 0x68665e, 0.13, darkStoneMaterial);
addBlock(monument, 13.1, 0.66, 10.8, 0.72, 0x77736a, 0.11, darkStoneMaterial);
addBlock(monument, 11.6, 0.72, 9.4, 1.41, 0x827e74, 0.12);
addBlock(monument, 10.2, 0.56, 8.2, 2.05, 0x8d887d, 0.09);

const pedestal = stoneMesh(
  rectangularFrustumGeometry(8.3, 6.6, 7.6, 6.0, 3.85),
  0x8c887d
);
pedestal.position.y = 4.22;
monument.add(pedestal);

addBlock(monument, 8.5, 0.4, 6.8, 6.22, 0x77746b, 0.08);
addBlock(monument, 9.15, 0.47, 7.35, 6.65, 0x8c887e, 0.11);
addBlock(monument, 8.15, 0.38, 6.4, 7.08, 0x969084, 0.08);

const frontPanel = stoneMesh(
  beveledBoxGeometry(4.8, 2.1, 0.17, 0.07),
  0x6e6c65,
  darkStoneMaterial
);
frontPanel.position.set(0, 4.25, 3.15);
monument.add(frontPanel);

const panelInset = stoneMesh(
  beveledBoxGeometry(4.18, 1.54, 0.12, 0.04),
  0x858178
);
panelInset.position.set(0, 4.25, 3.25);
monument.add(panelInset);

addCrack(monument, [
  new THREE.Vector3(-2.9, 5.8, 3.03),
  new THREE.Vector3(-2.65, 5.35, 3.1),
  new THREE.Vector3(-2.8, 4.93, 3.17),
  new THREE.Vector3(-2.53, 4.48, 3.22)
], 0.028);

addCrack(monument, [
  new THREE.Vector3(1.75, 7.31, 3.2),
  new THREE.Vector3(1.53, 7.02, 3.23),
  new THREE.Vector3(1.66, 6.78, 3.28)
], 0.024);

const figure = new THREE.Group();
monument.add(figure);

const leftFoot = stoneMesh(beveledBoxGeometry(1.42, 0.62, 2.15, 0.17), 0x999489);
leftFoot.position.set(-1.25, 7.6, 0.44);
leftFoot.rotation.y = -0.08;

const rightFoot = stoneMesh(beveledBoxGeometry(1.42, 0.62, 2.15, 0.17), 0x999489);
rightFoot.position.set(1.15, 7.6, 0.5);
rightFoot.rotation.y = 0.06;
figure.add(rightFoot);

const robe = stoneMesh(
  ringBodyGeometry([
    { y: 7.75, width: 6.65, depth: 4.5, offsetZ: -0.12 },
    { y: 9.0, width: 6.2, depth: 4.1, offsetZ: -0.05 },
    { y: 12.3, width: 5.35, depth: 3.55, offsetX: -0.08 },
    { y: 15.8, width: 4.75, depth: 3.35, offsetX: -0.18 },
    { y: 18.2, width: 5.05, depth: 3.35, offsetX: -0.08 },
    { y: 20.5, width: 6.15, depth: 3.5 }
  ], 12),
  0x99958a,
  paleStoneMaterial
);

const cape = stoneMesh(
  ringBodyGeometry([
    { y: 10.0, width: 5.75, depth: 1.0, offsetZ: -2.0 },
    { y: 15.5, width: 5.1, depth: 0.85, offsetZ: -1.72 },
    { y: 20.35, width: 6.1, depth: 1.0, offsetZ: -1.52 }

);

const foldData = [

  [-0.42, 1.88, 0.58, 7.96, 18.0],

  0.42,
  0.62,

  0xa19c90
);

);

  new THREE.Vector3(-3.22, 16.7, 0.72),

  0.7,
  7,
  0x9c978c
);

scroll.position.set(-3.0, 12.0, 1.25);

const scrollTop = stoneMesh(new THREE.TorusGeometry(0.43, 0.09, 5, 8), 0x89857c);
scrollTop.position.set(-3.0, 13.62, 1.25);
scrollTop.rotation.x = Math.PI / 2;
figure.add(scrollTop);

const rightUpperArm = cylinderBetween(
  new THREE.Vector3(2.78, 19.85, -0.02),
  new THREE.Vector3(3.28, 17.35, 0.75),
  0.68,
  0.91,
  7,
  0x98938a
);

const rightForearm = cylinderBetween(
  new THREE.Vector3(3.28, 17.35, 0.75),
  new THREE.Vector3(1.42, 18.12, 1.82),
  0.56,
  0.67,
  7,
  0x9e998e
);
figure.add(rightForearm);

const rightHand = stoneMesh(new THREE.IcosahedronGeometry(0.7, 1), 0xaaa499);
rightHand.position.set(1.05, 18.28, 1.94);
rightHand.scale.set(1.08, 0.72, 0.78);
rightHand.rotation.z = -0.3;
figure.add(rightHand);

const shoulderMantle = stoneMesh(
  ringBodyGeometry([
    { y: 19.65, width: 6.25, depth: 3.55 },
    { y: 20.55, width: 6.05, depth: 3.4 },
    { y: 21.35, width: 4.2, depth: 2.85 }
  ], 10),
  0x989389
);
figure.add(shoulderMantle);

const neck = stoneMesh(new THREE.CylinderGeometry(0.92, 1.08, 1.48, 8), 0xa29d92);
neck.position.set(0, 21.65, 0.1);
figure.add(neck);

const head = stoneMesh(new THREE.IcosahedronGeometry(1.72, 2), 0xa49f94);
head.position.set(0, 23.45, 0.22);
head.scale.set(0.86, 1.13, 0.84);
head.rotation.y = -0.06;
figure.add(head);

const hairBack = stoneMesh(new THREE.IcosahedronGeometry(1.68, 1), 0x89857d);
hairBack.position.set(0, 23.73, -0.42);
hairBack.scale.set(0.93, 1.02, 0.72);
figure.add(hairBack);

const brow = stoneMesh(beveledBoxGeometry(1.58, 0.25, 0.24, 0.06), 0x9b968c);
brow.position.set(0, 23.78, 1.55);
brow.rotation.x = -0.08;
figure.add(brow);

const noseGeometry = new THREE.ConeGeometry(0.34, 0.92, 4);
noseGeometry.rotateX(Math.PI / 2);
const nose = stoneMesh(noseGeometry, 0xa8a297);
nose.position.set(-0.03, 23.42, 1.68);
nose.rotation.z = 0.03;
figure.add(nose);

const leftCheek = stoneMesh(new THREE.IcosahedronGeometry(0.52, 1), 0xa39e93);
leftCheek.position.set(-0.58, 23.18, 1.32);
leftCheek.scale.set(1.0, 0.82, 0.48);
figure.add(leftCheek);

const rightCheek = stoneMesh(new THREE.IcosahedronGeometry(0.52, 1), 0xa39e93);
rightCheek.position.set(0.57, 23.18, 1.32);
rightCheek.scale.set(1.0, 0.82, 0.48);
figure.add(rightCheek);

const beard = stoneMesh(new THREE.IcosahedronGeometry(0.91, 1), 0x918c83);
beard.position.set(0, 22.54, 0.99);
beard.scale.set(0.95, 1.1, 0.72);
figure.add(beard);

const mouth = new THREE.Mesh(
  beveledBoxGeometry(0.62, 0.075, 0.055, 0.015),
  crackMaterial
);
mouth.position.set(0, 22.86, 1.65);
mouth.rotation.z = -0.025;
figure.add(mouth);

const eyeMaterial = new THREE.MeshStandardMaterial({
  color: 0x4b4943,
  roughness: 1
});

for (const x of [-0.49, 0.47]) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 5), eyeMaterial);
  eye.position.set(x, 23.72, 1.62);
  eye.scale.set(1.35, 0.55, 0.4);
  figure.add(eye);
}

const brokenCrown = stoneMesh(new THREE.CylinderGeometry(1.15, 1.4, 0.48, 8), 0x918d84);
brokenCrown.position.set(0, 25.18, -0.04);
brokenCrown.rotation.z = -0.025;
figure.add(brokenCrown);

const chip = stoneMesh(new THREE.BoxGeometry(0.62, 0.42, 0.4), 0x858178);
chip.position.set(0.96, 25.28, 0.34);
chip.rotation.set(0.2, 0.31, -0.12);
figure.add(chip);

const rubbleGroup = new THREE.Group();
scene.add(rubbleGroup);

const rubbleData = [
  [-7.2, 0.2, 4.5, 1.2, 0.55, 0.8],
  [6.4, 0.08, 5.9, 0.75, 0.42, 1.1],
  [-8.0, -0.03, -2.9, 0.85, 0.35, 0.64],
  [5.9, -0.12, -5.2, 1.4, 0.46, 0.72],
  [8.4, -0.15, 0.8, 0.6, 0.28, 0.9],
  [-5.5, -0.12, 7.3, 0.54, 0.3, 0.48],
  [3.8, -0.18, 8.4, 0.78, 0.3, 0.58]
];

for (let i = 0; i < rubbleData.length; i++) {
  const data = rubbleData[i];
  const rock = stoneMesh(
    new THREE.DodecahedronGeometry(0.65, 0),
    i % 2 === 0 ? 0x716e65 : 0x817d73,
    darkStoneMaterial
  );
  rock.position.set(data[0], data[1], data[2]);
  rock.scale.set(data[3], data[4], data[5]);
  rock.rotation.set(i * 0.43, i * 0.79, i * 0.31);
  rubbleGroup.add(rock);
}

const distantRing = new THREE.Mesh(
  new THREE.CylinderGeometry(48, 51, 1.2, 64, 1, true),
  new THREE.MeshStandardMaterial({
    color: 0x777b76,
    roughness: 1,
    side: THREE.DoubleSide
  })
);
distantRing.position.y = -0.8;
distantRing.receiveShadow = true;
scene.add(distantRing);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  warmFill.intensity = 1.1 + Math.sin(elapsed * 0.35) * 0.08;
  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
