<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Pangolin</title>
<style>
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #171a16;
}
canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171a16);
scene.fog = new THREE.Fog(0x171a16, 10, 20);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 50);
camera.position.set(-6.5, 4.2, 8.2);
camera.lookAt(0.5, 1.1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.45, 1.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.enablePan = false;
controls.minDistance = 6;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI * 0.49;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;

const hemi = new THREE.HemisphereLight(0xd9e1ce, 0x342b25, 1.45);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffddb0, 4.2);
key.position.set(-4, 8, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -5;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 22;
key.shadow.bias = -0.00035;
scene.add(key);

const rim = new THREE.DirectionalLight(0x9db4d5, 2.15);
rim.position.set(6, 4, -6);
scene.add(rim);

const warmFill = new THREE.PointLight(0xc78852, 18, 10, 2);
warmFill.position.set(-4, 2.5, -3);
scene.add(warmFill);

function randomTexture(size = 256) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#858575';
  ctx.fillRect(0, 0, size, size);

  const image = ctx.getImageData(0, 0, size, size);
  const data = image.data;
  for (let i = 0; i < data.length; i += 4) {
    const n = 105 + Math.random() * 75;
    data[i] = n;
    data[i + 1] = n;
    data[i + 2] = n;
    data[i + 3] = 255;
  }
  ctx.putImageData(image, 0, 0);

  ctx.strokeStyle = 'rgba(245,245,235,0.28)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 160; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const len = 4 + Math.random() * 20;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + len, y + (Math.random() - 0.5) * 3);
    ctx.stroke();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(2.5, 2.5);
  texture.colorSpace = THREE.NoColorSpace;
  return texture;
}

const wearTexture = randomTexture();

const scaleMaterial = new THREE.MeshStandardMaterial({
  color: 0x9a8951,
  roughness: 0.76,
  metalness: 0.02,
  vertexColors: true,
  bumpMap: wearTexture,
  bumpScale: 0.035,
  side: THREE.DoubleSide
});

const skinMaterial = new THREE.MeshStandardMaterial({
  color: 0x8c716c,
  roughness: 0.96,
  metalness: 0,
  bumpMap: wearTexture,
  bumpScale: 0.018
});

const darkSkinMaterial = new THREE.MeshStandardMaterial({
  color: 0x584746,
  roughness: 0.95
});

const clawMaterial = new THREE.MeshStandardMaterial({
  color: 0x4a4135,
  roughness: 0.7
});

const eyeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x030302,
  roughness: 0.16,
  clearcoat: 1,
  clearcoatRoughness: 0.08
});

const pangolin = new THREE.Group();
pangolin.rotation.y = -0.12;
scene.add(pangolin);

function ellipsoid(rx, ry, rz, material, position, segments = 36) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(1, segments, Math.max(16, Math.floor(segments * 0.65))),
    material
  );
  mesh.scale.set(rx, ry, rz);
  mesh.position.copy(position);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  pangolin.add(mesh);
  return mesh;
}

const belly = ellipsoid(
  1.78, 0.86, 0.79,
  skinMaterial,
  new THREE.Vector3(0.08, 1.28, 0),
  44
);

const neck = ellipsoid(
  0.88, 0.66, 0.63,
  skinMaterial,
  new THREE.Vector3(-1.52, 1.24, 0),
  36
);
neck.rotation.z = -0.25;

const head = ellipsoid(
  0.73, 0.48, 0.44,
  skinMaterial,
  new THREE.Vector3(-2.05, 1.09, 0),
  36
);
head.rotation.z = -0.3;

function cylinderBetween(a, b, radiusTop, radiusBottom, material, radial = 20) {
  const delta = new THREE.Vector3().subVectors(b, a);
  const length = delta.length();
  const geometry = new THREE.CylinderGeometry(
    radiusTop, radiusBottom, length, radial, 3, false
  );
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    delta.normalize()
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  pangolin.add(mesh);
  return mesh;
}

const muzzleBase = new THREE.Vector3(-2.3, 1.02, 0);
const muzzleTip = new THREE.Vector3(-3.05, 0.76, 0);
cylinderBetween(muzzleBase, muzzleTip, 0.16, 0.34, skinMaterial, 28);

const nose = ellipsoid(
  0.19, 0.145, 0.20,
  darkSkinMaterial,
  new THREE.Vector3(-3.08, 0.75, 0),
  24
);
nose.rotation.z = -0.3;

const nostrilMaterial = new THREE.MeshBasicMaterial({ color: 0x0b0908 });
for (const side of [-1, 1]) {
  const nostril = new THREE.Mesh(
    new THREE.SphereGeometry(0.027, 12, 8),
    nostrilMaterial
  );
  nostril.scale.set(1.5, 0.42, 0.72);
  nostril.position.set(-3.21, 0.785, side * 0.095);
  nostril.rotation.z = -0.25;
  pangolin.add(nostril);
}

for (const side of [-1, 1]) {
  const socket = new THREE.Mesh(
    new THREE.SphereGeometry(0.092, 18, 12),
    darkSkinMaterial
  );
  socket.scale.set(1.15, 0.9, 0.44);
  socket.position.set(-2.27, 1.25, side * 0.397);
  pangolin.add(socket);

  const eye = new THREE.Mesh(
    new THREE.SphereGeometry(0.058, 20, 14),
    eyeMaterial
  );
  eye.scale.set(0.9, 0.9, 0.48);
  eye.position.set(-2.29, 1.27, side * 0.433);
  eye.castShadow = true;
  pangolin.add(eye);

  const glint = new THREE.Mesh(
    new THREE.SphereGeometry(0.012, 8, 6),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  glint.position.set(-2.315, 1.298, side * 0.457);
  pangolin.add(glint);
}

const earMaterial = new THREE.MeshStandardMaterial({
  color: 0x715754,
  roughness: 0.98,
  side: THREE.DoubleSide
});

for (const side of [-1, 1]) {
  const ear = new THREE.Mesh(
    new THREE.CircleGeometry(0.13, 22),
    earMaterial
  );
  ear.scale.set(0.7, 1, 1);
  ear.position.set(-1.72, 1.37, side * 0.48);
  ear.rotation.y = side > 0 ? 0 : Math.PI;
  ear.rotation.z = side * 0.15;
  pangolin.add(ear);
}

const tailPoints = [
  new THREE.Vector3(1.45, 1.42, 0),
  new THREE.Vector3(2.25, 1.30, -0.02),
  new THREE.Vector3(3.10, 1.05, -0.10),
  new THREE.Vector3(3.85, 0.69, -0.35),
  new THREE.Vector3(4.28, 0.39, -0.88),
  new THREE.Vector3(4.08, 0.29, -1.52),
  new THREE.Vector3(3.43, 0.26, -1.88),
  new THREE.Vector3(2.75, 0.25, -1.82)
];
const tailCurve = new THREE.CatmullRomCurve3(tailPoints, false, 'centripetal');

function taperedTube(curve, tubularSegments, radialSegments) {
  const positions = [];
  const normals = [];
  const uvs = [];
  const indices = [];
  const up = new THREE.Vector3(0, 1, 0);

  for (let i = 0; i <= tubularSegments; i++) {
    const t = i / tubularSegments;
    const center = curve.getPointAt(t);
    const tangent = curve.getTangentAt(t).normalize();
    let normal = up.clone().sub(
      tangent.clone().multiplyScalar(up.dot(tangent))
    );
    if (normal.lengthSq() < 0.001) normal.set(0, 0, 1);
    normal.normalize();
    const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
    const radius = 0.62 * Math.pow(1 - t, 0.68) + 0.035;

    for (let j = 0; j <= radialSegments; j++) {
      const angle = j / radialSegments * Math.PI * 2;
      const radial = normal.clone().multiplyScalar(Math.cos(angle))
        .add(binormal.clone().multiplyScalar(Math.sin(angle)));
      const point = center.clone().addScaledVector(radial, radius);
      positions.push(point.x, point.y, point.z);
      normals.push(radial.x, radial.y, radial.z);
      uvs.push(t, j / radialSegments);
    }
  }

  for (let i = 0; i < tubularSegments; i++) {
    for (let j = 0; j < radialSegments; j++) {
      const a = i * (radialSegments + 1) + j;
      const b = (i + 1) * (radialSegments + 1) + j;
      const c = b + 1;
      const d = a + 1;
      indices.push(a, b, d, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeBoundingSphere();
  return geometry;
}

const tailCore = new THREE.Mesh(
  taperedTube(tailCurve, 64, 16),
  skinMaterial
);
tailCore.castShadow = true;
tailCore.receiveShadow = true;
pangolin.add(tailCore);

function makeScaleGeometry() {
  const vertices = [
    -0.50, -0.48, 0.015,
     0.50, -0.48, 0.015,
     0.58,  0.12, 0.035,
     0.00,  0.78, 0.12,
    -0.58,  0.12, 0.035,
     0.00,  0.02, 0.205
  ];
  const indices = [
    0, 1, 5,
    1, 2, 5,
    2, 3, 5,
    3, 4, 5,
    4, 0, 5,
    0, 4, 3,
    0, 3, 2,
    0, 2, 1
  ];
  const edge = new THREE.Color(0xd0a257);
  const base = new THREE.Color(0x675f35);
  const ridge = new THREE.Color(0xa78445);
  const colors = [];
  for (let i = 0; i < 5; i++) colors.push(edge.r, edge.g, edge.b);
  colors.push(ridge.r, ridge.g, ridge.b);

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  return geometry;
}

const scaleGeometry = makeScaleGeometry();
const scaleTransforms = [];
const scaleColors = [];
const scratchSegments = [];
let seed = 78531;

function rand() {
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
}

function addScale(position, normal, direction, width, length, thickness, shade) {
  const n = normal.clone().normalize();
  const y = direction.clone().sub(
    n.clone().multiplyScalar(direction.dot(n))
  ).normalize();
  const x = new THREE.Vector3().crossVectors(y, n).normalize();
  const correctedY = new THREE.Vector3().crossVectors(n, x).normalize();

  const basis = new THREE.Matrix4().makeBasis(x, correctedY, n);
  const quaternion = new THREE.Quaternion().setFromRotationMatrix(basis);
  const scale = new THREE.Vector3(width, length, thickness);
  const matrix = new THREE.Matrix4().compose(position, quaternion, scale);
  scaleTransforms.push(matrix);

  const color = new THREE.Color().setHSL(
    0.12 + (rand() - 0.5) * 0.025,
    0.28 + rand() * 0.09,
    shade + (rand() - 0.5) * 0.07
  );
  scaleColors.push(color);

  if (rand() < 0.22 && length > 0.24) {
    const count = rand() < 0.35 ? 2 : 1;
    for (let s = 0; s < count; s++) {
      const sx = (rand() - 0.5) * width * 0.45;
      const sy = (rand() - 0.25) * length * 0.38;
      const localA = new THREE.Vector3(sx, sy, 0.225 * thickness + 0.008);
      const localB = new THREE.Vector3(
        sx + width * (0.08 + rand() * 0.14),
        sy + length * (rand() - 0.5) * 0.06,
        0.225 * thickness + 0.009
      );
      localA.applyMatrix4(matrix);
      localB.applyMatrix4(matrix);
      scratchSegments.push(
        localA.x, localA.y, localA.z,
        localB.x, localB.y, localB.z
      );
    }
  }
}

const bodyCenter = new THREE.Vector3(0.05, 1.38, 0);
const bodyRadii = new THREE.Vector3(1.78, 1.01, 0.94);
const bodyRows = 17;

for (let i = 0; i < bodyRows; i++) {
  const u = (i + 0.35) / bodyRows;
  const phi = Math.PI * (0.12 + u * 0.79);
  const x = bodyCenter.x - bodyRadii.x * Math.cos(phi);
  const ringFactor = Math.sin(phi);
  const ringCount = Math.max(7, Math.floor(10 + ringFactor * 5));

  for (let j = 0; j < ringCount; j++) {
    const angle = (j + (i % 2) * 0.5) / ringCount * Math.PI * 2;
    const yNormal = Math.cos(angle);
    if (yNormal < -0.37) continue;

    const y = bodyCenter.y + bodyRadii.y * ringFactor * Math.cos(angle);
    const z = bodyCenter.z + bodyRadii.z * ringFactor * Math.sin(angle);
    const position = new THREE.Vector3(x, y, z);

    const normal = new THREE.Vector3(
      (x - bodyCenter.x) / (bodyRadii.x * bodyRadii.x),
      (y - bodyCenter.y) / (bodyRadii.y * bodyRadii.y),
      (z - bodyCenter.z) / (bodyRadii.z * bodyRadii.z)
    ).normalize();

    position.addScaledVector(normal, 0.035);
    const size = 0.28 + ringFactor * 0.18;
    addScale(
      position,
      normal,
      new THREE.Vector3(1, -0.08, 0),
      size * 0.88,
      size * 1.18,
      0.48,
      0.42
    );
  }
}

for (let i = 0; i < 8; i++) {
  const x = -1.2 - i * 0.16;
  const centerY = 1.32 - i * 0.045;
  const radiusY = 0.62 - i * 0.035;
  const radiusZ = 0.58 - i * 0.032;
  const count = Math.max(5, 9 - Math.floor(i * 0.35));

  for (let j = 0; j < count; j++) {
    const angle = (j + (i % 2) * 0.5) / count * Math.PI * 2;
    if (Math.cos(angle) < -0.28) continue;
    const position = new THREE.Vector3(
      x,
      centerY + radiusY * Math.cos(angle),
      radiusZ * Math.sin(angle)
    );
    const normal = new THREE.Vector3(
      0.12,
      Math.cos(angle) / radiusY,
      Math.sin(angle) / radiusZ
    ).normalize();
    position.addScaledVector(normal, 0.025);
    const size = 0.25 - i * 0.012;
    addScale(
      position,
      normal,
      new THREE.Vector3(-0.65, -0.22, 0),
      size * 0.85,
      size,
      0.4,
      0.4
    );
  }
}

for (let i = 0; i < 32; i++) {
  const t = 0.01 + i / 34;
  const center = tailCurve.getPointAt(t);
  const tangent = tailCurve.getTangentAt(t).normalize();
  let vertical = new THREE.Vector3(0, 1, 0);
  vertical.sub(tangent.clone().multiplyScalar(vertical.dot(tangent)));
  if (vertical.lengthSq() < 0.001) vertical.set(0, 0, 1);
  vertical.normalize();
  const lateral = new THREE.Vector3().crossVectors(tangent, vertical).normalize();
  const radius = 0.62 * Math.pow(1 - t, 0.68) + 0.035;
  const ringCount = t < 0.42 ? 9 : t < 0.75 ? 7 : 5;

  for (let j = 0; j < ringCount; j++) {
    const angle = (j + (i % 2) * 0.5) / ringCount * Math.PI * 2;
    if (Math.cos(angle) < -0.45) continue;
    const radial = vertical.clone().multiplyScalar(Math.cos(angle))
      .add(lateral.clone().multiplyScalar(Math.sin(angle))).normalize();
    const position = center.clone().addScaledVector(radial, radius + 0.018);
    const size = Math.max(0.075, 0.36 * Math.pow(1 - t, 0.62));
    addScale(
      position,
      radial,
      tangent,
      size * 0.85,
      size * 1.26,
      0.42,
      0.39 + t * 0.05
    );
  }
}

const scales = new THREE.InstancedMesh(
  scaleGeometry,
  scaleMaterial,
  scaleTransforms.length
);
for (let i = 0; i < scaleTransforms.length; i++) {
  scales.setMatrixAt(i, scaleTransforms[i]);
  scales.setColorAt(i, scaleColors[i]);
}
scales.instanceMatrix.needsUpdate = true;
if (scales.instanceColor) scales.instanceColor.needsUpdate = true;
scales.castShadow = true;
scales.receiveShadow = true;
pangolin.add(scales);

if (scratchSegments.length > 0) {
  const scratchGeometry = new THREE.BufferGeometry();
  scratchGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(scratchSegments, 3)
  );
  const scratches = new THREE.LineSegments(
    scratchGeometry,
    new THREE.LineBasicMaterial({
      color: 0xd8bb78,
      transparent: true,
      opacity: 0.38
    })
  );
  pangolin.add(scratches);
}

function addLeg(x, z, front) {
  const side = Math.sign(z);
  const shoulder = new THREE.Vector3(
    x,
    front ? 1.02 : 1.08,
    z
  );
  const elbow = new THREE.Vector3(
    x + (front ? -0.14 : 0.08),
    0.60,
    z + side * 0.10
  );
  const wrist = new THREE.Vector3(
    x + (front ? -0.22 : 0.18),
    0.22,
    z + side * 0.08
  );

  cylinderBetween(shoulder, elbow, front ? 0.18 : 0.23, front ? 0.27 : 0.34, skinMaterial, 18);
  cylinderBetween(elbow, wrist, front ? 0.145 : 0.20, front ? 0.19 : 0.24, skinMaterial, 18);

  const paw = ellipsoid(
    front ? 0.29 : 0.34,
    0.13,
    front ? 0.22 : 0.25,
    skinMaterial,
    new THREE.Vector3(wrist.x - 0.05, 0.145, wrist.z),
    22
  );
  paw.rotation.y = front ? -0.12 : 0.08;

  for (let r = 0; r < 3; r++) {
    const wrinkle = new THREE.Mesh(
      new THREE.TorusGeometry(
        front ? 0.155 : 0.205,
        0.008,
        6,
        22,
        Math.PI * 1.38
      ),
      darkSkinMaterial
    );
    wrinkle.position.lerpVectors(elbow, wrist, 0.30 + r * 0.19);
    wrinkle.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 0, 1),
      new THREE.Vector3().subVectors(wrist, elbow).normalize()
    );
    wrinkle.rotation.z += side * 0.55;
    wrinkle.scale.z = 0.75;
    pangolin.add(wrinkle);
  }

  const clawCount = front ? 4 : 3;
  for (let i = 0; i < clawCount; i++) {
    const spread = (i - (clawCount - 1) / 2) * 0.105;
    const base = new THREE.Vector3(
      wrist.x - (front ? 0.23 : 0.25),
      0.145,
      wrist.z + spread
    );
    const tip = new THREE.Vector3(
      base.x - (front ? 0.28 : 0.21),
      0.075,
      base.z + spread * 0.12
    );
    const claw = cylinderBetween(
      base,
      tip,
      0.008,
      front ? 0.055 : 0.047,
      clawMaterial,
      12
    );
    claw.castShadow = true;
  }
}

addLeg(-1.18, 0.64, true);
addLeg(-1.18, -0.64, true);
addLeg(0.95, 0.67, false);
addLeg(0.95, -0.67, false);

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x3a3930,
  roughness: 1,
  metalness: 0
});
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 96),
  groundMaterial
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

const shadowPatch = new THREE.Mesh(
  new THREE.CircleGeometry(4.4, 64),
  new THREE.MeshBasicMaterial({
    color: 0x0c0d0b,
    transparent: true,
    opacity: 0.22,
    depthWrite: false
  })
);
shadowPatch.rotation.x = -Math.PI / 2;
shadowPatch.position.set(0.7, 0.003, -0.35);
shadowPatch.scale.set(1.35, 0.62, 1);
scene.add(shadowPatch);

const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 20),
  new THREE.MeshBasicMaterial({
    color: 0x1c201b,
    side: THREE.DoubleSide
  })
);
backdrop.position.set(0, 7, -9);
scene.add(backdrop);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  pangolin.position.y = Math.sin(time * 1.15) * 0.008;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
