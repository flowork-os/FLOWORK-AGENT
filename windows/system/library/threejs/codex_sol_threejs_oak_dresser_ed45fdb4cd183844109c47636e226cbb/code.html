<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solid Oak Dresser</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      background: linear-gradient(#e9e2d7, #d8cfc1);
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe7e0d6);
scene.fog = new THREE.Fog(0xe7e0d6, 330, 620);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(
  34,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(178, 112, 190);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 42, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.42;
controls.minDistance = 145;
controls.maxDistance = 420;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minPolarAngle = Math.PI * 0.16;

function seededRandom(seed) {
  let state = seed >>> 0;
  return () => {
    state = (state * 1664525 + 1013904223) >>> 0;
    return state / 4294967296;
  };
}

function makeOakTexture(seed, lightness = 1) {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const random = seededRandom(seed);

  const image = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const broad = Math.sin(y * 0.045 + Math.sin(x * 0.013) * 1.8);
      const fine = Math.sin(y * 0.19 + Math.sin(x * 0.031) * 0.8);
      const noise = (random() - 0.5) * 9;
      const wave = broad * 6 + fine * 2.5 + noise;
      const i = (y * size + x) * 4;
      image.data[i] = Math.max(0, Math.min(255, (174 + wave) * lightness));
      image.data[i + 1] = Math.max(0, Math.min(255, (108 + wave * 0.72) * lightness));
      image.data[i + 2] = Math.max(0, Math.min(255, (52 + wave * 0.42) * lightness));
      image.data[i + 3] = 255;
    }
  }
  ctx.putImageData(image, 0, 0);

  ctx.globalAlpha = 0.22;
  for (let i = 0; i < 90; i++) {
    const x = random() * size;
    const width = 0.35 + random() * 1.4;
    const bend = (random() - 0.5) * 34;
    ctx.strokeStyle = random() > 0.45 ? '#5a2e10' : '#e0aa68';
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(x, -10);
    ctx.bezierCurveTo(
      x + bend, size * 0.3,
      x - bend * 0.4, size * 0.72,
      x + bend * 0.2, size + 10
    );
    ctx.stroke();
  }

  for (let i = 0; i < 11; i++) {
    const x = 35 + random() * (size - 70);
    const y = 35 + random() * (size - 70);
    const radius = 5 + random() * 13;
    ctx.strokeStyle = 'rgba(69,31,9,0.28)';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.ellipse(x, y, radius * 0.42, radius, random() * 0.3, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x, y, radius * 0.18, radius * 0.48, random() * 0.3, 0, Math.PI * 2);
    ctx.stroke();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(1.7, 1.7);
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

function makeBumpTexture(seed) {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const random = seededRandom(seed);
  const image = ctx.createImageData(size, size);

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const grain =
        Math.sin(y * 0.18 + Math.sin(x * 0.025) * 2.4) * 13 +
        Math.sin(y * 0.53) * 4 +
        (random() - 0.5) * 8;
      const value = Math.max(0, Math.min(255, 128 + grain));
      const i = (y * size + x) * 4;
      image.data[i] = value;
      image.data[i + 1] = value;
      image.data[i + 2] = value;
      image.data[i + 3] = 255;
    }
  }

  ctx.putImageData(image, 0, 0);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(2.3, 2.3);
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const oakMap = makeOakTexture(92341);
const oakBump = makeBumpTexture(7127);
const drawerMap = makeOakTexture(42017, 1.025);
const darkOakMap = makeOakTexture(8102, 0.68);

const oakMaterial = new THREE.MeshStandardMaterial({
  color: 0xc17a35,
  map: oakMap,
  bumpMap: oakBump,
  bumpScale: 0.16,
  roughness: 0.48,
  metalness: 0
});

const drawerMaterial = new THREE.MeshStandardMaterial({
  color: 0xc9843e,
  map: drawerMap,
  bumpMap: oakBump,
  bumpScale: 0.13,
  roughness: 0.45,
  metalness: 0
});

const edgeMaterial = new THREE.MeshStandardMaterial({
  color: 0x7d431d,
  map: darkOakMap,
  roughness: 0.58,
  metalness: 0
});

const recessMaterial = new THREE.MeshStandardMaterial({
  color: 0x321b0d,
  roughness: 0.78
});

const dresser = new THREE.Group();
scene.add(dresser);

function roundedPart(name, width, height, depth, radius, material, x, y, z, segments = 4) {
  const geometry = new RoundedBoxGeometry(width, height, depth, segments, radius);
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  dresser.add(mesh);
  return mesh;
}

function boxPart(name, width, height, depth, material, x, y, z) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
  mesh.name = name;
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  dresser.add(mesh);
  return mesh;
}

// Dimensions are modeled in centimeters.
const bodyWidth = 150;
const bodyDepth = 46;
const plinthHeight = 8;
const bodyBottom = 8;
const topBottom = 78.6;
const topThickness = 3.4;

// Dark interior creates convincing shadow lines between inset drawer fronts.
boxPart('drawer recess', 140.8, 62.5, 2.0, recessMaterial, 0, 45.1, 22.55);

// Solid carcass.
roundedPart('left side', 4.4, 70.6, bodyDepth, 0.75, oakMaterial, -72.8, 43.3, 0);
roundedPart('right side', 4.4, 70.6, bodyDepth, 0.75, oakMaterial, 72.8, 43.3, 0);
boxPart('lower rail', 141.2, 4.5, bodyDepth, oakMaterial, 0, 10.25, 0);
boxPart('upper rail', 141.2, 4.1, bodyDepth, oakMaterial, 0, 76.55, 0);
boxPart('center divider left', 2.4, 61.5, 42, oakMaterial, -23.75, 44.9, -0.8);
boxPart('center divider right', 2.4, 61.5, 42, oakMaterial, 23.75, 44.9, -0.8);
boxPart('horizontal divider', 141, 2.0, 42, oakMaterial, 0, 44.9, -0.8);
boxPart('back panel', 141, 62.5, 1.4, edgeMaterial, 0, 44.5, -22.3);

// Slightly overhanging solid top with softened edges.
roundedPart('top', 154, topThickness, 49.5, 1.05, oakMaterial, 0, topBottom + topThickness * 0.5, 0.1, 5);

// Low recessed plinth base.
roundedPart('plinth front', 139, plinthHeight, 8.5, 0.65, edgeMaterial, 0, 4, 15.3);
boxPart('plinth left return', 8, plinthHeight, 32, edgeMaterial, -65.5, 4, 0);
boxPart('plinth right return', 8, plinthHeight, 32, edgeMaterial, 65.5, 4, 0);
boxPart('plinth stretcher', 131, 3.5, 34, edgeMaterial, 0, 1.75, -0.3);

// Six subtly inset drawer fronts in a three-by-two grid.
const drawerWidth = 45.65;
const drawerHeight = 28.75;
const drawerDepth = 2.25;
const columnCenters = [-47.05, 0, 47.05];
const rowCenters = [60.05, 29.75];

for (let row = 0; row < 2; row++) {
  for (let column = 0; column < 3; column++) {
    const x = columnCenters[column];
    const y = rowCenters[row];

    const drawer = roundedPart(
      `drawer ${row * 3 + column + 1}`,
      drawerWidth,
      drawerHeight,
      drawerDepth,
      0.72,
      drawerMaterial,
      x,
      y,
      23.25,
      5
    );

    // Very small variation makes the grain feel like individual oak boards.
    drawer.rotation.z = (column - 1) * 0.0007 + (row ? 0.0004 : -0.0003);
  }
}

// Turned mushroom-style wooden knobs.
const knobProfile = [
  new THREE.Vector2(0.18, 0.00),
  new THREE.Vector2(1.15, 0.08),
  new THREE.Vector2(1.65, 0.35),
  new THREE.Vector2(1.82, 0.85),
  new THREE.Vector2(2.18, 1.28),
  new THREE.Vector2(2.62, 1.76),
  new THREE.Vector2(2.78, 2.28),
  new THREE.Vector2(2.62, 2.76),
  new THREE.Vector2(2.10, 3.12),
  new THREE.Vector2(1.25, 3.32),
  new THREE.Vector2(0.20, 3.36)
];
const knobGeometry = new THREE.LatheGeometry(knobProfile, 32);
knobGeometry.rotateX(Math.PI / 2);
knobGeometry.computeVertexNormals();

const knobMaterial = new THREE.MeshStandardMaterial({
  color: 0x9b5824,
  map: darkOakMap,
  bumpMap: oakBump,
  bumpScale: 0.1,
  roughness: 0.38
});

for (const y of rowCenters) {
  for (const x of columnCenters) {
    const collar = new THREE.Mesh(
      new THREE.CylinderGeometry(1.42, 1.62, 0.65, 28),
      knobMaterial
    );
    collar.rotation.x = Math.PI / 2;
    collar.position.set(x, y, 24.78);
    collar.castShadow = true;
    collar.receiveShadow = true;
    dresser.add(collar);

    const knob = new THREE.Mesh(knobGeometry, knobMaterial);
    knob.position.set(x, y, 25.05);
    knob.castShadow = true;
    knob.receiveShadow = true;
    dresser.add(knob);
  }
}

// Fine seams along the top's underside and plinth recess.
boxPart('top shadow line', 145.5, 0.42, 47, recessMaterial, 0, 78.45, 0);
boxPart('plinth shadow line', 139.5, 0.48, 7.4, recessMaterial, 0, 8.35, 15.55);

// Warm neutral studio-bedroom setting.
const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xb9aa94,
  roughness: 0.92,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(700, 700), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.25;
floor.receiveShadow = true;
scene.add(floor);

const wallMaterial = new THREE.MeshStandardMaterial({
  color: 0xe9e2d8,
  roughness: 0.96
});
const wall = new THREE.Mesh(new THREE.PlaneGeometry(700, 300), wallMaterial);
wall.position.set(0, 150, -90);
wall.receiveShadow = true;
scene.add(wall);

const baseboard = new THREE.Mesh(
  new RoundedBoxGeometry(700, 8, 2.2, 3, 0.35),
  new THREE.MeshStandardMaterial({ color: 0xd7cfc3, roughness: 0.8 })
);
baseboard.position.set(0, 4, -88.7);
baseboard.receiveShadow = true;
scene.add(baseboard);

const ambient = new THREE.HemisphereLight(0xfff4df, 0x7f7061, 1.65);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffe2b5, 4.2);
keyLight.position.set(-115, 180, 125);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -180;
keyLight.shadow.camera.right = 180;
keyLight.shadow.camera.top = 180;
keyLight.shadow.camera.bottom = -90;
keyLight.shadow.camera.near = 25;
keyLight.shadow.camera.far = 430;
keyLight.shadow.bias = -0.00018;
keyLight.shadow.normalBias = 0.035;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xc8dcff, 1.15);
fillLight.position.set(130, 105, 65);
scene.add(fillLight);

const topLight = new THREE.PointLight(0xffe8c7, 85, 280, 2);
topLight.position.set(0, 165, 20);
scene.add(topLight);

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
