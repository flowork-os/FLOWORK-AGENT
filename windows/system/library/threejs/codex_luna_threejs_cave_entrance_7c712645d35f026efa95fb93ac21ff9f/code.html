<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Cave Entrance</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101316}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101417);
scene.fog = new THREE.Fog(0x101417, 18, 34);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(10, 6.6, 14);
camera.lookAt(0, 2.5, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.42;
controls.target.set(0, 2.25, 0);
controls.minDistance = 7;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.48;

const hemi = new THREE.HemisphereLight(0x8ba1ac, 0x201914, 1.25);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xc9d5d2, 2.5);
sun.position.set(-8, 13, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -13;
sun.shadow.camera.right = 13;
sun.shadow.camera.top = 15;
sun.shadow.camera.bottom = -5;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 35;
scene.add(sun);

const caveGlow = new THREE.PointLight(0x507281, 3.8, 10, 2);
caveGlow.position.set(0, 2.15, -3.4);
caveGlow.castShadow = true;
scene.add(caveGlow);

const wetGlow = new THREE.PointLight(0x314c55, 1.5, 7, 2);
wetGlow.position.set(-2.8, 1.1, -1.1);
scene.add(wetGlow);

const mats = {
  wall: new THREE.MeshStandardMaterial({color:0x464640, roughness:.96, metalness:0}),
  wallDark: new THREE.MeshStandardMaterial({color:0x30322f, roughness:1}),
  stone: new THREE.MeshStandardMaterial({color:0x56564e, roughness:.88}),
  stoneLight: new THREE.MeshStandardMaterial({color:0x69675e, roughness:.9}),
  darkStone: new THREE.MeshStandardMaterial({color:0x292c2a, roughness:.95}),
  wet: new THREE.MeshStandardMaterial({color:0x263b3b, roughness:.55, metalness:.02}),
  moss: new THREE.MeshStandardMaterial({color:0x34443a, roughness:1}),
  gravel: new THREE.MeshStandardMaterial({color:0x3e403b, roughness:1}),
  interior: new THREE.MeshStandardMaterial({color:0x090d0e, roughness:1}),
  floor: new THREE.MeshStandardMaterial({color:0x292a27, roughness:1})
};

let seed = 73421;
function rand(){
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function rock(x,y,z,sx,sy,sz,mat=mats.stone, detail=1){
  const g = new THREE.IcosahedronGeometry(1, detail);
  const p = g.attributes.position;
  for(let i=0;i<p.count;i++){
    const n = 0.86 + rand()*.28;
    p.setXYZ(i,p.getX(i)*n,p.getY(i)*(0.9+rand()*.2),p.getZ(i)*n);
  }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g,mat);
  m.position.set(x,y,z);
  m.scale.set(sx,sy,sz);
  m.rotation.set(rand()*.35,rand()*Math.PI,rand()*.25);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}

const backGeo = new THREE.PlaneGeometry(18,11,18,12);
const backPos = backGeo.attributes.position;
for(let i=0;i<backPos.count;i++){
  const x=backPos.getX(i), y=backPos.getY(i);
  backPos.setZ(i, -0.8 + Math.sin(x*1.7+y*.65)*.18 + (rand()-.5)*.25);
}
backGeo.computeVertexNormals();
const back = new THREE.Mesh(backGeo,mats.wall);
back.position.set(0,4.2,-1.25);
back.receiveShadow=true;
scene.add(back);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(32,25),mats.floor);
ground.rotation.x=-Math.PI/2;
ground.position.set(0,-.04,-1.5);
ground.receiveShadow=true;
scene.add(ground);

const innerShape = new THREE.Shape();
const ir=2.72, cy=1.72, base=.12;
innerShape.moveTo(-ir,base);
innerShape.lineTo(-ir,cy);
innerShape.absarc(0,cy,ir,Math.PI,0,false);
innerShape.lineTo(ir,base);
innerShape.lineTo(-ir,base);
const opening = new THREE.Mesh(new THREE.ShapeGeometry(innerShape),mats.interior);
opening.position.z=-.02;
opening.receiveShadow=true;
scene.add(opening);

const floorInside = new THREE.Mesh(new THREE.PlaneGeometry(5.5,9),mats.interior);
floorInside.rotation.x=-Math.PI/2;
floorInside.position.set(0,.03,-4.1);
scene.add(floorInside);

function archRing(){
  const or=3.38, segments=28, verts=[], indices=[];
  for(let i=0;i<=segments;i++){
    const a=Math.PI-(Math.PI*i/segments);
    verts.push(Math.cos(a)*ir,cy+Math.sin(a)*ir,.12);
    verts.push(Math.cos(a)*or,cy+Math.sin(a)*or,.12);
  }
  for(let i=0;i<segments;i++){
    const q=i*2;
    indices.push(q,q+1,q+3,q,q+3,q+2);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.Float32BufferAttribute(verts,3));
  g.setIndex(indices);
  g.computeVertexNormals();
  const mesh=new THREE.Mesh(g,mats.darkStone);
  mesh.castShadow=true; mesh.receiveShadow=true;
  scene.add(mesh);
}
archRing();

for(const x of [-3.08,3.08]){
  const side=new THREE.Mesh(new THREE.BoxGeometry(.62,1.62,.72),mats.darkStone);
  side.position.set(x,.88,.1);
  side.rotation.z=(x<0?.035:-.035);
  side.castShadow=true; side.receiveShadow=true;
  scene.add(side);
}

const wetRing = new THREE.Mesh(
  new THREE.TorusGeometry(2.93,.075,8,32,Math.PI),
  mats.wet
);
wetRing.rotation.z=Math.PI;
wetRing.position.set(0,1.72,.18);
wetRing.scale.y=1.14;
scene.add(wetRing);

const ledges=[
  [-5.0,4.9,.0,2.7,.65,1.25],
  [-2.2,5.25,.05,2.25,.7,1.3],
  [1.0,5.15,.02,2.7,.8,1.5],
  [4.1,4.75,.05,2.5,.85,1.35],
  [-5.9,2.75,.18,1.8,1.55,1.0],
  [5.45,2.65,.14,1.7,1.7,1.0],
  [-4.9,1.25,.22,1.5,1.05,.8],
  [4.85,1.15,.2,1.55,1.1,.82]
];
for(const r of ledges) rock(...r,mats.stone,1);

for(let i=0;i<20;i++){
  const side=rand()<.5?-1:1;
  const x=side*(3.25+rand()*3.1);
  const y=.75+rand()*3.4;
  const z=.05+rand()*.48;
  rock(x,y,z,.45+rand()*.8,.35+rand()*.75,.35+rand()*.7,
       rand()<.28?mats.wallDark:(rand()<.25?mats.stoneLight:mats.stone),1);
}

for(let i=0;i<25;i++){
  const x=-5.8+rand()*11.6;
  const z=-2.8+rand()*3.5;
  const s=.12+rand()*.38;
  rock(x,s*.75,z,s*1.35,s*.72,s,mats.gravel,1);
}

for(const b of [
  [-3.9,.48,1.05,1.0,.55,.85],
  [-2.8,.26,.7,.62,.3,.55],
  [3.5,.62,.85,1.2,.7,1.0],
  [4.65,.3,-.05,.62,.34,.58],
  [1.9,.3,1.2,.7,.35,.58],
  [-5.0,.22,-.9,.72,.3,.5]
]) rock(...b,mats.stoneLight,1);

for(let i=0;i<8;i++){
  const x=-3.4+rand()*6.8;
  const z=.28+rand()*1.6;
  const peb=rock(x,.1+rand()*.15,z,.18+rand()*.22,.09+rand()*.12,.14+rand()*.2,mats.wet,1);
  peb.rotation.x=.2;
}

const mossPatches=[
  [-3.34,2.55,.47,.42,.03,.08],
  [-3.4,2.18,.48,.28,.025,.07],
  [3.34,2.28,.48,.36,.025,.08],
  [2.98,3.18,.5,.24,.025,.06],
  [-4.55,3.55,.37,.56,.035,.1]
];
for(const p of mossPatches){
  const q=new THREE.Mesh(new THREE.BoxGeometry(p[3],p[4],p[5]),mats.moss);
  q.position.set(p[0],p[1],p[2]);
  q.rotation.z=(rand()-.5)*.5;
  scene.add(q);
}

const dripMat=new THREE.MeshStandardMaterial({color:0x537274,roughness:.3,metalness:.05});
for(const d of [[-2.1,3.55,.27,.035],[1.55,3.95,.29,.045],[2.35,2.9,.3,.03]]){
  const drop=new THREE.Mesh(new THREE.CylinderGeometry(d[3],d[3]*.7,d[2],7),dripMat);
  drop.position.set(d[0],d[1],d[2]);
  scene.add(drop);
}

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
