<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Fern Clump</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #dce8d2;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdce8d2);
scene.fog = new THREE.FogExp2(0xdce8d2, 0.055);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.05, 100);
camera.position.set(6.8, 4.5, 8.2);
camera.lookAt(0, 1.65, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.55, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.42;
controls.minDistance = 5;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xf5ffe8, 0x344128, 2.2));

const keyLight = new THREE.DirectionalLight(0xfff5d8, 3.3);
keyLight.position.set(-5, 9, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -7;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 25;
keyLight.shadow.bias = -0.0002;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x9fc9a5, 1.1);
fillLight.position.set(5, 4, -6);
scene.add(fillLight);

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x718060,
  roughness: 0.96,
  metalness: 0
});
const ground = new THREE.Mesh(new THREE.CircleGeometry(11, 96), groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.07;
ground.receiveShadow = true;
scene.add(ground);

const soil = new THREE.Mesh(
  new THREE.CylinderGeometry(1.15, 1.45, 0.18, 64, 1),
  new THREE.MeshStandardMaterial({ color: 0x453b28, roughness: 1 })
);
soil.position.y = 0;
soil.receiveShadow = true;
soil.castShadow = true;
scene.add(soil);

let seed = 19472;
function random() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(min, max) {
  return min + (max - min) * random();
}

const frondGroup = new THREE.Group();
scene.add(frondGroup);

const stemMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x4d8e31, roughness: 0.72 }),
  new THREE.MeshStandardMaterial({ color: 0x659d38, roughness: 0.7 }),
  new THREE.MeshStandardMaterial({ color: 0x3f7b2d, roughness: 0.76 })
];

const leafletGeometry = createLeafletGeometry();
const leafletRecords = [];
const frondCount = 27;

for (let i = 0; i < frondCount; i++) {
  const azimuth = (i / frondCount) * Math.PI * 2 + range(-0.18, 0.18);
  const layer = i % 3;
  const length = range(3.15, 5.05) * (layer === 0 ? 0.88 : layer === 1 ? 1 : 0.94);
  const rise = range(2.05, 3.55);
  const baseRadius = range(0.08, 0.34);
  const lean = range(0.82, 1.16);
  const sway = range(-0.34, 0.34);
  const tipDrop = range(0.15, 0.65);
  const radial = new THREE.Vector3(Math.cos(azimuth), 0, Math.sin(azimuth));
  const lateral = new THREE.Vector3(-Math.sin(azimuth), 0, Math.cos(azimuth));
  const points = [];

  for (let p = 0; p <= 12; p++) {
    const t = p / 12;
    const outward = length * (0.06 * t + 0.94 * Math.pow(t, 1.13)) * lean;
    const arch = rise * Math.sin(Math.PI * Math.pow(t, 0.86)) * (0.75 + 0.25 * t);
    const baseLift = 0.11 + 0.48 * t;
    const drop = tipDrop * Math.pow(t, 4.2);
    const side = sway * Math.sin(Math.PI * t) + 0.08 * Math.sin(t * Math.PI * 2 + i);
    const point = radial.clone().multiplyScalar(baseRadius + outward);
    point.add(lateral.clone().multiplyScalar(side));
    point.y = baseLift + arch - drop;
    points.push(point);
  }

  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal', 0.35);
  const stemRadius = range(0.022, 0.034);
  const stemGeometry = new THREE.TubeGeometry(curve, 54, stemRadius, 7, false);
  const stem = new THREE.Mesh(stemGeometry, stemMaterials[i % stemMaterials.length]);
  stem.castShadow = true;
  stem.receiveShadow = true;
  frondGroup.add(stem);

  const pairCount = Math.floor(range(15, 23));
  const startT = range(0.075, 0.12);

  for (let j = 0; j < pairCount; j++) {
    const u = j / Math.max(1, pairCount - 1);
    const t = startT + u * (0.91 - startT);
    const position = curve.getPointAt(t);
    const tangent = curve.getTangentAt(t).normalize();
    let sideVector = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), tangent);

    if (sideVector.lengthSq() < 0.0001) {
      sideVector.set(-Math.sin(azimuth), 0, Math.cos(azimuth));
    }
    sideVector.normalize();

    const taper = Math.pow(Math.sin(Math.PI * (0.08 + 0.84 * u)), 0.38);
    const basalReduction = THREE.MathUtils.smoothstep(u, 0, 0.16);
    const leafletLength = length * range(0.115, 0.155) * taper * (0.66 + 0.34 * basalReduction);
    const leafletWidth = leafletLength * range(0.19, 0.25);
    const forwardSweep = THREE.MathUtils.lerp(0.03, 0.33, u);

    for (const sign of [-1, 1]) {
      const offsetT = THREE.MathUtils.clamp(t + sign * range(-0.003, 0.003), 0, 1);
      const leafletPosition = curve.getPointAt(offsetT);
      const yAxis = sideVector.clone().multiplyScalar(sign);
      yAxis.addScaledVector(tangent, forwardSweep);
      yAxis.y += range(-0.05, 0.12) + 0.08 * (1 - u);
      yAxis.normalize();

      const xAxis = tangent.clone().addScaledVector(yAxis, -tangent.dot(yAxis)).normalize();
      const zAxis = new THREE.Vector3().crossVectors(xAxis, yAxis).normalize();
      if (zAxis.y < 0) {
        zAxis.multiplyScalar(-1);
        xAxis.multiplyScalar(-1);
      }

      const basis = new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis);
      const scale = new THREE.Matrix4().makeScale(
        leafletWidth * range(0.92, 1.08),
        leafletLength * range(0.94, 1.06),
        leafletLength
      );
      const translation = new THREE.Matrix4().makeTranslation(
        leafletPosition.x,
        leafletPosition.y,
        leafletPosition.z
      );
      const matrix = translation.multiply(basis).multiply(scale);
      const hueShift = range(-0.018, 0.018);
      const color = new THREE.Color().setHSL(
        0.285 + hueShift,
        range(0.49, 0.66),
        range(0.25, 0.39) + u * 0.035
      );
      leafletRecords.push({ matrix, color });
    }
  }

  const tipPosition = curve.getPointAt(0.955);
  const tipTangent = curve.getTangentAt(0.955).normalize();
  const tipSide = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), tipTangent).normalize();
  const tipXAxis = tipSide.clone();
  const tipYAxis = tipTangent.clone();
  const tipZAxis = new THREE.Vector3().crossVectors(tipXAxis, tipYAxis).normalize();
  const tipBasis = new THREE.Matrix4().makeBasis(tipXAxis, tipYAxis, tipZAxis);
  const tipScale = new THREE.Matrix4().makeScale(length * 0.025, length * 0.12, length * 0.1);
  const tipTranslation = new THREE.Matrix4().makeTranslation(tipPosition.x, tipPosition.y, tipPosition.z);
  leafletRecords.push({
    matrix: tipTranslation.multiply(tipBasis).multiply(tipScale),
    color: new THREE.Color().setHSL(0.29, 0.58, range(0.3, 0.4))
  });
}

const leafMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 0.78,
  metalness: 0,
  side: THREE.DoubleSide,
  vertexColors: true
});

const leaves = new THREE.InstancedMesh(leafletGeometry, leafMaterial, leafletRecords.length);
leaves.castShadow = true;
leaves.receiveShadow = true;
leaves.instanceMatrix.setUsage(THREE.StaticDrawUsage);

leafletRecords.forEach((record, index) => {
  leaves.setMatrixAt(index, record.matrix);
  leaves.setColorAt(index, record.color);
});
leaves.instanceMatrix.needsUpdate = true;
if (leaves.instanceColor) leaves.instanceColor.needsUpdate = true;
frondGroup.add(leaves);

const baseStemMaterial = new THREE.MeshStandardMaterial({
  color: 0x526b28,
  roughness: 0.9
});

for (let i = 0; i < 34; i++) {
  const angle = range(0, Math.PI * 2);
  const radius = range(0.12, 0.68);
  const height = range(0.22, 0.55);
  const stalk = new THREE.Mesh(
    new THREE.CylinderGeometry(range(0.018, 0.032), range(0.028, 0.047), height, 6),
    baseStemMaterial
  );
  stalk.position.set(Math.cos(angle) * radius, height * 0.5 + 0.08, Math.sin(angle) * radius);
  stalk.rotation.z = range(-0.16, 0.16);
  stalk.castShadow = true;
  frondGroup.add(stalk);
}

const pebbleMaterial = new THREE.MeshStandardMaterial({
  color: 0x6f6958,
  roughness: 0.96
});

for (let i = 0; i < 18; i++) {
  const angle = range(0, Math.PI * 2);
  const radius = range(0.75, 1.3);
  const pebble = new THREE.Mesh(
    new THREE.DodecahedronGeometry(range(0.07, 0.16), 0),
    pebbleMaterial
  );
  pebble.position.set(Math.cos(angle) * radius, range(0.05, 0.1), Math.sin(angle) * radius);
  pebble.scale.set(range(0.8, 1.5), range(0.45, 0.8), range(0.8, 1.4));
  pebble.rotation.set(range(0, Math.PI), range(0, Math.PI), range(0, Math.PI));
  pebble.castShadow = true;
  pebble.receiveShadow = true;
  scene.add(pebble);
}

function createLeafletGeometry() {
  const stations = 9;
  const positions = [];
  const normals = [];
  const uvs = [];
  const indices = [];

  for (let i = 0; i < stations; i++) {
    const t = i / (stations - 1);
    const width = Math.pow(Math.sin(Math.PI * t), 0.72) * (0.95 - 0.28 * t);
    const curl = 0.018 * Math.sin(Math.PI * t) - 0.025 * t * t;

    positions.push(-width, t, curl);
    positions.push(0, t, 0.055 * Math.sin(Math.PI * t) + curl);
    positions.push(width, t, curl);

    normals.push(0, 0.18, 0.98, 0, 0.1, 0.995, 0, 0.18, 0.98);
    uvs.push(0, t, 0.5, t, 1, t);
  }

  for (let i = 0; i < stations - 1; i++) {
    const a = i * 3;
    const b = (i + 1) * 3;
    indices.push(a, b, a + 1);
    indices.push(a + 1, b, b + 1);
    indices.push(a + 1, b + 1, a + 2);
    indices.push(a + 2, b + 1, b + 2);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  return geometry;
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
