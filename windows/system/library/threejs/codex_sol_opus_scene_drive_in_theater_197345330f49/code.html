let seed = 19560714;
function random() {
  seed |= 0;
  seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function range(a, b) {
  return a + (b - a) * random();
}
function pick(array) {
  return array[Math.floor(random() * array.length)];
}

function mat(color, roughness = 0.65, metalness = 0) {

function emissiveMat(color, intensity = 2) {

function mesh(geometry, material, parent = scene) {

}
function box(parent, size, position, material, cast = true, receive = true) {

  object.castShadow = cast;
  object.receiveShadow = receive;
  return object;
}

    parent
  );
  object.position.set(position[0], position[1], position[2]);
  object.castShadow = true;
  object.receiveShadow = true;
  return object;
}
function makeCanvasTexture(width, height, draw) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const context = canvas.getContext('2d');
  draw(context, width, height);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return { canvas, context, texture };
}

    depthWrite: false,
    uniforms: skyUniforms,

      varying vec3 vWorld;
      void main() {
        vec4 world = modelMatrix * vec4(position, 1.0);
        vWorld = normalize(world.xyz);
        gl_Position = projectionMatrix * viewMatrix * world;
      }
    `,
    fragmentShader: `
      varying vec3 vWorld;
      uniform vec3 topColor;
      uniform vec3 horizonColor;
      uniform vec3 glowColor;
      void main() {
        float h = smoothstep(-0.2, 0.8, vWorld.y);
        float horizon = pow(1.0 - abs(vWorld.y), 7.0);
        vec3 color = mix(horizonColor, topColor, h);
        color += glowColor * horizon * 0.18;

);

    Math.cos(theta) * radiusXZ * radius,
    y * radius,
    Math.sin(theta) * radiusXZ * radius
  );

  starColors.push(
    0.72 + warmth * 0.28,
    0.76 + warmth * 0.20,
    0.88 + warmth * 0.12
  );
}

  ctx.fillStyle = gradient;
  ctx.beginPath();

  for (let i = 0; i < 45; i++) {

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
});

function createHillLayer(z, baseY, color, amplitude, count) {
  const points = [];
  for (let i = 0; i <= count; i++) {
    const x = -105 + i * (210 / count);
    const y =
      baseY +
      Math.sin(i * 0.67 + z) * amplitude * 0.3 +
      Math.sin(i * 0.23 + 2.1) * amplitude * 0.5 +
      range(-amplitude * 0.25, amplitude * 0.25);
    points.push(new THREE.Vector2(x, y));
  }
  const shape = new THREE.Shape();
  shape.moveTo(-110, -8);
  for (const point of points) {
    shape.lineTo(point.x, point.y);
  }
  shape.lineTo(110, -8);
  shape.closePath();
  const hill = mesh(
    new THREE.ShapeGeometry(shape),
    new THREE.MeshBasicMaterial({
      color,
      fog: true,
      side: THREE.DoubleSide
    })
  );
  hill.position.z = z;
  return hill;
}

function drawFilm(time) {
  const ctx = film.context;
  const w = film.canvas.width;
  const h = film.canvas.height;
  const gradient = ctx.createLinearGradient(0, 0, w, h);
  gradient.addColorStop(0, '#203f5e');
  gradient.addColorStop(0.45, '#b43f67');
  gradient.addColorStop(1, '#edaa54');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, w, h);

  ctx.save();
  ctx.translate(w / 2, h / 2);
  ctx.rotate(Math.sin(time * 0.32) * 0.18);
  for (let i = 0; i < 8; i++) {
    const phase = time * (0.35 + i * 0.035) + i * 1.9;
    const x = Math.sin(phase) * (160 + i * 18);
    const y = Math.cos(phase * 1.3) * (55 + i * 5);
    const radius = 42 + i * 13 + Math.sin(time + i) * 8;
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = pickFilmColor(i);
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'screen';
  ctx.strokeStyle = 'rgba(255,236,181,0.72)';
  ctx.lineWidth = 10;
  ctx.beginPath();
  for (let x = -520; x <= 520; x += 8) {
    const y =
      Math.sin(x * 0.015 + time * 1.1) * 55 +
      Math.sin(x * 0.034 - time * 0.6) * 24;
    if (x === -520) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.restore();

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 0.12;
  for (let i = 0; i < 90; i++) {
    const x = (i * 107 + time * 21) % w;
    const y = (i * 53) % h;
    ctx.fillStyle = i % 3 ? '#ffffff' : '#172533';
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.globalAlpha = 1;
  film.texture.needsUpdate = true;
}

    '#f4eee0',
    '#724d9b',
    '#ef753d',
    '#72d6c2',
    '#213e74'
  ][i % 8];
}

function createCar(x, z, color, scale = 1, angle = 0) {
  const car = new THREE.Group();
  car.position.set(x, 0, z);
  car.rotation.y = angle;
  car.scale.setScalar(scale);
  scene.add(car);

  const paint = new THREE.MeshPhysicalMaterial({

    roughness: 0.28,
    metalness: 0.52,

    clearcoatRoughness: 0.2
  });
  box(car, [3.25, 0.72, 5.5], [0, 1.02, 0], paint);

  box(car, [2.75, 0.62, 2.5], [0, 1.72, 0.25], interior);

  const roof = box(car, [2.7, 0.18, 2.45], [0, 2.38, 0.16], paint);
  roof.scale.x = 0.92;

  const windshieldFront = box(
    car,
    [2.48, 0.72, 0.08],
    [0, 2.0, -1.12],
    glass,
    false,
    false
  );
  windshieldFront.rotation.x = -0.18;
  const windshieldRear = box(
    car,
    [2.48, 0.68, 0.08],
    [0, 2.0, 1.37],
    glass,
    false,
    false
  );
  windshieldRear.rotation.x = 0.2;

  box(car, [3.34, 0.16, 0.18], [0, 0.91, -2.86], chrome);
  box(car, [3.34, 0.16, 0.18], [0, 0.91, 2.86], chrome);
  box(car, [0.14, 0.14, 5.45], [-1.65, 1.12, 0], chrome);
  box(car, [0.14, 0.14, 5.45], [1.65, 1.12, 0], chrome);

  for (const side of [-1, 1]) {
    createWheel(car, side * 1.66, -1.65);
    createWheel(car, side * 1.66, 1.63);

    const finShape = new THREE.Shape();
    finShape.moveTo(0, 0);
    finShape.lineTo(0, 1.28);
    finShape.lineTo(1.62, 0.35);
    finShape.lineTo(1.62, 0);
    finShape.closePath();
    const fin = mesh(
      new THREE.ExtrudeGeometry(finShape, {
        depth: 0.12,
        bevelEnabled: false
      }),
      paint,
      car
    );
    fin.rotation.y = side > 0 ? Math.PI / 2 : -Math.PI / 2;
    fin.position.set(side * 1.63, 1.3, 1.18);
    fin.castShadow = true;

    const headlamp = mesh(
      new THREE.SphereGeometry(0.25, 14, 10),
      emissiveMat(0xffefc0, 1.9),
      car
    );
    headlamp.scale.z = 0.45;
    headlamp.position.set(side * 0.9, 1.22, -2.86);

    const tail = box(
      car,
      [0.38, 0.26, 0.1],
      [side * 1.13, 1.32, 2.93],
      emissiveMat(0xff274f, 2.2)
    );
    animations.push((time) => {
      tail.material.emissiveIntensity =
        1.9 + Math.sin(time * 1.2 + x + z) * 0.25;
    });
  }

  return car;
}

function tubeBetween(parent, points, radius, material) {
  const curve = new THREE.CatmullRomCurve3(points);
  return mesh(
    new THREE.TubeGeometry(curve, 48, radius, 7, false),
    material,
    parent
  );
}
function createStringLights(points, bulbCount) {
  const group = new THREE.Group();
  scene.add(group);
  tubeBetween(group, points, 0.025, mat(0x15151b, 0.7, 0.4));
  const curve = new THREE.CatmullRomCurve3(points);
  for (let i = 0; i < bulbCount; i++) {
    const t = (i + 0.5) / bulbCount;
    const point = curve.getPoint(t);
    const color = [
      0xff5976,
      0xffd46d,
      0x6fe5ff,
      0xb67aff
    ][i % 4];
    const bulb = mesh(
      new THREE.SphereGeometry(0.16, 10, 8),
      emissiveMat(color, 4),
      group
    );
    bulb.position.copy(point);
    const drop = cylinder(
      group,
      0.018,
      0.018,
      0.33,
      [point.x, point.y + 0.14, point.z],
      frameDark,
      6
    );
    animations.push((time) => {
      bulb.material.emissiveIntensity =
        3.2 + Math.sin(time * 2.1 + i * 0.7) * 0.65;
    });
  }
}
