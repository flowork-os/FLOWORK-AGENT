<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gem Pendant Necklace</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080510;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080510);
scene.fog = new THREE.Fog(0x080510, 7, 14);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.35, 7.1);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 4.3;
controls.maxDistance = 10;
controls.target.set(0, 0.35, 0);

const necklace = new THREE.Group();
scene.add(necklace);

const gold = new THREE.MeshStandardMaterial({
  color: 0xd2a64b,
  metalness: 0.9,
  roughness: 0.2
});

const darkGold = new THREE.MeshStandardMaterial({
  color: 0x8e5e20,
  metalness: 0.88,
  roughness: 0.24
});

const amethyst = new THREE.MeshStandardMaterial({
  color: 0x6334b3,
  emissive: 0x210b48,
  emissiveIntensity: 0.34,
  metalness: 0.1,
  roughness: 0.18,
  flatShading: true
});

const amethystEdge = new THREE.MeshStandardMaterial({
  color: 0x9b65e6,
  emissive: 0x2b0b5f,
  emissiveIntensity: 0.25,
  metalness: 0.05,
  roughness: 0.22,
  flatShading: true
});

const clearGem = new THREE.MeshPhysicalMaterial({
  color: 0xeaf4ff,
  emissive: 0x182846,
  emissiveIntensity: 0.12,
  metalness: 0.04,
  roughness: 0.08,
  clearcoat: 1,
  clearcoatRoughness: 0.04,
  flatShading: true
});

function makeTeardrop() {
  const segments = 14;
  const rings = [
    { y: 0.73, r: 0.20 },
    { y: 0.56, r: 0.47 },
    { y: 0.18, r: 0.64 },
    { y: -0.24, r: 0.61 },
    { y: -0.64, r: 0.46 },
    { y: -0.98, r: 0.27 },
    { y: -1.22, r: 0.08 }
  ];
  const vertices = [];
  const indices = [];
  vertices.push(0, 0.84, 0);
  for (const ring of rings) {
    for (let i = 0; i < segments; i++) {
      const angle = (i / segments) * Math.PI * 2;
      vertices.push(Math.cos(angle) * ring.r, ring.y, Math.sin(angle) * ring.r);
    }
  }
  const bottomIndex = vertices.length / 3;
  vertices.push(0, -1.34, 0);

  for (let i = 0; i < segments; i++) {
    const next = (i + 1) % segments;
    indices.push(0, 1 + next, 1 + i);
  }

  for (let r = 0; r < rings.length - 1; r++) {
    const startA = 1 + r * segments;
    const startB = startA + segments;
    for (let i = 0; i < segments; i++) {
      const next = (i + 1) % segments;
      indices.push(startA + i, startB + i, startB + next);
      indices.push(startA + i, startB + next, startA + next);
    }
  }

  const finalStart = 1 + (rings.length - 1) * segments;
  for (let i = 0; i < segments; i++) {
    const next = (i + 1) % segments;
    indices.push(finalStart + i, bottomIndex, finalStart + next);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const gemstone = new THREE.Mesh(makeTeardrop(), amethyst);
gemstone.position.set(0, -0.03, 0.08);
gemstone.scale.set(1, 1, 0.72);
gemstone.castShadow = true;
gemstone.receiveShadow = true;
necklace.add(gemstone);

const innerFacet = new THREE.Mesh(makeTeardrop(), amethystEdge);
innerFacet.position.set(0, -0.01, 0.36);
innerFacet.scale.set(0.79, 0.79, 0.32);
innerFacet.rotation.y = 0.18;
necklace.add(innerFacet);

const bezel = new THREE.Mesh(
  new THREE.TorusGeometry(0.77, 0.075, 8, 28),
  darkGold
);
bezel.scale.set(1, 1.2, 1);
bezel.position.set(0, -0.05, -0.15);
bezel.rotation.x = 0;
bezel.castShadow = true;
necklace.add(bezel);

const haloCount = 20;
for (let i = 0; i < haloCount; i++) {
  const angle = (i / haloCount) * Math.PI * 2;
  const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.105, 1), clearGem);
  gem.position.set(
    Math.cos(angle) * 0.86,
    -0.04 + Math.sin(angle) * 1.06,
    0.31
  );
  gem.scale.set(1, 1, 0.7);
  gem.rotation.set(angle * 0.7, angle * 1.2, angle);
  gem.castShadow = true;
  necklace.add(gem);
}

const bail = new THREE.Mesh(
  new THREE.TorusGeometry(0.19, 0.055, 8, 16),
  gold
);
bail.position.set(0, 0.89, 0.03);
bail.scale.set(0.75, 1.2, 1);
bail.rotation.x = 0;
bail.castShadow = true;
necklace.add(bail);

const chainPoints = [];
const chainCount = 27;
for (let i = 0; i < chainCount; i++) {
  const t = i / (chainCount - 1);
  const x = -2.85 + t * 5.7;
  const y = 0.98 + Math.pow(Math.abs(t - 0.5) * 2, 1.65) * 1.42;
  chainPoints.push(new THREE.Vector3(x, y, -0.02));
}

for (let i = 0; i < chainPoints.length; i++) {
  const point = chainPoints[i];
  const previous = chainPoints[Math.max(0, i - 1)];
  const next = chainPoints[Math.min(chainPoints.length - 1, i + 1)];
  const tangent = new THREE.Vector2(next.x - previous.x, next.y - previous.y).normalize();
  const angle = Math.atan2(tangent.y, tangent.x);

  const link = new THREE.Mesh(
    new THREE.TorusGeometry(0.13, 0.038, 6, 10),
    i % 3 === 0 ? gold : darkGold
  );
  link.position.copy(point);
  link.scale.set(0.72, 1.18, 0.74);
  link.rotation.z = angle - Math.PI / 2;
  link.rotation.x = (i % 2) * 0.42;
  link.rotation.y = ((i + 1) % 2) * 0.3;
  link.castShadow = true;
  necklace.add(link);
}

const sparkleCount = 34;
const sparkleMaterial = new THREE.MeshBasicMaterial({
  color: 0xd7b8ff,
  transparent: true,
  opacity: 0.75
});
for (let i = 0; i < sparkleCount; i++) {
  const a = i * 2.399963;
  const radius = 0.35 + (i % 7) * 0.065;
  const sparkle = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.018 + (i % 3) * 0.008, 0),
    sparkleMaterial
  );
  sparkle.position.set(
    Math.cos(a) * radius * 0.75,
    -0.15 + Math.sin(a) * radius,
    0.58 + (i % 4) * 0.035
  );
  sparkle.rotation.set(a, a * 0.7, a * 1.4);
  necklace.add(sparkle);
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(5, 64),
  new THREE.MeshStandardMaterial({
    color: 0x10091d,
    metalness: 0.1,
    roughness: 0.72
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.25;
floor.receiveShadow = true;
scene.add(floor);

const ambient = new THREE.HemisphereLight(0x9e83d1, 0x09050d, 1.4);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffe5bb, 3.3);
keyLight.position.set(-3.5, 5.5, 5.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.left = -4;
keyLight.shadow.camera.right = 4;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -3;
scene.add(keyLight);

const violetLight = new THREE.PointLight(0x6e2dff, 8, 6, 2);
violetLight.position.set(0, -0.3, 2.2);
scene.add(violetLight);

const rimLight = new THREE.PointLight(0x8ea9ff, 5, 7, 2);
rimLight.position.set(3.5, 2.7, 1.8);
scene.add(rimLight);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
