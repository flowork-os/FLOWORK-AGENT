<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glowing Deep Lanternfish</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #010817; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x010817);
scene.fog = new THREE.FogExp2(0x010817, 0.045);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(7.2, 3.2, 8.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.42;
controls.minDistance = 5;
controls.maxDistance = 14;
controls.target.set(0, 0.65, 0);

scene.add(new THREE.HemisphereLight(0x132d55, 0x01030c, 0.55));

const keyLight = new THREE.DirectionalLight(0x557eae, 0.75);
keyLight.position.set(-4, 7, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
scene.add(keyLight);

const fish = new THREE.Group();
fish.rotation.y = -0.12;
scene.add(fish);

const centerline = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-3.75, -0.12, 0),
  new THREE.Vector3(-3.15, 0.58, 0),
  new THREE.Vector3(-2.45, 1.20, 0),
  new THREE.Vector3(-1.35, 1.67, 0),
  new THREE.Vector3(-0.10, 1.73, 0),
  new THREE.Vector3(1.10, 1.34, 0),
  new THREE.Vector3(2.08, 0.67, 0),
  new THREE.Vector3(2.56, 0.05, 0)
], false, "catmullrom", 0.35);

function makeBodyGeometry(curve, segments, radialSegments) {
  const positions = [];
  const normals = [];
  const uvs = [];
  const indices = [];

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const point = curve.getPointAt(t);
    const tangent = curve.getTangentAt(t).normalize();
    const zAxis = new THREE.Vector3(0, 0, 1);
    const side = tangent.clone().cross(zAxis).normalize();
    const radius = 0.055 + 0.34 * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.72)), 0.52) + 0.045 * Math.exp(-Math.pow((t - 0.92) / 0.12, 2));

    for (let j = 0; j <= radialSegments; j++) {
      const a = (j / radialSegments) * Math.PI * 2;
      const radial = side.clone().multiplyScalar(Math.cos(a)).add(zAxis.clone().multiplyScalar(Math.sin(a)));
      const vertex = point.clone().add(radial.multiplyScalar(radius));
      positions.push(vertex.x, vertex.y, vertex.z);
      normals.push(radial.x, radial.y, radial.z);
      uvs.push(t, j / radialSegments);
    }
  }

  for (let i = 0; i < segments; i++) {
    for (let j = 0; j < radialSegments; j++) {
      const a = i * (radialSegments + 1) + j;
      const b = a + radialSegments + 1;
      indices.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
  geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeBoundingSphere();
  return geometry;
}

const bodyMaterial = new THREE.MeshStandardMaterial({
  color: 0x071326,
  roughness: 0.92,
  metalness: 0.03,
  emissive: 0x020916,
  emissiveIntensity: 0.35
});

const body = new THREE.Mesh(makeBodyGeometry(centerline, 72, 18), bodyMaterial);
body.castShadow = true;
body.receiveShadow = true;
fish.add(body);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.49, 32, 20),
  new THREE.MeshStandardMaterial({
    color: 0x08152a,
    roughness: 0.88,
    emissive: 0x020916,
    emissiveIntensity: 0.28
  })
);
head.position.set(2.48, 0.04, 0);
head.scale.set(1.18, 0.9, 0.9);
head.castShadow = true;
fish.add(head);

const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0xeaffff });
const eyeGlowMaterial = new THREE.MeshBasicMaterial({
  color: 0x43faff,
  transparent: true,
  opacity: 0.16,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

for (const z of [0.34, -0.34]) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.075, 16, 10), eyeMaterial);
  eye.position.set(2.73, 0.16, z);
  fish.add(eye);

  const eyeGlow = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 10), eyeGlowMaterial);
  eyeGlow.position.copy(eye.position);
  fish.add(eyeGlow);
}

function finGeometry(points) {
  const geometry = new THREE.BufferGeometry();
  const vertices = [];
  const normals = [];
  const uvs = [];
  for (const p of points) {
    vertices.push(p[0], p[1], p[2]);
    normals.push(0, 0, 1);
    uvs.push(p[0], p[1]);
  }
  const indices = [];
  for (let i = 1; i < points.length - 1; i++) indices.push(0, i, i + 1);
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
  geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  return geometry;
}

const finMaterial = new THREE.MeshStandardMaterial({
  color: 0x102849,
  roughness: 0.72,
  metalness: 0.08,
  transparent: true,
  opacity: 0.7,
  side: THREE.DoubleSide,
  emissive: 0x09244a,
  emissiveIntensity: 0.45
});

const dorsal = new THREE.Mesh(finGeometry([
  [-1.45, 1.78, 0.02], [-0.86, 2.46, 0.03], [-0.42, 1.82, 0.02],
  [0.16, 2.28, 0.03], [0.73, 1.50, 0.02]
]), finMaterial);
fish.add(dorsal);

const lowerFin = new THREE.Mesh(finGeometry([
  [0.48, 1.18, -0.02], [0.05, 0.25, -0.03], [0.62, 0.94, -0.02],
  [1.12, 0.69, -0.02], [1.35, 0.82, -0.02]
]), finMaterial);
lowerFin.rotation.z = Math.PI;
fish.add(lowerFin);

const pectoralMaterial = new THREE.MeshStandardMaterial({
  color: 0x173258,
  transparent: true,
  opacity: 0.72,
  side: THREE.DoubleSide,
  roughness: 0.65,
  emissive: 0x0a315b,
  emissiveIntensity: 0.5
});

const pectoral = new THREE.Mesh(finGeometry([
  [1.45, 0.54, 0.27], [0.36, -0.25, 1.25], [1.80, 0.22, 0.37],
  [2.02, 0.48, 0.22]
]), pectoralMaterial);
fish.add(pectoral);

const tailFin = new THREE.Mesh(finGeometry([
  [-3.62, 0.03, 0.02], [-4.50, 0.76, 0.03], [-3.84, -0.04, 0.03],
  [-4.46, -0.77, 0.03]
]), finMaterial);
fish.add(tailFin);

const glowCoreMaterial = new THREE.MeshBasicMaterial({
  color: 0xdfffff,
  transparent: true,
  opacity: 0.98,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const glowHaloMaterial = new THREE.MeshBasicMaterial({
  color: 0x28eaff,
  transparent: true,
  opacity: 0.13,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

function addPhotophore(position, scale, lightPower) {
  const halo = new THREE.Mesh(new THREE.SphereGeometry(0.19 * scale, 12, 8), glowHaloMaterial);
  halo.position.copy(position);
  fish.add(halo);

  const core = new THREE.Mesh(new THREE.SphereGeometry(0.048 * scale, 14, 10), glowCoreMaterial);
  core.position.copy(position);
  fish.add(core);

  const light = new THREE.PointLight(0x73faff, lightPower, 1.8 * scale, 2.1);
  light.position.copy(position);
  fish.add(light);
}

for (let row = 0; row < 4; row++) {
  const count = row === 0 ? 13 : 11;
  for (let i = 0; i < count; i++) {
    const t = 0.16 + (i / (count - 1)) * 0.70;
    const p = centerline.getPointAt(t);
    const tangent = centerline.getTangentAt(t).normalize();
    const flank = tangent.clone().cross(new THREE.Vector3(0, 0, 1)).normalize();
    const zOffset = 0.27 + row * 0.055;
    const position = p.add(flank.multiplyScalar(0.015)).add(new THREE.Vector3(0, 0, zOffset));
    addPhotophore(position, 0.82 + 0.14 * Math.sin(i * 1.7 + row), row === 0 ? 0.34 : 0.22);
  }
}

const filamentCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(2.43, 0.38, 0.03),
  new THREE.Vector3(2.70, 0.78, 0.03),
  new THREE.Vector3(2.88, 1.15, 0.03),
  new THREE.Vector3(2.70, 1.48, 0.03),
  new THREE.Vector3(2.42, 1.67, 0.03)
]);

const filament = new THREE.Mesh(
  new THREE.TubeGeometry(filamentCurve, 28, 0.026, 8, false),
  new THREE.MeshStandardMaterial({
    color: 0x102b4b,
    roughness: 0.62,
    emissive: 0x0b5274,
    emissiveIntensity: 1.5
  })
);
fish.add(filament);

const lurePosition = new THREE.Vector3(2.38, 1.70, 0.03);
const lureHalo = new THREE.Mesh(new THREE.SphereGeometry(0.34, 20, 14), glowHaloMaterial);
lureHalo.position.copy(lurePosition);
fish.add(lureHalo);

const lure = new THREE.Mesh(new THREE.SphereGeometry(0.13, 24, 16), glowCoreMaterial);
lure.position.copy(lurePosition);
lure.scale.set(1.15, 1.35, 1.15);
fish.add(lure);

const lureLight = new THREE.PointLight(0x72faff, 3.6, 5.2, 1.8);
lureLight.position.copy(lurePosition);
lureLight.castShadow = true;
fish.add(lureLight);

const tailPoint = centerline.getPointAt(0.015).add(new THREE.Vector3(-0.03, 0.03, 0.04));
const tailHalo = new THREE.Mesh(new THREE.SphereGeometry(0.38, 20, 14), glowHaloMaterial);
tailHalo.position.copy(tailPoint);
fish.add(tailHalo);

const tailLight = new THREE.PointLight(0x42eaff, 1.9, 3.5, 2);
tailLight.position.copy(tailPoint);
fish.add(tailLight);

const particleMaterial = new THREE.PointsMaterial({
  color: 0x164b78,
  size: 0.025,
  transparent: true,
  opacity: 0.55,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const particlePositions = [];
for (let i = 0; i < 280; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = 3.2 + Math.random() * 4.5;
  particlePositions.push(
    Math.cos(angle) * radius,
    (Math.random() - 0.5) * 5.5,
    Math.sin(angle) * radius
  );
}
const particlesGeometry = new THREE.BufferGeometry();
particlesGeometry.setAttribute("position", new THREE.Float32BufferAttribute(particlePositions, 3));
scene.add(new THREE.Points(particlesGeometry, particleMaterial));

function animate() {
  requestAnimationFrame(animate);
  const pulse = 1 + Math.sin(performance.now() * 0.004) * 0.08;
  lure.scale.set(1.15 * pulse, 1.35 * pulse, 1.15 * pulse);
  lureLight.intensity = 3.25 + Math.sin(performance.now() * 0.004) * 0.35;
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
