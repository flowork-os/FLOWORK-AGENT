<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Deco Desk Fan</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05080e;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05080e);
scene.fog = new THREE.Fog(0x05080e, 15, 28);

const camera = new THREE.PerspectiveCamera(
  42,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.set(7.3, 5.1, 9.2);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.065;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 6.2;
controls.maxDistance = 15;
controls.target.set(0, 2.45, 0.15);

const blackBakelite = new THREE.MeshPhysicalMaterial({
  color: 0x080b10,
  metalness: 0.25,
  roughness: 0.2,
  clearcoat: 0.75,
  clearcoatRoughness: 0.16
});

const bakeliteEdge = new THREE.MeshStandardMaterial({
  color: 0x171b22,
  metalness: 0.35,
  roughness: 0.28
});

const ivory = new THREE.MeshPhysicalMaterial({
  color: 0xe8dcc0,
  metalness: 0.08,
  roughness: 0.24,
  clearcoat: 0.4
});

const gold = new THREE.MeshPhysicalMaterial({
  color: 0xc89535,
  metalness: 0.92,
  roughness: 0.2,
  clearcoat: 0.65,
  clearcoatRoughness: 0.12
});

const brightGold = new THREE.MeshPhysicalMaterial({
  color: 0xf2c766,
  metalness: 0.95,
  roughness: 0.14,
  clearcoat: 0.8,
  clearcoatRoughness: 0.08
});

const chrome = new THREE.MeshPhysicalMaterial({
  color: 0xaab7bf,
  metalness: 1,
  roughness: 0.13,
  clearcoat: 0.8,
  clearcoatRoughness: 0.1
});

const nickel = new THREE.MeshPhysicalMaterial({
  color: 0x89959b,
  metalness: 0.96,
  roughness: 0.3,
  clearcoat: 0.42,
  clearcoatRoughness: 0.2
});

const aluminum = new THREE.MeshPhysicalMaterial({
  color: 0xc8d2d5,
  metalness: 0.98,
  roughness: 0.18,
  clearcoat: 0.72,
  clearcoatRoughness: 0.12
});

const darkMetal = new THREE.MeshStandardMaterial({
  color: 0x252c32,
  metalness: 0.9,
  roughness: 0.29
});

function boxMesh(width, height, depth, material, x, y, z, rx = 0, ry = 0, rz = 0) {
  const geometry = new THREE.BoxGeometry(width, height, depth);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  mesh.rotation.set(rx, ry, rz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function cylinderMesh(
  radiusTop,
  radiusBottom,
  height,
  radialSegments,
  material,
  x,
  y,
  z,
  rx = 0,
  ry = 0,
  rz = 0
) {
  const geometry = new THREE.CylinderGeometry(
    radiusTop,
    radiusBottom,
    height,
    radialSegments
  );
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  mesh.rotation.set(rx, ry, rz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function torusMesh(
  radius,
  tube,
  material,
  x,
  y,
  z,
  rx = 0,
  ry = 0,
  rz = 0
) {
  const geometry = new THREE.TorusGeometry(radius, tube, 12, 96);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  mesh.rotation.set(rx, ry, rz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function tubeBetween(start, end, radius, material, radialSegments = 8) {
  const curve = new THREE.LineCurve3(start.clone(), end.clone());
  const geometry = new THREE.TubeGeometry(
    curve,
    1,
    radius,
    radialSegments,
    false
  );
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function createBladeGeometry() {
  const points = [
    [0.22, -0.15],
    [0.88, -0.17],
    [1.46, -0.01],
    [1.86, 0.25],
    [1.60, 0.45],
    [1.02, 0.34],
    [0.38, 0.11]
  ];

  const thickness = 0.085;
  const positions = [];
  const indices = [];
  const pointCount = points.length;

  for (const point of points) {
    positions.push(point[0], point[1], thickness * 0.5);
  }

  for (const point of points) {
    positions.push(point[0], point[1], -thickness * 0.5);
  }

  for (let index = 1; index < pointCount - 1; index++) {
    indices.push(0, index, index + 1);
  }

  for (let index = 1; index < pointCount - 1; index++) {
    indices.push(pointCount, pointCount + index + 1, pointCount + index);
  }

  for (let index = 0; index < pointCount; index++) {
    const nextIndex = (index + 1) % pointCount;
    indices.push(index, pointCount + index, pointCount + nextIndex);
    indices.push(index, pointCount + nextIndex, nextIndex);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(positions, 3)
  );
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({
    color: 0x070b12,
    metalness: 0.15,
    roughness: 0.72
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.015;
floor.receiveShadow = true;
scene.add(floor);

const floorInlay = new THREE.Group();
floorInlay.add(torusMesh(3.65, 0.018, gold, 0, 0.018, 0, Math.PI / 2));
floorInlay.add(torusMesh(2.8, 0.012, darkMetal, 0, 0.022, 0, Math.PI / 2));
scene.add(floorInlay);

const base = new THREE.Group();
scene.add(base);

base.add(boxMesh(4.9, 0.24, 2.55, blackBakelite, 0, 0.14, 0));
base.add(boxMesh(4.65, 0.18, 2.38, brightGold, 0, 0.31, 0));
base.add(boxMesh(4.48, 0.34, 2.26, blackBakelite, 0, 0.53, 0));
base.add(boxMesh(4.02, 0.30, 2.02, bakeliteEdge, 0, 0.85, 0));
base.add(boxMesh(3.45, 0.30, 1.76, blackBakelite, 0, 1.14, 0));

base.add(boxMesh(4.48, 0.055, 0.055, brightGold, 0, 0.69, 1.16));
base.add(boxMesh(4.03, 0.055, 0.055, gold, 0, 1.00, 1.05));
base.add(boxMesh(3.46, 0.055, 0.055, brightGold, 0, 1.28, 0.92));

for (const side of [-1, 1]) {
  base.add(
    boxMesh(
      0.05,
      0.92,
      0.055,
      ivory,
      side * 1.38,
      0.83,
      1.165
    )
  );
}

function addChevron(group, centerX, centerY, length, angle) {
  group.add(
    boxMesh(
      length,
      0.082,
      0.045,
      ivory,
      centerX,
      centerY,
      1.185,
      0,
      0,
      angle
    )
  );
}

addChevron(base, -0.42, 0.74, 0.9, -0.58);
addChevron(base, 0.42, 0.74, 0.9, 0.58);
addChevron(base, -0.29, 0.99, 0.62, -0.58);
addChevron(base, 0.29, 0.99, 0.62, 0.58);

const support = new THREE.Group();
scene.add(support);

support.add(
  cylinderMesh(0.48, 0.72, 1.45, 8, blackBakelite, 0, 1.87, -0.02)
);
support.add(
  cylinderMesh(0.58, 0.58, 0.10, 48, gold, 0, 2.53, -0.02)
);
support.add(
  cylinderMesh(0.43, 0.43, 0.10, 48, brightGold, 0, 2.60, -0.02)
);
support.add(torusMesh(0.61, 0.052, gold, 0, 2.49, -0.02, Math.PI / 2));

for (const side of [-1, 1]) {
  support.add(
    boxMesh(
      0.11,
      1.24,
      0.82,
      blackBakelite,
      side * 0.44,
      1.88,
      -0.05
    )
  );
}

const fanY = 3.28;
const housing = new THREE.Group();
scene.add(housing);

const housingProfile = [
  new THREE.Vector2(0.04, -0.84),
  new THREE.Vector2(0.58, -0.82),
  new THREE.Vector2(0.78, -0.68),
  new THREE.Vector2(0.90, -0.40),
  new THREE.Vector2(0.94, 0.05),
  new THREE.Vector2(0.88, 0.40),
  new THREE.Vector2(0.70, 0.67),
  new THREE.Vector2(0.44, 0.82),
  new THREE.Vector2(0.08, 0.87)
];

const housingGeometry = new THREE.LatheGeometry(housingProfile, 64);
housingGeometry.rotateX(Math.PI / 2);
const housingMesh = new THREE.Mesh(housingGeometry, nickel);
housingMesh.position.set(0, fanY, -0.14);
housingMesh.castShadow = true;
housingMesh.receiveShadow = true;
housing.add(housingMesh);

housing.add(torusMesh(0.91, 0.075, gold, 0, fanY, -0.58));
housing.add(torusMesh(0.93, 0.065, brightGold, 0, fanY, 0.37));
housing.add(torusMesh(0.87, 0.035, darkMetal, 0, fanY, -0.69));

for (let index = 0; index < 18; index++) {
  const angle = (index / 18) * Math.PI * 2;
  const radius = 0.805;
  const flute = cylinderMesh(
    0.036,
    0.036,
    1.34,
    8,
    darkMetal,
    Math.cos(angle) * radius,
    fanY + Math.sin(angle) * radius,
    -0.14,
    Math.PI / 2
  );
  housing.add(flute);
}

const rotor = new THREE.Group();
rotor.position.set(0, fanY, 0.78);
scene.add(rotor);

const bladeGeometry = createBladeGeometry();

for (let index = 0; index < 4; index++) {
  const blade = new THREE.Mesh(bladeGeometry.clone(), aluminum);
  blade.rotation.z = index * Math.PI / 2;
  blade.castShadow = true;
  blade.receiveShadow = true;
  rotor.add(blade);
}

const rotorHub = new THREE.Mesh(
  new THREE.SphereGeometry(0.43, 40, 24),
  chrome
);
rotorHub.scale.set(1, 1, 0.68);
rotorHub.position.z = 0.15;
rotorHub.castShadow = true;
rotorHub.receiveShadow = true;
rotor.add(rotorHub);

const hubCollar = new THREE.Mesh(
  new THREE.CylinderGeometry(0.46, 0.39, 0.18, 48),
  gold
);
hubCollar.rotation.x = Math.PI / 2;
hubCollar.position.z = 0.08;
hubCollar.castShadow = true;
hubCollar.receiveShadow = true;
rotor.add(hubCollar);

const hubCap = new THREE.Mesh(
  new THREE.CylinderGeometry(0.27, 0.30, 0.16, 48),
  brightGold
);
hubCap.rotation.x = Math.PI / 2;
hubCap.position.z = 0.29;
hubCap.castShadow = true;
hubCap.receiveShadow = true;
rotor.add(hubCap);

const cage = new THREE.Group();
scene.add(cage);

const cageCenter = new THREE.Vector3(0, fanY, 1.06);
const outerRadius = 2.08;

cage.add(torusMesh(outerRadius, 0.075, chrome, 0, fanY, 1.08));
cage.add(torusMesh(outerRadius - 0.14, 0.026, brightGold, 0, fanY, 1.08));
cage.add(torusMesh(1.62, 0.024, chrome, 0, fanY, 1.07));
cage.add(torusMesh(0.94, 0.028, chrome, 0, fanY, 1.065));
cage.add(torusMesh(0.54, 0.038, brightGold, 0, fanY, 1.075));

for (let index = 0; index < 24; index++) {
  const angle = (index / 24) * Math.PI * 2;
  const end = new THREE.Vector3(
    Math.cos(angle) * (outerRadius - 0.08),
    fanY + Math.sin(angle) * (outerRadius - 0.08),
    1.095
  );
  cage.add(tubeBetween(cageCenter, end, 0.018, chrome, 6));
}

for (let index = 0; index < 12; index++) {
  const angle = (index / 12) * Math.PI * 2;
  const frontPoint = new THREE.Vector3(
    Math.cos(angle) * outerRadius,
    fanY + Math.sin(angle) * outerRadius,
    1.10
  );
  const rearPoint = new THREE.Vector3(
    Math.cos(angle) * outerRadius,
    fanY + Math.sin(angle) * outerRadius,
    0.90
  );
  cage.add(tubeBetween(rearPoint, frontPoint, 0.025, chrome, 6));
}

cage.add(torusMesh(outerRadius, 0.085, chrome, 0, fanY, 0.90));

const escutcheon = new THREE.Group();
scene.add(escutcheon);

const escutcheonBack = new THREE.Mesh(
  new THREE.CircleGeometry(0.46, 40, 0, Math.PI),
  gold
);
escutcheonBack.position.set(0, 1.21, 1.285);
escutcheonBack.castShadow = true;
escutcheonBack.receiveShadow = true;
escutcheon.add(escutcheonBack);

escutcheon.add(boxMesh(0.92, 0.20, 0.055, gold, 0, 1.21, 1.285));

const escutcheonInner = new THREE.Mesh(
  new THREE.CircleGeometry(0.36, 40, 0, Math.PI),
  blackBakelite
);
escutcheonInner.position.set(0, 1.22, 1.326);
escutcheon.add(escutcheonInner);

for (let index = 0; index < 18; index++) {
  const angle = (index / 18) * Math.PI;
  const start = new THREE.Vector3(
    Math.cos(angle) * 0.46,
    1.21 + Math.sin(angle) * 0.46,
    1.35
  );
  const end = new THREE.Vector3(
    Math.cos((index + 1) / 18 * Math.PI) * 0.46,
    1.21 + Math.sin((index + 1) / 18 * Math.PI) * 0.46,
    1.35
  );
  escutcheon.add(tubeBetween(start, end, 0.018, brightGold, 6));
}

escutcheon.add(boxMesh(0.91, 0.026, 0.038, brightGold, 0, 1.205, 1.35));

const lever = boxMesh(0.09, 0.34, 0.10, brightGold, 0.03, 1.38, 1.405, 0, 0, -0.22);
escutcheon.add(lever);

const leverKnob = new THREE.Mesh(
  new THREE.SphereGeometry(0.105, 24, 16),
  gold
);
leverKnob.scale.set(0.82, 1.15, 0.72);
leverKnob.position.set(0.068, 1.535, 1.42);
leverKnob.castShadow = true;
leverKnob.receiveShadow = true;
escutcheon.add(leverKnob);

const emblem = new THREE.Mesh(
  new THREE.CylinderGeometry(0.055, 0.055, 0.025, 32),
  ivory
);
emblem.rotation.x = Math.PI / 2;
emblem.position.set(0, 1.10, 1.40);
escutcheon.add(emblem);

const hemisphereLight = new THREE.HemisphereLight(0x9fb8d4, 0x05070c, 1.65);
scene.add(hemisphereLight);

const keyLight = new THREE.DirectionalLight(0xffe1b0, 4.1);
keyLight.position.set(5.5, 8.5, 7.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 25;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0x557db5, 22, 14, 2);
fillLight.position.set(-5, 4.5, 4.5);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xffb84d, 18, 12, 2);
rimLight.position.set(4.2, 3.2, -3.5);
scene.add(rimLight);

const frontLight = new THREE.SpotLight(0xf1f6ff, 34, 18, Math.PI / 5, 0.5, 1.4);
frontLight.position.set(0, 7.5, 8);
frontLight.target.position.set(0, 2.6, 0);
frontLight.castShadow = true;
frontLight.shadow.mapSize.set(1024, 1024);
scene.add(frontLight);
scene.add(frontLight.target);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  rotor.rotation.z -= delta * 2.8;
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
