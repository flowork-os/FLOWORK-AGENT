<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Standing Person</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #b9c6d0;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8c6d1);
scene.fog = new THREE.Fog(0xb8c6d1, 10, 24);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.4, 5.5, 9.5);
camera.lookAt(0, 3.1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.minDistance = 6;
controls.maxDistance = 15;
controls.minPolarAngle = Math.PI * 0.28;
controls.maxPolarAngle = Math.PI * 0.55;
controls.target.set(0, 3.15, 0);

scene.add(new THREE.HemisphereLight(0xeaf3ff, 0x65717b, 2.1));

const key = new THREE.DirectionalLight(0xfff5df, 3.7);
key.position.set(-5, 10, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 25;
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 10;
key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0005;
scene.add(key);

const fill = new THREE.DirectionalLight(0xa9c9ef, 1.25);
fill.position.set(6, 5, -5);
scene.add(fill);

const rim = new THREE.PointLight(0xd7e9ff, 24, 14, 2);
rim.position.set(2.5, 6.5, -4);
scene.add(rim);

const materials = {
  jacket: new THREE.MeshStandardMaterial({ color: 0x243b50, roughness: 0.74, metalness: 0.02 }),
  jacketTrim: new THREE.MeshStandardMaterial({ color: 0x182b3b, roughness: 0.8 }),
  denim: new THREE.MeshStandardMaterial({ color: 0x315a7d, roughness: 0.86 }),
  denimLight: new THREE.MeshStandardMaterial({ color: 0x42749b, roughness: 0.88 }),
  shoe: new THREE.MeshStandardMaterial({ color: 0xe8e6dc, roughness: 0.7 }),
  shoeDark: new THREE.MeshStandardMaterial({ color: 0x26313a, roughness: 0.8 }),
  skin: new THREE.MeshStandardMaterial({ color: 0xc98e6d, roughness: 0.82 }),
  skinLight: new THREE.MeshStandardMaterial({ color: 0xd6a07e, roughness: 0.8 }),
  hair: new THREE.MeshStandardMaterial({ color: 0x3b2924, roughness: 0.95 }),
  eye: new THREE.MeshStandardMaterial({ color: 0x18232a, roughness: 0.3 }),
  white: new THREE.MeshStandardMaterial({ color: 0xf4f1e9, roughness: 0.68 }),
  metal: new THREE.MeshStandardMaterial({ color: 0xb8c2c8, roughness: 0.34, metalness: 0.7 }),
  ground: new THREE.MeshStandardMaterial({ color: 0x8999a5, roughness: 0.92 })
};

function mesh(geometry, material, position, scale) {
  const object = new THREE.Mesh(geometry, material);
  if (position) object.position.set(...position);
  if (scale) object.scale.set(...scale);
  object.castShadow = true;
  object.receiveShadow = true;
  return object;
}

function roundedBox(w, h, d, r, material, position, scale = [1, 1, 1]) {
  return mesh(new RoundedBoxGeometry(w, h, d, 5, r), material, position, scale);
}

function capsule(radius, length, material, position, scale = [1, 1, 1]) {
  return mesh(new THREE.CapsuleGeometry(radius, length, 8, 16), material, position, scale);
}

function cylinderBetween(a, b, radius, material, radialSegments = 12) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const direction = end.clone().sub(start);
  const length = direction.length();
  const object = mesh(
    new THREE.CylinderGeometry(radius, radius * 0.96, length, radialSegments),
    material,
    start.clone().add(end).multiplyScalar(0.5)
  );
  object.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  return object;
}

const person = new THREE.Group();
person.position.y = 0.04;
scene.add(person);

// Shoes and soles
for (const side of [-1, 1]) {
  const x = side * 0.23;
  const shoe = roundedBox(0.48, 0.24, 0.98, 0.09, materials.shoe, [x, 0.18, 0.1], [1, 1, 1.05]);
  person.add(shoe);
  person.add(roundedBox(0.5, 0.095, 1.0, 0.04, materials.shoeDark, [x, 0.055, 0.1], [1, 1, 1.03]));
  person.add(roundedBox(0.38, 0.055, 0.72, 0.025, materials.white, [x, 0.302, 0.16]));
  person.add(cylinderBetween([x - 0.18, 0.28, 0.35], [x + 0.18, 0.28, 0.35], 0.018, materials.shoeDark, 8));
}

// Jeans legs
for (const side of [-1, 1]) {
  const x = side * 0.22;
  person.add(capsule(0.22, 1.32, materials.denim, [x, 1.14, 0]));
  person.add(capsule(0.205, 1.02, materials.denimLight, [x, 2.28, 0.005]));
  person.add(roundedBox(0.39, 0.11, 0.38, 0.045, materials.denim, [x, 2.76, 0]));
}

// Hip and jacket torso
person.add(roundedBox(1.22, 0.52, 0.62, 0.19, materials.jacket, [0, 3.03, 0]));
person.add(roundedBox(1.43, 1.67, 0.72, 0.22, materials.jacket, [0, 3.93, 0], [1, 1, 0.92]));
person.add(roundedBox(1.19, 0.18, 0.76, 0.07, materials.jacketTrim, [0, 3.15, 0.005]));

// Jacket center zip and hem
person.add(roundedBox(0.035, 1.36, 0.025, 0.012, materials.metal, [0, 3.98, -0.371]));
person.add(roundedBox(1.28, 0.045, 0.035, 0.015, materials.jacketTrim, [0, 3.17, -0.372]));

// Collar and shirt opening
const collarLeft = new THREE.Mesh(
  new THREE.CylinderGeometry(0.23, 0.28, 0.12, 4),
  materials.jacketTrim
);
collarLeft.position.set(-0.27, 4.78, -0.12);
collarLeft.rotation.set(0.15, 0, -0.3);
collarLeft.scale.set(1, 1, 0.55);
collarLeft.castShadow = true;
person.add(collarLeft);

const collarRight = collarLeft.clone();
collarRight.position.x = 0.27;
collarRight.rotation.z = 0.3;
person.add(collarRight);

person.add(roundedBox(0.3, 0.42, 0.04, 0.06, materials.white, [0, 4.62, -0.365], [1, 1, 0.65]));

// Pockets and buttons
for (const side of [-1, 1]) {
  person.add(roundedBox(0.32, 0.24, 0.025, 0.04, materials.jacketTrim, [side * 0.42, 3.55, -0.37], [1, 1, 0.7]));
}
for (let i = 0; i < 3; i++) {
  person.add(mesh(new THREE.SphereGeometry(0.045, 12, 8), materials.metal, [0, 3.62 + i * 0.36, -0.405]));
}

// Arms in a relaxed pose
for (const side of [-1, 1]) {
  const shoulder = [side * 0.77, 4.48, 0];
  const elbow = [side * 0.93, 3.72, 0.08];
  const wrist = [side * 0.86, 2.96, 0.15];

  person.add(capsule(0.245, 0.33, materials.jacket, shoulder));
  person.add(cylinderBetween(shoulder, elbow, 0.22, materials.jacket));
  person.add(mesh(new THREE.SphereGeometry(0.225, 16, 12), materials.jacket, elbow));
  person.add(cylinderBetween(elbow, wrist, 0.16, materials.jacketTrim));
  person.add(capsule(0.15, 0.15, materials.skin, wrist, [1, 0.95, 0.9]));
}

// Neck
person.add(capsule(0.19, 0.25, materials.skin, [0, 4.98, 0]));

// Head
person.add(capsule(0.43, 0.56, materials.skinLight, [0, 5.56, 0], [0.94, 1.1, 0.9]));

// Ears
for (const side of [-1, 1]) {
  person.add(mesh(new THREE.SphereGeometry(0.105, 14, 10), materials.skin, [side * 0.405, 5.58, 0]));
}

// Hair volume and fringe
person.add(mesh(new THREE.SphereGeometry(0.45, 24, 16), materials.hair, [0, 5.8, 0.015], [0.96, 0.74, 0.92]));
person.add(roundedBox(0.7, 0.19, 0.28, 0.08, materials.hair, [0, 5.91, -0.29], [1, 1, 0.7]));

// Face
for (const side of [-1, 1]) {
  person.add(mesh(new THREE.SphereGeometry(0.042, 12, 8), materials.eye, [side * 0.155, 5.65, -0.395]));
  person.add(roundedBox(0.13, 0.025, 0.025, 0.012, materials.hair, [side * 0.155, 5.75, -0.398], [1, 1, 0.5]));
}
person.add(mesh(new THREE.SphereGeometry(0.045, 12, 8), materials.skin, [0, 5.54, -0.425], [0.8, 0.8, 1.3]));
person.add(roundedBox(0.15, 0.028, 0.025, 0.013, materials.jacketTrim, [0, 5.39, -0.397], [1, 1, 0.55]));

// Ground
const ground = new THREE.Mesh(new THREE.CircleGeometry(8, 96), materials.ground);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

const platform = new THREE.Mesh(
  new THREE.CylinderGeometry(1.25, 1.35, 0.16, 64),
  new THREE.MeshStandardMaterial({ color: 0x667681, roughness: 0.82 })
);
platform.position.y = 0.0;
platform.receiveShadow = true;
platform.castShadow = true;
scene.add(platform);

const platformTop = new THREE.Mesh(
  new THREE.CylinderGeometry(1.16, 1.16, 0.018, 64),
  new THREE.MeshStandardMaterial({ color: 0x9ba9b0, roughness: 0.75 })
);
platformTop.position.y = 0.09;
platformTop.receiveShadow = true;
scene.add(platformTop);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  person.position.y = 0.04 + Math.sin(time * 1.6) * 0.004;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
