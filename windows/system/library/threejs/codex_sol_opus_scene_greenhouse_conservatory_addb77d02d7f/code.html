let seed = 824713;
function rnd() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a, b) {
  return a + (b - a) * rnd();
}
function choose(a) {
  return a[Math.floor(rnd() * a.length)];
}

const animatedLeaves = [];
const hangingBaskets = [];
const waterDrops = [];
const dustData = [];

function canvasTexture(size, painter, repeatX = 1, repeatY = 1) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  painter(ctx, size);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(repeatX, repeatY);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const brickTexture = canvasTexture(512, (ctx, s) => {
  ctx.fillStyle = '#a75f42';
  ctx.fillRect(0, 0, s, s);
  const rows = 8;
  const h = s / rows;
  for (let y = 0; y < rows; y++) {
    const offset = y % 2 ? -s / 8 : 0;
    for (let x = offset; x < s; x += s / 4) {
      const v = Math.floor(range(-16, 18));
      ctx.fillStyle = `rgb(${154 + v},${82 + v},${57 + v})`;
      ctx.fillRect(x + 3, y * h + 3, s / 4 - 6, h - 6);
      ctx.strokeStyle = 'rgba(75,40,28,.35)';
      ctx.strokeRect(x + 3, y * h + 3, s / 4 - 6, h - 6);
      for (let i = 0; i < 10; i++) {
        ctx.fillStyle = 'rgba(255,220,180,.045)';
        ctx.fillRect(
          x + range(5, s / 4 - 7),
          y * h + range(5, h - 7),
          3,
          2
        );
      }
    }
  }
}, 2, 12);

const soilTexture = canvasTexture(256, (ctx, s) => {
  ctx.fillStyle = '#332317';
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 1300; i++) {
    const c = Math.floor(range(35, 90));
    ctx.fillStyle = `rgba(${c},${c * .72},${c * .45},.65)`;
    ctx.fillRect(rnd() * s, rnd() * s, range(1, 4), range(1, 4));
  }
}, 3, 3);

const stoneTexture = canvasTexture(256, (ctx, s) => {
  ctx.fillStyle = '#8c8f7c';
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 1200; i++) {
    const a = range(.025, .12);
    ctx.fillStyle = rnd() > .5
      ? `rgba(255,255,235,${a})`
      : `rgba(32,45,35,${a})`;
    ctx.beginPath();
    ctx.arc(rnd() * s, rnd() * s, range(.5, 3), 0, Math.PI * 2);
    ctx.fill();
  }
}, 5, 5);

const leafTexture = canvasTexture(256, (ctx, s) => {
  const g = ctx.createLinearGradient(0, 0, s, s);
  g.addColorStop(0, '#355e2d');
  g.addColorStop(.5, '#7c9946');
  g.addColorStop(1, '#244a2e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  ctx.strokeStyle = 'rgba(220,235,145,.25)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, s);
  ctx.lineTo(s, 0);
  ctx.stroke();
  for (let i = 0; i < 18; i++) {
    ctx.lineWidth = 1;
    ctx.beginPath();
    const p = i / 18;
    ctx.moveTo(p * s, (1 - p) * s);
    ctx.lineTo(Math.min(s, p * s + 70), Math.min(s, (1 - p) * s + 45));
    ctx.stroke();
  }
});

const ironMat = new THREE.MeshStandardMaterial({

const darkIronMat = new THREE.MeshStandardMaterial({

});
const terracottaMat = new THREE.MeshStandardMaterial({

});
const oldTerracottaMat = new THREE.MeshStandardMaterial({

});

  }),

function shadow(mesh, cast = true, receive = true) {
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  return mesh;
}
function box(w, h, d, mat, x, y, z) {
  const m = shadow(new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    mat
  ));
  m.position.set(x, y, z);
  scene.add(m);
  return m;
}
function cylinder(rt, rb, h, seg, mat) {
  return shadow(new THREE.Mesh(
    new THREE.CylinderGeometry(rt, rb, h, seg),
    mat
  ));
}
function tubeBetween(a, b, radius, mat, segments = 8) {
  const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(.5);
  const len = a.distanceTo(b);
  const mesh = shadow(new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, len, segments),
    mat
  ));
  mesh.position.copy(mid);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    new THREE.Vector3().subVectors(b, a).normalize()
  );
  scene.add(mesh);
  return mesh;
}

const floor = shadow(new THREE.Mesh(
  new THREE.PlaneGeometry(34, 46),
  new THREE.MeshStandardMaterial({
    map: stoneTexture,
    color: 0x7d846d,
    roughness: 1

), false, true);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.03;
scene.add(floor);

const path = shadow(new THREE.Mesh(

  new THREE.MeshStandardMaterial({

    color: 0xd0926b,

path.rotation.x = -Math.PI / 2;
path.position.set(0, .015, 0);
scene.add(path);

for (const x of [-2.72, 2.72]) {
  box(.25, .16, 40, stoneMat, x, .06, 0);
}

const greenhouse = new THREE.Group();
scene.add(greenhouse);

const halfW = 12;
const halfL = 20;
const wallH = 6.2;
const crownH = 11.1;

for (const x of [-halfW, halfW]) {
  const glass = new THREE.Mesh(
    new THREE.PlaneGeometry(40, wallH),

  );
  glass.position.set(x, wallH / 2, 0);
  glass.rotation.y = Math.PI / 2;
  greenhouse.add(glass);
}
for (const z of [-halfL, halfL]) {

    new THREE.PlaneGeometry(24, wallH),

  );
  glass.position.set(0, wallH / 2, z);
  greenhouse.add(glass);
}

for (let z = -20; z <= 20.01; z += 4) {
  for (const x of [-12, 12]) {
    const post = cylinder(.09, .12, wallH, 8, ironMat);
    post.position.set(x, wallH / 2, z);
    greenhouse.add(post);
  }
  const leftRafter = tubeBetween(
    new THREE.Vector3(-12, wallH, z),
    new THREE.Vector3(0, crownH, z),
    .105,
    ironMat
  );
  const rightRafter = tubeBetween(
    new THREE.Vector3(0, crownH, z),
    new THREE.Vector3(12, wallH, z),
    .105,
    ironMat
  );
  greenhouse.add(leftRafter, rightRafter);
  const tie = tubeBetween(
    new THREE.Vector3(-12, wallH, z),
    new THREE.Vector3(12, wallH, z),
    .055,
    darkIronMat
  );
  greenhouse.add(tie);
}

for (const z of [-20, 20]) {
  for (let x = -12; x <= 12.01; x += 3) {
    const p = cylinder(.08, .1, wallH, 8, ironMat);
    p.position.set(x, wallH / 2, z);

  }

    new THREE.Vector3(-12, wallH, z),

  tubeBetween(
    new THREE.Vector3(0, crownH, z),
    new THREE.Vector3(12, wallH, z),
    .11,
    ironMat

}

for (const x of [-12, 0, 12]) {

    new THREE.Vector3(x, x === 0 ? crownH : wallH, -20),

}

for (const y of [0, 2.1, 4.15, 6.2]) {

      new THREE.Vector3(x, y, -20),

}

leftRoof.position.set(-6, (wallH + crownH) / 2, 0);

leftRoof.rotation.y = Math.PI / 2;

greenhouse.add(leftRoof);

const rightRoof = new THREE.Mesh(

rightRoof.position.set(6, (wallH + crownH) / 2, 0);
rightRoof.rotation.order = 'YXZ';

function ornament(x, z) {
  const group = new THREE.Group();
  const base = cylinder(.2, .28, .55, 10, ironMat);
  base.position.y = crownH + .25;
  group.add(base);
  const ball = shadow(new THREE.Mesh(

  const tip = cylinder(0, .13, .6, 8, brassMat);
  tip.position.y = crownH + 1.05;

}
ornament(0, -20);
ornament(0, 20);

function makeBench(x, z, length = 11) {
  const group = new THREE.Group();
  for (const dx of [-1.45, 1.45]) {
    for (const dz of [-length / 2 + .5, length / 2 - .5]) {
      const leg = cylinder(.08, .1, 1.55, 8, ironMat);
      leg.position.set(dx, .78, dz);
      group.add(leg);
    }
  }
  for (const y of [1.52, 2.35, 3.05]) {
    const width = y === 1.52 ? 3.3 : y === 2.35 ? 2.55 : 1.8;
    const shelf = shadow(new THREE.Mesh(
      new THREE.BoxGeometry(width, .11, length),
      woodMat
    ));
    shelf.position.y = y;
    group.add(shelf);
    for (const sx of [-1, 0, 1]) {
      const slat = shadow(new THREE.Mesh(
        new THREE.BoxGeometry(.08, .05, length),
        ironMat
      ));
      slat.position.set(sx * width * .42, y + .07, 0);
      group.add(slat);
    }
  }
  group.position.set(x, 0, z);
  scene.add(group);
  return group;
}

makeBench(-7, -11);
makeBench(7, -11);
makeBench(-7, 11);
makeBench(7, 11);

function pot(radius = .55, height = .75, mat = terracottaMat) {
  const group = new THREE.Group();
  const body = shadow(new THREE.Mesh(
    new THREE.CylinderGeometry(
      radius * 1.08,
      radius * .72,
      height,
      18,
      1,
      true
    ),
    mat
  ));
  body.position.y = height / 2;
  group.add(body);
  const rim = shadow(new THREE.Mesh(
    new THREE.TorusGeometry(radius, .09, 8, 20),
    mat
  ));
  rim.rotation.x = Math.PI / 2;
  rim.position.y = height * .9;
  group.add(rim);
  const dirt = new THREE.Mesh(
    new THREE.CircleGeometry(radius * .88, 18),
    soilMat
  );
  dirt.rotation.x = -Math.PI / 2;
  dirt.position.y = height * .91;
  group.add(dirt);
  return group;
}

function leafShape(length = 1.8, width = .42) {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(
    width * .65,
    length * .22,
    width * .62,
    length * .76,
    0,
    length
  );
  shape.bezierCurveTo(
    -width * .62,
    length * .76,
    -width * .65,
    length * .22,
    0,
    0
  );
  const geo = new THREE.ShapeGeometry(shape, 5);
  geo.translate(0, 0, 0);
  return geo;
}

function broadLeafPlant(scale = 1) {
  const group = new THREE.Group();
  const stemMat = new THREE.MeshStandardMaterial({
    color: 0x3f6536,
    roughness: .85
  });
  const count = Math.floor(range(6, 10));
  for (let i = 0; i < count; i++) {
    const angle = i / count * Math.PI * 2 + range(-.2, .2);
    const len = range(1.15, 1.8) * scale;
    const stem = cylinder(.025, .04, len * .8, 7, stemMat);
    stem.position.set(
      Math.cos(angle) * .18,
      len * .36,
      Math.sin(angle) * .18
    );
    stem.rotation.z = Math.sin(angle) * range(.25, .5);
    stem.rotation.x = Math.cos(angle) * range(.25, .5);
    group.add(stem);
    const pivot = new THREE.Group();
    pivot.position.set(
      Math.cos(angle) * len * .28,
      len * .62,
      Math.sin(angle) * len * .28
    );
    pivot.rotation.y = -angle + Math.PI / 2;
    pivot.rotation.z = range(-.25, .2);
    const leaf = shadow(new THREE.Mesh(
      leafShape(len, len * .32),
      choose(leafMats)
    ));
    leaf.rotation.x = -Math.PI / 2 + range(-.2, .15);
    leaf.position.y = 0;
    pivot.add(leaf);
    group.add(pivot);
    animatedLeaves.push({
      pivot,
      base: pivot.rotation.z,
      phase: range(0, Math.PI * 2),
      speed: range(.45, .8),
      amount: range(.025, .07)
    });
  }
  return group;
}

function palm(scale = 1) {
  const group = new THREE.Group();
  const trunk = cylinder(.12, .22, 2.4 * scale, 10, new THREE.MeshStandardMaterial({
    color: 0x725837,
    roughness: .95
  }));
  trunk.position.y = 1.2 * scale;
  group.add(trunk);
  for (let r = 0; r < 10; r++) {
    const angle = r / 10 * Math.PI * 2 + range(-.14, .14);
    const pivot = new THREE.Group();
    pivot.position.y = 2.32 * scale;
    pivot.rotation.y = angle;
    pivot.rotation.z = range(.5, .92);
    const rachis = cylinder(.025, .045, 2.5 * scale, 6, leafMats[2]);
    rachis.position.y = 1.12 * scale;
    pivot.add(rachis);
    for (let j = 1; j < 8; j++) {
      for (const side of [-1, 1]) {
        const blade = shadow(new THREE.Mesh(
          leafShape(.62 * scale, .10 * scale),
          choose(leafMats)
        ));
        blade.position.y = j * .27 * scale;
        blade.rotation.z = side * range(.82, 1.18);
        blade.rotation.y = side * range(.05, .2);
        pivot.add(blade);
      }
    }
    group.add(pivot);
    animatedLeaves.push({
      pivot,
      base: pivot.rotation.z,
      phase: range(0, 6.28),
      speed: range(.28, .52),
      amount: .035
    });
  }
  return group;
}

function fern(scale = 1) {
  const group = new THREE.Group();
  for (let i = 0; i < 12; i++) {
    const angle = i / 12 * Math.PI * 2 + range(-.1, .1);
    const pivot = new THREE.Group();
    pivot.rotation.y = angle;
    pivot.rotation.z = range(.62, 1.05);
    const stem = cylinder(.018, .035, 1.3 * scale, 6, leafMats[1]);
    stem.position.y = .6 * scale;
    pivot.add(stem);
    for (let j = 2; j < 10; j++) {
      const taper = 1 - j / 12;
      for (const side of [-1, 1]) {
        const leaflet = shadow(new THREE.Mesh(
          leafShape(.32 * taper * scale, .09 * scale),
          leafMats[1]
        ));
        leaflet.position.y = j * .12 * scale;
        leaflet.rotation.z = side * 1.08;
        pivot.add(leaflet);
      }
    }
    group.add(pivot);
    animatedLeaves.push({
      pivot,
      base: pivot.rotation.z,
      phase: range(0, 6.28),
      speed: range(.55, .9),
      amount: .045
    });
  }
  return group;
}

function placePlant(type, x, y, z, scale = 1, potScale = 1) {
  const group = new THREE.Group();
  const vessel = pot(.48 * potScale, .67 * potScale, rnd() > .2
    ? terracottaMat
    : oldTerracottaMat
  );
  group.add(vessel);
  const plant = type === 'palm'
    ? palm(scale)
    : type === 'fern'
      ? fern(scale)
      : broadLeafPlant(scale);
  plant.position.y = .62 * potScale;
  group.add(plant);
  group.position.set(x, y, z);
  group.rotation.y = range(0, Math.PI * 2);
  scene.add(group);
  return group;
}

for (const x of [-7, 7]) {
  for (const zBase of [-11, 11]) {
    for (let i = 0; i < 5; i++) {
      const z = zBase + (i - 2) * 2.05;
      placePlant(
        choose(['fern', 'broad', 'broad']),
        x + range(-.8, .8),
        1.56,
        z,
        range(.48, .68),
        range(.65, .82)
      );
    }
    for (let i = 0; i < 4; i++) {
      const z = zBase + (i - 1.5) * 2.55;
      placePlant(
        choose(['fern', 'broad']),
        x + range(-.45, .45),
        2.39,
        z,
        range(.36, .52),
        range(.5, .64)
      );
    }
  }
}

for (const [x, z, s] of [
  [-10, -16, .9],
  [10, -16, 1.05],
  [-10, 16, 1.05],
  [10, 16, .9],

for (const [x, z] of [

  placePlant('broad', x, 0, z, 1.1, 1.18);

function hangingBasket(x, z) {
  const group = new THREE.Group();
  const basket = new THREE.Mesh(
    new THREE.SphereGeometry(.72, 18, 10, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2),
    oldTerracottaMat
  );
  basket.scale.y = .62;
  group.add(basket);
  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(.7, .065, 7, 20),
    darkIronMat
  );
  rim.rotation.x = Math.PI / 2;
  group.add(rim);
  for (let i = 0; i < 8; i++) {
    const vine = new THREE.Group();
    vine.rotation.y = i / 8 * Math.PI * 2;
    for (let j = 0; j < 4; j++) {
      const leaf = shadow(new THREE.Mesh(
        leafShape(.55, .18),
        leafMats[(i + j) % leafMats.length]
      ));
      leaf.position.set(.35, -.35 - j * .35, 0);
      leaf.rotation.z = Math.PI + range(-.4, .4);
      vine.add(leaf);
    }
    group.add(vine);
  }
  group.position.set(x, 7.2, z);
  scene.add(group);
  for (const a of [0, Math.PI * 2 / 3, Math.PI * 4 / 3]) {
    tubeBetween(
      new THREE.Vector3(x + Math.cos(a) * .63, 7.25, z + Math.sin(a) * .63),
      new THREE.Vector3(x, 9.45, z),
      .012,
      darkIronMat,
      5
    );
  }
  hangingBaskets.push({
    group,
    phase: range(0, 6.28),
    baseX: group.rotation.x,
    baseZ: group.rotation.z
  });
}

for (const p of [
  [-8.6, -5],
  [8.5, -1],
  [-8.5, 5],
  [8.7, 9]
]) {
  hangingBasket(p[0], p[1]);
}

function createFountain() {
  const group = new THREE.Group();
  const plinth = cylinder(2.05, 2.2, .48, 32, stoneMat);
  plinth.position.y = .24;
  group.add(plinth);
  const basin = shadow(new THREE.Mesh(
    new THREE.CylinderGeometry(1.85, 1.65, .52, 32, 1, false),
    stoneMat
  ));
  basin.position.y = .66;
  group.add(basin);
  const water = new THREE.Mesh(
    new THREE.CylinderGeometry(1.58, 1.58, .055, 32),
    waterMat
  );
  water.position.y = .96;
  group.add(water);
  const columnBase = cylinder(.65, .82, .35, 20, stoneMat);
  columnBase.position.y = 1.1;
  group.add(columnBase);
  const column = cylinder(.32, .43, 1.65, 18, stoneMat);
  column.position.y = 1.98;
  group.add(column);
  const upper = shadow(new THREE.Mesh(
    new THREE.SphereGeometry(.58, 20, 14),
    stoneMat
  ));
  upper.scale.y = .42;
  upper.position.y = 2.82;
  group.add(upper);
  const finial = cylinder(.04, .18, .82, 12, brassMat);
  finial.position.y = 3.33;
  group.add(finial);
  const nozzle = new THREE.Mesh(
    new THREE.SphereGeometry(.13, 12, 8),
    brassMat
  );
  nozzle.position.y = 3.77;
  group.add(nozzle);
  scene.add(group);
}
createFountain();

const dropGeo = new THREE.SphereGeometry(.035, 6, 5);
for (let stream = 0; stream < 8; stream++) {
  const angle = stream / 8 * Math.PI * 2;
  for (let j = 0; j < 11; j++) {
    const drop = new THREE.Mesh(dropGeo, waterMat);
    scene.add(drop);
    waterDrops.push({
      mesh: drop,
      angle,
      offset: j / 11
    });
  }
}

function wateringCan(x, z) {
  const group = new THREE.Group();
  const body = cylinder(.6, .52, .85, 20, brassMat);
  body.position.y = .52;
  group.add(body);
  const top = cylinder(.43, .55, .2, 18, brassMat);
  top.position.y = 1.02;
  group.add(top);
  const spout = cylinder(.12, .22, 1.55, 12, brassMat);
  spout.position.set(.9, .72, 0);
  spout.rotation.z = -Math.PI / 2.7;
  group.add(spout);
  const rose = cylinder(.3, .12, .18, 16, brassMat);
  rose.position.set(1.55, 1.18, 0);
  rose.rotation.z = -Math.PI / 2.7;
  group.add(rose);
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-.45, .9, 0),
    new THREE.Vector3(-.85, 1.75, 0),
    new THREE.Vector3(.15, 2.05, 0),
    new THREE.Vector3(.48, 1.1, 0)
  ]);
  const handle = shadow(new THREE.Mesh(
    new THREE.TubeGeometry(curve, 24, .055, 8, false),
    darkIronMat
  ));
  group.add(handle);
  group.position.set(x, 0, z);
  group.rotation.y = -.42;
  scene.add(group);
}
wateringCan(3.85, 3.2);

function gardenTools() {
  const group = new THREE.Group();
  for (let i = 0; i < 3; i++) {
    const handle = cylinder(.045, .055, 3.15, 8, woodMat);
    handle.position.set(i * .42, 1.55, 0);
    handle.rotation.z = range(-.08, .08);
    group.add(handle);
    if (i === 0) {
      const spade = shadow(new THREE.Mesh(
        new THREE.CylinderGeometry(.08, .36, .72, 4),
        darkIronMat
      ));
      spade.position.set(i * .42, .25, 0);
      spade.rotation.y = Math.PI / 4;
      group.add(spade);
    } else if (i === 1) {
      const rakeBar = shadow(new THREE.Mesh(
        new THREE.BoxGeometry(.9, .12, .12),
        darkIronMat
      ));
      rakeBar.position.set(i * .42, .16, 0);
      group.add(rakeBar);
      for (let t = -3; t <= 3; t++) {
        const tooth = cylinder(.018, .018, .38, 5, darkIronMat);
        tooth.position.set(i * .42 + t * .12, .02, 0);
        group.add(tooth);
      }
    } else {
      const forkBar = shadow(new THREE.Mesh(
        new THREE.BoxGeometry(.58, .1, .1),
        darkIronMat
      ));
      forkBar.position.set(i * .42, .22, 0);
      group.add(forkBar);
      for (let t = -2; t <= 2; t++) {
        const tine = cylinder(.018, .025, .52, 5, darkIronMat);
        tine.position.set(i * .42 + t * .12, 0, 0);
        group.add(tine);
      }
    }
  }
  group.position.set(-10.8, 0, -7);
  group.rotation.z = -.13;
  scene.add(group);
}
gardenTools();

function woodenCrate(x, z) {
  const group = new THREE.Group();
  for (const y of [.18, .55, .92]) {
    for (const side of [-1, 1]) {
      const plank = shadow(new THREE.Mesh(
        new THREE.BoxGeometry(1.6, .18, .12),
        woodMat
      ));
      plank.position.set(0, y, side * .48);
      group.add(plank);
    }
    for (const side of [-1, 1]) {
      const plank = shadow(new THREE.Mesh(
        new THREE.BoxGeometry(.12, .18, 1.05),
        woodMat
      ));
      plank.position.set(side * .75, y, 0);
      group.add(plank);
    }
  }
  group.position.set(x, 0, z);
  group.rotation.y = range(-.35, .35);
  scene.add(group);
}
woodenCrate(9.9, 17.8);
woodenCrate(-9.8, -17.5);

const dustCount = 420;
const dustGeo = new THREE.BufferGeometry();
const dustPositions = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i++) {
  const x = range(-10.5, 10.5);
  const y = range(.5, 10);
  const z = range(-18.5, 18.5);
  dustPositions.set([x, y, z], i * 3);
  dustData.push({
    baseX: x,
    baseY: y,
    baseZ: z,
    phase: range(0, 6.28),
    speed: range(.08, .22)
  });
}
dustGeo.setAttribute(
  'position',
  new THREE.BufferAttribute(dustPositions, 3)
);
const dustMat = new THREE.PointsMaterial({
  color: 0xfff0bc,
  size: .055,
  transparent: true,
  opacity: .6,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});
const dust = new THREE.Points(dustGeo, dustMat);
scene.add(dust);

function lightShaft(x, z, rotation) {
  const geometry = new THREE.CylinderGeometry(.65, 2.8, 14, 16, 1, true);
  const material = new THREE.MeshBasicMaterial({
    color: 0xffefba,
    transparent: true,
    opacity: .035,
    side: THREE.DoubleSide,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const shaft = new THREE.Mesh(geometry, material);
  shaft.position.set(x, 5.7, z);
  shaft.rotation.z = rotation;
  scene.add(shaft);
}
lightShaft(-5.2, -7, -.48);
lightShaft(5.4, 6, .48);
lightShaft(-3.7, 12, -.38);

const hemi = new THREE.HemisphereLight(0xdcebdc, 0x4c5740, 1.65);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffedc3, 4.0);
sun.position.set(-13, 19, -9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -19;
sun.shadow.camera.right = 19;
sun.shadow.camera.top = 22;
sun.shadow.camera.bottom = -22;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 55;
sun.shadow.bias = -.00022;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x9bc8b4, 1.1);
fill.position.set(12, 8, 15);
scene.add(fill);

const fountainGlow = new THREE.PointLight(0x8fd5c6, 1.4, 13, 2);
fountainGlow.position.set(0, 2.4, 0);
scene.add(fountainGlow);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  for (const item of animatedLeaves) {
    item.pivot.rotation.z =
      item.base +
      Math.sin(t * item.speed + item.phase) * item.amount;
  }

  for (const basket of hangingBaskets) {
    basket.group.rotation.x =
      basket.baseX + Math.sin(t * .34 + basket.phase) * .018;
    basket.group.rotation.z =
      basket.baseZ + Math.cos(t * .29 + basket.phase) * .024;
  }

  for (const d of waterDrops) {
    const p = (t * .55 + d.offset) % 1;
    const radius = Math.sin(p * Math.PI) * 1.35;
    d.mesh.position.set(
      Math.cos(d.angle) * radius,
      3.72 - p * 2.7 + Math.sin(p * Math.PI) * .55,
      Math.sin(d.angle) * radius
    );
    d.mesh.scale.setScalar(.75 + .4 * (1 - p));
  }

  const positions = dust.geometry.attributes.position.array;
  for (let i = 0; i < dustData.length; i++) {
    const d = dustData[i];
    positions[i * 3] =
      d.baseX + Math.sin(t * d.speed + d.phase) * .42;
    positions[i * 3 + 1] =
      .5 + ((d.baseY - .5 + t * d.speed * .42) % 9.5);
    positions[i * 3 + 2] =
      d.baseZ + Math.cos(t * d.speed * .7 + d.phase) * .3;
  }
  dust.geometry.attributes.position.needsUpdate = true;

  fountainGlow.intensity = 1.3 + Math.sin(t * 1.4) * .12;
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
