<!DOCTYPE html>

<body>
<div id="title">The Crimson Zephyr · Sunset Passage</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x24152d);
scene.fog = new THREE.FogExp2(0x5b3959, 0.011);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 500);
camera.position.set(20, 12, 25);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.32;
controls.minDistance = 12;
controls.maxDistance = 48;
controls.maxPolarAngle = Math.PI * 0.49;

const seed = 846219;
let state = seed >>> 0;
function rand() {
  state = (state * 1664525 + 1013904223) >>> 0;
  return state / 4294967296;
}
function range(a, b) { return a + (b - a) * rand(); }
function choose(a) { return a[Math.floor(rand() * a.length)]; }

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const clock = new THREE.Clock();
const animated = [];
const swinging = [];
const cloudBands = [];

function canvasTexture(draw, width = 512, height = 512) {
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const c = canvas.getContext("2d");
  draw(c, width, height);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const woodTexture = canvasTexture((c, w, h) => {
  c.fillStyle = "#6c351b";
  c.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 38) {
    c.fillStyle = y % 76 ? "#8d4d26" : "#4f2418";
    c.fillRect(0, y, w, 3);
    for (let i = 0; i < 16; i++) {
      c.fillStyle = `rgba(35,14,8,${range(.12,.32)})`;
      c.beginPath();
      c.ellipse(range(0,w), y + range(7,31), range(10,34), range(1,3), 0, 0, Math.PI * 2);
      c.fill();
    }
  }
}, 512, 512);
woodTexture.repeat.set(2, 2);

const darkWoodTexture = canvasTexture((c, w, h) => {
  c.fillStyle = "#27130f";
  c.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 42) {
    c.fillStyle = "#4a2116";
    c.fillRect(x, 0, 3, h);
    c.fillStyle = "rgba(164,82,37,.26)";
    c.fillRect(x + 7, 0, 1, h);
  }
}, 512, 512);

const clothTexture = canvasTexture((c, w, h) => {
  c.fillStyle = "#76232c";
  c.fillRect(0, 0, w, h);
  for (let i = 0; i < 4000; i++) {
    c.fillStyle = `rgba(255,208,133,${rand() * .08})`;
    c.fillRect(rand() * w, rand() * h, 1, 1);
  }
  c.strokeStyle = "rgba(32,8,14,.5)";
  c.lineWidth = 2;
  for (let x = 18; x < w; x += 44) {
    c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 4, h); c.stroke();
  }
}, 512, 512);

const ropeMat = new THREE.MeshStandardMaterial({ color: 0x9a6b3c, roughness: 0.92 });
const woodMat = new THREE.MeshStandardMaterial({ map: woodTexture, color: 0xb46a34, roughness: 0.77 });
const darkWoodMat = new THREE.MeshStandardMaterial({ map: darkWoodTexture, color: 0x6b3924, roughness: 0.8 });
const brassMat = new THREE.MeshStandardMaterial({ color: 0xd69a3d, roughness: 0.26, metalness: 0.86 });
const ironMat = new THREE.MeshStandardMaterial({ color: 0x25232b, roughness: 0.4, metalness: 0.82 });
const blackMat = new THREE.MeshStandardMaterial({ color: 0x100e13, roughness: 0.82 });
const redClothMat = new THREE.MeshStandardMaterial({ map: clothTexture, color: 0xa63e3e, roughness: 0.87, side: THREE.DoubleSide });
const sailMat = new THREE.MeshStandardMaterial({ color: 0xd6b17c, roughness: 0.95, side: THREE.DoubleSide });
const glassMat = new THREE.MeshStandardMaterial({
  color: 0xffb85d, emissive: 0xff5a19, emissiveIntensity: 1.8,
  roughness: 0.3, transparent: true, opacity: 0.8
});

function shadow(obj, cast = true, receive = true) {
  obj.traverse(o => {
    if (o.isMesh) {
      o.castShadow = cast;
      o.receiveShadow = receive;
    }
  });
  return obj;
}

function mesh(geometry, material, position, rotation, scale) {
  const m = new THREE.Mesh(geometry, material);
  if (position) m.position.copy(position);
  if (rotation) m.rotation.set(rotation.x, rotation.y, rotation.z);
  if (scale) m.scale.copy(scale);
  return m;
}

function cylinderBetween(a, b, radius, material, radial = 10) {
  const d = new THREE.Vector3().subVectors(b, a);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, d.length(), radial), material);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function ropeCurve(points, radius = 0.045, material = ropeMat) {
  const curve = new THREE.CatmullRomCurve3(points);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 32, radius, 7, false), material);
  tube.castShadow = true;
  return tube;
}

function addBolt(parent, pos, scale = 0.09) {
  const b = new THREE.Mesh(new THREE.CylinderGeometry(scale, scale, scale * .45, 6), brassMat);
  b.rotation.x = Math.PI / 2;
  b.position.copy(pos);
  parent.add(b);
}

function makeCloudTexture() {
  return canvasTexture((c, w, h) => {
    const g = c.createRadialGradient(w*.5,h*.5,10,w*.5,h*.5,w*.46);
    g.addColorStop(0, "rgba(255,242,216,.92)");
    g.addColorStop(.42, "rgba(255,196,146,.58)");
    g.addColorStop(1, "rgba(255,153,108,0)");
    c.fillStyle = g;
    c.fillRect(0,0,w,h);
  }, 256, 256);
}
const cloudTexture = makeCloudTexture();

function makeCloud(x, y, z, scale, opacity) {
  const g = new THREE.Group();
  const material = new THREE.SpriteMaterial({
    map: cloudTexture, transparent: true, opacity, depthWrite: false,
    blending: THREE.NormalBlending, color: 0xffd7ba
  });
  for (let i = 0; i < 9; i++) {
    const s = new THREE.Sprite(material.clone());
    const ss = scale * range(.55, 1.15);
    s.position.set(range(-scale, scale), range(-scale*.18, scale*.2), range(-scale*.35, scale*.35));
    s.scale.set(ss * range(1.2, 2.1), ss, 1);
    g.add(s);
  }
  g.position.set(x, y, z);
  scene.add(g);
  cloudBands.push({ group: g, speed: range(.2,.5), baseX: x, wobble: range(0, 10) });
}

for (let i = 0; i < 50; i++) {
  const angle = rand() * Math.PI * 2;
  const dist = range(22, 80);
  makeCloud(Math.cos(angle) * dist, range(-12, -5), Math.sin(angle) * dist, range(2.3, 7), range(.28, .72));
}
for (let i = 0; i < 16; i++) makeCloud(range(-60,60), range(14,28), range(-55,-25), range(4,10), range(.08,.2));

const skyGeo = new THREE.SphereGeometry(180, 40, 22);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: { top: { value: new THREE.Color(0x151833) }, horizon: { value: new THREE.Color(0xe78168) }, bottom: { value: new THREE.Color(0x402c52) } },
  vertexShader: "varying vec3 vP; void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
  fragmentShader: "uniform vec3 top;uniform vec3 horizon;uniform vec3 bottom;varying vec3 vP;void main(){float h=normalize(vP).y;vec3 c=mix(bottom,horizon,smoothstep(-.55,.08,h));c=mix(c,top,smoothstep(.08,.85,h));gl_FragColor=vec4(c,1.0);}"
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

const sun = new THREE.Mesh(
  new THREE.SphereGeometry(3.1, 24, 16),
  new THREE.MeshBasicMaterial({ color: 0xffd28b, fog: false })
);
sun.position.set(-32, 8, -52);
scene.add(sun);

const hemisphere = new THREE.HemisphereLight(0x9eb2dc, 0x5f251d, 2.0);
scene.add(hemisphere);

const key = new THREE.DirectionalLight(0xffb16b, 4.0);
key.position.set(-16, 20, 12);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -22;
key.shadow.camera.right = 22;
key.shadow.camera.top = 22;
key.shadow.camera.bottom = -22;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8873ca, 1.25);
fill.position.set(14, 8, -15);
scene.add(fill);

const deck = new THREE.Group();
deck.position.y = 1.15;
scene.add(deck);

function hullShape() {
  const shape = new THREE.Shape();
  shape.moveTo(-10.2, 0);
  shape.bezierCurveTo(-9.8, -1.75, -7.0, -3.1, 0, -3.7);
  shape.bezierCurveTo(7.0, -3.1, 9.8, -1.75, 10.2, 0);
  shape.lineTo(8.85, 0);
  shape.bezierCurveTo(8.1, -1.15, 5.9, -2.35, 0, -2.75);
  shape.bezierCurveTo(-5.9, -2.35, -8.1, -1.15, -8.85, 0);
  shape.closePath();
  return shape;
}

const hull = new THREE.Mesh(new THREE.ExtrudeGeometry(hullShape(), {
  depth: 5.4, bevelEnabled: true, bevelSegments: 3, bevelSize: .15, bevelThickness: .15, curveSegments: 28
}), darkWoodMat);
hull.rotation.x = Math.PI / 2;
hull.position.set(0, .25, 2.72);
deck.add(shadow(hull));

for (let z of [-2.7, 2.7]) {
  const rail = ropeCurve([V(-8.5,1.15,z), V(-3.5,2.18,z), V(3.5,2.18,z), V(8.5,1.15,z)], .065);
  deck.add(rail);
  for (let x = -8; x <= 8; x += 2) {
    const h = 1.15 + Math.max(0, 1 - Math.abs(x)/8) * 1.0;
    deck.add(cylinderBetween(V(x,.1,z), V(x,h,z), .085, darkWoodMat, 8));
    deck.add(cylinderBetween(V(x,h,z), V(x,h+.22,z), .11, brassMat, 8));
  }
}

for (let x = -9.2; x <= 9.2; x += 1.16) {
  const plank = mesh(new THREE.BoxGeometry(1.1, .18, 5.05), woodMat, V(x, .32, 0));
  deck.add(shadow(plank));
  const seam = mesh(new THREE.BoxGeometry(.032,.025,5.14), blackMat, V(x+.53,.425,0));
  deck.add(seam);
}
for (let x of [-7.8, 0, 7.8]) {
  const beam = mesh(new THREE.BoxGeometry(.26,.31,5.7), darkWoodMat, V(x,.15,0));
  deck.add(shadow(beam));
}

const stern = new THREE.Group();
stern.position.set(7.55, 1.1, 0);
deck.add(stern);
stern.add(shadow(mesh(new THREE.BoxGeometry(2.8, 1.25, 4.5), darkWoodMat, V(0,.45,0))));
stern.add(shadow(mesh(new THREE.BoxGeometry(2.2,.16,4.1), woodMat, V(0,1.18,0))));
for (let z of [-1.8, 1.8]) stern.add(cylinderBetween(V(-1.15,1.1,z), V(1.15,1.1,z), .07, ropeMat));

function makeWheel() {
  const g = new THREE.Group();
  const rim = new THREE.Mesh(new THREE.TorusGeometry(1.04,.105,8,28), brassMat);
  rim.rotation.y = Math.PI / 2;
  g.add(shadow(rim));
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(.21,.21,.35,12), brassMat);
  hub.rotation.z = Math.PI / 2;
  g.add(shadow(hub));
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    const p = V(0, Math.cos(a)*.73, Math.sin(a)*.73);
    const spoke = cylinderBetween(V(0,0,0), p, .055, darkWoodMat, 8);
    spoke.rotation.y += Math.PI / 2;
    g.add(spoke);
    const grip = cylinderBetween(
      V(0, Math.cos(a)*.95, Math.sin(a)*.95),
      V(0, Math.cos(a)*1.22, Math.sin(a)*1.22), .09, darkWoodMat, 8
    );
    grip.rotation.y += Math.PI / 2;
    g.add(grip);
  }
  return g;
}
const helm = makeWheel();
helm.position.set(6.75, 3.0, 0);
helm.rotation.set(0, Math.PI / 2, 0);
deck.add(helm);
deck.add(cylinderBetween(V(6.75,1.4,0), V(6.75,3.0,0), .14, darkWoodMat, 10));
animated.push({ object: helm, type: "wheel" });

function makeCannon(side, x, z) {
  const g = new THREE.Group();
  g.position.set(x, .7, z);
  const base = mesh(new THREE.BoxGeometry(1.65,.36,1.0), darkWoodMat, V(0,0,0));
  g.add(shadow(base));
  for (let px of [-.62,.62]) for (let pz of [-.42,.42]) {
    const wheel = mesh(new THREE.CylinderGeometry(.3,.3,.16,12), ironMat, V(px,-.25,pz), V(Math.PI/2,0,0));
    g.add(shadow(wheel));
  }
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(.24,.31,2.25,16), brassMat);
  barrel.rotation.z = Math.PI / 2;
  barrel.position.set(-.2,.42,0);
  g.add(shadow(barrel));
  const muzzle = new THREE.Mesh(new THREE.TorusGeometry(.31,.07,8,16), ironMat);
  muzzle.rotation.y = Math.PI / 2;
  muzzle.position.set(-1.32,.42,0);
  g.add(shadow(muzzle));
  const rear = new THREE.Mesh(new THREE.SphereGeometry(.31,12,8), brassMat);
  rear.position.set(.92,.42,0);
  g.add(shadow(rear));
  g.rotation.y = side > 0 ? .16 : -.16;
  deck.add(g);
  animated.push({ object: g, type: "cannon", phase: rand()*6.28 });
}
makeCannon(1, -3.7, 2.0);
makeCannon(-1, -2.0, -2.0);
makeCannon(1, 2.2, 2.0);

function crate(x, z, s = 1) {
  const g = new THREE.Group();
  g.position.set(x, .72, z);
  const box = mesh(new THREE.BoxGeometry(s,s,s), woodMat);
  g.add(shadow(box));
  for (const a of [-1,1]) {
    g.add(shadow(mesh(new THREE.BoxGeometry(s+.05,.11,.11), darkWoodMat, V(0,a*s*.38,0))));
    g.add(shadow(mesh(new THREE.BoxGeometry(.11,s+.05,.11), darkWoodMat, V(a*s*.38,0,0))));
  }
  deck.add(g);
}
function barrel(x, z, s = 1) {
  const g = new THREE.Group();
  g.position.set(x,.63,z);
  const body = mesh(new THREE.CylinderGeometry(.38*s,.48*s,.82*s,14), woodMat);
  g.add(shadow(body));
  for (let y of [-.26, .26]) {
    const ring = mesh(new THREE.TorusGeometry(.43*s,.045*s,7,18), ironMat, V(0,y,0), V(Math.PI/2,0,0));
    g.add(shadow(ring));
  }
  deck.add(g);
}
crate(2.0,-1.45,1.08);
crate(3.18,-1.38,.8);
crate(-6.35,1.48,.92);
barrel(-5.2,-1.2,1.12);
barrel(-4.42,-1.28,.9);
barrel(4.2,1.48,.86);

function makeSpyglass() {
  const g = new THREE.Group();
  g.position.set(-6.7, 1.7, -2.25);
  const stand = cylinderBetween(V(0,0,0), V(0,1.05,0), .07, darkWoodMat, 8);
  g.add(stand);
  for (let i = 0; i < 3; i++) {
    const a = i * Math.PI * 2/3;
    g.add(cylinderBetween(V(0,.15,0),V(Math.cos(a)*.43,0,Math.sin(a)*.43),.045,darkWoodMat,8));
  }
  const scope = new THREE.Mesh(new THREE.CylinderGeometry(.13,.19,1.32,14), brassMat);
  scope.rotation.z = Math.PI/2;
  scope.rotation.y = -.2;
  scope.position.set(.25,1.02,0);
  g.add(shadow(scope));
  const lens = new THREE.Mesh(new THREE.CylinderGeometry(.145,.145,.035,16), glassMat);
  lens.rotation.z = Math.PI/2;
  lens.rotation.y = -.2;
  lens.position.set(-.4,1.02,0);
  g.add(lens);
  deck.add(g);
}
makeSpyglass();

function makeMast() {
  const mast = new THREE.Group();
  mast.position.set(-1.0,.38,0);
  deck.add(mast);
  const pole = mesh(new THREE.CylinderGeometry(.2,.29,10.4,14), darkWoodMat, V(0,5.2,0));
  mast.add(shadow(pole));
  mast.add(shadow(mesh(new THREE.SphereGeometry(.37,14,10), brassMat, V(0,10.5,0))));
  const yard = cylinderBetween(V(-.25,7.9,0), V(.25,7.9,0), .12, darkWoodMat, 10);
  yard.rotation.z = Math.PI / 2;
  yard.scale.x = 15;
  mast.add(yard);
  for (let y of [2.3,4.1,5.9]) {
    const band = mesh(new THREE.TorusGeometry(.285,.045,7,18), brassMat, V(0,y,0), V(Math.PI/2,0,0));
    mast.add(shadow(band));
  }
  return mast;
}
const mast = makeMast();

function makeBalloon() {
  const g = new THREE.Group();
  g.position.set(-1, 13.0, 0);
  g.scale.set(1,1.15,1);
  const balloon = new THREE.Mesh(
    new THREE.SphereGeometry(1, 48, 28),
    new THREE.MeshStandardMaterial({ color: 0xb94c43, roughness: .87, metalness: .03 })
  );
  balloon.scale.set(6.7, 4.15, 4.05);
  g.add(shadow(balloon));
  for (let i = 0; i < 11; i++) {
    const a = i / 11 * Math.PI * 2;
    const stripe = new THREE.Mesh(new THREE.TorusGeometry(4.16,.08,7,44), brassMat);
    stripe.rotation.x = Math.PI / 2;
    stripe.rotation.z = a;
    stripe.scale.set(1.57,.98,1);
    g.add(shadow(stripe));
  }
  const patchMat = new THREE.MeshStandardMaterial({ color: 0x684032, roughness: .9, side: THREE.DoubleSide });
  for (let i = 0; i < 13; i++) {
    const patch = new THREE.Mesh(new THREE.PlaneGeometry(range(.45,1.25),range(.32,.85)), patchMat);
    const u = range(-.82,.82), v = range(-.72,.72);
    const p = new THREE.Vector3(u*6.3, v*4.0, Math.sqrt(Math.max(.1,1-u*u-v*v*.2))*3.85);
    patch.position.copy(p);
    patch.lookAt(p.clone().multiplyScalar(1.8));
    patch.rotation.z += range(-.5,.5);
    g.add(patch);
  }
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(1.25,2.1,1.25,16), brassMat,);
  collar.position.y = -4.35;
  g.add(shadow(collar));
  scene.add(g);
  return g;
}
const balloon = makeBalloon();

for (let side of [-1,1]) {
  for (let i = 0; i < 4; i++) {
    const x = -6 + i * 3.5;
    const top = V(-1 + x*.52, 10.5, side*2.45);
    const low = V(x, 2.1, side*2.75);
    scene.add(ropeCurve([top, V((top.x+low.x)*.5,6.3,side*3.6), low], .045));
  }
}
scene.add(ropeCurve([V(-6.8,10.8,-2.4),V(-9.5,5,-3.2),V(-8.1,1.3,-2.7)],.05));
scene.add(ropeCurve([V(4.8,10.8,2.4),V(8.5,5,3.2),V(8.1,1.3,2.7)],.05));

function ropeLadder(x, z) {
  const g = new THREE.Group();
  for (let i = 0; i < 9; i++) {
    const y = 9.5 - i*.85;
    g.add(cylinderBetween(V(x-.45,y,z),V(x+.45,y,z),.036,ropeMat,7));
  }
  g.add(cylinderBetween(V(x-.48,9.8,z),V(x-.48,2.1,z),.045,ropeMat,7));
  g.add(cylinderBetween(V(x+.48,9.8,z),V(x+.48,2.1,z),.045,ropeMat,7));
  scene.add(g);
}
ropeLadder(-5.7,2.76);

function flagShape() {
  const s = new THREE.Shape();
  s.moveTo(0,0); s.lineTo(3.1,.2); s.lineTo(2.5,.75); s.lineTo(3.3,1.28); s.lineTo(0,1.55); s.closePath();
  return s;
}
const flagPivot = new THREE.Group();
flagPivot.position.set(-1,10.28,0);
scene.add(flagPivot);
const flag = new THREE.Mesh(new THREE.ShapeGeometry(flagShape(), 12), new THREE.MeshStandardMaterial({
  color: 0x15131b, roughness: .88, side: THREE.DoubleSide
}));
flag.position.set(.15,0,0);
flag.rotation.y = Math.PI / 2;
flagPivot.add(flag);

const skull = new THREE.Group();
skull.position.set(1.45,.78,-.02);
skull.rotation.y = Math.PI/2;
flagPivot.add(skull);
const boneMat = new THREE.MeshBasicMaterial({ color: 0xe9d6b3, side: THREE.DoubleSide });
const head = new THREE.Mesh(new THREE.CircleGeometry(.24,16), boneMat);
skull.add(head);
for (let x of [-.085,.085]) {
  const eye = new THREE.Mesh(new THREE.CircleGeometry(.055,12), new THREE.MeshBasicMaterial({color:0x1a1419}));
  eye.position.set(x,.04,.004);
  skull.add(eye);
}
const jaw = new THREE.Mesh(new THREE.BoxGeometry(.28,.08,.01), boneMat);
jaw.position.y = -.19;
skull.add(jaw);
for (let angle of [-.55,.55]) {
  const bone = new THREE.Mesh(new THREE.BoxGeometry(.68,.055,.012), boneMat);
  bone.rotation.z = angle;
  bone.position.set(0,-.33,0);
  skull.add(bone);
}
animated.push({ object: flagPivot, type: "flag" });

function lantern(x, z, phase) {
  const pivot = new THREE.Group();
  pivot.position.set(x,2.25,z);
  const chain = cylinderBetween(V(0,0,0),V(0,-.42,0),.025,ironMat,7);
  pivot.add(chain);
  const body = new THREE.Group();
  body.position.y = -.57;
  const frame = mesh(new THREE.CylinderGeometry(.18,.23,.34,8), brassMat);
  body.add(shadow(frame));
  const light = mesh(new THREE.CylinderGeometry(.13,.13,.27,10), glassMat);
  body.add(light);
  const top = mesh(new THREE.ConeGeometry(.22,.15,8), ironMat, V(0,.25,0));
  body.add(shadow(top));
  pivot.add(body);
  deck.add(pivot);
  const point = new THREE.PointLight(0xff8d35, 1.35, 6, 2);
  point.position.set(x,1.5,z);
  deck.add(point);
  swinging.push({ pivot, body, point, phase });
}
lantern(-7.2,2.55,0);
lantern(1.1,-2.55,2.2);
lantern(7.9,2.1,4.4);

function porthole(x,z) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(.27,.07,8,18), brassMat);
  ring.position.set(x,.05,z);
  ring.rotation.x = Math.PI/2;
  deck.add(shadow(ring));
  const glass = new THREE.Mesh(new THREE.CircleGeometry(.22,16), new THREE.MeshStandardMaterial({
    color:0x28415a, metalness:.45, roughness:.25
  }));
  glass.position.set(x,.055,z);
  glass.rotation.x = -Math.PI/2;
  deck.add(glass);
}
for (let x of [-6.7,-4.8,-2.9,-1,1,3,5]) {
  porthole(x, 2.76);
  porthole(x,-2.76);
}

const bowFigure = new THREE.Group();
bowFigure.position.set(-9.3,.65,0);
deck.add(bowFigure);
const prow = mesh(new THREE.ConeGeometry(.8,2.7,8), brassMat, V(-.95,.15,0), V(0,0,Math.PI/2));
bowFigure.add(shadow(prow));
const wing = mesh(new THREE.BoxGeometry(.65,.08,2.7), brassMat, V(-.55,.3,0));
wing.rotation.x = .25;
bowFigure.add(shadow(wing));

const compass = new THREE.Group();
compass.position.set(5.65,1.44,-1.15);
deck.add(compass);
compass.add(shadow(mesh(new THREE.CylinderGeometry(.42,.47,.16,16), brassMat)));
const face = mesh(new THREE.CircleGeometry(.34,24), new THREE.MeshStandardMaterial({color:0xe8d0a1,roughness:.75}), V(0,.086,0), V(-Math.PI/2,0,0));
compass.add(face);
for (let i=0;i<4;i++) {
  const a=i*Math.PI/2;
  const mark=mesh(new THREE.BoxGeometry(.035,.009,.24), ironMat,V(Math.cos(a)*.22,.1,Math.sin(a)*.22));
  mark.rotation.y=-a;
  compass.add(mark);
}

const birds = new THREE.Group();
scene.add(birds);
for (let i=0;i<12;i++) {
  const bird = new THREE.Group();
  const bm = new THREE.MeshBasicMaterial({color:0x251827,side:THREE.DoubleSide});
  const left = new THREE.Mesh(new THREE.PlaneGeometry(.34,.1),bm);
  const right = left.clone();
  left.position.x=-.16; left.rotation.z=.35;
  right.position.x=.16; right.rotation.z=-.35;
  bird.add(left,right);
  bird.position.set(range(-28,28),range(6,15),range(-30,-12));
  bird.userData = { phase:rand()*6.28, radius:range(11,25), center:bird.position.clone() };
  birds.add(bird);
}

function makeDeckRopeCoil(x,z) {
  const coil = new THREE.Group();
  coil.position.set(x,.5,z);
  for(let i=0;i<4;i++) {
    const t = new THREE.Mesh(new THREE.TorusGeometry(.17+i*.075,.027,6,24),ropeMat,V(0,i*.025,0),V(Math.PI/2,0,0));
    coil.add(t);
  }
  deck.add(coil);
}
makeDeckRopeCoil(-.25,-1.9);
makeDeckRopeCoil(-7.1,-1.65);
makeDeckRopeCoil(1.1,1.75);

const wake = new THREE.Group();
scene.add(wake);
for (let i=0;i<36;i++) {
  const puff = new THREE.Sprite(new THREE.SpriteMaterial({
    map:cloudTexture, transparent:true, opacity:range(.15,.38), depthWrite:false, color:0xcdb0cf
  }));
  const ss=range(1,3.4);
  puff.scale.set(ss*1.8,ss,1);
  puff.position.set(range(7,30),range(-5,-2),range(-5,5));
  wake.add(puff);
}
animated.push({ object:wake, type:"wake" });

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener("resize", resize);

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  balloon.position.y = 13 + Math.sin(t*.45)*.18;
  balloon.rotation.z = Math.sin(t*.25)*.018;
  deck.rotation.z = Math.sin(t*.45)*.012;
  deck.rotation.x = Math.sin(t*.32)*.008;

  for (const a of animated) {
    if (a.type === "wheel") a.object.rotation.z = Math.sin(t*.48)*.16;
    if (a.type === "flag") {
      a.object.rotation.y = Math.PI/2 + Math.sin(t*1.7)*.13;
      flag.rotation.z = Math.sin(t*3.2)*.055;
      flag.scale.y = 1 + Math.sin(t*2.6)*.04;
    }
    if (a.type === "cannon") {
      a.object.position.y = .7 + Math.sin(t*.7+a.phase)*.025;
      a.object.rotation.z = Math.sin(t*.55+a.phase)*.012;
    }
    if (a.type === "wake") a.object.position.x = -Math.sin(t*.2)*1.3;
  }

  for (const l of swinging) {
    l.pivot.rotation.z = Math.sin(t*1.45+l.phase)*.18;
    l.pivot.rotation.x = Math.cos(t*1.15+l.phase)*.06;
    l.point.intensity = 1.15 + Math.sin(t*5+l.phase)*.22;
  }

  cloudBands.forEach((c,i) => {
    c.group.position.x = c.baseX + Math.sin(t*c.speed+c.wobble)*3;
    c.group.position.y += Math.sin(t*.24+i)*.0018;
  });

  birds.children.forEach((b,i) => {
    const d=b.userData;
    b.position.x=d.center.x+Math.sin(t*.18+d.phase)*d.radius*.55;
    b.position.z=d.center.z+Math.cos(t*.18+d.phase)*d.radius*.18;
    b.position.y=d.center.y+Math.sin(t*.9+d.phase)*.35;
    b.children[0].rotation.z=.2+Math.sin(t*7+d.phase)*.45;
    b.children[1].rotation.z=-.2-Math.sin(t*7+d.phase)*.45;
  });

  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
