<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Red Panda</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11100f}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11100f);
scene.fog = new THREE.Fog(0x11100f, 6, 12);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(38,window.innerWidth/window.innerHeight,.1,100);
camera.position.set(3.7,2.25,5.7);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .065;
controls.autoRotate = true;
controls.autoRotateSpeed = .42;
controls.minDistance = 3.5;
controls.maxDistance = 8;
controls.target.set(0,1.05,.15);

scene.add(new THREE.HemisphereLight(0xead9c1,0x201a19,2.1));

const key = new THREE.DirectionalLight(0xffe2c1,4.2);
key.position.set(-3.5,6,4);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -2;
key.shadow.bias = -.0005;
scene.add(key);

const rim = new THREE.DirectionalLight(0xc4d8ff,2.0);
rim.position.set(4,3,-4);
scene.add(rim);

const fill = new THREE.PointLight(0xff8e55,1.3,5);
fill.position.set(1.5,1.7,2.4);
scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(18,96),
  new THREE.MeshStandardMaterial({color:0x191615,roughness:.96,metalness:0})
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.012;
ground.receiveShadow=true;
scene.add(ground);

const rust = new THREE.MeshStandardMaterial({color:0x9c3f20,roughness:.86});
const rustLight = new THREE.MeshStandardMaterial({color:0xc15d2d,roughness:.82});
const darkRust = new THREE.MeshStandardMaterial({color:0x542219,roughness:.9});
const cream = new THREE.MeshStandardMaterial({color:0xd9c2a0,roughness:.91});
const pale = new THREE.MeshStandardMaterial({color:0xf0e2c7,roughness:.88});
const charcoal = new THREE.MeshStandardMaterial({color:0x171313,roughness:.82});
const noseMat = new THREE.MeshPhysicalMaterial({
  color:0x211719,roughness:.22,clearcoat:.48,clearcoatRoughness:.18,
  transmission:.08,thickness:.12
});
const eyeMat = new THREE.MeshPhysicalMaterial({
  color:0x08090a,roughness:.06,metalness:.08,clearcoat:1,
  clearcoatRoughness:.04
});
const glintMat = new THREE.MeshBasicMaterial({color:0xfff5dc});

const panda = new THREE.Group();
panda.position.y = .02;
scene.add(panda);

function ellipsoid(name,pos,scale,mat,segments=32,rings=20){
  const m=new THREE.Mesh(new THREE.SphereGeometry(1,segments,rings),mat);
  m.name=name;
  m.position.set(pos.x,pos.y,pos.z);
  m.scale.set(scale.x,scale.y,scale.z);
  m.castShadow=true;
  m.receiveShadow=true;
  panda.add(m);
  return m;
}

function cylinderBetween(a,b,r1,r2,mat,radial=12){
  const mid=new THREE.Vector3().addVectors(a,b).multiplyScalar(.5);
  const dir=new THREE.Vector3().subVectors(b,a);
  const length=dir.length();
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,length,radial,1),mat);
  mesh.position.copy(mid);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  panda.add(mesh);
  return mesh;
}

function tuft(pos,normal,length,radius,mat){
  const mesh=new THREE.Mesh(new THREE.ConeGeometry(radius, length, 5, 1),mat);
  mesh.position.copy(pos).addScaledVector(normal,length*.43);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),normal.clone().normalize());
  mesh.castShadow=true;
  panda.add(mesh);
  return mesh;
}

let seed=92831;
function rnd(){
  seed=(seed*1664525+1013904223)>>>0;
  return seed/4294967296;
}

function furPatch(center,scale,count,matA,matB,spread=1){
  for(let i=0;i<count;i++){
    const u=rnd()*2-1;
    const t=rnd()*Math.PI*2;
    const s=Math.sqrt(1-u*u);
    const n=new THREE.Vector3(s*Math.cos(t),u,s*Math.sin(t));
    const p=new THREE.Vector3(
      center.x+n.x*scale.x,
      center.y+n.y*scale.y,
      center.z+n.z*scale.z
    );
    const l=(.075+rnd()*.15)*spread;
    const r=.014+rnd()*.018;
    tuft(p,n,l,r,rnd()<.24?matB:matA);
  }
}

ellipsoid("compact seated body",{x:0,y:.83,z:0},{x:.78,y:.96,z:.58},rust,42,28);
ellipsoid("warm chest",{x:0,y:.82,z:.47},{x:.54,y:.74,z:.27},rustLight,36,24);
ellipsoid("cream throat",{x:0,y:1.27,z:.49},{x:.43,y:.43,z:.23},cream,32,20);
ellipsoid("head",{x:0,y:1.72,z:.08},{x:.72,y:.64,z:.58},rust,40,28);

ellipsoid("left cheek",{x:-.39,y:1.56,z:.40},{x:.34,y:.38,z:.27},cream,28,18);
ellipsoid("right cheek",{x:.39,y:1.56,z:.40},{x:.34,y:.38,z:.27},cream,28,18);
ellipsoid("left facial blaze",{x:-.26,y:1.78,z:.535},{x:.22,y:.34,z:.09},pale,24,16);
ellipsoid("right facial blaze",{x:.26,y:1.78,z:.535},{x:.22,y:.34,z:.09},pale,24,16);
ellipsoid("left eye mask",{x:-.34,y:1.78,z:.59},{x:.24,y:.18,z:.075},darkRust,24,16);
ellipsoid("right eye mask",{x:.34,y:1.78,z:.59},{x:.24,y:.18,z:.075},darkRust,24,16);

function ear(x){
  const g=new THREE.Group();
  g.position.set(x,2.19,.02);
  g.rotation.z=x<0?-.16:.16;
  const outer=new THREE.Mesh(new THREE.SphereGeometry(1,24,16),rust);
  outer.scale.set(.34,.39,.20);
  outer.castShadow=true;
  g.add(outer);
  const inner=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),new THREE.MeshStandardMaterial({color:0x6f2923,roughness:.9}));
  inner.position.set(0,-.015,.16);
  inner.scale.set(.20,.25,.055);
  inner.castShadow=true;
  g.add(inner);
  panda.add(g);
  return g;
}
ear(-.48); ear(.48);

ellipsoid("muzzle",{x:0,y:1.52,z:.60},{x:.34,y:.23,z:.20},pale,30,18);
ellipsoid("nose",{x:0,y:1.60,z:.785},{x:.115,y:.075,z:.065},noseMat,24,16);

function eye(x){
  ellipsoid("dark inquisitive eye",{x,y:1.82,z:.635},{x:.075,y:.092,z:.045},eyeMat,24,16);
  ellipsoid("eye catchlight",{x:x-.018,y:1.855,z:.678},{x:.018,y:.022,z:.009},glintMat,12,8);
}
eye(-.285); eye(.285);

const mouth=new THREE.Mesh(new THREE.TorusGeometry(.115,.012,8,24,Math.PI),charcoal);
mouth.position.set(0,1.48,.765);
mouth.rotation.x=Math.PI/2;
mouth.scale.set(1,.65,1);
mouth.castShadow=true;
panda.add(mouth);

function leg(x){
  ellipsoid("folded haunch",{x,y:.48,z:.26},{x:.42,y:.49,z:.42},rust,30,20);
  ellipsoid("black paw",{x,y:.22,z:.61},{x:.22,y:.115,z:.27},charcoal,26,16);
  for(let i=-1;i<=1;i++){
    ellipsoid("paw toe",{x:x+i*.065,y:.205,z:.82},{x:.052,y:.045,z:.075},noseMat,16,10);
  }
}
leg(-.35); leg(.35);

function foreleg(x){
  const p1=new THREE.Vector3(x,1.15,.45),p2=new THREE.Vector3(x*.96,.67,.68);
  cylinderBetween(p1,p2,.13,.19,rustLight,16);
  ellipsoid("small front paw",{x:x*.96,y:.60,z:.73},{x:.16,y:.12,z:.20},charcoal,24,14);
}
foreleg(-.43); foreleg(.43);

const tailPts=[
  new THREE.Vector3(.60,.60,-.18),
  new THREE.Vector3(.88,.43,.00),
  new THREE.Vector3(1.02,.29,.34),
  new THREE.Vector3(.88,.20,.67),
  new THREE.Vector3(.48,.16,.83),
  new THREE.Vector3(.02,.16,.84),
  new THREE.Vector3(-.38,.18,.73),
  new THREE.Vector3(-.61,.24,.52),
  new THREE.Vector3(-.55,.31,.28)
];
for(let i=0;i<tailPts.length-1;i++){
  const rA=.29-i*.018, rB=.29-(i+1)*.018;
  cylinderBetween(tailPts[i],tailPts[i+1],Math.max(.13,rA),Math.max(.12,rB),i%2?darkRust:rustLight,18);
  ellipsoid("tail fullness",tailPts[i],{x:Math.max(.13,rA),y:Math.max(.13,rA),z:Math.max(.13,rA)},i%2?darkRust:rustLight,20,12);
}
ellipsoid("tail tip",tailPts[tailPts.length-1],{x:.13,y:.13,z:.13},darkRust,20,12);

furPatch({x:0,y:.83,z:0},{x:.79,y:.96,z:.59},150,rust,rustLight,.85);
furPatch({x:0,y:1.72,z:.08},{x:.72,y:.64,z:.58},130,rust,rustLight,.72);
furPatch({x:0,y:1.28,z:.48},{x:.44,y:.45,z:.23},42,cream,pale,.72);
furPatch({x:-.4,y:1.57,z:.4},{x:.34,y:.38,z:.26},32,cream,pale,.62);
furPatch({x:.4,y:1.57,z:.4},{x:.34,y:.38,z:.26},32,cream,pale,.62);

function tailTufts(){
  for(let i=0;i<tailPts.length;i++){
    const p=tailPts[i];
    const count=i<3?18:12;
    for(let j=0;j<count;j++){
      const n=new THREE.Vector3(rnd()*2-1,rnd()*.9-.1,rnd()*2-1).normalize();
      tuft(p.clone().addScaledVector(n,.20),n,.08+rnd()*.13,.018+rnd()*.016,i%2?darkRust:rustLight);
    }
  }
}
tailTufts();

const whiskerMat=new THREE.LineBasicMaterial({color:0xcabda6,transparent:true,opacity:.68});
function whisker(side,y,z,tilt){
  const pts=[
    new THREE.Vector3(side*.11,y,z),
    new THREE.Vector3(side*.27,y+tilt*.025,z+.015),
    new THREE.Vector3(side*.61,y+tilt*.11,z-.035)
  ];
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),whiskerMat);
  panda.add(line);
}
for(const side of [-1,1]){
  whisker(side,1.53,.775,.08);
  whisker(side,1.49,.775,-.02);
  whisker(side,1.45,.77,-.11);
}

const collar=new THREE.Mesh(
  new THREE.TorusGeometry(.43,.035,10,40,Math.PI*1.45),
  new THREE.MeshStandardMaterial({color:0x3d1a16,roughness:.85})
);
collar.position.set(0,1.28,.25);
collar.rotation.x=Math.PI/2;
collar.rotation.z=Math.PI;
collar.castShadow=true;
panda.add(collar);

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
});
</script>
</body>
</html>
