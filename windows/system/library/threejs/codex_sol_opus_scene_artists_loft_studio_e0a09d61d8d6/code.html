<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist's Loft Studio</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #d9d1bd;
    }

    body {
      font-family: Georgia, serif;
    }

    canvas {
      display: block;
    }

    .title {
      position: fixed;
      left: 28px;
      top: 22px;
      z-index: 2;
      color: rgba(54, 43, 34, 0.82);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 13px;
      pointer-events: none;
      text-shadow: 0 1px 12px rgba(255, 250, 232, 0.8);
    }

    .subtitle {
      display: block;
      margin-top: 7px;
      color: rgba(76, 61, 48, 0.55);
      font-size: 9px;
      letter-spacing: 0.28em;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 52% 42%, transparent 48%, rgba(53, 40, 27, 0.12) 100%),
        linear-gradient(to bottom, rgba(255, 245, 213, 0.06), rgba(86, 61, 38, 0.05));
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="title">
    Artist's Loft
    <span class="subtitle">Light · Pigment · Form</span>
  </div>
  <div class="vignette"></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcfc7b3);
    scene.fog = new THREE.FogExp2(0xcfc7b3, 0.017);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      160
    );
    camera.position.set(17, 11, 22);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 4.6, -1.5);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.22;
    controls.minDistance = 12;
    controls.maxDistance = 34;
    controls.maxPolarAngle = Math.PI * 0.49;

    let seed = 928374;

    function random() {
      seed |= 0;
      seed = seed + 0x6d2b79f5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }

    function range(min, max) {
      return min + (max - min) * random();
    }

    function choose(array) {
      return array[Math.floor(random() * array.length)];
    }

    function canvasTexture(width, height, draw) {
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      draw(ctx, width, height);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    function mesh(geometry, material, parent = scene) {
      const object = new THREE.Mesh(geometry, material);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function box(size, position, material, parent = scene) {
      const object = mesh(
        new THREE.BoxGeometry(size[0], size[1], size[2]),
        material,
        parent
      );
      object.position.set(position[0], position[1], position[2]);
      return object;
    }

    function cylinder(radiusTop, radiusBottom, height, segments, material, parent = scene) {
      return mesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
        material,
        parent
      );
    }

    function makeMaterial(color, roughness = 0.72, metalness = 0) {
      return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness
      });
    }

    const plaster = makeMaterial(0xc9bba3, 0.96);
    const darkWood = makeMaterial(0x4b3021, 0.8);
    const oak = makeMaterial(0x9a6540, 0.72);
    const paleWood = makeMaterial(0xb98254, 0.78);
    const blackMetal = makeMaterial(0x242322, 0.38, 0.72);
    const warmMetal = makeMaterial(0x78614a, 0.42, 0.55);
    const canvasEdge = makeMaterial(0xd7c9ab, 0.94);
    const clay = makeMaterial(0xa86243, 0.88);
    const porcelain = makeMaterial(0xe7dfca, 0.58);
    const glass = new THREE.MeshPhysicalMaterial({
      color: 0x9fc8d1,
      roughness: 0.13,
      metalness: 0,
      transmission: 0.3,
      transparent: true,
      opacity: 0.38,
      thickness: 0.1,
      side: THREE.DoubleSide
    });

    const floorTexture = canvasTexture(1024, 1024, (ctx, w, h) => {
      ctx.fillStyle = "#8d7157";
      ctx.fillRect(0, 0, w, h);

      for (let i = 0; i < 38; i++) {
        const y = i * h / 38;
        ctx.fillStyle = i % 2 ? "#94765a" : "#876b52";
        ctx.fillRect(0, y, w, h / 38 - 2);
        ctx.fillStyle = "rgba(48,31,20,0.28)";
        ctx.fillRect(0, y + h / 38 - 3, w, 2);
      }

      for (let i = 0; i < 90; i++) {
        const x = range(0, w);
        const y = range(0, h);
        const length = range(20, 150);
        ctx.strokeStyle = `rgba(48,33,23,${range(0.03, 0.11)})`;
        ctx.lineWidth = range(1, 4);
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + length, y + range(-3, 3));
        ctx.stroke();
      }

      const colors = [
        "#d84d42",
        "#e3a82e",
        "#225f8d",
        "#4b8054",
        "#f3e5c6",
        "#593a75",
        "#27242c"
      ];

      for (let i = 0; i < 320; i++) {
        const x = range(0, w);
        const y = range(0, h);
        const radius = range(1.5, 13);
        ctx.globalAlpha = range(0.18, 0.68);
        ctx.fillStyle = choose(colors);
        ctx.beginPath();
        ctx.ellipse(
          x,
          y,
          radius * range(0.5, 1.8),
          radius,
          range(0, Math.PI),
          0,
          Math.PI * 2
        );
        ctx.fill();

        if (random() > 0.78) {
          ctx.strokeStyle = choose(colors);
          ctx.lineWidth = range(1, 5);
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + range(-45, 45), y + range(-45, 45));
          ctx.stroke();
        }
      }

      ctx.globalAlpha = 1;
    });
    floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
    floorTexture.repeat.set(2.6, 2.6);

    const floorMaterial = new THREE.MeshStandardMaterial({
      map: floorTexture,
      roughness: 0.9,
      metalness: 0
    });

    const floor = box([30, 0.3, 24], [0, -0.15, 0], floorMaterial);
    floor.receiveShadow = true;
    floor.castShadow = false;

    const brickTexture = canvasTexture(1024, 512, (ctx, w, h) => {
      ctx.fillStyle = "#7e4f3d";
      ctx.fillRect(0, 0, w, h);

      const brickW = 112;
      const brickH = 49;

      for (let row = 0; row <= h / brickH; row++) {
        const offset = row % 2 ? -brickW / 2 : 0;

        for (let col = -1; col <= w / brickW; col++) {
          const x = col * brickW + offset;
          const y = row * brickH;
          const shade = Math.floor(range(-17, 18));
          ctx.fillStyle = `rgb(${139 + shade},${82 + shade * 0.55},${60 + shade * 0.35})`;
          ctx.fillRect(x + 4, y + 4, brickW - 8, brickH - 8);

          ctx.fillStyle = "rgba(255,220,178,0.06)";
          ctx.fillRect(x + 8, y + 8, brickW - 16, 5);

          for (let k = 0; k < 11; k++) {
            ctx.fillStyle = `rgba(45,24,18,${range(0.02, 0.12)})`;
            ctx.fillRect(
              x + range(8, brickW - 10),
              y + range(8, brickH - 8),
              range(2, 10),
              range(1, 4)
            );
          }
        }
      }

      ctx.fillStyle = "rgba(218,202,169,0.52)";
      for (let row = 0; row <= h / brickH; row++) {
        ctx.fillRect(0, row * brickH, w, 4);
      }

      for (let row = 0; row <= h / brickH; row++) {
        const offset = row % 2 ? -brickW / 2 : 0;
        for (let col = 0; col <= w / brickW + 1; col++) {
          ctx.fillRect(col * brickW + offset, row * brickH, 4, brickH);
        }
      }
    });
    brickTexture.wrapS = brickTexture.wrapT = THREE.RepeatWrapping;
    brickTexture.repeat.set(2.7, 2.2);

    const brickMaterial = new THREE.MeshStandardMaterial({
      map: brickTexture,
      roughness: 0.96
    });

    box([30, 13, 0.45], [0, 6.5, -12], brickMaterial);
    box([0.45, 13, 24], [-15, 6.5, 0], plaster);
    box([0.45, 13, 24], [15, 6.5, 0], plaster);

    const ceiling = box([30, 0.35, 24], [0, 13.3, 0], plaster);
    ceiling.receiveShadow = true;

    const beamGroup = new THREE.Group();
    scene.add(beamGroup);

    for (let z = -10; z <= 10; z += 5) {
      box([30, 0.55, 0.5], [0, 12.6, z], darkWood, beamGroup);
    }

    for (let x = -12; x <= 12; x += 6) {
      box([0.42, 0.42, 24], [x, 12.82, 0], darkWood, beamGroup);
    }

    function createWindow(x, y, width, height) {
      const group = new THREE.Group();
      group.position.set(x, y, -11.73);
      scene.add(group);

      box([width + 0.5, height + 0.5, 0.18], [0, 0, 0], blackMetal, group);
      box([width, height, 0.24], [0, 0, 0.03], glass, group);

      box([0.16, height, 0.34], [0, 0, 0.17], blackMetal, group);
      box([width, 0.16, 0.34], [0, 0, 0.17], blackMetal, group);

      for (const dx of [-width / 4, width / 4]) {
        box([0.1, height, 0.31], [dx, 0, 0.16], blackMetal, group);
      }

      for (const dy of [-height / 4, height / 4]) {
        box([width, 0.1, 0.31], [0, dy, 0.16], blackMetal, group);
      }

      const outsideGlow = new THREE.MeshBasicMaterial({
        color: 0xf8e0aa,
        transparent: true,
        opacity: 0.42,
        side: THREE.DoubleSide
      });
      box([width - 0.25, height - 0.25, 0.02], [0, 0, -0.11], outsideGlow, group);

      return group;
    }

    createWindow(-9.1, 7.2, 4.3, 7.2);
    createWindow(-3.9, 7.2, 4.3, 7.2);
    createWindow(8.9, 7.4, 5.2, 6.8);

    function createSkylight() {
      const group = new THREE.Group();
      group.position.set(2.5, 13.05, -1.5);
      scene.add(group);

      const frame = box([8.6, 0.22, 4.8], [0, 0, 0], blackMetal, group);
      frame.castShadow = true;

      const pane = box([8.15, 0.12, 4.35], [0, -0.01, 0], glass, group);
      pane.material = glass;

      for (const x of [-2.7, 0, 2.7]) {
        box([0.13, 0.26, 4.5], [x, -0.08, 0], blackMetal, group);
      }

      box([8.3, 0.26, 0.14], [0, -0.08, 0], blackMetal, group);
    }

    createSkylight();

    const hemi = new THREE.HemisphereLight(0xd9edff, 0x6b4b35, 1.5);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffe0a4, 4.2);
    sun.position.set(-9, 14, 8);
    sun.target.position.set(1, 0, -3);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -14;
    sun.shadow.camera.right = 14;
    sun.shadow.camera.top = 15;
    sun.shadow.camera.bottom = -10;
    sun.shadow.camera.near = 2;
    sun.shadow.camera.far = 42;
    sun.shadow.bias = -0.00015;
    scene.add(sun, sun.target);

    const windowGlow = new THREE.RectAreaLight(0xffd49a, 10, 10, 8);
    windowGlow.position.set(-7, 7, -10.9);
    windowGlow.lookAt(0, 3, 2);
    scene.add(windowGlow);

    const skylightGlow = new THREE.RectAreaLight(0xd8edff, 8, 8, 4);
    skylightGlow.position.set(2.5, 12.7, -1.5);
    skylightGlow.lookAt(1, 0, -2);
    scene.add(skylightGlow);

    function paintedCanvasTexture() {
      return canvasTexture(768, 920, (ctx, w, h) => {
        ctx.fillStyle = "#e8dfc8";
        ctx.fillRect(0, 0, w, h);

        const gradient = ctx.createLinearGradient(0, 0, w, h);
        gradient.addColorStop(0, "#dad1b9");
        gradient.addColorStop(0.46, "#ecdcae");
        gradient.addColorStop(1, "#829eb0");
        ctx.globalAlpha = 0.78;
        ctx.fillStyle = gradient;
        ctx.fillRect(35, 35, w - 70, h - 70);

        ctx.globalAlpha = 0.84;
        ctx.fillStyle = "#465b66";
        ctx.beginPath();
        ctx.moveTo(80, 650);
        ctx.bezierCurveTo(170, 440, 210, 420, 260, 250);
        ctx.bezierCurveTo(320, 370, 365, 425, 420, 610);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#ac6749";
        ctx.beginPath();
        ctx.moveTo(330, 675);
        ctx.bezierCurveTo(380, 495, 470, 400, 610, 360);
        ctx.lineTo(690, 710);
        ctx.closePath();
        ctx.fill();

        ctx.globalAlpha = 0.66;
        ctx.fillStyle = "#edc253";
        ctx.beginPath();
        ctx.arc(556, 215, 70, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 0.75;
        ctx.strokeStyle = "#f3ead6";
        ctx.lineCap = "round";
        for (let i = 0; i < 27; i++) {
          ctx.lineWidth = range(5, 24);
          ctx.beginPath();
          ctx.moveTo(range(80, 650), range(90, 820));
          ctx.bezierCurveTo(
            range(100, 670),
            range(90, 820),
            range(100, 670),
            range(90, 820),
            range(100, 670),
            range(90, 820)
          );
          ctx.stroke();
        }

        ctx.globalAlpha = 0.9;
        ctx.strokeStyle = "#313843";
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(310, 840);
        ctx.lineTo(340, 480);
        ctx.lineTo(470, 315);
        ctx.stroke();

        ctx.globalAlpha = 0.15;
        ctx.fillStyle = "#ffffff";
        for (let i = 0; i < 8500; i++) {
          ctx.fillRect(range(0, w), range(0, h), 1, 1);
        }

        ctx.globalAlpha = 1;
      });
    }

    function createEasel() {
      const group = new THREE.Group();
      group.position.set(0.5, 0, -2.7);
      group.rotation.y = -0.14;
      scene.add(group);

      const legLeft = box([0.34, 6.9, 0.34], [-1.45, 3.35, 0], oak, group);
      legLeft.rotation.z = -0.11;

      const legRight = box([0.34, 6.9, 0.34], [1.45, 3.35, 0], oak, group);
      legRight.rotation.z = 0.11;

      const backLeg = box([0.32, 6.4, 0.32], [0, 3.05, 1.55], oak, group);
      backLeg.rotation.x = -0.2;

      box([3.7, 0.38, 0.72], [0, 2.2, -0.1], darkWood, group);
      box([0.28, 7.3, 0.28], [0, 4.15, 0.04], paleWood, group);

      const canvasFrame = new THREE.Group();
      canvasFrame.position.set(0, 5.05, -0.48);
      canvasFrame.rotation.x = -0.03;
      group.add(canvasFrame);

      const artwork = new THREE.MeshStandardMaterial({
        map: paintedCanvasTexture(),
        roughness: 0.92,
        side: THREE.DoubleSide
      });

      box([3.55, 4.45, 0.18], [0, 0, 0], canvasEdge, canvasFrame);
      box([3.32, 4.2, 0.08], [0, 0, -0.13], artwork, canvasFrame);

      box([3.9, 0.3, 0.65], [0, -2.32, 0], darkWood, canvasFrame);
      box([1.15, 0.23, 0.5], [0, 2.35, 0], oak, canvasFrame);

      const rag = new THREE.Group();
      rag.position.set(1.7, 1.88, 0.15);
      canvasFrame.add(rag);

      const ragMat = makeMaterial(0x315d78, 0.96);
      const ragMesh = mesh(
        new THREE.PlaneGeometry(1.15, 1.75, 5, 7),
        ragMat,
        rag
      );
      ragMesh.material.side = THREE.DoubleSide;
      ragMesh.rotation.y = 0.15;

      const position = ragMesh.geometry.attributes.position;
      for (let i = 0; i < position.count; i++) {
        const px = position.getX(i);
        const py = position.getY(i);
        position.setZ(i, Math.sin(px * 7 + py * 3) * 0.07);
      }
      position.needsUpdate = true;

      return group;
    }

    const easel = createEasel();

    function createRollingCart() {
      const group = new THREE.Group();
      group.position.set(5.2, 0, 0.8);
      group.rotation.y = -0.18;
      scene.add(group);

      for (const y of [1.05, 2.45, 3.85]) {
        box([3.4, 0.18, 1.8], [0, y, 0], warmMetal, group);
        box([3.2, 0.46, 0.13], [0, y + 0.22, -0.83], warmMetal, group);
        box([3.2, 0.46, 0.13], [0, y + 0.22, 0.83], warmMetal, group);
      }

      for (const x of [-1.48, 1.48]) {
        for (const z of [-0.72, 0.72]) {
          box([0.18, 3.2, 0.18], [x, 2.45, z], blackMetal, group);
          const wheel = cylinder(0.25, 0.25, 0.13, 16, blackMetal, group);
          wheel.position.set(x, 0.35, z);
          wheel.rotation.z = Math.PI / 2;
        }
      }

      const jarMat = new THREE.MeshPhysicalMaterial({
        color: 0x5b857f,
        roughness: 0.22,
        transmission: 0.12,
        transparent: true,
        opacity: 0.77
      });

      for (let j = 0; j < 3; j++) {
        const jar = cylinder(0.34, 0.3, 0.78, 18, jarMat, group);
        jar.position.set(-0.9 + j * 0.82, 4.33, range(-0.35, 0.35));

        for (let i = 0; i < 7; i++) {
          const brush = new THREE.Group();
          brush.position.set(
            jar.position.x + range(-0.2, 0.2),
            4.72,
            jar.position.z + range(-0.18, 0.18)
          );
          brush.rotation.z = range(-0.2, 0.2);
          brush.rotation.x = range(-0.18, 0.18);
          group.add(brush);

          const handle = cylinder(0.035, 0.045, range(1.25, 1.8), 8, paleWood, brush);
          handle.position.y = 0.62;

          const ferrule = cylinder(0.055, 0.05, 0.25, 8, warmMetal, brush);
          ferrule.position.y = 1.42;

          const bristle = cylinder(0.025, 0.06, 0.32, 8, makeMaterial(0x3b2a21), brush);
          bristle.position.y = 1.69;
        }
      }

      const tubeColors = [0xcb3d39, 0xe5a836, 0x2b7293, 0x557848, 0xe8e1cf];

      for (let shelf = 0; shelf < 2; shelf++) {
        for (let i = 0; i < 9; i++) {
          const tube = new THREE.Group();
          tube.position.set(
            range(-1.25, 1.25),
            shelf ? 2.78 : 1.38,
            range(-0.55, 0.55)
          );
          tube.rotation.y = range(0, Math.PI * 2);
          tube.rotation.z = Math.PI / 2 + range(-0.25, 0.25);
          group.add(tube);

          const body = cylinder(
            0.11,
            0.16,
            range(0.55, 0.8),
            10,
            makeMaterial(choose(tubeColors), 0.5, 0.12),
            tube
          );
          body.rotation.x = Math.PI / 2;

          const cap = cylinder(0.08, 0.08, 0.15, 10, porcelain, tube);
          cap.position.z = 0.4;
          cap.rotation.x = Math.PI / 2;
        }
      }

      return group;
    }

    createRollingCart();

    function createCanvasStack() {
      const group = new THREE.Group();
      group.position.set(-10.5, 0, -9.7);
      group.rotation.y = 0.04;
      scene.add(group);

      const sizes = [
        [3.8, 5.3],
        [3.1, 4.3],
        [4.5, 3.5],
        [2.4, 3.7],
        [3.4, 2.7]
      ];

      sizes.forEach((size, i) => {
        const frame = new THREE.Group();
        frame.position.set(i * 0.42, size[1] / 2, i * 0.35);
        frame.rotation.y = range(-0.13, 0.12);
        frame.rotation.z = range(-0.06, 0.06);
        group.add(frame);

        box(
          [size[0], size[1], 0.2],
          [0, 0, 0],
          i % 2 ? canvasEdge : paleWood,
          frame
        );

        const faceMat = makeMaterial(
          choose([0xd8c7a8, 0xb9c8bf, 0xc89477, 0xc6b790]),
          0.95
        );
        box([size[0] - 0.22, size[1] - 0.22, 0.06], [0, 0, 0.13], faceMat, frame);
      });

      return group;
    }

    createCanvasStack();

    function createSculptureStand() {
      const group = new THREE.Group();
      group.position.set(9.1, 0, -5.2);
      group.rotation.y = 0.18;
      scene.add(group);

      box([2.2, 0.28, 2.2], [0, 0.18, 0], darkWood, group);
      box([1.45, 3.5, 1.45], [0, 1.95, 0], makeMaterial(0x716252, 0.82), group);
      box([2, 0.25, 2], [0, 3.75, 0], oak, group);

      const bust = new THREE.Group();
      bust.position.set(0, 4, 0);
      group.add(bust);

      const base = cylinder(0.68, 0.8, 0.45, 20, clay, bust);
      base.position.y = 0.2;

      const shoulders = mesh(
        new THREE.SphereGeometry(1.08, 28, 20),
        clay,
        bust
      );
      shoulders.scale.set(1.28, 0.56, 0.72);
      shoulders.position.y = 0.72;

      const neck = cylinder(0.35, 0.47, 0.82, 20, clay, bust);
      neck.position.y = 1.28;

      const head = mesh(
        new THREE.SphereGeometry(0.72, 28, 22),
        clay,
        bust
      );
      head.scale.set(0.8, 1.08, 0.83);
      head.position.set(0, 2.04, 0.02);
      head.rotation.z = -0.07;

      const nose = mesh(
        new THREE.ConeGeometry(0.15, 0.42, 12),
        clay,
        bust
      );
      nose.position.set(0, 2.1, 0.64);
      nose.rotation.x = Math.PI / 2;

      for (const x of [-0.25, 0.25]) {
        const eye = mesh(
          new THREE.SphereGeometry(0.075, 12, 8),
          makeMaterial(0x654434),
          bust
        );
        eye.position.set(x, 2.23, 0.61);
        eye.scale.z = 0.4;
      }

      const hair = mesh(
        new THREE.SphereGeometry(0.75, 20, 14, 0, Math.PI * 2, 0, Math.PI * 0.48),
        makeMaterial(0x614132, 0.95),
        bust
      );
      hair.position.set(0, 2.47, 0);
      hair.scale.set(0.84, 0.8, 0.88);

      return bust;
    }

    const bust = createSculptureStand();

    function createLadder() {
      const group = new THREE.Group();
      group.position.set(12.6, 0.2, -9.7);
      group.rotation.z = -0.08;
      group.rotation.x = -0.03;
      scene.add(group);

      box([0.24, 8.3, 0.3], [-1.05, 4.05, 0], paleWood, group);
      box([0.24, 8.3, 0.3], [1.05, 4.05, 0], paleWood, group);

      for (let i = 0; i < 8; i++) {
        box([2.18, 0.2, 0.32], [0, 0.8 + i * 0.93, 0], oak, group);
      }

      const paintCan = cylinder(0.38, 0.34, 0.6, 18, warmMetal, group);
      paintCan.position.set(0.55, 5.7, 0.3);
      paintCan.rotation.z = 0.04;

      const paintTop = cylinder(
        0.32,
        0.32,
        0.025,
        18,
        makeMaterial(0xd5b342, 0.75),
        group
      );
      paintTop.position.set(0.55, 6.01, 0.3);

      return group;
    }

    createLadder();

    function createWorkTable() {
      const group = new THREE.Group();
      group.position.set(-5.4, 0, 3.4);
      group.rotation.y = 0.12;
      scene.add(group);

      box([5.2, 0.32, 2.6], [0, 3.1, 0], darkWood, group);

      for (const x of [-2.25, 2.25]) {
        for (const z of [-1.02, 1.02]) {
          box([0.28, 3.05, 0.28], [x, 1.55, z], oak, group);
        }
      }

      box([4.7, 0.2, 0.22], [0, 1.15, -1.04], oak, group);
      box([4.7, 0.2, 0.22], [0, 1.15, 1.04], oak, group);

      const palette = mesh(
        new THREE.CylinderGeometry(0.75, 0.75, 0.07, 32),
        makeMaterial(0xa96f47, 0.72),
        group
      );
      palette.scale.x = 1.45;
      palette.position.set(-0.7, 3.31, 0);
      palette.rotation.x = Math.PI / 2;
      palette.rotation.z = -0.22;

      const blobs = [
        [0xcf3e3d, -0.35, 0.36],
        [0xe0b837, 0.05, 0.5],
        [0x2d678c, 0.43, 0.22],
        [0xe8ddd0, 0.45, -0.25],
        [0x4f7a55, -0.1, -0.43]
      ];

      for (const [color, x, y] of blobs) {
        const blob = mesh(
          new THREE.SphereGeometry(0.13, 12, 7),
          makeMaterial(color, 0.8),
          group
        );
        blob.scale.set(1.35, 0.38, 1);
        blob.position.set(-0.7 + x, 3.37, y);
      }

      for (let i = 0; i < 5; i++) {
        const bottle = cylinder(
          0.16,
          0.2,
          range(0.52, 0.86),
          14,
          makeMaterial(choose([0x72443b, 0x506b69, 0xc6a766, 0x364d59]), 0.45),
          group
        );
        bottle.position.set(0.6 + i * 0.45, 3.48, range(-0.7, 0.7));

        const neck = cylinder(0.08, 0.11, 0.24, 12, blackMetal, group);
        neck.position.set(bottle.position.x, bottle.position.y + 0.48, bottle.position.z);
      }

      const bookGroup = new THREE.Group();
      bookGroup.position.set(-1.8, 3.35, -0.65);
      bookGroup.rotation.y = -0.2;
      group.add(bookGroup);
      box([1.2, 0.12, 1.7], [-0.56, 0, 0], makeMaterial(0xd9c9a9), bookGroup);
      box([1.2, 0.12, 1.7], [0.56, 0, 0], makeMaterial(0xd9c9a9), bookGroup);
      bookGroup.children[0].rotation.z = -0.05;
      bookGroup.children[1].rotation.z = 0.05;

      return group;
    }

    createWorkTable();

    function createStool() {
      const group = new THREE.Group();
      group.position.set(2.9, 0, 4.7);
      group.rotation.y = 0.35;
      scene.add(group);

      const seat = cylinder(1.05, 1.05, 0.28, 28, oak, group);
      seat.position.y = 2.2;

      for (let i = 0; i < 3; i++) {
        const angle = i / 3 * Math.PI * 2;
        const leg = box(
          [0.2, 2.25, 0.2],
          [Math.cos(angle) * 0.62, 1.05, Math.sin(angle) * 0.62],
          darkWood,
          group
        );
        leg.rotation.z = Math.cos(angle) * 0.13;
        leg.rotation.x = -Math.sin(angle) * 0.13;
      }

      return group;
    }

    createStool();

    const cloths = [];

    function createHangingCloth(x, color, width, length, phase) {
      const geometry = new THREE.PlaneGeometry(width, length, 14, 24);
      const material = new THREE.MeshStandardMaterial({
        color,
        roughness: 0.92,
        side: THREE.DoubleSide
      });
      const cloth = mesh(geometry, material);
      cloth.position.set(x, 9.7, 1.8);
      cloth.rotation.y = range(-0.16, 0.16);

      const positions = geometry.attributes.position;
      const base = new Float32Array(positions.array);

      for (let i = 0; i < positions.count; i++) {
        const px = positions.getX(i);
        const py = positions.getY(i);
        positions.setZ(
          i,
          Math.sin(px * 2.8 + py * 1.4 + phase) * 0.16 +
          Math.sin(py * 3.6) * 0.05
        );
      }

      positions.needsUpdate = true;
      geometry.computeVertexNormals();

      cloth.userData.base = base;
      cloth.userData.phase = phase;
      cloths.push(cloth);

      const rod = cylinder(0.09, 0.09, width + 0.3, 12, blackMetal);
      rod.position.set(x, 12.05, 1.8);
      rod.rotation.z = Math.PI / 2;

      return cloth;
    }

    createHangingCloth(-2.8, 0xb45e47, 2.5, 4.7, 0.2);
    createHangingCloth(-0.3, 0xdbc69d, 2.2, 4.2, 1.5);
    createHangingCloth(2.0, 0x4e7480, 2.15, 4.9, 2.8);

    function createPendantLamp(x, z, cableLength) {
      const group = new THREE.Group();
      group.position.set(x, 12.7, z);
      scene.add(group);

      box([0.05, cableLength, 0.05], [0, -cableLength / 2, 0], blackMetal, group);

      const shade = mesh(
        new THREE.ConeGeometry(0.78, 0.66, 24, 1, true),
        makeMaterial(0x343331, 0.38, 0.55),
        group
      );
      shade.position.y = -cableLength - 0.25;
      shade.rotation.x = Math.PI;

      const bulbMat = new THREE.MeshStandardMaterial({
        color: 0xffd89a,
        emissive: 0xffa840,
        emissiveIntensity: 2.3,
        roughness: 0.25
      });
      const bulb = mesh(
        new THREE.SphereGeometry(0.18, 16, 12),
        bulbMat,
        group
      );
      bulb.position.y = -cableLength - 0.34;

      const light = new THREE.PointLight(0xffb665, 22, 8, 2);
      light.position.y = -cableLength - 0.45;
      light.castShadow = true;
      light.shadow.mapSize.set(512, 512);
      group.add(light);

      group.userData.phase = range(0, Math.PI * 2);
      return group;
    }

    const pendantA = createPendantLamp(-6.5, 2.5, 2.6);
    const pendantB = createPendantLamp(7.1, 3.4, 3.15);

    function createPaintCans() {
      const group = new THREE.Group();
      group.position.set(8.6, 0, 4.3);
      scene.add(group);

      const colors = [0x426f78, 0xb54d43, 0xe0b94b, 0xe3dfca];

      for (let i = 0; i < 6; i++) {
        const radius = range(0.32, 0.52);
        const can = cylinder(
          radius,
          radius * 0.94,
          range(0.55, 0.9),
          20,
          warmMetal,
          group
        );
        can.position.set(range(-1.3, 1.3), can.geometry.parameters.height / 2, range(-1, 1));

        const paint = cylinder(
          radius * 0.86,
          radius * 0.86,
          0.025,
          20,
          makeMaterial(colors[i % colors.length], 0.8),
          group
        );
        paint.position.set(
          can.position.x,
          can.position.y + can.geometry.parameters.height / 2 + 0.014,
          can.position.z
        );

        const handleCurve = new THREE.EllipseCurve(
          0,
          0,
          radius * 1.12,
          radius * 1.12,
          0,
          Math.PI,
          false,
          0
        );
        const points = handleCurve.getPoints(18).map(
          p => new THREE.Vector3(p.x, p.y, 0)
        );
        const handleGeometry = new THREE.TubeGeometry(
          new THREE.CatmullRomCurve3(points),
          18,
          0.025,
          6,
          false
        );
        const handle = mesh(handleGeometry, blackMetal, group);
        handle.position.set(
          can.position.x,
          can.position.y + 0.1,
          can.position.z
        );
        handle.rotation.x = Math.PI / 2;
      }
    }

    createPaintCans();

    function createRug() {
      const texture = canvasTexture(512, 768, (ctx, w, h) => {
        ctx.fillStyle = "#7a4c3e";
        ctx.fillRect(0, 0, w, h);

        for (let y = 0; y < h; y += 60) {
          ctx.fillStyle = y % 120 ? "#b27354" : "#456a70";
          ctx.fillRect(0, y, w, 28);
        }

        ctx.strokeStyle = "#d1b574";
        ctx.lineWidth = 13;
        for (let x = -h; x < w + h; x += 75) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x + h, h);
          ctx.stroke();
        }

        ctx.globalAlpha = 0.25;
        for (let i = 0; i < 1000; i++) {
          ctx.fillStyle = random() > 0.5 ? "#fff3d3" : "#2b2522";
          ctx.fillRect(range(0, w), range(0, h), 2, 2);
        }
        ctx.globalAlpha = 1;
      });

      const material = new THREE.MeshStandardMaterial({
        map: texture,
        roughness: 1
      });

      const rug = mesh(new THREE.PlaneGeometry(5.4, 7.8), material);
      rug.rotation.x = -Math.PI / 2;
      rug.rotation.z = -0.13;
      rug.position.set(0.8, 0.018, 3.3);
      rug.receiveShadow = true;
    }

    createRug();

    const dustGeometry = new THREE.BufferGeometry();
    const dustCount = 420;
    const dustPositions = new Float32Array(dustCount * 3);
    const dustPhases = new Float32Array(dustCount);

    for (let i = 0; i < dustCount; i++) {
      dustPositions[i * 3] = range(-13.5, 13.5);
      dustPositions[i * 3 + 1] = range(0.4, 12.2);
      dustPositions[i * 3 + 2] = range(-10.8, 10.8);
      dustPhases[i] = range(0, Math.PI * 2);
    }

    dustGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(dustPositions, 3)
    );

    const dustMaterial = new THREE.PointsMaterial({
      color: 0xffedbd,
      size: 0.035,
      transparent: true,
      opacity: 0.48,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const dust = new THREE.Points(dustGeometry, dustMaterial);
    scene.add(dust);

    const lightPoolMaterial = new THREE.MeshBasicMaterial({
      color: 0xffd68a,
      transparent: true,
      opacity: 0.13,
      side: THREE.DoubleSide,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    for (let i = 0; i < 3; i++) {
      const pool = mesh(
        new THREE.CircleGeometry(2.3 + i * 0.8, 40),
        lightPoolMaterial.clone()
      );
      pool.rotation.x = -Math.PI / 2;
      pool.scale.y = 0.45;
      pool.position.set(-4 + i * 2.4, 0.025 + i * 0.001, -1 + i * 1.2);
    }

    function createShelves() {
      const group = new THREE.Group();
      group.position.set(12.7, 0, 5);
      scene.add(group);

      for (const x of [-1.15, 1.15]) {
        box([0.18, 6.2, 0.18], [x, 3.1, 0], blackMetal, group);
      }

      for (let y = 0.8; y <= 5.7; y += 1.22) {
        box([2.8, 0.18, 1.25], [0, y, 0], darkWood, group);

        const count = 3 + Math.floor(random() * 3);
        for (let i = 0; i < count; i++) {
          const objectColor = choose([
            0x9e6548,
            0x416a71,
            0xc49a4e,
            0xd6cbb5,
            0x6f5049
          ]);

          if (random() > 0.45) {
            const pot = cylinder(
              range(0.18, 0.32),
              range(0.2, 0.36),
              range(0.35, 0.72),
              14,
              makeMaterial(objectColor, 0.82),
              group
            );
            pot.position.set(
              -0.95 + i * 0.48,
              y + 0.28,
              range(-0.35, 0.35)
            );
          } else {
            const book = box(
              [range(0.16, 0.28), range(0.55, 0.9), 0.65],
              [-0.95 + i * 0.48, y + 0.38, range(-0.2, 0.25)],
              makeMaterial(objectColor, 0.72),
              group
            );
            book.rotation.z = range(-0.1, 0.1);
          }
        }
      }
    }

    createShelves();

    const clock = new THREE.Clock();

    function animateCloth(cloth, time) {
      const position = cloth.geometry.attributes.position;
      const base = cloth.userData.base;
      const phase = cloth.userData.phase;

      for (let i = 0; i < position.count; i++) {
        const x = base[i * 3];
        const y = base[i * 3 + 1];
        const vertical = (y + 2.5) / 5;
        const sway =
          Math.sin(time * 0.72 + phase + y * 1.25) * 0.09 +
          Math.sin(time * 1.1 + x * 2.5) * 0.035;
        position.setZ(
          i,
          base[i * 3 + 2] +
          Math.sin(x * 2.8 + y * 1.4 + phase) * 0.13 +
          sway * (1.15 - vertical * 0.35)
        );
      }

      position.needsUpdate = true;
      cloth.geometry.computeVertexNormals();
    }

    function animate() {
      requestAnimationFrame(animate);

      const time = clock.getElapsedTime();
      controls.update();

      for (const cloth of cloths) {
        animateCloth(cloth, time);
      }

      pendantA.rotation.z = Math.sin(time * 0.42 + pendantA.userData.phase) * 0.018;
      pendantA.rotation.x = Math.sin(time * 0.31) * 0.012;
      pendantB.rotation.z = Math.sin(time * 0.37 + pendantB.userData.phase) * 0.022;
      pendantB.rotation.x = Math.sin(time * 0.29 + 1.2) * 0.01;

      bust.rotation.y = Math.sin(time * 0.22) * 0.035;

      const positions = dust.geometry.attributes.position;
      for (let i = 0; i < dustCount; i++) {
        let y = positions.getY(i);
        y += 0.0025 + Math.sin(time * 0.5 + dustPhases[i]) * 0.0015;
        if (y > 12.3) {
          y = 0.35;
        }
        positions.setY(i, y);
        positions.setX(
          i,
          dustPositions[i * 3] +
          Math.sin(time * 0.16 + dustPhases[i]) * 0.16
        );
      }
      positions.needsUpdate = true;

      dustMaterial.opacity = 0.41 + Math.sin(time * 0.38) * 0.07;
      skylightGlow.intensity = 7.6 + Math.sin(time * 0.16) * 0.35;
      sun.intensity = 4.15 + Math.sin(time * 0.12) * 0.08;

      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
