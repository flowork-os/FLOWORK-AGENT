<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amigurumi Hedgehog</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(circle at 50% 35%, #f7ead2 0%, #dfcaaa 52%, #b99e7e 100%);
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xead8bd);
scene.fog = new THREE.Fog(0xead8bd, 10, 18);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.8, 3.7, 7.7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.45, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 5.5;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.77;

scene.add(new THREE.HemisphereLight(0xfff4dd, 0x70533e, 2.2));

const keyLight = new THREE.DirectionalLight(0xffe6c5, 4.1);
keyLight.position.set(4.5, 7.5, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -5;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 18;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xd59a62, 2.3);
rimLight.position.set(-5, 3.5, -5);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0xfff0d6, 1.4, 12);
fillLight.position.set(-3.2, 2.5, 4);
scene.add(fillLight);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(7, 96),
  new THREE.MeshStandardMaterial({ color: 0xcbb08f, roughness: 0.96, metalness: 0 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.75;
floor.receiveShadow = true;
scene.add(floor);

const shadowDisc = new THREE.Mesh(
  new THREE.CircleGeometry(2.1, 64),
  new THREE.MeshBasicMaterial({
    color: 0x6e4934,
    transparent: true,
    opacity: 0.12,
    depthWrite: false
  })
);
shadowDisc.rotation.x = -Math.PI / 2;
shadowDisc.position.y = -1.735;
scene.add(shadowDisc);

const hedgehog = new THREE.Group();
hedgehog.rotation.x = -0.03;
scene.add(hedgehog);

const oatmeal = new THREE.MeshStandardMaterial({
  color: 0xd8b987,
  roughness: 0.93,
  metalness: 0
});
const oatmealLight = new THREE.MeshStandardMaterial({
  color: 0xe5c99b,
  roughness: 0.96
});
const caramel = new THREE.MeshStandardMaterial({
  color: 0x9a5d2d,
  roughness: 0.92
});
const darkYarn = new THREE.MeshStandardMaterial({
  color: 0x40281d,
  roughness: 0.9
});
const blackFelt = new THREE.MeshStandardMaterial({
  color: 0x090706,
  roughness: 0.53,
  metalness: 0.03
});
const eyeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x080605,
  roughness: 0.16,
  metalness: 0.08,
  clearcoat: 1,
  clearcoatRoughness: 0.1
});

function shadowify(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function ellipsoid(radius, segments, material, scale, position) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(radius, segments, Math.floor(segments * 0.72)),
    material
  );
  mesh.scale.copy(scale);
  mesh.position.copy(position);
  return shadowify(mesh);
}

const body = ellipsoid(
  1,
  64,
  caramel,
  new THREE.Vector3(1.48, 1.72, 1.28),
  new THREE.Vector3(0, -0.02, -0.12)
);
hedgehog.add(body);

const face = ellipsoid(
  1,
  64,
  oatmeal,
  new THREE.Vector3(1.01, 1.35, 0.61),
  new THREE.Vector3(0, 0.08, 0.96)
);
face.rotation.x = -0.06;
hedgehog.add(face);

const muzzle = ellipsoid(
  1,
  48,
  oatmealLight,
  new THREE.Vector3(0.59, 0.55, 0.68),
  new THREE.Vector3(0, -0.42, 1.52)
);
muzzle.rotation.x = -0.15;
hedgehog.add(muzzle);

const browCap = ellipsoid(
  1,
  48,
  oatmeal,
  new THREE.Vector3(0.86, 0.62, 0.42),
  new THREE.Vector3(0, 0.78, 1.13)
);
hedgehog.add(browCap);

const nose = ellipsoid(
  1,
  40,
  blackFelt,
  new THREE.Vector3(0.28, 0.23, 0.27),
  new THREE.Vector3(0, -0.45, 2.11)
);
nose.rotation.x = 0.15;
hedgehog.add(nose);

const noseHighlight = new THREE.Mesh(
  new THREE.SphereGeometry(0.052, 20, 14),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.72 })
);
noseHighlight.position.set(-0.075, -0.37, 2.345);
hedgehog.add(noseHighlight);

function createEye(x) {
  const eyeGroup = new THREE.Group();
  eyeGroup.position.set(x, 0.28, 1.57);

  const socket = ellipsoid(
    1,
    28,
    darkYarn,
    new THREE.Vector3(0.185, 0.205, 0.09),
    new THREE.Vector3(0, 0, -0.035)
  );
  eyeGroup.add(socket);

  const eye = ellipsoid(
    1,
    32,
    eyeMaterial,
    new THREE.Vector3(0.14, 0.15, 0.12),
    new THREE.Vector3(0, 0, 0.05)
  );
  eyeGroup.add(eye);

  const glint = new THREE.Mesh(
    new THREE.SphereGeometry(0.031, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  glint.position.set(-0.042, 0.052, 0.154);
  eyeGroup.add(glint);

  hedgehog.add(eyeGroup);
}
createEye(-0.42);
createEye(0.42);

function makeEar(x) {
  const earGroup = new THREE.Group();
  earGroup.position.set(x, 0.91, 0.55);
  earGroup.rotation.z = x < 0 ? 0.24 : -0.24;
  earGroup.rotation.y = x < 0 ? -0.16 : 0.16;

  const outer = ellipsoid(
    1,
    40,
    oatmeal,
    new THREE.Vector3(0.39, 0.45, 0.18),
    new THREE.Vector3(0, 0, 0)
  );
  earGroup.add(outer);

  const inner = ellipsoid(
    1,
    32,
    new THREE.MeshStandardMaterial({ color: 0xb17b59, roughness: 0.97 }),
    new THREE.Vector3(0.23, 0.29, 0.07),
    new THREE.Vector3(0, 0.01, 0.17)
  );
  earGroup.add(inner);
  hedgehog.add(earGroup);
}
makeEar(-0.91);
makeEar(0.91);

function makePaw(x, y, z, rotationZ, scale) {
  const paw = new THREE.Group();
  paw.position.set(x, y, z);
  paw.rotation.z = rotationZ;
  paw.rotation.x = -0.1;

  const limb = ellipsoid(
    1,
    40,
    oatmealLight,
    new THREE.Vector3(0.34 * scale, 0.55 * scale, 0.34 * scale),
    new THREE.Vector3(0, 0, 0)
  );
  paw.add(limb);

  const threadMat = new THREE.MeshStandardMaterial({ color: 0xbc9565, roughness: 1 });
  for (let i = -1; i <= 1; i++) {
    const seam = new THREE.Mesh(
      new THREE.TorusGeometry(0.19 * scale, 0.018, 8, 24, Math.PI * 0.9),
      threadMat
    );
    seam.position.set(0, i * 0.12 * scale, 0.29 * scale);
    seam.rotation.z = Math.PI * 0.05;
    seam.rotation.x = 0.15;
    paw.add(seam);
  }
  hedgehog.add(paw);
}
makePaw(-0.98, -0.58, 0.87, -0.48, 0.93);
makePaw(0.98, -0.58, 0.87, 0.48, 0.93);
makePaw(-0.69, -1.37, 0.33, -0.2, 1.05);
makePaw(0.69, -1.37, 0.33, 0.2, 1.05);

function seededRandom(seed) {
  let state = seed >>> 0;
  return function () {
    state = (state * 1664525 + 1013904223) >>> 0;
    return state / 4294967296;
  };
}
const random = seededRandom(73129);

const loopGeometry = new THREE.TorusGeometry(0.115, 0.037, 8, 18);
const loopMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x4b2c1c, roughness: 0.95 }),
  new THREE.MeshStandardMaterial({ color: 0x684026, roughness: 0.94 }),
  new THREE.MeshStandardMaterial({ color: 0x88532c, roughness: 0.94 }),
  new THREE.MeshStandardMaterial({ color: 0xa96b34, roughness: 0.93 }),
  new THREE.MeshStandardMaterial({ color: 0xc48545, roughness: 0.92 })
];

const loopCounts = [0, 0, 0, 0, 0];
const loopData = [];
const rowCount = 17;
for (let row = 0; row < rowCount; row++) {
  const v = -1.22 + row * 0.145;
  const normalizedY = v / 1.62;
  const rowRadius = Math.sqrt(Math.max(0.04, 1 - normalizedY * normalizedY));
  const count = Math.max(8, Math.floor(25 * rowRadius));
  for (let j = 0; j < count; j++) {
    const angle = (j / count) * Math.PI * 1.62 + Math.PI * 0.69;
    const x = Math.cos(angle) * 1.46 * rowRadius;
    const z = Math.sin(angle) * 1.21 * rowRadius - 0.13;
    if (z > 0.74 && Math.abs(x) < 0.9) continue;

    const jitter = (random() - 0.5) * 0.075;
    const px = x + (random() - 0.5) * 0.075;
    const py = v + jitter;
    const pz = z + (random() - 0.5) * 0.055;

    const shade = Math.min(4, Math.floor(random() * 5));
    loopData.push({
      position: new THREE.Vector3(px, py, pz),
      scale: 0.82 + random() * 0.45,
      twist: (random() - 0.5) * 0.85,
      shade
    });
    loopCounts[shade]++;
  }
}

const loopMeshes = loopCounts.map((count, index) => {
  const mesh = new THREE.InstancedMesh(loopGeometry, loopMaterials[index], count);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  hedgehog.add(mesh);
  return mesh;
});

const loopIndices = [0, 0, 0, 0, 0];
const dummy = new THREE.Object3D();
const outward = new THREE.Vector3();
const loopNormal = new THREE.Vector3(0, 0, 1);

for (const item of loopData) {
  outward.set(
    item.position.x / (1.48 * 1.48),
    item.position.y / (1.72 * 1.72),
    (item.position.z + 0.12) / (1.28 * 1.28)
  ).normalize();

  dummy.position.copy(item.position).addScaledVector(outward, 0.075);
  dummy.quaternion.setFromUnitVectors(loopNormal, outward);
  dummy.rotateZ(item.twist);
  dummy.scale.setScalar(item.scale);
  dummy.updateMatrix();

  loopMeshes[item.shade].setMatrixAt(loopIndices[item.shade]++, dummy.matrix);
}
for (const mesh of loopMeshes) mesh.instanceMatrix.needsUpdate = true;

const bobbleGeometry = new THREE.IcosahedronGeometry(0.105, 2);
const bobbleMeshes = loopCounts.map((count, index) => {
  const mesh = new THREE.InstancedMesh(bobbleGeometry, loopMaterials[index], count);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  hedgehog.add(mesh);
  return mesh;
});

const bobbleIndices = [0, 0, 0, 0, 0];
for (const item of loopData) {
  outward.set(
    item.position.x / (1.48 * 1.48),
    item.position.y / (1.72 * 1.72),
    (item.position.z + 0.12) / (1.28 * 1.28)
  ).normalize();

  dummy.position.copy(item.position).addScaledVector(outward, -0.006);
  dummy.quaternion.identity();
  dummy.rotation.set(random() * Math.PI, random() * Math.PI, random() * Math.PI);
  const bobbleScale = item.scale * (0.75 + random() * 0.24);
  dummy.scale.set(bobbleScale, bobbleScale * 0.78, bobbleScale);
  dummy.updateMatrix();

  bobbleMeshes[item.shade].setMatrixAt(bobbleIndices[item.shade]++, dummy.matrix);
}
for (const mesh of bobbleMeshes) mesh.instanceMatrix.needsUpdate = true;

function tubeFromPoints(points, radius, material, tubularSegments = 80, radialSegments = 7) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const mesh = new THREE.Mesh(
    new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, false),
    material
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const stitchMaterial = new THREE.MeshStandardMaterial({
  color: 0xc7a36f,
  roughness: 1
});

for (let ring = 0; ring < 8; ring++) {
  const y = -0.9 + ring * 0.235;
  const normalized = (y - 0.04) / 1.33;
  const width = 0.88 * Math.sqrt(Math.max(0.08, 1 - normalized * normalized));
  const points = [];
  for (let i = 0; i <= 46; i++) {
    const theta = -1.22 + (i / 46) * 2.44;
    const x = Math.sin(theta) * width;
    const localDepth = Math.cos(theta) * 0.29;
    const z = 1.535 + localDepth - Math.abs(y + 0.05) * 0.035;
    points.push(new THREE.Vector3(x, y + Math.sin(theta * 4 + ring) * 0.008, z));
  }
  const line = tubeFromPoints(points, 0.021, stitchMaterial, 72, 6);
  hedgehog.add(line);
}

const muzzleSpiralPoints = [];
for (let i = 0; i <= 130; i++) {
  const t = i / 130;
  const angle = t * Math.PI * 5.5;
  const radius = 0.06 + t * 0.49;
  const x = Math.cos(angle) * radius;
  const y = -0.45 + Math.sin(angle) * radius * 0.72;
  const z = 2.03 - radius * radius * 0.54;
  muzzleSpiralPoints.push(new THREE.Vector3(x, y, z));
}
hedgehog.add(tubeFromPoints(muzzleSpiralPoints, 0.018, stitchMaterial, 150, 6));

const faceStitchGeometry = new THREE.CylinderGeometry(0.014, 0.014, 0.12, 7);
const faceStitches = new THREE.InstancedMesh(faceStitchGeometry, stitchMaterial, 58);
faceStitches.castShadow = true;
let stitchIndex = 0;
for (let row = 0; row < 7; row++) {
  const y = -0.72 + row * 0.225;
  const maxX = 0.73 - Math.abs(y - 0.04) * 0.18;
  const columns = 7 + (row % 2);
  for (let col = 0; col < columns && stitchIndex < 58; col++) {
    const x = -maxX + (col + 0.5) * (2 * maxX / columns);
    if (Math.abs(x) < 0.2 && y < -0.25) continue;
    dummy.position.set(x, y + 0.055, 1.855 - x * x * 0.22);
    dummy.rotation.set(0.18, 0, x < 0 ? -0.62 : 0.62);
    dummy.scale.set(1, 1, 1);
    dummy.updateMatrix();
    faceStitches.setMatrixAt(stitchIndex++, dummy.matrix);
  }
}
faceStitches.count = stitchIndex;
faceStitches.instanceMatrix.needsUpdate = true;
hedgehog.add(faceStitches);

const smileMaterial = new THREE.MeshStandardMaterial({
  color: 0x251713,
  roughness: 0.92
});

const smileLeft = tubeFromPoints([
  new THREE.Vector3(-0.03, -0.68, 2.145),
  new THREE.Vector3(-0.13, -0.75, 2.13),
  new THREE.Vector3(-0.27, -0.78, 2.075),
  new THREE.Vector3(-0.39, -0.74, 2.015)
], 0.022, smileMaterial, 30, 7);

const smileRight = tubeFromPoints([
  new THREE.Vector3(0.03, -0.68, 2.145),
  new THREE.Vector3(0.13, -0.75, 2.13),
  new THREE.Vector3(0.27, -0.78, 2.075),
  new THREE.Vector3(0.39, -0.74, 2.015)
], 0.022, smileMaterial, 30, 7);

hedgehog.add(smileLeft, smileRight);

const mouthStem = tubeFromPoints([
  new THREE.Vector3(0, -0.59, 2.16),
  new THREE.Vector3(0, -0.65, 2.16),
  new THREE.Vector3(0, -0.7, 2.15)
], 0.018, smileMaterial, 14, 7);
hedgehog.add(mouthStem);

const fiberGeometry = new THREE.CylinderGeometry(0.004, 0.004, 0.11, 5);
const fiberMaterial = new THREE.MeshStandardMaterial({
  color: 0xefd6a9,
  roughness: 1,
  transparent: true,
  opacity: 0.72
});
const fibers = new THREE.InstancedMesh(fiberGeometry, fiberMaterial, 85);
for (let i = 0; i < 85; i++) {
  const phi = random() * Math.PI * 2;
  const y = -1.15 + random() * 2.35;
  const ny = (y - 0.05) / 1.35;
  const radial = Math.sqrt(Math.max(0.04, 1 - ny * ny));
  const x = Math.cos(phi) * 0.92 * radial;
  const z = 1.04 + Math.sin(phi) * 0.5 * radial;
  const normal = new THREE.Vector3(x / 0.9, ny, (z - 1.04) / 0.5).normalize();

  dummy.position.set(x, y, z).addScaledVector(normal, 0.05);
  dummy.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
  dummy.rotateY(random() * Math.PI);
  dummy.scale.set(1, 0.6 + random() * 0.8, 1);
  dummy.updateMatrix();
  fibers.setMatrixAt(i, dummy.matrix);
}
fibers.instanceMatrix.needsUpdate = true;
hedgehog.add(fibers);

hedgehog.position.y = 0.02;

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
