<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrara Marble Lion</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(circle at 50% 35%, #343638 0%, #17191b 72%, #0d0e0f 100%);
      font-family: Georgia, serif;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      color: rgba(236, 233, 224, 0.72);
      text-align: center;
      pointer-events: none;
      letter-spacing: 0.25em;
      font-size: 11px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px #000;
    }
    .label span {
      display: block;
      margin-top: 7px;
      color: rgba(205, 202, 194, 0.4);
      font-size: 8px;
      letter-spacing: 0.4em;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Lion of Carrara<span>Carved Marble Study</span></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x17191b);
    scene.fog = new THREE.FogExp2(0x17191b, 0.022);

    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 0.4, 13.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.42;
    controls.minDistance = 8.5;
    controls.maxDistance = 19;
    controls.target.set(0, 0.05, 0);
    controls.maxPolarAngle = Math.PI * 0.72;

    const hemi = new THREE.HemisphereLight(0xdde4ec, 0x302920, 1.25);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xfff1dc, 4.7);
    key.position.set(-5.5, 7.5, 8);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -7;
    key.shadow.camera.right = 7;
    key.shadow.camera.top = 7;
    key.shadow.camera.bottom = -7;
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 25;
    key.shadow.bias = -0.0004;
    scene.add(key);

    const rim = new THREE.SpotLight(0xb9d3e8, 6.5, 28, Math.PI / 5, 0.65, 1.5);
    rim.position.set(6, 4, -2);
    rim.target.position.set(0, 0, 0);
    scene.add(rim, rim.target);

    const warmFill = new THREE.PointLight(0xffc892, 2.2, 18, 2);
    warmFill.position.set(-5, -2, 5);
    scene.add(warmFill);

    function marbleMaterial(baseColor = 0xe5e2d8, roughness = 0.3, veinStrength = 0.75) {
      const material = new THREE.MeshPhysicalMaterial({
        color: baseColor,
        roughness,
        metalness: 0.02,
        clearcoat: 0.18,
        clearcoatRoughness: 0.32
      });

      material.onBeforeCompile = shader => {
        shader.uniforms.veinStrength = { value: veinStrength };
        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            `#include <common>
             varying vec3 vMarblePosition;`
          )
          .replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
             vMarblePosition = position;`
          );

        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            `#include <common>
             varying vec3 vMarblePosition;
             uniform float veinStrength;

             float marbleHash(vec3 p) {
               p = fract(p * 0.3183099 + vec3(0.17, 0.31, 0.53));
               p *= 17.0;
               return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
             }

             float marbleNoise(vec3 p) {
               vec3 i = floor(p);
               vec3 f = fract(p);
               f = f * f * (3.0 - 2.0 * f);
               return mix(
                 mix(mix(marbleHash(i), marbleHash(i + vec3(1,0,0)), f.x),
                     mix(marbleHash(i + vec3(0,1,0)), marbleHash(i + vec3(1,1,0)), f.x), f.y),
                 mix(mix(marbleHash(i + vec3(0,0,1)), marbleHash(i + vec3(1,0,1)), f.x),
                     mix(marbleHash(i + vec3(0,1,1)), marbleHash(i + vec3(1,1,1)), f.x), f.y),
                 f.z
               );
             }`
          )
          .replace(
            '#include <color_fragment>',
            `#include <color_fragment>
             vec3 mp = vMarblePosition;
             float broadNoise = marbleNoise(mp * 1.45);
             float fineNoise = marbleNoise(mp * 5.5);
             float diagonal = mp.x * 1.05 + mp.y * 0.58 + mp.z * 0.32;
             float wave = sin(diagonal * 4.2 + broadNoise * 5.5);
             float thinVein = smoothstep(0.82, 0.985, abs(wave));
             float hairVein = smoothstep(0.935, 0.995,
               abs(sin(diagonal * 10.3 + fineNoise * 3.0)));
             float cloud = smoothstep(0.35, 0.88, broadNoise) * 0.08;
             vec3 veinColor = vec3(0.33, 0.35, 0.36);
             diffuseColor.rgb = mix(diffuseColor.rgb, veinColor,
               (thinVein * 0.32 + hairVein * 0.2) * veinStrength);
             diffuseColor.rgb *= 1.0 - cloud * veinStrength;`
          )
          .replace(
            '#include <roughnessmap_fragment>',
            `#include <roughnessmap_fragment>
             float surfaceVariation = marbleNoise(vMarblePosition * 7.0);
             roughnessFactor = clamp(roughnessFactor + surfaceVariation * 0.14 - 0.05, 0.12, 0.82);`
          );
      };
      material.customProgramCacheKey = () => `marble-${roughness}-${veinStrength}-${baseColor}`;
      return material;
    }

    const polishedMarble = marbleMaterial(0xe8e5dc, 0.24, 0.92);
    const softMarble = marbleMaterial(0xdcd9d0, 0.39, 0.72);
    const roughMarble = marbleMaterial(0xc9c6bd, 0.68, 0.55);
    const toothMarble = marbleMaterial(0xf0ede3, 0.2, 0.25);
    const eyeMarble = marbleMaterial(0xd2d3cf, 0.19, 0.15);
    const darkStone = new THREE.MeshStandardMaterial({
      color: 0x242526,
      roughness: 0.93,
      metalness: 0
    });

    const lion = new THREE.Group();
    lion.rotation.x = -0.025;
    scene.add(lion);

    function prepare(mesh, cast = true, receive = true) {
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      lion.add(mesh);
      return mesh;
    }

    function ellipsoid(name, position, scale, material, segments = 48) {
      const geometry = new THREE.SphereGeometry(1, segments, Math.max(20, segments / 2));
      const mesh = new THREE.Mesh(geometry, material);
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      mesh.scale.set(scale[0], scale[1], scale[2]);
      return prepare(mesh);
    }

    function roughenGeometry(geometry, amount, seedOffset = 0) {
      const position = geometry.attributes.position;
      const normal = geometry.attributes.normal;
      for (let i = 0; i < position.count; i++) {
        const x = position.getX(i);
        const y = position.getY(i);
        const z = position.getZ(i);
        const noise =
          Math.sin(x * 17.13 + y * 9.71 + z * 13.37 + seedOffset) *
          Math.sin(x * 6.41 - y * 14.17 + z * 8.73 + seedOffset * 0.7);
        const displacement = noise * amount;
        position.setXYZ(
          i,
          x + normal.getX(i) * displacement,
          y + normal.getY(i) * displacement,
          z + normal.getZ(i) * displacement
        );
      }
      position.needsUpdate = true;
      geometry.computeVertexNormals();
    }

    const maneCoreGeometry = new THREE.SphereGeometry(1, 56, 40);
    roughenGeometry(maneCoreGeometry, 0.035, 2.1);
    const maneCore = new THREE.Mesh(maneCoreGeometry, roughMarble);
    maneCore.position.set(0, 0.02, -0.45);
    maneCore.scale.set(3.12, 3.62, 0.92);
    prepare(maneCore);

    const scrollDefinitions = [
      [2.12, 2.10, 0.72, 0.15],
      [2.46, 1.10, 0.82, 0.60],
      [2.57, 0.00, 0.88, 1.05],
      [2.45, -1.10, 0.84, 1.45],
      [2.05, -2.13, 0.76, 1.95],
      [1.23, 2.74, 0.68, -0.65],
      [1.16, -2.83, 0.72, 2.55]
    ];

    function createScroll(side, cx, cy, size, phase, index) {
      const points = [];
      const count = 54;
      for (let i = 0; i < count; i++) {
        const t = i / (count - 1);
        const angle = phase + t * Math.PI * 3.45;
        const radius = size * (1.12 - 0.91 * t);
        const localX = radius * Math.cos(angle);
        const localY = radius * Math.sin(angle);
        const x = side * (cx + localX);
        const y = cy + localY;
        const z = -0.04 + 0.28 * Math.sin(t * Math.PI) + 0.08 * Math.cos(angle);
        points.push(new THREE.Vector3(x, y, z));
      }
      const curve = new THREE.CatmullRomCurve3(points);
      const geometry = new THREE.TubeGeometry(curve, 90, size * 0.265, 10, false);
      roughenGeometry(geometry, 0.012 + index * 0.0005, index * 2.7);
      const scroll = new THREE.Mesh(geometry, index % 2 === 0 ? softMarble : roughMarble);
      prepare(scroll);
    }

    for (let side = -1; side <= 1; side += 2) {
      scrollDefinitions.forEach((definition, index) => {
        createScroll(side, definition[0], definition[1], definition[2], definition[3], index);
      });
    }

    const crownScrolls = [
      [-0.72, 3.05, 0.66, 0.4],
      [0, 3.28, 0.7, -0.45],
      [0.72, 3.05, 0.66, 2.1]
    ];

    crownScrolls.forEach((definition, index) => {
      const points = [];
      for (let i = 0; i < 45; i++) {
        const t = i / 44;
        const angle = definition[3] + t * Math.PI * 3;
        const radius = definition[2] * (1 - t * 0.82);
        points.push(new THREE.Vector3(
          definition[0] + Math.cos(angle) * radius,
          definition[1] + Math.sin(angle) * radius * 0.72,
          -0.05 + Math.sin(t * Math.PI) * 0.25
        ));
      }
      const curve = new THREE.CatmullRomCurve3(points);
      const geometry = new THREE.TubeGeometry(curve, 72, 0.19, 10, false);
      roughenGeometry(geometry, 0.012, 20 + index);
      prepare(new THREE.Mesh(geometry, softMarble));
    });

    const earGeometry = new THREE.ConeGeometry(0.83, 1.65, 5, 2);
    roughenGeometry(earGeometry, 0.025, 31);

    const leftEar = new THREE.Mesh(earGeometry, softMarble);
    leftEar.position.set(-2.05, 2.38, -0.05);
    leftEar.rotation.set(0.08, 0.12, -0.58);
    leftEar.scale.set(0.78, 1, 0.45);
    prepare(leftEar);

    const rightEar = new THREE.Mesh(earGeometry.clone(), softMarble);
    rightEar.position.set(2.05, 2.38, -0.05);
    rightEar.rotation.set(0.08, -0.12, 0.58);
    rightEar.scale.set(0.78, 1, 0.45);
    prepare(rightEar);

    ellipsoid('Head', [0, 0.42, 0.52], [1.72, 2.34, 1.23], polishedMarble, 64);
    ellipsoid('TempleL', [-1.3, 0.63, 0.72], [0.7, 1.44, 0.72], softMarble);
    ellipsoid('TempleR', [1.3, 0.63, 0.72], [0.7, 1.44, 0.72], softMarble);

    const forehead = ellipsoid('Forehead', [0, 1.48, 1.13], [1.35, 1.05, 0.58], polishedMarble);
    forehead.rotation.x = -0.08;

    const noseBridge = ellipsoid('NoseBridge', [0, 0.45, 1.6], [0.47, 1.17, 0.47], polishedMarble);
    noseBridge.rotation.x = -0.08;

    ellipsoid('LeftEyeSocket', [-0.69, 0.91, 1.49], [0.63, 0.42, 0.25], darkStone, 40);
    ellipsoid('RightEyeSocket', [0.69, 0.91, 1.49], [0.63, 0.42, 0.25], darkStone, 40);
    ellipsoid('LeftEye', [-0.69, 0.91, 1.69], [0.42, 0.27, 0.15], eyeMarble, 40);
    ellipsoid('RightEye', [0.69, 0.91, 1.69], [0.42, 0.27, 0.15], eyeMarble, 40);

    const leftBrow = ellipsoid('LeftBrow', [-0.72, 1.36, 1.66], [0.86, 0.27, 0.29], softMarble);
    leftBrow.rotation.z = -0.27;
    const rightBrow = ellipsoid('RightBrow', [0.72, 1.36, 1.66], [0.86, 0.27, 0.29], softMarble);
    rightBrow.rotation.z = 0.27;

    const centerFurrow = new THREE.Mesh(
      new THREE.ConeGeometry(0.22, 0.92, 5),
      roughMarble
    );
    centerFurrow.position.set(0, 1.58, 1.69);
    centerFurrow.rotation.z = Math.PI;
    centerFurrow.scale.z = 0.48;
    prepare(centerFurrow);

    const noseGeometry = new THREE.IcosahedronGeometry(0.64, 2);
    roughenGeometry(noseGeometry, 0.018, 45);
    const nose = new THREE.Mesh(noseGeometry, softMarble);
    nose.position.set(0, -0.28, 1.92);
    nose.scale.set(1.2, 0.72, 0.72);
    nose.rotation.x = 0.18;
    prepare(nose);

    const nostrilLeft = ellipsoid('LeftNostril', [-0.29, -0.32, 2.29], [0.19, 0.095, 0.07], darkStone, 28);
    nostrilLeft.rotation.z = -0.18;
    const nostrilRight = ellipsoid('RightNostril', [0.29, -0.32, 2.29], [0.19, 0.095, 0.07], darkStone, 28);
    nostrilRight.rotation.z = 0.18;

    ellipsoid('LeftMuzzle', [-0.57, -0.66, 1.71], [0.82, 0.67, 0.58], polishedMarble);
    ellipsoid('RightMuzzle', [0.57, -0.66, 1.71], [0.82, 0.67, 0.58], polishedMarble);

    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 4; i++) {
        const whisker = new THREE.Mesh(
          new THREE.SphereGeometry(0.045, 14, 10),
          roughMarble
        );
        whisker.position.set(
          side * (0.42 + i * 0.13),
          -0.56 - (i % 2) * 0.18,
          2.23 - i * 0.025
        );
        whisker.scale.set(1, 0.72, 0.38);
        prepare(whisker);
      }
    }

    ellipsoid('MouthCavity', [0, -1.42, 1.48], [1.02, 0.86, 0.31], darkStone, 56);
    ellipsoid('ThroatChannel', [0, -1.55, 1.42], [0.43, 0.71, 0.34], new THREE.MeshStandardMaterial({
      color: 0x111213,
      roughness: 1
    }), 40);

    const upperLipLeft = ellipsoid('UpperLipL', [-0.47, -0.94, 1.89], [0.65, 0.24, 0.26], softMarble);
    upperLipLeft.rotation.z = 0.14;
    const upperLipRight = ellipsoid('UpperLipR', [0.47, -0.94, 1.89], [0.65, 0.24, 0.26], softMarble);
    upperLipRight.rotation.z = -0.14;

    const lowerJawGeometry = new THREE.SphereGeometry(1, 56, 28);
    roughenGeometry(lowerJawGeometry, 0.018, 66);
    const lowerJaw = new THREE.Mesh(lowerJawGeometry, polishedMarble);
    lowerJaw.position.set(0, -1.93, 1.23);
    lowerJaw.scale.set(1.13, 0.62, 0.72);
    prepare(lowerJaw);

    ellipsoid('LowerLip', [0, -1.63, 1.82], [0.72, 0.18, 0.2], softMarble, 40);

    function createFang(x, y, rotationZ, length, radius) {
      const geometry = new THREE.ConeGeometry(radius, length, 18, 3);
      const fang = new THREE.Mesh(geometry, toothMarble);
      fang.position.set(x, y, 1.93);
      fang.rotation.z = rotationZ;
      fang.rotation.x = x * 0.055;
      prepare(fang);
    }

    createFang(-0.69, -1.22, Math.PI - 0.08, 0.76, 0.19);
    createFang(0.69, -1.22, Math.PI + 0.08, 0.76, 0.19);
    createFang(-0.56, -1.68, -0.06, 0.48, 0.14);
    createFang(0.56, -1.68, 0.06, 0.48, 0.14);

    for (let side = -1; side <= 1; side += 2) {
      const cheekRidge = ellipsoid(
        side < 0 ? 'LeftCheekRidge' : 'RightCheekRidge',
        [side * 1.22, -0.19, 1.2],
        [0.5, 1.06, 0.39],
        side < 0 ? marbleMaterial(0xd8d6ce, 0.34, 1.35) : softMarble,
        44
      );
      cheekRidge.rotation.z = side * 0.22;
    }

    const creaseMaterial = new THREE.MeshStandardMaterial({
      color: 0x72716d,
      roughness: 0.95
    });

    for (let side = -1; side <= 1; side += 2) {
      for (let i = 0; i < 5; i++) {
        const creaseGeometry = new THREE.BoxGeometry(0.07, 0.52 - i * 0.035, 0.08);
        const crease = new THREE.Mesh(creaseGeometry, creaseMaterial);
        crease.position.set(
          side * (1.67 + i * 0.17),
          1.88 - i * 0.49,
          0.69 - i * 0.08
        );
        crease.rotation.z = side * (0.42 + i * 0.07);
        crease.rotation.x = 0.16;
        prepare(crease);
      }
    }

    const scarCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-1.42, 0.38, 1.53),
      new THREE.Vector3(-1.18, 0.08, 1.75),
      new THREE.Vector3(-0.97, -0.21, 1.89),
      new THREE.Vector3(-0.8, -0.49, 1.95)
    ]);
    const scarGeometry = new THREE.TubeGeometry(scarCurve, 28, 0.025, 6, false);
    const scar = new THREE.Mesh(scarGeometry, creaseMaterial);
    prepare(scar);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({
        color: 0x161719,
        roughness: 0.94,
        metalness: 0.02
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -4.05;
    floor.receiveShadow = true;
    scene.add(floor);

    const rearPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(28, 18),
      new THREE.MeshStandardMaterial({
        color: 0x202224,
        roughness: 1
      })
    );
    rearPlane.position.set(0, 2, -4);
    rearPlane.receiveShadow = true;
    scene.add(rearPlane);

    const pedestal = new THREE.Mesh(
      new THREE.CylinderGeometry(2.5, 2.8, 0.5, 64),
      roughMarble
    );
    pedestal.position.set(0, -3.8, -0.38);
    pedestal.scale.z = 0.62;
    pedestal.castShadow = true;
    pedestal.receiveShadow = true;
    scene.add(pedestal);

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    }
    addEventListener('resize', resize);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      rim.intensity = 6.3 + Math.sin(elapsed * 0.45) * 0.25;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
