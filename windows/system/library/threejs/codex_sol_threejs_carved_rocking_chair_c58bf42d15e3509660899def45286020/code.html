<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carved Walnut Rocking Chair</title>
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #17130f;
  }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17130f);
scene.fog = new THREE.FogExp2(0x17130f, 0.045);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.2, 3.5, 6.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.75, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 4.5;
controls.maxDistance = 11;
controls.maxPolarAngle = Math.PI * 0.49;

const walnut = new THREE.MeshStandardMaterial({
  color: 0x70401f,
  roughness: 0.34,
  metalness: 0.0,
  flatShading: true
});

walnut.onBeforeCompile = shader => {
  shader.vertexShader = shader.vertexShader
    .replace(
      '#include <common>',
      '#include <common>\nvarying vec3 vWoodPosition;\nvarying vec3 vWoodNormal;'
    )
    .replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\nvWoodPosition = position;\nvWoodNormal = normal;'
    );

  shader.fragmentShader = shader.fragmentShader
    .replace(
      '#include <common>',
      `#include <common>
       varying vec3 vWoodPosition;
       varying vec3 vWoodNormal;

       float woodHash(vec3 p) {
         p = fract(p * 0.3183099 + vec3(0.17, 0.31, 0.53));
         p *= 17.0;
         return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
       }

       float woodNoise(vec3 p) {
         vec3 i = floor(p);
         vec3 f = fract(p);
         f = f * f * (3.0 - 2.0 * f);
         return mix(
           mix(mix(woodHash(i), woodHash(i + vec3(1,0,0)), f.x),
               mix(woodHash(i + vec3(0,1,0)), woodHash(i + vec3(1,1,0)), f.x), f.y),
           mix(mix(woodHash(i + vec3(0,0,1)), woodHash(i + vec3(1,0,1)), f.x),
               mix(woodHash(i + vec3(0,1,1)), woodHash(i + vec3(1,1,1)), f.x), f.y),
           f.z
         );
       }`
    )
    .replace(
      '#include <map_fragment>',
      `#include <map_fragment>
       vec3 wp = vWoodPosition;
       float warp = woodNoise(wp * vec3(1.8, 2.7, 1.8)) * 0.28;
       float grainA = sin((wp.y * 24.0 + wp.x * 5.0 + warp) * 3.14159);
       float grainB = sin((length(wp.xz) * 18.0 + wp.y * 2.2 + warp) * 3.14159);
       float fineGrain = smoothstep(0.70, 1.0, abs(grainA)) * 0.12;
       float growth = smoothstep(0.3, 1.0, abs(grainB)) * 0.08;
       float pores = smoothstep(0.78, 1.0, woodNoise(wp * 32.0)) * 0.06;
       diffuseColor.rgb *= 1.08 - fineGrain - growth - pores;
       diffuseColor.rgb += vec3(0.035, 0.015, 0.004) *
         pow(1.0 - abs(dot(normalize(vWoodNormal), vec3(0.0, 0.0, 1.0))), 2.0);`
    );
};

const darkWalnut = walnut.clone();
darkWalnut.color.setHex(0x4e2914);
darkWalnut.roughness = 0.43;

const cutWalnut = walnut.clone();
cutWalnut.color.setHex(0x8a542b);
cutWalnut.roughness = 0.4;

const chair = new THREE.Group();
chair.rotation.y = -0.08;
scene.add(chair);

function finish(mesh, cast = true, receive = true) {
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  chair.add(mesh);
  return mesh;
}

function tube(points, radius, material = walnut, radialSegments = 7, tubularSegments = 32) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const geometry = new THREE.TubeGeometry(
    curve,
    tubularSegments,
    radius,
    radialSegments,
    false
  );
  geometry.computeVertexNormals();
  return finish(new THREE.Mesh(geometry, material));
}

function cylinderBetween(a, b, radius, material = walnut, radialSegments = 8) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(
    radius * 0.92,
    radius,
    length,
    radialSegments,
    2,
    false
  );
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  return finish(mesh);
}

function carvedCollar(position, radius, height, material = cutWalnut) {
  const geometry = new THREE.CylinderGeometry(
    radius * 0.82,
    radius,
    height,
    8,
    1
  );
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(position);
  return finish(mesh);
}

function knob(position, scale = 1) {
  const geometry = new THREE.SphereGeometry(0.13 * scale, 8, 5);
  const mesh = new THREE.Mesh(geometry, cutWalnut);
  mesh.position.copy(position);
  mesh.scale.y = 1.25;
  return finish(mesh);
}

// Rocking runners
for (const side of [-1, 1]) {
  tube([
    new THREE.Vector3(side * 0.82, 0.34, -1.72),
    new THREE.Vector3(side * 0.84, 0.12, -1.22),
    new THREE.Vector3(side * 0.85, 0.02, -0.48),
    new THREE.Vector3(side * 0.85, 0.03, 0.40),
    new THREE.Vector3(side * 0.83, 0.17, 1.22),
    new THREE.Vector3(side * 0.79, 0.48, 1.68)
  ], 0.115, walnut, 8, 42);

  tube([
    new THREE.Vector3(side * 0.82, 0.33, -1.72),
    new THREE.Vector3(side * 0.81, 0.39, -1.82),
    new THREE.Vector3(side * 0.77, 0.51, -1.87)
  ], 0.085, cutWalnut, 7, 12);

  tube([
    new THREE.Vector3(side * 0.79, 0.47, 1.68),
    new THREE.Vector3(side * 0.76, 0.58, 1.79),
    new THREE.Vector3(side * 0.70, 0.69, 1.82)
  ], 0.082, cutWalnut, 7, 12);
}

// Legs and rocker braces
for (const side of [-1, 1]) {
  tube([
    new THREE.Vector3(side * 0.73, 0.16, 0.78),
    new THREE.Vector3(side * 0.72, 0.62, 0.66),
    new THREE.Vector3(side * 0.68, 1.18, 0.50),
    new THREE.Vector3(side * 0.66, 1.47, 0.39)
  ], 0.105, walnut, 7, 24);

  tube([
    new THREE.Vector3(side * 0.78, 0.13, -0.82),
    new THREE.Vector3(side * 0.74, 0.56, -0.67),
    new THREE.Vector3(side * 0.68, 1.12, -0.52),
    new THREE.Vector3(side * 0.64, 1.48, -0.43)
  ], 0.11, walnut, 7, 24);

  cylinderBetween(
    new THREE.Vector3(side * 0.78, 0.43, -0.76),
    new THREE.Vector3(side * 0.73, 0.43, 0.70),
    0.056,
    darkWalnut,
    7
  );

  carvedCollar(new THREE.Vector3(side * 0.675, 1.26, 0.47), 0.13, 0.13);
  carvedCollar(new THREE.Vector3(side * 0.69, 1.18, -0.50), 0.13, 0.13);
}

// Side stretchers
cylinderBetween(
  new THREE.Vector3(-0.76, 0.58, -0.59),
  new THREE.Vector3(0.76, 0.58, -0.59),
  0.065,
  darkWalnut,
  8
);
cylinderBetween(
  new THREE.Vector3(-0.73, 0.58, 0.62),
  new THREE.Vector3(0.73, 0.58, 0.62),
  0.06,
  darkWalnut,
  8
);

// Seat, shaped as a beveled sculpted slab
const seatShape = new THREE.Shape();
seatShape.moveTo(-0.67, -0.53);
seatShape.bezierCurveTo(-0.81, -0.48, -0.83, -0.30, -0.83, -0.06);
seatShape.lineTo(-0.80, 0.44);
seatShape.bezierCurveTo(-0.78, 0.61, -0.61, 0.68, -0.43, 0.70);
seatShape.bezierCurveTo(-0.12, 0.74, 0.12, 0.74, 0.43, 0.70);
seatShape.bezierCurveTo(0.61, 0.68, 0.78, 0.61, 0.80, 0.44);
seatShape.lineTo(0.83, -0.06);
seatShape.bezierCurveTo(0.83, -0.30, 0.81, -0.48, 0.67, -0.53);
seatShape.bezierCurveTo(0.35, -0.60, -0.35, -0.60, -0.67, -0.53);

const seatGeometry = new THREE.ExtrudeGeometry(seatShape, {
  depth: 0.15,
  bevelEnabled: true,
  bevelThickness: 0.055,
  bevelSize: 0.055,
  bevelSegments: 2,
  curveSegments: 5
});
seatGeometry.rotateX(Math.PI / 2);
seatGeometry.translate(0, 1.55, 0);
finish(new THREE.Mesh(seatGeometry, walnut));

// Seat hand-carved saddle grooves
for (const x of [-0.44, -0.22, 0, 0.22, 0.44]) {
  tube([
    new THREE.Vector3(x, 1.655, -0.30),
    new THREE.Vector3(x * 1.02, 1.668, 0.02),
    new THREE.Vector3(x * 1.05, 1.66, 0.38)
  ], 0.012, darkWalnut, 5, 16);
}

// Back posts
for (const side of [-1, 1]) {
  tube([
    new THREE.Vector3(side * 0.66, 1.49, -0.45),
    new THREE.Vector3(side * 0.70, 2.03, -0.55),
    new THREE.Vector3(side * 0.73, 2.65, -0.69),
    new THREE.Vector3(side * 0.69, 3.27, -0.79),
    new THREE.Vector3(side * 0.62, 3.61, -0.81)
  ], 0.105, walnut, 8, 36);

  carvedCollar(new THREE.Vector3(side * 0.70, 2.63, -0.68), 0.135, 0.13);
  knob(new THREE.Vector3(side * 0.62, 3.68, -0.81), 0.9);
}

// Lower back rail
tube([
  new THREE.Vector3(-0.62, 1.82, -0.54),
  new THREE.Vector3(-0.30, 1.88, -0.58),
  new THREE.Vector3(0, 1.90, -0.60),
  new THREE.Vector3(0.30, 1.88, -0.58),
  new THREE.Vector3(0.62, 1.82, -0.54)
], 0.075, walnut, 7, 28);

// Turned back spindles
const spindleXs = [-0.46, -0.30, -0.15, 0, 0.15, 0.30, 0.46];
for (const x of spindleXs) {
  const arch = 3.17 - Math.abs(x) * 0.17;
  tube([
    new THREE.Vector3(x * 0.94, 1.86 + Math.abs(x) * 0.03, -0.575),
    new THREE.Vector3(x * 1.02, 2.18, -0.63),
    new THREE.Vector3(x * 0.94, 2.45, -0.68),
    new THREE.Vector3(x * 1.04, 2.73, -0.72),
    new THREE.Vector3(x * 0.96, arch, -0.76)
  ], x === 0 ? 0.047 : 0.041, walnut, 6, 24);

  carvedCollar(
    new THREE.Vector3(x * 0.95, 2.46, -0.68),
    x === 0 ? 0.066 : 0.059,
    0.085
  );
}

// Crest rail silhouette
const crestShape = new THREE.Shape();
crestShape.moveTo(-0.64, 3.13);
crestShape.bezierCurveTo(-0.47, 3.17, -0.41, 3.24, -0.35, 3.34);
crestShape.bezierCurveTo(-0.25, 3.48, -0.11, 3.46, 0, 3.62);
crestShape.bezierCurveTo(0.11, 3.46, 0.25, 3.48, 0.35, 3.34);
crestShape.bezierCurveTo(0.41, 3.24, 0.47, 3.17, 0.64, 3.13);
crestShape.lineTo(0.64, 3.39);
crestShape.bezierCurveTo(0.45, 3.43, 0.42, 3.55, 0.31, 3.62);
crestShape.bezierCurveTo(0.20, 3.71, 0.12, 3.78, 0, 3.91);
crestShape.bezierCurveTo(-0.12, 3.78, -0.20, 3.71, -0.31, 3.62);
crestShape.bezierCurveTo(-0.42, 3.55, -0.45, 3.43, -0.64, 3.39);
crestShape.closePath();

const crestGeometry = new THREE.ExtrudeGeometry(crestShape, {
  depth: 0.19,
  bevelEnabled: true,
  bevelThickness: 0.025,
  bevelSize: 0.025,
  bevelSegments: 2,
  curveSegments: 6
});
crestGeometry.translate(0, 0, -0.86);
finish(new THREE.Mesh(crestGeometry, walnut));

// Carved leaf reliefs
function createLeaf(cx, cy, sx, sy, rotation, material = cutWalnut) {
  const shape = new THREE.Shape();
  shape.moveTo(0, -1);
  shape.bezierCurveTo(-0.82, -0.45, -0.72, 0.53, 0, 1);
  shape.bezierCurveTo(0.72, 0.53, 0.82, -0.45, 0, -1);
  shape.closePath();

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.042,
    bevelEnabled: true,
    bevelThickness: 0.018,
    bevelSize: 0.018,
    bevelSegments: 1,
    curveSegments: 5
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.scale.set(sx, sy, 1);
  mesh.rotation.z = rotation;
  mesh.position.set(cx, cy, -0.64);
  finish(mesh);

  const veinEnd = new THREE.Vector3(
    cx + Math.sin(-rotation) * sy * 0.7,
    cy + Math.cos(rotation) * sy * 0.7,
    -0.592
  );
  tube([
    new THREE.Vector3(cx, cy - sy * 0.55, -0.592),
    new THREE.Vector3(cx, cy, -0.592),
    veinEnd
  ], 0.009, darkWalnut, 5, 8);
}

createLeaf(-0.19, 3.51, 0.12, 0.25, -0.76);
createLeaf(0.19, 3.51, 0.12, 0.25, 0.76);
createLeaf(-0.35, 3.38, 0.09, 0.20, -1.02);
createLeaf(0.35, 3.38, 0.09, 0.20, 1.02);
createLeaf(0, 3.68, 0.09, 0.18, 0);

tube([
  new THREE.Vector3(-0.45, 3.30, -0.59),
  new THREE.Vector3(-0.20, 3.38, -0.59),
  new THREE.Vector3(0, 3.53, -0.59),
  new THREE.Vector3(0.20, 3.38, -0.59),
  new THREE.Vector3(0.45, 3.30, -0.59)
], 0.018, darkWalnut, 5, 24);

// Arms and scroll terminals
for (const side of [-1, 1]) {
  tube([
    new THREE.Vector3(side * 0.69, 2.34, -0.57),
    new THREE.Vector3(side * 0.78, 2.27, -0.19),
    new THREE.Vector3(side * 0.82, 2.20, 0.23),
    new THREE.Vector3(side * 0.83, 2.14, 0.62),
    new THREE.Vector3(side * 0.80, 2.11, 0.88),
    new THREE.Vector3(side * 0.75, 2.16, 1.02),
    new THREE.Vector3(side * 0.70, 2.23, 0.96),
    new THREE.Vector3(side * 0.72, 2.26, 0.84)
  ], 0.102, walnut, 8, 38);

  tube([
    new THREE.Vector3(side * 0.79, 1.52, 0.39),
    new THREE.Vector3(side * 0.80, 1.76, 0.53),
    new THREE.Vector3(side * 0.81, 1.98, 0.66),
    new THREE.Vector3(side * 0.82, 2.14, 0.69)
  ], 0.072, walnut, 7, 20);

  carvedCollar(new THREE.Vector3(side * 0.805, 1.86, 0.59), 0.09, 0.10);
  knob(new THREE.Vector3(side * 0.715, 2.25, 0.86), 0.62);
}

// Decorative seat-edge pegs
for (const side of [-1, 1]) {
  knob(new THREE.Vector3(side * 0.77, 1.55, 0.58), 0.46);
}

// Floor
const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x2b231c,
  roughness: 0.88,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(8, 96), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.12;
floor.receiveShadow = true;
scene.add(floor);

// Subtle concentric presentation platform
const platformMaterial = new THREE.MeshStandardMaterial({
  color: 0x3b3026,
  roughness: 0.72
});
const platform = new THREE.Mesh(
  new THREE.CylinderGeometry(2.55, 2.66, 0.12, 72),
  platformMaterial
);
platform.position.y = -0.07;
platform.receiveShadow = true;
scene.add(platform);

// Lighting
const hemisphere = new THREE.HemisphereLight(0xffe3bd, 0x21170f, 1.65);
scene.add(hemisphere);

const keyLight = new THREE.DirectionalLight(0xffd5a1, 4.2);
keyLight.position.set(4.5, 7.2, 5.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -4;
keyLight.shadow.camera.right = 4;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 18;
keyLight.shadow.bias = -0.00025;
keyLight.shadow.normalBias = 0.025;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xd49a62, 2.4);
rimLight.position.set(-5, 4.6, -5);
scene.add(rimLight);

const frontFill = new THREE.SpotLight(
  0xffe0bc,
  75,
  12,
  Math.PI / 5,
  0.55,
  1.5
);
frontFill.position.set(-2.4, 4.2, 5.8);
frontFill.target.position.set(0, 2, 0);
scene.add(frontFill, frontFill.target);

const warmGlow = new THREE.PointLight(0xa9501e, 16, 6, 2);
warmGlow.position.set(1.8, 1.8, -2.8);
scene.add(warmGlow);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
