<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pine Coffee Table</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e8e4dc; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e4dc);
scene.fog = new THREE.Fog(0xe8e4dc, 8, 18);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(2.2, 1.5, 2.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.32, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 1.4;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.49;

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xfff6e8, 0x8f8a80, 0.55));

const sun = new THREE.DirectionalLight(0xfff2dd, 1.6);
sun.position.set(3.5, 5, 2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -2.5;
sun.shadow.camera.right = 2.5;
sun.shadow.camera.top = 2.5;
sun.shadow.camera.bottom = -2.5;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 12;
sun.shadow.bias = -0.0004;
sun.shadow.radius = 6;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xdfe8ff, 0.4);
fill.position.set(-3, 2, -2);
scene.add(fill);

// ---------- Procedural pine texture ----------
function pineTexture(w, h, grainAcross, base = '#e6c890') {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = base;
  g.fillRect(0, 0, w, h);
  // long grain streaks
  for (let i = 0; i < 140; i++) {
    const y = Math.random() * h;
    const len = 60 + Math.random() * (w * 0.7);
    const x = Math.random() * w - len * 0.3;
    const tone = Math.random();
    g.strokeStyle = tone > 0.5
      ? `rgba(160,110,55,${0.04 + Math.random() * 0.09})`
      : `rgba(255,240,200,${0.05 + Math.random() * 0.08})`;
    g.lineWidth = 0.6 + Math.random() * 1.8;
    g.beginPath();
    g.moveTo(x, y);
    g.bezierCurveTo(x + len * 0.33, y + (Math.random() - 0.5) * 5,
                    x + len * 0.66, y + (Math.random() - 0.5) * 5,
                    x + len, y + (Math.random() - 0.5) * 3);
    g.stroke();
  }
  // board seams
  const boards = 5;
  g.strokeStyle = 'rgba(120,85,45,0.28)';
  g.lineWidth = 1.4;
  for (let b = 1; b < boards; b++) {
    const y = (h / boards) * b + (Math.random() - 0.5) * 4;
    g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
  }
  // a few knots
  for (let k = 0; k < 4; k++) {
    const kx = w * (0.12 + Math.random() * 0.76);
    const ky = h * (0.12 + Math.random() * 0.76);
    const r = 4 + Math.random() * 7;
    for (let ring = r; ring > 0; ring -= 1.4) {
      g.strokeStyle = `rgba(120,75,35,${0.10 + 0.16 * (1 - ring / r)})`;
      g.lineWidth = 1;
      g.beginPath();
      g.ellipse(kx, ky, ring * 1.5, ring, 0.3, 0, Math.PI * 2);
      g.stroke();
    }
    g.fillStyle = 'rgba(95,60,30,0.55)';
    g.beginPath(); g.ellipse(kx, ky, 2.4, 1.6, 0.3, 0, Math.PI * 2); g.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 8;
  if (grainAcross) tex.rotation = Math.PI / 2;
  return tex;
}

const topTex = pineTexture(1024, 512, false);
const legTex = pineTexture(256, 512, false, '#e2c288');
legTex.repeat.set(1, 1);

const woodTop = new THREE.MeshStandardMaterial({ map: topTex, roughness: 0.62, metalness: 0.0 });
const woodLeg = new THREE.MeshStandardMaterial({ map: legTex, roughness: 0.68, metalness: 0.0, color: 0xf2e0b8 });
const woodApron = new THREE.MeshStandardMaterial({ map: topTex, roughness: 0.68, metalness: 0.0, color: 0xf0dcb2 });

// ---------- Table ----------
const table = new THREE.Group();

// dimensions (meters)
const topW = 1.2, topD = 0.6, topT = 0.04;
const legS = 0.06, legH = 0.42;
const apronH = 0.09, apronT = 0.025, inset = 0.09;
const topY = legH + apronH; // underside of top sits on apron top

// Rounded-edge top via ExtrudeGeometry with bevel
const r = 0.02;
const shape = new THREE.Shape();
const hw = topW / 2 - r, hd = topD / 2 - r;
shape.moveTo(-hw, -hd - r);
shape.lineTo(hw, -hd - r);
shape.quadraticCurveTo(hw + r, -hd - r, hw + r, -hd);
shape.lineTo(hw + r, hd);
shape.quadraticCurveTo(hw + r, hd + r, hw, hd + r);
shape.lineTo(-hw, hd + r);
shape.quadraticCurveTo(-hw - r, hd + r, -hw - r, hd);
shape.lineTo(-hw - r, -hd);
shape.quadraticCurveTo(-hw - r, -hd - r, -hw, -hd - r);
const topGeo = new THREE.ExtrudeGeometry(shape, {
  depth: topT - 0.012, bevelEnabled: true,
  bevelThickness: 0.006, bevelSize: 0.006, bevelSegments: 3, curveSegments: 6
});
topGeo.rotateX(-Math.PI / 2);
topGeo.computeBoundingBox();
// scale UVs so texture maps nicely across the top
{
  const uv = topGeo.attributes.uv;
  for (let i = 0; i < uv.count; i++) {
    uv.setXY(i, uv.getX(i) * 0.8 + 0.5, uv.getY(i) * 0.8 + 0.5);
  }
}
const topMesh = new THREE.Mesh(topGeo, woodTop);
topMesh.position.y = topY + 0.006;
topMesh.castShadow = topMesh.receiveShadow = true;
table.add(topMesh);

// Legs
const legGeo = new THREE.BoxGeometry(legS, legH + apronH, legS);
const legX = topW / 2 - inset, legZ = topD / 2 - inset;
for (const [sx, sz] of [[1,1],[1,-1],[-1,1],[-1,-1]]) {
  const leg = new THREE.Mesh(legGeo, woodLeg);
  leg.position.set(sx * legX, (legH + apronH) / 2, sz * legZ);
  leg.castShadow = leg.receiveShadow = true;
  table.add(leg);
}

// Aprons
const apronY = legH + apronH / 2;
const apronLong = new THREE.BoxGeometry(legX * 2 - legS, apronH, apronT);
const apronShort = new THREE.BoxGeometry(apronT, apronH, legZ * 2 - legS);
for (const s of [1, -1]) {
  const a = new THREE.Mesh(apronLong, woodApron);
  a.position.set(0, apronY, s * (legZ - legS / 2 + apronT / 2 - 0.01));
  a.castShadow = a.receiveShadow = true;
  table.add(a);
  const b = new THREE.Mesh(apronShort, woodApron);
  b.position.set(s * (legX - legS / 2 + apronT / 2 - 0.01), apronY, 0);
  b.castShadow = b.receiveShadow = true;
  table.add(b);
}

scene.add(table);

// ---------- Ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 48),
  new THREE.MeshStandardMaterial({ color: 0xd8d2c6, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// soft contact-shadow disc under table
const contactC = document.createElement('canvas');
contactC.width = contactC.height = 256;
const cg = contactC.getContext('2d');
const grad = cg.createRadialGradient(128, 128, 20, 128, 128, 128);
grad.addColorStop(0, 'rgba(0,0,0,0.30)');
grad.addColorStop(1, 'rgba(0,0,0,0)');
cg.fillStyle = grad;
cg.fillRect(0, 0, 256, 256);
const contactTex = new THREE.CanvasTexture(contactC);
const contact = new THREE.Mesh(
  new THREE.PlaneGeometry(2.0, 1.3),
  new THREE.MeshBasicMaterial({ map: contactTex, transparent: true, depthWrite: false })
);
contact.rotation.x = -Math.PI / 2;
contact.position.y = 0.002;
scene.add(contact);

// ---------- Loop / resize ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
