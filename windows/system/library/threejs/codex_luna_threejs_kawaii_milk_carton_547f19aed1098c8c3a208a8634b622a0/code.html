<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kawaii Milk Carton</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #dff6ff;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdff6ff);
scene.fog = new THREE.Fog(0xdff6ff, 12, 24);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(6.4, 4.5, 8.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.3;
controls.minDistance = 5.5;
controls.maxDistance = 11;
controls.target.set(0, 2.1, 0);

const colors = {
  blue: 0x82d9ed,
  blueLight: 0xb9eff8,
  blueDark: 0x3b9fbe,
  white: 0xfffcf3,
  navy: 0x173c59,
  pink: 0xff9cae,
  pinkDark: 0xe86f8c,
  yellow: 0xffd66e,
  black: 0x1e3446,
  ground: 0xb9e6ee
};

const bodyMaterial = new THREE.MeshPhysicalMaterial({
  color: colors.blue,
  roughness: 0.3,
  metalness: 0.02,
  clearcoat: 0.4,
  clearcoatRoughness: 0.2
});

const lightBlueMaterial = new THREE.MeshPhysicalMaterial({
  color: colors.blueLight,
  roughness: 0.36,
  metalness: 0.01,
  clearcoat: 0.25
});

const whiteMaterial = new THREE.MeshPhysicalMaterial({
  color: colors.white,
  roughness: 0.34,
  metalness: 0,
  clearcoat: 0.35
});

const navyMaterial = new THREE.MeshStandardMaterial({
  color: colors.navy,
  roughness: 0.3
});

const blackMaterial = new THREE.MeshStandardMaterial({
  color: colors.black,
  roughness: 0.24
});

const pinkMaterial = new THREE.MeshStandardMaterial({
  color: colors.pink,
  roughness: 0.35
});

const pinkDarkMaterial = new THREE.MeshStandardMaterial({
  color: colors.pinkDark,
  roughness: 0.32
});

const yellowMaterial = new THREE.MeshStandardMaterial({
  color: colors.yellow,
  roughness: 0.35
});

function addBox(parent, width, height, depth, x, y, z, material, cast = true, receive = true) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  parent.add(mesh);
  return mesh;
}

function addSphere(parent, radius, x, y, z, sx, sy, sz, material, cast = true, receive = true) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 28, 20), material);
  mesh.position.set(x, y, z);
  mesh.scale.set(sx, sy, sz);
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  parent.add(mesh);
  return mesh;
}

function addCylinderBetween(parent, start, end, radius, material, segments = 18) {
  const startPoint = new THREE.Vector3(start[0], start[1], start[2]);
  const endPoint = new THREE.Vector3(end[0], end[1], end[2]);
  const direction = new THREE.Vector3().subVectors(endPoint, startPoint);
  const length = direction.length();

  if (length <= 0.0001) return null;

  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, length, segments),
    material
  );
  mesh.position.copy(startPoint).add(endPoint).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function addStroke(parent, x1, y1, x2, y2, radius, material, z) {
  addCylinderBetween(parent, [x1, y1, z], [x2, y2, z], radius, material, 14);
  addSphere(parent, radius, x1, y1, z, 1, 1, 1, material);
  addSphere(parent, radius, x2, y2, z, 1, 1, 1, material);
}

function roundedRectangle(width, height, radius) {
  const shape = new THREE.Shape();
  const halfWidth = width / 2;
  const halfHeight = height / 2;

  shape.moveTo(-halfWidth + radius, -halfHeight);
  shape.lineTo(halfWidth - radius, -halfHeight);
  shape.quadraticCurveTo(halfWidth, -halfHeight, halfWidth, -halfHeight + radius);
  shape.lineTo(halfWidth, halfHeight - radius);
  shape.quadraticCurveTo(halfWidth, halfHeight, halfWidth - radius, halfHeight);
  shape.lineTo(-halfWidth + radius, halfHeight);
  shape.quadraticCurveTo(-halfWidth, halfHeight, -halfWidth, halfHeight - radius);
  shape.lineTo(-halfWidth, -halfHeight + radius);
  shape.quadraticCurveTo(-halfWidth, -halfHeight, -halfWidth + radius, -halfHeight);
  return shape;
}

function addPanel(parent, width, height, radius, x, y, z, material) {
  const mesh = new THREE.Mesh(
    new THREE.ShapeGeometry(roundedRectangle(width, height, radius)),
    material
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function makeGableGeometry(width, depth, baseY, apexY) {
  const halfWidth = width / 2;
  const halfDepth = depth / 2;
  const vertices = new Float32Array([
    -halfWidth, baseY, halfDepth,
     halfWidth, baseY, halfDepth,
     0,         apexY, halfDepth,
    -halfWidth, baseY, -halfDepth,
     halfWidth, baseY, -halfDepth,
     0,         apexY, -halfDepth
  ]);

  const indices = [
    0, 1, 2,
    3, 5, 4,
    0, 3, 5, 0, 5, 2,
    1, 2, 5, 1, 5, 4,
    0, 4, 1,
    0, 3, 4
  ];

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function makeQuadGeometry(points) {
  const vertices = new Float32Array(points.flat());
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex([0, 1, 2, 0, 2, 3]);
  geometry.computeVertexNormals();
  return geometry;
}

const carton = new THREE.Group();
scene.add(carton);

const arms = new THREE.Group();
carton.add(arms);

addCylinderBetween(arms, [-1.58, 1.6, 0.02], [-2.03, 2.13, 0.04], 0.17, bodyMaterial);
addCylinderBetween(arms, [1.58, 1.6, 0.02], [2.03, 2.13, 0.04], 0.17, bodyMaterial);

addSphere(arms, 0.23, -2.08, 2.19, 0.04, 1.05, 0.9, 0.8, lightBlueMaterial);
addSphere(arms, 0.23, 2.08, 2.19, 0.04, 1.05, 0.9, 0.8, lightBlueMaterial);

addSphere(arms, 0.08, -2.2, 2.29, 0.16, 1, 1, 0.7, bodyMaterial);
addSphere(arms, 0.08, -2.06, 2.36, 0.16, 1, 1, 0.7, bodyMaterial);
addSphere(arms, 0.08, 1.96, 2.36, 0.16, 1, 1, 0.7, bodyMaterial);
addSphere(arms, 0.08, 2.1, 2.29, 0.16, 1, 1, 0.7, bodyMaterial);

addBox(carton, 3.4, 2.75, 2.2, 0, 1.62, 0, bodyMaterial);
addBox(carton, 3.42, 0.16, 2.22, 0, 2.98, 0, whiteMaterial);
addBox(carton, 3.24, 0.12, 2.24, 0, 0.28, 0, lightBlueMaterial);

const gable = new THREE.Mesh(
  makeGableGeometry(3.4, 2.2, 3.04, 4.3),
  bodyMaterial
);
gable.castShadow = true;
gable.receiveShadow = true;
carton.add(gable);

const frontGableShape = new THREE.Shape();
frontGableShape.moveTo(-1.59, 3.08);
frontGableShape.lineTo(1.59, 3.08);
frontGableShape.lineTo(0, 4.23);
frontGableShape.closePath();

const frontGable = new THREE.Mesh(
  new THREE.ShapeGeometry(frontGableShape),
  whiteMaterial
);
frontGable.position.z = 1.115;
frontGable.castShadow = true;
frontGable.receiveShadow = true;
carton.add(frontGable);

const leftRoof = new THREE.Mesh(
  makeQuadGeometry([
    [-1.7, 3.06, -1.1],
    [-1.7, 3.06, 1.1],
    [0, 4.3, 1.1],
    [0, 4.3, -1.1]
  ]),
  whiteMaterial
);
leftRoof.castShadow = true;
leftRoof.receiveShadow = true;
carton.add(leftRoof);

const rightRoof = new THREE.Mesh(
  makeQuadGeometry([
    [0, 4.3, -1.1],
    [0, 4.3, 1.1],
    [1.7, 3.06, 1.1],
    [1.7, 3.06, -1.1]
  ]),
  whiteMaterial
);
rightRoof.castShadow = true;
rightRoof.receiveShadow = true;
carton.add(rightRoof);

addBox(carton, 0.16, 0.14, 2.27, 0, 4.31, 0, lightBlueMaterial);

addPanel(carton, 2.78, 1.02, 0.17, 0, 0.76, 1.116, lightBlueMaterial);
addPanel(carton, 2.58, 0.82, 0.14, 0, 0.76, 1.145, whiteMaterial);

const cow = new THREE.Group();
carton.add(cow);

addSphere(cow, 0.29, -0.68, 0.69, 1.24, 1.28, 0.72, 0.26, whiteMaterial);
addSphere(cow, 0.22, -0.88, 0.94, 1.25, 1.05, 0.95, 0.3, whiteMaterial);
addSphere(cow, 0.11, -1.07, 1.08, 1.23, 1, 0.7, 0.45, whiteMaterial);
addSphere(cow, 0.11, -0.69, 1.08, 1.23, 1, 0.7, 0.45, whiteMaterial);

addSphere(cow, 0.07, -0.75, 1.16, 1.23, 0.8, 1.15, 0.5, yellowMaterial);
addSphere(cow, 0.07, -1.01, 0.98, 1.35, 0.65, 0.65, 0.25, blackMaterial);
addSphere(cow, 0.075, -0.56, 0.77, 1.35, 0.8, 0.65, 0.25, blackMaterial);
addSphere(cow, 0.06, -0.82, 0.57, 1.35, 0.8, 0.7, 0.25, blackMaterial);
addSphere(cow, 0.025, -0.95, 0.98, 1.47, 1, 1, 1, navyMaterial);
addSphere(cow, 0.025, -0.79, 0.98, 1.47, 1, 1, 1, navyMaterial);
addSphere(cow, 0.075, -0.89, 0.88, 1.47, 1.15, 0.55, 0.3, pinkMaterial);

const letterGroup = new THREE.Group();
carton.add(letterGroup);

const letterZ = 1.205;
const letterRadius = 0.038;

addStroke(letterGroup, 0.02, 0.57, 0.02, 0.95, letterRadius, navyMaterial, letterZ);
addStroke(letterGroup, 0.02, 0.95, 0.13, 0.75, letterRadius, navyMaterial, letterZ);
addStroke(letterGroup, 0.13, 0.75, 0.24, 0.95, letterRadius, navyMaterial, letterZ);
addStroke(letterGroup, 0.24, 0.95, 0.24, 0.57, letterRadius, navyMaterial, letterZ);

addStroke(letterGroup, 0.34, 0.57, 0.34, 0.95, letterRadius, navyMaterial, letterZ);
addStroke(letterGroup, 0.29, 0.95, 0.39, 0.95, letterRadius, navyMaterial, letterZ);
addStroke(letterGroup, 0.29, 0.57, 0.39, 0.57, letterRadius, navyMaterial, letterZ);

addStroke(letterGroup, 0.51, 0.95, 0.51, 0.57, letterRadius, navyMaterial, letterZ);
addStroke(letterGroup, 0.51, 0.57, 0.76, 0.57, letterRadius, navyMaterial, letterZ);

addStroke(letterGroup, 0.88, 0.57, 0.88, 0.95, letterRadius, navyMaterial, letterZ);
addStroke(letterGroup, 0.88, 0.76, 1.12, 0.95, letterRadius, navyMaterial, letterZ);
addStroke(letterGroup, 0.88, 0.76, 1.12, 0.57, letterRadius, navyMaterial, letterZ);

const face = new THREE.Group();
carton.add(face);

addSphere(face, 0.43, -0.66, 2.13, 1.17, 1, 1.05, 0.25, blackMaterial);
addSphere(face, 0.43, 0.66, 2.13, 1.17, 1, 1.05, 0.25, blackMaterial);

addSphere(face, 0.13, -0.79, 2.3, 1.275, 1, 1, 0.45, whiteMaterial);
addSphere(face, 0.065, -0.52, 2.01, 1.28, 1, 1, 0.4, whiteMaterial);
addSphere(face, 0.13, 0.53, 2.3, 1.275, 1, 1, 0.45, whiteMaterial);
addSphere(face, 0.065, 0.8, 2.01, 1.28, 1, 1, 0.4, whiteMaterial);

addSphere(face, 0.3, -1.12, 1.7, 1.18, 1.25, 0.62, 0.18, pinkMaterial);
addSphere(face, 0.3, 1.12, 1.7, 1.18, 1.25, 0.62, 0.18, pinkMaterial);
addSphere(face, 0.065, -1.26, 1.72, 1.265, 1, 1, 0.35, pinkDarkMaterial);
addSphere(face, 0.065, -1.1, 1.67, 1.265, 1, 1, 0.35, pinkDarkMaterial);
addSphere(face, 0.065, 1.1, 1.67, 1.265, 1, 1, 0.35, pinkDarkMaterial);
addSphere(face, 0.065, 1.26, 1.72, 1.265, 1, 1, 0.35, pinkDarkMaterial);

const smileCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.34, 1.53, 1.26),
  new THREE.Vector3(-0.2, 1.39, 1.27),
  new THREE.Vector3(0, 1.35, 1.27),
  new THREE.Vector3(0.2, 1.39, 1.27),
  new THREE.Vector3(0.34, 1.53, 1.26)
]);
const smile = new THREE.Mesh(
  new THREE.TubeGeometry(smileCurve, 24, 0.045, 10, false),
  blackMaterial
);
smile.castShadow = true;
face.add(smile);

addSphere(face, 0.13, 0, 1.43, 1.29, 1.2, 0.55, 0.3, pinkDarkMaterial);

addSphere(carton, 0.3, -0.68, 0.12, 0.25, 1.2, 0.45, 0.7, lightBlueMaterial);
addSphere(carton, 0.3, 0.68, 0.12, 0.25, 1.2, 0.45, 0.7, lightBlueMaterial);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(4.2, 64),
  new THREE.MeshStandardMaterial({ color: colors.ground, roughness: 0.72 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.2;
ground.receiveShadow = true;
scene.add(ground);

const shadowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.ShadowMaterial({ color: 0x397f91, opacity: 0.12 })
);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.position.y = -0.19;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);

const hemisphereLight = new THREE.HemisphereLight(0xf2fcff, 0x83b9c5, 2.15);
scene.add(hemisphereLight);

const keyLight = new THREE.DirectionalLight(0xffffff, 4.2);
keyLight.position.set(5, 8, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 25;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xa9eaff, 1.4, 12);
fillLight.position.set(-4, 4, 5);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xffc9d9, 1.2, 10);
rimLight.position.set(3, 4, -4);
scene.add(rimLight);

const clock = new THREE.Clock();

function animate() {
  const elapsed = clock.getElapsedTime();
  carton.position.y = Math.sin(elapsed * 1.7) * 0.025;
  controls.update();
  renderer.render(scene, camera);
}

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}

window.addEventListener("resize", resize);
renderer.setAnimationLoop(animate);
</script>
</body>
</html>
