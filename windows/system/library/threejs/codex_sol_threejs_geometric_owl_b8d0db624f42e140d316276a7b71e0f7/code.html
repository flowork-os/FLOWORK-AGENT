<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faceted Geometric Owl</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #d8d3c9;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8d3c9);
scene.fog = new THREE.Fog(0xd8d3c9, 11, 22);

const camera = new THREE.PerspectiveCamera(
  36,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.set(6.8, 4.5, 8.5);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.35, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.enablePan = false;
controls.minDistance = 6.3;
controls.maxDistance = 15;
controls.minPolarAngle = Math.PI * 0.22;
controls.maxPolarAngle = Math.PI * 0.56;

scene.add(new THREE.HemisphereLight(0xf3eee4, 0x676b70, 2.25));

const keyLight = new THREE.DirectionalLight(0xfff2dc, 4.5);
keyLight.position.set(5, 8, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 20;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.025;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x9eb6c9, 2.1);
rimLight.position.set(-5, 4, -5);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0xe8d2b4, 1.3, 12);
fillLight.position.set(-3, 2.5, 5);
scene.add(fillLight);

function prepareFacets(sourceGeometry, scale, baseColor, variation = 0.13) {
  let geometry = sourceGeometry.clone();
  geometry.applyMatrix4(new THREE.Matrix4().makeScale(scale.x, scale.y, scale.z));

  if (geometry.index) {
    geometry = geometry.toNonIndexed();
  }

  geometry.computeVertexNormals();

  const positions = geometry.getAttribute('position');
  const colors = new Float32Array(positions.count * 3);
  const a = new THREE.Vector3();
  const b = new THREE.Vector3();
  const c = new THREE.Vector3();
  const edge1 = new THREE.Vector3();
  const edge2 = new THREE.Vector3();
  const normal = new THREE.Vector3();
  const base = new THREE.Color(baseColor);

  for (let i = 0; i < positions.count; i += 3) {
    a.fromBufferAttribute(positions, i);
    b.fromBufferAttribute(positions, i + 1);
    c.fromBufferAttribute(positions, i + 2);
    edge1.subVectors(b, a);
    edge2.subVectors(c, a);
    normal.crossVectors(edge1, edge2).normalize();

    const hash = Math.sin((i + 3) * 17.173) * 43758.5453;
    const random = hash - Math.floor(hash);
    const directional = normal.y * 0.055 + normal.x * 0.035 + normal.z * 0.025;
    const brightness = 0.91 + directional + (random - 0.5) * variation;
    const facetColor = base.clone().multiplyScalar(brightness);

    for (let j = 0; j < 3; j++) {
      const index = (i + j) * 3;
      colors[index] = facetColor.r;
      colors[index + 1] = facetColor.g;
      colors[index + 2] = facetColor.b;
    }
  }

  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.computeBoundingSphere();
  return geometry;
}

function stoneMaterial(extra = {}) {
  return new THREE.MeshStandardMaterial({
    color: 0xffffff,
    vertexColors: true,
    flatShading: true,
    roughness: 0.94,
    metalness: 0.015,
    ...extra
  });
}

function facetedMesh(geometry, scale, color, variation = 0.13) {
  const mesh = new THREE.Mesh(
    prepareFacets(geometry, scale, color, variation),
    stoneMaterial()
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function polygonMaterial(color, roughness = 0.92) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness: 0.01,
    flatShading: true
  });
}

function makeTriangleMesh(vertices, triangles, color, variation = 0.12) {
  const positionData = [];
  for (const triangle of triangles) {
    for (const vertexIndex of triangle) {
      const vertex = vertices[vertexIndex];
      positionData.push(vertex[0], vertex[1], vertex[2]);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positionData, 3)
  );
  geometry.computeVertexNormals();

  const prepared = prepareFacets(
    geometry,
    new THREE.Vector3(1, 1, 1),
    color,
    variation
  );
  const mesh = new THREE.Mesh(prepared, stoneMaterial());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const owl = new THREE.Group();
owl.rotation.y = -0.08;
scene.add(owl);

const body = facetedMesh(
  new THREE.IcosahedronGeometry(1, 2),
  new THREE.Vector3(1.18, 1.68, 0.88),
  0x777b7e,
  0.18
);
body.position.set(0, 1.78, 0);
body.rotation.set(0.01, 0.03, -0.015);
owl.add(body);

const chest = facetedMesh(
  new THREE.IcosahedronGeometry(1, 1),
  new THREE.Vector3(0.76, 1.22, 0.33),
  0x96999a,
  0.19
);
chest.position.set(0, 1.72, 0.76);
chest.rotation.x = -0.08;
owl.add(chest);

const head = facetedMesh(
  new THREE.IcosahedronGeometry(1, 2),
  new THREE.Vector3(1.42, 1.15, 0.82),
  0x7f8385,
  0.2
);
head.position.set(0, 3.56, 0.02);
head.rotation.y = 0.015;
owl.add(head);

const crown = facetedMesh(
  new THREE.OctahedronGeometry(1, 0),
  new THREE.Vector3(1.03, 0.52, 0.58),
  0x727679,
  0.15
);
crown.position.set(0, 4.2, -0.03);
crown.rotation.z = Math.PI * 0.25;
owl.add(crown);

function addEar(x, tilt) {
  const ear = facetedMesh(
    new THREE.ConeGeometry(0.48, 1.05, 3, 1, false),
    new THREE.Vector3(1, 1, 0.8),
    0x696e71,
    0.16
  );
  ear.position.set(x, 4.63, -0.03);
  ear.rotation.set(0.08, x > 0 ? -0.15 : 0.15, tilt);
  owl.add(ear);
}

addEar(-0.91, 0.22);
addEar(0.91, -0.22);

const wingVertices = [
  [0.62, 2.86, 0.26],
  [1.12, 2.5, 0.1],
  [1.37, 1.75, -0.02],
  [1.18, 0.92, 0.04],
  [0.66, 0.44, 0.18],
  [0.48, 1.45, 0.78],
  [0.58, 2.38, 0.68],
  [1.05, 1.75, 0.48],
  [0.8, 0.92, 0.45]
];

const wingTriangles = [
  [0, 1, 6],
  [1, 7, 6],
  [1, 2, 7],
  [2, 3, 7],
  [3, 8, 7],
  [3, 4, 8],
  [4, 5, 8],
  [5, 7, 8],
  [5, 6, 7],
  [0, 6, 5],
  [0, 5, 4],
  [0, 4, 1],
  [1, 4, 3],
  [1, 3, 2]
];

const rightWing = makeTriangleMesh(
  wingVertices,
  wingTriangles,
  0x62676a,
  0.2
);
owl.add(rightWing);

const leftWingVertices = wingVertices.map(([x, y, z]) => [-x, y, z]);
const leftWingTriangles = wingTriangles.map(([a, b, c]) => [a, c, b]);
const leftWing = makeTriangleMesh(
  leftWingVertices,
  leftWingTriangles,
  0x6b7073,
  0.2
);
owl.add(leftWing);

function addEye(x) {
  const socket = new THREE.Mesh(
    new THREE.CylinderGeometry(0.72, 0.77, 0.2, 10, 1, false),
    polygonMaterial(0x4b5052)
  );
  socket.position.set(x, 3.62, 0.73);
  socket.rotation.x = Math.PI / 2;
  socket.castShadow = true;
  socket.receiveShadow = true;
  owl.add(socket);

  const eye = new THREE.Mesh(
    new THREE.CylinderGeometry(0.52, 0.52, 0.14, 10, 1, false),
    polygonMaterial(0xd5d0c1)
  );
  eye.position.set(x, 3.62, 0.88);
  eye.rotation.x = Math.PI / 2;
  eye.castShadow = true;
  owl.add(eye);

  const iris = new THREE.Mesh(
    new THREE.CylinderGeometry(0.29, 0.31, 0.1, 8, 1, false),
    polygonMaterial(0x9c8b63)
  );
  iris.position.set(x, 3.62, 0.99);
  iris.rotation.x = Math.PI / 2;
  iris.castShadow = true;
  owl.add(iris);

  const pupil = new THREE.Mesh(
    new THREE.CylinderGeometry(0.145, 0.16, 0.08, 8, 1, false),
    polygonMaterial(0x181b1c, 0.75)
  );
  pupil.position.set(x, 3.62, 1.07);
  pupil.rotation.x = Math.PI / 2;
  pupil.castShadow = true;
  owl.add(pupil);

  const glint = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.05, 0),
    polygonMaterial(0xece8da, 0.55)
  );
  glint.position.set(x - 0.045, 3.68, 1.14);
  owl.add(glint);
}

addEye(-0.61);
addEye(0.61);

function addBrow(x, rotationZ) {
  const brow = facetedMesh(
    new THREE.BoxGeometry(1.02, 0.2, 0.23, 2, 1, 1),
    new THREE.Vector3(1, 1, 1),
    0x5f6467,
    0.13
  );
  brow.position.set(x, 4.18, 0.87);
  brow.rotation.set(-0.05, 0, rotationZ);
  owl.add(brow);
}

addBrow(-0.54, -0.15);
addBrow(0.54, 0.15);

const beakVertices = [
  [-0.23, 3.52, 1.02],
  [0.23, 3.52, 1.02],
  [0, 3.08, 1],
  [0, 3.32, 1.62]
];
const beakTriangles = [
  [0, 1, 3],
  [1, 2, 3],
  [2, 0, 3],
  [0, 2, 1]
];
const beak = makeTriangleMesh(
  beakVertices,
  beakTriangles,
  0x474b4c,
  0.1
);
owl.add(beak);

const tailVertices = [
  [-0.58, 1.18, -0.42],
  [0.58, 1.18, -0.42],
  [0.4, 0.23, -0.48],
  [-0.4, 0.23, -0.48],
  [0, 0.72, -0.92],
  [0, 0.28, -0.62]
];
const tailTriangles = [
  [0, 1, 4],
  [1, 2, 4],
  [2, 5, 4],
  [2, 3, 5],
  [3, 0, 4],
  [3, 4, 5],
  [0, 3, 2],
  [0, 2, 1]
];
owl.add(makeTriangleMesh(
  tailVertices,
  tailTriangles,
  0x595e61,
  0.17
));

const perch = facetedMesh(
  new THREE.CylinderGeometry(0.18, 0.22, 3.45, 8, 2, false),
  new THREE.Vector3(1, 1, 1),
  0x55585a,
  0.16
);
perch.position.set(0, 0.35, 0.05);
perch.rotation.z = Math.PI / 2;
owl.add(perch);

function addFoot(x) {
  const ankle = facetedMesh(
    new THREE.CylinderGeometry(0.12, 0.15, 0.42, 6, 1, false),
    new THREE.Vector3(1, 1, 1),
    0x4c5052,
    0.12
  );
  ankle.position.set(x, 0.62, 0.11);
  owl.add(ankle);

  for (const offset of [-0.13, 0, 0.13]) {
    const claw = facetedMesh(
      new THREE.ConeGeometry(0.07, 0.55, 5, 1, false),
      new THREE.Vector3(1, 1, 1),
      0x3e4244,
      0.1
    );
    claw.position.set(x + offset, 0.39, 0.32);
    claw.rotation.x = Math.PI / 2;
    claw.rotation.z = offset * 1.5;
    owl.add(claw);
  }
}

addFoot(-0.43);
addFoot(0.43);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xc8c2b7,
  roughness: 1,
  metalness: 0
});
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(12, 64),
  floorMaterial
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0.08;
floor.receiveShadow = true;
scene.add(floor);

const pedestal = facetedMesh(
  new THREE.CylinderGeometry(2.05, 2.22, 0.32, 12, 1, false),
  new THREE.Vector3(1, 1, 1),
  0xaaa59c,
  0.08
);
pedestal.position.y = 0.1;
pedestal.castShadow = false;
pedestal.receiveShadow = true;
scene.add(pedestal);

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
