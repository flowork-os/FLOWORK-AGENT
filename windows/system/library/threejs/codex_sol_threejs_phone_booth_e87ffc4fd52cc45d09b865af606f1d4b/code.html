<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Red Telephone Booth</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #c9d3d7; }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 18px;
      bottom: 16px;
      color: rgba(26, 34, 38, .68);
      font: 12px/1.4 system-ui, sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Drag to orbit · Scroll to zoom</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcbd6da);
    scene.fog = new THREE.Fog(0xcbd6da, 14, 30);

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(7.2, 5.2, 8.4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.75, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;
    controls.minDistance = 5;
    controls.maxDistance = 18;
    controls.maxPolarAngle = Math.PI * 0.48;

    const red = new THREE.MeshStandardMaterial({
      color: 0xa51016,
      roughness: 0.34,
      metalness: 0.58
    });
    const redDark = new THREE.MeshStandardMaterial({
      color: 0x641015,
      roughness: 0.42,
      metalness: 0.58
    });
    const redEdge = new THREE.MeshStandardMaterial({
      color: 0xc01a20,
      roughness: 0.3,
      metalness: 0.62
    });
    const black = new THREE.MeshStandardMaterial({
      color: 0x111315,
      roughness: 0.42,
      metalness: 0.55
    });
    const rubber = new THREE.MeshStandardMaterial({
      color: 0x080909,
      roughness: 0.7,
      metalness: 0.05
    });
    const brass = new THREE.MeshStandardMaterial({
      color: 0xc79a42,
      roughness: 0.26,
      metalness: 0.88
    });
    const white = new THREE.MeshStandardMaterial({
      color: 0xf0e8d5,
      roughness: 0.52,
      metalness: 0.08
    });
    const glass = new THREE.MeshPhysicalMaterial({
      color: 0xcce8ee,
      transmission: 0.72,
      transparent: true,
      opacity: 0.36,
      roughness: 0.12,
      metalness: 0,
      ior: 1.48,
      thickness: 0.025,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x303235,
      roughness: 0.8,
      metalness: 0.12
    });

    function box(w, h, d, material, x = 0, y = 0, z = 0, parent = scene) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = material !== glass;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function cylinder(r1, r2, h, segments, material, x, y, z, parent = scene) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, segments), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function canvasSign(text, crown = false) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#eee7d5';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#9b1118';
      ctx.lineWidth = 16;
      ctx.strokeRect(12, 12, canvas.width - 24, canvas.height - 24);

      if (crown) {
        ctx.fillStyle = '#a31218';
        ctx.beginPath();
        ctx.moveTo(406, 88);
        ctx.lineTo(438, 42);
        ctx.lineTo(477, 81);
        ctx.lineTo(512, 28);
        ctx.lineTo(547, 81);
        ctx.lineTo(586, 42);
        ctx.lineTo(618, 88);
        ctx.lineTo(601, 119);
        ctx.lineTo(423, 119);
        ctx.closePath();
        ctx.fill();
        ctx.fillRect(430, 123, 164, 14);
        ctx.fillStyle = '#eee7d5';
        ctx.beginPath();
        ctx.arc(512, 91, 17, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#17191a';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 68px Georgia, serif';
      ctx.letterSpacing = '8px';
      ctx.fillText(text, 512, crown ? 190 : 132);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return new THREE.MeshStandardMaterial({
        map: texture,
        roughness: 0.5,
        metalness: 0.03
      });
    }

    const booth = new THREE.Group();
    scene.add(booth);

    const W = 2.28;
    const D = 1.82;
    const baseY = 0.15;
    const bodyBottom = 0.35;
    const bodyTop = 4.62;
    const post = 0.18;
    const frontZ = D / 2;
    const backZ = -D / 2;

    box(2.62, 0.18, 2.16, redDark, 0, 0.09, 0, booth);
    box(2.46, 0.22, 2.02, red, 0, 0.27, 0, booth);
    box(2.18, 0.09, 1.74, floorMat, 0, 0.415, 0, booth);

    for (const x of [-W / 2, W / 2]) {
      for (const z of [-D / 2, D / 2]) {
        box(post, bodyTop - bodyBottom, post, redEdge, x, (bodyTop + bodyBottom) / 2, z, booth);
      }
    }

    box(W + 0.2, 0.22, D + 0.2, redDark, 0, bodyTop - 0.06, 0, booth);
    box(W + 0.08, 0.14, D + 0.08, redEdge, 0, 0.5, 0, booth);

    function addPaneGrid({
      parent = booth,
      width,
      height,
      cols,
      rows,
      centerX = 0,
      centerY,
      centerZ,
      plane = 'front',
      border = 0.13,
      mullion = 0.085,
      glassDepth = 0.018
    }) {
      const innerW = width - border * 2;
      const innerH = height - border * 2;
      const cellW = (innerW - mullion * (cols - 1)) / cols;
      const cellH = (innerH - mullion * (rows - 1)) / rows;

      if (plane === 'front') {
        box(width, border, 0.12, red, centerX, centerY - height / 2 + border / 2, centerZ, parent);
        box(width, border, 0.12, red, centerX, centerY + height / 2 - border / 2, centerZ, parent);
        box(border, height, 0.12, red, centerX - width / 2 + border / 2, centerY, centerZ, parent);
        box(border, height, 0.12, red, centerX + width / 2 - border / 2, centerY, centerZ, parent);

        for (let c = 1; c < cols; c++) {
          const x = centerX - innerW / 2 + c * cellW + (c - 0.5) * mullion;
          box(mullion, innerH, 0.1, red, x, centerY, centerZ, parent);
        }
        for (let r = 1; r < rows; r++) {
          const y = centerY - innerH / 2 + r * cellH + (r - 0.5) * mullion;
          box(innerW, mullion, 0.1, red, centerX, y, centerZ, parent);
        }
        for (let c = 0; c < cols; c++) {
          for (let r = 0; r < rows; r++) {
            const x = centerX - innerW / 2 + cellW / 2 + c * (cellW + mullion);
            const y = centerY - innerH / 2 + cellH / 2 + r * (cellH + mullion);
            box(cellW - 0.025, cellH - 0.025, glassDepth, glass, x, y, centerZ - 0.01, parent);
          }
        }
      } else {
        box(0.12, border, width, red, centerX, centerY - height / 2 + border / 2, centerZ, parent);
        box(0.12, border, width, red, centerX, centerY + height / 2 - border / 2, centerZ, parent);
        box(0.12, height, border, red, centerX, centerY, centerZ - width / 2 + border / 2, parent);
        box(0.12, height, border, red, centerX, centerY, centerZ + width / 2 - border / 2, parent);

        for (let c = 1; c < cols; c++) {
          const z = centerZ - innerW / 2 + c * cellW + (c - 0.5) * mullion;
          box(0.1, innerH, mullion, red, centerX, centerY, z, parent);
        }
        for (let r = 1; r < rows; r++) {
          const y = centerY - innerH / 2 + r * cellH + (r - 0.5) * mullion;
          box(0.1, mullion, innerW, red, centerX, y, centerZ, parent);
        }
        for (let c = 0; c < cols; c++) {
          for (let r = 0; r < rows; r++) {
            const z = centerZ - innerW / 2 + cellW / 2 + c * (cellW + mullion);
            const y = centerY - innerH / 2 + cellH / 2 + r * (cellH + mullion);
            box(glassDepth, cellH - 0.025, cellW - 0.025, glass, centerX, y, z, parent);
          }
        }
      }
    }

    addPaneGrid({
      width: W - post,
      height: 3.55,
      cols: 3,
      rows: 5,
      centerY: 2.55,
      centerZ: backZ,
      plane: 'front'
    });

    addPaneGrid({
      width: D - post,
      height: 3.55,
      cols: 2,
      rows: 5,
      centerX: -W / 2,
      centerY: 2.55,
      centerZ: 0,
      plane: 'side'
    });

    addPaneGrid({
      width: D - post,
      height: 3.55,
      cols: 2,
      rows: 5,
      centerX: W / 2,
      centerY: 2.55,
      centerZ: 0,
      plane: 'side'
    });

    const doorWidth = W - post * 1.3;
    const doorHeight = 3.88;
    const doorPivot = new THREE.Group();
    doorPivot.position.set(-doorWidth / 2, 0, frontZ + 0.035);
    doorPivot.rotation.y = -0.23;
    booth.add(doorPivot);

    const door = new THREE.Group();
    door.position.x = doorWidth / 2;
    doorPivot.add(door);

    addPaneGrid({
      parent: door,
      width: doorWidth,
      height: doorHeight,
      cols: 3,
      rows: 5,
      centerY: 2.53,
      centerZ: 0,
      plane: 'front',
      border: 0.14,
      mullion: 0.08
    });

    for (const y of [1.15, 2.15, 3.15]) {
      cylinder(0.045, 0.045, 0.19, 16, brass, -doorWidth / 2 - 0.025, y, 0, doorPivot)
        .rotateZ(Math.PI / 2);
    }

    const handleGroup = new THREE.Group();
    handleGroup.position.set(doorWidth * 0.33, 2.02, 0.12);
    door.add(handleGroup);
    const handle = cylinder(0.045, 0.045, 0.48, 20, brass, 0, 0, 0, handleGroup);
    const mountTop = cylinder(0.065, 0.065, 0.13, 20, brass, 0, 0.22, -0.045, handleGroup);
    const mountBottom = cylinder(0.065, 0.065, 0.13, 20, brass, 0, -0.22, -0.045, handleGroup);
    mountTop.rotation.x = Math.PI / 2;
    mountBottom.rotation.x = Math.PI / 2;
    box(0.16, 0.64, 0.035, redDark, 0, 0, -0.085, handleGroup);

    const fasciaY = 4.83;
    box(2.52, 0.62, 2.06, red, 0, fasciaY, 0, booth);
    box(2.14, 0.38, 0.035, canvasSign('TELEPHONE', true), 0, fasciaY, 1.046, booth);
    box(2.14, 0.38, 0.035, canvasSign('TELEPHONE', true), 0, fasciaY, -1.046, booth).rotation.y = Math.PI;
    box(0.035, 0.38, 1.66, canvasSign('TELEPHONE', true), 1.266, fasciaY, 0, booth).rotation.y = Math.PI / 2;
    box(0.035, 0.38, 1.66, canvasSign('TELEPHONE', true), -1.266, fasciaY, 0, booth).rotation.y = -Math.PI / 2;

    box(2.68, 0.13, 2.22, redDark, 0, 5.18, 0, booth);
    const roof = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 1.78, 0.72, 4), red);
    roof.position.set(0, 5.58, 0);
    roof.rotation.y = Math.PI / 4;
    roof.scale.z = 0.79;
    roof.castShadow = true;
    roof.receiveShadow = true;
    booth.add(roof);

    const finialBase = cylinder(0.18, 0.24, 0.12, 24, redDark, 0, 5.99, 0, booth);
    const finial = cylinder(0.025, 0.13, 0.22, 24, brass, 0, 6.15, 0, booth);
    finialBase.castShadow = finial.castShadow = true;

    const phoneGroup = new THREE.Group();
    phoneGroup.position.set(0.18, 1.5, backZ + 0.22);
    booth.add(phoneGroup);

    box(1.52, 0.12, 0.52, redDark, 0, -0.48, 0.12, phoneGroup);
    box(1.42, 0.08, 0.47, black, 0, -0.39, 0.1, phoneGroup);
    box(0.82, 0.75, 0.28, black, 0, 0, 0, phoneGroup);
    box(0.7, 0.12, 0.34, rubber, 0, 0.4, 0, phoneGroup);

    const dial = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.055, 18, 48), brass);
    dial.position.set(0, 0.02, 0.16);
    dial.castShadow = true;
    phoneGroup.add(dial);
    cylinder(0.075, 0.075, 0.04, 24, rubber, 0, 0.02, 0.19, phoneGroup).rotation.x = Math.PI / 2;

    const handset = new THREE.Group();
    handset.position.set(0, 0.55, 0.06);
    phoneGroup.add(handset);
    const grip = cylinder(0.075, 0.075, 0.66, 20, rubber, 0, 0, 0, handset);
    grip.rotation.z = Math.PI / 2;
    const leftReceiver = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.16, 8, 20), rubber);
    leftReceiver.position.x = -0.41;
    leftReceiver.rotation.z = Math.PI / 2;
    leftReceiver.castShadow = true;
    handset.add(leftReceiver);
    const rightReceiver = leftReceiver.clone();
    rightReceiver.position.x = 0.41;
    handset.add(rightReceiver);

    const cordPoints = [];
    for (let i = 0; i <= 36; i++) {
      const t = i / 36;
      cordPoints.push(new THREE.Vector3(
        0.43 + Math.sin(t * Math.PI * 7) * 0.035,
        0.44 - t * 0.83,
        0.14 + Math.cos(t * Math.PI * 7) * 0.025
      ));
    }
    const cordCurve = new THREE.CatmullRomCurve3(cordPoints);
    const cord = new THREE.Mesh(new THREE.TubeGeometry(cordCurve, 72, 0.018, 8, false), rubber);
    cord.castShadow = true;
    phoneGroup.add(cord);

    const notice = box(0.66, 0.46, 0.025, white, -0.61, 0.26, 0.165, phoneGroup);
    const noticeCanvas = document.createElement('canvas');
    noticeCanvas.width = 512;
    noticeCanvas.height = 384;
    const nctx = noticeCanvas.getContext('2d');
    nctx.fillStyle = '#eee8d8';
    nctx.fillRect(0, 0, 512, 384);
    nctx.fillStyle = '#8e171b';
    nctx.font = 'bold 52px Georgia';
    nctx.textAlign = 'center';
    nctx.fillText('LOCAL CALLS', 256, 90);
    nctx.fillStyle = '#222';
    nctx.font = '36px Georgia';
    nctx.fillText('LIFT RECEIVER', 256, 175);
    nctx.fillText('INSERT COINS', 256, 230);
    nctx.fillText('DIAL NUMBER', 256, 285);
    const noticeTexture = new THREE.CanvasTexture(noticeCanvas);
    noticeTexture.colorSpace = THREE.SRGBColorSpace;
    notice.material = new THREE.MeshStandardMaterial({ map: noticeTexture, roughness: 0.7 });

    const crown = new THREE.Group();
    crown.position.set(0, 5.29, 1.18);
    booth.add(crown);
    for (let i = -2; i <= 2; i++) {
      const spike = cylinder(0.015, 0.06, 0.22 + (2 - Math.abs(i)) * 0.04, 12, brass, i * 0.13, 0.08, 0, crown);
      spike.rotation.z = -i * 0.09;
    }
    box(0.68, 0.07, 0.08, brass, 0, -0.05, 0, crown);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(16, 96),
      new THREE.MeshStandardMaterial({ color: 0x9ba5a5, roughness: 0.96, metalness: 0 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.015;
    ground.receiveShadow = true;
    scene.add(ground);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(3.8, 9.5, 96),
      new THREE.MeshStandardMaterial({ color: 0xb6c1c2, roughness: 0.92 })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = -0.009;
    ring.receiveShadow = true;
    scene.add(ring);

    const hemi = new THREE.HemisphereLight(0xe5f3ff, 0x554e46, 2.1);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xfff2d9, 4.2);
    key.position.set(5, 9, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -5;
    key.shadow.camera.right = 5;
    key.shadow.camera.top = 8;
    key.shadow.camera.bottom = -3;
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 24;
    key.shadow.bias = -0.0003;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0x9dc9e5, 1.3);
    fill.position.set(-5, 5, -4);
    scene.add(fill);

    const interior = new THREE.PointLight(0xffd8a0, 14, 5, 2);
    interior.position.set(0, 4.15, 0);
    interior.castShadow = true;
    interior.shadow.mapSize.set(512, 512);
    scene.add(interior);

    renderer.domElement.addEventListener('pointerdown', () => {
      controls.autoRotate = false;
    });

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
