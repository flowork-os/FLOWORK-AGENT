<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Metro Train Car</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#dfe6ec}canvas{display:block}</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6ec);
scene.fog = new THREE.Fog(0xdfe6ec, 30, 70);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(11, 6, 13);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.target.set(0, 1.4, 0);
controls.maxPolarAngle = Math.PI * 0.49;

// Lighting
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a97a3, 0.6));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.6);
sun.position.set(10, 14, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
sun.shadow.bias = -0.0003;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.4);
fill.position.set(-8, 6, -10);
scene.add(fill);

// Materials — clean transit livery
const bodyMat  = new THREE.MeshStandardMaterial({ color: 0xf2f4f6, roughness: 0.35, metalness: 0.25 });
const bandMat  = new THREE.MeshStandardMaterial({ color: 0xd63a2f, roughness: 0.4, metalness: 0.2 });
const doorMat  = new THREE.MeshStandardMaterial({ color: 0xc23227, roughness: 0.45, metalness: 0.2 });
const glassMat = new THREE.MeshStandardMaterial({ color: 0x16222e, roughness: 0.1, metalness: 0.9 });
const roofMat  = new THREE.MeshStandardMaterial({ color: 0x9aa4ad, roughness: 0.6, metalness: 0.4 });
const darkMat  = new THREE.MeshStandardMaterial({ color: 0x2b3238, roughness: 0.7, metalness: 0.3 });
const greyMat  = new THREE.MeshStandardMaterial({ color: 0x5a636b, roughness: 0.6, metalness: 0.5 });
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1c2126, roughness: 0.5, metalness: 0.7 });

const train = new THREE.Group();
scene.add(train);

const add = (geo, mat, x, y, z, parent = train) => {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
};

// ---- Carriage body: long rounded rectangular shell ----
const L = 12, W = 2.7, H = 2.6, floorY = 1.1;
const bodyShape = new THREE.Shape();
const r = 0.35, hw = W/2;
bodyShape.moveTo(-hw + r, 0);
bodyShape.lineTo(hw - r, 0);
bodyShape.quadraticCurveTo(hw, 0, hw, r);
bodyShape.lineTo(hw, H - 0.6);
bodyShape.quadraticCurveTo(hw, H, hw - 0.7, H);
bodyShape.lineTo(-hw + 0.7, H);
bodyShape.quadraticCurveTo(-hw, H, -hw, H - 0.6);
bodyShape.lineTo(-hw, r);
bodyShape.quadraticCurveTo(-hw, 0, -hw + r, 0);
const bodyGeo = new THREE.ExtrudeGeometry(bodyShape, { depth: L, bevelEnabled: true, bevelSize: 0.12, bevelThickness: 0.12, bevelSegments: 4, curveSegments: 12 });
bodyGeo.rotateY(Math.PI/2);
bodyGeo.translate(-L/2, floorY, 0);
add(bodyGeo, bodyMat, 0, 0, 0);

// Livery band along each side
[-1, 1].forEach(s => {
  add(new THREE.BoxGeometry(L + 0.05, 0.28, 0.05), bandMat, 0, floorY + 0.55, s * (hw + 0.11));
});

// ---- Windows & doors layout ----
const winY = floorY + 1.75, winH = 0.75, sideZ = hw + 0.1;
const doorX = [-3.4, 3.4]; // two sets of sliding doors per side
const winX = [-5.2, -1.4, 0, 1.4, 5.2];

[-1, 1].forEach(s => {
  // side windows
  winX.forEach(x => {
    add(new THREE.BoxGeometry(1.05, winH, 0.06), glassMat, x, winY, s * sideZ);
  });
  // sliding door pairs
  doorX.forEach(x => {
    [-0.4, 0.4].forEach(dx => {
      add(new THREE.BoxGeometry(0.72, 2.05, 0.07), doorMat, x + dx, floorY + 1.15, s * (sideZ + 0.01));
      add(new THREE.BoxGeometry(0.34, 0.55, 0.09), glassMat, x + dx, winY, s * (sideZ + 0.01));
    });
    // door frame recess line
    add(new THREE.BoxGeometry(1.62, 2.15, 0.03), darkMat, x, floorY + 1.15, s * (sideZ - 0.02));
  });
});

// End windows
[-1, 1].forEach(s => {
  add(new THREE.BoxGeometry(0.08, winH, 1.3), glassMat, s * (L/2 + 0.14), winY, 0);
  add(new THREE.BoxGeometry(0.1, 0.15, 2.2), bandMat, s * (L/2 + 0.13), floorY + 0.55, 0);
});

// ---- Roof: pan + equipment box silhouettes ----
add(new THREE.BoxGeometry(L - 0.6, 0.16, W - 0.9), roofMat, 0, floorY + H + 0.12, 0);
const roofBoxes = [
  [3.6, 0.45, 1.5, -3.5], [2.6, 0.35, 1.3, 0.6], [1.6, 0.55, 1.2, 3.9]
];
roofBoxes.forEach(([bl, bh, bw, x]) => {
  const b = add(new THREE.BoxGeometry(bl, bh, bw), greyMat, x, floorY + H + 0.2 + bh/2, 0);
  b.geometry.translate(0, 0, 0);
});
// small vents
[-5.2, 2.2, 5.2].forEach(x => add(new THREE.CylinderGeometry(0.16, 0.2, 0.22, 16), darkMat, x, floorY + H + 0.3, 0.7));

// ---- Underbody: skirt, equipment boxes, bogies ----
add(new THREE.BoxGeometry(L - 0.4, 0.35, W - 0.5), darkMat, 0, floorY - 0.05, 0);
[[1.8, 0.5, -3.2], [2.4, 0.55, 0.2], [1.4, 0.45, 3.6]].forEach(([bl, bh, x]) => {
  add(new THREE.BoxGeometry(bl, bh, W - 0.7), greyMat, x, floorY - 0.3 - bh/2 + 0.28, 0);
});

// Bogies with wheels
[-4.2, 4.2].forEach(x => {
  const bogie = new THREE.Group();
  bogie.position.set(x, 0.45, 0);
  train.add(bogie);
  add(new THREE.BoxGeometry(2.2, 0.4, 1.9), darkMat, 0, 0.1, 0, bogie);
  [-0.75, 0.75].forEach(wx => [-1, 1].forEach(s => {
    const w = add(new THREE.CylinderGeometry(0.42, 0.42, 0.18, 24), wheelMat, wx, -0.02, s * 0.95, bogie);
    w.rotation.x = Math.PI/2;
  }));
  [-0.75, 0.75].forEach(wx => {
    const axle = add(new THREE.CylinderGeometry(0.07, 0.07, 1.9, 12), greyMat, wx, -0.02, 0, bogie);
    axle.rotation.x = Math.PI/2;
  });
});

// Couplers
[-1, 1].forEach(s => {
  add(new THREE.BoxGeometry(0.5, 0.18, 0.18), darkMat, s * (L/2 + 0.35), 0.75, 0);
  add(new THREE.BoxGeometry(0.12, 0.3, 0.34), greyMat, s * (L/2 + 0.6), 0.75, 0);
});

// Headlights on ends
[-1, 1].forEach(s => [-0.85, 0.85].forEach(z => {
  add(new THREE.CylinderGeometry(0.09, 0.09, 0.06, 16), new THREE.MeshStandardMaterial({ color: 0xfff2c0, emissive: 0xffe9a0, emissiveIntensity: 0.9 }), s * (L/2 + 0.16), floorY + 0.55, z).rotation.z = Math.PI/2;
}));

// ---- Ground: soft shadow catcher ----
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 64),
  new THREE.ShadowMaterial({ opacity: 0.28 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
const disc = new THREE.Mesh(
  new THREE.CircleGeometry(30, 64),
  new THREE.MeshStandardMaterial({ color: 0xd4dbe1, roughness: 1 })
);
disc.rotation.x = -Math.PI/2;
disc.position.y = -0.005;
disc.receiveShadow = true;
scene.add(disc);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
