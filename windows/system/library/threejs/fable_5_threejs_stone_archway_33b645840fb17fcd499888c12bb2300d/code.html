<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stone Archway</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1116; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101520);
scene.fog = new THREE.Fog(0x101520, 18, 45);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.5, 3.2, 7.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.9, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI * 0.52;

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xbfd4e6, 0x3a3228, 0.55));

const sun = new THREE.DirectionalLight(0xfff1dc, 2.2);
sun.position.set(6, 9, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -6; sun.shadow.camera.right = 6;
sun.shadow.camera.top = 8;   sun.shadow.camera.bottom = -2;
sun.shadow.camera.near = 2;  sun.shadow.camera.far = 25;
sun.shadow.radius = 6;
sun.shadow.bias = -0.0004;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x88a5c8, 0.5);
fill.position.set(-6, 4, -5);
scene.add(fill);

// ---------- Procedural stone texture ----------
function stoneTexture(base, mottle, size = 256) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, size, size);
  for (let i = 0; i < 2600; i++) {
    g.fillStyle = `rgba(${mottle},${(Math.random() * 0.16).toFixed(3)})`;
    const r = Math.random() * 2.2 + 0.4;
    g.beginPath();
    g.arc(Math.random() * size, Math.random() * size, r, 0, 7);
    g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const texA = stoneTexture('#9a8f7d', '40,36,30');
const texB = stoneTexture('#a89d88', '50,44,36');

const stoneMat  = new THREE.MeshStandardMaterial({ map: texA, roughness: 0.92, metalness: 0.0 });
const stoneMat2 = new THREE.MeshStandardMaterial({ map: texB, roughness: 0.88, metalness: 0.0 });
const keyMat    = new THREE.MeshStandardMaterial({ map: texB, color: 0xcfc4ab, roughness: 0.85 });

// ---------- Archway parameters (meters) ----------
const R_IN = 1.1;      // inner arch radius (clear opening ~2.2 m wide)
const R_OUT = 1.55;    // outer arch radius
const DEPTH = 0.6;     // wall thickness
const SPRING = 2.1;    // springing height (top of piers)
const PIER_W = R_OUT - R_IN + 0.35; // pier width beyond opening

const arch = new THREE.Group();

// small deterministic jitter for a hand-hewn feel
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

function addBlock(geo, mat, x, y, z, ry = 0, rz = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.y = ry; m.rotation.z = rz;
  m.castShadow = m.receiveShadow = true;
  arch.add(m);
  return m;
}

// ---------- Piers: coursed ashlar blocks ----------
const COURSES = 6;
const CH = SPRING / COURSES;
const pierCX = R_IN + PIER_W / 2;
for (const side of [-1, 1]) {
  for (let i = 0; i < COURSES; i++) {
    const inset = 0.012 * rnd();
    const g = new THREE.BoxGeometry(PIER_W - inset, CH - 0.02, DEPTH - inset);
    const mat = (i % 2 === 0) ? stoneMat : stoneMat2;
    addBlock(g, mat, side * pierCX + (rnd() - 0.5) * 0.015, CH * (i + 0.5),
             (rnd() - 0.5) * 0.015, 0, (rnd() - 0.5) * 0.008);
  }
  // impost block at springing line
  const imp = new THREE.BoxGeometry(PIER_W + 0.16, 0.14, DEPTH + 0.16);
  addBlock(imp, keyMat, side * pierCX, SPRING + 0.07, 0);
  // plinth base
  const base = new THREE.BoxGeometry(PIER_W + 0.2, 0.18, DEPTH + 0.2);
  addBlock(base, keyMat, side * pierCX, 0.09, 0);
}

// ---------- Voussoirs: wedge-shaped arch blocks ----------
const springY = SPRING + 0.14;
function voussoirGeo(a0, a1, r0, r1, depth) {
  const s = new THREE.Shape();
  s.moveTo(r0 * Math.cos(a0), r0 * Math.sin(a0));
  s.absarc(0, 0, r0, a0, a1, false);
  s.lineTo(r1 * Math.cos(a1), r1 * Math.sin(a1));
  s.absarc(0, 0, r1, a1, a0, true);
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.012, bevelSegments: 1, curveSegments: 10 });
  g.translate(0, 0, -depth / 2);
  return g;
}

const N = 11;             // odd → middle block is the keystone
const GAP = 0.012;        // mortar joint (radians)
for (let i = 0; i < N; i++) {
  const a0 = Math.PI * i / N + GAP / 2;
  const a1 = Math.PI * (i + 1) / N - GAP / 2;
  const isKey = i === (N - 1) / 2;
  if (isKey) continue; // keystone added separately, slightly oversized
  const g = voussoirGeo(a0, a1, R_IN, R_OUT, DEPTH - 0.01);
  const m = addBlock(g, i % 2 ? stoneMat2 : stoneMat, 0, springY, 0);
  m.rotation.z = (rnd() - 0.5) * 0.004;
}

// Keystone: proud of the arch face and slightly taller
{
  const half = Math.PI / N / 2 * 1.12;
  const mid = Math.PI / 2;
  const g = voussoirGeo(mid - half, mid + half, R_IN - 0.03, R_OUT + 0.1, DEPTH + 0.1);
  addBlock(g, keyMat, 0, springY, 0);
}

// ---------- Spandrel fill: squares off the arch up to the coping ----------
{
  const topY = springY + R_OUT;
  const shape = new THREE.Shape();
  const W = pierCX + PIER_W / 2;
  shape.moveTo(-W, 0);
  shape.lineTo(-W, R_OUT + 0.02);
  shape.lineTo(W, R_OUT + 0.02);
  shape.lineTo(W, 0);
  shape.closePath();
  const hole = new THREE.Path();
  hole.absarc(0, 0, R_OUT + 0.005, 0, Math.PI, false);
  hole.lineTo(-W, 0);
  hole.lineTo(W, 0);
  shape.holes.push(hole);
  const g = new THREE.ExtrudeGeometry(shape, { depth: DEPTH - 0.06, bevelEnabled: false, curveSegments: 32 });
  g.translate(0, 0, -(DEPTH - 0.06) / 2);
  const m = addBlock(g, stoneMat, 0, springY, 0);
  m.material = stoneMat;
  void topY;
}

// ---------- Coping course: flat capstones across the top ----------
{
  const topY = springY + R_OUT + 0.02;
  const W = pierCX + PIER_W / 2 + 0.1;
  const nCaps = 7;
  const capW = (2 * W) / nCaps;
  for (let i = 0; i < nCaps; i++) {
    const g = new THREE.BoxGeometry(capW - 0.02, 0.16, DEPTH + 0.18);
    addBlock(g, keyMat, -W + capW * (i + 0.5), topY + 0.08, 0, 0, (rnd() - 0.5) * 0.006);
  }
}

scene.add(arch);

// ---------- Ground ----------
const groundTex = stoneTexture('#5d5а4a'.replace('а','a'), '30,28,22', 256);
groundTex.repeat.set(8, 8);
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(16, 64),
  new THREE.MeshStandardMaterial({ map: groundTex, color: 0x87817a, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// soft contact shadow disc
const shadowCanvas = document.createElement('canvas');
shadowCanvas.width = shadowCanvas.height = 128;
const sg = shadowCanvas.getContext('2d');
const grad = sg.createRadialGradient(64, 64, 4, 64, 64, 64);
grad.addColorStop(0, 'rgba(0,0,0,0.32)');
grad.addColorStop(1, 'rgba(0,0,0,0)');
sg.fillStyle = grad; sg.fillRect(0, 0, 128, 128);
const contact = new THREE.Mesh(
  new THREE.PlaneGeometry(7.5, 4.2),
  new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shadowCanvas), transparent: true, depthWrite: false })
);
contact.rotation.x = -Math.PI / 2;
contact.position.y = 0.012;
scene.add(contact);

// ---------- Resize / Animate ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
