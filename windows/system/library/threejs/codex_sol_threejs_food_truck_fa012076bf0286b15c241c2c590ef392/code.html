function mesh(geometry, material, position, rotation = [0, 0, 0], parent = scene) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(...position);
  object.rotation.set(...rotation);
  object.castShadow = true;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}

function box(size, material, position, rotation = [0, 0, 0], parent = scene) {
  return mesh(new THREE.BoxGeometry(...size), material, position, rotation, parent);
}

function cylinder(radiusTop, radiusBottom, height, segments, material, position, rotation = [0, 0, 0], parent = scene) {
  return mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
    material,
    position,
    rotation,
    parent
  );
}

function makeCanvasTexture(width, height, draw) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  draw(ctx, width, height);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

function signMaterial(text, background, foreground, accent) {
  const texture = makeCanvasTexture(1024, 512, (ctx, w, h) => {
    ctx.fillStyle = background;
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = accent;
    ctx.lineWidth = 26;
    ctx.strokeRect(18, 18, w - 36, h - 36);
    ctx.fillStyle = foreground;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '900 112px Arial, sans-serif';
    ctx.fillText(text, w / 2, h * 0.42);
    ctx.fillStyle = accent;
    ctx.font = '700 43px Arial, sans-serif';
    ctx.fillText('FRESH • FAST • FRIENDLY', w / 2, h * 0.72);
  });
  return new THREE.MeshStandardMaterial({ map: texture, roughness: 0.65 });
}

function archTrim(x, z) {
  const curve = new THREE.EllipseCurve(0, 0, 0.88, 0.88, 0, Math.PI, false, 0);
  const points = curve.getPoints(40).map(p => new THREE.Vector3(p.x, p.y, 0));
  const geometry = new THREE.TubeGeometry(
    new THREE.CatmullRomCurve3(points),
    40,
    0.085,
    10,
    false
  );
  const arch = mesh(geometry, mat.darkTeal, [x, 0.88, z], [0, 0, 0], truck);
  arch.castShadow = true;
}

function makeTable() {
  const table = new THREE.Group();
  table.position.set(-1.2, 0.1, 4.25);
  scene.add(table);
  cylinder(0.9, 0.9, 0.12, 32, mat.orange, [0, 1.12, 0], [0, 0, 0], table);
  cylinder(0.08, 0.08, 1.1, 14, mat.chrome, [0, 0.58, 0], [0, 0, 0], table);
  cylinder(0.48, 0.48, 0.08, 24, mat.chrome, [0, 0.07, 0], [0, 0, 0], table);
  cylinder(0.055, 0.055, 1.52, 14, mat.chrome, [0, 1.92, 0], [0, 0, 0], table);
  const umbrella = new THREE.ConeGeometry(1.65, 0.68, 24, 1, true);
  mesh(umbrella, mat.coral, [0, 2.65, 0], [0, 0, 0], table);
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    const stripe = new THREE.Mesh(
      new THREE.ConeGeometry(1.64, 0.69, 3, 1, true, a, Math.PI / 4),
      i % 2 ? mat.cream : mat.coral
    );
    stripe.position.y = 2.65;
    stripe.castShadow = true;
    table.add(stripe);
  }
}

const cloudMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 });
function cloud(x, y, z, scale) {
  const group = new THREE.Group();
  group.position.set(x, y, z);
  group.scale.setScalar(scale);
  scene.add(group);
  const pieces = [
    [-0.9, 0, 0, 0.8],
    [0, 0.2, 0, 1.05],
    [0.95, 0, 0, 0.7],
    [0.35, -0.12, 0, 0.8]
  ];
  for (const [px, py, pz, s] of pieces) {
    const puff = mesh(new THREE.SphereGeometry(s, 16, 12), cloudMat, [px, py, pz], [0, 0, 0], group);
    puff.castShadow = false;
    puff.receiveShadow = false;
  }
}
cloud(-12, 11, -20, 1.5);
cloud(14, 9, -25, 1.2);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
