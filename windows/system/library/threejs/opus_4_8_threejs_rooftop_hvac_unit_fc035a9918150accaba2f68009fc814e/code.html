<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rooftop HVAC Package Unit</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16181b; }
  #app { position: fixed; inset: 0; }
  #label {
    position: fixed; left: 16px; bottom: 14px; z-index: 2;
    font: 500 13px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #aeb4bb; letter-spacing: .3px; text-shadow: 0 1px 3px rgba(0,0,0,.6);
    user-select: none; pointer-events: none;
  }
  #label small { color: #6c7178; }
</style>
</head>
<body>
<div id="app"></div>
<div id="label">Rooftop HVAC Package Unit<br><small>procedural three.js · drag to orbit</small></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ *
 *  Renderer
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

/* ------------------------------------------------------------------ *
 *  Scene + camera
 * ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16181b);
scene.fog = new THREE.Fog(0x16181b, 16, 40);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(5.6, 3.3, 6.6);

// Soft indoor environment so the metal has something to reflect
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ *
 *  Lighting: hemisphere ambient + directional key / fill / rim
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0x9fb4c8, 0x2a2622, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e0, 2.4);
key.position.set(6.5, 8.5, 4.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 32;
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -5;
key.shadow.bias = -0.0002;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd2ff, 0.55);
fill.position.set(-7, 3.5, 3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xdce6ff, 0.9);
rim.position.set(-4, 5, -7);
scene.add(rim);

/* ------------------------------------------------------------------ *
 *  Ground plane — receives shadows only
 * ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.ShadowMaterial({ opacity: 0.4 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ *
 *  Materials (industrial greys)
 * ------------------------------------------------------------------ */
const metalMain = new THREE.MeshStandardMaterial({ color: 0x8f9398, metalness: 0.55, roughness: 0.52 });
const metalMid  = new THREE.MeshStandardMaterial({ color: 0x71757a, metalness: 0.6,  roughness: 0.48 });
const metalDark = new THREE.MeshStandardMaterial({ color: 0x4b4e52, metalness: 0.65, roughness: 0.45 });
const louverMat = new THREE.MeshStandardMaterial({ color: 0x676b70, metalness: 0.6,  roughness: 0.55 });
const grilleMat = new THREE.MeshStandardMaterial({ color: 0x34373a, metalness: 0.7,  roughness: 0.4  });
const curbMat   = new THREE.MeshStandardMaterial({ color: 0x47494d, metalness: 0.25, roughness: 0.82 });
const flashMat  = new THREE.MeshStandardMaterial({ color: 0x5d6167, metalness: 0.5,  roughness: 0.55 });
const screwMat  = new THREE.MeshStandardMaterial({ color: 0xc3c7cb, metalness: 0.9,  roughness: 0.3  });
const plateMat  = new THREE.MeshStandardMaterial({ color: 0xb8bcc0, metalness: 0.8,  roughness: 0.35 });

/* ------------------------------------------------------------------ *
 *  Helpers
 * ------------------------------------------------------------------ */
const box = (w, h, d, mat) => new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);

const screwGeo = new THREE.CylinderGeometry(0.014, 0.014, 0.025, 12);

// Louvered grille section (faces +Z), angled slats inside a frame
function makeLouver(w, h) {
  const g = new THREE.Group();
  const back = box(w, h, 0.03, grilleMat); back.position.z = -0.015; g.add(back);

  const fT = box(w, 0.06, 0.07, metalMid); fT.position.set(0,  h / 2 - 0.03, 0.02); g.add(fT);
  const fB = box(w, 0.06, 0.07, metalMid); fB.position.set(0, -h / 2 + 0.03, 0.02); g.add(fB);
  const fL = box(0.06, h, 0.07, metalMid); fL.position.set(-w / 2 + 0.03, 0, 0.02); g.add(fL);
  const fR = box(0.06, h, 0.07, metalMid); fR.position.set( w / 2 - 0.03, 0, 0.02); g.add(fR);

  const innerH = h - 0.18, innerW = w - 0.14;
  const spacing = 0.105;
  const n = Math.floor(innerH / spacing);
  const start = -innerH / 2 + spacing / 2;
  for (let i = 0; i < n; i++) {
    const slat = box(innerW, 0.02, 0.11, louverMat);
    slat.position.set(0, start + i * spacing, 0.015);
    slat.rotation.x = -0.52;
    g.add(slat);
  }
  return g;
}

// Removable access panel (faces +Z) with recessed field, fasteners and a latch handle
function makeAccessPanel(w, h) {
  const g = new THREE.Group();
  const plate = box(w, h, 0.03, metalMain); plate.position.z = 0.015; g.add(plate);
  const inset = box(w - 0.14, h - 0.14, 0.008, metalMid); inset.position.z = 0.032; g.add(inset);

  const sx = w / 2 - 0.055, sy = h / 2 - 0.055;
  const pts = [[-sx, sy], [0, sy], [sx, sy], [-sx, 0], [sx, 0], [-sx, -sy], [0, -sy], [sx, -sy]];
  for (const [px, py] of pts) {
    const s = new THREE.Mesh(screwGeo, screwMat);
    s.rotation.x = Math.PI / 2;
    s.position.set(px, py, 0.038);
    g.add(s);
  }

  const hBase = box(0.2, 0.08, 0.02, metalDark); hBase.position.set(w / 2 - 0.22, 0, 0.036); g.add(hBase);
  const hBar  = box(0.15, 0.04, 0.045, metalMid); hBar.position.set(w / 2 - 0.22, 0, 0.06);  g.add(hBar);
  return g;
}

// Top fan grille: raised venturi shroud, protective guard, hub + blades
function makeFanGrille(radius) {
  const g = new THREE.Group();
  const shroudH = 0.17;

  const flange = new THREE.Mesh(new THREE.CylinderGeometry(radius * 1.16, radius * 1.16, 0.04, 48), metalMid);
  flange.position.y = 0.02; g.add(flange);

  const shroud = new THREE.Mesh(
    new THREE.CylinderGeometry(radius * 1.03, radius * 0.92, shroudH, 48, 1, true), metalDark);
  shroud.position.y = shroudH / 2 + 0.02; g.add(shroud);

  const lip = new THREE.Mesh(new THREE.TorusGeometry(radius * 1.03, 0.025, 12, 48), metalMid);
  lip.rotation.x = Math.PI / 2; lip.position.y = shroudH + 0.02; g.add(lip);

  const guardY = shroudH + 0.06;
  for (const r of [radius * 0.82, radius * 0.56, radius * 0.3]) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.012, 8, 40), grilleMat);
    ring.rotation.x = Math.PI / 2; ring.position.y = guardY; g.add(ring);
  }
  for (let i = 0; i < 6; i++) {
    const spoke = box(radius * 2.04, 0.02, 0.02, grilleMat);
    spoke.position.y = guardY; spoke.rotation.y = i * Math.PI / 6; g.add(spoke);
  }

  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.08, 20), grilleMat);
  hub.position.y = guardY; g.add(hub);

  // fan blades sitting below the guard
  const blades = new THREE.Group();
  for (let i = 0; i < 5; i++) {
    const arm = new THREE.Group();
    const blade = box(radius * 0.78, 0.02, 0.14, metalDark);
    blade.position.x = radius * 0.08;
    blade.rotation.x = 0.35;
    arm.add(blade);
    arm.rotation.y = i * (Math.PI * 2 / 5);
    blades.add(arm);
  }
  blades.position.y = 0.09; g.add(blades);
  return g;
}

/* ------------------------------------------------------------------ *
 *  The HVAC package unit — ONE centered object
 * ------------------------------------------------------------------ */
const unit = new THREE.Group();

// Overall dimensions (meters)
const W = 3.0, D = 2.0, H = 1.55, curbH = 0.28;
const coreW = W - 0.1, coreD = D - 0.1;
const bodyCY = curbH + H / 2;      // 1.055
const topY   = curbH + H;          // 1.83
const faceY  = bodyCY;

// --- Roof curb (raised base the unit sits on) ---
const curb = box(W - 0.2, curbH, D - 0.2, curbMat);
curb.position.y = curbH / 2; unit.add(curb);
const flash = box(W - 0.14, 0.05, D - 0.14, flashMat);
flash.position.y = curbH - 0.02; unit.add(flash);

// --- Main sheet-metal body ---
const bodyCore = box(coreW, H, coreD, metalMain);
bodyCore.position.y = bodyCY; unit.add(bodyCore);

// base channel frame (slight overhang over the curb)
const baseRail = box(W - 0.04, 0.1, D - 0.04, metalDark);
baseRail.position.y = curbH + 0.05; unit.add(baseRail);

// corner posts
const postW = 0.12;
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  const post = box(postW, H, postW, metalMid);
  post.position.set(sx * (W / 2 - postW / 2), bodyCY, sz * (D / 2 - postW / 2));
  unit.add(post);
}

// top perimeter frame rails
const railZ1 = box(W - 0.1, 0.08, 0.1, metalMid); railZ1.position.set(0, topY - 0.03,  coreD / 2); unit.add(railZ1);
const railZ2 = box(W - 0.1, 0.08, 0.1, metalMid); railZ2.position.set(0, topY - 0.03, -coreD / 2); unit.add(railZ2);
const railX1 = box(0.1, 0.08, D - 0.1, metalMid); railX1.position.set( coreW / 2, topY - 0.03, 0); unit.add(railX1);
const railX2 = box(0.1, 0.08, D - 0.1, metalMid); railX2.position.set(-coreW / 2, topY - 0.03, 0); unit.add(railX2);

// subtle standing seams over the air-handler top
for (const sx of [0.2, 1.0]) {
  const seam = box(0.05, 0.04, D - 0.2, metalMid);
  seam.position.set(sx, topY + 0.01, 0); unit.add(seam);
}

// --- Face placement helpers (elements are built facing +Z) ---
const fz = coreD / 2, fx = coreW / 2;
function placeFront(el, x, y) { el.position.set(x, y, fz); unit.add(el); }
function placeBack(el, x, y)  { el.rotation.y = Math.PI;  el.position.set(x, y, -fz); unit.add(el); }
function placeLeft(el, z, y)  { el.rotation.y = -Math.PI / 2; el.position.set(-fx, y, z); unit.add(el); }
function placeRight(el, z, y) { el.rotation.y =  Math.PI / 2; el.position.set( fx, y, z); unit.add(el); }

// Front (long face): condenser louver on the left, two access panels
placeFront(makeLouver(1.0, 1.32), -0.85, faceY);
placeFront(makeAccessPanel(0.8, 1.26), 0.2, faceY);
placeFront(makeAccessPanel(0.8, 1.26), 1.0, faceY);

// Back (long face): mirrored — condenser louver + two access panels
placeBack(makeLouver(1.0, 1.32), -0.85, faceY);
placeBack(makeAccessPanel(0.8, 1.26), 0.2, faceY);
placeBack(makeAccessPanel(0.8, 1.26), 1.0, faceY);

// Left end (condenser coil): full louvered grille
placeLeft(makeLouver(1.6, 1.32), 0, faceY);

// Right end (air handler): large access panel + nameplate + control box
placeRight(makeAccessPanel(1.5, 1.28), 0, faceY);
const nameplate = box(0.14, 0.09, 0.006, plateMat);
nameplate.position.set(fx + 0.04, faceY + 0.5, -0.52); unit.add(nameplate);

const ctrlBox = box(0.14, 0.5, 0.36, metalDark);
ctrlBox.position.set(fx + 0.06, 0.62, 0.5); unit.add(ctrlBox);
const ctrlCover = box(0.02, 0.4, 0.28, metalMid);
ctrlCover.position.set(fx + 0.14, 0.62, 0.5); unit.add(ctrlCover);
const conduit = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.4, 12), metalMid);
conduit.position.set(fx + 0.06, 0.37, 0.66); unit.add(conduit);

// --- Top fan grille over the condenser section ---
const fan = makeFanGrille(0.55);
fan.position.set(-0.85, topY, 0);
unit.add(fan);

// enable shadows across the whole unit
unit.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

scene.add(unit);

/* ------------------------------------------------------------------ *
 *  Controls
 * ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.target.set(0, 0.85, 0);
controls.minDistance = 4;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.5;
controls.update();

/* ------------------------------------------------------------------ *
 *  Resize + render loop
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
