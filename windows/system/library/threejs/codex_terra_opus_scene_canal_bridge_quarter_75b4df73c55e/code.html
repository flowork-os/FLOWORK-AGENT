<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canal Bridge Quarter</title>
<style>
  html,body{margin:0;overflow:hidden;background:#10172a}
  canvas{display:block}
  #caption{position:fixed;left:18px;bottom:15px;color:#f7dca1;font:12px/1.4 Georgia,serif;letter-spacing:.14em;text-transform:uppercase;opacity:.72;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="caption">Canal Bridge Quarter · evening tide</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16233b);
scene.fog = new THREE.FogExp2(0x26344a, 0.025);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 100);
camera.position.set(15, 9, 18);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.32;
controls.minDistance = 8;
controls.maxDistance = 32;
controls.maxPolarAngle = Math.PI * 0.48;

let seed = 827341;
function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a, b) {
  return a + (b - a) * rand();
}
function pick(list) {
  return list[Math.floor(rand() * list.length)];
}
function mat(color, roughness = 0.8, metalness = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness });
}

function canvasTexture(draw, size = 256) {
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext("2d");
  draw(ctx, size);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  return texture;
}

const brickTexture = canvasTexture((ctx, s) => {
  ctx.fillStyle = "#8f6755";
  ctx.fillRect(0, 0, s, s);
  for (let y = 0; y < s; y += 28) {
    for (let x = -(y / 28 % 2) * 19; x < s; x += 39) {
      ctx.fillStyle = `hsl(${15 + Math.random() * 6}, 30%, ${42 + Math.random() * 12}%)`;
      ctx.fillRect(x + 1, y + 1, 37, 26);
    }
  }
  ctx.strokeStyle = "rgba(46,35,32,.28)";
  ctx.lineWidth = 1.3;
  for (let y = 0; y < s; y += 28) ctx.beginPath(), ctx.moveTo(0,y),ctx.lineTo(s,y),ctx.stroke();
}, 256);
brickTexture.repeat.set(2.2, 1.5);

const waterTexture = canvasTexture((ctx, s) => {
  ctx.fillStyle = "#143f3c";
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 180; i++) {
    const x = Math.random() * s;
    const y = Math.random() * s;
    const w = 8 + Math.random() * 44;
    ctx.strokeStyle = i % 3 ? "rgba(162,209,161,.12)" : "rgba(241,169,88,.12)";
    ctx.lineWidth = .7 + Math.random() * 1.2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + w * .4, y - 2, x + w, y + Math.random() * 3 - 1.5);
    ctx.stroke();
  }
}, 512);
waterTexture.repeat.set(2.3, 4.2);

const stone = mat(0x897c69, 0.94);
const darkStone = mat(0x5b5c58, 0.92);
const iron = mat(0x17242a, 0.48, 0.75);
const wood = mat(0x573722, 0.78);
const warmWood = mat(0x805038, 0.73);
const leaf = mat(0x315b39, 0.94);
const flowerPink = mat(0xd95870, 0.65);
const flowerYellow = mat(0xe2af44, 0.65);
const windowLight = new THREE.MeshStandardMaterial({
  color: 0xffc66b,
  emissive: 0xff9b40,
  emissiveIntensity: 1.75,
  roughness: 0.48
});
const dimWindow = new THREE.MeshStandardMaterial({
  color: 0x344952,
  emissive: 0x10191e,
  roughness: 0.45
});
const waterMat = new THREE.MeshStandardMaterial({
  color: 0x123f3c,
  map: waterTexture,
  roughness: 0.25,
  metalness: 0.32,
  transparent: true,
  opacity: 0.94
});

function mesh(geometry, material, x = 0, y = 0, z = 0) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(x, y, z);
  object.castShadow = true;
  object.receiveShadow = true;
  scene.add(object);
  return object;
}
function group() {
  const g = new THREE.Group();
  scene.add(g);
  return g;
}
function addBox(parent, width, height, depth, material, x, y, z) {
  const object = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
  object.position.set(x, y, z);
  object.castShadow = true;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}
function addCylinder(parent, radiusTop, radiusBottom, height, material, x, y, z, segments = 10) {
  const object = new THREE.Mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
    material
  );
  object.position.set(x, y, z);
  object.castShadow = true;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(55, 32, 18),
  new THREE.MeshBasicMaterial({ color: 0x263c61, side: THREE.BackSide })
);
scene.add(sky);

const ground = mesh(
  new THREE.PlaneGeometry(48, 58),
  new THREE.MeshStandardMaterial({ color: 0x344039, roughness: 1 }),
  0, -0.73, 0
);
ground.rotation.x = -Math.PI / 2;

const water = mesh(new THREE.PlaneGeometry(8.4, 43, 24, 80), waterMat, 0, -0.55, 0);
water.rotation.x = -Math.PI / 2;
water.receiveShadow = true;

const farWater = mesh(new THREE.PlaneGeometry(8.7, 24), waterMat, 0, -0.57, -30);
farWater.rotation.x = -Math.PI / 2;

function createCobbleBank(side) {
  const bank = group();
  bank.position.x = side * 4.9;
  addBox(bank, 1.5, 0.4, 43, darkStone, 0, -0.36, 0);
  addBox(bank, 0.35, 0.58, 43, stone, -side * 0.48, 0.05, 0);
  for (let z = -20; z <= 20; z += .74) {
    const c = new THREE.Mesh(
      new THREE.DodecahedronGeometry(range(.12, .2), 0),
      pick([stone, darkStone])
    );
    c.position.set(-side * .33, range(.28, .38), z + range(-.13, .13));
    c.rotation.set(rand(), rand(), rand());
    c.castShadow = true;
    bank.add(c);
  }
  scene.add(bank);
}
createCobbleBank(-1);
createCobbleBank(1);

function createHouse(side, z, width, height, facadeColor, roofColor) {
  const house = new THREE.Group();
  house.position.set(side * (5.7 + range(0, .45)), 0, z);
  house.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;
  scene.add(house);

  const depth = range(2.1, 2.8);
  const facade = mat(facadeColor, .86);
  const roof = mat(roofColor, .88);
  addBox(house, width, height, depth, facade, 0, height / 2, 0);

  const sideBrick = addBox(house, .1, height + .1, depth + .08, brickTexture ? new THREE.MeshStandardMaterial({
    map: brickTexture, roughness: .9, color: 0xd0ad91
  }) : facade, width / 2 + .02, height / 2, 0);
  sideBrick.scale.x = 1;

  for (let x = -width / 2 + .15; x <= width / 2 - .15; x += .28) {
    addBox(house, .05, height + .18, .08, mat(0xede0bc, .86), x, height / 2, depth / 2 + .045);
  }

  const gableShape = new THREE.Shape();
  gableShape.moveTo(-width / 2 - .08, 0);
  gableShape.lineTo(width / 2 + .08, 0);
  gableShape.lineTo(0, width * .72);
  gableShape.lineTo(-width / 2 - .08, 0);
  const gable = new THREE.Mesh(
    new THREE.ExtrudeGeometry(gableShape, { depth: .16, bevelEnabled: false }),
    roof
  );
  gable.position.set(0, height, depth / 2 + .06);
  gable.castShadow = true;
  house.add(gable);

  const roofCap = addBox(house, width + .34, .17, depth + .38, roof, 0, height + .05, 0);
  roofCap.rotation.z = 0;

  const floorCount = height > 5 ? 3 : 2;
  for (let row = 0; row < floorCount; row++) {
    const windowY = 1.15 + row * 1.35;
    const cols = width > 2.0 ? [-.53, .53] : [0];
    for (const x of cols) {
      const frame = addBox(house, .68, .92, .09, iron, x, windowY, depth / 2 + .13);
      const lit = rand() > .25;
      addBox(house, .52, .73, .025, lit ? windowLight : dimWindow, x, windowY, depth / 2 + .19);
      addBox(house, .055, .84, .05, warmWood, x, windowY, depth / 2 + .215);
      addBox(house, .57, .05, .05, warmWood, x, windowY, depth / 2 + .22);
      if (row === 0 && rand() > .38) {
        addBox(house, .83, .12, .32, warmWood, x, windowY - .52, depth / 2 + .18);
        for (let p = -1; p <= 1; p++) {
          const plant = new THREE.Mesh(new THREE.SphereGeometry(.105, 7, 6), pick([leaf, flowerPink, flowerYellow]));
          plant.position.set(x + p * .2, windowY - .39, depth / 2 + .38);
          plant.castShadow = true;
          house.add(plant);
        }
      }
    }
  }

  const doorX = width > 2 ? -width * .26 : 0;
  addBox(house, .78, 1.38, .1, warmWood, doorX, .69, depth / 2 + .13);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(.045, 8, 8), flowerYellow);
  knob.position.set(doorX + .25, .7, depth / 2 + .2);
  house.add(knob);

  const chimney = addBox(house, .38, .9, .42, mat(0x5c3731), width * .22, height + .58, 0);
  chimney.rotation.z = range(-.04, .04);
  return house;
}

const houseColors = [0xa75643, 0xbf8a4c, 0x4b6a72, 0x7b4e67, 0xc08b75, 0x4f755b];
const roofColors = [0x2e3943, 0x523835, 0x28484b, 0x3f3549];
const houses = [];
for (const side of [-1, 1]) {
  const zs = [-15.5, -11.7, -7.8, 7.2, 11.4, 15.1];
  for (let i = 0; i < zs.length; i++) {
    const h = range(4.2, 6.6);
    houses.push(createHouse(side, zs[i] + range(-.25, .25), range(1.65, 2.55), h, pick(houseColors), pick(roofColors)));
  }
}

function createBridge() {
  const bridge = group();
  bridge.position.z = .1;

  const deckMat = new THREE.MeshStandardMaterial({ map: brickTexture, color: 0xc1aa91, roughness: .92 });
  addBox(bridge, 12.2, .58, 2.9, deckMat, 0, 3.08, 0);
  addBox(bridge, 12.7, .24, 3.22, stone, 0, 3.45, 0);

  for (const x of [-4.7, 4.7]) {
    addBox(bridge, 1.15, 3.22, 2.62, stone, x, 1.0, 0);
    addBox(bridge, 1.38, .26, 2.86, darkStone, x, 2.58, 0);
    for (let y = -.1; y < 2.35; y += .47) {
      addBox(bridge, 1.22, .055, 2.72, darkStone, x, y, 0);
    }
  }

  const ringMat = mat(0xb3a48d, .92);
  const arch = new THREE.Mesh(
    new THREE.TorusGeometry(3.82, .38, 8, 28, Math.PI),
    ringMat
  );
  arch.position.set(0, -.05, 1.32);
  arch.rotation.z = Math.PI;
  arch.castShadow = true;
  arch.receiveShadow = true;
  bridge.add(arch);

  const backArch = arch.clone();
  backArch.position.z = -1.32;
  bridge.add(backArch);

  for (let i = 0; i <= 12; i++) {
    const angle = Math.PI - i * Math.PI / 12;
    const r = 3.84;
    const block = addBox(bridge, .62, .38, 2.76, pick([stone, ringMat, darkStone]), 0, 0, 0);
    block.position.set(Math.cos(angle) * r, -.05 + Math.sin(angle) * r, 0);
    block.rotation.z = angle - Math.PI / 2;
  }

  const railMat = iron;
  for (const z of [-1.47, 1.47]) {
    addBox(bridge, 12.75, .1, .1, railMat, 0, 4.06, z);
    for (let x = -5.9; x <= 5.9; x += .8) {
      addCylinder(bridge, .045, .06, .72, railMat, x, 3.72, z, 8);
      if (x < 5.5) {
        const diagonal = addBox(bridge, .035, .7, .035, railMat, x + .4, 3.72, z);
        diagonal.rotation.z = .75;
      }
    }
  }
  scene.add(bridge);
  return bridge;
}
createBridge();

function createLamp(x, z, side) {
  const lamp = group();
  lamp.position.set(x, 0, z);
  addCylinder(lamp, .11, .16, 2.52, iron, 0, 1.22, 0, 10);
  addCylinder(lamp, .22, .28, .12, iron, 0, .08, 0, 10);
  addCylinder(lamp, .18, .08, .18, iron, 0, 2.48, 0, 8);
  const lantern = new THREE.Mesh(new THREE.SphereGeometry(.22, 12, 8), windowLight);
  lantern.scale.y = 1.25;
  lantern.position.set(0, 2.7, 0);
  lantern.castShadow = true;
  lamp.add(lantern);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(.28, .24, 8), iron);
  cap.position.set(0, 3.02, 0);
  cap.castShadow = true;
  lamp.add(cap);
  const light = new THREE.PointLight(0xffa54c, 1.15, 7, 2);
  light.position.set(0, 2.68, 0);
  light.castShadow = true;
  light.shadow.mapSize.set(512, 512);
  lamp.add(light);
  lamp.userData.light = light;
  lamp.userData.phase = rand() * 6.28;
  lamp.userData.side = side;
  scene.add(lamp);
  return lamp;
}
const lamps = [
  createLamp(-4.45, -10.2, -1),
  createLamp(4.45, -9.0, 1),
  createLamp(-4.45, 8.8, -1),
  createLamp(4.45, 10.7, 1),
  createLamp(-4.45, 16.5, -1)
];

function createBicycle(x, z, side) {
  const bike = group();
  bike.position.set(x, .42, z);
  bike.rotation.y = side > 0 ? Math.PI / 2 : -Math.PI / 2;
  const wheelGeo = new THREE.TorusGeometry(.38, .028, 6, 18);
  for (const wx of [-.48, .48]) {
    const wheel = new THREE.Mesh(wheelGeo, iron);
    wheel.position.set(wx, .38, 0);
    wheel.rotation.y = Math.PI / 2;
    wheel.castShadow = true;
    bike.add(wheel);
  }
  const bar1 = addBox(bike, .92, .035, .035, iron, 0, .57, 0);
  bar1.rotation.z = -.38;
  const bar2 = addBox(bike, .67, .035, .035, iron, .07, .71, 0);
  bar2.rotation.z = .57;
  const bar3 = addBox(bike, .53, .035, .035, iron, -.15, .72, 0);
  bar3.rotation.z = -.72;
  const seat = addBox(bike, .24, .06, .13, iron, -.12, .97, 0);
  const handle = addBox(bike, .28, .035, .035, iron, .51, 1.08, 0);
  handle.rotation.z = -.2;
  scene.add(bike);
}
createBicycle(-4.12, -7.2, -1);
createBicycle(4.1, 7.8, 1);
createBicycle(-4.12, 12.4, -1);

function createBoat() {
  const boat = group();
  boat.position.set(-1.55, -.17, 7.0);
  boat.rotation.y = -.15;

  const hullShape = new THREE.Shape();
  hullShape.moveTo(-2.05, 0);
  hullShape.quadraticCurveTo(-1.35, -.62, 0, -.68);
  hullShape.quadraticCurveTo(1.35, -.62, 2.05, 0);
  hullShape.lineTo(1.5, .18);
  hullShape.lineTo(-1.5, .18);
  hullShape.lineTo(-2.05, 0);
  const hull = new THREE.Mesh(
    new THREE.ExtrudeGeometry(hullShape, { depth: .92, bevelEnabled: false }),
    warmWood
  );
  hull.rotation.x = Math.PI / 2;
  hull.position.y = .08;
  hull.castShadow = true;
  boat.add(hull);

  for (let x = -1.35; x <= 1.35; x += .45) {
    addBox(boat, .08, .12, 1.04, wood, x, .18, 0);
  }
  addBox(boat, 1.1, .2, .64, wood, -.45, .28, 0);
  const planter = addBox(boat, .92, .2, .33, warmWood, .75, .34, 0);
  for (let i = 0; i < 8; i++) {
    const bloom = new THREE.Mesh(new THREE.SphereGeometry(.1, 7, 6), i % 2 ? flowerPink : flowerYellow);
    bloom.position.set(.36 + i * .105, .56 + Math.sin(i) * .04, range(-.11, .11));
    bloom.castShadow = true;
    boat.add(bloom);
  }
  const oar = addBox(boat, 3.1, .055, .08, wood, 0, .45, .55);
  oar.rotation.y = .13;
  boat.userData.baseY = -.17;
  scene.add(boat);
  return boat;
}
const boat = createBoat();

function createLaundry() {
  const laundry = group();
  const p1 = new THREE.Vector3(-5.1, 5.05, -5.3);
  const p2 = new THREE.Vector3(4.9, 5.55, -4.8);
  const curve = new THREE.QuadraticBezierCurve3(
    p1,
    new THREE.Vector3(0, 4.35, -5.05),
    p2
  );
  const rope = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 20, .023, 5, false),
    mat(0x594337, .9)
  );
  laundry.add(rope);
  const clothes = [];
  for (let i = 0; i < 6; i++) {
    const t = .14 + i * .145;
    const pos = curve.getPoint(t);
    const cloth = new THREE.Mesh(
      new THREE.PlaneGeometry(.48 + (i % 2) * .1, .62),
      new THREE.MeshStandardMaterial({
        color: pick([0xe3d4b3, 0xb8494d, 0x4c7790, 0xd09e42]),
        side: THREE.DoubleSide,
        roughness: .9
      })
    );
    cloth.position.copy(pos);
    cloth.position.y -= .34;
    cloth.rotation.y = Math.PI * .5;
    cloth.castShadow = true;
    laundry.add(cloth);
    clothes.push({ object: cloth, phase: i * .72 });
  }
  laundry.userData.clothes = clothes;
  scene.add(laundry);
  return laundry;
}
const laundry = createLaundry();

function createDuck(z, x, scale) {
  const duck = group();
  duck.position.set(x, -.28, z);
  duck.scale.setScalar(scale);
  const body = new THREE.Mesh(new THREE.SphereGeometry(.28, 12, 8), mat(0x6c5739));
  body.scale.set(1.35, .64, .72);
  body.castShadow = true;
  duck.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.16, 10, 8), mat(0x314b37));
  head.position.set(.29, .1, 0);
  head.castShadow = true;
  duck.add(head);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(.06, .18, 6), flowerYellow);
  beak.position.set(.47, .08, 0);
  beak.rotation.z = -Math.PI / 2;
  duck.add(beak);
  duck.userData.baseX = x;
  duck.userData.baseZ = z;
  duck.userData.phase = rand() * 6.28;
  scene.add(duck);
  return duck;
}
const ducks = [
  createDuck(-1.4, -.4, .85),
  createDuck(-2.35, .7, .66),
  createDuck(-.55, 1.25, .73)
];

function addPlanter(x, z, side) {
  const planter = group();
  planter.position.set(x, .13, z);
  planter.rotation.y = side * .15;
  addBox(planter, .76, .28, .34, warmWood, 0, .16, 0);
  for (let i = 0; i < 7; i++) {
    const stem = addCylinder(planter, .022, .028, .26, leaf, range(-.28, .28), .43, range(-.08, .08), 6);
    stem.rotation.z = range(-.18, .18);
    const flower = new THREE.Mesh(new THREE.SphereGeometry(.09, 7, 6), i % 3 ? flowerPink : flowerYellow);
    flower.position.set(stem.position.x, .58, stem.position.z);
    flower.castShadow = true;
    planter.add(flower);
  }
  scene.add(planter);
}
addPlanter(-4.18, -2.8, -1);
addPlanter(4.15, 3.5, 1);
addPlanter(-4.18, 14.1, -1);

function addReflection(x, z, color) {
  const r = new THREE.Mesh(
    new THREE.PlaneGeometry(.16, 4.6),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .18, side: THREE.DoubleSide })
  );
  r.position.set(x, -.515, z + .65);
  r.rotation.x = -Math.PI / 2;
  r.rotation.z = range(-.18, .18);
  scene.add(r);
  return r;
}
const reflections = [
  addReflection(-3.8, -10.1, 0xffa54c),
  addReflection(3.7, -8.9, 0xffa54c),
  addReflection(-3.8, 8.7, 0xffa54c),
  addReflection(3.7, 10.6, 0xffa54c)
];

for (let i = 0; i < 25; i++) {
  const distant = new THREE.Group();
  distant.position.set((rand() > .5 ? -1 : 1) * range(7.5, 11), 0, range(-25, 25));
  const h = range(3, 7);
  addBox(distant, range(1.4, 2.5), h, range(1.8, 2.6), mat(pick(houseColors)), 0, h / 2, 0);
  distant.rotation.y = rand() * .2;
  scene.add(distant);
}

const hemisphere = new THREE.HemisphereLight(0x6885b3, 0x2e241a, 1.25);
scene.add(hemisphere);

const moonLight = new THREE.DirectionalLight(0x9bb8e8, 2.15);
moonLight.position.set(-8, 14, 7);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.left = -18;
moonLight.shadow.camera.right = 18;
moonLight.shadow.camera.top = 18;
moonLight.shadow.camera.bottom = -18;
moonLight.shadow.camera.near = 1;
moonLight.shadow.camera.far = 45;
scene.add(moonLight);

const sunset = new THREE.PointLight(0xd36d47, 1.1, 31, 2);
sunset.position.set(0, 7, -22);
scene.add(sunset);

const moon = new THREE.Mesh(
  new THREE.SphereGeometry(1.05, 20, 16),
  new THREE.MeshBasicMaterial({ color: 0xf8e9bd })
);
moon.position.set(-12, 13, -24);
scene.add(moon);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  waterTexture.offset.x = t * .004;
  waterTexture.offset.y = t * -.011;
  waterMat.roughness = .22 + Math.sin(t * .6) * .025;

  boat.position.y = boat.userData.baseY + Math.sin(t * 1.25) * .055;
  boat.rotation.z = Math.sin(t * .9) * .025;

  for (let i = 0; i < ducks.length; i++) {
    const duck = ducks[i];
    const p = duck.userData.phase;
    duck.position.x = duck.userData.baseX + Math.sin(t * .62 + p) * .78;
    duck.position.z = duck.userData.baseZ + Math.cos(t * .43 + p) * .35;
    duck.position.y = -.27 + Math.sin(t * 2 + p) * .028;
    duck.rotation.y = Math.cos(t * .62 + p) > 0 ? 0 : Math.PI;
  }

  for (const lamp of lamps) {
    lamp.userData.light.intensity = 1.03 + Math.sin(t * 5.4 + lamp.userData.phase) * .12;
  }

  for (const item of laundry.userData.clothes) {
    item.object.rotation.z = Math.sin(t * 1.45 + item.phase) * .18;
    item.object.rotation.y = Math.PI * .5 + Math.sin(t * 1.1 + item.phase) * .15;
  }

  for (let i = 0; i < reflections.length; i++) {
    reflections[i].material.opacity = .13 + Math.sin(t * 1.7 + i) * .045;
    reflections[i].scale.x = .8 + Math.sin(t * 2.2 + i) * .18;
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
