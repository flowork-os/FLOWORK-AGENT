<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Pineapple</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #17130d; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17130d);
scene.fog = new THREE.Fog(0x17130d, 7, 14);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.2, 2.9, 5.3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 3.2;
controls.maxDistance = 8;
controls.target.set(0, 0.55, 0);

scene.add(new THREE.HemisphereLight(0xffe8b8, 0x24170c, 2.1));

const key = new THREE.DirectionalLight(0xffd59a, 4.2);
key.position.set(-3.5, 6, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0005;
scene.add(key);

const rim = new THREE.DirectionalLight(0x9abf75, 1.6);
rim.position.set(4, 3, -4);
scene.add(rim);

const bodyMaterial = new THREE.MeshStandardMaterial({
  color: 0xb87827,
  roughness: 0.84,
  metalness: 0.02
});

const body = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 40), bodyMaterial);
body.scale.set(0.98, 1.38, 0.93);
body.rotation.z = -0.045;
body.position.y = 0;
body.castShadow = true;
body.receiveShadow = true;
scene.add(body);

const neck = new THREE.Mesh(
  new THREE.CylinderGeometry(0.42, 0.58, 0.34, 32),
  new THREE.MeshStandardMaterial({ color: 0x9b5b20, roughness: 0.9 })
);
neck.position.y = 1.25;
neck.scale.z = 0.92;
neck.castShadow = true;
scene.add(neck);

const eyeGeometry = new THREE.CylinderGeometry(0.105, 0.13, 0.105, 6);
const eyeMaterial = new THREE.MeshStandardMaterial({
  color: 0xc58a36,
  roughness: 0.76
});
const eyeCoreGeometry = new THREE.CylinderGeometry(0.026, 0.045, 0.014, 6);
const eyeCoreMaterial = new THREE.MeshStandardMaterial({
  color: 0x704018,
  roughness: 0.92
});

const rx = 0.98, ry = 1.38, rz = 0.93;
const up = new THREE.Vector3(0, 1, 0);

for (let ring = 0; ring < 11; ring++) {
  const phi = -1.12 + ring * 0.224;
  const count = 13 + Math.round(8 * Math.cos(phi));
  const offset = (ring % 2) * Math.PI / count;

  for (let i = 0; i < count; i++) {
    const lon = i * Math.PI * 2 / count + offset;
    const cp = Math.cos(phi), sp = Math.sin(phi);
    const position = new THREE.Vector3(
      rx * cp * Math.cos(lon),
      ry * sp,
      rz * cp * Math.sin(lon)
    );

    const normal = new THREE.Vector3(
      position.x / (rx * rx),
      position.y / (ry * ry),
      position.z / (rz * rz)
    ).normalize();

    const eye = new THREE.Mesh(eyeGeometry, eyeMaterial);
    eye.position.copy(position).addScaledVector(normal, 0.045);
    eye.quaternion.setFromUnitVectors(up, normal);
    eye.castShadow = true;
    eye.receiveShadow = true;
    scene.add(eye);

    const core = new THREE.Mesh(eyeCoreGeometry, eyeCoreMaterial);
    core.position.copy(position).addScaledVector(normal, 0.102);
    core.quaternion.setFromUnitVectors(up, normal);
    core.castShadow = true;
    scene.add(core);
  }
}

function createLeafGeometry() {
  const segments = 12;
  const vertices = [];
  const indices = [];

  for (let i = 0; i < segments; i++) {
    const t = i / (segments - 1);
    const y = t * 1.55;
    const baseWidth = 0.27 * Math.pow(Math.sin(Math.PI * t), 0.58);
    const serration = i === segments - 1 ? 0.08 : (i % 2 === 0 ? 0.92 : 1.12);
    const width = Math.max(0.018, baseWidth * serration);
    const z = 0.18 * t * t - 0.025 * Math.sin(t * Math.PI);
    const thickness = 0.018 + 0.012 * (1 - t);

    vertices.push(
      -width, y, z + thickness,
       width, y, z + thickness,
      -width, y, z - thickness,
       width, y, z - thickness
    );
  }

  for (let i = 0; i < segments - 1; i++) {
    const a = i * 4;
    const b = (i + 1) * 4;
    indices.push(
      a, b, a + 1, a + 1, b, b + 1,
      a + 2, a + 2 + 1, b + 2, a + 3, b + 3, b + 2,
      a, a + 2, b, b, a + 2, b + 2,
      a + 1, b + 1, a + 3, a + 3, b + 1, b + 3
    );
  }

  indices.push(0, 1, 2, 1, 3, 2);
  const last = (segments - 1) * 4;
  indices.push(last, last + 2, last + 1, last + 1, last + 2, last + 3);

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const leafGeometry = createLeafGeometry();
const leafMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x477b2f, roughness: 0.78, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x315d28, roughness: 0.84, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x659343, roughness: 0.74, side: THREE.DoubleSide })
];

const leafCount = 25;
for (let i = 0; i < leafCount; i++) {
  const angle = i * Math.PI * 2 / leafCount + 0.18 * Math.sin(i * 2.7);
  const tilt = 0.23 + 0.27 * (0.5 + 0.5 * Math.sin(i * 1.91));
  const direction = new THREE.Vector3(
    Math.sin(angle) * Math.sin(tilt),
    Math.cos(tilt),
    Math.cos(angle) * Math.sin(tilt)
  ).normalize();

  const leaf = new THREE.Mesh(leafGeometry, leafMaterials[i % leafMaterials.length]);
  leaf.position.set(
    0.09 * Math.cos(angle),
    1.37 + 0.035 * Math.sin(i * 2.1),
    0.09 * Math.sin(angle)
  );
  leaf.quaternion.setFromUnitVectors(up, direction);
  const scale = 0.88 + 0.24 * (0.5 + 0.5 * Math.sin(i * 1.47));
  leaf.scale.set(scale, scale, scale);
  leaf.rotation.y += 0.12 * Math.sin(i * 3.4);
  leaf.castShadow = true;
  leaf.receiveShadow = true;
  scene.add(leaf);
}

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(8, 64),
  new THREE.MeshStandardMaterial({ color: 0x241b11, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.42;
ground.receiveShadow = true;
scene.add(ground);

const pedestalShadow = new THREE.Mesh(
  new THREE.CircleGeometry(1.25, 48),
  new THREE.MeshBasicMaterial({ color: 0x080604, transparent: true, opacity: 0.34 })
);
pedestalShadow.rotation.x = -Math.PI / 2;
pedestalShadow.position.set(0, -1.405, 0);
pedestalShadow.scale.set(1.0, 0.72, 1);
scene.add(pedestalShadow);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
