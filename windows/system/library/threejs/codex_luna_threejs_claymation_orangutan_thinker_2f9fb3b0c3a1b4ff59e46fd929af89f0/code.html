<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clay Orangutan</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d7b79a}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8b99d);
scene.fog = new THREE.Fog(0xd8b99d, 8, 18);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.6, 3.8, 7.5);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.target.set(0, 1.8, 0);

const clay = new THREE.MeshStandardMaterial({ color:0xb9522f, roughness:0.92, metalness:0 });
const clayDark = new THREE.MeshStandardMaterial({ color:0x8e351f, roughness:0.96 });
const clayLight = new THREE.MeshStandardMaterial({ color:0xc9663a, roughness:0.93 });
const putty = new THREE.MeshStandardMaterial({ color:0xd5b184, roughness:0.88 });
const eyeMat = new THREE.MeshStandardMaterial({ color:0x211611, roughness:0.45 });
const groundMat = new THREE.MeshStandardMaterial({ color:0xb99276, roughness:1 });

const figure = new THREE.Group();
scene.add(figure);

function sphere(name, position, scale, material, segments=32) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, segments, segments), material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.scale.set(scale[0], scale[1], scale[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  figure.add(mesh);
  return mesh;
}

function cylinderBetween(name, a, b, radius, material, radial=18) {
  const start = new THREE.Vector3(a[0],a[1],a[2]);
  const end = new THREE.Vector3(b[0],b[1],b[2]);
  const direction = new THREE.Vector3().subVectors(end,start);
  const length = direction.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius*1.08, length, radial), material);
  mesh.name = name;
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  figure.add(mesh);
  return mesh;
}

function tube(points, radius, material) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0],p[1],p[2])));
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 18, radius, 7, false), material);
  mesh.castShadow = true;
  figure.add(mesh);
  return mesh;
}

function fingerprint(position, rotation, scale) {
  const mark = sphere('thumbprint', position, scale, clayDark, 20);
  mark.rotation.set(rotation[0],rotation[1],rotation[2]);
  return mark;
}

function striation(points) {
  tube(points, 0.018, clayDark);
}

sphere('leftHaunch',[-0.62,0.72,0.02],[0.72,0.64,0.66],clay);
sphere('rightHaunch',[0.62,0.72,0.02],[0.75,0.66,0.7],clayLight);
sphere('belly',[0,1.48,0],[0.94,1.18,0.62],clay);
sphere('chest',[0,2.05,-0.02],[0.82,0.92,0.58],clay);
sphere('leftFoot',[-0.82,0.25,0.28],[0.58,0.25,0.8],clayDark);
sphere('rightFoot',[0.83,0.25,0.28],[0.6,0.25,0.82],clayDark);

sphere('leftKnee',[-0.88,1.15,0.16],[0.56,0.5,0.58],clay);
sphere('rightKnee',[0.9,1.28,0.18],[0.58,0.55,0.62],clayLight);
cylinderBetween('leftShin',[-0.82,0.75,0.2],[-0.82,0.28,0.28],0.3,clayDark);
cylinderBetween('rightShin',[0.87,0.82,0.22],[0.83,0.29,0.3],0.31,clayDark);

sphere('neck',[0,2.62,0],[0.48,0.42,0.46],clayDark);
sphere('head',[0,3.16,0],[0.86,0.82,0.73],clay);
sphere('crown',[0,3.48,-0.02],[0.72,0.54,0.62],clayLight);
sphere('leftEar',[-0.77,3.22,0.02],[0.31,0.4,0.16],clayDark);
sphere('rightEar',[0.77,3.2,0.02],[0.32,0.4,0.16],clayDark);
sphere('leftEarPad',[-0.78,3.22,0.15],[0.19,0.25,0.08],putty);
sphere('rightEarPad',[0.78,3.2,0.15],[0.19,0.25,0.08],putty);

sphere('facePad',[0,3.13,0.61],[0.58,0.49,0.16],putty);
sphere('muzzle',[0,2.98,0.73],[0.39,0.28,0.13],putty);
sphere('nose',[0,3.16,0.8],[0.16,0.11,0.08],clayDark);
sphere('leftEye',[-0.22,3.32,0.73],[0.07,0.075,0.045],eyeMat,20);
sphere('rightEye',[0.22,3.32,0.73],[0.07,0.075,0.045],eyeMat,20);
sphere('leftEyeGlint',[-0.24,3.35,0.77],[0.014,0.014,0.008],putty,12);
sphere('rightEyeGlint',[0.2,3.35,0.77],[0.014,0.014,0.008],putty,12);
tube([[-0.15,2.93,0.84],[0,2.88,0.86],[0.16,2.93,0.84]],0.025,clayDark);

cylinderBetween('leftUpperArm',[-0.62,2.32,0],[-0.98,1.76,0.06],0.27,clay);
sphere('leftElbow',[-0.98,1.74,0.06],[0.3,0.29,0.3],clay);
cylinderBetween('leftForearm',[-0.98,1.76,0.06],[-0.62,2.58,0.32],0.23,clayLight);
sphere('leftWrist',[-0.62,2.58,0.32],[0.25,0.2,0.23],clay);
sphere('leftHand',[-0.48,2.7,0.46],[0.33,0.22,0.2],clay);
for(let i=0;i<3;i++){
  const x=-0.63+i*0.13;
  cylinderBetween('chinFinger',[x,2.7,0.5],[x+0.02,2.91,0.71],0.055,clayDark,12);
}

cylinderBetween('rightUpperArm',[0.65,2.32,0.02],[1.08,1.72,0.12],0.29,clayLight);
sphere('rightElbow',[1.08,1.7,0.12],[0.32,0.3,0.32],clay);
cylinderBetween('rightForearm',[1.08,1.72,0.12],[0.97,1.18,0.3],0.24,clayLight);
sphere('rightHand',[0.92,1.08,0.34],[0.42,0.25,0.23],clay);
for(let i=0;i<4;i++){
  const z=0.2+i*0.07;
  cylinderBetween('drapedFinger',[0.76,1.08,z],[0.67,0.94,z+0.02],0.045,clayDark,12);
}

tube([[-0.58,2.52,0.49],[-0.38,2.61,0.56],[-0.2,2.61,0.58]],0.035,clayDark);
tube([[0.62,2.5,0.45],[0.72,2.31,0.46],[0.78,2.12,0.42]],0.035,clayDark);

striation([[-0.55,1.8,0.58],[-0.18,1.9,0.62],[0.2,1.82,0.58]]);
striation([[-0.6,1.58,0.59],[-0.15,1.66,0.63],[0.3,1.57,0.59]]);
striation([[0.46,2.13,0.56],[0.68,1.92,0.57],[0.86,1.74,0.52]]);
striation([[-0.76,1.35,0.5],[-0.9,1.2,0.54],[-0.98,1.05,0.5]]);
striation([[0.7,1.45,0.56],[0.91,1.3,0.58],[1.04,1.16,0.55]]);

fingerprint([-0.34,2.0,0.61],[1.2,0.1,-0.2],[0.09,0.025,0.13]);
fingerprint([0.22,2.23,0.59],[1.1,-0.2,0.3],[0.1,0.025,0.15]);
fingerprint([-0.24,1.47,0.62],[1.3,0.1,0.1],[0.08,0.022,0.12]);
fingerprint([0.37,1.72,0.61],[1.15,-0.3,-0.2],[0.1,0.024,0.14]);
fingerprint([0.92,1.58,0.55],[1.15,0.2,0],[0.075,0.022,0.12]);

const floor = new THREE.Mesh(new THREE.CylinderGeometry(4.5,4.5,0.18,64), groundMat);
floor.position.y = -0.1;
floor.receiveShadow = true;
scene.add(floor);

const hemi = new THREE.HemisphereLight(0xffe5ca,0x6d4035,2.1);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffd1a9,4.2);
key.position.set(-4,7,6);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-5;
key.shadow.camera.right=5;
key.shadow.camera.top=7;
key.shadow.camera.bottom=-2;
scene.add(key);
const rim = new THREE.PointLight(0xff9b6a,18,8,2);
rim.position.set(3.5,3.8,-3);
scene.add(rim);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
