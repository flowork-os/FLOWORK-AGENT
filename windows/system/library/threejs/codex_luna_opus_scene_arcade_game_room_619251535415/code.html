<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Arcade Room</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090617;
      font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
      display: block;
    }

    #title {
      position: fixed;
      left: 22px;
      top: 18px;
      z-index: 2;
      color: #7ffcff;
      font-size: 12px;
      letter-spacing: 0.28em;
      text-shadow: 0 0 8px #00eaff, 0 0 22px #008cff;
      pointer-events: none;
      opacity: 0.9;
    }

    #hint {
      position: fixed;
      right: 22px;
      bottom: 18px;
      z-index: 2;
      color: #ff8eea;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-shadow: 0 0 8px #ff1ac8;
      pointer-events: none;
      opacity: 0.72;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="title">NEON // ARCADE // 1994</div>
  <div id="hint">DRAG TO EXPLORE • SCROLL TO ZOOM</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090617);
    scene.fog = new THREE.Fog(0x090617, 18, 46);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(
      48,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(16, 11.5, 18);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.1, -1.2);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.32;
    controls.minDistance = 10;
    controls.maxDistance = 34;
    controls.maxPolarAngle = Math.PI * 0.48;

    let seed = 984321;
    function random() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    }

    function choose(values) {
      return values[Math.floor(random() * values.length)];
    }

    const palette = [
      0x00eaff,
      0xff20c8,
      0xff7a1a,
      0x8c5bff,
      0x64ff7a,
      0xffe45c
    ];

    const darkPlastic = new THREE.MeshStandardMaterial({
      color: 0x111329,
      roughness: 0.42,
      metalness: 0.35
    });

    const blackPlastic = new THREE.MeshStandardMaterial({
      color: 0x050611,
      roughness: 0.3,
      metalness: 0.52
    });

    const wallMaterial = new THREE.MeshStandardMaterial({
      color: 0x121329,
      roughness: 0.92,
      metalness: 0.03
    });

    const ceilingMaterial = new THREE.MeshStandardMaterial({
      color: 0x080914,
      roughness: 1,
      metalness: 0
    });

    const neonMaterials = [];
    const neonLights = [];

    function makeNeonMaterial(color, intensity = 3.2) {
      const material = new THREE.MeshStandardMaterial({
        color,
        emissive: color,
        emissiveIntensity: intensity,
        roughness: 0.28,
        metalness: 0.12
      });
      neonMaterials.push(material);
      return material;
    }

    function addBox(
      parent,
      width,
      height,
      depth,
      x,
      y,
      z,
      material,
      rotationX = 0,
      rotationY = 0,
      rotationZ = 0
    ) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, depth),
        material
      );
      mesh.position.set(x, y, z);
      mesh.rotation.set(rotationX, rotationY, rotationZ);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder(
      parent,
      radiusTop,
      radiusBottom,
      height,
      x,
      y,
      z,
      material,
      radialSegments = 20,
      rotationX = 0,
      rotationY = 0,
      rotationZ = 0
    ) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(
          radiusTop,
          radiusBottom,
          height,
          radialSegments
        ),
        material
      );
      mesh.position.set(x, y, z);
      mesh.rotation.set(rotationX, rotationY, rotationZ);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addSphere(
      parent,
      radius,
      x,
      y,
      z,
      material,
      widthSegments = 20,
      heightSegments = 12
    ) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(radius, widthSegments, heightSegments),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function makeCanvas(width, height, painter) {
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d");
      painter(context, width, height);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return { canvas, context, texture };
    }

    function makeCarpetTexture() {
      return makeCanvas(768, 512, (context, width, height) => {
        context.fillStyle = "#251033";
        context.fillRect(0, 0, width, height);

        const tile = 48;

        for (let y = 0; y < height; y += tile) {
          for (let x = 0; x < width; x += tile) {
            const index = ((x / tile + y / tile) | 0) % palette.length;
            const color = new THREE.Color(palette[index]);
            const hex = `#${color.getHexString()}`;
            context.fillStyle = hex;
            context.globalAlpha = 0.16;
            context.fillRect(x, y, tile, tile);
            context.globalAlpha = 1;

            context.fillStyle = index % 2 ? "#f62bca" : "#00d9ef";
            context.globalAlpha = 0.5;
            context.beginPath();
            context.moveTo(x + tile * 0.5, y + 4);
            context.lineTo(x + tile - 4, y + tile * 0.5);
            context.lineTo(x + tile * 0.5, y + tile - 4);
            context.lineTo(x + 4, y + tile * 0.5);
            context.closePath();
            context.fill();

            context.fillStyle = "#ff9a2e";
            context.globalAlpha = 0.7;
            context.fillRect(x + 18, y + 18, 12, 12);
            context.globalAlpha = 1;
          }
        }

        context.strokeStyle = "rgba(255,255,255,0.12)";
        context.lineWidth = 3;
        for (let x = 0; x < width; x += tile) {
          context.beginPath();
          context.moveTo(x, 0);
          context.lineTo(x, height);
          context.stroke();
        }
        for (let y = 0; y < height; y += tile) {
          context.beginPath();
          context.moveTo(0, y);
          context.lineTo(width, y);
          context.stroke();
        }
      });
    }

    function makeSignTexture(text, foreground, secondary) {
      return makeCanvas(768, 160, (context, width, height) => {
        const gradient = context.createLinearGradient(0, 0, width, height);
        gradient.addColorStop(0, "#090617");
        gradient.addColorStop(0.5, "#251047");
        gradient.addColorStop(1, "#070b23");
        context.fillStyle = gradient;
        context.fillRect(0, 0, width, height);

        context.strokeStyle = foreground;
        context.lineWidth = 8;
        context.strokeRect(10, 10, width - 20, height - 20);

        context.shadowColor = foreground;
        context.shadowBlur = 25;
        context.fillStyle = foreground;
        context.font = "900 68px Arial Black, Arial";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText(text, width / 2, height / 2 + 3);

        context.shadowBlur = 0;
        context.fillStyle = secondary;
        context.font = "bold 16px Arial";
        context.letterSpacing = "8px";
        context.fillText("INSERT COIN  •  PLAY AGAIN", width / 2, 136);
      });
    }

    function makeScreenTexture() {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 144;
      const context = canvas.getContext("2d");
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.NearestFilter;
      return { canvas, context, texture };
    }

    function updateScreen(screen, time) {
      const context = screen.context;
      const width = screen.canvas.width;
      const height = screen.canvas.height;
      const pulse = (Math.sin(time * 4 + screen.phase) + 1) * 0.5;
      const accent = screen.accent;
      const accent2 = screen.secondary;

      context.fillStyle = "#030511";
      context.fillRect(0, 0, width, height);

      const gradient = context.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, "#101348");
      gradient.addColorStop(1, "#16051d");
      context.fillStyle = gradient;
      context.fillRect(0, 0, width, height);

      context.globalAlpha = 0.23;
      context.strokeStyle = accent;
      context.lineWidth = 1;
      for (let x = 0; x < width; x += 16) {
        context.beginPath();
        context.moveTo(x, 0);
        context.lineTo(x, height);
        context.stroke();
      }
      for (let y = 0; y < height; y += 12) {
        context.beginPath();
        context.moveTo(0, y);
        context.lineTo(width, y);
        context.stroke();
      }
      context.globalAlpha = 1;

      const offset = (time * 24 + screen.phase * 18) % 32;

      if (screen.variant % 3 === 0) {
        context.fillStyle = accent;
        context.beginPath();
        context.moveTo(26, 105);
        context.lineTo(76, 34);
        context.lineTo(126, 105);
        context.closePath();
        context.fill();

        context.fillStyle = accent2;
        context.beginPath();
        context.moveTo(92, 105);
        context.lineTo(143, 20);
        context.lineTo(211, 105);
        context.closePath();
        context.fill();

        context.fillStyle = "#08061b";
        context.beginPath();
        context.arc(148 + Math.sin(time * 2) * 24, 64, 15, 0, Math.PI * 2);
        context.fill();

        context.fillStyle = "#ffffff";
        context.globalAlpha = 0.8;
        context.fillRect(18, 16, 54, 4);
        context.fillRect(18, 23, 34, 3);
        context.globalAlpha = 1;
      } else if (screen.variant % 3 === 1) {
        context.strokeStyle = accent;
        context.lineWidth = 5;
        context.beginPath();
        context.arc(128, 73, 48 + pulse * 5, 0, Math.PI * 2);
        context.stroke();

        context.strokeStyle = accent2;
        context.lineWidth = 3;
        context.beginPath();
        context.arc(128, 73, 27, -time, Math.PI * 1.4 - time);
        context.stroke();

        context.fillStyle = "#fff4a8";
        context.beginPath();
        context.arc(
          128 + Math.cos(time * 2) * 44,
          73 + Math.sin(time * 2) * 44,
          6,
          0,
          Math.PI * 2
        );
        context.fill();
      } else {
        context.fillStyle = accent;
        for (let i = 0; i < 11; i += 1) {
          const x = (i * 31 + offset) % 285 - 20;
          const y = 26 + ((i * 17) % 80);
          const size = 8 + ((i * 5) % 13);
          context.fillRect(x, y, size, size);
        }

        context.fillStyle = accent2;
        context.font = "900 28px Arial Black, Arial";
        context.textAlign = "center";
        context.fillText("GO!", 128, 82);
      }

      context.fillStyle = "#fff6d2";
      context.font = "bold 9px monospace";
      context.textAlign = "left";
      context.fillText("HIGH SCORE  009420", 12, 133);

      context.globalAlpha = 0.16;
      context.fillStyle = "#ffffff";
      for (let y = 0; y < height; y += 4) {
        context.fillRect(0, y, width, 1);
      }
      context.globalAlpha = 1;
      screen.texture.needsUpdate = true;
    }

    function addNeonStrip(
      parent,
      width,
      height,
      depth,
      x,
      y,
      z,
      color,
      phase = 0
    ) {
      const material = makeNeonMaterial(color, 4.2);
      const mesh = addBox(parent, width, height, depth, x, y, z, material);
      const light = new THREE.PointLight(color, 2.5, 8, 2);
      light.position.set(x, y, z);
      light.castShadow = false;
      parent.add(light);
      neonLights.push({ mesh, light, phase });
      return mesh;
    }

    const carpetData = makeCarpetTexture();
    carpetData.texture.wrapS = THREE.RepeatWrapping;
    carpetData.texture.wrapT = THREE.RepeatWrapping;
    carpetData.texture.repeat.set(1.45, 1.2);

    const carpetMaterial = new THREE.MeshStandardMaterial({
      map: carpetData.texture,
      color: 0xffffff,
      roughness: 0.93,
      metalness: 0.02
    });

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 22),
      carpetMaterial
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    floor.receiveShadow = true;
    scene.add(floor);

    addBox(scene, 30, 12, 0.4, 0, 6, -11, wallMaterial);
    addBox(scene, 0.4, 12, 22, -15, 6, 0, wallMaterial);
    addBox(scene, 0.4, 12, 22, 15, 6, 0, wallMaterial);
    addBox(scene, 30, 0.35, 22, 0, 12, 0, ceilingMaterial);

    addBox(scene, 30, 0.16, 0.32, 0, 0.13, -10.72, blackPlastic);
    addBox(scene, 0.32, 0.16, 22, -14.72, 0.13, 0, blackPlastic);
    addBox(scene, 0.32, 0.16, 22, 14.72, 0.13, 0, blackPlastic);

    addNeonStrip(scene, 28, 0.11, 0.08, 0, 0.22, -10.68, 0xff1bc8, 0.2);
    addNeonStrip(scene, 0.11, 0.12, 20, -14.68, 0.25, 0, 0x00eaff, 1.3);
    addNeonStrip(scene, 0.11, 0.12, 20, 14.68, 0.25, 0, 0xff7a1a, 2.4);

    for (let index = 0; index < 8; index += 1) {
      const x = -13.2 + index * 3.78;
      const color = palette[index % palette.length];
      addNeonStrip(scene, 0.08, 5.2, 0.1, x, 7.4, -10.69, color, index * 0.45);
    }

    const signData = makeSignTexture("NEON ZONE", "#7ffcff", "#ff5bdc");
    const signMaterial = new THREE.MeshStandardMaterial({
      map: signData.texture,
      emissive: 0x4c0d83,
      emissiveIntensity: 1.8,
      roughness: 0.3,
      metalness: 0.1
    });
    const sign = new THREE.Mesh(
      new THREE.PlaneGeometry(8.8, 1.85),
      signMaterial
    );
    sign.position.set(0, 9.65, -10.7);
    scene.add(sign);

    addBox(scene, 9.4, 0.12, 0.18, 0, 8.68, -10.61, makeNeonMaterial(0xff20c8, 3.5));
    addBox(scene, 9.4, 0.12, 0.18, 0, 10.62, -10.61, makeNeonMaterial(0x00eaff, 3.5));

    function createWallPoster(x, y, color, rotation = 0) {
      const posterData = makeCanvas(220, 300, (context, width, height) => {
        context.fillStyle = "#090717";
        context.fillRect(0, 0, width, height);
        context.strokeStyle = color;
        context.lineWidth = 8;
        context.strokeRect(8, 8, width - 16, height - 16);
        context.fillStyle = color;
        context.globalAlpha = 0.85;
        context.beginPath();
        context.arc(width / 2, 110, 62, 0, Math.PI * 2);
        context.fill();
        context.globalAlpha = 1;
        context.fillStyle = "#0c0820";
        context.beginPath();
        context.arc(width / 2 + 15, 95, 38, 0, Math.PI * 2);
        context.fill();
        context.fillStyle = "#ffffff";
        context.font = "900 28px Arial Black, Arial";
        context.textAlign = "center";
        context.fillText("POWER", width / 2, 198);
        context.font = "900 18px Arial Black, Arial";
        context.fillText("UP!", width / 2, 224);
        context.fillStyle = "#ff9b36";
        context.fillRect(34, 246, width - 68, 8);
      });
      const material = new THREE.MeshStandardMaterial({
        map: posterData.texture,
        emissive: color,
        emissiveIntensity: 0.35,
        roughness: 0.75
      });
      const poster = new THREE.Mesh(
        new THREE.PlaneGeometry(1.55, 2.12),
        material
      );
      poster.position.set(x, y, -10.66);
      poster.rotation.z = rotation;
      scene.add(poster);
    }

    createWallPoster(-11.8, 6.3, 0xff29c8, -0.06);
    createWallPoster(11.8, 6.7, 0x00eaff, 0.06);

    function createArcade(x, z, facing, index) {
      const cabinet = new THREE.Group();
      cabinet.position.set(x, 0, z);
      cabinet.rotation.y = facing;
      scene.add(cabinet);

      const accent = palette[index % palette.length];
      const secondary = palette[(index + 2) % palette.length];

      const bodyMaterial = new THREE.MeshStandardMaterial({
        color: index % 2 ? 0x17102c : 0x101a31,
        roughness: 0.38,
        metalness: 0.48
      });

      const trimMaterial = makeNeonMaterial(accent, 2.8);
      const screenData = makeScreenTexture();
      const screenMaterial = new THREE.MeshStandardMaterial({
        map: screenData.texture,
        emissive: accent,
        emissiveIntensity: 2.9,
        roughness: 0.22,
        metalness: 0.1
      });

      addBox(cabinet, 2.34, 3.95, 1.23, 0, 1.98, 0, bodyMaterial);
      addBox(cabinet, 2.08, 0.12, 1.3, 0, 3.9, 0, trimMaterial);
      addBox(cabinet, 0.11, 3.45, 0.08, -1.1, 2.05, 0.66, trimMaterial);
      addBox(cabinet, 0.11, 3.45, 0.08, 1.1, 2.05, 0.66, trimMaterial);

      addBox(
        cabinet,
        1.92,
        1.28,
        0.1,
        0,
        2.73,
        0.64,
        blackPlastic,
        -0.08
      );

      const screen = new THREE.Mesh(
        new THREE.PlaneGeometry(1.62, 0.88),
        screenMaterial
      );
      screen.position.set(0, 2.73, 0.705);
      screen.rotation.x = -0.08;
      screen.castShadow = false;
      cabinet.add(screen);

      const marqueeData = makeCanvas(320, 72, (context, width, height) => {
        context.fillStyle = "#050511";
        context.fillRect(0, 0, width, height);
        context.fillStyle = `#${new THREE.Color(accent).getHexString()}`;
        context.font = "900 34px Arial Black, Arial";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText(`GAME ${String(index + 1).padStart(2, "0")}`, width / 2, height / 2);
      });

      const marqueeMaterial = new THREE.MeshStandardMaterial({
        map: marqueeData.texture,
        emissive: accent,
        emissiveIntensity: 1.8,
        roughness: 0.3
      });

      const marquee = new THREE.Mesh(
        new THREE.PlaneGeometry(1.88, 0.43),
        marqueeMaterial
      );
      marquee.position.set(0, 3.58, 0.67);
      cabinet.add(marquee);

      addBox(
        cabinet,
        2.08,
        0.25,
        0.82,
        0,
        1.38,
        0.44,
        bodyMaterial,
        -0.2
      );
      addBox(cabinet, 1.9, 0.1, 0.08, 0, 1.48, 0.86, trimMaterial);

      const joystickStemMaterial = new THREE.MeshStandardMaterial({
        color: 0x151722,
        roughness: 0.28,
        metalness: 0.7
      });

      addCylinder(
        cabinet,
        0.045,
        0.045,
        0.34,
        -0.52,
        1.68,
        0.72,
        joystickStemMaterial,
        12
      );
      addSphere(cabinet, 0.12, -0.52, 1.89, 0.72, trimMaterial, 16, 10);

      for (let buttonIndex = 0; buttonIndex < 3; buttonIndex += 1) {
        const buttonColor = palette[(index + buttonIndex + 1) % palette.length];
        const buttonMaterial = makeNeonMaterial(buttonColor, 2.4);
        addCylinder(
          cabinet,
          0.095,
          0.095,
          0.08,
          0.2 + buttonIndex * 0.23,
          1.56,
          0.73,
          buttonMaterial,
          16
        );
      }

      addBox(cabinet, 1.75, 0.08, 0.06, 0, 0.48, 0.65, trimMaterial);

      const pointLight = new THREE.PointLight(accent, 1.35, 5.5, 2);
      pointLight.position.set(0, 2.55, 1.1);
      pointLight.castShadow = false;
      cabinet.add(pointLight);

      const screenNode = {
        context: screenData.context,
        canvas: screenData.canvas,
        texture: screenData.texture,
        phase: index * 0.83,
        variant: index,
        accent: `#${new THREE.Color(accent).getHexString()}`,
        secondary: `#${new THREE.Color(secondary).getHexString()}`
      };

      screenNodes.push(screenNode);
      arcadeLights.push({ pointLight, phase: index * 0.7 });
    }

    const screenNodes = [];
    const arcadeLights = [];

    const leftArcadePositions = [-7.4, -3.4, 0.6, 4.6, 8.6];
    const rightArcadePositions = [-6.1, -2.1, 1.9, 5.9, 9.9];

    leftArcadePositions.forEach((z, index) => {
      createArcade(-11.5, z, Math.PI / 2, index);
    });

    rightArcadePositions.forEach((z, index) => {
      createArcade(11.5, z, -Math.PI / 2, index + 5);
    });

    function createAirHockey() {
      const table = new THREE.Group();
      table.position.set(0, 0, 1.4);
      scene.add(table);

      const surfaceMaterial = new THREE.MeshStandardMaterial({
        color: 0x071c35,
        emissive: 0x003a67,
        emissiveIntensity: 0.75,
        roughness: 0.22,
        metalness: 0.58
      });

      const railMaterial = makeNeonMaterial(0x00eaff, 3.5);
      const warmRailMaterial = makeNeonMaterial(0xff20c8, 3.2);

      addBox(table, 7.4, 1.05, 3.25, 0, 0.72, 0, blackPlastic);
      addBox(table, 6.95, 0.18, 2.78, 0, 1.33, 0, surfaceMaterial);
      addBox(table, 7.18, 0.18, 0.16, 0, 1.47, -1.43, railMaterial);
      addBox(table, 7.18, 0.18, 0.16, 0, 1.47, 1.43, railMaterial);
      addBox(table, 0.16, 0.18, 2.7, -3.53, 1.47, 0, warmRailMaterial);
      addBox(table, 0.16, 0.18, 2.7, 3.53, 1.47, 0, warmRailMaterial);

      addBox(table, 0.045, 0.03, 2.7, 0, 1.49, 0, warmRailMaterial);

      const centerRing = new THREE.Mesh(
        new THREE.TorusGeometry(0.57, 0.035, 10, 36),
        railMaterial
      );
      centerRing.rotation.x = Math.PI / 2;
      centerRing.position.y = 1.5;
      centerRing.castShadow = false;
      table.add(centerRing);

      addBox(table, 0.25, 0.32, 1.0, -3.42, 1.25, 0, blackPlastic);
      addBox(table, 0.25, 0.32, 1.0, 3.42, 1.25, 0, blackPlastic);

      const paddleBlue = makeNeonMaterial(0x00eaff, 4);
      const paddlePink = makeNeonMaterial(0xff20c8, 4);

        color: 0x111111,
        emissive: 0x55204e,
        emissiveIntensity: 0.8,
        roughness: 0.24,
        metalness: 0.8
      });

      const puck = addCylinder(
        table,
        0.15,
        0.15,
        0.11,
        0,
        1.63,
        0,
        puckMaterial,
        24
      );
      const paddleLeft = addCylinder(
        table,
        0.28,
        0.28,
        0.13,
        -2.1,
        1.63,
        0,
        paddleBlue,
        24
      );
      const paddleRight = addCylinder(
        table,
        0.28,
        0.28,
        0.13,
        2.1,

      return { table, puck, paddleLeft, paddleRight };

    const hockey = createAirHockey();

    function createStool(x, z, color) {
      const stool = new THREE.Group();
      stool.position.set(x, 0, z);
      scene.add(stool);

      const seatMaterial = makeNeonMaterial(color, 2.2);
      addCylinder(stool, 0.5, 0.5, 0.22, 0, 1.08, 0, seatMaterial, 24);
      addCylinder(stool, 0.16, 0.2, 1.0, 0, 0.56, 0, blackPlastic, 18);

    }

    createStool(-4.8, 4.0, 0xff20c8);
    createStool(4.8, 4.0, 0x00eaff);
    createStool(-4.8, 7.1, 0xff7a1a);
    createStool(4.8, 7.1, 0x8c5bff);

    function createPlush(parent, x, y, z, scale, color) {
      const plushMaterial = new THREE.MeshStandardMaterial({
        color,
        roughness: 0.72,
        metalness: 0.02
      });

      const plush = new THREE.Group();
      plush.position.set(x, y, z);
      plush.scale.setScalar(scale);
      parent.add(plush);

      addSphere(plush, 0.42, 0, 0.28, 0, plushMaterial, 16, 12);
      addSphere(plush, 0.34, 0, 0.78, 0, plushMaterial, 16, 12);
      addSphere(plush, 0.16, -0.26, 0.98, 0, plushMaterial, 12, 8);
      addSphere(plush, 0.16, 0.26, 0.98, 0, plushMaterial, 12, 8);

      const eyeMaterial = new THREE.MeshStandardMaterial({
        color: 0x05050c,
        roughness: 0.3,
        metalness: 0.2
      });
      addSphere(plush, 0.042, -0.12, 0.82, 0.31, eyeMaterial, 10, 8);
      addSphere(plush, 0.042, 0.12, 0.82, 0.31, eyeMaterial, 10, 8);

      const bellyMaterial = new THREE.MeshStandardMaterial({
        color: 0xffd36b,
        roughness: 0.8
      });
      addSphere(plush, 0.19, 0, 0.3, 0.37, bellyMaterial, 14, 10);
      return plush;
    }

    function createClawMachine() {
      const machine = new THREE.Group();
      machine.position.set(7.9, 0, -7.1);
      scene.add(machine);

      const frameMaterial = new THREE.MeshStandardMaterial({
        color: 0x15152f,
        roughness: 0.28,
        metalness: 0.6
      });
      const cyanTrim = makeNeonMaterial(0x00eaff, 3.8);
      const pinkTrim = makeNeonMaterial(0xff20c8, 3.8);

      addBox(machine, 4.7, 1.0, 3.4, 0, 0.5, 0, frameMaterial);
      addBox(machine, 4.85, 0.2, 3.45, 0, 1.08, 0, pinkTrim);
      addBox(machine, 4.7, 4.95, 0.22, 0, 3.46, -1.56, frameMaterial);
      addBox(machine, 0.28, 4.85, 3.2, -2.22, 3.45, 0, frameMaterial);
      addBox(machine, 0.28, 4.85, 3.2, 2.22, 3.45, 0, frameMaterial);
      addBox(machine, 4.7, 0.28, 3.2, 0, 5.8, 0, frameMaterial);

      addBox(machine, 0.12, 4.7, 0.11, -2.03, 3.45, -1.7, cyanTrim);
      addBox(machine, 0.12, 4.7, 0.11, 2.03, 3.45, -1.7, cyanTrim);
      addBox(machine, 4.1, 0.12, 0.11, 0, 5.48, -1.7, cyanTrim);

      const glassMaterial = new THREE.MeshPhysicalMaterial({
        color: 0x65dcff,
        transparent: true,
        opacity: 0.12,
        roughness: 0.08,
        metalness: 0.05,
        transmission: 0.2
      });

      const frontGlass = addBox(
        machine,
        4.05,
        4.35,
        0.04,
        0,
        3.48,
        1.62,
        glassMaterial
      );
      frontGlass.castShadow = false;

      const sideGlass = addBox(
        machine,
        0.04,
        4.35,
        2.95,
        -2.06,
        3.48,
        0,
        glassMaterial
      );
      sideGlass.castShadow = false;

      addBox(machine, 3.85, 0.08, 2.88, 0, 1.2, 0, blackPlastic);

      const toyColors = [0xff55b9, 0x63e5ff, 0xffb32e, 0xa576ff, 0x75ff86];
      for (let toyIndex = 0; toyIndex < 9; toyIndex += 1) {
        const tx = -1.55 + (toyIndex % 5) * 0.77;
        const tz = -1.05 + Math.floor(toyIndex / 5) * 1.05;
        const ty = 1.36 + (toyIndex % 3) * 0.28;
        createPlush(
          machine,
          tx,
          ty,
          tz,
          0.68 + random() * 0.18,
          toyColors[toyIndex % toyColors.length]
        );
      }

      addBox(machine, 4.05, 0.16, 0.68, 0, 6.1, 0, pinkTrim);
      const clawSign = makeSignTexture("PRIZE!", "#ffea73", "#00eaff");
      const clawSignMaterial = new THREE.MeshStandardMaterial({
        map: clawSign.texture,
        emissive: 0xff248e,
        emissiveIntensity: 2.2,
        roughness: 0.3
      });
      const signMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(3.25, 0.64),
        clawSignMaterial
      );
      signMesh.position.set(0, 6.1, 0.39);
      signMesh.rotation.x = -0.03;
      machine.add(signMesh);

      const rail = addBox(machine, 3.45, 0.14, 0.12, 0, 5.12, 0.05, cyanTrim);
      rail.castShadow = false;

      const carriage = new THREE.Group();
      machine.add(carriage);
      carriage.position.set(0, 0, 0.05);

      addBox(carriage, 0.6, 0.26, 0.46, 0, 4.98, 0, pinkTrim);
      addCylinder(
        carriage,
        0.035,
        0.035,
        1.15,
        0,
        4.38,
        0,
        blackPlastic,
        10
      );

      const hand = new THREE.Group();
      hand.position.set(0, 0, 0);
      carriage.add(hand);

      addCylinder(hand, 0.18, 0.18, 0.12, 0, 3.82, 0, cyanTrim, 18);

      const clawMaterial = makeNeonMaterial(0xffb52f, 2.4);
      addBox(hand, 0.07, 0.55, 0.07, -0.19, 3.58, 0, clawMaterial, 0, 0, -0.38);
      addBox(hand, 0.07, 0.55, 0.07, 0.19, 3.58, 0, clawMaterial, 0, 0, 0.38);
      addBox(hand, 0.07, 0.55, 0.07, 0, 3.53, -0.18, clawMaterial, 0.38, 0, 0);

      addBox(machine, 1.55, 0.5, 0.82, 1.45, 0.94, 0.65, blackPlastic);
      addNeonStrip(machine, 0.95, 0.08, 0.08, 1.45, 1.14, 1.1, 0xff20c8, 1.1);
      addCylinder(machine, 0.1, 0.1, 0.12, 1.46, 1.34, 1.12, cyanTrim, 16, Math.PI / 2);

      return { machine, carriage, hand };
    }

    const claw = createClawMachine();

    function createChangeMachine() {
      const machine = new THREE.Group();
      machine.position.set(-7.7, 0, -7.4);
      machine.rotation.y = 0.08;
      scene.add(machine);

      const bodyMaterial = new THREE.MeshStandardMaterial({
        color: 0x24203a,
        roughness: 0.4,
        metalness: 0.55
      });
      const orangeMaterial = makeNeonMaterial(0xff7a1a, 3.4);
      const cyanMaterial = makeNeonMaterial(0x00eaff, 3.2);

      addBox(machine, 2.5, 4.6, 1.55, 0, 2.35, 0, bodyMaterial);
      addBox(machine, 2.25, 0.18, 1.68, 0, 4.62, 0, orangeMaterial);
      addBox(machine, 2.12, 0.12, 0.09, 0, 0.78, 0.82, cyanMaterial);
      addBox(machine, 0.11, 3.55, 0.08, -1.08, 2.28, 0.83, orangeMaterial);
      addBox(machine, 0.11, 3.55, 0.08, 1.08, 2.28, 0.83, orangeMaterial);

      const displayData = makeCanvas(300, 105, (context, width, height) => {
        context.fillStyle = "#050712";
        context.fillRect(0, 0, width, height);
        context.strokeStyle = "#ff7a1a";
        context.lineWidth = 7;
        context.strokeRect(6, 6, width - 12, height - 12);
        context.fillStyle = "#ffe071";
        context.font = "900 31px Arial Black, Arial";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText("CHANGE", width / 2, 39);
        context.fillStyle = "#00eaff";
        context.font = "900 38px monospace";
        context.fillText("$1  →  4", width / 2, 77);
      });

      const displayMaterial = new THREE.MeshStandardMaterial({
        map: displayData.texture,
        emissive: 0xff5428,
        emissiveIntensity: 1.8,
        roughness: 0.3
      });

      const display = new THREE.Mesh(
        new THREE.PlaneGeometry(1.78, 0.64),
        displayMaterial
      );
      display.position.set(0, 3.75, 0.83);
      machine.add(display);

      addBox(machine, 1.72, 0.92, 0.14, 0, 2.36, 0.83, blackPlastic);
      addCylinder(machine, 0.12, 0.12, 0.1, -0.45, 2.52, 0.93, cyanMaterial, 18);
      addCylinder(machine, 0.12, 0.12, 0.1, 0.45, 2.52, 0.93, orangeMaterial, 18);

      addBox(machine, 0.12, 0.48, 0.12, 0, 1.68, 0.94, orangeMaterial);
      addCylinder(machine, 0.13, 0.13, 0.08, 0, 1.4, 0.96, cyanMaterial, 18);
      addBox(machine, 1.4, 0.08, 0.08, 0, 1.06, 0.83, cyanMaterial);

      const coinLight = new THREE.PointLight(0xff7a1a, 1.5, 4, 2);
      coinLight.position.set(0, 2.8, 1.3);
      machine.add(coinLight);

      return machine;
    }

    createChangeMachine();

    function createDiscoBall() {
      const mount = new THREE.Group();
      mount.position.set(0, 0, -1.9);
      scene.add(mount);

      const chainMaterial = new THREE.MeshStandardMaterial({
        color: 0x777b9b,
        roughness: 0.25,
        metalness: 0.9
      });

      addCylinder(mount, 0.045, 0.045, 1.2, 0, 11.25, 0, chainMaterial, 10);

      const ball = new THREE.Group();
      ball.position.set(0, 10.35, 0);
      mount.add(ball);

      const mirrorMaterial = new THREE.MeshStandardMaterial({
        color: 0xb9d9e7,
        roughness: 0.13,
        metalness: 1,
        emissive: 0x172346,
        emissiveIntensity: 0.25
      });

      const sphere = new THREE.Mesh(
        new THREE.IcosahedronGeometry(1.13, 2),
        mirrorMaterial
      );
      sphere.castShadow = true;
      sphere.receiveShadow = true;
      ball.add(sphere);

      const discoColors = [0x00eaff, 0xff20c8, 0xffa928, 0xffffff];
      for (let panelIndex = 0; panelIndex < 26; panelIndex += 1) {
        const angle = (panelIndex / 26) * Math.PI * 2;
        const panel = new THREE.Mesh(
          new THREE.BoxGeometry(0.22, 0.22, 0.025),
          new THREE.MeshStandardMaterial({
            color: discoColors[panelIndex % discoColors.length],
            emissive: discoColors[panelIndex % discoColors.length],
            emissiveIntensity: 1.7,
            roughness: 0.2,
            metalness: 0.8
          })
        );
        panel.position.set(
          Math.cos(angle) * 0.84,
          Math.sin(angle * 1.7) * 0.48,
          Math.sin(angle) * 0.84
        );
        panel.lookAt(0, 10.35, 0);
        panel.castShadow = false;
        ball.add(panel);
      }

      const discoLight = new THREE.PointLight(0x8b65ff, 3.8, 11, 2);
      discoLight.position.set(0, 8.9, -1.9);
      discoLight.castShadow = true;
      discoLight.shadow.mapSize.set(512, 512);
      scene.add(discoLight);

      return { ball, discoLight };
    }

    const disco = createDiscoBall();

    function createCeilingLamp(x, z, color) {
      const lamp = new THREE.Group();
      lamp.position.set(x, 0, z);
      scene.add(lamp);

      addCylinder(lamp, 0.045, 0.045, 0.85, 0, 11.45, 0, blackPlastic, 10);
      addCylinder(lamp, 0.33, 0.42, 0.24, 0, 10.98, 0, makeNeonMaterial(color, 2.5), 24);

      const light = new THREE.PointLight(color, 1.8, 7, 2);
      light.position.set(0, 10.7, 0);
      light.castShadow = true;
      light.shadow.mapSize.set(256, 256);
      lamp.add(light);
    }

    createCeilingLamp(-8, -1, 0xff20c8);
    createCeilingLamp(8, 0, 0x00eaff);
    createCeilingLamp(0, 6.2, 0xff7a1a);

    function createBackConsole(x, z, color) {
      const console = new THREE.Group();
      console.position.set(x, 0, z);
      scene.add(console);

      const body = new THREE.MeshStandardMaterial({
        color: 0x17152a,
        roughness: 0.4,
        metalness: 0.52
      });
      const trim = makeNeonMaterial(color, 2.7);

      addBox(console, 3.3, 1.75, 0.78, 0, 0.95, 0, body);
      addBox(console, 3.05, 0.1, 0.08, 0, 1.7, 0.43, trim);
      addBox(console, 0.08, 1.4, 0.08, -1.48, 1.0, 0.43, trim);
      addBox(console, 0.08, 1.4, 0.08, 1.48, 1.0, 0.43, trim);

      for (let index = 0; index < 4; index += 1) {
        addCylinder(
          console,
          0.12,
          0.12,
          0.09,
          -0.8 + index * 0.53,
          1.13,
          0.47,
          makeNeonMaterial(palette[(index + 3) % palette.length], 2.2),
          16
        );
      }
    }

    createBackConsole(-4.3, -9.7, 0xff7a1a);
    createBackConsole(4.3, -9.7, 0x8c5bff);

    function createFloorToken(x, z, color) {
      const tokenMaterial = makeNeonMaterial(color, 2.8);
      const token = addCylinder(
        scene,
        0.24,
        0.24,
        0.05,
        x,
        0.08,
        z,
        tokenMaterial,
        24
      );
      token.rotation.x = 0.02;
    }

    createFloorToken(-1.5, -0.8, 0xff20c8);
    createFloorToken(2.0, -2.5, 0x00eaff);
    createFloorToken(5.1, 2.9, 0xff7a1a);
    createFloorToken(-6.2, 2.4, 0x8c5bff);

    const hemiLight = new THREE.HemisphereLight(0x5269b8, 0x140817, 1.45);
    scene.add(hemiLight);

    const moonLight = new THREE.DirectionalLight(0x7596ff, 1.5);
    moonLight.position.set(-8, 15, 11);
    moonLight.target.position.set(0, 0, -3);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.set(2048, 2048);
    moonLight.shadow.camera.left = -22;
    moonLight.shadow.camera.right = 22;
    moonLight.shadow.camera.top = 20;
    moonLight.shadow.camera.bottom = -12;
    moonLight.shadow.camera.near = 1;
    moonLight.shadow.camera.far = 42;
    scene.add(moonLight);
    scene.add(moonLight.target);

    const cyanFill = new THREE.PointLight(0x00dfff, 2.6, 15, 2);
    cyanFill.position.set(-9, 5, 5);
    scene.add(cyanFill);

    const magentaFill = new THREE.PointLight(0xff159f, 2.8, 14, 2);
    magentaFill.position.set(8, 5, -5);
    scene.add(magentaFill);

    const orangeFill = new THREE.PointLight(0xff651f, 2.4, 12, 2);
    orangeFill.position.set(0, 3, -9);
    scene.add(orangeFill);

    const clock = new THREE.Clock();

    function animate() {
      const time = clock.getElapsedTime();

      for (const screen of screenNodes) {
        updateScreen(screen, time);
      }

      for (const arcadeLight of arcadeLights) {
        const pulse = (Math.sin(time * 3.2 + arcadeLight.phase) + 1) * 0.5;
        arcadeLight.pointLight.intensity = 0.9 + pulse * 1.15;
      }

      for (const neon of neonLights) {
        const pulse = (Math.sin(time * 2.2 + neon.phase) + 1) * 0.5;
        neon.light.intensity = 1.25 + pulse * 2.3;
        neon.mesh.material.emissiveIntensity = 2.7 + pulse * 2.2;
      }

      hockey.puck.position.x = Math.sin(time * 1.7) * 2.45;
      hockey.puck.position.z = Math.sin(time * 2.35) * 0.88;
      hockey.puck.rotation.y = time * 4.2;
      hockey.paddleLeft.position.z = Math.sin(time * 1.45) * 0.78;
      hockey.paddleRight.position.z = Math.sin(time * 1.25 + 1.8) * 0.78;
      hockey.paddleLeft.position.x = -2.05 + Math.sin(time * 1.1) * 0.22;
      hockey.paddleRight.position.x = 2.05 + Math.sin(time * 1.3 + 0.8) * 0.22;

      claw.carriage.position.x = Math.sin(time * 0.72) * 1.45;
      claw.hand.position.y = Math.sin(time * 1.8) * 0.2;
      claw.hand.rotation.y = Math.sin(time * 1.3) * 0.12;

      disco.ball.rotation.y = time * 0.55;
      disco.ball.rotation.x = Math.sin(time * 0.45) * 0.18;
      disco.discoLight.position.x = Math.sin(time * 0.7) * 4.5;
      disco.discoLight.position.z = -1.9 + Math.cos(time * 0.6) * 3.5;
      disco.discoLight.intensity = 2.5 + Math.sin(time * 2.1) * 0.9;

      sign.material.emissiveIntensity = 1.5 + Math.sin(time * 2.7) * 0.35;
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop(animate);
  </script>
</body>
</html>
