let seed = 731927;
function random() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a, b) {
  return a + (b - a) * random();
}

function canvasTexture(size, painter, repeatX = 1, repeatY = 1) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  painter(ctx, size);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(repeatX, repeatY);
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const timberTexture = canvasTexture(256, (c, s) => {
  c.fillStyle = '#70401f';
  c.fillRect(0, 0, s, s);
  for (let y = 0; y < s; y += 4) {
    const v = Math.floor(range(38, 75));
    c.strokeStyle = `rgba(${v + 55},${v + 16},${v},.28)`;
    c.lineWidth = range(1, 3);
    c.beginPath();
    c.moveTo(0, y + range(-2, 2));
    for (let x = 0; x <= s; x += 24) {
      c.lineTo(x, y + Math.sin(x * .04 + y) * range(1, 4));
    }
    c.stroke();
  }
  for (let i = 0; i < 10; i++) {
    const x = range(10, s - 10);
    const y = range(10, s - 10);
    c.strokeStyle = 'rgba(40,18,7,.42)';
    c.beginPath();
    c.ellipse(x, y, range(4, 10), range(2, 5), 0, 0, Math.PI * 2);
    c.stroke();
  }
}, 3, 1);

const plankTexture = canvasTexture(512, (c, s) => {
  c.fillStyle = '#49301f';
  c.fillRect(0, 0, s, s);
  for (let x = 0; x < s; x += 64) {
    c.fillStyle = x % 128 ? '#503520' : '#442b1b';
    c.fillRect(x + 2, 0, 60, s);
    c.strokeStyle = '#25170f';
    c.lineWidth = 3;
    c.beginPath();
    c.moveTo(x, 0);
    c.lineTo(x, s);
    c.stroke();
    for (let i = 0; i < 12; i++) {
      c.strokeStyle = 'rgba(170,106,57,.16)';
      c.lineWidth = 1;
      const ox = x + range(7, 57);
      c.beginPath();
      c.moveTo(ox, 0);
      c.bezierCurveTo(ox + range(-8, 8), 170, ox + range(-8, 8), 340, ox, s);
      c.stroke();
    }
  }
}, 3, 3);

const knitTexture = canvasTexture(256, (c, s) => {
  c.fillStyle = '#7b2730';
  c.fillRect(0, 0, s, s);
  c.strokeStyle = '#bb6a64';
  c.lineWidth = 3;
  for (let y = -16; y < s + 16; y += 16) {
    for (let x = 0; x < s; x += 16) {
      c.beginPath();
      c.moveTo(x, y);
      c.lineTo(x + 8, y + 8);
      c.lineTo(x, y + 16);
      c.stroke();
    }
  }
  c.strokeStyle = 'rgba(48,10,18,.45)';
  c.lineWidth = 2;
  for (let x = 8; x < s; x += 16) {
    c.beginPath();
    c.moveTo(x, 0);
    c.lineTo(x, s);
    c.stroke();
  }
}, 2, 3);

const frostTexture = canvasTexture(512, (c, s) => {
  const g = c.createLinearGradient(0, 0, 0, s);
  g.addColorStop(0, '#647b91');
  g.addColorStop(.55, '#263b51');
  g.addColorStop(1, '#101d2c');
  c.fillStyle = g;
  c.fillRect(0, 0, s, s);
  for (let i = 0; i < 150; i++) {
    c.fillStyle = `rgba(220,239,246,${range(.08, .35)})`;
    c.beginPath();
    c.arc(range(0, s), range(0, s), range(.5, 3), 0, Math.PI * 2);
    c.fill();
  }
  c.strokeStyle = 'rgba(225,242,245,.32)';
  c.lineWidth = 5;
  for (let i = 0; i < 20; i++) {
    const x = range(0, s);
    const y = range(0, s);
    c.beginPath();
    c.moveTo(x, y);
    for (let j = 0; j < 4; j++) {
      c.lineTo(x + range(-35, 35), y + j * range(8, 20));
    }
    c.stroke();
  }
  const edge = c.createRadialGradient(s / 2, s / 2, s * .15, s / 2, s / 2, s * .7);
  edge.addColorStop(0, 'rgba(255,255,255,0)');
  edge.addColorStop(1, 'rgba(235,249,255,.72)');
  c.fillStyle = edge;
  c.fillRect(0, 0, s, s);
});

function mesh(geometry, material, position, rotation, cast = true, receive = true) {
  const object = new THREE.Mesh(geometry, material);
  if (position) object.position.set(...position);
  if (rotation) object.rotation.set(...rotation);
  object.castShadow = cast;
  object.receiveShadow = receive;
  scene.add(object);
  return object;
}

function box(size, material, position, rotation) {
  return mesh(new THREE.BoxGeometry(...size), material, position, rotation);
}

function createLog(length, radius, position, rotation) {
  const geometry = new THREE.CylinderGeometry(radius, radius * 1.04, length, 14, 1);
  geometry.rotateZ(Math.PI / 2);
  const log = mesh(geometry, woodMat, position, rotation);
  const endMat = new THREE.MeshStandardMaterial({
    color: 0x6a381e,
    roughness: .94
  });
  const ends = new THREE.Group();
  for (const side of [-1, 1]) {
    const disk = new THREE.Mesh(
      new THREE.CircleGeometry(radius * .985, 14),
      endMat
    );
    disk.position.x = side * length * .501;
    disk.rotation.y = side > 0 ? Math.PI / 2 : -Math.PI / 2;
    ends.add(disk);
  }
  log.add(ends);
  return log;
}

function makeBookshelf() {
  const group = new THREE.Group();
  group.position.set(5.55, 0, -4.65);
  scene.add(group);
  const shelfMat = new THREE.MeshStandardMaterial({
    color: 0x3a1f12,
    roughness: .8

    const side = new THREE.Mesh(new THREE.BoxGeometry(.22, 4.7, .76), shelfMat);
    side.position.set(x, 2.35, 0);
    side.castShadow = true;
    group.add(side);
  }
  for (const y of [.12, 1.25, 2.38, 3.51, 4.68]) {
    const shelf = new THREE.Mesh(new THREE.BoxGeometry(2.72, .2, .88), shelfMat);
    shelf.position.set(0, y, .02);
    shelf.castShadow = true;
    shelf.receiveShadow = true;
    group.add(shelf);
  }
  const bookColors = [0x742f28, 0x334e43, 0x8b6a31, 0x243a52, 0x68415d, 0x5b3425];
  for (let level = 0; level < 4; level++) {
    let x = -1.05;
    while (x < .95) {
      const w = range(.15, .3);
      const h = range(.64, .96);
      const book = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, .57),
        new THREE.MeshStandardMaterial({
          color: bookColors[Math.floor(random() * bookColors.length)],
          roughness: .76
        })
      );
      book.position.set(x + w / 2, .24 + level * 1.13 + h / 2, .09);
      book.rotation.z = random() < .18 ? range(-.12, .12) : 0;
      book.castShadow = true;
      group.add(book);
      x += w + .045;
    }
  }
}

function roundedBoxGeometry(w, h, d, r) {
  const shape = new THREE.Shape();
  shape.moveTo(-w / 2 + r, -h / 2);
  shape.lineTo(w / 2 - r, -h / 2);
  shape.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
  shape.lineTo(w / 2, h / 2 - r);
  shape.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
  shape.lineTo(-w / 2 + r, h / 2);
  shape.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
  shape.lineTo(-w / 2, -h / 2 + r);
  shape.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: d,
    bevelEnabled: true,
    bevelSize: r * .32,
    bevelThickness: r * .3,
    bevelSegments: 3,
    curveSegments: 5
  });
  geometry.center();
  return geometry;
}

const dustCount = 90;
const dustPositions = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i++) {
  dustPositions[i * 3] = range(-6.3, 6.3);
  dustPositions[i * 3 + 1] = range(.4, 6.2);
  dustPositions[i * 3 + 2] = range(-5.3, 5.2);
}
const dustGeometry = new THREE.BufferGeometry();
dustGeometry.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
const dust = new THREE.Points(
  dustGeometry,
  new THREE.PointsMaterial({
    color: 0xffd7a0,
    size: .025,
    transparent: true,
    opacity: .26,
    depthWrite: false
  })
);
scene.add(dust);

const clockTime = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clockTime.getElapsedTime();

  for (const flame of flames) {
    const phase = flame.userData.phase;
    const pulse = 1 + Math.sin(t * 8.5 + phase) * .12 + Math.sin(t * 15 + phase) * .05;
    flame.scale.x = flame.userData.base.x * (1 + Math.sin(t * 10 + phase) * .09);
    flame.scale.y = flame.userData.base.y * pulse;
    flame.position.x += Math.sin(t * 7 + phase) * .0012;
    flame.rotation.z = Math.sin(t * 5 + phase) * .08;
    flame.material.opacity = .7 + Math.sin(t * 9 + phase) * .1;
  }

  fireLight.intensity = 12.5 + Math.sin(t * 9) * 1.8 + Math.sin(t * 16.3) * .8;
  fireLight.position.x = -2.25 + Math.sin(t * 7.5) * .08;
  fireLight.position.y = 1.62 + Math.sin(t * 11) * .05;

  const emberArray = embers.geometry.attributes.position.array;
  for (let i = 0; i < emberCount; i++) {
    emberArray[i * 3 + 1] += emberMeta[i].speed * .012;
    emberArray[i * 3] += Math.sin(t * 3 + i) * .0015 + emberMeta[i].drift * .001;
    if (emberArray[i * 3 + 1] > 1.55) {
      emberArray[i * 3] = range(-.55, .55);
      emberArray[i * 3 + 1] = .08;
    }
  }
  embers.geometry.attributes.position.needsUpdate = true;

  for (const steam of steamWisps) {
    const p = steam.userData.phase;
    steam.position.x = Math.sin(t * 1.15 + p) * .06;
    steam.rotation.y = Math.sin(t * .8 + p) * .32;
    steam.scale.y = .9 + .12 * Math.sin(t * 1.6 + p);
    steam.material.opacity = .18 + .1 * (Math.sin(t * 1.25 + p) * .5 + .5);
  }

  lampLight.intensity = 5.3 + Math.sin(t * 6.8) * .28 + Math.sin(t * 12.1) * .12;
  lampFlame.scale.y = .18 + Math.sin(t * 8.2) * .025;
  lampFlame.position.x = Math.sin(t * 6) * .012;

  const snowArray = snow.geometry.attributes.position.array;
  for (let i = 0; i < snowCount; i++) {
    snowArray[i * 3 + 1] -= snowSpeeds[i] * .012;
    snowArray[i * 3] += Math.sin(t * .8 + i * .73) * .0018;
    if (snowArray[i * 3 + 1] < 2.38) {
      snowArray[i * 3 + 1] = 5.42;
      snowArray[i * 3] = range(2.9, 5.9);
    }
  }
  snow.geometry.attributes.position.needsUpdate = true;

  dust.rotation.y = t * .012;
  dust.position.y = Math.sin(t * .22) * .05;

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

animate();
