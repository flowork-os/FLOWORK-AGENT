<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stone Chapel Apse</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #c7d2d4;
    }
    canvas {
      display: block;
    }
    .label {
      position: fixed;
      left: 18px;
      bottom: 16px;
      color: rgba(34, 39, 39, 0.72);
      font: 11px/1.5 Georgia, serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Chapel Apse · Masonry Study</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xc8d2d3);
    scene.fog = new THREE.FogExp2(0xc8d2d3, 0.018);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(12.5, 8.2, -14.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.7, -2.3);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.42;
    controls.minDistance = 8;
    controls.maxDistance = 30;
    controls.maxPolarAngle = Math.PI * 0.49;

    const stone = new THREE.MeshStandardMaterial({
      color: 0xb8ad96,
      roughness: 0.94,
      metalness: 0
    });
    const paleStone = new THREE.MeshStandardMaterial({
      color: 0xc9bea7,
      roughness: 0.9
    });
    const darkStone = new THREE.MeshStandardMaterial({
      color: 0x8f8674,
      roughness: 0.98
    });
    const jointStone = new THREE.MeshStandardMaterial({
      color: 0x817a6c,
      roughness: 1
    });
    const slate = new THREE.MeshStandardMaterial({
      color: 0x3c4545,
      roughness: 0.82,
      metalness: 0.08,
      side: THREE.DoubleSide
    });
    const slateEdge = new THREE.MeshStandardMaterial({
      color: 0x252d2e,
      roughness: 0.72
    });
    const glass = new THREE.MeshPhysicalMaterial({
      color: 0x294f56,
      roughness: 0.24,
      metalness: 0.05,
      transmission: 0.2,
      transparent: true,
      opacity: 0.86,
      side: THREE.DoubleSide
    });
    const lead = new THREE.MeshStandardMaterial({
      color: 0x252a29,
      roughness: 0.66,
      metalness: 0.38
    });
    const earth = new THREE.MeshStandardMaterial({
      color: 0x717560,
      roughness: 1
    });
    const pathMaterial = new THREE.MeshStandardMaterial({
      color: 0x9c927c,
      roughness: 1
    });

    const apse = new THREE.Group();
    scene.add(apse);

    const innerRadius = 4.58;
    const outerRadius = 5.0;
    const wallTop = 7.15;

    function annularSector(r0, r1, y0, y1, a0, a1, segments = 12) {
      const positions = [];
      const indices = [];
      const addVertex = (r, y, a) => {
        positions.push(r * Math.cos(a), y, -r * Math.sin(a));
        return positions.length / 3 - 1;
      };

      for (let i = 0; i <= segments; i++) {
        const a = THREE.MathUtils.lerp(a0, a1, i / segments);
        addVertex(r1, y0, a);
        addVertex(r1, y1, a);
        addVertex(r0, y0, a);
        addVertex(r0, y1, a);
      }

      for (let i = 0; i < segments; i++) {
        const b = i * 4;
        const n = b + 4;
        indices.push(b, n, b + 1, n, n + 1, b + 1);
        indices.push(b + 2, b + 3, n + 2, n + 2, b + 3, n + 3);
        indices.push(b + 1, n + 1, b + 3, n + 1, n + 3, b + 3);
        indices.push(b, b + 2, n, n, b + 2, n + 2);
      }

      const last = segments * 4;
      indices.push(0, 1, 2, 2, 1, 3);
      indices.push(last, last + 2, last + 1, last + 2, last + 3, last + 1);

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    function addSector(r0, r1, y0, y1, a0, a1, material, segments) {
      const mesh = new THREE.Mesh(
        annularSector(r0, r1, y0, y1, a0, a1, segments),
        material
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      apse.add(mesh);
      return mesh;
    }

    addSector(innerRadius, outerRadius, 0.15, 1.42, 0, Math.PI, stone, 54);
    addSector(innerRadius, outerRadius, 5.72, wallTop, 0, Math.PI, stone, 54);

    const windowCenters = [22, 56, 90, 124, 158].map(THREE.MathUtils.degToRad);
    const openingHalf = THREE.MathUtils.degToRad(8.6);
    let cursor = 0;

    for (const center of windowCenters) {
      const start = center - openingHalf;
      if (start > cursor) {
        addSector(innerRadius, outerRadius, 1.42, 5.72, cursor, start, stone, 7);
      }
      cursor = center + openingHalf;
    }
    if (cursor < Math.PI) {
      addSector(innerRadius, outerRadius, 1.42, 5.72, cursor, Math.PI, stone, 7);
    }

    for (const y of [0.92, 6.16, 6.72]) {
      addSector(outerRadius, outerRadius + 0.035, y, y + 0.035, 0, Math.PI, jointStone, 54);
    }

    addSector(outerRadius, outerRadius + 0.12, 1.32, 1.48, 0, Math.PI, paleStone, 54);
    addSector(outerRadius, outerRadius + 0.13, 5.69, 5.84, 0, Math.PI, paleStone, 54);
    addSector(outerRadius, outerRadius + 0.2, 7.02, 7.22, 0, Math.PI, darkStone, 54);

    function archedShape(width, bottom, spring, rise) {
      const shape = new THREE.Shape();
      shape.moveTo(-width / 2, bottom);
      shape.lineTo(width / 2, bottom);
      shape.lineTo(width / 2, spring);
      shape.quadraticCurveTo(width / 2, spring + rise * 0.72, 0, spring + rise);
      shape.quadraticCurveTo(-width / 2, spring + rise * 0.72, -width / 2, spring);
      shape.closePath();
      return shape;
    }

    function archedFrameShape(outerWidth, innerWidth, bottom, outerSpring, outerRise) {
      const frame = archedShape(outerWidth, bottom, outerSpring, outerRise);
      const innerBottom = bottom + 0.18;
      const innerSpring = outerSpring - 0.02;
      const innerRise = innerWidth * 0.52;
      const hole = new THREE.Path();
      hole.moveTo(-innerWidth / 2, innerBottom);
      hole.lineTo(-innerWidth / 2, innerSpring);
      hole.quadraticCurveTo(-innerWidth / 2, innerSpring + innerRise * 0.72, 0, innerSpring + innerRise);
      hole.quadraticCurveTo(innerWidth / 2, innerSpring + innerRise * 0.72, innerWidth / 2, innerSpring);
      hole.lineTo(innerWidth / 2, innerBottom);
      hole.closePath();
      frame.holes.push(hole);
      return frame;
    }

    function createWindow(angle) {
      const group = new THREE.Group();
      const outerWidth = 1.67;
      const innerWidth = 1.27;
      const bottom = 1.36;
      const spring = 4.86;
      const rise = 0.86;

      const glassShape = archedShape(innerWidth, bottom + 0.18, spring - 0.02, innerWidth * 0.52);
      const glassGeometry = new THREE.ShapeGeometry(glassShape, 20);
      const glassMesh = new THREE.Mesh(glassGeometry, glass);
      glassMesh.position.z = 0.018;
      glassMesh.receiveShadow = true;
      group.add(glassMesh);

      const frameShape = archedFrameShape(outerWidth, innerWidth, bottom, spring, rise);
      const frameGeometry = new THREE.ExtrudeGeometry(frameShape, {
        depth: 0.18,
        bevelEnabled: true,
        bevelSize: 0.025,
        bevelThickness: 0.025,
        bevelSegments: 2,
        curveSegments: 20
      });
      frameGeometry.translate(0, 0, -0.045);
      const frameMesh = new THREE.Mesh(frameGeometry, paleStone);
      frameMesh.castShadow = true;
      frameMesh.receiveShadow = true;
      group.add(frameMesh);

      const sill = new THREE.Mesh(new THREE.BoxGeometry(1.88, 0.2, 0.35), paleStone);
      sill.position.set(0, bottom + 0.04, 0.1);
      sill.castShadow = true;
      sill.receiveShadow = true;
      group.add(sill);

      const mullion = new THREE.Mesh(new THREE.BoxGeometry(0.055, 3.52, 0.075), lead);
      mullion.position.set(0, 3.12, 0.225);
      group.add(mullion);

      for (const y of [2.32, 3.18, 4.03]) {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(1.27, 0.045, 0.075), lead);
        bar.position.set(0, y, 0.225);
        group.add(bar);
      }

      const archBars = [];
      for (const side of [-1, 1]) {
        const curve = new THREE.QuadraticBezierCurve3(
          new THREE.Vector3(0, spring + innerWidth * 0.52, 0.225),
          new THREE.Vector3(side * innerWidth * 0.26, spring + innerWidth * 0.28, 0.225),
          new THREE.Vector3(side * innerWidth * 0.5, spring, 0.225)
        );
        const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 10, 0.024, 5, false), lead);
        archBars.push(tube);
        group.add(tube);
      }

      const stoneCount = 11;
      for (let i = 0; i < stoneCount; i++) {
        const t = i / (stoneCount - 1);
        const phi = Math.PI * t;
        const x = 0.82 * Math.cos(phi);
        const y = spring + 0.85 * Math.sin(phi);
        const dx = -0.82 * Math.sin(phi);
        const dy = 0.85 * Math.cos(phi);
        const block = new THREE.Mesh(
          new THREE.BoxGeometry(0.31, 0.2, 0.27),
          i % 3 === 0 ? stone : paleStone
        );
        block.position.set(x, y, 0.16);
        block.rotation.z = Math.atan2(dy, dx);
        block.castShadow = true;
        block.receiveShadow = true;
        group.add(block);
      }

      group.position.set(
        (outerRadius + 0.04) * Math.cos(angle),
        0,
        -(outerRadius + 0.04) * Math.sin(angle)
      );
      group.rotation.y = angle + Math.PI / 2;
      apse.add(group);
    }

    windowCenters.forEach(createWindow);

    function addButtress(angle, endButtress = false) {
      const group = new THREE.Group();
      const stages = [
        { y: 1.2, h: 2.4, w: endButtress ? 0.85 : 0.72, d: 1.05 },
        { y: 3.3, h: 1.8, w: endButtress ? 0.75 : 0.64, d: 0.82 },
        { y: 4.9, h: 1.4, w: endButtress ? 0.64 : 0.54, d: 0.6 }
      ];

      for (const stage of stages) {
        const block = new THREE.Mesh(
          new THREE.BoxGeometry(stage.w, stage.h, stage.d),
          stone
        );
        block.position.set(0, stage.y, stage.d / 2 - 0.04);
        block.castShadow = true;
        block.receiveShadow = true;
        group.add(block);

        const cap = new THREE.Mesh(
          new THREE.BoxGeometry(stage.w + 0.1, 0.13, stage.d + 0.1),
          paleStone
        );
        cap.position.set(0, stage.y + stage.h / 2, stage.d / 2 - 0.04);
        cap.castShadow = true;
        cap.receiveShadow = true;
        group.add(cap);
      }

      const foot = new THREE.Mesh(
        new THREE.BoxGeometry(endButtress ? 1.05 : 0.92, 0.3, 1.28),
        darkStone
      );
      foot.position.set(0, 0.3, 0.5);
      foot.castShadow = true;
      foot.receiveShadow = true;
      group.add(foot);

      group.position.set(
        outerRadius * Math.cos(angle),
        0,
        -outerRadius * Math.sin(angle)
      );
      group.rotation.y = angle + Math.PI / 2;
      apse.add(group);
    }

    [5, 39, 73, 107, 141, 175].forEach((degrees, index) => {
      addButtress(THREE.MathUtils.degToRad(degrees), index === 0 || index === 5);
    });

    const roofRadius = 5.58;
    const roofEave = 7.18;
    const roofApex = 10.05;
    const radialRings = 10;
    const angularSegments = 56;
    const roofPositions = [];

    function roofPoint(r, angle) {
      const y = roofApex + (roofEave - roofApex) * (r / roofRadius);
      return new THREE.Vector3(r * Math.cos(angle), y, -r * Math.sin(angle));
    }

    for (let a = 0; a < angularSegments; a++) {
      const a0 = Math.PI * a / angularSegments;
      const a1 = Math.PI * (a + 1) / angularSegments;
      const apexPoint = new THREE.Vector3(0, roofApex, 0);
      const first0 = roofPoint(roofRadius / radialRings, a0);
      const first1 = roofPoint(roofRadius / radialRings, a1);
      roofPositions.push(
        apexPoint.x, apexPoint.y, apexPoint.z,
        first0.x, first0.y, first0.z,
        first1.x, first1.y, first1.z
      );

      for (let r = 1; r < radialRings; r++) {
        const r0 = roofRadius * r / radialRings;
        const r1 = roofRadius * (r + 1) / radialRings;
        const p00 = roofPoint(r0, a0);
        const p01 = roofPoint(r0, a1);
        const p10 = roofPoint(r1, a0);
        const p11 = roofPoint(r1, a1);
        roofPositions.push(
          p00.x, p00.y, p00.z,
          p10.x, p10.y, p10.z,
          p11.x, p11.y, p11.z,
          p00.x, p00.y, p00.z,
          p11.x, p11.y, p11.z,
          p01.x, p01.y, p01.z
        );
      }
    }

    const roofGeometry = new THREE.BufferGeometry();
    roofGeometry.setAttribute('position', new THREE.Float32BufferAttribute(roofPositions, 3));
    roofGeometry.computeVertexNormals();
    const roof = new THREE.Mesh(roofGeometry, slate);
    roof.castShadow = true;
    roof.receiveShadow = true;
    apse.add(roof);

    for (let i = 0; i <= 14; i++) {
      const angle = Math.PI * i / 14;
      const start = roofPoint(0.17, angle);
      const end = roofPoint(roofRadius, angle);
      const curve = new THREE.LineCurve3(start, end);
      const rib = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 14, 0.027, 5, false),
        slateEdge
      );
      rib.castShadow = true;
      apse.add(rib);
    }

    for (const fraction of [0.25, 0.48, 0.71, 0.91]) {
      const radius = roofRadius * fraction;
      const points = [];
      for (let i = 0; i <= 48; i++) {
        points.push(roofPoint(radius, Math.PI * i / 48));
      }
      const curve = new THREE.CatmullRomCurve3(points);
      const course = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 48, 0.018, 5, false),
        slateEdge
      );
      apse.add(course);
    }

    const eavePoints = [];
    for (let i = 0; i <= 64; i++) {
      eavePoints.push(new THREE.Vector3(
        roofRadius * Math.cos(Math.PI * i / 64),
        roofEave,
        -roofRadius * Math.sin(Math.PI * i / 64)
      ));
    }
    const eaveCurve = new THREE.CatmullRomCurve3(eavePoints);
    const eave = new THREE.Mesh(
      new THREE.TubeGeometry(eaveCurve, 64, 0.09, 7, false),
      slateEdge
    );
    eave.castShadow = true;
    apse.add(eave);

    const returnWallGeometry = new THREE.BoxGeometry(0.42, wallTop, 3.2);
    for (const x of [-4.79, 4.79]) {
      const returnWall = new THREE.Mesh(returnWallGeometry, stone);
      returnWall.position.set(x, wallTop / 2, 1.55);
      returnWall.castShadow = true;
      returnWall.receiveShadow = true;
      apse.add(returnWall);

      for (const y of [1.0, 2.05, 3.1, 4.15, 5.2, 6.25]) {
        const joint = new THREE.Mesh(
          new THREE.BoxGeometry(0.44, 0.025, 3.22),
          jointStone
        );
        joint.position.set(x, y, 1.55);
        apse.add(joint);
      }
    }

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(28, 96),
      earth
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.025;
    ground.receiveShadow = true;
    scene.add(ground);

    const pathShape = new THREE.Shape();
    pathShape.moveTo(-3.4, 0);
    pathShape.lineTo(3.4, 0);
    pathShape.lineTo(2.2, 12);
    pathShape.lineTo(-2.2, 12);
    pathShape.closePath();
    const path = new THREE.Mesh(new THREE.ShapeGeometry(pathShape), pathMaterial);
    path.rotation.x = -Math.PI / 2;
    path.position.set(0, 0.005, -5.15);
    path.receiveShadow = true;
    scene.add(path);

    const scatteredStones = new THREE.Group();
    const stoneGeometry = new THREE.DodecahedronGeometry(0.08, 0);
    for (let i = 0; i < 70; i++) {
      const angle = i * 2.39996;
      const radius = 6.3 + (i % 11) * 0.48;
      const pebble = new THREE.Mesh(
        stoneGeometry,
        i % 4 === 0 ? darkStone : paleStone
      );
      pebble.position.set(
        Math.cos(angle) * radius,
        0.035,
        -3.2 + Math.sin(angle) * radius * 0.62
      );
      pebble.scale.setScalar(0.45 + (i % 5) * 0.12);
      pebble.rotation.set(angle, angle * 0.37, angle * 0.19);
      pebble.castShadow = true;
      pebble.receiveShadow = true;
      scatteredStones.add(pebble);
    }
    scene.add(scatteredStones);

    const hemisphere = new THREE.HemisphereLight(0xdde8eb, 0x625c4c, 1.7);
    scene.add(hemisphere);

    const sun = new THREE.DirectionalLight(0xffefd2, 4.2);
    sun.position.set(-9, 14, -10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -14;
    sun.shadow.camera.right = 14;
    sun.shadow.camera.top = 16;
    sun.shadow.camera.bottom = -8;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 40;
    sun.shadow.bias = -0.00035;
    sun.shadow.normalBias = 0.025;
    scene.add(sun);

    const windowGlow = new THREE.PointLight(0x6c9ca0, 6, 9, 2);
    windowGlow.position.set(0, 3.8, -3.7);
    scene.add(windowGlow);

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
