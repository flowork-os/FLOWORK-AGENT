<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Retro Tin Toy Handheld</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d7b783}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8b986);
scene.fog = new THREE.Fog(0xd8b986, 15, 30);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);
camera.position.set(6.8,5.1,9.2);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 6;
controls.maxDistance = 15;
controls.target.set(0,0.1,0);

scene.add(new THREE.HemisphereLight(0xffe6bb,0x4e5650,2.1));
const keyLight = new THREE.DirectionalLight(0xffe4b5,4.1);
keyLight.position.set(-5,9,8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048,2048);
keyLight.shadow.camera.left=-8;
keyLight.shadow.camera.right=8;
keyLight.shadow.camera.top=8;
keyLight.shadow.camera.bottom=-8;
scene.add(keyLight);
const fill = new THREE.DirectionalLight(0x7bb4ad,1.5);
fill.position.set(7,3,2);
scene.add(fill);

const teal = new THREE.MeshStandardMaterial({color:0x176f70,roughness:.7,metalness:.28});
const tealDark = new THREE.MeshStandardMaterial({color:0x0c474d,roughness:.76,metalness:.24});
const orange = new THREE.MeshStandardMaterial({color:0xd85b2e,roughness:.68,metalness:.2});
const cream = new THREE.MeshStandardMaterial({color:0xf1c985,roughness:.72,metalness:.18});
const gold = new THREE.MeshStandardMaterial({color:0xb77b39,roughness:.55,metalness:.6});
const black = new THREE.MeshStandardMaterial({color:0x111b1d,roughness:.48,metalness:.15});
const screenBlue = new THREE.MeshStandardMaterial({color:0x173d49,roughness:.55,metalness:.25});
const mint = new THREE.MeshStandardMaterial({color:0x72b9a1,roughness:.7,metalness:.1});

function roundedBox(w,h,d,mat,r=.12,bevel=.08){
  const s = new THREE.Shape();
  const x=-w/2,y=-h/2;
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y);
  const g = new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelSegments:3,bevelSize:bevel,bevelThickness:bevel/1.4,curveSegments:8});
  g.translate(0,0,-d/2);
  const m = new THREE.Mesh(g,mat);
  m.castShadow=true;m.receiveShadow=true;
  return m;
}
function cylinder(r,h,mat,segments=32){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,segments),mat);
  m.castShadow=true;m.receiveShadow=true;return m;
}
function disc(r,d,mat){
  const m=cylinder(r,d,mat,32);
  m.rotation.x=Math.PI/2;
  return m;
}
function box(w,h,d,mat){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.castShadow=true;m.receiveShadow=true;return m;
}

const consoleGroup = new THREE.Group();
consoleGroup.rotation.y=-0.11;
scene.add(consoleGroup);

const body=roundedBox(5.15,6.2,1.25,teal,.34,.14);
body.position.y=.25;
consoleGroup.add(body);

const face=roundedBox(4.72,5.76,.16,cream,.26,.045);
face.position.set(0,.25,.69);
consoleGroup.add(face);

const topStripe=roundedBox(4.7,.48,.07,orange,.08,.02);
topStripe.position.set(0,2.76,.79);
consoleGroup.add(topStripe);
const bottomStripe=roundedBox(4.7,.26,.07,orange,.06,.02);
bottomStripe.position.set(0,-2.35,.79);
consoleGroup.add(bottomStripe);

const screenFrame=roundedBox(3.72,2.28,.18,orange,.2,.045);
screenFrame.position.set(-.28,1.28,.83);
consoleGroup.add(screenFrame);
const screen=roundedBox(3.34,1.9,.09,screenBlue,.15,.02);
screen.position.set(-.28,1.28,.95);
consoleGroup.add(screen);

function screenPixel(x,y,w,h,mat=mint){
  const p=box(w,h,.035,mat);
  p.position.set(x,y,1.02);consoleGroup.add(p);
}
screenPixel(-1.17,1.67,.23,.19);
screenPixel(-.88,1.67,.23,.19);
screenPixel(-.59,1.67,.23,.19);
screenPixel(-.30,1.67,.23,.19);
screenPixel(-.01,1.67,.23,.19);
screenPixel(.28,1.67,.23,.19);
screenPixel(.57,1.67,.23,.19);
screenPixel(-.88,1.37,.23,.19);
screenPixel(-.59,1.37,.23,.19);
screenPixel(-.30,1.37,.23,.19);
screenPixel(-.01,1.37,.23,.19);
screenPixel(.28,1.37,.23,.19);
screenPixel(.57,1.37,.23,.19);
screenPixel(-.88,1.07,.23,.19);
screenPixel(-.59,1.07,.23,.19);
screenPixel(-.30,1.07,.23,.19);
screenPixel(.28,1.07,.23,.19);
screenPixel(.57,1.07,.23,.19);
screenPixel(-1.17,.77,.23,.19);
screenPixel(-.88,.77,.23,.19);
screenPixel(.57,.77,.23,.19);

const screenGlint=box(1.8,.055,.025,new THREE.MeshStandardMaterial({color:0xa3d7ba,transparent:true,opacity:.5}));
screenGlint.position.set(-.55,2.02,1.07);
screenGlint.rotation.z=-.16;
consoleGroup.add(screenGlint);

const dpadGroup=new THREE.Group();
dpadGroup.position.set(-1.35,-.72,1.01);
const dpadMat=new THREE.MeshStandardMaterial({color:0x154f57,roughness:.65,metalness:.35});
const dpV=roundedBox(.6,1.78,.28,dpadMat,.12,.06);
const dpH=roundedBox(1.78,.6,.28,dpadMat,.12,.06);
dpadGroup.add(dpV,dpH);
const dpadCap=disc(.24,.05,orange,32);
dpadCap.position.z=.18;
dpadGroup.add(dpadCap);
consoleGroup.add(dpadGroup);

function button(x,y,r,mat){
  const b=disc(r,.28,mat);
  b.position.set(x,y,1.07);
  consoleGroup.add(b);
  const ring=disc(r+.1,.045,gold);
  ring.position.set(x,y,1.02);
  consoleGroup.add(ring);
}
button(1.05,-.38,.44,orange);
button(1.88,-1.05,.44,orange);
button(.37,-1.42,.25,tealDark);

const speakerPanel=roundedBox(1.23,.48,.06,tealDark,.13,.02);
speakerPanel.position.set(1.15,-2.05,.85);
consoleGroup.add(speakerPanel);
for(let i=0;i<5;i++){
  const slot=box(.12,.28,.035,orange);
  slot.position.set(.72+i*.21,-2.05,.9);
  consoleGroup.add(slot);
}

function label(text,x,y,size,color){
  const c=document.createElement("canvas");
  c.width=256;c.height=64;
  const ctx=c.getContext("2d");
  ctx.clearRect(0,0,256,64);
  ctx.fillStyle=color;ctx.font="bold 25px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(text,128,32);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  const m=new THREE.MeshBasicMaterial({map:t,transparent:true});
  const q=new THREE.Mesh(new THREE.PlaneGeometry(size,size*.25),m);
  q.position.set(x,y,1.04);
  consoleGroup.add(q);
}
label("TIN-PIX",0,2.55,.9,"#174c52");
label("START",1.12,-1.85,.7,"#f1c985");
label("A",1.05,-.38,.34,"#f1c985");
label("B",1.88,-1.05,.34,"#f1c985");

function rivet(x,y,z){
  const r=disc(.105,.095,gold,20);
  r.position.set(x,y,z);
  consoleGroup.add(r);
  const shine=disc(.035,.02,cream,16);
  shine.position.set(x-.025,y+.035,z+.06);
  consoleGroup.add(shine);
}
[[-2.1,2.72],[2.1,2.72],[-2.1,-2.2],[2.1,-2.2]].forEach(p=>rivet(p[0],p[1],.84));

const sideRivet=disc(.11,.08,gold,20);
sideRivet.rotation.y=Math.PI/2;
sideRivet.position.set(2.62,.55,.18);
consoleGroup.add(sideRivet);

const keyGroup=new THREE.Group();
keyGroup.position.set(2.75,.15,-.3);
keyGroup.rotation.z=-.18;
const axle=cylinder(.23,.28,gold,24);
axle.rotation.z=Math.PI/2;
keyGroup.add(axle);
const stem=box(.18,1.3,.18,gold);
stem.position.set(.48,0,0);
stem.rotation.z=-.18;
keyGroup.add(stem);
const keyTop=roundedBox(.72,.42,.15,gold,.16,.045);
keyTop.position.set(.7,.58,0);
keyGroup.add(keyTop);
const keyBottom=roundedBox(.72,.42,.15,gold,.16,.045);
keyBottom.position.set(.25,-.59,0);
keyGroup.add(keyBottom);
const hub=cylinder(.32,.12,orange,28);
hub.rotation.z=Math.PI/2;hub.position.x=.16;
keyGroup.add(hub);
consoleGroup.add(keyGroup);

const backPanel=roundedBox(3.6,3.5,.08,tealDark,.22,.03);
backPanel.position.set(0,.25,-.69);
consoleGroup.add(backPanel);

const ground=new THREE.Mesh(new THREE.CircleGeometry(16,64),new THREE.MeshStandardMaterial({color:0xc69b69,roughness:1}));
ground.rotation.x=-Math.PI/2;
ground.position.y=-3.25;
ground.receiveShadow=true;
scene.add(ground);

const shadowDisc=new THREE.Mesh(new THREE.CircleGeometry(3.8,64),new THREE.MeshBasicMaterial({color:0x77553c,transparent:true,opacity:.2}));
shadowDisc.rotation.x=-Math.PI/2;
shadowDisc.scale.set(1.15,.58,1);
shadowDisc.position.set(0,-3.21,.1);
scene.add(shadowDisc);

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
