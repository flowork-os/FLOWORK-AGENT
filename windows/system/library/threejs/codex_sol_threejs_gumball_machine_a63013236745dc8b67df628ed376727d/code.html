<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Gumball Machine</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f3cf82;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3cf82);
scene.fog = new THREE.Fog(0xf3cf82, 13, 24);

const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(7.2, 5.3, 9.2);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.25, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 7;
controls.maxDistance = 16;
controls.minPolarAngle = 0.55;
controls.maxPolarAngle = 1.48;

const machine = new THREE.Group();
machine.rotation.y = -0.12;
scene.add(machine);

const red = new THREE.MeshPhysicalMaterial({
  color: 0xc7192e,
  roughness: 0.22,
  metalness: 0.45,
  clearcoat: 1,
  clearcoatRoughness: 0.16
});

const darkRed = new THREE.MeshPhysicalMaterial({
  color: 0x7d0b1b,
  roughness: 0.3,
  metalness: 0.55,
  clearcoat: 0.7
});

const chrome = new THREE.MeshPhysicalMaterial({
  color: 0xe8edf1,
  roughness: 0.12,
  metalness: 1,
  clearcoat: 0.8
});

const darkChrome = new THREE.MeshStandardMaterial({
  color: 0x4b5259,
  roughness: 0.2,
  metalness: 0.95
});

const blackMetal = new THREE.MeshStandardMaterial({
  color: 0x161617,
  roughness: 0.3,
  metalness: 0.75
});

const rubber = new THREE.MeshStandardMaterial({
  color: 0x251b1c,
  roughness: 0.75,
  metalness: 0.05
});

function mesh(geometry, material, position, rotation = null) {
  const object = new THREE.Mesh(geometry, material);
  object.position.copy(position);
  if (rotation) object.rotation.set(rotation.x, rotation.y, rotation.z);
  object.castShadow = true;
  object.receiveShadow = true;
  machine.add(object);
  return object;
}

function lathe(points, material, y, segments = 64) {
  const object = mesh(new THREE.LatheGeometry(points, segments), material, new THREE.Vector3(0, y, 0));
  return object;
}

const footProfile = [
  new THREE.Vector2(0.82, 0.00),
  new THREE.Vector2(0.95, 0.08),
  new THREE.Vector2(1.02, 0.20),
  new THREE.Vector2(0.99, 0.34),
  new THREE.Vector2(0.77, 0.42),
  new THREE.Vector2(0.69, 0.50)
];
lathe(footProfile, red, 0.12);
mesh(new THREE.CylinderGeometry(0.86, 0.86, 0.08, 64), darkRed, new THREE.Vector3(0, 0.12, 0));
mesh(new THREE.TorusGeometry(0.92, 0.055, 16, 64), chrome, new THREE.Vector3(0, 0.31, 0), new THREE.Euler(Math.PI / 2, 0, 0));

const stemProfile = [
  new THREE.Vector2(0.48, 0.00),
  new THREE.Vector2(0.55, 0.10),
  new THREE.Vector2(0.53, 0.75),
  new THREE.Vector2(0.61, 0.90),
  new THREE.Vector2(0.69, 0.98)
];
lathe(stemProfile, red, 0.54);
mesh(new THREE.TorusGeometry(0.55, 0.045, 12, 48), chrome, new THREE.Vector3(0, 0.68, 0), new THREE.Euler(Math.PI / 2, 0, 0));

const bodyProfile = [
  new THREE.Vector2(0.67, 0.00),
  new THREE.Vector2(0.83, 0.08),
  new THREE.Vector2(0.94, 0.25),
  new THREE.Vector2(0.96, 0.78),
  new THREE.Vector2(0.87, 1.00),
  new THREE.Vector2(0.71, 1.10)
];
lathe(bodyProfile, red, 1.48);
mesh(new THREE.TorusGeometry(0.82, 0.065, 18, 64), chrome, new THREE.Vector3(0, 2.5, 0), new THREE.Euler(Math.PI / 2, 0, 0));

const globeCenter = new THREE.Vector3(0, 3.92, 0);
const globeRadius = 1.56;

mesh(
  new THREE.CylinderGeometry(1.02, 0.76, 0.48, 64),
  red,
  new THREE.Vector3(0, 2.72, 0)
);
mesh(
  new THREE.TorusGeometry(1.015, 0.075, 18, 64),
  chrome,
  new THREE.Vector3(0, 2.94, 0),
  new THREE.Euler(Math.PI / 2, 0, 0)
);

let seed = 148921;
function random() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}

const candyColors = [
  0xf42c38, 0xffc928, 0x1eb95e, 0x168ae6,
  0xf05ab3, 0xff7628, 0x8d49d8, 0xf4f2e8
];

const gumballGeometry = new THREE.SphereGeometry(0.205, 22, 16);
const gumballMaterial = new THREE.MeshPhysicalMaterial({
  roughness: 0.19,
  metalness: 0,
  clearcoat: 1,
  clearcoatRoughness: 0.1,
  vertexColors: true
});

const candidatePositions = [];
const ballRadius = 0.205;
const minSpacing = 0.34;
let attempts = 0;

while (candidatePositions.length < 104 && attempts < 20000) {
  attempts++;
  const x = (random() * 2 - 1) * 1.28;
  const z = (random() * 2 - 1) * 1.28;
  const localY = -1.25 + random() * 2.18;
  const radial = Math.sqrt(x * x + z * z + localY * localY);
  if (radial > globeRadius - ballRadius - 0.06) continue;
  if (localY < -1.18 + 0.18 * (x * x + z * z)) continue;

  let valid = true;
  for (const p of candidatePositions) {
    const dx = x - p.x;
    const dy = localY - p.y;
    const dz = z - p.z;
    if (dx * dx + dy * dy + dz * dz < minSpacing * minSpacing) {
      valid = false;
      break;
    }
  }
  if (valid) candidatePositions.push(new THREE.Vector3(x, localY, z));
}

const gumballs = new THREE.InstancedMesh(gumballGeometry, gumballMaterial, candidatePositions.length);
gumballs.castShadow = true;
gumballs.receiveShadow = true;
gumballs.position.copy(globeCenter);
const dummy = new THREE.Object3D();
const candyColor = new THREE.Color();

for (let i = 0; i < candidatePositions.length; i++) {
  dummy.position.copy(candidatePositions[i]);
  const scale = 0.9 + random() * 0.16;
  dummy.scale.setScalar(scale);
  dummy.rotation.set(random() * Math.PI, random() * Math.PI, random() * Math.PI);
  dummy.updateMatrix();
  gumballs.setMatrixAt(i, dummy.matrix);
  candyColor.setHex(candyColors[Math.floor(random() * candyColors.length)]);
  gumballs.setColorAt(i, candyColor);
}
machine.add(gumballs);

const glassBack = new THREE.Mesh(
  new THREE.SphereGeometry(globeRadius, 64, 40),
  new THREE.MeshPhysicalMaterial({
    color: 0xdcefff,
    transparent: true,
    opacity: 0.13,
    roughness: 0.04,
    metalness: 0,
    transmission: 0.18,
    thickness: 0.08,
    side: THREE.BackSide,
    depthWrite: false
  })
);
glassBack.position.copy(globeCenter);
glassBack.renderOrder = 1;
machine.add(glassBack);

const glassFront = new THREE.Mesh(
  new THREE.SphereGeometry(globeRadius, 64, 40),
  new THREE.MeshPhysicalMaterial({
    color: 0xeaf8ff,
    transparent: true,
    opacity: 0.18,
    roughness: 0.035,
    metalness: 0,
    transmission: 0.35,
    thickness: 0.1,
    clearcoat: 1,
    clearcoatRoughness: 0.02,
    side: THREE.FrontSide,
    depthWrite: false
  })
);
glassFront.position.copy(globeCenter);
glassFront.renderOrder = 3;
machine.add(glassFront);

const highlightMaterial = new THREE.MeshBasicMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.48,
  depthWrite: false
});

const highlightCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.92, 4.88, 1.05),
  new THREE.Vector3(-1.21, 4.48, 0.86),
  new THREE.Vector3(-1.31, 3.96, 0.72),
  new THREE.Vector3(-1.18, 3.53, 0.86)
]);
const highlight = new THREE.Mesh(
  new THREE.TubeGeometry(highlightCurve, 32, 0.035, 8, false),
  highlightMaterial
);
highlight.renderOrder = 4;
machine.add(highlight);

const lidProfile = [
  new THREE.Vector2(0.76, 0.00),
  new THREE.Vector2(0.92, 0.06),
  new THREE.Vector2(0.99, 0.17),
  new THREE.Vector2(0.91, 0.27),
  new THREE.Vector2(0.69, 0.34),
  new THREE.Vector2(0.55, 0.38)
];
lathe(lidProfile, chrome, 5.32);
mesh(new THREE.TorusGeometry(0.88, 0.06, 16, 64), darkChrome, new THREE.Vector3(0, 5.41, 0), new THREE.Euler(Math.PI / 2, 0, 0));
mesh(new THREE.CylinderGeometry(0.25, 0.34, 0.22, 48), chrome, new THREE.Vector3(0, 5.79, 0));
mesh(new THREE.SphereGeometry(0.16, 32, 20), chrome, new THREE.Vector3(0, 5.96, 0));

function roundedRectShape(width, height, radius) {
  const x = -width / 2;
  const y = -height / 2;
  const shape = new THREE.Shape();
  shape.moveTo(x + radius, y);
  shape.lineTo(x + width - radius, y);
  shape.quadraticCurveTo(x + width, y, x + width, y + radius);
  shape.lineTo(x + width, y + height - radius);
  shape.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  shape.lineTo(x + radius, y + height);
  shape.quadraticCurveTo(x, y + height, x, y + height - radius);
  shape.lineTo(x, y + radius);
  shape.quadraticCurveTo(x, y, x + radius, y);
  return shape;
}

function frontPlate(shape, depth, material, x, y, z, bevel = 0.04) {
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: true,
    bevelSegments: 3,
    steps: 1,
    bevelSize: bevel,
    bevelThickness: bevel
  });
  geometry.center();
  const object = mesh(geometry, material, new THREE.Vector3(x, y, z));
  return object;
}

frontPlate(roundedRectShape(0.74, 0.96, 0.14), 0.09, chrome, 0, 2.18, 0.89, 0.045);
frontPlate(roundedRectShape(0.53, 0.76, 0.1), 0.035, darkChrome, 0, 2.18, 0.96, 0.025);

frontPlate(roundedRectShape(0.1, 0.31, 0.045), 0.025, rubber, 0, 2.39, 1.01, 0.015);

const knobHub = mesh(
  new THREE.CylinderGeometry(0.22, 0.22, 0.17, 40),
  chrome,
  new THREE.Vector3(0, 2.08, 1.04),
  new THREE.Euler(Math.PI / 2, 0, 0)
);
const knobGrip = mesh(
  new THREE.BoxGeometry(0.57, 0.14, 0.14),
  chrome,
  new THREE.Vector3(0, 2.08, 1.17)
);
knobGrip.geometry.translate(0, 0, 0);
mesh(new THREE.SphereGeometry(0.105, 24, 16), chrome, new THREE.Vector3(-0.285, 2.08, 1.17));
mesh(new THREE.SphereGeometry(0.105, 24, 16), chrome, new THREE.Vector3(0.285, 2.08, 1.17));

frontPlate(roundedRectShape(0.84, 0.56, 0.12), 0.08, chrome, 0, 1.34, 0.67, 0.04);
frontPlate(roundedRectShape(0.62, 0.35, 0.08), 0.03, blackMetal, 0, 1.34, 0.74, 0.02);

const door = frontPlate(roundedRectShape(0.52, 0.29, 0.06), 0.04, darkChrome, 0, 1.32, 0.78, 0.02);
door.rotation.x = -0.1;
mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.42, 20), chrome, new THREE.Vector3(0, 1.5, 0.81), new THREE.Euler(0, 0, Math.PI / 2));

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(11, 96),
  new THREE.MeshStandardMaterial({
    color: 0xf7dfaa,
    roughness: 0.82,
    metalness: 0
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0.105;
floor.receiveShadow = true;
scene.add(floor);

const ring = new THREE.Mesh(
  new THREE.RingGeometry(2.1, 3.15, 80),
  new THREE.MeshBasicMaterial({
    color: 0xd7a555,
    transparent: true,
    opacity: 0.18,
    side: THREE.DoubleSide
  })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.11;
scene.add(ring);

const hemisphere = new THREE.HemisphereLight(0xfff1d2, 0x6f4160, 2.5);
scene.add(hemisphere);

const keyLight = new THREE.DirectionalLight(0xfff3dc, 5);
keyLight.position.set(5, 9, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 22;
keyLight.shadow.bias = -0.00025;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x82cfff, 2.1);
fillLight.position.set(-6, 5, 3);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xff5879, 16, 12, 2);
rimLight.position.set(3.5, 4.8, -4);
scene.add(rimLight);

const topLight = new THREE.PointLight(0xffffff, 9, 9, 2);
topLight.position.set(-2, 8, 2);
scene.add(topLight);

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}
window.addEventListener('resize', resize);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  rimLight.intensity = 15.5 + Math.sin(time * 0.8) * 0.5;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
