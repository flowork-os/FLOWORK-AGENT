<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon OPEN Sign</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #02030a; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);
scene.fog = new THREE.Fog(0x02030a, 15, 28);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0.4, 13.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 8;
controls.maxDistance = 19;
controls.target.set(0, 0, 0);

scene.add(new THREE.HemisphereLight(0x26366a, 0x05040b, 0.65));

const wallMaterial = new THREE.MeshStandardMaterial({
  color: 0x080b16,
  roughness: 0.86,
  metalness: 0.08
});
const wall = new THREE.Mesh(new THREE.PlaneGeometry(40, 24), wallMaterial);
wall.position.z = -0.42;
wall.receiveShadow = true;
scene.add(wall);

const panelMaterial = new THREE.MeshStandardMaterial({
  color: 0x101421,
  roughness: 0.57,
  metalness: 0.58
});
const panel = new THREE.Mesh(new THREE.BoxGeometry(10.7, 5.25, 0.38), panelMaterial);
panel.position.z = 0;
panel.castShadow = true;
panel.receiveShadow = true;
scene.add(panel);

const frameMaterial = new THREE.MeshStandardMaterial({
  color: 0x252c3a,
  roughness: 0.32,
  metalness: 0.88
});
function addBox(width, height, depth, x, y, z, material, bevelScale = 1) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

addBox(10.95, 0.12, 0.22, 0, 2.59, 0.25, frameMaterial);
addBox(10.95, 0.12, 0.22, 0, -2.59, 0.25, frameMaterial);
addBox(0.12, 5.15, 0.22, -5.41, 0, 0.25, frameMaterial);
addBox(0.12, 5.15, 0.22, 5.41, 0, 0.25, frameMaterial);

const innerFrameMaterial = new THREE.MeshStandardMaterial({
  color: 0x151b2c,
  emissive: 0x10142d,
  emissiveIntensity: 0.8,
  roughness: 0.4,
  metalness: 0.7
});
addBox(9.95, 0.035, 0.05, 0, 2.22, 0.46, innerFrameMaterial);
addBox(9.95, 0.035, 0.05, 0, -2.22, 0.46, innerFrameMaterial);
addBox(0.035, 4.45, 0.05, -4.98, 0, 0.46, innerFrameMaterial);
addBox(0.035, 4.45, 0.05, 4.98, 0, 0.46, innerFrameMaterial);

const reflectionPink = new THREE.MeshBasicMaterial({
  color: 0xff187e,
  transparent: true,
  opacity: 0.055,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const reflectionCyan = new THREE.MeshBasicMaterial({
  color: 0x00eaff,
  transparent: true,
  opacity: 0.05,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const reflectionOne = new THREE.Mesh(new THREE.PlaneGeometry(3.5, 1.1), reflectionPink);
reflectionOne.position.set(-2.1, 0.18, 0.205);
reflectionOne.rotation.z = -0.08;
scene.add(reflectionOne);
const reflectionTwo = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 1.15), reflectionCyan);
reflectionTwo.position.set(2.15, 0.08, 0.205);
reflectionTwo.rotation.z = 0.07;
scene.add(reflectionTwo);

const pink = 0xff168c;
const cyan = 0x00eaff;
const outerPinkMaterial = new THREE.MeshBasicMaterial({
  color: pink,
  transparent: true,
  opacity: 0.22,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const outerCyanMaterial = new THREE.MeshBasicMaterial({
  color: cyan,
  transparent: true,
  opacity: 0.2,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const corePinkMaterial = new THREE.MeshStandardMaterial({
  color: 0xffd9ef,
  emissive: pink,
  emissiveIntensity: 5.8,
  roughness: 0.18,
  metalness: 0.05
});
const coreCyanMaterial = new THREE.MeshStandardMaterial({
  color: 0xd9ffff,
  emissive: cyan,
  emissiveIntensity: 5.8,
  roughness: 0.18,
  metalness: 0.05
});

function cylinderBetween(start, end, radius, material) {
  const a = new THREE.Vector3(start[0], start[1], start[2]);
  const b = new THREE.Vector3(end[0], end[1], end[2]);
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, 12, 1), material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  scene.add(mesh);
  return mesh;
}

function glowingPolyline(points, color) {
  const outerMaterial = color === pink ? outerPinkMaterial : outerCyanMaterial;
  const coreMaterial = color === pink ? corePinkMaterial : coreCyanMaterial;
  const raisedPoints = points.map(point => [point[0], point[1], 0.52]);
  for (let i = 0; i < raisedPoints.length - 1; i++) {
    cylinderBetween(raisedPoints[i], raisedPoints[i + 1], 0.16, outerMaterial);
    cylinderBetween(raisedPoints[i], raisedPoints[i + 1], 0.073, coreMaterial);
  }
  const jointGeometry = new THREE.SphereGeometry(0.078, 16, 10);
  const haloGeometry = new THREE.SphereGeometry(0.17, 16, 10);
  for (const point of raisedPoints) {
    const halo = new THREE.Mesh(haloGeometry, outerMaterial);
    halo.position.set(point[0], point[1], point[2]);
    halo.renderOrder = 1;
    scene.add(halo);
    const joint = new THREE.Mesh(jointGeometry, coreMaterial);
    joint.position.set(point[0], point[1], point[2]);
    joint.castShadow = true;
    scene.add(joint);
  }
}

function shifted(points, xOffset) {
  return points.map(point => [point[0] + xOffset, point[1]]);
}

const oPoints = [];
for (let i = 0; i <= 16; i++) {
  const angle = Math.PI * 2 * i / 16;
  oPoints.push([0.68 * Math.cos(angle), 1.28 * Math.sin(angle)]);
}
const pPoints = [
  [-0.66, -1.28], [-0.66, 1.28], [0.25, 1.28],
  [0.66, 1.08], [0.66, 0.56], [0.25, 0.34], [-0.66, 0.34]
];
const ePoints = [
  [0.62, 1.28], [-0.64, 1.28], [-0.64, -1.28],
  [0.62, -1.28], [-0.64, -1.28], [-0.64, 0.02], [0.48, 0.02]
];
const nPoints = [
  [-0.68, -1.28], [-0.68, 1.28], [0.68, -1.28], [0.68, 1.28]
];

glowingPolyline(shifted(oPoints, -3.55), pink);
glowingPolyline(shifted(pPoints, -1.65), cyan);
glowingPolyline(shifted(ePoints, 0.28), pink);
glowingPolyline(shifted(nPoints, 2.25), cyan);

const pinkLight = new THREE.PointLight(pink, 3.5, 5.2, 2);
pinkLight.position.set(-2.45, 0.45, 1.2);
pinkLight.castShadow = true;
scene.add(pinkLight);

const cyanLight = new THREE.PointLight(cyan, 3.3, 5.2, 2);
cyanLight.position.set(2.65, 0.35, 1.2);
cyanLight.castShadow = true;
scene.add(cyanLight);

const topLight = new THREE.PointLight(0x6c48ff, 1.8, 8, 2);
topLight.position.set(0, 3.6, 2.2);
scene.add(topLight);

const bracketMaterial = new THREE.MeshStandardMaterial({
  color: 0x343b4b,
  roughness: 0.26,
  metalness: 0.92
});
function addBracket(x, y) {
  addBox(0.55, 0.2, 0.32, x, y, -0.02, bracketMaterial);
  addBox(0.18, 0.62, 0.25, x, y - (y > 0 ? -0.23 : 0.23), -0.18, bracketMaterial);
  const boltMaterial = new THREE.MeshStandardMaterial({
    color: 0x8792a4,
    roughness: 0.2,
    metalness: 0.95
  });
  const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.035, 16), boltMaterial);
  bolt.rotation.x = Math.PI / 2;
  bolt.position.set(x, y, 0.16);
  scene.add(bolt);
}
addBracket(-4.35, 2.82);
addBracket(4.35, 2.82);
addBracket(-4.35, -2.82);
addBracket(4.35, -2.82);

const lowerGlow = new THREE.PointLight(0xff176d, 0.75, 10, 2);
lowerGlow.position.set(0, -2.8, 1.8);
scene.add(lowerGlow);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
