<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taco Truck Corner</title>
<style>
html,body{margin:0;overflow:hidden;background:#f58b68}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xf6a07d, 28, 75);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,150);
camera.position.set(14,9.2,17);
camera.lookAt(0,3,0);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .055;
controls.autoRotate = true;
controls.autoRotateSpeed = .45;
controls.target.set(0,2.7,0);
controls.minDistance = 10;
controls.maxDistance = 34;
controls.maxPolarAngle = Math.PI*.48;

const clock = new THREE.Clock();
let seed = 48271;
function rand(){
  seed = (seed*1664525+1013904223)>>>0;
  return seed/4294967296;
}
function mat(color,rough=.7,metal=0){
  return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
}
function box(w,h,d,material,x=0,y=0,z=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  m.position.set(x,y,z);
  m.castShadow = true;m.receiveShadow = true;
  scene.add(m); return m;
}
function cyl(r,h,material,x=0,y=0,z=0,rx=0,ry=0,rz=0,segments=24){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,segments),material);
  m.position.set(x,y,z);m.rotation.set(rx,ry,rz);
  m.castShadow = true;m.receiveShadow = true;
  scene.add(m);return m;
}
function sphere(r,material,x=0,y=0,z=0){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r,20,14),material);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;
  scene.add(m);return m;
}
function tube(points,radius,material){
  const curve = new THREE.CatmullRomCurve3(points);
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve,Math.max(8,points.length*5),radius,8,false),material);
  m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function textTexture(lines,bg='#1e282d',ink='#fff2bc',accent='#f6a233'){
  const c=document.createElement('canvas');c.width=640;c.height=420;
  const x=c.getContext('2d');
  x.fillStyle=bg;x.fillRect(0,0,c.width,c.height);
  x.strokeStyle=accent;x.lineWidth=12;x.strokeRect(14,14,c.width-28,c.height-28);
  x.fillStyle=ink;x.textAlign='center';x.font='bold 42px sans-serif';
  x.fillText(lines[0],320,75);
  x.font='bold 27px sans-serif';
  lines.slice(1).forEach((t,i)=>x.fillText(t,320,128+i*43));
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function quadTexture(){
  const c=document.createElement('canvas');c.width=512;c.height=512;
  const x=c.getContext('2d');x.fillStyle='#d9ae72';x.fillRect(0,0,512,512);
  for(let i=0;i<250;i++){
    x.fillStyle=`rgba(80,43,20,${.04+rand()*.08})`;
    x.fillRect(rand()*512,rand()*512,rand()*90+10,1+rand()*2);
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);
  return t;
}
function gradientSky(){
  const c=document.createElement('canvas');c.width=32;c.height=256;
  const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#273f68');g.addColorStop(.38,'#a65276');g.addColorStop(.72,'#f08369');g.addColorStop(1,'#ffd07b');
  x.fillStyle=g;x.fillRect(0,0,32,256);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}

const colors={
  coral:mat(0xe9574d),turquoise:mat(0x20b6aa),cream:mat(0xffe6ad),
  yellow:mat(0xffc545),blue:mat(0x2477a8),brown:mat(0x71472b),
  dark:mat(0x20282c),green:mat(0x65ad54),lime:mat(0xb8d84c),
  red:mat(0xde4539),white:mat(0xfff4d0),orange:mat(0xef7d32)
};

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(70,32,16),
  new THREE.MeshBasicMaterial({map:gradientSky(),side:THREE.BackSide})
);
scene.add(sky);

const ground = box(70,.35,70,mat(0x9b6652,.95),0,-.2,0);
const sidewalk = box(70,.18,8,mat(0xd9af82,.9),0,.03,5.5);
for(let i=-30;i<31;i+=4) box(.08,.015,8,mat(0xb88d6e),i,.13,5.5);
const curb = box(70,.4,.55,mat(0xeee0b7),0,.2,1.4);
for(let i=-32;i<33;i+=2.5) box(1.8,.012,.54,mat(i%5===0?0xe16f56:0xd8d0a4),i,.42,1.4);

const sun = new THREE.Mesh(new THREE.SphereGeometry(2.1,24,16),new THREE.MeshBasicMaterial({color:0xffd27a}));
sun.position.set(-19,15,-20);scene.add(sun);

const hemi = new THREE.HemisphereLight(0xffd0a5,0x38475a,2.1);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffc28c,3.4);
key.position.set(-12,18,10);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-26;key.shadow.camera.right=26;key.shadow.camera.top=26;key.shadow.camera.bottom=-22;
scene.add(key);
const fill = new THREE.PointLight(0x39d6c5,1.3,25);
fill.position.set(4,5,-7);scene.add(fill);

const truck = new THREE.Group();scene.add(truck);
const body = new THREE.Mesh(new THREE.BoxGeometry(8.8,3.25,3.3),colors.coral);
body.position.set(0,2.75,0);body.castShadow=true;body.receiveShadow=true;truck.add(body);
const lower = new THREE.Mesh(new THREE.BoxGeometry(9.05,.55,3.4),colors.dark);
lower.position.set(0,1.15,0);lower.castShadow=true;truck.add(lower);
const roof = new THREE.Mesh(new THREE.BoxGeometry(9.4,.35,3.7),colors.cream);
roof.position.set(0,4.48,0);roof.castShadow=true;truck.add(roof);
const roofTrim = new THREE.Mesh(new THREE.BoxGeometry(9.5,.18,3.78),colors.turquoise);
roofTrim.position.set(0,4.29,0);truck.add(roofTrim);

const stripe = new THREE.Mesh(new THREE.BoxGeometry(8.95,.62,3.42),colors.yellow);
stripe.position.set(0,3.35,0);truck.add(stripe);
const frontBand = new THREE.Mesh(new THREE.BoxGeometry(8.98,.14,3.45),colors.turquoise);
frontBand.position.set(0,3.72,-1.72);truck.add(frontBand);

const cabWindow = new THREE.Mesh(new THREE.BoxGeometry(2.55,1.25,.06),new THREE.MeshStandardMaterial({color:0x233b4b,roughness:.3,metalness:.1}));
cabWindow.position.set(2.45,3.55,-1.69);truck.add(cabWindow);
const windowBar = new THREE.Mesh(new THREE.BoxGeometry(.12,1.28,.1),colors.cream);
windowBar.position.set(2.45,3.55,-1.75);truck.add(windowBar);
const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.15,1.28,.06),new THREE.MeshStandardMaterial({color:0x294957,roughness:.3}));
windshield.position.set(3.95,3.55,-1.69);truck.add(windshield);

const hatch = new THREE.Mesh(new THREE.BoxGeometry(4.1,1.75,.08),colors.dark);
hatch.position.set(-.85,3.36,-1.73);truck.add(hatch);
const hatchGlow = new THREE.Mesh(new THREE.BoxGeometry(3.7,1.38,.04),new THREE.MeshStandardMaterial({color:0x18232a,emissive:0x6d331d,emissiveIntensity:.25}));
hatchGlow.position.set(-.85,3.31,-1.79);truck.add(hatchGlow);
const hatchTop = new THREE.Mesh(new THREE.BoxGeometry(4.3,.16,.55),colors.yellow);
hatchTop.position.set(-.85,4.28,-1.88);hatchTop.rotation.x=-.1;truck.add(hatchTop);
const counter = new THREE.Mesh(new THREE.BoxGeometry(4.8,.25,.72),quadMaterial());
function quadMaterial(){return new THREE.MeshStandardMaterial({map:quadTexture(),roughness:.82});}
counter.position.set(-.85,2.55,-2.02);counter.castShadow=true;truck.add(counter);

const door = new THREE.Mesh(new THREE.BoxGeometry(1.25,2.15,.07),colors.turquoise);
door.position.set(3.25,2.55,-1.71);truck.add(door);
for(let y=2.05;y<3.65;y+=.4){
  const line=new THREE.Mesh(new THREE.BoxGeometry(1.05,.035,.08),colors.cream);line.position.set(3.25,y,-1.76);truck.add(line);
}
const bumper = new THREE.Mesh(new THREE.BoxGeometry(9.35,.22,.22),colors.chrome||mat(0xb8c2be,.25,.7));
bumper.position.set(0,1.03,-1.76);truck.add(bumper);

for(const x of [-3.1,3.1]){
  const tire=cyl(.68,.38,colors.dark,x,1.05,-1.08,0,0,Math.PI/2,28);tire.scale.z=1;
  const hub=cyl(.27,.4,colors.cream,x,1.05,-1.09,0,0,Math.PI/2,20);
  const cap=cyl(.11,.42,colors.red,x,1.05,-1.1,0,0,Math.PI/2,16);
  truck.add(tire,hub,cap);
}
for(const x of [-3.65,-2.75,2.35,3.25]){
  const lamp=sphere(.14,colors.yellow,x,2.25,-1.78);truck.add(lamp);
}
const logo = new THREE.Mesh(new THREE.CircleGeometry(.86,32),new THREE.MeshStandardMaterial({color:0xffd44b}));
logo.position.set(0,3.98,-1.79);logo.rotation.x=0;logo.rotation.y=Math.PI;truck.add(logo);
const logoRing = new THREE.Mesh(new THREE.TorusGeometry(.86,.07,10,32),colors.red);
logoRing.position.set(0,3.98,-1.84);logoRing.rotation.x=Math.PI/2;truck.add(logoRing);
const taco = new THREE.Group();truck.add(taco);
const shell = new THREE.Mesh(new THREE.SphereGeometry(.42,16,10,0,Math.PI,0,Math.PI),colors.orange);
shell.scale.set(1,.55,.75);shell.position.set(0,4.03,-1.91);shell.rotation.z=Math.PI; taco.add(shell);
for(let i=-.2;i<=.2;i+=.2){const f=sphere(.08,colors.green,i,4.03,-2.15);taco.add(f)}

const sign = new THREE.Group();scene.add(sign);sign.position.set(-6,0,1);
box(1.65,.16,.16,colors.brown,-6,4.2,1);
box(.13,4.15,.13,colors.brown,-6.68,2.05,1);
box(.13,4.15,.13,colors.brown,-5.32,2.05,1);
const menuBoard=box(1.48,2.65,.12,new THREE.MeshStandardMaterial({map:textTexture(['TACOS','ASADA  3','PASTOR  3','POLLO  3','AGUA FRESCA','¡MUY BUENO!']),roughness:.9}),-6,2.65,.94);
menuBoard.rotation.x=-.06;

for(const x of [-2.55,-1.25,.05]){
  const stoolGroup=new THREE.Group();scene.add(stoolGroup);
  cyl(.12,1.55,colors.dark,x,1.78,-2.72);
  cyl(.5,.16,colors.yellow,x,2.55,-2.72,0,0,0,24);
  cyl(.42,.12,colors.red,x,2.65,-2.72,0,0,0,24);
}

const cooler=new THREE.Group();scene.add(cooler);
box(1.75,1.0,.95,colors.blue,5.4,1.02,2.8);
box(1.85,.16,.99,colors.cream,5.4,1.58,2.8);
box(1.62,.12,.92,colors.turquoise,5.4,1.68,2.8);
for(let i=0;i<4;i++) cyl(.16,.16,[colors.red,colors.yellow,colors.green,colors.white][i],4.85+i*.36,1.85,2.8,Math.PI/2,0,0,16);

function crate(x,y,z){
  const g=new THREE.Group();scene.add(g);g.position.set(x,y,z);
  const base=box(.95,.55,.8,quadMaterial(),0,0,0);g.add(base);
  for(const yy of [-.22,.23]){const rail=box(1.02,.1,.86,colors.brown,0,yy,0);g.add(rail)}
  for(const xx of [-.42,.42]){const rail=box(.1,.58,.86,colors.brown,xx,0,0);g.add(rail)}
  return g;
}
crate(6.3,.55,3.1);crate(7.3,.55,3.05);crate(6.8,1.18,3.05);
for(const p of [[6.05,.98,3.12],[6.5,.98,3.2],[7.05,.98,3.1],[7.5,.98,3.2],[6.6,1.62,3.05],[7.05,1.62,3.12]]){
  sphere(.24,colors.lime,p[0],p[1],p[2]);
  sphere(.035,colors.dark,p[0]+.1,p[1]+.13,p[2]-.18);
}

const palm=new THREE.Group();scene.add(palm);palm.position.set(8.5,0,1.8);
cyl(.34,5.3,colors.brown,0,2.65,0,0,0,.08,18);
for(let i=0;i<5;i++){
  const a=i*Math.PI*2/5+.2;
  const start=new THREE.Vector3(0,5.25,0), end=new THREE.Vector3(Math.cos(a)*2.1,6.05+Math.sin(a)*.25,Math.sin(a)*2.1);
  tube([start,new THREE.Vector3(Math.cos(a)*.8,5.65,Math.sin(a)*.8),end],.1,colors.green);
  const leaf=new THREE.Mesh(new THREE.ConeGeometry(.38,2.7,8),colors.green);
  leaf.position.copy(end);leaf.rotation.z=Math.PI/2-Math.atan2(end.y-start.y,Math.hypot(end.x-start.x,end.z-start.z));leaf.rotation.y=-a; palm.add(leaf);
}
for(let i=0;i<3;i++)sphere(.27,colors.brown,Math.cos(i*2)*.4,5.32,Math.sin(i*2)*.4).parent=palm;

const lamp=new THREE.Group();scene.add(lamp);lamp.position.set(7,0,-4);
cyl(.16,6.8,colors.dark,0,3.4,0);
cyl(.34,.22,colors.dark,0,6.82,0);
const arm=tube([new THREE.Vector3(0,6.8,0),new THREE.Vector3(0,7.45,0),new THREE.Vector3(-1.15,7.75,0)],.12,colors.dark);arm.parent=lamp;
const bulb=sphere(.25,colors.yellow,-1.15,7.55,-0.02);bulb.parent=lamp;
const glow=new THREE.PointLight(0xffc45d,2.4,8);glow.position.set(-1.15,7.45,0);lamp.add(glow);

const wire=mat(0x262d31,.8);
const string=new THREE.Group();scene.add(string);
string.add(tube([new THREE.Vector3(-4.9,6.8,-1.6),new THREE.Vector3(-1.7,6.0,-1.6),new THREE.Vector3(1.5,6.35,-1.6),new THREE.Vector3(5.85,7.25,-3.9)],.025,wire));
for(let i=0;i<10;i++){
  const t=i/9,x=-4.9+(5.85+4.9)*t,z=-1.6+(-3.9+1.6)*t,y=6.8+(7.25-6.8)*t-.8*Math.sin(t*Math.PI);
  const socket=cyl(.055,.22,wire,x,y-.12,z);
  const bulb=sphere(.105,colors.yellow,x,y-.29,z);
  bulb.material.emissive=new THREE.Color(0xffa52f);bulb.material.emissiveIntensity=1.6;
  string.add(socket,bulb);
}

const bunting=new THREE.Group();scene.add(bunting);
for(let i=0;i<11;i++){
  const t=i/10,x=-4.8+10.1*t,z=-2.45,y=5.55-.55*Math.sin(t*Math.PI);
  const flag=new THREE.Mesh(new THREE.PlaneGeometry(.62,.56),[colors.red,colors.yellow,colors.turquoise,colors.blue][i%4]);
  flag.position.set(x,y,z);flag.rotation.x=Math.PI/2;flag.rotation.z=(i%2?-1:1)*.12;flag.userData.baseY=y;bunting.add(flag);
}
bunting.add(tube([new THREE.Vector3(-4.9,5.55,-2.45),new THREE.Vector3(.1,5.02,-2.45),new THREE.Vector3(5.4,5.55,-2.45)],.025,wire));

const cone=new THREE.Group();scene.add(cone);cone.position.set(-8,0,2.1);
const coneBody=new THREE.Mesh(new THREE.ConeGeometry(.45,1.35,24),colors.orange);
coneBody.position.y=.7;coneBody.castShadow=true;cone.add(coneBody);
box(.95,.13,.95,colors.dark,0,.06,0).parent=cone;
for(const y of [.45,.8,1.12]){
  const band=new THREE.Mesh(new THREE.CylinderGeometry(.36-(y-.45)*.16,.4-(y-.45)*.16,.1,24),colors.white);
  band.position.y=y;cone.add(band);
}

const trash=new THREE.Group();scene.add(trash);trash.position.set(-8,0,5.2);
cyl(.62,1.35,colors.dark,0,.7,0);
cyl(.7,.14,colors.yellow,0,1.4,0);
box(.5,.12,.5,colors.cream,0,1.56,0);

for(let i=0;i<18;i++){
  const x=-14+rand()*28,z=-2+rand()*13;
  if(Math.abs(x)<5&&z<3)continue;
  const peb=sphere(.025+rand()*.06,mat(rand()>.5?0x6f5145:0xc18468),x,.04,z);
  peb.scale.y=.25;
}

const smoke=new THREE.Group();scene.add(smoke);
for(let i=0;i<5;i++){
  const puff=sphere(.18+rand()*.12,new THREE.MeshStandardMaterial({color:0xffd8ad,transparent:true,opacity:.23}),-2.3,4.7+i*.28,-.3);
  puff.userData.offset=rand()*6;smoke.add(puff);
}

const animatedBulbs=[];
string.traverse(o=>{if(o.material&&o.material.emissive)animatedBulbs.push(o)});
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  truck.position.y=Math.sin(t*1.2)*.018;
  bunting.children.forEach((o,i)=>{
    if(o.geometry&&o.geometry.type==='PlaneGeometry'){
      o.rotation.y=Math.sin(t*2.2+i*.7)*.18;
      o.position.y=o.userData.baseY+Math.sin(t*2+i)*.08;
    }
  });
  smoke.children.forEach((p,i)=>{
    p.position.x=-2.3+Math.sin(t*.55+i)*.16;
    p.position.y=4.7+i*.28+(t*.16+i*.04)%1.1;
    p.scale.setScalar(.8+((t*.16+i*.04)%1.1)*.45);
    p.material.opacity=.24*(1-((t*.16+i*.04)%1.1)/1.1);
  });
  animatedBulbs.forEach((b,i)=>{
    b.material.emissiveIntensity=1.05+.7*Math.sin(t*3+i);
  });
  controls.update();
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
animate();
</script>
</body>
</html>
