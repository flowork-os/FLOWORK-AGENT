<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chrome Pitcher Plant</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0b0d; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: rgba(200, 214, 226, 0.38); pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="hint">Chrome Pitcher Plant &nbsp;·&nbsp; drag to orbit &nbsp;·&nbsp; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d10);
scene.fog = new THREE.FogExp2(0x0b0d10, 0.018);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 200);
camera.position.set(1.35, 0.75, 2.35);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 1.1;
controls.maxDistance = 9.0;
controls.target.set(0, 0.02, 0);
controls.maxPolarAngle = Math.PI * 0.9;
controls.update();

/* ============================================================
   PROCEDURAL ENVIRONMENT MAP
   A studio-like cube environment painted into a canvas and used
   as the reflection source. Horizontal bands of silver / steel-blue
   smear across the mirror surfaces as the object rotates.
   ============================================================ */
function makeEnvFace(kind) {
  const S = 256;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const g = c.getContext('2d');

  // base gradient (dark floor -> bright ceiling feel)
  const base = g.createLinearGradient(0, 0, 0, S);
  if (kind === 'up') {
    base.addColorStop(0.0, '#dfe9f2');
    base.addColorStop(1.0, '#8fa2b4');
  } else if (kind === 'down') {
    base.addColorStop(0.0, '#15181c');
    base.addColorStop(1.0, '#05060a');
  } else {
    base.addColorStop(0.00, '#aebecd');
    base.addColorStop(0.30, '#6d7f92');
    base.addColorStop(0.52, '#2b333d');
    base.addColorStop(0.74, '#12161b');
    base.addColorStop(1.00, '#07090c');
  }
  g.fillStyle = base;
  g.fillRect(0, 0, S, S);

  if (kind === 'side') {
    // bright horizontal softbox bands -> stretched silver streaks
    const bands = [
      { y: 0.10, h: 0.075, a: 0.95, col: '255,255,255' },
      { y: 0.24, h: 0.030, a: 0.55, col: '210,228,245' },
      { y: 0.39, h: 0.052, a: 0.75, col: '176,206,236' },
      { y: 0.60, h: 0.022, a: 0.40, col: '120,150,180' },
      { y: 0.83, h: 0.045, a: 0.30, col: '90,116,142' }
    ];
    for (const b of bands) {
      const y0 = b.y * S, h = b.h * S;
      const gr = g.createLinearGradient(0, y0 - h, 0, y0 + h);
      gr.addColorStop(0.0, `rgba(${b.col},0)`);
      gr.addColorStop(0.5, `rgba(${b.col},${b.a})`);
      gr.addColorStop(1.0, `rgba(${b.col},0)`);
      g.fillStyle = gr;
      g.fillRect(0, y0 - h, S, h * 2);
    }
    // a couple of vertical strip lights for crisp specular slivers
    const strips = [0.17, 0.52, 0.81];
    for (let i = 0; i < strips.length; i++) {
      const x0 = strips[i] * S;
      const w = S * (0.012 + 0.010 * i);
      const gr = g.createLinearGradient(x0 - w * 3, 0, x0 + w * 3, 0);
      gr.addColorStop(0.0, 'rgba(190,215,240,0)');
      gr.addColorStop(0.5, 'rgba(230,242,255,0.62)');
      gr.addColorStop(1.0, 'rgba(190,215,240,0)');
      g.fillStyle = gr;
      g.fillRect(x0 - w * 3, S * 0.04, w * 6, S * 0.62);
    }
    // steel-blue cool wash on the lower half
    const cool = g.createLinearGradient(0, S * 0.45, 0, S);
    cool.addColorStop(0, 'rgba(64,96,132,0.00)');
    cool.addColorStop(1, 'rgba(38,60,88,0.45)');
    g.fillStyle = cool;
    g.fillRect(0, S * 0.45, S, S * 0.55);
  }

  if (kind === 'up') {
    // large soft overhead source
    const rg = g.createRadialGradient(S * 0.5, S * 0.45, S * 0.03, S * 0.5, S * 0.45, S * 0.62);
    rg.addColorStop(0.0, 'rgba(255,255,255,1)');
    rg.addColorStop(0.45, 'rgba(226,238,250,0.75)');
    rg.addColorStop(1.0, 'rgba(150,170,192,0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, S, S);
  }

  if (kind === 'down') {
    const rg = g.createRadialGradient(S * 0.5, S * 0.5, S * 0.02, S * 0.5, S * 0.5, S * 0.55);
    rg.addColorStop(0.0, 'rgba(70,86,104,0.55)');
    rg.addColorStop(1.0, 'rgba(4,5,8,0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, S, S);
  }

  return c;
}

const envFaces = [
  makeEnvFace('side'), // +X
  makeEnvFace('side'), // -X
  makeEnvFace('up'),   // +Y
  makeEnvFace('down'), // -Y
  makeEnvFace('side'), // +Z
  makeEnvFace('side')  // -Z
];
const envTexture = new THREE.CubeTexture(envFaces);
envTexture.needsUpdate = true;
envTexture.colorSpace = THREE.SRGBColorSpace;

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileCubemapShader();
const envRT = pmrem.fromCubemap(envTexture);
const envMap = envRT.texture;
scene.environment = envMap;
pmrem.dispose();

/* ============================================================
   MATERIALS
   ============================================================ */
const chrome = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 1.0,
  roughness: 0.028,
  envMap: envMap,
  envMapIntensity: 1.55,
  clearcoat: 1.0,
  clearcoatRoughness: 0.02,
  side: THREE.DoubleSide
});

const chromeSteel = new THREE.MeshPhysicalMaterial({
  color: 0xd8e2ec,
  metalness: 1.0,
  roughness: 0.055,
  envMap: envMap,
  envMapIntensity: 1.4,
  clearcoat: 1.0,
  clearcoatRoughness: 0.04,
  side: THREE.DoubleSide
});

const chromeDark = new THREE.MeshPhysicalMaterial({
  color: 0x9fb2c6,
  metalness: 1.0,
  roughness: 0.10,
  envMap: envMap,
  envMapIntensity: 1.15,
  side: THREE.DoubleSide
});

/* ============================================================
   ROOT — exactly one centered object
   ============================================================ */
const plant = new THREE.Group();
scene.add(plant);

/* ------------------------------------------------------------
   Helpers
   ------------------------------------------------------------ */
const TWO_PI = Math.PI * 2;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

// cheap deterministic value noise (2D) for surface ripples
function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}

/* ============================================================
   1. THE PITCHER BODY  (trumpet that swells like poured mercury)
   Built as a custom lathe-ish revolution surface with angular
   ripple modulation so it reads as flowing liquid metal.
   ============================================================ */

// Profile radius as a function of height parameter t (0 = base tip, 1 = mouth)
function pitcherRadius(t) {
  // bulbous lower chamber, waisted middle, flaring trumpet mouth
  const bulb   = 0.150 * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.72)), 0.85);
  const belly  = 0.115 * Math.exp(-Math.pow((t - 0.26) / 0.24, 2));
  const waist  = -0.030 * Math.exp(-Math.pow((t - 0.60) / 0.16, 2));
  const flare  = 0.115 * Math.pow(smooth(0.70, 1.0, t), 2.1);
  const tipCap = smooth(0.0, 0.055, t);           // rounds off the closed bottom
  return Math.max(0.006, (bulb + belly + waist + flare) * tipCap + 0.010 * tipCap);
}

// Height as function of t (slightly non-linear: denser detail near mouth)
function pitcherHeight(t) {
  const H = 0.86;
  return H * (t * 0.82 + 0.18 * t * t);
}

const PITCH_SEG_U = 224;  // around
const PITCH_SEG_V = 260;  // along height

function buildPitcherBody() {
  const geom = new THREE.BufferGeometry();
  const cols = PITCH_SEG_U + 1;
  const rows = PITCH_SEG_V + 1;
  const pos = new Float32Array(cols * rows * 3);
  const uvs = new Float32Array(cols * rows * 2);

  for (let j = 0; j < rows; j++) {
    const t = j / PITCH_SEG_V;
    const y = pitcherHeight(t);
    const rBase = pitcherRadius(t);

    for (let i = 0; i < cols; i++) {
      const u = i / PITCH_SEG_U;
      const a = u * TWO_PI;

      // --- liquid-metal ripples: travelling ridges + noise wobble
      const ripple =
          0.0075 * Math.sin(a * 6.0 + t * 15.0) * smooth(0.05, 0.55, t) * (1.0 - smooth(0.80, 1.0, t)) +
          0.0042 * Math.sin(a * 11.0 - t * 9.0) * smooth(0.10, 0.60, t) +
          0.0060 * (vnoise(Math.cos(a) * 2.6 + 5.0, Math.sin(a) * 2.6 + t * 4.2) - 0.5) * smooth(0.04, 0.35, t);

      // --- two vertical wings/ribs down the front (nepenthes trait), softened & molten
      const wingA = Math.exp(-Math.pow(((a - Math.PI * 0.78 + TWO_PI) % TWO_PI - 0) / 0.16, 2));
      const wingB = Math.exp(-Math.pow(((a - Math.PI * 1.22 + TWO_PI) % TWO_PI - 0) / 0.16, 2));
      const wing = (wingA + wingB) * 0.020 * smooth(0.06, 0.30, t) * (1.0 - smooth(0.62, 0.90, t));

      // --- slight ovalisation so the trumpet isn't a perfect solid of revolution
      const oval = 1.0 + 0.045 * Math.cos(2.0 * a) * smooth(0.35, 1.0, t);

      const r = Math.max(0.004, (rBase * oval) + ripple * (0.35 + rBase * 3.0) + wing);

      // --- gentle lean/curve of the whole vessel (a poured, sagging feel)
      const bendX = 0.052 * Math.pow(t, 2.3);
      const bendZ = 0.020 * Math.pow(t, 3.0);

      const idx = (j * cols + i);
      pos[idx * 3 + 0] = Math.cos(a) * r + bendX;
      pos[idx * 3 + 1] = y;
      pos[idx * 3 + 2] = Math.sin(a) * r + bendZ;
      uvs[idx * 2 + 0] = u;
      uvs[idx * 2 + 1] = t;
    }
  }

  const indices = [];
  for (let j = 0; j < PITCH_SEG_V; j++) {
    for (let i = 0; i < PITCH_SEG_U; i++) {
      const a0 = j * cols + i;
      const b0 = j * cols + i + 1;
      const c0 = (j + 1) * cols + i + 1;
      const d0 = (j + 1) * cols + i;
      indices.push(a0, d0, b0);
      indices.push(b0, d0, c0);
    }
  }

  geom.setIndex(indices);
  geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geom.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geom.computeVertexNormals();
  return geom;
}

const bodyMesh = new THREE.Mesh(buildPitcherBody(), chrome);
bodyMesh.castShadow = true;
bodyMesh.receiveShadow = true;
plant.add(bodyMesh);

/* --- rounded bottom cap so the vessel is closed and reads solid --- */
{
  const capR = pitcherRadius(0.02);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.020, 48, 24), chrome);
  cap.scale.set(1.0, 0.9, 1.0);
  cap.position.set(0, 0.004, 0);
  cap.castShadow = true;
  plant.add(cap);
  void capR;
}

/* ============================================================
   2. INNER THROAT — a darker mirrored funnel seen through the mouth
   ============================================================ */
{
  const mouthT = 1.0;
  const rMouth = pitcherRadius(mouthT);
  const yMouth = pitcherHeight(mouthT);
  const pts = [];
  const N = 40;
  for (let i = 0; i <= N; i++) {
    const s = i / N;                       // 0 at bottom of throat -> 1 at lip
    const y = yMouth - 0.30 + 0.30 * s;
    const r = (rMouth * 0.98) * (0.30 + 0.70 * Math.pow(s, 0.55));
    pts.push(new THREE.Vector2(Math.max(0.004, r), y));
  }
  const throat = new THREE.Mesh(new THREE.LatheGeometry(pts, 128), chromeDark);
  throat.position.x = 0.052 * Math.pow(0.92, 2.3) * 0 + 0.052;
  throat.position.z = 0.020;
  plant.add(throat);
}

/* ============================================================
   3. PERISTOME — the flared lip rolling into a glossy torus
   A swept tube around the mouth, ribbed and tilted, rising into a
   raised "column" at the back where the lid attaches.
   ============================================================ */
const mouthY = pitcherHeight(1.0);
const mouthR = pitcherRadius(1.0);
const mouthCX = 0.052;     // matches bendX at t=1
const mouthCZ = 0.020;

// Curve describing the centre-line of the peristome torus
class PeristomeCurve extends THREE.Curve {
  getPoint(t, target = new THREE.Vector3()) {
    const a = t * TWO_PI;
    // rim radius: slightly oval, plus a swelling toward the back column
    const backness = Math.max(0, Math.cos(a - Math.PI));       // 1 at back (a = PI)
    const rr = mouthR * (1.045 + 0.045 * Math.cos(2 * a)) + 0.012 * Math.pow(backness, 3);
    // rim height: tilted mouth (front low, back high) + raised neck at back
    const y = mouthY
      + 0.030 * Math.cos(a - Math.PI)                 // tilt
      + 0.055 * Math.pow(backness, 5)                 // back column lift
      + 0.006 * Math.sin(a * 3.0);                    // molten undulation
    target.set(mouthCX + Math.cos(a) * rr, y, mouthCZ + Math.sin(a) * rr);
    return target;
  }
}

function buildPeristome() {
  const curve = new PeristomeCurve();
  const SEG_U = 320;   // around the rim
  const SEG_V = 40;    // around the tube
  const cols = SEG_U + 1;
  const rows = SEG_V + 1;
  const pos = new Float32Array(cols * rows * 3);
  const uvs = new Float32Array(cols * rows * 2);

  const frames = curve.computeFrenetFrames(SEG_U, true);
  const P = new THREE.Vector3();

  for (let i = 0; i < cols; i++) {
    const ti = i / SEG_U;
    curve.getPoint(ti % 1, P);
    const N = frames.normals[i % SEG_U];
    const B = frames.binormals[i % SEG_U];
    const a = ti * TWO_PI;
    const backness = Math.max(0, Math.cos(a - Math.PI));

    // tube radius: thick, swelling at the back, thinner at the front lip
    const tubeR = 0.0245 + 0.0090 * Math.pow(backness, 2.0) - 0.0035 * Math.max(0, Math.cos(a));

    for (let j = 0; j < rows; j++) {
      const v = j / SEG_V;
      const ang = v * TWO_PI;

      // peristome ribs: fine corrugations running across the roll
      const ribs = 0.0016 * Math.sin(a * 64.0) * (0.5 + 0.5 * Math.cos(ang));
      const molt = 0.0011 * Math.sin(ang * 3.0 + a * 5.0);

      const r = tubeR + ribs + molt;

      // squash the tube slightly so it reads as a rolled lip, not a pipe
      const nx = Math.cos(ang) * r * 1.06;
      const bx = Math.sin(ang) * r * 0.86;

      const idx = i * rows + j;
      pos[idx * 3 + 0] = P.x + N.x * nx + B.x * bx;
      pos[idx * 3 + 1] = P.y + N.y * nx + B.y * bx;
      pos[idx * 3 + 2] = P.z + N.z * nx + B.z * bx;
      uvs[idx * 2 + 0] = ti;
      uvs[idx * 2 + 1] = v;
    }
  }

  const indices = [];
  for (let i = 0; i < SEG_U; i++) {
    for (let j = 0; j < SEG_V; j++) {
      const a0 = i * rows + j;
      const b0 = (i + 1) * rows + j;
      const c0 = (i + 1) * rows + j + 1;
      const d0 = i * rows + j + 1;
      indices.push(a0, b0, d0);
      indices.push(b0, c0, d0);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setIndex(indices);
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  g.computeVertexNormals();
  return g;
}

const peristome = new THREE.Mesh(buildPeristome(), chromeSteel);
peristome.castShadow = true;
peristome.receiveShadow = true;
plant.add(peristome);

/* --- inner collar: the lip curling inward over the throat --- */
{
  const pts = [];
  const N = 26;
  for (let i = 0; i <= N; i++) {
    const s = i / N;
    const r = mouthR * (1.02 - 0.42 * Math.pow(s, 0.8));
    const y = mouthY + 0.012 - 0.075 * Math.pow(s, 1.3);
    pts.push(new THREE.Vector2(Math.max(0.004, r), y));
  }
  const collar = new THREE.Mesh(new THREE.LatheGeometry(pts, 160), chromeSteel);
  collar.position.set(mouthCX, 0, mouthCZ);
  plant.add(collar);
}

/* ============================================================
   4. THE LID (operculum) — frozen mid-drip above the mouth
   A hood-like shell hinged at the back column, with a hanging
   teardrop of liquid metal caught mid-fall beneath it.
   ============================================================ */
const lidGroup = new THREE.Group();
// hinge point: back of the rim, atop the raised column
{
  const aBack = Math.PI;
  const rrBack = mouthR * (1.045 + 0.045 * Math.cos(2 * aBack)) + 0.012;
  lidGroup.position.set(
    mouthCX + Math.cos(aBack) * rrBack * 0.86,
    mouthY + 0.030 + 0.055 + 0.012,
    mouthCZ + Math.sin(aBack) * rrBack * 0.86
  );
}
lidGroup.rotation.y = 0;              // hinge opens toward +X (the front)
lidGroup.rotation.z = -0.30;          // tipped up, hovering over the mouth
plant.add(lidGroup);

function buildLid() {
  // Parametric shell: length along X (front), width along Z, domed in Y,
  // with a molten drooping tip and a rippled underside.
  const SEG_U = 120;  // along length
  const SEG_V = 96;   // across width
  const cols = SEG_U + 1;
  const rows = SEG_V + 1;
  const pos = new Float32Array(cols * rows * 3);
  const uvs = new Float32Array(cols * rows * 2);

  const LEN = 0.235;

  for (let i = 0; i < cols; i++) {
    const u = i / SEG_U;                 // 0 at hinge -> 1 at tip
    for (let j = 0; j < rows; j++) {
      const v = j / SEG_V;               // 0..1 around the plate outline
      const ang = v * TWO_PI;

      // half-width of the lid at station u (leaf/hood outline)
      const w = 0.135 * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.78)), 0.62) + 0.006;

      // thickness profile: fat near hinge, tapering to a thin molten edge
      const th = 0.0135 * (1.0 - 0.72 * Math.pow(u, 1.4)) + 0.0022;

      // cross-section: an ellipse whose top is domed and bottom is concave
      const cz = Math.cos(ang) * w;
      let cy = Math.sin(ang) * th;
      // dome the upper surface more than the lower
      if (Math.sin(ang) > 0) cy *= 1.55;
      else cy *= 0.85;

      // arch of the hood: rises then droops toward the tip (mid-drip sag)
      const arch = 0.052 * Math.sin(Math.PI * Math.pow(u, 0.85)) - 0.098 * Math.pow(u, 3.1);

      // travelling ripples over the shell -> poured mercury surface
      const rip =
        0.0028 * Math.sin(u * 22.0 + Math.cos(ang) * 4.0) * smooth(0.05, 0.85, u) +
        0.0022 * (vnoise(u * 5.0 + 11.0, Math.cos(ang) * 2.0 + 3.0) - 0.5);

      const x = LEN * u;
      const y = arch + cy + rip * 0.8;
      const z = cz * (1.0 + 0.05 * Math.sin(u * 9.0));

      const idx = i * rows + j;
      pos[idx * 3 + 0] = x;
      pos[idx * 3 + 1] = y;
      pos[idx * 3 + 2] = z;
      uvs[idx * 2 + 0] = u;
      uvs[idx * 2 + 1] = v;
    }
  }

  const indices = [];
  for (let i = 0; i < SEG_U; i++) {
    for (let j = 0; j < SEG_V; j++) {
      const a0 = i * rows + j;
      const b0 = (i + 1) * rows + j;
      const c0 = (i + 1) * rows + j + 1;
      const d0 = i * rows + j + 1;
      indices.push(a0, d0, b0);
      indices.push(b0, d0, c0);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setIndex(indices);
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  g.computeVertexNormals();
  return g;
}

const lidMesh = new THREE.Mesh(buildLid(), chrome);
lidMesh.castShadow = true;
lidMesh.receiveShadow = true;
lidGroup.add(lidMesh);

/* --- the drip: a pendant teardrop of chrome hanging off the lid tip --- */
function buildDrop(len, rad) {
  // teardrop profile lathed: pointed at the top (still attached), fat at the bottom
  const pts = [];
  const N = 44;
  for (let i = 0; i <= N; i++) {
    const s = i / N;                     // 0 top attach -> 1 bottom
    // classic droplet: r = rad * sin(pi*s)^0.7 biased low
    const r = rad * Math.pow(Math.sin(Math.PI * Math.pow(s, 0.62)), 0.80) * (0.55 + 0.55 * s);
    const y = -len * s;
    pts.push(new THREE.Vector2(Math.max(0.0012, r), y));
  }
  return new THREE.LatheGeometry(pts, 72);
}

{
  // main drip hanging from the drooping lid tip
  const drip = new THREE.Mesh(buildDrop(0.085, 0.0175), chrome);
  drip.castShadow = true;
  drip.position.set(0.235 * 0.985, -0.098 * 0.98 - 0.004, 0.0);
  lidGroup.add(drip);

  // a smaller bead just separating below it — frozen mid-fall
  const bead = new THREE.Mesh(new THREE.SphereGeometry(0.0092, 40, 28), chrome);
  bead.scale.set(1.0, 1.22, 1.0);
  bead.castShadow = true;
  bead.position.set(0.235 * 0.985, -0.098 * 0.98 - 0.118, 0.0);
  lidGroup.add(bead);

  // thin filament connecting drop to bead (the necking of the liquid)
  const neck = new THREE.Mesh(
    new THREE.CylinderGeometry(0.0011, 0.0022, 0.026, 16, 1, true),
    chrome
  );
  neck.position.set(0.235 * 0.985, -0.098 * 0.98 - 0.094, 0.0);
  lidGroup.add(neck);
}

/* --- lid ridge/keel on the underside, and the hinge knuckle --- */
{
  const keelPts = [];
  const N = 24;
  for (let i = 0; i <= N; i++) {
    const s = i / N;
    keelPts.push(new THREE.Vector2(Math.max(0.0015, 0.0075 * Math.sin(Math.PI * Math.pow(s, 0.7)) + 0.0012), s * 0.09));
  }
  const knuckle = new THREE.Mesh(new THREE.LatheGeometry(keelPts, 48), chromeSteel);
  knuckle.rotation.z = Math.PI * 0.5;
  knuckle.position.set(-0.012, 0.006, 0);
  knuckle.scale.set(1.0, 1.6, 1.0);
  lidGroup.add(knuckle);
}

/* ============================================================
   5. THE TENDRIL — a curled ribbon/cable of chrome the pitcher
   hangs from, coiling into a spiral above.
   ============================================================ */
class TendrilCurve extends THREE.Curve {
  constructor() { super(); }
  getPoint(t, target = new THREE.Vector3()) {
    // t: 0 at the top-back anchor -> 1 where it meets the lid hinge / rim
    // Phase A (0 .. 0.62): tight helical coil descending
    // Phase B (0.62 .. 1): straightens and sweeps down into the pitcher neck
    const hingeX = mouthCX - mouthR * 0.90;
    const hingeY = mouthY + 0.030 + 0.055 + 0.030;
    const hingeZ = mouthCZ;

    if (t < 0.62) {
      const s = t / 0.62;                 // 0..1 within the coil
      const turns = 2.35;
      const ang = -s * TWO_PI * turns + Math.PI * 0.15;
      // coil radius shrinks as it descends
      const R = 0.145 * (1.0 - 0.55 * Math.pow(s, 1.15)) + 0.012;
      const cx = hingeX - 0.055;
      const cz = hingeZ + 0.010;
      const yTop = hingeY + 0.60;
      const y = yTop - 0.40 * Math.pow(s, 0.92);
      target.set(cx + Math.cos(ang) * R, y, cz + Math.sin(ang) * R);
      return target;
    } else {
      const s = (t - 0.62) / 0.38;        // 0..1 within the descent
      // start point = end of coil (continuity)
      const sc = 1.0;
      const turns = 2.35;
      const angEnd = -sc * TWO_PI * turns + Math.PI * 0.15;
      const REnd = 0.145 * (1.0 - 0.55) + 0.012;
      const cx = hingeX - 0.055;
      const cz = hingeZ + 0.010;
      const yTop = hingeY + 0.60;
      const p0 = new THREE.Vector3(cx + Math.cos(angEnd) * REnd, yTop - 0.40, cz + Math.sin(angEnd) * REnd);
      const p3 = new THREE.Vector3(hingeX, hingeY, hingeZ);
      const p1 = new THREE.Vector3(p0.x - 0.10, p0.y - 0.10, p0.z + 0.05);
      const p2 = new THREE.Vector3(p3.x - 0.14, p3.y + 0.13, p3.z - 0.03);
      const it = 1 - s;
      const x = it * it * it * p0.x + 3 * it * it * s * p1.x + 3 * it * s * s * p2.x + s * s * s * p3.x;
      const y = it * it * it * p0.y + 3 * it * it * s * p1.y + 3 * it * s * s * p2.y + s * s * s * p3.y;
      const z = it * it * it * p0.z + 3 * it * it * s * p1.z + 3 * it * s * s * p2.z + s * s * s * p3.z;
      target.set(x, y, z);
      return target;
    }
  }
}

const tendrilCurve = new TendrilCurve();

function buildTendril() {
  const SEG_U = 460;
  const SEG_V = 26;
  const cols = SEG_U + 1;
  const rows = SEG_V + 1;
  const pos = new Float32Array(cols * rows * 3);
  const uvs = new Float32Array(cols * rows * 2);

  const frames = tendrilCurve.computeFrenetFrames(SEG_U, false);
  const P = new THREE.Vector3();

  for (let i = 0; i < cols; i++) {
    const u = i / SEG_U;
    tendrilCurve.getPoint(u, P);
    const N = frames.normals[Math.min(i, SEG_U - 1)];
    const B = frames.binormals[Math.min(i, SEG_U - 1)];

    // tapered cable: thin at the top anchor, thicker where it carries the pitcher
    const taper = 0.0060 + 0.0075 * smooth(0.10, 0.98, u) + 0.0020 * Math.sin(u * 30.0) * 0.35;

    for (let j = 0; j < rows; j++) {
      const v = j / SEG_V;
      const ang = v * TWO_PI;
      // slight ribbon flattening + molten flutes
      const flute = 0.00075 * Math.sin(ang * 5.0 + u * 40.0);
      const r = taper + flute;
      const nx = Math.cos(ang) * r * 1.18;
      const bx = Math.sin(ang) * r * 0.80;

      const idx = i * rows + j;
      pos[idx * 3 + 0] = P.x + N.x * nx + B.x * bx;
      pos[idx * 3 + 1] = P.y + N.y * nx + B.y * bx;
      pos[idx * 3 + 2] = P.z + N.z * nx + B.z * bx;
      uvs[idx * 2 + 0] = u;
      uvs[idx * 2 + 1] = v;
    }
  }

  const indices = [];
  for (let i = 0; i < SEG_U; i++) {
    for (let j = 0; j < SEG_V; j++) {
      const a0 = i * rows + j;
      const b0 = (i + 1) * rows + j;
      const c0 = (i + 1) * rows + j + 1;
      const d0 = i * rows + j + 1;
      indices.push(a0, b0, d0);
      indices.push(b0, c0, d0);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setIndex(indices);
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  g.computeVertexNormals();
  return g;
}

const tendril = new THREE.Mesh(buildTendril(), chromeSteel);
tendril.castShadow = true;
tendril.receiveShadow = true;
plant.add(tendril);

/* --- collar where the tendril fuses into the back of the pitcher --- */
{
  const pts = [];
  const N = 22;
  for (let i = 0; i <= N; i++) {
    const s = i / N;
    pts.push(new THREE.Vector2(
      Math.max(0.002, 0.028 * Math.pow(Math.sin(Math.PI * (0.15 + 0.85 * s)), 0.9) + 0.004),
      -0.045 + s * 0.09
    ));
  }
  const junction = new THREE.Mesh(new THREE.LatheGeometry(pts, 64), chromeSteel);
  const hingeX = mouthCX - mouthR * 0.90;
  const hingeY = mouthY + 0.030 + 0.055 + 0.030;
  junction.position.set(hingeX, hingeY - 0.012, mouthCZ);
  junction.rotation.z = 0.35;
  junction.castShadow = true;
  plant.add(junction);
}

/* --- a thin leaf-blade the tendril emerges from, up at the anchor --- */
{
  const bladeShapeSeg = 90;
  const posArr = [];
  const idxArr = [];
  const uvArr = [];
  const LEN = 0.30;
  const ROWS = 18;
  for (let i = 0; i <= bladeShapeSeg; i++) {
    const u = i / bladeShapeSeg;
    const w = 0.062 * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.85)), 0.7) + 0.0025;
    const th = 0.0055 * (1.0 - 0.6 * u) + 0.0008;
    for (let j = 0; j <= ROWS; j++) {
      const v = j / ROWS;
      const ang = v * TWO_PI;
      const cz = Math.cos(ang) * w;
      const cy = Math.sin(ang) * th * (Math.sin(ang) > 0 ? 1.4 : 0.9);
      // gentle sag + twist
      const sag = -0.085 * Math.pow(u, 2.0);
      const twist = u * 0.55;
      const zz = cz * Math.cos(twist) - cy * Math.sin(twist);
      const yy = cz * Math.sin(twist) + cy * Math.cos(twist);
      posArr.push(LEN * u, sag + yy + 0.030 * Math.sin(Math.PI * u), zz);
      uvArr.push(u, v);
    }
  }
  const R = ROWS + 1;
  for (let i = 0; i < bladeShapeSeg; i++) {
    for (let j = 0; j < ROWS; j++) {
      const a0 = i * R + j, b0 = (i + 1) * R + j, c0 = (i + 1) * R + j + 1, d0 = i * R + j + 1;
      idxArr.push(a0, d0, b0, b0, d0, c0);
    }
  }
  const bg = new THREE.BufferGeometry();
  bg.setIndex(idxArr);
  bg.setAttribute('position', new THREE.Float32BufferAttribute(posArr, 3));
  bg.setAttribute('uv', new THREE.Float32BufferAttribute(uvArr, 2));
  bg.computeVertexNormals();

  const blade = new THREE.Mesh(bg, chrome);
  blade.castShadow = true;
  blade.receiveShadow = true;
  const anchor = tendrilCurve.getPoint(0.0, new THREE.Vector3());
  blade.position.copy(anchor);
  blade.rotation.y = Math.PI * 0.78;
  blade.rotation.z = 0.12;
  plant.add(blade);
}

/* ============================================================
   CENTER + SCALE THE SINGLE OBJECT
   ============================================================ */
{
  const box = new THREE.Box3().setFromObject(plant);
  const center = new THREE.Vector3();
  const size = new THREE.Vector3();
  box.getCenter(center);
  box.getSize(size);
  // recenter horizontally, and vertically about the object's middle
  plant.position.x -= center.x;
  plant.position.z -= center.z;
  plant.position.y -= center.y;

  // normalize overall height to a pleasant framing scale
  const targetH = 1.5;
  const s = targetH / Math.max(0.001, size.y);
  plant.scale.setScalar(s);

  // recompute so it sits exactly centered after scaling
  const box2 = new THREE.Box3().setFromObject(plant);
  const c2 = new THREE.Vector3();
  box2.getCenter(c2);
  plant.position.sub(c2);

  var GROUND_Y = new THREE.Box3().setFromObject(plant).min.y - 0.55;
}

/* ============================================================
   LIGHTING
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xbcd2e8, 0x0d1116, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 2.6);
key.position.set(2.6, 4.0, 2.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 14;
key.shadow.camera.left = -2.2;
key.shadow.camera.right = 2.2;
key.shadow.camera.top = 2.6;
key.shadow.camera.bottom = -2.6;
key.shadow.bias = -0.0012;
key.shadow.normalBias = 0.02;
key.shadow.radius = 3;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fb4d8, 0.85);
fill.position.set(-3.0, 1.3, 1.6);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xd6e6ff, 1.5);
rim.position.set(-1.4, 2.2, -3.2);
scene.add(rim);

// tight speculars that give chrome its hard glints
const spec1 = new THREE.PointLight(0xffffff, 3.0, 12, 2.0);
spec1.position.set(1.1, 1.9, 1.4);
scene.add(spec1);

const spec2 = new THREE.PointLight(0x9fc4ee, 2.2, 12, 2.0);
spec2.position.set(-1.5, 0.9, -1.2);
scene.add(spec2);

/* ============================================================
   SHADOW-ONLY GROUND
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.42, color: 0x000000 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = (typeof GROUND_Y === 'number' ? GROUND_Y : -1.05);
ground.receiveShadow = true;
scene.add(ground);

// faint radial glow disc under the object to seat it in the studio
{
  const S = 256;
  const c = document.createElement('canvas');
  c.width = S; c.height = S;
  const g2 = c.getContext('2d');
  const rg = g2.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  rg.addColorStop(0.0, 'rgba(126,152,180,0.30)');
  rg.addColorStop(0.45, 'rgba(70,88,110,0.13)');
  rg.addColorStop(1.0, 'rgba(0,0,0,0)');
  g2.fillStyle = rg;
  g2.fillRect(0, 0, S, S);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const glow = new THREE.Mesh(
    new THREE.PlaneGeometry(6.5, 6.5),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })
  );
  glow.rotation.x = -Math.PI / 2;
  glow.position.y = ground.position.y + 0.002;
  scene.add(glow);
}

/* ============================================================
   RESIZE + RENDER LOOP
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // barely-there breathing sway, as if the whole thing is still settling
  plant.rotation.z = Math.sin(t * 0.35) * 0.008;
  plant.rotation.x = Math.cos(t * 0.29) * 0.006;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
