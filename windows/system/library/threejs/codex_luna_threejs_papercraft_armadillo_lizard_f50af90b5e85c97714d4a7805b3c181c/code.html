<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papercraft Armadillo Lizard</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #cbb895; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcbb895);
scene.fog = new THREE.Fog(0xcbb895, 8, 18);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.6, 4.8, 7.3);
camera.lookAt(0, 0.35, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 5;
controls.maxDistance = 13;
controls.target.set(0, 0.35, 0);

scene.add(new THREE.HemisphereLight(0xfff4d9, 0x65533d, 2.2));

const keyLight = new THREE.DirectionalLight(0xffe5bd, 4.2);
keyLight.position.set(-5, 8, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -7;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xb8c8d5, 1.6);
rimLight.position.set(5, 4, -6);
scene.add(rimLight);

const palette = [
  new THREE.Color(0xd5b77b),
  new THREE.Color(0xc9984e),
  new THREE.Color(0xa95832),
  new THREE.Color(0xe0c890),
  new THREE.Color(0xb8743e)
];

const bodyMaterial = new THREE.MeshStandardMaterial({
  color: 0x9b633e,
  roughness: 0.92,
  metalness: 0,
  flatShading: true
});

const bellyMaterial = new THREE.MeshStandardMaterial({
  color: 0xcda874,
  roughness: 0.95,
  flatShading: true
});

const darkMaterial = new THREE.MeshStandardMaterial({
  color: 0x39271f,
  roughness: 0.8,
  flatShading: true
});

const eyeMaterial = new THREE.MeshStandardMaterial({
  color: 0x17110d,
  roughness: 0.25,
  metalness: 0.1
});

const eyeGlintMaterial = new THREE.MeshBasicMaterial({ color: 0xfff0c5 });

const lizard = new THREE.Group();
scene.add(lizard);

function orientAxis(object, axis, direction) {
  const d = direction.clone().normalize();
  object.quaternion.setFromUnitVectors(axis, d);
}

function addEdgeLines(mesh, color = 0x684b36, opacity = 0.42) {
  const edges = new THREE.EdgesGeometry(mesh.geometry, 20);
  const material = new THREE.LineBasicMaterial({
    color,
    transparent: true,
    opacity
  });
  const lines = new THREE.LineSegments(edges, material);
  lines.position.copy(mesh.position);
  lines.quaternion.copy(mesh.quaternion);
  lines.scale.copy(mesh.scale);
  lizard.add(lines);
}

function makeTriangleTab(position, normal, width, height, color) {
  const vertices = new Float32Array([
    -width * 0.5, -height * 0.5, 0,
     width * 0.5, -height * 0.5, 0,
     0,           height * 0.5, 0
  ]);
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geometry.computeVertexNormals();
  const material = new THREE.MeshStandardMaterial({
    color,
    roughness: 1,
    side: THREE.DoubleSide,
    flatShading: true
  });
  const tab = new THREE.Mesh(geometry, material);
  tab.position.copy(position);
  orientAxis(tab, new THREE.Vector3(0, 0, 1), normal);
  lizard.add(tab);
  return tab;
}

function makeFoldLine(start, end, color = 0x76563d, opacity = 0.34) {
  const geometry = new THREE.BufferGeometry().setFromPoints([start, end]);
  const material = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
  const line = new THREE.Line(geometry, material);
  lizard.add(line);
}

const ringRadius = 2.08;
const segmentCount = 22;
const segmentStep = Math.PI * 2 / segmentCount;

for (let i = 0; i < segmentCount; i++) {
  const angle = i * segmentStep;
  const radial = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
  const tangent = new THREE.Vector3(-Math.sin(angle), 0, Math.cos(angle));
  const position = radial.clone().multiplyScalar(ringRadius);
  position.y = 0.72 + 0.08 * Math.cos(angle * 2);

  const isTail = i >= segmentCount - 5;
  const size = isTail ? 0.78 - (i - (segmentCount - 5)) * 0.1 : 0.92;

  const geometry = new THREE.IcosahedronGeometry(0.62, 1);
  const material = i % 3 === 0 ? bellyMaterial : bodyMaterial;
  const segment = new THREE.Mesh(geometry, material);
  segment.position.copy(position);
  segment.scale.set(size * 0.72, 0.62, size);
  orientAxis(segment, new THREE.Vector3(0, 0, 1), tangent);
  segment.rotation.x += 0.08 * Math.sin(angle * 3);
  segment.castShadow = true;
  segment.receiveShadow = true;
  lizard.add(segment);

  if (i < segmentCount - 1) addEdgeLines(segment, 0x6d4a32, 0.25);

  const seamPoint = position.clone().add(radial.clone().multiplyScalar(0.48));
  seamPoint.y += 0.02;
  makeTriangleTab(
    seamPoint,
    radial.clone().add(new THREE.Vector3(0, 0.25, 0)),
    0.24,
    0.32,
    palette[(i + 2) % palette.length]
  );

  for (let row = 0; row < 3; row++) {
    const rowOffset = (row - 1) * 0.28;
    const plateCenter = position.clone()
      .add(radial.clone().multiplyScalar(0.43 + row * 0.08))
      .add(tangent.clone().multiplyScalar(rowOffset));
    plateCenter.y += 0.23 + row * 0.17;

    const plateGeometry = new THREE.ConeGeometry(
      0.38 - row * 0.045,
      0.16,
      5,
      1,
      false
    );
    const plate = new THREE.Mesh(
      plateGeometry,
      new THREE.MeshStandardMaterial({
        color: palette[(i + row + 1) % palette.length],
        roughness: 0.96,
        flatShading: true
      })
    );
    plate.position.copy(plateCenter);
    const plateNormal = radial.clone().multiplyScalar(0.9).add(new THREE.Vector3(0, 0.46 + row * 0.08, 0));
    orientAxis(plate, new THREE.Vector3(0, 1, 0), plateNormal);
    plate.scale.set(1, 0.72, 1);
    plate.castShadow = true;
    plate.receiveShadow = true;
    lizard.add(plate);

    if ((i + row) % 2 === 0) addEdgeLines(plate, 0x765236, 0.38);

    const foldStart = plateCenter.clone().add(tangent.clone().multiplyScalar(-0.25));
    const foldEnd = plateCenter.clone().add(tangent.clone().multiplyScalar(0.25));
    foldStart.add(radial.clone().multiplyScalar(0.22));
    foldEnd.add(radial.clone().multiplyScalar(0.22));
    foldStart.y += 0.08;
    foldEnd.y += 0.08;
    makeFoldLine(foldStart, foldEnd, 0x8a6743, 0.28);

    if (row > 0 && i % 2 === row % 2) {
      const spikePosition = plateCenter.clone()
        .add(radial.clone().multiplyScalar(0.16))
        .add(new THREE.Vector3(0, 0.12, 0));
      const spike = new THREE.Mesh(
        new THREE.ConeGeometry(0.13 + row * 0.025, 0.52 + row * 0.08, 4),
        new THREE.MeshStandardMaterial({
          color: palette[(i + row + 2) % palette.length],
          roughness: 0.93,
          flatShading: true
        })
      );
      spike.position.copy(spikePosition);
      const spikeNormal = radial.clone().multiplyScalar(0.92).add(new THREE.Vector3(0, 0.42, 0));
      orientAxis(spike, new THREE.Vector3(0, 1, 0), spikeNormal);
      spike.castShadow = true;
      lizard.add(spike);
      addEdgeLines(spike, 0x68442d, 0.4);
    }
  }
}

const headAngle = 0.08;
const headRadial = new THREE.Vector3(Math.cos(headAngle), 0, Math.sin(headAngle));
const headTangent = new THREE.Vector3(-Math.sin(headAngle), 0, Math.cos(headAngle));
const headPosition = headRadial.clone().multiplyScalar(ringRadius + 0.05);
headPosition.y = 0.82;

const head = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.72, 1),
  new THREE.MeshStandardMaterial({
    color: 0xb57442,
    roughness: 0.9,
    flatShading: true
  })
);
head.position.copy(headPosition);
head.scale.set(0.92, 0.72, 1.14);
orientAxis(head, new THREE.Vector3(0, 0, 1), headTangent);
head.castShadow = true;
head.receiveShadow = true;
lizard.add(head);
addEdgeLines(head, 0x69472e, 0.4);

const snoutPosition = headPosition.clone()
  .add(headTangent.clone().multiplyScalar(0.47))
  .add(new THREE.Vector3(0, -0.06, 0));
const snout = new THREE.Mesh(
  new THREE.ConeGeometry(0.35, 0.66, 5),
  new THREE.MeshStandardMaterial({
    color: 0xd0a56b,
    roughness: 0.94,
    flatShading: true
  })
);
snout.position.copy(snoutPosition);
orientAxis(snout, new THREE.Vector3(0, 1, 0), headTangent);
snout.rotation.z = Math.PI * 0.5;
snout.scale.set(1, 0.8, 0.72);
snout.castShadow = true;
lizard.add(snout);
addEdgeLines(snout, 0x765035, 0.38);

const eyeSide = new THREE.Vector3(0, 0.22, 0);
const eyeForward = headTangent.clone().multiplyScalar(0.28);
const eyeRadial = headRadial.clone().multiplyScalar(0.43);

for (const side of [-1, 1]) {
  const eyePosition = headPosition.clone()
    .add(eyeForward)
    .add(eyeRadial)
    .add(eyeSide.clone().multiplyScalar(side));
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.105, 8, 6), eyeMaterial);
  eye.position.copy(eyePosition);
  eye.scale.set(1, 0.82, 0.72);
  eye.castShadow = true;
  lizard.add(eye);

  const glint = new THREE.Mesh(new THREE.SphereGeometry(0.027, 6, 4), eyeGlintMaterial);
  glint.position.copy(eyePosition).add(headTangent.clone().multiplyScalar(0.075)).add(new THREE.Vector3(0, 0.035, 0));
  lizard.add(glint);
}

const mouthStart = snoutPosition.clone()
  .add(headTangent.clone().multiplyScalar(0.25))
  .add(new THREE.Vector3(0, -0.12, 0));
const mouthEnd = mouthStart.clone().add(headTangent.clone().multiplyScalar(0.17));
makeFoldLine(mouthStart, mouthEnd, 0x4a2b20, 0.8);

const nose = new THREE.Mesh(
  new THREE.ConeGeometry(0.11, 0.12, 5),
  darkMaterial
);
nose.position.copy(snoutPosition).add(headTangent.clone().multiplyScalar(0.32));
orientAxis(nose, new THREE.Vector3(0, 1, 0), headTangent);
lizard.add(nose);

const ringShadow = new THREE.Mesh(
  new THREE.CircleGeometry(3.7, 64),
  new THREE.MeshBasicMaterial({ color: 0x80654a, transparent: true, opacity: 0.13 })
);
ringShadow.rotation.x = -Math.PI / 2;
ringShadow.position.y = 0.01;
ringShadow.scale.set(1, 0.72, 1);
scene.add(ringShadow);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({
    color: 0xc8b18a,
    roughness: 1,
    metalness: 0
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.04;
ground.receiveShadow = true;
scene.add(ground);

const backPlate = new THREE.Mesh(
  new THREE.RingGeometry(1.02, 1.18, 48),
  new THREE.MeshBasicMaterial({
    color: 0x987652,
    transparent: true,
    opacity: 0.1,
    side: THREE.DoubleSide
  })
);
backPlate.rotation.x = -Math.PI / 2;
backPlate.position.y = 0.035;
scene.add(backPlate);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
