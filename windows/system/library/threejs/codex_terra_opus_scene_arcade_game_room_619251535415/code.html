<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090316);
scene.fog = new THREE.FogExp2(0x090316, 0.027);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 120);
camera.position.set(13, 8.5, 16);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.45;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.1, -1.1);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.34;
controls.minDistance = 8;
controls.maxDistance = 29;
controls.maxPolarAngle = Math.PI * 0.47;

let seed = 918273;
function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a, b) {
  return a + (b - a) * rand();
}
function choose(values) {
  return values[Math.floor(rand() * values.length)];
}

const clock = new THREE.Clock();
const animatedMaterials = [];
const screenCanvases = [];
const cabinetLights = [];
const neonPulses = [];
const movingObjects = [];

const colors = {
  cyan: 0x00eaff,
  magenta: 0xff168f,
  orange: 0xff6b1a,
  violet: 0x8c43ff,
  yellow: 0xffdf42,
  dark: 0x090715,
  cabinet: 0x16172c,
  trim: 0x343862
};

const standard = (color, roughness = 0.55, metalness = 0.1) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness });

const emissive = (color, intensity = 1.5) =>
  new THREE.MeshStandardMaterial({
    color,
    emissive: color,
    emissiveIntensity: intensity,
    roughness: 0.35,
    metalness: 0.15
  });

const blackMetal = standard(0x080914, 0.28, 0.82);
const darkPlastic = standard(0x17182a, 0.45, 0.32);
const chrome = standard(0xb6c7d3, 0.16, 0.95);
const floorMat = standard(0x171022, 0.68, 0.12);

function mesh(geometry, material, x = 0, y = 0, z = 0) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(x, y, z);
  object.castShadow = true;
  object.receiveShadow = true;
  scene.add(object);
  return object;
}

function group() {
  const object = new THREE.Group();
  scene.add(object);
  return object;
}

function addBox(parent, width, height, depth, material, x, y, z) {
  const object = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
  object.position.set(x, y, z);
  object.castShadow = true;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}

function addCylinder(parent, radiusTop, radiusBottom, height, material, x, y, z, radial = 20) {
  const object = new THREE.Mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, radial),
    material
  );
  object.position.set(x, y, z);
  object.castShadow = true;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}

function canvasTexture(draw, width = 512, height = 256) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const context = canvas.getContext('2d');
  draw(context, width, height);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return { canvas, context, texture };
}

function createCarpetTexture() {
  return canvasTexture((ctx, w, h) => {
    ctx.fillStyle = '#170b2a';
    ctx.fillRect(0, 0, w, h);
    for (let y = 0; y < h; y += 44) {
      for (let x = 0; x < w; x += 44) {
        const c = choose(['#ff197f', '#00dff4', '#ff881a', '#8b42ff', '#ffe447']);
        ctx.strokeStyle = c;
        ctx.lineWidth = 5;
        ctx.globalAlpha = 0.75;
        ctx.beginPath();
        ctx.arc(x + 21, y + 21, 12 + ((x + y) % 17), 0, Math.PI * 1.5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + 6, y + 36);
        ctx.lineTo(x + 35, y + 8);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    }
    for (let i = 0; i < 130; i++) {
      ctx.fillStyle = choose(['#ff2396', '#00dffc', '#ff9b22', '#a962ff']);
      ctx.fillRect(rand() * w, rand() * h, 3, 3);
    }
  }, 768, 768);
}

function createWallTexture() {
  return canvasTexture((ctx, w, h) => {
    const gradient = ctx.createLinearGradient(0, 0, 0, h);
    gradient.addColorStop(0, '#10051e');
    gradient.addColorStop(0.55, '#230d34');
    gradient.addColorStop(1, '#090615');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 160; i++) {
      ctx.globalAlpha = 0.08;
      ctx.fillStyle = i % 2 ? '#ff2b9b' : '#00e6ff';
      ctx.fillRect(rand() * w, rand() * h, range(8, 40), 1);
    }
    ctx.globalAlpha = 1;
  }, 512, 512);
}

function createScreenTexture(index) {
  const data = canvasTexture((ctx, w, h) => {
    ctx.fillStyle = '#031520';
    ctx.fillRect(0, 0, w, h);
  }, 512, 384);
  screenCanvases.push({ ...data, index });
  return data.texture;
}

function createSignTexture(text, fg, bg = '#18072b') {
  return canvasTexture((ctx, w, h) => {
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = fg;
    ctx.lineWidth = 12;
    ctx.strokeRect(12, 12, w - 24, h - 24);
    ctx.fillStyle = fg;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 62px Arial Black,Arial,sans-serif';
    ctx.shadowColor = fg;
    ctx.shadowBlur = 18;
    ctx.fillText(text, w / 2, h / 2 + 3);
  }, 512, 150);
}

function createNeonTube(parent, length, color, x, y, z, rotation = 0) {
  const tube = new THREE.Mesh(
    new THREE.CylinderGeometry(0.037, 0.037, length, 12),
    emissive(color, 3.2)
  );
  tube.rotation.z = rotation;
  tube.position.set(x, y, z);
  tube.castShadow = false;
  parent.add(tube);
  neonPulses.push({ material: tube.material, phase: rand() * Math.PI * 2, base: 2.3 });
  return tube;
}

function createWallSign(text, x, y, z, color, width = 4.2) {
  const sign = group();
  sign.position.set(x, y, z);
  const texture = createSignTexture(text, '#' + color.toString(16).padStart(6, '0'));
  const signMat = new THREE.MeshStandardMaterial({
    map: texture.texture,
    emissive: color,
    emissiveIntensity: 1.5,
    roughness: 0.42,
    metalness: 0.2
  });
  const panel = new THREE.Mesh(new THREE.BoxGeometry(width, 1.23, 0.13), signMat);
  panel.castShadow = true;
  sign.add(panel);
  createNeonTube(sign, width + 0.12, color, 0, 0.69, 0.09, Math.PI / 2);
  createNeonTube(sign, width + 0.12, color, 0, -0.69, 0.09, Math.PI / 2);
  return sign;
}

const carpetData = createCarpetTexture();
carpetData.texture.wrapS = THREE.RepeatWrapping;
carpetData.texture.wrapT = THREE.RepeatWrapping;
carpetData.texture.repeat.set(3.7, 3.7);
const carpet = mesh(
  new THREE.PlaneGeometry(27, 23),
  new THREE.MeshStandardMaterial({
    map: carpetData.texture,
    roughness: 0.8,
    metalness: 0.03
  }),
  0, 0.01, -0.6
);
carpet.rotation.x = -Math.PI / 2;

const wallData = createWallTexture();
const backWall = mesh(
  new THREE.PlaneGeometry(27, 9),
  new THREE.MeshStandardMaterial({ map: wallData.texture, roughness: 0.8 }),
  0, 4.5, -10
);
const sideWall = mesh(
  new THREE.PlaneGeometry(23, 9),
  new THREE.MeshStandardMaterial({ map: wallData.texture, roughness: 0.8 }),
  -13.5, 4.5, 0.7
);
sideWall.rotation.y = Math.PI / 2;

const ceiling = mesh(new THREE.BoxGeometry(27, 0.18, 23), blackMetal, 0, 8.95, -0.6);
ceiling.receiveShadow = true;

const baseboardMat = emissive(colors.violet, 1.6);
mesh(new THREE.BoxGeometry(26.5, 0.15, 0.12), baseboardMat, 0, 0.18, -9.88);
mesh(new THREE.BoxGeometry(0.12, 0.15, 22.2), baseboardMat, -13.35, 0.18, 0.8);

const ambient = new THREE.HemisphereLight(0x3c1a71, 0x160819, 1.1);
scene.add(ambient);

const moonLight = new THREE.DirectionalLight(0x9d83ff, 1.4);
moonLight.position.set(-5, 10, 4);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.left = -14;
moonLight.shadow.camera.right = 14;
moonLight.shadow.camera.top = 14;
moonLight.shadow.camera.bottom = -14;
scene.add(moonLight);

function pointLight(color, intensity, distance, x, y, z) {
  const light = new THREE.PointLight(color, intensity, distance, 2);
  light.position.set(x, y, z);
  light.castShadow = true;
  light.shadow.mapSize.set(512, 512);
  scene.add(light);
  return light;
}

const pinkFill = pointLight(colors.magenta, 42, 11, -8, 5.5, -4);
const cyanFill = pointLight(colors.cyan, 40, 12, 7, 4.6, -5);
const orangeFill = pointLight(colors.orange, 25, 9, 2, 3.2, 3);

createWallSign('NEON  ARCADE', 0, 6.5, -9.78, colors.magenta, 6.2);
createWallSign('HIGH SCORE', -9.2, 5.4, -9.77, colors.cyan, 3.5);
createWallSign('TOKENS', 9.4, 5.2, -9.77, colors.orange, 3.1);

const wallNeon = group();
createNeonTube(wallNeon, 5.2, colors.cyan, -6.5, 7.1, -9.66, Math.PI / 2);
createNeonTube(wallNeon, 5.2, colors.magenta, 6.5, 7.1, -9.66, Math.PI / 2);
createNeonTube(wallNeon, 5.9, colors.orange, -13.18, 5.8, -3, 0);

function makeCabinet(name, x, z, angle, color, screenIndex) {
  const cabinet = group();
  cabinet.position.set(x, 0, z);
  cabinet.rotation.y = angle;

  const body = addBox(cabinet, 1.55, 2.65, 1.42, darkPlastic, 0, 1.42, 0);
  body.geometry.translate(0, 0, 0);
  addBox(cabinet, 1.68, 0.22, 1.55, blackMetal, 0, 0.16, 0);
  addBox(cabinet, 1.67, 0.18, 1.54, blackMetal, 0, 2.76, 0);
  addBox(cabinet, 1.68, 0.75, 1.52, standard(0x101126, 0.35, 0.4), 0, 2.35, 0.02);
  addBox(cabinet, 1.48, 1.05, 0.08, blackMetal, 0, 1.88, -0.73);

  const texture = createScreenTexture(screenIndex);
  const screenMaterial = new THREE.MeshStandardMaterial({
    map: texture,
    emissive: color,
    emissiveIntensity: 1.15,
    roughness: 0.2,
    metalness: 0.1
  });
  animatedMaterials.push({ material: screenMaterial, phase: screenIndex * 0.7, base: 1.1 });
  const screen = addBox(cabinet, 1.23, 0.76, 0.04, screenMaterial, 0, 2.0, -0.79);
  screen.castShadow = false;

  const marqueeTexture = createSignTexture(name, '#' + color.toString(16).padStart(6, '0'), '#10122a');
  const marqueeMaterial = new THREE.MeshStandardMaterial({
    map: marqueeTexture.texture,
    emissive: color,
    emissiveIntensity: 1.1,
    roughness: 0.4
  });
  addBox(cabinet, 1.36, 0.36, 0.06, marqueeMaterial, 0, 2.58, -0.77);

  const controlDeck = addBox(cabinet, 1.52, 0.14, 0.55, standard(0x242746, 0.35, 0.4), 0, 1.32, -0.45);
  controlDeck.rotation.x = -0.18;
  const buttonMat = emissive(color, 2.3);
  for (let i = 0; i < 3; i++) {
    const button = addCylinder(cabinet, 0.075, 0.075, 0.052, buttonMat, -0.42 + i * 0.24, 1.41, -0.72, 16);
    button.rotation.x = Math.PI / 2;
  }
  const stick = addCylinder(cabinet, 0.042, 0.042, 0.18, chrome, 0.35, 1.49, -0.67, 12);
  addCylinder(cabinet, 0.11, 0.11, 0.07, emissive(colors.yellow, 2), 0.35, 1.6, -0.67, 16);

  const sideStripe = addBox(cabinet, 0.08, 2.43, 1.48, emissive(color, 1.3), -0.8, 1.48, 0);
  sideStripe.castShadow = false;
  const coin = addCylinder(cabinet, 0.09, 0.09, 0.04, emissive(colors.orange, 2), 0.48, 0.76, -0.74, 18);
  coin.rotation.x = Math.PI / 2;
  addBox(cabinet, 0.42, 0.16, 0.05, blackMetal, 0.48, 0.55, -0.74);

  const light = new THREE.PointLight(color, 4.4, 4.5, 2);
  light.position.set(0, 2.0, -1.12);
  cabinet.add(light);
  cabinetLights.push({ light, phase: screenIndex * 0.9 });

  return cabinet;
}

const cabinetData = [
  ['GALAXY', -9.6, -6.85, 0.05, colors.cyan, 0],
  ['RACER', -7.7, -6.88, 0.05, colors.magenta, 1],
  ['VOID', -5.8, -6.9, 0.05, colors.orange, 2],
  ['PIXEL', 5.55, -6.9, -0.05, colors.violet, 3],
  ['LASER', 7.45, -6.88, -0.05, colors.cyan, 4],
  ['BLAZE', 9.35, -6.85, -0.05, colors.magenta, 5],
  ['FROG', -11.5, -2.4, Math.PI / 2, colors.yellow, 6],
  ['ORBIT', -11.5, 0.1, Math.PI / 2, colors.cyan, 7]
];

for (const item of cabinetData) {
  makeCabinet(...item);
}

function makeAirHockey() {
  const table = group();
  table.position.set(0.2, 0, -0.85);

  const legPositions = [
    [-2.35, -1.2],
    [2.35, -1.2],
    [-2.35, 1.2],
    [2.35, 1.2]
  ];

  addBox(table, 5.2, 0.24, 2.9, blackMetal, 0, 1.16, 0);
  addBox(table, 4.75, 0.1, 2.45, standard(0xb1eff4, 0.2, 0.42), 0, 1.31, 0);
  addBox(table, 5.12, 0.18, 0.17, emissive(colors.cyan, 2.4), 0, 1.42, -1.37);
  addBox(table, 5.12, 0.18, 0.17, emissive(colors.magenta, 2.4), 0, 1.42, 1.37);
  addBox(table, 0.17, 0.18, 2.66, emissive(colors.orange, 2.2), -2.47, 1.42, 0);
  addBox(table, 0.17, 0.18, 2.66, emissive(colors.orange, 2.2), 2.47, 1.42, 0);

  for (const [x, z] of legPositions) {
    const leg = addCylinder(table, 0.14, 0.2, 1.16, chrome, x, 0.58, z);
    leg.rotation.z = x > 0 ? -0.08 : 0.08;
  }

  const centerLine = addBox(table, 0.06, 0.025, 2.33, emissive(colors.magenta, 1.7), 0, 1.38, 0);
  centerLine.castShadow = false;
  const centerRing = new THREE.Mesh(
    new THREE.TorusGeometry(0.33, 0.035, 8, 28),
    emissive(colors.cyan, 2)
  );
  centerRing.rotation.x = Math.PI / 2;
  centerRing.position.set(0, 1.39, 0);
  table.add(centerRing);

  for (const z of [-0.87, 0.87]) {
    const goal = addBox(table, 1.05, 0.05, 0.1, blackMetal, 0, 1.39, z);
    goal.castShadow = false;
  }

  const puck = new THREE.Mesh(
    new THREE.CylinderGeometry(0.13, 0.13, 0.06, 20),
    emissive(colors.magenta, 2.5)
  );
  puck.position.set(0.35, 1.43, 0.14);
  puck.castShadow = true;
  table.add(puck);

  const strikerA = new THREE.Mesh(
    new THREE.CylinderGeometry(0.21, 0.21, 0.11, 20),
    emissive(colors.cyan, 2)
  );
  strikerA.position.set(-0.85, 1.45, -0.55);
  table.add(strikerA);

  const strikerB = new THREE.Mesh(
    new THREE.CylinderGeometry(0.21, 0.21, 0.11, 20),
    emissive(colors.orange, 2)
  );
  strikerB.position.set(0.85, 1.45, 0.55);
  table.add(strikerB);

  movingObjects.push({ table, puck, strikerA, strikerB });
  return table;
}

makeAirHockey();

function makePlush(parent, x, y, z, color, scale) {
  const plush = new THREE.Group();
  plush.position.set(x, y, z);
  plush.scale.setScalar(scale);
  parent.add(plush);

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 12), standard(color, 0.75, 0));
  body.position.y = 0.23;
  body.castShadow = true;
  plush.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.19, 16, 12), standard(color, 0.7, 0));
  head.position.y = 0.5;
  head.castShadow = true;
  plush.add(head);

  const earA = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 10), standard(color, 0.72, 0));
  earA.position.set(-0.11, 0.66, 0);
  plush.add(earA);

  const earB = earA.clone();
  earB.position.x = 0.11;
  plush.add(earB);

  const eyeMaterial = emissive(0xffffff, 0.5);
  const eyeA = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 8), eyeMaterial);
  eyeA.position.set(-0.06, 0.53, -0.17);
  plush.add(eyeA);

  const eyeB = eyeA.clone();
  eyeB.position.x = 0.06;
  plush.add(eyeB);
}

function makeClawMachine() {
  const claw = group();
  claw.position.set(8.9, 0, 1.9);

  addBox(claw, 2.3, 0.27, 2.1, blackMetal, 0, 0.15, 0);
  addBox(claw, 2.15, 0.72, 1.94, standard(0x4c1d55, 0.43, 0.22), 0, 0.55, 0);
  addBox(claw, 2.3, 0.33, 2.1, emissive(colors.magenta, 1.6), 0, 3.92, 0);
  addBox(claw, 2.43, 0.18, 2.22, blackMetal, 0, 4.12, 0);

  const glassMaterial = new THREE.MeshPhysicalMaterial({
    color: 0x5bcfe5,
    roughness: 0.08,
    metalness: 0,
    transparent: true,
    opacity: 0.22,
    side: THREE.DoubleSide
  });

  addBox(claw, 2.04, 3.05, 0.04, glassMaterial, 0, 2.36, -0.97);
  addBox(claw, 2.04, 3.05, 0.04, glassMaterial, 0, 2.36, 0.97);
  addBox(claw, 0.04, 3.05, 1.9, glassMaterial, -1.02, 2.36, 0);
  addBox(claw, 0.04, 3.05, 1.9, glassMaterial, 1.02, 2.36, 0);

  addBox(claw, 1.8, 0.11, 1.55, emissive(colors.cyan, 0.6), 0, 1.02, 0);
  addBox(claw, 0.5, 0.62, 0.08, blackMetal, 0.55, 0.75, -1.1);
  addCylinder(claw, 0.09, 0.09, 0.05, emissive(colors.orange, 2), 0.55, 0.99, -1.15, 16);

  const headerTexture = createSignTexture('GRAB  A  PAL', '#ffdf42', '#3c114e');
  const headerMaterial = new THREE.MeshStandardMaterial({
    map: headerTexture.texture,
    emissive: colors.yellow,
    emissiveIntensity: 1.15
  });
  addBox(claw, 2.12, 0.5, 0.08, headerMaterial, 0, 3.72, -1.05);

  const plushColors = [0xff438e, 0x23d8ff, 0xffaa26, 0x9b6cff, 0x7dff97, 0xffe157];
  for (let i = 0; i < 18; i++) {
    makePlush(
      claw,
      range(-0.72, 0.72),
      range(1.05, 1.45),
      range(-0.62, 0.62),
      choose(plushColors),
      range(0.72, 1.12)
    );
  }

  const rail = addBox(claw, 1.5, 0.06, 0.06, chrome, 0, 3.33, 0);
  rail.castShadow = false;
  const cable = new THREE.Mesh(
    new THREE.CylinderGeometry(0.012, 0.012, 1.15, 8),
    chrome
  );
  cable.position.set(0, 2.78, 0);
  claw.add(cable);

  const clawHead = new THREE.Group();
  clawHead.position.set(0, 2.2, 0);
  claw.add(clawHead);
  addCylinder(clawHead, 0.12, 0.12, 0.16, chrome, 0, 0, 0, 16);

  for (let i = 0; i < 3; i++) {
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.42, 0.06), chrome);
    arm.position.set(0, -0.27, 0);
    arm.rotation.z = (i / 3) * Math.PI * 2;
    arm.rotation.x = 0.7;
    clawHead.add(arm);
  }

  const light = new THREE.PointLight(colors.magenta, 9, 5, 2);
  light.position.set(0, 2.9, -1.6);
  claw.add(light);
  movingObjects.push({ clawHead, cable });
  return claw;
}

makeClawMachine();

function makeChangeMachine() {
  const changer = group();
  changer.position.set(-8.9, 0, 2.2);

  addBox(changer, 1.45, 3.1, 0.86, standard(0x596773, 0.34, 0.65), 0, 1.55, 0);
  addBox(changer, 1.55, 0.18, 0.96, blackMetal, 0, 0.1, 0);
  addBox(changer, 1.34, 0.44, 0.06, emissive(colors.orange, 1.5), 0, 2.78, -0.47);

  const title = createSignTexture('CHANGE', '#00eaff', '#142433');
  const titleMat = new THREE.MeshStandardMaterial({
    map: title.texture,
    emissive: colors.cyan,
    emissiveIntensity: 1.05
  });
  addBox(changer, 1.14, 0.29, 0.035, titleMat, 0, 2.82, -0.5);

  addBox(changer, 0.82, 0.47, 0.06, blackMetal, 0, 2.22, -0.48);
  addBox(changer, 0.68, 0.07, 0.06, chrome, 0, 2.24, -0.52);
  addBox(changer, 0.48, 0.24, 0.11, blackMetal, 0, 1.62, -0.49);

  for (let i = 0; i < 3; i++) {
    const coin = addCylinder(changer, 0.105, 0.105, 0.045, emissive(colors.yellow, 2.2), -0.28 + i * 0.28, 1.85, -0.54, 16);
    coin.rotation.x = Math.PI / 2;
  }

  const lamp = new THREE.PointLight(colors.cyan, 5, 4, 2);
  lamp.position.set(0, 2.4, -0.9);
  changer.add(lamp);
  return changer;
}

makeChangeMachine();

  addBox(soda, 1.06, 0.12, 0.08, emissive(colors.cyan, 1.9), 0, 2.76, -0.52);

  const logo = createSignTexture('FIZZ!', '#ffdf42', '#a30742');
  const logoMat = new THREE.MeshStandardMaterial({
    map: logo.texture,
    emissive: colors.yellow,
    emissiveIntensity: 1.2
  });
  addBox(soda, 1.12, 0.4, 0.03, logoMat, 0, 2.91, -0.48);

  for (let y = 0; y < 3; y++) {
    for (let x = 0; x < 3; x++) {
      addBox(soda, 0.25, 0.18, 0.03, emissive(choose([colors.cyan, colors.orange, colors.magenta]), 1.2), -0.35 + x * 0.35, 2.37 - y * 0.35, -0.51);

  addBox(soda, 0.88, 0.28, 0.08, blackMetal, 0, 0.7, -0.48);

makeSodaMachine();

  for (const [x, z, color] of stoolPositions) {

makeStools();

const bar = group();
bar.position.set(0.3, 0, 5.65);
addBox(bar, 6.7, 1.12, 0.72, standard(0x2d1742, 0.38, 0.22), 0, 0.64, 0);
addBox(bar, 6.95, 0.16, 0.95, blackMetal, 0, 1.22, 0);
addBox(bar, 6.55, 0.14, 0.1, emissive(colors.magenta, 2), 0, 0.78, -0.42);
for (let i = 0; i < 9; i++) {
  const bottle = addCylinder(bar, 0.08, 0.1, range(0.27, 0.43), emissive(choose([colors.cyan, colors.orange, colors.violet]), 1), -2.65 + i * 0.66, 1.52, 0);
  bottle.castShadow = true;

function makeMirrorBall() {
  const assembly = group();
  assembly.position.set(0, 7.45, -0.8);

  const chain = new THREE.Mesh(
    new THREE.CylinderGeometry(0.025, 0.025, 1.2, 8),
    chrome
  );
  chain.position.y = 0.65;
  assembly.add(chain);

  const ballGeometry = new THREE.SphereGeometry(0.72, 28, 20);
  const ballMaterial = new THREE.MeshStandardMaterial({
    color: 0xddeeff,
    roughness: 0.12,
    metalness: 0.95
  });
  const mirrorBall = new THREE.Mesh(ballGeometry, ballMaterial);
  mirrorBall.castShadow = true;
  mirrorBall.receiveShadow = true;
  assembly.add(mirrorBall);

  const tileMaterial = emissive(0x8cc7e8, 0.7);
  for (let lat = -2; lat <= 2; lat++) {
    for (let lon = 0; lon < 12; lon++) {
      const tile = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.07, 0.025), tileMaterial);
      const phi = (lat / 3.3) * Math.PI * 0.5;
      const theta = (lon / 12) * Math.PI * 2 + (lat % 2) * 0.16;
      tile.position.set(
        Math.cos(phi) * Math.cos(theta) * 0.72,
        Math.sin(phi) * 0.72,
        Math.cos(phi) * Math.sin(theta) * 0.72
      );
      tile.lookAt(tile.position.clone().multiplyScalar(2));
      assembly.add(tile);
    }
  }

  const ballLightA = new THREE.PointLight(colors.cyan, 18, 10, 2);
  ballLightA.position.set(0, -0.2, 0);
  assembly.add(ballLightA);

  const ballLightB = new THREE.PointLight(colors.magenta, 14, 8, 2);
  ballLightB.position.set(0.2, 0.2, 0.1);
  assembly.add(ballLightB);

  movingObjects.push({ mirrorBall, assembly });
}

makeMirrorBall();

const ceilingStrips = group();
for (const x of [-8, -4, 4, 8]) {
  createNeonTube(ceilingStrips, 5.5, x < 0 ? colors.magenta : colors.cyan, x, 8.7, -0.8, 0);

for (const z of [-6.3, 5.2]) {

const floatingDust = new THREE.BufferGeometry();
const dustPositions = [];
for (let i = 0; i < 210; i++) {
  dustPositions.push(range(-12, 12), range(0.35, 8.1), range(-9.3, 8));
}
floatingDust.setAttribute('position', new THREE.Float32BufferAttribute(dustPositions, 3));
const dustMaterial = new THREE.PointsMaterial({
  color: 0x9ddbff,
  size: 0.026,
  transparent: true,
  opacity: 0.62,
  depthWrite: false
});
const dust = new THREE.Points(floatingDust, dustMaterial);
scene.add(dust);

function drawScreen(item, time) {
  const { context: ctx, canvas, index } = item;
  const w = canvas.width;
  const h = canvas.height;
  const hue = [185, 322, 25, 270, 195, 330, 50, 175][index % 8];
  const pulse = Math.sin(time * 2.4 + index) * 0.5 + 0.5;

  ctx.fillStyle = '#04101b';
  ctx.fillRect(0, 0, w, h);

  const glow = ctx.createRadialGradient(w * 0.5, h * 0.48, 5, w * 0.5, h * 0.48, w * 0.65);
  glow.addColorStop(0, `hsla(${hue},100%,58%,0.8)`);
  glow.addColorStop(0.5, `hsla(${hue},96%,24%,0.3)`);
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = `hsla(${hue},100%,62%,0.86)`;
  ctx.shadowColor = `hsl(${hue},100%,55%)`;
  ctx.shadowBlur = 14;
  ctx.lineWidth = 5;

  if (index % 3 === 0) {
    ctx.beginPath();
    ctx.arc(w * 0.5, h * 0.52, 69 + pulse * 13, 0, Math.PI * 2);
    ctx.stroke();
    for (let i = 0; i < 8; i++) {
      const a = time * 1.7 + i * Math.PI / 4;
      ctx.fillStyle = i % 2 ? '#ffdf42' : '#ffffff';
      ctx.beginPath();
      ctx.arc(w * 0.5 + Math.cos(a) * 115, h * 0.52 + Math.sin(a) * 76, 8, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (index % 3 === 1) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const px = 45 + i * 46;
      const py = h * 0.72 - Math.sin(time * 2.1 + i * 0.8) * 55;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 38px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('INSERT COIN', w / 2, 65);
  } else {
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.rotate(time * 0.7);
    for (let i = 0; i < 6; i++) {
      ctx.strokeStyle = `hsla(${(hue + i * 25) % 360},100%,60%,0.9)`;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(i * Math.PI / 3) * 170, Math.sin(i * Math.PI / 3) * 120);
      ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('LEVEL ' + (index + 1), w / 2, h * 0.57);
  }

  ctx.shadowBlur = 0;
  ctx.globalAlpha = 0.18;
  for (let y = 0; y < h; y += 7) {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, y, w, 2);
  }
  ctx.globalAlpha = 1;
  item.texture.needsUpdate = true;
}

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  for (const screen of screenCanvases) {
    drawScreen(screen, time);
  }

  for (const item of animatedMaterials) {
    item.material.emissiveIntensity = item.base + Math.sin(time * 3.2 + item.phase) * 0.23;
  }

  for (const item of cabinetLights) {
    item.light.intensity = 3.7 + Math.sin(time * 2.3 + item.phase) * 1.1;
  }

  for (const item of neonPulses) {
    item.material.emissiveIntensity = item.base + Math.sin(time * 2.1 + item.phase) * 0.7;
  }

  for (const object of movingObjects) {
    if (object.mirrorBall) {
      object.mirrorBall.rotation.y += 0.009;
      object.mirrorBall.rotation.x += 0.003;
      object.assembly.rotation.y = Math.sin(time * 0.4) * 0.22;
    }
    if (object.puck) {
      object.puck.position.x = Math.sin(time * 1.7) * 1.55;
      object.puck.position.z = Math.sin(time * 2.6) * 0.68;
      object.strikerA.position.x = -0.75 + Math.sin(time * 1.1) * 0.35;
      object.strikerB.position.x = 0.75 + Math.cos(time * 1.2) * 0.35;
    }
    if (object.clawHead) {
      object.clawHead.position.x = Math.sin(time * 0.75) * 0.55;
      object.clawHead.position.z = Math.cos(time * 0.58) * 0.38;
      object.clawHead.rotation.y = time * 0.8;
      object.cable.scale.y = 0.88 + Math.sin(time * 1.15) * 0.12;
    }
  }

  dust.rotation.y = time * 0.007;
  dust.position.y = Math.sin(time * 0.25) * 0.08;
  pinkFill.intensity = 36 + Math.sin(time * 1.7) * 8;
  cyanFill.intensity = 35 + Math.sin(time * 1.3 + 1) * 8;
  orangeFill.intensity = 21 + Math.sin(time * 2.1 + 2) * 5;

  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

animate();
</script>
