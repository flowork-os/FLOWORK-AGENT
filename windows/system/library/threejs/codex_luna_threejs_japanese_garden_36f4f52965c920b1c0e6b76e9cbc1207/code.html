<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miniature Japanese Garden</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #b8c8ba; }
canvas { display: block; width: 100%; height: 100%; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8c8ba);
scene.fog = new THREE.Fog(0xb8c8ba, 17, 30);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(11, 9, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
controls.target.set(0, 0.45, 0);

const palette = {
  soil: 0x82735b,
  soilDark: 0x554b3d,
  sand: 0xc9b994,
  stone: 0x888c82,
  stoneLight: 0xa8aa9b,
  stoneDark: 0x555d55,
  moss: 0x4f684d,
  mossLight: 0x718b5d,
  water: 0x3f827d,
  waterGlow: 0x75b6a8,
  wood: 0x554b35,
  leaf: 0x385b3d,
  leafLight: 0x6d8c55,
  blossom: 0xb9c9a6
};

function material(color, roughness = 0.8, metalness = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness });
}

const mats = {
  soil: material(palette.soil),
  soilDark: material(palette.soilDark),
  sand: material(palette.sand),
  stone: material(palette.stone),
  stoneLight: material(palette.stoneLight),
  stoneDark: material(palette.stoneDark),
  moss: material(palette.moss),
  mossLight: material(palette.mossLight),
  water: new THREE.MeshPhysicalMaterial({
    color: palette.water,
    roughness: 0.12,
    metalness: 0.08,
    transmission: 0.12,
    transparent: true,
    opacity: 0.86
  }),
  wood: material(palette.wood),
  leaf: material(palette.leaf),
  leafLight: material(palette.leafLight),
  blossom: material(palette.blossom)
};

function mesh(geometry, mat, position = [0, 0, 0], scale = [1, 1, 1]) {
  const object = new THREE.Mesh(geometry, mat);
  object.position.set(position[0], position[1], position[2]);
  object.scale.set(scale[0], scale[1], scale[2]);
  object.castShadow = true;
  object.receiveShadow = true;
  scene.add(object);
  return object;
}

const base = mesh(new THREE.BoxGeometry(15, 0.6, 11), mats.soilDark, [0, -0.3, 0]);
const garden = mesh(new THREE.BoxGeometry(13.8, 0.42, 9.8), mats.sand, [0, 0.15, 0]);

const borderGeometry = new THREE.BoxGeometry(0.28, 0.65, 10.2);
mesh(borderGeometry, mats.wood, [-7.0, 0.2, 0]);
mesh(borderGeometry, mats.wood, [7.0, 0.2, 0]);
const borderCross = new THREE.BoxGeometry(13.8, 0.65, 0.28);
mesh(borderCross, mats.wood, [0, 0.2, -5.0]);
mesh(borderCross, mats.wood, [0, 0.2, 5.0]);

const basin = mesh(new THREE.BoxGeometry(5.45, 0.34, 3.45), mats.soilDark, [-0.25, 0.23, -0.45]);
const water = mesh(new THREE.BoxGeometry(5.05, 0.055, 3.02), mats.water, [-0.25, 0.43, -0.45]);
water.receiveShadow = true;

const copingLong = new THREE.BoxGeometry(5.65, 0.25, 0.3);
const copingShort = new THREE.BoxGeometry(0.3, 0.25, 3.35);
mesh(copingLong, mats.stoneLight, [-0.25, 0.56, -2.05]);
mesh(copingLong, mats.stoneLight, [-0.25, 0.56, 1.15]);
mesh(copingShort, mats.stone, [-2.93, 0.56, -0.45]);
mesh(copingShort, mats.stone, [2.43, 0.56, -0.45]);

const rippleMaterial = new THREE.MeshBasicMaterial({
  color: palette.waterGlow,
  transparent: true,
  opacity: 0.42,
  side: THREE.DoubleSide
});
for (const ripple of [
  [0.3, 0.475, -0.65, 0.72, 0.17],
  [-1.25, 0.478, -0.05, 0.48, 0.12],
  [1.25, 0.477, -1.12, 0.55, 0.13],
  [-0.25, 0.479, 0.52, 0.34, 0.09]
]) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(ripple[4], ripple[3], 48), rippleMaterial);
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(ripple[0], ripple[1], ripple[2]);
  scene.add(ring);
}

function steppingStone(x, z, sx, sz, rotation) {
  const stone = mesh(new THREE.CylinderGeometry(0.38, 0.46, 0.15, 8), mats.stone, [x, 0.43, z], [sx, 1, sz]);
  stone.rotation.y = rotation;
  const cap = mesh(new THREE.CylinderGeometry(0.29, 0.34, 0.025, 8), mats.stoneLight, [x - 0.02, 0.515, z - 0.02], [sx, 1, sz]);
  cap.rotation.y = rotation;
}
steppingStone(4.95, 3.95, 1.1, 0.82, 0.2);
steppingStone(4.05, 3.05, 0.92, 1.08, -0.2);
steppingStone(3.05, 2.35, 1.08, 0.82, 0.08);
steppingStone(2.3, 1.5, 0.85, 1.05, -0.15);
steppingStone(1.55, 0.72, 1.02, 0.8, 0.18);
steppingStone(1.08, -0.12, 0.8, 1.0, -0.1);

function mound(x, z, sx, sz, y = 0.55) {
  mesh(new THREE.SphereGeometry(1, 24, 16), mats.moss, [x, y, z], [sx, 0.55, sz]);
  mesh(new THREE.SphereGeometry(0.82, 20, 14), mats.mossLight, [x - sx * 0.18, y + 0.18, z - sz * 0.18], [sx * 0.47, 0.12, sz * 0.35]);
}
mound(-4.95, 2.8, 1.48, 1.02, 0.56);
mound(-4.25, -1.15, 1.22, 0.9, 0.54);
mound(4.9, -2.15, 1.38, 1.02, 0.56);
mound(3.85, -3.72, 0.92, 0.72, 0.48);

function rock(x, y, z, sx, sy, sz, rot) {
  const item = mesh(new THREE.DodecahedronGeometry(0.5, 1), mats.stoneDark, [x, y, z], [sx, sy, sz]);
  item.rotation.set(rot * 0.4, rot, rot * 0.2);
}
rock(-3.15, 0.58, 1.7, 0.62, 0.7, 0.44, 0.4);
rock(-3.55, 0.43, 1.98, 0.42, 0.55, 0.35, -0.3);
rock(2.75, 0.51, -1.85, 0.65, 0.8, 0.43, 0.7);
rock(3.35, 0.43, -1.92, 0.38, 0.55, 0.29, -0.5);

function lantern() {
  const x = -4.45;
  const z = -3.0;
  mesh(new THREE.CylinderGeometry(0.68, 0.76, 0.18, 6), mats.stoneDark, [x, 0.55, z]);
  mesh(new THREE.CylinderGeometry(0.42, 0.5, 0.75, 6), mats.stone, [x, 1.0, z]);
  mesh(new THREE.BoxGeometry(0.9, 0.38, 0.9), mats.stoneLight, [x, 1.47, z]);
  mesh(new THREE.BoxGeometry(0.42, 0.3, 0.42), mats.stoneDark, [x, 1.47, z]);
  const roof = mesh(new THREE.ConeGeometry(0.82, 0.38, 4), mats.stone, [x, 1.82, z]);
  roof.rotation.y = Math.PI / 4;
  mesh(new THREE.CylinderGeometry(0.12, 0.16, 0.26, 6), mats.stoneDark, [x, 2.12, z]);
}
lantern();

function shrub(x, z, height, spread) {
  mesh(new THREE.CylinderGeometry(0.045, 0.07, height, 7), mats.wood, [x, 0.5 + height / 2, z]);
  for (let i = 0; i < 4; i++) {
    const y = 0.85 + i * height * 0.18;
    const leaf = mesh(new THREE.SphereGeometry(0.42, 12, 8), i % 2 ? mats.leaf : mats.leafLight, [
      x + Math.sin(i * 2.1) * spread * 0.35, y, z + Math.cos(i * 1.7) * spread * 0.35
    ], [spread, 0.5, spread * 0.7]);
    leaf.rotation.y = i * 0.7;
  }
}
shrub(5.55, 0.95, 1.8, 0.65);
shrub(-5.6, -0.25, 1.45, 0.55);

for (const reed of [[1.55, -1.8, 1.25], [1.82, -1.72, 0.95], [2.08, -1.7, 1.35], [-1.85, -1.9, 0.9]]) {
  const stem = mesh(new THREE.CylinderGeometry(0.025, 0.035, reed[2], 6), mats.leaf, [reed[0], 0.52 + reed[2] / 2, reed[1]]);
  stem.rotation.z = (reed[0] % 2 - 0.5) * 0.18;
  mesh(new THREE.ConeGeometry(0.11, 0.34, 8), mats.blossom, [reed[0], 0.58 + reed[2], reed[1]]);
}

const hemi = new THREE.HemisphereLight(0xdce8d9, 0x514a3e, 2.2);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff1d4, 3.3);
sun.position.set(-7, 12, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -10;
sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10;
sun.shadow.camera.bottom = -10;
sun.shadow.bias = -0.0004;
scene.add(sun);

const fill = new THREE.PointLight(0x8fc7bd, 1.1, 12);
fill.position.set(1, 4, -5);
scene.add(fill);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  rippleMaterial.opacity = 0.32 + Math.sin(elapsed * 1.4) * 0.08;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
