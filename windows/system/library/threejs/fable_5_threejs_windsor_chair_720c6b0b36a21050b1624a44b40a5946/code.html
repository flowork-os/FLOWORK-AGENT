<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Windsor Chair</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1c1a17}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1c1a17);
scene.fog = new THREE.Fog(0x1c1a17, 8, 20);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(2.6, 2.0, 3.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

// ---------- lighting ----------
scene.add(new THREE.HemisphereLight(0xfff2e0, 0x3a2f26, 0.5));
const key = new THREE.DirectionalLight(0xffe6c4, 2.2);
key.position.set(4, 6, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -3;
key.shadow.camera.right = key.shadow.camera.top = 3;
key.shadow.bias = -0.0004;
key.shadow.radius = 6;
scene.add(key);
const fill = new THREE.DirectionalLight(0x9fb4d4, 0.5);
fill.position.set(-4, 3, -3);
scene.add(fill);
const rim = new THREE.PointLight(0xffd9a0, 0.6, 12);
rim.position.set(-2, 2.5, 3);
scene.add(rim);

// ---------- ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 64),
  new THREE.MeshStandardMaterial({ color: 0x2a2521, roughness: 0.95 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// soft radial contact shadow
const shTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(128,128,10,128,128,128);
  gr.addColorStop(0,'rgba(0,0,0,0.45)');
  gr.addColorStop(0.6,'rgba(0,0,0,0.18)');
  gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
})();
const soft = new THREE.Mesh(
  new THREE.PlaneGeometry(2.6, 2.6),
  new THREE.MeshBasicMaterial({ map: shTex, transparent: true, depthWrite: false })
);
soft.rotation.x = -Math.PI/2;
soft.position.y = 0.002;
scene.add(soft);

// ---------- wood materials (procedural grain) ----------
function woodTexture(base, streak, scale) {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,512,512);
  for (let i = 0; i < 130; i++) {
    const y = Math.random()*512, w = 0.5 + Math.random()*2.2;
    g.strokeStyle = streak;
    g.globalAlpha = 0.05 + Math.random()*0.12;
    g.lineWidth = w;
    g.beginPath();
    g.moveTo(0, y);
    for (let x = 0; x <= 512; x += 32)
      g.lineTo(x, y + Math.sin(x*0.02 + i)*3*scale + (Math.random()-0.5)*2);
    g.stroke();
  }
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const seatMat = new THREE.MeshStandardMaterial({
  map: woodTexture('#9a6134','#5e3a1c',1.5), color: 0xffffff,
  roughness: 0.55, metalness: 0.02
});
const turnMat = new THREE.MeshStandardMaterial({
  map: woodTexture('#8a5027','#4e2e14',0.6), color: 0xffffff,
  roughness: 0.5, metalness: 0.02
});
const bowMat = new THREE.MeshStandardMaterial({
  map: woodTexture('#7c4a24','#452a12',1.0), color: 0xffffff,
  roughness: 0.5, metalness: 0.02
});

const chair = new THREE.Group();
scene.add(chair);
function addMesh(geo, mat, parent = chair) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}

// ---------- saddle seat (contoured lathe-ish shape) ----------
const SEAT_Y = 0.85, SEAT_T = 0.085;
const seatShape = new THREE.Shape();
{
  // D-shaped plan: rounded front, flatter back
  const pts = [];
  const N = 48;
  for (let i = 0; i <= N; i++) {
    const a = (i/N)*Math.PI*2;
    let r = 0.46 + 0.06*Math.cos(a) - 0.05*Math.cos(2*a);
    pts.push(new THREE.Vector2(Math.sin(a)*r, Math.cos(a)*r*0.92));
  }
  seatShape.setFromPoints(pts);
}
const seatGeo = new THREE.ExtrudeGeometry(seatShape, {
  depth: SEAT_T, bevelEnabled: true, bevelThickness: 0.02,
  bevelSize: 0.02, bevelSegments: 4, curveSegments: 48, steps: 2
});
seatGeo.rotateX(-Math.PI/2);
// carve the saddle: dish the top surface
{
  const pos = seatGeo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    if (v.y > SEAT_T*0.5) {
      const d = Math.exp(-((v.x*v.x)/(0.16) + ((v.z-0.03)*(v.z-0.03))/(0.11)));
      v.y -= 0.045 * d * ((v.y - SEAT_T*0.5)/(SEAT_T*0.62));
      // pommel ridge at front-center
      v.y += 0.012 * Math.exp(-((v.x*v.x)/0.01 + ((v.z-0.36)*(v.z-0.36))/0.02));
      pos.setY(i, v.y);
    }
  }
  seatGeo.computeVertexNormals();
}
const seat = addMesh(seatGeo, seatMat);
seat.position.y = SEAT_Y - SEAT_T;

// ---------- turned leg profile (lathe) ----------
function turnedProfile(len, rBase) {
  // vase-and-ring turning profile from foot (0) to top (len)
  const p = [];
  const put = (t, r) => p.push(new THREE.Vector2(r*rBase, t*len));
  put(0.00, 0.55); put(0.03, 0.62); put(0.08, 0.72);   // foot taper
  put(0.16, 0.86); put(0.22, 1.00); put(0.28, 0.92);   // lower swell
  put(0.34, 0.66); put(0.37, 0.98); put(0.40, 0.66);   // ring bead
  put(0.46, 0.72); put(0.56, 0.95); put(0.66, 0.85);   // vase
  put(0.74, 0.62); put(0.78, 0.88); put(0.82, 0.60);   // upper bead
  put(0.90, 0.55); put(1.00, 0.46);                    // tenon taper
  return new THREE.LatheGeometry(p, 24);
}

// ---------- legs, splayed ----------
const legLen = 0.88, legR = 0.055;
const legTops = [], legBottoms = [];
const legSpots = [[-0.30, 0.26], [0.30, 0.26], [-0.33, -0.30], [0.33, -0.30]];
for (const [x, z] of legSpots) {
  const top = new THREE.Vector3(x, SEAT_Y - SEAT_T*0.5, z);
  const bottom = new THREE.Vector3(x*1.45, 0, z*1.42);
  const leg = addMesh(turnedProfile(legLen, legR), turnMat);
  const dir = new THREE.Vector3().subVectors(top, bottom);
  leg.position.copy(bottom);
  leg.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
  leg.scale.y = dir.length()/legLen;
  legTops.push(top); legBottoms.push(bottom);
}

// ---------- stretchers (H pattern with turned swell) ----------
function stretcher(a, b, r) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const p = [];
  const put = (t, rr) => p.push(new THREE.Vector2(rr*r, t*len));
  put(0, 0.55); put(0.12, 0.7); put(0.5, 1.0); put(0.88, 0.7); put(1, 0.55);
  const m = addMesh(new THREE.LatheGeometry(p, 18), turnMat);
  m.position.copy(a);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  return m;
}
const lerpLeg = (i, j, t) =>
  new THREE.Vector3().lerpVectors(legBottoms[i], legTops[i], t)
    .lerp(new THREE.Vector3().lerpVectors(legBottoms[j], legTops[j], t), 0); // helper base
function onLeg(i, t) { return new THREE.Vector3().lerpVectors(legBottoms[i], legTops[i], t); }
const sideL = [onLeg(0, 0.42), onLeg(2, 0.42)];
const sideR = [onLeg(1, 0.42), onLeg(3, 0.42)];
stretcher(sideL[0], sideL[1], 0.036);
stretcher(sideR[0], sideR[1], 0.036);
stretcher(
  new THREE.Vector3().lerpVectors(sideL[0], sideL[1], 0.5),
  new THREE.Vector3().lerpVectors(sideR[0], sideR[1], 0.5),
  0.04
);

// ---------- bent back bow (curved tube) ----------
const bowPts = [];
const BOW = { halfW: 0.36, height: 0.78, tilt: -0.13 };
for (let i = 0; i <= 40; i++) {
  const t = i/40;                          // 0..1 left socket -> right socket
  const a = Math.PI * t;                   // arch angle
  const x = -Math.cos(a) * BOW.halfW;
  const h = Math.sin(a);
  const y = SEAT_Y + h * BOW.height;
  const z = -0.30 + BOW.tilt * h - 0.05*Math.sin(a)*Math.sin(a);
  bowPts.push(new THREE.Vector3(x, y, z));
}
const bowCurve = new THREE.CatmullRomCurve3(bowPts);
addMesh(new THREE.TubeGeometry(bowCurve, 80, 0.028, 12, false), bowMat);

// bow socket caps (readable joinery: through-tenons at seat)
for (const s of [-1, 1]) {
  const peg = addMesh(new THREE.CylinderGeometry(0.033, 0.033, 0.05, 12), bowMat);
  peg.position.set(s*BOW.halfW, SEAT_Y - 0.012, -0.30);
}

// ---------- spindles ----------
const NSP = 7;
for (let i = 0; i < NSP; i++) {
  const t = (i+1)/(NSP+1);
  const topP = bowCurve.getPoint(t);
  const baseX = (t - 0.5) * 2 * 0.30;
  const base = new THREE.Vector3(baseX, SEAT_Y - 0.02, -0.26 + 0.03*Math.abs(baseX));
  // slightly bellied spindle via lathe
  const dir = new THREE.Vector3().subVectors(topP, base);
  const len = dir.length();
  const p = [];
  const put = (tt, rr) => p.push(new THREE.Vector2(rr, tt*len));
  put(0, 0.013); put(0.18, 0.017); put(0.35, 0.0185); put(0.6, 0.014); put(1, 0.0085);
  const sp = addMesh(new THREE.LatheGeometry(p, 12), turnMat);
  sp.position.copy(base);
  sp.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  // seat socket bead
  const bead = addMesh(new THREE.CylinderGeometry(0.021, 0.024, 0.018, 10), bowMat);
  bead.position.copy(base).y += 0.006;
}

// leg wedge tenons visible on seat top (joinery detail)
for (const [x, z] of legSpots) {
  const tn = addMesh(new THREE.CylinderGeometry(0.03, 0.03, 0.014, 12), bowMat);
  tn.position.set(x, SEAT_Y - 0.028, z);
  const wedge = addMesh(new THREE.BoxGeometry(0.062, 0.012, 0.008), seatMat);
  wedge.position.set(x, SEAT_Y - 0.024, z);
  wedge.rotation.y = Math.atan2(z, x);
}

chair.position.y = 0;

// ---------- controls / loop ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.85, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 1.6;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.52;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
