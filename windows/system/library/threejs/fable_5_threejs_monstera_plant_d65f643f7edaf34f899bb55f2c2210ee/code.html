<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Monstera Deliciosa</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d1f; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d1f);
scene.fog = new THREE.Fog(0x1a1d1f, 14, 30);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.2, 3.2, 5.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.6, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 3;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.52;

// ---------- lighting ----------
scene.add(new THREE.HemisphereLight(0xbfd4e0, 0x2a2620, 0.55));

const key = new THREE.DirectionalLight(0xfff2df, 1.9);
key.position.set(5, 8, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -5;
key.shadow.camera.right = key.shadow.camera.top = 5;
key.shadow.camera.near = 2;
key.shadow.camera.far = 20;
key.shadow.bias = -0.0004;
key.shadow.radius = 6;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fb8d8, 0.5);
fill.position.set(-6, 3, -3);
scene.add(fill);

const rim = new THREE.PointLight(0xd8ffe0, 8, 15);
rim.position.set(-2, 4.5, -4);
scene.add(rim);

// ---------- ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(12, 64),
  new THREE.MeshStandardMaterial({ color: 0x232729, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// soft contact shadow blob
const blobTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 10, 128, 128, 128);
  grd.addColorStop(0, 'rgba(0,0,0,0.5)');
  grd.addColorStop(0.6, 'rgba(0,0,0,0.22)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const blob = new THREE.Mesh(
  new THREE.PlaneGeometry(4.6, 4.6),
  new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false })
);
blob.rotation.x = -Math.PI / 2;
blob.position.y = 0.005;
scene.add(blob);

// ---------- plant group ----------
const plant = new THREE.Group();
scene.add(plant);

// --- ceramic pot ---
const potMat = new THREE.MeshStandardMaterial({ color: 0xd8cfc2, roughness: 0.35, metalness: 0.05 });
const potPts = [];
for (let i = 0; i <= 16; i++) {
  const t = i / 16;
  const r = 0.62 + 0.34 * Math.pow(t, 0.85);
  potPts.push(new THREE.Vector2(r, t * 1.05));
}
potPts.push(new THREE.Vector2(1.0, 1.08), new THREE.Vector2(0.98, 1.12), new THREE.Vector2(0.88, 1.12));
const pot = new THREE.Mesh(new THREE.LatheGeometry(potPts, 48), potMat);
pot.castShadow = pot.receiveShadow = true;
plant.add(pot);

const soil = new THREE.Mesh(
  new THREE.CylinderGeometry(0.86, 0.86, 0.08, 40),
  new THREE.MeshStandardMaterial({ color: 0x2e2119, roughness: 1 })
);
soil.position.y = 1.04;
soil.receiveShadow = true;
plant.add(soil);

// --- leaf geometry: heart-shaped blade with fenestration splits + holes ---
// Blade drawn in XZ-ish local plane (x = width, y = length), then bent.
function leafShape(rng) {
  const L = 1;                       // normalized length; scaled later
  const shape = new THREE.Shape();
  const half = (sign) => {
    // heart outline via sampled radius profile
    const pts = [];
    const N = 34;
    for (let i = 0; i <= N; i++) {
      const t = i / N;               // 0 tip -> 1 base
      const y = L * (1 - t);
      // width profile: narrow tip, widest ~55%, notched heart base
      let w = Math.sin(Math.PI * Math.pow(t, 0.78)) * 0.62;
      if (t > 0.86) w *= 1.05;       // basal lobes flare
      pts.push([sign * w, y]);
    }
    return pts;
  };
  const right = half(1), left = half(-1).reverse();
  shape.moveTo(0, L);                // tip
  // right edge with deep splits cut as wedges toward midrib
  const splitsR = [0.22, 0.38, 0.54, 0.70], splitsL = [0.30, 0.46, 0.62, 0.78];
  const addEdge = (pts, splits, sign) => {
    for (let i = 0; i < pts.length; i++) {
      const [x, y] = pts[i];
      shape.lineTo(x, y);
      const t = 1 - y;               // 0 at tip
      for (const s of splits) {
        if (Math.abs(t - s) < 0.012 && Math.abs(x) > 0.1) {
          const depth = 0.55 + rng() * 0.25;        // fraction toward midrib
          const inx = x * (1 - depth);
          const gap = 0.028;
          shape.lineTo(inx, y - gap * 0.4);
          shape.lineTo(inx * 0.96, y - gap);
          shape.lineTo(x * 0.985, y - gap * 1.6);
        }
      }
    }
  };
  addEdge(right, splitsR, 1);
  // base notch (heart)
  shape.lineTo(0.10, -0.02);
  shape.lineTo(0, 0.07);
  shape.lineTo(-0.10, -0.02);
  addEdge(left, splitsL, -1);
  shape.closePath();

  // interior fenestration holes: ovals along each side of the midrib
  for (const sign of [1, -1]) {
    const n = 2 + Math.floor(rng() * 2);
    for (let i = 0; i < n; i++) {
      const t = 0.40 + i * 0.16 + rng() * 0.05;     // along length from tip
      const y = L * (1 - t);
      const cx = sign * (0.10 + rng() * 0.06);
      const rx = 0.030 + rng() * 0.02, ry = 0.075 + rng() * 0.05;
      const hole = new THREE.Path();
      hole.absellipse(cx, y, rx, ry, 0, Math.PI * 2, sign > 0);
      shape.holes.push(hole);
    }
  }
  return shape;
}

// deterministic-ish rng
let seed = 7;
const rng = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const leafMatFront = new THREE.MeshPhysicalMaterial({
  color: 0x1f7a33, roughness: 0.32, metalness: 0,
  clearcoat: 0.7, clearcoatRoughness: 0.28,
  sheen: 0.3, sheenColor: new THREE.Color(0x9fdf9f),
  side: THREE.DoubleSide
});
const stemMat = new THREE.MeshStandardMaterial({ color: 0x2f6b2c, roughness: 0.55 });

function makeLeaf(scale, droop, hueShift) {
  const shape = leafShape(rng);
  const geo = new THREE.ShapeGeometry(shape, 10);
  geo.rotateX(-Math.PI / 2);         // lay flat: length along -Z ... actually along Z
  // now blade lies in XZ plane, tip at z = -? -> reorient: shape y -> -z
  // ShapeGeometry rotateX(-90): (x, y, 0) -> (x, 0, y). Tip at z=1, base z=0.
  // Bend: arch down along z (tip droops), slight cup across x
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const t = z;                     // 0 base -> 1 tip
    pos.setY(i, -droop * t * t * 0.9 + Math.abs(x) * 0.22 * (0.4 + t) - 0.02 * Math.sin(t * 9));
  }
  geo.computeVertexNormals();

  const mat = leafMatFront.clone();
  mat.color = new THREE.Color().setHSL(0.33 + hueShift, 0.55, 0.22 + rng() * 0.05);
  const blade = new THREE.Mesh(geo, mat);
  blade.castShadow = blade.receiveShadow = true;
  blade.scale.setScalar(scale);

  // midrib
  const rib = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.02, 0.95, 6), stemMat);
  rib.rotation.x = Math.PI / 2 - droop * 0.55;
  rib.position.set(0, -droop * 0.20, 0.45);
  rib.scale.setScalar(scale);
  rib.position.multiplyScalar(scale);
  rib.castShadow = true;

  const g = new THREE.Group();
  g.add(blade, rib);
  return g;
}

// --- stems: thick arching petioles from soil to each leaf ---
function makeStemCurve(angle, len, lean, arch) {
  const dir = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
  const p0 = new THREE.Vector3(dir.x * 0.15, 1.05, dir.z * 0.15);
  const p1 = p0.clone().add(new THREE.Vector3(dir.x * lean * 0.35, len * 0.55, dir.z * lean * 0.35));
  const p2 = p0.clone().add(new THREE.Vector3(dir.x * lean * 0.9, len * 0.95, dir.z * lean * 0.9));
  const p3 = p0.clone().add(new THREE.Vector3(dir.x * lean * 1.35, len * (1 - arch * 0.35), dir.z * lean * 1.35));
  return new THREE.CubicBezierCurve3(p0, p1, p2, p3);
}

const leaves = [];
const leafSpecs = [
  // angle, stemLen, lean, arch, leafScale, droop, twist
  [0.3,  2.6, 0.9, 0.15, 1.9, 0.55, 0.10],
  [1.5,  2.9, 0.8, 0.05, 2.1, 0.40, -0.15],
  [2.7,  2.3, 1.1, 0.30, 1.7, 0.85, 0.20],   // drooping
  [3.9,  3.1, 0.7, 0.00, 2.2, 0.35, 0.05],
  [5.0,  2.5, 1.0, 0.25, 1.8, 0.75, -0.20],  // drooping
  [5.9,  2.0, 1.2, 0.40, 1.5, 0.95, 0.30],   // low drooper
  [0.9,  3.3, 0.5, -0.05, 2.0, 0.30, -0.05], // tall young leaf
];

for (const [ang, len, lean, arch, scl, droop, twist] of leafSpecs) {
  const a = ang + (rng() - 0.5) * 0.15;
  const curve = makeStemCurve(a, len, lean, arch);
  const stem = new THREE.Mesh(new THREE.TubeGeometry(curve, 24, 0.045 + scl * 0.008, 8), stemMat);
  stem.castShadow = stem.receiveShadow = true;
  plant.add(stem);

  const leaf = makeLeaf(scl, droop, (rng() - 0.5) * 0.03);
  const end = curve.getPoint(1);
  const tan = curve.getTangent(1);
  leaf.position.copy(end);
  // orient blade outward continuing the stem direction
  const yaw = Math.atan2(tan.x, tan.z);
  leaf.rotation.set(0, yaw, 0);
  leaf.rotateX(-Math.max(0, tan.y) * 0.7 + droop * 0.15);
  leaf.rotateZ(twist);
  leaf.userData.baseRot = leaf.rotation.clone();
  leaf.userData.phase = rng() * Math.PI * 2;
  plant.add(leaf);
  leaves.push(leaf);
}

// small central sprout (unfurling new leaf)
const sproutCurve = new THREE.CubicBezierCurve3(
  new THREE.Vector3(0, 1.05, 0), new THREE.Vector3(0.05, 1.9, 0.02),
  new THREE.Vector3(0.1, 2.5, 0.05), new THREE.Vector3(0.18, 2.9, 0.1)
);
const sprout = new THREE.Mesh(new THREE.TubeGeometry(sproutCurve, 16, 0.035, 8), stemMat);
sprout.castShadow = true;
plant.add(sprout);
const spike = new THREE.Mesh(
  new THREE.ConeGeometry(0.06, 0.55, 8),
  new THREE.MeshStandardMaterial({ color: 0x3f8f3a, roughness: 0.4 })
);
spike.position.set(0.20, 3.15, 0.11);
spike.rotation.z = -0.15;
spike.castShadow = true;
plant.add(spike);

// ---------- animate ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  for (const leaf of leaves) {
    const b = leaf.userData.baseRot, p = leaf.userData.phase;
    leaf.rotation.x = b.x + Math.sin(t * 0.8 + p) * 0.012;
    leaf.rotation.z = b.z + Math.cos(t * 0.6 + p) * 0.010;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
