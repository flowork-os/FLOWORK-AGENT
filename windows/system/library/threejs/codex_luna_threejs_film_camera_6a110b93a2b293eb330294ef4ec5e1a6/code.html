<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1990s Point-and-Shoot Camera</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #17191b; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x181a1c);
scene.fog = new THREE.Fog(0x181a1c, 14, 28);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.3, 4.8, -8.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.target.set(0, 0.35, 0);

const ambient = new THREE.HemisphereLight(0xb8c0c8, 0x25201a, 2.0);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xffeee0, 4.2);
key.position.set(-5, 8, -7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -8;
scene.add(key);

const rim = new THREE.PointLight(0x7896bd, 22, 18, 2);
rim.position.set(5, 4, 5);
scene.add(rim);

const fill = new THREE.PointLight(0xff9e5c, 7, 12, 2);
fill.position.set(-5, 1, -5);
scene.add(fill);

const plastic = new THREE.MeshStandardMaterial({
  color: 0x34383a, roughness: 0.78, metalness: 0.08
});
const edgePlastic = new THREE.MeshStandardMaterial({
  color: 0x232729, roughness: 0.68, metalness: 0.12
});
const rubber = new THREE.MeshStandardMaterial({
  color: 0x111416, roughness: 0.92, metalness: 0.02
});
const chrome = new THREE.MeshStandardMaterial({
  color: 0x777d7b, roughness: 0.3, metalness: 0.72
});
const glass = new THREE.MeshPhysicalMaterial({
  color: 0x172c3c, roughness: 0.12, metalness: 0.28,
  transmission: 0.08, clearcoat: 0.8, clearcoatRoughness: 0.12
});
const warmGlass = new THREE.MeshPhysicalMaterial({
  color: 0x718a87, roughness: 0.18, metalness: 0.18,
  transmission: 0.12, clearcoat: 0.65
});
const whitePlastic = new THREE.MeshStandardMaterial({
  color: 0xb4b7ae, roughness: 0.62, metalness: 0.05
});
const scuff = new THREE.MeshStandardMaterial({
  color: 0x6d706c, roughness: 0.95, metalness: 0.02
});

function roundedShape(width, height, radius) {
  const s = new THREE.Shape();
  const x = -width / 2, y = -height / 2;
  s.moveTo(x + radius, y);
  s.lineTo(x + width - radius, y);
  s.quadraticCurveTo(x + width, y, x + width, y + radius);
  s.lineTo(x + width, y + height - radius);
  s.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  s.lineTo(x + radius, y + height);
  s.quadraticCurveTo(x, y + height, x, y + height - radius);
  s.lineTo(x, y + radius);
  s.quadraticCurveTo(x, y, x + radius, y);
  return s;
}

function roundedBody(width, height, depth, radius, material) {
  const geo = new THREE.ExtrudeGeometry(roundedShape(width, height, radius), {
    depth,
    bevelEnabled: true,
    bevelSegments: 6,
    bevelSize: 0.12,
    bevelThickness: 0.12,
    curveSegments: 8
  });
  geo.translate(0, 0, -depth / 2);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function box(name, size, position, material, rotation = [0, 0, 0]) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), material);
  mesh.name = name;
  mesh.position.set(...position);
  mesh.rotation.set(...rotation);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function cylinder(name, radius, depth, position, material, radial = 64, rotation = [Math.PI / 2, 0, 0]) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, depth, radial), material);
  mesh.name = name;
  mesh.position.set(...position);
  mesh.rotation.set(...rotation);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

const body = roundedBody(5.25, 3.35, 1.55, 0.42, plastic);
body.position.y = 0.35;
scene.add(body);

const topShoulder = roundedBody(4.7, 0.35, 1.48, 0.12, edgePlastic);
topShoulder.position.set(0, 2.08, 0);
scene.add(topShoulder);

box("front inset", [4.55, 2.55, 0.08], [0, 0.35, -0.84], edgePlastic);
box("front plate", [4.25, 2.28, 0.045], [0, 0.35, -0.89], plastic);

const lensMount = cylinder("lens mount", 1.28, 0.24, [0.15, 0.25, -1.06], chrome);
const barrelOuter = cylinder("lens barrel", 1.08, 0.58, [0.15, 0.25, -1.39], edgePlastic);
const barrelMid = cylinder("lens ring", 0.86, 0.28, [0.15, 0.25, -1.78], chrome);
const lensHousing = cylinder("lens housing", 0.72, 0.20, [0.15, 0.25, -1.99], rubber);
const lensGlass = cylinder("lens glass", 0.57, 0.045, [0.15, 0.25, -2.115], glass, 64);
lensGlass.castShadow = false;

for (let i = 0; i < 8; i++) {
  const angle = (Math.PI * 2 * i) / 8;
  const x = 0.15 + Math.cos(angle) * 0.96;
  const y = 0.25 + Math.sin(angle) * 0.96;
  cylinder("mount screw", 0.055, 0.035, [x, y, -1.19], chrome, 16);
}

const flashFrame = box("flash frame", [1.05, 0.62, 0.07], [-1.62, 1.04, -0.94], rubber);
const flash = box("flash window", [0.83, 0.39, 0.045], [-1.62, 1.04, -0.985], warmGlass);

const finderFrame = box("viewfinder frame", [0.78, 0.52, 0.09], [1.62, 1.13, -0.94], rubber);
const finder = box("viewfinder glass", [0.57, 0.29, 0.05], [1.62, 1.13, -0.995], glass);

box("self timer", [0.22, 0.22, 0.07], [2.03, 0.15, -0.95], chrome);
cylinder("self timer lens", 0.075, 0.025, [2.03, 0.15, -1.01], warmGlass, 24);

const shutterBase = cylinder("shutter base", 0.34, 0.15, [1.3, 2.27, 0.04], rubber, 48, [0, 0, 0]);
const shutterButton = cylinder("shutter button", 0.22, 0.16, [1.3, 2.4, 0.04], chrome, 48, [0, 0, 0]);
cylinder("shutter highlight", 0.12, 0.165, [1.3, 2.405, 0.04], whitePlastic, 48, [0, 0, 0]);

box("mode switch", [0.72, 0.18, 0.34], [-0.55, 2.3, 0.02], rubber);
box("mode switch ridge", [0.27, 0.22, 0.42], [-0.55, 2.45, 0.02], chrome);

const seamZ = 0.82;
box("battery seam top", [2.7, 0.025, 0.035], [0.65, 1.25, seamZ], edgePlastic);
box("battery seam bottom", [2.7, 0.025, 0.035], [0.65, -0.38, seamZ], edgePlastic);
box("battery seam left", [0.025, 1.65, 0.035], [-0.72, 0.435, seamZ], edgePlastic);
box("battery seam right", [0.025, 1.65, 0.035], [2.02, 0.435, seamZ], edgePlastic);
box("battery latch", [0.48, 0.06, 0.05], [1.55, -0.52, seamZ + 0.03], chrome);

box("wrist lug left", [0.18, 0.38, 0.28], [-2.72, 0.15, 0.05], rubber);
box("wrist lug right", [0.18, 0.38, 0.28], [2.72, 0.15, 0.05], rubber);

box("scuff one", [0.65, 0.035, 0.012], [-1.98, -0.42, -0.98], scuff, [0, 0, -0.12]);
box("scuff two", [0.31, 0.035, 0.012], [-2.2, -0.52, -0.98], scuff, [0, 0, 0.14]);
box("scuff three", [0.42, 0.025, 0.012], [2.04, -0.76, -0.98], scuff, [0, 0, 0.08]);
box("scuff four", [0.22, 0.025, 0.012], [2.23, -0.84, -0.98], scuff, [0, 0, -0.18]);

const grip = new THREE.Group();
for (let i = 0; i < 9; i++) {
  const rib = new THREE.Mesh(new THREE.BoxGeometry(0.09, 1.65, 0.04), rubber);
  rib.position.set(-2.18 + i * 0.17, 0.05, -0.96);
  rib.rotation.z = -0.05;
  rib.castShadow = true;
  grip.add(rib);
}
scene.add(grip);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0x252729, roughness: 0.9, metalness: 0.03 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.48;
ground.receiveShadow = true;
scene.add(ground);

const backdrop = new THREE.Mesh(
  new THREE.CircleGeometry(16, 64),
  new THREE.MeshBasicMaterial({ color: 0x1d2022 })
);
backdrop.rotation.x = -Math.PI / 2;
backdrop.position.y = -1.47;
scene.add(backdrop);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
