<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky Pirate Airship Deck</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1021;
      font-family: Georgia, serif;
    }

    canvas {
      display: block;
    }

    .title {
      position: fixed;
      top: 18px;
      left: 24px;
      color: #ffe7b2;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 13px;
      text-shadow: 0 2px 8px #190d16;
      pointer-events: none;
      opacity: 0.9;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="title">The Gilded Wraith · Airborne Somewhere Beyond the Storm</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x17182f);
    scene.fog = new THREE.FogExp2(0x6f4560, 0.008);

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      300
    );
    camera.position.set(24, 15, 24);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.32;
    controls.minDistance = 15;
    controls.maxDistance = 54;
    controls.maxPolarAngle = Math.PI * 0.47;
    controls.target.set(0, 4.5, 0);

    const rngState = { value: 493827 };
    function random() {
      let value = rngState.value += 0x6D2B79F5;
      value = Math.imul(value ^ value >>> 15, value | 1);
      value ^= value + Math.imul(value ^ value >>> 7, value | 61);
      return ((value ^ value >>> 14) >>> 0) / 4294967296;
    }

    function makeCanvasTexture(kind) {
      const canvas = document.createElement("canvas");
      canvas.width = 256;
      canvas.height = 256;
      const context = canvas.getContext("2d");

      if (kind === "wood") {
        const gradient = context.createLinearGradient(0, 0, 256, 256);
        gradient.addColorStop(0, "#5d2d18");
        gradient.addColorStop(0.5, "#9b5628");
        gradient.addColorStop(1, "#3d1c14");
        context.fillStyle = gradient;
        context.fillRect(0, 0, 256, 256);

        for (let index = 0; index < 42; index++) {
          const y = random() * 256;
          context.strokeStyle = `rgba(38,18,10,${0.18 + random() * 0.22})`;
          context.lineWidth = 1 + random() * 3;
          context.beginPath();
          context.moveTo(0, y);
          context.bezierCurveTo(
            65,
            y + random() * 18 - 9,
            175,
            y + random() * 18 - 9,
            256,
            y + random() * 18 - 9
          );
          context.stroke();
        }

        for (let index = 0; index < 18; index++) {
          context.fillStyle = "rgba(255,194,110,0.08)";
          context.fillRect(random() * 256, random() * 256, 3 + random() * 16, 1);
        }
      }

      if (kind === "canvas") {
        context.fillStyle = "#d5a35e";
        context.fillRect(0, 0, 256, 256);
        for (let index = 0; index < 1800; index++) {
          const shade = 100 + Math.floor(random() * 100);
          context.fillStyle = `rgba(${shade},${Math.floor(shade * 0.72)},${Math.floor(shade * 0.4)},0.16)`;
          context.fillRect(random() * 256, random() * 256, 1, 1);
        }
        context.strokeStyle = "rgba(79,40,22,0.35)";
        context.lineWidth = 3;
        context.strokeRect(6, 6, 244, 244);
        context.strokeStyle = "rgba(255,225,147,0.28)";
        context.lineWidth = 1;
        for (let index = 0; index < 16; index++) {
          context.beginPath();
          context.moveTo(index * 16, 0);
          context.lineTo(index * 16, 256);
          context.stroke();
          context.beginPath();
          context.moveTo(0, index * 16);
          context.lineTo(256, index * 16);
          context.stroke();
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    const woodTexture = makeCanvasTexture("wood");
    woodTexture.repeat.set(2.4, 1.2);

    const canvasTexture = makeCanvasTexture("canvas");
    canvasTexture.repeat.set(1, 1);

    const woodMaterial = new THREE.MeshStandardMaterial({
      map: woodTexture,
      roughness: 0.8,
      metalness: 0.04
    });

    const darkWoodMaterial = new THREE.MeshStandardMaterial({
      color: 0x29120e,
      roughness: 0.92,
      metalness: 0.02
    });

    const ropeMaterial = new THREE.MeshStandardMaterial({
      color: 0xb78b55,
      roughness: 0.94
    });

    const brassMaterial = new THREE.MeshStandardMaterial({
      color: 0xa96728,
      roughness: 0.29,
      metalness: 0.76
    });

    const brightBrassMaterial = new THREE.MeshStandardMaterial({
      color: 0xf0b84f,
      roughness: 0.24,
      metalness: 0.86
    });

    const ironMaterial = new THREE.MeshStandardMaterial({
      color: 0x211d1b,
      roughness: 0.44,
      metalness: 0.8
    });

    const canvasMaterial = new THREE.MeshStandardMaterial({
      map: canvasTexture,
      color: 0xc38a4e,
      roughness: 0.94,
      side: THREE.DoubleSide
    });

    const cloudMaterial = new THREE.MeshStandardMaterial({
      color: 0xf2c9bb,
      roughness: 1
    });

    const cloudHighlightMaterial = new THREE.MeshStandardMaterial({
      color: 0xffe4c5,
      roughness: 1
    });

    const hull = new THREE.Group();
    hull.position.y = 0.4;
    scene.add(hull);

    function addMesh(parent, geometry, material, x, y, z, sx = 1, sy = 1, sz = 1) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(x, y, z);
      mesh.scale.set(sx, sy, sz);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function beamBetween(parent, start, end, radius, material, segments = 8) {
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();
      const geometry = new THREE.CylinderGeometry(radius, radius, length, segments);
      const beam = new THREE.Mesh(geometry, material);
      beam.position.copy(start).add(end).multiplyScalar(0.5);
      beam.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      beam.castShadow = true;
      beam.receiveShadow = true;
      parent.add(beam);
      return beam;
    }

    function addRailPost(x, z) {
      addMesh(hull, new THREE.CylinderGeometry(0.09, 0.11, 1.45, 8), darkWoodMaterial, x, 3.18, z);
      addMesh(hull, new THREE.SphereGeometry(0.15, 12, 8), brightBrassMaterial, x, 3.93, z);
    }

    addMesh(
      hull,
      new THREE.SphereGeometry(1, 48, 24),
      woodMaterial,
      0,
      0.15,
      0,
      8.4,
      2.25,
      2.8
    );

    addMesh(hull, new THREE.BoxGeometry(15.5, 0.34, 5.1), woodMaterial, 0, 2.36, 0, 1, 1, 1);
    addMesh(hull, new THREE.BoxGeometry(13.8, 0.18, 4.8), darkWoodMaterial, 0, 2.59, 0);

    addMesh(hull, new THREE.BoxGeometry(12.8, 0.16, 0.2), brightBrassMaterial, 0, 2.78, 2.24);
    addMesh(hull, new THREE.BoxGeometry(12.8, 0.16, 0.2), brightBrassMaterial, 0, 2.78, -2.24);

    for (let plankIndex = -6; plankIndex <= 6; plankIndex++) {
      const plank = addMesh(
        hull,
        new THREE.BoxGeometry(0.1, 0.055, 4.45),
        brassMaterial,
        plankIndex,
        2.71,
        0
      );
      plank.rotation.y = (random() - 0.5) * 0.018;
    }

    for (let postIndex = -5; postIndex <= 5; postIndex += 2) {
      addRailPost(postIndex, 2.33);
      addRailPost(postIndex, -2.33);
    }

    beamBetween(hull, new THREE.Vector3(-6.2, 3.86, 2.33), new THREE.Vector3(6.2, 3.86, 2.33), 0.1, ropeMaterial);
    beamBetween(hull, new THREE.Vector3(-6.2, 3.86, -2.33), new THREE.Vector3(6.2, 3.86, -2.33), 0.1, ropeMaterial);

    for (let ribIndex = -5; ribIndex <= 5; ribIndex += 2) {
      addMesh(hull, new THREE.BoxGeometry(0.22, 3.7, 0.23), darkWoodMaterial, ribIndex, 0.35, 2.62);
      addMesh(hull, new THREE.BoxGeometry(0.22, 3.7, 0.23), darkWoodMaterial, ribIndex, 0.35, -2.62);
    }

    addMesh(hull, new THREE.BoxGeometry(8.2, 0.22, 0.25), brassMaterial, 0, 0.4, 2.77);
    addMesh(hull, new THREE.BoxGeometry(8.2, 0.22, 0.25), brassMaterial, 0, 0.4, -2.77);

    const keel = new THREE.Group();
    hull.add(keel);
    addMesh(keel, new THREE.BoxGeometry(13, 0.58, 0.7), darkWoodMaterial, 0, -2.07, 0);
    addMesh(keel, new THREE.ConeGeometry(1.0, 2.8, 12), darkWoodMaterial, -7.3, -0.15, 0, 1, 1, 0.8).rotation.z = -Math.PI / 2;
    addMesh(keel, new THREE.ConeGeometry(1.0, 2.8, 12), darkWoodMaterial, 7.3, -0.15, 0, 1, 1, 0.8).rotation.z = Math.PI / 2;

    const balloon = new THREE.Group();
    balloon.position.set(0, 11.1, 0);
    scene.add(balloon);

    addMesh(
      balloon,
      new THREE.SphereGeometry(1, 48, 24),
      canvasMaterial,
      0,
      0,
      0,
      8.7,
      3.42,
      3.1
    );

    const balloonSections = [
      { x: -6.4, scale: [2.9, 2.55, 2.48], color: 0x9d492d },
      { x: -3.2, scale: [3.0, 3.1, 2.84], color: 0xd0914a },
      { x: 0, scale: [3.05, 3.3, 2.95], color: 0x93472e },
      { x: 3.2, scale: [3.0, 3.08, 2.82], color: 0xc98745 },
      { x: 6.35, scale: [2.7, 2.5, 2.35], color: 0x9d4e31 }
    ];

    for (const section of balloonSections) {
      const sectionMaterial = new THREE.MeshStandardMaterial({
        color: section.color,
        roughness: 0.91
      });
      addMesh(
        balloon,
        new THREE.SphereGeometry(1, 32, 18),
        sectionMaterial,
        section.x,
        0,
        0,
        section.scale[0],
        section.scale[1],
        section.scale[2]
      );
    }

    for (let seamIndex = -2; seamIndex <= 2; seamIndex++) {
      const seam = new THREE.Mesh(
        new THREE.TorusGeometry(3.06, 0.075, 8, 36),
        ropeMaterial
      );
      seam.rotation.y = Math.PI / 2;
      seam.position.x = seamIndex * 3.05;
      seam.scale.z = 0.96;
      seam.castShadow = true;
      balloon.add(seam);
    }

    for (let ropeIndex = -3; ropeIndex <= 3; ropeIndex += 2) {
      beamBetween(
        scene,
        new THREE.Vector3(ropeIndex * 1.45, 3.9, 2.12),
        new THREE.Vector3(ropeIndex * 1.8, 8.9, 2.25),
        0.045,
        ropeMaterial,
        6
      );
      beamBetween(
        scene,
        new THREE.Vector3(ropeIndex * 1.45, 3.9, -2.12),
        new THREE.Vector3(ropeIndex * 1.8, 8.9, -2.25),
        0.045,
        ropeMaterial,
        6
      );
    }

    const upperRigging = new THREE.Group();
    scene.add(upperRigging);
    beamBetween(upperRigging, new THREE.Vector3(-8.3, 11.2, 0), new THREE.Vector3(-6.1, 4.15, 0), 0.055, ropeMaterial);
    beamBetween(upperRigging, new THREE.Vector3(8.3, 11.2, 0), new THREE.Vector3(6.1, 4.15, 0), 0.055, ropeMaterial);
    beamBetween(upperRigging, new THREE.Vector3(0, 14.4, 2.7), new THREE.Vector3(0, 4.1, 2.25), 0.045, ropeMaterial);
    beamBetween(upperRigging, new THREE.Vector3(0, 14.4, -2.7), new THREE.Vector3(0, 4.1, -2.25), 0.045, ropeMaterial);

    const mast = new THREE.Group();
    mast.position.set(-5.7, 3.0, 0);
    hull.add(mast);
    addMesh(mast, new THREE.CylinderGeometry(0.16, 0.23, 8.4, 12), darkWoodMaterial, 0, 3.8, 0);
    addMesh(mast, new THREE.SphereGeometry(0.32, 16, 10), brightBrassMaterial, 0, 8.1, 0);
    beamBetween(mast, new THREE.Vector3(0, 6.75, 0), new THREE.Vector3(0, 6.75, 3.0), 0.09, darkWoodMaterial);
    beamBetween(mast, new THREE.Vector3(0, 6.75, 0), new THREE.Vector3(0, 6.75, -3.0), 0.09, darkWoodMaterial);

    const flagGroup = new THREE.Group();
    flagGroup.position.set(-5.55, 8.0, 0);
    hull.add(flagGroup);

    const flagGeometry = new THREE.PlaneGeometry(3.5, 1.75, 14, 5);
    const flagMaterial = new THREE.MeshStandardMaterial({
      color: 0x19151a,
      roughness: 0.92,
      side: THREE.DoubleSide
    });
    const flagMesh = new THREE.Mesh(flagGeometry, flagMaterial);
    flagMesh.position.set(1.72, -0.8, 0);
    flagMesh.castShadow = true;
    flagGroup.add(flagMesh);

    const flagBasePositions = new Float32Array(flagGeometry.attributes.position.array);

    const skullMaterial = new THREE.MeshStandardMaterial({
      color: 0xe7d5ab,
      roughness: 0.84
    });

    addMesh(flagGroup, new THREE.SphereGeometry(0.39, 16, 12), skullMaterial, 1.68, 7.22, 0.13, 1, 1.08, 0.35);
    addMesh(flagGroup, new THREE.SphereGeometry(0.09, 12, 8), darkWoodMaterial, 1.53, 7.28, 0.38);
    addMesh(flagGroup, new THREE.SphereGeometry(0.09, 12, 8), darkWoodMaterial, 1.84, 7.28, 0.38);

    const flagBoneA = new THREE.Mesh(
      new THREE.CylinderGeometry(0.065, 0.065, 1.65, 8),
      skullMaterial
    );
    flagBoneA.position.set(1.68, 6.58, 0.18);
    flagBoneA.rotation.z = Math.PI / 4;
    flagBoneA.rotation.x = Math.PI / 2;
    flagGroup.add(flagBoneA);

    const flagBoneB = flagBoneA.clone();
    flagBoneB.rotation.z = -Math.PI / 4;
    flagGroup.add(flagBoneB);

    const helm = new THREE.Group();
    helm.position.set(4.75, 3.85, 0.9);
    hull.add(helm);

    const wheelRing = new THREE.Mesh(
      new THREE.TorusGeometry(1.45, 0.15, 12, 36),
      darkWoodMaterial
    );
    wheelRing.castShadow = true;
    helm.add(wheelRing);

    for (let spokeIndex = 0; spokeIndex < 8; spokeIndex++) {
      const angle = spokeIndex * Math.PI / 4;
      const spoke = new THREE.Mesh(
        new THREE.CylinderGeometry(0.075, 0.1, 2.25, 8),
        woodMaterial
      );
      spoke.position.set(Math.cos(angle) * 0.72, Math.sin(angle) * 0.72, 0);
      spoke.rotation.z = -angle;
      spoke.castShadow = true;
      helm.add(spoke);

      const grip = new THREE.Mesh(
        new THREE.SphereGeometry(0.17, 12, 8),
        brightBrassMaterial
      );
      grip.position.set(Math.cos(angle) * 1.48, Math.sin(angle) * 1.48, 0);
      grip.castShadow = true;
      helm.add(grip);
    }

    addMesh(helm, new THREE.CylinderGeometry(0.23, 0.23, 0.46, 16), brightBrassMaterial, 0, 0, 0);
    helm.rotation.z = -0.12;

    function createCannon(x, z, direction) {
      const cannon = new THREE.Group();
      cannon.position.set(x, 3.35, z);
      cannon.rotation.y = direction * 0.07;
      hull.add(cannon);

      addMesh(cannon, new THREE.BoxGeometry(2.15, 0.22, 0.75), darkWoodMaterial, 0, -0.65, 0);
      addMesh(cannon, new THREE.BoxGeometry(0.28, 0.95, 0.9), woodMaterial, -0.52, -0.28, 0);
      addMesh(cannon, new THREE.BoxGeometry(0.28, 0.95, 0.9), woodMaterial, 0.52, -0.28, 0);

      for (const wheelZ of [-0.66, 0.66]) {
        const wheel = new THREE.Mesh(
          new THREE.CylinderGeometry(0.57, 0.57, 0.18, 18),
          darkWoodMaterial
        );
        wheel.rotation.x = Math.PI / 2;
        wheel.position.set(-0.45, -0.82, wheelZ);
        wheel.castShadow = true;
        cannon.add(wheel);

        const axleCap = new THREE.Mesh(
          new THREE.CylinderGeometry(0.16, 0.16, 0.22, 12),
          brassMaterial
        );
        axleCap.rotation.x = Math.PI / 2;
        axleCap.position.set(-0.45, -0.82, wheelZ);
        cannon.add(axleCap);
      }

      const barrel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.34, 0.49, 2.85, 20),
        brassMaterial
      );
      barrel.rotation.z = Math.PI / 2;
      barrel.position.set(0.6 * direction, 0.14, 0);
      barrel.castShadow = true;
      cannon.add(barrel);

      const muzzle = new THREE.Mesh(
        new THREE.TorusGeometry(0.38, 0.095, 10, 20),
        brightBrassMaterial
      );
      muzzle.rotation.y = Math.PI / 2;
      muzzle.position.set(2.02 * direction, 0.14, 0);
      muzzle.castShadow = true;
      cannon.add(muzzle);

      const opening = new THREE.Mesh(
        new THREE.CylinderGeometry(0.28, 0.28, 0.06, 20),
        ironMaterial
      );
      opening.rotation.z = Math.PI / 2;
      opening.position.set(2.04 * direction, 0.14, 0);
      cannon.add(opening);

      const rearBand = new THREE.Mesh(
        new THREE.TorusGeometry(0.43, 0.08, 8, 18),
        brightBrassMaterial
      );
      rearBand.rotation.y = Math.PI / 2;
      rearBand.position.set(-0.62 * direction, 0.14, 0);
      cannon.add(rearBand);
      return cannon;
    }

    createCannon(1.8, 1.8, 1);
    createCannon(-1.0, -1.8, 1);

    function createBarrel(x, z, scale = 1) {
      const barrel = new THREE.Group();
      barrel.position.set(x, 3.12, z);
      barrel.rotation.y = (random() - 0.5) * 0.25;
      barrel.scale.setScalar(scale);
      hull.add(barrel);

      addMesh(barrel, new THREE.CylinderGeometry(0.62, 0.66, 1.25, 18), darkWoodMaterial, 0, 0.62, 0);
      addMesh(barrel, new THREE.CylinderGeometry(0.5, 0.5, 0.08, 18), woodMaterial, 0, 1.27, 0);
      addMesh(barrel, new THREE.CylinderGeometry(0.5, 0.5, 0.08, 18), woodMaterial, 0, -0.03, 0);

      for (let hoopIndex = 0; hoopIndex < 3; hoopIndex++) {
        const hoop = new THREE.Mesh(
          new THREE.TorusGeometry(0.64, 0.055, 8, 20),
          brassMaterial
        );
        hoop.rotation.x = Math.PI / 2;
        hoop.position.y = 0.05 + hoopIndex * 0.58;
        hoop.castShadow = true;
        barrel.add(hoop);
      }
      return barrel;
    }

    createBarrel(-3.75, 1.4, 1.08);
    createBarrel(-4.45, 0.55, 0.9);
    createBarrel(2.9, -0.65, 0.92);

    function createCrate(x, y, z, size, angle) {
      const crate = new THREE.Group();
      crate.position.set(x, y, z);
      crate.rotation.y = angle;
      hull.add(crate);

      addMesh(crate, new THREE.BoxGeometry(size, size, size), woodMaterial, 0, 0, 0);

      for (const side of [-1, 1]) {
        addMesh(crate, new THREE.BoxGeometry(size * 0.12, size * 1.04, size * 1.04), darkWoodMaterial, side * size * 0.38, 0, 0);
        addMesh(crate, new THREE.BoxGeometry(size * 1.04, size * 1.04, size * 0.12), darkWoodMaterial, 0, 0, side * size * 0.38);
      }
      return crate;
    }

    createCrate(0.7, 3.22, -0.4, 1.12, 0.12);
    createCrate(1.6, 3.18, -0.34, 0.84, -0.24);
    createCrate(-2.1, 3.12, 0.52, 0.8, 0.3);

    const ropeLadder = new THREE.Group();
    ropeLadder.position.set(0.1, 2.55, 2.78);
    hull.add(ropeLadder);

    beamBetween(ropeLadder, new THREE.Vector3(-0.65, 0, 0), new THREE.Vector3(-0.65, 5.7, 0), 0.065, ropeMaterial, 7);
    beamBetween(ropeLadder, new THREE.Vector3(0.65, 0, 0), new THREE.Vector3(0.65, 5.7, 0), 0.065, ropeMaterial, 7);

    for (let rungIndex = 0; rungIndex < 8; rungIndex++) {
      beamBetween(
        ropeLadder,
        new THREE.Vector3(-0.65, 0.34 + rungIndex * 0.7, 0),
        new THREE.Vector3(0.65, 0.34 + rungIndex * 0.7, 0),
        0.06,
        darkWoodMaterial,
        7
      );
    }

    function createLantern(x, z, phase) {
      const pivot = new THREE.Group();
      pivot.position.set(x, 7.05, z);
      hull.add(pivot);

      beamBetween(pivot, new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, -2.0, 0), 0.035, ropeMaterial, 6);

      const lantern = new THREE.Group();
      lantern.position.y = -2.08;
      pivot.add(lantern);

      addMesh(lantern, new THREE.CylinderGeometry(0.38, 0.44, 0.72, 12), ironMaterial, 0, 0, 0);
      addMesh(lantern, new THREE.CylinderGeometry(0.26, 0.26, 0.52, 12), new THREE.MeshBasicMaterial({ color: 0xffad46 }), 0, 0, 0);
      addMesh(lantern, new THREE.CylinderGeometry(0.47, 0.47, 0.08, 12), brightBrassMaterial, 0, 0.39, 0);
      addMesh(lantern, new THREE.CylinderGeometry(0.47, 0.47, 0.08, 12), brightBrassMaterial, 0, -0.39, 0);

      const glow = new THREE.PointLight(0xff9b3f, 1.35, 6.5, 2);
      glow.position.set(0, 0, 0);
      glow.castShadow = true;
      lantern.add(glow);

      return { pivot, phase };
    }

    const lanterns = [
      createLantern(-2.8, 2.02, 0.4),
      createLantern(2.55, -2.02, 2.1)
    ];

    const spyglass = new THREE.Group();
    spyglass.position.set(5.15, 4.05, 1.35);
    spyglass.rotation.z = -0.18;
    spyglass.rotation.y = 0.24;
    hull.add(spyglass);

    addMesh(spyglass, new THREE.CylinderGeometry(0.26, 0.34, 2.15, 20), brassMaterial, 0, 0, 0, 1, 1, 1).rotation.z = Math.PI / 2;
    addMesh(spyglass, new THREE.CylinderGeometry(0.4, 0.43, 0.42, 20), brightBrassMaterial, 0.88, 0, 0).rotation.z = Math.PI / 2;
    addMesh(spyglass, new THREE.CylinderGeometry(0.27, 0.29, 0.26, 20), brightBrassMaterial, -0.96, 0, 0).rotation.z = Math.PI / 2;
    addMesh(
      spyglass,
      new THREE.CylinderGeometry(0.24, 0.24, 0.04, 20),
      new THREE.MeshStandardMaterial({
        color: 0x58a8b4,
        roughness: 0.12,
        metalness: 0.35,
        emissive: 0x123b4a,
        emissiveIntensity: 0.6
      }),
      1.11,
      0,
      0
    ).rotation.z = Math.PI / 2;

    beamBetween(hull, new THREE.Vector3(5.15, 3.7, 1.35), new THREE.Vector3(5.15, 2.85, 1.35), 0.1, brassMaterial);
    addMesh(hull, new THREE.CylinderGeometry(0.34, 0.34, 0.15, 16), brightBrassMaterial, 5.15, 2.82, 1.35);

    const sternFlag = new THREE.Group();
    sternFlag.position.set(6.15, 5.55, 0);
    hull.add(sternFlag);
    addMesh(sternFlag, new THREE.CylinderGeometry(0.08, 0.11, 3.8, 10), darkWoodMaterial, 0, 0, 0);
    addMesh(sternFlag, new THREE.SphereGeometry(0.16, 12, 8), brightBrassMaterial, 0, 1.93, 0);

    const smallFlagGeometry = new THREE.PlaneGeometry(2.1, 1.05, 8, 3);
    const smallFlag = new THREE.Mesh(
      smallFlagGeometry,
      new THREE.MeshStandardMaterial({
        color: 0x472026,
        roughness: 0.9,
        side: THREE.DoubleSide
      })
    );
    smallFlag.position.set(-1.0, 1.38, 0);
    sternFlag.add(smallFlag);
    const smallFlagBase = new Float32Array(smallFlagGeometry.attributes.position.array);

    const cloudLayer = new THREE.Group();
    cloudLayer.position.y = -5.6;
    scene.add(cloudLayer);

    const cloudGroups = [];

    function createCloudCluster(x, y, z, scale, speed) {
      const cluster = new THREE.Group();
      cluster.position.set(x, y, z);
      cluster.scale.setScalar(scale);
      cloudLayer.add(cluster);

      const puffCount = 5 + Math.floor(random() * 5);
      for (let puffIndex = 0; puffIndex < puffCount; puffIndex++) {
        const puffMaterial = puffIndex % 3 === 0 ? cloudHighlightMaterial : cloudMaterial;
        const puff = new THREE.Mesh(
          new THREE.SphereGeometry(1, 20, 12),
          puffMaterial
        );
        puff.position.set(
          (random() - 0.5) * 5.5,
          (random() - 0.5) * 1.2,
          (random() - 0.5) * 3.5
        );
        puff.scale.set(
          1.5 + random() * 2.4,
          0.42 + random() * 0.55,
          1.0 + random() * 1.5
        );
        puff.receiveShadow = true;
        cluster.add(puff);
      }

      cloudGroups.push({ cluster, speed });
    }

    for (let cloudIndex = 0; cloudIndex < 24; cloudIndex++) {
      createCloudCluster(
        -32 + random() * 64,
        random() * 3.4 - 0.6,
        -18 + random() * 38,
        0.8 + random() * 1.8,
        0.35 + random() * 0.5
      );
    }

    const distantCloudMaterial = new THREE.MeshBasicMaterial({
      color: 0xa55e65,
      transparent: true,
      opacity: 0.58
    });

    const horizonClouds = new THREE.Group();
    horizonClouds.position.y = 1.3;
    scene.add(horizonClouds);

    for (let horizonIndex = 0; horizonIndex < 22; horizonIndex++) {
      const horizonCloud = new THREE.Mesh(
        new THREE.SphereGeometry(1, 16, 10),
        distantCloudMaterial
      );
      horizonCloud.position.set(
        -30 + horizonIndex * 3.2,
        random() * 4.5,
        -16 - random() * 7
      );
      horizonCloud.scale.set(
        4 + random() * 5,
        0.8 + random() * 1.7,
        1.2 + random() * 2
      );
      horizonClouds.add(horizonCloud);
    }

    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(1.5, 32, 20),
      new THREE.MeshBasicMaterial({ color: 0xffdfaa })
    );
    moon.position.set(-18, 19, -31);
    scene.add(moon);

    const moonGlow = new THREE.PointLight(0xffb46d, 1.2, 45, 2);
    moonGlow.position.copy(moon.position);
    scene.add(moonGlow);

    const hemiLight = new THREE.HemisphereLight(0x9c8ab5, 0x321d24, 1.35);
    scene.add(hemiLight);

    const sunsetLight = new THREE.DirectionalLight(0xffb270, 3.0);
    sunsetLight.position.set(-18, 27, 16);
    sunsetLight.castShadow = true;
    sunsetLight.shadow.mapSize.set(2048, 2048);
    sunsetLight.shadow.camera.left = -26;
    sunsetLight.shadow.camera.right = 26;
    sunsetLight.shadow.camera.top = 30;
    sunsetLight.shadow.camera.bottom = -18;
    sunsetLight.shadow.camera.near = 1;
    sunsetLight.shadow.camera.far = 90;
    scene.add(sunsetLight);

    const coolFill = new THREE.DirectionalLight(0x536ba8, 1.05);
    coolFill.position.set(18, 12, -24);
    scene.add(coolFill);

    const deckLight = new THREE.PointLight(0xff783b, 0.8, 20, 2);
    deckLight.position.set(0, 5, 0);
    scene.add(deckLight);

    const starGroup = new THREE.Group();
    scene.add(starGroup);

    const starMaterial = new THREE.PointsMaterial({
      color: 0xffd7a4,
      size: 0.11,
      transparent: true,
      opacity: 0.72
    });
    const starPositions = [];
    for (let starIndex = 0; starIndex < 180; starIndex++) {
      starPositions.push(
        -70 + random() * 140,
        7 + random() * 48,
        -42 + random() * 18
      );
    }
    const starGeometry = new THREE.BufferGeometry();
    starGeometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(starPositions, 3)
    );
    starGroup.add(new THREE.Points(starGeometry, starMaterial));

    const propeller = new THREE.Group();
    propeller.position.set(-8.65, 0.2, 0);
    hull.add(propeller);

    addMesh(propeller, new THREE.CylinderGeometry(0.45, 0.45, 0.5, 16), brightBrassMaterial, 0, 0, 0).rotation.z = Math.PI / 2;
    for (let bladeIndex = 0; bladeIndex < 4; bladeIndex++) {
      const blade = addMesh(
        propeller,
        new THREE.BoxGeometry(2.5, 0.12, 0.24),
        woodMaterial,
        0,
        0,
        0
      );
      blade.rotation.z = bladeIndex * Math.PI / 2;
      blade.rotation.y = 0.24;
    }

    const pennant = new THREE.Group();
    pennant.position.set(0, 14.1, 0);
    balloon.add(pennant);
    addMesh(pennant, new THREE.CylinderGeometry(0.055, 0.055, 1.9, 8), ropeMaterial, 0, 0.8, 0);
    const pennantGeo = new THREE.PlaneGeometry(2.0, 0.78, 8, 2);
    const pennantMesh = new THREE.Mesh(
      pennantGeo,
      new THREE.MeshStandardMaterial({
        color: 0x702d2d,
        roughness: 0.9,
        side: THREE.DoubleSide
      })
    );
    pennantMesh.position.set(0.92, 1.25, 0);
    pennantMesh.rotation.y = Math.PI / 2;
    pennant.add(pennantMesh);
    const pennantBase = new Float32Array(pennantGeo.attributes.position.array);

    const clock = new THREE.Clock();
    let elapsed = 0;

    function animate() {
      const delta = Math.min(clock.getDelta(), 0.05);
      elapsed += delta;

      controls.update();

      balloon.rotation.z = Math.sin(elapsed * 0.55) * 0.012;
      balloon.position.y = 11.1 + Math.sin(elapsed * 0.8) * 0.12;
      hull.rotation.z = Math.sin(elapsed * 0.55 + 0.7) * 0.008;
      hull.position.y = 0.4 + Math.sin(elapsed * 0.8 + 1.1) * 0.045;

      helm.rotation.z += delta * 0.32;
      propeller.rotation.x += delta * 1.8;

      for (const lantern of lanterns) {
        lantern.pivot.rotation.z = Math.sin(elapsed * 1.25 + lantern.phase) * 0.11;
        lantern.pivot.rotation.x = Math.cos(elapsed * 0.92 + lantern.phase) * 0.045;
      }

      const flagPositions = flagGeometry.attributes.position;
      for (let positionIndex = 0; positionIndex < flagPositions.count; positionIndex++) {
        const baseOffset = positionIndex * 3;
        const baseX = flagBasePositions[baseOffset];
        const wave = Math.sin(elapsed * 4.2 + baseX * 2.4 + flagBasePositions[baseOffset + 1] * 0.8);
        flagPositions.array[baseOffset + 2] = flagBasePositions[baseOffset + 2] + wave * 0.2 * (baseX / 1.75);
      }
      flagPositions.needsUpdate = true;

      const smallPositions = smallFlagGeometry.attributes.position;
      for (let positionIndex = 0; positionIndex < smallPositions.count; positionIndex++) {
        const baseOffset = positionIndex * 3;
        const baseX = smallFlagBase[baseOffset];
        smallPositions.array[baseOffset + 2] =
          smallFlagBase[baseOffset + 2] +
          Math.sin(elapsed * 4.6 + baseX * 3) * 0.11 * (baseX / 1.05);
      }
      smallPositions.needsUpdate = true;

      const pennantPositions = pennantGeo.attributes.position;
      for (let positionIndex = 0; positionIndex < pennantPositions.count; positionIndex++) {
        const baseOffset = positionIndex * 3;
        const baseX = pennantBase[baseOffset];
        pennantPositions.array[baseOffset + 2] =
          pennantBase[baseOffset + 2] +
          Math.sin(elapsed * 3.4 + baseX * 4.2) * 0.08 * (baseX / 1.0);
      }
      pennantPositions.needsUpdate = true;

      for (const cloud of cloudGroups) {
        cloud.cluster.position.x += cloud.speed * delta;
        cloud.cluster.position.z += Math.sin(elapsed * 0.11 + cloud.cluster.position.x) * delta * 0.08;
        if (cloud.cluster.position.x > 38) {
          cloud.cluster.position.x = -38;
        }
      }

      starGroup.rotation.y = Math.sin(elapsed * 0.03) * 0.015;

      renderer.render(scene, camera);
    }

    renderer.setAnimationLoop(animate);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
