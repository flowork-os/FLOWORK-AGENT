<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faceted Crystal Koi</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 38%, #21101a 0%, #08070d 52%, #020205 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06050a);
scene.fog = new THREE.FogExp2(0x08060c, 0.035);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.8, 4.2, 9.5);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.2, 0.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.62;
controls.minDistance = 7;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.78;

const ambient = new THREE.HemisphereLight(0x9fbaff, 0x240510, 1.45);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffffff, 4.2);
keyLight.position.set(5, 8, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -7;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 25;
keyLight.shadow.bias = -0.0003;
scene.add(keyLight);

const rubyLight = new THREE.PointLight(0xff1648, 18, 8, 2);
rubyLight.position.set(0.5, 0.15, -1.7);
scene.add(rubyLight);

const rimLight = new THREE.PointLight(0x80cfff, 24, 10, 2);
rimLight.position.set(-3.8, 3.2, 3.2);
scene.add(rimLight);

const warmRim = new THREE.SpotLight(0xff5070, 30, 18, Math.PI / 5, 0.6, 1.5);
warmRim.position.set(4, -1, -5);
warmRim.target.position.set(0, 0, 0);
scene.add(warmRim, warmRim.target);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(7.5, 64),
  new THREE.ShadowMaterial({ color: 0x17030b, opacity: 0.48 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.15;
floor.receiveShadow = true;
scene.add(floor);

const koi = new THREE.Group();
koi.rotation.z = -0.035;
scene.add(koi);

let randomState = 934761;
function random() {
  randomState = (randomState * 1664525 + 1013904223) >>> 0;
  return randomState / 4294967296;
}

function triangleGeometry(triangles, colorFunction) {
  const positions = [];
  const colors = [];

  for (let i = 0; i < triangles.length; i++) {
    const tri = triangles[i];
    const centroid = tri[0].clone().add(tri[1]).add(tri[2]).multiplyScalar(1 / 3);
    const color = colorFunction(centroid, i);

    for (const point of tri) {
      positions.push(point.x, point.y, point.z);
      colors.push(color.r, color.g, color.b);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  return geometry;
}

function bodyColor(point, index) {
  const tailFactor = THREE.MathUtils.smoothstep(point.x, -2.15, -0.45);
  const headFactor = THREE.MathUtils.smoothstep(point.x, 0.2, 2.25);
  const ruby = new THREE.Color(0x8d001f);
  const crimson = new THREE.Color(0xff194d);
  const pearl = new THREE.Color(0xffe7e6);
  const color = pearl.clone().lerp(ruby, tailFactor);
  color.lerp(crimson, headFactor * 0.28);
  const variation = 0.78 + ((index * 37) % 11) * 0.027;
  color.multiplyScalar(variation);
  return color;
}

function createBodyGeometry() {
  const ringCount = 13;
  const sides = 12;
  const rings = [];
  const profile = [
    [-2.08, 0.30, 0.28],
    [-1.82, 0.57, 0.49],
    [-1.50, 0.82, 0.67],
    [-1.15, 1.02, 0.81],
    [-0.76, 1.16, 0.91],
    [-0.34, 1.23, 0.96],
    [ 0.10, 1.22, 0.94],
    [ 0.52, 1.13, 0.88],
    [ 0.90, 0.99, 0.80],
    [ 1.24, 0.82, 0.70],
    [ 1.54, 0.66, 0.60],
    [ 1.80, 0.52, 0.49],
    [ 2.03, 0.35, 0.34]
  ];

  for (let r = 0; r < ringCount; r++) {
    const [x, radiusY, radiusZ] = profile[r];
    const ring = [];
    const angularOffset = (r % 2) * Math.PI / sides;

    for (let s = 0; s < sides; s++) {
      const angle = s / sides * Math.PI * 2 + angularOffset;
      const modulation = 0.94 + random() * 0.1;
      const y = Math.sin(angle) * radiusY * modulation;
      const z = Math.cos(angle) * radiusZ * modulation;
      const ridge = Math.sin(angle * 3 + r * 0.7) * 0.025;
      ring.push(new THREE.Vector3(x + ridge, y, z));
    }
    rings.push(ring);
  }

  const triangles = [];
  const backTip = new THREE.Vector3(-2.27, 0, 0);
  const noseTip = new THREE.Vector3(2.30, -0.015, 0);

  for (let s = 0; s < sides; s++) {
    const next = (s + 1) % sides;
    triangles.push([backTip, rings[0][next], rings[0][s]]);
  }

  for (let r = 0; r < ringCount - 1; r++) {
    for (let s = 0; s < sides; s++) {
      const next = (s + 1) % sides;
      const a = rings[r][s];
      const b = rings[r][next];
      const c = rings[r + 1][s];
      const d = rings[r + 1][next];

      if ((r + s) % 2 === 0) {
        triangles.push([a, b, d], [a, d, c]);
      } else {
        triangles.push([a, b, c], [b, d, c]);
      }
    }
  }

  for (let s = 0; s < sides; s++) {
    const next = (s + 1) % sides;
    triangles.push([rings[ringCount - 1][s], rings[ringCount - 1][next], noseTip]);
  }

  return triangleGeometry(triangles, bodyColor);
}

const bodyMaterial = new THREE.MeshPhysicalMaterial({
  vertexColors: true,
  roughness: 0.13,
  metalness: 0.03,
  transmission: 0.48,
  thickness: 1.9,
  attenuationColor: new THREE.Color(0xc9002f),
  attenuationDistance: 2.8,
  transparent: true,
  opacity: 0.96,
  clearcoat: 1,
  clearcoatRoughness: 0.08,
  reflectivity: 1,
  ior: 1.9,
  side: THREE.FrontSide
});

const body = new THREE.Mesh(createBodyGeometry(), bodyMaterial);
body.castShadow = true;
body.receiveShadow = true;
koi.add(body);

const bodyEdges = new THREE.LineSegments(
  new THREE.EdgesGeometry(body.geometry, 18),
  new THREE.LineBasicMaterial({
    color: 0xff9aa8,
    transparent: true,
    opacity: 0.18,
    blending: THREE.AdditiveBlending
  })
);
koi.add(bodyEdges);

function createFacetFan(center, boundary, options = {}) {
  const triangles = [];
  for (let i = 0; i < boundary.length; i++) {
    triangles.push([
      center,
      boundary[i],
      boundary[(i + 1) % boundary.length]
    ]);
  }

  const base = new THREE.Color(options.baseColor ?? 0xffd9dc);
  const tint = new THREE.Color(options.tintColor ?? 0x9edcff);
  const geometry = triangleGeometry(triangles, (point, index) => {
    const amount = 0.12 + ((index * 47) % 9) / 11;
    return base.clone().lerp(tint, amount * 0.48).multiplyScalar(0.88 + (index % 3) * 0.12);
  });

  const material = new THREE.MeshPhysicalMaterial({
    vertexColors: true,
    roughness: 0.08,
    metalness: 0.02,
    transmission: 0.76,
    thickness: 0.18,
    transparent: true,
    opacity: options.opacity ?? 0.72,
    clearcoat: 1,
    clearcoatRoughness: 0.05,
    ior: 1.62,
    iridescence: 1,
    iridescenceIOR: 1.35,
    iridescenceThicknessRange: [120, 520],
    side: THREE.DoubleSide,
    depthWrite: false
  });

  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;

  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geometry, 10),
    new THREE.LineBasicMaterial({
      color: options.edgeColor ?? 0xffeff2,
      transparent: true,
      opacity: 0.25,
      blending: THREE.AdditiveBlending
    })
  );
  mesh.add(edges);
  return mesh;
}

const upperTail = createFacetFan(
  new THREE.Vector3(-2.72, 0.76, 0.02),
  [
    new THREE.Vector3(-2.14, 0.04, 0.00),
    new THREE.Vector3(-3.04, 0.15, -0.08),
    new THREE.Vector3(-4.06, 0.68, -0.12),
    new THREE.Vector3(-4.32, 1.58, 0.02),
    new THREE.Vector3(-3.78, 2.03, 0.13),
    new THREE.Vector3(-3.00, 1.50, 0.09),
    new THREE.Vector3(-2.20, 0.46, 0.02)
  ],
  { baseColor: 0xffe8e8, tintColor: 0xaedbff, opacity: 0.7 }
);
koi.add(upperTail);

const lowerTail = createFacetFan(
  new THREE.Vector3(-2.82, -0.66, -0.02),
  [
    new THREE.Vector3(-2.16, -0.04, 0.00),
    new THREE.Vector3(-2.26, -0.42, -0.02),
    new THREE.Vector3(-3.10, -1.42, 0.08),
    new THREE.Vector3(-3.90, -1.82, 0.14),
    new THREE.Vector3(-4.38, -1.40, -0.02),
    new THREE.Vector3(-4.05, -0.56, -0.14),
    new THREE.Vector3(-3.08, -0.16, -0.08)
  ],
  { baseColor: 0xfff0ef, tintColor: 0xb0e7ff, opacity: 0.67 }
);
koi.add(lowerTail);

const dorsalFin = createFacetFan(
  new THREE.Vector3(-0.40, 1.24, 0),
  [
    new THREE.Vector3(-1.55, 0.76, 0.00),
    new THREE.Vector3(-1.28, 1.46, -0.04),
    new THREE.Vector3(-0.72, 2.14, 0.02),
    new THREE.Vector3(-0.04, 2.32, 0.07),
    new THREE.Vector3(0.56, 1.72, -0.03),
    new THREE.Vector3(0.82, 1.02, 0.00)
  ],
  { baseColor: 0xffbfc8, tintColor: 0xa9cfff, opacity: 0.62 }
);
koi.add(dorsalFin);

const leftPectoral = createFacetFan(
  new THREE.Vector3(0.62, -0.18, 0.70),
  [
    new THREE.Vector3(1.22, 0.10, 0.61),
    new THREE.Vector3(0.42, -0.55, 1.20),
    new THREE.Vector3(-0.28, -1.08, 1.85),
    new THREE.Vector3(-0.72, -0.80, 2.05),
    new THREE.Vector3(-0.28, -0.17, 1.44),
    new THREE.Vector3(0.34, 0.18, 0.83)
  ],
  { baseColor: 0xffcbd1, tintColor: 0x8fd8ff, opacity: 0.61 }
);
koi.add(leftPectoral);

const rightPectoral = createFacetFan(
  new THREE.Vector3(0.58, -0.20, -0.70),
  [
    new THREE.Vector3(1.18, 0.08, -0.61),
    new THREE.Vector3(0.36, -0.56, -1.18),
    new THREE.Vector3(-0.34, -1.03, -1.78),
    new THREE.Vector3(-0.76, -0.72, -1.94),
    new THREE.Vector3(-0.26, -0.14, -1.38),
    new THREE.Vector3(0.36, 0.18, -0.82)
  ],
  { baseColor: 0xffb9c4, tintColor: 0x8feeff, opacity: 0.54 }
);
koi.add(rightPectoral);

const lowerFin = createFacetFan(
  new THREE.Vector3(-0.86, -1.02, 0.03),
  [
    new THREE.Vector3(-1.47, -0.62, 0.02),
    new THREE.Vector3(-1.54, -1.22, -0.06),
    new THREE.Vector3(-1.18, -1.72, 0.03),
    new THREE.Vector3(-0.56, -1.82, 0.09),
    new THREE.Vector3(-0.20, -1.18, -0.03)
  ],
  { baseColor: 0xffd3d6, tintColor: 0xc1e4ff, opacity: 0.56 }
);
koi.add(lowerFin);

const eyeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x33000d,
  roughness: 0.08,
  metalness: 0.08,
  clearcoat: 1,
  clearcoatRoughness: 0.02,
  transmission: 0.15,
  thickness: 0.45,
  ior: 1.8
});

const eyeGeometry = new THREE.SphereGeometry(0.245, 12, 8);
for (const side of [-1, 1]) {
  const eye = new THREE.Mesh(eyeGeometry, eyeMaterial);
  eye.position.set(1.53, 0.37, side * 0.625);
  eye.scale.set(1, 1, 0.58);
  eye.castShadow = true;
  koi.add(eye);

  const glint = new THREE.Mesh(
    new THREE.SphereGeometry(0.055, 8, 6),
    new THREE.MeshBasicMaterial({ color: 0xfff5f2 })
  );
  glint.position.set(1.58, 0.46, side * 0.765);
  glint.scale.set(1, 1, 0.45);
  koi.add(glint);
}

const mouthMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x8e062b,
  roughness: 0.18,
  metalness: 0.12,
  clearcoat: 1,
  clearcoatRoughness: 0.08
});
const mouth = new THREE.Mesh(
  new THREE.TorusGeometry(0.19, 0.045, 6, 16),
  mouthMaterial
);
mouth.position.set(2.285, -0.18, 0);
mouth.rotation.y = Math.PI / 2;
mouth.scale.y = 0.58;
koi.add(mouth);

const gillMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xff6c82,
  emissive: 0x350008,
  roughness: 0.2,
  transparent: true,
  opacity: 0.72,
  clearcoat: 1
});
for (const side of [-1, 1]) {
  const gill = new THREE.Mesh(
    new THREE.TorusGeometry(0.47, 0.025, 5, 18, Math.PI * 1.18),
    gillMaterial
  );
  gill.position.set(1.12, -0.02, side * 0.735);
  gill.rotation.z = -0.45;
  if (side < 0) gill.rotation.y = Math.PI;
  koi.add(gill);
}

const sparkCount = 58;
const sparkPositions = [];
const sparkColors = [];
for (let i = 0; i < sparkCount; i++) {
  const x = -1.65 + random() * 3.25;
  const profile = Math.sqrt(Math.max(0, 1 - Math.pow((x + 0.05) / 2.15, 2)));
  const y = (random() * 2 - 1) * 0.72 * profile;
  const z = (random() * 2 - 1) * 0.53 * profile;
  sparkPositions.push(x, y, z);

  const hot = random();
  const color = new THREE.Color().setHSL(0.97 + hot * 0.03, 0.9, 0.47 + hot * 0.3);
  sparkColors.push(color.r, color.g, color.b);
}

const sparkGeometry = new THREE.BufferGeometry();
sparkGeometry.setAttribute('position', new THREE.Float32BufferAttribute(sparkPositions, 3));
sparkGeometry.setAttribute('color', new THREE.Float32BufferAttribute(sparkColors, 3));

const sparks = new THREE.Points(
  sparkGeometry,
  new THREE.PointsMaterial({
    size: 0.075,
    vertexColors: true,
    transparent: true,
    opacity: 0.95,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true
  })
);
koi.add(sparks);

const shardGeometry = new THREE.OctahedronGeometry(0.065, 0);
const shardMaterial = new THREE.MeshBasicMaterial({
  color: 0xff214f,
  transparent: true,
  opacity: 0.85,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
for (let i = 0; i < 18; i++) {
  const shard = new THREE.Mesh(shardGeometry, shardMaterial);
  const x = -1.45 + random() * 2.7;
  const profile = Math.sqrt(Math.max(0, 1 - Math.pow(x / 2.0, 2)));
  shard.position.set(
    x,
    (random() * 2 - 1) * 0.57 * profile,
    (random() * 2 - 1) * 0.43 * profile
  );
  shard.scale.setScalar(0.55 + random() * 1.15);
  shard.rotation.set(random() * Math.PI, random() * Math.PI, random() * Math.PI);
  koi.add(shard);
}

const flareColors = [0xff365e, 0xffbd42, 0x5affcf, 0x5a8cff, 0xd76cff];
const flarePositions = [
  [-3.84, 1.53, 0.12],
  [-3.98, -1.27, 0.05],
  [-0.16, 2.12, 0.10],
  [-0.58, -0.83, 1.92],
  [-0.52, -0.75, -1.83]
];
const flares = [];
for (let i = 0; i < flarePositions.length; i++) {
  const flare = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.055, 0),
    new THREE.MeshBasicMaterial({
      color: flareColors[i],
      transparent: true,
      opacity: 0.9,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    })
  );
  flare.position.set(...flarePositions[i]);
  koi.add(flare);
  flares.push(flare);
}

const haloGeometry = new THREE.TorusGeometry(4.5, 0.012, 3, 96);
const haloMaterial = new THREE.MeshBasicMaterial({
  color: 0x7e1935,
  transparent: true,
  opacity: 0.14,
  blending: THREE.AdditiveBlending
});
const halo = new THREE.Mesh(haloGeometry, haloMaterial);
halo.rotation.x = Math.PI / 2;
halo.position.y = -2.03;
scene.add(halo);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  koi.position.y = 0.10 + Math.sin(time * 0.72) * 0.075;
  koi.rotation.y = Math.sin(time * 0.48) * 0.035;
  koi.rotation.z = -0.035 + Math.sin(time * 0.63) * 0.012;

  sparks.material.opacity = 0.72 + Math.sin(time * 2.3) * 0.18;
  rubyLight.intensity = 17 + Math.sin(time * 1.7) * 3;

  for (let i = 0; i < flares.length; i++) {
    const pulse = 0.75 + Math.sin(time * 2.1 + i * 1.37) * 0.35;
    flares[i].scale.setScalar(pulse);
    flares[i].rotation.x = time * (0.4 + i * 0.03);
    flares[i].rotation.y = time * (0.6 - i * 0.025);
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
