<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Standing Person — Procedural three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16171b; }
  #app { position: fixed; inset: 0; }
  .hint {
    position: fixed; left: 12px; bottom: 10px;
    font: 12px/1.4 system-ui, sans-serif; color: #8a8f98;
    letter-spacing: .02em; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">drag to orbit · scroll to zoom · figure auto-rotates</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------- Renderer */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

/* ------------------------------------------------------------------- Scene */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16171b);

// Subtle studio reflections for believable PBR shading
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;

/* ------------------------------------------------------------------ Camera */
const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0.4, 1.35, 3.6);

/* ---------------------------------------------------------------- Controls */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.target.set(0, 1.0, 0);
controls.minDistance = 1.8;
controls.maxDistance = 8;
controls.minPolarAngle = 0.15;
controls.maxPolarAngle = Math.PI * 0.52;

/* ---------------------------------------------------------------- Lighting */
const hemi = new THREE.HemisphereLight(0x9fb2c8, 0x1c1d22, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e6, 2.4);
key.position.set(2.6, 4.6, 3.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 5;
key.shadow.bias = -0.0004;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 16;
key.shadow.camera.left = -1.8;
key.shadow.camera.right = 1.8;
key.shadow.camera.top = 2.4;
key.shadow.camera.bottom = -0.3;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9db4d6, 0.6);
fill.position.set(-3.5, 1.8, 2.2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xbfd0ff, 1.3);
rim.position.set(-2.0, 3.4, -4.2);
scene.add(rim);

/* ------------------------------------------------------------ Ground plane */
// Only receives shadows — invisible except for the soft contact shadow.
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.45 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* --------------------------------------------------------------- Materials */
const skinMat    = new THREE.MeshStandardMaterial({ color: 0xd8a17b, roughness: 0.72, metalness: 0.0 });
const hairMat    = new THREE.MeshStandardMaterial({ color: 0x33281f, roughness: 0.55, metalness: 0.0, side: THREE.DoubleSide });
const jacketMat  = new THREE.MeshStandardMaterial({ color: 0x3f5468, roughness: 0.7,  metalness: 0.0 });
const jacketDk   = new THREE.MeshStandardMaterial({ color: 0x2a3846, roughness: 0.65, metalness: 0.05 });
const shirtMat   = new THREE.MeshStandardMaterial({ color: 0xdadbd6, roughness: 0.9,  metalness: 0.0 });
const jeansMat   = new THREE.MeshStandardMaterial({ color: 0x3a597a, roughness: 0.92, metalness: 0.0 });
const sneakerMat = new THREE.MeshStandardMaterial({ color: 0xeef0f2, roughness: 0.55, metalness: 0.0 });
const midMat     = new THREE.MeshStandardMaterial({ color: 0xf7f8fa, roughness: 0.5,  metalness: 0.0 });
const soleMat    = new THREE.MeshStandardMaterial({ color: 0xb7bac1, roughness: 0.7,  metalness: 0.0 });
const laceMat    = new THREE.MeshStandardMaterial({ color: 0x555b63, roughness: 0.7,  metalness: 0.0 });
const eyeMat     = new THREE.MeshStandardMaterial({ color: 0x1b1c22, roughness: 0.35, metalness: 0.0 });
const mouthMat   = new THREE.MeshStandardMaterial({ color: 0x8a4d47, roughness: 0.6,  metalness: 0.0 });

/* ----------------------------------------------------------------- Helpers */
const UP = new THREE.Vector3(0, 1, 0);

function makeMesh(geo, mat, pos, scale) {
  const m = new THREE.Mesh(geo, mat);
  if (pos)   m.position.set(pos[0], pos[1], pos[2]);
  if (scale) {
    if (typeof scale === 'number') m.scale.setScalar(scale);
    else m.scale.set(scale[0], scale[1], scale[2]);
  }
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// A capsule spanning two 3D points (endpoints are the capsule tips).
function capsuleBetween(p1, p2, r, mat) {
  const a = new THREE.Vector3(p1[0], p1[1], p1[2]);
  const b = new THREE.Vector3(p2[0], p2[1], p2[2]);
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const cylLen = Math.max(0.001, len - 2 * r);
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, cylLen, 8, 18), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(UP, dir.normalize());
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

/* ------------------------------------------------------------- The figure */
const figure = new THREE.Group();

/* --- Torso (jacket) --- */
const torso = makeMesh(
  new THREE.CylinderGeometry(0.20, 0.185, 0.52, 30, 1, false),
  jacketMat, [0, 1.20, 0], [1, 1, 0.66]
);
figure.add(torso);

// upper-chest rounding
figure.add(makeMesh(new THREE.SphereGeometry(0.205, 24, 18), jacketMat, [0, 1.36, 0], [1, 0.78, 0.66]));
// shoulders
figure.add(makeMesh(new THREE.SphereGeometry(0.082, 20, 16), jacketMat, [ 0.175, 1.44, 0], [1, 1, 0.85]));
figure.add(makeMesh(new THREE.SphereGeometry(0.082, 20, 16), jacketMat, [-0.175, 1.44, 0], [1, 1, 0.85]));

// tee visible at the collar opening
figure.add(makeMesh(new THREE.CylinderGeometry(0.062, 0.07, 0.14, 20), shirtMat, [0, 1.41, 0.0], [1, 1, 0.75]));
// jacket collar
const collar = makeMesh(new THREE.TorusGeometry(0.072, 0.026, 14, 26), jacketMat, [0, 1.45, 0.01], [1, 1, 0.7]);
collar.rotation.x = Math.PI / 2;
figure.add(collar);
// zipper line
figure.add(makeMesh(new THREE.BoxGeometry(0.014, 0.45, 0.014), jacketDk, [0, 1.19, 0.127]));
// front pockets
figure.add(makeMesh(new THREE.BoxGeometry(0.075, 0.09, 0.02), jacketDk, [ 0.092, 1.06, 0.118], [1, 1, 1]));
figure.add(makeMesh(new THREE.BoxGeometry(0.075, 0.09, 0.02), jacketDk, [-0.092, 1.06, 0.118], [1, 1, 1]));

/* --- Pelvis (jeans waist) --- */
figure.add(makeMesh(new THREE.CylinderGeometry(0.158, 0.15, 0.24, 26), jeansMat, [0, 0.98, 0], [1, 1, 0.72]));
// belt hint
figure.add(makeMesh(new THREE.CylinderGeometry(0.16, 0.158, 0.03, 26), jacketDk, [0, 1.07, 0], [1, 1, 0.73]));

/* --- Neck --- */
figure.add(makeMesh(new THREE.CylinderGeometry(0.05, 0.058, 0.18, 20), skinMat, [0, 1.47, 0.005]));

/* --- Head --- */
const head = new THREE.Group();
head.position.set(0, 1.655, 0.005);
head.scale.set(1, 1.06, 1.02);

head.add(makeMesh(new THREE.SphereGeometry(0.115, 32, 28), skinMat, [0, 0, 0]));

// hair — back / sides / crown (everything but the face wedge)
const backHair = makeMesh(
  new THREE.SphereGeometry(0.123, 30, 26, Math.PI / 2 + 0.85, Math.PI * 2 - 1.7, 0, Math.PI * 0.85),
  hairMat, [0, 0, 0]
);
head.add(backHair);
// hair — front crown down to the hairline
const frontHair = makeMesh(
  new THREE.SphereGeometry(0.123, 30, 20, Math.PI / 2 - 0.85, 1.7, 0, Math.PI * 0.36),
  hairMat, [0, 0.002, 0]
);
head.add(frontHair);

// eyes
head.add(makeMesh(new THREE.SphereGeometry(0.017, 16, 16), eyeMat, [ 0.043, 0.015, 0.100], [1, 1, 0.55]));
head.add(makeMesh(new THREE.SphereGeometry(0.017, 16, 16), eyeMat, [-0.043, 0.015, 0.100], [1, 1, 0.55]));
// eyebrows
head.add(makeMesh(new THREE.BoxGeometry(0.05, 0.01, 0.012), hairMat, [ 0.043, 0.045, 0.101]));
head.add(makeMesh(new THREE.BoxGeometry(0.05, 0.01, 0.012), hairMat, [-0.043, 0.045, 0.101]));
// nose
head.add(makeMesh(new THREE.BoxGeometry(0.022, 0.07, 0.03), skinMat, [0, -0.01, 0.112], [1, 1, 1]));
head.add(makeMesh(new THREE.SphereGeometry(0.019, 16, 16), skinMat, [0, -0.038, 0.114], [1.1, 0.9, 1.1]));
// mouth
head.add(makeMesh(new THREE.BoxGeometry(0.04, 0.009, 0.012), mouthMat, [0, -0.062, 0.098]));
// ears
head.add(makeMesh(new THREE.SphereGeometry(0.026, 16, 16), skinMat, [ 0.113, 0.0, -0.006], [0.45, 1.1, 0.85]));
head.add(makeMesh(new THREE.SphereGeometry(0.026, 16, 16), skinMat, [-0.113, 0.0, -0.006], [0.45, 1.1, 0.85]));

figure.add(head);

/* --- Arms (jacket sleeves + hands) --- */
for (const s of [-1, 1]) {
  const shoulder = [0.175 * s, 1.44, 0.0];
  const elbow    = [0.240 * s, 1.12, 0.03];
  const wrist    = [0.225 * s, 0.85, 0.075];

  figure.add(capsuleBetween(shoulder, elbow, 0.062, jacketMat));
  figure.add(capsuleBetween(elbow, wrist, 0.052, jacketMat));
  // sleeve cuff
  figure.add(makeMesh(new THREE.SphereGeometry(0.055, 16, 14), jacketDk,
    [wrist[0], wrist[1] + 0.01, wrist[2]], [1, 0.5, 1]));

  // hand oriented along the forearm
  const eb = new THREE.Vector3(elbow[0], elbow[1], elbow[2]);
  const wr = new THREE.Vector3(wrist[0], wrist[1], wrist[2]);
  const dir = new THREE.Vector3().subVectors(wr, eb).normalize();
  const handPos = wr.clone().add(dir.clone().multiplyScalar(0.055));
  const hand = makeMesh(new THREE.SphereGeometry(0.05, 18, 16), skinMat);
  hand.scale.set(0.78, 1.28, 0.5);
  hand.position.copy(handPos);
  hand.quaternion.setFromUnitVectors(UP, dir);
  figure.add(hand);
}

/* --- Legs (jeans) + sneakers --- */
function makeFoot() {
  const g = new THREE.Group();
  g.add(makeMesh(new THREE.BoxGeometry(0.108, 0.05, 0.27), soleMat,    [0, 0.026, 0.05]));
  g.add(makeMesh(new THREE.BoxGeometry(0.112, 0.022, 0.272), midMat,   [0, 0.058, 0.05]));
  g.add(makeMesh(new THREE.SphereGeometry(0.06, 22, 18), sneakerMat,   [0, 0.09, 0.03],  [0.82, 1.0, 1.8]));   // upper
  g.add(makeMesh(new THREE.SphereGeometry(0.05, 20, 16), sneakerMat,   [0, 0.06, 0.165], [0.9, 0.72, 0.95]));  // toe cap
  g.add(makeMesh(new THREE.SphereGeometry(0.052, 20, 16), sneakerMat,  [0, 0.12, -0.055],[0.95, 1.18, 0.95])); // heel collar
  g.add(makeMesh(new THREE.BoxGeometry(0.06, 0.02, 0.06), sneakerMat,  [0, 0.135, 0.0]));                      // tongue
  for (let i = 0; i < 3; i++) {
    g.add(makeMesh(new THREE.BoxGeometry(0.072, 0.008, 0.012), laceMat, [0, 0.146 - i * 0.006, 0.02 + i * 0.032]));
  }
  return g;
}

for (const s of [-1, 1]) {
  const hip   = [0.095 * s, 0.95, 0.0];
  const knee  = [0.105 * s, 0.49, 0.02];
  const ankle = [0.100 * s, 0.11, 0.0];

  figure.add(capsuleBetween(hip, knee, 0.092, jeansMat));
  figure.add(capsuleBetween(knee, ankle, 0.062, jeansMat));

  const foot = makeFoot();
  foot.position.set(0.10 * s, 0, 0.0);
  foot.rotation.y = -0.12 * s; // toes slightly out
  figure.add(foot);
}

scene.add(figure);

/* ------------------------------------------------------------------ Resize */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

/* -------------------------------------------------------------------- Loop */
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
