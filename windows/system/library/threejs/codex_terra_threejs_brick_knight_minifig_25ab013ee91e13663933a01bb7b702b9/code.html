<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brick Knight</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #11151d; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11151d);
scene.fog = new THREE.Fog(0x11151d, 12, 24);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(7.4, 5.5, 9.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.55, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 6;
controls.maxDistance = 15;

const knight = new THREE.Group();
scene.add(knight);

const plastic = (color, roughness = 0.2, metalness = 0) => new THREE.MeshStandardMaterial({
  color,
  roughness,
  metalness,
  envMapIntensity: 0.9
});

const red = plastic(0x9f1d22, 0.18);
const darkRed = plastic(0x5e1015, 0.24);
const gold = plastic(0xd6a63c, 0.18, 0.42);
const steel = plastic(0x78818a, 0.2, 0.65);
const darkSteel = plastic(0x303842, 0.24, 0.75);
const black = plastic(0x11141a, 0.28, 0.25);
const visor = plastic(0x121820, 0.11, 0.8);
const leather = plastic(0x59351e, 0.3);
const floorMat = new THREE.MeshStandardMaterial({ color: 0x252c37, roughness: 0.72, metalness: 0.08 });

function box(parent, w, h, d, material, x, y, z, bevel = false) {
  const geometry = new THREE.BoxGeometry(w, h, d, bevel ? 2 : 1, bevel ? 2 : 1, bevel ? 2 : 1);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function cylinder(parent, radiusTop, radiusBottom, height, material, x, y, z, radial = 32) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, radial), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function stud(parent, x, y, z, material, radius = 0.22, height = 0.12) {
  return cylinder(parent, radius, radius, height, material, x, y, z, 24);
}

function roundedBrick(parent, w, h, d, material, x, y, z) {
  box(parent, w, h, d, material, x, y, z);
  const edge = Math.min(w, d) * 0.16;
  cylinder(parent, edge, edge, h, material, x - w / 2 + edge, y, z - d / 2 + edge, 16);
  cylinder(parent, edge, edge, h, material, x + w / 2 - edge, y, z - d / 2 + edge, 16);
  cylinder(parent, edge, edge, h, material, x - w / 2 + edge, y, z + d / 2 - edge, 16);
  cylinder(parent, edge, edge, h, material, x + w / 2 - edge, y, z + d / 2 - edge, 16);
}

const torso = new THREE.Group();
knight.add(torso);

roundedBrick(torso, 1.78, 1.55, 0.84, red, 0, 2.55, 0);
box(torso, 1.84, 0.12, 0.9, darkRed, 0, 1.82, 0);
box(torso, 1.88, 0.13, 0.92, gold, 0, 3.3, 0.02);

const chestPlate = new THREE.Group();
chestPlate.position.set(0, 2.63, 0.458);
torso.add(chestPlate);
box(chestPlate, 1.28, 0.98, 0.055, darkSteel, 0, 0.03, 0);
box(chestPlate, 1.16, 0.86, 0.062, steel, 0, 0.03, 0.03);
box(chestPlate, 0.86, 0.09, 0.075, gold, 0, 0.34, 0.07);
box(chestPlate, 0.76, 0.08, 0.075, gold, 0, -0.32, 0.07);
box(chestPlate, 0.12, 0.58, 0.075, gold, 0, 0.0, 0.07);
box(chestPlate, 0.52, 0.09, 0.075, gold, 0, 0.02, 0.05);
for (const x of [-0.47, 0.47]) {
  const rivet = cylinder(chestPlate, 0.065, 0.065, 0.055, gold, x, 0.29, 0.085, 16);
  rivet.rotation.x = Math.PI / 2;
}

const belt = new THREE.Group();
torso.add(belt);
box(belt, 1.91, 0.23, 0.96, darkSteel, 0, 1.92, 0);
box(belt, 0.38, 0.32, 0.08, gold, 0, 1.92, 0.52);
box(belt, 0.17, 0.17, 0.09, darkSteel, 0, 1.92, 0.575);

const neck = cylinder(knight, 0.41, 0.41, 0.24, darkSteel, 0, 3.47, 0);
stud(knight, 0, 3.62, 0, gold, 0.28, 0.1);

const head = new THREE.Group();
knight.add(head);
cylinder(head, 0.58, 0.58, 0.76, black, 0, 3.93, 0, 32);
cylinder(head, 0.69, 0.69, 0.2, steel, 0, 4.28, 0, 32);
cylinder(head, 0.64, 0.64, 0.62, steel, 0, 4.56, 0, 32);
cylinder(head, 0.51, 0.51, 0.18, steel, 0, 4.93, 0, 32);
stud(head, 0, 5.08, 0, darkSteel, 0.18, 0.12);

const helmetBrim = cylinder(head, 0.77, 0.77, 0.13, darkSteel, 0, 4.23, 0.02, 32);
helmetBrim.scale.z = 1.12;

box(head, 0.9, 0.22, 0.085, visor, 0, 4.55, 0.6);
box(head, 0.11, 0.31, 0.09, steel, -0.38, 4.49, 0.61);
box(head, 0.11, 0.31, 0.09, steel, 0.38, 4.49, 0.61);
box(head, 0.17, 0.13, 0.08, steel, 0, 4.39, 0.61);

for (const x of [-0.37, 0, 0.37]) {
  box(head, 0.08, 0.1, 0.04, black, x, 4.54, 0.655);
}

const plume = new THREE.Group();
head.add(plume);
box(plume, 0.25, 0.62, 0.32, darkRed, 0, 5.36, 0.02);
cylinder(plume, 0.21, 0.14, 0.37, red, 0, 5.76, 0.02, 20);

function makeArm(side) {
  const arm = new THREE.Group();
  knight.add(arm);
  arm.position.set(side * 1.18, 2.77, 0);

  cylinder(arm, 0.36, 0.36, 0.25, darkSteel, 0, 0.58, 0, 24);
  const shoulderStud = stud(arm, 0, 0.75, 0, steel, 0.21, 0.12);
  shoulderStud.rotation.z = 0;

  box(arm, 0.56, 1.12, 0.62, red, 0, -0.02, 0);
  box(arm, 0.6, 0.11, 0.66, darkRed, 0, -0.55, 0);
  cylinder(arm, 0.28, 0.28, 0.16, darkSteel, 0, -0.63, 0, 24);

  const hand = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.095, 14, 28, Math.PI * 1.48), steel);
  hand.position.set(0, -0.88, 0.03);
  hand.rotation.y = Math.PI / 2;
  hand.rotation.z = side > 0 ? 0.5 : Math.PI - 0.5;
  hand.castShadow = true;
  arm.add(hand);

  return arm;
}

const swordArm = makeArm(-1);
swordArm.rotation.z = 0.22;
swordArm.rotation.x = -0.08;

const shieldArm = makeArm(1);
shieldArm.rotation.z = -0.12;
shieldArm.rotation.x = 0.08;

const sword = new THREE.Group();
knight.add(sword);
sword.position.set(-1.62, 1.89, 0.08);
sword.rotation.z = -0.2;
sword.rotation.x = -0.08;

cylinder(sword, 0.1, 0.1, 0.68, leather, 0, 0, 0, 18);
const pommel = cylinder(sword, 0.18, 0.18, 0.12, gold, 0, -0.38, 0, 20);
const crossguard = cylinder(sword, 0.1, 0.1, 0.96, gold, 0, 0.34, 0, 20);
crossguard.rotation.z = Math.PI / 2;

const bladeShape = new THREE.Shape();
bladeShape.moveTo(-0.23, 0.4);
bladeShape.lineTo(-0.23, 1.8);
bladeShape.lineTo(0, 2.12);
bladeShape.lineTo(0.23, 1.8);
bladeShape.lineTo(0.23, 0.4);
bladeShape.lineTo(-0.23, 0.4);
const bladeGeometry = new THREE.ExtrudeGeometry(bladeShape, {
  depth: 0.11,
  bevelEnabled: true,
  bevelSegments: 2,
  bevelSize: 0.018,
  bevelThickness: 0.018
});
const blade = new THREE.Mesh(bladeGeometry, steel);
blade.position.set(0, 0, -0.055);
blade.castShadow = true;
blade.receiveShadow = true;
sword.add(blade);
box(sword, 0.045, 1.44, 0.025, darkSteel, 0, 1.17, 0.065);

const shield = new THREE.Group();
knight.add(shield);
shield.position.set(1.57, 2.13, 0.24);
shield.rotation.z = -0.16;
shield.rotation.y = -0.24;

const shieldShape = new THREE.Shape();
shieldShape.moveTo(-0.66, 0.54);
shieldShape.lineTo(-0.66, -0.34);
shieldShape.quadraticCurveTo(-0.44, -0.82, 0, -1.02);
shieldShape.quadraticCurveTo(0.44, -0.82, 0.66, -0.34);
shieldShape.lineTo(0.66, 0.54);
shieldShape.quadraticCurveTo(0, 0.78, -0.66, 0.54);
const shieldGeometry = new THREE.ExtrudeGeometry(shieldShape, {
  depth: 0.16,
  bevelEnabled: true,
  bevelSegments: 3,
  bevelSize: 0.055,
  bevelThickness: 0.04
});
const shieldMesh = new THREE.Mesh(shieldGeometry, darkSteel);
shieldMesh.position.z = -0.08;
shieldMesh.castShadow = true;
shieldMesh.receiveShadow = true;
shield.add(shieldMesh);

const shieldFace = new THREE.Mesh(shieldGeometry.clone(), red);
shieldFace.scale.set(0.86, 0.86, 0.5);
shieldFace.position.set(0, -0.04, 0.075);
shieldFace.castShadow = true;
shield.add(shieldFace);

const shieldBoss = cylinder(shield, 0.2, 0.2, 0.12, gold, 0, -0.06, 0.19, 24);
shieldBoss.rotation.x = Math.PI / 2;
box(shield, 0.12, 0.98, 0.04, gold, 0, -0.04, 0.22);
box(shield, 0.87, 0.11, 0.04, gold, 0, -0.04, 0.22);

function makeLeg(side) {
  const leg = new THREE.Group();
  knight.add(leg);
  leg.position.set(side * 0.48, 0.94, 0);

  box(leg, 0.78, 1.3, 0.83, darkSteel, 0, 0.43, 0);
  box(leg, 0.82, 0.12, 0.87, steel, 0, 1.05, 0);
  box(leg, 0.85, 0.25, 1.02, black, 0, -0.25, 0.1);
  stud(leg, 0, 1.19, 0, steel, 0.19, 0.1);
  return leg;
}

makeLeg(-1);
makeLeg(1);

const hip = new THREE.Group();
knight.add(hip);
box(hip, 1.77, 0.35, 0.88, darkSteel, 0, 1.48, 0);
box(hip, 0.16, 0.37, 0.92, black, 0, 1.46, 0);

const floor = new THREE.Mesh(new THREE.CircleGeometry(7.2, 80), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.42;
floor.receiveShadow = true;
scene.add(floor);

const keyLight = new THREE.DirectionalLight(0xfff1d4, 4.2);
keyLight.position.set(5, 8, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -7;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 20;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x7da6ff, 2.1);
rimLight.position.set(-5, 4, -6);
scene.add(rimLight);

const fillLight = new THREE.HemisphereLight(0x9bb8e8, 0x24212c, 2.1);
scene.add(fillLight);

const warmLight = new THREE.PointLight(0xffb35c, 18, 12, 2);
warmLight.position.set(-3.5, 3.2, 4);
scene.add(warmLight);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
