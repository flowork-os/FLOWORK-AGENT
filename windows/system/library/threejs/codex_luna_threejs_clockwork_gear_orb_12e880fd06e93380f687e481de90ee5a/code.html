<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brass Clockwork Orb</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090a0b;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08090a);
scene.fog = new THREE.Fog(0x08090a, 13, 25);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.2, 5.4, 9.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 6.5;
controls.maxDistance = 17;
controls.target.set(0, 0.15, 0);

const brass = new THREE.MeshStandardMaterial({
  color: 0x9a6b2d,
  metalness: 0.88,
  roughness: 0.28
});
const brightBrass = new THREE.MeshStandardMaterial({
  color: 0xc18a3e,
  metalness: 0.94,
  roughness: 0.2
});
const agedBrass = new THREE.MeshStandardMaterial({
  color: 0x654923,
  metalness: 0.86,
  roughness: 0.4
});
const copper = new THREE.MeshStandardMaterial({
  color: 0x9b4c2d,
  metalness: 0.9,
  roughness: 0.26
});
const darkMetal = new THREE.MeshStandardMaterial({
  color: 0x25211b,
  metalness: 0.9,
  roughness: 0.3
});
const coreMaterial = new THREE.MeshStandardMaterial({
  color: 0xe1a948,
  metalness: 1,
  roughness: 0.12
});

scene.add(new THREE.HemisphereLight(0x9eacbf, 0x17110b, 1.25));

const keyLight = new THREE.DirectionalLight(0xffd59a, 4.2);
keyLight.position.set(6, 9, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -8;
keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -8;
scene.add(keyLight);

const rimLight = new THREE.PointLight(0x6d8db7, 38, 18, 2);
rimLight.position.set(-6, 3.5, -5);
scene.add(rimLight);

const warmLight = new THREE.PointLight(0xff8c42, 24, 13, 2);
warmLight.position.set(4, -3, 4);
scene.add(warmLight);

function orientToNormal(object, normal) {
  const axis = new THREE.Vector3(0, 0, 1);
  object.quaternion.setFromUnitVectors(axis, normal.clone().normalize());
}

function addBolt(parent, x, y, radius, material) {
  const bolt = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, 0.08, 12),
    material
  );
  bolt.rotation.x = Math.PI / 2;
  bolt.position.set(x, y, 0.12);
  bolt.castShadow = true;
  parent.add(bolt);
}

function makeGear(radius, teeth, depth, material, normal, position, scale = 1) {
  const gear = new THREE.Group();
  const rootRadius = radius * 0.79;
  const toothLength = radius * 0.24;
  const toothWidth = Math.max(0.12, radius * 0.25);
  const toothDepth = depth * 1.12;

  const wheel = new THREE.Mesh(
    new THREE.CylinderGeometry(rootRadius, rootRadius, depth, 48),
    material
  );
  wheel.rotation.x = Math.PI / 2;
  wheel.castShadow = true;
  wheel.receiveShadow = true;
  gear.add(wheel);

  for (let i = 0; i < teeth; i++) {
    const angle = i * Math.PI * 2 / teeth;
    const tooth = new THREE.Mesh(
      new THREE.BoxGeometry(toothLength, toothWidth, toothDepth),
      material
    );
    tooth.position.set(
      Math.cos(angle) * (rootRadius + toothLength * 0.37),
      Math.sin(angle) * (rootRadius + toothLength * 0.37),
      0
    );
    tooth.rotation.z = angle;
    tooth.castShadow = true;
    tooth.receiveShadow = true;
    gear.add(tooth);
  }

  const spokeMaterial = material === copper ? agedBrass : darkMetal;
  for (let i = 0; i < 6; i++) {
    const spoke = new THREE.Mesh(
      new THREE.BoxGeometry(radius * 1.2, radius * 0.11, depth * 0.72),
      spokeMaterial
    );
    spoke.rotation.z = i * Math.PI / 3;
    spoke.castShadow = true;
    gear.add(spoke);
  }

  const hub = new THREE.Mesh(
    new THREE.CylinderGeometry(radius * 0.22, radius * 0.22, depth * 1.35, 24),
    brightBrass
  );
  hub.rotation.x = Math.PI / 2;
  hub.castShadow = true;
  gear.add(hub);

  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2 + Math.PI / 4;
    addBolt(gear, Math.cos(a) * radius * 0.48, Math.sin(a) * radius * 0.48, radius * 0.045, agedBrass);
  }

  gear.scale.setScalar(scale);
  orientToNormal(gear, normal);
  gear.position.copy(position);
  return gear;
}

function makeRing(radius, tube, material, normal, rotation = 0) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(radius, tube, 16, 96),
    material
  );
  orientToNormal(ring, normal);
  ring.rotateZ(rotation);
  ring.castShadow = true;
  ring.receiveShadow = true;
  return ring;
}

const orb = new THREE.Group();
scene.add(orb);

const shellRings = [
  { n: new THREE.Vector3(0.05, 1, 0.1), r: 3.72, t: 0.13, m: brightBrass },
  { n: new THREE.Vector3(1, 0.12, 0.08), r: 3.74, t: 0.105, m: agedBrass },
  { n: new THREE.Vector3(0.28, 0.42, 1), r: 3.76, t: 0.12, m: brass },
  { n: new THREE.Vector3(-0.62, 0.68, 0.39), r: 3.69, t: 0.09, m: copper },
  { n: new THREE.Vector3(0.74, -0.35, 0.58), r: 3.7, t: 0.085, m: brightBrass }
];

for (const item of shellRings) {
  orb.add(makeRing(item.r, item.t, item.m, item.n, 0.18));
}

const gearData = [
  [1.34, 13, 0.25, brass, new THREE.Vector3(0.14, 0.91, 0.38), new THREE.Vector3(0.55, 2.72, 2.15), 1],
  [1.08, 11, 0.24, copper, new THREE.Vector3(-0.74, 0.46, 0.48), new THREE.Vector3(-2.58, 1.55, 1.82), 1],
  [1.18, 12, 0.23, brightBrass, new THREE.Vector3(0.8, 0.22, 0.55), new THREE.Vector3(2.86, 0.82, 1.96), 1],
  [0.92, 10, 0.22, agedBrass, new THREE.Vector3(-0.2, -0.84, 0.51), new THREE.Vector3(-0.65, -2.95, 1.82), 1],
  [1.02, 12, 0.2, brass, new THREE.Vector3(0.42, -0.5, -0.76), new THREE.Vector3(1.6, -1.88, -2.86), 1],
  [0.8, 9, 0.2, copper, new THREE.Vector3(-0.78, -0.31, -0.54), new THREE.Vector3(-2.85, -1.12, -1.92), 1],
  [0.72, 9, 0.18, brightBrass, new THREE.Vector3(0.12, 0.1, -0.99), new THREE.Vector3(0.42, 0.35, -3.43), 1],
  [0.7, 8, 0.17, agedBrass, new THREE.Vector3(-0.26, 0.9, -0.36), new THREE.Vector3(-0.94, 3.22, -1.28), 1]
];

for (const data of gearData) {
  orb.add(makeGear(data[0], data[1], data[2], data[3], data[4], data[5], data[6]));
}

const innerFrame = new THREE.Group();
orb.add(innerFrame);

const core = new THREE.Mesh(new THREE.SphereGeometry(0.72, 40, 24), coreMaterial);
core.castShadow = true;
innerFrame.add(core);

const coreBand = makeRing(0.91, 0.055, copper, new THREE.Vector3(0, 1, 0));
innerFrame.add(coreBand);

const coreBandTwo = makeRing(1.02, 0.045, brightBrass, new THREE.Vector3(1, 0.18, 0.1));
innerFrame.add(coreBandTwo);

const centralPin = new THREE.Mesh(
  new THREE.CylinderGeometry(0.12, 0.12, 2.2, 20),
  darkMetal
);
centralPin.rotation.z = Math.PI / 2;
centralPin.castShadow = true;
innerFrame.add(centralPin);

for (let i = 0; i < 12; i++) {
  const angle = i * Math.PI * 2 / 12;
  const bead = new THREE.Mesh(
    new THREE.SphereGeometry(0.095, 12, 8),
    brightBrass
  );
  bead.position.set(Math.cos(angle) * 1.13, Math.sin(angle) * 1.13, 0.08);
  bead.castShadow = true;
  innerFrame.add(bead);
}

const axle = new THREE.Mesh(
  new THREE.CylinderGeometry(0.14, 0.14, 7.1, 24),
  agedBrass
);
axle.rotation.z = Math.PI / 2;
axle.castShadow = true;
orb.add(axle);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(30, 96),
  new THREE.MeshStandardMaterial({ color: 0x0a0b0c, metalness: 0.25, roughness: 0.72 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -4.25;
floor.receiveShadow = true;
scene.add(floor);

const pedestal = new THREE.Mesh(
  new THREE.CylinderGeometry(2.25, 2.6, 0.28, 64),
  darkMetal
);
pedestal.position.y = -4.1;
pedestal.castShadow = true;
pedestal.receiveShadow = true;
scene.add(pedestal);

const pedestalTrim = new THREE.Mesh(
  new THREE.TorusGeometry(2.34, 0.075, 12, 64),
  brightBrass
);
pedestalTrim.rotation.x = Math.PI / 2;
pedestalTrim.position.y = -3.94;
pedestalTrim.castShadow = true;
scene.add(pedestalTrim);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
