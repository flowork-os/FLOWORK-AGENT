<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyberpunk Hoverbike</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030b}
canvas{display:block}
#label{position:fixed;left:22px;bottom:18px;color:#ff2da6;font:11px monospace;letter-spacing:3px;opacity:.8;pointer-events:none;text-shadow:0 0 10px #ff007f}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">NIGHTWRAITH // HOVER UNIT 07</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05030b);
scene.fog = new THREE.FogExp2(0x07040d, 0.045);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(5.4,3.15,7.5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.target.set(0,1.2,0);

const root = new THREE.Group();
root.rotation.y = -0.18;
scene.add(root);

const black = new THREE.MeshStandardMaterial({color:0x090d14,metalness:.85,roughness:.24});
const carbon = new THREE.MeshStandardMaterial({color:0x161b24,metalness:.65,roughness:.32});
const darkMetal = new THREE.MeshStandardMaterial({color:0x303844,metalness:.9,roughness:.25});
const armor = new THREE.MeshStandardMaterial({color:0x59616b,metalness:.85,roughness:.38});
const pink = new THREE.MeshBasicMaterial({color:0xff168f});
const pinkSoft = new THREE.MeshStandardMaterial({color:0xff168f,emissive:0xff006f,emissiveIntensity:5,metalness:.2,roughness:.2});
const green = new THREE.MeshBasicMaterial({color:0xb6ff35});
const greenGlow = new THREE.MeshStandardMaterial({color:0x8cff20,emissive:0x76ff00,emissiveIntensity:4,transparent:true,opacity:.8});
const rubber = new THREE.MeshStandardMaterial({color:0x050609,roughness:.9,metalness:.05});

function add(g,m,p=[0,0,0],r=[0,0,0],s=[1,1,1]){
  const o=new THREE.Mesh(g,m); o.position.set(...p); o.rotation.set(...r); o.scale.set(...s);
  o.castShadow=true; o.receiveShadow=true; root.add(o); return o;
}
function tube(a,b,r,m){
  const v=new THREE.Vector3().subVectors(b,a), mid=new THREE.Vector3().addVectors(a,b).multiplyScalar(.5);
  const o=add(new THREE.CylinderGeometry(r,r,v.length(),12),m,mid);
  o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.normalize()); return o;
}
function glowLine(points, color=0xff168f, width=.035){
  const geo=new THREE.BufferGeometry().setFromPoints(points);
  const mat=new THREE.LineBasicMaterial({color,transparent:true,opacity:.95});
  const line=new THREE.Line(geo,mat); root.add(line);
  return line;
}

const base = add(new THREE.BoxGeometry(1.25,.34,3.35),black,[0,1.22,0],[0.12,0,0],[1,1,1]);
const nose = add(new THREE.ConeGeometry(.72,1.75,5),black,[0,1.46,-2.02],[Math.PI/2,0,0],[1,.95,1]);
nose.rotation.z=Math.PI/2;
const spine = add(new THREE.BoxGeometry(.38,.34,3.5),carbon,[0,1.52,.12],[-.04,0,0]);

const seat = add(new THREE.CapsuleGeometry(.38,.9,6,14),rubber,[0,1.67,.67],[Math.PI/2,0,0],[1,.78,1.25]);
const seatBack = add(new THREE.BoxGeometry(.58,.72,.18),carbon,[0,1.9,1.04],[-.2,0,0]);

const tank = add(new THREE.SphereGeometry(.73,20,12),carbon,[0,1.74,-.42],[0,0,0],[.82,.48,1.45]);
const tankTop = add(new THREE.BoxGeometry(.54,.13,1.28),black,[0,2.05,-.35],[-.08,0,0]);

const forkL=tube(new THREE.Vector3(-.18,1.64,-1.15),new THREE.Vector3(-.62,2.25,-1.87),.075,darkMetal);
const forkR=tube(new THREE.Vector3(.18,1.64,-1.15),new THREE.Vector3(.62,2.25,-1.87),.075,darkMetal);
const bar=tube(new THREE.Vector3(-.8,2.25,-1.92),new THREE.Vector3(.8,2.25,-1.92),.055,darkMetal);
add(new THREE.CylinderGeometry(.09,.09,.42,12),rubber,[-.7,2.27,-1.93],[0,0,Math.PI/2]);
add(new THREE.CylinderGeometry(.09,.09,.42,12),rubber,[.7,2.27,-1.93],[0,0,Math.PI/2]);

const plateShape=new THREE.Shape();
plateShape.moveTo(-.78,-.3); plateShape.lineTo(.76,-.25); plateShape.lineTo(.64,.31); plateShape.lineTo(-.4,.4); plateShape.lineTo(-.82,.1); plateShape.closePath();
const plate=add(new THREE.ExtrudeGeometry(plateShape,{depth:.09,bevelEnabled:true,bevelSegments:2,bevelSize:.035}),armor,[0,1.0,1.66],[Math.PI/2+.08,0,0]);
for(let x of [-.55, .55]) add(new THREE.CylinderGeometry(.06,.06,.11,12),darkMetal,[x,1.03,1.62],[Math.PI/2,0,0]);

const podY=.52;
for(const x of [-.72,.72]){
  add(new THREE.CylinderGeometry(.42,.42,1.08,24),carbon,[x,podY,-.7],[0,0,0]);
  add(new THREE.TorusGeometry(.42,.075,10,28),pinkSoft,[x,podY,-1.25],[Math.PI/2,0,0]);
  add(new THREE.TorusGeometry(.42,.07,10,28),darkMetal,[x,podY,-.15],[Math.PI/2,0,0]);
  add(new THREE.CylinderGeometry(.29,.36,.07,24),greenGlow,[x,podY,-1.29],[Math.PI/2,0,0]);
  add(new THREE.CylinderGeometry(.15,.27,.12,18),pinkSoft,[x,podY,-1.34],[Math.PI/2,0,0]);
  tube(new THREE.Vector3(x-.23,podY+.38,-.72),new THREE.Vector3(x-.12,1.18,-.55),.045,darkMetal);
  tube(new THREE.Vector3(x+.23,podY+.38,-.72),new THREE.Vector3(x+.13,1.18,-.55),.045,darkMetal);
}

for(let i=0;i<5;i++){
  const x=-.28+i*.14;
  tube(new THREE.Vector3(x,1.24,1.35),new THREE.Vector3(x+.12,1.05,1.9+i*.04),.018,i%2?pinkSoft:darkMetal);
}
for(let i=0;i<4;i++){
  const x=-.19+i*.13;
  add(new THREE.CylinderGeometry(.045,.045,.08,10),darkMetal,[x,1.19,1.66],[Math.PI/2,0,0]);
}

glowLine([new THREE.Vector3(-.58,1.64,-2.53),new THREE.Vector3(-.42,1.88,-1.65),new THREE.Vector3(-.22,1.95,-.85)],0xff168f,.06);
glowLine([new THREE.Vector3(.58,1.64,-2.53),new THREE.Vector3(.42,1.88,-1.65),new THREE.Vector3(.22,1.95,-.85)],0xff168f,.06);
glowLine([new THREE.Vector3(-.47,1.98,-1.55),new THREE.Vector3(-.2,2.03,-.9),new THREE.Vector3(.2,2.03,-.9),new THREE.Vector3(.47,1.98,-1.55)],0xff4ab4,.035);

const decalCanvas=document.createElement('canvas');
decalCanvas.width=512; decalCanvas.height=128;
const dc=decalCanvas.getContext('2d');
dc.fillStyle='#0b0d13'; dc.fillRect(0,0,512,128);
dc.strokeStyle='#ff198f'; dc.lineWidth=6; dc.strokeRect(5,5,502,118);
dc.fillStyle='#ff62bd'; dc.font='bold 54px monospace'; dc.fillText('N//07',25,78);
dc.fillStyle='#7e174f'; dc.font='bold 20px monospace'; dc.fillText('VOID RUNNER',285,76);
const decalTex=new THREE.CanvasTexture(decalCanvas);
const decalMat=new THREE.MeshBasicMaterial({map:decalTex,transparent:true});
add(new THREE.PlaneGeometry(.7,.18),decalMat,[-.66,1.52,.3],[0,Math.PI/2,0]);
add(new THREE.PlaneGeometry(.7,.18),decalMat,[.66,1.52,.3],[0,-Math.PI/2,0]);

const holoGroup=new THREE.Group(); root.add(holoGroup); holoGroup.position.set(0,2.55,-1.82);
const holoMat=new THREE.LineBasicMaterial({color:0xb7ff34,transparent:true,opacity:.9});
const holoPts=[new THREE.Vector3(-.55,-.2,0),new THREE.Vector3(.55,-.2,0),new THREE.Vector3(.48,.14,0),new THREE.Vector3(-.48,.14,0),new THREE.Vector3(-.55,-.2,0)];
holoGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(holoPts),holoMat));
holoGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-.32,-.08,0),new THREE.Vector3(.16,-.08,0),new THREE.Vector3(.36,.05,0),new THREE.Vector3(-.08,.05,0)]),holoMat));
holoGroup.add(new THREE.Mesh(new THREE.PlaneGeometry(1.02,.38),new THREE.MeshBasicMaterial({color:0x86ff20,transparent:true,opacity:.07,side:THREE.DoubleSide})));
for(let x of [-.44,.44]) tube(new THREE.Vector3(x,2.28,-1.82),new THREE.Vector3(x,2.55,-1.82),.012,green);

const ground=add(new THREE.CircleGeometry(8,64),new THREE.MeshStandardMaterial({color:0x090713,metalness:.55,roughness:.32}),[0,-.12,0],[-Math.PI/2,0,0]);
ground.receiveShadow=true;
for(let r=2;r<7;r+=1.2) {
  const ring=new THREE.Mesh(new THREE.RingGeometry(r-.012,r,.64),new THREE.MeshBasicMaterial({color:0x261140,transparent:true,opacity:.5}));
  ring.rotation.x=-Math.PI/2; ring.position.y=-.1; scene.add(ring);
}
const hemi=new THREE.HemisphereLight(0x552070,0x08060d,1.5); scene.add(hemi);
const key=new THREE.SpotLight(0xff2a9d,850,12,Math.PI/5,.55,1.5); key.position.set(-4,6,4); key.target=root; key.castShadow=true; scene.add(key);
const fill=new THREE.PointLight(0x43d9ff,90,7); fill.position.set(3,2,-3); scene.add(fill);
const greenLight=new THREE.PointLight(0x92ff20,70,4); greenLight.position.set(0,2.4,-2); scene.add(greenLight);

function animate(t){
  requestAnimationFrame(animate);
  const pulse=1+Math.sin(t*.006)*.08;
  holoGroup.scale.set(pulse,pulse,pulse);
  controls.update();
  renderer.render(scene,camera);
}
animate(0);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
