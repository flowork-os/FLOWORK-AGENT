  canvas{display:block}

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= 1 · CONFIG & PALETTE — Misty Bamboo Grove Path ================= */
const CFG = {
  seed: 20260815, groveRadius: 17,
  culmCount: 84, fireflyCount: 46, fallenLeafCount: 250,
  pebbleCount: 210, mistLayerCount: 11, shaftCount: 6, koiCount: 4
};
const PAL = {
  fog: 0xafc6a0, skyTop: '#d6e4bd', skyMid: '#b9cfa2', skyLow: '#9cb98c',
  groundBase: '#5d6e42', streamBed: '#3d4a38',
  bambooTints: [0x6d9a44, 0x7ea94e, 0x5c8a3a, 0x8fb45c],
  bambooNode: 0x46672c, leaf: 0x6da44b,
  stone: 0x8d9084, moss: 0x64823e,
  lacquer: 0xa8271f, lacquerDeep: 0x77150f, postGold: 0xd8a944,
  water: 0x40756a, mist: 0xe6eedb,
  sun: 0xfff2cc, hemiSky: 0xcfe3b4, hemiGround: 0x2f4a26,
  firefly: 0xffe27f, lanternGlow: 0xffb257, shaft: 0xf2f0c2
};

/* ================= 2 · SEEDED PRNG & SMALL HELPERS ================= */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(CFG.seed);
const rand = (a, b) => a + rng() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(rng() * arr.length)];
const TAU = Math.PI * 2;

/** Returns a function giving the xz-distance from (x,z) to the sampled curve. */
function curveSampler(curve, n = 90){
  const pts = [];
  for (let i = 0; i <= n; i++) pts.push(curve.getPointAt(i / n));
  return (x, z) => {
    let d = Infinity;
    for (const p of pts){ const dd = (p.x - x) ** 2 + (p.z - z) ** 2; if (dd < d) d = dd; }
    return Math.sqrt(d);
  };
}

/** Flat ribbon geometry following a ground curve (stream bed & water surface). */
function ribbonGeometry(curve, width, samples, y){
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= samples; i++){
    const u = i / samples, p = curve.getPointAt(u), tan = curve.getTangentAt(u);
    const nx = -tan.z, nz = tan.x, hw = width / 2;
    pos.push(p.x + nx * hw, y, p.z + nz * hw, p.x - nx * hw, y, p.z - nz * hw);
    uv.push(u * 8, 0, u * 8, 1);
  }
  for (let i = 0; i < samples; i++){
    const a = i * 2;
    idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}

/* ================= 3 · RENDERER · SCENE · CAMERA · CONTROLS ================= */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(PAL.fog, 17, 47);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 160);
camera.position.set(10.5, 7.2, 13.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.5, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.autoRotate = true; controls.autoRotateSpeed = 0.9;
controls.minDistance = 7; controls.maxDistance = 27; controls.maxPolarAngle = 1.46;

/* ================= 4 · PROCEDURAL CANVAS TEXTURES ================= */
function makeCanvas(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

function groundTexture(){
  const c = makeCanvas(512, 512), g = c.getContext('2d');
  g.fillStyle = PAL.groundBase; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 2600; i++){                       // mossy soil mottling
    const s = rand(2, 12);
    g.fillStyle = `rgba(${randInt(60, 96)},${randInt(88, 122)},${randInt(42, 66)},${rand(0.08, 0.3).toFixed(2)})`;
    g.beginPath(); g.ellipse(rng() * 512, rng() * 512, s, s * rand(0.5, 1), rng() * TAU, 0, TAU); g.fill();
  }
  for (let i = 0; i < 900; i++){                        // dark leaf-litter specks
    g.fillStyle = `rgba(30,40,22,${rand(0.1, 0.35).toFixed(2)})`;
    g.fillRect(rng() * 512, rng() * 512, rand(1, 3), rand(1, 3));
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping;
  t.repeat.set(5, 5); t.colorSpace = THREE.SRGBColorSpace; return t;
}

function stoneTexture(mossy){
  const c = makeCanvas(256, 256), g = c.getContext('2d');
  g.fillStyle = '#8d9086'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 700; i++){
    const v = randInt(112, 168);
    g.fillStyle = `rgba(${v},${v + 4},${v - 6},${rand(0.1, 0.35).toFixed(2)})`;
    g.beginPath(); g.arc(rng() * 256, rng() * 256, rand(1, 7), 0, TAU); g.fill();
  }
  if (mossy) for (let i = 0; i < 150; i++){             // moss blotches creeping up the stone
    g.fillStyle = `rgba(${randInt(70, 100)},${randInt(110, 140)},${randInt(48, 66)},${rand(0.15, 0.5).toFixed(2)})`;
    g.beginPath(); g.ellipse(rng() * 256, 128 + rng() * 128, rand(4, 18), rand(3, 10), rng() * TAU, 0, TAU); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}

function waterTexture(){
  const c = makeCanvas(256, 128), g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 128);
  grad.addColorStop(0, '#2f5e55'); grad.addColorStop(0.5, '#478073'); grad.addColorStop(1, '#2f5e55');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 128);
  for (let i = 0; i < 46; i++){                         // full-width flow streaks (tile seamlessly in x)
    const y = rng() * 128;
    g.strokeStyle = `rgba(215,240,225,${rand(0.05, 0.2).toFixed(2)})`;
    g.lineWidth = rand(0.6, 2.2);
    g.beginPath(); g.moveTo(0, y); g.lineTo(256, y + rand(-4, 4)); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}

function streamBedTexture(){
  const c = makeCanvas(256, 128), g = c.getContext('2d');
  g.fillStyle = PAL.streamBed; g.fillRect(0, 0, 256, 128);
  for (let i = 0; i < 380; i++){                        // submerged pebbles
    const v = randInt(78, 128);
    g.fillStyle = `rgb(${v},${v + randInt(-6, 8)},${v - 10})`;
    g.beginPath(); g.ellipse(rng() * 256, rng() * 128, rand(2, 7), rand(1.5, 5), rng() * TAU, 0, TAU); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; return t;
}

function mistTexture(){
  const c = makeCanvas(128, 128), g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 6, 64, 64, 64);
  grad.addColorStop(0, 'rgba(238,244,228,0.85)');
  grad.addColorStop(0.55, 'rgba(232,240,220,0.35)');
  grad.addColorStop(1, 'rgba(230,238,218,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

function shaftTexture(){
  const c = makeCanvas(32, 256), g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, 'rgba(255,252,214,0.9)');
  grad.addColorStop(0.7, 'rgba(255,252,214,0.25)');
  grad.addColorStop(1, 'rgba(255,252,214,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 32, 256);
  return new THREE.CanvasTexture(c);
}

function skyTexture(){
  const c = makeCanvas(32, 256), g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, PAL.skyTop); grad.addColorStop(0.55, PAL.skyMid); grad.addColorStop(1, PAL.skyLow);
  g.fillStyle = grad; g.fillRect(0, 0, 32, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; return t;
}

function koiTexture(){
  const c = makeCanvas(128, 64), g = c.getContext('2d');
  g.fillStyle = '#f3ede2'; g.fillRect(0, 0, 128, 64);
  for (let i = 0; i < 7; i++){                          // orange kohaku blotches
    g.fillStyle = pick(['#d95b1e', '#c9491a', '#e8722a']);
    g.beginPath(); g.ellipse(rand(20, 118), rand(8, 56), rand(7, 17), rand(5, 12), rng() * TAU, 0, TAU); g.fill();
  }
  g.fillStyle = '#a72c14';                              // red head cap
  g.beginPath(); g.ellipse(14, 32, 11, 12, 0, 0, TAU); g.fill();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; return t;
}

/* ================= 5 · SHARED MATERIALS ================= */
const MAT = {
  ground: new THREE.MeshStandardMaterial({ map: groundTexture(), roughness: 1 }),
  stone: new THREE.MeshStandardMaterial({ map: stoneTexture(false), roughness: 0.95 }),
  mossStone: new THREE.MeshStandardMaterial({ map: stoneTexture(true), roughness: 0.95 }),
  bambooSeg: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55 }),
  bambooNode: new THREE.MeshStandardMaterial({ color: PAL.bambooNode, roughness: 0.7 }),
  leaf: new THREE.MeshStandardMaterial({ color: PAL.leaf, roughness: 0.9, side: THREE.DoubleSide }),
  fallenLeaf: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, side: THREE.DoubleSide }),
  lacquer: new THREE.MeshStandardMaterial({ color: PAL.lacquer, roughness: 0.28, metalness: 0.12 }),
  lacquerDeep: new THREE.MeshStandardMaterial({ color: PAL.lacquerDeep, roughness: 0.35, metalness: 0.1 }),
  gold: new THREE.MeshStandardMaterial({ color: PAL.postGold, roughness: 0.35, metalness: 0.75 }),
  moss: new THREE.MeshStandardMaterial({ color: PAL.moss, roughness: 1 }),
  water: new THREE.MeshStandardMaterial({ map: waterTexture(), transparent: true, opacity: 0.8, roughness: 0.2, metalness: 0.25 }),
  bed: new THREE.MeshStandardMaterial({ map: streamBedTexture(), roughness: 1 }),
  pebble: new THREE.MeshStandardMaterial({ color: 0x9a9a90, roughness: 0.9 }),
  koi: new THREE.MeshStandardMaterial({ map: koiTexture(), roughness: 0.55 }),
  fin: new THREE.MeshStandardMaterial({ color: 0xf0e8da, roughness: 0.7, side: THREE.DoubleSide, transparent: true, opacity: 0.85 }),
  windowGlow: new THREE.MeshStandardMaterial({ color: 0x3a2a18, emissive: PAL.lanternGlow, emissiveIntensity: 1.9 }),
  firefly: new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false }),
  mist: new THREE.MeshBasicMaterial({ map: mistTexture(), transparent: true, depthWrite: false, opacity: 0.55, color: PAL.mist }),
  shaft: new THREE.MeshBasicMaterial({ map: shaftTexture(), transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, opacity: 0.16, color: PAL.shaft, side: THREE.DoubleSide, fog: false })
};
const waterTex = MAT.water.map;

/* ================= 6 · LAYOUT CURVES — stone path & pebble stream ================= */
const pathCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-16, 0, 5), new THREE.Vector3(-9, 0, 2.5), new THREE.Vector3(-3, 0, 3.6),
  new THREE.Vector3(1.2, 0, 0.6), new THREE.Vector3(6, 0, -1.9), new THREE.Vector3(11, 0, -1),
  new THREE.Vector3(16, 0, -3.5)
]);
const streamCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-3, 0, -17), new THREE.Vector3(-0.5, 0, -9), new THREE.Vector3(1.9, 0, -2),
  new THREE.Vector3(0.6, 0, 3), new THREE.Vector3(-1.6, 0, 9), new THREE.Vector3(0.5, 0, 17)
]);
const distToPath = curveSampler(pathCurve);
const distToStream = curveSampler(streamCurve);

// Bridge sits where the path meets the stream: search path samples for the closest point.
let bridgeU = 0.5, bestD = Infinity;
for (let i = 0; i <= 120; i++){
  const p = pathCurve.getPointAt(i / 120), d = distToStream(p.x, p.z);
  if (d < bestD){ bestD = d; bridgeU = i / 120; }
}
const bridgePos = pathCurve.getPointAt(bridgeU);
const bridgeTan = pathCurve.getTangentAt(bridgeU);

/* ================= 7 · BUILDERS — environment shell (ground + sky dome) ================= */
function buildGround(){
  const g = new THREE.Group();
  const floor = new THREE.Mesh(new THREE.CircleGeometry(30, 56), MAT.ground);
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
  g.add(floor); return g;
}

function buildSkyDome(){
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(60, 28, 14),
    new THREE.MeshBasicMaterial({ map: skyTexture(), side: THREE.BackSide, fog: false })));
  return g;
}

/* ================= 8 · BUILDER — bamboo grove (instanced segments/nodes/leaves,
   per-culm sway data drives a gentle per-frame instance-matrix update) ================= */
const culms = [], segLocals = [], nodeLocals = [], leafLocals = [];
let segMesh, nodeMesh, leafMesh;
const _IDQ = new THREE.Quaternion();

function buildBambooGrove(){
  const g = new THREE.Group();
  const spots = [];
  let guard = 0;
  while (spots.length < CFG.culmCount && guard++ < 6000){    // rejection-sample clearings
    const a = rng() * TAU, r = Math.sqrt(rng()) * CFG.groveRadius;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (distToPath(x, z) < 2.3 || distToStream(x, z) < 2.5) continue;
    if (spots.some(s => (s.x - x) ** 2 + (s.z - z) ** 2 < 0.6)) continue;
    spots.push({ x, z });
  }
  for (const s of spots){
    const h = rand(6.2, 10.2), radius = rand(0.09, 0.16), nSeg = randInt(5, 8);
    const leanAxis = new THREE.Vector3(rand(-1, 1), 0, rand(-1, 1)).normalize();
    const baseT = new THREE.Matrix4().makeTranslation(s.x, 0, s.z)
      .multiply(new THREE.Matrix4().makeRotationAxis(leanAxis, rand(0, 0.055)));
    const culm = {
      baseT,
      swayAxis: new THREE.Vector3(rand(-1, 1), 0, rand(-1, 1)).normalize(),
      phase: rng() * TAU, speed: rand(0.35, 0.75), amp: rand(0.008, 0.022),
      tint: new THREE.Color(pick(PAL.bambooTints)),
      segStart: segLocals.length, nodeStart: nodeLocals.length, leafStart: leafLocals.length
    };
    const segLen = h / nSeg;
    for (let i = 0; i < nSeg; i++){
      const rr = radius * (1 - 0.35 * i / nSeg);
      segLocals.push(new THREE.Matrix4().compose(
        new THREE.Vector3(0, i * segLen + segLen / 2, 0), _IDQ, new THREE.Vector3(rr, segLen * 0.99, rr)));
      nodeLocals.push(new THREE.Matrix4().compose(
        new THREE.Vector3(0, (i + 1) * segLen, 0), _IDQ, new THREE.Vector3(rr * 1.16, 1, rr * 1.16)));
    }
    const nLeaf = randInt(7, 12);
    for (let i = 0; i < nLeaf; i++){
      const hy = h * rand(0.52, 1.02), az = rng() * TAU, droop = rand(1.05, 1.9);
      const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, az, 0))
        .multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(droop, 0, 0)));
      leafLocals.push(new THREE.Matrix4().compose(
        new THREE.Vector3(0, hy, 0), q, new THREE.Vector3(rand(0.6, 1), rand(0.9, 1.7), 1)));
    }
    culm.segCount = segLocals.length - culm.segStart;
    culm.nodeCount = nodeLocals.length - culm.nodeStart;
    culm.leafCount = leafLocals.length - culm.leafStart;
    culms.push(culm);
  }
  // shared geometries: open tapered tube, node ring, slender lanceolate leaf
  const segGeo = new THREE.CylinderGeometry(0.92, 1, 1, 7, 1, true);
  const nodeGeo = new THREE.CylinderGeometry(1, 1, 0.06, 7);
  const leafShape = new THREE.Shape();
  leafShape.moveTo(0, 0);
  leafShape.quadraticCurveTo(0.1, 0.35, 0, 1);
  leafShape.quadraticCurveTo(-0.1, 0.35, 0, 0);
  const leafGeo = new THREE.ShapeGeometry(leafShape, 5);
  segMesh = new THREE.InstancedMesh(segGeo, MAT.bambooSeg, segLocals.length);
  nodeMesh = new THREE.InstancedMesh(nodeGeo, MAT.bambooNode, nodeLocals.length);
  leafMesh = new THREE.InstancedMesh(leafGeo, MAT.leaf, leafLocals.length);
  for (const m of [segMesh, nodeMesh, leafMesh]){
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    m.castShadow = true; m.frustumCulled = false; g.add(m);
  }
  leafMesh.castShadow = false;   // thin double-sided planes self-shadow into black

  for (const c of culms)
    for (let i = 0; i < c.segCount; i++) segMesh.setColorAt(c.segStart + i, c.tint);
  updateBambooSway(0);
  return g;
}

const _swayR = new THREE.Matrix4(), _culmM = new THREE.Matrix4(), _instM = new THREE.Matrix4();
function updateBambooSway(t){
  for (const c of culms){
    _swayR.makeRotationAxis(c.swayAxis, Math.sin(t * c.speed + c.phase) * c.amp);
    _culmM.multiplyMatrices(c.baseT, _swayR);
    for (let i = 0; i < c.segCount; i++){
      _instM.multiplyMatrices(_culmM, segLocals[c.segStart + i]); segMesh.setMatrixAt(c.segStart + i, _instM); }
    for (let i = 0; i < c.nodeCount; i++){
      _instM.multiplyMatrices(_culmM, nodeLocals[c.nodeStart + i]); nodeMesh.setMatrixAt(c.nodeStart + i, _instM); }
    for (let i = 0; i < c.leafCount; i++){
      _instM.multiplyMatrices(_culmM, leafLocals[c.leafStart + i]); leafMesh.setMatrixAt(c.leafStart + i, _instM); }
  }
  for (const m of [segMesh, nodeMesh, leafMesh]) m.instanceMatrix.needsUpdate = true;
}

/* ================= 9 · BUILDER — winding stepping-stone path ================= */
function buildStonePath(){
  const g = new THREE.Group();
  const geo = new THREE.CylinderGeometry(1, 1.12, 1, 7);
  const placements = [];
  const len = pathCurve.getLength();
  for (let d = 0.6; d < len - 0.6; d += 1.12){
    const u = d / len, p = pathCurve.getPointAt(u), tan = pathCurve.getTangentAt(u);
    if (p.distanceTo(bridgePos) < 3.3) continue;             // the bridge spans this gap
    placements.push({ p, tan });
  }
  const mesh = new THREE.InstancedMesh(geo, MAT.stone, placements.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), col = new THREE.Color();
  placements.forEach((pl, i) => {
    q.setFromEuler(new THREE.Euler(0, Math.atan2(-pl.tan.z, pl.tan.x) + rand(-0.4, 0.4), 0));
    m.compose(
      new THREE.Vector3(pl.p.x + rand(-0.12, 0.12), 0.055, pl.p.z + rand(-0.12, 0.12)),
      q, new THREE.Vector3(rand(0.45, 0.62), 0.11, rand(0.34, 0.5)));
    mesh.setMatrixAt(i, m);
    mesh.setColorAt(i, col.setHSL(0.24, rand(0.03, 0.1), rand(0.5, 0.64)));
  });
  mesh.castShadow = mesh.receiveShadow = true;
  g.add(mesh);
  return g;
}

/* ================= 10 · BUILDER — pebble stream (bed, animated water, bank pebbles) ================= */
function buildStream(){
  const g = new THREE.Group();
  const bed = new THREE.Mesh(ribbonGeometry(streamCurve, 2.5, 48, 0.02), MAT.bed);
  bed.receiveShadow = true;
  g.add(bed);
  const water = new THREE.Mesh(ribbonGeometry(streamCurve, 2.05, 48, 0.14), MAT.water);
  g.add(water);
  const pebbles = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), MAT.pebble, CFG.pebbleCount);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), col = new THREE.Color();
  for (let i = 0; i < CFG.pebbleCount; i++){                 // pebbles hugging both banks
    const u = rng(), side = rng() < 0.5 ? 1 : -1;
    const p = streamCurve.getPointAt(u), tan = streamCurve.getTangentAt(u);
    const off = 1.28 + rng() * rng() * 0.75;
    q.setFromEuler(e.set(rng() * TAU, rng() * TAU, rng() * TAU));
    m.compose(
      new THREE.Vector3(p.x - tan.z * off * side, 0.045, p.z + tan.x * off * side),
      q, new THREE.Vector3(rand(0.06, 0.16), rand(0.05, 0.1), rand(0.06, 0.16)));
    pebbles.setMatrixAt(i, m);
    pebbles.setColorAt(i, col.setHSL(rand(0.07, 0.14), rand(0.04, 0.12), rand(0.42, 0.66)));
  }
  pebbles.castShadow = pebbles.receiveShadow = true;
  g.add(pebbles);
  return g;
}

/* ================= 11 · BUILDER — koi swimming back and forth in the stream ================= */
const koiSchool = [];
function buildKoi(){
  const g = new THREE.Group();
  const bodyGeo = new THREE.SphereGeometry(0.5, 14, 10);
  const finGeo = new THREE.CircleGeometry(0.16, 3);
  for (let i = 0; i < CFG.koiCount; i++){
    const koi = new THREE.Group();
    const body = new THREE.Mesh(bodyGeo, MAT.koi);
    body.scale.set(0.62, 0.2, 0.16); body.castShadow = true;
    koi.add(body);
    const tail = new THREE.Mesh(finGeo, MAT.fin);
    tail.position.x = -0.34; tail.rotation.set(Math.PI / 2, 0, Math.PI); tail.scale.set(1.25, 0.9, 1);
    koi.add(tail);
    for (const s of [1, -1]){
      const pec = new THREE.Mesh(finGeo, MAT.fin);
      pec.position.set(0.1, -0.02, 0.09 * s);
      pec.rotation.set(Math.PI / 2, 0, s > 0 ? -2.3 : 2.3); pec.scale.set(0.62, 0.62, 1);
      koi.add(pec);
    }
    koi.userData = { mid: rand(0.3, 0.7), span: rand(0.1, 0.2), speed: rand(0.1, 0.2),
      phase: rng() * TAU, wig: rand(4.5, 6.5), tail };
    koi.scale.setScalar(rand(0.75, 1.05));
    koiSchool.push(koi);
    g.add(koi);
  }
  return g;
}

const _koiP = new THREE.Vector3(), _koiP2 = new THREE.Vector3();
function updateKoi(t){
  for (const k of koiSchool){
    const d = k.userData;
    const u = d.mid + Math.sin(t * d.speed + d.phase) * d.span;
    streamCurve.getPointAt(u, _koiP);
    streamCurve.getPointAt(Math.min(1, u + 0.01), _koiP2);
    const dir = Math.cos(t * d.speed + d.phase) >= 0 ? 1 : -1;
    k.position.set(_koiP.x, 0.09, _koiP.z);
    const yaw = Math.atan2(-(_koiP2.z - _koiP.z) * dir, (_koiP2.x - _koiP.x) * dir);
    k.rotation.y = yaw + Math.sin(t * d.wig + d.phase) * 0.14;
    d.tail.rotation.y = Math.sin(t * d.wig + d.phase + 1.2) * 0.5;
  }
}

/* ================= 12 · BUILDER — red lacquered footbridge over the stream ================= */
function buildFootbridge(){
  const g = new THREE.Group();
  const span = 5.6, rise = 0.85, arcY = x => rise * (1 - (x / (span / 2)) ** 2);
  const plankGeo = new THREE.BoxGeometry(0.42, 0.07, 1.5);
  for (let i = 0; i < 13; i++){                              // deck planks along the arc
    const x = -span / 2 + 0.28 + i * (span - 0.56) / 12;
    const plank = new THREE.Mesh(plankGeo, MAT.lacquerDeep);
    plank.position.set(x, 0.32 + arcY(x), 0);
    plank.rotation.z = Math.atan(-2 * rise * x / (span / 2) ** 2);
    plank.castShadow = plank.receiveShadow = true;
    g.add(plank);
  }
  const arcPts = lift => { const a = []; for (let i = 0; i <= 16; i++){
    const x = -span / 2 + i * span / 16; a.push(new THREE.Vector3(x, lift + arcY(x), 0)); } return a; };
  for (const s of [1, -1]){
    for (const [lift, r] of [[0.26, 0.075], [1.06, 0.05], [0.68, 0.032]]){   // stringer, handrail, mid-rail
      const tube = new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.CatmullRomCurve3(arcPts(lift)), 24, r, 6, false), MAT.lacquer);
      tube.position.z = 0.72 * s; tube.castShadow = true;
      g.add(tube);
    }
    for (let i = 0; i <= 4; i++){                            // railing posts with gilded giboshi caps
      const x = -span / 2 + 0.3 + i * (span - 0.6) / 4;
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.85, 8), MAT.lacquer);
      post.position.set(x, 0.66 + arcY(x), 0.72 * s); post.castShadow = true;
      const cap = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), MAT.gold);
      cap.position.set(x, 1.12 + arcY(x), 0.72 * s);
      g.add(post, cap);
    }
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.3, 1.7), MAT.mossStone);  // abutments
    foot.position.set(s * (span / 2 - 0.1), 0.15, 0);
    foot.castShadow = foot.receiveShadow = true;
    g.add(foot);
  }
  g.position.copy(bridgePos);
  g.rotation.y = Math.atan2(-bridgeTan.z, bridgeTan.x);
  return g;
}

/* ================= 13 · BUILDER — mossy stone lantern (kasuga style) ================= */
let lanternLight;
function buildStoneLantern(){
  const g = new THREE.Group();
  const add = (geo, y) => { const m = new THREE.Mesh(geo, MAT.mossStone);
    m.position.y = y; m.castShadow = m.receiveShadow = true; g.add(m); return m; };
  add(new THREE.CylinderGeometry(0.44, 0.54, 0.2, 6), 0.1);                    // ground base
  add(new THREE.CylinderGeometry(0.3, 0.4, 0.14, 6), 0.27);                    // plinth
  add(new THREE.CylinderGeometry(0.115, 0.14, 0.78, 8), 0.72);                 // shaft
  add(new THREE.CylinderGeometry(0.34, 0.24, 0.14, 6), 1.17);                  // platform
  add(new THREE.CylinderGeometry(0.27, 0.27, 0.38, 6), 1.43);                  // firebox
  for (let i = 0; i < 6; i += 2){                                              // glowing windows
    const a = i / 6 * TAU + Math.PI / 6;
    const win = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 0.19), MAT.windowGlow);
    win.position.set(Math.cos(a) * 0.242, 1.43, Math.sin(a) * 0.242);
    win.rotation.y = -a + Math.PI / 2;
    g.add(win);
  }
  add(new THREE.CylinderGeometry(0.07, 0.52, 0.26, 6), 1.74);                  // sweeping roof
  add(new THREE.SphereGeometry(0.085, 10, 8), 1.93);                           // cap
  add(new THREE.ConeGeometry(0.055, 0.14, 6), 2.03);                           // hoju jewel
  for (let i = 0; i < 6; i++){                                                 // moss clumps at the foot
    const clump = new THREE.Mesh(new THREE.SphereGeometry(rand(0.06, 0.12), 8, 6), MAT.moss);
    const a = rng() * TAU;
    clump.position.set(Math.cos(a) * rand(0.2, 0.45), rand(0.03, 0.16), Math.sin(a) * rand(0.2, 0.45));
    clump.scale.y = 0.45; g.add(clump);
  }
  lanternLight = new THREE.PointLight(PAL.lanternGlow, 5.5, 9, 2);
  lanternLight.position.y = 1.45; g.add(lanternLight);
  // sit the lantern just off the path on the approach side of the bridge
  const p = pathCurve.getPointAt(0.3), tan = pathCurve.getTangentAt(0.3);
  g.position.set(p.x - tan.z * 1.5, 0, p.z + tan.x * 1.5);
  g.rotation.y = rng() * TAU;
  return g;
}

/* ================= 14 · BUILDER — scattered fallen leaves ================= */
function buildFallenLeaves(){
  const g = new THREE.Group();
  const mesh = new THREE.InstancedMesh(new THREE.CircleGeometry(0.09, 5), MAT.fallenLeaf, CFG.fallenLeafCount);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), col = new THREE.Color();
  let placed = 0, guard = 0;
  while (placed < CFG.fallenLeafCount && guard++ < 5000){
    const a = rng() * TAU, r = Math.sqrt(rng()) * 16.5;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (distToStream(x, z) < 1.5) continue;                  // keep them off the water
    q.setFromEuler(e.set(-Math.PI / 2 + rand(-0.25, 0.25), 0, rng() * TAU));
    m.compose(new THREE.Vector3(x, 0.02 + rng() * 0.02, z), q,
      new THREE.Vector3(rand(0.7, 1.4), rand(1.4, 2.6), 1));
    mesh.setMatrixAt(placed, m);
    mesh.setColorAt(placed, col.setHSL(rand(0.09, 0.2), rand(0.45, 0.7), rand(0.32, 0.55)));
    placed++;
  }
  mesh.receiveShadow = true;
  g.add(mesh);
  return g;
}

/* ================= 15 · BUILDER — layered drifting mist sheets ================= */
const mistSheets = [];
function buildMist(){
  const g = new THREE.Group();
  const geo = new THREE.PlaneGeometry(1, 1);
  for (let i = 0; i < CFG.mistLayerCount; i++){
    const sheet = new THREE.Mesh(geo, MAT.mist);
    const s = rand(7, 15);
    sheet.scale.set(s, s * rand(0.55, 0.85), 1);
    sheet.rotation.x = -Math.PI / 2;
    sheet.position.set(rand(-13, 13), rand(0.5, 3.4), rand(-13, 13));
    sheet.renderOrder = 2;
    sheet.userData = { x0: sheet.position.x, z0: sheet.position.z,
      ax: rand(1.5, 3.5), az: rand(1.5, 3.5), sx: rand(0.02, 0.06), sz: rand(0.02, 0.06),
      spin: rand(-0.02, 0.02), phase: rng() * TAU };
    mistSheets.push(sheet); g.add(sheet);
  }
  return g;
}
function updateMist(t, dt){
  for (const s of mistSheets){
    const d = s.userData;
    s.position.x = d.x0 + Math.sin(t * d.sx * TAU + d.phase) * d.ax;
    s.position.z = d.z0 + Math.cos(t * d.sz * TAU + d.phase) * d.az;
    s.rotation.z += d.spin * dt;
  }
  MAT.mist.opacity = 0.46 + Math.sin(t * 0.18) * 0.09;
}

/* ================= 16 · BUILDER — fireflies blinking in the green shade ================= */
let fireflyMesh;
const fireflyData = [];
function buildFireflies(){
  const g = new THREE.Group();
  fireflyMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.035, 6, 5), MAT.firefly, CFG.fireflyCount);
  fireflyMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  fireflyMesh.frustumCulled = false;
  const col = new THREE.Color();
  for (let i = 0; i < CFG.fireflyCount; i++){
    fireflyData.push({ x: rand(-14, 14), y: rand(0.4, 3.6), z: rand(-14, 14),
      p1: rng() * TAU, p2: rng() * TAU, p3: rng() * TAU,
      s1: rand(0.2, 0.5), s2: rand(0.15, 0.4), blink: rand(0.9, 2) });
    fireflyMesh.setColorAt(i, col.setHex(PAL.firefly));
  }
  g.add(fireflyMesh);
  return g;
}
const _ffM = new THREE.Matrix4(), _ffC = new THREE.Color(), _ffBase = new THREE.Color(PAL.firefly);
function updateFireflies(t){
  for (let i = 0; i < fireflyData.length; i++){
    const f = fireflyData[i];
    _ffM.makeTranslation(
      f.x + Math.sin(t * f.s1 + f.p1) * 0.7,
      f.y + Math.sin(t * f.s2 + f.p2) * 0.35,
      f.z + Math.cos(t * f.s1 + f.p3) * 0.7);
    fireflyMesh.setMatrixAt(i, _ffM);
    const glow = Math.max(0, Math.sin(t * f.blink + f.p2)) ** 3;
    fireflyMesh.setColorAt(i, _ffC.copy(_ffBase).multiplyScalar(0.08 + glow * 1.6));
  }
  fireflyMesh.instanceMatrix.needsUpdate = true;
  fireflyMesh.instanceColor.needsUpdate = true;
}

/* ================= 17 · BUILDER — soft shafts of canopy light ================= */
const shafts = [];
function buildLightShafts(){
  const g = new THREE.Group();
  const geo = new THREE.PlaneGeometry(1, 1);
  const axis = new THREE.Vector3(0.42, 1, 0.21).normalize();  // leans toward the sun
  const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), axis);
  for (let i = 0; i < CFG.shaftCount; i++){
    const cluster = new THREE.Group();
    const w = rand(0.7, 1.7);
    for (const ry of [0, Math.PI / 2]){                       // two crossed blades per shaft
      const blade = new THREE.Mesh(geo, MAT.shaft);
      blade.scale.set(w, 13, 1);
      blade.rotation.y = ry;
      cluster.add(blade);
    }
    cluster.quaternion.copy(quat);
    cluster.position.set(rand(-8, 8), 6.4, rand(-8, 8));
    cluster.userData = { phase: rng() * TAU };
    shafts.push(cluster);
    g.add(cluster);
  }
  return g;
}
function updateShafts(t){
  MAT.shaft.opacity = 0.14 + Math.sin(t * 0.35) * 0.045;
  for (const s of shafts) s.rotation.y = Math.sin(t * 0.05 + s.userData.phase) * 0.2;
}

/* ================= 18 · ASSEMBLY ================= */
scene.add(buildSkyDome(), buildGround(), buildBambooGrove(), buildStonePath());
scene.add(buildStream(), buildKoi(), buildFootbridge(), buildStoneLantern());
scene.add(buildFallenLeaves(), buildMist(), buildFireflies(), buildLightShafts());

/* ================= 19 · LIGHTING RIG — canopy sun, green fill, lantern accent ================= */
const sun = new THREE.DirectionalLight(PAL.sun, 2.4);
sun.position.set(14, 22, 7); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
sun.shadow.camera.near = 4; sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);

const hemi = new THREE.HemisphereLight(PAL.hemiSky, PAL.hemiGround, 0.75);
const bounce = new THREE.DirectionalLight(0xbcd6a4, 0.35);   // cool green bounce from the far side
bounce.position.set(-12, 8, -10);
scene.add(hemi, bounce);

/* ================= 20 · ANIMATION LOOP — sway, drift, blink, swim, flow, flicker ================= */
const clock = new THREE.Clock();
let lastT = 0;
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = Math.min(t - lastT, 0.05);
  lastT = t;
  updateBambooSway(t); updateKoi(t); updateMist(t, dt); updateFireflies(t); updateShafts(t);
  waterTex.offset.x -= dt * 0.055;                            // stream flow
  lanternLight.intensity = 5.4 + Math.sin(t * 7.1) * 0.55 + Math.sin(t * 11.7) * 0.35;
  MAT.windowGlow.emissiveIntensity = 1.85 + Math.sin(t * 7.1) * 0.3;
  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ================= 21 · RESIZE ================= */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
