<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1990s Point-and-Shoot Film Camera</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #171a1c; }
    body { font-family: Arial, Helvetica, sans-serif; }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 24px;
      bottom: 22px;
      color: rgba(235, 232, 220, 0.76);
      letter-spacing: 0.18em;
      font-size: 11px;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 1px 3px #000;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="label">Compact 35 mm · Automatic</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202529);
    scene.fog = new THREE.Fog(0x202529, 15, 28);

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(8.8, 6.1, 10.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.25, 0.3);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;
    controls.minDistance = 7.5;
    controls.maxDistance = 20;
    controls.maxPolarAngle = Math.PI * 0.49;

    const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

    function material(color, roughness = 0.65, metalness = 0.02) {
      return new THREE.MeshStandardMaterial({ color, roughness, metalness });
    }

    const bodyMat = material(0x4b5051, 0.76, 0.02);
    const darkPlastic = material(0x171a1b, 0.72, 0.04);
    const blackRubber = material(0x090b0c, 0.9, 0.01);
    const trimMat = material(0x7b7e7b, 0.58, 0.14);
    const dullMetal = material(0x777b7d, 0.43, 0.55);
    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0x102331,
      roughness: 0.13,
      metalness: 0.12,
      transmission: 0.12,
      thickness: 0.3,
      clearcoat: 1,
      clearcoatRoughness: 0.08
    });
    const flashMat = new THREE.MeshPhysicalMaterial({
      color: 0xe9e0c1,
      roughness: 0.28,
      metalness: 0,
      transmission: 0.18,
      thickness: 0.15,
      emissive: 0x8c805e,
      emissiveIntensity: 0.12
    });
    const redMat = new THREE.MeshStandardMaterial({
      color: 0xa82a20,
      roughness: 0.42,
      emissive: 0x380500,
      emissiveIntensity: 0.2
    });
    const palePrint = material(0xc3c1b5, 0.82, 0);

    const cameraModel = new THREE.Group();
    cameraModel.rotation.y = -0.09;
    scene.add(cameraModel);

    function addMesh(geometry, mat, position, rotation = null, parent = cameraModel) {
      const mesh = new THREE.Mesh(geometry, mat);
      mesh.position.copy(position);
      if (rotation) mesh.rotation.set(rotation.x, rotation.y, rotation.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    const mainBody = addMesh(
      new RoundedBoxGeometry(6.7, 3.85, 2.28, 7, 0.42),
      bodyMat,
      new THREE.Vector3(0, 2.55, 0)
    );

    const upperBand = addMesh(
      new RoundedBoxGeometry(6.38, 0.62, 2.32, 5, 0.16),
      material(0x5c6060, 0.7, 0.03),
      new THREE.Vector3(-0.08, 4.02, 0.01)
    );

    const bottomBand = addMesh(
      new RoundedBoxGeometry(6.35, 0.3, 2.2, 4, 0.11),
      material(0x303435, 0.79, 0.02),
      new THREE.Vector3(-0.02, 0.78, -0.01)
    );

    const grip = addMesh(
      new RoundedBoxGeometry(1.18, 2.62, 0.43, 6, 0.22),
      material(0x272b2b, 0.86, 0.01),
      new THREE.Vector3(2.63, 2.47, 1.25)
    );
    grip.rotation.z = -0.015;

    for (let i = 0; i < 7; i++) {
      addMesh(
        new THREE.BoxGeometry(0.72, 0.028, 0.025),
        blackRubber,
        new THREE.Vector3(2.65, 1.63 + i * 0.27, 1.48)
      );
    }

    const lens = new THREE.Group();
    lens.position.set(-1.02, 2.48, 1.12);
    cameraModel.add(lens);

    function lensCylinder(radius, depth, z, mat, segments = 64) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, depth, segments), mat);
      mesh.rotation.x = Math.PI / 2;
      mesh.position.z = z;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      lens.add(mesh);
      return mesh;
    }

    lensCylinder(1.43, 0.22, 0.08, trimMat);
    lensCylinder(1.29, 0.5, 0.32, darkPlastic);
    lensCylinder(1.16, 0.13, 0.62, dullMetal);
    lensCylinder(1.08, 0.3, 0.78, blackRubber);
    lensCylinder(0.95, 0.13, 0.98, trimMat);
    lensCylinder(0.86, 0.19, 1.09, darkPlastic);
    lensCylinder(0.72, 0.08, 1.22, glassMat);

    const innerGlass = lensCylinder(
      0.54,
      0.015,
      1.267,
      new THREE.MeshPhysicalMaterial({
        color: 0x07131b,
        roughness: 0.08,
        metalness: 0.22,
        clearcoat: 1,
        clearcoatRoughness: 0.02
      })
    );

    const lensHighlight = addMesh(
      new THREE.CircleGeometry(0.12, 32),
      new THREE.MeshBasicMaterial({ color: 0x617d83, transparent: true, opacity: 0.45 }),
      new THREE.Vector3(-1.22, 2.71, 2.397),
      null
    );
    lensHighlight.scale.set(1, 0.5, 1);

    for (let i = 0; i < 18; i++) {
      const angle = (i / 18) * Math.PI * 2;
      const dash = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.11, 0.025), palePrint);
      dash.position.set(
        -1.02 + Math.sin(angle) * 1.02,
        2.48 + Math.cos(angle) * 1.02,
        2.235
      );
      dash.rotation.z = -angle;
      cameraModel.add(dash);
    }

    const flashFrame = addMesh(
      new RoundedBoxGeometry(1.42, 0.74, 0.16, 4, 0.09),
      darkPlastic,
      new THREE.Vector3(2.0, 3.55, 1.18)
    );
    const flash = addMesh(
      new RoundedBoxGeometry(1.18, 0.52, 0.08, 4, 0.06),
      flashMat,
      new THREE.Vector3(2.0, 3.55, 1.3)
    );

    for (let i = -2; i <= 2; i++) {
      addMesh(
        new THREE.BoxGeometry(0.025, 0.42, 0.012),
        material(0xaaa589, 0.35, 0),
        new THREE.Vector3(2.0 + i * 0.2, 3.55, 1.347)
      );
    }

    const finderFrame = addMesh(
      new RoundedBoxGeometry(0.92, 0.61, 0.14, 4, 0.08),
      darkPlastic,
      new THREE.Vector3(0.64, 3.6, 1.2)
    );
    const finderGlass = addMesh(
      new RoundedBoxGeometry(0.69, 0.4, 0.075, 3, 0.05),
      glassMat,
      new THREE.Vector3(0.64, 3.6, 1.31)
    );

    addMesh(
      new THREE.CircleGeometry(0.12, 24),
      redMat,
      new THREE.Vector3(1.22, 3.13, 1.309)
    );

    addMesh(
      new RoundedBoxGeometry(0.68, 0.18, 0.07, 3, 0.04),
      darkPlastic,
      new THREE.Vector3(1.95, 2.96, 1.315)
    );
    addMesh(
      new THREE.BoxGeometry(0.43, 0.035, 0.018),
      palePrint,
      new THREE.Vector3(1.95, 2.96, 1.357)
    );

    const shutterCollar = addMesh(
      new THREE.CylinderGeometry(0.39, 0.43, 0.12, 40),
      darkPlastic,
      new THREE.Vector3(2.15, 4.53, 0.22)
    );
    const shutter = addMesh(
      new THREE.CylinderGeometry(0.3, 0.34, 0.16, 40),
      dullMetal,
      new THREE.Vector3(2.15, 4.66, 0.22)
    );

    const modeDial = addMesh(
      new THREE.CylinderGeometry(0.53, 0.53, 0.16, 40),
      darkPlastic,
      new THREE.Vector3(-2.25, 4.53, -0.02)
    );
    for (let i = 0; i < 20; i++) {
      const a = i * Math.PI * 2 / 20;
      const notch = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.17, 0.05), blackRubber);
      notch.position.set(-2.25 + Math.cos(a) * 0.49, 4.54, -0.02 + Math.sin(a) * 0.49);
      notch.rotation.y = -a;
      cameraModel.add(notch);
    }
    addMesh(
      new THREE.CylinderGeometry(0.34, 0.34, 0.01, 40),
      trimMat,
      new THREE.Vector3(-2.25, 4.616, -0.02)
    );

    addMesh(
      new RoundedBoxGeometry(0.85, 0.16, 0.12, 3, 0.04),
      blackRubber,
      new THREE.Vector3(0.4, 4.51, -0.34)
    );

    const sideDoor = addMesh(
      new RoundedBoxGeometry(0.045, 1.75, 1.22, 4, 0.1),
      material(0x3d4242, 0.78, 0.02),
      new THREE.Vector3(3.36, 2.13, -0.15)
    );

    const seamMat = material(0x151819, 0.9, 0);
    addMesh(new THREE.BoxGeometry(0.03, 1.48, 0.025), seamMat, new THREE.Vector3(3.389, 2.13, 0.46));
    addMesh(new THREE.BoxGeometry(0.03, 1.48, 0.025), seamMat, new THREE.Vector3(3.389, 2.13, -0.76));
    addMesh(new THREE.BoxGeometry(0.03, 0.025, 1.16), seamMat, new THREE.Vector3(3.389, 2.87, -0.15));
    addMesh(new THREE.BoxGeometry(0.03, 0.025, 1.16), seamMat, new THREE.Vector3(3.389, 1.39, -0.15));
    addMesh(
      new RoundedBoxGeometry(0.055, 0.42, 0.18, 3, 0.04),
      darkPlastic,
      new THREE.Vector3(3.405, 2.15, 0.24)
    );

    const strapLug = addMesh(
      new THREE.TorusGeometry(0.28, 0.075, 12, 32),
      dullMetal,
      new THREE.Vector3(3.48, 2.82, -0.3),
      new THREE.Euler(0, Math.PI / 2, 0)
    );

    addMesh(
      new THREE.BoxGeometry(1.45, 0.045, 0.04),
      material(0x252929, 0.9, 0),
      new THREE.Vector3(1.6, 0.625, 0.28)
    );
    addMesh(
      new THREE.BoxGeometry(0.045, 0.045, 0.76),
      material(0x252929, 0.9, 0),
      new THREE.Vector3(0.88, 0.625, -0.1)
    );
    addMesh(
      new THREE.BoxGeometry(0.045, 0.045, 0.76),
      material(0x252929, 0.9, 0),
      new THREE.Vector3(2.32, 0.625, -0.1)
    );

    const tripodSocket = addMesh(
      new THREE.CylinderGeometry(0.24, 0.24, 0.04, 32),
      dullMetal,
      new THREE.Vector3(-0.4, 0.59, -0.12)
    );

    const backPanel = addMesh(
      new RoundedBoxGeometry(4.7, 2.45, 0.08, 4, 0.14),
      material(0x343839, 0.82, 0.01),
      new THREE.Vector3(-0.45, 2.35, -1.18)
    );
    const rearFinder = addMesh(
      new RoundedBoxGeometry(0.8, 0.5, 0.1, 3, 0.06),
      glassMat,
      new THREE.Vector3(0.63, 3.55, -1.27)
    );

    const printBars = [
      { x: -2.45, y: 3.7, w: 1.0 },
      { x: -2.55, y: 3.48, w: 0.8 },
      { x: 1.73, y: 1.38, w: 0.62 }
    ];
    for (const bar of printBars) {
      addMesh(
        new THREE.BoxGeometry(bar.w, 0.045, 0.018),
        palePrint,
        new THREE.Vector3(bar.x, bar.y, 1.345)
      );
    }

    const scuffMat = new THREE.MeshStandardMaterial({
      color: 0xa4a39a,
      roughness: 0.95,
      transparent: true,
      opacity: 0.42,
      depthWrite: false
    });

    const scuffs = [
      [-2.82, 1.36, 0.34, 0.025, 0.18],
      [-2.54, 1.22, 0.54, 0.018, -0.09],
      [2.68, 1.08, 0.3, 0.02, -0.24],
      [2.76, 3.9, 0.25, 0.018, 0.14],
      [-0.15, 4.18, 0.37, 0.018, -0.04],
      [-2.9, 3.78, 0.31, 0.02, 0.1],
      [0.7, 1.05, 0.22, 0.017, -0.2]
    ];
    for (const [x, y, width, height, angle] of scuffs) {
      const mark = addMesh(
        new THREE.PlaneGeometry(width, height),
        scuffMat,
        new THREE.Vector3(x, y, 1.157)
      );
      mark.rotation.z = angle;
      mark.castShadow = false;
    }

    for (let i = 0; i < 22; i++) {
      const x = -3 + ((i * 1.73) % 5.9);
      const y = 0.95 + ((i * 0.83) % 3.05);
      if ((x + 1.02) ** 2 + (y - 2.48) ** 2 < 2.2) continue;
      const speck = addMesh(
        new THREE.CircleGeometry(0.012 + (i % 3) * 0.006, 8),
        scuffMat,
        new THREE.Vector3(x, y, 1.159)
      );
      speck.castShadow = false;
    }

    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x343637,
      roughness: 0.88,
      metalness: 0
    });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0.48;
    ground.receiveShadow = true;
    scene.add(ground);

    const backdrop = new THREE.Mesh(
      new THREE.CircleGeometry(8.5, 96),
      new THREE.MeshBasicMaterial({
        color: 0x2d3234,
        transparent: true,
        opacity: 0.35,
        depthWrite: false
      })
    );
    backdrop.rotation.x = -Math.PI / 2;
    backdrop.position.set(0, 0.491, 0);
    scene.add(backdrop);

    const hemisphere = new THREE.HemisphereLight(0xc8d5d7, 0x302a24, 1.5);
    scene.add(hemisphere);

    const keyLight = new THREE.DirectionalLight(0xfff2db, 4.3);
    keyLight.position.set(5, 10, 8);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -7;
    keyLight.shadow.camera.right = 7;
    keyLight.shadow.camera.top = 7;
    keyLight.shadow.camera.bottom = -7;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 28;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x8fb8d0, 1.65);
    fillLight.position.set(-7, 5, 4);
    scene.add(fillLight);

    const rimLight = new THREE.PointLight(0xffb77f, 32, 18, 2);
    rimLight.position.set(4, 5, -6);
    scene.add(rimLight);

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
