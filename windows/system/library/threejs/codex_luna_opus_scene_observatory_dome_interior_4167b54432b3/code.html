<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Observatory Dome Interior</title>
<style>
html,body{margin:0;overflow:hidden;background:#03050d;color:#d8e7ff;font-family:system-ui,sans-serif}
#info{position:fixed;left:18px;top:16px;z-index:2;letter-spacing:.14em;font-size:11px;color:#8fa8c9;text-transform:uppercase;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="info">MOUNT E-17 · NORTH DOME · SKY SURVEY</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x07101d,.018);
const clock=new THREE.Clock();
let seed=913742;
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function mat(color,rough=.6,metal=0,emissive=0x000000,intensity=0){
  return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,emissive,emissiveIntensity:intensity});
}
const iron=mat(0x303943,.28,.72), ironDark=mat(0x151d26,.4,.65);
const brass=mat(0xb98b45,.3,.8), warm=mat(0xd9a94b,.28,.65);
const wallMat=mat(0x59616b,.82,.22), trim=mat(0x222c35,.42,.62);
const wood=mat(0x35231b,.65,.05), woodEdge=mat(0x6e4930,.45,.1);
const glass=mat(0x85cfe6,.08,.55,0x134d68,.5);
const glow=mat(0xffbd51,.25,.1,0xff8a16,2.8);
const cyan=mat(0x56e4ff,.22,.15,0x0e8ea8,2.2);

function mesh(g,m,p=[0,0,0],r=[0,0,0],s=[1,1,1]){
 const o=new THREE.Mesh(g,m);o.position.set(...p);o.rotation.set(...r);o.scale.set(...s);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o;
}
function group(parent=scene){const g=new THREE.Group();parent.add(g);return g}
function cyl(rad,depth,m,seg=32){return new THREE.CylinderGeometry(rad,rad,depth,seg)}
function box(x,y,z,m){return new THREE.BoxGeometry(x,y,z)}
function torus(R,r,m){return new THREE.TorusGeometry(R,r,12,64)}

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
document.body.appendChild(renderer.domElement);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);
camera.position.set(15,9,18);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.05;controls.autoRotate=true;controls.autoRotateSpeed=.22;
controls.target.set(0,5,0);controls.maxPolarAngle=Math.PI*.48;controls.minDistance=8;controls.maxDistance=30;

scene.add(new THREE.HemisphereLight(0x7189b4,0x17120f,1.6));
const moon=new THREE.DirectionalLight(0xa5c9ff,2.3);moon.position.set(-8,16,9);moon.castShadow=true;
moon.shadow.mapSize.set(2048,2048);moon.shadow.camera.left=-18;moon.shadow.camera.right=18;moon.shadow.camera.top=18;moon.shadow.camera.bottom=-4;scene.add(moon);
const lamp=new THREE.PointLight(0xffa64b,3,18,2);lamp.position.set(-5,7,3);lamp.castShadow=true;scene.add(lamp);

const floor=mesh(new THREE.CircleGeometry(17,96),mat(0x171b21,.7,.3),[0,0,0],[-Math.PI/2,0,0]);
mesh(new THREE.TorusGeometry(16.6,.18,12,96),brass,[0,.08,0],[-Math.PI/2,0,0]);
for(let i=0;i<24;i++){
 const a=i*Math.PI*2/24;
 mesh(box(.08,.045,2.2,trim),[16*Math.sin(a),.07,16*Math.cos(a)],[0,0,0]);
}

function domePatch(a0,a1){
 const seg=3, rings=8, verts=[],inds=[];
 for(let j=0;j<=rings;j++){
  const th=j/rings*Math.PI/2;
  const r=16*Math.sin(th), y=16*Math.cos(th);
  for(let i=0;i<=seg;i++){const a=a0+(a1-a0)*i/seg;verts.push(r*Math.sin(a),y,r*Math.cos(a))}
 }
 for(let j=0;j<rings;j++)for(let i=0;i<seg;i++){
  const q=j*(seg+1)+i;inds.push(q,q+1,q+seg+2,q,q+seg+2,q+seg+1);
 }
 const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(verts,3));g.setIndex(inds);g.computeVertexNormals();
 const o=new THREE.Mesh(g,wallMat);o.castShadow=true;o.receiveShadow=true;scene.add(o);
}
const slit=.31, panels=18;
for(let i=0;i<panels;i++){const a0=-Math.PI+i*2*Math.PI/panels,a1=-Math.PI+(i+1)*2*Math.PI/panels;if(a1<-slit||a0>slit)domePatch(a0,a1)}
for(let side of [-1,1]){
 const rail=mesh(torus(16,.12,brass),[0,0,0]);rail.scale.y=.02;rail.position.y=10.8;
}
mesh(box(1.15,16,.18,trim),[0,8.1,15.9]);
mesh(box(1.15,16,.18,trim),[0,8.1,-15.9]);
const slitRailL=mesh(box(.18,16,.22,brass),[-2.45,8,15.82]);
const slitRailR=mesh(box(.18,16,.22,brass),[2.45,8,15.82]);

function starField(){
 const p=[],c=[];
 for(let i=0;i<900;i++){
  const a=rnd()*Math.PI*2, u=rnd()*2-1, r=28, q=Math.sqrt(1-u*u);
  const x=r*q*Math.sin(a),y=r*u+10,z=r*q*Math.cos(a);
  if(z<5)continue;
  p.push(x,y,z);const b=.45+rnd()*.55;c.push(b,b*.85,1);
 }
 const g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(p,3));g.setAttribute("color",new THREE.Float32BufferAttribute(c,3));
 const m=new THREE.PointsMaterial({size:.09,vertexColors:true,transparent:true,opacity:.9});
 const stars=new THREE.Points(g,m);scene.add(stars);return stars;
}
const stars=starField();
const milky=[];
for(let i=0;i<650;i++){
 const x=(rnd()-.5)*34,z=10+rnd()*25,y=7+(rnd()-.5)*5;
 milky.push(x,y,z);
}
const mg=new THREE.BufferGeometry();mg.setAttribute("position",new THREE.Float32BufferAttribute(milky,3));
scene.add(new THREE.Points(mg,new THREE.PointsMaterial({color:0xb9d1ff,size:.14,transparent:true,opacity:.18})));

const catwalk=group();
catwalk.position.y=9.1;
catwalk.add(new THREE.Mesh(new THREE.RingGeometry(10.3,11.3,96),box(1,1,1,trim)));
catwalk.children[0].rotation.x=-Math.PI/2;
catwalk.add(new THREE.Mesh(new THREE.TorusGeometry(11.3,.13,10,96),brass));
catwalk.children[1].rotation.x=-Math.PI/2;
for(let i=0;i<18;i++){const a=i*Math.PI*2/18;const p=new THREE.Mesh(box(.1,.8,.1,brass));p.position.set(10.8*Math.sin(a),-.4,10.8*Math.cos(a));catwalk.add(p)}
const stair=group();stair.position.set(10,0,5);
for(let i=0;i<12;i++){const s=mesh(box(2,.16,1.1,woodEdge),[10-i*.28,i*.72,5-i*.42],[0,0.22,0]);}
mesh(box(2,9,.16,brass),[8,4.4,2.1],[0,.22,0]);mesh(box(2,9,.16,brass),[10.8,4.4,6.4],[0,.22,0]);

function makeDesk(){
 const d=group();d.position.set(-7,0,5.2);
 d.add(new THREE.Mesh(box(5,.35,1.7,woodEdge)));d.children[0].position.y=3.3;
 for(const x of [-2,2])for(const z of [-.55,.55]){const l=new THREE.Mesh(box(.25,3,.25,wood));l.position.set(x,1.55,z);d.add(l)}
 const top=new THREE.Mesh(box(4.6,.12,1.45,brass));top.position.y=3.53;d.add(top);
 const panel=new THREE.Mesh(box(3.6,.12,1.1,iron));panel.position.set(0,3.72,-.18);panel.rotation.x=-.42;d.add(panel);
 for(let i=0;i<7;i++){const x=-1.45+i*.48;const dial=new THREE.Mesh(new THREE.CylinderGeometry(.17,.17,.07,24),i%2?glow:cyan);dial.rotation.x=Math.PI/2;dial.position.set(x,4.05,.27);d.add(dial)}
 for(let i=0;i<4;i++){const bar=new THREE.Mesh(box(.35,.03,.5,glow));bar.position.set(-1.3+i*.85,4.15,-.03);d.add(bar)}
 const chair=mesh(cyl(.65,1.8,ironDark),[ -7,1.1,3.3]);chair.position.y=1.1;
 return d;
}
makeDesk();

function bookcase(x,z){
 const b=group();b.position.set(x,0,z);b.rotation.y=x>0?Math.PI:0;
 b.add(new THREE.Mesh(box(3.1,7.2,.45,wood)));b.children[0].position.y=3.6;
 for(let y=1;y<7;y+=1.15){const shelf=new THREE.Mesh(box(2.8,.13,.8,woodEdge));shelf.position.set(0,y,0);b.add(shelf)}
 for(let i=0;i<22;i++){const h=.35+rnd()*.6;const book=new THREE.Mesh(box(.14,h,.5,[brass,cyan,glow,woodEdge][i%4]));book.position.set(-1.1+(i%7)*.34,.65+Math.floor(i/7)*1.15,h*.0);b.add(book)}
}
bookcase(13,-5);bookcase(-13,-4);

function chartTexture(){
 const c=document.createElement("canvas");c.width=512;c.height=384;const x=c.getContext("2d");
 x.fillStyle="#172b3e";x.fillRect(0,0,512,384);x.strokeStyle="#75b9d7";x.lineWidth=2;
 for(let i=0;i<16;i++){x.beginPath();x.arc(60+rnd()*390,45+rnd()*290,2+rnd()*8,0,7);x.stroke()}
 x.strokeStyle="#d6ac5b";x.beginPath();x.moveTo(70,270);x.lineTo(190,90);x.lineTo(320,190);x.lineTo(430,70);x.stroke();
 x.fillStyle="#cfdfec";x.font="18px monospace";x.fillText("ORION / 04",24,32);
 return new THREE.CanvasTexture(c);
}
for(const [a,y] of [[.9,6.2],[-.8,5.9],[2.1,7.1]]){
 const r=14.9;const p=[r*Math.sin(a),y,r*Math.cos(a)];
 const q=mesh(new THREE.PlaneGeometry(2.7,2),new THREE.MeshStandardMaterial({map:chartTexture(),roughness:.8}),p,[0,a+Math.PI,0]);q.position.y=y;
}

const telescope=group();telescope.position.set(0,4.3,0);
mesh(cyl(1.45,1.1,ironDark,48),[0,1.1,0]);
mesh(torus(1.5,.18,brass),[0,1.68,0],[0,0,0]);
mesh(cyl(.62,4.5,ironDark,48),[0,4.1,0],[0,0,0]);
mesh(torus(.82,.14,brass),[0,2.35,0]);mesh(torus(.82,.14,brass),[0,5.85,0]);
mesh(cyl(.3,1.3,glass),[0,6.7,0]);
const mount=group();mount.position.set(0,6.0,0);mount.rotation.z=-.16;
mesh(cyl(.23,5,brass),[0,0,0],[0,0,Math.PI/2]);
const tube=group();tube.position.set(0,6,0);tube.rotation.x=-.57;
function addToTube(o){tube.add(o);o.castShadow=true;o.receiveShadow=true}
const tubeBody=new THREE.Mesh(new THREE.CylinderGeometry(.65,.78,5.5,48),iron);tubeBody.rotation.x=Math.PI/2;tubeBody.position.z=0;addToTube(tubeBody);
const tubeBand1=new THREE.Mesh(new THREE.TorusGeometry(.78,.12,12,48),brass);tubeBand1.rotation.x=Math.PI/2;tubeBand1.position.z=-1.9;addToTube(tubeBand1);
const tubeBand2=tubeBand1.clone();tubeBand2.position.z=1.9;addToTube(tubeBand2);
const lens=new THREE.Mesh(new THREE.CylinderGeometry(.55,.55,.16,48),glass);lens.rotation.x=Math.PI/2;lens.position.z=2.8;addToTube(lens);
const hood=new THREE.Mesh(new THREE.CylinderGeometry(.8,.72,.7,48),ironDark);hood.rotation.x=Math.PI/2;hood.position.z=2.9;addToTube(hood);
const finder=new THREE.Mesh(new THREE.CylinderGeometry(.13,.16,1.5,20),brass);finder.rotation.x=Math.PI/2;finder.position.set(.65,.55,.2);addToTube(finder);
mesh(torus(.18,.05,cyan),[.65,.55,.98],[Math.PI/2,0,0]);
const counter=mesh(cyl(.25,2.8,brass),[0,5.2,0],[0,0,Math.PI/2]);counter.rotation.z=Math.PI/2;

function panelLabel(text){
 const c=document.createElement("canvas");c.width=256;c.height=64;const x=c.getContext("2d");
 x.fillStyle="#07111a";x.fillRect(0,0,256,64);x.strokeStyle="#4f9ab7";x.strokeRect(2,2,252,60);
 x.fillStyle="#9bd9ef";x.font="bold 20px monospace";x.fillText(text,15,40);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true}));
 s.scale.set(2.8,.7,1);return s;
}
const label=panelLabel("RA 05h 35m");label.position.set(0,4.5,-.92);scene.add(label);
const pipe=mesh(cyl(.11,3.8,ironDark),[4,1.9,3],[Math.PI/2,0,.2]);
for(let i=0;i<4;i++)mesh(torus(.22,.06,brass),[4,1.9,1.5+i*.7],[Math.PI/2,0,0]);

const beacon=mesh(new THREE.SphereGeometry(.18,20,12),glow,[0,7.8,0]);
const starsBase=stars.material;
function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();
 controls.update();
 tube.rotation.y=Math.sin(t*.12)*.055;
 mount.rotation.z=-.16+Math.sin(t*.16)*.025;
 beacon.scale.setScalar(1+.18*Math.sin(t*3));
 starsBase.opacity=.78+.18*Math.sin(t*.7);
 lamp.intensity=2.7+.3*Math.sin(t*2.3);
 renderer.render(scene,camera);
}
addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
animate();
</script>
</body>
</html>
