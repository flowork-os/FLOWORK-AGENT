<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyberpunk Rain Alley</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#03040b}
canvas{display:block}
#hud{position:fixed;left:18px;bottom:16px;color:#7ff9ff;font:11px monospace;letter-spacing:2px;opacity:.7;text-shadow:0 0 8px #00eaff;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hud">SECTOR 07 // RAINFALL 84% // NEON DISTRICT</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03050d);
scene.fog = new THREE.FogExp2(0x070b19, 0.026);

const camera = new THREE.PerspectiveCamera(54, innerWidth / innerHeight, .1, 180);
camera.position.set(15, 10, 18);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .055;
controls.autoRotate = true;
controls.autoRotateSpeed = .32;
controls.target.set(0, 6, -8);
controls.maxPolarAngle = Math.PI * .48;
controls.minDistance = 10;
controls.maxDistance = 38;

let seed = 823741;
function rnd(){
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function pick(a,b){return a+(b-a)*rnd()}
function mat(color, emissive=0x000000, intensity=0, rough=.55, metal=0){
  return new THREE.MeshStandardMaterial({
    color, emissive, emissiveIntensity:intensity,
    roughness:rough, metalness:metal
  });
}
function box(w,h,d,material,x,y,z){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  m.position.set(x,y,z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}
function cyl(r,h,material,x,y,z,segments=12){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,segments),material);
  m.position.set(x,y,z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
  return m;
}
function line(points, material, radius=.025){
  const g = new THREE.BufferGeometry().setFromPoints(points);
  const m = new THREE.Line(g,material);
  scene.add(m);
  return m;
}
function glow(color,intensity=2){
  return new THREE.MeshBasicMaterial({color,transparent:true,opacity:.9});
}

const cyan = mat(0x063842,0x00eaff,5,.28,.35);
const cyanBright = mat(0x21f4ff,0x00efff,8,.25,.2);
const pink = mat(0x50112e,0xff176e,5,.32,.25);
const pinkBright = mat(0xff277f,0xff126d,8,.25,.1);
const violet = mat(0x271145,0x9a3dff,4,.34,.2);
const yellow = mat(0x503c0b,0xffbd26,4,.34,.1);
const dark = mat(0x101520,0x06101a,.2,.7,.55);
const black = mat(0x080b12,0x000000,0,.85,.25);
const rust = mat(0x3a252c,0x180812,.15,.8,.3);
const concrete = mat(0x202433,0x03040a,.1,.95,0);
const pipeMat = mat(0x263343,0x071a28,.3,.4,.75);
const glass = new THREE.MeshPhysicalMaterial({
  color:0x062533, emissive:0x00b8d4, emissiveIntensity:1.4,
  transparent:true, opacity:.55, roughness:.12, metalness:.25
});

const ground = box(24,.3,52,dark,0,-.15,-12);
ground.receiveShadow = true;
box(24,16,.5,concrete,0,8,-32);
box(.5,16,52,concrete,-12,8,-12);
box(.5,16,52,concrete,12,8,-12);

for(let i=0;i<20;i++){
  const z = -1-i*2.7;
  const width = pick(2.2,5.4);
  box(width,pick(5,12),.7,concrete,-12+width/2,pick(3.5,6),z);
  box(width,pick(5,12),.7,concrete,12-width/2,pick(3.5,6),z+.7);
}

const wet = new THREE.MeshStandardMaterial({
  color:0x101a2e, roughness:.16, metalness:.72,
  emissive:0x020716
});
for(let i=0;i<45;i++){
  const w=pick(.15,2.8), d=pick(.03,.18);
  const p=box(w,.012,d,wet,pick(-8.8,8.8),.012,pick(-27,10));
  p.rotation.y=pick(-.15,.15);
}
for(let i=0;i<15;i++){
  const x=pick(-9,9), z=pick(-29,8);
  const stripe=box(pick(.8,2.8),.016,.045,i%2?cyanBright:pinkBright,x,.025,z);
  stripe.material.transparent=true;
  stripe.material.opacity=.28;
}

function canvasTexture(text, color, bg="#07101c", vertical=false){
  const c=document.createElement("canvas");
  c.width=vertical?180:620; c.height=vertical?620:180;
  const ctx=c.getContext("2d");
  ctx.fillStyle=bg; ctx.fillRect(0,0,c.width,c.height);
  ctx.strokeStyle=color; ctx.lineWidth=8; ctx.strokeRect(8,8,c.width-16,c.height-16);
  ctx.shadowColor=color; ctx.shadowBlur=22; ctx.fillStyle=color;
  ctx.font=`bold ${vertical?72:76}px sans-serif`;
  ctx.textAlign="center"; ctx.textBaseline="middle";
  const chars=text.split("");
  if(vertical){
    chars.forEach((ch,i)=>ctx.fillText(ch,c.width/2,75+i*92));
  }else ctx.fillText(text,c.width/2,c.height/2);
  for(let i=0;i<20;i++){
    ctx.globalAlpha=.13; ctx.fillRect(20,15+i*8,c.width-40,2);
  }
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function sign(text,color,x,y,z,w,h,rot=0){
  const texture=canvasTexture(text,color);
  const material=new THREE.MeshBasicMaterial({map:texture,transparent:true,side:THREE.DoubleSide});
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),material);
  m.position.set(x,y,z); m.rotation.y=rot;
  scene.add(m);
  const frame=box(w+.14,h+.14,.12,black,x,y,z);
  frame.rotation.y=rot;
  m.renderOrder=3;
  return m;
}
sign("ネオン", "#00f5ff",-10.7,9.3,-6,3.8,1.15,Math.PI/2);
sign("RAMEN", "#ff176e",10.65,7.8,-9,4.8,1.35,-Math.PI/2);
sign("夜 夢", "#b54cff",-10.55,5.7,-14,1.45,4.7,Math.PI/2);
sign("404", "#ffe02e",10.55,11.3,-19,1.4,3.7,-Math.PI/2);
sign("CYBER", "#00f5ff",-10.45,10.8,-23,4.3,1.2,Math.PI/2);

function neonTube(a,b,color,r=.035){
  const d=new THREE.Vector3().subVectors(b,a);
  const m=cyl(r,d.length(),glow(color),0,0,0,8);
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
  return m;
}
neonTube(new THREE.Vector3(-11.65,1,-2),new THREE.Vector3(-11.65,14,-2),0x00eaff,.055);
neonTube(new THREE.Vector3(11.65,1,-9),new THREE.Vector3(11.65,14,-9),0xff1475,.055);
neonTube(new THREE.Vector3(-11.65,14,-2),new THREE.Vector3(11.65,14,-9),0x813cff,.045);

function acUnit(x,y,z,side){
  const g=new THREE.Group();
  g.position.set(x,y,z);
  g.rotation.y=side*Math.PI/2;
  scene.add(g);
  const body=new THREE.Mesh(new THREE.BoxGeometry(2.2,1.15,.75),dark);
  body.castShadow=true; body.receiveShadow=true; g.add(body);
  const grille=new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,.04,24),glass);
  grille.rotation.z=Math.PI/2; grille.position.set(0,0,.4); g.add(grille);
  for(let i=-2;i<=2;i++){
    const fin=box(.08,.58,.08,pipeMat,0,i*.17,0);
    fin.rotation.z=Math.PI/2; fin.position.set(i*.17,0,.45); g.add(fin);
  }
  const drip=cyl(.035,pick(.4,1),cyanBright,.72,-.75,.38,7);
  drip.position.x=pick(-.7,.7); drip.position.y=-.8; g.add(drip);
  return g;
}
for(let i=0;i<6;i++){
  acUnit(-10.3,3+i*1.8,-4-i*3.8,1);
  if(i%2===0) acUnit(10.3,4+i*2.1,-8-i*4.4,-1);
}

function stall(){
  const g=new THREE.Group(); g.position.set(-5.5,0,-9); scene.add(g);
  box(4.4,.28,1.65,dark,-0,2.9,0);
  box(4.7,.18,1.9,pinkBright,0,3.08,0);
  box(4.25,2.6,.12,black,0,1.55,.78);
  box(4.25,.08,.08,cyanBright,0,2.92,.86);
  for(let x=-1.7;x<=1.7;x+=.5) neonTube(new THREE.Vector3(x,2.94,.9),new THREE.Vector3(x+.15,2.94,.9),x<0?0xff176e:0x00eaff,.025);
  box(4.5,.18,1.4,pipeMat,0,.25,0);
  const pot=cyl(.72,.7,black,-.8,1.05,.1,16);
  cyl(.58,.04,yellow,-.8,1.42,.1,16);
  for(let i=0;i<5;i++){
    const s=cyl(.035,pick(.7,1.4),new THREE.MeshBasicMaterial({color:0xe6ffff,transparent:true,opacity:.2}),pick(-1.1,.8),1.8,pick(-.1,.35),7);
    s.rotation.z=pick(-.25,.25); g.add(s);
  }
  for(let i=-1;i<=1;i++){
    const bowl=cyl(.25,.1,pinkBright,i*.55,1.05,.35,12);
    g.add(bowl);
  }
  sign("ラーメン", "#ffdb35",0,4.2,.8,3.7,.75);
  return g;
}
const stallGroup=stall();

function dumpster(x,z,color){
  const g=new THREE.Group();g.position.set(x,.8,z);scene.add(g);
  const b=box(2.2,1.5,1.55,mat(color,0x030308,.1,.82,.2),0,0,0);
  b.rotation.y=pick(-.15,.15);
  box(2.35,.18,1.7,black,0,.82,0).rotation.y=b.rotation.y;
  for(let i=0;i<3;i++) box(.08,1.1,1.58,pipeMat,-.75+i*.75,0,0);
  const lid=box(2.3,.12,1.65,black,0,1.05,0);lid.rotation.z=-.08;
}
dumpster(-7,-4,0x17333b);
dumpster(6,-5,0x321626);
dumpster(7,-15,0x26302f);

function pipe(x,y,z,rot,scale=1,color=0x00d7df){
  const p=cyl(.12*scale,5*scale,pipeMat,x,y,z,10);
  p.rotation.z=rot;
  neonTube(new THREE.Vector3(x,y-2.4*scale,z),new THREE.Vector3(x,y+2.4*scale,z),color,.018*scale);
  return p;
}
pipe(-9,5,-11,.08,1,0x00eaff);
pipe(9,6,-17,-.12,1.2,0xff1c74);
pipe(-8,4,-21,.18,.8,0x00d7df);

for(let i=0;i<13;i++){
  const a=new THREE.Vector3(-11.3,pick(10,15),pick(-29,5));
  const b=new THREE.Vector3(11.3,pick(10,15),a.z+pick(-5,5));
  const mid1=a.clone().lerp(b,.33);mid1.y-=pick(.4,1.8);
  const mid2=a.clone().lerp(b,.66);mid2.y-=pick(.5,2.2);
  line([a,mid1,mid2,b],new THREE.LineBasicMaterial({color:i%3?0x172b46:0x5d174e}),pick(.01,.04));
}

const lightC=new THREE.PointLight(0x00eaff,7,15,2);
lightC.position.set(-7,5,-7);lightC.castShadow=true;lightC.shadow.mapSize.set(512,512);scene.add(lightC);
const lightP=new THREE.PointLight(0xff116c,8,17,2);
lightP.position.set(7,6,-12);lightP.castShadow=true;lightP.shadow.mapSize.set(512,512);scene.add(lightP);
const lightY=new THREE.PointLight(0xffa91f,5,9,2);
lightY.position.set(-5,2,-9);scene.add(lightY);
scene.add(new THREE.HemisphereLight(0x182957,0x05040b,1.5));

function steam(x,z){
  const group=new THREE.Group();group.position.set(x,.3,z);scene.add(group);
  for(let i=0;i<8;i++){
    const s=new THREE.Mesh(
      new THREE.SphereGeometry(pick(.15,.34),8,8),
      new THREE.MeshBasicMaterial({color:0x9bcdd6,transparent:true,opacity:.075,depthWrite:false})
    );
    s.position.set(pick(-.45,.45),pick(0,1.2),pick(-.25,.25));
    s.userData={phase:pick(0,6.28),speed:pick(.25,.65),base:s.position.clone()};
    group.add(s);
  }
  return group;
}
const steamGroups=[steam(-7,-4),steam(6,-5),steam(-3,-20),steam(3,-24)];

const rainGroup=new THREE.Group();scene.add(rainGroup);
const rainCount=900;
const rainPos=new Float32Array(rainCount*6);
for(let i=0;i<rainCount;i++){
  const j=i*6,x=pick(-12,12),z=pick(-31,10),y=pick(0,17);
  rainPos[j]=x;rainPos[j+1]=y;rainPos[j+2]=z;
  rainPos[j+3]=x+.03;rainPos[j+4]=y-pick(.35,.9);rainPos[j+5]=z+.01;
}
const rainGeo=new THREE.BufferGeometry();
rainGeo.setAttribute("position",new THREE.BufferAttribute(rainPos,3));
const rainMat=new THREE.LineBasicMaterial({color:0x6fd8ff,transparent:true,opacity:.33});
const rain=new THREE.LineSegments(rainGeo,rainMat);rainGroup.add(rain);

function drone(){
  const g=new THREE.Group();g.position.set(3.2,9,-12);scene.add(g);
  box(1.8,.42,1.1,black,0,0,0);
  box(1.15,.12,.5,cyanBright,0,-.25,0);
  for(const sx of [-1,1])for(const sz of [-1,1]){
    const arm=box(1.3,.08,.08,pipeMat,sx*.9,.12,sz*.48);
    arm.rotation.z=sx*0.12;g.add(arm);
    const rotor=cyl(.42,.035,pinkBright,sx*1.5,.22,sz*.58,20);
    g.add(rotor);
    rotor.userData.spin=true;
  }
  const lamp=cyl(.12,.06,yellow,0,-.3,0,12);lamp.rotation.x=Math.PI/2;g.add(lamp);
  return g;
}
const droneGroup=drone();

function holo(x,y,z,text,color){
  const c=document.createElement("canvas");c.width=480;c.height=240;
  const q=c.getContext("2d");q.clearRect(0,0,480,240);
  q.font="bold 42px monospace";q.textAlign="center";q.fillStyle=color;q.shadowColor=color;q.shadowBlur=20;
  q.fillText(text,240,110);q.font="16px monospace";q.fillText("QUANTUM DELIVERY // LIVE",240,145);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const m=new THREE.Mesh(new THREE.PlaneGeometry(3.5,1.75),new THREE.MeshBasicMaterial({map:t,transparent:true,opacity:.58,depthWrite:false,blending:THREE.AdditiveBlending}));
  m.position.set(x,y,z);m.rotation.y=x<0?Math.PI/2:-Math.PI/2;scene.add(m);return m;
}
const holoA=holo(-7,5,-17,"NOVA//7","#00efff");
const holoB=holo(7,8,-22,"ECHO","#ff2b91");

for(let i=0;i<24;i++){
  const x=pick(-10,10),z=pick(-28,7);
  const r=cyl(pick(.025,.07),pick(.3,1.2),i%2?cyanBright:pinkBright,x,pick(.2,3),z,7);
  r.rotation.z=Math.PI/2; r.material.transparent=true;r.material.opacity=.5;
}
for(let i=0;i<18;i++){
  const x=pick(-9,9),z=pick(-29,8);
  const puddle=new THREE.Mesh(new THREE.CircleGeometry(pick(.25,1.2),24),new THREE.MeshBasicMaterial({color:i%2?0x063e54:0x42102e,transparent:true,opacity:.14}));
  puddle.rotation.x=-Math.PI/2;puddle.position.set(x,.018,z);scene.add(puddle);
}

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();

  rainGroup.position.y=-(t*8%16);
  droneGroup.position.y=9+Math.sin(t*.8)*.28;
  droneGroup.rotation.y=t*.35;
  droneGroup.children.forEach(o=>{if(o.userData.spin)o.rotation.y=t*8});
  [holoA,holoB].forEach((m,i)=>{
    m.material.opacity=.36+.2*(Math.sin(t*(7+i*2))+1)/2;
    m.position.y+=(Math.sin(t*1.2+i)*.0008);
  });
  steamGroups.forEach((g,gi)=>g.children.forEach((s,i)=>{
    const p=s.userData.base;
    s.position.x=p.x+Math.sin(t*s.userData.speed+s.userData.phase)*.18;
    s.position.y=p.y+(t*s.userData.speed*.35%1.5);
    if(s.position.y>1.7)s.position.y=0;
    s.scale.setScalar(.7+.35*Math.sin(t*1.5+i+gi));
  }));
  lightC.intensity=6.3+Math.sin(t*4.1)*1.1;
  lightP.intensity=7.2+Math.sin(t*5.3+1)*1.5;
  controls.update();
  renderer.render(scene,camera);
}
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
animate();
</script>
</body>
</html>
