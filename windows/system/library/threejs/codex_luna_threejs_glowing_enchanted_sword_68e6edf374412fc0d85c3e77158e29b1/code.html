<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enchanted Sword</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02080d;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02080d);
scene.fog = new THREE.FogExp2(0x02080d, 0.035);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.2, 2.4, 10.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 6;
controls.maxDistance = 17;
controls.target.set(0, 2.15, 0);

scene.add(new THREE.HemisphereLight(0x163c4c, 0x010205, 1.2));

const cyanLight = new THREE.PointLight(0x00eaff, 12, 12, 2);
cyanLight.position.set(0, 2.4, 0.8);
cyanLight.castShadow = true;
cyanLight.shadow.mapSize.set(1024, 1024);
scene.add(cyanLight);

const tealLight = new THREE.PointLight(0x00a99d, 7, 7, 2);
tealLight.position.set(0, -0.55, 0.6);
scene.add(tealLight);

const rimLight = new THREE.DirectionalLight(0x3b8fae, 2.4);
rimLight.position.set(-5, 7, 6);
rimLight.castShadow = true;
rimLight.shadow.mapSize.set(1024, 1024);
scene.add(rimLight);

const sword = new THREE.Group();
sword.rotation.z = -0.035;
scene.add(sword);

const steel = new THREE.MeshStandardMaterial({
  color: 0x142832,
  metalness: 0.92,
  roughness: 0.22,
  emissive: 0x032936,
  emissiveIntensity: 1.4
});

const darkSteel = new THREE.MeshStandardMaterial({
  color: 0x08151c,
  metalness: 0.9,
  roughness: 0.28,
  emissive: 0x021c25,
  emissiveIntensity: 0.8
});

const glow = new THREE.MeshStandardMaterial({
  color: 0x27ffff,
  emissive: 0x00eaff,
  emissiveIntensity: 7,
  metalness: 0.18,
  roughness: 0.18
});

const softGlow = new THREE.MeshStandardMaterial({
  color: 0x42fff1,
  emissive: 0x00cfc2,
  emissiveIntensity: 4.5,
  metalness: 0.35,
  roughness: 0.2
});

const auraMaterial = new THREE.MeshBasicMaterial({
  color: 0x00f6e9,
  transparent: true,
  opacity: 0.075,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

function bladeShape(width, height, shoulder) {
  const shape = new THREE.Shape();
  shape.moveTo(-width * 0.54, 0);
  shape.lineTo(-width * 0.5, height - 0.62);
  shape.lineTo(-width * 0.18, height - 0.12);
  shape.lineTo(0, height);
  shape.lineTo(width * 0.18, height - 0.12);
  shape.lineTo(width * 0.5, height - 0.62);
  shape.lineTo(width * 0.54, 0);
  shape.lineTo(shoulder, -0.12);
  shape.lineTo(-shoulder, -0.12);
  shape.closePath();
  return shape;
}

const bladeGeometry = new THREE.ExtrudeGeometry(bladeShape(0.72, 6.35, 0.32), {
  depth: 0.18,
  bevelEnabled: true,
  bevelThickness: 0.045,
  bevelSize: 0.055,
  bevelSegments: 3,
  curveSegments: 8
});
bladeGeometry.center();
bladeGeometry.translate(0, 2.15, 0);
const blade = new THREE.Mesh(bladeGeometry, steel);
blade.castShadow = true;
blade.receiveShadow = true;
sword.add(blade);

const innerGeometry = new THREE.ExtrudeGeometry(bladeShape(0.39, 6.04, 0.17), {
  depth: 0.035,
  bevelEnabled: true,
  bevelThickness: 0.018,
  bevelSize: 0.02,
  bevelSegments: 2
});
innerGeometry.center();
innerGeometry.translate(0, 2.16, 0.11);
const innerBlade = new THREE.Mesh(innerGeometry, new THREE.MeshStandardMaterial({
  color: 0x073f4c,
  emissive: 0x007d91,
  emissiveIntensity: 2.5,
  metalness: 0.72,
  roughness: 0.2
}));
sword.add(innerBlade);

const fuller = new THREE.Mesh(
  new THREE.BoxGeometry(0.065, 5.45, 0.045),
  glow
);
fuller.position.set(0, 2.18, 0.24);
fuller.castShadow = true;
sword.add(fuller);

const fullerHalo = new THREE.Mesh(
  new THREE.BoxGeometry(0.16, 5.4, 0.02),
  new THREE.MeshBasicMaterial({
    color: 0x00eaff,
    transparent: true,
    opacity: 0.11,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
fullerHalo.position.set(0, 2.18, 0.22);
sword.add(fullerHalo);

function tube(points, radius, material) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geometry = new THREE.TubeGeometry(curve, Math.max(8, points.length * 4), radius, 6, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  sword.add(mesh);
  return mesh;
}

const leftEdge = [
  new THREE.Vector3(-0.24, -0.05, 0.24),
  new THREE.Vector3(-0.31, 1.45, 0.24),
  new THREE.Vector3(-0.27, 2.45, 0.24),
  new THREE.Vector3(-0.34, 3.48, 0.24),
  new THREE.Vector3(-0.28, 4.55, 0.24),
  new THREE.Vector3(-0.16, 5.62, 0.24),
  new THREE.Vector3(0, 6.26, 0.24)
];
const rightEdge = leftEdge.map(v => new THREE.Vector3(-v.x, v.y, v.z));
tube(leftEdge, 0.026, glow);
tube(rightEdge, 0.026, glow);

const edgeHaloMaterial = new THREE.MeshBasicMaterial({
  color: 0x00eaff,
  transparent: true,
  opacity: 0.14,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
tube(leftEdge, 0.075, edgeHaloMaterial);
tube(rightEdge, 0.075, edgeHaloMaterial);

function segment(x, y, length, angle, material = glow, z = 0.3, thickness = 0.036) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(length, thickness, 0.025), material);
  mesh.position.set(x, y, z);
  mesh.rotation.z = angle;
  mesh.castShadow = true;
  sword.add(mesh);
  return mesh;
}

const runePatterns = [
  [[-0.105, 0.16, 0.18, 0.45], [0.02, 0.27, 0.16, -0.8], [0.1, 0.12, 0.13, 0.6]],
  [[0.08, 0.18, 0.18, -0.45], [-0.02, 0.31, 0.15, 0.82], [-0.1, 0.12, 0.12, -0.6]],
  [[-0.1, 0.17, 0.16, 0.55], [0.01, 0.29, 0.2, -0.52], [0.1, 0.11, 0.13, 0.72]],
  [[0.1, 0.17, 0.17, -0.5], [-0.01, 0.29, 0.15, 0.7], [-0.1, 0.12, 0.12, -0.7]],
  [[-0.08, 0.17, 0.16, 0.5], [0.02, 0.3, 0.17, -0.68], [0.1, 0.12, 0.12, 0.65]],
  [[0.09, 0.16, 0.16, -0.45], [-0.01, 0.29, 0.18, 0.7], [-0.1, 0.12, 0.12, -0.65]]
];

for (let i = 0; i < runePatterns.length; i++) {
  const y = 0.56 + i * 0.78;
  for (const [ox, oy, len, ang] of runePatterns[i]) {
    segment(ox, y + oy - 0.18, len, ang);
    segment(ox, y + oy - 0.18, len * 1.85, ang, new THREE.MeshBasicMaterial({
      color: 0x00eaff,
      transparent: true,
      opacity: 0.08,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    }), 0.28, 0.095);
  }
}

const crackPoints = [
  [0.01, 5.05, 0.13, 0.35], [-0.02, 5.26, 0.12, -0.7],
  [0.02, 5.51, 0.16, 0.55], [-0.01, 5.77, 0.13, -0.5],
  [0.02, 5.98, 0.12, 0.9]
];
for (const [x, y, len, a] of crackPoints) {
  segment(x, y, len, a, glow, 0.32, 0.028);
}

const guard = new THREE.Group();
sword.add(guard);

const guardBar = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 1.78, 8, 16), softGlow);
guardBar.rotation.z = Math.PI / 2;
guardBar.position.set(0, -0.28, 0);
guardBar.castShadow = true;
guard.add(guardBar);

const guardCore = new THREE.Mesh(
  new THREE.BoxGeometry(0.3, 0.48, 0.34),
  darkSteel
);
guardCore.position.set(0, -0.27, 0);
guardCore.castShadow = true;
guard.add(guardCore);

for (const side of [-1, 1]) {
  const quillon = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.7, 7, 12), steel);
  quillon.position.set(side * 0.91, -0.38, 0);
  quillon.rotation.z = side * 0.35;
  quillon.castShadow = true;
  guard.add(quillon);

  const jewel = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), softGlow);
  jewel.position.set(side * 1.18, -0.51, 0);
  guard.add(jewel);
}

const guardAura = new THREE.Mesh(new THREE.SphereGeometry(1.25, 24, 16), auraMaterial);
guardAura.scale.set(1.3, 0.36, 0.42);
guardAura.position.set(0, -0.3, 0);
guard.add(guardAura);

const grip = new THREE.Mesh(
  new THREE.CylinderGeometry(0.17, 0.19, 1.28, 16),
  new THREE.MeshStandardMaterial({
    color: 0x071318,
    metalness: 0.55,
    roughness: 0.42,
    emissive: 0x00323a,
    emissiveIntensity: 1.1
  })
);
grip.position.set(0, -1.03, 0);
grip.castShadow = true;
sword.add(grip);

for (let i = 0; i < 7; i++) {
  const wrap = new THREE.Mesh(new THREE.TorusGeometry(0.185, 0.025, 8, 18), softGlow);
  wrap.rotation.x = Math.PI / 2;
  wrap.position.set(0, -0.48 - i * 0.17, 0);
  sword.add(wrap);
}

const pommelStem = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.16, 0.3, 14), steel);
pommelStem.position.set(0, -1.76, 0);
pommelStem.castShadow = true;
sword.add(pommelStem);

const pommel = new THREE.Mesh(new THREE.IcosahedronGeometry(0.38, 2), softGlow);
pommel.position.set(0, -2.08, 0);
pommel.scale.set(0.82, 1.12, 0.82);
pommel.castShadow = true;
sword.add(pommel);

const pommelAura = new THREE.Mesh(new THREE.SphereGeometry(0.72, 24, 16), auraMaterial);
pommelAura.position.set(0, -2.08, 0);
sword.add(pommelAura);

const sparkGroup = new THREE.Group();
sword.add(sparkGroup);
const sparks = [];
const sparkMaterial = new THREE.MeshBasicMaterial({
  color: 0x8fffff,
  blending: THREE.AdditiveBlending
});

for (let i = 0; i < 46; i++) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.018 + Math.random() * 0.026, 6, 5),
    sparkMaterial
  );
  const angle = Math.random() * Math.PI * 2;
  const radius = 0.34 + Math.random() * 0.9;
  mesh.position.set(
    Math.cos(angle) * radius,
    -1.9 + Math.random() * 8.3,
    0.12 + (Math.random() - 0.5) * 0.7
  );
  sparkGroup.add(mesh);
  sparks.push({
    mesh,
    phase: Math.random() * Math.PI * 2,
    speed: 0.35 + Math.random() * 0.8,
    drift: (Math.random() - 0.5) * 0.18,
    baseX: mesh.position.x,
    baseY: mesh.position.y
  });
}

const pedestalGlow = new THREE.Mesh(
  new THREE.CylinderGeometry(1.45, 1.75, 0.04, 64),
  new THREE.MeshBasicMaterial({
    color: 0x007d8b,
    transparent: true,
    opacity: 0.08,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
pedestalGlow.position.set(0, -2.47, 0);
sword.add(pedestalGlow);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  const pulse = 0.88 + Math.sin(t * 4.2) * 0.12 + Math.sin(t * 9.5) * 0.035;
  cyanLight.intensity = 11.5 * pulse;
  tealLight.intensity = 6.5 * (0.92 + Math.sin(t * 3.1) * 0.08);
  fuller.material.emissiveIntensity = 6.3 * pulse;
  innerBlade.material.emissiveIntensity = 2.15 + pulse * 0.8;
  guardBar.material.emissiveIntensity = 3.8 + pulse * 0.7;
  pommel.material.emissiveIntensity = 3.8 + pulse * 0.8;

  sparks.forEach((s, i) => {
    const p = (t * s.speed * 0.18 + i * 0.037) % 1;
    s.mesh.position.y = s.baseY + Math.sin(t * s.speed + s.phase) * 0.12 + p * 0.5;
    s.mesh.position.x = s.baseX + Math.sin(t * 1.3 + s.phase) * s.drift;
    s.mesh.position.z += Math.sin(t * 1.7 + s.phase) * 0.0015;
    s.mesh.scale.setScalar(0.7 + 0.5 * Math.sin(t * 7 + s.phase));
  });

  pedestalGlow.scale.set(1 + Math.sin(t * 2.5) * 0.06, 1, 1 + Math.sin(t * 2.5) * 0.06);
  controls.update();
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
