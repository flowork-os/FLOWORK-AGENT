<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartoon Cargo Trike</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #dcefe7;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdcefe7);
scene.fog = new THREE.Fog(0xdcefe7, 13, 23);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.6, 5.1, -8.2);
camera.lookAt(0, 1.25, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.25, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 6;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.48;

const hemi = new THREE.HemisphereLight(0xfff8e8, 0x729482, 2.25);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe8c5, 4.2);
key.position.set(-5, 9, -6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -7;
key.shadow.camera.near = 1;
key.shadow.camera.far = 24;
key.shadow.bias = -0.00015;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbadfd8, 1.35);
fill.position.set(6, 4, 5);
scene.add(fill);

const warm = new THREE.PointLight(0xffb55c, 1.1, 10);
warm.position.set(0, 3.5, -4);
scene.add(warm);

const palette = {
  cream: 0xffedca,
  creamLight: 0xfff7df,
  orange: 0xf27835,
  orangeLight: 0xff9a4f,
  mint: 0x79c9ac,
  mintLight: 0xa7e1c9,
  dark: 0x263734,
  rubber: 0x233330,
  brass: 0xd89a34,
  brassLight: 0xffcf63,
  glass: 0xfff3b0,
  red: 0xd94c3f
};

function mat(color, roughness = 0.72, metalness = 0) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness,
    flatShading: false
  });
}

const materials = {
  cream: mat(palette.cream, 0.78),
  creamLight: mat(palette.creamLight, 0.72),
  orange: mat(palette.orange, 0.7),
  orangeLight: mat(palette.orangeLight, 0.66),
  mint: mat(palette.mint, 0.72),
  mintLight: mat(palette.mintLight, 0.68),
  dark: mat(palette.dark, 0.9),
  rubber: mat(palette.rubber, 0.96),
  brass: mat(palette.brass, 0.34, 0.72),
  brassLight: mat(palette.brassLight, 0.28, 0.62),
  glass: new THREE.MeshPhysicalMaterial({
    color: palette.glass,
    emissive: 0xffc84c,
    emissiveIntensity: 0.8,
    roughness: 0.22,
    metalness: 0,
    clearcoat: 0.85,
    clearcoatRoughness: 0.18
  }),
  red: mat(palette.red, 0.58)
};

const trike = new THREE.Group();
trike.rotation.y = -0.04;
scene.add(trike);

function finish(mesh, cast = true, receive = true) {
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  return mesh;
}

function roundedBox(w, h, d, radius, material, position, parent = trike, segments = 5) {
  const mesh = finish(new THREE.Mesh(
    new RoundedBoxGeometry(w, h, d, segments, radius),
    material
  ));
  mesh.position.copy(position);
  parent.add(mesh);
  return mesh;
}

function cylinder(radiusTop, radiusBottom, height, material, radialSegments = 24) {
  return finish(new THREE.Mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, radialSegments),
    material
  ));
}

function sphere(radius, material, widthSegments = 28, heightSegments = 18) {
  return finish(new THREE.Mesh(
    new THREE.SphereGeometry(radius, widthSegments, heightSegments),
    material
  ));
}

function tube(points, radius, material, segments = 48, radialSegments = 10, closed = false) {
  const curve = new THREE.CatmullRomCurve3(points, closed, 'centripetal');
  return finish(new THREE.Mesh(
    new THREE.TubeGeometry(curve, segments, radius, radialSegments, closed),
    material
  ));
}

function cylinderBetween(a, b, radius, material, radialSegments = 14, parent = trike) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const mesh = cylinder(radius, radius, direction.length(), material, radialSegments);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  parent.add(mesh);
  return mesh;
}

function addOutlinedPanel(parent, width, height, position, faceZ, fillMaterial, radius = 0.11) {
  const backing = roundedBox(
    width + 0.13, height + 0.13, 0.09, radius + 0.035,
    materials.dark, new THREE.Vector3(position.x, position.y, faceZ), parent, 4
  );
  const panel = roundedBox(
    width, height, 0.075, radius,
    fillMaterial, new THREE.Vector3(position.x, position.y, faceZ - 0.058), parent, 4
  );
  backing.castShadow = false;
  return panel;
}

function makeWheel(x, y, z, scale = 1) {
  const wheel = new THREE.Group();
  wheel.position.set(x, y, z);
  wheel.scale.setScalar(scale);
  trike.add(wheel);

  const tire = finish(new THREE.Mesh(
    new THREE.TorusGeometry(0.51, 0.205, 18, 44),
    materials.rubber
  ));
  tire.rotation.y = Math.PI / 2;
  wheel.add(tire);

  const sidewall = finish(new THREE.Mesh(
    new THREE.TorusGeometry(0.51, 0.207, 16, 44, Math.PI * 2),
    materials.dark
  ));
  sidewall.rotation.y = Math.PI / 2;
  sidewall.scale.set(1.005, 0.91, 0.91);
  wheel.add(sidewall);

  const rim = finish(new THREE.Mesh(
    new THREE.TorusGeometry(0.34, 0.055, 12, 32),
    materials.cream
  ));
  rim.rotation.y = Math.PI / 2;
  wheel.add(rim);

  for (let i = 0; i < 8; i++) {
    const angle = i * Math.PI / 4;
    const a = new THREE.Vector3(0, Math.cos(angle) * 0.10, Math.sin(angle) * 0.10);
    const b = new THREE.Vector3(0, Math.cos(angle) * 0.31, Math.sin(angle) * 0.31);
    cylinderBetween(a, b, 0.018, materials.mint, 9, wheel);
  }

  const hub = cylinder(0.14, 0.14, 0.36, materials.orange, 24);
  hub.rotation.z = Math.PI / 2;
  wheel.add(hub);

  const capOuter = sphere(0.115, materials.creamLight);
  capOuter.scale.set(0.55, 1, 1);
  capOuter.position.x = x >= 0 ? 0.21 : -0.21;
  wheel.add(capOuter);

  const capDot = sphere(0.055, materials.dark);
  capDot.scale.set(0.42, 1, 1);
  capDot.position.x = x >= 0 ? 0.267 : -0.267;
  wheel.add(capDot);

  return wheel;
}

makeWheel(-1.49, 0.69, -0.57, 1.08);
makeWheel(1.49, 0.69, -0.57, 1.08);
makeWheel(0, 0.67, 1.85, 1.0);

const chassis = new THREE.Group();
trike.add(chassis);

roundedBox(1.02, 0.28, 2.72, 0.13, materials.dark, new THREE.Vector3(0, 0.76, 0.7), chassis);
roundedBox(0.82, 0.27, 2.52, 0.12, materials.mint, new THREE.Vector3(0, 0.82, 0.69), chassis);
roundedBox(3.18, 0.22, 0.54, 0.11, materials.dark, new THREE.Vector3(0, 0.76, -0.54), chassis);
roundedBox(3.02, 0.17, 0.42, 0.09, materials.orange, new THREE.Vector3(0, 0.84, -0.54), chassis);

cylinderBetween(
  new THREE.Vector3(-1.25, 0.82, -0.56),
  new THREE.Vector3(1.25, 0.82, -0.56),
  0.10, materials.dark, 18, chassis
);

const rearForkLeft = cylinderBetween(
  new THREE.Vector3(-0.27, 1.02, 0.74),
  new THREE.Vector3(-0.18, 0.67, 1.84),
  0.075, materials.orange, 14, chassis
);
const rearForkRight = cylinderBetween(
  new THREE.Vector3(0.27, 1.02, 0.74),
  new THREE.Vector3(0.18, 0.67, 1.84),
  0.075, materials.orange, 14, chassis
);

const cargo = new THREE.Group();
trike.add(cargo);

roundedBox(2.62, 1.62, 1.66, 0.22, materials.dark, new THREE.Vector3(0, 1.48, -0.73), cargo, 7);
roundedBox(2.46, 1.47, 1.52, 0.19, materials.cream, new THREE.Vector3(0, 1.53, -0.75), cargo, 7);

roundedBox(2.51, 0.24, 1.57, 0.105, materials.orange, new THREE.Vector3(0, 2.22, -0.75), cargo, 5);
roundedBox(2.28, 0.105, 1.34, 0.05, materials.orangeLight, new THREE.Vector3(0, 2.35, -0.75), cargo, 4);

addOutlinedPanel(cargo, 1.86, 0.84, new THREE.Vector3(0, 1.51, 0), -1.545, materials.mint, 0.14);
addOutlinedPanel(cargo, 0.73, 0.83, new THREE.Vector3(-0.72, 1.52, 0), -1.592, materials.mintLight, 0.12);
addOutlinedPanel(cargo, 0.73, 0.83, new THREE.Vector3(0.72, 1.52, 0), -1.592, materials.mintLight, 0.12);

const frontBadge = roundedBox(
  0.62, 0.22, 0.07, 0.09, materials.dark,
  new THREE.Vector3(0, 1.15, -1.64), cargo, 4
);
const frontBadgeInner = roundedBox(
  0.48, 0.11, 0.045, 0.045, materials.orange,
  new THREE.Vector3(0, 1.15, -1.685), cargo, 3
);

for (const side of [-1, 1]) {
  roundedBox(
    0.105, 1.14, 1.22, 0.045, materials.dark,
    new THREE.Vector3(side * 1.28, 1.53, -0.74), cargo, 3
  );
  roundedBox(
    0.073, 1.02, 1.10, 0.035, materials.orange,
    new THREE.Vector3(side * 1.326, 1.53, -0.74), cargo, 3
  );
}

const cornerBolts = [
  [-1.05, 2.09], [1.05, 2.09],
  [-1.05, 0.98], [1.05, 0.98]
];
for (const [x, y] of cornerBolts) {
  const bolt = cylinder(0.055, 0.055, 0.035, materials.brass, 16);
  bolt.rotation.x = Math.PI / 2;
  bolt.position.set(x, y, -1.605);
  cargo.add(bolt);
}

const seatPost = cylinderBetween(
  new THREE.Vector3(0, 0.92, 0.78),
  new THREE.Vector3(0, 1.73, 0.94),
  0.095, materials.dark, 18
);
const seatPostInner = cylinderBetween(
  new THREE.Vector3(0, 1.00, 0.80),
  new THREE.Vector3(0, 1.70, 0.93),
  0.057, materials.cream, 14
);

const saddle = roundedBox(
  0.76, 0.22, 0.55, 0.16, materials.dark,
  new THREE.Vector3(0, 1.78, 1.01), trike, 6
);
saddle.rotation.x = -0.06;
const saddleTop = roundedBox(
  0.64, 0.13, 0.46, 0.13, materials.orange,
  new THREE.Vector3(0, 1.84, 0.99), trike, 6
);
saddleTop.rotation.x = -0.06;

const stem = tube([
  new THREE.Vector3(0, 1.03, 0.37),
  new THREE.Vector3(0, 1.55, 0.24),
  new THREE.Vector3(0, 2.07, 0.14),
  new THREE.Vector3(0, 2.48, 0.04)
], 0.075, materials.dark, 30, 12);
const stemInner = tube([
  new THREE.Vector3(0, 1.08, 0.36),
  new THREE.Vector3(0, 1.57, 0.24),
  new THREE.Vector3(0, 2.07, 0.14),
  new THREE.Vector3(0, 2.45, 0.04)
], 0.045, materials.mint, 30, 10);

const handlebar = tube([
  new THREE.Vector3(-0.65, 2.60, 0.03),
  new THREE.Vector3(-0.42, 2.48, 0.00),
  new THREE.Vector3(0, 2.41, -0.02),
  new THREE.Vector3(0.42, 2.48, 0.00),
  new THREE.Vector3(0.65, 2.60, 0.03)
], 0.075, materials.dark, 48, 12);

const handlebarInner = tube([
  new THREE.Vector3(-0.62, 2.60, 0.03),
  new THREE.Vector3(-0.40, 2.50, 0.00),
  new THREE.Vector3(0, 2.44, -0.02),
  new THREE.Vector3(0.40, 2.50, 0.00),
  new THREE.Vector3(0.62, 2.60, 0.03)
], 0.043, materials.creamLight, 48, 10);

for (const side of [-1, 1]) {
  const grip = cylinder(0.105, 0.105, 0.30, materials.orange, 18);
  grip.rotation.z = Math.PI / 2;
  grip.rotation.y = side * 0.10;
  grip.position.set(side * 0.69, 2.62, 0.04);
  trike.add(grip);

  const gripCap = cylinder(0.112, 0.112, 0.035, materials.dark, 18);
  gripCap.rotation.z = Math.PI / 2;
  gripCap.position.set(side * 0.85, 2.62, 0.04);
  trike.add(gripCap);
}

const lampAssembly = new THREE.Group();
lampAssembly.position.set(-0.47, 2.35, -1.56);
lampAssembly.rotation.x = -0.10;
trike.add(lampAssembly);

const lampBracket = cylinderBetween(
  new THREE.Vector3(0, -0.21, 0.12),
  new THREE.Vector3(0, -0.02, 0.01),
  0.045, materials.dark, 12, lampAssembly
);
const lampBody = cylinder(0.255, 0.255, 0.22, materials.dark, 32);
lampBody.rotation.x = Math.PI / 2;
lampAssembly.add(lampBody);

const lampRim = cylinder(0.22, 0.245, 0.075, materials.brass, 32);
lampRim.rotation.x = Math.PI / 2;
lampRim.position.z = -0.135;
lampAssembly.add(lampRim);

const lens = sphere(0.185, materials.glass, 32, 20);
lens.scale.set(1, 1, 0.34);
lens.position.z = -0.195;
lampAssembly.add(lens);

const lampGlow = new THREE.PointLight(0xffc85a, 1.0, 2.7);
lampGlow.position.set(0, 0, -0.33);
lampAssembly.add(lampGlow);

const bell = new THREE.Group();
bell.position.set(0.47, 2.34, -1.56);
bell.rotation.x = -0.12;
trike.add(bell);

const bellStem = cylinder(0.045, 0.045, 0.22, materials.dark, 12);
bellStem.position.y = -0.20;
bell.add(bellStem);

const bellDome = finish(new THREE.Mesh(
  new THREE.SphereGeometry(0.20, 28, 16, 0, Math.PI * 2, 0, Math.PI * 0.58),
  materials.brass
));
bellDome.rotation.x = Math.PI;
bellDome.position.y = 0.03;
bell.add(bellDome);

const bellMouth = finish(new THREE.Mesh(
  new THREE.TorusGeometry(0.18, 0.038, 12, 30),
  materials.brassLight
));
bellMouth.rotation.x = Math.PI / 2;
bellMouth.position.y = -0.075;
bell.add(bellMouth);

const clapper = sphere(0.045, materials.dark, 18, 12);
clapper.position.y = -0.15;
bell.add(clapper);

const curlPoints = [];
for (let i = 0; i <= 28; i++) {
  const t = i / 28;
  const angle = t * Math.PI * 2.15;
  const radius = 0.15 * (1 - 0.55 * t);
  curlPoints.push(new THREE.Vector3(
    Math.cos(angle) * radius,
    0.20 + Math.sin(angle) * radius,
    -0.01 - t * 0.035
  ));
}
const bellCurl = tube(curlPoints, 0.024, materials.brassLight, 52, 9);
bell.add(bellCurl);

const pedalHub = cylinder(0.18, 0.18, 0.48, materials.dark, 24);
pedalHub.rotation.z = Math.PI / 2;
pedalHub.position.set(0, 0.92, 0.72);
trike.add(pedalHub);

for (const side of [-1, 1]) {
  const crankStart = new THREE.Vector3(side * 0.27, 0.92, 0.72);
  const crankEnd = new THREE.Vector3(side * 0.35, 0.72 + (side > 0 ? 0.31 : -0.31), 0.72);
  cylinderBetween(crankStart, crankEnd, 0.035, materials.brass, 10);
  const pedal = roundedBox(
    0.18, 0.09, 0.38, 0.045, materials.dark,
    new THREE.Vector3(crankEnd.x, crankEnd.y, crankEnd.z), trike, 4
  );
  pedal.rotation.y = 0.08 * side;
}

const rearFender = finish(new THREE.Mesh(
  new THREE.TorusGeometry(0.61, 0.075, 12, 30, Math.PI * 1.08),
  materials.cream
));
rearFender.rotation.y = Math.PI / 2;
rearFender.rotation.x = -Math.PI * 0.04;
rearFender.rotation.z = -Math.PI * 0.54;
rearFender.position.set(0, 0.69, 1.85);
trike.add(rearFender);

const tailBracket = cylinderBetween(
  new THREE.Vector3(0, 1.05, 1.72),
  new THREE.Vector3(0, 1.22, 2.17),
  0.045, materials.dark, 12
);
const tailLamp = roundedBox(
  0.27, 0.20, 0.13, 0.07, materials.dark,
  new THREE.Vector3(0, 1.23, 2.22), trike, 4
);
const tailLens = roundedBox(
  0.19, 0.12, 0.05, 0.045, materials.red,
  new THREE.Vector3(0, 1.23, 2.30), trike, 4
);

const ground = finish(new THREE.Mesh(
  new THREE.CircleGeometry(8.5, 96),
  new THREE.MeshStandardMaterial({
    color: 0xc8dfd4,
    roughness: 1,
    metalness: 0
  })
), false, true);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.025;
scene.add(ground);

const shadowDisc = new THREE.Mesh(
  new THREE.CircleGeometry(3.15, 64),
  new THREE.MeshBasicMaterial({
    color: 0x5c776d,
    transparent: true,
    opacity: 0.14,
    depthWrite: false
  })
);
shadowDisc.rotation.x = -Math.PI / 2;
shadowDisc.position.y = -0.015;
shadowDisc.scale.set(1.15, 1.55, 1);
scene.add(shadowDisc);

const ring = new THREE.Mesh(
  new THREE.RingGeometry(4.9, 5.0, 96),
  new THREE.MeshBasicMaterial({
    color: 0xa9cdc0,
    transparent: true,
    opacity: 0.42,
    side: THREE.DoubleSide
  })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = -0.012;
scene.add(ring);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  lampGlow.intensity = 0.92 + Math.sin(t * 2.1) * 0.08;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
