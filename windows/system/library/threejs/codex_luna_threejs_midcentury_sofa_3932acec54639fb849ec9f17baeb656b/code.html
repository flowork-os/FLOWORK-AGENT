<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mid-Century Sofa</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d9d1c2;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9d1c2);
scene.fog = new THREE.Fog(0xd9d1c2, 9, 18);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.2, 3.5, 6.3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.target.set(0, 1.15, 0);
controls.minDistance = 3.8;
controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI * 0.48;

const upholstery = new THREE.MeshStandardMaterial({
  color: 0x68736d,
  roughness: 0.88,
  metalness: 0
});
const upholsteryDark = new THREE.MeshStandardMaterial({
  color: 0x52605b,
  roughness: 0.92
});
const wood = new THREE.MeshStandardMaterial({
  color: 0x8b4f2c,
  roughness: 0.62,
  metalness: 0.04
});
const woodDark = new THREE.MeshStandardMaterial({
  color: 0x60351f,
  roughness: 0.68
});
const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xb8aa96,
  roughness: 0.96
});

function roundedBox(width, depth, height, radius, material, bevel = 0.06) {
  const shape = new THREE.Shape();
  const x = width / 2;
  const y = depth / 2;
  const r = Math.min(radius, x - 0.01, y - 0.01);

  shape.moveTo(-x + r, -y);
  shape.lineTo(x - r, -y);
  shape.quadraticCurveTo(x, -y, x, -y + r);
  shape.lineTo(x, y - r);
  shape.quadraticCurveTo(x, y, x - r, y);
  shape.lineTo(-x + r, y);
  shape.quadraticCurveTo(-x, y, -x, y - r);
  shape.lineTo(-x, -y + r);
  shape.quadraticCurveTo(-x, -y, -x + r, -y);

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: height,
    bevelEnabled: true,
    bevelSegments: 3,
    bevelSize: bevel,
    bevelThickness: bevel,
    curveSegments: 5
  });
  geometry.rotateX(Math.PI / 2);
  geometry.center();

  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function box(width, depth, height, material, x, y, z) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, depth, height), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const sofa = new THREE.Group();
scene.add(sofa);

const totalWidth = 4.65;
const frameDepth = 1.92;

sofa.add(roundedBox(4.58, 1.84, 0.38, 0.08, woodDark, 0.035));
sofa.children[sofa.children.length - 1].position.set(0, 0, 0.78);

sofa.add(box(4.25, 0.16, 0.42, wood, 0, -0.91, 0.88));
sofa.add(box(4.25, 0.15, 0.35, woodDark, 0, 0.81, 0.93));
sofa.add(box(0.16, 1.55, 0.30, woodDark, -2.15, 0, 0.91));
sofa.add(box(0.16, 1.55, 0.30, woodDark, 2.15, 0, 0.91));

const seatWidth = 1.37;
const seatDepth = 1.48;
const seatZ = 1.13;
for (let i = 0; i < 3; i++) {
  const x = (i - 1) * 1.49;
  const seat = roundedBox(seatWidth, seatDepth, 0.31, 0.16, upholstery, 0.08);
  seat.position.set(x, -0.12, seatZ);
  sofa.add(seat);
}

const backWidth = 1.39;
const backHeight = 1.02;
for (let i = 0; i < 3; i++) {
  const x = (i - 1) * 1.49;
  const back = roundedBox(backWidth, 0.36, backHeight, 0.15, upholsteryDark, 0.075);
  back.position.set(x, 0.60, 1.72);
  back.rotation.x = -0.075;
  sofa.add(back);
}

const armLeft = roundedBox(0.28, 1.82, 0.73, 0.12, upholstery, 0.075);
armLeft.position.set(-2.29, 0.02, 1.35);
sofa.add(armLeft);

const armRight = roundedBox(0.28, 1.82, 0.73, 0.12, upholstery, 0.075);
armRight.position.set(2.29, 0.02, 1.35);
sofa.add(armRight);

function addLeg(x, y, outwardX, outwardY) {
  const top = new THREE.Vector3(x, y, 0.78);
  const bottom = new THREE.Vector3(x + outwardX, y + outwardY, 0.08);
  const direction = bottom.clone().sub(top);
  const length = direction.length();
  const legGeometry = new THREE.CylinderGeometry(0.075, 0.12, length, 12);
  const leg = new THREE.Mesh(legGeometry, wood);
  leg.position.copy(top).add(bottom).multiplyScalar(0.5);
  leg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  leg.castShadow = true;
  leg.receiveShadow = true;
  sofa.add(leg);
}

addLeg(-1.82, -0.66, -0.18, -0.15);
addLeg(1.82, -0.66, 0.18, -0.15);
addLeg(-1.82, 0.66, -0.18, 0.15);
addLeg(1.82, 0.66, 0.18, 0.15);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.01;
floor.receiveShadow = true;
scene.add(floor);

const wall = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 14),
  new THREE.MeshStandardMaterial({ color: 0xd9d1c2, roughness: 1 })
);
wall.position.set(0, 6, -4.2);
wall.rotation.x = 0;
wall.receiveShadow = true;
scene.add(wall);

const hemi = new THREE.HemisphereLight(0xfff8ea, 0x766b61, 2.2);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe4c2, 3.7);
key.position.set(-4.5, 7.5, 5.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0xb8d4df, 1.2);
fill.position.set(5, 3, 2);
scene.add(fill);

const rim = new THREE.PointLight(0xffc998, 1.4, 8);
rim.position.set(-3, 2.8, -2.5);
scene.add(rim);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
