<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firefighter</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1a1d22}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d22);
scene.fog = new THREE.Fog(0x1a1d22, 12, 26);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(3.4, 2.6, 4.6);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.15, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.6;
controls.minDistance = 2.5;
controls.maxDistance = 12;

// Lights
scene.add(new THREE.HemisphereLight(0x8fa3bf, 0x2a2118, 0.55));
const key = new THREE.DirectionalLight(0xfff0dd, 1.6);
key.position.set(4, 6, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -4;
key.shadow.camera.right = key.shadow.camera.top = 4;
key.shadow.radius = 6;
scene.add(key);
const rim = new THREE.DirectionalLight(0x6f8cff, 0.6);
rim.position.set(-4, 3, -4);
scene.add(rim);

// Ground
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(6, 48),
  new THREE.MeshStandardMaterial({color:0x23262c, roughness:0.95})
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
// soft radial shadow disc
const c = document.createElement('canvas'); c.width = c.height = 128;
const g = c.getContext('2d');
const grad = g.createRadialGradient(64,64,8,64,64,64);
grad.addColorStop(0,'rgba(0,0,0,0.45)'); grad.addColorStop(1,'rgba(0,0,0,0)');
g.fillStyle = grad; g.fillRect(0,0,128,128);
const shadowTex = new THREE.CanvasTexture(c);
const softShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(2.6, 2.6),
  new THREE.MeshBasicMaterial({map:shadowTex, transparent:true, depthWrite:false})
);
softShadow.rotation.x = -Math.PI/2;
softShadow.position.y = 0.01;
scene.add(softShadow);

// Materials
const coatMat   = new THREE.MeshStandardMaterial({color:0x6b5a2e, roughness:0.85});
const coatDark  = new THREE.MeshStandardMaterial({color:0x4d4122, roughness:0.9});
const reflMat   = new THREE.MeshStandardMaterial({color:0xd8e63a, emissive:0x9aa514, emissiveIntensity:0.55, roughness:0.35});
const reflGray  = new THREE.MeshStandardMaterial({color:0xdadfe4, emissive:0x666e75, emissiveIntensity:0.25, roughness:0.3, metalness:0.2});
const helmetMat = new THREE.MeshStandardMaterial({color:0xb3202a, roughness:0.35, metalness:0.15});
const bootMat   = new THREE.MeshStandardMaterial({color:0x15171a, roughness:0.6});
const gloveMat  = new THREE.MeshStandardMaterial({color:0x2b2e33, roughness:0.9});
const skinMat   = new THREE.MeshStandardMaterial({color:0xc9987a, roughness:0.7});
const tankMat   = new THREE.MeshStandardMaterial({color:0xc7cdd3, roughness:0.3, metalness:0.7});
const visorMat  = new THREE.MeshStandardMaterial({color:0x223244, roughness:0.15, metalness:0.6});
const pantsMat  = new THREE.MeshStandardMaterial({color:0x5d4e28, roughness:0.9});

const F = new THREE.Group(); // firefighter
scene.add(F);
const add = (geo, mat, x, y, z, parent = F) => {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
};

// ---- Boots ----
for (const s of [-1, 1]) {
  add(new THREE.CylinderGeometry(0.15, 0.17, 0.34, 16), bootMat, 0.19*s, 0.24, 0);      // shaft
  const toe = add(new THREE.BoxGeometry(0.24, 0.16, 0.42), bootMat, 0.19*s, 0.08, 0.08); // foot
  toe.geometry.translate(0,0,0);
  add(new THREE.CylinderGeometry(0.165, 0.165, 0.05, 16), reflGray, 0.19*s, 0.38, 0);    // boot trim
}

// ---- Legs (bulky turnout pants) ----
for (const s of [-1, 1]) {
  add(new THREE.CylinderGeometry(0.155, 0.185, 0.62, 16), pantsMat, 0.19*s, 0.7, 0);
  add(new THREE.CylinderGeometry(0.165, 0.165, 0.07, 16), reflMat, 0.19*s, 0.56, 0);     // leg band
}
add(new THREE.CylinderGeometry(0.34, 0.36, 0.28, 20), pantsMat, 0, 1.06, 0);             // hips

// ---- Coat (bulky) ----
const coat = add(new THREE.CylinderGeometry(0.42, 0.47, 0.85, 24), coatMat, 0, 1.6, 0);
coat.scale.z = 0.82;
const shoulders = add(new THREE.SphereGeometry(0.44, 24, 16, 0, Math.PI*2, 0, Math.PI/2), coatMat, 0, 2.0, 0);
shoulders.scale.set(1, 0.55, 0.82);
// coat hem flare
const hem = add(new THREE.CylinderGeometry(0.47, 0.5, 0.1, 24), coatDark, 0, 1.19, 0);
hem.scale.z = 0.82;
// reflective bands on coat
for (const y of [1.33, 1.78]) {
  const band = add(new THREE.CylinderGeometry(0.455, 0.465, 0.09, 24), reflMat, 0, y, 0);
  band.scale.z = 0.83;
}
// front closure strip + collar
add(new THREE.BoxGeometry(0.07, 0.8, 0.03), coatDark, 0, 1.62, 0.375);
const collar = add(new THREE.TorusGeometry(0.19, 0.055, 10, 24), coatDark, 0, 2.16, 0);
collar.rotation.x = Math.PI/2;

// ---- Head + Helmet ----
add(new THREE.SphereGeometry(0.17, 20, 16), skinMat, 0, 2.32, 0.02);
const brim = add(new THREE.CylinderGeometry(0.31, 0.34, 0.045, 28), helmetMat, 0, 2.4, 0); // wide brim
brim.scale.z = 1.25;                    // classic elongated rear brim
brim.position.z = -0.03;
const dome = add(new THREE.SphereGeometry(0.21, 24, 16, 0, Math.PI*2, 0, Math.PI/2), helmetMat, 0, 2.4, 0);
dome.scale.y = 0.85;
add(new THREE.BoxGeometry(0.05, 0.12, 0.42), helmetMat, 0, 2.5, 0);                        // top ridge
const shield = add(new THREE.CylinderGeometry(0.06, 0.075, 0.02, 12), reflGray, 0, 2.47, 0.21); // front badge
shield.rotation.x = Math.PI/2.4;
// visor
const visor = add(new THREE.SphereGeometry(0.185, 20, 12, 0, Math.PI*2, Math.PI/3, Math.PI/4), visorMat, 0, 2.36, 0.015);

// ---- Arms + Gloves ----
for (const s of [-1, 1]) {
  const arm = new THREE.Group();
  arm.position.set(0.42*s, 1.98, 0);
  arm.rotation.z = -0.22*s;
  F.add(arm);
  add(new THREE.CylinderGeometry(0.13, 0.145, 0.75, 14), coatMat, 0, -0.38, 0, arm);
  add(new THREE.SphereGeometry(0.145, 14, 10), coatMat, 0, -0.02, 0, arm);               // shoulder cap
  add(new THREE.CylinderGeometry(0.142, 0.142, 0.07, 14), reflMat, 0, -0.52, 0, arm);    // arm band
  add(new THREE.CylinderGeometry(0.15, 0.13, 0.1, 14), gloveMat, 0, -0.78, 0, arm);      // glove cuff
  const hand = add(new THREE.SphereGeometry(0.115, 14, 10), gloveMat, 0, -0.9, 0.01, arm);
  hand.scale.set(1, 1.2, 0.85);
}

// ---- Oxygen tank on back ----
const rig = new THREE.Group();
rig.position.set(0, 1.72, -0.4);
F.add(rig);
add(new THREE.CapsuleGeometry(0.14, 0.5, 6, 16), tankMat, 0, 0, 0, rig);
add(new THREE.CylinderGeometry(0.045, 0.045, 0.1, 10), tankMat, 0, 0.44, 0, rig);        // valve
add(new THREE.TorusGeometry(0.07, 0.014, 8, 18), tankMat, 0, 0.52, 0, rig).rotation.x = Math.PI/2;
for (const y of [0.15, -0.15]) {                                                          // straps
  const strap = add(new THREE.TorusGeometry(0.4, 0.028, 8, 26, Math.PI), coatDark, 0, y, 0.38, rig);
  strap.rotation.set(Math.PI/2, 0, 0);
  strap.scale.z = 0.6;
}
// hose curving from tank to front
const hosePts = [new THREE.Vector3(0.1,2.05,-0.5), new THREE.Vector3(0.3,2.2,-0.25), new THREE.Vector3(0.28,2.28,0.05), new THREE.Vector3(0.1,2.25,0.18)];
add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(hosePts), 24, 0.035, 8), bootMat, 0, 0, 0);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
