<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portable Generator — three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17191c; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #caption {
    position: fixed; left: 16px; bottom: 14px;
    font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #aeb4bb; letter-spacing: .3px; user-select: none; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  #caption small { color: #6f767e; }
</style>
</head>
<body>
<div id="app"></div>
<div id="caption">Portable Generator<br><small>drag to orbit · scroll to zoom</small></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ---------------------------------------------------------------- renderer */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

/* ------------------------------------------------------------------- scene */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17191c);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(1.75, 1.15, 1.95);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.minDistance = 1.1;
controls.maxDistance = 5.0;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 0.30, 0);

/* ------------------------------------------------------- environment (IBL) */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------------------------------------------------------------- lighting */
const hemi = new THREE.HemisphereLight(0xbcd2ff, 0x2a2521, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e2, 2.7);
key.position.set(1.6, 2.1, 1.3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 7;
key.shadow.camera.left = -1.3;
key.shadow.camera.right = 1.3;
key.shadow.camera.top = 1.3;
key.shadow.camera.bottom = -1.3;
key.shadow.bias = -0.0003;
key.shadow.normalBias = 0.02;
key.target.position.set(0, 0.28, 0);
scene.add(key, key.target);

const fill = new THREE.DirectionalLight(0x9fb6ff, 0.65);
fill.position.set(-1.9, 1.0, 1.1);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.35);
rim.position.set(-1.1, 1.4, -1.7);
scene.add(rim);

/* ------------------------------------------------------ ground (shadow only) */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* --------------------------------------------------------------- materials */
const mat = {
  frame:     new THREE.MeshStandardMaterial({ color: 0xb2382b, metalness: 0.55, roughness: 0.35, envMapIntensity: 0.9 }),
  tank:      new THREE.MeshStandardMaterial({ color: 0xa8352a, metalness: 0.5,  roughness: 0.28, envMapIntensity: 1.0 }),
  engine:    new THREE.MeshStandardMaterial({ color: 0x26282c, metalness: 0.75, roughness: 0.5,  envMapIntensity: 0.7 }),
  engineFin: new THREE.MeshStandardMaterial({ color: 0x35383d, metalness: 0.7,  roughness: 0.55, envMapIntensity: 0.7 }),
  dark:      new THREE.MeshStandardMaterial({ color: 0x161719, metalness: 0.15, roughness: 0.75 }),
  steel:     new THREE.MeshStandardMaterial({ color: 0x9aa0a6, metalness: 0.95, roughness: 0.3,  envMapIntensity: 1.0 }),
  heatSteel: new THREE.MeshStandardMaterial({ color: 0x776760, metalness: 0.8,  roughness: 0.55, envMapIntensity: 0.85 }),
  rubber:    new THREE.MeshStandardMaterial({ color: 0x121316, metalness: 0.1,  roughness: 0.92 }),
  hub:       new THREE.MeshStandardMaterial({ color: 0x8b9096, metalness: 0.9,  roughness: 0.35 }),
  panel:     new THREE.MeshStandardMaterial({ color: 0x202226, metalness: 0.4,  roughness: 0.6 }),
  cream:     new THREE.MeshStandardMaterial({ color: 0xd8d0bf, metalness: 0.1,  roughness: 0.68 }),
  bolt:      new THREE.MeshStandardMaterial({ color: 0xb9bcc0, metalness: 1.0,  roughness: 0.35 }),
  redKnob:   new THREE.MeshStandardMaterial({ color: 0xcc2b22, metalness: 0.3,  roughness: 0.5 }),
  foam:      new THREE.MeshStandardMaterial({ color: 0x18191b, metalness: 0.05, roughness: 0.95 }),
  screen:    new THREE.MeshStandardMaterial({ color: 0x08161c, metalness: 0.2,  roughness: 0.4, emissive: 0x0e4152, emissiveIntensity: 0.9 }),
  label:     new THREE.MeshStandardMaterial({ color: 0xede7d8, metalness: 0.05, roughness: 0.8 }),
};

/* --------------------------------------------------------------- helpers */
function mesh(geo, material, cast = true, receive = true) {
  const m = new THREE.Mesh(geo, material);
  m.castShadow = cast;
  m.receiveShadow = receive;
  return m;
}

// cylinder spanning from point a to point b
function tubeBetween(a, b, r, material, seg = 20) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = mesh(new THREE.CylinderGeometry(r, r, len, seg), material);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  return m;
}

function bolt(r, h, material = mat.bolt) {
  return mesh(new THREE.CylinderGeometry(r, r, h, 6), material);
}

// rounded-rectangle perimeter in XY plane
function roundedRectPath(w, h, r, seg = 6) {
  const hw = w / 2, hh = h / 2;
  const pts = [];
  const corners = [
    { cx:  hw - r, cy:  hh - r, a0: 0 },
    { cx: -(hw - r), cy:  hh - r, a0: Math.PI / 2 },
    { cx: -(hw - r), cy: -(hh - r), a0: Math.PI },
    { cx:  hw - r, cy: -(hh - r), a0: 3 * Math.PI / 2 },
  ];
  for (const c of corners) {
    for (let i = 0; i <= seg; i++) {
      const a = c.a0 + (i / seg) * (Math.PI / 2);
      pts.push(new THREE.Vector2(c.cx + r * Math.cos(a), c.cy + r * Math.sin(a)));
    }
  }
  return pts;
}

/* ================================================================ GENERATOR */
const gen = new THREE.Group();

/* ---- dimensions (metres) ------------------------------------------------ */
const HW = 0.33, HH = 0.22, HD = 0.23, CR = 0.06, TUBE = 0.017;
const FRAME_CY = 0.30;

/* ---- roll-frame (open tubular cage) ------------------------------------- */
const frame = new THREE.Group();
frame.position.y = FRAME_CY;

const loop2D = roundedRectPath(HW * 2, HH * 2, CR, 6);
function buildLoop(z) {
  const pts3 = loop2D.map(p => new THREE.Vector3(p.x, p.y, z));
  const curve = new THREE.CatmullRomCurve3(pts3, true);
  return mesh(new THREE.TubeGeometry(curve, 200, TUBE, 14, true), mat.frame);
}
frame.add(buildLoop(HD), buildLoop(-HD));

// four long rails connecting the two side loops (the box-cage edges)
const off = CR - CR * Math.SQRT1_2;                 // corner offset
const railXY = [
  [ HW - off,  HH - off], [-(HW - off),  HH - off],
  [-(HW - off), -(HH - off)], [ HW - off, -(HH - off)],
];
for (const [x, y] of railXY) {
  const rail = mesh(new THREE.CylinderGeometry(TUBE, TUBE, HD * 2, 14), mat.frame);
  rail.rotation.x = Math.PI / 2;
  rail.position.set(x, y, 0);
  frame.add(rail);
  // joint bolts
  for (const zz of [HD, -HD]) {
    const b = bolt(TUBE * 1.15, 0.012);
    b.rotation.x = Math.PI / 2;
    b.position.set(x, y, zz);
    frame.add(b);
  }
}
gen.add(frame);

/* ---- engine block ------------------------------------------------------- */
const engine = new THREE.Group();
engine.position.set(-0.02, 0.245, 0);

const block = mesh(new RoundedBoxGeometry(0.30, 0.22, 0.30, 3, 0.02), mat.engine);
engine.add(block);

// crankcase base plate + mounts
const cradle = mesh(new RoundedBoxGeometry(0.34, 0.03, 0.34, 2, 0.01), mat.dark);
cradle.position.y = -0.125;
engine.add(cradle);
for (const sx of [-0.13, 0.13]) for (const sz of [-0.13, 0.13]) {
  const mnt = mesh(new THREE.CylinderGeometry(0.02, 0.022, 0.05, 12), mat.dark);
  mnt.position.set(sx, -0.10, sz);
  engine.add(mnt);
}

// cylinder head + cooling fins (tilted up toward -z)
const head = new THREE.Group();
head.position.set(-0.03, 0.09, -0.12);
head.rotation.x = -0.5;
const valveCover = mesh(new RoundedBoxGeometry(0.17, 0.07, 0.15, 2, 0.015), mat.engineFin);
head.add(valveCover);
for (let i = 0; i < 5; i++) {
  const fin = mesh(new THREE.BoxGeometry(0.185, 0.006, 0.16), mat.engineFin);
  fin.position.set(0, -0.045 - i * 0.022, 0);
  head.add(fin);
}
// spark plug + boot
const plug = mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.05, 12), mat.dark);
plug.position.set(0.05, 0.05, 0);
head.add(plug);
engine.add(head);

// top oil-fill / breather cap
const breather = mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.03, 16), mat.dark);
breather.position.set(0.08, 0.13, 0.05);
engine.add(breather);

gen.add(engine);

/* ---- pull-start (recoil) housing  [+z face] ----------------------------- */
const starter = new THREE.Group();
starter.position.set(-0.02, 0.27, 0.17);

const housing = mesh(new THREE.CylinderGeometry(0.088, 0.092, 0.05, 40), mat.engine);
housing.rotation.x = Math.PI / 2;
starter.add(housing);
const shroud = mesh(new THREE.CylinderGeometry(0.075, 0.088, 0.02, 40), mat.dark);
shroud.rotation.x = Math.PI / 2;
shroud.position.z = 0.03;
starter.add(shroud);
// cooling-fan slots
for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2;
  const slot = mesh(new THREE.BoxGeometry(0.012, 0.05, 0.006), mat.engine);
  slot.position.set(Math.cos(a) * 0.055, Math.sin(a) * 0.055, 0.035);
  slot.rotation.z = a;
  starter.add(slot);
}
const center = mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.055, 16), mat.dark);
center.rotation.x = Math.PI / 2;
center.position.z = 0.02;
starter.add(center);

// pull rope + T-grip resting to the side
const ropeTop = new THREE.Vector3(0.05, 0.005, 0.045);
const gripPos = new THREE.Vector3(0.135, -0.075, 0.055);
starter.add(tubeBetween(ropeTop, gripPos, 0.004, mat.dark, 8));
const grip = mesh(new THREE.CylinderGeometry(0.013, 0.013, 0.055, 14), mat.dark);
grip.rotation.z = Math.PI / 2;
grip.position.copy(gripPos);
starter.add(grip);

gen.add(starter);

/* ---- air filter box  [+z lower] ----------------------------------------- */
const airbox = mesh(new RoundedBoxGeometry(0.11, 0.09, 0.06, 2, 0.012), mat.dark);
airbox.position.set(0.11, 0.20, 0.16);
gen.add(airbox);
const filterClip = mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.02, 12), mat.bolt);
filterClip.rotation.x = Math.PI / 2;
filterClip.position.set(0.11, 0.20, 0.20);
gen.add(filterClip);
// choke + fuel valve knobs
const choke = mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.03, 12), mat.redKnob);
choke.rotation.x = Math.PI / 2;
choke.position.set(0.055, 0.20, 0.17);
gen.add(choke);

/* ---- muffler + exhaust  [-z upper] -------------------------------------- */
const mufflerGrp = new THREE.Group();
mufflerGrp.position.set(-0.05, 0.36, -0.205);

const can = mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.18, 28), mat.heatSteel);
can.rotation.z = Math.PI / 2;
mufflerGrp.add(can);
for (const ex of [-0.09, 0.09]) {
  const cap = mesh(new THREE.CylinderGeometry(0.046, 0.04, 0.02, 24), mat.heatSteel);
  cap.rotation.z = Math.PI / 2;
  cap.position.x = ex;
  mufflerGrp.add(cap);
}
// perforated heat shield (partial shell over the outer/top side)
const shield = mesh(
  new THREE.CylinderGeometry(0.056, 0.056, 0.185, 24, 1, true, -0.2, Math.PI * 1.25),
  mat.steel
);
shield.rotation.z = Math.PI / 2;
shield.material.side = THREE.DoubleSide;
mufflerGrp.add(shield);
for (let r = 0; r < 3; r++) {
  const louver = mesh(new THREE.BoxGeometry(0.13, 0.004, 0.03), mat.heatSteel);
  louver.position.set(0, 0.05 - r * 0.028, -0.032 + r * 0.006);
  louver.rotation.x = 0.5;
  mufflerGrp.add(louver);
}
// exhaust header (engine -> muffler) and outlet pipe
mufflerGrp.add(tubeBetween(new THREE.Vector3(0.02, 0.0, 0.055), new THREE.Vector3(0.05, 0.0, 0.0), 0.018, mat.heatSteel));
const outletTip = tubeBetween(new THREE.Vector3(0.09, 0.0, 0.0), new THREE.Vector3(0.15, -0.05, -0.05), 0.017, mat.heatSteel);
mufflerGrp.add(outletTip);
const outMouth = mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.008, 16), mat.dark);
outMouth.position.set(0.15, -0.05, -0.05);
outMouth.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0.6, -0.5, -0.5).normalize());
mufflerGrp.add(outMouth);
gen.add(mufflerGrp);

/* ---- fuel tank + cap  [top] --------------------------------------------- */
const tank = new THREE.Group();
tank.position.set(0, 0.455, 0);

const tankBody = mesh(new RoundedBoxGeometry(0.54, 0.12, 0.40, 5, 0.05), mat.tank);
tank.add(tankBody);
// centre seam ridge
const seam = mesh(new THREE.BoxGeometry(0.545, 0.008, 0.005), mat.tank);
seam.position.set(0, 0.0, 0.201);
tank.add(seam);
// subtle label strip
const label = mesh(new RoundedBoxGeometry(0.24, 0.05, 0.006, 2, 0.006), mat.label);
label.position.set(-0.05, 0.0, 0.2);
tank.add(label);

// fuel cap toward the front
const capBase = mesh(new THREE.CylinderGeometry(0.05, 0.052, 0.012, 28), mat.steel);
capBase.position.set(0.13, 0.062, 0.02);
tank.add(capBase);
const cap = mesh(new THREE.CylinderGeometry(0.043, 0.046, 0.03, 28), mat.dark);
cap.position.set(0.13, 0.08, 0.02);
tank.add(cap);
for (let i = 0; i < 12; i++) {           // grip knurl
  const a = (i / 12) * Math.PI * 2;
  const rib = mesh(new THREE.BoxGeometry(0.006, 0.03, 0.01), mat.dark);
  rib.position.set(0.13 + Math.cos(a) * 0.045, 0.08, 0.02 + Math.sin(a) * 0.045);
  rib.rotation.y = -a;
  tank.add(rib);
}
gen.add(tank);

/* ---- control panel + outlets  [+x face] --------------------------------- */
const panel = new THREE.Group();
panel.position.set(0.165, 0.29, 0);

const plate = mesh(new RoundedBoxGeometry(0.02, 0.185, 0.28, 3, 0.014), mat.panel);
panel.add(plate);
const bezel = mesh(new RoundedBoxGeometry(0.012, 0.20, 0.30, 3, 0.02), mat.dark);
bezel.position.x = -0.006;
panel.add(bezel);
for (const py of [0.085, -0.085]) for (const pz of [0.13, -0.13]) {
  const b = bolt(0.006, 0.02);
  b.rotation.z = Math.PI / 2;
  b.position.set(0.012, py, pz);
  panel.add(b);
}

// duplex 120V outlet facing +x
function makeDuplex() {
  const g = new THREE.Group();
  g.add(mesh(new RoundedBoxGeometry(0.014, 0.09, 0.055, 2, 0.006), mat.cream));
  for (const oy of [0.024, -0.024]) {
    const rec = mesh(new THREE.BoxGeometry(0.009, 0.032, 0.036), mat.dark);
    rec.position.set(0.011, oy, 0);
    g.add(rec);
    for (const sz of [0.007, -0.007]) {
      const slot = mesh(new THREE.BoxGeometry(0.005, 0.013, 0.003), mat.frame.clone());
      slot.material = new THREE.MeshBasicMaterial({ color: 0x050505 });
      slot.position.set(0.016, oy + 0.004, sz);
      g.add(slot);
    }
    const gnd = mesh(new THREE.CylinderGeometry(0.0035, 0.0035, 0.006, 10), new THREE.MeshBasicMaterial({ color: 0x050505 }));
    gnd.rotation.z = Math.PI / 2;
    gnd.position.set(0.016, oy - 0.010, 0);
    g.add(gnd);
  }
  const scr = bolt(0.004, 0.016);
  scr.rotation.z = Math.PI / 2;
  scr.position.set(0.016, 0, 0);
  g.add(scr);
  return g;
}

// 240V twist-lock round outlet
function makeTwistLock() {
  const g = new THREE.Group();
  const disc = mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.014, 28), mat.cream);
  disc.rotation.z = Math.PI / 2;
  disc.position.x = 0.007;
  g.add(disc);
  const face = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.008, 24), mat.dark);
  face.rotation.z = Math.PI / 2;
  face.position.x = 0.014;
  g.add(face);
  const ring = mesh(new THREE.TorusGeometry(0.03, 0.004, 10, 28), mat.steel);
  ring.rotation.y = Math.PI / 2;
  ring.position.x = 0.014;
  g.add(ring);
  const blk = new THREE.MeshBasicMaterial({ color: 0x050505 });
  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * Math.PI * 2;
    const slot = mesh(new THREE.BoxGeometry(0.006, 0.012, 0.004), blk);
    slot.position.set(0.018, Math.cos(a) * 0.011, Math.sin(a) * 0.011);
    slot.rotation.x = -a;
    g.add(slot);
  }
  return g;
}

// circuit breaker toggle
function makeBreaker() {
  const g = new THREE.Group();
  g.add(mesh(new RoundedBoxGeometry(0.012, 0.032, 0.016, 2, 0.004), mat.dark));
  const t = mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.014, 12), mat.redKnob);
  t.rotation.z = Math.PI / 2;
  t.position.x = 0.012;
  g.add(t);
  return g;
}

// digital display
function makeDisplay() {
  const g = new THREE.Group();
  g.add(mesh(new RoundedBoxGeometry(0.012, 0.036, 0.07, 2, 0.006), mat.dark));
  const s = mesh(new THREE.BoxGeometry(0.006, 0.022, 0.052), mat.screen);
  s.position.x = 0.009;
  g.add(s);
  // faux digits
  for (let i = 0; i < 3; i++) {
    const d = mesh(new THREE.BoxGeometry(0.003, 0.012, 0.006), mat.screen);
    d.position.set(0.013, 0, -0.012 + i * 0.012);
    g.add(d);
  }
  return g;
}

// main power switch (rotary)
function makeSwitch() {
  const g = new THREE.Group();
  const base = mesh(new THREE.CylinderGeometry(0.017, 0.017, 0.01, 20), mat.dark);
  base.rotation.z = Math.PI / 2; base.position.x = 0.006;
  g.add(base);
  const knob = mesh(new THREE.CylinderGeometry(0.011, 0.013, 0.016, 18), mat.redKnob);
  knob.rotation.z = Math.PI / 2; knob.position.x = 0.014;
  g.add(knob);
  const pointer = mesh(new THREE.BoxGeometry(0.004, 0.004, 0.016), mat.label);
  pointer.position.set(0.021, 0, 0.006);
  g.add(pointer);
  return g;
}

function place(obj, y, z) { obj.position.set(0.012, y, z); panel.add(obj); }
place(makeDisplay(), 0.062, 0.0);
place(makeBreaker(), 0.062, -0.10);
place(makeBreaker(), 0.062, -0.075);
place(makeSwitch(), 0.058, 0.11);
place(makeTwistLock(), 0.0, -0.095);
place(makeDuplex(), 0.0, 0.06);
place(makeDuplex(), -0.058, -0.05);
// ground lug
const lug = bolt(0.006, 0.018);
lug.rotation.z = Math.PI / 2;
place(lug, -0.062, 0.11);

gen.add(panel);

/* ---- wheels + axle  [-x end] -------------------------------------------- */
function makeWheel(z) {
  const g = new THREE.Group();
  g.position.set(-0.30, 0.11, z);

  const tire = mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.065, 40), mat.rubber);
  tire.rotation.x = Math.PI / 2;
  g.add(tire);
  // tread ring
  for (let i = 0; i < 28; i++) {
    const a = (i / 28) * Math.PI * 2;
    const tb = mesh(new THREE.BoxGeometry(0.02, 0.07, 0.012), mat.rubber);
    tb.position.set(Math.cos(a) * 0.107, Math.sin(a) * 0.107, 0);
    tb.rotation.z = a;
    g.add(tb);
  }
  const rim = mesh(new THREE.CylinderGeometry(0.062, 0.062, 0.05, 28), mat.hub);
  rim.rotation.x = Math.PI / 2;
  g.add(rim);
  const dish = mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.052, 28), mat.frame);
  dish.rotation.x = Math.PI / 2;
  g.add(dish);
  const capC = mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.06, 18), mat.hub);
  capC.rotation.x = Math.PI / 2;
  g.add(capC);
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    const lugb = bolt(0.008, 0.055, mat.bolt);
    lugb.rotation.x = Math.PI / 2;
    lugb.position.set(Math.cos(a) * 0.038, Math.sin(a) * 0.038, 0);
    g.add(lugb);
  }
  return g;
}
gen.add(makeWheel(0.245), makeWheel(-0.245));
// axle
gen.add(tubeBetween(new THREE.Vector3(-0.30, 0.11, 0.245), new THREE.Vector3(-0.30, 0.11, -0.245), 0.014, mat.steel));
// axle brackets to frame
for (const zz of [0.20, -0.20]) {
  gen.add(tubeBetween(new THREE.Vector3(-0.30, 0.11, zz), new THREE.Vector3(-0.27, 0.085, zz), 0.012, mat.frame));
}

/* ---- front feet  [+x end] ----------------------------------------------- */
for (const zz of [0.185, -0.185]) {
  const post = tubeBetween(new THREE.Vector3(0.30, 0.085, zz), new THREE.Vector3(0.30, 0.018, zz), 0.016, mat.frame);
  gen.add(post);
  const pad = mesh(new THREE.CylinderGeometry(0.028, 0.03, 0.028, 18), mat.rubber);
  pad.position.set(0.30, 0.014, zz);
  gen.add(pad);
}

/* ---- fold-down pull handles  [+x end] ----------------------------------- */
function makeHandleArm(zSign) {
  const g = new THREE.Group();
  const pivot = new THREE.Vector3(0.31, 0.20, 0.20 * zSign);
  const knee  = new THREE.Vector3(0.47, 0.33, 0.195 * zSign);
  const gripEnd = new THREE.Vector3(0.60, 0.42, 0.19 * zSign);
  g.add(tubeBetween(pivot, knee, 0.014, mat.frame));
  g.add(tubeBetween(knee, gripEnd, 0.014, mat.frame));
  // pivot bracket + bolt
  const brk = mesh(new RoundedBoxGeometry(0.04, 0.04, 0.03, 2, 0.008), mat.dark);
  brk.position.copy(pivot);
  g.add(brk);
  const pb = bolt(0.01, 0.036);
  pb.rotation.x = Math.PI / 2;
  pb.position.copy(pivot);
  g.add(pb);
  return { group: g, gripEnd };
}
const handleGrp = new THREE.Group();
const armL = makeHandleArm(1);
const armR = makeHandleArm(-1);
handleGrp.add(armL.group, armR.group);
// grip crossbar joining the two arms
handleGrp.add(tubeBetween(armL.gripEnd, armR.gripEnd, 0.014, mat.frame));
// foam grips
for (const zz of [0.11, -0.11]) {
  const foam = mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.12, 20), mat.foam);
  foam.rotation.x = Math.PI / 2;
  foam.position.set(0.60, 0.42, zz);
  handleGrp.add(foam);
}
gen.add(handleGrp);

/* ---- lifting handle bolted across the top rails ------------------------- */
gen.add(tubeBetween(new THREE.Vector3(-0.20, 0.55, 0.20), new THREE.Vector3(-0.20, 0.55, -0.20), 0.013, mat.frame));

/* ---- centre + rest on ground -------------------------------------------- */
scene.add(gen);
const box = new THREE.Box3().setFromObject(gen);
const c = box.getCenter(new THREE.Vector3());
gen.position.x -= c.x;
gen.position.z -= c.z;
gen.position.y -= box.min.y;

/* ---------------------------------------------------------------- resize */
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

/* ---------------------------------------------------------------- animate */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
