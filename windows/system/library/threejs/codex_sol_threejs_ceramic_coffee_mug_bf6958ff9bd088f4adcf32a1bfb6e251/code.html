<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chipped Ceramic Mug</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #d8d3ca;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8d3ca);
scene.fog = new THREE.Fog(0xd8d3ca, 0.32, 0.72);

const camera = new THREE.PerspectiveCamera(
  34,
  window.innerWidth / window.innerHeight,
  0.01,
  2
);
camera.position.set(0.155, 0.125, 0.19);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setAnimationLoop(render);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.008, 0.046, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 0.14;
controls.maxDistance = 0.48;
controls.minPolarAngle = 0.42;
controls.maxPolarAngle = Math.PI * 0.49;

const mug = new THREE.Group();
mug.rotation.y = -0.18;
scene.add(mug);

const ceramic = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color(0xeee9dd),
  roughness: 0.24,
  metalness: 0,
  clearcoat: 0.58,
  clearcoatRoughness: 0.2,
  sheen: 0.08,
  sheenColor: new THREE.Color(0xfff8e9),
  side: THREE.DoubleSide
});

const exposedCeramic = new THREE.MeshStandardMaterial({
  color: new THREE.Color(0xcfc6b4),
  roughness: 0.72,
  metalness: 0,
  side: THREE.DoubleSide
});

const TAU = Math.PI * 2;
const radialSegments = 192;
const heightSegments = 44;
const chipAngle = 0.67;
const chipHalfWidth = 0.115;

function angularDistance(a, b) {
  return Math.atan2(Math.sin(a - b), Math.cos(a - b));
}

function chipInfluence(theta) {
  const d = Math.abs(angularDistance(theta, chipAngle));
  if (d >= chipHalfWidth) return 0;
  const x = d / chipHalfWidth;
  const smooth = 0.5 + 0.5 * Math.cos(Math.PI * x);
  const irregular = 0.93 + 0.07 * Math.cos(theta * 97 + 0.8);
  return smooth * irregular;
}

function rimHeight(theta) {
  const uneven =
    0.00034 * Math.sin(theta * 3 + 0.35) +
    0.00016 * Math.sin(theta * 7 - 0.8);
  const chip =
    0.00425 * chipInfluence(theta) *
    (0.94 + 0.06 * Math.sin(theta * 71));
  return 0.09 + uneven - chip;
}

function outerRadius(v, theta) {
  const baseTuck = -0.0025 * Math.exp(-v * 14);
  const shoulder = 0.00065 * Math.sin(Math.PI * Math.min(v, 1));
  const taper = 0.00105 * v;
  const handmade = 0.00013 * Math.sin(theta * 5 + v * 4);
  const chipBite = 0.00145 * chipInfluence(theta) * Math.pow(v, 9);
  return 0.0394 + baseTuck + shoulder + taper + handmade - chipBite;
}

function innerRadius(v, theta) {
  const taper = 0.00115 * v;
  const handmade = 0.0001 * Math.sin(theta * 5 + v * 4 + 0.2);
  const chipBite = 0.00072 * chipInfluence(theta) * Math.pow(v, 9);
  return 0.0348 + taper + handmade + chipBite;
}

const positions = [];
const colors = [];
const indices = [];

function addVertex(x, y, z, tint = 0) {
  positions.push(x, y, z);
  const base = new THREE.Color(0xeee9dd);
  base.offsetHSL(0.006, -0.01, tint);
  colors.push(base.r, base.g, base.b);
  return positions.length / 3 - 1;
}

function addQuad(a, b, c, d, reverse = false) {
  if (reverse) {
    indices.push(a, c, b, a, d, c);
  } else {
    indices.push(a, b, c, a, c, d);
  }
}

const outerGrid = [];
const innerGrid = [];

for (let i = 0; i <= radialSegments; i++) {
  const theta = TAU * i / radialSegments;
  const ct = Math.cos(theta);
  const st = Math.sin(theta);
  const outerColumn = [];
  const innerColumn = [];

  for (let j = 0; j <= heightSegments; j++) {
    const v = j / heightSegments;
    const top = rimHeight(theta);
    const yOuter = 0.002 + (top - 0.002) * v;
    const ro = outerRadius(v, theta);
    const subtleTint =
      -0.008 +
      0.008 * Math.sin(theta * 3.1 + v * 5.4) +
      0.005 * Math.sin(theta * 11 - v * 3);
    outerColumn.push(addVertex(ro * ct, yOuter, ro * st, subtleTint));

    const innerBottom = 0.0105;
    const yInner = innerBottom + (top - innerBottom) * v;
    const ri = innerRadius(v, theta);
    innerColumn.push(addVertex(ri * ct, yInner, ri * st, -0.018 + subtleTint));
  }
  outerGrid.push(outerColumn);
  innerGrid.push(innerColumn);
}

for (let i = 0; i < radialSegments; i++) {
  for (let j = 0; j < heightSegments; j++) {
    addQuad(
      outerGrid[i][j],
      outerGrid[i + 1][j],
      outerGrid[i + 1][j + 1],
      outerGrid[i][j + 1]
    );
    addQuad(
      innerGrid[i][j],
      innerGrid[i][j + 1],
      innerGrid[i + 1][j + 1],
      innerGrid[i + 1][j],
      true
    );
  }
}

for (let i = 0; i < radialSegments; i++) {
  addQuad(
    outerGrid[i][heightSegments],
    outerGrid[i + 1][heightSegments],
    innerGrid[i + 1][heightSegments],
    innerGrid[i][heightSegments]
  );
}

const innerBottomCenter = addVertex(0, 0.0103, 0, -0.025);
const outerBottomCenter = addVertex(0, 0.0018, 0, -0.012);

for (let i = 0; i < radialSegments; i++) {
  indices.push(
    innerBottomCenter,
    innerGrid[i + 1][0],
    innerGrid[i][0]
  );
  indices.push(
    outerBottomCenter,
    outerGrid[i][0],
    outerGrid[i + 1][0]
  );
}

const bodyGeometry = new THREE.BufferGeometry();
bodyGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(positions, 3)
);
bodyGeometry.setAttribute(
  'color',
  new THREE.Float32BufferAttribute(colors, 3)
);
bodyGeometry.setIndex(indices);
bodyGeometry.computeVertexNormals();
bodyGeometry.computeBoundingSphere();

ceramic.vertexColors = true;
const body = new THREE.Mesh(bodyGeometry, ceramic);
body.castShadow = true;
body.receiveShadow = true;
mug.add(body);

const footMaterial = ceramic.clone();
footMaterial.color = new THREE.Color(0xe1dbce);
footMaterial.vertexColors = false;
footMaterial.roughness = 0.35;

const foot = new THREE.Mesh(
  new THREE.TorusGeometry(0.0336, 0.00145, 12, 128),
  footMaterial
);
foot.rotation.x = Math.PI / 2;
foot.position.y = 0.00155;
foot.scale.z = 0.98;
foot.castShadow = true;
mug.add(foot);

const chipPatchShape = new THREE.Shape();
chipPatchShape.moveTo(-0.0045, 0);
chipPatchShape.quadraticCurveTo(0, -0.0045, 0.0045, 0);
chipPatchShape.lineTo(0.0031, 0.0011);
chipPatchShape.quadraticCurveTo(0, -0.00235, -0.0031, 0.0011);
chipPatchShape.closePath();

const chipPatch = new THREE.Mesh(
  new THREE.ShapeGeometry(chipPatchShape, 10),
  exposedCeramic
);
const chipRadius = 0.0397;
chipPatch.position.set(
  chipRadius * Math.cos(chipAngle),
  0.0896,
  chipRadius * Math.sin(chipAngle)
);
chipPatch.rotation.set(
  -Math.PI / 2,
  chipAngle - Math.PI / 2,
  0
);
chipPatch.translateZ(0.00018);
chipPatch.castShadow = true;
mug.add(chipPatch);

class HandleCurve extends THREE.Curve {
  getPoint(t, target = new THREE.Vector3()) {
    const p0 = new THREE.Vector3(0.0374, 0.069, -0.0005);
    const p1 = new THREE.Vector3(0.0715, 0.074, -0.0008);
    const p2 = new THREE.Vector3(0.078, 0.0205, 0.001);
    const p3 = new THREE.Vector3(0.0378, 0.026, 0.0004);
    const u = 1 - t;
    target.set(
      u * u * u * p0.x + 3 * u * u * t * p1.x + 3 * u * t * t * p2.x + t * t * t * p3.x,
      u * u * u * p0.y + 3 * u * u * t * p1.y + 3 * u * t * t * p2.y + t * t * t * p3.y,
      u * u * u * p0.z + 3 * u * u * t * p1.z + 3 * u * t * t * p2.z + t * t * t * p3.z
    );
    return target;
  }
}

const handle = new THREE.Mesh(
  new THREE.TubeGeometry(new HandleCurve(), 80, 0.0066, 18, false),
  ceramic
);
handle.castShadow = true;
handle.receiveShadow = true;
mug.add(handle);

const jointGeometry = new THREE.SphereGeometry(1, 28, 18);
for (const joint of [
  { x: 0.0383, y: 0.0684, z: -0.0005, sx: 0.0082, sy: 0.0102, sz: 0.009 },
  { x: 0.0385, y: 0.0267, z: 0.0004, sx: 0.0081, sy: 0.0096, sz: 0.0088 }
]) {
  const mesh = new THREE.Mesh(jointGeometry, ceramic);
  mesh.position.set(joint.x, joint.y, joint.z);
  mesh.scale.set(joint.sx, joint.sy, joint.sz);
  mesh.castShadow = true;
  mug.add(mesh);
}

class StainCurve extends THREE.Curve {
  getPoint(t, target = new THREE.Vector3()) {
    const a = t * TAU;
    const r = 0.03425 + 0.00018 * Math.sin(a * 5 + 0.4);
    const y =
      0.0678 +
      0.00028 * Math.sin(a * 3 - 0.7) +
      0.0001 * Math.sin(a * 9);
    return target.set(r * Math.cos(a), y, r * Math.sin(a));
  }
}

const stainMaterial = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color(0x8b552d),
  roughness: 0.58,
  transparent: true,
  opacity: 0.34,
  depthWrite: false,
  side: THREE.DoubleSide
});

const stain = new THREE.Mesh(
  new THREE.TubeGeometry(new StainCurve(), 160, 0.00036, 7, true),
  stainMaterial
);
mug.add(stain);

const stainGhostMaterial = stainMaterial.clone();
stainGhostMaterial.opacity = 0.12;
stainGhostMaterial.color = new THREE.Color(0xa36f43);

class StainGhostCurve extends THREE.Curve {
  getPoint(t, target = new THREE.Vector3()) {
    const a = t * TAU;
    const r = 0.03434 + 0.00012 * Math.sin(a * 7);
    return target.set(
      r * Math.cos(a),
      0.0668 + 0.00022 * Math.sin(a * 4 + 1.2),
      r * Math.sin(a)
    );
  }
}

const stainGhost = new THREE.Mesh(
  new THREE.TubeGeometry(new StainGhostCurve(), 144, 0.00048, 6, true),
  stainGhostMaterial
);
mug.add(stainGhost);

const tableMaterial = new THREE.MeshStandardMaterial({
  color: new THREE.Color(0xb7a994),
  roughness: 0.82,
  metalness: 0
});

const table = new THREE.Mesh(
  new THREE.CircleGeometry(0.5, 128),
  tableMaterial
);
table.rotation.x = -Math.PI / 2;
table.position.y = -0.0002;
table.receiveShadow = true;
scene.add(table);

const ambient = new THREE.HemisphereLight(0xfff9ed, 0x736b61, 1.8);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xfff2da, 4.2);
key.position.set(-0.15, 0.26, 0.18);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -0.15;
key.shadow.camera.right = 0.15;
key.shadow.camera.top = 0.15;
key.shadow.camera.bottom = -0.08;
key.shadow.camera.near = 0.05;
key.shadow.camera.far = 0.6;
key.shadow.bias = -0.00008;
key.shadow.normalBias = 0.015;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbfd4e5, 1.25);
fill.position.set(0.16, 0.12, -0.13);
scene.add(fill);

const rimLight = new THREE.PointLight(0xffe3bd, 1.7, 0.5, 2);
rimLight.position.set(0.02, 0.2, -0.16);
scene.add(rimLight);

function render() {
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
