<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Glass Hourglass</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101c}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06101c);
scene.fog = new THREE.FogExp2(0x06101c, 0.035);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.5, 3.9, 8.5);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 5;
controls.maxDistance = 15;
controls.target.set(0,0,0);

const glass = new THREE.MeshPhysicalMaterial({
  color:0xbfeaff,
  metalness:0.04,
  roughness:0.08,
  transmission:1,
  thickness:0.16,
  ior:1.46,
  transparent:true,
  opacity:0.55,
  side:THREE.DoubleSide,
  depthWrite:false
});

const crystal = new THREE.MeshPhysicalMaterial({
  color:0xa9ddff,
  metalness:0.12,
  roughness:0.12,
  transmission:0.72,
  thickness:0.3,
  ior:1.5,
  transparent:true,
  opacity:0.68,
  side:THREE.DoubleSide
});

const gold = new THREE.MeshStandardMaterial({
  color:0xe9a928,
  emissive:0x6e3203,
  emissiveIntensity:0.22,
  roughness:0.3,
  metalness:0.08
});

const darkMetal = new THREE.MeshStandardMaterial({
  color:0x273b51,
  metalness:0.72,
  roughness:0.23
});

const hourglass = new THREE.Group();
scene.add(hourglass);

const profile = [
  new THREE.Vector2(0,-2.58),
  new THREE.Vector2(0.56,-2.56),
  new THREE.Vector2(1.05,-2.30),
  new THREE.Vector2(1.36,-1.88),
  new THREE.Vector2(1.52,-1.30),
  new THREE.Vector2(1.50,-0.82),
  new THREE.Vector2(1.34,-0.40),
  new THREE.Vector2(1.02,-0.18),
  new THREE.Vector2(0.56,-0.075),
  new THREE.Vector2(0.19,0),
  new THREE.Vector2(0.56,0.075),
  new THREE.Vector2(1.02,0.18),
  new THREE.Vector2(1.34,0.40),
  new THREE.Vector2(1.50,0.82),
  new THREE.Vector2(1.52,1.30),
  new THREE.Vector2(1.36,1.88),
  new THREE.Vector2(1.05,2.30),
  new THREE.Vector2(0.56,2.56),
  new THREE.Vector2(0,2.58)
];
const bulb = new THREE.Mesh(new THREE.LatheGeometry(profile,96),glass);
bulb.castShadow = true;
bulb.receiveShadow = true;
hourglass.add(bulb);

function latheSand(points){
  const mesh = new THREE.Mesh(new THREE.LatheGeometry(points,64),gold);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

hourglass.add(latheSand([
  new THREE.Vector2(0,0.22),
  new THREE.Vector2(0.30,0.24),
  new THREE.Vector2(0.72,0.42),
  new THREE.Vector2(1.05,0.72),
  new THREE.Vector2(1.28,1.08),
  new THREE.Vector2(1.31,1.50),
  new THREE.Vector2(1.15,1.78),
  new THREE.Vector2(0.68,1.94),
  new THREE.Vector2(0,1.99)
]));

hourglass.add(latheSand([
  new THREE.Vector2(0,-0.14),
  new THREE.Vector2(0.25,-0.20),
  new THREE.Vector2(0.58,-0.36),
  new THREE.Vector2(0.92,-0.68),
  new THREE.Vector2(1.18,-1.13),
  new THREE.Vector2(1.25,-1.62),
  new THREE.Vector2(1.10,-2.08),
  new THREE.Vector2(0.77,-2.40),
  new THREE.Vector2(0,-2.47)
]));

const stream = new THREE.Mesh(
  new THREE.CylinderGeometry(0.034,0.047,0.52,16),
  gold
);
stream.position.y = -0.235;
stream.castShadow = true;
hourglass.add(stream);

const neckRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.205,0.034,12,48),
  crystal
);
neckRing.rotation.x = Math.PI / 2;
hourglass.add(neckRing);

const grainCount = 150;
const grainPositions = new Float32Array(grainCount * 3);
let seed = 19;
function rand(){
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
for(let i=0;i<grainCount;i++){
  const t = rand();
  const angle = rand() * Math.PI * 2;
  const radius = 0.015 + rand() * 0.055;
  grainPositions[i*3] = Math.cos(angle) * radius;
  grainPositions[i*3+1] = -0.02 - t * 0.46;
  grainPositions[i*3+2] = Math.sin(angle) * radius;
}
const grainGeometry = new THREE.BufferGeometry();
grainGeometry.setAttribute("position",new THREE.BufferAttribute(grainPositions,3));
const grainMaterial = new THREE.PointsMaterial({
  color:0xffd66b,
  size:0.045,
  sizeAttenuation:true,
  transparent:true,
  opacity:0.92
});
hourglass.add(new THREE.Points(grainGeometry,grainMaterial));

function cylinderBetween(a,b,r,material,segments=12){
  const direction = new THREE.Vector3().subVectors(b,a);
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r,r,direction.length(),segments),material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const capTop = new THREE.Mesh(new THREE.CylinderGeometry(1.78,1.78,0.20,10),crystal);
capTop.position.y = 2.76;
capTop.castShadow = true;
capTop.receiveShadow = true;
hourglass.add(capTop);

const capBottom = capTop.clone();
capBottom.position.y = -2.76;
hourglass.add(capBottom);

const capTopInset = new THREE.Mesh(new THREE.CylinderGeometry(1.47,1.47,0.08,10),darkMetal);
capTopInset.position.y = 2.62;
hourglass.add(capTopInset);

const capBottomInset = capTopInset.clone();
capBottomInset.position.y = -2.62;
hourglass.add(capBottomInset);

const rodOffset = 1.56;
for(const x of [-rodOffset,rodOffset]){
  for(const z of [-rodOffset,rodOffset]){
    hourglass.add(cylinderBetween(
      new THREE.Vector3(x,-2.68,z),
      new THREE.Vector3(x,2.68,z),
      0.075,
      crystal,
      8
    ));
  }
}

for(const y of [-2.78,2.78]){
  const brace = new THREE.Mesh(new THREE.TorusGeometry(1.56,0.055,10,48),darkMetal);
  brace.rotation.x = Math.PI / 2;
  brace.position.y = y;
  hourglass.add(brace);
}

for(const y of [-2.88,2.88]){
  const jewel = new THREE.Mesh(new THREE.OctahedronGeometry(0.14,0),new THREE.MeshPhysicalMaterial({
    color:0x8ed7ff,
    transmission:0.8,
    roughness:0.08,
    metalness:0.25,
    transparent:true,
    opacity:0.8
  }));
  jewel.position.y = y;
  hourglass.add(jewel);
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(5.2,96),
  new THREE.MeshBasicMaterial({color:0x102b43,transparent:true,opacity:0.42})
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -3.03;
floor.receiveShadow = true;
scene.add(floor);

for(let i=0;i<5;i++){
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.8+i*0.42,0.84+i*0.42,64),
    new THREE.MeshBasicMaterial({
      color:i%2 ? 0x58b9e8 : 0xc4f4ff,
      transparent:true,
      opacity:0.075-i*0.009,
      side:THREE.DoubleSide
    })
  );
  ring.rotation.x = -Math.PI/2;
  ring.scale.set(1.7,0.48,1);
  ring.position.set(0,-3.015,0.1);
  scene.add(ring);
}

const hemi = new THREE.HemisphereLight(0x9bdcff,0x08101c,1.7);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xd9f5ff,4.2);
key.position.set(4.5,7,5);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -5;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 20;
scene.add(key);

const warm = new THREE.PointLight(0xffad38,18,7,2);
warm.position.set(-2.8,1.4,3.4);
scene.add(warm);

const cool = new THREE.PointLight(0x59c8ff,15,8,2);
cool.position.set(3.8,-1.3,-2.8);
scene.add(cool);

const rim = new THREE.PointLight(0x82dcff,12,7,2);
rim.position.set(0,3.7,-1.8);
scene.add(rim);

function animate(time){
  requestAnimationFrame(animate);
  const seconds = time * 0.001;
  stream.scale.x = 1 + Math.sin(seconds*8)*0.05;
  stream.scale.z = 1 + Math.cos(seconds*7)*0.05;
  grainMaterial.opacity = 0.78 + Math.sin(seconds*5)*0.12;
  controls.update();
  renderer.render(scene,camera);
}
animate(0);

addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
