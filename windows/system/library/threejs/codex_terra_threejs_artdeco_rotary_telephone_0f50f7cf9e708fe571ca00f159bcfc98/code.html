<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art Deco Rotary Telephone</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11131a}
  canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10131a);
scene.fog = new THREE.Fog(0x10131a, 15, 30);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.2, 5.3, 8.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 6.4;
controls.maxDistance = 13;
controls.target.set(0, 1.25, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;

const black = new THREE.MeshPhysicalMaterial({
  color: 0x050609, roughness: 0.16, metalness: 0.06,
  clearcoat: 1, clearcoatRoughness: 0.08
});
const blackSoft = new THREE.MeshPhysicalMaterial({
  color: 0x0b0d12, roughness: 0.27, metalness: 0.04,
  clearcoat: 0.76, clearcoatRoughness: 0.14
});
const chrome = new THREE.MeshPhysicalMaterial({
  color: 0xdce5ea, metalness: 1, roughness: 0.13,
  clearcoat: 0.55, clearcoatRoughness: 0.08
});
const nickel = new THREE.MeshPhysicalMaterial({
  color: 0xf2f5f4, metalness: 0.95, roughness: 0.17
});
const darkChrome = new THREE.MeshPhysicalMaterial({
  color: 0x64717a, metalness: 0.94, roughness: 0.18
});
const cordMat = new THREE.MeshStandardMaterial({
  color: 0x191a1b, roughness: 0.72, metalness: 0.02
});
const deskMat = new THREE.MeshStandardMaterial({
  color: 0x2a2020, roughness: 0.48, metalness: 0.05
});

function mesh(geometry, material, x=0, y=0, z=0) {
  const obj = new THREE.Mesh(geometry, material);
  obj.position.set(x, y, z);
  obj.castShadow = true;
  obj.receiveShadow = true;
  return obj;
}

function lathe(points, material, x=0, y=0, z=0) {
  const obj = mesh(new THREE.LatheGeometry(points, 72), material, x, y, z);
  return obj;
}

function roundedForm(width, height, depth, radius, material) {
  const shape = new THREE.Shape();
  const w = width / 2, h = height / 2, r = Math.min(radius, w, h);
  shape.moveTo(-w + r, -h);
  shape.lineTo(w - r, -h);
  shape.quadraticCurveTo(w, -h, w, -h + r);
  shape.lineTo(w, h - r);
  shape.quadraticCurveTo(w, h, w - r, h);
  shape.lineTo(-w + r, h);
  shape.quadraticCurveTo(-w, h, -w, h - r);
  shape.lineTo(-w, -h + r);
  shape.quadraticCurveTo(-w, -h, -w + r, -h);
  const geom = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: true, bevelSegments: 4,
    bevelSize: 0.08, bevelThickness: 0.08, curveSegments: 16
  });
  geom.center();
  return mesh(geom, material);
}

const phone = new THREE.Group();
scene.add(phone);

const base = roundedForm(4.25, 0.86, 3.42, 0.42, black);
base.position.y = 0.66;
phone.add(base);

const lowerStep = roundedForm(4.48, 0.23, 3.66, 0.28, blackSoft);
lowerStep.position.y = 0.25;
phone.add(lowerStep);

const chromeBandA = roundedForm(4.36, 0.095, 3.54, 0.26, chrome);
chromeBandA.position.y = 0.43;
phone.add(chromeBandA);

const blackBand = roundedForm(4.20, 0.16, 3.38, 0.24, black);
blackBand.position.y = 0.52;
phone.add(blackBand);

const chromeBandB = roundedForm(4.08, 0.075, 3.27, 0.22, darkChrome);
chromeBandB.position.y = 0.61;
phone.add(chromeBandB);

const frontPedestal = roundedForm(3.15, 0.82, 1.48, 0.25, black);
frontPedestal.position.set(0, 1.18, 0.12);
frontPedestal.rotation.x = -0.13;
phone.add(frontPedestal);

const slopingShell = roundedForm(3.62, 1.36, 2.28, 0.5, black);
slopingShell.position.set(0, 1.62, 0.15);
slopingShell.rotation.x = -0.23;
phone.add(slopingShell);

const upperDeck = roundedForm(3.35, 0.39, 1.82, 0.3, blackSoft);
upperDeck.position.set(0, 2.17, 0.12);
upperDeck.rotation.x = -0.13;
phone.add(upperDeck);

const dialGroup = new THREE.Group();
dialGroup.position.set(0, 1.86, 1.30);
dialGroup.rotation.x = -0.26;
phone.add(dialGroup);

const dialOuter = lathe([
  new THREE.Vector2(0.28, -0.08),
  new THREE.Vector2(1.12, -0.08),
  new THREE.Vector2(1.24, 0.00),
  new THREE.Vector2(1.25, 0.12),
  new THREE.Vector2(1.15, 0.19),
  new THREE.Vector2(0.50, 0.21),
  new THREE.Vector2(0.28, 0.13)
], chrome);
dialOuter.rotation.x = Math.PI / 2;
dialGroup.add(dialOuter);

const dialBlack = mesh(new THREE.CylinderGeometry(1.08, 1.08, 0.09, 72), black, 0, 0.08, 0);
dialBlack.rotation.x = Math.PI / 2;
dialGroup.add(dialBlack);

const dialPlate = mesh(new THREE.CylinderGeometry(0.93, 0.93, 0.1, 72), nickel, 0, 0.14, 0);
dialPlate.rotation.x = Math.PI / 2;
dialGroup.add(dialPlate);

const centerDisc = mesh(new THREE.CylinderGeometry(0.33, 0.35, 0.16, 48), black, 0, 0.22, 0);
centerDisc.rotation.x = Math.PI / 2;
dialGroup.add(centerDisc);

const centerCap = mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.18, 48), chrome, 0, 0.30, 0);
centerCap.rotation.x = Math.PI / 2;
dialGroup.add(centerCap);

for (let i = 0; i < 10; i++) {
  const angle = Math.PI * 2 * i / 10 + Math.PI * 0.13;
  const r = 0.69;
  const px = Math.sin(angle) * r;
  const py = Math.cos(angle) * r;
  const hole = mesh(new THREE.CylinderGeometry(0.155, 0.155, 0.17, 24), black, px, 0.24, py);
  hole.rotation.x = Math.PI / 2;
  dialGroup.add(hole);
  const rim = mesh(new THREE.TorusGeometry(0.155, 0.028, 10, 24), chrome, px, 0.325, py);
  rim.rotation.x = Math.PI / 2;
  dialGroup.add(rim);
}

const stop = mesh(new THREE.CylinderGeometry(0.10, 0.10, 0.25, 24), chrome, 0.82, 0.29, -0.56);
stop.rotation.x = Math.PI / 2;
dialGroup.add(stop);

function makeCradleSide(sign) {
  const cradle = new THREE.Group();
  cradle.position.set(sign * 1.28, 2.38, 0.02);
  const stem = mesh(new THREE.CylinderGeometry(0.11, 0.16, 0.58, 24), chrome);
  stem.rotation.z = sign * 0.24;
  cradle.add(stem);
  const cup = mesh(new THREE.SphereGeometry(0.31, 28, 18), chrome);
  cup.scale.set(1.15, 0.68, 0.76);
  cup.position.set(sign * 0.08, 0.30, 0);
  cradle.add(cup);
  const inset = mesh(new THREE.SphereGeometry(0.225, 24, 16), blackSoft);
  inset.scale.set(1.1, 0.6, 0.72);
  inset.position.set(sign * 0.13, 0.33, 0);
  cradle.add(inset);
  return cradle;
}
phone.add(makeCradleSide(-1));
phone.add(makeCradleSide(1));

const fan = new THREE.Group();
fan.position.set(0, 2.16, -0.70);
phone.add(fan);
for (let i = -3; i <= 3; i++) {
  const bar = mesh(new THREE.CylinderGeometry(0.036, 0.036, 1.22, 12), chrome);
  bar.rotation.z = i * 0.18;
  bar.position.y = 0.20;
  fan.add(bar);
}
const fanBase = mesh(new THREE.CylinderGeometry(0.50, 0.60, 0.08, 36), chrome, 0, -0.32, 0);
fanBase.rotation.x = Math.PI / 2;
fan.add(fanBase);

const handset = new THREE.Group();
handset.position.set(0, 3.01, 0.02);
handset.rotation.z = -0.035;
phone.add(handset);

const handle = mesh(new THREE.CapsuleGeometry(0.25, 1.82, 12, 28), black);
handle.rotation.z = Math.PI / 2;
handle.scale.set(1, 1.02, 1.18);
handset.add(handle);

for (const side of [-1, 1]) {
  const neck = mesh(new THREE.CylinderGeometry(0.22, 0.31, 0.44, 28), black, side * 1.16, 0, 0);
  neck.rotation.z = Math.PI / 2;
  handset.add(neck);
  const receiver = mesh(new THREE.SphereGeometry(0.48, 36, 24), blackSoft, side * 1.47, 0, 0);
  receiver.scale.set(1.05, 0.78, 1.05);
  handset.add(receiver);
  const grille = mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.10, 32), chrome, side * 1.79, 0, 0);
  grille.rotation.z = Math.PI / 2;
  handset.add(grille);
  const grilleFace = mesh(new THREE.CylinderGeometry(0.20, 0.20, 0.112, 32), darkChrome, side * 1.845, 0, 0);
  grilleFace.rotation.z = Math.PI / 2;
  handset.add(grilleFace);
  for (let i = 0; i < 7; i++) {
    const a = i * Math.PI * 2 / 7;
    const dot = mesh(new THREE.SphereGeometry(0.025, 10, 8), nickel,
      side * 1.905, Math.cos(a) * 0.105, Math.sin(a) * 0.105);
    handset.add(dot);
  }
}

const cordPoints = [];
for (let i = 0; i <= 110; i++) {
  const t = i / 110;
  const a = t * Math.PI * 5.4;
  const radius = 1.45 - t * 0.62;
  cordPoints.push(new THREE.Vector3(
    1.63 + Math.cos(a) * radius,
    2.70 - t * 2.34 + 0.15 * Math.sin(t * Math.PI),
    -0.16 + Math.sin(a) * radius * 0.52
  ));
}
const cordCurve = new THREE.CatmullRomCurve3(cordPoints);
const cord = mesh(new THREE.TubeGeometry(cordCurve, 360, 0.055, 10, false), cordMat);
phone.add(cord);

const braid = mesh(new THREE.TubeGeometry(cordCurve, 360, 0.016, 7, false), darkChrome);
braid.scale.set(1.018, 1.018, 1.018);
phone.add(braid);

const desk = mesh(new THREE.CylinderGeometry(13, 13, 0.5, 96), deskMat, 0, -0.25, 0);
desk.receiveShadow = true;
scene.add(desk);

const ambient = new THREE.HemisphereLight(0x9ab9d5, 0x241915, 1.6);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xfff1db, 4.2);
key.position.set(5, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -7;
scene.add(key);

const rimLight = new THREE.DirectionalLight(0x9bc8ff, 2.1);
rimLight.position.set(-6, 4, -5);
scene.add(rimLight);

const warmLight = new THREE.PointLight(0xffa95f, 40, 11, 2);
warmLight.position.set(1.5, 3.5, 4);
scene.add(warmLight);

const backdrop = mesh(new THREE.PlaneGeometry(30, 16), new THREE.MeshStandardMaterial({
  color: 0x151923, roughness: 0.82
}), 0, 6.4, -5.8);
backdrop.receiveShadow = true;
scene.add(backdrop);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
