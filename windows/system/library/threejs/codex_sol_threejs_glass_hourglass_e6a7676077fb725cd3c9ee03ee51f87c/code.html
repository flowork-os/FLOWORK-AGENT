<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal Hourglass</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060b14;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060b14);
scene.fog = new THREE.FogExp2(0x060b14, 0.026);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.8, 3.8, 7.3);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.useLegacyLights = false;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.05, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.enablePan = false;
controls.minDistance = 6;
controls.maxDistance = 13;
controls.minPolarAngle = Math.PI * 0.25;
controls.maxPolarAngle = Math.PI * 0.69;

const anisotropy = renderer.capabilities.getMaxAnisotropy();

function makeGlowTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 256;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(128, 128, 2, 128, 128, 126);
  gradient.addColorStop(0, 'rgba(255,248,213,1)');
  gradient.addColorStop(0.12, 'rgba(255,210,105,.92)');
  gradient.addColorStop(0.38, 'rgba(93,184,255,.24)');
  gradient.addColorStop(1, 'rgba(0,20,45,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 256, 256);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = anisotropy;
  return texture;
}

const hourglass = new THREE.Group();
hourglass.rotation.y = -0.16;
scene.add(hourglass);

const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xeaf8ff,
  metalness: 0,
  roughness: 0.045,
  transmission: 1,
  thickness: 0.16,
  ior: 1.48,
  transparent: true,
  opacity: 0.78,
  attenuationColor: new THREE.Color(0xbedfff),
  attenuationDistance: 3.4,
  clearcoat: 1,
  clearcoatRoughness: 0.025,
  side: THREE.DoubleSide,
  depthWrite: false
});

const crystalMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xd9efff,
  metalness: 0,
  roughness: 0.075,
  transmission: 0.95,
  thickness: 0.42,
  ior: 1.82,
  transparent: true,
  opacity: 0.82,
  attenuationColor: new THREE.Color(0x8fc6ff),
  attenuationDistance: 4,
  clearcoat: 1,
  clearcoatRoughness: 0.018,
  side: THREE.DoubleSide
});

const crystalEdgeMaterial = new THREE.LineBasicMaterial({
  color: 0xbde9ff,
  transparent: true,
  opacity: 0.33,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const sandMaterial = new THREE.MeshStandardMaterial({
  color: 0xe3a72e,
  roughness: 0.47,
  metalness: 0.22,
  emissive: 0x6d3705,
  emissiveIntensity: 0.24
});

const brightSandMaterial = new THREE.MeshStandardMaterial({
  color: 0xffca52,
  roughness: 0.32,
  metalness: 0.32,
  emissive: 0x7d4108,
  emissiveIntensity: 0.34
});

const vesselProfile = [
  [0.00, -2.23],
  [0.27, -2.23],
  [0.56, -2.17],
  [0.84, -2.00],
  [1.02, -1.72],
  [1.09, -1.38],
  [1.04, -1.03],
  [0.88, -0.70],
  [0.61, -0.40],
  [0.31, -0.16],
  [0.135, 0.00],
  [0.31, 0.16],
  [0.61, 0.40],
  [0.88, 0.70],
  [1.04, 1.03],
  [1.09, 1.38],
  [1.02, 1.72],
  [0.84, 2.00],
  [0.56, 2.17],
  [0.27, 2.23],
  [0.00, 2.23]
].map(([r, y]) => new THREE.Vector2(r, y));

const vesselGeometry = new THREE.LatheGeometry(vesselProfile, 128);
vesselGeometry.computeVertexNormals();
const vessel = new THREE.Mesh(vesselGeometry, glassMaterial);
vessel.renderOrder = 4;
hourglass.add(vessel);

const waistRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.148, 0.025, 12, 64),
  glassMaterial
);
waistRing.rotation.x = Math.PI / 2;
waistRing.renderOrder = 5;
hourglass.add(waistRing);

function latheMesh(profile, material, segments = 96) {
  const geometry = new THREE.LatheGeometry(
    profile.map(([r, y]) => new THREE.Vector2(r, y)),
    segments
  );
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const lowerSand = latheMesh([
  [0.00, -2.185],
  [0.24, -2.18],
  [0.53, -2.09],
  [0.73, -1.94],
  [0.83, -1.76],
  [0.77, -1.62],
  [0.62, -1.52],
  [0.42, -1.38],
  [0.20, -1.17],
  [0.00, -0.98]
], sandMaterial);
hourglass.add(lowerSand);

const upperSand = latheMesh([
  [0.00, 0.14],
  [0.16, 0.16],
  [0.33, 0.26],
  [0.53, 0.43],
  [0.72, 0.67],
  [0.87, 0.92],
  [0.90, 1.08],
  [0.76, 1.17],
  [0.48, 1.13],
  [0.22, 1.09],
  [0.00, 1.06]
], sandMaterial);
hourglass.add(upperSand);

const stream = new THREE.Mesh(
  new THREE.CylinderGeometry(0.022, 0.032, 1.14, 12),
  brightSandMaterial
);
stream.position.y = -0.405;
stream.castShadow = true;
hourglass.add(stream);

const grainCount = 170;
const grainPositions = new Float32Array(grainCount * 3);
const grainSeeds = new Float32Array(grainCount);
for (let i = 0; i < grainCount; i++) {
  grainSeeds[i] = Math.random();
  const y = 0.13 - grainSeeds[i] * 1.17;
  const taper = 0.006 + Math.abs(y) * 0.012;
  grainPositions[i * 3] = (Math.random() - 0.5) * taper;
  grainPositions[i * 3 + 1] = y;
  grainPositions[i * 3 + 2] = (Math.random() - 0.5) * taper;
}

const grainGeometry = new THREE.BufferGeometry();
grainGeometry.setAttribute('position', new THREE.BufferAttribute(grainPositions, 3));
const grainMaterial = new THREE.PointsMaterial({
  color: 0xffd477,
  size: 0.027,
  sizeAttenuation: true,
  transparent: true,
  opacity: 0.94,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const grains = new THREE.Points(grainGeometry, grainMaterial);
grains.renderOrder = 3;
hourglass.add(grains);

const capGeometry = new THREE.CylinderGeometry(1.56, 1.66, 0.28, 12, 1, false);
const capInsetGeometry = new THREE.CylinderGeometry(1.28, 1.38, 0.10, 12);
const ringGeometry = new THREE.TorusGeometry(1.49, 0.075, 8, 12);

function addCap(y, flip) {
  const capGroup = new THREE.Group();
  capGroup.position.y = y;

  const cap = new THREE.Mesh(capGeometry, crystalMaterial);
  cap.castShadow = true;
  cap.receiveShadow = true;
  capGroup.add(cap);

  const inset = new THREE.Mesh(capInsetGeometry, crystalMaterial);
  inset.position.y = flip * -0.145;
  inset.castShadow = true;
  capGroup.add(inset);

  const ring = new THREE.Mesh(ringGeometry, crystalMaterial);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = flip * -0.11;
  capGroup.add(ring);

  const edgeLines = new THREE.LineSegments(
    new THREE.EdgesGeometry(capGeometry, 18),
    crystalEdgeMaterial
  );
  edgeLines.renderOrder = 6;
  capGroup.add(edgeLines);

  const insetLines = new THREE.LineSegments(
    new THREE.EdgesGeometry(capInsetGeometry, 18),
    crystalEdgeMaterial
  );
  insetLines.position.copy(inset.position);
  insetLines.renderOrder = 6;
  capGroup.add(insetLines);

  hourglass.add(capGroup);
}

addCap(2.43, 1);
addCap(-2.43, -1);

const pillarGeometry = new THREE.CylinderGeometry(0.09, 0.105, 4.62, 6);
const pillarRingGeometry = new THREE.TorusGeometry(0.125, 0.025, 6, 24);

for (let i = 0; i < 4; i++) {
  const angle = Math.PI / 4 + i * Math.PI / 2;
  const radius = 1.37;
  const x = Math.cos(angle) * radius;
  const z = Math.sin(angle) * radius;

  const pillar = new THREE.Mesh(pillarGeometry, crystalMaterial);
  pillar.position.set(x, 0, z);
  pillar.castShadow = true;
  hourglass.add(pillar);

  const pillarEdges = new THREE.LineSegments(
    new THREE.EdgesGeometry(pillarGeometry, 15),
    crystalEdgeMaterial
  );
  pillarEdges.position.copy(pillar.position);
  pillarEdges.renderOrder = 6;
  hourglass.add(pillarEdges);

  for (const y of [-2.14, 2.14]) {
    const collar = new THREE.Mesh(pillarRingGeometry, crystalMaterial);
    collar.position.set(x, y, z);
    collar.rotation.x = Math.PI / 2;
    hourglass.add(collar);
  }
}

const floorMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x0a1421,
  roughness: 0.22,
  metalness: 0.16,
  clearcoat: 0.62,
  clearcoatRoughness: 0.19
});
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(12, 128),
  floorMaterial
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.59;
floor.receiveShadow = true;
scene.add(floor);

const halo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: makeGlowTexture(),
  color: 0x6abfff,
  transparent: true,
  opacity: 0.21,
  blending: THREE.AdditiveBlending,
  depthWrite: false
}));
halo.position.set(0, -2.55, 0);
halo.scale.set(5.3, 2.05, 1);
halo.material.rotation = 0.1;
scene.add(halo);

function createCausticArc(radius, start, length, width, color, opacity, y) {
  const segments = 72;
  const positions = [];
  const indices = [];

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const angle = start + length * t;
    const ripple = Math.sin(t * Math.PI * 5 + radius) * 0.022;
    const inner = radius - width * 0.5 + ripple;
    const outer = radius + width * 0.5 + ripple;

    positions.push(
      Math.cos(angle) * inner, y, Math.sin(angle) * inner,
      Math.cos(angle) * outer, y, Math.sin(angle) * outer
    );

    if (i < segments) {
      const a = i * 2;
      indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  const material = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide
  });
  return new THREE.Mesh(geometry, material);
}

const causticData = [
  [1.72, 0.12, 1.05, 0.035, 0x9eeaff, 0.24],
  [1.88, 1.74, 0.76, 0.026, 0x79cfff, 0.17],
  [2.10, 2.82, 1.12, 0.032, 0xd7f7ff, 0.14],
  [1.50, 4.10, 0.68, 0.024, 0x68bdff, 0.19],
  [2.34, 5.12, 0.83, 0.030, 0xb5efff, 0.12]
];
for (const data of causticData) {
  scene.add(createCausticArc(...data, -2.575));
}

const ambient = new THREE.HemisphereLight(0xb9dcff, 0x101018, 1.55);
scene.add(ambient);

const keyLight = new THREE.SpotLight(0xe5f4ff, 120, 18, Math.PI * 0.22, 0.5, 1.2);
keyLight.position.set(4.6, 6.7, 4.4);
keyLight.target.position.set(0, -0.3, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.bias = -0.0003;
keyLight.shadow.normalBias = 0.025;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 17;
scene.add(keyLight, keyLight.target);

const rimLight = new THREE.SpotLight(0x55aaff, 95, 17, Math.PI * 0.24, 0.62, 1.25);
rimLight.position.set(-4.5, 3.4, -5.2);
rimLight.target.position.set(0, 0.4, 0);
scene.add(rimLight, rimLight.target);

const warmLight = new THREE.PointLight(0xffa82e, 18, 4.2, 1.8);
warmLight.position.set(0.1, -1.0, 0.7);
scene.add(warmLight);

const topLight = new THREE.PointLight(0xd8f1ff, 16, 6, 1.8);
topLight.position.set(-1.6, 3.5, 1.5);
scene.add(topLight);

const clock = new THREE.Clock();
const tempColor = new THREE.Color();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  const positions = grainGeometry.attributes.position.array;
  for (let i = 0; i < grainCount; i++) {
    const speed = 0.61 + (i % 11) * 0.012;
    let phase = (grainSeeds[i] + elapsed * speed) % 1;
    const y = 0.13 - phase * 1.17;
    const flutter = 0.004 + Math.abs(y) * 0.01;
    positions[i * 3] =
      Math.sin(i * 8.71 + elapsed * 8.4) * flutter +
      Math.sin(i * 1.37) * 0.004;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] =
      Math.cos(i * 5.43 + elapsed * 7.1) * flutter;
  }
  grainGeometry.attributes.position.needsUpdate = true;

  stream.scale.x = 0.88 + Math.sin(elapsed * 11) * 0.08;
  stream.scale.z = 0.88 + Math.cos(elapsed * 9) * 0.07;
  warmLight.intensity = 17 + Math.sin(elapsed * 2.3) * 2;

  const hueShift = 0.56 + Math.sin(elapsed * 0.4) * 0.012;
  tempColor.setHSL(hueShift, 0.74, 0.72);
  rimLight.color.lerp(tempColor, 0.025);

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
