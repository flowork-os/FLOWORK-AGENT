<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ceramic Coffee Mug</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e9e5df}canvas{display:block}</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// Units: centimeters. Mug ~9 cm tall.
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e5df);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 500);
camera.position.set(12, 10, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

// ---------- Materials ----------
const glaze = new THREE.MeshPhysicalMaterial({
  color: 0xf4eee2, roughness: 0.32, metalness: 0,
  clearcoat: 0.55, clearcoatRoughness: 0.28, envMapIntensity: 0.7
});

// ---------- Mug body (lathe profile: outer wall, rim, inner wall, floor) ----------
const prof = [
  [0.01,0.0],[3.15,0.0],[3.7,0.18],[3.95,0.6],   // base fillet
  [4.05,2.5],[4.15,6.2],[4.2,8.55],              // outer wall, slight taper
  [4.16,9.0],[3.98,9.14],[3.8,9.0],              // rounded rim
  [3.72,8.55],[3.64,4.5],[3.6,1.15],             // inner wall
  [3.25,0.78],[0.01,0.72]                        // inner floor
].map(p => new THREE.Vector2(p[0], p[1]));
const bodyGeo = new THREE.LatheGeometry(prof, 180);

// Perturb rim: gentle unevenness + one small chip on the rim edge
const sm = (a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
const pos = bodyGeo.attributes.position;
const CHIP_TH = 2.4, CHIP_W = 0.11;
for (let i=0;i<pos.count;i++){
  const x=pos.getX(i), y=pos.getY(i), z=pos.getZ(i);
  const th=Math.atan2(z,x), r=Math.hypot(x,z);
  const w=sm(8.45, 9.14, y);               // only near the rim
  if (w<=0) continue;
  let ny = y + w*(0.06*Math.sin(2*th+1.2) + 0.035*Math.sin(5*th+0.5));   // uneven rim
  const d = Math.atan2(Math.sin(th-CHIP_TH), Math.cos(th-CHIP_TH));
  const g = Math.exp(-(d*d)/(CHIP_W*CHIP_W));                            // chip falloff
  ny -= 0.42*g*w;
  const nr = r + (3.95-r)*0.75*g*w;        // pinch walls together at the chip
  pos.setXYZ(i, Math.cos(th)*nr, ny, Math.sin(th)*nr);
}
bodyGeo.computeVertexNormals();
const body = new THREE.Mesh(bodyGeo, glaze);
body.castShadow = body.receiveShadow = true;

// ---------- Thick C-shaped handle ----------
const handleCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(3.4,6.9,0), new THREE.Vector3(5.2,7.1,0),
  new THREE.Vector3(6.35,6.0,0), new THREE.Vector3(6.6,4.6,0),
  new THREE.Vector3(6.2,3.2,0), new THREE.Vector3(5.0,2.3,0),
  new THREE.Vector3(3.4,2.5,0)
]);
const handle = new THREE.Mesh(new THREE.TubeGeometry(handleCurve, 72, 0.6, 20), glaze);
handle.castShadow = handle.receiveShadow = true;

// ---------- Faint tea-stain ring on the inner wall ----------
const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
const cx = cv.getContext('2d');
const gr = cx.createLinearGradient(0,0,0,128);
gr.addColorStop(0.00,'rgba(105,72,40,0)');
gr.addColorStop(0.06,'rgba(100,68,38,0.42)');   // tide line
gr.addColorStop(0.20,'rgba(115,82,50,0.20)');
gr.addColorStop(0.70,'rgba(120,90,55,0.07)');
gr.addColorStop(1.00,'rgba(120,90,55,0)');
cx.fillStyle = gr; cx.fillRect(0,0,512,128);
for (let i=0;i<380;i++){
  cx.fillStyle = `rgba(90,60,30,${Math.random()*0.12})`;
  cx.fillRect(Math.random()*512, Math.random()*128, 2+Math.random()*6, 1+Math.random()*3);
}
const stainTex = new THREE.CanvasTexture(cv);
stainTex.wrapS = THREE.RepeatWrapping;
const stain = new THREE.Mesh(
  new THREE.CylinderGeometry(3.5, 3.46, 2.3, 96, 1, true),
  new THREE.MeshStandardMaterial({ map: stainTex, transparent: true, depthWrite: false,
    roughness: 0.9, metalness: 0, side: THREE.BackSide })
);
stain.position.y = 5.65;
stain.renderOrder = 1;

const mug = new THREE.Group();
mug.add(body, handle, stain);
scene.add(mug);

// ---------- Lighting & soft ground shadow ----------
scene.add(new THREE.HemisphereLight(0xfff6e8, 0x8a8078, 0.5));
const key = new THREE.DirectionalLight(0xfff2e0, 2.4);
key.position.set(7, 14, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -12;
key.shadow.camera.right = key.shadow.camera.top = 12;
key.shadow.camera.far = 50;
key.shadow.bias = -0.0002;
key.shadow.normalBias = 0.03;
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.6);
fill.position.set(-8, 6, -6);
scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(60, 64),
  new THREE.ShadowMaterial({ opacity: 0.26 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4.3, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 7;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.55;
controls.update();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
