<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glowing Mushroom Forest</title>
<style>
html,body{margin:0;overflow:hidden;background:#050815}
canvas{display:block}
#title{position:fixed;left:28px;top:24px;color:#b9fff2;font:600 13px/1.5 system-ui,sans-serif;letter-spacing:.24em;text-transform:uppercase;opacity:.72;pointer-events:none}
#hint{position:fixed;right:26px;bottom:22px;color:#b6c9d8;font:11px system-ui,sans-serif;letter-spacing:.12em;opacity:.45;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="title">Mycelium Nocturne</div>
<div id="hint">DRAG TO EXPLORE · SCROLL TO ZOOM</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050815);
scene.fog = new THREE.FogExp2(0x09152a, 0.018);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 180);
camera.position.set(18, 12, 22);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .045;
controls.autoRotate = true;
controls.autoRotateSpeed = .22;
controls.minDistance = 8;
controls.maxDistance = 48;
controls.maxPolarAngle = Math.PI * .48;
controls.target.set(0, 4, -2);

const world = new THREE.Group();
scene.add(world);
const animatedCaps = [];
const animatedFerns = [];
const animatedRipples = [];
const spores = [];
const glowLights = [];

let seed = 724391;
function rand(){
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a,b){return a + (b-a)*rand()}
function pick(a){return a[Math.floor(rand()*a.length)]}
function hexColor(v){return new THREE.Color(v)}
function standard(color, rough=.7, metal=0, emissive=0x000000, ei=0){
  return new THREE.MeshStandardMaterial({
    color, roughness:rough, metalness:metal,
    emissive, emissiveIntensity:ei
  });
}
function glow(color, intensity=2, opacity=1){
  return new THREE.MeshStandardMaterial({
    color, roughness:.38, metalness:0,
    emissive:color, emissiveIntensity:intensity,
    transparent:opacity<1, opacity,
    blending:opacity<1?THREE.AdditiveBlending:THREE.NormalBlending,
    depthWrite:opacity>=1
  });
}
function cylinderBetween(a,b,r,material,radial=8){
  const d = new THREE.Vector3().subVectors(b,a);
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r,r*.82,d.length(),radial),material);
  mesh.position.copy(a).add(b).multiplyScalar(.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function tube(points,r,material,segments=16){
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve,segments, r, 7, false),material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

scene.add(new THREE.HemisphereLight(0x263c66,0x060911,1.15));
const moon = new THREE.DirectionalLight(0x9cbcff,2.1);
moon.position.set(-18,28,14);
moon.castShadow = true;
moon.shadow.mapSize.set(2048,2048);
moon.shadow.camera.left=-35;
moon.shadow.camera.right=35;
moon.shadow.camera.top=35;
moon.shadow.camera.bottom=-35;
moon.shadow.camera.near=1;
moon.shadow.camera.far=85;
scene.add(moon);

const moonDisc = new THREE.Mesh(
  new THREE.SphereGeometry(2.2,24,16),
  glow(0xa9cfff,.8)
);
moonDisc.position.set(-30,30,-45);
scene.add(moonDisc);

const skyGlow = new THREE.Mesh(
  new THREE.SphereGeometry(75,32,18),
  new THREE.MeshBasicMaterial({color:0x07142a,side:THREE.BackSide})
);
scene.add(skyGlow);

const groundMat = standard(0x111a1a,.98,0,0x06100e,.15);
const ground = new THREE.Mesh(new THREE.CircleGeometry(52,96),groundMat);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
world.add(ground);

const clearing = new THREE.Mesh(
  new THREE.CircleGeometry(14,64),
  standard(0x162525,.96,0,0x081817,.3)
);
clearing.rotation.x=-Math.PI/2;
clearing.position.y=.018;
world.add(clearing);

const soilMat = standard(0x101516,1,0,0x020403,.1);
for(let i=0;i<120;i++){
  const r=range(8,42), a=range(0,Math.PI*2);
  const pebble = new THREE.Mesh(new THREE.IcosahedronGeometry(range(.04,.18),1),soilMat);
  pebble.position.set(Math.cos(a)*r,range(.02,.11),Math.sin(a)*r);
  pebble.scale.y=range(.3,.8);
  pebble.rotation.set(range(0,3),range(0,3),range(0,3));
  pebble.castShadow=true;
  world.add(pebble);
}

const pool = new THREE.Mesh(
  new THREE.CircleGeometry(5.4,64),
  new THREE.MeshPhysicalMaterial({
    color:0x0b4b58, emissive:0x062c39, emissiveIntensity:.75,
    roughness:.12, metalness:.25, transparent:true, opacity:.83,
    clearcoat:1, clearcoatRoughness:.12
  })
);
pool.rotation.x=-Math.PI/2;
pool.position.set(5,.055,-7);
world.add(pool);

const poolEdge = new THREE.Mesh(
  new THREE.RingGeometry(5.25,5.55,64),
  glow(0x1d90a0,.5,.52)
);
poolEdge.rotation.x=-Math.PI/2;
poolEdge.position.copy(pool.position);
poolEdge.position.y=.07;
world.add(poolEdge);

for(let i=0;i<8;i++){
  const ripple = new THREE.Mesh(
    new THREE.RingGeometry(.3,.36,32),
    new THREE.MeshBasicMaterial({
      color:0x61eced,transparent:true,opacity:.3,
      blending:THREE.AdditiveBlending,depthWrite:false
    })
  );
  ripple.rotation.x=-Math.PI/2;
  ripple.position.set(4.5+range(-1.2,1.2),.085,-7+range(-1,1));
  ripple.scale.setScalar(range(.8,2));
  ripple.userData.phase=range(0,Math.PI*2);
  animatedRipples.push(ripple);
  world.add(ripple);
}

const pathMat = glow(0x50d7c8,1.25);
for(let i=0;i<20;i++){
  const t=i/19;
  const z=15-t*26;
  const x=-5.5+Math.sin(t*4.8)*2.5+t*7;
  const stone=new THREE.Mesh(new THREE.DodecahedronGeometry(range(.38,.58),1),pathMat);
  stone.position.set(x,.18,z);
  stone.scale.y=.34;
  stone.rotation.y=range(0,6.28);
  stone.castShadow=true;
  world.add(stone);
}

function makeTree(x,z,s=1){
  const trunkMat=standard(0x131516,.95,0,0x050907,.2);
  const barkGlow=standard(0x1a2824,.9,0,0x081510,.3);
  const g=new THREE.Group();
  g.position.set(x,0,z);
  g.scale.setScalar(s);
  const pts=[
    new THREE.Vector3(0,.1,0),
    new THREE.Vector3(range(-.3,.3),3.8,.05),
    new THREE.Vector3(range(-.6,.5),7.4,range(-.1,.1)),
    new THREE.Vector3(range(-1,.8),11.2,range(-.15,.15))
  ];
  g.add(tube(pts,.42,trunkMat,20));
  for(let i=0;i<4;i++){
    const y=range(4.2,9.8);
    const side=pick([-1,1]);
    const base=new THREE.Vector3(side*range(.05,.35),y,0);
    const tip=new THREE.Vector3(side*range(1.8,3.7),y+range(1.1,2.7),range(-.2,.5));
    g.add(cylinderBetween(base,tip,.18,barkGlow,7));
    if(i%2===0){
      const tip2=tip.clone().add(new THREE.Vector3(side*range(.6,1.5),range(.5,1.5),range(-.4,.4)));
      g.add(cylinderBetween(tip,tip2,.11,trunkMat,7));
    }
  }
  const crown=new THREE.Mesh(
    new THREE.IcosahedronGeometry(2.2,1),
    standard(0x0c1717,.98,0,0x04120f,.22)
  );
  crown.position.set(pts[3].x,11.7,pts[3].z);
  crown.scale.set(1.4,.8,1);
  g.add(crown);
  world.add(g);
}
[
  [-21,-18,1.2],[-18,-3,1.05],[-20,15,1.3],[20,-18,1.4],
  [21,0,1.1],[18,17,1.25],[-10,-27,1.35],[10,-29,1.15]
].forEach(v=>makeTree(...v));

function makeLog(x,z,len,rot){
  const logMat=standard(0x28251d,.96,0,0x120d08,.2);
  const mossMat=standard(0x314b32,.9,0,0x102617,.45);
  const g=new THREE.Group();
  g.position.set(x,.48,z);
  g.rotation.y=rot;
  const log=new THREE.Mesh(new THREE.CylinderGeometry(.58,.7,len,12),logMat);
  log.rotation.z=Math.PI/2;
  log.castShadow=true;log.receiveShadow=true;
  g.add(log);
  for(let i=0;i<7;i++){
    const moss=new THREE.Mesh(new THREE.SphereGeometry(range(.2,.42),8,6),mossMat);
    moss.scale.y=.35;
    moss.position.set(range(-len*.44,len*.44),.5+range(-.02,.25),range(-.35,.35));
    g.add(moss);
  }
  const end=new THREE.Mesh(new THREE.CircleGeometry(.5,16),standard(0x76533a,.9));
  end.rotation.y=Math.PI/2;
  end.position.x=len/2+.01;
  g.add(end);
  world.add(g);
}
makeLog(-8,-6,5.8,-.2);
makeLog(12,-1,5,1.15);
makeLog(-14,8,4.5,-.75);

function makeMushroom(x,z,s,color,seedPhase=0){
  const g=new THREE.Group();
  g.position.set(x,0,z);
  g.scale.setScalar(s);
  const stemMat=standard(0xc9bba4,.72,0,0x342f2b,.2);
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(.38,.62,4.1,18,1,false),stemMat);
  stem.position.y=2.05;
  stem.castShadow=true;stem.receiveShadow=true;
  g.add(stem);

  const capProfile=[
    new THREE.Vector2(0,.08),new THREE.Vector2(.22,.11),
    new THREE.Vector2(.57,.22),new THREE.Vector2(.94,.39),
    new THREE.Vector2(1.24,.28),new THREE.Vector2(1.42,.05),
    new THREE.Vector2(1.38,-.13),new THREE.Vector2(1.12,-.24),
    new THREE.Vector2(.62,-.3),new THREE.Vector2(.2,-.25),
    new THREE.Vector2(0,-.16)
  ];
  const capMat=glow(color,1.55);
  const cap=new THREE.Mesh(new THREE.LatheGeometry(capProfile,32),capMat);
  cap.position.y=4.25;
  cap.castShadow=true;cap.receiveShadow=true;
  g.add(cap);

  const underside=glow(new THREE.Color(color).multiplyScalar(.68),1.2,.82);
  for(let i=0;i<7;i++){
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.4+i*.12,.018,5,24),underside);
    ring.rotation.x=Math.PI/2;
    ring.position.y=4.02-i*.022;
    ring.scale.x=1.15;
    g.add(ring);
  }

  for(let i=0;i<6;i++){
    const spot=new THREE.Mesh(new THREE.SphereGeometry(range(.045,.1),8,6),glow(0xe6fff1,3));
    const a=range(0,Math.PI*2),r=range(.2,1.12);
    spot.position.set(Math.cos(a)*r,4.34+range(-.08,.14),Math.sin(a)*r);
    g.add(spot);
  }

  const light=new THREE.PointLight(color,3.8,10*s,2);
  light.position.set(0,3.9,0);
  g.add(light);
  glowLights.push({light,base:3.8,phase:seedPhase});
  animatedCaps.push({cap,light,phase:seedPhase,baseScale:1});
  world.add(g);
  return g;
}

makeMushroom(0,-3,2.0,0x28ead2,.4);
makeMushroom(-5,-8,1.45,0x8f5cff,1.7);
makeMushroom(8,-1,1.65,0xffb633,2.4);
makeMushroom(-11,3,1.25,0x32e0d4,3.1);
makeMushroom(13,8,1.55,0x8658f4,4.2);
makeMushroom(-3,12,1.2,0xffaf37,5.1);
makeMushroom(7,12,1.05,0x31e1d2,5.8);
makeMushroom(-15,-11,.92,0xb05fff,6.7);
makeMushroom(16,-11,1.1,0xffbd42,7.4);

for(let i=0;i<24;i++){
  const a=range(0,Math.PI*2),r=range(6.5,18);
  const x=Math.cos(a)*r,z=Math.sin(a)*r;
  const scale=range(.28,.62);
  const colors=[0x2ce5d2,0x9a64ff,0xffbd45];
  makeMushroom(x,z,scale,pick(colors),range(0,7));
}

const fernStemMat=standard(0x254c3a,.8,0,0x0b2418,.4);
const fernGlowMat=glow(0x3dbd87,.8);
function makeFern(x,z,s,rot){
  const g=new THREE.Group();
  g.position.set(x,.08,z);
  g.rotation.y=rot;
  g.scale.setScalar(s);
  const stemPts=[new THREE.Vector3(0,0,0),new THREE.Vector3(.05,.45,0),new THREE.Vector3(-.12,1.1,.02),new THREE.Vector3(.1,1.8,.06)];
  g.add(tube(stemPts,.045,fernStemMat,12));
  for(let i=0;i<9;i++){
    const y=.25+i*.17;
    const side=i%2?1:-1;
    const branch=new THREE.Vector3(side*.04,y,0);
    const tip=new THREE.Vector3(side*(.38+(i*.035)),y+.18,range(-.15,.15));
    g.add(cylinderBetween(branch,tip,.035,fernStemMat,5));
    const leaf=new THREE.Mesh(new THREE.SphereGeometry(.18,7,5),fernGlowMat);
    leaf.scale.set(1.8,.2,.5);
    leaf.position.copy(tip);
    leaf.rotation.z=side*.38;
    g.add(leaf);
  }
  animatedFerns.push({g,phase:range(0,Math.PI*2),amount:range(.02,.07)});
  world.add(g);
}
for(let i=0;i<28;i++){
  const a=range(0,Math.PI*2),r=range(6,25);
  makeFern(Math.cos(a)*r,Math.sin(a)*r,range(.5,1.25),range(0,6.28));
}

const sporeGeo=new THREE.BufferGeometry();
const sporeCount=330;
const sporePositions=new Float32Array(sporeCount*3);
for(let i=0;i<sporeCount;i++){
  const a=range(0,Math.PI*2),r=range(2,20);
  sporePositions[i*3]=Math.cos(a)*r;
  sporePositions[i*3+1]=range(.3,11);
  sporePositions[i*3+2]=Math.sin(a)*r-3;
  spores.push({
    x:sporePositions[i*3], y:sporePositions[i*3+1],
    z:sporePositions[i*3+2], speed:range(.08,.28),
    drift:range(.3,1.2), phase:range(0,6.28)
  });
}
sporeGeo.setAttribute('position',new THREE.BufferAttribute(sporePositions,3));
const sporeMat=new THREE.PointsMaterial({
  color:0xa6fff1,size:.105,sizeAttenuation:true,
  transparent:true,opacity:.82,blending:THREE.AdditiveBlending,
  depthWrite:false
});
const sporeCloud=new THREE.Points(sporeGeo,sporeMat);
world.add(sporeCloud);

const fireflyGeo=new THREE.BufferGeometry();
const fireflyPos=[];
for(let i=0;i<65;i++){
  fireflyPos.push(range(-22,22),range(1,9),range(-25,18));
}
fireflyGeo.setAttribute('position',new THREE.Float32BufferAttribute(fireflyPos,3));
const fireflyMat=new THREE.PointsMaterial({
  color:0xffef9b,size:.16,transparent:true,opacity:.8,
  blending:THREE.AdditiveBlending,depthWrite:false
});
world.add(new THREE.Points(fireflyGeo,fireflyMat));

const mushroomRings=new THREE.Group();
for(let i=0;i<11;i++){
  const ring=new THREE.Mesh(
    new THREE.TorusGeometry(range(.7,2.7),.025,5,40),
    glow(pick([0x25dccc,0x9f6aff,0xffc144]),1.2,.34)
  );
  ring.rotation.x=Math.PI/2;
  ring.position.set(range(-16,16),.12,range(-19,15));
  ring.scale.y=range(.5,1.4);
  mushroomRings.add(ring);
}
world.add(mushroomRings);

const crystalMat=glow(0x6ee8df,1.35);
for(let i=0;i<24;i++){
  const a=range(0,Math.PI*2),r=range(7,24);
  const crystal=new THREE.Mesh(new THREE.ConeGeometry(range(.08,.2),range(.4,1.1),6),crystalMat);
  crystal.position.set(Math.cos(a)*r,.25,Math.sin(a)*r-2);
  crystal.rotation.set(range(-.2,.2),range(0,6.28),range(-.2,.2));
  crystal.castShadow=true;
  world.add(crystal);
}

const vineMat=standard(0x183b2f,.78,0,0x082118,.5);
for(let i=0;i<13;i++){
  const x=range(-22,22),z=pick([-20,18]);
  const points=[
    new THREE.Vector3(x,.2,z),
    new THREE.Vector3(x+range(-1,1),2.2,z+range(-.4,.4)),
    new THREE.Vector3(x+range(-2,2),4.6,z+range(-.6,.6)),
    new THREE.Vector3(x+range(-3,3),7.2,z+range(-.8,.8))
  ];
  world.add(tube(points,.045,vineMat,24));
}

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();

  animatedCaps.forEach((o,i)=>{
    const pulse=1+Math.sin(t*.75+o.phase)*.1+Math.sin(t*1.7+o.phase*.4)*.035;
    o.cap.scale.set(1,pulse,1);
    o.light.intensity=o.light.userData.base?o.light.userData.base*pulse:3.8*pulse;
  });

  animatedFerns.forEach(o=>{
    o.g.rotation.z=Math.sin(t*.8+o.phase)*o.amount;
  });

  const pos=sporeGeo.attributes.position.array;
  spores.forEach((s,i)=>{
    s.y+=s.speed*.016;
    if(s.y>13)s.y=.2;
    pos[i*3]=s.x+Math.sin(t*.35+s.phase)*s.drift;
    pos[i*3+1]=s.y;
    pos[i*3+2]=s.z+Math.cos(t*.28+s.phase)*s.drift*.5;
  });
  sporeGeo.attributes.position.needsUpdate=true;
  sporeMat.opacity=.68+Math.sin(t*1.8)*.12;

  animatedRipples.forEach((r,i)=>{
    const q=(t*.18+r.userData.phase)%(Math.PI*2);
    const scale=.7+(Math.sin(q)+1)*.65;
    r.scale.setScalar(scale);
    r.material.opacity=.08+(Math.sin(q)+1)*.12;
  });

  mushroomRings.rotation.y=t*.025;
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
