<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amigurumi Hedgehog</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #211a18; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x211a18);
scene.fog = new THREE.Fog(0x211a18, 8, 17);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.4, 3.1, 6.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.55, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 4.4;
controls.maxDistance = 10;

const world = new THREE.Group();
world.rotation.y = -0.23;
scene.add(world);

const yarnTexture = (() => {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const context = canvas.getContext('2d');
  context.fillStyle = '#ffffff';
  context.fillRect(0, 0, size, size);
  context.globalAlpha = 0.2;
  for (let i = 0; i < 1150; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const r = 0.3 + Math.random() * 1.2;
    context.fillStyle = Math.random() > 0.5 ? '#c7c0ae' : '#ffffff';
    context.beginPath();
    context.arc(x, y, r, 0, Math.PI * 2);
    context.fill();
  }
  context.globalAlpha = 0.16;
  context.strokeStyle = '#8f8879';
  context.lineWidth = 0.7;
  for (let i = 0; i < 95; i++) {
    context.beginPath();
    const x = Math.random() * size;
    const y = Math.random() * size;
    context.moveTo(x, y);
    context.bezierCurveTo(x + 12, y - 5, x + 20, y + 9, x + 31, y + 2);
    context.stroke();
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(2.5, 2.5);
  return texture;
})();

const oatmeal = new THREE.MeshStandardMaterial({
  color: 0xd5c2a1,
  roughness: 0.82,
  metalness: 0,
  map: yarnTexture,
  bumpMap: yarnTexture,
  bumpScale: 0.08
});

const earInner = new THREE.MeshStandardMaterial({
  color: 0xb9897b,
  roughness: 0.95,
  map: yarnTexture,
  bumpMap: yarnTexture,
  bumpScale: 0.05
});

const brownPalette = [
  new THREE.MeshStandardMaterial({ color: 0x573523, roughness: 0.92, map: yarnTexture, bumpMap: yarnTexture, bumpScale: 0.07 }),
  new THREE.MeshStandardMaterial({ color: 0x7c4c2c, roughness: 0.91, map: yarnTexture, bumpMap: yarnTexture, bumpScale: 0.07 }),
  new THREE.MeshStandardMaterial({ color: 0xa56835, roughness: 0.9, map: yarnTexture, bumpMap: yarnTexture, bumpScale: 0.07 }),
  new THREE.MeshStandardMaterial({ color: 0xc28a4e, roughness: 0.88, map: yarnTexture, bumpMap: yarnTexture, bumpScale: 0.07 }),
  new THREE.MeshStandardMaterial({ color: 0x8b5632, roughness: 0.91, map: yarnTexture, bumpMap: yarnTexture, bumpScale: 0.07 })
];

const darkYarn = new THREE.MeshStandardMaterial({
  color: 0x3a201b,
  roughness: 0.87,
  map: yarnTexture,
  bumpMap: yarnTexture,
  bumpScale: 0.05
});

const eyeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x090706,
  roughness: 0.14,
  metalness: 0,
  clearcoat: 1,
  clearcoatRoughness: 0.08
});

const noseMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x110d0c,
  roughness: 0.32,
  clearcoat: 0.85,
  clearcoatRoughness: 0.16
});

function makeRoundGeometry(radius, widthSegments = 24, heightSegments = 18) {
  return new THREE.SphereGeometry(radius, widthSegments, heightSegments);
}

function createYarnBall(scale, material) {
  const mesh = new THREE.Mesh(makeRoundGeometry(1), material);
  mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function makeTube(points, radius, material, radialSegments = 7) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const geometry = new THREE.TubeGeometry(curve, 30, radius, radialSegments, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const body = createYarnBall(new THREE.Vector3(1.52, 1.32, 1.38), oatmeal);
body.position.set(0, 1.3, 0.1);
world.add(body);

const face = createYarnBall(new THREE.Vector3(1.16, 1.03, 0.76), oatmeal);
face.position.set(0, 1.22, 1.08);
world.add(face);

const cheekLeft = createYarnBall(new THREE.Vector3(0.5, 0.43, 0.26), oatmeal);
cheekLeft.position.set(-0.48, 0.94, 1.65);
world.add(cheekLeft);

const cheekRight = createYarnBall(new THREE.Vector3(0.5, 0.43, 0.26), oatmeal);
cheekRight.position.set(0.48, 0.94, 1.65);
world.add(cheekRight);

const spineGroup = new THREE.Group();
world.add(spineGroup);

const loopGeometry = new THREE.TorusGeometry(0.18, 0.052, 7, 12);
const topRows = 13;
for (let row = 0; row < topRows; row++) {
  const v = row / (topRows - 1);
  const phi = -0.22 + v * 2.24;
  const circumference = Math.sin(phi);
  const count = Math.max(8, Math.round(10 + circumference * 18));
  for (let index = 0; index < count; index++) {
    const angle = (index / count) * Math.PI * 2 + (row % 2) * 0.19;
    const x = Math.cos(angle) * (1.05 * circumference);
    const z = -0.12 + Math.sin(angle) * (1.1 * circumference) - 0.37;
    const y = 1.28 + Math.cos(phi) * 1.23;
    if (z > 0.72 || y < 0.43) continue;
    const normal = new THREE.Vector3(x / 1.3, (y - 1.25) / 1.35, (z + 0.2) / 1.35).normalize();
    const loop = new THREE.Mesh(loopGeometry, brownPalette[(row * 3 + index * 5 + (index % 3)) % brownPalette.length]);
    loop.position.set(x, y, z);
    loop.scale.setScalar(0.82 + 0.18 * Math.sin(row * 1.7 + index));
    loop.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
    loop.rotateZ((index * 0.67 + row * 0.31) % Math.PI);
    loop.castShadow = true;
    spineGroup.add(loop);
  }
}

for (let ring = 0; ring < 7; ring++) {
  const t = ring / 6;
  const y = 0.6 + t * 1.63;
  const z = -1.18 + t * 0.34;
  const radiusX = 0.68 + Math.sin(t * Math.PI) * 0.48;
  const count = 10 + ring * 2;
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    const x = Math.cos(angle) * radiusX;
    const zz = z + Math.sin(angle) * 0.19;
    const loop = new THREE.Mesh(loopGeometry, brownPalette[(i + ring * 2) % brownPalette.length]);
    loop.position.set(x, y, zz);
    loop.scale.setScalar(0.78 + (i % 3) * 0.08);
    loop.rotation.set(0.45 + Math.sin(angle) * 0.75, angle + Math.PI * 0.5, i * 0.35);
    loop.castShadow = true;
    spineGroup.add(loop);
  }
}

function addEar(x) {
  const outer = createYarnBall(new THREE.Vector3(0.44, 0.55, 0.19), oatmeal);
  outer.position.set(x, 2.32, 0.53);
  outer.rotation.z = x < 0 ? -0.22 : 0.22;
  world.add(outer);

  const inner = createYarnBall(new THREE.Vector3(0.25, 0.34, 0.055), earInner);
  inner.position.set(x * 1.02, 2.32, 0.71);
  inner.rotation.z = x < 0 ? -0.22 : 0.22;
  world.add(inner);
}
addEar(-0.82);
addEar(0.82);

function addPaw(x, z, rotation) {
  const paw = createYarnBall(new THREE.Vector3(0.53, 0.35, 0.48), oatmeal);
  paw.position.set(x, 0.34, z);
  paw.rotation.z = rotation;
  world.add(paw);

  const toeMaterial = new THREE.MeshStandardMaterial({ color: 0xb89b78, roughness: 0.95 });
  for (let i = -1; i <= 1; i++) {
    const toe = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), toeMaterial);
    toe.position.set(x + i * 0.11, 0.23, z + 0.39);
    toe.castShadow = true;
    world.add(toe);
  }
}
addPaw(-1.04, 0.64, -0.16);
addPaw(1.04, 0.64, 0.16);
addPaw(-0.92, -0.76, -0.12);
addPaw(0.92, -0.76, 0.12);

const eyeGeometry = new THREE.SphereGeometry(0.125, 18, 14);
function addEye(x) {
  const eye = new THREE.Mesh(eyeGeometry, eyeMaterial);
  eye.position.set(x, 1.45, 1.79);
  eye.scale.set(1, 1, 0.55);
  eye.castShadow = true;
  world.add(eye);

  const glint = new THREE.Mesh(new THREE.SphereGeometry(0.034, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  glint.position.set(x - 0.028, 1.49, 1.865);
  world.add(glint);
}
addEye(-0.45);
addEye(0.45);

const nose = new THREE.Mesh(new THREE.SphereGeometry(0.18, 22, 16), noseMaterial);
nose.position.set(0, 1.02, 2.03);
nose.scale.set(1.12, 0.78, 0.74);
nose.castShadow = true;
world.add(nose);

const smileLeft = makeTube([
  new THREE.Vector3(-0.035, 0.86, 1.96),
  new THREE.Vector3(-0.15, 0.79, 2.005),
  new THREE.Vector3(-0.28, 0.82, 1.97)
], 0.023, darkYarn, 6);
world.add(smileLeft);

const smileRight = makeTube([
  new THREE.Vector3(0.035, 0.86, 1.96),
  new THREE.Vector3(0.15, 0.79, 2.005),
  new THREE.Vector3(0.28, 0.82, 1.97)
], 0.023, darkYarn, 6);
world.add(smileRight);

for (let row = 0; row < 9; row++) {
  const y = 0.48 + row * 0.205;
  const width = 0.6 + Math.sin((row / 8) * Math.PI) * 0.76;
  const count = Math.max(7, Math.floor(width * 10));
  for (let i = 0; i < count; i++) {
    const u = count === 1 ? 0 : i / (count - 1);
    const x = (u - 0.5) * width * 1.8;
    const z = 1.58 + Math.sqrt(Math.max(0, 1 - ((x / (width * 0.95)) ** 2))) * 0.11;
    if (y > 1.86 && Math.abs(x) < 0.43) continue;
    const stitch = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.018, 5, 10, Math.PI * 1.45), oatmeal);
    stitch.position.set(x, y, z);
    stitch.rotation.set(0.15, Math.PI, (row % 2 ? -1 : 1) * 0.22);
    stitch.castShadow = true;
    world.add(stitch);
  }
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(7, 80),
  new THREE.MeshStandardMaterial({ color: 0x463833, roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.03;
floor.receiveShadow = true;
scene.add(floor);

const keyLight = new THREE.DirectionalLight(0xffe3c2, 4.3);
keyLight.position.set(4.5, 7, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -5;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xffa96d, 24, 12, 2);
fillLight.position.set(-4, 2.8, 3.2);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xa86e52, 2.5);
rimLight.position.set(-4, 4, -5);
scene.add(rimLight);

scene.add(new THREE.HemisphereLight(0xffe8cc, 0x382628, 1.65));

const ambientDust = new THREE.Mesh(
  new THREE.RingGeometry(3.2, 4.6, 64),
  new THREE.MeshBasicMaterial({ color: 0x8b6050, transparent: true, opacity: 0.06, side: THREE.DoubleSide })
);
ambientDust.rotation.x = -Math.PI / 2;
ambientDust.position.y = -0.025;
scene.add(ambientDust);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  world.position.y = Math.sin(time * 1.25) * 0.025;
  world.rotation.z = Math.sin(time * 0.7) * 0.012;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
