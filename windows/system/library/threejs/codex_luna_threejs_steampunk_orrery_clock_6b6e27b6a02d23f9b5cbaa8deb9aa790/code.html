<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steampunk Orrery Clock</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101518;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1316);
    scene.fog = new THREE.Fog(0x0d1316, 8, 18);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(6.2, 4.2, 7.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.minDistance = 4.4;
    controls.maxDistance = 11;
    controls.target.set(0, 1.45, 0);
    controls.update();

    const brass = new THREE.MeshStandardMaterial({
      color: 0xb77832,
      metalness: 0.9,
      roughness: 0.22
    });
    const brassBright = new THREE.MeshStandardMaterial({
      color: 0xe0a34a,
      metalness: 0.92,
      roughness: 0.16
    });
    const brassDark = new THREE.MeshStandardMaterial({
      color: 0x68401e,
      metalness: 0.82,
      roughness: 0.3
    });
    const copper = new THREE.MeshStandardMaterial({
      color: 0xb85d35,
      metalness: 0.86,
      roughness: 0.2
    });
    const copperDark = new THREE.MeshStandardMaterial({
      color: 0x653326,
      metalness: 0.8,
      roughness: 0.3
    });
    const steel = new THREE.MeshStandardMaterial({
      color: 0x596267,
      metalness: 0.9,
      roughness: 0.24
    });
    const steelDark = new THREE.MeshStandardMaterial({
      color: 0x252d30,
      metalness: 0.8,
      roughness: 0.34
    });
    const patina = new THREE.MeshStandardMaterial({
      color: 0x3e7664,
      metalness: 0.42,
      roughness: 0.55
    });
    const darkFace = new THREE.MeshStandardMaterial({
      color: 0x161a1b,
      metalness: 0.3,
      roughness: 0.5
    });
    const ivory = new THREE.MeshStandardMaterial({
      color: 0xd8c59c,
      metalness: 0.15,
      roughness: 0.65
    });
    const red = new THREE.MeshStandardMaterial({
      color: 0x9d2f24,
      metalness: 0.5,
      roughness: 0.32
    });
    const glass = new THREE.MeshPhysicalMaterial({
      color: 0x8db8a8,
      metalness: 0.05,
      roughness: 0.08,
      transmission: 0.25,
      transparent: true,
      opacity: 0.3,
      side: THREE.DoubleSide
    });
    const crackMaterial = new THREE.LineBasicMaterial({
      color: 0xd8eee2,
      transparent: true,
      opacity: 0.72
    });

    const clockwork = new THREE.Group();
    scene.add(clockwork);

    function setShadow(mesh, cast = true, receive = true) {
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      return mesh;
    }

    function addBox(parent, width, height, depth, material, position, rotationZ = 0) {
      const mesh = setShadow(new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material));
      mesh.position.copy(position);
      mesh.rotation.z = rotationZ;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder(parent, radius, height, material, position, rotationX = 0, rotationZ = 0, segments = 32) {
      const mesh = setShadow(new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, segments), material));
      mesh.position.copy(position);
      mesh.rotation.x = rotationX;
      mesh.rotation.z = rotationZ;
      parent.add(mesh);
      return mesh;
    }

    function addSphere(parent, radius, material, position, scale = null) {
      const mesh = setShadow(new THREE.Mesh(new THREE.SphereGeometry(radius, 24, 16), material));
      mesh.position.copy(position);
      if (scale !== null) {
        mesh.scale.copy(scale);
      }
      parent.add(mesh);
      return mesh;
    }

    function addBolt(parent, position, radius = 0.055, material = brassBright) {
      return addSphere(parent, radius, material, position);
    }

    function cylinderBetween(parent, start, end, radius, material, radialSegments = 16) {
      const direction = end.clone().sub(start);
      const length = direction.length();
      if (length < 0.0001) {
        return null;
      }
      const mesh = setShadow(new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, radialSegments),
        material
      ));
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      parent.add(mesh);
      return mesh;
    }

    function addTube(parent, points, radius, material, tubularSegments = 48) {
      const curve = new THREE.CatmullRomCurve3(points, false, "centripetal");
      const mesh = setShadow(new THREE.Mesh(
        new THREE.TubeGeometry(curve, tubularSegments, radius, 10, false),
        material
      ));
      parent.add(mesh);
      return mesh;
    }

    function addPatinaPatch(parent, position, width, height, rotationZ = 0, depth = 0.018) {
      const patch = setShadow(new THREE.Mesh(
        new THREE.BoxGeometry(width, height, depth),
        patina
      ));
      patch.position.copy(position);
      patch.rotation.z = rotationZ;
      parent.add(patch);
      return patch;
    }

    function makeGear(teeth, radius, thickness, material, holeCount = 0, toothMaterial = material) {
      const gear = new THREE.Group();

      const body = setShadow(new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, thickness, 48),
        material
      ));
      body.rotation.x = Math.PI / 2;
      gear.add(body);

      const toothRadial = Math.max(0.12, radius * 0.2);
      const toothTangential = Math.max(0.08, radius * 0.115);
      const toothCenter = radius + toothRadial * 0.32;

      for (let index = 0; index < teeth; index += 1) {
        const angle = index * Math.PI * 2 / teeth;
        const tooth = setShadow(new THREE.Mesh(
          new THREE.BoxGeometry(toothTangential, toothRadial, thickness * 1.08),
          toothMaterial
        ));
        tooth.position.set(
          Math.cos(angle) * toothCenter,
          Math.sin(angle) * toothCenter,
          0
        );
        tooth.rotation.z = angle - Math.PI / 2;
        gear.add(tooth);
      }

      if (holeCount > 0) {
        const holeRadius = Math.max(0.055, radius * 0.085);
        const holeDistance = radius * 0.57;
        for (let index = 0; index < holeCount; index += 1) {
          const angle = index * Math.PI * 2 / holeCount + Math.PI / holeCount;
          const hole = setShadow(new THREE.Mesh(
            new THREE.CylinderGeometry(holeRadius, holeRadius, thickness * 0.24, 16),
            steelDark
          ));
          hole.rotation.x = Math.PI / 2;
          hole.position.set(
            Math.cos(angle) * holeDistance,
            Math.sin(angle) * holeDistance,
            thickness * 0.53
          );
          gear.add(hole);
        }
      }

      const outerRing = setShadow(new THREE.Mesh(
        new THREE.TorusGeometry(radius * 0.88, Math.max(0.025, radius * 0.045), 8, 48),
        brassBright
      ));
      outerRing.position.z = thickness * 0.54;
      gear.add(outerRing);

      return gear;
    }

    function addGearRivets(parent, radius, count, z, material = brassBright) {
      for (let index = 0; index < count; index += 1) {
        const angle = index * Math.PI * 2 / count;
        addBolt(parent, new THREE.Vector3(
          Math.cos(angle) * radius,
          Math.sin(angle) * radius,
          z
        ), 0.035, material);
      }
    }

    function makeArmature(angle, planetMaterial, accentMaterial) {
      const armGroup = new THREE.Group();
      armGroup.position.set(0, 2.13, 0.43);
      armGroup.rotation.z = angle;

      const length = 1.48;
      const points = [
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0.28, 0.12, 0),
        new THREE.Vector3(0.72, 0.34, 0),
        new THREE.Vector3(1.12, 0.28, 0),
        new THREE.Vector3(length, 0, 0)
      ];
      addTube(armGroup, points, 0.058, brassBright, 32);

      const lowerAccent = addTube(
        armGroup,
        [
          new THREE.Vector3(0.22, 0.105, 0.04),
          new THREE.Vector3(0.62, 0.29, 0.04),
          new THREE.Vector3(0.98, 0.25, 0.04)
        ],
        0.018,
        accentMaterial,
        20
      );
      lowerAccent.castShadow = true;

      const rodStart = new THREE.Vector3(length - 0.24, 0, 0.02);
      const rodEnd = new THREE.Vector3(length + 0.18, 0, 0.02);
      cylinderBetween(armGroup, rodStart, rodEnd, 0.032, steel, 12);

      addBolt(armGroup, new THREE.Vector3(0.05, 0, 0.09), 0.085, brassDark);
      addBolt(armGroup, new THREE.Vector3(length, 0, 0.09), 0.078, brassBright);

      const planet = addSphere(
        armGroup,
        0.19,
        planetMaterial,
        new THREE.Vector3(length + 0.2, 0, 0.12)
      );

      const planetRing = setShadow(new THREE.Mesh(
        new THREE.TorusGeometry(0.25, 0.018, 8, 28),
        accentMaterial
      ));
      planetRing.position.copy(planet.position);
      planetRing.rotation.x = Math.PI * 0.28;
      planetRing.rotation.z = Math.PI * 0.12;
      armGroup.add(planetRing);

      addBolt(armGroup, new THREE.Vector3(0.47, 0.2, 0.07), 0.035, brassDark);
      addBolt(armGroup, new THREE.Vector3(0.91, 0.31, 0.07), 0.035, brassBright);

      clockwork.add(armGroup);
      return armGroup;
    }

    const base = new THREE.Group();
    clockwork.add(base);

    addBox(base, 4.6, 0.34, 2.35, brassDark, new THREE.Vector3(0, 0.2, 0));
    addBox(base, 4.24, 0.19, 2.08, brassBright, new THREE.Vector3(0, 0.46, 0));
    addBox(base, 3.88, 0.16, 1.9, brassDark, new THREE.Vector3(0, 0.62, 0));

    addBox(base, 4.05, 0.055, 0.095, brassBright, new THREE.Vector3(0, 0.57, 1.0));
    addBox(base, 4.05, 0.055, 0.095, brassBright, new THREE.Vector3(0, 0.57, -1.0));

    const footPositions = [
      new THREE.Vector3(-1.72, 0.06, -0.72),
      new THREE.Vector3(1.72, 0.06, -0.72),
      new THREE.Vector3(-1.72, 0.06, 0.72),
      new THREE.Vector3(1.72, 0.06, 0.72)
    ];
    for (const footPosition of footPositions) {
      addBox(base, 0.5, 0.14, 0.44, brassDark, footPosition);
      addBolt(base, new THREE.Vector3(footPosition.x, 0.14, footPosition.z), 0.045, brassBright);
    }

    addPatinaPatch(base, new THREE.Vector3(-1.22, 0.505, 1.045), 0.11, 0.14, -0.25);
    addPatinaPatch(base, new THREE.Vector3(0.2, 0.505, 1.045), 0.08, 0.21, 0.12);
    addPatinaPatch(base, new THREE.Vector3(1.48, 0.505, 1.045), 0.1, 0.16, -0.18);

    const frame = new THREE.Group();
    clockwork.add(frame);

    const pillarHeight = 2.35;
    for (const x of [-1.92, 1.92]) {
      addCylinder(frame, 0.11, pillarHeight, brassDark, new THREE.Vector3(x, 1.72, -0.34), 0, 0, 20);
      addCylinder(frame, 0.17, 0.08, brassBright, new THREE.Vector3(x, 0.61, -0.34), 0, 0, 24);
      addCylinder(frame, 0.16, 0.08, brassBright, new THREE.Vector3(x, 2.78, -0.34), 0, 0, 24);
      addBolt(frame, new THREE.Vector3(x, 1.28, -0.22), 0.07, brassBright);
      addPatinaPatch(frame, new THREE.Vector3(x + 0.115, 1.9, -0.22), 0.035, 0.42, 0.08, 0.014);
    }

    addTube(
      frame,
      [
        new THREE.Vector3(-1.92, 2.78, -0.34),
        new THREE.Vector3(-1.2, 3.08, -0.34),
        new THREE.Vector3(0, 3.2, -0.34),
        new THREE.Vector3(1.2, 3.08, -0.34),
        new THREE.Vector3(1.92, 2.78, -0.34)
      ],
      0.09,
      brassDark,
      42
    );

    addBox(frame, 3.5, 0.12, 0.16, brassBright, new THREE.Vector3(0, 2.78, -0.34));
    addBolt(frame, new THREE.Vector3(-1.92, 2.78, -0.2), 0.09, brassBright);
    addBolt(frame, new THREE.Vector3(1.92, 2.78, -0.2), 0.09, brassBright);

    const pipeLeft = addTube(
      clockwork,
      [
        new THREE.Vector3(-1.83, 0.84, -0.52),
        new THREE.Vector3(-2.25, 1.3, -0.52),
        new THREE.Vector3(-2.13, 2.08, -0.52),
        new THREE.Vector3(-1.62, 2.68, -0.52),
        new THREE.Vector3(-0.85, 2.74, -0.52),
        new THREE.Vector3(-0.62, 2.35, -0.52)
      ],
      0.065,
      copper,
      48
    );
    pipeLeft.castShadow = true;

    const pipeRight = addTube(
      clockwork,
      [
        new THREE.Vector3(0.7, 0.82, -0.56),
        new THREE.Vector3(1.55, 1.03, -0.56),
        new THREE.Vector3(2.18, 1.62, -0.56),
        new THREE.Vector3(2.22, 2.37, -0.56),
        new THREE.Vector3(1.75, 2.86, -0.56),
        new THREE.Vector3(1.12, 2.8, -0.56),
        new THREE.Vector3(0.82, 2.45, -0.56)
      ],
      0.067,
      copper,
      52
    );
    pipeRight.castShadow = true;

    for (const position of [
      new THREE.Vector3(-1.83, 0.84, -0.52),
      new THREE.Vector3(-0.62, 2.35, -0.52),
      new THREE.Vector3(0.7, 0.82, -0.56),
      new THREE.Vector3(0.82, 2.45, -0.56)
    ]) {
      addBolt(clockwork, position, 0.105, copperDark);
      addBolt(clockwork, position.clone().add(new THREE.Vector3(0, 0, 0.075)), 0.043, brassBright);
    }

    const boiler = new THREE.Group();
    boiler.position.set(-1.17, 0.89, 0.48);
    clockwork.add(boiler);

    const boilerBody = setShadow(new THREE.Mesh(
      new THREE.CylinderGeometry(0.34, 0.34, 0.88, 28),
      copper
    ));
    boilerBody.rotation.z = Math.PI / 2;
    boiler.add(boilerBody);

    for (const x of [-0.37, 0.37]) {
      const band = setShadow(new THREE.Mesh(
        new THREE.TorusGeometry(0.345, 0.035, 8, 28),
        brassBright
      ));
      band.rotation.y = Math.PI / 2;
      band.position.x = x;
      boiler.add(band);
    }

    addSphere(boiler, 0.31, copperDark, new THREE.Vector3(0, 0.27, 0));
    addCylinder(boiler, 0.11, 0.18, brassBright, new THREE.Vector3(0, 0.52, 0), 0, 0, 20);
    addCylinder(boiler, 0.15, 0.055, brassDark, new THREE.Vector3(0, 0.62, 0), 0, 0, 20);

    for (const x of [-0.31, 0, 0.31]) {
      addBolt(boiler, new THREE.Vector3(x, -0.34, 0.25), 0.045, brassBright);
      addBolt(boiler, new THREE.Vector3(x, -0.34, -0.25), 0.045, brassBright);
    }

    addPatinaPatch(boiler, new THREE.Vector3(-0.12, 0.13, 0.34), 0.045, 0.19, -0.25, 0.016);
    addPatinaPatch(boiler, new THREE.Vector3(0.11, -0.08, 0.34), 0.04, 0.12, 0.3, 0.016);

    addTube(
      boiler,
      [
        new THREE.Vector3(0.05, 0.62, 0),
        new THREE.Vector3(0.05, 0.86, 0),
        new THREE.Vector3(0.2, 1.02, 0),
        new THREE.Vector3(0.44, 1.02, 0),
        new THREE.Vector3(0.52, 0.86, 0)
      ],
      0.038,
      copperDark,
      24
    );

    const gauge = new THREE.Group();
    gauge.position.set(1.3, 0.9, 0.76);
    clockwork.add(gauge);

    const gaugeHousing = setShadow(new THREE.Mesh(
      new THREE.CylinderGeometry(0.48, 0.48, 0.13, 36),
      brassDark
    ));
    gaugeHousing.rotation.x = Math.PI / 2;
    gauge.add(gaugeHousing);

    const gaugeRing = setShadow(new THREE.Mesh(
      new THREE.TorusGeometry(0.45, 0.065, 12, 40),
      brassBright
    ));
    gaugeRing.position.z = 0.09;
    gauge.add(gaugeRing);

    const gaugeFace = setShadow(new THREE.Mesh(
      new THREE.CylinderGeometry(0.39, 0.39, 0.025, 36),
      darkFace
    ));
    gaugeFace.rotation.x = Math.PI / 2;
    gaugeFace.position.z = 0.08;
    gauge.add(gaugeFace);

    const gaugeGlass = new THREE.Mesh(new THREE.CircleGeometry(0.39, 36), glass);
    gaugeGlass.position.z = 0.105;
    gauge.add(gaugeGlass);

    for (let index = 0; index < 12; index += 1) {
      const angle = index * Math.PI * 2 / 12;
      const tick = addBox(
        gauge,
        0.025,
        index % 3 === 0 ? 0.13 : 0.08,
        0.018,
        ivory,
        new THREE.Vector3(Math.cos(angle) * 0.31, Math.sin(angle) * 0.31, 0.125),
        angle
      );
      tick.castShadow = false;
    }

    const needle = addBox(
      gauge,
      0.035,
      0.27,
      0.025,
      red,
      new THREE.Vector3(-0.08, 0.08, 0.145),
      -0.63
    );
    needle.castShadow = false;
    addBolt(gauge, new THREE.Vector3(0, 0, 0.16), 0.055, brassBright);

    function addCrack(points) {
      const crackGeometry = new THREE.BufferGeometry().setFromPoints(points);
      const crack = new THREE.Line(crackGeometry, crackMaterial);
      gauge.add(crack);
      return crack;
    }

    addCrack([
      new THREE.Vector3(-0.03, 0.35, 0.16),
      new THREE.Vector3(-0.08, 0.19, 0.16),
      new THREE.Vector3(-0.16, 0.12, 0.16),
      new THREE.Vector3(-0.12, -0.01, 0.16)
    ]);
    addCrack([
      new THREE.Vector3(-0.08, 0.19, 0.16),
      new THREE.Vector3(0.04, 0.12, 0.16),
      new THREE.Vector3(0.1, 0.01, 0.16)
    ]);
    addCrack([
      new THREE.Vector3(-0.16, 0.12, 0.16),
      new THREE.Vector3(-0.27, 0.09, 0.16),
      new THREE.Vector3(-0.31, -0.04, 0.16)
    ]);

    const sunGear = makeGear(18, 0.78, 0.18, brassDark, 9, brassBright);
    sunGear.position.set(0, 2.13, 0.7);
    clockwork.add(sunGear);
    addGearRivets(sunGear, 0.59, 9, 0.125, brassBright);

    const sunSpokes = new THREE.Group();
    sunGear.add(sunSpokes);
    for (let index = 0; index < 8; index += 1) {
      const angle = index * Math.PI / 4;
      const spoke = setShadow(new THREE.Mesh(
        new THREE.BoxGeometry(0.075, 0.64, 0.065),
        brassBright
      ));
      spoke.rotation.z = angle;
      spoke.position.z = 0.14;
      sunSpokes.add(spoke);
    }

    const sunHub = addCylinder(
      sunGear,
      0.27,
      0.28,
      brassBright,
      new THREE.Vector3(0, 0, 0.14),
      Math.PI / 2,
      0,
      32
    );
    sunHub.castShadow = true;

    const hubRing = setShadow(new THREE.Mesh(
      new THREE.TorusGeometry(0.31, 0.045, 8, 28),
      brassBright
    ));
    hubRing.position.z = 0.3;
    sunGear.add(hubRing);

    addPatinaPatch(sunGear, new THREE.Vector3(-0.67, 0.22, 0.12), 0.045, 0.18, -0.35, 0.018);
    addPatinaPatch(sunGear, new THREE.Vector3(0.18, -0.7, 0.12), 0.045, 0.16, 0.24, 0.018);
    addPatinaPatch(sunGear, new THREE.Vector3(0.56, 0.42, 0.12), 0.04, 0.13, -0.3, 0.018);

    const arms = [];
    arms.push(makeArmature(0.1, red, copper));
    arms.push(makeArmature(Math.PI * 2 / 3 + 0.1, ivory, brassBright));
    arms.push(makeArmature(Math.PI * 4 / 3 + 0.1, steel, patina));

    const escapementA = makeGear(13, 0.43, 0.16, brassDark, 6, brassBright);
    escapementA.position.set(1.42, 2.04, 0.23);
    escapementA.rotation.z = 0.15;
    clockwork.add(escapementA);
    addGearRivets(escapementA, 0.31, 6, 0.115, brassBright);

    const escapementB = makeGear(11, 0.31, 0.15, copperDark, 5, copper);
    escapementB.position.set(1.85, 2.58, 0.24);
    escapementB.rotation.z = -0.26;
    clockwork.add(escapementB);
    addGearRivets(escapementB, 0.22, 5, 0.105, brassBright);

    const escapementC = makeGear(9, 0.245, 0.14, brassDark, 0, brassBright);
    escapementC.position.set(2.1, 1.58, 0.24);
    escapementC.rotation.z = 0.35;
    clockwork.add(escapementC);

    const anchor = new THREE.Group();
    anchor.position.set(1.68, 2.25, 0.38);
    clockwork.add(anchor);
    addBox(anchor, 0.11, 0.82, 0.11, steel, new THREE.Vector3(0, 0, 0), -0.36);
    addBox(anchor, 0.28, 0.12, 0.12, steel, new THREE.Vector3(-0.18, 0.31, 0), -0.36);
    addBox(anchor, 0.28, 0.12, 0.12, steel, new THREE.Vector3(0.18, -0.31, 0), -0.36);
    addBolt(anchor, new THREE.Vector3(0, 0, 0.09), 0.09, brassBright);

    const pendulumRod = cylinderBetween(
      clockwork,
      new THREE.Vector3(1.68, 1.85, 0.2),
      new THREE.Vector3(1.68, 0.86, 0.2),
      0.035,
      steel,
      12
    );
    if (pendulumRod !== null) {
      pendulumRod.castShadow = true;
    }
    addSphere(clockwork, 0.18, brassBright, new THREE.Vector3(1.68, 0.73, 0.2));

    const rearCog = makeGear(16, 0.51, 0.13, steelDark, 7, steel);
    rearCog.position.set(-1.28, 2.34, -0.2);
    rearCog.rotation.z = 0.3;
    clockwork.add(rearCog);

    const rearCogRing = setShadow(new THREE.Mesh(
      new THREE.TorusGeometry(0.44, 0.03, 8, 32),
      patina
    ));
    rearCogRing.position.set(-1.28, 2.34, -0.03);
    clockwork.add(rearCogRing);

    const axle = cylinderBetween(
      clockwork,
      new THREE.Vector3(-1.28, 2.34, -0.03),
      new THREE.Vector3(-1.28, 2.34, 0.5),
      0.07,
      brassBright,
      20
    );
    if (axle !== null) {
      axle.castShadow = true;
    }

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0x151c1e,
        metalness: 0.12,
        roughness: 0.82
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.04;
    ground.receiveShadow = true;
    scene.add(ground);

    const hemisphere = new THREE.HemisphereLight(0xadc3c0, 0x15100c, 1.65);
    scene.add(hemisphere);

    const keyLight = new THREE.DirectionalLight(0xffd5a0, 4.2);
    keyLight.position.set(-4.5, 7.5, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -5;
    keyLight.shadow.camera.right = 5;
    keyLight.shadow.camera.top = 6;
    keyLight.shadow.camera.bottom = -1;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 18;
    scene.add(keyLight);

    const rimLight = new THREE.PointLight(0x4d9e9a, 18, 8, 2);
    rimLight.position.set(-3.2, 3.4, -2.5);
    scene.add(rimLight);

    const warmLight = new THREE.PointLight(0xff8a44, 20, 6, 2);
    warmLight.position.set(2.7, 1.3, 3.2);
    scene.add(warmLight);

    const animationClock = new THREE.Clock();

    function animate() {
      const elapsed = animationClock.getElapsedTime();

      sunGear.rotation.z = elapsed * 0.17;
      escapementA.rotation.z = -elapsed * 0.4 + 0.15;
      escapementB.rotation.z = elapsed * 0.58 - 0.26;
      escapementC.rotation.z = -elapsed * 0.72 + 0.35;
      rearCog.rotation.z = elapsed * 0.22 + 0.3;
      anchor.rotation.z = Math.sin(elapsed * 2.2) * 0.12 - 0.36;

      for (let index = 0; index < arms.length; index += 1) {
        arms[index].rotation.z += (index % 2 === 0 ? 1 : -1) * 0.0008;
      }

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    animate();
  </script>
</body>
</html>
