<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kawaii Boba Tea</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f9e8ef;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf9e8ef);
  scene.fog = new THREE.Fog(0xf9e8ef, 10, 18);

  const camera = new THREE.PerspectiveCamera(
    34,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );
  camera.position.set(0, 0.75, 8.5);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: false
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.25, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.enablePan = false;
  controls.minDistance = 6.3;
  controls.maxDistance = 11;
  controls.minPolarAngle = Math.PI * 0.3;
  controls.maxPolarAngle = Math.PI * 0.66;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.7;

  const hemiLight = new THREE.HemisphereLight(0xfff7fb, 0xc9a5b2, 2.2);
  scene.add(hemiLight);

  const keyLight = new THREE.DirectionalLight(0xfff4e5, 4.2);
  keyLight.position.set(4.5, 7, 6);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.left = -5;
  keyLight.shadow.camera.right = 5;
  keyLight.shadow.camera.top = 7;
  keyLight.shadow.camera.bottom = -4;
  keyLight.shadow.camera.near = 0.5;
  keyLight.shadow.camera.far = 20;
  keyLight.shadow.bias = -0.00015;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xb9d8ff, 1.65);
  fillLight.position.set(-5, 3, 4);
  scene.add(fillLight);

  const rimLight = new THREE.PointLight(0xff9fc9, 18, 10, 2);
  rimLight.position.set(-3.8, 2.8, -3);
  scene.add(rimLight);

  const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0xf7dce7,
    roughness: 0.88,
    metalness: 0
  });
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(7, 96),
    floorMaterial
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -2.56;
  floor.receiveShadow = true;
  scene.add(floor);

  const tea = new THREE.Group();
  tea.rotation.y = -0.08;
  scene.add(tea);

  function applyVerticalGradient(geometry, stops) {
    geometry.computeBoundingBox();
    const minY = geometry.boundingBox.min.y;
    const maxY = geometry.boundingBox.max.y;
    const range = Math.max(maxY - minY, 0.0001);
    const position = geometry.attributes.position;
    const colors = new Float32Array(position.count * 3);
    const color = new THREE.Color();

    for (let i = 0; i < position.count; i++) {
      const t = THREE.MathUtils.clamp((position.getY(i) - minY) / range, 0, 1);
      let lower = stops[0];
      let upper = stops[stops.length - 1];

      for (let s = 0; s < stops.length - 1; s++) {
        if (t >= stops[s].at && t <= stops[s + 1].at) {
          lower = stops[s];
          upper = stops[s + 1];
          break;
        }
      }

      const span = Math.max(upper.at - lower.at, 0.0001);
      const localT = THREE.MathUtils.smoothstep(
        THREE.MathUtils.clamp((t - lower.at) / span, 0, 1),
        0,
        1
      );

      color.set(lower.color).lerp(new THREE.Color(upper.color), localT);
      colors[i * 3] = color.r;
      colors[i * 3 + 1] = color.g;
      colors[i * 3 + 2] = color.b;
    }

    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  }

  const cupProfile = [
    new THREE.Vector2(0.79, -2.14),
    new THREE.Vector2(0.91, -2.08),
    new THREE.Vector2(0.96, -1.94),
    new THREE.Vector2(1.02, -1.18),
    new THREE.Vector2(1.09, -0.28),
    new THREE.Vector2(1.16, 0.75),
    new THREE.Vector2(1.19, 1.72),
    new THREE.Vector2(1.17, 1.94)
  ];

  const milkGeometry = new THREE.LatheGeometry(cupProfile, 96);
  applyVerticalGradient(milkGeometry, [
    { at: 0.00, color: 0xc47f78 },
    { at: 0.20, color: 0xd99a91 },
    { at: 0.47, color: 0xe9b9a6 },
    { at: 0.75, color: 0xf1c9af },
    { at: 1.00, color: 0xf8d8bd }
  ]);

  const milkMaterial = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.48,
    metalness: 0,
    side: THREE.DoubleSide
  });

  const milk = new THREE.Mesh(milkGeometry, milkMaterial);
  milk.castShadow = true;
  milk.receiveShadow = true;
  tea.add(milk);

  const shellProfile = cupProfile.map((point, index) => {
    const extra = index === 0 ? 0.035 : 0.045;
    return new THREE.Vector2(point.x + extra, point.y);
  });
  const shellGeometry = new THREE.LatheGeometry(shellProfile, 96);
  const shellMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xfff8f5,
    transparent: true,
    opacity: 0.19,
    roughness: 0.12,
    metalness: 0,
    clearcoat: 1,
    clearcoatRoughness: 0.12,
    side: THREE.DoubleSide,
    depthWrite: false
  });
  const shell = new THREE.Mesh(shellGeometry, shellMaterial);
  shell.renderOrder = 2;
  tea.add(shell);

  const pearlMaterial = new THREE.MeshStandardMaterial({
    color: 0x3a1d2b,
    roughness: 0.28,
    metalness: 0.02
  });
  const pearlGeometry = new THREE.SphereGeometry(0.275, 32, 24);

  const pearlData = [
    [-0.70, -1.88, 0.78, 0.96],
    [-0.22, -1.93, 0.91, 1.06],
    [ 0.30, -1.91, 0.90, 1.02],
    [ 0.73, -1.82, 0.72, 0.91],
    [-0.50, -1.48, 0.91, 0.94],
    [ 0.00, -1.51, 1.00, 1.08],
    [ 0.53, -1.43, 0.87, 0.96],
    [-0.74, -1.20, 0.68, 0.82],
    [ 0.79, -1.12, 0.59, 0.76]
  ];

  const pearls = [];
  for (const [x, y, z, scale] of pearlData) {
    const pearl = new THREE.Mesh(pearlGeometry, pearlMaterial);
    pearl.position.set(x, y, z);
    pearl.scale.setScalar(scale);
    pearl.castShadow = true;
    pearl.receiveShadow = true;
    tea.add(pearl);
    pearls.push(pearl);
  }

  const whiteMaterial = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.18,
    emissive: 0xffffff,
    emissiveIntensity: 0.12
  });

  function addPearlSparkles(pearl, scale = 1) {
    const sparkleGroup = new THREE.Group();
    sparkleGroup.position.copy(pearl.position);
    sparkleGroup.position.z += 0.275 * pearl.scale.x + 0.012;

    const glintGeometry = new THREE.SphereGeometry(0.045 * scale, 16, 12);
    const left = new THREE.Mesh(glintGeometry, whiteMaterial);
    left.position.set(-0.085 * scale, 0.075 * scale, 0);
    left.scale.set(0.68, 1.28, 0.45);

    const right = new THREE.Mesh(glintGeometry, whiteMaterial);
    right.position.set(0.075 * scale, 0.115 * scale, 0);
    right.scale.set(0.45, 0.8, 0.35);

    const tiny = new THREE.Mesh(glintGeometry, whiteMaterial);
    tiny.position.set(0.125 * scale, 0.015 * scale, 0);
    tiny.scale.setScalar(0.34);

    sparkleGroup.add(left, right, tiny);
    tea.add(sparkleGroup);
  }

  addPearlSparkles(pearls[1], 1);
  addPearlSparkles(pearls[2], 0.95);
  addPearlSparkles(pearls[5], 1.04);

  const lidMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xffc8d9,
    roughness: 0.3,
    metalness: 0,
    clearcoat: 0.75,
    clearcoatRoughness: 0.18
  });

  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(1.18, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2),
    lidMaterial
  );
  dome.position.y = 1.94;
  dome.scale.set(1.02, 0.63, 1.02);
  dome.castShadow = true;
  dome.receiveShadow = true;
  tea.add(dome);

  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(1.205, 0.115, 20, 96),
    new THREE.MeshStandardMaterial({
      color: 0xffaeca,
      roughness: 0.3,
      metalness: 0
    })
  );
  rim.rotation.x = Math.PI / 2;
  rim.position.y = 1.95;
  rim.castShadow = true;
  tea.add(rim);

  const innerRim = new THREE.Mesh(
    new THREE.TorusGeometry(1.07, 0.035, 12, 96),
    new THREE.MeshStandardMaterial({
      color: 0xffe8ee,
      roughness: 0.36
    })
  );
  innerRim.rotation.x = Math.PI / 2;
  innerRim.position.y = 2.01;
  tea.add(innerRim);

  const straw = new THREE.Group();
  straw.position.set(0.34, 2.12, -0.04);
  straw.rotation.z = -0.13;

  const stripeColors = [0xff729f, 0xfff2e7];
  const stripeHeight = 0.28;
  const stripeCount = 9;
  const strawRadius = 0.205;

  for (let i = 0; i < stripeCount; i++) {
    const segmentMaterial = new THREE.MeshStandardMaterial({
      color: stripeColors[i % 2],
      roughness: 0.3,
      metalness: 0,
      clearcoat: 0.45,
      clearcoatRoughness: 0.2
    });
    const segment = new THREE.Mesh(
      new THREE.CylinderGeometry(strawRadius, strawRadius, stripeHeight + 0.012, 40),
      segmentMaterial
    );
    segment.position.y = i * stripeHeight + stripeHeight * 0.5;
    segment.castShadow = true;
    straw.add(segment);
  }

  const strawTop = new THREE.Mesh(
    new THREE.TorusGeometry(strawRadius * 0.69, strawRadius * 0.31, 16, 40),
    new THREE.MeshStandardMaterial({
      color: 0xff729f,
      roughness: 0.28
    })
  );
  strawTop.rotation.x = Math.PI / 2;
  strawTop.position.y = stripeCount * stripeHeight + 0.005;
  straw.add(strawTop);
  tea.add(straw);

  const face = new THREE.Group();
  face.position.z = 1.155;

  const eyeMaterial = new THREE.MeshStandardMaterial({
    color: 0x382235,
    roughness: 0.22,
    metalness: 0
  });

  function makeEye(x) {
    const eye = new THREE.Group();

    const main = new THREE.Mesh(
      new THREE.SphereGeometry(0.205, 36, 28),
      eyeMaterial
    );
    main.scale.set(0.72, 1.18, 0.34);
    main.castShadow = true;
    eye.add(main);

    const largeGlint = new THREE.Mesh(
      new THREE.SphereGeometry(0.055, 20, 16),
      whiteMaterial
    );
    largeGlint.position.set(-0.052, 0.075, 0.073);
    largeGlint.scale.set(0.85, 1.1, 0.55);
    eye.add(largeGlint);

    const smallGlint = new THREE.Mesh(
      new THREE.SphereGeometry(0.026, 16, 12),
      whiteMaterial
    );
    smallGlint.position.set(0.05, -0.005, 0.08);
    eye.add(smallGlint);

    eye.position.set(x, 0.38, 0);
    return eye;
  }

  face.add(makeEye(-0.43), makeEye(0.43));

  const smile = new THREE.Mesh(
    new THREE.TorusGeometry(0.33, 0.055, 16, 48, Math.PI),
    eyeMaterial
  );
  smile.rotation.z = Math.PI;
  smile.position.set(0, -0.02, 0.015);
  smile.scale.y = 0.72;
  face.add(smile);

  const blushMaterial = new THREE.MeshStandardMaterial({
    color: 0xff759c,
    transparent: true,
    opacity: 0.7,
    roughness: 0.72,
    depthWrite: false
  });

  function makeBlush(x) {
    const blush = new THREE.Mesh(
      new THREE.CircleGeometry(0.22, 32),
      blushMaterial
    );
    blush.position.set(x, -0.02, 0.006);
    blush.scale.set(1.3, 0.55, 1);
    return blush;
  }

  face.add(makeBlush(-0.78), makeBlush(0.78));
  tea.add(face);

  const highlightMaterial = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.22,
    depthWrite: false
  });

  const cupHighlight = new THREE.Mesh(
    new THREE.SphereGeometry(0.34, 24, 20),
    highlightMaterial
  );
  cupHighlight.position.set(-0.78, 0.82, 0.91);
  cupHighlight.scale.set(0.27, 1.65, 0.12);
  cupHighlight.rotation.z = -0.08;
  cupHighlight.renderOrder = 4;
  tea.add(cupHighlight);

  const lidHighlight = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 24, 20),
    highlightMaterial
  );
  lidHighlight.position.set(-0.48, 2.43, 0.77);
  lidHighlight.scale.set(0.25, 0.8, 0.12);
  lidHighlight.rotation.z = -0.48;
  lidHighlight.renderOrder = 4;
  tea.add(lidHighlight);

  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(1.6, 64),
    new THREE.MeshBasicMaterial({
      color: 0x9d5871,
      transparent: true,
      opacity: 0.13,
      depthWrite: false
    })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.set(0, -2.545, 0.08);
  shadow.scale.set(1, 0.5, 1);
  scene.add(shadow);

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const elapsed = clock.getElapsedTime();
    tea.position.y = Math.sin(elapsed * 1.35) * 0.035;
    face.children[0].scale.y = 1 - Math.max(0, Math.sin(elapsed * 0.72 - 1.3)) ** 28 * 0.82;
    face.children[1].scale.y = 1 - Math.max(0, Math.sin(elapsed * 0.72 - 1.3)) ** 28 * 0.82;

    controls.update();
    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  });
</script>
</body>
</html>
