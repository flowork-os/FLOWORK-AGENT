<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Glazed Ceramic Vase — procedural three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #191a1d; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    color: #8f959c; font: 12px/1.5 system-ui, -apple-system, sans-serif;
    letter-spacing: .03em; user-select: none; pointer-events: none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hint">glazed stoneware vase &mdash; drag to orbit &middot; scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------- helpers ----------
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (t) => t * t * (3 - 2 * t);
const smoothstep = (e0, e1, x) => smooth(clamp((x - e0) / (e1 - e0), 0, 1));

// Periodic-in-theta streaky noise (deterministic, seam-safe: integer angular frequencies)
function streak(th, y) {
  return (
    Math.sin(th * 4.0 + 1.7 + 1.3 * Math.sin(th * 2.0 + 0.6) + y * 9.0) +
    0.55 * Math.sin(th * 9.0 + 4.2 + y * 23.0) +
    0.30 * Math.sin(th * 17.0 + 2.1 + y * 47.0)
  ) / 1.85;
}

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x191a1d);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.01, 50);
camera.position.set(0.42, 0.34, 0.55);

// Neutral procedural studio environment for glossy glaze reflections
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

// ---------- lighting: key + fill + rim (+ soft hemisphere) ----------
const hemi = new THREE.HemisphereLight(0xbfd4e2, 0x2a211c, 0.30);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff0dd, 2.6);
key.position.set(0.65, 1.05, 0.55);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.2;
key.shadow.camera.far = 3.5;
key.shadow.camera.left = -0.5;
key.shadow.camera.right = 0.5;
key.shadow.camera.top = 0.6;
key.shadow.camera.bottom = -0.2;
key.shadow.bias = -0.0003;
key.shadow.normalBias = 0.002;
scene.add(key);

const fill = new THREE.DirectionalLight(0xa9c4e0, 0.55);
fill.position.set(-0.9, 0.4, 0.35);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xd8ecff, 1.5);
rim.position.set(-0.25, 0.8, -0.85);
scene.add(rim);

// ---------- ground: shadow-catcher only ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(2.5, 64),
  new THREE.ShadowMaterial({ opacity: 0.45 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.0008;
ground.receiveShadow = true;
scene.add(ground);

// ---------- vase profile (meters — realistic ~33 cm stoneware vase) ----------
// Runs: concave base -> foot ring -> bulbous belly -> slender neck -> flared lip,
// over the rim top, then down the inside wall to an interior floor.
const ctrl = [
  [0.0004, 0.0020], // recessed base center
  [0.0280, 0.0008],
  [0.0460, 0.0000], // foot ring (contact)
  [0.0540, 0.0090], // foot bevel
  [0.0800, 0.0420],
  [0.1010, 0.0860],
  [0.1080, 0.1280], // belly max (~21.6 cm dia)
  [0.0970, 0.1720],
  [0.0700, 0.2120],
  [0.0470, 0.2420],
  [0.0360, 0.2630], // neck minimum
  [0.0340, 0.2860],
  [0.0410, 0.3040],
  [0.0560, 0.3190], // flare
  [0.0610, 0.3265], // outer lip
  [0.0575, 0.3295], // lip apex (~33 cm tall)
  [0.0525, 0.3280], // inner lip
  [0.0450, 0.3190],
  [0.0320, 0.2990],
  [0.0275, 0.2710],
  [0.0280, 0.2380],
  [0.0300, 0.2140],
  [0.0190, 0.1990],
  [0.0006, 0.1950]  // interior floor
];

const curve = new THREE.CatmullRomCurve3(
  ctrl.map((p) => new THREE.Vector3(p[0], p[1], 0)),
  false,
  'centripetal'
);
const samples = curve.getSpacedPoints(280);
const pts2 = samples.map((v) => new THREE.Vector2(Math.max(v.x, 0.0004), v.y));
const ptsCount = pts2.length;

let lipTop = -Infinity, apexIdx = 0;
pts2.forEach((p, i) => { if (p.y > lipTop) { lipTop = p.y; apexIdx = i; } });

const RADIAL = 320;
const geo = new THREE.LatheGeometry(pts2, RADIAL);

// ---------- hand-thrown imperfections + rim chips + glaze vertex colors ----------
const CHIPS = [ // angle (rad), angular half-width, depth (m)
  { a: 0.70, w: 0.15, d: 0.0075 },
  { a: 2.30, w: 0.21, d: 0.0100 },
  { a: 3.85, w: 0.11, d: 0.0050 },
  { a: 5.25, w: 0.17, d: 0.0085 }
];
const BLEND = 0.010;

// glaze palette (Color() auto-converts sRGB hex -> linear working space in r160)
const cDeep  = new THREE.Color(0x0e3f4a); // pooled dark teal-blue
const cMid   = new THREE.Color(0x2b7f78); // teal
const cLight = new THREE.Color(0x66b6a4); // thin glaze
const cBreak = new THREE.Color(0xd8e9dc); // glaze breaking pale at edges
const cClay  = new THREE.Color(0x9a7454); // exposed bisque clay
const cInner = new THREE.Color(0x123138); // dark pooled interior

const pos = geo.attributes.position;
const count = pos.count;
const colors = new Float32Array(count * 3);
const col = new THREE.Color();

for (let v = 0; v < count; v++) {
  const x = pos.getX(v), y = pos.getY(v), z = pos.getZ(v);
  const j = v % ptsCount;                       // profile index (lathe vertex order: i*ptsCount + j)
  const inner = j > apexIdx;
  const tInner = inner ? (j - apexIdx) / (ptsCount - 1 - apexIdx) : 0;

  const r0 = Math.hypot(x, z);
  const th = Math.atan2(z, x);

  // --- rim chips: notch depth at this angle ---
  let c = 0;
  for (const ch of CHIPS) {
    let ad = Math.abs(th - ch.a);
    ad = Math.min(ad, Math.PI * 2 - ad);
    const w = ch.w * (1 + 0.22 * Math.sin(th * 29.0 + ch.a * 13.0)); // ragged outline
    const s = 1 - ad / w;
    if (s > 0) c = Math.max(c, ch.d * smooth(clamp(s, 0, 1)));
  }
  let yNew = y, chipMix = 0;
  if (c > 1e-5) {
    const zone = lipTop - c - BLEND;
    if (y > zone) {
      yNew = zone + (y - zone) * (BLEND / (BLEND + c)); // compress rim down into the notch
      chipMix = smooth(clamp((y - zone) / (lipTop - zone), 0, 1)) * clamp(c / 0.004, 0, 1);
    }
  }

  // --- hand-thrown radius modulation ---
  const hN = clamp(y / lipTop, 0, 1);
  const strk = streak(th, y);
  const rMul = 1 + 0.009 * Math.cos(2 * th + 0.8) * (0.35 + 0.65 * hN); // slightly out-of-round
  let rAdd =
    (0.00080 * Math.sin(y * 225 + 1.0) +   // fine throwing rings
     0.00045 * Math.sin(y * 455 + 2.6) +
     0.00160 * Math.sin(y * 27 + 2.2) +    // broad undulation
     0.00060 * strk) * clamp(r0 / 0.02, 0, 1);
  rAdd += chipMix * 0.0013 * Math.sin(th * 77 + y * 310); // rough fracture face
  const r1 = Math.max(0.0004, r0 * rMul + rAdd);

  // gentle axis wobble + slight lean (subtle profile asymmetry)
  const dx = 0.0032 * Math.sin(y * 10.5 + 0.7) + y * 0.007;
  const dz = 0.0032 * Math.sin(y * 7.9 + 2.4);

  pos.setXYZ(v, Math.cos(th) * r1 + dx, yNew, Math.sin(th) * r1 + dz);

  // --- glaze coloring ---
  const n = 0.5 + 0.5 * strk;
  const t = clamp(hN * 1.02 + (n - 0.5) * 0.35, 0, 1); // pools dark low, thins high, streaky drips
  if (t < 0.55) col.lerpColors(cDeep, cMid, t / 0.55);
  else col.lerpColors(cMid, cLight, (t - 0.55) / 0.45);

  const lb = smoothstep(lipTop - 0.030, lipTop - 0.004, yNew) * (0.35 + 0.65 * n);
  col.lerp(cBreak, lb * 0.65);                                  // glaze breaks pale over the lip
  if (inner) col.lerp(cInner, clamp(tInner * 1.6, 0, 0.85));    // dark pooled interior
  col.lerp(cClay, 1 - smoothstep(0.0035, 0.010, yNew));         // unglazed clay foot ring
  col.lerp(cClay, chipMix);                                     // chips expose clay body
  if (chipMix > 0) col.multiplyScalar(1 - 0.18 * chipMix * (0.5 + 0.5 * Math.sin(th * 57 + y * 400)));

  colors[v * 3] = col.r;
  colors[v * 3 + 1] = col.g;
  colors[v * 3 + 2] = col.b;
}

geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geo.deleteAttribute('uv');
geo.deleteAttribute('normal');
const vaseGeo = mergeVertices(geo, 1e-4); // weld the lathe seam so shading is continuous
vaseGeo.computeVertexNormals();

const glaze = new THREE.MeshPhysicalMaterial({
  vertexColors: true,
  roughness: 0.17,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.10,
  envMapIntensity: 0.55
});

const vase = new THREE.Mesh(vaseGeo, glaze);
vase.castShadow = true;
vase.receiveShadow = true;
scene.add(vase);

// ---------- controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.16, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.enablePan = false;
controls.minDistance = 0.22;
controls.maxDistance = 1.8;
controls.maxPolarAngle = 1.48;
controls.update();

// ---------- resize + loop ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
