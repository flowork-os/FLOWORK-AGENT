<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stained Glass Anglerfish</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0d12; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: 12px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: rgba(220, 228, 240, 0.45); letter-spacing: 0.08em; text-transform: uppercase;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="hint">Stained Glass Anglerfish &nbsp;·&nbsp; drag to orbit &nbsp;·&nbsp; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d12);
scene.fog = new THREE.FogExp2(0x0b0d12, 0.018);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(6.2, 2.6, 7.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 4.0;
controls.maxDistance = 24.0;
controls.target.set(0, 0.35, 0);
controls.maxPolarAngle = Math.PI * 0.92;

/* ============================================================
   LIGHTING
   ============================================================ */
const hemi = new THREE.HemisphereLight(0x6f8fd0, 0x14161d, 0.55);
scene.add(hemi);

// KEY: strong light behind/above so it passes THROUGH the glass panes
const key = new THREE.DirectionalLight(0xfff0d8, 3.1);
key.position.set(-7.5, 9.0, -5.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 40;
key.shadow.camera.left = -9;
key.shadow.camera.right = 9;
key.shadow.camera.top = 9;
key.shadow.camera.bottom = -9;
key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.02;
key.shadow.radius = 3;
scene.add(key);

// FILL: cool ocean bounce
const fill = new THREE.DirectionalLight(0x5fa8d8, 0.85);
fill.position.set(6.5, 2.0, 6.0);
scene.add(fill);

// RIM: violet edge separation
const rim = new THREE.DirectionalLight(0xb07cff, 1.05);
rim.position.set(2.0, -1.5, -8.0);
scene.add(rim);

/* ============================================================
   GROUND (shadow-only)
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(26, 96).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.position.y = -3.05;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   MATERIALS — leaded stained glass
   ============================================================ */
const GLASS = {
  midnight : 0x16307e,
  midnight2: 0x0e1f5c,
  teal     : 0x0f8e94,
  teal2    : 0x12b0a6,
  violet   : 0x6a2fb0,
  violet3  : 0x4a1f8c,
  amber    : 0xffab2e,
  frost    : 0xdfe9f2,
  indigo   : 0x2a3fa0
};

function glassMat(color, opts = {}) {
  return new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(color),
    metalness: 0.0,
    roughness: opts.roughness !== undefined ? opts.roughness : 0.22,
    transmission: opts.transmission !== undefined ? opts.transmission : 0.72,
    thickness: opts.thickness !== undefined ? opts.thickness : 0.55,
    ior: 1.52,
    clearcoat: 0.85,
    clearcoatRoughness: 0.16,
    transparent: true,
    opacity: opts.opacity !== undefined ? opts.opacity : 1.0,
    side: THREE.DoubleSide,
    emissive: new THREE.Color(opts.emissive !== undefined ? opts.emissive : color),
    emissiveIntensity: opts.emissiveIntensity !== undefined ? opts.emissiveIntensity : 0.16,
    attenuationColor: new THREE.Color(color),
    attenuationDistance: opts.attenuationDistance !== undefined ? opts.attenuationDistance : 1.2,
    flatShading: !!opts.flat
  });
}

const matMidnight  = glassMat(GLASS.midnight,  { thickness: 0.7,  emissiveIntensity: 0.18 });
const matMidnight2 = glassMat(GLASS.midnight2, { thickness: 0.8,  emissiveIntensity: 0.14 });
const matTeal      = glassMat(GLASS.teal,      { thickness: 0.6,  emissiveIntensity: 0.22 });
const matTeal2     = glassMat(GLASS.teal2,     { thickness: 0.55, emissiveIntensity: 0.26 });
const matViolet    = glassMat(GLASS.violet,    { thickness: 0.65, emissiveIntensity: 0.22 });
const matViolet3   = glassMat(GLASS.violet3,   { thickness: 0.7,  emissiveIntensity: 0.18 });
const matIndigo    = glassMat(GLASS.indigo,    { thickness: 0.65, emissiveIntensity: 0.18 });

const paneMats = [matMidnight, matTeal, matViolet, matMidnight2, matTeal2, matViolet3, matIndigo];

// Frosted white glass for teeth / fin webbing highlights
const matFrost = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color(GLASS.frost),
  roughness: 0.62,
  metalness: 0.0,
  transmission: 0.55,
  thickness: 0.28,
  ior: 1.48,
  clearcoat: 0.35,
  clearcoatRoughness: 0.5,
  transparent: true,
  opacity: 0.97,
  side: THREE.DoubleSide,
  emissive: new THREE.Color(0x9fb6cc),
  emissiveIntensity: 0.14,
  flatShading: true
});

// Amber lure glass — the lamp
const matAmberGlass = new THREE.MeshPhysicalMaterial({
  color: new THREE.Color(GLASS.amber),
  roughness: 0.16,
  metalness: 0.0,
  transmission: 0.85,
  thickness: 0.9,
  ior: 1.55,
  clearcoat: 1.0,
  clearcoatRoughness: 0.05,
  transparent: true,
  opacity: 1.0,
  side: THREE.DoubleSide,
  emissive: new THREE.Color(0xffb347),
  emissiveIntensity: 2.6,
  attenuationColor: new THREE.Color(0xff8a12),
  attenuationDistance: 0.6
});

const matAmberCore = new THREE.MeshBasicMaterial({ color: 0xfff0c2 });

const matAmberHalo = new THREE.MeshBasicMaterial({
  color: 0xffa834,
  transparent: true,
  opacity: 0.20,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  depthWrite: false
});

// Dark pewter came (lead lines)
const matCame = new THREE.MeshStandardMaterial({
  color: 0x2b2f38,
  metalness: 0.86,
  roughness: 0.42,
  emissive: new THREE.Color(0x0a0c11),
  emissiveIntensity: 0.4
});

const matCameDark = new THREE.MeshStandardMaterial({
  color: 0x1e222a,
  metalness: 0.9,
  roughness: 0.5
});

const matEyeGlass = new THREE.MeshPhysicalMaterial({
  color: 0xffd98a,
  roughness: 0.1,
  transmission: 0.6,
  thickness: 0.3,
  ior: 1.5,
  transparent: true,
  clearcoat: 1.0,
  emissive: new THREE.Color(0xffc65a),
  emissiveIntensity: 1.1,
  side: THREE.DoubleSide
});

const matPupil = new THREE.MeshStandardMaterial({ color: 0x0a0a10, roughness: 0.25, metalness: 0.3 });

/* ============================================================
   HELPERS
   ============================================================ */
const TMP_V = new THREE.Vector3();

/** Lead came along an arbitrary 3D curve. */
function cameTube(points, radius, mat = matCame, closed = false, tubularSeg = null) {
  const curve = new THREE.CatmullRomCurve3(points, closed, 'centripetal', 0.5);
  const seg = tubularSeg || Math.max(24, Math.min(220, Math.floor(points.length * 12)));
  const geo = new THREE.TubeGeometry(curve, seg, radius, 7, closed);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

/** Straight-ish came between two points. */
function cameSegment(a, b, radius, mat = matCame) {
  return cameTube([a.clone(), a.clone().lerp(b, 0.5), b.clone()], radius, mat, false, 12);
}

/** Small lead bead/joint. */
function cameJoint(p, r) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), matCame);
  m.position.copy(p);
  m.castShadow = true;
  return m;
}

/**
 * Body profile: bulbous deep-sea anglerfish silhouette.
 * t in [0,1] runs snout(0) -> tail(1). Returns radius scale.
 */
function bodyRadius(t) {
  // Big round belly forward, tapering hard to a thin caudal peduncle.
  const bulb = Math.pow(Math.sin(Math.PI * Math.pow(t, 0.62)), 0.78);
  const taper = 1.0 - 0.72 * Math.pow(Math.max(0, t - 0.55) / 0.45, 1.6);
  return Math.max(0.06, bulb * taper);
}

/** Centerline of the body along +X (snout at +x, tail at -x). */
function bodyCenter(t) {
  const x = 1.72 - 3.5 * t;
  const y = 0.10 + 0.30 * Math.sin(Math.PI * t * 0.9) - 0.22 * t * t;
  return new THREE.Vector3(x, y, 0);
}

/**
 * Build the anglerfish body as an explicit pane grid so each quad can
 * be an individual piece of colored glass with lead between.
 */
function bodyPoint(u, v) {
  // u: 0..1 along body, v: 0..1 around girth (0 = belly bottom, 0.5 = top)
  const c = bodyCenter(u);
  const r = bodyRadius(u);
  const ang = v * Math.PI * 2.0 - Math.PI / 2.0; // start at bottom
  const R = 1.16 * r;

  // vertical/lateral proportions: tall deep body, moderately laterally full
  let ry = R * 1.26;
  let rz = R * 0.90;

  // Flatten toward the tail into a fin-like peduncle
  const tailK = THREE.MathUtils.smoothstep(u, 0.72, 1.0);
  rz *= (1.0 - 0.55 * tailK);
  ry *= (1.0 + 0.15 * tailK);

  // Bulge the lower jaw / belly region
  const s = Math.sin(ang), cs = Math.cos(ang);
  const bellyBias = (s < 0 ? 1.0 : 0.0) * 0.16 * Math.pow(1.0 - u, 1.1);

  const y = c.y + s * ry * (1.0 + bellyBias);
  const z = cs * rz;

  // slight forward slump of the head mass
  const x = c.x + 0.12 * Math.pow(1.0 - u, 2.0) * s;

  return new THREE.Vector3(x, y, z);
}

/* ============================================================
   ROOT OBJECT
   ============================================================ */
const anglerfish = new THREE.Group();
scene.add(anglerfish);

const bodyGroup = new THREE.Group();
anglerfish.add(bodyGroup);

/* ---------- 1. GLASS PANES OF THE BODY ---------- */
const U_SEG = 16;  // panes along the body
const V_SEG = 14;  // panes around the girth
const GAP = 0.055; // pane inset so lead shows between them

// deterministic pseudo random
let seedState = 20260720;
function rnd() {
  seedState = (seedState * 1664525 + 1013904223) % 4294967296;
  return seedState / 4294967296;
}

function paneColorIndex(i, j) {
  // Bands of color: midnight along the back, teal mid-flank, violet belly,
  // with a bit of stochastic variation like real leaded glass.
  const vNorm = j / V_SEG;              // 0 bottom .. 0.5 top .. 1 bottom
  const topness = Math.abs(vNorm - 0.5) * 2.0; // 1 at belly, 0 at back... invert
  const backness = 1.0 - topness;       // 1 near top/back
  const r = rnd();
  if (backness > 0.62) return (r < 0.72) ? 0 : (r < 0.9 ? 3 : 6);       // midnight blues
  if (backness > 0.33) return (r < 0.55) ? 1 : (r < 0.8 ? 4 : 6);       // teals
  if (backness > 0.14) return (r < 0.5) ? 2 : (r < 0.8 ? 5 : 1);        // violets/teal
  return (r < 0.6) ? 5 : 2;                                             // deep violets on belly
}

const paneGroup = new THREE.Group();
bodyGroup.add(paneGroup);

// Batch panes per material for efficiency
const paneBuffers = paneMats.map(() => ({ pos: [], norm: [] }));

function pushTri(buf, a, b, c) {
  const n = new THREE.Vector3()
    .subVectors(b, a)
    .cross(new THREE.Vector3().subVectors(c, a));
  if (n.lengthSq() < 1e-14) return;
  n.normalize();
  buf.pos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
  buf.norm.push(n.x, n.y, n.z, n.x, n.y, n.z, n.x, n.y, n.z);
}

for (let i = 0; i < U_SEG; i++) {
  const u0 = i / U_SEG, u1 = (i + 1) / U_SEG;
  for (let j = 0; j < V_SEG; j++) {
    const v0 = j / V_SEG, v1 = (j + 1) / V_SEG;

    // inset the quad in parameter space so lead lines are visible
    const du = (u1 - u0) * GAP, dv = (v1 - v0) * GAP;
    const a0 = u0 + du, a1 = u1 - du, b0 = v0 + dv, b1 = v1 - dv;

    const p00 = bodyPoint(a0, b0);
    const p10 = bodyPoint(a1, b0);
    const p11 = bodyPoint(a1, b1);
    const p01 = bodyPoint(a0, b1);

    // slight outward puff so each pane reads as a domed piece of glass
    const cen = new THREE.Vector3().add(p00).add(p10).add(p11).add(p01).multiplyScalar(0.25);
    const axis = bodyCenter((a0 + a1) * 0.5);
    const outward = new THREE.Vector3().subVectors(cen, axis);
    if (outward.lengthSq() > 1e-10) outward.normalize(); else outward.set(0, 1, 0);
    const dome = cen.clone().addScaledVector(outward, 0.028);

    const buf = paneBuffers[paneColorIndex(i, j)];
    pushTri(buf, p00, p10, dome);
    pushTri(buf, p10, p11, dome);
    pushTri(buf, p11, p01, dome);
    pushTri(buf, p01, p00, dome);
  }
}

paneBuffers.forEach((buf, k) => {
  if (buf.pos.length === 0) return;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(buf.pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(buf.norm, 3));
  const m = new THREE.Mesh(g, paneMats[k]);
  m.castShadow = true;
  m.receiveShadow = true;
  paneGroup.add(m);
});

// Inner dark shell so the fish reads solid from behind the glass
{
  const innerPts = [];
  const innerBuf = { pos: [], norm: [] };
  for (let i = 0; i < U_SEG; i++) {
    const u0 = i / U_SEG, u1 = (i + 1) / U_SEG;
    for (let j = 0; j < V_SEG; j++) {
      const v0 = j / V_SEG, v1 = (j + 1) / V_SEG;
      const s = 0.90;
      const q = (u, v) => {
        const p = bodyPoint(u, v);
        const c = bodyCenter(u);
        return c.clone().addScaledVector(new THREE.Vector3().subVectors(p, c), s);
      };
      const p00 = q(u0, v0), p10 = q(u1, v0), p11 = q(u1, v1), p01 = q(u0, v1);
      pushTri(innerBuf, p00, p11, p10);
      pushTri(innerBuf, p00, p01, p11);
    }
  }
  innerPts.length = 0;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(innerBuf.pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(innerBuf.norm, 3));
  const innerMat = new THREE.MeshStandardMaterial({
    color: 0x0a1330, roughness: 0.85, metalness: 0.15,
    emissive: new THREE.Color(0x0a1b3a), emissiveIntensity: 0.35,
    side: THREE.FrontSide
  });
  const inner = new THREE.Mesh(g, innerMat);
  inner.castShadow = true;
  inner.receiveShadow = true;
  bodyGroup.add(inner);
}

/* ---------- 2. LEAD CAMES OVER THE BODY ---------- */
const cameGroup = new THREE.Group();
bodyGroup.add(cameGroup);

// Rings around the girth
for (let i = 1; i < U_SEG; i++) {
  const u = i / U_SEG;
  const pts = [];
  const N = 40;
  for (let k = 0; k < N; k++) pts.push(bodyPoint(u, k / N));
  const rad = 0.020 + 0.010 * (1.0 - u);
  cameGroup.add(cameTube(pts, rad, matCame, true, 100));
}

// Longitudinal cames
for (let j = 0; j < V_SEG; j++) {
  const v = j / V_SEG;
  const pts = [];
  const N = 34;
  for (let k = 0; k <= N; k++) pts.push(bodyPoint(k / N, v));
  cameGroup.add(cameTube(pts, 0.019, matCame, false, 110));
}

// Heavy outline came along the dorsal ridge and belly keel
{
  const dorsal = [], belly = [];
  for (let k = 0; k <= 40; k++) {
    dorsal.push(bodyPoint(k / 40, 0.25));
    belly.push(bodyPoint(k / 40, 0.75));
  }
  cameGroup.add(cameTube(dorsal, 0.032, matCameDark, false, 130));
  cameGroup.add(cameTube(belly, 0.032, matCameDark, false, 130));
}

/* ============================================================
   HEAD DETAILS: MOUTH, JAW, TEETH
   ============================================================ */
const headGroup = new THREE.Group();
anglerfish.add(headGroup);

// mouth line runs across the front of the head
const MOUTH_X = 1.60;
function jawCurve(side /* +1 upper, -1 lower */, t) {
  // t: 0 = center front, 1 = corner of mouth (toward tail)
  const x = MOUTH_X - 1.05 * t * t - 0.16 * t;
  const z = Math.sin(t * Math.PI * 0.5) * 0.62 * (1.0);
  const gape = side > 0
    ? 0.20 + 0.30 * (1 - t)         // upper jaw lifts
    : -0.44 - 0.46 * (1 - t) * (1 - t); // lower jaw drops (big underslung maw)
  const y = 0.06 + gape * (0.55 + 0.45 * (1 - t));
  return new THREE.Vector3(x, y, z);
}

function buildJaw(side) {
  const g = new THREE.Group();
  const N = 16;

  for (const sgn of [1, -1]) {
    const pts = [];
    for (let k = 0; k <= N; k++) {
      const p = jawCurve(side, k / N);
      p.z *= sgn;
      pts.push(p);
    }
    // jaw came (thick, dark)
    g.add(cameTube(pts, side > 0 ? 0.055 : 0.062, matCameDark, false, 90));

    // Teeth: frosted white glass shards
    const teethCount = 9;
    for (let k = 0; k < teethCount; k++) {
      const t = 0.035 + (k / (teethCount - 1)) * 0.9;
      const base = jawCurve(side, t);
      base.z *= sgn;
      const nxt = jawCurve(side, Math.min(1, t + 0.02));
      nxt.z *= sgn;

      const size = (0.10 + 0.115 * Math.pow(1.0 - t, 1.15)) * (side > 0 ? 0.94 : 1.12);
      const len = size * (2.6 + 1.1 * Math.cos(k * 1.7));

      const tooth = new THREE.Mesh(
        new THREE.ConeGeometry(size * 0.44, len, 4, 1),
        matFrost
      );
      tooth.castShadow = true;
      tooth.receiveShadow = true;

      // orient tooth: upper jaw points down, lower jaw points up, tilted inward
      const dir = new THREE.Vector3(0, side > 0 ? -1 : 1, 0);
      dir.x += (side > 0 ? -0.12 : -0.05) * (1 - t);
      dir.z += -sgn * 0.22;
      dir.normalize();

      tooth.position.copy(base).addScaledVector(dir, len * 0.42);
      tooth.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      tooth.rotateY((k % 2 ? 1 : -1) * 0.35);
      g.add(tooth);

      // tiny lead collar at each tooth root
      const collar = new THREE.Mesh(new THREE.TorusGeometry(size * 0.42, 0.016, 6, 12), matCame);
      collar.position.copy(base);
      collar.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
      g.add(collar);
    }
  }
  return g;
}

headGroup.add(buildJaw(1));
headGroup.add(buildJaw(-1));

// Dark mouth cavity so teeth silhouette against blackness
{
  const cav = new THREE.Mesh(
    new THREE.SphereGeometry(0.62, 24, 18),
    new THREE.MeshStandardMaterial({ color: 0x05070d, roughness: 1.0, metalness: 0.0, side: THREE.BackSide })
  );
  cav.position.set(1.02, 0.02, 0);
  cav.scale.set(1.15, 0.72, 0.92);
  headGroup.add(cav);
}

/* ---------- Lower-jaw glass panes (violet, translucent) ---------- */
{
  const jawPaneBuf = { pos: [], norm: [] };
  const N = 10, M = 4;
  for (const sgn of [1, -1]) {
    for (let k = 0; k < N; k++) {
      for (let m = 0; m < M; m++) {
        const t0 = k / N, t1 = (k + 1) / N;
        const w0 = m / M, w1 = (m + 1) / M;
        const pt = (t, w) => {
          const jaw = jawCurve(-1, t); jaw.z *= sgn;
          const anchor = new THREE.Vector3(
            MOUTH_X - 0.30 - 1.30 * t * t,
            0.05 - 0.10 * t,
            sgn * 0.30 * Math.sin(t * Math.PI * 0.5)
          );
          return jaw.clone().lerp(anchor, w);
        };
        const inset = 0.045;
        const A = pt(t0 + inset / N, w0 + inset / M);
        const B = pt(t1 - inset / N, w0 + inset / M);
        const C = pt(t1 - inset / N, w1 - inset / M);
        const D = pt(t0 + inset / N, w1 - inset / M);
        pushTri(jawPaneBuf, A, B, C);
        pushTri(jawPaneBuf, A, C, D);
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(jawPaneBuf.pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(jawPaneBuf.norm, 3));
  const m = new THREE.Mesh(g, matViolet3);
  m.castShadow = true;
  headGroup.add(m);
}

/* ============================================================
   EYES — small amber glass roundels with lead surround
   ============================================================ */
function buildEye(sgn) {
  const g = new THREE.Group();
  const base = new THREE.Vector3(1.05, 0.62, sgn * 0.62);

  const socket = new THREE.Mesh(new THREE.TorusGeometry(0.155, 0.032, 8, 22), matCameDark);
  socket.position.copy(base);
  socket.lookAt(base.clone().add(new THREE.Vector3(0.5, 0.25, sgn * 1.0)));
  socket.castShadow = true;
  g.add(socket);

  const lens = new THREE.Mesh(new THREE.SphereGeometry(0.145, 20, 16), matEyeGlass);
  lens.position.copy(base);
  lens.scale.set(1, 1, 0.75);
  g.add(lens);

  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.072, 14, 12), matPupil);
  pupil.position.copy(base).add(new THREE.Vector3(0.055, 0.02, sgn * 0.085));
  g.add(pupil);

  return g;
}
headGroup.add(buildEye(1));
headGroup.add(buildEye(-1));

/* ============================================================
   ILLICIUM — hooked lure arm arching over the head
   ============================================================ */
const lureGroup = new THREE.Group();
anglerfish.add(lureGroup);

const lurePath = [
  new THREE.Vector3(0.55, 1.05, 0.00),
  new THREE.Vector3(0.72, 1.55, 0.02),
  new THREE.Vector3(1.05, 2.05, 0.03),
  new THREE.Vector3(1.55, 2.42, 0.03),
  new THREE.Vector3(2.12, 2.55, 0.02),
  new THREE.Vector3(2.62, 2.42, 0.00),
  new THREE.Vector3(2.92, 2.10, -0.02),
  new THREE.Vector3(2.96, 1.74, -0.03)
];
const lureCurve = new THREE.CatmullRomCurve3(lurePath, false, 'centripetal', 0.5);

// Tapered lead-clad rod
{
  const rod = new THREE.Mesh(
    new THREE.TubeGeometry(lureCurve, 140, 0.052, 10, false),
    matCameDark
  );
  rod.castShadow = true;
  rod.receiveShadow = true;
  lureGroup.add(rod);

  // decorative lead rings along the arm
  for (let k = 1; k <= 7; k++) {
    const t = k / 8;
    const p = lureCurve.getPointAt(t);
    const tg = lureCurve.getTangentAt(t);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.017, 7, 16), matCame);
    ring.position.copy(p);
    ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tg);
    ring.castShadow = true;
    lureGroup.add(ring);
  }

  // base mount where the illicium meets the skull
  const mount = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 12), matCameDark);
  mount.position.copy(lurePath[0]);
  mount.castShadow = true;
  lureGroup.add(mount);
}

/* ---------- ESCA: the amber glass bulb that glows like a lamp ---------- */
const escaAnchor = lureCurve.getPointAt(1.0);
const escaGroup = new THREE.Group();
escaGroup.position.copy(escaAnchor).add(new THREE.Vector3(0, -0.24, 0));
lureGroup.add(escaGroup);

// leaded cap
{
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.145, 0.12, 14), matCameDark);
  cap.position.set(0, 0.24, 0);

}

// amber glass bulb, faceted into panes
{
  const bulbGeo = new THREE.IcosahedronGeometry(0.31, 1);
  const bulb = new THREE.Mesh(bulbGeo, matAmberGlass);
  bulb.castShadow = false;
  escaGroup.add(bulb);

  // lead came web over the bulb (edge wireframe as thin tubes -> use torus rings)
  for (let k = 0; k < 3; k++) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.305, 0.016, 6, 30), matCame);
    ring.rotation.set(k * 1.05, k * 0.7, k * 1.9);
    escaGroup.add(ring);
  }

  // hot inner core
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.135, 18, 14), matAmberCore);
  escaGroup.add(core);

  // soft halo shells
  for (let k = 0; k < 3; k++) {
    const halo = new THREE.Mesh(
      new THREE.SphereGeometry(0.46 + k * 0.30, 20, 16),

    );

// The lamp light itself — casts warm colored light onto fins/body
const escaLight = new THREE.PointLight(0xffa22a, 9.0, 11.0, 2.0);
escaLight.position.set(0, 0, 0);
escaLight.castShadow = true;
escaLight.shadow.mapSize.set(1024, 1024);
escaLight.shadow.bias = -0.002;
escaLight.shadow.camera.near = 0.05;
escaLight.shadow.camera.far = 12;
escaGroup.add(escaLight);

/* ============================================================
   FINS — fanned pectorals + dorsal/anal/caudal, leaded panes
   ============================================================ */
function buildFan(opts) {
  const {
    rays = 7,
    radius = 1.0,
    spread = Math.PI * 0.62,
    baseAngle = 0,
    curl = 0.22,
    thickness = 0.018,
    colorSeq = [1, 4, 2, 0, 5, 3, 6],
    rayRadius = 0.026
  } = opts;

  const g = new THREE.Group();

  // Ray tips laid out in a fan in local XY plane, curling in Z
  const tips = [];
  for (let k = 0; k < rays; k++) {
    const f = rays === 1 ? 0.5 : k / (rays - 1);
    const a = baseAngle - spread * 0.5 + spread * f;
    const len = radius * (0.72 + 0.28 * Math.sin(Math.PI * f));
    tips.push(new THREE.Vector3(
      Math.cos(a) * len,
      Math.sin(a) * len,
      Math.sin(f * Math.PI) * curl
    ));
  }

  const origin = new THREE.Vector3(0, 0, 0);

  // Webbing panes between adjacent rays (2 sub-panes each for a leaded look)
  const webBufs = paneMats.map(() => ({ pos: [], norm: [] }));
  for (let k = 0; k < rays - 1; k++) {
    const A = tips[k], B = tips[k + 1];
    const SUB = 3;
    for (let s = 0; s < SUB; s++) {
      const r0 = 0.13 + (s / SUB) * 0.87;
      const r1 = 0.13 + ((s + 1) / SUB) * 0.87;
      const inset = 0.05;
      const p = (r, w) => {
        const edge = A.clone().lerp(B, w);
        const q = origin.clone().lerp(edge, r);
        // bow the membrane slightly outward
        q.z += Math.sin(Math.PI * r) * 0.05 * (1 - Math.abs(w - 0.5) * 1.4);
        return q;
      };
      const A0 = p(r0 + inset * 0.05, inset);
      const B0 = p(r1 - inset * 0.05, inset);
      const B1 = p(r1 - inset * 0.05, 1 - inset);
      const A1 = p(r0 + inset * 0.05, 1 - inset);

      const ci = colorSeq[(k * SUB + s) % colorSeq.length];
      const buf = webBufs[ci];
      pushTri(buf, A0, B0, B1);
      pushTri(buf, A0, B1, A1);

      // give thickness by duplicating offset in -Z (thin slab illusion)
      const off = new THREE.Vector3(0, 0, -thickness);
      pushTri(buf, A0.clone().add(off), B1.clone().add(off), B0.clone().add(off));
      pushTri(buf, A0.clone().add(off), A1.clone().add(off), B1.clone().add(off));
    }
  }
  webBufs.forEach((buf, ci) => {
    if (!buf.pos.length) return;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(buf.pos, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(buf.norm, 3));
    const m = new THREE.Mesh(geo, paneMats[ci]);
    m.castShadow = true;
    m.receiveShadow = true;
    g.add(m);
  });

  // Lead came rays
  for (let k = 0; k < rays; k++) {
    const T = tips[k];
    const pts = [];
    const N = 8;
    for (let s = 0; s <= N; s++) {
      const r = s / N;
      const q = origin.clone().lerp(T, r);
      q.z += Math.sin(Math.PI * r) * 0.035;
      pts.push(q);
    }
    g.add(cameTube(pts, rayRadius * (1.0 - 0.25 * (k % 2)), matCame, false, 26));
  }

  // Outer rim came following the tips
  {
    const rimPts = [];
    for (let k = 0; k < rays; k++) rimPts.push(tips[k].clone());
    if (rimPts.length >= 2) g.add(cameTube(rimPts, rayRadius * 1.15, matCameDark, false, 60));
  }

  // Arc cames across the fan (concentric)
  for (const rr of [0.42, 0.72]) {
    const arcPts = [];
    for (let k = 0; k < rays; k++) {
      const q = origin.clone().lerp(tips[k], rr);
      q.z += Math.sin(Math.PI * rr) * 0.035;
      arcPts.push(q);
    }
    if (arcPts.length >= 2) g.add(cameTube(arcPts, rayRadius * 0.72, matCame, false, 50));
  }

  // hub joint
  g.add(cameJoint(origin, rayRadius * 2.1));

  return g;
}

/* ---------- Pectoral fins (fanned, catch the colored light) ---------- */
{
  const pecL = buildFan({
    rays: 8, radius: 1.30, spread: Math.PI * 0.70, baseAngle: -0.30,
    curl: 0.26, colorSeq: [1, 4, 2, 5, 0, 6, 3, 1, 4, 2], rayRadius: 0.028
  });
  pecL.position.set(0.05, 0.02, 0.72);
  pecL.rotation.set(0.10, Math.PI * 0.42, -0.10);
  anglerfish.add(pecL);

  const pecR = buildFan({
    rays: 8, radius: 1.30, spread: Math.PI * 0.70, baseAngle: -0.30,
    curl: 0.26, colorSeq: [4, 1, 5, 2, 6, 0, 3, 4, 1, 5], rayRadius: 0.028
  });
  pecR.position.set(0.05, 0.02, -0.72);
  pecR.rotation.set(0.10, -Math.PI * 0.42, 0.10);
  pecR.scale.z = -1;
  anglerfish.add(pecR);
}

/* ---------- Pelvic fins (small, under the belly) ---------- */
{
  const pvL = buildFan({
    rays: 5, radius: 0.62, spread: Math.PI * 0.5, baseAngle: -0.9,
    curl: 0.12, colorSeq: [2, 5, 1, 4, 0], rayRadius: 0.020
  });
  pvL.position.set(0.62, -0.86, 0.40);
  pvL.rotation.set(0.5, Math.PI * 0.30, -0.5);
  anglerfish.add(pvL);

  const pvR = pvL.clone();
  pvR.position.z = -0.40;
  pvR.rotation.set(-0.5, -Math.PI * 0.30, 0.5);
  anglerfish.add(pvR);
}

/* ---------- Dorsal fin ---------- */
{
  const dorsal = buildFan({
    rays: 6, radius: 0.78, spread: Math.PI * 0.46, baseAngle: Math.PI * 0.5,
    curl: 0.06, colorSeq: [0, 3, 1, 6, 4, 2], rayRadius: 0.022
  });
  dorsal.position.set(-1.02, 0.92, 0);
  dorsal.rotation.set(0, Math.PI * 0.5, 0.28);
  anglerfish.add(dorsal);
}

/* ---------- Anal fin ---------- */
{
  const anal = buildFan({
    rays: 5, radius: 0.60, spread: Math.PI * 0.40, baseAngle: -Math.PI * 0.5,
    curl: 0.05, colorSeq: [5, 2, 1, 4, 0], rayRadius: 0.020
  });
  anal.position.set(-1.05, -0.72, 0);
  anal.rotation.set(0, Math.PI * 0.5, -0.24);
  anglerfish.add(anal);
}

/* ---------- Caudal (tail) fin ---------- */
{
  const tailAnchor = bodyCenter(1.0);
  const caudal = buildFan({
    rays: 9, radius: 1.02, spread: Math.PI * 0.78, baseAngle: Math.PI,
    curl: 0.05, colorSeq: [0, 1, 4, 2, 5, 3, 6, 1, 0], rayRadius: 0.024
  });
  caudal.position.copy(tailAnchor).add(new THREE.Vector3(0.06, 0, 0));
  caudal.rotation.set(0, 0, 0);
  anglerfish.add(caudal);
}

/* ============================================================
   LIGHT-THROUGH-GLASS: colored patches cast on the fins
   These are additive, unlit color splashes positioned in front
   of the pectoral fins, simulating light filtered through panes.
   ============================================================ */
const patchGroup = new THREE.Group();
anglerfish.add(patchGroup);

function colorPatch(color, size, opacity) {
  const geo = new THREE.CircleGeometry(size, 5);
  const mat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(color),
    transparent: true,
    opacity: opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide
  });
  return new THREE.Mesh(geo, mat);
}

const patchColors = [0x2a5cff, 0x11c9c1, 0x9b52ff, 0xffa33a, 0x1e3fb0, 0x14e0c8];
const patchDefs = [
  // pectoral-left surface patches (local-ish placements near fins)
  { p: [0.62, 0.30, 1.42], s: 0.30, o: 0.30, r: [0.08, Math.PI * 0.42, 0.5] },
  { p: [0.18, -0.42, 1.30], s: 0.24, o: 0.26, r: [0.08, Math.PI * 0.42, 1.1] },
  { p: [-0.32, 0.52, 1.18], s: 0.27, o: 0.24, r: [0.08, Math.PI * 0.42, 2.0] },
  { p: [0.30, -0.05, 1.62], s: 0.20, o: 0.28, r: [0.08, Math.PI * 0.42, 0.9] },
  { p: [-0.10, 0.18, 1.05], s: 0.22, o: 0.22, r: [0.08, Math.PI * 0.42, 2.6] },
  // pectoral-right
  { p: [0.62, 0.30, -1.42], s: 0.30, o: 0.28, r: [0.08, -Math.PI * 0.42, -0.5] },
  { p: [0.18, -0.42, -1.30], s: 0.24, o: 0.24, r: [0.08, -Math.PI * 0.42, -1.1] },
  { p: [-0.32, 0.52, -1.18], s: 0.27, o: 0.22, r: [0.08, -Math.PI * 0.42, -2.0] },
  { p: [0.30, -0.05, -1.62], s: 0.20, o: 0.26, r: [0.08, -Math.PI * 0.42, -0.9] },
  { p: [-0.10, 0.18, -1.05], s: 0.22, o: 0.20, r: [0.08, -Math.PI * 0.42, -2.6] },
  // a few on the flanks/tail
  { p: [-1.55, 0.35, 0.42], s: 0.20, o: 0.18, r: [0, 0.6, 1.2] },
  { p: [-1.55, 0.35, -0.42], s: 0.20, o: 0.18, r: [0, -0.6, -1.2] }
];

patchDefs.forEach((d, i) => {
  const m = colorPatch(patchColors[i % patchColors.length], d.s, d.o);
  m.position.set(d.p[0], d.p[1], d.p[2]);
  m.rotation.set(d.r[0], d.r[1], d.r[2]);
  patchGroup.add(m);
});

/* ============================================================
   AMBIENT MOTES — faint deep-sea particulate (single Points object,
   part of the scene atmosphere, not the fish)
   ============================================================ */
{
  const N = 380;
  const pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 4.5 + rnd() * 9.0;
    const th = rnd() * Math.PI * 2;
    const ph = Math.acos(2 * rnd() - 1);
    pos[i * 3 + 0] = r * Math.sin(ph) * Math.cos(th);
    pos[i * 3 + 1] = r * Math.cos(ph) * 0.6 + 0.5;
    pos[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({
    color: 0x8fb6d8, size: 0.035, transparent: true, opacity: 0.35,
    depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  const pts = new THREE.Points(g, m);
  scene.add(pts);
}

/* ============================================================
   FINAL FRAMING: center the whole fish on the origin
   ============================================================ */
{
  const box = new THREE.Box3().setFromObject(anglerfish);
  const center = box.getCenter(new THREE.Vector3());
  anglerfish.position.sub(center);
  anglerfish.position.y += 0.15;

  // Re-seat the ground just below the fish
  const box2 = new THREE.Box3().setFromObject(anglerfish);
  ground.position.y = box2.min.y - 0.55;
}

/* ============================================================
   ANIMATION
   ============================================================ */
let t0 = performance.now();
const escaBaseIntensity = escaLight.intensity;

function animate() {
  requestAnimationFrame(animate);
  const t = (performance.now() - t0) * 0.001;

  // gentle drifting hover
  anglerfish.rotation.z = Math.sin(t * 0.42) * 0.028;
  anglerfish.rotation.x = Math.sin(t * 0.31 + 1.1) * 0.020;

  // lure lamp flicker — like a slow breathing lamp
  const flick = 0.86 + 0.14 * Math.sin(t * 1.7) + 0.06 * Math.sin(t * 5.3 + 0.7);
  escaLight.intensity = escaBaseIntensity * flick;
  matAmberGlass.emissiveIntensity = 2.6 * flick;
  escaGroup.children.forEach((c) => {
    if (c.material && c.material.blending === THREE.AdditiveBlending) {
      c.scale.setScalar(1.0 + 0.05 * Math.sin(t * 1.7 + c.id * 0.3));
    }
  });

  // colored light patches shimmer as if light shifts through the panes
  patchGroup.children.forEach((c, i) => {
    c.material.opacity = patchDefs[i].o * (0.72 + 0.28 * Math.sin(t * 0.9 + i * 1.3));
    c.rotation.z += 0.0012 * (i % 2 ? 1 : -1);
  });

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ============================================================
   RESIZE
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
