<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Warehouse Forklift</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15191d}
canvas{display:block}
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171c21);
scene.fog = new THREE.Fog(0x171c21, 15, 34);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(6.8, 4.6, 7.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.target.set(0, 1.2, -0.3);
controls.minDistance = 4;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.47;

const hemi = new THREE.HemisphereLight(0xcbd8e3, 0x25282b, 2.0);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe4bc, 4.4);
key.position.set(-5, 9, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -8;
key.shadow.bias = -0.0004;
scene.add(key);

const rim = new THREE.DirectionalLight(0x79a9d2, 1.7);
rim.position.set(6, 4, -8);
scene.add(rim);

const mat = {
  yellow: new THREE.MeshStandardMaterial({color:0xe0a51d, roughness:0.58, metalness:0.2}),
  yellowHi: new THREE.MeshStandardMaterial({color:0xf0bd28, roughness:0.5, metalness:0.18}),
  dark: new THREE.MeshStandardMaterial({color:0x1b2227, roughness:0.7, metalness:0.5}),
  steel: new THREE.MeshStandardMaterial({color:0x69757b, roughness:0.36, metalness:0.85}),
  black: new THREE.MeshStandardMaterial({color:0x101316, roughness:0.84, metalness:0.08}),
  tire: new THREE.MeshStandardMaterial({color:0x16181a, roughness:0.96}),
  rubber: new THREE.MeshStandardMaterial({color:0x25282a, roughness:0.9}),
  seat: new THREE.MeshStandardMaterial({color:0x22292d, roughness:0.88}),
  glass: new THREE.MeshStandardMaterial({color:0x6e9baa, roughness:0.16, metalness:0.15, transparent:true, opacity:0.34}),
  red: new THREE.MeshStandardMaterial({color:0xb92d22, roughness:0.45, metalness:0.15}),
  white: new THREE.MeshStandardMaterial({color:0xe6e5db, roughness:0.65}),
  floor: new THREE.MeshStandardMaterial({color:0x3d4548, roughness:0.82, metalness:0.1})
};

function box(name, size, pos, material, bevel=0) {
  const g = new THREE.BoxGeometry(size[0],size[1],size[2]);
  const m = new THREE.Mesh(g, material);
  m.name = name;
  m.position.set(pos[0],pos[1],pos[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
function cyl(name, radius, length, pos, material, rot=[0,0,0], radial=24) {
  const g = new THREE.CylinderGeometry(radius,radius,length,radial);
  const m = new THREE.Mesh(g,material);
  m.name=name;
  m.position.set(pos[0],pos[1],pos[2]);
  m.rotation.set(rot[0],rot[1],rot[2]);
  m.castShadow=true;
  m.receiveShadow=true;
  return m;
}
function sphere(name, scale, pos, material) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(1,24,16),material);
  m.name=name;
  m.scale.set(scale[0],scale[1],scale[2]);
  m.position.set(pos[0],pos[1],pos[2]);
  m.castShadow=true;
  m.receiveShadow=true;
  return m;
}

const forklift = new THREE.Group();
forklift.position.y = 0;
scene.add(forklift);

const chassis = new THREE.Group();
forklift.add(chassis);

chassis.add(box("lower chassis",[1.92,0.42,2.65],[0,0.72,0.3],mat.yellow));
chassis.add(box("front nose",[1.72,0.47,0.72],[0,0.91,-1.13],mat.yellowHi));
chassis.add(box("rear counterweight",[1.92,1.0,0.92],[0,1.18,1.18],mat.yellow));
chassis.add(box("counterweight cap",[1.72,0.23,0.68],[0,1.76,1.2],mat.yellowHi));
chassis.add(box("engine cover",[1.55,0.55,1.05],[0,1.58,0.48],mat.yellow));
chassis.add(box("step left",[0.34,0.16,0.58],[-1.03,0.77,0.15],mat.dark));
chassis.add(box("step right",[0.34,0.16,0.58],[1.03,0.77,0.15],mat.dark));
chassis.add(box("front bumper",[1.86,0.18,0.18],[0,0.72,-1.52],mat.dark));

function wheel(x,z,r,w,front=false) {
  const wheelGroup = new THREE.Group();
  wheelGroup.position.set(x,0.52,z);
  const tire = cyl(front?"front tire":"rear steer tire",r,w,[0,0,0],mat.tire,[0,0,Math.PI/2],32);
  wheelGroup.add(tire);
  const hub = cyl("wheel hub",r*0.43,w+0.018,[0,0,0],mat.steel,[0,0,Math.PI/2],24);
  wheelGroup.add(hub);
  const cap = cyl("hub cap",r*0.18,w+0.04,[0,0,0],mat.black,[0,0,Math.PI/2],20);
  wheelGroup.add(cap);
  forklift.add(wheelGroup);
}
wheel(-1.0,-0.9,0.48,0.34,true);
wheel(1.0,-0.9,0.48,0.34,true);
wheel(-1.0,1.13,0.56,0.42,false);
wheel(1.0,1.13,0.56,0.42,false);

const operator = new THREE.Group();
operator.position.set(0,0,0.25);
forklift.add(operator);

operator.add(box("seat cushion",[0.74,0.16,0.72],[0,1.86,0.54],mat.seat));
operator.add(box("seat back",[0.72,0.82,0.15],[0,2.2,0.82],mat.seat));
operator.add(box("seat base",[0.82,0.12,0.7],[0,1.74,0.55],mat.dark));
operator.add(cyl("steering column",0.055,0.56,[-0.38,2.18,-0.17],mat.dark,[0.35,0,0],16));
operator.add(cyl("steering wheel",0.26,0.055,[-0.47,2.43,-0.31],mat.black,[Math.PI/2,0,0],28));
operator.add(cyl("wheel center",0.07,0.075,[-0.47,2.43,-0.31],mat.steel,[Math.PI/2,0,0],16));
operator.add(box("dashboard",[0.68,0.23,0.28],[-0.02,2.35,-0.26],mat.dark));
operator.add(box("instrument panel",[0.5,0.13,0.04],[-0.02,2.46,-0.39],mat.black));
operator.add(cyl("control lever",0.035,0.43,[0.42,2.24,0.05],mat.dark,[0,0,-0.2],12));
operator.add(sphere("control knob",[0.09,0.09,0.09],[0.46,2.43,0.09],mat.yellowHi));

const mast = new THREE.Group();
forklift.add(mast);
mast.position.z = -1.43;

mast.add(box("left mast rail",[0.18,3.62,0.22],[-0.72,2.35,0],mat.steel));
mast.add(box("right mast rail",[0.18,3.62,0.22],[0.72,2.35,0],mat.steel));
mast.add(box("mast inner left",[0.12,3.25,0.13],[-0.47,2.25,0.16],mat.dark));
mast.add(box("mast inner right",[0.12,3.25,0.13],[0.47,2.25,0.16],mat.dark));
mast.add(box("mast top brace",[1.62,0.18,0.28],[0,4.13,0],mat.steel));
mast.add(box("mast foot brace",[1.62,0.16,0.32],[0,0.92,0],mat.dark));
mast.add(cyl("hydraulic ram",0.09,2.85,[0,2.35,0.24],mat.steel,[0,0,0],20));
mast.add(cyl("ram piston",0.045,1.7,[0,3.18,0.27],mat.white,[0,0,0],16));
mast.add(box("left hydraulic hose",[0.045,2.75,0.045],[-0.24,2.28,0.35],mat.black));

const carriage = new THREE.Group();
forklift.add(carriage);
carriage.position.set(0,1.31,-1.69);
carriage.add(box("fork carriage",[1.74,0.22,0.16],[0,0,0],mat.dark));
carriage.add(box("carriage upper rail",[1.56,0.12,0.19],[0,0.29,0.03],mat.steel));
carriage.add(box("carriage left guide",[0.13,0.58,0.18],[-0.76,0.08,0],mat.steel));
carriage.add(box("carriage right guide",[0.13,0.58,0.18],[0.76,0.08,0],mat.steel));

const forkLeft = box("left fork",[0.19,0.14,1.82],[-0.52,1.04,-2.58],mat.steel);
const forkRight = box("right fork",[0.19,0.14,1.82],[0.52,1.04,-2.58],mat.steel);
forklift.add(forkLeft, forkRight);
forklift.add(box("left fork heel",[0.19,0.58,0.18],[-0.52,1.22,-1.74],mat.steel));
forklift.add(box("right fork heel",[0.19,0.58,0.18],[0.52,1.22,-1.74],mat.steel));
forklift.add(box("left fork tip",[0.19,0.1,0.28],[-0.52,1.03,-3.53],mat.steel));
forklift.add(box("right fork tip",[0.19,0.1,0.28],[0.52,1.03,-3.53],mat.steel));

const guard = new THREE.Group();
forklift.add(guard);
const postX = 0.78;
guard.add(box("guard front left",[0.12,2.1,0.12],[-postX,3.0,0.18],mat.dark));
guard.add(box("guard front right",[0.12,2.1,0.12],[postX,3.0,0.18],mat.dark));
guard.add(box("guard rear left",[0.12,1.86,0.12],[-postX,2.88,1.02],mat.dark));
guard.add(box("guard rear right",[0.12,1.86,0.12],[postX,2.88,1.02],mat.dark));
guard.add(box("guard roof frame",[1.75,0.13,1.02],[0,4.02,0.6],mat.dark));
guard.add(box("roof panel",[1.55,0.08,0.84],[0,4.1,0.6],mat.dark));
for (let x=-0.56; x<=0.56; x+=0.28) {
  guard.add(box("roof crossbar",[0.055,0.07,0.84],[x,4.16,0.6],mat.steel));
}
guard.add(box("rear guard crossbar",[1.58,0.12,0.12],[0,3.66,1.02],mat.dark));

const overheadLamp = new THREE.Group();
overheadLamp.position.set(0,3.96,-0.01);
overheadLamp.add(box("lamp housing",[0.38,0.15,0.13],[0,0,0],mat.black));
overheadLamp.add(box("lamp lens",[0.28,0.07,0.025],[0,-0.015,-0.07],mat.white));
guard.add(overheadLamp);

forklift.add(cyl("rear axle",0.1,2.0,[0,0.52,1.13],mat.dark,[0,0,Math.PI/2],16));

const beacon = new THREE.Group();
beacon.position.set(0.54,4.24,0.78);
beacon.add(cyl("beacon stem",0.025,0.18,[0,0,0],mat.dark));
beacon.add(cyl("warning beacon",0.1,0.13,[0,0.14,0],mat.red,[0,0,0],20));
beacon.add(new THREE.PointLight(0xff4b25,1.0,3));
guard.add(beacon);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(40,40),mat.floor);
floor.rotation.x=-Math.PI/2;
floor.position.y=0;
floor.receiveShadow=true;
scene.add(floor);

const grid = new THREE.GridHelper(40,40,0x667075,0x30383c);
grid.position.y=0.006;
grid.material.transparent=true;
grid.material.opacity=0.38;
scene.add(grid);

const warehouse = new THREE.Group();
scene.add(warehouse);
function shelf(x,z) {
  const s = new THREE.Group();
  s.position.set(x,0,z);
  s.add(box("upright",[0.12,4.3,0.12],[-1.9,2.15,0],mat.dark));
  s.add(box("upright",[0.12,4.3,0.12],[1.9,2.15,0],mat.dark));
  for(let y=0.75;y<4.1;y+=0.82) {
    s.add(box("shelf beam",[4.0,0.1,0.18],[0,y,0],mat.steel));
    s.add(box("shelf deck",[3.72,0.07,0.72],[0,y+0.08,0],mat.dark));
  }
  for(let y=0.9;y<3.7;y+=0.82) {
    s.add(box("carton",[0.72,0.5,0.48],[-1.0,y+0.28,0.02],mat.white));
    s.add(box("carton",[0.88,0.5,0.48],[0.15,y+0.28,0.02],mat.yellowHi));
    s.add(box("carton",[0.54,0.5,0.48],[1.12,y+0.28,0.02],mat.red));
  }
  return s;
}
warehouse.add(shelf(-5,-3.5));
warehouse.add(shelf(5,-3.5));
warehouse.rotation.y=0.08;

const backWall = box("back warehouse wall",[24,8,0.18],[0,4.0,-7.2],new THREE.MeshStandardMaterial({color:0x242c30,roughness:0.9}));
backWall.receiveShadow=true;
scene.add(backWall);

const ceilingLight = new THREE.Mesh(
  new THREE.BoxGeometry(5.2,0.08,0.32),
  new THREE.MeshStandardMaterial({color:0xdde8e7,emissive:0x9fb9bf,emissiveIntensity:1.8})
);
ceilingLight.position.set(0,7,-2.4);
scene.add(ceilingLight);

const area = new THREE.PointLight(0xd9f2ff,2.5,12);
area.position.set(0,6,-2.3);
scene.add(area);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  beacon.children[2].intensity = 0.45 + Math.sin(t*5)*0.35;
  controls.update();
  renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
});
</script>
</body>
</html>
