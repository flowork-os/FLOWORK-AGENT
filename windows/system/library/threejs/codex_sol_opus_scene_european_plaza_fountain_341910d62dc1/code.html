import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9d8e5);
scene.fog = new THREE.FogExp2(0xc6d7d4, 0.012);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 220);
camera.position.set(25, 19, 31);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4.2, 0);
controls.enableDamping = true;

controls.autoRotate = true;
controls.autoRotateSpeed = 0.22;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 17;
controls.maxDistance = 62;

let seed = 23791;
function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a, b) { return a + (b - a) * rand(); }

const anisotropy = renderer.capabilities.getMaxAnisotropy();

function canvasTexture(size, painter, repeatX = 1, repeatY = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  painter(x, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  t.anisotropy = anisotropy;
  return t;
}

const stuccoTex = canvasTexture(256, (x, s) => {
  x.fillStyle = '#e8c994';
  x.fillRect(0, 0, s, s);
  for (let i = 0; i < 5000; i++) {
    const v = Math.floor(range(170, 245));
    x.fillStyle = `rgba(${v},${Math.floor(v*.88)},${Math.floor(v*.67)},${range(.015,.06)})`;
    x.fillRect(rand()*s, rand()*s, range(.4,2.4), range(.4,2.4));
  }
}, 2, 2);

const stoneTex = canvasTexture(256, (x, s) => {
  x.fillStyle = '#c7b695';
  x.fillRect(0, 0, s, s);
  for (let i = 0; i < 1400; i++) {
    x.fillStyle = `rgba(80,64,47,${range(.015,.07)})`;
    x.beginPath();
    x.arc(rand()*s, rand()*s, range(.3,2.4), 0, Math.PI*2);
    x.fill();
  }
  for (let y = 32; y < s; y += 48) {
    x.strokeStyle = 'rgba(92,77,59,.18)';
    x.lineWidth = 2;
    x.beginPath(); x.moveTo(0,y); x.lineTo(s,y); x.stroke();
  }
}, 3, 2);

const cobbleTex = canvasTexture(512, (x, s) => {
  x.fillStyle = '#b9a986';
  x.fillRect(0, 0, s, s);
  const h = 28, w = 48;
  for (let row = -1; row < s/h + 1; row++) {
    const off = row % 2 ? -w/2 : 0;
    for (let col = -1; col < s/w + 1; col++) {
      const px = col*w + off, py = row*h;
      const warm = Math.floor(range(145,190));
      x.fillStyle = `rgb(${warm+18},${warm+8},${warm-12})`;
      x.strokeStyle = 'rgba(77,65,52,.32)';
      x.lineWidth = 3;
      x.beginPath();
      x.roundRect(px+2, py+2, w-4, h-4, 7);
      x.fill(); x.stroke();
      x.fillStyle = 'rgba(255,245,218,.12)';
      x.fillRect(px+7,py+5,w-14,3);
    }
  }
}, 8, 8);

const roofTex = canvasTexture(256, (x, s) => {
  x.fillStyle = '#a94f31';
  x.fillRect(0,0,s,s);
  for(let y=0;y<s;y+=22){
    for(let i=-1;i<15;i++){
      const px=i*22+(y/22%2)*11;
      x.fillStyle=`hsl(${range(8,17)},${range(42,60)}%,${range(39,52)}%)`;
      x.beginPath(); x.arc(px,y+10,11,0,Math.PI); x.lineTo(px-11,y-2); x.lineTo(px+11,y-2); x.fill();
      x.strokeStyle='rgba(75,33,20,.28)'; x.stroke();
    }
  }
}, 4, 2);

const waterTex = canvasTexture(256, (x, s) => {
  x.fillStyle='#6bbac3'; x.fillRect(0,0,s,s);
  for(let i=0;i<90;i++){
    x.strokeStyle=`rgba(235,255,244,${range(.08,.32)})`;
    x.lineWidth=range(1,3);
    x.beginPath();
    const y=rand()*s, px=rand()*s;
    x.moveTo(px,y);
    x.bezierCurveTo(px+10,y-4,px+20,y+4,px+35,y);
    x.stroke();
  }
}, 3, 3);

const matStucco = new THREE.MeshStandardMaterial({ map: stuccoTex, color: 0xf4d7a4, roughness: .86 });
const matStone = new THREE.MeshStandardMaterial({ map: stoneTex, color: 0xd5c4a5, roughness: .8 });
const matDarkStone = new THREE.MeshStandardMaterial({ color: 0x9b8768, roughness: .92 });
const matWood = new THREE.MeshStandardMaterial({ color: 0x5e3422, roughness: .72 });
const matGreen = new THREE.MeshStandardMaterial({ color: 0x315a42, roughness: .77 });
const matIron = new THREE.MeshStandardMaterial({ color: 0x25241f, roughness: .5, metalness: .55 });
const matTerracotta = new THREE.MeshStandardMaterial({ color: 0xb96743, roughness: .82 });
const matWater = new THREE.MeshPhysicalMaterial({
  map: waterTex, color: 0x65c4d2, roughness: .13, metalness: .03,
  transparent: true, opacity: .78, transmission: .12, depthWrite: false,
  side: THREE.DoubleSide
});
const matGlass = new THREE.MeshPhysicalMaterial({
  color: 0xbde8ee, roughness: .08, transparent: true, opacity: .52,
  transmission: .28, depthWrite: false
});

function mesh(geometry, material, parent = scene, shadows = true) {
  const m = new THREE.Mesh(geometry, material);
  if (shadows) { m.castShadow = true; m.receiveShadow = true; }
  parent.add(m);
  return m;
}
function box(w,h,d,mat,parent=scene,x=0,y=0,z=0) {
  const m=mesh(new THREE.BoxGeometry(w,h,d),mat,parent);
  m.position.set(x,y,z); return m;
}
function cyl(rt,rb,h,seg,mat,parent=scene,x=0,y=0,z=0) {
  const m=mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat,parent);
  m.position.set(x,y,z); return m;
}

scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe2ad, 4.2);
sun.position.set(-24, 35, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = -42;
sun.shadow.camera.right = 42;
sun.shadow.camera.top = 35;
sun.shadow.camera.bottom = -32;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 100;
sun.shadow.bias = -.00015;

warmFill.position.set(12, 9, -13);

const plaza = mesh(new THREE.CircleGeometry(42,96), new THREE.MeshStandardMaterial({

}));

const ringMat = new THREE.MeshStandardMaterial({color:0x8b765d,roughness:.9});
for(let r=10;r<36;r+=8){
  const ring=mesh(new THREE.RingGeometry(r-.1,r+.1,96),ringMat);
  ring.rotation.x=-Math.PI/2;
  ring.position.y=.018;
}

const animatedUmbrellas = [];
const animatedLeaves = [];
const clockHands = [];

function addWindow(parent,x,y,z,rotY=0, balcony=false) {
  const g=new THREE.Group();
  g.position.set(x,y,z); g.rotation.y=rotY; parent.add(g);
  box(2.15,2.85,.18,new THREE.MeshStandardMaterial({color:0x30291f,roughness:.68}),g,0,0,0);
  box(1.72,2.45,.12,new THREE.MeshStandardMaterial({
    color:0x87a9ae,roughness:.2,metalness:.08
  }),g,0,0,.12);
  box(.08,2.42,.16,matWood,g,0,0,.2);
  box(1.7,.08,.16,matWood,g,0,0,.2);
  const shutterMat=new THREE.MeshStandardMaterial({
    color: rand()>.48 ? 0x4b7259 : 0x537b85, roughness:.76
  });
  const left=box(.72,2.55,.12,shutterMat,g,-1.18,0,.08);
  const right=box(.72,2.55,.12,shutterMat,g,1.18,0,.08);
  left.rotation.y=.18; right.rotation.y=-.18;
  for(let yy=-.9;yy<1.1;yy+=.35){
    box(.58,.045,.08,matDarkStone,g,-1.18,yy,.16);
    box(.58,.045,.08,matDarkStone,g,1.18,yy,.16);
  }
  box(2.8,.22,.48,matStone,g,0,-1.55,.12);
  box(2.65,.17,.38,matStone,g,0,1.53,.08);
  if(balcony){
    box(3.6,.22,1.15,matStone,g,0,-1.55,.72);
    for(let xx=-1.55;xx<=1.55;xx+=.38){
      cyl(.045,.045,1.05,8,matIron,g,xx,-.93,1.18);
    }
    box(3.25,.08,.08,matIron,g,0,-.4,1.18);
    box(.08,.7,.08,matIron,g,-1.62,-.75,1.18);
    box(.08,.7,.08,matIron,g,1.62,-.75,1.18);
  }
}

function addArcadeFacade(x,z,width,levels,color,rotation=0) {
  const root=new THREE.Group();
  root.position.set(x,0,z);
  root.rotation.y=rotation;
  scene.add(root);
  const wallMat=matStucco.clone();
  wallMat.color.setHex(color);
  box(width,levels*4.3+3,3.5,wallMat,root,0,(levels*4.3+3)/2,-1.65);
  const columns=Math.max(4,Math.round(width/5));
  const bay=width/columns;
  for(let i=0;i<columns;i++){
    const bx=-width/2+bay*(i+.5);
    const opening=mesh(new THREE.ShapeGeometry((()=>{
      const s=new THREE.Shape();
      s.moveTo(-bay*.35,0); s.lineTo(-bay*.35,2.45);
      s.absarc(0,2.45,bay*.35,Math.PI,0,false);
      s.lineTo(bay*.35,0); s.closePath(); return s;
    })()),new THREE.MeshStandardMaterial({color:0x4b3b2e,roughness:.95}),root);
    opening.position.set(bx,.08,.115);
    opening.scale.set(1,1,1);
    box(.45,4.6,.58,matStone,root,-width/2+i*bay,2.3,.28);
    box(bay*.72,.25,.45,matStone,root,bx,.18,.34);
  }
  box(.55,4.6,.58,matStone,root,width/2,2.3,.28);
  box(width+.5,.34,.78,matStone,root,0,4.55,.18);
  for(let level=0;level<levels;level++){
    const yy=6.5+level*4.1;
    const count=Math.floor(width/4.5);
    for(let i=0;i<count;i++){
      addWindow(root,-width/2+(i+.5)*width/count,yy,.17,0,(i+level)%2===0);
    }
  }
  const roof=mesh(new THREE.CylinderGeometry(width*.57,width*.57,3.7,4,1,false),new THREE.MeshStandardMaterial({
    map:roofTex,color:0xb95c3d,roughness:.9
  }),root);
  roof.rotation.z=Math.PI/2;
  roof.rotation.y=Math.PI/4;
  roof.scale.z=.35;
  roof.position.set(0,levels*4.3+4.65,-1.6);
  return root;
}

addArcadeFacade(0,-27,34,2,0xf0c986,0);
addArcadeFacade(-25,-10,29,2,0xe9b875,Math.PI/2);
addArcadeFacade(25,-9,28,2,0xf5d49d,-Math.PI/2);

function addClockTower(x,z) {
  const g=new THREE.Group(); g.position.set(x,0,z); scene.add(g);
  box(7.4,20,6.2,new THREE.MeshStandardMaterial({map:stuccoTex,color:0xe8b974,roughness:.87}),g,0,10,0);
  for(let y=2;y<19;y+=4.1){
    box(7.9,.28,6.65,matStone,g,0,y,0);
  }
  for(const side of [-1,1]){
    box(1.25,2.7,.15,new THREE.MeshStandardMaterial({color:0x4d3426}),g,side*2.1,6,3.13);
    box(1.1,2.5,.1,matGreen,g,side*2.1,6,3.23);
  }
  const faceMat=new THREE.MeshStandardMaterial({color:0xf2e2bd,roughness:.7});
  const face=mesh(new THREE.CircleGeometry(2.1,48),faceMat,g);
  face.position.set(0,16.1,3.14);
  for(let i=0;i<12;i++){
    const a=i*Math.PI/6;
    const tick=box(i%3===0?.16:.09,i%3===0?.48:.28,.06,matIron,g,
      Math.sin(a)*1.67,16.1+Math.cos(a)*1.67,3.22);
    tick.rotation.z=-a;
  }
  const handGroup=new THREE.Group();
  handGroup.position.set(0,16.1,3.28); g.add(handGroup);
  const hour=box(.12,1.12,.08,matIron,handGroup,0,.46,0);
  const minute=box(.08,1.53,.07,matIron,handGroup,0,.65,.02);
  hour.geometry.translate(0,-.46,0);
  minute.geometry.translate(0,-.65,0);
  hour.rotation.z=-1.8;
  minute.rotation.z=.48;
  clockHands.push({hour,minute});
  cyl(.16,.16,.2,16,matIron,g,0,16.1,3.35).rotation.x=Math.PI/2;
  const roof=mesh(new THREE.ConeGeometry(5.5,6.2,4),new THREE.MeshStandardMaterial({
    map:roofTex,color:0xad5035,roughness:.86
  }),g);
  roof.position.y=23.1;
  roof.rotation.y=Math.PI/4;
  cyl(.12,.12,3,8,matIron,g,0,27,0);
  const flag=mesh(new THREE.PlaneGeometry(2.2,1),new THREE.MeshStandardMaterial({
    color:0xb43c31,side:THREE.DoubleSide
  }),g);
  flag.position.set(1.1,28,0); flag.rotation.y=Math.PI/2;
}
addClockTower(16,-24);

function addFountain() {
  const g=new THREE.Group(); g.position.y=.06; scene.add(g);
  const lower=cyl(6.1,6.45,1.05,64,matStone,g,0,.5,0);
  cyl(5.3,5.3,.24,64,matWater,g,0,1.04,0).receiveShadow=false;
  const lowerLip=mesh(new THREE.TorusGeometry(5.85,.36,16,72),matStone,g);
  lowerLip.rotation.x=Math.PI/2; lowerLip.position.y=1.06;
  cyl(1.05,1.45,4.25,32,matStone,g,0,3.05,0);
  const middle=cyl(3.75,3.45,.5,64,matStone,g,0,4.72,0);
  middle.geometry.translate(0,0,0);
  cyl(3.28,3.28,.15,64,matWater,g,0,5.02,0).receiveShadow=false;
  const middleLip=mesh(new THREE.TorusGeometry(3.55,.28,14,64),matStone,g);
  middleLip.rotation.x=Math.PI/2; middleLip.position.y=4.98;
  cyl(.65,.9,3.05,24,matStone,g,0,6.48,0);
  const top=cyl(1.72,1.48,.42,48,matStone,g,0,8.03,0);
  cyl(1.42,1.42,.12,48,matWater,g,0,8.27,0).receiveShadow=false;
  const finial=cyl(.18,.48,1.5,20,matStone,g,0,9.0,0);
  const ball=mesh(new THREE.SphereGeometry(.42,24,16),matStone,g);
  ball.position.y=9.85;
  const jetMat=new THREE.MeshPhysicalMaterial({
    color:0xcffaff,transparent:true,opacity:.62,roughness:.04,
    transmission:.35,depthWrite:false
  });
  const jets=[];
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    const curve=new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(Math.cos(a)*.2,9.95,Math.sin(a)*.2),
      new THREE.Vector3(Math.cos(a)*1.1,11.15,Math.sin(a)*1.1),
      new THREE.Vector3(Math.cos(a)*1.35,8.34,Math.sin(a)*1.35)
    );
    const tube=mesh(new THREE.TubeGeometry(curve,24,.035,6,false),jetMat,g,false);
    jets.push(tube);
  }
  for(let tier=0;tier<2;tier++){
    const radius=tier===0?3.55:5.84;
    const y=tier===0?4.86:1.0;
    const count=tier===0?22:34;
    for(let i=0;i<count;i++){
      const a=i/count*Math.PI*2;
      const drop=mesh(new THREE.SphereGeometry(.045,6,5),jetMat,g,false);
      drop.scale.set(1,range(2,5),1);
      drop.userData={a,baseY:y,speed:range(.7,1.25),phase:rand(),radius,tier};
      jets.push(drop);
    }
  }
  g.userData.jets=jets;
  return g;
}
const fountain=addFountain();

function addUmbrella(x,z,rotation=0) {
  const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=rotation; scene.add(g);
  cyl(.075,.075,4.25,10,matWood,g,0,2.1,0);
  const canopy=new THREE.Group(); canopy.position.y=4.2; g.add(canopy);
  const panels=12;
  for(let i=0;i<panels;i++){
    const a=i*Math.PI*2/panels;
    const shape=new THREE.BufferGeometry();
    const pos=new Float32Array([
      0,.48,0,
      Math.cos(a)*2.35,-.12,Math.sin(a)*2.35,
      Math.cos(a+Math.PI*2/panels)*2.35,-.12,Math.sin(a+Math.PI*2/panels)*2.35
    ]);
    shape.setAttribute('position',new THREE.BufferAttribute(pos,3));
    shape.computeVertexNormals();
    const color=i%2===0?0xf5e2ba:0xb84e3d;
    mesh(shape,new THREE.MeshStandardMaterial({
      color,side:THREE.DoubleSide,roughness:.72
    }),canopy);
  }
  const cap=mesh(new THREE.SphereGeometry(.16,14,8),matWood,canopy);
  cap.position.y=.48;
  const table=cyl(1.05,1.05,.12,32,new THREE.MeshStandardMaterial({color:0x8c5935,roughness:.75}),g,0,1.1,0);
  cyl(.11,.11,1.1,10,matIron,g,0,.55,0);
  for(let i=0;i<3;i++){
    const a=i*Math.PI*2/3+.4;
    const chair=new THREE.Group();
    chair.position.set(Math.cos(a)*1.75,0,Math.sin(a)*1.75);
    chair.rotation.y=-a+Math.PI/2; g.add(chair);
    box(.72,.1,.72,matWood,chair,0,.68,0);
    box(.72,.72,.09,matWood,chair,0,1.05,.34);
    for(const sx of [-.28,.28]){
      cyl(.035,.035,.68,8,matIron,chair,sx,.34,-.27);
      cyl(.035,.035,.68,8,matIron,chair,sx,.34,.27);
    }
  }
  animatedUmbrellas.push({canopy,phase:rand()*Math.PI*2});
}
addUmbrella(-12,7,.2);
addUmbrella(-15,1,-.3);
addUmbrella(13,8,.4);
addUmbrella(16,3,-.5);

function addOrangeTree(x,z,scale=1) {
  const g=new THREE.Group(); g.position.set(x,0,z); g.scale.setScalar(scale); scene.add(g);
  cyl(.72,.5,1.25,24,matTerracotta,g,0,.62,0);
  cyl(.54,.72,.22,24,matTerracotta,g,0,1.24,0);
  cyl(.25,.38,3.1,12,matWood,g,0,2.75,0);
  const crown=new THREE.Group(); crown.position.y=4.3; g.add(crown);
  const leafMat=new THREE.MeshStandardMaterial({color:0x477544,roughness:.85});
  for(let i=0;i<16;i++){
    const leaf=mesh(new THREE.IcosahedronGeometry(range(.55,1.1),1),leafMat,crown);
    leaf.position.set(range(-1.45,1.45),range(-.7,1.25),range(-1.45,1.45));
    leaf.scale.set(range(.8,1.3),range(.8,1.25),range(.8,1.3));
  }
  for(let i=0;i<15;i++){
    const orange=mesh(new THREE.SphereGeometry(.14,12,8),new THREE.MeshStandardMaterial({
      color:0xed7b24,roughness:.65
    }),crown);
    const a=rand()*Math.PI*2, rr=range(.7,1.5);
    orange.position.set(Math.cos(a)*rr,range(-.5,.9),Math.sin(a)*rr);
  }
  animatedLeaves.push({crown,phase:rand()*6.28});
}
[[-8,-7],[8,-7],[-20,10],[21,10],[-8,16],[8,16]].forEach((p,i)=>addOrangeTree(p[0],p[1],i>3?.85:1));

function addFlowerCart(x,z) {
  const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=-.45; scene.add(g);
  box(4.5,.85,2.15,new THREE.MeshStandardMaterial({color:0x6d9c84,roughness:.8}),g,0,1.45,0);
  box(4.75,.18,2.35,matWood,g,0,1.93,0);
  for(const sx of [-1.65,1.65]){
    const wheel=mesh(new THREE.TorusGeometry(.72,.1,10,30),matIron,g);
    wheel.position.set(sx,.75,1.12); wheel.rotation.y=Math.PI/2;
    for(let i=0;i<8;i++){
      const spoke=box(.045,1.32,.045,matIron,g,sx,.75,1.12);
      spoke.rotation.z=i*Math.PI/8;
    }
  }
  box(2.5,.1,.1,matWood,g,3.25,1.25,0);
  for(let i=0;i<8;i++){
    const pot=cyl(.3,.23,.4,12,matTerracotta,g,range(-1.8,1.8),2.18,range(-.75,.75));
    const colors=[0xe95d58,0xffd451,0xd76ea6,0xf8f0d5];
    for(let j=0;j<7;j++){
      const flower=mesh(new THREE.SphereGeometry(.12,8,6),new THREE.MeshStandardMaterial({
        color:colors[(i+j)%colors.length],roughness:.7
      }),g);
      flower.position.set(pot.position.x+range(-.28,.28),range(2.55,2.95),pot.position.z+range(-.28,.28));
    }
  }
  const awning=mesh(new THREE.BoxGeometry(4.8,.12,2.5),new THREE.MeshStandardMaterial({
    color:0xf1d3a1,roughness:.74
  }),g);
  awning.position.y=4.55;
  for(const sx of [-2.15,2.15]) cyl(.045,.045,2.7,8,matIron,g,sx,3.22,-.9);
}
addFlowerCart(-18,13);

function addBench(x,z,rot) {
  const g=new THREE.Group(); g.position.set(x,0,z); g.rotation.y=rot; scene.add(g);
  for(let i=0;i<4;i++){
    box(3.6,.12,.24,matWood,g,0,.72+i*.28,(i===3)?.18:0);
  }
  for(const sx of [-1.45,1.45]){
    box(.12,.72,.7,matIron,g,sx,.37,0);
    box(.12,1.2,.12,matIron,g,sx,1.16,.26);
  }
}
addBench(-10,-14,0);
addBench(10,-14,0);
addBench(-21,4,Math.PI/2);

function addLamp(x,z) {
  const g=new THREE.Group(); g.position.set(x,0,z); scene.add(g);
  cyl(.18,.24,.35,12,matIron,g,0,.18,0);
  cyl(.07,.11,4.25,12,matIron,g,0,2.45,0);
  box(.95,.08,.08,matIron,g,0,4.45,0);
  for(const sx of [-.42,.42]){
    const lamp=mesh(new THREE.CylinderGeometry(.27,.4,.72,6),new THREE.MeshStandardMaterial({
      color:0xf7dca5,emissive:0xffb65d,emissiveIntensity:.7,roughness:.3
    }),g);
    lamp.position.set(sx,4.18,0);
    box(.5,.1,.5,matIron,g,sx,4.57,0);
  }
}
[[-17,-9],[17,-9],[-23,15],[23,15]].forEach(p=>addLamp(...p));

const pigeons=[];
for(let i=0;i<9;i++){
  const bird=new THREE.Group();
  const body=mesh(new THREE.SphereGeometry(.14,10,7),new THREE.MeshStandardMaterial({
    color:0x6f7475,roughness:.85
  }),bird);
  body.scale.set(1.45,.8,.75);
  const wingMat=new THREE.MeshStandardMaterial({color:0x555b60,side:THREE.DoubleSide});
  const wing1=mesh(new THREE.PlaneGeometry(.32,.14),wingMat,bird);
  const wing2=wing1.clone(); bird.add(wing2);
  wing1.position.x=-.17; wing2.position.x=.17;
  wing1.rotation.z=.35; wing2.rotation.z=-.35;
  bird.position.set(range(-17,17),.18,range(-10,16));
  bird.rotation.y=rand()*Math.PI*2;
  scene.add(bird);
  pigeons.push({bird,wing1,wing2,phase:rand()*6.28,speed:range(.15,.35)});
}

const distant = new THREE.Group();
scene.add(distant);
for(let i=0;i<18;i++){
  const a=i/18*Math.PI*2;
  const r=range(48,60);
  const h=range(10,18);
  const b=box(range(5,10),h,range(5,9),new THREE.MeshStandardMaterial({
    color:new THREE.Color().setHSL(range(.07,.12),range(.25,.45),range(.58,.72)),
    roughness:1
  }),distant,Math.cos(a)*r,h/2-1,Math.sin(a)*r);
  b.rotation.y=-a+range(-.2,.2);
}

const skyDome=mesh(new THREE.SphereGeometry(100,48,24),new THREE.ShaderMaterial({
  side:THREE.BackSide,
  uniforms:{
    top:{value:new THREE.Color(0x75b9dc)},
    bottom:{value:new THREE.Color(0xf4ddbd)}
  },
  vertexShader:`varying vec3 vPos;void main(){vPos=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`uniform vec3 top;uniform vec3 bottom;varying vec3 vPos;void main(){float h=clamp(normalize(vPos).y*.72+.28,0.,1.);gl_FragColor=vec4(mix(bottom,top,pow(h,.72)),1.);}`
}),scene,false);

const clock=new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  waterTex.offset.x=(t*.018)%1;
  waterTex.offset.y=(t*.025)%1;

  for(const j of fountain.userData.jets){
    if(j.userData.baseY!==undefined){
      const d=j.userData;
      const p=(t*d.speed+d.phase)%1;
      j.position.set(
        Math.cos(d.a)*d.radius,
        d.baseY-(d.tier===0?1.35:1.0)*p,
        Math.sin(d.a)*d.radius
      );
      const fade=Math.sin(p*Math.PI);
      j.scale.x=j.scale.z=.5+fade*.8;
      j.material.opacity=.2+fade*.55;
    }else{
      j.material.opacity=.47+Math.sin(t*4+j.id)*.16;
    }
  }

  animatedUmbrellas.forEach((u,i)=>{
    u.canopy.rotation.z=Math.sin(t*.7+u.phase)*.014;
    u.canopy.rotation.y=Math.sin(t*.22+u.phase)*.025;
  });

  animatedLeaves.forEach(l=>{
    l.crown.rotation.z=Math.sin(t*.75+l.phase)*.025;
    l.crown.rotation.x=Math.cos(t*.58+l.phase)*.012;
  });

  clockHands.forEach(c=>{
    c.minute.rotation.z=.48-t*.012;
    c.hour.rotation.z=-1.8-t*.001;
  });

  pigeons.forEach((p,i)=>{
    p.bird.rotation.y+=Math.sin(t*.35+p.phase)*.0007;
    p.bird.position.x+=Math.cos(p.bird.rotation.y)*p.speed*.003;
    p.bird.position.z-=Math.sin(p.bird.rotation.y)*p.speed*.003;
    const peck=Math.max(0,Math.sin(t*2.1+p.phase));
    p.bird.rotation.x=peck*.22;
    p.wing1.rotation.z=.35+Math.sin(t*1.7+p.phase)*.08;
    p.wing2.rotation.z=-.35-Math.sin(t*1.7+p.phase)*.08;
  });

  warmFill.intensity=17+Math.sin(t*.8)*1.5;
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
