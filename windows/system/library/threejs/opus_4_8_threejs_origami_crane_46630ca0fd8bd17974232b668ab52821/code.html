<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Origami Paper Crane</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17181c; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="app"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------------------
// Renderer
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

// ---------------------------------------------------------------------------
// Scene & Camera
// ---------------------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1c20);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.8, 1.9, 3.6);

// ---------------------------------------------------------------------------
// Lighting : hemisphere ambient + directional key + fill + rim
// ---------------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0xccd6e2, 0x3a342c, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3e2, 2.4);
key.position.set(3.5, 5.2, 3.8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 24;
key.shadow.camera.left = -3.2;
key.shadow.camera.right = 3.2;
key.shadow.camera.top = 3.2;
key.shadow.camera.bottom = -3.2;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd2ff, 0.6);
fill.position.set(-4.2, 2.0, -0.8);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.15);
rim.position.set(-2.4, 3.2, -5.0);
scene.add(rim);

// ---------------------------------------------------------------------------
// Ground plane : receives shadow only
// ---------------------------------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// ---------------------------------------------------------------------------
// Procedural origami crane
// Flat folded triangular facets built from a symmetric point set.
// ---------------------------------------------------------------------------
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// --- Body (a tent: top ridge along X=0, wide base) ---
const RN = V(0, 0.92, 0.55);   // ridge near neck (front)
const RM = V(0, 0.98, 0.00);   // ridge middle
const RT = V(0, 0.90, -0.52);  // ridge near tail (back)

const FBR = V(0.24, 0.06, 0.40);  // right base front
const MBR = V(0.28, 0.03, 0.00);  // right base mid
const BBR = V(0.24, 0.06, -0.40); // right base back
const FBL = V(-0.24, 0.06, 0.40);
const MBL = V(-0.28, 0.03, 0.00);
const BBL = V(-0.24, 0.06, -0.40);

// --- Neck / head / beak (thin blade at X=0) ---
const NBf = V(0, 0.96, 0.70);
const NUf = V(0, 1.62, 0.96);
const NUb = V(0, 1.60, 0.78);
const HT  = V(0, 1.85, 0.80);   // head top
const BK  = V(0, 1.58, 1.32);   // pointed beak, forward & slightly down

// --- Tail (thin swept blade at X=0) ---
const TB1 = V(0, 0.95, -0.50);
const TB2 = V(0, 0.86, -0.66);
const TT1 = V(0, 1.72, -1.28);
const TT2 = V(0, 1.58, -1.42);

// --- Right wing (folded into three facets) ---
const WrF   = V(0.10, 0.90, 0.50);
const WrB   = V(0.10, 0.86, -0.50);
const WrLead = V(0.80, 1.00, 0.42);
const WrMid = V(1.18, 0.72, -0.08);
const WrTip = V(1.08, 0.46, -0.78);

// Symmetric center faces (defined once)
const centerFaces = [
  // front & back caps of the body
  [RN, FBL, FBR],
  [RT, BBR, BBL],
  // underside base (what it rests on)
  [FBL, FBR, MBR],
  [FBL, MBR, MBL],
  [MBL, MBR, BBR],
  [MBL, BBR, BBL],
  // neck blade
  [RN, NBf, NUf],
  [RN, NUf, NUb],
  // head + beak
  [NUb, NUf, HT],
  [NUf, BK, HT],
  // tail blade
  [TB1, TB2, TT2],
  [TB1, TT2, TT1],
];

// Right-side faces (mirrored to make the left side)
const rightFaces = [
  // right breast
  [RN, FBR, MBR],
  [RN, MBR, RM],
  [RM, MBR, BBR],
  [RM, BBR, RT],
  // right wing (three folded facets)
  [WrF, WrLead, WrMid],
  [WrF, WrMid, WrTip],
  [WrF, WrTip, WrB],
];

const mirrorX = (v) => new THREE.Vector3(-v.x, v.y, v.z);
const mirrorFace = (f) => [mirrorX(f[0]), mirrorX(f[2]), mirrorX(f[1])];

const faces = [
  ...centerFaces,
  ...rightFaces,
  ...rightFaces.map(mirrorFace),
];

function buildGeometry(faceList) {
  const positions = [];
  for (const f of faceList) {
    for (const v of f) positions.push(v.x, v.y, v.z);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.computeVertexNormals();
  return g;
}

const craneGeo = buildGeometry(faces);

// Matte paper: off-white outer face, subtly warm colored reverse.
const paperFront = new THREE.MeshStandardMaterial({
  color: 0xf2eee2,
  roughness: 0.92,
  metalness: 0.0,
  side: THREE.FrontSide,
  flatShading: true,
});
const paperBack = new THREE.MeshStandardMaterial({
  color: 0xcf9a7e,
  roughness: 0.95,
  metalness: 0.0,
  side: THREE.BackSide,
  flatShading: true,
});

const crane = new THREE.Group();
const meshFront = new THREE.Mesh(craneGeo, paperFront);
const meshBack = new THREE.Mesh(craneGeo, paperBack);
for (const m of [meshFront, meshBack]) {
  m.castShadow = true;
  m.receiveShadow = true;
  crane.add(m);
}
crane.position.y = -0.03; // seat the folded base on the ground
scene.add(crane);

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 2.2;
controls.maxDistance = 9.0;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 0.85, -0.05);
controls.update();

// ---------------------------------------------------------------------------
// Resize
// ---------------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

// ---------------------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------------------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
