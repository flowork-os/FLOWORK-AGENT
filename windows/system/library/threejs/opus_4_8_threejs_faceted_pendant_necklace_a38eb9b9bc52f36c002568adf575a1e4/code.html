<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gem Pendant Necklace — Faceted Amethyst Teardrop</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0c10; overflow: hidden; }
  #c { display: block; width: 100vw; height: 100vh; }
  .hint {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    color: #9aa0b4; font: 12px/1.4 system-ui, sans-serif; letter-spacing: .04em;
    opacity: .55; pointer-events: none; user-select: none; text-align: center;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">Amethyst Teardrop Pendant · drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------------------
   Renderer
--------------------------------------------------------------------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* ---------------------------------------------------------------------------
   Scene & Camera
--------------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d12);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);

/* Procedural studio environment for realistic gem reflections/refraction */
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

/* ---------------------------------------------------------------------------
   Lighting: hemisphere + key/fill/rim, soft shadows
--------------------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0x9fb4e8, 0x0a0a0f, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(5.5, 9, 6.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 40;
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -8;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0xaecbff, 0.6);
fill.position.set(-6.5, 2.5, 4.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9a0, 1.3);
rim.position.set(-1.5, 3.5, -8.5);
scene.add(rim);

const sparkle = new THREE.PointLight(0xffffff, 6, 30, 2);
sparkle.position.set(0, 0.5, 5);
scene.add(sparkle);

/* ---------------------------------------------------------------------------
   Faceted-gem geometry builder
   Builds a solid of revolution from a (y, r) profile, alternating the angular
   offset of every other ring so the surface breaks into crisp facets.
   Rendered non-indexed with flatShading for a true cut-gem sparkle.
--------------------------------------------------------------------------- */
function makeFacetedGem(profile, segments) {
  const rings = profile.map((p, i) => {
    const offset = (i % 2) * (Math.PI / segments);
    const verts = [];
    for (let j = 0; j < segments; j++) {
      const a = (j / segments) * Math.PI * 2 + offset;
      verts.push(new THREE.Vector3(Math.cos(a) * p.r, p.y, Math.sin(a) * p.r));
    }
    return verts;
  });

  const pos = [];
  const tri = (a, b, c) => pos.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);

  for (let i = 0; i < rings.length - 1; i++) {
    const r0 = rings[i], r1 = rings[i + 1];
    for (let j = 0; j < segments; j++) {
      const jn = (j + 1) % segments;
      const a = r0[j], b = r0[jn], c = r1[j], d = r1[jn];
      tri(a, b, d);
      tri(a, d, c);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  geo.computeBoundingBox();
  return geo;
}

/* ---------------------------------------------------------------------------
   Materials
--------------------------------------------------------------------------- */
const amethystMat = new THREE.MeshPhysicalMaterial({
  color: 0x9b59d6,
  metalness: 0.0,
  roughness: 0.02,
  transmission: 1.0,
  ior: 2.35,
  thickness: 1.6,
  attenuationColor: new THREE.Color(0x5a1a9e),
  attenuationDistance: 0.9,
  clearcoat: 0.7,
  clearcoatRoughness: 0.08,
  specularIntensity: 1.0,
  envMapIntensity: 2.0,
  flatShading: true,
});

const clearGemMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0.0,
  roughness: 0.015,
  transmission: 1.0,
  ior: 2.2,
  thickness: 0.35,
  clearcoat: 1.0,
  clearcoatRoughness: 0.05,
  specularIntensity: 1.0,
  envMapIntensity: 2.2,
  flatShading: true,
});

const goldMat = new THREE.MeshStandardMaterial({
  color: 0xf4d27a,
  metalness: 1.0,
  roughness: 0.24,
  envMapIntensity: 1.4,
});

/* ---------------------------------------------------------------------------
   Profiles
--------------------------------------------------------------------------- */
const teardropProfile = [
  { y: -1.00, r: 0.02 },
  { y: -0.94, r: 0.30 },
  { y: -0.82, r: 0.52 },
  { y: -0.64, r: 0.68 },
  { y: -0.42, r: 0.76 },
  { y: -0.15, r: 0.75 },
  { y:  0.15, r: 0.66 },
  { y:  0.45, r: 0.52 },
  { y:  0.70, r: 0.34 },
  { y:  0.88, r: 0.16 },
  { y:  1.00, r: 0.02 },
];

const brilliantProfile = [
  { y:  0.45, r: 0.00 },
  { y:  0.42, r: 0.50 },
  { y:  0.20, r: 1.00 },
  { y:  0.02, r: 1.00 },
  { y: -0.90, r: 0.00 },
];

const bipyramidProfile = [
  { y:  1.00, r: 0.00 },
  { y:  0.55, r: 0.60 },
  { y:  0.00, r: 1.00 },
  { y: -0.55, r: 0.60 },
  { y: -1.00, r: 0.00 },
];

const gemGeo   = makeFacetedGem(teardropProfile, 12);
const haloGeo  = makeFacetedGem(brilliantProfile, 8);
const linkGeo  = makeFacetedGem(bipyramidProfile, 6);

/* ---------------------------------------------------------------------------
   Assemble the necklace
--------------------------------------------------------------------------- */
const necklace = new THREE.Group();

/* ---- Pendant subgroup (teardrop amethyst + bezel frame + halo + bail) ---- */
const pendant = new THREE.Group();
const GEM_SCALE = 0.8;

/* Center stone */
const stone = new THREE.Mesh(gemGeo, amethystMat);
stone.scale.setScalar(GEM_SCALE);
stone.castShadow = true;
pendant.add(stone);

/* Silhouette curve (teardrop outline, scaled & slightly expanded) for the
   metal bezel frame and to seat the halo gems around it. */
const silhouette = [];
for (let i = 0; i < teardropProfile.length; i++) {
  const p = teardropProfile[i];
  silhouette.push(new THREE.Vector3(p.r * GEM_SCALE, p.y * GEM_SCALE, 0));
}
for (let i = teardropProfile.length - 1; i >= 0; i--) {
  const p = teardropProfile[i];
  silhouette.push(new THREE.Vector3(-p.r * GEM_SCALE, p.y * GEM_SCALE, 0));
}
/* push each point radially outward a touch to sit just outside the stone */
const framePts = silhouette.map(v => {
  const out = v.length() > 1e-4 ? v.clone().normalize() : new THREE.Vector3(0, 1, 0);
  return v.clone().addScaledVector(out, 0.06);
});

const frameCurve = new THREE.CatmullRomCurve3(framePts, true, 'catmullrom', 0.2);
const frameGeo = new THREE.TubeGeometry(frameCurve, 220, 0.045, 10, true);
const frame = new THREE.Mesh(frameGeo, goldMat);
frame.castShadow = true;
pendant.add(frame);

/* Halo of tiny brilliant-cut clear gems ringing the setting */
const HALO_N = 30;
const haloPts = frameCurve.getSpacedPoints(HALO_N);
const yUp = new THREE.Vector3(0, 1, 0);
for (let i = 0; i < HALO_N; i++) {
  const P = haloPts[i];
  const outward = P.length() > 1e-4 ? P.clone().normalize() : new THREE.Vector3(0, 1, 0);
  const g = new THREE.Mesh(haloGeo, clearGemMat);
  g.scale.setScalar(0.088);
  g.position.copy(P).addScaledVector(outward, 0.03);
  g.position.z += 0.02;
  g.quaternion.setFromUnitVectors(yUp, outward);
  g.castShadow = true;
  pendant.add(g);
}

/* Bail (loop) at the pointed top of the teardrop */
const bail = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.042, 14, 30), goldMat);
bail.position.set(0, 1.0 * GEM_SCALE + 0.13, 0);
bail.castShadow = true;
pendant.add(bail);

/* ---- Chain: an oval string of miniature cut jewels ---------------------- */
const chain = new THREE.Group();
const AX = 2.4, AY = 2.6, CY = 0.7;     // ellipse radii + vertical center
const LINKS = 64;
for (let i = 0; i < LINKS; i++) {
  const a = (i / LINKS) * Math.PI * 2;
  const x = AX * Math.cos(a);
  const y = CY + AY * Math.sin(a);
  const tangent = new THREE.Vector3(-AX * Math.sin(a), AY * Math.cos(a), 0).normalize();

  const link = new THREE.Mesh(linkGeo, clearGemMat);
  link.position.set(x, y, 0);
  link.scale.set(0.072, 0.108, 0.072);
  const q = new THREE.Quaternion().setFromUnitVectors(yUp, tangent);
  if (i % 2 === 1) {
    q.multiply(new THREE.Quaternion().setFromAxisAngle(yUp, Math.PI / 2));
  }
  link.quaternion.copy(q);
  link.castShadow = true;
  chain.add(link);
}
necklace.add(chain);

/* Attach pendant to the bottom of the chain loop */
const attachY = CY - AY;                 // bottom of the ellipse
pendant.position.set(0, attachY - (1.0 * GEM_SCALE + 0.13 + 0.13), 0);
necklace.add(pendant);

/* Gentle forward tilt for depth as it auto-rotates */
necklace.rotation.x = -0.12;
scene.add(necklace);

/* Recenter the whole piece on the origin */
necklace.updateMatrixWorld(true);
let box = new THREE.Box3().setFromObject(necklace);
const center = box.getCenter(new THREE.Vector3());
necklace.position.sub(center);
necklace.updateMatrixWorld(true);
box = new THREE.Box3().setFromObject(necklace);
const size = box.getSize(new THREE.Vector3());
const maxDim = Math.max(size.x, size.y, size.z);

/* ---------------------------------------------------------------------------
   Shadow-catching ground plane
--------------------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.35 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = box.min.y - 0.15;
ground.receiveShadow = true;
scene.add(ground);

/* Aim lights at the piece */
key.target.position.set(0, 0, 0);  scene.add(key.target);
fill.target.position.set(0, 0, 0); scene.add(fill.target);
rim.target.position.set(0, 0, 0);  scene.add(rim.target);

/* ---------------------------------------------------------------------------
   Camera + Controls
--------------------------------------------------------------------------- */
camera.position.set(0, 0.8, maxDim * 1.45);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.minDistance = maxDim * 0.7;
controls.maxDistance = maxDim * 3.0;
controls.target.set(0, 0, 0);
controls.update();

/* ---------------------------------------------------------------------------
   Resize + Render loop
--------------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
