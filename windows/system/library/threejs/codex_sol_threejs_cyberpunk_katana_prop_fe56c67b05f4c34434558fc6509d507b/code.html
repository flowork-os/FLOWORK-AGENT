<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Nano Katana</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02050a;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .label {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(124, 240, 255, 0.68);
      font: 10px/1.4 monospace;
      letter-spacing: 0.22em;
      pointer-events: none;
      text-transform: uppercase;
      text-shadow: 0 0 10px #00d9ff;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">NANO-KATANA // KX-09 // NEURAL LINK ARMED</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02050a);
    scene.fog = new THREE.FogExp2(0x02050a, 0.048);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(6.8, 2.5, 9.5);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.7;
    controls.enablePan = false;
    controls.minDistance = 6.5;
    controls.maxDistance = 18;
    controls.target.set(0, 0.25, 0);

    const hemi = new THREE.HemisphereLight(0x173859, 0x080208, 1.35);
    scene.add(hemi);

    const key = new THREE.SpotLight(0x66eaff, 75, 24, Math.PI / 5, 0.55, 1.3);
    key.position.set(5, 7, 7);
    key.target.position.set(0, 0.5, 0);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.bias = -0.0002;
    scene.add(key, key.target);

    const magentaRim = new THREE.SpotLight(0xff168f, 55, 20, Math.PI / 4, 0.65, 1.4);
    magentaRim.position.set(-6, 2, -4);
    magentaRim.target.position.set(0, 0.4, 0);
    scene.add(magentaRim, magentaRim.target);

    const cyanFill = new THREE.PointLight(0x00d9ff, 18, 8, 2);
    cyanFill.position.set(1.8, 2.6, 1.4);
    scene.add(cyanFill);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({
        color: 0x04070c,
        roughness: 0.72,
        metalness: 0.32
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -3.05;
    floor.receiveShadow = true;
    scene.add(floor);

    const floorGlow = new THREE.Mesh(
      new THREE.RingGeometry(1.7, 3.3, 64),
      new THREE.MeshBasicMaterial({
        color: 0x0099bb,
        transparent: true,
        opacity: 0.065,
        side: THREE.DoubleSide,
        depthWrite: false
      })
    );
    floorGlow.rotation.x = -Math.PI / 2;
    floorGlow.position.y = -3.035;
    scene.add(floorGlow);

    const katana = new THREE.Group();
    katana.position.set(0, -1.62, 0);
    katana.rotation.z = -0.22;
    katana.rotation.x = 0.035;
    scene.add(katana);

    const matteBlack = new THREE.MeshStandardMaterial({
      color: 0x080d12,
      roughness: 0.61,
      metalness: 0.62
    });

    const exposedCarbon = new THREE.MeshStandardMaterial({
      color: 0x11171c,
      roughness: 0.42,
      metalness: 0.72
    });

    const cyanCircuit = new THREE.MeshStandardMaterial({
      color: 0x4ff6ff,
      emissive: 0x00cfea,
      emissiveIntensity: 5.2,
      roughness: 0.25,
      metalness: 0.35
    });

    const steel = new THREE.MeshStandardMaterial({
      color: 0x505762,
      roughness: 0.3,
      metalness: 0.92
    });

    const darkSteel = new THREE.MeshStandardMaterial({
      color: 0x171c23,
      roughness: 0.4,
      metalness: 0.88
    });

    const oxblood = new THREE.MeshStandardMaterial({
      color: 0x54131c,
      roughness: 0.76,
      metalness: 0.08
    });

    const magentaLED = new THREE.MeshStandardMaterial({
      color: 0xff82c6,
      emissive: 0xff007f,
      emissiveIntensity: 7,
      roughness: 0.18,
      metalness: 0.2
    });

    function bladeCenter(s) {
      return 0.31 * s * s;
    }

    function bladeWidth(s) {
      if (s < 0.82) return 0.48 - 0.045 * s;
      const t = (s - 0.82) / 0.18;
      return THREE.MathUtils.lerp(0.443, 0.055, t);
    }

    function createBladeVolume(edgeOnly = false) {
      const segments = 52;
      const length = 5.35;
      const baseY = 0.43;
      const thickness = edgeOnly ? 0.074 : 0.062;
      const positions = [];
      const indices = [];

      for (let i = 0; i <= segments; i++) {
        const s = i / segments;
        const center = bladeCenter(s);
        const width = bladeWidth(s);
        const left = center - width * 0.5;
        const right = center + width * 0.5;
        const inner = edgeOnly ? right - Math.min(0.052, width * 0.42) : left;
        const y = baseY + length * s;
        const z = thickness * 0.5;

        positions.push(
          inner, y, z,
          right, y, z,
          inner, y, -z,
          right, y, -z
        );
      }

      for (let i = 0; i < segments; i++) {
        const a = i * 4;
        const b = (i + 1) * 4;

        indices.push(
          a, b + 1, a + 1, a, b, b + 1,
          a + 2, a + 3, b + 3, a + 2, b + 3, b + 2,
          a, a + 2, b + 2, a, b + 2, b,
          a + 1, b + 1, b + 3, a + 1, b + 3, a + 3
        );
      }

      const end = segments * 4;
      indices.push(
        0, 1, 3, 0, 3, 2,
        end, end + 3, end + 1, end, end + 2, end + 3
      );

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      geometry.computeBoundingSphere();
      return geometry;
    }

    const blade = new THREE.Mesh(createBladeVolume(false), matteBlack);
    blade.castShadow = true;
    blade.receiveShadow = true;
    katana.add(blade);

    const edge = new THREE.Mesh(createBladeVolume(true), cyanCircuit);
    edge.castShadow = true;
    katana.add(edge);

    const spinePositions = [];
    for (let i = 0; i <= 44; i++) {
      const s = i / 44;
      const x = bladeCenter(s) - bladeWidth(s) * 0.5 + 0.028;
      spinePositions.push(x, 0.43 + 5.35 * s, 0.034);
    }
    const spineGeometry = new THREE.BufferGeometry();
    spineGeometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(spinePositions, 3)
    );
    const spine = new THREE.Line(
      spineGeometry,
      new THREE.LineBasicMaterial({
        color: 0x52616d,
        transparent: true,
        opacity: 0.72
      })
    );
    katana.add(spine);

    function addCircuitPath(points, color, opacity = 1) {
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const line = new THREE.Line(
        geometry,
        new THREE.LineBasicMaterial({
          color,
          transparent: opacity < 1,
          opacity,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      line.renderOrder = 4;
      katana.add(line);
    }

    const circuitLevels = [0.14, 0.34, 0.55, 0.72];
    for (let c = 0; c < circuitLevels.length; c++) {
      const points = [];
      const s0 = circuitLevels[c];
      const s1 = Math.min(0.92, s0 + 0.16 + c * 0.018);
      const steps = 9;

      for (let i = 0; i <= steps; i++) {
        const s = THREE.MathUtils.lerp(s0, s1, i / steps);
        const center = bladeCenter(s);
        const width = bladeWidth(s);
        const offset = width * (0.04 + (c % 2) * 0.11);
        const stepped = i % 3 === 1 ? -0.026 : 0;
        points.push(
          new THREE.Vector3(
            center + offset + stepped,
            0.43 + 5.35 * s,
            0.0345
          )
        );
      }
      addCircuitPath(points, 0x16eaff, 0.92);
    }

    const nodeGeometry = new THREE.CircleGeometry(0.025, 12);
    for (let i = 0; i < 16; i++) {
      const s = 0.1 + i * 0.049;
      const width = bladeWidth(s);
      const node = new THREE.Mesh(
        nodeGeometry,
        i % 5 === 0 ? magentaLED : cyanCircuit
      );
      node.position.set(
        bladeCenter(s) + width * (i % 2 ? 0.13 : -0.03),
        0.43 + 5.35 * s,
        0.0355
      );
      katana.add(node);
    }

    const decalMaterial = new THREE.MeshBasicMaterial({
      color: 0x67f4ff,
      transparent: true,
      opacity: 0.36,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const decalA = new THREE.Mesh(
      new THREE.RingGeometry(0.085, 0.105, 6),
      decalMaterial
    );
    decalA.position.set(0.13, 3.05, 0.038);
    decalA.scale.y = 1.55;
    katana.add(decalA);

    const decalB = new THREE.Mesh(
      new THREE.PlaneGeometry(0.3, 0.018),
      decalMaterial
    );
    decalB.position.set(0.11, 3.31, 0.039);
    decalB.rotation.z = -0.08;
    katana.add(decalB);

    const microMarks = new THREE.Group();
    for (let i = 0; i < 7; i++) {
      const mark = new THREE.Mesh(
        new THREE.PlaneGeometry(0.018 + (i % 3) * 0.012, 0.006),
        decalMaterial
      );
      mark.position.set(
        0.02 + (i % 2) * 0.045,
        2.76 + i * 0.045,
        0.039
      );
      microMarks.add(mark);
    }
    katana.add(microMarks);

    const guardShape = new THREE.Shape();
    const guardPoints = 32;
    for (let i = 0; i < guardPoints; i++) {
      const a = (i / guardPoints) * Math.PI * 2;
      let radius = 0.58;
      const quadrant = ((a + Math.PI * 2) % (Math.PI / 2));
      if (quadrant < 0.13 || quadrant > Math.PI / 2 - 0.13) radius = 0.46;
      if (i % 8 === 4) radius = 0.63;
      const x = Math.cos(a) * radius;
      const y = Math.sin(a) * radius * 0.82;
      if (i === 0) guardShape.moveTo(x, y);
      else guardShape.lineTo(x, y);
    }
    guardShape.closePath();

    const guardGeometry = new THREE.ExtrudeGeometry(guardShape, {
      depth: 0.105,
      bevelEnabled: true,
      bevelSegments: 2,
      bevelSize: 0.025,
      bevelThickness: 0.025,
      curveSegments: 2
    });
    guardGeometry.translate(0, 0, -0.0525);

    const guard = new THREE.Mesh(guardGeometry, steel);
    guard.position.y = 0.28;
    guard.castShadow = true;
    katana.add(guard);

    const guardInset = new THREE.Mesh(
      new THREE.TorusGeometry(0.35, 0.035, 8, 32),
      darkSteel
    );
    guardInset.scale.y = 0.82;
    guardInset.position.set(0, 0.28, 0.085);
    katana.add(guardInset);

    const ledSocket = new THREE.Mesh(
      new THREE.CylinderGeometry(0.075, 0.075, 0.045, 16),
      darkSteel
    );
    ledSocket.rotation.x = Math.PI / 2;
    ledSocket.position.set(0.38, 0.47, 0.105);
    katana.add(ledSocket);

    const statusLed = new THREE.Mesh(
      new THREE.SphereGeometry(0.046, 18, 12),
      magentaLED
    );
    statusLed.position.set(0.38, 0.47, 0.137);
    katana.add(statusLed);

    const ledLight = new THREE.PointLight(0xff008c, 4.5, 1.6, 2);
    ledLight.position.copy(statusLed.position);
    katana.add(ledLight);

    const core = new THREE.Mesh(
      new THREE.CylinderGeometry(0.235, 0.255, 1.7, 6, 8),
      exposedCarbon
    );
    core.position.y = -0.68;
    core.rotation.y = Math.PI / 6;
    core.castShadow = true;
    katana.add(core);

    for (let i = 0; i < 12; i++) {
      const carbonBand = new THREE.Mesh(
        new THREE.CylinderGeometry(0.242, 0.242, 0.018, 6),
        new THREE.MeshStandardMaterial({
          color: i % 2 ? 0x222b31 : 0x090d10,
          roughness: 0.38,
          metalness: 0.74
        })
      );
      carbonBand.position.y = -1.43 + i * 0.135;
      carbonBand.rotation.y = Math.PI / 6;
      katana.add(carbonBand);
    }

    const wrapGeometry = new THREE.BoxGeometry(0.59, 0.15, 0.37);
    for (let i = 0; i < 11; i++) {
      const wrap = new THREE.Mesh(wrapGeometry, oxblood);
      wrap.position.y = -1.42 + i * 0.145;
      wrap.rotation.z = (i % 2 ? 0.34 : -0.34);
      wrap.rotation.y = i % 2 ? 0.045 : -0.045;
      wrap.castShadow = true;
      katana.add(wrap);
    }

    const seamMaterial = new THREE.LineBasicMaterial({
      color: 0x120306,
      transparent: true,
      opacity: 0.95
    });

    for (let i = 0; i < 14; i++) {
      const y = -1.39 + i * 0.105;
      const x = -0.18 + ((i * 37) % 9) * 0.045;
      const crackPoints = [
        new THREE.Vector3(x, y, 0.192),
        new THREE.Vector3(x + 0.025, y + 0.018, 0.194),
        new THREE.Vector3(x + 0.006, y + 0.043, 0.194),
        new THREE.Vector3(x + 0.034, y + 0.061, 0.193)
      ];
      const crackGeometry = new THREE.BufferGeometry().setFromPoints(crackPoints);
      katana.add(new THREE.Line(crackGeometry, seamMaterial));
    }

    const collar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.29, 0.275, 0.2, 8),
      darkSteel
    );
    collar.position.y = 0.05;
    collar.castShadow = true;
    katana.add(collar);

    const collarRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.275, 0.025, 8, 24),
      cyanCircuit
    );
    collarRing.rotation.x = Math.PI / 2;
    collarRing.position.y = 0.105;
    katana.add(collarRing);

    const pommel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.23, 0.19, 0.34, 8),
      steel
    );
    pommel.position.y = -1.7;
    pommel.castShadow = true;
    katana.add(pommel);

    const pommelCap = new THREE.Mesh(
      new THREE.CylinderGeometry(0.205, 0.16, 0.09, 8),
      darkSteel
    );
    pommelCap.position.y = -1.915;
    katana.add(pommelCap);

    const cablePoints = [];
    const coilTurns = 2.65;
    const cableSegments = 60;
    for (let i = 0; i <= cableSegments; i++) {
      const t = i / cableSegments;
      const angle = t * Math.PI * 2 * coilTurns;
      const radius = 0.28 + t * 0.025;
      cablePoints.push(
        new THREE.Vector3(
          Math.cos(angle) * radius,
          -1.68 - t * 0.49,
          Math.sin(angle) * radius
        )
      );
    }
    cablePoints.push(
      new THREE.Vector3(0.15, -2.25, 0.21),
      new THREE.Vector3(0.28, -2.39, 0.15),
      new THREE.Vector3(0.22, -2.54, 0.08)
    );

    const cableCurve = new THREE.CatmullRomCurve3(cablePoints);
    const cable = new THREE.Mesh(
      new THREE.TubeGeometry(cableCurve, 120, 0.022, 7, false),
      new THREE.MeshStandardMaterial({
        color: 0x101820,
        roughness: 0.42,
        metalness: 0.72
      })
    );
    cable.castShadow = true;
    katana.add(cable);

    const connector = new THREE.Mesh(
      new THREE.BoxGeometry(0.105, 0.16, 0.09),
      darkSteel
    );
    connector.position.set(0.22, -2.57, 0.08);
    connector.rotation.z = 0.2;
    katana.add(connector);

    const connectorLight = new THREE.Mesh(
      new THREE.PlaneGeometry(0.045, 0.018),
      magentaLED
    );
    connectorLight.position.set(0.265, -2.575, 0.13);
    connectorLight.rotation.z = 0.2;
    katana.add(connectorLight);

    const auraMaterial = new THREE.MeshBasicMaterial({
      color: 0x00dffc,
      transparent: true,
      opacity: 0.045,
      blending: THREE.AdditiveBlending,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const bladeAura = new THREE.Mesh(createBladeVolume(true), auraMaterial);
    bladeAura.scale.set(1.045, 1.002, 2.8);
    katana.add(bladeAura);

    const cyanReflection = new THREE.PointLight(0x00dfff, 5, 4.5, 2);
    cyanReflection.position.set(0.6, 4.1, 0.5);
    katana.add(cyanReflection);

    function animate(time) {
      const seconds = time * 0.001;
      controls.update();

      statusLed.material.emissiveIntensity = 5.7 + Math.sin(seconds * 4.4) * 1.5;
      ledLight.intensity = 3.5 + Math.sin(seconds * 4.4) * 1.1;
      edge.material.emissiveIntensity = 4.7 + Math.sin(seconds * 2.2) * 0.55;
      collarRing.material.emissiveIntensity = 4.4 + Math.sin(seconds * 3.1) * 0.65;
      decalMaterial.opacity = 0.29 + Math.sin(seconds * 5.2) * 0.07;
      cyanReflection.intensity = 4.4 + Math.sin(seconds * 2.2) * 0.8;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
