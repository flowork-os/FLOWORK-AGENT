<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bento Grid Blueprint</title>
  <style>
    .bento-container {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .span-8 { grid-column: span 8; }
    .span-4 { grid-column: span 4; }
    .span-12 { grid-column: span 12; }
    @media (max-width: 768px) {
      .span-8, .span-4 { grid-column: span 12; }
    }
    .bento-card {
      background: var(--card, #1e293b);
      border: 1px solid var(--border, #334155);
      border-radius: 12px;
      padding: 24px;
      color: var(--foreground, #f8fafc);
    }
  </style>
</head>
<body>
  <main class="bento-container">
    <section class="bento-card span-8">
      <h2>Primary Throughput Matrix</h2>
      <p>High-resolution real-time stream data.</p>
    </section>
    <aside class="bento-card span-4">
      <h2>Status Indicator</h2>
      <p>Nominal operations.</p>
    </aside>
  </main>
</body>
</html>
