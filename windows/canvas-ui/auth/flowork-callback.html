<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X-Flow Sovereign Gate — Authentication Callback</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00F2FE">
  <style>
    :root {
      --bg: #080b11;
      --card-bg: rgba(13, 20, 36, 0.88);
      --cyan: #00e5ff;
      --cyan-glow: rgba(0, 229, 255, 0.35);
      --red: #ef4444;
      --red-glow: rgba(239, 68, 68, 0.35);
      --green: #10b981;
      --purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-cyan: rgba(0, 229, 255, 0.3);
      --border-red: rgba(239, 68, 68, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(0, 229, 255, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Cyber Scanline */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.25) 51%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 10;
    }

    .container {
      position: relative;
      z-index: 20;
      width: 100%;
      max-width: 520px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-cyan);
      border-radius: 20px;
      padding: 40px 36px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 32px var(--cyan-glow);
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .card.error-state {
      border-color: var(--border-red);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 32px var(--red-glow);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    }

    .card.error-state::before {
      background: linear-gradient(90deg, transparent, var(--red), transparent);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid rgba(0, 229, 255, 0.35);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 20px;
    }

    .badge.error {
      background: rgba(239, 68, 68, 0.12);
      border-color: rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      animation: pulse 1.8s infinite;
    }

    .badge.error .badge-dot {
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      color: #fff;
    }

    .card.error-state h1 {
      color: #f87171;
    }

    .desc {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .user-profile {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      text-align: left;
    }

    .avatar-wrap {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.2), rgba(139, 92, 246, 0.2));
      border: 1px solid var(--border-cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .user-meta {
      flex: 1;
      min-width: 0;
    }

    .username {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tier-badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .telemetry-list {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 12px 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      color: #94a3b8;
      text-align: left;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .telemetry-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .telemetry-item.ok {
      color: #34d399;
    }

    .telemetry-item.warn {
      color: #fbbf24;
    }

    .telemetry-item.err {
      color: #f87171;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00e5ff 0%, #0099ff 100%);
      color: #040914;
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.4);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 28px rgba(0, 229, 255, 0.6);
      transform: translateY(-1px);
    }

    .btn-danger {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      color: #fff;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
    }

    .btn-danger:hover {
      box-shadow: 0 6px 28px rgba(239, 68, 68, 0.6);
      transform: translateY(-1px);
    }

    .footer-note {
      margin-top: 18px;
      font-size: 11px;
      color: #64748b;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card {{CARD_CLASS}}">
      <div class="badge {{BADGE_CLASS}}">
        <span class="badge-dot"></span>
        {{BADGE_TEXT}}
      </div>
      <h1>{{TITLE}}</h1>
      <p class="desc">{{DESCRIPTION}}</p>

      {{CONTENT_BLOCK}}

      {{ACTION_BUTTON}}

      <div class="footer-note">{{FOOTER_NOTE}}</div>
    </div>
  </div>
  {{REDIRECT_SCRIPT}}
</body>
</html>
