<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="60%" stop-color="#0a0f24"/>
      <stop offset="100%" stop-color="#191638"/>
    </linearGradient>
    <linearGradient id="neonGlow1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0077" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff0077" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background Sky -->
  <rect x="0" y="0" width="1280" height="720" fill="url(#skyGrad)"/>
  <!-- Distant Mega-Towers (Far Layer) -->
  <g fill="#0e1329" opacity="0.6">
    <rect x="80" y="160" width="140" height="560"/>
    <rect x="260" y="220" width="90" height="500"/>
    <rect x="420" y="120" width="180" height="600"/>
    <rect x="740" y="180" width="160" height="540"/>
    <rect x="960" y="240" width="130" height="480"/>
  </g>
  <!-- Midground Neon Billboards -->
  <g fill="#161d3b">
    <rect x="200" y="320" width="180" height="400"/>
    <rect x="220" y="340" width="140" height="40" fill="#00ffcc" opacity="0.3"/>
    <text x="240" y="366" fill="#00ffcc" font-family="sans-serif" font-weight="900" font-size="18">FLOWORK</text>
    <rect x="680" y="280" width="220" height="440"/>
    <rect x="700" y="300" width="180" height="50" fill="#ff0077" opacity="0.3"/>
    <text x="730" y="332" fill="#ff0077" font-family="sans-serif" font-weight="900" font-size="20">NEO-TOKYO</text>
  </g>
  <!-- Combat Stage Rooftop (Near Layer / Walkable Floor) -->
  <g id="combat-floor">
    <!-- Main platform roof -->
    <rect x="0" y="560" width="1280" height="160" fill="#0b0e14" stroke="#00ffcc" stroke-width="2"/>
    <!-- Warning Hazard Stripes on Ledge -->
    <path d="M 0 560 L 1280 560" stroke="#ffaa00" stroke-width="6" stroke-dasharray="24,12"/>
    <!-- Ventilation Shaft Obstacle -->
    <rect x="80" y="490" width="90" height="70" fill="#1b212c" stroke="#384355" stroke-width="3"/>
    <!-- Satellite Dish Prop -->
    <path d="M 1120 560 L 1150 480 M 1130 460 A 40 40 0 0 1 1190 490" stroke="#00e5ff" stroke-width="4" fill="none"/>
  </g>
</svg>