<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -70 120 160" width="120" height="160">
  <defs>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Headband tail -->
  <path d="M-8 -44 Q -28 -40 -35 -30" stroke="#ff0055" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Torso & Limbs -->
  <g stroke="#00ffcc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)">
    <!-- Torso -->
    <line x1="0" y1="-24" x2="0" y2="20" />
    <!-- Arms -->
    <polyline points="0,-18 -14,-4 -24,8" />
    <polyline points="0,-18 16,-2 26,12" />
    <!-- Legs -->
    <polyline points="0,20 -12,46 -18,74" />
    <polyline points="0,20 14,48 22,74" />
    <!-- Head -->
    <circle cx="0" cy="-42" r="18" fill="#0d1117" stroke="#00ffcc" stroke-width="4"/>
    <!-- Glowing Eye slits -->
    <line x1="-8" y1="-42" x2="-2" y2="-42" stroke="#ffffff" stroke-width="3" />
    <line x1="2" y1="-42" x2="8" y2="-42" stroke="#ffffff" stroke-width="3" />
  </g>
</svg>