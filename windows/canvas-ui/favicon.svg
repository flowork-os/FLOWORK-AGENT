<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient (unchanged — established FLOWORK dark surface) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Cyan to Purple Neon Flow — the FLOWORK brand gradient, same stops used
         across the app's other neon UI accents -->
    <linearGradient id="flowMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="55%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#7F00FF"/>
    </linearGradient>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Card Frame -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="url(#flowMark)" stroke-width="3" stroke-opacity="0.35"/>

  <!-- FLOWORK monogram: a bold geometric "F" — reads clearly even at 16px favicon
       size, unlike the previous abstract router-circuit mark which could belong to
       any generic network product. Built from rectangles (not a font glyph) so
       corners stay crisp when rasterized small. -->
  <g filter="url(#glowEffect)">
    <rect x="152" y="120" width="64" height="272" rx="18" fill="url(#flowMark)"/>
    <rect x="152" y="120" width="208" height="64" rx="18" fill="url(#flowMark)"/>
    <rect x="152" y="234" width="176" height="60" rx="16" fill="url(#flowMark)"/>
  </g>

  <!-- Flow accent: a single sweeping streak through the F's crossbar, nodding at
       "Flow" in FLOWORK without adding detail that would blur out at small sizes -->
  <path d="M 340 200 Q 400 216 440 176" stroke="#00F2FE" stroke-width="10"
        fill="none" stroke-linecap="round" opacity="0.85"/>
  <circle cx="440" cy="176" r="14" fill="#00F2FE"/>

  <!-- Subtle outer pulse ring, matching the app's existing signal-pulse motif -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#7F00FF" stroke-width="2" opacity="0.25" stroke-dasharray="12 10"/>
</svg>
