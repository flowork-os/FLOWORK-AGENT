# [FL_INDEX: keywords="rust, semantic_search, fastembed, onnx, cli" | purpose="Cargo configuration for Sovereign Flowork Semantic Engine"]
[package]
name = "flowork-semantic"
version = "0.1.0"
edition = "2021"

[dependencies]
fastembed = { version = "4", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
anyhow = "1.0"
