<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowork Member Area</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#00F2FE">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #080c14;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      border: 1px solid rgba(0, 242, 254, 0.25);
      background: rgba(15, 23, 42, 0.85);
      border-radius: 16px;
      padding: 36px 44px;
      text-align: center;
      max-width: 540px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    h1 { font-size: 22px; color: #00f2fe; margin-bottom: 12px; letter-spacing: 0.5px; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="app">
    <div class="card">
      <h1>Flowork Member Area</h1>
      <p>Sovereign Canvas Ready. You are 100% free to design, build, and customize this interface completely.</p>
    </div>
  </div>
</body>
</html>
