<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Long Wait — Patinated Bronze, Seated Elder</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #131315; }
  canvas { display: block; }
  #caption {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    color: #8d8d93; font: 11px/1.5 "Helvetica Neue", Arial, sans-serif;
    letter-spacing: .18em; text-transform: uppercase; pointer-events: none;
    text-align: center; opacity: .8;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="caption">The Long Wait &mdash; cast bronze, dark patina</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------- renderer */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ------------------------------------------------------------------- scene */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141416);
scene.fog = new THREE.Fog(0x141416, 9, 20);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 60);
camera.position.set(2.7, 1.65, 3.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0.05);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 1.4;
controls.maxDistance = 9;
controls.maxPolarAngle = 1.52;

/* ------------------------------------------------------------------ lights */
const hemi = new THREE.HemisphereLight(0x77808c, 0x151210, 0.45);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe7c4, 2.4);           // warm key
key.position.set(3, 5, 2.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -2.2; key.shadow.camera.right = 2.2;
key.shadow.camera.top = 2.2;   key.shadow.camera.bottom = -2.2;
key.shadow.camera.near = 1;    key.shadow.camera.far = 15;
key.shadow.bias = -0.0003;
key.shadow.normalBias = 0.025;
key.shadow.radius = 6;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fa3b8, 0.5);          // cool fill
fill.position.set(-4, 1.6, 2.2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xbdd4ff, 1.6);           // rim / back edge
rim.position.set(-2.5, 3.2, -3.6);
scene.add(rim);

/* ------------------------------------------------------------------ ground */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(8, 64),
  new THREE.ShadowMaterial({ opacity: 0.45 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* -------------------------------------------------------------- materials */
const bronzeCoat = new THREE.MeshStandardMaterial({  // heavy patinated coat
  color: 0x4a3a26, metalness: 0.9, roughness: 0.5, envMapIntensity: 0.55
});
const bronzeSkin = new THREE.MeshStandardMaterial({  // head, neck, lower legs
  color: 0x55432c, metalness: 0.92, roughness: 0.38, envMapIntensity: 0.7
});
const bronzePolished = new THREE.MeshStandardMaterial({ // hand-worn bright spots
  color: 0x9a7c4d, metalness: 1.0, roughness: 0.24, envMapIntensity: 1.0
});
const bronzeBench = new THREE.MeshStandardMaterial({
  color: 0x352e24, metalness: 0.85, roughness: 0.55, envMapIntensity: 0.45
});
const stone = new THREE.MeshStandardMaterial({
  color: 0x26272b, metalness: 0.05, roughness: 0.92, envMapIntensity: 0.2
});

/* -------------------------------------------------- procedural sculpt tools */
// Subtle hand-modelled surface: displace vertices along normals with sines.
function sculpt(g, amp = 0.008, freq = 9, seed = 0) {
  g.computeVertexNormals();
  const pos = g.attributes.position, nor = g.attributes.normal;
  const v = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    n.fromBufferAttribute(nor, i);
    const d =
      Math.sin(v.x * freq + 1.7 + seed) *
      Math.sin(v.y * freq * 0.8 + 4.2 + seed) *
      Math.sin(v.z * freq * 1.3 + 2.6) +
      0.5 * Math.sin(v.x * freq * 2.3 + seed) * Math.sin(v.y * freq * 2.9 + 1.1);
    pos.setXYZ(i, v.x + n.x * d * amp, v.y + n.y * d * amp, v.z + n.z * d * amp);
  }
  g.computeVertexNormals();
  return g;
}

// Ellipsoid mass with clay-like noise baked in (scale baked so noise is even).
function blob(sx, sy, sz, amp = 0.01, freq = 7, seed = 0) {
  const g = new THREE.SphereGeometry(1, 48, 32);
  g.scale(sx, sy, sz);
  return sculpt(g, amp, freq, seed);
}

/* ------------------------------------------------------- the single object */
const statue = new THREE.Group();       // EXACTLY ONE centered object
scene.add(statue);

function put(geo, mat, x, y, z, rx = 0, ry = 0, rz = 0, parent = statue) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

// Capsule limb between two joints; rounded caps extend one radius past joints.
function limb(x1, y1, z1, x2, y2, z2, r, mat, amp = 0.005, parent = statue) {
  const a = new THREE.Vector3(x1, y1, z1), b = new THREE.Vector3(x2, y2, z2);
  const d = new THREE.Vector3().subVectors(b, a);
  const len = d.length();
  const g = sculpt(new THREE.CapsuleGeometry(r, len, 8, 24), amp, 8, len * 13);
  const m = new THREE.Mesh(g, mat);
  m.position.copy(a).lerp(b, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* --- stone plinth --------------------------------------------------------- */
put(new THREE.BoxGeometry(2.0, 0.09, 1.4), stone, 0, 0.045, 0.08);

const inner = new THREE.Group();        // everything above the plinth top
inner.position.y = 0.09;
statue.add(inner);

/* --- memorial bench (seat top at 0.45 m) ---------------------------------- */
function bar(w, h, d, x, y, z, rx = 0) {
  return put(new THREE.BoxGeometry(w, h, d), bronzeBench, x, y, z, rx, 0, 0, inner);
}
// seat slats
for (const zz of [-0.145, 0, 0.145]) bar(1.35, 0.035, 0.125, 0, 0.4325, zz);
// back slats, slightly reclined
bar(1.35, 0.10, 0.03, 0, 0.60, -0.25, -0.10);
bar(1.35, 0.10, 0.03, 0, 0.745, -0.262, -0.10);
// end frames
for (const s of [-1, 1]) {
  bar(0.055, 0.615, 0.06, s * 0.60, 0.3075, 0.16);          // front leg
  bar(0.055, 0.82, 0.06, s * 0.60, 0.41, -0.21, -0.09);     // back leg
  bar(0.06, 0.045, 0.48, s * 0.60, 0.638, -0.035);          // armrest
}

/* --- figure: hunched torso built from overlapping coat masses ------------- */
// [sx, sy, sz, x, y, z, amp, freq, seed]
const masses = [
  [0.235, 0.165, 0.215, 0,     0.565, -0.01, 0.012, 6, 1],  // hips under coat
  [0.215, 0.175, 0.195, 0,     0.705,  0.045, 0.012, 6, 2], // belly
  [0.205, 0.165, 0.180, 0,     0.845,  0.095, 0.011, 6, 3], // chest, leaning in
  [0.225, 0.135, 0.165, 0,     0.955,  0.115, 0.010, 7, 4], // shoulder yoke
  [0.185, 0.225, 0.160, 0,     0.885,  0.015, 0.012, 6, 5], // rounded hunch of the back
  [0.245, 0.115, 0.230, 0,     0.475,  0.00,  0.014, 5, 6], // hem pooling on the seat
  [0.165, 0.095, 0.085, 0,     0.49,  -0.185, 0.012, 6, 7], // coat tail behind
];
for (const [sx, sy, sz, x, y, z, a, f, sd] of masses)
  put(blob(sx, sy, sz, a, f, sd), bronzeCoat, x, y, z, 0, 0, 0, inner);
// coat falling at the sides of the legs
for (const s of [-1, 1])
  put(blob(0.06, 0.155, 0.15, 0.012, 6, 8 + s), bronzeCoat, s * 0.175, 0.50, 0.08, 0, 0, 0, inner);
// coat spread across the lap, and the hem hanging in front of the shins
put(blob(0.225, 0.05, 0.23, 0.016, 5, 11), bronzeCoat, 0, 0.655, 0.19, 0.05, 0, 0, inner);
put(blob(0.19, 0.17, 0.045, 0.014, 6, 12), bronzeCoat, 0, 0.42, 0.47, -0.08, 0, 0, inner);

/* --- legs ------------------------------------------------------------------ */
for (const s of [-1, 1]) {
  limb(s * 0.105, 0.545, 0.06, s * 0.12, 0.545, 0.37, 0.095, bronzeCoat, 0.008, inner); // thigh
  limb(s * 0.12, 0.50, 0.39, s * 0.115, 0.14, 0.36, 0.052, bronzeSkin, 0.005, inner);   // shin
  // knees rubbed bright by passing hands
  put(sculpt(new THREE.SphereGeometry(0.10, 32, 24), 0.004, 9, s), bronzePolished,
      s * 0.12, 0.538, 0.378, 0, 0, 0, inner);
  // shoe
  const shoe = new THREE.CapsuleGeometry(0.048, 0.10, 8, 24);
  shoe.rotateX(Math.PI / 2);
  shoe.scale(1.05, 0.8, 1.15);
  sculpt(shoe, 0.004, 10, s * 2);
  put(shoe, bronzeSkin, s * 0.115, 0.042, 0.435, 0, 0, 0, inner);
}

/* --- arms, sleeves heavy with coat cloth ---------------------------------- */
for (const s of [-1, 1]) {
  limb(s * 0.195, 0.955, 0.09, s * 0.225, 0.74, 0.14, 0.062, bronzeCoat, 0.008, inner); // upper arm
  limb(s * 0.225, 0.74, 0.14, s * 0.08, 0.705, 0.29, 0.052, bronzeCoat, 0.007, inner);  // forearm
}
/* --- hands folded quietly in the lap (worn bright) ------------------------- */
put(blob(0.09, 0.042, 0.105, 0.006, 12, 20), bronzePolished, 0, 0.715, 0.315, 0.08, 0, 0, inner);
for (const s of [-1, 1])
  put(blob(0.048, 0.036, 0.075, 0.005, 12, 21 + s), bronzePolished, s * 0.045, 0.712, 0.30, 0.05, s * 0.15, 0, inner);

/* --- neck, scarf collar ----------------------------------------------------- */
limb(0, 1.00, 0.10, 0, 1.09, 0.165, 0.055, bronzeSkin, 0.004, inner);
const collar = put(new THREE.TorusGeometry(0.085, 0.031, 14, 36), bronzeCoat, 0, 1.035, 0.115, 1.25, 0, 0, inner);
collar.scale.set(1.15, 1.1, 1.0);
put(blob(0.042, 0.10, 0.028, 0.008, 9, 30), bronzeCoat, 0.03, 0.915, 0.245, 0.15, 0, 0.1, inner); // scarf tail

/* --- head, bowed forward — silhouette over detail --------------------------- */
const head = new THREE.Group();
head.position.set(0, 1.14, 0.195);
head.rotation.x = 0.42;                                       // the bow of age
inner.add(head);
put(blob(0.088, 0.105, 0.098, 0.004, 11, 40), bronzeSkin, 0, 0, 0, 0, 0, 0, head);        // skull
put(blob(0.065, 0.07, 0.075, 0.004, 11, 41), bronzeSkin, 0, -0.045, 0.03, 0, 0, 0, head); // jaw
put(new THREE.ConeGeometry(0.016, 0.05, 12), bronzeSkin, 0, -0.02, 0.085, Math.PI / 2, 0, 0, head); // nose hint
for (const s of [-1, 1])
  put(blob(0.016, 0.03, 0.024, 0.002, 14, 42), bronzeSkin, s * 0.082, -0.01, 0.01, 0, 0, 0, head);  // ears
// flat cap
put(blob(0.096, 0.052, 0.104, 0.006, 8, 43), bronzeCoat, 0, 0.062, 0.005, 0, 0, 0, head);
const brim = new THREE.CylinderGeometry(0.075, 0.08, 0.014, 28);
brim.scale(1.1, 1, 1.35);
put(brim, bronzeCoat, 0, 0.045, 0.06, 0.12, 0, 0, head);

/* -------------------------------------------------------------- interaction */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
