<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balloon Giraffe</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f6dcae; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6dcae);
scene.fog = new THREE.Fog(0xf6dcae, 15, 30);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.5, 5.9, 10.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.25;
controls.target.set(0, 3.25, 0);
controls.minDistance = 7;
controls.maxDistance = 17;
controls.maxPolarAngle = Math.PI * 0.54;

const hemi = new THREE.HemisphereLight(0xfff3d1, 0x9b633e, 2.15);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff5d6, 4.2);
key.position.set(-5, 10, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 11;
key.shadow.camera.bottom = -2;
key.shadow.bias = -0.0005;
scene.add(key);

const rim = new THREE.PointLight(0xffbd76, 17, 16, 2);
rim.position.set(5, 5, -5);
scene.add(rim);

const yellow = new THREE.MeshPhysicalMaterial({
  color: 0xf5c928,
  roughness: 0.19,
  metalness: 0.02,
  clearcoat: 1,
  clearcoatRoughness: 0.08,
  sheen: 0.35,
  sheenColor: 0xfff0a0
});

const yellowLight = new THREE.MeshPhysicalMaterial({
  color: 0xffdc42,
  roughness: 0.16,
  metalness: 0.01,
  clearcoat: 1,
  clearcoatRoughness: 0.06,
  sheen: 0.4,
  sheenColor: 0xfff5b5
});

const brown = new THREE.MeshPhysicalMaterial({
  color: 0x75451f,
  roughness: 0.25,
  metalness: 0.02,
  clearcoat: 0.35
});

const darkBrown = new THREE.MeshPhysicalMaterial({
  color: 0x382014,
  roughness: 0.3,
  clearcoat: 0.25
});

const black = new THREE.MeshPhysicalMaterial({
  color: 0x120d09,
  roughness: 0.18,
  clearcoat: 0.5
});

const giraffe = new THREE.Group();
giraffe.position.y = 0.03;
scene.add(giraffe);

const sphereGeo = new THREE.SphereGeometry(1, 32, 20);
const cylinderGeoCache = new Map();

function cylinderGeometry(radius, length) {
  const key = radius.toFixed(3) + ':' + length.toFixed(3);
  if (!cylinderGeoCache.has(key)) {
    cylinderGeoCache.set(key, new THREE.CylinderGeometry(radius, radius * 0.98, length, 24, 1));
  }
  return cylinderGeoCache.get(key);
}

function balloonSphere(parent, position, scale, material = yellow) {
  const mesh = new THREE.Mesh(sphereGeo, material);
  mesh.position.set(position.x, position.y, position.z);
  mesh.scale.set(scale.x, scale.y, scale.z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function tubeBetween(parent, a, b, radius, material = yellow, joint = true) {
  const start = new THREE.Vector3(a.x, a.y, a.z);
  const end = new THREE.Vector3(b.x, b.y, b.z);
  const delta = end.clone().sub(start);
  const length = delta.length();
  const mesh = new THREE.Mesh(cylinderGeometry(radius, length), material);
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  if (joint) {
    balloonSphere(parent, start, new THREE.Vector3(radius * 1.12, radius * 1.12, radius * 1.12), material);
    balloonSphere(parent, end, new THREE.Vector3(radius * 1.12, radius * 1.12, radius * 1.12), material);
  }
  return mesh;
}

function knot(parent, position, radius) {
  balloonSphere(parent, position, new THREE.Vector3(radius * 1.3, radius * 0.78, radius * 1.3), yellowLight);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(radius * 0.78, radius * 0.12, 10, 20), yellow);
  ring.position.set(position.x, position.y, position.z);
  ring.rotation.x = Math.PI / 2;
  ring.castShadow = true;
  parent.add(ring);
}

function spot(parent, position, scale, rotation = new THREE.Euler()) {
  const patch = balloonSphere(parent, position, scale, brown);
  patch.rotation.copy(rotation);
  return patch;
}

balloonSphere(giraffe, new THREE.Vector3(0, 2.05, 0), new THREE.Vector3(2.18, 1.22, 1.25), yellow);

const bodySpots = [
  [-1.35, 2.25, 0.18, 0.48, 0.36, 0.08, 0, 0, 0.2],
  [-0.75, 2.68, 0.86, 0.35, 0.3, 0.07, 0, 0.2, -0.15],
  [0.22, 2.82, 0.9, 0.38, 0.26, 0.07, 0, -0.1, 0.1],
  [0.95, 2.28, 0.83, 0.34, 0.42, 0.07, 0, -0.2, -0.2],
  [1.34, 1.75, 0.3, 0.3, 0.39, 0.07, 0, 0, 0.25],
  [0.28, 1.33, 0.91, 0.34, 0.27, 0.07, 0, 0.05, 0],
  [-0.72, 1.45, 0.87, 0.42, 0.3, 0.07, 0, -0.15, 0.1],
  [-1.52, 1.7, -0.1, 0.27, 0.34, 0.08, 0, 0, -0.2]
];
for (const s of bodySpots) {
  spot(giraffe, new THREE.Vector3(s[0], s[1], s[2]), new THREE.Vector3(s[3], s[4], s[5]), new THREE.Euler(s[6], s[7], s[8]));
}

const legData = [
  { x: -1.25, z: 0.7, lean: -0.08 },
  { x: 1.2, z: 0.7, lean: 0.08 },
  { x: -1.2, z: -0.72, lean: -0.12 },
  { x: 1.18, z: -0.72, lean: 0.12 }
];

for (const leg of legData) {
  const hip = new THREE.Vector3(leg.x, 1.45, leg.z);
  const knee = new THREE.Vector3(leg.x + leg.lean, 0.72, leg.z);
  const hoof = new THREE.Vector3(leg.x + leg.lean * 1.5, 0.22, leg.z + 0.03);
  tubeBetween(giraffe, hip, knee, 0.25, yellow, true);
  tubeBetween(giraffe, knee, hoof, 0.21, yellowLight, true);
  balloonSphere(giraffe, new THREE.Vector3(hoof.x, 0.13, hoof.z + 0.03), new THREE.Vector3(0.32, 0.17, 0.42), brown);
  knot(giraffe, knee, 0.19);
}

const neckPoints = [
  new THREE.Vector3(0, 2.65, 0.08),
  new THREE.Vector3(-0.08, 3.55, 0.1),
  new THREE.Vector3(0.08, 4.45, 0.12),
  new THREE.Vector3(0.28, 5.28, 0.18)
];

for (let i = 0; i < neckPoints.length - 1; i++) {
  tubeBetween(giraffe, neckPoints[i], neckPoints[i + 1], 0.42, i % 2 ? yellowLight : yellow, true);
  if (i > 0) knot(giraffe, neckPoints[i], 0.32);
}

const neckSpots = [
  [0.39, 3.1, 0.12, 0.17, 0.24, 0.055, 0, 0.25, 0],
  [-0.39, 3.46, 0.06, 0.18, 0.24, 0.055, 0, -0.25, 0],
  [0.42, 3.92, 0.16, 0.2, 0.28, 0.055, 0, 0.3, 0.1],
  [-0.35, 4.27, 0.15, 0.16, 0.23, 0.055, 0, -0.3, -0.1],
  [0.5, 4.72, 0.22, 0.18, 0.25, 0.055, 0, 0.35, 0],
  [-0.23, 5.03, 0.23, 0.16, 0.2, 0.055, 0, -0.35, 0]
];
for (const s of neckSpots) {
  spot(giraffe, new THREE.Vector3(s[0], s[1], s[2]), new THREE.Vector3(s[3], s[4], s[5]), new THREE.Euler(s[6], s[7], s[8]));
}

const head = new THREE.Group();
head.position.set(0.3, 5.76, 0.2);
giraffe.add(head);

balloonSphere(head, new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.92, 0.72, 0.86), yellowLight);
balloonSphere(head, new THREE.Vector3(0, -0.2, 0.72), new THREE.Vector3(0.67, 0.45, 0.48), yellow);
balloonSphere(head, new THREE.Vector3(0, -0.16, 1.04), new THREE.Vector3(0.49, 0.33, 0.31), brown);

balloonSphere(head, new THREE.Vector3(-0.58, 0.12, 0.58), new THREE.Vector3(0.19, 0.2, 0.2), black);
balloonSphere(head, new THREE.Vector3(0.58, 0.12, 0.58), new THREE.Vector3(0.19, 0.2, 0.2), black);

const earLeft = new THREE.Group();
earLeft.position.set(-0.68, 0.42, 0.02);
earLeft.rotation.z = -0.35;
head.add(earLeft);
balloonSphere(earLeft, new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.4, 0.18, 0.3), yellow);
balloonSphere(earLeft, new THREE.Vector3(-0.04, 0, 0.03), new THREE.Vector3(0.24, 0.1, 0.2), brown);

const earRight = earLeft.clone();
earRight.position.x = 0.68;
earRight.rotation.z = 0.35;
head.add(earRight);

for (const x of [-0.36, 0.36]) {
  const horn = new THREE.Group();
  horn.position.set(x, 0.72, 0);
  head.add(horn);
  tubeBetween(horn, new THREE.Vector3(0, -0.13, 0), new THREE.Vector3(0, 0.28, 0), 0.11, brown, true);
  balloonSphere(horn, new THREE.Vector3(0, 0.36, 0), new THREE.Vector3(0.17, 0.14, 0.17), brown);
}

const mane = new THREE.Group();
mane.position.set(0, 0.12, -0.66);
head.add(mane);
for (let i = 0; i < 5; i++) {
  const tuft = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.38, 12), brown);
  tuft.position.set((i - 2) * 0.18, -0.08 + i * 0.08, 0);
  tuft.rotation.x = -Math.PI / 2;
  tuft.rotation.z = (i - 2) * 0.08;
  tuft.castShadow = true;
  mane.add(tuft);
}

const tail = new THREE.Group();
giraffe.add(tail);
tubeBetween(tail, new THREE.Vector3(-1.92, 2.24, -0.12), new THREE.Vector3(-2.45, 1.82, -0.18), 0.13, yellow, true);
tubeBetween(tail, new THREE.Vector3(-2.45, 1.82, -0.18), new THREE.Vector3(-2.63, 1.35, -0.23), 0.1, yellowLight, true);
balloonSphere(tail, new THREE.Vector3(-2.68, 1.18, -0.24), new THREE.Vector3(0.23, 0.38, 0.2), brown);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(8, 64),
  new THREE.MeshStandardMaterial({ color: 0xe9bd83, roughness: 0.92 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.04;
ground.receiveShadow = true;
scene.add(ground);

const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(2.9, 48),
  new THREE.MeshBasicMaterial({ color: 0x9b633e, transparent: true, opacity: 0.18 })
);
shadow.rotation.x = -Math.PI / 2;
shadow.scale.set(1, 0.42, 1);
shadow.position.set(0, 0.005, 0);
scene.add(shadow);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
