<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low-Poly Pronghorn</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d9d0bd;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9d0bd);
scene.fog = new THREE.Fog(0xd9d0bd, 8, 18);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(-4.8, 3.1, 6.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.target.set(-0.15, 1.85, 0);

const root = new THREE.Group();
root.rotation.y = -0.08;
scene.add(root);

const tan = new THREE.MeshStandardMaterial({
  color: 0xb8875e,
  roughness: 0.9,
  flatShading: true
});
const tanLight = new THREE.MeshStandardMaterial({
  color: 0xd2aa7b,
  roughness: 0.92,
  flatShading: true
});
const cocoa = new THREE.MeshStandardMaterial({
  color: 0x654536,
  roughness: 0.95,
  flatShading: true
});
const cocoaDark = new THREE.MeshStandardMaterial({
  color: 0x392a24,
  roughness: 0.96,
  flatShading: true
});
const chalk = new THREE.MeshStandardMaterial({
  color: 0xf0e8d5,
  roughness: 0.9,
  flatShading: true
});
const black = new THREE.MeshStandardMaterial({
  color: 0x171514,
  roughness: 0.8,
  flatShading: true
});
const hoofMat = new THREE.MeshStandardMaterial({
  color: 0x2a211d,
  roughness: 1,
  flatShading: true
});

function addMesh(geometry, material, position = [0, 0, 0], scale = [1, 1, 1], parent = root) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(position[0], position[1], position[2]);
  mesh.scale.set(scale[0], scale[1], scale[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function segment(a, b, r1, r2, material, radial = 5, parent = root) {
  const start = new THREE.Vector3(a[0], a[1], a[2]);
  const end = new THREE.Vector3(b[0], b[1], b[2]);
  const delta = new THREE.Vector3().subVectors(end, start);
  const length = delta.length();
  const geometry = new THREE.CylinderGeometry(r2, r1, length, radial, 1, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function triangularPrism(width, depth, height, material) {
  const w = width * 0.5;
  const d = depth * 0.5;
  const vertices = new Float32Array([
    -w, 0, -d,  w, 0, -d,  0, 0, d,
    -w, height, -d * 0.72,  w, height, -d * 0.72,  0, height, d * 0.72
  ]);
  const indices = [
    0, 2, 1,
    3, 4, 5,
    0, 1, 4, 0, 4, 3,
    1, 2, 5, 1, 5, 4,
    2, 0, 3, 2, 3, 5
  ];
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function triangleMesh(points, material, parent = root) {
  const geometry = new THREE.BufferGeometry();
  const vertices = new Float32Array(points.flat());
  geometry.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
  geometry.setIndex([0, 1, 2]);
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

const body = addMesh(
  new THREE.IcosahedronGeometry(1, 2),
  tan,
  [0, 1.72, 0],
  [1.62, 0.82, 0.64]
);

addMesh(
  new THREE.IcosahedronGeometry(0.72, 1),
  tanLight,
  [-1.02, 2.18, 0],
  [0.82, 1.0, 0.58]
);

segment([-0.9, 2.3, 0], [-1.38, 2.72, 0], 0.48, 0.3, tanLight, 6);
segment([-1.3, 2.67, 0], [-1.63, 2.86, 0], 0.31, 0.25, chalk, 5);

const muzzleGeometry = new THREE.BufferGeometry();
muzzleGeometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array([
  -1.62, 2.98, -0.23,
  -1.62, 2.98,  0.23,
  -2.23, 2.84, -0.18,
  -2.23, 2.84,  0.18,
  -2.12, 2.63, -0.17,
  -2.12, 2.63,  0.17
]), 3));
muzzleGeometry.setIndex([
  0, 2, 3, 0, 3, 1,
  0, 4, 2, 0, 1, 5,
  1, 3, 5, 2, 4, 5,
  2, 5, 3, 0, 4, 5
]);
muzzleGeometry.computeVertexNormals();
addMesh(muzzleGeometry, chalk);

addMesh(new THREE.IcosahedronGeometry(0.105, 1), black, [-2.02, 2.88, 0.22], [1, 0.82, 0.55]);
addMesh(new THREE.IcosahedronGeometry(0.105, 1), black, [-2.02, 2.88, -0.22], [1, 0.82, 0.55]);

const earFront = triangleMesh([
  [-1.42, 2.92, 0.16],
  [-1.63, 3.36, 0.18],
  [-1.18, 3.18, 0.18]
], tanLight);
const earBack = triangleMesh([
  [-1.42, 2.92, -0.16],
  [-1.63, 3.36, -0.18],
  [-1.18, 3.18, -0.18]
], tanLight);

function makeHorn(z) {
  segment([-1.52, 3.05, z], [-1.57, 3.48, z], 0.105, 0.085, cocoaDark, 5);
  segment([-1.57, 3.48, z], [-1.47, 3.87, z], 0.085, 0.045, cocoaDark, 5);
  segment([-1.53, 3.51, z], [-1.88, 3.72, z], 0.073, 0.035, cocoaDark, 5);
  segment([-1.88, 3.72, z], [-2.04, 3.93, z], 0.035, 0.012, cocoaDark, 5);
}

makeHorn(0.18);
makeHorn(-0.18);

const legPositions = [
  [-0.82, 0.98, 0.37, 0.12],
  [0.78, 0.98, 0.37, 0.08],
  [-0.82, 0.98, -0.37, 0.16],
  [0.78, 0.98, -0.37, 0.12]
];

for (let i = 0; i < legPositions.length; i++) {
  const p = legPositions[i];
  const leg = addMesh(
    triangularPrism(0.19, 0.16, 1.08),
    i < 2 ? cocoa : tanLight,
    [p[0], p[1] - 0.53, p[2]]
  );
  leg.rotation.z = p[3];
  addMesh(
    new THREE.ConeGeometry(0.115, 0.18, 4),
    hoofMat,
    [p[0] + Math.sin(p[3]) * 0.03, 0.19, p[2]],
    [1, 1, 0.8]
  );
}

const whitePatch = triangleMesh([
  [0.42, 2.15, 0.57],
  [1.35, 2.03, 0.34],
  [0.84, 1.48, 0.60]
], chalk);
const whitePatch2 = triangleMesh([
  [0.42, 2.15, 0.57],
  [0.84, 1.48, 0.60],
  [0.05, 1.67, 0.64]
], chalk);
const cocoaPatch = triangleMesh([
  [-0.72, 2.18, 0.62],
  [0.05, 1.67, 0.64],
  [-0.18, 1.35, 0.54]
], cocoa);
const cocoaPatch2 = triangleMesh([
  [-0.72, 2.18, 0.62],
  [-0.18, 1.35, 0.54],
  [-1.02, 1.55, 0.53]
], cocoa);

segment([1.38, 1.92, 0], [1.72, 2.12, 0], 0.18, 0.09, tanLight, 5);
triangleMesh([
  [1.58, 2.05, 0.06],
  [1.98, 2.38, 0.05],
  [1.86, 1.96, 0.05]
], tanLight);
triangleMesh([
  [1.63, 2.06, -0.03],
  [2.08, 2.23, -0.03],
  [1.88, 1.89, -0.03]
], chalk);
triangleMesh([
  [1.68, 2.06, 0.12],
  [2.01, 2.08, 0.12],
  [1.86, 1.82, 0.12]
], cocoa);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(8, 64),
  new THREE.MeshStandardMaterial({ color: 0xc1b299, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.02;
ground.receiveShadow = true;
scene.add(ground);

const hemi = new THREE.HemisphereLight(0xfff4df, 0x6b5949, 2.2);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe6bd, 4.2);
key.position.set(-4, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -1;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 18;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9bb8d0, 1.1);
fill.position.set(4, 3, -4);
scene.add(fill);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener("resize", resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
