<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel Surveillance Drone</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05090e;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05090e);
  scene.fog = new THREE.FogExp2(0x05090e, 0.035);

  const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(6.8, 4.2, 8.2);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.55, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.045;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.65;
  controls.minDistance = 6;
  controls.maxDistance = 16;
  controls.maxPolarAngle = Math.PI * 0.7;

  const hemi = new THREE.HemisphereLight(0xaadfff, 0x11151c, 1.35);
  scene.add(hemi);

  const keyLight = new THREE.DirectionalLight(0xffffff, 4.3);
  keyLight.position.set(5, 8, 6);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.left = -7;
  keyLight.shadow.camera.right = 7;
  keyLight.shadow.camera.top = 7;
  keyLight.shadow.camera.bottom = -7;
  keyLight.shadow.camera.near = 0.5;
  keyLight.shadow.camera.far = 25;
  keyLight.shadow.bias = -0.0002;
  scene.add(keyLight);

  const rimLight = new THREE.DirectionalLight(0x30bfff, 2.5);
  rimLight.position.set(-6, 3, -5);
  scene.add(rimLight);

  const fillLight = new THREE.PointLight(0x638cff, 18, 15, 2);
  fillLight.position.set(4, 1, -4);
  scene.add(fillLight);

  const whiteMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xe9eef1,
    roughness: 0.24,
    metalness: 0.18,
    clearcoat: 0.8,
    clearcoatRoughness: 0.18
  });

  const whiteSecondaryMaterial = new THREE.MeshStandardMaterial({
    color: 0xb9c4ca,
    roughness: 0.35,
    metalness: 0.35
  });

  const darkMaterial = new THREE.MeshStandardMaterial({
    color: 0x151b21,
    roughness: 0.28,
    metalness: 0.72
  });

  const blackMaterial = new THREE.MeshStandardMaterial({
    color: 0x06090c,
    roughness: 0.18,
    metalness: 0.82
  });

  const cyanMaterial = new THREE.MeshStandardMaterial({
    color: 0x30eaff,
    emissive: 0x08cce8,
    emissiveIntensity: 4.5,
    roughness: 0.18,
    metalness: 0.2
  });

  const cyanGlassMaterial = new THREE.MeshPhysicalMaterial({
    color: 0x7ff8ff,
    emissive: 0x00c8ed,
    emissiveIntensity: 5.5,
    roughness: 0.08,
    metalness: 0.05,
    transmission: 0.2,
    transparent: true,
    opacity: 0.92,
    clearcoat: 1
  });

  const rotorMaterial = new THREE.MeshStandardMaterial({
    color: 0x252d34,
    roughness: 0.3,
    metalness: 0.65,
    transparent: true,
    opacity: 0.9
  });

  const drone = new THREE.Group();
  drone.position.y = 1.8;
  scene.add(drone);

  const body = new THREE.Mesh(
    new THREE.SphereGeometry(1, 64, 32),
    whiteMaterial
  );
  body.scale.set(1.28, 0.52, 1.55);
  body.castShadow = true;
  body.receiveShadow = true;
  drone.add(body);

  const underside = new THREE.Mesh(
    new THREE.SphereGeometry(1, 48, 24),
    darkMaterial
  );
  underside.scale.set(1.14, 0.38, 1.38);
  underside.position.y = -0.28;
  underside.castShadow = true;
  drone.add(underside);

  const spine = new THREE.Mesh(
    new THREE.SphereGeometry(1, 40, 20),
    whiteSecondaryMaterial
  );
  spine.scale.set(0.56, 0.19, 1.08);
  spine.position.set(0, 0.46, -0.05);
  spine.castShadow = true;
  drone.add(spine);

  const topPanel = new THREE.Mesh(
    new THREE.BoxGeometry(0.62, 0.035, 0.74),
    darkMaterial
  );
  topPanel.position.set(0, 0.61, -0.2);
  topPanel.rotation.x = -0.035;
  drone.add(topPanel);

  const topGlow = new THREE.Mesh(
    new THREE.BoxGeometry(0.07, 0.025, 0.58),
    cyanMaterial
  );
  topGlow.position.set(0, 0.637, -0.18);
  drone.add(topGlow);

  const eyeHousing = new THREE.Mesh(
    new THREE.SphereGeometry(1, 48, 24),
    blackMaterial
  );
  eyeHousing.scale.set(0.47, 0.34, 0.13);
  eyeHousing.position.set(0, 0.03, 1.48);
  eyeHousing.castShadow = true;
  drone.add(eyeHousing);

  const eyeBezel = new THREE.Mesh(
    new THREE.TorusGeometry(0.255, 0.038, 16, 64),
    darkMaterial
  );
  eyeBezel.scale.y = 0.72;
  eyeBezel.position.set(0, 0.03, 1.605);
  drone.add(eyeBezel);

  const eyeLens = new THREE.Mesh(
    new THREE.SphereGeometry(1, 48, 24),
    cyanGlassMaterial
  );
  eyeLens.scale.set(0.22, 0.16, 0.075);
  eyeLens.position.set(0, 0.03, 1.64);
  drone.add(eyeLens);

  const eyeCore = new THREE.Mesh(
    new THREE.SphereGeometry(0.07, 24, 16),
    new THREE.MeshBasicMaterial({ color: 0xd9ffff })
  );
  eyeCore.position.set(0, 0.03, 1.705);
  drone.add(eyeCore);

  const eyeLight = new THREE.PointLight(0x00ddff, 4, 2.8, 2);
  eyeLight.position.set(0, 0.03, 1.82);
  drone.add(eyeLight);

  const sidePanelGeometry = new THREE.BoxGeometry(0.035, 0.16, 0.72);
  for (const side of [-1, 1]) {
    const sidePanel = new THREE.Mesh(sidePanelGeometry, darkMaterial);
    sidePanel.position.set(side * 1.245, 0.02, -0.05);
    sidePanel.rotation.z = side * -0.08;
    drone.add(sidePanel);

    const sideStrip = new THREE.Mesh(
      new THREE.BoxGeometry(0.025, 0.045, 0.46),
      cyanMaterial
    );
    sideStrip.position.set(side * 1.269, 0.08, -0.03);
    drone.add(sideStrip);
  }

  const rearVentGeometry = new THREE.BoxGeometry(0.32, 0.055, 0.035);
  for (let i = -2; i <= 2; i++) {
    const vent = new THREE.Mesh(rearVentGeometry, blackMaterial);
    vent.position.set(i * 0.19, 0.19, -1.47);
    vent.rotation.x = -0.22;
    drone.add(vent);
  }

  function cylinderBetween(start, end, radius, material, radialSegments = 16) {
    const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
    const direction = new THREE.Vector3().subVectors(end, start);
    const length = direction.length();
    const mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(radius, radius, length, radialSegments),
      material
    );
    mesh.position.copy(midpoint);
    mesh.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      direction.normalize()
    );
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }

  const rotorPositions = [
    new THREE.Vector3(-2.35, 0.06, 1.72),
    new THREE.Vector3(2.35, 0.06, 1.72),
    new THREE.Vector3(-2.35, 0.06, -1.72),
    new THREE.Vector3(2.35, 0.06, -1.72)
  ];

  const rotorGroups = [];

  function createRotorPod(position, index) {
    const pod = new THREE.Group();
    pod.position.copy(position);
    drone.add(pod);

    const outerDuct = new THREE.Mesh(
      new THREE.TorusGeometry(0.61, 0.145, 20, 72),
      darkMaterial
    );
    outerDuct.rotation.x = Math.PI / 2;
    outerDuct.castShadow = true;
    outerDuct.receiveShadow = true;
    pod.add(outerDuct);

    const upperDuct = new THREE.Mesh(
      new THREE.TorusGeometry(0.61, 0.096, 16, 72),
      whiteMaterial
    );
    upperDuct.rotation.x = Math.PI / 2;
    upperDuct.position.y = 0.052;
    upperDuct.castShadow = true;
    pod.add(upperDuct);

    const lightRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.48, 0.018, 8, 64),
      cyanMaterial
    );
    lightRing.rotation.x = Math.PI / 2;
    lightRing.position.y = 0.088;
    pod.add(lightRing);

    const rotorDisc = new THREE.Mesh(
      new THREE.CylinderGeometry(0.48, 0.48, 0.018, 64),
      new THREE.MeshBasicMaterial({
        color: 0x6c8491,
        transparent: true,
        opacity: 0.09,
        depthWrite: false
      })
    );
    rotorDisc.position.y = 0.015;
    pod.add(rotorDisc);

    const rotor = new THREE.Group();
    rotor.position.y = 0.04;
    pod.add(rotor);

    for (let bladeIndex = 0; bladeIndex < 3; bladeIndex++) {
      const bladePivot = new THREE.Group();
      bladePivot.rotation.y = bladeIndex * Math.PI * 2 / 3;
      rotor.add(bladePivot);

      const blade = new THREE.Mesh(
        new THREE.BoxGeometry(0.37, 0.025, 0.1),
        rotorMaterial
      );
      blade.position.x = 0.22;
      blade.rotation.y = -0.2;
      bladePivot.add(blade);
    }

    const hub = new THREE.Mesh(
      new THREE.CylinderGeometry(0.105, 0.13, 0.13, 24),
      whiteSecondaryMaterial
    );
    hub.position.y = 0.07;
    hub.castShadow = true;
    pod.add(hub);

    const hubCap = new THREE.Mesh(
      new THREE.SphereGeometry(0.105, 24, 12),
      darkMaterial
    );
    hubCap.scale.y = 0.55;
    hubCap.position.y = 0.145;
    pod.add(hubCap);

    const statusLight = new THREE.Mesh(
      new THREE.SphereGeometry(0.035, 16, 8),
      index < 2 ? cyanMaterial : new THREE.MeshStandardMaterial({
        color: 0xff526a,
        emissive: 0xff173b,
        emissiveIntensity: 3
      })
    );
    statusLight.position.set(0, 0.13, position.z > 0 ? 0.61 : -0.61);
    pod.add(statusLight);

    rotorGroups.push(rotor);
  }

  rotorPositions.forEach((position, index) => {
    const side = Math.sign(position.x);
    const front = Math.sign(position.z);
    const inner = new THREE.Vector3(side * 0.82, 0.02, front * 0.82);
    const outer = position.clone().add(new THREE.Vector3(-side * 0.53, 0, -front * 0.38));

    drone.add(cylinderBetween(inner, outer, 0.105, whiteMaterial, 20));

    const lowerInner = inner.clone().add(new THREE.Vector3(0, -0.13, 0.02));
    const lowerOuter = outer.clone().add(new THREE.Vector3(0, -0.11, 0));
    drone.add(cylinderBetween(lowerInner, lowerOuter, 0.055, darkMaterial, 16));

    const accentStart = inner.clone().add(new THREE.Vector3(0, 0.105, 0));
    const accentEnd = outer.clone().add(new THREE.Vector3(0, 0.105, 0));
    drone.add(cylinderBetween(accentStart, accentEnd, 0.018, cyanMaterial, 10));

    createRotorPod(position, index);
  });

  const skidMaterial = new THREE.MeshStandardMaterial({
    color: 0x20272d,
    roughness: 0.3,
    metalness: 0.75
  });

  for (const side of [-1, 1]) {
    const frontTop = new THREE.Vector3(side * 0.72, -0.31, 0.62);
    const frontBottom = new THREE.Vector3(side * 0.88, -1.0, 0.78);
    const rearTop = new THREE.Vector3(side * 0.72, -0.31, -0.6);
    const rearBottom = new THREE.Vector3(side * 0.88, -1.0, -0.78);

    drone.add(cylinderBetween(frontTop, frontBottom, 0.045, skidMaterial, 12));
    drone.add(cylinderBetween(rearTop, rearBottom, 0.045, skidMaterial, 12));
    drone.add(cylinderBetween(
      new THREE.Vector3(side * 0.88, -1.0, -1.02),
      new THREE.Vector3(side * 0.88, -1.0, 1.02),
      0.052,
      skidMaterial,
      12
    ));

    const frontTip = new THREE.Mesh(
      new THREE.SphereGeometry(0.065, 16, 8),
      darkMaterial
    );
    frontTip.position.set(side * 0.88, -1.0, 1.03);
    drone.add(frontTip);

    const rearTip = frontTip.clone();
    rearTip.position.z = -1.03;
    drone.add(rearTip);
  }

  const antennaMast = cylinderBetween(
    new THREE.Vector3(0, 0.55, -0.73),
    new THREE.Vector3(0, 0.98, -0.9),
    0.026,
    darkMaterial,
    10
  );
  drone.add(antennaMast);

  const antennaTip = new THREE.Mesh(
    new THREE.SphereGeometry(0.055, 16, 10),
    cyanMaterial
  );
  antennaTip.position.set(0, 0.99, -0.905);
  drone.add(antennaTip);

  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(11, 96),
    new THREE.MeshStandardMaterial({
      color: 0x0a1016,
      roughness: 0.76,
      metalness: 0.2
    })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.02;
  floor.receiveShadow = true;
  scene.add(floor);

  const padRingMaterial = new THREE.MeshBasicMaterial({
    color: 0x123542,
    transparent: true,
    opacity: 0.5,
    side: THREE.DoubleSide
  });

  for (const radius of [2.2, 3.6, 5.1]) {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(radius, radius + 0.018, 96),
      padRingMaterial
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.006;
    scene.add(ring);
  }

  const shadowGlow = new THREE.Mesh(
    new THREE.CircleGeometry(2.1, 64),
    new THREE.MeshBasicMaterial({
      color: 0x00b7d5,
      transparent: true,
      opacity: 0.035,
      depthWrite: false
    })
  );
  shadowGlow.rotation.x = -Math.PI / 2;
  shadowGlow.position.y = 0.012;
  scene.add(shadowGlow);

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const elapsed = clock.getElapsedTime();
    const delta = Math.min(clock.getDelta(), 0.05);

    drone.position.y = 1.8 + Math.sin(elapsed * 1.25) * 0.09;
    drone.rotation.z = Math.sin(elapsed * 0.72) * 0.012;
    drone.rotation.x = Math.sin(elapsed * 0.58) * 0.009;

    rotorGroups.forEach((rotor, index) => {
      rotor.rotation.y += delta * (index % 2 === 0 ? 24 : -24);
    });

    cyanMaterial.emissiveIntensity = 4.2 + Math.sin(elapsed * 2.6) * 0.55;
    cyanGlassMaterial.emissiveIntensity = 5.2 + Math.sin(elapsed * 3.1) * 0.7;
    eyeLight.intensity = 3.7 + Math.sin(elapsed * 3.1) * 0.55;
    shadowGlow.material.opacity = 0.028 + Math.sin(elapsed * 1.25) * 0.008;

    controls.update();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  });

  animate();
</script>
</body>
</html>
