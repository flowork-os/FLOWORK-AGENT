<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carved Wood Pelican</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #d8c8aa;
}
canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8c8aa);
scene.fog = new THREE.Fog(0xd8c8aa, 10, 20);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 50);
camera.position.set(7.3, 3.5, 8.7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.25, 1.05, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.62;
controls.minDistance = 6.5;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI * 0.53;

scene.add(new THREE.HemisphereLight(0xfff2d5, 0x725b45, 2.1));

const key = new THREE.DirectionalLight(0xffe1ac, 4.2);
key.position.set(-5, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0004;
scene.add(key);

const rim = new THREE.DirectionalLight(0xb9c9d7, 2.2);
rim.position.set(5, 5, -6);
scene.add(rim);

const fill = new THREE.PointLight(0xffc98f, 18, 12, 2);
fill.position.set(-4, 2, 3);
scene.add(fill);

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0xbba785,
  roughness: 0.92,
  metalness: 0
});
const ground = new THREE.Mesh(new THREE.CircleGeometry(7.5, 64), groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.86;
ground.receiveShadow = true;
scene.add(ground);

const pelican = new THREE.Group();
pelican.rotation.y = -0.08;
scene.add(pelican);

const woodMaterial = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.48,
  metalness: 0,
  flatShading: true
});

const paleWoodMaterial = new THREE.MeshStandardMaterial({
  color: 0xc59459,
  roughness: 0.5,
  metalness: 0,
  flatShading: true
});

const pouchMaterial = new THREE.MeshStandardMaterial({
  color: 0xb97d43,
  roughness: 0.55,
  metalness: 0,
  flatShading: true
});

const heartwoodMaterial = new THREE.MeshStandardMaterial({
  color: 0x684226,
  roughness: 0.6,
  metalness: 0,
  flatShading: true
});

const grooveMaterial = new THREE.MeshStandardMaterial({
  color: 0x80512e,
  roughness: 0.66,
  metalness: 0
});

function hash(x) {
  const s = Math.sin(x * 91.713 + 17.31) * 43758.5453;
  return s - Math.floor(s);
}

function colorizeGeometry(geometry, baseHex, variation = 0.13, streak = 0) {
  const base = new THREE.Color(baseHex);
  const position = geometry.attributes.position;
  const colors = new Float32Array(position.count * 3);
  for (let i = 0; i < position.count; i++) {
    const x = position.getX(i);
    const y = position.getY(i);
    const z = position.getZ(i);
    const grain = Math.sin(y * 7.8 + x * 2.5 + Math.sin(z * 4.0) * 1.2);
    const facet = hash(i * 0.87 + x * 3.1 + z * 7.7) - 0.5;
    let shift = facet * variation + grain * variation * 0.18;
    if (streak > 0 && Math.sin(y * 13 + x * 4) > 0.78) shift -= streak;
    const c = base.clone().offsetHSL(0.008 * grain, 0.025, shift);
    colors[i * 3] = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;
  }
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
}

function facetedEllipsoid(name, position, scale, color, segments = 16, rings = 11, rotation = null) {
  const geometry = new THREE.SphereGeometry(1, segments, rings);
  const pos = geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const z = pos.getZ(i);
    const n = 1 + 0.025 * Math.sin(x * 11 + y * 7 + z * 5);
    pos.setXYZ(i, x * scale.x * n, y * scale.y * n, z * scale.z * n);
  }
  geometry.computeVertexNormals();
  colorizeGeometry(geometry, color, 0.105, 0.035);
  const mesh = new THREE.Mesh(geometry, woodMaterial);
  mesh.name = name;
  mesh.position.copy(position);
  if (rotation) mesh.rotation.set(rotation.x, rotation.y, rotation.z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  pelican.add(mesh);
  return mesh;
}

facetedEllipsoid(
  'broad carved body',
  new THREE.Vector3(0.18, -0.03, 0),
  new THREE.Vector3(1.05, 1.52, 0.82),
  0xb9854d,
  18,
  12,
  new THREE.Vector3(0, 0, -0.08)
);

const neckCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.10, 0.62, 0),
  new THREE.Vector3(0.26, 1.27, 0),
  new THREE.Vector3(0.18, 2.02, 0),
  new THREE.Vector3(-0.16, 2.71, 0),
  new THREE.Vector3(-0.38, 3.13, 0)
]);
const neckGeometry = new THREE.TubeGeometry(neckCurve, 32, 1, 10, false);
const neckPosition = neckGeometry.attributes.position;
const neckUV = neckGeometry.attributes.uv;
for (let i = 0; i < neckPosition.count; i++) {
  const t = THREE.MathUtils.clamp(neckUV.getX(i), 0, 1);
  const center = neckCurve.getPoint(t);
  const radius = 0.49 - 0.08 * Math.sin(t * Math.PI) + 0.06 * t;
  const dx = neckPosition.getX(i) - center.x;
  const dy = neckPosition.getY(i) - center.y;
  const dz = neckPosition.getZ(i) - center.z;
  neckPosition.setXYZ(
    i,
    center.x + dx * radius,
    center.y + dy * radius,
    center.z + dz * radius * 0.83
  );
}
neckGeometry.computeVertexNormals();
colorizeGeometry(neckGeometry, 0xbb8750, 0.1, 0.055);
const neck = new THREE.Mesh(neckGeometry, woodMaterial);
neck.castShadow = true;
neck.receiveShadow = true;
pelican.add(neck);

facetedEllipsoid(
  'head',
  new THREE.Vector3(-0.49, 3.27, 0),
  new THREE.Vector3(0.62, 0.59, 0.54),
  0xc08c54,
  16,
  10,
  new THREE.Vector3(0, 0, 0.03)
);

const billGeometry = new THREE.SphereGeometry(1, 18, 8);
const billPosition = billGeometry.attributes.position;
for (let i = 0; i < billPosition.count; i++) {
  const x = billPosition.getX(i);
  const y = billPosition.getY(i);
  const z = billPosition.getZ(i);
  const taper = 0.78 + 0.22 * (x + 1) * 0.5;
  billPosition.setXYZ(
    i,
    x * 1.38,
    y * 0.19 * taper + 0.035 * x,
    z * 0.33 * taper
  );
}
billGeometry.computeVertexNormals();
colorizeGeometry(billGeometry, 0xc69a62, 0.075, 0.03);
const bill = new THREE.Mesh(billGeometry, woodMaterial);
bill.position.set(-1.57, 3.32, 0);
bill.rotation.z = -0.025;
bill.castShadow = true;
pelican.add(bill);

const billSeamCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-2.88, 3.29, 0.255),
  new THREE.Vector3(-2.18, 3.24, 0.31),
  new THREE.Vector3(-1.45, 3.23, 0.34),
  new THREE.Vector3(-0.72, 3.24, 0.27)
]);
const billSeam = new THREE.Mesh(
  new THREE.TubeGeometry(billSeamCurve, 24, 0.014, 6, false),
  heartwoodMaterial
);
billSeam.castShadow = true;
pelican.add(billSeam);

const pouchGeometry = new THREE.SphereGeometry(1, 18, 10);
const pouchPosition = pouchGeometry.attributes.position;
for (let i = 0; i < pouchPosition.count; i++) {
  const x = pouchPosition.getX(i);
  const y = pouchPosition.getY(i);
  const z = pouchPosition.getZ(i);
  const lowerBulge = 1 + 0.17 * (1 - y) * 0.5;
  const taper = 0.72 + 0.28 * (x + 1) * 0.5;
  pouchPosition.setXYZ(
    i,
    x * 1.02,
    y * 0.61 * lowerBulge,
    z * 0.31 * taper
  );
}
pouchGeometry.computeVertexNormals();
const pouch = new THREE.Mesh(pouchGeometry, pouchMaterial);
pouch.position.set(-1.36, 2.78, 0);
pouch.rotation.z = -0.10;
pouch.castShadow = true;
pelican.add(pouch);

function makeWing(side) {
  const shape = new THREE.Shape();
  shape.moveTo(-0.40, 1.03);
  shape.bezierCurveTo(0.35, 1.24, 0.88, 0.55, 0.76, -0.18);
  shape.bezierCurveTo(0.64, -0.91, 0.08, -1.20, -0.47, -0.82);
  shape.bezierCurveTo(-0.79, -0.38, -0.76, 0.57, -0.40, 1.03);

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.10,
    bevelEnabled: true,
    bevelSegments: 2,
    bevelSize: 0.055,
    bevelThickness: 0.045,
    curveSegments: 8
  });
  geometry.center();
  colorizeGeometry(geometry, side > 0 ? 0xa86f3e : 0x9d673a, 0.11, 0.07);

  const wing = new THREE.Mesh(geometry, woodMaterial);
  wing.position.set(0.32, -0.02, side * 0.77);
  wing.rotation.y = side > 0 ? -0.08 : Math.PI + 0.08;
  wing.rotation.z = -0.08;
  wing.scale.set(0.88, 1.08, 1);
  wing.castShadow = true;
  wing.receiveShadow = true;
  pelican.add(wing);

  const edgeCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.23, 0.89, side * 0.846),
    new THREE.Vector3(0.58, 0.53, side * 0.852),
    new THREE.Vector3(0.73, -0.25, side * 0.854),
    new THREE.Vector3(0.25, -0.95, side * 0.846)
  ]);
  const edge = new THREE.Mesh(
    new THREE.TubeGeometry(edgeCurve, 22, 0.026, 6, false),
    heartwoodMaterial
  );
  edge.castShadow = true;
  pelican.add(edge);
}
makeWing(1);
makeWing(-1);

function addGrainCurve(points, radius = 0.012, colorMaterial = grooveMaterial) {
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 24, radius, 5, false),
    colorMaterial
  );
  mesh.castShadow = true;
  pelican.add(mesh);
}

addGrainCurve([
  new THREE.Vector3(-0.02, 0.54, 0.77),
  new THREE.Vector3(0.10, 1.17, 0.47),
  new THREE.Vector3(0.02, 1.88, 0.40),
  new THREE.Vector3(-0.27, 2.62, 0.38),
  new THREE.Vector3(-0.43, 3.06, 0.42)
], 0.016);

addGrainCurve([
  new THREE.Vector3(0.28, 0.64, 0.72),
  new THREE.Vector3(0.38, 1.27, 0.42),
  new THREE.Vector3(0.24, 1.91, 0.39),
  new THREE.Vector3(-0.08, 2.56, 0.40),
  new THREE.Vector3(-0.28, 3.02, 0.43)
], 0.011);

addGrainCurve([
  new THREE.Vector3(-0.64, -1.00, 0.56),
  new THREE.Vector3(-0.77, -0.43, 0.69),
  new THREE.Vector3(-0.66, 0.16, 0.73),
  new THREE.Vector3(-0.38, 0.70, 0.64)
], 0.013);

addGrainCurve([
  new THREE.Vector3(0.78, -0.82, 0.45),
  new THREE.Vector3(0.91, -0.20, 0.55),
  new THREE.Vector3(0.78, 0.45, 0.57)
], 0.012);

const eyeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x080706,
  roughness: 0.12,
  metalness: 0,
  clearcoat: 1,
  clearcoatRoughness: 0.08
});

const irisGlintMaterial = new THREE.MeshBasicMaterial({ color: 0xfff4d5 });

function addEye(side) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.105, 16, 10), eyeMaterial);
  eye.position.set(-0.73, 3.48, side * 0.465);
  eye.scale.z = 0.7;
  eye.castShadow = true;
  pelican.add(eye);

  if (side > 0) {
    const glint = new THREE.Mesh(
      new THREE.SphereGeometry(0.022, 8, 6),
      irisGlintMaterial
    );
    glint.position.set(-0.765, 3.522, 0.542);
    pelican.add(glint);
  }
}
addEye(1);
addEye(-1);

const legMaterial = new THREE.MeshStandardMaterial({
  color: 0xa87340,
  roughness: 0.62,
  flatShading: true
});

function makeLeg(x, z) {
  const leg = new THREE.Mesh(
    new THREE.CylinderGeometry(0.105, 0.13, 0.58, 7),
    legMaterial
  );
  leg.position.set(x, -1.53, z);
  leg.castShadow = true;
  pelican.add(leg);

  const footShape = new THREE.Shape();
  footShape.moveTo(-0.18, 0.18);
  footShape.lineTo(-0.02, -0.58);
  footShape.lineTo(0.10, -0.11);
  footShape.lineTo(0.32, -0.57);
  footShape.lineTo(0.30, 0.12);
  footShape.quadraticCurveTo(0.05, 0.31, -0.18, 0.18);

  const footGeometry = new THREE.ExtrudeGeometry(footShape, {
    depth: 0.08,
    bevelEnabled: true,
    bevelSegments: 1,
    bevelSize: 0.025,
    bevelThickness: 0.02,
    curveSegments: 4
  });
  const foot = new THREE.Mesh(footGeometry, legMaterial);
  foot.rotation.x = -Math.PI / 2;
  foot.rotation.z = -Math.PI / 2;
  foot.scale.set(0.72, 0.72, 0.72);
  foot.position.set(x - 0.01, -1.78, z + 0.04);
  foot.castShadow = true;
  pelican.add(foot);
}
makeLeg(-0.22, 0.30);
makeLeg(0.43, -0.26);

const tailGeometry = new THREE.ConeGeometry(0.42, 1.12, 7);
colorizeGeometry(tailGeometry, 0x9f693b, 0.1, 0.05);
const tail = new THREE.Mesh(tailGeometry, woodMaterial);
tail.position.set(0.72, -0.93, -0.06);
tail.rotation.z = -0.64;
tail.castShadow = true;
pelican.add(tail);

const gougeMaterial = new THREE.MeshStandardMaterial({
  color: 0x774827,
  roughness: 0.75
});

for (let i = 0; i < 8; i++) {
  const angle = -1.05 + i * 0.29;
  const y = -0.77 + (i % 3) * 0.34;
  const x = 0.17 + Math.cos(angle) * 0.72;
  const z = 0.67 + Math.sin(angle) * 0.10;
  const gouge = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.018, 0.19 + (i % 2) * 0.06, 3, 5),
    gougeMaterial
  );
  gouge.position.set(x, y, z);
  gouge.rotation.z = angle * 0.35;
  gouge.rotation.x = 0.12;
  pelican.add(gouge);
}

const shadowDisc = new THREE.Mesh(
  new THREE.CircleGeometry(1.55, 40),
  new THREE.MeshBasicMaterial({
    color: 0x695641,
    transparent: true,
    opacity: 0.12,
    depthWrite: false
  })
);
shadowDisc.rotation.x = -Math.PI / 2;
shadowDisc.position.set(0, -1.845, 0.08);
scene.add(shadowDisc);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  pelican.position.y = Math.sin(elapsed * 0.55) * 0.008;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
