<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Classic Metal Sewing Machine</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16171b; }
  canvas { display: block; }
  #info {
    position: fixed; left: 14px; bottom: 12px; z-index: 10;
    font: 12px/1.4 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    color: #b9bcc4; letter-spacing: .3px; opacity: .75; user-select: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="info">Classic metal sewing machine — drag to orbit · scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- Renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ---------- Scene & Camera ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17181b);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.05, 50);
camera.position.set(0.55, 0.36, 0.62);

/* ---------- Environment reflections (procedural) ---------- */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------- Lighting ---------- */
const hemi = new THREE.HemisphereLight(0xbfd0e6, 0x281c12, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3e2, 2.4);
key.position.set(0.7, 1.1, 0.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.1;
key.shadow.camera.far = 3.5;
key.shadow.camera.left = -0.45;
key.shadow.camera.right = 0.45;
key.shadow.camera.top = 0.45;
key.shadow.camera.bottom = -0.45;
key.shadow.bias = -0.0004;
key.shadow.radius = 5;
scene.add(key);
const keyTarget = new THREE.Object3D();
keyTarget.position.set(0, 0.16, 0);
scene.add(keyTarget);
key.target = keyTarget;

const fill = new THREE.DirectionalLight(0x9fb4d6, 0.6);
fill.position.set(-0.9, 0.5, 0.4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffe9cf, 1.1);
rim.position.set(-0.4, 0.7, -0.9);
scene.add(rim);

/* ---------- Procedural textures ---------- */
function makeWearTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#c2c2c2';
  g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 1600; i++) {
    const r = Math.random() * 34 + 4;
    const v = 150 + (Math.random() * 120 - 60) | 0;
    g.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',0.05)';
    g.beginPath();
    g.arc(Math.random() * 512, Math.random() * 512, r, 0, Math.PI * 2);
    g.fill();
  }
  // fine scratches (worn / rougher streaks)
  for (let i = 0; i < 90; i++) {
    const x = Math.random() * 512, y = Math.random() * 512;
    const a = Math.random() * Math.PI, len = 10 + Math.random() * 70;
    g.strokeStyle = 'rgba(230,230,230,0.10)';
    g.lineWidth = Math.random() * 1.2 + 0.3;
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2, 2);
  return t;
}

function makeDecalTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const g = c.getContext('2d');
  g.clearRect(0, 0, 1024, 512);
  const gold = 'rgba(214,176,92,0.96)';
  g.strokeStyle = gold; g.fillStyle = gold;
  g.lineCap = 'round'; g.lineJoin = 'round';

  function flourish(cx, cy, s, dir) {
    g.lineWidth = 7 * s;
    g.beginPath();
    g.moveTo(cx, cy);
    g.bezierCurveTo(cx + dir * 70 * s, cy - 55 * s, cx + dir * 150 * s, cy - 20 * s, cx + dir * 120 * s, cy + 55 * s);
    g.bezierCurveTo(cx + dir * 100 * s, cy + 110 * s, cx + dir * 30 * s, cy + 90 * s, cx + dir * 55 * s, cy + 35 * s);
    g.stroke();
    for (let i = 0; i < 5; i++) {
      const t = i / 5;
      const lx = cx + dir * (60 + i * 20) * s;
      const ly = cy - 40 * s + i * 22 * s;
      g.lineWidth = 3.5 * s;
      g.beginPath();
      g.moveTo(lx, ly);
      g.quadraticCurveTo(lx + dir * 26 * s, ly - 18 * s, lx + dir * 12 * s, ly - 34 * s);
      g.stroke();
    }
  }
  // central medallion
  g.lineWidth = 6;
  g.beginPath();
  g.ellipse(512, 256, 135, 92, 0, 0, Math.PI * 2);
  g.stroke();
  g.lineWidth = 3;
  g.beginPath();
  g.ellipse(512, 256, 110, 72, 0, 0, Math.PI * 2);
  g.stroke();
  flourish(512, 256, 1.5, 1);
  flourish(512, 256, 1.5, -1);
  // scattered dots / berries
  for (let i = 0; i < 60; i++) {
    g.beginPath();
    g.arc(Math.random() * 1024, Math.random() * 512, 2 + Math.random() * 3.5, 0, Math.PI * 2);
    g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

const wearTex = makeWearTexture();
const decalTex = makeDecalTexture();

/* ---------- Materials ---------- */
const enamel = new THREE.MeshPhysicalMaterial({
  color: 0x0b0b0e, metalness: 0.5, roughness: 0.35,
  roughnessMap: wearTex, bumpMap: wearTex, bumpScale: 0.0007,
  clearcoat: 1.0, clearcoatRoughness: 0.16, envMapIntensity: 1.0
});
const gold = new THREE.MeshStandardMaterial({ color: 0xcca23e, metalness: 1.0, roughness: 0.32, envMapIntensity: 1.2 });
const goldWorn = new THREE.MeshStandardMaterial({ color: 0xb98a30, metalness: 1.0, roughness: 0.5, roughnessMap: wearTex, envMapIntensity: 1.1 });
const steel = new THREE.MeshStandardMaterial({ color: 0xc4c8cd, metalness: 1.0, roughness: 0.25, envMapIntensity: 1.2 });
const steelWorn = new THREE.MeshStandardMaterial({ color: 0xb6b9be, metalness: 1.0, roughness: 0.42, roughnessMap: wearTex, envMapIntensity: 1.1 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xdfe3e8, metalness: 1.0, roughness: 0.12, envMapIntensity: 1.4 });
const darkMetal = new THREE.MeshStandardMaterial({ color: 0x111114, metalness: 0.8, roughness: 0.5 });
const darkRubber = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.1, roughness: 0.9 });
const thread = new THREE.MeshStandardMaterial({ color: 0x9b2f2f, metalness: 0.0, roughness: 0.7 });
const spoolWood = new THREE.MeshStandardMaterial({ color: 0xc9a06a, metalness: 0.0, roughness: 0.6 });
const decalMat = new THREE.MeshStandardMaterial({
  map: decalTex, color: 0xffffff, metalness: 0.3, roughness: 0.5,
  alphaTest: 0.35, transparent: false, side: THREE.DoubleSide,
  polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4
});

/* ---------- Build machine ---------- */
const machine = new THREE.Group();

function mkMesh(geo, mat, parent) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  (parent || machine).add(m);
  return m;
}
function cyl(rt, rb, h, mat, parent, radial) {
  return mkMesh(new THREE.CylinderGeometry(rt, rb, h, radial || 28), mat, parent);
}
function boxMesh(w, h, d, mat, parent) {
  return mkMesh(new THREE.BoxGeometry(w, h, d), mat, parent);
}
function roundedRect(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

/* --- Base plate (flat rectangular) --- */
const baseShape = roundedRect(0.44, 0.215, 0.022);
const baseGeo = new THREE.ExtrudeGeometry(baseShape, {
  depth: 0.026, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.008, bevelSegments: 3, steps: 1
});
baseGeo.rotateX(-Math.PI / 2);
mkMesh(baseGeo, enamel);

// gold border trim on the base top
const trimMat = goldWorn;
const trimY = 0.03, trimT = 0.004;
[[0, 0.088, 0.40, 0.016], [0, -0.088, 0.40, 0.016], [0.192, 0, 0.016, 0.16], [-0.192, 0, 0.016, 0.16]]
  .forEach(([px, pz, w, d]) => {
    const t = boxMesh(w, trimT, d, trimMat);
    t.position.set(px, trimY, pz);
  });

/* --- Curved cast-iron arm & body (extruded side profile) --- */
const pts = [
  [0.115, 0.03], [0.185, 0.03], [0.192, 0.09], [0.190, 0.16], [0.184, 0.215],
  [0.170, 0.255], [0.140, 0.283], [0.085, 0.298], [0.010, 0.303], [-0.065, 0.302],
  [-0.125, 0.294], [-0.163, 0.278], [-0.185, 0.248], [-0.192, 0.205], [-0.188, 0.150],
  [-0.175, 0.100], [-0.158, 0.065], [-0.135, 0.050], [-0.110, 0.052], [-0.100, 0.100],
  [-0.060, 0.130], [0.000, 0.143], [0.060, 0.145], [0.098, 0.135], [0.116, 0.105]
];
const prof = new THREE.Shape();
prof.moveTo(pts[0][0], pts[0][1]);
for (let i = 1; i < pts.length; i++) prof.lineTo(pts[i][0], pts[i][1]);
prof.closePath();
const bodyGeo = new THREE.ExtrudeGeometry(prof, {
  depth: 0.13, bevelEnabled: true, bevelThickness: 0.005, bevelSize: 0.005, bevelSegments: 3, steps: 1
});
bodyGeo.translate(0, 0, -0.065);
bodyGeo.computeVertexNormals();
mkMesh(bodyGeo, enamel);

const FRONT = 0.066; // just in front of the body's front flat face (z=0.065)

/* --- Gold decal ornaments on the body --- */
const armDecal = new THREE.Mesh(new THREE.PlaneGeometry(0.30, 0.135), decalMat);
armDecal.position.set(-0.03, 0.235, FRONT);
machine.add(armDecal);

const pillarDecal = new THREE.Mesh(new THREE.PlaneGeometry(0.095, 0.075), decalMat);
pillarDecal.position.set(0.15, 0.145, FRONT);
machine.add(pillarDecal);

/* --- Handwheel (large, right side) --- */
const hw = new THREE.Group();
machine.add(hw);
hw.position.set(0.205, 0.178, 0);
let p;
p = cyl(0.013, 0.013, 0.06, steel, hw); p.rotation.z = Math.PI / 2; p.position.x = -0.022;      // shaft into pillar
p = cyl(0.058, 0.058, 0.012, enamel, hw, 56); p.rotation.z = Math.PI / 2;                        // main disc
p = cyl(0.05, 0.03, 0.016, enamel, hw, 56); p.rotation.z = Math.PI / 2; p.position.x = -0.008;   // dish
p = mkMesh(new THREE.TorusGeometry(0.0575, 0.0075, 18, 56), steelWorn, hw); p.rotation.y = Math.PI / 2; // worn polished rim
p = cyl(0.017, 0.017, 0.05, steel, hw); p.rotation.z = Math.PI / 2; p.position.x = 0.02;         // hub
p = cyl(0.011, 0.013, 0.014, goldWorn, hw); p.rotation.z = Math.PI / 2; p.position.x = 0.032;    // stop-motion knob

/* --- Bobbin winder (front of pillar) --- */
p = cyl(0.004, 0.004, 0.022, steel, machine); p.rotation.x = Math.PI / 2; p.position.set(0.15, 0.10, FRONT + 0.006);
p = cyl(0.013, 0.013, 0.006, darkRubber, machine); p.rotation.x = Math.PI / 2; p.position.set(0.15, 0.10, FRONT + 0.012);
p = boxMesh(0.032, 0.008, 0.006, steelWorn, machine); p.position.set(0.164, 0.10, FRONT + 0.002);

/* --- Stitch-length regulator plate (worn control) --- */
p = boxMesh(0.034, 0.052, 0.006, goldWorn, machine); p.position.set(0.156, 0.205, FRONT - 0.002);
p = boxMesh(0.006, 0.032, 0.004, darkMetal, machine); p.position.set(0.156, 0.205, FRONT + 0.002);
p = cyl(0.006, 0.006, 0.009, steelWorn, machine); p.rotation.x = Math.PI / 2; p.position.set(0.156, 0.212, FRONT + 0.006);

/* --- Spool pin on top --- */
const sp = new THREE.Group();
machine.add(sp);
sp.position.set(0.05, 0.302, -0.02);
p = cyl(0.010, 0.013, 0.007, steel, sp); p.position.y = 0.0035;
p = cyl(0.0035, 0.0035, 0.078, steel, sp); p.position.y = 0.042;
p = cyl(0.011, 0.011, 0.038, thread, sp); p.position.y = 0.03;
p = cyl(0.014, 0.014, 0.004, spoolWood, sp); p.position.y = 0.012;
p = cyl(0.014, 0.014, 0.004, spoolWood, sp); p.position.y = 0.048;
p = cyl(0.005, 0.002, 0.006, goldWorn, sp); p.position.y = 0.083;

// thread guides on arm top
[[-0.02, 0.306, 0.028], [0.02, 0.306, 0.018]].forEach(([x, y, z]) => {
  p = cyl(0.0035, 0.0035, 0.012, gold, machine); p.position.set(x, y, z);
  p = mkMesh(new THREE.TorusGeometry(0.004, 0.0012, 8, 16), gold, machine); p.position.set(x, y + 0.008, z); p.rotation.x = Math.PI / 2;
});

/* --- Head: faceplate, tension dial, take-up, needle bar & presser foot --- */
// gold faceplate on head front
p = boxMesh(0.05, 0.13, 0.006, goldWorn, machine); p.position.set(-0.155, 0.115, FRONT - 0.002);
[[-0.155, 0.172], [-0.155, 0.058]].forEach(([x, y]) => {
  p = cyl(0.004, 0.004, 0.005, steelWorn, machine); p.rotation.x = Math.PI / 2; p.position.set(x, y, FRONT + 0.003);
});

// tension dial assembly
const tenX = -0.152, tenY = 0.158, tenZ = 0.066;
p = cyl(0.018, 0.018, 0.006, steel, machine); p.rotation.x = Math.PI / 2; p.position.set(tenX, tenY, tenZ + 0.004);
p = cyl(0.016, 0.016, 0.006, goldWorn, machine); p.rotation.x = Math.PI / 2; p.position.set(tenX, tenY, tenZ + 0.010);
p = cyl(0.012, 0.012, 0.008, enamel, machine); p.rotation.x = Math.PI / 2; p.position.set(tenX, tenY, tenZ + 0.016);
p = cyl(0.006, 0.006, 0.007, steelWorn, machine); p.rotation.x = Math.PI / 2; p.position.set(tenX, tenY, tenZ + 0.022);

// take-up lever nub
p = boxMesh(0.008, 0.03, 0.01, steel, machine); p.position.set(-0.163, 0.2, FRONT + 0.005);

// needle bar / presser foot group (front-left)
const nd = new THREE.Group();
machine.add(nd);
const nx = -0.135, nz = 0.072;
p = cyl(0.005, 0.005, 0.055, steel, nd); p.position.set(nx, 0.085, nz);              // needle bar
p = boxMesh(0.012, 0.012, 0.012, steelWorn, nd); p.position.set(nx, 0.058, nz);      // needle clamp
p = cyl(0.0012, 0.0004, 0.026, chrome, nd); p.position.set(nx, 0.043, nz);           // needle
p = cyl(0.004, 0.004, 0.05, steel, nd); p.position.set(nx, 0.088, nz - 0.016);       // presser bar
p = boxMesh(0.006, 0.02, 0.006, steel, nd); p.position.set(nx, 0.062, nz - 0.016);   // presser shank
p = boxMesh(0.008, 0.004, 0.03, steelWorn, nd); p.position.set(nx, 0.052, nz - 0.016); // presser foot base
p = boxMesh(0.004, 0.012, 0.006, steelWorn, nd); p.position.set(nx - 0.007, 0.058, nz - 0.022);
p = boxMesh(0.004, 0.012, 0.006, steelWorn, nd); p.position.set(nx - 0.007, 0.058, nz - 0.010);
p = cyl(0.004, 0.004, 0.008, steelWorn, nd); p.rotation.z = Math.PI / 2; p.position.set(nx + 0.01, 0.088, nz - 0.016); // thumb screw

// needle plate on the bed
p = boxMesh(0.07, 0.003, 0.055, steelWorn, machine); p.position.set(-0.13, 0.033, 0.028);
p = boxMesh(0.03, 0.0035, 0.006, darkMetal, machine); p.position.set(-0.13, 0.034, 0.028); // feed slot

/* --- a few worn screws on the body --- */
[[0.13, 0.06, FRONT + 0.002], [0.175, 0.13, FRONT + 0.002], [-0.11, 0.28, FRONT + 0.002]].forEach(([x, y, z]) => {
  p = cyl(0.005, 0.005, 0.005, steelWorn, machine); p.rotation.x = Math.PI / 2; p.position.set(x, y, z);
});

/* ---------- Recenter & place on floor ---------- */
scene.add(machine);
const bbox = new THREE.Box3().setFromObject(machine);
const center = new THREE.Vector3();
bbox.getCenter(center);
const size = new THREE.Vector3();
bbox.getSize(size);
machine.position.x -= center.x;
machine.position.z -= center.z;
machine.position.y -= bbox.min.y;
const targetY = size.y / 2;
keyTarget.position.set(0, targetY, 0);

/* ---------- Shadow-catcher ground ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 6),
  new THREE.ShadowMaterial({ opacity: 0.4 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- Controls ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 0.35;
controls.maxDistance = 2.2;
controls.minPolarAngle = 0.15;
controls.maxPolarAngle = Math.PI * 0.53;
controls.target.set(0, targetY, 0);
controls.update();

/* ---------- Resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

/* ---------- Render loop ---------- */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
