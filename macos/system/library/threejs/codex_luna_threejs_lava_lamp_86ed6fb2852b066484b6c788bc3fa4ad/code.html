<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Lava Lamp</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #090515; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090515);
scene.fog = new THREE.Fog(0x090515, 7, 14);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.3, 3.5, 6.7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 4.2;
controls.maxDistance = 9;
controls.target.set(0, 2.25, 0);

const warm = new THREE.Color(0xff3c17);
const gold = new THREE.Color(0xd68b38);
const darkMetal = new THREE.MeshStandardMaterial({
  color: 0x332725, metalness: 0.88, roughness: 0.22
});
const brushedMetal = new THREE.MeshStandardMaterial({
  color: 0x9b6c48, metalness: 0.9, roughness: 0.3
});
const glass = new THREE.MeshPhysicalMaterial({
  color: 0x8b2542,
  metalness: 0,
  roughness: 0.08,
  transmission: 0.72,
  thickness: 0.12,
  transparent: true,
  opacity: 0.3,
  side: THREE.DoubleSide,
  depthWrite: false
});
const liquidMat = new THREE.MeshPhysicalMaterial({
  color: 0x5d123f,
  roughness: 0.14,
  transmission: 0.22,
  thickness: 0.5,
  transparent: true,
  opacity: 0.75,
  emissive: 0x240018,
  emissiveIntensity: 0.5
});
const waxMat = new THREE.MeshPhysicalMaterial({
  color: 0xff5522,
  emissive: 0xff2208,
  emissiveIntensity: 1.35,
  roughness: 0.18,
  metalness: 0.02,
  transmission: 0.16,
  thickness: 0.28,
  transparent: true,
  opacity: 0.96
});

function lathe(points, material, segments = 64) {
  const geometry = new THREE.LatheGeometry(
    points.map(p => new THREE.Vector2(p[0], p[1])),
    segments
  );
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const lamp = new THREE.Group();
scene.add(lamp);

const base = lathe([
  [0.00, 0.08], [0.98, 0.08], [1.05, 0.15], [1.03, 0.28],
  [0.91, 0.42], [0.78, 0.48], [0.76, 0.64], [0.62, 0.73],
  [0.00, 0.73]
], darkMetal);
lamp.add(base);

const baseBand = new THREE.Mesh(
  new THREE.TorusGeometry(0.91, 0.065, 16, 64),
  brushedMetal
);
baseBand.position.y = 0.31;
baseBand.rotation.x = Math.PI / 2;
baseBand.castShadow = true;
lamp.add(baseBand);

const baseGlow = new THREE.Mesh(
  new THREE.CylinderGeometry(0.69, 0.75, 0.06, 64),
  new THREE.MeshBasicMaterial({ color: 0xf04d25, transparent: true, opacity: 0.32 })
);
baseGlow.position.y = 0.73;
lamp.add(baseGlow);

const vesselProfile = [
  [0, 0.73], [0.66, 0.73], [0.73, 0.82], [0.76, 1.02],
  [0.78, 1.30], [0.81, 1.75], [0.84, 2.25], [0.86, 2.78],
  [0.84, 3.20], [0.78, 3.58], [0.66, 3.88], [0.57, 4.02],
  [0.57, 4.14], [0, 4.14]
];
const vessel = lathe(vesselProfile, glass, 96);
vessel.renderOrder = 3;
lamp.add(vessel);

const liquid = lathe([
  [0, 0.81], [0.62, 0.81], [0.69, 1.03], [0.72, 1.45],
  [0.76, 2.0], [0.78, 2.55], [0.77, 3.05], [0.70, 3.48],
  [0.59, 3.74], [0, 3.74]
], liquidMat, 80);
liquid.renderOrder = 1;
lamp.add(liquid);

const rim = new THREE.Mesh(
  new THREE.TorusGeometry(0.57, 0.075, 18, 64),
  brushedMetal
);
rim.position.y = 4.11;
rim.rotation.x = Math.PI / 2;
lamp.add(rim);

const cap = lathe([
  [0, 4.11], [0.57, 4.11], [0.7, 4.2], [0.76, 4.32],
  [0.72, 4.43], [0.54, 4.5], [0, 4.5]
], darkMetal);
lamp.add(cap);

const capHighlight = new THREE.Mesh(
  new THREE.TorusGeometry(0.63, 0.045, 12, 64),
  brushedMetal
);
capHighlight.position.y = 4.34;
capHighlight.rotation.x = Math.PI / 2;
lamp.add(capHighlight);

function blobGeometry(scale, seed) {
  const g = new THREE.SphereGeometry(1, 36, 24);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const band = 1 - y * y;
    const wobble = 1 + 0.12 * Math.sin(seed + y * 5.4 + z * 2.1) * band;
    p.setX(i, x * wobble * scale.x);
    p.setY(i, (y + 0.1 * Math.sin(seed * 1.7 + x * 3.0) * band) * scale.y);
    p.setZ(i, z * wobble * scale.z);
  }
  g.computeVertexNormals();
  return g;
}

function addBlob(position, scale, seed, rotation = 0) {
  const blob = new THREE.Mesh(blobGeometry(scale, seed), waxMat);
  blob.position.copy(position);
  blob.rotation.set(0, rotation, 0);
  blob.castShadow = true;
  blob.receiveShadow = true;
  lamp.add(blob);
  const glow = new THREE.PointLight(0xff3515, 0.38, 1.55, 2);
  glow.position.copy(position);
  lamp.add(glow);
}

addBlob(new THREE.Vector3(0.02, 1.15, 0.01), new THREE.Vector3(0.34, 0.48, 0.34), 1.3);
addBlob(new THREE.Vector3(-0.13, 2.08, 0.04), new THREE.Vector3(0.28, 0.56, 0.3), 3.8, 0.6);
addBlob(new THREE.Vector3(0.16, 2.82, -0.04), new THREE.Vector3(0.39, 0.32, 0.35), 5.2, -0.4);
addBlob(new THREE.Vector3(-0.05, 3.43, 0.02), new THREE.Vector3(0.22, 0.3, 0.23), 7.1, 0.8);

const innerLight = new THREE.PointLight(0xff3215, 2.5, 4.8, 1.7);
innerLight.position.set(0, 2.25, 0.1);
lamp.add(innerLight);

const keyLight = new THREE.PointLight(0xff9b57, 55, 10, 2);
keyLight.position.set(3.6, 5.6, 4.3);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0x5e49ff, 28, 8, 2);
fillLight.position.set(-4, 3.2, -3);
scene.add(fillLight);

scene.add(new THREE.HemisphereLight(0x44266c, 0x100817, 1.6));

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(10, 64),
  new THREE.MeshStandardMaterial({ color: 0x110b1e, roughness: 0.72, metalness: 0.12 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

const halo = new THREE.Mesh(
  new THREE.CircleGeometry(2.0, 64),
  new THREE.MeshBasicMaterial({ color: 0xf0391c, transparent: true, opacity: 0.12, depthWrite: false })
);
halo.rotation.x = -Math.PI / 2;
halo.position.y = 0.012;
halo.scale.set(1.35, 0.72, 1);
scene.add(halo);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  lamp.children.forEach((child, i) => {
    if (child.isMesh && child.material === waxMat) {
      child.position.y += Math.sin(t * 0.65 + i * 1.7) * 0.0009;
      child.rotation.z = Math.sin(t * 0.55 + i) * 0.035;
    }
  });
  innerLight.intensity = 2.35 + Math.sin(t * 1.4) * 0.18;
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
