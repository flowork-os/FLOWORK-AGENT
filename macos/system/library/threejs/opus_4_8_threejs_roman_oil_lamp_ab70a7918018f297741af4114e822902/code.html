<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Roman Terracotta Oil Lamp</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0e10; }
  #c { display: block; width: 100vw; height: 100vh; }
  #label {
    position: fixed; left: 16px; bottom: 14px;
    font-family: Georgia, 'Times New Roman', serif;
    color: rgba(220,210,200,0.55); font-size: 13px; letter-spacing: 0.4px;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="label">Roman terracotta oil lamp — procedural three.js study</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------------------
// Renderer
// ---------------------------------------------------------------------------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

// ---------------------------------------------------------------------------
// Scene & studio background gradient
// ---------------------------------------------------------------------------
const scene = new THREE.Scene();

function makeBackground() {
  const c = document.createElement('canvas');
  c.width = 16; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0.0, '#26282d');
  g.addColorStop(0.45, '#17181b');
  g.addColorStop(1.0, '#0c0d0f');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 16, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
scene.background = makeBackground();

// ---------------------------------------------------------------------------
// Camera
// ---------------------------------------------------------------------------
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(8.5, 5.4, 8.8);

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.target.set(0, 1.35, 0);
controls.minDistance = 7;
controls.maxDistance = 26;
controls.minPolarAngle = 0.2;
controls.maxPolarAngle = Math.PI * 0.52;

// ---------------------------------------------------------------------------
// Procedural terracotta textures (color mottle + micro-surface bump)
// ---------------------------------------------------------------------------
function makeTerracottaMap() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#af6238';
  ctx.fillRect(0, 0, 512, 512);
  // soft firing blotches
  for (let i = 0; i < 46; i++) {
    const x = Math.random() * 512, y = Math.random() * 512, r = 40 + Math.random() * 130;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const warm = Math.random();
    g.addColorStop(0, warm > 0.5 ? 'rgba(140,74,42,0.28)' : 'rgba(196,128,86,0.24)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  // fine mineral speckle
  for (let i = 0; i < 9000; i++) {
    const x = Math.random() * 512, y = Math.random() * 512;
    if (Math.random() > 0.5)
      ctx.fillStyle = 'rgba(74,42,24,' + (0.05 + Math.random() * 0.16) + ')';
    else
      ctx.fillStyle = 'rgba(214,166,128,' + (0.04 + Math.random() * 0.12) + ')';
    ctx.fillRect(x, y, 1.5, 1.5);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2, 2);
  t.anisotropy = MAX_ANISO;
  return t;
}

function makeBumpMap() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#808080';
  ctx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 65000; i++) {
    const x = Math.random() * 512, y = Math.random() * 512;
    const v = (120 + Math.random() * 135) | 0;
    ctx.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',0.5)';
    ctx.fillRect(x, y, 1, 1);
  }
  for (let i = 0; i < 140; i++) { // tiny pores / pits
    const x = Math.random() * 512, y = Math.random() * 512, r = 1 + Math.random() * 3;
    ctx.fillStyle = 'rgba(46,46,46,0.6)';
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3, 3);
  return t;
}

const terraMap = makeTerracottaMap();
const bumpMap = makeBumpMap();

// ---------------------------------------------------------------------------
// Materials
// ---------------------------------------------------------------------------
const terracottaMat = new THREE.MeshStandardMaterial({
  map: terraMap,
  bumpMap: bumpMap,
  bumpScale: 0.012,
  color: 0xffffff,
  roughness: 0.84,
  metalness: 0.0,
  side: THREE.DoubleSide
});

const darkMat = new THREE.MeshStandardMaterial({
  color: 0x1a1109, roughness: 0.96, metalness: 0.0, side: THREE.DoubleSide
});

const sootMat = new THREE.MeshStandardMaterial({
  color: 0x120d0a, roughness: 1.0, metalness: 0.0
});

// ---------------------------------------------------------------------------
// The lamp (EXACTLY ONE centered object)
// ---------------------------------------------------------------------------
const lamp = new THREE.Group();

// -- Reservoir body: hollow lathe (outer + inner wall traced as one profile) --
const profileRaw = [
  [0.00, 0.55],  // inner floor centre
  [0.80, 0.57],
  [1.60, 0.70],
  [2.45, 1.05],
  [2.90, 1.48],  // inner belly
  [2.78, 1.78],  // inner shoulder underside
  [2.20, 1.75],
  [1.60, 1.70],  // discus underside
  [0.95, 1.78],
  [0.55, 1.90],  // inner fill lip
  [0.50, 2.05],  // rim top (inner)
  [0.62, 2.09],  // rim top (outer)
  [0.74, 2.00],  // outer fill lip
  [1.10, 1.90],  // discus dip
  [1.70, 1.86],  // discus floor
  [2.25, 1.96],
  [2.55, 2.12],  // shoulder ridge crest
  [2.98, 1.95],
  [3.32, 1.50],
  [3.50, 1.10],  // widest (flattened belly)
  [3.30, 0.66],
  [2.72, 0.28],
  [1.90, 0.05],
  [1.35, 0.00],  // foot ring
  [1.15, 0.05],
  [0.82, 0.13],
  [0.40, 0.15],
  [0.00, 0.16]   // outer bottom centre
];
const profilePts = profileRaw.map(p => new THREE.Vector2(p[0], p[1]));
const bodyGeo = new THREE.LatheGeometry(profilePts, 100);
const body = new THREE.Mesh(bodyGeo, terracottaMat);
body.castShadow = true;
body.receiveShadow = true;
lamp.add(body);

// dark reservoir interior seen through the fill port
const innerFloor = new THREE.Mesh(new THREE.CircleGeometry(0.5, 40), darkMat);
innerFloor.rotation.x = -Math.PI / 2;
innerFloor.position.y = 0.6;
lamp.add(innerFloor);

// -- Projecting spout / nozzle: tapered, flattened ellipsoid poking out front --
const spoutGeo = new THREE.SphereGeometry(1, 48, 32);
const sp = spoutGeo.attributes.position;
for (let i = 0; i < sp.count; i++) {
  let x = sp.getX(i), y = sp.getY(i), z = sp.getZ(i);
  const t = Math.max((z + 1) / 2, 0);           // 0 at back .. 1 at nozzle tip (+z)
  const taper = 1 - 0.5 * Math.pow(t, 1.4);      // narrow toward the tip
  x *= taper; y *= taper;
  sp.setX(i, x); sp.setY(i, y);
}
spoutGeo.computeVertexNormals();
const spout = new THREE.Mesh(spoutGeo, terracottaMat);
spout.scale.set(1.35, 0.70, 2.35);
spout.position.set(0, 1.5, 3.15);
spout.castShadow = true;
spout.receiveShadow = true;
lamp.add(spout);

// -- Wick opening at the nozzle tip (dark bore) --
const wick = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.7, 32, 1, false), darkMat);
wick.rotation.x = Math.PI / 2;      // bore axis -> +Z
wick.position.set(0, 1.45, 5.15);
lamp.add(wick);

// subtle soot ring / wear around the wick hole
const soot = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.07, 16, 32), sootMat);
soot.position.set(0, 1.45, 5.45);   // torus hole already faces +Z
lamp.add(soot);

// -- Small loop handle at the back --
const handle = new THREE.Mesh(new THREE.TorusGeometry(0.95, 0.28, 20, 48), terracottaMat);
handle.rotation.y = Math.PI / 2;    // opening faces sideways (±X)
handle.rotation.x = -0.12;          // slight backward lean
handle.position.set(0, 2.05, -2.75);
handle.castShadow = true;
handle.receiveShadow = true;
lamp.add(handle);

// -- Subtle decorative relief on the top disc (discus) --
// concentric raised ring-grooves
const ring1 = new THREE.Mesh(new THREE.TorusGeometry(1.35, 0.045, 12, 90), terracottaMat);
ring1.rotation.x = Math.PI / 2;
ring1.position.y = 1.90;
lamp.add(ring1);

const ring2 = new THREE.Mesh(new THREE.TorusGeometry(1.98, 0.045, 12, 110), terracottaMat);
ring2.rotation.x = Math.PI / 2;
ring2.position.y = 1.97;
lamp.add(ring2);

// ring of small raised pellets around the fill port
const dotGeo = new THREE.SphereGeometry(0.075, 14, 12);
for (let i = 0; i < 18; i++) {
  const a = (i / 18) * Math.PI * 2;
  const r = 0.92;
  const dot = new THREE.Mesh(dotGeo, terracottaMat);
  dot.position.set(Math.cos(a) * r, 1.92, Math.sin(a) * r);
  dot.castShadow = true;
  lamp.add(dot);
}

// small tooth motif between the ring grooves (very subtle)
const tickGeo = new THREE.BoxGeometry(0.10, 0.05, 0.24);
for (let i = 0; i < 24; i++) {
  const a = (i / 24) * Math.PI * 2 + 0.13;
  const r = 1.66;
  const tick = new THREE.Mesh(tickGeo, terracottaMat);
  tick.position.set(Math.cos(a) * r, 1.90, Math.sin(a) * r);
  tick.rotation.y = -a;
  lamp.add(tick);
}

// present the lamp at a pleasing default angle (auto-rotate spins it anyway)
lamp.rotation.y = -0.45;
scene.add(lamp);

// ---------------------------------------------------------------------------
// Ground plane that ONLY receives shadows
// ---------------------------------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.ShadowMaterial({ opacity: 0.38 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// ---------------------------------------------------------------------------
// Lighting: hemisphere fill + key(shadow) + fill + rim
// ---------------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0xbcc6d6, 0x30251c, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff1e0, 3.0);
key.position.set(7, 10, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 40;
key.shadow.camera.left = -10;
key.shadow.camera.right = 10;
key.shadow.camera.top = 10;
key.shadow.camera.bottom = -10;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
key.target.position.set(0, 1.0, 0);
scene.add(key);
scene.add(key.target);

const fill = new THREE.DirectionalLight(0x9fb4d8, 0.7);
fill.position.set(-8, 5, 4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffe9d0, 1.6);
rim.position.set(-4, 6, -9);
scene.add(rim);

// ---------------------------------------------------------------------------
// Resize handling
// ---------------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------------------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
