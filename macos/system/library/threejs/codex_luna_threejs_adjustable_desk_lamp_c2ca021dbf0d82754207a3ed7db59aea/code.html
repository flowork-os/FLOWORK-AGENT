<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adjustable Desk Lamp</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #15181c; }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 24px;
      top: 20px;
      color: #d8dce0;
      font: 500 13px/1.5 system-ui, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: .72;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Adjustable Desk Lamp · 1930s Articulated Form</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x15181c);
    scene.fog = new THREE.Fog(0x15181c, 900, 1800);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 1, 3000);
    camera.position.set(920, 690, 1050);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.6;
    controls.target.set(90, 330, 0);
    controls.minDistance = 500;
    controls.maxDistance = 1700;
    controls.maxPolarAngle = Math.PI * 0.48;

    const metal = new THREE.MeshStandardMaterial({
      color: 0x5d646a,
      metalness: 0.78,
      roughness: 0.28
    });

    const darkMetal = new THREE.MeshStandardMaterial({
      color: 0x20252a,
      metalness: 0.85,
      roughness: 0.24
    });

    const springMaterial = new THREE.MeshStandardMaterial({
      color: 0x91999e,
      metalness: 0.9,
      roughness: 0.2
    });

    const shadeMaterial = new THREE.MeshStandardMaterial({
      color: 0x4c555b,
      metalness: 0.7,
      roughness: 0.33,
      side: THREE.DoubleSide
    });

    const innerShadeMaterial = new THREE.MeshStandardMaterial({
      color: 0xaaa08b,
      metalness: 0.15,
      roughness: 0.45,
      side: THREE.DoubleSide
    });

    const rubber = new THREE.MeshStandardMaterial({
      color: 0x111416,
      metalness: 0.05,
      roughness: 0.8
    });

    const brass = new THREE.MeshStandardMaterial({
      color: 0xc18a42,
      metalness: 0.82,
      roughness: 0.24
    });

    const warmBulb = new THREE.MeshStandardMaterial({
      color: 0xffc979,
      emissive: 0xff8b2d,
      emissiveIntensity: 2.4,
      roughness: 0.3
    });

    function cylinderBetween(start, end, radius, material, radialSegments = 24) {
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();
      const geometry = new THREE.CylinderGeometry(radius, radius, length, radialSegments);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function springBetween(start, end, radius = 1.8, turns = 16) {
      const axis = new THREE.Vector3().subVectors(end, start);
      const length = axis.length();
      const points = [];
      const samples = turns * 12;
      for (let i = 0; i <= samples; i++) {
        const t = i / samples;
        const angle = t * turns * Math.PI * 2;
        const localRadius = 8.5;
        points.push(new THREE.Vector3(
          Math.cos(angle) * localRadius,
          (t - 0.5) * length,
          Math.sin(angle) * localRadius
        ));
      }
      const curve = new THREE.CatmullRomCurve3(points);
      const geometry = new THREE.TubeGeometry(curve, samples, radius, 7, false);
      const mesh = new THREE.Mesh(geometry, springMaterial);
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        axis.normalize()
      );
      mesh.castShadow = true;
      return mesh;
    }

    function pivot(point, radius = 22) {
      const group = new THREE.Group();
      group.position.copy(point);

      const axle = new THREE.Mesh(
        new THREE.CylinderGeometry(radius * 0.42, radius * 0.42, 54, 32),
        darkMetal
      );
      axle.rotation.x = Math.PI / 2;
      axle.castShadow = true;
      group.add(axle);

      const capA = new THREE.Mesh(
        new THREE.CylinderGeometry(radius * 0.65, radius * 0.65, 7, 32),
        brass
      );
      capA.rotation.x = Math.PI / 2;
      capA.position.z = 27;
      capA.castShadow = true;
      group.add(capA);

      const capB = capA.clone();
      capB.position.z = -27;
      group.add(capB);

      const central = new THREE.Mesh(
        new THREE.SphereGeometry(radius * 0.7, 32, 20),
        metal
      );
      central.castShadow = true;
      group.add(central);

      scene.add(group);
    }

    const base = new THREE.Group();

    const baseBody = new THREE.Mesh(
      new THREE.CylinderGeometry(108, 116, 30, 96),
      darkMetal
    );
    baseBody.position.y = 15;
    baseBody.castShadow = true;
    baseBody.receiveShadow = true;
    base.add(baseBody);

    const baseTop = new THREE.Mesh(
      new THREE.CylinderGeometry(96, 104, 9, 96),
      metal
    );
    baseTop.position.y = 34;
    baseTop.castShadow = true;
    base.add(baseTop);

    const baseRim = new THREE.Mesh(
      new THREE.TorusGeometry(108, 5.5, 14, 96),
      brass
    );
    baseRim.rotation.x = Math.PI / 2;
    baseRim.position.y = 28;
    baseRim.castShadow = true;
    base.add(baseRim);

    const neck = new THREE.Mesh(
      new THREE.CylinderGeometry(25, 31, 35, 48),
      metal
    );
    neck.position.y = 54;
    neck.castShadow = true;
    base.add(neck);

    const neckCollar = new THREE.Mesh(
      new THREE.TorusGeometry(27, 4, 12, 48),
      brass
    );
    neckCollar.rotation.x = Math.PI / 2;
    neckCollar.position.y = 69;
    neckCollar.castShadow = true;
    base.add(neckCollar);

    for (let i = 0; i < 4; i++) {
      const angle = i * Math.PI / 2 + Math.PI / 4;
      const foot = new THREE.Mesh(
        new THREE.CylinderGeometry(15, 17, 8, 24),
        rubber
      );
      foot.position.set(Math.cos(angle) * 76, -3, Math.sin(angle) * 76);
      foot.castShadow = true;
      base.add(foot);
    }

    scene.add(base);

    const p0 = new THREE.Vector3(0, 72, 0);
    const p1 = new THREE.Vector3(-12, 348, 0);
    const p2 = new THREE.Vector3(244, 590, 0);
    const p3 = new THREE.Vector3(444, 500, 0);

    const armOffset = 18;
    const armRadius = 7.5;

    for (const offset of [-armOffset, armOffset]) {
      scene.add(cylinderBetween(
        new THREE.Vector3(p0.x, p0.y, p0.z + offset),
        new THREE.Vector3(p1.x, p1.y, p1.z + offset),
        armRadius,
        metal
      ));
      scene.add(cylinderBetween(
        new THREE.Vector3(p1.x, p1.y, p1.z + offset),
        new THREE.Vector3(p2.x, p2.y, p2.z + offset),
        armRadius,
        metal
      ));
    }

    scene.add(springBetween(
      new THREE.Vector3(p0.x, p0.y + 28, p0.z),
      new THREE.Vector3(p1.x, p1.y - 28, p1.z),
      2.2,
      20
    ));

    scene.add(springBetween(
      new THREE.Vector3(p1.x, p1.y + 30, p1.z),
      new THREE.Vector3(p2.x, p2.y - 30, p2.z),
      2.2,
      18
    ));

    scene.add(cylinderBetween(p2, p3, 10, darkMetal));
    scene.add(cylinderBetween(
      new THREE.Vector3(p2.x, p2.y, p2.z - 23),
      new THREE.Vector3(p3.x, p3.y, p3.z - 23),
      5.5,
      metal
    ));

    pivot(p0, 23);
    pivot(p1, 24);
    pivot(p2, 25);

    const shadeGroup = new THREE.Group();
    const shadeDirection = new THREE.Vector3(0.22, -1, 0.04).normalize();
    shadeGroup.position.copy(p3);
    shadeGroup.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      shadeDirection.clone().negate()
    );

    const shade = new THREE.Mesh(
      new THREE.ConeGeometry(82, 105, 64, 1, true),
      shadeMaterial
    );
    shade.position.y = 53;
    shade.castShadow = true;
    shade.receiveShadow = true;
    shadeGroup.add(shade);

    const innerShade = new THREE.Mesh(
      new THREE.ConeGeometry(76, 98, 64, 1, true),
      innerShadeMaterial
    );
    innerShade.position.y = 51;
    shadeGroup.add(innerShade);

    const shadeRim = new THREE.Mesh(
      new THREE.TorusGeometry(80, 5, 14, 64),
      brass
    );
    shadeRim.rotation.x = Math.PI / 2;
    shadeRim.position.y = 0;
    shadeRim.castShadow = true;
    shadeGroup.add(shadeRim);

    const shadeTopRing = new THREE.Mesh(
      new THREE.TorusGeometry(17, 4, 12, 36),
      brass
    );
    shadeTopRing.rotation.x = Math.PI / 2;
    shadeTopRing.position.y = 104;
    shadeTopRing.castShadow = true;
    shadeGroup.add(shadeTopRing);

    const bulb = new THREE.Mesh(
      new THREE.SphereGeometry(24, 32, 20),
      warmBulb
    );
    bulb.position.y = 17;
    bulb.castShadow = true;
    shadeGroup.add(bulb);

    const bulbSocket = new THREE.Mesh(
      new THREE.CylinderGeometry(14, 17, 24, 32),
      brass
    );
    bulbSocket.position.y = 43;
    bulbSocket.castShadow = true;
    shadeGroup.add(bulbSocket);

    const lampLight = new THREE.PointLight(0xffb35b, 95, 620, 1.65);
    lampLight.position.set(0, 20, 0);
    lampLight.castShadow = true;
    lampLight.shadow.mapSize.set(1024, 1024);
    lampLight.shadow.bias = -0.0005;
    shadeGroup.add(lampLight);

    scene.add(shadeGroup);

    const desk = new THREE.Mesh(
      new THREE.PlaneGeometry(2400, 1800),
      new THREE.MeshStandardMaterial({
        color: 0x272d31,
        metalness: 0.05,
        roughness: 0.62
      })
    );
    desk.rotation.x = -Math.PI / 2;
    desk.position.y = -8;
    desk.receiveShadow = true;
    scene.add(desk);

    const backWall = new THREE.Mesh(
      new THREE.PlaneGeometry(2400, 1400),
      new THREE.MeshStandardMaterial({
        color: 0x20252a,
        metalness: 0,
        roughness: 0.9
      })
    );
    backWall.position.set(0, 690, -430);
    backWall.rotation.x = 0;
    backWall.receiveShadow = true;
    scene.add(backWall);

    const hemisphere = new THREE.HemisphereLight(0x93a5b8, 0x25201a, 1.5);
    scene.add(hemisphere);

    const keyLight = new THREE.DirectionalLight(0xffead0, 3.4);
    keyLight.position.set(-500, 900, 650);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -700;
    keyLight.shadow.camera.right = 700;
    keyLight.shadow.camera.top = 1100;
    keyLight.shadow.camera.bottom = -100;
    keyLight.shadow.camera.near = 100;
    keyLight.shadow.camera.far = 2200;
    keyLight.shadow.bias = -0.00025;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x7894b5, 1.4);
    rimLight.position.set(650, 500, -700);
    scene.add(rimLight);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
