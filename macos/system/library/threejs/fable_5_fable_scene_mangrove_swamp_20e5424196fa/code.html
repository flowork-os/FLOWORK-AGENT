<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mangrove Swamp Waterway</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c2616; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   CONFIG & PALETTE — every tunable in one place
   ============================================================ */
const CFG = {
  seed: 20260815,
  fogColor: 0x2f3d25, fogDensity: 0.016,
  sunDir: new THREE.Vector3(18, 30, 10),
  autoRotateSpeed: 0.8
};
const PAL = {
  water: 0x54431f, mud: 0x4a3a26, bark: 0x4d3c2b,          // tea blackwater + silt + trunks
  moss: 0x8a9a72, vine: 0x5c6e38, plank: 0x6e6350,         // spanish moss / vines / grey wood
  reed: 0x6d7c3e, cattail: 0x5b3f22, lily: 0x3f6127,
  lilyFlower: 0xe8d7e2, heron: 0x9aa4ab, heronBeak: 0xc9a24b,
  lanternGlow: 0xffb066, shaft: 0xa8d67f, mist: 0xdfe8cf
};

/* ============================================================
   SEEDED PRNG & HELPERS — all randomness routed through rand()
   ============================================================ */
function mulberry32(seed) {
  return function () {
    let t = (seed += 0x6D2B79F5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(CFG.seed);
const rr = (a, b) => a + rand() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = (arr) => arr[ri(0, arr.length - 1)];
const dummy = new THREE.Object3D();
function mesh(geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  return m;
}
function makeCanvas(size, painter) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  painter(c.getContext('2d'), size);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ============================================================
   RENDERER / SCENE / CAMERA / CONTROLS
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(CFG.fogColor, CFG.fogDensity);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 300);
camera.position.set(13, 8.5, 16);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = CFG.autoRotateSpeed;
controls.minDistance = 9;
controls.maxDistance = 34;
controls.maxPolarAngle = 1.46;
controls.minPolarAngle = 0.15;

/* ============================================================
   PROCEDURAL CANVAS TEXTURES
   ============================================================ */
const waterTex = makeCanvas(512, (ctx, s) => {
  ctx.fillStyle = '#4d3d1c'; ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 180; i++) {                    // dark tannin swirls
    ctx.fillStyle = `rgba(38,29,12,${rr(0.05, 0.18)})`;
    ctx.beginPath(); ctx.ellipse(rr(0, s), rr(0, s), rr(20, 90), rr(6, 22), rr(0, 6.3), 0, 6.3); ctx.fill();
  }
  for (let i = 0; i < 120; i++) {                    // pale sheen streaks
    ctx.strokeStyle = `rgba(140,120,70,${rr(0.03, 0.1)})`; ctx.lineWidth = rr(1, 3);
    const x = rr(0, s), y = rr(0, s);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + rr(30, 110), y + rr(-6, 6)); ctx.stroke();
  }
});
waterTex.repeat.set(3, 3);

const barkTex = makeCanvas(256, (ctx, s) => {
  ctx.fillStyle = '#4a3b2c'; ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 160; i++) {                    // vertical fissures
    ctx.strokeStyle = rand() < 0.5 ? `rgba(30,22,14,${rr(0.2, 0.5)})` : `rgba(110,90,64,${rr(0.1, 0.3)})`;
    ctx.lineWidth = rr(1, 4);
    const x = rr(0, s);
    ctx.beginPath(); ctx.moveTo(x, -10); ctx.lineTo(x + rr(-18, 18), s + 10); ctx.stroke();
  }
});

const plankTex = makeCanvas(256, (ctx, s) => {
  ctx.fillStyle = '#6e6350'; ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 90; i++) {                     // weathered grain
    ctx.strokeStyle = rand() < 0.6 ? `rgba(70,62,47,${rr(0.2, 0.45)})` : `rgba(140,128,102,${rr(0.12, 0.3)})`;
    ctx.lineWidth = rr(1, 3);
    const y = rr(0, s);
    ctx.beginPath(); ctx.moveTo(-10, y); ctx.lineTo(s + 10, y + rr(-8, 8)); ctx.stroke();
  }
  for (let i = 0; i < 8; i++) {                      // knots
    ctx.fillStyle = 'rgba(52,44,32,0.6)';
    ctx.beginPath(); ctx.arc(rr(0, s), rr(0, s), rr(3, 7), 0, 6.3); ctx.fill();
  }
});

const canopyTex = makeCanvas(256, (ctx, s) => {
  ctx.fillStyle = '#2e4420'; ctx.fillRect(0, 0, s, s);
  const tones = ['#3a5526', '#46662c', '#2a3d1c', '#55763a'];
  for (let i = 0; i < 420; i++) {                    // leafy mottle
    ctx.fillStyle = pick(tones); ctx.globalAlpha = rr(0.3, 0.8);
    ctx.beginPath(); ctx.ellipse(rr(0, s), rr(0, s), rr(4, 14), rr(3, 8), rr(0, 6.3), 0, 6.3); ctx.fill();
  }
  ctx.globalAlpha = 1;
});

const mistTex = makeCanvas(128, (ctx, s) => {
  const g = ctx.createRadialGradient(s / 2, s / 2, 4, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(255,255,255,0.85)');
  g.addColorStop(0.55, 'rgba(255,255,255,0.28)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
});

const skyTex = makeCanvas(256, (ctx, s) => {
  const g = ctx.createLinearGradient(0, 0, 0, s);
  g.addColorStop(0, '#1f2b18');                      // dark canopy zenith
  g.addColorStop(0.45, '#3d4d2b');
  g.addColorStop(0.78, '#7e9160');
  g.addColorStop(1, '#b3bd90');                      // pale humid horizon
  ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
});

/* ============================================================
   MATERIALS — one style-consistent set
   ============================================================ */
const MAT = {
  water: new THREE.MeshStandardMaterial({ color: PAL.water, map: waterTex, roughness: 0.08, metalness: 0.05 }),
  mud: new THREE.MeshStandardMaterial({ color: PAL.mud, roughness: 0.95, flatShading: true }),
  bark: new THREE.MeshStandardMaterial({ color: PAL.bark, map: barkTex, roughness: 0.9 }),
  leaf: new THREE.MeshStandardMaterial({ color: 0xffffff, map: canopyTex, roughness: 0.85, flatShading: true }),
  moss: new THREE.MeshStandardMaterial({ color: PAL.moss, roughness: 1 }),
  vine: new THREE.MeshStandardMaterial({ color: PAL.vine, roughness: 0.9 }),
  plank: new THREE.MeshStandardMaterial({ color: 0xffffff, map: plankTex, roughness: 0.85 }),
  darkWood: new THREE.MeshStandardMaterial({ color: 0x51473a, map: plankTex, roughness: 0.9 }),
  rope: new THREE.MeshStandardMaterial({ color: 0x8a7a55, roughness: 1 }),
  reed: new THREE.MeshStandardMaterial({ color: PAL.reed, roughness: 0.9 }),
  cattail: new THREE.MeshStandardMaterial({ color: PAL.cattail, roughness: 1 }),
  lily: new THREE.MeshStandardMaterial({ color: PAL.lily, roughness: 0.7, side: THREE.DoubleSide }),
  flower: new THREE.MeshStandardMaterial({ color: PAL.lilyFlower, roughness: 0.6, emissive: 0x3a2f3a, emissiveIntensity: 0.2 }),
  heron: new THREE.MeshStandardMaterial({ color: PAL.heron, roughness: 0.8 }),
  heronDark: new THREE.MeshStandardMaterial({ color: 0x4a5258, roughness: 0.8 }),
  beak: new THREE.MeshStandardMaterial({ color: PAL.heronBeak, roughness: 0.6 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x3b3b38, roughness: 0.5, metalness: 0.8 }),
  lanternGlass: new THREE.MeshStandardMaterial({ color: 0xffdca0, emissive: PAL.lanternGlow, emissiveIntensity: 2.2, roughness: 0.4, transparent: true, opacity: 0.9 }),
  shaft: new THREE.MeshBasicMaterial({ color: PAL.shaft, transparent: true, opacity: 0.07, blending: THREE.AdditiveBlending, depthWrite: false, fog: false, side: THREE.DoubleSide }),
  dragonBody: new THREE.MeshStandardMaterial({ color: 0x2e6f7a, roughness: 0.4, metalness: 0.3 }),
  dragonWing: new THREE.MeshBasicMaterial({ color: 0xcfe4e8, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false })
};

/* ============================================================
   ANIMATION REGISTRIES
   ============================================================ */
const swayers = [];      // {obj, axis, amp, speed, phase}
const flickers = [];     // lantern light + emissive glass
const dragonflies = [];  // animated flyers
const mists = [];        // orbiting fog sprites
const shaftMats = [];    // pulsing god-ray materials
const mossAnchors = [];  // canopy points collected while building trees

/* ============================================================
   BUILDER FUNCTIONS — each returns a THREE.Group
   ============================================================ */
function buildSkyAndWater() {
  const g = new THREE.Group();
  g.add(mesh(new THREE.SphereGeometry(92, 24, 14), new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false })));
  const water = mesh(new THREE.PlaneGeometry(150, 150), MAT.water);
  water.rotation.x = -Math.PI / 2;
  water.receiveShadow = true;
  g.add(water);
  const bed = mesh(new THREE.CircleGeometry(76, 40), MAT.mud, 0, -0.5, 0);
  bed.rotation.x = -Math.PI / 2;
  g.add(bed);
  return g;
}

function buildBank(rx, ry, rz) {
  const g = new THREE.Group();
  const mound = mesh(new THREE.SphereGeometry(1, 8, 6), MAT.mud, 0, -ry * 0.55, 0);
  mound.scale.set(rx, ry, rz);
  mound.rotation.y = rr(0, Math.PI);
  mound.castShadow = mound.receiveShadow = true;
  g.add(mound);
  return g;
}

function buildMangroveTree(sc) {
  const g = new THREE.Group();
  const trunkH = rr(4.5, 6) * sc;
  const trunkTop = 1.4 + trunkH;
  // arching stilt roots: bezier tubes from the trunk waist down into the water
  const nRoots = ri(6, 9);
  for (let i = 0; i < nRoots; i++) {
    const ang = (i / nRoots) * Math.PI * 2 + rr(-0.2, 0.2);
    const spread = rr(1.5, 2.9) * sc;
    const curve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(rr(-0.1, 0.1), rr(1.5, 2.2), rr(-0.1, 0.1)),
      new THREE.Vector3(Math.cos(ang) * spread * 0.7, rr(0.9, 1.5), Math.sin(ang) * spread * 0.7),
      new THREE.Vector3(Math.cos(ang) * spread, -0.5, Math.sin(ang) * spread));
    const root = mesh(new THREE.TubeGeometry(curve, 10, rr(0.07, 0.13) * sc, 5), MAT.bark);
    root.castShadow = true; g.add(root);
  }
  // leaning trunk
  const trunk = mesh(new THREE.CylinderGeometry(0.18 * sc, 0.3 * sc, trunkH, 7), MAT.bark, 0, 1.4 + trunkH / 2, 0);
  trunk.rotation.z = rr(-0.07, 0.07);
  trunk.castShadow = true; g.add(trunk);
  // canopy blobs; collect moss anchor points under each
  const nBlobs = ri(3, 4);
  for (let i = 0; i < nBlobs; i++) {
    const bx = rr(-1.6, 1.6) * sc, bz = rr(-1.6, 1.6) * sc, by = trunkTop + rr(-0.6, 0.9);
    const blob = mesh(new THREE.IcosahedronGeometry(1, 1), MAT.leaf, bx, by, bz);
    blob.scale.set(rr(1.5, 2.4) * sc, rr(0.8, 1.2) * sc, rr(1.5, 2.4) * sc);
    blob.rotation.set(rr(0, 3), rr(0, 3), rr(0, 3));
    blob.castShadow = true; g.add(blob);
    for (let m = 0; m < 4; m++) {
      mossAnchors.push(new THREE.Vector3(bx + rr(-1.4, 1.4) * sc, by - rr(0.5, 0.9), bz + rr(-1.4, 1.4) * sc));
    }
  }
  // hanging vines on sway pivots
  const nVines = ri(2, 3);
  for (let v = 0; v < nVines; v++) {
    const len = rr(2.2, 3.8);
    const pts = [new THREE.Vector3(0, 0, 0)];
    for (let k = 1; k <= 4; k++) pts.push(new THREE.Vector3(rr(-0.3, 0.3), -len * (k / 4), rr(-0.3, 0.3)));
    const vine = mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 10, 0.028, 4), MAT.vine);
    const pivot = new THREE.Group();
    pivot.position.set(rr(-1.4, 1.4) * sc, trunkTop + rr(-0.4, 0.3), rr(-1.4, 1.4) * sc);
    pivot.add(vine); g.add(pivot);
    swayers.push({ obj: pivot, axis: 'z', amp: rr(0.03, 0.07), speed: rr(0.4, 0.7), phase: rr(0, 6.3) });
  }
  return g;
}

function buildCanopyCeiling() {
  // dense overhead foliage ring with a central gap for the light shafts
  const g = new THREE.Group();
  for (let i = 0; i < 14; i++) {
    const ang = rr(0, Math.PI * 2), rad = rr(7, 18);
    const blob = mesh(new THREE.IcosahedronGeometry(1, 1), MAT.leaf, Math.cos(ang) * rad, rr(11, 13.5), Math.sin(ang) * rad);
    blob.scale.set(rr(3.5, 6.5), rr(1.1, 1.7), rr(3.5, 6.5));
    blob.rotation.set(rr(0, 3), rr(0, 3), rr(0, 3));
    blob.castShadow = true; g.add(blob);
  }
  return g;
}

function buildBoat() {
  const g = new THREE.Group();
  g.add(mesh(new THREE.BoxGeometry(3.2, 0.09, 1.15), MAT.plank, 0, 0.18, 0));
  for (const side of [-1, 1]) {
    const wall = mesh(new THREE.BoxGeometry(3.2, 0.5, 0.06), MAT.plank, 0, 0.42, side * 0.62);
    wall.rotation.x = side * -0.2; g.add(wall);
    g.add(mesh(new THREE.BoxGeometry(3.3, 0.05, 0.1), MAT.darkWood, 0, 0.66, side * 0.67));
  }
  for (const end of [-1, 1]) {
    const transom = mesh(new THREE.BoxGeometry(0.06, 0.52, 1.1), MAT.plank, end * 1.58, 0.42, 0);
    transom.rotation.z = end * -0.45; g.add(transom);
  }
  for (const sx of [-0.75, 0.75]) g.add(mesh(new THREE.BoxGeometry(0.5, 0.05, 1.05), MAT.darkWood, sx, 0.5, 0));
  const pole = mesh(new THREE.CylinderGeometry(0.028, 0.028, 4.0, 6), MAT.darkWood, -0.5, 0.72, 0.15);
  pole.rotation.set(0.12, 0, 1.35); g.add(pole);
  // lantern hung from a raked bow rod
  const rod = mesh(new THREE.CylinderGeometry(0.022, 0.022, 1.15, 6), MAT.metal, 1.45, 1.1, 0);
  rod.rotation.z = -0.35; g.add(rod);
  const lant = new THREE.Group();
  lant.position.set(1.66, 1.58, 0);
  const glass = mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.17, 8), MAT.lanternGlass.clone());
  const ring = mesh(new THREE.TorusGeometry(0.045, 0.011, 6, 12), MAT.metal, 0, 0.19, 0);
  const light = new THREE.PointLight(PAL.lanternGlow, 5, 11, 2);
  light.position.y = 0.02;
  lant.add(mesh(new THREE.CylinderGeometry(0.055, 0.1, 0.07, 8), MAT.metal, 0, 0.12, 0));
  lant.add(mesh(new THREE.CylinderGeometry(0.1, 0.08, 0.06, 8), MAT.metal, 0, -0.12, 0));
  lant.add(glass, ring, light);
  g.add(lant);
  flickers.push({ light, glass: glass.material, baseI: 5, phase: rr(0, 6.3) });
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return g;
}

function buildHeron(stalking) {
  const g = new THREE.Group();
  for (const lx of [-0.09, 0.09]) g.add(mesh(new THREE.CylinderGeometry(0.016, 0.02, 0.85, 5), MAT.heronDark, lx, 0.425, lx * 1.5));
  const body = mesh(new THREE.SphereGeometry(0.3, 10, 8), MAT.heron, 0, 1.0, 0);
  body.scale.set(1.55, 0.95, 0.9);
  body.rotation.z = -0.15; g.add(body);
  const tail = mesh(new THREE.ConeGeometry(0.12, 0.5, 6), MAT.heronDark, -0.5, 1.05, 0);
  tail.rotation.z = -1.85; g.add(tail);
  // s-curved neck + head on a poseable pivot
  const neckPivot = new THREE.Group();
  neckPivot.position.set(0.35, 1.1, 0);
  const neckPts = stalking
    ? [new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.24, 0.22, 0), new THREE.Vector3(0.44, 0.16, 0), new THREE.Vector3(0.58, -0.02, 0)]
    : [new THREE.Vector3(0, 0, 0), new THREE.Vector3(0.14, 0.3, 0), new THREE.Vector3(0.1, 0.58, 0), new THREE.Vector3(0.26, 0.74, 0)];
  neckPivot.add(mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(neckPts), 10, 0.05, 6), MAT.heron));
  const hp = neckPts[3];
  neckPivot.add(mesh(new THREE.SphereGeometry(0.085, 8, 7), MAT.heron, hp.x, hp.y, 0));
  const beak = mesh(new THREE.ConeGeometry(0.03, 0.38, 6), MAT.beak, hp.x + 0.19, hp.y - (stalking ? 0.1 : 0.02), 0);
  beak.rotation.z = stalking ? -2.05 : -1.68;
  neckPivot.add(beak);
  const crest = mesh(new THREE.ConeGeometry(0.02, 0.16, 5), MAT.heronDark, hp.x - 0.08, hp.y + 0.04, 0);
  crest.rotation.z = 1.9;
  neckPivot.add(crest);
  g.add(neckPivot);
  swayers.push({ obj: neckPivot, axis: 'z', amp: 0.05, speed: 0.5, phase: rr(0, 6.3) });
  g.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return g;
}

function buildWalkway() {
  const g = new THREE.Group();
  const path = new THREE.CatmullRomCurve3([
    new THREE.Vector3(9.5, 0, 12), new THREE.Vector3(8, 0, 6), new THREE.Vector3(7.2, 0, 0),
    new THREE.Vector3(8.2, 0, -6), new THREE.Vector3(9.8, 0, -11)]);
  const railTops = [];
  for (let i = 0; i < 30; i++) {
    const t = i / 29;
    const p = path.getPointAt(t), tan = path.getTangentAt(t);
    const yaw = Math.atan2(tan.x, tan.z);
    const plank = mesh(new THREE.BoxGeometry(1.7, 0.055, 0.5), MAT.plank, p.x + rr(-0.05, 0.05), 0.72 + rr(-0.03, 0.04), p.z);
    plank.rotation.set(rr(-0.04, 0.04), yaw, rr(-0.06, 0.06));       // rickety wobble
    plank.castShadow = plank.receiveShadow = true;
    g.add(plank);
    if (i % 3 === 0) for (const side of [-1, 1]) {                   // crooked pilings
      const off = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)).multiplyScalar(side * 0.72);
      const post = mesh(new THREE.CylinderGeometry(0.05, 0.075, 1.6, 6), MAT.darkWood, p.x + off.x, 0.35, p.z + off.z);
      post.rotation.set(rr(-0.05, 0.05), 0, rr(-0.05, 0.05));
      post.castShadow = true; g.add(post);
    }
    if (i % 4 === 0) {                                               // outer rail posts
      const off = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)).multiplyScalar(0.8);
      const rail = mesh(new THREE.CylinderGeometry(0.035, 0.045, 0.95, 6), MAT.darkWood, p.x + off.x, 1.2, p.z + off.z);
      rail.rotation.z = rr(-0.08, 0.08);
      rail.castShadow = true; g.add(rail);
      railTops.push(new THREE.Vector3(p.x + off.x, 1.66, p.z + off.z));
    }
  }
  // sagging rope strung between rail posts
  const ropePts = [];
  for (let i = 0; i < railTops.length; i++) {
    ropePts.push(railTops[i]);
    if (i < railTops.length - 1) {
      const mid = railTops[i].clone().add(railTops[i + 1]).multiplyScalar(0.5);
      mid.y -= 0.16;
      ropePts.push(mid);
    }
  }
  g.add(mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(ropePts), 60, 0.018, 5), MAT.rope));
  return g;
}

function buildReeds() {
  const g = new THREE.Group();
  const clusters = [[-8.5, 1.5], [-6, 10.5], [8, -4.5], [11, 6.5], [-9, -9], [5, 11.5], [10.5, -9], [-11.5, -5]];
  const perCluster = 26;
  const reedGeo = new THREE.CylinderGeometry(0.006, 0.038, 1, 5);
  reedGeo.translate(0, 0.5, 0);
  const reeds = new THREE.InstancedMesh(reedGeo, MAT.reed, clusters.length * perCluster);
  const cats = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.045, 0.045, 0.28, 6), MAT.cattail, 60);
  let idx = 0, cIdx = 0;
  const color = new THREE.Color();
  for (const [cx, cz] of clusters) for (let i = 0; i < perCluster; i++) {
    const x = cx + rr(-1.4, 1.4), z = cz + rr(-1.4, 1.4), h = rr(1.1, 2.1);
    dummy.position.set(x, -0.05, z);
    dummy.rotation.set(rr(-0.12, 0.12), rr(0, 6.3), rr(-0.12, 0.12));
    dummy.scale.set(1, h, 1);
    dummy.updateMatrix();
    reeds.setMatrixAt(idx, dummy.matrix);
    reeds.setColorAt(idx, color.setHex(PAL.reed).offsetHSL(rr(-0.03, 0.03), rr(-0.08, 0.08), rr(-0.06, 0.06)));
    idx++;
    if (i % 12 === 0 && cIdx < 60) {                 // occasional cattail head
      dummy.position.set(x, h - 0.1, z);
      dummy.rotation.set(0, 0, rr(-0.1, 0.1));
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      cats.setMatrixAt(cIdx, dummy.matrix);
      cIdx++;
    }
  }
  cats.count = cIdx;
  reeds.instanceColor.needsUpdate = true;
  reeds.castShadow = true;
  g.add(reeds, cats);
  return g;
}

function buildLilyPads() {
  const g = new THREE.Group();
  const shape = new THREE.Shape();                   // round pad with a cut notch
  shape.moveTo(0, 0);
  shape.absarc(0, 0, 1, 0.25, Math.PI * 2 - 0.25, false);
  shape.lineTo(0, 0);
  const padGeo = new THREE.ShapeGeometry(shape, 20);
  padGeo.rotateX(-Math.PI / 2);
  const patches = [[-5.5, 6.5], [4.5, 6.0], [-6, -6], [7, -3], [0, -10], [-2.5, 10.5]];
  const perPatch = 14;
  const pads = new THREE.InstancedMesh(padGeo, MAT.lily, patches.length * perPatch);
  const flowers = new THREE.InstancedMesh(new THREE.ConeGeometry(0.14, 0.2, 7), MAT.flower, 14);
  let idx = 0, fIdx = 0;
  const color = new THREE.Color();
  for (const [cx, cz] of patches) for (let i = 0; i < perPatch; i++) {
    const x = cx + rr(-1.8, 1.8), z = cz + rr(-1.8, 1.8), s = rr(0.22, 0.55);
    dummy.position.set(x, 0.02 + rr(0, 0.015), z);
    dummy.rotation.set(0, rr(0, 6.3), 0);
    dummy.scale.set(s, 1, s);
    dummy.updateMatrix();
    pads.setMatrixAt(idx, dummy.matrix);
    pads.setColorAt(idx, color.setHex(PAL.lily).offsetHSL(rr(-0.02, 0.02), rr(-0.05, 0.1), rr(-0.05, 0.05)));
    idx++;
    if (rand() < 0.16 && fIdx < 14) {
      dummy.position.set(x, 0.12, z);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      flowers.setMatrixAt(fIdx, dummy.matrix);
      fIdx++;
    }
  }
  flowers.count = fIdx;
  pads.instanceColor.needsUpdate = true;
  pads.receiveShadow = true;
  g.add(pads, flowers);
  return g;
}

function buildMoss() {
  // spanish-moss strands hanging from every collected canopy anchor
  const g = new THREE.Group();
  const geo = new THREE.CylinderGeometry(0.05, 0.006, 1, 5);
  geo.translate(0, -0.5, 0);
  const moss = new THREE.InstancedMesh(geo, MAT.moss, mossAnchors.length);
  const color = new THREE.Color();
  mossAnchors.forEach((a, i) => {
    dummy.position.copy(a);
    dummy.rotation.set(rr(-0.15, 0.15), 0, rr(-0.15, 0.15));
    dummy.scale.set(rr(0.7, 1.4), rr(1.2, 2.6), rr(0.7, 1.4));
    dummy.updateMatrix();
    moss.setMatrixAt(i, dummy.matrix);
    moss.setColorAt(i, color.setHex(PAL.moss).offsetHSL(0, rr(-0.06, 0.06), rr(-0.08, 0.06)));
  });
  moss.instanceColor.needsUpdate = true;
  g.add(moss);
  return g;
}

function buildLightShafts() {
  const g = new THREE.Group();
  const axis = CFG.sunDir.clone().normalize();
  const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), axis);
  for (const [x, z] of [[0, 0], [-4, 4], [3.5, 5], [5, -4], [-3, -5], [1.5, -1.5]]) {
    const mat = MAT.shaft.clone();
    mat.opacity = rr(0.045, 0.085);
    const cone = mesh(new THREE.ConeGeometry(rr(1.1, 2.0), 14, 12, 1, true), mat);
    cone.quaternion.copy(quat);
    cone.position.set(x, 0, z).addScaledVector(axis, 7);
    g.add(cone);
    shaftMats.push({ mat, base: mat.opacity, phase: rr(0, 6.3) });
  }
  // drifting motes caught inside the rays
  const n = 150;
  const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    pos[i * 3] = rr(-7, 7); pos[i * 3 + 1] = rr(0.3, 11); pos[i * 3 + 2] = rr(-7, 7);
  }
  const moteGeo = new THREE.BufferGeometry();
  moteGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const motes = new THREE.Points(moteGeo, new THREE.PointsMaterial({
    color: 0xd8e8a8, size: 0.08, transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  motes.userData.base = pos.slice();
  g.add(motes);
  g.userData.motes = motes;
  return g;
}

function buildMist() {
  const g = new THREE.Group();
  const proto = new THREE.SpriteMaterial({ map: mistTex, color: PAL.mist, transparent: true, depthWrite: false });
  for (let i = 0; i < 14; i++) {
    const sprite = new THREE.Sprite(proto.clone());
    sprite.scale.set(rr(8, 14), rr(2.2, 3.4), 1);
    sprite.material.opacity = rr(0.08, 0.17);
    g.add(sprite);
    mists.push({ sprite, cx: rr(-3, 3), cz: rr(-3, 3), r: rr(3, 18), angSpeed: rr(0.012, 0.03), phase: rr(0, 6.3), baseY: rr(0.5, 1.5), baseOp: sprite.material.opacity });
  }
  return g;
}

function buildDragonfly() {
  const g = new THREE.Group();
  const body = mesh(new THREE.CapsuleGeometry(0.022, 0.3, 3, 6), MAT.dragonBody);
  body.rotation.x = Math.PI / 2;
  g.add(body, mesh(new THREE.SphereGeometry(0.035, 7, 6), MAT.dragonBody, 0, 0, 0.2));
  const wingGeo = new THREE.PlaneGeometry(0.42, 0.1);
  wingGeo.rotateX(-Math.PI / 2);
  wingGeo.translate(0.21, 0, 0);
  const wings = [];
  for (const [sx, oz] of [[1, 0.06], [1, -0.05], [-1, 0.06], [-1, -0.05]]) {
    const w = mesh(wingGeo, MAT.dragonWing, 0, 0.02, oz);
    w.scale.x = sx;
    g.add(w); wings.push(w);
  }
  return { group: g, wings };
}

function buildDeadLog() {
  const g = new THREE.Group();
  const log = mesh(new THREE.CylinderGeometry(0.17, 0.23, 4, 8), MAT.bark, 0, 0.08, 0);
  log.rotation.z = 1.42;
  log.castShadow = true; g.add(log);
  for (const [px, ang] of [[-0.8, 0.7], [0.6, -0.5]]) {
    const stub = mesh(new THREE.CylinderGeometry(0.05, 0.08, 0.7, 6), MAT.bark, px, 0.28, rr(-0.1, 0.1));
    stub.rotation.set(rr(-0.3, 0.3), 0, ang);
    stub.castShadow = true; g.add(stub);
  }
  // little turtle sunning on the log
  const shell = mesh(new THREE.SphereGeometry(0.16, 8, 6, 0, Math.PI * 2, 0, Math.PI / 2), MAT.leaf, 0.1, 0.28, 0);
  shell.scale.set(1.2, 0.75, 1);
  g.add(shell, mesh(new THREE.SphereGeometry(0.05, 6, 5), MAT.reed, 0.32, 0.3, 0));
  return g;
}

function buildMooringPost() {
  const g = new THREE.Group();
  const post = mesh(new THREE.CylinderGeometry(0.07, 0.09, 1.4, 7), MAT.darkWood, 0, 0.3, 0);
  post.rotation.z = 0.08;
  post.castShadow = true; g.add(post);
  const wrap = mesh(new THREE.TorusGeometry(0.1, 0.022, 6, 12), MAT.rope, 0, 0.82, 0);
  wrap.rotation.x = Math.PI / 2;
  g.add(wrap);
  return g;
}

/* ============================================================
   ASSEMBLY & LAYOUT
   ============================================================ */
scene.add(buildSkyAndWater());

const treeSpecs = [
  [-9, -3, 1.15], [-12, 6, 0.95], [-7, 12, 0.8], [9, -7, 1.05],
  [12, 3, 0.9], [-10, -12, 0.85], [6, 13, 0.75], [13, 11, 0.72]];
const yAxis = new THREE.Vector3(0, 1, 0);
for (const [tx, tz, ts] of treeSpecs) {
  const firstAnchor = mossAnchors.length;
  const tree = buildMangroveTree(ts);
  const ry = rr(0, Math.PI * 2);
  tree.position.set(tx, 0, tz);
  tree.rotation.y = ry;
  scene.add(tree);
  for (let i = firstAnchor; i < mossAnchors.length; i++) {   // tree-local -> world
    mossAnchors[i].applyAxisAngle(yAxis, ry).add(new THREE.Vector3(tx, 0, tz));
  }
  const bank = buildBank(rr(2.4, 3.6) * ts, rr(0.5, 0.8), rr(2.4, 3.6) * ts);
  bank.position.set(tx, 0, tz);
  scene.add(bank);
}
scene.add(buildCanopyCeiling());
scene.add(buildMoss());

const boat = buildBoat();
boat.position.set(0.5, 0, 2.5);
boat.rotation.y = 0.35;
scene.add(boat);

const mooring = buildMooringPost();
mooring.position.set(3.6, 0, 3.4);
scene.add(mooring);
const ropeCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(2.0, 0.5, 1.95), new THREE.Vector3(2.8, 0.22, 2.7), new THREE.Vector3(3.6, 0.78, 3.4)]);
scene.add(mesh(new THREE.TubeGeometry(ropeCurve, 16, 0.02, 5), MAT.rope));

const heron1 = buildHeron(true);
heron1.position.set(-4.5, 0, 8);
heron1.rotation.y = -0.6;
const heron2 = buildHeron(false);
heron2.position.set(4, 0, -7.5);
heron2.rotation.y = 2.4;
scene.add(heron1, heron2);

scene.add(buildWalkway(), buildReeds(), buildLilyPads());

const log1 = buildDeadLog();
log1.position.set(-3, 0, -6);
log1.rotation.y = 1.2;
scene.add(log1);

const shafts = buildLightShafts();
scene.add(shafts, buildMist());

for (const [cx, cy, cz, r] of [[1, 1.6, 4, 2.2], [-4, 1.9, -2, 2.8], [5, 1.4, -5, 1.8], [-2, 2.2, 9, 2.5]]) {
  const df = buildDragonfly();
  Object.assign(df, { cx, cy, cz, r, speed: rr(0.35, 0.6), phase: rr(0, 6.3) });
  scene.add(df.group);
  dragonflies.push(df);
}

/* ============================================================
   LIGHTING RIG — green-filtered key + humid fills + lantern
   ============================================================ */
scene.add(new THREE.HemisphereLight(0x9db87a, 0x2a2416, 0.6));
scene.add(new THREE.AmbientLight(0x33402a, 0.35));

const sun = new THREE.DirectionalLight(0xe8f0c0, 1.7);
sun.position.copy(CFG.sunDir);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -26; sun.shadow.camera.right = 26;
sun.shadow.camera.top = 26; sun.shadow.camera.bottom = -26;
sun.shadow.camera.near = 4; sun.shadow.camera.far = 70;
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
sun.shadow.radius = 3;
scene.add(sun, sun.target);

const bounce = new THREE.DirectionalLight(0x86a06c, 0.45);   // cool bounce off the far bank
bounce.position.set(-16, 9, -14);
scene.add(bounce);

/* ============================================================
   ANIMATION LOOP — gentle, loopable motion
   ============================================================ */
const clock = new THREE.Clock();
const motePos = shafts.userData.motes.geometry.attributes.position;
const moteBase = shafts.userData.motes.userData.base;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // still-water drift: tannin texture slides almost imperceptibly
  waterTex.offset.set(t * 0.004, t * 0.0025);

  // boat bobbing at its mooring
  boat.position.y = Math.sin(t * 0.7) * 0.03;
  boat.rotation.z = Math.sin(t * 0.55 + 1.2) * 0.02;
  boat.rotation.x = Math.sin(t * 0.8 + 0.4) * 0.015;

  // lantern flame flicker
  for (const f of flickers) {
    const n = Math.sin(t * 9 + f.phase) * 0.5 + Math.sin(t * 23 + f.phase * 2) * 0.3 + Math.sin(t * 4.2) * 0.2;
    f.light.intensity = f.baseI * (1 + n * 0.18);
    f.glass.emissiveIntensity = 2.2 + n * 0.5;
  }

  // vines and heron necks sway softly
  for (const s of swayers) s.obj.rotation[s.axis] = Math.sin(t * s.speed + s.phase) * s.amp;

  // dragonflies dart on looping figure paths, wings blurring
  for (const d of dragonflies) {
    const a = t * d.speed + d.phase;
    d.group.position.set(d.cx + Math.cos(a) * d.r, d.cy + Math.sin(a * 3) * 0.25, d.cz + Math.sin(a * 2) * d.r * 0.55);
    const vx = -Math.sin(a) * d.r, vz = Math.cos(a * 2) * d.r * 1.1;
    d.group.rotation.y = Math.atan2(vx, vz);
    const flap = Math.sin(t * 46 + d.phase) * 0.55;
    d.wings[0].rotation.z = flap; d.wings[1].rotation.z = -flap;
    d.wings[2].rotation.z = -flap; d.wings[3].rotation.z = flap;
  }

  // mist banks circle the swamp on slow closed orbits
  for (const m of mists) {
    const a = t * m.angSpeed + m.phase;
    m.sprite.position.set(m.cx + Math.cos(a) * m.r, m.baseY + Math.sin(t * 0.2 + m.phase) * 0.12, m.cz + Math.sin(a) * m.r);
    m.sprite.material.opacity = m.baseOp * (0.85 + 0.15 * Math.sin(t * 0.3 + m.phase));
  }

  // god rays breathe; motes drift inside them
  for (const sm of shaftMats) sm.mat.opacity = sm.base * (0.8 + 0.2 * Math.sin(t * 0.4 + sm.phase));
  for (let i = 0; i < motePos.count; i++) {
    motePos.array[i * 3 + 1] = moteBase[i * 3 + 1] + Math.sin(t * 0.25 + i * 1.7) * 0.7;
    motePos.array[i * 3] = moteBase[i * 3] + Math.sin(t * 0.18 + i * 0.9) * 0.3;
  }
  motePos.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ============================================================
   RESIZE
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
