<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Ripe Pineapple</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #eee7d8 0%, #c9c0ae 58%, #8f887d 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9d2c4);
scene.fog = new THREE.Fog(0xd9d2c4, 10, 19);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 50);
camera.position.set(7.2, 3.7, 8.4);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.55, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 6;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI * 0.49;

const hemi = new THREE.HemisphereLight(0xfff7e6, 0x4a493e, 2.0);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffead0, 4.2);
keyLight.position.set(5.5, 8, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -4;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 20;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xa7c8d0, 1.25);
fillLight.position.set(-5, 3, 4);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffd58d, 1.8);
rimLight.position.set(-3, 6, -6);
scene.add(rimLight);

const pineapple = new THREE.Group();
pineapple.rotation.y = -0.25;
pineapple.position.y = 0.12;
scene.add(pineapple);

function seededRandom(seed) {
  let value = seed >>> 0;
  return function () {
    value += 0x6D2B79F5;
    let t = value;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const random = seededRandom(18643);
const bodyBottom = -2.18;
const bodyTop = 2.08;
const bodyHeight = bodyTop - bodyBottom;

function bodyRadius(t, angle = 0) {
  const core = Math.pow(Math.sin(Math.PI * t), 0.61);
  const lowerFullness = 1.0 + 0.12 * (0.53 - t);
  const shoulderTaper = 1.0 - 0.10 * Math.pow(Math.max(0, t - 0.62) / 0.38, 1.4);
  const irregularity =
    1.0 +
    0.018 * Math.sin(angle * 3 + t * 8.0) +
    0.012 * Math.sin(angle * 7 - t * 11.0);
  return 1.48 * core * lowerFullness * shoulderTaper * irregularity;
}

function centerOffset(t) {
  return new THREE.Vector2(
    0.075 * Math.sin((t - 0.13) * Math.PI * 1.35),
    0.035 * Math.sin(t * Math.PI * 2.4 + 0.8)
  );
}

function createBodyGeometry() {
  const radialSegments = 96;
  const latitudeRings = 52;
  const positions = [];
  const colors = [];
  const indices = [];

  positions.push(0, bodyBottom, 0);
  colors.push(0.63, 0.30, 0.055);

  for (let ring = 1; ring < latitudeRings; ring++) {
    const t = ring / latitudeRings;
    const y = bodyBottom + bodyHeight * t;
    const offset = centerOffset(t);

    for (let segment = 0; segment < radialSegments; segment++) {
      const angle = segment / radialSegments * Math.PI * 2;
      const radius = bodyRadius(t, angle);
      const x = offset.x + radius * Math.cos(angle);
      const z = offset.y + radius * 0.965 * Math.sin(angle);
      const grain =
        0.010 * Math.sin(segment * 2.7 + ring * 1.9) +
        0.007 * Math.sin(segment * 5.2 - ring * 2.3);

      positions.push(x * (1 + grain), y, z * (1 + grain));

      const warm = 0.035 * Math.sin(angle * 4 + t * 9);
      const vertical = 0.045 * (1 - Math.abs(t - 0.46) * 1.4);
      colors.push(
        0.72 + warm + vertical,
        0.38 + warm * 0.45 + vertical * 0.35,
        0.065 + vertical * 0.12
      );
    }
  }

  const topIndex = positions.length / 3;
  positions.push(centerOffset(1).x, bodyTop, centerOffset(1).y);
  colors.push(0.51, 0.25, 0.045);

  for (let segment = 0; segment < radialSegments; segment++) {
    const next = (segment + 1) % radialSegments;
    indices.push(0, 1 + next, 1 + segment);
  }

  for (let ring = 0; ring < latitudeRings - 2; ring++) {
    const currentStart = 1 + ring * radialSegments;
    const nextStart = currentStart + radialSegments;
    for (let segment = 0; segment < radialSegments; segment++) {
      const next = (segment + 1) % radialSegments;
      const a = currentStart + segment;
      const b = currentStart + next;
      const c = nextStart + segment;
      const d = nextStart + next;
      indices.push(a, b, c, b, d, c);
    }
  }

  const lastStart = 1 + (latitudeRings - 2) * radialSegments;
  for (let segment = 0; segment < radialSegments; segment++) {
    const next = (segment + 1) % radialSegments;
    indices.push(lastStart + segment, lastStart + next, topIndex);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  return geometry;
}

const bodyMaterial = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.83,
  metalness: 0,
  bumpScale: 0.08
});

const bodyMesh = new THREE.Mesh(createBodyGeometry(), bodyMaterial);
bodyMesh.castShadow = true;
bodyMesh.receiveShadow = true;
pineapple.add(bodyMesh);

const eyeTransforms = [];
for (let row = 0; row < 12; row++) {
  const t = 0.105 + row * 0.069;
  const y = bodyBottom + bodyHeight * t;
  const averageRadius = bodyRadius(t, 0);
  const circumference = Math.PI * 2 * averageRadius;
  const count = Math.max(9, Math.round(circumference / 0.46));
  const stagger = (row % 2) * Math.PI / count;
  const diagonalDrift = row * 0.155;

  for (let column = 0; column < count; column++) {
    const angle = column / count * Math.PI * 2 + stagger + diagonalDrift;
    const radius = bodyRadius(t, angle);
    const offset = centerOffset(t);
    const x = offset.x + radius * Math.cos(angle);
    const z = offset.y + radius * 0.965 * Math.sin(angle);

    const epsilon = 0.003;
    const rBefore = bodyRadius(Math.max(0.001, t - epsilon), angle);
    const rAfter = bodyRadius(Math.min(0.999, t + epsilon), angle);
    const drdy = (rAfter - rBefore) / (2 * epsilon * bodyHeight);
    const normal = new THREE.Vector3(
      Math.cos(angle),
      -drdy * 1.18,
      Math.sin(angle) / 0.965
    ).normalize();

    eyeTransforms.push({
      position: new THREE.Vector3(x, y, z),
      normal,
      spin: angle * 0.35 + row * 0.72,
      scale: 0.90 + random() * 0.18,
      shade: random()
    });
  }
}

const eyeBaseGeometry = new THREE.CylinderGeometry(0.205, 0.225, 0.075, 6, 1, false);
const eyeBaseMaterial = new THREE.MeshStandardMaterial({
  color: 0x704011,
  roughness: 0.93,
  metalness: 0
});
const eyeBaseMesh = new THREE.InstancedMesh(
  eyeBaseGeometry,
  eyeBaseMaterial,
  eyeTransforms.length
);
eyeBaseMesh.castShadow = true;
eyeBaseMesh.receiveShadow = true;

const eyeFaceGeometry = new THREE.CylinderGeometry(0.128, 0.174, 0.092, 6, 1, false);
const eyeFaceMaterial = new THREE.MeshStandardMaterial({
  color: 0xc98620,
  roughness: 0.78,
  metalness: 0
});
const eyeFaceMesh = new THREE.InstancedMesh(
  eyeFaceGeometry,
  eyeFaceMaterial,
  eyeTransforms.length
);
eyeFaceMesh.castShadow = true;
eyeFaceMesh.receiveShadow = true;

const eyeTipGeometry = new THREE.ConeGeometry(0.047, 0.07, 4, 1);
const eyeTipMaterial = new THREE.MeshStandardMaterial({
  color: 0x4c2a0c,
  roughness: 0.95
});
const eyeTipMesh = new THREE.InstancedMesh(
  eyeTipGeometry,
  eyeTipMaterial,
  eyeTransforms.length
);
eyeTipMesh.castShadow = true;

const upAxis = new THREE.Vector3(0, 1, 0);
const matrix = new THREE.Matrix4();
const alignment = new THREE.Quaternion();
const spinQuaternion = new THREE.Quaternion();
const finalQuaternion = new THREE.Quaternion();
const scaleVector = new THREE.Vector3();

eyeTransforms.forEach((eye, index) => {
  alignment.setFromUnitVectors(upAxis, eye.normal);
  spinQuaternion.setFromAxisAngle(upAxis, eye.spin);
  finalQuaternion.copy(alignment).multiply(spinQuaternion);

  scaleVector.set(eye.scale, eye.scale, eye.scale);
  matrix.compose(
    eye.position.clone().addScaledVector(eye.normal, 0.025),
    finalQuaternion,
    scaleVector
  );
  eyeBaseMesh.setMatrixAt(index, matrix);

  const faceScale = eye.scale * (0.92 + eye.shade * 0.10);
  scaleVector.set(faceScale, faceScale, faceScale);
  matrix.compose(
    eye.position.clone().addScaledVector(eye.normal, 0.095),
    finalQuaternion,
    scaleVector
  );
  eyeFaceMesh.setMatrixAt(index, matrix);

  const tipScale = eye.scale * (0.70 + eye.shade * 0.34);
  scaleVector.set(tipScale, tipScale, tipScale);
  matrix.compose(
    eye.position.clone().addScaledVector(eye.normal, 0.172),
    finalQuaternion,
    scaleVector
  );
  eyeTipMesh.setMatrixAt(index, matrix);
});

eyeBaseMesh.instanceMatrix.needsUpdate = true;
eyeFaceMesh.instanceMatrix.needsUpdate = true;
eyeTipMesh.instanceMatrix.needsUpdate = true;
pineapple.add(eyeBaseMesh, eyeFaceMesh, eyeTipMesh);

const crown = new THREE.Group();
crown.position.set(centerOffset(0.965).x, 1.92, centerOffset(0.965).y);
pineapple.add(crown);

const leafMaterials = [
  new THREE.MeshStandardMaterial({
    color: 0x315f29,
    roughness: 0.76,
    side: THREE.DoubleSide,
    vertexColors: true
  }),
  new THREE.MeshStandardMaterial({
    color: 0x447b32,
    roughness: 0.72,
    side: THREE.DoubleSide,
    vertexColors: true
  }),
  new THREE.MeshStandardMaterial({
    color: 0x264f27,
    roughness: 0.79,
    side: THREE.DoubleSide,
    vertexColors: true
  })
];

function createLeafGeometry(length, width, bend, twist, serrationPhase) {
  const segments = 18;
  const positions = [];
  const colors = [];
  const indices = [];

  for (let i = 0; i <= segments; i++) {
    const s = i / segments;
    const taper = Math.pow(Math.max(0, 1 - s), 0.72);
    const rootNarrowing = 0.56 + 0.44 * Math.min(1, s * 4.5);
    const serration =
      i === 0 || i === segments
        ? 1
        : 1 + ((i + serrationPhase) % 2 === 0 ? 0.13 : -0.05) * Math.sin(Math.PI * s);
    const halfWidth = width * 0.5 * taper * rootNarrowing * serration;
    const y = length * s - 0.10 * length * Math.pow(s, 4);
    const z = bend * Math.pow(s, 1.65);
    const lateralTwist = twist * Math.sin(Math.PI * s) * s;
    const ridge = 0.045 * Math.sin(Math.PI * s);

    positions.push(-halfWidth + lateralTwist, y, z - ridge);
    positions.push( halfWidth + lateralTwist, y, z - ridge);

    const brightness = 0.72 + 0.25 * (1 - s);
    colors.push(0.38 * brightness, 0.72 * brightness, 0.30 * brightness);
    colors.push(0.27 * brightness, 0.58 * brightness, 0.23 * brightness);
  }

  for (let i = 0; i < segments; i++) {
    const a = i * 2;
    const b = a + 1;
    const c = a + 2;
    const d = a + 3;
    indices.push(a, c, b, b, c, d);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  return geometry;
}

function addLeafRing(count, radius, lengthMin, lengthMax, width, bendMin, bendMax, yOffset, phase) {
  for (let i = 0; i < count; i++) {
    const angle = i / count * Math.PI * 2 + phase + (random() - 0.5) * 0.15;
    const length = THREE.MathUtils.lerp(lengthMin, lengthMax, random());
    const bend = THREE.MathUtils.lerp(bendMin, bendMax, random());
    const twist = (random() - 0.5) * 0.22;
    const geometry = createLeafGeometry(length, width * (0.88 + random() * 0.22), bend, twist, i % 2);
    const material = leafMaterials[(i + Math.floor(phase * 10)) % leafMaterials.length];
    const leaf = new THREE.Mesh(geometry, material);

    leaf.position.set(
      Math.sin(angle) * radius,
      yOffset + (random() - 0.5) * 0.07,
      Math.cos(angle) * radius
    );
    leaf.rotation.y = angle;
    leaf.rotation.z = (random() - 0.5) * 0.08;
    leaf.castShadow = true;
    leaf.receiveShadow = true;
    crown.add(leaf);
  }
}

addLeafRing(13, 0.22, 1.45, 2.05, 0.37, 0.72, 1.18, 0.02, 0.04);
addLeafRing(11, 0.15, 1.90, 2.55, 0.32, 0.38, 0.72, 0.11, 0.31);
addLeafRing(8, 0.08, 2.25, 2.85, 0.27, 0.12, 0.38, 0.20, 0.09);
addLeafRing(5, 0.035, 2.35, 2.95, 0.22, 0.04, 0.20, 0.28, 0.45);

const crownBaseGeometry = new THREE.CylinderGeometry(0.32, 0.43, 0.38, 10, 2);
const crownBaseMaterial = new THREE.MeshStandardMaterial({
  color: 0x57652b,
  roughness: 0.92
});
const crownBase = new THREE.Mesh(crownBaseGeometry, crownBaseMaterial);
crownBase.position.y = 0.02;
crownBase.castShadow = true;
crown.add(crownBase);

const dryBractMaterial = new THREE.MeshStandardMaterial({
  color: 0x806328,
  roughness: 0.95,
  side: THREE.DoubleSide
});
for (let i = 0; i < 10; i++) {
  const angle = i / 10 * Math.PI * 2;
  const bractGeometry = new THREE.ConeGeometry(0.09, 0.52 + random() * 0.18, 3, 1);
  const bract = new THREE.Mesh(bractGeometry, dryBractMaterial);
  bract.position.set(Math.cos(angle) * 0.34, -0.08, Math.sin(angle) * 0.34);
  bract.rotation.z = Math.PI * 0.5;
  bract.rotation.y = -angle;
  bract.castShadow = true;
  crown.add(bract);
}

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0xbdb4a3,
  roughness: 0.93,
  metalness: 0
});
const ground = new THREE.Mesh(new THREE.CircleGeometry(10, 96), groundMaterial);
ground.rotation.x = -Math.PI * 0.5;
ground.position.y = -2.11;
ground.receiveShadow = true;
scene.add(ground);

const backdrop = new THREE.Mesh(
  new THREE.CircleGeometry(10.5, 96),
  new THREE.MeshBasicMaterial({
    color: 0xcfc7b8,
    transparent: true,
    opacity: 0.2,
    depthWrite: false
  })
);
backdrop.rotation.x = -Math.PI * 0.5;
backdrop.position.y = -2.105;
scene.add(backdrop);

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  crown.rotation.z = Math.sin(elapsed * 0.34) * 0.004;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
