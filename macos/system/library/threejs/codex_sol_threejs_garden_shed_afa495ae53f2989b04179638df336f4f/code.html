<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Garden Shed</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #dce8e7; }
    body { font-family: system-ui, sans-serif; }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 18px;
      bottom: 16px;
      padding: 9px 12px;
      color: rgba(255,255,255,.9);
      background: rgba(28,38,34,.55);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 8px;
      backdrop-filter: blur(8px);
      font-size: 12px;
      letter-spacing: .04em;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">3.6 × 2.8 m garden shed</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcbdeda);
    scene.fog = new THREE.Fog(0xcbdeda, 13, 28);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 60);
    camera.position.set(6.4, 4.25, -7.2);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(1.8, 1.35, 1.25);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.42;
    controls.minDistance = 5;
    controls.maxDistance = 14;
    controls.maxPolarAngle = Math.PI * 0.48;

    const hemi = new THREE.HemisphereLight(0xe8f5ff, 0x59624c, 1.65);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff1d2, 3.5);
    sun.position.set(-5, 8, -6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -7;
    sun.shadow.camera.right = 7;
    sun.shadow.camera.top = 7;
    sun.shadow.camera.bottom = -7;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 22;
    sun.shadow.bias = -0.00025;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x9fc6d8, 0.65);
    fill.position.set(5, 4, 6);
    scene.add(fill);

    const W = 3.6;
    const D = 2.8;
    const wallH = 2.25;
    const ridgeY = 3.05;
    const overhang = 0.24;
    const courseH = 0.17;
    const courseGap = 0.012;

    const shed = new THREE.Group();
    scene.add(shed);

    const sidingMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x667761, roughness: 0.88 }),
      new THREE.MeshStandardMaterial({ color: 0x6d7e67, roughness: 0.9 }),
      new THREE.MeshStandardMaterial({ color: 0x60715c, roughness: 0.86 }),
      new THREE.MeshStandardMaterial({ color: 0x72816c, roughness: 0.9 })
    ];
    const trimMaterial = new THREE.MeshStandardMaterial({ color: 0xe2ddc9, roughness: 0.76 });
    const darkWoodMaterial = new THREE.MeshStandardMaterial({ color: 0x49372b, roughness: 0.88 });
    const doorMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x9a6841, roughness: 0.78 }),
      new THREE.MeshStandardMaterial({ color: 0xa87449, roughness: 0.8 }),
      new THREE.MeshStandardMaterial({ color: 0x8e5e3b, roughness: 0.82 })
    ];
    const roofMaterial = new THREE.MeshStandardMaterial({ color: 0x343b3a, roughness: 0.91 });
    const roofEdgeMaterial = new THREE.MeshStandardMaterial({ color: 0x252b2a, roughness: 0.84 });
    const metalMaterial = new THREE.MeshStandardMaterial({ color: 0x202523, roughness: 0.38, metalness: 0.72 });
    const foundationMaterial = new THREE.MeshStandardMaterial({ color: 0x88877d, roughness: 0.95 });
    const recessMaterial = new THREE.MeshStandardMaterial({ color: 0x171d19, roughness: 1 });

    function meshBox(width, height, depth, material, x, y, z, parent = shed) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function subtractInterval(intervals, cutStart, cutEnd) {
      const result = [];
      for (const interval of intervals) {
        const a = interval[0];
        const b = interval[1];
        if (cutEnd <= a || cutStart >= b) {
          result.push(interval);
        } else {
          if (cutStart > a) result.push([a, Math.min(cutStart, b)]);
          if (cutEnd < b) result.push([Math.max(cutEnd, a), b]);
        }
      }
      return result;
    }

    const doorOpening = { x1: 0.38, x2: 1.44, y1: 0.05, y2: 1.99 };
    const windowOpening = { x1: 2.25, x2: 3.20, y1: 1.05, y2: 1.73 };

    const courseCount = Math.ceil(wallH / courseH);
    for (let i = 0; i < courseCount; i++) {
      const y0 = i * courseH;
      const y1 = Math.min(y0 + courseH - courseGap, wallH);
      const h = Math.max(0.03, y1 - y0);
      const cy = y0 + h * 0.5;
      let intervals = [[0, W]];
      for (const opening of [doorOpening, windowOpening]) {
        if (y1 > opening.y1 && y0 < opening.y2) {
          intervals = subtractInterval(intervals, opening.x1, opening.x2);
        }
      }
      for (const interval of intervals) {
        const length = interval[1] - interval[0];
        if (length > 0.015) {
          meshBox(
            length,
            h,
            0.075,
            sidingMaterials[i % sidingMaterials.length],
            (interval[0] + interval[1]) * 0.5,
            cy,
            -0.038
          );
        }
      }

      meshBox(
        W,
        h,
        0.075,
        sidingMaterials[(i + 1) % sidingMaterials.length],
        W * 0.5,
        cy,
        D + 0.038
      );

      meshBox(
        0.075,
        h,
        D,
        sidingMaterials[(i + 2) % sidingMaterials.length],
        -0.038,
        cy,
        D * 0.5
      );

      meshBox(
        0.075,
        h,
        D,
        sidingMaterials[(i + 3) % sidingMaterials.length],
        W + 0.038,
        cy,
        D * 0.5
      );
    }

    const gableShape = new THREE.Shape();
    gableShape.moveTo(0, wallH);
    gableShape.lineTo(W, wallH);
    gableShape.lineTo(W * 0.5, ridgeY);
    gableShape.closePath();

    const gableGeometry = new THREE.ShapeGeometry(gableShape);
    for (const z of [-0.045, D + 0.045]) {
      const gable = new THREE.Mesh(gableGeometry, sidingMaterials[1]);
      gable.position.z = z;
      gable.castShadow = true;
      gable.receiveShadow = true;
      shed.add(gable);
    }

    const foundation = meshBox(W + 0.12, 0.16, D + 0.12, foundationMaterial, W * 0.5, -0.08, D * 0.5);
    foundation.receiveShadow = true;

    const sillMaterial = new THREE.MeshStandardMaterial({ color: 0x54544d, roughness: 0.9 });
    meshBox(W + 0.05, 0.11, 0.13, sillMaterial, W * 0.5, 0.055, 0.015);
    meshBox(W + 0.05, 0.11, 0.13, sillMaterial, W * 0.5, 0.055, D - 0.015);

    const trimWidth = 0.12;
    for (const x of [0.025, W - 0.025]) {
      meshBox(trimWidth, wallH + 0.06, 0.105, trimMaterial, x, wallH * 0.5, -0.085);
      meshBox(trimWidth, wallH + 0.06, 0.105, trimMaterial, x, wallH * 0.5, D + 0.085);
    }
    for (const z of [0.07, D - 0.07]) {
      meshBox(0.105, wallH + 0.06, trimWidth, trimMaterial, -0.085, wallH * 0.5, z);
      meshBox(0.105, wallH + 0.06, trimWidth, trimMaterial, W + 0.085, wallH * 0.5, z);
    }

    meshBox(doorOpening.x2 - doorOpening.x1, doorOpening.y2 - doorOpening.y1, 0.022, recessMaterial,
      (doorOpening.x1 + doorOpening.x2) * 0.5,
      (doorOpening.y1 + doorOpening.y2) * 0.5,
      0.005
    );

    const jamb = 0.10;
    meshBox(jamb, 2.04, 0.13, trimMaterial, doorOpening.x1 - jamb * 0.5, 1.02, -0.10);
    meshBox(jamb, 2.04, 0.13, trimMaterial, doorOpening.x2 + jamb * 0.5, 1.02, -0.10);
    meshBox(doorOpening.x2 - doorOpening.x1 + jamb * 2, jamb, 0.13, trimMaterial,
      (doorOpening.x1 + doorOpening.x2) * 0.5, 2.035, -0.10
    );

    const doorGroup = new THREE.Group();
    doorGroup.position.set(doorOpening.x1 + 0.025, 0, -0.12);
    doorGroup.rotation.y = 0.18;
    shed.add(doorGroup);

    const doorWidth = 1.01;
    const doorHeight = 1.90;
    meshBox(doorWidth, doorHeight, 0.07, darkWoodMaterial, doorWidth * 0.5, 1.00, 0, doorGroup);

    const doorBoardCount = 6;
    const doorBoardGap = 0.014;
    const boardWidth = (doorWidth - doorBoardGap * (doorBoardCount + 1)) / doorBoardCount;
    for (let i = 0; i < doorBoardCount; i++) {
      meshBox(
        boardWidth,
        doorHeight - 0.04,
        0.035,
        doorMaterials[i % doorMaterials.length],
        doorBoardGap + boardWidth * 0.5 + i * (boardWidth + doorBoardGap),
        1.00,
        -0.052,
        doorGroup
      );
    }

    meshBox(doorWidth - 0.09, 0.105, 0.055, doorMaterials[2], doorWidth * 0.5, 1.78, -0.085, doorGroup);
    meshBox(doorWidth - 0.09, 0.105, 0.055, doorMaterials[2], doorWidth * 0.5, 0.22, -0.085, doorGroup);
    const brace = meshBox(0.105, 1.48, 0.055, doorMaterials[2], doorWidth * 0.5, 1.0, -0.087, doorGroup);
    brace.rotation.z = -0.53;

    for (const hingeY of [0.42, 1.58]) {
      meshBox(0.30, 0.055, 0.045, metalMaterial, 0.17, hingeY, -0.12, doorGroup);
      const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.15, 12), metalMaterial);
      pin.position.set(0.015, hingeY, -0.13);
      pin.castShadow = true;
      doorGroup.add(pin);
    }

    const handle = new THREE.Mesh(new THREE.SphereGeometry(0.047, 18, 12), metalMaterial);
    handle.position.set(0.86, 1.03, -0.135);
    handle.castShadow = true;
    doorGroup.add(handle);

    const windowCenterX = (windowOpening.x1 + windowOpening.x2) * 0.5;
    const windowCenterY = (windowOpening.y1 + windowOpening.y2) * 0.5;
    const windowWidth = windowOpening.x2 - windowOpening.x1;
    const windowHeight = windowOpening.y2 - windowOpening.y1;

    meshBox(windowWidth, windowHeight, 0.026, recessMaterial, windowCenterX, windowCenterY, -0.005);

    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x8db6bb,
      roughness: 0.16,
      metalness: 0.05,
      transmission: 0.2,
      transparent: true,
      opacity: 0.72,
      clearcoat: 0.65
    });
    meshBox(windowWidth - 0.16, windowHeight - 0.16, 0.025, glassMaterial, windowCenterX, windowCenterY, -0.105);

    const frameThickness = 0.09;
    meshBox(frameThickness, windowHeight + 0.18, 0.10, trimMaterial,
      windowOpening.x1 - frameThickness * 0.5, windowCenterY, -0.13
    );
    meshBox(frameThickness, windowHeight + 0.18, 0.10, trimMaterial,
      windowOpening.x2 + frameThickness * 0.5, windowCenterY, -0.13
    );
    meshBox(windowWidth + frameThickness * 2, frameThickness, 0.10, trimMaterial,
      windowCenterX, windowOpening.y1 - frameThickness * 0.5, -0.13
    );
    meshBox(windowWidth + frameThickness * 2, frameThickness, 0.10, trimMaterial,
      windowCenterX, windowOpening.y2 + frameThickness * 0.5, -0.13
    );
    meshBox(frameThickness * 0.62, windowHeight - 0.12, 0.055, trimMaterial,
      windowCenterX, windowCenterY, -0.18
    );
    meshBox(windowWidth - 0.12, frameThickness * 0.62, 0.055, trimMaterial,
      windowCenterX, windowCenterY, -0.18
    );

    const sill = meshBox(windowWidth + 0.24, 0.075, 0.22, trimMaterial,
      windowCenterX, windowOpening.y1 - 0.105, -0.17
    );
    sill.rotation.x = -0.08;

    const flowerBoxMaterial = new THREE.MeshStandardMaterial({ color: 0x5b3b26, roughness: 0.9 });
    meshBox(windowWidth + 0.05, 0.20, 0.25, flowerBoxMaterial, windowCenterX, windowOpening.y1 - 0.27, -0.20);

    const foliageMaterial = new THREE.MeshStandardMaterial({ color: 0x496a3f, roughness: 0.95 });
    const flowerMaterials = [
      new THREE.MeshStandardMaterial({ color: 0xe9a9a0, roughness: 0.8 }),
      new THREE.MeshStandardMaterial({ color: 0xf1d27d, roughness: 0.8 }),
      new THREE.MeshStandardMaterial({ color: 0xbca4d8, roughness: 0.8 })
    ];
    for (let i = 0; i < 9; i++) {
      const x = windowCenterX - 0.41 + i * 0.102;
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 8), foliageMaterial);
      leaf.scale.set(0.8, 1.15, 0.65);
      leaf.position.set(x, windowOpening.y1 - 0.12 + (i % 2) * 0.045, -0.34);
      leaf.castShadow = true;
      shed.add(leaf);

      if (i % 2 === 0) {
        const bloom = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 7), flowerMaterials[(i / 2) % 3 | 0]);
        bloom.position.set(x, windowOpening.y1 - 0.055, -0.38);
        bloom.castShadow = true;
        shed.add(bloom);
      }
    }

    const run = W * 0.5 + overhang;
    const rise = ridgeY - (wallH - 0.07);
    const roofAngle = Math.atan2(rise, run);
    const slopeLength = Math.sqrt(run * run + rise * rise);
    const roofDepth = D + overhang * 2;
    const eaveY = ridgeY - rise;

    const leftRoof = meshBox(
      slopeLength,
      0.12,
      roofDepth,
      roofMaterial,
      (W * 0.5 - overhang) * 0.5,
      (ridgeY + eaveY) * 0.5,
      D * 0.5
    );
    leftRoof.rotation.z = roofAngle;

    const rightRoof = meshBox(
      slopeLength,
      0.12,
      roofDepth,
      roofMaterial,
      W - (W * 0.5 - overhang) * 0.5,
      (ridgeY + eaveY) * 0.5,
      D * 0.5
    );
    rightRoof.rotation.z = -roofAngle;

    const roofRows = 8;
    for (let i = 1; i < roofRows; i++) {
      const t = i / roofRows;
      const leftX = -overhang + (W * 0.5 + overhang) * t;
      const leftY = eaveY + rise * t;
      const rightX = W + overhang - (W * 0.5 + overhang) * t;
      const rightY = eaveY + rise * t;

      const leftStrip = meshBox(0.028, 0.028, roofDepth + 0.015, roofEdgeMaterial, leftX, leftY + 0.067, D * 0.5);
      leftStrip.rotation.z = roofAngle;

      const rightStrip = meshBox(0.028, 0.028, roofDepth + 0.015, roofEdgeMaterial, rightX, rightY + 0.067, D * 0.5);
      rightStrip.rotation.z = -roofAngle;
    }

    const ridgeCap = new THREE.Mesh(
      new THREE.CylinderGeometry(0.105, 0.105, roofDepth + 0.08, 8),
      roofEdgeMaterial
    );
    ridgeCap.rotation.x = Math.PI * 0.5;
    ridgeCap.position.set(W * 0.5, ridgeY + 0.075, D * 0.5);
    ridgeCap.castShadow = true;
    ridgeCap.receiveShadow = true;
    shed.add(ridgeCap);

    const fasciaDepth = 0.12;
    const leftFascia = meshBox(slopeLength, 0.14, fasciaDepth, trimMaterial,
      (W * 0.5 - overhang) * 0.5, (ridgeY + eaveY) * 0.5 - 0.035, -overhang - 0.015
    );
    leftFascia.rotation.z = roofAngle;

    const rightFascia = meshBox(slopeLength, 0.14, fasciaDepth, trimMaterial,
      W - (W * 0.5 - overhang) * 0.5, (ridgeY + eaveY) * 0.5 - 0.035, -overhang - 0.015
    );
    rightFascia.rotation.z = -roofAngle;

    const ventMaterial = new THREE.MeshStandardMaterial({ color: 0x343b36, roughness: 0.75 });
    const vent = new THREE.Mesh(new THREE.CircleGeometry(0.17, 24), ventMaterial);
    vent.position.set(W * 0.5, 2.58, -0.112);
    vent.castShadow = true;
    shed.add(vent);
    for (let i = -2; i <= 2; i++) {
      meshBox(0.25, 0.018, 0.025, trimMaterial, W * 0.5, 2.58 + i * 0.048, -0.135);
    }

    const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x778765, roughness: 1 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(26, 26), groundMaterial);
    ground.rotation.x = -Math.PI * 0.5;
    ground.position.set(W * 0.5, -0.175, D * 0.5);
    ground.receiveShadow = true;
    scene.add(ground);

    const pathMaterial = new THREE.MeshStandardMaterial({ color: 0xa89d87, roughness: 0.98 });
    const stonePositions = [
      [0.93, -0.58, -0.45, -0.06],
      [1.02, -0.61, -1.05, 0.08],
      [0.89, -0.60, -1.68, -0.08],
      [1.07, -0.59, -2.30, 0.04]
    ];
    for (const data of stonePositions) {
      const stone = new THREE.Mesh(new THREE.CylinderGeometry(0.37, 0.40, 0.07, 9), pathMaterial);
      stone.scale.z = 0.72;
      stone.position.set(data[0], data[1] + 0.45, data[2]);
      stone.rotation.y = data[3];
      stone.castShadow = true;
      stone.receiveShadow = true;
      scene.add(stone);
    }

    const bushMaterial = new THREE.MeshStandardMaterial({ color: 0x46633e, roughness: 1 });
    const bushMaterialLight = new THREE.MeshStandardMaterial({ color: 0x58794b, roughness: 1 });
    const bushLocations = [
      [-0.52, 0.14, 0.45, 0.52],
      [-0.46, 0.09, 1.15, 0.40],
      [4.05, 0.10, 2.30, 0.46],
      [4.18, 0.05, 1.72, 0.36]
    ];
    for (let i = 0; i < bushLocations.length; i++) {
      const data = bushLocations[i];
      const bush = new THREE.Mesh(
        new THREE.DodecahedronGeometry(data[3], 1),
        i % 2 ? bushMaterialLight : bushMaterial
      );
      bush.scale.set(1.0, 0.82, 0.9);
      bush.position.set(data[0], data[1] + 0.18, data[2]);
      bush.rotation.set(0.1 * i, 0.7 * i, 0);
      bush.castShadow = true;
      bush.receiveShadow = true;
      scene.add(bush);
    }

    const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x665443, roughness: 0.92 });
    meshBox(1.15, 0.055, 0.85, floorMaterial, 0.91, 0.075, 0.38);

    const threshold = meshBox(1.22, 0.07, 0.18, trimMaterial, 0.91, 0.08, -0.10);
    threshold.rotation.x = -0.05;

    const warmInterior = new THREE.PointLight(0xffb86d, 0.65, 2.4, 2);
    warmInterior.position.set(0.92, 1.35, 0.55);
    shed.add(warmInterior);

    scene.traverse((object) => {
      if (object.isMesh) {
        object.frustumCulled = true;
      }
    });

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('resize', resize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
