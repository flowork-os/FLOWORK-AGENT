<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espresso Machine</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1c20; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1c20);
scene.fog = new THREE.Fog(0x1a1c20, 8, 16);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(2.6, 1.9, 3.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.72, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 2;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.52;

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xbfd4e6, 0x3a3228, 0.55));

const key = new THREE.DirectionalLight(0xfff2e0, 1.6);
key.position.set(3.5, 5, 2.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -2.5; key.shadow.camera.right = 2.5;
key.shadow.camera.top = 2.5; key.shadow.camera.bottom = -2.5;
key.shadow.camera.near = 1; key.shadow.camera.far = 12;
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
scene.add(key);

const rim = new THREE.DirectionalLight(0x88aaff, 0.6);
rim.position.set(-4, 3, -3);
scene.add(rim);

const fill = new THREE.PointLight(0xffe8c8, 0.5, 10);
fill.position.set(-2, 1.5, 3);
scene.add(fill);

// Soft environment for metal reflections
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene();
envScene.background = new THREE.Color(0x606870);
const strip = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 2),
  new THREE.MeshBasicMaterial({ color: 0xffffff })
);
strip.position.set(0, 3, -4);
envScene.add(strip);
const strip2 = strip.clone();
strip2.position.set(3, 2, 4);
strip2.rotation.y = Math.PI;
envScene.add(strip2);
scene.environment = pmrem.fromScene(envScene, 0.04).texture;
pmrem.dispose();

// ---------- Materials ----------
const steel = new THREE.MeshStandardMaterial({ color: 0xc8ccd0, metalness: 0.95, roughness: 0.32 });
const steelBrushed = new THREE.MeshStandardMaterial({ color: 0xb4b8bc, metalness: 0.9, roughness: 0.45 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xe8eaec, metalness: 1.0, roughness: 0.15 });
const blackPlastic = new THREE.MeshStandardMaterial({ color: 0x16161a, metalness: 0.2, roughness: 0.55 });
const blackMatte = new THREE.MeshStandardMaterial({ color: 0x0c0c0e, metalness: 0.1, roughness: 0.8 });
const darkSteel = new THREE.MeshStandardMaterial({ color: 0x3a3e44, metalness: 0.85, roughness: 0.4 });
const dialFace = new THREE.MeshStandardMaterial({ color: 0xf2efe6, metalness: 0.0, roughness: 0.4 });
const tankPlastic = new THREE.MeshPhysicalMaterial({
  color: 0x2a3238, metalness: 0.0, roughness: 0.25,
  transmission: 0.35, thickness: 0.3, transparent: true, opacity: 0.92
});

// ---------- Machine ----------
// Proportions (m): body ~ 0.30 wide, 0.38 tall, 0.32 deep — home espresso scale, x3.2 for scene
const S = 3.2;
const machine = new THREE.Group();
scene.add(machine);

function box(w, h, d, mat, x, y, z, parent = machine) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w * S, h * S, d * S), mat);
  m.position.set(x * S, y * S, z * S);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
function cyl(rT, rB, h, mat, x, y, z, seg = 40, parent = machine) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rT * S, rB * S, h * S, seg), mat);
  m.position.set(x * S, y * S, z * S);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}

// --- Main body (boxy stainless, slightly rounded via bevel illusion) ---
const BODY_W = 0.30, BODY_H = 0.30, BODY_D = 0.30, BODY_Y = 0.075; // body sits on base
const body = box(BODY_W, BODY_H, BODY_D, steel, 0, BODY_Y + BODY_H / 2, -0.015);

// Front fascia panel (brushed, slightly proud)
box(BODY_W * 0.96, BODY_H * 0.97, 0.006, steelBrushed, 0, BODY_Y + BODY_H / 2, -0.015 + BODY_D / 2 + 0.002);

// Side panels accent lines
box(0.004, BODY_H * 0.97, BODY_D * 0.96, steelBrushed, BODY_W / 2 + 0.001, BODY_Y + BODY_H / 2, -0.015);
box(0.004, BODY_H * 0.97, BODY_D * 0.96, steelBrushed, -BODY_W / 2 - 0.001, BODY_Y + BODY_H / 2, -0.015);

// --- Base plinth ---
box(BODY_W + 0.02, 0.03, BODY_D + 0.04, blackPlastic, 0, 0.015, 0);
// Feet
[[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
  cyl(0.018, 0.02, 0.012, blackMatte, sx * (BODY_W / 2 - 0.02), 0.004, sz * (BODY_D / 2 - 0.01), 24);
});

// --- Drip tray with grille ---
const trayY = 0.045;
box(BODY_W * 0.85, 0.028, 0.10, steelBrushed, 0, trayY, BODY_D / 2 - 0.045); // tray pan
const grille = new THREE.Group();
grille.position.set(0, (trayY + 0.017) * S, (BODY_D / 2 - 0.045) * S);
machine.add(grille);
for (let i = -5; i <= 5; i++) {
  const bar = new THREE.Mesh(
    new THREE.BoxGeometry(0.018 * S, 0.005 * S, 0.095 * S),
    chrome
  );
  bar.position.x = i * 0.023 * S;
  bar.castShadow = bar.receiveShadow = true;
  grille.add(bar);
}

// --- Group head ---
const ghZ = -0.015 + BODY_D / 2 + 0.02;
const ghY = BODY_Y + 0.145;
// housing block extending from fascia
box(0.11, 0.075, 0.05, steel, 0, ghY + 0.01, ghZ - 0.005);
// group cylinder
cyl(0.042, 0.046, 0.045, chrome, 0, ghY - 0.02, ghZ, 48);
// group ring
cyl(0.05, 0.05, 0.012, chrome, 0, ghY - 0.04, ghZ, 48);

// --- Portafilter ---
const pf = new THREE.Group();
pf.position.set(0, (ghY - 0.055) * S, ghZ * S);
machine.add(pf);
// basket body
const pfCup = cyl(0.044, 0.036, 0.032, chrome, 0, 0, 0, 48, pf);
pfCup.position.set(0, 0, 0);
// twin spouts
[-0.014, 0.014].forEach(x => {
  const sp = cyl(0.007, 0.009, 0.022, chrome, x, -0.026, 0.008, 20, pf);
  sp.rotation.x = 0.18;
});
// handle: hub + tapered grip angled toward viewer-right
const hub = cyl(0.014, 0.014, 0.05, blackPlastic, 0, 0.002, 0, 24, pf);
hub.rotation.x = Math.PI / 2;
hub.position.set(0.03 * S * 0.25, 0.002 * S, 0.05 * S * 0.45);
const handle = new THREE.Group();
handle.position.set(0.02 * S, 0.002 * S, 0.045 * S);
handle.rotation.y = -0.35;
pf.add(handle);
const grip = new THREE.Mesh(
  new THREE.CylinderGeometry(0.013 * S, 0.017 * S, 0.13 * S, 24),
  blackPlastic
);
grip.rotation.x = Math.PI / 2;
grip.position.z = 0.075 * S;
grip.castShadow = grip.receiveShadow = true;
handle.add(grip);
const gripEnd = new THREE.Mesh(new THREE.SphereGeometry(0.017 * S, 24, 16), blackPlastic);
gripEnd.position.z = 0.14 * S;
gripEnd.castShadow = true;
handle.add(gripEnd);

// --- Steam wand (right side) ---
const wand = new THREE.Group();
wand.position.set((BODY_W / 2) * S, (BODY_Y + 0.22) * S, 0.06 * S);
machine.add(wand);
// ball joint
const joint = new THREE.Mesh(new THREE.SphereGeometry(0.016 * S, 24, 16), chrome);
joint.castShadow = true;
wand.add(joint);
// arm angled out and down
const armLen = 0.16;
const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.007 * S, 0.007 * S, armLen * S, 20), chrome);
arm.castShadow = true;
const armGroup = new THREE.Group();
armGroup.rotation.z = -0.55;
armGroup.rotation.x = 0.15;
arm.position.y = -armLen / 2 * S;
armGroup.add(arm);
// steam tip
const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.009 * S, 0.006 * S, 0.022 * S, 20), blackPlastic);
tip.position.y = -(armLen + 0.011) * S;
tip.castShadow = true;
armGroup.add(tip);
wand.add(armGroup);

// Steam knob above wand on side panel
const knob = cyl(0.026, 0.026, 0.022, blackPlastic, BODY_W / 2 + 0.008, BODY_Y + 0.26, 0.06, 32);
knob.rotation.z = Math.PI / 2;
const knobRib = cyl(0.006, 0.006, 0.05, blackPlastic, BODY_W / 2 + 0.02, BODY_Y + 0.26, 0.06, 12);
knobRib.rotation.x = Math.PI / 2;

// --- Top control area ---
const topY = BODY_Y + BODY_H;
// top plate recess
box(BODY_W * 0.96, 0.008, BODY_D * 0.96, steelBrushed, 0, topY + 0.004, -0.015);
// cup-warmer rails
for (let i = -3; i <= 3; i++) {
  const rail = cyl(0.003, 0.003, BODY_D * 0.8, chrome, i * 0.035, topY + 0.012, -0.03, 12);
  rail.rotation.x = Math.PI / 2;
}
// Pressure gauge on fascia
const gaugeZ = -0.015 + BODY_D / 2 + 0.006;
const gauge = cyl(0.034, 0.034, 0.014, chrome, 0, BODY_Y + 0.24, gaugeZ, 40);
gauge.rotation.x = Math.PI / 2;
const face = cyl(0.028, 0.028, 0.002, dialFace, 0, BODY_Y + 0.24, gaugeZ + 0.007, 40);
face.rotation.x = Math.PI / 2;
const needle = box(0.002, 0.022, 0.002, blackMatte, 0.006, BODY_Y + 0.246, gaugeZ + 0.009);
needle.rotation.z = -0.7;
// Buttons / switch row beside gauge
[-0.095, 0.095].forEach(x => {
  const btn = cyl(0.014, 0.014, 0.012, blackPlastic, x, BODY_Y + 0.24, gaugeZ + 0.002, 28);
  btn.rotation.x = Math.PI / 2;
});
// Power lamp
const lamp = cyl(0.006, 0.006, 0.008, new THREE.MeshStandardMaterial({
  color: 0xff5522, emissive: 0xff3300, emissiveIntensity: 1.6, roughness: 0.3
}), -0.06, BODY_Y + 0.275, gaugeZ, 20);
lamp.rotation.x = Math.PI / 2;

// --- Rear water tank with seam ---
const tankD = 0.055;
const tank = box(BODY_W * 0.92, BODY_H * 0.92, tankD, tankPlastic, 0, BODY_Y + BODY_H / 2 + 0.01, -0.015 - BODY_D / 2 - tankD / 2 + 0.002);
// visible seam line where tank meets body
box(BODY_W * 0.94, BODY_H * 0.94, 0.004, blackMatte, 0, BODY_Y + BODY_H / 2 + 0.01, -0.015 - BODY_D / 2 + 0.002);
// tank lid
box(BODY_W * 0.92, 0.012, tankD, blackPlastic, 0, BODY_Y + BODY_H + 0.022, -0.015 - BODY_D / 2 - tankD / 2 + 0.002);
// tank handle notch
box(0.05, 0.008, 0.02, blackMatte, 0, BODY_Y + BODY_H + 0.034, -0.015 - BODY_D / 2 - tankD / 2);

// --- Water level inside tank hint ---
box(BODY_W * 0.86, BODY_H * 0.55, tankD * 0.6,
  new THREE.MeshStandardMaterial({ color: 0x2f6a8f, metalness: 0, roughness: 0.1, transparent: true, opacity: 0.5 }),
  0, BODY_Y + BODY_H * 0.34, -0.015 - BODY_D / 2 - tankD / 2 + 0.002);

// Center machine vertically nicely
machine.position.y = 0;

// ---------- Ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(7, 64),
  new THREE.MeshStandardMaterial({ color: 0x26282d, metalness: 0.1, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Extra soft contact shadow
const shadowTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 20, 128, 128, 128);
  grad.addColorStop(0, 'rgba(0,0,0,0.45)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const contact = new THREE.Mesh(
  new THREE.PlaneGeometry(2.4, 2.4),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
);
contact.rotation.x = -Math.PI / 2;
contact.position.y = 0.002;
scene.add(contact);

// ---------- Resize / Loop ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
