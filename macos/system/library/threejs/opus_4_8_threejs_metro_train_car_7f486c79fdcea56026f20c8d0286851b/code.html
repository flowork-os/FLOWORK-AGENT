<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Metro Train Car Section</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141619; }
  #app { position: fixed; inset: 0; }
  .hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #8a929c; letter-spacing: .3px; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">Metro train car — drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ------------------------------------------------------------------ *
 *  Renderer
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

/* ------------------------------------------------------------------ *
 *  Scene + environment
 * ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171a);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ *
 *  Camera + controls
 * ------------------------------------------------------------------ */
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(18, 8.2, 18.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.minDistance = 10;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.492;
controls.target.set(0, 1.85, 0);

/* ------------------------------------------------------------------ *
 *  Lighting: hemisphere fill + key + fill + rim
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xbfd4ff, 0x2b2622, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3e2, 2.5);
key.position.set(15, 21, 12);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 80;
key.shadow.camera.left = -16;
key.shadow.camera.right = 16;
key.shadow.camera.top = 15;
key.shadow.camera.bottom = -15;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0xaecbff, 0.7);
fill.position.set(-17, 9, -5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd8ac, 1.15);
rim.position.set(-9, 11, -15);
scene.add(rim);

/* ------------------------------------------------------------------ *
 *  Ground plane — receives shadows only
 * ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(240, 240),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ *
 *  The single centered object: the metro car
 * ------------------------------------------------------------------ */
const train = new THREE.Group();
scene.add(train);

/* ---- dimensions (metres) ---- */
const carLength   = 18.4;
const bodyWidth   = 2.9;
const bodyHeight  = 2.75;
const topR = 0.62, botR = 0.14;
const bevelT = 0.22, bevelS = 0.18;
const bodyLen = carLength - 2 * bevelT;

const floorBottomY = 1.05;
const bodyCenterY  = floorBottomY + bodyHeight / 2;   // 2.425
const bodyTopY     = floorBottomY + bodyHeight;       // 3.8

const wheelR = 0.45;
const trackHalf = 1.05;

/* ---- materials ---- */
const bodyMat = new THREE.MeshStandardMaterial({
  color: 0xdfe3e6, metalness: 0.45, roughness: 0.4, envMapIntensity: 0.85
});
const accentMat = new THREE.MeshStandardMaterial({
  color: 0x2a6fb0, metalness: 0.45, roughness: 0.35, envMapIntensity: 0.9
});
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0x0a0f14, metalness: 0.1, roughness: 0.06,
  clearcoat: 1.0, clearcoatRoughness: 0.06, envMapIntensity: 1.25
});
const frameMat = new THREE.MeshStandardMaterial({
  color: 0x24272b, metalness: 0.6, roughness: 0.5
});
const darkMat = new THREE.MeshStandardMaterial({
  color: 0x1a1c1f, metalness: 0.5, roughness: 0.6
});
const equipMat = new THREE.MeshStandardMaterial({
  color: 0x36393d, metalness: 0.65, roughness: 0.55
});
const bogieMat = new THREE.MeshStandardMaterial({
  color: 0x2b2e31, metalness: 0.7, roughness: 0.5
});
const wheelMat = new THREE.MeshStandardMaterial({
  color: 0x141416, metalness: 0.8, roughness: 0.45
});
const railMat = new THREE.MeshStandardMaterial({
  color: 0x5a5f65, metalness: 0.9, roughness: 0.4
});
const headMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, emissive: 0xfff1d6, emissiveIntensity: 2.4, roughness: 0.25, metalness: 0.1
});
const markMat = new THREE.MeshStandardMaterial({
  color: 0x551111, emissive: 0xff2a12, emissiveIntensity: 1.6, roughness: 0.4
});

/* ---- helpers ---- */
function shadowize(mesh) { mesh.castShadow = true; mesh.receiveShadow = true; return mesh; }
function box(w, h, d, mat) { return shadowize(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat)); }
function rbox(w, h, d, r, mat) { return shadowize(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, r), mat)); }

/* ---- carriage body (extruded rounded profile) ---- */
function bodyProfile(w, h, tR, bR) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + bR, y);
  s.lineTo(x + w - bR, y);
  s.quadraticCurveTo(x + w, y, x + w, y + bR);
  s.lineTo(x + w, y + h - tR);
  s.quadraticCurveTo(x + w, y + h, x + w - tR, y + h);
  s.lineTo(x + tR, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - tR);
  s.lineTo(x, y + bR);
  s.quadraticCurveTo(x, y, x + bR, y);
  return s;
}

const bodyGeo = new THREE.ExtrudeGeometry(
  bodyProfile(bodyWidth, bodyHeight, topR, botR),
  { depth: bodyLen, bevelEnabled: true, bevelThickness: bevelT, bevelSize: bevelS,
    bevelSegments: 4, curveSegments: 18 }
);
bodyGeo.center();
bodyGeo.rotateY(Math.PI / 2);          // length now along X
const bodyMesh = shadowize(new THREE.Mesh(bodyGeo, bodyMat));
bodyMesh.position.y = bodyCenterY;
train.add(bodyMesh);

/* ---- livery stripe (below windows, both sides) ---- */
[1, -1].forEach(side => {
  const stripe = box(carLength - 0.85, 0.15, 0.02, accentMat);
  stripe.position.set(0, 2.14, side * (bodyWidth / 2 + 0.006));
  train.add(stripe);
});

/* ---- side windows ---- */
const winW = 0.95, winH = 0.8, winCenterY = 2.72;
function addWindow(x, side) {
  const z = side * (bodyWidth / 2);
  const frame = rbox(winW + 0.09, winH + 0.09, 0.06, 0.02, frameMat);
  frame.position.set(x, winCenterY, z + side * 0.012);
  const glass = box(winW, winH, 0.06, glassMat);
  glass.position.set(x, winCenterY, z + side * 0.002);
  train.add(frame, glass);
}

/* ---- sliding passenger doors (two sets) ---- */
const doorX = [-4.4, 4.4];
const doorWidth = 1.4, doorHeight = 1.85;
const doorCenterY = floorBottomY + 0.15 + doorHeight / 2;
function addDoor(x, side) {
  const z = side * (bodyWidth / 2);
  const surround = box(doorWidth + 0.14, doorHeight + 0.14, 0.04, frameMat);
  surround.position.set(x, doorCenterY, z - side * 0.006);
  train.add(surround);

  const seam = box(0.05, doorHeight, 0.02, darkMat);
  seam.position.set(x, doorCenterY, z + side * 0.008);
  train.add(seam);

  const leafW = doorWidth / 2 - 0.03;
  [-1, 1].forEach(s2 => {
    const lx = x + s2 * (doorWidth / 4 + 0.008);
    const leaf = rbox(leafW, doorHeight, 0.07, 0.02, accentMat);
    leaf.position.set(lx, doorCenterY, z + side * 0.02);
    const lg = box(leafW - 0.15, 0.9, 0.07, glassMat);
    lg.position.set(lx, doorCenterY + 0.34, z + side * 0.012);
    train.add(leaf, lg);
  });
}

/* ---- lay out windows (skip door zones), and doors ---- */
const pitch = 1.25;
const endLimit = carLength / 2 - 1.6;
const maxI = Math.floor(endLimit / pitch);
for (let i = -maxI; i <= maxI; i++) {
  const x = i * pitch;
  let blocked = false;
  for (const dx of doorX) if (Math.abs(x - dx) < doorWidth / 2 + 0.35 + winW / 2) blocked = true;
  if (blocked) continue;
  addWindow(x, 1);
  addWindow(x, -1);
}
doorX.forEach(dx => { addDoor(dx, 1); addDoor(dx, -1); });

/* ---- roof-mounted equipment silhouettes ---- */
function addRoofBox(x, w, h, d) {
  const b = rbox(w, h, d, 0.05, equipMat);
  b.position.set(x, bodyTopY - 0.08 + h / 2, 0);
  train.add(b);
}
addRoofBox(0, 4.6, 0.5, 1.95);     // main HVAC
addRoofBox(-6.0, 1.7, 0.4, 1.5);
addRoofBox(6.0, 1.7, 0.4, 1.5);
addRoofBox(-2.9, 0.7, 0.32, 1.2);
addRoofBox(2.9, 0.7, 0.32, 1.2);
// longitudinal cable duct
const duct = box(carLength - 3.2, 0.16, 0.42, equipMat);
duct.position.set(0, bodyTopY - 0.02, 0.7);
train.add(duct);
const duct2 = duct.clone(); duct2.position.z = -0.7; train.add(duct2);

/* ---- underbody equipment boxes ---- */
function addUnderBox(x, w, h, d) {
  const b = rbox(w, h, d, 0.04, equipMat);
  b.position.set(x, floorBottomY - 0.03 - h / 2, 0);
  train.add(b);
}
addUnderBox(-2.7, 2.3, 0.52, 1.65);
addUnderBox(0.3, 2.5, 0.56, 1.75);
addUnderBox(2.9, 1.8, 0.46, 1.5);

/* ---- bogies + wheels ---- */
function addWheel(x, z) {
  const w = shadowize(new THREE.Mesh(new THREE.CylinderGeometry(wheelR, wheelR, 0.16, 28), wheelMat));
  w.rotation.x = Math.PI / 2;
  w.position.set(x, wheelR, z);
  train.add(w);
}
function addBogie(x) {
  const frame = rbox(2.05, 0.36, 1.95, 0.05, bogieMat);
  frame.position.set(x, 0.66, 0);
  train.add(frame);
  [-0.9, 0.9].forEach(dx => {
    addWheel(x + dx, trackHalf);
    addWheel(x + dx, -trackHalf);
    const axle = shadowize(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.2, 14), bogieMat));
    axle.rotation.x = Math.PI / 2;
    axle.position.set(x + dx, wheelR, 0);
    train.add(axle);
  });
}
addBogie(-5.9);
addBogie(5.9);

/* ---- rail segments underneath ---- */
[trackHalf, -trackHalf].forEach(z => {
  const rail = box(carLength + 3, 0.12, 0.12, railMat);
  rail.position.set(0, 0.06, z);
  train.add(rail);
});

/* ---- end lights (head + marker) ---- */
[1, -1].forEach(side => {
  const xEnd = side * (carLength / 2 - 0.28);
  [0.72, -0.72].forEach(z => {
    const head = shadowize(new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.1, 20), headMat));
    head.rotation.z = Math.PI / 2;
    head.position.set(xEnd, 1.5, z);
    train.add(head);
    const mark = box(0.16, 0.16, 0.1, markMat);
    mark.position.set(xEnd, 2.95, z);
    train.add(mark);
  });
});

/* ------------------------------------------------------------------ *
 *  Resize + render loop
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
