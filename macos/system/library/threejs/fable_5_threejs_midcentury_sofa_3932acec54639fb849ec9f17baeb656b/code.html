<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mid-Century Sofa</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e8e4dc; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e4dc);
scene.fog = new THREE.Fog(0xe8e4dc, 12, 24);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.2, 2.0, 4.4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.55, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 2.5;
controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI * 0.49;

// Lighting
scene.add(new THREE.HemisphereLight(0xfff5e8, 0x8a857c, 0.55));
const key = new THREE.DirectionalLight(0xfff2df, 1.6);
key.position.set(4, 6, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4; key.shadow.camera.right = 4;
key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0004;
key.shadow.radius = 6;
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.45);
fill.position.set(-5, 3, -3);
scene.add(fill);

// Ground + soft shadow
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(12, 64),
  new THREE.MeshStandardMaterial({ color: 0xded9cf, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Materials
const fabric = new THREE.MeshStandardMaterial({ color: 0x7a8471, roughness: 0.92 });      // muted sage
const fabricDark = new THREE.MeshStandardMaterial({ color: 0x6e7866, roughness: 0.92 });  // frame upholstery
const wood = new THREE.MeshStandardMaterial({ color: 0x8a5a2b, roughness: 0.55, metalness: 0.05 });

// Rounded box helper
function roundedBox(w, h, d, r, mat) {
  r = Math.min(r, w / 2, h / 2, d / 2);
  const shape = new THREE.Shape();
  const x = w / 2 - r, y = h / 2 - r;
  shape.moveTo(-x, -h / 2);
  shape.lineTo(x, -h / 2);
  shape.absarc(x, -y, r, -Math.PI / 2, 0);
  shape.lineTo(w / 2, y);
  shape.absarc(x, y, r, 0, Math.PI / 2);
  shape.lineTo(-x, h / 2);
  shape.absarc(-x, y, r, Math.PI / 2, Math.PI);
  shape.lineTo(-w / 2, -y);
  shape.absarc(-x, -y, r, Math.PI, Math.PI * 1.5);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: d - 2 * r, bevelEnabled: true, bevelSegments: 6,
    bevelSize: r, bevelThickness: r, curveSegments: 12
  });
  geo.center();
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}

const sofa = new THREE.Group();

// Dimensions
const W = 2.3;          // overall width
const D = 0.95;         // overall depth
const frameH = 0.16;    // frame slab height
const frameY = 0.34;    // frame top sits legs + frame
const armW = 0.09;
const innerW = W - 2 * armW;

// Low rectangular frame (upholstered base slab)
const frame = roundedBox(W, frameH, D, 0.03, fabricDark);
frame.position.y = frameY - frameH / 2;
sofa.add(frame);

// Thin armrests
for (const s of [-1, 1]) {
  const arm = roundedBox(armW, 0.34, D, 0.03, fabricDark);
  arm.position.set(s * (W / 2 - armW / 2), frameY + 0.17, 0);
  sofa.add(arm);
}

// Low backrest panel (frame back)
const backPanel = roundedBox(innerW, 0.46, 0.12, 0.03, fabricDark);
backPanel.position.set(0, frameY + 0.23, -D / 2 + 0.06);
backPanel.rotation.x = -0.09;
sofa.add(backPanel);

// Three seat cushions + three back cushions
const cw = innerW / 3 - 0.02;
for (let i = 0; i < 3; i++) {
  const cx = (i - 1) * (innerW / 3);
  const seat = roundedBox(cw, 0.15, D - 0.18, 0.055, fabric);
  seat.position.set(cx, frameY + 0.075, 0.035);
  sofa.add(seat);
  const back = roundedBox(cw, 0.42, 0.14, 0.055, fabric);
  back.position.set(cx, frameY + 0.15 + 0.20, -D / 2 + 0.155);
  back.rotation.x = -0.13;
  sofa.add(back);
}

// Four splayed tapered wooden legs
const legGeo = new THREE.CylinderGeometry(0.020, 0.032, frameY - frameH + 0.02, 12);
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  const leg = new THREE.Mesh(legGeo, wood);
  leg.castShadow = leg.receiveShadow = true;
  leg.position.set(sx * (W / 2 - 0.14), (frameY - frameH) / 2, sz * (D / 2 - 0.12));
  leg.rotation.z = -sx * 0.12;
  leg.rotation.x = sz * 0.10;
  sofa.add(leg);
}

// Wooden stretcher rail under frame front/back (subtle mid-century detail)
for (const sz of [-1, 1]) {
  const rail = new THREE.Mesh(new THREE.BoxGeometry(W - 0.24, 0.035, 0.05), wood);
  rail.castShadow = true;
  rail.position.set(0, frameY - frameH - 0.02, sz * (D / 2 - 0.12));
  sofa.add(rail);
}

scene.add(sofa);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
