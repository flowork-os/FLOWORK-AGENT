<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terraced Rice Fields</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #e9a66e;
    }

    canvas {
      display: block;
    }

    #title {
      position: fixed;
      left: 28px;
      top: 24px;
      color: rgba(255, 249, 224, 0.94);
      font-family: Georgia, serif;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 12px rgba(62, 37, 24, 0.35);
      pointer-events: none;
      user-select: none;
    }

    #title strong {
      display: block;
      font-size: 22px;
      font-weight: normal;
    }

    #title span {
      display: block;
      margin-top: 5px;
      font: 11px Arial, sans-serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      opacity: 0.75;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="title">
    <strong>Morning in the Terraces</strong>
    <span>A quiet pastoral landscape</span>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xe8af83, 0.0115);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      260
    );
    camera.position.set(38, 27, 48);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 7, -4);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.18;
    controls.minDistance = 29;
    controls.maxDistance = 92;
    controls.maxPolarAngle = Math.PI * 0.48;

    let seed = 938471;

    function random() {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let t = seed;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }

    function range(a, b) {
      return a + (b - a) * random();
    }

    function pick(items) {
      return items[Math.floor(random() * items.length)];
    }

    function colorShift(color, amount) {
      const c = new THREE.Color(color);
      c.offsetHSL(range(-amount, amount), range(-amount, amount), range(-amount, amount));
      return c;
    }

    const mats = {
      soil: new THREE.MeshStandardMaterial({
        color: 0x76513a,
        roughness: 0.97
      }),
      wetSoil: new THREE.MeshStandardMaterial({
        color: 0x48372d,
        roughness: 0.8
      }),
      grass: new THREE.MeshStandardMaterial({
        color: 0x63863d,
        roughness: 0.92
      }),
      grassLight: new THREE.MeshStandardMaterial({
        color: 0x89a94c,
        roughness: 0.9
      }),
      rice: new THREE.MeshStandardMaterial({
        color: 0x77a83e,
        roughness: 0.8,
        side: THREE.DoubleSide
      }),
      riceTip: new THREE.MeshStandardMaterial({
        color: 0xa3c65b,
        roughness: 0.76
      }),
      wood: new THREE.MeshStandardMaterial({
        color: 0x6b4630,
        roughness: 0.92
      }),
      darkWood: new THREE.MeshStandardMaterial({
        color: 0x3e2b22,
        roughness: 0.96
      }),
      bamboo: new THREE.MeshStandardMaterial({
        color: 0x9a7a43,
        roughness: 0.84
      }),
      thatch: new THREE.MeshStandardMaterial({
        color: 0xb67a3f,
        roughness: 1
      }),
      palm: new THREE.MeshStandardMaterial({
        color: 0x416b39,
        roughness: 0.9,
        side: THREE.DoubleSide
      }),
      white: new THREE.MeshStandardMaterial({
        color: 0xfff8df,
        roughness: 0.72
      }),
      beak: new THREE.MeshStandardMaterial({
        color: 0xe8a52f,
        roughness: 0.7
      }),
      buffalo: new THREE.MeshStandardMaterial({
        color: 0x332c2b,
        roughness: 0.88
      }),
      horn: new THREE.MeshStandardMaterial({
        color: 0xd7c5a0,
        roughness: 0.74
      })
    };

    function enableShadows(object) {
      object.traverse(child => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      return object;
    }

    const skyMaterial = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: {
        topColor: { value: new THREE.Color(0x587fa2) },
        middleColor: { value: new THREE.Color(0xf2aa72) },
        bottomColor: { value: new THREE.Color(0xffd4a0) }
      },
      vertexShader: `
        varying vec3 vWorld;
        void main() {
          vec4 world = modelMatrix * vec4(position, 1.0);
          vWorld = world.xyz;
          gl_Position = projectionMatrix * viewMatrix * world;
        }
      `,
      fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 middleColor;
        uniform vec3 bottomColor;
        varying vec3 vWorld;
        void main() {
          float h = normalize(vWorld).y;
          vec3 col = mix(bottomColor, middleColor, smoothstep(-0.12, 0.2, h));
          col = mix(col, topColor, smoothstep(0.18, 0.82, h));
          gl_FragColor = vec4(col, 1.0);
        }
      `
    });

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(180, 40, 24),
      skyMaterial
    );
    scene.add(sky);

    const sun = new THREE.Mesh(
      new THREE.CircleGeometry(5.2, 48),
      new THREE.MeshBasicMaterial({
        color: 0xffd29b,
        transparent: true,
        opacity: 0.9,
        fog: false
      })
    );
    sun.position.set(-52, 29, -99);
    sun.lookAt(camera.position);
    scene.add(sun);

    const hemi = new THREE.HemisphereLight(0xffd7aa, 0x50613b, 1.55);
    scene.add(hemi);

    const sunrise = new THREE.DirectionalLight(0xffb46f, 4.25);
    sunrise.position.set(-38, 48, -35);
    sunrise.target.position.set(0, 3, -5);
    sunrise.castShadow = true;
    sunrise.shadow.mapSize.set(2048, 2048);
    sunrise.shadow.camera.left = -58;
    sunrise.shadow.camera.right = 58;
    sunrise.shadow.camera.top = 52;
    sunrise.shadow.camera.bottom = -45;
    sunrise.shadow.camera.near = 2;
    sunrise.shadow.camera.far = 130;
    sunrise.shadow.bias = -0.0004;
    scene.add(sunrise, sunrise.target);

    const fillLight = new THREE.DirectionalLight(0x85a9ca, 0.75);
    fillLight.position.set(40, 26, 40);
    scene.add(fillLight);

    function terrainHeight(x, z) {
      const hill = 9.8 * Math.exp(
        -((x * x) / 1350 + ((z - 17) * (z - 17)) / 980)
      );
      const slope = Math.max(0, (z + 35) * 0.065);
      return -2.2 + hill + slope;
    }

    const groundGeo = new THREE.PlaneGeometry(160, 155, 80, 72);
    groundGeo.rotateX(-Math.PI / 2);
    const gp = groundGeo.attributes.position;

    for (let i = 0; i < gp.count; i++) {
      const x = gp.getX(i);
      const z = gp.getZ(i);
      const ripple =
        Math.sin(x * 0.13) * 0.18 +
        Math.cos(z * 0.11) * 0.14 +
        Math.sin((x + z) * 0.07) * 0.12;
      gp.setY(i, terrainHeight(x, z) + ripple);
    }

    groundGeo.computeVertexNormals();

    const ground = new THREE.Mesh(
      groundGeo,
      new THREE.MeshStandardMaterial({
        color: 0x5d6f3c,
        roughness: 1,
        vertexColors: false
      })
    );
    ground.receiveShadow = true;
    scene.add(ground);

    const waterUniforms = [];

    function createWaterMaterial(phase) {
      const uniforms = {
        time: { value: phase },
        deepColor: { value: new THREE.Color(0x557c78) },
        skyColor: { value: new THREE.Color(0xf3a56c) },
        sunColor: { value: new THREE.Color(0xffd7a1) }
      };
      waterUniforms.push(uniforms);

      return new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: true,
        side: THREE.DoubleSide,
        uniforms,
        vertexShader: `
          uniform float time;
          varying vec3 vWorld;
          varying float vWave;
          void main() {
            vec3 p = position;
            float w1 = sin(p.x * 1.15 + time * 1.8);
            float w2 = sin(p.z * 1.7 - time * 2.15);
            float w3 = sin((p.x + p.z) * 2.7 + time * 1.1);
            float wave = (w1 + w2 * 0.7 + w3 * 0.35) * 0.026;
            p.y += wave;
            vWave = wave;
            vec4 world = modelMatrix * vec4(p, 1.0);
            vWorld = world.xyz;
            gl_Position = projectionMatrix * viewMatrix * world;
          }
        `,
        fragmentShader: `
          uniform float time;
          uniform vec3 deepColor;
          uniform vec3 skyColor;
          uniform vec3 sunColor;
          varying vec3 vWorld;
          varying float vWave;
          void main() {
            float bands = sin(vWorld.x * 2.7 + vWorld.z * 4.2 + time * 2.2);
            float fine = sin(vWorld.x * 10.0 - vWorld.z * 6.0 - time * 3.8);
            float shimmer = smoothstep(0.68, 1.0, bands * 0.58 + fine * 0.18 + 0.52);
            float horizon = smoothstep(-18.0, 24.0, vWorld.z);
            vec3 col = mix(deepColor, skyColor, 0.48 + horizon * 0.18);
            col = mix(col, sunColor, shimmer * 0.42);
            col += vWave * 2.0;
            gl_FragColor = vec4(col, 0.86);
          }
        `
      });
    }

    function arcStripGeometry(
      innerRadius,
      outerRadius,
      y,
      startAngle,
      endAngle,
      segments = 80
    ) {
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i <= segments; i++) {
        const f = i / segments;
        const angle = THREE.MathUtils.lerp(startAngle, endAngle, f);
        const wobble = Math.sin(angle * 4.1 + innerRadius) * 0.18;
        const r0 = innerRadius + wobble;
        const r1 = outerRadius + wobble * 0.6;

        positions.push(
          Math.cos(angle) * r0,
          y,
          16 + Math.sin(angle) * r0
        );
        positions.push(
          Math.cos(angle) * r1,
          y,
          16 + Math.sin(angle) * r1
        );
        uvs.push(f, 0, f, 1);
      }

      for (let i = 0; i < segments; i++) {
        const a = i * 2;
        indices.push(a, a + 1, a + 2);
        indices.push(a + 1, a + 3, a + 2);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        'position',
        new THREE.Float32BufferAttribute(positions, 3)
      );
      geometry.setAttribute(
        'uv',
        new THREE.Float32BufferAttribute(uvs, 2)
      );
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    function arcCurve(radius, y, start, end, offset = 0) {
      const points = [];

      for (let i = 0; i <= 70; i++) {
        const f = i / 70;
        const a = THREE.MathUtils.lerp(start, end, f);
        const wobble = Math.sin(a * 4.1 + radius) * 0.18;
        const r = radius + wobble + offset;
        points.push(
          new THREE.Vector3(
            Math.cos(a) * r,
            y,
            16 + Math.sin(a) * r
          )
        );
      }

      return new THREE.CatmullRomCurve3(points);
    }

    function createBund(radius, y, start, end, width) {
      const curve = arcCurve(radius, y, start, end);
      const geometry = new THREE.TubeGeometry(
        curve,
        84,
        width,
        6,
        false
      );
      const bund = new THREE.Mesh(geometry, mats.grass);
      bund.castShadow = true;
      bund.receiveShadow = true;
      scene.add(bund);

      const inner = new THREE.Mesh(
        new THREE.TubeGeometry(
          arcCurve(radius - width * 0.28, y - 0.12, start, end),
          84,
          width * 0.55,
          6,
          false
        ),
        mats.soil
      );
      inner.receiveShadow = true;
      scene.add(inner);
    }

    function createTerraceWall(
      outerRadius,
      upperY,
      lowerY,
      start,
      end
    ) {
      const positions = [];
      const indices = [];
      const segments = 80;

      for (let i = 0; i <= segments; i++) {
        const f = i / segments;
        const a = THREE.MathUtils.lerp(start, end, f);
        const wobble = Math.sin(a * 4.1 + outerRadius) * 0.18;
        const r = outerRadius + wobble;
        const x = Math.cos(a) * r;
        const z = 16 + Math.sin(a) * r;

        positions.push(x, upperY, z);
        positions.push(x, lowerY, z);
      }

      for (let i = 0; i < segments; i++) {
        const a = i * 2;
        indices.push(a, a + 2, a + 1);
        indices.push(a + 2, a + 3, a + 1);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        'position',
        new THREE.Float32BufferAttribute(positions, 3)
      );
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      const wall = new THREE.Mesh(geometry, mats.soil);
      wall.castShadow = true;
      wall.receiveShadow = true;
      scene.add(wall);
    }

    const riceBladeGeometry = new THREE.ConeGeometry(0.055, 0.62, 4);
    riceBladeGeometry.translate(0, 0.31, 0);

    const riceGroup = new THREE.Group();
    scene.add(riceGroup);

    function createRiceTuft(position, scale = 1) {
      const tuft = new THREE.Group();
      const count = 5;

      for (let i = 0; i < count; i++) {
        const blade = new THREE.Mesh(riceBladeGeometry, mats.rice);
        const a = i / count * Math.PI * 2;
        blade.position.set(
          Math.cos(a) * 0.06,
          0,
          Math.sin(a) * 0.06
        );
        blade.rotation.z = Math.cos(a) * 0.18;
        blade.rotation.x = Math.sin(a) * 0.18;
        tuft.add(blade);
      }

      tuft.position.copy(position);
      tuft.scale.setScalar(scale);
      tuft.userData.phase = range(0, Math.PI * 2);
      riceGroup.add(tuft);
    }

    const terraceData = [];

    for (let level = 0; level < 8; level++) {
      const inner = 9.5 + level * 5.0;
      const outer = inner + 3.65;
      const y = 13.8 - level * 1.82;
      const start = THREE.MathUtils.degToRad(198 + level * 1.6);
      const end = THREE.MathUtils.degToRad(342 - level * 1.25);

      terraceData.push({ inner, outer, y, start, end });

      const bed = new THREE.Mesh(
        arcStripGeometry(inner, outer, y - 0.11, start, end),
        mats.wetSoil
      );
      bed.receiveShadow = true;
      scene.add(bed);

      const water = new THREE.Mesh(
        arcStripGeometry(
          inner + 0.26,
          outer - 0.34,
          y + 0.015,
          start + 0.012,
          end - 0.012
        ),
        createWaterMaterial(level * 0.81)
      );
      water.renderOrder = 1;
      scene.add(water);

      createBund(outer + 0.2, y + 0.16, start, end, 0.48);
      createTerraceWall(
        outer + 0.28,
        y + 0.08,
        y - 1.62,
        start,
        end
      );

      const radialRows = 3;

      for (let row = 0; row < radialRows; row++) {
        const radius = THREE.MathUtils.lerp(
          inner + 0.68,
          outer - 0.72,
          row / (radialRows - 1)
        );
        const plants = Math.floor((end - start) * radius / 1.18);

        for (let p = 0; p <= plants; p++) {
          if (random() < 0.07) continue;

          const f = p / plants;
          const a = THREE.MathUtils.lerp(start + 0.035, end - 0.035, f);
          const r = radius + Math.sin(a * 5.0 + level) * 0.11;
          createRiceTuft(
            new THREE.Vector3(
              Math.cos(a) * r,
              y + 0.04,
              16 + Math.sin(a) * r
            ),
            range(0.78, 1.08)
          );
        }
      }
    }

    function cylinderBetween(a, b, radius, material, radial = 7) {
      const direction = new THREE.Vector3().subVectors(b, a);
      const length = direction.length();
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, radial),
        material
      );
      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      return mesh;
    }

    function makePath() {
      const points = [
        new THREE.Vector3(34, 0.6, 4),
        new THREE.Vector3(26, 2.4, 0),
        new THREE.Vector3(20, 4.0, -7),
        new THREE.Vector3(12, 6.0, -9),
        new THREE.Vector3(8, 8.0, -3),
        new THREE.Vector3(12, 10.0, 5),
        new THREE.Vector3(8, 12.0, 12)
      ];

      const curve = new THREE.CatmullRomCurve3(points);
      const path = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 100, 0.52, 7, false),
        new THREE.MeshStandardMaterial({
          color: 0xb58b5d,
          roughness: 1
        })
      );
      path.castShadow = true;
      path.receiveShadow = true;
      scene.add(path);

      for (let i = 0; i < 22; i++) {
        const p = curve.getPoint(i / 21);
        const stone = new THREE.Mesh(
          new THREE.DodecahedronGeometry(range(0.11, 0.23), 0),
          new THREE.MeshStandardMaterial({
            color: colorShift(0x8b755e, 0.04),
            roughness: 1
          })
        );
        stone.position.copy(p);
        stone.position.y += 0.35;
        stone.scale.set(range(0.7, 1.5), 0.35, range(0.8, 1.4));
        stone.castShadow = true;
        scene.add(stone);
      }
    }

    makePath();

    function createHut() {
      const hut = new THREE.Group();
      hut.position.set(-10.5, 11.4, 7.0);
      hut.rotation.y = -0.25;

      const floorY = 2.15;

      for (const x of [-2.0, 2.0]) {
        for (const z of [-1.45, 1.45]) {
          const post = new THREE.Mesh(
            new THREE.CylinderGeometry(0.14, 0.19, 3.9, 7),
            mats.darkWood
          );
          post.position.set(x, 0.65, z);
          hut.add(post);
        }
      }

      const floor = new THREE.Mesh(
        new THREE.BoxGeometry(5.0, 0.28, 3.8),
        mats.wood
      );
      floor.position.y = floorY;
      hut.add(floor);

      const wall = new THREE.Mesh(
        new THREE.BoxGeometry(4.5, 2.65, 3.35),
        mats.bamboo
      );
      wall.position.y = floorY + 1.46;
      hut.add(wall);

      const doorway = new THREE.Mesh(
        new THREE.PlaneGeometry(1.15, 2.05),
        new THREE.MeshStandardMaterial({
          color: 0x281f1b,
          roughness: 1
        })
      );
      doorway.position.set(0.85, floorY + 1.08, 1.681);
      hut.add(doorway);

      const windowFrame = new THREE.Mesh(
        new THREE.BoxGeometry(1.1, 0.86, 0.08),
        mats.darkWood
      );
      windowFrame.position.set(-1.18, floorY + 1.58, 1.72);
      hut.add(windowFrame);

      const windowDark = new THREE.Mesh(
        new THREE.PlaneGeometry(0.78, 0.56),
        new THREE.MeshBasicMaterial({ color: 0x493526 })
      );
      windowDark.position.set(-1.18, floorY + 1.58, 1.77);
      hut.add(windowDark);

      const roofShape = new THREE.Shape();
      roofShape.moveTo(-3.3, 0);
      roofShape.lineTo(0, 1.8);
      roofShape.lineTo(3.3, 0);
      roofShape.lineTo(-3.3, 0);

      const roofGeo = new THREE.ExtrudeGeometry(roofShape, {
        depth: 4.8,
        bevelEnabled: true,
        bevelSize: 0.12,
        bevelThickness: 0.12,
        bevelSegments: 2
      });
      roofGeo.translate(0, 0, -2.4);

      const roof = new THREE.Mesh(roofGeo, mats.thatch);
      roof.position.y = floorY + 2.68;
      hut.add(roof);

      const ladderLeft = cylinderBetween(
        new THREE.Vector3(1.4, -1.2, 2.5),
        new THREE.Vector3(1.4, 2.2, 1.85),
        0.08,
        mats.wood
      );
      const ladderRight = cylinderBetween(
        new THREE.Vector3(2.2, -1.2, 2.5),
        new THREE.Vector3(2.2, 2.2, 1.85),
        0.08,
        mats.wood
      );
      hut.add(ladderLeft, ladderRight);

      for (let i = 0; i < 5; i++) {
        const y = -0.75 + i * 0.63;
        const rung = cylinderBetween(
          new THREE.Vector3(1.39, y, 2.42),
          new THREE.Vector3(2.21, y, 2.42),
          0.065,
          mats.wood
        );
        hut.add(rung);
      }

      const basket = new THREE.Mesh(
        new THREE.CylinderGeometry(0.48, 0.34, 0.7, 12, 1, true),
        new THREE.MeshStandardMaterial({
          color: 0xa77a43,
          roughness: 1,
          side: THREE.DoubleSide
        })
      );
      basket.position.set(-2.4, floorY + 0.4, 1.1);
      hut.add(basket);

      enableShadows(hut);
      scene.add(hut);
    }

    createHut();

    const animatedPalms = [];

    function createPalm(x, y, z, height, leanX, leanZ) {
      const palm = new THREE.Group();
      palm.position.set(x, y, z);

      const trunkPoints = [
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(leanX * 0.25, height * 0.35, leanZ * 0.2),
        new THREE.Vector3(leanX * 0.7, height * 0.7, leanZ * 0.65),
        new THREE.Vector3(leanX, height, leanZ)
      ];
      const trunkCurve = new THREE.CatmullRomCurve3(trunkPoints);
      const trunk = new THREE.Mesh(
        new THREE.TubeGeometry(
          trunkCurve,
          14,
          height * 0.035,
          7,
          false
        ),
        mats.wood
      );
      palm.add(trunk);

      const crown = new THREE.Group();
      crown.position.copy(trunkPoints[trunkPoints.length - 1]);
      palm.add(crown);

      for (let i = 0; i < 9; i++) {
        const angle = i / 9 * Math.PI * 2 + range(-0.12, 0.12);
        const length = range(2.8, 4.4);
        const width = range(0.55, 0.85);
        const shape = new THREE.Shape();

        shape.moveTo(0, 0);
        shape.quadraticCurveTo(length * 0.48, width, length, 0);
        shape.quadraticCurveTo(length * 0.48, -width, 0, 0);

        const frond = new THREE.Mesh(
          new THREE.ShapeGeometry(shape, 10),
          mats.palm
        );
        frond.rotation.x = -Math.PI / 2 + range(-0.2, 0.1);
        frond.rotation.y = -angle;
        frond.rotation.z = range(-0.38, -0.08);
        frond.userData.baseZ = frond.rotation.z;
        frond.userData.phase = range(0, Math.PI * 2);
        crown.add(frond);
      }

      const coconuts = new THREE.Group();

      for (let i = 0; i < 4; i++) {
        const coconut = new THREE.Mesh(
          new THREE.SphereGeometry(0.23, 8, 6),
          new THREE.MeshStandardMaterial({
            color: 0x6f5832,
            roughness: 0.9
          })
        );
        coconut.position.set(
          range(-0.35, 0.35),
          range(-0.5, -0.1),
          range(-0.35, 0.35)
        );
        coconuts.add(coconut);
      }

      crown.add(coconuts);
      crown.userData.phase = range(0, Math.PI * 2);
      animatedPalms.push(crown);
      enableShadows(palm);
      scene.add(palm);
    }

    createPalm(-22, 8.0, 12, 9.8, 1.2, -0.4);
    createPalm(-17.5, 8.6, 15, 8.4, -0.8, 0.5);
    createPalm(-25.5, 6.6, 7.5, 7.6, 0.4, 0.7);
    createPalm(20, 4.3, -8, 9.2, -0.9, 0.4);
    createPalm(24, 3.1, -10, 7.8, 0.8, -0.2);
    createPalm(29, 1.2, -7, 6.9, -0.5, 0.5);

    function createPool() {
      const pool = new THREE.Mesh(
        new THREE.CircleGeometry(5.0, 48),
        createWaterMaterial(2.7)
      );
      pool.rotation.x = -Math.PI / 2;
      pool.scale.set(1.4, 0.75, 1);
      pool.position.set(17, 0.12, 13);
      scene.add(pool);

      const mud = new THREE.Mesh(
        new THREE.RingGeometry(4.8, 6.0, 48),
        mats.wetSoil
      );
      mud.rotation.x = -Math.PI / 2;
      mud.scale.set(1.4, 0.75, 1);
      mud.position.set(17, 0.02, 13);
      mud.receiveShadow = true;
      scene.add(mud);
    }

    createPool();

    const buffaloGroup = new THREE.Group();

    function createBuffalo() {
      buffaloGroup.position.set(17, 1.15, 10.5);
      buffaloGroup.rotation.y = -0.62;

      const body = new THREE.Mesh(
        new THREE.SphereGeometry(1.55, 18, 12),
        mats.buffalo
      );
      body.scale.set(1.65, 0.82, 0.83);
      body.position.y = 1.1;
      buffaloGroup.add(body);

      const shoulder = new THREE.Mesh(
        new THREE.SphereGeometry(1.05, 16, 10),
        mats.buffalo
      );
      shoulder.scale.set(0.95, 1.05, 0.88);
      shoulder.position.set(1.5, 1.25, 0);
      buffaloGroup.add(shoulder);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.72, 14, 10),
        mats.buffalo
      );
      head.scale.set(1.0, 0.9, 0.82);
      head.position.set(2.2, 0.85, 0);
      buffaloGroup.add(head);

      const muzzle = new THREE.Mesh(
        new THREE.SphereGeometry(0.38, 12, 8),
        new THREE.MeshStandardMaterial({
          color: 0x66544a,
          roughness: 0.92
        })
      );
      muzzle.scale.set(1.0, 0.7, 0.95);
      muzzle.position.set(2.75, 0.62, 0);
      buffaloGroup.add(muzzle);

      for (const z of [-0.62, 0.62]) {
        for (const x of [-1.0, 1.05]) {
          const leg = new THREE.Mesh(
            new THREE.CylinderGeometry(0.16, 0.2, 1.65, 7),
            mats.buffalo
          );
          leg.position.set(x, 0.0, z);
          buffaloGroup.add(leg);

          const hoof = new THREE.Mesh(
            new THREE.BoxGeometry(0.34, 0.25, 0.34),
            mats.darkWood
          );
          hoof.position.set(x + 0.05, -0.84, z);
          buffaloGroup.add(hoof);
        }
      }

      for (const side of [-1, 1]) {
        const points = [
          new THREE.Vector3(2.1, 1.28, side * 0.46),
          new THREE.Vector3(2.05, 1.75, side * 0.92),
          new THREE.Vector3(2.38, 1.9, side * 1.22)
        ];
        const hornCurve = new THREE.CatmullRomCurve3(points);
        const horn = new THREE.Mesh(
          new THREE.TubeGeometry(hornCurve, 10, 0.09, 6, false),
          mats.horn
        );
        buffaloGroup.add(horn);

        const ear = new THREE.Mesh(
          new THREE.ConeGeometry(0.26, 0.62, 5),
          mats.buffalo
        );
        ear.position.set(2.0, 1.18, side * 0.7);
        ear.rotation.x = side * Math.PI * 0.5;
        buffaloGroup.add(ear);
      }

      const tailCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-2.5, 1.2, 0),
        new THREE.Vector3(-3.0, 0.75, 0.15),
        new THREE.Vector3(-2.8, 0.05, 0.32)
      ]);
      const tail = new THREE.Mesh(
        new THREE.TubeGeometry(tailCurve, 10, 0.055, 5, false),
        mats.buffalo
      );
      buffaloGroup.add(tail);

      buffaloGroup.userData.head = head;
      enableShadows(buffaloGroup);
      scene.add(buffaloGroup);
    }

    createBuffalo();

    const animatedBirds = [];

    function createEgret(x, y, z, scale = 1, flying = false) {
      const bird = new THREE.Group();
      bird.position.set(x, y, z);
      bird.scale.setScalar(scale);
      bird.rotation.y = range(0, Math.PI * 2);

      const body = new THREE.Mesh(
        new THREE.SphereGeometry(0.32, 12, 8),
        mats.white
      );
      body.scale.set(0.75, 1.0, 0.65);
      body.position.y = 0.88;
      bird.add(body);

      const neckCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 1.05, 0),
        new THREE.Vector3(0.12, 1.5, 0),
        new THREE.Vector3(0.02, 1.82, 0)
      ]);
      const neck = new THREE.Mesh(
        new THREE.TubeGeometry(neckCurve, 8, 0.075, 6, false),
        mats.white
      );
      bird.add(neck);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.16, 10, 7),
        mats.white
      );
      head.position.set(0.04, 1.87, 0);
      bird.add(head);

      const beak = new THREE.Mesh(
        new THREE.ConeGeometry(0.055, 0.46, 6),
        mats.beak
      );
      beak.rotation.z = -Math.PI / 2;
      beak.position.set(0.34, 1.86, 0);
      bird.add(beak);

      for (const zOffset of [-0.09, 0.09]) {
        const leg = new THREE.Mesh(
          new THREE.CylinderGeometry(0.018, 0.018, 0.92, 5),
          new THREE.MeshStandardMaterial({
            color: 0x55483a,
            roughness: 0.9
          })
        );
        leg.position.set(0, 0.28, zOffset);
        bird.add(leg);
      }

      const leftWing = new THREE.Mesh(
        new THREE.ConeGeometry(0.38, 1.0, 3),
        mats.white
      );
      leftWing.position.set(-0.08, 0.98, 0.28);
      leftWing.rotation.x = flying ? -0.8 : -0.2;
      leftWing.rotation.z = Math.PI / 2;

      const rightWing = leftWing.clone();
      rightWing.position.z = -0.28;
      rightWing.rotation.x = flying ? 0.8 : 0.2;
      bird.add(leftWing, rightWing);

      bird.userData.leftWing = leftWing;
      bird.userData.rightWing = rightWing;
      bird.userData.phase = range(0, Math.PI * 2);
      bird.userData.baseY = y;
      bird.userData.flying = flying;
      animatedBirds.push(bird);
      enableShadows(bird);
      scene.add(bird);
    }

    createEgret(9, 2.0, 3, 0.72);
    createEgret(14, 0.75, 16, 0.68);
    createEgret(-3, 8.5, -5, 0.64);
    createEgret(3, 19, -17, 0.72, true);
    createEgret(10, 22, -24, 0.58, true);
    createEgret(-8, 17, -20, 0.52, true);

    function addWildGrass(x, y, z, count, radius) {
      const group = new THREE.Group();
      group.position.set(x, y, z);

      for (let i = 0; i < count; i++) {
        const blade = new THREE.Mesh(
          new THREE.ConeGeometry(0.035, range(0.4, 0.9), 4),
          random() > 0.4 ? mats.grassLight : mats.grass
        );
        const angle = range(0, Math.PI * 2);
        const r = Math.sqrt(random()) * radius;
        blade.position.set(Math.cos(angle) * r, 0, Math.sin(angle) * r);
        blade.rotation.z = range(-0.25, 0.25);
        group.add(blade);
      }

      enableShadows(group);
      scene.add(group);
    }

    for (let i = 0; i < 34; i++) {
      const angle = range(Math.PI * 1.05, Math.PI * 1.92);
      const radius = range(10, 48);
      const x = Math.cos(angle) * radius;
      const z = 16 + Math.sin(angle) * radius;
      const y = terrainHeight(x, z);
      addWildGrass(x, y, z, Math.floor(range(5, 11)), range(0.25, 0.7));
    }

    function addRocks() {
      for (let i = 0; i < 42; i++) {
        const x = range(-48, 48);
        const z = range(-27, 31);

        if (Math.abs(x) < 30 && z < 15 && random() < 0.55) continue;

        const rock = new THREE.Mesh(
          new THREE.DodecahedronGeometry(range(0.18, 0.72), 0),
          new THREE.MeshStandardMaterial({
            color: colorShift(pick([0x776958, 0x82745f, 0x665d4e]), 0.045),
            roughness: 1
          })
        );
        rock.position.set(x, terrainHeight(x, z) + 0.25, z);
        rock.rotation.set(range(0, 2), range(0, 2), range(0, 2));
        rock.scale.set(range(0.7, 1.5), range(0.45, 1.0), range(0.7, 1.4));
        rock.castShadow = true;
        rock.receiveShadow = true;
        scene.add(rock);
      }
    }

    addRocks();

    function createDistantHills() {
      const hillMaterial = new THREE.MeshStandardMaterial({
        color: 0x63735a,
        roughness: 1
      });

      for (let i = 0; i < 11; i++) {
        const hill = new THREE.Mesh(
          new THREE.ConeGeometry(
            range(11, 23),
            range(15, 31),
            7,
            1,
            false
          ),
          hillMaterial
        );
        hill.position.set(
          -82 + i * 16 + range(-4, 4),
          range(-7, -2),
          -70 - range(0, 18)
        );
        hill.scale.z = range(0.75, 1.45);
        hill.rotation.y = range(0, Math.PI);
        hill.receiveShadow = true;
        scene.add(hill);
      }
    }

    createDistantHills();

    const fireflies = [];
    const glowMaterial = new THREE.MeshBasicMaterial({
      color: 0xffd882,
      transparent: true,
      opacity: 0.55,
      fog: true
    });

    for (let i = 0; i < 24; i++) {
      const glow = new THREE.Mesh(
        new THREE.SphereGeometry(0.055, 6, 4),
        glowMaterial.clone()
      );
      glow.position.set(
        range(-28, 28),
        range(2, 12),
        range(-12, 22)
      );
      glow.userData.baseY = glow.position.y;
      glow.userData.phase = range(0, Math.PI * 2);
      glow.userData.speed = range(0.35, 0.9);
      scene.add(glow);
      fireflies.push(glow);
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();

      for (const uniforms of waterUniforms) {
        uniforms.time.value = elapsed;
      }

      for (let i = 0; i < riceGroup.children.length; i++) {
        const tuft = riceGroup.children[i];
        const wave = Math.sin(
          elapsed * 1.25 +
          tuft.userData.phase +
          tuft.position.x * 0.12
        );
        tuft.rotation.z = wave * 0.035;
        tuft.rotation.x = Math.cos(elapsed + tuft.userData.phase) * 0.018;
      }

      for (const crown of animatedPalms) {
        crown.rotation.z =
          Math.sin(elapsed * 0.52 + crown.userData.phase) * 0.035;

        for (const child of crown.children) {
          if (child.userData.baseZ !== undefined) {
            child.rotation.z =
              child.userData.baseZ +
              Math.sin(elapsed * 0.9 + child.userData.phase) * 0.055;
          }
        }
      }

      for (const bird of animatedBirds) {
        const phase = bird.userData.phase;
        const flap = Math.sin(elapsed * (bird.userData.flying ? 4.8 : 1.4) + phase);

        bird.userData.leftWing.rotation.x =
          (bird.userData.flying ? -0.75 : -0.2) + flap * 0.42;
        bird.userData.rightWing.rotation.x =
          (bird.userData.flying ? 0.75 : 0.2) - flap * 0.42;

        bird.position.y =
          bird.userData.baseY +
          Math.sin(elapsed * 1.1 + phase) *
          (bird.userData.flying ? 0.32 : 0.035);

        if (bird.userData.flying) {
          bird.position.x += Math.sin(elapsed * 0.22 + phase) * 0.002;
          bird.rotation.z = Math.sin(elapsed * 0.55 + phase) * 0.08;
        }
      }

      buffaloGroup.rotation.z = Math.sin(elapsed * 0.7) * 0.008;
      buffaloGroup.userData.head.rotation.z =
        Math.sin(elapsed * 0.55) * 0.08;

      for (const glow of fireflies) {
        const p = glow.userData.phase;
        glow.position.y =
          glow.userData.baseY +
          Math.sin(elapsed * glow.userData.speed + p) * 0.45;
        glow.position.x += Math.sin(elapsed * 0.3 + p) * 0.0015;
        glow.material.opacity =
          0.16 + Math.pow(0.5 + 0.5 * Math.sin(elapsed * 1.7 + p), 3) * 0.62;
      }

      sun.lookAt(camera.position);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    animate();
  </script>
</body>
</html>
