<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drive-In Theater Night</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050611}
  canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

}

<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07081b);
scene.fog = new THREE.FogExp2(0x10132a, 0.011);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 250);
camera.position.set(28, 19, 38);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.14;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5, -7);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.22;
controls.minDistance = 19;
controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI * 0.47;

let seed = 19570817;
function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a, b) {
  return a + (b - a) * rand();
}
function mat(color, roughness = 0.7, metalness = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness });
}
function glow(color, intensity = 1) {
  return new THREE.MeshStandardMaterial({
    color,
    emissive: color,
    emissiveIntensity: intensity,
    roughness: 0.4,
    metalness: 0.05
  });
}
function mesh(geometry, material, x = 0, y = 0, z = 0) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(x, y, z);
  object.castShadow = true;
  object.receiveShadow = true;
  return object;
}
function box(parent, w, h, d, material, x = 0, y = 0, z = 0) {
  const object = mesh(new THREE.BoxGeometry(w, h, d), material, x, y, z);
  parent.add(object);
  return object;
}
function cylinder(parent, radiusTop, radiusBottom, height, material, x = 0, y = 0, z = 0, segments = 16) {
  const object = mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments), material, x, y, z);
  parent.add(object);
  return object;
}
function sphere(parent, radius, material, x = 0, y = 0, z = 0, width = 24, height = 16) {
  const object = mesh(new THREE.SphereGeometry(radius, width, height), material, x, y, z);
  parent.add(object);
  return object;
}
function ring(parent, inner, outer, material, x = 0, y = 0, z = 0, rotation = [0, 0, 0]) {
  const object = mesh(new THREE.RingGeometry(inner, outer, 24), material, x, y, z);
  object.rotation.set(rotation[0], rotation[1], rotation[2]);
  parent.add(object);
  return object;
}
function createCanvas(size = 512) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  return canvas;
}
function makeSignTexture(title, subtitle, colors) {
  const canvas = createCanvas(512);
  const ctx = canvas.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 512, 512);
  g.addColorStop(0, colors[0]);
  g.addColorStop(1, colors[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 512, 512);
  ctx.strokeStyle = '#ffd77b';
  ctx.lineWidth = 18;
  ctx.strokeRect(19, 19, 474, 474);
  ctx.strokeStyle = 'rgba(255,255,255,.38)';
  ctx.lineWidth = 4;
  ctx.strokeRect(39, 39, 434, 434);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff4bd';
  ctx.shadowColor = '#ff2f72';
  ctx.shadowBlur = 18;
  ctx.font = 'bold 83px Georgia';
  ctx.fillText(title, 256, 225);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#f8bd6f';
  ctx.font = 'bold 33px Arial';
  ctx.fillText(subtitle, 256, 285);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

const ground = mesh(
  new THREE.PlaneGeometry(150, 130),
  mat(0x161622, 0.96, 0),
  0, -0.02, -12
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const gravelMat = mat(0x2a2930, 0.94);
const asphaltMat = mat(0x202128, 0.86);
const paintedMat = mat(0xaaa080, 0.7);
const chromeMat = mat(0xd8e5ea, 0.16, 0.92);
const blackMat = mat(0x0d0e14, 0.48, 0.25);
const poleMat = mat(0x30333c, 0.34, 0.75);
const woodMat = mat(0x4d2d22, 0.88);
const grassMat = mat(0x20292a, 0.96);

const driveway = mesh(new THREE.PlaneGeometry(15, 67), asphaltMat, -21, 0.012, 2);
driveway.rotation.x = -Math.PI / 2;
scene.add(driveway);

const parking = mesh(new THREE.PlaneGeometry(56, 47), gravelMat, 2, 0.008, -5);
parking.rotation.x = -Math.PI / 2;
scene.add(parking);

for (let z = -23; z < 16; z += 9.5) {
  for (const x of [-12, -4, 4, 12]) {
    const stripe = mesh(new THREE.PlaneGeometry(0.11, 6), paintedMat, x + 3.9, 0.024, z);
    stripe.rotation.x = -Math.PI / 2;
    stripe.material.transparent = true;
    stripe.material.opacity = 0.27;
    scene.add(stripe);
  }
}

const sky = new THREE.Group();
scene.add(sky);

const starPositions = [];
const starColors = [];
for (let i = 0; i < 920; i++) {
  const theta = rand() * Math.PI * 2;
  const phi = Math.acos(range(-0.02, 1));
  const radius = range(79, 105);
  const x = Math.sin(phi) * Math.cos(theta) * radius;
  const y = Math.cos(phi) * radius + 5;
  const z = Math.sin(phi) * Math.sin(theta) * radius - 18;
  starPositions.push(x, y, z);
  const tint = range(0.72, 1);
  starColors.push(tint, tint * range(0.85, 0.97), 1);
}
const starGeometry = new THREE.BufferGeometry();
starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
starGeometry.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));
const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({
  size: 0.32,
  vertexColors: true,
  transparent: true,
  opacity: 0.92,
  depthWrite: false,
  sizeAttenuation: true
}));
sky.add(stars);

const moonGlow = new THREE.PointLight(0xa9c6ff, 2.4, 44, 2);
moonGlow.position.set(-31, 20, -47);
scene.add(moonGlow);
const moon = sphere(sky, 5.4, new THREE.MeshBasicMaterial({ color: 0xe3eaff }), -31, 22, -48, 40, 24);
moon.castShadow = false;
moon.receiveShadow = false;
for (let i = 0; i < 15; i++) {
  const crater = mesh(
    new THREE.CircleGeometry(range(0.12, 0.55), 16),
    new THREE.MeshBasicMaterial({ color: 0xc0cae0, transparent: true, opacity: 0.24 }),
    -31 + range(-3.4, 3.4),
    22 + range(-3.4, 3.4),
    -42.55
  );
  crater.rotation.x = Math.PI;
  sky.add(crater);
}

function createHillLayer(z, color, baseY, count, width) {
  const shape = new THREE.Shape();
  shape.moveTo(-75, -5);
  shape.lineTo(-75, baseY);
  for (let i = 0; i <= count; i++) {
    const x = -75 + i * (150 / count);
    const peak = baseY + range(4, 11) + Math.sin(i * 1.47) * 3;
    shape.quadraticCurveTo(x + width * 0.25, peak, x + width * 0.5, baseY + range(1, 4));
  }
  shape.lineTo(75, -5);
  shape.closePath();
  const hill = mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color }), 0, 0, z);
  hill.castShadow = false;
  hill.receiveShadow = false;
  scene.add(hill);
}
createHillLayer(-68, 0x11152a, 1.7, 8, 18);
createHillLayer(-62, 0x192036, 0.2, 11, 14);
createHillLayer(-56, 0x202c3a, -1.7, 15, 10);

const hemi = new THREE.HemisphereLight(0x59669f, 0x20170d, 1.35);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0x9fb4ff, 2.2);
keyLight.position.set(-20, 34, 18);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -45;
keyLight.shadow.camera.right = 45;
keyLight.shadow.camera.top = 45;
keyLight.shadow.camera.bottom = -45;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 90;
keyLight.shadow.bias = -0.0003;
scene.add(keyLight);

const warmFill = new THREE.PointLight(0xff8757, 1.25, 42, 2);
warmFill.position.set(4, 11, 5);
scene.add(warmFill);

function createScreen() {
  const group = new THREE.Group();
  group.position.set(2, 8.4, -35);
  scene.add(group);

  const supportMat = mat(0x4a4c55, 0.34, 0.7);
  const trimMat = glow(0xdcecff, 0.42);
  const frame = box(group, 27.8, 16.7, 1.35, supportMat, 0, 0, 0);
  frame.castShadow = true;

  const filmCanvas = createCanvas(768);
  const filmContext = filmCanvas.getContext('2d');
  const filmTexture = new THREE.CanvasTexture(filmCanvas);
  filmTexture.colorSpace = THREE.SRGBColorSpace;
  filmTexture.wrapS = THREE.RepeatWrapping;
  filmTexture.wrapT = THREE.RepeatWrapping;

  const screenMaterial = new THREE.MeshStandardMaterial({
    map: filmTexture,
    emissiveMap: filmTexture,
    emissive: new THREE.Color(0xffffff),
    emissiveIntensity: 1.25,
    roughness: 0.45
  });
  const display = mesh(new THREE.PlaneGeometry(25.8, 14.65), screenMaterial, 0, 0, 0.72);
  group.add(display);

  box(group, 28.6, 0.38, 1.7, trimMat, 0, 8.55, 0.15);
  box(group, 28.6, 0.38, 1.7, trimMat, 0, -8.55, 0.15);
  box(group, 0.38, 17.05, 1.7, trimMat, -14.3, 0, 0.15);
  box(group, 0.38, 17.05, 1.7, trimMat, 14.3, 0, 0.15);

  for (const x of [-10.5, 10.5]) {
    const screenLeg = cylinder(group, 0.5, 0.68, 8.8, supportMat, x, -12.6, -0.18, 16);
    screenLeg.castShadow = true;
    const foot = cylinder(group, 1.32, 1.32, 0.42, blackMat, x, -17.0, -0.18, 16);
    foot.castShadow = true;
    const braceA = mesh(new THREE.BoxGeometry(0.36, 5.5, 0.36), supportMat, x - 2.15, -13.5, -0.26);
    braceA.rotation.z = x < 0 ? -0.68 : 0.68;
    group.add(braceA);
    const braceB = mesh(new THREE.BoxGeometry(0.36, 5.5, 0.36), supportMat, x + 2.15, -13.5, -0.26);
    braceB.rotation.z = x < 0 ? 0.68 : -0.68;
    group.add(braceB);
  }

  const screenLamp = new THREE.PointLight(0xbfd8ff, 3.1, 37, 2);
  screenLamp.position.set(0, 0, 4);
  group.add(screenLamp);

  function paintFilm(time) {
    const w = filmCanvas.width;
    const h = filmCanvas.height;
    const gradient = filmContext.createLinearGradient(0, 0, w, h);
    gradient.addColorStop(0, '#20104d');
    gradient.addColorStop(0.52, '#bf275a');
    gradient.addColorStop(1, '#f18855');
    filmContext.fillStyle = gradient;
    filmContext.fillRect(0, 0, w, h);

    filmContext.globalCompositeOperation = 'screen';
    for (let i = 0; i < 15; i++) {
      const angle = time * (0.18 + i * 0.007) + i * 0.71;
      const cx = w * 0.5 + Math.cos(angle * 1.2) * (80 + i * 12);
      const cy = h * 0.5 + Math.sin(angle * 1.7) * (40 + i * 9);
      const radius = 32 + (i % 5) * 20;
      const radial = filmContext.createRadialGradient(cx, cy, 2, cx, cy, radius);
      radial.addColorStop(0, i % 2 ? 'rgba(255,240,116,.92)' : 'rgba(55,243,255,.78)');
      radial.addColorStop(1, 'rgba(255,255,255,0)');
      filmContext.fillStyle = radial;
      filmContext.beginPath();
      filmContext.arc(cx, cy, radius, 0, Math.PI * 2);
      filmContext.fill();
    }
    filmContext.globalCompositeOperation = 'source-over';
    filmContext.strokeStyle = 'rgba(255,255,245,.73)';
    filmContext.lineWidth = 8;
    filmContext.beginPath();
    for (let x = -20; x < w + 30; x += 12) {
      const y = h * 0.53 + Math.sin(x * 0.017 + time * 2.1) * 72 + Math.sin(x * 0.045 - time) * 26;
      if (x < 0) filmContext.moveTo(x, y);
      else filmContext.lineTo(x, y);
    }
    filmContext.stroke();
    filmContext.fillStyle = 'rgba(20,10,43,.36)';
    filmContext.fillRect(0, 0, w, 24);
    filmContext.fillRect(0, h - 24, w, 24);
    filmTexture.needsUpdate = true;
  }

  return { group, paintFilm, lamp: screenLamp };
}

const screen = createScreen();

function createCar(x, z, color, scale = 1, flip = false) {
  const car = new THREE.Group();
  car.position.set(x, 0.18, z);
  car.scale.setScalar(scale);
  car.rotation.y = flip ? Math.PI : 0;
  scene.add(car);

  const paint = mat(color, 0.28, 0.3);
  const darkPaint = mat(new THREE.Color(color).multiplyScalar(0.56), 0.36, 0.25);
  const glass = new THREE.MeshStandardMaterial({
    color: 0x496072,
    roughness: 0.12,
    metalness: 0.5,
    transparent: true,
    opacity: 0.72
  });
  const tireMat = mat(0x111116, 0.85, 0.05);
  const redLamp = glow(0xf6332c, 1.4);
  const headLamp = glow(0xffe6a4, 1.25);

  box(car, 4.75, 0.82, 2.25, paint, 0, 0.9, 0);
  const hood = box(car, 1.75, 0.42, 2.18, darkPaint, 1.46, 1.43, 0);
  hood.rotation.z = -0.07;
  const trunk = box(car, 1.1, 0.48, 2.16, darkPaint, -1.65, 1.36, 0);
  trunk.rotation.z = 0.08;

  const cabin = mesh(new THREE.BoxGeometry(2.25, 1.15, 2.02), paint, -0.28, 1.75, 0);
  cabin.scale.z = 0.91;
  car.add(cabin);

  const windshield = mesh(new THREE.PlaneGeometry(1.08, 0.78), glass, 0.43, 1.89, 0);
  windshield.rotation.y = Math.PI / 2;
  windshield.rotation.z = -0.45;
  car.add(windshield);

  const rearWindow = mesh(new THREE.PlaneGeometry(0.9, 0.72), glass, -1.02, 1.92, 0);
  rearWindow.rotation.y = Math.PI / 2;
  rearWindow.rotation.z = 0.5;
  car.add(rearWindow);

  for (const side of [-1, 1]) {
    const window = mesh(new THREE.PlaneGeometry(1.42, 0.75), glass, -0.3, 2.01, side * 0.935);
    car.add(window);
    const fin = mesh(new THREE.BoxGeometry(1.1, 0.72, 0.1), paint, -1.93, 1.62, side * 1.12);
    fin.rotation.z = -0.33;
    car.add(fin);

    for (const wheelX of [-1.42, 1.35]) {
      const wheel = mesh(new THREE.CylinderGeometry(0.48, 0.48, 0.3, 20), tireMat, wheelX, 0.51, side * 1.08);
      wheel.rotation.x = Math.PI / 2;
      car.add(wheel);
      const hub = mesh(new THREE.CylinderGeometry(0.23, 0.23, 0.315, 16), chromeMat, wheelX, 0.51, side * 1.08);
      hub.rotation.x = Math.PI / 2;
      car.add(hub);
    }

    const bumper = mesh(new THREE.BoxGeometry(0.18, 0.13, 1.75), chromeMat, 2.39, 0.79, 0);
    car.add(bumper);
  }

  box(car, 0.16, 0.18, 0.38, headLamp, 2.39, 1.11, -0.72);
  box(car, 0.16, 0.18, 0.38, headLamp, 2.39, 1.11, 0.72);
  box(car, 0.15, 0.16, 0.34, redLamp, -2.4, 1.11, -0.72);
  box(car, 0.15, 0.16, 0.34, redLamp, -2.4, 1.11, 0.72);
  box(car, 4.88, 0.12, 0.1, chromeMat, 0, 0.7, -1.16);
  box(car, 4.88, 0.12, 0.1, chromeMat, 0, 0.7, 1.16);

  const antenna = mesh(new THREE.CylinderGeometry(0.018, 0.018, 1.1, 8), chromeMat, -0.5, 2.85, 0.55);
  antenna.rotation.z = -0.16;
  car.add(antenna);

  return car;
}

const carColors = [0xa52932, 0x1c5c88, 0xe7ba4a, 0x33664d, 0x803c74, 0xe6e1ca, 0x9a382d];
const cars = [];
const parkingRows = [-19, -10, -1, 8];
for (let row = 0; row < parkingRows.length; row++) {
  for (let col = 0; col < 4; col++) {
    if (row === 3 && col === 3) continue;
    const x = -10 + col * 7 + (row % 2) * 0.45;
    const z = parkingRows[row] + range(-0.65, 0.65);
    const car = createCar(x, z, carColors[(row * 3 + col) % carColors.length], range(0.86, 1.06), row === 0);
    cars.push({ car, phase: rand() * Math.PI * 2, baseY: car.position.y });
  }
}

function createSpeakerPole(x, z) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  scene.add(group);
  cylinder(group, 0.09, 0.14, 4.1, poleMat, 0, 2.05, 0, 10);
  cylinder(group, 0.64, 0.64, 0.12, blackMat, 0, 0.07, 0, 16);
  const arm = box(group, 0.92, 0.1, 0.1, poleMat, 0.4, 3.62, 0);
  arm.rotation.z = 0.12;
  const speaker = box(group, 0.44, 0.7, 0.23, mat(0x434651, 0.4, 0.55), 0.85, 3.27, 0);
  speaker.rotation.z = -0.18;
  ring(group, 0.11, 0.18, blackMat, 0.85, 3.27, 0.122, [0, 0, 0]);
  return group;
}

for (const z of [-15, -6, 3, 12]) {
  for (const x of [-7.4, 0.4, 8.2]) {
    createSpeakerPole(x, z);
  }
}

function createSnackStand() {
  const group = new THREE.Group();
  group.position.set(23, 0, -9);
  group.rotation.y = -0.23;
  scene.add(group);

  const red = mat(0x8e2734, 0.5, 0.15);
  const cream = mat(0xf2d7a8, 0.62);
  const pinkGlow = glow(0xff3d7f, 1.75);
  const cyanGlow = glow(0x43e6e9, 1.35);
  const windowMat = glow(0xffbd64, 0.7);

  box(group, 11.5, 5.2, 6.2, red, 0, 2.62, 0);
  const roof = box(group, 12.2, 0.48, 6.9, cream, 0, 5.4, 0);
  roof.castShadow = true;
  box(group, 10.8, 0.18, 0.18, pinkGlow, 0, 5.72, 3.48);
  box(group, 0.18, 0.18, 6.9, pinkGlow, -6.03, 5.72, 0);
  box(group, 0.18, 0.18, 6.9, pinkGlow, 6.03, 5.72, 0);

  const awning = box(group, 8.2, 0.36, 1.35, cream, -0.4, 3.98, 3.5);
  awning.rotation.x = -0.18;
  for (let i = -3; i <= 3; i++) {
    box(group, 0.5, 0.42, 1.42, red, i * 1.12 - 0.4, 4.01, 3.52);
  }

  box(group, 6.4, 2.1, 0.12, blackMat, -0.55, 2.47, 3.17);
  box(group, 5.85, 1.65, 0.08, windowMat, -0.55, 2.5, 3.26);
  box(group, 0.18, 1.7, 0.13, cream, -0.55, 2.5, 3.35);
  box(group, 6.0, 0.16, 0.13, cream, -0.55, 2.5, 3.36);

  const counter = box(group, 7.8, 0.26, 0.65, woodMat, -0.55, 1.48, 3.63);
  counter.rotation.x = 0.03;
  box(group, 2.1, 3.2, 0.16, cream, 4.06, 2.0, 3.19);
  box(group, 1.35, 1.45, 0.05, cyanGlow, 4.06, 2.65, 3.3);

  const signTexture = makeSignTexture('SNACKS', 'POP • SODA • CANDY', ['#701e46', '#1e4164']);
  const sign = mesh(new THREE.PlaneGeometry(8.4, 3.55), new THREE.MeshStandardMaterial({
    map: signTexture,
    emissiveMap: signTexture,
    emissive: new THREE.Color(0xff4d85),
    emissiveIntensity: 0.72
  }), 0, 8.0, 0.15);
  sign.rotation.y = 0;
  group.add(sign);
  box(group, 8.8, 0.22, 0.25, pinkGlow, 0, 9.85, 0.1);
  box(group, 8.8, 0.22, 0.25, pinkGlow, 0, 6.16, 0.1);

  const popcornBox = new THREE.Group();
  popcornBox.position.set(-3.9, 6.42, 0.28);
  group.add(popcornBox);
  box(popcornBox, 1.5, 1.8, 0.75, cream, 0, 0.45, 0);
  for (let i = -2; i <= 2; i++) {
    box(popcornBox, 0.18, 1.84, 0.78, red, i * 0.3, 0.45, 0);
  }
  for (let i = 0; i < 13; i++) {
    sphere(popcornBox, range(0.16, 0.28), glow(0xffe4a5, 0.35), range(-0.66, 0.66), 1.45 + range(-0.12, 0.22), range(-0.3, 0.3), 12, 8);
  }

  const standLight = new THREE.PointLight(0xff4f85, 2.4, 20, 2);
  standLight.position.set(0, 6, 5);
  group.add(standLight);
  return { group, lights: [standLight] };
}

const snackStand = createSnackStand();

function createTicketBooth() {
  const group = new THREE.Group();
  group.position.set(-20.7, 0, 20.4);
  group.rotation.y = 0.11;
  scene.add(group);

  const teal = mat(0x195b65, 0.42, 0.22);
  const pale = mat(0xe9c487, 0.66);
  const neon = glow(0xff4b78, 1.65);
  const glass = glow(0x8edbe5, 0.42);

  box(group, 5.2, 4.55, 4.2, teal, 0, 2.28, 0);
  box(group, 5.85, 0.42, 4.8, pale, 0, 4.76, 0);
  const roof = mesh(new THREE.ConeGeometry(4.05, 1.68, 4), mat(0x9a314c, 0.46, 0.16), 0, 5.6, 0);
  roof.rotation.y = Math.PI / 4;
  group.add(roof);

  box(group, 2.05, 1.55, 0.09, glass, 0.75, 2.72, 2.15);
  box(group, 0.12, 1.7, 0.12, pale, 0.75, 2.72, 2.22);
  box(group, 2.2, 0.14, 0.12, pale, 0.75, 2.72, 2.22);
  box(group, 0.82, 0.85, 0.1, blackMat, -1.5, 1.45, 2.13);
  box(group, 1.16, 0.16, 0.58, pale, -1.5, 1.05, 2.45);

  const ticketTexture = makeSignTexture('TICKETS', 'ADMIT ONE', ['#8b2345', '#21486b']);
  const ticketSign = mesh(new THREE.PlaneGeometry(4.65, 1.78), new THREE.MeshStandardMaterial({
    map: ticketTexture,
    emissiveMap: ticketTexture,
    emissive: new THREE.Color(0xff436e),
    emissiveIntensity: 0.8
  }), 0, 7.42, 0);
  group.add(ticketSign);

  const lamp = new THREE.PointLight(0xff628c, 2.1, 14, 2);
  lamp.position.set(0, 6.3, 2.5);
  group.add(lamp);
  return group;
}

createTicketBooth();

function createMarquee() {
  const group = new THREE.Group();
  group.position.set(-21, 0, 7.5);
  group.rotation.y = Math.PI / 2;
  scene.add(group);

  const frameMat = mat(0x33404a, 0.35, 0.66);
  const bulbMat = glow(0xffca61, 1.8);
  cylinder(group, 0.18, 0.24, 8.8, frameMat, -3.1, 4.4, 0, 12);
  cylinder(group, 0.18, 0.24, 8.8, frameMat, 3.1, 4.4, 0, 12);
  box(group, 6.9, 0.28, 0.42, frameMat, 0, 8.62, 0);
  box(group, 6.9, 0.28, 0.42, frameMat, 0, 1.45, 0);

  const texture = makeSignTexture('STARLITE', 'DRIVE-IN', ['#2a225d', '#9a2349']);
  const face = mesh(new THREE.PlaneGeometry(6.1, 5.3), new THREE.MeshStandardMaterial({
    map: texture,
    emissiveMap: texture,
    emissive: new THREE.Color(0x6a2b86),
    emissiveIntensity: 0.62
  }), 0, 5.15, 0.24);
  group.add(face);

  const bulbs = [];
  for (let i = 0; i < 14; i++) {
    const angle = i / 14 * Math.PI * 2;
    const bulb = sphere(group, 0.16, bulbMat, Math.cos(angle) * 3.3, 5.15 + Math.sin(angle) * 3.75, 0.35, 12, 8);
    bulbs.push(bulb);
  }
  return bulbs;
}

const marqueeBulbs = createMarquee();

const stringLights = [];
function makeString(from, to, bulbs) {
  const points = [];
  for (let i = 0; i <= 26; i++) {
    const t = i / 26;
    const position = new THREE.Vector3().lerpVectors(from, to, t);
    position.y -= Math.sin(t * Math.PI) * 1.45;
    points.push(position);
  }
  const cable = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(points),
    new THREE.LineBasicMaterial({ color: 0x24232b })
  );
  scene.add(cable);
  for (let i = 1; i < bulbs; i++) {
    const t = i / bulbs;
    const position = new THREE.Vector3().lerpVectors(from, to, t);
    position.y -= Math.sin(t * Math.PI) * 1.45;
    const bulb = sphere(scene, 0.13, glow(i % 3 === 0 ? 0xff657c : i % 3 === 1 ? 0xffd36e : 0x69dce4, 1.5), position.x, position.y, position.z, 10, 8);
    bulb.castShadow = false;
    stringLights.push({ bulb, phase: i * 0.7 });
  }
}
function lightPost(x, z, height) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  scene.add(group);
  cylinder(group, 0.1, 0.15, height, poleMat, 0, height * 0.5, 0, 10);
  sphere(group, 0.22, glow(0xffca6b, 1.45), 0, height, 0, 12, 8);
}
lightPost(-17, -23, 7.5);
lightPost(19, -23, 7.8);
lightPost(-17, 17, 7.4);
lightPost(20, 15, 7.3);
makeString(new THREE.Vector3(-17, 7.5, -23), new THREE.Vector3(19, 7.8, -23), 17);
makeString(new THREE.Vector3(19, 7.8, -23), new THREE.Vector3(20, 7.3, 15), 18);
makeString(new THREE.Vector3(-17, 7.5, -23), new THREE.Vector3(-17, 7.4, 17), 17);

function createProps() {
  for (let i = 0; i < 36; i++) {
    const x = range(-33, 34);
    const z = range(-31, 28);
    if (x > -15 && x < 18 && z > -26 && z < 17) continue;
    const rock = mesh(
      new THREE.DodecahedronGeometry(range(0.12, 0.4), 0),
      mat(i % 3 ? 0x29252a : 0x35303a, 0.92),
      x, range(0.08, 0.22), z
    );
    rock.rotation.set(rand() * 2, rand() * 2, rand() * 2);
    scene.add(rock);
  }

  for (let i = 0; i < 28; i++) {
    const x = range(-42, 43);
    const z = range(-34, 26);
    const shrub = new THREE.Group();
    shrub.position.set(x, 0, z);
    scene.add(shrub);
    for (let j = 0; j < 3; j++) {
      sphere(shrub, range(0.35, 0.8), mat(j === 0 ? 0x273a33 : 0x1b2d29, 0.96), range(-0.4, 0.4), range(0.35, 0.7), range(-0.4, 0.4), 12, 8);
    }
  }

  const trash = new THREE.Group();
  trash.position.set(16, 0, 11.5);
  scene.add(trash);
  cylinder(trash, 0.5, 0.58, 1.22, poleMat, 0, 0.61, 0, 16);
  cylinder(trash, 0.6, 0.6, 0.12, chromeMat, 0, 1.25, 0, 16);

  const bench = new THREE.Group();
  bench.position.set(16, 0, 7.2);
  bench.rotation.y = -0.65;
  scene.add(bench);
  box(bench, 3.3, 0.18, 0.5, woodMat, 0, 1.2, 0);
  box(bench, 3.3, 0.16, 0.45, woodMat, 0, 0.7, -0.37);
  for (const x of [-1.25, 1.25]) {
    const leg = box(bench, 0.14, 1.1, 0.14, poleMat, x, 0.55, 0);
    leg.rotation.z = x * -0.12;
  }
}
createProps();

const entranceLamp = new THREE.SpotLight(0xffb06d, 6.3, 42, 0.62, 0.6, 1.3);
entranceLamp.position.set(-16, 12, 18);
entranceLamp.target.position.set(-20, 0, 5);
entranceLamp.castShadow = true;
entranceLamp.shadow.mapSize.set(1024, 1024);
scene.add(entranceLamp);
scene.add(entranceLamp.target);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  screen.paintFilm(elapsed);
  screen.lamp.intensity = 2.6 + Math.sin(elapsed * 1.7) * 0.5;
  snackStand.lights[0].intensity = 2.25 + Math.sin(elapsed * 2.2) * 0.35;

  for (const item of stringLights) {
    const pulse = 1.0 + Math.sin(elapsed * 3.2 + item.phase) * 0.32;
    item.bulb.material.emissiveIntensity = pulse * 1.5;
  }

  for (let i = 0; i < marqueeBulbs.length; i++) {
    marqueeBulbs[i].material.emissiveIntensity = 1.25 + Math.sin(elapsed * 4 + i * 0.76) * 0.72;
  }

  for (const item of cars) {
    item.car.position.y = item.baseY + Math.sin(elapsed * 0.65 + item.phase) * 0.012;
  }

  stars.rotation.y = elapsed * 0.004;
  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

animate();
</script>
</body>
</html>
