let seed = 40291;
function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a, b) {
  return a + (b - a) * rand();
}
function pick(values) {
  return values[Math.floor(rand() * values.length)];
}
function mat(color, roughness = 0.75, metalness = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness });
}
function box(w, h, d, material, x = 0, y = h * 0.5, z = 0) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function cyl(r1, r2, h, material, x = 0, y = h * 0.5, z = 0, segments = 12) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, segments), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function sphere(r, material, x = 0, y = r, z = 0, sx = 1, sy = 1, sz = 1) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 8), material);
  mesh.position.set(x, y, z);
  mesh.scale.set(sx, sy, sz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function lineTube(points, radius, material) {
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 28, radius, 6, false), material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function makeSkyTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 1024;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#07142e');
  grad.addColorStop(0.42, '#30355b');
  grad.addColorStop(0.7, '#b66b6b');
  grad.addColorStop(1, '#eaa470');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < 180; i++) {
    const x = rand() * canvas.width;
    const y = rand() * canvas.height * 0.58;
    const s = rand() < 0.88 ? 1 : 2;
    ctx.fillStyle = `rgba(255,238,205,${range(0.18, 0.85)})`;
    ctx.fillRect(x, y, s, s);
  }
  const glow = ctx.createRadialGradient(720, 290, 4, 720, 290, 200);
  glow.addColorStop(0, 'rgba(255,190,122,.32)');
  glow.addColorStop(1, 'rgba(255,190,122,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}
function makeRoofTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#566069';
  ctx.fillRect(0, 0, 512, 512);
  ctx.strokeStyle = 'rgba(22,30,35,.34)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 512; i += 64) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, 512);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.lineTo(512, i);
    ctx.stroke();
  }
  for (let i = 0; i < 2400; i++) {
    const c = Math.floor(range(70, 130));
    ctx.fillStyle = `rgba(${c},${c + 5},${c + 8},.14)`;
    ctx.fillRect(rand() * 512, rand() * 512, 1, 1);
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(4, 3);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function createPlanter(x, z, w, d, kind) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  const frame = mat(0x455049, 0.7, 0.12);
  group.add(box(w, 0.72, d, frame, 0, 0.37, 0));
  group.add(box(w - 0.22, 0.1, d - 0.22, soil, 0, 0.77, 0));
  const rimMat = mat(0x876044, 0.64);
  group.add(box(w + 0.07, 0.1, 0.12, rimMat, 0, 0.79, -d / 2));
  group.add(box(w + 0.07, 0.1, 0.12, rimMat, 0, 0.79, d / 2));
  group.add(box(0.12, 0.1, d + 0.07, rimMat, -w / 2, 0.79, 0));
  group.add(box(0.12, 0.1, d + 0.07, rimMat, w / 2, 0.79, 0));
  const count = Math.max(7, Math.floor(w * d * 1.7));
  for (let i = 0; i < count; i++) {
    const px = range(-w * 0.4, w * 0.4);
    const pz = range(-d * 0.36, d * 0.36);
    const h = range(0.18, 0.48);
    const green = i % 3 === 0 ? leafLight : leafGreen;
    if (kind === 'flowers') {
      const stem = cyl(0.018, 0.018, h, leafDark, px, 0.8 + h / 2, pz, 6);
      group.add(stem);
      const petalColor = pick([0xf3b7c2, 0xffc15b, 0xc797df, 0xf1df92]);
      const flowerMat = mat(petalColor, 0.68);
      for (let p = 0; p < 5; p++) {
        const petal = sphere(0.075, flowerMat, px + Math.cos(p * 1.256) * 0.075, 0.8 + h, pz + Math.sin(p * 1.256) * 0.075, 1.2, 0.45, 1.2);
        group.add(petal);
      }
      group.add(sphere(0.048, mat(0x744e25), px, 0.8 + h + 0.008, pz));
    } else {
      const stem = cyl(0.025, 0.022, h, leafDark, px, 0.8 + h / 2, pz, 6);
      group.add(stem);
      for (let j = 0; j < 4; j++) {
        const angle = j * Math.PI * 0.5 + rand() * 0.3;
        const leaf = sphere(0.15, green, px + Math.cos(angle) * 0.13, 0.8 + h * range(0.35, 0.85), pz + Math.sin(angle) * 0.13, 1.5, 0.22, 0.72);
        leaf.rotation.y = -angle;
        group.add(leaf);
      }
      if (i % 4 === 0) {
        group.add(sphere(0.075, mat(0xcd5638), px, 0.8 + h * 0.58, pz));
      }
    }
  }
  scene.add(group);
  return group;
}

const stringGroups = [];
function addStringLights(a, b, sag) {
  const group = new THREE.Group();
  const cablePts = [];
  for (let i = 0; i <= 24; i++) {
    const t = i / 24;
    cablePts.push(new THREE.Vector3(
      THREE.MathUtils.lerp(a.x, b.x, t),
      THREE.MathUtils.lerp(a.y, b.y, t) - Math.sin(Math.PI * t) * sag,
      THREE.MathUtils.lerp(a.z, b.z, t)
    ));
  }
  group.add(lineTube(cablePts, 0.018, charcoal));
  const bulbs = [];
  for (let i = 1; i < 12; i++) {
    const t = i / 12;
    const bulb = new THREE.Group();
    const px = THREE.MathUtils.lerp(a.x, b.x, t);
    const py = THREE.MathUtils.lerp(a.y, b.y, t) - Math.sin(Math.PI * t) * sag;
    const pz = THREE.MathUtils.lerp(a.z, b.z, t);
    bulb.position.set(px, py - 0.13, pz);
    bulb.add(cyl(0.014, 0.014, 0.16, charcoal, 0, 0.08, 0, 6));
    const lamp = sphere(0.09, lightGlow, 0, -0.025, 0, 0.82, 1.12, 0.82);
    bulb.add(lamp);
    group.add(bulb);
    bulbs.push(lamp);
  }
  pergolaGroup.add(group);
  stringGroups.push({ group, bulbs, phase: rand() * 6.28 });
}

function createGreenhouse(x, z) {
  const greenhouse = new THREE.Group();
  greenhouse.position.set(x, 0, z);
  const frame = mat(0x27363a, 0.36, 0.72);
  const w = 3.2;
  const d = 1.75;
  const h = 3.2;
  greenhouse.add(box(w, 0.16, d, frame, 0, 0.08, 0));
  const postCoords = [[-w / 2, -d / 2], [w / 2, -d / 2], [-w / 2, d / 2], [w / 2, d / 2]];
  for (const coord of postCoords) greenhouse.add(box(0.08, h, 0.08, frame, coord[0], h / 2, coord[1]));
  greenhouse.add(box(w, 0.08, 0.08, frame, 0, h, -d / 2));
  greenhouse.add(box(w, 0.08, 0.08, frame, 0, h, d / 2));
  greenhouse.add(box(0.08, 0.08, d, frame, -w / 2, h, 0));
  greenhouse.add(box(0.08, 0.08, d, frame, w / 2, h, 0));
  const roofAngle = 0.55;
  const roofL = Math.sqrt((d / 2) ** 2 + 0.72 ** 2);
  const roofA = box(w + 0.08, 0.055, roofL, glass, 0, h + 0.34, -d * 0.25);
  roofA.rotation.x = roofAngle;
  greenhouse.add(roofA);
  const roofB = box(w + 0.08, 0.055, roofL, glass, 0, h + 0.34, d * 0.25);
  roofB.rotation.x = -roofAngle;
  greenhouse.add(roofB);
  const panels = [
    box(w - 0.1, h - 0.16, 0.025, glass, 0, h / 2, -d / 2),
    box(w - 0.1, h - 0.16, 0.025, glass, 0, h / 2, d / 2),
    box(0.025, h - 0.16, d - 0.1, glass, -w / 2, h / 2, 0),
    box(0.025, h - 0.16, d - 0.1, glass, w / 2, h / 2, 0)
  ];
  panels.forEach(panel => greenhouse.add(panel));
  greenhouse.add(box(w * 0.3, 0.07, d - 0.18, frame, 0.18, 1.15, 0));
  for (let i = 0; i < 5; i++) {
    const pot = cyl(0.16, 0.12, 0.25, terracotta, -1.15 + i * 0.55, 1.3, 0.08, 10);
    greenhouse.add(pot);
    greenhouse.add(sphere(0.18, leafGreen, -1.15 + i * 0.55, 1.52, 0.08, 1, 0.8, 1));
  }
  const innerLight = new THREE.PointLight(0xffcc8e, 2.8, 5, 2);
  innerLight.position.set(0, 2.35, 0);
  greenhouse.add(innerLight);
  scene.add(greenhouse);
}

function createPottedTree(x, z, scale) {
  const tree = new THREE.Group();
  tree.position.set(x, 0, z);
  tree.scale.setScalar(scale);
  tree.add(cyl(0.45, 0.32, 0.82, terracotta, 0, 0.41, 0, 16));
  tree.add(cyl(0.08, 0.11, 2.0, woodDark, 0, 1.65, 0, 8));
  const crown = new THREE.Group();
  crown.position.y = 2.45;
  for (let i = 0; i < 21; i++) {
    const angle = rand() * Math.PI * 2;
    const radius = Math.sqrt(rand()) * 0.74;
    const clump = sphere(range(0.24, 0.43), i % 3 ? leafGreen : leafDark,
      Math.cos(angle) * radius, range(-0.35, 0.45), Math.sin(angle) * radius,
      range(0.8, 1.3), range(0.8, 1.35), range(0.8, 1.3));
    crown.add(clump);
  }
  tree.add(crown);
  scene.add(tree);
  return crown;
}

    const height = range(3.2, 11.5);
    const depth = range(1.1, 2.8);
    const building = box(width, height, depth, pick(buildingMats), x + width * 0.5, height * 0.5 - 0.15, range(-1.5, 1.2));
    city.add(building);
    const cols = Math.max(1, Math.floor(width / 0.48));
    const rows = Math.max(2, Math.floor(height / 0.58));
    for (let ix = 0; ix < cols; ix++) {
      for (let iy = 0; iy < rows; iy++) {
        if (rand() > 0.43) {
          const win = box(0.16, 0.24, 0.025, windowMat,
            x + 0.3 + ix * ((width - 0.45) / cols),
            0.65 + iy * ((height - 1.0) / rows),
            depth * 0.5 + 0.015
          );
          city.add(win);
        }
      }
    }
    if (rand() < 0.28) city.add(cyl(0.035, 0.035, range(0.8, 2.4), metal, x + width * 0.5, height + 0.6, 0, 6));
    x += width + range(0.08, 0.5);
  }
  scene.add(city);
}
createCity();

const bench = new THREE.Group();
bench.position.set(-1, 0, 7.25);
bench.add(box(4.2, 0.13, 0.58, wood, 0, 0.75, 0));
bench.add(box(4.2, 0.12, 0.5, wood, 0, 1.22, 0.3));
for (const px of [-1.68, 1.68]) {
  bench.add(cyl(0.055, 0.055, 0.75, metal, px, 0.38, -0.15, 8));
  bench.add(cyl(0.055, 0.055, 0.75, metal, px, 0.38, 0.15, 8));
}
scene.add(bench);

const rug = new THREE.Mesh(
  new THREE.CircleGeometry(3.45, 48),
  new THREE.MeshStandardMaterial({ color: 0x765d54, roughness: 0.94 })
);
rug.rotation.x = -Math.PI / 2;
rug.position.set(0, 0.025, -1.3);
rug.receiveShadow = true;
scene.add(rug);

const lanterns = [];
function createLantern(x, z) {
  const lantern = new THREE.Group();
  lantern.position.set(x, 0, z);
  lantern.add(cyl(0.17, 0.17, 0.44, metal, 0, 0.27, 0, 10));
  lantern.add(cyl(0.13, 0.13, 0.26, lightGlow, 0, 0.3, 0, 10));
  lantern.add(cyl(0.2, 0.2, 0.06, metal, 0, 0.53, 0, 10));
  lantern.add(cyl(0.12, 0.12, 0.06, metal, 0, 0.05, 0, 10));
  scene.add(lantern);
  lanterns.push(lantern);
}
createLantern(-3.65, 0.1);
createLantern(3.7, 0.28);
createLantern(-6.3, 6.0);

const hemi = new THREE.HemisphereLight(0x7a9bce, 0x33261d, 1.35);
scene.add(hemi);

const moonLight = new THREE.DirectionalLight(0xaec9ff, 2.25);
moonLight.position.set(-10, 16, 7);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.left = -19;
moonLight.shadow.camera.right = 19;
moonLight.shadow.camera.top = 19;
moonLight.shadow.camera.bottom = -19;
scene.add(moonLight);

const warmFill = new THREE.PointLight(0xffae72, 7, 12, 2);
warmFill.position.set(-2, 5.1, 3.0);
warmFill.castShadow = true;
scene.add(warmFill);

const moon = sphere(0.7, new THREE.MeshBasicMaterial({ color: 0xffe2bd, fog: false }), 9, 13, -28);
scene.add(moon);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  flameGroup.scale.set(
    1 + Math.sin(t * 12.0) * 0.07,
    0.9 + Math.sin(t * 9.0 + 1.3) * 0.16,
    1 + Math.cos(t * 10.0) * 0.07
  );
  flameGroup.rotation.y = t * 0.32;
  fireLight.intensity = 19 + Math.sin(t * 13) * 3.6 + Math.sin(t * 5.3) * 1.8;

  stringGroups.forEach((item, i) => {
    item.group.rotation.z = Math.sin(t * 0.72 + item.phase) * 0.018;
    item.group.rotation.x = Math.cos(t * 0.55 + item.phase) * 0.008;
    item.bulbs.forEach((lamp, j) => {
      lamp.material.emissiveIntensity = 2.35 + Math.sin(t * 2.2 + j * 0.8 + i) * 0.35;
    });
  });

  treeCrowns.forEach((crown, i) => {
    crown.rotation.z = Math.sin(t * 0.62 + i * 1.8) * 0.025;
    crown.rotation.x = Math.cos(t * 0.46 + i) * 0.018;
  });

  lanterns.forEach((lantern, i) => {
    lantern.position.y = Math.sin(t * 1.1 + i * 2) * 0.012;
  });

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
