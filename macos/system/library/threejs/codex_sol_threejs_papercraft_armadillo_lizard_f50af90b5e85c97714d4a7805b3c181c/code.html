<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papercraft Armadillo Lizard</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body { background: #d8cbb7; }
  canvas { display: block; }
  .label {
    position: fixed;
    left: 24px;
    bottom: 20px;
    color: rgba(70, 48, 31, 0.72);
    font: 11px/1.4 Georgia, serif;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="label">Papercraft Armadillo Lizard</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8cbb7);
scene.fog = new THREE.Fog(0xd8cbb7, 12, 24);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(
  34,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.set(7.1, 3.7, 9.2);
camera.lookAt(0, 0, 0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 6.5;
controls.maxDistance = 16;
controls.target.set(0, -0.05, 0);

const hemi = new THREE.HemisphereLight(0xfff4dc, 0x594331, 2.2);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe3b0, 5.2);
key.position.set(-5.5, 8.5, 6.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -7;
key.shadow.camera.near = 1;
key.shadow.camera.far = 22;
key.shadow.bias = -0.0004;
scene.add(key);

const rim = new THREE.DirectionalLight(0xc3d5dc, 2.0);
rim.position.set(7, 3, -7);
scene.add(rim);

const fill = new THREE.PointLight(0xd98247, 1.25, 14);
fill.position.set(1, -1.5, 5);
scene.add(fill);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xcfc0aa,
  roughness: 1,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(10, 64), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -3.05;
floor.receiveShadow = true;
scene.add(floor);

const shadowDisk = new THREE.Mesh(
  new THREE.CircleGeometry(3.8, 64),
  new THREE.MeshBasicMaterial({
    color: 0x79634d,
    transparent: true,
    opacity: 0.08,
    depthWrite: false
  })
);
shadowDisk.rotation.x = -Math.PI / 2;
shadowDisk.position.set(0, -3.035, 0);
scene.add(shadowDisk);

const lizard = new THREE.Group();
lizard.rotation.y = -0.08;
lizard.position.y = -0.05;
scene.add(lizard);

const palette = {
  sand: 0xc99b61,
  pale: 0xe2bf82,
  ochre: 0xb87932,
  sienna: 0x934821,
  darkSienna: 0x67321e,
  cream: 0xead19e,
  edge: 0x493224,
  fold: 0x69452e,
  eye: 0x17120e,
  iris: 0xb78a3c
};

function paperMaterial(color, roughness = 0.92) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness: 0,
    side: THREE.DoubleSide
  });
}

const bodyMaterials = [
  paperMaterial(palette.sand),
  paperMaterial(palette.pale),
  paperMaterial(palette.ochre),
  paperMaterial(palette.sienna)
];

const edgeMaterial = new THREE.LineBasicMaterial({
  color: palette.edge,
  transparent: true,
  opacity: 0.58
});

const creaseMaterial = new THREE.LineBasicMaterial({
  color: palette.fold,
  transparent: true,
  opacity: 0.34,
  depthWrite: false
});

function addEdges(mesh, opacity = 0.58, threshold = 18) {
  const material = edgeMaterial.clone();
  material.opacity = opacity;
  const lines = new THREE.LineSegments(
    new THREE.EdgesGeometry(mesh.geometry, threshold),
    material
  );
  lines.renderOrder = 3;
  mesh.add(lines);
  return lines;
}

function finishMesh(mesh, edgeOpacity = 0.58, threshold = 18) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  addEdges(mesh, edgeOpacity, threshold);
  return mesh;
}

function ringFrame(theta) {
  return {
    radial: new THREE.Vector3(Math.cos(theta), Math.sin(theta), 0),
    tangent: new THREE.Vector3(-Math.sin(theta), Math.cos(theta), 0),
    binormal: new THREE.Vector3(0, 0, 1)
  };
}

function tubePoint(theta, phi, majorRadius, tubeRadius) {
  const frame = ringFrame(theta);
  const center = frame.radial.clone().multiplyScalar(majorRadius);
  return center
    .add(frame.radial.clone().multiplyScalar(Math.cos(phi) * tubeRadius))
    .add(frame.binormal.clone().multiplyScalar(Math.sin(phi) * tubeRadius));
}

function createFacetedTube(start, end, segments, sides, radiusFunction, majorRadius = 2.15) {
  const positions = [];
  const geometry = new THREE.BufferGeometry();

  for (let i = 0; i < segments; i++) {
    const t0 = i / segments;
    const t1 = (i + 1) / segments;
    const a0 = THREE.MathUtils.lerp(start, end, t0);
    const a1 = THREE.MathUtils.lerp(start, end, t1);
    const r0 = radiusFunction(t0);
    const r1 = radiusFunction(t1);

    for (let j = 0; j < sides; j++) {
      const p0 = j / sides * Math.PI * 2;
      const p1 = (j + 1) / sides * Math.PI * 2;
      const warp0 = 1 + 0.018 * Math.sin(i * 2.31 + j * 1.73);
      const warp1 = 1 + 0.018 * Math.sin((i + 1) * 2.31 + j * 1.73);
      const warp2 = 1 + 0.018 * Math.sin((i + 1) * 2.31 + (j + 1) * 1.73);
      const warp3 = 1 + 0.018 * Math.sin(i * 2.31 + (j + 1) * 1.73);

      const v0 = tubePoint(a0, p0, majorRadius, r0 * warp0);
      const v1 = tubePoint(a1, p0, majorRadius, r1 * warp1);
      const v2 = tubePoint(a1, p1, majorRadius, r1 * warp2);
      const v3 = tubePoint(a0, p1, majorRadius, r0 * warp3);

      positions.push(
        v0.x, v0.y, v0.z,
        v1.x, v1.y, v1.z,
        v2.x, v2.y, v2.z,
        v0.x, v0.y, v0.z,
        v2.x, v2.y, v2.z,
        v3.x, v3.y, v3.z
      );

      const faceIndex = i * sides + j;
      geometry.addGroup(faceIndex * 6, 6, (i + j * 2) % bodyMaterials.length);
    }
  }

  geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions, 3)
  );
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, bodyMaterials);
  finishMesh(mesh, 0.43, 7);
  return mesh;
}

const bodyStart = 0.58;
const bodyEnd = 5.70;
const body = createFacetedTube(
  bodyStart,
  bodyEnd,
  31,
  9,
  t => 0.63 + 0.06 * Math.sin(t * Math.PI) - 0.05 * t
);
lizard.add(body);

const tail = createFacetedTube(
  bodyEnd,
  Math.PI * 2 + 0.43,
  12,
  8,
  t => 0.58 * Math.pow(1 - t, 0.72) + 0.055,
  2.15
);
lizard.add(tail);

function orientY(object, direction) {
  object.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.clone().normalize()
  );
}

function createTab(theta, phi, width, height, radius = 0.66) {
  const frame = ringFrame(theta);
  const normal = frame.radial.clone().multiplyScalar(Math.cos(phi))
    .add(frame.binormal.clone().multiplyScalar(Math.sin(phi))).normalize();
  const across = new THREE.Vector3().crossVectors(normal, frame.tangent).normalize();
  const geometry = new THREE.PlaneGeometry(width, height, 1, 1);
  const tab = new THREE.Mesh(geometry, paperMaterial(0xd7ad73));
  tab.position.copy(tubePoint(theta, phi, 2.15, radius + 0.018));
  const basis = new THREE.Matrix4().makeBasis(frame.tangent, across, normal);
  tab.quaternion.setFromRotationMatrix(basis);
  tab.rotateZ((Math.round(theta * 10) % 2 ? 1 : -1) * 0.12);
  finishMesh(tab, 0.68, 1);
  lizard.add(tab);

  const foldGeometry = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-width * 0.48, -height * 0.18, 0.002),
    new THREE.Vector3(width * 0.48, -height * 0.18, 0.002)
  ]);
  tab.add(new THREE.Line(foldGeometry, creaseMaterial));
}

for (let i = 1; i < 31; i++) {
  const theta = THREE.MathUtils.lerp(bodyStart, bodyEnd, i / 31);
  for (const phi of [-1.22, 0.05, 1.24]) {
    if ((i + Math.round(phi * 10)) % 2 === 0) {
      createTab(theta, phi, 0.28, 0.13);
    }
  }
}

for (let i = 1; i < 11; i++) {
  const theta = THREE.MathUtils.lerp(bodyEnd, Math.PI * 2 + 0.43, i / 12);
  createTab(theta, i % 2 ? 0.55 : -0.55, 0.22 - i * 0.009, 0.105);
}

const plateMaterials = [
  paperMaterial(palette.pale),
  paperMaterial(palette.sand),
  paperMaterial(palette.ochre),
  paperMaterial(palette.sienna)
];

function makeScaleGeometry(width, length, lift) {
  const shape = new THREE.BufferGeometry();
  const positions = new Float32Array([
    -width * 0.50, -length * 0.35, 0,
     0,              -length * 0.50, lift * 0.30,
     width * 0.50, -length * 0.35, 0,
     width * 0.36,  length * 0.16, lift * 0.58,
     0,              length * 0.58, lift,
    -width * 0.36,  length * 0.16, lift * 0.58
  ]);
  const indices = [
    0, 1, 5,
    1, 4, 5,
    1, 2, 4,
    2, 3, 4
  ];
  shape.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  shape.setIndex(indices);
  shape.computeVertexNormals();
  return shape;
}

function addScale(theta, phi, size, colorIndex, offset = 0.7) {
  const frame = ringFrame(theta);
  const normal = frame.radial.clone().multiplyScalar(Math.cos(phi))
    .add(frame.binormal.clone().multiplyScalar(Math.sin(phi))).normalize();
  const across = new THREE.Vector3().crossVectors(normal, frame.tangent).normalize();

  const geometry = makeScaleGeometry(size, size * 1.22, size * 0.17);
  const scale = new THREE.Mesh(geometry, plateMaterials[colorIndex % plateMaterials.length]);
  scale.position.copy(tubePoint(theta, phi, 2.15, offset));
  scale.position.add(normal.clone().multiplyScalar(0.025));

  const basis = new THREE.Matrix4().makeBasis(across, frame.tangent, normal);
  scale.quaternion.setFromRotationMatrix(basis);
  scale.rotateZ(0.05 * Math.sin(theta * 7 + phi * 3));
  finishMesh(scale, 0.67, 3);
  lizard.add(scale);

  const crease = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, -size * 0.43, size * 0.01),
    new THREE.Vector3(0, size * 0.48, size * 0.15)
  ]);
  scale.add(new THREE.Line(crease, creaseMaterial));

  const tab = new THREE.Mesh(
    new THREE.PlaneGeometry(size * 0.48, size * 0.16),
    paperMaterial(0xd9ac70)
  );
  tab.position.set(0, -size * 0.50, -0.006);
  tab.rotation.x = 0.09;
  finishMesh(tab, 0.55, 1);
  scale.add(tab);
}

const scaleRows = [
  { phi: -1.34, size: 0.37, shift: 0.00 },
  { phi: -0.72, size: 0.43, shift: 0.10 },
  { phi:  0.00, size: 0.49, shift: 0.00 },
  { phi:  0.72, size: 0.43, shift: 0.10 },
  { phi:  1.34, size: 0.37, shift: 0.00 }
];

for (let row = 0; row < scaleRows.length; row++) {
  const data = scaleRows[row];
  const count = 24;
  for (let i = 1; i < count - 1; i++) {
    const theta = THREE.MathUtils.lerp(
      bodyStart + 0.10,
      bodyEnd - 0.05,
      (i + data.shift) / count
    );
    addScale(theta, data.phi, data.size, i + row * 2);
  }
}

function addSpike(theta, phi, height, radius, color) {
  const frame = ringFrame(theta);
  const normal = frame.radial.clone().multiplyScalar(Math.cos(phi))
    .add(frame.binormal.clone().multiplyScalar(Math.sin(phi))).normalize();
  const base = tubePoint(theta, phi, 2.15, 0.72);

  const spike = new THREE.Mesh(
    new THREE.ConeGeometry(radius, height, 4, 1, false),
    paperMaterial(color)
  );
  orientY(spike, normal);
  spike.position.copy(base).add(normal.clone().multiplyScalar(height * 0.46));
  spike.rotateY(theta * 1.7);
  finishMesh(spike, 0.72, 1);
  lizard.add(spike);

  const collar = new THREE.Mesh(
    new THREE.CylinderGeometry(radius * 1.18, radius * 1.30, 0.055, 4),
    paperMaterial(0xd6a25e)
  );
  orientY(collar, normal);
  collar.position.copy(base).add(normal.clone().multiplyScalar(0.015));
  finishMesh(collar, 0.62, 1);
  lizard.add(collar);
}

for (let i = 1; i < 24; i++) {
  const theta = THREE.MathUtils.lerp(bodyStart + 0.08, bodyEnd - 0.15, i / 24);
  const prominence = 0.60 + 0.40 * Math.sin(i / 24 * Math.PI);
  addSpike(theta, 0, 0.48 * prominence, 0.16, i % 3 === 0 ? palette.sienna : palette.ochre);

  if (i % 2 === 0) {
    addSpike(theta + 0.035, 0.66, 0.31 * prominence, 0.115, palette.sienna);
    addSpike(theta - 0.035, -0.66, 0.31 * prominence, 0.115, palette.sand);
  }
}

const headTheta = 0.49;
const headFrame = ringFrame(headTheta);
const headCenter = headFrame.radial.clone().multiplyScalar(2.18);

const headGroup = new THREE.Group();
headGroup.position.copy(headCenter);
lizard.add(headGroup);

const head = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.79, 1),
  [
    paperMaterial(palette.sand),
    paperMaterial(palette.ochre)
  ]
);
head.scale.set(1.05, 1.16, 0.86);
head.rotation.set(0.12, -0.1, -0.28);
finishMesh(head, 0.65, 5);
headGroup.add(head);

const facing = headFrame.tangent.clone().multiplyScalar(-1).normalize();
const snout = new THREE.Mesh(
  new THREE.CylinderGeometry(0.40, 0.62, 0.78, 5, 1, false),
  paperMaterial(palette.pale)
);
orientY(snout, facing);
snout.position.copy(facing).multiplyScalar(0.52);
snout.scale.z = 0.86;
snout.rotateY(0.1);
finishMesh(snout, 0.72, 1);
headGroup.add(snout);

const jaw = new THREE.Mesh(
  new THREE.BoxGeometry(0.70, 0.20, 0.66, 1, 1, 1),
  paperMaterial(palette.cream)
);
jaw.position.copy(facing).multiplyScalar(0.61);
jaw.position.y -= 0.25;
jaw.rotation.z = -0.28;
finishMesh(jaw, 0.62, 2);
headGroup.add(jaw);

function headLocalFromWorldDirection(tangentAmount, verticalAmount, depthAmount) {
  return facing.clone().multiplyScalar(tangentAmount)
    .add(new THREE.Vector3(0, verticalAmount, depthAmount));
}

for (const side of [-1, 1]) {
  const eyeBase = headLocalFromWorldDirection(0.34, 0.20, side * 0.55);
  const eye = new THREE.Mesh(
    new THREE.SphereGeometry(0.105, 8, 6),
    paperMaterial(palette.eye, 0.45)
  );
  eye.position.copy(eyeBase);
  eye.scale.set(1, 1, 0.48);
  headGroup.add(eye);

  const glint = new THREE.Mesh(
    new THREE.SphereGeometry(0.026, 6, 4),
    new THREE.MeshBasicMaterial({ color: 0xffe9ba })
  );
  glint.position.copy(eyeBase);
  glint.position.z += side * 0.064;
  glint.position.y += 0.025;
  headGroup.add(glint);

  const brow = new THREE.Mesh(
    makeScaleGeometry(0.38, 0.40, 0.08),
    paperMaterial(palette.sienna)
  );
  brow.position.copy(headLocalFromWorldDirection(0.18, 0.38, side * 0.48));
  brow.rotation.set(side * 0.24, 0.2, -0.2);
  finishMesh(brow, 0.65, 2);
  headGroup.add(brow);
}

for (const side of [-1, 1]) {
  const nostril = new THREE.Mesh(
    new THREE.CircleGeometry(0.035, 7),
    new THREE.MeshBasicMaterial({ color: 0x3a2418, side: THREE.DoubleSide })
  );
  nostril.position.copy(headLocalFromWorldDirection(0.78, 0.02, side * 0.22));
  nostril.lookAt(nostril.position.clone().add(facing));
  headGroup.add(nostril);
}

for (let i = -2; i <= 2; i++) {
  const phi = i * 0.42;
  const normal = headFrame.radial.clone().multiplyScalar(Math.cos(phi))
    .add(new THREE.Vector3(0, 0, Math.sin(phi))).normalize();
  const spike = new THREE.Mesh(
    new THREE.ConeGeometry(0.105, 0.34, 4),
    paperMaterial(i % 2 ? palette.ochre : palette.sienna)
  );
  orientY(spike, normal);
  spike.position.copy(normal).multiplyScalar(0.76);
  spike.position.y += 0.13;
  finishMesh(spike, 0.7, 1);
  headGroup.add(spike);
}

function addLimb(theta, side, flip) {
  const frame = ringFrame(theta);
  const inner = frame.radial.clone().multiplyScalar(-1);
  const root = tubePoint(theta, side > 0 ? 1.7 : -1.7, 2.15, 0.57);
  root.add(inner.clone().multiplyScalar(0.08));

  const limb = new THREE.Group();
  limb.position.copy(root);
  lizard.add(limb);

  const upperDirection = inner.clone()
    .add(new THREE.Vector3(0, flip * 0.35, side * 0.22))
    .normalize();

  const upper = new THREE.Mesh(
    new THREE.CylinderGeometry(0.16, 0.22, 0.58, 4),
    paperMaterial(palette.ochre)
  );
  orientY(upper, upperDirection);
  upper.position.copy(upperDirection).multiplyScalar(0.25);
  finishMesh(upper, 0.68, 1);
  limb.add(upper);

  const elbow = upperDirection.clone().multiplyScalar(0.52);
  const lowerDirection = inner.clone()
    .multiplyScalar(0.42)
    .add(frame.tangent.clone().multiplyScalar(flip * 0.68))
    .add(new THREE.Vector3(0, -0.22, side * 0.2))
    .normalize();

  const lower = new THREE.Mesh(
    new THREE.CylinderGeometry(0.10, 0.15, 0.48, 4),
    paperMaterial(palette.sand)
  );
  orientY(lower, lowerDirection);
  lower.position.copy(elbow).add(lowerDirection.clone().multiplyScalar(0.21));
  finishMesh(lower, 0.68, 1);
  limb.add(lower);

  const palm = elbow.clone().add(lowerDirection.clone().multiplyScalar(0.46));
  const foot = new THREE.Mesh(
    new THREE.BoxGeometry(0.30, 0.12, 0.22),
    paperMaterial(palette.pale)
  );
  foot.position.copy(palm);
  foot.rotation.z = theta + flip * 0.3;
  finishMesh(foot, 0.62, 1);
  limb.add(foot);

  for (let c = -1; c <= 1; c++) {
    const clawDirection = frame.tangent.clone().multiplyScalar(flip)
      .add(inner.clone().multiplyScalar(0.4))
      .normalize();
    const claw = new THREE.Mesh(
      new THREE.ConeGeometry(0.035, 0.22, 3),
      paperMaterial(palette.cream)
    );
    orientY(claw, clawDirection);
    claw.position.copy(palm)
      .add(new THREE.Vector3(0, c * 0.075, side * c * 0.035))
      .add(clawDirection.clone().multiplyScalar(0.13));
    finishMesh(claw, 0.65, 1);
    limb.add(claw);
  }
}

addLimb(1.25, 1, 1);
addLimb(1.25, -1, 1);
addLimb(4.82, 1, -1);
addLimb(4.82, -1, -1);

const headSeam = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-0.45, 0.48, 0.54),
    new THREE.Vector3(-0.10, 0.68, 0.62),
    new THREE.Vector3(0.35, 0.48, 0.54)
  ]),
  creaseMaterial.clone()
);
headGroup.add(headSeam);

const tailTip = tubePoint(Math.PI * 2 + 0.43, 0, 2.15, 0.06);
const contactFold = new THREE.Mesh(
  new THREE.CircleGeometry(0.11, 5),
  paperMaterial(palette.cream)
);
contactFold.position.copy(tailTip);
contactFold.rotation.y = Math.PI / 2;
finishMesh(contactFold, 0.7, 1);
lizard.add(contactFold);

const tinyFibers = new THREE.Group();
const fiberMaterial = new THREE.LineBasicMaterial({
  color: 0xf4d7a6,
  transparent: true,
  opacity: 0.18
});
for (let i = 0; i < 42; i++) {
  const theta = bodyStart + (bodyEnd - bodyStart) * ((i * 0.6180339887) % 1);
  const phi = -1.4 + 2.8 * ((i * 0.3819660113) % 1);
  const p = tubePoint(theta, phi, 2.15, 0.714);
  const frame = ringFrame(theta);
  const q = p.clone().add(frame.tangent.clone().multiplyScalar(0.09));
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([p, q]),
    fiberMaterial
  );
  tinyFibers.add(line);
}
lizard.add(tinyFibers);

scene.traverse(object => {
  if (object.isMesh) {
    object.castShadow = object !== floor && object !== shadowDisk;
    object.receiveShadow = true;
  }
});

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
