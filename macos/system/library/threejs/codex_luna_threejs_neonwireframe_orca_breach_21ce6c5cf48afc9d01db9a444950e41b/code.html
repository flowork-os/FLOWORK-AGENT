<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Wireframe Orca</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040b}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040b);
scene.fog = new THREE.FogExp2(0x02040b, 0.035);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(8.4, 4.1, 8.8);
camera.lookAt(0, 0.15, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.minDistance = 5.3;
controls.maxDistance = 16;
controls.target.set(0, 0.15, 0);

const orca = new THREE.Group();
orca.rotation.z = -0.075;
orca.rotation.y = -0.1;
scene.add(orca);

const cyan = 0x19efff;
const magenta = 0xff24d8;
const pale = 0xbafcff;

const coreCyan = new THREE.MeshBasicMaterial({
  color: cyan,
  transparent: true,
  opacity: 0.96,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const coreMagenta = new THREE.MeshBasicMaterial({
  color: magenta,
  transparent: true,
  opacity: 0.98,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const haloCyan = new THREE.MeshBasicMaterial({
  color: cyan,
  transparent: true,
  opacity: 0.075,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const haloMagenta = new THREE.MeshBasicMaterial({
  color: magenta,
  transparent: true,
  opacity: 0.085,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const stations = [
  { x: -3.15, y: 0.68, ry: 0.34, rz: 0.36 },
  { x: -2.82, y: 0.62, ry: 0.63, rz: 0.62 },
  { x: -2.36, y: 0.52, ry: 0.80, rz: 0.78 },
  { x: -1.78, y: 0.37, ry: 0.91, rz: 0.86 },
  { x: -1.08, y: 0.20, ry: 0.94, rz: 0.88 },
  { x: -0.32, y: 0.03, ry: 0.89, rz: 0.84 },
  { x: 0.48, y: -0.10, ry: 0.77, rz: 0.72 },
  { x: 1.20, y: -0.20, ry: 0.60, rz: 0.56 },
  { x: 1.86, y: -0.28, ry: 0.39, rz: 0.37 },
  { x: 2.42, y: -0.33, ry: 0.18, rz: 0.18 }
];

function addTube(points, material, radius, closed = false, tubularSegments = 18) {
  const curve = new THREE.CatmullRomCurve3(points, closed, 'centripetal');
  const haloGeometry = new THREE.TubeGeometry(curve, Math.max(12, points.length * 8), radius * 2.7, 8, closed);
  const halo = new THREE.Mesh(haloGeometry, material === coreMagenta ? haloMagenta : haloCyan);
  halo.renderOrder = 0;
  orca.add(halo);

  const geometry = new THREE.TubeGeometry(curve, Math.max(tubularSegments, points.length * 10), radius, 7, closed);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.renderOrder = 1;
  orca.add(mesh);
}

function ringAt(station, phase = 0) {
  const points = [];
  const count = 28;
  for (let i = 0; i < count; i++) {
    const angle = phase + (i / count) * Math.PI * 2;
    points.push(new THREE.Vector3(
      station.x,
      station.y + Math.cos(angle) * station.ry,
      Math.sin(angle) * station.rz
    ));
  }
  return points;
}

for (let i = 0; i < stations.length; i++) {
  addTube(ringAt(stations[i], i % 2 ? 0.08 : 0), coreCyan, i < 2 ? 0.026 : 0.021, true, 24);
}

const railAngles = [-1.24, -0.82, -0.38, 0.05, 0.48, 0.92, 1.28];
for (const angle of railAngles) {
  const rail = [];
  for (const station of stations) {
    rail.push(new THREE.Vector3(
      station.x,
      station.y + Math.cos(angle) * station.ry,
      Math.sin(angle) * station.rz
    ));
  }
  addTube(rail, coreCyan, 0.022, false, 70);
}

const upperContour = stations.map((s) => new THREE.Vector3(s.x, s.y + s.ry * 0.78, s.rz * 0.23));
const lowerContour = stations.map((s) => new THREE.Vector3(s.x, s.y - s.ry * 0.78, s.rz * 0.23));
addTube(upperContour, coreCyan, 0.026, false, 80);
addTube(lowerContour, coreCyan, 0.026, false, 80);

const snout = [
  new THREE.Vector3(-3.17, 0.68, 0.02),
  new THREE.Vector3(-3.35, 0.61, 0.12),
  new THREE.Vector3(-3.38, 0.48, 0.02),
  new THREE.Vector3(-3.20, 0.42, -0.12)
];
addTube(snout, coreCyan, 0.028, false, 28);

const mouth = [
  new THREE.Vector3(-3.33, 0.49, 0.38),
  new THREE.Vector3(-3.06, 0.38, 0.56),
  new THREE.Vector3(-2.70, 0.36, 0.64)
];
addTube(mouth, coreCyan, 0.023, false, 28);

const jaw = [
  new THREE.Vector3(-3.30, 0.45, -0.28),
  new THREE.Vector3(-2.96, 0.28, -0.54),
  new THREE.Vector3(-2.57, 0.18, -0.61)
];
addTube(jaw, coreCyan, 0.022, false, 28);

const dorsalOutline = [
  new THREE.Vector3(-0.15, 0.74, 0.02),
  new THREE.Vector3(0.30, 1.05, 0.02),
  new THREE.Vector3(0.68, 2.42, 0.02),
  new THREE.Vector3(0.88, 2.74, 0.02),
  new THREE.Vector3(1.02, 1.04, 0.02),
  new THREE.Vector3(1.18, 0.40, 0.02)
];
addTube(dorsalOutline, coreCyan, 0.032, false, 44);

const dorsalRibs = [
  [new THREE.Vector3(0.12, 0.78, 0.02), new THREE.Vector3(0.68, 2.42, 0.02)],
  [new THREE.Vector3(0.43, 0.83, 0.02), new THREE.Vector3(0.84, 2.63, 0.02)],
  [new THREE.Vector3(0.78, 0.91, 0.02), new THREE.Vector3(0.96, 1.24, 0.02)]
];
for (const rib of dorsalRibs) addTube(rib, coreCyan, 0.019, false, 22);

const flukeRoot = new THREE.Vector3(2.40, -0.33, 0);
const leftFluke = [
  flukeRoot,
  new THREE.Vector3(2.72, -0.28, 0.02),
  new THREE.Vector3(3.28, 0.12, 0.04),
  new THREE.Vector3(3.92, 0.48, 0.06),
  new THREE.Vector3(3.60, -0.02, 0.04),
  new THREE.Vector3(3.10, -0.45, 0.02),
  flukeRoot
];
const rightFluke = [
  flukeRoot,
  new THREE.Vector3(2.74, -0.40, -0.02),
  new THREE.Vector3(3.36, -0.66, -0.06),
  new THREE.Vector3(4.03, -0.76, -0.08),
  new THREE.Vector3(3.63, -0.39, -0.04),
  new THREE.Vector3(3.10, -0.12, -0.01),
  flukeRoot
];
addTube(leftFluke, coreCyan, 0.031, false, 42);
addTube(rightFluke, coreCyan, 0.031, false, 42);

addTube([
  new THREE.Vector3(2.48, -0.33, 0),
  new THREE.Vector3(3.12, 0.02, 0.03),
  new THREE.Vector3(3.66, 0.34, 0.05)
], coreCyan, 0.019, false, 32);

addTube([
  new THREE.Vector3(2.48, -0.33, 0),
  new THREE.Vector3(3.14, -0.47, -0.03),
  new THREE.Vector3(3.75, -0.69, -0.07)
], coreCyan, 0.019, false, 32);

function ovalLoop(center, radiusX, radiusY, depth, material, segments = 24) {
  const points = [];
  for (let i = 0; i < segments; i++) {
    const a = (i / segments) * Math.PI * 2;
    points.push(new THREE.Vector3(
      center.x + Math.cos(a) * radiusX,
      center.y + Math.sin(a) * radiusY,
      center.z + Math.cos(a) * depth
    ));
  }
  addTube(points, material, 0.028, true, 26);
}

ovalLoop(new THREE.Vector3(-2.43, 0.78, 0.58), 0.43, 0.23, 0.025, coreMagenta, 28);

const eyeGeometry = new THREE.SphereGeometry(0.075, 12, 8);
const eye = new THREE.Mesh(eyeGeometry, new THREE.MeshBasicMaterial({
  color: pale,
  blending: THREE.AdditiveBlending,
  transparent: true,
  opacity: 1
}));
eye.position.set(-2.43, 0.79, 0.615);
orca.add(eye);

const bellyStripe = [
  new THREE.Vector3(-2.72, -0.06, 0.62),
  new THREE.Vector3(-2.18, -0.28, 0.70),
  new THREE.Vector3(-1.40, -0.43, 0.72),
  new THREE.Vector3(-0.54, -0.52, 0.68),
  new THREE.Vector3(0.18, -0.56, 0.58)
];
addTube(bellyStripe, coreMagenta, 0.031, false, 70);

for (const x of [-2.35, -1.82, -1.28, -0.70]) {
  const station = stations.reduce((closest, current) =>
    Math.abs(current.x - x) < Math.abs(closest.x - x) ? current : closest
  );
  const arc = [];
  for (let i = 0; i < 13; i++) {
    const a = Math.PI * 0.14 + (i / 12) * Math.PI * 0.72;
    arc.push(new THREE.Vector3(
      station.x + Math.cos(a) * 0.16,
      station.y - station.ry * 0.67 + Math.sin(a) * 0.08,
      station.rz * 0.62
    ));
  }
  addTube(arc, coreMagenta, 0.018, false, 20);
}

const pectoral = [
  new THREE.Vector3(-1.20, 0.10, 0.78),
  new THREE.Vector3(-0.48, -0.18, 1.32),
  new THREE.Vector3(0.32, -0.70, 1.42),
  new THREE.Vector3(-0.08, -0.30, 0.85),
  new THREE.Vector3(-1.20, 0.10, 0.78)
];
addTube(pectoral, coreCyan, 0.026, false, 36);
addTube([
  new THREE.Vector3(-1.12, 0.08, 0.82),
  new THREE.Vector3(-0.48, -0.18, 1.32)
], coreCyan, 0.018, false, 20);

const ambient = new THREE.HemisphereLight(0x17385b, 0x020208, 0.32);
scene.add(ambient);

const cyanLight = new THREE.PointLight(cyan, 3.2, 12, 2);
cyanLight.position.set(-2.5, 2.8, 3.2);
scene.add(cyanLight);

const magentaLight = new THREE.PointLight(magenta, 2.8, 10, 2);
magentaLight.position.set(1.4, -1.8, 2.5);
scene.add(magentaLight);

const rimLight = new THREE.DirectionalLight(0x4bdcff, 1.4);
rimLight.position.set(-4, 5, 6);
scene.add(rimLight);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
