<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cyberpunk VR Headset</title>
<style>
  html, body { margin: 0; height: 100%; background: #08090e; overflow: hidden; }
  #c { display: block; width: 100%; height: 100%; }
  #tag {
    position: fixed; left: 14px; bottom: 12px;
    font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: .18em; text-transform: uppercase;
    color: #6df3ff; opacity: .55; pointer-events: none;
    text-shadow: 0 0 8px rgba(0,229,255,.6);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tag">// NEUROLINK VISOR — mk.09</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------------------------------------------------------- palette
const CYAN    = 0x00e5ff;
const MAGENTA = 0xff2a9d;

// ---------------------------------------------------------------- renderer
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ---------------------------------------------------------------- scene / camera
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08090e);
scene.fog = new THREE.FogExp2(0x06070c, 0.03);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(1.4, 0.55, 3.5);

// environment for crisp reflections on metal + mirrored lens
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

// ---------------------------------------------------------------- controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 2.2;
controls.maxDistance = 8;
controls.target.set(0, 0.05, 0);

// ---------------------------------------------------------------- lighting
scene.add(new THREE.HemisphereLight(0x223449, 0x08080c, 0.55));

const key = new THREE.DirectionalLight(0xcfe2ff, 2.3);
key.position.set(4, 6, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 24;
key.shadow.camera.left = -3; key.shadow.camera.right = 3;
key.shadow.camera.top = 3;  key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fb0ff, 0.55);
fill.position.set(-5, 1.5, 2.5);
scene.add(fill);

const rimC = new THREE.DirectionalLight(CYAN, 1.1);
rimC.position.set(-3, 1.2, -4);
scene.add(rimC);

const rimM = new THREE.DirectionalLight(MAGENTA, 1.1);
rimM.position.set(3.2, 0.4, -3.6);
scene.add(rimM);

// colored accent lights that spill from the neon strips onto the black armor
const glowC = new THREE.PointLight(CYAN, 3.0, 3.0, 2.0);   glowC.position.set(0, 0.55, 0.7);  scene.add(glowC);
const glowM = new THREE.PointLight(MAGENTA, 3.0, 3.0, 2.0); glowM.position.set(0, -0.5, 0.7);  scene.add(glowM);

// ---------------------------------------------------------------- ground (shadow only)
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.45 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.0;
ground.receiveShadow = true;
scene.add(ground);

// ================================================================ MATERIALS
const matteBlack = new THREE.MeshStandardMaterial({ color: 0x0d0e13, metalness: 0.45, roughness: 0.58, envMapIntensity: 0.7 });
const armorPanel = new THREE.MeshStandardMaterial({ color: 0x181a22, metalness: 0.7,  roughness: 0.34, envMapIntensity: 1.0 });
const armorDark  = new THREE.MeshStandardMaterial({ color: 0x101219, metalness: 0.6,  roughness: 0.45, envMapIntensity: 0.9 });
const rubber     = new THREE.MeshStandardMaterial({ color: 0x08080b, metalness: 0.05, roughness: 0.92, envMapIntensity: 0.4 });
const metalTrim  = new THREE.MeshStandardMaterial({ color: 0x3a3d47, metalness: 0.95, roughness: 0.28, envMapIntensity: 1.1 });

const lensMat = new THREE.MeshPhysicalMaterial({
  color: 0x090c14, metalness: 1.0, roughness: 0.06,
  envMapIntensity: 1.6, clearcoat: 1.0, clearcoatRoughness: 0.04,
  iridescence: 1.0, iridescenceIOR: 1.35, iridescenceThicknessRange: [120, 460]
});

function neon(hex, mult = 2.2) {
  const c = new THREE.Color(hex).multiplyScalar(mult);
  return new THREE.MeshBasicMaterial({ color: c });
}
const neonCyan = neon(CYAN);
const neonMag  = neon(MAGENTA);

// ================================================================ HEADSET
const headset = new THREE.Group();
headset.position.y = 0.1;
scene.add(headset);

const LENS_R = 1.15;
const LENS_FRONT = 0.66;
const LENS_POSZ = LENS_FRONT - LENS_R;      // cylinder centre so front sits at LENS_FRONT
const LENS_HALF = 0.65;                       // half theta sweep

// ---------- main visor body (extruded angular wedge) ----------
(function buildBody() {
  const p = [
    [0.50, 0.40], [0.55, 0.12], [0.55, -0.12], [0.50, -0.40],
    [-0.05, -0.52], [-0.50, -0.32], [-0.50, 0.30], [-0.05, 0.52]
  ];
  const shape = new THREE.Shape();
  shape.moveTo(p[0][0], p[0][1]);
  for (let i = 1; i < p.length; i++) shape.lineTo(p[i][0], p[i][1]);
  shape.closePath();

  const WID = 1.78;
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: WID, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05, bevelSegments: 3, steps: 1
  });
  geo.translate(0, 0, -WID / 2);
  geo.rotateY(-Math.PI / 2);
  geo.computeVertexNormals();

  const body = new THREE.Mesh(geo, matteBlack);
  body.castShadow = true; body.receiveShadow = true;
  headset.add(body);
})();

// ---------- angular armor accent panels ----------
(function buildPanels() {
  // top brow panel
  const brow = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.14, 0.5), armorPanel);
  brow.position.set(0, 0.42, 0.26);
  brow.rotation.x = -0.5;
  brow.castShadow = true;
  headset.add(brow);

  // lower chin panel
  const chin = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.14, 0.42), armorDark);
  chin.position.set(0, -0.44, 0.28);
  chin.rotation.x = 0.55;
  chin.castShadow = true;
  headset.add(chin);

  // angled cheek plates
  for (const s of [-1, 1]) {
    const cheek = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.72, 0.16), armorPanel);
    cheek.position.set(s * 0.72, 0.0, 0.44);
    cheek.rotation.y = s * 0.7;
    cheek.rotation.z = s * 0.06;
    cheek.castShadow = true;
    headset.add(cheek);

    // side vent slits (emissive)
    for (let i = 0; i < 3; i++) {
      const slit = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.16, 0.02), i % 2 ? neonMag : neonCyan);
      slit.position.set(s * 0.74, -0.02 + i * 0.055 - 0.03, 0.5);
      slit.rotation.y = s * 0.7;
      headset.add(slit);
    }
  }

  // front sensor bar + camera dots
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.07, 0.05), metalTrim);
  bar.position.set(0, 0.30, 0.585);
  headset.add(bar);
  for (let i = -1; i <= 1; i++) {
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.022, 16, 16), i === 0 ? neonMag : neonCyan);
    dot.position.set(i * 0.28, 0.30, 0.61);
    headset.add(dot);
  }
})();

// ---------- mirrored curved lens ----------
(function buildLens() {
  const geo = new THREE.CylinderGeometry(LENS_R, LENS_R, 0.66, 96, 1, true, -LENS_HALF, 2 * LENS_HALF);
  const lens = new THREE.Mesh(geo, lensMat);
  lens.position.z = LENS_POSZ;
  headset.add(lens);

  // inner black bezel behind lens edge to hide seams
  const bez = new THREE.Mesh(
    new THREE.CylinderGeometry(LENS_R - 0.02, LENS_R - 0.02, 0.72, 96, 1, true, -LENS_HALF - 0.05, 2 * LENS_HALF + 0.1),
    new THREE.MeshStandardMaterial({ color: 0x050507, metalness: 0.3, roughness: 0.8, side: THREE.BackSide })
  );
  bez.position.z = LENS_POSZ;
  headset.add(bez);
})();

// ---------- holographic HUD (flickering canvas on curved surface) ----------
const hudCanvas = document.createElement('canvas');
hudCanvas.width = hudCanvas.height = 512;
const hudCtx = hudCanvas.getContext('2d');
const hudTex = new THREE.CanvasTexture(hudCanvas);
hudTex.colorSpace = THREE.SRGBColorSpace;

const hudMesh = new THREE.Mesh(
  new THREE.CylinderGeometry(LENS_R + 0.012, LENS_R + 0.012, 0.56, 96, 1, true, -LENS_HALF + 0.06, 2 * LENS_HALF - 0.12),
  new THREE.MeshBasicMaterial({ map: hudTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.FrontSide })
);
hudMesh.position.z = LENS_POSZ;
headset.add(hudMesh);

function drawHUD(t) {
  const g = hudCtx, W = 512;
  g.clearRect(0, 0, W, W);
  g.save();
  g.translate(W / 2, W / 2);

  // faint scanlines
  g.globalAlpha = 0.10;
  g.strokeStyle = '#00e5ff';
  g.lineWidth = 1;
  for (let y = -W/2; y < W/2; y += 6) { g.beginPath(); g.moveTo(-W/2, y); g.lineTo(W/2, y); g.stroke(); }

  g.globalAlpha = 1;
  g.lineWidth = 2;

  // rotating outer reticle
  g.strokeStyle = '#5ff0ff';
  for (let k = 0; k < 3; k++) {
    const r = 150 + k * 24;
    const a0 = t * (0.4 + k * 0.15) + k * 1.7;
    g.beginPath(); g.arc(0, 0, r, a0, a0 + 1.1); g.stroke();
    g.beginPath(); g.arc(0, 0, r, a0 + Math.PI, a0 + Math.PI + 0.7); g.stroke();
  }
  // ticks
  g.strokeStyle = '#ff5ec8';
  for (let i = 0; i < 48; i++) {
    const a = (i / 48) * Math.PI * 2 + t * 0.2;
    const r1 = 120, r2 = i % 4 === 0 ? 138 : 130;
    g.globalAlpha = 0.5 + 0.5 * Math.sin(t * 3 + i);
    g.beginPath();
    g.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
    g.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
    g.stroke();
  }
  g.globalAlpha = 1;

  // crosshair
  g.strokeStyle = '#9ff8ff';
  g.beginPath();
  g.moveTo(-40, 0); g.lineTo(-14, 0); g.moveTo(14, 0); g.lineTo(40, 0);
  g.moveTo(0, -40); g.lineTo(0, -14); g.moveTo(0, 14); g.lineTo(0, 40);
  g.stroke();
  g.strokeRect(-8, -8, 16, 16);

  // corner target brackets
  g.strokeStyle = '#ff5ec8'; g.lineWidth = 3;
  const c = 175;
  const corners = [[-1,-1],[1,-1],[-1,1],[1,1]];
  for (const [sx, sy] of corners) {
    g.beginPath();
    g.moveTo(sx*c, sy*c - sy*34); g.lineTo(sx*c, sy*c); g.lineTo(sx*c - sx*34, sy*c);
    g.stroke();
  }
  g.lineWidth = 2;

  // scrolling waveform
  g.strokeStyle = '#5ff0ff';
  g.beginPath();
  for (let x = -140; x <= 140; x += 4) {
    const yy = 118 + Math.sin(x * 0.06 + t * 5) * 10 * Math.sin(t * 2 + x * 0.01);
    x === -140 ? g.moveTo(x, yy) : g.lineTo(x, yy);
  }
  g.stroke();

  // data bars
  for (let i = 0; i < 7; i++) {
    const h = 8 + (Math.sin(t * 4 + i * 1.3) * 0.5 + 0.5) * 34;
    g.fillStyle = i % 2 ? '#ff5ec8' : '#5ff0ff';
    g.globalAlpha = 0.85;
    g.fillRect(-150 + i * 14, -128 - h, 9, h);
  }
  g.globalAlpha = 1;

  // readout text
  g.fillStyle = '#7ff5ff';
  g.font = '13px monospace';
  g.fillText('SYS ONLINE', -175, -150);
  g.fillText('LAT 07.07 // 128ms', -175, 160);
  g.fillStyle = '#ff8fd6';
  g.fillText('NEURO-SYNC ' + (60 + Math.floor((Math.sin(t) * 0.5 + 0.5) * 40)) + '%', 30, 160);

  // random glitch line
  if (Math.sin(t * 40) > 0.94) {
    const gy = (Math.sin(t * 91.7) * 200) | 0;
    g.fillStyle = 'rgba(255,94,200,0.5)';
    g.fillRect(-W/2, gy, W, 3 + (Math.sin(t*13)*3));
  }

  g.restore();
  hudTex.needsUpdate = true;
}

// ---------- neon light strips along edges ----------
function arc(R, y, half, seg) {
  const pts = [];
  for (let i = 0; i <= seg; i++) {
    const th = -half + (2 * half) * (i / seg);
    pts.push(new THREE.Vector3(R * Math.sin(th), y, LENS_POSZ + R * Math.cos(th)));
  }
  return pts;
}
function strip(points, mat, radius = 0.014) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geo = new THREE.TubeGeometry(curve, Math.max(24, points.length * 4), radius, 10, false);
  return new THREE.Mesh(geo, mat);
}
(function buildStrips() {
  headset.add(strip(arc(LENS_R + 0.02, 0.335, LENS_HALF - 0.03, 40), neonCyan));   // top lens rim
  headset.add(strip(arc(LENS_R + 0.02, -0.335, LENS_HALF - 0.03, 40), neonMag));    // bottom lens rim
  // vertical side accents connecting rims
  for (const s of [-1, 1]) {
    const th = s * (LENS_HALF - 0.03);
    const x = (LENS_R + 0.02) * Math.sin(th), z = LENS_POSZ + (LENS_R + 0.02) * Math.cos(th);
    headset.add(strip([
      new THREE.Vector3(x, 0.335, z),
      new THREE.Vector3(x * 1.03, 0, z),
      new THREE.Vector3(x, -0.335, z)
    ], s < 0 ? neonCyan : neonMag));
  }
  // horizontal armor edge strips
  headset.add(strip([new THREE.Vector3(-0.66,0.47,0.16), new THREE.Vector3(0,0.5,0.2), new THREE.Vector3(0.66,0.47,0.16)], neonCyan, 0.012));
  headset.add(strip([new THREE.Vector3(-0.62,-0.5,0.2), new THREE.Vector3(0,-0.53,0.24), new THREE.Vector3(0.62,-0.5,0.2)], neonMag, 0.012));
})();

// ---------- neon-etched logo ----------
(function buildLogo() {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
  const x = cv.getContext('2d');
  x.clearRect(0, 0, 512, 256);
  x.translate(256, 128);
  x.strokeStyle = '#57f2ff'; x.lineWidth = 8; x.lineJoin = 'round';
  x.shadowColor = '#00e5ff'; x.shadowBlur = 18;
  // angular eye emblem
  x.beginPath();
  x.moveTo(-70, 0); x.lineTo(-30, -34); x.lineTo(30, -34); x.lineTo(70, 0);
  x.lineTo(30, 34); x.lineTo(-30, 34); x.closePath(); x.stroke();
  x.strokeStyle = '#ff5ec8'; x.shadowColor = '#ff2a9d';
  x.beginPath(); x.arc(0, 0, 16, 0, Math.PI * 2); x.stroke();
  x.beginPath(); x.moveTo(0,-8); x.lineTo(0,8); x.stroke();
  x.shadowBlur = 10; x.fillStyle = '#8ff6ff'; x.font = 'bold 34px monospace';
  x.textAlign = 'center'; x.fillText('NEUROLINK', 0, 92);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const logo = new THREE.Mesh(
    new THREE.PlaneGeometry(0.5, 0.25),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false })
  );
  logo.position.set(0, 0.44, 0.42);
  logo.rotation.x = -0.5;
  headset.add(logo);
})();

// ---------- exposed ribbon cable + round cables ----------
function buildRibbon(pts, hw) {
  const N = pts.length, pos = [], uv = [], idx = [];
  const Wv = new THREE.Vector3(1, 0, 0);
  for (let i = 0; i < N; i++) {
    const p = pts[i];
    const l = p.clone().addScaledVector(Wv, -hw);
    const r = p.clone().addScaledVector(Wv, hw);
    pos.push(l.x, l.y, l.z, r.x, r.y, r.z);
    const v = i / (N - 1);
    uv.push(0, v, 1, v);
  }
  for (let i = 0; i < N - 1; i++) {
    const a = i * 2, b = i * 2 + 1, c = a + 2, d = a + 3;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
(function buildCabling() {
  // ribbon-cable texture (parallel conductors)
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 32;
  const x = cv.getContext('2d');
  x.fillStyle = '#17181e'; x.fillRect(0, 0, 256, 32);
  for (let i = 0; i < 26; i++) {
    const cx = 6 + i * 9.4;
    x.fillStyle = (i % 7 === 3) ? '#0a8fa0' : (i % 7 === 6) ? '#a03068' : '#3a3c44';
    x.fillRect(cx, 0, 5, 32);
    x.fillStyle = 'rgba(255,255,255,0.08)'; x.fillRect(cx, 0, 2, 32);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(1, 1);
  const ribMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.7, metalness: 0.1, side: THREE.DoubleSide });

  const ribPts = [
    new THREE.Vector3(-0.44, -0.44, 0.16),
    new THREE.Vector3(-0.55, -0.6, 0.05),
    new THREE.Vector3(-0.64, -0.74, -0.06),
    new THREE.Vector3(-0.58, -0.85, -0.12),
    new THREE.Vector3(-0.42, -0.86, -0.06),
    new THREE.Vector3(-0.34, -0.78, 0.03)
  ];
  const ribbon = new THREE.Mesh(buildRibbon(ribPts, 0.1), ribMat);
  ribbon.castShadow = true;
  headset.add(ribbon);

  // connector block where ribbon exits
  const conn = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.1, 0.12), armorDark);
  conn.position.set(-0.44, -0.42, 0.18);
  conn.castShadow = true;
  headset.add(conn);

  // a couple of thin round cables
  const cabMat = new THREE.MeshStandardMaterial({ color: 0x111116, roughness: 0.6, metalness: 0.2 });
  const c1 = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.36, -0.42, 0.22), new THREE.Vector3(-0.3, -0.62, 0.14),
    new THREE.Vector3(-0.24, -0.78, 0.02), new THREE.Vector3(-0.28, -0.86, -0.06)
  ]);
  headset.add(new THREE.Mesh(new THREE.TubeGeometry(c1, 40, 0.02, 8, false), cabMat));
  const c2 = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0.5, -0.4, 0.22), new THREE.Vector3(0.6, -0.6, 0.12),
    new THREE.Vector3(0.55, -0.78, 0.0), new THREE.Vector3(0.44, -0.84, -0.08)
  ]);
  headset.add(new THREE.Mesh(new THREE.TubeGeometry(c2, 40, 0.02, 8, false), cabMat));
})();

// ---------- head strap + adjustment dial ----------
(function buildStrap() {
  const side = new THREE.CatmullRomCurve3([
    new THREE.Vector3( 0.80, 0.05, -0.15),
    new THREE.Vector3( 1.00, 0.05, -0.7),
    new THREE.Vector3( 0.6,  0.05, -1.15),
    new THREE.Vector3( 0.0,  0.05, -1.32),
    new THREE.Vector3(-0.6,  0.05, -1.15),
    new THREE.Vector3(-1.00, 0.05, -0.7),
    new THREE.Vector3(-0.80, 0.05, -0.15)
  ]);
  const band = new THREE.Mesh(new THREE.TubeGeometry(side, 120, 0.07, 12, false), rubber);
  band.castShadow = true; band.receiveShadow = true;
  headset.add(band);
  // thin neon line running along the strap top
  const line = new THREE.Mesh(new THREE.TubeGeometry(side, 120, 0.012, 8, false), neonCyan);
  line.position.y = 0.06;
  headset.add(line);

  const top = new THREE.CatmullRomCurve3([
    new THREE.Vector3( 0.72, 0.35, -0.2),
    new THREE.Vector3( 0.5,  0.78, -0.55),
    new THREE.Vector3( 0.0,  0.92, -0.85),
    new THREE.Vector3(-0.5,  0.78, -0.55),
    new THREE.Vector3(-0.72, 0.35, -0.2)
  ]);
  const topBand = new THREE.Mesh(new THREE.TubeGeometry(top, 90, 0.06, 12, false), rubber);
  topBand.castShadow = true;
  headset.add(topBand);

  // back adjustment dial
  const dial = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.08, 32), metalTrim);
  dial.rotation.x = Math.PI / 2;
  dial.position.set(0, 0.05, -1.34);
  dial.castShadow = true;
  headset.add(dial);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.012, 12, 40), neonMag);
  ring.position.set(0, 0.05, -1.30);
  headset.add(ring);

  // face cushion at rear opening
  const cushion = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.1, 16, 40), rubber);
  cushion.position.set(0, -0.02, -0.5);
  cushion.scale.set(1.15, 0.85, 1);
  cushion.castShadow = true;
  headset.add(cushion);
})();

// ================================================================ post-processing (bloom)
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.7, 0.5, 0.65);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ================================================================ resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

// ================================================================ animate
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  drawHUD(t);
  hudMesh.material.opacity = 0.55 + 0.18 * Math.sin(t * 7) + (Math.sin(t * 53) > 0.9 ? -0.35 : 0);

  // subtle breathing glow on the accent lights
  glowC.intensity = 2.6 + Math.sin(t * 2.0) * 0.6;
  glowM.intensity = 2.6 + Math.sin(t * 2.0 + 1.7) * 0.6;

  controls.update();
  composer.render();
}
animate();
</script>
</body>
</html>
