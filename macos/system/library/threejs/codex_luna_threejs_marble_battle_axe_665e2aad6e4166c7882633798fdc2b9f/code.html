<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marble Battle Axe</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111318; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111318);
scene.fog = new THREE.Fog(0x111318, 8, 16);

const camera = new THREE.PerspectiveCamera(33, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.3, 2.7, 7.8);
camera.lookAt(0, 0.55, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 4.5;
controls.maxDistance = 11;
controls.target.set(0, 0.45, 0);

const hemi = new THREE.HemisphereLight(0xbac5d6, 0x17151a, 2.0);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2dc, 4.6);
key.position.set(-4.5, 7.5, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0003;
scene.add(key);

const rim = new THREE.DirectionalLight(0x819ed0, 2.2);
rim.position.set(5, 3, -5);
scene.add(rim);

function marbleMaterial(base = 0x8e9298, dark = 0x353a42) {
  const material = new THREE.MeshStandardMaterial({
    color: base,
    roughness: 0.27,
    metalness: 0.08
  });

  material.onBeforeCompile = shader => {
    shader.vertexShader = shader.vertexShader.replace(
      "#include <common>",
      "varying vec3 vWorldPosition;\n#include <common>"
    );
    shader.vertexShader = shader.vertexShader.replace(
      "#include <worldpos_vertex>",
      "#include <worldpos_vertex>\n vWorldPosition = worldPosition.xyz;"
    );

    shader.fragmentShader = shader.fragmentShader.replace(
      "#include <common>",
      `
      varying vec3 vWorldPosition;

      float hash21(vec2 p) {
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }

      float noise21(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        float a = hash21(i);
        float b = hash21(i + vec2(1.0, 0.0));
        float c = hash21(i + vec2(0.0, 1.0));
        float d = hash21(i + vec2(1.0, 1.0));
        return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
      }

      float marbleVein(vec3 p) {
        vec2 q = p.xy * 2.2 + vec2(p.z * 1.4, p.x * 0.65);
        float n = noise21(q * 1.35) * 0.55 + noise21(q * 3.1) * 0.3 + noise21(q * 7.0) * 0.15;
        float waves = sin(q.x * 2.7 + sin(q.y * 1.7) * 2.0 + n * 4.0);
        return smoothstep(0.64, 0.92, abs(waves));
      }
      #include <common>
      `
    );

    shader.fragmentShader = shader.fragmentShader.replace(
      "#include <map_fragment>",
      `
      #include <map_fragment>
      float vein = marbleVein(vWorldPosition);
      vec3 veinColor = vec3(0.16, 0.18, 0.21);
      diffuseColor.rgb = mix(diffuseColor.rgb, veinColor, vein * 0.46);
      `
    );
  };
  material.customProgramCacheKey = () => "marble-polished-v2-" + base + "-" + dark;
  return material;
}

const stone = marbleMaterial(0x9ca0a5, 0x353a42);
const lightStone = marbleMaterial(0xb5b7ba, 0x45484e);
const darkStone = marbleMaterial(0x777c83, 0x282c32);

const axe = new THREE.Group();
axe.position.y = 0.1;
scene.add(axe);

function add(mesh, parent = axe) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

const haft = add(new THREE.Mesh(
  new THREE.CylinderGeometry(0.18, 0.27, 4.7, 18, 6),
  stone
));
haft.position.y = -0.25;

const pommel = add(new THREE.Mesh(
  new THREE.SphereGeometry(0.34, 20, 12),
  stone
));
pommel.scale.set(0.9, 1.18, 0.9);
pommel.position.y = -2.67;

const pommelCap = add(new THREE.Mesh(
  new THREE.CylinderGeometry(0.24, 0.29, 0.24, 18),
  lightStone
));
pommelCap.position.y = -2.94;

for (const y of [-2.28, 1.74]) {
  const collar = add(new THREE.Mesh(
    new THREE.TorusGeometry(y < 0 ? 0.245 : 0.285, 0.065, 10, 24),
    lightStone
  ));
  collar.rotation.x = Math.PI / 2;
  collar.position.y = y;
}

const grip = add(new THREE.Mesh(
  new THREE.CylinderGeometry(0.235, 0.235, 2.05, 18, 1),
  darkStone
));
grip.position.y = -0.62;

function helix(radius, y0, y1, turns, phase) {
  const points = [];
  const count = 96;
  for (let i = 0; i <= count; i++) {
    const t = i / count;
    const a = phase + t * turns * Math.PI * 2;
    points.push(new THREE.Vector3(
      Math.cos(a) * radius,
      y0 + (y1 - y0) * t,
      Math.sin(a) * radius
    ));
  }
  const curve = new THREE.CatmullRomCurve3(points);
  return add(new THREE.Mesh(
    new THREE.TubeGeometry(curve, 96, 0.037, 8, false),
    lightStone
  ));
}
helix(0.255, -1.55, 0.35, 2.0, 0);
helix(0.255, -1.55, 0.35, 2.0, Math.PI);

function bladeShape() {
  const s = new THREE.Shape();
  s.moveTo(0.14, 0.76);
  s.lineTo(0.67, 0.84);
  s.quadraticCurveTo(1.48, 0.9, 2.04, 0.48);
  s.quadraticCurveTo(2.48, 0.15, 2.42, -0.18);
  s.quadraticCurveTo(2.33, -0.68, 1.78, -0.91);
  s.quadraticCurveTo(1.17, -1.15, 0.66, -0.86);
  s.quadraticCurveTo(0.36, -0.69, 0.1, -0.43);
  s.lineTo(0.48, -0.17);
  s.quadraticCurveTo(0.92, -0.42, 1.38, -0.28);
  s.quadraticCurveTo(1.73, -0.18, 1.91, 0.05);
  s.quadraticCurveTo(1.72, 0.31, 1.35, 0.41);
  s.quadraticCurveTo(0.84, 0.55, 0.31, 0.39);
  s.closePath();
  return s;
}

function makeBlade(side) {
  const geometry = new THREE.ExtrudeGeometry(bladeShape(), {
    depth: 0.42,
    bevelEnabled: true,
    bevelSegments: 4,
    steps: 2,
    bevelSize: 0.095,
    bevelThickness: 0.075,
    curveSegments: 16
  });
  geometry.translate(0, 0, -0.21);
  const mesh = add(new THREE.Mesh(geometry, stone));
  mesh.position.set(side * 0.02, 1.82, 0);
  mesh.scale.x = side;
  return mesh;
}
makeBlade(1);
makeBlade(-1);

function reliefLoop(side, y, scale, z = 0.235) {
  const pts = [];
  for (let i = 0; i <= 48; i++) {
    const t = i / 48;
    const a = t * Math.PI * 2;
    const x = side * (0.91 + Math.cos(a) * 0.42 * scale);
    const yy = y + Math.sin(a) * 0.26 * scale;
    pts.push(new THREE.Vector3(x, yy, z));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  return add(new THREE.Mesh(
    new THREE.TubeGeometry(curve, 48, 0.027, 7, true),
    lightStone
  ));
}

reliefLoop(1, 1.84, 1.0);
reliefLoop(-1, 1.84, 1.0);

function reliefCross(side) {
  const p1 = new THREE.CatmullRomCurve3([
    new THREE.Vector3(side * 0.55, 1.35, 0.235),
    new THREE.Vector3(side * 0.96, 1.63, 0.25),
    new THREE.Vector3(side * 1.32, 1.46, 0.235)
  ]);
  const p2 = new THREE.CatmullRomCurve3([
    new THREE.Vector3(side * 0.55, 2.27, 0.235),
    new THREE.Vector3(side * 0.97, 2.02, 0.25),
    new THREE.Vector3(side * 1.35, 2.19, 0.235)
  ]);
  for (const curve of [p1, p2]) {
    add(new THREE.Mesh(new THREE.TubeGeometry(curve, 32, 0.031, 7, false), lightStone));
  }
}
reliefCross(1);
reliefCross(-1);

const headSocket = add(new THREE.Mesh(
  new THREE.CylinderGeometry(0.36, 0.31, 0.52, 18),
  darkStone
));
headSocket.rotation.z = Math.PI / 2;
headSocket.position.set(0, 1.82, 0);

const socketBand = add(new THREE.Mesh(
  new THREE.TorusGeometry(0.34, 0.055, 10, 24),
  lightStone
));
socketBand.rotation.y = Math.PI / 2;
socketBand.position.set(0, 1.82, 0);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(5.5, 96),
  new THREE.MeshStandardMaterial({ color: 0x191b20, roughness: 0.82, metalness: 0.05 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -3.08;
floor.receiveShadow = true;
scene.add(floor);

const halo = new THREE.Mesh(
  new THREE.RingGeometry(1.2, 4.1, 96),
  new THREE.MeshBasicMaterial({ color: 0x272b34, transparent: true, opacity: 0.24, side: THREE.DoubleSide })
);
halo.rotation.x = -Math.PI / 2;
halo.position.y = -3.065;
scene.add(halo);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  axe.position.y = 0.1 + Math.sin(t * 1.15) * 0.018;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
