<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miniature Japanese Garden</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(circle at 50% 28%, #edf1e8 0%, #c8cec4 58%, #a9b0a8 100%);
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(40, 45, 40, 0.72);
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Miniature Japanese Garden · dimensions in cm</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd8ddd4);
    scene.fog = new THREE.Fog(0xd8ddd4, 390, 720);

    const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 1, 1000);
    camera.position.set(245, 205, 280);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 20, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.42;
    controls.minDistance = 225;
    controls.maxDistance = 580;
    controls.maxPolarAngle = Math.PI * 0.47;

    const hemi = new THREE.HemisphereLight(0xf5f7ee, 0x68695f, 2.1);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff3d5, 3.0);
    sun.position.set(-170, 260, 160);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -210;
    sun.shadow.camera.right = 210;
    sun.shadow.camera.top = 190;
    sun.shadow.camera.bottom = -190;
    sun.shadow.camera.near = 40;
    sun.shadow.camera.far = 600;
    sun.shadow.bias = -0.00035;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xb9d1d4, 0.65);
    fill.position.set(180, 120, -200);
    scene.add(fill);

    const materials = {
      base: new THREE.MeshStandardMaterial({ color: 0x3d3a32, roughness: 0.8 }),
      soil: new THREE.MeshStandardMaterial({ color: 0x564b35, roughness: 1 }),
      moss: new THREE.MeshStandardMaterial({ color: 0x53633c, roughness: 0.98 }),
      mossLight: new THREE.MeshStandardMaterial({ color: 0x718052, roughness: 0.95 }),
      stone: new THREE.MeshStandardMaterial({ color: 0x87877d, roughness: 0.92 }),
      stoneLight: new THREE.MeshStandardMaterial({ color: 0xa3a297, roughness: 0.9 }),
      stoneDark: new THREE.MeshStandardMaterial({ color: 0x575950, roughness: 0.98 }),
      sand: new THREE.MeshStandardMaterial({ color: 0xb8ad8d, roughness: 1 }),
      water: new THREE.MeshPhysicalMaterial({
        color: 0x426f70,
        roughness: 0.22,
        metalness: 0,
        transmission: 0.18,
        transparent: true,
        opacity: 0.83,
        clearcoat: 0.9,
        clearcoatRoughness: 0.15,
        side: THREE.DoubleSide
      }),
      darkWater: new THREE.MeshStandardMaterial({ color: 0x263f3d, roughness: 0.8 }),
      wood: new THREE.MeshStandardMaterial({ color: 0x4b3928, roughness: 0.9 }),
      black: new THREE.MeshStandardMaterial({ color: 0x171a16, roughness: 1 })
    };

    function roundedRectShape(width, depth, radius) {
      const x = -width / 2;
      const y = -depth / 2;
      const shape = new THREE.Shape();
      shape.moveTo(x + radius, y);
      shape.lineTo(x + width - radius, y);
      shape.quadraticCurveTo(x + width, y, x + width, y + radius);
      shape.lineTo(x + width, y + depth - radius);
      shape.quadraticCurveTo(x + width, y + depth, x + width - radius, y + depth);
      shape.lineTo(x + radius, y + depth);
      shape.quadraticCurveTo(x, y + depth, x, y + depth - radius);
      shape.lineTo(x, y + radius);
      shape.quadraticCurveTo(x, y, x + radius, y);
      return shape;
    }

    function extrudedHorizontal(shape, depth, material, bevelSize = 0, bevelSegments = 1) {
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth,
        bevelEnabled: bevelSize > 0,
        bevelSize,
        bevelThickness: bevelSize,
        bevelSegments,
        curveSegments: 48
      });
      geometry.rotateX(-Math.PI / 2);
      geometry.computeVertexNormals();
      const mesh = new THREE.Mesh(geometry, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    const garden = new THREE.Group();
    scene.add(garden);

    const base = extrudedHorizontal(roundedRectShape(260, 184, 12), 10, materials.base, 2.5, 4);
    base.position.y = 0;
    garden.add(base);

    const ground = extrudedHorizontal(roundedRectShape(250, 174, 9), 5, materials.soil, 2, 3);
    ground.position.y = 9;
    garden.add(ground);

    const sandBed = extrudedHorizontal(roundedRectShape(238, 162, 8), 1.8, materials.sand, 1, 2);
    sandBed.position.y = 13.7;
    garden.add(sandBed);

    const pondGroup = new THREE.Group();
    pondGroup.position.set(-54, 0, 10);
    pondGroup.rotation.y = -0.16;
    garden.add(pondGroup);

    const pondOuter = new THREE.Shape();
    pondOuter.absellipse(0, 0, 70, 50, 0, Math.PI * 2, false, 0);
    const pondHole = new THREE.Path();
    pondHole.absellipse(0, 0, 61.5, 41.5, 0, Math.PI * 2, true, 0);
    pondOuter.holes.push(pondHole);

    const coping = extrudedHorizontal(pondOuter, 4.2, materials.stone, 0.8, 3);
    coping.position.y = 14.6;
    pondGroup.add(coping);

    const basinGeometry = new THREE.CircleGeometry(1, 96);
    basinGeometry.rotateX(-Math.PI / 2);
    const basin = new THREE.Mesh(basinGeometry, materials.darkWater);
    basin.scale.set(61.2, 1, 41.2);
    basin.position.y = 14.8;
    basin.receiveShadow = true;
    pondGroup.add(basin);

    const waterGeometry = new THREE.CircleGeometry(1, 96);
    waterGeometry.rotateX(-Math.PI / 2);
    const water = new THREE.Mesh(waterGeometry, materials.water);
    water.scale.set(60.5, 1, 40.5);
    water.position.y = 15.45;
    water.receiveShadow = true;
    pondGroup.add(water);

    const rippleMaterial = new THREE.MeshBasicMaterial({
      color: 0xb9d4cf,
      transparent: true,
      opacity: 0.24,
      side: THREE.DoubleSide
    });

    for (const ripple of [
      [-18, -8, 9],
      [18, 9, 7],
      [3, -19, 5]
    ]) {
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(ripple[2] * 0.78, ripple[2], 48),
        rippleMaterial
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(ripple[0], 15.62, ripple[1]);
      pondGroup.add(ring);
    }

    function makeStone(x, z, sx, sz, height, rotation, material = materials.stoneLight) {
      const geometry = new THREE.CylinderGeometry(1, 1.07, height, 10, 1, false);
      const stone = new THREE.Mesh(geometry, material);
      stone.position.set(x, 15.3 + height / 2, z);
      stone.scale.set(sx, 1, sz);
      stone.rotation.y = rotation;
      stone.castShadow = true;
      stone.receiveShadow = true;
      garden.add(stone);
      return stone;
    }

    const steppingData = [
      [101, 63, 13, 9, 3.5, 0.20],
      [82, 48, 14, 9, 3.2, -0.28],
      [68, 27, 12, 10, 3.0, 0.38],
      [58, 4, 14, 9, 3.4, -0.15],
      [49, -20, 12, 9, 3.0, 0.30],
      [35, -42, 14, 10, 3.6, -0.24],
      [15, -59, 13, 9, 3.1, 0.18],
      [-9, -68, 15, 9, 3.3, -0.12]
    ];
    steppingData.forEach(v => makeStone(...v));

    function makeMound(x, z, radius, scaleX, scaleY, scaleZ, material) {
      const geometry = new THREE.SphereGeometry(radius, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2);
      const mound = new THREE.Mesh(geometry, material);
      mound.position.set(x, 15.25, z);
      mound.scale.set(scaleX, scaleY, scaleZ);
      mound.rotation.y = x * 0.013;
      mound.castShadow = true;
      mound.receiveShadow = true;
      garden.add(mound);
      return mound;
    }

    makeMound(76, -56, 28, 1.35, 0.58, 0.9, materials.moss);
    makeMound(102, -32, 21, 1.05, 0.68, 1.15, materials.mossLight);
    makeMound(90, 7, 18, 1.2, 0.62, 0.9, materials.moss);
    makeMound(-95, -53, 20, 1.45, 0.48, 0.9, materials.mossLight);

    function addRock(x, z, sx, sy, sz, rotation = 0) {
      const geometry = new THREE.DodecahedronGeometry(9, 1);
      const rock = new THREE.Mesh(geometry, materials.stoneDark);
      rock.position.set(x, 17 + sy * 3.3, z);
      rock.scale.set(sx, sy, sz);
      rock.rotation.set(-0.1, rotation, 0.12);
      rock.castShadow = true;
      rock.receiveShadow = true;
      garden.add(rock);
    }

    addRock(-102, 53, 1.45, 1.05, 0.85, 0.4);
    addRock(-87, 64, 0.85, 0.72, 1.0, -0.3);
    addRock(-111, 38, 0.65, 0.55, 0.8, 0.8);
    addRock(113, -60, 0.75, 0.6, 0.95, -0.2);

    function addRakedArc(cx, cz, innerRadius, count, startAngle, endAngle) {
      for (let i = 0; i < count; i++) {
        const radius = innerRadius + i * 3.2;
        const curve = new THREE.EllipseCurve(cx, cz, radius, radius * 0.72, startAngle, endAngle, false, 0);
        const points2 = curve.getPoints(80);
        const points3 = points2.map(p => new THREE.Vector3(p.x, 15.72, p.y));
        const geometry = new THREE.BufferGeometry().setFromPoints(points3);
        const line = new THREE.Line(
          geometry,
          new THREE.LineBasicMaterial({ color: 0x897f66, transparent: true, opacity: 0.45 })
        );
        garden.add(line);
      }
    }

    addRakedArc(93, 45, 18, 5, Math.PI * 0.86, Math.PI * 1.72);
    addRakedArc(-103, 49, 15, 4, -0.55, 1.15);

    function meshBox(width, height, depth, material, x, y, z) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    const lantern = new THREE.Group();
    lantern.position.set(88, 15.5, 48);
    lantern.rotation.y = -0.28;
    garden.add(lantern);

    const foot = meshBox(32, 5, 32, materials.stoneDark, 0, 2.5, 0);
    foot.geometry.translate(0, 0, 0);
    lantern.add(foot);

    const lowerBase = new THREE.Mesh(new THREE.CylinderGeometry(14, 16, 7, 8), materials.stone);
    lowerBase.position.y = 8.5;
    lowerBase.castShadow = true;
    lowerBase.receiveShadow = true;
    lantern.add(lowerBase);

    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(7.2, 9.2, 31, 8), materials.stoneLight);
    shaft.position.y = 27.5;
    shaft.castShadow = true;
    shaft.receiveShadow = true;
    lantern.add(shaft);

    lantern.add(meshBox(28, 5, 28, materials.stoneDark, 0, 45.5, 0));
    lantern.add(meshBox(22, 19, 22, materials.stone, 0, 57.5, 0));

    const windowMaterial = new THREE.MeshStandardMaterial({
      color: 0x191b17,
      roughness: 1,
      emissive: 0x5c391b,
      emissiveIntensity: 0.22
    });

    const frontWindow = meshBox(10, 10, 0.7, windowMaterial, 0, 58, 11.15);
    const backWindow = meshBox(10, 10, 0.7, windowMaterial, 0, 58, -11.15);
    const leftWindow = meshBox(0.7, 10, 10, windowMaterial, -11.15, 58, 0);
    const rightWindow = meshBox(0.7, 10, 10, windowMaterial, 11.15, 58, 0);
    lantern.add(frontWindow, backWindow, leftWindow, rightWindow);

    const roof = new THREE.Mesh(new THREE.CylinderGeometry(9, 25, 10, 8), materials.stoneDark);
    roof.position.y = 72;
    roof.castShadow = true;
    roof.receiveShadow = true;
    lantern.add(roof);

    const cap = new THREE.Mesh(new THREE.SphereGeometry(5, 16, 10), materials.stone);
    cap.scale.y = 0.72;
    cap.position.y = 79;
    cap.castShadow = true;
    lantern.add(cap);

    const finial = new THREE.Mesh(new THREE.CylinderGeometry(2, 3.8, 8, 8), materials.stoneDark);
    finial.position.y = 84;
    finial.castShadow = true;
    lantern.add(finial);

    function addGrassClump(x, z, scale = 1) {
      const group = new THREE.Group();
      group.position.set(x, 15.2, z);
      const grassMaterial = new THREE.MeshStandardMaterial({
        color: 0x455b38,
        roughness: 1,
        side: THREE.DoubleSide
      });
      for (let i = 0; i < 11; i++) {
        const angle = i * 2.399;
        const length = (10 + (i % 4) * 2.4) * scale;
        const blade = new THREE.Mesh(new THREE.PlaneGeometry(1.25 * scale, length), grassMaterial);
        blade.position.set(Math.cos(angle) * 2.5 * scale, length * 0.46, Math.sin(angle) * 2.5 * scale);
        blade.rotation.order = 'YXZ';
        blade.rotation.y = -angle;
        blade.rotation.x = 0.15 + (i % 3) * 0.07;
        blade.castShadow = true;
        group.add(blade);
      }
      garden.add(group);
    }

    addGrassClump(-104, -28, 1.0);
    addGrassClump(-91, -18, 0.72);
    addGrassClump(112, 17, 0.85);
    addGrassClump(105, 29, 0.6);

    function addBambooFence() {
      const fence = new THREE.Group();
      fence.position.set(-6, 15, -76);
      const poleMaterial = new THREE.MeshStandardMaterial({ color: 0x755f39, roughness: 0.95 });
      for (let i = 0; i < 10; i++) {
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.7, 25 + (i % 3) * 2, 8), poleMaterial);
        pole.position.set(-47 + i * 10.5, 12.5, 0);
        pole.castShadow = true;
        fence.add(pole);
      }
      for (const y of [7, 18]) {
        const rail = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 101, 8), materials.wood);
        rail.rotation.z = Math.PI / 2;
        rail.position.set(0, y, 0.7);
        rail.castShadow = true;
        fence.add(rail);
      }
      garden.add(fence);
    }

    addBambooFence();

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(430, 96),
      new THREE.MeshStandardMaterial({ color: 0xb7bdb4, roughness: 1 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -3;
    floor.receiveShadow = true;
    scene.add(floor);

    const shadowDisc = new THREE.Mesh(
      new THREE.CircleGeometry(180, 64),
      new THREE.MeshBasicMaterial({ color: 0x687068, transparent: true, opacity: 0.12, depthWrite: false })
    );
    shadowDisc.rotation.x = -Math.PI / 2;
    shadowDisc.scale.set(1.3, 0.9, 1);
    shadowDisc.position.y = -2.7;
    scene.add(shadowDisc);

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();
      water.material.opacity = 0.81 + Math.sin(time * 0.65) * 0.025;
      rippleMaterial.opacity = 0.19 + Math.sin(time * 0.85) * 0.045;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
