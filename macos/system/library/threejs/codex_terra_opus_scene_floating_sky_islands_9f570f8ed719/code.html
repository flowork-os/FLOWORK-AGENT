<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  html,body{margin:0;overflow:hidden;background:#a7dcf3}
  canvas{display:block}
  #title{position:fixed;left:22px;bottom:18px;color:#fff;font:600 13px/1.3 system-ui,sans-serif;letter-spacing:.16em;text-shadow:0 2px 8px #416b80;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="title">THE SKYWARD ISLES</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bd9f2);
scene.fog = new THREE.FogExp2(0x9bd9f2, 0.012);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 250);
camera.position.set(20, 14, 26);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.34;
controls.minDistance = 10;
controls.maxDistance = 56;
controls.maxPolarAngle = Math.PI * 0.49;

const hemi = new THREE.HemisphereLight(0xd9f4ff, 0x56614b, 2.2);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff0c1, 3.7);
sun.position.set(-18, 25, 13);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -28;
sun.shadow.camera.right = 28;
sun.shadow.camera.top = 28;
sun.shadow.camera.bottom = -28;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 70;
sun.shadow.bias = -0.0007;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xa9dcff, 1.1);
fill.position.set(16, 8, -18);
scene.add(fill);

const rng = (() => {
  let s = 248729;
  return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
})();
const range = (a, b) => a + (b - a) * rng();
const pick = a => a[Math.floor(rng() * a.length)];
const groups = [];
const waterfalls = [];
const clouds = [];
const birds = [];
const mills = [];
const bobbers = [];

const mat = (color, roughness = 0.8, metalness = 0) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness, flatShading: true });

const rockMats = [
  mat(0x705b4d), mat(0x806a58), mat(0x5e514b), mat(0x927763), mat(0x66564e)
];
const grassMat = mat(0x5d9e4c);
const grassSideMat = mat(0x4d8841);
const dirtMat = mat(0x8b6344);
const woodMat = mat(0x704227);
const darkWoodMat = mat(0x45281e);
const ropeMat = mat(0x9a7041);
const waterMat = new THREE.MeshStandardMaterial({
  color: 0x64cff2, transparent: true, opacity: 0.72,
  roughness: 0.15, metalness: 0.05, emissive: 0x0b4560, emissiveIntensity: 0.16,
  side: THREE.DoubleSide
});
const foamMat = new THREE.MeshBasicMaterial({
  color: 0xd8f8ff, transparent: true, opacity: 0.74, side: THREE.DoubleSide
});
const leafMat = mat(0x4e9a47);
const leafLightMat = mat(0x77ba55);
const redMat = mat(0xb94a38);
const creamMat = mat(0xffd89a);
const windowMat = new THREE.MeshStandardMaterial({
  color: 0xffd47a, emissive: 0xf09b34, emissiveIntensity: 0.8, roughness: 0.45
});

function shadow(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function cylinderBetween(a, b, radius, material, radial = 8) {
  const d = new THREE.Vector3().subVectors(b, a);
  const mesh = shadow(new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, d.length(), radial), material));
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  return mesh;
}

function makeRock(position, scale, material = pick(rockMats), detail = 1) {
  const geo = new THREE.IcosahedronGeometry(1, detail);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const n = 0.75 + rng() * 0.45;
    p.setXYZ(i, x * n * (0.85 + .2 * rng()), y * n, z * n * (0.85 + .2 * rng()));
  }
  geo.computeVertexNormals();
  const mesh = shadow(new THREE.Mesh(geo, material));
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.rotation.set(range(0, Math.PI), range(0, Math.PI), range(0, Math.PI));
  return mesh;
}

function createIsland(x, y, z, radius, depth, seedOffset = 0) {
  const island = new THREE.Group();
  island.position.set(x, y, z);
  scene.add(island);
  groups.push(island);

  const sides = 12;
  const verts = [];
  const indices = [];
  const topR = radius;
  for (let ring = 0; ring < 4; ring++) {
    const t = ring / 3;
    const yy = -depth * t;
    const rr = topR * (1 - t * 0.78);
    for (let i = 0; i < sides; i++) {
      const a = i / sides * Math.PI * 2;
      const jitter = 0.84 + ((Math.sin(i * 17 + seedOffset) + 1) * .07);
      verts.push(Math.cos(a) * rr * jitter, yy, Math.sin(a) * rr * jitter);
    }
  }
  verts.push(0, -depth * 1.13, 0);
  for (let ring = 0; ring < 3; ring++) {
    for (let i = 0; i < sides; i++) {
      const ni = (i + 1) % sides;
      const a = ring * sides + i, b = ring * sides + ni;
      const c = (ring + 1) * sides + i, d = (ring + 1) * sides + ni;
      indices.push(a, c, b, b, c, d);
    }
  }
  const point = sides * 4;
  for (let i = 0; i < sides; i++) indices.push(sides * 3 + i, point, sides * 3 + (i + 1) % sides);

  const rockGeo = new THREE.BufferGeometry();
  rockGeo.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
  rockGeo.setIndex(indices);
  rockGeo.computeVertexNormals();
  const underside = shadow(new THREE.Mesh(rockGeo, rockMats[seedOffset % rockMats.length]));
  island.add(underside);

  const grass = shadow(new THREE.Mesh(
    new THREE.CylinderGeometry(radius * .92, radius * .86, .34, sides, 1, false),
    grassMat
  ));
  grass.position.y = .06;
  grass.rotation.y = seedOffset;
  island.add(grass);

  const soil = shadow(new THREE.Mesh(
    new THREE.CylinderGeometry(radius * .89, radius * .92, .14, sides, 1),
    dirtMat
  ));
  soil.position.y = -.17;
  island.add(soil);

  for (let i = 0; i < Math.floor(radius * 3.5); i++) {
    const a = rng() * Math.PI * 2, r = Math.sqrt(rng()) * radius * .82;
    const stone = makeRock(
      new THREE.Vector3(Math.cos(a) * r, -.35 - rng() * depth * .65, Math.sin(a) * r),
      new THREE.Vector3(range(.12,.42), range(.12,.48), range(.12,.42)),
      pick(rockMats), 0
    );
    island.add(stone);
  }

  for (let i = 0; i < Math.floor(radius * 10); i++) {
    const a = rng() * Math.PI * 2, r = Math.sqrt(rng()) * radius * .88;
    const blade = shadow(new THREE.Mesh(
      new THREE.ConeGeometry(.025, range(.12,.27), 4), pick([grassMat, grassSideMat, leafLightMat])
    ));
    blade.position.set(Math.cos(a) * r, .24, Math.sin(a) * r);
    blade.rotation.z = range(-.25,.25);
    island.add(blade);
  }
  return island;
}

function addTree(parent, x, z, scale = 1) {
  const g = new THREE.Group();
  g.position.set(x, .22, z);
  parent.add(g);
  const trunk = shadow(new THREE.Mesh(new THREE.CylinderGeometry(.12*scale,.18*scale,1.2*scale,7), woodMat));
  trunk.position.y = .58 * scale;
  trunk.rotation.z = range(-.1,.1);
  g.add(trunk);
  for (let i = 0; i < 5; i++) {
    const crown = shadow(new THREE.Mesh(new THREE.IcosahedronGeometry(range(.38,.58)*scale, 1), i % 2 ? leafMat : leafLightMat));
    crown.position.set(range(-.34,.34)*scale, (1.15 + rng()*.55)*scale, range(-.3,.3)*scale);
    crown.scale.y = .88;
    g.add(crown);
  }
  return g;
}

function addWaterfall(parent, x, z, height, width, angle = 0) {
  const g = new THREE.Group();
  g.position.set(x, -.02, z);
  g.rotation.y = angle;
  parent.add(g);
  const strip = new THREE.Mesh(new THREE.PlaneGeometry(width, height, 1, 9), waterMat);
  strip.position.set(0, -height / 2, .05);
  for (let i = 0; i < 10; i++) {
    const p = strip.geometry.attributes.position;
    p.setX(i, p.getX(i) + Math.sin(i * 1.7) * .025);
  }
  g.add(strip);
  const lip = shadow(new THREE.Mesh(new THREE.CylinderGeometry(width*.54,width*.54,.08,8), foamMat));
  lip.rotation.x = Math.PI/2;
  lip.position.y = -.08;
  g.add(lip);
  const spray = new THREE.Group();
  spray.position.y = -height;
  g.add(spray);
  for (let i = 0; i < 13; i++) {
    const puff = new THREE.Mesh(new THREE.SphereGeometry(range(.06,.18), 6, 5), foamMat);
    puff.position.set(range(-width*.7,width*.7), range(-.08,.18), range(-.16,.16));
    spray.add(puff);
  }
  waterfalls.push({ strip, spray, phase: rng()*Math.PI*2, height });
  return g;
}

function addCottage(parent, x, z) {
  const cottage = new THREE.Group();
  cottage.position.set(x, .24, z);
  cottage.rotation.y = -.3;
  parent.add(cottage);

  const base = shadow(new THREE.Mesh(new THREE.BoxGeometry(2.25, 1.55, 1.72), creamMat));
  base.position.y = .78;
  cottage.add(base);

  const beams = [
    [-.92,.78,-.88,.09,1.63,.1], [.92,.78,-.88,.09,1.63,.1],
    [0,.1,-.89,2.05,.1,.11], [0,1.43,-.89,2.05,.1,.11]
  ];
  beams.forEach(v => {
    const m = shadow(new THREE.Mesh(new THREE.BoxGeometry(v[3],v[4],v[5]), darkWoodMat));
    m.position.set(v[0],v[1],v[2]);
    cottage.add(m);
  });

  const roof = shadow(new THREE.Mesh(new THREE.ConeGeometry(1.75, 1.45, 4), redMat));
  roof.position.y = 2.24;
  roof.rotation.y = Math.PI/4;
  roof.scale.z = .72;
  cottage.add(roof);

  const door = shadow(new THREE.Mesh(new THREE.BoxGeometry(.46,.86,.07), darkWoodMat));
  door.position.set(-.45,.53,-.9);
  cottage.add(door);

  const win = new THREE.Mesh(new THREE.BoxGeometry(.45,.45,.07), windowMat);
  win.position.set(.48,.88,-.9);
  cottage.add(win);

  const chimney = shadow(new THREE.Mesh(new THREE.BoxGeometry(.32,.9,.32), rockMats[2]));
  chimney.position.set(.66,2.45,.3);
  cottage.add(chimney);

  const smoke = new THREE.Group();
  smoke.position.set(.66,2.93,.3);
  cottage.add(smoke);
  for(let i=0;i<5;i++){
    const s = new THREE.Mesh(new THREE.SphereGeometry(.14+i*.035,7,6), new THREE.MeshBasicMaterial({color:0xe4f4f5,transparent:true,opacity:.5}));
    s.position.set(range(-.1,.1),i*.29,range(-.1,.1));
    smoke.add(s);
  }
  bobbers.push({ object: smoke, baseY: smoke.position.y, phase: 2.1, amount:.08 });

  const mill = new THREE.Group();
  mill.position.set(1.38, 1.5, .15);
  cottage.add(mill);
  const mast = shadow(new THREE.Mesh(new THREE.CylinderGeometry(.09,.13,1.8,8), woodMat));
  mast.rotation.z = -.22;
  mast.position.y = .56;
  mill.add(mast);
  const hub = shadow(new THREE.Mesh(new THREE.SphereGeometry(.14,8,6), darkWoodMat));
  hub.position.set(-.18,1.2,0);
  mill.add(hub);
  const blades = new THREE.Group();
  blades.position.set(-.21,1.2,-.04);
  mill.add(blades);
  for(let i=0;i<4;i++){
    const blade = shadow(new THREE.Mesh(new THREE.BoxGeometry(.16,.82,.06), creamMat));
    blade.position.y = .43;
    blade.rotation.z = i*Math.PI/2 + .23;
    blades.add(blade);
  }
  mills.push(blades);
}

function addBridge(a, b, sag = 1.2) {
  const bridge = new THREE.Group();
  scene.add(bridge);
  const steps = 17;
  const planks = [];
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const p = new THREE.Vector3().lerpVectors(a,b,t);
    p.y -= Math.sin(t*Math.PI)*sag;
    planks.push(p);
    if(i < steps){
      const q = new THREE.Vector3().lerpVectors(a,b,(i+.75)/steps);
      q.y -= Math.sin(((i+.75)/steps)*Math.PI)*sag;
      const board = shadow(new THREE.Mesh(new THREE.BoxGeometry(.64,.12,.37), woodMat));
      board.position.copy(p).lerp(q,.5);
      board.lookAt(q);
      board.rotateX(Math.PI/2);
      bridge.add(board);
    }
  }
  for (const side of [-.34,.34]) {
    const rail = [];
    for (let i=0;i<=steps;i++){
      const p = planks[i].clone();
      const tangent = i<steps ? planks[i+1].clone().sub(planks[i]) : planks[i].clone().sub(planks[i-1]);
      const sideways = new THREE.Vector3(-tangent.z,0,tangent.x).normalize().multiplyScalar(side);
      p.add(sideways); p.y += .62;
      rail.push(p);
      if(i%3===0) bridge.add(cylinderBetween(planks[i].clone().add(sideways),p,.025,ropeMat,6));
    }
    for(let i=0;i<steps;i++) bridge.add(cylinderBetween(rail[i],rail[i+1],.027,ropeMat,6));
  }
}

function addAirship(parent, x, y, z) {
  const ship = new THREE.Group();
  ship.position.set(x,y,z);
  parent.add(ship);
  const balloon = shadow(new THREE.Mesh(new THREE.SphereGeometry(1.38,18,12), mat(0xd65d48)));
  balloon.scale.set(1.4,.88,.92);
  ship.add(balloon);
  const band = shadow(new THREE.Mesh(new THREE.TorusGeometry(1.18,.055,6,24), creamMat));
  band.rotation.y = Math.PI/2;
  band.scale.set(1.38,.88,1);
  ship.add(band);
  const gondola = shadow(new THREE.Mesh(new THREE.BoxGeometry(1.55,.36,.68), woodMat));
  gondola.position.y = -1.45;
  gondola.rotation.z = -.05;
  ship.add(gondola);
  [[-.8,-1.15,-.35],[-.8,-1.15,.35],[.8,-1.15,-.35],[.8,-1.15,.35]].forEach(v=>{
    ship.add(cylinderBetween(new THREE.Vector3(v[0]*.8,v[1],v[2]),new THREE.Vector3(v[0],-.35,v[2]),.025,ropeMat,6));
  });
  const prop = new THREE.Group();
  prop.position.set(-.91,-1.4,0);
  ship.add(prop);
  const axle = shadow(new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.25,7), darkWoodMat));
  axle.rotation.x = Math.PI/2;
  prop.add(axle);
  for(let i=0;i<3;i++){
    const blade = shadow(new THREE.Mesh(new THREE.BoxGeometry(.12,.72,.05), creamMat));
    blade.position.y=.3; blade.rotation.z=i*Math.PI*2/3;
    prop.add(blade);
  }
  mills.push(prop);
  bobbers.push({object:ship,baseY:y,phase:.4,amount:.22});
}

function addMooredPost(parent,x,z) {
  const post = shadow(new THREE.Mesh(new THREE.CylinderGeometry(.1,.14,2.5,8),darkWoodMat));
  post.position.set(x,1.37,z);
  parent.add(post);
  const cap = shadow(new THREE.Mesh(new THREE.SphereGeometry(.17,8,6),ropeMat));
  cap.position.y=1.25;
  post.add(cap);
  return post;
}

function createCloud(x,y,z,s) {
  const g = new THREE.Group();
  g.position.set(x,y,z);
  const cloudMat = new THREE.MeshStandardMaterial({color:0xf7fdff,roughness:1,transparent:true,opacity:.9});
  for(let i=0;i<9;i++){
    const m = new THREE.Mesh(new THREE.SphereGeometry(range(.45,.92),10,8),cloudMat);
    m.position.set(range(-1.4,1.4),range(-.22,.3),range(-.55,.55));
    m.scale.y=range(.55,.85);
    g.add(m);
  }
  g.scale.setScalar(s);
  scene.add(g);
  clouds.push({object:g,baseX:x,phase:rng()*6.28,speed:range(.04,.1)});
}

function createBirdOrbit(radius, y, speed, phase) {
  const g = new THREE.Group();
  scene.add(g);
  for(let j=0;j<5;j++){
    const bird = new THREE.Group();
    const left = new THREE.Mesh(new THREE.ConeGeometry(.12,.42,3),darkWoodMat);
    const right = new THREE.Mesh(new THREE.ConeGeometry(.12,.42,3),darkWoodMat);
    left.rotation.z=-Math.PI/2; right.rotation.z=Math.PI/2;
    left.position.x=-.18; right.position.x=.18;
    bird.add(left,right);
    bird.userData.wings=[left,right];
    g.add(bird);
  }
  birds.push({group:g,radius,y,speed,phase});
}

function addFloatingRocks() {
  for(let i=0;i<24;i++){
    const a=rng()*Math.PI*2, r=range(9,22);
    const rock=makeRock(
      new THREE.Vector3(Math.cos(a)*r,range(-5,8),Math.sin(a)*r),
      new THREE.Vector3(range(.18,.62),range(.22,.85),range(.18,.62)),
      pick(rockMats),0
    );
    scene.add(rock);
    bobbers.push({object:rock,baseY:rock.position.y,phase:rng()*6.28,amount:range(.04,.14),spin:range(-.35,.35)});
  }
}

const main = createIsland(0,3,0,5.5,5.8,1);
const west = createIsland(-9,5,-1,3.35,4.1,2);
const east = createIsland(8,4.2,-1.5,3.7,4.7,3);
const rear = createIsland(2.2,7.3,-8,2.75,3.4,4);
const small = createIsland(-4.2,8.3,-7,1.65,2.4,5);

addCottage(main,-.55,.4);
addTree(main,-3.4,-1.7,1.2);
addTree(main,-3.9,1.35,.8);
addTree(main,2.6,2.1,.9);
addTree(main,3.35,.9,.68);
addTree(west,-.7,.4,.9);
addTree(west,.9,-.7,.62);
addTree(east,.85,.65,1);
addTree(east,-1.25,-.35,.75);
addTree(rear,.15,.15,.85);
addTree(small,.1,.1,.58);

addWaterfall(main,4.35,-.65,5.8,.72,.65);
addWaterfall(east,-2.85,.15,4.4,.52,-.45);
addWaterfall(rear,1.75,.1,3.4,.42,.2);
addWaterfall(west,1.85,-.7,3.8,.45,-.7);

addBridge(
  new THREE.Vector3(-4.3,3.32,-.25),
  new THREE.Vector3(-6.0,5.25,-.65), .75
);
addBridge(
  new THREE.Vector3(4.2,3.35,-.8),
  new THREE.Vector3(5.15,4.4,-1.2), .65
);
addBridge(
  new THREE.Vector3(-1.6,3.35,-4.4),
  new THREE.Vector3(1.35,7.45,-5.9), 1.25
);

const post=addMooredPost(main,3.2,-2.65);
addAirship(main,5.4,4.4,-3.1);
const moor = cylinderBetween(
  new THREE.Vector3(3.2,2.58,-2.65),
  new THREE.Vector3(4.7,3.3,-3.0), .025, ropeMat, 6
);
main.add(moor);

for(let i=0;i<12;i++){
  const flower = new THREE.Group();
  const a=rng()*Math.PI*2,r=Math.sqrt(rng())*4.4;
  flower.position.set(Math.cos(a)*r,.3,Math.sin(a)*r);
  for(let q=0;q<5;q++){
    const petal=new THREE.Mesh(new THREE.SphereGeometry(.055,5,4),new THREE.MeshBasicMaterial({color:pick([0xffde6c,0xffffff,0xff8bb0])}));
    petal.position.set(Math.cos(q*1.256)*.07,.05,Math.sin(q*1.256)*.07);
    flower.add(petal);
  }
  main.add(flower);
}

addFloatingRocks();
createCloud(-15,11,-10,1.4);
createCloud(10,13,-14,1.75);
createCloud(-5,16,8,1.1);
createCloud(18,8,4,.95);
createCloud(-18,5,3,.8);
createBirdOrbit(7,-1.3,.19,.4);
createBirdOrbit(11,-3.3,-.13,2.1);

const skyDome = new THREE.Mesh(
  new THREE.SphereGeometry(120,32,18),
  new THREE.MeshBasicMaterial({color:0x9edcf5,side:THREE.BackSide,fog:false})
);
scene.add(skyDome);

const sunDisc = new THREE.Mesh(
  new THREE.CircleGeometry(3.2,32),
  new THREE.MeshBasicMaterial({color:0xfff6cc,transparent:true,opacity:.82,depthWrite:false})
);
sunDisc.position.set(-30,24,-50);
sunDisc.lookAt(camera.position);
scene.add(sunDisc);

const ambientMist = new THREE.Group();
scene.add(ambientMist);
for(let i=0;i<18;i++){
  const puff = new THREE.Mesh(
    new THREE.SphereGeometry(range(.5,1.6),10,7),
    new THREE.MeshBasicMaterial({color:0xe4f7fb,transparent:true,opacity:range(.06,.13),depthWrite:false})
  );
  const a=rng()*Math.PI*2,r=range(6,18);
  puff.position.set(Math.cos(a)*r,range(-4,1),Math.sin(a)*r);
  puff.scale.y=.35;
  ambientMist.add(puff);
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  waterfalls.forEach(w => {
    w.strip.material.opacity = .60 + Math.sin(t*2.3+w.phase)*.12;
    w.strip.position.x = Math.sin(t*1.7+w.phase)*.045;
    w.spray.rotation.y = t*.7+w.phase;
    w.spray.position.x = Math.sin(t*2+w.phase)*.08;
  });

  clouds.forEach(c => {
    c.object.position.x = c.baseX + Math.sin(t*c.speed+c.phase)*3.2;
    c.object.position.y += Math.sin(t*c.speed*1.7+c.phase)*.002;
  });

  birds.forEach(o => {
    const a=t*o.speed+o.phase;
    o.group.position.set(Math.cos(a)*o.radius,o.y+Math.sin(t*.8+o.phase)*.35,Math.sin(a)*o.radius);
    o.group.rotation.y=-a+Math.PI/2;
    o.group.children.forEach((b,i)=>{
      b.position.set(Math.cos(i*1.256)*.8,Math.sin(i*2.7)*.25,Math.sin(i*1.256)*.8);
      const flap=Math.sin(t*8+i)*.55;
      b.userData.wings[0].rotation.y=flap;
      b.userData.wings[1].rotation.y=-flap;
    });
  });

  mills.forEach((m,i) => m.rotation.z = t*(i%2 ? -2.4 : 1.8));
  bobbers.forEach(b => {
    b.object.position.y = b.baseY + Math.sin(t*1.1+b.phase)*b.amount;
    if(b.spin) b.object.rotation.y += b.spin*.003;
  });

  ambientMist.rotation.y=t*.008;
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
