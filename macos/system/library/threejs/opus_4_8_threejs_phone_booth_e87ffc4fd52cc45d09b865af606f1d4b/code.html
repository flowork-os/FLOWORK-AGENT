<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Classic Red Telephone Box — three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14151a; }
  #app { position: fixed; inset: 0; }
  #caption {
    position: fixed; left: 16px; bottom: 14px;
    font: 500 13px/1.4 ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial;
    color: rgba(235,235,240,0.55); letter-spacing: 0.04em; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  #caption b { color: rgba(235,235,240,0.8); font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<div id="caption"><b>K6 Telephone Box</b> — procedural three.js · drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ *
 *  Renderer
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.getElementById('app').appendChild(renderer.domElement);

/* ------------------------------------------------------------------ *
 *  Scene & camera
 * ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14151a);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.75, 1.75, 3.5);

// Procedural studio environment for glass/metal reflections
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ *
 *  Controls
 * ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.target.set(0, 1.15, 0);
controls.minDistance = 2.2;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.5 - 0.02;

/* ------------------------------------------------------------------ *
 *  Lighting  (hemisphere fill + key / fill / rim directionals)
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0x9fb4d0, 0x1a1a20, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3e3, 2.6);
key.position.set(3.6, 5.6, 3.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 22;
key.shadow.camera.left = -3;
key.shadow.camera.right = 3;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -1;
key.shadow.bias = -0.0002;
key.shadow.normalBias = 0.02;
key.target.position.set(0, 1.0, 0);
scene.add(key);
scene.add(key.target);

const fill = new THREE.DirectionalLight(0xbfd0ff, 0.55);
fill.position.set(-4.2, 2.6, 1.6);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.05);
rim.position.set(-2.6, 3.6, -4.6);
scene.add(rim);

// Warm interior glow so the booth reads as "occupied"
const interior = new THREE.PointLight(0xffcf94, 4.0, 4.0, 2.0);
interior.position.set(0, 1.55, -0.05);
scene.add(interior);

/* ------------------------------------------------------------------ *
 *  Ground plane (receives shadows only)
 * ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.38 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ *
 *  Materials
 * ------------------------------------------------------------------ */
const redMat = new THREE.MeshPhysicalMaterial({
  color: 0xb01a1a, roughness: 0.42, metalness: 0.25,
  clearcoat: 0.55, clearcoatRoughness: 0.35, envMapIntensity: 0.7
});
const redDark = new THREE.MeshPhysicalMaterial({
  color: 0x7c1212, roughness: 0.5, metalness: 0.25,
  clearcoat: 0.45, clearcoatRoughness: 0.4, envMapIntensity: 0.6
});
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xdfeaf0, roughness: 0.05, metalness: 0.0,
  transmission: 0.9, thickness: 0.08, ior: 1.5, transparent: true,
  clearcoat: 0.25, reflectivity: 0.45, envMapIntensity: 1.0, side: THREE.DoubleSide
});
const chromeMat = new THREE.MeshStandardMaterial({ color: 0xd8dade, metalness: 1.0, roughness: 0.24 });
const darkMat   = new THREE.MeshStandardMaterial({ color: 0x111114, metalness: 0.4, roughness: 0.6 });
const phoneMat  = new THREE.MeshStandardMaterial({ color: 0x0f0f12, metalness: 0.55, roughness: 0.45 });
const goldMat   = new THREE.MeshStandardMaterial({ color: 0xd9b25b, metalness: 0.9, roughness: 0.3 });
const concreteMat = new THREE.MeshStandardMaterial({ color: 0x3a3a40, metalness: 0.0, roughness: 0.92 });
const shelfMat  = new THREE.MeshStandardMaterial({ color: 0x2a1a12, roughness: 0.7, metalness: 0.05 });
const floorMat  = new THREE.MeshStandardMaterial({ color: 0x161318, roughness: 0.85, metalness: 0.1 });

// Illuminated "TELEPHONE" sign texture (canvas — fully procedural, no URLs)
function makeSignTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 220;
  const x = c.getContext('2d');
  x.fillStyle = '#f3eee1'; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = '#8a1414';
  x.font = 'bold 150px Georgia, "Times New Roman", serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  // manual letter spacing
  const txt = 'TELEPHONE';
  x.save();
  x.translate(c.width / 2, c.height / 2 + 6);
  const spacing = 6;
  let total = 0;
  for (const ch of txt) total += x.measureText(ch).width + spacing;
  let cx = -total / 2;
  x.textAlign = 'left';
  for (const ch of txt) {
    const w = x.measureText(ch).width;
    x.fillText(ch, cx, 0);
    cx += w + spacing;
  }
  x.restore();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
const signTex = makeSignTexture();
const signMat = new THREE.MeshStandardMaterial({
  map: signTex, emissive: 0xffffff, emissiveMap: signTex,
  emissiveIntensity: 0.7, roughness: 0.5, metalness: 0.0
});

/* ------------------------------------------------------------------ *
 *  Helpers
 * ------------------------------------------------------------------ */
function box(w, h, d, mat) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); }
function cyl(rt, rb, h, mat, seg = 20) { return new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); }

/* ------------------------------------------------------------------ *
 *  Dimensions (metres)
 * ------------------------------------------------------------------ */
const OW = 0.92;          // outer width/depth footprint
const OD = 0.92;
const POST = 0.09;        // corner pilaster cross-section
const BODY_B = 0.08;      // body bottom
const BODY_T = 2.10;      // body top
const CLEAR = OW - 2 * POST;   // clear span between posts (0.74)
const GLAZE_W = 0.72;

const booth = new THREE.Group();

/* ---------- glazed panel: glass sheet + red glazing bars ---------- */
function glazedFace(w, h, cols, rows) {
  const g = new THREE.Group();
  const glass = box(w, h, 0.015, glassMat);
  g.add(glass);
  const bar = 0.028, d = 0.035;
  for (let i = 0; i <= cols; i++) {
    const px = -w / 2 + (w / cols) * i;
    const m = box(bar, h + bar, d, redMat);
    m.position.set(px, 0, 0.006);
    g.add(m);
  }
  for (let j = 0; j <= rows; j++) {
    const py = -h / 2 + (h / rows) * j;
    const m = box(w + bar, bar, d, redMat);
    m.position.set(0, py, 0.006);
    g.add(m);
  }
  return g;
}

/* ---------- a fixed side wall (bottom panel + glazing + transom) --- */
function buildWall() {
  const g = new THREE.Group();
  // lower solid panel
  const panel = box(CLEAR, 0.37, 0.05, redMat);
  panel.position.set(0, 0.265, 0);
  g.add(panel);
  const inset = box(CLEAR - 0.13, 0.25, 0.052, redDark);
  inset.position.set(0, 0.27, 0);
  g.add(inset);
  // glazing (3 x 6 panes)
  const gl = glazedFace(GLAZE_W, 1.50, 3, 6);
  gl.position.set(0, 1.20, 0);
  g.add(gl);
  // top transom rail
  const tr = box(CLEAR, 0.15, 0.06, redMat);
  tr.position.set(0, 2.02, 0);
  g.add(tr);
  return g;
}

// Back wall
const back = buildWall();
back.position.set(0, 0, -0.43);
booth.add(back);
// Left wall
const left = buildWall();
left.rotation.y = Math.PI / 2;
left.position.set(-0.43, 0, 0);
booth.add(left);
// Right wall
const right = buildWall();
right.rotation.y = -Math.PI / 2;
right.position.set(0.43, 0, 0);
booth.add(right);

/* ---------- corner pilasters ---------- */
const postH = 2.06;
const postY = 1.10;
const px = OW / 2 - POST / 2;
for (const sx of [-1, 1]) {
  for (const sz of [-1, 1]) {
    const p = box(POST, postH, POST, redMat);
    p.position.set(sx * px, postY, sz * px);
    booth.add(p);
    // fluted highlight strip
    const fl = box(0.03, postH - 0.1, 0.03, redDark);
    fl.position.set(sx * px, postY, sz * px + (sz > 0 ? 0.031 : -0.031));
    booth.add(fl);
  }
}

/* ---------- front door frame: lintel between the front posts ---------- */
const lintel = box(CLEAR, 0.16, 0.07, redMat);
lintel.position.set(0, 2.02, 0.44);
booth.add(lintel);

/* ---------- hinged DOOR ---------- */
function buildDoor() {
  const g = new THREE.Group();       // hinge stile sits at local x = 0
  const off = 0.35;                  // door centred at x = 0.35 (width 0.70)
  const dW = 0.62;

  const panel = box(dW, 0.37, 0.05, redMat);
  panel.position.set(off, 0.265, 0);
  g.add(panel);
  const inset = box(dW - 0.13, 0.25, 0.052, redDark);
  inset.position.set(off, 0.27, 0);
  g.add(inset);

  const gl = glazedFace(dW - 0.02, 1.50, 2, 6);
  gl.position.set(off, 1.20, 0);
  g.add(gl);

  // door stiles & rails
  const ls = box(0.055, 1.98, 0.06, redMat); ls.position.set(0.0, 1.09, 0); g.add(ls);
  const rs = box(0.055, 1.98, 0.06, redMat); rs.position.set(0.70, 1.09, 0); g.add(rs);
  const topR = box(0.70, 0.06, 0.06, redMat); topR.position.set(off, 2.05, 0); g.add(topR);
  const botR = box(0.70, 0.06, 0.06, redMat); botR.position.set(off, 0.10, 0); g.add(botR);

  // chrome pull handle (opposite the hinge)
  const hx = 0.63;
  const grip = cyl(0.011, 0.011, 0.28, chromeMat, 14);
  grip.position.set(hx, 1.02, 0.075);
  g.add(grip);
  for (const dy of [0.13, -0.13]) {
    const stand = cyl(0.01, 0.01, 0.06, chromeMat, 12);
    stand.rotation.x = Math.PI / 2;
    stand.position.set(hx, 1.02 + dy, 0.05);
    g.add(stand);
  }
  return g;
}
const door = new THREE.Group();
door.add(buildDoor());
door.position.set(-0.37, 0, 0.45);   // hinge on the left front post
door.rotation.y = -0.42;             // ajar, swinging outward
booth.add(door);

/* ------------------------------------------------------------------ *
 *  Roof: cornice + illuminated sign band + shallow dome + crown
 * ------------------------------------------------------------------ */
// under-cornice molding
const molding = box(OW + 0.02, 0.04, OD + 0.02, redDark);
molding.position.y = 2.115;
booth.add(molding);
// cornice
const cornice = box(OW + 0.06, 0.09, OD + 0.06, redMat);
cornice.position.y = 2.145;
booth.add(cornice);

// sign band body
const bandH = 0.18;
const band = box(OW - 0.01, bandH, OD - 0.01, redMat);
band.position.y = 2.28;
booth.add(band);

// glowing "TELEPHONE" sign on all four faces
const signGeo = new THREE.PlaneGeometry(0.80, 0.15);
const bandFace = (OW - 0.01) / 2 + 0.002;
const signDefs = [
  { rot: 0,             pos: [0, 2.28,  bandFace] },
  { rot: Math.PI,       pos: [0, 2.28, -bandFace] },
  { rot: Math.PI / 2,   pos: [ bandFace, 2.28, 0] },
  { rot: -Math.PI / 2,  pos: [-bandFace, 2.28, 0] },
];
for (const s of signDefs) {
  const m = new THREE.Mesh(signGeo, signMat);
  m.rotation.y = s.rot;
  m.position.set(s.pos[0], s.pos[1], s.pos[2]);
  booth.add(m);
}

// top molding above sign
const topMold = box(OW, 0.03, OD, redMat);
topMold.position.y = 2.385;
booth.add(topMold);

// closing slab under the dome
const slab = cyl(0.50, 0.50, 0.02, redMat, 48);
slab.position.y = 2.40;
booth.add(slab);

// shallow domed roof (partial sphere cap)
const domeR = 0.639, domeTheta = 0.898, domeCenterY = 2.002;
const dome = new THREE.Mesh(
  new THREE.SphereGeometry(domeR, 48, 24, 0, Math.PI * 2, 0, domeTheta),
  redMat
);
dome.position.y = domeCenterY;
booth.add(dome);

// base ring of the dome
const domeRing = new THREE.Mesh(new THREE.TorusGeometry(0.50, 0.018, 12, 40), redMat);
domeRing.rotation.x = Math.PI / 2;
domeRing.position.y = 2.40;
booth.add(domeRing);

// small gold crown finial on the apex
function buildCrown() {
  const g = new THREE.Group();
  const bandC = cyl(0.052, 0.058, 0.05, goldMat, 22);
  bandC.position.y = 0.025; g.add(bandC);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.052, 0.008, 10, 26), goldMat);
  ring.rotation.x = Math.PI / 2; ring.position.y = 0.05; g.add(ring);
  const pts = 6;
  for (let i = 0; i < pts; i++) {
    const a = (i / pts) * Math.PI * 2;
    const cx = Math.cos(a) * 0.05, cz = Math.sin(a) * 0.05;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.012, 0.06, 10), goldMat);
    cone.position.set(cx, 0.085, cz); g.add(cone);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.013, 12, 10), goldMat);
    ball.position.set(cx, 0.118, cz); g.add(ball);
  }
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.02, 16, 12), goldMat);
  cap.position.y = 0.10; g.add(cap);
  return g;
}
const crown = buildCrown();
crown.position.y = domeCenterY + domeR;   // apex ~2.64
booth.add(crown);

/* ------------------------------------------------------------------ *
 *  Interior: floor pad, shelf, phone silhouette
 * ------------------------------------------------------------------ */
const floorPad = box(0.72, 0.02, 0.72, floorMat);
floorPad.position.set(0, 0.09, 0);
booth.add(floorPad);

// shelf against the back wall
const shelf = box(0.60, 0.03, 0.22, shelfMat);
shelf.position.set(0, 0.85, -0.30);
booth.add(shelf);
for (const sx of [-0.26, 0.26]) {
  const bracket = box(0.03, 0.16, 0.18, shelfMat);
  bracket.position.set(sx, 0.77, -0.32);
  booth.add(bracket);
}

// payphone body mounted on back wall
const phone = new THREE.Group();
const body = box(0.20, 0.30, 0.11, phoneMat);
body.position.set(0, 1.22, -0.37);
phone.add(body);
const cashbox = box(0.15, 0.11, 0.09, phoneMat);
cashbox.position.set(0, 1.02, -0.37);
phone.add(cashbox);
const dial = box(0.12, 0.09, 0.03, darkMat);
dial.position.set(0, 1.28, -0.31);
phone.add(dial);
const coinRet = box(0.06, 0.03, 0.03, chromeMat);
coinRet.position.set(0.04, 0.97, -0.32);
phone.add(coinRet);

// handset hung on the left
const handset = new THREE.Group();
const hGrip = cyl(0.022, 0.022, 0.20, phoneMat, 14);
hGrip.position.set(0, 0, 0);
handset.add(hGrip);
for (const dy of [0.11, -0.11]) {
  const ear = cyl(0.032, 0.032, 0.045, phoneMat, 14);
  ear.rotation.z = Math.PI / 2;
  ear.position.set(0.02, dy, 0);
  handset.add(ear);
}
handset.position.set(-0.135, 1.20, -0.31);
handset.rotation.z = 0.06;
phone.add(handset);

// simple drooping cord
const cordCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.06, 1.09, -0.33),
  new THREE.Vector3(-0.10, 1.03, -0.31),
  new THREE.Vector3(-0.14, 1.06, -0.30),
  new THREE.Vector3(-0.135, 1.12, -0.31),
]);
const cord = new THREE.Mesh(new THREE.TubeGeometry(cordCurve, 40, 0.006, 8, false), darkMat);
phone.add(cord);
booth.add(phone);

/* ------------------------------------------------------------------ *
 *  Base plinth (concrete)
 * ------------------------------------------------------------------ */
const plinth = box(OW + 0.07, 0.08, OD + 0.07, concreteMat);
plinth.position.y = 0.04;
booth.add(plinth);
const plinth2 = box(OW + 0.16, 0.03, OD + 0.16, concreteMat);
plinth2.position.y = 0.015;
booth.add(plinth2);

/* ------------------------------------------------------------------ *
 *  Shadow flags
 * ------------------------------------------------------------------ */
booth.traverse((o) => {
  if (o.isMesh) {
    o.castShadow = true;
    o.receiveShadow = true;
    if (o.material === glassMat || o.material === signMat) o.castShadow = false;
  }
});

scene.add(booth);

/* ------------------------------------------------------------------ *
 *  Resize & render loop
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
