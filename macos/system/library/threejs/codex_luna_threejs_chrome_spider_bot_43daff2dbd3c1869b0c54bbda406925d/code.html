<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Spider Bot</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020509;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020509);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.8, 3.1, 5.8);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.28;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.minDistance = 3.6;
controls.maxDistance = 10;
controls.target.set(0, 0.25, 0);

const chrome = new THREE.MeshPhysicalMaterial({
  color: 0xdce7ed,
  metalness: 1,
  roughness: 0.105,
  clearcoat: 1,
  clearcoatRoughness: 0.065,
  envMapIntensity: 2.45
});

const darkChrome = new THREE.MeshPhysicalMaterial({
  color: 0x18242b,
  metalness: 1,
  roughness: 0.14,
  clearcoat: 1,
  clearcoatRoughness: 0.05,
  envMapIntensity: 2.5
});

const edgeChrome = new THREE.MeshPhysicalMaterial({
  color: 0xb9d9e6,
  metalness: 1,
  roughness: 0.07,
  clearcoat: 1,
  clearcoatRoughness: 0.035,
  envMapIntensity: 3
});

const environment = new THREE.Scene();
environment.background = new THREE.Color(0x020509);
environment.add(new THREE.HemisphereLight(0x9dbdce, 0x050609, 1.8));

function envBar(position, scale, color, rotation) {
  const material = new THREE.MeshBasicMaterial({ color });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), material);
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.rotation.set(rotation.x, rotation.y, rotation.z);
  environment.add(mesh);
}

envBar(new THREE.Vector3(-3.8, 2.5, -2.5), new THREE.Vector3(0.12, 5.8, 0.16), 0x9fd9ee, new THREE.Vector3(0, 0, 0.12));
envBar(new THREE.Vector3(3.2, 1.7, -3.3), new THREE.Vector3(0.16, 5.5, 0.11), 0xe7f5ff, new THREE.Vector3(0, 0, -0.18));
envBar(new THREE.Vector3(-2.5, -1.9, 2.8), new THREE.Vector3(0.18, 4.7, 0.12), 0x44798d, new THREE.Vector3(0, 0, -0.2));
envBar(new THREE.Vector3(2.7, -2.4, 2.5), new THREE.Vector3(0.1, 4.5, 0.13), 0x85bfd1, new THREE.Vector3(0, 0, 0.18));
envBar(new THREE.Vector3(0, 3.8, 0), new THREE.Vector3(7, 0.08, 0.18), 0xeffaff, new THREE.Vector3(0.08, 0, 0));
envBar(new THREE.Vector3(0, -3.3, 0), new THREE.Vector3(8, 0.06, 0.15), 0x386271, new THREE.Vector3(-0.08, 0, 0));

const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(512, {
  generateMipmaps: true,
  minFilter: THREE.LinearMipmapLinearFilter
});
cubeRenderTarget.texture.colorSpace = THREE.SRGBColorSpace;
const cubeCamera = new THREE.CubeCamera(0.1, 100, cubeRenderTarget);

const bot = new THREE.Group();
bot.position.y = 0.3;
scene.add(bot);

function cylinderBetween(start, end, radius, material, radialSegments = 18) {
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(radius, radius * 0.88, length, radialSegments, 1);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  bot.add(mesh);
  return mesh;
}

function chromeJoint(position, radius) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 24, 16), edgeChrome);
  mesh.position.copy(position);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  bot.add(mesh);
  return mesh;
}

function pinTip(position, direction) {
  const geometry = new THREE.ConeGeometry(0.075, 0.42, 14, 1);
  const mesh = new THREE.Mesh(geometry, darkChrome);
  mesh.position.copy(position);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.clone().normalize());
  mesh.castShadow = true;
  bot.add(mesh);
}

function droplet(position, radius) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 20, 14), chrome);
  mesh.position.copy(position);
  mesh.scale.set(0.84, 1.22, 0.84);
  mesh.castShadow = true;
  bot.add(mesh);
}

const bodyProfile = [
  new THREE.Vector2(0.02, -1.05),
  new THREE.Vector2(0.44, -0.98),
  new THREE.Vector2(0.88, -0.72),
  new THREE.Vector2(1.17, -0.3),
  new THREE.Vector2(1.27, 0.2),
  new THREE.Vector2(1.12, 0.62),
  new THREE.Vector2(0.76, 0.91),
  new THREE.Vector2(0.34, 1.04),
  new THREE.Vector2(0.02, 1.02)
];

const body = new THREE.Mesh(new THREE.LatheGeometry(bodyProfile, 64), chrome);
body.rotation.z = Math.PI / 2;
body.scale.set(1.18, 0.78, 0.82);
body.position.set(-0.08, 0.62, 0);
body.castShadow = true;
body.receiveShadow = true;
bot.add(body);

const lowerShell = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 24), chrome);
lowerShell.scale.set(1.14, 0.48, 0.78);
lowerShell.position.set(-0.18, 0.38, 0);
lowerShell.castShadow = true;
bot.add(lowerShell);

const eyeGeometry = new THREE.SphereGeometry(0.19, 24, 16);
for (const side of [-1, 1]) {
  const eye = new THREE.Mesh(eyeGeometry, darkChrome);
  eye.position.set(1.12, 0.71, side * 0.28);
  eye.scale.set(0.72, 0.72, 1.18);
  eye.castShadow = true;
  bot.add(eye);
}

const legXs = [-0.92, -0.36, 0.36, 0.92];

for (let index = 0; index < legXs.length; index++) {
  const x = legXs[index];
  const forward = x > 0.5 ? 0.24 : (x < -0.5 ? -0.18 : 0);
  for (const side of [-1, 1]) {
    const root = new THREE.Vector3(x, 0.42, side * 0.58);
    const knee = new THREE.Vector3(x + forward + (x > 0 ? 0.12 : -0.08), -0.02, side * (1.28 + Math.abs(x) * 0.1));
    const ankle = new THREE.Vector3(x + forward + (x > 0 ? 0.2 : -0.18), -0.45, side * (2.05 + (index % 2) * 0.12));
    const foot = new THREE.Vector3(ankle.x + (x > 0 ? 0.08 : -0.08), -0.51, ankle.z + side * 0.18);

    cylinderBetween(root, knee, 0.13, chrome, 20);
    cylinderBetween(knee, ankle, 0.105, chrome, 20);
    cylinderBetween(ankle, foot, 0.075, edgeChrome, 18);
    chromeJoint(root, 0.17);
    chromeJoint(knee, 0.145);
    chromeJoint(ankle, 0.105);

    const kneeDroplet = new THREE.Vector3().lerpVectors(root, knee, 0.56);
    kneeDroplet.y += 0.07;
    droplet(kneeDroplet, 0.08);

    const ankleDroplet = new THREE.Vector3().lerpVectors(knee, ankle, 0.48);
    ankleDroplet.y += 0.06;
    droplet(ankleDroplet, 0.06);

    const pinDirection = new THREE.Vector3().subVectors(foot, ankle);
    pinTip(foot, pinDirection);
  }
}

const crest = new THREE.Mesh(
  new THREE.TorusGeometry(0.39, 0.035, 10, 48, Math.PI * 1.15),
  edgeChrome
);
crest.rotation.x = Math.PI / 2;
crest.rotation.z = 0.16;
crest.position.set(-0.56, 1.17, 0);
crest.scale.set(1.25, 0.7, 1);
crest.castShadow = true;
bot.add(crest);

const rim = new THREE.Mesh(
  new THREE.TorusGeometry(0.23, 0.028, 10, 32),
  edgeChrome
);
rim.rotation.y = Math.PI / 2;
rim.position.set(1.13, 0.7, 0);
rim.scale.set(1, 1.3, 1);
bot.add(rim);

const keyLight = new THREE.DirectionalLight(0xe8f8ff, 5.5);
keyLight.position.set(-4, 7, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 20;
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -6;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0x63b7d4, 18, 12, 2);
fillLight.position.set(4, 2, 4);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xa9e9ff, 22, 14, 2);
rimLight.position.set(-4, 1, -4);
scene.add(rimLight);

const lowLight = new THREE.PointLight(0x234d62, 12, 10, 2);
lowLight.position.set(0, -2, 1);
scene.add(lowLight);

scene.add(new THREE.HemisphereLight(0x9ec8d9, 0x030508, 1.35));

cubeCamera.position.set(0, 0.4, 0);
cubeCamera.update(renderer, environment);
chrome.envMap = cubeRenderTarget.texture;
darkChrome.envMap = cubeRenderTarget.texture;
edgeChrome.envMap = cubeRenderTarget.texture;

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
