<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Oasis Camp</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151227}
  canvas{display:block}
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x9b6653, 0.018);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(47, innerWidth / innerHeight, 0.1, 220);
camera.position.set(18, 11, 22);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;
controls.minDistance = 10;
controls.maxDistance = 42;
controls.maxPolarAngle = Math.PI * 0.48;

let seed = 493817;
function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a,b){ return a + (b-a) * rand(); }
function choose(a){ return a[Math.floor(rand()*a.length)]; }
function material(color, rough=0.8, metal=0) {
  return new THREE.MeshStandardMaterial({ color, roughness:rough, metalness:metal });
}
function addMesh(geometry, mat, pos=[0,0,0], rot=[0,0,0], cast=true, receive=true) {
  const m = new THREE.Mesh(geometry, mat);
  m.position.set(...pos); m.rotation.set(...rot);
  m.castShadow = cast; m.receiveShadow = receive;
  scene.add(m); return m;
}
function canvasTexture(draw, size=512) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  draw(g, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function radialTexture(inner, outer) {
  return canvasTexture((g,s)=>{
    const q=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    q.addColorStop(0,inner); q.addColorStop(1,outer);
    g.fillStyle=q;g.fillRect(0,0,s,s);
  });
}

const skyGeo = new THREE.SphereGeometry(110, 48, 24);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms:{ top:{value:new THREE.Color(0x14152f)}, mid:{value:new THREE.Color(0xa6544c)}, bottom:{value:new THREE.Color(0xf3b36d)} },
  vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`uniform vec3 top;uniform vec3 mid;uniform vec3 bottom;varying vec3 vP;void main(){float h=normalize(vP).y*.5+.5;vec3 c=mix(bottom,mid,smoothstep(.13,.47,h));c=mix(c,top,smoothstep(.47,.92,h));gl_FragColor=vec4(c,1.0);}`
});
scene.add(new THREE.Mesh(skyGeo, skyMat));

const starGeo = new THREE.BufferGeometry();
const stars = [];
for(let i=0;i<450;i++){
  const a=rand()*Math.PI*2, elev=range(0.08,1.12), r=94;
  stars.push(Math.cos(a)*Math.cos(elev)*r, Math.sin(elev)*r, Math.sin(a)*Math.cos(elev)*r);
}
starGeo.setAttribute("position",new THREE.Float32BufferAttribute(stars,3));
const starMat = new THREE.PointsMaterial({color:0xfff3cf,size:0.35,sizeAttenuation:true,transparent:true,opacity:0.75});
const starField = new THREE.Points(starGeo,starMat); scene.add(starField);

const sandTex = canvasTexture((g,s)=>{
  g.fillStyle="#b97943";g.fillRect(0,0,s,s);
  for(let i=0;i<15000;i++){
    const x=rand()*s,y=rand()*s,a=range(.02,.16);
    g.fillStyle=`rgba(68,35,20,${a})`;
    g.fillRect(x,y,range(.3,1.8),range(.3,1.8));
  }
  g.globalAlpha=.24;
  for(let i=0;i<90;i++){
    g.strokeStyle=choose(["#f0b66d","#754227","#d38b4c"]);
    g.lineWidth=range(1,4);g.beginPath();
    let x=0,y=rand()*s;
    g.moveTo(x,y);
    for(;x<s;x+=20)g.lineTo(x,y+=Math.sin(x*.035+i)*range(-3,3));
    g.stroke();
  }
},1024);
sandTex.repeat.set(7,7);
const sandMat = new THREE.MeshStandardMaterial({map:sandTex,color:0xe0a15d,roughness:0.96});
const ground = addMesh(new THREE.PlaneGeometry(150,150,100,100),sandMat,[0,-.06,0],[-Math.PI/2,0,0],false,true);

function dune(x,z,r,h,col=0xd7944e) {
  const geo = new THREE.SphereGeometry(r,32,16);
  geo.scale(1,h/r,0.58);
  const mesh=addMesh(geo,material(col,.95),[x,h*.28,z],[0,range(-.45,.45),0],false,true);
  mesh.geometry.computeVertexNormals();
  return mesh;
}
dune(-28,4,20,6,0xc97d3c);
dune(28,-8,22,7,0xd58c48);
dune(-5,-32,25,8,0xc77838);
dune(3,33,26,7,0xdf9955);
dune(-34,-24,17,5,0xbd7139);
dune(36,26,16,4,0xc77b40);

const ridgeMat = new THREE.MeshStandardMaterial({color:0xa95e31,roughness:1,transparent:true,opacity:.35});
for(let i=0;i<42;i++){
  const x=range(-48,48), z=range(-46,46);
  if(Math.abs(x)<15 && Math.abs(z)<15)continue;
  const ridge=addMesh(new THREE.CylinderGeometry(.035,.12,range(4,13),5),ridgeMat,[x,.19,z],[0,range(-1,1),Math.PI/2],false,true);
  ridge.rotation.z=Math.PI/2;
}

const oasis = new THREE.Group(); scene.add(oasis);
const poolShape = new THREE.Shape();
for(let i=0;i<=40;i++){
  const a=i/40*Math.PI*2;
  const rr=5.25 + Math.sin(a*3)*.48 + Math.sin(a*7)*.18;
  const x=Math.cos(a)*rr, z=Math.sin(a)*rr*.68;
  i?poolShape.lineTo(x,z):poolShape.moveTo(x,z);
}
const poolGeo = new THREE.ShapeGeometry(poolShape,48);
poolGeo.rotateX(-Math.PI/2);
const waterTex=canvasTexture((g,s)=>{
  g.fillStyle="#118e9d";g.fillRect(0,0,s,s);
  for(let i=0;i<160;i++){g.strokeStyle=`rgba(210,255,236,${range(.07,.2)})`;g.lineWidth=range(1,3);g.beginPath();g.ellipse(rand()*s,rand()*s,range(10,85),range(2,9),rand()*3,0,Math.PI*2);g.stroke();}
});
waterTex.repeat.set(1.5,1.5);
const waterMat=new THREE.MeshPhysicalMaterial({map:waterTex,color:0x25bec1,roughness:.2,metalness:.05,transmission:.08,transparent:true,opacity:.92,clearcoat:.55});
const water=addMesh(poolGeo,waterMat,[0,.03,0],[0,0,0],false,true);
oasis.add(water);

const rockMat=material(0x8e5939,.92);
for(let i=0;i<84;i++){
  const a=rand()*Math.PI*2, r=range(5.35,6.05);
  const geo=new THREE.DodecahedronGeometry(range(.14,.42),0);
  const rock=addMesh(geo,rockMat,[Math.cos(a)*r,.18,Math.sin(a)*r*.7],[rand(),rand(),rand()]);
  rock.scale.set(range(.7,1.7),range(.45,1),range(.7,1.4));
}

const reedMat=material(0x5c7131,.85);
const reedHeadMat=material(0x92703b,.95);
for(let i=0;i<145;i++){
  const a=rand()*Math.PI*2, r=range(5.5,6.65), h=range(.55,1.5);
  const x=Math.cos(a)*r,z=Math.sin(a)*r*.7;
  const stem=addMesh(new THREE.CylinderGeometry(.018,.028,h,5),reedMat,[x,h/2,z],[range(-.15,.15),0,range(-.15,.15)],false,true);
  if(rand()>.42)addMesh(new THREE.CylinderGeometry(.05,.04,range(.12,.28),5),reedHeadMat,[x,h+.04,z],[0,0,range(-.2,.2)],false,true);
  stem.userData.sway=rand()*6.28;
}

function palm(x,z,s=1){
  const group=new THREE.Group(); group.position.set(x,0,z); scene.add(group);
  const trunkMat=material(0x694126,.94);
  const trunk=new THREE.Group();group.add(trunk);
  const segments=10, h=5.8*s;
  for(let i=0;i<segments;i++){
    const p=i/(segments-1), y=p*h;
    const piece=new THREE.Mesh(new THREE.CylinderGeometry(.19*s*(1-p*.58),.23*s*(1-p*.58),h/segments*1.07,8),trunkMat);
    piece.position.set(Math.sin(p*3.3)*.18*s,y,Math.cos(p*2.3)*.10*s);
    piece.rotation.z=Math.sin(p*3.3)*.055;
    piece.castShadow=true;piece.receiveShadow=true;trunk.add(piece);
  }
  const crown=new THREE.Group(); crown.position.set(Math.sin(3.3)*.18*s,h,Math.cos(2.3)*.1*s);group.add(crown);
  const leafMat=new THREE.MeshStandardMaterial({color:0x344f25,roughness:.8,side:THREE.DoubleSide});
  for(let j=0;j<11;j++){
    const a=j/11*Math.PI*2+rand()*.15;
    const len=range(2.4,3.65)*s;
    const curve=new THREE.CatmullRomCurve3([
      new THREE.Vector3(0,0,0),
      new THREE.Vector3(Math.cos(a)*len*.28,range(-.12,.15)*s,Math.sin(a)*len*.28),
      new THREE.Vector3(Math.cos(a)*len*.7,-range(.25,.75)*s,Math.sin(a)*len*.7),
      new THREE.Vector3(Math.cos(a)*len,-range(.55,1.2)*s,Math.sin(a)*len)
    ]);
    const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,10,.065*s,5,false),leafMat);
    tube.castShadow=true;crown.add(tube);
    for(let k=2;k<10;k++){
      const p=curve.getPoint(k/11), tangent=curve.getTangent(k/11);
      const blade=new THREE.Mesh(new THREE.PlaneGeometry(len*.23*s,.22*s),leafMat);
      blade.position.copy(p); blade.lookAt(p.clone().add(tangent));
      blade.rotateX(Math.PI/2);blade.rotation.z+=(k%2?.42:-.42);
      blade.castShadow=true;crown.add(blade);
    }
  }
  group.userData.crown=crown; return group;
}
const palms=[palm(-6.8,-1.7,1.15),palm(5.9,-2.5,1.05),palm(-4.8,4.1,.78),palm(6.8,3.5,.83),palm(-7.4,3.1,.7)];

function tent(x,z,scale,main,accent,rot=0){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;scene.add(g);
  const cloth=new THREE.MeshStandardMaterial({color:main,roughness:.92,side:THREE.DoubleSide});
  const stripe=new THREE.MeshStandardMaterial({color:accent,roughness:.9,side:THREE.DoubleSide});
  const w=3.8*scale,d=3.2*scale,h=2.75*scale;
  const roof=new THREE.Mesh(new THREE.ConeGeometry(w*.72,h,4,1,false,Math.PI/4),cloth);
  roof.position.y=h*.58;roof.rotation.y=Math.PI/4;roof.scale.z=d/w;roof.castShadow=true;roof.receiveShadow=true;g.add(roof);
  const body=new THREE.Mesh(new THREE.CylinderGeometry(w*.72,w*.72,h*.52,4,1,true,Math.PI/4),cloth);
  body.position.y=h*.28;body.rotation.y=Math.PI/4;body.scale.z=d/w;body.castShadow=true;body.receiveShadow=true;g.add(body);
  for(let i=-2;i<=2;i++){
    const band=new THREE.Mesh(new THREE.BoxGeometry(.25*scale,h*.92,.04),stripe);
    band.position.set(i*w*.23,h*.45,d*.505);band.rotation.y=0;band.castShadow=true;g.add(band);
  }
  const flap=new THREE.Mesh(new THREE.PlaneGeometry(w*.45,h*.62),new THREE.MeshStandardMaterial({color:0x38221d,roughness:1,side:THREE.DoubleSide}));
  flap.position.set(0,h*.34,d*.515);g.add(flap);
  for(const sx of [-1,1])for(const sz of [-1,1]){
    const pole=new THREE.Mesh(new THREE.CylinderGeometry(.035,.045,h*.92,6),material(0x4b2d1c,.9));
    pole.position.set(sx*w*.67,h*.42,sz*d*.67);pole.castShadow=true;g.add(pole);
  }
  return g;
}
tent(-6.1,7.3,1.05,0xd9b67a,0x9a4134,-.24);
tent(5.7,7.1,.87,0xc88959,0x3b4a47,.27);

function rug(x,z,w,d,rot,colorA,colorB){
  const tex=canvasTexture((g,s)=>{
    g.fillStyle=colorA;g.fillRect(0,0,s,s);
    g.fillStyle=colorB;
    for(let i=0;i<13;i++){g.fillRect(i*s/13,0,s/26,s);g.fillRect(0,i*s/13,s,s/32);}
    g.strokeStyle="#e4bf72";g.lineWidth=15;g.strokeRect(18,18,s-36,s-36);
    for(let i=0;i<100;i++){g.fillStyle=rand()>.5?colorB:"#e0b86d";g.fillRect(rand()*s,rand()*s,4,4);}
  },256);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshStandardMaterial({map:tex,roughness:1,side:THREE.DoubleSide}));
  m.position.set(x,.07,z);m.rotation.set(-Math.PI/2,0,rot);m.receiveShadow=true;scene.add(m);
}
rug(-3.0,6.1,3.5,2.1,-.22,"#a94d38","#5b3432");
rug(2.7,5.4,3.1,1.8,.2,"#bd7a3d","#274c4b");

const cushionMat=[material(0x9e3f35,.93),material(0x2f5952,.9),material(0xc88144,.92),material(0x5e3543,.9)];
for(let i=0;i<11;i++){
  const a=range(0,Math.PI*2),r=range(3.6,6.2);
  const c=addMesh(new THREE.CylinderGeometry(.42,.52,.24,12),choose(cushionMat),[Math.cos(a)*r,.2,5.7+Math.sin(a)*r*.36],[0,rand()*Math.PI,0]);
  c.scale.set(range(.85,1.4),1,range(.8,1.22));
}

const jarMat=material(0x9d5734,.88);
function jar(x,z,s=1){
  const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  const body=new THREE.Mesh(new THREE.SphereGeometry(.48*s,16,10),jarMat);body.scale.y=1.25;body.position.y=.55*s;body.castShadow=true;g.add(body);
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.24*s,.34*s,12),jarMat);neck.position.y=1.12*s;neck.castShadow=true;g.add(neck);
  const lip=new THREE.Mesh(new THREE.TorusGeometry(.2*s,.04*s,6,12),jarMat);lip.position.y=1.3*s;lip.rotation.x=Math.PI/2;g.add(lip);
}
jar(-1.7,4.0,.9);jar(-2.4,4.5,.62);jar(3.2,4.15,.72);jar(4.1,3.9,.53);

const fireGroup=new THREE.Group();fireGroup.position.set(0,3.7,4.1);scene.add(fireGroup);
const logMat=material(0x482618,.95);
for(let i=0;i<4;i++){
  const log=new THREE.Mesh(new THREE.CylinderGeometry(.11,.15,1.45,8),logMat);
  log.rotation.set(Math.PI/2,0,i*Math.PI/4);log.position.y=.19;log.castShadow=true;fireGroup.add(log);
}
const coalMat=new THREE.MeshStandardMaterial({color:0x72251a,emissive:0x5a1208,emissiveIntensity:1,roughness:.8});
for(let i=0;i<14;i++){
  const a=i/14*Math.PI*2,r=range(.32,.78);
  const coal=new THREE.Mesh(new THREE.DodecahedronGeometry(range(.1,.19),0),coalMat);
  coal.position.set(Math.cos(a)*r,.19,Math.sin(a)*r);coal.castShadow=true;fireGroup.add(coal);
}
const flameMat=new THREE.MeshStandardMaterial({color:0xff7b23,emissive:0xff3b08,emissiveIntensity:3,roughness:.55,transparent:true,opacity:.92});
const flameInnerMat=new THREE.MeshStandardMaterial({color:0xffdd77,emissive:0xffb21c,emissiveIntensity:4,roughness:.5});
const flame=new THREE.Mesh(new THREE.ConeGeometry(.43,1.35,7),flameMat);flame.position.y=.87;flame.castShadow=true;fireGroup.add(flame);
const innerFlame=new THREE.Mesh(new THREE.ConeGeometry(.21,.84,6),flameInnerMat);innerFlame.position.y=.68;fireGroup.add(innerFlame);
const fireLight=new THREE.PointLight(0xff761d,55,18,2);fireLight.position.set(0,1.8,0);fireLight.castShadow=true;fireLight.shadow.mapSize.set(1024,1024);fireGroup.add(fireLight);

const sparkGeo=new THREE.BufferGeometry(), sparkPositions=[], sparkOffsets=[];
for(let i=0;i<70;i++){sparkPositions.push(0,0,0);sparkOffsets.push(rand()*Math.PI*2,range(.35,1.4),range(.1,.7));}
sparkGeo.setAttribute("position",new THREE.Float32BufferAttribute(sparkPositions,3));
const sparkMat=new THREE.PointsMaterial({color:0xffc15d,size:.12,transparent:true,opacity:.9,blending:THREE.AdditiveBlending});
const sparks=new THREE.Points(sparkGeo,sparkMat);fireGroup.add(sparks);

function camel(x,z,s=1){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=-.7;scene.add(g);
  const cm=new THREE.MeshStandardMaterial({color:0x3b2926,roughness:.95});
  const body=new THREE.Mesh(new THREE.SphereGeometry(1.1*s,16,10),cm);body.scale.set(1.55,.72,.72);body.position.y=1.5*s;body.castShadow=true;g.add(body);
  for(const px of [-1.08,1.08])for(const pz of [-.45,.45]){
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(.11*s,.14*s,1.5*s,8),cm);leg.position.set(px*s,.75*s,pz*s);leg.castShadow=true;g.add(leg);
  }
  for(const px of [-.43,.42]){
    const hump=new THREE.Mesh(new THREE.SphereGeometry(.62*s,12,8),cm);hump.position.set(px*s,2.12*s,0);hump.scale.y=.9;hump.castShadow=true;g.add(hump);
  }
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.34*s,1.28*s,9),cm);neck.position.set(1.35*s,2.15*s,0);neck.rotation.z=-.38;neck.castShadow=true;g.add(neck);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.34*s,10,8),cm);head.position.set(1.63*s,2.74*s,0);head.scale.set(1.3,.8,.85);head.castShadow=true;g.add(head);
  const ear=new THREE.Mesh(new THREE.ConeGeometry(.1*s,.35*s,5),cm);ear.position.set(1.66*s,3.05*s,.18*s);ear.rotation.z=.18;g.add(ear);
  return g;
}
const restingCamel=camel(10.5,-2.0,1.08);
restingCamel.rotation.x=.07;

const lanternMat=new THREE.MeshStandardMaterial({color:0x4b3524,metalness:.35,roughness:.55});
function lantern(x,z){
  const g=new THREE.Group();g.position.set(x,.22,z);scene.add(g);
  const base=new THREE.Mesh(new THREE.CylinderGeometry(.18,.22,.15,8),lanternMat);g.add(base);
  const glow=new THREE.Mesh(new THREE.SphereGeometry(.17,10,8),new THREE.MeshStandardMaterial({color:0xffbd52,emissive:0xff7625,emissiveIntensity:2}));
  glow.position.y=.36;g.add(glow);
  const top=new THREE.Mesh(new THREE.ConeGeometry(.22,.22,8),lanternMat);top.position.y=.62;g.add(top);
  const l=new THREE.PointLight(0xff9a3e,3.5,5,2);l.position.y=.4;g.add(l);
}
lantern(-4.7,4.9);lantern(4.4,5.2);lantern(-1.2,5.6);

const sunLight=new THREE.DirectionalLight(0xffb262,3.2);
sunLight.position.set(-18,19,-14);sunLight.castShadow=true;
sunLight.shadow.mapSize.set(2048,2048);sunLight.shadow.camera.left=-28;sunLight.shadow.camera.right=28;
sunLight.shadow.camera.top=28;sunLight.shadow.camera.bottom=-28;sunLight.shadow.camera.far=65;
scene.add(sunLight);
scene.add(new THREE.HemisphereLight(0x5d6da2,0xc16b35,1.65));

const moonGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:radialTexture("rgba(255,218,160,.86)","rgba(255,153,82,0)"),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
moonGlow.position.set(-27,14,-44);moonGlow.scale.set(17,17,1);scene.add(moonGlow);

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  waterTex.offset.x=Math.sin(t*.09)*.025;
  waterTex.offset.y=t*.012;
  flame.scale.set(.88+Math.sin(t*12)*.13, .92+Math.sin(t*15+1)*.15, .88+Math.cos(t*11)*.13);
  innerFlame.scale.set(.9+Math.sin(t*14)*.15,1, .9+Math.cos(t*12)*.12);
  fireLight.intensity=48+Math.sin(t*9)*9+Math.sin(t*17)*4;
  flameMat.emissiveIntensity=2.5+Math.sin(t*13)*.55;
  for(const p of palms)p.userData.crown.rotation.z=Math.sin(t*.65+p.position.x)*.035;
  const a=sparkGeo.attributes.position.array;
  for(let i=0;i<70;i++){
    const phase=(t*.85+sparkOffsets[i*3])%2.4;
    a[i*3]=Math.sin(sparkOffsets[i*3]*7+phase*3)*(.1+phase*.2);
    a[i*3+1]=.5+phase*.82;
    a[i*3+2]=Math.cos(sparkOffsets[i*3]*5+phase*2)*(.1+phase*.2);
  }
  sparkGeo.attributes.position.needsUpdate=true;
  starMat.opacity=.40+Math.sin(t*.25)*.08;
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
