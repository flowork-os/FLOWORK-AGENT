<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapel Apse</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #11151a; }
canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11161b);
scene.fog = new THREE.Fog(0x11161b, 24, 42);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(10.5, 7.1, -14.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.target.set(0, 3.3, 2.1);
controls.minDistance = 9;
controls.maxDistance = 26;
controls.maxPolarAngle = Math.PI * 0.48;

const stoneMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x9b9485, roughness: 0.92 }),
  new THREE.MeshStandardMaterial({ color: 0xa9a18f, roughness: 0.9 }),
  new THREE.MeshStandardMaterial({ color: 0x8a8579, roughness: 0.95 }),
  new THREE.MeshStandardMaterial({ color: 0xb2aa98, roughness: 0.88 }),
  new THREE.MeshStandardMaterial({ color: 0x77766f, roughness: 0.96 })
];
const mortarMaterial = new THREE.MeshStandardMaterial({ color: 0x6f6b61, roughness: 1 });
const trimMaterial = new THREE.MeshStandardMaterial({ color: 0xc2b89f, roughness: 0.84 });
const roofMaterial = new THREE.MeshStandardMaterial({ color: 0x39434a, roughness: 0.88, metalness: 0.04 });
const glassMaterial = new THREE.MeshStandardMaterial({
  color: 0x172c3a,
  roughness: 0.25,
  metalness: 0.2,
  emissive: 0x07131c,
  emissiveIntensity: 0.55
});
const woodMaterial = new THREE.MeshStandardMaterial({ color: 0x4d3020, roughness: 0.82 });

const outerRadius = 5.55;
const innerRadius = 4.92;
const wallHeight = 6.25;
const halfAngle = Math.PI / 2;

function buildApseWall() {
  const positions = [];
  const indices = [];
  const segments = 48;

  function addQuad(a, b, c, d) {
    const start = positions.length / 3;
    positions.push(...a, ...b, ...c, ...d);
    indices.push(start, start + 1, start + 2, start, start + 2, start + 3);
  }

  for (let i = 0; i < segments; i++) {
    const t0 = -halfAngle + (i / segments) * Math.PI;
    const t1 = -halfAngle + ((i + 1) / segments) * Math.PI;
    const o0 = [outerRadius * Math.sin(t0), 0, outerRadius * Math.cos(t0)];
    const o1 = [outerRadius * Math.sin(t1), 0, outerRadius * Math.cos(t1)];
    const i0 = [innerRadius * Math.sin(t0), 0, innerRadius * Math.cos(t0)];
    const i1 = [innerRadius * Math.sin(t1), 0, innerRadius * Math.cos(t1)];
    const o0t = [o0[0], wallHeight, o0[2]];
    const o1t = [o1[0], wallHeight, o1[2]];
    const i0t = [i0[0], wallHeight, i0[2]];
    const i1t = [i1[0], wallHeight, i1[2]];

    addQuad(o0, o1, o1t, o0t);
    addQuad(i1, i0, i0t, i1t);
    addQuad(o0t, o1t, i1t, i0t);
    addQuad(o1, o0, i0, i1);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const wall = new THREE.Mesh(geometry, stoneMaterials[0]);
  wall.castShadow = true;
  wall.receiveShadow = true;
  scene.add(wall);
}
buildApseWall();

function tangentQuaternion(angle) {
  const tangent = new THREE.Vector3(Math.cos(angle), 0, -Math.sin(angle));
  const vertical = new THREE.Vector3(0, 1, 0);
  const normal = new THREE.Vector3(Math.sin(angle), 0, Math.cos(angle));
  const matrix = new THREE.Matrix4().makeBasis(tangent, vertical, normal);
  return new THREE.Quaternion().setFromRotationMatrix(matrix);
}

function addStoneBlock(angle, y, width, height, depth, materialIndex) {
  const geometry = new THREE.BoxGeometry(width, height, depth);
  const block = new THREE.Mesh(geometry, stoneMaterials[materialIndex % stoneMaterials.length]);
  const normal = new THREE.Vector3(Math.sin(angle), 0, Math.cos(angle));
  block.position.copy(normal.multiplyScalar(outerRadius + depth * 0.42));
  block.position.y = y;
  block.quaternion.copy(tangentQuaternion(angle));
  block.castShadow = true;
  block.receiveShadow = true;
  scene.add(block);
}

for (let course = 0; course < 7; course++) {
  const y = 0.42 + course * 0.83;
  const count = course % 2 === 0 ? 10 : 9;
  const step = Math.PI / count;
  const offset = course % 2 === 0 ? 0 : step * 0.5;
  for (let stone = 0; stone < count; stone++) {
    const angle = -halfAngle + offset + (stone + 0.5) * step;
    if (angle > halfAngle - 0.04) continue;
    const width = outerRadius * step * (0.82 + ((stone + course * 3) % 3) * 0.035);
    addStoneBlock(angle, y, width, 0.68, 0.16, stone + course);
  }
}

function addButtress(angle) {
  const normal = new THREE.Vector3(Math.sin(angle), 0, Math.cos(angle));
  const geometry = new THREE.BoxGeometry(0.86, 5.9, 1.2);
  const buttress = new THREE.Mesh(geometry, stoneMaterials[2]);
  buttress.position.copy(normal.multiplyScalar(outerRadius + 0.43));
  buttress.position.y = 2.95;
  buttress.quaternion.copy(tangentQuaternion(angle));
  buttress.castShadow = true;
  buttress.receiveShadow = true;
  scene.add(buttress);

  const capGeometry = new THREE.BoxGeometry(1.04, 0.3, 1.42);
  const cap = new THREE.Mesh(capGeometry, trimMaterial);
  cap.position.copy(normal.multiplyScalar(outerRadius + 0.48));
  cap.position.y = 5.98;
  cap.quaternion.copy(tangentQuaternion(angle));
  cap.castShadow = true;
  cap.receiveShadow = true;
  scene.add(cap);

  const baseGeometry = new THREE.BoxGeometry(1.22, 0.42, 1.62);
  const base = new THREE.Mesh(baseGeometry, stoneMaterials[1]);
  base.position.copy(normal.multiplyScalar(outerRadius + 0.48));
  base.position.y = 0.22;
  base.quaternion.copy(tangentQuaternion(angle));
  base.castShadow = true;
  base.receiveShadow = true;
  scene.add(base);
}

[-1.18, -0.58, 0, 0.58, 1.18].forEach(addButtress);

function archShape(width, height) {
  const shape = new THREE.Shape();
  const radius = width / 2;
  const spring = height - radius;
  shape.moveTo(-radius, 0);
  shape.lineTo(-radius, spring);
  shape.absarc(0, spring, radius, Math.PI, 0, false);
  shape.lineTo(radius, 0);
  shape.lineTo(-radius, 0);
  return shape;
}

function addWindow(angle, yBottom) {
  const width = 1.18;
  const height = 3.72;
  const normal = new THREE.Vector3(Math.sin(angle), 0, Math.cos(angle));

  const glassGeometry = new THREE.ShapeGeometry(archShape(width, height), 12);
  const glass = new THREE.Mesh(glassGeometry, glassMaterial);
  glass.position.copy(normal.multiplyScalar(outerRadius + 0.105));
  glass.position.y = yBottom;
  glass.quaternion.copy(tangentQuaternion(angle));
  glass.castShadow = false;
  scene.add(glass);

  const outerShape = archShape(1.54, 4.12);
  const innerShape = archShape(1.22, 3.76);
  const frameShape = outerShape;
  frameShape.holes.push(new THREE.Path().setFromPoints([
    new THREE.Vector2(-0.61, 0),
    new THREE.Vector2(-0.61, 3.76 - 0.61),
    new THREE.Vector2(0, 3.76),
    new THREE.Vector2(0.61, 3.76 - 0.61),
    new THREE.Vector2(0.61, 0)
  ]));
  const frameGeometry = new THREE.ShapeGeometry(frameShape, 12);
  const frame = new THREE.Mesh(frameGeometry, trimMaterial);
  frame.position.copy(normal.multiplyScalar(outerRadius + 0.15));
  frame.position.y = yBottom - 0.04;
  frame.quaternion.copy(tangentQuaternion(angle));
  frame.castShadow = true;
  frame.receiveShadow = true;
  scene.add(frame);

  const mullionGeometry = new THREE.BoxGeometry(0.075, 3.35, 0.08);
  const mullion = new THREE.Mesh(mullionGeometry, trimMaterial);
  mullion.position.copy(normal.multiplyScalar(outerRadius + 0.19));
  mullion.position.y = yBottom + 1.67;
  mullion.quaternion.copy(tangentQuaternion(angle));
  mullion.castShadow = true;
  scene.add(mullion);

  const sillGeometry = new THREE.BoxGeometry(1.62, 0.18, 0.25);
  const sill = new THREE.Mesh(sillGeometry, trimMaterial);
  sill.position.copy(normal.multiplyScalar(outerRadius + 0.2));
  sill.position.y = yBottom - 0.08;
  sill.quaternion.copy(tangentQuaternion(angle));
  sill.castShadow = true;
  scene.add(sill);
}

[-1.02, -0.51, 0, 0.51, 1.02].forEach((angle) => addWindow(angle, 1.22));

const roofGeometry = new THREE.ConeGeometry(5.92, 2.55, 48, 1, false, -Math.PI / 2, Math.PI);
const roof = new THREE.Mesh(roofGeometry, roofMaterial);
roof.position.y = 7.52;
roof.castShadow = true;
roof.receiveShadow = true;
scene.add(roof);

const roofRimGeometry = new THREE.TorusGeometry(5.91, 0.105, 8, 64, Math.PI);
const roofRim = new THREE.Mesh(roofRimGeometry, trimMaterial);
roofRim.rotation.x = Math.PI / 2;
roofRim.position.y = 6.25;
roofRim.position.z = 0;
roofRim.castShadow = true;
scene.add(roofRim);

const finialGeometry = new THREE.SphereGeometry(0.18, 16, 10);
const finial = new THREE.Mesh(finialGeometry, trimMaterial);
finial.position.set(0, 8.82, 0);
finial.castShadow = true;
scene.add(finial);

const floorGeometry = new THREE.CircleGeometry(7.5, 64, -Math.PI / 2, Math.PI);
const floor = new THREE.Mesh(
  floorGeometry,
  new THREE.MeshStandardMaterial({ color: 0x6a6256, roughness: 0.96 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0.01;
floor.position.z = 0.2;
floor.receiveShadow = true;
scene.add(floor);

const altarTop = new THREE.Mesh(
  new THREE.BoxGeometry(2.0, 0.18, 0.72),
  trimMaterial
);
altarTop.position.set(0, 1.18, 4.2);
altarTop.castShadow = true;
altarTop.receiveShadow = true;
scene.add(altarTop);

const altarBody = new THREE.Mesh(
  new THREE.BoxGeometry(1.5, 1.05, 0.52),
  stoneMaterials[2]
);
altarBody.position.set(0, 0.62, 4.2);
altarBody.castShadow = true;
altarBody.receiveShadow = true;
scene.add(altarBody);

const crossVertical = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.95, 0.08), woodMaterial);
crossVertical.position.set(0, 1.86, 4.18);
crossVertical.castShadow = true;
scene.add(crossVertical);

const crossHorizontal = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.12, 0.08), woodMaterial);
crossHorizontal.position.set(0, 2.02, 4.18);
crossHorizontal.castShadow = true;
scene.add(crossHorizontal);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(70, 70),
  new THREE.MeshStandardMaterial({ color: 0x202722, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.04;
ground.receiveShadow = true;
scene.add(ground);

const hemisphere = new THREE.HemisphereLight(0xb9c9d4, 0x27251f, 1.75);
scene.add(hemisphere);

const sun = new THREE.DirectionalLight(0xffd6a3, 3.4);
sun.position.set(-10, 15, -11);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -13;
sun.shadow.camera.right = 13;
sun.shadow.camera.top = 17;
sun.shadow.camera.bottom = -4;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 40;
scene.add(sun);

const interiorLight = new THREE.PointLight(0xffc47c, 2.3, 15, 2);
interiorLight.position.set(0, 3.0, 3.9);
interiorLight.castShadow = true;
scene.add(interiorLight);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
