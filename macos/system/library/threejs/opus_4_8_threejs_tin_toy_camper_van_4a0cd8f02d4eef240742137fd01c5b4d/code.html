<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   Renderer / Scene / Camera
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171b);
scene.fog = new THREE.Fog(0x15171b, 18, 46);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(6.2, 3.4, 7.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 4.5;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 1.15, 0);

/* ============================================================
   Lighting: hemi ambient + key + fill + rim
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xbfd4e6, 0x2a2620, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2dd, 2.5);
key.position.set(6.5, 8.5, 5.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 32;
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -8;
key.shadow.bias = -0.0006;
key.shadow.normalBias = 0.02;
key.shadow.radius = 2.5;
scene.add(key);

const fill = new THREE.DirectionalLight(0xa9c8e8, 0.75);
fill.position.set(-7, 4.2, 4.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9b0, 1.25);
rim.position.set(-3.5, 5.0, -8.0);
scene.add(rim);

const bounce = new THREE.PointLight(0xffe9cf, 0.35, 18, 2.0);
bounce.position.set(0, 0.5, 3.5);
scene.add(bounce);

/* ============================================================
   Shadow-catcher ground
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(70, 70),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   Procedural lithographed-tin textures (canvas based)
   ============================================================ */
const TAU = Math.PI * 2;

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function finishTexture(canvas, repX, repY) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repX || 1, repY || 1);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.colorSpace = THREE.SRGBColorSpace;
  t.needsUpdate = true;
  return t;
}

// deterministic pseudo random
let seed = 1337;
function rnd() {
  seed = (seed * 1664525 + 1013904223) % 4294967296;
  return seed / 4294967296;
}

// Faint litho printing noise + speckle wear, drawn onto a 2D ctx
function addLithoWear(ctx, w, h, amount) {
  const a = amount === undefined ? 1 : amount;
  // fine printing grain
  const grains = Math.floor(w * h * 0.012 * a);
  for (let i = 0; i < grains; i++) {
    const x = rnd() * w, y = rnd() * h;
    const v = rnd();
    ctx.fillStyle = v > 0.5
      ? 'rgba(255,255,255,' + (0.05 + rnd() * 0.09).toFixed(3) + ')'
      : 'rgba(90,80,70,' + (0.04 + rnd() * 0.08).toFixed(3) + ')';
    ctx.fillRect(x, y, 1 + rnd() * 1.4, 1 + rnd() * 1.4);
  }
  // scuffed patches
  for (let i = 0; i < Math.floor(26 * a); i++) {
    const x = rnd() * w, y = rnd() * h;
    const r = 6 + rnd() * 34;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const dark = rnd() > 0.55;
    g.addColorStop(0, dark ? 'rgba(120,108,92,0.16)' : 'rgba(255,252,240,0.16)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
  }
  // tiny chipped-paint flecks showing bare tin
  for (let i = 0; i < Math.floor(90 * a); i++) {
    const x = rnd() * w, y = rnd() * h;
    ctx.fillStyle = 'rgba(176,176,170,' + (0.10 + rnd() * 0.30).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(x, y, 0.8 + rnd() * 2.4, 0.6 + rnd() * 1.8, rnd() * TAU, 0, TAU);
    ctx.fill();
  }
}

function drawRivetRow(ctx, x0, y0, x1, y1, count, r) {
  for (let i = 0; i < count; i++) {
    const t = count === 1 ? 0.5 : i / (count - 1);
    const x = x0 + (x1 - x0) * t;
    const y = y0 + (y1 - y0) * t;
    const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, 0, x, y, r);
    g.addColorStop(0, 'rgba(255,255,255,0.75)');
    g.addColorStop(0.55, 'rgba(190,186,176,0.42)');
    g.addColorStop(1, 'rgba(70,66,60,0.30)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(60,56,50,0.28)';
    ctx.lineWidth = 0.7;
    ctx.stroke();
  }
}

function drawSeam(ctx, x0, y0, x1, y1, width) {
  ctx.save();
  ctx.strokeStyle = 'rgba(96,90,80,0.30)';
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = Math.max(1, width * 0.5);
  ctx.beginPath();
  ctx.moveTo(x0, y0 - width * 0.7);
  ctx.lineTo(x1, y1 - width * 0.7);
  ctx.stroke();
  ctx.restore();
}

/* ---- Main body litho: cream upper / mint lower with red pinstripes ---- */
function makeBodyTexture() {
  const W = 1024, H = 512;
  const c = makeCanvas(W, H);
  const ctx = c.getContext('2d');

  // cream base
  const base = ctx.createLinearGradient(0, 0, 0, H);
  base.addColorStop(0, '#f6efdc');
  base.addColorStop(0.5, '#f2e8d2');
  base.addColorStop(1, '#ece0c8');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, W, H);

  // mint lower half (belt line at ~52%)
  const beltY = H * 0.52;
  const mint = ctx.createLinearGradient(0, beltY, 0, H);
  mint.addColorStop(0, '#a9dcc6');
  mint.addColorStop(0.55, '#93cfb7');
  mint.addColorStop(1, '#7cbda4');
  ctx.fillStyle = mint;
  ctx.fillRect(0, beltY, W, H - beltY);

  // soft wavy edge on the paint split (hand-litho feel)
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, beltY);
  for (let x = 0; x <= W; x += 16) {
    ctx.lineTo(x, beltY + Math.sin(x * 0.021) * 2.2);
  }
  ctx.lineTo(W, beltY - 6);
  ctx.lineTo(0, beltY - 6);
  ctx.closePath();
  ctx.fillStyle = 'rgba(240,232,210,0.55)';
  ctx.fill();
  ctx.restore();

  // faded red pinstripes along the belt line
  function pinstripe(y, w, alpha) {
    ctx.save();
    ctx.strokeStyle = 'rgba(196,62,54,' + alpha + ')';
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(0, y);
    for (let x = 0; x <= W; x += 12) {
      ctx.lineTo(x, y + Math.sin(x * 0.018 + y) * 0.9);
    }
    ctx.stroke();
    ctx.restore();
  }
  pinstripe(beltY - 12, 7, 0.72);
  pinstripe(beltY - 2.5, 2.6, 0.45);
  pinstripe(H * 0.86, 4.5, 0.4);

  // faint mint-on-cream accent stripe up top
  ctx.save();
  ctx.strokeStyle = 'rgba(140,200,180,0.30)';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(0, H * 0.13);
  ctx.lineTo(W, H * 0.13);
  ctx.stroke();
  ctx.restore();

  // printed rivet seams: horizontal rows
  drawRivetRow(ctx, 8, H * 0.055, W - 8, H * 0.055, 46, 2.6);
  drawRivetRow(ctx, 8, beltY + 16, W - 8, beltY + 16, 46, 2.6);
  drawRivetRow(ctx, 8, H * 0.955, W - 8, H * 0.955, 46, 2.6);

  // vertical panel seams with rivets
  const seamXs = [W * 0.13, W * 0.34, W * 0.5, W * 0.66, W * 0.87];
  for (let i = 0; i < seamXs.length; i++) {
    const x = seamXs[i];
    drawSeam(ctx, x, 6, x, H - 6, 3);
    drawRivetRow(ctx, x, 20, x, H - 20, 14, 2.3);
  }

  // small printed "MADE IN JAPAN"-ish maker mark
  ctx.save();
  ctx.fillStyle = 'rgba(120,60,52,0.5)';
  ctx.font = 'bold 15px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('CAMPER  DE  LUXE', W * 0.5, H * 0.30);
  ctx.font = '11px monospace';
  ctx.fillStyle = 'rgba(110,110,105,0.45)';
  ctx.fillText('TIN  TOY  CO.   No. 47', W * 0.5, H * 0.375);
  ctx.restore();

  addLithoWear(ctx, W, H, 1.0);
  return finishTexture(c, 1, 1);
}

/* ---- Roof litho: cream with dented, worn look ---- */
function makeRoofTexture() {
  const W = 512, H = 512;
  const c = makeCanvas(W, H);
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, '#f7f1e0');
  g.addColorStop(0.5, '#efe6cf');
  g.addColorStop(1, '#e6dbc2');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // faded red center pinstripe pair running lengthwise
  ctx.strokeStyle = 'rgba(190,66,56,0.30)';
  ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(W * 0.44, 0); ctx.lineTo(W * 0.44, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W * 0.56, 0); ctx.lineTo(W * 0.56, H); ctx.stroke();

  drawRivetRow(ctx, W * 0.10, 10, W * 0.10, H - 10, 20, 2.4);
  drawRivetRow(ctx, W * 0.90, 10, W * 0.90, H - 10, 20, 2.4);
  drawSeam(ctx, W * 0.10, 8, W * 0.10, H - 8, 2.5);
  drawSeam(ctx, W * 0.90, 8, W * 0.90, H - 8, 2.5);

  addLithoWear(ctx, W, H, 1.35);
  return finishTexture(c, 1, 1);
}

/* ---- License plate texture ---- */
function makePlateTexture(text) {
  const W = 256, H = 128;
  const c = makeCanvas(W, H);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#e9e4d4';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(40,58,48,0.85)';
  ctx.lineWidth = 7;
  ctx.strokeRect(9, 9, W - 18, H - 18);
  ctx.fillStyle = '#2f4a3c';
  ctx.font = 'bold 54px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, W * 0.5, H * 0.54);
  ctx.font = '13px monospace';
  ctx.fillStyle = 'rgba(60,70,62,0.75)';
  ctx.fillText('TIN TOY STATE', W * 0.5, H * 0.16);
  addLithoWear(ctx, W, H, 0.5);
  return finishTexture(c, 1, 1);
}

/* ---- Tire rubber-look bump-ish texture (used as map, dark) ---- */
function makeTireTexture() {
  const W = 512, H = 128;
  const c = makeCanvas(W, H);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#25262a';
  ctx.fillRect(0, 0, W, H);
  // tread blocks
  for (let i = 0; i < 40; i++) {
    const x = (i / 40) * W;
    ctx.fillStyle = i % 2 === 0 ? '#303237' : '#1e1f23';
    ctx.fillRect(x, H * 0.18, W / 40 - 1.5, H * 0.64);
  }
  // sidewall bands
  ctx.fillStyle = '#2a2b30';
  ctx.fillRect(0, 0, W, H * 0.18);
  ctx.fillRect(0, H * 0.82, W, H * 0.18);
  ctx.fillStyle = 'rgba(200,198,190,0.10)';
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('T I N   T O Y   B A L L O O N', W * 0.25, H * 0.10);
  ctx.fillText('T I N   T O Y   B A L L O O N', W * 0.75, H * 0.10);
  addLithoWear(ctx, W, H, 0.35);
  return finishTexture(c, 1, 1);
}

const bodyTex = makeBodyTexture();
const roofTex = makeRoofTexture();
const tireTex = makeTireTexture();
const plateFrontTex = makePlateTexture('TT-47');
const plateRearTex = makePlateTexture('TT-47');

/* ============================================================
   Materials
   ============================================================ */
const matBodyLitho = new THREE.MeshPhysicalMaterial({
  map: bodyTex,
  color: 0xffffff,
  metalness: 0.62,
  roughness: 0.33,
  clearcoat: 0.55,
  clearcoatRoughness: 0.28,
  envMapIntensity: 0.9
});

const matRoofLitho = new THREE.MeshPhysicalMaterial({
  map: roofTex,
  metalness: 0.6,
  roughness: 0.34,
  clearcoat: 0.5,
  clearcoatRoughness: 0.3
});

const matCream = new THREE.MeshPhysicalMaterial({
  color: 0xf2e7cf, metalness: 0.55, roughness: 0.35, clearcoat: 0.5, clearcoatRoughness: 0.3
});
const matMint = new THREE.MeshPhysicalMaterial({
  color: 0x8ecdb4, metalness: 0.55, roughness: 0.34, clearcoat: 0.5, clearcoatRoughness: 0.28
});
const matRed = new THREE.MeshStandardMaterial({
  color: 0xc0453c, metalness: 0.45, roughness: 0.42
});
const matChrome = new THREE.MeshStandardMaterial({
  color: 0xd9dbe0, metalness: 1.0, roughness: 0.18
});
const matChromeDull = new THREE.MeshStandardMaterial({
  color: 0xb6b9bf, metalness: 0.95, roughness: 0.34
});
const matTinBare = new THREE.MeshStandardMaterial({
  color: 0x9aa0a4, metalness: 0.9, roughness: 0.42
});
const matGlass = new THREE.MeshPhysicalMaterial({
  color: 0xbcd8e2, metalness: 0.1, roughness: 0.08,
  transmission: 0.82, thickness: 0.25, transparent: true, opacity: 0.55,
  clearcoat: 1.0, clearcoatRoughness: 0.05, ior: 1.45
});
const matRubber = new THREE.MeshStandardMaterial({
  map: tireTex, color: 0xffffff, metalness: 0.0, roughness: 0.85
});
const matRubberPlain = new THREE.MeshStandardMaterial({
  color: 0x26272b, metalness: 0.0, roughness: 0.88
});
const matLamp = new THREE.MeshPhysicalMaterial({
  color: 0xfff6d8, metalness: 0.1, roughness: 0.12,
  emissive: 0xffe9b0, emissiveIntensity: 0.55,
  clearcoat: 1.0, clearcoatRoughness: 0.05
});
const matLampRed = new THREE.MeshPhysicalMaterial({
  color: 0xd8483c, metalness: 0.1, roughness: 0.15,
  emissive: 0x8a1d14, emissiveIntensity: 0.5, clearcoat: 1.0
});
const matDark = new THREE.MeshStandardMaterial({ color: 0x2b2c30, metalness: 0.4, roughness: 0.6 });

function plateMat(tex) {
  return new THREE.MeshStandardMaterial({ map: tex, metalness: 0.35, roughness: 0.5 });
}

/* ============================================================
   Helpers
   ============================================================ */
function markShadows(obj) {
  obj.traverse(function (o) {
    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
  });
}

// Rounded box via extruded rounded rect (profile in XY, extruded along Z)
function roundedBoxGeometry(w, h, d, r, bevel) {
  const rr = Math.min(r, w * 0.5 - 0.001, h * 0.5 - 0.001);
  const shape = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  shape.moveTo(x + rr, y);
  shape.lineTo(x + w - rr, y);
  shape.quadraticCurveTo(x + w, y, x + w, y + rr);
  shape.lineTo(x + w, y + h - rr);
  shape.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  shape.lineTo(x + rr, y + h);
  shape.quadraticCurveTo(x, y + h, x, y + h - rr);
  shape.lineTo(x, y + rr);
  shape.quadraticCurveTo(x, y, x + rr, y);

  const bev = bevel === undefined ? Math.min(0.06, d * 0.2) : bevel;
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: d - bev * 2,
    bevelEnabled: bev > 0.0005,
    bevelThickness: bev,
    bevelSize: bev,
    bevelSegments: 4,
    curveSegments: 16
  });
  geo.translate(0, 0, -(d - bev * 2) / 2);
  geo.computeVertexNormals();
  return geo;
}

// Extrude an arbitrary closed 2D profile (array of [x,y]) along Z with rounded bevel
function profileExtrude(points, depth, bevel, curveSeg) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
  shape.closePath();
  const bev = bevel;
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: depth - bev * 2,
    bevelEnabled: true,
    bevelThickness: bev,
    bevelSize: bev,
    bevelSegments: 5,
    curveSegments: curveSeg || 12
  });
  geo.translate(0, 0, -(depth - bev * 2) / 2);
  geo.computeVertexNormals();
  return geo;
}

/* ============================================================
   THE VAN
   ============================================================ */
const van = new THREE.Group();
scene.add(van);

// Dimensions (toy scale, meters-ish): length along X, width along Z, height Y
const LEN = 4.30;   // total body length
const WID = 2.00;   // body width
const WHEEL_R = 0.44;
const WHEEL_W = 0.34;
const AXLE_Y = WHEEL_R;             // wheel center height
const FLOOR_Y = 0.36;               // bottom of body shell

/* ---------- 1. Main body shell: rounded silhouette profile ----------
   Profile drawn in X (length) / Y (height), extruded along Z (width).
   Bulbous nose at +X (front). */
const bodyPts = [];
(function buildBodyProfile() {
  const noseX = LEN * 0.5;
  const tailX = -LEN * 0.5;
  const yBot = FLOOR_Y;
  const yTop = 2.32;

  // start bottom-rear, go forward along the underside
  bodyPts.push([tailX + 0.10, yBot]);
  bodyPts.push([-1.10, yBot - 0.03]);
  bodyPts.push([0.30, yBot - 0.03]);
  bodyPts.push([1.42, yBot + 0.01]);
  // bulbous nose sweep upward
  bodyPts.push([1.86, yBot + 0.10]);
  bodyPts.push([noseX - 0.08, yBot + 0.34]);
  bodyPts.push([noseX + 0.02, yBot + 0.62]);
  bodyPts.push([noseX + 0.05, yBot + 0.92]);
  bodyPts.push([noseX - 0.02, yBot + 1.16]);
  // windshield rake
  bodyPts.push([1.92, yBot + 1.40]);
  bodyPts.push([1.62, 1.86]);
  bodyPts.push([1.44, 2.10]);
  // roof line front corner
  bodyPts.push([1.26, yTop - 0.06]);
  bodyPts.push([0.90, yTop]);
  // roofline with a gentle mid-century sag + slight dent handled by vertex noise later
  bodyPts.push([0.20, yTop + 0.015]);
  bodyPts.push([-0.55, yTop + 0.01]);
  bodyPts.push([-1.30, yTop - 0.01]);
  bodyPts.push([-1.72, yTop - 0.05]);
  // rear rounded corner
  bodyPts.push([tailX + 0.06, 2.10]);
  bodyPts.push([tailX - 0.05, 1.80]);
  bodyPts.push([tailX - 0.09, 1.30]);
  bodyPts.push([tailX - 0.05, 0.85]);
  bodyPts.push([tailX + 0.02, yBot + 0.16]);
})();

const bodyGeo = profileExtrude(bodyPts, WID, 0.16, 22);

// Gentle barrel-bulge on the sides + subtle roof dent → tin-toy charm
(function deformBody() {
  const pos = bodyGeo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const halfW = WID * 0.5;
    const zn = THREE.MathUtils.clamp(v.z / halfW, -1, 1);
    // barrel out the flanks, strongest at mid-height
    const hFactor = Math.sin(THREE.MathUtils.clamp((v.y - FLOOR_Y) / (2.32 - FLOOR_Y), 0, 1) * Math.PI);
    const bulge = 1.0 + 0.055 * hFactor * (1 - zn * zn);
    v.z *= bulge;

    // taper the nose & tail inwards slightly (rounded plan view)
    const xn = THREE.MathUtils.clamp(v.x / (LEN * 0.5), -1, 1);
    const taper = 1.0 - 0.10 * Math.pow(Math.abs(xn), 3.0);
    v.z *= taper;

    // slightly dented roofline: shallow dish near the rear-middle of the roof
    if (v.y > 2.16) {
      const dx = v.x + 0.55;
      const dz = v.z - 0.28;
      const d = Math.sqrt(dx * dx * 0.55 + dz * dz * 1.1);
      const dent = Math.exp(-d * d * 1.5) * 0.055;
      v.y -= dent;
      // a second smaller ding near the front-left roof edge
      const dx2 = v.x - 0.75, dz2 = v.z + 0.62;
      const d2 = Math.sqrt(dx2 * dx2 + dz2 * dz2);
      v.y -= Math.exp(-d2 * d2 * 6.0) * 0.035;
    }
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  pos.needsUpdate = true;
  bodyGeo.computeVertexNormals();
})();

// Body UVs: extrude geometry side-faces get generated UVs based on world-ish coords.
// Re-map UVs planarly from X (u) and Y (v) so the litho stripes wrap horizontally.
(function remapBodyUV() {
  const pos = bodyGeo.attributes.position;
  const uv = bodyGeo.attributes.uv;
  const minX = -LEN * 0.5 - 0.2, maxX = LEN * 0.5 + 0.2;
  const minY = FLOOR_Y - 0.15, maxY = 2.40;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const nz = Math.abs(z) / (WID * 0.5);
    // On side faces use X; on the front/back caps blend to Z so it doesn't smear badly.
    const u = ((x - minX) / (maxX - minX)) * 0.98 + 0.01;
    const v = ((y - minY) / (maxY - minY)) * 0.98 + 0.01;
    uv.setXY(i, u + (1 - nz) * 0.0, v);
  }
  uv.needsUpdate = true;
})();

    const shape = new THREE.Shape();
    shape.moveTo(0.0, 0.0);
    shape.bezierCurveTo(0.10, 0.10, 0.30, 0.16, 0.36, 0.05);
    shape.bezierCurveTo(0.42, -0.06, 0.28, -0.16, 0.14, -0.11);
    shape.bezierCurveTo(0.07, -0.08, 0.03, -0.04, 0.0, 0.0);
    const g = new THREE.ExtrudeGeometry(shape, {
      depth: 0.030,
      bevelEnabled: true,
      bevelThickness: 0.012,
      bevelSize: 0.012,
      bevelSegments: 3,
      curveSegments: 20
    });
    g.center();
    g.computeVertexNormals();
    return g;
  }
  const wg = wingGeometry();
  for (let i = 0; i < 2; i++) {
    const wing = new THREE.Mesh(wg, matChrome);
    wing.rotation.z = i * Math.PI;
    wing.position.set(Math.cos(i * Math.PI) * 0.19, Math.sin(i * Math.PI) * 0.19, -0.28);
    key.add(wing);
  }
  // wing hub
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.06, 18), matChrome);
  hub.rotation.x = Math.PI / 2;
  hub.position.z = -0.28;
  key.add(hub);
  const hubCap = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 12), matChrome);
  hubCap.position.z = -0.315;
  key.add(hubCap);

  key.position.set(-0.70, 1.02, zSide);
  keyGroup.add(key);
  keyGroup.userData.key = key;

  van.add(keyGroup);
  van.userData.windupKey = key;
})();

/* ---------- 9. Wheels: chunky rubber-look tires ---------- */
const wheels = [];
(function addWheels() {
  const half = WID * 0.5;
  const xs = [1.30, -1.28];

  for (let i = 0; i < xs.length; i++) {
    for (let s = -1; s <= 1; s += 2) {
      const w = new THREE.Group();

      // tire: torus-ish chunky look built from a lathe for a fat rounded profile
      const profile = [];
      const rInner = 0.255, rOuter = WHEEL_R, hw = WHEEL_W * 0.5;
      profile.push(new THREE.Vector2(rInner, -hw + 0.02));
      profile.push(new THREE.Vector2(rInner + 0.03, -hw));
      profile.push(new THREE.Vector2(rOuter - 0.09, -hw - 0.005));
      profile.push(new THREE.Vector2(rOuter - 0.015, -hw * 0.62));
      profile.push(new THREE.Vector2(rOuter, -hw * 0.22));
      profile.push(new THREE.Vector2(rOuter, hw * 0.22));
      profile.push(new THREE.Vector2(rOuter - 0.015, hw * 0.62));
      profile.push(new THREE.Vector2(rOuter - 0.09, hw + 0.005));
      profile.push(new THREE.Vector2(rInner + 0.03, hw));
      profile.push(new THREE.Vector2(rInner, hw - 0.02));
      const tireGeo = new THREE.LatheGeometry(profile, 44);
      const tire = new THREE.Mesh(tireGeo, matRubber);
      w.add(tire);

      // inner sidewall fill so the lathe isn't see-through
      const sidewall = new THREE.Mesh(
        new THREE.CylinderGeometry(rInner + 0.005, rInner + 0.005, WHEEL_W * 0.96, 32),
        matRubberPlain
      );
      w.add(sidewall);

      // chrome hubcap (domed, mid-century)
      const capOuter = new THREE.Mesh(
        new THREE.SphereGeometry(0.245, 28, 18, 0, TAU, 0, Math.PI * 0.42),
        matChrome
      );
      capOuter.scale.set(1, 0.42, 1);
      capOuter.position.y = WHEEL_W * 0.46;
      w.add(capOuter);

      const capDisc = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.04, 32), matChromeDull);
      capDisc.position.y = WHEEL_W * 0.44;
      w.add(capDisc);

      // red center dot
      const dot = new THREE.Mesh(new THREE.SphereGeometry(0.055, 16, 12), matRed);
      dot.position.y = WHEEL_W * 0.46 + 0.085;
      dot.scale.set(1, 0.7, 1);
      w.add(dot);

      // three tiny lug bumps
      for (let k = 0; k < 5; k++) {
        const a = (k / 5) * TAU;
        const lug = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 8), matChromeDull);
        lug.position.set(Math.cos(a) * 0.155, WHEEL_W * 0.47 + 0.038, Math.sin(a) * 0.155);
        w.add(lug);
      }

      // orient: lathe axis is Y → rotate so it spins about Z
      w.rotation.x = Math.PI / 2;
      w.rotation.z = 0;
      w.position.set(xs[i], AXLE_Y, s * (half * 0.94));
      if (s < 0) w.rotation.x = -Math.PI / 2;

      van.add(w);
      wheels.push(w);
    }
  }

  // simple axles between wheels
  for (let i = 0; i < xs.length; i++) {
    const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, WID * 0.92, 12), matTinBare);
    axle.rotation.x = Math.PI / 2;
    axle.position.set(xs[i], AXLE_Y, 0);
    van.add(axle);
  }

  // underbody pan so you don't see through the shell from below
  const pan = new THREE.Mesh(roundedBoxGeometry(3.90, 0.10, WID * 0.90, 0.10, 0.03), matTinBare);
  pan.position.set(-0.05, FLOOR_Y - 0.02, 0);
  van.add(pan);
})();

/* ---------- 10. Small printed rivet studs along the belt (3D accents) ---------- */
(function addRivetStuds() {
  const half = WID * 0.5;
  const studGeo = new THREE.SphereGeometry(0.017, 8, 6);
  for (let s = -1; s <= 1; s += 2) {
    for (let i = 0; i < 22; i++) {
      const t = i / 21;
      const x = THREE.MathUtils.lerp(-1.95, 1.80, t);
      const y = 0.60;
      const xn = Math.abs(x) / (LEN * 0.5);
      const z = s * (half * (1.0 + 0.030) * (1 - 0.10 * Math.pow(xn, 3)) + 0.010);
      const stud = new THREE.Mesh(studGeo, matChromeDull);
      stud.position.set(x, y, z);
      van.add(stud);
    }
  }
})();

markShadows(van);

// Center the whole van horizontally and sit it on the ground
(function centerVan() {
  const box = new THREE.Box3().setFromObject(van);
  const center = new THREE.Vector3();
  box.getCenter(center);
  van.position.x -= center.x;
  van.position.z -= center.z;
  van.position.y -= box.min.y;
  const size = new THREE.Vector3();
  box.getSize(size);
  controls.target.set(0, size.y * 0.48, 0);
  controls.update();
})();

/* ============================================================
   Animate
   ============================================================ */
let last = 0;
function animate(now) {
  const t = now * 0.001;
  const dt = Math.min(0.05, t - last);
  last = t;

  const k = van.userData.windupKey;
  if (k) k.rotation.z -= dt * 1.6;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>
</body>
