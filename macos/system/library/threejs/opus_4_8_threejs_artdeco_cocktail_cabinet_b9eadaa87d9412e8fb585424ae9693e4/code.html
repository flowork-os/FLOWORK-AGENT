<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Art-Deco Cocktail Cabinet</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14161a; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font-family: "Futura", "Century Gothic", "Helvetica Neue", Arial, sans-serif;
    font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase;
    color: rgba(226, 200, 140, 0.55); pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="hint">Art&nbsp;Deco Cocktail Cabinet &middot; drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ */
/*  Renderer / Scene / Camera                                          */
/* ------------------------------------------------------------------ */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171b);
scene.fog = new THREE.Fog(0x15171b, 7.5, 20);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(2.55, 1.85, 3.65);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.target.set(0, 1.05, 0);
controls.minDistance = 2.2;
controls.maxDistance = 11;
controls.maxPolarAngle = Math.PI * 0.495;
controls.update();

/* ------------------------------------------------------------------ */
/*  Environment map (procedural studio, no external assets)            */
/* ------------------------------------------------------------------ */

function makeStudioEnvironment() {
  const envScene = new THREE.Scene();

  // Large gradient dome
  const domeGeo = new THREE.SphereGeometry(30, 32, 24);
  const domeMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      topColor:    { value: new THREE.Color(0x2a2e36) },
      midColor:    { value: new THREE.Color(0x14161a) },
      bottomColor: { value: new THREE.Color(0x090a0c) }
    },
    vertexShader: /* glsl */`
      varying vec3 vPos;
      void main() {
        vPos = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      varying vec3 vPos;
      uniform vec3 topColor;
      uniform vec3 midColor;
      uniform vec3 bottomColor;
      void main() {
        float h = vPos.y * 0.5 + 0.5;
        vec3 c = mix(bottomColor, midColor, smoothstep(0.0, 0.5, h));
        c = mix(c, topColor, smoothstep(0.5, 1.0, h));
        gl_FragColor = vec4(c, 1.0);
      }
    `
  });
  envScene.add(new THREE.Mesh(domeGeo, domeMat));

  // Soft-box emitters that give brass / lacquer their highlights
  const boxes = [
    { p: [ 6,  7,  5], s: [7, 5], c: 0xfff2dd, i: 8.0 },
    { p: [-7,  5, -3], s: [6, 6], c: 0xbfd4ff, i: 3.2 },
    { p: [ 0,  4, -9], s: [9, 4], c: 0xffd9a0, i: 3.0 },
    { p: [-4,  2,  8], s: [5, 3], c: 0xffe8c8, i: 2.0 }
  ];
  for (const b of boxes) {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(b.s[0], b.s[1]),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(b.c).multiplyScalar(b.i), side: THREE.DoubleSide })
    );
    m.position.set(b.p[0], b.p[1], b.p[2]);
    m.lookAt(0, 1, 0);
    envScene.add(m);
  }

  // Warm floor bounce
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(20, 32),
    new THREE.MeshBasicMaterial({ color: 0x3a3025, side: THREE.DoubleSide })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.6;
  envScene.add(floor);

  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  const rt = pmrem.fromScene(envScene, 0.02);
  pmrem.dispose();
  domeGeo.dispose();
  domeMat.dispose();
  return rt.texture;
}

const envMap = makeStudioEnvironment();
scene.environment = envMap;

/* ------------------------------------------------------------------ */
/*  Materials                                                          */
/* ------------------------------------------------------------------ */

const MAT = {
  ebony: new THREE.MeshPhysicalMaterial({
    color: 0x0b0a0c,
    metalness: 0.05,
    roughness: 0.13,
    clearcoat: 1.0,
    clearcoatRoughness: 0.045,
    reflectivity: 0.6,
    envMapIntensity: 1.15
  }),
  ebonySide: new THREE.MeshPhysicalMaterial({
    color: 0x100e10,
    metalness: 0.05,
    roughness: 0.19,
    clearcoat: 0.9,
    clearcoatRoughness: 0.08,
    envMapIntensity: 0.95
  }),
  brass: new THREE.MeshStandardMaterial({
    color: 0xc79a49,
    metalness: 1.0,
    roughness: 0.16,
    envMapIntensity: 1.35
  }),
  brassDark: new THREE.MeshStandardMaterial({
    color: 0x9b7433,
    metalness: 1.0,
    roughness: 0.3,
    envMapIntensity: 1.1
  }),
  gold: new THREE.MeshStandardMaterial({
    color: 0xf0c463,
    metalness: 1.0,
    roughness: 0.09,
    envMapIntensity: 1.6
  }),
  mirror: new THREE.MeshPhysicalMaterial({
    color: 0xdfe6ea,
    metalness: 1.0,
    roughness: 0.035,
    envMapIntensity: 1.9
  }),
  ivory: new THREE.MeshPhysicalMaterial({
    color: 0xe9dfc6,
    metalness: 0.0,
    roughness: 0.28,
    clearcoat: 0.85,
    clearcoatRoughness: 0.1,
    envMapIntensity: 0.9
  }),
  macassar: new THREE.MeshPhysicalMaterial({
    color: 0x2a1a12,
    metalness: 0.08,
    roughness: 0.22,
    clearcoat: 0.9,
    clearcoatRoughness: 0.07,
    envMapIntensity: 1.0
  }),
  glass: new THREE.MeshPhysicalMaterial({
    color: 0xd8ecf2,
    metalness: 0.0,
    roughness: 0.04,
    transmission: 0.92,
    thickness: 0.08,
    ior: 1.5,
    transparent: true,
    opacity: 0.55,
    envMapIntensity: 1.4
  }),
  liquor: new THREE.MeshPhysicalMaterial({
    color: 0x7a3510,
    metalness: 0.0,
    roughness: 0.08,
    transmission: 0.6,
    thickness: 0.2,
    transparent: true,
    opacity: 0.85,
    envMapIntensity: 1.0
  }),
  felt: new THREE.MeshStandardMaterial({
    color: 0x5a1420,
    metalness: 0.0,
    roughness: 0.95,
    envMapIntensity: 0.5
  })
};

/* ------------------------------------------------------------------ */
/*  Small geometry helpers                                             */
/* ------------------------------------------------------------------ */

const DEG = Math.PI / 180;

function box(w, h, d, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function cyl(rt, rb, h, mat, seg = 32, capped = true) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg, 1, !capped), mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// A rounded / chamfered slab built from an extruded rounded rectangle.
function slab(w, h, d, r, mat, curveSeg = 4) {
  const s = new THREE.Shape();
  const hw = w / 2, hh = h / 2;
  const rr = Math.min(r, hw * 0.98, hh * 0.98);
  s.moveTo(-hw + rr, -hh);
  s.lineTo(hw - rr, -hh);
  s.quadraticCurveTo(hw, -hh, hw, -hh + rr);
  s.lineTo(hw, hh - rr);
  s.quadraticCurveTo(hw, hh, hw - rr, hh);
  s.lineTo(-hw + rr, hh);
  s.quadraticCurveTo(-hw, hh, -hw, hh - rr);
  s.lineTo(-hw, -hh + rr);
  s.quadraticCurveTo(-hw, -hh, -hw, -hh + rr);
  const g = new THREE.ExtrudeGeometry(s, {
    depth: d,
    bevelEnabled: true,
    bevelThickness: Math.min(0.006, d * 0.2),
    bevelSize: Math.min(0.006, d * 0.2),
    bevelSegments: 2,
    curveSegments: curveSeg
  });
  g.translate(0, 0, -d / 2);
  const m = new THREE.Mesh(g, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// Flat inlay wedge (a triangular ray of the sunburst), lying in XY plane.
function rayMesh(angle, halfWidth, length, mat, thickness) {
  const a0 = angle - halfWidth;
  const a1 = angle + halfWidth;
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.lineTo(Math.cos(a0) * length, Math.sin(a0) * length);
  shape.lineTo(Math.cos(angle) * length * 1.015, Math.sin(angle) * length * 1.015);
  shape.lineTo(Math.cos(a1) * length, Math.sin(a1) * length);
  shape.closePath();
  const g = new THREE.ExtrudeGeometry(shape, {
    depth: thickness, bevelEnabled: false, curveSegments: 1
  });
  const m = new THREE.Mesh(g, mat);
  m.castShadow = false;
  m.receiveShadow = true;
  return m;
}

/* ------------------------------------------------------------------ */
/*  The cabinet                                                        */
/* ------------------------------------------------------------------ */

const cabinet = new THREE.Group();
scene.add(cabinet);

// Master dimensions (metres) — a tall standing drinks cabinet.
const W = 1.02;          // body width
const D = 0.46;          // body depth
const LEG_H = 0.34;      // leg height
const BODY_H = 1.32;     // main cased body height
const BODY_Y0 = LEG_H;   // body bottom
const BODY_Y1 = BODY_Y0 + BODY_H;

/* ---------- Legs: slender, tapered, tipped in gold ---------------- */

function makeLeg(x, z) {
  const g = new THREE.Group();

  // Tapered square-ish shaft (fluted look via an octagonal profile).
  const shaftH = LEG_H - 0.055;
  const shaft = cyl(0.030, 0.052, shaftH, MAT.macassar, 8);
  shaft.position.y = 0.055 + shaftH / 2;
  shaft.rotation.y = Math.PI / 8;
  g.add(shaft);

  // Brass collar where the leg meets the carcase.
  const collar = cyl(0.058, 0.058, 0.028, MAT.brass, 8);
  collar.position.y = LEG_H - 0.014;
  collar.rotation.y = Math.PI / 8;
  g.add(collar);

  // Thin brass ring mid-shaft.
  const ring = cyl(0.040, 0.040, 0.012, MAT.brass, 8);
  ring.position.y = 0.055 + shaftH * 0.62;
  ring.rotation.y = Math.PI / 8;
  g.add(ring);

  // Gold sabot / tip.
  const tip = cyl(0.034, 0.026, 0.055, MAT.gold, 8);
  tip.position.y = 0.0275;
  tip.rotation.y = Math.PI / 8;
  g.add(tip);

  const foot = new THREE.Mesh(new THREE.SphereGeometry(0.026, 16, 10), MAT.gold);
  foot.position.y = 0.012;
  foot.scale.y = 0.55;
  foot.castShadow = true;
  g.add(foot);

  g.position.set(x, 0, z);
  return g;
}

const legInsetX = W / 2 - 0.085;
const legInsetZ = D / 2 - 0.075;
cabinet.add(makeLeg( legInsetX, legInsetZ));
cabinet.add(makeLeg(-legInsetX, legInsetZ));
cabinet.add(makeLeg( legInsetX, -legInsetZ));
cabinet.add(makeLeg(-legInsetX, -legInsetZ));

// Apron / plinth tying the legs together beneath the carcase.
{
  const apronH = 0.06;
  const apron = slab(W - 0.05, apronH, D - 0.05, 0.012, MAT.macassar);
  apron.rotation.x = 0;
  apron.position.set(0, BODY_Y0 - apronH / 2 - 0.004, 0);
  // slab() extrudes along Z; rebuild as simple box for the apron instead
  cabinet.remove(apron);
  const apronBox = box(W - 0.045, apronH, D - 0.045, MAT.macassar, 0, BODY_Y0 - apronH / 2 - 0.004, 0);
  cabinet.add(apronBox);

  const apronTrim = box(W - 0.02, 0.012, D - 0.02, MAT.brass, 0, BODY_Y0 - 0.006, 0);
  cabinet.add(apronTrim);
}

/* ---------- Main carcase ------------------------------------------ */

const carcase = new THREE.Group();
carcase.position.y = BODY_Y0;
cabinet.add(carcase);

// Core box (sides / back / top / bottom read as one lacquered case).
const core = box(W, BODY_H, D, MAT.ebonySide, 0, BODY_H / 2, 0);
carcase.add(core);

// Recessed interior cavity hint: a felt back panel just inside the doors.
{
  const back = box(W - 0.09, BODY_H - 0.12, 0.012, MAT.felt, 0, BODY_H / 2, -D / 2 + 0.055);
  carcase.add(back);
  const shelfY = [BODY_H * 0.34, BODY_H * 0.64];
  for (const y of shelfY) {
    const sh = box(W - 0.10, 0.018, D * 0.62, MAT.ebony, 0, y, -0.02);
    carcase.add(sh);
    const lip = box(W - 0.10, 0.008, 0.010, MAT.brass, 0, y + 0.012, -0.02 + D * 0.31);
    carcase.add(lip);
  }
}

/* ---------- Side panels: vertical brass fluting -------------------- */

function fluteBank(count, span, radius, height, mat) {
  const g = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const t = count === 1 ? 0.5 : i / (count - 1);
    const x = -span / 2 + t * span;
    const f = new THREE.Mesh(
      new THREE.CylinderGeometry(radius, radius, height, 14, 1, false, -Math.PI / 2, Math.PI),
      mat
    );
    f.position.x = x;
    f.castShadow = true;
    f.receiveShadow = true;
    g.add(f);
  }
  return g;
}

for (const sign of [1, -1]) {
  const bank = fluteBank(9, D - 0.10, 0.017, BODY_H - 0.10, MAT.brass);
  bank.rotation.y = sign > 0 ? Math.PI / 2 : -Math.PI / 2;
  bank.position.set(sign * (W / 2 + 0.004), BODY_H / 2, 0);
  carcase.add(bank);

  // Ebony field behind the fluting, slightly proud, plus top/bottom caps.
  const capTop = box(0.028, 0.036, D - 0.03, MAT.brassDark, sign * (W / 2 + 0.004), BODY_H - 0.032, 0);
  const capBot = box(0.028, 0.036, D - 0.03, MAT.brassDark, sign * (W / 2 + 0.004), 0.032, 0);
  carcase.add(capTop, capBot);
}

/* ---------- Front frame: polished brass fluted stiles -------------- */

const FRONT_Z = D / 2;

// Corner stiles (fluted brass columns) flanking the doors.
function frontStile(x) {
  const g = new THREE.Group();
  const h = BODY_H - 0.06;
  const col = fluteBank(3, 0.055, 0.0165, h, MAT.brass);
  col.position.set(x, BODY_H / 2, FRONT_Z + 0.010);
  g.add(col);

  const capT = box(0.10, 0.032, 0.052, MAT.brassDark, x, BODY_H - 0.014, FRONT_Z + 0.006);
  const capB = box(0.10, 0.032, 0.052, MAT.brassDark, x, 0.014, FRONT_Z + 0.006);
  g.add(capT, capB);
  return g;
}
carcase.add(frontStile(-(W / 2 - 0.055)));
carcase.add(frontStile(  W / 2 - 0.055));

// Horizontal brass rails top & bottom of the door opening.
const railTopY = BODY_H - 0.055;
const railBotY = 0.055;
carcase.add(box(W - 0.02, 0.030, 0.030, MAT.brass, 0, railTopY, FRONT_Z + 0.012));
carcase.add(box(W - 0.02, 0.030, 0.030, MAT.brass, 0, railBotY, FRONT_Z + 0.012));

/* ---------- Doors with symmetrical sunburst inlay ------------------ */

const DOOR_W = (W - 0.155) / 2;      // each door leaf width
const DOOR_H = railTopY - railBotY - 0.028;
const DOOR_CY = (railTopY + railBotY) / 2;
const DOOR_T = 0.032;

function makeDoorLeaf(side) {
  // side = -1 (left) or +1 (right); sunburst radiates from the centre seam.
  const g = new THREE.Group();

  const panel = slab(DOOR_W, DOOR_H, DOOR_T, 0.014, MAT.ebony, 3);
  panel.position.z = 0;
  g.add(panel);

  // Face plane where inlay sits.
  const faceZ = DOOR_T / 2 + 0.0015;

  // Sunburst origin at the inner-bottom corner of the leaf so the two
  // leaves together form one symmetrical fan across the double doors.
  const originX = side * (DOOR_W / 2) * 0.985;
  const originY = -DOOR_H / 2 + 0.055;

  const inlay = new THREE.Group();
  inlay.position.set(originX, originY, faceZ);
  g.add(inlay);

  const R = Math.sqrt(DOOR_W * DOOR_W + DOOR_H * DOOR_H) * 0.995;
  const rayCount = 11;
  const spanStart = 6 * DEG;
  const spanEnd   = 96 * DEG;

  for (let i = 0; i < rayCount; i++) {
    const t = (i + 0.5) / rayCount;
    // Base angle measured from the outward horizontal direction.
    const a = spanStart + t * (spanEnd - spanStart);
    const ang = side > 0 ? Math.PI - a : a;   // mirror for the right leaf
    const halfW = (2.05 - 1.15 * Math.sin(a)) * DEG;
    const isBrass = i % 2 === 0;
    const mat = isBrass ? MAT.brass : MAT.ivory;
    const th = isBrass ? 0.0032 : 0.0022;
    const ray = rayMesh(ang, halfW * 1.9, R, mat, th);
    inlay.add(ray);

    // Thin companion line for a finer deco cadence.
    if (isBrass) {
      const off = 5.4 * DEG * (side > 0 ? -1 : 1);
      const thin = rayMesh(ang + off, 0.75 * DEG, R * 0.93, MAT.gold, 0.0016);
      inlay.add(thin);
    }
  }

  // Concentric quarter-arcs banding the fan.
  for (const rr of [0.18, 0.34, 0.52]) {
    const arcG = new THREE.RingGeometry(rr, rr + 0.009, 64, 1,
      side > 0 ? Math.PI / 2 : 0, Math.PI / 2);
    const arc = new THREE.Mesh(arcG, MAT.gold);
    arc.position.set(0, 0, 0.0034);
    inlay.add(arc);
  }

  // Quarter-disc hub at the fan origin.
  const hub = new THREE.Mesh(
    new THREE.CircleGeometry(0.062, 40, side > 0 ? Math.PI / 2 : 0, Math.PI / 2),
    MAT.gold
  );
  hub.position.z = 0.004;
  inlay.add(hub);

  const hub2 = new THREE.Mesh(
    new THREE.CircleGeometry(0.040, 40, side > 0 ? Math.PI / 2 : 0, Math.PI / 2),
    MAT.mirror
  );
  hub2.position.z = 0.0048;
  inlay.add(hub2);

  // Mirror-gloss border framing each leaf.
  const bw = 0.016;
  const frameZ = DOOR_T / 2 + 0.0022;
  const fr = new THREE.Group();
  fr.add(box(DOOR_W - 0.02, bw, 0.004, MAT.brass, 0,  DOOR_H / 2 - 0.024, frameZ));
  fr.add(box(DOOR_W - 0.02, bw, 0.004, MAT.brass, 0, -DOOR_H / 2 + 0.024, frameZ));
  fr.add(box(bw, DOOR_H - 0.048, 0.004, MAT.brass,  DOOR_W / 2 - 0.024, 0, frameZ));
  fr.add(box(bw, DOOR_H - 0.048, 0.004, MAT.brass, -DOOR_W / 2 + 0.024, 0, frameZ));
  g.add(fr);

  // Vertical handle: slender fluted brass bar with gold caps, on the seam side.
  const hx = side * (DOOR_W / 2 - 0.052);
  const hGroup = new THREE.Group();
  const bar = cyl(0.011, 0.011, 0.30, MAT.gold, 16);
  bar.position.set(hx, 0.0, DOOR_T / 2 + 0.036);
  hGroup.add(bar);
  for (const sy of [1, -1]) {
    const stem = cyl(0.008, 0.008, 0.034, MAT.brass, 12);
    stem.rotation.x = Math.PI / 2;
    stem.position.set(hx, sy * 0.135, DOOR_T / 2 + 0.019);
    hGroup.add(stem);
    const cap = new THREE.Mesh(new THREE.SphereGeometry(0.0135, 16, 12), MAT.gold);
    cap.position.set(hx, sy * 0.157, DOOR_T / 2 + 0.036);
    cap.castShadow = true;
    hGroup.add(cap);
  }
  const escutcheon = box(0.036, 0.34, 0.006, MAT.brassDark, hx, 0, DOOR_T / 2 + 0.004);
  hGroup.add(escutcheon);
  g.add(hGroup);

  return g;
}

const doorsGroup = new THREE.Group();
doorsGroup.position.set(0, DOOR_CY, FRONT_Z + DOOR_T / 2 + 0.004);
carcase.add(doorsGroup);

const leftDoor = makeDoorLeaf(-1);
leftDoor.position.x = -(DOOR_W / 2 + 0.004);
doorsGroup.add(leftDoor);

const rightDoor = makeDoorLeaf(1);
rightDoor.position.x = DOOR_W / 2 + 0.004;
doorsGroup.add(rightDoor);

// Central seam bead.
doorsGroup.add(box(0.010, DOOR_H - 0.01, 0.012, MAT.gold, 0, 0, DOOR_T / 2 + 0.002));

/* ---------- Stepped ziggurat crown --------------------------------- */

const crown = new THREE.Group();
crown.position.y = BODY_Y1;
cabinet.add(crown);

const STEPS = [
  { w: W + 0.075, d: D + 0.075, h: 0.045 },
  { w: W + 0.030, d: D + 0.030, h: 0.030 },
  { w: W - 0.060, d: D - 0.020, h: 0.062 },
  { w: W - 0.215, d: D - 0.090, h: 0.058 },
  { w: W - 0.370, d: D - 0.160, h: 0.052 },
  { w: W - 0.520, d: D - 0.226, h: 0.044 }
];

let cy = 0;
STEPS.forEach((s, i) => {
  const tier = slab(s.w, s.h, s.d, 0.010, MAT.ebony, 3);
  // slab extrudes on Z: width=w, height=h, depth=d — matches our args.
  tier.position.set(0, cy + s.h / 2, 0);
  crown.add(tier);

  // Brass reveal capping each tier.
  const reveal = box(s.w + 0.010, 0.009, s.d + 0.010, MAT.brass, 0, cy + s.h - 0.004, 0);
  crown.add(reveal);

  // Front face detail: small stepped brass chevrons on the lower two tiers.
  if (i === 0) {
    for (let k = -2; k <= 2; k++) {
      const stripH = 0.020 + Math.abs(k) * 0.0;
      const st = box(0.020, stripH, 0.006, MAT.gold,
        k * 0.085, cy + s.h * 0.42, s.d / 2 + 0.004);
      crown.add(st);
    }
  }
  cy += s.h;
});

const CROWN_TOP = cy;

// Crowning finial: a stepped gold obelisk with a brass sphere.
{
  const f = new THREE.Group();
  f.position.y = CROWN_TOP;

  const p1 = box(0.115, 0.020, 0.115, MAT.gold, 0, 0.010, 0);
  const p2 = cyl(0.040, 0.052, 0.075, MAT.brass, 8);
  p2.position.y = 0.0575;
  p2.rotation.y = Math.PI / 8;
  const p3 = cyl(0.020, 0.036, 0.070, MAT.gold, 8);
  p3.position.y = 0.130;
  p3.rotation.y = Math.PI / 8;
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.030, 28, 20), MAT.mirror);
  ball.position.y = 0.185;
  ball.castShadow = true;

  f.add(p1, p2, p3, ball);
  crown.add(f);
}

// Stepped "wing" volutes flanking the crown (classic deco shoulders).
for (const sx of [1, -1]) {
  const wing = new THREE.Group();
  const tiers = [
    { w: 0.075, h: 0.042, x: 0.000 },
    { w: 0.060, h: 0.040, x: 0.010 },
    { w: 0.045, h: 0.036, x: 0.020 }
  ];
  let wy = STEPS[0].h + STEPS[1].h;
  tiers.forEach((t) => {
    const m = box(t.w, t.h, D - 0.09, MAT.brassDark,
      sx * (W / 2 - 0.045 - t.x), wy + t.h / 2, 0);
    wing.add(m);
    const cap = box(t.w + 0.008, 0.006, D - 0.08, MAT.gold,
      sx * (W / 2 - 0.045 - t.x), wy + t.h, 0);
    wing.add(cap);
    wy += t.h;
  });
  crown.add(wing);
}

/* ---------- Fold-down cocktail shelf hint & interior glitter -------- */
/* (kept inside the carcase silhouette; adds life without breaking the
   single-object rule — all of it is part of the one cabinet group)    */

{
  // A slim mirrored serving slide just under the crown, slightly proud.
  const slide = box(W - 0.16, 0.020, 0.055, MAT.mirror, 0, BODY_H - 0.10, FRONT_Z + 0.028);
  carcase.add(slide);
  const slideTrim = box(W - 0.15, 0.008, 0.010, MAT.gold, 0, BODY_H - 0.092, FRONT_Z + 0.052);
  carcase.add(slideTrim);
}

/* ---------- Base shadow-catcher contact plate ---------------------- */

cabinet.position.y = 0;

/* ------------------------------------------------------------------ */
/*  Ground plane (shadow only)                                         */
/* ------------------------------------------------------------------ */

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// Faint reflective floor disc for a studio feel (does not receive shadows
// strongly; kept very dark so the ShadowMaterial reads on top).
const floorDisc = new THREE.Mesh(
  new THREE.CircleGeometry(6, 64),
  new THREE.MeshStandardMaterial({
    color: 0x0e1013,
    metalness: 0.85,
    roughness: 0.42,
    envMapIntensity: 0.5
  })
);
floorDisc.rotation.x = -Math.PI / 2;
floorDisc.position.y = -0.002;
floorDisc.receiveShadow = true;
scene.add(floorDisc);

/* ------------------------------------------------------------------ */
/*  Lighting: hemisphere + key / fill / rim                            */
/* ------------------------------------------------------------------ */

const hemi = new THREE.HemisphereLight(0xbcd0ff, 0x2a1f14, 0.45);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff0d8, 2.5);
key.position.set(3.0, 4.4, 3.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 16;
key.shadow.camera.left = -2.2;
key.shadow.camera.right = 2.2;
key.shadow.camera.top = 2.8;
key.shadow.camera.bottom = -0.6;
key.shadow.bias = -0.0006;
key.shadow.normalBias = 0.012;
key.shadow.radius = 3;
key.target.position.set(0, 1.05, 0);
scene.add(key);
scene.add(key.target);

const fill = new THREE.DirectionalLight(0x9ab6e8, 0.55);
fill.position.set(-3.6, 2.2, 2.0);
fill.target.position.set(0, 1.0, 0);
scene.add(fill);
scene.add(fill.target);

const rim = new THREE.DirectionalLight(0xffcf8a, 1.5);
rim.position.set(-1.6, 2.9, -3.6);
rim.target.position.set(0, 1.2, 0);
scene.add(rim);
scene.add(rim.target);

// Warm accent grazing the brass fluting up close.
const accent = new THREE.PointLight(0xffc978, 6.5, 5.0, 2.0);
accent.position.set(1.15, 1.75, 1.25);
scene.add(accent);

const accent2 = new THREE.PointLight(0x86a8ff, 3.0, 4.5, 2.0);
accent2.position.set(-1.25, 0.85, 1.05);
scene.add(accent2);

/* ------------------------------------------------------------------ */
/*  Frame the object                                                   */
/* ------------------------------------------------------------------ */

{
  const bbox = new THREE.Box3().setFromObject(cabinet);
  const center = bbox.getCenter(new THREE.Vector3());
  controls.target.set(0, center.y, 0);
  controls.update();
}

/* ------------------------------------------------------------------ */
/*  Resize + render loop                                               */
/* ------------------------------------------------------------------ */

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
