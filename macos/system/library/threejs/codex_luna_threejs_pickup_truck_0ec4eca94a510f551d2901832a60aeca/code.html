<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Compact Pickup</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9eb7c3}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9db8c5);
scene.fog = new THREE.Fog(0x9db8c5, 18, 38);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.7, 5.4, 8.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.25, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 6;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.48;

const hemi = new THREE.HemisphereLight(0xdcecf2, 0x35434b, 2.1);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff1d5, 3.4);
sun.position.set(7, 11, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -10;
sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10;
sun.shadow.camera.bottom = -10;
sun.shadow.bias = -0.0005;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x9fc9e8, 1.1);
fill.position.set(-7, 5, -8);
scene.add(fill);

const groundMat = new THREE.MeshStandardMaterial({ color: 0x52665f, roughness: 0.92 });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

const paint = new THREE.MeshStandardMaterial({ color: 0x9d241b, metalness: 0.45, roughness: 0.28 });
const paintDark = new THREE.MeshStandardMaterial({ color: 0x651713, metalness: 0.35, roughness: 0.34 });
const black = new THREE.MeshStandardMaterial({ color: 0x101316, metalness: 0.15, roughness: 0.62 });
const rubber = new THREE.MeshStandardMaterial({ color: 0x111214, roughness: 0.9 });
const glass = new THREE.MeshStandardMaterial({ color: 0x172a35, metalness: 0.22, roughness: 0.16, transparent: true, opacity: 0.88 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xb8c2c2, metalness: 0.9, roughness: 0.18 });
const silver = new THREE.MeshStandardMaterial({ color: 0x879399, metalness: 0.85, roughness: 0.26 });
const lamp = new THREE.MeshStandardMaterial({ color: 0xfff3bd, emissive: 0xffb52e, emissiveIntensity: 1.9, roughness: 0.22 });
const redLamp = new THREE.MeshStandardMaterial({ color: 0x8e100d, emissive: 0x4c0000, emissiveIntensity: 1.1 });
const bedMat = new THREE.MeshStandardMaterial({ color: 0x373d3e, metalness: 0.32, roughness: 0.55 });

function box(name, size, position, material, rotation = [0, 0, 0]) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function cylinder(name, radius, depth, position, material, rotation = [Math.PI / 2, 0, 0], segments = 32) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, depth, segments), material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function torus(name, radius, tube, position, material) {
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 18, 48), material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.rotation.y = Math.PI / 2;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

box('lower body', [6.15, 0.82, 2.18], [0, 1.16, 0], paint);
box('front fender crown', [1.72, 0.34, 2.3], [2.05, 1.76, 0], paint);
box('hood', [1.82, 0.25, 2.12], [2.15, 2.22, 0], paint);
box('hood edge', [1.9, 0.09, 2.18], [2.15, 2.38, 0], paintDark);
box('front bumper', [0.26, 0.34, 2.38], [3.14, 0.72, 0], chrome);
box('front lower valance', [0.18, 0.42, 2.18], [3.02, 0.97, 0], black);

box('cab roof', [2.32, 0.22, 2.08], [0.65, 3.52, 0], paint);
box('cab rear pillar left', [0.25, 1.78, 0.25], [-0.43, 2.63, -0.94], paint);
box('cab rear pillar right', [0.25, 1.78, 0.25], [-0.43, 2.63, 0.94], paint);
box('cab front pillar left', [0.28, 1.7, 0.25], [1.58, 2.68, -0.94], paint);
box('cab front pillar right', [0.28, 1.7, 0.25], [1.58, 2.68, 0.94], paint);
box('cab belt left', [1.92, 0.25, 0.18], [0.58, 1.91, -1.04], paintDark);
box('cab belt right', [1.92, 0.25, 0.18], [0.58, 1.91, 1.04], paintDark);

box('left side window', [1.45, 1.16, 0.055], [0.57, 2.72, -1.055], glass, [0, 0, -0.035]);
box('right side window', [1.45, 1.16, 0.055], [0.57, 2.72, 1.055], glass, [0, 0, -0.035]);
box('windshield', [0.055, 1.35, 1.62], [1.53, 2.77, 0], glass, [0, 0, -0.11]);
box('rear cab glass', [0.055, 1.2, 1.55], [-0.31, 2.74, 0], glass, [0, 0, 0.08]);

box('left door seam', [0.035, 1.37, 0.025], [0.98, 1.28, -1.075], black);
box('right door seam', [0.035, 1.37, 0.025], [0.98, 1.28, 1.075], black);
box('left door handle', [0.24, 0.045, 0.045], [0.32, 2.05, -1.11], chrome);
box('right door handle', [0.24, 0.045, 0.045], [0.32, 2.05, 1.11], chrome);

box('left mirror arm', [0.25, 0.08, 0.08], [1.42, 2.35, -1.18], black);
box('right mirror arm', [0.25, 0.08, 0.08], [1.42, 2.35, 1.18], black);
box('left mirror', [0.18, 0.28, 0.12], [1.35, 2.48, -1.3], black);
box('right mirror', [0.18, 0.28, 0.12], [1.35, 2.48, 1.3], black);

box('bed floor', [2.72, 0.16, 1.94], [-1.84, 1.62, 0], bedMat);
box('bed left wall', [2.95, 1.08, 0.18], [-1.84, 2.17, -1.02], paint);
box('bed right wall', [2.95, 1.08, 0.18], [-1.84, 2.17, 1.02], paint);
box('bed front wall', [0.18, 1.08, 1.94], [-0.43, 2.17, 0], paint);
box('tailgate', [0.2, 1.0, 2.04], [-3.27, 2.03, 0], paint);
box('tailgate top rail', [0.28, 0.14, 2.18], [-3.3, 2.57, 0], chrome);
box('tailgate handle', [0.08, 0.1, 0.42], [-3.42, 2.24, 0], black);
box('bed left inner wall', [2.55, 0.07, 0.12], [-1.85, 2.48, -0.9], bedMat);
box('bed right inner wall', [2.55, 0.07, 0.12], [-1.85, 2.48, 0.9], bedMat);

box('front grille surround', [0.13, 0.62, 1.28], [3.16, 1.42, 0], black);
box('grille upper bar', [0.08, 0.08, 1.18], [3.24, 1.66, 0], chrome);
box('grille middle bar', [0.08, 0.08, 1.18], [3.24, 1.45, 0], chrome);
box('grille lower bar', [0.08, 0.08, 1.18], [3.24, 1.24, 0], chrome);
box('left headlight', [0.12, 0.32, 0.47], [3.18, 1.92, -0.78], lamp);
box('right headlight', [0.12, 0.32, 0.47], [3.18, 1.92, 0.78], lamp);
box('left rear lamp', [0.14, 0.35, 0.16], [-3.18, 1.83, -1.1], redLamp);
box('right rear lamp', [0.14, 0.35, 0.16], [-3.18, 1.83, 1.1], redLamp);

const wheelPositions = [
  [2.05, 0.69, -1.18], [2.05, 0.69, 1.18],
  [-2.08, 0.69, -1.18], [-2.08, 0.69, 1.18]
];

for (let wheelIndex = 0; wheelIndex < wheelPositions.length; wheelIndex++) {
  const wheelPosition = wheelPositions[wheelIndex];
  torus('rubber tire ' + wheelIndex, 0.57, 0.2, wheelPosition, rubber);
  cylinder('wheel rim ' + wheelIndex, 0.38, 0.12, wheelPosition, silver);
  cylinder('wheel hub ' + wheelIndex, 0.14, 0.15, wheelPosition, black);
  for (let spokeIndex = 0; spokeIndex < 5; spokeIndex++) {
    const spokeAngle = spokeIndex * Math.PI * 0.4;
    const spokeX = wheelPosition[0] + Math.cos(spokeAngle) * 0.22;
    const spokeY = wheelPosition[1] + Math.sin(spokeAngle) * 0.22;
    box('wheel spoke', [0.07, 0.4, 0.16], [spokeX, spokeY, wheelPosition[2]], chrome, [0, 0, spokeAngle]);
  }
}

box('left running board', [2.05, 0.12, 0.22], [0.25, 0.63, -1.18], black);
box('right running board', [2.05, 0.12, 0.22], [0.25, 0.63, 1.18], black);
box('left rear step', [0.42, 0.18, 0.28], [-2.95, 0.68, -1.19], chrome);
box('right rear step', [0.42, 0.18, 0.28], [-2.95, 0.68, 1.19], chrome);

const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.62, 12), black);
antenna.position.set(1.05, 3.76, 0.55);
antenna.rotation.z = -0.18;
antenna.castShadow = true;
scene.add(antenna);

const badge = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.18, 0.58), chrome);
badge.position.set(3.25, 1.03, 0);
badge.castShadow = true;
scene.add(badge);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  sun.position.x = 7 + Math.sin(elapsed * 0.08) * 1.5;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
