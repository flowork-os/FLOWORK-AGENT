<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brushed Steel Grinder</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111316; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111316);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.7, 4.2, 6.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.target.set(0, 1.65, 0);
controls.minDistance = 4.5;
controls.maxDistance = 11;

const steel = new THREE.MeshStandardMaterial({
  color: 0x9ca1a3,
  metalness: 0.92,
  roughness: 0.34
});
const darkSteel = new THREE.MeshStandardMaterial({
  color: 0x454a4c,
  metalness: 0.9,
  roughness: 0.31
});
const satinSteel = new THREE.MeshStandardMaterial({
  color: 0xb5b9ba,
  metalness: 0.9,
  roughness: 0.42
});
const walnut = new THREE.MeshStandardMaterial({
  color: 0x5a2813,
  metalness: 0.02,
  roughness: 0.31
});
const black = new THREE.MeshStandardMaterial({
  color: 0x161819,
  metalness: 0.42,
  roughness: 0.42
});

const grinder = new THREE.Group();
scene.add(grinder);

function cylinder(radiusTop, radiusBottom, height, material, radialSegments = 96) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, radialSegments, 1, false),
    material
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function torus(radius, tube, material) {
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 16, 96), material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const base = cylinder(1.07, 1.1, 0.10, darkSteel);
base.position.y = 0.05;
grinder.add(base);

const cup = cylinder(1.02, 1.06, 1.05, steel);
cup.position.y = 0.62;
grinder.add(cup);

const cupBottomRing = torus(1.04, 0.038, satinSteel);
cupBottomRing.position.y = 0.12;
grinder.add(cupBottomRing);

const cupTopRing = torus(1.035, 0.045, darkSteel);
cupTopRing.position.y = 1.15;
grinder.add(cupTopRing);

for (let i = 0; i < 19; i++) {
  const groove = torus(1.067, 0.007, darkSteel);
  groove.position.y = 0.20 + i * 0.045;
  groove.scale.y = 0.55;
  grinder.add(groove);
}

const threadedCollar = cylinder(1.11, 1.11, 0.34, darkSteel);
threadedCollar.position.y = 1.34;
grinder.add(threadedCollar);

for (let i = 0; i < 7; i++) {
  const thread = torus(1.125, 0.022, satinSteel);
  thread.position.y = 1.21 + i * 0.052;
  grinder.add(thread);
}

const collarUpperRing = torus(1.12, 0.052, satinSteel);
collarUpperRing.position.y = 1.53;
grinder.add(collarUpperRing);

const body = cylinder(1.0, 1.02, 2.30, steel);
body.position.y = 2.72;
grinder.add(body);

const lowerShoulder = torus(1.015, 0.045, darkSteel);
lowerShoulder.position.y = 1.58;
grinder.add(lowerShoulder);

const upperShoulder = torus(1.005, 0.048, satinSteel);
upperShoulder.position.y = 3.86;
grinder.add(upperShoulder);

for (let i = 0; i < 42; i++) {
  const grain = torus(1.008, 0.0065, darkSteel);
  grain.position.y = 1.67 + i * 0.051;
  grain.scale.y = 0.45;
  grinder.add(grain);
}

const gripGroup = new THREE.Group();
gripGroup.position.y = 2.70;
grinder.add(gripGroup);

const gripBase = cylinder(1.055, 1.055, 0.67, darkSteel);
gripGroup.add(gripBase);

const gripEdgeBottom = torus(1.06, 0.036, satinSteel);
gripEdgeBottom.position.y = -0.35;
gripGroup.add(gripEdgeBottom);

const gripEdgeTop = torus(1.06, 0.036, satinSteel);
gripEdgeTop.position.y = 0.35;
gripGroup.add(gripEdgeTop);

const knurlGeometry = new THREE.BoxGeometry(0.045, 0.53, 0.075);
for (let i = 0; i < 116; i++) {
  const angle = (i / 116) * Math.PI * 2;
  const knurl = new THREE.Mesh(knurlGeometry, i % 2 ? satinSteel : steel);
  knurl.position.set(Math.cos(angle) * 1.072, 0, Math.sin(angle) * 1.072);
  knurl.rotation.y = -angle;
  knurl.rotation.z = i % 2 ? 0.33 : -0.33;
  knurl.castShadow = true;
  knurl.receiveShadow = true;
  gripGroup.add(knurl);
}

const topNeck = cylinder(0.94, 1.0, 0.22, darkSteel);
topNeck.position.y = 4.00;
grinder.add(topNeck);

const dome = new THREE.Mesh(
  new THREE.SphereGeometry(0.94, 96, 32, 0, Math.PI * 2, 0, Math.PI * 0.5),
  steel
);
dome.position.y = 4.10;
dome.castShadow = true;
dome.receiveShadow = true;
grinder.add(dome);

const topCap = cylinder(0.33, 0.36, 0.12, darkSteel);
topCap.position.y = 5.00;
grinder.add(topCap);

const capRing = torus(0.35, 0.026, satinSteel);
capRing.position.y = 5.035;
grinder.add(capRing);

const crank = new THREE.Group();
crank.position.set(0, 5.08, 0);
crank.rotation.y = -0.42;
grinder.add(crank);

const spindle = cylinder(0.12, 0.12, 0.33, darkSteel, 48);
spindle.position.y = 0.16;
crank.add(spindle);

const hub = cylinder(0.23, 0.23, 0.11, satinSteel, 64);
hub.position.y = 0.35;
crank.add(hub);

const armMaterial = new THREE.MeshStandardMaterial({
  color: 0x858b8d,
  metalness: 0.9,
  roughness: 0.36
});
const arm = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.11, 0.20), armMaterial);
arm.position.set(0.84, 0.40, 0);
arm.castShadow = true;
arm.receiveShadow = true;
crank.add(arm);

const armEnd = cylinder(0.16, 0.16, 0.23, darkSteel, 48);
armEnd.rotation.z = Math.PI * 0.5;
armEnd.position.set(1.72, 0.40, 0);
armEnd.castShadow = true;
armEnd.receiveShadow = true;
crank.add(armEnd);

const knobStem = cylinder(0.095, 0.095, 0.40, darkSteel, 40);
knobStem.position.set(1.72, 0.59, 0);
knobStem.castShadow = true;
knobStem.receiveShadow = true;
crank.add(knobStem);

const knob = new THREE.Mesh(new THREE.SphereGeometry(0.27, 48, 32), walnut);
knob.scale.set(1.0, 1.32, 1.0);
knob.position.set(1.72, 0.89, 0);
knob.castShadow = true;
knob.receiveShadow = true;
crank.add(knob);

const walnutBand = torus(0.235, 0.018, darkSteel);
walnutBand.position.set(1.72, 0.67, 0);
walnutBand.rotation.x = Math.PI * 0.5;
knob.add(walnutBand);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(9, 128),
  new THREE.MeshStandardMaterial({ color: 0x181b1d, metalness: 0.05, roughness: 0.75 })
);
floor.rotation.x = -Math.PI * 0.5;
floor.receiveShadow = true;
scene.add(floor);

const hemi = new THREE.HemisphereLight(0xdde8ef, 0x15110d, 2.1);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4df, 4.0);
key.position.set(4.5, 7.5, 4.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -3;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fc8e4, 2.0);
fill.position.set(-5, 3, -4);
scene.add(fill);

const rim = new THREE.PointLight(0xffd8a0, 30, 16, 2);
rim.position.set(-3.5, 5.5, 2.5);
scene.add(rim);

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
