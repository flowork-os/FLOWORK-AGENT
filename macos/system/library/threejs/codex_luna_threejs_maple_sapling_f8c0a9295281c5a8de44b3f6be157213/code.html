<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Young Maple Sapling</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #b9c9bd;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9c9bd);
scene.fog = new THREE.Fog(0xb9c9bd, 7, 15);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 50);
camera.position.set(4.8, 3.2, 6.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 4.3;
controls.maxDistance = 10;
controls.target.set(0, 1.85, 0);

scene.add(new THREE.HemisphereLight(0xdce9dc, 0x56483d, 2.0));

const sun = new THREE.DirectionalLight(0xfff0d2, 3.2);
sun.position.set(-4.5, 8, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -5;
sun.shadow.camera.right = 5;
sun.shadow.camera.top = 7;
sun.shadow.camera.bottom = -2;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 18;
sun.shadow.bias = -0.00025;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xb8d8e8, 0.8);
fill.position.set(4, 4, -4);
scene.add(fill);

const barkMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x594034, roughness: 0.92 }),
  new THREE.MeshStandardMaterial({ color: 0x6d4a38, roughness: 0.9 }),
  new THREE.MeshStandardMaterial({ color: 0x795540, roughness: 0.94 }),
  new THREE.MeshStandardMaterial({ color: 0x4f382f, roughness: 0.9 })
];

const twigMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x684936, roughness: 0.9 }),
  new THREE.MeshStandardMaterial({ color: 0x805942, roughness: 0.91 })
];

function branchBetween(start, end, radiusStart, radiusEnd, material, radialSegments = 8) {
  const a = new THREE.Vector3(...start);
  const b = new THREE.Vector3(...end);
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(radiusEnd, radiusStart, length, radialSegments, 1);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

const trunkPoints = [
  [0, 0.04, 0],
  [-0.025, 0.78, 0.015],
  [0.035, 1.48, -0.01],
  [-0.035, 2.18, 0.02],
  [0.02, 2.82, 0.015],
  [-0.01, 3.25, 0.02]
];

for (let i = 0; i < trunkPoints.length - 1; i++) {
  const t = i / (trunkPoints.length - 1);
  branchBetween(
    trunkPoints[i],
    trunkPoints[i + 1],
    0.115 - t * 0.07,
    0.105 - t * 0.07,
    barkMaterials[i % barkMaterials.length],
    10
  );
}

const branches = [
  [[-0.01, 0.92, 0.01], [-0.47, 1.32, 0.03], 0.052, 0.034],
  [[-0.47, 1.32, 0.03], [-0.86, 1.78, 0.08], 0.034, 0.019],
  [[-0.86, 1.78, 0.08], [-1.04, 2.17, 0.12], 0.019, 0.009],

  [[0.02, 1.42, -0.01], [0.51, 1.82, -0.05], 0.05, 0.032],
  [[0.51, 1.82, -0.05], [0.79, 2.29, 0.02], 0.032, 0.017],
  [[0.79, 2.29, 0.02], [0.91, 2.72, 0.09], 0.017, 0.008],

  [[-0.02, 1.83, 0.01], [-0.52, 2.17, -0.03], 0.043, 0.027],
  [[-0.52, 2.17, -0.03], [-0.55, 2.67, 0.04], 0.027, 0.013],
  [[-0.55, 2.67, 0.04], [-0.42, 3.01, 0.11], 0.013, 0.007],

  [[-0.02, 2.2, 0.02], [0.38, 2.54, -0.03], 0.038, 0.024],
  [[0.38, 2.54, -0.03], [0.30, 3.04, -0.08], 0.024, 0.012],
  [[0.30, 3.04, -0.08], [0.47, 3.39, -0.02], 0.012, 0.006],

  [[0.01, 2.78, 0.02], [-0.28, 3.02, 0.01], 0.027, 0.016],
  [[-0.28, 3.02, 0.01], [-0.18, 3.39, 0.07], 0.016, 0.007],
  [[-0.01, 3.17, 0.02], [0.24, 3.49, 0.05], 0.021, 0.007]
];

branches.forEach((item, index) => {
  branchBetween(item[0], item[1], item[2], item[3], twigMaterials[index % twigMaterials.length], 7);
});

const leafShape = new THREE.Shape();
leafShape.moveTo(0, -0.42);
leafShape.lineTo(-0.09, -0.19);
leafShape.lineTo(-0.36, -0.27);
leafShape.lineTo(-0.23, -0.06);
leafShape.lineTo(-0.56, 0.05);
leafShape.lineTo(-0.25, 0.14);
leafShape.lineTo(-0.36, 0.42);
leafShape.lineTo(-0.09, 0.28);
leafShape.lineTo(0, 0.68);
leafShape.lineTo(0.09, 0.28);
leafShape.lineTo(0.36, 0.42);
leafShape.lineTo(0.25, 0.14);
leafShape.lineTo(0.56, 0.05);
leafShape.lineTo(0.23, -0.06);
leafShape.lineTo(0.36, -0.27);
leafShape.lineTo(0.09, -0.19);
leafShape.closePath();

const leafGeometry = new THREE.ExtrudeGeometry(leafShape, {
  depth: 0.026,
  bevelEnabled: false,
  curveSegments: 2
});
leafGeometry.translate(0, 0, -0.013);

const leafMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x527b3d, roughness: 0.78, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x648e45, roughness: 0.8, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x416e38, roughness: 0.82, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x789b4d, roughness: 0.8, side: THREE.DoubleSide })
];

function makeLeaf(position, scale, rotation, materialIndex) {
  const group = new THREE.Group();
  group.position.set(...position);
  group.rotation.set(rotation[0], rotation[1], rotation[2]);
  group.scale.setScalar(scale);

  const leaf = new THREE.Mesh(leafGeometry, leafMaterials[materialIndex % leafMaterials.length]);
  leaf.castShadow = true;
  leaf.receiveShadow = true;
  group.add(leaf);

  const stemGeometry = new THREE.CylinderGeometry(0.012, 0.016, 0.28, 6);
  const stem = new THREE.Mesh(stemGeometry, twigMaterials[materialIndex % twigMaterials.length]);
  stem.position.set(0, -0.5, 0);
  stem.rotation.z = Math.PI;
  stem.castShadow = true;
  group.add(stem);

  const veinMaterial = new THREE.LineBasicMaterial({
    color: 0x3f6335,
    transparent: true,
    opacity: 0.72
  });
  const veins = [
    [[0, -0.30, 0.022], [0, 0.54, 0.022]],
    [[0, 0.02, 0.022], [-0.37, 0.30, 0.022]],
    [[0, 0.02, 0.022], [0.37, 0.30, 0.022]],
    [[0, -0.03, 0.022], [-0.46, 0.05, 0.022]],
    [[0, -0.03, 0.022], [0.46, 0.05, 0.022]]
  ];

  veins.forEach(points => {
    const geometry = new THREE.BufferGeometry().setFromPoints(
      points.map(point => new THREE.Vector3(...point))
    );
    group.add(new THREE.Line(geometry, veinMaterial));
  });

  scene.add(group);
}

makeLeaf([-1.08, 2.19, 0.12], 0.58, [0.24, -0.45, -0.48], 1);
makeLeaf([0.94, 2.74, 0.09], 0.62, [-0.18, 0.42, 0.36], 0);
makeLeaf([-0.42, 3.02, 0.11], 0.67, [0.12, -0.16, -0.26], 2);
makeLeaf([0.47, 3.40, -0.02], 0.66, [-0.16, 0.28, 0.32], 1);
makeLeaf([-0.18, 3.40, 0.07], 0.57, [0.18, -0.33, -0.12], 3);
makeLeaf([0.29, 3.52, 0.05], 0.52, [-0.35, 0.12, 0.54], 0);
makeLeaf([-0.02, 3.26, 0.02], 0.48, [0.06, 0.7, 0.08], 2);

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x667c5b,
  roughness: 1
});
const ground = new THREE.Mesh(new THREE.CircleGeometry(5.5, 64), groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.015;
ground.receiveShadow = true;
scene.add(ground);

const soil = new THREE.Mesh(
  new THREE.CylinderGeometry(0.66, 0.82, 0.12, 32),
  new THREE.MeshStandardMaterial({ color: 0x4c4031, roughness: 1 })
);
soil.position.y = 0.035;
soil.receiveShadow = true;
scene.add(soil);

const moss = new THREE.Mesh(
  new THREE.CylinderGeometry(0.72, 0.75, 0.025, 32),
  new THREE.MeshStandardMaterial({ color: 0x657b4d, roughness: 1 })
);
moss.position.y = 0.105;
moss.receiveShadow = true;
scene.add(moss);

const pebbleMaterial = new THREE.MeshStandardMaterial({ color: 0x8d927e, roughness: 0.95 });
[
  [-0.72, 0.14, 0.18, 0.12],
  [0.61, 0.13, 0.25, 0.09],
  [0.22, 0.13, -0.68, 0.14],
  [-0.28, 0.13, 0.62, 0.1]
].forEach((p, index) => {
  const pebble = new THREE.Mesh(new THREE.SphereGeometry(p[3], 10, 6), pebbleMaterial);
  pebble.scale.y = 0.55;
  pebble.position.set(p[0], p[1], p[2]);
  pebble.rotation.y = index * 0.8;
  pebble.castShadow = true;
  pebble.receiveShadow = true;
  scene.add(pebble);
});

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  const elapsed = clock.getElapsedTime();
  controls.update();
  scene.rotation.y = Math.sin(elapsed * 0.22) * 0.012;
  renderer.render(scene, camera);
}

renderer.setAnimationLoop(animate);
</script>
</body>
</html>
