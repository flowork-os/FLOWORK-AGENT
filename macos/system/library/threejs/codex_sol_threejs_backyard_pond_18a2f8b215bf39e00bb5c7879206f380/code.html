<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backyard Pond Edge</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: linear-gradient(#b9d3df, #e5e1cd);
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 20px;
      bottom: 18px;
      padding: 8px 12px;
      color: rgba(255,255,255,.9);
      background: rgba(29,38,30,.38);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 7px;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      pointer-events: none;
      backdrop-filter: blur(5px);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Backyard pond edge</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb9cdd4);
    scene.fog = new THREE.FogExp2(0xb9cdd4, 0.025);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(10.5, 7.5, 12.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.45, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.42;
    controls.minDistance = 8;
    controls.maxDistance = 28;
    controls.maxPolarAngle = Math.PI * 0.46;

    const hemi = new THREE.HemisphereLight(0xdceef2, 0x59604b, 2.0);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff2d1, 3.25);
    sun.position.set(-8, 13, 7);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -12;
    sun.shadow.camera.right = 12;
    sun.shadow.camera.top = 12;
    sun.shadow.camera.bottom = -12;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 35;
    sun.shadow.bias = -0.00025;
    sun.shadow.normalBias = 0.035;
    scene.add(sun);

    let seed = 73621;
    function random() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    function range(a, b) {
      return a + (b - a) * random();
    }

    function pondRadius(angle) {
      return 1 + 0.065 * Math.sin(angle * 3 + 0.4)
        + 0.035 * Math.sin(angle * 5 - 0.7)
        + 0.018 * Math.cos(angle * 8);
    }

    function pondPoint(angle, offset = 0) {
      const r = pondRadius(angle);
      return new THREE.Vector2(
        Math.cos(angle) * (4.35 * r + offset),
        Math.sin(angle) * (3.15 * r + offset * 0.72)
      );
    }

    const groundGeometry = new THREE.PlaneGeometry(30, 24, 72, 60);
    const groundPositions = groundGeometry.attributes.position;
    const groundColors = [];
    const soilColor = new THREE.Color();
    for (let i = 0; i < groundPositions.count; i++) {
      const x = groundPositions.getX(i);
      const z = groundPositions.getY(i);
      const normalized = Math.sqrt((x / 4.7) ** 2 + (z / 3.45) ** 2);
      const edgeBank = 0.12 * Math.exp(-Math.pow((normalized - 1.14) * 3.1, 2));
      const rolling = 0.055 * Math.sin(x * 0.48) * Math.cos(z * 0.42)
        + 0.024 * Math.sin(x * 1.8 + z * 1.15);
      const height = -0.24 + edgeBank + rolling;
      groundPositions.setZ(i, height);

      const mottling = 0.5 + 0.5 * Math.sin(x * 1.5 + Math.cos(z * 2.1));
      soilColor.setHSL(0.225 + mottling * 0.014, 0.30, 0.285 + mottling * 0.045);
      groundColors.push(soilColor.r, soilColor.g, soilColor.b);
    }
    groundGeometry.setAttribute('color', new THREE.Float32BufferAttribute(groundColors, 3));
    groundGeometry.rotateX(-Math.PI / 2);
    groundGeometry.computeVertexNormals();

    const ground = new THREE.Mesh(
      groundGeometry,
      new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.98,
        metalness: 0
      })
    );
    ground.receiveShadow = true;
    scene.add(ground);

    const pondShape = new THREE.Shape();
    const edgeCount = 128;
    for (let i = 0; i <= edgeCount; i++) {
      const p = pondPoint((i / edgeCount) * Math.PI * 2, -0.34);
      if (i === 0) pondShape.moveTo(p.x, p.y);
      else pondShape.lineTo(p.x, p.y);
    }

    const basin = new THREE.Mesh(
      new THREE.ShapeGeometry(pondShape, 12),
      new THREE.MeshStandardMaterial({
        color: 0x17201c,
        roughness: 0.84,
        metalness: 0,
        side: THREE.DoubleSide
      })
    );
    basin.rotation.x = -Math.PI / 2;
    basin.position.y = -0.12;
    basin.receiveShadow = true;
    scene.add(basin);

    function createIrregularAnnulus(innerOffset, outerOffset, y, material) {
      const positions = [];
      const indices = [];
      const segments = 128;
      for (let i = 0; i < segments; i++) {
        const a = (i / segments) * Math.PI * 2;
        const inner = pondPoint(a, innerOffset);
        const outer = pondPoint(a, outerOffset);
        positions.push(inner.x, y, inner.y, outer.x, y, outer.y);
      }
      for (let i = 0; i < segments; i++) {
        const n = (i + 1) % segments;
        const innerA = i * 2;
        const outerA = innerA + 1;
        const innerB = n * 2;
        const outerB = innerB + 1;
        indices.push(innerA, outerB, outerA, innerA, innerB, outerB);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return new THREE.Mesh(geometry, material);
    }

    const liner = createIrregularAnnulus(
      -0.24,
      0.55,
      -0.015,
      new THREE.MeshStandardMaterial({
        color: 0x111412,
        roughness: 0.72,
        metalness: 0.03,
        side: THREE.DoubleSide
      })
    );
    liner.receiveShadow = true;
    scene.add(liner);

    const waterMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x315f65,
      roughness: 0.16,
      metalness: 0.02,
      transmission: 0.08,
      transparent: true,
      opacity: 0.86,
      clearcoat: 0.8,
      clearcoatRoughness: 0.22,
      side: THREE.DoubleSide
    });
    const water = new THREE.Mesh(new THREE.ShapeGeometry(pondShape, 12), waterMaterial);
    water.rotation.x = -Math.PI / 2;
    water.position.y = 0.015;
    water.receiveShadow = true;
    scene.add(water);

    const rippleMaterial = new THREE.MeshBasicMaterial({
      color: 0xaac9c8,
      transparent: true,
      opacity: 0.24,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const ripples = [];
    for (let i = 0; i < 6; i++) {
      const radius = 0.18 + i * 0.085;
      const ripple = new THREE.Mesh(
        new THREE.TorusGeometry(radius, 0.007, 6, 48),
        rippleMaterial
      );
      ripple.rotation.x = Math.PI / 2;
      ripple.position.set(-1.15, 0.045, 0.62);
      ripple.scale.z = 0.72;
      ripple.renderOrder = 3;
      scene.add(ripple);
      ripples.push(ripple);
    }

    const stoneGeometry = new THREE.IcosahedronGeometry(1, 2);
    const stonePalette = [
      0x77746a, 0x8a8577, 0x696b63, 0x999181,
      0x716b60, 0x85877d, 0x625f56, 0x9a927f
    ];
    const stones = new THREE.Group();
    scene.add(stones);

    const stoneCount = 53;
    for (let i = 0; i < stoneCount; i++) {
      const a = (i / stoneCount) * Math.PI * 2 + range(-0.035, 0.035);
      const p = pondPoint(a, range(0.25, 0.46));
      const size = range(0.38, 0.64);
      const stone = new THREE.Mesh(
        stoneGeometry,
        new THREE.MeshStandardMaterial({
          color: stonePalette[Math.floor(random() * stonePalette.length)],
          roughness: range(0.72, 0.94),
          metalness: 0
        })
      );
      stone.position.set(p.x, range(0.055, 0.11), p.y);
      stone.scale.set(
        size * range(1.05, 1.42),
        size * range(0.48, 0.68),
        size * range(0.78, 1.08)
      );
      stone.rotation.set(range(-0.18, 0.18), -a + range(-0.4, 0.4), range(-0.12, 0.12));
      stone.castShadow = true;
      stone.receiveShadow = true;
      stones.add(stone);
    }

    const pebbleGeometry = new THREE.IcosahedronGeometry(1, 1);
    for (let i = 0; i < 80; i++) {
      const a = range(0, Math.PI * 2);
      const p = pondPoint(a, range(0.72, 1.8));
      const s = range(0.055, 0.17);
      const pebble = new THREE.Mesh(
        pebbleGeometry,
        new THREE.MeshStandardMaterial({
          color: stonePalette[Math.floor(random() * stonePalette.length)],
          roughness: 0.95
        })
      );
      pebble.position.set(p.x, -0.12 + s * 0.42, p.y);
      pebble.scale.set(s * range(1, 1.8), s * range(0.4, 0.7), s * range(0.8, 1.3));
      pebble.rotation.y = range(0, Math.PI);
      pebble.castShadow = true;
      pebble.receiveShadow = true;
      scene.add(pebble);
    }

    const stemMaterial = new THREE.MeshStandardMaterial({
      color: 0x536c32,
      roughness: 0.78
    });
    const stemLightMaterial = new THREE.MeshStandardMaterial({
      color: 0x71833e,
      roughness: 0.8
    });
    const headMaterial = new THREE.MeshStandardMaterial({
      color: 0x5c3420,
      roughness: 0.93
    });
    const headTipMaterial = new THREE.MeshStandardMaterial({
      color: 0x4c2b1b,
      roughness: 1
    });
    const leafMaterial = new THREE.MeshStandardMaterial({
      color: 0x587531,
      roughness: 0.88,
      side: THREE.DoubleSide
    });

    function makeBlade(base, height, width, leanAngle, leanAmount) {
      const segments = 6;
      const positions = [];
      const indices = [];
      const sideX = Math.cos(leanAngle + Math.PI / 2);
      const sideZ = Math.sin(leanAngle + Math.PI / 2);
      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const taper = Math.pow(1 - t, 0.62);
        const bend = leanAmount * t * t;
        const cx = base.x + Math.cos(leanAngle) * bend;
        const cy = base.y + height * t;
        const cz = base.z + Math.sin(leanAngle) * bend;
        const halfWidth = width * taper * 0.5;
        positions.push(
          cx + sideX * halfWidth, cy, cz + sideZ * halfWidth,
          cx - sideX * halfWidth, cy, cz - sideZ * halfWidth
        );
      }
      for (let i = 0; i < segments; i++) {
        const a = i * 2;
        indices.push(a, a + 1, a + 3, a, a + 3, a + 2);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      const blade = new THREE.Mesh(geometry, leafMaterial);
      blade.castShadow = true;
      return blade;
    }

    const cattails = new THREE.Group();
    scene.add(cattails);

    function addCattailCluster(angle, count, spread) {
      const center = pondPoint(angle, 0.58);
      for (let i = 0; i < count; i++) {
        const x = center.x + range(-spread, spread);
        const z = center.y + range(-spread, spread);
        const height = range(1.75, 3.15);
        const leanX = range(-0.12, 0.12);
        const leanZ = range(-0.12, 0.12);
        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(x, 0.05, z),
          new THREE.Vector3(x + leanX * 0.2, height * 0.42, z + leanZ * 0.2),
          new THREE.Vector3(x + leanX * 0.6, height * 0.77, z + leanZ * 0.6),
          new THREE.Vector3(x + leanX, height, z + leanZ)
        ]);
        const stem = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 12, range(0.018, 0.027), 7, false),
          random() > 0.45 ? stemMaterial : stemLightMaterial
        );
        stem.castShadow = true;
        cattails.add(stem);

        if (random() > 0.16) {
          const headHeight = range(0.38, 0.56);
          const tip = curve.getPoint(1);
          const head = new THREE.Mesh(
            new THREE.CylinderGeometry(range(0.07, 0.09), range(0.075, 0.105), headHeight, 12),
            headMaterial
          );
          head.position.set(tip.x, tip.y - headHeight * 0.5 - 0.04, tip.z);
          head.castShadow = true;
          cattails.add(head);

          const capTop = new THREE.Mesh(
            new THREE.SphereGeometry(0.078, 10, 6),
            headTipMaterial
          );
          capTop.scale.y = 0.48;
          capTop.position.set(tip.x, tip.y - 0.04, tip.z);
          capTop.castShadow = true;
          cattails.add(capTop);

          const capBottom = capTop.clone();
          capBottom.position.y = tip.y - headHeight - 0.04;
          cattails.add(capBottom);
        }
      }

      for (let i = 0; i < count * 3; i++) {
        const base = new THREE.Vector3(
          center.x + range(-spread * 1.25, spread * 1.25),
          0.02,
          center.y + range(-spread * 1.25, spread * 1.25)
        );
        cattails.add(makeBlade(
          base,
          range(0.75, 1.9),
          range(0.045, 0.095),
          range(0, Math.PI * 2),
          range(0.18, 0.72)
        ));
      }
    }

    addCattailCluster(2.03, 7, 0.43);
    addCattailCluster(0.46, 5, 0.34);
    addCattailCluster(2.78, 3, 0.25);

    const grassMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x567139, roughness: 0.95, side: THREE.DoubleSide }),
      new THREE.MeshStandardMaterial({ color: 0x697d42, roughness: 0.95, side: THREE.DoubleSide }),
      new THREE.MeshStandardMaterial({ color: 0x435f35, roughness: 0.95, side: THREE.DoubleSide })
    ];

    for (let cluster = 0; cluster < 34; cluster++) {
      const a = range(0, Math.PI * 2);
      const p = pondPoint(a, range(1.05, 3.2));
      const bladeCount = 3 + Math.floor(random() * 5);
      for (let j = 0; j < bladeCount; j++) {
        const base = new THREE.Vector3(p.x + range(-0.15, 0.15), -0.1, p.y + range(-0.15, 0.15));
        const blade = makeBlade(
          base,
          range(0.22, 0.58),
          range(0.025, 0.055),
          range(0, Math.PI * 2),
          range(0.05, 0.22)
        );
        blade.material = grassMaterials[Math.floor(random() * grassMaterials.length)];
        scene.add(blade);
      }
    }

    const lilyMaterial = new THREE.MeshStandardMaterial({
      color: 0x426d43,
      roughness: 0.65,
      side: THREE.DoubleSide
    });
    for (let i = 0; i < 5; i++) {
      const radius = range(0.22, 0.38);
      const shape = new THREE.Shape();
      const start = 0.32;
      shape.moveTo(0, 0);
      for (let j = 0; j <= 28; j++) {
        const a = start + (j / 28) * (Math.PI * 2 - 0.64);
        shape.lineTo(Math.cos(a) * radius, Math.sin(a) * radius);
      }
      shape.lineTo(0, 0);
      const pad = new THREE.Mesh(new THREE.ShapeGeometry(shape), lilyMaterial);
      pad.rotation.x = -Math.PI / 2;
      pad.rotation.z = range(0, Math.PI * 2);
      pad.position.set(range(-2.5, 2.2), 0.054, range(-1.45, 1.45));
      pad.receiveShadow = true;
      scene.add(pad);
    }

    const border = new THREE.Mesh(
      new THREE.CylinderGeometry(15, 15, 0.45, 64),
      new THREE.MeshStandardMaterial({ color: 0x4a513d, roughness: 1 })
    );
    border.position.y = -0.49;
    border.receiveShadow = true;
    scene.add(border);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();
      waterMaterial.color.setHSL(0.51 + Math.sin(time * 0.25) * 0.004, 0.34, 0.29);
      for (let i = 0; i < ripples.length; i++) {
        const phase = (time * 0.13 + i / ripples.length) % 1;
        ripples[i].material.opacity = 0.15 * (1 - phase);
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
