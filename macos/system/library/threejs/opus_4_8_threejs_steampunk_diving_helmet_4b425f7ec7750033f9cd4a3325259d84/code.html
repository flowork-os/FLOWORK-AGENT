<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steampunk Diving Helmet</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0c0d10;}
  canvas{display:block;}
  #hint{position:fixed;left:12px;bottom:10px;font:12px/1.4 system-ui,sans-serif;
        color:#9aa3ad;opacity:.6;user-select:none;pointer-events:none;letter-spacing:.03em;}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hint">drag to orbit · scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- Renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ---------- Scene / Camera ---------- */
const scene = new THREE.Scene();

// neutral dark studio background (radial gradient)
scene.background = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(256,220,40, 256,256,360);
  g.addColorStop(0,'#282b31'); g.addColorStop(0.55,'#16181c'); g.addColorStop(1,'#090a0c');
  x.fillStyle = g; x.fillRect(0,0,512,512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();
scene.fog = new THREE.Fog(0x0c0d10, 11, 34);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(3.4, 1.5, 4.4);

// procedural environment for metallic reflections
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------- Controls ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.minDistance = 3.0;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.92;
controls.target.set(0, 0.05, 0);

/* ---------- Lighting ---------- */
scene.add(new THREE.HemisphereLight(0x9fb2d6, 0x140f0a, 0.55));

const key = new THREE.DirectionalLight(0xfff1dc, 2.3);
key.position.set(4.5, 6.5, 4.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1; key.shadow.camera.far = 26;
key.shadow.camera.left = -3.2; key.shadow.camera.right = 3.2;
key.shadow.camera.top = 3.6; key.shadow.camera.bottom = -3.2;
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fb2ff, 0.55);
fill.position.set(-5.5, 2.0, 3.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd39a, 1.5);
rim.position.set(-3.5, 4.5, -6.0);
scene.add(rim);

/* ---------- Ground (shadow only) ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.4 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -1.14;
ground.receiveShadow = true;
scene.add(ground);

/* ================= Procedural textures ================= */
function makePatina() {
  const S = 1024;
  const col = document.createElement('canvas'); col.width = col.height = S;
  const rou = document.createElement('canvas'); rou.width = rou.height = S;
  const met = document.createElement('canvas'); met.width = met.height = S;
  const cc = col.getContext('2d'), rc = rou.getContext('2d'), mc = met.getContext('2d');

  // base brass
  cc.fillStyle = '#9d7530'; cc.fillRect(0,0,S,S);
  rc.fillStyle = '#6e6e6e'; rc.fillRect(0,0,S,S);   // roughness ~0.43
  mc.fillStyle = '#f2f2f2'; mc.fillRect(0,0,S,S);   // metalness ~0.95

  // subtle mottling on colour + roughness
  for (let i=0;i<2600;i++){
    const x=Math.random()*S, y=Math.random()*S, r=1+Math.random()*7;
    const v=Math.random();
    cc.fillStyle = v>0.5 ? `rgba(190,150,80,${0.05+Math.random()*0.12})`
                         : `rgba(90,64,26,${0.05+Math.random()*0.12})`;
    cc.beginPath(); cc.arc(x,y,r,0,7); cc.fill();
    rc.fillStyle = `rgba(${v>0.5?150:60},${v>0.5?150:60},${v>0.5?150:60},0.08)`;
    rc.beginPath(); rc.arc(x,y,r*1.4,0,7); rc.fill();
  }

  // verdigris streaks & drips (concentrate lower + mid)
  const greens = ['#3f9e86','#2f7a66','#4fb2a0','#3a8f78','#5cc0ac'];
  for (let i=0;i<120;i++){
    const x = Math.random()*S;
    const y = 120 + Math.random()*(S-260);
    const w = 6 + Math.random()*26;
    const h = 40 + Math.random()*220;
    const g = greens[(Math.random()*greens.length)|0];
    // soft blob
    cc.save();
    const grd = cc.createLinearGradient(x, y, x, y+h);
    grd.addColorStop(0, g);
    grd.addColorStop(1, 'rgba(63,158,134,0)');
    cc.globalAlpha = 0.18 + Math.random()*0.30;
    cc.fillStyle = grd;
    cc.beginPath();
    cc.ellipse(x, y, w, w*0.7, 0, 0, 7); cc.fill();
    cc.fillRect(x-w*0.5, y, w, h);
    cc.restore();

    // patina is rougher + less metallic
    rc.save(); rc.globalAlpha = 0.28+Math.random()*0.25; rc.fillStyle='#c9c9c9';
    rc.beginPath(); rc.ellipse(x,y,w,w*0.7,0,0,7); rc.fill();
    rc.fillRect(x-w*0.5,y,w,h*0.8); rc.restore();

    mc.save(); mc.globalAlpha = 0.30+Math.random()*0.25; mc.fillStyle='#3a3a3a';
    mc.beginPath(); mc.ellipse(x,y,w,w*0.7,0,0,7); mc.fill();
    mc.fillRect(x-w*0.5,y,w,h*0.8); mc.restore();
  }

  const map = new THREE.CanvasTexture(col);
  const rough = new THREE.CanvasTexture(rou);
  const metal = new THREE.CanvasTexture(met);
  map.colorSpace = THREE.SRGBColorSpace;
  [map,rough,metal].forEach(t=>{ t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(2,1.4); t.anisotropy=8; });
  return { map, rough, metal };
}
const patina = makePatina();

function gaugeFaceTexture(){
  const s=256; const c=document.createElement('canvas'); c.width=c.height=s;
  const x=c.getContext('2d');
  x.fillStyle='#efe7cf'; x.beginPath(); x.arc(s/2,s/2,s/2,0,7); x.fill();
  // outer bezel ring
  x.strokeStyle='#3a3129'; x.lineWidth=10; x.beginPath(); x.arc(s/2,s/2,s*0.44,0,7); x.stroke();
  const cx=s/2, cy=s/2, R=s*0.40;
  const a0=Math.PI*0.75, a1=Math.PI*2.25;
  // ticks
  for(let i=0;i<=10;i++){
    const a=a0+(a1-a0)*i/10;
    const inner = (i%5===0)? R*0.72 : R*0.82;
    x.strokeStyle='#241f19'; x.lineWidth=(i%5===0)?4:2;
    x.beginPath();
    x.moveTo(cx+Math.cos(a)*inner, cy+Math.sin(a)*inner);
    x.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R);
    x.stroke();
  }
  // red danger arc
  x.strokeStyle='#a12b1e'; x.lineWidth=7;
  x.beginPath(); x.arc(cx,cy,R*0.92, a0+(a1-a0)*0.78, a1); x.stroke();
  // hub
  x.fillStyle='#2a2420'; x.beginPath(); x.arc(cx,cy,7,0,7); x.fill();
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=8; return t;
}
const gaugeTex = gaugeFaceTexture();

/* ================= Materials ================= */
const brassMat = new THREE.MeshStandardMaterial({
  color:0xffffff, map:patina.map, roughnessMap:patina.rough, metalnessMap:patina.metal,
  metalness:1.0, roughness:1.0, envMapIntensity:1.15
});
const brassPlain = new THREE.MeshStandardMaterial({ color:0xb08636, metalness:1.0, roughness:0.4, envMapIntensity:1.1 });
const copperMat = new THREE.MeshStandardMaterial({ color:0xc06a34, metalness:1.0, roughness:0.33, envMapIntensity:1.2 });
const copperDark = new THREE.MeshStandardMaterial({ color:0x8a4a28, metalness:1.0, roughness:0.45, envMapIntensity:1.0 });
const ironMat = new THREE.MeshStandardMaterial({ color:0x3b3733, metalness:0.85, roughness:0.55, envMapIntensity:0.9 });
const innerMat = new THREE.MeshStandardMaterial({ color:0x0c0c0e, metalness:0.3, roughness:0.9 });
const faceMat  = new THREE.MeshStandardMaterial({ color:0xffffff, map:gaugeTex, metalness:0.0, roughness:0.7 });
const needleMat= new THREE.MeshStandardMaterial({ color:0x141414, metalness:0.4, roughness:0.5 });

const glassMat = new THREE.MeshPhysicalMaterial({
  color:0xaed2c8, metalness:0.0, roughness:0.06, transmission:0.94, thickness:0.5,
  ior:1.45, transparent:true, opacity:1.0, clearcoat:0.5, clearcoatRoughness:0.1, envMapIntensity:1.5
});
const lampGlass = new THREE.MeshPhysicalMaterial({
  color:0xffcf8a, emissive:0xff9a2e, emissiveIntensity:1.4, metalness:0, roughness:0.15,
  transmission:0.6, transparent:true, opacity:0.9, ior:1.4
});

/* ================= Shared geometry ================= */
const UNIT_SPHERE = new THREE.SphereGeometry(1, 16, 12);
const UNIT_HEX = new THREE.CylinderGeometry(1, 1, 1, 6);

/* ================= Body profile ================= */
const PROFILE = [
 [-1.10, 0.00],[-1.10, 0.66],[-1.07, 0.72],[-1.02, 0.70],[-0.96, 0.66],
 [-0.90, 0.64],[-0.66, 0.64],[-0.54, 0.66],[-0.40, 0.74],[-0.22, 0.88],
 [-0.02, 0.98],[ 0.20, 1.00],[ 0.40, 0.97],[ 0.58, 0.90],[ 0.74, 0.80],
 [ 0.88, 0.66],[ 1.00, 0.50],[ 1.08, 0.34],[ 1.13, 0.18],[ 1.15, 0.08],[ 1.15, 0.00]
];
function profileRadius(y){
  if (y <= PROFILE[0][0]) return PROFILE[0][1];
  if (y >= PROFILE[PROFILE.length-1][0]) return PROFILE[PROFILE.length-1][1];
  for(let i=0;i<PROFILE.length-1;i++){
    const [y0,r0]=PROFILE[i], [y1,r1]=PROFILE[i+1];
    if(y>=y0 && y<=y1){ const t=(y-y0)/(y1-y0||1e-6); return r0+(r1-r0)*t; }
  }
  return 0;
}

/* ================= The single object ================= */
const helmet = new THREE.Group();
scene.add(helmet);

// main lathe body
const latheProfile = PROFILE.map(p => new THREE.Vector2(p[1], p[0]));
const bodyGeo = new THREE.LatheGeometry(latheProfile, 128);
const body = new THREE.Mesh(bodyGeo, brassMat);
body.castShadow = true; body.receiveShadow = true;
helmet.add(body);

/* ---- helpers ---- */
function addRivet(parent, x,y,z, r, mat){
  const m = new THREE.Mesh(UNIT_SPHERE, mat||copperMat);
  m.scale.setScalar(r); m.position.set(x,y,z);
  m.castShadow = true; parent.add(m); return m;
}
function addHexBolt(parent, x,y,z, r, h, mat){
  const m = new THREE.Mesh(UNIT_HEX, mat||brassPlain);
  m.scale.set(r, h, r); m.position.set(x,y,z);
  m.castShadow = true; parent.add(m); return m;
}

// place a local +Z-facing group onto the body surface
function placeOnBody(obj, thetaDeg, y, push=0){
  const th = thetaDeg*Math.PI/180;
  const r = profileRadius(y);
  const nx = Math.sin(th), nz = Math.cos(th);
  const px = nx*r, pz = nz*r;
  obj.position.set(px + nx*push, y, pz + nz*push);
  obj.lookAt(px + nx*(push+1), y, pz + nz*(push+1));
  helmet.add(obj);
  return obj;
}

// horizontal riveted band around the body
function addRivetBand(y, count, r, mat){
  const rr = profileRadius(y) + 0.015;
  for(let i=0;i<count;i++){
    const a = (i/count)*Math.PI*2;
    addRivet(helmet, Math.sin(a)*rr, y, Math.cos(a)*rr, r, mat);
  }
}

// vertical riveted strap following the profile at angle theta
function addStrap(thetaDeg, y0, y1){
  const th = thetaDeg*Math.PI/180;
  const pts=[];
  for(let y=y0;y<=y1+1e-4;y+=0.035){
    const r = profileRadius(y)+0.02;
    pts.push(new THREE.Vector3(Math.sin(th)*r, y, Math.cos(th)*r));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, pts.length*2, 0.055, 8, false), brassPlain);
  tube.castShadow = true; tube.receiveShadow = true; helmet.add(tube);
  for(let y=y0+0.05; y<y1; y+=0.15){
    const r = profileRadius(y)+0.075;
    addRivet(helmet, Math.sin(th)*r, y, Math.cos(th)*r, 0.032, copperMat);
  }
}

/* ---- Porthole (faces local +Z) ---- */
function makePorthole(rad){
  const g = new THREE.Group();
  const depth = 0.20;
  // brass mounting collar
  const collar = new THREE.Mesh(
    new THREE.CylinderGeometry(rad*1.05, rad*1.14, depth, 56, 1, true), brassMat);
  collar.rotation.x = Math.PI/2; collar.position.z = depth*0.5;
  collar.castShadow = collar.receiveShadow = true; g.add(collar);
  // dark interior disc
  const back = new THREE.Mesh(new THREE.CircleGeometry(rad*1.03, 48), innerMat);
  back.position.z = 0.01; g.add(back);
  // copper outer rim
  const rim = new THREE.Mesh(new THREE.TorusGeometry(rad*1.02, rad*0.11, 20, 56), copperMat);
  rim.position.z = depth; rim.castShadow = true; g.add(rim);
  const rim2 = new THREE.Mesh(new THREE.TorusGeometry(rad*1.02, rad*0.055, 16, 56), copperDark);
  rim2.position.z = depth*0.55; g.add(rim2);
  // bolts around the rim
  const nb = Math.max(10, Math.round(rad*34));
  for(let i=0;i<nb;i++){
    const a=(i/nb)*Math.PI*2;
    addRivet(g, Math.cos(a)*rad*1.02, Math.sin(a)*rad*1.02, depth+rad*0.03, rad*0.075, brassPlain);
  }
  // glass
  const glass = new THREE.Mesh(new THREE.CircleGeometry(rad*0.98, 56), glassMat);
  glass.position.z = depth*0.9; g.add(glass);
  return g;
}

/* ---- Pressure gauge (faces local +Z) ---- */
function makeGauge(rad){
  const g = new THREE.Group();
  const depth = 0.12;
  const bodyM = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad*1.02, depth, 40), brassMat);
  bodyM.rotation.x = Math.PI/2; bodyM.position.z = depth*0.5; bodyM.castShadow = true; g.add(bodyM);
  const bezel = new THREE.Mesh(new THREE.TorusGeometry(rad, rad*0.14, 16, 40), copperMat);
  bezel.position.z = depth; g.add(bezel);
  const face = new THREE.Mesh(new THREE.CircleGeometry(rad*0.92, 48), faceMat);
  face.position.z = depth+0.001; g.add(face);
  // needle
  const nGeo = new THREE.BoxGeometry(rad*0.8, rad*0.06, 0.01); nGeo.translate(rad*0.32,0,0);
  const needle = new THREE.Mesh(nGeo, needleMat);
  needle.position.z = depth+0.012; needle.rotation.z = -0.8 + Math.random()*2.2; g.add(needle);
  addRivet(g,0,0,depth+0.02, rad*0.12, brassPlain);
  const glass = new THREE.Mesh(new THREE.CircleGeometry(rad*0.92, 48), glassMat);
  glass.position.z = depth+0.02; g.add(glass);
  return g;
}

/* ---- Valve hand-wheel (stem along local +Z) ---- */
function makeValve(rad){
  const g = new THREE.Group();
  const stemLen = 0.14;
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(rad*0.16, rad*0.2, stemLen, 16), ironMat);
  stem.rotation.x = Math.PI/2; stem.position.z = stemLen*0.5; stem.castShadow = true; g.add(stem);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(rad*0.34, rad*0.4, 0.06, 20), brassMat);
  base.rotation.x = Math.PI/2; base.position.z = 0.03; g.add(base);
  const rimW = new THREE.Mesh(new THREE.TorusGeometry(rad, rad*0.13, 14, 40), brassPlain);
  rimW.position.z = stemLen; rimW.castShadow = true; g.add(rimW);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(rad*0.2, rad*0.2, 0.1, 16), copperMat);
  hub.rotation.x = Math.PI/2; hub.position.z = stemLen; g.add(hub);
  for(let i=0;i<4;i++){
    const a=(i/4)*Math.PI*2;
    const spoke = new THREE.Mesh(new THREE.CylinderGeometry(rad*0.06, rad*0.06, rad*2*0.92, 10), brassPlain);
    spoke.rotation.z = a; spoke.position.z = stemLen; spoke.castShadow = true; g.add(spoke);
    // knob at rim
    addRivet(g, Math.cos(a)*rad, Math.sin(a)*rad, stemLen, rad*0.14, copperMat);
  }
  return g;
}

/* ---- Coil of brass tubing ---- */
function makeCoilMesh(coilR, tubeR, turns, height){
  const pts=[]; const N = Math.max(80, Math.floor(turns*26));
  for(let i=0;i<=N;i++){
    const t=i/N, a=t*turns*Math.PI*2;
    pts.push(new THREE.Vector3(Math.cos(a)*coilR, t*height, Math.sin(a)*coilR));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, N*2, tubeR, 12, false), brassPlain);
  m.castShadow = m.receiveShadow = true; return m;
}

/* ---- Pilot lamp ---- */
function makeLamp(){
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,0.14,20), brassMat);
  base.castShadow = true; g.add(base);
  const collar = new THREE.Mesh(new THREE.TorusGeometry(0.1,0.02,12,20), copperMat);
  collar.rotation.x = Math.PI/2; collar.position.y=0.07; g.add(collar);
  // protective cage bars
  for(let i=0;i<5;i++){
    const a=(i/5)*Math.PI*2;
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.01,0.01,0.2,6), ironMat);
    bar.position.set(Math.cos(a)*0.085,0.2,Math.sin(a)*0.085); g.add(bar);
  }
  const dome = new THREE.Mesh(new THREE.SphereGeometry(0.095, 20, 16, 0, Math.PI*2, 0, Math.PI*0.62), lampGlass);
  dome.position.y = 0.18; g.add(dome);
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.05,16,12),
    new THREE.MeshStandardMaterial({ color:0xffe0a0, emissive:0xffa030, emissiveIntensity:2.2, roughness:0.4 }));
  core.position.y = 0.2; g.add(core);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.055,16,12,0,Math.PI*2,0,Math.PI*0.5), brassPlain);
  cap.position.y = 0.31; g.add(cap);
  const pl = new THREE.PointLight(0xffb060, 0.9, 3.5, 2.2);
  pl.position.y = 0.2; g.add(pl);
  g.userData.core = core; g.userData.light = pl;
  return g;
}

/* ================= Assemble the helmet ================= */

// neck flange (bolts to the suit)
const flange = new THREE.Mesh(new THREE.CylinderGeometry(0.82, 0.88, 0.12, 56), brassMat);
flange.position.y = -0.92; flange.castShadow = flange.receiveShadow = true; helmet.add(flange);
const flangeLip = new THREE.Mesh(new THREE.TorusGeometry(0.83, 0.05, 16, 56), copperMat);
flangeLip.rotation.x = Math.PI/2; flangeLip.position.y = -0.86; helmet.add(flangeLip);
for(let i=0;i<20;i++){
  const a=(i/20)*Math.PI*2;
  addHexBolt(helmet, Math.cos(a)*0.78, -0.85, Math.sin(a)*0.78, 0.045, 0.06, brassPlain);
}

// riveted horizontal seams
addRivetBand(-0.70, 26, 0.032, copperMat);
addRivetBand(-0.30, 30, 0.03, copperMat);
addRivetBand( 0.72, 22, 0.03, copperMat);

// riveted vertical straps on the back
addStrap(120, -0.55, 0.92);
addStrap(180, -0.55, 0.98);
addStrap(240, -0.55, 0.92);

// portholes
placeOnBody(makePorthole(0.40), 0,   0.18, -0.06);
placeOnBody(makePorthole(0.22), 54,  0.02, -0.05);
placeOnBody(makePorthole(0.22), -54, 0.02, -0.05);

// clustered pressure gauges + valve on lower-right front
const mount = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.42,0.1), brassMat);
placeOnBody(mount, -32, -0.28, 0.02); mount.castShadow = true;
placeOnBody(makeGauge(0.14), -37, -0.16, 0.02);
placeOnBody(makeGauge(0.12), -27, -0.40, 0.02);
placeOnBody(makeValve(0.12), -18, -0.24, 0.02);

// gauge on left
placeOnBody(makeGauge(0.13), 34, -0.30, 0.02);

// valve wheels
placeOnBody(makeValve(0.20), 205, 0.50, 0.0);
placeOnBody(makeValve(0.15), 92,  -0.05, 0.0);

// crown vent fitting + bolts
const vent = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.24,0.16,24), brassMat);
vent.position.y = 1.18; vent.castShadow = true; helmet.add(vent);
const ventCap = new THREE.Mesh(new THREE.SphereGeometry(0.2,24,16,0,Math.PI*2,0,Math.PI*0.5), copperMat);
ventCap.position.y = 1.26; helmet.add(ventCap);
const ventRim = new THREE.Mesh(new THREE.TorusGeometry(0.24,0.03,12,24), copperMat);
ventRim.rotation.x = Math.PI/2; ventRim.position.y = 1.12; helmet.add(ventRim);
for(let i=0;i<12;i++){
  const a=(i/12)*Math.PI*2;
  addHexBolt(helmet, Math.cos(a)*0.24, 1.13, Math.sin(a)*0.24, 0.028, 0.05, brassPlain);
}

// coiled brass tubing on the crown-back
const coilGroup = new THREE.Group();
const coil = makeCoilMesh(0.17, 0.05, 3.2, 0.55);
coil.position.y = -0.27; coilGroup.add(coil);
const coilCap = new THREE.Mesh(new THREE.SphereGeometry(0.055,14,10,0,Math.PI*2,0,Math.PI*0.6), copperMat);
coilCap.position.y = 0.30; coilGroup.add(coilCap);
coilGroup.position.set(-0.05, 0.60, -0.55);
coilGroup.rotation.set(-0.5, 0.3, 0.15);
helmet.add(coilGroup);

// short connector from coil into the crown
{
  const p = [
    new THREE.Vector3(-0.05, 0.42, -0.55),
    new THREE.Vector3(-0.02, 0.30, -0.62),
    new THREE.Vector3( 0.06, 0.20, -0.60),
    new THREE.Vector3( 0.10, 0.10, -0.50)
  ];
  const t = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(p), 30, 0.05, 10), brassPlain);
  t.castShadow = true; helmet.add(t);
}

// back air-hose elbow
{
  const p = [
    new THREE.Vector3(0.0, -0.35, -0.64),
    new THREE.Vector3(0.0, -0.5, -0.78),
    new THREE.Vector3(0.0, -0.7, -0.85),
    new THREE.Vector3(0.0, -0.92, -0.8)
  ];
  const t = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(p), 30, 0.08, 12), ironMat);
  t.castShadow = true; helmet.add(t);
  const fit = new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.11,0.14,16), brassMat);
  fit.position.set(0,-0.34,-0.62); fit.rotation.x = 0.6; helmet.add(fit);
}

// side air fitting + curved pipe
{
  const th = 250*Math.PI/180;
  const r = profileRadius(-0.2);
  const start = new THREE.Vector3(Math.sin(th)*r, -0.2, Math.cos(th)*r);
  const p = [
    start,
    start.clone().add(new THREE.Vector3(Math.sin(th)*0.25,-0.15,Math.cos(th)*0.25)),
    start.clone().add(new THREE.Vector3(Math.sin(th)*0.15,-0.5,Math.cos(th)*0.15)),
    new THREE.Vector3(Math.sin(th)*0.5, -0.9, Math.cos(th)*0.5)
  ];
  const t = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(p), 32, 0.06, 10), brassPlain);
  t.castShadow = true; helmet.add(t);
  const fit = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,0.16,16), brassMat);
  fit.position.copy(start); fit.lookAt(start.x+Math.sin(th), -0.2, start.z+Math.cos(th));
  fit.rotateX(Math.PI/2); helmet.add(fit);
}

// pilot lamp on the crown-front
const lamp = makeLamp();
placeOnBody(lamp, 22, 0.86, 0.02);
lamp.rotateX(-0.55); // tilt upright-ish outward

// center the whole assembly vertically
const bbox = new THREE.Box3().setFromObject(helmet);
const center = bbox.getCenter(new THREE.Vector3());
helmet.position.y -= center.y;

/* ================= Resize ================= */
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
});

/* ================= Animate ================= */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  // gentle pilot-lamp flicker
  const flick = 1.0 + Math.sin(t*10.0)*0.12 + Math.sin(t*23.0)*0.06;
  if(lamp.userData.core) lamp.userData.core.material.emissiveIntensity = 2.0*flick;
  if(lamp.userData.light) lamp.userData.light.intensity = 0.85*flick;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
