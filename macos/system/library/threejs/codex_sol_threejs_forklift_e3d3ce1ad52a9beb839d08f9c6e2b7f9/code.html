<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Warehouse Forklift</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #dce3e6;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 18px;
      bottom: 16px;
      color: rgba(28, 35, 38, 0.72);
      font: 12px/1.4 system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Warehouse Forklift · Drag to orbit · Scroll to zoom</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdfe6e8);
    scene.fog = new THREE.Fog(0xdfe6e8, 11, 24);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(6.7, 4.4, 6.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(-0.25, 1.25, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.minDistance = 4.8;
    controls.maxDistance = 14;
    controls.maxPolarAngle = Math.PI * 0.48;

    const hemi = new THREE.HemisphereLight(0xeaf7ff, 0x66705f, 1.8);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xfff4df, 4.2);
    key.position.set(-4, 8, 5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -7;
    key.shadow.camera.right = 7;
    key.shadow.camera.top = 7;
    key.shadow.camera.bottom = -7;
    key.shadow.camera.near = 0.5;
    key.shadow.camera.far = 22;
    key.shadow.bias = -0.00015;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xbfd8ff, 1.25);
    fill.position.set(6, 4, -6);
    scene.add(fill);

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0xb9c0bd,
      roughness: 0.92,
      metalness: 0.02
    });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(30, 30, 0x8d9795, 0xaab2b0);
    grid.position.y = 0.003;
    grid.material.transparent = true;
    grid.material.opacity = 0.22;
    scene.add(grid);

    const mats = {
      yellow: new THREE.MeshStandardMaterial({ color: 0xe8a800, roughness: 0.4, metalness: 0.25 }),
      yellowDark: new THREE.MeshStandardMaterial({ color: 0xb87500, roughness: 0.45, metalness: 0.3 }),
      steel: new THREE.MeshStandardMaterial({ color: 0x343b3d, roughness: 0.34, metalness: 0.72 }),
      darkSteel: new THREE.MeshStandardMaterial({ color: 0x1b2122, roughness: 0.36, metalness: 0.68 }),
      black: new THREE.MeshStandardMaterial({ color: 0x111516, roughness: 0.7, metalness: 0.08 }),
      rubber: new THREE.MeshStandardMaterial({ color: 0x121313, roughness: 0.96, metalness: 0 }),
      seat: new THREE.MeshStandardMaterial({ color: 0x171b1c, roughness: 0.72, metalness: 0.02 }),
      hub: new THREE.MeshStandardMaterial({ color: 0xd6a01a, roughness: 0.35, metalness: 0.55 }),
      chrome: new THREE.MeshStandardMaterial({ color: 0xa9b1b2, roughness: 0.2, metalness: 0.9 }),
      glass: new THREE.MeshPhysicalMaterial({
        color: 0xcfe8ed,
        roughness: 0.12,
        metalness: 0,
        transmission: 0.45,
        transparent: true,
        opacity: 0.56
      }),
      red: new THREE.MeshStandardMaterial({ color: 0xa5160d, roughness: 0.28, metalness: 0.2 }),
      white: new THREE.MeshStandardMaterial({
        color: 0xffffe5,
        roughness: 0.2,
        metalness: 0.05,
        emissive: 0xffe0a0,
        emissiveIntensity: 0.5
      })
    };

    const forklift = new THREE.Group();
    forklift.rotation.y = -0.08;
    scene.add(forklift);

    function addBox(name, size, position, material, parent = forklift, rotation = null) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material);
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      if (rotation) mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder(name, radiusTop, radiusBottom, height, segments, position, material, parent = forklift, rotation = null) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
        material
      );
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      if (rotation) mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addTubeBetween(a, b, radius, material, parent = forklift, segments = 10) {
      const start = new THREE.Vector3(...a);
      const end = new THREE.Vector3(...b);
      const direction = end.clone().sub(start);
      const length = direction.length();
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, segments),
        material
      );
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function roundedBody() {
      const shape = new THREE.Shape();
      shape.moveTo(-1.31, 0.23);
      shape.lineTo(0.93, 0.23);
      shape.quadraticCurveTo(1.38, 0.25, 1.49, 0.61);
      shape.lineTo(1.49, 1.08);
      shape.quadraticCurveTo(1.46, 1.3, 1.23, 1.4);
      shape.lineTo(0.45, 1.51);
      shape.lineTo(0.16, 1.11);
      shape.lineTo(-0.68, 1.07);
      shape.lineTo(-0.87, 0.78);
      shape.lineTo(-1.31, 0.69);
      shape.closePath();

      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: 1.02,
        steps: 1,
        bevelEnabled: true,
        bevelSegments: 4,
        bevelSize: 0.07,
        bevelThickness: 0.07
      });
      geometry.translate(0, 0, -0.51);
      geometry.computeVertexNormals();

      const mesh = new THREE.Mesh(geometry, mats.yellow);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      forklift.add(mesh);
      return mesh;
    }

    roundedBody();

    addBox('lower chassis', [2.62, 0.23, 0.92], [0.03, 0.28, 0], mats.darkSteel);
    addBox('front apron', [0.25, 0.64, 1.02], [-1.22, 0.67, 0], mats.yellowDark);
    addBox('counterweight band', [0.15, 0.63, 0.94], [1.43, 0.72, 0], mats.yellowDark);
    addBox('floor plate', [1.03, 0.1, 0.89], [-0.1, 1.04, 0], mats.darkSteel);
    addBox('left step', [0.58, 0.11, 0.24], [0.06, 0.56, 0.65], mats.darkSteel);
    addBox('right step', [0.58, 0.11, 0.24], [0.06, 0.56, -0.65], mats.darkSteel);

    for (const z of [-0.67, 0.67]) {
      const tread = addBox('step tread', [0.42, 0.018, 0.2], [0.05, 0.622, z], mats.black);
      tread.rotation.y = z > 0 ? 0.02 : -0.02;
    }

    function makeWheel(x, y, z, radius, width, steering = false) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      if (steering) group.rotation.y = z > 0 ? -0.09 : 0.09;
      forklift.add(group);

      const tire = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, width, 32, 1),
        mats.rubber
      );
      tire.rotation.x = Math.PI / 2;
      tire.castShadow = true;
      tire.receiveShadow = true;
      group.add(tire);

      const rim = new THREE.Mesh(
        new THREE.CylinderGeometry(radius * 0.53, radius * 0.53, width + 0.012, 24),
        mats.hub
      );
      rim.rotation.x = Math.PI / 2;
      rim.castShadow = true;
      group.add(rim);

      const hub = new THREE.Mesh(
        new THREE.CylinderGeometry(radius * 0.18, radius * 0.18, width + 0.035, 20),
        mats.darkSteel
      );
      hub.rotation.x = Math.PI / 2;
      hub.castShadow = true;
      group.add(hub);

      for (let i = 0; i < 8; i++) {
        const angle = i * Math.PI / 4;
        const mark = new THREE.Mesh(
          new THREE.BoxGeometry(radius * 0.2, width + 0.018, radius * 0.045),
          mats.black
        );
        mark.position.set(Math.sin(angle) * radius * 0.88, 0, Math.cos(angle) * radius * 0.88);
        mark.rotation.y = angle;
        group.add(mark);
      }
    }

    makeWheel(-0.92, 0.47, 0.59, 0.45, 0.25);
    makeWheel(-0.92, 0.47, -0.59, 0.45, 0.25);
    makeWheel(1.04, 0.32, 0.57, 0.30, 0.21, true);
    makeWheel(1.04, 0.32, -0.57, 0.30, 0.21, true);

    const cab = new THREE.Group();
    forklift.add(cab);

    addBox('seat base', [0.55, 0.13, 0.57], [0.47, 1.29, 0], mats.darkSteel, cab);
    const seatCushion = addBox('seat cushion', [0.52, 0.16, 0.53], [0.42, 1.44, 0], mats.seat, cab);
    seatCushion.rotation.z = -0.04;
    const seatBack = addBox('seat back', [0.17, 0.72, 0.56], [0.78, 1.76, 0], mats.seat, cab, [0, 0, -0.18]);
    addBox('headrest', [0.14, 0.22, 0.42], [0.89, 2.13, 0], mats.seat, cab, [0, 0, -0.16]);

    addBox('dashboard', [0.41, 0.45, 0.69], [-0.53, 1.42, 0], mats.yellowDark, cab, [0, 0, -0.05]);
    addBox('instrument panel', [0.2, 0.27, 0.5], [-0.68, 1.69, 0], mats.black, cab, [0, 0, -0.22]);

    const gaugeMaterial = new THREE.MeshStandardMaterial({
      color: 0x9fd4dd,
      emissive: 0x285c68,
      emissiveIntensity: 0.55,
      roughness: 0.2
    });
    for (const z of [-0.13, 0.13]) {
      const gauge = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.018, 20), gaugeMaterial);
      gauge.position.set(-0.785, 1.73, z);
      gauge.rotation.z = Math.PI / 2 - 0.22;
      gauge.castShadow = true;
      cab.add(gauge);
    }

    addTubeBetween([-0.56, 1.67, 0], [-0.36, 1.96, 0], 0.028, mats.darkSteel, cab);
    const steering = new THREE.Mesh(new THREE.TorusGeometry(0.22, 0.032, 10, 28), mats.black);
    steering.position.set(-0.31, 2.0, 0);
    steering.rotation.y = Math.PI / 2;
    steering.rotation.z = -0.45;
    steering.castShadow = true;
    cab.add(steering);
    addTubeBetween([-0.31, 2.0, -0.18], [-0.31, 2.0, 0.18], 0.018, mats.darkSteel, cab);

    addBox('left pedal', [0.24, 0.035, 0.12], [-0.34, 1.13, 0.21], mats.black, cab, [0, 0, -0.15]);
    addBox('right pedal', [0.24, 0.035, 0.12], [-0.34, 1.13, -0.21], mats.black, cab, [0, 0, -0.15]);

    for (const z of [-0.51, 0.51]) {
      addTubeBetween([-0.56, 1.04, z], [-0.49, 3.15, z], 0.045, mats.darkSteel, cab);
      addTubeBetween([0.9, 1.12, z], [0.8, 3.15, z], 0.05, mats.darkSteel, cab);
      addTubeBetween([-0.49, 3.15, z], [0.8, 3.15, z], 0.045, mats.darkSteel, cab);
    }
    addTubeBetween([-0.49, 3.15, -0.51], [-0.49, 3.15, 0.51], 0.045, mats.darkSteel, cab);
    addTubeBetween([0.8, 3.15, -0.51], [0.8, 3.15, 0.51], 0.045, mats.darkSteel, cab);

    addBox('guard roof', [1.46, 0.08, 1.12], [0.14, 3.18, 0], mats.yellow);
    for (const z of [-0.34, 0, 0.34]) {
      addBox('roof rail', [1.24, 0.045, 0.045], [0.14, 3.235, z], mats.darkSteel);
    }

    addBox('rear work light housing', [0.18, 0.16, 0.28], [0.84, 3.12, 0], mats.darkSteel);
    addBox('rear work light', [0.05, 0.105, 0.19], [0.94, 3.12, 0], mats.red);

    for (const z of [-0.38, 0.38]) {
      addBox('front light housing', [0.16, 0.19, 0.24], [-0.56, 3.07, z], mats.darkSteel);
      addBox('front work light', [0.045, 0.125, 0.17], [-0.655, 3.07, z], mats.white);
    }

    const mast = new THREE.Group();
    forklift.add(mast);

    for (const z of [-0.5, 0.5]) {
      addBox('outer mast rail', [0.16, 2.84, 0.18], [-1.52, 1.78, z], mats.darkSteel, mast);
      addBox('inner mast rail', [0.1, 2.45, 0.12], [-1.49, 1.91, z * 0.7], mats.steel, mast);
      addBox('rail highlight', [0.025, 2.62, 0.08], [-1.425, 1.8, z], mats.chrome, mast);
    }

    addBox('mast bottom crossmember', [0.28, 0.22, 1.17], [-1.52, 0.43, 0], mats.darkSteel, mast);
    addBox('mast top crossmember', [0.2, 0.16, 1.15], [-1.51, 3.17, 0], mats.darkSteel, mast);
    addBox('mast mid crossmember', [0.16, 0.12, 0.95], [-1.49, 2.11, 0], mats.steel, mast);

    addCylinder('lift cylinder', 0.075, 0.075, 2.23, 18, [-1.43, 1.48, 0], mats.darkSteel, mast);
    addCylinder('lift piston', 0.042, 0.042, 1.68, 16, [-1.43, 2.27, 0], mats.chrome, mast);

    const pulley = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.11, 24), mats.steel);
    pulley.position.set(-1.43, 3.04, 0);
    pulley.rotation.x = Math.PI / 2;
    pulley.castShadow = true;
    mast.add(pulley);

    for (const z of [-0.18, 0.18]) {
      addTubeBetween([-1.39, 0.73, z], [-1.39, 2.97, z], 0.014, mats.black, mast, 8);
    }

    const carriage = new THREE.Group();
    forklift.add(carriage);

    addBox('carriage upper bar', [0.2, 0.18, 1.24], [-1.64, 1.12, 0], mats.darkSteel, carriage);
    addBox('carriage lower bar', [0.2, 0.14, 1.24], [-1.64, 0.72, 0], mats.darkSteel, carriage);
    for (const z of [-0.48, 0.48]) {
      addBox('carriage upright', [0.17, 0.67, 0.13], [-1.64, 0.91, z], mats.darkSteel, carriage);
      addCylinder('carriage roller', 0.07, 0.07, 0.08, 18, [-1.53, 1.14, z], mats.chrome, carriage, [Math.PI / 2, 0, 0]);
    }

    function makeFork(z) {
      const shape = new THREE.Shape();
      shape.moveTo(-3.18, 0.13);
      shape.lineTo(-1.56, 0.13);
      shape.lineTo(-1.56, 1.05);
      shape.lineTo(-1.43, 1.05);
      shape.lineTo(-1.43, 0.17);
      shape.lineTo(-2.84, 0.17);
      shape.lineTo(-3.18, 0.205);
      shape.closePath();

      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: 0.14,
        steps: 1,
        bevelEnabled: true,
        bevelSegments: 2,
        bevelSize: 0.012,
        bevelThickness: 0.012
      });
      geometry.translate(0, 0, z - 0.07);
      geometry.computeVertexNormals();
      const fork = new THREE.Mesh(geometry, mats.steel);
      fork.castShadow = true;
      fork.receiveShadow = true;
      carriage.add(fork);
    }

    makeFork(-0.34);
    makeFork(0.34);

    for (const z of [-0.63, 0.63]) {
      addBox('mast mounting bracket', [0.42, 0.16, 0.12], [-1.31, 0.5, z], mats.yellowDark);
    }

    addTubeBetween([-1.25, 0.55, -0.55], [-1.42, 1.42, -0.55], 0.036, mats.chrome);
    addTubeBetween([-1.25, 0.55, 0.55], [-1.42, 1.42, 0.55], 0.036, mats.chrome);

    addBox('rear grille', [0.025, 0.38, 0.57], [1.535, 0.91, 0], mats.black);
    for (let i = -2; i <= 2; i++) {
      addBox('grille slot', [0.018, 0.025, 0.47], [1.552, 0.83 + i * 0.065, 0], mats.chrome);
    }

    addBox('tail light left', [0.035, 0.18, 0.14], [1.54, 1.18, 0.34], mats.red);
    addBox('tail light right', [0.035, 0.18, 0.14], [1.54, 1.18, -0.34], mats.red);

    const warningPole = addCylinder('warning beacon base', 0.08, 0.09, 0.07, 18, [0.63, 3.27, -0.37], mats.black);
    const beaconMaterial = new THREE.MeshStandardMaterial({
      color: 0xff8b00,
      emissive: 0xff5a00,
      emissiveIntensity: 1.4,
      roughness: 0.18,
      transparent: true,
      opacity: 0.9
    });
    const beacon = addCylinder('warning beacon', 0.06, 0.07, 0.12, 20, [0.63, 3.365, -0.37], beaconMaterial);
    const beaconCap = new THREE.Mesh(new THREE.SphereGeometry(0.061, 18, 10, 0, Math.PI * 2, 0, Math.PI / 2), beaconMaterial);
    beaconCap.position.set(0.63, 3.425, -0.37);
    beaconCap.castShadow = true;
    forklift.add(beaconCap);

    const decalMaterial = new THREE.MeshStandardMaterial({
      color: 0x212526,
      roughness: 0.65,
      metalness: 0.15
    });
    addBox('side badge', [0.52, 0.16, 0.018], [0.93, 1.14, 0.526], decalMaterial);
    addBox('side badge opposite', [0.52, 0.16, 0.018], [0.93, 1.14, -0.526], decalMaterial);

    const shadowDisc = new THREE.Mesh(
      new THREE.CircleGeometry(2.25, 64),
      new THREE.MeshBasicMaterial({
        color: 0x26302f,
        transparent: true,
        opacity: 0.09,
        depthWrite: false
      })
    );
    shadowDisc.rotation.x = -Math.PI / 2;
    shadowDisc.scale.set(1.5, 0.7, 1);
    shadowDisc.position.set(-0.05, 0.009, 0);
    scene.add(shadowDisc);

    function animate(time) {
      beaconMaterial.emissiveIntensity = 1.05 + Math.sin(time * 0.006) * 0.45;
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
