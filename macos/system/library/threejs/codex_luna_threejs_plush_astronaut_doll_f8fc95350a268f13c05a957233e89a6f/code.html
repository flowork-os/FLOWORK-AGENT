<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plush Astronaut Doll</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #d9e9ee; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9e9ee);
scene.fog = new THREE.Fog(0xd9e9ee, 10, 22);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.2, 3.8, 7.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.25;
controls.target.set(0, 1.8, 0);

const hemi = new THREE.HemisphereLight(0xf4fbff, 0x8ca4ad, 2.4);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff5e8, 3.3);
key.position.set(-4, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -3;
scene.add(key);

const fill = new THREE.PointLight(0x9ed9e8, 1.7, 12);
fill.position.set(4, 3, 4);
scene.add(fill);

const plush = new THREE.MeshStandardMaterial({
  color: 0xf4f5ef,
  roughness: 0.92,
  metalness: 0
});
const plushShadow = new THREE.MeshStandardMaterial({
  color: 0xd8ddd8,
  roughness: 0.98
});
const seam = new THREE.MeshStandardMaterial({
  color: 0xb4c4c2,
  roughness: 0.88
});
const visorMat = new THREE.MeshStandardMaterial({
  color: 0x183c4c,
  roughness: 0.34,
  metalness: 0.12
});
const visorGlow = new THREE.MeshStandardMaterial({
  color: 0x4f9aaa,
  roughness: 0.28,
  metalness: 0.05
});
const felt = new THREE.MeshStandardMaterial({
  color: 0x356879,
  roughness: 1
});
const feltLight = new THREE.MeshStandardMaterial({
  color: 0x6e9aa0,
  roughness: 1
});
const red = new THREE.MeshStandardMaterial({ color: 0xd75e5d, roughness: 0.86 });
const gold = new THREE.MeshStandardMaterial({ color: 0xeab96e, roughness: 0.72 });
const black = new THREE.MeshStandardMaterial({ color: 0x17252b, roughness: 0.9 });

const astronaut = new THREE.Group();
astronaut.position.y = 0.05;
scene.add(astronaut);

function mesh(geometry, material, position, scale, rotation) {
  const item = new THREE.Mesh(geometry, material);
  if (position) item.position.set(position[0], position[1], position[2]);
  if (scale) item.scale.set(scale[0], scale[1], scale[2]);
  if (rotation) item.rotation.set(rotation[0], rotation[1], rotation[2]);
  item.castShadow = true;
  item.receiveShadow = true;
  astronaut.add(item);
  return item;
}

function seamRing(radius, tube, position, scale, rotation) {
  return mesh(
    new THREE.TorusGeometry(radius, tube, 12, 64),
    seam,
    position,
    scale,
    rotation
  );
}

function stitchBox(position, scale, rotation, material = seam) {
  return mesh(new THREE.BoxGeometry(1, 1, 1), material, position, scale, rotation);
}

function capsule(position, radius, length, scale, rotation, material = plush) {
  return mesh(new THREE.CapsuleGeometry(radius, length, 12, 24), material, position, scale, rotation);
}

mesh(new THREE.SphereGeometry(1, 1, 48, 32), plush, [0, 1.65, 0], [1.06, 1.25, 0.82]);

seamRing(0.82, 0.018, [0, 1.68, 0], [1.02, 0.86, 1], [Math.PI / 2, 0, 0]);
seamRing(0.67, 0.014, [0, 1.22, 0.02], [1.0, 0.82, 1], [Math.PI / 2, 0, 0]);

const bodySeam = new THREE.Mesh(
  new THREE.TorusGeometry(0.92, 0.014, 8, 48, Math.PI * 0.72),
  seam
);
bodySeam.position.set(0, 1.62, 0.69);
bodySeam.rotation.set(Math.PI / 2, 0, Math.PI / 2);
bodySeam.scale.set(1, 1.2, 1);
bodySeam.castShadow = true;
astronaut.add(bodySeam);

const helmet = mesh(new THREE.SphereGeometry(1, 48, 32), plush, [0, 3.08, 0], [0.91, 0.88, 0.82]);
seamRing(0.73, 0.018, [0, 3.12, 0], [1.0, 1.0, 1], [Math.PI / 2, 0, 0]);
seamRing(0.89, 0.025, [0, 2.68, 0.03], [0.88, 0.7, 0.82], [Math.PI / 2, 0, 0]);

mesh(new THREE.SphereGeometry(1, 40, 24), visorMat, [0, 3.08, 0.73], [0.67, 0.49, 0.105]);
mesh(new THREE.SphereGeometry(1, 32, 20), visorGlow, [-0.22, 3.27, 0.835], [0.17, 0.09, 0.025]);
mesh(new THREE.SphereGeometry(1, 24, 16), visorGlow, [0.23, 2.93, 0.835], [0.08, 0.045, 0.02]);
mesh(new THREE.TorusGeometry(0.59, 0.045, 12, 64), seam, [0, 3.08, 0.82], [1, 0.75, 1], [0, 0, 0]);

for (let index = 0; index < 16; index++) {
  const angle = index / 16 * Math.PI * 2;
  const px = Math.cos(angle) * 0.61;
  const py = 3.08 + Math.sin(angle) * 0.46;
  const dot = mesh(new THREE.SphereGeometry(0.018, 8, 6), seam, [px, py, 0.87], [1, 1, 0.7]);
  dot.rotation.z = -angle;
}

const leftArm = capsule([-1.13, 1.86, 0], 0.31, 0.72, [1, 1.1, 1], [0, 0, -0.48]);
const rightArm = capsule([1.13, 1.86, 0], 0.31, 0.72, [1, 1.1, 1], [0, 0, 0.48]);

mesh(new THREE.SphereGeometry(0.38, 32, 20), plush, [-1.48, 1.29, 0.03], [1.0, 0.92, 0.9]);
mesh(new THREE.SphereGeometry(0.38, 32, 20), plush, [1.48, 1.29, 0.03], [1.0, 0.92, 0.9]);
seamRing(0.3, 0.016, [-1.48, 1.3, 0.03], [1, 1, 1], [0, 0, 0]);
seamRing(0.3, 0.016, [1.48, 1.3, 0.03], [1, 1, 1], [0, 0, 0]);

for (let side of [-1, 1]) {
  const x = side * 0.48;
  capsule([x, 0.48, 0.02], 0.36, 0.65, [1.05, 1.0, 1.0], [0, 0, side * 0.12]);
  mesh(new THREE.SphereGeometry(0.48, 32, 20), plushShadow, [x, 0.08, 0.12], [0.9, 0.63, 1.0]);
  seamRing(0.34, 0.018, [x, 0.43, 0.02], [1.02, 1, 1], [0, 0, 0]);
  seamRing(0.38, 0.018, [x, 0.1, 0.12], [0.9, 0.65, 1], [Math.PI / 2, 0, 0]);
}

const patch = mesh(new THREE.BoxGeometry(0.72, 0.62, 0.07), felt, [0, 1.83, 0.77], [1, 1, 1]);
patch.rotation.z = -0.025;
stitchBox([-0.37, 1.83, 0.812], [0.025, 0.62, 0.025], [0, 0, 0]);
stitchBox([0.37, 1.83, 0.812], [0.025, 0.62, 0.025], [0, 0, 0]);
stitchBox([0, 2.14, 0.812], [0.72, 0.025, 0.025], [0, 0, 0]);
stitchBox([0, 1.52, 0.812], [0.72, 0.025, 0.025], [0, 0, 0]);

mesh(new THREE.CircleGeometry(0.18, 24), feltLight, [0, 1.93, 0.855], [1, 1, 1], [-Math.PI / 2, 0, 0]);
mesh(new THREE.CircleGeometry(0.11, 20), red, [0, 1.93, 0.875], [1, 1, 1], [-Math.PI / 2, 0, 0]);
for (let index = 0; index < 4; index++) {
  const bx = -0.23 + index * 0.15;
  stitchBox([bx, 1.69, 0.85], [0.075, 0.025, 0.025], [0, 0, -0.2], gold);
}

mesh(new THREE.SphereGeometry(0.075, 16, 12), red, [-0.3, 2.38, 0.79], [1, 1, 0.5]);
mesh(new THREE.SphereGeometry(0.075, 16, 12), gold, [-0.1, 2.38, 0.79], [1, 1, 0.5]);
mesh(new THREE.SphereGeometry(0.075, 16, 12), black, [0.1, 2.38, 0.79], [1, 1, 0.5]);

const floor = new THREE.Mesh(
  new THREE.CylinderGeometry(3.7, 3.7, 0.18, 64),
  new THREE.MeshStandardMaterial({ color: 0xb9d0d2, roughness: 1 })
);
floor.position.y = -0.13;
floor.receiveShadow = true;
scene.add(floor);

const halo = new THREE.Mesh(
  new THREE.TorusGeometry(2.45, 0.018, 8, 96),
  new THREE.MeshBasicMaterial({ color: 0xc8e3e5, transparent: true, opacity: 0.65 })
);
halo.rotation.x = Math.PI / 2;
halo.position.y = -0.02;
scene.add(halo);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
