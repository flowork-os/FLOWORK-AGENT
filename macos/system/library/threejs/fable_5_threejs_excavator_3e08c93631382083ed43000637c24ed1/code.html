<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hydraulic Excavator</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd6dd; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfd6dd);
scene.fog = new THREE.Fog(0xcfd6dd, 30, 70);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(9, 6, 10);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.6, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 5;
controls.maxDistance = 30;

// ---------- lighting ----------
scene.add(new THREE.HemisphereLight(0xdfe8f5, 0x6b6257, 0.9));

const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(8, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -10;
sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10;
sun.shadow.camera.bottom = -10;
sun.shadow.camera.far = 40;
sun.shadow.bias = -0.0005;
sun.shadow.radius = 4;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xcfe0ff, 0.5);
fill.position.set(-7, 5, -6);
scene.add(fill);

// ---------- materials ----------
const yellow = new THREE.MeshStandardMaterial({ color: 0xf2a900, roughness: 0.45, metalness: 0.25 });
const darkGrey = new THREE.MeshStandardMaterial({ color: 0x2b2e33, roughness: 0.8, metalness: 0.3 });
const midGrey = new THREE.MeshStandardMaterial({ color: 0x54595f, roughness: 0.6, metalness: 0.5 });
const steel = new THREE.MeshStandardMaterial({ color: 0x9aa0a6, roughness: 0.35, metalness: 0.85 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xd8dde2, roughness: 0.15, metalness: 1.0 });
const glass = new THREE.MeshStandardMaterial({ color: 0x1c2b33, roughness: 0.1, metalness: 0.6 });
const bucketMat = new THREE.MeshStandardMaterial({ color: 0x6e645a, roughness: 0.7, metalness: 0.55 });

function box(w, h, d, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  return m;
}
function cyl(r, len, mat, seg = 24) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
// pivot pin along X (lateral) axis
function pin(r, len, x, y, z, parent) {
  const p = cyl(r, len, chrome);
  p.rotation.z = Math.PI / 2;
  p.position.set(x, y, z);
  parent.add(p);
  return p;
}

const excavator = new THREE.Group();
scene.add(excavator);

// ================= undercarriage =================
const under = new THREE.Group();
excavator.add(under);

function makeTrack(side) {
  const t = new THREE.Group();
  t.position.x = side * 1.15;
  // track frame
  t.add(box(0.55, 0.5, 3.4, midGrey, 0, 0.55, 0));
  // rubber/steel track shell (rounded loop shape)
  const shape = new THREE.Shape();
  const r = 0.42, L = 1.55;
  shape.moveTo(-L, r); shape.lineTo(L, r);
  shape.absarc(L, 0, r, Math.PI / 2, -Math.PI / 2, true);
  shape.lineTo(-L, -r);
  shape.absarc(-L, 0, r, -Math.PI / 2, Math.PI / 2, true);
  const inner = new THREE.Path();
  const ri = 0.30, Li = 1.5;
  inner.moveTo(-Li, ri); inner.lineTo(Li, ri);
  inner.absarc(Li, 0, ri, Math.PI / 2, -Math.PI / 2, true);
  inner.lineTo(-Li, -ri);
  inner.absarc(-Li, 0, ri, -Math.PI / 2, Math.PI / 2, true);
  shape.holes.push(inner);
  const belt = new THREE.Mesh(
    new THREE.ExtrudeGeometry(shape, { depth: 0.62, bevelEnabled: false }),
    darkGrey
  );
  belt.rotation.y = Math.PI / 2;
  belt.position.set(-0.31, 0.45, 0);
  belt.castShadow = belt.receiveShadow = true;
  t.add(belt);
  // sprocket + idler + rollers
  [-1.55, 1.55].forEach(z => {
    const w = cyl(0.3, 0.66, midGrey);
    w.rotation.z = Math.PI / 2;
    w.position.set(0, 0.45, z);
    t.add(w);
  });
  for (let z = -0.95; z <= 0.95; z += 0.475) {
    const rr = cyl(0.16, 0.6, darkGrey);
    rr.rotation.z = Math.PI / 2;
    rr.position.set(0, 0.18, z);
    t.add(rr);
  }
  // grouser cleats over the top run
  for (let z = -1.45; z <= 1.45; z += 0.29) {
    t.add(box(0.66, 0.05, 0.09, darkGrey, 0, 0.9, z));
  }
  return t;
}
under.add(makeTrack(1), makeTrack(-1));
// car body connecting tracks
under.add(box(1.75, 0.42, 1.9, yellow, 0, 0.62, 0));

// ================= slew ring + house =================
const ring = cyl(0.85, 0.22, steel);
ring.position.y = 0.94;
excavator.add(ring);

const house = new THREE.Group();
house.position.y = 1.05;
excavator.add(house);

// main deck
house.add(box(2.5, 0.22, 3.3, yellow, 0, 0.11, -0.15));
// rear counterweight (heavy, overhangs the back)
const cw = box(2.5, 0.95, 1.0, yellow, 0, 0.7, -1.75);
house.add(cw);
house.add(box(2.3, 0.16, 0.9, darkGrey, 0, 1.26, -1.75));
// engine housing
house.add(box(2.3, 0.85, 1.35, yellow, 0, 0.65, -0.55));
// exhaust stack
const stack = cyl(0.07, 0.5, darkGrey);
stack.position.set(-0.75, 1.25, -0.75);
house.add(stack);
// handrail
const rail = cyl(0.025, 2.1, steel);
rail.rotation.x = Math.PI / 2;
rail.position.set(-1.15, 1.45, -0.9);
house.add(rail);

// cab
const cab = new THREE.Group();
cab.position.set(-0.72, 0.22, 0.85);
house.add(cab);
cab.add(box(1.05, 0.32, 1.5, yellow, 0, 0.16, 0));
const cabTop = box(1.05, 1.05, 1.5, glass, 0, 0.85, 0);
cab.add(cabTop);
// cab pillars & roof
cab.add(box(1.09, 0.1, 1.54, yellow, 0, 1.42, 0));
[[-0.5, 0.72], [0.5, 0.72], [-0.5, -0.72], [0.5, -0.72]].forEach(([x, z]) =>
  cab.add(box(0.09, 1.05, 0.09, yellow, x, 0.85, z))
);

// boom mount pedestal (offset right of cab, like real machines)
const pedX = 0.55;
house.add(box(0.7, 0.55, 0.8, yellow, pedX, 0.5, 0.85));

// ================= articulated arm =================
// tapered arm segment: extruded side profile, thickness across X
function armSegment(profilePts, thickness, mat) {
  const s = new THREE.Shape();
  profilePts.forEach((p, i) => (i ? s.lineTo(p[0], p[1]) : s.moveTo(p[0], p[1])));
  const g = new THREE.ExtrudeGeometry(s, { depth: thickness, bevelEnabled: true, bevelSize: 0.02, bevelThickness: 0.02, bevelSegments: 2 });
  g.rotateY(-Math.PI / 2);       // profile in ZY plane, depth along X
  g.translate(-thickness / 2, 0, 0);
  const m = new THREE.Mesh(g, mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
// hydraulic cylinder between two moving points (barrel + rod, aims each frame)
const cylinders = [];
function hydraulic(parentA, localA, parentB, localB, rBarrel, barrelLen) {
  const grp = new THREE.Group();
  const barrel = cyl(rBarrel, barrelLen, yellow);
  barrel.geometry.translate(0, barrelLen / 2, 0);
  const rod = cyl(rBarrel * 0.5, 1, chrome);
  rod.geometry.translate(0, 0.5, 0);
  grp.add(barrel, rod);
  scene.add(grp);
  cylinders.push({ grp, barrel, rod, parentA, localA, parentB, localB, barrelLen });
}
const vA = new THREE.Vector3(), vB = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
function updateHydraulics() {
  for (const c of cylinders) {
    c.parentA.localToWorld(vA.copy(c.localA));
    c.parentB.localToWorld(vB.copy(c.localB));
    c.grp.position.copy(vA);
    c.grp.quaternion.setFromUnitVectors(up, vB.clone().sub(vA).normalize());
    const d = vA.distanceTo(vB);
    c.rod.scale.y = Math.max(d - c.barrelLen * 0.92, 0.05);
    c.rod.position.y = c.barrelLen * 0.92;
  }
}

// --- boom (pivots at pedestal) ---
const boomPivot = new THREE.Group();
boomPivot.position.set(pedX, 0.62, 0.95);
house.add(boomPivot);
pin(0.11, 0.85, 0, 0, 0, boomPivot);

const boomLen = 3.4;
const boom = armSegment(
  [[-0.28, -0.02], [0.30, 0.18], [boomLen * 0.55, 0.62], [boomLen, 0.30], [boomLen, 0.06], [boomLen * 0.5, -0.20], [-0.28, -0.30]].map(p => [p[0], p[1] + 0.1]),
  0.42, yellow
);
boom.rotation.x = -Math.PI / 2;   // profile "forward" axis -> +Z
const boomTilt = new THREE.Group();
boomTilt.add(boom);
boomPivot.add(boomTilt);
pin(0.1, 0.6, 0, 0, boomLen, boomTilt); // boom tip pin

// --- stick (pivots at boom tip) ---
const stickPivot = new THREE.Group();
stickPivot.position.set(0, 0, boomLen);
boomTilt.add(stickPivot);

const stickLen = 1.9;
const stick = armSegment(
  [[-0.35, 0.24], [stickLen, 0.13], [stickLen, -0.05], [-0.1, -0.24], [-0.35, -0.10]],
  0.3, yellow
);
stick.rotation.x = -Math.PI / 2;
stickPivot.add(stick);
pin(0.09, 0.46, 0, 0, stickLen, stickPivot); // bucket pin

// --- bucket (pivots at stick tip) ---
const bucketPivot = new THREE.Group();
bucketPivot.position.set(0, 0, stickLen);
stickPivot.add(bucketPivot);

const bucket = new THREE.Group();
bucketPivot.add(bucket);
{
  const w = 0.9, sh = new THREE.Shape();
  sh.moveTo(0, 0);
  sh.absarc(0.28, 0.02, 0.45, Math.PI * 1.05, Math.PI * 1.85, false);
  sh.lineTo(0.62, 0.30);
  sh.lineTo(0.0, 0.16);
  sh.closePath();
  const shell = new THREE.Mesh(
    new THREE.ExtrudeGeometry(sh, { depth: w, bevelEnabled: false }),
    bucketMat
  );
  shell.rotateY(-Math.PI / 2);
  shell.position.set(w / 2, -0.62, -0.12);
  shell.rotation.x = -Math.PI / 2;
  shell.castShadow = shell.receiveShadow = true;
  // teeth
  for (let i = 0; i < 4; i++) {
    const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.22, 4), steel);
    tooth.castShadow = true;
    tooth.position.set(-w / 2 + 0.13 + i * (w - 0.26) / 3, -0.66, 0.58);
    tooth.rotation.x = Math.PI / 2.6;
    shell.add ? null : null;
    bucket.add(tooth);
  }
  // side link plates to pin
  bucket.add(box(0.06, 0.5, 0.2, bucketMat, -0.2, -0.18, 0.02));
  bucket.add(box(0.06, 0.5, 0.2, bucketMat, 0.2, -0.18, 0.02));
  bucket.add(shell);
}

// --- hydraulic cylinders ---
// boom cylinders (pair): deck front -> underside of boom
hydraulic(house, new THREE.Vector3(pedX - 0.22, 0.35, 1.45), boomTilt, new THREE.Vector3(-0.22, 0.15, boomLen * 0.48), 0.075, 1.1);
hydraulic(house, new THREE.Vector3(pedX + 0.22, 0.35, 1.45), boomTilt, new THREE.Vector3(0.22, 0.15, boomLen * 0.48), 0.075, 1.1);
// stick cylinder: top of boom -> stick heel
hydraulic(boomTilt, new THREE.Vector3(0, 0.62, boomLen * 0.42), stickPivot, new THREE.Vector3(0, 0.28, -0.3), 0.07, 1.0);
// bucket cylinder: stick back -> bucket link
hydraulic(stickPivot, new THREE.Vector3(0, 0.24, stickLen * 0.18), bucket, new THREE.Vector3(0, -0.05, -0.28), 0.06, 0.75);

// initial articulated pose
boomTilt.rotation.x = -0.85;
stickPivot.rotation.x = 1.5;
bucketPivot.rotation.x = 0.9;

// ================= ground =================
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(40, 64),
  new THREE.MeshStandardMaterial({ color: 0xb7ab97, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// soft contact shadow disc
const shadowTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 20, 128, 128, 128);
  grad.addColorStop(0, 'rgba(0,0,0,0.35)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const blob = new THREE.Mesh(
  new THREE.PlaneGeometry(7.5, 7.5),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
);
blob.rotation.x = -Math.PI / 2;
blob.position.y = 0.01;
scene.add(blob);

// ================= animation =================
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  // gentle working motion
  house.rotation.y = Math.sin(t * 0.25) * 0.35;
  ring.rotation.y = house.rotation.y;
  boomTilt.rotation.x = -0.85 + Math.sin(t * 0.5) * 0.18;
  stickPivot.rotation.x = 1.5 + Math.sin(t * 0.5 + 1.2) * 0.28;
  bucketPivot.rotation.x = 0.9 + Math.sin(t * 0.5 + 2.1) * 0.35;
  updateHydraulics();
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
