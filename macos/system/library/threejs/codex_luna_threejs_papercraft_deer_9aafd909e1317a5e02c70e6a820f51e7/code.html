<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papercraft Deer</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #dfe8e5;
}
canvas {
  display: block;
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe8e5);
scene.fog = new THREE.Fog(0xdfe8e5, 9, 17);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.3, 3.7, 7.2);
camera.lookAt(0.55, 1.75, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 4.5;
controls.maxDistance = 11;
controls.target.set(0.45, 1.75, 0);

const paper = new THREE.MeshStandardMaterial({
  color: 0xb98258,
  roughness: 0.88,
  metalness: 0,
  flatShading: true
});
const paperLight = new THREE.MeshStandardMaterial({
  color: 0xd4a278,
  roughness: 0.9,
  metalness: 0,
  flatShading: true
});
const paperDark = new THREE.MeshStandardMaterial({
  color: 0x8b5941,
  roughness: 0.9,
  metalness: 0,
  flatShading: true
});
const innerPaper = new THREE.MeshStandardMaterial({
  color: 0xf0c9a0,
  roughness: 0.92,
  metalness: 0,
  side: THREE.DoubleSide,
  flatShading: true
});
const creaseMaterial = new THREE.LineBasicMaterial({
  color: 0x714535,
  transparent: true,
  opacity: 0.72
});
const edgeMaterial = new THREE.LineBasicMaterial({
  color: 0x684536,
  transparent: true,
  opacity: 0.58
});
const black = new THREE.MeshStandardMaterial({
  color: 0x241d1a,
  roughness: 0.78,
  flatShading: true
});
const antlerMaterial = new THREE.MeshStandardMaterial({
  color: 0x5e4433,
  roughness: 0.95,
  flatShading: true
});

const deer = new THREE.Group();
deer.position.y = 0.03;
scene.add(deer);

function addEdges(mesh, threshold = 18) {
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, threshold), edgeMaterial);
  edges.scale.set(1.002, 1.002, 1.002);
  mesh.add(edges);
  return mesh;
}

function makePanel(vertices, faces, material, withEdges = true) {
  const positions = [];
  for (const face of faces) {
    for (const index of face) {
      positions.push(vertices[index][0], vertices[index][1], vertices[index][2]);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  if (withEdges) addEdges(mesh, 12);
  return mesh;
}

function cylinderBetween(start, end, radius, material, radialSegments = 5, topRadius = radius) {
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(topRadius, radius, length, radialSegments, 1, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  addEdges(mesh, 20);
  return mesh;
}

function crease(points, parent, opacity = 0.72) {
  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  const material = creaseMaterial.clone();
  material.opacity = opacity;
  parent.add(new THREE.Line(geometry, material));
}

const body = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), paper);
body.scale.set(1.42, 0.78, 0.58);
body.position.set(-0.12, 1.72, 0);
addEdges(body, 22);
deer.add(body);

const chestPanel = new THREE.Mesh(new THREE.PlaneGeometry(0.82, 1.18), paperLight);
chestPanel.position.set(0.78, 1.78, 0.575);
chestPanel.rotation.y = 0.08;
chestPanel.rotation.z = -0.11;
deer.add(chestPanel);
crease([
  new THREE.Vector3(0.39, 1.25, 0.584),
  new THREE.Vector3(0.66, 2.25, 0.584)
], deer, 0.58);

crease([
  new THREE.Vector3(-0.93, 1.92, 0.568),
  new THREE.Vector3(-0.1, 2.28, 0.568),
  new THREE.Vector3(0.67, 2.14, 0.568)
], deer, 0.5);

const bellySeam = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.045, 0.035), paperDark);
bellySeam.position.set(-0.08, 1.13, 0.52);
bellySeam.rotation.z = 0.04;
deer.add(bellySeam);

const neckStart = new THREE.Vector3(0.78, 2.12, 0);
const neckEnd = new THREE.Vector3(1.22, 3.23, 0);
const neck = cylinderBetween(neckStart, neckEnd, 0.43, paper, 5, 0.27);
deer.add(neck);
crease([
  new THREE.Vector3(0.98, 2.25, 0.32),
  new THREE.Vector3(1.25, 3.1, 0.22)
], deer, 0.64);

const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.57, 1), paperLight);
head.scale.set(1.14, 0.9, 0.72);
head.position.set(1.52, 3.42, 0);
head.rotation.z = -0.1;
addEdges(head, 20);
deer.add(head);

const muzzle = new THREE.Mesh(new THREE.IcosahedronGeometry(0.3, 0), paperLight);
muzzle.scale.set(1.2, 0.72, 0.82);
muzzle.position.set(1.97, 3.29, 0);
muzzle.rotation.z = -0.08;
addEdges(muzzle, 15);
deer.add(muzzle);

const nose = new THREE.Mesh(new THREE.IcosahedronGeometry(0.13, 0), paperDark);
nose.scale.set(1.15, 0.72, 0.9);
nose.position.set(2.22, 3.28, 0);
deer.add(nose);

function makeEar(z) {
  const vertices = [
    [1.23, 3.78, z - 0.035],
    [1.52, 3.72, z - 0.035],
    [1.28, 4.34, z - 0.035],
    [1.23, 3.78, z + 0.035],
    [1.52, 3.72, z + 0.035],
    [1.28, 4.34, z + 0.035]
  ];
  const faces = [
    [0, 1, 2], [3, 5, 4],
    [0, 3, 4], [0, 4, 1],
    [1, 4, 5], [1, 5, 2],
    [2, 5, 3], [2, 3, 0]
  ];
  return makePanel(vertices, faces, innerPaper);
}
deer.add(makeEar(0.34));
deer.add(makeEar(-0.34));

const eyeGeometry = new THREE.SphereGeometry(0.075, 8, 4);
const eyeFront = new THREE.Mesh(eyeGeometry, black);
eyeFront.position.set(1.76, 3.55, 0.51);
deer.add(eyeFront);
const eyeBack = new THREE.Mesh(eyeGeometry, black);
eyeBack.position.set(1.76, 3.55, -0.51);
deer.add(eyeBack);

function addLeg(x, z, lean, rear) {
  const hip = new THREE.Vector3(x, 1.42, z);
  const knee = new THREE.Vector3(x + lean, 0.72, z + (z > 0 ? 0.035 : -0.035));
  const hoofPoint = new THREE.Vector3(x + lean - 0.035, 0.17, z);
  const upper = cylinderBetween(hip, knee, 0.16, rear ? paperDark : paper, 4, 0.145);
  const lower = cylinderBetween(knee, hoofPoint, 0.135, rear ? paperDark : paperLight, 4, 0.12);
  deer.add(upper, lower);
  const hoof = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.18, 0.3), paperDark);
  hoof.position.copy(hoofPoint);
  hoof.rotation.z = lean * 0.15;
  deer.add(hoof);
  crease([
    new THREE.Vector3(knee.x - 0.11, knee.y, knee.z + 0.14),
    new THREE.Vector3(knee.x + 0.08, knee.y - 0.02, knee.z + 0.14)
  ], deer, 0.55);
}

addLeg(-0.76, 0.3, -0.06, false);
addLeg(0.55, 0.3, 0.08, false);
addLeg(-0.88, -0.3, 0.08, true);
addLeg(0.45, -0.3, -0.08, true);

const tail = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.66, 5, 1, false), paperLight);
tail.position.set(-1.48, 2.05, 0);
tail.rotation.z = -1.18;
addEdges(tail, 18);
deer.add(tail);

const antlerRootA = new THREE.Vector3(1.25, 3.78, 0.2);
const antlerRootB = new THREE.Vector3(1.25, 3.78, -0.2);
function makeAntler(z) {
  const root = new THREE.Vector3(1.28, 3.78, z);
  const fork = new THREE.Vector3(1.2, 4.28, z);
  const tip = new THREE.Vector3(1.0, 4.63, z);
  const outer = new THREE.Vector3(1.5, 4.2, z);
  const outerTip = new THREE.Vector3(1.68, 4.52, z);
  const branch = new THREE.Vector3(1.08, 4.02, z);
  deer.add(
    cylinderBetween(root, fork, 0.075, antlerMaterial, 5, 0.065),
    cylinderBetween(fork, tip, 0.065, antlerMaterial, 5, 0.045),
    cylinderBetween(fork, outer, 0.065, antlerMaterial, 5, 0.05),
    cylinderBetween(outer, outerTip, 0.05, antlerMaterial, 5, 0.032),
    cylinderBetween(fork, branch, 0.055, antlerMaterial, 5, 0.035)
  );
}
makeAntler(0.2);
makeAntler(-0.2);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(12, 64),
  new THREE.MeshStandardMaterial({ color: 0xcbd8d2, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

const shadowDisc = new THREE.Mesh(
  new THREE.CircleGeometry(1.72, 48),
  new THREE.MeshBasicMaterial({ color: 0x9caaa4, transparent: true, opacity: 0.2, depthWrite: false })
);
shadowDisc.rotation.x = -Math.PI / 2;
shadowDisc.scale.set(1.45, 0.44, 1);
shadowDisc.position.set(-0.05, 0.008, 0);
scene.add(shadowDisc);

const hemi = new THREE.HemisphereLight(0xf3eee3, 0x82918d, 2.1);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4df, 3.2);
key.position.set(-4, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -1;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 18;
scene.add(key);

const rim = new THREE.DirectionalLight(0xb7d6d2, 1.5);
rim.position.set(4, 4, -5);
scene.add(rim);

deer.traverse(object => {
  if (object.isMesh) {
    object.castShadow = true;
    object.receiveShadow = true;
  }
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
