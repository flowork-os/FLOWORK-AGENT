<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------------------------------------------------------
   Renderer / Scene / Camera
--------------------------------------------------------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1b20);
scene.fog = new THREE.Fog(0x1a1b20, 3.2, 9.0);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(0.85, 0.62, 1.55);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.target.set(0, 0.32, 0);
controls.minDistance = 0.7;
controls.maxDistance = 5;
controls.maxPolarAngle = Math.PI * 0.52;

/* ---------------------------------------------------------------
   Procedural fabric textures (canvas-generated, no external assets)
--------------------------------------------------------------- */
function makeCanvas(size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  return c;
}

// Fine fuzzy noise -> used as a normal-ish roughness/bump for minky fluff
function fuzzTexture(size = 512, density = 0.55, tint = 235) {
  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  ctx.fillStyle = `rgb(${tint},${tint},${tint})`;
  ctx.fillRect(0, 0, size, size);
  const img = ctx.getImageData(0, 0, size, size);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 70 * density;
    d[i] = Math.max(0, Math.min(255, d[i] + n));
    d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n));
    d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n));
  }
  ctx.putImageData(img, 0, 0);
  // soft blotches for hand-made irregularity
  for (let i = 0; i < 260; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const r = 4 + Math.random() * 22;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const a = 0.05 + Math.random() * 0.07;
    const dark = Math.random() > 0.5;
    g.addColorStop(0, dark ? `rgba(0,0,0,${a})` : `rgba(255,255,255,${a})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// Quilted diamond pattern (bump map): puffed cells separated by stitched valleys
function quiltTexture(size = 512, cells = 6, diag = true) {
  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#8a8a8a';
  ctx.fillRect(0, 0, size, size);
  const step = size / cells;

  // puffy cells: radial highlight in the middle of each cell
  const drawPuff = (cx, cy, r) => {
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.55, 'rgba(210,210,210,0.55)');
    g.addColorStop(1, 'rgba(60,60,60,0.0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  };

  if (diag) {
    ctx.save();
    ctx.translate(size / 2, size / 2);
    ctx.rotate(Math.PI / 4);
    ctx.translate(-size, -size);
    for (let y = -1; y < cells * 3; y++) {
      for (let x = -1; x < cells * 3; x++) {
        drawPuff(x * step + step / 2, y * step + step / 2, step * 0.52);
      }
    }
    // stitched valleys
    ctx.strokeStyle = 'rgba(25,25,25,0.85)';
    ctx.lineWidth = Math.max(1.5, size / 260);
    ctx.setLineDash([size / 90, size / 120]);
    for (let i = -1; i < cells * 3; i++) {
      ctx.beginPath(); ctx.moveTo(i * step, -size); ctx.lineTo(i * step, size * 3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-size, i * step); ctx.lineTo(size * 3, i * step); ctx.stroke();
    }
    ctx.restore();
  } else {
    for (let y = 0; y < cells; y++)
      for (let x = 0; x < cells; x++)
        drawPuff(x * step + step / 2, y * step + step / 2, step * 0.52);
    ctx.strokeStyle = 'rgba(25,25,25,0.85)';
    ctx.lineWidth = Math.max(1.5, size / 260);
    ctx.setLineDash([size / 90, size / 120]);
    for (let i = 0; i <= cells; i++) {
      ctx.beginPath(); ctx.moveTo(i * step, 0); ctx.lineTo(i * step, size); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * step); ctx.lineTo(size, i * step); ctx.stroke();
    }
  }

  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

// Felt: dense short-fiber speckle
function feltTexture(size = 256) {
  const c = makeCanvas(size);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#888';
  ctx.fillRect(0, 0, size, size);
  for (let i = 0; i < 9000; i++) {
    const x = Math.random() * size, y = Math.random() * size;
    const l = 2 + Math.random() * 5, a = Math.random() * Math.PI;
    ctx.strokeStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.16)' : 'rgba(0,0,0,0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l);
    ctx.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

const fuzzMap = fuzzTexture(512, 0.6);
const quiltMap = quiltTexture(512, 5, true);
const quiltMapSmall = quiltTexture(512, 8, true);
const feltMap = feltTexture(256);

/* ---------------------------------------------------------------
   Materials
--------------------------------------------------------------- */
function plushMat(color, opts = {}) {
  const m = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(color),
    roughness: 0.98,
    metalness: 0.0,
    sheen: 1.0,
    sheenRoughness: 0.85,
    sheenColor: new THREE.Color(opts.sheenColor || 0xfff3e8),
    clearcoat: 0.0,
    bumpMap: opts.bump !== undefined ? opts.bump : fuzzMap,
    bumpScale: opts.bumpScale !== undefined ? opts.bumpScale : 0.0035,
    flatShading: false
  });
  if (m.bumpMap) {
    const r = opts.repeat || 4;
    m.bumpMap = m.bumpMap.clone();
    m.bumpMap.needsUpdate = true;
    m.bumpMap.wrapS = m.bumpMap.wrapT = THREE.RepeatWrapping;
    m.bumpMap.repeat.set(r, r);
  }
  return m;
}

const matMinky = plushMat(0xf3f1ec, { bump: quiltMap, bumpScale: 0.012, repeat: 3 });
const matMinkySmall = plushMat(0xf1efe9, { bump: quiltMapSmall, bumpScale: 0.010, repeat: 3 });
const matMinkyPlain = plushMat(0xf5f3ee, { bump: fuzzMap, bumpScale: 0.004, repeat: 6 });

const matHelmet = new THREE.MeshPhysicalMaterial({
  color: 0xfaf8f4, roughness: 0.95, metalness: 0.0,
  sheen: 1.0, sheenRoughness: 0.8, sheenColor: new THREE.Color(0xfff6ea),
  bumpMap: (() => { const t = fuzzMap.clone(); t.needsUpdate = true; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 6); return t; })(),
  bumpScale: 0.003
});

const matVisor = new THREE.MeshPhysicalMaterial({
  color: 0x2c3550, roughness: 0.55, metalness: 0.0,
  sheen: 0.6, sheenColor: new THREE.Color(0x8fb6ff), sheenRoughness: 0.5,
  clearcoat: 0.35, clearcoatRoughness: 0.6
});

const matVisorTrim = new THREE.MeshPhysicalMaterial({
  color: 0xe8a33d, roughness: 0.92, metalness: 0.0, sheen: 0.8,
  sheenColor: new THREE.Color(0xffd9a0), sheenRoughness: 0.8,
  bumpMap: (() => { const t = feltMap.clone(); t.needsUpdate = true; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 2); return t; })(),
  bumpScale: 0.004
});

function feltMat(color, repeat = 3) {
  const t = feltMap.clone(); t.needsUpdate = true;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat);
  return new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(color), roughness: 0.99, metalness: 0.0,
    sheen: 0.55, sheenRoughness: 0.95, sheenColor: new THREE.Color(0xffffff),
    bumpMap: t, bumpScale: 0.0035
  });
}

const matFeltRed   = feltMat(0xc4453f, 4);
const matFeltBlue  = feltMat(0x2f5d9e, 4);
const matFeltNavy  = feltMat(0x2b3350, 4);
const matFeltCream = feltMat(0xefe6d2, 4);
const matFeltGrey  = feltMat(0xb9bcc4, 4);

const matThread = new THREE.MeshStandardMaterial({ color: 0xa9a49a, roughness: 1.0, metalness: 0.0 });
const matThreadDark = new THREE.MeshStandardMaterial({ color: 0x494a52, roughness: 1.0, metalness: 0.0 });
const matEmbroidWhite = new THREE.MeshStandardMaterial({ color: 0xfbf8f2, roughness: 1.0, metalness: 0.0 });

/* ---------------------------------------------------------------
   Helpers
--------------------------------------------------------------- */
function squash(mesh, sx, sy, sz) { mesh.scale.set(sx, sy, sz); return mesh; }

function addShadow(obj) {
  obj.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
}

// A stitch run of small capsule "threads" along a 3D curve
function stitchRun(curve, count, thickness, length, material, jitter = 0.0) {
  const group = new THREE.Group();
  const geo = new THREE.CapsuleGeometry(thickness, length, 3, 6);
  const up = new THREE.Vector3(0, 1, 0);
  const q = new THREE.Quaternion();
  for (let i = 0; i < count; i++) {
    const t = (i + 0.5) / count;
    const p = curve.getPointAt(t);
    const tan = curve.getTangentAt(t).normalize();
    const m = new THREE.Mesh(geo, material);
    q.setFromUnitVectors(up, tan);
    m.quaternion.copy(q);
    m.position.copy(p);
    if (jitter > 0) {
      m.position.x += (Math.random() - 0.5) * jitter;
      m.position.y += (Math.random() - 0.5) * jitter;
      m.position.z += (Math.random() - 0.5) * jitter;
    }
    group.add(m);
  }
  return group;
}

// Seam ring around an ellipsoid-ish body, at a given local plane
function seamCircle(radius, count, thickness, length, material, opts = {}) {
  const pts = [];
  const segs = 128;
  const rx = opts.rx !== undefined ? opts.rx : 1;
  const rz = opts.rz !== undefined ? opts.rz : 1;
  const wobble = opts.wobble || 0;
  for (let i = 0; i <= segs; i++) {
    const a = (i / segs) * Math.PI * 2;
    const w = 1 + Math.sin(a * 3) * wobble;
    pts.push(new THREE.Vector3(Math.cos(a) * radius * rx * w, 0, Math.sin(a) * radius * rz * w));
  }
  const curve = new THREE.CatmullRomCurve3(pts, true);
  return stitchRun(curve, count, thickness, length, material);
}

// Vertical seam arc over a sphere-ish form (from top to bottom on one side)
function seamArc(radius, phiStart, phiEnd, theta, count, thickness, length, material, scaleY = 1, scaleXZ = 1) {
  const pts = [];
  const segs = 64;
  for (let i = 0; i <= segs; i++) {
    const phi = phiStart + (phiEnd - phiStart) * (i / segs);
    const x = Math.sin(phi) * Math.cos(theta) * radius * scaleXZ;
    const z = Math.sin(phi) * Math.sin(theta) * radius * scaleXZ;
    const y = Math.cos(phi) * radius * scaleY;
    pts.push(new THREE.Vector3(x, y, z));
  }
  const curve = new THREE.CatmullRomCurve3(pts, false);
  return stitchRun(curve, count, thickness, length, material);
}

/* ---------------------------------------------------------------
   THE DOLL
   Scale: ~0.62 m tall handmade plush toy. Root centered at origin,
   feet at y = 0.
--------------------------------------------------------------- */
const doll = new THREE.Group();
scene.add(doll);

/* ---------- TORSO: plump, pear-ish stuffed body ---------- */
const torsoGroup = new THREE.Group();
torsoGroup.position.y = 0.245;
doll.add(torsoGroup);

// Body profile via lathe: wide bottom, softly tapering chest, small neck shelf
const torsoProfile = [];
{
  const pts = [
    [0.000, -0.150],
    [0.060, -0.152],
    [0.105, -0.140],
    [0.132, -0.108],
    [0.146, -0.060],
    [0.150, -0.010],
    [0.147, 0.040],
    [0.138, 0.080],
    [0.122, 0.112],
    [0.098, 0.134],
    [0.072, 0.147],
    [0.048, 0.152],
    [0.000, 0.154]
  ];
  for (const p of pts) torsoProfile.push(new THREE.Vector2(p[0], p[1]));
}
const torsoGeo = new THREE.LatheGeometry(torsoProfile, 96);
// Slight front-back flatten + subtle stuffing lumpiness
{
  const pos = torsoGeo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    v.z *= 0.88;
    const lump = 1 + Math.sin(v.y * 34) * 0.008 + Math.sin(Math.atan2(v.z, v.x) * 6 + v.y * 12) * 0.006;
    v.x *= lump; v.z *= lump;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  torsoGeo.computeVertexNormals();
}
const torso = new THREE.Mesh(torsoGeo, matMinky);
torsoGroup.add(torso);

// Torso seams: side seams (left/right) + center-front quilt seam
torsoGroup.add(seamArc(0.152, 0.10, Math.PI - 0.10, 0, 30, 0.0035, 0.012, matThread, 1.0, 1.0));
torsoGroup.add(seamArc(0.152, 0.10, Math.PI - 0.10, Math.PI, 30, 0.0035, 0.012, matThread, 1.0, 1.0));
{
  const sideL = seamArc(0.152, 0.14, Math.PI - 0.14, Math.PI / 2, 28, 0.0035, 0.012, matThread, 1.0, 0.88);
  const sideR = seamArc(0.152, 0.14, Math.PI - 0.14, -Math.PI / 2, 28, 0.0035, 0.012, matThread, 1.0, 0.88);
  torsoGroup.add(sideL, sideR);
}

// Waist / hip seam ring
{
  const ring = seamCircle(0.1445, 46, 0.0033, 0.010, matThread, { rz: 0.88 });
  ring.position.y = -0.048;
  ring.scale.setScalar(1.005);
  torsoGroup.add(ring);
}

/* ---------- CHEST FELT PATCH (mission badge) ---------- */
const patchGroup = new THREE.Group();
patchGroup.position.set(0, 0.045, 0.126);
patchGroup.rotation.x = -0.10;
torsoGroup.add(patchGroup);

// Rounded-square felt backing
function roundedShape(w, h, r) {
  const s = new THREE.Shape();
  s.moveTo(-w / 2 + r, -h / 2);
  s.lineTo(w / 2 - r, -h / 2);
  s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
  s.lineTo(w / 2, h / 2 - r);
  s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
  s.lineTo(-w / 2 + r, h / 2);
  s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
  s.lineTo(-w / 2, -h / 2 + r);
  s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
  return s;
}
{
  const shape = roundedShape(0.086, 0.070, 0.020);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: 0.006, bevelEnabled: true, bevelSize: 0.005, bevelThickness: 0.005,
    bevelSegments: 4, curveSegments: 24
  });
  geo.center();
  const patch = new THREE.Mesh(geo, matFeltNavy);
  patch.position.z = 0.004;
  // curve it to hug the chest
  {
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      v.z -= (v.x * v.x) * 1.5 + (v.y * v.y) * 0.8;
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();
  }
  patchGroup.add(patch);

  // Embroidered outline around the patch
  const outlinePts = [];
  const sp = shape.getPoints(80);
  for (const p of sp) outlinePts.push(new THREE.Vector3(p.x * 0.86, p.y * 0.86, 0.012 - (p.x * p.x) * 1.5 - (p.y * p.y) * 0.8));
  const outlineCurve = new THREE.CatmullRomCurve3(outlinePts, true);
  patchGroup.add(stitchRun(outlineCurve, 40, 0.0022, 0.007, matEmbroidWhite));
}

// Embroidered rocket + star on the patch
{
  const badge = new THREE.Group();
  badge.position.z = 0.011;
  patchGroup.add(badge);

  // little planet ring (felt)
  const planet = new THREE.Mesh(new THREE.SphereGeometry(0.0125, 24, 18), matFeltRed);
  planet.position.set(-0.017, -0.006, 0.0);
  planet.scale.z = 0.5;
  badge.add(planet);

  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.019, 0.0022, 8, 40), matFeltCream);
  ring.position.copy(planet.position);
  ring.rotation.x = Math.PI / 2 - 0.45;
  ring.rotation.z = 0.25;
  ring.scale.z = 0.6;
  badge.add(ring);

  // stars: small embroidered dots
  const starPos = [[0.020, 0.018], [0.030, -0.004], [0.012, -0.017], [-0.024, 0.020]];
  for (const [sx, sy] of starPos) {
    const st = new THREE.Mesh(new THREE.SphereGeometry(0.0026, 10, 8), matEmbroidWhite);
    st.position.set(sx, sy, 0.001);
    st.scale.z = 0.6;
    badge.add(st);
  }

  // small arc of thread like a comet trail
  const trail = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.030, -0.020, 0.0),
    new THREE.Vector3(-0.006, -0.026, 0.0),
    new THREE.Vector3(0.018, -0.024, 0.0),
    new THREE.Vector3(0.032, -0.014, 0.0)
  ]);
  badge.add(stitchRun(trail, 12, 0.0018, 0.006, matEmbroidWhite));
}

/* ---------- Small felt shoulder flags / trim ---------- */
function shoulderFlag(side) {
  const g = new THREE.Group();
  const geo = new THREE.BoxGeometry(0.030, 0.020, 0.008);
  geo.translate(0, 0, 0);
  const m = new THREE.Mesh(geo, side > 0 ? matFeltRed : matFeltBlue);
  g.add(m);
  const m2 = new THREE.Mesh(new THREE.BoxGeometry(0.030, 0.006, 0.0082), matFeltCream);
  m2.position.y = -0.008;
  g.add(m2);
  return g;
}
{
  const fl = shoulderFlag(1);
  fl.position.set(0.104, 0.098, 0.052);
  fl.rotation.set(0.15, 0.55, 0.22);
  torsoGroup.add(fl);
  const fr = shoulderFlag(-1);
  fr.position.set(-0.104, 0.098, 0.052);
  fr.rotation.set(0.15, -0.55, -0.22);
  torsoGroup.add(fr);
}

/* ---------- Felt belt with buckle ---------- */
{
  const beltGeo = new THREE.CylinderGeometry(0.150, 0.152, 0.036, 64, 1, true);
  {
    const pos = beltGeo.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      v.z *= 0.885;
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    beltGeo.computeVertexNormals();
  }
  const belt = new THREE.Mesh(beltGeo, matFeltGrey);
  belt.material.side = THREE.DoubleSide;
  belt.position.y = -0.062;
  torsoGroup.add(belt);

  const buckle = new THREE.Mesh(new THREE.BoxGeometry(0.040, 0.030, 0.010), matFeltCream);
  buckle.position.set(0, -0.062, 0.133);
  torsoGroup.add(buckle);
  const buckleInner = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.014, 0.012), matFeltNavy);
  buckleInner.position.set(0, -0.062, 0.135);
  torsoGroup.add(buckleInner);
}

/* ---------- Backpack / life-support pack (quilted) ---------- */
{
  const packGeo = new THREE.BoxGeometry(0.150, 0.150, 0.075, 12, 12, 8);
  // round the box into a puffy pillow
  {
    const pos = packGeo.attributes.position;
    const v = new THREE.Vector3();
    const hx = 0.075, hy = 0.075, hz = 0.0375, r = 0.030;
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const cx = Math.max(-hx + r, Math.min(hx - r, v.x));
      const cy = Math.max(-hy + r, Math.min(hy - r, v.y));
      const cz = Math.max(-hz + r * 0.5, Math.min(hz - r * 0.5, v.z));
      const d = new THREE.Vector3(v.x - cx, v.y - cy, v.z - cz);
      const len = d.length();
      if (len > 1e-6) {
        d.multiplyScalar(r / len);
        // puff outward a little to look overstuffed
        d.multiplyScalar(1.06);
        v.set(cx + d.x, cy + d.y, cz + d.z * 0.9);
      }
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    packGeo.computeVertexNormals();
  }
  const pack = new THREE.Mesh(packGeo, matMinkySmall);
  pack.position.set(0, 0.020, -0.148);
  pack.rotation.x = 0.06;
  torsoGroup.add(pack);

  // pack seam around the perimeter
  const seamPts = [];
  for (let i = 0; i <= 96; i++) {
    const a = (i / 96) * Math.PI * 2;
    const c = Math.cos(a), s = Math.sin(a);
    const k = 4;
    const px = Math.sign(c) * Math.pow(Math.abs(c), 2 / k) * 0.086;
    const py = Math.sign(s) * Math.pow(Math.abs(s), 2 / k) * 0.086;
    seamPts.push(new THREE.Vector3(px, py, 0.0));
  }
  const seamCurve = new THREE.CatmullRomCurve3(seamPts, true);
  const packSeam = stitchRun(seamCurve, 52, 0.0030, 0.010, matThread);
  packSeam.position.copy(pack.position);
  packSeam.rotation.copy(pack.rotation);
  torsoGroup.add(packSeam);

  // felt straps over shoulders
  function strap(side) {
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(side * 0.055, -0.075, -0.118),
      new THREE.Vector3(side * 0.068, 0.055, -0.132),
      new THREE.Vector3(side * 0.062, 0.128, -0.058),
      new THREE.Vector3(side * 0.055, 0.118, 0.058),
      new THREE.Vector3(side * 0.050, 0.030, 0.115),
      new THREE.Vector3(side * 0.046, -0.045, 0.128)
    ]);
    const geo = new THREE.TubeGeometry(curve, 64, 0.014, 10, false);
    // flatten straps like fabric webbing
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      v.x = v.x * 0.55 + side * 0.055 * 0.45;
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, matFeltGrey);
  }
  torsoGroup.add(strap(1), strap(-1));

  // pack top valve nubs
  for (const sx of [-0.038, 0.038]) {
    const nub = new THREE.Mesh(new THREE.CapsuleGeometry(0.010, 0.014, 6, 16), matFeltNavy);
    nub.position.set(sx, 0.108, -0.150);
    nub.rotation.x = 0.25;
    torsoGroup.add(nub);
  }
}

/* ---------- HELMET (round fabric helmet + stitched visor) ---------- */

const HELM_R = 0.132;
{
  const helmGeo = new THREE.SphereGeometry(HELM_R, 96, 72);
  {
    const pos = helmGeo.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      // slight vertical squash + soft stuffing lumps
      v.y *= 0.965;
      const lump = 1 + Math.sin(v.x * 26) * 0.006 + Math.cos(v.y * 22 + v.z * 9) * 0.006;
      v.multiplyScalar(lump);

/* ---------- Visor: dark stitched panel with felt trim ---------- */
{
  const visorGroup = new THREE.Group();
  headGroup.add(visorGroup);

  // Visor lens: spherical cap slightly proud of the helmet
  const VR = HELM_R * 1.012;
  const lensGeo = new THREE.SphereGeometry(VR, 80, 60, -Math.PI / 2 - 0.72, 1.44, Math.PI * 0.30, Math.PI * 0.36);
  {
    const pos = lensGeo.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      v.y *= 0.965;
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    lensGeo.computeVertexNormals();
  }
  const lens = new THREE.Mesh(lensGeo, matVisor);
  lens.rotation.y = Math.PI / 2; // face +Z
  lens.position.y = 0.006;
  visorGroup.add(lens);

  // Felt trim ring around the visor opening (a soft "sewn-on" bezel)
  const trimPts = [];
  const segs = 140;
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const a = t * Math.PI * 2;
    // ellipse in local XY, projected onto the sphere front
    const ex = Math.cos(a) * 0.093;
    const ey = Math.sin(a) * 0.062 + 0.006;
    const r2 = Math.max(0, VR * VR - ex * ex - ey * ey);
    const ez = Math.sqrt(r2);
    trimPts.push(new THREE.Vector3(ex, ey, ez * 1.0));
  }
  const trimCurve = new THREE.CatmullRomCurve3(trimPts, true);
  const trimGeo = new THREE.TubeGeometry(trimCurve, 220, 0.0085, 12, true);
  const trim = new THREE.Mesh(trimGeo, matVisorTrim);
  visorGroup.add(trim);

  // Stitching just outside the trim (visible hand stitches)
  const stitchPts = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const a = t * Math.PI * 2;
    const ex = Math.cos(a) * 0.106;
    const ey = Math.sin(a) * 0.074 + 0.006;
    const r2 = Math.max(0, (VR * 1.005) * (VR * 1.005) - ex * ex - ey * ey);
    const ez = Math.sqrt(r2);
    stitchPts.push(new THREE.Vector3(ex, ey, ez));
  }
  const stitchCurve = new THREE.CatmullRomCurve3(stitchPts, true);
  visorGroup.add(stitchRun(stitchCurve, 54, 0.0028, 0.0095, matThread));

  // Faint reflection streaks on visor (felt-ish light strips)
  const matGlint = new THREE.MeshStandardMaterial({
    color: 0x9fc0ee, roughness: 0.7, metalness: 0.0,
    transparent: true, opacity: 0.30
  });
  for (const [ox, oy, rot, len] of [[-0.040, 0.020, -0.55, 0.048], [-0.020, 0.006, -0.55, 0.030]]) {
    const g = new THREE.Mesh(new THREE.CapsuleGeometry(0.0042, len, 4, 12), matGlint);
    const r2 = Math.max(0, (VR * 1.02) * (VR * 1.02) - ox * ox - oy * oy);
    g.position.set(ox, oy, Math.sqrt(r2));
    g.rotation.z = rot;
    g.rotation.x = 0.25;
    visorGroup.add(g);
  }

  // Embroidered smile + cheek blush *inside* the visor (cozy toy face)
  const faceZ = VR * 0.965;
  const matSmile = new THREE.MeshStandardMaterial({ color: 0x7d8ab4, roughness: 1.0 });
  const smilePts = [];
  for (let i = 0; i <= 24; i++) {
    const t = i / 24;
    const x = (t - 0.5) * 0.048;
    const y = -0.026 - Math.cos((t - 0.5) * Math.PI) * 0.011;
    const r2 = Math.max(0, faceZ * faceZ - x * x - y * y);
    smilePts.push(new THREE.Vector3(x, y, Math.sqrt(r2) * 0.995));
  }
  visorGroup.add(stitchRun(new THREE.CatmullRomCurve3(smilePts, false), 10, 0.0020, 0.006, matSmile));

  for (const sx of [-0.030, 0.030]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.0075, 20, 16), matSmile);
    const r2 = Math.max(0, faceZ * faceZ - sx * sx - 0.004 * 0.004);
    eye.position.set(sx, 0.004, Math.sqrt(r2) * 0.99);
    eye.scale.z = 0.45;
    visorGroup.add(eye);
  }
}

/* ---------- LIMB BUILDER: puffy padded segments ---------- */
// Builds a soft tapered tube along a curve with slight "stuffing" bulges.
function puffyLimb(points, radii, material, segs = 48, radialSegs = 28) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const geo = new THREE.TubeGeometry(curve, segs, 1, radialSegs, false);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  const center = new THREE.Vector3();
  const nCount = segs + 1;
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    curve.getPointAt(t, center);
    // radius interpolation across the provided profile
    const ft = t * (radii.length - 1);
    const i0 = Math.floor(ft), i1 = Math.min(radii.length - 1, i0 + 1);
    const f = ft - i0;
    let r = radii[i0] * (1 - f) + radii[i1] * f;
    // subtle stuffing wobble
    r *= 1 + Math.sin(t * Math.PI * 5) * 0.018;
    for (let j = 0; j <= radialSegs; j++) {
      const idx = i * (radialSegs + 1) + j;
      v.fromBufferAttribute(pos, idx);
      v.sub(center).normalize().multiplyScalar(r).add(center);
      pos.setXYZ(idx, v.x, v.y, v.z);
    }
  }
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, material);

  // rounded caps
  const capGroup = new THREE.Group();
  capGroup.add(mesh);
  const p0 = curve.getPointAt(0), p1 = curve.getPointAt(1);
  const c0 = new THREE.Mesh(new THREE.SphereGeometry(radii[0], 28, 20), material);
  c0.position.copy(p0);
  const c1 = new THREE.Mesh(new THREE.SphereGeometry(radii[radii.length - 1], 28, 20), material);
  c1.position.copy(p1);
  capGroup.add(c0, c1);
  capGroup.userData.curve = curve;
  return capGroup;
}

// Seam running along the outside of a limb
function limbSeam(curve, count, material, offsetDir = new THREE.Vector3(1, 0, 0), radiusFn) {
  const pts = [];
  const segs = 40;
  const tmp = new THREE.Vector3();
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    curve.getPointAt(t, tmp);
    const tan = curve.getTangentAt(t).normalize();
    const off = offsetDir.clone().sub(tan.clone().multiplyScalar(offsetDir.dot(tan)));
    if (off.lengthSq() < 1e-8) off.set(0, 0, 1);
    off.normalize().multiplyScalar(radiusFn(t));
    pts.push(tmp.clone().add(off));
  }
  return stitchRun(new THREE.CatmullRomCurve3(pts, false), count, 0.0028, 0.010, material);
}

/* ---------- ARMS: posed slightly outward ---------- */
function buildArm(side) {
  const g = new THREE.Group();

  const shoulderX = side * 0.128;
  const pts = [
    [shoulderX, 0.348, 0.006],
    [shoulderX + side * 0.048, 0.300, 0.012],
    [shoulderX + side * 0.078, 0.244, 0.022],
    [shoulderX + side * 0.094, 0.190, 0.036],
    [shoulderX + side * 0.098, 0.150, 0.050]
  ];
  const radii = [0.049, 0.046, 0.042, 0.040, 0.039];
  const arm = puffyLimb(pts, radii, matMinkyPlain, 40, 26);
  g.add(arm);

  const curve = arm.userData.curve;
  const rf = t => {
    const ft = t * (radii.length - 1);
    const i0 = Math.floor(ft), i1 = Math.min(radii.length - 1, i0 + 1);
    return (radii[i0] * (1 - (ft - i0)) + radii[i1] * (ft - i0)) * 1.005;
  };
  g.add(limbSeam(curve, 24, matThread, new THREE.Vector3(side, 0, 0.25), rf));
  g.add(limbSeam(curve, 24, matThread, new THREE.Vector3(-side * 0.3, 0, -1), rf));

  // felt cuff before the mitten
  {
    const p = curve.getPointAt(0.86);
    const tan = curve.getTangentAt(0.86).normalize();
    const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.0435, 0.0425, 0.026, 36), matFeltBlue);
    cuff.position.copy(p);
    cuff.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tan);
    g.add(cuff);
    const cuffRing = new THREE.Mesh(new THREE.TorusGeometry(0.0435, 0.005, 10, 36), matFeltCream);
    cuffRing.position.copy(p);
    cuffRing.quaternion.copy(cuff.quaternion);
    cuffRing.rotateX(Math.PI / 2);
    cuffRing.position.add(tan.clone().multiplyScalar(-0.013));
    g.add(cuffRing);
  }

  /* ---- MITTEN HAND: pudgy, thumb nub, stitched edge ---- */
  {
    const end = curve.getPointAt(1);
    const tan = curve.getTangentAt(1).normalize();
    const hand = new THREE.Group();
    hand.position.copy(end);
    hand.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tan);

    const mittGeo = new THREE.SphereGeometry(0.050, 40, 30);
    {
      const pos = mittGeo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        // elongate along +Y (down the arm direction), flatten a touch
        v.y *= 1.20;
        v.z *= 0.80;
        v.x *= 0.96;
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      mittGeo.computeVertexNormals();
    }
    const mitt = new THREE.Mesh(mittGeo, matMinkyPlain);
    mitt.position.y = 0.030;
    hand.add(mitt);

    // thumb nub
    const thumb = new THREE.Mesh(new THREE.SphereGeometry(0.020, 24, 18), matMinkyPlain);
    thumb.scale.set(1.0, 1.45, 0.85);
    thumb.position.set(-side * 0.040, 0.020, 0.010);
    thumb.rotation.z = side * 0.75;
    hand.add(thumb);

    // mitten seam around the silhouette
    const seamPts = [];
    for (let i = 0; i <= 80; i++) {
      const a = (i / 80) * Math.PI * 2;
      seamPts.push(new THREE.Vector3(Math.cos(a) * 0.0485, 0.030 + Math.sin(a) * 0.058, 0));
    }
    const seam = stitchRun(new THREE.CatmullRomCurve3(seamPts, true), 34, 0.0026, 0.009, matThread);
    hand.add(seam);

    g.add(hand);
  }

  return g;
}
doll.add(buildArm(1), buildArm(-1));

/* ---------- LEGS + BOOTS: pudgy, posed slightly outward ---------- */
function buildLeg(side) {
  const g = new THREE.Group();

  const hipX = side * 0.070;
  const pts = [
    [hipX, 0.130, 0.004],
    [hipX + side * 0.016, 0.100, 0.006],
    [hipX + side * 0.032, 0.062, 0.008],
    [hipX + side * 0.042, 0.036, 0.010]
  ];
  const radii = [0.055, 0.053, 0.050, 0.048];
  const leg = puffyLimb(pts, radii, matMinkyPlain, 32, 26);
  g.add(leg);

  const curve = leg.userData.curve;
  const rf = t => {
    const ft = t * (radii.length - 1);
    const i0 = Math.floor(ft), i1 = Math.min(radii.length - 1, i0 + 1);
    return (radii[i0] * (1 - (ft - i0)) + radii[i1] * (ft - i0)) * 1.005;
  };
  g.add(limbSeam(curve, 16, matThread, new THREE.Vector3(side, 0, 0.2), rf));
  g.add(limbSeam(curve, 16, matThread, new THREE.Vector3(-side * 0.2, 0, -1), rf));

  // felt boot cuff
  {
    const p = curve.getPointAt(0.94);
    const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.052, 0.024, 40), matFeltBlue);
    cuff.position.copy(p);
    cuff.rotation.z = -side * 0.30;
    g.add(cuff);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.052, 0.0055, 10, 40), matFeltCream);
    ring.rotation.x = Math.PI / 2;
    ring.position.copy(p);
    ring.position.y += 0.011;
    g.add(ring);
  }

  /* ---- BOOT: mitten-like pudgy foot ---- */
  {
    const bootGroup = new THREE.Group();
    bootGroup.position.set(hipX + side * 0.048, 0.036, 0.006);
    bootGroup.rotation.y = side * 0.16;
    bootGroup.rotation.z = -side * 0.05;
    g.add(bootGroup);

    // boot body: rounded box stretched forward
    const bGeo = new THREE.SphereGeometry(0.050, 40, 30);
    {
      const pos = bGeo.attributes.position;
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i);
        v.x *= 0.94;
        v.y *= 0.70;
        // stretch toward the toe (+Z) only
        const fwd = Math.max(0, v.z) / 0.050;
        v.z *= 1.05;
        v.z += fwd * 0.038;
        // flatten the sole
        if (v.y < -0.020) v.y = -0.020 + (v.y + 0.020) * 0.35;
        pos.setXYZ(i, v.x, v.y, v.z);
      }
      bGeo.computeVertexNormals();
    }
    const boot = new THREE.Mesh(bGeo, matMinky);
    boot.position.y = -0.001;
    bootGroup.add(boot);

    // felt sole
    {
      const shape = roundedShape(0.088, 0.140, 0.036);
      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: 0.012, bevelEnabled: true, bevelSize: 0.006, bevelThickness: 0.005,
        bevelSegments: 3, curveSegments: 20
      });
      geo.center();
      geo.rotateX(-Math.PI / 2);
      const sole = new THREE.Mesh(geo, matFeltNavy);
      sole.position.set(0, -0.033, 0.020);
      bootGroup.add(sole);

      // stitched sole edge
      const sp = shape.getPoints(70);
      const spts = sp.map(p => new THREE.Vector3(p.x * 0.94, 0.008, p.y * 0.94));
      const seam = stitchRun(new THREE.CatmullRomCurve3(spts, true), 34, 0.0026, 0.009, matThread);
      seam.position.set(0, -0.031, 0.020);
      bootGroup.add(seam);
    }

    // toe seam over the top of the boot
    {
      const tp = [];
      for (let i = 0; i <= 20; i++) {
        const t = i / 20;
        const z = -0.030 + t * 0.100;
        const y = 0.031 - Math.pow(Math.max(0, (z + 0.005)) / 0.075, 2) * 0.040;
        tp.push(new THREE.Vector3(0, y, z));
      }
      bootGroup.add(stitchRun(new THREE.CatmullRomCurve3(tp, false), 12, 0.0026, 0.009, matThread));
    }
  }

  return g;
}
doll.add(buildLeg(1), buildLeg(-1));
