<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm Tractor</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe0e8; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe0e8);
scene.fog = new THREE.Fog(0xcfe0e8, 25, 60);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.5, 4.5, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.HemisphereLight(0xdfeaf5, 0x8a7a5a, 0.85));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(8, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
sun.shadow.bias = -0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd4ee, 0.5);
fill.position.set(-6, 4, -8);
scene.add(fill);

// Ground with soft shadow
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 64),
  new THREE.MeshStandardMaterial({ color: 0x9fb37a, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Materials
const red    = new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.45, metalness: 0.25 });
const redDk  = new THREE.MeshStandardMaterial({ color: 0x992d22, roughness: 0.5, metalness: 0.2 });
const rubber = new THREE.MeshStandardMaterial({ color: 0x1f2124, roughness: 0.95 });
const hub    = new THREE.MeshStandardMaterial({ color: 0xe8c33a, roughness: 0.4, metalness: 0.4 });
const steel  = new THREE.MeshStandardMaterial({ color: 0x8f979e, roughness: 0.35, metalness: 0.85 });
const dark   = new THREE.MeshStandardMaterial({ color: 0x2c2f33, roughness: 0.6, metalness: 0.3 });
const seatMat= new THREE.MeshStandardMaterial({ color: 0x35383d, roughness: 0.8 });

const tractor = new THREE.Group();
scene.add(tractor);
const add = (geo, mat, x, y, z, parent = tractor) => {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
};

// ---- Engine body / hood (long nose along +X) ----
add(new THREE.BoxGeometry(3.0, 1.1, 1.2), red, 0.6, 1.55, 0);               // main hood
const hoodTop = add(new THREE.BoxGeometry(2.6, 0.25, 1.0), redDk, 0.6, 2.15, 0);
hoodTop.geometry.translate(0, 0, 0);
add(new THREE.BoxGeometry(0.15, 1.25, 1.25), dark, 2.12, 1.6, 0);            // grille
add(new THREE.BoxGeometry(1.4, 1.5, 1.5), red, -1.35, 1.65, 0);              // cowl / rear body
add(new THREE.BoxGeometry(1.9, 0.5, 1.6), redDk, -1.6, 0.85, 0);             // transmission housing

// ---- Front ballast weight ----
add(new THREE.BoxGeometry(0.5, 0.8, 1.1), dark, 2.5, 0.95, 0);
for (let i = 0; i < 3; i++)
  add(new THREE.BoxGeometry(0.14, 0.65, 1.0), steel, 2.85 + i * 0.17, 0.95, 0);

// ---- Exhaust stack ----
add(new THREE.CylinderGeometry(0.08, 0.08, 1.5, 12), steel, 1.4, 3.0, 0.3);
add(new THREE.CylinderGeometry(0.13, 0.1, 0.35, 12), dark, 1.4, 3.75, 0.3);
// Air intake
add(new THREE.CylinderGeometry(0.07, 0.07, 1.0, 12), dark, 1.0, 2.7, -0.3);
add(new THREE.SphereGeometry(0.14, 12, 10), dark, 1.0, 3.2, -0.3);

// ---- Dashboard + steering wheel ----
add(new THREE.BoxGeometry(0.3, 0.6, 1.0), redDk, -0.85, 2.5, 0);
const column = add(new THREE.CylinderGeometry(0.05, 0.05, 0.9, 10), dark, -1.25, 2.65, 0);
column.rotation.z = 0.9;
const wheel = add(new THREE.TorusGeometry(0.34, 0.05, 10, 28), dark, -1.55, 2.9, 0);
wheel.rotation.y = Math.PI / 2; wheel.rotation.x = 0; wheel.rotation.z = 0;
wheel.rotation.set(0, Math.PI / 2, 0); wheel.rotateX(0.9 - Math.PI / 2);
for (let i = 0; i < 3; i++) {
  const sp = add(new THREE.CylinderGeometry(0.025, 0.025, 0.62, 8), dark, 0, 0, 0, wheel);
  sp.rotation.z = i * Math.PI / 3;
}

// ---- Seat (raised, exposed) ----
add(new THREE.BoxGeometry(0.25, 0.5, 0.25), steel, -2.35, 1.35, 0);          // post
add(new THREE.BoxGeometry(0.75, 0.14, 0.8), seatMat, -2.35, 1.68, 0);        // pan
const back = add(new THREE.BoxGeometry(0.14, 0.7, 0.8), seatMat, -2.7, 2.05, 0);
back.rotation.z = -0.15;
// Platform / floor
add(new THREE.BoxGeometry(1.6, 0.12, 1.7), dark, -1.9, 1.02, 0);

// ---- Wheels ----
function tire(radius, width, treads) {
  const g = new THREE.Group();
  const t = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, width, 28), rubber);
  t.rotation.x = Math.PI / 2;
  t.castShadow = t.receiveShadow = true;
  g.add(t);
  for (let i = 0; i < treads; i++) {
    const lug = new THREE.Mesh(new THREE.BoxGeometry(radius * 0.22, width * 1.04, radius * 0.13), rubber);
    const a = (i / treads) * Math.PI * 2;
    lug.position.set(Math.cos(a) * radius * 0.96, 0, Math.sin(a) * radius * 0.96);
    lug.rotation.y = -a;
    lug.rotation.x = Math.PI / 2;
    lug.castShadow = true;
    g.add(lug);
  }
  const h = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.45, radius * 0.45, width * 1.1, 20), hub);
  h.rotation.x = Math.PI / 2;
  h.castShadow = true;
  g.add(h);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.12, radius * 0.12, width * 1.3, 12), steel);
  cap.rotation.x = Math.PI / 2;
  g.add(cap);
  return g;
}

const R = 1.35, r = 0.7;
[[-1.9, 1.15], [-1.9, -1.15]].forEach(([x, z]) => {
  const w = tire(R, 0.62, 14); w.position.set(x, R, z); tractor.add(w);
});
[[1.7, 0.85], [1.7, -0.85]].forEach(([x, z]) => {
  const w = tire(r, 0.4, 10); w.position.set(x, r, z); tractor.add(w);
});
// Front axle
add(new THREE.CylinderGeometry(0.09, 0.09, 1.9, 10), steel, 1.7, r, 0).rotation.x = Math.PI / 2;

// ---- Curved rear fenders ----
function fender(z) {
  const shape = new THREE.Shape();
  const Ro = R + 0.28, Ri = R + 0.1;
  shape.absarc(0, 0, Ro, Math.PI * 1.05, -0.15, true);
  shape.absarc(0, 0, Ri, -0.15, Math.PI * 1.05, false);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.7, bevelEnabled: false });
  geo.translate(0, 0, -0.35);
  const f = new THREE.Mesh(geo, red);
  f.position.set(-1.9, R, z);
  f.castShadow = f.receiveShadow = true;
  tractor.add(f);
}
fender(1.15);
fender(-1.15);

// Center & drop tractor to sit on ground
tractor.position.x = 0.1;

// ---- Controls ----
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.4, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 4;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI / 2.05;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
