<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Solitaire Ring</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#eeeae5}
canvas{display:block;width:100%;height:100%}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeeeae5);
scene.fog = new THREE.Fog(0xeeeae5, 8, 18);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.25, 4.0, 3.55);
camera.lookAt(0, 0, 1.25);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 3.5;
controls.maxDistance = 8;
controls.target.set(0, 0, 1.25);

scene.add(new THREE.HemisphereLight(0xfff8ed, 0x625b59, 1.5));

function area(color, intensity, position, size) {
  const light = new THREE.RectAreaLight(color, intensity, size, size);
  light.position.copy(position);
  light.lookAt(0, 0, 1.2);
  scene.add(light);
  return light;
}
area(0xfff2d8, 10, [-4, 4, 6], 4);
area(0xd9e8ff, 8, [4, 1, 4], 3);
area(0xffffff, 7, [0, -4, 2.5], 3);

const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(-3, -4, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0004;
scene.add(key);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({color:0xd9d3cc, roughness:0.84, metalness:0})
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

const gold = new THREE.MeshPhysicalMaterial({
  color:0xd6a84c,
  metalness:1,
  roughness:0.12,
  clearcoat:1,
  clearcoatRoughness:0.07,
  envMapIntensity:2.2
});

const goldDark = new THREE.MeshPhysicalMaterial({
  color:0x9d6b25,
  metalness:1,
  roughness:0.18,
  clearcoat:0.8,
  envMapIntensity:1.8
});

const ring = new THREE.Group();
ring.rotation.x = -0.04;
scene.add(ring);

const band = new THREE.Mesh(new THREE.TorusGeometry(1.72, 0.17, 32, 128), gold);
band.position.z = 0.34;
band.castShadow = true;
band.receiveShadow = true;
ring.add(band);

const shoulderL = new THREE.Mesh(new THREE.TorusGeometry(1.18, 0.13, 24, 72, Math.PI * 0.55), gold);
shoulderL.rotation.z = Math.PI * 0.225;
shoulderL.position.set(-0.13, 0, 0.53);
shoulderL.scale.set(1.0, 0.82, 1);
shoulderL.castShadow = true;
ring.add(shoulderL);

const shoulderR = shoulderL.clone();
shoulderR.rotation.z = -Math.PI * 0.225;
shoulderR.position.x = 0.13;
ring.add(shoulderR);

const basket = new THREE.Mesh(new THREE.TorusGeometry(0.72, 0.095, 24, 96), goldDark);
basket.position.z = 0.9;
basket.scale.y = 0.9;
basket.castShadow = true;
ring.add(basket);

const rail = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.07, 20, 80), gold);
rail.rotation.x = Math.PI / 2;
rail.position.z = 0.72;
rail.scale.set(1.28, 0.76, 1);
rail.castShadow = true;
ring.add(rail);

const diamondMaterial = new THREE.MeshPhysicalMaterial({
  color:0xeaf7ff,
  roughness:0.015,
  metalness:0,
  transmission:1,
  thickness:0.9,
  ior:2.42,
  attenuationColor:0xbde7ff,
  attenuationDistance:2.5,
  clearcoat:1,
  clearcoatRoughness:0.01,
  iridescence:0.28,
  iridescenceIOR:2.4,
  dispersion:0.32,
  side:THREE.DoubleSide
});

function createDiamond() {
  const n = 12;
  const verts = [];
  const rings = [];
  const levels = [
    {r:0.79, z:0.56},
    {r:0.84, z:0.68},
    {r:0.47, z:1.03}
  ];

  verts.push(0,0,0);
  for (const level of levels) {
    const ids = [];
    for (let i=0;i<n;i++) {
      const a = i / n * Math.PI * 2;
      ids.push(verts.length / 3);
      verts.push(Math.cos(a)*level.r, Math.sin(a)*level.r, level.z);
    }
    rings.push(ids);
  }
  const tableCenter = verts.length / 3;
  verts.push(0,0,1.03);

  const indices = [];
  for (let i=0;i<n;i++) {
    const j=(i+1)%n;
    indices.push(0, rings[0][j], rings[0][i]);
    indices.push(rings[0][i], rings[0][j], rings[1][j]);
    indices.push(rings[0][i], rings[1][j], rings[1][i]);
    indices.push(rings[1][i], rings[1][j], rings[2][j]);
    indices.push(rings[1][i], rings[2][j], rings[2][i]);
    indices.push(rings[2][i], rings[2][j], tableCenter);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(verts,3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const mesh = new THREE.Mesh(geometry, diamondMaterial);
  mesh.position.set(0,0,1.02);
  mesh.scale.set(1,1,1.55);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
ring.add(createDiamond());

const prongGeometry = new THREE.CylinderGeometry(0.055, 0.075, 0.64, 20);
const tipGeometry = new THREE.SphereGeometry(0.085, 20, 12);
const prongPositions = [
  [-0.61,-0.52], [0.61,-0.52],
  [-0.61,0.52], [0.61,0.52]
];

for (const [x,y] of prongPositions) {
  const prong = new THREE.Mesh(prongGeometry, gold);
  prong.position.set(x, y, 1.19);
  prong.castShadow = true;
  ring.add(prong);

  const tip = new THREE.Mesh(tipGeometry, gold);
  tip.position.set(x, y, 1.52);
  tip.scale.set(0.82,0.82,1.25);
  tip.castShadow = true;
  ring.add(tip);
}

const accent = new THREE.PointLight(0x9edcff, 7, 5, 2);
accent.position.set(-1.5, -2.2, 3.8);
scene.add(accent);

const warm = new THREE.PointLight(0xffc46e, 5, 4, 2);
warm.position.set(2.3, 1.4, 2.4);
scene.add(warm);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
