<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Low-Poly Soccer Ball — Truncated Icosahedron</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0e10; }
  #app { position: fixed; inset: 0; }
  #hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
    color: rgba(220,224,230,0.45); pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hint">drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ *
 *  Renderer
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

/* ------------------------------------------------------------------ *
 *  Scene + neutral dark studio background (soft vertical gradient)
 * ------------------------------------------------------------------ */
const scene = new THREE.Scene();

function makeStudioBackground() {
  const c = document.createElement('canvas');
  c.width = 16; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0.0, '#2a2b30');
  g.addColorStop(0.45, '#1a1b1e');
  g.addColorStop(1.0, '#0c0c0e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 16, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
scene.background = makeStudioBackground();

/* ------------------------------------------------------------------ *
 *  Camera
 * ------------------------------------------------------------------ */
const camera = new THREE.PerspectiveCamera(
  38, window.innerWidth / window.innerHeight, 0.1, 100
);
camera.position.set(2.6, 1.7, 3.4);

/* ------------------------------------------------------------------ *
 *  Lighting — hemisphere ambient + key / fill / rim, soft shadows
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0x9fb0c4, 0x0a0a0c, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 3.0);
key.position.set(4.5, 7.0, 5.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 30;
key.shadow.camera.left = -3;
key.shadow.camera.right = 3;
key.shadow.camera.top = 3;
key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbfd0e6, 0.7);
fill.position.set(-5.5, 1.5, 3.0);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xf3f0ff, 1.6);
rim.position.set(-4.0, 3.5, -6.0);
scene.add(rim);

/* ------------------------------------------------------------------ *
 *  Ground plane — receives shadows only
 * ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.38 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.05;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ *
 *  Procedural truncated icosahedron (the soccer ball)
 *
 *  Truncating a regular icosahedron at exactly 1/3 of each edge yields
 *  the Archimedean truncated icosahedron: 12 regular pentagons (black)
 *  + 20 regular hexagons (white), all vertices on a common sphere.
 * ------------------------------------------------------------------ */
const PHI = (1 + Math.sqrt(5)) / 2;

const icoVerts = [
  [-1,  PHI,  0], [ 1,  PHI,  0], [-1, -PHI,  0], [ 1, -PHI,  0],
  [ 0, -1,  PHI], [ 0,  1,  PHI], [ 0, -1, -PHI], [ 0,  1, -PHI],
  [ PHI, 0, -1], [ PHI, 0,  1], [-PHI, 0, -1], [-PHI, 0,  1]
].map(v => new THREE.Vector3(v[0], v[1], v[2]));

const icoFaces = [
  [0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],
  [1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],
  [3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],
  [4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]
];

// Truncation point one-third of the way from vertex a toward vertex b.
function truncPoint(a, b) {
  return icoVerts[a].clone().lerp(icoVerts[b], 1 / 3);
}

// Six-point hexagon lying in the plane of an icosahedron face (a,b,c).
function hexagonForFace([a, b, c]) {
  return [
    truncPoint(a, b), truncPoint(b, a),
    truncPoint(b, c), truncPoint(c, b),
    truncPoint(c, a), truncPoint(a, c)
  ];
}

// Five-point pentagon around an icosahedron vertex v (neighbours ordered).
function pentagonForVertex(v) {
  const neighbours = new Set();
  for (const f of icoFaces) {
    if (f.includes(v)) f.forEach(w => { if (w !== v) neighbours.add(w); });
  }
  const list = [...neighbours];

  // Build a tangent basis at v to sort neighbours cyclically.
  const center = icoVerts[v].clone().normalize();
  let ref = new THREE.Vector3(0, 1, 0);
  if (Math.abs(center.dot(ref)) > 0.9) ref.set(1, 0, 0);
  const uAxis = ref.clone().sub(center.clone().multiplyScalar(center.dot(ref))).normalize();
  const vAxis = center.clone().cross(uAxis).normalize();

  list.sort((na, nb) => {
    const da = icoVerts[na].clone().sub(icoVerts[v]);
    const db = icoVerts[nb].clone().sub(icoVerts[v]);
    const angA = Math.atan2(da.dot(vAxis), da.dot(uAxis));
    const angB = Math.atan2(db.dot(vAxis), db.dot(uAxis));
    return angA - angB;
  });

  return list.map(n => truncPoint(v, n));
}

// Fan-triangulate a planar polygon from its centroid, oriented outward,
// appending flat-shaded triangles to the positions array.
function addPolygon(points, positions) {
  const n = points.length;
  const centroid = new THREE.Vector3();
  points.forEach(p => centroid.add(p));
  centroid.multiplyScalar(1 / n);

  // Determine winding via the polygon's area-vector vs. outward direction.
  const areaVec = new THREE.Vector3();
  for (let i = 0; i < n; i++) {
    areaVec.add(points[i].clone().cross(points[(i + 1) % n]));
  }
  const flip = areaVec.dot(centroid) < 0;

  for (let i = 0; i < n; i++) {
    let i0 = i, i1 = (i + 1) % n;
    if (flip) { const t = i0; i0 = i1; i1 = t; }
    positions.push(centroid.x, centroid.y, centroid.z);
    positions.push(points[i0].x, points[i0].y, points[i0].z);
    positions.push(points[i1].x, points[i1].y, points[i1].z);
  }
}

// Assemble geometry: hexagons first (material 0), pentagons next (material 1).
const positions = [];

for (const f of icoFaces) addPolygon(hexagonForFace(f), positions);
const hexVertexCount = positions.length / 3;

for (let v = 0; v < 12; v++) addPolygon(pentagonForVertex(v), positions);
const totalVertexCount = positions.length / 3;

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
geometry.computeVertexNormals();
geometry.computeBoundingSphere();

// Normalise so the ball's circumradius is exactly 1.0.
const scaleFactor = 1.0 / geometry.boundingSphere.radius;
geometry.scale(scaleFactor, scaleFactor, scaleFactor);
geometry.computeBoundingSphere();

// Two material groups: white hexagons, black pentagons.
geometry.clearGroups();
geometry.addGroup(0, hexVertexCount, 0);
geometry.addGroup(hexVertexCount, totalVertexCount - hexVertexCount, 1);

const whiteMat = new THREE.MeshStandardMaterial({
  color: 0xecedee, roughness: 0.92, metalness: 0.0, flatShading: true
});
const blackMat = new THREE.MeshStandardMaterial({
  color: 0x101013, roughness: 0.85, metalness: 0.0, flatShading: true
});

const ball = new THREE.Mesh(geometry, [whiteMat, blackMat]);
ball.castShadow = true;
ball.receiveShadow = true;
scene.add(ball);

// Hard-edge seams: only panel boundaries (coplanar fan edges are excluded).
const seamGeo = new THREE.EdgesGeometry(geometry, 1);
const seams = new THREE.LineSegments(
  seamGeo,
  new THREE.LineBasicMaterial({ color: 0x050506 })
);
seams.scale.setScalar(1.004); // lift slightly off the surface to avoid z-fighting
ball.add(seams);

/* ------------------------------------------------------------------ *
 *  Orbit controls — damped, slow auto-rotate
 * ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.minDistance = 2.0;
controls.maxDistance = 9.0;
controls.target.set(0, 0, 0);
controls.update();

/* ------------------------------------------------------------------ *
 *  Resize + render loop
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
