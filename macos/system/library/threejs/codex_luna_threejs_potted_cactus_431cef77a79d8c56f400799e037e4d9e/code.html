<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiny Potted Cactus</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d9d1c5;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8d0c3);
scene.fog = new THREE.Fog(0xd8d0c3, 7, 14);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.1, 3.1, 5.1);
camera.lookAt(0, 1.25, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.15;
controls.minDistance = 3.3;
controls.maxDistance = 8;
controls.target.set(0, 1.3, 0);

scene.add(new THREE.HemisphereLight(0xfff8ed, 0x766e66, 2.1));

const keyLight = new THREE.DirectionalLight(0xffe3bd, 3.7);
keyLight.position.set(-3.5, 6.5, 4.3);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -4;
keyLight.shadow.camera.right = 4;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xb8d4ff, 1.25, 8);
fillLight.position.set(3, 2.8, -3.5);
scene.add(fillLight);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xc7bcae,
  roughness: 0.86,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.015;
floor.receiveShadow = true;
scene.add(floor);

const pot = new THREE.Group();
pot.name = "Terracotta Pot";
scene.add(pot);

const potMaterial = new THREE.MeshStandardMaterial({
  color: 0xb65f3f,
  roughness: 0.78,
  metalness: 0
});
const potDarkMaterial = new THREE.MeshStandardMaterial({
  color: 0x91452f,
  roughness: 0.9
});

const potProfile = [
  new THREE.Vector2(0.38, 0.06),
  new THREE.Vector2(0.50, 0.10),
  new THREE.Vector2(0.58, 0.23),
  new THREE.Vector2(0.63, 0.82),
  new THREE.Vector2(0.65, 0.91),
  new THREE.Vector2(0.70, 0.96),
  new THREE.Vector2(0.70, 1.03),
  new THREE.Vector2(0.60, 1.08)
];
const potBody = new THREE.Mesh(new THREE.LatheGeometry(potProfile, 64), potMaterial);
potBody.castShadow = true;
potBody.receiveShadow = true;
pot.add(potBody);

const rim = new THREE.Mesh(
  new THREE.TorusGeometry(0.65, 0.065, 14, 64),
  potMaterial
);
rim.rotation.x = Math.PI / 2;
rim.position.y = 1.035;
rim.castShadow = true;
rim.receiveShadow = true;
pot.add(rim);

const innerRim = new THREE.Mesh(
  new THREE.TorusGeometry(0.585, 0.025, 10, 64),
  potDarkMaterial
);
innerRim.rotation.x = Math.PI / 2;
innerRim.position.y = 1.025;
innerRim.castShadow = true;
pot.add(innerRim);

const soilMaterial = new THREE.MeshStandardMaterial({
  color: 0x493024,
  roughness: 1
});
const soil = new THREE.Mesh(
  new THREE.CylinderGeometry(0.59, 0.59, 0.12, 64),
  soilMaterial
);
soil.position.y = 1.005;
soil.receiveShadow = true;
pot.add(soil);

const pebbleMaterial = new THREE.MeshStandardMaterial({
  color: 0x80614a,
  roughness: 0.95
});
for (let i = 0; i < 28; i++) {
  const a = i * 2.39996;
  const r = 0.12 + ((i * 37) % 47) / 100;
  const pebble = new THREE.Mesh(
    new THREE.SphereGeometry(0.025 + (i % 3) * 0.006, 8, 6),
    pebbleMaterial
  );
  pebble.scale.y = 0.45;
  pebble.position.set(Math.cos(a) * r, 1.075 + (i % 2) * 0.004, Math.sin(a) * r);
  pebble.castShadow = true;
  pot.add(pebble);
}

const cactusMaterial = new THREE.MeshStandardMaterial({
  color: 0x4f9c58,
  roughness: 0.72,
  metalness: 0
});

function cactusRadius(t, theta) {
  const bulb = Math.pow(Math.sin(Math.PI * t), 0.48);
  const taper = 0.84 + 0.16 * Math.cos(Math.PI * (t - 0.5));
  const ribs = 1 + 0.045 * Math.cos(theta * 12) * (0.35 + 0.65 * bulb);
  return (0.055 + 0.70 * bulb) * taper * ribs;
}

function createCactusGeometry() {
  const radialSegments = 128;
  const heightSegments = 48;
  const bottom = 0.98;
  const height = 2.25;
  const positions = [];
  const indices = [];

  for (let y = 0; y <= heightSegments; y++) {
    const t = y / heightSegments;
    const py = bottom + t * height;
    for (let x = 0; x < radialSegments; x++) {
      const theta = (x / radialSegments) * Math.PI * 2;
      const radius = cactusRadius(t, theta);
      positions.push(Math.cos(theta) * radius, py, Math.sin(theta) * radius);
    }
  }

  for (let y = 0; y < heightSegments; y++) {
    for (let x = 0; x < radialSegments; x++) {
      const next = (x + 1) % radialSegments;
      const a = y * radialSegments + x;
      const b = y * radialSegments + next;
      const c = (y + 1) * radialSegments + next;
      const d = (y + 1) * radialSegments + x;
      indices.push(a, b, d, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const cactus = new THREE.Mesh(createCactusGeometry(), cactusMaterial);
cactus.castShadow = true;
cactus.receiveShadow = true;
scene.add(cactus);

const spineMaterial = new THREE.MeshStandardMaterial({
  color: 0xf2dfb5,
  roughness: 0.68
});
const areoleMaterial = new THREE.MeshStandardMaterial({
  color: 0xd4b47d,
  roughness: 0.82
});
const spineGeometry = new THREE.ConeGeometry(0.014, 0.14, 5);
const areoleGeometry = new THREE.SphereGeometry(0.032, 8, 6);

function addSpineCluster(y, theta, t) {
  const radius = cactusRadius(t, theta);
  const radial = new THREE.Vector3(Math.cos(theta), 0, Math.sin(theta));
  const center = new THREE.Vector3(radial.x * (radius + 0.018), y, radial.z * (radius + 0.018));

  const areole = new THREE.Mesh(areoleGeometry, areoleMaterial);
  areole.position.copy(center);
  areole.scale.set(1, 0.7, 1);
  areole.castShadow = true;
  scene.add(areole);

  const directions = [
    new THREE.Vector3(radial.x * 0.9, 0.25, radial.z * 0.9),
    new THREE.Vector3(radial.x * 0.8 + Math.cos(theta + 1.4) * 0.34, 0.05, radial.z * 0.8 + Math.sin(theta + 1.4) * 0.34),
    new THREE.Vector3(radial.x * 0.8 + Math.cos(theta - 1.4) * 0.34, 0.05, radial.z * 0.8 + Math.sin(theta - 1.4) * 0.34)
  ];

  for (const direction of directions) {
    const spine = new THREE.Mesh(spineGeometry, spineMaterial);
    spine.position.copy(center);
    spine.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
    spine.castShadow = true;
    scene.add(spine);
  }
}

const spineRings = [0.18, 0.32, 0.47, 0.62, 0.77, 0.88];
for (let ring = 0; ring < spineRings.length; ring++) {
  const t = spineRings[ring];
  const y = 0.98 + t * 2.25;
  const count = ring % 2 === 0 ? 10 : 12;
  for (let i = 0; i < count; i++) {
    const theta = (i / count) * Math.PI * 2 + ring * 0.19;
    addSpineCluster(y, theta, t);
  }
}

const smallCactusMaterial = new THREE.MeshStandardMaterial({
  color: 0x438c4d,
  roughness: 0.74
});
const armGeometry = new THREE.CapsuleGeometry(0.19, 0.55, 10, 20);

function addArm(side) {
  const arm = new THREE.Mesh(armGeometry, smallCactusMaterial);
  arm.scale.set(0.72, 1, 0.72);
  arm.position.set(side * 0.57, 1.96, 0.01);
  arm.rotation.z = side * -0.42;
  arm.castShadow = true;
  arm.receiveShadow = true;
  scene.add(arm);

  const hand = new THREE.Mesh(
    new THREE.SphereGeometry(0.19, 18, 12),
    smallCactusMaterial
  );
  hand.position.set(side * 0.78, 2.25, 0.01);
  hand.castShadow = true;
  hand.receiveShadow = true;
  scene.add(hand);

  addSpineCluster(2.02, side > 0 ? 0.12 : Math.PI - 0.12, 0.46);
  addSpineCluster(2.27, side > 0 ? 0.14 : Math.PI - 0.14, 0.57);
}

addArm(-1);
addArm(1);

const contactShadow = new THREE.Mesh(
  new THREE.CircleGeometry(1.15, 64),
  new THREE.MeshBasicMaterial({ color: 0x75675b, transparent: true, opacity: 0.16 })
);
contactShadow.rotation.x = -Math.PI / 2;
contactShadow.position.y = 0.001;
contactShadow.scale.set(1.25, 0.7, 1);
scene.add(contactShadow);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener("resize", resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
