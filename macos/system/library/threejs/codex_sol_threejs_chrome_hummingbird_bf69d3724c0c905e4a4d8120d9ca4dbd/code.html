<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Chrome Hummingbird</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05070b; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05070b);
scene.fog = new THREE.FogExp2(0x05070b, 0.025);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.8, 3.5, 7.8);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.045).texture;
pmrem.dispose();

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.05, 0.25, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 5.5;
controls.maxDistance = 15;
controls.enablePan = false;

const chrome = new THREE.MeshPhysicalMaterial({
  color: 0xdde5ed,
  metalness: 1,
  roughness: 0.075,
  clearcoat: 1,
  clearcoatRoughness: 0.06,
  envMapIntensity: 2.1
});

const softChrome = new THREE.MeshPhysicalMaterial({
  color: 0xd5e0e8,
  metalness: 1,
  roughness: 0.16,
  clearcoat: 1,
  clearcoatRoughness: 0.11,
  envMapIntensity: 1.9
});

const bird = new THREE.Group();
bird.rotation.z = -0.035;
bird.rotation.y = -0.08;
bird.position.y = 0.25;
scene.add(bird);

function smoothGeometry(geometry) {
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  return geometry;
}

function ellipsoid(radius, sx, sy, sz, position, material = chrome, segments = 64) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(radius, segments, Math.floor(segments * 0.65)),
    material
  );
  mesh.scale.set(sx, sy, sz);
  mesh.position.copy(position);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  bird.add(mesh);
  return mesh;
}

const torso = ellipsoid(1, 1.22, 0.73, 0.69, new THREE.Vector3(0.15, 0.02, 0));
torso.rotation.z = -0.12;

const breast = ellipsoid(1, 0.77, 0.7, 0.64, new THREE.Vector3(-0.53, 0.18, 0));
breast.rotation.z = 0.24;

const head = ellipsoid(1, 0.58, 0.55, 0.55, new THREE.Vector3(-1.02, 0.44, 0));
head.rotation.z = 0.06;

const crownDrop = ellipsoid(1, 0.32, 0.31, 0.36, new THREE.Vector3(-0.84, 0.79, 0.02));
crownDrop.rotation.z = -0.45;

const billGeometry = new THREE.ConeGeometry(0.115, 2.18, 48, 12, false);
const bill = new THREE.Mesh(billGeometry, chrome);
bill.rotation.z = Math.PI / 2;
bill.position.set(-2.23, 0.43, 0);
bill.scale.set(1, 1, 0.88);
bill.castShadow = true;
bird.add(bill);

const billBlend = ellipsoid(1, 0.4, 0.19, 0.24, new THREE.Vector3(-1.4, 0.44, 0));

function createWing(side) {
  const lengthSegments = 30;
  const chordSegments = 10;
  const layerSize = (lengthSegments + 1) * (chordSegments + 1);
  const positions = [];
  const indices = [];

  for (let layer = 0; layer < 2; layer++) {
    const layerSign = layer === 0 ? 1 : -1;
    for (let i = 0; i <= lengthSegments; i++) {
      const s = i / lengthSegments;
      const envelope = Math.pow(Math.sin(Math.PI * (0.03 + 0.94 * s)), 0.58);
      const chord = 0.09 + envelope * (0.66 - 0.17 * s);
      const centerX = 0.12 + 0.27 * s + 0.11 * Math.sin(Math.PI * s);
      const centerY = 0.25 + 1.42 * s - 0.23 * s * s;
      const centerZ = side * (0.12 + 2.58 * s);
      const thickness = 0.018 + 0.055 * envelope;

      for (let j = 0; j <= chordSegments; j++) {
        const u = j / chordSegments;
        const across = (u - 0.5) * 2;
        const edgeRound = Math.sin(Math.PI * u);
        const x = centerX + across * chord;
        const y = centerY + 0.12 * Math.sin(Math.PI * s) * (1 - across * across);
        const z = centerZ + side * layerSign * thickness * edgeRound;
        positions.push(x, y, z);
      }
    }
  }

  const row = chordSegments + 1;
  for (let layer = 0; layer < 2; layer++) {
    const offset = layer * layerSize;
    for (let i = 0; i < lengthSegments; i++) {
      for (let j = 0; j < chordSegments; j++) {
        const a = offset + i * row + j;
        const b = a + row;
        const c = b + 1;
        const d = a + 1;
        if (layer === 0) indices.push(a, b, d, b, c, d);
        else indices.push(a, d, b, b, d, c);
      }
    }
  }

  for (let i = 0; i < lengthSegments; i++) {
    for (const j of [0, chordSegments]) {
      const a = i * row + j;
      const b = (i + 1) * row + j;
      const c = b + layerSize;
      const d = a + layerSize;
      if (j === 0) indices.push(a, d, b, b, d, c);
      else indices.push(a, b, d, b, c, d);
    }
  }

  for (const i of [0, lengthSegments]) {
    for (let j = 0; j < chordSegments; j++) {
      const a = i * row + j;
      const b = a + 1;
      const c = b + layerSize;
      const d = a + layerSize;
      if (i === 0) indices.push(a, b, d, b, c, d);
      else indices.push(a, d, b, b, d, c);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  smoothGeometry(geometry);

  const mesh = new THREE.Mesh(geometry, softChrome);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  bird.add(mesh);
}

createWing(1);
createWing(-1);

function createTailRibbon(offsetZ, directionZ, length, width, lift, twist) {
  const segments = 28;
  const acrossSegments = 5;
  const layerSize = (segments + 1) * (acrossSegments + 1);
  const positions = [];
  const indices = [];

  for (let layer = 0; layer < 2; layer++) {
    const layerSign = layer === 0 ? 1 : -1;
    for (let i = 0; i <= segments; i++) {
      const s = i / segments;
      const x = 0.72 + length * s;
      const y = -0.18 - 0.35 * s + lift * s * s + 0.08 * Math.sin(Math.PI * s);
      const z = offsetZ + directionZ * (0.15 * s + 0.66 * s * s);
      const ribbonWidth = Math.max(0.025, width * (1 - 0.78 * s));
      const angle = twist * s + 0.18 * Math.sin(Math.PI * s);
      const thickness = 0.025 * (1 - 0.55 * s);

      for (let j = 0; j <= acrossSegments; j++) {
        const u = j / acrossSegments;
        const across = (u - 0.5) * 2;
        const edgeRound = Math.sin(Math.PI * u);
        positions.push(
          x,
          y + across * ribbonWidth * Math.cos(angle) + layerSign * thickness * edgeRound,
          z + across * ribbonWidth * Math.sin(angle)
        );
      }
    }
  }

  const row = acrossSegments + 1;
  for (let layer = 0; layer < 2; layer++) {
    const offset = layer * layerSize;
    for (let i = 0; i < segments; i++) {
      for (let j = 0; j < acrossSegments; j++) {
        const a = offset + i * row + j;
        const b = a + row;
        const c = b + 1;
        const d = a + 1;
        if (layer === 0) indices.push(a, b, d, b, c, d);
        else indices.push(a, d, b, b, d, c);
      }
    }
  }

  for (let i = 0; i < segments; i++) {
    for (const j of [0, acrossSegments]) {
      const a = i * row + j;
      const b = (i + 1) * row + j;
      const c = b + layerSize;
      const d = a + layerSize;
      indices.push(a, d, b, b, d, c);
    }
  }

  for (const i of [0, segments]) {
    for (let j = 0; j < acrossSegments; j++) {
      const a = i * row + j;
      const b = a + 1;
      const c = b + layerSize;
      const d = a + layerSize;
      indices.push(a, b, d, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  smoothGeometry(geometry);

  const mesh = new THREE.Mesh(geometry, chrome);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  bird.add(mesh);
}

createTailRibbon(0, 0, 1.62, 0.3, -0.08, 0.35);
createTailRibbon(0.13, 1, 1.48, 0.25, 0.12, 0.72);
createTailRibbon(-0.13, -1, 1.48, 0.25, 0.12, -0.72);
createTailRibbon(0.05, 0.45, 1.28, 0.18, 0.27, 1.05);
createTailRibbon(-0.05, -0.45, 1.28, 0.18, 0.27, -1.05);

const shoulderLeft = ellipsoid(1, 0.52, 0.25, 0.35, new THREE.Vector3(0.12, 0.34, 0.38));
shoulderLeft.rotation.x = -0.3;
const shoulderRight = ellipsoid(1, 0.52, 0.25, 0.35, new THREE.Vector3(0.12, 0.34, -0.38));
shoulderRight.rotation.x = 0.3;

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(9, 96),
  new THREE.MeshStandardMaterial({
    color: 0x070a10,
    metalness: 0.15,
    roughness: 0.5,
    transparent: true,
    opacity: 0.9
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.32;
floor.receiveShadow = true;
scene.add(floor);

const key = new THREE.DirectionalLight(0xe8f4ff, 5.4);
key.position.set(-4, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -6;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 20;
key.shadow.bias = -0.00015;
scene.add(key);

const coolRim = new THREE.SpotLight(0x55bfff, 150, 18, 0.52, 0.7, 1.4);
coolRim.position.set(2, 4, -6);
coolRim.target.position.set(0, 0.5, 0);
scene.add(coolRim, coolRim.target);

const warmRim = new THREE.SpotLight(0xff6ebc, 115, 18, 0.5, 0.75, 1.5);
warmRim.position.set(-5, 2.5, 5);
warmRim.target.position.set(-0.3, 0.3, 0);
scene.add(warmRim, warmRim.target);

const topGlow = new THREE.PointLight(0xffffff, 58, 8, 1.5);
topGlow.position.set(0, 4.5, 0);
scene.add(topGlow);

const fill = new THREE.HemisphereLight(0x8bbfe8, 0x090711, 1.15);
scene.add(fill);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

animate();
</script>
</body>
</html>
