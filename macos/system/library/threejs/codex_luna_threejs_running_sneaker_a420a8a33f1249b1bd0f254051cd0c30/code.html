<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Running Sneaker</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #d8d4cb; }
canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8d4cb);
scene.fog = new THREE.Fog(0xd8d4cb, 11, 22);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.6, -6.4, 3.25);
camera.lookAt(0.25, 0, 0.9);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.065;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.target.set(0.15, 0, 0.85);
controls.minDistance = 4.5;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.48;

scene.add(new THREE.HemisphereLight(0xfff7e7, 0x4b5964, 2.2));

const key = new THREE.DirectionalLight(0xfff1d6, 4.2);
key.position.set(-4, -5, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -5;
key.shadow.bias = -0.0005;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbfdcff, 1.4);
fill.position.set(5, 3, 4);
scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0xc8c3b9, roughness: 0.92, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

const root = new THREE.Group();
root.rotation.y = -0.08;
scene.add(root);

const foamMat = new THREE.MeshStandardMaterial({
  color: 0xf0eee8, roughness: 0.62, metalness: 0
});
const foamDarkMat = new THREE.MeshStandardMaterial({
  color: 0xd7d9d5, roughness: 0.72
});
const rubberMat = new THREE.MeshStandardMaterial({
  color: 0x252b2d, roughness: 0.82, metalness: 0.04
});
const upperMat = new THREE.MeshStandardMaterial({
  color: 0x566f78, roughness: 0.88, metalness: 0
});
const upperLightMat = new THREE.MeshStandardMaterial({
  color: 0x77929a, roughness: 0.82
});
const accentMat = new THREE.MeshStandardMaterial({
  color: 0xd65c3d, roughness: 0.7
});
const laceMat = new THREE.MeshStandardMaterial({
  color: 0xe7e4d9, roughness: 0.78
});
const eyeletMat = new THREE.MeshStandardMaterial({
  color: 0x29383c, roughness: 0.38, metalness: 0.65
});

function soleShape(bottom, top, heel, toeLift) {
  const s = new THREE.Shape();
  s.moveTo(-2.82, bottom + 0.02);
  s.lineTo(-2.88, bottom + 0.12);
  s.lineTo(-2.84, top - 0.02);
  s.quadraticCurveTo(-2.72, top + 0.04, -2.45, top + 0.06);
  s.lineTo(1.82, top + 0.06);
  s.quadraticCurveTo(2.35, top + 0.08, 2.72, top + toeLift);
  s.quadraticCurveTo(2.91, top + toeLift + 0.08, 2.96, top + toeLift + 0.17);
  s.lineTo(2.98, bottom + 0.18);
  s.quadraticCurveTo(2.79, bottom + 0.07, 2.47, bottom + 0.03);
  s.lineTo(-2.82, bottom + 0.02);
  return s;
}

function makeSole(shape, width, y, material, bevel) {
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: width,
    bevelEnabled: true,
    bevelSegments: 3,
    bevelSize: bevel,
    bevelThickness: bevel * 0.8,
    curveSegments: 5
  });
  geo.rotateX(Math.PI / 2);
  geo.translate(0, y, 0);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  root.add(mesh);
  return mesh;
}

makeSole(soleShape(0.18, 0.43, 0, 0.02), 1.48, -0.74, rubberMat, 0.055);
makeSole(soleShape(0.39, 0.76, 0, 0.035), 1.62, -0.81, foamDarkMat, 0.085);
makeSole(soleShape(0.69, 0.93, 0, 0.06), 1.68, -0.84, foamMat, 0.09);

const treadMat = new THREE.MeshStandardMaterial({ color: 0x30383a, roughness: 0.9 });
for (let i = 0; i < 9; i++) {
  const x = -2.3 + i * 0.62;
  const width = i > 6 ? 0.36 : 0.43;
  const block = new THREE.Mesh(
    new THREE.BoxGeometry(width, 1.22, 0.075),
    treadMat
  );
  block.position.set(x, -0.02, 0.16);
  block.rotation.y = (i % 2 === 0 ? -0.12 : 0.12);
  block.castShadow = true;
  root.add(block);
}

function upperSurface(x, u) {
  const t = (x + 2.65) / 5.35;
  const width = 0.47 + 0.39 * Math.sin(Math.PI * Math.max(0, Math.min(1, t)) * 0.86);
  const side = Math.abs(u);
  let h = 0.82;
  if (x > 1.25) h = 0.82 - (x - 1.25) * 0.22;
  if (x < -1.5) h = 0.94 + (x + 1.5) * 0.08;
  const crown = h * (1 - 0.23 * side * side);
  return {
    y: u * width,
    z: 0.78 + crown - 0.025 * Math.max(0, x - 1.55)
  };
}

function buildUpper() {
  const nx = 30, nu = 12;
  const positions = [];
  const uvs = [];
  const indices = [];
  for (let ix = 0; ix <= nx; ix++) {
    const x = -2.62 + ix * 5.28 / nx;
    for (let iu = 0; iu <= nu; iu++) {
      const u = -1 + iu * 2 / nu;
      const p = upperSurface(x, u);
      positions.push(x, p.y, p.z);
      uvs.push(ix / nx, iu / nu);
    }
  }
  for (let ix = 0; ix < nx; ix++) {
    for (let iu = 0; iu < nu; iu++) {
      const a = ix * (nu + 1) + iu;
      const b = a + 1;
      const c = a + nu + 1;
      const d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, upperMat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  root.add(mesh);
}
buildUpper();

function ellipsoid(x, y, z, sx, sy, sz, material, segments = 32) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, segments, 16), material);
  mesh.position.set(x, y, z);
  mesh.scale.set(sx, sy, sz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  root.add(mesh);
  return mesh;
}

ellipsoid(2.13, 0, 1.22, 0.78, 0.62, 0.54, upperLightMat);
ellipsoid(-1.98, 0, 1.48, 0.58, 0.61, 0.78, upperLightMat);

const heelCounter = new THREE.Mesh(
  new THREE.CylinderGeometry(0.61, 0.66, 0.16, 24, 1, false),
  accentMat
);
heelCounter.rotation.z = Math.PI / 2;
heelCounter.position.set(-2.35, 0, 1.46);
heelCounter.scale.set(1, 1, 1.12);
heelCounter.castShadow = true;
root.add(heelCounter);

const heelPanel = new THREE.Mesh(
  new THREE.BoxGeometry(0.28, 1.22, 0.82),
  upperMat
);
heelPanel.position.set(-2.42, 0, 1.22);
heelPanel.rotation.z = -0.08;
heelPanel.castShadow = true;
root.add(heelPanel);

const tongue = ellipsoid(-0.15, 0, 1.92, 1.14, 0.34, 0.68, upperLightMat, 24);
tongue.rotation.y = -0.1;
tongue.rotation.x = -0.1;

const tongueStripe = new THREE.Mesh(
  new THREE.BoxGeometry(0.78, 0.045, 0.12),
  accentMat
);
tongueStripe.position.set(-0.15, -0.345, 2.18);
tongueStripe.rotation.y = -0.1;
tongueStripe.rotation.x = -0.1;
tongueStripe.castShadow = true;
root.add(tongueStripe);

function cylinderBetween(a, b, radius, material, radial = 10) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, length, radial),
    material
  );
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  mesh.castShadow = true;
  root.add(mesh);
  return mesh;
}

function laceCurve(points, radius = 0.035) {
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 18, radius, 8, false),
    laceMat
  );
  mesh.castShadow = true;
  root.add(mesh);
}

const eyeletXs = [-1.02, -0.55, -0.08, 0.39, 0.86];
for (let i = 0; i < eyeletXs.length; i++) {
  const x = eyeletXs[i];
  const z = 1.57 + Math.abs(x + 0.1) * 0.09;
  const left = new THREE.Mesh(new THREE.TorusGeometry(0.105, 0.027, 8, 16), eyeletMat);
  left.rotation.x = Math.PI / 2;
  left.position.set(x, -0.39, z);
  left.castShadow = true;
  root.add(left);

  const right = left.clone();
  right.position.y = 0.39;
  root.add(right);
}

for (let i = 0; i < eyeletXs.length - 1; i++) {
  const x1 = eyeletXs[i], x2 = eyeletXs[i + 1];
  const z1 = 1.59 + Math.abs(x1 + 0.1) * 0.09;
  const z2 = 1.59 + Math.abs(x2 + 0.1) * 0.09;
  laceCurve([
    new THREE.Vector3(x1, -0.41, z1 + 0.01),
    new THREE.Vector3((x1 + x2) * 0.5, -0.06, Math.max(z1, z2) + 0.13),
    new THREE.Vector3(x2, 0.41, z2 + 0.01)
  ], 0.038);
  laceCurve([
    new THREE.Vector3(x1, 0.41, z1 + 0.015),
    new THREE.Vector3((x1 + x2) * 0.5, 0.06, Math.max(z1, z2) + 0.15),
    new THREE.Vector3(x2, -0.41, z2 + 0.015)
  ], 0.034);
}

laceCurve([
  new THREE.Vector3(0.84, -0.4, 1.69),
  new THREE.Vector3(1.21, -0.08, 1.82),
  new THREE.Vector3(1.38, -0.5, 1.48)
], 0.04);

const logo = new THREE.Mesh(
  new THREE.TorusGeometry(0.31, 0.065, 8, 24, Math.PI * 1.55),
  accentMat
);
logo.position.set(0.15, -0.605, 1.17);
logo.rotation.set(Math.PI / 2, 0.12, -0.35);
logo.castShadow = true;
root.add(logo);

const seamMat = new THREE.MeshStandardMaterial({
  color: 0xa8b7b7,
  roughness: 0.9
});
for (let side of [-1, 1]) {
  const seam = new THREE.Mesh(
    new THREE.TorusGeometry(1.22, 0.018, 5, 32, Math.PI * 0.78),
    seamMat
  );
  seam.position.set(-0.55, side * 0.59, 1.23);
  seam.rotation.set(Math.PI / 2, 0, side > 0 ? 0.12 : -0.12);
  seam.scale.set(1.25, 0.72, 1);
  root.add(seam);
}

root.position.y = 0.04;

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  root.position.y = 0.04 + Math.sin(t * 1.4) * 0.018;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
