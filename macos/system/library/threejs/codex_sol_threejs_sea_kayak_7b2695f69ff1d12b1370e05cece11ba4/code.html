<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sea Kayak on Roof Racks</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #d9e3e7; }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdbe5e8);
scene.fog = new THREE.Fog(0xdbe5e8, 12, 24);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 60);
camera.position.set(6.6, 4.1, 6.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 5;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.48;

const hemi = new THREE.HemisphereLight(0xeef8ff, 0x5a665d, 2.2);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 4.2);
key.position.set(-4, 8, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -5;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 20;
key.shadow.bias = -0.0002;
scene.add(key);

const rim = new THREE.DirectionalLight(0xbadfff, 1.35);
rim.position.set(6, 4, -5);
scene.add(rim);

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0xbac7c7,
  roughness: 0.82,
  metalness: 0.04
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(28, 20), groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

const kayak = new THREE.Group();
scene.add(kayak);

const hullLength = 7.25;
const hullCenterY = 1.38;

function fullness(x) {
  const t = THREE.MathUtils.clamp(x / hullLength + 0.5, 0, 1);
  return Math.pow(Math.sin(Math.PI * t), 0.57) * (0.96 + 0.04 * t);
}

function sheer(x) {
  const t = THREE.MathUtils.clamp(x / hullLength + 0.5, 0, 1);
  return 0.105 * Math.pow(Math.abs(2 * t - 1), 3.2) + 0.035 * Math.pow(t, 5);
}

function deckY(x) {
  return hullCenterY + sheer(x) + 0.285 * fullness(x);
}

function halfWidth(x) {
  return 0.325 * fullness(x);
}

function createHullGeometry() {
  const longitudinalSegments = 96;
  const radialSegments = 40;
  const positions = [];
  const indices = [];

  positions.push(-hullLength / 2, hullCenterY + 0.10, 0);
  const sternIndex = 0;

  for (let i = 1; i < longitudinalSegments; i++) {
    const t = i / longitudinalSegments;
    const x = -hullLength / 2 + hullLength * t;
    const f = fullness(x);
    const cy = hullCenterY + sheer(x);
    const width = 0.325 * f;
    const height = 0.285 * f;

    for (let j = 0; j < radialSegments; j++) {
      const a = j / radialSegments * Math.PI * 2;
      const s = Math.sin(a);
      const c = Math.cos(a);
      const lowerBias = s < 0 ? 1.08 : 1.0;
      const chine = 1 - 0.055 * Math.pow(Math.abs(c), 6) * Math.max(-s, 0);
      positions.push(
        x,
        cy + height * s * lowerBias,
        width * c * chine
      );
    }
  }

  const bowIndex = positions.length / 3;
  positions.push(hullLength / 2, hullCenterY + 0.145, 0);

  for (let j = 0; j < radialSegments; j++) {
    const next = (j + 1) % radialSegments;
    indices.push(sternIndex, 1 + next, 1 + j);
  }

  const ringCount = longitudinalSegments - 1;
  for (let i = 0; i < ringCount - 1; i++) {
    const a = 1 + i * radialSegments;
    const b = a + radialSegments;
    for (let j = 0; j < radialSegments; j++) {
      const next = (j + 1) % radialSegments;
      indices.push(a + j, b + next, b + j);
      indices.push(a + j, a + next, b + next);
    }
  }

  const lastRing = 1 + (ringCount - 1) * radialSegments;
  for (let j = 0; j < radialSegments; j++) {
    const next = (j + 1) % radialSegments;
    indices.push(lastRing + j, lastRing + next, bowIndex);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  return geometry;
}

const hullMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xe44b22,
  roughness: 0.24,
  metalness: 0.02,
  clearcoat: 0.72,
  clearcoatRoughness: 0.18
});
const hull = new THREE.Mesh(createHullGeometry(), hullMaterial);
hull.castShadow = true;
hull.receiveShadow = true;
kayak.add(hull);

const keelMaterial = new THREE.MeshStandardMaterial({
  color: 0x282d30,
  roughness: 0.48,
  metalness: 0.12
});

function makeTube(points, radius, material, tubularSegments = 48, radialSegments = 8, closed = false) {
  const curve = new THREE.CatmullRomCurve3(points, closed, 'centripetal');
  const mesh = new THREE.Mesh(
    new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, closed),
    material
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const keelPoints = [];
for (let i = 0; i <= 24; i++) {
  const x = -3.25 + i / 24 * 6.5;
  keelPoints.push(new THREE.Vector3(x, hullCenterY + sheer(x) - 0.285 * fullness(x) - 0.006, 0));
}
kayak.add(makeTube(keelPoints, 0.014, keelMaterial, 72, 6));

const cockpitX = -0.38;
const cockpitY = deckY(cockpitX) + 0.014;
const cockpitLength = 1.08;
const cockpitWidth = 0.46;

const cockpitInteriorMaterial = new THREE.MeshStandardMaterial({
  color: 0x080b0c,
  roughness: 0.82,
  side: THREE.DoubleSide
});
const cockpitDisk = new THREE.Mesh(new THREE.CircleGeometry(0.5, 64), cockpitInteriorMaterial);
cockpitDisk.scale.set(cockpitLength, cockpitWidth, 1);
cockpitDisk.rotation.x = -Math.PI / 2;
cockpitDisk.position.set(cockpitX, cockpitY + 0.006, 0);
cockpitDisk.receiveShadow = true;
kayak.add(cockpitDisk);

const cockpitShape = new THREE.Shape();
cockpitShape.absellipse(0, 0, cockpitLength * 0.55, cockpitWidth * 0.59, 0, Math.PI * 2, false);
const cockpitHole = new THREE.Path();
cockpitHole.absellipse(0, 0, cockpitLength * 0.49, cockpitWidth * 0.50, 0, Math.PI * 2, true);
cockpitShape.holes.push(cockpitHole);

const coamingMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x171b1d,
  roughness: 0.3,
  metalness: 0.08,
  clearcoat: 0.45
});
const coaming = new THREE.Mesh(new THREE.ExtrudeGeometry(cockpitShape, {
  depth: 0.045,
  bevelEnabled: true,
  bevelSize: 0.014,
  bevelThickness: 0.014,
  bevelSegments: 3,
  curveSegments: 64
}), coamingMaterial);
coaming.rotation.x = -Math.PI / 2;
coaming.position.set(cockpitX, cockpitY + 0.052, 0);
coaming.castShadow = true;
kayak.add(coaming);

const seat = new THREE.Mesh(
  new THREE.BoxGeometry(0.38, 0.055, 0.33, 4, 1, 4),
  new THREE.MeshStandardMaterial({ color: 0x24292b, roughness: 0.9 })
);
seat.position.set(cockpitX - 0.1, cockpitY - 0.035, 0);
seat.rotation.y = 0.04;
kayak.add(seat);

const lineMaterial = new THREE.MeshStandardMaterial({
  color: 0x171a1b,
  roughness: 0.5,
  metalness: 0.05
});

function deckLine(x1, x2, zFactor) {
  const points = [];
  const segments = 18;
  for (let i = 0; i <= segments; i++) {
    const x = THREE.MathUtils.lerp(x1, x2, i / segments);
    points.push(new THREE.Vector3(
      x,
      deckY(x) + 0.024,
      halfWidth(x) * zFactor
    ));
  }
  kayak.add(makeTube(points, 0.011, lineMaterial, 48, 7));
}

deckLine(0.32, 3.18, 0.48);
deckLine(0.32, 3.18, -0.48);
deckLine(-3.05, -1.10, 0.46);
deckLine(-3.05, -1.10, -0.46);

function crossRigging(x, curveAmount = 0.025) {
  const width = halfWidth(x) * 0.82;
  const points = [];
  for (let i = 0; i <= 12; i++) {
    const u = i / 12;
    const z = THREE.MathUtils.lerp(-width, width, u);
    points.push(new THREE.Vector3(
      x + curveAmount * Math.sin(u * Math.PI),
      deckY(x) + 0.028 + 0.012 * Math.sin(u * Math.PI),
      z
    ));
  }
  kayak.add(makeTube(points, 0.01, lineMaterial, 28, 7));
}

[-2.66, -2.30, 0.76, 1.14, 1.53, 1.93, 2.34].forEach((x, i) => crossRigging(x, i % 2 ? -0.035 : 0.035));

const grabMaterial = new THREE.MeshStandardMaterial({
  color: 0xd9b04c,
  roughness: 0.45
});
function grabLoop(x, direction) {
  const y = deckY(x) + 0.03;
  const w = halfWidth(x) * 0.32;
  const points = [
    new THREE.Vector3(x, y, -w),
    new THREE.Vector3(x + direction * 0.18, y + 0.035, -w * 0.75),
    new THREE.Vector3(x + direction * 0.26, y + 0.045, 0),
    new THREE.Vector3(x + direction * 0.18, y + 0.035, w * 0.75),
    new THREE.Vector3(x, y, w)
  ];
  kayak.add(makeTube(points, 0.013, grabMaterial, 30, 7));
}
grabLoop(-3.22, -1);
grabLoop(3.25, 1);

const fittingMaterial = new THREE.MeshStandardMaterial({
  color: 0x101315,
  roughness: 0.45,
  metalness: 0.15
});
for (const x of [-3.05, -2.66, -2.30, -1.10, 0.32, 0.76, 1.14, 1.53, 1.93, 2.34, 3.18]) {
  for (const side of [-1, 1]) {
    const fitting = new THREE.Mesh(new THREE.SphereGeometry(0.026, 12, 8), fittingMaterial);
    fitting.position.set(x, deckY(x) + 0.023, halfWidth(x) * 0.47 * side);
    fitting.scale.set(1.25, 0.65, 0.8);
    fitting.castShadow = true;
    kayak.add(fitting);
  }
}

const rack = new THREE.Group();
scene.add(rack);

const metalMaterial = new THREE.MeshStandardMaterial({
  color: 0x252b2e,
  roughness: 0.28,
  metalness: 0.72
});
const rubberMaterial = new THREE.MeshStandardMaterial({
  color: 0x15191a,
  roughness: 0.76,
  metalness: 0.02
});
const footMaterial = new THREE.MeshStandardMaterial({
  color: 0x343a3c,
  roughness: 0.42,
  metalness: 0.5
});

function roundedBox(width, height, depth, radius, material) {
  const shape = new THREE.Shape();
  const x = -width / 2;
  const y = -height / 2;
  shape.moveTo(x + radius, y);
  shape.lineTo(x + width - radius, y);
  shape.quadraticCurveTo(x + width, y, x + width, y + radius);
  shape.lineTo(x + width, y + height - radius);
  shape.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  shape.lineTo(x + radius, y + height);
  shape.quadraticCurveTo(x, y + height, x, y + height - radius);
  shape.lineTo(x, y + radius);
  shape.quadraticCurveTo(x, y, x + radius, y);
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: true,
    bevelSize: radius * 0.3,
    bevelThickness: radius * 0.3,
    bevelSegments: 2
  });
  geometry.center();
  return new THREE.Mesh(geometry, material);
}

for (const x of [-1.58, 1.58]) {
  const bar = roundedBox(0.13, 0.12, 2.65, 0.035, metalMaterial);
  bar.rotation.y = Math.PI / 2;
  bar.position.set(x, 0.91, 0);
  bar.castShadow = true;
  bar.receiveShadow = true;
  rack.add(bar);

  for (const z of [-1.02, 1.02]) {
    const foot = roundedBox(0.35, 0.43, 0.28, 0.055, footMaterial);
    foot.position.set(x, 0.68, z);
    foot.castShadow = true;
    rack.add(foot);

    const base = roundedBox(0.48, 0.08, 0.42, 0.035, rubberMaterial);
    base.position.set(x, 0.43, z);
    base.castShadow = true;
    rack.add(base);
  }

  const cradlePoints = [
    new THREE.Vector3(x, 1.02, -0.55),
    new THREE.Vector3(x, 1.06, -0.43),
    new THREE.Vector3(x, 1.15, -0.31),
    new THREE.Vector3(x, 1.23, -0.20),
    new THREE.Vector3(x, 1.27, -0.10),
    new THREE.Vector3(x, 1.28, 0),
    new THREE.Vector3(x, 1.27, 0.10),
    new THREE.Vector3(x, 1.23, 0.20),
    new THREE.Vector3(x, 1.15, 0.31),
    new THREE.Vector3(x, 1.06, 0.43),
    new THREE.Vector3(x, 1.02, 0.55)
  ];
  rack.add(makeTube(cradlePoints, 0.048, rubberMaterial, 56, 10));

  for (const z of [-0.48, 0.48]) {
    const supportPoints = [
      new THREE.Vector3(x, 0.94, z),
      new THREE.Vector3(x, 1.04, z * 0.96),
      new THREE.Vector3(x, 1.13, z * 0.83)
    ];
    rack.add(makeTube(supportPoints, 0.029, metalMaterial, 20, 8));
  }
}

const strapMaterial = new THREE.MeshStandardMaterial({
  color: 0x202629,
  roughness: 0.65
});
for (const x of [-1.58, 1.58]) {
  const strapPoints = [];
  for (let i = 0; i <= 22; i++) {
    const a = -0.13 + i / 22 * (Math.PI + 0.26);
    const y = hullCenterY + 0.31 * Math.sin(a);
    const z = 0.355 * Math.cos(a);
    strapPoints.push(new THREE.Vector3(x, y, z));
  }
  rack.add(makeTube(strapPoints, 0.015, strapMaterial, 60, 6));

  const buckle = roundedBox(0.11, 0.045, 0.09, 0.012, metalMaterial);
  buckle.position.set(x, 1.48, -0.30);
  buckle.rotation.x = -0.42;
  buckle.castShadow = true;
  rack.add(buckle);
}

const shadowPad = new THREE.Mesh(
  new THREE.PlaneGeometry(8.8, 4.8),
  new THREE.ShadowMaterial({ color: 0x263032, opacity: 0.18 })
);
shadowPad.rotation.x = -Math.PI / 2;
shadowPad.position.y = 0.006;
shadowPad.receiveShadow = true;
scene.add(shadowPad);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
