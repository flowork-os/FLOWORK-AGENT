<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kawaii Salmon Nigiri</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141418; }
  #app { width: 100vw; height: 100vh; display: block; }
  .hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 12px; letter-spacing: .4px; color: rgba(255,255,255,.34);
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="app"></canvas>
<div class="hint">drag to orbit • scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- Shared proportions (world units ~ centimeters) ----------
const RX = 1.58, RY = 0.86, RZ = 1.00;   // rice ellipsoid half-sizes
const RICE_BOTTOM = -0.5;                 // flattened base

// ---------- Renderer ----------
const canvas = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ---------- Scene & camera ----------
const scene = new THREE.Scene();
scene.background = makeBackgroundTexture();

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3.4, 2.1, 4.3);

// Soft studio reflections for glossy materials
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------- Lighting: hemisphere + key/fill/rim ----------
const hemi = new THREE.HemisphereLight(0xdfe9ff, 0x30281f, 0.38);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff2e0, 2.4);
keyLight.position.set(3.6, 5.6, 4.0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.radius = 6;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.02;
const sc = keyLight.shadow.camera;
sc.near = 0.5; sc.far = 22; sc.left = -3.4; sc.right = 3.4; sc.top = 3.4; sc.bottom = -3.4;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xbcd2ff, 0.55);
fillLight.position.set(-4.2, 2.0, 2.4);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffd7ac, 1.5);
rimLight.position.set(-2.4, 3.2, -4.8);
scene.add(rimLight);

// ---------- Ground plane (only receives shadows) ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.32 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = RICE_BOTTOM;
ground.receiveShadow = true;
scene.add(ground);

// ================= THE ONE OBJECT: kawaii salmon nigiri =================
const sushi = new THREE.Group();
scene.add(sushi);

// ----- Rice mound (rounded, flat-bottomed ellipsoid) -----
function makeRice() {
  const geo = new THREE.SphereGeometry(1, 120, 80);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.set(pos.getX(i), pos.getY(i), pos.getZ(i));
    v.set(v.x * RX, v.y * RY, v.z * RZ);
    // gentle packed-rice lumps
    const lump = 0.018 * (Math.sin(v.x * 5.3) * Math.sin(v.z * 5.9) + Math.sin(v.y * 6.1 + v.x * 2.0));
    const len = v.length() || 1;
    v.addScaledVector(v.clone().multiplyScalar(1 / len), lump);
    if (v.y < RICE_BOTTOM) v.y = RICE_BOTTOM; // flatten base
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0xf7f4ea, roughness: 0.62, clearcoat: 0.4, clearcoatRoughness: 0.5,
    sheen: 0.5, sheenColor: new THREE.Color(0xffffff), envMapIntensity: 0.7
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}
sushi.add(makeRice());

// ----- Rice grains (instanced detail scattered on the mound) -----
function makeGrains() {
  const g = new THREE.SphereGeometry(1, 10, 8);
  g.scale(0.13, 0.058, 0.058); // little ellipsoid grain, long axis = local X
  const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5, metalness: 0.0 });
  const N = 300;
  const inst = new THREE.InstancedMesh(g, mat, N);
  inst.castShadow = true; inst.receiveShadow = true;

  const up = new THREE.Vector3(0, 1, 0);
  const dir = new THREE.Vector3(), p = new THREE.Vector3(), n = new THREE.Vector3();
  const t = new THREE.Vector3(), b = new THREE.Vector3();
  const m = new THREE.Matrix4(), col = new THREE.Color();
  const gx = RX * 0.985, gy = RY * 0.985, gz = RZ * 0.985;

  for (let k = 0; k < N; k++) {
    do {
      const u = Math.random() * 2 - 1;
      const th = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.max(0, 1 - u * u));
      dir.set(r * Math.cos(th), u, r * Math.sin(th));
    } while (dir.y < -0.32);

    p.set(dir.x * gx, dir.y * gy, dir.z * gz);
    if (p.y < RICE_BOTTOM + 0.04) p.y = RICE_BOTTOM + 0.04;
    n.set(p.x / (gx * gx), p.y / (gy * gy), p.z / (gz * gz)).normalize();
    p.addScaledVector(n, 0.02);

    t.crossVectors(n, up);
    if (t.lengthSq() < 1e-4) t.set(1, 0, 0);
    t.normalize().applyAxisAngle(n, Math.random() * Math.PI * 2);
    b.crossVectors(n, t).normalize();

    m.makeBasis(t, n, b);
    m.setPosition(p);
    const s = 0.75 + Math.random() * 0.5;
    m.multiply(new THREE.Matrix4().makeScale(s, s, s));
    inst.setMatrixAt(k, m);

    const sh = 0.92 + Math.random() * 0.08;
    col.setRGB(sh, sh * 0.99, sh * 0.95);
    inst.setColorAt(k, col);
  }
  inst.instanceMatrix.needsUpdate = true;
  if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
  return inst;
}
sushi.add(makeGrains());

// height of the salmon drape surface at a given (x,z)
function drapeHeight(x, z) {
  const rr = (x / RX) * (x / RX) + (z / RZ) * (z / RZ);
  if (rr <= 1) return RY * Math.sqrt(1 - rr) + 0.05;
  return 0.05 - 1.3 * (Math.sqrt(rr) - 1);
}

// ----- Salmon slice draped over the rice (glossy, marbled) -----
function makeSalmon() {
  const rings = 46, seg = 120;
  const Lx = 2.0, Lz = 1.14, thick = 0.14;
  const positions = [], colors = [], indices = [];
  const base = new THREE.Color(0xfa7a50);
  const marble = new THREE.Color(0xffcbb0);
  const edge = new THREE.Color(0xd85f38);
  const c = new THREE.Color();

  for (let i = 0; i <= rings; i++) {
    const tRad = i / rings;
    for (let j = 0; j <= seg; j++) {
      const a = (j / seg) * Math.PI * 2;
      const x = Lx * tRad * Math.cos(a);
      const z = Lz * tRad * Math.sin(a);
      let y = drapeHeight(x, z);
      y += 0.02 * Math.sin(a * 5.0) * tRad * tRad; // wavy fillet
      positions.push(x, y, z);
      // marbling: thin lighter fat lines across the flesh
      const stripe = 0.5 + 0.5 * Math.sin((x * 3.0 + z * 1.0) * 1.7 + 0.6);
      const mm = Math.pow(stripe, 5) * 0.7;
      c.copy(base).lerp(marble, mm);
      colors.push(c.r, c.g, c.b);
    }
  }
  const row = seg + 1;
  for (let i = 0; i < rings; i++) {
    for (let j = 0; j < seg; j++) {
      const a = i * row + j, bI = a + 1, cI = a + row, d = cI + 1;
      indices.push(a, cI, bI, bI, cI, d);
    }
  }
  // skirt: give the draped edge visible thickness
  const skirtBase = positions.length / 3;
  for (let j = 0; j <= seg; j++) {
    const a = (j / seg) * Math.PI * 2;
    const x = Lx * Math.cos(a), z = Lz * Math.sin(a);
    let y = drapeHeight(x, z) + 0.02 * Math.sin(a * 5.0);
    positions.push(x * 0.965, y - thick, z * 0.965);
    colors.push(edge.r, edge.g, edge.b);
  }
  const outerBase = rings * row;
  for (let j = 0; j < seg; j++) {
    const o = outerBase + j, o2 = o + 1, s = skirtBase + j, s2 = s + 1;
    indices.push(o, s, o2, o2, s, s2);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const mat = new THREE.MeshPhysicalMaterial({
    vertexColors: true, color: 0xffffff,
    roughness: 0.32, metalness: 0.0,
    clearcoat: 1.0, clearcoatRoughness: 0.13,
    sheen: 0.5, sheenColor: new THREE.Color(0xff9e7a),
    envMapIntensity: 1.0, side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}
sushi.add(makeSalmon());

// ----- Nori band wrapping around the middle -----
function makeNori() {
  const seg = 160, halfW = 0.35;
  const cY = 0.02, rY = 0.90, rZ = 1.05;
  const positions = [], indices = [];
  for (let j = 0; j <= seg; j++) {
    const a = (j / seg) * Math.PI * 2;
    const y = cY + rY * Math.cos(a);
    const z = rZ * Math.sin(a);
    positions.push(-halfW, y, z);
    positions.push(halfW, y, z);
  }
  for (let j = 0; j < seg; j++) {
    const a = j * 2, b = a + 1, cI = a + 2, d = a + 3;
    indices.push(a, cI, b, b, cI, d);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const mat = new THREE.MeshPhysicalMaterial({
    color: 0x14251b, roughness: 0.66, metalness: 0.0,
    clearcoat: 0.35, clearcoatRoughness: 0.45,
    sheen: 0.4, sheenColor: new THREE.Color(0x2f5a3d),
    envMapIntensity: 0.5, side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}
sushi.add(makeNori());

// ----- Kawaii face on the front of the salmon -----
function addFace() {
  const face = new THREE.Group();

  const eyeMat = new THREE.MeshPhysicalMaterial({
    color: 0x1a1210, roughness: 0.16, clearcoat: 1.0, clearcoatRoughness: 0.08
  });
  const glintMat = new THREE.MeshStandardMaterial({
    color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.55, roughness: 0.3
  });
  const eyeGeo = new THREE.SphereGeometry(0.12, 28, 28);
  const glintGeo = new THREE.SphereGeometry(0.033, 14, 14);

  for (const sx of [-1, 1]) {
    const eye = new THREE.Mesh(eyeGeo, eyeMat);
    eye.scale.set(0.88, 1.22, 0.62);
    eye.position.set(0.33 * sx, 0.63, 0.80);
    eye.castShadow = true;
    face.add(eye);

    const glint = new THREE.Mesh(glintGeo, glintMat);
    glint.position.set(0.33 * sx - 0.03 * sx, 0.69, 0.90);
    face.add(glint);
  }

  // smile
  const curve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(-0.14, 0.035, 0),
    new THREE.Vector3(0.0, -0.075, 0),
    new THREE.Vector3(0.14, 0.035, 0)
  );
  const mouth = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 24, 0.021, 8, false),
    new THREE.MeshStandardMaterial({ color: 0x2a1614, roughness: 0.4 })
  );
  mouth.position.set(0, 0.515, 0.865);
  face.add(mouth);

  // soft blush cheeks
  const blushTex = makeBlushTexture();
  const blushMat = new THREE.MeshBasicMaterial({
    map: blushTex, transparent: true, opacity: 0.7, depthWrite: false
  });
  for (const sx of [-1, 1]) {
    const blush = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.26), blushMat);
    blush.position.set(0.6 * sx, 0.5, 0.76);
    blush.rotation.y = -0.45 * sx;
    blush.renderOrder = 2;
    face.add(blush);
  }

  sushi.add(face);
}
addFace();

// center the piece for orbiting
sushi.position.y = 0.02;

// ---------- Controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.target.set(0, 0.2, 0);
controls.minDistance = 3.4;
controls.maxDistance = 9.0;
controls.minPolarAngle = 0.15;
controls.maxPolarAngle = Math.PI * 0.5 + 0.12;
controls.update();

// ---------- Helpers: procedural textures ----------
function makeBackgroundTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(256, 210, 20, 256, 256, 380);
  g.addColorStop(0.0, '#34363f');
  g.addColorStop(0.55, '#212228');
  g.addColorStop(1.0, '#131317');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 512, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeBlushTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 4, 64, 64, 62);
  g.addColorStop(0.0, 'rgba(255,150,175,0.95)');
  g.addColorStop(0.5, 'rgba(255,150,175,0.55)');
  g.addColorStop(1.0, 'rgba(255,150,175,0.0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// ---------- Resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Render loop ----------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
