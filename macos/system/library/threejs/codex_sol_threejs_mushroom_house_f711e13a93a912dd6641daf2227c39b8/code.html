<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toon Mushroom Cottage</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: linear-gradient(#8ed6e8, #d9f0dc);
      font-family: sans-serif;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9bd9e7);
  scene.fog = new THREE.Fog(0x9bd9e7, 13, 25);

  const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(7.2, 5.5, 8.5);
  camera.lookAt(0, 2.2, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 2.15, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.7;
  controls.minDistance = 6;
  controls.maxDistance = 15;
  controls.maxPolarAngle = Math.PI * 0.48;

  const hemi = new THREE.HemisphereLight(0xfff4d6, 0x4b7655, 2.4);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xffe1b1, 4.3);
  sun.position.set(-5, 9, 6);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -7;
  sun.shadow.camera.right = 7;
  sun.shadow.camera.top = 8;
  sun.shadow.camera.bottom = -3;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 22;
  sun.shadow.bias = -0.0007;
  scene.add(sun);

  const fill = new THREE.DirectionalLight(0xaacaff, 1.15);
  fill.position.set(6, 4, -5);
  scene.add(fill);

  const toon = (color, roughness = 0.8) =>
    new THREE.MeshToonMaterial({ color, roughness });

  const creamMat = toon(0xf2dba5);
  const creamLightMat = toon(0xffedbd);
  const creamShadowMat = toon(0xd5b978);
  const redMat = toon(0xd9473f);
  const redDarkMat = toon(0x8e292b);
  const whiteMat = toon(0xfff7dc);
  const brownMat = toon(0x87502f);
  const brownDarkMat = toon(0x4a2c23);
  const goldMat = toon(0xf6bf45);
  const blueGlassMat = new THREE.MeshToonMaterial({
    color: 0x75cbd5,
    emissive: 0x17383c,
    emissiveIntensity: 0.16
  });
  const grassMat = toon(0x72aa55);
  const grassDarkMat = toon(0x487b43);
  const outlineMat = new THREE.MeshBasicMaterial({
    color: 0x4b2d2b,
    side: THREE.BackSide
  });

  const cottage = new THREE.Group();
  cottage.rotation.y = -0.04;
  scene.add(cottage);

  function shadowedMesh(geometry, material, outlineScale = 0) {
    const holder = new THREE.Group();

    if (outlineScale > 1) {
      const outline = new THREE.Mesh(geometry, outlineMat);
      outline.scale.setScalar(outlineScale);
      holder.add(outline);
    }

    const mesh = new THREE.Mesh(geometry, material);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    holder.add(mesh);
    return holder;
  }

  const island = new THREE.Mesh(
    new THREE.CylinderGeometry(3.55, 3.85, 0.38, 64),
    grassMat
  );
  island.position.y = -0.18;
  island.castShadow = true;
  island.receiveShadow = true;
  cottage.add(island);

  const islandEdge = new THREE.Mesh(
    new THREE.TorusGeometry(3.52, 0.13, 10, 64),
    grassDarkMat
  );
  islandEdge.rotation.x = Math.PI / 2;
  islandEdge.position.y = 0.02;
  islandEdge.castShadow = true;
  cottage.add(islandEdge);

  const stalkProfile = [
    new THREE.Vector2(1.24, 0.02),
    new THREE.Vector2(1.38, 0.16),
    new THREE.Vector2(1.47, 0.55),
    new THREE.Vector2(1.49, 1.10),
    new THREE.Vector2(1.43, 1.75),
    new THREE.Vector2(1.30, 2.35),
    new THREE.Vector2(1.10, 2.85),
    new THREE.Vector2(0.91, 3.15)
  ];
  const stalkGeometry = new THREE.LatheGeometry(stalkProfile, 64);
  stalkGeometry.computeVertexNormals();
  const stalk = shadowedMesh(stalkGeometry, creamMat, 1.018);
  cottage.add(stalk);

  const roofCenterY = 3.08;
  const roofRadius = 2.47;
  const roofHeightScale = 0.76;
  const roofGeometry = new THREE.SphereGeometry(
    roofRadius, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2
  );
  const roof = shadowedMesh(roofGeometry, redMat, 1.018);
  roof.position.y = roofCenterY;
  roof.scale.y = roofHeightScale;
  cottage.add(roof);

  const underside = new THREE.Mesh(
    new THREE.CylinderGeometry(2.30, 2.30, 0.14, 64),
    creamLightMat
  );
  underside.position.y = 3.015;
  underside.castShadow = true;
  underside.receiveShadow = true;
  cottage.add(underside);

  const scallopGeometry = new THREE.SphereGeometry(0.42, 20, 12);
  for (let i = 0; i < 20; i++) {
    const angle = i / 20 * Math.PI * 2;
    const scallop = new THREE.Mesh(scallopGeometry, creamLightMat);
    scallop.position.set(
      Math.cos(angle) * 2.17,
      2.98,
      Math.sin(angle) * 2.17
    );
    scallop.scale.set(1.05, 0.42, 0.82);
    scallop.rotation.y = -angle;
    scallop.castShadow = true;
    scallop.receiveShadow = true;
    cottage.add(scallop);
  }

  const gillGeometry = new THREE.BoxGeometry(1.72, 0.045, 0.075);
  for (let i = 0; i < 16; i++) {
    const angle = i / 16 * Math.PI * 2;
    const gill = new THREE.Mesh(gillGeometry, creamShadowMat);
    gill.position.y = 2.925;
    gill.rotation.y = -angle;
    gill.position.x = Math.cos(angle) * 0.88;
    gill.position.z = Math.sin(angle) * 0.88;
    gill.castShadow = true;
    cottage.add(gill);
  }

  const spotGeometry = new THREE.SphereGeometry(1, 28, 18);

  function addRoofSpot(theta, phi, size, oval = 0.82) {
    const sinTheta = Math.sin(theta);
    const x = roofRadius * sinTheta * Math.cos(phi);
    const yOffset = roofRadius * roofHeightScale * Math.cos(theta);
    const z = roofRadius * sinTheta * Math.sin(phi);

    const normal = new THREE.Vector3(
      x / (roofRadius * roofRadius),
      yOffset / Math.pow(roofRadius * roofHeightScale, 2),
      z / (roofRadius * roofRadius)
    ).normalize();

    const spot = new THREE.Mesh(spotGeometry, whiteMat);
    spot.position.set(x, roofCenterY + yOffset, z).addScaledVector(normal, 0.025);
    spot.scale.set(size, size * oval, 0.085);
    spot.lookAt(spot.position.clone().add(normal));
    spot.castShadow = true;
    cottage.add(spot);
  }

  addRoofSpot(0.24, 0.5, 0.31);
  addRoofSpot(0.43, 2.0, 0.36);
  addRoofSpot(0.51, 3.65, 0.29);
  addRoofSpot(0.62, 5.1, 0.40);
  addRoofSpot(0.76, 0.72, 0.42);
  addRoofSpot(0.83, 1.58, 0.30);
  addRoofSpot(0.90, 2.64, 0.43);
  addRoofSpot(0.93, 3.52, 0.31);
  addRoofSpot(0.82, 4.32, 0.37);
  addRoofSpot(1.02, 5.55, 0.33);
  addRoofSpot(1.18, 0.15, 0.40);
  addRoofSpot(1.23, 1.18, 0.32);
  addRoofSpot(1.17, 2.13, 0.36);
  addRoofSpot(1.27, 3.05, 0.29);
  addRoofSpot(1.20, 4.05, 0.41);
  addRoofSpot(1.28, 5.00, 0.31);

  const doorShape = new THREE.Shape();
  doorShape.moveTo(-0.48, 0);
  doorShape.lineTo(-0.48, 1.06);
  doorShape.quadraticCurveTo(-0.48, 1.57, 0, 1.68);
  doorShape.quadraticCurveTo(0.48, 1.57, 0.48, 1.06);
  doorShape.lineTo(0.48, 0);
  doorShape.closePath();

  const door = new THREE.Mesh(new THREE.ShapeGeometry(doorShape, 24), brownMat);
  door.position.set(0, 0.14, 1.493);
  door.castShadow = true;
  cottage.add(door);

  const doorInset = new THREE.Mesh(
    new THREE.ShapeGeometry(doorShape, 24),
    new THREE.MeshToonMaterial({ color: 0x9f6237 })
  );
  doorInset.scale.set(0.86, 0.91, 1);
  doorInset.position.set(0, 0.17, 1.507);
  cottage.add(doorInset);

  const postGeometry = new THREE.BoxGeometry(0.13, 1.13, 0.13);
  const leftPost = new THREE.Mesh(postGeometry, brownDarkMat);
  leftPost.position.set(-0.51, 0.70, 1.51);
  leftPost.castShadow = true;
  cottage.add(leftPost);

  const rightPost = leftPost.clone();
  rightPost.position.x = 0.51;
  cottage.add(rightPost);

  const archFrame = new THREE.Mesh(
    new THREE.TorusGeometry(0.51, 0.07, 12, 36, Math.PI),
    brownDarkMat
  );
  archFrame.position.set(0, 1.22, 1.51);
  archFrame.castShadow = true;
  cottage.add(archFrame);

  const doorPlanks = new THREE.Group();
  for (const x of [-0.24, 0, 0.24]) {
    const plankLine = new THREE.Mesh(
      new THREE.BoxGeometry(0.025, 1.28, 0.025),
      brownDarkMat
    );
    plankLine.position.set(x, 0.73, 1.526);
    doorPlanks.add(plankLine);
  }
  cottage.add(doorPlanks);

  const handle = new THREE.Mesh(
    new THREE.SphereGeometry(0.075, 20, 12),
    goldMat
  );
  handle.position.set(0.28, 0.77, 1.565);
  handle.castShadow = true;
  cottage.add(handle);

  const threshold = new THREE.Mesh(
    new THREE.BoxGeometry(1.22, 0.16, 0.40),
    creamShadowMat
  );
  threshold.position.set(0, 0.10, 1.53);
  threshold.rotation.x = -0.08;
  threshold.castShadow = true;
  threshold.receiveShadow = true;
  cottage.add(threshold);

  function addWindow(x, y, radius) {
    const surfaceZ = Math.sqrt(Math.max(0.1, 1.42 * 1.42 - x * x));
    const windowGroup = new THREE.Group();
    windowGroup.position.set(x, y, surfaceZ + 0.055);

    const glass = new THREE.Mesh(
      new THREE.CircleGeometry(radius * 0.78, 36),
      blueGlassMat
    );
    glass.castShadow = true;
    windowGroup.add(glass);

    const frame = new THREE.Mesh(
      new THREE.TorusGeometry(radius, 0.085, 12, 36),
      brownDarkMat
    );
    frame.castShadow = true;
    windowGroup.add(frame);

    const verticalBar = new THREE.Mesh(
      new THREE.BoxGeometry(0.055, radius * 1.48, 0.06),
      creamLightMat
    );
    verticalBar.position.z = 0.035;
    windowGroup.add(verticalBar);

    const horizontalBar = new THREE.Mesh(
      new THREE.BoxGeometry(radius * 1.48, 0.055, 0.06),
      creamLightMat
    );
    horizontalBar.position.z = 0.035;
    windowGroup.add(horizontalBar);

    windowGroup.rotation.y = x > 0 ? -0.15 : 0.15;
    cottage.add(windowGroup);
  }

  addWindow(-0.89, 2.03, 0.31);
  addWindow(0.89, 2.03, 0.31);

  const grassBladeGeometry = new THREE.ConeGeometry(0.065, 0.42, 6);
  const grassTufts = [
    [-2.15, 0.19, 1.15],
    [2.05, 0.19, 1.30],
    [-2.45, 0.19, -0.35],
    [2.52, 0.19, -0.28],
    [-1.35, 0.19, -2.14],
    [1.45, 0.19, -2.04]
  ];

  for (const [x, y, z] of grassTufts) {
    const tuft = new THREE.Group();
    tuft.position.set(x, y, z);

    for (let i = -1; i <= 1; i++) {
      const blade = new THREE.Mesh(grassBladeGeometry, grassDarkMat);
      blade.position.x = i * 0.10;
      blade.rotation.z = i * -0.25;
      blade.castShadow = true;
      tuft.add(blade);
    }
    cottage.add(tuft);
  }

  const pebbleGeometry = new THREE.IcosahedronGeometry(0.16, 1);
  const pebbleMat = toon(0x8f8874);
  const pebbles = [
    [-1.05, 0.13, 2.08, 1.2],
    [-1.42, 0.12, 1.86, 0.8],
    [1.42, 0.12, 1.93, 0.95]
  ];

  for (const [x, y, z, scale] of pebbles) {
    const pebble = new THREE.Mesh(pebbleGeometry, pebbleMat);
    pebble.position.set(x, y, z);
    pebble.scale.set(scale, scale * 0.65, scale);
    pebble.rotation.set(0.2, x, -0.1);
    pebble.castShadow = true;
    pebble.receiveShadow = true;
    cottage.add(pebble);
  }

  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 60),
    new THREE.MeshToonMaterial({ color: 0xb4d594 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.39;
  ground.receiveShadow = true;
  scene.add(ground);

  const shadowBlob = new THREE.Mesh(
    new THREE.CircleGeometry(4.5, 64),
    new THREE.MeshBasicMaterial({
      color: 0x4d7651,
      transparent: true,
      opacity: 0.17,
      depthWrite: false
    })
  );
  shadowBlob.rotation.x = -Math.PI / 2;
  shadowBlob.position.y = -0.375;
  scene.add(shadowBlob);

  function resize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
  }

  window.addEventListener('resize', resize);

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
