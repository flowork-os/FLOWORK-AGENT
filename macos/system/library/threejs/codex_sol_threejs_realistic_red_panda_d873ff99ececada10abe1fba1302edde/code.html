<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Red Panda</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171614}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x181714);
scene.fog = new THREE.FogExp2(0x181714, 0.055);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.2, 3.8, 8.8);
camera.lookAt(0, 1.45, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.35, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 6;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI * 0.53;

scene.add(new THREE.HemisphereLight(0xdce8ed, 0x3b2418, 1.55));

const key = new THREE.DirectionalLight(0xffe0bf, 4.1);
key.position.set(-4.5, 7.5, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -2;
key.shadow.camera.near = 1;
key.shadow.camera.far = 18;
key.shadow.bias = -0.00025;
scene.add(key);

const rim = new THREE.DirectionalLight(0x8bb9d5, 2.6);
rim.position.set(5, 4.5, -5);
scene.add(rim);

const warmFill = new THREE.PointLight(0xff7b43, 18, 9, 2);
warmFill.position.set(-3.5, 2.1, 2.5);
scene.add(warmFill);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(5.8, 96),
  new THREE.MeshStandardMaterial({ color: 0x26221d, roughness: 0.96, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.045;
ground.receiveShadow = true;
scene.add(ground);

const panda = new THREE.Group();
panda.rotation.y = -0.08;
scene.add(panda);

const C = {
  rust: 0xa8401f,
  rustDark: 0x672214,
  rustLight: 0xc65a2c,
  cream: 0xe7d6bb,
  creamWarm: 0xcdb893,
  black: 0x171511,
  charcoal: 0x29231f,
  eye: 0x090806,
  iris: 0x4a2c17,
  pink: 0x9f6259
};

function mat(color, roughness = 0.9, extra = {}) {
  return new THREE.MeshPhysicalMaterial({
    color,
    roughness,
    metalness: 0,
    ...extra
  });
}

const rustMat = mat(C.rust, 0.94);
const darkRustMat = mat(C.rustDark, 0.97);
const creamMat = mat(C.cream, 0.96);
const warmCreamMat = mat(C.creamWarm, 0.97);
const blackFurMat = mat(C.black, 0.98);
const charcoalMat = mat(C.charcoal, 0.96);

function ellipsoid(name, position, scale, material, parent = panda, segments = 48) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(1, segments, Math.max(20, segments / 2)),
    material
  );
  mesh.name = name;
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

const body = ellipsoid(
  'rounded rust body',
  new THREE.Vector3(0, 1.2, -0.05),
  new THREE.Vector3(1.5, 1.48, 1.17),
  rustMat
);
body.rotation.x = -0.08;

const chest = ellipsoid(
  'cream chest bib',
  new THREE.Vector3(0, 1.24, 1.005),
  new THREE.Vector3(0.82, 1.12, 0.19),
  creamMat
);
chest.rotation.x = -0.08;

const head = ellipsoid(
  'head',
  new THREE.Vector3(0, 2.55, 0.34),
  new THREE.Vector3(1.13, 0.92, 0.91),
  rustMat
);
head.rotation.x = -0.07;

function ear(x) {
  const outer = ellipsoid(
    'rounded ear',
    new THREE.Vector3(x, 3.22, 0.18),
    new THREE.Vector3(0.43, 0.5, 0.23),
    darkRustMat
  );
  outer.rotation.z = -Math.sign(x) * 0.2;
  const inner = ellipsoid(
    'warm inner ear',
    new THREE.Vector3(x * 1.015, 3.225, 0.385),
    new THREE.Vector3(0.275, 0.325, 0.055),
    mat(C.pink, 0.84, {
      sheen: 0.7,
      sheenColor: new THREE.Color(0xff9e86),
      sheenRoughness: 0.75
    })
  );
  inner.rotation.z = outer.rotation.z;
}
ear(-0.78);
ear(0.78);

const cheekL = ellipsoid('left white cheek', new THREE.Vector3(-0.62, 2.47, 1.075), new THREE.Vector3(0.52, 0.48, 0.12), creamMat);
const cheekR = ellipsoid('right white cheek', new THREE.Vector3(0.62, 2.47, 1.075), new THREE.Vector3(0.52, 0.48, 0.12), creamMat);
cheekL.rotation.z = -0.16;
cheekR.rotation.z = 0.16;

const browL = ellipsoid('left cream brow', new THREE.Vector3(-0.48, 2.84, 1.02), new THREE.Vector3(0.31, 0.45, 0.09), creamMat);
const browR = ellipsoid('right cream brow', new THREE.Vector3(0.48, 2.84, 1.02), new THREE.Vector3(0.31, 0.45, 0.09), creamMat);
browL.rotation.z = -0.36;
browR.rotation.z = 0.36;

const muzzleL = ellipsoid('left muzzle', new THREE.Vector3(-0.25, 2.29, 1.195), new THREE.Vector3(0.39, 0.31, 0.18), warmCreamMat);
const muzzleR = ellipsoid('right muzzle', new THREE.Vector3(0.25, 2.29, 1.195), new THREE.Vector3(0.39, 0.31, 0.18), warmCreamMat);

function eye(x) {
  const surround = ellipsoid(
    'dark eye marking',
    new THREE.Vector3(x, 2.68, 1.105),
    new THREE.Vector3(0.28, 0.32, 0.105),
    charcoalMat
  );
  surround.rotation.z = Math.sign(x) * 0.18;

  const globe = ellipsoid(
    'inquisitive eye',
    new THREE.Vector3(x, 2.69, 1.195),
    new THREE.Vector3(0.135, 0.148, 0.075),
    mat(C.eye, 0.13, { clearcoat: 1, clearcoatRoughness: 0.08 })
  );
  const iris = ellipsoid(
    'warm iris',
    new THREE.Vector3(x * 0.99, 2.69, 1.258),
    new THREE.Vector3(0.066, 0.078, 0.018),
    mat(C.iris, 0.2, { clearcoat: 1 })
  );
  const pupil = ellipsoid(
    'pupil',
    new THREE.Vector3(x * 0.99, 2.69, 1.275),
    new THREE.Vector3(0.025, 0.061, 0.009),
    mat(0x000000, 0.1)
  );
  const glint = ellipsoid(
    'eye catchlight',
    new THREE.Vector3(x - 0.038, 2.743, 1.289),
    new THREE.Vector3(0.025, 0.025, 0.008),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  return { globe, iris, pupil, glint };
}
eye(-0.43);
eye(0.43);

const nose = ellipsoid(
  'soft nose leather',
  new THREE.Vector3(0, 2.27, 1.405),
  new THREE.Vector3(0.205, 0.145, 0.13),
  mat(0x211512, 0.42, {
    clearcoat: 0.25,
    sheen: 0.75,
    sheenColor: new THREE.Color(0xd47d68),
    sheenRoughness: 0.6
  })
);
nose.rotation.x = 0.08;

const mouthMat = new THREE.MeshBasicMaterial({ color: 0x21110e });
const mouthCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.19, 2.17, 1.335),
  new THREE.Vector3(-0.08, 2.12, 1.37),
  new THREE.Vector3(0, 2.16, 1.38),
  new THREE.Vector3(0.08, 2.12, 1.37),
  new THREE.Vector3(0.19, 2.17, 1.335)
]);
const mouth = new THREE.Mesh(new THREE.TubeGeometry(mouthCurve, 28, 0.012, 7, false), mouthMat);
panda.add(mouth);

function paw(x, z, rotZ) {
  const upper = ellipsoid(
    'folded dark foreleg',
    new THREE.Vector3(x, 0.78, 0.98),
    new THREE.Vector3(0.31, 0.7, 0.29),
    blackFurMat
  );
  upper.rotation.z = rotZ;
  upper.rotation.x = -0.28;
  const foot = ellipsoid(
    'tiny black paw',
    new THREE.Vector3(x * 1.08, 0.32, 1.28),
    new THREE.Vector3(0.42, 0.23, 0.46),
    blackFurMat
  );
  foot.rotation.y = -x * 0.16;
}
paw(-0.53, 1.15, -0.24);
paw(0.53, 1.15, 0.24);

const tail = new THREE.Group();
tail.name = 'bushy wrapped ringed tail';
panda.add(tail);

const tailPoints = [
  new THREE.Vector3(1.13, 1.05, -0.35),
  new THREE.Vector3(1.62, 0.72, -0.02),
  new THREE.Vector3(1.72, 0.37, 0.55),
  new THREE.Vector3(1.35, 0.23, 1.12),
  new THREE.Vector3(0.76, 0.22, 1.46),
  new THREE.Vector3(0.11, 0.22, 1.55),
  new THREE.Vector3(-0.48, 0.24, 1.43),
  new THREE.Vector3(-0.86, 0.28, 1.14)
];

const tailNodes = [];
for (let i = 0; i < tailPoints.length; i++) {
  const t = i / (tailPoints.length - 1);
  const radius = THREE.MathUtils.lerp(0.49, 0.29, t);
  const colors = [C.rustDark, C.rustLight, C.creamWarm, C.rustDark, C.rustLight, C.creamWarm, C.rustDark, C.rustLight];
  const node = ellipsoid(
    'tail ring',
    tailPoints[i],
    new THREE.Vector3(radius * 1.18, radius * 0.84, radius),
    mat(colors[i], 0.98),
    tail,
    40
  );
  if (i < tailPoints.length - 1) {
    const d = tailPoints[i + 1].clone().sub(tailPoints[i]);
    node.rotation.y = Math.atan2(d.x, d.z);
  }
  tailNodes.push({ mesh: node, color: colors[i] });
}

let seed = 917231;
function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}

const yAxis = new THREE.Vector3(0, 1, 0);
const dummy = new THREE.Object3D();
const normal = new THREE.Vector3();
const point = new THREE.Vector3();
const worldPoint = new THREE.Vector3();
const worldNormal = new THREE.Vector3();
const tint = new THREE.Color();

function addFurShell(mesh, count, color, length = 0.095, radius = 0.018, coverage = null) {
  mesh.updateMatrixWorld(true);
  const geom = new THREE.ConeGeometry(radius, 1, 5, 1, false);
  geom.translate(0, 0.5, 0);
  const material = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.98,
    metalness: 0,
    vertexColors: true
  });
  const strands = new THREE.InstancedMesh(geom, count, material);
  strands.name = 'individual fur strands';
  strands.castShadow = true;
  strands.receiveShadow = true;
  strands.frustumCulled = false;

  let written = 0;
  let attempts = 0;
  while (written < count && attempts < count * 12) {
    attempts++;
    const y = rand() * 2 - 1;
    const phi = rand() * Math.PI * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    point.set(r * Math.cos(phi), y, r * Math.sin(phi));
    if (coverage && !coverage(point)) continue;

    normal.set(
      point.x / Math.max(mesh.scale.x, 0.001),
      point.y / Math.max(mesh.scale.y, 0.001),
      point.z / Math.max(mesh.scale.z, 0.001)
    ).normalize();

    worldPoint.copy(point).applyMatrix4(mesh.matrixWorld);
    worldNormal.copy(normal).transformDirection(mesh.matrixWorld).normalize();

    const hairLength = length * (0.72 + rand() * 0.55);
    dummy.position.copy(worldPoint).addScaledVector(worldNormal, 0.005);
    dummy.quaternion.setFromUnitVectors(yAxis, worldNormal);
    dummy.scale.set(0.72 + rand() * 0.55, hairLength, 0.72 + rand() * 0.55);
    dummy.rotateY(rand() * Math.PI);
    dummy.updateMatrix();
    strands.setMatrixAt(written, dummy.matrix);

    tint.set(color);
    const variation = 0.79 + rand() * 0.34;
    tint.multiplyScalar(variation);
    strands.setColorAt(written, tint);
    written++;
  }
  strands.count = written;
  strands.instanceMatrix.needsUpdate = true;
  if (strands.instanceColor) strands.instanceColor.needsUpdate = true;
  scene.add(strands);
  return strands;
}

scene.updateMatrixWorld(true);
addFurShell(body, 3900, C.rust, 0.115, 0.021);
addFurShell(head, 2800, C.rustLight, 0.092, 0.017);
addFurShell(chest, 1150, C.cream, 0.105, 0.018, p => p.z > -0.35);
addFurShell(cheekL, 420, C.cream, 0.07, 0.014, p => p.z > -0.15);
addFurShell(cheekR, 420, C.cream, 0.07, 0.014, p => p.z > -0.15);
addFurShell(browL, 280, C.cream, 0.065, 0.013, p => p.z > -0.2);
addFurShell(browR, 280, C.cream, 0.065, 0.013, p => p.z > -0.2);

for (const node of tailNodes) {
  addFurShell(node.mesh, 520, node.color, 0.15, 0.023);
}

const whiskerMaterial = new THREE.LineBasicMaterial({
  color: 0xd9d0bf,
  transparent: true,
  opacity: 0.55
});

function whisker(side, y, sweep) {
  const start = new THREE.Vector3(side * 0.23, y, 1.38);
  const middle = new THREE.Vector3(side * 0.64, y + sweep * 0.05, 1.47);
  const end = new THREE.Vector3(side * 1.12, y + sweep * 0.12, 1.38);
  const curve = new THREE.QuadraticBezierCurve3(start, middle, end);
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(curve.getPoints(18)),
    whiskerMaterial
  );
  panda.add(line);
}
for (let i = 0; i < 5; i++) {
  whisker(-1, 2.25 - i * 0.045, i - 2);
  whisker(1, 2.25 - i * 0.045, i - 2);
}

const backdropGlow = new THREE.Mesh(
  new THREE.CircleGeometry(3.3, 64),
  new THREE.MeshBasicMaterial({
    color: 0x3a2c22,
    transparent: true,
    opacity: 0.22,
    depthWrite: false
  })
);
backdropGlow.position.set(0, 1.65, -2.15);
scene.add(backdropGlow);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  panda.position.y = Math.sin(elapsed * 1.15) * 0.008;
  panda.rotation.z = Math.sin(elapsed * 0.55) * 0.006;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
