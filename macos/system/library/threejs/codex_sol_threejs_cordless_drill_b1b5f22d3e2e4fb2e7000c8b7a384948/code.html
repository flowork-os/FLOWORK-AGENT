<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Cordless Drill</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #17191c;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(255,255,255,.65);
      font: 12px/1.4 system-ui, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Cordless Drill · Drag to inspect</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x17191c);
    scene.fog = new THREE.Fog(0x17191c, 18, 30);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(9.5, 6.6, 10.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.3, 2.25, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.minDistance = 7;
    controls.maxDistance = 19;
    controls.maxPolarAngle = Math.PI * 0.49;

    const hemi = new THREE.HemisphereLight(0xdbe9ff, 0x252017, 2.1);
    scene.add(hemi);

    const keyLight = new THREE.DirectionalLight(0xffffff, 4.4);
    keyLight.position.set(5, 10, 7);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -8;
    keyLight.shadow.camera.right = 8;
    keyLight.shadow.camera.top = 9;
    keyLight.shadow.camera.bottom = -4;
    keyLight.shadow.bias = -0.00015;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x7dafff, 2.2);
    rimLight.position.set(-8, 5, -7);
    scene.add(rimLight);

    const warmLight = new THREE.PointLight(0xffb45d, 22, 14, 2);
    warmLight.position.set(5, 3, -4);
    scene.add(warmLight);

    const yellow = new THREE.MeshStandardMaterial({
      color: 0xe9a900,
      roughness: 0.42,
      metalness: 0.04
    });
    const yellowSide = new THREE.MeshStandardMaterial({
      color: 0xb97800,
      roughness: 0.53,
      metalness: 0.03
    });
    const yellowDark = new THREE.MeshStandardMaterial({
      color: 0x9d6300,
      roughness: 0.62
    });
    const rubber = new THREE.MeshStandardMaterial({
      color: 0x15181a,
      roughness: 0.88,
      metalness: 0.01
    });
    const rubberSoft = new THREE.MeshStandardMaterial({
      color: 0x24282b,
      roughness: 0.92
    });
    const blackPlastic = new THREE.MeshStandardMaterial({
      color: 0x090b0c,
      roughness: 0.58
    });
    const darkMetal = new THREE.MeshStandardMaterial({
      color: 0x25292b,
      roughness: 0.31,
      metalness: 0.78
    });
    const steel = new THREE.MeshStandardMaterial({
      color: 0xaeb5b7,
      roughness: 0.2,
      metalness: 0.92
    });
    const brushedSteel = new THREE.MeshStandardMaterial({
      color: 0x737b7e,
      roughness: 0.38,
      metalness: 0.84
    });
    const red = new THREE.MeshStandardMaterial({
      color: 0xa82016,
      roughness: 0.45
    });
    const translucent = new THREE.MeshStandardMaterial({
      color: 0xd8f3ff,
      emissive: 0x8ec9e8,
      emissiveIntensity: 0.55,
      roughness: 0.15,
      transparent: true,
      opacity: 0.88
    });

    const drill = new THREE.Group();
    drill.rotation.y = -0.08;
    scene.add(drill);

    function finish(mesh) {
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function rounded(w, h, d, radius, segments, material) {
      return finish(new THREE.Mesh(
        new RoundedBoxGeometry(w, h, d, segments, radius),
        material
      ));
    }

    function cylinderX(radiusTop, radiusBottom, length, segments, material) {
      const mesh = finish(new THREE.Mesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, length, segments),
        material
      ));
      mesh.rotation.z = Math.PI / 2;
      return mesh;
    }

    function extrudedShape(shape, depth, bevel, materials) {
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth,
        bevelEnabled: true,
        bevelThickness: bevel,
        bevelSize: bevel,
        bevelSegments: 4,
        curveSegments: 16
      });
      geometry.translate(0, 0, -depth / 2);
      geometry.computeVertexNormals();
      return finish(new THREE.Mesh(geometry, materials));
    }

    const bodyShape = new THREE.Shape();
    bodyShape.moveTo(-2.05, 3.12);
    bodyShape.bezierCurveTo(-2.08, 3.54, -1.93, 3.94, -1.55, 4.18);
    bodyShape.bezierCurveTo(-1.14, 4.43, -0.35, 4.49, 0.48, 4.39);
    bodyShape.bezierCurveTo(1.15, 4.31, 1.78, 4.09, 2.12, 3.78);
    bodyShape.lineTo(2.18, 3.18);
    bodyShape.bezierCurveTo(1.79, 2.96, 1.18, 2.83, 0.50, 2.82);
    bodyShape.bezierCurveTo(-0.11, 2.82, -0.53, 2.68, -0.93, 2.57);
    bodyShape.lineTo(-1.65, 2.69);
    bodyShape.bezierCurveTo(-1.91, 2.77, -2.04, 2.92, -2.05, 3.12);

    const body = extrudedShape(bodyShape, 1.55, 0.09, [yellow, yellowSide]);
    drill.add(body);

    const rearCap = rounded(0.43, 1.18, 1.42, 0.17, 5, rubber);
    rearCap.position.set(-2.0, 3.49, 0);
    rearCap.rotation.z = -0.04;
    drill.add(rearCap);

    const rearInset = rounded(0.13, 0.65, 0.95, 0.06, 3, blackPlastic);
    rearInset.position.set(-2.225, 3.53, 0);
    drill.add(rearInset);

    for (let i = 0; i < 5; i++) {
      const vent = rounded(0.08, 0.47, 0.055, 0.025, 2, blackPlastic);
      vent.position.set(-1.63 + i * 0.16, 3.71 + i * 0.018, 0.835);
      vent.rotation.z = -0.24;
      drill.add(vent);
    }

    const sidePanel = rounded(1.85, 0.5, 0.055, 0.18, 5, yellowDark);
    sidePanel.position.set(0.13, 3.83, 0.835);
    sidePanel.rotation.z = -0.035;
    drill.add(sidePanel);

    const badge = rounded(1.18, 0.23, 0.035, 0.09, 4, rubber);
    badge.position.set(0.12, 3.87, 0.87);
    drill.add(badge);

    for (let i = 0; i < 3; i++) {
      const stripe = rounded(0.22, 0.055, 0.02, 0.018, 2, yellow);
      stripe.position.set(-0.31 + i * 0.27, 3.87, 0.897);
      drill.add(stripe);
    }

    const gearbox = cylinderX(0.55, 0.61, 0.78, 48, yellowSide);
    gearbox.position.set(2.28, 3.48, 0);
    drill.add(gearbox);

    const gearboxRing = cylinderX(0.585, 0.585, 0.12, 48, blackPlastic);
    gearboxRing.position.set(2.64, 3.48, 0);
    drill.add(gearboxRing);

    const torqueRing = cylinderX(0.58, 0.58, 0.48, 48, rubberSoft);
    torqueRing.position.set(2.9, 3.48, 0);
    drill.add(torqueRing);

    for (let i = 0; i < 16; i++) {
      const angle = i * Math.PI * 2 / 16;
      const rib = rounded(0.42, 0.075, 0.09, 0.025, 2, blackPlastic);
      rib.position.set(
        2.91,
        3.48 + Math.cos(angle) * 0.565,
        Math.sin(angle) * 0.565
      );
      rib.rotation.x = angle;
      drill.add(rib);
    }

    const chuckRear = cylinderX(0.505, 0.55, 0.56, 48, darkMetal);
    chuckRear.position.set(3.42, 3.48, 0);
    drill.add(chuckRear);

    const chuckFront = cylinderX(0.37, 0.505, 0.62, 48, darkMetal);
    chuckFront.position.set(4.0, 3.48, 0);
    drill.add(chuckFront);

    for (let i = 0; i < 18; i++) {
      const angle = i * Math.PI * 2 / 18;
      const rib = rounded(0.48, 0.052, 0.075, 0.018, 2, blackPlastic);
      rib.position.set(
        3.67,
        3.48 + Math.cos(angle) * 0.485,
        Math.sin(angle) * 0.485
      );
      rib.rotation.x = angle;
      rib.rotation.z = -0.05;
      drill.add(rib);
    }

    const noseRing = cylinderX(0.325, 0.37, 0.14, 40, blackPlastic);
    noseRing.position.set(4.34, 3.48, 0);
    drill.add(noseRing);

    for (let i = 0; i < 3; i++) {
      const angle = i * Math.PI * 2 / 3;
      const jaw = rounded(0.42, 0.105, 0.13, 0.022, 2, brushedSteel);
      jaw.position.set(
        4.49,
        3.48 + Math.cos(angle) * 0.16,
        Math.sin(angle) * 0.16
      );
      jaw.rotation.x = angle;
      jaw.rotation.z = -0.08;
      drill.add(jaw);
    }

    const bit = cylinderX(0.055, 0.055, 1.6, 16, steel);
    bit.position.set(5.38, 3.48, 0);
    drill.add(bit);

    const bitTip = cylinderX(0, 0.07, 0.24, 16, steel);
    bitTip.position.set(6.30, 3.48, 0);
    drill.add(bitTip);

    const selectorBase = rounded(0.69, 0.21, 0.72, 0.08, 4, blackPlastic);
    selectorBase.position.set(0.74, 4.42, 0);
    drill.add(selectorBase);

    const selector = rounded(0.39, 0.18, 0.55, 0.07, 4, yellow);
    selector.position.set(0.64, 4.56, 0);
    selector.rotation.z = -0.05;
    drill.add(selector);

    const handleShape = new THREE.Shape();
    handleShape.moveTo(-0.96, 2.92);
    handleShape.bezierCurveTo(-0.76, 2.72, -0.58, 2.46, -0.55, 2.20);
    handleShape.lineTo(-0.75, 0.93);
    handleShape.bezierCurveTo(-0.79, 0.72, -0.65, 0.61, -0.43, 0.61);
    handleShape.lineTo(0.35, 0.61);
    handleShape.bezierCurveTo(0.55, 0.62, 0.65, 0.76, 0.60, 0.96);
    handleShape.lineTo(0.25, 2.47);
    handleShape.bezierCurveTo(0.18, 2.73, 0.02, 2.89, -0.18, 3.00);
    handleShape.closePath();

    const grip = extrudedShape(handleShape, 1.18, 0.08, [rubberSoft, rubber]);
    drill.add(grip);

    const gripSpine = rounded(0.32, 1.72, 1.23, 0.13, 5, yellow);
    gripSpine.position.set(-0.63, 1.67, 0);
    gripSpine.rotation.z = -0.145;
    drill.add(gripSpine);

    const palmPad = rounded(0.34, 1.43, 1.25, 0.14, 5, rubber);
    palmPad.position.set(0.20, 1.55, 0);
    palmPad.rotation.z = 0.15;
    drill.add(palmPad);

    for (const side of [-1, 1]) {
      for (let row = 0; row < 7; row++) {
        for (let col = 0; col < 3; col++) {
          const bump = rounded(0.22, 0.055, 0.026, 0.018, 2, blackPlastic);
          bump.position.set(
            -0.25 + col * 0.22 + row * 0.018,
            1.05 + row * 0.19,
            side * 0.635
          );
          bump.rotation.z = -0.12;
          drill.add(bump);
        }
      }
    }

    const trigger = rounded(0.33, 0.59, 0.76, 0.11, 5, blackPlastic);
    trigger.position.set(0.46, 2.62, 0);
    trigger.rotation.z = -0.2;
    drill.add(trigger);

    const triggerFace = rounded(0.08, 0.39, 0.62, 0.035, 3, rubberSoft);
    triggerFace.position.set(0.62, 2.61, 0);
    triggerFace.rotation.z = -0.2;
    drill.add(triggerFace);

    const directionSwitch = rounded(0.56, 0.18, 1.45, 0.07, 4, blackPlastic);
    directionSwitch.position.set(0.12, 3.03, 0);
    drill.add(directionSwitch);

    const switchAccentA = rounded(0.08, 0.13, 0.09, 0.025, 2, red);
    switchAccentA.position.set(0.12, 3.04, 0.77);
    drill.add(switchAccentA);

    const switchAccentB = switchAccentA.clone();
    switchAccentB.position.z = -0.77;
    drill.add(switchAccentB);

    const batteryTop = rounded(1.58, 0.34, 1.43, 0.1, 5, yellow);
    batteryTop.position.set(-0.08, 0.72, 0);
    drill.add(batteryTop);

    const battery = rounded(2.25, 0.72, 1.83, 0.18, 7, rubber);
    battery.position.set(-0.22, 0.39, 0);
    drill.add(battery);

    const batteryLower = rounded(2.15, 0.25, 1.75, 0.11, 5, blackPlastic);
    batteryLower.position.set(-0.22, 0.11, 0);
    drill.add(batteryLower);

    const batteryHeel = rounded(0.48, 0.5, 1.7, 0.13, 5, yellowDark);
    batteryHeel.position.set(-1.22, 0.43, 0);
    drill.add(batteryHeel);

    const release = rounded(0.47, 0.23, 1.53, 0.08, 4, blackPlastic);
    release.position.set(0.72, 0.70, 0);
    drill.add(release);

    const meterPanel = rounded(0.74, 0.26, 0.045, 0.07, 4, blackPlastic);
    meterPanel.position.set(0.16, 0.39, 0.94);
    drill.add(meterPanel);

    for (let i = 0; i < 3; i++) {
      const ledMaterial = new THREE.MeshStandardMaterial({
        color: i < 2 ? 0x79d244 : 0x273426,
        emissive: i < 2 ? 0x4baa28 : 0x000000,
        emissiveIntensity: i < 2 ? 1.4 : 0,
        roughness: 0.35
      });
      const led = rounded(0.13, 0.075, 0.025, 0.02, 2, ledMaterial);
      led.position.set(-0.07 + i * 0.22, 0.40, 0.973);
      drill.add(led);
    }

    const workLightHousing = rounded(0.38, 0.25, 0.73, 0.09, 5, blackPlastic);
    workLightHousing.position.set(0.64, 2.18, 0);
    workLightHousing.rotation.z = -0.17;
    drill.add(workLightHousing);

    const workLens = rounded(0.08, 0.16, 0.48, 0.045, 4, translucent);
    workLens.position.set(0.83, 2.17, 0);
    workLens.rotation.z = -0.17;
    drill.add(workLens);

    const screwLocations = [
      [-1.49, 4.02],
      [1.48, 3.72],
      [1.53, 3.13],
      [-1.61, 2.99],
      [-0.33, 2.88]
    ];

    for (const [x, y] of screwLocations) {
      const recess = new THREE.Mesh(
        new THREE.TorusGeometry(0.10, 0.028, 10, 24),
        blackPlastic
      );
      recess.position.set(x, y, 0.842);
      drill.add(finish(recess));

      const head = new THREE.Mesh(
        new THREE.CylinderGeometry(0.072, 0.072, 0.035, 24),
        darkMetal
      );
      head.rotation.x = Math.PI / 2;
      head.position.set(x, y, 0.865);
      drill.add(finish(head));

      const slot = rounded(0.09, 0.018, 0.013, 0.005, 1, steel);
      slot.position.set(x, y, 0.889);
      slot.rotation.z = Math.PI / 4;
      drill.add(slot);
    }

    const seam = new THREE.Mesh(
      new THREE.TorusGeometry(0.018, 0.006, 6, 20),
      blackPlastic
    );
    seam.scale.set(120, 1, 1);
    seam.position.set(0.05, 3.02, 0.827);
    seam.visible = false;
    drill.add(seam);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({
        color: 0x242628,
        roughness: 0.92,
        metalness: 0.03
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.035;
    floor.receiveShadow = true;
    scene.add(floor);

    const shadowDisc = new THREE.Mesh(
      new THREE.CircleGeometry(4.8, 64),
      new THREE.MeshBasicMaterial({
        color: 0x0c0d0e,
        transparent: true,
        opacity: 0.28,
        depthWrite: false
      })
    );
    shadowDisc.rotation.x = -Math.PI / 2;
    shadowDisc.scale.set(1.55, 0.72, 1);
    shadowDisc.position.set(0, -0.025, 0);
    scene.add(shadowDisc);

    const backdrop = new THREE.Mesh(
      new THREE.PlaneGeometry(28, 14),
      new THREE.MeshBasicMaterial({ color: 0x1c1f23 })
    );
    backdrop.position.set(0, 6, -10);
    scene.add(backdrop);

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
