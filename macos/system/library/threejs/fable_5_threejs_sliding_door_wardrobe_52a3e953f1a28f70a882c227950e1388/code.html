<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sliding Door Wardrobe</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1e22; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x22252a);
scene.fog = new THREE.Fog(0x22252a, 9, 18);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.4, 2.1, 4.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.15, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 2.5;
controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI * 0.52;

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x2a2622, 0.55));

const key = new THREE.DirectionalLight(0xfff2e0, 2.2);
key.position.set(4, 6, 3.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -3; key.shadow.camera.right = 3;
key.shadow.camera.top = 4;   key.shadow.camera.bottom = -1;
key.shadow.camera.near = 1;  key.shadow.camera.far = 15;
key.shadow.bias = -0.0004;
key.shadow.radius = 6;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbfd4ff, 0.5);
fill.position.set(-4, 3, 2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 0.4);
rim.position.set(-1, 4, -5);
scene.add(rim);

// ---------- Ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(8, 64),
  new THREE.MeshStandardMaterial({ color: 0x2c2f34, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// soft contact shadow disc
const shadowTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 10, 128, 128, 128);
  grad.addColorStop(0, 'rgba(0,0,0,0.42)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const contact = new THREE.Mesh(
  new THREE.PlaneGeometry(3.2, 1.6),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
);
contact.rotation.x = -Math.PI / 2;
contact.position.y = 0.002;
scene.add(contact);

// ---------- Materials ----------
const woodMat  = new THREE.MeshStandardMaterial({ color: 0x8a6242, roughness: 0.62, metalness: 0.05 }); // cabinet body (walnut)
const innerMat = new THREE.MeshStandardMaterial({ color: 0x5c4632, roughness: 0.85, metalness: 0.02 }); // interior
const doorMatA = new THREE.MeshStandardMaterial({ color: 0xece7de, roughness: 0.38, metalness: 0.04 }); // matte cream door
const doorMatB = new THREE.MeshStandardMaterial({ color: 0x4d5560, roughness: 0.34, metalness: 0.1  }); // slate door
const trackMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2e, roughness: 0.5,  metalness: 0.6  }); // dark alu tracks
const handleMat= new THREE.MeshStandardMaterial({ color: 0xcfd2d6, roughness: 0.25, metalness: 0.9  }); // brushed metal

// ---------- Wardrobe ----------
// Practical proportions: 2.0m wide, 2.3m tall, 0.62m deep, 18mm panels
const W = 2.0, H = 2.3, D = 0.62, T = 0.018;
const plinthH = 0.06;
const trackH = 0.05, trackD = 0.09;      // recessed track cavity height/depth
const doorT = 0.03, doorGap = 0.012;     // door thickness, track-to-door clearance
const wardrobe = new THREE.Group();

function box(w, h, d, mat, x, y, z, parent = wardrobe) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}

// Plinth
box(W - 0.04, plinthH, D - 0.05, innerMat, 0, plinthH / 2, -0.01);

const bodyY0 = plinthH;                  // bottom of carcass
const bodyH = H - plinthH;               // carcass height

// Carcass: sides, top, bottom, back
box(T, bodyH, D, woodMat, -(W - T) / 2, bodyY0 + bodyH / 2, 0);   // left side
box(T, bodyH, D, woodMat,  (W - T) / 2, bodyY0 + bodyH / 2, 0);   // right side
box(W, T, D, woodMat, 0, H - T / 2, 0);                            // top
box(W - 2 * T, T, D - trackD, woodMat, 0, bodyY0 + T / 2, -trackD / 2); // bottom (set back for track recess)
box(W - 2 * T, bodyH, T, innerMat, 0, bodyY0 + bodyH / 2, -(D - T) / 2); // back panel

// Interior shelf + hanging rail (visible hints through door gap)
box(W - 2 * T, T, D - trackD - 0.06, innerMat, 0, H - 0.45, -trackD / 2 - 0.03);
const rail = new THREE.Mesh(
  new THREE.CylinderGeometry(0.014, 0.014, W - 2 * T - 0.02, 16),
  handleMat
);
rail.rotation.z = Math.PI / 2;
rail.position.set(0, H - 0.58, -0.08);
rail.castShadow = true;
wardrobe.add(rail);

// Recessed tracks (top and bottom), front edge of carcass
const trackZ = D / 2 - trackD / 2;
box(W - 2 * T, trackH, trackD, trackMat, 0, H - T - trackH / 2, trackZ);          // top track block
box(W - 2 * T, trackH, trackD, trackMat, 0, bodyY0 + T + trackH / 2, trackZ);     // bottom track block
// track grooves (thin bright inserts, two channels each)
const grooveMat = new THREE.MeshStandardMaterial({ color: 0x606468, roughness: 0.35, metalness: 0.8 });
for (const yy of [H - T - trackH, bodyY0 + T + trackH]) {
  for (const zz of [trackZ + 0.02, trackZ - 0.015]) {
    box(W - 2 * T - 0.01, 0.006, 0.012, grooveMat, 0, yy + (yy > 1 ? 0.001 : -0.001), zz);
  }
}

// Sliding doors: two overlapping panels on front/rear channels
const doorH = H - 2 * T - 2 * trackH - 2 * doorGap;   // runs between the tracks
const doorW = W / 2 + 0.05;                            // overlap in the middle
const doorY = bodyY0 + T + trackH + doorGap + doorH / 2 + (H - T - trackH - (bodyY0 + T + trackH) - 2 * doorGap - doorH) / 2;
const zFront = trackZ + 0.02;   // front channel
const zRear  = trackZ - 0.015;  // rear channel

function makeDoor(mat, x, z, handleSide) {
  const g = new THREE.Group();
  const panel = box(doorW, doorH, doorT, mat, 0, 0, 0, g);
  // subtle inset frame line
  box(doorW - 0.12, doorH - 0.12, doorT + 0.004, mat.clone(), 0, 0, 0, g)
    .material.color.multiplyScalar(0.93);
  // slim vertical handle bar, full-ish height, at inner edge
  const hx = handleSide * (doorW / 2 - 0.035);
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.022, doorH * 0.72, 0.02), handleMat);
  bar.position.set(hx, 0, doorT / 2 + 0.014);
  bar.castShadow = true;
  g.add(bar);
  for (const s of [-1, 1]) {
    const stub = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.03, 0.016), handleMat);
    stub.position.set(hx, s * doorH * 0.34, doorT / 2 + 0.006);
    g.add(stub);
  }
  g.position.set(x, doorY, z);
  wardrobe.add(g);
  return g;
}
// left door on rear channel (slate), right door on front channel (cream), overlapping at center
makeDoor(doorMatB, -(W / 2 - T) + doorW / 2 - 0.005, zRear, 1);
makeDoor(doorMatA,  (W / 2 - T) - doorW / 2 + 0.005, zFront, -1);

scene.add(wardrobe);

// ---------- Resize / Loop ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
