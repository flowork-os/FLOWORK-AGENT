<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Sky Islands</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: linear-gradient(#79cfff, #eafaff);
      font-family: Georgia, serif;
    }
    canvas { display: block; }
    .title {
      position: fixed;
      left: 28px;
      top: 22px;
      color: rgba(255,255,255,.92);
      text-shadow: 0 2px 10px rgba(42,91,126,.45);
      letter-spacing: .12em;
      pointer-events: none;
      user-select: none;
    }
    .title strong {
      display: block;
      font-size: clamp(18px, 2.2vw, 30px);
      font-weight: 500;
    }
    .title span {
      display: block;
      margin-top: 5px;
      font: 11px system-ui, sans-serif;
      letter-spacing: .22em;
      opacity: .78;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="title">
    <strong>THE WANDERING ISLES</strong>
    <span>A LITTLE WORLD ABOVE THE CLOUDS</span>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const TAU = Math.PI * 2;
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xbce6f2, 0.012);

    const camera = new THREE.PerspectiveCamera(
      44,
      innerWidth / innerHeight,
      0.1,
      500
    );
    camera.position.set(34, 24, 45);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.28;
    controls.minDistance = 24;
    controls.maxDistance = 90;
    controls.maxPolarAngle = Math.PI * 0.62;

    function mulberry32(seed) {
      return function () {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    const random = mulberry32(172904);
    const rand = (a = 0, b = 1) => a + (b - a) * random();
    const pick = array => array[Math.floor(random() * array.length)];

    function canvasTexture(width, height, painter) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d');
      painter(context, width, height);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const grassTexture = canvasTexture(256, 256, (ctx, w, h) => {
      ctx.fillStyle = '#76a849';
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 4500; i++) {
        const light = rand(65, 125);
        ctx.fillStyle = `rgba(${light},${rand(115,175)},${rand(45,80)},${rand(.08,.35)})`;
        const x = rand(0, w);
        const y = rand(0, h);
        ctx.fillRect(x, y, rand(.5, 2.2), rand(.5, 2.2));
      }
      for (let i = 0; i < 80; i++) {
        ctx.fillStyle = pick(['#f4d96b', '#fff4ca', '#d6e9ff', '#f4a0a2']);
        ctx.beginPath();
        ctx.arc(rand(0, w), rand(0, h), rand(.5, 1.3), 0, TAU);
        ctx.fill();
      }
    });
    grassTexture.wrapS = grassTexture.wrapT = THREE.RepeatWrapping;
    grassTexture.repeat.set(3, 3);

    const rockTexture = canvasTexture(256, 256, (ctx, w, h) => {
      ctx.fillStyle = '#776a56';
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 900; i++) {
        const shade = rand(65, 125);
        ctx.strokeStyle = `rgba(${shade},${shade * .92},${shade * .75},${rand(.08,.25)})`;
        ctx.lineWidth = rand(.4, 2.5);
        ctx.beginPath();
        const x = rand(0, w);
        const y = rand(0, h);
        ctx.moveTo(x, y);
        ctx.lineTo(x + rand(-16, 16), y + rand(4, 28));
        ctx.stroke();
      }
    });
    rockTexture.wrapS = rockTexture.wrapT = THREE.RepeatWrapping;
    rockTexture.repeat.set(3, 4);

    const waterTexture = canvasTexture(128, 512, (ctx, w, h) => {
      const gradient = ctx.createLinearGradient(0, 0, w, 0);
      gradient.addColorStop(0, 'rgba(190,241,255,0)');
      gradient.addColorStop(.18, 'rgba(185,239,255,.72)');
      gradient.addColorStop(.5, 'rgba(239,255,255,.92)');
      gradient.addColorStop(.82, 'rgba(164,228,250,.7)');
      gradient.addColorStop(1, 'rgba(175,235,255,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 70; i++) {
        ctx.strokeStyle = `rgba(255,255,255,${rand(.08,.35)})`;
        ctx.lineWidth = rand(.5, 2.4);
        ctx.beginPath();
        const x = rand(8, w - 8);
        const y = rand(0, h);
        ctx.moveTo(x, y);
        ctx.bezierCurveTo(
          x + rand(-10, 10), y + 35,
          x + rand(-8, 8), y + 70,
          x + rand(-12, 12), y + 130
        );
        ctx.stroke();
      }
    });
    waterTexture.wrapS = waterTexture.wrapT = THREE.RepeatWrapping;
    waterTexture.repeat.set(1, 2.5);

    const mistTexture = canvasTexture(128, 128, (ctx, w, h) => {
      const gradient = ctx.createRadialGradient(
        w / 2, h / 2, 2,
        w / 2, h / 2, w / 2
      );
      gradient.addColorStop(0, 'rgba(255,255,255,.92)');
      gradient.addColorStop(.38, 'rgba(245,252,255,.58)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);
    });

    const windowTexture = canvasTexture(64, 64, (ctx, w, h) => {
      ctx.fillStyle = '#18283a';
      ctx.fillRect(0, 0, w, h);
      const gradient = ctx.createRadialGradient(24, 20, 2, 30, 28, 38);
      gradient.addColorStop(0, '#fff6b8');
      gradient.addColorStop(.55, '#f0b85d');
      gradient.addColorStop(1, '#9d5b36');
      ctx.fillStyle = gradient;
      ctx.fillRect(5, 5, w - 10, h - 10);
      ctx.fillStyle = '#563826';
      ctx.fillRect(29, 4, 6, 56);
      ctx.fillRect(4, 29, 56, 6);
    });

    const materials = {
      grass: new THREE.MeshStandardMaterial({
        map: grassTexture,
        color: 0x90bd59,
        roughness: .95
      }),
      grassSide: new THREE.MeshStandardMaterial({
        color: 0x668b3d,
        roughness: 1
      }),
      rock: new THREE.MeshStandardMaterial({
        map: rockTexture,
        color: 0x8d8069,
        roughness: 1,
        flatShading: true
      }),
      darkRock: new THREE.MeshStandardMaterial({
        color: 0x655b50,
        roughness: 1,
        flatShading: true
      }),
      wood: new THREE.MeshStandardMaterial({
        color: 0x795338,
        roughness: .92
      }),
      darkWood: new THREE.MeshStandardMaterial({
        color: 0x4b3329,
        roughness: .95
      }),
      rope: new THREE.MeshStandardMaterial({
        color: 0x8f7451,
        roughness: 1
      }),
      plaster: new THREE.MeshStandardMaterial({
        color: 0xf1dfb4,
        roughness: .95
      }),
      roof: new THREE.MeshStandardMaterial({
        color: 0x5c7566,
        roughness: 1
      }),
      foliage: new THREE.MeshStandardMaterial({
        color: 0x4f8b4d,
        roughness: 1,
        flatShading: true
      }),
      foliageLight: new THREE.MeshStandardMaterial({
        color: 0x78a856,
        roughness: 1,
        flatShading: true
      }),
      metal: new THREE.MeshStandardMaterial({
        color: 0x6c7474,
        roughness: .65,
        metalness: .25
      }),
      gold: new THREE.MeshStandardMaterial({
        color: 0xc69546,
        roughness: .55,
        metalness: .25
      }),
      water: new THREE.MeshStandardMaterial({
        map: waterTexture,
        color: 0xc7f4ff,
        emissive: 0x377f9b,
        emissiveIntensity: .12,
        transparent: true,
        opacity: .78,
        depthWrite: false,
        side: THREE.DoubleSide,
        roughness: .3
      })
    };

    function enableShadows(object) {
      object.traverse(child => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      return object;
    }

    const hemi = new THREE.HemisphereLight(0xe7f7ff, 0x6a654b, 2.0);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff2cf, 4.3);
    sun.position.set(-28, 42, 25);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -38;
    sun.shadow.camera.right = 38;
    sun.shadow.camera.top = 38;
    sun.shadow.camera.bottom = -38;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 110;
    sun.shadow.bias = -0.00035;
    sun.shadow.normalBias = .035;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x9ddfff, 1.05);
    fill.position.set(24, 4, -30);
    scene.add(fill);

    const skyGeometry = new THREE.SphereGeometry(190, 40, 20);
    const skyMaterial = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: {
        topColor: { value: new THREE.Color(0x56b9ec) },
        middleColor: { value: new THREE.Color(0xc6edfb) },
        bottomColor: { value: new THREE.Color(0xf7f3de) },
        offset: { value: 15.0 },
        exponent: { value: .72 }
      },
      vertexShader: `
        varying vec3 worldPosition;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          worldPosition = wp.xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 middleColor;
        uniform vec3 bottomColor;
        uniform float offset;
        uniform float exponent;
        varying vec3 worldPosition;
        void main() {
          float h = normalize(worldPosition + vec3(0.0, offset, 0.0)).y;
          float upper = pow(max(h, 0.0), exponent);
          float lower = smoothstep(-0.35, 0.15, h);
          vec3 lowMix = mix(bottomColor, middleColor, lower);
          gl_FragColor = vec4(mix(lowMix, topColor, upper), 1.0);
        }
      `
    });
    scene.add(new THREE.Mesh(skyGeometry, skyMaterial));

    function createIslandGeometry(radius, depth, segments, seedOffset) {
      const localRandom = mulberry32(7000 + seedOffset);
      const levels = [
        { y: -.12, radius: 1.00 },
        { y: -.55, radius: .98 },
        { y: -depth * .27, radius: .74 },
        { y: -depth * .62, radius: .42 }
      ];
      const vertices = [];
      const uvs = [];
      const indices = [];
      const ringNoise = [];

      for (let i = 0; i < segments; i++) {
        ringNoise.push(.83 + localRandom() * .28);
      }

      for (let level = 0; level < levels.length; level++) {
        for (let i = 0; i < segments; i++) {
          const angle = i / segments * TAU;
          const wobble = ringNoise[i] * (1 + Math.sin(angle * 3 + seedOffset) * .045);
          const taper = levels[level].radius;
          const x = Math.cos(angle) * radius * taper * wobble;
          const z = Math.sin(angle) * radius * taper * wobble;
          const y = levels[level].y + (localRandom() - .5) * .18;
          vertices.push(x, y, z);
          uvs.push(i / segments, level / levels.length);
        }
      }

      for (let level = 0; level < levels.length - 1; level++) {
        for (let i = 0; i < segments; i++) {
          const next = (i + 1) % segments;
          const a = level * segments + i;
          const b = level * segments + next;
          const c = (level + 1) * segments + next;
          const d = (level + 1) * segments + i;
          indices.push(a, b, d, b, c, d);
        }
      }

      const bottomIndex = vertices.length / 3;
      vertices.push(
        (localRandom() - .5) * radius * .12,
        -depth,
        (localRandom() - .5) * radius * .12
      );
      uvs.push(.5, 1);

      const lastRing = (levels.length - 1) * segments;
      for (let i = 0; i < segments; i++) {
        const next = (i + 1) % segments;
        indices.push(lastRing + i, lastRing + next, bottomIndex);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        'position',
        new THREE.Float32BufferAttribute(vertices, 3)
      );
      geometry.setAttribute(
        'uv',
        new THREE.Float32BufferAttribute(uvs, 2)
      );
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    function createGrassCap(radius, segments, seedOffset) {
      const localRandom = mulberry32(9100 + seedOffset);
      const shape = new THREE.Shape();

      for (let i = 0; i <= segments; i++) {
        const angle = i / segments * TAU;
        const wobble =
          .88 +
          localRandom() * .18 +
          Math.sin(angle * 3 + seedOffset) * .035;
        const x = Math.cos(angle) * radius * wobble;
        const y = Math.sin(angle) * radius * wobble;
        if (i === 0) shape.moveTo(x, y);
        else shape.lineTo(x, y);
      }

      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: .24,
        bevelEnabled: true,
        bevelSize: .18,
        bevelThickness: .12,
        bevelSegments: 2,
        curveSegments: 2
      });
      geometry.rotateX(Math.PI / 2);
      geometry.translate(0, .12, 0);
      return geometry;
    }

    function addRocks(group, radius, count) {
      for (let i = 0; i < count; i++) {
        const angle = rand(0, TAU);
        const distance = radius * rand(.66, .95);
        const size = rand(.18, .62);
        const geometry = new THREE.DodecahedronGeometry(size, 0);
        geometry.scale(rand(.8, 1.6), rand(.55, 1.1), rand(.75, 1.35));
        const rock = new THREE.Mesh(
          geometry,
          random() > .35 ? materials.rock : materials.darkRock
        );
        rock.position.set(
          Math.cos(angle) * distance,
          rand(.15, .36),
          Math.sin(angle) * distance
        );
        rock.rotation.set(rand(0, TAU), rand(0, TAU), rand(0, TAU));
        group.add(rock);
      }
    }

    function addFlowers(group, radius, count) {
      const stemMaterial = new THREE.MeshStandardMaterial({
        color: 0x477643,
        roughness: 1
      });
      const colors = [0xffd269, 0xffffff, 0xe99bb6, 0xaecdf4];

      for (let i = 0; i < count; i++) {
        const flower = new THREE.Group();
        const angle = rand(0, TAU);
        const distance = Math.sqrt(random()) * radius * .72;
        const stem = new THREE.Mesh(
          new THREE.CylinderGeometry(.012, .018, .22, 5),
          stemMaterial
        );
        stem.position.y = .11;
        flower.add(stem);

        const blossom = new THREE.Mesh(
          new THREE.IcosahedronGeometry(.055, 0),
          new THREE.MeshStandardMaterial({
            color: pick(colors),
            roughness: .85
          })
        );
        blossom.scale.set(1.3, .55, 1.3);
        blossom.position.y = .24;
        flower.add(blossom);
        flower.position.set(
          Math.cos(angle) * distance,
          .27,
          Math.sin(angle) * distance
        );
        group.add(flower);
      }
    }

    function createTree(scale = 1) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(.16, .23, 1.5, 7),
        materials.wood
      );
      trunk.position.y = .75;
      trunk.rotation.z = rand(-.08, .08);
      tree.add(trunk);

      const crownPositions = [
        [0, 1.72, 0, .8],
        [-.42, 1.55, .02, .58],
        [.42, 1.55, -.05, .62],
        [0, 1.95, -.18, .62]
      ];

      for (let i = 0; i < crownPositions.length; i++) {
        const [x, y, z, s] = crownPositions[i];
        const crown = new THREE.Mesh(
          new THREE.IcosahedronGeometry(s, 1),
          i % 2 ? materials.foliageLight : materials.foliage
        );
        crown.position.set(x, y, z);
        crown.scale.set(1, .82, 1);
        tree.add(crown);
      }

      tree.scale.setScalar(scale);
      return enableShadows(tree);
    }

    const islands = [];

    function createIsland({
      position,
      radius,
      depth,
      scaleZ = .82,
      segments = 24,
      seed = 1,
      trees = 0,
      flowers = 0
    }) {
      const group = new THREE.Group();
      group.position.copy(position);

      const body = new THREE.Mesh(
        createIslandGeometry(radius, depth, segments, seed),
        materials.rock
      );
      body.scale.z = scaleZ;
      group.add(body);

      const cap = new THREE.Mesh(
        createGrassCap(radius, segments, seed),
        materials.grass
      );
      cap.scale.z = scaleZ;
      group.add(cap);

      addRocks(group, radius, Math.max(3, Math.round(radius)));
      addFlowers(group, radius, flowers);

      for (let i = 0; i < trees; i++) {
        const angle = rand(0, TAU);
        const distance = radius * rand(.3, .67);
        const tree = createTree(rand(.55, .95));
        tree.position.set(
          Math.cos(angle) * distance,
          .28,
          Math.sin(angle) * distance * scaleZ
        );
        group.add(tree);
      }

      enableShadows(group);
      scene.add(group);
      islands.push(group);
      return group;
    }

    const mainIsland = createIsland({
      position: new THREE.Vector3(0, 7, 0),
      radius: 8.4,
      depth: 9.3,
      scaleZ: .78,
      segments: 34,
      seed: 11,
      trees: 5,
      flowers: 32
    });

    const westIsland = createIsland({
      position: new THREE.Vector3(-15.5, 5.1, 2.3),
      radius: 4.5,
      depth: 6.5,
      scaleZ: .76,
      segments: 25,
      seed: 29,
      trees: 3,
      flowers: 12
    });

    const eastIsland = createIsland({
      position: new THREE.Vector3(14.4, 9.3, -2.4),
      radius: 4.9,
      depth: 7.1,
      scaleZ: .72,
      segments: 26,
      seed: 48,
      trees: 2,
      flowers: 15
    });

    const rearIsland = createIsland({
      position: new THREE.Vector3(4.3, 2.1, -15.2),
      radius: 3.5,
      depth: 5.8,
      scaleZ: .8,
      segments: 22,
      seed: 62,
      trees: 2,
      flowers: 7
    });

    const tinyIsland = createIsland({
      position: new THREE.Vector3(-7.2, 11.9, -12.4),
      radius: 2.3,
      depth: 4.3,
      scaleZ: .7,
      segments: 19,
      seed: 73,
      trees: 1,
      flowers: 5
    });

    function createCottage() {
      const cottage = new THREE.Group();

      const house = new THREE.Mesh(
        new THREE.BoxGeometry(4.5, 2.9, 3.6),
        materials.plaster
      );
      house.position.y = 1.72;
      cottage.add(house);

      const beamGeometry = new THREE.BoxGeometry(.18, 3.05, .18);
      for (const x of [-2.12, 0, 2.12]) {
        for (const z of [-1.72, 1.72]) {
          const beam = new THREE.Mesh(beamGeometry, materials.darkWood);
          beam.position.set(x, 1.7, z);
          cottage.add(beam);
        }
      }

      const horizontalBeam = new THREE.BoxGeometry(4.45, .17, .17);
      for (const y of [.48, 2.88]) {
        for (const z of [-1.72, 1.72]) {
          const beam = new THREE.Mesh(horizontalBeam, materials.darkWood);
          beam.position.set(0, y, z);
          cottage.add(beam);
        }
      }

      const roof = new THREE.Mesh(
        new THREE.CylinderGeometry(3.15, 3.15, 4.8, 3, 1, false, 0),
        materials.roof
      );
      roof.rotation.z = Math.PI / 2;
      roof.rotation.y = Math.PI / 2;
      roof.scale.z = .8;
      roof.position.y = 3.52;
      cottage.add(roof);

      const door = new THREE.Mesh(
        new THREE.BoxGeometry(1.05, 1.95, .12),
        materials.wood
      );
      door.position.set(-.55, 1.13, 1.86);
      cottage.add(door);

      const doorTop = new THREE.Mesh(
        new THREE.CylinderGeometry(.525, .525, .12, 18, 1, false, 0, Math.PI),
        materials.wood
      );
      doorTop.rotation.x = Math.PI / 2;
      doorTop.rotation.z = Math.PI;
      doorTop.position.set(-.55, 2.08, 1.86);
      cottage.add(doorTop);

      const knob = new THREE.Mesh(
        new THREE.SphereGeometry(.07, 10, 8),
        materials.gold
      );
      knob.position.set(-.18, 1.2, 1.95);
      cottage.add(knob);

      for (const x of [-1.55, 1.25]) {
        const window = new THREE.Mesh(
          new THREE.PlaneGeometry(.82, .9),
          new THREE.MeshStandardMaterial({
            map: windowTexture,
            emissiveMap: windowTexture,
            emissive: 0xffb24a,
            emissiveIntensity: .65,
            roughness: .7
          })
        );
        window.position.set(x, 1.72, 1.927);
        cottage.add(window);
      }

      const chimney = new THREE.Mesh(
        new THREE.BoxGeometry(.62, 1.65, .66),
        new THREE.MeshStandardMaterial({
          color: 0xa67259,
          roughness: 1
        })
      );
      chimney.position.set(1.32, 4.18, -.32);
      cottage.add(chimney);

      const chimneyCap = new THREE.Mesh(
        new THREE.BoxGeometry(.82, .18, .86),
        materials.darkRock
      );
      chimneyCap.position.set(1.32, 5.03, -.32);
      cottage.add(chimneyCap);

      cottage.position.set(-1.1, .3, -.4);
      cottage.rotation.y = -.24;
      return enableShadows(cottage);
    }

    const cottage = createCottage();
    mainIsland.add(cottage);

    const windmillRotors = [];

    function createWindmill() {
      const mill = new THREE.Group();

      const tower = new THREE.Mesh(
        new THREE.CylinderGeometry(.62, 1.05, 4.8, 10),
        materials.plaster
      );
      tower.position.y = 2.4;
      mill.add(tower);

      const cap = new THREE.Mesh(
        new THREE.ConeGeometry(1.02, 1.35, 10),
        materials.roof
      );
      cap.position.y = 5.08;
      mill.add(cap);

      const axle = new THREE.Mesh(
        new THREE.CylinderGeometry(.15, .15, .7, 12),
        materials.darkWood
      );
      axle.rotation.x = Math.PI / 2;
      axle.position.set(0, 3.75, .83);
      mill.add(axle);

      const rotor = new THREE.Group();
      rotor.position.set(0, 3.75, 1.18);

      const hub = new THREE.Mesh(
        new THREE.SphereGeometry(.27, 12, 8),
        materials.gold
      );
      rotor.add(hub);

      for (let i = 0; i < 4; i++) {
        const blade = new THREE.Group();
        blade.rotation.z = i * Math.PI / 2;

        const arm = new THREE.Mesh(
          new THREE.BoxGeometry(.13, 2.9, .11),
          materials.darkWood
        );
        arm.position.y = 1.43;
        blade.add(arm);

        const sail = new THREE.Mesh(
          new THREE.BoxGeometry(.72, 1.48, .07),
          new THREE.MeshStandardMaterial({
            color: 0xeee1bf,
            roughness: .9
          })
        );
        sail.position.set(.34, 2.05, 0);
        sail.rotation.z = -.08;
        blade.add(sail);
        rotor.add(blade);
      }

      mill.add(rotor);
      windmillRotors.push(rotor);
      mill.position.set(4.15, .3, -.45);
      mill.rotation.y = -.25;
      return enableShadows(mill);
    }

    mainIsland.add(createWindmill());

    function createFence(group, start, end, count) {
      const direction = new THREE.Vector3().subVectors(end, start);
      for (let i = 0; i <= count; i++) {
        const t = i / count;
        const post = new THREE.Mesh(
          new THREE.CylinderGeometry(.08, .11, 1.05, 7),
          materials.wood
        );
        post.position.copy(start).lerp(end, t);
        post.position.y += .52;
        group.add(post);
      }
      for (const height of [.43, .85]) {
        const curve = new THREE.LineCurve3(
          start.clone().add(new THREE.Vector3(0, height, 0)),
          end.clone().add(new THREE.Vector3(0, height, 0))
        );
        group.add(new THREE.Mesh(
          new THREE.TubeGeometry(curve, 8, .045, 6, false),
          materials.wood
        ));
      }
    }

    createFence(
      mainIsland,
      new THREE.Vector3(-5.8, .28, -3.55),
      new THREE.Vector3(-3.2, .28, -5.05),
      4
    );

    function tubeBetween(a, b, radius, material, segments = 16) {
      const curve = new THREE.LineCurve3(a, b);
      return new THREE.Mesh(
        new THREE.TubeGeometry(curve, segments, radius, 7, false),
        material
      );
    }

    function createRopeBridge(start, end, plankCount = 18) {
      const bridge = new THREE.Group();
      const span = new THREE.Vector3().subVectors(end, start);
      const length = span.length();
      const forward = span.clone().normalize();
      const side = new THREE.Vector3(-forward.z, 0, forward.x);
      const worldUp = new THREE.Vector3(0, 1, 0);

      for (let i = 0; i < plankCount; i++) {
        const t = (i + .5) / plankCount;
        const sag = -Math.sin(Math.PI * t) * Math.min(1.5, length * .06);
        const center = start.clone().lerp(end, t);
        center.y += sag;

        const plank = new THREE.Mesh(
          new THREE.BoxGeometry(1.7, .15, length / plankCount * .72),
          materials.wood
        );
        plank.position.copy(center);
        plank.quaternion.setFromUnitVectors(
          new THREE.Vector3(0, 0, 1),
          forward
        );
        plank.rotateZ(rand(-.025, .025));
        bridge.add(plank);
      }

      for (const sideSign of [-1, 1]) {
        const lowPoints = [];
        const highPoints = [];

        for (let i = 0; i <= 30; i++) {
          const t = i / 30;
          const sag = -Math.sin(Math.PI * t) * Math.min(1.5, length * .06);
          const point = start.clone().lerp(end, t);
          point.addScaledVector(side, sideSign * .82);
          point.y += sag;
          lowPoints.push(point.clone());
          highPoints.push(point.clone().addScaledVector(worldUp, 1.15));
        }

        bridge.add(new THREE.Mesh(
          new THREE.TubeGeometry(
            new THREE.CatmullRomCurve3(lowPoints),
            48,
            .045,
            7,
            false
          ),
          materials.rope
        ));

        bridge.add(new THREE.Mesh(
          new THREE.TubeGeometry(
            new THREE.CatmullRomCurve3(highPoints),
            48,
            .055,
            7,
            false
          ),
          materials.rope
        ));

        for (let i = 0; i <= 12; i++) {
          const t = i / 12;
          const index = Math.round(t * 30);
          bridge.add(tubeBetween(
            lowPoints[index],
            highPoints[index],
            .027,
            materials.rope,
            5
          ));
        }
      }

      enableShadows(bridge);
      scene.add(bridge);
      return bridge;
    }

    createRopeBridge(
      new THREE.Vector3(-7.1, 7.55, 1.7),
      new THREE.Vector3(-11.9, 5.65, 2.25),
      16
    );

    createRopeBridge(
      new THREE.Vector3(7.25, 7.55, -1.5),
      new THREE.Vector3(10.35, 9.85, -2.2),
      14
    );

    createRopeBridge(
      new THREE.Vector3(2.5, 7.45, -5.9),
      new THREE.Vector3(3.65, 2.65, -12.3),
      17
    );

    const waterfalls = [];
    const mistParticles = [];

    function createWaterfall(island, angle, radius, height, width) {
      const group = new THREE.Group();
      const localX = Math.cos(angle) * radius;
      const localZ = Math.sin(angle) * radius * .78;
      group.position.set(localX, .02 - height / 2, localZ);
      group.rotation.y = -angle + Math.PI / 2;

      const sheet = new THREE.Mesh(
        new THREE.PlaneGeometry(width, height, 12, 30),
        materials.water.clone()
      );
      const positions = sheet.geometry.attributes.position;

      for (let i = 0; i < positions.count; i++) {
        const x = positions.getX(i);
        const y = positions.getY(i);
        const wave = Math.sin(y * 1.6 + x * 2.3) * .06;
        positions.setZ(i, wave);
      }
      positions.needsUpdate = true;
      sheet.geometry.computeVertexNormals();
      group.add(sheet);

      const lip = new THREE.Mesh(
        new THREE.BoxGeometry(width * 1.05, .12, .45),
        new THREE.MeshStandardMaterial({
          color: 0x91dbe8,
          transparent: true,
          opacity: .72,
          roughness: .3
        })
      );
      lip.position.y = height / 2;
      lip.position.z = -.12;
      group.add(lip);

      for (let i = 0; i < 8; i++) {
        const sprite = new THREE.Sprite(
          new THREE.SpriteMaterial({
            map: mistTexture,
            color: 0xffffff,
            transparent: true,
            opacity: rand(.25, .55),
            depthWrite: false
          })
        );
        sprite.position.set(
          rand(-width * .8, width * .8),
          -height / 2 + rand(-.7, .7),
          rand(-.5, .5)
        );
        sprite.scale.setScalar(rand(1.2, 2.6));
        sprite.userData.base = sprite.position.clone();
        sprite.userData.phase = rand(0, TAU);
        sprite.userData.speed = rand(.25, .55);
        group.add(sprite);
        mistParticles.push(sprite);
      }

      waterfalls.push(sheet);
      island.add(group);
    }

    createWaterfall(mainIsland, .6, 7.7, 10.5, 1.45);
    createWaterfall(mainIsland, 3.65, 7.55, 8.4, 1.0);
    createWaterfall(eastIsland, 5.65, 4.4, 8.0, .9);
    createWaterfall(westIsland, 2.65, 4.0, 6.5, .72);

    function createAirship() {
      const ship = new THREE.Group();

      const envelope = new THREE.Mesh(
        new THREE.SphereGeometry(2.4, 24, 14),
        new THREE.MeshStandardMaterial({
          color: 0xc95e49,
          roughness: .8
        })
      );
      envelope.scale.set(1.75, .78, .82);
      envelope.rotation.z = -.05;
      ship.add(envelope);

      for (let i = 0; i < 5; i++) {
        const band = new THREE.Mesh(
          new THREE.TorusGeometry(
            1.82 * Math.sqrt(Math.max(.1, 1 - Math.pow((i - 2) / 3, 2))),
            .045,
            6,
            32
          ),
          materials.gold
        );
        band.rotation.y = Math.PI / 2;
        band.position.x = (i - 2) * 1.17;
        band.scale.y = .49;
        ship.add(band);
      }

      const gondola = new THREE.Mesh(
        new THREE.BoxGeometry(2.5, .65, 1.05),
        materials.wood
      );
      gondola.position.y = -1.65;
      ship.add(gondola);

      const bow = new THREE.Mesh(
        new THREE.ConeGeometry(.57, .9, 8),
        materials.wood
      );
      bow.rotation.z = -Math.PI / 2;
      bow.position.set(1.68, -1.65, 0);
      ship.add(bow);

      for (const x of [-.9, .9]) {
        for (const z of [-.38, .38]) {
          ship.add(tubeBetween(
            new THREE.Vector3(x, -1.35, z),
            new THREE.Vector3(x * 1.2, -.55, z * 1.4),
            .025,
            materials.rope,
            5
          ));
        }
      }

      const tailFin = new THREE.Mesh(
        new THREE.ConeGeometry(.8, 1.65, 3),
        new THREE.MeshStandardMaterial({
          color: 0xe9c77f,
          side: THREE.DoubleSide,
          roughness: .9
        })
      );
      tailFin.rotation.z = Math.PI / 2;
      tailFin.position.set(-4.08, .05, 0);
      ship.add(tailFin);

      const propeller = new THREE.Group();
      propeller.position.set(-1.62, -1.65, 0);

      const axle = new THREE.Mesh(
        new THREE.CylinderGeometry(.09, .09, .6, 8),
        materials.metal
      );
      axle.rotation.z = Math.PI / 2;
      propeller.add(axle);

      for (let i = 0; i < 3; i++) {
        const blade = new THREE.Mesh(
          new THREE.BoxGeometry(.08, 1.15, .22),
          materials.darkWood
        );
        blade.rotation.x = i * TAU / 3;
        blade.position.set(-.33, 0, 0);
        propeller.add(blade);
      }

      ship.add(propeller);
      ship.userData.propeller = propeller;
      ship.position.set(-12.8, 13.4, -5.2);
      ship.rotation.y = -.35;
      ship.scale.setScalar(.92);
      enableShadows(ship);
      scene.add(ship);
      return ship;
    }

    const airship = createAirship();

    const mooringPost = new THREE.Mesh(
      new THREE.CylinderGeometry(.14, .2, 2.4, 8),
      materials.darkWood
    );
    mooringPost.position.set(-6.2, 8.5, -2.9);
    mooringPost.castShadow = true;
    scene.add(mooringPost);

    const mooringCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-6.2, 9.55, -2.9),
      new THREE.Vector3(-8.4, 10.2, -3.2),
      new THREE.Vector3(-10.5, 10.65, -4.2),
      new THREE.Vector3(-12.1, 11.65, -4.8)
    ]);
    const mooringRope = new THREE.Mesh(
      new THREE.TubeGeometry(mooringCurve, 32, .045, 7, false),
      materials.rope
    );
    mooringRope.castShadow = true;
    scene.add(mooringRope);

    function createFloatingBoulder(position, scale) {
      const boulder = new THREE.Mesh(
        new THREE.DodecahedronGeometry(scale, 1),
        materials.rock
      );
      boulder.scale.set(rand(.7, 1.2), rand(1.1, 1.8), rand(.7, 1.15));
      boulder.position.copy(position);
      boulder.rotation.set(rand(0, TAU), rand(0, TAU), rand(0, TAU));
      boulder.userData.baseY = position.y;
      boulder.userData.phase = rand(0, TAU);
      boulder.castShadow = true;
      boulder.receiveShadow = true;
      scene.add(boulder);
      return boulder;
    }

    const boulders = [
      createFloatingBoulder(new THREE.Vector3(-10, 1, 9), .65),
      createFloatingBoulder(new THREE.Vector3(11, 3.5, 8), .82),
      createFloatingBoulder(new THREE.Vector3(8, -2.2, -7), .48),
      createFloatingBoulder(new THREE.Vector3(-4, -3.7, -12), .75),
      createFloatingBoulder(new THREE.Vector3(17, 2.2, -10), .42),
      createFloatingBoulder(new THREE.Vector3(-18, 8.8, -7), .52)
    ];

    const cloudGroups = [];

    function createCloud(position, scale, opacity = .82) {
      const cloud = new THREE.Group();
      const material = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 1,
        transparent: true,
        opacity,
        depthWrite: false
      });

      const puffs = [
        [-1.6, 0, 0, 1.2],
        [-.6, .35, .05, 1.55],
        [.65, .25, 0, 1.45],
        [1.65, -.05, .05, 1.0],
        [0, -.2, .4, 1.45],
        [.15, .65, -.1, 1.05]
      ];

      for (const [x, y, z, s] of puffs) {
        const puff = new THREE.Mesh(
          new THREE.SphereGeometry(s, 12, 8),
          material
        );
        puff.position.set(x, y, z);
        puff.scale.y = .7;
        puff.castShadow = true;
        cloud.add(puff);
      }

      cloud.position.copy(position);
      cloud.scale.setScalar(scale);
      cloud.userData.startX = position.x;
      cloud.userData.speed = rand(.16, .34);
      cloud.userData.phase = rand(0, TAU);
      scene.add(cloud);
      cloudGroups.push(cloud);
      return cloud;
    }

    createCloud(new THREE.Vector3(-25, 18, -22), 2.3, .7);
    createCloud(new THREE.Vector3(23, 15, -18), 1.8, .75);
    createCloud(new THREE.Vector3(-31, 8, 7), 1.55, .68);
    createCloud(new THREE.Vector3(28, 4, 9), 2.1, .72);
    createCloud(new THREE.Vector3(2, -8, -25), 4.6, .78);
    createCloud(new THREE.Vector3(-18, -11, -7), 3.8, .72);
    createCloud(new THREE.Vector3(22, -10, 4), 4.2, .75);

    const birdMaterial = new THREE.MeshStandardMaterial({
      color: 0x263b4c,
      side: THREE.DoubleSide,
      roughness: .8
    });
    const birds = [];

    function createBird(radius, height, speed, phase) {
      const bird = new THREE.Group();
      const leftPivot = new THREE.Group();
      const rightPivot = new THREE.Group();

      const wingGeometry = new THREE.BufferGeometry();
      wingGeometry.setAttribute(
        'position',
        new THREE.Float32BufferAttribute([
          0, 0, 0,
          1.0, .05, -.16,
          .26, 0, .34
        ], 3)
      );
      wingGeometry.setIndex([0, 1, 2]);
      wingGeometry.computeVertexNormals();

      const leftWing = new THREE.Mesh(wingGeometry, birdMaterial);
      const rightWing = new THREE.Mesh(wingGeometry, birdMaterial);
      rightWing.scale.x = -1;
      leftPivot.add(leftWing);
      rightPivot.add(rightWing);
      bird.add(leftPivot, rightPivot);

      const body = new THREE.Mesh(
        new THREE.CapsuleGeometry(.09, .38, 3, 6),
        birdMaterial
      );
      body.rotation.x = Math.PI / 2;
      body.position.z = .05;
      bird.add(body);

      bird.userData = {
        radius,
        height,
        speed,
        phase,
        leftPivot,
        rightPivot
      };
      bird.scale.setScalar(.55);
      scene.add(bird);
      birds.push(bird);
    }

    createBird(9, -4.5, .28, 0);
    createBird(12, -6.2, .21, 2.1);
    createBird(15, -8.5, .17, 4.2);
    createBird(7, -1.8, .34, 1.15);
    createBird(18, -10.5, .13, 5.4);

    const smokeParticles = [];

    function createSmoke() {
      for (let i = 0; i < 8; i++) {
        const smoke = new THREE.Sprite(
          new THREE.SpriteMaterial({
            map: mistTexture,
            color: 0xdde3dc,
            transparent: true,
            opacity: .22,
            depthWrite: false
          })
        );
        smoke.position.set(
          mainIsland.position.x + .2,
          mainIsland.position.y + 5.4,
          mainIsland.position.z - .65
        );
        smoke.scale.setScalar(.4 + i * .1);
        smoke.userData.offset = i / 8;
        smoke.userData.phase = rand(0, TAU);
        scene.add(smoke);
        smokeParticles.push(smoke);
      }
    }

    createSmoke();

    const distantCloudLayer = new THREE.Mesh(
      new THREE.CylinderGeometry(90, 105, 2.5, 64, 1, true),
      new THREE.MeshStandardMaterial({
        color: 0xeaf7f7,
        transparent: true,
        opacity: .2,
        side: THREE.DoubleSide,
        depthWrite: false,
        roughness: 1
      })
    );
    distantCloudLayer.position.y = -16;
    scene.add(distantCloudLayer);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      const delta = Math.min(clock.getDelta(), .04);

      for (const rotor of windmillRotors) {
        rotor.rotation.z -= delta * .72;
      }

      airship.position.y = 13.4 + Math.sin(elapsed * .52) * .34;
      airship.rotation.z = Math.sin(elapsed * .38) * .025;
      airship.userData.propeller.rotation.x += delta * 8.5;

      waterTexture.offset.y = -elapsed * .34;

      for (const sheet of waterfalls) {
        sheet.material.map.offset.y = -elapsed * .34;
      }

      for (const sprite of mistParticles) {
        const data = sprite.userData;
        sprite.position.x =
          data.base.x + Math.sin(elapsed * data.speed + data.phase) * .42;
        sprite.position.y =
          data.base.y + Math.sin(elapsed * .7 + data.phase) * .18;
        sprite.material.opacity =
          .28 + Math.sin(elapsed * .8 + data.phase) * .12;
      }

      for (const boulder of boulders) {
        boulder.position.y =
          boulder.userData.baseY +
          Math.sin(elapsed * .45 + boulder.userData.phase) * .25;
        boulder.rotation.y += delta * .035;
      }

      for (let i = 0; i < cloudGroups.length; i++) {
        const cloud = cloudGroups[i];
        cloud.position.x += delta * cloud.userData.speed;
        cloud.position.y +=
          Math.sin(elapsed * .16 + cloud.userData.phase) * delta * .025;
        if (cloud.position.x > 42) cloud.position.x = -42;
      }

      for (const bird of birds) {
        const data = bird.userData;
        const angle = elapsed * data.speed + data.phase;
        bird.position.set(
          Math.cos(angle) * data.radius,
          data.height + Math.sin(angle * 2.1) * .65,
          Math.sin(angle) * data.radius * .72
        );
        bird.rotation.y = -angle + Math.PI / 2;
        const flap = Math.sin(elapsed * 5.4 + data.phase) * .48;
        data.leftPivot.rotation.z = flap;
        data.rightPivot.rotation.z = -flap;
      }

      for (const smoke of smokeParticles) {
        const cycle = (elapsed * .085 + smoke.userData.offset) % 1;
        smoke.position.set(
          mainIsland.position.x + .2 +
            Math.sin(cycle * 5 + smoke.userData.phase) * .35,
          mainIsland.position.y + 5.6 + cycle * 6.2,
          mainIsland.position.z - .65 +
            Math.cos(cycle * 4 + smoke.userData.phase) * .22
        );
        const size = .45 + cycle * 1.9;
        smoke.scale.setScalar(size);
        smoke.material.opacity = Math.sin(Math.PI * cycle) * .2;
      }

      distantCloudLayer.rotation.y += delta * .002;
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    animate();
  </script>
</body>
</html>
