<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunflower</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe9f0; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe9f0);
scene.fog = new THREE.Fog(0xdfe9f0, 18, 40);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.5, 4.2, 8.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.6, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI * 0.55;

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x6b7a4f, 0.55));

const sun = new THREE.DirectionalLight(0xfff2d8, 2.2);
sun.position.set(6, 9, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -6; sun.shadow.camera.right = 6;
sun.shadow.camera.top = 8;  sun.shadow.camera.bottom = -2;
sun.shadow.radius = 6;
sun.shadow.bias = -0.0005;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xbfd4ff, 0.4);
fill.position.set(-5, 3, -4);
scene.add(fill);

// ---------- procedural textures ----------
function canvasTex(size, fn, repeat = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  fn(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// seeded pseudo-random
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// seed-head texture: dark brown with phyllotaxis dots
const seedTex = canvasTex(512, (ctx, s) => {
  ctx.fillStyle = '#4a2e14';
  ctx.fillRect(0, 0, s, s);
  const cx = s / 2, cy = s / 2, GA = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < 1400; i++) {
    const r = Math.sqrt(i / 1400) * s * 0.5;
    const a = i * GA;
    const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
    const dr = 3.2 + (1 - i / 1400) * 3.5;
    const g = ctx.createRadialGradient(x - dr * 0.3, y - dr * 0.3, 0, x, y, dr);
    g.addColorStop(0, '#8a5a28');
    g.addColorStop(0.55, '#5d3a18');
    g.addColorStop(1, '#3a2410');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, dr, 0, Math.PI * 2); ctx.fill();
  }
});
const seedBump = canvasTex(512, (ctx, s) => {
  ctx.fillStyle = '#404040'; ctx.fillRect(0, 0, s, s);
  const cx = s / 2, cy = s / 2, GA = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < 1400; i++) {
    const r = Math.sqrt(i / 1400) * s * 0.5;
    const a = i * GA;
    const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
    const dr = 3.2 + (1 - i / 1400) * 3.5;
    const g = ctx.createRadialGradient(x, y, 0, x, y, dr);
    g.addColorStop(0, '#e0e0e0'); g.addColorStop(1, '#202020');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, dr, 0, Math.PI * 2); ctx.fill();
  }
});

// fuzzy stem texture: green with vertical streaks + speckle fuzz
const stemTex = canvasTex(256, (ctx, s) => {
  ctx.fillStyle = '#4d7a2b'; ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 60; i++) {
    ctx.strokeStyle = `rgba(${40 + rnd() * 60},${100 + rnd() * 60},${30 + rnd() * 30},0.35)`;
    ctx.lineWidth = 1 + rnd() * 3;
    const x = rnd() * s;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + (rnd() - 0.5) * 10, s); ctx.stroke();
  }
  for (let i = 0; i < 900; i++) {
    ctx.fillStyle = `rgba(220,235,190,${0.05 + rnd() * 0.15})`;
    ctx.fillRect(rnd() * s, rnd() * s, 1.4, 1.4);
  }
}, 2);
stemTex.repeat.set(3, 2);

// leaf texture: gradient green with veins
const leafTex = canvasTex(256, (ctx, s) => {
  const g = ctx.createLinearGradient(0, 0, 0, s);
  g.addColorStop(0, '#5f9a35'); g.addColorStop(1, '#3e6f22');
  ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
  ctx.strokeStyle = 'rgba(210,230,160,0.5)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(s / 2, 0); ctx.lineTo(s / 2, s); ctx.stroke();
  ctx.lineWidth = 1.5;
  for (let i = 1; i < 8; i++) {
    const y = (i / 8) * s;
    ctx.beginPath(); ctx.moveTo(s / 2, y); ctx.quadraticCurveTo(s * 0.75, y - 14, s, y - 30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s / 2, y); ctx.quadraticCurveTo(s * 0.25, y - 14, 0, y - 30); ctx.stroke();
  }
});

// ---------- materials ----------
const stemMat = new THREE.MeshStandardMaterial({ map: stemTex, roughness: 0.95 });
const leafMat = new THREE.MeshStandardMaterial({ map: leafTex, roughness: 0.85, side: THREE.DoubleSide });
const petalMat = new THREE.MeshStandardMaterial({ color: 0xffc514, roughness: 0.55, side: THREE.DoubleSide, emissive: 0x664400, emissiveIntensity: 0.12 });
const petalMat2 = new THREE.MeshStandardMaterial({ color: 0xf0a90c, roughness: 0.6, side: THREE.DoubleSide, emissive: 0x553300, emissiveIntensity: 0.1 });
const seedMat = new THREE.MeshStandardMaterial({ map: seedTex, bumpMap: seedBump, bumpScale: 1.4, roughness: 0.9 });
const calyxMat = new THREE.MeshStandardMaterial({ color: 0x3f6e24, roughness: 0.9 });

// ---------- sunflower ----------
const flower = new THREE.Group();
scene.add(flower);

// stem: gently curved, thick
const stemCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 0, 0),
  new THREE.Vector3(0.05, 1.2, 0.02),
  new THREE.Vector3(-0.06, 2.4, 0.06),
  new THREE.Vector3(0.05, 3.6, 0.14),
  new THREE.Vector3(0.12, 4.4, 0.3)
]);
const stem = new THREE.Mesh(new THREE.TubeGeometry(stemCurve, 48, 0.11, 12), stemMat);
stem.castShadow = stem.receiveShadow = true;
flower.add(stem);

// fuzz on the stem: tiny hairs
const hairGeo = new THREE.ConeGeometry(0.006, 0.07, 4);
const hairMat = new THREE.MeshStandardMaterial({ color: 0xa8c77f, roughness: 1 });
const hairs = new THREE.InstancedMesh(hairGeo, hairMat, 360);
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0);
for (let i = 0; i < 360; i++) {
  const t = rnd() * 0.97;
  const p = stemCurve.getPointAt(t);
  const a = rnd() * Math.PI * 2;
  const n = new THREE.Vector3(Math.cos(a), 0.25 + rnd() * 0.4, Math.sin(a)).normalize();
  q.setFromUnitVectors(up, n);
  m4.compose(p.clone().addScaledVector(n, 0.115), q, new THREE.Vector3(1, 0.8 + rnd() * 0.7, 1));
  hairs.setMatrixAt(i, m4);
}
hairs.castShadow = true;
flower.add(hairs);

// leaf: broad heart-ish shape, curved
function makeLeaf() {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(0.35, 0.05, 0.55, 0.45, 0.42, 0.85);
  shape.bezierCurveTo(0.3, 1.15, 0.1, 1.3, 0, 1.4);
  shape.bezierCurveTo(-0.1, 1.3, -0.3, 1.15, -0.42, 0.85);
  shape.bezierCurveTo(-0.55, 0.45, -0.35, 0.05, 0, 0);
  const geo = new THREE.ShapeGeometry(shape, 24);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    pos.setZ(i, -y * y * 0.22 + Math.abs(x) * 0.28);   // droop + fold
  }
  geo.computeVertexNormals();
  // uv remap to 0..1
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, (pos.getX(i) + 0.55) / 1.1, pos.getY(i) / 1.4);
  const leaf = new THREE.Mesh(geo, leafMat);
  leaf.castShadow = leaf.receiveShadow = true;
  return leaf;
}
const leafDefs = [
  { t: 0.28, ang: 0.5,  scale: 1.25, tilt: -0.85 },
  { t: 0.46, ang: 2.7,  scale: 1.4,  tilt: -0.7 },
  { t: 0.62, ang: 4.4,  scale: 1.15, tilt: -0.6 },
  { t: 0.76, ang: 1.6,  scale: 0.9,  tilt: -0.5 }
];
for (const d of leafDefs) {
  const holder = new THREE.Group();
  const p = stemCurve.getPointAt(d.t);
  holder.position.copy(p);
  holder.rotation.y = d.ang;
  const petiole = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.04, 0.5, 8), stemMat);
  petiole.position.set(0, 0.08, 0.24);
  petiole.rotation.x = Math.PI / 2 - 0.5;
  petiole.castShadow = true;
  holder.add(petiole);
  const leaf = makeLeaf();
  leaf.scale.setScalar(d.scale);
  leaf.position.set(0, 0.18, 0.44);
  leaf.rotation.x = Math.PI / 2 + d.tilt;
  holder.add(leaf);
  flower.add(holder);
}

// ---------- flower head ----------
const head = new THREE.Group();
const headPos = stemCurve.getPointAt(1);
head.position.copy(headPos);
// face slightly up and toward the sun
head.lookAt(headPos.clone().add(new THREE.Vector3(sun.position.x, sun.position.y * 0.55, sun.position.z).normalize()));
flower.add(head);

// seed disc: slightly domed
const discGeo = new THREE.SphereGeometry(1.0, 48, 24, 0, Math.PI * 2, 0, Math.PI * 0.42);
discGeo.scale(1, 0.38, 1);
const disc = new THREE.Mesh(discGeo, seedMat);
disc.rotation.x = Math.PI / 2;
disc.position.z = 0.05;
disc.castShadow = disc.receiveShadow = true;
head.add(disc);

// calyx (green back of the head)
const back = new THREE.Mesh(new THREE.SphereGeometry(1.05, 32, 16, 0, Math.PI * 2, Math.PI * 0.5, Math.PI * 0.5), calyxMat);
back.scale.set(1, 0.45, 1);
back.rotation.x = Math.PI / 2;
back.castShadow = true;
head.add(back);
// sepals: small green points behind petals
const sepalGeo = petalGeometry(0.55, 0.16);
for (let i = 0; i < 16; i++) {
  const s = new THREE.Mesh(sepalGeo, calyxMat);
  const a = (i / 16) * Math.PI * 2;
  s.position.set(Math.cos(a) * 0.98, Math.sin(a) * 0.98, -0.14);
  s.rotation.z = a - Math.PI / 2;
  s.rotation.x = -0.35;
  s.castShadow = true;
  head.add(s);
}

// pointed petal geometry (bent plane)
function petalGeometry(len, wid) {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(wid, len * 0.15, wid * 0.9, len * 0.65, 0, len);
  shape.bezierCurveTo(-wid * 0.9, len * 0.65, -wid, len * 0.15, 0, 0);
  const geo = new THREE.ShapeGeometry(shape, 12);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i);
    pos.setZ(i, Math.sin((y / len) * Math.PI) * 0.09 - (x * x) * 0.6); // arch + cup
  }
  geo.computeVertexNormals();
  return geo;
}

// two rings of petals
function petalRing(count, radius, len, wid, zOff, tilt, mat, phase) {
  const geo = petalGeometry(len, wid);
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + phase;
    const p = new THREE.Mesh(geo, mat);
    p.position.set(Math.cos(a) * radius, Math.sin(a) * radius, zOff);
    p.rotation.z = a - Math.PI / 2;
    p.rotation.x = tilt + (rnd() - 0.5) * 0.14;
    p.castShadow = p.receiveShadow = true;
    head.add(p);
  }
}
petalRing(24, 0.92, 1.15, 0.17, 0.02, -0.18, petalMat, 0);              // front ring
petalRing(24, 0.94, 1.05, 0.19, -0.07, -0.42, petalMat2, Math.PI / 24); // back ring

// turn the whole plant slightly toward the light
flower.rotation.y = 0.35;

// ---------- ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 48),
  new THREE.MeshStandardMaterial({ color: 0x9fb37e, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// extra soft contact shadow
const shadowTex = canvasTex(128, (ctx, s) => {
  const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  g.addColorStop(0, 'rgba(30,40,20,0.35)');
  g.addColorStop(1, 'rgba(30,40,20,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, s, s);
});
const soft = new THREE.Mesh(
  new THREE.PlaneGeometry(3.2, 3.2),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
);
soft.rotation.x = -Math.PI / 2;
soft.position.y = 0.01;
scene.add(soft);

// ---------- animate ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  flower.rotation.z = Math.sin(t * 0.6) * 0.008;   // gentle sway
  head.rotation.z = Math.sin(t * 0.8) * 0.01;
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
