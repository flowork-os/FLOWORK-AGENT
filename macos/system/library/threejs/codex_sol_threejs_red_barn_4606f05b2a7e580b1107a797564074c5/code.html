<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weathered Red Barn</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #b8cad3; }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 18px;
      bottom: 16px;
      color: rgba(255,255,255,.88);
      font: 12px/1.4 system-ui, sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(0,0,0,.55);
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Weathered Barn · Drag to orbit · Scroll to zoom</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb9cbd3);
    scene.fog = new THREE.Fog(0xb9cbd3, 42, 105);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 180);
    camera.position.set(23, 13, 28);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.6, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.32;
    controls.minDistance = 16;
    controls.maxDistance = 65;
    controls.maxPolarAngle = Math.PI * 0.48;

    const hemi = new THREE.HemisphereLight(0xd9e8ef, 0x6c664c, 1.65);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffe2b5, 3.4);
    sun.position.set(-20, 27, 18);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -28;
    sun.shadow.camera.right = 28;
    sun.shadow.camera.top = 26;
    sun.shadow.camera.bottom = -20;
    sun.shadow.camera.near = 2;
    sun.shadow.camera.far = 75;
    sun.shadow.bias = -0.00015;
    sun.shadow.normalBias = 0.025;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x9bbbd0, 0.65);
    fill.position.set(22, 11, -18);
    scene.add(fill);

    const barn = new THREE.Group();
    scene.add(barn);

    const W = 12;
    const D = 18;
    const WALL_H = 5;
    const FRONT_Z = D / 2;
    const BACK_Z = -D / 2;

    let seed = 73621;
    function random() {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    }

    function mat(color, roughness = 0.8, metalness = 0) {
      return new THREE.MeshStandardMaterial({ color, roughness, metalness });
    }

    const redPalette = [
      0x7d2924, 0x87302a, 0x91352e, 0x78302b,
      0x984039, 0x82332e, 0x6f2926, 0x8d3932
    ];
    const fadedRed = mat(0x82322d, 0.94);
    const darkWood = mat(0x4b3026, 0.96);
    const trimMat = mat(0xd0c1a0, 0.88);
    const trimDark = mat(0x6d5642, 0.94);
    const concreteMat = mat(0x88867f, 0.97);
    const glassMat = new THREE.MeshStandardMaterial({
      color: 0x385567,
      roughness: 0.22,
      metalness: 0.08
    });
    const roofMat = mat(0x727778, 0.55, 0.62);
    const roofEdgeMat = mat(0x555a5b, 0.58, 0.68);
    const rustMat = mat(0x76452e, 0.9, 0.08);
    const blackMetal = mat(0x242526, 0.52, 0.72);

    function meshBox(size, position, material, parent = barn) {
      const object = new THREE.Mesh(
        new THREE.BoxGeometry(size.x, size.y, size.z),
        material
      );
      object.position.copy(position);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function roofHeight(x) {
      const ax = Math.abs(x);
      if (ax <= 2.5) return 8.5;
      if (ax <= 4.5) return 8.5 - (ax - 2.5) * 0.75;
      return 7 - (ax - 4.5) * (2 / 1.5);
    }

    meshBox(
      new THREE.Vector3(W + 0.25, 0.48, D + 0.2),
      new THREE.Vector3(0, 0.05, 0),
      concreteMat
    );

    meshBox(
      new THREE.Vector3(W - 0.25, 4.7, D - 0.2),
      new THREE.Vector3(0, 2.68, 0),
      fadedRed
    );

    const boardWidth = 0.36;
    for (let z = BACK_Z + 0.22; z <= FRONT_Z - 0.2; z += boardWidth) {
      for (const side of [-1, 1]) {
        const tone = redPalette[Math.floor(random() * redPalette.length)];
        const board = meshBox(
          new THREE.Vector3(0.075, 4.72, boardWidth - 0.018),
          new THREE.Vector3(side * (W / 2 + 0.022), 2.7, z),
          mat(tone, 0.96)
        );
        board.position.x += side * (random() - 0.5) * 0.018;
      }
    }

    function addGableBoards(z, outward) {
      for (let x = -W / 2 + boardWidth / 2; x < W / 2; x += boardWidth) {
        const top = roofHeight(x);
        const height = top - 0.37;
        const tone = redPalette[Math.floor(random() * redPalette.length)];
        const board = meshBox(
          new THREE.Vector3(boardWidth - 0.018, height, 0.075),
          new THREE.Vector3(x, 0.37 + height / 2, z + outward * 0.024),
          mat(tone, 0.96)
        );
        board.position.z += outward * random() * 0.012;
      }
    }

    addGableBoards(FRONT_Z, 1);
    addGableBoards(BACK_Z, -1);

    const cornerPostSize = new THREE.Vector3(0.2, 5.05, 0.2);
    for (const x of [-W / 2 - 0.06, W / 2 + 0.06]) {
      for (const z of [BACK_Z - 0.06, FRONT_Z + 0.06]) {
        meshBox(cornerPostSize, new THREE.Vector3(x, 2.72, z), trimDark);
      }
    }

    function addSideWindow(side, z, y = 2.75) {
      const group = new THREE.Group();
      group.position.set(side * (W / 2 + 0.085), y, z);
      barn.add(group);

      const glass = meshBox(
        new THREE.Vector3(0.07, 1.52, 1.45),
        new THREE.Vector3(0, 0, 0),
        glassMat,
        group
      );
      glass.castShadow = false;

      meshBox(new THREE.Vector3(0.12, 1.82, 0.13), new THREE.Vector3(0, 0, -0.79), trimMat, group);
      meshBox(new THREE.Vector3(0.12, 1.82, 0.13), new THREE.Vector3(0, 0, 0.79), trimMat, group);
      meshBox(new THREE.Vector3(0.12, 0.13, 1.7), new THREE.Vector3(0, 0.84, 0), trimMat, group);
      meshBox(new THREE.Vector3(0.12, 0.16, 1.78), new THREE.Vector3(0, -0.84, 0), trimMat, group);
      meshBox(new THREE.Vector3(0.13, 0.075, 1.5), new THREE.Vector3(side * 0.018, 0, 0), trimMat, group);
      meshBox(new THREE.Vector3(0.13, 1.5, 0.075), new THREE.Vector3(side * 0.018, 0, 0), trimMat, group);

      const sill = meshBox(
        new THREE.Vector3(0.28, 0.13, 1.9),
        new THREE.Vector3(side * 0.055, -0.95, 0),
        trimDark,
        group
      );
      sill.rotation.z = side * -0.04;
    }

    addSideWindow(-1, -4.7);
    addSideWindow(-1, 3.0);
    addSideWindow(1, -3.8);
    addSideWindow(1, 3.8);

    function addFrontWindow(x, y, scale = 1) {
      const z = FRONT_Z + 0.115;
      meshBox(new THREE.Vector3(1.4 * scale, 1.55 * scale, 0.07), new THREE.Vector3(x, y, z), glassMat);
      meshBox(new THREE.Vector3(0.13, 1.8 * scale, 0.16), new THREE.Vector3(x - 0.78 * scale, y, z + 0.015), trimMat);
      meshBox(new THREE.Vector3(0.13, 1.8 * scale, 0.16), new THREE.Vector3(x + 0.78 * scale, y, z + 0.015), trimMat);
      meshBox(new THREE.Vector3(1.68 * scale, 0.13, 0.16), new THREE.Vector3(x, y + 0.84 * scale, z + 0.015), trimMat);
      meshBox(new THREE.Vector3(1.8 * scale, 0.16, 0.25), new THREE.Vector3(x, y - 0.86 * scale, z + 0.045), trimDark);
      meshBox(new THREE.Vector3(0.07, 1.48 * scale, 0.12), new THREE.Vector3(x, y, z + 0.07), trimMat);
      meshBox(new THREE.Vector3(1.38 * scale, 0.07, 0.12), new THREE.Vector3(x, y, z + 0.07), trimMat);
    }

    addFrontWindow(-4.6, 2.7, 0.78);
    addFrontWindow(4.6, 2.7, 0.78);
    addFrontWindow(0, 6.45, 0.75);

    const door = new THREE.Group();
    door.position.set(0, 0, FRONT_Z + 0.19);
    barn.add(door);

    const doorW = 5.55;
    const doorH = 4.62;
    meshBox(
      new THREE.Vector3(doorW, doorH, 0.17),
      new THREE.Vector3(0, 0.47 + doorH / 2, 0),
      mat(0x6f2925, 0.97),
      door
    );

    for (let x = -doorW / 2 + 0.16; x < doorW / 2; x += 0.31) {
      const tone = redPalette[Math.floor(random() * redPalette.length)];
      meshBox(
        new THREE.Vector3(0.285, doorH - 0.12, 0.045),
        new THREE.Vector3(x, 0.49 + doorH / 2, 0.105),
        mat(tone, 0.98),
        door
      );
    }

    meshBox(new THREE.Vector3(doorW + 0.15, 0.2, 0.22), new THREE.Vector3(0, 0.56, 0.17), trimMat, door);
    meshBox(new THREE.Vector3(doorW + 0.15, 0.2, 0.22), new THREE.Vector3(0, 4.98, 0.17), trimMat, door);
    meshBox(new THREE.Vector3(0.2, doorH + 0.12, 0.22), new THREE.Vector3(-doorW / 2 + 0.11, 2.77, 0.17), trimMat, door);
    meshBox(new THREE.Vector3(0.2, doorH + 0.12, 0.22), new THREE.Vector3(doorW / 2 - 0.11, 2.77, 0.17), trimMat, door);

    function addDiagonal(parent, ax, ay, bx, by, thickness, material, z) {
      const dx = bx - ax;
      const dy = by - ay;
      const length = Math.hypot(dx, dy);
      const beam = meshBox(
        new THREE.Vector3(length, thickness, 0.18),
        new THREE.Vector3((ax + bx) / 2, (ay + by) / 2, z),
        material,
        parent
      );
      beam.rotation.z = Math.atan2(dy, dx);
      return beam;
    }

    addDiagonal(door, -2.55, 0.76, 2.55, 4.82, 0.2, trimMat, 0.18);
    addDiagonal(door, 2.55, 0.76, -2.55, 4.82, 0.2, trimMat, 0.2);

    meshBox(
      new THREE.Vector3(doorW + 1.05, 0.16, 0.2),
      new THREE.Vector3(0, 5.42, FRONT_Z + 0.34),
      blackMetal
    );

    for (const x of [-2.25, 2.25]) {
      const wheel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.16, 0.16, 0.12, 18),
        blackMetal
      );
      wheel.rotation.x = Math.PI / 2;
      wheel.position.set(x, 5.28, FRONT_Z + 0.38);
      wheel.castShadow = true;
      barn.add(wheel);
    }

    meshBox(
      new THREE.Vector3(6.3, 0.32, 1.35),
      new THREE.Vector3(0, 0.31, FRONT_Z + 0.78),
      concreteMat
    );
    meshBox(
      new THREE.Vector3(5.8, 0.13, 1.85),
      new THREE.Vector3(0, 0.12, FRONT_Z + 1.42),
      mat(0x77766f, 0.99)
    );

    const roofPoints = [
      [-6.15, 4.96],
      [-4.55, 7.06],
      [-2.52, 8.56],
      [2.52, 8.56],
      [4.55, 7.06],
      [6.15, 4.96]
    ];

    function addRoofSegment(a, b, index) {
      const dx = b[0] - a[0];
      const dy = b[1] - a[1];
      const length = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);
      const midX = (a[0] + b[0]) / 2;
      const midY = (a[1] + b[1]) / 2;
      const normal = new THREE.Vector3(-dy / length, dx / length, 0);

      const panel = meshBox(
        new THREE.Vector3(length + 0.13, 0.13, D + 0.75),
        new THREE.Vector3(midX + normal.x * 0.025, midY + normal.y * 0.025, 0),
        roofMat
      );
      panel.rotation.z = angle;

      for (let z = BACK_Z - 0.25; z <= FRONT_Z + 0.25; z += 0.56) {
        const ribGeometry = new THREE.CylinderGeometry(0.026, 0.026, length + 0.13, 8);
        const rib = new THREE.Mesh(ribGeometry, index % 2 ? roofEdgeMat : roofMat);
        rib.position.set(
          midX + normal.x * 0.11,
          midY + normal.y * 0.11,
          z
        );
        rib.quaternion.setFromUnitVectors(
          new THREE.Vector3(0, 1, 0),
          new THREE.Vector3(dx / length, dy / length, 0)
        );
        rib.castShadow = true;
        barn.add(rib);
      }

      for (let z = BACK_Z + 2.4; z < FRONT_Z; z += 3.05) {
        const seam = meshBox(
          new THREE.Vector3(length + 0.12, 0.035, 0.065),
          new THREE.Vector3(midX + normal.x * 0.12, midY + normal.y * 0.12, z),
          roofEdgeMat
        );
        seam.rotation.z = angle;
      }

      const rustCount = index === 2 ? 5 : 8;
      for (let i = 0; i < rustCount; i++) {
        const t = 0.12 + random() * 0.76;
        const patch = meshBox(
          new THREE.Vector3(0.18 + random() * 0.55, 0.018, 0.15 + random() * 0.42),
          new THREE.Vector3(
            a[0] + dx * t + normal.x * 0.13,
            a[1] + dy * t + normal.y * 0.13,
            BACK_Z + 0.6 + random() * (D - 1.2)
          ),
          rustMat
        );
        patch.rotation.z = angle;
      }
    }

    for (let i = 0; i < roofPoints.length - 1; i++) {
      addRoofSegment(roofPoints[i], roofPoints[i + 1], i);
    }

    const ridge = new THREE.Mesh(
      new THREE.CylinderGeometry(0.13, 0.13, D + 1.05, 12, 1, false, 0, Math.PI),
      roofEdgeMat
    );
    ridge.rotation.x = Math.PI / 2;
    ridge.position.set(0, 8.65, 0);
    ridge.castShadow = true;
    barn.add(ridge);

    for (const z of [BACK_Z - 0.3, FRONT_Z + 0.3]) {
      for (let i = 0; i < roofPoints.length - 1; i++) {
        const a = roofPoints[i];
        const b = roofPoints[i + 1];
        const dx = b[0] - a[0];
        const dy = b[1] - a[1];
        const length = Math.hypot(dx, dy);
        const edge = meshBox(
          new THREE.Vector3(length + 0.08, 0.17, 0.12),
          new THREE.Vector3((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, z),
          trimDark
        );
        edge.rotation.z = Math.atan2(dy, dx);
      }
    }

    for (let i = 0; i < 28; i++) {
      const x = -5.65 + random() * 11.3;
      const y = 0.75 + random() * 3.9;
      const frontVisible = Math.abs(x) > 3.05 || y > 5.15;
      if (!frontVisible) continue;
      const streak = meshBox(
        new THREE.Vector3(0.025 + random() * 0.035, 0.22 + random() * 0.65, 0.012),
        new THREE.Vector3(x, y, FRONT_Z + 0.105),
        mat(random() > 0.5 ? 0x56332d : 0xa05a49, 1)
      );
      streak.castShadow = false;
    }

    const groundMat = mat(0x68724a, 1);
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(72, 96),
      groundMat
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.205;
    ground.receiveShadow = true;
    scene.add(ground);

    const yard = new THREE.Mesh(
      new THREE.CircleGeometry(24, 64),
      mat(0x777a54, 1)
    );
    yard.rotation.x = -Math.PI / 2;
    yard.position.set(0, -0.185, 2);
    yard.receiveShadow = true;
    scene.add(yard);

    const pathShape = new THREE.Shape();
    pathShape.moveTo(-3.3, 0);
    pathShape.bezierCurveTo(-3.7, 8, -5.4, 17, -7.2, 31);
    pathShape.lineTo(5.8, 31);
    pathShape.bezierCurveTo(4.4, 18, 3.6, 8, 3.3, 0);
    pathShape.closePath();

    const path = new THREE.Mesh(
      new THREE.ShapeGeometry(pathShape, 24),
      mat(0x927d5c, 1)
    );
    path.rotation.x = -Math.PI / 2;
    path.position.set(0, -0.15, FRONT_Z + 1.5);
    path.receiveShadow = true;
    scene.add(path);

    function addHayBale(x, z, rotation = 0) {
      const bale = new THREE.Group();
      bale.position.set(x, 0.35, z);
      bale.rotation.y = rotation;
      scene.add(bale);

      const body = meshBox(
        new THREE.Vector3(1.45, 0.75, 0.82),
        new THREE.Vector3(0, 0, 0),
        mat(0xb38b43, 1),
        bale
      );
      body.geometry.translate(0, 0, 0);

      for (const offset of [-0.42, 0.42]) {
        meshBox(
          new THREE.Vector3(0.035, 0.79, 0.86),
          new THREE.Vector3(offset, 0, 0),
          mat(0x746445, 0.9),
          bale
        );
      }
    }

    addHayBale(-7.7, 5.8, -0.15);
    addHayBale(-8.2, 4.75, 0.08);
    addHayBale(7.8, -4.8, 0.18);

    function addFence(startX, startZ, length, alongX) {
      const group = new THREE.Group();
      group.position.set(startX, 0, startZ);
      scene.add(group);

      const spacing = 2.5;
      const count = Math.floor(length / spacing);
      for (let i = 0; i <= count; i++) {
        const px = alongX ? i * spacing : 0;
        const pz = alongX ? 0 : i * spacing;
        meshBox(
          new THREE.Vector3(0.16, 1.35, 0.16),
          new THREE.Vector3(px, 0.45, pz),
          darkWood,
          group
        );
      }
      for (const y of [0.4, 0.92]) {
        meshBox(
          alongX
            ? new THREE.Vector3(length, 0.11, 0.12)
            : new THREE.Vector3(0.12, 0.11, length),
          alongX
            ? new THREE.Vector3(length / 2, y, 0)
            : new THREE.Vector3(0, y, length / 2),
          trimDark,
          group
        );
      }
    }

    addFence(-20, -12, 13, true);
    addFence(8, -13, 16, true);
    addFence(-20, -12, 15, false);

    function addGrassTuft(x, z, scale) {
      const group = new THREE.Group();
      group.position.set(x, -0.08, z);
      scene.add(group);
      const grassMat = mat(random() > 0.5 ? 0x4f613d : 0x657047, 1);
      for (let i = 0; i < 5; i++) {
        const blade = meshBox(
          new THREE.Vector3(0.025, 0.35 + random() * 0.35, 0.018),
          new THREE.Vector3((random() - 0.5) * 0.25, 0.22, (random() - 0.5) * 0.25),
          grassMat,
          group
        );
        blade.rotation.z = (random() - 0.5) * 0.45;
        blade.rotation.x = (random() - 0.5) * 0.35;
        blade.scale.multiplyScalar(scale);
        blade.castShadow = false;
      }
    }

    for (let i = 0; i < 85; i++) {
      const angle = random() * Math.PI * 2;
      const radius = 9 + random() * 24;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      addGrassTuft(x, z, 0.65 + random() * 0.9);
    }

    function addTree(x, z, scale) {
      const tree = new THREE.Group();
      tree.position.set(x, 0, z);
      tree.scale.setScalar(scale);
      scene.add(tree);

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.24, 0.38, 3.8, 8),
        mat(0x544333, 1)
      );
      trunk.position.y = 1.7;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      tree.add(trunk);

      const foliageMat = mat(0x43563b, 1);
      const foliageMat2 = mat(0x526447, 1);
      const clusters = [
        [0, 4.4, 0, 1.7],
        [-0.9, 3.8, 0.15, 1.25],
        [0.85, 3.9, -0.2, 1.35],
        [0.2, 5.35, 0.05, 1.25]
      ];
      for (let i = 0; i < clusters.length; i++) {
        const c = clusters[i];
        const crown = new THREE.Mesh(
          new THREE.IcosahedronGeometry(c[3], 1),
          i % 2 ? foliageMat2 : foliageMat
        );
        crown.position.set(c[0], c[1], c[2]);
        crown.scale.y = 1.12;
        crown.rotation.set(random(), random(), random());
        crown.castShadow = true;
        crown.receiveShadow = true;
        tree.add(crown);
      }
    }

    addTree(-19, 4, 1.25);
    addTree(20, -8, 1.05);
    addTree(17, 13, 0.85);
    addTree(-22, -16, 0.95);

    const chimney = meshBox(
      new THREE.Vector3(0.65, 2.0, 0.65),
      new THREE.Vector3(3.65, 7.2, -3.9),
      mat(0x6b3c31, 0.94)
    );
    chimney.rotation.z = -0.64;
    meshBox(
      new THREE.Vector3(0.84, 0.16, 0.84),
      new THREE.Vector3(4.18, 7.96, -3.9),
      blackMetal
    );

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      sun.intensity = 3.35 + Math.sin(elapsed * 0.12) * 0.05;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
