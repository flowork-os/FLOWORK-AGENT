<div id="title">Last Chance Service · Route 66</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd86d43);
scene.fog = new THREE.FogExp2(0xc8754e, 0.0075);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 500);
camera.position.set(35, 22, 38);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.22;
controls.minDistance = 22;
controls.maxDistance = 90;
controls.maxPolarAngle = Math.PI * 0.48;

let seed = 1966;
function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a, b) {
  return a + (b - a) * rand();
}

const C = {
  cream: 0xe7d4ad,
  fadedCream: 0xbcae8e,
  red: 0xa63125,
  darkRed: 0x5b201b,
  teal: 0x327b78,
  darkTeal: 0x174d4c,
  rust: 0x723a26,
  steel: 0x797c72,
  rubber: 0x171613,
  glass: 0x98c8c5,
  concrete: 0x8e816c,
  desert: 0xae653c,
  dark: 0x211d19
};

function mat(color, roughness = 0.75, metalness = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness });
}
const mats = {
  cream: mat(C.cream, 0.86),
  red: mat(C.red, 0.7),
  darkRed: mat(C.darkRed, 0.84),
  teal: mat(C.teal, 0.72),
  darkTeal: mat(C.darkTeal, 0.8),
  rust: mat(C.rust, 0.95),
  steel: mat(C.steel, 0.48, 0.55),
  rubber: mat(C.rubber, 0.92),
  dark: mat(C.dark, 0.88),
  chrome: mat(0xb8bcb2, 0.18, 0.85),
  glass: new THREE.MeshPhysicalMaterial({
    color: C.glass,
    roughness: 0.22,
    metalness: 0,
    transmission: 0.25,
    transparent: true,
    opacity: 0.72
  })
};

function mesh(geometry, material, parent = scene, shadows = true) {
  const object = new THREE.Mesh(geometry, material);
  if (shadows) {
    object.castShadow = true;
    object.receiveShadow = true;
  }
  parent.add(object);
  return object;
}
function box(w, h, d, material, parent, x = 0, y = 0, z = 0) {
  const object = mesh(new THREE.BoxGeometry(w, h, d), material, parent);
  object.position.set(x, y, z);
  return object;
}
function cyl(r1, r2, h, material, parent, x = 0, y = 0, z = 0, segments = 20) {
  const object = mesh(new THREE.CylinderGeometry(r1, r2, h, segments), material, parent);
  object.position.set(x, y, z);
  return object;
}
function plane(w, h, material, parent, x = 0, y = 0, z = 0) {
  const object = mesh(new THREE.PlaneGeometry(w, h), material, parent);
  object.position.set(x, y, z);
  return object;
}

function canvasTexture(width, height, painter) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  painter(ctx, width, height);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const skyTexture = canvasTexture(16, 512, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#452d55');
  g.addColorStop(0.32, '#a94848');
  g.addColorStop(0.68, '#e27c43');
  g.addColorStop(1, '#f5bd67');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
});
const skyMat = new THREE.MeshBasicMaterial({ map: skyTexture, side: THREE.BackSide });
const sky = mesh(new THREE.SphereGeometry(190, 48, 24), skyMat, scene, false);
sky.scale.y = 0.58;

const sun = mesh(
  new THREE.CircleGeometry(5.2, 48),
  new THREE.MeshBasicMaterial({ color: 0xffd17a, fog: false }),
  scene,
  false
);
sun.position.set(-58, 24, -92);
sun.lookAt(camera.position);

const hemi = new THREE.HemisphereLight(0xffb77a, 0x442a29, 1.8);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffb36a, 4.6);
key.position.set(-38, 42, -36);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -55;
key.shadow.camera.right = 55;
key.shadow.camera.top = 45;
key.shadow.camera.bottom = -45;
key.shadow.camera.near = 1;
key.shadow.camera.far = 130;
key.shadow.bias = -0.0003;
scene.add(key);

const fill = new THREE.DirectionalLight(0x6b78a7, 0.65);
fill.position.set(30, 18, 35);
scene.add(fill);

const dirtTexture = canvasTexture(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#a8643e';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 10000; i++) {
    const v = Math.floor(range(70, 155));
    ctx.fillStyle = `rgba(${v},${Math.floor(v * 0.62)},${Math.floor(v * 0.42)},${range(0.03, 0.13)})`;
    const s = range(0.4, 2.5);
    ctx.fillRect(range(0, w), range(0, h), s, s);
  }
});
dirtTexture.wrapS = dirtTexture.wrapT = THREE.RepeatWrapping;
dirtTexture.repeat.set(16, 16);
const ground = plane(
  300,
  300,
  new THREE.MeshStandardMaterial({ map: dirtTexture, roughness: 1 }),
  scene,
  0,
  -0.12,
  0
);
ground.rotation.x = -Math.PI / 2;

const concreteTexture = canvasTexture(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#89816f';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) {
    const a = range(0.02, 0.15);
    ctx.fillStyle = rand() > 0.5 ? `rgba(30,25,20,${a})` : `rgba(230,215,185,${a})`;
    ctx.fillRect(range(0, w), range(0, h), range(0.5, 2.2), range(0.5, 2.2));
  }
  ctx.strokeStyle = 'rgba(47,38,31,.7)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 22; i++) {
    let x = range(0, w);
    let y = range(0, h);
    ctx.beginPath();
    ctx.moveTo(x, y);
    for (let j = 0; j < 5; j++) {
      x += range(-25, 25);
      y += range(10, 42);
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
});
concreteTexture.wrapS = concreteTexture.wrapT = THREE.RepeatWrapping;
concreteTexture.repeat.set(3, 2);
const slab = box(
  48,
  0.34,
  32,
  new THREE.MeshStandardMaterial({ map: concreteTexture, roughness: 0.96 }),
  scene,
  0,
  0,
  0
);
slab.position.z = 1;

function makeMountain(x, z, sx, sy, color) {
  const geometry = new THREE.ConeGeometry(1, 1, 7);
  const mountain = mesh(geometry, mat(color, 1), scene, false);
  mountain.scale.set(sx, sy, sx * range(0.7, 1.25));
  mountain.position.set(x, sy * 0.48 - 0.1, z);
  mountain.rotation.y = range(0, Math.PI);
}
for (let i = 0; i < 18; i++) {
  const angle = range(Math.PI * 0.82, Math.PI * 2.18);
  const radius = range(75, 120);
  makeMountain(
    Math.sin(angle) * radius,
    Math.cos(angle) * radius,
    range(8, 22),
    range(5, 15),
    i % 3 === 0 ? 0x75413a : 0x82493d
  );
}

const station = new THREE.Group();
station.position.set(-7, 0.2, -4);
scene.add(station);

box(23, 7.4, 10, mats.cream, station, 0, 3.7, -3.8);
box(23.4, 0.55, 10.5, mats.darkTeal, station, 0, 7.65, -3.8);
box(23.8, 0.24, 10.9, mats.cream, station, 0, 8.05, -3.8);

const wallStripes = new THREE.Group();
station.add(wallStripes);
box(23.15, 0.48, 0.12, mats.red, wallStripes, 0, 2.0, 1.24);
box(23.15, 0.18, 0.13, mats.darkTeal, wallStripes, 0, 1.42, 1.25);

const garage = new THREE.Group();
garage.position.set(-5.2, 0, 1.25);
station.add(garage);
box(10.8, 6.2, 0.25, mats.dark, garage, 0, 3.15, 0);
box(9.7, 5.45, 0.2, mat(0x878579, 0.8), garage, 0, 2.85, 0.18);
for (let y = 0.55; y < 5.5; y += 0.72) {
  box(9.4, 0.07, 0.12, mats.dark, garage, 0, y, 0.31);
}
for (let x = -5.2; x <= 5.2; x += 10.4) {
  box(0.45, 6.45, 0.45, mats.darkTeal, garage, x, 3.2, 0.12);
}
box(11.2, 0.48, 0.45, mats.darkTeal, garage, 0, 6.35, 0.12);

const office = new THREE.Group();
office.position.set(6.8, 0, 1.25);
station.add(office);
box(7.5, 6.25, 0.25, mats.darkTeal, office, 0, 3.15, 0);
box(6.7, 5.45, 0.16, mats.glass, office, 0, 3.1, 0.18);
box(0.2, 5.5, 0.3, mats.cream, office, 0, 3.1, 0.32);
box(6.8, 0.18, 0.3, mats.cream, office, 0, 3.9, 0.32);
box(1.3, 5.5, 0.35, mats.red, office, 2.65, 3.1, 0.38);
const doorGlass = box(0.92, 2.55, 0.08, mats.glass, office, 2.65, 3.75, 0.58);
const handle = cyl(0.06, 0.06, 0.65, mats.chrome, office, 2.16, 2.45, 0.62, 10);
handle.rotation.z = Math.PI / 2;

const interiorLight = new THREE.PointLight(0xffca82, 12, 12, 2);
interiorLight.position.set(0, 4.5, -1);
office.add(interiorLight);

const canopy = new THREE.Group();
canopy.position.set(2.5, 0, 6.5);
station.add(canopy);
box(31, 0.65, 8.7, mats.cream, canopy, 0, 7.6, 0);
box(31.3, 0.45, 9, mats.red, canopy, 0, 7.86, 0);
box(31.8, 0.14, 9.4, mats.darkTeal, canopy, 0, 8.16, 0);
for (const x of [-11.3, 11.3]) {
  cyl(0.24, 0.3, 7.45, mats.darkTeal, canopy, x, 3.75, 0, 16);
  cyl(0.42, 0.42, 0.22, mats.chrome, canopy, x, 0.11, 0, 16);
}
for (const x of [-8, 0, 8]) {
  const light = box(
    3.5,
    0.08,
    1.0,
    new THREE.MeshStandardMaterial({
      color: 0xffe3ad,
      emissive: 0xffb957,
      emissiveIntensity: 2
    }),
    canopy,
    x,
    7.23,
    0
  );
  light.castShadow = false;
}

function makePump(x, z, label) {
  const pump = new THREE.Group();
  pump.position.set(x, 0.25, z);
  scene.add(pump);

  cyl(1.25, 1.25, 0.28, mats.darkTeal, pump, 0, 0.14, 0, 24);
  box(1.95, 3.5, 1.65, mats.red, pump, 0, 2.0, 0);
  const top = mesh(
    new THREE.CapsuleGeometry(0.98, 0.85, 8, 20),
    mats.cream,
    pump
  );
  top.scale.z = 0.82;
  top.position.y = 4.05;

  box(1.52, 1.18, 0.08, mats.dark, pump, 0, 3.25, 0.86);
  box(1.32, 0.92, 0.05, mat(0xd8cfaa, 0.45), pump, 0, 3.25, 0.92);

  const dial = cyl(0.28, 0.28, 0.05, mats.dark, pump, 0, 3.28, 0.99, 24);
  dial.rotation.x = Math.PI / 2;
  const needle = box(0.025, 0.35, 0.025, mats.red, pump, 0, 3.38, 1.04);
  needle.rotation.z = 0.7;

  const textTex = canvasTexture(256, 96, (ctx, w, h) => {
    ctx.fillStyle = '#eee1b7';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#9e2c24';
    ctx.font = 'bold 55px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, w / 2, h / 2);
    ctx.strokeStyle = '#286765';
    ctx.lineWidth = 8;
    ctx.strokeRect(4, 4, w - 8, h - 8);
  });
  const badge = plane(
    1.5,
    0.58,
    new THREE.MeshStandardMaterial({ map: textTex }),
    pump,
    0,
    4.42,
    0.85
  );

  const hoseCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(1.02, 3.4, 0),
    new THREE.Vector3(1.7, 2.8, 0),
    new THREE.Vector3(1.65, 0.8, 0),
    new THREE.Vector3(1.2, 1.2, 0)
  ]);
  const hose = mesh(
    new THREE.TubeGeometry(hoseCurve, 24, 0.065, 8, false),
    mats.rubber,
    pump
  );
  const nozzle = box(0.16, 0.66, 0.14, mats.chrome, pump, 1.17, 1.5, 0);
  nozzle.rotation.z = -0.18;
  box(0.24, 0.2, 0.22, mats.dark, pump, 1.14, 1.2, 0);
  return needle;
}
const pumpNeedleA = makePump(-3.2, 4.9, 'REGULAR');
const pumpNeedleB = makePump(4.0, 4.9, 'ETHYL');

function wheel(parent, x, y, z) {
  const tire = mesh(
    new THREE.TorusGeometry(0.92, 0.3, 12, 24),
    mats.rubber,
    parent
  );
  tire.position.set(x, y, z);
  tire.rotation.y = Math.PI / 2;
  const hub = cyl(0.42, 0.42, 0.32, mats.chrome, parent, x, y, z, 16);
  hub.rotation.z = Math.PI / 2;
  const cap = cyl(0.15, 0.15, 0.36, mats.darkRed, parent, x, y, z, 16);
  cap.rotation.z = Math.PI / 2;
}

const truck = new THREE.Group();
truck.position.set(11.5, 0.45, -0.2);
truck.rotation.y = -0.18;
scene.add(truck);

box(7.4, 0.7, 3.45, mats.rust, truck, 0, 1.25, 0);
box(3.2, 1.85, 3.35, mats.teal, truck, -1.7, 2.25, 0);
box(3.0, 1.2, 3.2, mats.teal, truck, -1.45, 3.75, 0);
box(3.7, 1.65, 3.2, mats.darkRed, truck, 2.25, 2.05, 0);
box(3.2, 0.18, 2.8, mats.rust, truck, 2.2, 1.35, 0);
box(0.18, 1.4, 3.2, mats.rust, truck, 4.05, 2.0, 0);
box(1.9, 0.88, 3.25, mats.teal, truck, -3.55, 2.05, 0);

const hood = box(1.3, 0.22, 3.3, mats.teal, truck, -4.35, 2.55, 0);
hood.rotation.z = -0.11;
box(0.25, 0.7, 3.15, mats.chrome, truck, -4.9, 1.65, 0);
box(0.12, 0.35, 2.3, mats.dark, truck, -5.04, 2.18, 0);

for (const z of [-1.74, 1.74]) {
  wheel(truck, -2.65, 1.0, z);
  wheel(truck, 2.75, 1.0, z);
}
const windshield = box(0.08, 1.25, 2.65, mats.glass, truck, -2.35, 3.75, 0);
windshield.rotation.z = -0.15;
box(0.08, 1.2, 0.08, mats.dark, truck, -2.45, 3.74, 0);
box(2.0, 0.08, 0.08, mats.dark, truck, -2.38, 3.74, 0);
for (const z of [-1.36, 1.36]) {
  const headlight = cyl(
    0.32,

    0.12,
    new THREE.MeshStandardMaterial({
      color: 0xffe5ad,

    }),

  );

}
box(0.12, 0.7, 0.12, mats.dark, truck, -1.0, 3.25, 1.69);
const mirror = cyl(0.28, 0.28, 0.06, mats.chrome, truck, -1.0, 3.6, 1.75, 16);
mirror.rotation.x = Math.PI / 2;

function tireStack(x, z) {
  const group = new THREE.Group();
  group.position.set(x, 0.15, z);
  scene.add(group);
  for (let i = 0; i < 4; i++) {
    const tire = mesh(
      new THREE.TorusGeometry(0.78, 0.28, 10, 22),
      mats.rubber,
      group
    );
    tire.rotation.x = Math.PI / 2;
    tire.position.set(range(-0.08, 0.08), 0.34 + i * 0.52, range(-0.08, 0.08));
    tire.rotation.z = range(-0.08, 0.08);
  }
}
tireStack(-17.2, 0.5);

const vending = new THREE.Group();
vending.position.set(7.1, 0.3, -9.15);

box(1.75, 2.1, 0.08, mats.dark, vending, 0, 3.1, 0.77);
const sodaTexture = canvasTexture(256, 300, (ctx, w, h) => {

});
const sodaMat = new THREE.MeshStandardMaterial({

});
plane(1.65, 1.95, sodaMat, vending, 0, 3.15, 0.82);
box(1.7, 0.6, 0.08, mats.dark, vending, 0, 1.25, 0.78);
box(0.32, 0.55, 0.12, mats.chrome, vending, 0.65, 2.0, 0.8);

cyl(0.22, 0.32, 13.5, mats.steel, signRig, 0, 6.75, 0, 16);

function cactus(x, z, scale = 1) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  group.scale.setScalar(scale);
  scene.add(group);
  const cactusMat = mat(rand() > 0.5 ? 0x3d6650 : 0x4b7657, 1);
  cyl(0.38, 0.48, 4.5, cactusMat, group, 0, 2.25, 0, 10);
  const arm1 = cyl(0.22, 0.27, 2.0, cactusMat, group, 0.9, 2.7, 0, 10);
  arm1.rotation.z = -Math.PI / 2;
  const up1 = cyl(0.22, 0.25, 1.7, cactusMat, group, 1.8, 3.48, 0, 10);
  const arm2 = cyl(0.18, 0.23, 1.5, cactusMat, group, -0.7, 1.8, 0, 10);
  arm2.rotation.z = Math.PI / 2;
  cyl(0.18, 0.22, 1.25, cactusMat, group, -1.4, 2.32, 0, 10);
}

for (let i = 0; i < 55; i++) {

function makeTumbleweed() {
  const group = new THREE.Group();
  group.position.set(-29, 0.8, 11);
  scene.add(group);
  const material = new THREE.LineBasicMaterial({
    color: 0x6f4c2e,
    transparent: true,
    opacity: 0.85
  });
  for (let i = 0; i < 24; i++) {
    const points = [];
    const radius = range(0.55, 1.15);
    const tilt = range(0, Math.PI * 2);
    for (let j = 0; j <= 20; j++) {
      const a = j / 20 * Math.PI * 2;
      points.push(new THREE.Vector3(
        Math.cos(a) * radius,
        Math.sin(a) * radius,
        Math.sin(a * 2 + tilt) * 0.22
      ));
    }
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(points),
      material
    );
    line.rotation.set(range(0, Math.PI), range(0, Math.PI), range(0, Math.PI));
    group.add(line);
  }
  return group;
}
const tumbleweed = makeTumbleweed();

const oilDrums = new THREE.Group();
oilDrums.position.set(-17.8, 0.15, -6.5);
scene.add(oilDrums);
for (let i = 0; i < 3; i++) {

    0.65,
    0.65,
    1.85,
    i === 1 ? mats.teal : mats.rust,
    oilDrums,
    i * 1.25,
    0.95,
    range(-0.2, 0.2),
    20
  );
  for (const y of [-0.7, 0.7]) {
    const ring = mesh(new THREE.TorusGeometry(0.66, 0.035, 6, 20), mats.steel, drum);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = y;

}

  stripe.rotation.x = -Math.PI / 2;

}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  rotatingSign.rotation.y = t * 0.32;
  sodaMat.emissiveIntensity = 1.12 + Math.sin(t * 17) * 0.06 + Math.sin(t * 3) * 0.08;
  sodaLight.intensity = 4.5 + Math.sin(t * 13) * 0.35;
  pumpNeedleA.rotation.z = 0.7 + Math.sin(t * 1.7) * 0.08;
  pumpNeedleB.rotation.z = 0.7 + Math.sin(t * 1.4 + 2) * 0.06;

  tumbleweed.position.x = -29 + ((t * 1.35) % 58);
  tumbleweed.position.z = 11 + Math.sin(t * 0.45) * 3.5;
  tumbleweed.position.y = 0.85 + Math.abs(Math.sin(t * 2.7)) * 0.18;
  tumbleweed.rotation.z = -t * 1.9;
  tumbleweed.rotation.x = Math.sin(t * 0.7) * 0.35;

  sun.lookAt(camera.position);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
