<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Streetlight — Procedural three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15171a; }
  #app { position: fixed; inset: 0; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: rgba(230,236,244,0.55); letter-spacing: .3px;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hint">Modern LED streetlight · drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------------------------------------------------------------------------
// Renderer
// ---------------------------------------------------------------------------
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// ---------------------------------------------------------------------------
// Scene + environment (procedural reflections for realistic metal)
// ---------------------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171a);
scene.fog = new THREE.Fog(0x15171a, 24, 70);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------------------------------------------------------------------------
// Camera
// ---------------------------------------------------------------------------
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(7.5, 5.4, 8.5);

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.target.set(0, 4.6, 0);
controls.minDistance = 3.5;
controls.maxDistance = 26;
controls.maxPolarAngle = Math.PI * 0.495;

// ---------------------------------------------------------------------------
// Lighting: hemisphere fill + directional key (shadows) + fill + rim
// ---------------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x20242a, 0.55);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff4e6, 2.6);
keyLight.position.set(6, 13, 5.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.bias = -0.0002;
keyLight.shadow.normalBias = 0.02;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 42;
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 13;
keyLight.shadow.camera.bottom = -2;
keyLight.target.position.set(0.6, 4, 0);
scene.add(keyLight);
scene.add(keyLight.target);

const fillLight = new THREE.DirectionalLight(0xaec4dc, 0.7);
fillLight.position.set(-8, 5, 4);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xcfe0ff, 1.1);
rimLight.position.set(-4, 8, -9);
scene.add(rimLight);

// ---------------------------------------------------------------------------
// Ground plane — receives shadows only
// ---------------------------------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 120),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// ---------------------------------------------------------------------------
// Materials
// ---------------------------------------------------------------------------
const poleMetal = new THREE.MeshStandardMaterial({
  color: 0x9298a0, metalness: 0.92, roughness: 0.38, envMapIntensity: 1.15
});
const paintedMetal = new THREE.MeshStandardMaterial({
  color: 0x83888f, metalness: 0.55, roughness: 0.42, envMapIntensity: 1.0
});
const darkMetal = new THREE.MeshStandardMaterial({
  color: 0x33373d, metalness: 0.85, roughness: 0.5, envMapIntensity: 0.9
});
const baseMetal = new THREE.MeshStandardMaterial({
  color: 0x50555c, metalness: 0.8, roughness: 0.55, envMapIntensity: 0.95
});
const lensMaterial = new THREE.MeshStandardMaterial({
  color: 0xfff6e2, emissive: 0xffefcf, emissiveIntensity: 2.6,
  metalness: 0.0, roughness: 0.35
});
const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xdfe6ee, metalness: 0.0, roughness: 0.08,
  transmission: 0.7, transparent: true, opacity: 0.5,
  clearcoat: 1.0, clearcoatRoughness: 0.1, envMapIntensity: 1.2
});

// ---------------------------------------------------------------------------
// The streetlight — one centered group
// ---------------------------------------------------------------------------
const streetlight = new THREE.Group();

// --- Foundation base plate ---
const basePlate = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.40, 0.14, 40), baseMetal);
basePlate.position.y = 0.07;
streetlight.add(basePlate);

// bolt cover ring
const baseRing = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.34, 0.06, 40), darkMetal);
baseRing.position.y = 0.17;
streetlight.add(baseRing);

// --- Flared base collar ---
const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.155, 0.24, 0.70, 40), poleMetal);
collar.position.y = 0.55;
streetlight.add(collar);

// --- Tapered main pole ---
const POLE_BOTTOM_Y = 0.90;
const POLE_HEIGHT = 8.0;
const POLE_RB = 0.155;
const POLE_RT = 0.078;
const pole = new THREE.Mesh(
  new THREE.CylinderGeometry(POLE_RT, POLE_RB, POLE_HEIGHT, 40, 1),
  poleMetal
);
pole.position.y = POLE_BOTTOM_Y + POLE_HEIGHT / 2;
streetlight.add(pole);

const poleTopY = POLE_BOTTOM_Y + POLE_HEIGHT; // 8.90

// pole radius at a given world height (for surface-mounted details)
function poleRadiusAt(y) {
  const t = THREE.MathUtils.clamp((y - POLE_BOTTOM_Y) / POLE_HEIGHT, 0, 1);
  return THREE.MathUtils.lerp(POLE_RB, POLE_RT, t);
}

// --- Access-panel door near the base ---
const doorY = 1.15;
const rAtDoor = poleRadiusAt(doorY);
const doorGroup = new THREE.Group();

const doorFrame = new THREE.Mesh(new THREE.BoxGeometry(0.028, 0.52, 0.19), darkMetal);
doorFrame.position.set(rAtDoor + 0.012, 0, 0);
doorGroup.add(doorFrame);

const doorPanel = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.46, 0.15), paintedMetal);
doorPanel.position.set(rAtDoor + 0.022, 0, 0);
doorGroup.add(doorPanel);

const doorLatch = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.035, 16), baseMetal);
doorLatch.rotation.z = Math.PI / 2;
doorLatch.position.set(rAtDoor + 0.04, 0, -0.05);
doorGroup.add(doorLatch);

doorGroup.position.y = doorY;
streetlight.add(doorGroup);

// --- Cap / joint where the arm springs from the pole ---
const armJoint = new THREE.Mesh(new THREE.CylinderGeometry(0.10, 0.11, 0.22, 32), paintedMetal);
armJoint.position.y = poleTopY - 0.35;
streetlight.add(armJoint);

const poleCap = new THREE.Mesh(new THREE.SphereGeometry(0.082, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2), poleMetal);
poleCap.position.y = poleTopY;
streetlight.add(poleCap);

// --- Curved mounting arm (tube along a bezier curve) ---
const armCurve = new THREE.CubicBezierCurve3(
  new THREE.Vector3(0.00, poleTopY - 0.45, 0),
  new THREE.Vector3(0.18, poleTopY + 0.18, 0),
  new THREE.Vector3(1.35, poleTopY + 0.42, 0),
  new THREE.Vector3(2.28, poleTopY + 0.30, 0)
);
const arm = new THREE.Mesh(
  new THREE.TubeGeometry(armCurve, 80, 0.052, 18, false),
  paintedMetal
);
streetlight.add(arm);

const armEnd = armCurve.getPoint(1);

// --- Luminaire head (rectangular LED slab) at the end of the arm ---
const head = new THREE.Group();

// small bracket linking arm to head
const bracket = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.10, 0.14), darkMetal);
bracket.position.set(-0.28, 0.055, 0);
head.add(bracket);

// main housing
const housing = new THREE.Mesh(new THREE.BoxGeometry(0.86, 0.11, 0.34), paintedMetal);
housing.position.set(0.10, 0, 0);
head.add(housing);

// tapered leading edge (visual bevel)
const nose = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.075, 0.30), paintedMetal);
nose.position.set(0.55, -0.005, 0);
head.add(nose);

// LED emissive panel on the underside
const led = new THREE.Mesh(new THREE.BoxGeometry(0.74, 0.02, 0.26), lensMaterial);
led.position.set(0.10, -0.062, 0);
head.add(led);

// thin protective glass over the LEDs
const glass = new THREE.Mesh(new THREE.BoxGeometry(0.76, 0.012, 0.28), glassMaterial);
glass.position.set(0.10, -0.074, 0);
head.add(glass);

// position + slight downward tilt of the whole head
head.position.set(armEnd.x + 0.30, armEnd.y - 0.03, armEnd.z);
head.rotation.z = -0.12;
streetlight.add(head);

// --- Warm downward pool of light from the luminaire (thematic) ---
const streetGlow = new THREE.SpotLight(0xffe7bf, 26, 22, 0.62, 0.5, 1.4);
streetGlow.position.set(head.position.x, head.position.y - 0.09, head.position.z);
streetGlow.target.position.set(head.position.x, 0, head.position.z);
scene.add(streetGlow);
scene.add(streetGlow.target);

// enable shadow casting on all solid parts
streetlight.traverse((o) => {
  if (o.isMesh && o.material !== glassMaterial) {
    o.castShadow = true;
    o.receiveShadow = true;
  }
});

scene.add(streetlight);

// ---------------------------------------------------------------------------
// Resize handling
// ---------------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------------------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
