<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brass House Key — Procedural three.js</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #121316; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------------------------------------------------------------------------
// Units: 1 unit = 1 cm.  A typical house key is ~6 cm long, ~2.5 mm thick.
// ---------------------------------------------------------------------------

// Renderer -------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// Scene / camera -------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121316);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3.4, 2.3, 5.0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 2.2;
controls.maxDistance = 18;
controls.target.set(0, 0, 0);

// Soft studio reflections for the metal (fully procedural) -------------------
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

// ---------------------------------------------------------------------------
// Procedural worn-brass textures (canvas — no external assets)
// ---------------------------------------------------------------------------
const rand = (a, b) => a + Math.random() * (b - a);

function makeCanvas(draw) {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  draw(g);
  return c;
}

function blotches(g, colors, count, rMin, rMax, aMin, aMax) {
  for (let i = 0; i < count; i++) {
    const x = rand(0, 512), y = rand(0, 512), r = rand(rMin, rMax);
    const a = rand(aMin, aMax);
    const col = colors[Math.floor(Math.random() * colors.length)];
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, `rgba(${col},${a})`);
    grd.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = grd;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
}

function streaks(g, darkCol, lightCol, count) {
  for (let i = 0; i < count; i++) {
    const x = rand(0, 512), y = rand(0, 512), len = rand(20, 160);
    const col = Math.random() < 0.5 ? darkCol : lightCol;
    g.strokeStyle = `rgba(${col},${rand(0.03, 0.10)})`;
    g.lineWidth = rand(0.5, 1.7);
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + len, y + rand(-2.5, 2.5));
    g.stroke();
  }
}

function speckles(g, col, count, aMin, aMax) {
  for (let i = 0; i < count; i++) {
    g.fillStyle = `rgba(${col},${rand(aMin, aMax)})`;
    g.beginPath();
    g.arc(rand(0, 512), rand(0, 512), rand(0.5, 2.4), 0, Math.PI * 2);
    g.fill();
  }
}

// Color map: warm brass with tarnish patches, polish highlights, brush lines
const colorCanvas = makeCanvas(g => {
  g.fillStyle = '#b98c36';
  g.fillRect(0, 0, 512, 512);
  blotches(g, ['122,90,28', '96,70,22'], 26, 40, 130, 0.05, 0.13);   // dull tarnish
  blotches(g, ['235,205,122', '244,222,150'], 22, 30, 110, 0.04, 0.10); // hand-polished
  streaks(g, '58,42,12', '255,232,164', 1200);                       // brushed grain
  speckles(g, '66,48,16', 260, 0.05, 0.16);                          // pitting/grime
});

// Roughness/bump map: grayscale — dark = polished-smooth, light = tarnish-rough
const roughCanvas = makeCanvas(g => {
  g.fillStyle = '#7f7f7f';
  g.fillRect(0, 0, 512, 512);
  blotches(g, ['200,200,200'], 24, 40, 130, 0.08, 0.20);
  blotches(g, ['58,58,58'], 22, 30, 110, 0.08, 0.18);
  streaks(g, '48,48,48', '190,190,190', 1200);
  speckles(g, '215,215,215', 260, 0.08, 0.22);
});

const maxAniso = renderer.capabilities.getMaxAnisotropy();

const colorTex = new THREE.CanvasTexture(colorCanvas);
colorTex.colorSpace = THREE.SRGBColorSpace;
const roughTex = new THREE.CanvasTexture(roughCanvas);
for (const t of [colorTex, roughTex]) {
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(0.5, 0.5);
  t.anisotropy = maxAniso;
}

// Materials ------------------------------------------------------------------
const brassMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  map: colorTex,
  metalness: 1.0,
  roughness: 0.82,          // multiplied by roughnessMap (~0.5 mid) → worn satin brass
  roughnessMap: roughTex,
  bumpMap: roughTex,
  bumpScale: 0.008,
  envMapIntensity: 0.95
});

// Bright, smooth brass where a keyring has rubbed the hole edge shiny
const wornMat = new THREE.MeshStandardMaterial({
  color: 0xeccd7d,
  metalness: 1.0,
  roughness: 0.16,
  envMapIntensity: 1.25
});

// ---------------------------------------------------------------------------
// Key silhouette (in the XY plane, extruded along Z) — flat stamped key
// ---------------------------------------------------------------------------
const BOW_CX = -1.5;          // bow (head) center x
const BOW_R  = 1.25;          // bow radius → 2.5 cm head
const SHLDR  = 0.58;          // shoulder half-height
const BLADE  = 0.45;          // blade half-height (9 mm tall blade)
const yB = -BLADE;

const th = Math.asin(SHLDR / BOW_R);            // angle where shoulder meets bow
const JX = BOW_CX + BOW_R * Math.cos(th);       // junction x

const shape = new THREE.Shape();
shape.moveTo(JX, SHLDR);                        // top bow/shoulder junction
shape.lineTo(-0.08, SHLDR);                     // shoulder (insertion stop)
shape.lineTo(0.04, BLADE);                      // step down to blade spine
shape.lineTo(2.98, BLADE);                      // straight blade top
shape.lineTo(3.32, 0.17);                       // chamfered tip
shape.quadraticCurveTo(3.44, 0.08, 3.44, -0.05);
shape.lineTo(3.04, yB);                         // tip lead-in to bottom edge

// Shallow, worn (round-bottomed) bitting cuts along the bottom edge,
// traversed right → left: [center x, half-width, depth]
const grooves = [
  [2.58, 0.17, 0.16],
  [2.12, 0.16, 0.22],
  [1.66, 0.15, 0.12],
  [1.18, 0.17, 0.21],
  [0.66, 0.15, 0.17]
];
for (const [cx, hw, d] of grooves) {
  shape.lineTo(cx + hw, yB);
  shape.quadraticCurveTo(cx + hw * 0.3, yB + d, cx, yB + d); // worn rounded valley
  shape.quadraticCurveTo(cx - hw * 0.3, yB + d, cx - hw, yB);
}
shape.lineTo(0.04, yB);
shape.lineTo(-0.08, -SHLDR);                    // bottom shoulder step
shape.lineTo(JX, -SHLDR);
shape.absarc(BOW_CX, 0, BOW_R, -th, th, true);  // sweep the round bow

// Keyring hole near the top of the bow
const HOLE = { x: BOW_CX, y: 0.72, r: 0.28 };
const hole = new THREE.Path();
hole.absarc(HOLE.x, HOLE.y, HOLE.r, 0, Math.PI * 2, true);
shape.holes.push(hole);

// Extrude: 2 mm body + beveled (coined/stamped) rounded edges → ~2.7 mm thick
const keyGeo = new THREE.ExtrudeGeometry(shape, {
  depth: 0.2,
  steps: 1,
  bevelEnabled: true,
  bevelThickness: 0.035,
  bevelSize: 0.03,
  bevelSegments: 4,
  curveSegments: 64
});
keyGeo.translate(0, 0, -0.1); // center on z = 0

// Assemble the single key object ---------------------------------------------
const key = new THREE.Group();

const keyMesh = new THREE.Mesh(keyGeo, brassMat);
keyMesh.castShadow = true;
key.add(keyMesh);

// Worn bright ring lining the keyring hole (edge wear from the ring rubbing)
const wearRing = new THREE.Mesh(new THREE.TorusGeometry(0.30, 0.10, 24, 64), wornMat);
wearRing.position.set(HOLE.x, HOLE.y, 0);
wearRing.castShadow = true;
key.add(wearRing);

// Subtle stamped border ridge on both faces of the bow
const ridgeGeo = new THREE.TorusGeometry(1.13, 0.018, 8, 96);
for (const s of [1, -1]) {
  const ridge = new THREE.Mesh(ridgeGeo, brassMat);
  ridge.position.set(BOW_CX, 0, s * 0.132);
  ridge.scale.z = 0.5;
  ridge.castShadow = true;
  key.add(ridge);
}

// Center the finished key exactly at the origin, then pose it
const box = new THREE.Box3().setFromObject(key);
const ctr = box.getCenter(new THREE.Vector3());
key.position.set(-ctr.x, -ctr.y, -ctr.z);

const keyRig = new THREE.Group();
keyRig.add(key);
keyRig.rotation.set(-0.45, 0.0, -0.12); // relaxed display tilt
scene.add(keyRig);

// Ground plane — receives shadows only ---------------------------------------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 64),
  new THREE.ShadowMaterial({ opacity: 0.32 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -2.0;
ground.receiveShadow = true;
scene.add(ground);

// Lighting: key + fill + rim + gentle hemisphere ------------------------------
const hemi = new THREE.HemisphereLight(0x36414f, 0x1a140e, 0.55);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffe3c0, 3.0);
keyLight.position.set(3.5, 5.5, 3.0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -5;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 25;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x9fb4ff, 0.7);
fillLight.position.set(-4.5, 1.5, 4.0);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffd9a0, 2.0);
rimLight.position.set(-2.5, 3.5, -4.5);
scene.add(rimLight);

// Resize ----------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

// Animate ----------------------------------------------------------------------
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
