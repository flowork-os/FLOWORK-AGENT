<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articulated Hydraulic Excavator</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: linear-gradient(#b9d2df, #e8ece8);
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(20, 29, 32, 0.72);
      letter-spacing: 0.18em;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="label">Hydraulic Excavator · Drag to inspect</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xc8dce4);
    scene.fog = new THREE.Fog(0xc8dce4, 18, 35);

    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(11, 7.2, 11);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.7, 2.3, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.minDistance = 8;
    controls.maxDistance = 24;
    controls.maxPolarAngle = Math.PI * 0.47;

    const yellow = new THREE.MeshStandardMaterial({
      color: 0xe6a900,
      roughness: 0.48,
      metalness: 0.18
    });
    const yellowLight = new THREE.MeshStandardMaterial({
      color: 0xf3b816,
      roughness: 0.42,
      metalness: 0.15
    });
    const yellowDark = new THREE.MeshStandardMaterial({
      color: 0xb97600,
      roughness: 0.55,
      metalness: 0.22
    });
    const trackRubber = new THREE.MeshStandardMaterial({
      color: 0x171a19,
      roughness: 0.78,
      metalness: 0.12
    });
    const steel = new THREE.MeshStandardMaterial({
      color: 0x4e5554,
      roughness: 0.45,
      metalness: 0.7
    });
    const darkSteel = new THREE.MeshStandardMaterial({
      color: 0x292e2d,
      roughness: 0.56,
      metalness: 0.55
    });
    const piston = new THREE.MeshStandardMaterial({
      color: 0xc8ced0,
      roughness: 0.2,
      metalness: 0.92
    });
    const glass = new THREE.MeshPhysicalMaterial({
      color: 0x18353d,
      roughness: 0.12,
      metalness: 0.08,
      transmission: 0.12,
      transparent: true,
      opacity: 0.82,
      clearcoat: 0.7,
      clearcoatRoughness: 0.16
    });
    const glassDark = new THREE.MeshPhysicalMaterial({
      color: 0x10272e,
      roughness: 0.15,
      metalness: 0.1,
      transparent: true,
      opacity: 0.9
    });
    const lightMaterial = new THREE.MeshStandardMaterial({
      color: 0xfff2b0,
      emissive: 0xffd35b,
      emissiveIntensity: 1.2,
      roughness: 0.3
    });
    const redMaterial = new THREE.MeshStandardMaterial({
      color: 0x9d180e,
      emissive: 0x5a0802,
      emissiveIntensity: 0.4,
      roughness: 0.45
    });

    function mesh(geometry, material, parent = scene) {
      const object = new THREE.Mesh(geometry, material);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function box(size, position, material, parent = scene, rotation = null) {
      const object = mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material, parent);
      object.position.set(position[0], position[1], position[2]);
      if (rotation) object.rotation.set(rotation[0], rotation[1], rotation[2]);
      return object;
    }

    function cylinder(radiusTop, radiusBottom, length, position, material, parent = scene, radialSegments = 24) {
      const object = mesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, length, radialSegments, 1, false),
        material,
        parent
      );
      object.position.set(position[0], position[1], position[2]);
      return object;
    }

    function extrudedPolygon(points, depth, material, parent = scene, bevel = 0.04) {
      const shape = new THREE.Shape();
      shape.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
      shape.closePath();
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth,
        bevelEnabled: bevel > 0,
        bevelThickness: bevel,
        bevelSize: bevel,
        bevelSegments: 2,
        curveSegments: 8
      });
      geometry.translate(0, 0, -depth / 2);
      return mesh(geometry, material, parent);
    }

    function roundedRectShape(width, height, radius) {
      const x = -width / 2;
      const y = -height / 2;
      const shape = new THREE.Shape();
      shape.moveTo(x + radius, y);
      shape.lineTo(x + width - radius, y);
      shape.quadraticCurveTo(x + width, y, x + width, y + radius);
      shape.lineTo(x + width, y + height - radius);
      shape.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      shape.lineTo(x + radius, y + height);
      shape.quadraticCurveTo(x, y + height, x, y + height - radius);
      shape.lineTo(x, y + radius);
      shape.quadraticCurveTo(x, y, x + radius, y);
      return shape;
    }

    function roundedExtrusion(width, height, depth, radius, material, parent = scene) {
      const geometry = new THREE.ExtrudeGeometry(roundedRectShape(width, height, radius), {
        depth,
        bevelEnabled: true,
        bevelThickness: 0.035,
        bevelSize: 0.035,
        bevelSegments: 2,
        curveSegments: 12
      });
      geometry.translate(0, 0, -depth / 2);
      return mesh(geometry, material, parent);
    }

    function pin(position, radius, length, material, parent) {
      const object = cylinder(radius, radius, length, position, material, parent, 32);
      object.rotation.x = Math.PI / 2;
      return object;
    }

    function barBetween(a, b, radius, material, parent, radialSegments = 18) {
      const start = new THREE.Vector3(...a);
      const end = new THREE.Vector3(...b);
      const direction = end.clone().sub(start);
      const length = direction.length();
      const object = mesh(
        new THREE.CylinderGeometry(radius, radius, length, radialSegments),
        material,
        parent
      );
      object.position.copy(start).add(end).multiplyScalar(0.5);
      object.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      return object;
    }

    function hydraulicCylinder(a, b, bodyRadius, parent) {
      const start = new THREE.Vector3(...a);
      const end = new THREE.Vector3(...b);
      const delta = end.clone().sub(start);
      const total = delta.length();
      const unit = delta.clone().normalize();
      const bodyLength = total * 0.58;
      const rodLength = total * 0.54;

      const bodyEnd = start.clone().addScaledVector(unit, bodyLength);
      const rodStart = end.clone().addScaledVector(unit, -rodLength);

      barBetween(start.toArray(), bodyEnd.toArray(), bodyRadius, yellowDark, parent, 20);
      barBetween(rodStart.toArray(), end.toArray(), bodyRadius * 0.48, piston, parent, 16);

      const eyeA = pin(start.toArray(), bodyRadius * 1.35, bodyRadius * 0.8, darkSteel, parent);
      const eyeB = pin(end.toArray(), bodyRadius * 1.1, bodyRadius * 0.75, darkSteel, parent);
      eyeA.rotation.x = Math.PI / 2;
      eyeB.rotation.x = Math.PI / 2;
    }

    const excavator = new THREE.Group();
    excavator.rotation.y = -0.12;
    scene.add(excavator);

    const undercarriage = new THREE.Group();
    excavator.add(undercarriage);

    function createTrack(z, outwardSign) {
      const track = new THREE.Group();
      undercarriage.add(track);

      const belt = roundedExtrusion(4.45, 1.05, 0.52, 0.45, trackRubber, track);
      belt.position.set(-0.3, 0.7, z);

      const inset = roundedExtrusion(3.7, 0.69, 0.025, 0.3, darkSteel, track);
      inset.position.set(-0.3, 0.7, z + outwardSign * 0.278);

      const wheelXs = [-1.78, -1.17, -0.56, 0.05, 0.66, 1.27];
      for (const x of wheelXs) {
        const wheel = cylinder(
          0.31, 0.31, 0.10,
          [x, 0.66, z + outwardSign * 0.31],
          steel, track, 28
        );
        wheel.rotation.x = Math.PI / 2;

        const hub = cylinder(
          0.105, 0.105, 0.115,
          [x, 0.66, z + outwardSign * 0.37],
          darkSteel, track, 24
        );
        hub.rotation.x = Math.PI / 2;
      }

      for (let i = 0; i < 15; i++) {
        const x = -2.25 + i * 0.28;
        box([0.23, 0.11, 0.61], [x, 1.17, z], trackRubber, track);
        box([0.23, 0.11, 0.61], [x, 0.22, z], trackRubber, track);
      }

      const arcData = [
        [-2.43, 0.37, -0.55],
        [-2.53, 0.52, -0.28],
        [-2.56, 0.72, 0],
        [-2.51, 0.91, 0.3],
        [1.94, 0.37, 0.55],
        [2.04, 0.52, 0.28],
        [2.07, 0.72, 0],
        [2.02, 0.91, -0.3]
      ];
      for (const [x, y, angle] of arcData) {
        box([0.24, 0.12, 0.61], [x, y, z], trackRubber, track, [0, 0, angle]);
      }
    }

    createTrack(1.05, 1);
    createTrack(-1.05, -1);

    box([3.35, 0.34, 2.25], [-0.32, 1.26, 0], darkSteel, undercarriage);
    box([2.75, 0.18, 2.55], [-0.42, 1.52, 0], yellowDark, undercarriage);

    const centerBearing = cylinder(0.79, 0.79, 0.34, [-0.42, 1.69, 0], darkSteel, undercarriage, 48);
    centerBearing.rotation.y = 0.02;
    cylinder(0.62, 0.68, 0.37, [-0.42, 1.76, 0], yellowDark, undercarriage, 48);

    const upper = new THREE.Group();
    upper.position.set(-0.42, 1.76, 0);
    upper.rotation.y = 0.12;
    excavator.add(upper);

    box([3.45, 0.29, 2.35], [-0.05, 0.18, 0], yellowDark, upper);
    box([3.1, 0.18, 2.12], [-0.42, 0.41, 0], yellow, upper);

    const counterweight = extrudedPolygon([
      [-1.75, 0],
      [-1.78, 0.82],
      [-1.53, 1.18],
      [-0.55, 1.18],
      [-0.38, 0.22]
    ], 2.12, yellow, upper, 0.1);
    counterweight.position.set(0, 0.42, 0);

    box([1.18, 0.75, 1.86], [-0.9, 1.63, -0.02], yellow, upper);
    box([1.05, 0.12, 1.88], [-0.91, 2.05, -0.02], yellowLight, upper);

    for (let i = 0; i < 5; i++) {
      box([0.06, 0.47, 0.035], [-0.83 + i * 0.15, 1.64, -0.975], darkSteel, upper);
    }

    box([0.62, 0.08, 0.9], [-1.46, 1.37, 0.67], darkSteel, upper);
    box([0.38, 0.1, 0.11], [-1.73, 1.37, 1.12], redMaterial, upper);

    const cab = new THREE.Group();
    cab.position.set(0.25, 0.43, 0.61);
    upper.add(cab);

    const cabShell = extrudedPolygon([
      [-0.72, 0],
      [-0.68, 1.68],
      [-0.37, 2.16],
      [0.62, 2.16],
      [0.89, 1.69],
      [0.91, 0]
    ], 1.0, yellow, cab, 0.055);
    cabShell.position.z = 0;

    const sideWindow = extrudedPolygon([
      [-0.57, 0.86],
      [-0.53, 1.60],
      [-0.27, 2.00],
      [0.47, 2.00],
      [0.67, 1.65],
      [0.67, 0.86]
    ], 0.025, glass, cab, 0.015);
    sideWindow.position.z = 0.515;

    const frontWindow = extrudedPolygon([
      [0.01, 0.12],
      [0.05, 1.27],
      [0.39, 1.62],
      [0.71, 1.39],
      [0.73, 0.13]
    ], 0.76, glassDark, cab, 0.015);
    frontWindow.rotation.y = Math.PI / 2;
    frontWindow.position.set(0.835, 0.42, 0);

    box([0.055, 1.22, 0.035], [0.12, 1.43, 0.527], darkSteel, cab);
    box([1.25, 0.06, 0.035], [0.03, 0.83, 0.527], darkSteel, cab);
    box([0.055, 0.82, 0.04], [0.67, 1.31, 0.529], darkSteel, cab);

    box([1.43, 0.16, 1.13], [0.03, 0.08, 0], yellowDark, cab);
    box([1.32, 0.16, 1.12], [-0.03, 2.22, 0], yellow, cab);

    box([0.38, 0.63, 0.46], [-0.08, 0.61, 0.02], darkSteel, cab);
    box([0.34, 0.12, 0.42], [-0.11, 0.98, 0.02], trackRubber, cab);
    box([0.08, 0.58, 0.08], [0.41, 0.62, 0.23], darkSteel, cab, [0, 0, -0.3]);

    box([0.07, 0.07, 0.42], [0.82, 1.82, 0], darkSteel, cab);
    box([0.1, 0.12, 0.13], [0.84, 1.82, 0.25], lightMaterial, cab);

    const mirrorArm = barBetween(
      [0.57, 1.95, 0.5],
      [0.95, 2.08, 0.66],
      0.025, darkSteel, cab, 10
    );
    box([0.08, 0.26, 0.2], [0.98, 2.08, 0.68], darkSteel, cab, [0, 0.15, 0]);

    const armMount = new THREE.Group();
    armMount.position.set(0.65, 0.48, -0.27);
    upper.add(armMount);

    box([0.78, 1.18, 0.82], [0.18, 0.61, 0], yellow, armMount);
    extrudedPolygon([
      [-0.27, 0],
      [-0.18, 1.15],
      [0.18, 1.42],
      [0.48, 1.13],
      [0.55, 0]
    ], 0.86, yellow, armMount, 0.05);

    const boom = new THREE.Group();
    boom.position.set(0.31, 1.29, 0);
    boom.rotation.z = 0.57;
    armMount.add(boom);

    const boomBody = extrudedPolygon([
      [-0.18, -0.25],
      [0.5, -0.35],
      [2.62, -0.24],
      [3.55, -0.17],
      [3.69, 0.10],
      [2.86, 0.39],
      [0.45, 0.43],
      [-0.16, 0.22]
    ], 0.61, yellow, boom, 0.055);

    pin([0, 0, 0], 0.23, 0.88, darkSteel, boom);
    pin([3.58, 0, 0], 0.21, 0.78, darkSteel, boom);

    hydraulicCylinder(
      [-0.52, -0.88, 0],
      [2.34, 0.14, 0],
      0.14,
      boom
    );

    const boomTopCylinder = new THREE.Group();
    boom.add(boomTopCylinder);
    hydraulicCylinder(
      [0.72, 0.39, 0],
      [3.32, 0.48, 0],
      0.125,
      boomTopCylinder
    );

    const stick = new THREE.Group();
    stick.position.set(3.58, 0, 0);
    stick.rotation.z = -1.42;
    boom.add(stick);

    extrudedPolygon([
      [-0.14, -0.28],
      [0.28, -0.31],
      [2.72, -0.22],
      [3.12, -0.12],
      [3.2, 0.14],
      [2.72, 0.3],
      [0.26, 0.34],
      [-0.14, 0.22]
    ], 0.5, yellowLight, stick, 0.05);

    pin([0, 0, 0], 0.2, 0.75, darkSteel, stick);
    pin([3.08, 0, 0], 0.18, 0.69, darkSteel, stick);

    hydraulicCylinder(
      [0.16, 0.32, 0],
      [2.52, 0.31, 0],
      0.115,
      stick
    );

    const bucketPivot = new THREE.Group();
    bucketPivot.position.set(3.08, 0, 0);
    bucketPivot.rotation.z = -0.31;
    stick.add(bucketPivot);

    const bucket = extrudedPolygon([
      [-0.16, 0.13],
      [0.2, 0.32],
      [0.78, 0.36],
      [1.18, 0.05],
      [1.31, -0.48],
      [0.95, -0.86],
      [0.25, -0.76],
      [-0.08, -0.33]
    ], 0.93, yellowDark, bucketPivot, 0.045);

    pin([0, 0, 0], 0.18, 1.04, darkSteel, bucketPivot);

    const bucketLip = box(
      [0.72, 0.12, 1.08],
      [1.02, -0.71, 0],
      steel,
      bucketPivot,
      [0, 0, -0.2]
    );

    for (let i = 0; i < 5; i++) {
      box(
        [0.44, 0.12, 0.12],
        [1.28, -0.79, -0.4 + i * 0.2],
        steel,
        bucketPivot,
        [0, 0, -0.25]
      );
    }

    barBetween(
      [2.42, 0.27, 0.28],
      [3.12, 0.28, 0.28],
      0.065,
      darkSteel,
      stick,
      14
    );
    barBetween(
      [3.12, 0.28, 0.28],
      [3.37, -0.18, 0.28],
      0.065,
      darkSteel,
      stick,
      14
    );
    barBetween(
      [2.42, 0.27, -0.28],
      [3.12, 0.28, -0.28],
      0.065,
      darkSteel,
      stick,
      14
    );
    barBetween(
      [3.12, 0.28, -0.28],
      [3.37, -0.18, -0.28],
      0.065,
      darkSteel,
      stick,
      14
    );

    const exhaust = cylinder(0.115, 0.14, 0.88, [-1.22, 2.35, -0.62], darkSteel, upper, 20);
    exhaust.position.y = 2.28;
    cylinder(0.15, 0.12, 0.13, [-1.22, 2.77, -0.62], darkSteel, upper, 20);

    box([0.48, 0.14, 0.48], [-1.15, 2.2, 0.68], yellowDark, upper);
    cylinder(0.08, 0.08, 0.28, [-1.15, 2.4, 0.68], darkSteel, upper, 16);

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x9b9986,
      roughness: 0.94,
      metalness: 0
    });
    const ground = mesh(new THREE.CircleGeometry(28, 96), groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0.12;
    ground.receiveShadow = true;
    ground.castShadow = false;

    const dirtMaterial = new THREE.MeshStandardMaterial({
      color: 0x766c57,
      roughness: 1
    });

    for (let i = 0; i < 48; i++) {
      const angle = i * 2.399963;
      const radius = 3 + (i % 11) * 0.72;
      const scale = 0.05 + (i % 5) * 0.018;
      const stone = mesh(new THREE.DodecahedronGeometry(scale, 0), dirtMaterial);
      stone.position.set(
        Math.cos(angle) * radius - 0.5,
        0.15 + scale * 0.35,
        Math.sin(angle) * radius
      );
      stone.scale.y = 0.55;
      stone.rotation.set(angle * 0.7, angle, angle * 0.2);
    }

    const hemi = new THREE.HemisphereLight(0xe9f5ff, 0x6a624e, 2.35);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff3d4, 4.2);
    sun.position.set(-7, 12, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -11;
    sun.shadow.camera.right = 11;
    sun.shadow.camera.top = 12;
    sun.shadow.camera.bottom = -8;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 35;
    sun.shadow.bias = -0.00035;
    sun.shadow.normalBias = 0.025;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x8ab4cc, 1.0);
    fill.position.set(8, 5, -8);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xffd892, 0.8);
    rim.position.set(-6, 4, -8);
    scene.add(rim);

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    }

    addEventListener('resize', resize);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      upper.rotation.y = 0.12 + Math.sin(elapsed * 0.16) * 0.025;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
