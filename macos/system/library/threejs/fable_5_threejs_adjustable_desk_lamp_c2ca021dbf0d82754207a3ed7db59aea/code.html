<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adjustable Articulated Desk Lamp — Procedural three.js</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #141517; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ */
/*  Scene / renderer / camera — scene units are MILLIMETERS            */
/* ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141517);
scene.fog = new THREE.Fog(0x141517, 2200, 5200);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 12000);
camera.position.set(640, 520, 900);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(20, 300, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 300;
controls.maxDistance = 3200;
controls.maxPolarAngle = Math.PI * 0.495;

/* ------------------------------------------------------------------ */
/*  Lighting: key + fill + rim + hemisphere, soft shadows              */
/* ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0x46506a, 0x0d0d10, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff0dd, 2.6);
key.position.set(700, 1050, 620);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -750;
key.shadow.camera.right = 750;
key.shadow.camera.top = 750;
key.shadow.camera.bottom = -750;
key.shadow.camera.near = 100;
key.shadow.camera.far = 3500;
key.shadow.bias = -0.0001;
key.shadow.normalBias = 3;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9db6ff, 0.7);
fill.position.set(-650, 350, 520);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xcfe0ff, 1.5);
rim.position.set(-420, 650, -820);
scene.add(rim);

/* Ground plane that ONLY receives shadows */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(1500, 64),
  new THREE.ShadowMaterial({ opacity: 0.38 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ */
/*  Materials — matte metal finishes                                   */
/* ------------------------------------------------------------------ */
const bodyMat = new THREE.MeshStandardMaterial({
  color: 0x4a4e55, metalness: 0.9, roughness: 0.6, envMapIntensity: 0.7
});
const armMat = new THREE.MeshStandardMaterial({
  color: 0x585d66, metalness: 0.9, roughness: 0.55, envMapIntensity: 0.75
});
const jointMat = new THREE.MeshStandardMaterial({
  color: 0x2c2f34, metalness: 0.85, roughness: 0.5, envMapIntensity: 0.6
});
const steelMat = new THREE.MeshStandardMaterial({
  color: 0xaeb4bc, metalness: 1.0, roughness: 0.38, envMapIntensity: 1.0
});
const shadeMat = new THREE.MeshStandardMaterial({
  color: 0x4a4e55, metalness: 0.9, roughness: 0.58, envMapIntensity: 0.7, side: THREE.DoubleSide
});
const innerMat = new THREE.MeshStandardMaterial({
  color: 0xf5efe4, metalness: 0.0, roughness: 0.85,
  emissive: 0xffe0ac, emissiveIntensity: 0.9,
  envMapIntensity: 0.15, side: THREE.DoubleSide
});
const bulbMat = new THREE.MeshStandardMaterial({
  color: 0x111111, emissive: 0xffd9a0, emissiveIntensity: 3.5, roughness: 0.4
});
const cableMat = new THREE.MeshStandardMaterial({
  color: 0x18181a, metalness: 0.0, roughness: 0.9
});

/* ------------------------------------------------------------------ */
/*  Helpers                                                            */
/* ------------------------------------------------------------------ */
const V3 = (x, y, z = 0) => new THREE.Vector3(x, y, z);
const UP = V3(0, 1, 0);

function rodBetween(a, b, radius, mat, seg = 20) {
  const dir = b.clone().sub(a);
  const len = dir.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, len, seg), mat);
  mesh.position.copy(a).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(UP, dir.normalize());
  return mesh;
}

class HelixCurve extends THREE.Curve {
  constructor(len, radius, turns) { super(); this.len = len; this.radius = radius; this.turns = turns; }
  getPoint(t, target = new THREE.Vector3()) {
    const a = this.turns * Math.PI * 2 * t;
    return target.set(Math.cos(a) * this.radius, this.len * t, Math.sin(a) * this.radius);
  }
}

function springBetween(a, b, coilR, wireR, turns, mat) {
  const dir = b.clone().sub(a);
  const len = dir.length();
  const geo = new THREE.TubeGeometry(new HelixCurve(len, coilR, turns), turns * 16, wireR, 8, false);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(a);
  mesh.quaternion.setFromUnitVectors(UP, dir.normalize());
  return mesh;
}

/* horizontal pin along Z at point p */
function pinAt(p, len, r, mat) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 16), mat);
  mesh.rotation.x = Math.PI / 2;
  mesh.position.set(p.x, p.y, 0);
  return mesh;
}

/* pivot joint: barrel along Z + hex tension knobs on both sides */
function jointAt(p, r = 11, w = 34) {
  const g = new THREE.Group();
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(r, r, w, 28), jointMat);
  barrel.rotation.x = Math.PI / 2;
  g.add(barrel);
  for (const s of [-1, 1]) {
    const knob = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.6, r * 0.6, 9, 6), steelMat);
    knob.rotation.x = Math.PI / 2;
    knob.position.z = s * (w / 2 + 4.5);
    g.add(knob);
  }
  g.position.copy(p);
  return g;
}

/* ------------------------------------------------------------------ */
/*  THE LAMP — realistic proportions in mm                             */
/*  base Ø174 x 44 | lower arm 360 | upper arm 340 | shade Ø178 x 150  */
/* ------------------------------------------------------------------ */
const lamp = new THREE.Group();
scene.add(lamp);

/* Heavy round weighted base (lathe profile) */
const basePts = [
  new THREE.Vector2(0, 0),  new THREE.Vector2(80, 0),  new THREE.Vector2(85, 3),
  new THREE.Vector2(87, 9), new THREE.Vector2(87, 22), new THREE.Vector2(83, 31),
  new THREE.Vector2(58, 38), new THREE.Vector2(26, 42), new THREE.Vector2(14, 44),
  new THREE.Vector2(0, 44)
];
lamp.add(new THREE.Mesh(new THREE.LatheGeometry(basePts, 72), bodyMat));

/* power switch button on the base */
const button = new THREE.Mesh(new THREE.CylinderGeometry(7, 8, 10, 20), jointMat);
button.position.set(52, 42, 0);
lamp.add(button);

/* Column and yoke up to the shoulder pivot */
const P0 = V3(0, 96, 0);                                   // shoulder pivot
lamp.add(rodBetween(V3(0, 42, 0), V3(0, 88, 0), 12, bodyMat, 24));
const collar = new THREE.Mesh(new THREE.CylinderGeometry(16, 18, 9, 28), jointMat);
collar.position.y = 47;
lamp.add(collar);
for (const s of [-1, 1]) {
  const plate = new THREE.Mesh(new THREE.BoxGeometry(22, 28, 5), bodyMat);
  plate.position.set(0, 92, s * 14);
  lamp.add(plate);
}

/* Arm skeleton in the XY plane */
const a1 = 0.55;                                            // lower arm leans back ~31°
const aT = 1.05;                                            // upper arm ~60° from vertical
const d1 = V3(-Math.sin(a1), Math.cos(a1), 0);
const d2 = V3(Math.sin(aT), Math.cos(aT), 0);
const L1 = 360, L2 = 340;
const P1 = P0.clone().addScaledVector(d1, L1);              // elbow pivot
const P2 = P1.clone().addScaledVector(d2, L2);              // wrist pivot
const aim = V3(430, 0, 0).sub(P2).normalize();              // shade aims down-forward

/* Two parallel rods per arm segment (classic articulated construction) */
for (const z of [-11, 11]) {
  lamp.add(rodBetween(P0.clone().setZ(z), P1.clone().setZ(z), 5, armMat));
  lamp.add(rodBetween(P1.clone().setZ(z), P2.clone().setZ(z), 5, armMat));
}
/* cross braces mid-arm */
lamp.add(pinAt(P0.clone().addScaledVector(d1, 180), 26, 3, armMat));
lamp.add(pinAt(P1.clone().addScaledVector(d2, 170), 26, 3, armMat));

/* Pivot joints */
lamp.add(jointAt(P0));
lamp.add(jointAt(P1));
lamp.add(jointAt(P2, 10, 30));

/* Tension springs — pair on the lower arm, one across the elbow */
const perp1 = V3(d1.y, -d1.x, 0);                           // front side of lower arm
const sA = P0.clone().addScaledVector(d1, 28).addScaledVector(perp1, 22);
const sB = P0.clone().addScaledVector(d1, 205).addScaledVector(perp1, 9);
for (const z of [-13, 13]) {
  lamp.add(springBetween(sA.clone().setZ(z), sB.clone().setZ(z), 5.5, 1.5, 20, steelMat));
}
lamp.add(pinAt(sA, 36, 2.6, steelMat));
lamp.add(pinAt(sB, 36, 2.6, steelMat));

const eA = P1.clone().addScaledVector(d1, -70);
const eB = P1.clone().addScaledVector(d2, 165);
lamp.add(springBetween(eA, eB, 6, 1.6, 16, steelMat));
lamp.add(pinAt(eA, 30, 2.6, steelMat));
lamp.add(pinAt(eB, 30, 2.6, steelMat));

/* Conical shade assembly at the wrist */
const shadeBack = P2.clone().addScaledVector(aim, 44);
lamp.add(rodBetween(P2, shadeBack, 7, jointMat));

const shade = new THREE.Group();
shade.position.copy(shadeBack);
shade.quaternion.setFromUnitVectors(V3(0, -1, 0), aim);
lamp.add(shade);

const shadePts = [
  new THREE.Vector2(0, 4),   new THREE.Vector2(10, 4),   new THREE.Vector2(14, 0),
  new THREE.Vector2(16, -6), new THREE.Vector2(26, -22), new THREE.Vector2(88, -138),
  new THREE.Vector2(90, -145)
];
shade.add(new THREE.Mesh(new THREE.LatheGeometry(shadePts, 64), shadeMat));

const innerPts = [
  new THREE.Vector2(3, -10), new THREE.Vector2(22, -25), new THREE.Vector2(84, -136)
];
shade.add(new THREE.Mesh(new THREE.LatheGeometry(innerPts, 64), innerMat));

const rimRing = new THREE.Mesh(new THREE.TorusGeometry(89, 2.5, 12, 64), jointMat);
rimRing.rotation.x = Math.PI / 2;
rimRing.position.y = -143;
shade.add(rimRing);

const socket = new THREE.Mesh(new THREE.CylinderGeometry(13, 13, 28, 20), jointMat);
socket.position.y = -34;
shade.add(socket);

const bulb = new THREE.Mesh(new THREE.SphereGeometry(24, 28, 20), bulbMat);
bulb.position.y = -70;
shade.add(bulb);

/* Lamp's own light: warm spot from the bulb + local glow */
const spot = new THREE.SpotLight(0xffd9a0, 850000, 3000, 0.52, 0.6, 2);
spot.castShadow = true;
spot.shadow.mapSize.set(1024, 1024);
spot.shadow.camera.near = 60;
spot.shadow.camera.far = 2500;
spot.shadow.bias = -0.0002;
spot.shadow.normalBias = 2;
spot.position.copy(shadeBack).addScaledVector(aim, 70);
spot.target.position.set(430, 0, 0);
scene.add(spot, spot.target);

const glow = new THREE.PointLight(0xffdcaa, 26000, 900, 2);
glow.position.copy(shadeBack).addScaledVector(aim, 80);
scene.add(glow);

/* Power cable trailing from the base */
const cableCurve = new THREE.CatmullRomCurve3([
  V3(-70, 10, -18), V3(-130, 5, -55), V3(-200, 3, -35), V3(-250, 3, 40), V3(-265, 3, 110)
]);
lamp.add(new THREE.Mesh(new THREE.TubeGeometry(cableCurve, 64, 3, 10), cableMat));

/* every lamp part casts and receives shadow */
lamp.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

/* ------------------------------------------------------------------ */
/*  Resize + loop                                                      */
/* ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
