<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Arcade Room</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02020a;
    }
    canvas { display: block; }
    #title {
      position: fixed;
      left: 24px;
      top: 20px;
      z-index: 2;
      color: #bffcff;
      font: 700 15px/1.2 monospace;
      letter-spacing: 0.22em;
      text-shadow: 0 0 8px #00eaff, 0 0 22px #ff29c6;
      pointer-events: none;
      opacity: 0.85;
    }
    #title small {
      display: block;
      margin-top: 6px;
      color: #ff9ce9;
      font-size: 9px;
      letter-spacing: 0.35em;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="title">NEON ARCADE<small>OPEN ALL NIGHT</small></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02030b);
    scene.fog = new THREE.FogExp2(0x050613, 0.017);

    const camera = new THREE.PerspectiveCamera(
      55,
      innerWidth / innerHeight,
      0.1,
      160
    );
    camera.position.set(20, 14, 25);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.4, -2);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.32;
    controls.minDistance = 13;
    controls.maxDistance = 42;
    controls.maxPolarAngle = Math.PI * 0.49;

    let seed = 948271;
    function rand() {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let t = seed;
      t = Math.imul(t ^ t >>> 15, 1 | t);
      t ^= t + Math.imul(t ^ t >>> 7, 61 | t);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    function pick(a) {
      return a[Math.floor(rand() * a.length)];
    }

    const cyan = 0x00eaff;
    const magenta = 0xff20bd;
    const orange = 0xff6a19;
    const violet = 0x7546ff;
    const lime = 0xbaff2a;

    function mat(color, roughness = 0.5, metalness = 0.05) {
      return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness
      });
    }

    function glowMat(color, intensity = 2.5) {
      return new THREE.MeshStandardMaterial({
        color,
        emissive: color,
        emissiveIntensity: intensity,
        roughness: 0.25,
        metalness: 0.05
      });
    }

    function box(w, h, d, material, x = 0, y = 0, z = 0) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function cylinder(r1, r2, h, material, segments = 24) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(r1, r2, h, segments),
        material
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function addEdges(mesh, color = 0x151525, opacity = 0.6) {
      const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(mesh.geometry, 20),
        new THREE.LineBasicMaterial({
          color,
          transparent: true,
          opacity
        })
      );
      edges.position.copy(mesh.position);
      edges.rotation.copy(mesh.rotation);
      edges.scale.copy(mesh.scale);
      mesh.parent?.add(edges);
      return edges;
    }

    function canvasTexture(size, painter) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      painter(ctx, size);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    const carpetTexture = canvasTexture(1024, (ctx, s) => {
      ctx.fillStyle = '#100d24';
      ctx.fillRect(0, 0, s, s);
      ctx.lineWidth = 10;
      for (let i = 0; i < 145; i++) {
        const x = rand() * s;
        const y = rand() * s;
        const r = 10 + rand() * 35;
        ctx.strokeStyle = pick([
          '#ff20a8', '#00ddef', '#7f48ff', '#ff791f', '#b7ff25'
        ]);
        ctx.globalAlpha = 0.38 + rand() * 0.32;
        ctx.beginPath();
        if (rand() > 0.48) {
          ctx.arc(x, y, r, 0, Math.PI * (0.7 + rand() * 1.3));
        } else {
          ctx.moveTo(x - r, y + r);
          ctx.lineTo(x, y - r);
          ctx.lineTo(x + r, y + r);
        }
        ctx.stroke();
      }
      ctx.globalAlpha = 0.22;
      ctx.strokeStyle = '#ff40cb';
      ctx.lineWidth = 4;
      for (let x = -s; x < s * 2; x += 90) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x - s, s);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    });
    carpetTexture.wrapS = carpetTexture.wrapT = THREE.RepeatWrapping;
    carpetTexture.repeat.set(3.5, 4);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(32, 40),
      new THREE.MeshStandardMaterial({
        map: carpetTexture,
        roughness: 0.88,
        metalness: 0
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.set(0, 0, -3);
    floor.receiveShadow = true;
    scene.add(floor);

    const wallMat = new THREE.MeshStandardMaterial({
      color: 0x090b17,
      roughness: 0.82,
      metalness: 0.12
    });
    const backWall = box(32, 12, 0.45, wallMat, 0, 6, -22.7);
    const leftWall = box(0.45, 12, 40, wallMat, -16.2, 6, -3);
    const rightWall = box(0.45, 12, 40, wallMat, 16.2, 6, -3);
    scene.add(backWall, leftWall, rightWall);

    const ceiling = box(
      32,
      0.3,
      40,
      mat(0x050610, 0.8, 0.1),
      0,
      12,
      -3
    );
    scene.add(ceiling);

    const ambient = new THREE.HemisphereLight(0x1c2f5e, 0x17000e, 0.55);
    scene.add(ambient);

    const keyLight = new THREE.SpotLight(
      0x7ccfff,
      65,
      48,
      Math.PI / 4,
      0.55,
      1.2
    );
    keyLight.position.set(1, 11, 8);
    keyLight.target.position.set(0, 0, -7);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.bias = -0.0003;
    scene.add(keyLight, keyLight.target);

    const fillLight = new THREE.PointLight(magenta, 20, 20, 2);
    fillLight.position.set(-10, 5, -8);
    scene.add(fillLight);

    const orangeLight = new THREE.PointLight(orange, 16, 18, 2);
    orangeLight.position.set(11, 4, -14);
    scene.add(orangeLight);

    const animations = [];
    const screenMaterials = [];

    function neonStrip(x, y, z, length, color, axis = 'x') {
      const group = new THREE.Group();
      const material = glowMat(color, 5);
      const strip = box(
        axis === 'x' ? length : 0.09,
        axis === 'y' ? length : 0.09,
        0.08,
        material
      );
      group.add(strip);
      const light = new THREE.PointLight(color, 5.5, 7, 2);
      light.position.z = 0.6;
      group.add(light);
      group.position.set(x, y, z);
      scene.add(group);
      animations.push((t) => {
        material.emissiveIntensity = 3.7 + Math.sin(t * 1.8 + x) * 1.1;
        light.intensity = 4.5 + Math.sin(t * 1.8 + x) * 1.5;
      });
    }

    neonStrip(-8, 8.8, -22.35, 12, magenta, 'x');
    neonStrip(8, 8.8, -22.35, 12, cyan, 'x');
    neonStrip(-15.94, 6.5, -13, 8, orange, 'y');
    neonStrip(15.94, 6.5, -13, 8, violet, 'y');

    function makeScreenTexture(accent, title) {
      return canvasTexture(256, (ctx, s) => {
        const grad = ctx.createLinearGradient(0, 0, 0, s);
        grad.addColorStop(0, '#031026');
        grad.addColorStop(1, '#16001c');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, s, s);
        ctx.strokeStyle = accent;
        ctx.lineWidth = 3;
        ctx.globalAlpha = 0.6;
        for (let y = 0; y < s; y += 8) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(s, y);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.fillStyle = accent;
        ctx.font = 'bold 28px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(title, s / 2, 42);
        ctx.font = 'bold 13px monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('INSERT COIN', s / 2, 225);
        for (let i = 0; i < 24; i++) {
          ctx.fillStyle = pick([accent, '#ffffff', '#ffbf24']);
          const x = 25 + rand() * 205;
          const y = 70 + rand() * 120;
          const q = 3 + rand() * 9;
          ctx.fillRect(x, y, q, q);
        }
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(86, 168);
        ctx.lineTo(128, 90);
        ctx.lineTo(170, 168);
        ctx.closePath();
        ctx.stroke();
      });
    }

    function createArcadeCabinet(x, z, rotation, accent, title) {
      const g = new THREE.Group();
      const dark = mat(0x12121d, 0.42, 0.35);
      const side = mat(
        new THREE.Color(accent).multiplyScalar(0.45),
        0.38,
        0.25
      );

      const base = box(2.3, 3.2, 2.15, dark, 0, 1.6, 0);
      g.add(base);

      const upper = box(2.3, 2.9, 1.65, side, 0, 4.35, -0.22);
      upper.rotation.x = -0.08;
      g.add(upper);

      const crown = box(2.45, 0.78, 1.8, dark, 0, 5.72, -0.12);
      g.add(crown);

      const marqueeTexture = canvasTexture(256, (ctx, s) => {
        ctx.fillStyle = '#08030d';
        ctx.fillRect(0, 0, s, s);
        ctx.strokeStyle = '#' + new THREE.Color(accent).getHexString();
        ctx.lineWidth = 14;
        ctx.strokeRect(7, 7, s - 14, s - 14);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 36px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(title, s / 2, 142);
      });
      const marqueeMat = new THREE.MeshStandardMaterial({
        map: marqueeTexture,
        emissiveMap: marqueeTexture,
        emissive: accent,
        emissiveIntensity: 2.1
      });
      const marquee = box(2.12, 0.58, 0.05, marqueeMat, 0, 5.78, 0.81);
      g.add(marquee);

      const screenTexture = makeScreenTexture(
        '#' + new THREE.Color(accent).getHexString(),
        title
      );
      const screenMat = new THREE.MeshStandardMaterial({
        map: screenTexture,
        emissiveMap: screenTexture,
        emissive: accent,
        emissiveIntensity: 2.6,
        roughness: 0.17
      });
      screenMaterials.push(screenMat);
      const screen = box(1.72, 1.7, 0.05, screenMat, 0, 4.48, 0.66);
      screen.rotation.x = -0.08;
      g.add(screen);

      const bezel = box(2.03, 2.02, 0.1, dark, 0, 4.45, 0.57);
      bezel.position.z -= 0.04;
      g.add(bezel);
      g.remove(screen);
      g.add(bezel, screen);

      const deck = box(2.35, 0.28, 1.15, side, 0, 3.16, 0.44);
      deck.rotation.x = -0.18;
      g.add(deck);

      const joystickStem = cylinder(
        0.055,
        0.055,
        0.38,
        mat(0xc2c2d0, 0.2, 0.85),
        12
      );
      joystickStem.position.set(-0.42, 3.48, 0.57);
      g.add(joystickStem);

      const joystick = new THREE.Mesh(
        new THREE.SphereGeometry(0.15, 16, 12),
        glowMat(accent, 1.8)
      );
      joystick.position.set(-0.42, 3.7, 0.57);
      g.add(joystick);

      for (let i = 0; i < 3; i++) {
        const button = cylinder(
          0.09,
          0.09,
          0.07,
          glowMat(i === 0 ? cyan : i === 1 ? magenta : orange, 2.4),
          16
        );
        button.position.set(0.25 + i * 0.28, 3.47, 0.61);
        g.add(button);
      }

      const coinSlot = box(
        0.14,
        0.35,
        0.04,
        glowMat(orange, 1.5),
        0,
        1.67,
        1.09
      );
      g.add(coinSlot);

      const trim = [
        [-1.12, 2.8],
        [1.12, 2.8]
      ];
      trim.forEach(([tx]) => {
        const strip = box(0.06, 5.55, 0.06, glowMat(accent, 2.7), tx, 3, 0.02);
        g.add(strip);
      });

      const glow = new THREE.PointLight(accent, 4, 5, 2);
      glow.position.set(0, 4.5, 1.7);
      g.add(glow);

      g.position.set(x, 0, z);
      g.rotation.y = rotation;
      scene.add(g);

      animations.push((t) => {
        screenMat.emissiveIntensity =
          2.1 + 0.75 * Math.sin(t * 3 + x * 0.7 + z);
        glow.intensity =
          3.1 + 1.2 * Math.sin(t * 2.2 + x * 0.4);
      });
      return g;
    }

    const cabinetData = [
      [-12.7, -18.1, 0.1, cyan, 'NOVA'],
      [-9.8, -18.5, 0.05, magenta, 'RUSH'],
      [-6.8, -18.4, -0.05, orange, 'BYTE'],
      [-13.8, -11.2, Math.PI / 2, violet, 'VOID'],
      [-13.8, -7.9, Math.PI / 2, cyan, 'TURBO'],
      [12.8, -18.3, -0.1, magenta, 'STAR'],
      [9.8, -18.5, 0.04, orange, 'FIRE'],
      [6.8, -18.4, 0.07, cyan, 'GRID'],
      [13.8, -10.9, -Math.PI / 2, lime, 'JUMP']
    ];
    cabinetData.forEach(d => createArcadeCabinet(...d));

    function createAirHockey() {
      const g = new THREE.Group();
      const body = box(7.1, 1.1, 3.8, mat(0x141527, 0.3, 0.35), 0, 1.1, 0);
      g.add(body);

      const rim = box(7.3, 0.28, 4, glowMat(cyan, 2.6), 0, 1.78, 0);
      g.add(rim);

      const playTexture = canvasTexture(512, (ctx, s) => {
        ctx.fillStyle = '#e7f5ff';
        ctx.fillRect(0, 0, s, s);
        ctx.strokeStyle = '#06bcd4';
        ctx.lineWidth = 12;
        ctx.strokeRect(12, 12, s - 24, s - 24);
        ctx.beginPath();
        ctx.arc(s / 2, s / 2, 78, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(s / 2, 15);
        ctx.lineTo(s / 2, s - 15);
        ctx.stroke();
        ctx.strokeStyle = '#fa209f';
        ctx.beginPath();
        ctx.arc(70, s / 2, 60, -Math.PI / 2, Math.PI / 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(s - 70, s / 2, 60, Math.PI / 2, Math.PI * 1.5);
        ctx.stroke();
      });
      const playMat = new THREE.MeshStandardMaterial({
        map: playTexture,
        emissiveMap: playTexture,
        emissive: 0x006d8f,
        emissiveIntensity: 0.85,
        roughness: 0.28
      });
      const top = box(6.75, 0.12, 3.46, playMat, 0, 1.99, 0);
      g.add(top);

      for (const sx of [-2.7, 2.7]) {
        for (const sz of [-1.25, 1.25]) {
          const leg = box(0.55, 1.15, 0.55, mat(0x202234, 0.45, 0.4), sx, 0.55, sz);
          g.add(leg);
        }
      }

      const puck = cylinder(0.24, 0.24, 0.09, glowMat(magenta, 3), 24);
      puck.position.set(0, 2.11, 0);
      g.add(puck);

      for (const p of [[-2.1, 0.55], [2.25, -0.65]]) {
        const mallet = new THREE.Group();
        const base = cylinder(0.36, 0.42, 0.16, glowMat(orange, 2), 24);
        const handle = cylinder(0.17, 0.22, 0.35, mat(0xeeeeff, 0.2, 0.15), 24);
        handle.position.y = 0.22;
        mallet.add(base, handle);
        mallet.position.set(p[0], 2.12, p[1]);
        g.add(mallet);
      }

      const tableLight = new THREE.PointLight(cyan, 8, 8, 2);
      tableLight.position.set(0, 3.2, 0);
      g.add(tableLight);

      g.position.set(0, 0, -5.2);
      scene.add(g);

      animations.push((t) => {
        puck.position.x = Math.sin(t * 1.25) * 2.5;
        puck.position.z = Math.sin(t * 2.05) * 1.05;
        puck.rotation.y = t * 5;
        rim.material.emissiveIntensity = 2.2 + Math.sin(t * 2) * 0.55;
      });
    }
    createAirHockey();

    function createPlush(color, x, y, z, scale = 1) {
      const g = new THREE.Group();
      const plushMat = mat(color, 0.95, 0);
      const bellyMat = mat(0xffd7c7, 1, 0);

      const body = new THREE.Mesh(
        new THREE.SphereGeometry(0.32, 16, 12),
        plushMat
      );
      body.scale.set(0.8, 1, 0.62);
      body.position.y = 0.27;

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.29, 16, 12),
        plushMat
      );
      head.position.y = 0.72;

      const belly = new THREE.Mesh(
        new THREE.SphereGeometry(0.19, 12, 10),
        bellyMat
      );
      belly.scale.z = 0.35;
      belly.position.set(0, 0.27, 0.22);

      g.add(body, head, belly);

      for (const sx of [-1, 1]) {
        const ear = new THREE.Mesh(
          new THREE.SphereGeometry(0.11, 12, 8),
          plushMat
        );
        ear.position.set(sx * 0.2, 0.97, 0);
        g.add(ear);

        const eye = new THREE.Mesh(
          new THREE.SphereGeometry(0.035, 8, 6),
          mat(0x050509, 0.4, 0)
        );
        eye.position.set(sx * 0.09, 0.76, 0.27);
        g.add(eye);
      }

      g.position.set(x, y, z);
      g.rotation.y = rand() * Math.PI * 2;
      g.rotation.z = (rand() - 0.5) * 0.5;
      g.scale.setScalar(scale);
      g.traverse(o => {
        if (o.isMesh) {
          o.castShadow = true;
          o.receiveShadow = true;
        }
      });
      return g;
    }

    function createClawMachine() {
      const g = new THREE.Group();
      const frameMat = mat(0x492050, 0.35, 0.5);
      const base = box(3.8, 1.7, 3.2, frameMat, 0, 0.85, 0);
      g.add(base);

      const roof = box(4.05, 0.55, 3.4, glowMat(magenta, 2.5), 0, 6.05, 0);
      g.add(roof);

      const glassMat = new THREE.MeshPhysicalMaterial({
        color: 0xb7ecff,
        transparent: true,
        opacity: 0.19,
        roughness: 0.08,
        metalness: 0,
        transmission: 0.25,
        side: THREE.DoubleSide
      });

      const glassPanels = [
        [0, 3.85, 1.58, 3.75, 4.1, 0.05],
        [-1.88, 3.85, 0, 0.05, 4.1, 3.05],
        [1.88, 3.85, 0, 0.05, 4.1, 3.05]
      ];
      glassPanels.forEach(p => g.add(box(p[3], p[4], p[5], glassMat, p[0], p[1], p[2])));

      for (const sx of [-1, 1]) {
        for (const sz of [-1, 1]) {
          const post = box(
            0.16,
            4.4,
            0.16,
            glowMat(sx === sz ? cyan : magenta, 2.1),
            sx * 1.86,
            3.85,
            sz * 1.5
          );
          g.add(post);
        }
      }

      const plushColors = [
        0xff5f93, 0x41e5d8, 0xffb22e,
        0x9d6bff, 0xc5ee53, 0x66aaff
      ];
      for (let i = 0; i < 16; i++) {
        const px = -1.35 + rand() * 2.7;
        const pz = -1.05 + rand() * 2.1;
        const plush = createPlush(
          pick(plushColors),
          px,
          1.63 + rand() * 0.55,
          pz,
          0.7 + rand() * 0.35
        );
        g.add(plush);
      }

      const rail = box(3.2, 0.09, 0.09, mat(0xc8d0dd, 0.18, 0.9), 0, 5.52, 0);
      g.add(rail);

      const clawRig = new THREE.Group();
      const cable = cylinder(0.025, 0.025, 1.2, mat(0x22222a, 0.3, 0.8), 8);
      cable.position.y = -0.6;
      clawRig.add(cable);

      const hub = cylinder(0.13, 0.17, 0.18, glowMat(cyan, 2.5), 16);
      hub.position.y = -1.25;
      clawRig.add(hub);

      for (let i = 0; i < 3; i++) {
        const arm = box(0.06, 0.55, 0.06, mat(0xc8cbd5, 0.2, 0.9));
        arm.position.set(
          Math.cos(i * Math.PI * 2 / 3) * 0.15,
          -1.53,
          Math.sin(i * Math.PI * 2 / 3) * 0.15
        );
        arm.rotation.z = Math.cos(i * Math.PI * 2 / 3) * 0.38;
        arm.rotation.x = Math.sin(i * Math.PI * 2 / 3) * 0.38;
        clawRig.add(arm);
      }
      clawRig.position.set(0, 5.5, 0);
      g.add(clawRig);

      const controlsPanel = box(2.9, 0.45, 0.72, mat(0x232338, 0.35, 0.4), 0, 1.65, 1.75);
      controlsPanel.rotation.x = -0.22;
      g.add(controlsPanel);

      const stick = cylinder(0.06, 0.06, 0.38, mat(0xe0e0e0, 0.25, 0.8), 12);
      stick.position.set(-0.72, 2, 1.75);
      g.add(stick);

      const ball = new THREE.Mesh(
        new THREE.SphereGeometry(0.14, 14, 10),
        glowMat(orange, 2.7)
      );
      ball.position.set(-0.72, 2.22, 1.75);
      g.add(ball);

      g.position.set(9.8, 0, -9.2);
      g.rotation.y = -0.08;
      scene.add(g);

      animations.push((t) => {
        clawRig.position.x = Math.sin(t * 0.55) * 1.15;
        clawRig.position.z = Math.cos(t * 0.43) * 0.65;
        clawRig.position.y = 5.5 - (Math.sin(t * 0.7) + 1) * 0.35;
        roof.material.emissiveIntensity = 2.2 + Math.sin(t * 2.4) * 0.6;
      });
    }
    createClawMachine();

    function createChangeMachine() {
      const g = new THREE.Group();
      const metal = mat(0x54566a, 0.28, 0.78);
      g.add(box(2.6, 5.2, 1.35, metal, 0, 2.6, 0));

      const signTexture = canvasTexture(256, (ctx, s) => {
        ctx.fillStyle = '#13071f';
        ctx.fillRect(0, 0, s, s);
        ctx.strokeStyle = '#ff45c7';
        ctx.lineWidth = 16;
        ctx.strokeRect(8, 8, s - 16, s - 16);
        ctx.fillStyle = '#fff36d';
        ctx.font = 'bold 47px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('CHANGE', s / 2, 112);
        ctx.fillStyle = '#8cfaff';
        ctx.font = 'bold 27px monospace';
        ctx.fillText('TOKENS', s / 2, 166);
      });
      const signMat = new THREE.MeshStandardMaterial({
        map: signTexture,
        emissiveMap: signTexture,
        emissive: magenta,
        emissiveIntensity: 2.4
      });
      g.add(box(2.3, 1.4, 0.06, signMat, 0, 4.18, 0.71));

      g.add(box(1.75, 0.24, 0.08, mat(0x090911, 0.3, 0.4), 0, 2.75, 0.71));
      g.add(box(0.75, 0.18, 0.08, glowMat(cyan, 2), -0.55, 3.2, 0.73));

      const tray = box(1.5, 0.5, 0.38, mat(0x11121c, 0.5, 0.55), 0, 1.15, 0.78);
      g.add(tray);

      for (let i = 0; i < 4; i++) {
        const token = cylinder(0.12, 0.12, 0.04, mat(0xd7a829, 0.25, 0.85), 20);
        token.rotation.x = Math.PI / 2;
        token.position.set(-0.5 + i * 0.32, 1.25, 1);
        g.add(token);
      }

      const changeLight = new THREE.PointLight(magenta, 5, 6, 2);
      changeLight.position.set(0, 4.2, 1.3);
      g.add(changeLight);

      g.position.set(-14.6, 0, -2.2);
      g.rotation.y = Math.PI / 2;
      scene.add(g);

      animations.push((t) => {
        signMat.emissiveIntensity = 2.1 + Math.sin(t * 3.1) * 0.7;
      });
    }
    createChangeMachine();

    function createMirrorBall() {
      const group = new THREE.Group();
      const radius = 1.05;
      const tileMat = new THREE.MeshStandardMaterial({
        color: 0xb9dfff,
        metalness: 0.95,
        roughness: 0.12,
        emissive: 0x17223c,
        emissiveIntensity: 0.4
      });

      const core = new THREE.Mesh(
        new THREE.SphereGeometry(radius * 0.93, 24, 16),
        mat(0x31394b, 0.25, 0.8)
      );
      group.add(core);

      for (let lat = 0; lat < 13; lat++) {
        const phi = Math.PI * (lat + 0.5) / 13;
        const count = Math.max(6, Math.round(Math.sin(phi) * 30));
        for (let j = 0; j < count; j++) {
          const theta = Math.PI * 2 * j / count;
          const tile = box(0.16, 0.16, 0.035, tileMat);
          const normal = new THREE.Vector3(
            Math.sin(phi) * Math.cos(theta),
            Math.cos(phi),
            Math.sin(phi) * Math.sin(theta)
          );
          tile.position.copy(normal).multiplyScalar(radius);
          tile.lookAt(normal.clone().multiplyScalar(radius * 2));
          tile.castShadow = false;
          group.add(tile);
        }
      }

      const cable = cylinder(0.025, 0.025, 2.5, mat(0x20202b, 0.5, 0.7), 8);
      cable.position.y = 2.25;
      group.add(cable);

      group.position.set(0, 9.2, -8.5);
      scene.add(group);

      const discoColors = [cyan, magenta, orange, violet];
      const discoLights = [];
      for (let i = 0; i < 4; i++) {
        const light = new THREE.SpotLight(
          discoColors[i],
          15,
          30,
          0.18,
          0.65,
          1.7
        );
        light.position.copy(group.position);
        light.target.position.set(
          Math.cos(i * Math.PI / 2) * 10,
          0,
          -8 + Math.sin(i * Math.PI / 2) * 10
        );
        scene.add(light, light.target);
        discoLights.push(light);
      }

      animations.push((t) => {
        group.rotation.y = t * 0.38;
        group.rotation.x = Math.sin(t * 0.2) * 0.08;
        discoLights.forEach((light, i) => {
          light.target.position.x = Math.cos(t * 0.45 + i * 1.57) * 13;
          light.target.position.z = -8 + Math.sin(t * 0.6 + i * 1.57) * 13;
          light.intensity = 11 + Math.sin(t * 1.8 + i) * 4;
        });
      });
    }
    createMirrorBall();

    function createNeonSign() {
      const g = new THREE.Group();
      const backing = box(
        8.4,
        2.8,
        0.18,
        new THREE.MeshPhysicalMaterial({
          color: 0x080812,
          roughness: 0.18,
          metalness: 0.35,
          transparent: true,
          opacity: 0.82
        })
      );
      g.add(backing);

      const signTex = canvasTexture(1024, (ctx, s) => {
        ctx.clearRect(0, 0, s, s);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'italic bold 170px Arial Black, sans-serif';
        ctx.shadowBlur = 45;
        ctx.shadowColor = '#ff1fb8';
        ctx.strokeStyle = '#ff1fb8';
        ctx.lineWidth = 22;
        ctx.strokeText('ARCADE', s / 2, s / 2 - 16);
        ctx.shadowColor = '#00edff';
        ctx.strokeStyle = '#d9ffff';
        ctx.lineWidth = 7;
        ctx.strokeText('ARCADE', s / 2, s / 2 - 16);
        ctx.fillStyle = '#ffffff';
        ctx.fillText('ARCADE', s / 2, s / 2 - 16);
      });
      const signMat = new THREE.MeshBasicMaterial({
        map: signTex,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const sign = new THREE.Mesh(new THREE.PlaneGeometry(8, 2.5), signMat);
      sign.position.z = 0.13;
      g.add(sign);

      const signLight = new THREE.PointLight(magenta, 10, 11, 2);
      signLight.position.set(0, 0, 1.5);
      g.add(signLight);

      g.position.set(0, 7.3, -22.38);
      scene.add(g);

      animations.push((t) => {
        signLight.intensity = 8 + Math.sin(t * 2.7) * 2.2;
        sign.scale.setScalar(1 + Math.sin(t * 1.5) * 0.012);
      });
    }
    createNeonSign();

    function createBench(x, z, rotation = 0) {
      const g = new THREE.Group();
      const cushion = box(3.4, 0.55, 1.15, mat(0x4c174d, 0.55, 0.1), 0, 1.15, 0);
      g.add(cushion);
      const trim = box(3.55, 0.13, 1.25, glowMat(violet, 1.5), 0, 0.83, 0);
      g.add(trim);
      for (const sx of [-1.35, 1.35]) {
        const leg = cylinder(0.11, 0.14, 0.85, mat(0x585b69, 0.25, 0.8), 12);
        leg.position.set(sx, 0.42, 0);
        g.add(leg);
      }
      g.position.set(x, 0, z);
      g.rotation.y = rotation;
      scene.add(g);
    }
    createBench(-8.5, 1.3, -0.2);
    createBench(8.4, 1.8, 0.2);

    function createTrashCan(x, z) {
      const g = new THREE.Group();
      const can = cylinder(
        0.55,
        0.48,
        1.45,
        mat(0x303341, 0.42, 0.72),
        20
      );
      can.position.y = 0.72;
      g.add(can);
      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(0.55, 0.07, 8, 24),
        glowMat(cyan, 1.6)
      );
      rim.rotation.x = Math.PI / 2;
      rim.position.y = 1.45;
      g.add(rim);
      g.position.set(x, 0, z);
      scene.add(g);
    }
    createTrashCan(14.5, -3.4);
    createTrashCan(-12.5, 3);

    function createStool(x, z, color) {
      const g = new THREE.Group();
      const seat = cylinder(0.48, 0.5, 0.18, mat(color, 0.55, 0.1), 24);
      seat.position.y = 1.45;
      g.add(seat);
      const stem = cylinder(0.08, 0.11, 1.35, mat(0x777986, 0.2, 0.85), 12);
      stem.position.y = 0.75;
      g.add(stem);
      const base = cylinder(0.55, 0.7, 0.12, mat(0x393a47, 0.25, 0.7), 24);
      base.position.y = 0.06;
      g.add(base);
      g.position.set(x, 0, z);
      scene.add(g);
    }
    createStool(-4.7, -13.4, magenta);
    createStool(4.8, -13.4, cyan);
    createStool(-5.4, 3.7, orange);

    for (let i = 0; i < 28; i++) {
      const star = new THREE.Mesh(
        new THREE.SphereGeometry(0.025 + rand() * 0.035, 6, 4),
        new THREE.MeshBasicMaterial({
          color: pick([cyan, magenta, orange, 0xffffff])
        })
      );
      star.position.set(
        -15.5 + rand() * 31,
        9.5 + rand() * 2,
        -22 + rand() * 38
      );
      scene.add(star);
    }

    const dustGeometry = new THREE.BufferGeometry();
    const dustCount = 500;
    const dustPositions = new Float32Array(dustCount * 3);
    for (let i = 0; i < dustCount; i++) {
      dustPositions[i * 3] = (rand() - 0.5) * 31;
      dustPositions[i * 3 + 1] = rand() * 11.5;
      dustPositions[i * 3 + 2] = -22 + rand() * 39;
    }
    dustGeometry.setAttribute(
      'position',
      new THREE.BufferAttribute(dustPositions, 3)
    );
    const dust = new THREE.Points(
      dustGeometry,
      new THREE.PointsMaterial({
        color: 0x91cbff,
        size: 0.035,
        transparent: true,
        opacity: 0.35,
        depthWrite: false
      })
    );
    scene.add(dust);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      animations.forEach(fn => fn(t));
      dust.rotation.y = t * 0.012;
      dust.position.y = Math.sin(t * 0.18) * 0.08;

      keyLight.intensity = 62 + Math.sin(t * 0.55) * 4;
      fillLight.intensity = 18 + Math.sin(t * 0.9) * 3;
      orangeLight.intensity = 14 + Math.sin(t * 1.15 + 2) * 3;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
