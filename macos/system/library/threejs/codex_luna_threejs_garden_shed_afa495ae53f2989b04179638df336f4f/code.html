<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Procedural Garden Shed</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#b8d5df}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9d5dc);
scene.fog = new THREE.Fog(0xb9d5dc, 16, 32);

const camera = new THREE.PerspectiveCamera( fortyFive(), innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.2, 5.6, 8.2);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.target.set(2, 1.65, 1.45);
controls.minDistance = 4.5;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.48;

scene.add(new THREE.HemisphereLight(0xdcecf0, 0x63734d, 2.2));

const sun = new THREE.DirectionalLight(0xfff0d2, 3.6);
sun.position.set(-6, 10, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8;
sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;
sun.shadow.camera.bottom = -6;
sun.shadow.bias = -0.0004;
scene.add(sun);

const wood = [
  new THREE.MeshStandardMaterial({color:0x8e4f2d, roughness:0.82}),
  new THREE.MeshStandardMaterial({color:0xa35f35, roughness:0.84}),
  new THREE.MeshStandardMaterial({color:0x794024, roughness:0.86}),
  new THREE.MeshStandardMaterial({color:0xb16d3d, roughness:0.8})
];
const trim = new THREE.MeshStandardMaterial({color:0x59351f, roughness:0.78});
const darkTrim = new THREE.MeshStandardMaterial({color:0x372318, roughness:0.72});
const roofMat = new THREE.MeshStandardMaterial({color:0x4a3028, roughness:0.92});
const roofEdgeMat = new THREE.MeshStandardMaterial({color:0x35231e, roughness:0.88});
const glass = new THREE.MeshStandardMaterial({color:0x294c55, roughness:0.18, metalness:0.1});
const metal = new THREE.MeshStandardMaterial({color:0x252622, roughness:0.38, metalness:0.7});
const groundMat = new THREE.MeshStandardMaterial({color:0x60784d, roughness:1});

function fortyFive(){ return 45; }

function box(name, size, position, material, rotation){
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  if(rotation) mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function plankMaterial(index){ return wood[index % wood.length]; }

const width = 4;
const depth = 3;
const wallHeight = 2.6;
const boardWidth = 0.44;
const boardGap = 0.035;

for(let i=0, x=0.08; x < width - 0.04; i++, x += boardWidth + boardGap){
  const w = Math.min(boardWidth, width - 0.08 - x);
  const center = x + w / 2;
  if(center < 0.53 || center > 2.08){
    box("front siding", [w, wallHeight, 0.12], [center, wallHeight/2, 0], plankMaterial(i));
  }else{
    box("front siding above door", [w, 0.4, 0.12], [center, 2.4, 0], plankMaterial(i));
  }
}

for(let i=0, x=0.08; x < width - 0.04; i++, x += boardWidth + boardGap){
  const w = Math.min(boardWidth, width - 0.08 - x);
  box("rear siding", [w, wallHeight, 0.12], [x + w/2, wallHeight/2, depth], plankMaterial(i+1));
}

for(let i=0, z=0.08; z < depth - 0.04; i++, z += boardWidth + boardGap){
  const d = Math.min(boardWidth, depth - 0.08 - z);
  box("left wall siding", [0.12, wallHeight, d], [0, wallHeight/2, z + d/2], plankMaterial(i+2));
  box("right wall siding", [0.12, wallHeight, d], [width, wallHeight/2, z + d/2], plankMaterial(i+3));
}

box("left corner post", [0.2, 2.75, 0.2], [0, 1.375, 0], trim);
box("right corner post", [0.2, 2.75, 0.2], [width, 1.375, 0], trim);
box("rear left post", [0.2, 2.75, 0.2], [0, 1.375, depth], trim);
box("rear right post", [0.2, 2.75, 0.2], [width, 1.375, depth], trim);

const gableShape = new THREE.Shape();
gableShape.moveTo(0, 2.6);
gableShape.lineTo(width, 2.6);
gableShape.lineTo(width/2, 3.76);
gableShape.closePath();

const gableGeometry = new THREE.ExtrudeGeometry(gableShape, {
  depth:0.12,
  bevelEnabled:false
});
const frontGable = new THREE.Mesh(gableGeometry, wood[1]);
frontGable.position.z = -0.06;
frontGable.castShadow = true;
frontGable.receiveShadow = true;
scene.add(frontGable);

const rearGable = new THREE.Mesh(gableGeometry.clone(), wood[2]);
rearGable.position.z = depth - 0.06;
rearGable.castShadow = true;
rearGable.receiveShadow = true;
scene.add(rearGable);

const roofRise = 1.16;
const roofAngle = Math.atan2(roofRise, width/2);
const roofSlope = Math.sqrt((width/2) ** 2 + roofRise ** 2);
const roofDepth = depth + 0.42;

box("left roof plane", [roofSlope + 0.18, 0.16, roofDepth], [0.94, 3.2, 1.5], roofMat, [0, 0, roofAngle]);
box("right roof plane", [roofSlope + 0.18, 0.16, roofDepth], [3.06, 3.2, 1.5], roofMat, [0, 0, -roofAngle]);

box("front left fascia", [0.17, 0.2, roofDepth], [-0.13, 2.69, 1.5], roofEdgeMat, [0, 0, roofAngle]);
box("front right fascia", [0.17, 0.2, roofDepth], [4.13, 2.69, 1.5], roofEdgeMat, [0, 0, -roofAngle]);
box("ridge cap", [0.22, 0.2, roofDepth], [2, 3.78, 1.5], roofEdgeMat);

const doorGroup = new THREE.Group();
doorGroup.position.set(0.52, 0, -0.13);
doorGroup.rotation.y = -0.13;
scene.add(doorGroup);

function doorBox(size, pos, material, rotation){
  const part = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material);
  part.position.set(pos[0], pos[1], pos[2]);
  if(rotation) part.rotation.set(rotation[0], rotation[1], rotation[2]);
  part.castShadow = true;
  part.receiveShadow = true;
  doorGroup.add(part);
  return part;
}

doorBox([1.48, 2.22, 0.13], [0.74, 1.11, -0.01], wood[2]);
for(let i=1; i<3; i++) doorBox([0.035, 2.08, 0.035], [i*0.49, 1.11, -0.1], darkTrim);
doorBox([1.36, 0.09, 0.06], [0.74, 1.12, -0.1], trim, [0, 0, -0.24]);
doorBox([0.1, 2.35, 0.16], [0.03, 1.17, -0.04], trim);
doorBox([0.1, 2.35, 0.16], [1.45, 1.17, -0.04], trim);
doorBox([1.55, 0.1, 0.16], [0.74, 2.34, -0.04], trim);

const knob = new THREE.Mesh(new THREE.SphereGeometry(0.09, 20, 12), metal);
knob.position.set(1.2, 1.12, -0.17);
knob.castShadow = true;
doorGroup.add(knob);

const hingeGeometry = new THREE.CylinderGeometry(0.045, 0.045, 0.22, 12);
for(const y of [0.55, 1.68]){
  const hinge = new THREE.Mesh(hingeGeometry, metal);
  hinge.rotation.z = Math.PI/2;
  hinge.position.set(0.03, y, -0.17);
  hinge.castShadow = true;
  doorGroup.add(hinge);
}

const windowZ = 1.52;
const windowY = 1.65;
box("window glass", [0.035, 0.8, 1.0], [4.075, windowY, windowZ], glass);
box("window top frame", [0.1, 0.12, 1.18], [4.12, windowY+0.46, windowZ], trim);
box("window bottom frame", [0.1, 0.12, 1.18], [4.12, windowY-0.46, windowZ], trim);
box("window front frame", [0.1, 1.04, 0.12], [4.12, windowY, windowZ-0.56], trim);
box("window rear frame", [0.1, 1.04, 0.12], [4.12, windowY, windowZ+0.56], trim);
box("window vertical mullion", [0.08, 0.82, 0.08], [4.15, windowY, windowZ], darkTrim);
box("window horizontal mullion", [0.08, 0.08, 1.0], [4.15, windowY, windowZ], darkTrim);

box("threshold", [1.8, 0.12, 0.28], [1.25, 0.06, -0.12], trim);
box("front sill", [4.05, 0.1, 0.16], [2, 0.05, -0.1], darkTrim);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), groundMat);
floor.rotation.x = -Math.PI/2;
floor.position.set(2, -0.015, 1.5);
floor.receiveShadow = true;
scene.add(floor);

const pathMat = new THREE.MeshStandardMaterial({color:0x827a63, roughness:1});
for(let i=0; i<6; i++){
  box("stepping stone", [1.2, 0.06, 0.65], [1.35, 0.015, -0.85 - i*0.72], pathMat, [0, (i%2)*0.05, (i%2 ? 0.04 : -0.04)]);
}

const axes = new THREE.AxesHelper(0.8);
axes.position.set(0.02, 0.03, 0.02);
scene.add(axes);

const ambientDust = new THREE.PointLight(0xffdcb5, 0.18, 8);
ambientDust.position.set(2, 2.5, 1);
scene.add(ambientDust);

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", ()=>{
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
