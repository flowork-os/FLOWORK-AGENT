<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egyptian Sarcophagus Lid</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #17130f; }
canvas { display: block; }
.info {
  position: fixed;
  left: 18px;
  bottom: 16px;
  color: #d9c9a5;
  font: 12px/1.5 system-ui, sans-serif;
  letter-spacing: .08em;
  text-transform: uppercase;
  pointer-events: none;
  opacity: .75;
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="info">Anthropoid Sarcophagus Lid · Museum scale · centimeters</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17130f);
scene.fog = new THREE.FogExp2(0x17130f, 0.0017);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(37, window.innerWidth / window.innerHeight, 1, 1500);
camera.position.set(190, 105, 330);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3, 10);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 210;
controls.maxDistance = 650;
controls.maxPolarAngle = Math.PI * 0.76;

const hemi = new THREE.HemisphereLight(0xd8c9aa, 0x21170f, 1.4);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe1aa, 4.2);
key.position.set(-150, 220, 260);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -170;
key.shadow.camera.right = 170;
key.shadow.camera.top = 190;
key.shadow.camera.bottom = -190;
key.shadow.camera.near = 30;
key.shadow.camera.far = 650;
key.shadow.bias = -0.00035;
scene.add(key);

const fill = new THREE.DirectionalLight(0x7089b0, 1.5);
fill.position.set(190, 60, 100);
scene.add(fill);

const rim = new THREE.SpotLight(0xd89a4b, 1000, 650, Math.PI / 5, 0.6, 1.4);
rim.position.set(10, 180, -180);
rim.target.position.set(0, 20, 0);
scene.add(rim, rim.target);

const stone = new THREE.MeshStandardMaterial({
  color: 0x8c6a37,
  roughness: 0.72,
  metalness: 0.08
});
const darkStone = new THREE.MeshStandardMaterial({
  color: 0x30281e,
  roughness: 0.82,
  metalness: 0.04
});
const gold = new THREE.MeshStandardMaterial({
  color: 0xc99a39,
  roughness: 0.34,
  metalness: 0.62
});
const paleGold = new THREE.MeshStandardMaterial({
  color: 0xe1bd68,
  roughness: 0.4,
  metalness: 0.48
});
const blue = new THREE.MeshStandardMaterial({
  color: 0x123c54,
  roughness: 0.38,
  metalness: 0.34
});
const turquoise = new THREE.MeshStandardMaterial({
  color: 0x187d78,
  roughness: 0.43,
  metalness: 0.24
});
const red = new THREE.MeshStandardMaterial({
  color: 0x7c271d,
  roughness: 0.53,
  metalness: 0.12
});
const ivory = new THREE.MeshStandardMaterial({
  color: 0xd3b87c,
  roughness: 0.6,
  metalness: 0.12
});
const black = new THREE.MeshStandardMaterial({
  color: 0x080807,
  roughness: 0.48,
  metalness: 0.05
});

const sarcophagus = new THREE.Group();
sarcophagus.rotation.x = -0.08;
sarcophagus.rotation.y = -0.03;
sarcophagus.position.y = 4;
scene.add(sarcophagus);

function shadow(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function extrudedShape(shape, depth, bevel, material, z) {
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: true,
    bevelSegments: 5,
    steps: 1,
    bevelSize: bevel,
    bevelThickness: bevel
  });
  geometry.translate(0, 0, -depth / 2);
  geometry.computeVertexNormals();
  const mesh = shadow(new THREE.Mesh(geometry, material));
  mesh.position.z = z;
  return mesh;
}

function tube(points, radius, material, z, segments = 48) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], p[1], z)));
  const mesh = shadow(new THREE.Mesh(
    new THREE.TubeGeometry(curve, segments, radius, 8, false),
    material
  ));
  return mesh;
}

function capsule(length, radius, material, x, y, z, angle = 0, scaleX = 1) {
  const mesh = shadow(new THREE.Mesh(
    new THREE.CapsuleGeometry(radius, Math.max(0.1, length - radius * 2), 8, 18),
    material
  ));
  mesh.position.set(x, y, z);
  mesh.rotation.z = angle;
  mesh.scale.x = scaleX;
  return mesh;
}

function box(w, h, d, material, x, y, z, rz = 0) {
  const mesh = shadow(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material));
  mesh.position.set(x, y, z);
  mesh.rotation.z = rz;
  return mesh;
}

const outline = new THREE.Shape();
outline.moveTo(0, 105);
outline.bezierCurveTo(-22, 105, -33, 98, -38, 87);
outline.bezierCurveTo(-49, 79, -57, 66, -60, 49);
outline.bezierCurveTo(-59, 29, -50, 12, -45, -4);
outline.bezierCurveTo(-39, -25, -33, -48, -29, -72);
outline.bezierCurveTo(-27, -88, -22, -101, -12, -106);
outline.quadraticCurveTo(0, -111, 12, -106);
outline.bezierCurveTo(22, -101, 27, -88, 29, -72);
outline.bezierCurveTo(33, -48, 39, -25, 45, -4);
outline.bezierCurveTo(50, 12, 59, 29, 60, 49);
outline.bezierCurveTo(57, 66, 49, 79, 38, 87);
outline.bezierCurveTo(33, 98, 22, 105, 0, 105);
sarcophagus.add(extrudedShape(outline, 18, 3.5, stone, 0));

const rimShape = new THREE.Shape();
rimShape.moveTo(0, 101);
rimShape.bezierCurveTo(-19, 101, -30, 95, -34, 84);
rimShape.bezierCurveTo(-46, 75, -52, 61, -53, 48);
rimShape.bezierCurveTo(-52, 30, -44, 12, -39, -5);
rimShape.bezierCurveTo(-33, -28, -28, -51, -24, -77);
rimShape.quadraticCurveTo(-21, -99, -10, -102);
rimShape.quadraticCurveTo(0, -106, 10, -102);
rimShape.quadraticCurveTo(21, -99, 24, -77);
rimShape.bezierCurveTo(28, -51, 33, -28, 39, -5);
rimShape.bezierCurveTo(44, 12, 52, 30, 53, 48);
rimShape.bezierCurveTo(52, 61, 46, 75, 34, 84);
rimShape.bezierCurveTo(30, 95, 19, 101, 0, 101);

const innerHole = new THREE.Path();
innerHole.moveTo(0, 96);
innerHole.bezierCurveTo(18, 96, 26, 91, 29, 81);
innerHole.bezierCurveTo(40, 72, 46, 59, 47, 47);
innerHole.bezierCurveTo(46, 31, 39, 13, 34, -5);
innerHole.bezierCurveTo(28, -28, 23, -53, 20, -78);
innerHole.quadraticCurveTo(18, -94, 8, -97);
innerHole.quadraticCurveTo(0, -100, -8, -97);
innerHole.quadraticCurveTo(-18, -94, -20, -78);
innerHole.bezierCurveTo(-23, -53, -28, -28, -34, -5);
innerHole.bezierCurveTo(-39, 13, -46, 31, -47, 47);
innerHole.bezierCurveTo(-46, 59, -40, 72, -29, 81);
innerHole.bezierCurveTo(-26, 91, -18, 96, 0, 96);
rimShape.holes.push(innerHole);
sarcophagus.add(extrudedShape(rimShape, 3.2, 0.7, gold, 11.4));

const hood = new THREE.Shape();
hood.moveTo(0, 98);
hood.bezierCurveTo(-24, 99, -37, 88, -38, 71);
hood.lineTo(-47, 50);
hood.lineTo(-34, 34);
hood.lineTo(-24, 48);
hood.bezierCurveTo(-29, 69, -23, 89, 0, 94);
hood.bezierCurveTo(23, 89, 29, 69, 24, 48);
hood.lineTo(34, 34);
hood.lineTo(47, 50);
hood.lineTo(38, 71);
hood.bezierCurveTo(37, 88, 24, 99, 0, 98);
sarcophagus.add(extrudedShape(hood, 4.8, 1.2, gold, 12.3));

for (let i = 0; i < 7; i++) {
  const y = 88 - i * 7.1;
  const width = 25 + i * 2.4;
  const curvePoints = [
    [-width, y - 1.5, 0],
    [-width * 0.55, y + 2.2, 0],
    [0, y + 3.2, 0],
    [width * 0.55, y + 2.2, 0],
    [width, y - 1.5, 0]
  ];
  sarcophagus.add(tube(curvePoints, 2.05, i % 2 === 0 ? blue : paleGold, 16.1, 42));
}

for (let i = 0; i < 6; i++) {
  const y = 67 - i * 6.1;
  sarcophagus.add(box(11.5, 3.15, 2.1, i % 2 ? blue : turquoise, -36 + i * 0.55, y, 16.3, -0.13));
  sarcophagus.add(box(11.5, 3.15, 2.1, i % 2 ? blue : turquoise, 36 - i * 0.55, y, 16.3, 0.13));
}

const face = shadow(new THREE.Mesh(new THREE.SphereGeometry(18, 48, 32), ivory));
face.scale.set(0.76, 1.08, 0.34);
face.position.set(0, 74, 19.2);
sarcophagus.add(face);

const jaw = shadow(new THREE.Mesh(new THREE.SphereGeometry(12, 36, 24), ivory));
jaw.scale.set(0.8, 0.7, 0.25);
jaw.position.set(0, 62.7, 18.3);
sarcophagus.add(jaw);

const nose = shadow(new THREE.Mesh(new THREE.ConeGeometry(2.4, 9.4, 5), ivory));
nose.rotation.x = Math.PI / 2;
nose.position.set(0, 72.2, 26.6);
sarcophagus.add(nose);

function almondEye(x) {
  const eyeShape = new THREE.Shape();
  eyeShape.moveTo(-6, 0);
  eyeShape.quadraticCurveTo(0, 4.1, 6, 0);
  eyeShape.quadraticCurveTo(0, -3.3, -6, 0);
  const eye = shadow(new THREE.Mesh(new THREE.ShapeGeometry(eyeShape, 16), ivory));
  eye.scale.set(0.62, 0.55, 1);
  eye.position.set(x, 77, 25.8);
  sarcophagus.add(eye);

  const pupil = shadow(new THREE.Mesh(new THREE.SphereGeometry(1.45, 20, 12), black));
  pupil.scale.z = 0.42;
  pupil.position.set(x, 77, 26.35);
  sarcophagus.add(pupil);

  sarcophagus.add(tube([
    [x - 4.4, 77.1, 0],
    [x, 79.15, 0],
    [x + 4.5, 77.05, 0]
  ], 0.62, black, 26.15, 24));
}
almondEye(-6.1);
almondEye(6.1);

sarcophagus.add(tube([[-9, 83.2, 0], [-5.2, 84.8, 0], [-1.8, 84.1, 0]], 0.82, black, 25.3, 20));
sarcophagus.add(tube([[1.8, 84.1, 0], [5.2, 84.8, 0], [9, 83.2, 0]], 0.82, black, 25.3, 20));
sarcophagus.add(tube([[-5.7, 66.3, 0], [0, 65.4, 0], [5.7, 66.3, 0]], 0.62, red, 25.15, 24));

const falseBeard = capsule(19, 4.3, gold, 0, 50.5, 20.3, 0, 0.85);
falseBeard.scale.y = 1;
sarcophagus.add(falseBeard);
for (let i = 0; i < 4; i++) {
  sarcophagus.add(box(6.4, 2.1, 1.1, i % 2 ? blue : turquoise, 0, 45.2 + i * 4.1, 24.3));
}

const collarColors = [blue, gold, turquoise, red, paleGold];
for (let i = 0; i < 5; i++) {
  const yy = 47 - i * 4.3;
  const spread = 25 + i * 4.7;
  sarcophagus.add(tube([
    [-spread, yy + 3.2, 0],
    [-spread * 0.55, yy - 1.5, 0],
    [0, yy - 4.2, 0],
    [spread * 0.55, yy - 1.5, 0],
    [spread, yy + 3.2, 0]
  ], 1.75, collarColors[i], 16.7, 48));
}

const leftArm = capsule(55, 6.1, ivory, -10.5, 19.5, 20.2, -1.04, 0.78);
const rightArm = capsule(55, 6.1, ivory, 10.5, 19.5, 21.1, 1.04, 0.78);
sarcophagus.add(leftArm, rightArm);

for (const side of [-1, 1]) {
  const hand = shadow(new THREE.Mesh(new THREE.SphereGeometry(6.3, 28, 18), ivory));
  hand.scale.set(0.72, 1.05, 0.28);
  hand.position.set(side * 19.2, 31.2, side < 0 ? 23.5 : 24.3);
  hand.rotation.z = side * -0.88;
  sarcophagus.add(hand);
}

const crook = tube([
  [-17, 32, 0], [-8, 20, 0], [-2, 7, 0], [-5, -5, 0]
], 1.45, paleGold, 25.2, 42);
sarcophagus.add(crook);
sarcophagus.add(tube([
  [17, 32, 0], [9, 20, 0], [4, 8, 0], [6, -7, 0]
], 1.45, paleGold, 25.5, 42));

for (let i = 0; i < 4; i++) {
  const yy = -8 - i * 20;
  const width = 35 - i * 3.5;
  sarcophagus.add(box(width * 2, 3.4, 2.2, i % 2 ? turquoise : blue, 0, yy, 14.2));
  sarcophagus.add(box(width * 2 - 5, 1.15, 2.5, paleGold, 0, yy - 3.3, 14.6));
}

sarcophagus.add(box(12, 76, 2.4, gold, 0, -43, 14.6));
sarcophagus.add(box(8.5, 72, 2.9, darkStone, 0, -43, 16.1));

function addGlyph(x, y, type, material = paleGold) {
  const z = 18;
  if (type === 0) {
    sarcophagus.add(tube([[x - 2.8, y, 0], [x, y + 3, 0], [x + 2.8, y, 0], [x, y - 3, 0], [x - 2.8, y, 0]], 0.55, material, z, 24));
  } else if (type === 1) {
    sarcophagus.add(tube([[x, y - 3.2, 0], [x, y + 3.1, 0]], 0.62, material, z, 12));
    sarcophagus.add(tube([[x - 2.5, y + 1.8, 0], [x, y + 3.5, 0], [x + 2.5, y + 1.8, 0]], 0.54, material, z, 16));
  } else if (type === 2) {
    const ring = shadow(new THREE.Mesh(new THREE.TorusGeometry(2.7, 0.58, 8, 24), material));
    ring.position.set(x, y, z);
    sarcophagus.add(ring);
    sarcophagus.add(box(1.05, 3.7, 1, material, x, y - 4.1, z));
  } else {
    sarcophagus.add(tube([
      [x - 3, y + 2.5, 0], [x, y + 3.3, 0], [x + 3, y + 2.5, 0],
      [x + 1.2, y, 0], [x + 3, y - 2.6, 0], [x, y - 3.2, 0], [x - 3, y - 2.6, 0]
    ], 0.52, material, z, 28));
  }
}

for (let i = 0; i < 8; i++) addGlyph(0, -16 - i * 9.4, i % 4);

for (const side of [-1, 1]) {
  for (let row = 0; row < 3; row++) {
    const y = -18 - row * 20;
    const wingPoints = [
      [side * 8, y + 4, 0],
      [side * 17, y + 7, 0],
      [side * 29, y + 3, 0],
      [side * 37, y - 2, 0]
    ];
    sarcophagus.add(tube(wingPoints, 1.25, row % 2 ? red : turquoise, 16.8, 30));
    for (let feather = 0; feather < 4; feather++) {
      const x0 = side * (13 + feather * 6);
      sarcophagus.add(tube([
        [x0, y + 4.2, 0],
        [x0 + side * 2, y, 0],
        [x0 + side * 4, y - 4.2, 0]
      ], 0.62, paleGold, 16.9, 16));
    }
  }
}

const scarabBody = shadow(new THREE.Mesh(new THREE.SphereGeometry(5.2, 28, 20), turquoise));
scarabBody.scale.set(1, 0.72, 0.3);
scarabBody.position.set(0, -3, 18);
sarcophagus.add(scarabBody);
sarcophagus.add(tube([[-5, -3, 0], [-10, 1, 0], [-14, -1, 0]], 0.85, gold, 18.2, 18));
sarcophagus.add(tube([[5, -3, 0], [10, 1, 0], [14, -1, 0]], 0.85, gold, 18.2, 18));

const cobra = tube([
  [0, 94, 0], [0, 100, 0], [-2.2, 104, 0], [0, 107, 0], [2.2, 104, 0]
], 1.25, paleGold, 18.2, 32);
sarcophagus.add(cobra);
const cobraHood = shadow(new THREE.Mesh(new THREE.SphereGeometry(3.4, 24, 16), gold));
cobraHood.scale.set(0.75, 1.15, 0.25);
cobraHood.position.set(0, 103.1, 18.2);
sarcophagus.add(cobraHood);

const supportMaterial = new THREE.MeshStandardMaterial({
  color: 0x211d18,
  roughness: 0.7,
  metalness: 0.22
});
const support = shadow(new THREE.Mesh(new THREE.BoxGeometry(82, 11, 36), supportMaterial));
support.position.set(0, -116, -5);
sarcophagus.add(support);

const plaqueBase = shadow(new THREE.Mesh(new THREE.BoxGeometry(46, 1.8, 19), supportMaterial));
plaqueBase.position.set(72, -105, 1);
plaqueBase.rotation.x = -0.35;
scene.add(plaqueBase);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(480, 96),
  new THREE.MeshStandardMaterial({ color: 0x28221b, roughness: 0.88, metalness: 0.02 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -113;
floor.receiveShadow = true;
scene.add(floor);

const dais = shadow(new THREE.Mesh(
  new THREE.CylinderGeometry(118, 126, 9, 72),
  new THREE.MeshStandardMaterial({ color: 0x3a3127, roughness: 0.73, metalness: 0.08 })
));
dais.position.y = -109;
scene.add(dais);

const backGlow = new THREE.Mesh(
  new THREE.CircleGeometry(170, 64),
  new THREE.MeshBasicMaterial({
    color: 0x47301b,
    transparent: true,
    opacity: 0.16,
    side: THREE.DoubleSide,
    depthWrite: false
  })
);
backGlow.position.set(0, 10, -65);
scene.add(backGlow);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
