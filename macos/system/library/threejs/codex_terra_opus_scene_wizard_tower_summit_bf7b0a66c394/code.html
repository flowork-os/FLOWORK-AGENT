<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wizard Tower Summit</title>
<style>
  html,body{margin:0;overflow:hidden;background:#050716}
  canvas{display:block}
  #title{position:fixed;left:22px;top:18px;color:#d8e8ff;font:600 13px/1.4 Georgia,serif;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 2px 8px #000;pointer-events:none;opacity:.85}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="title">The Astral Watchtower</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05081a);
scene.fog = new THREE.FogExp2(0x0a1025, 0.018);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:"high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(47, innerWidth / innerHeight, 0.1, 220);
camera.position.set(17, 12, 22);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;
controls.minDistance = 10;
controls.maxDistance = 42;
controls.maxPolarAngle = Math.PI * 0.48;

let seed = 913731;
const rand = () => {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
};
const range = (a,b) => a + (b-a) * rand();

const stone = new THREE.MeshStandardMaterial({ color:0x30334b, roughness:.88, metalness:.03 });
const stoneDark = new THREE.MeshStandardMaterial({ color:0x171a2d, roughness:.92 });
const stoneEdge = new THREE.MeshStandardMaterial({ color:0x4d5067, roughness:.8 });
const brass = new THREE.MeshStandardMaterial({ color:0x8b6231, roughness:.27, metalness:.88 });
const brassDark = new THREE.MeshStandardMaterial({ color:0x352417, roughness:.38, metalness:.72 });
const wood = new THREE.MeshStandardMaterial({ color:0x2c1720, roughness:.84 });
const woodLight = new THREE.MeshStandardMaterial({ color:0x573128, roughness:.77 });
const leather = new THREE.MeshStandardMaterial({ color:0x39152d, roughness:.65 });
const black = new THREE.MeshStandardMaterial({ color:0x090b12, roughness:.72 });
const ravenMat = new THREE.MeshStandardMaterial({ color:0x10131d, roughness:.35, metalness:.35 });
const cyan = new THREE.MeshStandardMaterial({ color:0x42d9ff, emissive:0x1985ff, emissiveIntensity:2.3, roughness:.28 });
const violet = new THREE.MeshStandardMaterial({ color:0x9a5dff, emissive:0x4f10df, emissiveIntensity:2.7, roughness:.25 });
const goldGlow = new THREE.MeshStandardMaterial({ color:0xffd989, emissive:0xee8a24, emissiveIntensity:2.2, roughness:.25 });

function mesh(geometry, material, x=0,y=0,z=0) {
  const m = new THREE.Mesh(geometry, material);
  m.position.set(x,y,z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
function cylinder(r1,r2,h,mat,x=0,y=0,z=0,segments=12) {
  return mesh(new THREE.CylinderGeometry(r1,r2,h,segments),mat,x,y,z);
}
function box(x,y,z,mat,px=0,py=0,pz=0) {
  return mesh(new THREE.BoxGeometry(x,y,z),mat,px,py,pz);
}
function torus(r,t,mat,x=0,y=0,z=0) {
  const m = mesh(new THREE.TorusGeometry(r,t,10,48),mat,x,y,z);
  return m;
}

function canvasTexture(draw, size=256) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const ctx = c.getContext("2d");
  draw(ctx,size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const bannerTexture = canvasTexture((ctx,s) => {
  ctx.fillStyle="#251139"; ctx.fillRect(0,0,s,s);
  ctx.fillStyle="#5e2f86";
  for(let y=0;y<s;y+=18) ctx.fillRect(0,y,s,7);
  ctx.strokeStyle="#d2ad55"; ctx.lineWidth=8;
  ctx.beginPath(); ctx.moveTo(s*.5,s*.17); ctx.lineTo(s*.76,s*.5); ctx.lineTo(s*.5,s*.83); ctx.lineTo(s*.24,s*.5); ctx.closePath(); ctx.stroke();
  ctx.fillStyle="#78d7f4"; ctx.beginPath(); ctx.arc(s*.5,s*.5,s*.1,0,Math.PI*2); ctx.fill();
});
const runeTexture = canvasTexture((ctx,s) => {
  ctx.clearRect(0,0,s,s); ctx.strokeStyle="#62d8ff"; ctx.shadowColor="#2f8cff"; ctx.shadowBlur=16;
  ctx.lineWidth=6; ctx.beginPath(); ctx.arc(s/2,s/2,s*.39,0,Math.PI*2); ctx.stroke();
  ctx.lineWidth=3;
  for(let i=0;i<12;i++){
    const a=i*Math.PI*2/12, x=s/2+Math.cos(a)*s*.29, y=s/2+Math.sin(a)*s*.29;
    ctx.save(); ctx.translate(x,y); ctx.rotate(a+Math.PI/2);
    ctx.beginPath(); ctx.moveTo(-9,10);ctx.lineTo(0,-12);ctx.lineTo(9,10);ctx.moveTo(-6,2);ctx.lineTo(6,2);ctx.stroke();ctx.restore();
  }
});
const runeMat = new THREE.MeshBasicMaterial({ map:runeTexture, transparent:true, opacity:.95, depthWrite:false, blending:THREE.AdditiveBlending });

const skyGeo = new THREE.SphereGeometry(105, 40, 24);
const skyMat = new THREE.ShaderMaterial({
  side:THREE.BackSide,
  depthWrite:false,
  uniforms:{ top:{value:new THREE.Color(0x030616)}, bottom:{value:new THREE.Color(0x293258)} },
  vertexShader:`varying vec3 vP; void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:`uniform vec3 top;uniform vec3 bottom;varying vec3 vP;void main(){float h=clamp((vP.y+15.0)/50.0,0.0,1.0);gl_FragColor=vec4(mix(bottom,top,h),1.0);}`
});
scene.add(new THREE.Mesh(skyGeo,skyMat));

const stars = new THREE.Points(new THREE.BufferGeometry(), new THREE.PointsMaterial({ color:0xb6d8ff, size:.085, transparent:true, opacity:.85 }));
const starPos = [];
for(let i=0;i<900;i++){
  const r=range(55,98), a=range(0,Math.PI*2), y=range(4,56);
  starPos.push(Math.cos(a)*r,y,Math.sin(a)*r);
}
stars.geometry.setAttribute("position",new THREE.Float32BufferAttribute(starPos,3));
scene.add(stars);

const moon = mesh(new THREE.SphereGeometry(3.1,32,20), new THREE.MeshBasicMaterial({color:0xbdd8ff}), -30,28,-48);
const moonLight = new THREE.PointLight(0x91b9ff, 1.7, 85);
moonLight.position.copy(moon.position);
scene.add(moon,moonLight);

const platform = new THREE.Group();
scene.add(platform);
const base = cylinder(9.3,10.6,1.1,stoneDark,0,.1,0,12);
const upper = cylinder(8.8,9.3,.58,stone,0,.92,0,12);
platform.add(base,upper);
for(let i=0;i<12;i++){
  const a=i*Math.PI*2/12;
  const block = box(3.65,.33,1.05,stoneEdge,Math.cos(a)*7.55,1.36,Math.sin(a)*7.55);
  block.rotation.y=-a;
  platform.add(block);
}
for(let i=0;i<46;i++){
  const a=rand()*Math.PI*2, r=Math.sqrt(rand())*8.1;
  const chip = mesh(new THREE.DodecahedronGeometry(range(.025,.1),0),stoneDark,Math.cos(a)*r,1.25,Math.sin(a)*r);
  platform.add(chip);
}

const runeDisk = mesh(new THREE.CircleGeometry(6.7,64),runeMat,0,1.315,0);
runeDisk.rotation.x=-Math.PI/2;
platform.add(runeDisk);
const runeRing = torus(6.65,.037,cyan,0,1.35,0);
runeRing.rotation.x=Math.PI/2;
platform.add(runeRing);

const tower = new THREE.Group();
tower.position.set(-5.65,2.1,2.1);
scene.add(tower);
tower.add(cylinder(2.15,2.45,5.8,stoneDark,0,2.9,0,14));
tower.add(cylinder(2.38,2.38,.38,stoneEdge,0,.18,0,14));
for(let i=0;i<14;i++){
  const a=i*Math.PI*2/14;
  tower.add(box(.8,.38,.55,stoneEdge,Math.cos(a)*2.13,5.72,Math.sin(a)*2.13).rotateY(-a));
}
tower.add(cylinder(2.65,0,2.7,black,0,7.15,0,14));
for(let i=0;i<5;i++){
  const a=i*Math.PI*2/5+.2;
  const finial= cylinder(.1,.18,1.1,brass,Math.cos(a)*2.1,6.7,Math.sin(a)*2.1,8);
  finial.rotation.z=Math.cos(a)*.38;
  finial.rotation.x=Math.sin(a)*.38;
  tower.add(finial);
}
for(let i=0;i<3;i++){
  const a=i*Math.PI*2/3+.5;
  const window = mesh(new THREE.CircleGeometry(.42,16),cyan,Math.cos(a)*2.19,3.9,Math.sin(a)*2.19);
  window.lookAt(Math.cos(a)*10,3.9,Math.sin(a)*10);
  tower.add(window);
}

const pedestal = new THREE.Group();
pedestal.position.set(0,1.4,0);
scene.add(pedestal);
pedestal.add(cylinder(1.2,1.42,.42,stoneEdge,0,.22,0,10));
pedestal.add(cylinder(.78,1.05,1.25,stone,0,1.02,0,10));
pedestal.add(cylinder(.94,.86,.25,brass,0,1.76,0,12));
for(let i=0;i<4;i++){
  const a=i*Math.PI*.5+.25;
  pedestal.add(cylinder(.10,.14,.75,goldGlow,Math.cos(a)*.72,2.04,Math.sin(a)*.72,8));
}
const orbGroup = new THREE.Group();
orbGroup.position.set(0,2.55,0);
pedestal.add(orbGroup);
const orb = mesh(new THREE.SphereGeometry(.82,32,24),new THREE.MeshStandardMaterial({color:0x87e8ff,emissive:0x1688ff,emissiveIntensity:3.5,roughness:.16,metalness:.05}),0,0,0);
orbGroup.add(orb);
const orbHalo = mesh(new THREE.SphereGeometry(1.14,24,18),new THREE.MeshBasicMaterial({color:0x328dff,transparent:true,opacity:.12,blending:THREE.AdditiveBlending,depthWrite:false}),0,0,0);
orbGroup.add(orbHalo);
const orbLight = new THREE.PointLight(0x51b8ff,5.5,15,2);
orbGroup.add(orbLight);
for(let i=0;i<3;i++){
  const ring=torus(1.1+i*.12,.025,cyan,0,0,0);
  ring.rotation.set(i*.8,i*.45,i*.65);
  orbGroup.add(ring);
}

const telescope = new THREE.Group();
telescope.position.set(3.9,2.0,-1.35);
telescope.rotation.y=-.72;
scene.add(telescope);
for(let i=0;i<3;i++){
  const leg=cylinder(.09,.14,3.25,brassDark,0,0,0,8);
  leg.position.set(Math.cos(i*Math.PI*2/3)*.72,-1.15,Math.sin(i*Math.PI*2/3)*.72);
  leg.rotation.z=Math.cos(i*Math.PI*2/3)*.42;
  leg.rotation.x=-Math.sin(i*Math.PI*2/3)*.42;
  telescope.add(leg);
}
telescope.add(cylinder(.48,.48,.38,brassDark,0,.25,0,12));
const scope = cylinder(.44,.68,3.75,brass,0,1.65,0,16);
scope.rotation.x=Math.PI/2-.45;
scope.position.set(0,1.5,-.2);
telescope.add(scope);
const lens = cylinder(.57,.57,.09,new THREE.MeshStandardMaterial({color:0x6ad6ff,emissive:0x17608d,emissiveIntensity:1.3,metalness:.45,roughness:.16}),0,0,0,16);
lens.rotation.x=Math.PI/2-.45;
lens.position.set(0,2.33,-1.94);
telescope.add(lens);
const eyepiece = cylinder(.30,.38,.52,brassDark,0,0,0,12);
eyepiece.rotation.x=Math.PI/2-.45;
eyepiece.position.set(0,.68,1.56);
telescope.add(eyepiece);
telescope.add(torus(.73,.06,brass,0,1.43,-.16).rotateX(Math.PI/2));

const cloudGroup = new THREE.Group();
scene.add(cloudGroup);
const cloudMat = new THREE.MeshStandardMaterial({color:0x18213e,roughness:1,transparent:true,opacity:.84});
for(let i=0;i<68;i++){
  const a=range(-.45,.95), r=range(19,42), y=range(10,25);
  const cloud=mesh(new THREE.SphereGeometry(range(1.4,4.5),12,8),cloudMat,Math.cos(a)*r,y,-28+Math.sin(a)*r*.35);
  cloud.scale.y=range(.22,.55);
  cloudGroup.add(cloud);
}
const stormGlow = new THREE.PointLight(0x7185ff,0,45);
stormGlow.position.set(4,18,-27);
scene.add(stormGlow);

const crags = new THREE.Group();
scene.add(crags);
for(let i=0;i<38;i++){
  const a=range(0,Math.PI*2), r=range(31,59);
  const h=range(3,14);
  const rock=mesh(new THREE.ConeGeometry(range(.6,2.8),h,range(4,7)),stoneDark,Math.cos(a)*r, h*.36-4, Math.sin(a)*r);
  rock.rotation.y=rand()*Math.PI;
  crags.add(rock);
}

function makeBook(color) {
  const g=new THREE.Group();
  const cover=new THREE.MeshStandardMaterial({color,roughness:.62,metalness:.05});
  g.add(box(1.08,.12,.78,cover,0,.22,0));
  g.add(box(1.08,.12,.78,cover,0,-.22,0));
  g.add(box(1.02,.31,.66,new THREE.MeshStandardMaterial({color:0xd9c39c,roughness:.9}),0,0,0));
  g.add(box(.08,.45,.8,brassDark,-.56,0,0));
  const gem=mesh(new THREE.OctahedronGeometry(.1,0),goldGlow,0,.30,.02);
  g.add(gem);
  return g;
}
const books=[];
[0x53224e,0x16425a,0x58321b,0x28395c,0x4e1835].forEach((c,i)=>{
  const pivot=new THREE.Group();
  pivot.userData={radius:range(2.8,4.55),speed:range(.23,.42),phase:i*1.26,height:range(2.6,4.9)};
  const b=makeBook(c);
  b.rotation.set(range(-.5,.5),range(-.5,.5),range(-.5,.5));
  pivot.add(b);
  scene.add(pivot);
  books.push({pivot,b});
});

function crate(x,z) {
  const g=new THREE.Group(); g.position.set(x,1.75,z); scene.add(g);
  g.add(box(1.05,.82,1.05,wood,0,0,0));
  for(const s of [-1,1]){
    g.add(box(1.14,.10,.11,woodLight,0,s*.3,s*.48));
    g.add(box(.11,.10,1.14,woodLight,s*.48,s*.3,0));
  }
  g.add(box(1.17,.09,1.17,woodLight,0,.46,0));
  const bottle=cylinder(.17,.24,.55,new THREE.MeshStandardMaterial({color:0x48d6ba,emissive:0x0c8f6e,emissiveIntensity:1.4,transparent:true,opacity:.88,roughness:.18}),.16,.78,-.12,10);
  g.add(bottle); g.add(cylinder(.08,.08,.17,brass,.16,1.13,-.12,8));
  const bottle2=cylinder(.13,.2,.43,violet,-.22,.72,.18,10);
  g.add(bottle2); g.add(cylinder(.06,.06,.16,brass,-.22,1.02,.18,8));
  return g;
}
crate(-2.7,4.65);
crate(-3.8,4.1);

const raven = new THREE.Group();
raven.position.set(-4.85,5.15,2.25);
scene.add(raven);
raven.add(cylinder(.18,.27,.66,ravenMat,0,0,0,10));
const head=mesh(new THREE.SphereGeometry(.24,12,10),ravenMat,0,.46,-.12); raven.add(head);
const beak=mesh(new THREE.ConeGeometry(.08,.34,4),brassDark,0,.44,-.38); beak.rotation.x=-Math.PI/2; raven.add(beak);
const wingL=mesh(new THREE.SphereGeometry(.31,12,8),ravenMat,-.26,.05,.02); wingL.scale.set(1,.45,2.3); raven.add(wingL);
const wingR=wingL.clone(); wingR.position.x=.26; raven.add(wingR);
for(let i=0;i<2;i++) raven.add(cylinder(.018,.018,.42,brassDark,(i-.5)*.13,-.43,0,6));
const ravenEye=mesh(new THREE.SphereGeometry(.035,8,6),goldGlow,.13,.52,-.3); raven.add(ravenEye);

function banner(x,z,flip=1) {
  const pole=cylinder(.065,.065,4.6,brass,x,4.3,z,8); scene.add(pole);
  const top=mesh(new THREE.SphereGeometry(.14,10,8),goldGlow,x,6.65,z); scene.add(top);
  const geo=new THREE.PlaneGeometry(1.35,2.22,10,14);
  const mat=new THREE.MeshStandardMaterial({map:bannerTexture,side:THREE.DoubleSide,roughness:.72,metalness:.05});
  const flag=new THREE.Mesh(geo,mat);
  flag.position.set(x+flip*.7,5.35,z);
  flag.userData={flip,baseX:x,baseZ:z};
  scene.add(flag);
  return flag;
}
const banners=[banner(-7.0,-2.7,1),banner(6.75,2.85,-1),banner(-2.4,-6.7,1)];

const candles = new THREE.Group();
scene.add(candles);
for(let i=0;i<18;i++){
  const a=rand()*Math.PI*2, r=range(5.3,6.1);
  const c=cylinder(.075,.095,range(.25,.48),new THREE.MeshStandardMaterial({color:0xe8d5aa,roughness:.9}),Math.cos(a)*r,1.58,Math.sin(a)*r,8);
  candles.add(c);
  const flame=mesh(new THREE.SphereGeometry(.09,8,6),goldGlow,c.position.x, c.position.y+.3, c.position.z);
  flame.scale.y=1.8; candles.add(flame);
}

const ambient = new THREE.HemisphereLight(0x5b78b5,0x10101b,1.35);
scene.add(ambient);
const key = new THREE.DirectionalLight(0x9db9ff,2.2);
key.position.set(-12,19,9);
key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-18; key.shadow.camera.right=18; key.shadow.camera.top=18; key.shadow.camera.bottom=-18;
scene.add(key);
const warm = new THREE.PointLight(0xff9a55,2.1,18,2);
warm.position.set(-3.5,5.6,3.3);
scene.add(warm);

const lightning = new THREE.Group();
lightning.visible=false;
scene.add(lightning);
const boltMat=new THREE.MeshBasicMaterial({color:0xdff5ff,transparent:true,opacity:.95});
const boltPts=[];
let bx=6, by=28, bz=-29;
boltPts.push(new THREE.Vector3(bx,by,bz));
for(let i=0;i<9;i++){
  bx+=range(-1.2,1.2); by-=range(1.2,2.6); bz+=range(-.25,.25);
  boltPts.push(new THREE.Vector3(bx,by,bz));
}
lightning.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(boltPts),boltMat));
const lightningLight=new THREE.PointLight(0xbfd8ff,0,75,2);
lightningLight.position.set(6,18,-27);
scene.add(lightningLight);

let lastLightning=0, lightningUntil=0;
const clock=new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();

  orbGroup.rotation.y=t*.65;
  orb.position.y=Math.sin(t*1.7)*.08;
  orbHalo.scale.setScalar(1+Math.sin(t*2.1)*.08);
  runeMat.opacity=.72+Math.sin(t*1.4)*.18;
  runeRing.material.emissiveIntensity=1.8+Math.sin(t*1.6)*.6;

  books.forEach(({pivot,b})=>{
    const d=pivot.userData, a=t*d.speed+d.phase;
    pivot.position.set(Math.cos(a)*d.radius,d.height+Math.sin(a*1.7)*.34,Math.sin(a)*d.radius);
    b.rotation.x=Math.sin(t*1.2+d.phase)*.35;
    b.rotation.y=-a+Math.PI*.5;
    b.rotation.z=Math.cos(t*1.45+d.phase)*.24;
  });

  banners.forEach((f,i)=>{
    const pos=f.geometry.attributes.position;
    for(let j=0;j<pos.count;j++){
      const x=pos.getX(j), y=pos.getY(j);
      const ripple=Math.sin(t*4.2+y*3.4+i*1.7)*(.08+Math.abs(x)*.08);
      pos.setZ(j,ripple);
    }
    pos.needsUpdate=true;
    f.rotation.y=Math.sin(t*.7+i)*.13;
  });

  raven.rotation.y=Math.sin(t*.8)*.22;
  raven.position.y=5.15+Math.sin(t*1.5)*.025;
  cloudGroup.position.x=Math.sin(t*.045)*4;

  if(t-lastLightning>range(7,13)){
    lastLightning=t;
    lightningUntil=t+range(.08,.18);
    lightning.visible=true;
    stormGlow.intensity=17;
    lightningLight.intensity=18;
    renderer.toneMappingExposure=1.75;
  }
  if(t>lightningUntil && lightning.visible){
    lightning.visible=false;
    stormGlow.intensity=0;
    lightningLight.intensity=0;
    renderer.toneMappingExposure=1.22;
  }

  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
