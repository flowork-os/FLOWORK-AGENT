<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxel Robot</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1c22; }
  #c { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Renderer ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// ---------- Scene & Camera ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1c22);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(6, 5.5, 9);

// ---------- Controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 5;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 2.6, 0);

// ---------- Lighting ----------
const hemi = new THREE.HemisphereLight(0xbcd3ff, 0x2a2620, 0.55);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff2e0, 2.4);
keyLight.position.set(6, 10, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 40;
keyLight.shadow.camera.left = -10;
keyLight.shadow.camera.right = 10;
keyLight.shadow.camera.top = 12;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x9fb8ff, 0.7);
fillLight.position.set(-7, 5, 4);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffcf8f, 1.1);
rimLight.position.set(-4, 6, -8);
scene.add(rimLight);

// ---------- Ground (shadow only) ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.32 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Voxel helpers ----------
const U = 0.5; // unit cube size (world units per voxel)
const voxelGeo = new THREE.BoxGeometry(U, U, U);

// Palette (flat matte primary colors)
const COL = {
  body:    0xe8402e, // primary red
  bodyDk:  0xb32a1d, // darker red accent
  head:    0xf0f0f2, // off-white
  limb:    0x2f6fd0, // primary blue
  limbDk:  0x1f4f9c,
  metal:   0x9aa2ad, // grey metal
  panel:   0x2b2f38, // dark panel
  yellow:  0xf5c518, // antenna tip / accents
  eye:     0x39f0d8  // glowing cyan eyes
};

function matFor(color) {
  return new THREE.MeshStandardMaterial({
    color: color,
    roughness: 0.85,
    metalness: 0.06,
    flatShading: true
  });
}

const materials = {
  body:   matFor(COL.body),
  bodyDk: matFor(COL.bodyDk),
  head:   matFor(COL.head),
  limb:   matFor(COL.limb),
  limbDk: matFor(COL.limbDk),
  metal:  matFor(COL.metal),
  panel:  matFor(COL.panel),
  yellow: matFor(COL.yellow),
  eye: new THREE.MeshStandardMaterial({
    color: COL.eye,
    emissive: COL.eye,
    emissiveIntensity: 1.6,
    roughness: 0.4,
    metalness: 0.0,
    flatShading: true
  })
};

const robot = new THREE.Group();

// Place a rectangular block of voxels.
// sx,sy,sz = size in voxel counts; cx,cy,cz = center position in world units.
function addBlock(sx, sy, sz, cx, cy, cz, material) {
  const grp = new THREE.Group();
  const startX = -(sx - 1) / 2;
  const startY = -(sy - 1) / 2;
  const startZ = -(sz - 1) / 2;
  for (let ix = 0; ix < sx; ix++) {
    for (let iy = 0; iy < sy; iy++) {
      for (let iz = 0; iz < sz; iz++) {
        const cube = new THREE.Mesh(voxelGeo, material);
        cube.castShadow = true;
        cube.receiveShadow = true;
        cube.position.set((startX + ix) * U, (startY + iy) * U, (startZ + iz) * U);
        grp.add(cube);
      }
    }
  }
  grp.position.set(cx, cy, cz);
  robot.add(grp);
  return grp;
}

// Single accent voxel
function addVoxel(cx, cy, cz, material) {
  const cube = new THREE.Mesh(voxelGeo, material);
  cube.castShadow = true;
  cube.receiveShadow = true;
  cube.position.set(cx, cy, cz);
  robot.add(cube);
  return cube;
}

// ---------- Build robot (units: 1 voxel = U = 0.5 world) ----------
// Everything measured so feet sit on y = 0.

// Legs: each 2x4x2 voxels -> height 2.0 world (y 0..2.0)
addBlock(2, 4, 2, -0.55, 1.0, 0, materials.limb);
addBlock(2, 4, 2,  0.55, 1.0, 0, materials.limb);
// Feet accent (darker) - front rows
addBlock(2, 1, 1, -0.55, 0.25, 0.5, materials.limbDk);
addBlock(2, 1, 1,  0.55, 0.25, 0.5, materials.limbDk);

// Torso: 6 wide x 6 tall x 3 deep -> 3.0 x 3.0 x 1.5 world, centered y ~ 3.5
const torsoCenterY = 2.0 + 1.5; // = 3.5
addBlock(6, 6, 3, 0, torsoCenterY, 0, materials.body);

// Waist accent band (darker red) at bottom row of torso
addBlock(6, 1, 3, 0, 2.25, 0, materials.bodyDk);

// Shoulders accent (darker) top row
addBlock(6, 1, 3, 0, 4.75, 0, materials.bodyDk);

// Chest panel: small dark panel on front, with a couple of buttons.
const torsoFrontZ = 1.5 * U + 0.001; // front face of torso (3 deep -> 1.5 half? )
// torso depth = 3 voxels = 1.5 world, half = 0.75
const frontZ = 0.75 + U / 2; // panel voxel centers sit just outside front face
addBlock(3, 2, 1, 0, 3.6, 0.75 + U / 2 - 0.001, materials.panel);
// Buttons on the panel (glowing + yellow)
addVoxel(-0.5, 3.85, 0.75 + U + 0.02, materials.eye);
addVoxel( 0.5, 3.85, 0.75 + U + 0.02, materials.yellow);
addVoxel( 0.0, 3.35, 0.75 + U + 0.02, materials.metal);

// Neck: 2x1x2 metal
addBlock(2, 1, 2, 0, 5.25, 0, materials.metal);

// Head: 5x5x5 voxels -> 2.5 world cube, centered y ~ 6.75
const headCenterY = 5.5 + 1.25; // = 6.75
const head = addBlock(5, 5, 5, 0, headCenterY, 0, materials.head);

// Head face plate (dark) recessed look on front
addBlock(5, 3, 1, 0, 6.7, 1.25 + U / 2 - 0.02, materials.panel);

// Eyes: two glowing square eyes on the face (each 1x1x1 but scaled to a square 2-wide)
const eyeZ = 1.25 + U / 2 + 0.02;
const eyeL = addVoxel(-0.6, 6.9, eyeZ, materials.eye);
const eyeR = addVoxel( 0.6, 6.9, eyeZ, materials.eye);

// Mouth grille - a row of metal voxels
addVoxel(-0.5, 6.15, eyeZ, materials.metal);
addVoxel( 0.0, 6.15, eyeZ, materials.metal);
addVoxel( 0.5, 6.15, eyeZ, materials.metal);

// Ear/side bolts
addVoxel(-1.25 - U / 2 + 0.01, 6.75, 0, materials.yellow);
addVoxel( 1.25 + U / 2 - 0.01, 6.75, 0, materials.yellow);

// Antenna: stacked cubes rising from top of head
const antennaBaseY = headCenterY + 1.25 + U / 2; // top face of head + half voxel
addVoxel(0, antennaBaseY, 0, materials.metal);
addVoxel(0, antennaBaseY + U, 0, materials.metal);
addVoxel(0, antennaBaseY + 2 * U, 0, materials.metal);
const antennaTip = addVoxel(0, antennaBaseY + 3 * U, 0, materials.yellow);
antennaTip.scale.set(0.7, 0.7, 0.7);
// tiny glow ball at very top
const tipGlow = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.22, 0),
  new THREE.MeshStandardMaterial({ color: COL.eye, emissive: COL.eye, emissiveIntensity: 2.0, roughness: 0.3 })
);
tipGlow.position.set(0, antennaBaseY + 4 * U, 0);
tipGlow.castShadow = true;
robot.add(tipGlow);

// small point light at antenna tip for extra glow feel
const tipLight = new THREE.PointLight(COL.eye, 0.6, 4, 2);
tipLight.position.copy(tipGlow.position);
robot.add(tipLight);

// ---------- Arms ----------
// Arms are groups pivoting from shoulder so we can pose them slightly.
function buildArm(side) {
  const arm = new THREE.Group();
  // shoulder pivot location (outer side of torso, near top)
  const shoulderX = side * (1.5 + U); // torso half-width 1.5 + half voxel
  const shoulderY = 4.6;
  arm.position.set(shoulderX, shoulderY, 0);

  // Build arm downward from pivot: 2x4x2 voxels
  const armInner = new THREE.Group();
  const sx = 2, sy = 4, sz = 2;
  const startX = -(sx - 1) / 2, startY = -(sy - 1) / 2, startZ = -(sz - 1) / 2;
  for (let ix = 0; ix < sx; ix++) {
    for (let iy = 0; iy < sy; iy++) {
      for (let iz = 0; iz < sz; iz++) {
        const mat = (iy === 0) ? materials.metal : materials.limb;
        const cube = new THREE.Mesh(voxelGeo, mat);
        cube.castShadow = true;
        cube.receiveShadow = true;
        cube.position.set((startX + ix) * U, (startY + iy) * U, (startZ + iz) * U);
        armInner.add(cube);
      }
    }
  }
  // offset so top of arm sits at pivot
  armInner.position.y = -(sy * U) / 2 + U / 2 - U * 0.5;
  arm.add(armInner);

  // slight outward pose
  arm.rotation.z = side * -0.08;
  robot.add(arm);
  return arm;
}
const armL = buildArm(-1);
const armR = buildArm(1);

// ---------- Center the robot ----------
scene.add(robot);
// Robot built with feet at y=0 already; just center x/z.
robot.position.set(0, 0, 0);

// ---------- Animation ----------
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Eye glow pulse
  const pulse = 1.3 + Math.sin(t * 2.2) * 0.5;
  materials.eye.emissiveIntensity = pulse;
  tipGlow.material.emissiveIntensity = 1.6 + Math.sin(t * 3.0) * 0.6;
  tipLight.intensity = 0.4 + (Math.sin(t * 3.0) * 0.5 + 0.5) * 0.5;

  // Gentle arm sway
  armL.rotation.x = Math.sin(t * 1.3) * 0.12;
  armR.rotation.x = Math.sin(t * 1.3 + Math.PI) * 0.12;

  controls.update();
  renderer.render(scene, camera);
}
animate();

// ---------- Resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>
</body>
</html>
