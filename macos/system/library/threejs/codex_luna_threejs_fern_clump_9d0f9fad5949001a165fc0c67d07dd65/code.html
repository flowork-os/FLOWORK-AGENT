<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Fern Clump</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101914;
    }
    canvas {
      display: block;
    }
    .label {
      position: fixed;
      left: 24px;
      bottom: 20px;
      color: rgba(224, 244, 217, 0.78);
      font: 12px/1.4 system-ui, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="label">Fern clump · procedural study</div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101914);
    scene.fog = new THREE.FogExp2(0x101914, 0.055);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(6.6, 4.3, 7.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;
    controls.target.set(0, 1.75, 0);
    controls.minDistance = 3.8;
    controls.maxDistance = 12;
    controls.maxPolarAngle = Math.PI * 0.48;

    const hemi = new THREE.HemisphereLight(0xc9e7c5, 0x18271b, 2.0);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff3d1, 3.2);
    sun.position.set(-4.5, 8.5, 4.8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -6;
    sun.shadow.camera.right = 6;
    sun.shadow.camera.top = 8;
    sun.shadow.camera.bottom = -4;
    sun.shadow.bias = -0.00015;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x83baff, 0.7);
    fill.position.set(5, 4, -5);
    scene.add(fill);

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x1b2a1d,
      roughness: 0.96,
      metalness: 0
    });
    const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 96), groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.035;
    ground.receiveShadow = true;
    scene.add(ground);

    const soilMaterial = new THREE.MeshStandardMaterial({
      color: 0x241b13,
      roughness: 1
    });
    const soil = new THREE.Mesh(new THREE.SphereGeometry(0.72, 32, 18), soilMaterial);
    soil.scale.set(1.35, 0.32, 1.35);
    soil.position.y = 0.03;
    soil.castShadow = true;
    soil.receiveShadow = true;
    scene.add(soil);

    const crownMaterial = new THREE.MeshStandardMaterial({
      color: 0x5d7c35,
      roughness: 0.86
    });
    for (let i = 0; i < 13; i++) {
      const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(0.22 + (i % 3) * 0.035, 1), crownMaterial);
      const angle = i * 2.399;
      crown.position.set(Math.cos(angle) * 0.34, 0.18 + (i % 4) * 0.035, Math.sin(angle) * 0.34);
      crown.scale.set(1.1, 0.7, 1.1);
      crown.rotation.set(i * 0.4, angle, i * 0.23);
      crown.castShadow = true;
      crown.receiveShadow = true;
      scene.add(crown);
    }

    function randomGenerator(seed) {
      let value = seed >>> 0;
      return function () {
        value = (value * 1664525 + 1013904223) >>> 0;
        return value / 4294967296;
      };
    }

    function createLeafGeometry() {
      const positions = [];
      const indices = [];
      const rows = [0, 0.34, 0.7, 1];
      const widths = [0.025, 0.68, 0.44, 0.01];

      for (let i = 0; i < rows.length; i++) {
        const x = rows[i];
        const width = widths[i];
        positions.push(x, width, 0);
        positions.push(x, 0, i === 1 || i === 2 ? 0.085 : 0.025);
        positions.push(x, -width, 0);
      }

      for (let i = 0; i < rows.length - 1; i++) {
        const a = i * 3;
        const b = (i + 1) * 3;
        indices.push(a, b, a + 1, a + 1, b, b + 1);
        indices.push(a + 1, b + 1, a + 2, a + 2, b + 1, b + 2);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    const leafGeometry = createLeafGeometry();
    const leafMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x4f9b43, roughness: 0.78, side: THREE.DoubleSide }),
      new THREE.MeshStandardMaterial({ color: 0x6eae4e, roughness: 0.74, side: THREE.DoubleSide }),
      new THREE.MeshStandardMaterial({ color: 0x397d3d, roughness: 0.8, side: THREE.DoubleSide }),
      new THREE.MeshStandardMaterial({ color: 0x82bb57, roughness: 0.76, side: THREE.DoubleSide })
    ];

    const stemMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x376b36, roughness: 0.82 }),
      new THREE.MeshStandardMaterial({ color: 0x4a833c, roughness: 0.8 }),
      new THREE.MeshStandardMaterial({ color: 0x2e5f35, roughness: 0.86 })
    ];

    const random = randomGenerator(73491);
    const up = new THREE.Vector3(0, 1, 0);
    const localForward = new THREE.Vector3(1, 0, 0);
    const frondCount = 27;

    for (let i = 0; i < frondCount; i++) {
      const angle = (i / frondCount) * Math.PI * 2 + (random() - 0.5) * 0.34;
      const radial = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
      const sideAxis = new THREE.Vector3(-Math.sin(angle), 0, Math.cos(angle));
      const length = 2.7 + random() * 2.05;
      const height = 2.15 + random() * 1.7;
      const lean = 0.1 + random() * 0.33;
      const baseY = 0.22 + random() * 0.09;
      const pointCount = 10;
      const points = [];

      for (let j = 0; j <= pointCount; j++) {
        const t = j / pointCount;
        const outward = length * (0.08 * t + 0.92 * Math.pow(t, 0.92));
        const arch = Math.sin(t * Math.PI * 0.88);
        const droop = Math.pow(Math.max(0, t - 0.74) / 0.26, 2) * (0.35 + random() * 0.25);
        const lateral = Math.sin(t * 4.2 + i * 1.7) * 0.06 * t;
        const point = radial.clone().multiplyScalar(outward);
        point.add(sideAxis.clone().multiplyScalar(lateral));
        point.y = baseY + height * arch - droop;
        points.push(point);
      }

      const curve = new THREE.CatmullRomCurve3(points);
      curve.curveType = "centripetal";
      curve.tension = 0.42;

      const stemRadius = 0.025 + random() * 0.018;
      const stem = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 34, stemRadius, 7, false),
        stemMaterials[i % stemMaterials.length]
      );
      stem.castShadow = true;
      stem.receiveShadow = true;
      scene.add(stem);

      const leafletCount = 17 + Math.floor(random() * 11);
      for (let j = 1; j < leafletCount; j++) {
        const t = j / leafletCount;
        const position = curve.getPointAt(t);
        const tangent = curve.getTangentAt(t).normalize();
        const sideSign = j % 2 === 0 ? 1 : -1;
        const alternatingOffset = sideAxis.clone().multiplyScalar(sideSign * (0.012 + random() * 0.018));
        const leafDirection = sideAxis.clone().multiplyScalar(sideSign * (0.82 + random() * 0.14));
        leafDirection.add(tangent.clone().multiplyScalar(0.34 + random() * 0.22));
        leafDirection.y += 0.025 + random() * 0.11;
        leafDirection.normalize();

        const lengthFactor = 0.55 + Math.sin(t * Math.PI) * (0.76 + random() * 0.28);
        const leafletLength = Math.max(0.22, lengthFactor * (0.48 + length * 0.08));
        const leafletWidth = leafletLength * (0.18 + random() * 0.06);

        const leaflet = new THREE.Mesh(leafGeometry, leafMaterials[(i + j) % leafMaterials.length]);
        leaflet.position.copy(position).add(alternatingOffset);
        leaflet.quaternion.setFromUnitVectors(localForward, leafDirection);
        leaflet.scale.set(leafletLength, leafletWidth, 1);
        leaflet.rotation.z += (random() - 0.5) * 0.18;
        leaflet.castShadow = true;
        leaflet.receiveShadow = true;
        scene.add(leaflet);
      }
    }

    const ringMaterial = new THREE.MeshStandardMaterial({
      color: 0x365a2d,
      roughness: 0.9
    });
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.57, 0.045, 8, 40), ringMaterial);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.16;
    ring.scale.set(1.18, 1, 1.18);
    ring.castShadow = true;
    scene.add(ring);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
