<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Low-Poly Boxing Gloves</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171118;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171118);
scene.fog = new THREE.Fog(0x171118, 7, 14);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.2, 3.1, 6.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.15;
controls.minDistance = 4;
controls.maxDistance = 10;
controls.target.set(0, 0.45, 0);

const redMaterial = new THREE.MeshStandardMaterial({
  color: 0xb51f35,
  roughness: 0.76,
  metalness: 0.02,
  flatShading: true
});
const redDarkMaterial = new THREE.MeshStandardMaterial({
  color: 0x761426,
  roughness: 0.82,
  metalness: 0.01,
  flatShading: true
});
const redHighlightMaterial = new THREE.MeshStandardMaterial({
  color: 0xd52d43,
  roughness: 0.7,
  metalness: 0.01,
  flatShading: true
});
const laceMaterial = new THREE.MeshStandardMaterial({
  color: 0xf1e8dc,
  roughness: 0.62,
  metalness: 0.02,
  flatShading: true
});
const trimMaterial = new THREE.MeshStandardMaterial({
  color: 0xd2bca8,
  roughness: 0.72,
  metalness: 0.02,
  flatShading: true
});
const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x30212a,
  roughness: 0.92,
  metalness: 0,
  flatShading: true
});

function addMesh(parent, geometry, material, position, scale, rotation) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(position.x, position.y, position.z);
  mesh.scale.set(scale.x, scale.y, scale.z);
  if (rotation) mesh.rotation.set(rotation.x, rotation.y, rotation.z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function createGlove(side) {
  const glove = new THREE.Group();
  glove.position.set(side * 0.98, 0.38, 0);
  glove.scale.x = side;

  const palmGeometry = new THREE.IcosahedronGeometry(0.62, 2);
  addMesh(glove, palmGeometry, redMaterial, { x: 0.04, y: 0.02, z: 0.02 }, { x: 1.0, y: 1.12, z: 0.72 }, { x: 0.06, y: -0.2, z: 0.05 });

  const knuckleGeometry = new THREE.IcosahedronGeometry(0.58, 2);
  addMesh(glove, knuckleGeometry, redHighlightMaterial, { x: 0.33, y: 0.34, z: 0.02 }, { x: 1.05, y: 0.78, z: 0.8 }, { x: -0.08, y: 0.15, z: -0.06 });

  const backGeometry = new THREE.IcosahedronGeometry(0.48, 1);
  addMesh(glove, backGeometry, redDarkMaterial, { x: -0.08, y: -0.27, z: -0.08 }, { x: 1.0, y: 0.62, z: 0.72 }, { x: 0.1, y: -0.18, z: 0.1 });

  const knuckleBumpGeometry = new THREE.IcosahedronGeometry(0.25, 1);
  for (let index = 0; index < 4; index += 1) {
    addMesh(
      glove,
      knuckleBumpGeometry,
      redMaterial,
      { x: 0.48 + index * 0.055, y: 0.5 - index * 0.13, z: 0.38 },
      { x: 0.72, y: 0.82, z: 0.48 },
      { x: index * 0.08, y: -0.2, z: index * 0.15 }
    );
  }

  const thumbGeometry = new THREE.IcosahedronGeometry(0.35, 1);
  addMesh(glove, thumbGeometry, redMaterial, { x: 0.3, y: -0.18, z: 0.42 }, { x: 0.9, y: 0.78, z: 0.85 }, { x: 0.28, y: -0.3, z: -0.22 });

  const cuffGeometry = new THREE.CylinderGeometry(0.36, 0.31, 0.54, 8, 1, false);
  addMesh(glove, cuffGeometry, redDarkMaterial, { x: -0.5, y: 0, z: 0 }, { x: 1, y: 1, z: 1 }, { x: 0, y: 0, z: Math.PI / 2 });

  const cuffFrontGeometry = new THREE.CylinderGeometry(0.34, 0.34, 0.075, 8, 1, false);
  addMesh(glove, cuffFrontGeometry, redMaterial, { x: -0.22, y: 0, z: 0 }, { x: 1, y: 1, z: 1 }, { x: 0, y: 0, z: Math.PI / 2 });

  const trimGeometry = new THREE.CylinderGeometry(0.365, 0.365, 0.09, 8, 1, false);
  addMesh(glove, trimGeometry, trimMaterial, { x: -0.78, y: 0, z: 0 }, { x: 1, y: 1, z: 1 }, { x: 0, y: 0, z: Math.PI / 2 });

  const laceLoopGeometry = new THREE.TorusGeometry(0.13, 0.034, 5, 8);
  const laceBarGeometry = new THREE.BoxGeometry(0.052, 0.29, 0.045);

  for (let index = 0; index < 3; index += 1) {
    const loop = addMesh(
      glove,
      laceLoopGeometry,
      laceMaterial,
      { x: -0.68 + index * 0.14, y: 0.01, z: 0.335 },
      { x: 1.0, y: 1.35, z: 0.72 },
      { x: 0.12, y: 0.04, z: 0.08 }
    );
    loop.rotation.x = 0.1;
    loop.rotation.y = 0.12;
    loop.rotation.z = 0.12;

    addMesh(
      glove,
      laceBarGeometry,
      laceMaterial,
      { x: -0.68 + index * 0.14, y: 0.015, z: 0.35 },
      { x: 1, y: 1, z: 1 },
      { x: 0, y: 0.12, z: index % 2 === 0 ? -0.08 : 0.08 }
    );
  }

  const seamGeometry = new THREE.BoxGeometry(0.035, 0.52, 0.025);
  addMesh(glove, seamGeometry, redDarkMaterial, { x: 0.1, y: 0.02, z: 0.56 }, { x: 1, y: 1, z: 1 }, { x: 0, y: -0.12, z: 0.05 });

  scene.add(glove);
}

createGlove(-1);
createGlove(1);

const wristConnectorGeometry = new THREE.CylinderGeometry(0.22, 0.22, 0.48, 8, 1, false);
addMesh(scene, wristConnectorGeometry, redDarkMaterial, { x: 0, y: 0.38, z: 0 }, { x: 1, y: 1, z: 1 }, { x: 0, y: 0, z: Math.PI / 2 });

const connectorBandGeometry = new THREE.CylinderGeometry(0.245, 0.245, 0.09, 8, 1, false);
addMesh(scene, connectorBandGeometry, trimMaterial, { x: 0, y: 0.38, z: 0 }, { x: 1, y: 1, z: 1 }, { x: 0, y: 0, z: Math.PI / 2 });

const floorGeometry = new THREE.PlaneGeometry(30, 30);
const floor = new THREE.Mesh(floorGeometry, floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.82;
floor.receiveShadow = true;
scene.add(floor);

const hemiLight = new THREE.HemisphereLight(0xffdfe1, 0x20131c, 2.1);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(0xffd5bd, 4.4);
keyLight.position.set(-4, 7, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -4;
keyLight.shadow.camera.right = 4;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -3;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 18;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x8c9dff, 1.5);
fillLight.position.set(5, 2, -4);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xff4f64, 2.2, 8, 2);
rimLight.position.set(0, 2.7, -2.7);
scene.add(rimLight);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

function handleResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.addEventListener("resize", handleResize);
animate();
</script>
</body>
</html>
