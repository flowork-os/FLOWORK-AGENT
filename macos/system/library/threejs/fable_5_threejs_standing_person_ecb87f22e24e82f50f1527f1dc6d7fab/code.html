<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Standing Person</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e8e6e1}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e6e1);
scene.fog = new THREE.Fog(0xe8e6e1, 8, 20);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(2.4, 1.7, 3.2);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 1.5;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.52;

// Lighting
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x9a8f80, 0.9));
const key = new THREE.DirectionalLight(0xfff2e0, 1.6);
key.position.set(3, 5, 2.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -2;
key.shadow.camera.right = key.shadow.camera.top = 2;
key.shadow.radius = 6;
key.shadow.bias = -0.0005;
scene.add(key);
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.4);
fill.position.set(-3, 2, -2);
scene.add(fill);

// Ground + soft shadow
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 48).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({ color:0xdedbd4, roughness:1 })
);
ground.receiveShadow = true;
scene.add(ground);
const shadowCatcher = new THREE.Mesh(
  new THREE.CircleGeometry(9, 48).rotateX(-Math.PI/2),
  new THREE.ShadowMaterial({ opacity:0.28 })
);
shadowCatcher.position.y = 0.001;
shadowCatcher.receiveShadow = true;
scene.add(shadowCatcher);

// Materials
const mat = (color, roughness=0.85, metalness=0) => new THREE.MeshStandardMaterial({ color, roughness, metalness });
const skin   = mat(0xd9a184, 0.75);
const jacket = mat(0x4a6741, 0.9);
const shirt  = mat(0xd8d3c8, 0.9);
const denim  = mat(0x3b5b82, 0.95);
const shoe   = mat(0xf2f0ec, 0.7);
const sole   = mat(0x35322e, 0.9);
const hair   = mat(0x2e241d, 0.95);
const dark   = mat(0x222222, 0.6);

const person = new THREE.Group();
scene.add(person);

function add(geo, m, x=0, y=0, z=0, parent=person){
  const mesh = new THREE.Mesh(geo, m);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

// --- Legs (jeans) ---
for (const s of [-1, 1]){
  const leg = add(new THREE.CylinderGeometry(0.085, 0.06, 0.82, 20), denim, s*0.095, 0.52);
  leg.rotation.z = s * -0.02;
  add(new THREE.SphereGeometry(0.088, 18, 14), denim, s*0.095, 0.92); // hip
  // Sneaker
  const foot = new THREE.Group();
  foot.position.set(s*0.1, 0, 0.02);
  person.add(foot);
  const body = add(new THREE.CapsuleGeometry(0.055, 0.16, 6, 14).rotateX(Math.PI/2), shoe, 0, 0.075, 0.03, foot);
  body.scale.set(1.05, 0.9, 1);
  add(new THREE.BoxGeometry(0.13, 0.045, 0.3), sole, 0, 0.024, 0.03, foot).geometry.translate(0,0,0);
  add(new THREE.BoxGeometry(0.1, 0.02, 0.02), dark, 0, 0.11, 0.1, foot); // lace hint
}
// Pelvis
add(new THREE.CapsuleGeometry(0.115, 0.1, 6, 18).rotateZ(Math.PI/2), denim, 0, 0.93).scale.set(1, 1, 0.8);

// --- Torso (jacket over shirt) ---
const torso = add(new THREE.CapsuleGeometry(0.165, 0.34, 8, 22), jacket, 0, 1.2);
torso.scale.set(1.12, 1, 0.72);
add(new THREE.CylinderGeometry(0.175, 0.185, 0.1, 22), jacket, 0, 1.0).scale.set(1.1, 1, 0.72); // hem
add(new THREE.CylinderGeometry(0.03, 0.09, 0.34, 16), shirt, 0, 1.28, 0.105); // shirt V
add(new THREE.BoxGeometry(0.018, 0.42, 0.02), mat(0x385032, 0.8), 0, 1.2, 0.128); // zipper line
add(new THREE.TorusGeometry(0.085, 0.028, 10, 24).rotateX(Math.PI/2), jacket, 0, 1.47).scale.set(1.15, 1, 0.9); // collar

// --- Arms ---
for (const s of [-1, 1]){
  const arm = new THREE.Group();
  arm.position.set(s*0.225, 1.43, 0);
  arm.rotation.z = s * 0.1;
  person.add(arm);
  add(new THREE.SphereGeometry(0.07, 16, 12), jacket, 0, 0, 0, arm); // shoulder
  add(new THREE.CapsuleGeometry(0.052, 0.24, 6, 14), jacket, 0, -0.16, 0, arm); // upper sleeve
  const fore = new THREE.Group();
  fore.position.set(0, -0.3, 0);
  fore.rotation.x = -0.12;
  arm.add(fore);
  add(new THREE.CapsuleGeometry(0.046, 0.2, 6, 14), jacket, 0, -0.12, 0, fore); // lower sleeve
  add(new THREE.SphereGeometry(0.046, 14, 12), skin, 0, -0.27, 0.005, fore).scale.set(0.85, 1.15, 0.9); // hand
}

// --- Neck & Head ---
add(new THREE.CylinderGeometry(0.045, 0.052, 0.1, 14), skin, 0, 1.52);
const head = add(new THREE.SphereGeometry(0.105, 24, 20), skin, 0, 1.65);
head.scale.set(0.92, 1.05, 0.95);
// Hair
const hairCap = add(new THREE.SphereGeometry(0.108, 24, 20, 0, Math.PI*2, 0, Math.PI*0.55), hair, 0, 1.665, -0.012);
hairCap.scale.set(0.95, 1.08, 0.98);
add(new THREE.SphereGeometry(0.09, 18, 14), hair, 0, 1.63, -0.055).scale.set(1.05, 1, 0.8); // back of hair
// Ears
for (const s of [-1, 1]) add(new THREE.SphereGeometry(0.02, 10, 8), skin, s*0.095, 1.64, 0);
// Eyes
for (const s of [-1, 1]) add(new THREE.SphereGeometry(0.011, 10, 8), dark, s*0.036, 1.66, 0.089);
// Nose + mouth
add(new THREE.SphereGeometry(0.014, 10, 8), skin, 0, 1.635, 0.098);
add(new THREE.BoxGeometry(0.035, 0.006, 0.008), mat(0xa96a55, 0.8), 0, 1.60, 0.09);

// Subtle relaxed asymmetry
person.rotation.y = 0.12;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
