<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amigurumi Octopus</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 36%, #eef7f4 0%, #dbe9e8 48%, #b9cccf 100%);
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(34, 54, 63, 0.62);
      font: 500 12px/1.4 system-ui, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="label">Handmade · Amigurumi Octopus</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdcebea);
    scene.fog = new THREE.Fog(0xdcebea, 15, 27);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 50);
    camera.position.set(7.8, 5.8, 11.5);
    camera.lookAt(0, 1.8, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.65, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.minDistance = 7;
    controls.maxDistance = 19;
    controls.maxPolarAngle = Math.PI * 0.48;

    scene.add(new THREE.HemisphereLight(0xf6ffff, 0x826f8f, 2.25));

    const key = new THREE.DirectionalLight(0xfff4e7, 4.2);
    key.position.set(5, 9, 7);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -7;
    key.shadow.camera.right = 7;
    key.shadow.camera.top = 7;
    key.shadow.camera.bottom = -7;
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 22;
    key.shadow.bias = -0.00025;
    key.shadow.normalBias = 0.025;
    scene.add(key);

    const fill = new THREE.PointLight(0x8ee8df, 18, 16, 2);
    fill.position.set(-5, 4, 3);
    scene.add(fill);

    const rim = new THREE.DirectionalLight(0xb69cff, 2.6);
    rim.position.set(-4, 6, -7);
    scene.add(rim);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.ShadowMaterial({ color: 0x33424e, opacity: 0.22 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0.02;
    floor.receiveShadow = true;
    scene.add(floor);

    const octopus = new THREE.Group();
    octopus.rotation.y = -0.12;
    scene.add(octopus);

    const teal = new THREE.Color(0x20b7aa);
    const turquoise = new THREE.Color(0x54d0ba);
    const violet = new THREE.Color(0x7650b7);
    const plum = new THREE.Color(0x963f8c);
    const tempColor = new THREE.Color();

    function yarnColor(t, wave = 0) {
      const u = THREE.MathUtils.clamp(t + wave, 0, 1);
      if (u < 0.42) return tempColor.copy(teal).lerp(turquoise, u / 0.42);
      if (u < 0.73) return tempColor.copy(turquoise).lerp(violet, (u - 0.42) / 0.31);
      return tempColor.copy(violet).lerp(plum, (u - 0.73) / 0.27);
    }

    const yarnMaterial = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.88,
      metalness: 0,
      side: THREE.FrontSide
    });

    const headGeometry = new THREE.SphereGeometry(1, 80, 60);
    const headPositions = headGeometry.attributes.position;
    const headColors = [];
    const headCenterY = 2.72;
    const headScale = new THREE.Vector3(1.72, 2.0, 1.58);

    for (let i = 0; i < headPositions.count; i++) {
      const nx = headPositions.getX(i);
      const ny = headPositions.getY(i);
      const nz = headPositions.getZ(i);
      const theta = Math.atan2(nz, nx);
      const phi = Math.acos(THREE.MathUtils.clamp(ny, -1, 1));
      const lump =
        1 +
        0.022 * Math.sin(theta * 5 + phi * 3.2) +
        0.014 * Math.sin(theta * 11 - phi * 7) +
        0.008 * Math.cos(theta * 19 + phi * 15);

      const lowerSoftness = 1 + 0.055 * Math.pow(Math.max(0, -ny), 2);
      headPositions.setXYZ(
        i,
        nx * headScale.x * lump * lowerSoftness,
        headCenterY + ny * headScale.y * lump,
        nz * headScale.z * lump * lowerSoftness
      );

      const gradient = 0.5 + 0.5 * ny;
      const stripe = 0.022 * Math.sin(phi * 54 + theta * 0.8);
      const c = yarnColor(1 - gradient, stripe);
      headColors.push(c.r, c.g, c.b);
    }
    headGeometry.setAttribute('color', new THREE.Float32BufferAttribute(headColors, 3));
    headGeometry.computeVertexNormals();

    const head = new THREE.Mesh(headGeometry, yarnMaterial);
    head.castShadow = true;
    head.receiveShadow = true;
    octopus.add(head);

    function headSurface(phi, theta, lift = 1) {
      const s = Math.sin(phi);
      const lumpy = 1 + 0.014 * Math.sin(theta * 5 + phi * 3.2);
      return new THREE.Vector3(
        headScale.x * s * Math.cos(theta) * lumpy * lift,
        headCenterY + headScale.y * Math.cos(phi) * lumpy * lift,
        headScale.z * s * Math.sin(theta) * lumpy * lift
      );
    }

    const spiralPoints = [];
    const spiralTurns = 18.5;
    const spiralSamples = 620;
    for (let i = 0; i <= spiralSamples; i++) {
      const t = i / spiralSamples;
      const phi = 0.11 + t * (Math.PI - 0.43);
      const theta = Math.PI * 0.5 + t * Math.PI * 2 * spiralTurns;
      const p = headSurface(phi, theta, 1.018);
      p.y += 0.012 * Math.sin(t * Math.PI * 74);
      spiralPoints.push(p);
    }
    const spiralCurve = new THREE.CatmullRomCurve3(spiralPoints);
    const spiralGeometry = new THREE.TubeGeometry(spiralCurve, 700, 0.042, 5, false);
    const spiralColors = [];
    const spiralPosition = spiralGeometry.attributes.position;
    for (let i = 0; i < spiralPosition.count; i++) {
      const y = spiralPosition.getY(i);
      const t = THREE.MathUtils.clamp((headCenterY + headScale.y - y) / (headScale.y * 2), 0, 1);
      const c = yarnColor(t, 0.018 * Math.sin(y * 25));
      spiralColors.push(c.r * 1.04, c.g * 1.04, c.b * 1.04);
    }
    spiralGeometry.setAttribute('color', new THREE.Float32BufferAttribute(spiralColors, 3));
    const headSpiral = new THREE.Mesh(spiralGeometry, yarnMaterial);
    headSpiral.castShadow = true;
    octopus.add(headSpiral);

    function makeVariableTube(curve, segments, radialSegments, radiusStart, radiusEnd, colorShift) {
      const points = curve.getSpacedPoints(segments);
      const frames = curve.computeFrenetFrames(segments, false);
      const positions = [];
      const normals = [];
      const colors = [];
      const indices = [];

      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const taper = THREE.MathUtils.smootherstep(1 - t, 0, 1);
        const baseRadius = THREE.MathUtils.lerp(radiusStart, radiusEnd, Math.pow(t, 0.72));
        const stitchRib = 1 + 0.075 * Math.sin(t * Math.PI * 56) + 0.025 * Math.sin(t * Math.PI * 113);
        const radius = Math.max(0.035, baseRadius * taper * stitchRib);
        const center = points[i];
        const normal = frames.normals[i];
        const binormal = frames.binormals[i];

        for (let j = 0; j < radialSegments; j++) {
          const a = j / radialSegments * Math.PI * 2;
          const ca = Math.cos(a);
          const sa = Math.sin(a);
          const nx = normal.x * ca + binormal.x * sa;
          const ny = normal.y * ca + binormal.y * sa;
          const nz = normal.z * ca + binormal.z * sa;
          const tinyLump = 1 + 0.018 * Math.sin(i * 1.91 + j * 2.7);
          positions.push(
            center.x + nx * radius * tinyLump,
            center.y + ny * radius * tinyLump,
            center.z + nz * radius * tinyLump
          );
          normals.push(nx, ny, nz);
          const c = yarnColor(THREE.MathUtils.clamp(0.22 + t * 0.78 + colorShift, 0, 1), 0.025 * Math.sin(t * 37));
          colors.push(c.r, c.g, c.b);
        }
      }

      for (let i = 0; i < segments; i++) {
        for (let j = 0; j < radialSegments; j++) {
          const a = i * radialSegments + j;
          const b = i * radialSegments + (j + 1) % radialSegments;
          const c = (i + 1) * radialSegments + (j + 1) % radialSegments;
          const d = (i + 1) * radialSegments + j;
          indices.push(a, b, d, b, c, d);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.setIndex(indices);
      geometry.computeBoundingSphere();
      return { geometry, points, frames };
    }

    const tentacleData = [];
    const tentacleOrder = [4, 3, 5, 2, 6, 1, 7, 0];

    for (let orderIndex = 0; orderIndex < tentacleOrder.length; orderIndex++) {
      const k = tentacleOrder[orderIndex];
      const baseAngle = k / 8 * Math.PI * 2 + Math.PI / 8;
      const points = [];
      const sampleCount = 84;
      const curlDirection = k % 2 === 0 ? 1 : -1;
      const lengthVariation = 0.93 + 0.09 * Math.sin(k * 2.31 + 0.4);

      for (let i = 0; i <= sampleCount; i++) {
        const t = i / sampleCount;
        const curl = curlDirection * (0.18 * t + 2.72 * Math.pow(t, 2.65));
        const angle = baseAngle + curl;
        const radius =
          0.52 +
          lengthVariation * (2.55 * t - 0.88 * Math.pow(t, 3.55)) +
          0.07 * Math.sin(t * Math.PI * 3 + k);
        const y =
          0.77 -
          0.23 * t +
          0.085 * Math.sin(t * Math.PI * 3.1 + k * 1.47) +
          0.12 * Math.pow(t, 5);
        points.push(new THREE.Vector3(
          Math.cos(angle) * radius,
          y,
          Math.sin(angle) * radius
        ));
      }

      const curve = new THREE.CatmullRomCurve3(points);
      curve.curveType = 'centripetal';
      const built = makeVariableTube(curve, 150, 10, 0.37, 0.105, (k - 3.5) * 0.014);
      const tentacle = new THREE.Mesh(built.geometry, yarnMaterial);
      tentacle.castShadow = true;
      tentacle.receiveShadow = true;
      octopus.add(tentacle);
      tentacleData.push({ curve, points: built.points, frames: built.frames, index: k });

      const fiberPoints = [];
      const fiberSamples = 230;
      for (let i = 0; i <= fiberSamples; i++) {
        const t = i / fiberSamples;
        const idx = Math.min(149, Math.floor(t * 150));
        const center = curve.getPointAt(t);
        const n = built.frames.normals[idx];
        const b = built.frames.binormals[idx];
        const angle = t * Math.PI * 42 + k * 0.8;
        const radius = THREE.MathUtils.lerp(0.382, 0.115, Math.pow(t, 0.72));
        const offset = radius * 0.98;
        fiberPoints.push(new THREE.Vector3(
          center.x + (n.x * Math.cos(angle) + b.x * Math.sin(angle)) * offset,
          center.y + (n.y * Math.cos(angle) + b.y * Math.sin(angle)) * offset,
          center.z + (n.z * Math.cos(angle) + b.z * Math.sin(angle)) * offset
        ));
      }
      const fiberCurve = new THREE.CatmullRomCurve3(fiberPoints);
      const fiberGeometry = new THREE.TubeGeometry(fiberCurve, 250, 0.018, 4, false);
      const fiberColors = [];
      for (let i = 0; i < fiberGeometry.attributes.position.count; i++) {
        const t = (i / fiberGeometry.attributes.position.count);
        const c = yarnColor(0.25 + t * 0.75 + (k - 4) * 0.012);
        fiberColors.push(Math.min(1, c.r * 1.08), Math.min(1, c.g * 1.08), Math.min(1, c.b * 1.08));
      }
      fiberGeometry.setAttribute('color', new THREE.Float32BufferAttribute(fiberColors, 3));
      const fiber = new THREE.Mesh(fiberGeometry, yarnMaterial);
      fiber.castShadow = true;
      octopus.add(fiber);
    }

    const stitchMaterial = new THREE.MeshStandardMaterial({
      color: 0xb7f0df,
      roughness: 0.93,
      metalness: 0
    });

    for (let row = 0; row < 8; row++) {
      const phi = 0.48 + row * 0.27;
      const count = 8 + row * 2;
      for (let col = 0; col < count; col++) {
        const theta = col / count * Math.PI * 2 + row * 0.23;
        const frontness = Math.sin(theta);
        const surfaceY = headCenterY + headScale.y * Math.cos(phi);
        const facialZone = frontness > 0.62 && surfaceY > 1.72 && surfaceY < 3.45;
        if (facialZone || (row + col) % 3 !== 0) continue;

        const dTheta = 0.052 / Math.max(0.35, Math.sin(phi));
        const p1 = headSurface(phi - 0.045, theta - dTheta, 1.032);
        const p2 = headSurface(phi + 0.052, theta, 1.036);
        const p3 = headSurface(phi - 0.045, theta + dTheta, 1.032);
        const stitchCurve = new THREE.CatmullRomCurve3([p1, p2, p3]);
        const stitchGeometry = new THREE.TubeGeometry(stitchCurve, 8, 0.022, 4, false);
        const stitch = new THREE.Mesh(stitchGeometry, stitchMaterial);
        stitch.castShadow = true;
        octopus.add(stitch);
      }
    }

    const eyeMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x10141b,
      roughness: 0.13,
      metalness: 0.02,
      clearcoat: 1,
      clearcoatRoughness: 0.08
    });
    const eyeRimMaterial = new THREE.MeshStandardMaterial({
      color: 0x292331,
      roughness: 0.48,
      metalness: 0.03
    });

    function createEye(x, y) {
      const group = new THREE.Group();
      group.position.set(x, y, 1.49);

      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(0.365, 0.07, 10, 32),
        eyeRimMaterial
      );
      rim.castShadow = true;
      group.add(rim);

      const eye = new THREE.Mesh(
        new THREE.SphereGeometry(1, 32, 22),
        eyeMaterial
      );
      eye.scale.set(0.34, 0.39, 0.17);
      eye.position.z = 0.055;
      eye.castShadow = true;
      group.add(eye);

      const glint = new THREE.Mesh(
        new THREE.SphereGeometry(0.066, 14, 10),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      glint.scale.set(1, 1.2, 0.45);
      glint.position.set(-0.11, 0.14, 0.22);
      group.add(glint);

      octopus.add(group);
    }

    createEye(-0.63, 2.91);
    createEye(0.63, 2.91);

    const smileCurve = new THREE.QuadraticBezierCurve3(
      new THREE.Vector3(-0.46, 2.31, 1.565),
      new THREE.Vector3(0, 1.91, 1.69),
      new THREE.Vector3(0.46, 2.31, 1.565)
    );
    const smile = new THREE.Mesh(
      new THREE.TubeGeometry(smileCurve, 36, 0.052, 7, false),
      new THREE.MeshStandardMaterial({
        color: 0x3a2138,
        roughness: 0.82,
        metalness: 0
      })
    );
    smile.castShadow = true;
    octopus.add(smile);

    const cheekMaterial = new THREE.MeshStandardMaterial({
      color: 0xe986a1,
      transparent: true,
      opacity: 0.52,
      roughness: 1,
      depthWrite: false
    });

    for (const x of [-1.08, 1.08]) {
      const cheek = new THREE.Mesh(
        new THREE.SphereGeometry(1, 20, 14),
        cheekMaterial
      );
      cheek.position.set(x, 2.34, 1.37);
      cheek.scale.set(0.27, 0.15, 0.035);
      octopus.add(cheek);
    }

    const underside = new THREE.Mesh(
      new THREE.SphereGeometry(1, 48, 28, 0, Math.PI * 2, 0, Math.PI * 0.58),
      new THREE.MeshStandardMaterial({
        color: 0x348fa0,
        roughness: 0.92
      })
    );
    underside.scale.set(1.3, 0.48, 1.28);
    underside.position.y = 0.72;
    underside.rotation.x = Math.PI;
    underside.castShadow = true;
    underside.receiveShadow = true;
    octopus.add(underside);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      octopus.position.y = 0.018 * Math.sin(elapsed * 1.25);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
