<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sarcophagus Lid</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17141f; }
  #info { position: fixed; left: 0; right: 0; bottom: 14px; text-align: center;
    font: 11px/1.6 "Georgia", serif; letter-spacing: .22em; color: #b9a67c;
    text-transform: uppercase; pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="info">Anthropoid Sarcophagus Lid &mdash; Limestone &amp; Gilt &mdash; 188 cm</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17141f);
scene.fog = new THREE.Fog(0x17141f, 500, 1200);

// Units are centimeters. Lid ~188 cm long.
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 3000);
camera.position.set(150, 170, 230);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 30, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 90;
controls.maxDistance = 700;
controls.maxPolarAngle = Math.PI * 0.49;

// ---------- lighting ----------
scene.add(new THREE.HemisphereLight(0x8a90b8, 0x2a2118, 0.55));

const key = new THREE.DirectionalLight(0xfff0d8, 2.2);
key.position.set(180, 260, 140);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -160; key.shadow.camera.right = 160;
key.shadow.camera.top = 160;   key.shadow.camera.bottom = -160;
key.shadow.camera.near = 50;   key.shadow.camera.far = 800;
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
scene.add(key);

const rim = new THREE.DirectionalLight(0x7fa0ff, 0.7);
rim.position.set(-220, 120, -180);
scene.add(rim);

const fill = new THREE.PointLight(0xffd9a0, 900, 600, 2);
fill.position.set(-90, 60, 160);
scene.add(fill);

// ---------- materials ----------
const stone = new THREE.MeshStandardMaterial({ color: 0xcbb391, roughness: 0.82, metalness: 0.02 });
const stoneDark = new THREE.MeshStandardMaterial({ color: 0xa8916e, roughness: 0.88, metalness: 0.02 });
const gilt = new THREE.MeshStandardMaterial({ color: 0xd8a83c, roughness: 0.34, metalness: 0.85 });
const lapis = new THREE.MeshStandardMaterial({ color: 0x27407f, roughness: 0.5, metalness: 0.15 });
const kohl = new THREE.MeshStandardMaterial({ color: 0x1c1710, roughness: 0.55, metalness: 0.05 });

// ---------- lid group ----------
const lid = new THREE.Group();
scene.add(lid);

function addMesh(geo, mat, parent = lid) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}

// --- anthropoid slab profile (mummy silhouette), extruded ---
// Local extrude plane: x = width, y = length (head at +y). Extrude depth = thickness.
const L = 188, HW = 28; // length, half-width at shoulders
const half = [
  [0, -L/2],          // foot centerline
  [16, -L/2],         // foot edge
  [19, -L/2 + 14],    // foot block flare
  [17, -L/2 + 40],    // ankle taper
  [21, -20],          // hips
  [26.5, 22],         // waist -> chest
  [HW, 48],           // shoulders
  [26, 62],           // shoulder round-off
  [17, 74],           // neck into headdress
  [19, 86],           // headdress flare
  [13, L/2 - 4],      // crown side
  [0, L/2]            // crown centerline
];
const shape = new THREE.Shape();
shape.moveTo(half[0][0], half[0][1]);
for (let i = 1; i < half.length; i++) shape.lineTo(half[i][0], half[i][1]);
for (let i = half.length - 2; i > 0; i--) shape.lineTo(-half[i][0], half[i][1]);
shape.closePath();

const slabGeo = new THREE.ExtrudeGeometry(shape, { depth: 16, bevelEnabled: true, bevelThickness: 3.5, bevelSize: 3, bevelSegments: 4, curveSegments: 24 });
// Lay flat: extrude z -> world up
slabGeo.rotateX(-Math.PI / 2);
slabGeo.translate(0, 0, 0);
const slab = addMesh(slabGeo, stone);
slab.position.y = 6; // sits on a plinth

const TOP = 6 + 16 + 3.5; // world y of slab top surface (~25.5)

// --- plinth ---
const plinth = addMesh(new THREE.BoxGeometry(78, 12, 210), stoneDark);
plinth.position.y = 6;
plinth.geometry.translate(0, -6, 0);

// --- domed body mass on top of slab (subtle mummiform swell) ---
const swell = addMesh(new THREE.CylinderGeometry(1, 1, 1, 32, 1, false), stone);
swell.geometry = new THREE.SphereGeometry(1, 32, 24, 0, Math.PI * 2, 0, Math.PI / 2);
swell.scale.set(22, 9, 74);
swell.position.set(0, TOP - 1, -18);

// --- headdress (nemes): trapezoid mass + lappets ---
const HEAD_Z = -(L/2 - 26); // head is at +y in shape => -z? keep head toward +z
// NOTE: extrude y-axis became -z after rotateX(-PI/2); head (+y) now at -z. Place face there.
const headC = HEAD_Z; // ~ -68

const nemesGeo = new THREE.CylinderGeometry(15, 20, 34, 4, 1);
nemesGeo.rotateY(Math.PI / 4);
const nemes = addMesh(nemesGeo, gilt);
nemes.scale.set(1.35, 1, 1.05);
nemes.rotation.x = -0.12;
nemes.position.set(0, TOP + 8, headC + 2);

// gold stripe bands on nemes
for (let i = 0; i < 5; i++) {
  const band = addMesh(new THREE.TorusGeometry(17.5 - i * 1.6, 0.9, 8, 40), lapis);
  band.rotation.x = Math.PI / 2 - 0.12;
  band.position.set(0, TOP + 1 + i * 6.4, headC + 2 - i * 0.8);
  band.scale.set(1.32, 1.05, 1);
}

// lappets (side flaps onto chest)
[-1, 1].forEach(s => {
  const lap = addMesh(new THREE.BoxGeometry(9, 5.5, 34), gilt);
  lap.position.set(s * 15.5, TOP + 1.5, headC + 30);
  lap.rotation.y = s * -0.10;
  lap.rotation.x = 0.04;
  const tip = addMesh(new THREE.BoxGeometry(9, 5.5, 8), lapis);
  tip.position.set(s * 17.2, TOP + 1.6, headC + 49);
  tip.rotation.y = s * -0.10;
});

// --- face ---
const face = new THREE.Group();
face.position.set(0, TOP + 10, headC + 12);
lid.add(face);

const visage = addMesh(new THREE.SphereGeometry(9.5, 32, 24), gilt, face);
visage.scale.set(0.95, 1.25, 0.72);
visage.position.set(0, 0, 1.5);

// brow / nose ridge
const nose = addMesh(new THREE.BoxGeometry(2.4, 7.5, 3.4), gilt, face);
nose.position.set(0, -2, 7.6);
nose.rotation.x = 0.28;

// eyes: almond kohl outlines + inset
[-1, 1].forEach(s => {
  const eye = addMesh(new THREE.SphereGeometry(2.1, 16, 12), kohl, face);
  eye.scale.set(1.5, 0.55, 0.5);
  eye.position.set(s * 4.1, 2.2, 7.4);
  const liner = addMesh(new THREE.BoxGeometry(3.4, 0.7, 0.8), kohl, face);
  liner.position.set(s * 7.4, 2.6, 6.6);
  liner.rotation.z = s * 0.25;
  liner.rotation.y = s * -0.5;
  const brow = addMesh(new THREE.BoxGeometry(5.6, 0.85, 0.8), lapis, face);
  brow.position.set(s * 4.3, 4.6, 7.1);
  brow.rotation.z = s * 0.18;
  brow.rotation.y = s * -0.28;
});

// lips
const lips = addMesh(new THREE.BoxGeometry(4.6, 1.5, 1.6), stoneDark, face);
lips.position.set(0, -6.6, 6.9);
lips.rotation.x = 0.3;

// false beard (braided, slight forward curve)
const beard = addMesh(new THREE.CylinderGeometry(1.7, 2.3, 12, 10), lapis, face);
beard.position.set(0, -13.5, 6.2);
beard.rotation.x = -0.22;
for (let i = 0; i < 4; i++) {
  const ring = addMesh(new THREE.TorusGeometry(2.0, 0.45, 6, 16), gilt, face);
  ring.rotation.x = Math.PI / 2 - 0.22;
  ring.position.set(0, -9.5 - i * 2.8, 6.9 - i * 0.55);
}

// --- broad collar (wesekh) on chest ---
const collarZ = headC + 52;
for (let i = 0; i < 4; i++) {
  const r = 14 + i * 3.6;
  const c = addMesh(new THREE.TorusGeometry(r, 1.5, 8, 48, Math.PI), i % 2 ? lapis : gilt);
  c.rotation.x = -Math.PI / 2;
  c.rotation.z = Math.PI;
  c.position.set(0, TOP + 2.2 - i * 0.15, collarZ);
  c.scale.set(1, 0.75, 1);
}

// --- folded arms crossed over chest, with gilt fists ---
[-1, 1].forEach(s => {
  const arm = addMesh(new THREE.CapsuleGeometry(4.2, 26, 6, 14), stone);
  arm.position.set(s * 4, TOP + 4.5, collarZ + 22);
  arm.rotation.z = Math.PI / 2;
  arm.rotation.y = s * 0.62;
  const fist = addMesh(new THREE.SphereGeometry(4.6, 18, 14), gilt);
  fist.scale.set(1, 0.85, 1.15);
  fist.position.set(s * -12.5, TOP + 5.4, collarZ + 14.5);
  // crook & flail hint: short gilt rods rising from fists
  const rod = addMesh(new THREE.CylinderGeometry(0.9, 0.9, 14, 8), s < 0 ? gilt : lapis);
  rod.position.set(s * -12.5, TOP + 9, collarZ + 10);
  rod.rotation.x = -0.55;
  rod.rotation.z = s * 0.25;
});

// --- carved banded planes down the body (raised transverse text bands) ---
const bandsStartZ = collarZ + 40;
const bandData = [
  { z: bandsStartZ,       w: 44, mat: gilt  },
  { z: bandsStartZ + 13,  w: 43, mat: lapis },
  { z: bandsStartZ + 26,  w: 41, mat: gilt  },
  { z: bandsStartZ + 39,  w: 38, mat: lapis },
  { z: bandsStartZ + 52,  w: 35, mat: gilt  }
];
bandData.forEach(b => {
  const band = addMesh(new THREE.BoxGeometry(b.w, 2.2, 7), b.mat);
  band.position.set(0, TOP + 0.4, b.z);
  // incised "glyph" tick marks on each band
  const n = Math.floor(b.w / 6);
  for (let i = 0; i < n; i++) {
    const g = addMesh(new THREE.BoxGeometry(1.1, 0.9, 4.2), kohl);
    g.position.set(-b.w / 2 + 3.5 + i * 6, TOP + 1.7, b.z + (i % 2 ? 0.6 : -0.6));
  }
});

// central longitudinal band from bands down to the feet
const spine = addMesh(new THREE.BoxGeometry(9, 2, 46), gilt);
spine.position.set(0, TOP + 0.3, bandsStartZ + 32);
for (let i = 0; i < 6; i++) {
  const g = addMesh(new THREE.BoxGeometry(4.4, 0.9, 2.2), kohl);
  g.position.set(0, TOP + 1.5, bandsStartZ + 13 + i * 6.8);
}

// --- foot block ---
const feet = addMesh(new THREE.BoxGeometry(30, 13, 16), stone);
feet.position.set(0, TOP + 3, L/2 - 9);
feet.rotation.x = -0.14;
const feetCap = addMesh(new THREE.BoxGeometry(31, 3, 6), gilt);
feetCap.position.set(0, TOP + 9.5, L/2 - 12);
feetCap.rotation.x = -0.14;

// ---------- ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(600, 64),
  new THREE.MeshStandardMaterial({ color: 0x241f2b, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// soft contact-shadow disc under plinth
const contact = new THREE.Mesh(
  new THREE.CircleGeometry(120, 48),
  new THREE.MeshBasicMaterial({
    color: 0x000000, transparent: true, opacity: 0.35, depthWrite: false,
    map: (() => {
      const c = document.createElement('canvas'); c.width = c.height = 256;
      const g = c.getContext('2d');
      const rg = g.createRadialGradient(128, 128, 10, 128, 128, 128);
      rg.addColorStop(0, 'rgba(255,255,255,1)');
      rg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = rg; g.fillRect(0, 0, 256, 256);
      const t = new THREE.CanvasTexture(c); return t;
    })(),
    alphaMap: null
  })
);
contact.material.color.set(0x000000);
contact.rotation.x = -Math.PI / 2;
contact.position.y = 0.15;
contact.scale.set(0.55, 1.1, 1);
scene.add(contact);

// ---------- resize / loop ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
