<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glazed Ceramic Vase</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17191c; }
  #app { position: fixed; inset: 0; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: rgba(230,235,240,0.45); letter-spacing: .02em; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hint">drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------------------
   Renderer
--------------------------------------------------------------------------- */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

/* ---------------------------------------------------------------------------
   Scene & camera
--------------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x191b1f);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.02, 50);
camera.position.set(0.52, 0.30, 0.62);

// Procedural studio environment for glossy reflections (no external assets).
const pmrem = new THREE.PMREMGenerator(renderer);
const envRT = pmrem.fromScene(new RoomEnvironment(), 0.04);
scene.environment = envRT.texture;
pmrem.dispose();

/* ---------------------------------------------------------------------------
   Lighting: hemisphere fill + directional key + fill + rim
--------------------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0xbcd2e0, 0x2b2620, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e6, 2.4);
key.position.set(0.65, 0.95, 0.55);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.05;
key.shadow.camera.far = 3.0;
key.shadow.camera.left = -0.4;
key.shadow.camera.right = 0.4;
key.shadow.camera.top = 0.5;
key.shadow.camera.bottom = -0.1;
key.shadow.bias = -0.00025;
key.shadow.normalBias = 0.012;
key.shadow.radius = 4;
key.target.position.set(0, 0.15, 0);
scene.add(key);
scene.add(key.target);

const fill = new THREE.DirectionalLight(0xbfd0e6, 0.55);
fill.position.set(-0.7, 0.45, 0.35);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xe8f0ff, 1.6);
rim.position.set(-0.35, 0.55, -0.75);
scene.add(rim);

/* ---------------------------------------------------------------------------
   Ground plane (shadow-only)
--------------------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 6),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------------
   Vase geometry — hand-thrown profile via spline + lathe, then deformed
   for asymmetry, throwing rings, and a few chipped rim edges.
--------------------------------------------------------------------------- */

// Profile control points (radius, height). The curve runs up the outside,
// over the lip, and back down the inside to give the rim real thickness.
const profilePts = [
  [0.000, 0.000],
  [0.048, 0.000],
  [0.052, 0.010],
  [0.045, 0.020],
  [0.058, 0.035],
  [0.078, 0.060],
  [0.098, 0.090],
  [0.112, 0.120],
  [0.117, 0.150],   // widest belly
  [0.114, 0.180],
  [0.104, 0.205],
  [0.088, 0.226],
  [0.070, 0.243],
  [0.055, 0.257],
  [0.046, 0.270],
  [0.041, 0.281],   // slender neck
  [0.041, 0.291],
  [0.048, 0.301],   // flare begins
  [0.056, 0.309],   // outer lip
  [0.052, 0.312],   // rim crown (top)
  [0.043, 0.310],   // inner lip
  [0.038, 0.302],
  [0.036, 0.290],
  [0.038, 0.270],
  [0.043, 0.240],
  [0.048, 0.200],
  [0.050, 0.150],
  [0.048, 0.100],
  [0.040, 0.060],
  [0.000, 0.050]    // inner base center
].map(p => new THREE.Vector2(p[0], p[1]));

const spline = new THREE.SplineCurve(profilePts);
const sampled = spline.getPoints(280).map(p => new THREE.Vector2(Math.max(p.x, 0.0), p.y));

let maxY = 0;
for (const p of sampled) maxY = Math.max(maxY, p.y);

const RADIAL_SEG = 240;
const geometry = new THREE.LatheGeometry(sampled, RADIAL_SEG);

// Glaze palette (celadon / teal reactive glaze) + exposed stoneware for chips.
const glazeDark  = new THREE.Color(0x0c4a46);
const glazeLight = new THREE.Color(0x2f9184);
const glazeBreak = new THREE.Color(0x7ec3b7);   // thin-glaze highlight at edges
const clay       = new THREE.Color(0xcdbb98);   // bisque revealed by chips

// Rim chips: {angle, half-width, depth, inward}
const chips = [
  { a:  0.85, w: 0.15, depth: 0.015, inward: 0.010 },
  { a:  2.70, w: 0.10, depth: 0.009, inward: 0.006 },
  { a: -1.85, w: 0.13, depth: 0.012, inward: 0.008 },
  { a: -2.95, w: 0.07, depth: 0.006, inward: 0.004 }
];

function angDiff(a, b) {
  return Math.atan2(Math.sin(a - b), Math.cos(a - b));
}
function smooth01(t) { t = Math.min(Math.max(t, 0), 1); return t * t * (3 - 2 * t); }

const pos = geometry.attributes.position;
const count = pos.count;
const colors = new Float32Array(count * 3);
const tmp = new THREE.Color();
const rimBand = 0.022;

for (let i = 0; i < count; i++) {
  let x = pos.getX(i);
  let y = pos.getY(i);
  let z = pos.getZ(i);

  const r0 = Math.sqrt(x * x + z * z);
  const theta = Math.atan2(z, x);
  const y0 = y;

  // --- Chips at the rim ---
  let chipFall = 0;
  if (y0 > maxY - 0.028) {
    const topness = smooth01((y0 - (maxY - rimBand)) / rimBand);
    for (const c of chips) {
      const d = angDiff(theta, c.a);
      if (Math.abs(d) < c.w) {
        const f = 0.5 + 0.5 * Math.cos(Math.PI * d / c.w);
        const amt = f * topness;
        if (amt > chipFall) chipFall = amt;
      }
    }
    if (chipFall > 0) {
      // pick this chip's depth by whichever dominates
      let depth = 0.012, inward = 0.008;
      for (const c of chips) {
        const d = angDiff(theta, c.a);
        if (Math.abs(d) < c.w) { depth = c.depth; inward = c.inward; }
      }
      y -= depth * chipFall + 0.0015 * Math.sin(theta * 40.0) * chipFall;
    }
  }

  // radius after chip inward-bite
  let r = r0;
  if (chipFall > 0) {
    let inward = 0.008;
    for (const c of chips) { if (Math.abs(angDiff(theta, c.a)) < c.w) inward = c.inward; }
    r = Math.max(r0 - inward * chipFall, 0.0);
  }

  // --- Hand-thrown asymmetry (slightly out-of-round cross section) ---
  const radialScale = 1
    + 0.026 * Math.sin(theta + 0.6)
    + 0.015 * Math.sin(2 * theta + 1.7 + y0 * 2.0)
    + 0.008 * Math.sin(3 * theta - 0.4 - y0 * 1.5);

  // --- Throwing rings (fine horizontal ridges) ---
  const rings =
      0.0011 * Math.sin(y0 * 70.0)
    + 0.0006 * Math.sin(y0 * 150.0 + 1.2)
    + 0.0004 * Math.sin(y0 * 250.0);

  const newR = r * radialScale + rings;

  if (r0 > 1e-5) {
    const s = newR / r0;
    x *= s;
    z *= s;
  }

  // --- Subtle lean so the piece isn't perfectly plumb ---
  const t = Math.min(Math.max(y0 / maxY, 0), 1);
  const off = 0.012 * Math.pow(t, 2.2);
  x += off * Math.cos(0.7);
  z += off * Math.sin(0.7);

  pos.setXYZ(i, x, y, z);

  // --- Vertex color: glaze variation, rim break, chip bisque ---
  let f = 0.5 + 0.4 * Math.sin(y0 * 70.0) + 0.14 * Math.sin(theta * 3.0 + y0 * 5.0);
  f = Math.min(Math.max(f, 0), 1);
  tmp.copy(glazeDark).lerp(glazeLight, f);

  const rimT = smooth01((y0 - (maxY - 0.035)) / 0.035);
  if (rimT > 0) tmp.lerp(glazeBreak, rimT * 0.45);

  if (chipFall > 0) {
    tmp.lerp(clay, Math.min(chipFall * 1.5, 1));
    tmp.multiplyScalar(1 - 0.12 * chipFall); // slight shadow inside the bite
  }

  colors[i * 3]     = tmp.r;
  colors[i * 3 + 1] = tmp.g;
  colors[i * 3 + 2] = tmp.b;
}

geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geometry.computeVertexNormals();

const material = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  vertexColors: true,
  metalness: 0.0,
  roughness: 0.13,
  clearcoat: 1.0,
  clearcoatRoughness: 0.06,
  envMapIntensity: 1.25,
  side: THREE.DoubleSide
});

const vase = new THREE.Mesh(geometry, material);
vase.castShadow = true;
vase.receiveShadow = true;
scene.add(vase);

/* ---------------------------------------------------------------------------
   Controls
--------------------------------------------------------------------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 0.32;
controls.maxDistance = 1.6;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 0.155, 0);
controls.update();

/* ---------------------------------------------------------------------------
   Resize & render loop
--------------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
