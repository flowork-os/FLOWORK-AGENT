<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vintage Low-Poly Biplane</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #d8cbb4; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8cbb4);
scene.fog = new THREE.Fog(0xd8cbb4, 14, 30);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(7.2, 4.2, 8.2);
camera.lookAt(0.25, 0.55, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 6;
controls.maxDistance = 16;
controls.target.set(0.2, 0.6, 0);

const red = new THREE.MeshStandardMaterial({
  color: 0x9e2630,
  roughness: 0.78,
  metalness: 0.04,
  flatShading: true
});
const redDark = new THREE.MeshStandardMaterial({
  color: 0x641923,
  roughness: 0.84,
  metalness: 0.02,
  flatShading: true
});
const cream = new THREE.MeshStandardMaterial({
  color: 0xe8d6aa,
  roughness: 0.82,
  metalness: 0.02,
  flatShading: true
});
const creamLight = new THREE.MeshStandardMaterial({
  color: 0xf3e6c2,
  roughness: 0.76,
  metalness: 0.01,
  flatShading: true
});
const darkMetal = new THREE.MeshStandardMaterial({
  color: 0x34363a,
  roughness: 0.7,
  metalness: 0.55,
  flatShading: true
});
const rubber = new THREE.MeshStandardMaterial({
  color: 0x171719,
  roughness: 0.95,
  metalness: 0,
  flatShading: true
});
const brass = new THREE.MeshStandardMaterial({
  color: 0xb27b39,
  roughness: 0.62,
  metalness: 0.42,
  flatShading: true
});

const airplane = new THREE.Group();
airplane.rotation.y = -0.08;
scene.add(airplane);

function addMesh(geometry, material, position, rotation) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(position[0], position[1], position[2]);
  if (rotation) mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  airplane.add(mesh);
  return mesh;
}

function addBox(size, material, position, rotation) {
  return addMesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material, position, rotation);
}

function addCylinder(radiusTop, radiusBottom, height, radialSegments, material, position, rotation) {
  return addMesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, radialSegments, 1, false),
    material,
    position,
    rotation
  );
}

function beamBetween(a, b, thickness, material) {
  const start = new THREE.Vector3(a[0], a[1], a[2]);
  const end = new THREE.Vector3(b[0], b[1], b[2]);
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
  const beam = addBox([thickness, length, thickness], material, [midpoint.x, midpoint.y, midpoint.z]);
  beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  return beam;
}

function wingPrism(y, side, material) {
  const points = [
    [1.02, 0],
    [0.43, side * 3.05],
    [-1.65, side * 3.05],
    [-1.38, 0]
  ];
  const thickness = 0.105;
  const vertices = [];
  for (const point of points) vertices.push(point[0], y + thickness, point[1]);
  for (const point of points) vertices.push(point[0], y - thickness, point[1]);
  const indices = [
    0, 1, 2, 0, 2, 3,
    7, 6, 5, 7, 5, 4,
    0, 4, 5, 0, 5, 1,
    1, 5, 6, 1, 6, 2,
    2, 6, 7, 2, 7, 3,
    3, 7, 4, 3, 4, 0
  ];
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return addMesh(geometry, material, [0, 0, 0]);
}

function tailPrism(y, side, material) {
  const points = [
    [0.02, 0],
    [-0.25, side * 1.35],
    [-1.55, side * 1.35],
    [-1.68, 0]
  ];
  const thickness = 0.075;
  const vertices = [];
  for (const point of points) vertices.push(point[0], y + thickness, point[1]);
  for (const point of points) vertices.push(point[0], y - thickness, point[1]);
  const indices = [
    0, 1, 2, 0, 2, 3,
    7, 6, 5, 7, 5, 4,
    0, 4, 5, 0, 5, 1,
    1, 5, 6, 1, 6, 2,
    2, 6, 7, 2, 7, 3,
    3, 7, 4, 3, 4, 0
  ];
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return addMesh(geometry, material, [0, 0, 0]);
}

wingPrism(1.34, 1, creamLight);
wingPrism(1.34, -1, creamLight);
wingPrism(0.34, 1, cream);
wingPrism(0.34, -1, cream);

addBox([1.36, 0.055, 0.16], red, [-0.32, 1.455, 2.52]);
addBox([1.36, 0.055, 0.16], red, [-0.32, 1.455, -2.52]);
addBox([1.3, 0.05, 0.14], redDark, [-0.47, 0.245, 2.51]);
addBox([1.3, 0.05, 0.14], redDark, [-0.47, 0.245, -2.51]);

const fuselage = addCylinder(0.41, 0.58, 3.65, 10, red, [0.02, 0.63, 0], [0, 0, Math.PI / 2]);
const tailCone = addMesh(new THREE.ConeGeometry(0.43, 1.28, 8), red, [-1.95, 0.63, 0], [0, 0, -Math.PI / 2]);
addBox([0.72, 0.075, 0.12], creamLight, [-0.62, 1.015, 0]);
addBox([0.62, 0.06, 0.12], creamLight, [-1.18, 0.27, 0]);

tailPrism(0.72, 1, creamLight);
tailPrism(0.72, -1, creamLight);
addBox([0.92, 0.75, 0.12], red, [-1.45, 1.02, 0], [0, 0, -0.12]);
addBox([0.88, 0.72, 0.12], red, [-1.46, 1.02, 0], [0, 0, 0.12]);

const finShape = new THREE.Shape();
finShape.moveTo(-1.92, 0);
finShape.lineTo(-1.66, 1.2);
finShape.lineTo(-0.88, 0.18);
finShape.lineTo(-0.9, 0);
finShape.closePath();
const finGeometry = new THREE.ExtrudeGeometry(finShape, { depth: 0.11, bevelEnabled: false });
finGeometry.translate(0, 0, -0.055);
addMesh(finGeometry, red, [0, 0.64, 0]);

const strutPairs = [
  [[0.55, 0.38, 1.12], [0.62, 1.30, 1.25]],
  [[-1.02, 0.38, 1.04], [-0.82, 1.30, 1.18]],
  [[0.55, 0.38, -1.12], [0.62, 1.30, -1.25]],
  [[-1.02, 0.38, -1.04], [-0.82, 1.30, -1.18]]
];
for (const pair of strutPairs) beamBetween(pair[0], pair[1], 0.105, redDark);

beamBetween([0.7, 0.42, 0.98], [-0.1, 1.28, 1.18], 0.075, cream);
beamBetween([0.7, 0.42, -0.98], [-0.1, 1.28, -1.18], 0.075, cream);

const engineDisk = addCylinder(0.78, 0.78, 0.28, 12, darkMetal, [2.02, 0.63, 0], [0, 0, Math.PI / 2]);
engineDisk.castShadow = true;

for (let index = 0; index < 12; index += 1) {
  const angleA = (index / 12) * Math.PI * 2;
  const angleB = ((index + 1) / 12) * Math.PI * 2;
  const backX = 1.87;
  const frontX = 2.43;
  const backRadius = 0.88;
  const frontRadius = 0.7;
  const verts = [
    backX, 0.63 + Math.cos(angleA) * backRadius, Math.sin(angleA) * backRadius,
    backX, 0.63 + Math.cos(angleB) * backRadius, Math.sin(angleB) * backRadius,
    frontX, 0.63 + Math.cos(angleB) * frontRadius, Math.sin(angleB) * frontRadius,
    frontX, 0.63 + Math.cos(angleA) * frontRadius, Math.sin(angleA) * frontRadius
  ];
  const panelGeometry = new THREE.BufferGeometry();
  panelGeometry.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
  panelGeometry.setIndex([0, 1, 2, 0, 2, 3]);
  panelGeometry.computeVertexNormals();
  addMesh(panelGeometry, index % 3 === 0 ? creamLight : red, [0, 0, 0]);
}

addCylinder(0.56, 0.56, 0.16, 12, brass, [2.48, 0.63, 0], [0, 0, Math.PI / 2]);
addCylinder(0.2, 0.2, 0.3, 8, darkMetal, [2.67, 0.63, 0], [0, 0, Math.PI / 2]);

const propHub = addCylinder(0.21, 0.21, 0.28, 8, brass, [2.82, 0.63, 0], [0, 0, Math.PI / 2]);
addBox([0.17, 1.82, 0.16], redDark, [2.91, 0.63, 0]);
addBox([0.18, 0.74, 0.18], creamLight, [2.96, 1.22, 0]);
addBox([0.18, 0.74, 0.18], creamLight, [2.96, 0.04, 0]);
addBox([0.16, 0.22, 0.22], brass, [3.02, 0.63, 0]);

addBox([0.12, 0.15, 0.52], darkMetal, [-0.12, 0.96, 0.32], [0.1, 0, 0]);
addBox([0.12, 0.15, 0.52], darkMetal, [-0.12, 0.96, -0.32], [-0.1, 0, 0]);

beamBetween([-0.98, 0.3, 0.7], [-1.48, -0.32, 0.7], 0.09, darkMetal);
beamBetween([-0.98, 0.3, -0.7], [-1.48, -0.32, -0.7], 0.09, darkMetal);
addCylinder(0.22, 0.22, 0.15, 10, rubber, [-1.48, -0.38, 0.7], [Math.PI / 2, 0, 0]);
addCylinder(0.22, 0.22, 0.15, 10, rubber, [-1.48, -0.38, -0.7], [Math.PI / 2, 0, 0]);

const cockpitFrame = addBox([0.55, 0.34, 0.9], redDark, [-0.5, 1.08, 0]);
const cockpitTop = addBox([0.5, 0.045, 0.72], darkMetal, [-0.5, 1.27, 0]);
cockpitFrame.castShadow = true;
cockpitTop.castShadow = true;

const hemiLight = new THREE.HemisphereLight(0xfff1d5, 0x665b51, 2.2);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(0xffe5bd, 3.6);
keyLight.position.set(5, 9, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 30;
keyLight.shadow.camera.left = -8;
keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -8;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xb7c9df, 1.1);
fillLight.position.set(-5, 3, -7);
scene.add(fillLight);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
