<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brick-Built Emerald Dragon</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10161b; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10191d);
scene.fog = new THREE.Fog(0x10191d, 20, 42);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(12, 8.5, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.62;
controls.minDistance = 9;
controls.maxDistance = 28;

const emerald = new THREE.MeshStandardMaterial({ color: 0x087a42, roughness: 0.22, metalness: 0.04 });
const emeraldDark = new THREE.MeshStandardMaterial({ color: 0x03522e, roughness: 0.25, metalness: 0.04 });
const emeraldLight = new THREE.MeshStandardMaterial({ color: 0x16ad62, roughness: 0.2, metalness: 0.02 });
const orange = new THREE.MeshStandardMaterial({ color: 0xf07813, roughness: 0.2, metalness: 0.02 });
const horn = new THREE.MeshStandardMaterial({ color: 0xe7d8b0, roughness: 0.35 });
const black = new THREE.MeshStandardMaterial({ color: 0x101415, roughness: 0.23, metalness: 0.18 });
const yellowWing = new THREE.MeshPhysicalMaterial({
  color: 0xffcf36,
  roughness: 0.18,
  metalness: 0.02,
  transmission: 0.22,
  transparent: true,
  opacity: 0.7,
  side: THREE.DoubleSide
});
const yellowFrame = new THREE.MeshStandardMaterial({ color: 0xe5a919, roughness: 0.22, metalness: 0.02 });
const groundMat = new THREE.MeshStandardMaterial({ color: 0x18232a, roughness: 0.78 });

const dragon = new THREE.Group();
dragon.position.y = 0.2;
scene.add(dragon);

function mesh(geometry, material, x = 0, y = 0, z = 0) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(x, y, z);
  object.castShadow = true;
  object.receiveShadow = true;
  return object;
}

function brick(width, height, depth, material = emerald, studsX = 0, studsZ = 0) {
  const group = new THREE.Group();
  const body = mesh(new THREE.BoxGeometry(width, height, depth), material);
  group.add(body);
  const studRadius = Math.min(0.23, Math.min(width / Math.max(studsX, 1), depth / Math.max(studsZ, 1)) * 0.29);
  const studHeight = Math.min(0.14, height * 0.33);
  if (studsX > 0 && studsZ > 0) {
    for (let ix = 0; ix < studsX; ix++) {
      for (let iz = 0; iz < studsZ; iz++) {
        const sx = ((ix + 0.5) / studsX - 0.5) * width;
        const sz = ((iz + 0.5) / studsZ - 0.5) * depth;
        const stud = mesh(new THREE.CylinderGeometry(studRadius, studRadius, studHeight, 20), material, sx, height / 2 + studHeight / 2, sz);
        group.add(stud);
      }
    }
  }
  return group;
}

function tube(radius, length, material = emeraldDark) {
  const item = mesh(new THREE.CylinderGeometry(radius, radius, length, 20), material);
  item.rotation.x = Math.PI / 2;
  return item;
}

function wedge(width, height, depth, material) {
  const shape = new THREE.Shape();
  shape.moveTo(-depth / 2, -height / 2);
  shape.lineTo(depth / 2, -height / 2);
  shape.lineTo(depth / 2, height / 2);
  shape.lineTo(-depth / 2, height / 2);
  shape.closePath();
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: width,
    bevelEnabled: false,
    steps: 1
  });
  geometry.rotateY(Math.PI / 2);
  geometry.rotateZ(Math.PI / 2);
  const object = mesh(geometry, material);
  return object;
}

function ballJoint(material = emeraldDark) {
  const joint = new THREE.Group();
  joint.add(mesh(new THREE.SphereGeometry(0.25, 20, 14), material));
  const collar = mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.2, 20), emerald);
  collar.rotation.z = Math.PI / 2;
  joint.add(collar);
  return joint;
}

function addWing(side) {
  const wing = new THREE.Group();
  wing.position.set(side * 1.58, 3.35, 0.5);
  wing.rotation.z = side * 0.18;
  dragon.add(wing);

  const hinge = mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.75, 20), emeraldDark);
  hinge.rotation.x = Math.PI / 2;
  wing.add(hinge);

  const clip = mesh(new THREE.BoxGeometry(0.34, 0.48, 0.38), emerald);
  clip.position.set(side * 0.06, 0, 0);
  wing.add(clip);

  const panel = mesh(new THREE.BoxGeometry(4.7, 0.09, 2.65), yellowWing, side * 2.36, 0.18, -0.1);
  panel.rotation.z = side * -0.08;
  wing.add(panel);

  const topRail = mesh(new THREE.BoxGeometry(4.8, 0.16, 0.18), yellowFrame, side * 2.36, 0.28, -1.38);
  topRail.rotation.z = side * -0.08;
  wing.add(topRail);

  const bottomRail = mesh(new THREE.BoxGeometry(4.8, 0.16, 0.18), yellowFrame, side * 2.36, 0.28, 1.14);
  bottomRail.rotation.z = side * -0.08;
  wing.add(bottomRail);

  for (let i = 0; i < 4; i++) {
    const rib = mesh(new THREE.BoxGeometry(0.13, 0.15, 2.55), yellowFrame, side * (0.78 + i * 1.05), 0.28, -0.1);
    rib.rotation.z = side * -0.08;
    wing.add(rib);
  }

  const claw = mesh(new THREE.ConeGeometry(0.21, 0.72, 16), horn, side * 4.68, 0.12, 0.02);
  claw.rotation.z = side * Math.PI / 2;
  wing.add(claw);
}

const bodyRows = [
  { y: 1.18, w: 3.5, h: 0.62, d: 4.35, sx: 4, sz: 6 },
  { y: 1.8, w: 3.12, h: 0.62, d: 3.72, sx: 4, sz: 5 },
  { y: 2.42, w: 2.72, h: 0.58, d: 3.16, sx: 3, sz: 4 },
  { y: 2.99, w: 2.3, h: 0.52, d: 2.55, sx: 3, sz: 3 }
];

for (const row of bodyRows) {
  const section = brick(row.w, row.h, row.d, emerald, row.sx, row.sz);
  section.position.set(0, row.y, 0.1);
  dragon.add(section);
}

for (let i = 0; i < 4; i++) {
  const spine = brick(0.72, 0.35, 0.68, orange, 1, 1);
  spine.position.set(0, 3.34 + i * 0.06, 1.22 - i * 0.76);
  dragon.add(spine);
}

const tailRoot = new THREE.Group();
tailRoot.position.set(0, 1.65, 2.22);
tailRoot.rotation.x = -0.15;
dragon.add(tailRoot);

const tailParts = [
  [2.52, 0.42, 1.3, 3, 2],
  [2.12, 0.36, 1.05, 3, 1],
  [1.72, 0.3, 0.82, 2, 1],
  [1.32, 0.26, 0.62, 2, 1],
  [0.92, 0.22, 0.4, 1, 1]
];

let tailZ = 0;
for (let i = 0; i < tailParts.length; i++) {
  const part = tailParts[i];
  const segment = brick(part[0], part[1], part[2], i === 2 ? emeraldLight : emerald, part[3], part[4]);
  segment.position.set(0, 0.12 + i * 0.24, tailZ + part[2] * 0.46);
  segment.rotation.x = -0.17 - i * 0.1;
  tailRoot.add(segment);
  tailZ += part[2] * 0.84;
}
const tailTip = mesh(new THREE.ConeGeometry(0.32, 1.15, 4), orange, 0, 1.19, 4.05);
tailTip.rotation.x = Math.PI / 2.7;
tailRoot.add(tailTip);

const neck = new THREE.Group();
neck.position.set(0, 3.12, -0.92);
dragon.add(neck);

const neckSegments = [
  { p: [0, 0.15, -0.12], r: -0.28, scale: 1.0 },
  { p: [0, 0.7, -0.46], r: -0.43, scale: 0.92 },
  { p: [0, 1.28, -0.98], r: -0.32, scale: 0.82 }
];

for (const data of neckSegments) {
  const joint = ballJoint();
  joint.position.set(data.p[0], data.p[1], data.p[2]);
  joint.rotation.x = data.r;
  neck.add(joint);
  const segment = brick(1.56 * data.scale, 0.58 * data.scale, 1.04 * data.scale, emerald, 2, 2);
  segment.position.set(0, data.p[1] + 0.19, data.p[2] - 0.18);
  segment.rotation.x = data.r;
  neck.add(segment);
}

const head = new THREE.Group();
head.position.set(0, 4.52, -2.32);
head.rotation.x = -0.16;
dragon.add(head);

const skull = brick(2.22, 0.86, 1.78, emeraldLight, 3, 2);
skull.position.y = 0.02;
head.add(skull);

const snout = wedge(1.86, 0.72, 1.5, emerald);
snout.position.set(0, -0.14, -1.38);
snout.rotation.y = Math.PI;
head.add(snout);

const jaw = brick(1.92, 0.32, 1.22, emeraldDark, 2, 2);
jaw.position.set(0, -0.54, -1.08);
head.add(jaw);

for (const side of [-1, 1]) {
  const eyeBase = mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.14, 20), orange, side * 0.86, 0.34, -0.42);
  eyeBase.rotation.z = Math.PI / 2;
  head.add(eyeBase);

  const eye = mesh(new THREE.SphereGeometry(0.15, 18, 12), black, side * 0.98, 0.36, -0.42);
  head.add(eye);

  const nostril = mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.13, 20), black, side * 0.48, 0.03, -1.95);
  nostril.rotation.x = Math.PI / 2;
  head.add(nostril);

  const hornItem = mesh(new THREE.ConeGeometry(0.17, 0.72, 16), horn, side * 0.78, 0.78, -0.34);
  hornItem.rotation.z = side * 0.28;
  head.add(hornItem);
}

for (const side of [-1, 1]) {
  const leg = new THREE.Group();
  leg.position.set(side * 1.58, 1.3, -0.45);
  dragon.add(leg);

  const upper = brick(0.68, 1.0, 0.76, emerald, 1, 1);
  upper.position.set(0, -0.05, 0);
  upper.rotation.z = side * -0.18;
  leg.add(upper);

  const joint = ballJoint(emeraldDark);
  joint.position.set(side * 0.1, -0.68, -0.03);
  leg.add(joint);

  const foot = brick(0.82, 0.34, 1.28, emeraldDark, 1, 2);
  foot.position.set(side * 0.13, -1.05, -0.24);
  leg.add(foot);

  for (let toe = -1; toe <= 1; toe++) {
    const claw = mesh(new THREE.ConeGeometry(0.105, 0.38, 12), horn, side * 0.13 + toe * 0.23, -1.08, -0.93);
    claw.rotation.x = -Math.PI / 2;
    leg.add(claw);
  }
}

for (const side of [-1, 1]) {
  const arm = new THREE.Group();
  arm.position.set(side * 1.55, 2.65, -0.75);
  arm.rotation.z = side * -0.32;
  dragon.add(arm);

  const upper = brick(0.54, 0.76, 0.62, emeraldLight, 1, 1);
  upper.position.y = -0.3;
  arm.add(upper);

  const fore = brick(0.5, 0.48, 0.7, emerald, 1, 1);
  fore.position.set(side * 0.18, -0.83, -0.2);
  fore.rotation.z = side * 0.24;
  arm.add(fore);

  for (let finger = -1; finger <= 1; finger++) {
    const claw = mesh(new THREE.ConeGeometry(0.08, 0.28, 12), horn, side * 0.18 + finger * 0.15, -1.04, -0.55);
    claw.rotation.x = -Math.PI / 2;
    arm.add(claw);
  }
}

for (const side of [-1, 1]) addWing(side);

for (let z = -1.32; z <= 1.18; z += 0.58) {
  for (const side of [-1, 1]) {
    const undersideTube = tube(0.2, 0.44, emeraldDark);
    undersideTube.position.set(side * 0.9, 0.86, z);
    dragon.add(undersideTube);
  }
}

const platform = mesh(new THREE.CylinderGeometry(6.8, 7.25, 0.48, 96), new THREE.MeshStandardMaterial({
  color: 0x26363d,
  roughness: 0.5,
  metalness: 0.08
}), 0, -0.25, 0);
platform.receiveShadow = true;

const floor = mesh(new THREE.PlaneGeometry(80, 80), groundMat, 0, -0.51, 0);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const hemi = new THREE.HemisphereLight(0xb9e8ff, 0x29332a, 2.1);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3d5, 4.2);
key.position.set(7, 11, 9);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -11;
key.shadow.camera.right = 11;
key.shadow.camera.top = 11;
key.shadow.camera.bottom = -11;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 30;
key.shadow.bias = -0.0002;
scene.add(key);

const rim = new THREE.DirectionalLight(0x69b8ff, 2.3);
rim.position.set(-9, 6, -8);
scene.add(rim);

const warm = new THREE.PointLight(0xff9b38, 18, 18, 2);
warm.position.set(0, 5, 4);
scene.add(warm);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  dragon.position.y = 0.2 + Math.sin(time * 1.2) * 0.045;
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
