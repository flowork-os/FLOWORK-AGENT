<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kawaii Boba Tea</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f9dfea;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf9dfea);
scene.fog = new THREE.Fog(0xf9dfea, 9, 18);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.25, 8.6);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 6;
controls.maxDistance = 12;
controls.target.set(0, 0.35, 0);

scene.add(new THREE.HemisphereLight(0xfff3fa, 0xc397ad, 2.1));

const keyLight = new THREE.DirectionalLight(0xffffff, 3.2);
keyLight.position.set(-4, 7, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -5;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xffb9d2, 1.5, 12);
fillLight.position.set(4, 2, 5);
scene.add(fillLight);

const root = new THREE.Group();
root.position.y = -0.2;
scene.add(root);

function gradientColors(geometry, bottomColor, topColor, minY, maxY) {
  const positions = geometry.attributes.position;
  const colors = [];
  const low = new THREE.Color(bottomColor);
  const high = new THREE.Color(topColor);
  for (let i = 0; i < positions.count; i++) {
    const amount = THREE.MathUtils.clamp((positions.getY(i) - minY) / (maxY - minY), 0, 1);
    const color = low.clone().lerp(high, amount);
    colors.push(color.r, color.g, color.b);
  }
  geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
}

const cupProfile = [
  new THREE.Vector2(1.18, -1.65),
  new THREE.Vector2(1.38, -1.58),
  new THREE.Vector2(1.52, -1.38),
  new THREE.Vector2(1.61, -0.85),
  new THREE.Vector2(1.67, 0.05),
  new THREE.Vector2(1.72, 0.92),
  new THREE.Vector2(1.68, 1.38)
];

const cupGeometry = new THREE.LatheGeometry(cupProfile, 96);
cupGeometry.computeVertexNormals();
const cupMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xfff8fc,
  transparent: true,
  opacity: 0.34,
  roughness: 0.12,
  metalness: 0,
  transmission: 0.18,
  thickness: 0.12,
  clearcoat: 0.7,
  side: THREE.DoubleSide,
  depthWrite: false
});
const cup = new THREE.Mesh(cupGeometry, cupMaterial);
cup.renderOrder = 4;
cup.castShadow = true;
cup.receiveShadow = true;
root.add(cup);

const teaProfile = [
  new THREE.Vector2(1.10, -1.48),
  new THREE.Vector2(1.31, -1.38),
  new THREE.Vector2(1.43, -1.12),
  new THREE.Vector2(1.51, -0.55),
  new THREE.Vector2(1.56, 0.35),
  new THREE.Vector2(1.57, 1.14),
  new THREE.Vector2(0, 1.14)
];

const teaGeometry = new THREE.LatheGeometry(teaProfile, 96);
teaGeometry.computeVertexNormals();
gradientColors(teaGeometry, 0xd99579, 0xf5c5a7, -1.48, 1.14);

const teaMaterial = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.46,
  metalness: 0,
  transparent: true,
  opacity: 0.91
});
const tea = new THREE.Mesh(teaGeometry, teaMaterial);
tea.castShadow = true;
tea.receiveShadow = true;
root.add(tea);

const teaTop = new THREE.Mesh(
  new THREE.CircleGeometry(1.53, 96),
  new THREE.MeshStandardMaterial({
    color: 0xf3b997,
    roughness: 0.35,
    transparent: true,
    opacity: 0.82
  })
);
teaTop.rotation.x = -Math.PI / 2;
teaTop.position.y = 1.135;
root.add(teaTop);

const pearlMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x4a2946,
  roughness: 0.22,
  metalness: 0.05,
  clearcoat: 0.85,
  clearcoatRoughness: 0.18
});

const pearlPositions = [
  [-0.88, -1.18, 0.98, 0.27],
  [-0.43, -1.34, 1.18, 0.31],
  [0.04, -1.23, 1.28, 0.30],
  [0.50, -1.34, 1.17, 0.30],
  [0.92, -1.16, 0.95, 0.27],
  [-0.65, -0.91, 1.31, 0.29],
  [-0.18, -1.00, 1.39, 0.31],
  [0.34, -0.94, 1.37, 0.30],
  [0.72, -0.86, 1.23, 0.27]
];

function addPearl(x, y, z, size) {
  const pearl = new THREE.Mesh(new THREE.SphereGeometry(size, 32, 24), pearlMaterial);
  pearl.position.set(x, y, z);
  pearl.scale.y = 0.92;
  pearl.castShadow = true;
  root.add(pearl);

  const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0x211529 });
  const eyeWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });

  for (const eyeX of [-0.105, 0.105]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(size * 0.13, 16, 12), eyeMaterial);
    eye.position.set(x + eyeX * size / 0.3, y + size * 0.08, z + size * 0.92);
    eye.scale.set(0.78, 1.15, 0.28);
    root.add(eye);

    const sparkle = new THREE.Mesh(new THREE.SphereGeometry(size * 0.055, 12, 8), eyeWhite);
    sparkle.position.set(eye.position.x - size * 0.035, eye.position.y + size * 0.055, eye.position.z + size * 0.07);
    root.add(sparkle);
  }
}

for (const p of pearlPositions) addPearl(p[0], p[1], p[2], p[3]);

const lidDomeGeometry = new THREE.SphereGeometry(1.72, 96, 48, 0, Math.PI * 2, 0, Math.PI / 2);
lidDomeGeometry.scale(1, 0.55, 1);
const lidMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xfff4fa,
  transparent: true,
  opacity: 0.52,
  roughness: 0.1,
  transmission: 0.25,
  thickness: 0.08,
  clearcoat: 0.9,
  side: THREE.DoubleSide,
  depthWrite: false
});
const dome = new THREE.Mesh(lidDomeGeometry, lidMaterial);
dome.position.y = 1.37;
dome.renderOrder = 5;
dome.castShadow = true;
root.add(dome);

const rim = new THREE.Mesh(
  new THREE.TorusGeometry(1.66, 0.105, 20, 96),
  new THREE.MeshPhysicalMaterial({
    color: 0xffd7e9,
    roughness: 0.2,
    clearcoat: 0.7
  })
);
rim.rotation.x = Math.PI / 2;
rim.position.y = 1.37;
rim.castShadow = true;
root.add(rim);

const strawGroup = new THREE.Group();
strawGroup.position.set(0.38, 1.48, 0);
strawGroup.rotation.z = -0.13;
root.add(strawGroup);

const strawColors = [0xff91b9, 0xffd3e4];
for (let i = 0; i < 7; i++) {
  const segment = new THREE.Mesh(
    new THREE.CylinderGeometry(0.145, 0.145, 0.38, 32),
    new THREE.MeshPhysicalMaterial({
      color: strawColors[i % 2],
      roughness: 0.23,
      clearcoat: 0.65
    })
  );
  segment.position.y = 0.19 + i * 0.34;
  segment.castShadow = true;
  strawGroup.add(segment);
}

const strawTop = new THREE.Mesh(
  new THREE.TorusGeometry(0.145, 0.012, 10, 32),
  new THREE.MeshBasicMaterial({ color: 0xfff1f8 })
);
strawTop.rotation.x = Math.PI / 2;
strawTop.position.y = 2.58;
strawGroup.add(strawTop);

const faceBlack = new THREE.MeshStandardMaterial({
  color: 0x35243b,
  roughness: 0.3
});

function addEye(x) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 24), faceBlack);
  eye.position.set(x, 0.45, 1.63);
  eye.scale.set(0.78, 1.18, 0.38);
  root.add(eye);

  const shine = new THREE.Mesh(
    new THREE.SphereGeometry(0.052, 16, 12),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  shine.position.set(x - 0.055, 0.535, 1.715);
  root.add(shine);
}

addEye(-0.52);
addEye(0.52);

const blushMaterial = new THREE.MeshStandardMaterial({
  color: 0xff9db8,
  roughness: 0.42,
  transparent: true,
  opacity: 0.82
});

for (const x of [-0.91, 0.91]) {
  const blush = new THREE.Mesh(new THREE.SphereGeometry(0.22, 32, 20), blushMaterial);
  blush.position.set(x, 0.08, 1.58);
  blush.scale.set(1.35, 0.48, 0.18);
  root.add(blush);
}

const smileCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.40, 0.08, 1.66),
  new THREE.Vector3(-0.22, -0.13, 1.70),
  new THREE.Vector3(0, -0.19, 1.72),
  new THREE.Vector3(0.22, -0.13, 1.70),
  new THREE.Vector3(0.40, 0.08, 1.66)
]);
const smile = new THREE.Mesh(
  new THREE.TubeGeometry(smileCurve, 32, 0.065, 16, false),
  faceBlack
);
root.add(smile);

const tongue = new THREE.Mesh(
  new THREE.SphereGeometry(0.13, 24, 16),
  new THREE.MeshStandardMaterial({ color: 0xff8fae, roughness: 0.35 })
);
tongue.position.set(0, -0.12, 1.75);
tongue.scale.set(1.15, 0.48, 0.32);
root.add(tongue);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(5.5, 96),
  new THREE.MeshStandardMaterial({
    color: 0xf4cddd,
    roughness: 0.88,
    metalness: 0
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.72;
ground.position.z = 0;
ground.receiveShadow = true;
scene.add(ground);

const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(2.0, 64),
  new THREE.MeshBasicMaterial({
    color: 0xd593b0,
    transparent: true,
    opacity: 0.22,
    depthWrite: false
  })
);
shadow.rotation.x = -Math.PI / 2;
shadow.scale.set(1.25, 0.48, 1);
shadow.position.set(0, -1.705, 0);
scene.add(shadow);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
