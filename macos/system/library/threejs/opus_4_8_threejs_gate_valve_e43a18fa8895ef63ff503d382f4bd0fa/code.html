<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Industrial Gate Valve</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16181b; }
  #app { position: fixed; inset: 0; }
  #label {
    position: fixed; left: 16px; bottom: 14px;
    font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace;
    color: #9aa0a6; letter-spacing: .08em; text-transform: uppercase;
    user-select: none; pointer-events: none; opacity: .7;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="label">Industrial Gate Valve — cast steel · drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ----------------------------------------------------------------------------
// Renderer
// ----------------------------------------------------------------------------
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

// ----------------------------------------------------------------------------
// Scene + neutral dark studio environment
// ----------------------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x191b1e);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

// ----------------------------------------------------------------------------
// Camera
// ----------------------------------------------------------------------------
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(6.2, 3.4, 7.2);

// ----------------------------------------------------------------------------
// Lighting: hemisphere fill + directional key/rim
// ----------------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0xbfd3e6, 0x2a2622, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e6, 2.6);
key.position.set(6, 9, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 40;
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -8;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fb6cc, 0.7);
fill.position.set(-7, 3, 4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xdfe8ff, 1.1);
rim.position.set(-4, 5, -8);
scene.add(rim);

// ----------------------------------------------------------------------------
// Materials
// ----------------------------------------------------------------------------
const castMat = new THREE.MeshStandardMaterial({ color: 0x5a5f66, metalness: 0.9, roughness: 0.52 });
const castDarkMat = new THREE.MeshStandardMaterial({ color: 0x393c42, metalness: 0.85, roughness: 0.55 });
const steelMat = new THREE.MeshStandardMaterial({ color: 0xc4c9cf, metalness: 0.96, roughness: 0.24 });
const boltMat = new THREE.MeshStandardMaterial({ color: 0x9fa4aa, metalness: 0.95, roughness: 0.3 });
const boreMat = new THREE.MeshStandardMaterial({ color: 0x14161a, metalness: 0.4, roughness: 0.85 });
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x8a1f16, metalness: 0.6, roughness: 0.45 });

// ----------------------------------------------------------------------------
// Helpers
// ----------------------------------------------------------------------------
const valve = new THREE.Group();

function mesh(geo, mat) {
  const m = new THREE.Mesh(geo, mat);
  return m;
}

// Ring of hex nuts / bolts around an axis
function addBoltCircle(parent, { count, radius, headR, headH, axis, offset }) {
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2;
    const nut = mesh(new THREE.CylinderGeometry(headR, headR, headH, 6), boltMat);
    if (axis === 'x') {
      nut.rotation.z = Math.PI / 2;
      nut.position.set(offset, radius * Math.cos(a), radius * Math.sin(a));
    } else { // 'y'
      nut.position.set(radius * Math.cos(a), offset, radius * Math.sin(a));
    }
    parent.add(nut);
  }
}

// ----------------------------------------------------------------------------
// Body (lathed cast profile, pipe axis = X)
// ----------------------------------------------------------------------------
const bodyProfile = [
  [0.60, -2.00], [0.60, -1.55], [0.68, -1.20], [0.86, -0.80],
  [1.06, -0.40], [1.16, 0.00], [1.06, 0.40], [0.86, 0.80],
  [0.68, 1.20], [0.60, 1.55], [0.60, 2.00]
].map(p => new THREE.Vector2(p[0], p[1]));

const bodyGeo = new THREE.LatheGeometry(bodyProfile, 48);
bodyGeo.rotateZ(Math.PI / 2); // align lathe axis with X
const body = mesh(bodyGeo, castMat);
valve.add(body);

// Casting seam ring around the fat middle
const seam = mesh(new THREE.TorusGeometry(1.17, 0.05, 12, 40), castMat);
seam.rotation.y = Math.PI / 2;
valve.add(seam);

// ----------------------------------------------------------------------------
// Flanges on both ends (with bolt-hole rings)
// ----------------------------------------------------------------------------
function buildFlange(sign) {
  const g = new THREE.Group();
  const faceX = 2.16 * sign;

  // main flange disc
  const disc = mesh(new THREE.CylinderGeometry(1.02, 1.02, 0.24, 56), castMat);
  disc.rotation.z = Math.PI / 2;
  disc.position.x = 2.04 * sign;
  g.add(disc);

  // hub / neck behind flange
  const hub = mesh(new THREE.CylinderGeometry(0.72, 0.9, 0.5, 40), castMat);
  hub.rotation.z = Math.PI / 2;
  hub.position.x = 1.72 * sign;
  g.add(hub);

  // raised sealing face
  const rface = mesh(new THREE.CylinderGeometry(0.66, 0.66, 0.06, 48), castMat);
  rface.rotation.z = Math.PI / 2;
  rface.position.x = (2.16 + 0.02) * sign;
  g.add(rface);

  // dark bore opening
  const bore = mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.09, 40), boreMat);
  bore.rotation.z = Math.PI / 2;
  bore.position.x = (2.16 + 0.03) * sign;
  g.add(bore);

  // bolt ring
  addBoltCircle(g, { count: 8, radius: 0.8, headR: 0.11, headH: 0.16, axis: 'x', offset: (2.16 + 0.06) * sign });

  return g;
}
valve.add(buildFlange(1));
valve.add(buildFlange(-1));

// ----------------------------------------------------------------------------
// Bonnet (spindle housing) on top + body/bonnet bolted joint
// ----------------------------------------------------------------------------
const bonnet = new THREE.Group();

// body neck rising to the bonnet flange
const bodyNeck = mesh(new THREE.CylinderGeometry(0.78, 1.05, 0.5, 44), castMat);
bodyNeck.position.y = 0.86;
bonnet.add(bodyNeck);

// lower (body-side) flange
const flangeLo = mesh(new THREE.CylinderGeometry(1.0, 1.0, 0.16, 44), castMat);
flangeLo.position.y = 1.12;
bonnet.add(flangeLo);

// upper (bonnet-side) flange
const flangeHi = mesh(new THREE.CylinderGeometry(1.0, 1.0, 0.16, 44), castMat);
flangeHi.position.y = 1.3;
bonnet.add(flangeHi);

// bolt ring joining the two flanges
addBoltCircle(bonnet, { count: 8, radius: 0.82, headR: 0.1, headH: 0.42, axis: 'y', offset: 1.21 });

// bonnet cone / neck
const bonnetNeck = mesh(new THREE.CylinderGeometry(0.44, 0.78, 1.05, 40), castMat);
bonnetNeck.position.y = 1.92;
bonnet.add(bonnetNeck);

// gusset ribs for cast look
for (let i = 0; i < 4; i++) {
  const a = i * Math.PI / 2;
  const rib = mesh(new THREE.BoxGeometry(0.08, 0.95, 0.34), castMat);
  rib.position.set(Math.cos(a) * 0.6, 1.85, Math.sin(a) * 0.6);
  rib.rotation.y = -a;
  rib.rotation.z = Math.cos(a) * 0.14;
  rib.rotation.x = -Math.sin(a) * 0.14;
  bonnet.add(rib);
}

// yoke sleeve / gland housing at top of bonnet
const yoke = mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.26, 40), castMat);
yoke.position.y = 2.55;
bonnet.add(yoke);

// gland hex nut (stem nut)
const glandNut = mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.2, 6), boltMat);
glandNut.position.y = 2.74;
bonnet.add(glandNut);

valve.add(bonnet);

// ----------------------------------------------------------------------------
// Rising stem
// ----------------------------------------------------------------------------
const stemTopY = 3.72;
const stemBaseY = 0.9;
const stem = mesh(new THREE.CylinderGeometry(0.085, 0.085, stemTopY - stemBaseY, 24), steelMat);
stem.position.y = (stemTopY + stemBaseY) / 2;
valve.add(stem);

// stem thread grooves (subtle)
for (let y = 2.9; y < stemTopY - 0.05; y += 0.09) {
  const ring = mesh(new THREE.TorusGeometry(0.088, 0.012, 6, 20), steelMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = y;
  valve.add(ring);
}

// ----------------------------------------------------------------------------
// Spoked handwheel
// ----------------------------------------------------------------------------
const wheel = new THREE.Group();
const rimRadius = 0.86;

// rim
const rimGeo = new THREE.TorusGeometry(rimRadius, 0.075, 16, 60);
wheel.add(mesh(rimGeo, wheelMat));

// spokes
const spokeCount = 5;
for (let i = 0; i < spokeCount; i++) {
  const th = (i / spokeCount) * Math.PI * 2;
  const spoke = mesh(new THREE.CylinderGeometry(0.045, 0.055, rimRadius, 16), wheelMat);
  spoke.position.set(Math.cos(th) * rimRadius / 2, Math.sin(th) * rimRadius / 2, 0);
  spoke.rotation.z = th - Math.PI / 2;
  wheel.add(spoke);
}

// hub
const hub = mesh(new THREE.CylinderGeometry(0.17, 0.2, 0.28, 24), castDarkMat);
hub.rotation.x = Math.PI / 2;
wheel.add(hub);

wheel.rotation.x = Math.PI / 2; // lay flat (turns about vertical stem)
wheel.position.y = stemTopY - 0.02;
valve.add(wheel);

// crown nut on top of stem
const crown = mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.16, 6), boltMat);
crown.position.y = stemTopY + 0.12;
valve.add(crown);

// ----------------------------------------------------------------------------
// Shadows + centering
// ----------------------------------------------------------------------------
valve.traverse(o => {
  if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
});

const box = new THREE.Box3().setFromObject(valve);
const center = new THREE.Vector3();
box.getCenter(center);
valve.position.sub(center);            // recenter object at origin
const groundY = box.min.y - center.y;  // lowest point after recentring
scene.add(valve);

// ----------------------------------------------------------------------------
// Ground plane that only receives shadows
// ----------------------------------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.ShadowMaterial({ opacity: 0.4 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = groundY - 0.01;
ground.receiveShadow = true;
scene.add(ground);

// ----------------------------------------------------------------------------
// Controls
// ----------------------------------------------------------------------------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 4;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI * 0.92;
controls.target.set(0, 0.2, 0);

// ----------------------------------------------------------------------------
// Resize + render loop
// ----------------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
