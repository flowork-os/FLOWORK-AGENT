<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fern Clump</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#101614}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101614);
scene.fog = new THREE.Fog(0x101614, 14, 30);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(5.5, 3.6, 6.5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.maxPolarAngle = Math.PI * 0.52;
controls.minDistance = 3; controls.maxDistance = 15;

// Lighting
scene.add(new THREE.HemisphereLight(0xbfd9c9, 0x2a2419, 0.7));
const sun = new THREE.DirectionalLight(0xfff2dc, 2.2);
sun.position.set(6, 9, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -5;
sun.shadow.camera.right = sun.shadow.camera.top = 5;
sun.shadow.bias = -0.0004;
sun.shadow.radius = 6;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x9fc4ff, 0.35);
fill.position.set(-5, 3, -4);
scene.add(fill);

// Ground
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 48),
  new THREE.MeshStandardMaterial({color:0x232e24, roughness:1})
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Seeded RNG
let seed = 7;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const rr = (a,b) => a + rand()*(b-a);

const fern = new THREE.Group();

const stemMat = new THREE.MeshStandardMaterial({color:0x4a7a2e, roughness:0.75});
const leafMats = [
  new THREE.MeshStandardMaterial({color:0x4fae3a, roughness:0.7, side:THREE.DoubleSide}),
  new THREE.MeshStandardMaterial({color:0x63c247, roughness:0.7, side:THREE.DoubleSide}),
  new THREE.MeshStandardMaterial({color:0x3f9631, roughness:0.75, side:THREE.DoubleSide}),
  new THREE.MeshStandardMaterial({color:0x7bd45a, roughness:0.65, side:THREE.DoubleSide}),
];

// Leaflet geometry: tapered blade in XZ, tip along +X
function leafletGeo() {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.quadraticCurveTo(0.45, 0.16, 1, 0);
  shape.quadraticCurveTo(0.45, -0.16, 0, 0);
  const g = new THREE.ShapeGeometry(shape, 6);
  g.rotateX(-Math.PI/2);
  return g;
}
const leafGeo = leafletGeo();

function makeFrond(len) {
  const g = new THREE.Group();
  // Arching spine curve
  const arch = rr(0.55, 0.95);
  const pts = [];
  for (let i = 0; i <= 10; i++) {
    const t = i/10;
    pts.push(new THREE.Vector3(
      t*len,
      Math.sin(t*Math.PI*0.62)*len*arch - t*t*len*arch*0.5,
      Math.sin(t*6 + rand()*4)*0.02*len
    ));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const stem = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 32, 0.014*len + 0.006, 5),
    stemMat
  );
  stem.castShadow = true;
  g.add(stem);

  const mat = leafMats[Math.floor(rand()*leafMats.length)];
  const nLeaf = Math.round(22 + len*8);
  const count = nLeaf*2;
  const inst = new THREE.InstancedMesh(leafGeo, mat, count);
  inst.castShadow = true;
  const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
  const tan = new THREE.Vector3(), up = new THREE.Vector3(0,1,0), side = new THREE.Vector3();
  let idx = 0;
  for (let i = 0; i < nLeaf; i++) {
    const t = 0.10 + 0.88*(i/(nLeaf-1));
    curve.getPointAt(t, p);
    curve.getTangentAt(t, tan);
    side.crossVectors(tan, up).normalize();
    // leaflet size: small near base, peak mid, taper to tip
    const size = (Math.sin(Math.pow(t,0.8)*Math.PI)*0.75 + 0.12) * len * 0.16;
    for (const dir of [1,-1]) {
      const angBase = Math.atan2(tan.y, Math.hypot(tan.x, tan.z));
      const yaw = Math.atan2(tan.z, tan.x) + dir*(Math.PI/2 - rr(0.5,0.75));
      q.setFromEuler(new THREE.Euler(
        rr(-0.25,0.25) + dir*0.28,          // roll — slight upward cup
        -yaw,
        angBase*0.5 + rr(-0.12,0.12),
        'YXZ'
      ));
      s.set(size, 1, size*rr(0.75,0.95));
      m.compose(p, q, s);
      inst.setMatrixAt(idx++, m);
    }
  }
  inst.count = idx;
  return g;
}

// Radiating fronds from central base
const N = 26;
for (let i = 0; i < N; i++) {
  const frond = new THREE.Group();
  const len = rr(1.4, 3.1);
  const f = makeFrond(len);
  f.children.forEach(c => frond.add(c.clone ? c : c));
  const built = makeFrond(len); // fresh build per frond for variation
  frond.clear();
  frond.add(built);
  const azimuth = (i/N)*Math.PI*2 + rr(-0.28, 0.28);
  frond.rotation.y = azimuth;
  // tilt: shorter inner fronds stand upright, longer ones lean out
  const lean = THREE.MathUtils.mapLinear(len, 1.4, 3.1, 0.15, 0.55) + rr(-0.12, 0.12);
  frond.rotation.z = -lean; // built along +X with upward arch; lean handled via curve
  frond.rotation.x = rr(-0.05, 0.05);
  frond.position.y = 0.04;
  fern.add(frond);
}

// A few young curled inner fronds (short, steep)
for (let i = 0; i < 6; i++) {
  const frond = new THREE.Group();
  frond.add(makeFrond(rr(0.7, 1.2)));
  frond.rotation.y = rand()*Math.PI*2;
  frond.rotation.z = rr(0.25, 0.5); // tilt upward
  frond.position.y = 0.05;
  fern.add(frond);
}

// Root crown
const crown = new THREE.Mesh(
  new THREE.SphereGeometry(0.22, 16, 12),
  new THREE.MeshStandardMaterial({color:0x5b4a2f, roughness:1})
);
crown.position.y = 0.06;
crown.scale.y = 0.6;
crown.castShadow = true;
fern.add(crown);

scene.add(fern);

// Gentle sway
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  fern.children.forEach((c, i) => {
    if (c.isGroup) c.rotation.x = Math.sin(t*1.2 + i*1.7)*0.012;
  });
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
