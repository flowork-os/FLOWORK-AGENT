<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roadside Food Truck</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #b9d9d8; }
canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9d9d8);
scene.fog = new THREE.Fog(0xb9d9d8, 28, 65);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(11, 8.3, 12.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.target.set(0, 2.3, 0);

scene.add(new THREE.HemisphereLight(0xdff7f2, 0x6f806e, 2.15));

const sun = new THREE.DirectionalLight(0xffefd2, 3.4);
sun.position.set(9, 15, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -18;
sun.shadow.camera.right = 18;
sun.shadow.camera.top = 18;
sun.shadow.camera.bottom = -18;
sun.shadow.bias = -0.0004;
scene.add(sun);

const palette = {
  cream: 0xffe7b7,
  pale: 0xfff3ce,
  coral: 0xe95f4d,
  coralDark: 0xb83e38,
  teal: 0x168f91,
  tealDark: 0x096467,
  mustard: 0xf2bd42,
  charcoal: 0x26363b,
  tire: 0x20282b,
  rubber: 0x101719,
  chrome: 0xc8d2ca,
  glass: 0x87c8cf,
  wood: 0x875638,
  ground: 0x8fb59b
};

function mat(color, roughness = 0.72, metalness = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness });
}

const materials = {
  cream: mat(palette.cream),
  pale: mat(palette.pale),
  coral: mat(palette.coral),
  coralDark: mat(palette.coralDark),
  teal: mat(palette.teal),
  tealDark: mat(palette.tealDark),
  mustard: mat(palette.mustard),
  charcoal: mat(palette.charcoal, 0.48),
  tire: mat(palette.tire, 0.96),
  rubber: mat(palette.rubber, 0.98),
  chrome: mat(palette.chrome, 0.25, 0.72),
  glass: new THREE.MeshStandardMaterial({ color: palette.glass, roughness: 0.18, metalness: 0.05, transparent: true, opacity: 0.82 }),
  wood: mat(palette.wood),
  white: mat(0xfff9e5)
};

function box(name, size, position, material, rotation = [0, 0, 0]) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function cylinder(name, radius, depth, position, material, rotation = [0, 0, 0], segments = 32) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, depth, segments), material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function sphere(name, scale, position, material) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 16), material);
  mesh.name = name;
  mesh.scale.set(scale[0], scale[1], scale[2]);
  mesh.position.set(position[0], position[1], position[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function roundedVisualBox(name, size, position, material, radius = 0.18) {
  const group = new THREE.Group();
  group.name = name;
  group.position.set(position[0], position[1], position[2]);
  const main = new THREE.Mesh(new THREE.BoxGeometry(size[0] - radius * 2, size[1], size[2]), material);
  const sideA = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2] - radius * 2), material);
  main.castShadow = main.receiveShadow = true;
  sideA.castShadow = sideA.receiveShadow = true;
  group.add(main, sideA);
  scene.add(group);
  return group;
}

function makeLabel(text, width = 900, height = 260, bg = "#f5c34d", fg = "#173e43", size = 100) {
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const context = canvas.getContext("2d");
  context.fillStyle = bg;
  context.fillRect(0, 0, width, height);
  context.strokeStyle = "#173e43";
  context.lineWidth = 18;
  context.strokeRect(10, 10, width - 20, height - 20);
  context.fillStyle = fg;
  context.font = `900 ${size}px Arial, sans-serif`;
  context.textAlign = "center";
  context.textBaseline = "middle";
  context.fillText(text, width / 2, height / 2 + 8);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
  return material;
}

function plane(name, width, height, position, material, rotation = [0, 0, 0]) {
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width, height), material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

const truck = new THREE.Group();
scene.add(truck);

function truckBox(size, position, material, rotation = [0, 0, 0]) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material);
  mesh.position.set(position[0], position[1], position[2]);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  truck.add(mesh);
  return mesh;
}

function truckCylinder(radius, depth, position, material, rotation = [0, 0, 0], segments = 32) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, depth, segments), material);
  mesh.position.set(position[0], position[1], position[2]);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  truck.add(mesh);
  return mesh;
}

truckBox([8.4, 3.45, 3.18], [0, 3.05, 0], materials.cream);
truckBox([8.55, 0.43, 3.28], [0, 1.48, 0], materials.tealDark);
truckBox([8.58, 0.33, 3.3], [0, 1.83, 0], materials.coral);
truckBox([8.56, 0.22, 3.28], [0, 2.08, 0], materials.mustard);

truckBox([3.05, 3.12, 3.2], [2.72, 3.02, 0], materials.coral);
truckBox([0.18, 3.08, 3.24], [1.18, 3.06, 0], materials.coralDark);
truckBox([0.15, 3.3, 3.24], [-4.17, 3.0, 0], materials.tealDark);

const windshield = plane("front windshield", 2.1, 1.2, [4.29, 3.8, 0], materials.glass, [0, Math.PI / 2, 0]);
windshield.scale.set(1, 1, 1);
truckBox([0.12, 1.6, 3.26], [4.18, 3.8, 0], materials.coralDark);

plane("driver side window", 1.55, 1.28, [2.72, 3.82, 1.626], materials.glass, [0, 0, 0]);
truckBox([0.08, 1.5, 0.13], [2.72, 3.82, 1.69], materials.coralDark);
truckBox([0.08, 1.5, 0.13], [3.63, 3.82, 1.69], materials.coralDark);
truckBox([0.08, 0.12, 1.75], [3.17, 4.42, 1.69], materials.coralDark);
truckBox([0.08, 0.12, 1.75], [3.17, 3.22, 1.69], materials.coralDark);

truckBox([0.11, 1.3, 0.9], [4.27, 2.52, -1.2], materials.mustard);
truckBox([0.11, 0.24, 1.5], [4.3, 1.98, 0], materials.coralDark);

const serviceOpening = box("serving window interior", [3.45, 1.55, 0.08], [-0.35, 3.25, 1.62], materials.charcoal);
serviceOpening.castShadow = false;
truckBox([3.7, 0.18, 0.18], [-0.35, 4.1, 1.73], materials.tealDark);
truckBox([0.18, 1.7, 0.18], [-2.18, 3.28, 1.73], materials.tealDark);
truckBox([0.18, 1.7, 0.18], [1.48, 3.28, 1.73], materials.tealDark);
truckBox([3.7, 0.18, 0.18], [-0.35, 2.4, 1.73], materials.tealDark);

const awning = truckBox([3.75, 0.13, 1.18], [-0.35, 4.42, 1.25], materials.coral, [-0.28, 0, 0]);
truckBox([3.75, 0.08, 0.12], [-0.35, 4.25, 1.78], materials.mustard);
truckBox([3.75, 0.08, 0.12], [-0.35, 4.58, 0.78], materials.mustard);

const counter = truckBox([3.9, 0.16, 1.02], [-0.35, 2.28, 2.07], materials.wood, [0, 0, 0]);
truckBox([3.9, 0.11, 0.12], [-0.35, 2.39, 2.57], materials.mustard);
truckBox([0.12, 0.7, 0.12], [-2.05, 1.92, 2.33], materials.tealDark);
truckBox([0.12, 0.7, 0.12], [1.35, 1.92, 2.33], materials.tealDark);

const menuMat = makeLabel("TASTY!", 800, 260, "#f2bd42", "#173e43", 120);
plane("menu board", 2.1, 0.72, [-2.72, 3.42, 1.78], menuMat, [0, 0, 0]);
truckBox([0.1, 1.45, 0.1], [-3.55, 3.2, 1.76], materials.chrome, [0, 0, 0.18]);
truckBox([0.1, 1.45, 0.1], [-1.89, 3.2, 1.76], materials.chrome, [0, 0, -0.18]);
truckBox([1.8, 0.08, 0.08], [-2.72, 2.5, 1.76], materials.chrome);

const logoMat = makeLabel("SUNNY BITES", 1200, 260, "#168f91", "#fff3ce", 100);
plane("side logo", 3.5, 0.76, [-0.15, 2.65, -1.64], logoMat, [0, Math.PI, 0]);

const smallLogoMat = makeLabel("SUNNY BITES", 1000, 220, "#e95f4d", "#fff3ce", 92);
plane("cab logo", 1.85, 0.42, [2.7, 2.35, 1.68], smallLogoMat, [0, 0, 0]);

for (const x of [-2.72, 2.72]) {
  for (const z of [-1.72, 1.72]) {
    const tire = truckCylinder(0.82, 0.46, [x, 1.17, z], materials.tire, [Math.PI / 2, 0, 0], 40);
    const hub = truckCylinder(0.36, 0.49, [x, 1.17, z + (z > 0 ? 0.03 : -0.03)], materials.chrome, [Math.PI / 2, 0, 0], 28);
    truckCylinder(0.17, 0.51, [x, 1.17, z + (z > 0 ? 0.04 : -0.04)], materials.tealDark, [Math.PI / 2, 0, 0], 24);
    const arch = new THREE.Mesh(new THREE.TorusGeometry(0.92, 0.15, 12, 36, Math.PI), materials.tealDark);
    arch.rotation.set(Math.PI / 2, 0, 0);
    arch.position.set(x, 1.26, z + (z > 0 ? 0.23 : -0.23));
    arch.castShadow = true;
    arch.receiveShadow = true;
    truck.add(arch);
  }
}

for (const z of [-1.67, 1.67]) {
  truckCylinder(0.22, 0.18, [4.3, 2.62, z], materials.white, [0, Math.PI / 2, 0], 24);
  truckCylinder(0.12, 0.2, [4.41, 2.62, z], materials.mustard, [0, Math.PI / 2, 0], 24);
}
truckBox([0.16, 0.35, 0.78], [4.28, 3.35, 0], materials.chrome);
truckBox([0.16, 0.12, 0.65], [4.37, 4.47, 0], materials.chrome);

truckBox([1.35, 0.65, 1.0], [-3.2, 1.78, -1.82], materials.charcoal);
truckBox([1.1, 0.08, 0.8], [-3.2, 2.13, -1.85], materials.teal);
truckBox([0.14, 0.22, 0.22], [-3.2, 1.78, -2.35], materials.mustard);
truckBox([0.14, 0.22, 0.22], [-3.2, 1.78, -1.3], materials.mustard);

truckBox([1.2, 0.18, 0.9], [-0.5, 4.86, 0], materials.charcoal);
truckBox([0.85, 0.18, 0.56], [-0.5, 5.02, 0], materials.chrome);
truckCylinder(0.23, 1.05, [-0.5, 5.42, 0], materials.charcoal, [0, 0, 0], 28);
truckBox([0.55, 0.1, 0.55], [-0.5, 5.9, 0], materials.charcoal);

for (const x of [-3.9, -1.95, 0, 1.95, 3.9]) {
  truckBox([0.09, 0.08, 3.25], [x, 3.05, 1.66], materials.mustard);
}
truckBox([8.0, 0.08, 0.1], [0, 2.18, 1.67], materials.mustard);
truckBox([8.0, 0.08, 0.1], [0, 2.95, 1.67], materials.mustard);

const pavement = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), mat(palette.ground, 0.96));
pavement.rotation.x = -Math.PI / 2;
pavement.position.y = 0;
pavement.receiveShadow = true;
scene.add(pavement);

const road = new THREE.Mesh(new THREE.PlaneGeometry(80, 12), mat(0x526a6a, 0.95));
road.rotation.x = -Math.PI / 2;
road.position.set(0, 0.012, 8.5);
road.receiveShadow = true;
scene.add(road);

for (let x = -35; x <= 35; x += 5) {
  box("road marking", [2.4, 0.025, 0.12], [x, 0.035, 8.5], materials.mustard);
}

for (let i = 0; i < 18; i++) {
  const x = -24 + i * 3.1;
  const shrub = sphere("background shrub", [1.1 + (i % 3) * 0.25, 0.75 + (i % 2) * 0.3, 0.8], [x, 0.62, -7.5 - (i % 3) * 0.7], mat(i % 2 ? 0x477d62 : 0x5d9167));
  shrub.castShadow = true;
}

const warmLight = new THREE.PointLight(0xffbd65, 2.2, 7);
warmLight.position.set(-0.3, 3.35, 2.0);
warmLight.castShadow = true;
scene.add(warmLight);

const signMat = makeLabel("BURGERS  •  TACOS  •  JOY", 1400, 220, "#e95f4d", "#fff3ce", 76);
plane("roof sign", 4.7, 0.74, [0.5, 5.17, -0.55], signMat, [Math.PI / 2, 0, 0]);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  warmLight.intensity = 2.05 + Math.sin(elapsed * 2.4) * 0.12;
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
