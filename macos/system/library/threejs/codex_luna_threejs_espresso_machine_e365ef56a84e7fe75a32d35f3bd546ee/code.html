<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Espresso Machine</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11151a}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101419);
scene.fog = new THREE.Fog(0x101419, 10, 22);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.3, 4.9, 7.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.0, -0.15);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 5;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.48;

const mats = {
  stainless: new THREE.MeshStandardMaterial({ color: 0xb8c0c3, metalness: 0.86, roughness: 0.22 }),
  stainlessDark: new THREE.MeshStandardMaterial({ color: 0x697276, metalness: 0.88, roughness: 0.3 }),
  brushed: new THREE.MeshStandardMaterial({ color: 0x969fa2, metalness: 0.9, roughness: 0.38 }),
  black: new THREE.MeshStandardMaterial({ color: 0x111519, metalness: 0.55, roughness: 0.27 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x090b0c, metalness: 0.05, roughness: 0.72 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xd9e2e3, metalness: 1, roughness: 0.1 }),
  brass: new THREE.MeshStandardMaterial({ color: 0xa87536, metalness: 0.88, roughness: 0.22 }),
  red: new THREE.MeshStandardMaterial({ color: 0x8d2524, metalness: 0.15, roughness: 0.3 }),
  blue: new THREE.MeshStandardMaterial({ color: 0x42a8c5, metalness: 0.1, roughness: 0.24, transparent: true, opacity: 0.78 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0x83b4b4, metalness: 0.05, roughness: 0.08, transmission: 0.22, transparent: true, opacity: 0.42 }),
  coffee: new THREE.MeshStandardMaterial({ color: 0x241108, metalness: 0.02, roughness: 0.2 }),
  white: new THREE.MeshStandardMaterial({ color: 0xe6e3da, metalness: 0.05, roughness: 0.28 })
};

function addMesh(mesh, cast = true, receive = true) {
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  scene.add(mesh);
  return mesh;
}

function box(name, size, position, material, radius = 0.08, bevelSegments = 4) {
  const geometry = new RoundedBoxGeometry(size[0], size[1], size[2], bevelSegments, radius);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  return addMesh(mesh);
}

function cylinder(name, radius, height, position, material, radialSegments = 48, rotation = [0, 0, 0]) {
  const geometry = new THREE.CylinderGeometry(radius, radius, height, radialSegments);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  return addMesh(mesh);
}

function torus(name, major, minor, position, material, rotation = [0, 0, 0]) {
  const geometry = new THREE.TorusGeometry(major, minor, 16, 64);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  return addMesh(mesh);
}

function between(name, a, b, radius, material, segments = 32) {
  const start = new THREE.Vector3(a[0], a[1], a[2]);
  const end = new THREE.Vector3(b[0], b[1], b[2]);
  const delta = new THREE.Vector3().subVectors(end, start);
  const length = delta.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, segments), material);
  mesh.name = name;
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
  return addMesh(mesh);
}

function edgeFrame(size, position, color = 0x252b2e) {
  const geometry = new THREE.BoxGeometry(size[0], size[1], size[2]);
  const edges = new THREE.EdgesGeometry(geometry);
  const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.62 }));
  line.position.set(position[0], position[1], position[2]);
  scene.add(line);
  return line;
}

const ambient = new THREE.HemisphereLight(0xb9d0e0, 0x17110d, 2.1);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xffead2, 4.8);
key.position.set(-5, 9, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -3;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8cb7da, 1.6);
fill.position.set(6, 4, -5);
scene.add(fill);

const warm = new THREE.PointLight(0xffb45d, 2.2, 8, 2);
warm.position.set(0, 3.3, -2.6);
scene.add(warm);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0x252a2c, metalness: 0.08, roughness: 0.7 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

const backWall = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 12),
  new THREE.MeshStandardMaterial({ color: 0x151a1e, roughness: 0.95 })
);
backWall.position.set(0, 5, 3.6);
backWall.rotation.x = -Math.PI / 2;
backWall.receiveShadow = true;
scene.add(backWall);

box("main stainless cabinet", [4.05, 3.35, 2.35], [0, 2.15, 0], mats.stainless, 0.16, 6);
box("lower dark plinth", [4.1, 0.42, 2.4], [0, 0.43, -0.01], mats.black, 0.1, 5);
box("upper cap", [4.04, 0.22, 2.34], [0, 3.9, 0], mats.brushed, 0.08, 4);
edgeFrame([4.05, 3.35, 2.35], [0, 2.15, 0], 0x30383a);

box("front inset panel", [3.63, 2.18, 0.055], [0, 2.25, -1.205], mats.brushed, 0.04, 3);
box("front lower fascia", [3.7, 0.28, 0.08], [0, 0.78, -1.23], mats.stainlessDark, 0.025, 2);

box("rear tank seam", [2.85, 2.34, 0.035], [0.18, 2.68, 1.19], mats.stainlessDark, 0.025, 2);
box("rear tank window", [2.55, 1.86, 0.026], [0.18, 2.68, 1.212], mats.glass, 0.025, 2);
box("rear tank top rim", [2.72, 0.09, 0.045], [0.18, 3.65, 1.235], mats.black, 0.02, 2);
box("rear tank side seam", [0.055, 1.9, 0.045], [1.48, 2.68, 1.235], mats.stainlessDark, 0.01, 2);

box("top control deck", [3.42, 0.14, 1.55], [0, 4.08, -0.05], mats.black, 0.08, 4);
box("top metal surround", [3.12, 0.055, 1.22], [0, 4.17, -0.06], mats.stainlessDark, 0.04, 3);

for (let i = 0; i < 8; i++) {
  box("vent slot " + i, [0.19, 0.025, 0.72], [-1.17 + i * 0.34, 4.205, 0.1], mats.rubber, 0.02, 2);
}

cylinder("left control knob", 0.27, 0.12, [-1.18, 4.28, -0.42], mats.chrome, 40, [Math.PI / 2, 0, 0]);
cylinder("left knob face", 0.2, 0.126, [-1.18, 4.28, -0.42], mats.black, 40, [Math.PI / 2, 0, 0]);
box("left knob marker", [0.025, 0.035, 0.12], [-1.18, 4.36, -0.42], mats.white, 0.005, 1);

cylinder("right control knob", 0.27, 0.12, [1.17, 4.28, -0.42], mats.chrome, 40, [Math.PI / 2, 0, 0]);
cylinder("right knob face", 0.2, 0.126, [1.17, 4.28, -0.42], mats.black, 40, [Math.PI / 2, 0, 0]);
box("right knob marker", [0.025, 0.035, 0.12], [1.17, 4.36, -0.42], mats.white, 0.005, 1);

cylinder("power button bezel", 0.2, 0.07, [0, 4.25, -0.41], mats.chrome, 40, [Math.PI / 2, 0, 0]);
cylinder("power button", 0.13, 0.077, [0, 4.25, -0.41], mats.red, 40, [Math.PI / 2, 0, 0]);

box("group head mounting block", [1.65, 0.55, 0.62], [0.15, 2.87, -1.36], mats.black, 0.1, 5);
box("group head chrome plate", [1.38, 0.23, 0.18], [0.15, 2.66, -1.69], mats.chrome, 0.08, 4);
cylinder("group head collar", 0.57, 0.24, [0.15, 2.48, -1.77], mats.chrome, 64, [Math.PI / 2, 0, 0]);
torus("group head gasket", 0.44, 0.075, [0.15, 2.48, -1.91], mats.rubber, [Math.PI / 2, 0, 0]);
cylinder("portafilter basket", 0.46, 0.29, [0.15, 2.35, -1.99], mats.black, 64, [Math.PI / 2, 0, 0]);
cylinder("portafilter chrome rim", 0.5, 0.08, [0.15, 2.24, -2.08], mats.chrome, 64, [Math.PI / 2, 0, 0]);

between("portafilter handle stem", [0.15, 2.2, -2.1], [0.54, 1.94, -2.35], 0.12, mats.chrome, 32);
between("portafilter black grip", [0.54, 1.94, -2.35], [1.42, 1.49, -2.73], 0.16, mats.rubber, 36);
torus("handle end cap", 0.16, 0.045, [1.44, 1.48, -2.74], mats.chrome, [0, Math.PI / 2.65, 0]);

cylinder("dual spout mount", 0.16, 0.24, [0.15, 2.04, -2.1], mats.chrome, 40, [Math.PI / 2, 0, 0]);
between("left coffee spout", [0.04, 1.92, -2.16], [-0.04, 1.7, -2.28], 0.075, mats.chrome, 24);
between("right coffee spout", [0.26, 1.92, -2.16], [0.34, 1.7, -2.28], 0.075, mats.chrome, 24);
cylinder("left coffee outlet", 0.09, 0.1, [-0.04, 1.65, -2.3], mats.black, 24, [0, 0, 0]);
cylinder("right coffee outlet", 0.09, 0.1, [0.34, 1.65, -2.3], mats.black, 24, [0, 0, 0]);

box("drip tray housing", [3.72, 0.25, 1.25], [0.05, 0.72, -1.31], mats.black, 0.08, 4);
box("drip tray metal basin", [3.35, 0.13, 1.05], [0.05, 0.88, -1.44], mats.chrome, 0.05, 3);
box("drip tray inner recess", [3.05, 0.045, 0.84], [0.05, 0.962, -1.45], mats.black, 0.03, 2);

for (let i = 0; i < 11; i++) {
  box("drip grille bar " + i, [0.09, 0.065, 0.76], [-1.35 + i * 0.28, 1.015, -1.45], mats.stainlessDark, 0.018, 2);
}
for (let j = 0; j < 3; j++) {
  box("drip grille crossbar " + j, [3.0, 0.045, 0.065], [0.05, 1.055, -1.75 + j * 0.29], mats.stainlessDark, 0.015, 2);
}

box("water level indicator", [0.22, 0.62, 0.045], [-1.61, 1.9, -1.25], mats.blue, 0.02, 2);
box("indicator frame", [0.34, 0.76, 0.04], [-1.61, 1.9, -1.28], mats.black, 0.03, 3);

const steamPivot = new THREE.Group();
steamPivot.position.set(1.65, 2.15, -1.15);
scene.add(steamPivot);

const steamUpper = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.62, 36), mats.chrome);
steamUpper.position.set(0.18, -0.1, -0.3);
steamUpper.rotation.z = -0.48;
steamUpper.castShadow = true;
steamPivot.add(steamUpper);

const steamElbow = new THREE.Mesh(new THREE.SphereGeometry(0.145, 32, 20), mats.chrome);
steamElbow.position.set(0.33, -0.37, -0.55);
steamElbow.castShadow = true;
steamPivot.add(steamElbow);

const steamLower = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.88, 32), mats.chrome);
steamLower.position.set(0.25, -0.72, -0.66);
steamLower.rotation.z = 0.18;
steamLower.castShadow = true;
steamPivot.add(steamLower);

const steamTip = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.065, 0.22, 32), mats.brass);
steamTip.position.set(0.18, -1.16, -0.7);
steamTip.castShadow = true;
steamPivot.add(steamTip);

for (let i = 0; i < 5; i++) {
  const hole = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.012, 12), mats.black);
  hole.position.set(0.18 + Math.cos(i * Math.PI * 2 / 5) * 0.042, -1.275, -0.7 + Math.sin(i * Math.PI * 2 / 5) * 0.042);
  hole.rotation.x = Math.PI / 2;
  steamPivot.add(hole);
}

box("steam valve block", [0.46, 0.5, 0.42], [1.7, 2.67, -1.21], mats.black, 0.08, 4);
cylinder("steam valve knob", 0.2, 0.18, [1.7, 2.93, -1.25], mats.red, 36, [Math.PI / 2, 0, 0]);
cylinder("steam valve cap", 0.12, 0.19, [1.7, 3.04, -1.25], mats.chrome, 36, [Math.PI / 2, 0, 0]);

const cupGroup = new THREE.Group();
cupGroup.position.set(0.9, 1.03, -1.53);
scene.add(cupGroup);

const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.3, 0.5, 48, 1, true), mats.white);
cup.position.y = 0.25;
cup.castShadow = true;
cupGroup.add(cup);

const cupInner = new THREE.Mesh(new THREE.CylinderGeometry(0.31, 0.26, 0.025, 48), mats.coffee);
cupInner.position.y = 0.5;
cupInner.castShadow = true;
cupGroup.add(cupInner);

const cupRim = new THREE.Mesh(new THREE.TorusGeometry(0.345, 0.035, 12, 48), mats.white);
cupRim.position.y = 0.51;
cupGroup.add(cupRim);

const cupHandle = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.055, 16, 36, Math.PI * 1.55), mats.white);
cupHandle.position.set(0.38, 0.27, 0);
cupHandle.rotation.y = Math.PI / 2;
cupHandle.castShadow = true;
cupGroup.add(cupHandle);

for (let i = 0; i < 4; i++) {
  cylinder("rubber foot " + i, 0.13, 0.12, [-1.55 + (i % 2) * 3.1, 0.17, -0.75 + Math.floor(i / 2) * 1.5], mats.rubber, 32);
}

const logoPlate = box("front logo plate", [0.65, 0.2, 0.025], [0, 1.36, -1.254], mats.black, 0.035, 3);
logoPlate.castShadow = false;
const logoDisc = cylinder("front logo disc", 0.075, 0.035, [0, 1.36, -1.28], mats.brass, 32, [Math.PI / 2, 0, 0]);
logoDisc.castShadow = false;

const machineGlow = new THREE.PointLight(0x75d7e9, 1.15, 2.6, 2);
machineGlow.position.set(0, 1.45, -2.0);
scene.add(machineGlow);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

animate();
</script>
</body>
</html>
