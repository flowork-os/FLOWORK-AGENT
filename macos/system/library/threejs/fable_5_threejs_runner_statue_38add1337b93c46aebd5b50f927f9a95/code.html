<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Runner Statue</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1116; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10141b);
scene.fog = new THREE.Fog(0x10141b, 14, 34);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.6, 2.6, 5.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.minDistance = 2.5;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.52;

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2c241a, 0.55));

const sun = new THREE.DirectionalLight(0xfff1dc, 2.2);
sun.position.set(6, 9, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -5; sun.shadow.camera.right = 5;
sun.shadow.camera.top = 5; sun.shadow.camera.bottom = -5;
sun.shadow.camera.near = 2; sun.shadow.camera.far = 25;
sun.shadow.radius = 6;
sun.shadow.bias = -0.0004;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x7fa7ff, 0.7);
rim.position.set(-6, 4, -5);
scene.add(rim);

const fill = new THREE.PointLight(0xffe6c2, 8, 12, 2);
fill.position.set(-2.5, 2.2, 3);
scene.add(fill);

// ---------- Materials ----------
const bronze = new THREE.MeshStandardMaterial({
  color: 0x8a5a2b, metalness: 0.92, roughness: 0.38,
  envMapIntensity: 1.0
});
const bronzeDark = new THREE.MeshStandardMaterial({
  color: 0x6e4522, metalness: 0.9, roughness: 0.45
});
const stone = new THREE.MeshStandardMaterial({ color: 0x9d9891, roughness: 0.9, metalness: 0.02 });
const stoneDark = new THREE.MeshStandardMaterial({ color: 0x7d7871, roughness: 0.92, metalness: 0.02 });
const groundMat = new THREE.MeshStandardMaterial({ color: 0x3a4038, roughness: 1.0, metalness: 0.0 });
const plaqueMat = new THREE.MeshStandardMaterial({ color: 0xb08d57, metalness: 0.85, roughness: 0.3 });

// ---------- Ground ----------
const ground = new THREE.Mesh(new THREE.CircleGeometry(20, 64), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Soft contact shadow disc under pedestal
const shadowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 20, 128, 128, 128);
  grad.addColorStop(0, 'rgba(0,0,0,0.42)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const softShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(4.6, 4.6),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
);
softShadow.rotation.x = -Math.PI / 2;
softShadow.position.y = 0.005;
scene.add(softShadow);

// ---------- Statue group (statue ~1.9m figure on ~1.1m plinth) ----------
const statue = new THREE.Group();
scene.add(statue);

function mesh(geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  return m;
}

// ---------- Pedestal ----------
const pedestal = new THREE.Group();
pedestal.add(mesh(new THREE.BoxGeometry(2.4, 0.22, 1.8), stoneDark, 0, 0.11, 0));      // base slab
pedestal.add(mesh(new THREE.BoxGeometry(2.0, 0.72, 1.4), stone, 0, 0.22 + 0.36, 0));   // main block
pedestal.add(mesh(new THREE.BoxGeometry(2.15, 0.14, 1.55), stoneDark, 0, 0.94 + 0.07, 0)); // cap
const plaque = mesh(new THREE.BoxGeometry(0.8, 0.34, 0.03), plaqueMat, 0, 0.6, 0.715);
pedestal.add(plaque);
statue.add(pedestal);

const TOP = 1.08; // top surface of pedestal

// ---------- Runner figure (bronze), pelvis-centered kinematic build ----------
const runner = new THREE.Group();

function limb(r1, r2, len, mat = bronze) {
  // capsule-ish tapered limb segment, origin at top, extends -Y
  const g = new THREE.CylinderGeometry(r2, r1, len, 16, 1);
  g.translate(0, -len / 2, 0);
  const m = new THREE.Mesh(g, mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
function ball(r, mat = bronze) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 16), mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}

// Torso lean forward
const pelvis = new THREE.Group();
pelvis.position.set(0, 1.02, 0); // pelvis height above pedestal top (dynamic stride)
runner.add(pelvis);

const hips = ball(0.16);
hips.scale.set(1.15, 0.85, 0.9);
pelvis.add(hips);

// Spine / chest
const torso = new THREE.Group();
torso.rotation.x = 0.32; // forward lean
pelvis.add(torso);

const belly = limb(0.135, 0.155, 0.28);
belly.rotation.x = Math.PI; // extend upward
torso.add(belly);

const chest = ball(0.185);
chest.scale.set(1.25, 1.25, 0.95);
chest.position.set(0, 0.42, 0.02);
torso.add(chest);

// Shoulders
const shoulderBar = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.44, 12), bronze);
shoulderBar.rotation.z = Math.PI / 2;
shoulderBar.position.set(0, 0.56, 0.02);
shoulderBar.castShadow = true;
torso.add(shoulderBar);

// Neck + head
const neck = limb(0.055, 0.065, 0.12);
neck.rotation.x = Math.PI - 0.15;
neck.position.set(0, 0.6, 0.03);
torso.add(neck);
const head = ball(0.115);
head.scale.set(0.92, 1.1, 1.0);
head.position.set(0, 0.82, 0.07);
torso.add(head);
const jaw = ball(0.06, bronzeDark);
jaw.position.set(0, 0.76, 0.15);
torso.add(jaw);

// ---- Arms (opposite to legs: right leg forward -> left arm forward)
function makeArm(side, shoulderPitch, elbowBend) {
  // side: +1 right, -1 left
  const shoulder = new THREE.Group();
  shoulder.position.set(side * 0.245, 0.56, 0.02);
  shoulder.rotation.x = shoulderPitch;
  shoulder.rotation.z = side * 0.12;
  torso.add(shoulder);
  shoulder.add(ball(0.085));

  const upper = limb(0.062, 0.052, 0.30);
  shoulder.add(upper);

  const elbow = new THREE.Group();
  elbow.position.set(0, -0.30, 0);
  elbow.rotation.x = elbowBend;
  shoulder.add(elbow);
  elbow.add(ball(0.055));

  const fore = limb(0.05, 0.04, 0.27);
  elbow.add(fore);

  const fist = ball(0.055, bronzeDark);
  fist.position.set(0, -0.29, 0);
  elbow.add(fist);
  return shoulder;
}
// Left arm swings forward (pitch negative = forward), tight elbow
makeArm(-1, -0.9, -1.9);
// Right arm swings back
makeArm(1, 0.85, -1.75);

// ---- Legs: right leg forward planted, left leg trailing bent
function makeLeg(side, hipPitch, kneeBend, anklePitch, foot = true) {
  const hip = new THREE.Group();
  hip.position.set(side * 0.11, -0.05, 0);
  hip.rotation.x = hipPitch;
  pelvis.add(hip);
  hip.add(ball(0.105));

  const thigh = limb(0.095, 0.075, 0.44);
  hip.add(thigh);

  const knee = new THREE.Group();
  knee.position.set(0, -0.44, 0);
  knee.rotation.x = kneeBend;
  hip.add(knee);
  knee.add(ball(0.078));

  const shin = limb(0.07, 0.05, 0.43);
  knee.add(shin);

  const ankle = new THREE.Group();
  ankle.position.set(0, -0.43, 0);
  ankle.rotation.x = anklePitch;
  knee.add(ankle);
  ankle.add(ball(0.05));

  if (foot) {
    const f = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.07, 0.27), bronzeDark);
    f.position.set(0, -0.045, 0.075);
    f.castShadow = f.receiveShadow = true;
    ankle.add(f);
  }
  return { hip, knee, ankle };
}
// Right leg: driven forward, nearly straight, heel striking / planted
makeLeg(1, -0.85, 0.55, 0.28);
// Left leg: trailing, strongly bent at knee, toe pushing off
makeLeg(-1, 0.75, 1.55, -0.55);

// Support strut disguised as part of casting (trailing toe touches base)
const strut = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.05, 0.34, 10), bronzeDark);
strut.position.set(-0.11, 0.17, -0.52);
strut.rotation.x = 0.15;
strut.castShadow = true;
runner.add(strut);

// Bronze base plate the figure is cast onto
const basePlate = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.07, 1.15), bronzeDark);
basePlate.position.y = 0.035;
basePlate.castShadow = basePlate.receiveShadow = true;
runner.add(basePlate);

runner.position.y = TOP;
runner.rotation.y = 0.25;
statue.add(runner);

// ---------- Resize / Animate ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
