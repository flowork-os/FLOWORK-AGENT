let seed = 718293;
function random() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function rand(min, max) {
  return min + (max - min) * random();
}

function makeFloorTexture() {
  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#100d16";
  ctx.fillRect(0, 0, 512, 512);

  for (let y = 0; y < 512; y += 64) {
    for (let x = 0; x < 512; x += 64) {
      ctx.fillStyle = ((x / 64 + y / 64) % 2 === 0) ? "#16111c" : "#0d0a12";
      ctx.fillRect(x, y, 64, 64);
    }
  }

  ctx.strokeStyle = "rgba(174,117,48,0.28)";
  ctx.lineWidth = 2;
  for (let p = -512; p < 1024; p += 64) {
    ctx.beginPath();
    ctx.moveTo(p, 0);
    ctx.lineTo(p + 512, 512);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p + 512, 0);
    ctx.lineTo(p, 512);
    ctx.stroke();
  }

  ctx.strokeStyle = "rgba(225,174,87,0.46)";
  ctx.lineWidth = 4;
  ctx.strokeRect(12, 12, 488, 488);
  ctx.strokeRect(27, 27, 458, 458);

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(2.5, 2.5);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function makeBackdropTexture() {
  const canvas = document.createElement("canvas");
  canvas.width = 1024;
  canvas.height = 512;
  const ctx = canvas.getContext("2d");
  const gradient = ctx.createLinearGradient(0, 0, 0, 512);
  gradient.addColorStop(0, "#080610");
  gradient.addColorStop(0.48, "#180d21");
  gradient.addColorStop(1, "#08050c");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 1024, 512);

  ctx.strokeStyle = "rgba(157,107,61,0.26)";
  ctx.lineWidth = 3;
  for (let x = 30; x < 1024; x += 82) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x + 180, 512);
    ctx.stroke();
  }

  ctx.strokeStyle = "rgba(220,165,75,0.16)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(512, 380, 210, Math.PI, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(512, 380, 156, Math.PI, Math.PI * 2);
  ctx.stroke();

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function makeBox(width, height, depth, material, x, y, z, parent) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth),
    material
  );
  mesh.position.set(x, y, z);
  if (parent) {
    parent.add(mesh);
  } else {
    scene.add(mesh);
  }
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function makeCylinder(radiusTop, radiusBottom, height, material, x, y, z, parent, radial) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(
      radiusTop,
      radiusBottom,
      height,
      radial || 24,
      1,
      false
    ),
    material
  );
  mesh.position.set(x, y, z);
  if (parent) {
    parent.add(mesh);
  } else {
    scene.add(mesh);
  }
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function makeSphere(radius, material, x, y, z, parent) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 24, 16),
    material
  );
  mesh.position.set(x, y, z);
  if (parent) {
    parent.add(mesh);
  } else {
    scene.add(mesh);
  }
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function makeTorus(radius, tube, material, x, y, z, parent, rotationX) {
  const mesh = new THREE.Mesh(
    new THREE.TorusGeometry(radius, tube, 12, 48),
    material
  );
  mesh.position.set(x, y, z);
  mesh.rotation.x = rotationX || 0;
  if (parent) {
    parent.add(mesh);
  } else {
    scene.add(mesh);
  }
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function makePlane(width, height, material, x, y, z, rotationX) {
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(width, height),
    material
  );
  mesh.position.set(x, y, z);
  mesh.rotation.x = rotationX || 0;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function makeCurtainPanel(x, width, phase) {
  const panel = new THREE.Group();
  panel.position.set(x, 5.9, -5.48);
  scene.add(panel);

  const body = makeBox(width, 10.4, 0.34, mats.velvet, 0, -0.15, 0, panel);
  body.castShadow = true;

  const pleatCount = Math.max(5, Math.floor(width * 2.2));
  for (let pleat = 0; pleat < pleatCount; pleat++) {
    const localX = -width * 0.48 + (width * 0.96 * pleat) / (pleatCount - 1);
    const fold = makeCylinder(
      0.1,
      0.1,
      10.15,
      pleat % 2 === 0 ? mats.velvetLight : mats.velvet,
      localX,
      -0.1,
      -0.2,
      panel,
      12
    );
    fold.scale.z = 1.7;
  }

  const trim = makeBox(width + 0.25, 0.16, 0.48, mats.gold, 0, 5.05, -0.24, panel);
  trim.castShadow = false;
  panel.userData.phase = phase;
  return panel;
}

function makePiano() {
  const group = new THREE.Group();
  group.position.set(-3.6, 0.47, -2.18);

  scene.add(group);

  makeBox(4.25, 0.8, 1.42, mats.black, 0, 1.1, 0, group);

  const lid = makeBox(3.93, 0.14, 1.37, mats.black, -0.05, 2.18, -0.03, group);
  lid.rotation.x = -0.72;
  lid.rotation.z = 0.035;
  const lidRim = makeBox(3.95, 0.08, 0.07, mats.gold, -0.05, 2.19, 0.65, group);
  lidRim.rotation.x = -0.72;
  lidRim.rotation.z = 0.035;

  for (let key = 0; key < 18; key++) {
    const keyX = -1.65 + key * 0.195;
    const whiteKey = makeBox(0.17, 0.1, 0.54, mats.ivory, keyX, 1.48, 0.79, group);
    whiteKey.castShadow = false;

  for (let blackKey = 0; blackKey < 12; blackKey++) {
    const blackX = -1.46 + blackKey * 0.292;
    const blackKeyMesh = makeBox(0.105, 0.15, 0.31, mats.black, blackX, 1.57, 0.64, group);
    blackKeyMesh.castShadow = false;
  }

  makeBox(3.8, 0.16, 0.62, mats.ebony, 0, 1.72, 0.27, group);

  const rearLeg = makeCylinder(0.12, 0.16, 1.1, mats.black, 1.45, 0.55, -0.36, group, 16);
  rearLeg.rotation.z = -0.18;
  const frontLeg = makeCylinder(0.12, 0.16, 1.1, mats.black, -1.45, 0.55, 0.42, group, 16);
  frontLeg.rotation.z = 0.18;
  makeCylinder(0.32, 0.38, 0.12, mats.gold, 0.85, 0.12, 0.2, group, 20);
  makeCylinder(0.32, 0.38, 0.12, mats.gold, -0.85, 0.12, 0.2, group, 20);

  const music = makeBox(1.45, 0.08, 0.72, mats.ebony, 0.38, 2.04, 0.1, group);
  music.rotation.x = -0.27;
  makeBox(0.07, 0.88, 0.07, mats.gold, 0.38, 1.86, -0.17, group);
  makeBox(1.58, 0.06, 0.05, mats.gold, 0.38, 1.74, 0.47, group);
}

function makeDoubleBass() {
  const group = new THREE.Group();
  group.position.set(3.35, 0.5, -1.72);
  group.rotation.z = -0.07;
  group.rotation.y = 0.08;
  scene.add(group);

  const bottom = makeSphere(0.95, mats.wood, 0, 1.55, 0, group);
  bottom.scale.set(0.78, 1.13, 0.32);
  const upper = makeSphere(0.76, mats.woodLight, 0, 3.0, 0, group);
  upper.scale.set(0.82, 0.96, 0.3);
  const waist = makeSphere(0.46, mats.wood, 0, 2.28, 0, group);
  waist.scale.set(0.92, 0.9, 0.31);

  makeBox(0.18, 0.32, 0.17, mats.gold, 0, 2.27, 0.31, group);
  makeBox(0.1, 0.64, 0.08, mats.cream, 0, 2.43, 0.34, group);

  const fingerboard = makeBox(0.26, 2.48, 0.12, mats.fret, 0, 3.74, 0.29, group);
  fingerboard.rotation.z = -0.015;
  makeBox(0.15, 2.2, 0.07, mats.gold, 0, 3.78, 0.36, group);

  const neck = makeBox(0.28, 2.04, 0.23, mats.wood, 0, 4.3, 0, group);
  neck.rotation.z = 0.01;
  const scroll = makeSphere(0.38, mats.woodLight, 0, 5.34, 0, group);
  scroll.scale.set(0.74, 1.05, 0.7);
  makeTorus(0.19, 0.045, mats.gold, 0, 5.54, 0.22, group, Math.PI / 2);
  makeCylinder(0.06, 0.08, 0.6, mats.gold, 0, 0.38, 0, group, 14);

  const stringGroup = new THREE.Group();
  group.add(stringGroup);
  for (let stringIndex = 0; stringIndex < 4; stringIndex++) {
    const stringX = -0.07 + stringIndex * 0.047;
    const string = makeCylinder(
      0.009,
      0.009,
      4.82,
      stringIndex % 2 === 0 ? mats.cream : mats.gold,
      stringX,
      3.55,
      0.42,
      stringGroup,
      8
    );
    string.userData.index = stringIndex;
  }
  group.userData.strings = stringGroup;

  for (let fHole = 0; fHole < 2; fHole++) {
    const hole = makeTorus(0.16, 0.035, mats.black, fHole === 0 ? -0.45 : 0.45, 2.34, 0.32, group, Math.PI / 2);
    hole.scale.set(0.65, 1.9, 1);
  }

  const bow = makeBox(0.055, 2.05, 0.055, mats.gold, -0.8, 2.56, 0.03, group);
  bow.rotation.z = 0.18;
  makeBox(0.09, 0.13, 0.13, mats.cream, -0.98, 1.55, 0.03, group);
}

function makeDrumKit() {
  const group = new THREE.Group();
  group.position.set(1.32, 0.52, -3.25);
  group.rotation.y = 0.07;
  scene.add(group);

  const bassDrum = makeCylinder(0.96, 0.96, 1.1, mats.black, 0, 1.18, 0, group, 32);
  bassDrum.rotation.x = Math.PI / 2;
  const bassFront = makeCylinder(0.8, 0.8, 0.035, mats.velvet, 0, 1.18, 0.58, group, 32);
  bassFront.rotation.x = Math.PI / 2;
  makeTorus(0.79, 0.045, mats.brass, 0, 1.18, 0.61, group, Math.PI / 2);

  const tomLeft = makeCylinder(0.44, 0.5, 0.45, mats.red, -0.55, 2.05, 0.05, group, 24);
  tomLeft.rotation.x = Math.PI / 2;
  const tomRight = makeCylinder(0.43, 0.49, 0.44, mats.red, 0.47, 2.15, 0.02, group, 24);
  tomRight.rotation.x = Math.PI / 2;
  makeTorus(0.39, 0.035, mats.brass, -0.55, 2.05, 0.29, group, Math.PI / 2);
  makeTorus(0.38, 0.035, mats.brass, 0.47, 2.15, 0.26, group, Math.PI / 2);

  const snare = makeCylinder(0.48, 0.48, 0.3, mats.cream, -1.0, 1.34, 0.68, group, 24);
  snare.rotation.x = Math.PI / 2;
  makeTorus(0.44, 0.035, mats.brass, -1.0, 1.34, 0.85, group, Math.PI / 2);

  for (let leg = 0; leg < 3; leg++) {
    const angle = leg * Math.PI * 2 / 3;
    const support = makeCylinder(
      0.035,
      0.045,
      1.15,
      mats.brass,
      Math.cos(angle) * 0.64,
      0.63,
      Math.sin(angle) * 0.64,
      group,
      10
    );
    support.rotation.z = Math.sin(angle) * 0.24;
    support.rotation.x = Math.cos(angle) * 0.24;
  }

  function cymbal(x, y, z, radius, tilt) {
    const stand = makeCylinder(0.035, 0.05, y - 0.55, mats.brass, x, (y + 0.55) / 2, z, group, 12);
    stand.rotation.z = 0.08;
    const disc = makeCylinder(radius, radius * 0.82, 0.055, mats.cymbal, x, y, z, group, 32);
    disc.rotation.z = tilt;
    makeTorus(radius * 0.72, 0.025, mats.gold, x, y + 0.035, z, group, 0);
    return disc;
  }

  const cymbalOne = cymbal(-1.45, 3.05, 0.03, 0.67, -0.12);
  const cymbalTwo = cymbal(1.2, 3.42, -0.04, 0.78, 0.12);
  group.userData.cymbals = [cymbalOne, cymbalTwo];

  const pedal = makeBox(0.12, 0.06, 0.76, mats.brass, 0, 0.62, 0.68, group);
  pedal.rotation.x = -0.12;
}
makeDrumKit();

function makeMicrophone() {
  const group = new THREE.Group();

  const base = makeCylinder(0.52, 0.62, 0.16, mats.black, 0, 0.1, 0, group, 32);

  const head = new THREE.Group();

  head.rotation.z = -0.08;
  group.add(head);
  const capsule = makeSphere(0.3, mats.brass, 0, 0, 0, head);
  capsule.scale.set(0.78, 1.18, 0.78);
  for (let ring = 0; ring < 5; ring++) {
    const grill = makeTorus(
      0.245 - ring * 0.012,
      0.022,
      mats.black,
      0,
      -0.17 + ring * 0.085,
      0.22,
      head,
      Math.PI / 2
    );
    grill.scale.x = 0.84;
  }
  makeTorus(0.305, 0.045, mats.gold, 0, 0, 0, head, 0);
  group.userData.head = head;
}

function makeTable(x, z, scale, phase) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  group.scale.setScalar(scale);
  scene.add(group);

  makeCylinder(0.72, 0.76, 0.13, mats.black, 0, 1.12, 0, group, 32);
  makeTorus(0.62, 0.045, mats.gold, 0, 1.2, 0, group, 0);
  makeCylinder(0.12, 0.2, 1.0, mats.brass, 0, 0.59, 0, group, 20);
  makeCylinder(0.56, 0.66, 0.12, mats.black, 0, 0.08, 0, group, 32);
  makeTorus(0.51, 0.04, mats.gold, 0, 0.15, 0, group, 0);

  const lamp = makeSphere(0.115, mats.glowAmber, 0, 1.35, 0, group);
  lamp.scale.set(1, 1.25, 1);
  const shade = makeCylinder(0.23, 0.14, 0.17, mats.gold, 0, 1.28, 0, group, 24);
  shade.castShadow = false;

  const point = new THREE.PointLight(0xff8c38, 0.52, 3.1, 2);
  point.position.set(x, 1.35, z);
  point.castShadow = false;
  scene.add(point);

  group.userData.lamp = lamp;
  group.userData.light = point;
  group.userData.phase = phase;
  return group;
}

const sweepers = [];

function makeSweeper(x, z, color, phase, intensity) {
  const light = new THREE.SpotLight(
    color,
    intensity,
    18,
    Math.PI / 8,
    0.72,
    1.4
  );
  light.position.set(x, 8.3, z);
  light.castShadow = true;
  light.shadow.mapSize.set(1024, 1024);
  light.shadow.bias = -0.0003;
  scene.add(light);

  const target = new THREE.Object3D();
  target.position.set(x * 0.2, 0.2, -2.5);
  scene.add(target);
  light.target = target;

  const beamMaterial = new THREE.MeshBasicMaterial({
    color: color,
    transparent: true,
    opacity: 0.055,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide
  });
  const beam = new THREE.Mesh(
    new THREE.ConeGeometry(2.4, 8.4, 32, 1, true),
    beamMaterial
  );
  beam.position.set(0, -4.2, 0);
  light.add(beam);

  sweepers.push({
    light: light,
    target: target,
    beam: beam,
    x: x,
    z: z,
    phase: phase,
    color: color
  });
}

const hazePuffs = [];
function makeHaze(x, y, z, sx, sy, sz, material, phase) {

  );

  puff.userData.baseY = y;
  puff.userData.baseZ = z;
  puff.userData.phase = phase;
  scene.add(puff);
  hazePuffs.push(puff);
}

const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  elapsed += delta;

  controls.update();

  for (let sweepIndex = 0; sweepIndex < sweepers.length; sweepIndex++) {
    const sweeper = sweepers[sweepIndex];
    const swing = Math.sin(elapsed * 0.32 + sweeper.phase);
    const depthSwing = Math.cos(elapsed * 0.21 + sweeper.phase) * 1.3;
    const targetX = swing * 4.8;
    const targetZ = -2.4 + depthSwing;
    sweeper.target.position.set(targetX, 0.3, targetZ);

    const direction = new THREE.Vector3(
      sweeper.light.position.x - targetX,
      sweeper.light.position.y - 0.3,
      sweeper.light.position.z - targetZ
    ).normalize();
    sweeper.beam.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      direction
    );
    sweeper.beam.material.opacity = 0.042 + (Math.sin(elapsed * 1.8 + sweeper.phase) + 1) * 0.011;
  }

  const tables = [tableA, tableB, tableC, tableD];
  for (let tableIndex = 0; tableIndex < tables.length; tableIndex++) {
    const table = tables[tableIndex];
    const pulse = 1 + Math.sin(elapsed * 3.2 + table.userData.phase) * 0.08;
    table.userData.lamp.scale.set(1, 1.25 * pulse, 1);
    table.userData.light.intensity = 0.43 + pulse * 0.16;
  }

  curtainLeft.rotation.z = Math.sin(elapsed * 0.33 + curtainLeft.userData.phase) * 0.008;
  curtainRight.rotation.z = Math.sin(elapsed * 0.31 + curtainRight.userData.phase) * 0.008;
  valance.rotation.z = Math.sin(elapsed * 0.26) * 0.004;

  for (let hazeIndex = 0; hazeIndex < hazePuffs.length; hazeIndex++) {
    const puff = hazePuffs[hazeIndex];
    const phase = puff.userData.phase;
    puff.position.x = puff.userData.baseX + Math.sin(elapsed * 0.11 + phase) * 0.55;
    puff.position.y = puff.userData.baseY + Math.sin(elapsed * 0.17 + phase) * 0.18;
    puff.position.z = puff.userData.baseZ + Math.cos(elapsed * 0.13 + phase) * 0.28;
    const hazeScale = 1 + Math.sin(elapsed * 0.22 + phase) * 0.08;
    puff.scale.multiplyScalar(1 / Math.max(0.92, hazeScale));
    puff.scale.multiplyScalar(hazeScale);
  }

  for (let dustIndex = 0; dustIndex < dust.length; dustIndex++) {
    const particle = dust[dustIndex];
    particle.position.y += delta * particle.userData.speed;
    particle.position.x += Math.sin(elapsed * 0.25 + particle.userData.phase) * delta * 0.12;
    if (particle.position.y > 8.1) {
      particle.position.y = 1.0;
      particle.position.x = rand(-8, 8);
    }
  }

  const bassStrings = scene.getObjectByName("");
  const microphone = scene.children.find(function(child) {
    return child.userData && child.userData.head;
  });
  if (microphone) {
    microphone.userData.head.rotation.y = Math.sin(elapsed * 0.42) * 0.025;
    microphone.userData.head.rotation.z = -0.08 + Math.sin(elapsed * 0.3) * 0.012;
  }

  const drumGroups = scene.children.filter(function(child) {
    return child.userData && child.userData.cymbals;
  });
  for (let drumIndex = 0; drumIndex < drumGroups.length; drumIndex++) {
    const cymbals = drumGroups[drumIndex].userData.cymbals;
    cymbals[0].rotation.y = Math.sin(elapsed * 0.85) * 0.035;
    cymbals[1].rotation.y = Math.cos(elapsed * 0.72) * 0.04;
    cymbals[0].rotation.z += delta * 0.08;
    cymbals[1].rotation.z -= delta * 0.065;
  }

  renderer.render(scene, camera);
}

window.addEventListener("resize", function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
