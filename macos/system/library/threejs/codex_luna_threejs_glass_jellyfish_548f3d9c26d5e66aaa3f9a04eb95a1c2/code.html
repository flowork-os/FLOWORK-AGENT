<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glass Jellyfish</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #03191d;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03191d);
scene.fog = new THREE.FogExp2(0x03191d, 0.045);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.2, 1.2, 7.4);
camera.lookAt(0, -0.55, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 4.8;
controls.maxDistance = 12;
controls.target.set(0, -0.55, 0);

const aquaGlass = new THREE.MeshPhysicalMaterial({
  color: 0x9cebe5,
  metalness: 0.02,
  roughness: 0.08,
  transmission: 0.92,
  thickness: 0.65,
  ior: 1.46,
  transparent: true,
  opacity: 0.72,
  side: THREE.DoubleSide,
  attenuationColor: new THREE.Color(0x4acfc9),
  attenuationDistance: 3.8,
  envMapIntensity: 1.8
});

const roseGlass = new THREE.MeshPhysicalMaterial({
  color: 0xffadc7,
  metalness: 0.02,
  roughness: 0.1,
  transmission: 0.9,
  thickness: 0.42,
  ior: 1.45,
  transparent: true,
  opacity: 0.7,
  side: THREE.DoubleSide,
  attenuationColor: new THREE.Color(0xf26f9e),
  attenuationDistance: 3.2,
  envMapIntensity: 1.7
});

const luminousAqua = new THREE.MeshPhysicalMaterial({
  color: 0x8df4ee,
  emissive: 0x36aaa5,
  emissiveIntensity: 1.4,
  roughness: 0.12,
  transmission: 0.55,
  thickness: 0.3,
  transparent: true,
  opacity: 0.8
});

const luminousRose = new THREE.MeshPhysicalMaterial({
  color: 0xffabc6,
  emissive: 0xa72d62,
  emissiveIntensity: 1.25,
  roughness: 0.14,
  transmission: 0.5,
  thickness: 0.22,
  transparent: true,
  opacity: 0.78
});

const jellyfish = new THREE.Group();
scene.add(jellyfish);

const bellProfile = [
  new THREE.Vector2(0.0, 1.7),
  new THREE.Vector2(0.28, 1.68),
  new THREE.Vector2(0.62, 1.56),
  new THREE.Vector2(0.96, 1.32),
  new THREE.Vector2(1.28, 0.98),
  new THREE.Vector2(1.5, 0.58),
  new THREE.Vector2(1.61, 0.23),
  new THREE.Vector2(1.58, 0.08),
  new THREE.Vector2(1.38, 0.035),
  new THREE.Vector2(0.82, 0.02),
  new THREE.Vector2(0.0, 0.02)
];
const bell = new THREE.Mesh(new THREE.LatheGeometry(bellProfile, 96), aquaGlass);
bell.castShadow = true;
bell.receiveShadow = true;
jellyfish.add(bell);

const underside = new THREE.Mesh(
  new THREE.SphereGeometry(1.3, 64, 24, 0, Math.PI * 2, Math.PI * 0.5, Math.PI * 0.48),
  luminousAqua
);
underside.scale.set(1, 0.24, 1);
underside.position.y = 0.06;
jellyfish.add(underside);

const rim = new THREE.Mesh(
  new THREE.TorusGeometry(1.53, 0.065, 16, 128),
  roseGlass
);
rim.rotation.x = Math.PI * 0.5;
rim.position.y = 0.09;
jellyfish.add(rim);

for (let i = 0; i < 18; i++) {
  const angle = (i / 18) * Math.PI * 2;
  const ridge = new THREE.Mesh(
    new THREE.TorusGeometry(1.51 + (i % 2) * 0.025, 0.018, 8, 48),
    i % 3 === 0 ? luminousRose : roseGlass
  );
  ridge.rotation.x = Math.PI * 0.5;
  ridge.rotation.z = angle * 0.025;
  ridge.position.y = 0.095 + Math.sin(angle * 3) * 0.012;
  ridge.scale.set(1, 1 + Math.sin(angle * 2) * 0.025, 1);
  jellyfish.add(ridge);
}

const bellGlow = new THREE.Mesh(
  new THREE.SphereGeometry(0.72, 48, 32),
  new THREE.MeshBasicMaterial({
    color: 0x74e8df,
    transparent: true,
    opacity: 0.075,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
bellGlow.scale.set(1.15, 1.35, 1.15);
bellGlow.position.y = 0.95;
jellyfish.add(bellGlow);

function makeTube(points, radius, material, tubularSegments = 44) {
  const curve = new THREE.CatmullRomCurve3(points);
  curve.curveType = "centripetal";
  curve.tension = 0.38;
  const mesh = new THREE.Mesh(
    new THREE.TubeGeometry(curve, tubularSegments, radius, 12, false),
    material
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  jellyfish.add(mesh);
  return mesh;
}

const tentacleCount = 22;
for (let i = 0; i < tentacleCount; i++) {
  const angle = (i / tentacleCount) * Math.PI * 2;
  const radius = 0.2 + (i % 5) * 0.18;
  const length = 2.45 + (i % 6) * 0.23;
  const phase = i * 1.71;
  const points = [];
  for (let j = 0; j < 11; j++) {
    const t = j / 10;
    const y = 0.02 - t * length;
    const outward = radius + t * (0.35 + (i % 4) * 0.12);
    const curl = Math.sin(t * 4.5 + phase) * (0.08 + t * 0.2);
    const twist = Math.cos(t * 3.2 + phase * 0.7) * (0.08 + t * 0.12);
    points.push(new THREE.Vector3(
      Math.cos(angle) * outward + Math.cos(angle + Math.PI * 0.5) * curl,
      y,
      Math.sin(angle) * outward + Math.sin(angle + Math.PI * 0.5) * curl + twist
    ));
  }
  makeTube(points, 0.018 + (i % 4) * 0.006, i % 4 === 0 ? roseGlass : aquaGlass, 42);
}

const armCount = 10;
for (let i = 0; i < armCount; i++) {
  const angle = (i / armCount) * Math.PI * 2 + 0.12;
  const points = [];
  for (let j = 0; j < 13; j++) {
    const t = j / 12;
    const y = -0.03 - t * (1.45 + (i % 3) * 0.18);
    const outward = 0.13 + t * (0.36 + (i % 2) * 0.16);
    const sway = Math.sin(t * 8 + i * 0.8) * (0.025 + t * 0.11);
    points.push(new THREE.Vector3(
      Math.cos(angle) * outward + Math.cos(angle + Math.PI * 0.5) * sway,
      y,
      Math.sin(angle) * outward + Math.sin(angle + Math.PI * 0.5) * sway
    ));
  }
  makeTube(points, 0.045 - i * 0.0015, i % 2 ? luminousRose : luminousAqua, 36);
}

const oralCore = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.36, 4),
  luminousRose
);
oralCore.scale.set(0.9, 0.65, 0.9);
oralCore.position.y = -0.12;
jellyfish.add(oralCore);

for (let i = 0; i < 9; i++) {
  const angle = i / 9 * Math.PI * 2;
  const node = new THREE.Mesh(
    new THREE.SphereGeometry(0.085 + (i % 2) * 0.025, 20, 16),
    i % 2 ? luminousRose : luminousAqua
  );
  node.position.set(Math.cos(angle) * 0.3, -0.27 - (i % 3) * 0.07, Math.sin(angle) * 0.3);
  node.scale.y = 1.4;
  jellyfish.add(node);
}

const halo = new THREE.Mesh(
  new THREE.TorusGeometry(1.73, 0.012, 8, 128),
  new THREE.MeshBasicMaterial({
    color: 0xff9fc1,
    transparent: true,
    opacity: 0.4,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
halo.rotation.x = Math.PI * 0.5;
halo.position.y = 0.11;
jellyfish.add(halo);

const hemi = new THREE.HemisphereLight(0x9ffaf2, 0x071b2a, 2.3);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xc4fff9, 3.2);
keyLight.position.set(4, 7, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 20;
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -5;
scene.add(keyLight);

const roseLight = new THREE.PointLight(0xff568f, 5.5, 7, 2);
roseLight.position.set(-2.1, 0.7, 1.4);
scene.add(roseLight);

const aquaLight = new THREE.PointLight(0x39e7e0, 5.5, 8, 2);
aquaLight.position.set(2.1, -0.8, 1.8);
scene.add(aquaLight);

const frontLight = new THREE.PointLight(0xffffff, 1.6, 10, 2);
frontLight.position.set(0, 2.5, 4);
scene.add(frontLight);

const causticRings = new THREE.Group();
jellyfish.add(causticRings);
for (let i = 0; i < 7; i++) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(0.28 + i * 0.16, 0.008 + (6 - i) * 0.001, 8, 64),
    new THREE.MeshBasicMaterial({
      color: i % 2 ? 0xff94ba : 0x64e9df,
      transparent: true,
      opacity: 0.12,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    })
  );
  ring.rotation.x = Math.PI * 0.5;
  ring.rotation.z = i * 0.48;
  ring.position.y = 0.27 - i * 0.055;
  ring.scale.set(1, 0.58 + i * 0.035, 1);
  causticRings.add(ring);
}

function animate(time) {
  const seconds = time * 0.001;
  jellyfish.position.y = Math.sin(seconds * 0.7) * 0.08;
  jellyfish.rotation.z = Math.sin(seconds * 0.34) * 0.025;
  causticRings.rotation.y = seconds * 0.22;
  causticRings.rotation.x = Math.sin(seconds * 0.5) * 0.08;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

requestAnimationFrame(animate);
</script>
</body>
</html>
