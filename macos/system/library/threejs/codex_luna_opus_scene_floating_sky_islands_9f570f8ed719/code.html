<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floating Sky Islands</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8ed8f2}
canvas{display:block}
#hint{position:fixed;left:18px;bottom:16px;color:rgba(255,255,255,.82);font:12px Georgia,serif;letter-spacing:.08em;text-shadow:0 2px 5px #39799a;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hint">FLOATING ISLES · DRAG TO EXPLORE</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x9bdcf1, 0.0018);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 900);
camera.position.set(29, 19, 33);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .045;
controls.autoRotate = true;
controls.autoRotateSpeed = .32;
controls.minDistance = 18;
controls.maxDistance = 78;
controls.maxPolarAngle = Math.PI * .48;

const rand = (() => {
  let s = 184763;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
})();
const range = (a,b) => a + (b-a)*rand();
const pick = a => a[Math.floor(rand()*a.length)];
const groups = {water:[], clouds:[], birds:[], props:[]};

const mat = (color, rough=.8, metal=0) => new THREE.MeshStandardMaterial({
  color, roughness:rough, metalness:metal
});
const grass = mat(0x75b94e);
const grassLight = mat(0xa4d56b);
const soil = mat(0x795237);
const rock = mat(0x5e6870);
const rockLight = mat(0x89949a);
const moss = mat(0x598c48);
const wood = mat(0x75492e);
const woodLight = mat(0xa97648);
const water = new THREE.MeshPhongMaterial({
  color:0x66d9f3, transparent:true, opacity:.72, shininess:120,
  side:THREE.DoubleSide
});
const cloudMat = new THREE.MeshLambertMaterial({color:0xffffff, transparent:true, opacity:.84});
const gold = mat(0xf5c65b, .4, .2);
const dark = mat(0x34414e);
const white = mat(0xfff7dd);
const red = mat(0xc85b4d);

const hemi = new THREE.HemisphereLight(0xd8f7ff, 0x52748d, 2.2);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff1cb, 4.2);
sun.position.set(-28, 45, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = -58;
sun.shadow.camera.right = 58;
sun.shadow.camera.top = 58;
sun.shadow.camera.bottom = -34;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 140;
sun.shadow.bias = -.0004;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x91d9ff, .8);
fill.position.set(35,18,-40);
scene.add(fill);

function makeSkyDome(){
  const geo = new THREE.SphereGeometry(390, 32, 20);
  const colors = new Uint8Array(256*3);
  for(let y=0;y<256;y++){
    const t=y/255;
    const c = new THREE.Color().lerpColors(new THREE.Color(0x5eb8e1), new THREE.Color(0xeafaff), t);
    colors[y*3]=c.r*255; colors[y*3+1]=c.g*255; colors[y*3+2]=c.b*255;
  }
  const cv=document.createElement('canvas'); cv.width=1; cv.height=256;
  const cx=cv.getContext('2d'), g=cx.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#4da8d7');g.addColorStop(.58,'#9cddf1');g.addColorStop(1,'#eefcff');
  cx.fillStyle=g;cx.fillRect(0,0,1,256);
  const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace;
  const m=new THREE.MeshBasicMaterial({map:tex,side:THREE.BackSide,depthWrite:false});
  const dome=new THREE.Mesh(geo,m); scene.add(dome);
}
makeSkyDome();

function rockChunk(x,y,z,sx,sy,sz, seed=1){
  const group=new THREE.Group();
  group.position.set(x,y,z);
  group.scale.set(sx,sy,sz);
  const upper = new THREE.Mesh(new THREE.CylinderGeometry(.82,1.06,.45,9),grass);
  upper.position.y=.12; upper.scale.y=.48;
  upper.castShadow=true; upper.receiveShadow=true; group.add(upper);
  const body = new THREE.Mesh(new THREE.ConeGeometry(.97,.95,9,3),soil);
  body.position.y=-.46; body.rotation.y=range(0,Math.PI);
  body.castShadow=true; body.receiveShadow=true; group.add(body);
  for(let i=0;i<8;i++){
    const a=(i/8)*Math.PI*2+range(-.2,.2);
    const rr=range(.25,.75);
    const b=new THREE.Mesh(new THREE.DodecahedronGeometry(range(.12,.26),0),pick([rock,rockLight,moss]));
    b.position.set(Math.cos(a)*rr,-range(.32,.75),Math.sin(a)*rr);
    b.rotation.set(range(0,3),range(0,3),range(0,3));
    b.castShadow=true; group.add(b);
  }
  for(let i=0;i<9;i++){
    const tuft=new THREE.Mesh(new THREE.ConeGeometry(.035,.18,4),grassLight);
    const a=range(0,Math.PI*2), r=range(.15,.75);
    tuft.position.set(Math.cos(a)*r,.39,Math.sin(a)*r);
    tuft.rotation.z=range(-.45,.45); tuft.castShadow=true; group.add(tuft);
  }
  scene.add(group);
  return group;
}

const island = rockChunk(0,9,0,10.4,3.2,7.5);
const east = rockChunk(15,6,-4,4.7,1.8,3.8);
const west = rockChunk(-15,4,-5,5.0,1.75,3.6);
const rear = rockChunk(4,3,-17,5.5,1.8,3.8);
const low = rockChunk(-5,-1,13,4.0,1.4,3.0);
const far = rockChunk(25,-1,-18,3.2,1.15,2.5);

function addWaterfall(x,y,z,h,w){
  const g=new THREE.Group();
  g.position.set(x,y,z);
  const sheet=new THREE.Mesh(new THREE.PlaneGeometry(w,h,8,20),water);
  sheet.position.y=-h/2; sheet.rotation.y=range(-.12,.12);
  sheet.castShadow=true; g.add(sheet);
  for(let i=0;i<3;i++){
    const strand=new THREE.Mesh(new THREE.CylinderGeometry(.035,.075,h*.72,7,10),water);
    strand.position.set((i-1)*w*.33,-h*.58,range(-.06,.06));
    g.add(strand);
  }
  const splash=new THREE.Mesh(new THREE.SphereGeometry(w*.72,.4+0.02,10,6),new THREE.MeshBasicMaterial({
    color:0xb9f5ff,transparent:true,opacity:.34
  }));
  splash.scale.y=.16;splash.position.y=-h+.06;g.add(splash);
  scene.add(g); groups.water.push(g);
}
addWaterfall(-6,8,1.8,7.0,1.7);
addWaterfall(7,8,-3.8,5.8,1.35);
addWaterfall(18,5,-4.7,3.9,1.1);
addWaterfall(-17,3,-5.7,3.5,1.25);
addWaterfall(-4,-2,14.1,2.8,.9);

function cube(size, material, pos, parent=scene){
  const m=new THREE.Mesh(new THREE.BoxGeometry(...size),material);
  m.position.set(...pos);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function cylinder(r1,r2,h,material,pos,parent=scene,segments=12){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material);
  m.position.set(...pos);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function makeCottage(){
  const g=new THREE.Group(); g.position.set(-1.7,10.0,.4);
  cube([3.9,2.35,3.0],woodLight,[0,1.22,0],g);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(2.85,2.05,4),red);
  roof.position.y=3.4; roof.rotation.y=Math.PI/4; roof.scale.z=.7;
  roof.castShadow=true;g.add(roof);
  cube([.75,1.25,.12],wood,[0,.63,1.56],g);
  cube([.62,.75,.12],white,[-1.17,1.55,1.55],g);
  cube([.62,.75,.12],white,[1.17,1.55,1.55],g);
  cube([.08,.75,.14],wood,[0,1.55,1.63],g);
  cube([.7,.12,.14],wood,[0,1.55,1.64],g);
  const chimney=cylinder(.28,.3,.95,rock,[1.08,3.82,-.35],g,8);
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(.38,.3,.13,8),rockLight);
  cap.position.set(1.08,4.31,-.35);cap.castShadow=true;g.add(cap);
  const doorKnob=new THREE.Mesh(new THREE.SphereGeometry(.06,8,6),gold);
  doorKnob.position.set(.18,.95,1.69);g.add(doorKnob);
  scene.add(g); groups.props.push(g);
}
makeCottage();

function makeWindmill(){
  const g=new THREE.Group(); g.position.set(3.1,10.2,-1.0);
  cylinder(.3,.46,4.9,woodLight,[0,2.45,0],g,10);
  const roof=new THREE.Mesh(new THREE.ConeGeometry(.65,.8,8),red);
  roof.position.y=5.05;roof.castShadow=true;g.add(roof);
  const hub=new THREE.Group();hub.position.set(0,4.3,.54);
  const axle=cylinder(.14,.14,.5,dark,[0,0,0],hub,10);axle.rotation.x=Math.PI/2;
  for(let i=0;i<4;i++){
    const blade=new THREE.Group(); blade.rotation.z=i*Math.PI/2;
    cube([.22,2.05,.12],woodLight,[0,1.05,0],blade);
    blade.rotation.y=.2;hub.add(blade);
  }
  const ball=new THREE.Mesh(new THREE.SphereGeometry(.23,12,8),gold);hub.add(ball);
  g.add(hub);scene.add(g);groups.props.push(hub);
}
makeWindmill();

function makeBridge(a,b){
  const g=new THREE.Group();
  const start=new THREE.Vector3(...a), end=new THREE.Vector3(...b);
  const length=start.distanceTo(end), mid=start.clone().add(end).multiplyScalar(.5);
  const dir=end.clone().sub(start).normalize();
  const across=new THREE.Vector3(-dir.z,0,dir.x).normalize();
  for(let i=0;i<13;i++){
    const t=i/12, p=start.clone().lerp(end,t);
    p.y-=Math.sin(t*Math.PI)*.5;
    const plank=cube([.65,.13,.92],woodLight,[0,0,0],g);
    plank.position.copy(p);plank.lookAt(p.clone().add(dir));plank.rotation.z=range(-.12,.12);
  }
  for(const side of [-1,1]){
    const pts=[];
    for(let i=0;i<18;i++){
      const t=i/17, p=start.clone().lerp(end,t);
      p.y+=.88-Math.sin(t*Math.PI)*.6;p.add(across.clone().multiplyScalar(side*.48));pts.push(p);
    }
    const curve=new THREE.CatmullRomCurve3(pts);
    const rope=new THREE.Mesh(new THREE.TubeGeometry(curve,32,.055,6),wood);
    rope.castShadow=true;g.add(rope);
  }
  scene.add(g);
}
makeBridge([-8.8,9.25,-.8],[-11.7,5.2,-4.2]);
makeBridge([8.6,9.2,-1.9],[12.1,6.3,-3.8]);
makeBridge([-2,9.25,6.0],[-3.8,-.3,11.8]);

function makeTree(x,y,z,s){
  const g=new THREE.Group();g.position.set(x,y,z);
  cylinder(.18*s,.26*s,1.5*s,wood,[0,.75*s,0],g,8);
  for(let i=0;i<4;i++){
    const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(.85*s,1),pick([grass,grassLight,moss]));
    crown.position.set(range(-.3,.3)*s,1.55*s+i*.22,range(-.25,.25)*s);
    crown.scale.set(1,range(.7,1.1),1);crown.castShadow=true;g.add(crown);
  }
  scene.add(g);
}
makeTree(-6.3,9.4,-3.0,1.2);
makeTree(5.4,9.3,2.9,.8);
makeTree(-13.8,4.65,-5.7,.9);
makeTree(15.7,6.0,-4.1,.65);

function makeRocks(){
  for(let i=0;i<18;i++){
    const a=range(0,Math.PI*2), r=range(18,35);
    const b=new THREE.Mesh(new THREE.DodecahedronGeometry(range(.35,1.3),0),pick([rock,rockLight,moss]));
    b.position.set(Math.cos(a)*r,range(-3,13),Math.sin(a)*r-5);
    b.rotation.set(range(0,6),range(0,6),range(0,6));
    b.castShadow=true;b.receiveShadow=true;scene.add(b);
  }
}
makeRocks();

function makeAirship(){
  const g=new THREE.Group();g.position.set(20,10,5);
  const balloon=new THREE.Mesh(new THREE.SphereGeometry(2.4,24,16),new THREE.MeshStandardMaterial({
    color:0xd88458,roughness:.72
  }));
  balloon.scale.set(1.65,.66,.66);balloon.castShadow=true;g.add(balloon);
  for(let i=0;i<3;i++){
    const band=new THREE.Mesh(new THREE.TorusGeometry(2.42,.035,6,32),gold);
    band.rotation.y=Math.PI/2;band.scale.set(1,.66,.66);band.position.x=(i-1)*1.6;g.add(band);
  }
  for(const x of [-1.4,1.4]){
    const rope=cylinder(.045,.045,2.0,wood,[x,-1.05,0],g,6);rope.rotation.z=.15;
  }
  const hull=new THREE.Mesh(new THREE.CapsuleGeometry(.68,2.25,6,12),woodLight);
  hull.rotation.z=Math.PI/2;hull.position.y=-2.0;hull.castShadow=true;g.add(hull);
  const cabin=cube([1.15,.7,1.0],wood,[0,-1.38,0],g);
  for(let x of [-.9,.9]) cylinder(.08,.08,.35,wood,[x,-1.05,0],g,6).rotation.z=Math.PI/2;
  const prop=new THREE.Group();prop.position.set(1.5,-2,0);
  cylinder(.07,.07,.35,dark,[0,0,0],prop,8).rotation.z=Math.PI/2;
  for(let i=0;i<3;i++){const bl=cube([.08,.72,.08],gold,[0,0,0],prop);bl.rotation.z=i*Math.PI*2/3}
  g.add(prop);scene.add(g);groups.props.push(g,prop);
}
makeAirship();

function makePost(){
  const g=new THREE.Group();g.position.set(8.0,9.7,3.0);
  cylinder(.16,.22,1.8,wood,[0,.9,0],g,8);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(.35,.045,6,18),gold);
  ring.rotation.x=Math.PI/2;ring.position.y=1.52;g.add(ring);
  scene.add(g);
}
makePost();

function makeCloud(x,y,z,s){
  const g=new THREE.Group();g.position.set(x,y,z);g.scale.setScalar(s);
  for(let i=0;i<7;i++){
    const puff=new THREE.Mesh(new THREE.SphereGeometry(range(1.2,2.1),16,10),cloudMat);
    puff.position.set((i-3)*1.25+range(-.3,.3),range(-.3,.4),range(-.45,.45));
    puff.scale.y=range(.45,.8);puff.castShadow=true;g.add(puff);
  }
  const shadow=new THREE.Mesh(new THREE.CircleGeometry(3.4,32),new THREE.MeshBasicMaterial({
    color:0x699ab1,transparent:true,opacity:.08,depthWrite:false
  }));
  shadow.rotation.x=-Math.PI/2;shadow.position.y=-1.15;g.add(shadow);
  scene.add(g);groups.clouds.push(g);
}
makeCloud(-22,20,-10,1.8);
makeCloud(20,23,-12,1.45);
makeCloud(4,25,15,1.8);
makeCloud(-30,14,18,1.1);

function makeBird(){
  const g=new THREE.Group();
  const wingMat=new THREE.MeshBasicMaterial({color:0x344f5d,side:THREE.DoubleSide});
  const body=new THREE.Mesh(new THREE.SphereGeometry(.13,8,6),wingMat);g.add(body);
  const wing1=new THREE.Mesh(new THREE.ConeGeometry(.06,.65,3),wingMat);
  wing1.rotation.z=Math.PI/2;wing1.position.x=-.3;g.add(wing1);
  const wing2=wing1.clone();wing2.position.x=.3;g.add(wing2);
  scene.add(g);groups.birds.push({g,phase:range(0,6),radius:range(17,25),speed:range(.12,.22),height:range(0,8)});
}
for(let i=0;i<9;i++)makeBird();

function makeMist(){
  const m=new THREE.Group();
  for(let i=0;i<20;i++){
    const p=new THREE.Mesh(new THREE.SphereGeometry(range(.4,1.2),12,8),new THREE.MeshBasicMaterial({
      color:0xdff9ff,transparent:true,opacity:range(.035,.11),depthWrite:false
    }));
    p.position.set(range(-20,21),range(-3,4),range(-14,15));
    p.scale.y=.35;m.add(p);
  }
  scene.add(m);return m;
}
const mist=makeMist();

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  groups.water.forEach((g,i)=>{
    g.children.forEach((o,j)=>{
      if(o.geometry.type==='PlaneGeometry')o.position.x=Math.sin(t*2.4+i)*.055;
      if(o.geometry.type==='CylinderGeometry')o.scale.x=1+Math.sin(t*3+j)*.12;
    });
  });
  groups.clouds.forEach((g,i)=>{
    g.position.x+=.004+(i%2)*.002;
    if(g.position.x>38)g.position.x=-38;
    g.rotation.y=Math.sin(t*.12+i)*.015;
  });
  groups.birds.forEach((b,i)=>{
    const a=t*b.speed+b.phase;
    b.g.position.set(Math.cos(a)*b.radius,b.height+Math.sin(a*2)*1.3,Math.sin(a)*b.radius-5);
    b.g.rotation.y=-a+Math.PI/2;
    b.g.children[1].rotation.y=Math.sin(t*7+i)*.35;
    b.g.children[2].rotation.y=-Math.sin(t*7+i)*.35;
  });
  groups.props.forEach((p,i)=>{
    if(i<3)p.rotation.z+=.012;
    if(i===3){p.position.y=10+Math.sin(t*.8)*.25;p.rotation.z=Math.sin(t*.6)*.025}
  });
  mist.position.x=Math.sin(t*.07)*2;
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
