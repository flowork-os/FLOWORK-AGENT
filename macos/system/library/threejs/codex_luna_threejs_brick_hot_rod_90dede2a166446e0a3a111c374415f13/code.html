<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Hot Rod</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11131a}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10131b);
scene.fog = new THREE.Fog(0x10131b, 28, 55);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(13, 8.5, 15);
camera.lookAt(0, 2.2, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.target.set(0, 2.1, 0);
controls.minDistance = 10;
controls.maxDistance = 27;

const red = new THREE.MeshStandardMaterial({color:0xc71924, metalness:.16, roughness:.28});
const darkRed = new THREE.MeshStandardMaterial({color:0x76101a, metalness:.1, roughness:.33});
const black = new THREE.MeshStandardMaterial({color:0x090b0e, metalness:.1, roughness:.3});
const tireMat = new THREE.MeshStandardMaterial({color:0x050608, metalness:.02, roughness:.72});
const chrome = new THREE.MeshStandardMaterial({color:0xdce5ea, metalness:.9, roughness:.16});
const yellow = new THREE.MeshStandardMaterial({color:0xffbd18, metalness:.08, roughness:.3});
const orange = new THREE.MeshStandardMaterial({color:0xf05b16, metalness:.08, roughness:.3});
const glass = new THREE.MeshStandardMaterial({color:0x101b2a, metalness:.45, roughness:.12, transparent:true, opacity:.82});
const silver = new THREE.MeshStandardMaterial({color:0x85919b, metalness:.82, roughness:.24});
const brass = new THREE.MeshStandardMaterial({color:0xb86b25, metalness:.65, roughness:.27});

function addBox(parent, x,y,z, sx,sy,sz, material, bevel=false) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz), material);
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function addStud(parent,x,y,z,material=red,r=.13,h=.12) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),material);
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function studs(parent, x0,x1,z0,z1,y,material=red,step=.48) {
  for(let x=x0;x<=x1+.01;x+=step) for(let z=z0;z<=z1+.01;z+=step) addStud(parent,x,y,z,material);
}
function cylinder(parent, radius, depth, x,y,z, material, rotation=[0,0,0], segments=24) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,depth,segments),material);
  mesh.position.set(x,y,z);
  mesh.rotation.set(...rotation);
  mesh.castShadow=true; mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

const car = new THREE.Group();
car.position.y = .25;
scene.add(car);

addBox(car,0,1.12,0,10.4,1.0,4.25,black);
addBox(car,-.15,1.72,0,9.65,.62,3.82,red);
addBox(car,.85,2.22,0,7.8,.62,3.48,red);
addBox(car,-3.85,2.03,0,2.1,1.1,3.8,darkRed);
addBox(car,3.55,2.02,0,2.45,1.08,3.8,red);

addBox(car,.15,2.72,0,5.85,.5,3.15,black);
addBox(car,-.45,3.03,0,4.65,.38,2.92,red);
addBox(car,-2.75,2.98,0,1.4,.35,3.25,red);
addBox(car,2.72,2.76,0,1.25,.45,3.2,black);

addBox(car,-1.45,3.36,0,2.6,.24,2.52,red);
addBox(car,-1.55,3.55,0,2.05,.18,2.1,black);
addBox(car,-2.62,3.4,0,1.1,.22,2.65,red);
addBox(car,2.2,3.12,0,1.5,.28,2.85,red);

for(const z of [-1.72,1.72]) {
  addBox(car,-1.3,3.28,z,2.35,.32,.34,red);
  addBox(car,1.65,3.0,z,1.9,.34,.34,red);
  studs(car,-2.25,-.45,z-.12,z+.12,3.48,red,.48);
  studs(car,.75,2.55,z-.12,z+.12,3.2,red,.48);
}
studs(car,-4.55,4.5,-1.55,1.55,2.05,red,.48);
studs(car,-3.9,3.9,-1.25,1.25,3.02,red,.48);
studs(car,-2.1,.7,-.95,.95,3.7,black,.48);

for(const z of [-2.05,2.05]) {
  const fender = new THREE.Mesh(new THREE.TorusGeometry(1.48,.22,10,32,Math.PI),red);
  fender.position.set(2.45,1.85,z);
  fender.rotation.set(Math.PI/2,0,Math.PI/2);
  fender.scale.set(1.25,1,1);
  fender.castShadow=true;
  car.add(fender);
}

function wheel(x,z,radius,width) {
  cylinder(car,radius,width,x,1.48,z,tireMat,[Math.PI/2,0,0],32);
  cylinder(car,radius*.67,width+.05,x,1.48,z,black,[Math.PI/2,0,0],32);
  cylinder(car,radius*.39,width+.1,x,1.48,z,chrome,[Math.PI/2,0,0],24);
  cylinder(car,radius*.2,width+.13,x,1.48,z,black,[Math.PI/2,0,0],20);
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    addBox(car,x+Math.cos(a)*radius*.28,1.48+Math.sin(a)*radius*.28,z, .11,.11,width+.16,chrome);
  }
}
wheel(2.65,-2.13,1.62,.72);
wheel(2.65,2.13,1.62,.72);
wheel(-3.25,-1.93,1.13,.56);
wheel(-3.25,1.93,1.13,.56);

for(const z of [-2.25,2.25]) {
  addBox(car,1.5,2.2,z,4.3,.28,.24,chrome);
  addBox(car,1.65,1.82,z,3.4,.22,.2,chrome);
  for(let x=0;x<3;x++) cylinder(car,.18,.42,.1+x*.95,2.2,z,chrome,[Math.PI/2,0,0],20);
  for(let x=0;x<3;x++) cylinder(car,.15,.34,.25+x*.95,1.82,z,chrome,[Math.PI/2,0,0],20);
}

addBox(car,-.1,4.05,0,1.7,1.25,1.58,brass);
addBox(car,-.1,4.74,0,1.4,.25,1.4,black);
for(let z=-.58;z<=.58;z+=.38) for(let x=-.62;x<=.42;x+=.38) addStud(car,x,4.72,z,brass,.105,.13);
for(const z of [-.92,.92]) {
  cylinder(car,.19,1.65,-.1,4.45,z,chrome,[Math.PI/2,0,0],20);
  cylinder(car,.12,1.82,-.1,4.45,z,black,[Math.PI/2,0,0],20);
}
for(const x of [-.55,.35]) {
  cylinder(car,.22,.45,x,5.18,0,red,[0,0,0],20);
  addBox(car,x,5.45,0,.18,.5,.18,chrome);
}
addBox(car,.8,4.22,0,.6,.9,1.2,black);
for(let z=-.42;z<=.42;z+=.42) cylinder(car,.11,1.35,.8,4.24,z,chrome,[Math.PI/2,0,0],16);

function sideFlame(z, flip) {
  const shape = new THREE.Shape();
  shape.moveTo(-4.55,2.02);
  shape.lineTo(-3.55,2.12);
  shape.lineTo(-2.85,2.42);
  shape.lineTo(-3.22,2.72);
  shape.lineTo(-2.0,2.5);
  shape.lineTo(-2.42,3.05);
  shape.lineTo(-1.05,2.58);
  shape.lineTo(-1.45,3.18);
  shape.lineTo(-.15,2.52);
  shape.lineTo(-.72,2.12);
  shape.lineTo(-1.82,1.98);
  shape.lineTo(-3.0,1.9);
  shape.closePath();
  const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape),yellow);
  mesh.position.z=z;
  mesh.scale.x=flip?-1:1;
  mesh.castShadow=true;
  car.add(mesh);
  const inner = mesh.clone();
  inner.material=orange;
  inner.scale.set((flip?-1:1)*.72,.64,1);
  inner.position.set(flip?-.3:.3,z?2.0:0,z);
  car.add(inner);
}
sideFlame(1.94,false);
sideFlame(-1.94,true);

for(const z of [-1.7,1.7]) {
  for(let i=0;i<7;i++) addStud(car,-4.3+i*.58,2.22,z, yellow,.105,.1);
  for(let i=0;i<5;i++) addStud(car,-2.8+i*.58,2.62,z, orange,.1,.1);
}

for(const z of [-1.55,1.55]) {
  addBox(car,-4.85,2.32,z,.22,.72,.5,chrome);
  cylinder(car,.32,.18,-4.98,2.35,z,chrome,[0,Math.PI/2,0],24);
}
for(const z of [-1.48,1.48]) {
  cylinder(car, .38, .2, -4.55, 3.05, z, yellow, [Math.PI/2,0,0], 24);
  cylinder(car, .24, .21, -4.55, 3.05, z, chrome, [Math.PI/2,0,0], 24);
}
addBox(car,-4.98,1.25,0,.28,.55,2.3,chrome);

addBox(car,0,2.15,-1.93,2.2,.42,.16,black);
addBox(car,0,2.15,1.93,2.2,.42,.16,black);

const ground = new THREE.Mesh(
  new THREE.CylinderGeometry(18,18,.35,64),
  new THREE.MeshStandardMaterial({color:0x20242d,roughness:.9})
);
ground.position.y=-.05;
ground.receiveShadow=true;
scene.add(ground);

const ring = new THREE.Mesh(
  new THREE.TorusGeometry(6.5,.035,8,96),
  new THREE.MeshBasicMaterial({color:0xb3202b,transparent:true,opacity:.35})
);
ring.rotation.x=Math.PI/2;
ring.position.y=.14;
scene.add(ring);

scene.add(new THREE.HemisphereLight(0x9fb8e8,0x160c0b,2.0));
const key = new THREE.DirectionalLight(0xffe0c1,4.2);
key.position.set(-7,13,10);
key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-15; key.shadow.camera.right=15;
key.shadow.camera.top=15; key.shadow.camera.bottom=-15;
scene.add(key);
const rim = new THREE.PointLight(0xd33b45,18,22,2);
rim.position.set(7,6,-8);
scene.add(rim);
const fill = new THREE.PointLight(0x4b74ff,10,18,2);
fill.position.set(-8,4,7);
scene.add(fill);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
