<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harbor Docks at Evening</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101820; }
    canvas { display: block; }
    #caption {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(255, 239, 211, 0.82);
      font: 12px/1.5 Georgia, serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 2px 8px #000;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="caption">Harbor Docks · Golden Hour</div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd58d65);
    scene.fog = new THREE.FogExp2(0xc18b70, 0.0115);

    const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 350);
    camera.position.set(47, 27, 47);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 5, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.22;
    controls.minDistance = 25;
    controls.maxDistance = 105;
    controls.maxPolarAngle = Math.PI * 0.48;

    let seed = 736421;
    function random() {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    const range = (a, b) => a + (b - a) * random();

    function canvasTexture(size, painter, repeatX = 1, repeatY = 1) {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext("2d");
      painter(ctx, size);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(repeatX, repeatY);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return tex;
    }

    const woodTex = canvasTexture(512, (c, s) => {
      c.fillStyle = "#66503c";
      c.fillRect(0, 0, s, s);
      for (let y = 0; y < s; y += 64) {
        const g = c.createLinearGradient(0, y, 0, y + 60);
        g.addColorStop(0, "#725a42");
        g.addColorStop(0.5, "#594534");
        g.addColorStop(1, "#70563f");
        c.fillStyle = g;
        c.fillRect(0, y + 2, s, 58);
        c.fillStyle = "rgba(20,13,8,.5)";
        c.fillRect(0, y, s, 3);
        for (let i = 0; i < 35; i++) {
          c.strokeStyle = `rgba(35,24,16,${range(.03, .12)})`;
          c.beginPath();
          const yy = y + range(8, 55);
          c.moveTo(range(0, 80), yy);
          c.bezierCurveTo(180, yy + range(-8, 8), 330, yy + range(-6, 6), 512, yy);
          c.stroke();
        }
      }
    }, 5, 1);

    const metalTex = canvasTexture(256, (c, s) => {
      c.fillStyle = "#728087";
      c.fillRect(0, 0, s, s);
      for (let x = 0; x < s; x += 18) {
        const g = c.createLinearGradient(x, 0, x + 18, 0);
        g.addColorStop(0, "#56636a");
        g.addColorStop(.45, "#89949a");
        g.addColorStop(1, "#4c5a60");
        c.fillStyle = g;
        c.fillRect(x, 0, 18, s);
      }
      for (let i = 0; i < 130; i++) {
        c.fillStyle = `rgba(93,47,25,${range(.04, .19)})`;
        c.beginPath();
        c.arc(range(0, s), range(0, s), range(1, 6), 0, Math.PI * 2);
        c.fill();
      }
    }, 3, 2);

    const waterTex = canvasTexture(512, (c, s) => {
      const g = c.createLinearGradient(0, 0, 0, s);
      g.addColorStop(0, "#315e68");
      g.addColorStop(1, "#173e4b");
      c.fillStyle = g;
      c.fillRect(0, 0, s, s);
      for (let i = 0; i < 400; i++) {
        c.strokeStyle = `rgba(255,194,124,${range(.015, .14)})`;
        c.lineWidth = range(.5, 2.5);
        c.beginPath();
        const x = range(0, s), y = range(0, s);
        c.moveTo(x, y);
        c.lineTo(x + range(6, 42), y + range(-2, 2));
        c.stroke();
      }
    }, 8, 8);

    const crateTex = canvasTexture(256, (c, s) => {
      c.fillStyle = "#785132";
      c.fillRect(0, 0, s, s);
      for (let i = 0; i < 130; i++) {
        c.fillStyle = `rgba(32,20,12,${range(.025, .12)})`;
        c.fillRect(range(0, s), range(0, s), range(1, 4), range(3, 24));
      }
      c.strokeStyle = "rgba(30,18,10,.35)";
      c.lineWidth = 7;
      c.strokeRect(7, 7, s - 14, s - 14);
      c.beginPath();
      c.moveTo(10, 10); c.lineTo(s - 10, s - 10);
      c.moveTo(s - 10, 10); c.lineTo(10, s - 10);
      c.stroke();
    });

    const ropeMat = new THREE.MeshStandardMaterial({ color: 0x8d7654, roughness: 1 });
    const darkMetal = new THREE.MeshStandardMaterial({ color: 0x252d2d, roughness: .7, metalness: .5 });
    const rustMat = new THREE.MeshStandardMaterial({ color: 0x6e3b25, roughness: .95, metalness: .2 });
    const pilingMat = new THREE.MeshStandardMaterial({ map: woodTex, color: 0x5b4b38, roughness: 1 });
    const dockMat = new THREE.MeshStandardMaterial({ map: woodTex, color: 0x8b765d, roughness: .92 });
    const warehouseMat = new THREE.MeshStandardMaterial({ map: metalTex, color: 0x899396, roughness: .82, metalness: .2 });
    const redPaint = new THREE.MeshStandardMaterial({ color: 0x783429, roughness: .8 });
    const creamPaint = new THREE.MeshStandardMaterial({ color: 0xd4c9ac, roughness: .76 });
    const bluePaint = new THREE.MeshStandardMaterial({ color: 0x315d69, roughness: .74 });
    const glassMat = new THREE.MeshStandardMaterial({
      color: 0x91c3cc, roughness: .2, metalness: .1, transparent: true, opacity: .65
    });

    function mesh(geometry, material, x = 0, y = 0, z = 0) {
      const m = new THREE.Mesh(geometry, material);
      m.position.set(x, y, z);
      m.castShadow = true;
      m.receiveShadow = true;
      return m;
    }

    function cylinder(r1, r2, h, mat, x, y, z, segments = 12) {
      return mesh(new THREE.CylinderGeometry(r1, r2, h, segments), mat, x, y, z);
    }

    function box(w, h, d, mat, x, y, z) {
      return mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z);
    }

    function ropeCurve(points, radius = .055, material = ropeMat) {
      const curve = new THREE.CatmullRomCurve3(points);
      const tube = mesh(new THREE.TubeGeometry(curve, 36, radius, 6, false), material);
      return tube;
    }

    const hemi = new THREE.HemisphereLight(0xfbd6a4, 0x243942, 1.7);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffb36f, 4.2);
    sun.position.set(-48, 42, -55);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -65;
    sun.shadow.camera.right = 65;
    sun.shadow.camera.top = 55;
    sun.shadow.camera.bottom = -45;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 160;
    sun.shadow.bias = -0.0003;
    scene.add(sun);

    const rim = new THREE.DirectionalLight(0x7fa8c6, 1.1);
    rim.position.set(35, 25, 40);
    scene.add(rim);

    const skyGeo = new THREE.SphereGeometry(190, 32, 16);
    const skyMat = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      uniforms: {
        topColor: { value: new THREE.Color(0x697b9b) },
        middleColor: { value: new THREE.Color(0xd18a68) },
        bottomColor: { value: new THREE.Color(0xf4ba72) }
      },
      vertexShader: `
        varying vec3 vWorld;
        void main() {
          vec4 w = modelMatrix * vec4(position, 1.0);
          vWorld = w.xyz;
          gl_Position = projectionMatrix * viewMatrix * w;
        }
      `,
      fragmentShader: `
        varying vec3 vWorld;
        uniform vec3 topColor;
        uniform vec3 middleColor;
        uniform vec3 bottomColor;
        void main() {
          float h = normalize(vWorld).y;
          vec3 c = mix(bottomColor, middleColor, smoothstep(-0.08, 0.2, h));
          c = mix(c, topColor, smoothstep(0.2, 0.85, h));
          gl_FragColor = vec4(c, 1.0);
        }
      `
    });
    scene.add(new THREE.Mesh(skyGeo, skyMat));

    const sunDisc = mesh(
      new THREE.CircleGeometry(5.2, 48),
      new THREE.MeshBasicMaterial({ color: 0xffc477, fog: false }),
      -74, 19, -94
    );
    sunDisc.lookAt(camera.position);
    scene.add(sunDisc);

    const waterMat = new THREE.MeshPhysicalMaterial({
      map: waterTex,
      color: 0x3c7781,
      roughness: .28,
      metalness: .08,
      clearcoat: .7,
      clearcoatRoughness: .18,
      transparent: true,
      opacity: .96
    });
    const water = mesh(new THREE.PlaneGeometry(180, 180, 1, 1), waterMat, 0, -.15, 0);
    water.rotation.x = -Math.PI / 2;
    water.receiveShadow = true;
    scene.add(water);

    const dock = new THREE.Group();
    const deck = box(17, .75, 67, dockMat, 18, 2.1, 1);
    dock.add(deck);

    for (let z = -31; z <= 33; z += 4) {
      const seam = box(17.1, .05, .06, darkMetal, 18, 2.49, z);
      seam.castShadow = false;
      dock.add(seam);
    }

    for (let z = -30; z <= 31; z += 6.1) {
      const leftPile = cylinder(.48, .58, 7.1, pilingMat, 9.9, .3, z, 10);
      const rightPile = cylinder(.48, .58, 7.1, pilingMat, 26.1, .3, z, 10);
      dock.add(leftPile, rightPile);
      const greenBand = new THREE.MeshStandardMaterial({ color: 0x486b5b, roughness: 1 });
      dock.add(cylinder(.51, .51, .5, greenBand, 9.9, .8, z, 10));
    }
    scene.add(dock);

    const warehouse = new THREE.Group();
    warehouse.add(box(25, 12, 28, warehouseMat, 31, 8.2, -18));
    const roof = box(27, .7, 30, rustMat, 31, 14.4, -18);
    roof.rotation.z = -.035;
    warehouse.add(roof);

    const door = box(.22, 8.2, 10, darkMetal, 18.38, 6.15, -16);
    warehouse.add(door);
    for (let y = 2.8; y < 10; y += .65) {
      warehouse.add(box(.28, .08, 9.7, rustMat, 18.23, y, -16));
    }

    for (const z of [-26, -20, -9]) {
      const windowFrame = box(.24, 3, 3.7, darkMetal, 18.25, 9.3, z);
      const pane = box(.27, 2.45, 3.15, glassMat, 18.08, 9.3, z);
      warehouse.add(windowFrame, pane);
    }

    const sign = box(.3, 2.4, 9.2, creamPaint, 18.02, 12.1, -18);
    warehouse.add(sign);
    const signCanvas = canvasTexture(512, (c, s) => {
      c.fillStyle = "#d9caaa";
      c.fillRect(0, 0, s, s);
      c.fillStyle = "#273d42";
      c.font = "bold 72px Georgia";
      c.textAlign = "center";
      c.textBaseline = "middle";
      c.fillText("NORTH PIER", s / 2, s / 2 - 30);
      c.font = "32px Georgia";
      c.fillText("FISH COMPANY", s / 2, s / 2 + 48);
    });
    sign.material = new THREE.MeshStandardMaterial({ map: signCanvas, roughness: .85 });
    warehouse.rotation.y = 0;
    scene.add(warehouse);

    function makeBollard(x, z) {
      const g = new THREE.Group();
      g.position.set(x, 2.6, z);
      g.add(cylinder(.28, .38, 1.25, darkMetal, 0, .62, 0, 12));
      const cap = cylinder(.44, .44, .18, darkMetal, 0, 1.27, 0, 12);
      g.add(cap);
      const arm = cylinder(.12, .12, 1.15, darkMetal, 0, 1.05, 0, 8);
      arm.rotation.z = Math.PI / 2;
      g.add(arm);
      scene.add(g);
      return g;
    }
    const bollards = [
      makeBollard(10.9, -18),
      makeBollard(10.9, 1),
      makeBollard(10.9, 20),
      makeBollard(24.3, 27)
    ];

    function makeCrate(x, y, z, sx = 2.7, sy = 2.2, sz = 2.3, color = 0xffffff) {
      const mat = new THREE.MeshStandardMaterial({
        map: crateTex,
        color,
        roughness: .96
      });
      const c = box(sx, sy, sz, mat, x, y, z);
      c.rotation.y = range(-.08, .08);
      scene.add(c);
      return c;
    }

    makeCrate(22, 3.6, 6, 3.1, 2.3, 2.5, 0x99734d);
    makeCrate(22.2, 5.9, 6.1, 2.9, 2.2, 2.4, 0x816342);
    makeCrate(25, 3.45, 4, 2.4, 2, 2.2, 0x8c5a37);
    makeCrate(21.5, 3.45, 10, 3.5, 2, 2.2, 0x5e766d);
    makeCrate(24.5, 3.5, 12, 2.5, 2.1, 2.1, 0x9a7050);

    function makeTrap(x, z, angle) {
      const g = new THREE.Group();
      const frameMat = new THREE.MeshStandardMaterial({ color: 0x4f3c29, roughness: 1 });
      const netMat = new THREE.MeshBasicMaterial({
        color: 0x354437,
        transparent: true,
        opacity: .42,
        wireframe: true
      });
      g.add(box(2.7, .12, .12, frameMat, 0, 0, -.75));
      g.add(box(2.7, .12, .12, frameMat, 0, 0, .75));
      g.add(box(.12, .12, 1.5, frameMat, -1.3, 0, 0));
      g.add(box(.12, .12, 1.5, frameMat, 1.3, 0, 0));
      g.add(box(2.7, .12, .12, frameMat, 0, 1.3, -.75));
      g.add(box(2.7, .12, .12, frameMat, 0, 1.3, .75));
      for (const xx of [-1.3, 1.3]) {
        for (const zz of [-.75, .75]) {
          g.add(box(.12, 1.3, .12, frameMat, xx, .65, zz));
        }
      }
      const net = mesh(new THREE.BoxGeometry(2.55, 1.15, 1.35, 8, 4, 5), netMat, 0, .65, 0);
      g.add(net);
      g.position.set(x, 2.55, z);
      g.rotation.y = angle;
      scene.add(g);
    }
    makeTrap(14, 14, .08);
    makeTrap(16.8, 14.4, -.05);
    makeTrap(15.4, 16.1, .12);

    function makeCoil(x, z, radius, loops) {
      const g = new THREE.Group();
      for (let i = 0; i < loops; i++) {
        const r = radius - i * .09;
        const curve = new THREE.CatmullRomCurve3(
          Array.from({ length: 34 }, (_, k) => {
            const a = k / 33 * Math.PI * 2;
            return new THREE.Vector3(
              Math.cos(a) * r,
              .025 * Math.sin(a * 3),
              Math.sin(a) * r
            );
          }),
          true
        );
        g.add(mesh(new THREE.TubeGeometry(curve, 48, .055, 6, true), ropeMat));
      }
      g.position.set(x, 2.55, z);
      scene.add(g);
    }
    makeCoil(14.1, -4, 1.35, 7);
    makeCoil(23.8, 18.5, 1.05, 6);

    const crane = new THREE.Group();
    crane.position.set(23, 2.5, 24);
    crane.add(box(3.6, .55, 3.6, darkMetal, 0, .28, 0));
    crane.add(cylinder(.75, .9, 1.1, rustMat, 0, 1, 0, 16));
    crane.add(box(.85, 10.5, .85, rustMat, 0, 6.5, 0));

    const boom = box(.65, .65, 13.8, rustMat, 0, 10.9, -5.6);
    boom.rotation.x = -.37;
    crane.add(boom);

    const brace1 = ropeCurve([
      new THREE.Vector3(0, 10.6, 0),
      new THREE.Vector3(0, 14.7, -7),
      new THREE.Vector3(0, 8.4, -12)
    ], .12, darkMetal);
    crane.add(brace1);

    const cable = ropeCurve([
      new THREE.Vector3(0, 13.4, -11.6),
      new THREE.Vector3(0, 9.2, -11.6),
      new THREE.Vector3(0, 5.8, -11.55)
    ], .035, darkMetal);
    crane.add(cable);

    const hook = new THREE.Mesh(
      new THREE.TorusGeometry(.4, .11, 7, 14, Math.PI * 1.55),
      darkMetal
    );
    hook.position.set(0, 5.45, -11.55);
    hook.rotation.z = -.4;
    crane.add(hook);
    crane.rotation.y = -.24;
    scene.add(crane);

    function createHull() {
      const stations = [
        { x: -7.8, w: .15, y: 1.5 },
        { x: -6.7, w: 2.1, y: .45 },
        { x: -3.8, w: 3.1, y: .05 },
        { x: 1.5, w: 3.35, y: -.05 },
        { x: 5.7, w: 2.65, y: .25 },
        { x: 7.2, w: 1.2, y: .9 },
        { x: 7.8, w: .12, y: 1.65 }
      ];
      const levels = [
        { y: -1.45, factor: .18 },
        { y: -.75, factor: .65 },
        { y: .2, factor: .94 },
        { y: 1.15, factor: 1 }
      ];
      const vertices = [];
      for (const s of stations) {
        for (const l of levels) {
          vertices.push(s.x, l.y + s.y * .28, -s.w * l.factor);
          vertices.push(s.x, l.y + s.y * .28, s.w * l.factor);
        }
      }
      const indices = [];
      const row = levels.length * 2;
      for (let i = 0; i < stations.length - 1; i++) {
        for (let j = 0; j < levels.length - 1; j++) {
          const a = i * row + j * 2;
          const b = (i + 1) * row + j * 2;
          indices.push(a, b, a + 2, b, b + 2, a + 2);
          indices.push(a + 1, a + 3, b + 1, b + 1, a + 3, b + 3);
        }
      }
      for (let i = 0; i < stations.length - 1; i++) {
        const a = i * row;
        const b = (i + 1) * row;
        indices.push(a, a + 1, b, b, a + 1, b + 1);
        const ta = a + row - 2;
        const tb = b + row - 2;
        indices.push(ta, tb, ta + 1, tb, tb + 1, ta + 1);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    const boat = new THREE.Group();
    boat.position.set(-1, 2.05, 4);
    boat.rotation.y = -.08;

    const hull = mesh(createHull(), redPaint);
    hull.castShadow = true;
    boat.add(hull);

    const upperHull = box(13.4, 1.05, 5.7, creamPaint, -.2, 1.55, 0);
    upperHull.geometry.translate(0, 0, 0);
    boat.add(upperHull);

    const railMat = new THREE.MeshStandardMaterial({ color: 0xb7ad90, roughness: .7 });
    const deckMat = new THREE.MeshStandardMaterial({ color: 0x65533d, roughness: .92 });
    boat.add(box(12.6, .28, 5.15, deckMat, -.2, 2.18, 0));

    const cabin = new THREE.Group();
    cabin.position.set(1.8, 2.28, 0);
    cabin.add(box(4.2, 2.8, 4.05, creamPaint, 0, 1.4, 0));
    cabin.add(box(4.5, .3, 4.35, bluePaint, 0, 2.95, 0));
    cabin.add(box(.16, 1.15, 1.4, glassMat, -2.13, 1.8, -1.05));
    cabin.add(box(.16, 1.15, 1.4, glassMat, -2.13, 1.8, 1.05));
    cabin.add(box(1.35, 1.05, .16, glassMat, -.8, 1.85, -2.08));
    cabin.add(box(1.35, 1.05, .16, glassMat, .9, 1.85, -2.08));
    cabin.add(box(1.35, 1.05, .16, glassMat, -.8, 1.85, 2.08));
    cabin.add(box(1.35, 1.05, .16, glassMat, .9, 1.85, 2.08));
    boat.add(cabin);

    function addRail(x1, x2, z) {
      const rail = new THREE.Group();
      for (let x = x1; x <= x2; x += 1.5) {
        rail.add(cylinder(.035, .035, 1.05, railMat, x, 2.85, z, 6));
      }
      const top = cylinder(.045, .045, x2 - x1, railMat, (x1 + x2) / 2, 3.35, z, 6);
      top.rotation.z = Math.PI / 2;
      rail.add(top);
      boat.add(rail);
    }
    addRail(-6.2, 6.1, -2.65);
    addRail(-6.2, 6.1, 2.65);

    function mast(x, height) {
      const g = new THREE.Group();
      g.add(cylinder(.12, .18, height, darkMetal, x, 2.3 + height / 2, 0, 10));
      const yard = cylinder(.065, .065, 5.4, darkMetal, x, 2.3 + height * .73, 0, 8);
      yard.rotation.z = Math.PI / 2;
      g.add(yard);
      boat.add(g);
      return new THREE.Vector3(x, 2.3 + height, 0);
    }

    const mastTop1 = mast(-2.7, 9.8);
    const mastTop2 = mast(4.1, 7.4);
    boat.add(ropeCurve([
      new THREE.Vector3(-6.6, 2.7, 0),
      mastTop1,
      new THREE.Vector3(6.5, 2.7, 0)
    ], .025, darkMetal));
    boat.add(ropeCurve([
      new THREE.Vector3(-2.7, 12.1, 0),
      new THREE.Vector3(-1, 9.7, 0),
      new THREE.Vector3(4.1, 9.7, 0)
    ], .025, darkMetal));

    const antenna = cylinder(.025, .025, 3.1, darkMetal, 1.8, 8.1, 0, 6);
    boat.add(antenna);
    const radar = box(2.1, .16, .28, creamPaint, 1.8, 7, 0);
    boat.add(radar);

    const winch = new THREE.Group();
    winch.position.set(-3.9, 2.5, 0);
    const drum = cylinder(.6, .6, 1.3, darkMetal, 0, .7, 0, 16);
    drum.rotation.z = Math.PI / 2;
    winch.add(drum);
    winch.add(box(.18, 1.4, 1.4, rustMat, -.75, .65, 0));
    winch.add(box(.18, 1.4, 1.4, rustMat, .75, .65, 0));
    boat.add(winch);

    const fishBins = new THREE.MeshStandardMaterial({ color: 0x59848a, roughness: .8 });
    boat.add(box(2.7, .75, 1.8, fishBins, -5, 2.7, -1));
    boat.add(box(2.4, .75, 1.7, fishBins, -4.8, 2.7, 1.1));

    const navigationLight = new THREE.PointLight(0xffd597, 1.2, 10, 2);
    navigationLight.position.set(1.8, 7.3, 0);
    boat.add(navigationLight);
    boat.add(mesh(
      new THREE.SphereGeometry(.13, 10, 8),
      new THREE.MeshBasicMaterial({ color: 0xffddb0 }),
      1.8, 7.3, 0
    ));
    scene.add(boat);

    const mooringLines = new THREE.Group();
    scene.add(mooringLines);

    function updateMooringLines() {
      mooringLines.clear();
      boat.updateMatrixWorld(true);
      const endpoints = [
        [new THREE.Vector3(-6.4, 2.5, -2.25), new THREE.Vector3(10.9, 3.55, -18)],
        [new THREE.Vector3(6.2, 2.6, -2.15), new THREE.Vector3(10.9, 3.55, 20)],
        [new THREE.Vector3(1.5, 2.4, -2.4), new THREE.Vector3(10.9, 3.55, 1)]
      ];
      for (const [local, fixed] of endpoints) {
        const start = boat.localToWorld(local.clone());
        const mid = start.clone().lerp(fixed, .5);
        mid.y -= 1.1;
        mooringLines.add(ropeCurve([start, mid, fixed], .065));
      }
    }
    updateMooringLines();

    const buoys = [];
    function makeBuoy(x, z, color, phase) {
      const g = new THREE.Group();
      const body = mesh(
        new THREE.SphereGeometry(.48, 16, 12),
        new THREE.MeshStandardMaterial({ color, roughness: .72 }),
        0, 0, 0
      );
      body.scale.y = 1.3;
      g.add(body);
      g.add(cylinder(.08, .08, .7, darkMetal, 0, .75, 0, 7));
      g.add(mesh(new THREE.TorusGeometry(.19, .05, 7, 12), darkMetal, 0, 1.1, 0));
      g.position.set(x, .35, z);
      g.userData = { phase, baseY: .35 };
      scene.add(g);
      buoys.push(g);
    }
    makeBuoy(-12, -8, 0xc45b37, .3);
    makeBuoy(-16, 9, 0xd3a63f, 1.7);
    makeBuoy(-8, 22, 0xbd4034, 3.1);
    makeBuoy(4, -23, 0xd29b35, 4.6);
    makeBuoy(-24, -18, 0xb74432, 5.5);

    function makeGull(x, y, z, rot = 0) {
      const g = new THREE.Group();
      const white = new THREE.MeshStandardMaterial({ color: 0xe7e3d6, roughness: .9 });
      const gray = new THREE.MeshStandardMaterial({ color: 0x888b89, roughness: .9 });
      const beak = new THREE.MeshStandardMaterial({ color: 0xd69b35, roughness: .8 });

      const body = mesh(new THREE.SphereGeometry(.23, 12, 8), white);
      body.scale.set(1, .85, 1.8);
      g.add(body);
      const head = mesh(new THREE.SphereGeometry(.17, 10, 8), white, 0, .22, -.28);
      g.add(head);
      const bill = mesh(new THREE.ConeGeometry(.065, .28, 7), beak, 0, .2, -.53);
      bill.rotation.x = -Math.PI / 2;
      g.add(bill);

      const leftWing = mesh(new THREE.ConeGeometry(.22, .72, 3), gray, -.28, .04, .05);
      leftWing.rotation.z = .75;
      leftWing.rotation.x = -.3;
      g.add(leftWing);
      const rightWing = leftWing.clone();
      rightWing.position.x = .28;
      rightWing.rotation.z = -.75;
      g.add(rightWing);

      for (const sx of [-.09, .09]) {
        g.add(cylinder(.012, .012, .28, beak, sx, -.3, .1, 5));
      }
      g.position.set(x, y, z);
      g.rotation.y = rot;
      scene.add(g);
      return g;
    }
    makeGull(26.1, 4.15, -6, 2.1);
    makeGull(9.9, 4.15, 26, -1);
    makeGull(26.1, 4.15, 13.5, 2.7);

    const flyingGulls = [];
    function flyingGull(radius, height, phase) {
      const g = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({
        color: 0xe4e0d3,
        roughness: .9,
        side: THREE.DoubleSide
      });
      const wingGeo = new THREE.BufferGeometry();
      wingGeo.setAttribute("position", new THREE.Float32BufferAttribute([
        0, 0, 0, -1.1, .05, .2, -.45, -.12, -.15,
        0, 0, 0, 1.1, .05, .2, .45, -.12, -.15
      ], 3));
      wingGeo.computeVertexNormals();
      g.add(mesh(wingGeo, mat));
      g.userData = { radius, height, phase };
      scene.add(g);
      flyingGulls.push(g);
    }
    flyingGull(35, 20, 0);
    flyingGull(44, 24, 2.3);

    const lamps = [];
    function makeLamp(x, z) {
      const g = new THREE.Group();
      g.position.set(x, 2.5, z);
      g.add(cylinder(.09, .13, 7, darkMetal, 0, 3.5, 0, 8));
      const arm = cylinder(.07, .07, 1.6, darkMetal, -.7, 6.9, 0, 8);
      arm.rotation.z = Math.PI / 2;
      g.add(arm);
      g.add(mesh(
        new THREE.CylinderGeometry(.5, .25, .35, 12),
        darkMetal,
        -1.45, 6.65, 0
      ));
      const bulb = new THREE.PointLight(0xffbd76, 7, 16, 2);
      bulb.position.set(-1.45, 6.35, 0);
      g.add(bulb);
      g.add(mesh(
        new THREE.SphereGeometry(.12, 8, 6),
        new THREE.MeshBasicMaterial({ color: 0xffc781 }),
        -1.45, 6.35, 0
      ));
      scene.add(g);
      lamps.push(g);
    }
    makeLamp(24.5, -1);
    makeLamp(24.5, 21);

    for (let i = 0; i < 24; i++) {
      const debrisMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(range(.06, .11), range(.2, .45), range(.22, .4)),
        roughness: 1
      });
      const plank = box(range(.7, 2), .08, range(.08, .24), debrisMat,
        range(11, 25), 2.53, range(-29, 31));
      plank.rotation.y = range(-Math.PI, Math.PI);
      scene.add(plank);
    }

    const distantPiers = new THREE.Group();
    const distantMat = new THREE.MeshStandardMaterial({ color: 0x4e4a43, roughness: 1 });
    distantPiers.add(box(50, .6, 5, distantMat, -34, 1.1, -46));
    for (let x = -58; x < -9; x += 5) {
      distantPiers.add(cylinder(.25, .35, 4.5, pilingMat, x, -.7, -46, 8));
    }
    scene.add(distantPiers);

    const clock = new THREE.Clock();
    let elapsed = 0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), .04);
      elapsed += dt;

      waterTex.offset.x = (elapsed * .008) % 1;
      waterTex.offset.y = (elapsed * -.014) % 1;
      water.material.roughness = .25 + Math.sin(elapsed * .7) * .025;

      boat.position.y = 2.05 + Math.sin(elapsed * .62) * .12;
      boat.rotation.z = Math.sin(elapsed * .48) * .012;
      boat.rotation.x = Math.sin(elapsed * .37 + .7) * .009;
      radar.rotation.y += dt * 1.25;

      for (const buoy of buoys) {
        const p = buoy.userData.phase;
        buoy.position.y = buoy.userData.baseY + Math.sin(elapsed * 1.15 + p) * .14;
        buoy.rotation.z = Math.sin(elapsed * .8 + p) * .09;
        buoy.rotation.x = Math.cos(elapsed * .65 + p) * .055;
      }

      for (const gull of flyingGulls) {
        const data = gull.userData;
        const a = elapsed * .085 + data.phase;
        gull.position.set(
          Math.cos(a) * data.radius,
          data.height + Math.sin(a * 3) * 1.2,
          Math.sin(a) * data.radius - 10
        );
        gull.rotation.y = -a + Math.PI / 2;
        gull.rotation.z = Math.sin(elapsed * 3.4 + data.phase) * .12;
      }

      crane.rotation.y = -.24 + Math.sin(elapsed * .09) * .025;
      navigationLight.intensity = 1.05 + Math.sin(elapsed * 2.2) * .12;

      updateMooringLines();
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    animate();
  </script>
</body>
</html>
