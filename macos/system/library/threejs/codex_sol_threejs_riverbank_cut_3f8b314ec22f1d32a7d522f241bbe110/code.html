<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riverbank Cut</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #b9c8cc; }
    canvas { display: block; }
    #label {
      position: fixed; left: 18px; bottom: 16px; padding: 8px 11px;
      color: rgba(255,255,255,.9); background: rgba(30,37,34,.36);
      font: 12px/1.35 system-ui, sans-serif; letter-spacing: .08em;
      border: 1px solid rgba(255,255,255,.18); border-radius: 5px;
      backdrop-filter: blur(5px); pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="label">RIVERBANK CUT · METERS · NORTH ↑</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb8c7ca);
    scene.fog = new THREE.FogExp2(0xb8c7ca, 0.018);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 160);
    camera.position.set(-18, 12, -20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(1.5, 1.3, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.32;
    controls.minDistance = 9;
    controls.maxDistance = 52;
    controls.maxPolarAngle = Math.PI * 0.48;

    scene.add(new THREE.HemisphereLight(0xdce8e8, 0x554733, 1.8));

    const sun = new THREE.DirectionalLight(0xfff0d2, 3.2);
    sun.position.set(-12, 20, -9);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -24;
    sun.shadow.camera.right = 24;
    sun.shadow.camera.top = 26;
    sun.shadow.camera.bottom = -26;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 60;
    sun.shadow.bias = -0.00025;
    scene.add(sun);

    let seed = 81724;
    function random() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    function noise2(x, z) {
      return Math.sin(x * 1.73 + Math.sin(z * 0.41) * 1.8) * 0.5 +
             Math.sin(z * 1.09 - x * 0.27) * 0.28 +
             Math.sin(x * 4.3 + z * 2.7) * 0.10;
    }
    function smoothstep(a, b, x) {
      const t = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1);
      return t * t * (3 - 2 * t);
    }
    function bankHeight(x, z) {
      const edge = -2.65 + 0.3 * Math.sin(z * 0.22) + 0.13 * Math.sin(z * 0.71);
      if (x < edge) return -0.38 + 0.035 * noise2(x, z);
      const crest = 7.0 + 0.35 * Math.sin(z * 0.17);
      const t = smoothstep(edge, crest, x);
      let y = -0.03 + 4.72 * Math.pow(t, 0.82);
      y += (0.12 + 0.18 * Math.sin(t * Math.PI)) * noise2(x * 0.75, z);
      y -= 0.25 * Math.exp(-Math.pow((t - 0.43) / 0.12, 2)) * (0.5 + 0.5 * Math.sin(z * 0.62));
      if (x > crest) y = 4.67 + 0.10 * noise2(x * 0.55, z * 0.6);
      return y;
    }

    const nx = 110, nz = 180;
    const minX = -5.2, maxX = 12.0, minZ = -18, maxZ = 18;
    const positions = [];
    const colors = [];
    const indices = [];
    const soilLow = new THREE.Color(0x49382b);
    const soilMid = new THREE.Color(0x74563a);
    const soilHigh = new THREE.Color(0x857054);
    const grassSoil = new THREE.Color(0x647052);

    for (let iz = 0; iz <= nz; iz++) {
      const z = THREE.MathUtils.lerp(minZ, maxZ, iz / nz);
      for (let ix = 0; ix <= nx; ix++) {
        const x = THREE.MathUtils.lerp(minX, maxX, ix / nx);
        const y = bankHeight(x, z);
        positions.push(x, y, z);
        const slopeT = THREE.MathUtils.clamp((y + 0.3) / 5, 0, 1);
        const c = soilLow.clone().lerp(soilMid, smoothstep(0.02, 0.62, slopeT));
        c.lerp(soilHigh, smoothstep(0.55, 0.9, slopeT));
        c.lerp(grassSoil, smoothstep(0.9, 1.0, slopeT));
        const mottling = noise2(x * 1.7, z * 1.6) * 0.045;
        c.offsetHSL(0, 0, mottling);
        colors.push(c.r, c.g, c.b);
      }
    }
    for (let iz = 0; iz < nz; iz++) {
      for (let ix = 0; ix < nx; ix++) {
        const a = iz * (nx + 1) + ix;
        const b = a + 1;
        const c = a + nx + 1;
        const d = c + 1;
        indices.push(a, c, b, b, c, d);
      }
    }

    const terrainGeometry = new THREE.BufferGeometry();
    terrainGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    terrainGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    terrainGeometry.setIndex(indices);
    terrainGeometry.computeVertexNormals();

    const terrain = new THREE.Mesh(
      terrainGeometry,
      new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.98,
        metalness: 0
      })
    );
    terrain.castShadow = true;
    terrain.receiveShadow = true;
    scene.add(terrain);

    const waterGeometry = new THREE.PlaneGeometry(18, 44, 1, 1);
    waterGeometry.rotateX(-Math.PI / 2);
    const water = new THREE.Mesh(
      waterGeometry,
      new THREE.MeshPhysicalMaterial({
        color: 0x436f76,
        roughness: 0.24,
        metalness: 0.05,
        transparent: true,
        opacity: 0.83,
        transmission: 0.08,
        clearcoat: 0.65,
        clearcoatRoughness: 0.18,
        side: THREE.DoubleSide
      })
    );
    water.position.set(-11.6, -0.08, 0);
    water.receiveShadow = true;
    scene.add(water);

    const rippleMaterial = new THREE.LineBasicMaterial({
      color: 0xa6c5c2,
      transparent: true,
      opacity: 0.22
    });
    for (let i = 0; i < 28; i++) {
      const z = -17 + random() * 34;
      const x0 = -18 + random() * 14;
      const len = 0.8 + random() * 2.8;
      const points = [];
      for (let j = 0; j < 12; j++) {
        const x = x0 + len * j / 11;
        points.push(new THREE.Vector3(x, -0.065, z + Math.sin(j * 0.9) * 0.025));
      }
      scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), rippleMaterial));
    }

    const bandMaterialA = new THREE.MeshStandardMaterial({ color: 0x3f3026, roughness: 1 });
    const bandMaterialB = new THREE.MeshStandardMaterial({ color: 0x9a7450, roughness: 1 });
    function erosionBand(xCenter, width, material, zStart, zEnd) {
      const points = [];
      const segments = 90;
      for (let i = 0; i <= segments; i++) {
        const z = THREE.MathUtils.lerp(zStart, zEnd, i / segments);
        const x = xCenter + 0.15 * Math.sin(z * 0.54) + 0.06 * Math.sin(z * 1.8);
        points.push(new THREE.Vector3(x, bankHeight(x, z) + 0.025, z));
      }
      const curve = new THREE.CatmullRomCurve3(points);
      const mesh = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 180, width, 5, false),
        material
      );
      mesh.castShadow = true;
      scene.add(mesh);
    }
    erosionBand(0.25, 0.055, bandMaterialA, -17, 17);
    erosionBand(2.35, 0.07, bandMaterialB, -16.5, 16.5);
    erosionBand(4.45, 0.045, bandMaterialA, -17, 17);

    const rockGeometry = new THREE.IcosahedronGeometry(1, 1);
    const rockMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x695c4b, roughness: 0.96 }),
      new THREE.MeshStandardMaterial({ color: 0x4f493e, roughness: 1 }),
      new THREE.MeshStandardMaterial({ color: 0x81725e, roughness: 0.95 })
    ];
    for (let i = 0; i < 95; i++) {
      const x = -3.2 + random() * 9.4;
      const z = minZ + 1 + random() * 34;
      const y = bankHeight(x, z);
      const s = 0.055 + random() * random() * 0.22;
      const rock = new THREE.Mesh(rockGeometry, rockMaterials[i % rockMaterials.length]);
      rock.position.set(x, y + s * 0.35, z);
      rock.scale.set(s * (0.8 + random()), s * (0.45 + random() * 0.45), s * (0.7 + random()));
      rock.rotation.set(random() * 3, random() * 3, random() * 3);
      rock.castShadow = true;
      rock.receiveShadow = true;
      scene.add(rock);
    }

    const reedStemGeometry = new THREE.CylinderGeometry(0.012, 0.018, 1, 5);
    reedStemGeometry.translate(0, 0.5, 0);
    const reedStemMaterial = new THREE.MeshStandardMaterial({ color: 0x718046, roughness: 0.9 });
    const dryStemMaterial = new THREE.MeshStandardMaterial({ color: 0x9a8853, roughness: 0.95 });
    const seedHeadGeometry = new THREE.CylinderGeometry(0.025, 0.038, 0.24, 6);
    seedHeadGeometry.translate(0, 0.12, 0);
    const seedHeadMaterial = new THREE.MeshStandardMaterial({ color: 0x4e3921, roughness: 1 });

    const stemCount = 430;
    const stems = new THREE.InstancedMesh(reedStemGeometry, reedStemMaterial, stemCount);
    const dryStems = new THREE.InstancedMesh(reedStemGeometry, dryStemMaterial, 110);
    const heads = new THREE.InstancedMesh(seedHeadGeometry, seedHeadMaterial, 170);
    stems.castShadow = dryStems.castShadow = heads.castShadow = true;
    const dummy = new THREE.Object3D();
    let greenIndex = 0, dryIndex = 0, headIndex = 0;

    for (let cluster = 0; cluster < 45; cluster++) {
      const zc = -16.5 + random() * 33;
      const xc = -2.6 + 0.3 * Math.sin(zc * 0.22) + (random() - 0.5) * 0.65;
      const clusterSize = 7 + Math.floor(random() * 7);
      for (let j = 0; j < clusterSize; j++) {
        const x = xc + (random() - 0.5) * 0.7;
        const z = zc + (random() - 0.5) * 1.15;
        const h = 0.75 + random() * 1.65;
        const baseY = Math.max(-0.07, bankHeight(x, z));
        dummy.position.set(x, baseY, z);
        dummy.scale.set(0.85 + random() * 0.5, h, 0.85 + random() * 0.5);
        dummy.rotation.set((random() - 0.5) * 0.09, random() * Math.PI, (random() - 0.5) * 0.09);
        dummy.updateMatrix();
        const isDry = random() < 0.2 && dryIndex < 110;
        if (isDry) dryStems.setMatrixAt(dryIndex++, dummy.matrix);
        else if (greenIndex < stemCount) stems.setMatrixAt(greenIndex++, dummy.matrix);
        if (random() < 0.34 && headIndex < 170) {
          dummy.position.y = baseY + h - 0.03;
          dummy.scale.set(0.9, 0.75 + random() * 0.65, 0.9);
          dummy.updateMatrix();
          heads.setMatrixAt(headIndex++, dummy.matrix);
        }
      }
    }
    stems.count = greenIndex;
    dryStems.count = dryIndex;
    heads.count = headIndex;
    stems.instanceMatrix.needsUpdate = true;
    dryStems.instanceMatrix.needsUpdate = true;
    heads.instanceMatrix.needsUpdate = true;
    scene.add(stems, dryStems, heads);

    const grassBladeGeometry = new THREE.ConeGeometry(0.025, 0.42, 4);
    grassBladeGeometry.translate(0, 0.21, 0);
    const grassMaterial = new THREE.MeshStandardMaterial({ color: 0x69784d, roughness: 1 });
    const grass = new THREE.InstancedMesh(grassBladeGeometry, grassMaterial, 520);
    grass.castShadow = true;
    for (let i = 0; i < 520; i++) {
      const x = 6.7 + random() * 5.0;
      const z = -17.6 + random() * 35.2;
      const y = bankHeight(x, z);
      const h = 0.35 + random() * 0.5;
      dummy.position.set(x, y, z);
      dummy.scale.set(0.7 + random() * 0.8, h / 0.42, 0.7 + random() * 0.8);
      dummy.rotation.set((random() - 0.5) * 0.12, random() * Math.PI, (random() - 0.5) * 0.12);
      dummy.updateMatrix();
      grass.setMatrixAt(i, dummy.matrix);
    }
    grass.instanceMatrix.needsUpdate = true;
    scene.add(grass);

    const rootMaterial = new THREE.MeshStandardMaterial({ color: 0x35261c, roughness: 1 });
    for (let i = 0; i < 18; i++) {
      const z = -15 + random() * 30;
      const x0 = 5.6 + random() * 1.2;
      const pts = [];
      for (let j = 0; j < 7; j++) {
        const x = x0 - j * (0.45 + random() * 0.1);
        pts.push(new THREE.Vector3(x, bankHeight(x, z) + 0.035, z + Math.sin(j * 0.9) * 0.1));
      }
      const root = new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 28, 0.018 + random() * 0.025, 5, false),
        rootMaterial
      );
      root.castShadow = true;
      scene.add(root);
    }

    const stakeWood = new THREE.MeshStandardMaterial({ color: 0xd0aa68, roughness: 0.82 });
    const stakeTip = new THREE.MeshStandardMaterial({ color: 0xe45138, roughness: 0.72 });
    const stakeGeometry = new THREE.CylinderGeometry(0.025, 0.032, 1.55, 6);
    stakeGeometry.translate(0, 0.775, 0);
    const tipGeometry = new THREE.CylinderGeometry(0.028, 0.029, 0.28, 6);
    tipGeometry.translate(0, 0.14, 0);
    const stakeCount = 13;
    const stakes = new THREE.InstancedMesh(stakeGeometry, stakeWood, stakeCount);
    const tips = new THREE.InstancedMesh(tipGeometry, stakeTip, stakeCount);
    stakes.castShadow = tips.castShadow = true;

    for (let i = 0; i < stakeCount; i++) {
      const z = -15.6 + i * 2.6;
      const x = 8.25 + 0.16 * Math.sin(z * 0.31);
      const y = bankHeight(x, z);
      dummy.position.set(x, y, z);
      dummy.scale.setScalar(1);
      dummy.rotation.set((random() - 0.5) * 0.025, 0, (random() - 0.5) * 0.025);
      dummy.updateMatrix();
      stakes.setMatrixAt(i, dummy.matrix);
      dummy.position.y = y + 1.27;
      dummy.updateMatrix();
      tips.setMatrixAt(i, dummy.matrix);
    }
    stakes.instanceMatrix.needsUpdate = true;
    tips.instanceMatrix.needsUpdate = true;
    scene.add(stakes, tips);

    const northGroup = new THREE.Group();
    const arrowMaterial = new THREE.MeshStandardMaterial({ color: 0xe7e2cc, roughness: 0.7 });
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 1.15, 8), arrowMaterial);
    pole.rotation.x = Math.PI / 2;
    pole.position.z = 0.45;
    const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.38, 8), arrowMaterial);
    arrow.rotation.x = Math.PI / 2;
    arrow.position.z = 1.18;
    northGroup.add(pole, arrow);
    northGroup.position.set(10.5, bankHeight(10.5, -15.5) + 0.08, -15.5);
    northGroup.castShadow = true;
    scene.add(northGroup);

    const baseGeometry = new THREE.BoxGeometry(17.2, 0.45, 36);
    const base = new THREE.Mesh(
      baseGeometry,
      new THREE.MeshStandardMaterial({ color: 0x4b4034, roughness: 1 })
    );
    base.position.set(3.4, -0.62, 0);
    base.receiveShadow = true;
    base.castShadow = true;
    scene.add(base);

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      water.material.opacity = 0.81 + Math.sin(t * 0.55) * 0.015;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
