<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Deco Rotary Telephone</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090a0c; }
    body { font-family: sans-serif; }
    canvas { display: block; }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 43%, transparent 32%, rgba(0,0,0,.16) 68%, rgba(0,0,0,.62) 100%),
        linear-gradient(to bottom, rgba(255,255,255,.025), transparent 35%);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="vignette"></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0c10);
    scene.fog = new THREE.FogExp2(0x0a0c10, 0.028);

    const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(10.2, 7.2, 12.8);
    camera.lookAt(0, 1.7, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.65, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;
    controls.minDistance = 9;
    controls.maxDistance = 25;
    controls.maxPolarAngle = Math.PI * 0.48;

    const black = new THREE.MeshPhysicalMaterial({
      color: 0x090a0b,
      roughness: 0.18,
      metalness: 0.05,
      clearcoat: 1,
      clearcoatRoughness: 0.11
    });

    const blackSoft = new THREE.MeshPhysicalMaterial({
      color: 0x101114,
      roughness: 0.28,
      metalness: 0.02,
      clearcoat: 0.65,
      clearcoatRoughness: 0.22
    });

    const insetBlack = new THREE.MeshStandardMaterial({
      color: 0x020303,
      roughness: 0.58,
      metalness: 0.08
    });

    const chrome = new THREE.MeshPhysicalMaterial({
      color: 0xd9e0e5,
      roughness: 0.13,
      metalness: 1,
      clearcoat: 0.65,
      clearcoatRoughness: 0.08
    });

    const nickel = new THREE.MeshPhysicalMaterial({
      color: 0xb9b6a8,
      roughness: 0.2,
      metalness: 0.92,
      clearcoat: 0.38
    });

    const cordMaterial = new THREE.MeshStandardMaterial({
      color: 0x111217,
      roughness: 0.78,
      metalness: 0.03
    });

    const darkCordMaterial = new THREE.MeshStandardMaterial({
      color: 0x020305,
      roughness: 0.88
    });

    const telephone = new THREE.Group();
    telephone.rotation.y = -0.04;
    scene.add(telephone);

    function mesh(geometry, material, parent = telephone) {
      const object = new THREE.Mesh(geometry, material);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function roundedBox(width, height, depth, radius, material, x, y, z, parent = telephone) {
      const object = mesh(
        new RoundedBoxGeometry(width, height, depth, 5, radius),
        material,
        parent
      );
      object.position.set(x, y, z);
      return object;
    }

    function makeRectangularBand(width, depth, thickness, y, material, radius = 0.07) {
      const group = new THREE.Group();
      const sideDepth = depth - thickness * 2;
      roundedBox(width, thickness, thickness, radius, material, 0, 0, depth / 2 - thickness / 2, group);
      roundedBox(width, thickness, thickness, radius, material, 0, 0, -depth / 2 + thickness / 2, group);
      roundedBox(thickness, thickness, sideDepth, radius, material, -width / 2 + thickness / 2, 0, 0, group);
      roundedBox(thickness, thickness, sideDepth, radius, material, width / 2 - thickness / 2, 0, 0, group);
      group.position.y = y;
      telephone.add(group);
      return group;
    }

    roundedBox(7.55, 0.34, 5.35, 0.24, blackSoft, 0, 0.3, 0.1);
    roundedBox(7.18, 0.58, 5.02, 0.32, black, 0, 0.62, 0.08);
    roundedBox(6.78, 0.76, 4.58, 0.42, black, 0, 1.02, 0.02);
    roundedBox(5.92, 0.52, 3.72, 0.42, black, 0, 1.42, -0.18);

    makeRectangularBand(7.42, 5.2, 0.11, 0.43, chrome, 0.045);
    makeRectangularBand(6.98, 4.82, 0.09, 0.77, nickel, 0.035);
    makeRectangularBand(6.55, 4.39, 0.075, 1.15, chrome, 0.03);

    for (const x of [-3.1, 3.1]) {
      for (const z of [-1.85, 1.85]) {
        const foot = mesh(new THREE.CylinderGeometry(0.23, 0.28, 0.2, 24), insetBlack);
        foot.position.set(x, 0.08, z);
      }
    }

    const upper = roundedBox(4.75, 0.7, 3.15, 0.46, black, 0, 1.69, -0.2);
    upper.rotation.x = -0.055;

    const dial = new THREE.Group();
    dial.position.set(0, 2.12, 0.74);
    dial.rotation.x = -1.255;
    telephone.add(dial);

    const dialBack = mesh(new THREE.CylinderGeometry(2.22, 2.22, 0.22, 96), black, dial);
    dialBack.rotation.x = Math.PI / 2;
    dialBack.position.z = -0.13;

    const outerBezel = mesh(new THREE.TorusGeometry(2.04, 0.135, 18, 96), chrome, dial);
    outerBezel.position.z = 0.03;

    const innerBezel = mesh(new THREE.TorusGeometry(1.53, 0.075, 16, 96), nickel, dial);
    innerBezel.position.z = 0.09;

    const centerPlate = mesh(new THREE.CylinderGeometry(0.72, 0.72, 0.16, 64), blackSoft, dial);
    centerPlate.rotation.x = Math.PI / 2;
    centerPlate.position.z = 0.08;

    const centerRing = mesh(new THREE.TorusGeometry(0.72, 0.055, 14, 64), chrome, dial);
    centerRing.position.z = 0.175;

    const centerMedallion = mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.18, 48), nickel, dial);
    centerMedallion.rotation.x = Math.PI / 2;
    centerMedallion.position.z = 0.18;

    const centerCap = mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.195, 48), insetBlack, dial);
    centerCap.rotation.x = Math.PI / 2;
    centerCap.position.z = 0.2;

    const fingerRing = mesh(new THREE.TorusGeometry(1.17, 0.1, 16, 96), chrome, dial);
    fingerRing.position.z = 0.15;

    const numberPatterns = {
      "0": ["a","b","c","d","e","f"],
      "1": ["b","c"],
      "2": ["a","b","g","e","d"],
      "3": ["a","b","c","d","g"],
      "4": ["f","g","b","c"],
      "5": ["a","f","g","c","d"],
      "6": ["a","f","g","e","c","d"],
      "7": ["a","b","c"],
      "8": ["a","b","c","d","e","f","g"],
      "9": ["a","b","c","d","f","g"]
    };

    const segmentData = {
      a: [0, 0.17, 0.26, 0.045],
      b: [0.14, 0.08, 0.045, 0.18],
      c: [0.14, -0.12, 0.045, 0.18],
      d: [0, -0.22, 0.26, 0.045],
      e: [-0.14, -0.12, 0.045, 0.18],
      f: [-0.14, 0.08, 0.045, 0.18],
      g: [0, -0.025, 0.26, 0.045]
    };

    function createDigit(value) {
      const group = new THREE.Group();
      for (const segmentName of numberPatterns[value]) {
        const data = segmentData[segmentName];
        const segment = mesh(
          new RoundedBoxGeometry(data[2], data[3], 0.035, 2, 0.015),
          nickel,
          group
        );
        segment.position.set(data[0], data[1], 0);
      }
      group.scale.setScalar(0.72);
      return group;
    }

    for (let i = 0; i < 10; i++) {
      const angle = Math.PI / 2 - i * Math.PI * 2 / 10;
      const holeRadius = 1.18;
      const hx = Math.cos(angle) * holeRadius;
      const hy = Math.sin(angle) * holeRadius;

      const recess = mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.17, 48), insetBlack, dial);
      recess.rotation.x = Math.PI / 2;
      recess.position.set(hx, hy, 0.14);

      const holeRim = mesh(new THREE.TorusGeometry(0.34, 0.042, 12, 48), nickel, dial);
      holeRim.position.set(hx, hy, 0.245);

      const fingerFloor = mesh(new THREE.CylinderGeometry(0.255, 0.255, 0.11, 40), blackSoft, dial);
      fingerFloor.rotation.x = Math.PI / 2;
      fingerFloor.position.set(hx, hy, 0.18);

      const numberRadius = 1.7;
      const digit = createDigit(String(i === 9 ? 0 : i + 1));
      digit.position.set(
        Math.cos(angle) * numberRadius,
        Math.sin(angle) * numberRadius,
        0.16
      );
      dial.add(digit);
    }

    const stopArm = new THREE.Group();
    stopArm.position.set(-1.48, -1.34, 0.22);
    stopArm.rotation.z = -0.44;
    dial.add(stopArm);
    roundedBox(0.18, 0.75, 0.13, 0.05, chrome, 0, 0, 0, stopArm);
    const stopTip = mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.17, 28), blackSoft, stopArm);
    stopTip.rotation.x = Math.PI / 2;
    stopTip.position.y = -0.37;

    const cradle = new THREE.Group();
    cradle.position.set(0, 2.25, -1.15);
    telephone.add(cradle);

    const cradleArc = mesh(
      new THREE.TorusGeometry(2.2, 0.105, 14, 80, Math.PI * 0.73),
      chrome,
      cradle
    );
    cradleArc.rotation.z = Math.PI * 0.135;
    cradleArc.scale.y = 0.55;

    for (let i = -4; i <= 4; i++) {
      const angle = i * 0.125;
      const x = Math.sin(angle) * 2.08;
      const y = Math.cos(angle) * 0.64 - 0.48;
      const start = new THREE.Vector3(0, -0.48, 0);
      const end = new THREE.Vector3(x, y, 0);
      const direction = end.clone().sub(start);
      const length = direction.length();
      const rib = mesh(new THREE.CylinderGeometry(0.032, 0.05, length, 12), nickel, cradle);
      rib.position.copy(start).add(end).multiplyScalar(0.5);
      rib.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
    }

    roundedBox(1.45, 0.16, 0.2, 0.06, chrome, 0, -0.48, 0, cradle);

    for (const x of [-2.6, 2.6]) {
      const post = mesh(new THREE.CylinderGeometry(0.18, 0.22, 0.62, 32), chrome);
      post.position.set(x, 2.38, -1.1);
      const saddle = mesh(new THREE.TorusGeometry(0.32, 0.11, 14, 36, Math.PI), blackSoft);
      saddle.position.set(x, 2.72, -1.1);
      saddle.rotation.z = Math.PI;
      saddle.rotation.x = Math.PI / 2;
    }

    const handset = new THREE.Group();
    handset.position.set(0, 3.18, -1.05);
    handset.rotation.z = 0.015;
    telephone.add(handset);

    const handleCurve = new THREE.CubicBezierCurve3(
      new THREE.Vector3(-2.55, -0.08, 0),
      new THREE.Vector3(-1.55, 0.62, 0.03),
      new THREE.Vector3(1.55, 0.62, 0.03),
      new THREE.Vector3(2.55, -0.08, 0)
    );
    const grip = mesh(new THREE.TubeGeometry(handleCurve, 80, 0.28, 18, false), black, handset);

    const highlightCurve = new THREE.CubicBezierCurve3(
      new THREE.Vector3(-2.0, 0.27, 0.22),
      new THREE.Vector3(-1.0, 0.64, 0.25),
      new THREE.Vector3(1.0, 0.64, 0.25),
      new THREE.Vector3(2.0, 0.27, 0.22)
    );
    const gripHighlight = mesh(new THREE.TubeGeometry(highlightCurve, 48, 0.035, 8, false), nickel, handset);

    for (const side of [-1, 1]) {
      const x = side * 2.75;

      const neck = mesh(new THREE.CylinderGeometry(0.31, 0.4, 0.9, 40), black, handset);
      neck.position.set(side * 2.58, -0.18, 0);
      neck.rotation.z = side * 0.34;

      const receiver = mesh(new THREE.CylinderGeometry(0.62, 0.48, 0.76, 48), black, handset);
      receiver.position.set(x, -0.49, 0);
      receiver.rotation.z = Math.PI / 2;

      const receiverBand = mesh(new THREE.CylinderGeometry(0.635, 0.635, 0.075, 48), chrome, handset);
      receiverBand.position.set(side * 3.08, -0.49, 0);
      receiverBand.rotation.z = Math.PI / 2;

      const cap = mesh(new THREE.CylinderGeometry(0.74, 0.64, 0.24, 56), blackSoft, handset);
      cap.position.set(side * 3.22, -0.49, 0);
      cap.rotation.z = Math.PI / 2;

      const capRing = mesh(new THREE.TorusGeometry(0.58, 0.05, 12, 48), nickel, handset);
      capRing.position.set(side * 3.35, -0.49, 0);
      capRing.rotation.y = Math.PI / 2;

      const face = mesh(new THREE.CylinderGeometry(0.53, 0.53, 0.035, 48), insetBlack, handset);
      face.position.set(side * 3.365, -0.49, 0);
      face.rotation.z = Math.PI / 2;

      for (let j = 0; j < 8; j++) {
        const a = j * Math.PI * 2 / 8;
        const port = mesh(new THREE.CylinderGeometry(0.032, 0.032, 0.045, 10), nickel, handset);
        port.position.set(
          side * 3.39,
          -0.49 + Math.cos(a) * 0.3,
          Math.sin(a) * 0.3
        );
        port.rotation.z = Math.PI / 2;
      }
    }

    const cordAnchor = new THREE.Vector3(3.15, 2.72, -1.0);
    const cordPoints = [
      cordAnchor,
      new THREE.Vector3(3.72, 2.45, -0.78),
      new THREE.Vector3(4.08, 1.55, -0.22),
      new THREE.Vector3(3.82, 0.55, 0.58),
      new THREE.Vector3(2.72, 0.24, 1.24),
      new THREE.Vector3(1.55, 0.3, 1.58),
      new THREE.Vector3(1.08, 0.76, 1.63),
      new THREE.Vector3(1.26, 1.18, 1.46),
      new THREE.Vector3(1.68, 1.18, 1.21)
    ];
    const cordCurve = new THREE.CatmullRomCurve3(cordPoints, false, 'centripetal');
    mesh(new THREE.TubeGeometry(cordCurve, 150, 0.105, 12, false), darkCordMaterial);

    for (let strandIndex = 0; strandIndex < 3; strandIndex++) {
      const strandPoints = [];
      const phase = strandIndex * Math.PI * 2 / 3;
      for (let i = 0; i <= 120; i++) {
        const t = i / 120;
        const point = cordCurve.getPoint(t);
        const tangent = cordCurve.getTangent(t).normalize();
        let reference = new THREE.Vector3(0, 1, 0);
        if (Math.abs(tangent.dot(reference)) > 0.92) reference = new THREE.Vector3(1, 0, 0);
        const normal = new THREE.Vector3().crossVectors(tangent, reference).normalize();
        const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
        const twist = t * Math.PI * 34 + phase;
        point.addScaledVector(normal, Math.cos(twist) * 0.102);
        point.addScaledVector(binormal, Math.sin(twist) * 0.102);
        strandPoints.push(point);
      }
      const strandCurve = new THREE.CatmullRomCurve3(strandPoints, false, 'centripetal');
      mesh(new THREE.TubeGeometry(strandCurve, 180, 0.025, 6, false), cordMaterial);
    }

    const cordCollar = mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.4, 24), blackSoft);
    cordCollar.position.set(1.66, 1.21, 1.2);
    cordCollar.rotation.z = Math.PI / 2.5;

    const tableMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x19191a,
      roughness: 0.37,
      metalness: 0.08,
      clearcoat: 0.25,
      clearcoatRoughness: 0.36
    });
    const table = mesh(new THREE.CylinderGeometry(12, 12.5, 0.32, 128), tableMaterial, scene);
    table.position.y = -0.17;
    table.receiveShadow = true;

    const trim = mesh(new THREE.TorusGeometry(12.02, 0.055, 12, 128), nickel, scene);
    trim.rotation.x = Math.PI / 2;
    trim.position.y = -0.02;

    const backdrop = new THREE.Mesh(
      new THREE.PlaneGeometry(70, 35),
      new THREE.MeshStandardMaterial({ color: 0x090b0e, roughness: 0.9 })
    );
    backdrop.position.set(0, 10, -13);
    backdrop.receiveShadow = true;
    scene.add(backdrop);

    const hemi = new THREE.HemisphereLight(0x8fa8c9, 0x24170f, 1.35);
    scene.add(hemi);

    const key = new THREE.SpotLight(0xffe4c6, 750, 35, Math.PI / 5.3, 0.45, 1.25);
    key.position.set(7, 11, 8);
    key.target.position.set(0, 1.2, 0);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.bias = -0.00015;
    key.shadow.normalBias = 0.025;
    scene.add(key, key.target);

    const rim = new THREE.SpotLight(0x8ebfff, 620, 30, Math.PI / 4.5, 0.6, 1.35);
    rim.position.set(-8, 7, -7);
    rim.target.position.set(0, 2, -0.5);
    scene.add(rim, rim.target);

    const warmFill = new THREE.PointLight(0xff8c52, 90, 14, 2);
    warmFill.position.set(-5, 2.5, 5);
    scene.add(warmFill);

    const chromeGlint = new THREE.PointLight(0xe8f5ff, 120, 10, 2);
    chromeGlint.position.set(4.5, 5.5, 3);
    scene.add(chromeGlint);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      chromeGlint.position.x = 4.5 + Math.sin(elapsed * 0.28) * 1.2;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
