<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ================================================================
   1950s RETRO DINER — retro americana
   Cutaway "dollhouse" interior: black & cream checkered floor, red
   vinyl booths with chrome-edged tables, a long counter with swivel
   stools, back bar with pie case and milkshake mixer, a glowing
   jukebox, slow ceiling fans and pink/cyan neon in the window.
   Walls are single-sided and face inward, so the near walls vanish
   and the room stays readable from every orbit angle.
   ================================================================ */

/* ----------------------------- CONFIG & PALETTE ------------------ */
const SEED = 19551117;
const ROOM = { w: 15.0, d: 9.6, h: 3.6 };          // interior extents
const COUNTER = { x: 5.5, z0: -3.5, z1: 3.9, top: 1.06 };
const PAL = {
  cream: 0xefe7d6, creamDark: 0xcfc4ad, red: 0xc4202e,
  chrome: 0xdfe5ea, chromeDim: 0x9aa2aa, steel: 0x6f767d,
  black: 0x14141a, mustard: 0xe8b22a, bulb: 0xffe4b4,
  neonPink: 0xff3fa4, neonCyan: 0x38e6ff, mirror: 0xdae4ea,
  wood: 0x5c3a22, glass: 0xbfe4ff, plate: 0xf4f1e8
};
const CSS = {
  cream: '#efe7d6', creamShade: '#ded2ba', grout: '#cbbfa6',
  red: '#c4202e', ink: '#191922'
};

/* ----------------------------- PRNG & HELPERS -------------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(SEED);
const rr = (a, b) => a + (b - a) * rand();
const pick = arr => arr[Math.floor(rand() * arr.length) % arr.length];

function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return { c, x: c.getContext('2d') };
}
function texFrom(c, rx = 1, ry = 1) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry); t.anisotropy = 8;
  return t;
}
function box(w, h, d, mat, x = 0, y = 0, z = 0, cast = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = true;
  return m;
}
function cyl(rt, rb, h, mat, seg = 20, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  return m;
}

/* ----------------------------- CANVAS TEXTURES ------------------- */
function checkerTexture() {
  const { c, x } = mkCanvas(512, 512), n = 8, s = 512 / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    x.fillStyle = (i + j) % 2 ? CSS.ink : CSS.cream;
    x.fillRect(i * s, j * s, s, s);
  }
  for (let k = 0; k < 5200; k++) {                 // linoleum speckle + wear
    x.fillStyle = `rgba(${rand() > 0.5 ? '255,255,255' : '0,0,0'},${rr(0.02, 0.09)})`;
    x.fillRect(rand() * 512, rand() * 512, rr(1, 3), rr(1, 3));
  }
  x.strokeStyle = 'rgba(0,0,0,0.16)'; x.lineWidth = 1.5;
  for (let i = 0; i <= n; i++) { x.strokeRect(i * s, 0, 0, 512); x.strokeRect(0, i * s, 512, 0); }
  return texFrom(c, 3.2, 2.0);
}

function wallTexture(rx) {
  const { c, x } = mkCanvas(256, 256);
  x.fillStyle = CSS.cream; x.fillRect(0, 0, 256, 256);
  x.strokeStyle = CSS.grout; x.lineWidth = 2;               // upper tile field
  for (let r = 0; r * 26 < 152; r++) {
    const off = (r % 2) * 21;
    x.strokeRect(0, r * 26, 256, 0);
    for (let ci = 0; ci * 42 + off < 256; ci++) x.strokeRect(ci * 42 + off, r * 26, 0, 26);
  }
  const g = x.createLinearGradient(0, 150, 0, 168);          // chrome dado rail
  g.addColorStop(0, '#8f979e'); g.addColorStop(0.45, '#ffffff'); g.addColorStop(1, '#79818a');
  x.fillStyle = g; x.fillRect(0, 150, 256, 18);
  for (let i = 0; i < 8; i++) {                              // red / cream wainscot
    x.fillStyle = i % 2 ? CSS.red : CSS.creamShade; x.fillRect(i * 32, 168, 32, 78);
    x.fillStyle = 'rgba(255,255,255,0.30)'; x.fillRect(i * 32, 168, 3, 78);
  }
  x.fillStyle = '#2a2a33'; x.fillRect(0, 246, 256, 10);      // kick board
  return texFrom(c, rx, 1);
}

function laminateTexture() {
  const { c, x } = mkCanvas(256, 256);
  x.fillStyle = '#e9e2d2'; x.fillRect(0, 0, 256, 256);
  for (let k = 0; k < 260; k++) {                            // boomerang confetti
    x.save(); x.translate(rand() * 256, rand() * 256); x.rotate(rand() * Math.PI * 2);
    x.strokeStyle = pick(['#c4202e', '#2bbfae', '#e8b22a', '#4a4a55']);
    x.lineWidth = rr(1.4, 3.2); x.beginPath(); x.arc(0, 0, rr(3, 8), 0.4, 2.2);
    x.stroke(); x.restore();
  }
  for (let k = 0; k < 1400; k++) {
    x.fillStyle = `rgba(0,0,0,${rr(0.02, 0.07)})`; x.fillRect(rand() * 256, rand() * 256, 2, 2);
  }
  return texFrom(c, 2, 2);
}

function vinylTexture() {
  const { c, x } = mkCanvas(256, 256);
  x.fillStyle = CSS.red; x.fillRect(0, 0, 256, 256);
  for (let k = 0; k < 2600; k++) {
    x.fillStyle = `rgba(${rand() > 0.5 ? '255,180,180' : '60,0,6'},${rr(0.03, 0.12)})`;
    x.fillRect(rand() * 256, rand() * 256, rr(1, 4), rr(1, 4));
  }
  for (let i = 0; i < 5; i++) {                              // pleat seams + highlights
    x.fillStyle = 'rgba(60,0,8,0.5)'; x.fillRect(i * 51 + 24, 0, 3, 256);
    x.fillStyle = 'rgba(255,160,160,0.25)'; x.fillRect(i * 51 + 30, 0, 2, 256);
  }
  return texFrom(c, 1, 1);
}

function neonTexture(text, hex, font) {
  const { c, x } = mkCanvas(640, 300);
  x.font = font; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.shadowColor = hex; x.shadowBlur = 48; x.strokeStyle = hex; x.lineWidth = 13;
  for (let i = 0; i < 4; i++) x.strokeText(text, 320, 150);
  x.shadowBlur = 14; x.strokeStyle = '#fff'; x.lineWidth = 4; x.strokeText(text, 320, 150);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

function streetTexture() {
  const { c, x } = mkCanvas(1024, 512);
  const sky = x.createLinearGradient(0, 0, 0, 512);
  sky.addColorStop(0, '#080a1c'); sky.addColorStop(0.55, '#1d1440'); sky.addColorStop(1, '#432048');
  x.fillStyle = sky; x.fillRect(0, 0, 1024, 512);
  for (let k = 0; k < 260; k++) {                            // stars
    x.fillStyle = `rgba(255,255,255,${rr(0.15, 0.8)})`;
    x.fillRect(rand() * 1024, rand() * 260, rr(1, 2.4), rr(1, 2.4));
  }
  for (let b = 0; b < 16; b++) {                             // skyline silhouettes
    const bw = rr(60, 130), bx = b * 66 - 20, bh = rr(90, 250);
    x.fillStyle = `rgb(${12 + rand() * 12 | 0},${10 + rand() * 12 | 0},${26 + rand() * 16 | 0})`;
    x.fillRect(bx, 380 - bh, bw, bh + 40);
    for (let wy = 380 - bh + 14; wy < 375; wy += 20)
      for (let wx = bx + 8; wx < bx + bw - 10; wx += 18)
        if (rand() > 0.55) { x.fillStyle = `rgba(255,215,130,${rr(0.3, 0.9)})`; x.fillRect(wx, wy, 7, 11); }
  }
  x.fillStyle = '#161320'; x.fillRect(0, 400, 1024, 112);    // wet asphalt + reflections
  for (let k = 0; k < 40; k++) {
    x.fillStyle = `rgba(255,120,190,${rr(0.03, 0.12)})`;
    x.fillRect(rand() * 1024, 400 + rand() * 110, rr(20, 90), rr(2, 6));
  }
  x.fillStyle = 'rgba(255,140,60,0.55)';                     // distant street lamps
  for (let i = 0; i < 5; i++) { x.beginPath(); x.arc(120 + i * 210, 372, 26, 0, 6.3); x.fill(); }
  return texFrom(c, 1, 1);
}

function softDot() {
  const { c, x } = mkCanvas(64, 64);
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

function skyTexture() {
  const { c, x } = mkCanvas(64, 256);
  const g = x.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0, '#05040c'); g.addColorStop(0.6, '#140f22'); g.addColorStop(1, '#33172e');
  x.fillStyle = g; x.fillRect(0, 0, 64, 256);
  return texFrom(c, 1, 1);
}

/* ----------------------------- MATERIALS ------------------------- */
const MAT = {
  floor: new THREE.MeshStandardMaterial({ map: checkerTexture(), roughness: 0.46, metalness: 0.04 }),
  wallLong: new THREE.MeshStandardMaterial({ map: wallTexture(5), roughness: 0.72 }),
  wallShort: new THREE.MeshStandardMaterial({ map: wallTexture(3.2), roughness: 0.72 }),
  wallPlain: new THREE.MeshStandardMaterial({ map: wallTexture(1.4), roughness: 0.72 }),
  ceiling: new THREE.MeshStandardMaterial({ color: PAL.creamDark, roughness: 0.9 }),
  laminate: new THREE.MeshStandardMaterial({ map: laminateTexture(), roughness: 0.28, metalness: 0.08 }),
  vinyl: new THREE.MeshStandardMaterial({ map: vinylTexture(), roughness: 0.44 }),
  redPaint: new THREE.MeshStandardMaterial({ color: PAL.red, roughness: 0.4 }),
  shade: new THREE.MeshStandardMaterial({ color: PAL.red, roughness: 0.45, side: THREE.DoubleSide }),
  chrome: new THREE.MeshStandardMaterial({ color: PAL.chrome, roughness: 0.13, metalness: 1.0 }),
  chromeDim: new THREE.MeshStandardMaterial({ color: PAL.chromeDim, roughness: 0.32, metalness: 0.9 }),
  steel: new THREE.MeshStandardMaterial({ color: PAL.steel, roughness: 0.45, metalness: 0.75 }),
  dark: new THREE.MeshStandardMaterial({ color: PAL.black, roughness: 0.8 }),
  wood: new THREE.MeshStandardMaterial({ color: PAL.wood, roughness: 0.65 }),
  cream: new THREE.MeshStandardMaterial({ color: PAL.cream, roughness: 0.7 }),
  plate: new THREE.MeshStandardMaterial({ color: PAL.plate, roughness: 0.25 }),
  glass: new THREE.MeshStandardMaterial({
    color: PAL.glass, roughness: 0.05, metalness: 0.1,
    transparent: true, opacity: 0.22, side: THREE.DoubleSide
  }),
  mirror: new THREE.MeshStandardMaterial({ color: PAL.mirror, roughness: 0.16, metalness: 0.45 }),
  bulb: new THREE.MeshStandardMaterial({ color: 0xfff2d8, emissive: PAL.bulb, emissiveIntensity: 1.4 }),
  neonPink: new THREE.MeshStandardMaterial({ color: 0xff9fd0, emissive: PAL.neonPink, emissiveIntensity: 2.4 }),
  neonCyan: new THREE.MeshStandardMaterial({ color: 0xb0f5ff, emissive: PAL.neonCyan, emissiveIntensity: 2.4 }),
  heat: new THREE.MeshStandardMaterial({ color: 0xff9a3c, emissive: 0xff5a10, emissiveIntensity: 1.6 })
};
const ANIM = { fans: [], neonMats: [], neonLights: [], juke: null, pieShelf: null, steam: null, pendants: [] };

/* ----------------------------- BUILDERS -------------------------- */
// The shell: floor, ceiling and three inward-facing single-sided walls.
function buildRoom() {
  const g = new THREE.Group();
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), MAT.floor);
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; g.add(floor);
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), MAT.ceiling);
  ceil.rotation.x = Math.PI / 2; ceil.position.y = ROOM.h; g.add(ceil);
  const back = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.h), MAT.wallLong);
  back.position.set(0, ROOM.h / 2, -ROOM.d / 2); back.receiveShadow = true; g.add(back);
  const left = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.d, ROOM.h), MAT.wallShort);
  left.rotation.y = Math.PI / 2; left.position.set(-ROOM.w / 2, ROOM.h / 2, 0);
  left.receiveShadow = true; g.add(left);
  const right = left.clone(); right.rotation.y = -Math.PI / 2; right.position.x = ROOM.w / 2; g.add(right);
  return g;
}

// Front wall: knee wall, plate glass, mullions, neon signs and the street beyond.
function buildWindowWall() {
  const g = new THREE.Group(), z = ROOM.d / 2, xa = -3.4, xb = ROOM.w / 2;
  const solid = new THREE.Mesh(new THREE.PlaneGeometry(xa + ROOM.w / 2, ROOM.h), MAT.wallPlain);
  solid.rotation.y = Math.PI; solid.position.set((-ROOM.w / 2 + xa) / 2, ROOM.h / 2, z);
  solid.receiveShadow = true; g.add(solid);
  const bw = xb - xa, cx = (xa + xb) / 2;
  g.add(box(bw, 0.95, 0.22, MAT.redPaint, cx, 0.475, z - 0.11));       // knee wall
  g.add(box(bw, 0.1, 0.34, MAT.chrome, cx, 1.0, z - 0.17));            // sill
  g.add(box(bw, 0.95, 0.2, MAT.cream, cx, 3.12, z - 0.1));             // header
  g.add(box(bw, 0.12, 0.3, MAT.chrome, cx, 2.62, z - 0.15));
  const pane = new THREE.Mesh(new THREE.PlaneGeometry(bw - 0.1, 1.6), MAT.glass);
  pane.position.set(cx, 1.85, z - 0.06); pane.rotation.y = Math.PI; g.add(pane);
  for (let i = 0; i <= 4; i++)                                          // mullions
    g.add(box(0.11, 1.7, 0.16, MAT.chromeDim, xa + i * bw / 4, 1.85, z - 0.08));
  // neon: pink script sign, cyan word sign, two glowing tubes
  const signs = [
    { t: 'Diner', c: '#ff3fa4', f: 'italic bold 170px Georgia, serif', x: 0.7, y: 1.98, w: 3.6, h: 1.7 },
    { t: 'EATS', c: '#38e6ff', f: 'bold 140px Impact, sans-serif', x: 5.0, y: 2.2, w: 2.3, h: 1.05 }
  ];
  for (const s of signs) {
    const m = new THREE.MeshBasicMaterial({
      map: neonTexture(s.t, s.c, s.f), transparent: true,
      side: THREE.DoubleSide, depthWrite: false, toneMapped: false
    });
    const p = new THREE.Mesh(new THREE.PlaneGeometry(s.w, s.h), m);
    p.position.set(s.x, s.y, z - 0.22); p.rotation.y = Math.PI; g.add(p);
    ANIM.neonMats.push(m);
  }
  for (const t of [{ y: 2.78, m: MAT.neonCyan }, { y: 1.12, m: MAT.neonPink }]) {
    const tube = cyl(0.035, 0.035, bw - 0.3, t.m, 10, cx, t.y, z - 0.24);
    tube.rotation.z = Math.PI / 2; tube.castShadow = false; g.add(tube);
  }
  const street = new THREE.Mesh(new THREE.PlaneGeometry(26, 11),
    new THREE.MeshBasicMaterial({ map: streetTexture(), fog: false }));
  street.position.set(1, 3.4, z + 3.2); street.rotation.y = Math.PI; g.add(street);
  return g;
}

// Long counter with chrome-edged laminate top, foot rail and back bar.
function buildCounter() {
  const g = new THREE.Group(), len = COUNTER.z1 - COUNTER.z0, cz = (COUNTER.z0 + COUNTER.z1) / 2;
  g.add(box(0.86, 1.0, len, MAT.redPaint, COUNTER.x, 0.5, cz));
  for (let i = 0; i < 13; i++)                                         // vertical chrome ribs
    g.add(box(0.03, 0.9, 0.06, MAT.chrome, COUNTER.x - 0.44, 0.5, COUNTER.z0 + 0.3 + i * 0.57));
  g.add(box(1.06, 0.09, len + 0.12, MAT.laminate, COUNTER.x, 1.02, cz));
  g.add(box(1.12, 0.06, len + 0.18, MAT.chrome, COUNTER.x, 0.955, cz));  // chrome edge band
  const rail = cyl(0.045, 0.045, len - 0.2, MAT.chrome, 14, COUNTER.x - 0.62, 0.22, cz);
  rail.rotation.x = Math.PI / 2; g.add(rail);
  for (const rz of [COUNTER.z0 + 0.5, cz, COUNTER.z1 - 0.5])
    g.add(cyl(0.05, 0.05, 0.22, MAT.chromeDim, 10, COUNTER.x - 0.62, 0.11, rz));
  // back bar cabinet + shelving against the right wall
  const bx = 7.15;
  g.add(box(0.6, 0.92, len + 0.4, MAT.chromeDim, bx, 0.46, cz));
  g.add(box(0.68, 0.08, len + 0.5, MAT.laminate, bx, 0.96, cz));
  for (const sy of [1.62, 2.16]) {
    g.add(box(0.34, 0.06, len + 0.2, MAT.cream, bx + 0.12, sy, cz));
    for (const sz of [cz - 2.6, cz, cz + 2.6])
      g.add(box(0.3, 0.05, 0.05, MAT.chromeDim, bx + 0.12, sy - 0.05, sz));
  }
  g.add(box(0.04, 1.34, len + 0.2, MAT.mirror, 7.45, 1.68, cz, false));  // back-bar mirror
  return g;
}

// Espresso urns, milkshake mixer, register, cups and pass-through lamps.
function buildBackBarProps() {
  const g = new THREE.Group(), bx = 7.05;
  for (const cz of [-2.4, -1.75]) {                                     // coffee urns
    g.add(cyl(0.15, 0.16, 0.5, MAT.steel, 16, bx, 1.25, cz),
          cyl(0.17, 0.17, 0.05, MAT.chrome, 16, bx, 1.52, cz),
          box(0.1, 0.05, 0.2, MAT.dark, bx - 0.16, 1.12, cz));
  }
  g.add(box(0.34, 0.06, 0.9, MAT.chrome, bx, 1.02, -2.1));
  const mix = new THREE.Group();                                        // 3-spindle mixer
  mix.add(box(0.28, 0.12, 0.72, MAT.chrome, 0, 0.06, 0));
  for (let i = 0; i < 3; i++) {
    mix.add(cyl(0.05, 0.05, 0.5, MAT.chromeDim, 12, 0, 0.37, -0.24 + i * 0.24),
            cyl(0.09, 0.07, 0.26, MAT.chrome, 14, 0, 0.19, -0.24 + i * 0.24),
            box(0.1, 0.4, 0.1, MAT.chromeDim, 0.1, 0.32, -0.24 + i * 0.24));
  }
  mix.position.set(bx - 0.02, 1.0, 0.55); g.add(mix);
  const reg = new THREE.Group();                                        // cash register
  reg.add(box(0.42, 0.3, 0.42, MAT.chromeDim, 0, 0.15, 0),
          box(0.3, 0.24, 0.06, MAT.dark, 0, 0.42, 0.1),
          box(0.36, 0.05, 0.3, MAT.chrome, 0, 0.32, -0.04));
  reg.position.set(bx - 0.05, 1.0, 3.1); g.add(reg);
  const cups = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.055, 0.045, 0.09, 10), MAT.cream, 26);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < 26; i++) {                                        // stacked mugs on shelves
    const k = i % 13;
    dummy.position.set(bx + 0.1 + (i % 2) * 0.1, (i < 13 ? 1.71 : 2.25) + Math.floor(k / 7) * 0.09,
      -3.0 + (k % 7) * 0.94);
    dummy.rotation.y = rr(0, 3.1); dummy.updateMatrix(); cups.setMatrixAt(i, dummy.matrix);
  }
  cups.castShadow = true; g.add(cups);
  for (let i = 0; i < 5; i++)                                           // milkshake glasses
    g.add(cyl(0.06, 0.035, 0.16, MAT.glass, 10, bx + 0.14, 1.79, -0.4 + i * 0.22));
  g.add(box(0.06, 0.5, 1.9, MAT.dark, bx - 0.3, 2.75, -1.6, false));    // menu board
  for (let i = 0; i < 3; i++)
    g.add(box(0.02, 0.05, 1.5, MAT.cream, bx - 0.34, 2.9 - i * 0.15, -1.6, false));
  g.add(box(0.12, 0.9, 1.8, MAT.dark, 7.4, 2.2, 3.0, false),            // kitchen pass-through
        box(0.2, 0.1, 2.0, MAT.chrome, 7.3, 1.72, 3.0));
  for (let i = 0; i < 3; i++) {                                         // heat lamps
    const b = cyl(0.06, 0.06, 0.14, MAT.heat, 10, 7.15, 2.55, 2.4 + i * 0.6);
    b.castShadow = false; g.add(b);
  }
  const heatLight = new THREE.PointLight(0xff7a22, 4.5, 4.5, 2);
  heatLight.position.set(7.0, 2.4, 3.0); g.add(heatLight);
  return g;
}

// One chrome-pole swivel stool with a red vinyl seat.
function buildStool(z) {
  const g = new THREE.Group();
  g.add(cyl(0.24, 0.28, 0.06, MAT.chromeDim, 18, 0, 0.03, 0),
        cyl(0.07, 0.07, 0.6, MAT.chrome, 14, 0, 0.33, 0),
        cyl(0.2, 0.19, 0.11, MAT.vinyl, 22, 0, 0.68, 0),
        cyl(0.16, 0.16, 0.03, MAT.vinyl, 18, 0, 0.745, 0));
  for (const [ry, rad, tube] of [[0.24, 0.19, 0.022], [0.63, 0.2, 0.026]]) {  // foot ring + seat rim
    const t = new THREE.Mesh(new THREE.TorusGeometry(rad, tube, 8, 24), MAT.chrome);
    t.rotation.x = Math.PI / 2; t.position.y = ry; t.castShadow = true; g.add(t);
  }
  g.position.set(4.5, 0, z); g.rotation.y = rr(-0.4, 0.4);
  return g;
}

// Booth bay: two vinyl benches facing across a chrome-edged table.
function buildBooth(scale) {
  const g = new THREE.Group();
  for (const s of [-1, 1]) {
    g.add(box(0.62, 0.16, 1.3, MAT.vinyl, s * 0.6, 0.44, 0.55),          // seat
          box(0.62, 0.44, 1.3, MAT.chromeDim, s * 0.6, 0.22, 0.55),      // base
          box(0.18, 1.05, 1.36, MAT.vinyl, s * 0.98, 0.98, 0.55),        // back
          box(0.22, 0.09, 1.4, MAT.chrome, s * 0.98, 1.53, 0.55),        // chrome cap
          box(0.66, 0.06, 0.09, MAT.chrome, s * 0.6, 0.53, -0.09));      // seat piping
  }
  g.add(cyl(0.2, 0.26, 0.06, MAT.chromeDim, 16, 0, 0.03, 0.55),          // pedestal table
        cyl(0.07, 0.07, 0.68, MAT.chrome, 14, 0, 0.37, 0.55),
        box(0.92, 0.06, 1.16, MAT.laminate, 0, 0.74, 0.55),
        box(0.98, 0.05, 1.22, MAT.chrome, 0, 0.695, 0.55),
        buildTableTop(0, 0.77, 0.55));
  g.scale.setScalar(scale);
  return g;
}

// Condiments, napkin dispenser and a coffee cup for any table surface.
function buildTableTop(x, y, z) {
  const g = new THREE.Group();
  g.add(box(0.16, 0.13, 0.09, MAT.chrome, -0.22, 0.065, 0.3),           // napkin dispenser
        box(0.13, 0.11, 0.1, MAT.cream, -0.22, 0.07, 0.3));
  for (const [col, bz] of [[PAL.red, -0.02], [PAL.mustard, 0.14]]) {    // squeeze bottles
    const m = new THREE.MeshStandardMaterial({ color: col, roughness: 0.35 });
    g.add(cyl(0.045, 0.05, 0.16, m, 12, -0.22, 0.08, bz),
          cyl(0.022, 0.038, 0.06, MAT.cream, 10, -0.22, 0.19, bz));
  }
  for (const sz of [0.26, 0.12])                                        // salt & pepper
    g.add(cyl(0.032, 0.036, 0.1, MAT.glass, 10, 0.2, 0.05, sz),
          cyl(0.03, 0.03, 0.03, MAT.chrome, 10, 0.2, 0.115, sz));
  g.add(cyl(0.09, 0.09, 0.012, MAT.plate, 16, 0.14, 0.006, -0.18),      // saucer + mug
        cyl(0.055, 0.045, 0.08, MAT.cream, 14, 0.14, 0.05, -0.18),
        box(0.13, 0.005, 0.18, MAT.cream, -0.05, 0.003, -0.3, false));  // menu card
  g.position.set(x, y, z);
  return g;
}

// Chrome-and-glass rotating pie display case.
function buildPieCase() {
  const g = new THREE.Group();
  g.add(cyl(0.42, 0.44, 0.09, MAT.chrome, 24, 0, 0.045, 0),
        cyl(0.09, 0.09, 0.06, MAT.chrome, 12, 0, 0.86, 0),
        cyl(0.03, 0.03, 0.72, MAT.chromeDim, 8, 0, 0.4, 0));
  const shell = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.62, 24, 1, true), MAT.glass);
  shell.position.y = 0.4; g.add(shell);
  const dome = new THREE.Mesh(new THREE.SphereGeometry(0.4, 24, 10, 0, 6.3, 0, 1.1), MAT.glass);
  dome.position.y = 0.71; g.add(dome);
  const shelves = new THREE.Group(), pieCols = [0xf2c14e, 0x8c2a2a, 0x5c3a22];
  for (let s = 0; s < 3; s++) {
    shelves.add(cyl(0.36, 0.36, 0.02, MAT.chromeDim, 24, 0, 0.16 + s * 0.22, 0));
    const pm = new THREE.MeshStandardMaterial({ color: pieCols[s], roughness: 0.55 });
    for (let w = 0; w < 5; w++) {                                       // pie wedges
      const wedge = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.07, 10, 1, false, 0, 1.15), pm);
      wedge.position.set(Math.cos(w * 1.257) * 0.18, 0.205 + s * 0.22, Math.sin(w * 1.257) * 0.18);
      wedge.rotation.y = -w * 1.257; wedge.castShadow = true; shelves.add(wedge);
    }
  }
  g.add(shelves); ANIM.pieShelf = shelves;
  return g;
}

// Bubbler jukebox: arched glowing crown, chrome grille and selector buttons.
function buildJukebox() {
  const g = new THREE.Group();
  g.add(box(1.24, 1.02, 0.62, MAT.wood, 0, 0.51, 0), box(1.3, 0.08, 0.68, MAT.chrome, 0, 1.05, 0));
  const arch = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.62, 24, 1, false, 0, Math.PI), MAT.wood);
  arch.rotation.set(Math.PI / 2, 0, Math.PI / 2); arch.position.set(0, 1.09, 0);
  arch.castShadow = true; g.add(arch);
  const glowMat = new THREE.MeshStandardMaterial({ color: 0xffd9a0, emissive: 0xff9b3c, emissiveIntensity: 1.5 });
  const face = new THREE.Mesh(new THREE.CircleGeometry(0.5, 24, 0, Math.PI), glowMat);
  face.position.set(0, 1.09, 0.33); g.add(face);
  const rings = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.035, 8, 26, Math.PI), MAT.chrome);
  rings.position.set(0, 1.09, 0.35); g.add(rings);
  const pillars = [];
  for (const s of [-1, 1]) {                                            // bubble tubes
    const pm = new THREE.MeshStandardMaterial({ color: 0xffb3d9, emissive: PAL.neonPink, emissiveIntensity: 1.8 });
    const p = cyl(0.06, 0.06, 0.98, pm, 12, s * 0.56, 1.05, 0.28);
    p.castShadow = false; g.add(p); pillars.push(pm);
  }
  g.add(box(0.9, 0.34, 0.06, MAT.dark, 0, 0.78, 0.32),                  // title strips + grille
        box(0.96, 0.3, 0.06, MAT.chromeDim, 0, 0.42, 0.32));
  for (let i = 0; i < 5; i++) g.add(box(0.82, 0.03, 0.02, MAT.cream, 0, 0.9 - i * 0.07, 0.36, false));
  for (let i = 0; i < 7; i++) g.add(box(0.06, 0.24, 0.03, MAT.chrome, -0.36 + i * 0.12, 0.42, 0.36, false));
  const btns = new THREE.InstancedMesh(new THREE.BoxGeometry(0.05, 0.03, 0.02), MAT.cream, 16);
  const d = new THREE.Object3D();
  for (let i = 0; i < 16; i++) {                                        // selector buttons
    d.position.set(-0.34 + (i % 8) * 0.1, 0.62 - Math.floor(i / 8) * 0.06, 0.34);
    d.updateMatrix(); btns.setMatrixAt(i, d.matrix);
  }
  const light = new THREE.PointLight(0xff8fc4, 6, 6, 2);
  light.position.set(0, 1.3, 0.7); g.add(btns, light);
  ANIM.juke = { glowMat, pillars, light };
  return g;
}

// Ceiling fan with a globe light; blades spin in the animation loop.
function buildCeilingFan(x, z) {
  const g = new THREE.Group();
  g.add(cyl(0.035, 0.035, 0.42, MAT.chromeDim, 10, 0, ROOM.h - 0.42, 0));
  const hub = new THREE.Group();
  hub.add(cyl(0.16, 0.19, 0.16, MAT.chromeDim, 16, 0, ROOM.h - 0.68, 0),
          cyl(0.2, 0.2, 0.04, MAT.chrome, 16, 0, ROOM.h - 0.77, 0),
          cyl(0.11, 0.13, 0.1, MAT.chromeDim, 14, 0, ROOM.h - 0.86, 0));
  for (let i = 0; i < 4; i++) {
    const blade = box(1.05, 0.025, 0.24, MAT.wood, 0.62, ROOM.h - 0.78, 0);
    blade.rotation.z = 0.13;
    const arm = new THREE.Group(); arm.add(blade); arm.rotation.y = i * Math.PI / 2;
    hub.add(arm);
  }
  const globe = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 12), MAT.bulb);
  globe.position.y = ROOM.h - 1.0; hub.add(globe);
  const lamp = new THREE.PointLight(0xffd9a8, 5, 7, 2);
  lamp.position.set(0, ROOM.h - 1.05, 0); g.add(hub, lamp);
  g.position.set(x, 0, z);
  ANIM.fans.push({ hub, speed: rr(0.5, 0.75) });
  return g;
}

// Conical pendant lamp over the booth row.
function buildPendant(x, z) {
  const g = new THREE.Group();
  g.add(cyl(0.1, 0.1, 0.05, MAT.chromeDim, 12, 0, ROOM.h - 0.06, 0),
        cyl(0.012, 0.012, 0.55, MAT.chromeDim, 8, 0, ROOM.h - 0.34, 0));
  const shade = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.3, 20, 1, true), MAT.shade);
  shade.position.y = ROOM.h - 0.72; shade.castShadow = true;
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.11, 14, 10), MAT.bulb);
  bulb.position.y = ROOM.h - 0.84;
  const l = new THREE.PointLight(0xffd2a0, 4.5, 6, 2);
  l.position.set(0, ROOM.h - 0.88, 0); g.add(shade, bulb, l);
  g.position.set(x, 0, z);
  ANIM.pendants.push({ light: l, phase: rr(0, 6.2) });
  return g;
}

// A tall milkshake glass with whipped cream, cherry and a striped straw.
function buildMilkshake() {
  const g = new THREE.Group();
  const shakeMat = new THREE.MeshStandardMaterial({ color: 0xf7c8d6, roughness: 0.5 });
  g.add(cyl(0.085, 0.05, 0.26, MAT.glass, 16, 0, 0.13, 0),
        cyl(0.078, 0.046, 0.23, shakeMat, 16, 0, 0.125, 0),
        cyl(0.09, 0.09, 0.02, MAT.chrome, 16, 0, 0.01, 0));
  for (let i = 0; i < 6; i++) {                                          // whipped cream
    const b = new THREE.Mesh(new THREE.SphereGeometry(rr(0.04, 0.062), 10, 8), MAT.plate);
    b.position.set(Math.cos(i * 1.05) * 0.04, 0.28 + i * 0.022, Math.sin(i * 1.05) * 0.04);
    b.castShadow = true; g.add(b);
  }
  const cherry = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), MAT.redPaint);
  cherry.position.y = 0.44; cherry.castShadow = true;
  const straw = cyl(0.012, 0.012, 0.42, MAT.redPaint, 8, 0.05, 0.32, 0.02);
  straw.rotation.z = 0.3; g.add(cherry, straw);
  return g;
}

// Burger plate with a side of fries.
function buildBurgerPlate() {
  const g = new THREE.Group();
  const bun = new THREE.MeshStandardMaterial({ color: 0xd79b4e, roughness: 0.75 });
  const fry = new THREE.MeshStandardMaterial({ color: 0xe8bb54, roughness: 0.7 });
  g.add(cyl(0.2, 0.18, 0.02, MAT.plate, 22, 0, 0.01, 0),
        cyl(0.085, 0.08, 0.045, bun, 16, -0.02, 0.043, 0),                 // bottom bun
        cyl(0.088, 0.088, 0.035, new THREE.MeshStandardMaterial({ color: 0x4a2c18, roughness: 0.8 }), 16, -0.02, 0.083, 0),
        box(0.16, 0.008, 0.16, new THREE.MeshStandardMaterial({ color: 0xf0b429, roughness: 0.5 }), -0.02, 0.104, 0));
  const leaf = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.02, 6, 14),
    new THREE.MeshStandardMaterial({ color: 0x6ea832, roughness: 0.8 }));
  leaf.rotation.x = Math.PI / 2; leaf.position.set(-0.02, 0.115, 0); leaf.castShadow = true;
  const top = new THREE.Mesh(new THREE.SphereGeometry(0.088, 16, 10, 0, 6.3, 0, 1.25), bun);
  top.position.set(-0.02, 0.125, 0); top.scale.y = 0.75; top.castShadow = true; g.add(leaf, top);
  for (let i = 0; i < 9; i++) {                                          // fries
    const f = box(0.018, 0.018, 0.11, fry, 0.13 + rr(-0.03, 0.03), 0.025 + (i % 3) * 0.02, rr(-0.07, 0.07));
    f.rotation.set(rr(-0.3, 0.3), rr(0, 3.1), rr(-0.2, 0.2)); g.add(f);
  }
  return g;
}

// Free-standing chrome chair for the floor table.
function buildChair(x, z, rot) {
  const g = new THREE.Group();
  for (const dx of [-0.18, 0.18]) for (const dz of [-0.18, 0.18])
    g.add(cyl(0.02, 0.02, 0.44, MAT.chrome, 8, dx, 0.22, dz));
  g.add(box(0.44, 0.07, 0.44, MAT.vinyl, 0, 0.47, 0),
        box(0.44, 0.5, 0.08, MAT.vinyl, 0, 0.75, -0.2),
        box(0.46, 0.06, 0.1, MAT.chrome, 0, 1.02, -0.2));
  g.position.set(x, 0, z); g.rotation.y = rot;
  return g;
}

// Steam curling off the coffee urns.
function buildSteam() {
  const N = 54, pos = new Float32Array(N * 3), base = [];
  for (let i = 0; i < N; i++) {
    const b = { x: 7.0 + rr(-0.15, 0.15), y: rr(0, 1), z: -2.1 + rr(-0.4, 0.4), sp: rr(0.18, 0.34) };
    base.push(b); pos[i * 3] = b.x; pos[i * 3 + 1] = 1.55; pos[i * 3 + 2] = b.z;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({
    size: 0.19, map: softDot(), transparent: true, opacity: 0.24,
    depthWrite: false, color: 0xffffff, blending: THREE.AdditiveBlending
  }));
  ANIM.steam = { pts, base };
  return pts;
}

/* ----------------------------- SCENE & ASSEMBLY ------------------ */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x140f1c, 22, 62);

scene.add(new THREE.Mesh(new THREE.SphereGeometry(70, 24, 16),           // gradient night dome
  new THREE.MeshBasicMaterial({ map: skyTexture(), side: THREE.BackSide, fog: false })));

const diner = new THREE.Group();
scene.add(diner);
const frontWall = buildWindowWall();
diner.add(buildRoom(), frontWall, buildCounter(), buildBackBarProps(), buildSteam());

for (let i = 0; i < 6; i++) diner.add(buildStool(-2.9 + i * 1.25));      // swivel stool row

for (const [bx, bz, br] of [[-6.25, -3.0, -Math.PI / 2], [-6.25, 0.1, -Math.PI / 2],
                            [-6.25, 3.2, -Math.PI / 2], [1.4, -3.55, Math.PI], [-1.9, -3.55, Math.PI]]) {
  const b = buildBooth(rr(0.97, 1.03));
  b.position.set(bx, 0, bz); b.rotation.y = br; diner.add(b);
}

const juke = buildJukebox();
juke.position.set(-5.3, 0, 4.4); juke.rotation.y = Math.PI;
const pieCase = buildPieCase();
pieCase.position.set(COUNTER.x, COUNTER.top, 2.55);
const shake = buildMilkshake();
shake.position.set(COUNTER.x + 0.1, COUNTER.top, -1.15);
const plate = buildBurgerPlate();
plate.position.set(COUNTER.x - 0.06, COUNTER.top, -1.6);
diner.add(juke, pieCase, shake, plate,
  buildTableTop(COUNTER.x, COUNTER.top, 0.6), buildTableTop(COUNTER.x, COUNTER.top, -2.9),
  buildCeilingFan(-3, 1.0), buildCeilingFan(3, -1.6), buildPendant(-1.9, -2.0));
for (const pz of [-3.0, 0.1, 3.2]) diner.add(buildPendant(-6.25, pz));

// free-standing two-top in the middle of the checkered floor
const ftable = new THREE.Group();
ftable.add(cyl(0.28, 0.34, 0.06, MAT.chromeDim, 18, 0, 0.03, 0),
           cyl(0.075, 0.075, 0.68, MAT.chrome, 14, 0, 0.37, 0),
           cyl(0.52, 0.52, 0.06, MAT.laminate, 28, 0, 0.74, 0),
           cyl(0.55, 0.55, 0.05, MAT.chrome, 28, 0, 0.695, 0),
           buildTableTop(0, 0.77, 0));
ftable.position.set(-1.7, 0, -0.4);
diner.add(ftable, buildChair(-1.7, 0.55, Math.PI), buildChair(-1.7, -1.35, 0));

// wall clock over the back bar
const wallClock = new THREE.Group();
wallClock.add(cyl(0.3, 0.3, 0.07, MAT.chrome, 22, 0, 0, 0),
              cyl(0.27, 0.27, 0.02, MAT.cream, 22, 0, 0.045, 0),
              box(0.12, 0.015, 0.02, MAT.dark, 0.05, 0.07, 0, false));
for (let i = 0; i < 12; i++)
  wallClock.add(box(0.03, 0.02, 0.05, MAT.dark, Math.cos(i * 0.523) * 0.21, 0.055, Math.sin(i * 0.523) * 0.21, false));
const minHand = box(0.19, 0.012, 0.015, MAT.redPaint, 0.085, 0.075, 0, false);
minHand.rotation.y = 1.9; wallClock.add(minHand);
wallClock.rotation.z = Math.PI / 2; wallClock.position.set(7.35, 2.85, 0.6);

// coat stand and a chrome trash bin fill the corners
const coat = new THREE.Group();
coat.add(cyl(0.22, 0.26, 0.05, MAT.chromeDim, 14, 0, 0.025, 0),
         cyl(0.045, 0.045, 1.75, MAT.chrome, 12, 0, 0.87, 0));
for (let i = 0; i < 4; i++) {
  const hook = cyl(0.02, 0.02, 0.2, MAT.chrome, 8, Math.cos(i * 1.57) * 0.11, 1.7, Math.sin(i * 1.57) * 0.11);
  hook.rotation.set(Math.sin(i * 1.57) * 0.6, 0, -Math.cos(i * 1.57) * 0.6); coat.add(hook);
}
coat.position.set(-7.0, 0, -4.2);
const bin = new THREE.Group();
bin.add(cyl(0.24, 0.2, 0.62, MAT.chromeDim, 18, 0, 0.31, 0),
        cyl(0.26, 0.26, 0.05, MAT.chrome, 18, 0, 0.64, 0));
bin.position.set(3.6, 0, 4.3);
diner.add(wallClock, coat, bin);

/* ----------------------------- LIGHTING -------------------------- */
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x40303a, 0.55), new THREE.AmbientLight(0xfff0dd, 0.28));

const key = new THREE.DirectionalLight(0xfff1d6, 1.5);
key.position.set(-6, 12, -4); key.target.position.set(1, 0.5, 1);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -13; key.shadow.camera.right = 13;
key.shadow.camera.top = 13; key.shadow.camera.bottom = -13;
key.shadow.camera.near = 1; key.shadow.camera.far = 34;
key.shadow.bias = -0.0006; key.shadow.normalBias = 0.02;
scene.add(key, key.target);

const fill = new THREE.DirectionalLight(0x9fb6ff, 0.35);
fill.position.set(8, 6, 9); scene.add(fill);

// neon glow spilling off the window onto the chrome
const pinkLight = new THREE.PointLight(PAL.neonPink, 14, 13, 2);
pinkLight.position.set(0.7, 2.0, 3.9); scene.add(pinkLight);
const cyanLight = new THREE.PointLight(PAL.neonCyan, 12, 12, 2);
cyanLight.position.set(5.0, 2.2, 3.9); scene.add(cyanLight);
ANIM.neonLights.push({ l: pinkLight, base: 14, ph: 0.0 }, { l: cyanLight, base: 12, ph: 2.1 });

const counterGlow = new THREE.PointLight(0xffe0b0, 3.5, 9, 2);
counterGlow.position.set(5.2, 2.4, 0.4); scene.add(counterGlow);

/* ----------------------------- CAMERA & RENDERER ----------------- */
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(-7.9, 10.2, -14.0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
document.body.appendChild(renderer.domElement);

// a tiny PMREM room gives the chrome something to reflect
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.3, 1.35, 0.2);
controls.enableDamping = true; controls.dampingFactor = 0.05;
controls.autoRotate = true; controls.autoRotateSpeed = 0.75;
controls.minDistance = 13; controls.maxDistance = 30;
controls.minPolarAngle = 0.35; controls.maxPolarAngle = 1.12;
controls.enablePan = false;
controls.update();

/* ----------------------------- ANIMATION LOOP -------------------- */
const clock = new THREE.Clock();
const steamPos = ANIM.steam.pts.geometry.attributes.position;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  for (const f of ANIM.fans) f.hub.rotation.y += f.speed * 0.016;       // slow ceiling fans

  const flick = 0.86 + 0.14 * Math.sin(t * 2.3) + 0.06 * Math.sin(t * 11.7);
  for (const m of ANIM.neonMats) m.opacity = Math.min(1, flick);
  MAT.neonPink.emissiveIntensity = 2.1 + 0.5 * Math.sin(t * 1.7);
  MAT.neonCyan.emissiveIntensity = 2.1 + 0.5 * Math.sin(t * 1.7 + 2.0);
  for (const n of ANIM.neonLights)
    n.l.intensity = n.base * (0.82 + 0.18 * Math.sin(t * 2.6 + n.ph) + 0.05 * Math.sin(t * 13 + n.ph));

  if (ANIM.juke) {                                                      // jukebox colour cycle
    const hue = (t * 0.06) % 1;
    ANIM.juke.glowMat.emissive.setHSL(hue, 0.85, 0.5);
    ANIM.juke.light.color.setHSL(hue, 0.8, 0.6);
    ANIM.juke.light.intensity = 5 + 1.6 * Math.sin(t * 2.0);
    ANIM.juke.pillars.forEach((p, i) => {
      p.emissive.setHSL((hue + 0.5 + i * 0.08) % 1, 0.9, 0.55);
      p.emissiveIntensity = 1.5 + 0.6 * Math.sin(t * 3 + i * 1.6);
    });
  }

  ANIM.pieShelf.rotation.y = t * 0.28;                                  // pies revolve
  for (const p of ANIM.pendants) p.light.intensity = 4.3 + 0.25 * Math.sin(t * 1.3 + p.phase);

  for (let i = 0; i < ANIM.steam.base.length; i++) {                    // coffee steam
    const b = ANIM.steam.base[i];
    const h = (b.y + t * b.sp) % 1;
    steamPos.setY(i, 1.55 + h * 1.05);
    steamPos.setX(i, b.x + Math.sin(t * 0.9 + i) * 0.06 * h);
    steamPos.setZ(i, b.z + Math.cos(t * 0.7 + i) * 0.06 * h);
  }
  steamPos.needsUpdate = true;

  // dollhouse cutaway: drop the window wall when the camera swings in front of it
  frontWall.visible = camera.position.z < 2.6;

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ----------------------------- RESIZE ---------------------------- */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
