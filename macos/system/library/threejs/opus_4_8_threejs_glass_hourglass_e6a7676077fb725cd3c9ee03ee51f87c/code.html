<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Glass Hourglass — Crystal Study</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #161618; }
  #app { position: fixed; inset: 0; }
  .hint {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: rgba(230,235,245,0.45); letter-spacing: 0.4px; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- Renderer ---------- */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

/* ---------- Scene & Camera ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x161618);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.6, 1.1, 5.4);

/* ---------- Environment (for glass reflections/refraction) ---------- */
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;

/* ---------- Controls ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 3.2;
controls.maxDistance = 11;
controls.maxPolarAngle = Math.PI * 0.92;
controls.target.set(0, 0.0, 0);

/* ---------- Lighting: hemisphere + key + fill + rim ---------- */
const hemi = new THREE.HemisphereLight(0x9fb4d8, 0x161310, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e6, 2.2);
key.position.set(4.5, 6.5, 4.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
const sc = key.shadow.camera;
sc.near = 1; sc.far = 24; sc.left = -4; sc.right = 4; sc.top = 4; sc.bottom = -4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fb8ff, 0.6);
fill.position.set(-5.5, 2.0, 3.0);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xdfe8ff, 1.4);
rim.position.set(-3.0, 4.0, -6.0);
scene.add(rim);

// soft internal glow so the sand catches light
const sandGlow = new THREE.PointLight(0xffcf86, 0.7, 3.4, 2.0);
sandGlow.position.set(0, 0.0, 0);
scene.add(sandGlow);

/* ---------- Ground (receives shadows only) ---------- */
const groundY = -1.82;
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = groundY;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- Faux refracted caustics decal around the base ---------- */
function makeCausticTexture() {
  const size = 512;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, size, size);
  const cx = size / 2, cy = size / 2;

  const g = ctx.createRadialGradient(cx, cy, 18, cx, cy, size * 0.5);
  g.addColorStop(0.0, 'rgba(255,222,150,0.55)');
  g.addColorStop(0.35, 'rgba(255,190,110,0.16)');
  g.addColorStop(1.0, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);

  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = (0.12 + Math.random() * 0.42) * size * 0.5;
    const x = cx + Math.cos(a) * r;
    const y = cy + Math.sin(a) * r;
    const rad = 8 + Math.random() * 34;
    const bg = ctx.createRadialGradient(x, y, 0, x, y, rad);
    const alpha = 0.05 + Math.random() * 0.16;
    bg.addColorStop(0, `rgba(255,225,165,${alpha})`);
    bg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = bg;
    ctx.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const caustic = new THREE.Mesh(
  new THREE.PlaneGeometry(5.4, 5.4),
  new THREE.MeshBasicMaterial({
    map: makeCausticTexture(),
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    opacity: 0.7
  })
);
caustic.rotation.x = -Math.PI / 2;
caustic.position.y = groundY + 0.008;
scene.add(caustic);

/* ---------- The single centered object: the hourglass ---------- */
const hourglass = new THREE.Group();
scene.add(hourglass);

/* Materials */
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0.0,
  roughness: 0.03,
  transmission: 1.0,
  thickness: 0.35,
  ior: 1.5,
  transparent: true,
  side: THREE.DoubleSide,
  clearcoat: 1.0,
  clearcoatRoughness: 0.03,
  envMapIntensity: 1.5,
  attenuationColor: new THREE.Color(0xdff0ff),
  attenuationDistance: 4.0
});

const crystalMat = new THREE.MeshPhysicalMaterial({
  color: 0xcfe4ff,
  metalness: 0.0,
  roughness: 0.05,
  transmission: 0.86,
  thickness: 0.9,
  ior: 1.6,
  transparent: true,
  reflectivity: 0.65,
  clearcoat: 1.0,
  clearcoatRoughness: 0.05,
  flatShading: true,
  envMapIntensity: 1.5
});

const postMat = new THREE.MeshPhysicalMaterial({
  color: 0xd6e8ff,
  metalness: 0.0,
  roughness: 0.06,
  transmission: 0.8,
  thickness: 0.5,
  ior: 1.55,
  transparent: true,
  clearcoat: 1.0,
  clearcoatRoughness: 0.06,
  envMapIntensity: 1.4
});

const sandMat = new THREE.MeshStandardMaterial({
  color: 0xe0b04a,
  roughness: 0.78,
  metalness: 0.18,
  emissive: new THREE.Color(0x3a2708),
  emissiveIntensity: 0.6,
  envMapIntensity: 0.7,
  side: THREE.DoubleSide
});

const streamMat = new THREE.MeshStandardMaterial({
  color: 0xf3ce74,
  roughness: 0.5,
  metalness: 0.25,
  emissive: new THREE.Color(0x8a6410),
  emissiveIntensity: 0.55
});

/* Blown-glass twin-bulb profile (upper half; y from waist up) */
const topProfile = [
  [0.12, 0.00],
  [0.20, 0.10],
  [0.36, 0.24],
  [0.56, 0.46],
  [0.72, 0.72],
  [0.80, 0.98],
  [0.79, 1.20],
  [0.64, 1.40],
  [0.42, 1.54],
  [0.30, 1.62]
];

const glassPts = [];
for (let i = topProfile.length - 1; i >= 0; i--) {
  glassPts.push(new THREE.Vector2(topProfile[i][0], -topProfile[i][1]));
}
for (let i = 1; i < topProfile.length; i++) {
  glassPts.push(new THREE.Vector2(topProfile[i][0], topProfile[i][1]));
}
const glassGeo = new THREE.LatheGeometry(glassPts, 96);
const glass = new THREE.Mesh(glassGeo, glassMat);
glass.castShadow = false;      // glass casts no harsh shadow
glass.receiveShadow = false;
hourglass.add(glass);

/* Sand mound in the lower bulb */
const sandBottomPts = [
  [0.00, -0.52],
  [0.28, -0.62],
  [0.50, -0.72],
  [0.62, -0.92],
  [0.70, -1.14],
  [0.66, -1.36],
  [0.44, -1.52],
  [0.00, -1.58]
].map(p => new THREE.Vector2(p[0], p[1]));
const sandBottom = new THREE.Mesh(new THREE.LatheGeometry(sandBottomPts, 80), sandMat);
sandBottom.castShadow = true;
hourglass.add(sandBottom);

/* Draining sand funnel in the upper bulb */
const sandTopPts = [
  [0.055, 0.06],
  [0.30, 0.22],
  [0.50, 0.36],
  [0.66, 0.54],
  [0.72, 0.62],
  [0.71, 0.44],
  [0.60, 0.26],
  [0.40, 0.14],
  [0.20, 0.09],
  [0.055, 0.06]
].map(p => new THREE.Vector2(p[0], p[1]));
const sandTop = new THREE.Mesh(new THREE.LatheGeometry(sandTopPts, 80), sandMat);
sandTop.castShadow = true;
hourglass.add(sandTop);

/* Fine sand stream through the pinch */
const streamGeo = new THREE.CylinderGeometry(0.017, 0.03, 0.6, 14, 1, true);
const stream = new THREE.Mesh(streamGeo, streamMat);
stream.position.y = -0.2;
hourglass.add(stream);

/* Faceted crystal end caps */
function makeCap(centerY, flip) {
  const cap = new THREE.Mesh(
    new THREE.CylinderGeometry(0.95, 1.18, 0.18, 6, 1),
    crystalMat
  );
  cap.position.y = centerY;
  cap.rotation.y = Math.PI / 6;
  if (flip) cap.rotation.x = Math.PI;
  cap.castShadow = true;
  cap.receiveShadow = true;
  return cap;
}
const glassTopY = 1.62, glassBotY = -1.62, capH = 0.18;
hourglass.add(makeCap(glassBotY - capH / 2, false));
hourglass.add(makeCap(glassTopY + capH / 2, true));

/* Slim faceted crystal posts of the frame */
const postR = 0.985;
const postLen = (glassTopY - glassBotY);
for (let i = 0; i < 3; i++) {
  const ang = Math.PI / 2 + i * (Math.PI * 2 / 3);
  const post = new THREE.Mesh(
    new THREE.CylinderGeometry(0.052, 0.052, postLen, 6, 1),
    postMat
  );
  post.position.set(Math.cos(ang) * postR, 0, Math.sin(ang) * postR);
  post.castShadow = true;
  post.receiveShadow = true;
  hourglass.add(post);

  // small finial knobs where posts meet the caps
  for (const sy of [glassBotY, glassTopY]) {
    const knob = new THREE.Mesh(new THREE.OctahedronGeometry(0.075, 0), crystalMat);
    knob.position.set(Math.cos(ang) * postR, sy, Math.sin(ang) * postR);
    knob.castShadow = true;
    hourglass.add(knob);
  }
}

/* ---------- Resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- Animate ---------- */
function tick() {
  requestAnimationFrame(tick);
  controls.update();
  renderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
