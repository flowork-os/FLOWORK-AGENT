<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Stone Archway</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #b9c2c5;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9c2c5);
scene.fog = new THREE.Fog(0xb9c2c5, 14, 32);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.2, 5.3, 8.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.35, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 5;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI * 0.48;

scene.add(new THREE.HemisphereLight(0xdce8ed, 0x65584d, 2.0));

const sun = new THREE.DirectionalLight(0xffe4c2, 3.2);
sun.position.set(-5.5, 9, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8;
sun.shadow.camera.right = 8;
sun.shadow.camera.top = 10;
sun.shadow.camera.bottom = -3;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 28;
sun.shadow.bias = -0.00025;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x9ab8d1, 0.65);
fill.position.set(6, 4, -5);
scene.add(fill);

const stoneColors = [0x82796c, 0x91877a, 0x746c62, 0x9c9181, 0x847d72, 0xaaa08e];
const stones = stoneColors.map((color, i) => new THREE.MeshStandardMaterial({
  color,
  roughness: 0.9,
  metalness: 0.0,
  flatShading: true
}));

const keystoneMaterial = new THREE.MeshStandardMaterial({
  color: 0xb1a184,
  roughness: 0.84,
  metalness: 0,
  flatShading: true
});

const mortar = new THREE.MeshStandardMaterial({
  color: 0x393631,
  roughness: 1,
  metalness: 0
});

function addBox(w, h, d, x, y, z, material, rotation = 0) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  mesh.position.set(x, y, z);
  mesh.rotation.z = rotation;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

const pierWidth = 0.96;
const pierDepth = 0.92;
const pierCenters = [-1.99, 1.99];
const courseHeight = 0.42;
const courseGap = 0.045;
const courseCount = 6;

for (const side of [-1, 1]) {
  const cx = side * 1.99;
  addBox(pierWidth + 0.08, 2.5, pierDepth + 0.08, cx, 1.25, 0, mortar);

  for (let row = 0; row < courseCount; row++) {
    const y = 0.23 + row * (courseHeight + courseGap);
    const split = row % 3 === 1;
    const offset = row % 2 === 0 ? 0.018 : -0.018;

    if (!split) {
      addBox(
        pierWidth - 0.055,
        courseHeight,
        pierDepth - 0.04,
        cx + offset,
        y,
        0,
        stones[(row + (side > 0 ? 2 : 0)) % stones.length],
        (row % 2 ? -1 : 1) * 0.006
      );
    } else {
      const leftWidth = 0.48;
      const rightWidth = 0.395;
      addBox(
        leftWidth,
        courseHeight,
        pierDepth - 0.04,
        cx - 0.24 + offset,
        y,
        0,
        stones[(row + 1) % stones.length],
        0.004
      );
      addBox(
        rightWidth,
        courseHeight,
        pierDepth - 0.04,
        cx + 0.202 + offset,
        y,
        0,
        stones[(row + 3) % stones.length],
        -0.005
      );
    }
  }
}

const springY = 2.53;
const innerRadius = 1.54;
const outerRadius = 2.27;
const archDepth = 0.86;
const segmentCount = 15;
const angularGap = 0.018;

function makeVoussoir(startAngle, endAngle, depth) {
  const shape = new THREE.Shape();
  const outerSteps = 8;
  const innerSteps = 8;

  for (let i = 0; i <= outerSteps; i++) {
    const t = startAngle + (endAngle - startAngle) * i / outerSteps;
    const x = outerRadius * Math.cos(t);
    const y = springY + outerRadius * Math.sin(t);
    if (i === 0) shape.moveTo(x, y);
    else shape.lineTo(x, y);
  }

  for (let i = innerSteps; i >= 0; i--) {
    const t = startAngle + (endAngle - startAngle) * i / innerSteps;
    shape.lineTo(innerRadius * Math.cos(t), springY + innerRadius * Math.sin(t));
  }

  shape.closePath();

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: true,
    bevelSegments: 1,
    bevelSize: 0.025,
    bevelThickness: 0.025,
    curveSegments: 8
  });
  geometry.translate(0, 0, -depth / 2);
  geometry.computeVertexNormals();
  return geometry;
}

const backingGeometry = new THREE.RingGeometry(innerRadius - 0.025, outerRadius + 0.025, 96, 1, 0, Math.PI);
const backing = new THREE.Mesh(backingGeometry, mortar);
backing.position.set(0, springY, -0.01);
backing.rotation.x = 0;
backing.castShadow = true;
backing.receiveShadow = true;
scene.add(backing);

for (let i = 0; i < segmentCount; i++) {
  const a0 = i * Math.PI / segmentCount + angularGap;
  const a1 = (i + 1) * Math.PI / segmentCount - angularGap;
  const isKeystone = i === Math.floor(segmentCount / 2);
  const geometry = makeVoussoir(a0, a1, archDepth);
  const block = new THREE.Mesh(geometry, isKeystone ? keystoneMaterial : stones[(i * 3 + 1) % stones.length]);
  block.castShadow = true;
  block.receiveShadow = true;
  block.position.z = 0.015;
  scene.add(block);
}

addBox(1.12, 0.22, 1.01, -1.98, 2.58, 0, stones[3], -0.004);
addBox(1.12, 0.22, 1.01, 1.98, 2.58, 0, stones[4], 0.004);

const copingY = 4.91;
const copingHeight = 0.42;
const copingWidths = [0.9, 0.94, 0.94, 0.94, 0.9];
const copingDepth = 1.04;
let cursor = -2.31;

addBox(4.76, copingHeight + 0.08, copingDepth + 0.07, 0, copingY, 0, mortar);

for (let i = 0; i < copingWidths.length; i++) {
  const w = copingWidths[i];
  const x = cursor + w / 2;
  addBox(
    w - 0.045,
    copingHeight,
    copingDepth,
    x,
    copingY,
    0,
    stones[(i + 4) % stones.length],
    (i % 2 === 0 ? 1 : -1) * 0.004
  );
  cursor += w;
}

const capTopY = 5.18;
addBox(4.92, 0.16, 1.12, 0, capTopY, 0, stones[5], 0);

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x77766c,
  roughness: 1,
  metalness: 0
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.015;
ground.receiveShadow = true;
scene.add(ground);

const pathMaterial = new THREE.MeshStandardMaterial({
  color: 0x8f897c,
  roughness: 0.96,
  metalness: 0
});
const path = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.08, 7.5), pathMaterial);
path.position.set(0, 0.02, 2.3);
path.receiveShadow = true;
scene.add(path);

for (let i = 0; i < 10; i++) {
  const slab = new THREE.Mesh(
    new THREE.BoxGeometry(2.55, 0.025, 0.62),
    new THREE.MeshStandardMaterial({ color: 0x777267, roughness: 1 })
  );
  slab.position.set(0, 0.075, -0.55 + i * 0.62);
  slab.receiveShadow = true;
  scene.add(slab);
}

const lintelShadow = new THREE.Mesh(
  new THREE.BoxGeometry(4.58, 0.05, 0.94),
  new THREE.MeshStandardMaterial({ color: 0x514b42, roughness: 1 })
);
lintelShadow.position.set(0, 4.69, 0.02);
lintelShadow.castShadow = true;
scene.add(lintelShadow);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  controls.update(clock.getDelta());
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
