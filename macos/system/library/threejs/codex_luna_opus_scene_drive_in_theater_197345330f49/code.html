<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drive-In Theater Night</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#050817}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060a1b);
scene.fog = new THREE.FogExp2(0x111a3a, 0.0085);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 500);
camera.position.set(34, 22, 42);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;
controls.target.set(0,6,-9);
controls.minDistance = 20;
controls.maxDistance = 82;
controls.maxPolarAngle = Math.PI * 0.47;

let seed = 1947;
function rnd(min=0,max=1){
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return min + (seed / 4294967296) * (max-min);
}
function mat(color,rough=.7,metal=0,emissive=0x000000,ei=0){
  return new THREE.MeshStandardMaterial({
    color, roughness:rough, metalness:metal,
    emissive, emissiveIntensity:ei
  });
}
function box(w,h,d,material,x=0,y=0,z=0){
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  m.position.set(x,y,z);
  m.castShadow=true; m.receiveShadow=true;
  scene.add(m); return m;
}
function cyl(r1,r2,h,material,x=0,y=0,z=0,seg=16){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),material);
  m.position.set(x,y,z);
  m.castShadow=true; m.receiveShadow=true;
  scene.add(m); return m;
}
function sph(r,material,x=0,y=0,z=0){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r,20,14),material);
  m.position.set(x,y,z);
  m.castShadow=true; m.receiveShadow=true;
  scene.add(m); return m;
}
function torus(R,r,material,x=0,y=0,z=0,rx=0,ry=0,rz=0){
  const m = new THREE.Mesh(new THREE.TorusGeometry(R,r,10,24),material);
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  m.castShadow=true; m.receiveShadow=true;
  scene.add(m); return m;
}
function cylinderBetween(a,b,r,material){
  const dir = new THREE.Vector3().subVectors(b,a);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,dir.length(),10),material);
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
  m.castShadow=true; scene.add(m); return m;
}

const groundMat = mat(0x151b28,.95);
box(110,.35,110,groundMat,0,-.18,0);

const asphalt = new THREE.MeshStandardMaterial({color:0x202536,roughness:.98});
box(94,.08,68,asphalt,0,.03,7);

const grass = mat(0x17251e,1);
box(110,.12,14,grass,0,.1,-31);

const skyCanvas = document.createElement('canvas');
skyCanvas.width=32; skyCanvas.height=256;
const skyCtx=skyCanvas.getContext('2d');
const skyGrad=skyCtx.createLinearGradient(0,0,0,256);
skyGrad.addColorStop(0,'#020515');
skyGrad.addColorStop(.46,'#0a1230');
skyGrad.addColorStop(1,'#272b58');
skyCtx.fillStyle=skyGrad; skyCtx.fillRect(0,0,32,256);
const skyTex=new THREE.CanvasTexture(skyCanvas);
const skyMat=new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,depthWrite:false});
const sky=new THREE.Mesh(new THREE.SphereGeometry(85,32,18),skyMat);
scene.add(sky);

const starGeo = new THREE.BufferGeometry();
const starPositions=[];
for(let i=0;i<520;i++){
  const a=rnd(0,Math.PI*2), y=rnd(.12,.88), rad=82;
  const rr=Math.sqrt(1-y*y);
  starPositions.push(Math.cos(a)*rr*rad,y*rad-4,Math.sin(a)*rr*rad);
}
starGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPositions,3));
const starMat=new THREE.PointsMaterial({color:0xfff4d1,size:.22,sizeAttenuation:true});
const stars=new THREE.Points(starGeo,starMat);
scene.add(stars);

const hillMat=mat(0x10182a,1);
for(let i=0;i<8;i++){
  const h=rnd(7,15), w=rnd(18,30);
  const hill=sph(1,hillMat,rnd(-50,50),h/2-1,-42-rnd(0,5));
  hill.scale.set(w,h,w*.35);
}
for(let i=0;i<4;i++){
  const h=rnd(4,9), w=rnd(14,24);
  const hill=sph(1,mat(0x182139,1),rnd(-50,50),h/2,-30-rnd(0,5));
  hill.scale.set(w,h,w*.3);
}

const moonMat=mat(0xffe9ad,.48,0,0xffc965,.32);
const moon=sph(6.2,moonMat,27,26,-43);
const moonGlowMat=new THREE.MeshBasicMaterial({color:0xd7b970,transparent:true,opacity:.055});
const moonGlow=new THREE.Mesh(new THREE.SphereGeometry(8.2,24,16),moonGlowMat);
moonGlow.position.copy(moon.position); scene.add(moonGlow);
const moonLight=new THREE.PointLight(0xffd89d,1.2,100,2);
moonLight.position.set(27,25,-36); moonLight.castShadow=true; scene.add(moonLight);

const warm=mat(0xffa63d,.35,0,0xff7a18,2.2);
const red=mat(0x9f263c,.45,0,0x6d1028,.15);
const cream=mat(0xffdca1,.65);
const teal=mat(0x197782,.38,0,0x073c47,.25);
const chrome=mat(0xbac8cd,.18,.92);
const black=mat(0x10131c,.25,.3);
const wood=mat(0x51332a,.8);
const yellow=mat(0xf3c44e,.42,0,0x8e5e12,.2);

const screenGroup=new THREE.Group();
screenGroup.position.set(0,0,-24);
scene.add(screenGroup);

box(1.1,18,1.2,mat(0x252832,.7),-16,9.3,-24);
box(1.1,18,1.2,mat(0x252832,.7),16,9.3,-24);
box(34,1.1,1.2,mat(0x252832,.7),0,18,-24);
box(34,1.1,1.2,mat(0x252832,.7),0,.55,-24);
box(37,.55,1.8,chrome,0,19,-24);

const filmCanvas=document.createElement('canvas');
filmCanvas.width=640; filmCanvas.height=320;
const filmCtx=filmCanvas.getContext('2d');
const filmTex=new THREE.CanvasTexture(filmCanvas);
filmTex.colorSpace=THREE.SRGBColorSpace;
const filmMat=new THREE.MeshBasicMaterial({map:filmTex});
const film=new THREE.Mesh(new THREE.PlaneGeometry(32,16),filmMat);
film.position.set(0,9.5,-24.72);
screenGroup.add(film);

for(let i=0;i<7;i++){
  const post=cyl(.16,.16,4,chrome,-15+i*5,1.8,-24,10);
  post.castShadow=false;
}
const screenBulb=new THREE.PointLight(0xff8b45,2.4,30,2);
screenBulb.position.set(0,9,-20); scene.add(screenBulb);

const marqueeMat=mat(0xf8d76c,.3,0,0xffa600,1.4);
for(let x=-13;x<=13;x+=2.6){
  sph(.14,marqueeMat,x,18.65,-25.4);
}

const standGroup=new THREE.Group();
standGroup.position.set(25,0,-19);
scene.add(standGroup);
function standBox(w,h,d,m,x,y,z){
  const o=box(w,h,d,m); o.position.set(x+25,y,z-19); standGroup.add(o); scene.remove(o); return o;
}
const standBody=standBox(14,7,7,teal,0,4.1,0);
standBody.material=red;
standBox(14,.42,7,cream,0,8,-.05);
standBox(15,.55,7.8,chrome,0,8.48,0);
standBox(2.2,3.6,.25,black,-4.2,4,-3.56);
standBox(2.2,3.6,.25,black,4.2,4,-3.56);
standBox(7.7,2.4,.3,mat(0x231827,.4),0,6.1,-3.62);
standBox(6.2,.22,.34,warm,0,6.1,-3.82);
for(let x=-5;x<=5;x+=2.5) standBox(.12,2.2,.32,chrome,x,4.3,-3.78);
standBox(3,.6,2,wood,0,1.3,-4.2);
for(let i=0;i<10;i++) standBox(.33,.33,.33,yellow,rnd(-5.2,5.2),rnd(1.6,4.9),-3.9);
const popcornSign=standBox(5.5,2.3,.24,cream,0,11,-.2);
const signGlow=standBox(4.8,1.6,.3,warm,0,11,-.37);
standBox(4.5,.12,.18,red,0,11,-.58);
for(let i=0;i<8;i++) standBox(.18,.18,.18,marqueeMat,-2+i*.58,11,-.62);
const popcornLight=new THREE.PointLight(0xff812c,1.7,18,2);
popcornLight.position.set(25,11,-24); scene.add(popcornLight);

const signCanvas=document.createElement('canvas');
signCanvas.width=512; signCanvas.height=180;
const signCtx=signCanvas.getContext('2d');
signCtx.fillStyle='#f8d88d'; signCtx.fillRect(0,0,512,180);
signCtx.fillStyle='#b3263b'; signCtx.font='bold 58px sans-serif';
signCtx.textAlign='center'; signCtx.fillText('POPCORN',256,112);
const signTex=new THREE.CanvasTexture(signCanvas);
const signFace=new THREE.Mesh(new THREE.PlaneGeometry(4.5,1.58),new THREE.MeshBasicMaterial({map:signTex}));
signFace.position.set(25,11,-19.62); scene.add(signFace);

const booth=box(5,4.2,4.2,red,39,2.25,-7);
box(5.4,.28,4.6,chrome,39,4.48,-7);
box(4.2,1.55,.25,black,39,3.2,-9.15);
box(5.5,.3,4.9,cream,39,4.75,-7);
cyl(.45,.45,3.4,chrome,36.6,2.5,-7,12);
cyl(.45,.45,3.4,chrome,41.4,2.5,-7,12);
const boothNeon=mat(0x54f4f5,.25,0,0x2acbd1,4);
box(5.2,.13,.16,boothNeon,39,4.2,-9.25);
box(.13,4,.16,boothNeon,36.45,2.3,-9.25);
box(.13,4,.16,boothNeon,41.55,2.3,-9.25);
const ticketCanvas=document.createElement('canvas');
ticketCanvas.width=400; ticketCanvas.height=150;
const ticketCtx=ticketCanvas.getContext('2d');
ticketCtx.fillStyle='#12233d'; ticketCtx.fillRect(0,0,400,150);
ticketCtx.strokeStyle='#ffcf5b'; ticketCtx.lineWidth=8; ticketCtx.strokeRect(8,8,384,134);
ticketCtx.fillStyle='#ffcf5b'; ticketCtx.font='bold 43px sans-serif';
ticketCtx.textAlign='center'; ticketCtx.fillText('TICKETS',200,95);
const ticketTex=new THREE.CanvasTexture(ticketCanvas);
const ticketFace=new THREE.Mesh(new THREE.PlaneGeometry(4.4,1.65),new THREE.MeshBasicMaterial({map:ticketTex}));
ticketFace.position.set(39,3.25,-9.4); scene.add(ticketFace);

for(let i=0;i<13;i++){
  const x=-42+i*7;
  cyl(.13,.13,4,chrome,x,2,-26,10);
  const bulb=sph(.27,i%3===0?warm:yellow,x,4.1,-26);
  bulb.material=marqueeMat;
  if(i<12){
    const next=new THREE.Vector3(-42+(i+1)*7,4.1,-26);
    cylinderBetween(new THREE.Vector3(x,4.1,-26),next,.035,black);
  }
}

function makeCar(x,z,color,scale=1,angle=0){
  const g=new THREE.Group();
  g.position.set(x,0,z); g.rotation.y=angle; g.scale.setScalar(scale);
  scene.add(g);
  const bodyMat=mat(color,.35,.25);
  const body=new THREE.Mesh(new THREE.BoxGeometry(5.8,1.25,2.35),bodyMat);
  body.position.y=1.05; body.castShadow=true; body.receiveShadow=true; g.add(body);
  const hood=new THREE.Mesh(new THREE.BoxGeometry(1.7,.42,2.15),bodyMat);
  hood.position.set(-2.15,1.67,0); hood.castShadow=true; g.add(hood);
  const cabin=new THREE.Mesh(new THREE.CapsuleGeometry(1.2,.95,6,12),bodyMat);
  cabin.rotation.z=Math.PI/2; cabin.scale.set(.72,.72,1);
  cabin.position.set(.65,2.05,0); cabin.castShadow=true; g.add(cabin);
  const windowMat=mat(0x162b3c,.12,.4);
  const win1=new THREE.Mesh(new THREE.BoxGeometry(1.28,.55,1.92),windowMat);
  win1.position.set(.28,2.35,0); win1.rotation.z=-.12; g.add(win1);
  const win2=new THREE.Mesh(new THREE.BoxGeometry(.82,.55,1.92),windowMat);
  win2.position.set(1.28,2.3,0); win2.rotation.z=.18; g.add(win2);
  for(const wx of [-1.85,1.75]){
    const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.63,.63,.32,18),black);
    wheel.rotation.z=Math.PI/2; wheel.position.set(wx,.65,1.18);
    wheel.castShadow=true; g.add(wheel);
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.34,14),chrome);
    hub.rotation.z=Math.PI/2; hub.position.set(wx,.65,1.36); g.add(hub);
    const wheel2=wheel.clone(); wheel2.position.z=-1.18; g.add(wheel2);
    const hub2=hub.clone(); hub2.position.z=-1.36; g.add(hub2);
  }
  const bumper=new THREE.Mesh(new THREE.BoxGeometry(.22,.25,2.5),chrome);
  bumper.position.set(-3.02,.92,0); g.add(bumper);
  const bumper2=bumper.clone(); bumper2.position.x=3.02; g.add(bumper2);
  const grille=new THREE.Mesh(new THREE.BoxGeometry(.08,.55,1.45),chrome);
  grille.position.set(-3.14,1.25,0); g.add(grille);
  for(const side of [-1,1]){
    const fin=new THREE.Mesh(new THREE.ConeGeometry(.62,2.55,4),bodyMat);
    fin.rotation.z=Math.PI/2; fin.rotation.y=side*.18;
    fin.scale.set(1,.75,.5);
    fin.position.set(2.55,1.8,side*.72); g.add(fin);
    const tail=new THREE.Mesh(new THREE.SphereGeometry(.17,10,8),warm);
    tail.position.set(2.94,1.35,side*.82); g.add(tail);
  }
  const line=new THREE.Mesh(new THREE.BoxGeometry(5.2,.08,2.42),chrome);
  line.position.y=1.48; g.add(line);
  return g;
}

const carColors=[0x325b86,0xb7363e,0x3c7b6d,0xd2a746,0x7d4772,0x8c3d2c];
const cars=[];
for(let row=0;row<3;row++){
  for(let i=0;i<6;i++){
    const x=-25+i*9+rnd(-.65,.65);
    const z=15+row*8+rnd(-.25,.25);
    const c=makeCar(x,z,carColors[(row*6+i)%carColors.length],.87,row===0?0:Math.PI);
    cars.push(c);
  }
}

const poleMat=mat(0x59616a,.38,.75);
for(let row=0;row<3;row++){
  for(let i=0;i<7;i++){
    const x=-29+i*9;
    const z=11+row*8;
    cyl(.12,.12,4,poleMat,x,2.1,z,10);
    box(.18,.5,.55,poleMat,x,4.22,z);
    const speaker=box(.62,.86,.34,black,x,4.05,z-.18);
    speaker.rotation.x=.16;
    for(let k=0;k<3;k++) torus(.1,.025,chrome,x-.14+k*.14,4.06,z-.38,-Math.PI/2,0,0);
  }
}

const aisleMat=mat(0x0c111b,.65);
for(let x=-30;x<=30;x+=10) box(.12,.025,29,aisleMat,x,.09,19);

const lampPosts=[];
for(const x of [-37,37]){
  for(const z of [2,21]){
    cyl(.14,.2,6,chrome,x,3,z,12);
    const lamp=sph(.35,warm,x,6.15,z);
    const light=new THREE.PointLight(0xff943e,1.25,15,2);
    light.position.set(x,6,z); scene.add(light);
    lampPosts.push(lamp);
  }
}
for(let i=0;i<20;i++){
  const x=rnd(-45,45), z=rnd(0,38);
  cyl(.035,.035,.15,chrome,x,.2,z,6);
  sph(.07,i%2?yellow:warm,x,.32,z);
}

const ambient=new THREE.HemisphereLight(0x52689e,0x202016,1.3);
scene.add(ambient);
const key=new THREE.DirectionalLight(0xffd3a0,2.4);
key.position.set(-22,34,18);
key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-55; key.shadow.camera.right=55;
key.shadow.camera.top=55; key.shadow.camera.bottom=-35;
key.shadow.camera.near=1; key.shadow.camera.far=110;
scene.add(key);

const fill=new THREE.DirectionalLight(0x5a75c8,.65);
fill.position.set(25,18,-35); scene.add(fill);

const puddleMat=new THREE.MeshStandardMaterial({
  color:0x17243a,roughness:.12,metalness:.55,transparent:true,opacity:.75
});
for(let i=0;i<13;i++){
  const p=new THREE.Mesh(new THREE.CircleGeometry(rnd(.4,1.7),20),puddleMat);
  p.rotation.x=-Math.PI/2;
  p.rotation.z=rnd(0,Math.PI);
  p.position.set(rnd(-43,43),.11,rnd(-3,40));
  p.scale.y=rnd(.3,.7); scene.add(p);
}

const filmTime={value:0};
function drawFilm(t){
  const w=filmCanvas.width,h=filmCanvas.height;
  const g=filmCtx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#11052f'); g.addColorStop(.5,'#0b4266'); g.addColorStop(1,'#280d3b');
  filmCtx.fillStyle=g; filmCtx.fillRect(0,0,w,h);
  filmCtx.globalAlpha=.27;
  for(let i=0;i<14;i++){
    filmCtx.fillStyle=i%2?'#ff537e':'#40e0d0';
    filmCtx.beginPath();
    const xx=(i*79+t*22)%760-60;
    filmCtx.arc(xx,150+Math.sin(t*.001+i)*68,40+i*5,0,Math.PI*2);
    filmCtx.fill();
  }
  filmCtx.globalAlpha=1;
  filmCtx.strokeStyle='#ffdb65'; filmCtx.lineWidth=8;
  filmCtx.beginPath();
  filmCtx.moveTo(0,230);
  for(let x=0;x<=w;x+=20) filmCtx.lineTo(x,220+Math.sin(x*.035+t*.002)*32);
  filmCtx.stroke();
  filmCtx.fillStyle='#f7e8a2'; filmCtx.font='bold 32px sans-serif';
  filmCtx.textAlign='center'; filmCtx.fillText('MIDNIGHT MOTION',w/2,62);
  filmCtx.fillStyle='rgba(255,255,255,.1)';
  for(let y=0;y<h;y+=10) filmCtx.fillRect(0,y,w,2);
  filmTex.needsUpdate=true;
}

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  drawFilm(t);
  stars.rotation.y=t*.003;
  moonGlow.scale.setScalar(1+Math.sin(t*.35)*.025);
  for(let i=0;i<lampPosts.length;i++){
    lampPosts[i].material.emissiveIntensity=1.4+Math.sin(t*3+i)*.35;
  }
  popcornLight.intensity=1.65+Math.sin(t*4)*.25;
  screenBulb.intensity=2.2+Math.sin(t*2.2)*.3;
  standGroup.rotation.y=Math.sin(t*.45)*.004;
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
