<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Japanese Tea House Room</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#171918}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const rand=(()=>{let s=1729;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}})();
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9da99e);
scene.fog=new THREE.Fog(0x9da99e,18,38);

const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,80);
camera.position.set(10.5,7.5,12.5);
camera.lookAt(0,2.2,0);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.18;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.055;
controls.autoRotate=true;
controls.autoRotateSpeed=.35;
controls.minDistance=8;
controls.maxDistance=22;
controls.maxPolarAngle=Math.PI*.48;
controls.target.set(0,2.25,0);

const mats={
 wood:new THREE.MeshStandardMaterial({color:0x4a3021,roughness:.72}),
 darkWood:new THREE.MeshStandardMaterial({color:0x241b15,roughness:.58}),
 beam:new THREE.MeshStandardMaterial({color:0x38271c,roughness:.68}),
 tatami:new THREE.MeshStandardMaterial({color:0xaaa36d,roughness:.92}),
 tatamiEdge:new THREE.MeshStandardMaterial({color:0x736742,roughness:.86}),
 plaster:new THREE.MeshStandardMaterial({color:0xd5cdb9,roughness:1}),
 shadowPlaster:new THREE.MeshStandardMaterial({color:0xb9b19f,roughness:1}),
 paper:new THREE.MeshStandardMaterial({color:0xf3ead0,roughness:.9,transparent:true,opacity:.7,side:THREE.DoubleSide}),
 shojiWood:new THREE.MeshStandardMaterial({color:0x66513c,roughness:.8}),
 iron:new THREE.MeshStandardMaterial({color:0x17191a,roughness:.34,metalness:.72}),
 black:new THREE.MeshStandardMaterial({color:0x111213,roughness:.46}),
 ceramic:new THREE.MeshStandardMaterial({color:0xd8d0bd,roughness:.25}),
 redCeramic:new THREE.MeshStandardMaterial({color:0x713a2b,roughness:.3}),
 blueCeramic:new THREE.MeshStandardMaterial({color:0x344c57,roughness:.27}),
 gold:new THREE.MeshStandardMaterial({color:0xb18a48,roughness:.25,metalness:.5}),
 moss:new THREE.MeshStandardMaterial({color:0x4f633d,roughness:.95}),
 stone:new THREE.MeshStandardMaterial({color:0x817d6e,roughness:1}),
 sand:new THREE.MeshStandardMaterial({color:0xc4b88e,roughness:1}),
 leaf:new THREE.MeshStandardMaterial({color:0x526b3b,roughness:.75,side:THREE.DoubleSide}),
 blossom:new THREE.MeshStandardMaterial({color:0xc18d82,roughness:.5}),
 scroll:new THREE.MeshStandardMaterial({color:0xe8ddc3,roughness:.85}),
 ink:new THREE.MeshStandardMaterial({color:0x29251f,roughness:.8})
};

function box(n,x,y,z,sx,sy,sz,m,cast=true,receive=true){
 const q=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);
 q.name=n;q.position.set(x,y,z);q.castShadow=cast;q.receiveShadow=receive;scene.add(q);return q;
}
function cyl(n,x,y,z,r,h,m,radial=12){
 const q=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,radial),m);
 q.name=n;q.position.set(x,y,z);q.castShadow=true;q.receiveShadow=true;scene.add(q);return q;
}
function sphere(n,x,y,z,r,m){
 const q=new THREE.Mesh(new THREE.SphereGeometry(r,16,10),m);
 q.name=n;q.position.set(x,y,z);q.castShadow=true;q.receiveShadow=true;scene.add(q);return q;
}
function curve(points,m,t=.035){
 const c=new THREE.CatmullRomCurve3(points);
 const q=new THREE.Mesh(new THREE.TubeGeometry(c,18,t,6,false),m);
 q.castShadow=true;scene.add(q);return q;
}
function textureCanvas(draw,w=256,h=256){
 const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");draw(x,w,h);
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
const tatamiTex=textureCanvas((x,w,h)=>{
 x.fillStyle="#a8a16d";x.fillRect(0,0,w,h);
 for(let i=0;i<900;i++){let y=rand()*h;x.strokeStyle=rand()>.5?"#c4ba7d":"#817a4f";x.globalAlpha=.18;x.lineWidth=1;x.beginPath();x.moveTo(0,y);x.lineTo(w,y+(rand()-.5)*3);x.stroke()}
 x.globalAlpha=1;
},512,512);
mats.tatami.map=new THREE.MeshStandardMaterial({map:tatamiTex,color:0xffffff,roughness:.94});

function tatami(x,z,rot=0){
 const g=new THREE.Group();g.position.set(x,.12,z);g.rotation.y=rot;
 const a=new THREE.Mesh(new THREE.BoxGeometry(3.72,.18,1.82),mats.tatami.map);
 a.castShadow=true;a.receiveShadow=true;g.add(a);
 const e=new THREE.Mesh(new THREE.BoxGeometry(3.82,.2,.08),mats.tatamiEdge);e.position.z=-.91;g.add(e);
 scene.add(g);return g;
}
for(let r=0;r<2;r++)for(let c=0;c<3;c++)tatami((c-1)*3.85,(r-.5)*1.92,c===1?Math.PI/2:0);

box("earth",0,-.13,0,25,.2,23,mats.sand,false,true);
box("rear plaster wall",0,4.2,-5.35,18,8,.25,mats.plaster,false,true);
box("left wall",-8.9,4.2,0,.25,8,11,mats.plaster,false,true);
box("right wall",8.9,4.2,0,.25,8,11,mats.plaster,false,true);
box("ceiling",0,8.25,0,18,.18,11,mats.darkWood,false,true);

for(const x of [-8.65,-5.9,5.9,8.65])box("corner post",x,4.1,-5.05,.28,8,.28,mats.beam);
for(const z of [-5.05,4.8])box("top beam",0,7.8,z,17.4,.34,.34,mats.beam);
for(const x of [-8.65,8.65])box("side beam",x,7.8,0,.34,.34,10,mats.beam);

function shojiPanel(x,z,rot,open=false){
 const g=new THREE.Group();g.position.set(x,4.0,z);g.rotation.y=rot;
 const frame=new THREE.Mesh(new THREE.BoxGeometry(2.75,6.7,.13),mats.shojiWood);frame.castShadow=true;g.add(frame);
 const paper=new THREE.Mesh(new THREE.PlaneGeometry(2.42,6.35),mats.paper);paper.position.z=.075;g.add(paper);
 for(let i=1;i<4;i++){let h=box("shoji horizontal",x,0,z,0,0,0,mats.shojiWood);h.parent=null;h=new THREE.Mesh(new THREE.BoxGeometry(2.54,.075,.16),mats.shojiWood);h.position.set(0,-3.35+i*1.66,.14);g.add(h)}
 for(let i=1;i<3;i++){let v=new THREE.Mesh(new THREE.BoxGeometry(.075,6.48,.16),mats.shojiWood);v.position.set(-1.21+i*.81,0,.14);g.add(v)}
 g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 scene.add(g);return g;
}
const shojiLeft=shojiPanel(-6.7,-1.0,0);
const shojiRight=shojiPanel(6.7,-1.0,0);
const openPanel=shojiPanel(5.2,4.0,Math.PI/2,true);
openPanel.scale.set(.72,1,1);
openPanel.position.set(5.55,4,4.65);
openPanel.rotation.y=Math.PI/2;
box("open screen threshold",6.8,.3,4.75,3.6,.15,.18,mats.darkWood);

function shojiGlow(panel){
 const light=new THREE.PointLight(0xffd9a0,1.5,7,2);
 light.position.set(panel.position.x,panel.position.y,panel.position.z+.5);
 scene.add(light);return light;
}
const glow1=shojiGlow(shojiLeft),glow2=shojiGlow(shojiRight);
glow1.position.set(-6.6,4,-4.5);glow2.position.set(6.6,4,-4.5);

const alcove= new THREE.Group();alcove.position.set(0,0,-5.12);scene.add(alcove);
box("tokonoma backing",0,4.15,-5.18,4.9,6.8,.18,mats.shadowPlaster,false,true);
box("alcove floor",0,.3,-4.65,4.7,.22,1.35,mats.darkWood);
box("alcove lintel",0,7.2,-5.02,5.2,.3,.3,mats.beam);
box("alcove left trim",-2.5,4.15,-5.02,.22,6.6,.3,mats.beam);
box("alcove right trim",2.5,4.15,-5.02,.22,6.6,.3,mats.beam);

box("scroll top",0,6.5,-4.93,1.38,.12,.08,mats.wood);
box("scroll bottom",0,2.28,-4.9,1.28,.13,.1,mats.wood);
const scrollMat=new THREE.MeshBasicMaterial({map:textureCanvas((x,w,h)=>{
 x.fillStyle="#e7ddc5";x.fillRect(0,0,w,h);x.fillStyle="#252522";x.font="bold 54px serif";x.textAlign="center";x.fillText("静",w/2,83);x.fillText("寂",w/2,158);x.fillText("一",w/2,222);
},256,300)});
const scrollMesh=new THREE.Mesh(new THREE.PlaneGeometry(1.22,4.1),scrollMat);scrollMesh.position.set(0,4.38,-4.84);scene.add(scrollMesh);

function branch(points){return curve(points,mats.darkWood,.035)}
branch([new THREE.Vector3(-1.5,.52,-4.35),new THREE.Vector3(-1.25,1.25,-4.4),new THREE.Vector3(-1.05,2,-4.42)]);
branch([new THREE.Vector3(-1.23,1.25,-4.4),new THREE.Vector3(-.65,1.65,-4.42),new THREE.Vector3(-.48,2.18,-4.42)]);
branch([new THREE.Vector3(-1.08,1.8,-4.42),new THREE.Vector3(-1.7,2.1,-4.42),new THREE.Vector3(-1.86,2.55,-4.42)]);
const vase=cyl("ikebana vase",-1.45,.88,-4.35,.38,.78, mats.blueCeramic,20);
vase.scale.x=.8;
for(const p of [[-.55,2.2,-4.43],[-1.88,2.55,-4.43],[-1.05,2.03,-4.4]]){
 sphere("ikebana blossom",p[0],p[1],p[2],.15,mats.blossom);
 for(let j=0;j<5;j++){const a=j*Math.PI*2/5;sphere("petal",p[0]+Math.cos(a)*.13,p[1]+Math.sin(a)*.13,p[2]-.02,.09,mats.blossom)}
}

const table=new THREE.Group();table.position.set(0,1.14,.45);scene.add(table);
const top=new THREE.Mesh(new THREE.BoxGeometry(4.15,.24,2.25),mats.darkWood);top.castShadow=true;top.receiveShadow=true;table.add(top);
for(const x of [-1.65,1.65])for(const z of [-.82,.82]){
 const leg=new THREE.Mesh(new THREE.BoxGeometry(.25,.92,.25),mats.wood);leg.position.set(x,-.56,z);leg.castShadow=true;table.add(leg);
}
const apron=new THREE.Mesh(new THREE.BoxGeometry(3.7,.35,.18),mats.wood);apron.position.y=-.35;table.add(apron);

function bowl(x,z,m=mats.ceramic){
 const b=new THREE.Mesh(new THREE.SphereGeometry(.35,20,10,0,Math.PI*2,0,Math.PI*.55),m);b.scale.y=.55;b.position.set(x,1.48,z);b.castShadow=true;table.add(b);return b;
}
bowl(-1.2,.15,mats.redCeramic);bowl(1.15,-.35,mats.ceramic);
cyl("tea whisk",-.55,.1,.3,.06,.7,mats.gold,10).rotation.z=-.55;
const whisk=new THREE.Mesh(new THREE.ConeGeometry(.16,.42,12),mats.gold);whisk.position.set(-.73,1.6,.5);whisk.rotation.z=-.45;whisk.castShadow=true;table.add(whisk);
for(let i=0;i<3;i++)bowl(-.25+i*.28,-.72,mats.blueCeramic);

const kettle=new THREE.Group();kettle.position.set(.35,1.52,.35);table.add(kettle);
const body=new THREE.Mesh(new THREE.SphereGeometry(.65,24,16),mats.iron);body.scale.set(1,.82,1);body.castShadow=true;kettle.add(body);
const lid=new THREE.Mesh(new THREE.CylinderGeometry(.29,.34,.08,20),mats.iron);lid.position.y=.52;lid.castShadow=true;kettle.add(lid);
const knob=new THREE.Mesh(new THREE.SphereGeometry(.09,12,8),mats.gold);knob.position.y=.61;kettle.add(knob);
const spout=curve([new THREE.Vector3(.48,.2,0),new THREE.Vector3(.96,.4,0),new THREE.Vector3(1.2,.77,0)],mats.iron,.12);spout.position.set(0,0,0);kettle.add(spout);
const handle=curve([new THREE.Vector3(-.48,.3,0),new THREE.Vector3(-.78,1.25,0),new THREE.Vector3(.42,1.35,0)],mats.iron,.07);kettle.add(handle);

const steamTex=textureCanvas((x,w,h)=>{let g=x.createRadialGradient(w/2,h/2,1,w/2,h/2,w/2);g.addColorStop(0,"rgba(255,255,235,.5)");g.addColorStop(1,"rgba(255,255,235,0)");x.fillStyle=g;x.fillRect(0,0,w,h)},64,64);
const steamGeo=new THREE.BufferGeometry();const steamPos=[];const steamData=[];
for(let i=0;i<18;i++){steamPos.push(.35+(rand()-.5)*.22,2.24+rand()*.2,.35+(rand()-.5)*.22);steamData.push({phase:rand()*7,amp:.08+rand()*.1})}
steamGeo.setAttribute("position",new THREE.Float32BufferAttribute(steamPos,3));
const steam=new THREE.Points(steamGeo,new THREE.PointsMaterial({map:steamTex,size:.34,transparent:true,depthWrite:false,opacity:.45,color:0xfff4dc}));
scene.add(steam);

function teaTray(x,z){
 box("tea tray",x,1.43,z,1.05,.08,.65,mats.wood);
 for(let i=0;i<2;i++)bowl(x-.3+i*.6,z,mats.ceramic);
}
teaTray(-1.35,-.48);

function bonsai(){
 const g=new THREE.Group();g.position.set(3.35,.35,-3.62);scene.add(g);
 const pot=new THREE.Mesh(new THREE.CylinderGeometry(.58,.48,.42,20),mats.blueCeramic);pot.position.y=.27;pot.castShadow=true;g.add(pot);
 const trunk=curve([new THREE.Vector3(3.35,.55,-3.62),new THREE.Vector3(3.25,1.35,-3.62),new THREE.Vector3(3.48,2.1,-3.62)],mats.darkWood,.13);g.add(trunk);
 for(let i=0;i<8;i++){let a=rand()*Math.PI*2,r=.25+rand()*.42;let leaf=sphere("bonsai foliage",3.35+Math.cos(a)*r,1.72+rand()*.55,-3.62+Math.sin(a)*r,.25,mats.leaf);leaf.scale.y=.65;g.add(leaf)}
 return g;
}
const bonsaiGroup=bonsai();

function rockGarden(){
 box("outside garden",0,.03,7.25,17,.08,5.5,mats.sand,false,true);
 for(let i=0;i<26;i++){
  const x=-7.5+rand()*15,z=5.6+rand()*3.2;
  const r=.08+rand()*.25;
  const s=sphere("garden stone",x,r,z,r,mats.stone);s.scale.y=.65;
 }
 for(let i=0;i<10;i++){const z=5.8+i*.32;box("raked sand line",0,.1,z,9.5,.012,.025,mats.tatamiEdge,false,false)}
 const lantern=new THREE.Group();lantern.position.set(-3.9,.15,6.25);scene.add(lantern);
 cyl("stone lantern base",0,.45,0,.34,.7,mats.stone,8).parent=lantern;
 box("lantern cap",0,.98,0,.86,.18,.86,mats.stone);
 const lum=new THREE.Mesh(new THREE.BoxGeometry(.36,.45,.36),new THREE.MeshStandardMaterial({color:0xffd794,emissive:0xffa43a,emissiveIntensity:1.5}));
 lum.position.y=.76;lum.castShadow=true;lantern.add(lum);
 const ll=new THREE.PointLight(0xffbc68,1.3,4);ll.position.set(-3.9,1,6.25);scene.add(ll);
}
rockGarden();

function plant(x,z){
 const g=new THREE.Group();g.position.set(x,.2,z);scene.add(g);
 const pot=new THREE.Mesh(new THREE.CylinderGeometry(.42,.34,.35,16),mats.redCeramic);pot.position.y=.25;pot.castShadow=true;g.add(pot);
 for(let i=0;i<6;i++){
  const stem=curve([new THREE.Vector3(0,.4,0),new THREE.Vector3((rand()-.5)*.2,.9,0),new THREE.Vector3((rand()-.5)*.55,1.5,(rand()-.5)*.35)],mats.leaf,.025);g.add(stem);
  const leaf=new THREE.Mesh(new THREE.CircleGeometry(.2,8),mats.leaf);leaf.position.set((rand()-.5)*.6,1.3+rand()*.4,(rand()-.5)*.3);leaf.rotation.set(rand(),rand(),rand());leaf.scale.set(1.3,.55,1);g.add(leaf);
 }
 return g;
}
const plantGroup=plant(-3.4,-3.65);

box("tea room step",0,.15,4.8,7,.3,.4,mats.darkWood);
for(const x of [-4.3,4.3])box("front pillar",x,3.8,4.95,.3,7.5,.3,mats.beam);

const ambient=new THREE.HemisphereLight(0xf4e5c2,0x39453c,1.35);scene.add(ambient);
const sun=new THREE.DirectionalLight(0xffd39b,3.4);sun.position.set(-7,11,8);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-12;sun.shadow.camera.right=12;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-8;sun.shadow.bias=-.0005;scene.add(sun);
const fill=new THREE.DirectionalLight(0x9db7bd,.55);fill.position.set(8,5,-2);scene.add(fill);
const tableLight=new THREE.PointLight(0xffb36c,.55,6);tableLight.position.set(0,3,1);scene.add(tableLight);

const dustGeo=new THREE.BufferGeometry();const dust=[];
for(let i=0;i<90;i++)dust.push(-7+rand()*14,1+rand()*6,-4+rand()*8);
dustGeo.setAttribute("position",new THREE.Float32BufferAttribute(dust,3));
const dustPts=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xffedc2,size:.025,transparent:true,opacity:.3}));
scene.add(dustPts);

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();
 controls.update();
 const p=steam.geometry.attributes.position.array;
 for(let i=0;i<steamData.length;i++){
  const d=steamData[i],j=i*3;
  p[j]=.35+Math.sin(t*.8+d.phase)*d.amp+(i%3)*.015;
  p[j+1]=2.25+((t*.23+d.phase*.13)%1.0)*1.85;
  p[j+2]=.35+Math.cos(t*.65+d.phase)*d.amp;
 }
 steam.geometry.attributes.position.needsUpdate=true;
 steam.material.opacity=.28+.12*Math.sin(t*1.3);
 shojiLeft.children[1].material.opacity=.58+.08*Math.sin(t*.7);
 shojiRight.children[1].material.opacity=.58+.08*Math.sin(t*.7+1);
 glow1.intensity=1.35+.25*Math.sin(t*.7);
 glow2.intensity=1.35+.25*Math.sin(t*.7+1);
 plantGroup.rotation.z=Math.sin(t*.75)*.018;
 bonsaiGroup.rotation.z=Math.sin(t*.42)*.012;
 dustPts.rotation.y=t*.006;
 renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
