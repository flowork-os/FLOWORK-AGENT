<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asian Night Market</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d1320;
    }
    canvas { display: block; }
    #title {
      position: fixed;
      left: 24px;
      bottom: 21px;
      z-index: 2;
      color: #ffe7ba;
      font: 600 15px/1.3 system-ui, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
      text-shadow: 0 2px 12px #000;
      pointer-events: none;
      opacity: .84;
    }
    #title small {
      display: block;
      margin-top: 5px;
      color: #d9b995;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: .28em;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="title">Night Market<small>Lantern Lane</small></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // -------------------------------------------------------------------------
    // Core setup
    // -------------------------------------------------------------------------

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111a29);
    scene.fog = new THREE.FogExp2(0x17202b, 0.018);

    const camera = new THREE.PerspectiveCamera(
      48, innerWidth / innerHeight, 0.1, 180
    );
    camera.position.set(18, 13, 25);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.3, -2);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.28;
    controls.minDistance = 13;
    controls.maxDistance = 45;
    controls.maxPolarAngle = Math.PI * 0.48;

    // -------------------------------------------------------------------------
    // Seeded randomness and shared helpers
    // -------------------------------------------------------------------------

    let seed = 927461;
    function random() {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let t = seed;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    const rand = (a, b) => a + (b - a) * random();
    const pick = arr => arr[Math.floor(random() * arr.length)];

    const mats = {
      darkWood: new THREE.MeshStandardMaterial({ color: 0x3b2119, roughness: .83 }),
      wood: new THREE.MeshStandardMaterial({ color: 0x754429, roughness: .76 }),
      paleWood: new THREE.MeshStandardMaterial({ color: 0xb57945, roughness: .75 }),
      metal: new THREE.MeshStandardMaterial({ color: 0x697076, roughness: .35, metalness: .72 }),
      blackMetal: new THREE.MeshStandardMaterial({ color: 0x191b1c, roughness: .42, metalness: .68 }),
      clothRed: new THREE.MeshStandardMaterial({ color: 0xa92726, roughness: .87 }),
      clothCream: new THREE.MeshStandardMaterial({ color: 0xead4a6, roughness: .9 }),
      jade: new THREE.MeshStandardMaterial({ color: 0x287b65, roughness: .67 }),
      paper: new THREE.MeshStandardMaterial({ color: 0xf4d79a, roughness: .92 }),
      basket: new THREE.MeshStandardMaterial({ color: 0xba7b39, roughness: .9 }),
      dough: new THREE.MeshStandardMaterial({ color: 0xf1d9aa, roughness: .88 }),
      ceramic: new THREE.MeshStandardMaterial({ color: 0xd9e1d5, roughness: .32 }),
      red: new THREE.MeshStandardMaterial({ color: 0xb82a22, roughness: .62 }),
      green: new THREE.MeshStandardMaterial({ color: 0x357443, roughness: .78 }),
      orange: new THREE.MeshStandardMaterial({ color: 0xe77625, roughness: .72 })
    };

    function box(w, h, d, material, x = 0, y = 0, z = 0) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function cylinder(rt, rb, h, seg, material, x = 0, y = 0, z = 0) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(rt, rb, h, seg),
        material
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function canvasTexture(draw, width = 512, height = 256) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      draw(ctx, width, height);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    function roundedRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
    }

    function makeSignTexture(title, subtitle, bg, ink = '#f7dc9c') {
      return canvasTexture((ctx, w, h) => {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, bg);
        grad.addColorStop(1, '#321614');
        ctx.fillStyle = grad;
        roundedRect(ctx, 5, 5, w - 10, h - 10, 22);
        ctx.strokeStyle = '#e6ac55';
        ctx.lineWidth = 8;
        ctx.strokeRect(18, 18, w - 36, h - 36);
        ctx.fillStyle = ink;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 74px serif';
        ctx.fillText(title, w / 2, h * .43);
        ctx.font = '600 24px sans-serif';
        ctx.letterSpacing = '7px';
        ctx.fillText(subtitle, w / 2, h * .74);
        for (let i = 0; i < 140; i++) {
          ctx.fillStyle = `rgba(255,220,160,${rand(0.01, 0.045)})`;
          ctx.fillRect(rand(0, w), rand(0, h), rand(1, 5), rand(1, 3));
        }
      });
    }

    const asphaltTexture = canvasTexture((ctx, w, h) => {
      ctx.fillStyle = '#303336';
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 4500; i++) {
        const v = Math.floor(rand(35, 90));
        ctx.fillStyle = `rgba(${v},${v},${v},${rand(.04, .17)})`;
        ctx.fillRect(rand(0, w), rand(0, h), rand(1, 4), rand(1, 4));
      }
      ctx.strokeStyle = 'rgba(195,145,72,.11)';
      ctx.lineWidth = 4;
      for (let i = 0; i < 7; i++) {
        ctx.beginPath();
        let y = rand(0, h);
        ctx.moveTo(0, y);
        for (let x = 0; x < w; x += 35) {
          y += rand(-12, 12);
          ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    }, 512, 512);
    asphaltTexture.wrapS = asphaltTexture.wrapT = THREE.RepeatWrapping;
    asphaltTexture.repeat.set(5, 8);

    // -------------------------------------------------------------------------
    // Ground, buildings, backdrop
    // -------------------------------------------------------------------------

    const groundMat = new THREE.MeshStandardMaterial({
      map: asphaltTexture,
      color: 0x92918d,
      roughness: .96
    });
    const ground = box(32, .25, 60, groundMat, 0, -.14, -7);
    scene.add(ground);

    const curbMat = new THREE.MeshStandardMaterial({
      color: 0x777164,
      roughness: .94
    });
    scene.add(box(1.2, .34, 60, curbMat, -10.8, .05, -7));
    scene.add(box(1.2, .34, 60, curbMat, 10.8, .05, -7));

    const buildingColors = [0x25303a, 0x34303a, 0x293a3a, 0x3d312e];
    for (const side of [-1, 1]) {
      for (let z = -31; z < 23; z += 7.5) {
        const h = rand(7, 13);
        const w = rand(5.8, 8.2);
        const facade = box(
          w, h, rand(4, 7),
          new THREE.MeshStandardMaterial({
            color: pick(buildingColors),
            roughness: .94
          }),
          side * rand(13.3, 15), h / 2, z + rand(-1, 1)
        );
        scene.add(facade);

        for (let fy = 2.6; fy < h - 1; fy += 2.4) {
          for (let fx = -1.5; fx <= 1.5; fx += 1.5) {
            if (random() < .55) {
              const windowMat = new THREE.MeshStandardMaterial({
                color: random() < .45 ? 0xffb655 : 0x243442,
                emissive: random() < .45 ? 0xff7b24 : 0x07101a,
                emissiveIntensity: random() < .45 ? .55 : .12,
                roughness: .35
              });
              const win = box(.8, 1.05, .06, windowMat);
              win.position.set(
                facade.position.x - side * (facade.geometry.parameters.depth / 2 + .031),
                fy,
                facade.position.z + fx
              );
              win.rotation.y = side * Math.PI / 2;
              scene.add(win);
            }
          }
        }
      }
    }

    // Damp reflective patches in the lane
    const puddleMat = new THREE.MeshStandardMaterial({
      color: 0x283b42,
      roughness: .2,
      metalness: .24,
      transparent: true,
      opacity: .68
    });
    for (let i = 0; i < 9; i++) {
      const puddle = new THREE.Mesh(
        new THREE.CircleGeometry(rand(.35, 1.15), 24),
        puddleMat
      );
      puddle.rotation.x = -Math.PI / 2;
      puddle.scale.y = rand(.35, .7);
      puddle.position.set(rand(-4.5, 4.5), .015, rand(-24, 15));
      puddle.receiveShadow = true;
      scene.add(puddle);
    }

    // -------------------------------------------------------------------------
    // Stall building blocks
    // -------------------------------------------------------------------------

    const signData = [
      ['麵', 'NOODLES', '#8d201e'],
      ['茶', 'TEA HOUSE', '#275d4c'],
      ['餃', 'DUMPLINGS', '#783027'],
      ['炭', 'GRILLED', '#5a2921'],
      ['湯', 'HOT SOUP', '#245f63'],
      ['果', 'FRESH FRUIT', '#8c3e21']
    ];

    const steamPuffs = [];
    const swayingLanterns = [];
    const flickerLights = [];
    const spinningWheels = [];

    function makeAwning(width, depth, redFirst = true) {
      const group = new THREE.Group();
      const stripeCount = 8;
      const stripeW = width / stripeCount;
      for (let i = 0; i < stripeCount; i++) {
        const material = ((i + (redFirst ? 0 : 1)) % 2 === 0)
          ? mats.clothRed : mats.clothCream;
        const strip = box(stripeW + .015, .1, depth, material);
        strip.position.x = -width / 2 + stripeW / 2 + i * stripeW;
        group.add(strip);

        const flap = box(stripeW + .015, .62, .08, material);
        flap.position.set(strip.position.x, -.28, depth / 2);
        group.add(flap);
      }
      group.rotation.x = -0.11;
      return group;
    }

    function makeSign(data, width = 2.8) {
      const texture = makeSignTexture(...data);
      const material = new THREE.MeshStandardMaterial({
        map: texture,
        emissiveMap: texture,
        emissive: 0x5b1d0a,
        emissiveIntensity: .18,
        roughness: .72
      });
      const sign = box(width, 1.25, .13, material);
      const rim = new THREE.Group();
      rim.add(sign);
      rim.add(box(width + .18, .09, .22, mats.darkWood, 0, .67, 0));
      rim.add(box(width + .18, .09, .22, mats.darkWood, 0, -.67, 0));
      rim.add(box(.09, 1.25, .22, mats.darkWood, -width / 2 - .045, 0, 0));
      rim.add(box(.09, 1.25, .22, mats.darkWood, width / 2 + .045, 0, 0));
      return rim;
    }

    function makeBowl(x, y, z, color = 0xd8e2d9) {
      const material = new THREE.MeshStandardMaterial({
        color,
        roughness: .3
      });
      const bowl = new THREE.Mesh(
        new THREE.CylinderGeometry(.3, .2, .18, 24, 1, true),
        material
      );
      bowl.position.set(x, y, z);
      bowl.castShadow = true;
      return bowl;
    }

    function makeSkewers(count = 7) {
      const group = new THREE.Group();
      for (let i = 0; i < count; i++) {
        const skewer = new THREE.Group();
        const stick = cylinder(.018, .018, 1.15, 8, mats.paleWood);
        stick.rotation.z = Math.PI / 2;
        skewer.add(stick);
        const foodMat = pick([mats.red, mats.orange, mats.green, mats.dough]);
        for (let j = -2; j <= 2; j++) {
          const bite = new THREE.Mesh(
            new THREE.SphereGeometry(.11, 9, 7),
            foodMat
          );
          bite.scale.set(1.2, .78, .85);
          bite.position.x = j * .18;
          bite.castShadow = true;
          skewer.add(bite);
        }
        skewer.position.set((i - (count - 1) / 2) * .18, 0, rand(-.06, .06));
        skewer.rotation.y = rand(-.08, .08);
        group.add(skewer);
      }
      return group;
    }

    function makeSteamer(x, y, z) {
      const group = new THREE.Group();
      for (let i = 0; i < 2; i++) {
        const body = cylinder(.46, .46, .25, 24, mats.basket, 0, i * .25, 0);
        const band = cylinder(.49, .49, .055, 24, mats.darkWood, 0, i * .25 - .1, 0);
        group.add(body, band);
      }
      const lid = cylinder(.47, .49, .11, 24, mats.basket, 0, .48, 0);
      const handle = cylinder(.06, .08, .14, 12, mats.darkWood, 0, .6, 0);
      group.add(lid, handle);
      group.position.set(x, y, z);
      return group;
    }

    function addSteam(parent, x, y, z, count = 5) {
      const steamMat = new THREE.MeshBasicMaterial({
        color: 0xe8edf0,
        transparent: true,
        opacity: .18,
        depthWrite: false
      });
      for (let i = 0; i < count; i++) {
        const puff = new THREE.Mesh(
          new THREE.SphereGeometry(rand(.14, .25), 10, 8),
          steamMat.clone()
        );
        puff.scale.set(rand(.6, 1), rand(1.2, 2), rand(.6, 1));
        puff.position.set(x + rand(-.18, .18), y + i * .32, z + rand(-.12, .12));
        puff.userData.baseY = puff.position.y;
        puff.userData.phase = rand(0, Math.PI * 2);
        puff.userData.speed = rand(.35, .55);
        parent.add(puff);
        steamPuffs.push(puff);
      }
    }

    function makeStall(x, z, side, index, kind) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      group.rotation.y = side < 0 ? Math.PI / 2 : -Math.PI / 2;

      const width = rand(4.1, 4.8);
      const depth = 2.7;
      const postMaterial = random() < .5 ? mats.darkWood : mats.blackMetal;

      group.add(box(width, .2, depth, mats.darkWood, 0, .2, 0));
      group.add(box(width, .22, .85, mats.paleWood, 0, 2.05, .72));
      group.add(box(width, 1.5, .12, mats.wood, 0, 1.2, 1.11));

      for (const px of [-width / 2 + .15, width / 2 - .15]) {
        group.add(box(.12, 4.2, .12, postMaterial, px, 2.2, -.72));
        group.add(box(.12, 4.2, .12, postMaterial, px, 2.2, 1.08));
      }

      const awning = makeAwning(width + .55, 2.9, index % 2 === 0);
      awning.position.set(0, 4.25, .12);
      group.add(awning);

      const sign = makeSign(signData[index % signData.length], rand(2.5, 3.2));
      sign.position.set(0, 3.45, 1.18);
      group.add(sign);

      if (kind === 'grill') {
        const grill = box(2.2, .25, .75, mats.blackMetal, -.35, 2.25, .7);
        group.add(grill);
        const skewers = makeSkewers(8);
        skewers.position.set(-.35, 2.43, .7);
        skewers.rotation.y = Math.PI / 2;
        group.add(skewers);
        addSteam(group, -.35, 2.62, .7, 5);
      } else if (kind === 'steam') {
        group.add(makeSteamer(-.65, 2.25, .7));
        group.add(makeSteamer(.45, 2.25, .7));
        addSteam(group, -.1, 3.05, .7, 7);
        for (let i = 0; i < 4; i++) {
          group.add(makeBowl(1.2 + i * .25, 2.22, .72));
        }
      } else if (kind === 'fruit') {
        const colors = [0xe06b26, 0xe6bc32, 0x9a2d29, 0x4f9b4f];
        for (let c = 0; c < 3; c++) {
          const crate = makeCrate(-1.25 + c * 1.25, 2.34, .7, colors[c]);
          crate.scale.set(.82, .82, .82);
          group.add(crate);
        }
      } else {
        for (let i = 0; i < 6; i++) {
          const bowl = makeBowl(-1.3 + i * .52, 2.23, .72, i % 2 ? 0xdbe2d5 : 0x87a89b);
          group.add(bowl);
        }
        addSteam(group, 0, 2.55, .7, 5);
      }

      const lamp = new THREE.PointLight(0xff8a38, 14, 8, 2);
      lamp.position.set(0, 3.55, .75);
      lamp.castShadow = index === 1 || index === 4;
      lamp.shadow.mapSize.set(512, 512);
      group.add(lamp);
      flickerLights.push({ light: lamp, base: 14, phase: rand(0, 9) });

      scene.add(group);
      return group;
    }

    // -------------------------------------------------------------------------
    // Crates, tables, stools and carts
    // -------------------------------------------------------------------------

    function makeCrate(x, y, z, fruitColor = 0xdf7c25) {
      const group = new THREE.Group();
      const crateMat = mats.paleWood;
      group.add(box(1.15, .1, .72, crateMat, 0, -.33, 0));
      for (const yy of [-.25, .02, .28]) {
        group.add(box(1.15, .1, .08, crateMat, 0, yy, -.34));
        group.add(box(1.15, .1, .08, crateMat, 0, yy, .34));
      }
      for (const xx of [-.53, .53]) {
        group.add(box(.08, .7, .08, mats.darkWood, xx, 0, -.34));
        group.add(box(.08, .7, .08, mats.darkWood, xx, 0, .34));
      }
      const fruitMat = new THREE.MeshStandardMaterial({
        color: fruitColor,
        roughness: .7
      });
      for (let i = 0; i < 12; i++) {
        const fruit = new THREE.Mesh(
          new THREE.SphereGeometry(.13, 10, 8),
          fruitMat
        );
        fruit.position.set(
          rand(-.42, .42),
          rand(.1, .42),
          rand(-.25, .25)
        );
        fruit.castShadow = true;
        group.add(fruit);
      }
      group.position.set(x, y, z);
      return group;
    }

    function makeTable(x, z, rotation = 0) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      group.rotation.y = rotation;
      group.add(box(2.7, .13, 1.25, mats.paleWood, 0, 1.48, 0));
      for (const xx of [-1.08, 1.08]) {
        for (const zz of [-.42, .42]) {
          const leg = box(.1, 1.45, .1, mats.blackMetal, xx, .72, zz);
          leg.rotation.z = xx * .045;
          group.add(leg);
        }
      }
      for (let i = 0; i < 4; i++) {
        group.add(makeBowl(-.9 + i * .6, 1.63, rand(-.18, .18)));
      }
      scene.add(group);
    }

    function makeStool(x, z, color) {
      const group = new THREE.Group();
      const seatMat = new THREE.MeshStandardMaterial({
        color,
        roughness: .75
      });
      group.add(cylinder(.34, .31, .12, 16, seatMat, 0, .77, 0));
      for (let i = 0; i < 4; i++) {
        const a = i / 4 * Math.PI * 2;
        const leg = cylinder(.035, .045, .72, 8, mats.blackMetal);
        leg.position.set(Math.cos(a) * .22, .38, Math.sin(a) * .22);
        leg.rotation.z = Math.cos(a) * .12;
        leg.rotation.x = Math.sin(a) * .12;
        group.add(leg);
      }
      group.position.set(x, 0, z);
      scene.add(group);
    }

    function makeWheel(radius = .8) {
      const group = new THREE.Group();
      const tire = new THREE.Mesh(
        new THREE.TorusGeometry(radius, .055, 8, 28),
        mats.blackMetal
      );
      tire.castShadow = true;
      group.add(tire);
      const hub = cylinder(.08, .08, .16, 12, mats.metal);
      hub.rotation.x = Math.PI / 2;
      group.add(hub);
      for (let i = 0; i < 12; i++) {
        const spoke = cylinder(.009, .009, radius * 1.88, 5, mats.metal);
        spoke.rotation.z = i / 12 * Math.PI;
        group.add(spoke);
      }
      return group;
    }

    function makeBicycleCart(x, z, rotation = 0) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      group.rotation.y = rotation;

      const rear = makeWheel(.75);
      rear.position.set(-1.05, .8, 0);
      rear.rotation.y = Math.PI / 2;
      group.add(rear);

      const front = makeWheel(.75);
      front.position.set(1.25, .8, 0);
      front.rotation.y = Math.PI / 2;
      group.add(front);
      spinningWheels.push(rear, front);

      const frameMat = random() < .5 ? mats.red : mats.jade;
      const frame1 = cylinder(.045, .045, 1.65, 8, frameMat);
      frame1.position.set(-.25, 1.05, 0);
      frame1.rotation.z = Math.PI / 2.9;
      group.add(frame1);
      const frame2 = cylinder(.045, .045, 1.4, 8, frameMat);
      frame2.position.set(.15, .83, 0);
      frame2.rotation.z = -Math.PI / 2.8;
      group.add(frame2);
      const frame3 = cylinder(.045, .045, 1.25, 8, frameMat);
      frame3.position.set(-.3, .72, 0);
      frame3.rotation.z = Math.PI / 2;
      group.add(frame3);

      group.add(box(.48, .1, .28, mats.darkWood, -.52, 1.55, 0));
      const handle = cylinder(.035, .035, .8, 8, mats.blackMetal, .92, 1.62, 0);
      handle.rotation.z = -.35;
      group.add(handle);

      const cart = box(1.4, .62, 1.05, mats.wood, -1.45, 1.52, 0);
      group.add(cart);
      group.add(makeCrate(-1.45, 2.05, 0, 0xe9a32b));

      scene.add(group);
    }

    // -------------------------------------------------------------------------
    // Lanterns and overhead light strings
    // -------------------------------------------------------------------------

    function makeLantern(scale = 1) {
      const pivot = new THREE.Group();
      const lantern = new THREE.Group();

      const glowMat = new THREE.MeshStandardMaterial({
        color: 0xd83324,
        emissive: 0xff361a,
        emissiveIntensity: 1.25,
        roughness: .58
      });
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(.42 * scale, 18, 12),
        glowMat
      );
      body.scale.y = 1.25;
      body.castShadow = true;
      lantern.add(body);

      for (let y = -.42; y <= .42; y += .21) {
        const rib = new THREE.Mesh(
          new THREE.TorusGeometry(
            Math.sqrt(Math.max(.01, .42 * .42 - y * y * .55)) * scale,
            .012 * scale, 5, 22
          ),
          mats.darkWood
        );
        rib.rotation.x = Math.PI / 2;
        rib.position.y = y * scale;
        lantern.add(rib);
      }
      lantern.add(cylinder(.29 * scale, .29 * scale, .09 * scale, 16, mats.darkWood, 0, .56 * scale, 0));
      lantern.add(cylinder(.29 * scale, .29 * scale, .09 * scale, 16, mats.darkWood, 0, -.56 * scale, 0));

      const tassel = cylinder(.025 * scale, .015 * scale, .45 * scale, 7, mats.red, 0, -.82 * scale, 0);
      lantern.add(tassel);

      const light = new THREE.PointLight(0xff4b1f, 4.6 * scale, 5.2 * scale, 2);
      light.position.y = 0;
      lantern.add(light);

      pivot.add(lantern);
      pivot.userData.phase = rand(0, Math.PI * 2);
      pivot.userData.amount = rand(.018, .045);
      swayingLanterns.push(pivot);
      return pivot;
    }

    function stringCurve(a, b, sag = 1.1) {
      const mid = a.clone().lerp(b, .5);
      mid.y -= sag;
      return new THREE.QuadraticBezierCurve3(a, mid, b);
    }

    function addLightString(a, b, bulbs = 11, color = 0xffb24e) {
      const curve = stringCurve(a, b, rand(.7, 1.35));
      const cable = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 28, .018, 5, false),
        mats.blackMetal
      );
      cable.castShadow = true;
      scene.add(cable);

      const bulbMat = new THREE.MeshStandardMaterial({
        color: 0xffd189,
        emissive: color,
        emissiveIntensity: 2.8,
        roughness: .28
      });
      for (let i = 1; i < bulbs; i++) {
        const p = curve.getPoint(i / bulbs);
        const socket = cylinder(.045, .045, .15, 8, mats.blackMetal, p.x, p.y + .05, p.z);
        scene.add(socket);
        const bulb = new THREE.Mesh(
          new THREE.SphereGeometry(.085, 10, 8),
          bulbMat.clone()
        );
        bulb.position.set(p.x, p.y - .06, p.z);
        scene.add(bulb);
        flickerLights.push({
          material: bulb.material,
          base: 2.8,
          phase: rand(0, 12)
        });
      }
    }

    for (let z = -23; z <= 15; z += 6.5) {
      addLightString(
        new THREE.Vector3(-10.2, rand(6.1, 7.1), z),
        new THREE.Vector3(10.2, rand(6.1, 7.1), z + rand(-1, 1)),
        12
      );
    }

    for (let z = -20; z <= 15; z += 8.5) {
      for (const x of [-6.5, 6.5]) {
        const lantern = makeLantern(rand(.78, 1.06));
        lantern.position.set(x, rand(5.1, 5.8), z);
        scene.add(lantern);
      }
    }

    // Central ceremonial lantern cluster
    for (let i = 0; i < 5; i++) {
      const lantern = makeLantern(i === 2 ? 1.35 : .9);
      lantern.position.set(
        (i - 2) * 1.25,
        6.5 - Math.abs(i - 2) * .32,
        -8
      );
      scene.add(lantern);
    }

    // -------------------------------------------------------------------------
    // Assemble market layout
    // -------------------------------------------------------------------------

    const stallKinds = ['grill', 'steam', 'fruit', 'soup'];
    const stallZ = [-19, -12.5, -6, .5, 7, 13.5];
    stallZ.forEach((z, i) => {
      makeStall(-8.4, z, -1, i, stallKinds[i % stallKinds.length]);
      if (i !== 5) {
        makeStall(8.4, z + rand(-.8, .8), 1, i + 1, stallKinds[(i + 2) % stallKinds.length]);
      }
    });

    makeTable(-2.4, -14.5, .15);
    makeTable(2.3, -4.8, -.12);
    makeTable(-2.6, 6.2, .08);

    const stoolColors = [0x96372d, 0x2e7364, 0xc58a3b];
    [
      [-3.5, -13.5], [-1.4, -15.4], [3.2, -3.7], [1.2, -5.7],
      [-3.7, 7.2], [-1.5, 5.1], [3.4, 11.5], [.5, 2.2]
    ].forEach((p, i) => makeStool(p[0], p[1], stoolColors[i % 3]));

    scene.add(makeCrate(-5.2, .55, -2, 0xe47722));
    scene.add(makeCrate(5.1, .55, 4.5, 0xb83a2f));
    scene.add(makeCrate(-5.4, .55, 11, 0xe3b62e));
    scene.add(makeCrate(5.4, .55, -16, 0x5b9b45));

    makeBicycleCart(-4.5, 15.5, -.2);
    makeBicycleCart(4.6, -22, Math.PI + .15);

    // Menu boards leaning into the lane
    for (const [x, z, index] of [[-5.4, -9, 0], [5.3, 9.5, 2]]) {
      const board = new THREE.Group();
      const tex = makeSignTexture(
        signData[index][0],
        index === 0 ? 'SPECIAL  12' : 'FRESH  DAILY',
        '#593021'
      );
      const panelMat = new THREE.MeshStandardMaterial({
        map: tex,
        roughness: .8
      });
      board.add(box(1.45, 1.9, .1, panelMat, 0, 1.25, 0));
      const leg1 = box(.08, 2.4, .08, mats.darkWood, -.55, .85, .24);
      const leg2 = box(.08, 2.4, .08, mats.darkWood, .55, .85, .24);
      leg1.rotation.x = leg2.rotation.x = -.16;
      board.add(leg1, leg2);
      board.position.set(x, 0, z);
      board.rotation.y = x < 0 ? .35 : -.35;
      scene.add(board);
    }

    // Paper parasols near the back
    function makeParasol(x, z, color) {
      const group = new THREE.Group();
      group.add(cylinder(.04, .05, 3.6, 10, mats.darkWood, 0, 1.8, 0));
      const canopyMat = new THREE.MeshStandardMaterial({
        color,
        side: THREE.DoubleSide,
        roughness: .82
      });
      const canopy = new THREE.Mesh(
        new THREE.ConeGeometry(2.15, .75, 20, 1, true),
        canopyMat
      );
      canopy.position.y = 3.45;
      canopy.castShadow = true;
      group.add(canopy);
      for (let i = 0; i < 10; i++) {
        const rib = cylinder(.018, .018, 2.08, 6, mats.darkWood);
        const a = i / 10 * Math.PI * 2;
        rib.position.set(Math.cos(a) * .98, 3.25, Math.sin(a) * .98);
        rib.rotation.z = Math.PI / 2;
        rib.rotation.y = -a;
        group.add(rib);
      }
      group.position.set(x, 0, z);
      scene.add(group);
    }
    makeParasol(-3.8, -25, 0x9b2928);
    makeParasol(4.1, 17.5, 0xd6b96b);

    // -------------------------------------------------------------------------
    // Lighting
    // -------------------------------------------------------------------------

    const hemi = new THREE.HemisphereLight(0x56799e, 0x2a1810, 1.55);
    scene.add(hemi);

    const moon = new THREE.DirectionalLight(0x9ebde8, 2.05);
    moon.position.set(-12, 20, 10);
    moon.castShadow = true;
    moon.shadow.mapSize.set(2048, 2048);
    moon.shadow.camera.left = -24;
    moon.shadow.camera.right = 24;
    moon.shadow.camera.top = 28;
    moon.shadow.camera.bottom = -28;
    moon.shadow.camera.near = 1;
    moon.shadow.camera.far = 65;
    moon.shadow.bias = -0.00025;
    scene.add(moon);

    const warmKey = new THREE.PointLight(0xff7b32, 42, 25, 2);
    warmKey.position.set(0, 7, -8);
    warmKey.castShadow = true;
    warmKey.shadow.mapSize.set(1024, 1024);
    warmKey.shadow.bias = -0.001;
    scene.add(warmKey);
    flickerLights.push({ light: warmKey, base: 42, phase: 1.7 });

    const farGlow = new THREE.PointLight(0xffa23d, 25, 22, 2);
    farGlow.position.set(0, 5, 13);
    scene.add(farGlow);

    // -------------------------------------------------------------------------
    // Atmospheric dust and animation
    // -------------------------------------------------------------------------

    const dustPositions = new Float32Array(360 * 3);
    for (let i = 0; i < 360; i++) {
      dustPositions[i * 3] = rand(-11, 11);
      dustPositions[i * 3 + 1] = rand(.3, 8);
      dustPositions[i * 3 + 2] = rand(-28, 22);
    }
    const dustGeo = new THREE.BufferGeometry();
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
    const dustMat = new THREE.PointsMaterial({
      color: 0xffc985,
      size: .035,
      transparent: true,
      opacity: .38,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const dust = new THREE.Points(dustGeo, dustMat);
    scene.add(dust);

    scene.traverse(object => {
      if (object.isMesh) {
        object.castShadow = object.castShadow !== false;
        object.receiveShadow = object.receiveShadow !== false;
      }
    });
    ground.castShadow = false;

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      for (const puff of steamPuffs) {
        const cycle = (t * puff.userData.speed + puff.userData.phase) % 1.8;
        puff.position.y = puff.userData.baseY + cycle * 1.05;
        puff.position.x += Math.sin(t * 1.3 + puff.userData.phase) * .0008;
        puff.scale.x = .65 + cycle * .25;
        puff.scale.z = .65 + cycle * .25;
        puff.material.opacity = Math.max(0, .2 * (1 - cycle / 1.8));
      }

      for (const lantern of swayingLanterns) {
        lantern.rotation.z =
          Math.sin(t * .72 + lantern.userData.phase) * lantern.userData.amount;
        lantern.rotation.x =
          Math.cos(t * .54 + lantern.userData.phase) * lantern.userData.amount * .35;
      }

      for (const item of flickerLights) {
        const pulse =
          .94 +
          Math.sin(t * 8.1 + item.phase) * .025 +
          Math.sin(t * 15.7 + item.phase * 2) * .012;
        if (item.light) item.light.intensity = item.base * pulse;
        if (item.material) item.material.emissiveIntensity = item.base * pulse;
      }

      for (let i = 0; i < spinningWheels.length; i++) {
        spinningWheels[i].rotation.z =
          Math.sin(t * .22 + i * .7) * .035;
      }

      dust.rotation.y = t * .008;
      const positions = dust.geometry.attributes.position;
      for (let i = 0; i < positions.count; i++) {
        let y = positions.getY(i) + .0018;
        if (y > 8) y = .3;
        positions.setY(i, y);
      }
      positions.needsUpdate = true;

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
