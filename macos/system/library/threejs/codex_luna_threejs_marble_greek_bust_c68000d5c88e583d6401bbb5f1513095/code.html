<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classical Marble Bust</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101114}
canvas{display:block}
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111216);
scene.fog = new THREE.Fog(0x111216, 8, 16);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 3.15, 8.6);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 5.8;
controls.maxDistance = 11;
controls.target.set(0, 2.35, 0);

const marble = new THREE.MeshPhysicalMaterial({
  color: 0xdeddd7,
  roughness: 0.29,
  metalness: 0,
  clearcoat: 0.22,
  clearcoatRoughness: 0.2,
  transmission: 0.08,
  thickness: 0.65,
  ior: 1.45
});
const marbleDark = new THREE.MeshPhysicalMaterial({
  color: 0xc6c5bf,
  roughness: 0.38,
  clearcoat: 0.12,
  transmission: 0.04
});
const veinMaterial = new THREE.MeshBasicMaterial({
  color: 0x8b8b86,
  transparent: true,
  opacity: 0.19
});
const plinthMaterial = new THREE.MeshStandardMaterial({
  color: 0xaaa9a3,
  roughness: 0.3,
  metalness: 0
});
const shadowMaterial = new THREE.MeshStandardMaterial({
  color: 0x17181a,
  roughness: 0.72
});

const bust = new THREE.Group();
scene.add(bust);

function ellipsoid(name, position, scale, material = marble, segments = 40) {
  const geometry = new THREE.SphereGeometry(1, segments, Math.max(20, Math.floor(segments * 0.7)));
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.scale.set(scale[0], scale[1], scale[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  bust.add(mesh);
  return mesh;
}

function cylinder(name, radiusTop, radiusBottom, height, position, material = marble, radial = 48) {
  const geometry = new THREE.CylinderGeometry(radiusTop, radiusBottom, height, radial, 1);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  bust.add(mesh);
  return mesh;
}

function tube(points, radius, material, parent = bust) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], p[1], p[2])));
  const geometry = new THREE.TubeGeometry(curve, 24, radius, 8, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function curl(x, y, z, r, rotZ = 0, mat = marble) {
  const group = new THREE.Group();
  group.position.set(x, y, z);
  group.rotation.z = rotZ;
  const outer = new THREE.Mesh(new THREE.TorusGeometry(r * 0.69, r * 0.3, 12, 20, Math.PI * 1.75), mat);
  outer.rotation.y = Math.PI * 0.5;
  outer.castShadow = true;
  outer.receiveShadow = true;
  group.add(outer);
  const center = new THREE.Mesh(new THREE.SphereGeometry(r * 0.46, 18, 14), mat);
  center.position.x = r * 0.12;
  center.castShadow = true;
  center.receiveShadow = true;
  group.add(center);
  bust.add(group);
  return group;
}

const plinthBase = new THREE.Mesh(new THREE.CylinderGeometry(1.58, 1.7, 0.34, 64), plinthMaterial);
plinthBase.position.y = 0.17;
plinthBase.castShadow = true;
plinthBase.receiveShadow = true;
scene.add(plinthBase);

const plinthUpper = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.42, 0.26, 64), plinthMaterial);
plinthUpper.position.y = 0.47;
plinthUpper.castShadow = true;
plinthUpper.receiveShadow = true;
scene.add(plinthUpper);

const plinthTop = new THREE.Mesh(new THREE.CylinderGeometry(1.18, 1.18, 0.08, 64), marbleDark);
plinthTop.position.y = 0.64;
plinthTop.castShadow = true;
plinthTop.receiveShadow = true;
scene.add(plinthTop);

const shoulders = ellipsoid("broad shoulders", [0, 1.03, 0], [1.34, 0.69, 0.7], marble);
shoulders.rotation.z = 0.015;

const chest = ellipsoid("upper chest", [0, 1.32, 0.03], [0.9, 0.67, 0.55], marble);
const neck = cylinder("neck", 0.39, 0.55, 1.24, [0, 1.82, 0.02], marble, 48);
neck.rotation.z = 0.015;

const head = ellipsoid("head", [0, 3.02, 0.02], [0.91, 1.18, 0.69], marble, 48);
head.scale.z = 0.77;
head.rotation.x = -0.035;

const facePlane = ellipsoid("face", [0, 2.96, -0.54], [0.71, 0.9, 0.22], marble, 40);
facePlane.rotation.x = -0.03;

const browL = ellipsoid("left brow", [-0.29, 3.25, -0.69], [0.25, 0.095, 0.08], marbleDark, 28);
browL.rotation.z = -0.1;
const browR = ellipsoid("right brow", [0.29, 3.25, -0.69], [0.25, 0.095, 0.08], marbleDark, 28);
browR.rotation.z = 0.1;

const eyeL = ellipsoid("left eyelid", [-0.285, 3.12, -0.715], [0.14, 0.052, 0.035], marbleDark, 24);
eyeL.rotation.z = -0.05;
const eyeR = ellipsoid("right eyelid", [0.285, 3.12, -0.715], [0.14, 0.052, 0.035], marbleDark, 24);
eyeR.rotation.z = 0.05;

const noseBridge = ellipsoid("nose bridge", [0, 3.02, -0.78], [0.13, 0.39, 0.16], marble, 32);
noseBridge.rotation.x = -0.08;
const noseTip = ellipsoid("nose tip", [0, 2.82, -0.88], [0.18, 0.14, 0.18], marble, 30);
const nostrilL = ellipsoid("left nostril", [-0.085, 2.79, -0.99], [0.045, 0.025, 0.022], marbleDark, 18);
const nostrilR = ellipsoid("right nostril", [0.085, 2.79, -0.99], [0.045, 0.025, 0.022], marbleDark, 18);

const upperLip = ellipsoid("upper lip", [0, 2.59, -0.75], [0.22, 0.055, 0.06], marbleDark, 26);
upperLip.rotation.x = -0.1;
const lowerLip = ellipsoid("lower lip", [0, 2.51, -0.78], [0.2, 0.07, 0.07], marble, 26);
lowerLip.rotation.x = -0.08;
const chin = ellipsoid("chin", [0, 2.36, -0.65], [0.36, 0.24, 0.22], marble, 32);

const earL = ellipsoid("left ear", [-0.83, 2.98, -0.02], [0.16, 0.34, 0.13], marble, 28);
earL.rotation.z = -0.08;
const earR = ellipsoid("right ear", [0.83, 2.98, -0.02], [0.16, 0.34, 0.13], marble, 28);
earR.rotation.z = 0.08;

const hairCap = ellipsoid("hair mass", [0, 3.72, 0.01], [0.92, 0.55, 0.7], marbleDark, 40);
hairCap.scale.z = 0.82;

const hairRows = [
  [-0.75,3.63,-0.1,0.19,-0.3],[-0.52,3.88,-0.12,0.2,-0.2],[-0.25,4.02,-0.08,0.2,0.05],
  [0,4.06,0,0.2,0],[0.27,4.02,-0.08,0.2,-0.05],[0.54,3.88,-0.12,0.2,0.2],
  [0.76,3.64,-0.08,0.18,0.3],[-0.86,3.38,-0.26,0.18,-0.45],[0.86,3.38,-0.26,0.18,0.45],
  [-0.83,3.12,-0.31,0.16,-0.5],[0.83,3.12,-0.31,0.16,0.5]
];
hairRows.forEach(v => curl(v[0],v[1],v[2],v[3],v[4],marbleDark));

const beardRows = [
  [-0.55,2.68,-0.74,0.18,-0.25],[0.55,2.68,-0.74,0.18,0.25],
  [-0.62,2.47,-0.66,0.18,-0.35],[0.62,2.47,-0.66,0.18,0.35],
  [-0.48,2.27,-0.52,0.18,-0.28],[0.48,2.27,-0.52,0.18,0.28],
  [-0.28,2.13,-0.36,0.18,-0.12],[0.28,2.13,-0.36,0.18,0.12],
  [0,2.04,-0.3,0.19,0]
];
beardRows.forEach(v => curl(v[0],v[1],v[2],v[3],v[4],marbleDark));

const moustacheL = tube([[-0.03,2.61,-0.83],[-0.17,2.64,-0.86],[-0.33,2.58,-0.82],[-0.43,2.55,-0.76]],0.045,marbleDark);
const moustacheR = tube([[0.03,2.61,-0.83],[0.17,2.64,-0.86],[0.33,2.58,-0.82],[0.43,2.55,-0.76]],0.045,marbleDark);

tube([[-0.69,1.18,-0.6],[-0.45,1.38,-0.64],[-0.34,1.66,-0.57]],0.012,veinMaterial);
tube([[0.71,1.15,-0.57],[0.49,1.42,-0.63],[0.56,1.72,-0.52],[0.42,2.0,-0.56]],0.009,veinMaterial);
tube([[-0.62,3.0,-0.71],[-0.48,2.86,-0.77],[-0.52,2.68,-0.76]],0.008,veinMaterial);
tube([[0.48,3.82,-0.38],[0.38,3.57,-0.5],[0.48,3.35,-0.55]],0.009,veinMaterial);

const floor = new THREE.Mesh(new THREE.CircleGeometry(15, 96), shadowMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.02;
floor.receiveShadow = true;
scene.add(floor);

const hemi = new THREE.HemisphereLight(0xdfe7ff, 0x1b1a19, 2.0);
scene.add(hemi);

const key = new THREE.SpotLight(0xfff4df, 7.2, 12, Math.PI / 6, 0.48, 1.3);
key.position.set(-4.2, 7.2, 5.5);
key.target.position.set(0, 2.4, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.00025;
scene.add(key, key.target);

const fill = new THREE.DirectionalLight(0xb8ccff, 1.7);
fill.position.set(4.5, 4.1, 3.6);
fill.target.position.set(0, 2.4, 0);
scene.add(fill, fill.target);

const rim = new THREE.PointLight(0xa7c7ff, 2.2, 8);
rim.position.set(-2.8, 4.6, -3.2);
scene.add(rim);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
