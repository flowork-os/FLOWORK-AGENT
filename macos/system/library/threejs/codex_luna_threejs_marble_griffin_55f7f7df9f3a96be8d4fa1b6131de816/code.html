<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marble Griffin</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #17191c; }
canvas { display: block; width: 100%; height: 100%; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17191c);
scene.fog = new THREE.Fog(0x17191c, 8, 18);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 50);
camera.position.set(4.6, 3.35, 7.2);
camera.lookAt(0, 1.75, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 4.4;
controls.maxDistance = 11;
controls.target.set(0, 1.65, 0);

const hemi = new THREE.HemisphereLight(0xe9edf2, 0x20242b, 2.0);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff7e8, 4.2);
key.position.set(-4.5, 8, 5.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -2;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 20;
scene.add(key);

const rim = new THREE.DirectionalLight(0x9fbce8, 2.0);
rim.position.set(4, 4, -6);
scene.add(rim);

const marble = new THREE.MeshStandardMaterial({
  color: 0xe7e7e1,
  roughness: 0.25,
  metalness: 0.02
});

marble.onBeforeCompile = shader => {
  shader.vertexShader = shader.vertexShader.replace(
    "#include <common>",
    "#include <common>\nvarying vec3 vMarblePosition;"
  );
  shader.vertexShader = shader.vertexShader.replace(
    "#include <begin_vertex>",
    "#include <begin_vertex>\nvMarblePosition = position;"
  );
  shader.fragmentShader = shader.fragmentShader.replace(
    "#include <common>",
    "#include <common>\nvarying vec3 vMarblePosition;"
  );
  shader.fragmentShader = shader.fragmentShader.replace(
    "#include <color_fragment>",
    `
    #include <color_fragment>
    vec3 mp = vMarblePosition * 2.65;
    float waveA = sin(mp.x * 2.4 + sin(mp.y * 3.1 + mp.z * 1.7) * 2.15 + mp.z * 1.35);
    float waveB = sin(mp.z * 4.8 + sin(mp.x * 2.0 - mp.y * 2.7) * 1.8);
    float marbleVein = smoothstep(0.965, 0.997, abs(waveA)) * 0.72
                    + smoothstep(0.982, 0.999, abs(waveB)) * 0.34;
    marbleVein = clamp(marbleVein, 0.0, 0.82);
    diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.30, 0.32, 0.34), marbleVein);
    `
  );
};

const darkStone = new THREE.MeshStandardMaterial({
  color: 0x777b7e,
  roughness: 0.42,
  metalness: 0.04
});

const eyeMat = new THREE.MeshStandardMaterial({
  color: 0x121416,
  roughness: 0.18,
  metalness: 0.35
});

function addMesh(geometry, material = marble, position = [0,0,0], scale = [1,1,1], rotation = [0,0,0], parent = scene) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(...position);
  mesh.scale.set(...scale);
  mesh.rotation.set(...rotation);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function sphere(position, scale, material = marble, parent = scene, segments = 32) {
  return addMesh(new THREE.SphereGeometry(1, segments, segments), material, position, scale, [0,0,0], parent);
}

function cylinderBetween(a, b, radius, material = marble, parent = scene, radialSegments = 16) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const direction = end.clone().sub(start);
  const length = direction.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius * 1.08, length, radialSegments), material);
  mesh.position.copy(start.clone().add(end).multiplyScalar(0.5));
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function feather(position, direction, width, length, material = marble, parent = scene) {
  const dir = new THREE.Vector3(...direction).normalize();
  const mesh = new THREE.Mesh(
    new THREE.ConeGeometry(width, length, 10, 2),
    material
  );
  mesh.position.set(...position);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  mesh.scale.set(1, 1, 0.48);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function curveTube(points, radius, material = marble, parent = scene) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 28, radius, 8, false), material);
  tube.castShadow = true;
  tube.receiveShadow = true;
  parent.add(tube);
  return tube;
}

const griffin = new THREE.Group();
griffin.position.y = 0.1;
scene.add(griffin);

const base = new THREE.Group();
griffin.add(base);

addMesh(new THREE.CylinderGeometry(1.58, 1.78, 0.32, 64), marble, [0, 0.16, 0], [1,1,1], [0,0,0], base);
addMesh(new THREE.CylinderGeometry(1.28, 1.48, 0.2, 64), darkStone, [0, 0.39, 0], [1,1,1], [0,0,0], base);
addMesh(new THREE.CylinderGeometry(1.15, 1.23, 0.16, 64), marble, [0, 0.53, 0], [1,1,1], [0,0,0], base);

const body = new THREE.Group();
griffin.add(body);

sphere([0, 1.52, -0.05], [0.93, 1.24, 0.72], marble, body);
sphere([0, 1.02, -0.18], [1.03, 0.82, 0.76], marble, body);
sphere([-0.69, 0.93, -0.08], [0.7, 0.72, 0.72], marble, body);
sphere([0.69, 0.93, -0.08], [0.7, 0.72, 0.72], marble, body);

sphere([0, 2.08, 0.16], [0.63, 0.88, 0.57], marble, body);
sphere([0, 2.45, 0.12], [0.53, 0.58, 0.48], marble, body);

const maneRings = [
  [0.00, 2.30, -0.25, 0.72, 0.29, 0.34],
  [0.00, 2.55, -0.24, 0.66, 0.25, 0.30],
  [0.00, 2.78, -0.18, 0.57, 0.22, 0.27]
];
for (const r of maneRings) sphere(r.slice(0,3), r.slice(3), marble, body);

const neckFeathers = [
  [-0.42, 2.28, 0.28, -0.32, 0.28, 0.10],
  [0.42, 2.28, 0.28, 0.32, 0.28, 0.10],
  [-0.48, 2.49, 0.22, -0.35, 0.25, 0.13],
  [0.48, 2.49, 0.22, 0.35, 0.25, 0.13]
];
for (const f of neckFeathers) feather(f.slice(0,3), f.slice(3), 0.17, 0.58, marble, body);

function makeWing(side) {
  const wing = new THREE.Group();
  wing.scale.x = side;
  griffin.add(wing);

  sphere([0.61, 1.93, -0.26], [0.57, 1.04, 0.28], marble, wing);
  sphere([0.76, 1.62, -0.29], [0.55, 0.78, 0.25], marble, wing);

  const layers = [
    { y: 2.47, x: 0.76, z: -0.2, d: [0.18, 0.98, -0.08], w: 0.22, l: 1.38 },
    { y: 2.30, x: 0.92, z: -0.22, d: [0.38, 0.92, -0.12], w: 0.22, l: 1.45 },
    { y: 2.11, x: 1.05, z: -0.25, d: [0.58, 0.78, -0.12], w: 0.21, l: 1.48 },
    { y: 1.91, x: 1.16, z: -0.28, d: [0.72, 0.62, -0.1], w: 0.20, l: 1.45 },
    { y: 1.71, x: 1.22, z: -0.29, d: [0.84, 0.46, -0.08], w: 0.19, l: 1.36 },
    { y: 1.52, x: 1.18, z: -0.30, d: [0.90, 0.28, -0.05], w: 0.18, l: 1.22 }
  ];
  for (const item of layers) feather([item.x, item.y, item.z], item.d, item.w, item.l, marble, wing);

  for (let i = 0; i < 5; i++) {
    const x = 0.58 + i * 0.12;
    const y = 2.05 - i * 0.12;
    feather([x, y, 0.02], [0.24 + i * 0.13, 0.88 - i * 0.08, 0.18], 0.14, 0.78, marble, wing);
  }

  return wing;
}
makeWing(-1);
makeWing(1);

const head = new THREE.Group();
griffin.add(head);

sphere([0, 3.10, 0.20], [0.57, 0.55, 0.54], marble, head);
sphere([0, 2.88, 0.47], [0.49, 0.35, 0.34], marble, head);

const browL = sphere([-0.22, 3.29, 0.52], [0.24, 0.11, 0.14], marble, head);
const browR = sphere([0.22, 3.29, 0.52], [0.24, 0.11, 0.14], marble, head);

sphere([-0.24, 3.18, 0.57], [0.075, 0.09, 0.055], eyeMat, head, 20);
sphere([0.24, 3.18, 0.57], [0.075, 0.09, 0.055], eyeMat, head, 20);

const beak = new THREE.Group();
beak.position.set(0, 3.02, 0.65);
head.add(beak);
addMesh(new THREE.ConeGeometry(0.22, 0.62, 5), marble, [0,0,0], [1,1,0.8], [Math.PI / 2, 0, 0], beak);
addMesh(new THREE.ConeGeometry(0.12, 0.30, 5), darkStone, [0, -0.17, 0.16], [1,1,0.7], [Math.PI / 2, 0, 0], beak);

for (let i = -2; i <= 2; i++) {
  feather([i * 0.13, 3.53 + Math.abs(i) * 0.025, 0.08], [i * 0.20, 0.76, -0.18], 0.13, 0.54, marble, head);
}

function foreleg(side) {
  const x = side * 0.34;
  cylinderBetween([x, 1.93, 0.42], [x * 1.04, 0.78, 0.58], 0.18, marble, body);
  sphere([x * 1.04, 0.72, 0.62], [0.27, 0.18, 0.36], marble, body);
  for (let i = -1; i <= 1; i++) {
    const clawX = x * 1.04 + i * 0.105;
    const claw = new THREE.Mesh(new THREE.ConeGeometry(0.065, 0.30, 8), marble);
    claw.position.set(clawX, 0.64, 0.83);
    claw.rotation.x = Math.PI / 2.25;
    claw.rotation.z = side * i * 0.11;
    claw.castShadow = true;
    claw.receiveShadow = true;
    body.add(claw);
  }
}
foreleg(-1);
foreleg(1);

const tailPoints = [
  [0.58, 0.95, -0.52],
  [1.10, 0.67, -0.65],
  [1.40, 0.78, -0.72],
  [1.55, 1.12, -0.68],
  [1.40, 1.38, -0.62]
];
curveTube(tailPoints, 0.12, marble, body);
sphere([1.41, 1.43, -0.61], [0.30, 0.22, 0.18], marble, body);

for (let i = 0; i < 8; i++) {
  const a = -0.9 + i * 0.24;
  const x = Math.cos(a) * 1.04;
  const z = Math.sin(a) * 0.72 - 0.06;
  feather([x, 0.86, z], [Math.cos(a) * 0.55, 0.22, Math.sin(a) * 0.45], 0.12, 0.52, marble, body);
}

const pedestalShadow = new THREE.Mesh(
  new THREE.CircleGeometry(4.5, 64),
  new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.34 })
);
pedestalShadow.rotation.x = -Math.PI / 2;
pedestalShadow.position.y = -0.015;
pedestalShadow.receiveShadow = true;
scene.add(pedestalShadow);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0x202328, roughness: 0.8, metalness: 0.02 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.035;
floor.receiveShadow = true;
scene.add(floor);

const backdrop = new THREE.Mesh(
  new THREE.CircleGeometry(8, 64),
  new THREE.MeshBasicMaterial({ color: 0x17191c })
);
backdrop.position.set(0, 4, -5.5);
backdrop.rotation.x = -0.1;
scene.add(backdrop);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
