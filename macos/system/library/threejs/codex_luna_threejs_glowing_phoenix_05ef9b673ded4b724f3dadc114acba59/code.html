<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glowing Phoenix</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08030a}
canvas{display:block}
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08030a);
scene.fog = new THREE.FogExp2(0x0b040b, 0.035);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0.2, 2.8, 11.5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.45;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
controls.minDistance = 7;
controls.maxDistance = 16;
controls.target.set(0, 1.5, 0);

scene.add(new THREE.HemisphereLight(0x321025, 0x060208, 1.3));
const warmLight = new THREE.PointLight(0xff4b12, 18, 16, 2);
warmLight.position.set(0, 2.2, 1);
warmLight.castShadow = true;
scene.add(warmLight);
const rimLight = new THREE.PointLight(0x8e1638, 12, 14, 2);
rimLight.position.set(-4, 3, -3);
scene.add(rimLight);
const keyLight = new THREE.DirectionalLight(0xffc080, 3.2);
keyLight.position.set(4, 8, 6);
keyLight.castShadow = true;
scene.add(keyLight);

const phoenix = new THREE.Group();
phoenix.position.y = -0.45;
scene.add(phoenix);

const ember = new THREE.MeshStandardMaterial({
  color:0x7a0d16,
  emissive:0xff2108,
  emissiveIntensity:3.2,
  roughness:0.3,
  metalness:0.05
});
const scarlet = new THREE.MeshStandardMaterial({
  color:0x4b0715,
  emissive:0xd9160c,
  emissiveIntensity:2.4,
  roughness:0.38
});
const crimson = new THREE.MeshStandardMaterial({
  color:0x240512,
  emissive:0x7d071b,
  emissiveIntensity:2.1,
  roughness:0.48
});
const gold = new THREE.MeshStandardMaterial({
  color:0xa52a0b,
  emissive:0xff7219,
  emissiveIntensity:3.5,
  roughness:0.25
});
const hot = new THREE.MeshStandardMaterial({
  color:0xffb15c,
  emissive:0xffd28a,
  emissiveIntensity:5.5,
  roughness:0.18
});
const whiteHot = new THREE.MeshBasicMaterial({
  color:0xfff3c4,
  transparent:true,
  opacity:0.96,
  blending:THREE.AdditiveBlending,
  depthWrite:false
});
const aura = new THREE.MeshBasicMaterial({
  color:0xff3b12,
  transparent:true,
  opacity:0.075,
  blending:THREE.AdditiveBlending,
  depthWrite:false
});

function sphere(name, position, scale, material, segments=20) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, segments, segments), material);
  mesh.name = name;
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  phoenix.add(mesh);
  return mesh;
}

function feather(start, direction, width, material, innerMaterial, parent=phoenix) {
  const dir = direction.clone();
  const length = dir.length();
  dir.normalize();
  const group = new THREE.Group();
  group.position.copy(start);
  group.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
  const outer = new THREE.Mesh(new THREE.ConeGeometry(width, length, 10, 2), material);
  outer.position.y = length * 0.5;
  outer.scale.x = 0.72;
  outer.scale.z = 0.72;
  outer.castShadow = true;
  group.add(outer);
  const inner = new THREE.Mesh(new THREE.ConeGeometry(width * 0.57, length * 0.86, 8, 2), innerMaterial);
  inner.position.y = length * 0.53;
  inner.scale.x = 0.58;
  inner.scale.z = 0.58;
  group.add(inner);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(width * 0.28, 10, 8), whiteHot);
  tip.position.y = length * 0.91;
  group.add(tip);
  parent.add(group);
  return group;
}

sphere("radiant aura", new THREE.Vector3(0,1.45,-0.3), new THREE.Vector3(3.2,3.4,1.55), aura, 24);

sphere("body", new THREE.Vector3(0,1.15,0), new THREE.Vector3(1.13,1.75,0.78), ember, 28);
sphere("breast glow", new THREE.Vector3(0,1.18,0.68), new THREE.Vector3(0.7,1.12,0.28), gold, 22);
sphere("heart fire", new THREE.Vector3(0,1.35,0.88), new THREE.Vector3(0.3,0.62,0.11), whiteHot, 18);

for (let i=0;i<11;i++) {
  const y = 0.15 + i*0.19;
  const x = Math.sin(i*1.7)*0.32;
  sphere("chest plume", new THREE.Vector3(x,y,0.72), new THREE.Vector3(0.28,0.48,0.12), i%3===0?hot:gold, 12)
    .rotation.z = (i%2?0.25:-0.25);
}

const neck = sphere("neck", new THREE.Vector3(0,2.45,0), new THREE.Vector3(0.58,1.02,0.52), scarlet, 22);
neck.rotation.z = -0.13;
sphere("head", new THREE.Vector3(0.08,3.42,0.02), new THREE.Vector3(0.72,0.68,0.64), ember, 24);
sphere("face fire", new THREE.Vector3(0.25,3.42,0.5), new THREE.Vector3(0.42,0.35,0.24), gold, 18);

const beak = new THREE.Mesh(new THREE.ConeGeometry(0.24,0.86,8), hot);
beak.rotation.z = -Math.PI/2;
beak.position.set(0.72,3.4,0.06);
beak.castShadow = true;
phoenix.add(beak);

for (const side of [-1,1]) {
  const eye = sphere("eye", new THREE.Vector3(0.39,3.58,side*0.48), new THREE.Vector3(0.09,0.09,0.09), whiteHot, 12);
  eye.rotation.y = side*0.2;
  const brow = feather(new THREE.Vector3(0.14,3.8,side*0.34), new THREE.Vector3(0.15,0.38,side*0.12), 0.13, crimson, gold);
  brow.rotation.z = side*0.18;
}

for (const side of [-1,1]) {
  for (let i=0;i<5;i++) {
    const x = side*(0.18 + i*0.08);
    const y = 3.78 + i*0.18;
    const z = -0.02 - i*0.03;
    feather(new THREE.Vector3(x,y,z), new THREE.Vector3(side*(0.32+0.10*i),0.72+0.13*i,-0.12), 0.2-0.018*i, i<2?gold:scarlet);
  }
}

for (const side of [-1,1]) {
  sphere("wing shoulder", new THREE.Vector3(side*0.78,2.05,0), new THREE.Vector3(0.78,0.95,0.43), scarlet, 22);
  const wingDirs = [
    [side*1.15,1.0,-0.02],
    [side*1.72,1.62,-0.05],
    [side*2.25,2.03,-0.08],
    [side*2.76,2.13,-0.1],
    [side*3.18,1.78,-0.05],
    [side*3.36,1.16,0.04],
    [side*3.16,0.54,0.14]
  ];
  wingDirs.forEach((d,i)=>{
    feather(new THREE.Vector3(side*(0.62+i*0.055),2.2-i*0.045,0), new THREE.Vector3(d[0],d[1],d[2]), 0.31-i*0.018, i<3?gold:scarlet);
  });
  for (let i=0;i<4;i++) {
    feather(new THREE.Vector3(side*(0.58+i*0.1),1.65+i*0.2,0.22), new THREE.Vector3(side*(1.38+i*0.35),0.72+i*0.12,0.18), 0.24, crimson, gold);
  }
}

const tailDirections = [
  [-0.3,-3.9,-0.3],
  [0.35,-4.55,-0.55],
  [1.02,-4.72,-0.7],
  [-1.0,-4.42,-0.62],
  [1.75,-4.05,-0.42],
  [-1.68,-3.98,-0.35],
  [2.35,-3.28,-0.1],
  [-2.28,-3.25,-0.08]
];
tailDirections.forEach((d,i)=>{
  const base = new THREE.Vector3((i-3.5)*0.11,0.05,0.02);
  feather(base, new THREE.Vector3(d[0],d[1],d[2]), 0.35-(i%3)*0.035, i%3===0?gold:scarlet, i%2?gold:hot);
});
sphere("tail core", new THREE.Vector3(0,-0.05,0), new THREE.Vector3(0.54,0.76,0.5), gold, 18);

const emberGroup = new THREE.Group();
phoenix.add(emberGroup);
const emberMeshes = [];
for (let i=0;i<62;i++) {
  const side = i%2===0?1:-1;
  const x = side*(2.5 + Math.random()*1.35);
  const y = 2.0 + Math.random()*2.15;
  const z = -0.15 + Math.random()*0.6;
  const s = 0.025 + Math.random()*0.065;
  const m = new THREE.Mesh(new THREE.SphereGeometry(s,8,8), i%5===0?whiteHot:hot);
  m.position.set(x,y,z);
  m.userData = {baseX:x, baseY:y, phase:Math.random()*Math.PI*2, speed:0.35+Math.random()*0.8};
  emberGroup.add(m);
  emberMeshes.push(m);
}

const halo = new THREE.Mesh(
  new THREE.SphereGeometry(1,24,16),
  new THREE.MeshBasicMaterial({color:0xff4a12,transparent:true,opacity:0.035,blending:THREE.AdditiveBlending,side:THREE.BackSide,depthWrite:false})
);
halo.scale.set(4.8,4.8,4.8);
halo.position.set(0,1.7,0);
phoenix.add(halo);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  phoenix.position.y = -0.45 + Math.sin(t*1.2)*0.055;
  phoenix.rotation.z = Math.sin(t*0.65)*0.018;
  warmLight.intensity = 17 + Math.sin(t*5.5)*2.2;
  emberMeshes.forEach((m,i)=>{
    const u=m.userData;
    m.position.y = u.baseY + Math.sin(t*u.speed + u.phase)*0.15 + (t*u.speed*0.13)%0.75;
    m.position.x = u.baseX + Math.sin(t*0.7+u.phase)*0.18;
    m.position.z = Math.cos(t*0.8+u.phase)*0.18;
    m.scale.setScalar(0.72 + 0.35*Math.sin(t*4+u.phase));
  });
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
