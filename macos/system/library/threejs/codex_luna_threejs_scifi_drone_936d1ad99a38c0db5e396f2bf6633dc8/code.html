<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surveillance Drone</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050911; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050911);
scene.fog = new THREE.Fog(0x050911, 8, 18);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.2, 3.4, 6.4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 4;
controls.maxDistance = 11;
controls.target.set(0, 0.25, 0);

scene.add(new THREE.HemisphereLight(0x9fd8ff, 0x10151d, 1.4));

const keyLight = new THREE.DirectionalLight(0xdcecff, 3.2);
keyLight.position.set(4, 7, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -5;
scene.add(keyLight);

const cyanLight = new THREE.PointLight(0x00eaff, 7, 5, 2);
cyanLight.position.set(0, 0.35, -1.35);
scene.add(cyanLight);

const whiteShell = new THREE.MeshStandardMaterial({
  color: 0xdfe8ed, metalness: 0.72, roughness: 0.24
});
const shellShadow = new THREE.MeshStandardMaterial({
  color: 0x26313a, metalness: 0.8, roughness: 0.3
});
const darkMaterial = new THREE.MeshStandardMaterial({
  color: 0x10171f, metalness: 0.88, roughness: 0.22
});
const panelMaterial = new THREE.MeshStandardMaterial({
  color: 0x5d6b75, metalness: 0.8, roughness: 0.32
});
const cyanMaterial = new THREE.MeshStandardMaterial({
  color: 0x18eaff, emissive: 0x00dff5, emissiveIntensity: 5,
  metalness: 0.2, roughness: 0.16
});
const amberMaterial = new THREE.MeshStandardMaterial({
  color: 0xffb42b, emissive: 0xff6700, emissiveIntensity: 2.5
});

function addMesh(geometry, material, parent, position, scale, rotation) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(position[0], position[1], position[2]);
  if (scale) mesh.scale.set(scale[0], scale[1], scale[2]);
  if (rotation) mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function cylinderBetween(parent, start, end, radius, material, segments = 16) {
  const a = new THREE.Vector3(start[0], start[1], start[2]);
  const b = new THREE.Vector3(end[0], end[1], end[2]);
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, segments), material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

const drone = new THREE.Group();
drone.position.y = 0.22;
scene.add(drone);

const body = new THREE.Group();
drone.add(body);

addMesh(new THREE.SphereGeometry(1, 48, 24), whiteShell, body, [0, 0.25, 0], [1.58, 0.55, 1.15]);
addMesh(new THREE.SphereGeometry(1, 40, 20), shellShadow, body, [0, -0.06, 0.08], [1.3, 0.23, 0.9]);

const nose = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 20), whiteShell);
nose.position.set(0, 0.28, -0.7);
nose.scale.set(0.92, 0.4, 0.72);
nose.castShadow = true;
body.add(nose);

const bellyPlate = addMesh(
  new THREE.BoxGeometry(1.35, 0.08, 0.92), darkMaterial, body,
  [0, -0.31, 0.08], [1, 1, 1], [0, 0, 0]
);
bellyPlate.rotation.x = -0.03;

const eyeHousing = addMesh(
  new THREE.CylinderGeometry(0.27, 0.31, 0.18, 32), darkMaterial, body,
  [0, 0.32, -1.29], [1, 1, 1], [Math.PI / 2, 0, 0]
);
addMesh(
  new THREE.SphereGeometry(1, 32, 16), cyanMaterial, body,
  [0, 0.32, -1.4], [0.19, 0.19, 0.075]
);

const eyeRing = new THREE.Mesh(new THREE.TorusGeometry(0.255, 0.025, 10, 32), cyanMaterial);
eyeRing.position.set(0, 0.32, -1.405);
eyeRing.rotation.x = Math.PI / 2;
body.add(eyeRing);

const accentLeft = addMesh(new THREE.BoxGeometry(0.72, 0.035, 0.045), cyanMaterial, body, [-0.58, 0.34, -0.44]);
accentLeft.rotation.z = -0.08;
const accentRight = addMesh(new THREE.BoxGeometry(0.72, 0.035, 0.045), cyanMaterial, body, [0.58, 0.34, -0.44]);
accentRight.rotation.z = 0.08;

for (const side of [-1, 1]) {
  addMesh(new THREE.BoxGeometry(0.055, 0.22, 0.72), panelMaterial, body, [side * 1.12, 0.19, 0.13], [1, 1, 1], [0, side * 0.18, side * 0.04]);
  addMesh(new THREE.BoxGeometry(0.035, 0.03, 0.5), cyanMaterial, body, [side * 1.31, 0.17, 0.1], [1, 1, 1], [0, side * 0.12, 0]);
}

const rotorGroups = [];
const podPositions = [
  [-2.02, 0.02, -1.42],
  [ 2.02, 0.02, -1.42],
  [-2.02, 0.02,  1.42],
  [ 2.02, 0.02,  1.42]
];

for (const pod of podPositions) {
  const x = pod[0], y = pod[1], z = pod[2];
  const inner = [x * 0.42, 0.1, z * 0.42];
  cylinderBetween(drone, inner, [x, y, z], 0.105, darkMaterial, 16);
  cylinderBetween(drone, [x * 0.68, 0.08, z * 0.68], [x * 0.94, 0.05, z * 0.94], 0.145, whiteShell, 16);

  const podGroup = new THREE.Group();
  podGroup.position.set(x, y, z);
  drone.add(podGroup);

  addMesh(new THREE.CylinderGeometry(0.55, 0.49, 0.22, 32), darkMaterial, podGroup, [0, 0, 0]);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.51, 0.065, 12, 32), panelMaterial);
  rim.rotation.x = Math.PI / 2;
  rim.castShadow = true;
  podGroup.add(rim);

  const lightRim = new THREE.Mesh(new THREE.TorusGeometry(0.43, 0.018, 8, 32), cyanMaterial);
  lightRim.rotation.x = Math.PI / 2;
  lightRim.position.y = -0.115;
  podGroup.add(lightRim);

  const rotor = new THREE.Group();
  rotor.position.y = 0.14;
  podGroup.add(rotor);
  addMesh(new THREE.BoxGeometry(0.84, 0.025, 0.075), panelMaterial, rotor, [0, 0, 0]);
  addMesh(new THREE.BoxGeometry(0.075, 0.025, 0.84), panelMaterial, rotor, [0, 0, 0]);
  addMesh(new THREE.CylinderGeometry(0.08, 0.08, 0.055, 16), amberMaterial, rotor, [0, 0.02, 0]);
  rotorGroups.push(rotor);
}

const skidMaterial = new THREE.MeshStandardMaterial({
  color: 0x64737c, metalness: 0.9, roughness: 0.25
});
cylinderBetween(drone, [-0.82, -0.3, -0.62], [-0.82, -0.62, -0.42], 0.045, skidMaterial, 12);
cylinderBetween(drone, [ 0.82, -0.3, -0.62], [ 0.82, -0.62, -0.42], 0.045, skidMaterial, 12);
cylinderBetween(drone, [-0.82, -0.62, -0.42], [-0.82, -0.62, 0.65], 0.045, skidMaterial, 12);
cylinderBetween(drone, [ 0.82, -0.62, -0.42], [ 0.82, -0.62, 0.65], 0.045, skidMaterial, 12);

const underGlow = new THREE.PointLight(0x00cfff, 1.8, 3.5);
underGlow.position.set(0, -0.55, 0);
drone.add(underGlow);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(18, 96),
  new THREE.MeshStandardMaterial({ color: 0x070d15, metalness: 0.25, roughness: 0.78 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.15;
floor.receiveShadow = true;
scene.add(floor);

const grid = new THREE.GridHelper(30, 30, 0x12303b, 0x0a1821);
grid.position.y = -1.14;
grid.material.transparent = true;
grid.material.opacity = 0.28;
scene.add(grid);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  for (let i = 0; i < rotorGroups.length; i++) {
    rotorGroups[i].rotation.y = elapsed * (i % 2 === 0 ? 18 : -18);
  }
  const pulse = 4.2 + Math.sin(elapsed * 4.5) * 1.2;
  cyanMaterial.emissiveIntensity = pulse;
  cyanLight.intensity = 6.2 + Math.sin(elapsed * 4.5) * 1.2;
  drone.position.y = 0.22 + Math.sin(elapsed * 1.7) * 0.045;
  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
