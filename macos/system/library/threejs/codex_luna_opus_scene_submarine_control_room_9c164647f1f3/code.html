<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submarine Control Room</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05090a}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x071012);
scene.fog = new THREE.Fog(0x071012, 18, 35);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,60);
camera.position.set(14,9.5,15);
const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .055;
controls.autoRotate = true;
controls.autoRotateSpeed = .28;
controls.target.set(0,3.6,0);

const clock = new THREE.Clock();
let seed = 41729;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function pick(a,b){return a+(b-a)*rand()}

const mats = {
  floor:new THREE.MeshStandardMaterial({color:0x172326,roughness:.8,metalness:.38}),
  wall:new THREE.MeshStandardMaterial({color:0x283438,roughness:.76,metalness:.42}),
  panel:new THREE.MeshStandardMaterial({color:0x4b5552,roughness:.57,metalness:.72}),
  dark:new THREE.MeshStandardMaterial({color:0x10191a,roughness:.62,metalness:.7}),
  rubber:new THREE.MeshStandardMaterial({color:0x161b1a,roughness:.92,metalness:.05}),
  brass:new THREE.MeshStandardMaterial({color:0x9a7541,roughness:.4,metalness:.82}),
  copper:new THREE.MeshStandardMaterial({color:0x8b4f32,roughness:.44,metalness:.75}),
  green:new THREE.MeshStandardMaterial({color:0x77d29d,emissive:0x164e35,emissiveIntensity:1.4,roughness:.28,metalness:.15}),
  greenDark:new THREE.MeshStandardMaterial({color:0x173d31,emissive:0x082218,emissiveIntensity:.9,roughness:.45}),
  red:new THREE.MeshStandardMaterial({color:0xff4533,emissive:0x8d1008,emissiveIntensity:2.7,roughness:.24}),
  amber:new THREE.MeshStandardMaterial({color:0xffb84d,emissive:0x713a0a,emissiveIntensity:1.2,roughness:.3}),
  cream:new THREE.MeshStandardMaterial({color:0xc6b994,roughness:.8,metalness:.1}),
  blue:new THREE.MeshStandardMaterial({color:0x203b4a,roughness:.62,metalness:.32})
};

function box(name,x,y,z,sx,sy,sz,mat,group=scene){
  const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
  m.name=name;m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;group.add(m);return m;
}
function cyl(name,x,y,z,r,h,mat,rot,group=scene,segments=16){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,segments),mat);
  m.name=name;m.position.set(x,y,z);
  if(rot)m.rotation.set(rot.x||0,rot.y||0,rot.z||0);
  m.castShadow=true;m.receiveShadow=true;group.add(m);return m;
}
function torus(name,x,y,z,R,r,mat,rot,group=scene){
  const m=new THREE.Mesh(new THREE.TorusGeometry(R,r,10,28),mat);
  m.name=name;m.position.set(x,y,z);if(rot)m.rotation.set(rot.x||0,rot.y||0,rot.z||0);
  m.castShadow=true;m.receiveShadow=true;group.add(m);return m;
}
function sphere(name,x,y,z,r,mat,group=scene){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,10),mat);
  m.name=name;m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;group.add(m);return m;
}
function pipe(a,b,r,mat= mats.copper,group=scene){
  const av=new THREE.Vector3(...a),bv=new THREE.Vector3(...b),d=bv.clone().sub(av);
  const m=cyl('pipe',0,0,0,r,d.length(),mat,null,group,12);
  m.position.copy(av).add(bv).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
  return m;
}
function label(text,w=256,h=64,bg='rgba(8,14,14,.92)',fg='#d5c894'){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(197,172,112,.5)';x.lineWidth=3;x.strokeRect(3,3,w-6,h-6);
  x.font='bold '+Math.floor(h*.4)+'px monospace';x.textAlign='center';x.textBaseline='middle';x.fillStyle=fg;x.fillText(text,w/2,h/2+2);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  return new THREE.MeshBasicMaterial({map:t,transparent:true});
}
function panelLabel(text,x,y,z,rot={x:-Math.PI/2,y:0,z:0},scale=.8){
  const m=box('placard',x,y,z,1.65*scale,.025,.42*scale,label(text),scene);m.rotation.set(rot.x,rot.y,rot.z);return m;
}

box('floor',0,-.15,0,18,.3,14,mats.floor);
box('rear wall',0,4,-6.3,18,8,.28,mats.wall);
box('left wall',-8.8,4,0,.28,8,13,mats.wall);
box('right wall',8.8,4,0,.28,8,13,mats.wall);
box('ceiling',0,8.2,0,18,.25,14,mats.dark);

for(let x=-8;x<=8;x+=2){
  box('floor seam',x,.015,0,.025,.012,12,mats.dark);
}
for(let z=-5;z<=5;z+=2){
  box('floor seam',0,.018,z,17,.012,.025,mats.dark);
}
for(let x=-8;x<=8;x+=2){
  for(let y=1;y<=7;y+=2){
    cyl('rivet',x,y,-6.48,.075,.04,mats.brass,{x:Math.PI/2},scene,10);
  }
}
for(let z=-5;z<=5;z+=2){
  for(let y=1;y<=7;y+=2){
    cyl('rivet',-8.98,y,z,.075,.04,mats.brass,{z:Math.PI/2},scene,10);
    cyl('rivet',8.98,y,z,.075,.04,mats.brass,{z:Math.PI/2},scene,10);
  }
}

const overhead=[];
for(let x=-7;x<=7;x+=3.5){
  box('ceiling beam',x,7.72,0,.2,.35,12,mats.panel);
}
for(let z=-5;z<=5;z+=2.5) box('beam',0,7.82,z,17,.18,.18,mats.panel);

const lightWarm=new THREE.PointLight(0xd0a56a,1.6,13,2);
lightWarm.position.set(-2,7,1);lightWarm.castShadow=true;lightWarm.shadow.mapSize.set(1024,1024);scene.add(lightWarm);
const lightGreen=new THREE.PointLight(0x32d285,2.1,10,2);
lightGreen.position.set(4,3.8,1);lightGreen.castShadow=true;scene.add(lightGreen);
const lightRed=new THREE.PointLight(0xff2415,1.5,8,2);
lightRed.position.set(1,6.8,-2);lightRed.castShadow=true;scene.add(lightRed);
for(const p of [[-6,6,-4],[6,6,-4],[-6,6,4],[6,6,4]]){
  const l=new THREE.PointLight(0x9ab6a7,.45,7,2);l.position.set(...p);scene.add(l);
}

const periscope=new THREE.Group();periscope.position.set(-1.5,0,-.2);scene.add(periscope);
cyl('periscope base',0,.25,0,1.03,.5,mats.dark,null,periscope,32);
torus('base rim',0,.52,0,1.03,.12,mats.brass,{x:0},periscope);
cyl('periscope column',0,3.6,0,.58,6.1,mats.panel,null,periscope,24);
cyl('column inner',0,3.6,0,.4,6.15,mats.dark,null,periscope,24);
for(let y=1;y<7;y+=.65) torus('column seam',0,y,0,.59,.035,mats.brass,{x:Math.PI/2},periscope);
cyl('scope elbow',.43,6.45,0,.58,1.1,mats.panel,{z:Math.PI/2},periscope);
box('scope head',.92,6.45,0,1.25,.9,1.1,mats.dark,periscope);
box('scope lens',1.55,6.45,0,.08,.5,.62,mats.green,periscope);
for(const z of [-.62,.62]){
  const h=new THREE.Group();h.position.set(0,4.45,z);periscope.add(h);
  box('fold down handle',0,0,0,.18,.9,.18,mats.brass,h);
  torus('handle grip',0,-.48,0,.18,.07,mats.rubber,{x:Math.PI/2},h);
  h.rotation.x=z>0?-.28:.28;
}

function wheel(x,y,z,rot){
  const g=new THREE.Group();g.position.set(x,y,z);g.rotation.set(rot.x||0,rot.y||0,rot.z||0);scene.add(g);
  torus('valve wheel',0,0,0,.54,.095,mats.brass,{x:Math.PI/2},g);
  cyl('hub',0,0,0,.16,.2,mats.dark,{x:Math.PI/2},g);
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3;
    box('wheel spoke',Math.cos(a)*.3,Math.sin(a)*.3,0,.5,.07,.1,mats.brass,g).rotation.z=a;
  }
  return g;
}
for(let i=0;i<4;i++) wheel(-7.9,1.3+i*1.35,-3.8,{x:Math.PI/2});
for(let i=0;i<4;i++) wheel(7.9,1.3+i*1.35,-3.7,{x:Math.PI/2});
for(let i=0;i<3;i++) wheel(-6.9,2.1+i*1.65,-6.48,{x:0});
for(let i=0;i<3;i++) wheel(6.1,1.7+i*1.6,-6.48,{x:0});

for(const x of [-7.3,-6.7,6.5,7.1]){
  pipe([x,1,-5.8],[x,7,-5.8],.105,mats.copper);
  pipe([x,1,-5.8],[x+.5,1,-5.8],.105,mats.copper);
}

function gauge(x,y,z,scale=.7,rot={x:0,y:0,z:0}){
  const g=new THREE.Group();g.position.set(x,y,z);g.scale.setScalar(scale);g.rotation.set(rot.x,rot.y,rot.z);scene.add(g);
  cyl('gauge body',0,0,0,.7,.24,mats.dark,{x:Math.PI/2},g,24);
  torus('gauge bezel',0,0,.14,.62,.09,mats.brass,{x:Math.PI/2},g);
  const face=cyl('gauge face',0,0,.16,.52,.025,mats.cream,{x:Math.PI/2},g,32);
  for(let i=0;i<9;i++){
    const a=-Math.PI*.75+i*Math.PI*1.5/8;
    box('gauge tick',Math.cos(a)*.4,Math.sin(a)*.4,.19,.05,.13,.025,mats.dark,g).rotation.z=a+Math.PI/2;
  }
  const needle=box('trembling needle',0,.08,.23,.055,.48,.035,mats.red,g);
  needle.position.y=.18;needle.rotation.z=-.55;
  gauges.push(needle);
  return g;
}
const gauges=[];
gauge(-4.9,4.9,-6.5,.74);
gauge(-3.15,4.9,-6.5,.74);
gauge(4.0,5.2,-6.5,.8);
gauge(5.9,5.2,-6.5,.8);
gauge(-7.9,5.8,-1.6,.65,{x:0,y:Math.PI/2,z:0});
gauge(7.9,5.7,-1.3,.65,{x:0,y:-Math.PI/2,z:0});

const consoleG=new THREE.Group();scene.add(consoleG);
box('console base',2.2,1.25,2.4,7.5,2.25,1.25,mats.dark,consoleG);
box('console fascia',2.2,2.0,1.72,7.3,1.15,.16,mats.panel,consoleG);
box('console top',2.2,2.45,2.28,7.6,.18,1.5,mats.brass,consoleG).rotation.x=-.16;
for(let i=0;i<9;i++){
  const x=-.8+i*.75;
  cyl('toggle',x,2.35,2.08,.07,.35,i%3?mats.red:mats.green,{x:0},consoleG,10);
}
for(let i=0;i<5;i++){
  cyl('console knob',-.5+i*1.2,2.55,2.45,.18,.12,mats.brass,{x:Math.PI/2},consoleG,16);
}
panelLabel('DIVE CONTROL',.2,2.62,2.15,{x:-Math.PI/2,y:0,z:0},.55);
panelLabel('TRIM / PUMP',4.2,2.62,2.15,{x:-Math.PI/2,y:0,z:0},.55);

const sonar=new THREE.Group();sonar.position.set(5.9,4.15,-5.98);scene.add(sonar);
cyl('sonar housing',0,0,0,1.35,.3,mats.dark,{x:Math.PI/2},sonar,32);
torus('sonar rim',0,0,.18,1.24,.1,mats.brass,{x:Math.PI/2},sonar);
const sonarFace=cyl('sonar screen',0,0,.2,1.1,.035,mats.greenDark,{x:Math.PI/2},sonar,48);
for(let r of [.35,.7,1.02]) torus('sonar ring',0,0,.23,r,.018,mats.green,{x:Math.PI/2},sonar);
for(let a=0;a<Math.PI*2;a+=Math.PI/4) box('sonar radial',Math.cos(a)*.56,Math.sin(a)*.56,.235,.95,.018,.01,mats.green,sonar).rotation.z=a;
const sweep=new THREE.Mesh(new THREE.PlaneGeometry(1.02,1.02),new THREE.MeshBasicMaterial({color:0x72ffbd,transparent:true,opacity:.35,side:THREE.DoubleSide}));
sweep.position.z=.25;sweep.rotation.x=Math.PI/2;sweep.geometry.translate(.5,0,0);sonar.add(sweep);
const ping=new THREE.Mesh(new THREE.RingGeometry(.15,.19,24),new THREE.MeshBasicMaterial({color:0xa8ffd0,transparent:true,opacity:0,side:THREE.DoubleSide}));
ping.position.z=.27;ping.rotation.x=Math.PI/2;sonar.add(ping);
panelLabel('SONAR / PING',5.9,2.45,-5.85,{x:0,y:0,z:0},.62);

const chart=new THREE.Group();chart.position.set(-4.6,2.5,2.4);chart.rotation.y=.12;scene.add(chart);
box('chart table',0,0,0,3.6,.22,2.15,mats.brass,chart);
box('chart inset',0,.13,0,3.05,.04,1.65,mats.cream,chart);
for(const x of [-1.45,1.45]) for(const z of [-.78,.78]) pipe([x,-.05,z],[x,-1.9,z],.12,mats.dark,chart);
for(let i=0;i<7;i++) pipe([-1.2+i*.4,.17,-.62],[-.5+i*.25,.18,.6],.012,mats.red,chart);
for(let i=0;i<6;i++) box('chart grid',-.95+i*.38,.2,0,.018,.012,1.4,mats.blue,chart);
for(let i=0;i<4;i++) box('chart grid',0,.2,-.5+i*.34,2.7,.012,.018,mats.blue,chart);
panelLabel('NAVIGATION',-4.6,2.75,1.7,{x:-Math.PI/2,y:0,z:0},.62);
for(let i=0;i<3;i++) gauge(-5.55+i*.72,3.45,1.55,.43,{x:-Math.PI/2,y:0,z:0});
cyl('compass',-4.6,2.73,2.35,.33,.06,mats.green,{x:Math.PI/2},scene,24);
torus('compass ring',-4.6,2.76,2.35,.33,.035,mats.brass,{x:Math.PI/2},scene);

const alcove=new THREE.Group();alcove.position.set(-4.8,0,-4.9);scene.add(alcove);
box('bunk alcove',0,3.2,0,6.1,5.7,.3,mats.dark,alcove);
for(const y of [1.25,3.25,5.25]){
  box('bunk frame',0,y,.45,5.3,.18,1.7,mats.panel,alcove);
  box('mattress',0,y+.2,.08,4.85,.3,1.28,mats.blue,alcove);
  box('pillow',-1.7,y+.4,.06,.85,.28,1.12,mats.cream,alcove);
  box('blanket',1.0,y+.38,.1,2.4,.08,1.1,mats.greenDark,alcove);
}
for(const x of [-2.7,2.7]) pipe([x,0,.5],[x,7,.5],.09,mats.brass,alcove);
for(let i=0;i<4;i++) box('bunk rung',-2.7+i*.55,1+i*.75,.52,.42,.1,.1,mats.brass,alcove);
panelLabel('CREW BERTHS',-4.8,6.4,-4.6,{x:-Math.PI/2,y:0,z:0},.58);

const hatch=new THREE.Group();hatch.position.set(0,4.1,-6.0);scene.add(hatch);
cyl('hatch',0,0,0,1.7,.25,mats.dark,{x:Math.PI/2},hatch,36);
torus('hatch ring',0,0,.16,1.55,.15,mats.brass,{x:Math.PI/2},hatch);
for(let i=0;i<8;i++){const a=i*Math.PI/4;box('hatch bolt',Math.cos(a)*1.25,Math.sin(a)*1.25,.22,.18,.18,.1,mats.brass,hatch).rotation.z=a}
box('hatch center',0,0,.22,1.1,.04,1.1,mats.blue,hatch);

const alert=new THREE.Group();alert.position.set(1.8,7.18,-2.0);scene.add(alert);
cyl('alert base',0,0,0,.5,.28,mats.dark);
cyl('alert lamp',0,.36,0,.38,.65,mats.red);
torus('alert guard',0,.35,0,.55,.055,mats.brass,{x:Math.PI/2});
for(let i=0;i<3;i++){const a=i*Math.PI*2/3;pipe([0,.05,0],[Math.cos(a)*.52,.78,Math.sin(a)*.52],.045,mats.brass,alert)}

const cables=[];
for(let i=0;i<5;i++){
  const x=2.5+i*.45;
  cables.push(pipe([x,0.5,3.05],[x+.2,1.3,3.05],.035,i%2?mats.copper:mats.greenDark));
}
for(let i=0;i<7;i++){
  const x=3.6+i*.48;
  cyl('console indicator',x,2.25,1.62,.055,.025,i%2?mats.green:mats.red,{x:Math.PI/2},scene,12);
}

for(let i=0;i<18;i++){
  const x=pick(-7.5,7.5),z=pick(-5.2,5);
  if(Math.abs(x)<2.5&&z<3.8) continue;
  cyl('loose pipe fitting',x,.3,z,.12,.18,mats.brass,null,scene,10);
}

function makeLamp(x,y,z,color){
  const g=new THREE.Group();g.position.set(x,y,z);scene.add(g);
  cyl('lamp stem',0,0,0,.08,.35,mats.brass);
  sphere('lamp glow',0,.23,0,.15,color,g);
  const l=new THREE.PointLight(color.color||0x77ffbb,.5,3);l.position.set(0,.23,0);g.add(l);
}
makeLamp(-7.7,6.8,-2.5,mats.green);
makeLamp(7.7,6.8,-2.8,mats.amber);
makeLamp(-7.7,6.8,2.8,mats.red);

const dust=[];
for(let i=0;i<45;i++){
  const p=sphere('dust',pick(-8,8),pick(.5,7.5),pick(-5.5,5),pick(.008,.025),new THREE.MeshBasicMaterial({color:0x9fbbaa,transparent:true,opacity:.18}));
  dust.push(p);
}

let lastPing=0;
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  controls.update();
  alert.rotation.y=t*.75;
  sweep.rotation.z=-t*1.6;
  const phase=t%3.8;
  ping.scale.setScalar(phase<1.2?1+phase*1.3:2.55);
  ping.material.opacity=phase<1.2?(1-phase/1.2)*.65:0;
  gauges.forEach((n,i)=>{
    n.rotation.z+=Math.sin(t*17+i*2.7)*.0018;
    n.rotation.x=Math.sin(t*11+i)*.004;
  });
  cables.forEach((c,i)=>c.rotation.z=Math.sin(t*2+i)*.025);
  dust.forEach((p,i)=>{
    p.position.y+=Math.sin(t*.35+i)*.0007;
    p.position.x+=Math.sin(t*.17+i*3)*.0004;
  });
  lightRed.intensity=1.2+Math.sin(t*4.5)*.35;
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
