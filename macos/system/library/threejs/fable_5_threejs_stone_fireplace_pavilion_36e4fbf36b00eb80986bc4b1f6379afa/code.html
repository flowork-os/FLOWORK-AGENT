<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stone Fireplace Pavilion</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d22; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x22262e);
scene.fog = new THREE.Fog(0x22262e, 30, 70);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(9, 5.5, 11);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.6, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 5;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.495;

// ---------- deterministic rng ----------
let seed = 7;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- stone texture (procedural canvas) ----------
function stoneTexture(base, speck, rep) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2200; i++) {
    const v = rand();
    g.fillStyle = `rgba(${v < 0.5 ? '0,0,0' : speck},${0.04 + rand() * 0.10})`;
    const s = 1 + rand() * 3;
    g.fillRect(rand() * 256, rand() * 256, s, s);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rep, rep);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const stoneMat = new THREE.MeshStandardMaterial({
  map: stoneTexture('#8d8478', '255,250,240', 1.2), roughness: 0.93, metalness: 0.02
});
const darkStoneMat = new THREE.MeshStandardMaterial({
  map: stoneTexture('#6e675e', '230,225,215', 1.2), roughness: 0.95, metalness: 0.02
});
const hearthMat = new THREE.MeshStandardMaterial({
  map: stoneTexture('#7a7268', '240,235,225', 2), roughness: 0.85, metalness: 0.03
});
const soot = new THREE.MeshStandardMaterial({ color: 0x14100d, roughness: 1 });
const emberMat = new THREE.MeshStandardMaterial({
  color: 0x2a1206, emissive: 0xff5a12, emissiveIntensity: 1.6, roughness: 0.9
});

// ---------- pavilion group ----------
const pavilion = new THREE.Group();
scene.add(pavilion);

function addBlock(w, h, d, x, y, z, mat, ry = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat || stoneMat);
  m.position.set(x, y, z);
  m.rotation.y = ry;
  m.castShadow = m.receiveShadow = true;
  pavilion.add(m);
  return m;
}

// jittered stacked-stone course: fills a wall span with irregular blocks
function stoneCourses(x0, x1, y0, y1, z, depth, mat) {
  let y = y0;
  while (y < y1 - 0.02) {
    const h = Math.min(0.28 + rand() * 0.16, y1 - y);
    let x = x0;
    while (x < x1 - 0.02) {
      const w = Math.min(0.35 + rand() * 0.45, x1 - x);
      const dz = (rand() - 0.5) * 0.06;
      const dy = (rand() - 0.5) * 0.015;
      addBlock(w * 0.965, h * 0.94, depth + (rand() - 0.5) * 0.05,
        x + w / 2, y + h / 2 + dy, z + dz, rand() < 0.22 ? darkStoneMat : mat);
      x += w;
    }
    y += h;
  }
}

// ---- hearth slab ----
const hearth = addBlock(6.4, 0.28, 4.2, 0, 0.14, 0.5, hearthMat);
addBlock(5.4, 0.24, 3.4, 0, 0.40, 0.35, hearthMat); // raised inner hearth step

// ---- firebox dimensions ----
const FB_W = 2.0;        // firebox opening half handled by arch
const CHIM_D = 1.9;      // chimney mass depth
const OPEN_H = 1.7;      // height of opening springline

// ---- flanking stone piers (stacked courses) ----
stoneCourses(-3.0, -1.15, 0.52, 3.4, 0, CHIM_D, stoneMat);   // left pier
stoneCourses(1.15, 3.0, 0.52, 3.4, 0, CHIM_D, stoneMat);     // right pier

// ---- pier caps ----
addBlock(2.15, 0.22, CHIM_D + 0.35, -2.07, 3.51, 0, hearthMat);
addBlock(2.15, 0.22, CHIM_D + 0.35, 2.07, 3.51, 0, hearthMat);

// ---- firebox interior (sooted) ----
const fbInner = new THREE.Mesh(new THREE.BoxGeometry(FB_W + 0.25, OPEN_H + 1.1, CHIM_D - 0.35), soot);
fbInner.position.set(0, 0.52 + (OPEN_H + 1.1) / 2 - 0.05, -0.1);
fbInner.receiveShadow = true;
pavilion.add(fbInner);

// side jambs of firebox opening (blocks between piers and opening)
stoneCourses(-1.15, -FB_W / 2, 0.52, OPEN_H + 0.52, 0.06, CHIM_D, stoneMat);
stoneCourses(FB_W / 2, 1.15, 0.52, OPEN_H + 0.52, 0.06, CHIM_D, stoneMat);

// ---- arched voussoirs over firebox opening ----
const springY = OPEN_H + 0.52;
const archR = FB_W / 2;
const nV = 9;
for (let i = 0; i < nV; i++) {
  const a0 = Math.PI * (i / nV);
  const aM = Math.PI * ((i + 0.5) / nV);
  const rIn = archR, rOut = archR + 0.55;
  const rMid = (rIn + rOut) / 2;
  const v = new THREE.Mesh(new THREE.BoxGeometry(rOut - rIn, (Math.PI * rMid / nV) * 0.92, CHIM_D + 0.12), i % 3 ? stoneMat : darkStoneMat);
  v.position.set(Math.cos(aM) * rMid, springY + Math.sin(aM) * rMid, 0.06);
  v.rotation.z = aM - Math.PI / 2;
  v.castShadow = v.receiveShadow = true;
  pavilion.add(v);
}
// keystone
const key = addBlock(0.5, 0.75, CHIM_D + 0.2, 0, springY + archR + 0.28, 0.06, darkStoneMat);
key.rotation.z = 0;

// fill masonry above the arch, between piers
stoneCourses(-1.15, 1.15, springY + archR + 0.68, 3.4, 0.06, CHIM_D, stoneMat);
// arch shoulders (spandrels)
stoneCourses(-1.15, -archR - 0.28, springY, springY + archR + 0.68, 0.06, CHIM_D, stoneMat);
stoneCourses(archR + 0.28, 1.15, springY, springY + archR + 0.68, 0.06, CHIM_D, stoneMat);

// ---- breast / smoke chamber (battered — steps back as it rises) ----
stoneCourses(-2.4, 2.4, 3.62, 4.35, 0, CHIM_D - 0.15, stoneMat);
stoneCourses(-1.9, 1.9, 4.35, 5.05, 0, CHIM_D - 0.3, stoneMat);
stoneCourses(-1.4, 1.4, 5.05, 5.75, 0, CHIM_D - 0.45, stoneMat);

// ---- chimney stack ----
stoneCourses(-0.95, 0.95, 5.75, 7.3, 0, 1.25, stoneMat);

// ---- stepped chimney cap ----
addBlock(2.3, 0.22, 1.65, 0, 7.41, 0, hearthMat);
addBlock(1.95, 0.22, 1.35, 0, 7.63, 0, hearthMat);
addBlock(1.6, 0.25, 1.1, 0, 7.86, 0, darkStoneMat);
// flue opening
const flue = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.3, 0.55), soot);
flue.position.set(0, 8.0, 0);
pavilion.add(flue);

// ---- logs + embers in firebox ----
const logMat = new THREE.MeshStandardMaterial({ color: 0x3b2a1c, roughness: 0.95 });
for (let i = 0; i < 4; i++) {
  const log = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 1.1, 8), i < 2 ? logMat : emberMat);
  log.rotation.z = Math.PI / 2;
  log.rotation.y = (rand() - 0.5) * 0.7;
  log.position.set((rand() - 0.5) * 0.4, 0.62 + i * 0.11, 0.1 + (rand() - 0.5) * 0.3);
  log.castShadow = true;
  pavilion.add(log);
}
const emberBed = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.65, 0.1, 16), emberMat);
emberBed.position.set(0, 0.56, 0.05);
pavilion.add(emberBed);

// ---------- ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(40, 64),
  new THREE.MeshStandardMaterial({ color: 0x3a3f38, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// soft contact shadow disc
const shadowCanvas = document.createElement('canvas');
shadowCanvas.width = shadowCanvas.height = 128;
const sg = shadowCanvas.getContext('2d');
const grad = sg.createRadialGradient(64, 64, 8, 64, 64, 64);
grad.addColorStop(0, 'rgba(0,0,0,0.42)');
grad.addColorStop(1, 'rgba(0,0,0,0)');
sg.fillStyle = grad; sg.fillRect(0, 0, 128, 128);
const contact = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 8),
  new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shadowCanvas), transparent: true, depthWrite: false })
);
contact.rotation.x = -Math.PI / 2;
contact.position.y = 0.012;
contact.position.z = 0.4;
scene.add(contact);

// ---------- lighting ----------
scene.add(new THREE.HemisphereLight(0x9fb4cc, 0x3c352b, 0.55));

const sun = new THREE.DirectionalLight(0xffe8c8, 2.1);
sun.position.set(8, 12, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -9;
sun.shadow.camera.right = sun.shadow.camera.top = 9;
sun.shadow.camera.far = 40;
sun.shadow.bias = -0.0004;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x8fb0ff, 0.5);
rim.position.set(-7, 6, -8);
scene.add(rim);

const fire = new THREE.PointLight(0xff6a1e, 14, 8, 2);
fire.position.set(0, 1.1, 0.5);
scene.add(fire);

// ---------- animate ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  fire.intensity = 12 + Math.sin(t * 9) * 2 + Math.sin(t * 23.7) * 1.4;
  emberMat.emissiveIntensity = 1.4 + Math.sin(t * 7.3) * 0.35;
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
