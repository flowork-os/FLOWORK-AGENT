<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Construction Worker — Procedural three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #202226; }
  #info {
    position: fixed; left: 12px; bottom: 12px; z-index: 10;
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: rgba(235,238,245,0.55); letter-spacing: 0.3px; user-select: none;
    pointer-events: none;
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="info">Construction Worker · drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ *
 *  Renderer
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ------------------------------------------------------------------ *
 *  Scene & camera
 * ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202226);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.2, 1.35, 3.25);

/* ------------------------------------------------------------------ *
 *  Lighting  (hemisphere ambience + directional key / fill / rim)
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0x9fb4d6, 0x2a2620, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e2, 2.5);
key.position.set(3.5, 5.5, 4.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 22;
key.shadow.camera.left = -2.2;
key.shadow.camera.right = 2.2;
key.shadow.camera.top = 2.6;
key.shadow.camera.bottom = -0.4;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 3;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fb0ff, 0.6);
fill.position.set(-4.5, 2.2, 2.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.4);
rim.position.set(-2.5, 3.5, -4.5);
scene.add(rim);

/* ------------------------------------------------------------------ *
 *  Ground plane — receives shadows only
 * ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ *
 *  Materials
 * ------------------------------------------------------------------ */
const skinMat   = new THREE.MeshStandardMaterial({ color: 0xc98a5e, roughness: 0.72, metalness: 0.0 });
const hatMat    = new THREE.MeshStandardMaterial({ color: 0xffb400, roughness: 0.34, metalness: 0.02 });
const hatDark   = new THREE.MeshStandardMaterial({ color: 0xe09e00, roughness: 0.34, metalness: 0.02 });
const shirtMat  = new THREE.MeshStandardMaterial({ color: 0x3c4a5b, roughness: 0.88, metalness: 0.0 });
const vestMat   = new THREE.MeshStandardMaterial({ color: 0xcfe200, roughness: 0.6,  metalness: 0.0,
                                                   emissive: 0x4a5600, emissiveIntensity: 0.28 });
const stripeMat = new THREE.MeshStandardMaterial({ color: 0xdce0e6, roughness: 0.22, metalness: 0.75,
                                                   emissive: 0x1a1c20, emissiveIntensity: 0.4 });
const pantsMat  = new THREE.MeshStandardMaterial({ color: 0x8a7043, roughness: 0.92, metalness: 0.0 });
const beltMat   = new THREE.MeshStandardMaterial({ color: 0x241811, roughness: 0.6,  metalness: 0.1 });
const buckleMat = new THREE.MeshStandardMaterial({ color: 0xb9bcc0, roughness: 0.3,  metalness: 0.85 });
const bootMat   = new THREE.MeshStandardMaterial({ color: 0x3a2416, roughness: 0.55, metalness: 0.08 });
const soleMat   = new THREE.MeshStandardMaterial({ color: 0x161618, roughness: 0.95, metalness: 0.0 });
const steelMat  = new THREE.MeshStandardMaterial({ color: 0xbcc0c6, roughness: 0.28, metalness: 0.9 });
const eyeMat    = new THREE.MeshStandardMaterial({ color: 0x22160e, roughness: 0.4,  metalness: 0.0 });
const browMat   = new THREE.MeshStandardMaterial({ color: 0x3a271a, roughness: 0.8,  metalness: 0.0 });
const mouthMat  = new THREE.MeshStandardMaterial({ color: 0x7a4038, roughness: 0.7,  metalness: 0.0 });
const hairMat   = new THREE.MeshStandardMaterial({ color: 0x2c1e14, roughness: 0.9,  metalness: 0.0 });

/* ------------------------------------------------------------------ *
 *  Helpers
 * ------------------------------------------------------------------ */
const worker = new THREE.Group();

function mesh(geo, mat, parent = worker) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function capsule(r, len, mat, parent = worker) {
  return mesh(new THREE.CapsuleGeometry(r, len, 10, 20), mat, parent);
}

/* ------------------------------------------------------------------ *
 *  LEGS  (work pants) + BOOTS
 * ------------------------------------------------------------------ */
function buildLeg(side) {
  const x = 0.115 * side;

  // thigh (upper pant leg)
  const thigh = capsule(0.088, 0.20, pantsMat);
  thigh.position.set(x, 0.70, 0.01);
  thigh.rotation.z = -0.03 * side;

  // shin (lower pant leg)
  const shin = capsule(0.068, 0.20, pantsMat);
  shin.position.set(x, 0.34, 0.0);

  // pant cuff over boot
  const cuff = mesh(new THREE.CylinderGeometry(0.078, 0.084, 0.06, 20), pantsMat);
  cuff.position.set(x, 0.185, 0.0);

  // --- boot ---
  const foot = new THREE.Group();
  foot.position.set(x, 0, 0);
  foot.rotation.y = 0.16 * side;   // toe-out for relaxed stance
  worker.add(foot);

  // boot shaft (ankle)
  const shaft = mesh(new THREE.CylinderGeometry(0.062, 0.07, 0.14, 18), bootMat, foot);
  shaft.position.set(0, 0.135, 0.0);

  // boot body / foot mass
  const body = mesh(new THREE.SphereGeometry(0.075, 20, 16), bootMat, foot);
  body.scale.set(1.0, 0.75, 1.9);
  body.position.set(0, 0.075, 0.075);

  // sole
  const sole = mesh(new THREE.BoxGeometry(0.13, 0.05, 0.30), soleMat, foot);
  sole.position.set(0, 0.025, 0.06);
  sole.geometry.translate(0, 0, 0);

  // steel toe cap (rounded metallic bulge)
  const toe = mesh(new THREE.SphereGeometry(0.058, 18, 14), steelMat, foot);
  toe.scale.set(1.0, 0.85, 0.9);
  toe.position.set(0, 0.07, 0.185);
}
buildLeg(1);
buildLeg(-1);

// pelvis / hips
const pelvis = mesh(new THREE.SphereGeometry(0.15, 24, 18), pantsMat);
pelvis.scale.set(1.15, 0.65, 0.8);
pelvis.position.set(0, 0.93, 0.0);

// belt
const belt = mesh(new THREE.TorusGeometry(0.155, 0.022, 12, 32), beltMat);
belt.rotation.x = Math.PI / 2;
belt.scale.set(1.06, 1.0, 0.78);
belt.position.set(0, 0.99, 0.0);
const buckle = mesh(new THREE.BoxGeometry(0.06, 0.045, 0.02), buckleMat);
buckle.position.set(0, 0.99, 0.122);

/* ------------------------------------------------------------------ *
 *  TORSO (shirt)
 * ------------------------------------------------------------------ */
const torso = capsule(0.15, 0.20, shirtMat);
torso.scale.set(1.28, 1.0, 0.74);
torso.position.set(0, 1.24, 0.0);

// shoulders
for (const s of [-1, 1]) {
  const sh = mesh(new THREE.SphereGeometry(0.075, 18, 14), shirtMat);
  sh.position.set(0.185 * s, 1.40, 0.0);
}

// collar
const collar = mesh(new THREE.TorusGeometry(0.058, 0.02, 10, 24), shirtMat);
collar.rotation.x = Math.PI / 2.1;
collar.position.set(0, 1.475, 0.01);

/* ------------------------------------------------------------------ *
 *  HIGH-VIS VEST  (shell over the shirt) + reflective stripes
 * ------------------------------------------------------------------ */
const vest = capsule(0.16, 0.18, vestMat);
vest.scale.set(1.34, 1.0, 0.86);
vest.position.set(0, 1.21, 0.005);

// horizontal reflective bands
function hStripe(y) {
  const t = mesh(new THREE.TorusGeometry(0.163, 0.014, 12, 40), stripeMat);
  t.rotation.x = Math.PI / 2;
  t.scale.set(1.34, 1.0, 0.86);
  t.position.set(0, y, 0.005);
}
hStripe(1.13);
hStripe(1.29);

// vertical front reflective stripes
for (const s of [-1, 1]) {
  const v = mesh(new THREE.BoxGeometry(0.03, 0.28, 0.012), stripeMat);
  v.position.set(0.075 * s, 1.26, 0.133);
  v.rotation.x = -0.1;
}

/* ------------------------------------------------------------------ *
 *  ARMS (shirt sleeves) + hands
 * ------------------------------------------------------------------ */
function buildArm(side) {
  const arm = new THREE.Group();
  arm.position.set(0.20 * side, 1.40, 0.0);
  arm.rotation.z = 0.12 * side;   // relaxed, slightly away from body
  worker.add(arm);

  // upper arm (sleeve)
  const upper = capsule(0.058, 0.20, shirtMat, arm);
  upper.position.set(0.03 * side, -0.15, 0.0);

  // forearm (sleeve)
  const fore = capsule(0.05, 0.19, shirtMat, arm);
  fore.position.set(0.055 * side, -0.42, 0.02);
  fore.rotation.x = -0.12;

  // hand
  const hand = mesh(new THREE.SphereGeometry(0.058, 16, 14), skinMat, arm);
  hand.scale.set(0.9, 1.15, 0.7);
  hand.position.set(0.065 * side, -0.6, 0.05);
}
buildArm(1);
buildArm(-1);

/* ------------------------------------------------------------------ *
 *  NECK + HEAD  (generic, non-portrait face)
 * ------------------------------------------------------------------ */
const neck = mesh(new THREE.CylinderGeometry(0.05, 0.055, 0.09, 18), skinMat);
neck.position.set(0, 1.51, 0.0);

const head = mesh(new THREE.SphereGeometry(0.11, 28, 22), skinMat);
head.scale.set(0.94, 1.06, 0.98);
head.position.set(0, 1.62, 0.0);

// jaw hint
const jaw = mesh(new THREE.SphereGeometry(0.078, 20, 16), skinMat);
jaw.scale.set(0.9, 0.7, 0.85);
jaw.position.set(0, 1.565, 0.02);

// ears
for (const s of [-1, 1]) {
  const ear = mesh(new THREE.SphereGeometry(0.024, 12, 10), skinMat);
  ear.scale.set(0.6, 1.0, 0.8);
  ear.position.set(0.104 * s, 1.615, 0.0);
}

// nose
const nose = mesh(new THREE.SphereGeometry(0.02, 12, 10), skinMat);
nose.scale.set(0.8, 0.9, 1.3);
nose.position.set(0, 1.605, 0.108);

// eyes
for (const s of [-1, 1]) {
  const eye = mesh(new THREE.SphereGeometry(0.016, 14, 12), eyeMat);
  eye.position.set(0.04 * s, 1.635, 0.096);
  const brow = mesh(new THREE.BoxGeometry(0.045, 0.011, 0.02), browMat);
  brow.position.set(0.04 * s, 1.665, 0.095);
  brow.rotation.z = -0.06 * s;
}

// mouth
const mouth = mesh(new THREE.BoxGeometry(0.05, 0.012, 0.02), mouthMat);
mouth.position.set(0, 1.575, 0.1);

// a little hair at the nape/sides (under the hat)
for (const s of [-1, 1]) {
  const hair = mesh(new THREE.SphereGeometry(0.03, 12, 10), hairMat);
  hair.scale.set(0.7, 1.1, 0.6);
  hair.position.set(0.095 * s, 1.665, -0.03);
}
const napeHair = mesh(new THREE.SphereGeometry(0.06, 16, 12), hairMat);
napeHair.scale.set(1.0, 0.6, 0.55);
napeHair.position.set(0, 1.66, -0.075);

/* ------------------------------------------------------------------ *
 *  HARD HAT
 * ------------------------------------------------------------------ */
const hat = new THREE.Group();
worker.add(hat);

// dome
const dome = mesh(
  new THREE.SphereGeometry(0.135, 28, 20, 0, Math.PI * 2, 0, Math.PI / 2),
  hatMat, hat
);
dome.scale.set(1.0, 0.92, 1.05);
dome.position.set(0, 1.70, 0.0);

// brim (slightly larger front)
const brim = mesh(new THREE.CylinderGeometry(0.168, 0.172, 0.028, 40), hatMat, hat);
brim.scale.set(1.0, 1.0, 1.18);
brim.position.set(0, 1.702, 0.02);

// reinforcement ridges over the crown
function ridge(xOff, radius) {
  const r = mesh(new THREE.TorusGeometry(radius, 0.008, 8, 40, Math.PI), hatDark, hat);
  r.rotation.y = Math.PI / 2;
  r.scale.set(1.0, 0.92, 1.05);
  r.position.set(xOff, 1.702, 0.0);
}
ridge(0, 0.128);
ridge(0.062, 0.112);
ridge(-0.062, 0.112);

/* ------------------------------------------------------------------ *
 *  Add worker to scene (single centered object)
 * ------------------------------------------------------------------ */
scene.add(worker);

/* ------------------------------------------------------------------ *
 *  Controls
 * ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 1.6;
controls.maxDistance = 8;
controls.minPolarAngle = 0.25;
controls.maxPolarAngle = Math.PI / 2 + 0.05;
controls.target.set(0, 0.98, 0);
controls.update();

/* ------------------------------------------------------------------ *
 *  Resize
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ------------------------------------------------------------------ *
 *  Render loop
 * ------------------------------------------------------------------ */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
