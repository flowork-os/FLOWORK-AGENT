<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   Renderer / Scene / Camera
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x191a1f);
scene.fog = new THREE.Fog(0x191a1f, 5.2, 13.0);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(2.35, 1.35, 3.05);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.62;
controls.target.set(0, 0.62, 0);
controls.minDistance = 1.8;
controls.maxDistance = 8.0;
controls.maxPolarAngle = Math.PI * 0.52;
controls.update();

/* ============================================================
   Lighting — hemisphere + key / fill / rim
   ============================================================ */
const hemi = new THREE.HemisphereLight(0x9fc4ff, 0x2a2620, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3e2, 2.5);
key.position.set(3.2, 4.6, 3.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 16;
key.shadow.camera.left = -3.2;
key.shadow.camera.right = 3.2;
key.shadow.camera.top = 3.2;
key.shadow.camera.bottom = -3.2;
key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.022;
key.shadow.radius = 3.5;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fb6ff, 0.75);
fill.position.set(-3.6, 1.9, 2.2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd3a8, 1.5);
rim.position.set(-1.8, 2.6, -3.8);
scene.add(rim);

// Small warm bounce from below-front to lift the vinyl belly
const bounce = new THREE.PointLight(0xffb877, 0.55, 6.5, 2.0);
bounce.position.set(0.4, 0.12, 1.9);
scene.add(bounce);

// Bright specular pops for the glossy vinyl
const pop1 = new THREE.PointLight(0xffffff, 2.2, 5.0, 2.0);
pop1.position.set(1.5, 2.1, 2.0);
scene.add(pop1);

const pop2 = new THREE.PointLight(0xcfe4ff, 1.1, 5.0, 2.0);
pop2.position.set(-1.7, 1.6, 1.1);
scene.add(pop2);

/* Procedural studio environment so the gloss has something to reflect */
function makeStudioEnv() {
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();

  const envScene = new THREE.Scene();
  envScene.background = new THREE.Color(0x2b2f38);

  const panelGeo = new THREE.PlaneGeometry(1, 1);
  const addPanel = (color, intensity, pos, scale, lookAt) => {
    const m = new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(intensity), side: THREE.DoubleSide });
    const p = new THREE.Mesh(panelGeo, m);
    p.position.set(pos[0], pos[1], pos[2]);
    p.scale.set(scale[0], scale[1], 1);
    p.lookAt(lookAt[0], lookAt[1], lookAt[2]);
    envScene.add(p);
  };

  // big soft key softbox, cool fill, warm strip, ceiling wash
  addPanel(0xffffff, 6.0, [3.0, 4.0, 3.0], [6, 4], [0, 0, 0]);
  addPanel(0xaecbff, 2.2, [-4.0, 2.0, 1.5], [6, 5], [0, 0, 0]);
  addPanel(0xffc98a, 3.0, [-1.5, 2.5, -4.5], [5, 3], [0, 0, 0]);
  addPanel(0xffffff, 1.6, [0, 6.5, 0], [12, 12], [0, 0, 0]);
  addPanel(0x1a1c22, 1.0, [0, -3.0, 0], [14, 14], [0, 1, 0]);

  const rt = pmrem.fromScene(envScene, 0.04);
  panelGeo.dispose();
  envScene.traverse(o => { if (o.material) o.material.dispose(); });
  pmrem.dispose();
  return rt.texture;
}
const envMap = makeStudioEnv();
scene.environment = envMap;

/* ============================================================
   Shadow-only ground
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 72).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   Palettes / Materials
   ============================================================ */
const COL = {
  body:      0xf2f0ea,   // off-white pearly vinyl
  bodyTint:  0xe8e3d6,
  accent:    0xff5f4d,   // hot coral seams / trim
  accent2:   0x2fc9d6,   // teal accents
  yellow:    0xffc93c,
  speaker:   0x3a3d44,   // dark grey stitched-in disc
  speakerIn: 0x24262b,
  grill:     0x4a4e56,
  darkTrim:  0x2e3138,
  chrome:    0xbfc6cf,
  valve:     0xd8d3c6
};

function vinyl(color, opts = {}) {
  return new THREE.MeshPhysicalMaterial({
    color,
    roughness: opts.roughness !== undefined ? opts.roughness : 0.17,
    metalness: 0.0,
    clearcoat: opts.clearcoat !== undefined ? opts.clearcoat : 0.9,
    clearcoatRoughness: opts.ccr !== undefined ? opts.ccr : 0.09,
    sheen: opts.sheen !== undefined ? opts.sheen : 0.35,
    sheenColor: new THREE.Color(opts.sheenColor || 0xffffff),
    sheenRoughness: 0.55,
    envMapIntensity: opts.env !== undefined ? opts.env : 1.15,
    side: THREE.FrontSide,
    transmission: 0.0
  });
}

const matBody     = vinyl(COL.body,     { roughness: 0.16, ccr: 0.07, env: 1.25 });
const matBodyAlt  = vinyl(COL.bodyTint, { roughness: 0.2,  ccr: 0.1,  env: 1.1 });
const matAccent   = vinyl(COL.accent,   { roughness: 0.15, ccr: 0.95, ccr2: 0.06, env: 1.3 });
const matAccent2  = vinyl(COL.accent2,  { roughness: 0.15, env: 1.25 });
const matYellow   = vinyl(COL.yellow,   { roughness: 0.17, env: 1.2 });
const matSpeaker  = vinyl(COL.speaker,  { roughness: 0.34, ccr: 0.55, ccr2: 0.25, env: 0.85, sheen: 0.2 });
const matSpeakerIn= vinyl(COL.speakerIn,{ roughness: 0.45, ccr: 0.35, env: 0.6, sheen: 0.15 });
const matGrill    = vinyl(COL.grill,    { roughness: 0.38, ccr: 0.4,  env: 0.8 });
const matDark     = vinyl(COL.darkTrim, { roughness: 0.28, ccr: 0.7,  env: 0.9 });
const matValve    = vinyl(COL.valve,    { roughness: 0.3,  ccr: 0.5,  env: 0.9 });

const matChrome = new THREE.MeshPhysicalMaterial({
  color: COL.chrome, metalness: 0.95, roughness: 0.22, envMapIntensity: 1.4, clearcoat: 0.3
});

// translucent-ish smoky window for the cassette door
const matWindow = new THREE.MeshPhysicalMaterial({
  color: 0x39424f,
  roughness: 0.08,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.03,
  transmission: 0.55,
  thickness: 0.06,
  ior: 1.45,
  envMapIntensity: 1.5,
  transparent: true,
  opacity: 0.96
});

// Stitch thread material (thin dashes)
const matThread = new THREE.MeshStandardMaterial({
  color: 0xfdf9ef, roughness: 0.6, metalness: 0.0, envMapIntensity: 0.7
});

/* ============================================================
   Geometry helpers
   ============================================================ */

// Rounded-box "puffed" geometry: start from a sphere-ish superellipsoid,
// then bulge it. Gives soft inflatable corners without CSG.
function puffBoxGeometry(w, h, d, roundness, seg = 96) {
  // superellipsoid exponent: lower -> boxier, higher -> rounder
  const e = THREE.MathUtils.clamp(roundness, 0.05, 1.0);
  const n = 2.0 / Math.max(0.08, e * 1.15); // shape exponent
  const geo = new THREE.SphereGeometry(1, seg, Math.max(24, Math.floor(seg * 0.6)));
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    // superellipsoid mapping via inverse p-norm scaling
    const ax = Math.abs(v.x), ay = Math.abs(v.y), az = Math.abs(v.z);
    const denom = Math.pow(Math.pow(ax, n) + Math.pow(ay, n) + Math.pow(az, n), 1 / n);
    const s = denom > 1e-6 ? 1 / denom : 1;
    pos.setXYZ(i, v.x * s * w * 0.5, v.y * s * h * 0.5, v.z * s * d * 0.5);
  }
  geo.computeVertexNormals();
  return geo;
}

// Apply a smooth "sag + bulge" deformation to any geometry, so the vinyl
// looks under-inflated toward the bottom and puffed at the middle.
function sagAndBulge(geo, opts = {}) {
  const {
    sag = 0.06,          // downward droop amount scaled with height
    bulge = 0.05,        // outward puff at equator
    yMin = -0.5, yMax = 0.5,
    freq = 3.0,
    wobble = 0.012,
    axisFlatten = 0.0    // slight flattening of the bottom (rests on ground)
  } = opts;
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  const H = Math.max(1e-5, yMax - yMin);
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const t = THREE.MathUtils.clamp((v.y - yMin) / H, 0, 1); // 0 bottom -> 1 top
    // equator puff
    const puff = Math.sin(Math.PI * t);
    const r = Math.hypot(v.x, v.z);
    if (r > 1e-5) {
      const k = 1 + bulge * puff;
      v.x *= k; v.z *= k;
    }
    // gentle sag: heavier near the bottom, plus soft wobble around the girth
    const ang = Math.atan2(v.z, v.x);
    const w = Math.sin(ang * freq) * Math.cos(ang * 1.7) * wobble;
    v.y -= sag * (1 - t) * (1 - t) * H + w * puff;
    // flatten the very bottom slightly (weight of the toy)
    if (axisFlatten > 0) {
      const bottomT = THREE.MathUtils.smoothstep(t, 0.0, 0.22);
      v.y = THREE.MathUtils.lerp(v.y, yMin + axisFlatten * H, (1 - bottomT) * 0.55);
    }
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  return geo;
}

// Tubular welded seam that follows a rounded-rectangle path on a plane.
function roundedRectPoints(w, h, r, segPerCorner = 12) {
  const pts = [];
  const hw = w / 2 - r, hh = h / 2 - r;
  const corners = [
    { cx:  hw, cy:  hh, a0: 0,             a1: Math.PI / 2 },
    { cx: -hw, cy:  hh, a0: Math.PI / 2,   a1: Math.PI },
    { cx: -hw, cy: -hh, a0: Math.PI,       a1: Math.PI * 1.5 },
    { cx:  hw, cy: -hh, a0: Math.PI * 1.5, a1: Math.PI * 2 }
  ];
  for (const c of corners) {
    for (let i = 0; i <= segPerCorner; i++) {
      const a = THREE.MathUtils.lerp(c.a0, c.a1, i / segPerCorner);
      pts.push(new THREE.Vector2(c.cx + Math.cos(a) * r, c.cy + Math.sin(a) * r));
    }
  }
  return pts;
}

function seamTube(w, h, r, tubeR, z, curveSegs = 200, radialSegs = 12, bow = 0.0) {
  const pts2 = roundedRectPoints(w, h, r, 14);
  const pts3 = pts2.map(p => {
    // bow outward in z toward the middle of the panel for a puffed seam
    const d = Math.hypot(p.x / (w / 2), p.y / (h / 2));
    const zz = z + bow * Math.max(0, 1 - d * d);
    return new THREE.Vector3(p.x, p.y, zz);
  });
  const curve = new THREE.CatmullRomCurve3(pts3, true, 'centripetal', 0.35);
  return new THREE.TubeGeometry(curve, curveSegs, tubeR, radialSegs, true);
}

// A puffed "pillow" panel: rounded rect extruded with a domed front face.
function pillowGeometry(w, h, thick, cornerR, dome, segX = 44, segY = 34) {
  const geo = new THREE.BoxGeometry(1, 1, 1, segX, segY, 10);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  const hw = w / 2, hh = h / 2, ht = thick / 2;
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    // map unit cube -> superellipse cross-section in XY, domed in Z
    const nx = v.x * 2, ny = v.y * 2, nz = v.z * 2; // -1..1
    const p = 4.0; // superellipse exponent (roundness of corners)
    const rad = Math.pow(Math.pow(Math.abs(nx), p) + Math.pow(Math.abs(ny), p), 1 / p);
    const s = rad > 1e-6 ? Math.min(1, 1 / rad) : 1;
    // shrink toward rounded rect boundary
    const ex = nx * (rad > 1 ? s : 1);
    const ey = ny * (rad > 1 ? s : 1);
    // corner rounding blend
    const cr = THREE.MathUtils.clamp(cornerR, 0.0, 0.49);
    const shrink = 1 - cr * Math.max(0, rad - (1 - cr)) / Math.max(1e-5, cr);
    const k = THREE.MathUtils.clamp(shrink, 0.0, 1.0);
    const fx = ex * (0.85 + 0.15 * k);
    const fy = ey * (0.85 + 0.15 * k);
    // dome amount falls off toward the edges
    const edge = THREE.MathUtils.clamp(1 - rad, 0, 1);
    const domeAmt = Math.pow(Math.sin(Math.PI * 0.5 * edge), 0.75);
    pos.setXYZ(i, fx * hw, fy * hh, nz * ht + Math.sign(nz) * dome * domeAmt);
  }
  geo.computeVertexNormals();
  return geo;
}

// Torus-ish ribbing bar (a welded rib across the front)
function ribGeometry(len, r, bend = 0.02, segs = 90) {
  const pts = [];
  const N = 26;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = THREE.MathUtils.lerp(-len / 2, len / 2, t);
    const z = bend * Math.sin(Math.PI * t);
    pts.push(new THREE.Vector3(x, 0, z));
  }
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
  return new THREE.TubeGeometry(curve, segs, r, 12, false);
}

// Printed concentric ring texture for the speaker cones
function makeSpeakerTexture(size = 512) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const cx = size / 2, cy = size / 2;

  // base
  const base = g.createRadialGradient(cx * 0.82, cy * 0.78, size * 0.05, cx, cy, size * 0.55);
  base.addColorStop(0, '#5a606b');
  base.addColorStop(0.45, '#3c414a');
  base.addColorStop(1, '#22252b');
  g.fillStyle = base;
  g.fillRect(0, 0, size, size);

  // printed concentric rings
  const ringCount = 13;
  for (let i = ringCount; i >= 1; i--) {
    const t = i / ringCount;
    const r = size * 0.46 * t;
    g.beginPath();
    g.arc(cx, cy, r, 0, Math.PI * 2);
    g.lineWidth = size * (0.008 + 0.010 * (1 - t));
    const shade = Math.floor(150 - 80 * t);
    g.strokeStyle = (i % 2 === 0)
      ? `rgba(${shade + 40},${shade + 44},${shade + 52},0.55)`
      : `rgba(12,13,16,0.55)`;
    g.stroke();
  }

  // dot-matrix "grille holes" print
  const step = size / 46;
  for (let y = step; y < size - step * 0.5; y += step) {
    for (let x = step; x < size - step * 0.5; x += step) {
      const dx = x - cx, dy = y - cy;
      const d = Math.hypot(dx, dy) / (size * 0.47);
      if (d > 1.0 || d < 0.19) continue;
      g.beginPath();
      g.arc(x, y, step * 0.20, 0, Math.PI * 2);
      g.fillStyle = `rgba(10,11,14,${0.28 * (1 - d * 0.35)})`;
      g.fill();
      g.beginPath();
      g.arc(x - step * 0.06, y - step * 0.06, step * 0.09, 0, Math.PI * 2);
      g.fillStyle = 'rgba(255,255,255,0.10)';
      g.fill();
    }
  }

  // center dust cap
  const cap = g.createRadialGradient(cx * 0.94, cy * 0.9, size * 0.01, cx, cy, size * 0.135);
  cap.addColorStop(0, '#8d93a0');
  cap.addColorStop(0.5, '#4b5058');
  cap.addColorStop(1, '#1b1d22');
  g.beginPath(); g.arc(cx, cy, size * 0.135, 0, Math.PI * 2);
  g.fillStyle = cap; g.fill();

  // subtle outer vignette
  const vig = g.createRadialGradient(cx, cy, size * 0.30, cx, cy, size * 0.5);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.45)');
  g.fillStyle = vig; g.fillRect(0, 0, size, size);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
const speakerTex = makeSpeakerTexture(600);

// Roughness variation for the printed disc (rings read as ink on vinyl)
function makeSpeakerRoughTexture(size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = '#6a6a6a';
  g.fillRect(0, 0, size, size);
  const cx = size / 2, cy = size / 2;
  for (let i = 13; i >= 1; i--) {
    const t = i / 13;
    g.beginPath();
    g.arc(cx, cy, size * 0.46 * t, 0, Math.PI * 2);
    g.lineWidth = size * (0.008 + 0.010 * (1 - t));
    g.strokeStyle = (i % 2 === 0) ? 'rgba(255,255,255,0.35)' : 'rgba(0,0,0,0.25)';
    g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}
const speakerRough = makeSpeakerRoughTexture(320);

// Small printed label texture (fake brand strip on the front)
function makeLabelTexture(w = 512, h = 128) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.clearRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,255,255,0)';
  g.fillRect(0, 0, w, h);
  g.font = `bold ${Math.floor(h * 0.52)}px Helvetica, Arial, sans-serif`;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillStyle = '#26282e';
  g.letterSpacing = '10px';
  g.fillText('AIR·SONIC', w / 2, h * 0.5);
  g.fillStyle = 'rgba(255,95,77,0.95)';
  g.fillRect(w * 0.10, h * 0.80, w * 0.80, h * 0.06);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}
const labelTex = makeLabelTexture();

/* ============================================================
   THE OBJECT
   ============================================================ */
const boombox = new THREE.Group();
scene.add(boombox);

// Overall footprint (metres). A giant pool toy ~ 1.5 m wide.
const BW = 1.62;  // body width
const BH = 0.86;  // body height
const BD = 0.44;  // body depth
const BODY_Y = 0.52;

/* ---------- 1. Main puffed body ---------- */
const bodyGeo = puffBoxGeometry(BW, BH, BD, 0.42, 128);
sagAndBulge(bodyGeo, {
  sag: 0.035, bulge: 0.045,
  yMin: -BH / 2, yMax: BH / 2,
  freq: 4.0, wobble: 0.010,
  axisFlatten: 0.06
});
const body = new THREE.Mesh(bodyGeo, matBody);
body.position.y = BODY_Y;
body.castShadow = true;
body.receiveShadow = true;
boombox.add(body);

// Slight overall "not fully firm" lean/sag of the whole toy
boombox.rotation.z = -0.012;

/* ---------- 2. Fat tubular seams around the silhouette ---------- */
const seamGroup = new THREE.Group();
seamGroup.position.y = BODY_Y;
boombox.add(seamGroup);

const SEAM_R = 0.030;

// Front + back perimeter welds
[1, -1].forEach(sign => {
  const g = seamTube(BW * 0.965, BH * 0.955, 0.20, SEAM_R, sign * (BD * 0.5 - 0.012), 260, 12, sign * 0.012);
  const m = new THREE.Mesh(g, matAccent);
  m.castShadow = true;
  m.receiveShadow = true;
  seamGroup.add(m);
});

// Mid-girth equator weld (the classic pool-toy centre seam)
const girth = new THREE.Mesh(
  seamTube(BW * 1.006, BH * 0.998, 0.215, SEAM_R * 0.92, 0, 300, 12, 0),
  matAccent
);
girth.rotation.y = 0; // lies in the XY plane; we want it around the girth instead
girth.visible = false;
seamGroup.add(girth);

// Proper girth seam: a ring that hugs the widest silhouette of the body,
// built by sampling the superellipse cross-section in XZ around the middle.
function girthSeamGeometry(w, d, tubeR) {
  const pts = [];
  const N = 220;
  const p = 3.4;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    const ca = Math.cos(a), sa = Math.sin(a);
    const rad = Math.pow(Math.pow(Math.abs(ca), p) + Math.pow(Math.abs(sa), p), 1 / p);
    const s = 1 / rad;
    pts.push(new THREE.Vector3(ca * s * w * 0.5, 0, sa * s * d * 0.5));
  }
  const curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal', 0.4);
  return new THREE.TubeGeometry(curve, 340, tubeR, 12, true);
}
// no separate girth ring (it would fight the front weld); keep silhouette clean

// Vertical corner welds — the tubular "columns" of an inflatable
const cornerSeamMat = matAccent;
function cornerSeam(x, z, sx, sz) {
  const pts = [];
  const N = 24;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const y = THREE.MathUtils.lerp(-BH * 0.42, BH * 0.42, t);
    const puff = Math.sin(Math.PI * t);
    pts.push(new THREE.Vector3(
      x + sx * 0.014 * puff,
      y,
      z + sz * 0.014 * puff
    ));
  }
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
  return new THREE.TubeGeometry(curve, 70, 0.020, 10, false);
}
[[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([sx, sz]) => {
  const m = new THREE.Mesh(
    cornerSeam(sx * BW * 0.455, sz * BD * 0.40, sx, sz),
    cornerSeamMat
  );
  m.castShadow = true;
  seamGroup.add(m);
});

/* ---------- 4. Stitched-in speaker discs ---------- */
function buildSpeaker(side) {
  const g = new THREE.Group();
  const R = 0.255;

  // recessed dark disc (slightly domed, sunk into the vinyl)
  const discGeo = new THREE.SphereGeometry(R * 1.5, 72, 48, 0, Math.PI * 2, 0, Math.PI * 0.30);
  discGeo.rotateX(Math.PI / 2);           // dome facing +Z
  discGeo.scale(1, 1, 0.34);
  const disc = new THREE.Mesh(discGeo, new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    map: speakerTex,
    roughnessMap: speakerRough,
    roughness: 0.42,
    metalness: 0.0,
    clearcoat: 0.75,
    clearcoatRoughness: 0.18,
    envMapIntensity: 0.95
  }));
  // Map planar UVs onto the dome so the printed rings stay concentric
  {
    const pos = discGeo.attributes.position;
    const uv = discGeo.attributes.uv;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i);
      uv.setXY(i, x / (R * 0.94) * 0.5 + 0.5, y / (R * 0.94) * 0.5 + 0.5);
    }
    uv.needsUpdate = true;
  }
  disc.castShadow = false;
  disc.receiveShadow = true;
  disc.position.z = 0.0;
  g.add(disc);

  // inner cone lip (dark ring giving depth)
  const lip = new THREE.Mesh(
    new THREE.TorusGeometry(R * 0.995, 0.030, 18, 96),
    matSpeakerIn
  );
  lip.position.z = 0.006;
  lip.castShadow = true;
  lip.receiveShadow = true;
  g.add(lip);

  // fat welded surround ring (the "stitched-in" tube)
  const surround = new THREE.Mesh(
    new THREE.TorusGeometry(R * 1.10, 0.042, 22, 120),
    matBodyAlt
  );
  surround.position.z = -0.012;
  surround.castShadow = true;
  surround.receiveShadow = true;
  g.add(surround);

  // colored trim ring outside the surround
  const trim = new THREE.Mesh(
    new THREE.TorusGeometry(R * 1.235, 0.017, 16, 120),
    side < 0 ? matAccent2 : matAccent
  );
  trim.position.z = -0.030;
  trim.castShadow = true;
  g.add(trim);

  // stitch dashes around the surround
  const stitchCount = 56;
  const stitchGeo = new THREE.CapsuleGeometry(0.0055, 0.020, 4, 8);
  const stitches = new THREE.InstancedMesh(stitchGeo, matThread, stitchCount);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < stitchCount; i++) {
    const a = (i / stitchCount) * Math.PI * 2;
    const rr = R * 1.175;
    dummy.position.set(Math.cos(a) * rr, Math.sin(a) * rr, 0.006);
    dummy.rotation.set(0, 0, a + Math.PI / 2);
    dummy.updateMatrix();
    stitches.setMatrixAt(i, dummy.matrix);
  }
  stitches.instanceMatrix.needsUpdate = true;
  stitches.castShadow = false;
  g.add(stitches);

  // center dust-cap nub (little inflated bump)
  const cap = new THREE.Mesh(
    new THREE.SphereGeometry(0.062, 40, 28),
    matSpeakerIn
  );
  cap.scale.set(1, 1, 0.62);
  cap.position.z = 0.038;
  cap.castShadow = true;
  g.add(cap);

  const capRing = new THREE.Mesh(new THREE.TorusGeometry(0.070, 0.010, 14, 60), matGrill);
  capRing.position.z = 0.030;
  g.add(capRing);

  return g;
}

// glyphs on the buttons (tiny extruded shapes)
function triGlyph(size, color, rot = 0) {
  const shape = new THREE.Shape();
  shape.moveTo(-size * 0.5, -size * 0.55);
  shape.lineTo(size * 0.6, 0);
  shape.lineTo(-size * 0.5, size * 0.55);
  shape.closePath();
  const g = new THREE.ExtrudeGeometry(shape, { depth: 0.006, bevelEnabled: true, bevelSize: 0.0035, bevelThickness: 0.0035, bevelSegments: 3, curveSegments: 6 });
  const m = new THREE.Mesh(g, color);
  m.rotation.z = rot;
  return m;
}

// floppy inflatable antenna leaning back
{
  const pts = [];
  const N = 20;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    pts.push(new THREE.Vector3(
      0.63 + 0.075 * t * t,
      topY + 0.02 + 0.50 * t,
      -0.02 - 0.16 * t * t
    ));
  }
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
  const antGeo = new THREE.TubeGeometry(curve, 90, 0.020, 12, false);
  // taper the tube toward the tip
  {
    const pos = antGeo.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const t = THREE.MathUtils.clamp((v.y - (topY + 0.02)) / 0.50, 0, 1);
      const c = curve.getPointAt(THREE.MathUtils.clamp(t, 0, 1));
      const scale = THREE.MathUtils.lerp(1.0, 0.45, t);
      v.sub(c).multiplyScalar(scale).add(c);
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    antGeo.computeVertexNormals();
  }
  const ant = new THREE.Mesh(antGeo, matBodyAlt);
  ant.castShadow = true;
  boombox.add(ant);

  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.026, 28, 20), matAccent);
  const tipP = curve.getPointAt(1);
  tip.position.copy(tipP);
  tip.castShadow = true;
  boombox.add(tip);
}

/* ---------- 9. Limp inflated handle on top ---------- */
{
  // A handle that visibly droops — "limp", not fully firm.
  const A = new THREE.Vector3(-0.40, topY - 0.005, 0.0);
  const B = new THREE.Vector3( 0.40, topY - 0.005, 0.0);
  const pts = [
    A.clone(),
    new THREE.Vector3(-0.36, topY + 0.135, 0.004),
    new THREE.Vector3(-0.20, topY + 0.205, 0.010),
    new THREE.Vector3(-0.02, topY + 0.190, 0.012),   // sagging apex, off-centre
    new THREE.Vector3( 0.16, topY + 0.150, 0.010),
    new THREE.Vector3( 0.31, topY + 0.115, 0.006),
    new THREE.Vector3( 0.38, topY + 0.045, 0.002),
    B.clone()
  ];
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.55);
  const handleGeo = new THREE.TubeGeometry(curve, 240, 0.048, 20, false);

  // squash the tube slightly + add a limp "pinch" near the sagging middle
  {
    const pos = handleGeo.attributes.position;
    const v = new THREE.Vector3();
    const c = new THREE.Vector3();
    const segs = 240;
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const ring = Math.floor(i / 21);           // radialSegments+1 verts per ring
      const t = THREE.MathUtils.clamp(ring / segs, 0, 1);
      c.copy(curve.getPointAt(t));
      const pinch = 1 - 0.26 * Math.pow(Math.sin(Math.PI * t), 3.0)      // limp middle
                      - 0.10 * Math.pow(Math.sin(Math.PI * t * 2.0), 2); // soft ripple
      v.sub(c);
      v.x *= pinch * 1.0;
      v.y *= pinch * 0.86;   // slightly flattened, deflated cross-section
      v.z *= pinch * 1.06;
      v.add(c);
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    handleGeo.computeVertexNormals();
  }

  const handle = new THREE.Mesh(handleGeo, matAccent);
  handle.castShadow = true;
  handle.receiveShadow = true;
  boombox.add(handle);

  // welded anchor pads where the handle meets the body
  [A, B].forEach(p => {
    const pad = new THREE.Mesh(new THREE.SphereGeometry(0.070, 36, 24), matBodyAlt);
    pad.scale.set(1.15, 0.55, 1.15);
    pad.position.set(p.x, topY - 0.012, p.z);
    pad.castShadow = true;
    pad.receiveShadow = true;
    boombox.add(pad);

    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.062, 0.013, 14, 48), matAccent2);
    ring.rotation.x = Math.PI / 2;
    ring.position.set(p.x, topY + 0.004, p.z);
    ring.castShadow = true;
    boombox.add(ring);
  });

  // a grip wrap on the sagging apex
  const wrap = new THREE.Mesh(new THREE.TorusGeometry(0.052, 0.016, 14, 44), matBodyAlt);
  const wp = curve.getPointAt(0.47);
  const tan = curve.getTangentAt(0.47);
  wrap.position.copy(wp);
  wrap.lookAt(wp.clone().add(tan));
  wrap.castShadow = true;
  boombox.add(wrap);

  const wrap2 = wrap.clone();
  const wp2 = curve.getPointAt(0.56);
  const tan2 = curve.getTangentAt(0.56);
  wrap2.position.copy(wp2);
  wrap2.lookAt(wp2.clone().add(tan2));
  boombox.add(wrap2);
}

/* ---------- 13. Glossy highlight "sprites" baked as tiny emissive patches ----------
   A few soft specular blooms painted onto the vinyl to sell the wet-plastic gloss. */
function makeHighlightTexture(size = 128) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grd.addColorStop(0, 'rgba(255,255,255,0.95)');
  grd.addColorStop(0.35, 'rgba(255,255,255,0.35)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const hlTex = makeHighlightTexture(160);

  sp.position.set(h.p[0], h.p[1], h.p[2]);
  sp.scale.set(h.s[0], h.s[1], 1);
  boombox.add(sp);
});

/* ---------- Center the whole thing on the origin in XZ ---------- */
boombox.position.set(0, 0, 0);

/* ============================================================
   Contact shadow blob (soft, cheap, sells the ground contact)
   ============================================================ */
{
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 10, 128, 128, 126);
  grd.addColorStop(0, 'rgba(0,0,0,0.55)');
  grd.addColorStop(0.45, 'rgba(0,0,0,0.28)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  const blob = new THREE.Mesh(
    new THREE.PlaneGeometry(2.4, 1.15),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, opacity: 0.75 })
  );
  blob.rotation.x = -Math.PI / 2;
  blob.position.y = 0.004;
  scene.add(blob);
}

/* ============================================================
   Animation
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // a gentle "still settling / slightly under-inflated" breathe
  const breathe = 1 + Math.sin(t * 0.65) * 0.0035;
  body.scale.set(breathe, 1 + Math.sin(t * 0.65 + 1.2) * 0.0022, breathe);
  boombox.rotation.z = -0.012 + Math.sin(t * 0.5) * 0.0025;

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
