<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red Phone Booth</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d22; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d22);
scene.fog = new THREE.Fog(0x1a1d22, 14, 30);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.2, 3.2, 5.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.35, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 3;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.52;

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0x8fa3bf, 0x2a2622, 0.55));

const key = new THREE.DirectionalLight(0xfff1dd, 2.2);
key.position.set(5, 8, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4; key.shadow.camera.right = 4;
key.shadow.camera.top = 5; key.shadow.camera.bottom = -2;
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
scene.add(key);

const rim = new THREE.DirectionalLight(0x88aaff, 0.7);
rim.position.set(-6, 4, -5);
scene.add(rim);

const glow = new THREE.PointLight(0xffd9a0, 1.1, 5, 2);
glow.position.set(0, 1.9, 0);
scene.add(glow);

// ---------- Ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(12, 64),
  new THREE.MeshStandardMaterial({ color: 0x24272c, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Materials ----------
const red = new THREE.MeshStandardMaterial({ color: 0xb5121b, roughness: 0.38, metalness: 0.25 });
const darkRed = new THREE.MeshStandardMaterial({ color: 0x8a0d14, roughness: 0.5, metalness: 0.2 });
const glass = new THREE.MeshPhysicalMaterial({
  color: 0xcfe6ee, roughness: 0.08, metalness: 0, transmission: 0.92,
  thickness: 0.02, transparent: true, opacity: 0.35, side: THREE.DoubleSide
});
const black = new THREE.MeshStandardMaterial({ color: 0x14161a, roughness: 0.55, metalness: 0.35 });
const brass = new THREE.MeshStandardMaterial({ color: 0xc9a24a, roughness: 0.35, metalness: 0.85 });
const signMat = new THREE.MeshStandardMaterial({
  color: 0xf3ead6, roughness: 0.6, emissive: 0xffe9b8, emissiveIntensity: 0.55
});

// ---------- Booth ----------
const booth = new THREE.Group();
scene.add(booth);

const W = 1.3, D = 1.3, H = 2.6;   // booth outer width, depth, height
const P = 0.09;                     // post thickness

function box(w, h, d, mat, x, y, z, parent = booth) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

// Plinth base
box(W + 0.12, 0.14, D + 0.12, darkRed, 0, 0.07, 0);
box(W, 0.5, D, red, 0, 0.14 + 0.25, 0); // solid lower panel band

// Corner posts
const hx = W / 2 - P / 2, hz = D / 2 - P / 2;
for (const [x, z] of [[hx, hz], [-hx, hz], [hx, -hz], [-hx, -hz]])
  box(P, H, P, red, x, H / 2, z);

// Top band under roof
box(W, 0.28, D, red, 0, H - 0.14, 0);

// ---------- Glazed walls with mullions ----------
// Each wall: a glass sheet + red mullion grid (3 cols x 4 rows of panes)
const glazeBottom = 0.64, glazeTop = H - 0.28;
const glazeH = glazeTop - glazeBottom;
const cols = 3, rows = 4, mull = 0.045;

function makeWall(width, isDoor) {
  const g = new THREE.Group();
  const innerW = width - P * 2;
  // glass sheet
  const sheet = new THREE.Mesh(new THREE.PlaneGeometry(innerW, glazeH), glass);
  sheet.position.y = glazeBottom + glazeH / 2;
  g.add(sheet);
  // vertical mullions
  for (let i = 0; i <= cols; i++) {
    const x = -innerW / 2 + (innerW / cols) * i;
    const v = new THREE.Mesh(new THREE.BoxGeometry(mull, glazeH, 0.06), red);
    v.position.set(x, glazeBottom + glazeH / 2, 0);
    v.castShadow = true;
    g.add(v);
  }
  // horizontal mullions
  for (let j = 0; j <= rows; j++) {
    const y = glazeBottom + (glazeH / rows) * j;
    const h = new THREE.Mesh(new THREE.BoxGeometry(innerW + mull, mull, 0.06), red);
    h.position.set(0, y, 0);
    h.castShadow = true;
    g.add(h);
  }
  if (isDoor) {
    // door leaf frame slab behind grid + lower solid panel
    const lower = new THREE.Mesh(new THREE.BoxGeometry(innerW + mull, 0.5, 0.07), red);
    lower.position.set(0, 0.14 + 0.25, 0);
    lower.castShadow = true;
    g.add(lower);
    // handle
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.3, 12), brass);
    handle.position.set(innerW / 2 - 0.1, 1.15, 0.07);
    handle.castShadow = true;
    g.add(handle);
    const knob1 = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.06, 10), brass);
    knob1.rotation.x = Math.PI / 2;
    knob1.position.set(innerW / 2 - 0.1, 1.28, 0.045);
    g.add(knob1);
    const knob2 = knob1.clone();
    knob2.position.y = 1.02;
    g.add(knob2);
    // hinges
    for (const y of [0.55, 1.35, 2.05]) {
      const hinge = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.12, 0.05), black);
      hinge.position.set(-innerW / 2 - 0.005, y, 0.02);
      g.add(hinge);
    }
  }
  return g;
}

// Back wall
const back = makeWall(W, false);
back.position.z = -D / 2 + 0.03;
booth.add(back);
// Side walls
const left = makeWall(D, false);
left.rotation.y = Math.PI / 2;
left.position.x = -W / 2 + 0.03;
booth.add(left);
const right = makeWall(D, false);
right.rotation.y = -Math.PI / 2;
right.position.x = W / 2 - 0.03;
booth.add(right);
// Front door — hinged slightly ajar, pivoting at its left edge
const doorPivot = new THREE.Group();
doorPivot.position.set(-(W / 2 - P), 0, D / 2 - 0.03);
const door = makeWall(W, true);
door.position.x = W / 2 - P;
doorPivot.add(door);
doorPivot.rotation.y = 0.22;
booth.add(doorPivot);

// ---------- Roof: crowned / domed cap with sign band ----------
// Sign band (TELEPHONE panels)
const bandH = 0.3;
box(W + 0.1, bandH, D + 0.1, red, 0, H + bandH / 2, 0);
function signPanel(rotY, offX, offZ) {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(W * 0.78, 0.16), signMat);
  p.position.set(offX, H + bandH / 2, offZ);
  p.rotation.y = rotY;
  booth.add(p);
}
const so = (W + 0.1) / 2 + 0.005;
signPanel(0, 0, so);
signPanel(Math.PI, 0, -so);
signPanel(Math.PI / 2, so, 0);
signPanel(-Math.PI / 2, -so, 0);

// Stepped crown + shallow dome
box(W + 0.02, 0.08, D + 0.02, darkRed, 0, H + bandH + 0.04, 0);
box(W - 0.18, 0.08, D - 0.18, red, 0, H + bandH + 0.12, 0);
const dome = new THREE.Mesh(
  new THREE.SphereGeometry(0.62, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2.6),
  red
);
dome.scale.set(1.05, 0.55, 1.05);
dome.position.y = H + bandH + 0.14;
dome.castShadow = true;
booth.add(dome);
const finial = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 12), brass);
finial.position.y = H + bandH + 0.42;
finial.castShadow = true;
booth.add(finial);

// ---------- Interior: shelf + phone silhouette ----------
const shelf = box(W - 0.24, 0.05, 0.42, black, 0, 1.1, -D / 2 + 0.28);
// Phone body on wall
const phoneBody = box(0.3, 0.44, 0.12, black, 0, 1.62, -D / 2 + 0.14);
// Handset (torus-ish cradle) resting on top
const handset = new THREE.Mesh(new THREE.CapsuleGeometry(0.045, 0.26, 6, 12), black);
handset.rotation.z = Math.PI / 2;
handset.position.set(0, 1.88, -D / 2 + 0.14);
handset.castShadow = true;
booth.add(handset);
// Earpiece / mouthpiece bulbs
for (const s of [-1, 1]) {
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.055, 12, 10), black);
  bulb.position.set(0.15 * s, 1.87, -D / 2 + 0.14);
  bulb.castShadow = true;
  booth.add(bulb);
}
// Coiled cord (simple curve tube)
const cordPts = [];
for (let i = 0; i <= 20; i++) {
  const t = i / 20;
  cordPts.push(new THREE.Vector3(
    0.16 + Math.sin(t * Math.PI * 6) * 0.03,
    1.82 - t * 0.5,
    -D / 2 + 0.16 + Math.cos(t * Math.PI * 6) * 0.03
  ));
}
const cord = new THREE.Mesh(
  new THREE.TubeGeometry(new THREE.CatmullRomCurve3(cordPts), 40, 0.012, 6),
  black
);
booth.add(cord);
// Dial face
const dial = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.02, 24), brass);
dial.rotation.x = Math.PI / 2;
dial.position.set(0, 1.6, -D / 2 + 0.21);
booth.add(dial);
// Directory book on shelf
box(0.26, 0.05, 0.2, darkRed, -0.22, 1.15, -D / 2 + 0.3);

// ---------- Interior floor ----------
box(W - 0.1, 0.03, D - 0.1, black, 0, 0.155, 0);

// ---------- Resize / Loop ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
