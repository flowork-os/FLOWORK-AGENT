<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marble Sleeping Hound</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d7d5cf}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const scene=new THREE.Scene();
scene.background=new THREE.Color(0xd7d5cf);
scene.fog=new THREE.Fog(0xd7d5cf,14,28);

const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);
camera.position.set(7.6,5.2,8.7);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.autoRotate=true;
controls.autoRotateSpeed=.45;
controls.minDistance=6;
controls.maxDistance=17;
controls.target.set(0,1.8,0);

const marble=new THREE.MeshStandardMaterial({
  color:0xe9e8e3,roughness:.26,metalness:.03
});
const marbleSoft=new THREE.MeshStandardMaterial({
  color:0xd8d7d1,roughness:.34,metalness:.02
});
const veinMat=new THREE.MeshStandardMaterial({
  color:0x858581,roughness:.55,metalness:0
});
const deepVeinMat=new THREE.MeshStandardMaterial({
  color:0x5d5e5b,roughness:.62,metalness:0
});
const chiselMat=new THREE.MeshStandardMaterial({
  color:0xb9b7b0,roughness:.82,metalness:0
});
const shadowMat=new THREE.MeshStandardMaterial({
  color:0x3d3d3a,roughness:.72,metalness:0
});

const sculpture=new THREE.Group();
scene.add(sculpture);

function ellipsoid(position,scale,material=marble,rotation=new THREE.Euler()){
  const geometry=new THREE.SphereGeometry(1,32,20);
  const object=new THREE.Mesh(geometry,material);
  object.position.copy(position);
  object.scale.copy(scale);
  object.rotation.copy(rotation);
  object.castShadow=true;
  object.receiveShadow=true;
  sculpture.add(object);
  return object;
}
function cylinderBetween(a,b,r,material=marble){
  const direction=new THREE.Vector3().subVectors(b,a);
  const geometry=new THREE.CylinderGeometry(r,r,direction.length(),20,1);
  const object=new THREE.Mesh(geometry,material);
  object.position.copy(a).add(b).multiplyScalar(.5);
  object.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),direction.normalize());
  object.castShadow=true;
  object.receiveShadow=true;
  sculpture.add(object);
  return object;
}
function tube(points,r,material=veinMat,segments=24){
  const curve=new THREE.CatmullRomCurve3(points);
  const geometry=new THREE.TubeGeometry(curve,segments, r, 8, false);
  const object=new THREE.Mesh(geometry,material);
  object.castShadow=true;
  object.receiveShadow=true;
  sculpture.add(object);
  return object;
}

const base=new THREE.Mesh(new THREE.BoxGeometry(6.2,.9,3.25),marbleSoft);
base.position.set(0,.42,0);
base.castShadow=true;
base.receiveShadow=true;
sculpture.add(base);

const topInset=new THREE.Mesh(new THREE.BoxGeometry(5.82,.055,2.88),marble);
topInset.position.set(0,.895,0);
topInset.receiveShadow=true;
sculpture.add(topInset);

for(let row=0;row<4;row++){
  for(let col=0;col<17;col++){
    const mark=new THREE.Mesh(new THREE.BoxGeometry(.2+((col*7+row)%3)*.035,.035,.055),chiselMat);
    mark.position.set(-2.82+col*.35,.36+row*.13,1.638);
    mark.rotation.set(0,((col+row)%4-1.5)*.16,((col*3+row)%5-2)*.08);
    mark.castShadow=true;
    sculpture.add(mark);
  }
}
for(let i=0;i<13;i++){
  const mark=new THREE.Mesh(new THREE.BoxGeometry(.07,.08,.04),deepVeinMat);
  mark.position.set(-2.55+i*.42,.1+(i%3)*.18,1.665);
  mark.rotation.z=(i%2?-1:1)*.5;
  sculpture.add(mark);
}

ellipsoid(new THREE.Vector3(.25,2.05,.08),new THREE.Vector3(2.35,1.12,1.15),marble,new THREE.Euler(0,0,-.06));
ellipsoid(new THREE.Vector3(1.48,1.92,.3),new THREE.Vector3(1.15,1.12,1.08),marbleSoft,new THREE.Euler(0,.1,.08));
ellipsoid(new THREE.Vector3(-1.18,2.05,.38),new THREE.Vector3(1.12,1.0,.92),marble,new THREE.Euler(0,-.18,-.08));

cylinderBetween(new THREE.Vector3(-.95,2.14,.42),new THREE.Vector3(-1.42,1.72,.63),.48,marble);
ellipsoid(new THREE.Vector3(-1.52,1.62,.72),new THREE.Vector3(.78,.55,.62),marble,new THREE.Euler(.05,-.2,-.18));
ellipsoid(new THREE.Vector3(-1.98,1.46,.96),new THREE.Vector3(.63,.32,.38),marbleSoft,new THREE.Euler(.08,-.25,-.22));
ellipsoid(new THREE.Vector3(-2.25,1.34,1.08),new THREE.Vector3(.35,.2,.22),marbleSoft,new THREE.Euler(.08,-.18,-.2));

ellipsoid(new THREE.Vector3(-1.38,1.13,1.03),new THREE.Vector3(.72,.18,.38),marbleSoft,new THREE.Euler(0,-.1,.06));
ellipsoid(new THREE.Vector3(-.92,1.18,1.0),new THREE.Vector3(.6,.18,.34),marbleSoft,new THREE.Euler(0,.12,-.1));
ellipsoid(new THREE.Vector3(-1.53,.99,1.03),new THREE.Vector3(.45,.12,.28),marbleSoft);
ellipsoid(new THREE.Vector3(-1.03,1.03,1.0),new THREE.Vector3(.4,.12,.25),marbleSoft);

const ear1=ellipsoid(new THREE.Vector3(-1.25,2.05,.62),new THREE.Vector3(.26,.68,.24),marbleSoft,new THREE.Euler(0,.18,-.48));
const ear2=ellipsoid(new THREE.Vector3(-1.72,1.98,.67),new THREE.Vector3(.25,.58,.23),marbleSoft,new THREE.Euler(0,-.15,-.72));
ear1.scale.y=.8;
ear2.scale.y=.9;

ellipsoid(new THREE.Vector3(1.42,1.52,1.0),new THREE.Vector3(.7,.3,.42),marbleSoft,new THREE.Euler(.08,-.25,-.2));
ellipsoid(new THREE.Vector3(1.84,1.36,1.08),new THREE.Vector3(.55,.18,.3),marbleSoft,new THREE.Euler(0,-.18,-.15));

cylinderBetween(new THREE.Vector3(1.65,2.12,-.15),new THREE.Vector3(2.28,1.45,-.25),.25,marbleSoft);
ellipsoid(new THREE.Vector3(2.32,1.38,-.27),new THREE.Vector3(.72,.28,.34),marbleSoft,new THREE.Euler(0,.15,-.55));
cylinderBetween(new THREE.Vector3(2.05,1.3,-.3),new THREE.Vector3(1.55,1.0,-.05),.22,marbleSoft);
ellipsoid(new THREE.Vector3(1.42,.99,-.02),new THREE.Vector3(.52,.18,.3),marbleSoft);

tube([
  new THREE.Vector3(2.18,2.25,-.18),
  new THREE.Vector3(2.8,2.55,-.1),
  new THREE.Vector3(3.14,2.23,-.04),
  new THREE.Vector3(2.92,1.88,-.02),
  new THREE.Vector3(2.48,1.88,-.1)
],.16,marbleSoft,32);

const closedEye1=[
  new THREE.Vector3(-1.87,1.79,1.27),
  new THREE.Vector3(-1.72,1.73,1.31),
  new THREE.Vector3(-1.58,1.78,1.28)
];
const closedEye2=[
  new THREE.Vector3(-1.58,1.87,1.27),
  new THREE.Vector3(-1.45,1.82,1.3),
  new THREE.Vector3(-1.34,1.86,1.27)
];
tube(closedEye1,.025,shadowMat,12);
tube(closedEye2,.025,shadowMat,12);

tube([
  new THREE.Vector3(-.82,2.78,1.02),
  new THREE.Vector3(-.18,2.94,1.12),
  new THREE.Vector3(.52,2.96,1.08),
  new THREE.Vector3(1.1,2.73,.96)
],.045,deepVeinMat,24);

tube([
  new THREE.Vector3(-.65,2.55,1.1),
  new THREE.Vector3(-.15,2.43,1.18),
  new THREE.Vector3(.38,2.32,1.17),
  new THREE.Vector3(.88,2.08,1.05)
],.038,veinMat,24);

tube([
  new THREE.Vector3(-.38,2.9,.95),
  new THREE.Vector3(-.1,2.65,1.14),
  new THREE.Vector3(.15,2.37,1.2),
  new THREE.Vector3(.48,2.08,1.16),
  new THREE.Vector3(.92,1.86,1.02)
],.028,deepVeinMat,26);

for(let i=0;i<4;i++){
  const x=-.68+i*.4;
  tube([
    new THREE.Vector3(x,2.45,1.08),
    new THREE.Vector3(x-.08,2.22,1.18),
    new THREE.Vector3(x+.18,2.02,1.16),
    new THREE.Vector3(x+.46,1.9,1.02)
  ],.025,marbleSoft,18);
}

tube([
  new THREE.Vector3(-.1,2.98,.2),
  new THREE.Vector3(.62,3.02,.25),
  new THREE.Vector3(1.25,2.82,.28),
  new THREE.Vector3(1.7,2.52,.28)
],.055,marbleSoft,22);

const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(40,40),
  new THREE.MeshStandardMaterial({color:0xc5c2ba,roughness:.9})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.06;
floor.receiveShadow=true;
scene.add(floor);

scene.add(new THREE.HemisphereLight(0xf5f3ed,0x625e58,2.1));

const key=new THREE.DirectionalLight(0xfff8e9,4.1);
key.position.set(-5,9,7);
key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-8;
key.shadow.camera.right=8;
key.shadow.camera.top=8;
key.shadow.camera.bottom=-5;
key.shadow.bias=-.0002;
scene.add(key);

const rim=new THREE.DirectionalLight(0xbccfff,1.6);
rim.position.set(6,5,-7);
scene.add(rim);

const fill=new THREE.PointLight(0xffe6c5,.7,12);
fill.position.set(-4,3,5);
scene.add(fill);

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
