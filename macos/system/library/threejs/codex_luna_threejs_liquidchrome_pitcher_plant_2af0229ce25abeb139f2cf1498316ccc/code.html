<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Pitcher Plant</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050912; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050912);
scene.fog = new THREE.FogExp2(0x050912, 0.055);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.7, 3.3, 7.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.target.set(0, 1.15, 0);

function makeEnvironment() {
  const faces = [];
  const colors = [
    [0x182638, 0x7f9cb7], [0x08101d, 0x36516d],
    [0x263b50, 0xa7c9df], [0x0a111d, 0x536f8c],
    [0x172231, 0x6b879d], [0x050b14, 0x20384f]
  ];
  for (let f = 0; f < 6; f++) {
    const canvas = document.createElement("canvas");
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext("2d");
    const top = new THREE.Color(colors[f][0]);
    const bottom = new THREE.Color(colors[f][1]);
    const gradient = ctx.createLinearGradient(0, 0, 0, 256);
    gradient.addColorStop(0, "#" + top.getHexString());
    gradient.addColorStop(1, "#" + bottom.getHexString());
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 13; i++) {
      const y = 12 + i * 21 + (f % 2) * 5;
      const width = 55 + (i * 37 + f * 19) % 145;
      const x = (i * 61 + f * 31) % 256;
      const band = ctx.createLinearGradient(x, y, x + width, y);
      band.addColorStop(0, "rgba(220,245,255,0)");
      band.addColorStop(0.45, "rgba(220,245,255," + (0.12 + (i % 3) * 0.06) + ")");
      band.addColorStop(0.7, "rgba(30,65,95,0.10)");
      band.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = band;
      ctx.fillRect(x, y, width, 8 + (i % 3) * 5);
    }
    faces.push(canvas);
  }
  const cube = new THREE.CubeTexture(faces);
  cube.colorSpace = THREE.SRGBColorSpace;
  cube.needsUpdate = true;
  return cube;
}

const environment = makeEnvironment();
scene.environment = environment;

const chrome = new THREE.MeshPhysicalMaterial({
  color: 0xcbd7df,
  metalness: 1,
  roughness: 0.115,
  envMap: environment,
  envMapIntensity: 2.15,
  clearcoat: 1,
  clearcoatRoughness: 0.08
});

const darkChrome = new THREE.MeshPhysicalMaterial({
  color: 0x263442,
  metalness: 0.96,
  roughness: 0.19,
  envMap: environment,
  envMapIntensity: 1.7,
  clearcoat: 0.8
});

const innerMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x07101a,
  metalness: 0.82,
  roughness: 0.24,
  envMap: environment,
  envMapIntensity: 1.5
});

const plant = new THREE.Group();
plant.rotation.y = -0.24;
scene.add(plant);

const bodyProfile = [
  new THREE.Vector2(0.10, -1.42),
  new THREE.Vector2(0.24, -1.38),
  new THREE.Vector2(0.38, -1.22),
  new THREE.Vector2(0.55, -0.92),
  new THREE.Vector2(0.72, -0.48),
  new THREE.Vector2(0.79, 0.08),
  new THREE.Vector2(0.75, 0.62),
  new THREE.Vector2(0.67, 1.10),
  new THREE.Vector2(0.67, 1.53),
  new THREE.Vector2(0.75, 1.79),
  new THREE.Vector2(0.92, 1.93)
];
const body = new THREE.Mesh(new THREE.LatheGeometry(bodyProfile, 96), chrome);
body.scale.set(1, 1, 0.91);
body.castShadow = true;
body.receiveShadow = true;
plant.add(body);

const lowerBulb = new THREE.Mesh(
  new THREE.SphereGeometry(0.42, 48, 24),
  chrome
);
lowerBulb.position.set(0, -1.32, 0);
lowerBulb.scale.set(0.8, 0.45, 0.72);
lowerBulb.castShadow = true;
plant.add(lowerBulb);

const mouth = new THREE.Mesh(
  new THREE.CylinderGeometry(0.70, 0.58, 0.055, 96),
  innerMaterial
);
mouth.position.y = 1.84;
mouth.scale.z = 0.91;
plant.add(mouth);

const lip = new THREE.Mesh(
  new THREE.TorusGeometry(0.88, 0.17, 28, 112),
  chrome
);
lip.rotation.x = Math.PI / 2;
lip.scale.set(1, 0.91, 1);
lip.position.y = 1.91;
lip.castShadow = true;
plant.add(lip);

const lipInner = new THREE.Mesh(
  new THREE.TorusGeometry(0.65, 0.065, 20, 96),
  darkChrome
);
lipInner.rotation.x = Math.PI / 2;
lipInner.scale.set(1, 0.91, 1);
lipInner.position.y = 1.925;
plant.add(lipInner);

for (let i = 0; i < 18; i++) {
  const a = (i / 18) * Math.PI * 2;
  const r = 0.88 + Math.sin(i * 2.7) * 0.025;
  const drop = new THREE.Mesh(
    new THREE.SphereGeometry(0.055 + (i % 4) * 0.012, 20, 12),
    chrome
  );
  drop.position.set(Math.cos(a) * r, 1.88 + Math.sin(i * 1.7) * 0.035, Math.sin(a) * r * 0.91);
  drop.scale.y = 1.8 + (i % 3) * 0.55;
  drop.castShadow = true;
  plant.add(drop);
}

const lid = new THREE.Group();
lid.position.set(0.17, 2.56, 0.04);
lid.rotation.z = -0.16;
lid.rotation.x = 0.12;
plant.add(lid);

const lidDisc = new THREE.Mesh(
  new THREE.SphereGeometry(0.76, 64, 32),
  chrome
);
lidDisc.scale.set(1.08, 0.16, 0.84);
lidDisc.castShadow = true;
lid.add(lidDisc);

const lidRim = new THREE.Mesh(
  new THREE.TorusGeometry(0.68, 0.09, 22, 88),
  chrome
);
lidRim.rotation.x = Math.PI / 2;
lidRim.scale.z = 0.79;
lidRim.position.y = -0.025;
lid.add(lidRim);

const lidStem = new THREE.Mesh(
  new THREE.CylinderGeometry(0.095, 0.13, 0.58, 32),
  chrome
);
lidStem.position.set(-0.03, 0.3, 0);
lidStem.rotation.z = 0.16;
lidStem.castShadow = true;
lid.add(lidStem);

const lidDrip = new THREE.Mesh(
  new THREE.SphereGeometry(0.13, 28, 18),
  chrome
);
lidDrip.position.set(0.54, -0.16, 0.18);
lidDrip.scale.set(0.7, 1.8, 0.7);
lidDrip.castShadow = true;
lid.add(lidDrip);

const tendrilCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.1, 2.82, 0),
  new THREE.Vector3(-0.08, 3.25, 0.02),
  new THREE.Vector3(-0.34, 3.62, 0.05),
  new THREE.Vector3(-0.86, 3.78, 0.02),
  new THREE.Vector3(-1.33, 3.58, -0.02),
  new THREE.Vector3(-1.52, 3.16, 0.03),
  new THREE.Vector3(-1.31, 2.86, 0.05),
  new THREE.Vector3(-0.91, 2.78, 0.02),
  new THREE.Vector3(-0.67, 2.96, 0.02)
]);
const tendril = new THREE.Mesh(
  new THREE.TubeGeometry(tendrilCurve, 128, 0.075, 20, false),
  chrome
);
tendril.castShadow = true;
plant.add(tendril);

const tendrilTip = new THREE.Mesh(new THREE.SphereGeometry(0.09, 24, 16), chrome);
tendrilTip.position.copy(tendrilCurve.getPoint(1));
tendrilTip.castShadow = true;
plant.add(tendrilTip);

const neck = new THREE.Mesh(
  new THREE.TubeGeometry(
    new THREE.CatmullRomCurve3([
      new THREE.Vector3(0, 1.72, 0),
      new THREE.Vector3(0.05, 2.05, 0),
      new THREE.Vector3(0.16, 2.30, 0.02),
      new THREE.Vector3(0.17, 2.48, 0.04)
    ]),
    24, 0.14, 24, false
  ),
  chrome
);
neck.castShadow = true;
plant.add(neck);

const keyLight = new THREE.DirectionalLight(0xdcecff, 4.2);
keyLight.position.set(4, 7, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 18;
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -5;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x4d9ed1, 3.1);
rimLight.position.set(-5, 3, -4);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0xffffff, 1.7, 10);
fillLight.position.set(1, 1, 4);
scene.add(fillLight);

const hemi = new THREE.HemisphereLight(0x9ec8e8, 0x060912, 0.65);
scene.add(hemi);

const halo = new THREE.Mesh(
  new THREE.SphereGeometry(5.7, 48, 24),
  new THREE.MeshBasicMaterial({
    color: 0x0b1725,
    side: THREE.BackSide,
    transparent: true,
    opacity: 0.32
  })
);
scene.add(halo);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
