<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Deco Desk Fan</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0b0d10;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e12);
scene.fog = new THREE.Fog(0x0b0e12, 17, 28);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(9.2, 7.2, 14.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
const roomEnvironment = new RoomEnvironment(renderer);
const environmentTexture = pmrem.fromScene(roomEnvironment, 0.04).texture;
scene.environment = environmentTexture;
roomEnvironment.dispose();
pmrem.dispose();

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 10;
controls.maxDistance = 24;
controls.minPolarAngle = Math.PI * 0.22;
controls.maxPolarAngle = Math.PI * 0.52;

const fan = new THREE.Group();
fan.rotation.y = -0.08;
scene.add(fan);

const blackBakelite = new THREE.MeshPhysicalMaterial({
  color: 0x080909,
  metalness: 0.16,
  roughness: 0.18,
  clearcoat: 1,
  clearcoatRoughness: 0.08
});

const blackInset = new THREE.MeshPhysicalMaterial({
  color: 0x020303,
  metalness: 0.05,
  roughness: 0.28,
  clearcoat: 0.75,
  clearcoatRoughness: 0.11
});

const chrome = new THREE.MeshPhysicalMaterial({
  color: 0xf4f7f8,
  metalness: 1,
  roughness: 0.075,
  clearcoat: 0.55,
  clearcoatRoughness: 0.05
});

const nickel = new THREE.MeshStandardMaterial({
  color: 0xc5c9c8,
  metalness: 0.94,
  roughness: 0.24
});

const aluminum = new THREE.MeshPhysicalMaterial({
  color: 0xdce2e2,
  metalness: 0.96,
  roughness: 0.16,
  clearcoat: 0.35,
  clearcoatRoughness: 0.08,
  side: THREE.DoubleSide
});

const gold = new THREE.MeshPhysicalMaterial({
  color: 0xd3a642,
  metalness: 0.96,
  roughness: 0.13,
  clearcoat: 0.45,
  clearcoatRoughness: 0.06
});

const darkGold = new THREE.MeshStandardMaterial({
  color: 0x8d6420,
  metalness: 0.9,
  roughness: 0.2
});

const ivory = new THREE.MeshPhysicalMaterial({
  color: 0xfff1cf,
  metalness: 0.05,
  roughness: 0.19,
  clearcoat: 0.72,
  clearcoatRoughness: 0.1
});

function finish(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function roundedBox(width, height, depth, radius, segments, material) {
  return finish(new THREE.Mesh(
    new RoundedBoxGeometry(width, height, depth, segments, radius),
    material
  ));
}

function cylinderBetween(a, b, radius, material, radialSegments = 12) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const mesh = finish(new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, length, radialSegments, 1, false),
    material
  ));
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  return mesh;
}

function torus(radius, tube, material, z, segments = 96) {
  const mesh = finish(new THREE.Mesh(
    new THREE.TorusGeometry(radius, tube, 12, segments),
    material
  ));
  mesh.position.set(0, 5.72, z);
  return mesh;
}

const baseBottom = roundedBox(5.75, 0.48, 3.42, 0.16, 5, blackBakelite);
baseBottom.position.set(0, 0.27, 0);
fan.add(baseBottom);

const baseGoldLine = roundedBox(5.4, 0.105, 3.16, 0.045, 3, gold);
baseGoldLine.position.set(0, 0.555, 0);
fan.add(baseGoldLine);

const baseMiddle = roundedBox(4.86, 0.55, 2.92, 0.14, 5, blackBakelite);
baseMiddle.position.set(0, 0.78, -0.03);
fan.add(baseMiddle);

const baseUpperTrim = roundedBox(4.38, 0.11, 2.54, 0.04, 3, gold);
baseUpperTrim.position.set(0, 1.085, -0.04);
fan.add(baseUpperTrim);

const baseTop = roundedBox(3.75, 0.46, 2.18, 0.13, 5, blackBakelite);
baseTop.position.set(0, 1.28, -0.06);
fan.add(baseTop);

const topPlate = roundedBox(2.25, 0.12, 1.42, 0.05, 3, darkGold);
topPlate.position.set(0, 1.56, -0.1);
fan.add(topPlate);

function addChevron(cx, cy, scale) {
  const length = 0.83 * scale;
  const thickness = 0.105 * scale;
  const left = roundedBox(thickness, length, 0.045, thickness * 0.35, 3, ivory);
  left.position.set(cx - 0.25 * scale, cy, 1.489);
  left.rotation.z = -Math.PI / 4;
  fan.add(left);

  const right = roundedBox(thickness, length, 0.045, thickness * 0.35, 3, ivory);
  right.position.set(cx + 0.25 * scale, cy, 1.489);
  right.rotation.z = Math.PI / 4;
  fan.add(right);
}

addChevron(-1.78, 0.77, 0.72);
addChevron(-0.88, 0.77, 0.72);
addChevron(0, 0.77, 0.72);
addChevron(0.88, 0.77, 0.72);
addChevron(1.78, 0.77, 0.72);

const centralPillar = roundedBox(1.16, 2.52, 1.15, 0.19, 5, blackBakelite);
centralPillar.position.set(0, 2.72, -0.52);
fan.add(centralPillar);

const pillarInset = roundedBox(0.66, 1.75, 0.06, 0.08, 4, blackInset);
pillarInset.position.set(0, 2.66, 0.087);
fan.add(pillarInset);

const pillarGoldLeft = roundedBox(0.075, 1.83, 0.085, 0.025, 3, gold);
pillarGoldLeft.position.set(-0.42, 2.68, 0.105);
fan.add(pillarGoldLeft);

const pillarGoldRight = pillarGoldLeft.clone();
pillarGoldRight.position.x = 0.42;
fan.add(pillarGoldRight);

const neck = finish(new THREE.Mesh(
  new THREE.CylinderGeometry(0.48, 0.61, 1.72, 32),
  blackBakelite
));
neck.position.set(0, 4.18, -0.57);
fan.add(neck);

const neckCollarBottom = finish(new THREE.Mesh(
  new THREE.CylinderGeometry(0.68, 0.68, 0.14, 40),
  gold
));
neckCollarBottom.position.set(0, 3.38, -0.57);
fan.add(neckCollarBottom);

const neckCollarTop = finish(new THREE.Mesh(
  new THREE.CylinderGeometry(0.61, 0.61, 0.16, 40),
  gold
));
neckCollarTop.position.set(0, 4.95, -0.57);
fan.add(neckCollarTop);

const motorProfile = [
  new THREE.Vector2(0.08, -1.55),
  new THREE.Vector2(0.38, -1.45),
  new THREE.Vector2(0.72, -1.22),
  new THREE.Vector2(0.91, -0.88),
  new THREE.Vector2(0.99, -0.38),
  new THREE.Vector2(0.99, 0.24),
  new THREE.Vector2(0.87, 0.43),
  new THREE.Vector2(0.69, 0.53)
];

const motorHousing = finish(new THREE.Mesh(
  new THREE.LatheGeometry(motorProfile, 64),
  nickel
));
motorHousing.rotation.x = Math.PI / 2;
motorHousing.position.set(0, 5.72, -0.36);
fan.add(motorHousing);

for (let i = 0; i < 16; i++) {
  const angle = i * Math.PI * 2 / 16;
  const radius = 0.98;
  const x = Math.cos(angle) * radius;
  const y = 5.72 + Math.sin(angle) * radius;
  const flute = finish(new THREE.Mesh(
    new THREE.CylinderGeometry(0.032, 0.032, 1.24, 8),
    chrome
  ));
  flute.rotation.x = Math.PI / 2;
  flute.position.set(x, y, -0.81);
  fan.add(flute);
}

const rearCap = finish(new THREE.Mesh(
  new THREE.SphereGeometry(0.39, 32, 18),
  nickel
));
rearCap.scale.set(1, 1, 0.72);
rearCap.position.set(0, 5.72, -1.88);
fan.add(rearCap);

const rearFin = finish(new THREE.Mesh(
  new THREE.CylinderGeometry(0.11, 0.17, 0.56, 24),
  gold
));
rearFin.rotation.x = Math.PI / 2;
rearFin.position.set(0, 5.72, -2.17);
fan.add(rearFin);

const motorBandRear = torus(0.965, 0.075, gold, -1.16);
fan.add(motorBandRear);

const motorBandFront = torus(0.91, 0.085, gold, 0.02);
fan.add(motorBandFront);

const bladeHub = new THREE.Group();
bladeHub.position.set(0, 5.72, 0.17);
bladeHub.rotation.z = 0.17;
fan.add(bladeHub);

function createBlade() {
  const shape = new THREE.Shape();
  shape.moveTo(0.13, 0.43);
  shape.bezierCurveTo(-0.03, 0.9, -0.52, 1.78, -0.68, 2.64);
  shape.bezierCurveTo(-0.72, 2.88, -0.52, 3.04, -0.27, 2.97);
  shape.bezierCurveTo(0.6, 2.72, 1.28, 2.02, 1.46, 1.23);
  shape.bezierCurveTo(1.54, 0.88, 1.25, 0.63, 0.84, 0.53);
  shape.bezierCurveTo(0.54, 0.45, 0.31, 0.41, 0.13, 0.43);
  shape.closePath();

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.13,
    bevelEnabled: true,
    bevelSegments: 3,
    steps: 1,
    bevelSize: 0.045,
    bevelThickness: 0.035,
    curveSegments: 18
  });
  geometry.translate(0, 0, -0.065);
  return finish(new THREE.Mesh(geometry, aluminum));
}

for (let i = 0; i < 4; i++) {
  const blade = createBlade();
  blade.rotation.z = i * Math.PI / 2;
  bladeHub.add(blade);
}

const innerHub = finish(new THREE.Mesh(
  new THREE.CylinderGeometry(0.54, 0.54, 0.32, 48),
  gold
));
innerHub.rotation.x = Math.PI / 2;
innerHub.position.z = 0.08;
bladeHub.add(innerHub);

const hubFace = finish(new THREE.Mesh(
  new THREE.CylinderGeometry(0.42, 0.49, 0.24, 48),
  chrome
));
hubFace.rotation.x = Math.PI / 2;
hubFace.position.z = 0.28;
bladeHub.add(hubFace);

const hubButton = finish(new THREE.Mesh(
  new THREE.SphereGeometry(0.2, 32, 18),
  gold
));
hubButton.scale.z = 0.55;
hubButton.position.z = 0.43;
bladeHub.add(hubButton);

const cage = new THREE.Group();
cage.position.set(0, 0, 0);
fan.add(cage);

cage.add(torus(0.75, 0.065, chrome, 0.68));
cage.add(torus(1.35, 0.045, chrome, 0.69));
cage.add(torus(2.17, 0.052, chrome, 0.7));
cage.add(torus(2.86, 0.055, chrome, 0.71));
cage.add(torus(3.38, 0.11, chrome, 0.72));
cage.add(torus(3.49, 0.035, gold, 0.72));

const cageCenter = new THREE.Vector3(0, 5.72, 0.70);
const spokeCount = 32;

for (let i = 0; i < spokeCount; i++) {
  const angle = i * Math.PI * 2 / spokeCount;
  const innerRadius = 0.69;
  const outerRadius = 3.34;
  const start = new THREE.Vector3(
    Math.cos(angle) * innerRadius,
    5.72 + Math.sin(angle) * innerRadius,
    0.70
  );
  const end = new THREE.Vector3(
    Math.cos(angle) * outerRadius,
    5.72 + Math.sin(angle) * outerRadius,
    0.70
  );
  cage.add(cylinderBetween(start, end, i % 4 === 0 ? 0.036 : 0.025, chrome, 8));
}

for (let i = 0; i < 8; i++) {
  const angle = i * Math.PI * 2 / 8 + Math.PI / 8;
  const front = new THREE.Vector3(
    Math.cos(angle) * 3.34,
    5.72 + Math.sin(angle) * 3.34,
    0.70
  );
  const rear = new THREE.Vector3(
    Math.cos(angle) * 3.16,
    5.72 + Math.sin(angle) * 3.16,
    -0.24
  );
  cage.add(cylinderBetween(front, rear, 0.045, chrome, 10));
}

const centralCageRing = finish(new THREE.Mesh(
  new THREE.CylinderGeometry(0.72, 0.72, 0.16, 48),
  chrome
));
centralCageRing.rotation.x = Math.PI / 2;
centralCageRing.position.copy(cageCenter);
cage.add(centralCageRing);

const centralBadge = finish(new THREE.Mesh(
  new THREE.CylinderGeometry(0.55, 0.55, 0.18, 48),
  blackBakelite
));
centralBadge.rotation.x = Math.PI / 2;
centralBadge.position.set(0, 5.72, 0.82);
cage.add(centralBadge);

const badgeSun = finish(new THREE.Mesh(
  new THREE.CylinderGeometry(0.24, 0.24, 0.06, 32),
  gold
));
badgeSun.rotation.x = Math.PI / 2;
badgeSun.position.set(0, 5.72, 0.94);
cage.add(badgeSun);

for (let i = 0; i < 12; i++) {
  const angle = i * Math.PI * 2 / 12;
  const start = new THREE.Vector3(
    Math.cos(angle) * 0.29,
    5.72 + Math.sin(angle) * 0.29,
    0.95
  );
  const end = new THREE.Vector3(
    Math.cos(angle) * 0.47,
    5.72 + Math.sin(angle) * 0.47,
    0.95
  );
  cage.add(cylinderBetween(start, end, 0.018, gold, 6));
}

const escutcheonShape = new THREE.Shape();
escutcheonShape.moveTo(0, -0.12);
escutcheonShape.lineTo(-0.5, 0.08);
escutcheonShape.absarc(0, 0.08, 0.5, Math.PI, 0, false);
escutcheonShape.lineTo(0, -0.12);
escutcheonShape.closePath();

const escutcheon = finish(new THREE.Mesh(
  new THREE.ExtrudeGeometry(escutcheonShape, {
    depth: 0.055,
    bevelEnabled: true,
    bevelSegments: 2,
    bevelSize: 0.025,
    bevelThickness: 0.018,
    curveSegments: 24
  }),
  gold
));
escutcheon.position.set(1.17, 1.16, 1.085);
fan.add(escutcheon);

for (let i = 0; i < 7; i++) {
  const angle = Math.PI * (0.12 + 0.76 * i / 6);
  const start = new THREE.Vector3(1.17, 1.25, 1.17);
  const end = new THREE.Vector3(
    1.17 + Math.cos(angle) * 0.38,
    1.25 + Math.sin(angle) * 0.38,
    1.17
  );
  fan.add(cylinderBetween(start, end, 0.012, blackInset, 6));
}

const leverStart = new THREE.Vector3(1.17, 1.26, 1.2);
const leverEnd = new THREE.Vector3(1.17, 1.69, 1.45);
fan.add(cylinderBetween(leverStart, leverEnd, 0.065, chrome, 16));

const leverKnob = finish(new THREE.Mesh(
  new THREE.SphereGeometry(0.14, 24, 16),
  blackBakelite
));
leverKnob.position.copy(leverEnd);
leverKnob.scale.set(0.9, 1.18, 0.9);
fan.add(leverKnob);

const feet = [
  [-2.15, 0.02, 1.13],
  [2.15, 0.02, 1.13],
  [-2.15, 0.02, -1.13],
  [2.15, 0.02, -1.13]
];

for (const position of feet) {
  const foot = finish(new THREE.Mesh(
    new THREE.CylinderGeometry(0.19, 0.24, 0.17, 24),
    blackInset
  ));
  foot.position.set(position[0], position[1], position[2]);
  fan.add(foot);
}

fan.traverse((object) => {
  if (object.isMesh) {
    object.castShadow = true;
    object.receiveShadow = true;
  }
});

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({
    color: 0x15181b,
    metalness: 0.12,
    roughness: 0.3
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.1;
floor.receiveShadow = true;
scene.add(floor);

const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 18),
  new THREE.MeshStandardMaterial({
    color: 0x11151a,
    metalness: 0.05,
    roughness: 0.52
  })
);
backdrop.position.set(0, 8, -7);
backdrop.receiveShadow = true;
scene.add(backdrop);

const decoHalo = new THREE.Mesh(
  new THREE.RingGeometry(5.6, 5.7, 96),
  new THREE.MeshBasicMaterial({
    color: 0x5e4920,
    transparent: true,
    opacity: 0.34,
    side: THREE.DoubleSide
  })
);
decoHalo.position.set(0, 5.5, -6.88);
scene.add(decoHalo);

const hemi = new THREE.HemisphereLight(0x9db7d4, 0x291b12, 1.25);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffe7c5, 5.2);
keyLight.position.set(7, 12, 10);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -8;
keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 12;
keyLight.shadow.camera.bottom = -3;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 30;
keyLight.shadow.bias = -0.00025;
scene.add(keyLight);

const coolRim = new THREE.SpotLight(0x9bc9ff, 4.8, 30, Math.PI / 5, 0.5, 1.2);
coolRim.position.set(-8, 8, 3);
coolRim.target.position.set(0, 5, 0);
scene.add(coolRim, coolRim.target);

const warmFill = new THREE.SpotLight(0xffb65f, 3.4, 25, Math.PI / 4, 0.65, 1.4);
warmFill.position.set(6, 4, -3);
warmFill.target.position.set(0, 3.6, 0);
scene.add(warmFill, warmFill.target);

const topLight = new THREE.PointLight(0xffffff, 2.2, 18, 1.5);
topLight.position.set(0, 11, 2);
scene.add(topLight);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
