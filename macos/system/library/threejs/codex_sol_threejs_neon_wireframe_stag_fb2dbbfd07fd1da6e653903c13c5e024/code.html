<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Wireframe Stag</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000006, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.45;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000006);
scene.fog = new THREE.FogExp2(0x000006, 0.018);

const camera = new THREE.PerspectiveCamera(
  42,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.set(10.5, 5.4, 12.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.55, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 8;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.78;

const stag = new THREE.Group();
scene.add(stag);

const magenta = new THREE.Color(0xff149f);
const hotPink = new THREE.Color(0xff46c8);
const cyan = new THREE.Color(0x10eaff);
const paleCyan = new THREE.Color(0xb8ffff);
const violet = new THREE.Color(0xb83cff);

const coreMaterials = new Map();
const glowMaterials = new Map();
const animatedGlowMaterials = [];

function materialKey(color) {
  return color.getHexString();
}

function getCoreMaterial(color) {
  const key = materialKey(color);
  if (!coreMaterials.has(key)) {
    coreMaterials.set(key, new THREE.MeshBasicMaterial({
      color,
      toneMapped: false
    }));
  }
  return coreMaterials.get(key);
}

function getGlowMaterial(color) {
  const key = materialKey(color);
  if (!glowMaterials.has(key)) {
    const material = new THREE.MeshBasicMaterial({
      color,
      transparent: true,
      opacity: 0.16,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide,
      toneMapped: false
    });
    material.userData.baseOpacity = 0.16;
    glowMaterials.set(key, material);
    animatedGlowMaterials.push(material);
  }
  return glowMaterials.get(key);
}

function vec(value) {
  return value instanceof THREE.Vector3
    ? value.clone()
    : new THREE.Vector3(value[0], value[1], value[2]);
}

function addRod(aValue, bValue, color = magenta, radius = 0.024, parent = stag) {
  const a = vec(aValue);
  const b = vec(bValue);
  const delta = new THREE.Vector3().subVectors(b, a);
  const length = delta.length();
  if (length < 0.0001) return;

  const midpoint = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
  const orientation = new THREE.Quaternion().setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    delta.normalize()
  );

  const glowGeometry = new THREE.CylinderGeometry(radius * 3.7, radius * 3.7, length, 7, 1, true);
  const glow = new THREE.Mesh(glowGeometry, getGlowMaterial(color));
  glow.position.copy(midpoint);
  glow.quaternion.copy(orientation);
  glow.renderOrder = 1;
  parent.add(glow);

  const coreGeometry = new THREE.CylinderGeometry(radius, radius, length, 7, 1, true);
  const core = new THREE.Mesh(coreGeometry, getCoreMaterial(color));
  core.position.copy(midpoint);
  core.quaternion.copy(orientation);
  core.renderOrder = 2;
  parent.add(core);
}

function addCurve(points, color = magenta, radius = 0.025, parent = stag) {
  const curvePoints = points.map(vec);
  if (curvePoints.length < 2) return;
  const curve = new THREE.CatmullRomCurve3(curvePoints, false, 'centripetal');

  const glowGeometry = new THREE.TubeGeometry(curve, Math.max(10, curvePoints.length * 8), radius * 3.5, 6, false);
  const glow = new THREE.Mesh(glowGeometry, getGlowMaterial(color));
  glow.renderOrder = 1;
  parent.add(glow);

  const coreGeometry = new THREE.TubeGeometry(curve, Math.max(10, curvePoints.length * 8), radius, 7, false);
  const core = new THREE.Mesh(coreGeometry, getCoreMaterial(color));
  core.renderOrder = 2;
  parent.add(core);
}

function addNode(positionValue, color = hotPink, size = 0.065, parent = stag) {
  const position = vec(positionValue);

  const aura = new THREE.Mesh(
    new THREE.IcosahedronGeometry(size * 3.3, 1),
    getGlowMaterial(color)
  );
  aura.position.copy(position);
  aura.renderOrder = 3;
  parent.add(aura);

  const node = new THREE.Mesh(
    new THREE.IcosahedronGeometry(size, 1),
    getCoreMaterial(color)
  );
  node.position.copy(position);
  node.renderOrder = 4;
  parent.add(node);
}

function connectLoop(points, color = magenta, radius = 0.022) {
  for (let i = 0; i < points.length; i++) {
    addRod(points[i], points[(i + 1) % points.length], color, radius);
  }
}

function makeRing(x, centerY, yRadius, zRadius, count = 8) {
  const points = [];
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    points.push(new THREE.Vector3(
      x,
      centerY + Math.cos(angle) * yRadius,
      Math.sin(angle) * zRadius
    ));
  }
  return points;
}

const bodySpecs = [
  [-2.45, 2.65, 0.68, 0.46],
  [-1.75, 2.82, 0.94, 0.67],
  [-0.82, 2.88, 1.02, 0.74],
  [0.10, 2.90, 0.94, 0.69],
  [0.83, 3.02, 0.76, 0.57]
];

const bodyRings = bodySpecs.map(spec => makeRing(...spec, 8));

for (let r = 0; r < bodyRings.length; r++) {
  connectLoop(bodyRings[r], r === bodyRings.length - 1 ? hotPink : magenta, 0.027);
  for (const point of bodyRings[r]) addNode(point, magenta, 0.044);
}

for (let r = 0; r < bodyRings.length - 1; r++) {
  for (let i = 0; i < 8; i++) {
    const accent = (i === 0 || i === 4) ? cyan : magenta;
    addRod(bodyRings[r][i], bodyRings[r + 1][i], accent, accent === cyan ? 0.029 : 0.023);
    addRod(bodyRings[r][i], bodyRings[r + 1][(i + 1) % 8], magenta, 0.018);
  }
}

addCurve([
  [-2.42, 3.30, 0],
  [-1.55, 3.72, 0],
  [-0.55, 3.88, 0],
  [0.42, 3.76, 0],
  [0.92, 3.54, 0]
], cyan, 0.034);

addCurve([
  [-2.42, 2.25, 0],
  [-1.48, 1.96, 0],
  [-0.38, 1.88, 0],
  [0.62, 2.25, 0]
], magenta, 0.023);

const neckRings = [
  makeRing(0.78, 3.18, 0.68, 0.54, 6),
  makeRing(1.10, 3.68, 0.61, 0.47, 6),
  makeRing(1.40, 4.16, 0.48, 0.39, 6),
  makeRing(1.66, 4.50, 0.35, 0.32, 6)
];

for (let r = 0; r < neckRings.length; r++) {
  connectLoop(neckRings[r], r > 1 ? hotPink : magenta, 0.025);
  for (const point of neckRings[r]) addNode(point, r > 1 ? hotPink : magenta, 0.045);
  if (r > 0) {
    for (let i = 0; i < 6; i++) {
      addRod(neckRings[r - 1][i], neckRings[r][i], i === 0 ? cyan : magenta, 0.023);
      addRod(neckRings[r - 1][i], neckRings[r][(i + 1) % 6], magenta, 0.017);
    }
  }
}

const headVertices = [
  new THREE.Vector3(1.48, 4.70, -0.34),
  new THREE.Vector3(1.48, 4.70, 0.34),
  new THREE.Vector3(1.86, 4.95, -0.37),
  new THREE.Vector3(1.86, 4.95, 0.37),
  new THREE.Vector3(2.42, 4.80, -0.29),
  new THREE.Vector3(2.42, 4.80, 0.29),
  new THREE.Vector3(2.86, 4.56, -0.20),
  new THREE.Vector3(2.86, 4.56, 0.20),
  new THREE.Vector3(2.98, 4.37, 0)
];

const headEdges = [
  [0,1],[0,2],[1,3],[2,3],[2,4],[3,5],[4,5],
  [4,6],[5,7],[6,7],[6,8],[7,8],[0,4],[1,5],[2,5],[3,4]
];

for (const edge of headEdges) {
  addRod(headVertices[edge[0]], headVertices[edge[1]], edge[0] >= 4 ? cyan : hotPink, 0.024);
}
for (const point of headVertices) addNode(point, hotPink, 0.052);

const leftEar = [
  [1.63, 4.95, 0.31],
  [1.30, 5.18, 0.62],
  [1.77, 5.04, 0.42]
];
const rightEar = [
  [1.63, 4.95, -0.31],
  [1.30, 5.18, -0.62],
  [1.77, 5.04, -0.42]
];
connectLoop(leftEar, cyan, 0.026);
connectLoop(rightEar, cyan, 0.026);
leftEar.concat(rightEar).forEach(point => addNode(point, cyan, 0.048));

addNode([2.98, 4.37, 0], paleCyan, 0.075);
addNode([2.45, 4.82, 0.30], cyan, 0.055);
addNode([2.45, 4.82, -0.30], cyan, 0.055);

function createLeg(hipX, hipZ, kneeX, hoofX, rear = false) {
  const sign = hipZ < 0 ? -1 : 1;
  const width = 0.13;
  const hipA = [hipX, 2.20, hipZ - width];
  const hipB = [hipX, 2.20, hipZ + width];
  const kneeA = [kneeX, 0.75, hipZ - width * 0.72];
  const kneeB = [kneeX, 0.75, hipZ + width * 0.72];
  const ankleA = [hoofX, -0.72, hipZ - width * 0.5];
  const ankleB = [hoofX, -0.72, hipZ + width * 0.5];
  const toeA = [hoofX + (rear ? -0.24 : 0.24), -1.02, hipZ - 0.13];
  const toeB = [hoofX + (rear ? -0.24 : 0.24), -1.02, hipZ + 0.13];

  addRod(hipA, kneeA, sign > 0 ? cyan : magenta, 0.027);
  addRod(hipB, kneeB, magenta, 0.027);
  addRod(hipA, hipB, hotPink, 0.022);
  addRod(kneeA, kneeB, cyan, 0.022);
  addRod(hipA, kneeB, magenta, 0.017);
  addRod(hipB, kneeA, magenta, 0.017);

  addRod(kneeA, ankleA, cyan, 0.027);
  addRod(kneeB, ankleB, magenta, 0.027);
  addRod(kneeA, ankleB, magenta, 0.017);
  addRod(kneeB, ankleA, magenta, 0.017);
  addRod(ankleA, ankleB, cyan, 0.021);

  addRod(ankleA, toeA, hotPink, 0.029);
  addRod(ankleB, toeB, hotPink, 0.029);
  addRod(toeA, toeB, cyan, 0.025);

  [hipA, hipB, kneeA, kneeB, ankleA, ankleB, toeA, toeB]
    .forEach(point => addNode(point, cyan, 0.043));
}

createLeg(0.46, 0.45, 0.56, 0.38, false);
createLeg(0.30, -0.45, 0.12, 0.25, false);
createLeg(-1.82, 0.42, -2.04, -1.90, true);
createLeg(-1.98, -0.42, -1.67, -1.82, true);

const tailPoints = [
  [-2.42, 3.00, -0.12],
  [-2.95, 3.30, -0.08],
  [-3.42, 3.18, -0.02],
  [-3.62, 2.82, 0]
];
addCurve(tailPoints, hotPink, 0.031);
tailPoints.forEach(point => addNode(point, hotPink, 0.046));
addRod([-2.92, 3.27, -0.08], [-3.36, 2.97, 0.24], magenta, 0.019);
addRod([-2.92, 3.27, -0.08], [-3.36, 2.97, -0.24], magenta, 0.019);
addRod([-3.36, 2.97, 0.24], [-3.62, 2.82, 0], cyan, 0.019);
addRod([-3.36, 2.97, -0.24], [-3.62, 2.82, 0], cyan, 0.019);

function createAntler(zSide) {
  const z = zSide * 0.31;
  const outward = zSide * 0.28;
  const points = {
    base: new THREE.Vector3(1.70, 5.03, z),
    a: new THREE.Vector3(1.48, 5.52, z + outward * 0.45),
    b: new THREE.Vector3(1.22, 6.05, z + outward * 0.72),
    c: new THREE.Vector3(0.82, 6.45, z + outward),
    d: new THREE.Vector3(0.26, 6.64, z + outward * 1.12),
    e: new THREE.Vector3(-0.35, 6.58, z + outward),
    crown: new THREE.Vector3(-0.83, 6.88, z + outward * 0.72),
    t1: new THREE.Vector3(1.68, 6.27, z + outward * 0.92),
    t2: new THREE.Vector3(1.73, 6.92, z + outward * 0.82),
    t3: new THREE.Vector3(1.02, 6.76, z + outward * 1.25),
    t4: new THREE.Vector3(0.88, 7.38, z + outward * 1.12),
    t5: new THREE.Vector3(0.22, 6.89, z + outward * 1.30),
    t6: new THREE.Vector3(-0.02, 7.48, z + outward),
    t7: new THREE.Vector3(-0.54, 6.76, z + outward * 1.05),
    t8: new THREE.Vector3(-0.91, 7.24, z + outward * 0.72)
  };

  addCurve([points.base, points.a, points.b, points.c, points.d, points.e, points.crown], hotPink, 0.036);
  addCurve([points.base, points.a, points.b, points.t1, points.t2], cyan, 0.026);
  addCurve([points.b, points.c, points.t3, points.t4], magenta, 0.029);
  addCurve([points.c, points.d, points.t5, points.t6], hotPink, 0.029);
  addCurve([points.d, points.e, points.t7, points.t8], cyan, 0.026);

  addRod(points.a, points.t1, magenta, 0.018);
  addRod(points.t1, points.t3, cyan, 0.018);
  addRod(points.t3, points.t5, magenta, 0.018);
  addRod(points.t5, points.t7, hotPink, 0.018);
  addRod(points.b, points.t3, hotPink, 0.017);
  addRod(points.c, points.t5, cyan, 0.017);
  addRod(points.d, points.t7, magenta, 0.017);

  Object.values(points).forEach((point, index) => {
    addNode(point, index % 3 === 0 ? cyan : paleCyan, index === 0 ? 0.075 : 0.062);
  });

  return points;
}

const antlerLeft = createAntler(1);
const antlerRight = createAntler(-1);
const bridgeNames = ['base','a','b','c','d','e','crown','t1','t2','t3','t4','t5','t6','t7','t8'];

for (let i = 0; i < bridgeNames.length; i++) {
  const name = bridgeNames[i];
  addRod(
    antlerLeft[name],
    antlerRight[name],
    i % 3 === 0 ? cyan : violet,
    i < 2 ? 0.022 : 0.015
  );
}

const crossPairs = [
  ['a','b'],['b','c'],['c','d'],['d','e'],
  ['t1','t3'],['t3','t5'],['t5','t7'],
  ['t2','t4'],['t4','t6'],['t6','t8']
];

for (let i = 0; i < crossPairs.length; i++) {
  const [from, to] = crossPairs[i];
  addRod(antlerLeft[from], antlerRight[to], i % 2 ? magenta : cyan, 0.013);
  addRod(antlerRight[from], antlerLeft[to], i % 2 ? cyan : magenta, 0.013);
}

const chestStar = [0.72, 3.18, 0];
addNode(chestStar, paleCyan, 0.09);
for (const target of [
  [0.18, 3.72, 0.45],
  [0.18, 3.72, -0.45],
  [0.20, 2.42, 0.50],
  [0.20, 2.42, -0.50],
  [1.10, 3.68, 0.47],
  [1.10, 3.68, -0.47]
]) {
  addRod(chestStar, target, cyan, 0.016);
}

const rimLight = new THREE.PointLight(0xff1ca8, 3.2, 16, 2);
rimLight.position.set(-2, 4, 4);
scene.add(rimLight);

const cyanLight = new THREE.PointLight(0x00ddff, 2.7, 14, 2);
cyanLight.position.set(4, 5, -4);
scene.add(cyanLight);

const ambient = new THREE.AmbientLight(0x1a0030, 0.6);
scene.add(ambient);

stag.rotation.y = -0.16;

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  const pulse = 0.025 * Math.sin(elapsed * 2.1) + 0.014 * Math.sin(elapsed * 4.7);

  for (let i = 0; i < animatedGlowMaterials.length; i++) {
    const material = animatedGlowMaterials[i];
    material.opacity = material.userData.baseOpacity + pulse;
  }

  rimLight.intensity = 3.1 + Math.sin(elapsed * 1.7) * 0.35;
  cyanLight.intensity = 2.6 + Math.sin(elapsed * 1.3 + 1.8) * 0.28;

  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
