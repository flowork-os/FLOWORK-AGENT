<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Porcelain Sugar Bowl</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #d9d5cc; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9d5cc);
scene.fog = new THREE.Fog(0xd9d5cc, 7, 14);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.8, 3.55, 5.7);
camera.lookAt(0, 1.75, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.72;
controls.minDistance = 3.7;
controls.maxDistance = 9;
controls.target.set(0, 1.72, 0);

const hemi = new THREE.HemisphereLight(0xfff7e8, 0x777a82, 2.25);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff7e4, 4.1);
key.position.set(4.5, 7, 4.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -2;
key.shadow.bias = -0.00025;
scene.add(key);

const fill = new THREE.DirectionalLight(0xaec9ff, 1.45);
fill.position.set(-4, 3.2, -4);
scene.add(fill);

const porcelain = new THREE.MeshPhysicalMaterial({
  color: 0xf4f0df,
  roughness: 0.16,
  metalness: 0.0,
  clearcoat: 0.72,
  clearcoatRoughness: 0.12,
  sheen: 0.16,
  sheenColor: 0xfff7e7
});

const porcelainShadow = new THREE.MeshPhysicalMaterial({
  color: 0xe9e4d2,
  roughness: 0.2,
  clearcoat: 0.62,
  clearcoatRoughness: 0.13
});

const rosePorcelain = new THREE.MeshPhysicalMaterial({
  color: 0xeed8c8,
  roughness: 0.2,
  clearcoat: 0.7,
  clearcoatRoughness: 0.13
});

const cobalt = new THREE.MeshPhysicalMaterial({
  color: 0x123d83,
  roughness: 0.22,
  clearcoat: 0.48,
  clearcoatRoughness: 0.18
});

const gold = new THREE.MeshPhysicalMaterial({
  color: 0xc69232,
  metalness: 0.82,
  roughness: 0.18,
  clearcoat: 0.5
});

const crazeMat = new THREE.MeshBasicMaterial({
  color: 0x9c8b75,
  transparent: true,
  opacity: 0.48
});

function lathe(points, material, segments = 160) {
  const g = new THREE.LatheGeometry(points.map(p => new THREE.Vector2(p[0], p[1])), segments);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, material);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function tube(points, radius, material, tubular = 12) {
  const curve = new THREE.CatmullRomCurve3(points);
  const g = new THREE.TubeGeometry(curve, Math.max(24, points.length * 8), radius, tubular, false);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, material);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function bodyRadius(y) {
  if (y < 0.68) return 1.18 + (y - 0.58) * 1.2;
  if (y < 0.86) return 1.30 + (y - 0.68) * 0.28;
  if (y < 1.95) return 1.35 + 0.025 * Math.sin((y - 0.86) * 2.2);
  if (y < 2.34) return 1.35 - (y - 1.95) * 0.31;
  return 1.23 - (y - 2.34) * 0.14;
}

const bodyProfile = [
  [0.00, 0.58], [0.98, 0.58], [1.12, 0.61], [1.22, 0.66],
  [1.31, 0.74], [1.35, 0.87], [1.35, 1.82], [1.32, 2.08],
  [1.26, 2.34], [1.18, 2.47], [1.04, 2.54], [0.0, 2.54]
];
const body = lathe(bodyProfile, porcelain, 192);
const bp = body.geometry.attributes.position;
for (let i = 0; i < bp.count; i++) {
  const x = bp.getX(i), z = bp.getZ(i), y = bp.getY(i);
  const a = Math.atan2(z, x);
  const attenuation = Math.min(1, Math.max(0, (y - 0.64) / 0.34)) * Math.min(1, Math.max(0, (2.49 - y) / 0.28));
  const factor = 1 + 0.052 * Math.cos(a * 12) * (0.72 + 0.28 * attenuation);
  bp.setX(i, x * factor);
  bp.setZ(i, z * factor);
}
bp.needsUpdate = true;
body.geometry.computeVertexNormals();
scene.add(body);

const foot = new THREE.Mesh(new THREE.TorusGeometry(1.06, 0.105, 18, 128), porcelainShadow);
foot.rotation.x = Math.PI / 2;
foot.position.y = 0.59;
foot.castShadow = true;
foot.receiveShadow = true;
scene.add(foot);

const footGold = new THREE.Mesh(new THREE.TorusGeometry(1.17, 0.018, 10, 128), gold);
footGold.rotation.x = Math.PI / 2;
footGold.position.y = 0.675;
scene.add(footGold);

const ribCount = 12;
for (let i = 0; i < ribCount; i++) {
  const a = i * Math.PI * 2 / ribCount;
  const pts = [];
  for (let j = 0; j <= 14; j++) {
    const y = 0.82 + j * (1.66 / 14);
    const r = bodyRadius(y) + 0.073;
    pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
  }
  scene.add(tube(pts, 0.014, cobalt, 7));

  for (let j = 0; j < 3; j++) {
    const y = 1.12 + j * 0.43;
    const r = bodyRadius(y) + 0.083;
    const center = new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r);
    const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.075, 12, 8), cobalt);
    leaf.position.copy(center);
    leaf.scale.set(0.34, 1.0, 0.13);
    leaf.rotation.y = -a;
    leaf.rotation.z = j % 2 ? -0.55 : 0.55;
    leaf.castShadow = true;
    scene.add(leaf);
  }
}

const lidProfile = [
  [0.02, 2.82], [0.36, 2.83], [0.72, 2.79], [1.06, 2.70],
  [1.31, 2.59], [1.48, 2.49], [1.56, 2.40], [1.56, 2.35],
  [1.48, 2.31], [0.0, 2.31]
];
const lid = lathe(lidProfile, porcelain, 192);
const lp = lid.geometry.attributes.position;
for (let i = 0; i < lp.count; i++) {
  const x = lp.getX(i), z = lp.getZ(i), y = lp.getY(i);
  const a = Math.atan2(z, x);
  const domeFactor = Math.min(1, Math.max(0, (y - 2.34) / 0.49));
  const factor = 1 + 0.034 * Math.cos(a * 12) * domeFactor;
  lp.setX(i, x * factor);
  lp.setZ(i, z * factor);
}
lp.needsUpdate = true;
lid.geometry.computeVertexNormals();
scene.add(lid);

const lidGold = new THREE.Mesh(new THREE.TorusGeometry(1.525, 0.021, 12, 160), gold);
lidGold.rotation.x = Math.PI / 2;
lidGold.position.y = 2.365;
scene.add(lidGold);

function lidRadius(y) {
  if (y <= 2.365) return 1.52;
  const t = (y - 2.365) / 0.465;
  return Math.max(0.04, 1.52 * Math.pow(1 - t, 0.48));
}

for (let i = 0; i < ribCount; i++) {
  const a = i * Math.PI * 2 / ribCount;
  const pts = [];
  for (let j = 0; j <= 10; j++) {
    const y = 2.39 + j * 0.42 / 10;
    const r = lidRadius(y) + 0.028;
    pts.push(new THREE.Vector3(Math.cos(a) * r, y, Math.sin(a) * r));
  }
  scene.add(tube(pts, 0.012, cobalt, 7));
}

const lidButton = new THREE.Mesh(new THREE.SphereGeometry(0.16, 32, 20), porcelain);
lidButton.scale.y = 0.55;
lidButton.position.y = 2.83;
lidButton.castShadow = true;
scene.add(lidButton);

const stem = tube([
  new THREE.Vector3(0, 2.86, 0),
  new THREE.Vector3(0.015, 3.01, 0),
  new THREE.Vector3(-0.015, 3.12, 0)
], 0.055, rosePorcelain, 10);
scene.add(stem);

const bud = lathe([
  [0.0, 3.05], [0.10, 3.08], [0.17, 3.17], [0.16, 3.30],
  [0.10, 3.40], [0.0, 3.45]
], rosePorcelain, 64);
scene.add(bud);

for (let i = 0; i < 6; i++) {
  const a = i * Math.PI * 2 / 6 + 0.18;
  const petal = new THREE.Mesh(new THREE.SphereGeometry(0.115, 20, 14), rosePorcelain);
  petal.position.set(Math.cos(a) * 0.105, 3.25 + Math.sin(i * 1.7) * 0.018, Math.sin(a) * 0.105);
  petal.scale.set(0.82, 1.35, 0.42);
  petal.rotation.y = -a;
  petal.rotation.z = Math.cos(a) * 0.32;
  petal.castShadow = true;
  scene.add(petal);
}

function makeHandle(side) {
  const s = side;
  const pts = [
    new THREE.Vector3(s * 1.27, 2.03, 0),
    new THREE.Vector3(s * 1.55, 2.04, 0),
    new THREE.Vector3(s * 1.82, 1.96, 0),
    new THREE.Vector3(s * 1.98, 1.76, 0),
    new THREE.Vector3(s * 1.96, 1.49, 0),
    new THREE.Vector3(s * 1.79, 1.30, 0),
    new THREE.Vector3(s * 1.57, 1.30, 0),
    new THREE.Vector3(s * 1.48, 1.46, 0),
    new THREE.Vector3(s * 1.58, 1.61, 0),
    new THREE.Vector3(s * 1.73, 1.61, 0)
  ];
  const h = tube(pts, 0.075, porcelainShadow, 14);
  scene.add(h);
  for (const p of [pts[0], pts[pts.length - 1]]) {
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.105, 20, 14), porcelainShadow);
    knob.position.copy(p);
    knob.castShadow = true;
    scene.add(knob);
  }
}
makeHandle(1);
makeHandle(-1);

for (let i = 0; i < 22; i++) {
  const a = i * Math.PI * 2 / 22 + 0.16 * Math.sin(i * 2.3);
  const y0 = 0.705 + (i % 4) * 0.038;
  const pts = [];
  for (let j = 0; j < 4; j++) {
    const y = y0 + j * 0.047;
    const r = bodyRadius(Math.min(y, 0.86)) + 0.012;
    const aa = a + (j - 1.5) * 0.035 * Math.sin(i + 1);
    pts.push(new THREE.Vector3(Math.cos(aa) * r, y, Math.sin(aa) * r));
  }
  scene.add(tube(pts, 0.006, crazeMat, 5));
}

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 96),
  new THREE.MeshStandardMaterial({ color: 0xd9d5cc, roughness: 0.82, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.43;
ground.receiveShadow = true;
scene.add(ground);

const pedestalShadow = new THREE.Mesh(
  new THREE.CircleGeometry(1.75, 96),
  new THREE.MeshBasicMaterial({ color: 0x77736d, transparent: true, opacity: 0.16 })
);
pedestalShadow.rotation.x = -Math.PI / 2;
pedestalShadow.position.y = 0.442;
pedestalShadow.scale.set(1, 0.46, 1);
scene.add(pedestalShadow);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
