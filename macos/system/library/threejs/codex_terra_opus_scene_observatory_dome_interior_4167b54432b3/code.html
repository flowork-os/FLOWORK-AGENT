<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Observatory Dome Interior</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#03050b}
  canvas{display:block}
  #label{position:fixed;left:20px;bottom:16px;color:#b9cce0;font:12px/1.4 Georgia,serif;letter-spacing:.14em;text-transform:uppercase;pointer-events:none;opacity:.8}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">North Meridian Observatory · 03:17 Local Sidereal Time</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03050c);
scene.fog = new THREE.FogExp2(0x07101a, 0.018);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 160);
camera.position.set(13, 8.5, 17);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.18;
controls.maxPolarAngle = Math.PI * 0.48;
controls.minDistance = 8;
controls.maxDistance = 32;

let seed = 712367;
function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a,b){ return a + (b-a)*rand(); }
function mat(color, rough=0.65, metal=0) {
  return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
}
function emissive(color, intensity=1) {
  return new THREE.MeshStandardMaterial({
    color, emissive:color, emissiveIntensity:intensity, roughness:0.38, metalness:0.15
  });
}
function mesh(geometry, material, x=0,y=0,z=0) {
  const m = new THREE.Mesh(geometry,material);
  m.position.set(x,y,z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
function cylinder(r1,r2,h,material,x=0,y=0,z=0,segments=32) {
  return mesh(new THREE.CylinderGeometry(r1,r2,h,segments),material,x,y,z);
}
function box(w,h,d,material,x=0,y=0,z=0) {
  return mesh(new THREE.BoxGeometry(w,h,d),material,x,y,z);
}
function torus(r,t,material,x=0,y=0,z=0) {
  return mesh(new THREE.TorusGeometry(r,t,12,48),material,x,y,z);
}
function makeCanvasTexture(draw, w=512, h=512) {
  const c=document.createElement("canvas");
  c.width=w;c.height=h;
  const ctx=c.getContext("2d");
  draw(ctx,w,h);
  const tx=new THREE.CanvasTexture(c);
  tx.colorSpace=THREE.SRGBColorSpace;
  tx.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return tx;
}

const floorTexture = makeCanvasTexture((ctx,w,h)=>{
  ctx.fillStyle="#1c2529";ctx.fillRect(0,0,w,h);
  for(let i=0;i<2500;i++){
    const v=Math.floor(range(20,50));
    ctx.fillStyle=`rgba(${v},${v+6},${v+8},${range(.03,.12)})`;
    ctx.fillRect(rand()*w,rand()*h,range(1,4),range(1,4));
  }
  ctx.strokeStyle="rgba(120,150,150,.15)";
  ctx.lineWidth=3;
  for(let x=0;x<w;x+=64){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}
  for(let y=0;y<h;y+=64){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
});
floorTexture.wrapS=floorTexture.wrapT=THREE.RepeatWrapping;
floorTexture.repeat.set(9,9);
const floorMat = new THREE.MeshStandardMaterial({map:floorTexture,roughness:.82,metalness:.18});
const floor = mesh(new THREE.CylinderGeometry(11.7,11.7,.32,96),floorMat,0,-.18,0);
floor.receiveShadow=true;

const skyTexture = makeCanvasTexture((ctx,w,h)=>{
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,"#02030a");g.addColorStop(.52,"#0b1732");g.addColorStop(1,"#1d2a39");
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.save();
  ctx.translate(w*.54,h*.42);ctx.rotate(-.43);
  const mg=ctx.createLinearGradient(-90,0,90,0);
  mg.addColorStop(0,"rgba(100,130,195,0)");
  mg.addColorStop(.45,"rgba(154,180,230,.23)");
  mg.addColorStop(.53,"rgba(235,235,255,.37)");
  mg.addColorStop(1,"rgba(100,130,195,0)");
  ctx.fillStyle=mg;ctx.fillRect(-100,-h,200,h*2);
  ctx.restore();
  for(let i=0;i<1050;i++){
    const x=rand()*w,y=rand()*h;
    const r=rand()<.93?range(.25,1.05):range(1.1,2.1);
    const a=range(.25,1);
    ctx.fillStyle=`rgba(${Math.floor(range(170,255))},${Math.floor(range(185,235))},255,${a})`;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
},1024,1024);
const skyMat = new THREE.MeshBasicMaterial({map:skyTexture,side:THREE.BackSide});
const sky = mesh(new THREE.SphereGeometry(52,64,32),skyMat);
sky.rotation.y=.42;

const domeMat = mat(0x31414a,.54,.58);
const ribMat = mat(0x52626b,.42,.72);
const innerMat = mat(0x18232c,.72,.35);
const slitAngle = 0.05;
const slitWidth = 0.72;
const slitA = slitAngle-slitWidth/2, slitB=slitAngle+slitWidth/2;
const domeRadius=11.35, domeY=4.3;

const domeGroup=new THREE.Group();
scene.add(domeGroup);
const domeGeom = new THREE.SphereGeometry(domeRadius,64,32,slitA,Math.PI*2-slitWidth,0,Math.PI/2);
const dome=mesh(domeGeom,domeMat,0,domeY,0);
dome.castShadow=false;
domeGroup.add(dome);

const lowerWall = mesh(
  new THREE.CylinderGeometry(domeRadius,domeRadius,4.45,64,1,true),
  innerMat,0,2.05,0
);
lowerWall.material.side=THREE.BackSide;
lowerWall.castShadow=false;
domeGroup.add(lowerWall);

for(let i=0;i<18;i++){
  const a=slitB+(Math.PI*2-slitWidth)*i/18;
  const rib=new THREE.Group();
  rib.position.y=domeY;
  const curve=new THREE.TorusGeometry(domeRadius,.075,8,42,Math.PI/2);
  const rmesh=mesh(curve,ribMat);
  rmesh.rotation.z=Math.PI/2;
  rmesh.rotation.y=a;
  rmesh.castShadow=false;
  rib.add(rmesh);
  domeGroup.add(rib);
}
for(let y=1.1;y<8.5;y+=1.45){
  const ring=torus(domeRadius+.025,.06,ribMat,0,y,0);
  ring.rotation.x=Math.PI/2;
  ring.castShadow=false;
  domeGroup.add(ring);
}

const slitFrameMat=mat(0x75858a,.35,.78);
for(const a of [slitA,slitB]){
  const rail=box(.13,14.2,.16,slitFrameMat,Math.sin(a)*10.7,7.4,Math.cos(a)*10.7);
  rail.rotation.y=-a;
  domeGroup.add(rail);
}
const slitTop=box(7.3,.18,.18,slitFrameMat,0,14.0,0);
slitTop.rotation.z=Math.PI/2;
domeGroup.add(slitTop);

const baseMetal=mat(0x26353c,.33,.88);
const darkMetal=mat(0x10191f,.28,.9);
const brass=mat(0xb18a46,.3,.8);
const whitePaint=mat(0xd4d5c8,.4,.38);
const blackGlass=mat(0x071116,.16,.75);

const mount=new THREE.Group();
mount.position.set(0,0,0);
scene.add(mount);

mount.add(cylinder(2.08,2.38,.38,darkMetal,0,.12,0,48));
mount.add(cylinder(1.8,1.96,.28,brass,0,.45,0,48));
mount.add(cylinder(1.45,1.65,1.3,baseMetal,0,1.2,0,48));
mount.add(cylinder(.96,1.35,.42,darkMetal,0,2.06,0,40));

const equatorial=new THREE.Group();
equatorial.position.y=2.3;
equatorial.rotation.z=.44;
mount.add(equatorial);

const polar=cylinder(.33,.33,4.0,baseMetal,0,0,0,32);
polar.rotation.z=Math.PI/2;
equatorial.add(polar);
const axisEndL=cylinder(.42,.42,.32,brass,-2.13,0,0,32);
axisEndL.rotation.z=Math.PI/2;
equatorial.add(axisEndL);
const axisEndR=cylinder(.42,.42,.32,brass,2.13,0,0,32);
axisEndR.rotation.z=Math.PI/2;
equatorial.add(axisEndR);
const decAxis=cylinder(.29,.29,2.45,darkMetal,0,.18,0,32);
equatorial.add(decAxis);
decAxis.rotation.z=Math.PI/2;
const declination=new THREE.Group();
declination.position.set(0,.18,0);
equatorial.add(declination);

const counterArm=mesh(new THREE.CylinderGeometry(.13,.13,3.6,20),darkMetal,0,-1.55,0);
declination.add(counterArm);
const counterWeight=cylinder(.68,.68,.48,baseMetal,0,-3.15,0,40);
declination.add(counterWeight);
const counterBand=torus(.69,.07,brass,0,-3.15,0);
counterBand.rotation.x=Math.PI/2;
declination.add(counterBand);

const telescopePivot=new THREE.Group();
telescopePivot.position.y=.85;
declination.add(telescopePivot);
telescopePivot.rotation.z=-.16;

const tubeGroup=new THREE.Group();
tubeGroup.rotation.z=Math.PI/2-.42;
telescopePivot.add(tubeGroup);

const tube=mesh(new THREE.CylinderGeometry(.55,.68,7.2,48),whitePaint,0,0,0);
tube.rotation.z=Math.PI/2;
tubeGroup.add(tube);
const tubeStripe=torus(.684,.08,brass,0,0,0);
tubeStripe.rotation.y=Math.PI/2;
tubeStripe.position.x=-2.6;
tubeGroup.add(tubeStripe);
const tubeStripe2=torus(.559,.045,darkMetal,0,0,0);
tubeStripe2.rotation.y=Math.PI/2;
tubeStripe2.position.x=2.7;
tubeGroup.add(tubeStripe2);

const dewShield=mesh(new THREE.CylinderGeometry(.78,.72,1.25,48,1,true),whitePaint,0,0,0);
dewShield.rotation.z=Math.PI/2;
dewShield.position.x=4.12;
tubeGroup.add(dewShield);
const lens=mesh(new THREE.CircleGeometry(.715,48),blackGlass,4.76,0,0);
lens.rotation.y=Math.PI/2;
tubeGroup.add(lens);
const lensGlow=mesh(new THREE.CircleGeometry(.59,48),new THREE.MeshBasicMaterial({color:0x7ba7ba,transparent:true,opacity:.48}),4.77,0,0);
lensGlow.rotation.y=Math.PI/2;
tubeGroup.add(lensGlow);

const focuser=mesh(new THREE.CylinderGeometry(.33,.48,1.05,32),darkMetal,-4.0,0,0);
focuser.rotation.z=Math.PI/2;
tubeGroup.add(focuser);
const eyepiece=mesh(new THREE.CylinderGeometry(.19,.25,.72,24),brass,-4.78,0,0);
eyepiece.rotation.z=Math.PI/2;
tubeGroup.add(eyepiece);
for(const y of [-.77,.77]){
  const wheel=torus(.46,.06,brass,-2.55,y*.08,0);
  wheel.rotation.y=Math.PI/2;
  wheel.position.x=-2.48;
  wheel.position.y=y;
  tubeGroup.add(wheel);
}
const finder=new THREE.Group();
finder.position.set(.65,.72,0);
tubeGroup.add(finder);
const finderTube=mesh(new THREE.CylinderGeometry(.14,.18,2.35,24),baseMetal);
finderTube.rotation.z=Math.PI/2;
finder.add(finderTube);
const finderLens=mesh(new THREE.CircleGeometry(.145,24),new THREE.MeshBasicMaterial({color:0x6fa6be}),1.18,0,0);
finderLens.rotation.y=Math.PI/2;finder.add(finderLens);

const motor=cylinder(.37,.37,.78,darkMetal,1.55,-.35,0,24);
motor.rotation.z=Math.PI/2;equatorial.add(motor);
const driveGlow=mesh(new THREE.CircleGeometry(.12,20),new THREE.MeshBasicMaterial({color:0x6ed5d1}),1.96,-.35,0);
driveGlow.rotation.y=Math.PI/2;equatorial.add(driveGlow);

const catwalkMat=mat(0x35454b,.48,.75);
const catwalk=mesh(new THREE.RingGeometry(7.55,8.7,72),catwalkMat,0,3.35,0);
catwalk.rotation.x=-Math.PI/2;
scene.add(catwalk);
for(let i=0;i<60;i++){
  const a=i/60*Math.PI*2;
  const r=8.12;
  const tread=box(.075,.035,.95,brass,Math.cos(a)*r,3.39,Math.sin(a)*r);
  tread.rotation.y=-a;
  scene.add(tread);
}
for(const r of [7.52,8.72]){
  const rail=torus(r,.055,ribMat,0,4.4,0);
  rail.rotation.x=Math.PI/2;scene.add(rail);
}
for(let i=0;i<28;i++){
  const a=i/28*Math.PI*2;
  for(const r of [7.52,8.72]){
    const post=box(.06,1.02,.06,r*Math.cos(a),3.89,r*Math.sin(a));
    scene.add(post);
  }
}
for(let i=0;i<9;i++){
  const a=i/9*Math.PI*2;
  const column=cylinder(.13,.19,3.2,baseMetal,7.95,1.55,0,20);
  column.position.x=7.95*Math.cos(a);column.position.z=7.95*Math.sin(a);
  scene.add(column);
}

const desk=new THREE.Group();
desk.position.set(-5.15,0,-4.35);
desk.rotation.y=.62;
scene.add(desk);
const wood=mat(0x4b3021,.62,.15);
const woodDark=mat(0x241812,.7,.1);
desk.add(box(4.4,.28,1.55,wood,0,2.28,0));
desk.add(box(4.4,1.8,.14,woodDark,0,1.37,.69));
for(const x of [-1.85,1.85]) for(const z of [-.53,.53]) desk.add(box(.18,2.2,.18,wood,x,1.1,z));
const panel=box(3.7,.13,1.03,darkMetal,0,2.46,-.05);
panel.rotation.x=-.12;desk.add(panel);

const dialLights=[];
for(let i=0;i<12;i++){
  const x=-1.48+(i%6)*.59, z=-.25+Math.floor(i/6)*.45;
  const ring=torus(.16,.045,brass,x,2.55,z);
  ring.rotation.x=-Math.PI/2+.12;desk.add(ring);
  const glow=mesh(new THREE.CircleGeometry(.105,20),new THREE.MeshBasicMaterial({color:i%3===0?0xffbc5c:0x77d6ce}),x,2.56,z);
  glow.rotation.x=-Math.PI/2+.12;desk.add(glow);dialLights.push(glow);
}
for(let i=0;i<5;i++){
  const lever=box(.05,.38,.05,brass,-1.35+i*.68,2.71,.48);
  lever.rotation.x=.38;desk.add(lever);
}
const monitor=box(1.15,.73,.09,blackGlass,1.18,3.08,-.28);
monitor.rotation.x=-.2;desk.add(monitor);
const screen=mesh(new THREE.PlaneGeometry(1.01,.59),new THREE.MeshBasicMaterial({color:0x1f7280}),1.18,3.08,-.335);
screen.rotation.x=-.2;desk.add(screen);

function chartTexture(index){
  return makeCanvasTexture((ctx,w,h)=>{
    ctx.fillStyle="#d9d0b0";ctx.fillRect(0,0,w,h);
    for(let i=0;i<350;i++){
      ctx.fillStyle=`rgba(80,55,35,${range(.02,.1)})`;
      ctx.fillRect(rand()*w,rand()*h,1,1);
    }
    ctx.strokeStyle="#425265";ctx.lineWidth=2;
    for(let i=0;i<24;i++){
      const x=range(35,w-35),y=range(35,h-35);
      ctx.beginPath();ctx.arc(x,y,range(8,38),0,Math.PI*2);ctx.stroke();
    }
    ctx.fillStyle="#273747";
    for(let i=0;i<70;i++){
      const x=range(20,w-20),y=range(20,h-20);
      ctx.beginPath();ctx.arc(x,y,range(1,3),0,Math.PI*2);ctx.fill();
    }
    ctx.font="18px Georgia";ctx.fillText("CELESTIAL ATLAS "+(index+1),28,38);
  },256,320);
}
for(let i=0;i<6;i++){
  const a=2.1+i*.62;
  const p=new THREE.Group();
  p.position.set(Math.cos(a)*10.95,4.5,Math.sin(a)*10.95);
  p.lookAt(0,4.5,0);
  const paper=mesh(new THREE.PlaneGeometry(1.15,1.44),new THREE.MeshStandardMaterial({map:chartTexture(i),roughness:.88}),0,0,0);
  p.add(paper);
  for(const x of [-.5,.5]) for(const y of [-.64,.64]){
    const pin=mesh(new THREE.SphereGeometry(.055,12,8),brass,x,y,.03);p.add(pin);
  }
  scene.add(p);
}

const shelfMat=mat(0x34261d,.62,.12);
function bookcase(x,z,rot){
  const s=new THREE.Group();s.position.set(x,1.82,z);s.rotation.y=rot;scene.add(s);
  s.add(box(2.25,3.64,.38,shelfMat,0,0,0));
  for(let y=-1.42;y<1.55;y+=.75)s.add(box(2.12,.1,.55,woodDark,0,y,.1));
  for(let row=0;row<4;row++){
    let px=-.92;
    while(px<.93){
      const bw=range(.11,.24), bh=range(.4,.62);
      const b=box(bw,bh,.32,mat(new THREE.Color().setHSL(range(.03,.12),range(.25,.55),range(.18,.42)),.75),px+bw/2,-1.1+row*.75,.01);
      s.add(b);px+=bw+.025;
    }
  }
  return s;
}
bookcase(7.65,-5.5,-.7);
bookcase(-8.15,3.7,.95);

const ladder=new THREE.Group();
ladder.position.set(7.2,0,1.55);ladder.rotation.z=-.22;ladder.rotation.y=-.9;scene.add(ladder);
for(const x of [-.46,.46])ladder.add(box(.1,5.1,.1,brass,x,2.55,0));
for(let y=.4;y<4.9;y+=.55)ladder.add(box(1.02,.07,.09,brass,0,y,0));

const globeStand=new THREE.Group();
globeStand.position.set(-4.8,0,5.8);scene.add(globeStand);
globeStand.add(cylinder(.07,.1,2.0,brass,0,1,0,16));
globeStand.add(cylinder(.55,.74,.16,woodDark,0,.1,0,24));
const globe=mesh(new THREE.SphereGeometry(.72,32,20),new THREE.MeshStandardMaterial({color:0x284c5c,roughness:.45,metalness:.15}),0,2.13,0);
globeStand.add(globe);
const globeRing=torus(.78,.04,brass,0,2.13,0);globeRing.rotation.x=.48;globeStand.add(globeRing);

for(let i=0;i<14;i++){
  const a=range(0,Math.PI*2), r=range(2.5,10);
  const crate=box(range(.35,.8),range(.15,.34),range(.35,.8),wood,Math.cos(a)*r,.15,Math.sin(a)*r);
  crate.rotation.y=range(0,Math.PI);
  scene.add(crate);
}

const warm=new THREE.PointLight(0xffc77b,90,18,2);
warm.position.set(-4.2,6.8,-2.7);warm.castShadow=true;warm.shadow.mapSize.set(1024,1024);scene.add(warm);
const cool=new THREE.PointLight(0x77b9e8,72,20,2);
cool.position.set(2.8,9.4,2);cool.castShadow=true;cool.shadow.mapSize.set(1024,1024);scene.add(cool);
const domeLight=new THREE.HemisphereLight(0x7faad8,0x252018,1.25);scene.add(domeLight);
const slitLight=new THREE.SpotLight(0x92c7ff,165,30,.5,.52,1.4);
slitLight.position.set(0,13.5,9.5);slitLight.target.position.set(0,2.6,0);slitLight.castShadow=true;scene.add(slitLight,slitLight.target);

const hangingLamp=new THREE.Group();
hangingLamp.position.set(-1.5,9.8,-2.8);scene.add(hangingLamp);
hangingLamp.add(box(.06,3.0,.06,darkMetal,0,1.5,0));
const shade=mesh(new THREE.ConeGeometry(.72,.38,32,1,true),brass,0,.12,0);hangingLamp.add(shade);
const bulb=mesh(new THREE.SphereGeometry(.25,18,12),emissive(0xffd58a,1.8),0,-.06,0);hangingLamp.add(bulb);
const lampLight=new THREE.PointLight(0xffcc82,30,8,2);lampLight.position.set(0,-.12,0);hangingLamp.add(lampLight);

const dust=[];
const dustMat=new THREE.PointsMaterial({color:0xb7d9df,size:.035,transparent:true,opacity:.4,depthWrite:false});
const dustGeo=new THREE.BufferGeometry();
const dustPos=[];
for(let i=0;i<700;i++)dustPos.push(range(-10,10),range(.2,12),range(-10,10));
dustGeo.setAttribute("position",new THREE.Float32BufferAttribute(dustPos,3));
const dustPoints=new THREE.Points(dustGeo,dustMat);scene.add(dustPoints);

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  equatorial.rotation.y=Math.sin(t*.1)*.018;
  telescopePivot.rotation.y=Math.sin(t*.11)*.035;
  tubeGroup.rotation.z=Math.PI/2-.42+Math.sin(t*.095)*.018;
  sky.rotation.y=.42+t*.0025;
  globe.rotation.y=t*.09;
  hangingLamp.rotation.z=Math.sin(t*.65)*.025;
  dialLights.forEach((d,i)=>d.material.color.setHex((Math.sin(t*1.8+i*.87)>.15)?(i%3===0?0xffc05e:0x74dfd2):0x183235));
  dustPoints.rotation.y=t*.006;
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
