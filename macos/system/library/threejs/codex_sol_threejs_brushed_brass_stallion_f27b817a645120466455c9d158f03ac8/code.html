<script type="importmap">
{
  "imports": {

<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171411);
scene.fog = new THREE.FogExp2(0x171411, 0.027);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(10.5, 7.1, 12.5);
camera.lookAt(0, 3.35, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.35, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.72;
controls.minDistance = 8;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.49;

function brushedTexture() {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#b0b0b0';
  ctx.fillRect(0, 0, size, size);
  const image = ctx.getImageData(0, 0, size, size);
  const data = image.data;
  let seed = 872341;
  const random = () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };
  const bands = new Float32Array(size);
  let value = 0;
  for (let y = 0; y < size; y++) {
    value = value * 0.76 + (random() - 0.5) * 28;
    bands[y] = value;
  }
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const i = (y * size + x) * 4;
      const streak = bands[y] + (random() - 0.5) * 12 + Math.sin(x * 0.12 + y * 0.025) * 2;
      const c = Math.max(42, Math.min(220, 128 + streak));
      data[i] = c;
      data[i + 1] = c;
      data[i + 2] = c;
      data[i + 3] = 255;
    }
  }
  ctx.putImageData(image, 0, 0);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(3.5, 7);
  texture.colorSpace = THREE.NoColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const grain = brushedTexture();

const brass = new THREE.MeshPhysicalMaterial({
  color: 0xb67a2c,
  metalness: 1,
  roughness: 0.31,
  bumpMap: grain,
  bumpScale: 0.018,
  clearcoat: 0.12,
  clearcoatRoughness: 0.28
});

const brassDark = new THREE.MeshPhysicalMaterial({
  color: 0x76501f,
  metalness: 1,
  roughness: 0.43,
  bumpMap: grain,
  bumpScale: 0.022
});

const patina = new THREE.MeshStandardMaterial({
  color: 0x302b1e,
  metalness: 0.82,
  roughness: 0.5
});

const edgeBrass = new THREE.MeshPhysicalMaterial({
  color: 0xc8923d,
  metalness: 1,
  roughness: 0.27,
  side: THREE.DoubleSide
});

const sculpture = new THREE.Group();
sculpture.rotation.y = -0.08;
scene.add(sculpture);

function castShadow(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function ellipsoid(name, position, scale, material = brass, segments = 40) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(1, segments, Math.max(18, Math.floor(segments * 0.65))),
    material
  );
  mesh.name = name;
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  sculpture.add(mesh);
  return castShadow(mesh);
}

function segment(name, start, end, radiusA, radiusB, material = brass, radial = 24) {
  const a = start.clone();
  const b = end.clone();
  const direction = b.clone().sub(a);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(radiusB, radiusA, length, radial, 2, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  sculpture.add(mesh);
  castShadow(mesh);
  return mesh;
}

function joint(position, radius, material = brass) {
  return ellipsoid('joint', position, new THREE.Vector3(radius, radius, radius), material, 28);
}

function tube(points, radius, material, segments = 48, radial = 8) {
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, segments, radius, radial, false), material);
  sculpture.add(mesh);
  return castShadow(mesh);
}

function ribbon(points, widths, material = edgeBrass) {
  const curve = new THREE.CatmullRomCurve3(points);
  const samples = 32;
  const positions = [];
  const indices = [];
  const up = new THREE.Vector3(0, 0, 1);
  for (let i = 0; i <= samples; i++) {
    const t = i / samples;
    const p = curve.getPoint(t);
    const tangent = curve.getTangent(t);
    let side = new THREE.Vector3().crossVectors(tangent, up);
    if (side.lengthSq() < 0.0001) side.set(0, 1, 0);
    side.normalize();
    const widthIndex = t * (widths.length - 1);
    const low = Math.floor(widthIndex);
    const high = Math.min(widths.length - 1, low + 1);
    const blend = widthIndex - low;
    const width = THREE.MathUtils.lerp(widths[low], widths[high], blend);
    const wave = Math.sin(t * Math.PI * 5) * 0.045;
    const left = p.clone().addScaledVector(side, width).addScaledVector(up, wave);
    const right = p.clone().addScaledVector(side, -width).addScaledVector(up, -wave);
    positions.push(left.x, left.y, left.z, right.x, right.y, right.z);
    if (i < samples) {
      const n = i * 2;
      indices.push(n, n + 2, n + 1, n + 2, n + 3, n + 1);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  sculpture.add(mesh);
  return castShadow(mesh);
}

const body = ellipsoid(
  'powerful barrel',
  new THREE.Vector3(-0.25, 3.72, 0),
  new THREE.Vector3(1.72, 1.03, 0.76)
);
body.rotation.z = 0.19;

ellipsoid('chest', new THREE.Vector3(0.9, 4.15, 0), new THREE.Vector3(0.85, 1.1, 0.72));
ellipsoid('hindquarter', new THREE.Vector3(-1.42, 3.55, 0), new THREE.Vector3(1.02, 1.08, 0.79));
ellipsoid('shoulder highlight', new THREE.Vector3(0.72, 4.22, 0.58), new THREE.Vector3(0.57, 0.72, 0.22), brassDark);
ellipsoid('haunch highlight', new THREE.Vector3(-1.43, 3.63, 0.61), new THREE.Vector3(0.66, 0.75, 0.24), brassDark);

segment('lower neck', new THREE.Vector3(0.6, 4.25, 0), new THREE.Vector3(1.16, 5.45, 0), 0.72, 0.48);
ellipsoid('arched neck', new THREE.Vector3(1.0, 5.05, 0), new THREE.Vector3(0.7, 1.25, 0.58));
ellipsoid('neck crest', new THREE.Vector3(0.7, 5.25, 0), new THREE.Vector3(0.55, 1.02, 0.52), brassDark);

const head = ellipsoid(
  'head',
  new THREE.Vector3(1.55, 6.15, 0),
  new THREE.Vector3(0.48, 0.72, 0.43)
);
head.rotation.z = -0.46;

const muzzle = ellipsoid(
  'muzzle',
  new THREE.Vector3(1.98, 6.03, 0),
  new THREE.Vector3(0.57, 0.34, 0.39),
  brassDark
);
muzzle.rotation.z = -0.1;

ellipsoid('nostril left', new THREE.Vector3(2.38, 6.08, 0.23), new THREE.Vector3(0.09, 0.055, 0.035), patina, 20);
ellipsoid('nostril right', new THREE.Vector3(2.38, 6.08, -0.23), new THREE.Vector3(0.09, 0.055, 0.035), patina, 20);
ellipsoid('eye left', new THREE.Vector3(1.71, 6.47, 0.39), new THREE.Vector3(0.07, 0.07, 0.035), patina, 20);
ellipsoid('eye right', new THREE.Vector3(1.71, 6.47, -0.39), new THREE.Vector3(0.07, 0.07, 0.035), patina, 20);

function ear(position, rotationZ, zScale) {
  const earMesh = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.55, 16), brassDark);
  earMesh.position.copy(position);
  earMesh.rotation.z = rotationZ;
  earMesh.scale.z = zScale;
  sculpture.add(earMesh);
  castShadow(earMesh);
}
ear(new THREE.Vector3(1.15, 6.78, 0.26), -0.24, 0.7);
ear(new THREE.Vector3(1.15, 6.78, -0.26), -0.24, 0.7);

const leftHindHip = new THREE.Vector3(-1.38, 3.46, 0.48);
const leftHindKnee = new THREE.Vector3(-1.18, 2.15, 0.52);
const leftHindFetlock = new THREE.Vector3(-1.53, 0.83, 0.5);
const leftHindHoof = new THREE.Vector3(-1.42, 0.48, 0.5);
segment('left rear thigh', leftHindHip, leftHindKnee, 0.42, 0.29);
joint(leftHindKnee, 0.31, brassDark);
segment('left rear cannon', leftHindKnee, leftHindFetlock, 0.25, 0.14);
segment('left rear pastern', leftHindFetlock, leftHindHoof, 0.15, 0.19, brassDark);
const hoofL = ellipsoid('left rear hoof', new THREE.Vector3(-1.34, 0.37, 0.5), new THREE.Vector3(0.38, 0.22, 0.31), patina);
hoofL.rotation.z = -0.09;

const rightHindHip = new THREE.Vector3(-1.35, 3.43, -0.46);
const rightHindKnee = new THREE.Vector3(-0.72, 2.2, -0.48);
const rightHindFetlock = new THREE.Vector3(-0.58, 0.86, -0.43);
const rightHindHoof = new THREE.Vector3(-0.45, 0.49, -0.42);
segment('right rear thigh', rightHindHip, rightHindKnee, 0.41, 0.28);
joint(rightHindKnee, 0.3, brassDark);
segment('right rear cannon', rightHindKnee, rightHindFetlock, 0.24, 0.14);
segment('right rear pastern', rightHindFetlock, rightHindHoof, 0.15, 0.2, brassDark);
const hoofR = ellipsoid('right rear hoof', new THREE.Vector3(-0.34, 0.38, -0.42), new THREE.Vector3(0.39, 0.22, 0.3), patina);
hoofR.rotation.z = -0.08;

const foreA0 = new THREE.Vector3(0.76, 4.38, 0.52);
const foreA1 = new THREE.Vector3(1.62, 3.65, 0.6);
const foreA2 = new THREE.Vector3(2.13, 3.97, 0.61);
const foreA3 = new THREE.Vector3(2.49, 3.77, 0.6);
segment('raised forearm left', foreA0, foreA1, 0.32, 0.22);
joint(foreA1, 0.25, brassDark);
segment('folded cannon left', foreA1, foreA2, 0.2, 0.12);
segment('left front pastern', foreA2, foreA3, 0.13, 0.17, brassDark);
const frontHoofL = ellipsoid('left front hoof', new THREE.Vector3(2.65, 3.68, 0.6), new THREE.Vector3(0.35, 0.2, 0.25), patina);
frontHoofL.rotation.z = -0.24;

const foreB0 = new THREE.Vector3(0.62, 4.34, -0.5);
const foreB1 = new THREE.Vector3(1.34, 3.46, -0.58);
const foreB2 = new THREE.Vector3(1.75, 3.1, -0.62);
const foreB3 = new THREE.Vector3(2.12, 3.18, -0.62);
segment('raised forearm right', foreB0, foreB1, 0.31, 0.21);
joint(foreB1, 0.24, brassDark);
segment('folded cannon right', foreB1, foreB2, 0.19, 0.12);
segment('right front pastern', foreB2, foreB3, 0.13, 0.17, brassDark);
const frontHoofR = ellipsoid('right front hoof', new THREE.Vector3(2.28, 3.2, -0.62), new THREE.Vector3(0.35, 0.2, 0.25), patina);
frontHoofR.rotation.z = 0.12;

ribbon(
  [
    new THREE.Vector3(0.75, 6.05, 0.03),
    new THREE.Vector3(0.25, 5.72, 0.04),
    new THREE.Vector3(-0.12, 5.18, 0.05),
    new THREE.Vector3(-0.42, 4.57, 0.05),
    new THREE.Vector3(-0.85, 4.25, 0.03)
  ],
  [0.13, 0.28, 0.38, 0.28, 0.04]
);

ribbon(
  [
    new THREE.Vector3(0.55, 5.9, -0.07),
    new THREE.Vector3(-0.05, 5.62, -0.08),
    new THREE.Vector3(-0.48, 5.07, -0.08),
    new THREE.Vector3(-0.92, 4.7, -0.07)
  ],
  [0.08, 0.23, 0.3, 0.02],
  brassDark
);

const maneStrands = [
  [new THREE.Vector3(0.25,5.75,0.1),new THREE.Vector3(-0.35,5.8,0.15),new THREE.Vector3(-0.78,5.47,0.18)],
  [new THREE.Vector3(0.05,5.42,-0.04),new THREE.Vector3(-0.57,5.45,-0.12),new THREE.Vector3(-1.0,5.08,-0.14)],
  [new THREE.Vector3(-0.12,5.05,0.08),new THREE.Vector3(-0.67,5.05,0.19),new THREE.Vector3(-1.14,4.72,0.22)]
];
for (const strand of maneStrands) tube(strand, 0.055, brassDark, 28, 6);

const tailRoot = new THREE.Vector3(-2.2, 3.64, 0);
const tailCurves = [
  [tailRoot,new THREE.Vector3(-2.8,3.72,0.12),new THREE.Vector3(-3.45,3.2,0.24),new THREE.Vector3(-3.85,2.42,0.3)],
  [tailRoot,new THREE.Vector3(-2.85,3.48,-0.16),new THREE.Vector3(-3.55,2.95,-0.32),new THREE.Vector3(-4.05,2.3,-0.24)],
  [tailRoot,new THREE.Vector3(-2.73,3.95,0.28),new THREE.Vector3(-3.35,3.6,0.52),new THREE.Vector3(-3.9,2.86,0.56)],
  [tailRoot,new THREE.Vector3(-2.86,3.34,0.28),new THREE.Vector3(-3.38,2.72,0.5),new THREE.Vector3(-3.65,2.0,0.42)],
  [tailRoot,new THREE.Vector3(-2.72,3.82,-0.27),new THREE.Vector3(-3.32,3.44,-0.53),new THREE.Vector3(-3.82,2.75,-0.55)],
  [tailRoot,new THREE.Vector3(-2.75,3.55,0.02),new THREE.Vector3(-3.55,3.12,0.04),new THREE.Vector3(-4.18,2.58,0.02)]
];
tailCurves.forEach((points, index) => tube(points, 0.11 - index * 0.008, index % 2 ? brassDark : edgeBrass, 52, 8));

const grooveCurves = [
  [new THREE.Vector3(-1.68,4.12,0.7),new THREE.Vector3(-1.2,4.42,0.76),new THREE.Vector3(-0.65,4.44,0.74)],
  [new THREE.Vector3(-1.82,3.5,0.72),new THREE.Vector3(-1.35,3.18,0.78),new THREE.Vector3(-0.85,3.2,0.73)],
  [new THREE.Vector3(-0.45,3.25,0.71),new THREE.Vector3(0.15,3.04,0.7),new THREE.Vector3(0.58,3.32,0.65)],
  [new THREE.Vector3(0.72,4.66,0.58),new THREE.Vector3(1.0,4.92,0.55),new THREE.Vector3(1.18,5.25,0.47)]
];
grooveCurves.forEach(points => tube(points, 0.022, patina, 24, 5));

const baseMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x523517,
  metalness: 0.94,
  roughness: 0.34,
  bumpMap: grain,
  bumpScale: 0.018
});
const base = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 0.34, 72), baseMaterial);
base.scale.set(3.25, 1, 1.55);
base.position.y = 0.16;
sculpture.add(base);
castShadow(base);

const baseTop = new THREE.Mesh(
  new THREE.CylinderGeometry(1, 1, 0.1, 72),
  new THREE.MeshPhysicalMaterial({ color: 0x9a6728, metalness: 1, roughness: 0.27 })
);
baseTop.scale.set(3.05, 1, 1.42);
baseTop.position.y = 0.36;
sculpture.add(baseTop);
castShadow(baseTop);

const baseRing = new THREE.Mesh(
  new THREE.TorusGeometry(1, 0.045, 10, 96),
  brassDark
);
baseRing.rotation.x = Math.PI / 2;
baseRing.scale.set(3.1, 1.46, 1);
baseRing.position.y = 0.42;
sculpture.add(baseRing);
castShadow(baseRing);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(18, 96),
  new THREE.MeshStandardMaterial({ color: 0x201b16, roughness: 0.92, metalness: 0.05 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.025;
ground.receiveShadow = true;
scene.add(ground);

scene.add(new THREE.HemisphereLight(0xffe1ae, 0x16171b, 1.35));

const key = new THREE.DirectionalLight(0xffd49a, 5.2);
key.position.set(6, 10, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 9;
key.shadow.camera.bottom = -2;
key.shadow.camera.near = 1;
key.shadow.camera.far = 30;
key.shadow.bias = -0.0003;
scene.add(key);

const rim = new THREE.DirectionalLight(0xffa63d, 3.8);
rim.position.set(-8, 6, -7);
scene.add(rim);

const fill = new THREE.DirectionalLight(0xc9dcff, 2.25);
fill.position.set(4, 4, -8);
scene.add(fill);

const warmSpot = new THREE.SpotLight(0xffc36b, 120, 24, Math.PI / 7, 0.6, 1.5);
warmSpot.position.set(-3, 11, 4);
warmSpot.target.position.set(-0.5, 3.4, 0);
scene.add(warmSpot, warmSpot.target);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  warmSpot.intensity = 118 + Math.sin(elapsed * 0.55) * 5;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
