<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Holographic Earth Globe</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #05070c; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  .hud-label {
    position: fixed;
    left: 18px;
    bottom: 16px;
    font-family: "SFMono-Regular", ui-monospace, Menlo, Consolas, monospace;
    font-size: 11px;
    letter-spacing: 0.28em;
    color: rgba(120, 224, 255, 0.55);
    text-transform: uppercase;
    text-shadow: 0 0 12px rgba(60, 200, 255, 0.45);
    pointer-events: none;
    user-select: none;
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud-label">// ORBITAL PROJECTION · SYS.TERRA · LIVE</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ *
 *  Renderer
 * ------------------------------------------------------------------ */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

/* ------------------------------------------------------------------ *
 *  Scene, camera, controls
 * ------------------------------------------------------------------ */
const scene = new THREE.Scene();

function makeBackground() {
  const c = document.createElement('canvas');
  c.width = 16; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0.0, '#04060a');
  g.addColorStop(0.55, '#06090f');
  g.addColorStop(1.0, '#0b121b');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 16, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
scene.background = makeBackground();

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3.7, 1.35, 4.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.target.set(0, -0.35, 0);
controls.minDistance = 3.0;
controls.maxDistance = 12.0;
controls.maxPolarAngle = Math.PI * 0.6;

/* ------------------------------------------------------------------ *
 *  Lighting (hemisphere fill + key/fill/rim directionals)
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0x2b4a66, 0x02040a, 0.55);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xbfe4ff, 1.15);
keyLight.position.set(4.5, 7.5, 3.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 26;
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -5;
keyLight.shadow.bias = -0.0006;
keyLight.shadow.radius = 4;
keyLight.target.position.set(0, -1.9, 0);
scene.add(keyLight);
scene.add(keyLight.target);

const fillLight = new THREE.DirectionalLight(0x2c5378, 0.4);
fillLight.position.set(-5, 2.5, 3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x1f9fe0, 0.55);
rimLight.position.set(-2.5, 3.5, -5);
scene.add(rimLight);

/* ------------------------------------------------------------------ *
 *  Ground plane — only receives shadows
 * ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.55 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -2.06;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ *
 *  THE ONE OBJECT — holographic Earth
 * ------------------------------------------------------------------ */
const hologram = new THREE.Group();
scene.add(hologram);

const globeSpin = new THREE.Group();   // wireframe + continents (self-rotates)
hologram.add(globeSpin);

const R = 1.15;
const CY = 0x2ad4f5;

// lon/lat -> point on sphere
function ll(lon, lat, r) {
  const phi = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon);
  return new THREE.Vector3(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.cos(phi),
    r * Math.sin(phi) * Math.sin(theta)
  );
}

/* ---- lat / long wireframe grid ---- */
const gridMat = new THREE.LineBasicMaterial({
  color: 0x2ad4f5, transparent: true, opacity: 0.24,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const eqMat = new THREE.LineBasicMaterial({
  color: 0x6ff0ff, transparent: true, opacity: 0.5,
  blending: THREE.AdditiveBlending, depthWrite: false
});

for (let lat = -75; lat <= 75; lat += 15) {
  const pts = [];
  for (let lon = 0; lon <= 360; lon += 4) pts.push(ll(lon, lat, R));
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  globeSpin.add(new THREE.Line(geo, lat === 0 ? eqMat : gridMat));
}
for (let lon = 0; lon < 360; lon += 30) {
  const pts = [];
  for (let lat = -90; lat <= 90; lat += 4) pts.push(ll(lon, lat, R));
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  globeSpin.add(new THREE.Line(geo, lon === 0 ? eqMat : gridMat));
}

/* ---- faint continent outlines (simplified, procedural) ---- */
const continents = [
  // North America
  [-166,65,-160,71,-140,70,-125,70,-110,68,-95,68,-82,73,-78,63,-80,56,-76,52,-64,60,-56,52,-60,47,-66,44,-70,42,-74,40,-76,36,-81,31,-80,25,-83,28,-90,29,-94,29,-97,26,-97,21,-90,19,-87,16,-84,10,-83,9,-88,15,-94,16,-105,20,-110,24,-114,28,-117,33,-122,37,-124,41,-124,48,-130,54,-140,60,-150,59,-160,58,-166,65],
  // South America
  [-78,8,-72,11,-62,10,-52,5,-50,0,-44,-2,-38,-6,-35,-8,-39,-13,-41,-20,-48,-25,-53,-34,-58,-38,-62,-41,-66,-45,-68,-50,-71,-54,-74,-50,-73,-43,-73,-37,-71,-30,-70,-23,-71,-18,-76,-14,-81,-6,-80,-2,-79,2,-78,8],
  // Africa
  [-6,36,2,37,10,34,20,32,25,32,34,31,43,12,51,12,43,4,41,-4,40,-10,35,-18,32,-26,26,-34,20,-35,15,-28,12,-17,9,-1,9,4,-4,5,-8,4,-13,8,-16,14,-17,21,-13,28,-10,30,-6,36],
  // Europe
  [-9,38,-9,43,-2,44,-1,49,2,51,6,53,8,57,5,60,10,64,14,68,20,70,26,71,28,68,24,60,22,57,19,54,20,50,24,48,28,45,27,42,24,40,20,40,16,42,14,45,12,44,8,44,3,43,-4,43,-9,38],
  // Asia
  [26,66,40,68,55,68,68,73,80,73,95,76,110,74,130,72,145,72,160,70,170,68,178,66,172,60,162,60,155,52,143,46,135,44,130,42,127,38,122,40,121,31,117,24,110,21,106,10,104,9,100,8,98,8,99,14,95,16,91,22,88,22,82,17,77,8,73,17,68,24,62,25,57,25,50,30,48,30,36,37,35,36,40,40,48,42,52,45,48,47,52,48,58,54,62,54,60,58,55,62,48,64,40,66,26,66],
  // Australia
  [113,-22,114,-26,115,-31,118,-35,123,-34,129,-32,135,-35,140,-38,147,-43,150,-38,153,-32,153,-27,149,-21,146,-19,142,-11,136,-12,132,-11,127,-14,123,-17,118,-20,113,-22],
  // Greenland
  [-45,60,-42,64,-30,68,-20,70,-18,76,-25,81,-40,83,-55,80,-58,76,-53,70,-48,64,-45,60],
  // British Isles
  [-6,50,-5,54,-8,55,-6,58,-2,58,0,54,-2,51,-6,50],
  // Japan
  [140,45,142,43,141,38,137,35,132,33,131,31,130,33,135,37,138,40,140,45],
  // Madagascar
  [49,-12,50,-16,47,-22,45,-25,44,-20,46,-16,49,-12]
];

const continentMat = new THREE.LineBasicMaterial({
  color: 0x5df3ff, transparent: true, opacity: 0.6,
  blending: THREE.AdditiveBlending, depthWrite: false
});

const nodePositions = [];
for (const c of continents) {
  const pts = [];
  for (let i = 0; i < c.length; i += 2) {
    const v = ll(c[i], c[i + 1], R * 1.004);
    pts.push(v);
    if ((i / 2) % 2 === 0) nodePositions.push(v.clone().multiplyScalar(1.001));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  globeSpin.add(new THREE.Line(geo, continentMat));
}

/* ---- glowing city / data nodes ---- */
function makeDotTexture() {
  const s = 64;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0.0, 'rgba(215,252,255,1)');
  g.addColorStop(0.3, 'rgba(120,232,255,0.9)');
  g.addColorStop(1.0, 'rgba(70,200,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const dotTex = makeDotTexture();
const nodeGeo = new THREE.BufferGeometry().setFromPoints(nodePositions);
const nodeMat = new THREE.PointsMaterial({
  color: 0x9ff6ff, size: 0.05, map: dotTex,
  transparent: true, opacity: 0.85, sizeAttenuation: true,
  blending: THREE.AdditiveBlending, depthWrite: false
});
globeSpin.add(new THREE.Points(nodeGeo, nodeMat));

/* ---- faint inner volume fill ---- */
const innerMat = new THREE.MeshBasicMaterial({
  color: 0x0a4d66, transparent: true, opacity: 0.09,
  blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.FrontSide
});
globeSpin.add(new THREE.Mesh(new THREE.SphereGeometry(R * 0.992, 48, 32), innerMat));

/* ---- fresnel atmosphere glow shell ---- */
const atmoMat = new THREE.ShaderMaterial({
  uniforms: {
    uColor: { value: new THREE.Color(0x33d6ff) },
    uPower: { value: 3.0 },
    uIntensity: { value: 0.9 }
  },
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vView;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vNormal = normalize(normalMatrix * normal);
      vView = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform vec3 uColor;
    uniform float uPower;
    uniform float uIntensity;
    varying vec3 vNormal;
    varying vec3 vView;
    void main() {
      float rim = 1.0 - abs(dot(vNormal, vView));
      float a = pow(rim, uPower) * uIntensity;
      gl_FragColor = vec4(uColor * a, a);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  side: THREE.BackSide,
  depthWrite: false
});
hologram.add(new THREE.Mesh(new THREE.SphereGeometry(R * 1.06, 64, 48), atmoMat));

/* ------------------------------------------------------------------ *
 *  HUD ring (tilted, spins slowly)
 * ------------------------------------------------------------------ */
const hud = new THREE.Group();
hud.rotation.x = THREE.MathUtils.degToRad(72);
hologram.add(hud);

const hudMat = new THREE.MeshBasicMaterial({
  color: 0x4fe6ff, transparent: true, opacity: 0.4,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const ring = new THREE.Mesh(new THREE.TorusGeometry(1.34, 0.006, 8, 160), hudMat);
hud.add(ring);

const tickPts = [];
for (let i = 0; i < 60; i++) {
  const a = (i / 60) * Math.PI * 2;
  const rin = (i % 5 === 0) ? 1.28 : 1.31;
  const rout = 1.37;
  tickPts.push(new THREE.Vector3(Math.cos(a) * rin, Math.sin(a) * rin, 0));
  tickPts.push(new THREE.Vector3(Math.cos(a) * rout, Math.sin(a) * rout, 0));
}
const tickGeo = new THREE.BufferGeometry().setFromPoints(tickPts);
hud.add(new THREE.LineSegments(tickGeo, hudMat));

/* ------------------------------------------------------------------ *
 *  Emitter base + upward light cone
 * ------------------------------------------------------------------ */
const emitterY = -1.95;

// dark tech puck
const puck = new THREE.Mesh(
  new THREE.CylinderGeometry(0.55, 0.64, 0.16, 64),
  new THREE.MeshStandardMaterial({
    color: 0x0b1319, metalness: 0.92, roughness: 0.34,
    emissive: 0x011016, emissiveIntensity: 1.0
  })
);
puck.position.y = emitterY;
puck.castShadow = true;
puck.receiveShadow = true;
hologram.add(puck);

// dark inset top
const inset = new THREE.Mesh(
  new THREE.CylinderGeometry(0.5, 0.5, 0.02, 64),
  new THREE.MeshStandardMaterial({ color: 0x060c11, metalness: 0.9, roughness: 0.5, emissive: 0x022430, emissiveIntensity: 0.8 })
);
inset.position.y = emitterY + 0.085;
hologram.add(inset);

// glowing concentric emitter rings
const ringMat = new THREE.MeshBasicMaterial({
  color: 0x40e6ff, transparent: true, opacity: 0.75,
  blending: THREE.AdditiveBlending, depthWrite: false
});
[0.22, 0.34, 0.46].forEach((rr) => {
  const t = new THREE.Mesh(new THREE.TorusGeometry(rr, 0.007, 8, 96), ringMat);
  t.rotation.x = Math.PI / 2;
  t.position.y = emitterY + 0.092;
  hologram.add(t);
});

// central emitter core
const core = new THREE.Mesh(
  new THREE.CylinderGeometry(0.05, 0.05, 0.02, 24),
  new THREE.MeshBasicMaterial({ color: 0xcaf6ff, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false })
);
core.position.y = emitterY + 0.1;
hologram.add(core);

// floor glow disc under emitter
const floorGlow = new THREE.Mesh(
  new THREE.PlaneGeometry(3.4, 3.4),
  new THREE.MeshBasicMaterial({ map: dotTex, color: 0x39c8ff, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false })
);
floorGlow.rotation.x = -Math.PI / 2;
floorGlow.position.y = -2.04;
hologram.add(floorGlow);

// bright thin projection core beam
const beam = new THREE.Mesh(
  new THREE.CylinderGeometry(0.016, 0.016, 1.66, 16, 1, true),
  new THREE.MeshBasicMaterial({ color: 0x9ff2ff, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })
);
beam.position.y = -1.03;
hologram.add(beam);

// volumetric upward light cone (narrow at emitter, wide toward globe)
const coneMat = new THREE.ShaderMaterial({
  uniforms: {
    uColor: { value: new THREE.Color(0x2fd2ff) },
    uTime: { value: 0 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uColor;
    uniform float uTime;
    varying vec2 vUv;
    void main() {
      float t = vUv.y;                                   // 0 emitter -> 1 globe
      float vertical = pow(1.0 - t, 1.6);                // brightest at source
      float scan = 0.5 + 0.5 * sin(t * 44.0 - uTime * 3.0);
      float a = vertical * (0.32 + 0.24 * scan);
      a *= smoothstep(1.0, 0.72, t);                     // fade near globe
      gl_FragColor = vec4(uColor, a * 0.7);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide,
  depthWrite: false
});
const cone = new THREE.Mesh(
  new THREE.CylinderGeometry(0.72, 0.06, 1.5, 56, 1, true),
  coneMat
);
cone.position.y = -1.12;
hologram.add(cone);

// soft point light emanating from the emitter
const emitterLight = new THREE.PointLight(0x37e6ff, 4.0, 5.5, 2.0);
emitterLight.position.set(0, emitterY + 0.35, 0);
hologram.add(emitterLight);

/* ------------------------------------------------------------------ *
 *  Animation
 * ------------------------------------------------------------------ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  // planet self-rotation + HUD spin
  globeSpin.rotation.y += dt * 0.08;
  hud.rotation.z += dt * 0.12;

  // hologram flicker
  const flick = 0.86 + 0.1 * Math.sin(t * 2.3) + 0.04 * Math.sin(t * 17.0);
  gridMat.opacity = 0.24 * flick;
  eqMat.opacity = 0.5 * flick;
  continentMat.opacity = 0.6 * flick;
  innerMat.opacity = 0.09 * flick;
  nodeMat.opacity = 0.85 * flick;
  hudMat.opacity = 0.4 * flick;
  atmoMat.uniforms.uIntensity.value = 0.9 * flick;
  coneMat.uniforms.uTime.value = t;

  // emitter pulse
  const pulse = 0.6 + 0.4 * Math.sin(t * 2.0);
  ringMat.opacity = 0.5 + 0.35 * pulse;
  emitterLight.intensity = 3.0 + 2.2 * pulse;
  core.material.opacity = 0.75 + 0.25 * pulse;

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ------------------------------------------------------------------ *
 *  Resize
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
