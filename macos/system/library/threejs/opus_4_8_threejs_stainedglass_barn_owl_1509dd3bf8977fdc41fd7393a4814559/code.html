<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stained Glass Owl</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #14151a; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    font: 12px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: rgba(235,225,205,0.5); letter-spacing: 0.14em; text-transform: uppercase;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="hint">Stained Glass Owl &nbsp;·&nbsp; drag to orbit &nbsp;·&nbsp; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14151a);
scene.fog = new THREE.Fog(0x14151a, 9, 26);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(2.1, 1.55, 4.35);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 2.2;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 1.12, 0);

/* ============================================================
   LIGHTING
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xbfd4ff, 0x2a1d12, 0.42);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff0d8, 2.5);
key.position.set(4.2, 6.2, 4.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 24;
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -2;
key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.02;
key.shadow.radius = 3;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fb4ff, 0.55);
fill.position.set(-5.0, 2.6, 3.0);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffc07a, 1.15);
rim.position.set(-2.4, 3.2, -5.6);
scene.add(rim);

// "Sun through the window": a warm light BEHIND the owl so panes glow.
const backGlow = new THREE.PointLight(0xffcf8f, 26, 14, 2.0);
backGlow.position.set(-0.35, 1.85, -2.5);
scene.add(backGlow);

const coolGlow = new THREE.PointLight(0x7fa8ff, 9, 12, 2.0);
coolGlow.position.set(1.9, 0.9, -2.0);
scene.add(coolGlow);

/* ============================================================
   SHADOW-ONLY GROUND
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   GLASS MATERIAL FACTORY
   ============================================================ */
const glassCache = new Map();
function glass(color, opts = {}) {
  const o = Object.assign({
    rough: 0.28, trans: 0.72, thick: 0.34, emis: 0.16,
    ior: 1.52, sheen: 0.0, metal: 0.0
  }, opts);
  const k = [color, o.rough, o.trans, o.thick, o.emis, o.ior, o.sheen, o.metal].join('|');
  if (glassCache.has(k)) return glassCache.get(k);
  const m = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(color),
    roughness: o.rough,
    metalness: o.metal,
    transmission: o.trans,
    thickness: o.thick,
    ior: o.ior,
    transparent: true,
    opacity: 1.0,
    clearcoat: 0.85,
    clearcoatRoughness: 0.14,
    emissive: new THREE.Color(color),
    emissiveIntensity: o.emis,
    side: THREE.DoubleSide,
    flatShading: false,
    envMapIntensity: 1.0,
    sheen: o.sheen,
    sheenColor: new THREE.Color(0xfff3dd),
    depthWrite: true
  });
  glassCache.set(k, m);
  return m;
}

// Dark soldered lead came
const cameMat = new THREE.MeshStandardMaterial({
  color: 0x14100e, roughness: 0.52, metalness: 0.72
});
const cameDarkMat = new THREE.MeshStandardMaterial({
  color: 0x0b0908, roughness: 0.45, metalness: 0.8
});

/* ---- palette ---- */
const C = {
  milk:     0xf3ece0,  // heart face
  milkWarm: 0xe7dbc4,
  amber:    0xd98a1f,
  rust:     0xa14418,
  honey:    0xe8b13c,
  deepRust: 0x7c3312,
  cream:    0xf0d9a8,
  cobalt:   0x123a9e,
  cobaltDp: 0x0a1f5e,
  beakHorn: 0x3a2a1c,
  branch:   0x2b2118,
  leafGrn:  0x2f6b3a,
  tealGl:   0x1d5f6b,
  goldPale: 0xf5cf7a
};

/* ============================================================
   GEOMETRY HELPERS
   ============================================================ */

/**
 * Build a flat "pane" from a 2D outline (array of THREE.Vector2),
 * extruded slightly, plus a came (lead) border tube following the outline.
 * Returns a Group containing the glass mesh and the came outline.
 */
function makePane(points2D, opts = {}) {
  const {
    depth = 0.035,
    bevel = 0.008,
    color = C.amber,
    matOpts = {},
    cameRadius = 0.016,
    cameColor = null,
    curveSegments = 14,
    closedCame = true,
    cameOffsetZ = 0
  } = opts;

  const g = new THREE.Group();

  const shape = new THREE.Shape(points2D);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: depth,
    bevelEnabled: bevel > 0,
    bevelThickness: bevel,
    bevelSize: bevel,
    bevelSegments: 2,
    curveSegments: curveSegments,
    steps: 1
  });
  geo.translate(0, 0, -depth / 2);
  geo.computeVertexNormals();

  const mesh = new THREE.Mesh(geo, glass(color, matOpts));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  g.add(mesh);

  // Came outline: tube along the (resampled) outline
  const pts3 = [];
  const N = points2D.length;
  for (let i = 0; i < N; i++) {
    const p = points2D[i];
    pts3.push(new THREE.Vector3(p.x, p.y, cameOffsetZ));
  }
  if (pts3.length >= 3) {
    const curve = new THREE.CatmullRomCurve3(pts3, closedCame, 'centripetal', 0.4);
    const tubularSeg = Math.max(24, Math.min(220, pts3.length * 5));
    const tube = new THREE.TubeGeometry(curve, tubularSeg, cameRadius, 6, closedCame);
    const cm = new THREE.Mesh(tube, cameColor ? new THREE.MeshStandardMaterial({
      color: cameColor, roughness: 0.5, metalness: 0.75
    }) : cameMat);
    cm.castShadow = true;
    g.add(cm);
  }

  return g;
}

/** Came line (open polyline) as a tube — for internal tracery. */
function cameLine(pts3, radius = 0.014, closed = false, mat = cameMat) {
  const curve = new THREE.CatmullRomCurve3(pts3, closed, 'centripetal', 0.35);
  const seg = Math.max(20, Math.min(200, pts3.length * 8));
  const tube = new THREE.TubeGeometry(curve, seg, radius, 6, closed);
  const m = new THREE.Mesh(tube, mat);
  m.castShadow = true;
  return m;
}

/** Ellipse outline points (2D). */
function ellipsePts(cx, cy, rx, ry, n = 28, rot = 0, jitter = 0) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    let x = Math.cos(a) * rx;
    let y = Math.sin(a) * ry;
    if (jitter) {
      const j = 1 + Math.sin(a * 3.0 + cx * 7.1) * jitter;
      x *= j; y *= j;
    }
    const xr = x * Math.cos(rot) - y * Math.sin(rot);
    const yr = x * Math.sin(rot) + y * Math.cos(rot);
    out.push(new THREE.Vector2(cx + xr, cy + yr));
  }
  return out;
}

/** Teardrop / feather-leaf outline (2D), tip at +y. */
function featherPts(len, wid, n = 26, tipSharp = 0.72, baseRound = 0.55) {
  const out = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;                       // 0 base -> 1 tip
    const y = -len * 0.5 + t * len;
    const bulge = Math.pow(Math.sin(Math.PI * Math.pow(t, baseRound)), tipSharp);
    out.push(new THREE.Vector2(wid * 0.5 * bulge, y));
  }
  for (let i = n; i >= 0; i--) {
    const t = i / n;
    const y = -len * 0.5 + t * len;
    const bulge = Math.pow(Math.sin(Math.PI * Math.pow(t, baseRound)), tipSharp);
    out.push(new THREE.Vector2(-wid * 0.5 * bulge, y));
  }
  // dedupe endpoints
  return dedupe(out);
}

function dedupe(pts) {
  const out = [];
  for (const p of pts) {
    if (out.length === 0 || out[out.length - 1].distanceTo(p) > 1e-4) out.push(p);
  }
  if (out.length > 1 && out[0].distanceTo(out[out.length - 1]) < 1e-4) out.pop();
  return out;
}

/** Rounded polygon from radial profile function. */
function radialPts(n, fn) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const r = fn(a);
    out.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r));
  }
  return out;
}

/* ============================================================
   THE OWL
   ============================================================ */
const owl = new THREE.Group();
scene.add(owl);

const bodyGroup = new THREE.Group();
owl.add(bodyGroup);

/* ---------- 1. BODY CORE (leaded barrel of glass panes) ---------- */
/*
   The torso is built as a lathe-ish "barrel" of vertical glass staves,
   each stave a separate colored pane divided by came ribs.
*/
const torso = new THREE.Group();
torso.position.y = 1.05;
bodyGroup.add(torso);

// Body silhouette profile: radius as a function of height t in [0,1] (0 = tail base, 1 = shoulders)
function bodyRadius(t) {
  // pear shaped: narrow bottom, widest at ~0.42, tapering to shoulders
  const a = Math.sin(Math.PI * (0.12 + t * 0.80));
  return 0.30 * Math.pow(a, 0.75) + 0.085 * (1.0 - t) + 0.055;
}

const BODY_H = 0.95;
const BODY_Y0 = -0.50;
const STAVES = 14;
const RINGS = 5;

const bodyPaneColors = [
  C.cream, C.honey, C.amber, C.honey, C.cream,
  C.goldPale, C.honey, C.amber, C.rust, C.amber,
  C.honey, C.cream, C.goldPale, C.honey
];

function bodySurfacePoint(u, v, inflate = 1.0) {
  // u: angle fraction [0,1), v: height fraction [0,1]
  const ang = u * Math.PI * 2;
  const y = BODY_Y0 + v * BODY_H;
  let r = bodyRadius(v) * inflate;
  // slightly flatten front-back so it reads like a bird breast
  const rx = r * 1.02;
  const rz = r * 0.90;
  // belly push forward (front is -Z .. we use +Z as front)
  const frontBias = Math.max(0, Math.cos(ang - Math.PI / 2)) * 0.03 * Math.sin(Math.PI * v);
  return new THREE.Vector3(
    Math.cos(ang) * rx,
    y,
    Math.sin(ang) * rz + frontBias
  );
}

// Build body as a set of quad-ish curved panes using Parametricish grid
const bodyPaneGeoGroup = new THREE.Group();
torso.add(bodyPaneGeoGroup);

function buildCurvedPane(u0, u1, v0, v1, color, matOpts, thickness = 0.03, seg = 6) {
  // Build a curved shell patch (double-sided) with thickness by offsetting along normal.
  const positions = [];
  const indices = [];
  const normals = [];
  const su = seg, sv = seg;

  const outer = [];
  const inner = [];
  for (let j = 0; j <= sv; j++) {
    const v = v0 + (v1 - v0) * (j / sv);
    for (let i = 0; i <= su; i++) {
      const u = u0 + (u1 - u0) * (i / su);
      const pOut = bodySurfacePoint(u, v, 1.0);
      const pIn = bodySurfacePoint(u, v, 1.0 - thickness / Math.max(0.08, bodyRadius(v)));
      outer.push(pOut);
      inner.push(pIn);
    }
  }
  const stride = su + 1;
  const nOut = outer.length;
  for (const p of outer) positions.push(p.x, p.y, p.z);
  for (const p of inner) positions.push(p.x, p.y, p.z);

  const quad = (a, b, c, d) => { indices.push(a, b, c, a, c, d); };

  for (let j = 0; j < sv; j++) {
    for (let i = 0; i < su; i++) {
      const a = j * stride + i, b = a + 1, c = a + stride + 1, d = a + stride;
      quad(a, b, c, d);
      const A = nOut + a, B = nOut + b, Cc = nOut + c, D = nOut + d;
      quad(A, D, Cc, B);
    }
  }
  // side walls
  for (let i = 0; i < su; i++) {
    // bottom edge j=0
    let a = i, b = i + 1;
    quad(a, nOut + a, nOut + b, b);
    // top edge j=sv
    let a2 = sv * stride + i, b2 = a2 + 1;
    quad(b2, nOut + b2, nOut + a2, a2);
  }
  for (let j = 0; j < sv; j++) {
    let a = j * stride, b = (j + 1) * stride;
    quad(b, nOut + b, nOut + a, a);
    let a2 = j * stride + su, b2 = (j + 1) * stride + su;
    quad(a2, nOut + a2, nOut + b2, b2);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const mesh = new THREE.Mesh(geo, glass(color, matOpts));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// Ring boundaries (non-uniform, more detail near the chest top)
const ringV = [0.0, 0.20, 0.42, 0.64, 0.83, 1.0];
const gapU = 0.010;  // small gap between staves so came lines read
const gapV = 0.012;

for (let r = 0; r < RINGS; r++) {
  for (let s = 0; s < STAVES; s++) {
    const u0 = s / STAVES + gapU * 0.5;
    const u1 = (s + 1) / STAVES - gapU * 0.5;
    const v0 = ringV[r] + (r === 0 ? 0.0 : gapV * 0.5);
    const v1 = ringV[r + 1] - (r === RINGS - 1 ? 0.0 : gapV * 0.5);

    // Color layout: breast (front, u near 0.25) is pale cream; back is amber/rust.
    const uMid = (u0 + u1) * 0.5;
    const frontness = Math.max(0, Math.cos((uMid - 0.25) * Math.PI * 2)); // 1 at front
    let col;
    if (frontness > 0.72 && r >= 1) {
      col = (s + r) % 3 === 0 ? C.milkWarm : C.cream;
    } else if (frontness > 0.35) {
      col = (s + r) % 2 === 0 ? C.honey : C.goldPale;
    } else {
      const pick = [C.amber, C.rust, C.honey, C.deepRust, C.amber];
      col = pick[(s * 3 + r * 2) % pick.length];
    }
    if (r === 0) col = (s % 2 === 0) ? C.deepRust : C.rust;   // shadowed underside

    const m = buildCurvedPane(u0, u1, v0, v1, col, {
      trans: frontness > 0.72 ? 0.80 : 0.68,
      thick: 0.30,
      emis: frontness > 0.72 ? 0.20 : 0.15,
      rough: 0.26 + ((s * 7 + r * 3) % 5) * 0.02
    }, 0.028, 5);
    bodyPaneGeoGroup.add(m);
  }
}

// Came ribs on the body: vertical seams + horizontal rings
const cameBody = new THREE.Group();
torso.add(cameBody);

for (let s = 0; s < STAVES; s++) {
  const u = s / STAVES;
  const pts = [];
  for (let j = 0; j <= 22; j++) {
    const v = j / 22;
    const p = bodySurfacePoint(u, v, 1.0);
    pts.push(p.multiplyScalar(1.0).add(new THREE.Vector3(0, 0, 0)));
  }
  // push outward slightly along radial dir
  const outPts = pts.map((p, i) => {
    const v = i / 22;
    const rad = Math.hypot(p.x, p.z);
    const k = rad > 1e-5 ? (rad + 0.012) / rad : 1;
    return new THREE.Vector3(p.x * k, p.y, p.z * k);
  });
  cameBody.add(cameLine(outPts, 0.0145, false));
}

for (let r = 1; r < RINGS; r++) {
  const v = ringV[r];
  const pts = [];
  const N = 46;
  for (let i = 0; i <= N; i++) {
    const u = i / N;
    const p = bodySurfacePoint(u % 1, v, 1.0);
    const rad = Math.hypot(p.x, p.z);
    const k = rad > 1e-5 ? (rad + 0.012) / rad : 1;
    pts.push(new THREE.Vector3(p.x * k, p.y, p.z * k));
  }
  pts.pop();
  cameBody.add(cameLine(pts, 0.0145, true));
}

/* ---------- Speckle jewels on the breast (barn owl spotting) ---------- */
const speckles = new THREE.Group();
torso.add(speckles);
const speckGeo = new THREE.SphereGeometry(0.017, 10, 8);
const speckMat = glass(C.deepRust, { trans: 0.5, emis: 0.25, thick: 0.1, rough: 0.2 });
for (let i = 0; i < 26; i++) {
  const u = 0.25 + (Math.sin(i * 2.399) * 0.16);
  const v = 0.24 + ((i * 0.137) % 1) * 0.58;
  const p = bodySurfacePoint(((u % 1) + 1) % 1, v, 1.0);
  const rad = Math.hypot(p.x, p.z);
  const k = rad > 1e-5 ? (rad + 0.014) / rad : 1;
  const sp = new THREE.Mesh(speckGeo, speckMat);
  sp.position.set(p.x * k, p.y, p.z * k);
  sp.scale.set(1, 1.25, 1);
  sp.castShadow = true;
  speckles.add(sp);
}

/* ---------- 2. HEAD ---------- */
const head = new THREE.Group();
head.position.set(0, 1.82, 0.045);
head.rotation.x = -0.05;
bodyGroup.add(head);

// Skull: faceted glass dome (back of head), amber/honey panes
const skull = new THREE.Group();
head.add(skull);

const HEAD_R = 0.335;
function headPoint(u, v, inflate = 1.0) {
  // u angle [0,1), v [0,1] from bottom to top of a squashed sphere
  const phi = v * Math.PI;
  const theta = u * Math.PI * 2;
  const r = HEAD_R * inflate;
  const sx = 1.06, sy = 0.98, sz = 0.94;
  return new THREE.Vector3(
    Math.sin(phi) * Math.cos(theta) * r * sx,
    -Math.cos(phi) * r * sy,
    Math.sin(phi) * Math.sin(theta) * r * sz
  );
}

function buildHeadPane(u0, u1, v0, v1, color, matOpts, thickness = 0.026, seg = 5) {
  const positions = [];
  const indices = [];
  const outer = [], inner = [];
  const su = seg, sv = seg;
  for (let j = 0; j <= sv; j++) {
    const v = v0 + (v1 - v0) * (j / sv);
    for (let i = 0; i <= su; i++) {
      const u = u0 + (u1 - u0) * (i / su);
      outer.push(headPoint(u, v, 1.0));
      inner.push(headPoint(u, v, 1.0 - thickness / HEAD_R));
    }
  }
  const stride = su + 1;
  const nOut = outer.length;
  for (const p of outer) positions.push(p.x, p.y, p.z);
  for (const p of inner) positions.push(p.x, p.y, p.z);
  const quad = (a, b, c, d) => { indices.push(a, b, c, a, c, d); };
  for (let j = 0; j < sv; j++) {
    for (let i = 0; i < su; i++) {
      const a = j * stride + i, b = a + 1, c = a + stride + 1, d = a + stride;
      quad(a, b, c, d);
      quad(nOut + a, nOut + d, nOut + c, nOut + b);
    }
  }
  for (let i = 0; i < su; i++) {
    quad(i, nOut + i, nOut + i + 1, i + 1);
    const a2 = sv * stride + i;
    quad(a2 + 1, nOut + a2 + 1, nOut + a2, a2);
  }
  for (let j = 0; j < sv; j++) {
    const a = j * stride, b = (j + 1) * stride;
    quad(b, nOut + b, nOut + a, a);
    const a2 = j * stride + su, b2 = (j + 1) * stride + su;
    quad(a2, nOut + a2, nOut + b2, b2);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, glass(color, matOpts));
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const HSTAVE = 12, HRINGS = 4;
const hRingV = [0.10, 0.36, 0.60, 0.82, 1.0];
const hGapU = 0.012, hGapV = 0.014;
const headColors = [C.amber, C.honey, C.rust, C.goldPale, C.honey, C.amber, C.deepRust, C.honey];

for (let r = 0; r < HRINGS; r++) {
  for (let s = 0; s < HSTAVE; s++) {
    const u0 = s / HSTAVE + hGapU * 0.5;
    const u1 = (s + 1) / HSTAVE - hGapU * 0.5;
    const v0 = hRingV[r] + hGapV * 0.5;
    const v1 = hRingV[r + 1] - (r === HRINGS - 1 ? 0.0 : hGapV * 0.5);
    const uMid = (u0 + u1) * 0.5;
    const frontness = Math.max(0, Math.cos((uMid - 0.25) * Math.PI * 2));
    // Skip panes at the very front — the heart face goes there
    if (frontness > 0.55 && r <= 2) continue;
    let col = headColors[(s * 5 + r * 3) % headColors.length];
    if (frontness > 0.3) col = (s + r) % 2 ? C.honey : C.goldPale;
    skull.add(buildHeadPane(u0, u1, v0, v1, col, {
      trans: 0.66, thick: 0.26, emis: 0.14,
      rough: 0.24 + ((s * 3 + r) % 4) * 0.02

/**
 * Barn-owl heart face outline: two lobes on top, tapering to a point below.
 * Parametric heart, tuned to be wide and gentle rather than valentine-cute.
 */
function heartOutline(scale = 1, n = 84) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const t = (i / n) * Math.PI * 2;
    // classic heart curve
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    pts.push(new THREE.Vector2(x * scale * 0.0295, y * scale * 0.0285));
  }
  return pts;
}

const heartPts = heartOutline(1.0, 84);

// Main heart pane, split into left/right halves so a central came runs down it
function halfHeart(side) {
  // side = +1 (right) or -1 (left)
  const out = [];
  const eps = 0.004;
  for (const p of heartPts) {
    if (side > 0 ? p.x >= -eps : p.x <= eps) out.push(new THREE.Vector2(p.x, p.y));
  }
  // sort by angle around centroid to keep outline order (heartPts already ordered; filter keeps order)
  // Close the half along the vertical axis
  if (out.length < 3) return null;
  // Insert the axis segment: from top-most filtered point down to bottom-most
  const ys = out.map(p => p.y);
  const yTop = Math.max(...ys), yBot = Math.min(...ys);
  const axis = [];
  const steps = 10;
  for (let i = 0; i <= steps; i++) {
    const y = yTop + (yBot - yTop) * (i / steps);
    axis.push(new THREE.Vector2(0.0, y));
  }
  return { half: out, axis, yTop, yBot };
}

function buildHeartHalf(side, color) {
  const hh = halfHeart(side);
  if (!hh) return new THREE.Group();
  // build ordered ring: heart arc (filtered) then axis back
  let ring = hh.half.slice();
  // Ensure the arc starts near the top of the axis and ends near the bottom
  // Reorder: find index closest to (0, yTop)
  let bestI = 0, bestD = Infinity;
  for (let i = 0; i < ring.length; i++) {
    const d = ring[i].distanceTo(new THREE.Vector2(0, hh.yTop));
    if (d < bestD) { bestD = d; bestI = i; }
  }
  ring = ring.slice(bestI).concat(ring.slice(0, bestI));
  // If the winding runs the wrong way for this side, reverse it
  const midIdx = Math.floor(ring.length / 2);
  if (Math.sign(ring[midIdx].x || side) !== Math.sign(side)) { /* keep */ }

  const full = ring.concat(hh.axis.filter(p => p.y < hh.yTop - 1e-3 && p.y > hh.yBot + 1e-3).reverse());
  const clean = dedupe(full);
  if (clean.length < 3) return new THREE.Group();

  const shape = new THREE.Shape(clean);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: 0.055, bevelEnabled: true, bevelThickness: 0.014,
    bevelSize: 0.012, bevelSegments: 3, curveSegments: 8, steps: 1
  });
  geo.translate(0, 0, -0.03);
  geo.computeVertexNormals();

  // Curve the flat face into a shallow dish (barn owl discs are concave/convex)
  {
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const d2 = (v.x * v.x) / 0.10 + (v.y * v.y) / 0.14;
      v.z += -0.11 * d2;              // dish backwards at edges -> forward center
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    pos.needsUpdate = true;
    geo.computeVertexNormals();
  }

  const m = new THREE.Mesh(geo, glass(color, {
    trans: 0.85, thick: 0.42, emis: 0.24, rough: 0.18, ior: 1.48
  }));
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// Heart came border (thick lead outline) — projected onto the dished surface
function dishZ(x, y, base = 0) {
  const d2 = (x * x) / 0.10 + (y * y) / 0.14;
  return base - 0.11 * d2;
}
{
  const border = heartPts.map(p => new THREE.Vector3(p.x, p.y, dishZ(p.x, p.y, 0.031)));
  face.add(cameLine(border, 0.021, true, cameDarkMat));

  // central vertical came (beak ridge line)
  const spine = [];
  const yT = Math.max(...heartPts.map(p => p.y));
  const yB = Math.min(...heartPts.map(p => p.y));
  for (let i = 0; i <= 14; i++) {
    const y = yT - 0.012 + (yB + 0.01 - (yT - 0.012)) * (i / 14);
    spine.push(new THREE.Vector3(0, y, dishZ(0, y, 0.033)));
  }
  face.add(cameLine(spine, 0.016, false, cameDarkMat));

  // Two concentric ruff arcs — the radial facial-disc feathering as tracery

      const t = (i / 60) * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(t), 3) * 0.0295 * s;
      const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 0.0285 * s;
      arc.push(new THREE.Vector3(x, y, dishZ(x, y, 0.031)));
    }
    face.add(cameLine(arc, 0.0105, true, cameDarkMat));

  // radial came spokes on the disc
  for (let i = 0; i < 18; i++) {
    const a = (i / 18) * Math.PI * 2;
    const r0 = 0.10, r1 = 0.185;
    const spoke = [];
    for (let k = 0; k <= 6; k++) {

      const x = Math.cos(a) * r * 1.0;
      const y = Math.sin(a) * r * 1.12 + 0.055;
      // keep spokes inside the heart-ish silhouette
      spoke.push(new THREE.Vector3(x, y, dishZ(x, y, 0.030)));
    }
    const line = cameLine(spoke, 0.0075, false, cameDarkMat);
    face.add(line);
  }
}

  });
  shoulder.position.set(0, 0.02, 0.0);
  shoulder.scale.set(1.0, 1.15, 1.0);

  // covert tracery inside shoulder

    const inner = radialPts(22, (a) => 0.125 * (1 + 0.22 * Math.cos(a * 2)));
    const pts3 = inner.map(p => new THREE.Vector3(p.x, p.y * 1.15 + 0.02, 0.028));
    wing.add(cameLine(pts3, 0.0095, true, cameDarkMat));
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2 + 0.3;
      const p0 = new THREE.Vector3(Math.cos(a) * 0.05, Math.sin(a) * 0.05 * 1.15 + 0.02, 0.030);

      wing.add(cameLine([p0, p1], 0.0065, false, cameDarkMat));
    }
  }

  // ---- Covert row: small honey/amber scale panes ----
  const covertColors = [C.honey, C.amber, C.goldPale, C.honey, C.amber, C.cream];
  for (let row = 0; row < 3; row++) {
    const count = 4 - Math.floor(row / 2);

      p.rotation.z = (-0.11 + t * 0.22) * -1.1;
      p.rotation.x = -0.10;
      wing.add(p);
    }

  // ---- Primary flight feathers: long tapered panes fanning down ----
  const primaryColors = [C.amber, C.rust, C.honey, C.deepRust, C.amber, C.honey, C.rust, C.goldPale];
  const NP = 8;
  for (let i = 0; i < NP; i++) {
    const t = i / (NP - 1);
    const len = 0.62 + Math.sin(t * Math.PI) * 0.20 - t * 0.10;
    const wid = 0.098 - t * 0.020;
    const pts = featherPts(len, wid, 22, 0.80, 0.48);

      depth: 0.026, bevel: 0.006, color: col,
      matOpts: {
        trans: 0.74, thick: 0.30, emis: 0.16,
        rough: 0.22 + (i % 3) * 0.03
      },
      cameRadius: 0.0105, cameOffsetZ: 0.014
    });

    const spread = -0.16 + t * 0.30;
    f.position.set(spread, -0.44 - Math.sin(t * Math.PI) * 0.05 - len * 0.16, -0.010 - i * 0.0085);
    f.rotation.z = -spread * 1.35 - 0.02;
    f.rotation.x = -0.06 - t * 0.05;
    f.rotation.y = side * 0.06;
    wing.add(f);

    // feather shaft came
    const shaft = [

    const sh = cameLine(shaft, 0.0058, false, cameDarkMat);
    sh.position.copy(f.position);
    sh.rotation.copy(f.rotation);
    wing.add(sh);

    // two barb came lines across the vane

  jring.position.set(0, 0.02, 0.052);
  wing.add(jring);

  return wing;
}

      const t = i / 8;
      const r = 0.055 + t * 0.085;
      const drop = -0.045 - Math.pow(t, 1.7) * 0.115;
      pts.push(new THREE.Vector3(
        Math.sin(a) * r * 0.55,
        drop,
        Math.cos(a) * r
      ));
    }
    const toeGeo = new THREE.TubeGeometry(
      new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.4),
      22, 0.019, 7, false
    );
    const toe = new THREE.Mesh(toeGeo, toeMat);
    toe.castShadow = true;
    foot.add(toe);

    // knuckle beads
    for (const tt of [0.35, 0.7]) {
      const idx = Math.round(tt * 8);
      const b = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 8), toeMat);
      b.position.copy(pts[idx]);
      foot.add(b);
    }
  }
  // back toe
  {
    const pts = [];
    for (let i = 0; i <= 6; i++) {
      const t = i / 6;
      pts.push(new THREE.Vector3(0, -0.045 - Math.pow(t, 1.6) * 0.10, -0.055 - t * 0.075));
    }
    const g = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.4), 18, 0.018, 7, false);
    const t = new THREE.Mesh(g, toeMat);
    t.castShadow = true;
    foot.add(t);
  }
  return foot;
}
perchGroup.add(makeFoot(+1));
perchGroup.add(makeFoot(-1));

/* ============================================================
   9. AMBIENT GLASS DUST / LIGHT MOTES
   ============================================================ */
{
  const N = 220;
  const pos = new Float32Array(N * 3);
  const col = new Float32Array(N * 3);
  const palette = [
    new THREE.Color(0xffc98a), new THREE.Color(0xffe6b8),
    new THREE.Color(0x9fc0ff), new THREE.Color(0xd98a1f)
  ];
  for (let i = 0; i < N; i++) {
    const a = (i * 2.399);
    const r = 1.4 + ((i * 0.0137) % 1) * 2.6;
    const y = 0.15 + ((i * 0.0231) % 1) * 3.0;
    pos[i * 3 + 0] = Math.cos(a) * r;
    pos[i * 3 + 1] = y;
    pos[i * 3 + 2] = Math.sin(a) * r;
    const c = palette[i % palette.length];
    col[i * 3 + 0] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.022, vertexColors: true, transparent: true,
    opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending,
    sizeAttenuation: true
  });
  const motes = new THREE.Points(geo, mat);
  motes.name = 'motes';
  scene.add(motes);
}

/* ============================================================
   FINAL FRAMING
   ============================================================ */
// Center the whole composition horizontally at the origin.
owl.position.set(0, 0, 0);

// Slight overall lean so it reads as a live perched bird
bodyGroup.rotation.x = 0.02;

/* ============================================================
   ANIMATE
   ============================================================ */
const clock = new THREE.Clock();
const motes = scene.getObjectByName('motes');

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // gentle breathing of the glass glow
  const pulse = 0.9 + Math.sin(t * 0.7) * 0.12;
  backGlow.intensity = 26 * pulse;
  coolGlow.intensity = 9 * (1.9 - pulse);

  // subtle head sway
  head.rotation.y = Math.sin(t * 0.31) * 0.10;
  head.rotation.z = Math.sin(t * 0.23) * 0.025;
  head.rotation.x = -0.05 + Math.sin(t * 0.41) * 0.02;

  // barely-there body settle
  bodyGroup.position.y = Math.sin(t * 0.55) * 0.006;

  if (motes) motes.rotation.y = t * 0.02;

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>
