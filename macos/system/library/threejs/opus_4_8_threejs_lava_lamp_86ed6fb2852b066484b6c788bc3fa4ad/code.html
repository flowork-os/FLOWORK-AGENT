<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retro Lava Lamp</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0b0d; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------------------------------------------------------------------------
// Renderer
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ---------------------------------------------------------------------------
// Scene & Camera
// ---------------------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0b0d);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0.5, 1.2, 10.5);

// Procedural environment for glass/metal reflections (no external assets)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------------------------------------------------------------------------
// Lighting: hemisphere + key/fill/rim, soft shadows
// ---------------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0x9fb4d8, 0x0a0a0c, 0.55);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
keyLight.position.set(5.5, 9, 6.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 40;
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -7;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.radius = 5;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x8fa6c4, 0.6);
fillLight.position.set(-6.5, 3.5, -1.5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0x88aaff, 1.3);
rimLight.position.set(-3.5, 5, -6.5);
scene.add(rimLight);

// ---------------------------------------------------------------------------
// Ground plane — receives shadows only
// ---------------------------------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -3.5;
ground.receiveShadow = true;
scene.add(ground);

// ---------------------------------------------------------------------------
// The single centered object: a retro lava lamp
// ---------------------------------------------------------------------------
const lamp = new THREE.Group();
scene.add(lamp);

const toV2 = (arr) => arr.map((p) => new THREE.Vector2(p[0], p[1]));

// --- Brass metal (base + cap) ---
const metalMat = new THREE.MeshStandardMaterial({
  color: 0xb08d57,
  metalness: 1.0,
  roughness: 0.32,
  envMapIntensity: 1.25
});

// Base profile (radius, y) — tapered metal cone with retro rings
const basePts = toV2([
  [0.00, -3.50],
  [1.28, -3.50],
  [1.28, -3.42],
  [1.19, -3.39],
  [1.23, -3.31],
  [1.10, -3.18],
  [1.00, -3.02],
  [0.90, -2.82],
  [0.80, -2.58],
  [0.71, -2.30],
  [0.63, -2.00],
  [0.57, -1.72],
  [0.60, -1.62],
  [0.55, -1.56],
  [0.42, -1.54],
  [0.00, -1.53]
]);
const base = new THREE.Mesh(new THREE.LatheGeometry(basePts, 96), metalMat);
base.castShadow = true;
base.receiveShadow = true;
lamp.add(base);

// Cap profile — tapered metal cap / finial
const capPts = toV2([
  [0.34, 1.75],
  [0.54, 1.80],
  [0.56, 1.90],
  [0.54, 2.00],
  [0.60, 2.06],
  [0.52, 2.17],
  [0.50, 2.30],
  [0.44, 2.55],
  [0.36, 2.82],
  [0.28, 3.06],
  [0.18, 3.28],
  [0.10, 3.42],
  [0.00, 3.48]
]);
const cap = new THREE.Mesh(new THREE.LatheGeometry(capPts, 96), metalMat);
cap.castShadow = true;
cap.receiveShadow = true;
lamp.add(cap);

// --- Glass vessel: tapered "bottle" silhouette, transmissive ---
const glassProfile = new THREE.SplineCurve(toV2([
  [0.30, -1.55],
  [0.70, -1.20],
  [0.90, -0.65],
  [0.90, -0.10],
  [0.82, 0.45],
  [0.68, 0.95],
  [0.54, 1.40],
  [0.42, 1.75],
  [0.36, 2.00]
])).getPoints(70);

const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0.0,
  roughness: 0.035,
  transmission: 1.0,
  thickness: 0.4,
  ior: 1.5,
  clearcoat: 0.35,
  clearcoatRoughness: 0.08,
  transparent: true,
  envMapIntensity: 1.0
});
const glass = new THREE.Mesh(new THREE.LatheGeometry(glassProfile, 96), glassMat);
glass.castShadow = true;
lamp.add(glass);

// --- Colored liquid inside the glass ---
const liquidProfile = new THREE.SplineCurve(toV2([
  [0.00, -1.50],
  [0.24, -1.50],
  [0.62, -1.15],
  [0.80, -0.65],
  [0.80, -0.10],
  [0.73, 0.45],
  [0.60, 0.95],
  [0.48, 1.35],
  [0.30, 1.45],
  [0.00, 1.45]
])).getPoints(70);

const liquidMat = new THREE.MeshPhysicalMaterial({
  color: 0x17a2a2,
  metalness: 0.0,
  roughness: 0.22,
  transmission: 0.92,
  thickness: 1.6,
  ior: 1.33,
  attenuationColor: new THREE.Color(0x0f8a8a),
  attenuationDistance: 2.4,
  emissive: 0x0a3838,
  emissiveIntensity: 0.35,
  transparent: true,
  envMapIntensity: 0.8
});
const liquid = new THREE.Mesh(new THREE.LatheGeometry(liquidProfile, 96), liquidMat);
lamp.add(liquid);

// --- Glowing translucent wax blobs ---
const blobGeo = new THREE.SphereGeometry(1, 40, 28);
const blobs = [];
const blobDefs = [
  { r: 0.36, baseY: -0.90, xoff:  0.12, zoff: -0.10, speed: 0.55, phase: 0.0, amp: 0.30, hue: 0xff5a1e },
  { r: 0.30, baseY: -0.20, xoff: -0.15, zoff:  0.12, speed: 0.62, phase: 1.5, amp: 0.28, hue: 0xff7a2a },
  { r: 0.26, baseY:  0.42, xoff:  0.10, zoff:  0.08, speed: 0.58, phase: 3.0, amp: 0.26, hue: 0xff4d33 },
  { r: 0.22, baseY:  0.92, xoff: -0.05, zoff: -0.06, speed: 0.72, phase: 4.2, amp: 0.20, hue: 0xffa03a },
  { r: 0.30, baseY: -1.14, xoff:  0.00, zoff:  0.15, speed: 0.46, phase: 2.0, amp: 0.18, hue: 0xff6320 },
  { r: 0.16, baseY:  1.16, xoff:  0.06, zoff:  0.04, speed: 0.85, phase: 5.1, amp: 0.16, hue: 0xffb84d }
];
for (const d of blobDefs) {
  const mat = new THREE.MeshStandardMaterial({
    color: d.hue,
    emissive: d.hue,
    emissiveIntensity: 1.45,
    roughness: 0.4,
    metalness: 0.0,
    transparent: true,
    opacity: 0.92
  });
  const m = new THREE.Mesh(blobGeo, mat);
  m.scale.setScalar(d.r);
  lamp.add(m);
  blobs.push({ mesh: m, ...d });
}

// --- Warm internal glow lighting the blobs from within ---
const glowLow = new THREE.PointLight(0xffb060, 22, 6, 2);
glowLow.position.set(0, -1.05, 0);
lamp.add(glowLow);

const glowMid = new THREE.PointLight(0xff8a3a, 9, 5, 2);
glowMid.position.set(0, 0.35, 0);
lamp.add(glowMid);

// ---------------------------------------------------------------------------
// Controls
// ---------------------------------------------------------------------------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.enablePan = false;
controls.minDistance = 6;
controls.maxDistance = 20;
controls.maxPolarAngle = 1.62;
controls.target.set(0, 0.1, 0);

// ---------------------------------------------------------------------------
// Post-processing: subtle bloom for the glowing look
// ---------------------------------------------------------------------------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.62, 0.55, 0.82
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------------------------------------------------------------------------
// Resize
// ---------------------------------------------------------------------------
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.setSize(w, h);
});

// ---------------------------------------------------------------------------
// Animate
// ---------------------------------------------------------------------------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  for (const b of blobs) {
    const y = b.baseY + Math.sin(t * b.speed + b.phase) * b.amp;
    b.mesh.position.set(
      b.xoff + Math.sin(t * 0.3 + b.phase) * 0.05,
      y,
      b.zoff + Math.cos(t * 0.25 + b.phase) * 0.05
    );
    const s = Math.sin(t * b.speed * 1.3 + b.phase);
    b.mesh.scale.set(b.r * (1 - 0.08 * s), b.r * (1 + 0.12 * s), b.r * (1 - 0.08 * s));
  }

  // gentle flicker of the internal warm glow
  glowLow.intensity = 22 + Math.sin(t * 1.7) * 2.2;
  glowMid.intensity = 9 + Math.sin(t * 2.3 + 1.0) * 1.4;

  controls.update();
  composer.render();
}
animate();
</script>
</body>
</html>
