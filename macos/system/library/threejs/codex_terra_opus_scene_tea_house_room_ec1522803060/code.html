import * as THREE from "three";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.38, -0.3);

controls.dampingFactor = 0.045;

controls.minDistance = 5;

let seed = 89371;
const rand = () => {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
};
const range = (a, b) => a + (b - a) * rand();

const root = new THREE.Group();
scene.add(root);

function canvasTexture(draw, size = 512, repeat = [1, 1]) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  draw(g, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(...repeat);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

const tatamiTexture = canvasTexture((g, s) => {
  g.fillStyle = "#9c926b";
  g.fillRect(0, 0, s, s);
  for (let i = 0; i < 1100; i++) {
    const y = rand() * s;
    g.strokeStyle = `rgba(${range(70,120)},${range(63,102)},${range(35,72)},${range(.04,.15)})`;
    g.lineWidth = range(.3, 1.1);
    g.beginPath();
    g.moveTo(0, y);
    g.lineTo(s, y + range(-1.5, 1.5));
    g.stroke();
  }
  for (let i = 0; i < 260; i++) {
    g.fillStyle = `rgba(255,250,215,${range(.015,.06)})`;
    g.fillRect(rand() * s, rand() * s, range(2, 14), .6);
  }
}, 512, [2, 2]);

const paperTexture = canvasTexture((g, s) => {
  const bg = g.createLinearGradient(0, 0, s, s);
  bg.addColorStop(0, "#eee1bd");
  bg.addColorStop(1, "#cdbf98");
  g.fillStyle = bg;
  g.fillRect(0, 0, s, s);
  for (let i = 0; i < 1800; i++) {
    const a = range(.012, .055);
    g.fillStyle = `rgba(90,72,42,${a})`;
    g.beginPath();
    g.arc(rand() * s, rand() * s, range(.25, 1.2), 0, Math.PI * 2);
    g.fill();
  }
}, 512, [1, 1]);

const woodTexture = canvasTexture((g, s) => {
  g.fillStyle = "#4b2918";
  g.fillRect(0, 0, s, s);
  for (let i = 0; i < 250; i++) {
    const y = rand() * s;
    const grad = g.createLinearGradient(0, y, s, y + range(-3, 3));
    grad.addColorStop(0, `rgba(20,8,2,${range(.12,.34)})`);
    grad.addColorStop(.45, `rgba(151,83,38,${range(.03,.17)})`);
    grad.addColorStop(1, `rgba(10,5,1,${range(.12,.28)})`);
    g.strokeStyle = grad;
    g.lineWidth = range(.4, 2.5);
    g.beginPath();
    g.moveTo(0, y);
    g.bezierCurveTo(s * .25, y + range(-8,8), s * .7, y + range(-8,8), s, y + range(-3,3));
    g.stroke();
  }
}, 512, [3, 1]);

const scrollTexture = canvasTexture((g, s) => {
  g.fillStyle = "#d9c69a";
  g.fillRect(0, 0, s, s);
  g.fillStyle = "rgba(52,38,26,.10)";
  for (let i = 0; i < 400; i++) g.fillRect(rand()*s, rand()*s, 1, 1);
  g.translate(s * .48, s * .1);
  g.strokeStyle = "#25231b";
  g.lineCap = "round";
  for (let i = 0; i < 8; i++) {
    g.lineWidth = range(5, 15);
    g.beginPath();
    let x = range(-45, 45), y = i * 48 + range(-10, 9);
    g.moveTo(x, y);
    for (let k = 0; k < 4; k++) {
      x += range(-48, 53);
      y += range(-14, 26);
      g.quadraticCurveTo(x + range(-18,18), y - range(-14,14), x, y);
    }
    g.stroke();
  }
  g.strokeStyle = "#932f22";
  g.lineWidth = 4;
  g.beginPath();
  g.arc(112, 313, 22, 0, Math.PI * 2);
  g.stroke();
});

const rockTexture = canvasTexture((g, s) => {
  g.fillStyle = "#a99d8b";
  g.fillRect(0, 0, s, s);
  for (let i = 0; i < 1500; i++) {
    const v = Math.floor(range(110, 190));
    g.fillStyle = `rgba(${v},${v},${v-3},${range(.04,.18)})`;
    g.fillRect(rand() * s, rand() * s, range(.5,2.3), range(.5,2.3));
  }
}, 512, [4, 4]);

  paperGlow: new THREE.MeshStandardMaterial({ color: 0xf1dba6, emissive: 0x66502e, emissiveIntensity: .45, roughness: .83, map: paperTexture, side: THREE.DoubleSide }),

  bamboo: new THREE.MeshStandardMaterial({ color: 0xa78144, roughness: .65 }),

function box(w, h, d, mat, x=0, y=0, z=0, group=root) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  group.add(m);
  return m;
}
function cylinder(r1, r2, h, mat, x=0, y=0, z=0, group=root, radial=24) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, radial), mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  group.add(m);
  return m;
}
function sphere(r, mat, x=0, y=0, z=0, group=root) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  group.add(m);
  return m;
}

function tatami(x, z, rotate=false) {
  const g = new THREE.Group();

  const edge = new THREE.MeshStandardMaterial({ color: 0x1f352b, roughness: .83 });
  box(2.88, .105, .055, edge, 0, .012, -.7, g);
  box(2.88, .105, .055, edge, 0, .012, .7, g);
  floorGroup.add(g);
}

function makeVase(group, x, z) {
  const profile = [
    new THREE.Vector2(.22,0), new THREE.Vector2(.24,.05), new THREE.Vector2(.18,.18),
    new THREE.Vector2(.16,.47), new THREE.Vector2(.24,.58), new THREE.Vector2(.17,.67),
    new THREE.Vector2(.11,.7)
  ];
  const vase = new THREE.Mesh(new THREE.LatheGeometry(profile, 32), materials.celadon);
  vase.position.set(x, .54, z);
  vase.castShadow = vase.receiveShadow = true;
  group.add(vase);
  return vase;
}

  const stem = new THREE.Mesh(new THREE.CylinderGeometry(.018,.026,range(.65,1.22),8), stemMat);
  stem.position.set(0, 1.0, 0);
  stem.rotation.z = range(-.7,.7);
  stem.rotation.x = range(-.45,.45);

  const flower = sphere(range(.075,.12), new THREE.MeshStandardMaterial({color:i%2?0xd78672:0xe5cf8c,roughness:.8}), 0, 0, 0, ikebana);
  flower.position.copy(stem.position).add(new THREE.Vector3(Math.sin(stem.rotation.z)*.45, .55+Math.cos(stem.rotation.z)*.35, Math.sin(stem.rotation.x)*.25));
}

function shojiPanel(width, height, glowing=false) {
  const panel = new THREE.Group();
  const wood = materials.beamWood;
  const paper = glowing ? materials.paperGlow : materials.paper;
  const face = new THREE.Mesh(new THREE.PlaneGeometry(width-.16, height-.16), paper);
  face.position.z = -.011;
  panel.add(face);
  box(width,.095,.09,wood,0,height/2,0,panel);
  box(width,.095,.09,wood,0,-height/2,0,panel);
  box(.09,height,.09,wood,-width/2,0,0,panel);
  box(.09,height,.09,wood,width/2,0,0,panel);
  for(let i=1;i<4;i++) box(.045,height-.12,.045,wood,-width/2+i*width/4,0,.025,panel);
  for(let i=1;i<5;i++) box(width-.12,.045,.045,wood,0,-height/2+i*height/5,.025,panel);
  return panel;
}

const panelB = shojiPanel(2.15, 4.45, true);

box(4.55,.16,.2,materials.beamWood,0,.06,.02,openScreen);

  line.rotation.z = range(-.4,.4);
  line.position.set(range(-3,3),.012,range(-1.8,1.8));

}

}
const distantHill = new THREE.Mesh(new THREE.SphereGeometry(9, 32, 14, 0, Math.PI*2, 0, Math.PI*.42), new THREE.MeshStandardMaterial({color:0x53665b,roughness:1}));
distantHill.position.set(.2,-6.8,-6.2);

function teaBowl(x,z,mat=materials.ceramic, scale=1) {
  const profile = [new THREE.Vector2(.15,0),new THREE.Vector2(.33,.02),new THREE.Vector2(.39,.12),new THREE.Vector2(.37,.27),new THREE.Vector2(.28,.34)];
  const bowl = new THREE.Mesh(new THREE.LatheGeometry(profile,32),mat);
  bowl.scale.setScalar(scale);
  bowl.position.set(x,.31,z);
  bowl.castShadow=bowl.receiveShadow=true;
  table.add(bowl);
  const tea = new THREE.Mesh(new THREE.CircleGeometry(.285,30),new THREE.MeshStandardMaterial({color:0x4a3821,roughness:.45}));
  tea.rotation.x=-Math.PI/2;
  tea.position.set(x,.595*scale,z);
  tea.scale.setScalar(scale);
  table.add(tea);
  return bowl;
}

const branchMat = new THREE.MeshStandardMaterial({color:0x4b3020,roughness:.9});
function branch(a,b,r=.045) {
  const d=new THREE.Vector3().subVectors(b,a), mid=new THREE.Vector3().addVectors(a,b).multiplyScalar(.5);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.62,d.length(),8),branchMat);
  m.position.copy(mid);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
  m.castShadow=true;bonsai.add(m);
}

const lantern = new THREE.Group();
lantern.position.set(-4.48,0,2.63);root.add(lantern);
box(.82,.76,.82,materials.paperGlow,0,1.1,0,lantern);
for(const x of [-.45,.45]) for(const z of [-.45,.45]) cylinder(.035,.035,1.35,materials.darkWood,x,1.08,z,lantern);
box(1.02,.1,1.02,materials.darkWood,0,.42,0,lantern);
box(1.04,.1,1.04,materials.darkWood,0,1.82,0,lantern);
const lanternLight=new THREE.PointLight(0xffbd6c,1.4,4.5,2);
lanternLight.position.set(-4.48,1.2,2.63);scene.add(lanternLight);

const steam = new THREE.Group();
steam.position.set(-.04,1.22,-.45);
table.add(steam);
const steamMaterial = new THREE.SpriteMaterial({color:0xf7f1df,transparent:true,opacity:.16,depthWrite:false,blending:THREE.AdditiveBlending});
const steamPuffs=[];
for(let i=0;i<18;i++){
  const p=new THREE.Sprite(steamMaterial.clone());
  p.scale.set(.18,.18,.18);
  p.userData={phase:rand()*Math.PI*2,offset:range(-.07,.07),rise:range(.15,1.2),speed:range(.35,.7)};
  steam.add(p);steamPuffs.push(p);
}

const ambient = new THREE.HemisphereLight(0xa7c7d9,0x47341f,1.35);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffd99d,4.0);
sun.position.set(4.6,8.3,2.7);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-7;sun.shadow.camera.right=7;sun.shadow.camera.top=7;sun.shadow.camera.bottom=-7;
sun.shadow.bias=-.00015;
scene.add(sun);
const windowGlow = new THREE.RectAreaLight(0xffd698,4.5,3.4,3.9);
windowGlow.position.set(3.1,3.0,-3.2);
windowGlow.rotation.y=-Math.PI*.79;
scene.add(windowGlow);
const fill = new THREE.PointLight(0x9eb9c8,.75,9,2);
fill.position.set(-2.6,3.3,2.6);scene.add(fill);

const dust = new THREE.Group();
scene.add(dust);
const dustMat = new THREE.SpriteMaterial({color:0xffefc4,transparent:true,opacity:.13,depthWrite:false});
const dustPuffs=[];
for(let i=0;i<38;i++){
  const d=new THREE.Sprite(dustMat);
  d.position.set(range(-4.5,4.5),range(.4,5),range(-3.3,3.5));
  const s=range(.012,.035);d.scale.set(s,s,s);
  d.userData={x:d.position.x,y:d.position.y,z:d.position.z,phase:rand()*6.28};
  dust.add(d);dustPuffs.push(d);
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  steamPuffs.forEach((p,i)=>{
    const u=p.userData;
    const q=(t*u.speed+u.phase) % 1;
    p.position.set(u.offset+Math.sin(t*.9+i)*.055,q*u.rise,Math.cos(t*.73+i)*.045);
    const s=.10+q*.28;
    p.scale.set(s,s,s);
    p.material.opacity=(1-q)*.16;
  });
  foliage.rotation.z=Math.sin(t*.72)*.022;
  foliage.rotation.x=Math.cos(t*.51)*.014;
  panelB.rotation.y=-.17+Math.sin(t*.34)*.022;
  dustPuffs.forEach(d=>{
    const u=d.userData;
    d.position.x=u.x+Math.sin(t*.22+u.phase)*.08;
    d.position.y=u.y+Math.sin(t*.37+u.phase)*.045;
    d.position.z=u.z+Math.cos(t*.18+u.phase)*.06;
  });
  lanternLight.intensity=1.35+Math.sin(t*2.2)*.09;
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
