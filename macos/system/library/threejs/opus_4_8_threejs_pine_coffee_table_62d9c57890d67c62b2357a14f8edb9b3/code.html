<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pine Coffee Table</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d7d7d4; }
  canvas { display: block; }
</style>

<!-- Only three.js core + OrbitControls, via jsDelivr CDN import map -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ *
 *  PINE COFFEE TABLE
 *  A plain pine coffee table: rectangular top with lightly rounded
 *  edges and believable board thickness, a simple apron under the top,
 *  and four straight square legs. Light natural pine, game-ready.
 *  Real-world scale in metres.
 * ------------------------------------------------------------------ */

// ---- Real-world dimensions (metres) -------------------------------
const DIM = {
  topW:        1.10,   // top width  (X)
  topD:        0.55,   // top depth  (Z)
  topT:        0.045,  // board thickness of the top
  edgeRound:   0.014,  // corner radius of the rectangular top
  edgeBevel:   0.008,  // softening of the top/bottom edges

  totalH:      0.42,   // overall table height (floor -> top surface)

  legSize:     0.060,  // square leg cross-section
  legInset:    0.055,  // inset of a leg's outer face from the top edge

  apronH:      0.090,  // apron rail height
  apronT:      0.020,  // apron rail thickness
  apronInset:  0.060,  // apron inset from the top edge
};

DIM.legH = DIM.totalH - DIM.topT;          // legs run floor -> underside of top

// ---- Renderer ------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ---- Scene & neutral studio background -----------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd7d7d4);

// ---- Camera --------------------------------------------------------
const camera = new THREE.PerspectiveCamera(
  40, window.innerWidth / window.innerHeight, 0.01, 100
);

// ---- Controls ------------------------------------------------------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 0.8;
controls.maxDistance = 6;
controls.maxPolarAngle = Math.PI * 0.495; // stay above the floor

/* ------------------------------------------------------------------ *
 *  Procedural pine wood texture (CanvasTexture)
 *  Light natural pine with soft longitudinal grain streaks.
 * ------------------------------------------------------------------ */
function makePineTexture() {
  const w = 512, h = 512;
  const cvs = document.createElement('canvas');
  cvs.width = w; cvs.height = h;
  const ctx = cvs.getContext('2d');

  // Warm pine base
  ctx.fillStyle = '#dcbd8e';
  ctx.fillRect(0, 0, w, h);

  // Broad tonal banding along the grain (vertical)
  for (let x = 0; x < w; x += 1) {
    const band = Math.sin(x * 0.045) * 0.5 + Math.sin(x * 0.011 + 1.7) * 0.5;
    const shade = band * 0.5 + 0.5; // 0..1
    const r = Math.round(150 + shade * 70);
    const g = Math.round(110 + shade * 55);
    const b = Math.round(60 + shade * 40);
    ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.06)`;
    ctx.fillRect(x, 0, 1, h);
  }

  // Fine grain lines (vertical streaks with slight waviness)
  const lineCount = 130;
  for (let i = 0; i < lineCount; i++) {
    const baseX = Math.random() * w;
    const dark = Math.random() * 0.35 + 0.10;
    ctx.strokeStyle = `rgba(120, 86, 48, ${dark})`;
    ctx.lineWidth = Math.random() * 1.4 + 0.3;
    ctx.beginPath();
    let x = baseX;
    ctx.moveTo(x, 0);
    for (let y = 0; y <= h; y += 16) {
      x += (Math.random() - 0.5) * 3.0;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // A few occasional knots for character
  const knots = 3;
  for (let i = 0; i < knots; i++) {
    const kx = Math.random() * w, ky = Math.random() * h;
    const kr = Math.random() * 10 + 6;
    const g = ctx.createRadialGradient(kx, ky, 1, kx, ky, kr);
    g.addColorStop(0, 'rgba(96, 66, 34, 0.55)');
    g.addColorStop(0.6, 'rgba(140, 100, 58, 0.25)');
    g.addColorStop(1, 'rgba(140, 100, 58, 0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(kx, ky, kr * 0.7, kr, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  const tex = new THREE.CanvasTexture(cvs);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

const pineTex = makePineTexture();

// Helper: a pine material with an independently-tiled grain texture
function pineMaterial(repeatX, repeatY, rotation = 0) {
  const t = pineTex.clone();
  t.needsUpdate = true;
  t.repeat.set(repeatX, repeatY);
  t.rotation = rotation;
  t.center.set(0.5, 0.5);
  return new THREE.MeshStandardMaterial({
    map: t,
    color: 0xffffff,
    roughness: 0.72,
    metalness: 0.0,
  });
}

/* ------------------------------------------------------------------ *
 *  Geometry helpers
 * ------------------------------------------------------------------ */

// A rounded rectangle Shape centred on the origin (in the XY plane)
function roundedRectShape(w, d, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -d / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + d - r);
  s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
  s.lineTo(x + r, y + d);
  s.quadraticCurveTo(x, y + d, x, y + d - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

/* ------------------------------------------------------------------ *
 *  Build the table
 * ------------------------------------------------------------------ */
const table = new THREE.Group();
table.name = 'PineCoffeeTable';

// --- Table top: rounded rectangle extruded to board thickness -------
{
  const bevel = DIM.edgeBevel;
  const shape = roundedRectShape(DIM.topW, DIM.topD, DIM.edgeRound);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: DIM.topT - bevel * 2,
    bevelEnabled: true,
    bevelThickness: bevel,
    bevelSize: bevel,
    bevelSegments: 3,
    curveSegments: 12,
  });
  geo.rotateX(-Math.PI / 2);   // lay the board flat (thickness -> Y)
  geo.center();                // centre on origin, then lift into place

  const topMat = pineMaterial(DIM.topW, DIM.topD); // ~1 tile per metre
  const top = new THREE.Mesh(geo, topMat);
  top.name = 'TableTop';
  top.position.y = DIM.legH + DIM.topT / 2;   // underside sits on legs
  top.castShadow = true;
  top.receiveShadow = true;
  table.add(top);
}

// --- Four straight square legs --------------------------------------
{
  const legGeo = new THREE.BoxGeometry(DIM.legSize, DIM.legH, DIM.legSize);
  const dx = DIM.topW / 2 - DIM.legInset - DIM.legSize / 2;
  const dz = DIM.topD / 2 - DIM.legInset - DIM.legSize / 2;
  const corners = [
    [ dx,  dz, 'FR'], [-dx,  dz, 'FL'],
    [ dx, -dz, 'BR'], [-dx, -dz, 'BL'],
  ];
  for (const [x, z, tag] of corners) {
    // Grain runs vertically up the leg
    const legMat = pineMaterial(DIM.legSize * 4, DIM.legH * 2);
    const leg = new THREE.Mesh(legGeo, legMat);
    leg.name = 'Leg_' + tag;
    leg.position.set(x, DIM.legH / 2, z);
    leg.castShadow = true;
    leg.receiveShadow = true;
    table.add(leg);
  }
}

// --- Simple apron: four rails tucked under the top ------------------
{
  const apronY = DIM.legH - DIM.apronH / 2;          // hangs from underside
  const offX = DIM.topW / 2 - DIM.apronInset;
  const offZ = DIM.topD / 2 - DIM.apronInset;
  const lenX = DIM.topW - DIM.apronInset * 2;
  const lenZ = DIM.topD - DIM.apronInset * 2;

  // Front & back rails (run along X)
  const railXGeo = new THREE.BoxGeometry(lenX, DIM.apronH, DIM.apronT);
  for (const z of [offZ, -offZ]) {
    const mat = pineMaterial(lenX * 3, DIM.apronH * 3);
    const rail = new THREE.Mesh(railXGeo, mat);
    rail.name = 'Apron_' + (z > 0 ? 'Front' : 'Back');
    rail.position.set(0, apronY, z);
    rail.castShadow = true;
    rail.receiveShadow = true;
    table.add(rail);
  }

  // Left & right rails (run along Z)
  const railZGeo = new THREE.BoxGeometry(DIM.apronT, DIM.apronH, lenZ);
  for (const x of [offX, -offX]) {
    const mat = pineMaterial(lenZ * 3, DIM.apronH * 3, Math.PI / 2);
    const rail = new THREE.Mesh(railZGeo, mat);
    rail.name = 'Apron_' + (x > 0 ? 'Right' : 'Left');
    rail.position.set(x, apronY, 0);
    rail.castShadow = true;
    rail.receiveShadow = true;
    table.add(rail);
  }
}

scene.add(table);

/* ------------------------------------------------------------------ *
 *  Ground plane (soft contact-shadow surface the table rests on)
 * ------------------------------------------------------------------ */
{
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0xcfcfca,
    roughness: 0.95,
    metalness: 0.0,
  });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), groundMat);
  ground.name = 'Ground';
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = 0;
  ground.receiveShadow = true;
  scene.add(ground);
}

/* ------------------------------------------------------------------ *
 *  Lighting
 * ------------------------------------------------------------------ */
// Sky/ground hemisphere fill
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8577, 0.55);
scene.add(hemi);

// Directional key light (casts shadows)
const key = new THREE.DirectionalLight(0xfff4e2, 2.2);
key.position.set(1.4, 2.0, 1.1);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 8;
key.shadow.camera.left = -1.2;
key.shadow.camera.right = 1.2;
key.shadow.camera.top = 1.2;
key.shadow.camera.bottom = -1.2;
key.shadow.bias = -0.0002;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key);

// Subtle cool fill from the opposite side (no shadow)
const fill = new THREE.DirectionalLight(0xdfe6ff, 0.5);
fill.position.set(-1.6, 1.0, -1.2);
scene.add(fill);

/* ------------------------------------------------------------------ *
 *  Auto-frame the camera to the object's bounding box
 * ------------------------------------------------------------------ */
function frameObject(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  const maxDim = Math.max(size.x, size.y, size.z);
  const fov = camera.fov * Math.PI / 180;
  let dist = (maxDim / 2) / Math.tan(fov / 2);
  dist *= 1.7; // padding

  camera.position.set(center.x + dist * 0.62,
                      center.y + dist * 0.5,
                      center.z + dist * 0.78);
  camera.near = dist / 100;
  camera.far  = dist * 100;
  camera.updateProjectionMatrix();

  controls.target.copy(center);
  controls.update();
}
frameObject(table);

/* ------------------------------------------------------------------ *
 *  Resize handling
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ------------------------------------------------------------------ *
 *  Render loop
 * ------------------------------------------------------------------ */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
