<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papercraft Lotus Flower</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #eee8e2;
}
canvas {
  display: block;
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeee8e2);
scene.fog = new THREE.Fog(0xeee8e2, 10, 18);

const camera = new THREE.PerspectiveCamera(
  35,
  window.innerWidth / window.innerHeight,
  0.1,
  50
);
camera.position.set(5.9, 4.7, 6.3);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.75, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 4.5;
controls.maxDistance = 11;
controls.maxPolarAngle = Math.PI * 0.48;
controls.update();

const hemisphere = new THREE.HemisphereLight(0xfff8f3, 0x8c7c84, 2.3);
scene.add(hemisphere);

const keyLight = new THREE.DirectionalLight(0xfff1e8, 4.0);
keyLight.position.set(-4.5, 7.5, 5.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -5;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 18;
keyLight.shadow.bias = -0.0002;
keyLight.shadow.normalBias = 0.025;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xffc7d6, 1.5);
fillLight.position.set(5, 3.5, -4);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xd8e5ff, 1.15);
rimLight.position.set(-4, 2.5, -6);
scene.add(rimLight);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xe8e1db,
  roughness: 0.93,
  metalness: 0
});
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  floorMaterial
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.045;
floor.receiveShadow = true;
scene.add(floor);

const lotus = new THREE.Group();
lotus.rotation.y = 0.12;
scene.add(lotus);

const petalMaterial = new THREE.MeshStandardMaterial({
  vertexColors: true,
  side: THREE.DoubleSide,
  roughness: 0.86,
  metalness: 0,
  flatShading: false
});

const tabMaterial = new THREE.MeshStandardMaterial({
  color: 0xe7a2ae,
  roughness: 0.91,
  side: THREE.DoubleSide,
  polygonOffset: true,
  polygonOffsetFactor: -2,
  polygonOffsetUnits: -2
});

const foldLineMaterial = new THREE.LineBasicMaterial({
  color: 0xa95269,
  transparent: true,
  opacity: 0.31,
  depthWrite: false
});

const edgeLineMaterial = new THREE.LineBasicMaterial({
  color: 0x9c5366,
  transparent: true,
  opacity: 0.42,
  depthWrite: false
});

const glueLineMaterial = new THREE.LineBasicMaterial({
  color: 0x8c5260,
  transparent: true,
  opacity: 0.48,
  depthWrite: false
});

const basePaperColor = new THREE.Color(0xfff7f2);
const blushColor = new THREE.Color(0xf7c7ce);
const tipPaperColor = new THREE.Color(0xd9637f);

function petalSurface(t, u, parameters) {
  const s = Math.sin(Math.PI * t);
  const widthProfile =
    parameters.width *
    (0.026 + 0.11 * (1 - t) + Math.pow(Math.max(0, s), 0.72));

  const x = u * widthProfile;
  const centerFold =
    parameters.fold *
    (1 - Math.abs(u)) *
    Math.pow(Math.max(0, s), 0.82);

  const sideFacet =
    parameters.fold *
    0.22 *
    Math.cos(u * Math.PI * 2) *
    Math.pow(Math.max(0, s), 1.25);

  const curledTip = parameters.curl * Math.pow(t, 5.2);
  const y =
    parameters.rise * Math.pow(Math.max(0, s), 1.08) +
    centerFold +
    sideFacet +
    curledTip;

  const z =
    parameters.length * t -
    parameters.length * parameters.backCurl * Math.pow(t, 5.4);

  return new THREE.Vector3(x, y, z);
}

function createPetalGeometry(parameters, phase) {
  const widthSegments = 6;
  const lengthSegments = 14;
  const positions = [];
  const colors = [];
  const indices = [];

  for (let j = 0; j <= lengthSegments; j++) {
    const t = j / lengthSegments;

    for (let i = 0; i <= widthSegments; i++) {
      const u = -1 + (i / widthSegments) * 2;
      const point = petalSurface(t, u, parameters);
      positions.push(point.x, point.y, point.z);

      const pinkAmount = THREE.MathUtils.smoothstep(t, 0.18, 0.92);
      const color = basePaperColor.clone();
      color.lerp(blushColor, Math.min(1, pinkAmount * 1.15));
      color.lerp(tipPaperColor, Math.pow(pinkAmount, 2.4) * 0.78);

      const facetShade =
        0.045 * Math.cos(i * Math.PI + phase) *
        Math.sin(Math.PI * t);
      color.offsetHSL(0, facetShade * 0.2, facetShade);
      colors.push(color.r, color.g, color.b);
    }
  }

  for (let j = 0; j < lengthSegments; j++) {
    for (let i = 0; i < widthSegments; i++) {
      const a = j * (widthSegments + 1) + i;
      const b = a + 1;
      const c = a + widthSegments + 1;
      const d = c + 1;

      if ((i + j) % 2 === 0) {
        indices.push(a, c, b, b, c, d);
      } else {
        indices.push(a, c, d, a, d, b);
      }
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions, 3)
  );
  geometry.setAttribute(
    'color',
    new THREE.Float32BufferAttribute(colors, 3)
  );
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  return geometry;
}

function createSurfaceLine(parameters, u, start, end, lift, material) {
  const points = [];
  const divisions = 20;

  for (let i = 0; i <= divisions; i++) {
    const t = THREE.MathUtils.lerp(start, end, i / divisions);
    const point = petalSurface(t, u, parameters);
    point.y += lift;
    points.push(point);
  }

  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  return new THREE.Line(geometry, material);
}

function createGlueTab(parameters, side) {
  const t0 = 0.12;
  const t1 = 0.31;
  const inner = 0.78 * side;
  const outer = 1.10 * side;
  const points = [
    petalSurface(t0, inner, parameters),
    petalSurface(t0, outer, parameters),
    petalSurface(t1, outer, parameters),
    petalSurface(t1, inner, parameters)
  ];

  for (const point of points) {
    point.y += 0.012;
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute([
      points[0].x, points[0].y, points[0].z,
      points[1].x, points[1].y, points[1].z,
      points[2].x, points[2].y, points[2].z,
      points[3].x, points[3].y, points[3].z
    ], 3)
  );
  geometry.setIndex([0, 1, 2, 0, 2, 3]);
  geometry.computeVertexNormals();

  const tab = new THREE.Mesh(geometry, tabMaterial);
  tab.castShadow = true;

  const seamPoints = [
    points[0].clone().lerp(points[1], 0.18),
    points[3].clone().lerp(points[2], 0.18)
  ];
  for (const point of seamPoints) {
    point.y += 0.008;
  }

  const seamGeometry = new THREE.BufferGeometry().setFromPoints(seamPoints);
  const seam = new THREE.Line(seamGeometry, glueLineMaterial);

  const group = new THREE.Group();
  group.add(tab, seam);
  return group;
}

function createPetal(parameters, index, addTab) {
  const petal = new THREE.Group();
  const geometry = createPetalGeometry(parameters, index * 0.71);
  const sheet = new THREE.Mesh(geometry, petalMaterial);
  sheet.castShadow = true;
  sheet.receiveShadow = true;
  petal.add(sheet);

  petal.add(
    createSurfaceLine(parameters, 0, 0.04, 0.96, 0.014, foldLineMaterial)
  );
  petal.add(
    createSurfaceLine(parameters, -0.52, 0.12, 0.82, 0.012, foldLineMaterial)
  );
  petal.add(
    createSurfaceLine(parameters, 0.52, 0.12, 0.82, 0.012, foldLineMaterial)
  );
  petal.add(
    createSurfaceLine(parameters, -1, 0.03, 0.985, 0.008, edgeLineMaterial)
  );
  petal.add(
    createSurfaceLine(parameters, 1, 0.03, 0.985, 0.008, edgeLineMaterial)
  );

  if (addTab) {
    petal.add(createGlueTab(parameters, index % 2 === 0 ? 1 : -1));
  }

  return petal;
}

function addPetalRing(options) {
  for (let i = 0; i < options.count; i++) {
    const angle =
      (i / options.count) * Math.PI * 2 +
      options.offset;

    const carrier = new THREE.Group();
    carrier.rotation.y = angle;

    const petalParameters = {
      length:
        options.length *
        (1 + 0.018 * Math.sin(i * 2.13 + options.offset)),
      width:
        options.width *
        (1 + 0.025 * Math.cos(i * 1.79)),
      rise: options.rise,
      curl:
        options.curl *
        (1 + 0.055 * Math.sin(i * 1.31)),
      fold: options.fold,
      backCurl: options.backCurl
    };

    const petal = createPetal(
      petalParameters,
      i,
      i % options.tabEvery === 0
    );

    petal.position.set(
      0,
      options.height + 0.012 * Math.sin(i * 2.7),
      options.radius
    );
    petal.rotation.x =
      -options.tilt -
      0.018 * Math.sin(i * 1.57);
    petal.rotation.z =
      0.018 * Math.cos(i * 2.21);

    carrier.add(petal);
    lotus.add(carrier);
  }
}

addPetalRing({
  count: 18,
  offset: 0,
  radius: 0.46,
  height: 0.10,
  length: 2.38,
  width: 0.72,
  rise: 0.23,
  curl: 0.28,
  fold: 0.085,
  backCurl: 0.075,
  tilt: THREE.MathUtils.degToRad(7),
  tabEvery: 3
});

addPetalRing({
  count: 14,
  offset: Math.PI / 14,
  radius: 0.40,
  height: 0.23,
  length: 1.86,
  width: 0.68,
  rise: 0.34,
  curl: 0.34,
  fold: 0.10,
  backCurl: 0.085,
  tilt: THREE.MathUtils.degToRad(20),
  tabEvery: 4
});

addPetalRing({
  count: 10,
  offset: Math.PI / 10 + 0.08,
  radius: 0.34,
  height: 0.38,
  length: 1.30,
  width: 0.54,
  rise: 0.39,
  curl: 0.30,
  fold: 0.095,
  backCurl: 0.07,
  tilt: THREE.MathUtils.degToRad(42),
  tabEvery: 3
});

const centerGroup = new THREE.Group();
centerGroup.position.y = 0.52;
lotus.add(centerGroup);

const centerBaseMaterial = new THREE.MeshStandardMaterial({
  color: 0xe7b764,
  roughness: 0.82,
  metalness: 0,
  flatShading: true
});

const centerTopMaterial = new THREE.MeshStandardMaterial({
  color: 0xf4d78b,
  roughness: 0.78,
  metalness: 0,
  flatShading: true
});

const beadMaterial = new THREE.MeshStandardMaterial({
  color: 0xf1c45e,
  roughness: 0.75,
  metalness: 0,
  flatShading: true
});

const beadDarkMaterial = new THREE.MeshStandardMaterial({
  color: 0xc98b3f,
  roughness: 0.82,
  metalness: 0,
  flatShading: true
});

const centerBase = new THREE.Mesh(
  new THREE.CylinderGeometry(0.43, 0.47, 0.20, 18, 1),
  centerBaseMaterial
);
centerBase.castShadow = true;
centerBase.receiveShadow = true;
centerGroup.add(centerBase);

const centerCap = new THREE.Mesh(
  new THREE.SphereGeometry(0.40, 18, 7, 0, Math.PI * 2, 0, Math.PI * 0.48),
  centerTopMaterial
);
centerCap.scale.y = 0.52;
centerCap.position.y = 0.10;
centerCap.castShadow = true;
centerGroup.add(centerCap);

const beadGeometry = new THREE.SphereGeometry(0.075, 7, 5);

function addBeadRing(count, radius, height, scale) {
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    const bead = new THREE.Mesh(
      beadGeometry,
      i % 4 === 0 ? beadDarkMaterial : beadMaterial
    );
    bead.position.set(
      Math.cos(angle) * radius,
      height + 0.012 * Math.sin(i * 2.4),
      Math.sin(angle) * radius
    );
    bead.scale.set(scale, scale * 0.84, scale);
    bead.rotation.set(i * 0.21, angle, i * 0.37);
    bead.castShadow = true;
    centerGroup.add(bead);
  }
}

addBeadRing(14, 0.32, 0.22, 0.92);
addBeadRing(9, 0.19, 0.28, 0.86);

const centralBead = new THREE.Mesh(beadGeometry, beadDarkMaterial);
centralBead.position.y = 0.33;
centralBead.scale.set(1.05, 0.9, 1.05);
centralBead.castShadow = true;
centerGroup.add(centralBead);

const stamenStemMaterial = new THREE.MeshStandardMaterial({
  color: 0xdca84d,
  roughness: 0.86,
  flatShading: true
});
const stemGeometry = new THREE.CylinderGeometry(0.018, 0.024, 0.31, 5);
const tipGeometry = new THREE.OctahedronGeometry(0.055, 0);

for (let i = 0; i < 20; i++) {
  const angle = (i / 20) * Math.PI * 2 + 0.11;
  const radius = 0.47 + 0.035 * Math.sin(i * 2.71);
  const stem = new THREE.Mesh(stemGeometry, stamenStemMaterial);
  stem.position.set(
    Math.cos(angle) * radius,
    0.18,
    Math.sin(angle) * radius
  );
  stem.rotation.z = Math.cos(angle) * 0.18;
  stem.rotation.x = -Math.sin(angle) * 0.18;
  stem.castShadow = true;
  centerGroup.add(stem);

  const tip = new THREE.Mesh(
    tipGeometry,
    i % 3 === 0 ? beadDarkMaterial : beadMaterial
  );
  tip.position.set(
    Math.cos(angle) * (radius + 0.045),
    0.35 + 0.018 * Math.sin(i * 1.9),
    Math.sin(angle) * (radius + 0.045)
  );
  tip.scale.set(1.05, 0.72, 1.05);
  tip.rotation.set(i, angle, i * 0.43);
  tip.castShadow = true;
  centerGroup.add(tip);
}

const undersideMaterial = new THREE.MeshStandardMaterial({
  color: 0xd997a4,
  roughness: 0.92,
  side: THREE.DoubleSide,
  flatShading: true
});

for (let i = 0; i < 8; i++) {
  const angle = (i / 8) * Math.PI * 2 + Math.PI / 8;
  const support = new THREE.Mesh(
    new THREE.ConeGeometry(0.17, 0.62, 4, 1, true),
    undersideMaterial
  );
  support.position.set(
    Math.cos(angle) * 0.40,
    0.11,
    Math.sin(angle) * 0.40
  );
  support.rotation.z = Math.cos(angle) * 0.72;
  support.rotation.x = -Math.sin(angle) * 0.72;
  support.rotation.y = -angle;
  support.castShadow = true;
  lotus.add(support);
}

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}

window.addEventListener('resize', resize);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  lotus.position.y = Math.sin(elapsed * 0.55) * 0.012;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
