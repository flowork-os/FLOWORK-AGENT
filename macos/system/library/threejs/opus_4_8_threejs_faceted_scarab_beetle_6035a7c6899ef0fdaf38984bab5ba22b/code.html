<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1112);
scene.fog = new THREE.Fog(0x0e1112, 0.55, 2.2);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.01, 50);
camera.position.set(0.145, 0.115, 0.235);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 0.10;
controls.maxDistance = 0.85;
controls.target.set(0, 0.026, 0);
controls.maxPolarAngle = Math.PI * 0.495;

/* ============================================================
   ENVIRONMENT — procedural gradient studio env for gem sparkle
   ============================================================ */
function makeEnvTexture() {
  const size = 512;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');

  // base vertical gradient (dark floor -> cool sky)
  const g = ctx.createLinearGradient(0, 0, 0, size);
  g.addColorStop(0.00, '#9fd8d0');
  g.addColorStop(0.30, '#3d6a6d');
  g.addColorStop(0.52, '#1a2427');
  g.addColorStop(0.75, '#0c1113');
  g.addColorStop(1.00, '#05080a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);

  // bright softboxes -> crisp specular highlights on facets
  const boxes = [
    { x: 0.18, y: 0.20, w: 0.26, h: 0.20, c: '#ffffff', a: 0.95 },
    { x: 0.62, y: 0.14, w: 0.20, h: 0.16, c: '#dff4ff', a: 0.80 },
    { x: 0.40, y: 0.40, w: 0.34, h: 0.10, c: '#8fe8d8', a: 0.55 },
    { x: 0.05, y: 0.55, w: 0.18, h: 0.12, c: '#ffcf8a', a: 0.50 },
    { x: 0.80, y: 0.52, w: 0.16, h: 0.14, c: '#ffb066', a: 0.42 }
  ];
  for (const b of boxes) {
    const cx = b.x * size, cy = b.y * size, rw = b.w * size, rh = b.h * size;
    const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rw, rh));
    rg.addColorStop(0, b.c);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = b.a;
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rw, rh, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envTex = makeEnvTexture();
const envRT = pmrem.fromEquirectangular(envTex);
scene.environment = envRT.texture;
envTex.dispose();
pmrem.dispose();

/* ============================================================
   LIGHTING — hemisphere + key/fill/rim, soft shadows
   ============================================================ */
scene.add(new THREE.HemisphereLight(0x8fd6cf, 0x101314, 0.55));

const key = new THREE.DirectionalLight(0xfff3e2, 3.1);
key.position.set(0.22, 0.34, 0.20);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.02;
key.shadow.camera.far = 1.4;
key.shadow.camera.left = -0.13;
key.shadow.camera.right = 0.13;
key.shadow.camera.top = 0.13;
key.shadow.camera.bottom = -0.13;
key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.0016;
key.shadow.radius = 3.2;
scene.add(key);

const fill = new THREE.DirectionalLight(0x7fd8e6, 0.95);
fill.position.set(-0.30, 0.16, 0.16);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffbf72, 1.5);
rim.position.set(-0.10, 0.20, -0.32);
scene.add(rim);

// small sparkle points that skim the facets as the beetle rotates
const sparkA = new THREE.PointLight(0xbdfff0, 0.55, 0.9, 2);
sparkA.position.set(0.10, 0.13, -0.09);
scene.add(sparkA);
const sparkB = new THREE.PointLight(0xffd7a0, 0.45, 0.9, 2);
sparkB.position.set(-0.11, 0.09, 0.10);
scene.add(sparkB);

/* ============================================================
   GROUND — shadow-only catcher + faint reflective pedestal ring
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(0.9, 96).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.5 })
);
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   MATERIALS — gemstone facets
   ============================================================ */
const shellMat = new THREE.MeshPhysicalMaterial({
  color: 0x0a5f4c,
  metalness: 0.22,
  roughness: 0.075,
  flatShading: true,
  clearcoat: 1.0,
  clearcoatRoughness: 0.045,
  reflectivity: 0.85,
  iridescence: 0.55,
  iridescenceIOR: 1.9,
  iridescenceThicknessRange: [120, 520],
  sheen: 0.35,
  sheenColor: new THREE.Color(0x66ffe0),
  envMapIntensity: 1.9
});

const shellMatTeal = new THREE.MeshPhysicalMaterial({
  color: 0x0b6f75,
  metalness: 0.24,
  roughness: 0.06,
  flatShading: true,
  clearcoat: 1.0,
  clearcoatRoughness: 0.04,
  iridescence: 0.6,
  iridescenceIOR: 2.0,
  iridescenceThicknessRange: [140, 560],
  envMapIntensity: 2.0
});

const bodyMat = new THREE.MeshPhysicalMaterial({
  color: 0x063a35,
  metalness: 0.35,
  roughness: 0.16,
  flatShading: true,
  clearcoat: 0.8,
  clearcoatRoughness: 0.12,
  envMapIntensity: 1.4
});

const goldMat = new THREE.MeshPhysicalMaterial({
  color: 0xc98b2a,
  metalness: 0.95,
  roughness: 0.14,
  flatShading: true,
  clearcoat: 0.7,
  clearcoatRoughness: 0.1,
  envMapIntensity: 2.1
});

const goldDeepMat = new THREE.MeshPhysicalMaterial({
  color: 0x8f5c15,
  metalness: 0.98,
  roughness: 0.22,
  flatShading: true,
  envMapIntensity: 1.8
});

const gemEyeMat = new THREE.MeshPhysicalMaterial({
  color: 0x18121a,
  metalness: 0.1,
  roughness: 0.02,
  flatShading: true,
  clearcoat: 1.0,
  clearcoatRoughness: 0.0,
  transmission: 0.35,
  thickness: 0.004,
  ior: 2.3,
  envMapIntensity: 2.6
});

const seamMat = new THREE.MeshBasicMaterial({ color: 0x0a1a18 });

/* ============================================================
   GEOMETRY HELPERS
   ============================================================ */

// Snap every vertex outward/inward onto a coarse angular lattice so smooth
// surfaces read as cut facets. Then convert to flat-shaded non-indexed.
function facetize(geo, opts = {}) {
  const { jitter = 0.0, quant = 0.0, seed = 1 } = opts;
  const g = geo.index ? geo.toNonIndexed() : geo;
  const pos = g.attributes.position;

  if (quant > 0 || jitter > 0) {
    // hash-based per-position displacement (shared verts get identical offsets
    // because the hash is keyed on quantized position)
    const v = new THREE.Vector3();
    const cache = new Map();
    const q = quant > 0 ? quant : 1e-6;
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      const kx = Math.round(v.x / q), ky = Math.round(v.y / q), kz = Math.round(v.z / q);
      const key = kx + '|' + ky + '|' + kz;
      let off = cache.get(key);
      if (!off) {
        let h = (kx * 374761393 + ky * 668265263 + kz * 2147483647 + seed * 971) | 0;
        h = (h ^ (h >>> 13)) * 1274126177;
        h = (h ^ (h >>> 16)) >>> 0;
        const r = (h % 10000) / 10000 - 0.5;
        off = 1 + r * jitter * 2;
        cache.set(key, off);
      }
      if (quant > 0) {
        v.set(kx * q, ky * q, kz * q);
      }
      v.multiplyScalar(off);
      pos.setXYZ(i, v.x, v.y, v.z);
    }
  }

  g.computeVertexNormals();
  g.deleteAttribute('uv');
  return g;
}

// Lathe-style faceted dome: a super-ellipsoid sampled on a coarse
// lat/long grid -> naturally produces crystal planes when flat-shaded.
function gemDome({
  rx = 1, ry = 1, rz = 1,
  seg = 12, rings = 7,
  ex = 2.2, ey = 2.6,          // super-ellipse exponents (plumpness)
  thetaStart = 0, thetaLength = Math.PI * 2,
  yMin = -1, yMax = 1,
  taperFront = 0, taperBack = 0,
  jitter = 0.02, seed = 3
} = {}) {
  const verts = [];
  const idx = [];
  const rand = mulberry(seed);

  for (let r = 0; r <= rings; r++) {
    const tv = r / rings;
    const yN = yMin + (yMax - yMin) * tv;                 // -1..1
    const phi = Math.asin(THREE.MathUtils.clamp(yN, -1, 1));
    const ring = Math.pow(Math.max(0, Math.cos(phi)), 2 / ex);
    const yy = Math.sign(yN) * Math.pow(Math.abs(yN), 2 / ey) * ry;

    for (let s = 0; s <= seg; s++) {
      const tu = s / seg;
      const th = thetaStart + thetaLength * tu;
      let x = Math.cos(th) * ring * rx;
      let z = Math.sin(th) * ring * rz;

      // taper: pinch the +Z (front) and -Z (back) ends
      const zf = z / rz;
      if (zf > 0) x *= (1 - taperFront * zf * zf);
      else x *= (1 - taperBack * zf * zf);

      const j = 1 + (rand() - 0.5) * jitter;
      verts.push(x * j, yy * j, z * j);
    }
  }

  const stride = seg + 1;
  for (let r = 0; r < rings; r++) {
    for (let s = 0; s < seg; s++) {
      const a = r * stride + s;
      const b = a + 1;
      const c = a + stride;
      const d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  g.setIndex(idx);
  const out = g.toNonIndexed();
  g.dispose();
  out.computeVertexNormals();
  return out;
}

function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Faceted "crystal shard" — tapered prism used for leg segments & horns.
function shard({ len = 1, r0 = 0.1, r1 = 0.05, sides = 5, twist = 0.4, bulge = 1.15 } = {}) {
  const g = new THREE.CylinderGeometry(r1, r0, len, sides, 2, false);
  const pos = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const t = (v.y / len) + 0.5;                     // 0 at base, 1 at tip
    const ang = twist * t;
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const x = v.x * ca - v.z * sa;
    const z = v.x * sa + v.z * ca;
    const b = 1 + (bulge - 1) * Math.sin(Math.PI * t);
    pos.setXYZ(i, x * b, v.y, z * b);
  }
  const out = g.toNonIndexed();
  g.dispose();
  out.computeVertexNormals();
  out.deleteAttribute('uv');
  return out;
}

// Sharp octahedral gem (used for eyes, accents, tarsal claws)
function gemChip(radius = 0.01, detail = 0) {
  const g = new THREE.OctahedronGeometry(radius, detail);
  const out = g.toNonIndexed();
  g.dispose();
  out.computeVertexNormals();
  out.deleteAttribute('uv');
  return out;
}

/* ============================================================
   THE BEETLE  (scale: real scarab ~ 32 mm long -> 0.032 world units = m)
   ============================================================ */
const beetle = new THREE.Group();
scene.add(beetle);

const L = 1.0;  // master scale multiplier (geometry authored in meters)

function addMesh(geo, mat, parent = beetle) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* ---------- ELYTRA: the domed, faceted wing cases ---------- */
// Each elytron is half of a plump faceted dome, mirrored across X.
function makeElytron(sign) {
  const g = gemDome({
    rx: 0.0125, ry: 0.0108, rz: 0.0182,
    seg: 13, rings: 8,
    ex: 2.5, ey: 2.15,
    thetaStart: sign > 0 ? -Math.PI / 2 : Math.PI / 2,
    thetaLength: Math.PI,
    yMin: -0.99, yMax: 0.985,
    taperFront: 0.22, taperBack: 0.62,
    jitter: 0.028, seed: sign > 0 ? 11 : 27
  });

  // squash the underside flat and push the shoulder up: gives the domed,
  // slightly overhanging scarab silhouette
  const pos = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    if (v.y < 0) v.y *= 0.30;                          // flat belly-side rim
    const zf = THREE.MathUtils.clamp(v.z / 0.0182, -1, 1);
    v.y += 0.0018 * (1 - zf * zf) * (v.y > -0.0005 ? 1 : 0.2);  // crown lift
    v.y -= 0.0026 * Math.max(0, -zf) * Math.max(0, -zf);        // rear droop
    // widen the shoulders (front third)
    const sh = Math.max(0, zf) ;
    v.x *= 1 + 0.10 * sh - 0.05 * Math.max(0, -zf);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}

const elyGroup = new THREE.Group();
elyGroup.position.set(0, 0.0138, -0.0022);
beetle.add(elyGroup);

const elyL = addMesh(makeElytron(+1), shellMat, elyGroup);
elyL.position.x = 0.00055;
const elyR = addMesh(makeElytron(-1), shellMatTeal, elyGroup);
elyR.position.x = -0.00055;

// crisp dark seam down the midline (the elytral suture)
const suture = addMesh(
  new THREE.BoxGeometry(0.0009, 0.0026, 0.0330),
  seamMat, elyGroup
);
suture.position.set(0, 0.0086, -0.0012);
suture.castShadow = false;

// faceted ridge crests running along each elytron — extra cut planes
const ridgeGeo = shard({ len: 0.026, r0: 0.0016, r1: 0.0007, sides: 3, twist: 0.5, bulge: 1.0 });
for (const s of [-1, 1]) {
  for (let k = 0; k < 3; k++) {
    const rg = addMesh(ridgeGeo, k % 2 ? shellMatTeal : shellMat, elyGroup);
    const off = 0.0035 + k * 0.0032;
    rg.position.set(s * off, 0.0086 - k * 0.0016, -0.0016 - k * 0.0008);
    rg.rotation.x = Math.PI / 2;
    rg.rotation.z = s * (0.08 + k * 0.05);
    rg.rotation.y = s * 0.05;
    rg.scale.set(1, 1 - k * 0.09, 1);
  }
}

/* ---------- PRONOTUM: the faceted thoracic shield ---------- */
const pronotumGeo = (() => {
  const g = gemDome({
    rx: 0.0128, ry: 0.0082, rz: 0.0088,
    seg: 12, rings: 6,
    ex: 2.6, ey: 2.0,
    yMin: -0.98, yMax: 0.97,
    taperFront: 0.42, taperBack: 0.06,
    jitter: 0.02, seed: 41
  });
  const pos = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    if (v.y < 0) v.y *= 0.34;
    v.y += 0.0012 * Math.max(0, 1 - Math.abs(v.z / 0.0088));
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
})();
const pronotum = addMesh(pronotumGeo, shellMat);
pronotum.position.set(0, 0.0132, 0.0163);
pronotum.rotation.x = -0.10;

// gold trim chips along the pronotum edge
const trimGeo = gemChip(0.0016, 0);
for (let i = 0; i < 7; i++) {
  const t = i / 6;
  const ang = -Math.PI * 0.42 + t * Math.PI * 0.84;
  for (const s of [-1, 1]) {
    if (i === 3 && s === -1) continue;
    const c = addMesh(trimGeo, goldMat);
    const r = 0.0128;
    c.position.set(
      s * Math.sin(ang) * r * 0.98,
      0.0128 + Math.cos(ang) * 0.0008,
      0.0163 + Math.cos(ang) * 0.0086 + 0.0004
    );
    c.scale.set(0.8, 0.55, 0.8);
    c.rotation.y = ang;
  }
}

/* ---------- SCUTELLUM: little triangular gem between the wing cases ---------- */
const scutellum = addMesh(shard({ len: 0.006, r0: 0.0028, r1: 0.0004, sides: 3, twist: 0, bulge: 1 }), goldMat);
scutellum.position.set(0, 0.0186, 0.0092);
scutellum.rotation.x = Math.PI / 2 + 0.35;
scutellum.rotation.y = Math.PI / 6;

/* ---------- HEAD + CLYPEUS (the fan-shaped scarab shovel) ---------- */
const headGroup = new THREE.Group();
headGroup.position.set(0, 0.0116, 0.0262);
headGroup.rotation.x = -0.16;
beetle.add(headGroup);

const headGeo = gemDome({
  rx: 0.0080, ry: 0.0052, rz: 0.0062,
  seg: 10, rings: 5,
  ex: 2.4, ey: 2.0,
  yMin: -0.97, yMax: 0.96,
  taperFront: 0.24, taperBack: 0.1,
  jitter: 0.022, seed: 77
});
{
  const pos = headGeo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    if (v.y < 0) v.y *= 0.4;
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  headGeo.computeVertexNormals();
}
addMesh(headGeo, goldMat, headGroup);

// clypeus: flattened faceted fan at the front, classic scarab rake
const clypeus = addMesh(
  facetize(new THREE.CylinderGeometry(0.0086, 0.0064, 0.0016, 7, 1), { jitter: 0.03, quant: 0, seed: 9 }),
  goldMat, headGroup
);
clypeus.position.set(0, -0.0006, 0.0052);
clypeus.rotation.x = Math.PI / 2 - 0.30;
clypeus.scale.set(1, 1, 0.62);

// rake teeth along the clypeus front edge
const toothGeo = shard({ len: 0.0034, r0: 0.0013, r1: 0.0002, sides: 3, twist: 0, bulge: 1 });
for (let i = -3; i <= 3; i++) {
  const t = i / 3;
  const th = addMesh(toothGeo, goldDeepMat, headGroup);
  th.position.set(t * 0.0068, -0.0011 - Math.abs(t) * 0.0004, 0.0090 - t * t * 0.0022);
  th.rotation.x = Math.PI / 2 - 0.22;
  th.rotation.z = t * 0.42;
}

// HORN — single upswept faceted amber horn
const horn = new THREE.Group();
horn.position.set(0, 0.0040, 0.0026);
headGroup.add(horn);
{
  const seg1 = addMesh(shard({ len: 0.0092, r0: 0.0030, r1: 0.0018, sides: 5, twist: 0.35, bulge: 1.06 }), goldMat, horn);
  seg1.position.set(0, 0.0046, 0);
  seg1.rotation.x = -0.38;

  const seg2 = addMesh(shard({ len: 0.0078, r0: 0.0018, r1: 0.0002, sides: 5, twist: 0.6, bulge: 1.0 }), goldMat, horn);
  seg2.position.set(0, 0.0106, -0.0026);
  seg2.rotation.x = -0.95;

  const tipGem = addMesh(gemChip(0.0016, 0), goldDeepMat, horn);
  tipGem.position.set(0, 0.0136, -0.0056);
  tipGem.scale.set(0.8, 1.5, 0.8);
  tipGem.rotation.y = 0.6;
}

// paired lateral horn-lets on the pronotum (scarab-style tubercles)
for (const s of [-1, 1]) {
  const t = addMesh(shard({ len: 0.0060, r0: 0.0022, r1: 0.0004, sides: 4, twist: 0.3, bulge: 1.0 }), goldMat);
  t.position.set(s * 0.0062, 0.0190, 0.0180);
  t.rotation.set(-0.55, 0, s * 0.42);
}

// EYES — dark faceted gems on the head sides
for (const s of [-1, 1]) {
  const e = addMesh(gemChip(0.0022, 1), gemEyeMat, headGroup);
  e.position.set(s * 0.0070, 0.0012, 0.0018);
  e.scale.set(0.72, 1.0, 1.15);
  e.rotation.y = s * 0.5;

  const brow = addMesh(gemChip(0.0014, 0), goldDeepMat, headGroup);
  brow.position.set(s * 0.0070, 0.0034, 0.0016);
  brow.scale.set(1.2, 0.4, 1.3);
}

// ANTENNAE — tiny lamellate gold clubs
for (const s of [-1, 1]) {
  const a = new THREE.Group();
  a.position.set(s * 0.0056, -0.0012, 0.0046);
  a.rotation.set(0.25, s * -0.7, s * -0.4);
  headGroup.add(a);
  const st = addMesh(shard({ len: 0.0044, r0: 0.0007, r1: 0.0005, sides: 4, twist: 0, bulge: 1 }), goldDeepMat, a);
  st.position.y = 0.0022;
  for (let k = 0; k < 3; k++) {
    const lam = addMesh(facetize(new THREE.BoxGeometry(0.0022, 0.0004, 0.0013)), goldMat, a);
    lam.position.set(0, 0.0048 + k * 0.0006, k * 0.0004);
    lam.rotation.z = 0.2 + k * 0.05;
  }
}

/* ---------- UNDERBODY / ABDOMEN ---------- */
const belly = addMesh(
  gemDome({
    rx: 0.0112, ry: 0.0060, rz: 0.0212,
    seg: 11, rings: 5,
    ex: 2.4, ey: 2.2,
    yMin: -0.98, yMax: 0.2,
    taperFront: 0.30, taperBack: 0.55,
    jitter: 0.02, seed: 55
  }),
  bodyMat
);
belly.position.set(0, 0.0122, -0.0010);

// segmented sternite plates on the underside
for (let i = 0; i < 4; i++) {
  const p = addMesh(facetize(new THREE.CylinderGeometry(0.0080 - i * 0.0012, 0.0074 - i * 0.0012, 0.0012, 6, 1), { jitter: 0.02, seed: 100 + i }), bodyMat);
  p.position.set(0, 0.0068 - i * 0.00012, -0.0040 - i * 0.0042);
  p.scale.set(1, 1, 0.55);
}

/* ---------- LEGS: six angular faceted amber-gold limbs ---------- */
const LEG_DEFS = [
  // [zAttach, yaw(out/forward), coxaY, femurLen, tibiaLen, spread, lift, tarsusLen]
  { z:  0.0168, yaw:  0.92, len1: 0.0118, len2: 0.0128, drop: -0.30, out: 0.62, tars: 0.0074 }, // fore
  { z:  0.0016, yaw:  0.10, len1: 0.0132, len2: 0.0142, drop: -0.22, out: 0.72, tars: 0.0082 }, // mid
  { z: -0.0136, yaw: -0.72, len1: 0.0146, len2: 0.0166, drop: -0.18, out: 0.66, tars: 0.0090 }  // hind
];

function buildLeg(def, s, index) {
  const leg = new THREE.Group();
  leg.position.set(s * 0.0090, 0.0092, def.z);
  leg.rotation.y = s * def.yaw;
  beetle.add(leg);

  // coxa — chunky faceted gem joint
  const coxa = addMesh(gemChip(0.0030, 0), goldDeepMat, leg);
  coxa.scale.set(1.0, 0.85, 1.0);
  coxa.rotation.y = 0.5;

  // femur
  const femurG = new THREE.Group();
  femurG.rotation.set(0, 0, s * -(0.55 + def.out * 0.45));
  femurG.rotation.x = def.drop;
  leg.add(femurG);

  const femur = addMesh(shard({ len: def.len1, r0: 0.0028, r1: 0.0018, sides: 5, twist: 0.35, bulge: 1.12 }), goldMat, femurG);
  femur.position.y = -def.len1 / 2;
  femur.rotation.y = s * 0.3;

  // knee gem
  const knee = new THREE.Group();
  knee.position.y = -def.len1;
  femurG.add(knee);
  const kneeGem = addMesh(gemChip(0.0022, 0), goldDeepMat, knee);
  kneeGem.scale.set(0.9, 1.0, 0.9);
  kneeGem.rotation.y = 0.7;

  // tibia — angled down/out, with the classic scarab spines
  const tibiaG = new THREE.Group();
  tibiaG.rotation.z = s * (0.62 - def.out * 0.15);
  tibiaG.rotation.x = -def.drop * 0.9 + 0.18;
  knee.add(tibiaG);

  const tibia = addMesh(shard({ len: def.len2, r0: 0.0019, r1: 0.0013, sides: 4, twist: 0.5, bulge: 1.0 }), goldMat, tibiaG);
  tibia.position.y = -def.len2 / 2;

  // outer spines / teeth on the tibia (digging rake)
  const spineGeo = shard({ len: 0.0036, r0: 0.0009, r1: 0.0001, sides: 3, twist: 0, bulge: 1 });
  const nSp = index === 0 ? 3 : 2;
  for (let k = 0; k < nSp; k++) {
    const sp = addMesh(spineGeo, goldDeepMat, tibiaG);
    sp.position.set(s * 0.0016, -def.len2 * (0.42 + k * 0.24), 0.0004);
    sp.rotation.z = s * -1.15;
    sp.rotation.x = 0.2;
    sp.scale.setScalar(1 - k * 0.12);
  }

  // tarsus — thin faceted foot ending in a claw chip
  const tarsG = new THREE.Group();
  tarsG.position.y = -def.len2;
  tarsG.rotation.x = 0.55;
  tarsG.rotation.z = s * -0.30;
  tibiaG.add(tarsG);

  const tars = addMesh(shard({ len: def.tars, r0: 0.0011, r1: 0.0005, sides: 4, twist: 0.4, bulge: 1.0 }), goldDeepMat, tarsG);
  tars.position.y = -def.tars / 2;

  const claw = addMesh(gemChip(0.0011, 0), goldMat, tarsG);
  claw.position.y = -def.tars - 0.0004;
  claw.scale.set(0.9, 1.6, 0.9);
  claw.rotation.y = 0.4;

  return leg;
}

for (const s of [-1, 1]) {
  LEG_DEFS.forEach((d, i) => buildLeg(d, s, i));
}

/* ---------- sparkle accents: tiny gem chips scattered on the elytra ---------- */
const accentGeo = gemChip(0.0011, 0);
const accentMat = new THREE.MeshPhysicalMaterial({
  color: 0x7dffe4,
  metalness: 0.1,
  roughness: 0.02,
  flatShading: true,
  clearcoat: 1,
  iridescence: 1,
  iridescenceIOR: 2.2,
  envMapIntensity: 3.0
});
const rnd = mulberry(1234);
for (let i = 0; i < 12; i++) {
  const s = i % 2 ? 1 : -1;
  const u = rnd();
  const a = addMesh(accentGeo, accentMat, elyGroup);
  a.position.set(
    s * (0.0028 + rnd() * 0.0075),
    0.0060 + rnd() * 0.0030,
    -0.0130 + u * 0.0245
  );
  a.scale.setScalar(0.55 + rnd() * 0.5);
  a.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3);
  a.castShadow = false;
}

/* ---------- ground contact: settle the beetle so claws touch y=0 ---------- */
beetle.updateMatrixWorld(true);
{
  const box = new THREE.Box3().setFromObject(beetle);
  beetle.position.y -= box.min.y;
  beetle.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(beetle);
  const c = b2.getCenter(new THREE.Vector3());
  beetle.position.x -= c.x;
  beetle.position.z -= c.z;
  controls.target.set(0, (b2.max.y - b2.min.y) * 0.48, 0);
}

/* ---------- faint pedestal disc under the beetle (subtle, non-competing) ---------- */
const pedestal = new THREE.Mesh(
  new THREE.CylinderGeometry(0.048, 0.052, 0.0022, 64, 1),
  new THREE.MeshStandardMaterial({
    color: 0x14191b, metalness: 0.55, roughness: 0.42, envMapIntensity: 0.7
  })
);
pedestal.position.y = -0.0012;
pedestal.receiveShadow = true;
scene.add(pedestal);

/* ============================================================
   LOOP
   ============================================================ */
const clock = new THREE.Clock();

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}
window.addEventListener('resize', onResize);

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // orbiting sparkle lights make the facets flash like cut stone
  sparkA.position.set(Math.cos(t * 0.7) * 0.11, 0.10 + Math.sin(t * 0.9) * 0.03, Math.sin(t * 0.7) * 0.11);
  sparkB.position.set(Math.cos(-t * 0.45 + 2.1) * 0.13, 0.075, Math.sin(-t * 0.45 + 2.1) * 0.13);

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
