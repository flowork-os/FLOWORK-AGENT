<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compact Pickup Truck</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe6ec; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6ec);
scene.fog = new THREE.Fog(0xdfe6ec, 22, 45);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.5, 3.4, 7.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.85, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 4;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI * 0.49;

// Lights
scene.add(new THREE.HemisphereLight(0xf3f7fb, 0x8b877d, 0.85));
const sun = new THREE.DirectionalLight(0xfff3e0, 2.2);
sun.position.set(6, 9, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -7; sun.shadow.camera.right = 7;
sun.shadow.camera.top = 7; sun.shadow.camera.bottom = -7;
sun.shadow.bias = -0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.5);
fill.position.set(-6, 4, -5);
scene.add(fill);

// Ground (soft shadow catcher)
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 64),
  new THREE.ShadowMaterial({ opacity: 0.28 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const disc = new THREE.Mesh(
  new THREE.CircleGeometry(6.2, 64),
  new THREE.MeshStandardMaterial({ color: 0xcbd5dd, roughness: 0.95, metalness: 0 })
);
disc.rotation.x = -Math.PI / 2;
disc.position.y = -0.005;
disc.receiveShadow = true;
scene.add(disc);

// Materials
const paint = new THREE.MeshStandardMaterial({ color: 0xb63b2e, roughness: 0.35, metalness: 0.55 });
const darkTrim = new THREE.MeshStandardMaterial({ color: 0x2a2c2e, roughness: 0.8, metalness: 0.1 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xd8dde2, roughness: 0.2, metalness: 0.95 });
const glass = new THREE.MeshStandardMaterial({ color: 0x9fc4d8, roughness: 0.1, metalness: 0.6, transparent: true, opacity: 0.55 });
const bedMat = new THREE.MeshStandardMaterial({ color: 0x3a3d40, roughness: 0.9, metalness: 0.05 });
const tireMat = new THREE.MeshStandardMaterial({ color: 0x1d1e1f, roughness: 0.95, metalness: 0 });
const hubMat = new THREE.MeshStandardMaterial({ color: 0xb9bec4, roughness: 0.3, metalness: 0.9 });
const lightMat = new THREE.MeshStandardMaterial({ color: 0xfff6c9, emissive: 0xffe28a, emissiveIntensity: 0.7, roughness: 0.3 });
const tailMat = new THREE.MeshStandardMaterial({ color: 0xa02020, emissive: 0x5a0d0d, emissiveIntensity: 0.6, roughness: 0.4 });

const truck = new THREE.Group();
scene.add(truck);
function box(w, h, d, mat, x, y, z, parent = truck) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}

// Dimensions: length ~4.9 (x), width 1.9 (z). Cab ~40%, bed ~60% of body behind hood.
const W = 1.9;

// Chassis / lower body running full length
box(4.9, 0.34, W, darkTrim, 0, 0.52, 0);          // frame + rocker band
// Hood (front section)
box(1.5, 0.42, W, paint, 1.66, 0.94, 0);           // hood block
box(1.5, 0.1, W - 0.25, paint, 1.62, 1.2, 0);      // hood top crown
// Fender bulges
box(0.95, 0.5, W + 0.14, paint, 1.55, 0.72, 0);    // front fenders
box(1.0, 0.5, W + 0.14, paint, -1.65, 0.72, 0);    // rear fenders

// Cab (two-door)
box(1.45, 0.5, W, paint, 0.42, 0.98, 0);           // cab base / doors
const cabTop = box(1.3, 0.62, W - 0.28, paint, 0.34, 1.54, 0); // roof shell
box(1.14, 0.5, W - 0.24, glass, 0.34, 1.5, 0);     // glasshouse (windshield/side/rear glass)
box(0.05, 0.55, W - 0.3, paint, 0.98, 1.5, 0);     // A-pillar face hint
// Door seams + handles
[-1, 1].forEach(s => {
  box(0.02, 0.44, 0.02, darkTrim, -0.28, 0.98, s * (W / 2 + 0.001));
  box(0.26, 0.05, 0.03, chrome, -0.05, 1.12, s * (W / 2 + 0.02));
  // Side mirrors
  box(0.06, 0.16, 0.12, darkTrim, 0.95, 1.42, s * (W / 2 + 0.12));
  box(0.16, 0.03, 0.03, darkTrim, 0.92, 1.34, s * (W / 2 + 0.05));
});

// Cargo bed (open box with tailgate) — behind cab
const bedX = -1.48, bedLen = 2.05, bedH = 0.55, wall = 0.07;
box(bedLen, 0.08, W, bedMat, bedX, 0.72, 0);                                  // bed floor
box(bedLen, bedH, wall, paint, bedX, 0.98, W / 2 - wall / 2);                  // left wall
box(bedLen, bedH, wall, paint, bedX, 0.98, -(W / 2 - wall / 2));               // right wall
box(wall, bedH, W, paint, bedX + bedLen / 2 - wall / 2, 0.98, 0);              // front bulkhead
const tailgate = box(wall + 0.02, bedH, W - 0.1, paint, bedX - bedLen / 2 + wall / 2, 0.98, 0); // tailgate
box(0.06, 0.05, 0.5, darkTrim, bedX - bedLen / 2 - 0.01, 1.18, 0);             // tailgate handle
// Bed rail caps
box(bedLen + 0.06, 0.05, 0.12, darkTrim, bedX, 1.28, W / 2 - 0.06);
box(bedLen + 0.06, 0.05, 0.12, darkTrim, bedX, 1.28, -(W / 2 - 0.06));
// Ribbed bed floor
for (let i = 0; i < 5; i++) box(0.05, 0.03, W - 0.2, darkTrim, bedX - 0.8 + i * 0.4, 0.78, 0);

// Front face: grille, bumper, headlights
box(0.08, 0.4, 1.3, darkTrim, 2.42, 0.92, 0);       // grille recess
for (let i = -2; i <= 2; i++) box(0.03, 0.34, 0.09, chrome, 2.47, 0.92, i * 0.24); // grille bars
box(0.14, 0.24, W + 0.1, chrome, 2.46, 0.55, 0);    // front bumper
box(0.1, 0.22, 0.34, lightMat, 2.44, 0.98, 0.74);   // headlights
box(0.1, 0.22, 0.34, lightMat, 2.44, 0.98, -0.74);
// Rear: bumper + taillights
box(0.12, 0.22, W + 0.08, chrome, -2.48, 0.55, 0);
box(0.06, 0.3, 0.16, tailMat, -2.53, 1.0, 0.82);
box(0.06, 0.3, 0.16, tailMat, -2.53, 1.0, -0.82);
// Plate
box(0.03, 0.16, 0.3, chrome, -2.55, 0.72, 0);

// Wheels: plausible wheelbase ~2.9, thick tires
const tireGeo = new THREE.TorusGeometry(0.3, 0.16, 20, 36);
const hubGeo = new THREE.CylinderGeometry(0.17, 0.17, 0.24, 24);
const spokeGeo = new THREE.BoxGeometry(0.26, 0.05, 0.05);
const wheels = [];
[[1.45, 1], [1.45, -1], [-1.45, 1], [-1.45, -1]].forEach(([x, s]) => {
  const w = new THREE.Group();
  const tire = new THREE.Mesh(tireGeo, tireMat);
  tire.castShadow = tire.receiveShadow = true;
  w.add(tire);
  const hub = new THREE.Mesh(hubGeo, hubMat);
  hub.rotation.x = Math.PI / 2;
  hub.castShadow = true;
  w.add(hub);
  for (let i = 0; i < 5; i++) {
    const sp = new THREE.Mesh(spokeGeo, hubMat);
    sp.rotation.z = (i / 5) * Math.PI * 2;
    sp.translateX(0.13);
    w.add(sp);
  }
  w.position.set(x, 0.46, s * (W / 2 + 0.03));
  w.rotation.x = s > 0 ? 0 : Math.PI; // keep hubs facing outward
  truck.add(w);
  wheels.push(w);
});

truck.position.y = 0;
truck.traverse(o => { if (o.isMesh) { o.castShadow = true; } });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  wheels.forEach(w => { w.rotation.z -= dt * 0.6; }); // slow idle wheel spin
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
