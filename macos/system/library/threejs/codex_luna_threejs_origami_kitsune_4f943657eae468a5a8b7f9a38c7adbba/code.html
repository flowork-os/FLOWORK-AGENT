<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origami Nine-Tail Fox</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #ead8bd;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xead8bd);
scene.fog = new THREE.Fog(0xead8bd, 8, 15);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.1, 2.8, 7.2);
camera.lookAt(0, 1.35, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 4.4;
controls.maxDistance = 10;
controls.target.set(0, 1.3, 0);

function createPaperTexture() {
  const canvas = document.createElement("canvas");
  canvas.width = 160;
  canvas.height = 160;
  const context = canvas.getContext("2d");
  context.fillStyle = "#fffaf0";
  context.fillRect(0, 0, 160, 160);
  for (let i = 0; i < 2500; i++) {
    const x = Math.random() * 160;
    const y = Math.random() * 160;
    const length = 2 + Math.random() * 8;
    const alpha = 0.025 + Math.random() * 0.055;
    context.strokeStyle = `rgba(110,82,52,${alpha})`;
    context.lineWidth = 0.35 + Math.random() * 0.55;
    context.beginPath();
    context.moveTo(x, y);
    context.lineTo(x + length, y + (Math.random() - 0.5) * 2);
    context.stroke();
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(2.5, 2.5);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

const paperTexture = createPaperTexture();
const vermilion = new THREE.MeshStandardMaterial({
  color: 0xc83e27,
  map: paperTexture,
  roughness: 0.88,
  metalness: 0,
  flatShading: true
});
const vermilionDark = new THREE.MeshStandardMaterial({
  color: 0x8f241d,
  map: paperTexture,
  roughness: 0.92,
  flatShading: true
});
const whitePaper = new THREE.MeshStandardMaterial({
  color: 0xf8eee0,
  map: paperTexture,
  roughness: 0.94,
  flatShading: true
});
const darkPaper = new THREE.MeshStandardMaterial({
  color: 0x251817,
  roughness: 0.72,
  flatShading: true
});
const creaseMaterial = new THREE.LineBasicMaterial({
  color: 0x6f201b,
  transparent: true,
  opacity: 0.76
});
const paleCreaseMaterial = new THREE.LineBasicMaterial({
  color: 0xb48b72,
  transparent: true,
  opacity: 0.75
});

function makePolyMesh(vertices, indices, material) {
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  const flatGeometry = geometry.toNonIndexed();
  flatGeometry.computeVertexNormals();
  geometry.dispose();
  const mesh = new THREE.Mesh(flatGeometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function makeCrease(start, end, material = creaseMaterial) {
  const geometry = new THREE.BufferGeometry().setFromPoints([start, end]);
  const line = new THREE.Line(geometry, material);
  line.frustumCulled = false;
  return line;
}

function addAngularLimb(parent, x, z, lean) {
  const limb = new THREE.Mesh(new THREE.BoxGeometry(0.23, 0.82, 0.27), vermilionDark);
  limb.position.set(x, 0.47, z);
  limb.rotation.z = lean;
  limb.castShadow = true;
  limb.receiveShadow = true;
  parent.add(limb);

  const paw = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.18, 0.38), whitePaper);
  paw.position.set(x + Math.sin(lean) * 0.08, 0.075, z + 0.025);
  paw.rotation.z = lean;
  paw.castShadow = true;
  paw.receiveShadow = true;
  parent.add(paw);

  const fold = makeCrease(
    new THREE.Vector3(x - 0.09, 0.83, z + 0.14),
    new THREE.Vector3(x + 0.06, 0.18, z + 0.15)
  );
  parent.add(fold);
}

function addTail(parent, start, direction, length, width, index) {
  const unit = direction.clone().normalize();
  const tailGroup = new THREE.Group();
  tailGroup.position.copy(start);
  tailGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), unit);

  const mainLength = length - 0.38;
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(width, width * 0.18, mainLength, 4, 1, false),
    index % 2 === 0 ? vermilion : vermilionDark
  );
  body.position.y = mainLength * 0.5;
  body.castShadow = true;
  body.receiveShadow = true;
  tailGroup.add(body);

  const tip = new THREE.Mesh(
    new THREE.ConeGeometry(width * 0.2, 0.38, 4, 1, false),
    whitePaper
  );
  tip.position.y = mainLength + 0.19;
  tip.castShadow = true;
  tip.receiveShadow = true;
  tailGroup.add(tip);

  const crease = makeCrease(
    new THREE.Vector3(-width * 0.02, 0.15, width * 0.72),
    new THREE.Vector3(0, mainLength - 0.08, width * 0.15),
    paleCreaseMaterial
  );
  tailGroup.add(crease);
  parent.add(tailGroup);
}

const fox = new THREE.Group();
fox.position.y = 0.05;
scene.add(fox);

const tailDirections = [
  new THREE.Vector3(-1.12, 0.78, -0.34),
  new THREE.Vector3(-0.86, 1.12, -0.38),
  new THREE.Vector3(-0.58, 1.34, -0.42),
  new THREE.Vector3(-0.28, 1.5, -0.45),
  new THREE.Vector3(0.02, 1.58, -0.48),
  new THREE.Vector3(0.32, 1.5, -0.45),
  new THREE.Vector3(0.62, 1.34, -0.42),
  new THREE.Vector3(0.91, 1.1, -0.37),
  new THREE.Vector3(1.17, 0.78, -0.31)
];

for (let i = 0; i < tailDirections.length; i++) {
  const baseX = -0.42 + i * 0.105;
  const base = new THREE.Vector3(baseX, 1.02 + Math.abs(i - 4) * 0.025, -0.38);
  addTail(fox, base, tailDirections[i], 2.5 - Math.abs(i - 4) * 0.08, 0.17, i);
}

const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.43, 1.25, 6, 1, false), vermilion);
torso.position.set(0, 1.02, 0);
torso.scale.set(0.92, 1, 0.72);
torso.rotation.z = -0.035;
torso.castShadow = true;
torso.receiveShadow = true;
fox.add(torso);

const chest = makePolyMesh(
  [
    -0.27, 1.53, 0.405,
     0.27, 1.53, 0.405,
     0.34, 0.72, 0.405,
     0.00, 0.53, 0.455,
    -0.34, 0.72, 0.405
  ],
  [0, 1, 2, 0, 2, 4, 4, 2, 3, 3, 2, 1],
  whitePaper
);
fox.add(chest);

addAngularLimb(fox, -0.34, 0.18, -0.08);
addAngularLimb(fox, 0.34, 0.18, 0.08);
addAngularLimb(fox, -0.39, -0.13, -0.12);
addAngularLimb(fox, 0.39, -0.13, 0.12);

const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.43, 0.5, 5, 1, false), vermilionDark);
neck.position.set(0, 1.7, 0);
neck.rotation.z = -0.03;
neck.castShadow = true;
neck.receiveShadow = true;
fox.add(neck);

const head = makePolyMesh(
  [
    -0.38, 2.16, -0.24,
     0.38, 2.16, -0.24,
     0.38, 1.78, -0.24,
    -0.38, 1.78, -0.24,
    -0.27, 2.05,  0.34,
     0.27, 2.05,  0.34,
     0.00, 1.78,  0.78,
    -0.20, 1.70,  0.36,
     0.20, 1.70,  0.36
  ],
  [
    0, 1, 5, 0, 5, 4,
    0, 4, 7, 0, 7, 3,
    1, 2, 8, 1, 8, 5,
    3, 7, 8, 3, 8, 2,
    4, 5, 6, 4, 6, 7,
    5, 8, 6, 7, 6, 8,
    2, 3, 8
  ],
  vermilion
);
fox.add(head);

const muzzleUnderside = makePolyMesh(
  [
    -0.20, 1.70, 0.375,
     0.20, 1.70, 0.375,
     0.00, 1.78, 0.79,
     0.00, 1.60, 0.45
  ],
  [0, 1, 2, 0, 3, 1, 1, 3, 2, 2, 3, 0],
  whitePaper
);
fox.add(muzzleUnderside);

const nose = new THREE.Mesh(new THREE.TetrahedronGeometry(0.105, 0), darkPaper);
nose.position.set(0, 1.76, 0.79);
nose.scale.set(1.05, 0.72, 0.72);
nose.castShadow = true;
fox.add(nose);

function addEar(side) {
  const x = side * 0.25;
  const ear = makePolyMesh(
    [
      x - side * 0.18, 2.08, -0.18,
      x + side * 0.18, 2.08, -0.18,
      x + side * 0.12, 2.08,  0.18,
      x, 2.84, -0.03
    ],
    [0, 1, 2, 0, 3, 1, 1, 3, 2, 2, 3, 0],
    vermilion
  );
  fox.add(ear);

  const inner = makePolyMesh(
    [
      x - side * 0.075, 2.16, 0.185,
      x + side * 0.075, 2.16, 0.185,
      x, 2.68, 0.185
    ],
    [0, 1, 2],
    whitePaper
  );
  fox.add(inner);

  fox.add(makeCrease(
    new THREE.Vector3(x - side * 0.16, 2.1, 0.195),
    new THREE.Vector3(x, 2.77, 0.02)
  ));
  fox.add(makeCrease(
    new THREE.Vector3(x + side * 0.14, 2.1, 0.195),
    new THREE.Vector3(x, 2.77, 0.02),
    paleCreaseMaterial
  ));
}

addEar(-1);
addEar(1);

const eyeGeometry = new THREE.TetrahedronGeometry(0.105, 0);
const leftEye = new THREE.Mesh(eyeGeometry, darkPaper);
leftEye.position.set(-0.235, 2.02, 0.37);
leftEye.rotation.y = -0.18;
leftEye.scale.set(0.75, 1.15, 0.35);
leftEye.castShadow = true;
fox.add(leftEye);

const rightEye = new THREE.Mesh(eyeGeometry, darkPaper);
rightEye.position.set(0.235, 2.02, 0.37);
rightEye.rotation.y = 0.18;
rightEye.scale.set(0.75, 1.15, 0.35);
rightEye.castShadow = true;
fox.add(rightEye);

fox.add(makeCrease(
  new THREE.Vector3(-0.29, 2.13, 0.39),
  new THREE.Vector3(-0.04, 1.82, 0.76)
));
fox.add(makeCrease(
  new THREE.Vector3(0.29, 2.13, 0.39),
  new THREE.Vector3(0.04, 1.82, 0.76)
));
fox.add(makeCrease(
  new THREE.Vector3(-0.02, 2.16, 0.405),
  new THREE.Vector3(0.02, 1.78, 0.78),
  paleCreaseMaterial
));

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 64),
  new THREE.MeshStandardMaterial({ color: 0xdcc5a4, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.045;
ground.receiveShadow = true;
scene.add(ground);

const hemisphere = new THREE.HemisphereLight(0xfff4df, 0x6e443c, 2.25);
scene.add(hemisphere);

const keyLight = new THREE.DirectionalLight(0xfff0d1, 4.1);
keyLight.position.set(-4.5, 7.5, 5.2);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 2048;
keyLight.shadow.mapSize.height = 2048;
keyLight.shadow.camera.left = -4;
keyLight.shadow.camera.right = 4;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 16;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xc9dcff, 1.7);
rimLight.position.set(4, 4, -5);
scene.add(rimLight);

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.addEventListener("resize", resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
