<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carved Wooden Chess Knight</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171411;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 20px;
      bottom: 17px;
      color: rgba(245, 224, 194, 0.7);
      font: 11px/1.4 Georgia, serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Staunton Knight · Carved Walnut</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x171411);
    scene.fog = new THREE.FogExp2(0x171411, 0.032);

    const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(7.2, 4.8, 7.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.15, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.72;
    controls.minDistance = 5.5;
    controls.maxDistance = 15;
    controls.maxPolarAngle = Math.PI * 0.49;

    function woodMaterial(base, roughness = 0.42, grainScale = 1.0) {
      const material = new THREE.MeshStandardMaterial({
        color: base,
        roughness,
        metalness: 0.02
      });
      material.onBeforeCompile = shader => {
        shader.uniforms.grainScale = { value: grainScale };
        shader.vertexShader = shader.vertexShader
          .replace(
            '#include <common>',
            '#include <common>\nvarying vec3 vWoodPosition;'
          )
          .replace(
            '#include <begin_vertex>',
            '#include <begin_vertex>\nvWoodPosition = position;'
          );
        shader.fragmentShader = shader.fragmentShader
          .replace(
            '#include <common>',
            '#include <common>\nvarying vec3 vWoodPosition;\nuniform float grainScale;'
          )
          .replace(
            '#include <color_fragment>',
            `#include <color_fragment>
            float radial = length(vWoodPosition.xz);
            float sweep = sin(vWoodPosition.y * 19.0 * grainScale + radial * 12.0);
            float fineGrain = sin(vWoodPosition.y * 43.0 * grainScale + vWoodPosition.x * 7.0 + sin(vWoodPosition.z * 11.0) * 1.7);
            float broadGrain = sin(vWoodPosition.y * 7.5 + radial * 5.0);
            float grain = 0.055 * sweep + 0.025 * fineGrain + 0.035 * broadGrain;
            diffuseColor.rgb *= 1.0 + grain;`
          );
      };
      material.customProgramCacheKey = () => `wood-${base}-${roughness}-${grainScale}`;
      return material;
    }

    const walnut = woodMaterial(0x9b572d, 0.38, 0.8);
    const walnutDark = woodMaterial(0x63351f, 0.45, 1.15);
    const cutWood = woodMaterial(0xb86d38, 0.4, 0.95);
    const recessMaterial = new THREE.MeshStandardMaterial({
      color: 0x1b0d08,
      roughness: 0.58,
      metalness: 0
    });
    const eyeMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x130b08,
      roughness: 0.16,
      metalness: 0.05,
      clearcoat: 0.65,
      clearcoatRoughness: 0.12
    });

    const knight = new THREE.Group();
    scene.add(knight);

    function addMesh(geometry, material, parent = knight) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    const baseProfile = [
      [0.00, 0.08], [0.62, 0.08], [0.91, 0.12], [1.08, 0.22],
      [1.16, 0.36], [1.13, 0.49], [1.02, 0.59], [0.88, 0.65],
      [0.84, 0.75], [0.91, 0.84], [0.92, 0.94], [0.84, 1.03],
      [0.65, 1.10], [0.54, 1.19], [0.49, 1.35], [0.47, 1.49],
      [0.00, 1.49]
    ].map(([x, y]) => new THREE.Vector2(x, y));

    addMesh(new THREE.LatheGeometry(baseProfile, 96), walnut);

    const lowerRing = addMesh(new THREE.TorusGeometry(1.02, 0.055, 14, 96), cutWood);
    lowerRing.rotation.x = Math.PI / 2;
    lowerRing.position.y = 0.56;

    const upperRing = addMesh(new THREE.TorusGeometry(0.84, 0.045, 12, 96), cutWood);
    upperRing.rotation.x = Math.PI / 2;
    upperRing.position.y = 0.86;

    const collar = addMesh(new THREE.CylinderGeometry(0.53, 0.60, 0.18, 64), walnut);
    collar.position.y = 1.43;

    const collarRing = addMesh(new THREE.TorusGeometry(0.55, 0.045, 12, 72), cutWood);
    collarRing.rotation.x = Math.PI / 2;
    collarRing.position.y = 1.51;

    const profile = new THREE.Shape();
    profile.moveTo(-0.45, 1.47);
    profile.bezierCurveTo(-0.53, 1.77, -0.53, 2.12, -0.60, 2.48);
    profile.bezierCurveTo(-0.69, 2.91, -0.86, 3.25, -0.66, 3.73);
    profile.lineTo(-0.65, 4.27);
    profile.quadraticCurveTo(-0.61, 4.40, -0.50, 4.27);
    profile.lineTo(-0.29, 4.00);
    profile.bezierCurveTo(-0.03, 4.02, 0.20, 3.88, 0.34, 3.63);
    profile.bezierCurveTo(0.52, 3.39, 0.91, 3.20, 1.02, 2.93);
    profile.bezierCurveTo(1.12, 2.72, 1.05, 2.52, 0.87, 2.43);
    profile.bezierCurveTo(0.68, 2.35, 0.38, 2.39, 0.23, 2.53);
    profile.bezierCurveTo(0.11, 2.40, -0.02, 2.24, 0.00, 2.03);
    profile.bezierCurveTo(0.02, 1.80, 0.25, 1.62, 0.43, 1.47);
    profile.closePath();

    const bodyGeometry = new THREE.ExtrudeGeometry(profile, {
      depth: 0.62,
      bevelEnabled: true,
      bevelSegments: 5,
      steps: 2,
      bevelSize: 0.095,
      bevelThickness: 0.09,
      curveSegments: 22
    });
    bodyGeometry.translate(0, 0, -0.31);
    bodyGeometry.computeVertexNormals();
    addMesh(bodyGeometry, walnut);

    const chestShape = new THREE.Shape();
    chestShape.moveTo(-0.02, 1.51);
    chestShape.bezierCurveTo(0.31, 1.67, 0.41, 1.88, 0.35, 2.12);
    chestShape.bezierCurveTo(0.30, 2.29, 0.22, 2.43, 0.14, 2.54);
    chestShape.bezierCurveTo(0.02, 2.34, -0.10, 2.11, -0.10, 1.83);
    chestShape.closePath();
    const chestGeometry = new THREE.ExtrudeGeometry(chestShape, {
      depth: 0.68,
      bevelEnabled: true,
      bevelSegments: 3,
      bevelSize: 0.035,
      bevelThickness: 0.035,
      curveSegments: 12
    });
    chestGeometry.translate(0, 0, -0.34);
    addMesh(chestGeometry, cutWood);

    const maneShape = new THREE.Shape();
    maneShape.moveTo(-0.63, 3.88);
    maneShape.bezierCurveTo(-0.84, 3.53, -0.87, 3.12, -0.69, 2.72);
    maneShape.bezierCurveTo(-0.59, 2.47, -0.55, 2.22, -0.52, 1.96);
    maneShape.lineTo(-0.38, 2.18);
    maneShape.bezierCurveTo(-0.45, 2.62, -0.46, 3.15, -0.34, 3.72);
    maneShape.closePath();

    function addSideRelief(shape, depth, z, material) {
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth,
        bevelEnabled: true,
        bevelSegments: 2,
        bevelSize: 0.025,
        bevelThickness: 0.025,
        curveSegments: 15
      });
      geometry.translate(0, 0, z);
      return addMesh(geometry, material);
    }

    addSideRelief(maneShape, 0.075, 0.325, walnutDark);
    addSideRelief(maneShape, 0.075, -0.400, walnutDark);

    const jawShape = new THREE.Shape();
    jawShape.moveTo(0.18, 2.55);
    jawShape.bezierCurveTo(0.36, 2.43, 0.65, 2.40, 0.87, 2.48);
    jawShape.bezierCurveTo(0.73, 2.60, 0.48, 2.68, 0.22, 2.69);
    jawShape.closePath();
    addSideRelief(jawShape, 0.055, 0.375, walnutDark);
    addSideRelief(jawShape, 0.055, -0.430, walnutDark);

    const earShape = new THREE.Shape();
    earShape.moveTo(-0.43, 4.02);
    earShape.lineTo(-0.24, 4.48);
    earShape.quadraticCurveTo(-0.17, 4.56, -0.14, 4.43);
    earShape.lineTo(-0.16, 4.02);
    earShape.closePath();
    addSideRelief(earShape, 0.29, -0.20, walnutDark);

    const innerEarShape = new THREE.Shape();
    innerEarShape.moveTo(-0.31, 4.15);
    innerEarShape.lineTo(-0.23, 4.39);
    innerEarShape.lineTo(-0.21, 4.13);
    innerEarShape.closePath();
    addSideRelief(innerEarShape, 0.025, 0.115, recessMaterial);

    function addEye(z, side) {
      const socket = addMesh(new THREE.SphereGeometry(0.115, 28, 18), walnutDark);
      socket.position.set(0.05, 3.57, z);
      socket.scale.set(1.15, 0.85, 0.35);

      const eye = addMesh(new THREE.SphereGeometry(0.067, 24, 16), eyeMaterial);
      eye.position.set(0.07, 3.58, z + side * 0.045);
      eye.scale.set(1.05, 0.95, 0.42);

      const glint = addMesh(
        new THREE.SphereGeometry(0.014, 12, 8),
        new THREE.MeshBasicMaterial({ color: 0xffe7c5 })
      );
      glint.position.set(0.086, 3.606, z + side * 0.075);
    }
    addEye(0.37, 1);
    addEye(-0.37, -1);

    function addNostril(z, side) {
      const nostril = addMesh(new THREE.SphereGeometry(0.07, 20, 12), recessMaterial);
      nostril.position.set(0.86, 2.83, z);
      nostril.scale.set(1.35, 0.52, 0.30);
      nostril.rotation.z = -0.22;
      nostril.position.z += side * 0.012;
    }
    addNostril(0.36, 1);
    addNostril(-0.36, -1);

    function tubeAlong(points, radius, material) {
      const curve = new THREE.CatmullRomCurve3(points);
      return addMesh(new THREE.TubeGeometry(curve, 28, radius, 7, false), material);
    }

    for (const side of [-1, 1]) {
      const z = side * 0.405;
      tubeAlong([
        new THREE.Vector3(-0.55, 3.69, z),
        new THREE.Vector3(-0.66, 3.43, z),
        new THREE.Vector3(-0.67, 3.15, z),
        new THREE.Vector3(-0.60, 2.88, z)
      ], 0.018, recessMaterial);

      tubeAlong([
        new THREE.Vector3(-0.56, 3.18, z),
        new THREE.Vector3(-0.57, 2.93, z),
        new THREE.Vector3(-0.53, 2.69, z),
        new THREE.Vector3(-0.49, 2.47, z)
      ], 0.015, recessMaterial);

      tubeAlong([
        new THREE.Vector3(0.22, 2.56, z),
        new THREE.Vector3(0.43, 2.51, z),
        new THREE.Vector3(0.66, 2.50, z),
        new THREE.Vector3(0.83, 2.54, z)
      ], 0.013, recessMaterial);

      tubeAlong([
        new THREE.Vector3(0.13, 3.50, z),
        new THREE.Vector3(0.34, 3.41, z),
        new THREE.Vector3(0.55, 3.28, z)
      ], 0.012, walnutDark);
    }

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x3a2d24,
      roughness: 0.8,
      metalness: 0
    });
    const floor = new THREE.Mesh(new THREE.CircleGeometry(15, 128), floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    floor.receiveShadow = true;
    scene.add(floor);

    const inset = new THREE.Mesh(
      new THREE.RingGeometry(2.15, 2.19, 128),
      new THREE.MeshStandardMaterial({ color: 0x5b4433, roughness: 0.72 })
    );
    inset.rotation.x = -Math.PI / 2;
    inset.position.y = 0.003;
    inset.receiveShadow = true;
    scene.add(inset);

    const hemi = new THREE.HemisphereLight(0xffdfb8, 0x251c1a, 1.65);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xffd1a0, 4.2);
    key.position.set(4.5, 8, 5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -4;
    key.shadow.camera.right = 4;
    key.shadow.camera.top = 6;
    key.shadow.camera.bottom = -2;
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 18;
    key.shadow.bias = -0.00025;
    key.shadow.normalBias = 0.025;
    scene.add(key);

    const rim = new THREE.SpotLight(0xd69d72, 80, 18, Math.PI / 6, 0.5, 1.5);
    rim.position.set(-5, 6, -5);
    rim.target.position.set(0, 2.5, 0);
    scene.add(rim, rim.target);

    const fill = new THREE.PointLight(0x879dc0, 7, 10, 2);
    fill.position.set(3, 2.4, -4);
    scene.add(fill);

    const warmBounce = new THREE.PointLight(0xb25f2e, 5, 6, 2);
    warmBounce.position.set(-2.4, 1.0, 2.2);
    scene.add(warmBounce);

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    }
    addEventListener('resize', resize);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      knight.position.y = Math.sin(elapsed * 0.45) * 0.004;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
