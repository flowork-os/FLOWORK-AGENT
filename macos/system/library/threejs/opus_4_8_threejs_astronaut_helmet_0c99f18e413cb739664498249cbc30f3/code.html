<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astronaut Helmet — Procedural three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0d10; }
  #app { position: fixed; inset: 0; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 -apple-system, Segoe UI, Roboto, sans-serif;
    color: rgba(255,255,255,0.45); letter-spacing: .3px; user-select: none;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hint">EVA HELMET · MK-IV — drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ */
/* Renderer                                                            */
/* ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

/* ------------------------------------------------------------------ */
/* Scene + camera                                                      */
/* ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101216);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3.1, 2.35, 4.0);

// Procedural studio environment for crisp reflections on the gold visor / metal.
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;

/* ------------------------------------------------------------------ */
/* Lighting: hemisphere fill + key / fill / rim directionals           */
/* ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xbcd2ff, 0x1a1712, 0.55);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffffff, 3.0);
keyLight.position.set(4.5, 6.5, 4.0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 25;
keyLight.shadow.camera.left = -4;
keyLight.shadow.camera.right = 4;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.radius = 4;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x9fc0ff, 0.75);
fillLight.position.set(-5.5, 2.2, 2.5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffe6c2, 2.2);
rimLight.position.set(-3.0, 3.5, -5.5);
scene.add(rimLight);

/* ------------------------------------------------------------------ */
/* Shadow-catching ground plane (invisible except for shadows)         */
/* ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 64),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ */
/* Materials                                                           */
/* ------------------------------------------------------------------ */
const shellMat = new THREE.MeshPhysicalMaterial({
  color: 0xf3f4f6, roughness: 0.5, metalness: 0.04,
  clearcoat: 0.5, clearcoatRoughness: 0.35, envMapIntensity: 0.8
});

const linerMat = new THREE.MeshStandardMaterial({
  color: 0x14161b, roughness: 0.95, metalness: 0.0, side: THREE.BackSide
});

const gasketMat = new THREE.MeshStandardMaterial({
  color: 0x0c0d10, roughness: 0.75, metalness: 0.1
});

const visorMat = new THREE.MeshPhysicalMaterial({
  color: 0xffb347, metalness: 1.0, roughness: 0.06,
  clearcoat: 1.0, clearcoatRoughness: 0.04, envMapIntensity: 1.8
});

const steelMat = new THREE.MeshStandardMaterial({
  color: 0xc3c7cc, roughness: 0.32, metalness: 1.0, envMapIntensity: 1.3
});

const darkSteelMat = new THREE.MeshStandardMaterial({
  color: 0x6d7278, roughness: 0.4, metalness: 1.0, envMapIntensity: 1.1
});

const plasticMat = new THREE.MeshStandardMaterial({
  color: 0x1b1e24, roughness: 0.5, metalness: 0.3, envMapIntensity: 0.7
});

const seamMat = new THREE.MeshStandardMaterial({
  color: 0x33363c, roughness: 0.6, metalness: 0.4
});

const lensMat = new THREE.MeshStandardMaterial({
  color: 0x0a2233, emissive: 0x39c6ff, emissiveIntensity: 2.2, roughness: 0.25, metalness: 0.0
});

const tipMat = new THREE.MeshStandardMaterial({
  color: 0x330000, emissive: 0xff3322, emissiveIntensity: 3.0, roughness: 0.4
});

/* ------------------------------------------------------------------ */
/* Helmet group (built in local coords centered on the dome sphere)    */
/* ------------------------------------------------------------------ */
const R = 1.0;                     // dome radius
const helmet = new THREE.Group();
scene.add(helmet);

// Sphere surface point matching THREE.SphereGeometry parameterization.
function spherePoint(r, theta, phi) {
  return new THREE.Vector3(
    -r * Math.cos(phi) * Math.sin(theta),
     r * Math.cos(theta),
     r * Math.sin(phi) * Math.sin(theta)
  );
}
function placeOnSurface(obj, theta, phi, r) {
  const p = spherePoint(r, theta, phi);
  obj.position.copy(p);
  obj.lookAt(p.clone().multiplyScalar(2)); // local +Z points radially outward
}

// --- Main hard-shell dome (open at the neck) ---------------------------
const shell = new THREE.Mesh(
  new THREE.SphereGeometry(R, 96, 72, 0, Math.PI * 2, 0, 2.5),
  shellMat
);
shell.castShadow = true;
shell.receiveShadow = true;
helmet.add(shell);

// Dark interior liner seen through the neck / around the visor edge.
const liner = new THREE.Mesh(
  new THREE.SphereGeometry(R * 0.93, 48, 36, 0, Math.PI * 2, 0, 2.55),
  linerMat
);
helmet.add(liner);

// --- Visor: dark gasket frame + proud gold reflective bubble ----------
const phiC = Math.PI / 2;          // front = +Z

const gasket = new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.006, 96, 64, phiC - 1.36, 2.72, 0.92, 1.34),
  gasketMat
);
gasket.castShadow = true;
helmet.add(gasket);

const visor = new THREE.Mesh(
  new THREE.SphereGeometry(R * 1.03, 96, 64, phiC - 1.26, 2.52, 1.0, 1.16),
  visorMat
);
visor.castShadow = true;
helmet.add(visor);

// --- Panel seams ------------------------------------------------------
function latSeam(theta, tube = 0.011) {
  const r = R * Math.sin(theta), y = R * Math.cos(theta);
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 10, 140), seamMat);
  m.rotation.x = Math.PI / 2;
  m.position.y = y;
  helmet.add(m);
  return m;
}
latSeam(0.62);         // upper crown seam
latSeam(2.34, 0.014);  // lower / neck-area seam

// Crown seam running ear-to-ear over the top (XY plane, avoids the visor).
const crown = new THREE.Mesh(new THREE.TorusGeometry(R, 0.011, 10, 160), seamMat);
crown.rotation.z = 0; // lies in XY plane, passes through ±X and top
helmet.add(crown);

// --- Rivets -----------------------------------------------------------
const rivetGeo = new THREE.SphereGeometry(0.018, 14, 12);
function rivet(theta, phi, r = R + 0.006) {
  const m = new THREE.Mesh(rivetGeo, steelMat);
  m.position.copy(spherePoint(r, theta, phi));
  m.castShadow = true;
  helmet.add(m);
}
// rivets around the neck seam
for (let i = 0; i < 18; i++) rivet(2.34, (i / 18) * Math.PI * 2);
// rivets along the crown arc (over the top, XY plane)
for (let i = 0; i <= 9; i++) {
  const a = THREE.MathUtils.lerp(0.28 * Math.PI, 0.72 * Math.PI, i / 9);
  const m = new THREE.Mesh(rivetGeo, steelMat);
  m.position.set(R * Math.cos(a), R * Math.sin(a), 0);
  m.castShadow = true;
  helmet.add(m);
}

/* ------------------------------------------------------------------ */
/* Side-mounted light housing (left) + antenna (right)                 */
/* ------------------------------------------------------------------ */
// Light housing
const lightHousing = new THREE.Group();
const lhBody = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.19, 0.12), plasticMat);
lhBody.castShadow = true;
lightHousing.add(lhBody);
const lhRing = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.018, 16, 32), darkSteelMat);
lhRing.position.z = 0.065;
lightHousing.add(lhRing);
const lhLens = new THREE.Mesh(new THREE.CircleGeometry(0.07, 32), lensMat);
lhLens.position.z = 0.067;
lightHousing.add(lhLens);
placeOnSurface(lightHousing, 1.32, 0.34, R - 0.02);
helmet.add(lightHousing);
// a little glow to sell the emissive lens
const lampGlow = new THREE.PointLight(0x39c6ff, 2.0, 2.2, 2);
lampGlow.position.copy(spherePoint(R + 0.12, 1.32, 0.34));
helmet.add(lampGlow);

// Antenna assembly
const antenna = new THREE.Group();
const antBase = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.09, 0.08, 24), darkSteelMat);
antBase.rotation.x = Math.PI / 2; // axis along +Z (outward)
antBase.position.z = 0.04;
antBase.castShadow = true;
antenna.add(antBase);
const antRod = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.02, 0.62, 16), steelMat);
antRod.rotation.x = Math.PI / 2;
antRod.position.z = 0.08 + 0.31;
antRod.castShadow = true;
antenna.add(antRod);
const antTip = new THREE.Mesh(new THREE.SphereGeometry(0.032, 20, 16), tipMat);
antTip.position.z = 0.08 + 0.62;
antenna.add(antTip);
placeOnSurface(antenna, 0.72, Math.PI - 0.30, R - 0.02);
// tilt the antenna slightly upward for a dynamic silhouette
antenna.rotateX(-0.35);
helmet.add(antenna);

// Small vent grille under the chin (front-bottom)
const vent = new THREE.Group();
const ventPlate = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.11, 0.05), darkSteelMat);
ventPlate.castShadow = true;
vent.add(ventPlate);
for (let i = -2; i <= 2; i++) {
  const bar = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.012, 0.012), plasticMat);
  bar.position.set(0, i * 0.022, 0.028);
  vent.add(bar);
}
placeOnSurface(vent, 2.18, Math.PI / 2, R - 0.005);
helmet.add(vent);

/* ------------------------------------------------------------------ */
/* Metal neck-ring connector at the base                               */
/* ------------------------------------------------------------------ */
const neck = new THREE.Group();
helmet.add(neck);

const neckOpenTheta = 2.5;
const neckR = R * Math.sin(neckOpenTheta);        // ~0.60
const neckY = R * Math.cos(neckOpenTheta);        // ~-0.80

const neckRing = new THREE.Mesh(new THREE.TorusGeometry(neckR, 0.065, 24, 96), steelMat);
neckRing.rotation.x = Math.PI / 2;
neckRing.position.y = neckY;
neckRing.castShadow = true;
neck.add(neckRing);

const collar = new THREE.Mesh(
  new THREE.CylinderGeometry(neckR * 0.98, neckR * 0.92, 0.20, 64, 1, true),
  darkSteelMat
);
collar.position.y = neckY - 0.09;
collar.castShadow = true;
neck.add(collar);

const collarLip = new THREE.Mesh(new THREE.TorusGeometry(neckR * 0.94, 0.03, 20, 80), steelMat);
collarLip.rotation.x = Math.PI / 2;
collarLip.position.y = neckY - 0.19;
neck.add(collarLip);

// Locking bolts around the neck ring
const boltGeo = new THREE.CylinderGeometry(0.028, 0.028, 0.05, 6);
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * Math.PI * 2;
  const b = new THREE.Mesh(boltGeo, darkSteelMat);
  b.position.set(Math.cos(a) * neckR, neckY, Math.sin(a) * neckR);
  b.rotation.x = Math.PI / 2;
  b.castShadow = true;
  neck.add(b);
}

// Lift the whole helmet so it sits on the stand.
const HELMET_Y = 1.9;
helmet.position.y = HELMET_Y;

/* ------------------------------------------------------------------ */
/* Display stand                                                       */
/* ------------------------------------------------------------------ */
const stand = new THREE.Group();
scene.add(stand);

const standMat = new THREE.MeshStandardMaterial({
  color: 0x2a2d33, roughness: 0.35, metalness: 0.85, envMapIntensity: 1.0
});

const base = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.28, 0.12, 64), standMat);
base.position.y = 0.06;
base.castShadow = true;
base.receiveShadow = true;
stand.add(base);

const baseTrim = new THREE.Mesh(new THREE.TorusGeometry(1.15, 0.03, 16, 96), steelMat);
baseTrim.rotation.x = Math.PI / 2;
baseTrim.position.y = 0.12;
stand.add(baseTrim);

const neckBottomWorld = HELMET_Y + (neckY - 0.19);   // ~0.91
const postTop = neckBottomWorld - 0.02;
const postH = postTop - 0.12;
const post = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.1, postH, 40), standMat);
post.position.y = 0.12 + postH / 2;
post.castShadow = true;
stand.add(post);

const cradle = new THREE.Mesh(new THREE.TorusGeometry(neckR * 0.9, 0.05, 20, 80), standMat);
cradle.rotation.x = Math.PI / 2;
cradle.position.y = postTop;
cradle.castShadow = true;
stand.add(cradle);

/* ------------------------------------------------------------------ */
/* Controls                                                            */
/* ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 3.0;
controls.maxDistance = 9.0;
controls.maxPolarAngle = 1.52;
controls.target.set(0, 1.72, 0);
controls.update();

/* ------------------------------------------------------------------ */
/* Resize + render loop                                                */
/* ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
