<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claymation Sloth</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8c8b1}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8c8b1);
scene.fog = new THREE.Fog(0xd8c8b1, 8, 16);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.9, 7.6);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 4.7;
controls.maxDistance = 10;
controls.target.set(0, 1.35, 0);

scene.add(new THREE.HemisphereLight(0xffefd7, 0x51483f, 2.2));

const keyLight = new THREE.DirectionalLight(0xffe4c4, 3.1);
keyLight.position.set(-4, 7, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024,1024);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -3;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x9eabc8, 1.15);
rimLight.position.set(4, 3, -4);
scene.add(rimLight);

const clayBrown = new THREE.MeshStandardMaterial({
  color:0x716455, roughness:0.82, metalness:0.0
});
const clayDark = new THREE.MeshStandardMaterial({
  color:0x443d38, roughness:0.9
});
const clayDeep = new THREE.MeshStandardMaterial({
  color:0x292724, roughness:0.88
});
const tanClay = new THREE.MeshStandardMaterial({
  color:0xb99b76, roughness:0.83
});
const tanLight = new THREE.MeshStandardMaterial({
  color:0xd0b187, roughness:0.86
});
const grooveMat = new THREE.MeshStandardMaterial({
  color:0x554b42, roughness:0.94
});
const branchMat = new THREE.MeshStandardMaterial({
  color:0x674b38, roughness:0.92
});
const branchLight = new THREE.MeshStandardMaterial({
  color:0x876348, roughness:0.9
});

const root = new THREE.Group();
root.position.y = 0.05;
scene.add(root);

function blob(name, position, scale, material, segments=20, rings=14) {
  const geometry = new THREE.SphereGeometry(1, segments, rings);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  root.add(mesh);
  return mesh;
}

function tube(name, points, radius, material, tubular=18) {
  const curve = new THREE.CatmullRomCurve3(points);
  curve.curveType = "catmullrom";
  curve.tension = 0.55;
  const geometry = new THREE.TubeGeometry(curve, tubular, radius, 10, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  root.add(mesh);
  return mesh;
}

function cylinderBetween(name, a, b, radius, material, radial=12) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(radius, radius*1.08, length, radial, 1);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  root.add(mesh);
  return mesh;
}

function groove(position, scale, rotation=0) {
  const mark = blob("pressed tool groove", position, scale, grooveMat, 12, 8);
  mark.rotation.z = rotation;
  return mark;
}

function addBranch() {
  const branch = new THREE.Mesh(
    new THREE.CylinderGeometry(0.19,0.24,2.9,14,1),
    branchMat
  );
  branch.rotation.z = Math.PI/2;
  branch.position.set(0,2.78,0.08);
  branch.castShadow = true;
  branch.receiveShadow = true;
  root.add(branch);

  const endL = blob("branch end", new THREE.Vector3(-1.48,2.78,0.08), new THREE.Vector3(.28,.23,.25), branchLight);
  const endR = blob("branch end", new THREE.Vector3(1.48,2.78,0.08), new THREE.Vector3(.27,.21,.23), branchLight);
  endL.rotation.z = .18;
  endR.rotation.z = -.22;

  tube("branch crooked nub", [
    new THREE.Vector3(.86,2.79,.03),
    new THREE.Vector3(1.04,3.03,.02),
    new THREE.Vector3(1.18,3.16,.04)
  ], .11, branchMat, 10);

  tube("branch underside nub", [
    new THREE.Vector3(-.72,2.74,.04),
    new THREE.Vector3(-.84,2.53,.02),
    new THREE.Vector3(-1.02,2.47,.03)
  ], .1, branchLight, 10);

  groove(new THREE.Vector3(-.45,2.96,.18), new THREE.Vector3(.05,.22,.025), -.3);
  groove(new THREE.Vector3(.38,2.96,.18), new THREE.Vector3(.045,.19,.025), .2);
}
addBranch();

const body = blob("round shaggy body", new THREE.Vector3(0,.82,0), new THREE.Vector3(1.04,1.28,.72), clayBrown, 24, 18);
body.rotation.z = -.025;

blob("lower belly", new THREE.Vector3(0,.22,.08), new THREE.Vector3(.78,.58,.61), new THREE.MeshStandardMaterial({
  color:0x817365, roughness:.9
}), 20, 14);

const head = blob("sleepy head", new THREE.Vector3(0,1.85,.02), new THREE.Vector3(.88,.84,.69), clayBrown, 24, 18);
head.rotation.z = .025;

blob("left ear", new THREE.Vector3(-.76,2.02,-.01), new THREE.Vector3(.27,.34,.2), clayBrown);
blob("right ear", new THREE.Vector3(.76,2.02,-.01), new THREE.Vector3(.27,.34,.2), clayBrown);
blob("left ear center", new THREE.Vector3(-.76,2.02,.17), new THREE.Vector3(.14,.2,.06), tanClay, 16, 10);
blob("right ear center", new THREE.Vector3(.76,2.02,.17), new THREE.Vector3(.14,.2,.06), tanClay, 16, 10);

const mask = blob("soft tan face mask", new THREE.Vector3(0,1.82,.61), new THREE.Vector3(.64,.61,.12), tanLight, 24, 16);
mask.rotation.z = -.02;
blob("mask left cheek", new THREE.Vector3(-.43,1.58,.62), new THREE.Vector3(.34,.34,.11), tanClay, 18, 12);
blob("mask right cheek", new THREE.Vector3(.43,1.58,.62), new THREE.Vector3(.34,.34,.11), tanClay, 18, 12);

blob("left sleepy eye", new THREE.Vector3(-.29,1.98,.73), new THREE.Vector3(.105,.145,.055), clayDeep, 16, 10);
blob("right sleepy eye", new THREE.Vector3(.29,1.98,.73), new THREE.Vector3(.105,.145,.055), clayDeep, 16, 10);
blob("left eye glint", new THREE.Vector3(-.255,2.04,.786), new THREE.Vector3(.025,.032,.012), tanLight, 10, 7);
blob("right eye glint", new THREE.Vector3(.325,2.04,.786), new THREE.Vector3(.025,.032,.012), tanLight, 10, 7);

blob("muzzle", new THREE.Vector3(0,1.61,.72), new THREE.Vector3(.31,.2,.1), tanLight, 18, 12);
blob("nose", new THREE.Vector3(0,1.69,.83), new THREE.Vector3(.13,.085,.045), clayDeep, 16, 10);

tube("permanent grin", [
  new THREE.Vector3(-.28,1.56,.81),
  new THREE.Vector3(-.14,1.49,.84),
  new THREE.Vector3(0,1.47,.85),
  new THREE.Vector3(.14,1.49,.84),
  new THREE.Vector3(.28,1.56,.81)
], .035, clayDeep, 16);

const leftArm = tube("left long curved arm", [
  new THREE.Vector3(-.58,1.55,-.02),
  new THREE.Vector3(-.86,1.85,.01),
  new THREE.Vector3(-1.04,2.22,.04),
  new THREE.Vector3(-1.22,2.62,.08)
], .205, clayBrown, 20);
leftArm.rotation.z = -.03;

const rightArm = tube("right long curved arm", [
  new THREE.Vector3(.58,1.55,-.02),
  new THREE.Vector3(.86,1.85,.01),
  new THREE.Vector3(1.04,2.22,.04),
  new THREE.Vector3(1.22,2.62,.08)
], .205, clayBrown, 20);
rightArm.rotation.z = .03;

blob("left palm", new THREE.Vector3(-1.23,2.53,.09), new THREE.Vector3(.29,.25,.22), clayBrown);
blob("right palm", new THREE.Vector3(1.23,2.53,.09), new THREE.Vector3(.29,.25,.22), clayBrown);

function makeClaws(side) {
  const xBase = side * 1.23;
  for (let i=0; i<3; i++) {
    const spread = (i-1)*.17;
    const zStart = .18 + Math.abs(i-1)*.04;
    const points = [
      new THREE.Vector3(xBase + side*spread, 2.54, zStart),
      new THREE.Vector3(xBase + side*spread, 2.72, .22 + i*.025),
      new THREE.Vector3(xBase + side*(spread*.92), 2.91, .05 + i*.025),
      new THREE.Vector3(xBase + side*(spread + .025), 2.79, -.22 - i*.012),
      new THREE.Vector3(xBase + side*(spread + .06), 2.62, -.24 - i*.012)
    ];
    tube("fat curved clay claw", points, .105, clayBrown, 14);
    blob("claw fingertip", points[4], new THREE.Vector3(.12,.13,.11), clayBrown, 14, 10);
  }
}
makeClaws(-1);
makeClaws(1);

const random = (() => {
  let seed = 812731;
  return () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };
})();

for (let i=0; i<46; i++) {
  const x = -0.82 + random()*1.64;
  const y = .18 + random()*1.45;
  if (y > 1.16 && Math.abs(x) < .52) continue;
  const width = .10 + random()*.18;
  const height = .035 + random()*.075;
  const z = .61 + random()*.10;
  const stripMat = i % 5 === 0 ? new THREE.MeshStandardMaterial({color:0x877967,roughness:.9}) : clayBrown;
  const strip = blob("pressed coat strip", new THREE.Vector3(x,y,z), new THREE.Vector3(width,height,.055), stripMat, 12, 8);
  strip.rotation.z = -0.8 + random()*1.6;
  if (i % 3 === 0) {
    const dimple = blob("thumbprint dimple", new THREE.Vector3(x + (random()-.5)*.08, y, z+.057), new THREE.Vector3(.025,.018,.009), grooveMat, 10, 6);
    dimple.rotation.z = random()*Math.PI;
  }
}

for (let i=0; i<18; i++) {
  const side = i % 2 === 0 ? -1 : 1;
  const y = .35 + (i%9)*.15;
  const x = side * (.72 + random()*.18);
  const strip = blob("side coat ridge", new THREE.Vector3(x,y,.18 + random()*.18), new THREE.Vector3(.07,.18 + random()*.08,.16), i%4===0 ? grooveMat : clayBrown, 12, 8);
  strip.rotation.z = side * (.25 + random()*.45);
}

for (let i=0; i<12; i++) {
  const x = -0.68 + random()*1.36;
  const y = 2.28 + random()*.28;
  const strip = blob("head pressed strip", new THREE.Vector3(x,y,.58 + random()*.08), new THREE.Vector3(.07 + random()*.08,.16,.045), i%4===0 ? grooveMat : clayBrown, 12, 8);
  strip.rotation.z = -.65 + random()*1.3;
}

groove(new THREE.Vector3(-.73,1.23,.68), new THREE.Vector3(.16,.026,.012), -.3);
groove(new THREE.Vector3(.69,1.08,.68), new THREE.Vector3(.18,.026,.012), .4);
groove(new THREE.Vector3(-.62,2.34,.66), new THREE.Vector3(.13,.025,.012), -.7);
groove(new THREE.Vector3(.57,2.29,.66), new THREE.Vector3(.12,.025,.012), .65);

const shadowPlane = new THREE.Mesh(
  new THREE.CircleGeometry(3.4, 64),
  new THREE.MeshBasicMaterial({color:0xc7b59d, transparent:true, opacity:.22, depthWrite:false})
);
shadowPlane.rotation.x = -Math.PI/2;
shadowPlane.position.set(0,-.49,0);
scene.add(shadowPlane);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  root.position.y = 0.05 + Math.sin(t*1.15)*.012;
  root.rotation.z = Math.sin(t*.55)*.008;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
