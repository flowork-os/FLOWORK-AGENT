<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raincoat Mannequin</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #d9e0e3;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(30, 40, 44, 0.58);
      font: 500 11px/1.4 system-ui, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Rainwear Study · Drag to Rotate</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd9e0e3);
    scene.fog = new THREE.Fog(0xd9e0e3, 8, 15);

    const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 30);
    camera.position.set(5.2, 3.45, 7.4);
    camera.lookAt(0, 2.05, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.02, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.enablePan = false;
    controls.minDistance = 5.2;
    controls.maxDistance = 11;
    controls.minPolarAngle = Math.PI * 0.19;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.62;

    const hemi = new THREE.HemisphereLight(0xf4fbff, 0x687278, 2.1);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xfff4dd, 4.2);
    key.position.set(-4.5, 7.5, 5.5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -4;
    key.shadow.camera.right = 4;
    key.shadow.camera.top = 6;
    key.shadow.camera.bottom = -2;
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 16;
    key.shadow.bias = -0.0003;
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x9fc8d8, 2.2);
    rim.position.set(5, 4, -5);
    scene.add(rim);

    const fill = new THREE.PointLight(0xffdfb1, 1.8, 8);
    fill.position.set(2.8, 2.7, 3.8);
    scene.add(fill);

    const mannequinMaterial = new THREE.MeshStandardMaterial({
      color: 0xe7e2d8,
      roughness: 0.72,
      metalness: 0.0
    });

    const coatMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xe2a617,
      roughness: 0.48,
      metalness: 0.0,
      clearcoat: 0.22,
      clearcoatRoughness: 0.65
    });

    const coatEdgeMaterial = new THREE.MeshStandardMaterial({
      color: 0xc7880b,
      roughness: 0.58
    });

    const bootMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x223a40,
      roughness: 0.3,
      metalness: 0.02,
      clearcoat: 0.38,
      clearcoatRoughness: 0.4
    });

    const soleMaterial = new THREE.MeshStandardMaterial({
      color: 0x15262a,
      roughness: 0.68
    });

    const metalMaterial = new THREE.MeshStandardMaterial({
      color: 0xd3bd79,
      roughness: 0.28,
      metalness: 0.7
    });

    const baseMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x36474d,
      roughness: 0.3,
      metalness: 0.14,
      clearcoat: 0.3
    });

    const darkInsetMaterial = new THREE.MeshStandardMaterial({
      color: 0x82570d,
      roughness: 0.8
    });

    function addMesh(geometry, material, parent = scene) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function cylinderBetween(start, end, radiusTop, radiusBottom, material, radialSegments = 24) {
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();
      const mesh = addMesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, length, radialSegments, 1, false),
        material
      );
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      return mesh;
    }

    const model = new THREE.Group();
    scene.add(model);

    const baseLower = addMesh(new THREE.CylinderGeometry(1.16, 1.22, 0.18, 64), baseMaterial, model);
    baseLower.position.y = 0.09;

    const baseTop = addMesh(
      new THREE.CylinderGeometry(1.08, 1.14, 0.11, 64),
      new THREE.MeshStandardMaterial({ color: 0x52656a, roughness: 0.35, metalness: 0.1 }),
      model
    );
    baseTop.position.y = 0.225;

    const baseRing = addMesh(new THREE.TorusGeometry(1.115, 0.026, 12, 64), metalMaterial, model);
    baseRing.rotation.x = Math.PI / 2;
    baseRing.position.y = 0.235;

    const footPositions = [-0.26, 0.26];
    for (const x of footPositions) {
      const leg = addMesh(new THREE.CylinderGeometry(0.12, 0.14, 1.2, 24), mannequinMaterial, model);
      leg.position.set(x, 1.22, 0);

      const shaft = addMesh(new THREE.CylinderGeometry(0.18, 0.205, 0.82, 32), bootMaterial, model);
      shaft.position.set(x, 0.79, 0.015);

      const cuff = addMesh(new THREE.TorusGeometry(0.184, 0.025, 10, 32), bootMaterial, model);
      cuff.rotation.x = Math.PI / 2;
      cuff.position.set(x, 1.19, 0.015);

      const ankle = addMesh(new THREE.SphereGeometry(0.205, 28, 18), bootMaterial, model);
      ankle.scale.set(1, 0.78, 1.05);
      ankle.position.set(x, 0.44, 0.04);

      const toe = addMesh(new THREE.SphereGeometry(0.23, 32, 20), bootMaterial, model);
      toe.scale.set(0.94, 0.63, 1.45);
      toe.position.set(x, 0.39, 0.24);

      const sole = addMesh(new THREE.BoxGeometry(0.42, 0.07, 0.69, 1, 1, 1), soleMaterial, model);
      sole.position.set(x, 0.305, 0.17);

      const heel = addMesh(new THREE.BoxGeometry(0.34, 0.09, 0.25), soleMaterial, model);
      heel.position.set(x, 0.305, -0.08);

      const bootBand = addMesh(new THREE.TorusGeometry(0.185, 0.014, 8, 32), coatEdgeMaterial, model);
      bootBand.rotation.x = Math.PI / 2;
      bootBand.position.set(x, 1.14, 0.015);
    }

    const hips = addMesh(new THREE.SphereGeometry(0.47, 32, 24), mannequinMaterial, model);
    hips.scale.set(1, 0.74, 0.66);
    hips.position.y = 1.84;

    const torso = addMesh(new THREE.CapsuleGeometry(0.39, 0.74, 8, 28), mannequinMaterial, model);
    torso.scale.set(1.13, 1, 0.72);
    torso.position.y = 2.52;

    const coatProfile = [
      new THREE.Vector2(0.67, 1.24),
      new THREE.Vector2(0.68, 1.31),
      new THREE.Vector2(0.64, 1.67),
      new THREE.Vector2(0.58, 2.03),
      new THREE.Vector2(0.51, 2.24),
      new THREE.Vector2(0.52, 2.66),
      new THREE.Vector2(0.57, 2.86),
      new THREE.Vector2(0.48, 3.00),
      new THREE.Vector2(0.32, 3.06)
    ];
    const coatBody = addMesh(new THREE.LatheGeometry(coatProfile, 64), coatMaterial, model);

    const hem = addMesh(new THREE.TorusGeometry(0.67, 0.026, 10, 64), coatEdgeMaterial, model);
    hem.rotation.x = Math.PI / 2;
    hem.position.y = 1.255;

    const neck = addMesh(new THREE.CylinderGeometry(0.17, 0.19, 0.3, 28), mannequinMaterial, model);
    neck.position.y = 3.17;

    const head = addMesh(new THREE.SphereGeometry(0.32, 48, 32), mannequinMaterial, model);
    head.scale.set(0.82, 1.14, 0.89);
    head.position.set(0, 3.54, 0.005);

    const leftShoulder = new THREE.Vector3(-0.49, 2.86, 0);
    const leftElbow = new THREE.Vector3(-0.67, 2.35, 0.01);
    const leftWrist = new THREE.Vector3(-0.66, 1.86, 0.055);
    const rightShoulder = new THREE.Vector3(0.49, 2.86, 0);
    const rightElbow = new THREE.Vector3(0.67, 2.35, 0.01);
    const rightWrist = new THREE.Vector3(0.66, 1.86, 0.055);

    cylinderBetween(leftShoulder, leftElbow, 0.205, 0.245, coatMaterial);
    cylinderBetween(leftElbow, leftWrist, 0.16, 0.205, coatMaterial);
    cylinderBetween(rightShoulder, rightElbow, 0.205, 0.245, coatMaterial);
    cylinderBetween(rightElbow, rightWrist, 0.16, 0.205, coatMaterial);

    for (const side of [-1, 1]) {
      const cuff = addMesh(new THREE.TorusGeometry(0.163, 0.023, 10, 28), coatEdgeMaterial, model);
      cuff.position.set(side * 0.66, 1.87, 0.055);
      cuff.rotation.x = Math.PI / 2;
      cuff.rotation.z = side * 0.08;

      const hand = addMesh(new THREE.CapsuleGeometry(0.125, 0.19, 7, 22), mannequinMaterial, model);
      hand.position.set(side * 0.665, 1.66, 0.065);
      hand.rotation.z = side * 0.025;
      hand.scale.set(0.82, 1.0, 0.7);
    }

    const shoulderCape = addMesh(
      new THREE.CylinderGeometry(0.49, 0.565, 0.18, 48, 1, true),
      coatMaterial,
      model
    );
    shoulderCape.position.y = 2.91;

    const collarBack = addMesh(
      new THREE.TorusGeometry(0.31, 0.09, 16, 48, Math.PI * 1.12),
      coatEdgeMaterial,
      model
    );
    collarBack.rotation.x = Math.PI / 2;
    collarBack.rotation.z = Math.PI * 0.44;
    collarBack.scale.z = 0.72;
    collarBack.position.set(0, 3.03, -0.015);

    function createCollarShape(side) {
      const shape = new THREE.Shape();
      shape.moveTo(side * 0.02, 0.24);
      shape.lineTo(side * 0.39, 0.12);
      shape.lineTo(side * 0.29, -0.28);
      shape.lineTo(side * 0.02, -0.1);
      shape.closePath();
      return shape;
    }

    for (const side of [-1, 1]) {
      const collarGeometry = new THREE.ExtrudeGeometry(createCollarShape(side), {
        depth: 0.055,
        bevelEnabled: true,
        bevelThickness: 0.014,
        bevelSize: 0.012,
        bevelSegments: 2
      });
      const collar = addMesh(collarGeometry, coatMaterial, model);
      collar.position.set(0, 2.85, 0.405);
      collar.rotation.x = -0.06;
    }

    const placket = addMesh(new THREE.BoxGeometry(0.065, 1.54, 0.055), coatEdgeMaterial, model);
    placket.position.set(0, 2.13, 0.563);

    const belt = addMesh(new THREE.CylinderGeometry(0.552, 0.552, 0.105, 64, 1, true), coatEdgeMaterial, model);
    belt.position.y = 2.2;

    const beltTip = addMesh(new THREE.BoxGeometry(0.18, 0.095, 0.045), coatEdgeMaterial, model);
    beltTip.position.set(0.26, 2.18, 0.566);
    beltTip.rotation.z = -0.05;

    const buckleOuter = addMesh(new THREE.BoxGeometry(0.24, 0.18, 0.055), metalMaterial, model);
    buckleOuter.position.set(-0.035, 2.2, 0.59);

    const buckleInset = addMesh(new THREE.BoxGeometry(0.145, 0.095, 0.066), darkInsetMaterial, model);
    buckleInset.position.set(-0.035, 2.2, 0.621);

    const buckleTongue = addMesh(new THREE.BoxGeometry(0.115, 0.018, 0.025), metalMaterial, model);
    buckleTongue.position.set(-0.01, 2.2, 0.666);

    const buttonGeometry = new THREE.CylinderGeometry(0.045, 0.045, 0.026, 24);
    for (const y of [2.73, 2.48, 1.93, 1.65, 1.39]) {
      const button = addMesh(buttonGeometry, metalMaterial, model);
      button.rotation.x = Math.PI / 2;
      button.position.set(-0.115, y, 0.585);
    }

    for (const side of [-1, 1]) {
      const pocket = addMesh(new THREE.BoxGeometry(0.31, 0.055, 0.045), coatEdgeMaterial, model);
      pocket.position.set(side * 0.355, 1.79, 0.515);
      pocket.rotation.z = side * -0.13;
      pocket.rotation.x = -0.14;

      const beltLoop = addMesh(new THREE.BoxGeometry(0.06, 0.18, 0.035), coatMaterial, model);
      beltLoop.position.set(side * 0.48, 2.2, 0.31);
      beltLoop.rotation.y = side * 0.72;
    }

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0xcdd6d9,
      roughness: 0.92,
      metalness: 0
    });
    const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 96), floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.012;
    floor.receiveShadow = true;
    scene.add(floor);

    const backdropRing = new THREE.Mesh(
      new THREE.RingGeometry(2.0, 2.025, 96),
      new THREE.MeshBasicMaterial({
        color: 0xb8c5c9,
        transparent: true,
        opacity: 0.45,
        side: THREE.DoubleSide
      })
    );
    backdropRing.rotation.x = -Math.PI / 2;
    backdropRing.position.y = 0.004;
    scene.add(backdropRing);

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener('resize', resize);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      baseRing.material.emissive = new THREE.Color(0x2b2209);
      baseRing.material.emissiveIntensity = 0.05 + Math.sin(elapsed * 0.7) * 0.015;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
