<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartoon Rocket Ship</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #bfe8ff;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe8ff);
scene.fog = new THREE.Fog(0xbfe8ff, 13, 25);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(6.7, 3.8, 8.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.minDistance = 7;
controls.maxDistance = 16;
controls.minPolarAngle = Math.PI * 0.2;
controls.maxPolarAngle = Math.PI * 0.48;

scene.add(new THREE.HemisphereLight(0xffffff, 0x6481a1, 2.15));

const keyLight = new THREE.DirectionalLight(0xffffff, 4.2);
keyLight.position.set(5, 8, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -5;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 25;
keyLight.shadow.bias = -0.0002;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xffd4b1, 1.55);
fillLight.position.set(-5, 2, 4);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0x75a9ff, 18, 15, 2);
rimLight.position.set(-4, 4, -4);
scene.add(rimLight);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(7.5, 96),
  new THREE.MeshStandardMaterial({
    color: 0xd8f1ff,
    roughness: 0.78,
    metalness: 0
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -2.82;
ground.receiveShadow = true;
scene.add(ground);

const shadowDisc = new THREE.Mesh(
  new THREE.CircleGeometry(2.1, 64),
  new THREE.MeshBasicMaterial({
    color: 0x4f7d9b,
    transparent: true,
    opacity: 0.13,
    depthWrite: false
  })
);
shadowDisc.rotation.x = -Math.PI / 2;
shadowDisc.position.y = -2.805;
shadowDisc.scale.set(1.25, 0.72, 1);
scene.add(shadowDisc);

const rocket = new THREE.Group();
rocket.rotation.y = -0.18;
scene.add(rocket);

const redMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xe9383f,
  roughness: 0.22,
  metalness: 0.02,
  clearcoat: 0.75,
  clearcoatRoughness: 0.18
});

const whiteMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xfffbf1,
  roughness: 0.2,
  metalness: 0,
  clearcoat: 0.65,
  clearcoatRoughness: 0.18
});

const darkMaterial = new THREE.MeshStandardMaterial({
  color: 0x263949,
  roughness: 0.29,
  metalness: 0.5
});

const rimMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffd84a,
  roughness: 0.2,
  metalness: 0.08,
  clearcoat: 0.8,
  clearcoatRoughness: 0.15
});

const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x54c8ed,
  roughness: 0.12,
  metalness: 0.08,
  clearcoat: 1,
  clearcoatRoughness: 0.08,
  emissive: 0x07394f,
  emissiveIntensity: 0.34
});

function lathe(points, material, segments = 96) {
  const geometry = new THREE.LatheGeometry(
    points.map((point) => new THREE.Vector2(point[0], point[1])),
    segments
  );
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const body = lathe([
  [0.50, -1.58],
  [0.68, -1.48],
  [0.84, -1.24],
  [0.94, -0.88],
  [0.99, -0.35],
  [1.00, 0.35],
  [0.96, 0.92],
  [0.86, 1.34],
  [0.72, 1.56]
], whiteMaterial);
rocket.add(body);

const lowerBand = lathe([
  [0.48, -1.60],
  [0.68, -1.49],
  [0.83, -1.27],
  [0.91, -1.02],
  [0.94, -0.80],
  [0.93, -0.62]
], redMaterial);
rocket.add(lowerBand);

const waistRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.935, 0.055, 16, 96),
  redMaterial
);
waistRing.rotation.x = Math.PI / 2;
waistRing.position.y = -0.69;
waistRing.castShadow = true;
rocket.add(waistRing);

const nose = lathe([
  [0.00, 3.03],
  [0.08, 2.90],
  [0.25, 2.66],
  [0.48, 2.34],
  [0.67, 2.02],
  [0.78, 1.75],
  [0.72, 1.56]
], redMaterial);
rocket.add(nose);

const noseCollar = new THREE.Mesh(
  new THREE.TorusGeometry(0.73, 0.06, 16, 96),
  whiteMaterial
);
noseCollar.rotation.x = Math.PI / 2;
noseCollar.position.y = 1.565;
noseCollar.castShadow = true;
rocket.add(noseCollar);

const antennaBall = new THREE.Mesh(
  new THREE.SphereGeometry(0.085, 24, 16),
  rimMaterial
);
antennaBall.position.y = 3.04;
antennaBall.scale.y = 0.82;
antennaBall.castShadow = true;
rocket.add(antennaBall);

const windowGroup = new THREE.Group();
windowGroup.position.set(0, 0.55, 0.965);
windowGroup.rotation.x = -0.035;
rocket.add(windowGroup);

const windowOuter = new THREE.Mesh(
  new THREE.CylinderGeometry(0.49, 0.49, 0.16, 64, 1, false),
  rimMaterial
);
windowOuter.rotation.x = Math.PI / 2;
windowOuter.position.z = 0.015;
windowOuter.castShadow = true;
windowGroup.add(windowOuter);

const windowInset = new THREE.Mesh(
  new THREE.CylinderGeometry(0.365, 0.365, 0.175, 64, 1, false),
  glassMaterial
);
windowInset.rotation.x = Math.PI / 2;
windowInset.position.z = 0.095;
windowInset.castShadow = true;
windowGroup.add(windowInset);

const windowHighlight = new THREE.Mesh(
  new THREE.CircleGeometry(0.105, 32),
  new THREE.MeshBasicMaterial({
    color: 0xdfffff,
    transparent: true,
    opacity: 0.88,
    depthWrite: false
  })
);
windowHighlight.position.set(-0.12, 0.13, 0.188);
windowHighlight.scale.set(1.35, 0.6, 1);
windowGroup.add(windowHighlight);

function createFin() {
  const shape = new THREE.Shape();
  shape.moveTo(0.60, -0.76);
  shape.bezierCurveTo(0.75, -0.88, 0.88, -1.07, 1.00, -1.29);
  shape.bezierCurveTo(1.18, -1.61, 1.50, -1.83, 1.74, -1.92);
  shape.bezierCurveTo(1.64, -1.54, 1.55, -1.18, 1.42, -0.88);
  shape.bezierCurveTo(1.28, -0.54, 1.00, -0.28, 0.78, -0.18);
  shape.bezierCurveTo(0.71, -0.37, 0.65, -0.57, 0.60, -0.76);

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.24,
    bevelEnabled: true,
    bevelSegments: 5,
    steps: 1,
    bevelSize: 0.075,
    bevelThickness: 0.055,
    curveSegments: 18
  });
  geometry.translate(0, 0, -0.12);
  geometry.computeVertexNormals();

  const fin = new THREE.Mesh(geometry, redMaterial);
  fin.castShadow = true;
  fin.receiveShadow = true;
  return fin;
}

for (let index = 0; index < 3; index += 1) {
  const fin = createFin();
  fin.rotation.y = index * Math.PI * 2 / 3;
  rocket.add(fin);
}

const nozzleCollar = new THREE.Mesh(
  new THREE.CylinderGeometry(0.47, 0.55, 0.25, 48),
  darkMaterial
);
nozzleCollar.position.y = -1.66;
nozzleCollar.castShadow = true;
rocket.add(nozzleCollar);

const nozzleLip = new THREE.Mesh(
  new THREE.TorusGeometry(0.53, 0.075, 14, 64),
  darkMaterial
);
nozzleLip.rotation.x = Math.PI / 2;
nozzleLip.position.y = -1.80;
nozzleLip.castShadow = true;
rocket.add(nozzleLip);

const flameGroup = new THREE.Group();
flameGroup.position.y = -1.82;
rocket.add(flameGroup);

const orangeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xff791f,
  emissive: 0xff3e08,
  emissiveIntensity: 1.1,
  roughness: 0.34,
  clearcoat: 0.35
});

const yellowMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffe64f,
  emissive: 0xffa10b,
  emissiveIntensity: 1.25,
  roughness: 0.3,
  clearcoat: 0.3
});

const outerFlame = lathe([
  [0.00, -0.91],
  [0.18, -0.78],
  [0.29, -0.56],
  [0.42, -0.36],
  [0.46, -0.15],
  [0.39, -0.01],
  [0.00, 0.02]
], orangeMaterial, 64);
outerFlame.castShadow = false;
flameGroup.add(outerFlame);

const innerFlame = lathe([
  [0.00, -0.63],
  [0.12, -0.54],
  [0.22, -0.37],
  [0.27, -0.20],
  [0.23, -0.04],
  [0.00, 0.00]
], yellowMaterial, 48);
innerFlame.position.y = 0.01;
innerFlame.castShadow = false;
flameGroup.add(innerFlame);

const puffData = [
  [-0.31, -0.62, 0.03, 0.23],
  [0.29, -0.65, 0.08, 0.20],
  [0.05, -0.79, 0.22, 0.24],
  [-0.06, -0.72, -0.24, 0.18]
];

for (const [x, y, z, radius] of puffData) {
  const puff = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 24, 16),
    orangeMaterial
  );
  puff.position.set(x, y, z);
  puff.scale.y = 1.18;
  flameGroup.add(puff);
}

const flameLight = new THREE.PointLight(0xff8c28, 18, 4.5, 2);
flameLight.position.set(0, -2.2, 0);
rocket.add(flameLight);

rocket.traverse((object) => {
  if (object.isMesh && object !== outerFlame && object !== innerFlame) {
    object.castShadow = true;
  }
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  const pulse = 1 + Math.sin(time * 8.2) * 0.045;
  flameGroup.scale.set(1 / pulse, pulse, 1 / pulse);
  flameGroup.rotation.y = Math.sin(time * 4.4) * 0.04;
  flameLight.intensity = 17 + Math.sin(time * 9.1) * 2;
  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
