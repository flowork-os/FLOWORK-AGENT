<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Traffic Cone</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#dde1e4}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdde1e4);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 50);
camera.position.set(0.9, 0.55, 1.0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.3, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.6;
controls.minDistance = 0.55;
controls.maxDistance = 3.5;
controls.maxPolarAngle = 1.48;

// ---------- procedural textures (scuffed, sun-faded orange + reflective bands) ----------
const rnd = (a, b) => a + Math.random() * (b - a);
// band positions as fraction from cone tip (28" cone: 6" band, 2" gap, 4" band)
const B1 = [0.133, 0.359], B2 = [0.433, 0.581];

function coneColorTex() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 1024;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 1024);       // faded near tip, richer near base
  grad.addColorStop(0, '#e39a66'); grad.addColorStop(0.45, '#dd7b3e'); grad.addColorStop(1, '#c8672e');
  g.fillStyle = grad; g.fillRect(0, 0, 512, 1024);
  for (const [f1, f2] of [B1, B2]) {                        // reflective bands with grime
    const y1 = f1 * 1024, y2 = f2 * 1024;
    const bg = g.createLinearGradient(0, y1, 0, y2);
    bg.addColorStop(0, '#e6e6e0'); bg.addColorStop(0.3, '#f8f8f3'); bg.addColorStop(1, '#d5d4cb');
    g.fillStyle = bg; g.fillRect(0, y1, 512, y2 - y1);
    g.fillStyle = 'rgba(70,55,40,0.35)'; g.fillRect(0, y1, 512, 3); g.fillRect(0, y2 - 3, 512, 3);
    for (let i = 0; i < 45; i++) {
      g.globalAlpha = rnd(0.03, 0.09); g.fillStyle = '#877f72';
      g.fillRect(rnd(0, 512), y1 + rnd(2, y2 - y1 - 8), rnd(12, 70), rnd(2, 6));
    }
    g.globalAlpha = 1;
  }
  for (let i = 0; i < 300; i++) {                           // scuffs and scratches
    g.save(); g.translate(rnd(0, 512), rnd(0, 1024)); g.rotate(rnd(-0.6, 0.6));
    g.globalAlpha = rnd(0.03, 0.10);
    g.fillStyle = Math.random() < 0.55 ? '#fff2e4' : (Math.random() < 0.5 ? '#6b3c1d' : '#4c4c4c');
    g.fillRect(0, 0, rnd(8, 75), rnd(1, 4)); g.restore();
  }
  for (let i = 0; i < 150; i++) {                           // road grime near the base
    g.globalAlpha = rnd(0.02, 0.08); g.fillStyle = '#3d2a17';
    g.beginPath();
    g.ellipse(rnd(0, 512), 1024 - Math.pow(Math.random(), 2) * 420, rnd(2, 11), rnd(1, 5), 0, 0, 7);
    g.fill();
  }
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function coneRoughTex() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#d2d2d2'; g.fillRect(0, 0, 256, 512);      // matte weathered plastic
  for (const [f1, f2] of [B1, B2]) { g.fillStyle = '#3f3f3f'; g.fillRect(0, f1 * 512, 256, (f2 - f1) * 512); } // smooth reflective bands
  for (let i = 0; i < 200; i++) {
    g.globalAlpha = rnd(0.04, 0.12); g.fillStyle = Math.random() < 0.5 ? '#fff' : '#666';
    g.fillRect(rnd(0, 256), rnd(0, 512), rnd(5, 40), rnd(1, 3));
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping;
  return t;
}

// ---------- cone (28in / 0.71m overall, 0.36m square base) ----------
const cone = new THREE.Group();

const bodyMat = new THREE.MeshStandardMaterial({
  map: coneColorTex(), roughnessMap: coneRoughTex(),
  roughness: 1, metalness: 0.06, envMapIntensity: 1.2, side: THREE.DoubleSide
});
const body = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.138, 0.675, 80, 1, true), bodyMat);
body.position.y = 0.3725;                                    // bottom at 0.035, tip at 0.71
body.castShadow = true;
cone.add(body);

const lip = new THREE.Mesh(                                  // rolled lip at the open tip
  new THREE.TorusGeometry(0.025, 0.008, 12, 40),
  new THREE.MeshStandardMaterial({ color: 0xd06a30, roughness: 0.75 })
);
lip.rotation.x = Math.PI / 2; lip.position.y = 0.706; lip.castShadow = true;
cone.add(lip);

const baseShape = (() => {                                   // rounded square weighted base
  const w = 0.18, r = 0.045, s = new THREE.Shape();
  s.moveTo(-w + r, -w);
  s.lineTo(w - r, -w); s.quadraticCurveTo(w, -w, w, -w + r);
  s.lineTo(w, w - r); s.quadraticCurveTo(w, w, w - r, w);
  s.lineTo(-w + r, w); s.quadraticCurveTo(-w, w, -w, w - r);
  s.lineTo(-w, -w + r); s.quadraticCurveTo(-w, -w, -w + r, -w);
  return s;
})();
const baseGeo = new THREE.ExtrudeGeometry(baseShape, { depth: 0.02, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.008, bevelSegments: 3 });
baseGeo.rotateX(-Math.PI / 2);
const base = new THREE.Mesh(baseGeo, new THREE.MeshStandardMaterial({ color: 0xb2551f, roughness: 0.95, metalness: 0.03 }));
base.position.y = 0.009;
base.castShadow = base.receiveShadow = true;
cone.add(base);
scene.add(cone);

// ---------- ground + lighting ----------
const ground = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.ShadowMaterial({ opacity: 0.28 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

scene.add(new THREE.HemisphereLight(0xf4f7ff, 0xb59d84, 0.5));

const key = new THREE.DirectionalLight(0xfff2e0, 2.4);
key.position.set(2, 3, 1.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1; key.shadow.camera.far = 8;
key.shadow.camera.left = key.shadow.camera.bottom = -1;
key.shadow.camera.right = key.shadow.camera.top = 1;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0xcfe0ff, 0.5);
fill.position.set(-2, 1.5, -2);
scene.add(fill);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
