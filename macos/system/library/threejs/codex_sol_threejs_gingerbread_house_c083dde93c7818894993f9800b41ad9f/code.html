<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gingerbread Confectionery House</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(circle at 50% 35%, #fff7e8 0%, #f1d9cf 55%, #c99491 100%);
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5ded8);
scene.fog = new THREE.Fog(0xf5ded8, 18, 34);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(10.5, 8.2, 13.5);
camera.lookAt(0, 2.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 9;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.48;

const hemi = new THREE.HemisphereLight(0xfff3e1, 0x75544a, 2.2);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffead2, 4.2);
key.position.set(7, 12, 9);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -10;
key.shadow.camera.right = 10;
key.shadow.camera.top = 12;
key.shadow.camera.bottom = -7;
key.shadow.camera.near = 1;
key.shadow.camera.far = 35;
key.shadow.bias = -0.00025;
scene.add(key);

const fill = new THREE.DirectionalLight(0xd5ddff, 1.5);
fill.position.set(-8, 7, 5);
scene.add(fill);

const warmGlow = new THREE.PointLight(0xff9d55, 18, 15, 2);
warmGlow.position.set(0, 3.2, 3.6);
scene.add(warmGlow);

const mats = {
  cookie: new THREE.MeshStandardMaterial({ color: 0xa95122, roughness: 0.72, metalness: 0.02 }),
  cookieDark: new THREE.MeshStandardMaterial({ color: 0x743116, roughness: 0.8 }),
  roof: new THREE.MeshStandardMaterial({ color: 0x7f321b, roughness: 0.68 }),
  icing: new THREE.MeshPhysicalMaterial({
    color: 0xfffdf5, roughness: 0.22, clearcoat: 0.48, clearcoatRoughness: 0.16
  }),
  red: new THREE.MeshPhysicalMaterial({
    color: 0xd71932, roughness: 0.22, clearcoat: 0.75, clearcoatRoughness: 0.12
  }),
  pink: new THREE.MeshPhysicalMaterial({
    color: 0xff6f91, roughness: 0.24, clearcoat: 0.68
  }),
  green: new THREE.MeshPhysicalMaterial({
    color: 0x4bab60, roughness: 0.25, clearcoat: 0.65
  }),
  lime: new THREE.MeshPhysicalMaterial({
    color: 0xa8cf45, roughness: 0.25, clearcoat: 0.62
  }),
  yellow: new THREE.MeshPhysicalMaterial({
    color: 0xffc63a, roughness: 0.25, clearcoat: 0.65
  }),
  purple: new THREE.MeshPhysicalMaterial({
    color: 0x9a59bc, roughness: 0.25, clearcoat: 0.65
  }),
  glass: new THREE.MeshPhysicalMaterial({
    color: 0x8fd8e4, emissive: 0x3a7784, emissiveIntensity: 0.65,
    roughness: 0.18, clearcoat: 0.8
  }),
  door: new THREE.MeshStandardMaterial({ color: 0x542112, roughness: 0.68 }),
  chocolate: new THREE.MeshPhysicalMaterial({
    color: 0x3a170f, roughness: 0.4, clearcoat: 0.28
  }),
  gold: new THREE.MeshPhysicalMaterial({
    color: 0xf6b72e, roughness: 0.25, clearcoat: 0.65
  })
};

const house = new THREE.Group();
scene.add(house);

function shadowify(object) {
  object.traverse(child => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });
  return object;
}

function cylinderBetween(a, b, radius, material, radialSegments = 12) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, length, radialSegments, 1, false),
    material
  );
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.clone().normalize()
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function bead(position, radius = 0.13, material = mats.icing) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 14, 10), material);
  mesh.position.copy(position);
  mesh.castShadow = true;
  return mesh;
}

function addPipedLine(parent, points, radius = 0.105, material = mats.icing) {
  for (let i = 0; i < points.length - 1; i++) {
    parent.add(cylinderBetween(points[i], points[i + 1], radius, material));
  }
  for (const point of points) parent.add(bead(point, radius * 1.08, material));
}

const baseShape = new THREE.Shape();
baseShape.moveTo(-3, 0);
baseShape.lineTo(3, 0);
baseShape.lineTo(3, 3.05);
baseShape.lineTo(0, 5.25);
baseShape.lineTo(-3, 3.05);
baseShape.closePath();

const wallGeometry = new THREE.ExtrudeGeometry(baseShape, {
  depth: 5,
  bevelEnabled: true,
  bevelSegments: 2,
  bevelSize: 0.08,
  bevelThickness: 0.08,
  curveSegments: 8
});
wallGeometry.translate(0, 0, -2.5);
const walls = new THREE.Mesh(wallGeometry, mats.cookie);
walls.castShadow = true;
walls.receiveShadow = true;
house.add(walls);

const roofAngle = Math.atan2(2.2, 3.05);
const roofLength = Math.hypot(3.05, 2.2) + 0.42;

function roofPanel(x, y, rotation) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(roofLength, 0.34, 5.85),
    mats.roof
  );
  mesh.position.set(x, y, 0);
  mesh.rotation.z = rotation;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  house.add(mesh);
}
roofPanel(-1.52, 4.17, roofAngle);
roofPanel(1.52, 4.17, -roofAngle);

const ridgeA = new THREE.Vector3(0, 5.38, -3);
const ridgeB = new THREE.Vector3(0, 5.38, 3);
house.add(cylinderBetween(ridgeA, ridgeB, 0.16, mats.icing, 16));

const roofEdges = [
  [new THREE.Vector3(-3.23, 3.03, 2.94), new THREE.Vector3(0, 5.39, 2.94)],
  [new THREE.Vector3(0, 5.39, 2.94), new THREE.Vector3(3.23, 3.03, 2.94)],
  [new THREE.Vector3(-3.23, 3.03, -2.94), new THREE.Vector3(0, 5.39, -2.94)],
  [new THREE.Vector3(0, 5.39, -2.94), new THREE.Vector3(3.23, 3.03, -2.94)],
  [new THREE.Vector3(-3.25, 3.02, -2.95), new THREE.Vector3(-3.25, 3.02, 2.95)],
  [new THREE.Vector3(3.25, 3.02, -2.95), new THREE.Vector3(3.25, 3.02, 2.95)]
];
for (const edge of roofEdges) addPipedLine(house, edge, 0.13);

for (const side of [-1, 1]) {
  for (let i = 0; i <= 12; i++) {
    const z = -2.72 + i * 0.455;
    const x = side * 3.27;
    const y = 2.94 - (i % 2 ? 0.12 : 0);
    house.add(bead(new THREE.Vector3(x, y, z), i % 2 ? 0.125 : 0.15));
    if (i % 2 === 1) {
      house.add(cylinderBetween(
        new THREE.Vector3(x, 2.99, z - 0.19),
        new THREE.Vector3(x, 2.78, z),
        0.075,
        mats.icing,
        10
      ));
    }
  }
}

function archedPanel(width, straightHeight, radius, material) {
  const shape = new THREE.Shape();
  const half = width / 2;
  shape.moveTo(-half, 0);
  shape.lineTo(half, 0);
  shape.lineTo(half, straightHeight);
  shape.absarc(0, straightHeight, radius, 0, Math.PI, false);
  shape.lineTo(-half, 0);
  shape.closePath();
  return new THREE.Mesh(new THREE.ShapeGeometry(shape, 20), material);
}

const door = archedPanel(1.38, 1.45, 0.69, mats.door);
door.position.set(0, 0.12, 2.595);
door.castShadow = true;
house.add(door);

const doorInset = archedPanel(1.03, 1.36, 0.515, mats.chocolate);
doorInset.position.set(0, 0.18, 2.615);
house.add(doorInset);

const knob = bead(new THREE.Vector3(0.34, 0.91, 2.76), 0.105, mats.gold);
house.add(knob);

const candyMaterials = [mats.red, mats.icing];
const frameRadius = 0.105;
const leftBottom = new THREE.Vector3(-0.82, 0.14, 2.77);
const rightBottom = new THREE.Vector3(0.82, 0.14, 2.77);
const verticalTopY = 1.58;
const stripeCount = 8;

for (const x of [-0.82, 0.82]) {
  for (let i = 0; i < stripeCount; i++) {
    const y0 = 0.14 + i * (verticalTopY - 0.14) / stripeCount;
    const y1 = 0.14 + (i + 1) * (verticalTopY - 0.14) / stripeCount;
    house.add(cylinderBetween(
      new THREE.Vector3(x, y0, 2.77),
      new THREE.Vector3(x, y1, 2.77),
      frameRadius,
      candyMaterials[i % 2],
      12
    ));
  }
}

const archSegments = 12;
for (let i = 0; i < archSegments; i++) {
  const a0 = Math.PI - i * Math.PI / archSegments;
  const a1 = Math.PI - (i + 1) * Math.PI / archSegments;
  const p0 = new THREE.Vector3(0.82 * Math.cos(a0), verticalTopY + 0.82 * Math.sin(a0), 2.77);
  const p1 = new THREE.Vector3(0.82 * Math.cos(a1), verticalTopY + 0.82 * Math.sin(a1), 2.77);
  house.add(cylinderBetween(p0, p1, frameRadius, candyMaterials[i % 2], 12));
}

house.add(bead(leftBottom, 0.115, mats.red));
house.add(bead(rightBottom, 0.115, mats.red));

function addWindow(x, y, scale = 1) {
  const group = new THREE.Group();
  const glass = new THREE.Mesh(
    new THREE.BoxGeometry(1.02 * scale, 1.08 * scale, 0.08),
    mats.glass
  );
  glass.position.set(x, y, 2.62);
  group.add(glass);

  const halfW = 0.61 * scale;
  const halfH = 0.64 * scale;
  const z = 2.73;
  addPipedLine(group, [
    new THREE.Vector3(x - halfW, y - halfH, z),
    new THREE.Vector3(x + halfW, y - halfH, z),
    new THREE.Vector3(x + halfW, y + halfH, z),
    new THREE.Vector3(x - halfW, y + halfH, z),
    new THREE.Vector3(x - halfW, y - halfH, z)
  ], 0.09 * scale);
  group.add(cylinderBetween(
    new THREE.Vector3(x, y - halfH, z + 0.015),
    new THREE.Vector3(x, y + halfH, z + 0.015),
    0.055 * scale,
    mats.icing
  ));
  group.add(cylinderBetween(
    new THREE.Vector3(x - halfW, y, z + 0.015),
    new THREE.Vector3(x + halfW, y, z + 0.015),
    0.055 * scale,
    mats.icing
  ));

  for (const cx of [-1, 1]) {
    for (const cy of [-1, 1]) {
      group.add(bead(
        new THREE.Vector3(x + cx * halfW, y + cy * halfH, z),
        0.115 * scale,
        mats.icing
      ));
    }
  }
  shadowify(group);
  house.add(group);
}

addWindow(-1.72, 1.75, 0.88);
addWindow(1.72, 1.75, 0.88);

function peppermint(radius = 0.48) {
  const group = new THREE.Group();
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, 0.16, 36),
    mats.icing
  );
  base.rotation.x = Math.PI / 2;
  group.add(base);

  for (let i = 0; i < 6; i++) {
    const wedge = new THREE.Mesh(
      new THREE.CircleGeometry(radius * 0.91, 16, i * Math.PI / 3 + 0.1, Math.PI / 7),
      mats.red
    );
    wedge.position.z = 0.086;
    group.add(wedge);
  }

  const center = bead(new THREE.Vector3(0, 0, 0.115), radius * 0.14, mats.icing);
  group.add(center);
  shadowify(group);
  return group;
}

const atticCandy = peppermint(0.49);
atticCandy.position.set(0, 3.85, 2.83);
house.add(atticCandy);

const roofCandyPositions = [
  [-1.58, 4.48, 2.89, mats.pink],
  [-2.25, 3.98, 2.89, mats.green],
  [1.58, 4.48, 2.89, mats.yellow],
  [2.25, 3.98, 2.89, mats.purple]
];
for (const [x, y, z, material] of roofCandyPositions) {
  const candy = bead(new THREE.Vector3(x, y, z), 0.23, material);
  candy.scale.set(1, 0.72, 0.52);
  house.add(candy);
  house.add(bead(new THREE.Vector3(x, y + 0.16, z + 0.14), 0.055, mats.icing));
}

const chimney = new THREE.Group();
const chimneyBody = new THREE.Mesh(
  new THREE.BoxGeometry(0.78, 1.7, 0.9),
  mats.cookieDark
);
chimneyBody.position.set(-1.65, 5.05, -1.05);
chimneyBody.rotation.z = -roofAngle;
chimney.add(chimneyBody);

const chimneyCap = new THREE.Mesh(
  new THREE.BoxGeometry(1.02, 0.25, 1.08),
  mats.icing
);
chimneyCap.position.set(-1.46, 5.81, -1.05);
chimneyCap.rotation.z = -roofAngle;
chimney.add(chimneyCap);

for (let i = 0; i < 3; i++) {
  const stripe = new THREE.Mesh(
    new THREE.BoxGeometry(0.86, 0.11, 0.94),
    mats.icing
  );
  stripe.position.set(-1.77 + i * 0.08, 4.58 + i * 0.42, -1.05);
  stripe.rotation.z = -roofAngle;
  chimney.add(stripe);
}
shadowify(chimney);
house.add(chimney);

function gumdrop(x, z, material, scale = 1) {
  const group = new THREE.Group();
  const lower = new THREE.Mesh(
    new THREE.ConeGeometry(0.31 * scale, 0.55 * scale, 18, 1, false),
    material
  );
  lower.position.y = 0.3 * scale;
  group.add(lower);

  const top = new THREE.Mesh(
    new THREE.SphereGeometry(0.225 * scale, 18, 12),
    material
  );
  top.scale.y = 0.72;
  top.position.y = 0.58 * scale;
  group.add(top);

  const sugarMaterial = new THREE.MeshStandardMaterial({
    color: 0xfff7e7,
    roughness: 0.55,
    transparent: true,
    opacity: 0.82
  });
  for (let i = 0; i < 7; i++) {
    const angle = i * 2.39996;
    const sy = (0.18 + (i % 3) * 0.14) * scale;
    const radial = (0.22 - sy * 0.08) * scale;
    const crystal = bead(
      new THREE.Vector3(Math.cos(angle) * radial, sy, Math.sin(angle) * radial),
      0.024 * scale,
      sugarMaterial
    );
    group.add(crystal);
  }

  group.position.set(x, 0.2, z);
  shadowify(group);
  house.add(group);
}

gumdrop(-2.55, 3.2, mats.red, 1.12);
gumdrop(-1.78, 3.42, mats.green, 0.94);
gumdrop(1.78, 3.42, mats.yellow, 0.94);
gumdrop(2.55, 3.2, mats.purple, 1.12);
gumdrop(-3.4, 1.75, mats.pink, 0.86);
gumdrop(3.4, 1.75, mats.lime, 0.86);

const frontIcing = [
  new THREE.Vector3(-3.02, 3.04, 2.72),
  new THREE.Vector3(-2.25, 3.60, 2.72),
  new THREE.Vector3(-1.5, 4.15, 2.72),
  new THREE.Vector3(-0.75, 4.70, 2.72),
  new THREE.Vector3(0, 5.25, 2.72),
  new THREE.Vector3(0.75, 4.70, 2.72),
  new THREE.Vector3(1.5, 4.15, 2.72),
  new THREE.Vector3(2.25, 3.60, 2.72),
  new THREE.Vector3(3.02, 3.04, 2.72)
];
addPipedLine(house, frontIcing, 0.095);

for (let i = 0; i < 11; i++) {
  const x = -2.8 + i * 0.56;
  const y = 2.98 - (i % 2) * 0.1;
  house.add(bead(new THREE.Vector3(x, y, 2.77), 0.12, mats.icing));
}

const step1 = new THREE.Mesh(
  new THREE.BoxGeometry(2.25, 0.24, 0.8),
  mats.cookie
);
step1.position.set(0, 0.19, 3.02);
house.add(step1);

const stepIcing = new THREE.Mesh(
  new THREE.BoxGeometry(2.12, 0.11, 0.7),
  mats.icing
);
stepIcing.position.set(0, 0.34, 3.02);
house.add(stepIcing);
shadowify(step1);
shadowify(stepIcing);

const platter = new THREE.Mesh(
  new THREE.CylinderGeometry(5.75, 5.95, 0.38, 72),
  new THREE.MeshPhysicalMaterial({
    color: 0xf4d8d7,
    roughness: 0.2,
    clearcoat: 0.72,
    clearcoatRoughness: 0.16
  })
);
platter.position.y = -0.18;
platter.receiveShadow = true;
platter.castShadow = true;
house.add(platter);

const icingGround = new THREE.Mesh(
  new THREE.CylinderGeometry(5.35, 5.45, 0.17, 72),
  mats.icing
);
icingGround.position.y = 0.06;
icingGround.receiveShadow = true;
house.add(icingGround);

const scallopCount = 28;
for (let i = 0; i < scallopCount; i++) {
  const angle = i * Math.PI * 2 / scallopCount;
  const radius = 5.46;
  const dollop = bead(
    new THREE.Vector3(Math.cos(angle) * radius, 0.13, Math.sin(angle) * radius),
    0.19,
    i % 2 ? mats.icing : mats.pink
  );
  dollop.scale.y = 0.75;
  house.add(dollop);
}

const pathStones = [
  [0, 3.68, 0.34],
  [-0.12, 4.2, 0.29],
  [0.1, 4.66, 0.25],
  [-0.06, 5.03, 0.2]
];
for (const [x, z, size] of pathStones) {
  const stone = new THREE.Mesh(
    new THREE.CylinderGeometry(size, size * 1.08, 0.08, 20),
    mats.cookieDark
  );
  stone.position.set(x, 0.18, z);
  stone.rotation.y = z * 0.7;
  stone.castShadow = true;
  house.add(stone);
}

const crumbMaterial = new THREE.MeshStandardMaterial({ color: 0xc77939, roughness: 0.9 });
for (let i = 0; i < 34; i++) {
  const angle = i * 2.399963;
  const radius = 3.7 + (i % 5) * 0.28;
  const crumb = bead(
    new THREE.Vector3(
      Math.cos(angle) * radius,
      0.2 + (i % 3) * 0.015,
      Math.sin(angle) * radius
    ),
    0.035 + (i % 4) * 0.008,
    crumbMaterial
  );
  crumb.scale.set(1.35, 0.65, 0.9);
  house.add(crumb);
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(24, 96),
  new THREE.MeshStandardMaterial({ color: 0xe7c4c0, roughness: 0.92 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.39;
floor.receiveShadow = true;
scene.add(floor);

house.rotation.y = -0.08;

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  warmGlow.intensity = 17.5 + Math.sin(elapsed * 1.7) * 0.7;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
