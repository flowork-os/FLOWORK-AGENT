<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desert Oasis Camp</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1c213d}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x8b6370, 42, 150);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  240
);
camera.position.set(31, 19, 38);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.16;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.32;
controls.minDistance = 21;
controls.maxDistance = 78;
controls.maxPolarAngle = Math.PI * 0.48;
controls.target.set(0, 5, 0);

const rng = mulberry32(825731);
const palmAnim = [];
const reedsAnim = [];
const waterRings = [];
const fireFlames = [];
const flagAnim = [];
const sparks = [];
const clock = new THREE.Clock();

function mulberry32(seed) {
  return function seededRandom() {
    let value = seed += 0x6D2B79F5;
    value = Math.imul(value ^ value >>> 15, value | 1);
    value ^= value + Math.imul(value ^ value >>> 7, value | 61);
    return ((value ^ value >>> 14) >>> 0) / 4294967296;
  };
}

function material(color, options = {}) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: 0.82,
    metalness: 0,
    ...options
  });
}

function addMesh(geometry, mat, parent, position, rotation, scale) {
  const mesh = new THREE.Mesh(geometry, mat);
  if (position) mesh.position.copy(position);
  if (rotation) mesh.rotation.set(rotation.x, rotation.y, rotation.z);
  if (scale) mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function beamBetween(start, end, radius, mat, parent, radialSegments = 8) {
  const direction = end.clone().sub(start);
  const length = direction.length();
  const beam = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, length, radialSegments),
    mat
  );
  beam.position.copy(start).add(end).multiplyScalar(0.5);
  beam.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  beam.castShadow = true;
  beam.receiveShadow = true;
  parent.add(beam);
  return beam;
}

function makeSkyTexture() {
  const canvas = document.createElement("canvas");
  canvas.width = 8;
  canvas.height = 512;
  const context = canvas.getContext("2d");
  const gradient = context.createLinearGradient(0, 0, 0, canvas.height);
  gradient.addColorStop(0, "#171d3d");
  gradient.addColorStop(0.34, "#34375b");
  gradient.addColorStop(0.68, "#8b5260");
  gradient.addColorStop(0.88, "#d77d58");
  gradient.addColorStop(1, "#f3b56b");
  context.fillStyle = gradient;
  context.fillRect(0, 0, canvas.width, canvas.height);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function makeRugTexture(baseColor, accentColor, secondaryColor) {
  const canvas = document.createElement("canvas");
  canvas.width = 320;
  canvas.height = 180;
  const context = canvas.getContext("2d");
  context.fillStyle = baseColor;
  context.fillRect(0, 0, 320, 180);
  context.strokeStyle = accentColor;
  context.lineWidth = 12;
  context.strokeRect(9, 9, 302, 162);
  context.strokeStyle = secondaryColor;
  context.lineWidth = 4;
  context.strokeRect(24, 24, 272, 132);
  context.fillStyle = accentColor;
  for (let x = 35; x < 300; x += 42) {
    context.beginPath();
    context.moveTo(x, 90);
    context.lineTo(x + 18, 52);
    context.lineTo(x + 36, 90);
    context.lineTo(x + 18, 128);
    context.closePath();
    context.fill();
  }
  context.strokeStyle = secondaryColor;
  context.lineWidth = 3;
  for (let y = 41; y < 150; y += 22) {
    context.beginPath();
    context.moveTo(28, y);
    context.lineTo(292, y);
    context.stroke();
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  return texture;
}

function makeDune(width, depth, height, phase, duneColor) {
  const xSegments = 28;
  const zSegments = 20;
  const positions = [];
  const indices = [];
  for (let iz = 0; iz <= zSegments; iz++) {
    const v = iz / zSegments;
    const localZ = (v - 0.5) * depth;
    for (let ix = 0; ix <= xSegments; ix++) {
      const u = ix / xSegments;
      const localX = (u - 0.5) * width;
      const edge = Math.max(0, 1 - Math.pow(Math.abs(localX) / (width * 0.5), 2));
      const wave = 0.72 + 0.28 * Math.sin(v * Math.PI * 2.4 + phase);
      const ridge = 0.08 * Math.sin(localZ * 0.9 + phase) * edge;
      const y = height * Math.pow(edge, 0.58) * wave + ridge;
      positions.push(localX, Math.max(0, y), localZ);
    }
  }
  for (let iz = 0; iz < zSegments; iz++) {
    for (let ix = 0; ix < xSegments; ix++) {
      const a = iz * (xSegments + 1) + ix;
      const b = a + 1;
      const c = a + xSegments + 1;
      const d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(positions, 3)
  );
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  const dune = new THREE.Mesh(geometry, material(duneColor));
  dune.castShadow = true;
  dune.receiveShadow = true;
  return dune;
}

function makeRidgeCurve(points, color, thickness) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geometry = new THREE.TubeGeometry(curve, 32, thickness, 5, false);
  const ridge = new THREE.Mesh(geometry, material(color));
  ridge.castShadow = true;
  ridge.receiveShadow = true;
  return ridge;
}

function makePalm(scale, lean, phase) {
  const palm = new THREE.Group();
  palm.rotation.z = lean;
  palm.userData.baseLean = lean;
  palm.userData.phase = phase;

  const trunkMaterial = material(0x714735, { roughness: 1 });
  const leafMaterial = material(0x315d43, { roughness: 0.9 });
  const dryLeafMaterial = material(0x6b7445, { roughness: 0.95 });

  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.48 * scale, 0.7 * scale, 8 * scale, 10),
    trunkMaterial
  );
  trunk.position.y = 4 * scale;
  trunk.castShadow = true;
  trunk.receiveShadow = true;
  palm.add(trunk);

  for (let ringIndex = 0; ringIndex < 7; ringIndex++) {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(
        (0.52 + ringIndex * 0.008) * scale,
        0.045 * scale,
        6,
        12
      ),
      trunkMaterial
    );
    ring.rotation.x = Math.PI * 0.5;
    ring.position.y = (1.1 + ringIndex * 1.02) * scale;
    ring.castShadow = true;
    palm.add(ring);
  }

  const crown = new THREE.Group();
  crown.position.y = 8 * scale;
  palm.add(crown);

  const leafCount = 11;
  for (let leafIndex = 0; leafIndex < leafCount; leafIndex++) {
    const angle = leafIndex / leafCount * Math.PI * 2;
    const droop = leafIndex % 3 === 0 ? -0.58 : -0.34;
    const direction = new THREE.Vector3(
      Math.cos(angle),
      droop,
      Math.sin(angle)
    ).normalize();
    const leaf = new THREE.Mesh(
      new THREE.ConeGeometry(
        leafIndex % 4 === 0 ? 0.3 * scale : 0.22 * scale,
        4.5 * scale,
        6
      ),
      leafIndex % 4 === 0 ? dryLeafMaterial : leafMaterial
    );
    leaf.position.copy(direction).multiplyScalar(2.1 * scale);
    leaf.position.y += direction.y * 0.6 * scale;
    leaf.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      direction
    );
    leaf.castShadow = true;
    leaf.receiveShadow = true;
    crown.add(leaf);

    const stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.055 * scale, 0.08 * scale, 2.6 * scale, 6),
      dryLeafMaterial
    );
    stem.position.copy(direction).multiplyScalar(0.9 * scale);
    stem.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      direction
    );
    stem.castShadow = true;
    crown.add(stem);
  }

  palmAnim.push(palm);
  return palm;
}

function addPalm(x, z, scale, lean, phase) {
  const palm = makePalm(scale, lean, phase);
  palm.position.set(x, 0, z);
  scene.add(palm);
  return palm;
}

function addReeds() {
  const reedGroup = new THREE.Group();
  const reedMaterial = material(0x718247, { roughness: 0.95 });
  for (let reedIndex = 0; reedIndex < 30; reedIndex++) {
    const angle = rng() * Math.PI * 2;
    const radius = 8.9 + rng() * 1.7;
    const reed = new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.035 + rng() * 0.025,
        0.08,
        1.3 + rng() * 1.6,
        5
      ),
      reedMaterial
    );
    reed.position.set(
      Math.cos(angle) * radius,
      reed.geometry.parameters.height * 0.5,
      Math.sin(angle) * radius
    );
    reed.rotation.z = (rng() - 0.5) * 0.45;
    reed.rotation.x = (rng() - 0.5) * 0.35;
    reed.userData.baseX = reed.rotation.x;
    reed.userData.baseZ = reed.rotation.z;
    reed.userData.phase = rng() * 6;
    reed.castShadow = true;
    reed.receiveShadow = true;
    reedGroup.add(reed);
    reedsAnim.push(reed);
  }
  scene.add(reedGroup);
}

function makeRoofPanel(xA, xB, yA, yB, roofHeight, roofWidth) {
  const vertices = [
    xA, yA, 0,
    xB, yA, roofHeight,
    xB, yB, roofHeight,
    xA, yB, 0
  ];
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(vertices, 3)
  );
  geometry.setIndex([0, 1, 2, 0, 2, 3]);
  geometry.computeVertexNormals();
  return geometry;
}

function makeTriangleGeometry(y, width, height) {
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute([
      -width * 0.5, y, 0,
      width * 0.5, y, 0,
      0, y, height
    ], 3)
  );
  geometry.setIndex([0, 1, 2]);
  geometry.computeVertexNormals();
  return geometry;
}

function makeTent(x, z, scale, rotation, palette) {
  const tent = new THREE.Group();
  tent.position.set(x, 0, z);
  tent.rotation.y = rotation;
  tent.scale.setScalar(scale);

  const stripedMaterials = palette.map((entry) =>
    material(entry, { side: THREE.DoubleSide, roughness: 0.94 })
  );

  const stripeCount = 10;
  const tentLength = 7;
  const tentWidth = 7;
  const ridgeHeight = 4.5;
  for (let stripeIndex = 0; stripeIndex < stripeCount; stripeIndex++) {
    const yA = -tentLength * 0.5 + stripeIndex / stripeCount * tentLength;
    const yB = -tentLength * 0.5 + (stripeIndex + 1) / stripeCount * tentLength;
    const stripeMaterial = stripedMaterials[stripeIndex % stripedMaterials.length];

    const leftPanel = new THREE.Mesh(
      makeRoofPanel(-tentWidth * 0.5, 0, yA, yB, ridgeHeight, tentWidth),
      stripeMaterial
    );
    leftPanel.castShadow = true;
    leftPanel.receiveShadow = true;
    tent.add(leftPanel);

    const rightPanel = new THREE.Mesh(
      makeRoofPanel(0, tentWidth * 0.5, yA, yB, ridgeHeight, tentWidth),
      stripeMaterial
    );
    rightPanel.castShadow = true;
    rightPanel.receiveShadow = true;
    tent.add(rightPanel);
  }

  const endMaterial = stripedMaterials[1];
  for (const endY of [-tentLength * 0.5, tentLength * 0.5]) {
    const end = new THREE.Mesh(
      makeTriangleGeometry(endY, tentWidth, ridgeHeight),
      endMaterial
    );
    end.material = endMaterial.clone();
    end.material.side = THREE.DoubleSide;
    end.castShadow = true;
    end.receiveShadow = true;
    tent.add(end);
  }

  const entrance = new THREE.Mesh(
    makeTriangleGeometry(-tentLength * 0.5 - 0.025, 2.2, 3.25),
    material(0x241f2a, { side: THREE.DoubleSide, roughness: 1 })
  );
  entrance.position.z = 0.02;
  tent.add(entrance);

  const poleMaterial = material(0x4b3027, { roughness: 0.95 });
  beamBetween(
    new THREE.Vector3(0, 0, -tentLength * 0.5),
    new THREE.Vector3(0, ridgeHeight, -tentLength * 0.5),
    0.09,
    poleMaterial,
    tent
  );
  beamBetween(
    new THREE.Vector3(0, 0, tentLength * 0.5),
    new THREE.Vector3(0, ridgeHeight, tentLength * 0.5),
    0.09,
    poleMaterial,
    tent
  );

  const flag = new THREE.Mesh(
    new THREE.PlaneGeometry(1.25, 0.62),
    material(0xc85d45, { side: THREE.DoubleSide, roughness: 0.85 })
  );
  flag.position.set(0.6, ridgeHeight + 0.5, tentLength * 0.5);
  flag.rotation.y = Math.PI * 0.5;
  flag.userData.phase = rotation;
  tent.add(flag);
  flagAnim.push(flag);

  const base = new THREE.Mesh(
    new THREE.BoxGeometry(tentWidth + 0.5, 0.12, tentLength + 0.4),
    material(0x69402f, { roughness: 1 })
  );
  base.position.y = -0.08;
  base.receiveShadow = true;
  tent.add(base);

  scene.add(tent);
  return tent;
}

function makeCushion(position, color, rotation) {
  const cushion = new THREE.Mesh(
    new THREE.SphereGeometry(1, 16, 10),
    material(color, { roughness: 0.95 })
  );
  cushion.position.copy(position);
  cushion.rotation.y = rotation;
  cushion.scale.set(1.15, 0.28, 0.62);
  cushion.castShadow = true;
  cushion.receiveShadow = true;
  scene.add(cushion);
  return cushion;
}

function makeJar(position, scale) {
  const clayMaterial = material(0x9b5137, { roughness: 0.94 });
  const profile = [
    new THREE.Vector2(0.18, 0),
    new THREE.Vector2(0.62, 0.06),
    new THREE.Vector2(0.76, 0.34),
    new THREE.Vector2(0.68, 0.92),
    new THREE.Vector2(0.45, 1.35),
    new THREE.Vector2(0.3, 1.5),
    new THREE.Vector2(0.25, 1.72)
  ];
  const jar = new THREE.Mesh(
    new THREE.LatheGeometry(profile, 24),
    clayMaterial
  );
  jar.position.copy(position);
  jar.scale.setScalar(scale);
  jar.castShadow = true;
  jar.receiveShadow = true;
  scene.add(jar);

  const neckRing = new THREE.Mesh(
    new THREE.TorusGeometry(0.27, 0.055, 8, 18),
    clayMaterial
  );
  neckRing.position.set(position.x, position.y + 1.67 * scale, position.z);
  neckRing.scale.setScalar(scale);
  neckRing.rotation.x = Math.PI * 0.5;
  neckRing.castShadow = true;
  scene.add(neckRing);

  return jar;
}

function makePool() {
  const poolGroup = new THREE.Group();
  const rimMaterial = material(0xb06d43, { roughness: 0.88 });
  const waterMaterial = new THREE.MeshPhysicalMaterial({
    color: 0x2ec3c0,
    roughness: 0.14,
    metalness: 0.04,
    transmission: 0.08,
    transparent: true,
    opacity: 0.88,
    clearcoat: 0.6,
    clearcoatRoughness: 0.18
  });

  const basin = new THREE.Mesh(
    new THREE.CylinderGeometry(9.35, 9.8, 0.32, 64),
    rimMaterial
  );
  basin.position.y = 0.02;
  basin.receiveShadow = true;
  basin.castShadow = true;
  poolGroup.add(basin);

  const water = new THREE.Mesh(
    new THREE.CylinderGeometry(8.72, 8.72, 0.2, 64),
    waterMaterial
  );
  water.position.y = 0.25;
  water.receiveShadow = true;
  poolGroup.add(water);

  const innerRim = new THREE.Mesh(
    new THREE.TorusGeometry(8.95, 0.22, 10, 64),
    material(0xd19457, { roughness: 0.82 })
  );
  innerRim.rotation.x = Math.PI * 0.5;
  innerRim.position.y = 0.37;
  innerRim.castShadow = true;
  poolGroup.add(innerRim);

  for (let ringIndex = 0; ringIndex < 3; ringIndex++) {
    const ripple = new THREE.Mesh(
      new THREE.TorusGeometry(2.4 + ringIndex * 1.55, 0.035, 6, 64),
      material(0x8de0d0, {
        transparent: true,
        opacity: 0.34,
        roughness: 0.12
      })
    );
    ripple.rotation.x = Math.PI * 0.5;
    ripple.position.y = 0.38 + ringIndex * 0.015;
    ripple.userData.phase = ringIndex * 1.6;
    poolGroup.add(ripple);
    waterRings.push(ripple);
  }

  scene.add(poolGroup);
  return poolGroup;
}

function addPoolRocks() {
  const rockMaterial = material(0x88614a, { roughness: 1 });
  for (let rockIndex = 0; rockIndex < 18; rockIndex++) {
    const angle = rockIndex / 18 * Math.PI * 2 + rng() * 0.22;
    const radius = 9.35 + rng() * 0.9;
    const rock = new THREE.Mesh(
      new THREE.DodecahedronGeometry(0.35 + rng() * 0.42, 0),
      rockMaterial
    );
    rock.position.set(
      Math.cos(angle) * radius,
      0.34 + rng() * 0.16,
      Math.sin(angle) * radius
    );
    rock.scale.set(1.4, 0.58, 0.85);
    rock.rotation.set(rng(), rng(), rng());
    rock.castShadow = true;
    rock.receiveShadow = true;
    scene.add(rock);
  }
}

function makeRug(position, rotation, size, colors) {
  const rugTexture = makeRugTexture(colors[0], colors[1], colors[2]);
  const rug = new THREE.Mesh(
    new THREE.BoxGeometry(size.x, 0.16, size.y),
    material(0xffffff, { map: rugTexture, roughness: 0.96 })
  );
  rug.position.copy(position);
  rug.rotation.y = rotation;
  rug.castShadow = true;
  rug.receiveShadow = true;
  scene.add(rug);
  return rug;
}

function makeFire() {
  const fire = new THREE.Group();
  fire.position.set(0, 0.1, 4.6);

  const stoneMaterial = material(0x6e4d3f, { roughness: 1 });
  for (let stoneIndex = 0; stoneIndex < 12; stoneIndex++) {
    const angle = stoneIndex / 12 * Math.PI * 2;
    const stone = new THREE.Mesh(
      new THREE.DodecahedronGeometry(0.38 + rng() * 0.15, 0),
      stoneMaterial
    );
    stone.position.set(Math.cos(angle) * 1.25, 0.3, Math.sin(angle) * 1.25);
    stone.scale.set(1.15, 0.62, 0.9);
    stone.rotation.set(rng(), rng(), rng());
    stone.castShadow = true;
    stone.receiveShadow = true;
    fire.add(stone);
  }

  const logMaterial = material(0x4f2c24, { roughness: 1 });
  for (let logIndex = 0; logIndex < 3; logIndex++) {
    const log = new THREE.Mesh(
      new THREE.CylinderGeometry(0.19, 0.23, 2.7, 8),
      logMaterial
    );
    log.position.y = 0.56 + logIndex * 0.08;
    log.rotation.z = Math.PI * 0.5;
    log.rotation.y = logIndex * 1.05;
    log.castShadow = true;
    fire.add(log);
  }

  const outerFlameMaterial = new THREE.MeshStandardMaterial({
    color: 0xff6c2e,
    emissive: 0xd52b12,
    emissiveIntensity: 2.3,
    roughness: 0.45
  });
  const innerFlameMaterial = new THREE.MeshStandardMaterial({
    color: 0xffd45a,
    emissive: 0xff751f,
    emissiveIntensity: 2.8,
    roughness: 0.34
  });

  const outerFlame = new THREE.Mesh(
    new THREE.ConeGeometry(0.95, 2.8, 8),
    outerFlameMaterial
  );
  outerFlame.position.y = 1.8;
  outerFlame.scale.set(1, 1, 0.8);
  outerFlame.userData.baseScale = outerFlame.scale.clone();
  outerFlame.userData.phase = 0.2;
  outerFlame.castShadow = true;
  fire.add(outerFlame);
  fireFlames.push(outerFlame);

  const innerFlame = new THREE.Mesh(
    new THREE.ConeGeometry(0.56, 1.9, 7),
    innerFlameMaterial
  );
  innerFlame.position.set(0.18, 1.45, 0.04);
  innerFlame.scale.set(1, 1, 0.72);
  innerFlame.userData.baseScale = innerFlame.scale.clone();
  innerFlame.userData.phase = 1.5;
  innerFlame.castShadow = true;
  fire.add(innerFlame);
  fireFlames.push(innerFlame);

  const fireLight = new THREE.PointLight(0xff7436, 5.2, 18, 2);
  fireLight.position.set(0, 2.1, 0);
  fireLight.castShadow = true;
  fireLight.shadow.mapSize.set(1024, 1024);
  fireLight.shadow.bias = -0.002;
  fire.add(fireLight);
  fire.userData.light = fireLight;

  const sparkPositions = [];
  for (let sparkIndex = 0; sparkIndex < 38; sparkIndex++) {
    const angle = rng() * Math.PI * 2;
    const radius = rng() * 0.62;
    const spark = {
      x: Math.cos(angle) * radius,
      y: 1.3 + rng() * 2.7,
      z: Math.sin(angle) * radius,
      velocity: 0.55 + rng() * 0.85,
      phase: rng() * 6
    };
    sparks.push(spark);
    sparkPositions.push(spark.x, spark.y, spark.z);
  }
  const sparkGeometry = new THREE.BufferGeometry();
  sparkGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(sparkPositions, 3)
  );
  const sparkMaterial = new THREE.PointsMaterial({
    color: 0xffc45a,
    size: 0.17,
    transparent: true,
    opacity: 0.9,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const sparkPoints = new THREE.Points(sparkGeometry, sparkMaterial);
  fire.add(sparkPoints);
  fire.userData.sparkGeometry = sparkGeometry;
  fire.userData.sparkMaterial = sparkMaterial;

  scene.add(fire);
  return fire;
}

function makeCamel() {
  const camel = new THREE.Group();
  camel.position.set(19, 0, -5);
  camel.rotation.y = -0.35;
  const silhouetteMaterial = material(0x2d2529, { roughness: 1 });

  const body = new THREE.Mesh(
    new THREE.SphereGeometry(2.25, 18, 12),
    silhouetteMaterial
  );
  body.position.set(0, 2.3, 0);
  body.scale.set(1.5, 0.72, 0.72);
  body.castShadow = true;
  camel.add(body);

  for (const humpX of [-0.8, 0.72]) {
    const hump = new THREE.Mesh(
      new THREE.SphereGeometry(1.1, 14, 10),
      silhouetteMaterial
    );
    hump.position.set(humpX, 3.25, 0);
    hump.scale.set(0.72, 1.05, 0.72);
    hump.castShadow = true;
    camel.add(hump);
  }

  beamBetween(
    new THREE.Vector3(1.95, 2.35, 0),
    new THREE.Vector3(3.1, 5.0, 0),
    0.52,
    silhouetteMaterial,
    camel,
    10
  );

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.82, 14, 10),
    silhouetteMaterial
  );
  head.position.set(3.38, 5.15, 0);
  head.scale.set(1.05, 0.82, 0.72);
  head.castShadow = true;
  camel.add(head);

  const muzzle = new THREE.Mesh(
    new THREE.SphereGeometry(0.48, 12, 8),
    silhouetteMaterial
  );
  muzzle.position.set(4.0, 4.96, 0);
  muzzle.scale.set(1.15, 0.65, 0.72);
  muzzle.castShadow = true;
  camel.add(muzzle);

  for (const earZ of [-0.42, 0.42]) {
    const ear = new THREE.Mesh(
      new THREE.ConeGeometry(0.18, 0.72, 5),
      silhouetteMaterial
    );
    ear.position.set(3.2, 5.86, earZ);
    ear.rotation.x = earZ > 0 ? -0.38 : 0.38;
    ear.castShadow = true;
    camel.add(ear);
  }

  for (const legX of [-1.25, 1.25]) {
    for (const legZ of [-0.48, 0.48]) {
      beamBetween(
        new THREE.Vector3(legX, 1.62, legZ),
        new THREE.Vector3(legX + 0.1, 0.2, legZ),
        0.2,
        silhouetteMaterial,
        camel
      );
    }
  }

  beamBetween(
    new THREE.Vector3(-2.0, 2.7, 0),
    new THREE.Vector3(-3.2, 3.65, 0.06),
    0.12,
    silhouetteMaterial,
    camel
  );

  const saddle = new THREE.Mesh(
    new THREE.BoxGeometry(1.65, 0.22, 1.35),
    material(0x754838, { roughness: 0.96 })
  );
  saddle.position.set(-0.1, 3.7, 0);
  saddle.rotation.z = -0.05;
  saddle.castShadow = true;
  camel.add(saddle);

  scene.add(camel);
  return camel;
}

function addShrub(position, scale) {
  const shrubGroup = new THREE.Group();
  shrubGroup.position.copy(position);
  const shrubMaterial = material(0x667044, { roughness: 1 });
  for (let branchIndex = 0; branchIndex < 7; branchIndex++) {
    const direction = new THREE.Vector3(
      rng() - 0.5,
      0.25 + rng() * 0.45,
      rng() - 0.5
    ).normalize();
    const branch = new THREE.Mesh(
      new THREE.CylinderGeometry(0.035, 0.08, 1.5 * scale, 5),
      shrubMaterial
    );
    branch.position.copy(direction).multiplyScalar(0.65 * scale);
    branch.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      direction
    );
    branch.castShadow = true;
    shrubGroup.add(branch);
  }
  scene.add(shrubGroup);
}

function animateScene() {
  requestAnimationFrame(animateScene);
  const elapsed = clock.getElapsedTime();

  controls.update();

  for (const palm of palmAnim) {
    palm.rotation.z =
      palm.userData.baseLean +
      Math.sin(elapsed * 0.72 + palm.userData.phase) * 0.021;
    const crown = palm.children[palm.children.length - 1];
    crown.rotation.y = Math.sin(elapsed * 0.32 + palm.userData.phase) * 0.035;
  }

  for (const reed of reedsAnim) {
    reed.rotation.z =
      reed.userData.baseZ +
      Math.sin(elapsed * 1.15 + reed.userData.phase) * 0.055;
    reed.rotation.x =
      reed.userData.baseX +
      Math.cos(elapsed * 0.92 + reed.userData.phase) * 0.04;
  }

  for (const ripple of waterRings) {
    ripple.rotation.z =
      elapsed * (0.06 + ripple.userData.phase * 0.012) +
      ripple.userData.phase;
    const pulse = 1 + Math.sin(elapsed * 0.7 + ripple.userData.phase) * 0.018;
    ripple.scale.set(pulse, pulse, pulse);
  }

  for (const flame of fireFlames) {
    const pulse = 1 + Math.sin(elapsed * 7.2 + flame.userData.phase) * 0.12;
    flame.scale.set(
      flame.userData.baseScale.x * (1 + Math.cos(elapsed * 5.5 + flame.userData.phase) * 0.08),
      flame.userData.baseScale.y * pulse,
      flame.userData.baseScale.z * (1 + Math.sin(elapsed * 6.3 + flame.userData.phase) * 0.09)
    );
    flame.rotation.y = Math.sin(elapsed * 4.5 + flame.userData.phase) * 0.12;
  }

  fire.userData.light.intensity =
    4.6 + Math.sin(elapsed * 8.5) * 0.55 + Math.sin(elapsed * 13.2) * 0.28;
  fire.userData.sparkMaterial.opacity =
    0.7 + Math.sin(elapsed * 4.2) * 0.2;

  const sparkAttribute = fire.userData.sparkGeometry.attributes.position;
  for (let sparkIndex = 0; sparkIndex < sparks.length; sparkIndex++) {
    const spark = sparks[sparkIndex];
    spark.y += spark.velocity * 0.016;
    spark.x += Math.sin(elapsed * 2.1 + spark.phase) * 0.004;
    spark.z += Math.cos(elapsed * 2.5 + spark.phase) * 0.004;
    if (spark.y > 5.2) {
      spark.y = 1.25;
      spark.x = (rng() - 0.5) * 0.9;
      spark.z = (rng() - 0.5) * 0.9;
    }
    sparkAttribute.array[sparkIndex * 3] = spark.x;
    sparkAttribute.array[sparkIndex * 3 + 1] = spark.y;
    sparkAttribute.array[sparkIndex * 3 + 2] = spark.z;
  }
  sparkAttribute.needsUpdate = true;

  starMaterial.opacity = 0.66 + Math.sin(elapsed * 0.45) * 0.12;

  for (const flag of flagAnim) {
    flag.rotation.z = Math.sin(elapsed * 1.1 + flag.userData.phase) * 0.08;
    flag.scale.x = 1 + Math.sin(elapsed * 1.3 + flag.userData.phase) * 0.04;
  }

  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
