<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art Deco Concert Harp</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#090b10}
  canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090b10);
scene.fog = new THREE.Fog(0x090b10, 14, 28);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.2, 5.8, 12.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
controls.minDistance = 8;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.53;

const black = new THREE.MeshPhysicalMaterial({
  color: 0x08090d, metalness: 0.38, roughness: 0.17,
  clearcoat: 1, clearcoatRoughness: 0.08
});
const blackSoft = new THREE.MeshPhysicalMaterial({
  color: 0x101116, metalness: 0.18, roughness: 0.27,
  clearcoat: 0.75, clearcoatRoughness: 0.14
});
const gold = new THREE.MeshPhysicalMaterial({
  color: 0xd5a737, metalness: 0.9, roughness: 0.25,
  clearcoat: 0.35, clearcoatRoughness: 0.17
});
const goldDark = new THREE.MeshStandardMaterial({
  color: 0x805a13, metalness: 0.92, roughness: 0.32
});
const stringMat = new THREE.MeshPhysicalMaterial({
  color: 0xf9d777, metalness: 0.72, roughness: 0.2,
  emissive: 0x2d1a04, emissiveIntensity: 0.18
});
const redString = new THREE.MeshPhysicalMaterial({
  color: 0x9f1822, metalness: 0.45, roughness: 0.28,
  emissive: 0x260307, emissiveIntensity: 0.15
});

function mesh(geometry, material, x=0, y=0, z=0) {
  const m = new THREE.Mesh(geometry, material);
  m.position.set(x,y,z);
  m.castShadow = m.receiveShadow = true;
  return m;
}
function cylinder(a,b,h,material,x,y,z,segments=32) {
  return mesh(new THREE.CylinderGeometry(a,b,h,segments,1), material, x,y,z);
}
function tube(points, radius, material, segments=96, radial=10) {
  const curve = new THREE.CatmullRomCurve3(points, false, "centripetal");
  const m = mesh(new THREE.TubeGeometry(curve, segments, radius, radial, false), material);
  return m;
}
function box(w,h,d,material,x,y,z,bevel=0) {
  let g = new THREE.BoxGeometry(w,h,d);
  if (bevel) {
    g = new THREE.ExtrudeGeometry(new THREE.Shape()
      .moveTo(-w/2+bevel,-h/2).lineTo(w/2-bevel,-h/2)
      .quadraticCurveTo(w/2,-h/2,w/2,-h/2+bevel)
      .lineTo(w/2,h/2-bevel).quadraticCurveTo(w/2,h/2,w/2-bevel,h/2)
      .lineTo(-w/2+bevel,h/2).quadraticCurveTo(-w/2,h/2,-w/2,h/2-bevel)
      .lineTo(-w/2,-h/2+bevel).quadraticCurveTo(-w/2,-h/2,-w/2+bevel,-h/2),
      { depth:d, bevelEnabled:false });
    g.translate(0,0,-d/2);
  }
  return mesh(g,material,x,y,z);
}

const harp = new THREE.Group();
harp.rotation.y = -0.11;
scene.add(harp);

const pedestal = new THREE.Group();
harp.add(pedestal);
pedestal.add(cylinder(2.05, 2.25, 0.22, goldDark, 0, 0.11, 0, 64));
pedestal.add(cylinder(1.84, 1.98, 0.22, black, 0, 0.30, 0, 64));
pedestal.add(cylinder(1.55, 1.72, 0.20, gold, 0, 0.50, 0, 64));
for(let i=0;i<16;i++){
  const a=i/16*Math.PI*2;
  const r=1.88;
  pedestal.add(cylinder(0.04,0.04,0.18,gold,Math.cos(a)*r,0.43,Math.sin(a)*r,8));
}

const base = new THREE.Group();
harp.add(base);
base.add(box(3.1,0.27,0.86,black,0,0.74,0,0.09));
base.add(box(2.85,0.10,0.95,gold,0,0.88,0,0.04));
base.add(box(2.45,0.19,0.61,blackSoft,0,1.01,0,0.06));
for (const x of [-1.15,0,1.15]) {
  const ornament = cylinder(0.105,0.105,0.13,gold,x,1.15,0,16);
  base.add(ornament);
}

const columnX = -1.16;
const column = new THREE.Group();
harp.add(column);
column.add(cylinder(0.31,0.38,6.33,black, columnX,4.13,0,48));
column.add(cylinder(0.365,0.42,0.24,gold, columnX,1.08,0,48));
column.add(cylinder(0.39,0.35,0.23,gold, columnX,7.21,0,48));
for(let i=0;i<10;i++){
  const y=1.48+i*0.57;
  const ring=cylinder(0.337,0.337,0.045,goldDark,columnX,y,0,40);
  column.add(ring);
}
for(let i=0;i<8;i++){
  const a=(i/8)*Math.PI*2;
  const r=0.326;
  const flute = cylinder(0.025,0.025,5.82,gold,
    columnX+Math.cos(a)*r,4.14,Math.sin(a)*r,8);
  column.add(flute);
}
for(let i=0;i<6;i++){
  const y=2.0+i*0.77;
  const chevron = new THREE.Group();
  const left=box(0.37,0.062,0.052,gold,columnX-0.13,y,0.35);
  const right=box(0.37,0.062,0.052,gold,columnX+0.13,y,0.35);
  left.rotation.z=-0.58; right.rotation.z=0.58;
  column.add(left,right);
}

const soundboard = new THREE.Group();
harp.add(soundboard);
const boardPts=[
  new THREE.Vector3(1.22,1.05,0), new THREE.Vector3(1.38,2.2,0),
  new THREE.Vector3(1.50,3.45,0), new THREE.Vector3(1.57,4.65,0),
  new THREE.Vector3(1.61,5.72,0), new THREE.Vector3(1.63,6.54,0)
];
soundboard.add(tube(boardPts,0.25,black,80,20));
soundboard.add(tube(boardPts.map(p=>p.clone().add(new THREE.Vector3(-0.03,0,0.22))),0.041,gold,80,10));
soundboard.add(tube(boardPts.map(p=>p.clone().add(new THREE.Vector3(-0.03,0,-0.22))),0.041,gold,80,10));
for(let i=0;i<9;i++){
  const t=i/8;
  const y=1.45+t*4.65;
  const x=1.27+t*0.32;
  const band=box(0.16,0.07,0.56,goldDark,x,y,0,0.02);
  band.rotation.z=-0.05;
  soundboard.add(band);
}

const neckPoints=[
  new THREE.Vector3(columnX,7.20,0), new THREE.Vector3(-0.55,7.52,0),
  new THREE.Vector3(0.35,7.49,0), new THREE.Vector3(1.08,7.16,0),
  new THREE.Vector3(1.48,6.65,0), new THREE.Vector3(1.63,6.48,0)
];
harp.add(tube(neckPoints,0.29,black,100,20));
harp.add(tube(neckPoints.map(p=>p.clone().add(new THREE.Vector3(0,0,0.235))),0.045,gold,100,10));
harp.add(tube(neckPoints.map(p=>p.clone().add(new THREE.Vector3(0,0,-0.235))),0.045,gold,100,10));

const crown = new THREE.Group();
harp.add(crown);
crown.position.set(-0.97,7.32,0);
crown.add(cylinder(0.42,0.34,0.15,gold,0,0,0,48));
crown.add(cylinder(0.32,0.41,0.17,black,0,0.15,0,48));
for(let i=0;i<9;i++){
  const a=-1.04+i*0.26;
  const blade=box(0.055,0.56,0.055,gold,Math.sin(a)*0.31,0.43+Math.cos(a)*0.10,0);
  blade.rotation.z=a;
  crown.add(blade);
}
crown.add(cylinder(0.11,0.11,0.16,gold,0,0.58,0,20));

const topY = 7.27, bottomY = 1.18;
const topX = -0.76, bottomX = 1.27;
for(let i=0;i<39;i++){
  const t=i/38;
  const x=THREE.MathUtils.lerp(topX,bottomX,t);
  const yTop=topY-0.06*Math.sin(t*Math.PI);
  const yBottom=bottomY+0.12*t;
  const radius=i===18||i===25?0.018:0.0105;
  const str=cylinder(radius,radius,yTop-yBottom,(i===18||i===25)?redString:stringMat,x,(yTop+yBottom)/2,0,8);
  harp.add(str);
  const peg=cylinder(0.035,0.035,0.17,gold,x,yTop,0.18,10);
  peg.rotation.x=Math.PI/2;
  harp.add(peg);
}
for(let i=0;i<39;i+=3){
  const t=i/38;
  const x=THREE.MathUtils.lerp(topX,bottomX,t);
  harp.add(cylinder(0.027,0.027,0.11,gold,x,1.15+0.12*t,0,10));
}

const floor = mesh(new THREE.CircleGeometry(12,96), new THREE.MeshStandardMaterial({
  color:0x10131b, metalness:0.05, roughness:0.45
}),0,0,0);
floor.rotation.x=-Math.PI/2;
floor.receiveShadow=true;
scene.add(floor);

const key = new THREE.DirectionalLight(0xffe3a0, 4.0);
key.position.set(5,10,7); key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-8; key.shadow.camera.right=8;
key.shadow.camera.top=9; key.shadow.camera.bottom=-2;
scene.add(key);
const fill = new THREE.PointLight(0x5679c9, 35, 18, 2);
fill.position.set(-5,5,-4); scene.add(fill);
const rim = new THREE.PointLight(0xffbd45, 32, 13, 2);
rim.position.set(2,7,-5); scene.add(rim);
scene.add(new THREE.HemisphereLight(0x334c79,0x120e09,1.25));

const halo = new THREE.Mesh(
  new THREE.RingGeometry(5.2,5.28,96),
  new THREE.MeshBasicMaterial({color:0x5c4820,transparent:true,opacity:0.45,side:THREE.DoubleSide})
);
halo.rotation.x=-Math.PI/2;
halo.position.y=0.012;
scene.add(halo);

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
