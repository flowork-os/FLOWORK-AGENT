<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metal Workshop Stool</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #1b1d1e;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x202325);
  scene.fog = new THREE.Fog(0x202325, 10, 22);

  const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(6.2, 4.7, 7.2);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.9, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.65;
  controls.minDistance = 5;
  controls.maxDistance = 13;
  controls.maxPolarAngle = Math.PI * 0.49;

  const hemi = new THREE.HemisphereLight(0xcbd8df, 0x29231d, 1.45);
  scene.add(hemi);

  const keyLight = new THREE.DirectionalLight(0xfff1dc, 4.1);
  keyLight.position.set(4.5, 7.5, 5);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.left = -5;
  keyLight.shadow.camera.right = 5;
  keyLight.shadow.camera.top = 6;
  keyLight.shadow.camera.bottom = -3;
  keyLight.shadow.camera.near = 1;
  keyLight.shadow.camera.far = 18;
  keyLight.shadow.bias = -0.00025;
  scene.add(keyLight);

  const rimLight = new THREE.DirectionalLight(0x8db9d2, 1.5);
  rimLight.position.set(-5, 4, -4);
  scene.add(rimLight);

  const warmLight = new THREE.PointLight(0xffa85c, 18, 10, 2);
  warmLight.position.set(-3.2, 2.8, 3.5);
  scene.add(warmLight);

  const steelMaterial = new THREE.MeshStandardMaterial({
    color: 0x6f7779,
    metalness: 0.88,
    roughness: 0.31
  });

  const darkSteelMaterial = new THREE.MeshStandardMaterial({
    color: 0x3d4446,
    metalness: 0.82,
    roughness: 0.43
  });

  const seatMaterial = new THREE.MeshStandardMaterial({
    color: 0x747b7d,
    metalness: 0.9,
    roughness: 0.37
  });

  const edgeMaterial = new THREE.MeshStandardMaterial({
    color: 0x52595b,
    metalness: 0.9,
    roughness: 0.3
  });

  const rubberMaterial = new THREE.MeshStandardMaterial({
    color: 0x17191a,
    metalness: 0.02,
    roughness: 0.86
  });

  const rubberScuffMaterial = new THREE.MeshStandardMaterial({
    color: 0x68635b,
    metalness: 0,
    roughness: 0.95
  });

  const scratchMaterial = new THREE.MeshStandardMaterial({
    color: 0x252a2b,
    metalness: 0.7,
    roughness: 0.55
  });

  const stool = new THREE.Group();
  stool.rotation.y = Math.PI * 0.08;
  scene.add(stool);

  function setShadows(object) {
    object.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });
  }

  function cylinderBetween(start, end, radius, material, radialSegments = 20) {
    const delta = new THREE.Vector3().subVectors(end, start);
    const length = delta.length();
    const geometry = new THREE.CylinderGeometry(radius, radius, length, radialSegments, 1, false);
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.copy(start).add(end).multiplyScalar(0.5);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
    return mesh;
  }

  function pointAlong(start, end, amount) {
    return new THREE.Vector3().copy(start).lerp(end, amount);
  }

  const seatTop = new THREE.Mesh(
    new THREE.CylinderGeometry(1.43, 1.43, 0.13, 96, 1, false),
    seatMaterial
  );
  seatTop.position.y = 3.55;
  stool.add(seatTop);

  const seatEdge = new THREE.Mesh(
    new THREE.TorusGeometry(1.375, 0.09, 16, 96),
    edgeMaterial
  );
  seatEdge.rotation.x = Math.PI / 2;
  seatEdge.position.y = 3.535;
  stool.add(seatEdge);

  const underside = new THREE.Mesh(
    new THREE.CylinderGeometry(1.18, 1.28, 0.105, 72),
    darkSteelMaterial
  );
  underside.position.y = 3.425;
  stool.add(underside);

  const centerPlate = new THREE.Mesh(
    new THREE.CylinderGeometry(0.61, 0.68, 0.09, 48),
    darkSteelMaterial
  );
  centerPlate.position.y = 3.34;
  stool.add(centerPlate);

  const seatScratches = [
    [-0.66, 0.35, 0.36, -0.12],
    [0.13, 0.72, 0.54, 0.10],
    [-0.22, -0.48, 0.28, 0.22],
    [0.55, -0.38, 0.22, -0.08],
    [-0.88, -0.16, 0.19, 0.06],
    [0.25, 0.12, 0.31, -0.18],
    [-0.18, 0.91, 0.18, 0.04]
  ];

  for (const mark of seatScratches) {
    const start = new THREE.Vector3(mark[0], 3.619, mark[1]);
    const end = new THREE.Vector3(mark[0] + mark[2], 3.619, mark[1] + mark[3]);
    const scratch = cylinderBetween(start, end, 0.008, scratchMaterial, 8);
    stool.add(scratch);
  }

  const legData = [];
  const topRadius = 0.82;
  const bottomRadius = 1.27;
  const legTopY = 3.34;
  const legBottomY = 0.16;

  for (let index = 0; index < 4; index++) {
    const angle = Math.PI * 0.25 + index * Math.PI * 0.5;
    const top = new THREE.Vector3(
      Math.cos(angle) * topRadius,
      legTopY,
      Math.sin(angle) * topRadius
    );
    const bottom = new THREE.Vector3(
      Math.cos(angle) * bottomRadius,
      legBottomY,
      Math.sin(angle) * bottomRadius
    );
    legData.push({ top, bottom, angle });

    const steelBottom = pointAlong(bottom, top, 0.105);
    const leg = cylinderBetween(steelBottom, top, 0.075, steelMaterial, 24);
    stool.add(leg);

    const upperCollarStart = pointAlong(top, bottom, 0.01);
    const upperCollarEnd = pointAlong(top, bottom, 0.115);
    const upperCollar = cylinderBetween(upperCollarStart, upperCollarEnd, 0.095, darkSteelMaterial, 24);
    stool.add(upperCollar);

    const footTop = pointAlong(bottom, top, 0.145);
    const foot = cylinderBetween(bottom, footTop, 0.105, rubberMaterial, 24);
    stool.add(foot);

    const sole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.116, 0.116, 0.035, 24),
      rubberMaterial
    );
    sole.position.copy(bottom);
    sole.position.y = 0.105;
    stool.add(sole);

    const scuffStart = pointAlong(bottom, footTop, 0.32);
    const scuffEnd = pointAlong(bottom, footTop, 0.43);
    const scuff = cylinderBetween(scuffStart, scuffEnd, 0.108, rubberScuffMaterial, 24);
    scuff.material = rubberScuffMaterial;
    stool.add(scuff);
  }

  const braceY = 1.48;
  const interpolation = (braceY - legBottomY) / (legTopY - legBottomY);
  const braceRadius = bottomRadius + (topRadius - bottomRadius) * interpolation;

  const ringBrace = new THREE.Mesh(
    new THREE.TorusGeometry(braceRadius, 0.064, 16, 96),
    steelMaterial
  );
  ringBrace.rotation.x = Math.PI / 2;
  ringBrace.position.y = braceY;
  stool.add(ringBrace);

  for (const data of legData) {
    const contact = pointAlong(data.bottom, data.top, interpolation);
    const weld = new THREE.Mesh(
      new THREE.SphereGeometry(0.105, 18, 12),
      darkSteelMaterial
    );
    weld.position.copy(contact);
    weld.scale.set(1.15, 0.52, 0.82);
    weld.rotation.y = -data.angle;
    stool.add(weld);

    const weldHighlight = new THREE.Mesh(
      new THREE.TorusGeometry(0.076, 0.012, 8, 18),
      steelMaterial
    );
    weldHighlight.position.copy(contact);
    weldHighlight.rotation.set(Math.PI / 2, 0, -data.angle);
    stool.add(weldHighlight);
  }

  const undersideBolts = [
    [0.43, 0.43],
    [-0.43, 0.43],
    [0.43, -0.43],
    [-0.43, -0.43]
  ];

  for (const boltPosition of undersideBolts) {
    const bolt = new THREE.Mesh(
      new THREE.CylinderGeometry(0.055, 0.055, 0.045, 12),
      steelMaterial
    );
    bolt.position.set(boltPosition[0], 3.285, boltPosition[1]);
    stool.add(bolt);
  }

  setShadows(stool);

  const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0x55514a,
    metalness: 0.03,
    roughness: 0.89
  });

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 30),
    floorMaterial
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0.075;
  floor.receiveShadow = true;
  scene.add(floor);

  const floorMarksMaterial = new THREE.MeshStandardMaterial({
    color: 0x292a28,
    roughness: 1,
    transparent: true,
    opacity: 0.42
  });

  const floorMarks = [
    [-2.1, -1.25, 1.35, 0.025, 0.12],
    [1.45, 1.05, 0.86, 0.018, -0.48],
    [-0.55, 1.75, 1.1, 0.022, 0.8],
    [2.2, -0.6, 0.7, 0.02, -0.15],
    [-1.7, 1.05, 0.52, 0.018, 0.4]
  ];

  for (const mark of floorMarks) {
    const line = new THREE.Mesh(
      new THREE.BoxGeometry(mark[2], 0.004, mark[3]),
      floorMarksMaterial
    );
    line.position.set(mark[0], 0.079, mark[1]);
    line.rotation.y = mark[4];
    line.receiveShadow = true;
    scene.add(line);
  }

  const oilStain = new THREE.Mesh(
    new THREE.CircleGeometry(0.48, 48),
    new THREE.MeshStandardMaterial({
      color: 0x252722,
      roughness: 0.72,
      transparent: true,
      opacity: 0.32
    })
  );
  oilStain.rotation.x = -Math.PI / 2;
  oilStain.scale.set(1.5, 0.72, 1);
  oilStain.position.set(-2.1, 0.081, -0.85);
  scene.add(oilStain);

  const wall = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 12),
    new THREE.MeshStandardMaterial({
      color: 0x34383a,
      roughness: 0.92
    })
  );
  wall.position.set(0, 5.5, -6.5);
  wall.receiveShadow = true;
  scene.add(wall);

  const baseStrip = new THREE.Mesh(
    new THREE.BoxGeometry(30, 0.28, 0.16),
    new THREE.MeshStandardMaterial({
      color: 0x25282a,
      roughness: 0.78,
      metalness: 0.12
    })
  );
  baseStrip.position.set(0, 0.22, -6.38);
  baseStrip.receiveShadow = true;
  scene.add(baseStrip);

  function resize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  window.addEventListener('resize', resize);

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
