<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carved Wood Pelican</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c7b08b}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc7b08b);
scene.fog = new THREE.Fog(0xc7b08b, 12, 25);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.2, 4.8, 9.2);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 6;
controls.maxDistance = 15;
controls.target.set(0, 2.45, 0);

const wood = new THREE.MeshStandardMaterial({
  color:0x9b6338, roughness:0.76, metalness:0.02, flatShading:true
});
const woodLight = new THREE.MeshStandardMaterial({
  color:0xb77b45, roughness:0.72, flatShading:true
});
const woodDark = new THREE.MeshStandardMaterial({
  color:0x5b321e, roughness:0.84, flatShading:true
});
const pouchMaterial = new THREE.MeshStandardMaterial({
  color:0xa96d3b, roughness:0.8, flatShading:true
});
const billMaterial = new THREE.MeshStandardMaterial({
  color:0xc18b3d, roughness:0.64, flatShading:true
});
const billDark = new THREE.MeshStandardMaterial({
  color:0x875728, roughness:0.72, flatShading:true
});
const footMaterial = new THREE.MeshStandardMaterial({
  color:0x75421f, roughness:0.78, flatShading:true
});
const eyeMaterial = new THREE.MeshStandardMaterial({
  color:0x050403, roughness:0.16, metalness:0.55
});
const eyeGlintMaterial = new THREE.MeshBasicMaterial({ color:0xfff2cf });

function mesh(geometry, material, position, scale, rotation) {
  const object = new THREE.Mesh(geometry, material);
  if (position) object.position.set(position[0], position[1], position[2]);
  if (scale) object.scale.set(scale[0], scale[1], scale[2]);
  if (rotation) object.rotation.set(rotation[0], rotation[1], rotation[2]);
  object.castShadow = true;
  object.receiveShadow = true;
  scene.add(object);
  return object;
}

const body = mesh(new THREE.IcosahedronGeometry(1, 2), wood, [0,2.25,0], [1.55,2.05,1.08], [0,0,0]);
const belly = mesh(new THREE.SphereGeometry(1, 12, 8), woodLight, [0,2.05,0.78], [1.18,1.55,0.42], [0,0,0]);

const neck = mesh(new THREE.CylinderGeometry(0.78, 1.12, 1.85, 9, 1), wood, [0,3.65,0.05], [1,1,0.94], [0,0,0]);
const head = mesh(new THREE.IcosahedronGeometry(1, 2), woodLight, [0,4.55,0.03], [1.12,0.91,0.95], [0,0,0]);

const pouch = mesh(new THREE.SphereGeometry(1, 14, 10), pouchMaterial, [0,3.43,0.62], [1.28,1.14,0.78], [0,0,0]);
const pouchFold = mesh(new THREE.TorusGeometry(0.72,0.075,6,16,Math.PI), woodDark, [0,3.72,1.16], [1.22,0.55,0.72], [Math.PI/2,0,0]);

const billTop = mesh(new THREE.BoxGeometry(2.72,0.26,2.15), billMaterial, [0,4.76,1.14], [1,1,1], [0,0,0]);
const billTip = mesh(new THREE.BoxGeometry(2.48,0.18,0.45), billDark, [0,4.61,2.37], [1,1,1], [0,0,0]);
const billLower = mesh(new THREE.BoxGeometry(2.48,0.18,1.58), billMaterial, [0,4.46,1.28], [1,1,1], [0,0,0]);

const eyeLeft = mesh(new THREE.SphereGeometry(0.145,12,8), eyeMaterial, [-0.7,4.72,0.73], [1,1,0.72], [0,0,0]);
const eyeRight = mesh(new THREE.SphereGeometry(0.145,12,8), eyeMaterial, [0.7,4.72,0.73], [1,1,0.72], [0,0,0]);
mesh(new THREE.SphereGeometry(0.034,8,6), eyeGlintMaterial, [-0.745,4.765,0.82], [1,1,0.4], [0,0,0]);
mesh(new THREE.SphereGeometry(0.034,8,6), eyeGlintMaterial, [0.655,4.765,0.82], [1,1,0.4], [0,0,0]);

function createWing(side) {
  const shape = new THREE.Shape();
  shape.moveTo(0,0.95);
  shape.lineTo(0.62,0.72);
  shape.lineTo(1.15,0.05);
  shape.lineTo(1.02,-1.12);
  shape.lineTo(0.56,-1.52);
  shape.lineTo(0.16,-1.22);
  shape.lineTo(-0.08,-0.28);
  shape.closePath();
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth:0.25,
    bevelEnabled:true,
    bevelSegments:1,
    bevelSize:0.055,
    bevelThickness:0.06
  });
  geometry.computeVertexNormals();
  const wing = mesh(geometry, wood, [side*1.02,2.58,0.36], [side,1,1], [0,0,0]);
  wing.rotation.y = side < 0 ? Math.PI : 0;
  return wing;
}
createWing(1);
createWing(-1);

function grain(points, radius, material, parentPosition) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0],p[1],p[2])));
  const geometry = new THREE.TubeGeometry(curve, 24, radius, 5, false);
  return mesh(geometry, material, parentPosition || [0,0,0], [1,1,1], [0,0,0]);
}

grain([
  [-0.78,1.0,1.02],[-0.52,1.65,1.09],[-0.36,2.45,1.08],[-0.18,3.18,1.02],[-0.08,3.95,0.94]
],0.035,woodDark);
grain([
  [0.82,0.86,1.0],[0.58,1.58,1.08],[0.38,2.38,1.06],[0.22,3.15,1.00],[0.12,3.95,0.92]
],0.028,woodDark);
grain([
  [-1.02,3.25,0.62],[-0.9,3.7,0.7],[-0.75,4.1,0.72],[-0.57,4.42,0.68]
],0.026,woodDark);
grain([
  [1.02,3.22,0.62],[0.9,3.72,0.7],[0.75,4.12,0.72],[0.57,4.42,0.68]
],0.026,woodDark);

function wingStreak(side, offset) {
  grain([
    [0.18,3.36,0.55],
    [0.58,3.02,0.59],
    [0.86,2.48,0.61],
    [0.94,1.8,0.62],
    [0.78,1.25,0.61]
  ],0.038,woodDark,[side*offset,0,0]);
}
wingStreak(1,0.08);
wingStreak(-1,0.08);

function facet(points, color, position) {
  const vertices = new Float32Array(points.flat());
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(vertices,3));
  geometry.computeVertexNormals();
  const material = new THREE.MeshStandardMaterial({
    color,
    roughness:0.82,
    side:THREE.DoubleSide,
    flatShading:true
  });
  return mesh(geometry, material, position || [0,0,0], [1,1,1], [0,0,0]);
}
facet([[-0.45,0,0],[0.18,0.18,0],[0.05,0.65,0]],0x754323,[0,2.8,1.03]);
facet([[0.24,0,0],[0.7,0.2,0],[-0.04,0.5,0]],0xb87943,[0,2.0,1.14]);
facet([[-0.72,0,0],[-0.18,0.15,0],[-0.45,0.58,0]],0xc0844b,[0,1.55,1.02]);
facet([[0,0,0],[0.38,0.15,0],[0.16,0.42,0]],0x6b391f,[0,3.35,1.15]);

const legGeometry = new THREE.CylinderGeometry(0.13,0.17,1.18,8);
mesh(legGeometry, footMaterial, [-0.48,0.42,0.02], [1,1,1], [0,0,0]);
mesh(legGeometry, footMaterial, [0.48,0.42,0.02], [1,1,1], [0,0,0]);

function toe(x,z,angle) {
  return mesh(new THREE.CylinderGeometry(0.07,0.1,0.72,7), footMaterial, [x,0.02,z], [1,1,1], [Math.PI/2,angle,0]);
}
toe(-0.48,0.28,0);
toe(-0.48,0.28,0.55);
toe(-0.48,0.28,-0.55);
toe(0.48,0.28,0);
toe(0.48,0.28,0.55);
toe(0.48,0.28,-0.55);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(6,64),
  new THREE.MeshStandardMaterial({ color:0xa88f6b, roughness:0.92 })
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -0.36;
floor.receiveShadow = true;
scene.add(floor);

const hemi = new THREE.HemisphereLight(0xffe4bd,0x4d3527,2.1);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe0b3,3.5);
key.position.set(-4,8,7);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -2;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fa7bd,1.1);
fill.position.set(5,4,3);
scene.add(fill);

const rim = new THREE.PointLight(0xd27d3f,1.2,10);
rim.position.set(-4,3,-4);
scene.add(rim);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
