<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Espresso Machine</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #d8d5ce;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8d5ce);
scene.fog = new THREE.Fog(0xd8d5ce, 18, 30);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.2, 6.4, 9.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
pmrem.dispose();

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.55, 0.25);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 7;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.49;

const hemi = new THREE.HemisphereLight(0xffffff, 0x77736c, 1.7);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4df, 4.2);
key.position.set(-5, 9, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 9;
key.shadow.camera.bottom = -3;
key.shadow.camera.near = 1;
key.shadow.camera.far = 24;
key.shadow.bias = -0.0002;
scene.add(key);

const fill = new THREE.DirectionalLight(0xc9ddff, 1.5);
fill.position.set(7, 5, -5);
scene.add(fill);

const rim = new THREE.PointLight(0xffd7a8, 18, 12, 2);
rim.position.set(-4, 4.5, -4);
scene.add(rim);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xbcb8af,
  roughness: 0.72,
  metalness: 0.02
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(32, 32), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const backdrop = new THREE.Mesh(
  new THREE.CircleGeometry(10, 96),
  new THREE.MeshBasicMaterial({ color: 0xe7e4de, transparent: true, opacity: 0.36 })
);
backdrop.position.set(-5, 7, -8);
scene.add(backdrop);

const appliance = new THREE.Group();
appliance.rotation.y = -0.08;
scene.add(appliance);

const steel = new THREE.MeshPhysicalMaterial({
  color: 0xb8bcc0,
  metalness: 0.92,
  roughness: 0.22,
  clearcoat: 0.28,
  clearcoatRoughness: 0.16
});
const brushedSteel = new THREE.MeshPhysicalMaterial({
  color: 0xaeb3b7,
  metalness: 0.86,
  roughness: 0.34,
  clearcoat: 0.16
});
const polished = new THREE.MeshPhysicalMaterial({
  color: 0xd5d8da,
  metalness: 1,
  roughness: 0.12,
  clearcoat: 0.42,
  clearcoatRoughness: 0.08
});
const darkMetal = new THREE.MeshStandardMaterial({
  color: 0x24272a,
  metalness: 0.7,
  roughness: 0.3
});
const black = new THREE.MeshPhysicalMaterial({
  color: 0x151617,
  metalness: 0.05,
  roughness: 0.4,
  clearcoat: 0.5,
  clearcoatRoughness: 0.22
});
const rubber = new THREE.MeshStandardMaterial({
  color: 0x101112,
  metalness: 0,
  roughness: 0.82
});
const trayDark = new THREE.MeshStandardMaterial({
  color: 0x292c2e,
  metalness: 0.76,
  roughness: 0.27
});
const whiteDial = new THREE.MeshPhysicalMaterial({
  color: 0xf3f0e7,
  metalness: 0.02,
  roughness: 0.27,
  clearcoat: 0.6
});
const glass = new THREE.MeshPhysicalMaterial({
  color: 0xc7e0e4,
  transparent: true,
  opacity: 0.24,
  roughness: 0.12,
  metalness: 0,
  transmission: 0.28,
  thickness: 0.18
});
const blueLED = new THREE.MeshStandardMaterial({
  color: 0x5ccfff,
  emissive: 0x20a9e8,
  emissiveIntensity: 4,
  roughness: 0.2
});
const redMark = new THREE.MeshStandardMaterial({
  color: 0xc94234,
  emissive: 0x6d0c08,
  emissiveIntensity: 0.45,
  roughness: 0.35
});

function roundedMesh(width, height, depth, radius, material, x, y, z, segments = 5) {
  const mesh = new THREE.Mesh(
    new RoundedBoxGeometry(width, height, depth, segments, radius),
    material
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  appliance.add(mesh);
  return mesh;
}

function box(width, height, depth, material, x, y, z) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  appliance.add(mesh);
  return mesh;
}

function cylinder(radiusTop, radiusBottom, height, segments, material, x, y, z) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
    material
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  appliance.add(mesh);
  return mesh;
}

function cylinderBetween(a, b, radius, material, radialSegments = 18) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, length, radialSegments),
    material
  );
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  appliance.add(mesh);
  return mesh;
}

function torus(major, tube, material, x, y, z, rx = 0, ry = 0, rz = 0) {
  const mesh = new THREE.Mesh(
    new THREE.TorusGeometry(major, tube, 16, 64),
    material
  );
  mesh.position.set(x, y, z);
  mesh.rotation.set(rx, ry, rz);
  mesh.castShadow = true;
  appliance.add(mesh);
  return mesh;
}

// Main appliance shell
roundedMesh(4.25, 4.55, 3.45, 0.22, steel, 0, 2.78, -0.12, 7);
roundedMesh(4.12, 0.28, 3.30, 0.12, polished, 0, 5.08, -0.12, 5);

// Side inset panels give the shell realistic folded-metal construction.
box(0.035, 3.72, 2.72, brushedSteel, -2.132, 2.77, -0.18);
box(0.035, 3.72, 2.72, brushedSteel, 2.132, 2.77, -0.18);

// Lower base and rubber feet
roundedMesh(4.4, 0.34, 3.55, 0.12, darkMetal, 0, 0.55, -0.08, 5);
for (const x of [-1.7, 1.7]) {
  for (const z of [-1.25, 1.18]) {
    cylinder(0.18, 0.21, 0.18, 24, rubber, x, 0.15, z);
  }
}

// Front brew recess
roundedMesh(3.45, 2.68, 0.18, 0.12, darkMetal, 0, 2.43, 1.645, 5);
box(3.12, 2.34, 0.055, black, 0, 2.36, 1.75);

// Upper control fascia
const fascia = roundedMesh(3.72, 0.92, 0.30, 0.11, brushedSteel, 0, 4.44, 1.67, 5);
fascia.rotation.x = -0.055;

// Analog pressure gauge
const gaugeBody = cylinder(0.48, 0.48, 0.20, 48, polished, 0, 4.46, 1.91);
gaugeBody.rotation.x = Math.PI / 2;
const gaugeFace = cylinder(0.395, 0.395, 0.025, 48, whiteDial, 0, 4.46, 2.025);
gaugeFace.rotation.x = Math.PI / 2;
torus(0.425, 0.045, polished, 0, 4.46, 2.047);

for (let i = 0; i < 9; i++) {
  const angle = THREE.MathUtils.degToRad(210 + i * 15);
  const mark = box(0.018, 0.095, 0.018, darkMetal,
    Math.cos(angle) * 0.29,
    4.46 + Math.sin(angle) * 0.29,
    2.065
  );
  mark.rotation.z = angle - Math.PI / 2;
}
const needle = box(0.035, 0.31, 0.018, redMark, 0.055, 4.56, 2.077);
needle.rotation.z = -0.52;
cylinder(0.055, 0.055, 0.024, 24, darkMetal, 0, 4.46, 2.088).rotation.x = Math.PI / 2;

// Push buttons and indicator lamps
for (const x of [-1.32, -0.88, 0.88, 1.32]) {
  const button = cylinder(0.16, 0.16, 0.13, 32, polished, x, 4.46, 1.91);
  button.rotation.x = Math.PI / 2;
  const inset = cylinder(0.095, 0.095, 0.012, 24, black, x, 4.46, 1.99);
  inset.rotation.x = Math.PI / 2;
}
for (const x of [-1.1, 1.1]) {
  const led = cylinder(0.035, 0.035, 0.018, 20, blueLED, x, 4.18, 1.91);
  led.rotation.x = Math.PI / 2;
}

// Cup warming tray and rails
roundedMesh(3.7, 0.07, 2.45, 0.025, darkMetal, 0, 5.24, -0.16, 3);
for (let x = -1.55; x <= 1.56; x += 0.31) {
  roundedMesh(0.085, 0.035, 2.12, 0.018, polished, x, 5.30, -0.12, 2);
}
cylinderBetween([-1.72, 5.38, -1.27], [1.72, 5.38, -1.27], 0.055, polished);
cylinderBetween([-1.72, 5.38, 0.99], [1.72, 5.38, 0.99], 0.055, polished);

// Group head
const groupCollar = cylinder(0.72, 0.72, 0.38, 48, polished, 0, 3.38, 1.91);
groupCollar.rotation.x = Math.PI / 2;
const groupRing = cylinder(0.61, 0.65, 0.25, 48, darkMetal, 0, 3.34, 2.17);
groupRing.rotation.x = Math.PI / 2;
torus(0.59, 0.075, polished, 0, 3.34, 2.31);

// Portafilter basket and locking lugs
const basket = cylinder(0.49, 0.57, 0.38, 48, brushedSteel, 0.12, 3.15, 2.28);
basket.rotation.x = Math.PI / 2;
roundedMesh(0.28, 0.12, 0.22, 0.035, polished, -0.62, 3.32, 2.27, 3);
roundedMesh(0.28, 0.12, 0.22, 0.035, polished, 0.68, 3.32, 2.27, 3);

// Portafilter handle
cylinderBetween([0.46, 3.20, 2.30], [0.82, 3.12, 2.34], 0.18, polished, 28);
cylinderBetween([0.77, 3.12, 2.34], [2.88, 2.72, 2.53], 0.19, black, 28);
const handleCap = cylinderBetween([2.79, 2.74, 2.52], [3.08, 2.68, 2.55], 0.235, black, 28);
handleCap.scale.set(1, 1, 1);
cylinderBetween([3.06, 2.685, 2.55], [3.13, 2.67, 2.56], 0.17, polished, 24);

// Twin coffee spouts
cylinderBetween([-0.12, 2.97, 2.31], [-0.15, 2.68, 2.36], 0.085, polished, 20);
cylinderBetween([0.12, 2.97, 2.31], [0.15, 2.68, 2.36], 0.085, polished, 20);
cylinderBetween([-0.15, 2.69, 2.36], [-0.36, 2.54, 2.42], 0.065, polished, 18);
cylinderBetween([0.15, 2.69, 2.36], [0.36, 2.54, 2.42], 0.065, polished, 18);

// Drip tray body
roundedMesh(4.05, 0.34, 1.73, 0.13, darkMetal, 0, 0.82, 1.20, 5);
roundedMesh(3.82, 0.08, 1.50, 0.05, polished, 0, 1.02, 1.22, 3);
roundedMesh(3.42, 0.025, 1.16, 0.025, trayDark, 0, 1.07, 1.25, 2);

// Drip tray grille
for (let x = -1.48; x <= 1.49; x += 0.235) {
  roundedMesh(0.065, 0.045, 1.04, 0.018, brushedSteel, x, 1.105, 1.25, 2);
}
for (const z of [0.77, 1.25, 1.73]) {
  roundedMesh(3.38, 0.055, 0.055, 0.018, polished, 0, 1.12, z, 2);
}
cylinder(0.18, 0.18, 0.025, 32, darkMetal, 0, 1.145, 1.25);

// Steam control knob on right side
const steamKnobBase = cylinder(0.34, 0.34, 0.18, 36, polished, 2.19, 3.80, 0.98);
steamKnobBase.rotation.z = Math.PI / 2;
const steamKnob = cylinder(0.29, 0.25, 0.44, 12, black, 2.46, 3.80, 0.98);
steamKnob.rotation.z = Math.PI / 2;
for (let i = 0; i < 12; i++) {
  const angle = i / 12 * Math.PI * 2;
  const ridge = roundedMesh(
    0.055, 0.11, 0.20, 0.018, rubber,
    2.69,
    3.80 + Math.sin(angle) * 0.245,
    0.98 + Math.cos(angle) * 0.245,
    2
  );
  ridge.rotation.x = angle;
}

// Articulated steam wand
const wandJoint = cylinder(0.24, 0.24, 0.23, 32, polished, 2.18, 3.15, 1.14);
wandJoint.rotation.z = Math.PI / 2;
const jointBall = new THREE.Mesh(new THREE.SphereGeometry(0.23, 28, 18), polished);
jointBall.position.set(2.34, 3.15, 1.14);
jointBall.castShadow = true;
appliance.add(jointBall);

cylinderBetween([2.42, 3.12, 1.20], [2.58, 2.35, 1.72], 0.075, polished, 20);
cylinderBetween([2.58, 2.35, 1.72], [2.55, 1.46, 2.02], 0.065, polished, 20);
cylinderBetween([2.55, 1.46, 2.02], [2.55, 1.23, 2.03], 0.11, darkMetal, 24);
cylinderBetween([2.55, 1.25, 2.03], [2.55, 1.10, 2.03], 0.075, polished, 20);
for (let i = 0; i < 3; i++) {
  const angle = i / 3 * Math.PI * 2;
  const hole = new THREE.Mesh(
    new THREE.SphereGeometry(0.018, 10, 8),
    black
  );
  hole.position.set(
    2.55 + Math.cos(angle) * 0.064,
    1.105,
    2.03 + Math.sin(angle) * 0.064
  );
  appliance.add(hole);
}

// Hot-water outlet on the left
const waterKnob = cylinder(0.22, 0.22, 0.28, 10, black, -2.25, 3.72, 0.91);
waterKnob.rotation.z = Math.PI / 2;
cylinderBetween([-1.78, 3.12, 1.48], [-1.88, 2.42, 1.76], 0.055, polished, 18);
cylinderBetween([-1.88, 2.42, 1.76], [-1.88, 2.08, 1.76], 0.075, polished, 18);

// Rear removable water tank and seams
roundedMesh(3.42, 3.82, 0.36, 0.12, glass, 0, 2.92, -1.91, 5);
box(0.035, 3.58, 0.025, darkMetal, -1.60, 2.91, -2.105);
box(0.035, 3.58, 0.025, darkMetal, 1.60, 2.91, -2.105);
box(3.22, 0.035, 0.025, darkMetal, 0, 1.07, -2.105);
box(3.22, 0.035, 0.025, darkMetal, 0, 4.77, -2.105);
roundedMesh(0.78, 0.10, 0.08, 0.035, darkMetal, 0, 4.60, -2.13, 3);

// Side panel fasteners
for (const x of [-2.154, 2.154]) {
  for (const y of [1.05, 4.58]) {
    const screw = cylinder(0.045, 0.045, 0.025, 16, darkMetal, x, y, -1.25);
    screw.rotation.z = Math.PI / 2;
  }
}

// Small front badge
roundedMesh(0.72, 0.18, 0.045, 0.035, darkMetal, 0, 3.91, 1.89, 3);
for (const x of [-0.23, -0.115, 0, 0.115, 0.23]) {
  cylinder(0.018, 0.018, 0.018, 12, polished, x, 3.91, 1.93).rotation.x = Math.PI / 2;
}

// Subtle floor shadow/contact plate
const contact = new THREE.Mesh(
  new THREE.CircleGeometry(3.8, 64),
  new THREE.MeshBasicMaterial({
    color: 0x5e5a54,
    transparent: true,
    opacity: 0.09,
    depthWrite: false
  })
);
contact.scale.set(1.15, 0.56, 1);
contact.rotation.x = -Math.PI / 2;
contact.position.y = 0.008;
scene.add(contact);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
