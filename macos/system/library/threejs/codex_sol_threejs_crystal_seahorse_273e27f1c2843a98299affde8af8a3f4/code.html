<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal Seahorse</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 38%, #183757 0%, #071827 48%, #02080e 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03101b);
scene.fog = new THREE.FogExp2(0x03101b, 0.035);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0.2, 0.35, 8.4);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const pmremGenerator = new THREE.PMREMGenerator(renderer);
const roomEnvironment = new RoomEnvironment(renderer);
scene.environment = pmremGenerator.fromScene(roomEnvironment, 0.04).texture;
roomEnvironment.dispose();
pmremGenerator.dispose();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.enablePan = false;
controls.minDistance = 5.8;
controls.maxDistance = 12;
controls.target.set(0, 0.15, 0);

const crystalMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xdffaff,
  metalness: 0,
  roughness: 0.045,
  transmission: 1,
  thickness: 0.72,
  ior: 2.15,
  transparent: true,
  opacity: 0.9,
  clearcoat: 1,
  clearcoatRoughness: 0.025,
  attenuationColor: new THREE.Color(0x9deeff),
  attenuationDistance: 3.8,
  specularIntensity: 1,
  specularColor: new THREE.Color(0xffffff),
  side: THREE.DoubleSide,
  flatShading: true
});

const edgeCrystalMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0,
  roughness: 0.018,
  transmission: 0.94,
  thickness: 0.28,
  ior: 2.3,
  transparent: true,
  opacity: 0.92,
  clearcoat: 1,
  clearcoatRoughness: 0,
  attenuationColor: new THREE.Color(0xc5f7ff),
  attenuationDistance: 1.8,
  side: THREE.DoubleSide,
  flatShading: true
});

const finMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xbfefff,
  roughness: 0.08,
  transmission: 0.88,
  thickness: 0.15,
  ior: 1.72,
  transparent: true,
  opacity: 0.58,
  clearcoat: 1,
  side: THREE.DoubleSide,
  flatShading: true,
  iridescence: 0.75,
  iridescenceIOR: 1.35,
  iridescenceThicknessRange: [120, 620],
  depthWrite: false
});

const rainbowMaterials = [
  new THREE.MeshPhysicalMaterial({
    color: 0xff4ea3, emissive: 0x8a123c, emissiveIntensity: 0.28,
    roughness: 0.08, transmission: 0.48, thickness: 0.2, transparent: true,
    opacity: 0.35, side: THREE.DoubleSide, flatShading: true, depthWrite: false
  }),
  new THREE.MeshPhysicalMaterial({
    color: 0x5cecff, emissive: 0x087c9c, emissiveIntensity: 0.3,
    roughness: 0.08, transmission: 0.5, thickness: 0.2, transparent: true,
    opacity: 0.34, side: THREE.DoubleSide, flatShading: true, depthWrite: false
  }),
  new THREE.MeshPhysicalMaterial({
    color: 0xffd65c, emissive: 0x986208, emissiveIntensity: 0.24,
    roughness: 0.08, transmission: 0.5, thickness: 0.2, transparent: true,
    opacity: 0.3, side: THREE.DoubleSide, flatShading: true, depthWrite: false
  })
];

function createTaperedTube(curve, segments, radialSegments, radiusFunction, material) {
  const frames = curve.computeFrenetFrames(segments, false);
  const positions = [];
  const normals = [];
  const uvs = [];
  const indices = [];
  const point = new THREE.Vector3();
  const radial = new THREE.Vector3();

  for (let i = 0; i <= segments; i++) {
    const u = i / segments;
    curve.getPointAt(u, point);
    const radius = Math.max(0.012, radiusFunction(u));

    for (let j = 0; j < radialSegments; j++) {
      const angle = (j / radialSegments) * Math.PI * 2;
      radial.copy(frames.normals[i]).multiplyScalar(Math.cos(angle));
      radial.addScaledVector(frames.binormals[i], Math.sin(angle));
      radial.normalize();

      positions.push(
        point.x + radial.x * radius,
        point.y + radial.y * radius,
        point.z + radial.z * radius
      );
      normals.push(radial.x, radial.y, radial.z);
      uvs.push(u, j / radialSegments);
    }
  }

  for (let i = 0; i < segments; i++) {
    for (let j = 0; j < radialSegments; j++) {
      const nextJ = (j + 1) % radialSegments;
      const a = i * radialSegments + j;
      const b = (i + 1) * radialSegments + j;
      const c = (i + 1) * radialSegments + nextJ;
      const d = i * radialSegments + nextJ;
      indices.push(a, b, d, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeBoundingSphere();

  return new THREE.Mesh(geometry, material);
}

function makeCurve(points, tension = 0.5) {
  return new THREE.CatmullRomCurve3(
    points.map(point => new THREE.Vector3(point[0], point[1], point[2])),
    false,
    'catmullrom',
    tension
  );
}

function makeFacetShape(points, material, z = 0) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
  shape.closePath();
  const geometry = new THREE.ShapeGeometry(shape);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.z = z;
  return mesh;
}

const seahorse = new THREE.Group();
seahorse.rotation.y = -0.08;
seahorse.rotation.z = -0.035;
scene.add(seahorse);

const bodyGeometry = new THREE.IcosahedronGeometry(1, 2);
bodyGeometry.scale(0.72, 1.02, 0.46);
const body = new THREE.Mesh(bodyGeometry, crystalMaterial);
body.position.set(0.12, 0.15, 0);
body.castShadow = true;
body.receiveShadow = true;
seahorse.add(body);

const bellyGeometry = new THREE.IcosahedronGeometry(0.68, 1);
bellyGeometry.scale(0.68, 0.92, 0.42);
const belly = new THREE.Mesh(bellyGeometry, edgeCrystalMaterial);
belly.position.set(-0.05, 0.05, 0.015);
belly.scale.set(0.91, 0.93, 0.91);
belly.castShadow = true;
seahorse.add(belly);

const neckCurve = makeCurve([
  [0.18, 0.82, 0],
  [0.12, 1.15, 0],
  [-0.04, 1.45, 0.01],
  [-0.22, 1.68, 0.01],
  [-0.32, 1.83, 0]
]);
const neck = createTaperedTube(neckCurve, 22, 7, u => 0.35 - 0.09 * u, crystalMaterial);
neck.castShadow = true;
seahorse.add(neck);

const headGeometry = new THREE.IcosahedronGeometry(0.52, 1);
headGeometry.scale(0.9, 0.72, 0.66);
const head = new THREE.Mesh(headGeometry, crystalMaterial);
head.position.set(-0.42, 1.86, 0);
head.rotation.z = 0.2;
head.castShadow = true;
seahorse.add(head);

const browGeometry = new THREE.OctahedronGeometry(0.29, 1);
browGeometry.scale(1.05, 0.65, 0.8);
const brow = new THREE.Mesh(browGeometry, edgeCrystalMaterial);
brow.position.set(-0.54, 2.03, 0);
brow.rotation.z = -0.08;
seahorse.add(brow);

const snoutCurve = makeCurve([
  [-0.63, 1.82, 0],
  [-0.86, 1.76, 0],
  [-1.12, 1.68, 0],
  [-1.37, 1.68, 0]
], 0.35);
const snout = createTaperedTube(snoutCurve, 16, 6, u => 0.19 - 0.095 * u, crystalMaterial);
snout.castShadow = true;
seahorse.add(snout);

const muzzle = new THREE.Mesh(new THREE.OctahedronGeometry(0.13, 1), edgeCrystalMaterial);
muzzle.position.set(-1.39, 1.68, 0);
muzzle.scale.set(0.8, 0.62, 0.72);
muzzle.rotation.z = Math.PI * 0.5;
seahorse.add(muzzle);

const tailCurve = makeCurve([
  [0.12, -0.65, 0],
  [0.18, -0.92, 0],
  [0.10, -1.23, 0],
  [-0.08, -1.53, 0],
  [-0.34, -1.78, 0],
  [-0.68, -1.92, 0],
  [-1.01, -1.85, 0],
  [-1.21, -1.60, 0],
  [-1.20, -1.29, 0],
  [-1.02, -1.06, 0],
  [-0.73, -1.00, 0],
  [-0.51, -1.15, 0],
  [-0.47, -1.38, 0],
  [-0.61, -1.54, 0],
  [-0.81, -1.55, 0],
  [-0.92, -1.43, 0]
], 0.48);
const tail = createTaperedTube(
  tailCurve,
  72,
  7,
  u => 0.31 * Math.pow(1 - u, 0.72) + 0.025,
  crystalMaterial
);
tail.castShadow = true;
seahorse.add(tail);

const tailHighlight = createTaperedTube(
  makeCurve([
    [0.05, -0.69, 0.2],
    [-0.04, -1.15, 0.18],
    [-0.35, -1.66, 0.13],
    [-0.82, -1.78, 0.07],
    [-1.10, -1.47, 0.03],
    [-0.94, -1.16, 0.02],
    [-0.64, -1.18, 0.015]
  ]),
  34,
  5,
  u => 0.035 * (1 - 0.6 * u),
  edgeCrystalMaterial
);
seahorse.add(tailHighlight);

const crownData = [
  [-0.70, 2.22, -0.10, 0.12, 0.44, -0.18],
  [-0.47, 2.28, 0.00, 0.14, 0.58, -0.05],
  [-0.22, 2.22, 0.02, 0.13, 0.49, 0.15],
  [-0.02, 2.08, -0.02, 0.11, 0.37, 0.28]
];

for (const data of crownData) {
  const geometry = new THREE.ConeGeometry(data[3], data[4], 4, 1, false);
  const spike = new THREE.Mesh(geometry, edgeCrystalMaterial);
  spike.position.set(data[0], data[1] + data[4] * 0.42, data[2]);
  spike.rotation.z = data[5];
  spike.castShadow = true;
  seahorse.add(spike);
}

const ridgePositions = [
  [0.52, 1.28, -0.01, 0.28, -0.92],
  [0.69, 0.98, 0.00, 0.30, -1.15],
  [0.78, 0.64, 0.01, 0.31, -1.38],
  [0.81, 0.27, 0.00, 0.30, -1.55],
  [0.76, -0.10, -0.01, 0.27, -1.74],
  [0.62, -0.43, 0.00, 0.23, -1.96]
];

for (const data of ridgePositions) {
  const geometry = new THREE.ConeGeometry(data[3] * 0.42, data[3], 4);
  const ridge = new THREE.Mesh(geometry, edgeCrystalMaterial);
  ridge.position.set(data[0], data[1], data[2]);
  ridge.rotation.z = data[4];
  ridge.castShadow = true;
  seahorse.add(ridge);
}

const dorsalFin = makeFacetShape([
  [0.54, 1.08],
  [1.15, 0.92],
  [1.36, 0.49],
  [1.28, 0.04],
  [0.76, -0.26],
  [0.66, 0.20]
], finMaterial, -0.035);
seahorse.add(dorsalFin);

const dorsalVeinCurves = [
  [[0.68, 0.94, -0.055], [1.03, 0.79, -0.055], [1.22, 0.55, -0.055]],
  [[0.73, 0.62, -0.06], [1.08, 0.48, -0.06], [1.25, 0.24, -0.06]],
  [[0.75, 0.30, -0.055], [1.04, 0.17, -0.055], [1.17, -0.02, -0.055]]
];

for (const points of dorsalVeinCurves) {
  const vein = createTaperedTube(makeCurve(points), 8, 4, u => 0.018 - 0.006 * u, edgeCrystalMaterial);
  seahorse.add(vein);
}

const pectoralFin = makeFacetShape([
  [-0.10, 0.95],
  [-0.76, 1.12],
  [-0.91, 0.83],
  [-0.54, 0.46],
  [-0.06, 0.64]
], finMaterial, 0.42);
pectoralFin.rotation.y = -0.24;
seahorse.add(pectoralFin);

const pectoralVein = createTaperedTube(
  makeCurve([
    [-0.04, 0.83, 0.45],
    [-0.40, 0.84, 0.48],
    [-0.76, 0.88, 0.43]
  ]),
  12,
  4,
  u => 0.024 - 0.008 * u,
  edgeCrystalMaterial
);
seahorse.add(pectoralVein);

const eyeOuter = new THREE.Mesh(new THREE.IcosahedronGeometry(0.125, 1), edgeCrystalMaterial);
eyeOuter.position.set(-0.66, 1.98, 0.32);
eyeOuter.scale.set(1, 1, 0.7);
seahorse.add(eyeOuter);

const irisMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x42d8ff,
  emissive: 0x083d67,
  emissiveIntensity: 0.7,
  roughness: 0.06,
  metalness: 0.05,
  transmission: 0.22,
  clearcoat: 1
});
const iris = new THREE.Mesh(new THREE.IcosahedronGeometry(0.072, 2), irisMaterial);
iris.position.set(-0.68, 1.99, 0.405);
iris.scale.set(1, 1, 0.4);
seahorse.add(iris);

const pupilMaterial = new THREE.MeshStandardMaterial({
  color: 0x01060a,
  roughness: 0.08,
  metalness: 0.3
});
const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.027, 12, 8), pupilMaterial);
pupil.position.set(-0.688, 1.992, 0.442);
pupil.scale.z = 0.45;
seahorse.add(pupil);

const mouthMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xb9efff,
  roughness: 0.1,
  transmission: 0.4,
  transparent: true,
  opacity: 0.75
});
const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.012, 6, 18, Math.PI * 1.12), mouthMaterial);
mouth.position.set(-1.40, 1.65, 0.068);
mouth.rotation.set(0.08, 0.18, 0.28);
seahorse.add(mouth);

const shardGeometry = new THREE.TetrahedronGeometry(0.27, 0);
const shardData = [
  [-0.12, 0.50, 0.06, 0.75, 1.55, 0],
  [0.28, 0.06, -0.08, -0.45, 0.35, 1],
  [-0.08, -0.28, 0.07, 0.38, -0.62, 2],
  [0.05, 1.17, 0.02, -0.25, 0.45, 1],
  [-0.50, 1.82, -0.04, 0.42, -0.15, 2]
];

for (const data of shardData) {
  const shard = new THREE.Mesh(shardGeometry, rainbowMaterials[data[5]]);
  shard.position.set(data[0], data[1], data[2]);
  shard.rotation.set(data[3], data[4], data[3] * 0.7);
  shard.scale.set(0.42, 1.35, 0.32);
  shard.renderOrder = 1;
  seahorse.add(shard);
}

const flankFacetMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xeaffff,
  roughness: 0.01,
  transmission: 0.72,
  thickness: 0.08,
  ior: 2.25,
  transparent: true,
  opacity: 0.45,
  clearcoat: 1,
  side: THREE.DoubleSide,
  depthWrite: false
});

const flankFacets = [
  [[-0.30, 0.67], [0.18, 1.01], [0.47, 0.61], [0.10, 0.28]],
  [[0.10, 0.27], [0.55, 0.52], [0.66, 0.02], [0.22, -0.18]],
  [[-0.42, 0.14], [0.10, 0.27], [0.22, -0.18], [-0.16, -0.62]],
  [[-0.36, 1.65], [-0.16, 1.99], [-0.55, 2.10], [-0.72, 1.82]]
];

for (let i = 0; i < flankFacets.length; i++) {
  const facet = makeFacetShape(flankFacets[i], flankFacetMaterial, 0.43 + i * 0.002);
  facet.scale.set(0.96, 0.96, 0.96);
  seahorse.add(facet);
}

const baseShadowMaterial = new THREE.ShadowMaterial({
  color: 0x000a12,
  opacity: 0.42,
  transparent: true
});
const ground = new THREE.Mesh(new THREE.CircleGeometry(4.5, 64), baseShadowMaterial);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -2.13;
ground.receiveShadow = true;
scene.add(ground);

const glowMaterial = new THREE.MeshBasicMaterial({
  color: 0x28aee8,
  transparent: true,
  opacity: 0.075,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});
const glow = new THREE.Mesh(new THREE.CircleGeometry(1.55, 64), glowMaterial);
glow.rotation.x = -Math.PI / 2;
glow.position.set(-0.2, -2.115, 0);
scene.add(glow);

const hemisphereLight = new THREE.HemisphereLight(0xbcecff, 0x061322, 1.15);
scene.add(hemisphereLight);

const keyLight = new THREE.SpotLight(0xffffff, 95, 18, Math.PI / 5.5, 0.45, 1.3);
keyLight.position.set(-4.5, 6.5, 6);
keyLight.target.position.set(0, 0.2, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.bias = -0.00025;
keyLight.shadow.radius = 4;
scene.add(keyLight, keyLight.target);

const rimLight = new THREE.SpotLight(0x78ddff, 75, 16, Math.PI / 4, 0.55, 1.5);
rimLight.position.set(4.5, 3.5, -4.5);
rimLight.target.position.set(0.2, 0.2, 0);
scene.add(rimLight, rimLight.target);

const roseLight = new THREE.PointLight(0xff3f91, 19, 8, 2);
roseLight.position.set(-3.2, 0.1, 2.2);
scene.add(roseLight);

const cyanLight = new THREE.PointLight(0x37dfff, 22, 8, 2);
cyanLight.position.set(3.0, -0.7, 2.3);
scene.add(cyanLight);

const goldLight = new THREE.PointLight(0xffd45e, 15, 7, 2);
goldLight.position.set(0.4, 4.0, -2.5);
scene.add(goldLight);

const violetLight = new THREE.PointLight(0x865dff, 13, 7, 2);
violetLight.position.set(-1.8, -2.1, -2.3);
scene.add(violetLight);

seahorse.traverse(object => {
  if (object.isMesh) {
    object.castShadow = true;
  }
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  rainbowMaterials[0].emissiveIntensity = 0.25 + Math.sin(elapsed * 1.3) * 0.08;
  rainbowMaterials[1].emissiveIntensity = 0.28 + Math.sin(elapsed * 1.1 + 2) * 0.08;
  rainbowMaterials[2].emissiveIntensity = 0.22 + Math.sin(elapsed * 1.5 + 4) * 0.07;

  roseLight.position.z = 2.2 + Math.sin(elapsed * 0.55) * 0.6;
  cyanLight.position.x = 3.0 + Math.cos(elapsed * 0.42) * 0.45;
  seahorse.position.y = Math.sin(elapsed * 0.85) * 0.025;

  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
