<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Deco Rotary Telephone</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111316; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111316);
scene.fog = new THREE.Fog(0x111316, 14, 28);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.3, 6.0, 8.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 6;
controls.maxDistance = 15;
controls.target.set(0, 1.8, 0);

const black = new THREE.MeshPhysicalMaterial({
  color: 0x090b0d, metalness: 0.08, roughness: 0.19, clearcoat: 0.8, clearcoatRoughness: 0.12
});
const blackSoft = new THREE.MeshPhysicalMaterial({
  color: 0x111416, metalness: 0.05, roughness: 0.3, clearcoat: 0.55
});
const chrome = new THREE.MeshPhysicalMaterial({
  color: 0xcfd4d7, metalness: 0.95, roughness: 0.14, clearcoat: 0.5
});
const darkChrome = new THREE.MeshPhysicalMaterial({
  color: 0x5b6266, metalness: 0.9, roughness: 0.23
});
const red = new THREE.MeshPhysicalMaterial({
  color: 0x5e1118, metalness: 0.25, roughness: 0.22, clearcoat: 0.65
});
const cordMat = new THREE.MeshStandardMaterial({
  color: 0x26282a, roughness: 0.82, metalness: 0.04
});
const floorMat = new THREE.MeshStandardMaterial({
  color: 0x24272a, roughness: 0.75, metalness: 0.12
});

function addMesh(geometry, material, position, rotation = [0, 0, 0], parent = scene) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(...position);
  mesh.rotation.set(...rotation);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function box(size, material, position, rotation = [0, 0, 0], parent = scene) {
  return addMesh(new THREE.BoxGeometry(...size), material, position, rotation, parent);
}

function cylinder(radius, height, material, position, rotation = [0, 0, 0], radial = 48, parent = scene) {
  return addMesh(new THREE.CylinderGeometry(radius, radius, height, radial), material, position, rotation, parent);
}

function torus(radius, tube, material, position, rotation = [0, 0, 0], parent = scene) {
  return addMesh(new THREE.TorusGeometry(radius, tube, 20, 72), material, position, rotation, parent);
}

const phone = new THREE.Group();
phone.position.y = -0.15;
scene.add(phone);

// Art-deco stepped base
box([4.65, 0.34, 3.45], chrome, [0, 0.16, 0], [0, 0, 0], phone);
box([4.38, 0.58, 3.18], black, [0, 0.55, 0], [0, 0, 0], phone);
box([4.08, 0.32, 2.92], chrome, [0, 0.88, 0], [0, 0, 0], phone);
box([3.86, 0.34, 2.72], blackSoft, [0, 1.12, 0], [0, 0, 0], phone);
box([3.52, 0.22, 2.45], black, [0, 1.36, 0], [0, 0, 0], phone);

// Decorative side rails and front escutcheon
for (const x of [-1.78, 1.78]) {
  box([0.12, 0.72, 2.72], chrome, [x, 0.72, 0], [0, 0, 0], phone);
}
box([2.25, 0.18, 0.12], chrome, [0, 1.34, -1.26], [0, 0, 0], phone);
box([1.35, 0.12, 0.12], red, [0, 1.48, -1.29], [0, 0, 0], phone);

// Rotary dial assembly
cylinder(1.47, 0.13, chrome, [0, 1.62, -0.03], [0, 0, 0], 64, phone);
cylinder(1.34, 0.16, black, [0, 1.70, -0.03], [0, 0, 0], 64, phone);
torus(1.21, 0.075, chrome, [0, 1.80, -0.03], [0, 0, 0], phone);
torus(0.82, 0.07, darkChrome, [0, 1.82, -0.03], [0, 0, 0], phone);
cylinder(0.49, 0.17, chrome, [0, 1.84, -0.03], [0, 0, 0], 64, phone);
cylinder(0.36, 0.18, blackSoft, [0, 1.94, -0.03], [0, 0, 0], 64, phone);
torus(0.32, 0.035, chrome, [0, 2.04, -0.03], [0, 0, 0], phone);

// Finger holes and nickel rings
for (let i = 0; i < 10; i++) {
  const a = (i / 10) * Math.PI * 2 + Math.PI / 2;
  const r = 0.99;
  const x = Math.cos(a) * r;
  const z = Math.sin(a) * r - 0.03;
  cylinder(0.145, 0.13, blackSoft, [x, 1.84, z], [0, 0, 0], 32, phone);
  torus(0.157, 0.025, chrome, [x, 1.91, z], [0, 0, 0], phone);
}

// Dial finger stop
box([0.14, 0.28, 0.35], chrome, [1.28, 1.97, -0.77], [0, -0.18, 0], phone);
box([0.18, 0.12, 0.18], darkChrome, [1.29, 2.10, -0.78], [0, -0.18, 0], phone);

// Procedural polished nickel numerals
function numeralTexture(value) {
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 128, 128);
  ctx.font = 'bold 74px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#e9edef';
  ctx.shadowColor = '#62696d';
  ctx.shadowBlur = 3;
  ctx.fillText(String(value), 64, 66);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}
for (let i = 0; i < 10; i++) {
  const a = (i / 10) * Math.PI * 2 + Math.PI / 2;
  const r = 1.24;
  const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(0.31, 0.31),
    new THREE.MeshStandardMaterial({
      map: numeralTexture(i === 0 ? 0 : i),
      transparent: true,
      metalness: 0.75,
      roughness: 0.2,
      depthWrite: false
    })
  );
  plane.rotation.x = -Math.PI / 2;
  plane.position.set(Math.cos(a) * r, 1.925, Math.sin(a) * r - 0.03);
  plane.castShadow = true;
  phone.add(plane);
}

// Fan-shaped chrome cradle
function angledBar(x, z, angle) {
  const bar = cylinder(0.105, 1.52, chrome, [x, 2.32, z], [0, 0, angle], 24, phone);
  return bar;
}
angledBar(-1.48, 0.02, -0.24);
angledBar(1.48, 0.02, 0.24);
angledBar(-1.08, 0.02, -0.12);
angledBar(1.08, 0.02, 0.12);
box([3.15, 0.14, 0.28], chrome, [0, 2.99, 0.02], [0, 0, 0], phone);
box([2.45, 0.13, 0.42], black, [0, 3.08, 0.02], [0, 0, 0], phone);

// Sculpted handset
const handset = new THREE.Group();
handset.position.set(0, 3.28, 0.02);
phone.add(handset);

cylinder(0.28, 2.25, black, [0, 0, 0], [0, 0, Math.PI / 2], 48, handset);
torus(0.29, 0.045, chrome, [-0.77, 0, 0], [0, Math.PI / 2, 0], handset);
torus(0.29, 0.045, chrome, [0.77, 0, 0], [0, Math.PI / 2, 0], handset);

for (const s of [-1, 1]) {
  const end = new THREE.Group();
  end.position.x = s * 1.16;
  handset.add(end);
  cylinder(0.43, 0.74, black, [0, 0, 0], [0, 0, Math.PI / 2], 48, end);
  cylinder(0.52, 0.22, black, [s * 0.36, 0, 0], [0, 0, Math.PI / 2], 48, end);
  cylinder(0.37, 0.18, chrome, [s * 0.49, 0, 0], [0, 0, Math.PI / 2], 48, end);
  torus(0.39, 0.05, chrome, [s * 0.57, 0, 0], [0, Math.PI / 2, 0], end);
}

// Cord, braided-looking through repeated dark and metallic collars
const cordPoints = [
  new THREE.Vector3(0.72, 3.03, 0.04),
  new THREE.Vector3(1.35, 2.65, 0.18),
  new THREE.Vector3(1.72, 1.75, 0.32),
  new THREE.Vector3(1.84, 0.55, 0.52),
  new THREE.Vector3(1.30, -0.12, 0.68),
  new THREE.Vector3(0.25, -0.28, 0.74),
  new THREE.Vector3(-0.75, 0.05, 0.70),
  new THREE.Vector3(-1.05, 0.62, 0.58)
];
const cordCurve = new THREE.CatmullRomCurve3(cordPoints);
const cord = new THREE.Mesh(new THREE.TubeGeometry(cordCurve, 96, 0.075, 12, false), cordMat);
cord.castShadow = true;
cord.receiveShadow = true;
phone.add(cord);

for (let i = 1; i < 11; i++) {
  const p = cordCurve.getPoint(i / 12);
  const collar = torus(0.087, 0.014, i % 2 ? darkChrome : blackSoft, p, [0, Math.PI / 2, 0], phone);
  collar.scale.set(1, 1, 0.72);
}

// Ground and lighting
const ground = new THREE.Mesh(new THREE.CylinderGeometry(9, 9, 0.18, 96), floorMat);
ground.position.y = -0.56;
ground.receiveShadow = true;
scene.add(ground);

const hemi = new THREE.HemisphereLight(0x9faabd, 0x17191c, 2.1);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff0d3, 4.2);
key.position.set(-5, 9, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -7;
scene.add(key);

const rim = new THREE.PointLight(0x6b8fc2, 16, 14, 2);
rim.position.set(5, 4.5, -4);
scene.add(rim);

const warm = new THREE.PointLight(0xff9f57, 10, 10, 2);
warm.position.set(-4, 2.8, 4);
scene.add(warm);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
