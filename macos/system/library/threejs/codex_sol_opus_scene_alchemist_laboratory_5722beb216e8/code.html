<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07070a);
scene.fog = new THREE.FogExp2(0x09080b, 0.025);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 100);
camera.position.set(12.5, 8.2, 14.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;
controls.minDistance = 8;
controls.maxDistance = 28;
controls.maxPolarAngle = Math.PI * 0.49;

let seed = 937241;
function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a, b) { return a + (b - a) * rand(); }
function pick(a) { return a[Math.floor(rand() * a.length)]; }

function canvasTexture(size, paint, repeatX = 1, repeatY = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  paint(x, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

const stoneTex = canvasTexture(512, (x, s) => {
  x.fillStyle = '#343137';
  x.fillRect(0, 0, s, s);
  for (let j = 0; j < 8; j++) {
    for (let i = -1; i < 8; i++) {
      const off = j % 2 ? 34 : 0;
      const px = i * 72 + off;
      const py = j * 64;
      x.fillStyle = `hsl(${range(265,285)} 7% ${range(17,25)}%)`;
      x.fillRect(px + 2, py + 2, 68, 60);
      x.strokeStyle = 'rgba(0,0,0,.55)';
      x.lineWidth = 3;
      x.strokeRect(px + 1, py + 1, 70, 62);
      for (let q = 0; q < 8; q++) {
        x.fillStyle = `rgba(255,255,255,${range(.01,.045)})`;
        x.fillRect(px + range(4,64), py + range(4,56), range(1,4), range(1,3));
      }
    }
  }
}, 4, 4);

const floorTex = canvasTexture(512, (x, s) => {
  x.fillStyle = '#29262a';
  x.fillRect(0, 0, s, s);
  for (let j = 0; j < 8; j++) {
    for (let i = 0; i < 8; i++) {
      x.fillStyle = `hsl(275 6% ${range(13,21)}%)`;
      x.fillRect(i * 64 + 2, j * 64 + 2, 60, 60);
      x.strokeStyle = 'rgba(5,3,5,.8)';
      x.lineWidth = 4;
      x.strokeRect(i * 64, j * 64, 64, 64);
    }
  }
  for (let i = 0; i < 160; i++) {
    x.fillStyle = `rgba(180,150,105,${range(.01,.055)})`;
    x.fillRect(range(0,s), range(0,s), range(1,5), range(1,3));
  }
}, 5, 5);

const woodTex = canvasTexture(256, (x, s) => {
  x.fillStyle = '#4b2b19';
  x.fillRect(0, 0, s, s);
  for (let i = 0; i < 90; i++) {
    x.strokeStyle = `rgba(${range(65,120)},${range(30,57)},${range(12,28)},${range(.15,.5)})`;
    x.lineWidth = range(.5, 3);
    x.beginPath();
    x.moveTo(0, range(0,s));
    x.bezierCurveTo(s*.3, range(0,s), s*.7, range(0,s), s, range(0,s));
    x.stroke();
  }
}, 3, 1);

const paperTex = canvasTexture(256, (x, s) => {
  x.fillStyle = '#c9aa70';
  x.fillRect(0, 0, s, s);
  const g = x.createRadialGradient(s/2,s/2,20,s/2,s/2,s*.7);
  g.addColorStop(0,'rgba(255,242,184,.22)');
  g.addColorStop(1,'rgba(65,26,5,.30)');
  x.fillStyle = g;
  x.fillRect(0,0,s,s);
  x.strokeStyle = 'rgba(53,25,14,.62)';
  x.lineWidth = 2;
  for (let y = 35; y < 220; y += 15) {
    x.beginPath();
    x.moveTo(24,y);
    x.lineTo(range(155,228),y + range(-2,2));
    x.stroke();
  }
  x.strokeStyle = '#73332a';
  x.lineWidth = 4;
  x.beginPath();
  x.arc(80,110,29,0,Math.PI*2);
  x.moveTo(55,125);
  x.lineTo(105,95);
  x.moveTo(55,95);
  x.lineTo(105,125);
  x.stroke();
});

const matStone = new THREE.MeshStandardMaterial({ map: stoneTex, roughness: .92, color: 0xa19aa5 });
const matFloor = new THREE.MeshStandardMaterial({ map: floorTex, roughness: .95, color: 0x99909b });
const matWood = new THREE.MeshStandardMaterial({ map: woodTex, roughness: .72, color: 0x8a5a36 });
const matDarkWood = new THREE.MeshStandardMaterial({ map: woodTex, roughness: .8, color: 0x4b2718 });
const matIron = new THREE.MeshStandardMaterial({ color: 0x1b1c1d, roughness: .55, metalness: .75 });
const matBrass = new THREE.MeshStandardMaterial({ color: 0x9d6e26, roughness: .28, metalness: .88 });
const matCopper = new THREE.MeshStandardMaterial({ color: 0x8e482b, roughness: .35, metalness: .82 });
const matWax = new THREE.MeshStandardMaterial({ color: 0xd9bd82, roughness: .9 });
const matPage = new THREE.MeshStandardMaterial({ map: paperTex, roughness: .88, color: 0xe0c78f });

function mesh(geometry, material, parent = scene, shadows = true) {
  const m = new THREE.Mesh(geometry, material);
  m.castShadow = shadows;
  m.receiveShadow = shadows;
  parent.add(m);
  return m;
}

const room = new THREE.Group();
scene.add(room);

const floor = mesh(new THREE.PlaneGeometry(24, 20), matFloor, room);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;

const back = mesh(new THREE.PlaneGeometry(24, 11), matStone, room);
back.position.set(0, 5.5, -7);
const leftWall = mesh(new THREE.PlaneGeometry(14, 11), matStone, room);
leftWall.rotation.y = Math.PI / 2;
leftWall.position.set(-10, 5.5, 0);

for (let i = 0; i < 5; i++) {
  const beam = mesh(new THREE.BoxGeometry(.3, 10.5, .35), matDarkWood, room);
  beam.position.set(-8 + i * 4, 5.3, -6.82);
}
const topBeam = mesh(new THREE.BoxGeometry(20, .4, .45), matDarkWood, room);
topBeam.position.set(0, 9.2, -6.75);

const ambient = new THREE.HemisphereLight(0x4d4865, 0x170d08, .34);
scene.add(ambient);

const moon = new THREE.DirectionalLight(0x889ac6, .7);
moon.position.set(7, 11, 8);
moon.castShadow = true;
moon.shadow.mapSize.set(1024,1024);
moon.shadow.camera.left = -12;
moon.shadow.camera.right = 12;
moon.shadow.camera.top = 12;
moon.shadow.camera.bottom = -12;
moon.shadow.bias = -0.0005;
scene.add(moon);

const animatedLights = [];
function pointLight(color, intensity, distance, pos, parent = scene) {
  const l = new THREE.PointLight(color, intensity, distance, 2);
  l.position.copy(pos);
  l.castShadow = true;
  l.shadow.mapSize.set(512,512);
  l.shadow.bias = -0.002;
  parent.add(l);
  return l;
}

function makeShelf(x, y, z, width = 5.3) {
  const g = new THREE.Group();
  g.position.set(x,y,z);
  scene.add(g);
  for (let i = 0; i < 3; i++) {
    const board = mesh(new THREE.BoxGeometry(width,.22,1.05), matDarkWood, g);
    board.position.y = i * 1.75;
  }
  for (const sx of [-width/2+.16,width/2-.16]) {
    const post = mesh(new THREE.BoxGeometry(.28,4.05,.75), matDarkWood,g);
    post.position.set(sx,1.6,0);
  }
  for (let i = 0; i < 4; i++) {
    const bracket = mesh(new THREE.BoxGeometry(.14,.75,.14),matIron,g);
    bracket.position.set(-width/2 + .4 + i*(width-.8)/3,-.35,.2);
    bracket.rotation.z = (i%2 ? -1 : 1)*.5;
  }
  return g;
}

const jarGlass = new THREE.MeshPhysicalMaterial({
  color:0xbac9ba, roughness:.12, metalness:0, transmission:.45,
  transparent:true, opacity:.55, thickness:.25, ior:1.45
});
const corkMat = new THREE.MeshStandardMaterial({color:0x735034,roughness:1});
const specimenColors = [0x7a9e38,0x6e405f,0xa27a30,0x455f82,0x81452f];

function makeJar(parent, x, y, z, scale = 1, color = pick(specimenColors)) {
  const g = new THREE.Group();
  g.position.set(x,y,z);
  g.scale.setScalar(scale);
  parent.add(g);
  const body = mesh(new THREE.CylinderGeometry(.28,.34,.72,16),jarGlass,g);
  body.position.y=.36;
  const shoulder = mesh(new THREE.SphereGeometry(.3,16,10,0,Math.PI*2,0,Math.PI*.52),jarGlass,g);
  shoulder.scale.y=.5;
  shoulder.position.y=.75;
  const neck = mesh(new THREE.CylinderGeometry(.18,.18,.2,16),jarGlass,g);
  neck.position.y=.89;
  const cork = mesh(new THREE.CylinderGeometry(.17,.15,.16,10),corkMat,g);
  cork.position.y=1.04;
  const contents = mesh(new THREE.CylinderGeometry(.25,.3,.38,14),
    new THREE.MeshStandardMaterial({color,roughness:.42,emissive:color,emissiveIntensity:.08}),g);
  contents.position.y=.23;
  if (rand()>.45) {
    const thing = mesh(new THREE.TorusKnotGeometry(.09,.025,28,6),
      new THREE.MeshStandardMaterial({color:0x3a2b20,roughness:.9}),g);
    thing.position.set(0,.38,.05);
    thing.rotation.set(range(0,3),range(0,3),0);
  }
  return g;
}

const shelfA = makeShelf(5.7,2.8,-6.28,6.2);
const shelfB = makeShelf(-6.1,3.2,-6.28,5.7);
for (const sh of [shelfA,shelfB]) {
  for (let row=0; row<3; row++) {
    const count = row===1 ? 7 : 6;
    for (let i=0;i<count;i++) {
      const width = sh===shelfA ? 6.2 : 5.7;
      makeJar(sh,-width/2+.55+i*(width-1.1)/(count-1)+range(-.12,.12),
        row*1.75+.14,range(-.08,.1),range(.6,.92));
    }
  }
}

function makeHerbBundle(x,y,z, tint) {
  const g = new THREE.Group();
  g.position.set(x,y,z);
  scene.add(g);
  const twine = mesh(new THREE.TorusGeometry(.18,.025,6,14),corkMat,g);
  twine.rotation.x=Math.PI/2;
  for(let i=0;i<11;i++){
    const stem=mesh(new THREE.CylinderGeometry(.012,.018,range(.8,1.5),5),
      new THREE.MeshStandardMaterial({color:0x655531,roughness:1}),g);
    stem.position.set(range(-.15,.15),-.55+range(-.16,.1),range(-.1,.1));
    stem.rotation.z=range(-.18,.18);
    for(let j=0;j<2;j++){
      const leaf=mesh(new THREE.SphereGeometry(.1,7,5),
        new THREE.MeshStandardMaterial({color:tint,roughness:1}),g);
      leaf.scale.set(.45,1,.18);
      leaf.position.set(stem.position.x+range(-.16,.16),range(-1.1,-.35),stem.position.z);
      leaf.rotation.z=range(-1,1);
    }
  }
}
makeHerbBundle(-2.8,8.3,-6.35,0x59603a);
makeHerbBundle(-1.8,8.45,-6.3,0x79513a);
makeHerbBundle(2.1,8.2,-6.3,0x4f6340);
makeHerbBundle(3.1,8.35,-6.3,0x665235);

const table = new THREE.Group();
table.position.set(-3.8,0,-1.6);
scene.add(table);
const tableTop = mesh(new THREE.BoxGeometry(6.8,.38,2.6),matWood,table);
tableTop.position.y=3;
for(const x of [-3,3]) for(const z of [-.9,.9]){
  const leg=mesh(new THREE.BoxGeometry(.42,3,.42),matDarkWood,table);
  leg.position.set(x,1.5,z);
}
const brace=mesh(new THREE.BoxGeometry(5.9,.24,.25),matDarkWood,table);
brace.position.set(0,1.25,.85);

const glassMat = new THREE.MeshPhysicalMaterial({
  color:0xb8d6cd,roughness:.08,transmission:.58,transparent:true,
  opacity:.52,thickness:.3,ior:1.45,side:THREE.DoubleSide
});
const potionMats = {
  green:new THREE.MeshStandardMaterial({color:0x40cc58,emissive:0x20ff4a,emissiveIntensity:2.5,roughness:.2}),
  violet:new THREE.MeshStandardMaterial({color:0x9a45da,emissive:0xa62cff,emissiveIntensity:2.4,roughness:.2}),
  cyan:new THREE.MeshStandardMaterial({color:0x3fb7af,emissive:0x28e7ce,emissiveIntensity:1.8,roughness:.2})
};
const bubbles=[];

function tubeBetween(a,b,r,material,parent){
  const mid=a.clone().add(b).multiplyScalar(.5);
  const len=a.distanceTo(b);
  const t=mesh(new THREE.CylinderGeometry(r,r,len,10),material,parent);
  t.position.copy(mid);
  t.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),b.clone().sub(a).normalize());
  return t;
}

function makeFlask(parent,pos,colorName,scale=1){
  const g=new THREE.Group();
  g.position.copy(pos);
  g.scale.setScalar(scale);
  parent.add(g);
  const bulb=mesh(new THREE.SphereGeometry(.53,24,18),glassMat,g);
  bulb.scale.y=1.08;
  bulb.position.y=.55;
  const neck=mesh(new THREE.CylinderGeometry(.15,.18,.9,16,1,true),glassMat,g);
  neck.position.y=1.26;
  const rim=mesh(new THREE.TorusGeometry(.17,.035,8,20),glassMat,g);
  rim.rotation.x=Math.PI/2;
  rim.position.y=1.72;
  const liquid=mesh(new THREE.SphereGeometry(.46,20,14),potionMats[colorName],g);
  liquid.scale.set(1,.48,1);
  liquid.position.y=.32;
  for(let i=0;i<5;i++){
    const b=mesh(new THREE.SphereGeometry(range(.025,.06),8,6),potionMats[colorName],g,false);
    b.userData={baseY:range(.2,.75),speed:range(.55,1.25),phase:range(0,6.28),top:.78};
    b.position.set(range(-.27,.27),b.userData.baseY,range(-.25,.25));
    bubbles.push(b);
  }
  return g;
}

const greenFlask=makeFlask(table,new THREE.Vector3(-1.8,3.22,.1),'green',1.1);
const violetFlask=makeFlask(table,new THREE.Vector3(.1,3.2,-.15),'violet',.9);
const cyanFlask=makeFlask(table,new THREE.Vector3(2.1,3.2,.15),'cyan',.72);

const greenLight=pointLight(0x3dff67,3.3,7,new THREE.Vector3(-1.8,3.8,.2),table);
const violetLight=pointLight(0xbb43ff,2.8,6,new THREE.Vector3(.1,3.8,.1),table);
animatedLights.push({light:greenLight,base:3.3,phase:1.2},{light:violetLight,base:2.8,phase:4.1});

const retort=new THREE.Group();
retort.position.set(-.65,4.62,-1.5);
table.add(retort);
const retortBulb=mesh(new THREE.SphereGeometry(.42,20,14),glassMat,retort);
retortBulb.scale.set(1.15,.85,1);
const retortFluid=mesh(new THREE.SphereGeometry(.36,16,12),potionMats.violet,retort);
retortFluid.scale.set(1.15,.35,1);
retortFluid.position.y=-.16;
const tubeCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(.35,.2,0),new THREE.Vector3(.8,.45,0),
  new THREE.Vector3(1.2,.7,0),new THREE.Vector3(1.75,.45,0)
]);
mesh(new THREE.TubeGeometry(tubeCurve,28,.085,10,false),glassMat,retort);

const brassStand=mesh(new THREE.CylinderGeometry(.055,.055,2.3,10),matBrass,table);
brassStand.position.set(-.7,4.2,-1.75);
const standBase=mesh(new THREE.CylinderGeometry(.48,.58,.12,20),matBrass,table);
standBase.position.set(-.7,3.23,-1.75);
const clamp=mesh(new THREE.TorusGeometry(.48,.04,8,22),matBrass,table);
clamp.position.set(-.7,4.65,-1.45);
clamp.rotation.x=Math.PI/2;

function makeCandle(parent,x,y,z,h=.8){
  const g=new THREE.Group();
  g.position.set(x,y,z);
  parent.add(g);
  const wax=mesh(new THREE.CylinderGeometry(.12,.15,h,14),matWax,g);
  wax.position.y=h/2;
  const drip=mesh(new THREE.SphereGeometry(.13,10,7),matWax,g);
  drip.scale.set(1,.25,1);
  drip.position.y=h;
  const wick=mesh(new THREE.CylinderGeometry(.012,.012,.1,6),matIron,g);
  wick.position.y=h+.08;
  const flameMat=new THREE.MeshBasicMaterial({color:0xffc15a});
  const flame=mesh(new THREE.SphereGeometry(.075,10,8),flameMat,g,false);
  flame.scale.set(.7,1.7,.7);
  flame.position.y=h+.24;
  const light=pointLight(0xff9b45,1.45,5,new THREE.Vector3(0,h+.28,0),g);
  animatedLights.push({light,base:1.45,phase:range(0,6.28),flame});
  return g;
}
makeCandle(table,-2.9,3.2,-.65,1.0);
makeCandle(table,2.9,3.2,-.55,.65);

const cauldron=new THREE.Group();
cauldron.position.set(3.9,0,1.9);
scene.add(cauldron);

const profile=[
  new THREE.Vector2(.45,0),new THREE.Vector2(1.22,.35),
  new THREE.Vector2(1.48,1.05),new THREE.Vector2(1.5,1.55),
  new THREE.Vector2(1.37,1.72),new THREE.Vector2(1.22,1.58),
  new THREE.Vector2(1.18,1.08),new THREE.Vector2(.35,.18)
];
const pot=mesh(new THREE.LatheGeometry(profile,40),matIron,cauldron);
pot.position.y=1.2;
const rim=mesh(new THREE.TorusGeometry(1.45,.1,12,40),matIron,cauldron);
rim.rotation.x=Math.PI/2;
rim.position.y=2.88;
const brewMat=new THREE.MeshStandardMaterial({
  color:0x6c1b8e,emissive:0xb532ff,emissiveIntensity:2.6,
  roughness:.18,side:THREE.DoubleSide
});
const brew=mesh(new THREE.CircleGeometry(1.25,40),brewMat,cauldron);
brew.rotation.x=-Math.PI/2;
brew.position.y=2.86;

for(let i=0;i<3;i++){
  const leg=mesh(new THREE.CylinderGeometry(.11,.17,1.25,10),matIron,cauldron);
  const a=i*Math.PI*2/3;
  leg.position.set(Math.cos(a)*.92,.65,Math.sin(a)*.92);
  leg.rotation.z=Math.cos(a)*.22;
  leg.rotation.x=Math.sin(a)*.22;
}
const handle=mesh(new THREE.TorusGeometry(1.68,.065,8,48,Math.PI),matIron,cauldron);
handle.rotation.z=Math.PI/2;
handle.position.y=3.35;

const coals=[];
for(let i=0;i<22;i++){
  const cmat=new THREE.MeshStandardMaterial({
    color:0x3a160d,emissive:rand()>.3?0xff4b13:0x7a1208,emissiveIntensity:range(1.5,4)
  });
  const coal=mesh(new THREE.DodecahedronGeometry(range(.14,.28),0),cmat,cauldron);
  const a=range(0,Math.PI*2),r=range(.15,1.05);
  coal.position.set(Math.cos(a)*r,.16,Math.sin(a)*r);
  coal.scale.y=.65;
  coal.userData.phase=range(0,6.28);
  coals.push(coal);
}
const cauldronLight=pointLight(0xc64cff,4.6,8,new THREE.Vector3(0,3.25,0),cauldron);
animatedLights.push({light:cauldronLight,base:4.6,phase:2.2});

const steam=[];
for(let i=0;i<18;i++){
  const s=mesh(new THREE.SphereGeometry(range(.06,.16),8,6),
    new THREE.MeshBasicMaterial({color:0xd7b8e5,transparent:true,opacity:range(.08,.25),depthWrite:false}),
    cauldron,false);
  const a=range(0,Math.PI*2),r=range(0,.85);
  s.position.set(Math.cos(a)*r,range(3,5.6),Math.sin(a)*r);
  s.userData={phase:range(0,6.28),speed:range(.25,.6),radius:r};
  steam.push(s);
}

const runeGroup=new THREE.Group();
runeGroup.position.set(-.3,.025,3.1);
scene.add(runeGroup);
const runeMat=new THREE.MeshBasicMaterial({
  color:0x45e8c4,transparent:true,opacity:.78,
  blending:THREE.AdditiveBlending,depthWrite:false
});
for(const r of [2.1,2.45,3.05]){
  const ring=mesh(new THREE.TorusGeometry(r,.028,6,96),runeMat,runeGroup,false);
  ring.rotation.x=Math.PI/2;
}
function runeLine(a,b,width=.035){
  const va=new THREE.Vector3(a[0],0,a[1]);
  const vb=new THREE.Vector3(b[0],0,b[1]);
  return tubeBetween(va,vb,width,runeMat,runeGroup);
}
for(let i=0;i<6;i++){
  const a=i*Math.PI/3;
  const b=(i+2)*Math.PI/3;
  runeLine([Math.cos(a)*2.42,Math.sin(a)*2.42],[Math.cos(b)*2.42,Math.sin(b)*2.42]);
}
for(let i=0;i<12;i++){
  const a=i*Math.PI/6;
  const g=new THREE.Group();
  g.position.set(Math.cos(a)*2.76,.01,Math.sin(a)*2.76);
  g.rotation.y=-a;
  runeGroup.add(g);
  runeLine([-.11,0],[.11,0],.024).parent.remove(runeGroup.children[runeGroup.children.length-1]);
  const bar=mesh(new THREE.BoxGeometry(.24,.025,.035),runeMat,g,false);
  const stem=mesh(new THREE.BoxGeometry(.035,.025,.32),runeMat,g,false);
  stem.position.z=.07;
}
const runeLight=pointLight(0x31e8c2,1.8,8,new THREE.Vector3(0,.4,0),runeGroup);
animatedLights.push({light:runeLight,base:1.8,phase:.4});

const lectern=new THREE.Group();
lectern.position.set(-6.4,0,3.7);
lectern.rotation.y=.35;
scene.add(lectern);
const pedestal=mesh(new THREE.CylinderGeometry(.42,.65,2.7,8),matDarkWood,lectern);
pedestal.position.y=1.35;
const foot=mesh(new THREE.BoxGeometry(2.1,.25,1.4),matDarkWood,lectern);
foot.position.y=.14;
const top=mesh(new THREE.BoxGeometry(3.4,.25,2.25),matWood,lectern);
top.position.set(0,3.05,0);
top.rotation.x=-.28;

const book=new THREE.Group();
book.position.set(0,3.35,-.03);
book.rotation.x=-.28;
lectern.add(book);
const coverMat=new THREE.MeshStandardMaterial({color:0x361421,roughness:.65,metalness:.05});
const cover=mesh(new THREE.BoxGeometry(3.1,.18,1.95),coverMat,book);
cover.position.y=-.08;
for(const side of [-1,1]){
  const page=mesh(new THREE.PlaneGeometry(1.45,1.75),matPage,book);
  page.rotation.x=-Math.PI/2;
  page.rotation.z=side*.10;
  page.position.set(side*.73,.08,0);
}
const spine=mesh(new THREE.CylinderGeometry(.14,.14,1.95,12),coverMat,book);
spine.rotation.x=Math.PI/2;
spine.position.set(0,-.02,0);
for(const x of [-1.42,1.42]){
  const corner=mesh(new THREE.BoxGeometry(.14,.08,.35),matBrass,book);
  corner.position.set(x,.1,-.76);
}

const astrolabe=new THREE.Group();
astrolabe.position.set(6.9,3.15,-4.9);
scene.add(astrolabe);
const astroBase=mesh(new THREE.CylinderGeometry(.7,.85,.18,24),matBrass,astrolabe);
const astroPost=mesh(new THREE.CylinderGeometry(.07,.09,2.5,12),matBrass,astrolabe);
astroPost.position.y=1.3;
for(let i=0;i<3;i++){
  const ring=mesh(new THREE.TorusGeometry(.75+i*.18,.035,8,48),matBrass,astrolabe);
  ring.position.y=2.25;
  ring.rotation.set(i*.7,i*.45,i*.8);
}
const needle=mesh(new THREE.BoxGeometry(.05,1.65,.05),matCopper,astrolabe);
needle.position.y=2.25;
needle.rotation.z=.65;

const scattered=[];
for(let i=0;i<12;i++){
  const boneMat=new THREE.MeshStandardMaterial({color:0xb6a17a,roughness:.9});
  const b=mesh(new THREE.CylinderGeometry(.025,.045,range(.3,.7),7),boneMat);
  b.position.set(range(-8,8),.08,range(-1,6));
  b.rotation.set(Math.PI/2,range(0,6.28),range(0,6.28));
  scattered.push(b);
}

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();

  for(const b of bubbles){
    const d=b.userData;
    const span=d.top-.18;
    const y=.18+((t*d.speed+d.phase)%1)*span;
    b.position.y=y;
    b.scale.setScalar(.65+.35*Math.sin(((t*d.speed+d.phase)%1)*Math.PI));
  }

  brew.scale.setScalar(1+Math.sin(t*1.7)*.012);
  brew.rotation.z=t*.08;

  steam.forEach((s,i)=>{
    const d=s.userData;
    const p=(t*d.speed+d.phase)%1;
    const ang=d.phase+t*.18;
    s.position.x=Math.cos(ang)*d.radius*(1+p*.5);
    s.position.z=Math.sin(ang)*d.radius*(1+p*.5);
    s.position.y=3+p*3;
    s.material.opacity=(1-p)*.2;
    s.scale.setScalar(.7+p*1.8);
  });

  animatedLights.forEach((o,i)=>{
    o.light.intensity=o.base*(.88+.12*Math.sin(t*(5.1+i*.37)+o.phase)+.045*Math.sin(t*13.7+o.phase));
    if(o.flame){
      o.flame.scale.y=1.5+.25*Math.sin(t*9+o.phase);
      o.flame.position.x=Math.sin(t*7+o.phase)*.015;
    }
  });

  coals.forEach(c=>{
    c.material.emissiveIntensity=2.1+1.2*Math.sin(t*3+c.userData.phase);
  });

  runeGroup.rotation.y=Math.sin(t*.24)*.035;
  runeMat.opacity=.65+.17*Math.sin(t*1.35);
  astrolabe.children.slice(2,5).forEach((r,i)=>r.rotation.y+=.0015*(i+1));
  retortFluid.rotation.y=t*.25;

  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
