<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Chrome Arm Cuff</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 68% 25%, #173b68 0%, #09182d 28%, transparent 55%),
        radial-gradient(circle at 25% 72%, #122c50 0%, #060b15 42%, #02040a 100%);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,.62) 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(4.8, 1.15, 5.8);
  camera.lookAt(0, -0.1, 0);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true,
    powerPreference: 'high-performance'
  });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.18;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  const environment = new RoomEnvironment();
  const environmentTarget = pmremGenerator.fromScene(environment, 0.035);
  scene.environment = environmentTarget.texture;
  environment.dispose();
  pmremGenerator.dispose();

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.72;
  controls.enablePan = false;
  controls.minDistance = 4.3;
  controls.maxDistance = 10;
  controls.target.set(0, -0.12, 0);

  scene.add(new THREE.HemisphereLight(0x9bc8ff, 0x08070d, 1.45));

  const keyLight = new THREE.DirectionalLight(0xd9ecff, 4.8);
  keyLight.position.set(4.5, 5.5, 5);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(1024, 1024);
  keyLight.shadow.camera.near = 0.5;
  keyLight.shadow.camera.far = 18;
  scene.add(keyLight);

  const blueLight = new THREE.PointLight(0x367dff, 24, 12, 2);
  blueLight.position.set(-3.4, 0.8, 3.8);
  scene.add(blueLight);

  const rimLight = new THREE.SpotLight(0xc8e8ff, 65, 16, Math.PI * 0.24, 0.8, 1.5);
  rimLight.position.set(-4.5, 4.2, -4);
  rimLight.target.position.set(0, 0, 0);
  scene.add(rimLight, rimLight.target);

  const warmLight = new THREE.PointLight(0xffd9bf, 10, 8, 2);
  warmLight.position.set(3, -2.8, -2.5);
  scene.add(warmLight);

  function gaussian(value, center, width) {
    const d = (value - center) / width;
    return Math.exp(-d * d);
  }

  function pathPoint(u, target) {
    const gap = 0.42;
    const theta = gap + u * (Math.PI * 2 - gap * 2);
    const vertical = Math.cos(theta);
    const taper = 0.64 + 0.25 * ((vertical + 1) * 0.5);
    const radius = 1.82;

    let x = radius * Math.sin(theta) * taper;
    let y = radius * vertical;
    let z = 0;

    y -= 0.17 * Math.pow(Math.max(0, -vertical), 3);
    x += 0.07 * Math.sin(theta * 2.35 + 0.4);
    y += 0.055 * Math.sin(theta * 3.0 - 0.25);

    let ripple = 0;
    ripple += 0.15 * gaussian(u, 0.095, 0.045);
    ripple += 0.22 * gaussian(u, 0.285, 0.052);
    ripple += 0.11 * gaussian(u, 0.435, 0.038);
    ripple += 0.27 * gaussian(u, 0.535, 0.055);
    ripple += 0.12 * gaussian(u, 0.745, 0.045);
    ripple += 0.19 * gaussian(u, 0.895, 0.05);
    ripple -= 0.06 * gaussian(u, 0.655, 0.05);

    const outwardX = Math.sin(theta);
    const outwardY = Math.cos(theta);
    x += outwardX * ripple;
    y += outwardY * ripple;

    z += 0.075 * Math.sin(theta * 1.55 - 0.7);
    z += 0.1 * gaussian(u, 0.21, 0.08);
    z -= 0.09 * gaussian(u, 0.72, 0.07);

    return target.set(x, y, z);
  }

  function buildCuffGeometry() {
    const pathSegments = 256;
    const ringSegments = 40;
    const positions = [];
    const uvs = [];
    const indices = [];

    const center = new THREE.Vector3();
    const before = new THREE.Vector3();
    const after = new THREE.Vector3();
    const tangent = new THREE.Vector3();
    const planarNormal = new THREE.Vector3();
    const binormal = new THREE.Vector3();
    const axisA = new THREE.Vector3();
    const axisB = new THREE.Vector3();
    const vertex = new THREE.Vector3();

    for (let i = 0; i <= pathSegments; i++) {
      const u = i / pathSegments;
      pathPoint(u, center);
      pathPoint(Math.max(0, u - 0.0015), before);
      pathPoint(Math.min(1, u + 0.0015), after);
      tangent.subVectors(after, before).normalize();

      planarNormal.set(-tangent.y, tangent.x, 0).normalize();
      binormal.crossVectors(tangent, planarNormal).normalize();

      const twist =
        0.28 * Math.sin((u - 0.1) * Math.PI * 1.35) +
        0.12 * Math.sin(u * Math.PI * 3.0);

      axisA.copy(planarNormal).multiplyScalar(Math.cos(twist))
        .addScaledVector(binormal, Math.sin(twist)).normalize();
      axisB.copy(binormal).multiplyScalar(Math.cos(twist))
        .addScaledVector(planarNormal, -Math.sin(twist)).normalize();

      let radialThickness = 0.185;
      radialThickness += 0.052 * gaussian(u, 0.09, 0.055);
      radialThickness += 0.082 * gaussian(u, 0.29, 0.05);
      radialThickness += 0.065 * gaussian(u, 0.53, 0.042);
      radialThickness += 0.045 * gaussian(u, 0.76, 0.05);
      radialThickness += 0.075 * gaussian(u, 0.91, 0.05);
      radialThickness *= 1 + 0.055 * Math.sin(u * Math.PI * 13 + 0.5);

      let halfWidth = 0.67;
      halfWidth += 0.12 * gaussian(u, 0.055, 0.055);
      halfWidth += 0.08 * gaussian(u, 0.24, 0.07);
      halfWidth -= 0.07 * gaussian(u, 0.42, 0.06);
      halfWidth += 0.11 * gaussian(u, 0.59, 0.065);
      halfWidth -= 0.05 * gaussian(u, 0.79, 0.05);
      halfWidth += 0.13 * gaussian(u, 0.95, 0.055);
      halfWidth *= 1 + 0.035 * Math.sin(u * Math.PI * 9 - 0.6);

      const endBulge =
        0.13 * gaussian(u, 0.015, 0.035) +
        0.13 * gaussian(u, 0.985, 0.035);

      for (let j = 0; j < ringSegments; j++) {
        const v = j / ringSegments;
        const phi = v * Math.PI * 2;
        const cosPhi = Math.cos(phi);
        const sinPhi = Math.sin(phi);

        const liquidWave =
          1 +
          0.045 * Math.sin(phi * 3 + u * 17) +
          0.025 * Math.sin(phi * 5 - u * 23);

        const edgeFlow =
          gaussian(Math.abs(sinPhi), 0.98, 0.15) *
          (0.035 * Math.sin(u * 31 + phi * 2));

        const a = (radialThickness + endBulge) * liquidWave;
        const b = (halfWidth + endBulge * 1.8) * (1 + edgeFlow);

        vertex.copy(center)
          .addScaledVector(axisA, a * cosPhi)
          .addScaledVector(axisB, b * sinPhi);

        const sideDroop =
          gaussian(u, 0.355, 0.035) *
          gaussian(Math.sin(phi), -0.94, 0.22) * 0.14;
        vertex.y -= sideDroop;

        positions.push(vertex.x, vertex.y, vertex.z);
        uvs.push(u, v);
      }
    }

    for (let i = 0; i < pathSegments; i++) {
      for (let j = 0; j < ringSegments; j++) {
        const nextJ = (j + 1) % ringSegments;
        const a = i * ringSegments + j;
        const b = (i + 1) * ringSegments + j;
        const c = (i + 1) * ringSegments + nextJ;
        const d = i * ringSegments + nextJ;
        indices.push(a, b, d, b, c, d);
      }
    }

    const startCenterIndex = positions.length / 3;
    pathPoint(0, center);
    positions.push(center.x, center.y, center.z);
    uvs.push(0, 0.5);

    const endCenterIndex = positions.length / 3;
    pathPoint(1, center);
    positions.push(center.x, center.y, center.z);
    uvs.push(1, 0.5);

    const endRingOffset = pathSegments * ringSegments;
    for (let j = 0; j < ringSegments; j++) {
      const nextJ = (j + 1) % ringSegments;
      indices.push(startCenterIndex, nextJ, j);
      indices.push(endCenterIndex, endRingOffset + j, endRingOffset + nextJ);
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geometry.setIndex(indices);
    geometry.computeVertexNormals();
    geometry.computeBoundingSphere();
    return geometry;
  }

  const chromeMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xd9e7f5,
    metalness: 1,
    roughness: 0.075,
    envMapIntensity: 2.3,
    clearcoat: 0.55,
    clearcoatRoughness: 0.055,
    reflectivity: 1,
    iridescence: 0.06,
    iridescenceIOR: 1.25,
    iridescenceThicknessRange: [100, 260]
  });

  const cuff = new THREE.Mesh(buildCuffGeometry(), chromeMaterial);
  cuff.rotation.set(-0.055, -0.18, -0.04);
  cuff.position.y = 0.05;
  cuff.castShadow = true;
  cuff.receiveShadow = true;
  scene.add(cuff);

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();
    cuff.rotation.z = -0.04 + Math.sin(time * 0.35) * 0.012;
    cuff.position.y = 0.05 + Math.sin(time * 0.6) * 0.025;
    blueLight.intensity = 23 + Math.sin(time * 0.8) * 2;
    controls.update();
    renderer.render(scene, camera);
  }

  animate();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  });
</script>
</body>
</html>
