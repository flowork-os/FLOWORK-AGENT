<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roman Senator Bust</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1c1a18; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1c1a18);
scene.fog = new THREE.Fog(0x1c1a18, 14, 30);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2.4, 7.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.55, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 3.5;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.55;

// ---------- lighting ----------
const key = new THREE.DirectionalLight(0xfff2e0, 2.6);
key.position.set(4, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -4;
key.shadow.camera.right = key.shadow.camera.top = 4;
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9db4d6, 0.7);
fill.position.set(-5, 3, -2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xe8d8ff, 0.9);
rim.position.set(-2, 5, -6);
scene.add(rim);

scene.add(new THREE.HemisphereLight(0x8a7f72, 0x2a241f, 0.55));

// ---------- materials ----------
const marble = new THREE.MeshStandardMaterial({
  color: 0xf2efe8, roughness: 0.42, metalness: 0.02, flatShading: false
});
const marbleFlat = marble.clone(); marbleFlat.flatShading = true;

// ---------- ground with soft shadow ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(12, 64),
  new THREE.MeshStandardMaterial({ color: 0x242019, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const shadowCatch = new THREE.Mesh(
  new THREE.CircleGeometry(6, 48),
  new THREE.ShadowMaterial({ opacity: 0.45 })
);
shadowCatch.rotation.x = -Math.PI / 2;
shadowCatch.position.y = 0.002;
shadowCatch.receiveShadow = true;
scene.add(shadowCatch);

// ---------- bust group ----------
const bust = new THREE.Group();
scene.add(bust);
const cast = m => { m.castShadow = true; m.receiveShadow = true; return m; };

// --- plinth with one chipped corner (carve via vertex displacement) ---
const plinthGeo = new THREE.BoxGeometry(1.7, 0.5, 1.7, 8, 4, 8);
{
  const p = plinthGeo.attributes.position, v = new THREE.Vector3();
  const corner = new THREE.Vector3(0.85, 0.25, 0.85);
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const d = v.distanceTo(corner);
    if (d < 0.45) {
      const t = 1 - d / 0.45;
      const cut = 0.22 * t * t;
      v.x -= cut * (v.x > 0 ? 1 : 0);
      v.y -= cut * (v.y > 0 ? 1 : 0);
      v.z -= cut * (v.z > 0 ? 1 : 0);
      // rough chip facets
      v.x += Math.sin(i * 12.9898) * 0.02 * t;
      v.z += Math.sin(i * 78.233) * 0.02 * t;
    }
    p.setXYZ(i, v.x, v.y, v.z);
  }
  plinthGeo.computeVertexNormals();
}
const plinth = cast(new THREE.Mesh(plinthGeo, marbleFlat));
plinth.position.y = 0.25;
bust.add(plinth);

const plinthCap = cast(new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.12, 1.45), marble));
plinthCap.position.y = 0.56;
bust.add(plinthCap);

// --- socle (round support between plinth and chest) ---
const socle = cast(new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.46, 0.42, 32), marble));
socle.position.y = 0.83;
bust.add(socle);

// --- torso / chest, sculpted from a sphere ---
const torsoGeo = new THREE.SphereGeometry(1, 64, 48);
{
  const p = torsoGeo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    v.x *= 1.15;                       // shoulder width
    v.z *= 0.62;                       // chest depth
    v.y *= 0.85;
    if (v.y < 0) v.y *= 0.55;          // truncated bust bottom
    if (v.y > 0.35) {                  // taper toward neck
      const t = (v.y - 0.35) / 0.5;
      v.x *= 1 - 0.55 * t;
      v.z *= 1 - 0.35 * t;
    }
    p.setXYZ(i, v.x, v.y, v.z);
  }
  torsoGeo.computeVertexNormals();
}
const torso = cast(new THREE.Mesh(torsoGeo, marble));
torso.position.y = 1.45;
bust.add(torso);

// --- toga folds: crisp diagonal drape across chest + shoulder rolls ---
const foldMat = marble;
function drapeFold(radius, tube, arcStart, arcLen, pos, rot, squashZ = 0.55) {
  const g = new THREE.TorusGeometry(radius, tube, 14, 48, arcLen);
  const m = cast(new THREE.Mesh(g, foldMat));
  m.rotation.set(rot.x, rot.y, rot.z + arcStart);
  m.position.copy(pos);
  m.scale.z = squashZ;
  return m;
}
// diagonal sash folds from left shoulder to right hip
for (let i = 0; i < 4; i++) {
  const f = drapeFold(
    0.95 + i * 0.055, 0.075 - i * 0.008,
    Math.PI * 0.15, Math.PI * 0.75,
    new THREE.Vector3(0.05, 1.28 - i * 0.02, 0.42 + i * 0.035),
    new THREE.Euler(0.28, 0.15, 0.55)
  );
  bust.add(f);
}
// left-shoulder toga roll (umbo)
for (let i = 0; i < 3; i++) {
  const roll = cast(new THREE.Mesh(new THREE.TorusGeometry(0.30 - i * 0.05, 0.085, 12, 32, Math.PI * 1.25), foldMat));
  roll.position.set(-0.68, 1.95 + i * 0.05, 0.12);
  roll.rotation.set(Math.PI / 2.2, 0.25, 0.4);
  bust.add(roll);
}
// vertical hanging folds at lower chest
for (let i = -3; i <= 3; i++) {
  const h = 0.55 + 0.12 * Math.cos(i * 1.1);
  const fold = cast(new THREE.Mesh(new THREE.CapsuleGeometry(0.065, h, 6, 12), foldMat));
  fold.position.set(i * 0.165, 1.08 - 0.03 * Math.abs(i), 0.52 - 0.05 * Math.abs(i));
  fold.rotation.x = 0.18;
  fold.rotation.z = i * 0.06;
  bust.add(fold);
}

// --- neck ---
const neck = cast(new THREE.Mesh(new THREE.CylinderGeometry(0.235, 0.3, 0.55, 28), marble));
neck.position.y = 2.28;
bust.add(neck);

// --- head group ---
const head = new THREE.Group();
head.position.y = 2.78;
head.rotation.y = -0.08;
bust.add(head);

// skull
const skullGeo = new THREE.SphereGeometry(0.42, 48, 36);
{
  const p = skullGeo.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    v.y *= 1.18;                        // elongate
    v.z *= 0.98;
    if (v.y < -0.1 && v.z > 0) v.z *= 1 - 0.25 * Math.min(1, -v.y * 2); // jaw taper
    if (v.y < -0.15) v.x *= 0.86;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  skullGeo.computeVertexNormals();
}
head.add(cast(new THREE.Mesh(skullGeo, marble)));

// jaw / chin
const jaw = cast(new THREE.Mesh(new THREE.SphereGeometry(0.16, 24, 18), marble));
jaw.position.set(0, -0.34, 0.24);
jaw.scale.set(1.25, 0.85, 1);
head.add(jaw);

// brow ridge
const brow = cast(new THREE.Mesh(new THREE.CapsuleGeometry(0.045, 0.3, 6, 12), marble));
brow.rotation.z = Math.PI / 2;
brow.position.set(0, 0.09, 0.375);
head.add(brow);

// nose (strong Roman nose)
const nose = cast(new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.34, 4), marble));
nose.rotation.x = Math.PI / 2 + 0.42;
nose.rotation.y = Math.PI / 4;
nose.position.set(0, -0.08, 0.44);
head.add(nose);

// eyes: recessed sockets suggested by lids
for (const s of [-1, 1]) {
  const socket = cast(new THREE.Mesh(new THREE.SphereGeometry(0.085, 18, 14), marble));
  socket.position.set(0.155 * s, 0.02, 0.355);
  socket.scale.set(1.15, 0.7, 0.6);
  head.add(socket);
  const lid = cast(new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.02, 8, 18, Math.PI), marble));
  lid.position.set(0.155 * s, 0.045, 0.385);
  lid.rotation.x = -0.25;
  head.add(lid);
}

// mouth: subtle stern lips
const lipTop = cast(new THREE.Mesh(new THREE.CapsuleGeometry(0.022, 0.14, 6, 10), marble));
lipTop.rotation.z = Math.PI / 2;
lipTop.position.set(0, -0.245, 0.335);
head.add(lipTop);
const lipBot = cast(new THREE.Mesh(new THREE.CapsuleGeometry(0.026, 0.10, 6, 10), marble));
lipBot.rotation.z = Math.PI / 2;
lipBot.position.set(0, -0.29, 0.33);
head.add(lipBot);

// ears
for (const s of [-1, 1]) {
  const ear = cast(new THREE.Mesh(new THREE.SphereGeometry(0.085, 16, 12), marble));
  ear.position.set(0.41 * s, -0.05, 0.02);
  ear.scale.set(0.45, 1.1, 0.75);
  head.add(ear);
}

// --- short carved hair: cap of small chiseled locks ---
const hair = new THREE.Group();
head.add(hair);
const lockGeo = new THREE.SphereGeometry(0.075, 7, 5);
const hairMat = marbleFlat;
let seed = 1;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
for (let i = 0; i < 210; i++) {
  // distribute on upper hemisphere, leaving the face open
  const u = rand(), w = rand();
  const phi = Math.acos(1 - u * 0.78);          // from top down
  const theta = w * Math.PI * 2;
  const x = Math.sin(phi) * Math.cos(theta);
  const y = Math.cos(phi);
  const z = Math.sin(phi) * Math.sin(theta);
  if (z > 0.35 && y < 0.55) continue;           // keep forehead/face clear
  const r = 0.42;
  const lock = cast(new THREE.Mesh(lockGeo, hairMat));
  lock.position.set(x * r * 1.02, y * r * 1.18 + 0.02, z * r * 1.0);
  lock.scale.set(0.8 + rand() * 0.6, 0.5 + rand() * 0.4, 0.8 + rand() * 0.6);
  lock.rotation.set(rand() * 3, rand() * 3, rand() * 3);
  hair.add(lock);
}
// fringe row combed onto the forehead
for (let i = -5; i <= 5; i++) {
  const a = i * 0.16;
  const lock = cast(new THREE.Mesh(lockGeo, hairMat));
  lock.position.set(Math.sin(a) * 0.36, 0.30 - Math.abs(i) * 0.008, Math.cos(a) * 0.36 + 0.06);
  lock.scale.set(0.9, 0.55, 0.9);
  lock.rotation.set(rand() * 3, rand() * 3, rand() * 3);
  hair.add(lock);
}

// ---------- resize / animate ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
