<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quarry Spoil Pile and Access Road</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #b9c4c0;
      font-family: Arial, sans-serif;
    }
    canvas { display: block; }
    #compass, #scale {
      position: fixed;
      z-index: 2;
      color: rgba(37, 40, 34, 0.82);
      pointer-events: none;
      user-select: none;
    }
    #compass {
      top: 18px;
      right: 20px;
      width: 42px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }
    #compass .arrow {
      width: 0;
      height: 0;
      margin: 5px auto 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 24px solid rgba(37, 40, 34, 0.78);
    }
    #scale {
      left: 20px;
      bottom: 18px;
      font-size: 11px;
      letter-spacing: 0.08em;
    }
    #scale .bar {
      width: 100px;
      height: 5px;
      margin-top: 5px;
      border: solid rgba(37, 40, 34, 0.75);
      border-width: 0 2px 2px;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="compass">N<div class="arrow"></div></div>
  <div id="scale">20 METRES<div class="bar"></div></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb8c4c2);
    scene.fog = new THREE.FogExp2(0xb8c4c2, 0.00235);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 700);
    camera.position.set(126, 88, 142);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(-8, 8, -5);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.28;
    controls.minDistance = 55;
    controls.maxDistance = 310;
    controls.maxPolarAngle = Math.PI * 0.48;

    const hemi = new THREE.HemisphereLight(0xdde6e2, 0x66533c, 2.2);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffefd2, 3.5);
    sun.position.set(-85, 130, 72);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -145;
    sun.shadow.camera.right = 145;
    sun.shadow.camera.top = 130;
    sun.shadow.camera.bottom = -130;
    sun.shadow.camera.near = 25;
    sun.shadow.camera.far = 310;
    sun.shadow.bias = -0.0005;
    sun.shadow.normalBias = 0.45;
    scene.add(sun);

    let seed = 84721;
    function random() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    }

    function hash2(x, z) {
      const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453123;
      return s - Math.floor(s);
    }

    function smoothstep(a, b, value) {
      const t = THREE.MathUtils.clamp((value - a) / (b - a), 0, 1);
      return t * t * (3 - 2 * t);
    }

    function baseHeight(x, z) {
      return -1.8
        + Math.sin(x * 0.026 + 0.7) * 1.35
        + Math.sin(z * 0.031 - 0.9) * 1.05
        + Math.sin((x + z) * 0.014) * 0.85
        + Math.sin(x * 0.081 - z * 0.047) * 0.28;
    }

    function roadX(z) {
      return 31 + 0.00092 * z * z + 7.5 * Math.sin((z + 20) * 0.012);
    }

    function roadGrade(z) {
      return -1.35 - z * 0.006 + Math.sin(z * 0.018) * 0.26;
    }

    function heapContribution(x, z) {
      const hx = -24;
      const hz = -8;
      const dx = x - hx;
      const dz = z - hz;
      const r = Math.hypot(dx, dz);
      const angle = Math.atan2(dz, dx);
      const radius = 45
        + 3.2 * Math.sin(angle * 3 + 0.4)
        + 2.1 * Math.sin(angle * 7 - 1.2)
        + 1.25 * Math.sin(angle * 11 + 2.1);

      if (r >= radius) return 0;

      const q = r / radius;
      const cone = 28.5 * Math.pow(1 - q, 0.91);
      const radialGullies =
        (1 - q) * q *
        (1.2 * Math.sin(angle * 15 + r * 0.11) +
         0.7 * Math.sin(angle * 27 - r * 0.16));
      const roughness =
        (0.65 * Math.sin(x * 0.41 + z * 0.17) +
         0.38 * Math.sin(x * 0.91 - z * 0.72)) *
        smoothstep(0.02, 0.28, q) *
        smoothstep(1, 0.75, q);

      return Math.max(0, cone + radialGullies + roughness);
    }

    function rawTerrainHeight(x, z) {
      return baseHeight(x, z) + heapContribution(x, z);
    }

    function terrainHeight(x, z) {
      const raw = rawTerrainHeight(x, z);
      const distance = Math.abs(x - roadX(z));
      const blend = smoothstep(5.2, 11.5, distance);
      return THREE.MathUtils.lerp(roadGrade(z), raw, blend);
    }

    const terrainWidth = 230;
    const terrainDepth = 190;
    const terrainXSegments = 184;
    const terrainZSegments = 152;
    const terrainGeometry = new THREE.PlaneGeometry(
      terrainWidth,
      terrainDepth,
      terrainXSegments,
      terrainZSegments
    );
    terrainGeometry.rotateX(-Math.PI / 2);

    const positions = terrainGeometry.attributes.position;
    const terrainColors = [];
    const earth = new THREE.Color();
    const grass = new THREE.Color();
    const stone = new THREE.Color();

    for (let i = 0; i < positions.count; i++) {
      const x = positions.getX(i);
      const z = positions.getZ(i);
      const y = terrainHeight(x, z);
      positions.setY(i, y);

      const pile = heapContribution(x, z);
      const variation = hash2(Math.floor(x * 0.45), Math.floor(z * 0.45)) - 0.5;

      if (pile > 0.25) {
        const mix = THREE.MathUtils.clamp(pile / 12, 0, 1);
        earth.setHSL(0.085, 0.17, 0.37 + variation * 0.055);
        stone.setHSL(0.095, 0.08, 0.44 + variation * 0.075);
        earth.lerp(stone, 0.34 + mix * 0.28);
      } else {
        earth.setHSL(0.105, 0.23, 0.29 + variation * 0.045);
        grass.setHSL(0.20, 0.19, 0.28 + variation * 0.04);
        earth.lerp(grass, 0.38);
      }

      terrainColors.push(earth.r, earth.g, earth.b);
    }

    terrainGeometry.setAttribute(
      'color',
      new THREE.Float32BufferAttribute(terrainColors, 3)
    );
    terrainGeometry.computeVertexNormals();

    const terrainMaterial = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.96,
      metalness: 0
    });

    const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
    terrain.receiveShadow = true;
    scene.add(terrain);

    function createRibbon(width, yOffset, material, startZ = -94, endZ = 94, segments = 190) {
      const across = [-1, -0.5, 0, 0.5, 1];
      const vertices = [];
      const colors = [];
      const indices = [];
      const color = new THREE.Color();

      for (let i = 0; i <= segments; i++) {
        const z = THREE.MathUtils.lerp(startZ, endZ, i / segments);
        const x = roadX(z);
        const dx = (roadX(z + 0.1) - roadX(z - 0.1)) / 0.2;
        const invLength = 1 / Math.sqrt(1 + dx * dx);
        const nx = invLength;
        const nz = -dx * invLength;

        for (const normalized of across) {
          const lateral = normalized * width * 0.5;
          const crown = (1 - Math.abs(normalized)) * 0.12;
          const px = x + nx * lateral;
          const pz = z + nz * lateral;
          const py = roadGrade(z) + crown + yOffset;
          vertices.push(px, py, pz);

          const mottling = (hash2(i * 0.71, normalized * 17.3) - 0.5) * 0.08;
          color.setHSL(0.09, 0.18, 0.41 + mottling);
          colors.push(color.r, color.g, color.b);
        }
      }

      const row = across.length;
      for (let i = 0; i < segments; i++) {
        for (let j = 0; j < row - 1; j++) {
          const a = i * row + j;
          const b = a + row;
          indices.push(a, b, a + 1, b, b + 1, a + 1);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      const mesh = new THREE.Mesh(geometry, material);
      mesh.receiveShadow = true;
      return mesh;
    }

    const shoulderMaterial = new THREE.MeshStandardMaterial({
      color: 0x6f624c,
      roughness: 1,
      metalness: 0
    });
    const roadMaterial = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.93,
      metalness: 0
    });

    scene.add(createRibbon(14.5, 0.045, shoulderMaterial));
    scene.add(createRibbon(9.4, 0.085, roadMaterial));

    const trackMaterial = new THREE.MeshStandardMaterial({
      color: 0x81755d,
      roughness: 1,
      transparent: true,
      opacity: 0.55,
      depthWrite: false
    });

    function createTrack(offset) {
      const points = [];
      for (let i = 0; i <= 150; i++) {
        const z = -92 + i / 150 * 184;
        const x = roadX(z);
        const dx = (roadX(z + 0.1) - roadX(z - 0.1)) / 0.2;
        const invLength = 1 / Math.sqrt(1 + dx * dx);
        points.push(new THREE.Vector3(
          x + invLength * offset,
          roadGrade(z) + 0.225,
          z - dx * invLength * offset
        ));
      }
      const curve = new THREE.CatmullRomCurve3(points);
      const geometry = new THREE.TubeGeometry(curve, 180, 0.19, 5, false);
      const track = new THREE.Mesh(geometry, trackMaterial);
      track.receiveShadow = true;
      scene.add(track);
    }

    createTrack(-2.25);
    createTrack(2.25);

    const rockGeometry = new THREE.IcosahedronGeometry(1, 1);
    const rockMaterial = new THREE.MeshStandardMaterial({
      color: 0x817867,
      roughness: 0.98,
      metalness: 0,
      flatShading: true
    });
    const rockCount = 420;
    const rocks = new THREE.InstancedMesh(rockGeometry, rockMaterial, rockCount);
    rocks.castShadow = true;
    rocks.receiveShadow = true;

    const dummy = new THREE.Object3D();
    const rockColor = new THREE.Color();

    for (let i = 0; i < rockCount; i++) {
      const angle = random() * Math.PI * 2;
      const radius = 5 + Math.pow(random(), 0.68) * 48;
      let x = -24 + Math.cos(angle) * radius;
      let z = -8 + Math.sin(angle) * radius;
      const roadDistance = Math.abs(x - roadX(z));

      if (roadDistance < 7.5) {
        x -= 10 + random() * 8;
      }

      const y = terrainHeight(x, z);
      const edgeFactor = THREE.MathUtils.clamp(radius / 45, 0, 1);
      const size = 0.22 + Math.pow(random(), 2.2) * (1.15 + edgeFactor * 0.8);

      dummy.position.set(x, y + size * 0.36, z);
      dummy.rotation.set(random() * Math.PI, random() * Math.PI, random() * Math.PI);
      dummy.scale.set(
        size * (0.7 + random() * 0.8),
        size * (0.45 + random() * 0.55),
        size * (0.65 + random() * 0.75)
      );
      dummy.updateMatrix();
      rocks.setMatrixAt(i, dummy.matrix);

      rockColor.setHSL(
        0.075 + random() * 0.045,
        0.07 + random() * 0.12,
        0.31 + random() * 0.22
      );
      rocks.setColorAt(i, rockColor);
    }
    scene.add(rocks);

    const gravelGeometry = new THREE.IcosahedronGeometry(1, 0);
    const gravelMaterial = new THREE.MeshStandardMaterial({
      color: 0x8c826d,
      roughness: 1,
      flatShading: true
    });
    const gravelCount = 260;
    const gravel = new THREE.InstancedMesh(gravelGeometry, gravelMaterial, gravelCount);
    gravel.receiveShadow = true;
    gravel.castShadow = true;

    for (let i = 0; i < gravelCount; i++) {
      const z = -91 + random() * 182;
      const xCenter = roadX(z);
      const dx = (roadX(z + 0.1) - roadX(z - 0.1)) / 0.2;
      const invLength = 1 / Math.sqrt(1 + dx * dx);
      const lateral = (random() - 0.5) * 8.7;
      const size = 0.055 + random() * 0.16;

      dummy.position.set(
        xCenter + invLength * lateral,
        roadGrade(z) + 0.19 + size * 0.25,
        z - dx * invLength * lateral
      );
      dummy.rotation.set(random() * 3, random() * 3, random() * 3);
      dummy.scale.set(size * 1.5, size * 0.55, size);
      dummy.updateMatrix();
      gravel.setMatrixAt(i, dummy.matrix);
    }
    scene.add(gravel);

    const scrubGeometry = new THREE.DodecahedronGeometry(1, 0);
    const scrubMaterial = new THREE.MeshStandardMaterial({
      color: 0x596044,
      roughness: 1,
      flatShading: true
    });
    const scrubCount = 95;
    const scrub = new THREE.InstancedMesh(scrubGeometry, scrubMaterial, scrubCount);
    scrub.castShadow = true;
    scrub.receiveShadow = true;

    for (let i = 0; i < scrubCount; i++) {
      let x, z;
      do {
        x = (random() - 0.5) * 210;
        z = (random() - 0.5) * 170;
      } while (
        heapContribution(x, z) > 0.1 ||
        Math.abs(x - roadX(z)) < 11
      );

      const size = 0.35 + random() * 0.75;
      dummy.position.set(x, terrainHeight(x, z) + size * 0.38, z);
      dummy.rotation.set(0, random() * Math.PI * 2, 0);
      dummy.scale.set(size * 1.2, size * 0.7, size);
      dummy.updateMatrix();
      scrub.setMatrixAt(i, dummy.matrix);
    }
    scene.add(scrub);

    const postMaterial = new THREE.MeshStandardMaterial({
      color: 0xc7b37d,
      roughness: 0.82
    });
    const postGeometry = new THREE.CylinderGeometry(0.09, 0.12, 1.7, 7);
    const posts = new THREE.InstancedMesh(postGeometry, postMaterial, 18);
    posts.castShadow = true;

    let postIndex = 0;
    for (let z = -78; z <= 78; z += 19.5) {
      const x = roadX(z);
      const dx = (roadX(z + 0.1) - roadX(z - 0.1)) / 0.2;
      const invLength = 1 / Math.sqrt(1 + dx * dx);
      const side = postIndex % 2 === 0 ? 1 : -1;
      const lateral = side * 7.1;

      dummy.position.set(
        x + invLength * lateral,
        terrainHeight(x + invLength * lateral, z - dx * invLength * lateral) + 0.82,
        z - dx * invLength * lateral
      );
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      posts.setMatrixAt(postIndex++, dummy.matrix);
    }
    posts.count = postIndex;
    scene.add(posts);

    const northGroup = new THREE.Group();
    const markerX = -96;
    const markerZ = -73;
    const markerY = terrainHeight(markerX, markerZ) + 0.15;
    northGroup.position.set(markerX, markerY, markerZ);

    const markerMaterial = new THREE.MeshStandardMaterial({
      color: 0x4a4c3e,
      roughness: 0.85
    });
    const shaft = new THREE.Mesh(
      new THREE.BoxGeometry(0.38, 0.18, 7),
      markerMaterial
    );
    shaft.position.z = -1;
    shaft.receiveShadow = true;
    northGroup.add(shaft);

    const arrow = new THREE.Mesh(
      new THREE.ConeGeometry(1.55, 4, 3),
      markerMaterial
    );
    arrow.rotation.x = -Math.PI / 2;
    arrow.rotation.z = Math.PI;
    arrow.position.z = -5.5;
    arrow.castShadow = true;
    northGroup.add(arrow);
    scene.add(northGroup);

    const boundaryGeometry = new THREE.BoxGeometry(terrainWidth, 2.2, terrainDepth);
    const boundaryMaterial = new THREE.MeshStandardMaterial({
      color: 0x4b4638,
      roughness: 1
    });
    const boundary = new THREE.Mesh(boundaryGeometry, boundaryMaterial);
    boundary.position.y = -3.2;
    boundary.receiveShadow = true;
    scene.add(boundary);

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    }
    addEventListener('resize', resize);

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
