<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claymation Snail</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f4d9bd;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5ddc5);
scene.fog = new THREE.Fog(0xf5ddc5, 13, 23);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(7.8, 4.8, 9.5);
camera.lookAt(0, 1.25, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.25, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 7;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.49;

const hemi = new THREE.HemisphereLight(0xfff1dc, 0x8e7068, 2.2);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffd7b0, 4.6);
keyLight.position.set(5, 9, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -5;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 25;
keyLight.shadow.bias = -0.0003;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xb9d7e8, 1.5);
fillLight.position.set(-6, 4, 5);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xffb88d, 35, 14, 2);
rimLight.position.set(-4, 5, -5);
scene.add(rimLight);

const clay = (color, roughness = 0.91) => new THREE.MeshStandardMaterial({
  color,
  roughness,
  metalness: 0,
  flatShading: false
});

const bodyMat = clay(0xe9a279);
const bodyDarkMat = clay(0xc9755f);
const shellMat = clay(0xf0a99f);
const spiralMat = clay(0xc96f78);
const eyeWhiteMat = clay(0xffeee0);
const pupilMat = clay(0x352b38, 0.82);
const cheekMat = clay(0xe57e7e);
const mouthMat = clay(0x753f4e);
const groundMat = clay(0xd9bda1);

let seed = 93841;
function random() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}

function sculptGeometry(geometry, strength = 0.025, dentCount = 12) {
  const position = geometry.attributes.position;
  const dents = [];
  for (let i = 0; i < dentCount; i++) {
    const direction = new THREE.Vector3(
      random() * 2 - 1,
      random() * 2 - 1,
      random() * 2 - 1
    ).normalize();
    dents.push({
      direction,
      width: 0.03 + random() * 0.06,
      depth: 0.012 + random() * 0.024
    });
  }

  const vertex = new THREE.Vector3();
  const normal = new THREE.Vector3();
  for (let i = 0; i < position.count; i++) {
    vertex.fromBufferAttribute(position, i);
    const length = vertex.length();
    if (length < 0.00001) continue;
    normal.copy(vertex).normalize();

    let offset =
      Math.sin(normal.x * 17.3 + normal.y * 9.1) * strength * 0.25 +
      Math.sin(normal.z * 22.7 - normal.y * 13.8) * strength * 0.18 +
      (random() - 0.5) * strength * 0.16;

    for (const dent of dents) {
      const distanceSquared = normal.distanceToSquared(dent.direction);
      offset -= Math.exp(-distanceSquared / dent.width) * dent.depth;
    }

    vertex.multiplyScalar((length + offset) / length);
    position.setXYZ(i, vertex.x, vertex.y, vertex.z);
  }

  position.needsUpdate = true;
  geometry.computeVertexNormals();
  return geometry;
}

function claySphere(material, scale, position, detail = 64, strength = 0.025) {
  const geometry = sculptGeometry(
    new THREE.SphereGeometry(1, detail, Math.max(24, Math.floor(detail * 0.65))),
    strength,
    15
  );
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function clayTube(points, radius, material, radialSegments = 10) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const geometry = sculptGeometry(
    new THREE.TubeGeometry(curve, Math.max(32, points.length * 8), radius, radialSegments, false),
    radius * 0.08,
    4
  );
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const snail = new THREE.Group();
snail.rotation.y = -0.08;
scene.add(snail);

const foot = claySphere(
  bodyMat,
  new THREE.Vector3(3.15, 0.49, 0.67),
  new THREE.Vector3(0, 0.49, 0),
  72,
  0.035
);
foot.rotation.z = 0.02;
snail.add(foot);

const taperedTail = new THREE.Mesh(
  sculptGeometry(new THREE.ConeGeometry(0.67, 2.3, 42, 8), 0.018, 8),
  bodyMat
);
taperedTail.position.set(-3.02, 0.53, 0);
taperedTail.rotation.z = Math.PI * 0.5;
taperedTail.scale.set(1, 1, 0.92);
taperedTail.castShadow = true;
taperedTail.receiveShadow = true;
snail.add(taperedTail);

const neck = claySphere(
  bodyMat,
  new THREE.Vector3(0.93, 1.03, 0.72),
  new THREE.Vector3(1.74, 1.01, 0),
  56,
  0.034
);
neck.rotation.z = -0.3;
snail.add(neck);

const head = claySphere(
  bodyMat,
  new THREE.Vector3(0.92, 1.0, 0.8),
  new THREE.Vector3(2.25, 1.3, 0),
  64,
  0.038
);
head.rotation.z = -0.12;
snail.add(head);

const shell = claySphere(
  shellMat,
  new THREE.Vector3(1.72, 1.68, 0.94),
  new THREE.Vector3(-0.48, 1.73, 0),
  80,
  0.046
);
shell.rotation.z = -0.055;
snail.add(shell);

const spiralPoints = [];
const spiralTurns = 3.18;
const spiralSteps = 110;
for (let i = 0; i <= spiralSteps; i++) {
  const t = i / spiralSteps;
  const angle = 0.15 + t * Math.PI * 2 * spiralTurns;
  const radius = 1.28 * (1 - t) + 0.06;
  const x = -0.48 + Math.cos(angle) * radius;
  const y = 1.73 + Math.sin(angle) * radius;
  const normalizedRadius = radius / 1.72;
  const z = 0.92 * Math.sqrt(Math.max(0.12, 1 - normalizedRadius * normalizedRadius)) + 0.025;
  spiralPoints.push(new THREE.Vector3(x, y, z));
}
const spiral = clayTube(spiralPoints, 0.105, spiralMat, 12);
snail.add(spiral);

function addFingerprint(x, y, z, scale, colorMaterial, rings = 2) {
  const mark = new THREE.Group();
  mark.position.set(x, y, z);

  const center = new THREE.Mesh(
    new THREE.SphereGeometry(scale * 0.62, 20, 12),
    colorMaterial
  );
  center.scale.z = 0.12;
  center.position.z = -scale * 0.03;
  mark.add(center);

  for (let i = 0; i < rings; i++) {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(scale * (0.72 + i * 0.34), scale * 0.055, 7, 24),
      colorMaterial
    );
    ring.scale.y = 0.75;
    ring.position.z = scale * 0.015;
    mark.add(ring);
  }
  mark.rotation.z = (random() - 0.5) * 1.2;
  snail.add(mark);
}

addFingerprint(-1.17, 2.58, 0.75, 0.15, spiralMat, 2);
addFingerprint(0.36, 2.36, 0.82, 0.12, spiralMat, 2);
addFingerprint(-1.47, 1.25, 0.72, 0.13, spiralMat, 1);
addFingerprint(0.55, 1.33, 0.78, 0.1, spiralMat, 1);
addFingerprint(2.38, 0.88, 0.73, 0.08, bodyDarkMat, 1);
addFingerprint(1.12, 0.48, 0.65, 0.09, bodyDarkMat, 1);

const stalkBackPoints = [
  new THREE.Vector3(2.15, 1.91, -0.34),
  new THREE.Vector3(2.18, 2.32, -0.4),
  new THREE.Vector3(2.05, 2.71, -0.44),
  new THREE.Vector3(2.23, 2.98, -0.42),
  new THREE.Vector3(2.48, 2.91, -0.4)
];
const stalkFrontPoints = [
  new THREE.Vector3(2.55, 1.87, 0.35),
  new THREE.Vector3(2.76, 2.28, 0.42),
  new THREE.Vector3(2.82, 2.72, 0.46),
  new THREE.Vector3(3.08, 2.92, 0.47),
  new THREE.Vector3(3.28, 2.75, 0.46)
];

snail.add(clayTube(stalkBackPoints, 0.105, bodyMat, 10));
snail.add(clayTube(stalkFrontPoints, 0.11, bodyMat, 10));

function addEye(position, scale, tilt) {
  const eye = new THREE.Group();
  eye.position.copy(position);
  eye.rotation.z = tilt;

  const white = claySphere(
    eyeWhiteMat,
    new THREE.Vector3(scale, scale * 1.04, scale * 0.92),
    new THREE.Vector3(0, 0, 0),
    36,
    0.018
  );
  eye.add(white);

  const pupil = claySphere(
    pupilMat,
    new THREE.Vector3(scale * 0.47, scale * 0.52, scale * 0.25),
    new THREE.Vector3(0.09 * scale, -0.02 * scale, scale * 0.85),
    28,
    0.01
  );
  eye.add(pupil);

  const glint = claySphere(
    eyeWhiteMat,
    new THREE.Vector3(scale * 0.105, scale * 0.105, scale * 0.06),
    new THREE.Vector3(-0.04 * scale, 0.17 * scale, scale * 1.08),
    18,
    0.004
  );
  eye.add(glint);
  snail.add(eye);
}

addEye(new THREE.Vector3(2.49, 2.92, -0.4), 0.31, -0.14);
addEye(new THREE.Vector3(3.29, 2.76, 0.46), 0.33, 0.13);

const cheekA = claySphere(
  cheekMat,
  new THREE.Vector3(0.19, 0.13, 0.045),
  new THREE.Vector3(2.66, 1.28, 0.79),
  28,
  0.008
);
snail.add(cheekA);

const cheekB = claySphere(
  cheekMat,
  new THREE.Vector3(0.16, 0.11, 0.04),
  new THREE.Vector3(1.89, 1.27, 0.73),
  28,
  0.008
);
snail.add(cheekB);

const smilePoints = [
  new THREE.Vector3(2.07, 1.08, 0.805),
  new THREE.Vector3(2.24, 0.97, 0.855),
  new THREE.Vector3(2.43, 1.02, 0.85),
  new THREE.Vector3(2.56, 1.13, 0.81)
];
const smile = clayTube(smilePoints, 0.036, mouthMat, 8);
snail.add(smile);

const feelerNubs = [
  [1.63, 0.68, 0.52, 0.08],
  [0.82, 0.38, 0.58, 0.065],
  [-2.18, 0.33, 0.48, 0.06]
];
for (const nub of feelerNubs) {
  const spot = claySphere(
    bodyDarkMat,
    new THREE.Vector3(nub[3], nub[3] * 0.7, nub[3] * 0.22),
    new THREE.Vector3(nub[0], nub[1], nub[2]),
    20,
    0.006
  );
  snail.add(spot);
}

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(7, 96),
  groundMat
);
ground.rotation.x = -Math.PI * 0.5;
ground.position.y = -0.035;
ground.receiveShadow = true;
scene.add(ground);

const groundRim = new THREE.Mesh(
  new THREE.CylinderGeometry(7, 7.15, 0.18, 96),
  clay(0xcfae91)
);
groundRim.position.y = -0.13;
groundRim.receiveShadow = true;
scene.add(groundRim);

const shadowBlob = new THREE.Mesh(
  new THREE.CircleGeometry(2.75, 64),
  new THREE.MeshBasicMaterial({
    color: 0x765a58,
    transparent: true,
    opacity: 0.1,
    depthWrite: false
  })
);
shadowBlob.rotation.x = -Math.PI * 0.5;
shadowBlob.scale.set(1.35, 0.55, 1);
shadowBlob.position.set(-0.1, 0.004, 0);
scene.add(shadowBlob);

snail.traverse((object) => {
  if (object.isMesh) {
    object.castShadow = true;
    object.receiveShadow = true;
  }
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  snail.position.y = Math.sin(elapsed * 1.7) * 0.018;
  head.rotation.z = -0.12 + Math.sin(elapsed * 1.35) * 0.018;

  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
