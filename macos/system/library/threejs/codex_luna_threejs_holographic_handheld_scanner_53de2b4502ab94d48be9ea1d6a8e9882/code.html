<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holographic Handheld Scanner</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030513}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030513);
scene.fog = new THREE.FogExp2(0x030513, 0.045);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.2, 3.4, 6.4);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.target.set(0, 0.7, 0.25);
controls.minDistance = 3.8;
controls.maxDistance = 10;

const ambient = new THREE.HemisphereLight(0x5b73ff, 0x08030f, 1.5);
scene.add(ambient);

const keyLight = new THREE.PointLight(0x2bdcff, 13, 9, 2);
keyLight.position.set(3, 3.8, 3.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024,1024);
scene.add(keyLight);

const magentaLight = new THREE.PointLight(0xff1fbf, 11, 7, 2);
magentaLight.position.set(-3, 1.5, 1.5);
scene.add(magentaLight);

const goldLight = new THREE.PointLight(0xffb52e, 7, 6, 2);
goldLight.position.set(0, -1.5, 2.5);
scene.add(goldLight);

const scanner = new THREE.Group();
scanner.rotation.y = -0.2;
scene.add(scanner);

const chassisMaterial = new THREE.MeshPhysicalMaterial({
  color:0x8b1c9d,
  metalness:0.72,
  roughness:0.2,
  iridescence:1,
  iridescenceIOR:1.75,
  iridescenceThicknessRange:[120,620],
  clearcoat:1,
  clearcoatRoughness:0.12,
  emissive:0x21062c,
  emissiveIntensity:0.5
});

const darkMaterial = new THREE.MeshStandardMaterial({
  color:0x080d24,
  metalness:0.9,
  roughness:0.22,
  emissive:0x07102e,
  emissiveIntensity:0.55
});

const cyanMaterial = new THREE.MeshStandardMaterial({
  color:0x39eaff,
  emissive:0x24dfff,
  emissiveIntensity:5,
  metalness:0.2,
  roughness:0.18
});

const goldMaterial = new THREE.MeshStandardMaterial({
  color:0xffbe35,
  emissive:0xff8e17,
  emissiveIntensity:4,
  metalness:0.45,
  roughness:0.2
});

function addMesh(geometry, material, position, rotation, parent, castShadow=true) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(position[0], position[1], position[2]);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = castShadow;
  mesh.receiveShadow = castShadow;
  parent.add(mesh);
  return mesh;
}

function addEdges(mesh, color, opacity=0.8) {
  const edgeGeometry = new THREE.EdgesGeometry(mesh.geometry, 22);
  const edgeMaterial = new THREE.LineBasicMaterial({color, transparent:true, opacity});
  const edges = new THREE.LineSegments(edgeGeometry, edgeMaterial);
  mesh.add(edges);
  return edges;
}

const body = addMesh(new THREE.BoxGeometry(2.65, 0.88, 1.5), chassisMaterial, [0,0.75,0], [0,0,0], scanner);
addEdges(body, 0xff8cf4, 0.7);

const upperShell = addMesh(new THREE.BoxGeometry(1.85, 0.24, 1.18), darkMaterial, [-0.15,1.29,0.03], [0,0,0], scanner);
addEdges(upperShell, 0x3ceaff, 0.9);

const rearSpine = addMesh(new THREE.BoxGeometry(0.34, 0.7, 1.18), darkMaterial, [-1.12,0.78,0], [0,0,0], scanner);
addEdges(rearSpine, 0xd247ff, 0.7);

const grip = addMesh(new THREE.BoxGeometry(0.62, 1.78, 0.72), chassisMaterial, [0,-0.45,-0.05], [0,0,-0.16], scanner);
addEdges(grip, 0xffb0f8, 0.65);

const gripCore = addMesh(new THREE.BoxGeometry(0.38, 1.38, 0.78), darkMaterial, [0,-0.44,0.01], [0,0,-0.16], scanner);
addEdges(gripCore, 0x23e8ff, 0.55);

const gripBase = addMesh(new THREE.CylinderGeometry(0.43,0.52,0.18,8), darkMaterial, [0,-1.37,-0.06], [0,0,-0.16], scanner);
addEdges(gripBase, 0xff4dd9, 0.8);

for(let index=0; index<5; index++){
  const groove = addMesh(new THREE.BoxGeometry(0.5,0.035,0.77), cyanMaterial, [0,-0.98 + index*0.23,0.025], [0,0,-0.16], scanner, false);
  groove.material = cyanMaterial;
}

const emitterHousing = addMesh(new THREE.CylinderGeometry(0.48,0.48,0.38,32), darkMaterial, [0,0.83,0.86], [Math.PI/2,0,0], scanner);
const emitterRing = addMesh(new THREE.TorusGeometry(0.45,0.055,12,48), cyanMaterial, [0,0.83,1.07], [Math.PI/2,0,0], scanner, false);
const emitterGlass = addMesh(new THREE.CylinderGeometry(0.34,0.34,0.04,32), new THREE.MeshBasicMaterial({color:0x8fffff,transparent:true,opacity:0.8}), [0,0.83,1.27], [Math.PI/2,0,0], scanner, false);

for(let dotIndex=0; dotIndex<4; dotIndex++){
  const dot = addMesh(new THREE.SphereGeometry(0.065,16,12), dotIndex%2===0 ? cyanMaterial : goldMaterial, [-0.7 + dotIndex*0.45,1.34,0.62], [0,0,0], scanner, false);
  dot.scale.set(1,1,0.45);
}

const sidePanel = addMesh(new THREE.BoxGeometry(0.11,0.5,0.76), goldMaterial, [1.34,0.77,0.02], [0,0,0], scanner, false);
const sidePanel2 = addMesh(new THREE.BoxGeometry(0.07,0.3,0.55), cyanMaterial, [-1.34,0.77,0.02], [0,0,0], scanner, false);

const holoVertex = `
  varying vec2 vUv;
  void main(){
    vUv=uv;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
  }
`;

const holoFragment = `
  uniform float uTime;
  uniform float uSeed;
  varying vec2 vUv;
  vec3 hue(float h){
    return 0.5+0.5*cos(6.28318*(h+vec3(0.0,0.33,0.67)));
  }
  void main(){
    float edge=smoothstep(0.0,0.18,vUv.x)*smoothstep(1.0,0.82,vUv.x);
    float vertical=smoothstep(0.0,0.16,vUv.y);
    float scan=0.52+0.48*sin(vUv.y*58.0-uTime*5.0+uSeed*8.0);
    float rays=0.72+0.28*sin(vUv.x*25.0+uTime*2.0+uSeed);
    float alpha=edge*vertical*(0.18+0.34*scan)*rays;
    vec3 color=hue(0.56+vUv.x*0.36+uTime*0.035+uSeed*0.15);
    gl_FragColor=vec4(color,alpha);
  }
`;

function createHoloPlane(width, height, seed, position, rotation, scale) {
  const holoMaterial = new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0},uSeed:{value:seed}},
    vertexShader:holoVertex,
    fragmentShader:holoFragment,
    transparent:true,
    depthWrite:false,
    blending:THREE.AdditiveBlending,
    side:THREE.DoubleSide
  });
  const holoPlane = new THREE.Mesh(new THREE.PlaneGeometry(width,height,1,32), holoMaterial);
  holoPlane.position.set(position[0],position[1],position[2]);
  holoPlane.rotation.set(rotation[0],rotation[1],rotation[2]);
  holoPlane.scale.set(scale[0],scale[1],scale[2]);
  holoPlane.userData.shader=holoMaterial;
  scanner.add(holoPlane);
  return holoPlane;
}

const fanA = createHoloPlane(2.9,2.65,0.2,[0,2.02,0.98],[0,0,0],[1,1,1]);
const fanB = createHoloPlane(2.9,2.65,0.8,[0,2.02,0.98],[0,0.18,0],[0.8,1,1]);
const fanC = createHoloPlane(2.9,2.65,1.5,[0,2.02,0.98],[0,-0.18,0],[0.8,1,1]);

for(let ringIndex=0; ringIndex<4; ringIndex++){
  const ringRadius=0.48 + ringIndex*0.28;
  const ring = addMesh(new THREE.TorusGeometry(ringRadius,0.018,8,64), new THREE.MeshBasicMaterial({
    color:ringIndex%2===0?0x35f4ff:0xff48dc,
    transparent:true,
    opacity:0.65,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  }), [0,1.52 + ringIndex*0.42,1.02], [Math.PI/2,0,0], scanner, false);
  ring.scale.x=1.15;
  ring.userData.phase=ringIndex*0.8;
}

const readout = new THREE.Group();
readout.position.set(1.45,2.02,0.76);
readout.rotation.set(0,-0.16,0.06);
scanner.add(readout);

const panelMaterial = new THREE.MeshBasicMaterial({
  color:0x21dfff,
  transparent:true,
  opacity:0.12,
  blending:THREE.AdditiveBlending,
  depthWrite:false
});
const panel = addMesh(new THREE.BoxGeometry(1.3,0.82,0.025), panelMaterial, [0,0,0], [0,0,0], readout, false);
addEdges(panel,0x5df6ff,0.9);

function addReadoutBar(x,y,w,h,color) {
  const barMaterial = new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.78,blending:THREE.AdditiveBlending});
  return addMesh(new THREE.BoxGeometry(w,h,0.035),barMaterial,[x,y,0.035],[0,0,0],readout,false);
}

addReadoutBar(-0.31,0.27,0.54,0.045,0xff66ed);
addReadoutBar(-0.31,0.16,0.86,0.025,0x43ecff);
addReadoutBar(-0.31,0.08,0.68,0.025,0x43ecff);
addReadoutBar(-0.31,-0.04,0.92,0.025,0xffc23f);
addReadoutBar(-0.31,-0.14,0.48,0.025,0x43ecff);
addReadoutBar(-0.31,-0.25,0.76,0.025,0xff66ed);

const readoutRing = addMesh(new THREE.TorusGeometry(0.17,0.025,8,32), new THREE.MeshBasicMaterial({color:0xffbe45,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending}), [0.38,0.18,0.06], [0,0,0], readout, false);
const readoutDot = addMesh(new THREE.SphereGeometry(0.055,12,8), cyanMaterial, [0.38,0.18,0.07], [0,0,0], readout, false);

const floorMaterial = new THREE.MeshStandardMaterial({color:0x05091a,metalness:0.5,roughness:0.42});
const floor = addMesh(new THREE.CircleGeometry(8,64),floorMaterial,[0,-1.52,0],[ -Math.PI/2,0,0],scene,false);
floor.receiveShadow=true;

const gridMaterial = new THREE.LineBasicMaterial({color:0x14265c,transparent:true,opacity:0.35});
for(let gridIndex=-8; gridIndex<=8; gridIndex++){
  const gridPointsA=[new THREE.Vector3(-8,-1.5,gridIndex*0.5),new THREE.Vector3(8,-1.5,gridIndex*0.5)];
  const gridPointsB=[new THREE.Vector3(gridIndex*0.5,-1.5,-4),new THREE.Vector3(gridIndex*0.5,-1.5,4)];
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(gridPointsA),gridMaterial));
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(gridPointsB),gridMaterial));
}

const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const elapsed=clock.getElapsedTime();

  fanA.userData.shader.uniforms.uTime.value=elapsed;
  fanB.userData.shader.uniforms.uTime.value=elapsed;
  fanC.userData.shader.uniforms.uTime.value=elapsed;

  scanner.position.y=Math.sin(elapsed*1.4)*0.045;

  const rings=scanner.children.filter(child=>child.userData.phase!==undefined);
  rings.forEach((ringObject)=>{
    ringObject.rotation.z=elapsed*(0.18+ringObject.userData.phase*0.035);
    ringObject.material.opacity=0.42+0.22*Math.sin(elapsed*2.2+ringObject.userData.phase);
  });

  readout.position.y=2.02+Math.sin(elapsed*1.7)*0.07;
  readout.rotation.z=0.06+Math.sin(elapsed*1.3)*0.025;
  readoutRing.rotation.z=elapsed*1.6;
  readoutDot.scale.setScalar(0.8+0.25*Math.sin(elapsed*4.0));

  renderer.render(scene,camera);
}

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});

animate();
</script>
</body>
</html>
