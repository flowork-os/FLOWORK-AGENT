<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Cavern Lake</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050712;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#caption {
  position: fixed;
  left: 24px;
  bottom: 20px;
  color: rgba(203, 226, 255, 0.72);
  font: 11px/1.5 Georgia, serif;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  pointer-events: none;
  text-shadow: 0 0 14px #61d9ff;
}
</style>
</head>
<body>
<div id="caption">Crystal Cavern Lake · Luminous Mineral Fantasy</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050712);
scene.fog = new THREE.FogExp2(0x081022, 0.018);

const camera = new THREE.PerspectiveCamera(
  48,
  window.innerWidth / window.innerHeight,
  0.1,
  180
);
camera.position.set(15, 8.5, 19);
camera.lookAt(0, 2.2, -3);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.22;
controls.minDistance = 9;
controls.maxDistance = 42;
controls.maxPolarAngle = Math.PI * 0.48;
controls.target.set(0, 2.7, -2.5);

const clock = new THREE.Clock();
const random = (() => {
  let seed = 0x1a2b3c4d;
  return () => {
    seed ^= seed << 13;
    seed ^= seed >>> 17;
    seed ^= seed << 5;
    return ((seed >>> 0) % 1000000) / 1000000;
  };
})();

const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
const lerp = (a, b, t) => a + (b - a) * t;

const palettes = {
  amethyst: [0x7041c7, 0xa774ff, 0x54318e, 0xd19aff],
  aqua: [0x27bfd0, 0x71f5e6, 0x2083ae, 0xb1fff2],
  rose: [0xf164c5, 0xb847a9, 0xffa4dc, 0x7a347e],
  moon: [0x82a7ff, 0xaed5ff, 0x5375c2, 0xd0e8ff]
};

const pulseLights = [];
const pulseMaterials = [];
const crystalGroups = [];
const glowWorms = [];
const rippleMeshes = [];
const reflectionMeshes = [];

function crystalGeometry(radius, height, sides = 6) {
  const positions = [];
  const indices = [];
  const shoulderY = height * 0.68;
  const shoulderRadius = radius * 0.82;

  for (let ring = 0; ring < 2; ring++) {
    const y = ring === 0 ? 0 : shoulderY;
    const ringRadius = ring === 0 ? radius : shoulderRadius;
    for (let i = 0; i < sides; i++) {
      const angle = (i / sides) * Math.PI * 2 + Math.PI / 6;
      positions.push(
        Math.cos(angle) * ringRadius,
        y,
        Math.sin(angle) * ringRadius
      );
    }
  }

  positions.push(0, height, 0);

  for (let i = 0; i < sides; i++) {
    const next = (i + 1) % sides;
    indices.push(i, next, sides + next);
    indices.push(i, sides + next, sides + i);
    indices.push(sides + i, sides + next, sides * 2);
  }

  for (let i = 1; i < sides - 1; i++) {
    indices.push(0, i + 1, i);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(positions, 3)
  );
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function makeCrystal(radius, height, color, glow = 1.2) {
  const group = new THREE.Group();

  const shellMaterial = new THREE.MeshStandardMaterial({
    color,
    emissive: color,
    emissiveIntensity: glow,
    roughness: 0.23,
    metalness: 0.12,
    flatShading: true
  });

  const coreMaterial = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity: 0.19,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const shell = new THREE.Mesh(crystalGeometry(radius, height), shellMaterial);
  const core = new THREE.Mesh(
    crystalGeometry(radius * 0.56, height * 0.91),
    coreMaterial
  );
  core.position.y = height * 0.035;

  shell.castShadow = true;
  shell.receiveShadow = true;
  core.renderOrder = 2;

  group.add(shell, core);
  pulseMaterials.push(shellMaterial);

  return group;
}

function addCrystalCluster(x, y, z, palette, count, scale = 1) {
  const cluster = new THREE.Group();
  cluster.position.set(x, y, z);

  const baseMaterial = new THREE.MeshStandardMaterial({
    color: 0x11162c,
    roughness: 0.92,
    metalness: 0.08
  });

  const base = new THREE.Mesh(
    new THREE.DodecahedronGeometry(2.1 * scale, 1),
    baseMaterial
  );
  base.scale.set(1.35, 0.55, 1.05);
  base.position.y = -0.85 * scale;
  base.castShadow = true;
  base.receiveShadow = true;
  cluster.add(base);

  for (let i = 0; i < count; i++) {
    const angle = random() * Math.PI * 2;
    const distance = Math.sqrt(random()) * 1.55 * scale;
    const radius = lerp(0.16, 0.48, random()) * scale;
    const height = lerp(2.4, 7.7, random()) * scale;
    const color = palette[Math.floor(random() * palette.length)];
    const crystal = makeCrystal(radius, height, color, lerp(0.9, 2.0, random()));

    crystal.position.set(
      Math.cos(angle) * distance,
      -0.42 * scale + random() * 0.22,
      Math.sin(angle) * distance
    );
    crystal.rotation.y = random() * Math.PI;
    crystal.rotation.z = lerp(-0.16, 0.16, random());
    crystal.scale.x = lerp(0.82, 1.24, random());
    crystal.scale.z = lerp(0.82, 1.24, random());
    crystal.userData.phase = random() * Math.PI * 2;
    crystal.userData.baseRotation = crystal.rotation.z;
    cluster.add(crystal);

    if (i % 3 === 0) {
      const light = new THREE.PointLight(color, 2.0 * scale, 7.5 * scale, 2);
      light.position.set(
        crystal.position.x,
        crystal.position.y + height * 0.5,
        crystal.position.z
      );
      light.castShadow = i === 0;
      light.shadow.mapSize.set(512, 512);
      light.userData.phase = random() * Math.PI * 2;
      light.userData.baseIntensity = light.intensity;
      pulseLights.push(light);
      cluster.add(light);
    }
  }

  scene.add(cluster);
  crystalGroups.push(cluster);
  return cluster;
}

function addReflectionCrystal(x, z, radius, height, color, opacity = 0.24) {
  const material = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide
  });

  const reflection = new THREE.Mesh(
    crystalGeometry(radius, height),
    material
  );
  reflection.position.set(x, 0.03, z);
  reflection.scale.y = -1;
  reflection.rotation.y = random() * Math.PI;
  reflection.renderOrder = 1;
  scene.add(reflection);
  reflectionMeshes.push(reflection);
  return reflection;
}

function addRock(x, y, z, scale, color = 0x171b32) {
  const material = new THREE.MeshStandardMaterial({
    color,
    roughness: 0.9,
    metalness: 0.12
  });
  const rock = new THREE.Mesh(
    new THREE.IcosahedronGeometry(1, 1),
    material
  );
  rock.position.set(x, y, z);
  rock.scale.set(
    scale * lerp(0.75, 1.3, random()),
    scale * lerp(0.45, 0.8, random()),
    scale * lerp(0.8, 1.4, random())
  );
  rock.rotation.set(random(), random(), random());
  rock.castShadow = true;
  rock.receiveShadow = true;
  scene.add(rock);
  return rock;
}

function addShard(x, z, palette) {
  const radius = lerp(0.08, 0.2, random());
  const height = lerp(0.45, 1.7, random());
  const shard = makeCrystal(
    radius,
    height,
    palette[Math.floor(random() * palette.length)],
    lerp(0.5, 1.4, random())
  );
  shard.position.set(x, -0.85 + random() * 0.05, z);
  shard.rotation.y = random() * Math.PI;
  shard.rotation.z = lerp(-0.5, 0.5, random());
  scene.add(shard);
}

function createGradientCavern() {
  const geometry = new THREE.SphereGeometry(70, 40, 24);
  const material = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      topColor: { value: new THREE.Color(0x0f163b) },
      midColor: { value: new THREE.Color(0x080d21) },
      bottomColor: { value: new THREE.Color(0x03040b) }
    },
    vertexShader: `
      varying vec3 vLocal;
      void main() {
        vLocal = normalize(position);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 topColor;
      uniform vec3 midColor;
      uniform vec3 bottomColor;
      varying vec3 vLocal;
      void main() {
        float height = clamp(vLocal.y * 0.5 + 0.5, 0.0, 1.0);
        vec3 color = mix(bottomColor, midColor, smoothstep(0.0, 0.48, height));
        color = mix(color, topColor, smoothstep(0.46, 1.0, height));
        gl_FragColor = vec4(color, 1.0);
      }
    `
  });
  scene.add(new THREE.Mesh(geometry, material));
}

function createGround() {
  const groundMaterial = new THREE.MeshStandardMaterial({
    color: 0x0d1222,
    roughness: 0.82,
    metalness: 0.18
  });
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(58, 48, 24, 24),
    groundMaterial
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -1.05;
  ground.receiveShadow = true;
  scene.add(ground);

  for (let i = 0; i < 54; i++) {
    const x = lerp(-22, 22, random());
    const z = lerp(-15, 16, random());
    if (Math.abs(x) < 12 && Math.abs(z) < 6) continue;
    addRock(x, -0.85, z, lerp(0.16, 0.75, random()));
  }
}

function createLake() {
  const waterGeometry = new THREE.PlaneGeometry(25, 15, 80, 48);
  const waterMaterial = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: {
      time: { value: 0 },
      deepColor: { value: new THREE.Color(0x07162c) },
      cyanColor: { value: new THREE.Color(0x29bed2) }
    },
    vertexShader: `
      uniform float time;
      varying vec2 vUv;
      varying float vWave;
      void main() {
        vUv = uv;
        vec3 transformed = position;
        float waveA = sin(position.x * 1.6 + time * 0.7) * 0.035;
        float waveB = cos(position.y * 2.2 - time * 0.56) * 0.025;
        transformed.z += waveA + waveB;
        vWave = waveA + waveB;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(transformed, 1.0);
      }
    `,
    fragmentShader: `
      uniform float time;
      uniform vec3 deepColor;
      uniform vec3 cyanColor;
      varying vec2 vUv;
      varying float vWave;
      void main() {
        float bands = 0.5 + 0.5 * sin(vUv.x * 42.0 + vUv.y * 24.0 + time * 0.65);
        float edge = smoothstep(0.0, 0.15, vUv.x) *
                     smoothstep(0.0, 0.15, 1.0 - vUv.x) *
                     smoothstep(0.0, 0.13, vUv.y) *
                     smoothstep(0.0, 0.13, 1.0 - vUv.y);
        vec3 color = mix(deepColor, cyanColor, bands * 0.11 + edge * 0.12);
        float alpha = 0.9 + vWave * 0.3;
        gl_FragColor = vec4(color, alpha);
      }
    `
  });

  const lake = new THREE.Mesh(waterGeometry, waterMaterial);
  lake.rotation.x = -Math.PI / 2;
  lake.position.set(0, -0.55, 2.0);
  lake.renderOrder = 0;
  scene.add(lake);
  lake.userData.material = waterMaterial;

  const rimMaterial = new THREE.MeshBasicMaterial({
    color: 0x3de7ef,
    transparent: true,
    opacity: 0.18,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  for (let i = 0; i < 5; i++) {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(1.6 + i * 1.7, 1.64 + i * 1.7, 96),
      rimMaterial.clone()
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(
      lerp(-2, 2, random()),
      -0.505,
      lerp(0.8, 3.2, random())
    );
    ring.scale.set(1.0, 0.55, 1.0);
    ring.userData.phase = random() * Math.PI * 2;
    ring.userData.baseOpacity = ring.material.opacity;
    scene.add(ring);
    rippleMeshes.push(ring);
  }

  for (let i = 0; i < 18; i++) {
    const x = lerp(-11, 11, random());
    const z = lerp(-3.9, 8.9, random());
    const color = i % 2 === 0 ? 0x3de7ef : 0x785bff;
    addReflectionCrystal(
      x,
      z,
      lerp(0.08, 0.28, random()),
      lerp(0.8, 3.2, random()),
      color,
      lerp(0.08, 0.22, random())
    );
  }
}

function createBridge() {
  const bridge = new THREE.Group();
  bridge.position.set(0, -0.42, 0.2);

  const supportMaterial = new THREE.MeshStandardMaterial({
    color: 0x171a31,
    roughness: 0.74,
    metalness: 0.2
  });

  for (let i = 0; i < 11; i++) {
    const t = i / 10;
    const x = lerp(-6.2, 6.2, t);
    const arch = 0.46 + Math.sin(t * Math.PI) * 1.12;
    const stone = new THREE.Mesh(
      new THREE.DodecahedronGeometry(1, 1),
      supportMaterial
    );
    stone.position.set(x, arch - 0.48, 0.15);
    stone.scale.set(1.06, 0.44, 1.62);
    stone.rotation.y = random() * Math.PI;
    stone.castShadow = true;
    stone.receiveShadow = true;
    bridge.add(stone);

    const crystalColor = i % 3 === 0 ? 0x52dce4 : i % 3 === 1 ? 0x8a5cff : 0xc57bff;
    const crystal = makeCrystal(0.38, 1.55, crystalColor, 1.1);
    crystal.position.set(x, arch - 0.02, 0.12);
    crystal.scale.set(1.4, 0.74, 1.95);
    crystal.rotation.z = lerp(-0.11, 0.11, t);
    crystal.rotation.y = random() * 0.5;
    crystal.userData.phase = random() * Math.PI * 2;
    bridge.add(crystal);
  }

  const railMaterial = new THREE.MeshBasicMaterial({
    color: 0x49dfe5,
    transparent: true,
    opacity: 0.28,
    blending: THREE.AdditiveBlending
  });

  const railPoints = [];
  for (let i = 0; i < 11; i++) {
    const t = i / 10;
    railPoints.push(
      new THREE.Vector3(
        lerp(-6.2, 6.2, t),
        0.42 + Math.sin(t * Math.PI) * 1.12,
        -1.45
      )
    );
  }
  const rail = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(railPoints),
    railMaterial
  );
  bridge.add(rail);

  scene.add(bridge);
  crystalGroups.push(bridge);
}

function createStalactites() {
  const stalactiteMaterial = new THREE.MeshStandardMaterial({
    color: 0x161b37,
    roughness: 0.7,
    metalness: 0.23,
    emissive: 0x0c1230,
    emissiveIntensity: 0.35
  });

  for (let i = 0; i < 30; i++) {
    const angle = random() * Math.PI * 2;
    const radius = lerp(9, 21, random());
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius - 1;
    const height = lerp(1.2, 5.1, random());
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(
        lerp(0.25, 0.82, random()),
        height,
        7,
        2
      ),
      stalactiteMaterial.clone()
    );
    cone.position.set(x, 12.5 - height * 0.5, z);
    cone.rotation.y = random() * Math.PI;
    cone.castShadow = true;
    cone.receiveShadow = true;
    scene.add(cone);

    if (i % 5 === 0) {
      const tinyLight = new THREE.PointLight(0x6b83ff, 0.45, 5, 2);
      tinyLight.position.set(x, cone.position.y - height * 0.7, z);
      scene.add(tinyLight);
    }
  }
}

function createGlowworms() {
  const wormMaterial = new THREE.MeshBasicMaterial({
    color: 0x9efff1,
    transparent: true,
    opacity: 0.95,
    blending: THREE.AdditiveBlending
  });

  const points = [];

  for (let i = 0; i < 42; i++) {
    const x = lerp(-17, 17, random());
    const z = lerp(-15, 10, random());
    const y = lerp(9.4, 12.1, random());
    const worm = new THREE.Mesh(
      new THREE.SphereGeometry(lerp(0.045, 0.105, random()), 8, 8),
      wormMaterial.clone()
    );
    worm.position.set(x, y, z);
    worm.userData.baseY = y;
    worm.userData.phase = random() * Math.PI * 2;
    worm.userData.speed = lerp(0.5, 1.5, random());
    worm.userData.baseOpacity = worm.material.opacity;
    scene.add(worm);
    glowWorms.push(worm);
    points.push(worm.position.clone());

    if (i % 7 === 0) {
      const glow = new THREE.PointLight(0x5effd9, 0.38, 2.8, 2);
      glow.position.copy(worm.position);
      glow.userData.parentWorm = worm;
      scene.add(glow);
    }
  }

  const constellationMaterial = new THREE.LineBasicMaterial({
    color: 0x4accc8,
    transparent: true,
    opacity: 0.11,
    blending: THREE.AdditiveBlending
  });

  for (let i = 0; i < points.length - 1; i += 3) {
    const linePoints = [points[i], points[Math.min(i + 1, points.length - 1)]];
    const line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(linePoints),
      constellationMaterial
    );
    scene.add(line);
  }
}

function createCaveColumns() {
  const columnMaterial = new THREE.MeshStandardMaterial({
    color: 0x10162c,
    roughness: 0.78,
    metalness: 0.14
  });

  const locations = [
    [-14, -8, 5.5],
    [14, -10, 6.1],
    [-17, 3, 4.8],
    [17, 2, 5.3]
  ];

  for (const location of locations) {
    const [x, z, height] = location;
    const column = new THREE.Mesh(
      new THREE.CylinderGeometry(1.0, 1.35, height, 8, 2),
      columnMaterial
    );
    column.position.set(x, height * 0.5 - 0.9, z);
    column.rotation.y = random() * Math.PI;
    column.castShadow = true;
    column.receiveShadow = true;
    scene.add(column);

    const cap = new THREE.Mesh(
      new THREE.DodecahedronGeometry(1.5, 1),
      columnMaterial
    );
    cap.position.set(x, height - 1.0, z);
    cap.scale.set(1.2, 0.46, 1.15);
    cap.castShadow = true;
    scene.add(cap);
  }
}

function createAmbientMinerals() {
  for (let i = 0; i < 38; i++) {
    const x = lerp(-19, 19, random());
    const z = lerp(-13, 14, random());
    if (Math.abs(x) < 11 && z > -3 && z < 9) continue;
    const palette = i % 2 === 0 ? palettes.amethyst : palettes.aqua;
    addShard(x, z, palette);
  }
}

function createMist() {
  const mistMaterial = new THREE.MeshBasicMaterial({
    color: 0x63d4dc,
    transparent: true,
    opacity: 0.035,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide
  });

  for (let i = 0; i < 7; i++) {
    const mist = new THREE.Mesh(
      new THREE.PlaneGeometry(8 + random() * 6, 2.5 + random() * 2),
      mistMaterial.clone()
    );
    mist.position.set(
      lerp(-10, 10, random()),
      lerp(-0.1, 1.4, random()),
      lerp(-1, 8, random())
    );
    mist.rotation.x = -Math.PI / 2;
    mist.rotation.z = random() * Math.PI;
    mist.userData.phase = random() * Math.PI * 2;
    mist.userData.baseOpacity = mist.material.opacity;
    scene.add(mist);
    reflectionMeshes.push(mist);
  }
}

function addLighting() {
  const hemisphere = new THREE.HemisphereLight(0x657dce, 0x050611, 0.72);
  scene.add(hemisphere);

  const moon = new THREE.DirectionalLight(0x94b8ff, 1.25);
  moon.position.set(-10, 18, 12);
  moon.castShadow = true;
  moon.shadow.mapSize.set(2048, 2048);
  moon.shadow.camera.left = -24;
  moon.shadow.camera.right = 24;
  moon.shadow.camera.top = 24;
  moon.shadow.camera.bottom = -24;
  moon.shadow.camera.near = 1;
  moon.shadow.camera.far = 55;
  scene.add(moon);

  const aquaGlow = new THREE.PointLight(0x22d7dc, 3.6, 19, 2);
  aquaGlow.position.set(-3, 1.7, 2);
  aquaGlow.castShadow = true;
  aquaGlow.shadow.mapSize.set(1024, 1024);
  aquaGlow.userData.phase = 0.4;
  aquaGlow.userData.baseIntensity = aquaGlow.intensity;
  pulseLights.push(aquaGlow);
  scene.add(aquaGlow);

  const violetGlow = new THREE.PointLight(0x934dff, 4.2, 22, 2);
  violetGlow.position.set(8, 3.4, -7);
  violetGlow.castShadow = true;
  violetGlow.shadow.mapSize.set(1024, 1024);
  violetGlow.userData.phase = 2.2;
  violetGlow.userData.baseIntensity = violetGlow.intensity;
  pulseLights.push(violetGlow);
  scene.add(violetGlow);

  const roseGlow = new THREE.PointLight(0xff4bd5, 2.8, 15, 2);
  roseGlow.position.set(-10, 2.4, -8);
  roseGlow.userData.phase = 3.5;
  roseGlow.userData.baseIntensity = roseGlow.intensity;
  pulseLights.push(roseGlow);
  scene.add(roseGlow);
}

createGradientCavern();
createGround();
createLake();
createCaveColumns();
createStalactites();
createBridge();

addCrystalCluster(-9.4, -0.82, -6.8, palettes.amethyst, 13, 1.22);
addCrystalCluster(8.7, -0.82, -8.6, palettes.aqua, 15, 1.28);
addCrystalCluster(-15.2, -0.82, 1.8, palettes.rose, 9, 0.86);
addCrystalCluster(14.5, -0.82, 2.1, palettes.moon, 11, 0.94);
addCrystalCluster(0, -0.82, -12.2, palettes.amethyst, 12, 0.92);

createAmbientMinerals();
createGlowworms();
createMist();
addLighting();

const beaconGeometry = new THREE.OctahedronGeometry(0.55, 1);
const beaconMaterials = [
  new THREE.MeshBasicMaterial({
    color: 0x7fffee,
    transparent: true,
    opacity: 0.7,
    blending: THREE.AdditiveBlending
  }),
  new THREE.MeshBasicMaterial({
    color: 0xb177ff,
    transparent: true,
    opacity: 0.7,
    blending: THREE.AdditiveBlending
  })
];

for (let i = 0; i < 8; i++) {
  const beacon = new THREE.Mesh(
    beaconGeometry,
    beaconMaterials[i % 2].clone()
  );
  beacon.position.set(
    lerp(-10, 10, random()),
    lerp(0.4, 1.5, random()),
    lerp(-4, 7, random())
  );
  beacon.scale.setScalar(lerp(0.45, 1.1, random()));
  beacon.userData.phase = random() * Math.PI * 2;
  beacon.userData.baseY = beacon.position.y;
  beacon.userData.baseOpacity = beacon.material.opacity;
  scene.add(beacon);
  crystalGroups.push(beacon);

  const beaconLight = new THREE.PointLight(
    i % 2 === 0 ? 0x43e6dc : 0x9d63ff,
    0.8,
    4.5,
    2
  );
  beaconLight.position.copy(beacon.position);
  scene.add(beaconLight);
}

const lakePlane = scene.children.find(
  object => object.userData && object.userData.material
);
const lakeShaderMaterial = lakePlane ? lakePlane.userData.material : null;

function animate() {
  requestAnimationFrame(animate);

  const elapsed = clock.getElapsedTime();
  const hueShift = (Math.sin(elapsed * 0.075) + 1) * 0.5;

  if (lakeShaderMaterial) {
    lakeShaderMaterial.uniforms.time.value = elapsed;
    lakeShaderMaterial.uniforms.cyanColor.value.setHSL(
      lerp(0.48, 0.57, hueShift),
      0.72,
      0.52
    );
  }

  for (let i = 0; i < pulseLights.length; i++) {
    const light = pulseLights[i];
    const phase = light.userData.phase || 0;
    const rhythm = 0.78 + Math.sin(elapsed * 1.35 + phase) * 0.16;
    light.intensity = (light.userData.baseIntensity || 1) * rhythm;
    const color = new THREE.Color();
    color.setHSL(
      (light.color.getHSL({}).h + hueShift * 0.035) % 1,
      0.75,
      0.58
    );
    light.color.lerp(color, 0.035);
  }

  for (let i = 0; i < pulseMaterials.length; i++) {
    const material = pulseMaterials[i];
    const base = material.emissiveIntensity;
    material.emissiveIntensity = base * (0.94 + Math.sin(elapsed * 1.2 + i) * 0.08);
  }

  for (let i = 0; i < glowWorms.length; i++) {
    const worm = glowWorms[i];
    const phase = worm.userData.phase;
    const wave = Math.sin(elapsed * worm.userData.speed + phase);
    worm.position.y = worm.userData.baseY + wave * 0.07;
    worm.material.opacity =
      worm.userData.baseOpacity * (0.58 + 0.42 * (0.5 + wave * 0.5));
    worm.scale.setScalar(0.82 + 0.22 * (0.5 + wave * 0.5));
  }

  for (let i = 0; i < rippleMeshes.length; i++) {
    const ring = rippleMeshes[i];
    const phase = ring.userData.phase;
    const wave = 0.5 + 0.5 * Math.sin(elapsed * 0.74 + phase);
    ring.scale.x = 0.92 + wave * 0.18;
    ring.scale.y = 0.5 + wave * 0.12;
    ring.material.opacity = ring.userData.baseOpacity * (0.55 + wave * 0.65);
  }

  for (let i = 0; i < crystalGroups.length; i++) {
    const object = crystalGroups[i];
    if (object.userData && object.userData.baseY !== undefined) {
      const wave = Math.sin(elapsed * 1.1 + object.userData.phase);
      object.position.y = object.userData.baseY + wave * 0.035;
      object.rotation.y += 0.0015;
    } else if (object.isGroup && object.position.z < 0) {
      object.rotation.y += 0.00045;
      object.position.y += Math.sin(elapsed * 0.4 + i) * 0.00025;
    }
  }

  for (let i = 0; i < reflectionMeshes.length; i++) {
    const reflection = reflectionMeshes[i];
    if (reflection.userData.baseOpacity !== undefined) {
      const shimmer = 0.8 + 0.2 * Math.sin(elapsed * 0.72 + i);
      reflection.material.opacity = reflection.userData.baseOpacity * shimmer;
      reflection.position.x += Math.sin(elapsed * 0.17 + i) * 0.0007;
    }
  }

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
