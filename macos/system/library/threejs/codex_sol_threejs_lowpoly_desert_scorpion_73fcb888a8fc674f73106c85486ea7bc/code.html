<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low Poly Scorpion</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #18150f; }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1812);
scene.fog = new THREE.Fog(0x1b1812, 14, 27);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(9.5, 6.7, 11.5);
camera.lookAt(0, 1.45, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.35, -0.05);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.72;
controls.minDistance = 8;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.48;

const palette = [
  new THREE.MeshStandardMaterial({ color: 0xc95825, roughness: 0.86, metalness: 0.02, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0xe17a32, roughness: 0.88, metalness: 0.01, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0xa93c1c, roughness: 0.9, metalness: 0.01, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0xe8ad64, roughness: 0.9, metalness: 0.0, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0xb96c35, roughness: 0.9, metalness: 0.01, flatShading: true }),
  new THREE.MeshStandardMaterial({ color: 0xf0c17a, roughness: 0.92, metalness: 0.0, flatShading: true })
];

const darkMaterial = new THREE.MeshStandardMaterial({
  color: 0x24140e,
  roughness: 0.62,
  metalness: 0.08,
  flatShading: true
});

const scorpion = new THREE.Group();
scorpion.rotation.y = 0;
scene.add(scorpion);

function prepareMesh(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function facetedMesh(geometry, scale, position, materialOffset = 0) {
  geometry.scale(scale.x, scale.y, scale.z);
  geometry = geometry.toNonIndexed();
  geometry.computeVertexNormals();
  geometry.clearGroups();

  const triangleCount = geometry.attributes.position.count / 3;
  for (let i = 0; i < triangleCount; i++) {
    const materialIndex = (i * 7 + Math.floor(i / 3) + materialOffset) % palette.length;
    geometry.addGroup(i * 3, 3, materialIndex);
  }

  const mesh = new THREE.Mesh(geometry, palette);
  mesh.position.copy(position);
  return prepareMesh(mesh);
}

function prismBetween(start, end, startRadius, endRadius, material, radialSegments = 5) {
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(endRadius, startRadius, length, radialSegments, 1, false);
  geometry.computeVertexNormals();

  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  return prepareMesh(mesh);
}

function joint(position, radius, material, detail = 0) {
  const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(radius, detail), material);
  mesh.position.copy(position);
  return prepareMesh(mesh);
}

const carapace = facetedMesh(
  new THREE.IcosahedronGeometry(1, 2),
  new THREE.Vector3(1.48, 0.56, 1.72),
  new THREE.Vector3(0, 0.88, -0.12),
  1
);
carapace.rotation.y = Math.PI / 10;
scorpion.add(carapace);

const frontShield = facetedMesh(
  new THREE.IcosahedronGeometry(1, 1),
  new THREE.Vector3(1.28, 0.48, 0.82),
  new THREE.Vector3(0, 0.92, -1.25),
  4
);
frontShield.rotation.y = -Math.PI / 12;
scorpion.add(frontShield);

const abdomenData = [
  { z: 1.12, y: 0.86, sx: 1.12, sy: 0.43, sz: 0.58 },
  { z: 1.66, y: 0.91, sx: 0.98, sy: 0.40, sz: 0.51 },
  { z: 2.10, y: 1.00, sx: 0.82, sy: 0.37, sz: 0.43 }
];

abdomenData.forEach((segment, index) => {
  const mesh = facetedMesh(
    new THREE.IcosahedronGeometry(1, 1),
    new THREE.Vector3(segment.sx, segment.sy, segment.sz),
    new THREE.Vector3(0, segment.y, segment.z),
    index + 2
  );
  mesh.rotation.y = index % 2 === 0 ? 0.08 : -0.08;
  scorpion.add(mesh);
});

const eyeGeometry = new THREE.IcosahedronGeometry(0.105, 1);
[-1, 1].forEach((side) => {
  const eye = new THREE.Mesh(eyeGeometry, darkMaterial);
  eye.position.set(side * 0.38, 1.35, -1.70);
  eye.scale.set(1, 0.7, 1);
  scorpion.add(prepareMesh(eye));
});

const legMaterialOrder = [palette[2], palette[0], palette[4], palette[1]];
const legAnchors = [-1.12, -0.43, 0.35, 1.02];

[-1, 1].forEach((side) => {
  legAnchors.forEach((anchorZ, index) => {
    const forwardSweep = (index - 1.5) * 0.31;
    const hip = new THREE.Vector3(side * (1.05 + index * 0.05), 0.79, anchorZ);
    const knee = new THREE.Vector3(
      side * (1.78 + index * 0.14),
      0.54 - index * 0.025,
      anchorZ + forwardSweep
    );
    const ankle = new THREE.Vector3(
      side * (2.62 + index * 0.25),
      0.16,
      anchorZ + forwardSweep * 2.15
    );
    const foot = new THREE.Vector3(
      side * (3.05 + index * 0.26),
      0.095,
      anchorZ + forwardSweep * 2.55 - 0.18
    );

    const material = legMaterialOrder[index];
    scorpion.add(prismBetween(hip, knee, 0.19, 0.16, material, 4));
    scorpion.add(joint(knee, 0.205, palette[(index + 1) % palette.length], 0));
    scorpion.add(prismBetween(knee, ankle, 0.16, 0.105, material, 4));
    scorpion.add(prismBetween(ankle, foot, 0.105, 0.065, palette[(index + 3) % palette.length], 4));
  });
});

[-1, 1].forEach((side) => {
  const shoulder = new THREE.Vector3(side * 0.90, 0.94, -1.35);
  const elbow = new THREE.Vector3(side * 1.50, 0.82, -1.92);
  const wrist = new THREE.Vector3(side * 2.05, 0.75, -2.17);

  scorpion.add(prismBetween(shoulder, elbow, 0.27, 0.22, palette[2], 5));
  scorpion.add(joint(elbow, 0.29, palette[1], 0));
  scorpion.add(prismBetween(elbow, wrist, 0.25, 0.31, palette[0], 5));

  const palm = facetedMesh(
    new THREE.IcosahedronGeometry(1, 1),
    new THREE.Vector3(0.57, 0.38, 0.66),
    wrist.clone().add(new THREE.Vector3(side * 0.13, 0.02, -0.20)),
    side > 0 ? 2 : 5
  );
  palm.rotation.y = side * 0.28;
  scorpion.add(palm);

  const outerBase = new THREE.Vector3(side * 2.27, 0.77, -2.45);
  const outerMid = new THREE.Vector3(side * 2.64, 0.80, -2.86);
  const outerTip = new THREE.Vector3(side * 2.72, 0.74, -3.34);
  const innerBase = new THREE.Vector3(side * 2.05, 0.76, -2.51);
  const innerMid = new THREE.Vector3(side * 1.77, 0.78, -2.88);
  const innerTip = new THREE.Vector3(side * 1.73, 0.72, -3.30);

  scorpion.add(prismBetween(outerBase, outerMid, 0.25, 0.18, palette[1], 5));
  scorpion.add(prismBetween(outerMid, outerTip, 0.18, 0.035, palette[3], 5));
  scorpion.add(prismBetween(innerBase, innerMid, 0.23, 0.16, palette[0], 5));
  scorpion.add(prismBetween(innerMid, innerTip, 0.16, 0.032, palette[5], 5));
});

const tailPoints = [
  new THREE.Vector3(0, 1.15, 2.25),
  new THREE.Vector3(0, 1.43, 2.88),
  new THREE.Vector3(0, 2.02, 3.28),
  new THREE.Vector3(0, 2.76, 3.31),
  new THREE.Vector3(0, 3.48, 2.94),
  new THREE.Vector3(0, 4.02, 2.26),
  new THREE.Vector3(0, 4.28, 1.43),
  new THREE.Vector3(0, 4.23, 0.59),
  new THREE.Vector3(0, 3.87, -0.12)
];

for (let i = 0; i < 8; i++) {
  const start = tailPoints[i];
  const end = tailPoints[i + 1];
  const startRadius = 0.43 - i * 0.027;
  const endRadius = startRadius - 0.055;
  const material = palette[(i * 2 + 1) % palette.length];

  scorpion.add(prismBetween(start, end, startRadius, endRadius, material, 6));
  if (i < 7) {
    scorpion.add(joint(end, Math.max(endRadius * 1.12, 0.19), palette[(i + 4) % palette.length], 1));
  }
}

const stingerBase = tailPoints[8];
const stingerBulb = facetedMesh(
  new THREE.IcosahedronGeometry(1, 1),
  new THREE.Vector3(0.31, 0.29, 0.40),
  stingerBase.clone().add(new THREE.Vector3(0, -0.04, -0.13)),
  3
);
stingerBulb.rotation.x = -0.35;
scorpion.add(stingerBulb);

const stingerTip = new THREE.Vector3(0, 3.18, -0.96);
const stingerDirection = new THREE.Vector3().subVectors(stingerTip, stingerBase);
const stingerLength = stingerDirection.length();
const stingerGeometry = new THREE.ConeGeometry(0.235, stingerLength, 5, 1, false);
const stinger = new THREE.Mesh(stingerGeometry, darkMaterial);
stinger.position.copy(stingerBase).add(stingerTip).multiplyScalar(0.5);
stinger.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), stingerDirection.normalize());
scorpion.add(prepareMesh(stinger));

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x3b3020,
  roughness: 1,
  metalness: 0
});
const ground = new THREE.Mesh(new THREE.CircleGeometry(10.5, 64), groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

const innerGround = new THREE.Mesh(
  new THREE.CircleGeometry(5.2, 12),
  new THREE.MeshStandardMaterial({
    color: 0x554128,
    roughness: 1,
    metalness: 0,
    flatShading: true
  })
);
innerGround.rotation.x = -Math.PI / 2;
innerGround.position.y = 0.006;
innerGround.receiveShadow = true;
scene.add(innerGround);

const hemisphereLight = new THREE.HemisphereLight(0xffd7a0, 0x211913, 1.75);
scene.add(hemisphereLight);

const keyLight = new THREE.DirectionalLight(0xffc27d, 4.0);
keyLight.position.set(-5, 9, -6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -7;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 25;
keyLight.shadow.bias = -0.00025;
keyLight.shadow.normalBias = 0.035;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xe76b32, 2.1);
rimLight.position.set(6, 5, 5);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0x7894b8, 1.15);
fillLight.position.set(-5, 3, 7);
scene.add(fillLight);

function resize() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}
window.addEventListener('resize', resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
