<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kawaii Honeybee</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #fffdf4 0%, #fbeed0 58%, #e9d6b4 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xf7ead0, 11, 19);

  const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(5.8, 4.5, 9.2);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.55, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.75;
  controls.enablePan = false;
  controls.minDistance = 6;
  controls.maxDistance = 14;
  controls.maxPolarAngle = Math.PI * 0.53;

  const hemiLight = new THREE.HemisphereLight(0xfff8dc, 0x8f765f, 2.3);
  scene.add(hemiLight);

  const keyLight = new THREE.DirectionalLight(0xfff1cf, 4.2);
  keyLight.position.set(5, 8, 7);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.left = -5;
  keyLight.shadow.camera.right = 5;
  keyLight.shadow.camera.top = 5;
  keyLight.shadow.camera.bottom = -5;
  keyLight.shadow.camera.near = 1;
  keyLight.shadow.camera.far = 20;
  keyLight.shadow.bias = -0.00015;
  scene.add(keyLight);

  const rimLight = new THREE.DirectionalLight(0xbad8ff, 2.2);
  rimLight.position.set(-5, 4, -5);
  scene.add(rimLight);

  const faceLight = new THREE.PointLight(0xffcbd9, 1.5, 9, 2);
  faceLight.position.set(0, 3.5, 5);
  scene.add(faceLight);

  const yellowMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xffc94a,
    roughness: 0.34,
    metalness: 0,
    clearcoat: 0.26,
    clearcoatRoughness: 0.42,
    sheen: 0.7,
    sheenColor: new THREE.Color(0xffe7a1)
  });

  const blackMaterial = new THREE.MeshPhysicalMaterial({
    color: 0x211d22,
    roughness: 0.47,
    metalness: 0,
    clearcoat: 0.12,
    sheen: 0.55,
    sheenColor: new THREE.Color(0x655460)
  });

  const eyeMaterial = new THREE.MeshPhysicalMaterial({
    color: 0x09080b,
    roughness: 0.09,
    metalness: 0,
    clearcoat: 1,
    clearcoatRoughness: 0.06
  });

  const blushMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xff8fa9,
    roughness: 0.38,
    clearcoat: 0.3,
    sheen: 0.8,
    sheenColor: new THREE.Color(0xffd0dc)
  });

  const heartMaterial = new THREE.MeshPhysicalMaterial({
    color: 0x3a2932,
    roughness: 0.38,
    clearcoat: 0.25,
    sheen: 0.7,
    sheenColor: new THREE.Color(0x8e6576)
  });

  const wingMaterialA = new THREE.MeshPhysicalMaterial({
    color: 0xccecff,
    roughness: 0.23,
    metalness: 0,
    transparent: true,
    opacity: 0.62,
    transmission: 0.22,
    thickness: 0.28,
    clearcoat: 0.85,
    clearcoatRoughness: 0.18,
    side: THREE.DoubleSide,
    depthWrite: false
  });

  const wingMaterialB = wingMaterialA.clone();
  wingMaterialB.color.set(0xeadcff);
  wingMaterialB.opacity = 0.58;

  const bee = new THREE.Group();
  bee.position.y = 1.55;
  scene.add(bee);

  const sphereGeometry = new THREE.SphereGeometry(1, 64, 40);

  function addScaledSphere(material, position, scale, parent = bee) {
    const mesh = new THREE.Mesh(sphereGeometry, material);
    mesh.position.copy(position);
    mesh.scale.copy(scale);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
  }

  const body = addScaledSphere(
    yellowMaterial,
    new THREE.Vector3(0, -0.02, -0.28),
    new THREE.Vector3(1.08, 0.89, 1.66)
  );

  const bandGeometry = new THREE.TorusGeometry(0.78, 0.285, 28, 80);

  function addBand(z, xScale, yScale) {
    const band = new THREE.Mesh(bandGeometry, blackMaterial);
    band.position.set(0, -0.02, z);
    band.scale.set(xScale, yScale, 1);
    band.castShadow = true;
    band.receiveShadow = true;
    bee.add(band);
    return band;
  }

  addBand(-0.24, 1.05, 0.85);
  addBand(-0.91, 0.91, 0.76);

  addScaledSphere(
    blackMaterial,
    new THREE.Vector3(0, -0.03, -1.48),
    new THREE.Vector3(0.71, 0.57, 0.5)
  );

  const head = addScaledSphere(
    yellowMaterial,
    new THREE.Vector3(0, 0.17, 1.22),
    new THREE.Vector3(1.05, 1.01, 0.96)
  );

  function createWing(x, y, z, sx, sy, sz, rotationY, material) {
    const wing = new THREE.Mesh(sphereGeometry, material);
    wing.position.set(x, y, z);
    wing.scale.set(sx, sy, sz);
    wing.rotation.y = rotationY;
    wing.castShadow = true;
    wing.renderOrder = 2;
    bee.add(wing);
    return wing;
  }

  createWing(-1.15, 0.72, 0.13, 1.02, 0.12, 0.51, 0.28, wingMaterialA);
  createWing(1.15, 0.72, 0.13, 1.02, 0.12, 0.51, -0.28, wingMaterialA);
  createWing(-0.96, 0.69, -0.66, 0.81, 0.105, 0.45, -0.34, wingMaterialB);
  createWing(0.96, 0.69, -0.66, 0.81, 0.105, 0.45, 0.34, wingMaterialB);

  function createEye(x) {
    const eye = addScaledSphere(
      eyeMaterial,
      new THREE.Vector3(x, 0.35, 2.055),
      new THREE.Vector3(0.255, 0.315, 0.135)
    );

    const glint = addScaledSphere(
      new THREE.MeshBasicMaterial({ color: 0xffffff }),
      new THREE.Vector3(x - 0.07, 0.445, 2.174),
      new THREE.Vector3(0.066, 0.083, 0.027)
    );
    glint.castShadow = false;

    const tinyGlint = addScaledSphere(
      new THREE.MeshBasicMaterial({ color: 0xfff5ee }),
      new THREE.Vector3(x + 0.075, 0.265, 2.178),
      new THREE.Vector3(0.031, 0.039, 0.017)
    );
    tinyGlint.castShadow = false;
    return eye;
  }

  createEye(-0.42);
  createEye(0.42);

  addScaledSphere(
    blushMaterial,
    new THREE.Vector3(-0.69, -0.075, 2.045),
    new THREE.Vector3(0.22, 0.105, 0.06)
  );
  addScaledSphere(
    blushMaterial,
    new THREE.Vector3(0.69, -0.075, 2.045),
    new THREE.Vector3(0.22, 0.105, 0.06)
  );

  const smileCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.19, -0.18, 2.176),
    new THREE.Vector3(-0.09, -0.245, 2.205),
    new THREE.Vector3(0, -0.267, 2.212),
    new THREE.Vector3(0.09, -0.245, 2.205),
    new THREE.Vector3(0.19, -0.18, 2.176)
  ]);
  const smileGeometry = new THREE.TubeGeometry(smileCurve, 32, 0.025, 10, false);
  const smile = new THREE.Mesh(smileGeometry, blackMaterial);
  smile.castShadow = true;
  bee.add(smile);

  function createAntenna(side) {
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(side * 0.34, 0.86, 1.58),
      new THREE.Vector3(side * 0.43, 1.13, 1.66),
      new THREE.Vector3(side * 0.57, 1.34, 1.72),
      new THREE.Vector3(side * 0.69, 1.48, 1.77)
    ]);
    const geometry = new THREE.TubeGeometry(curve, 32, 0.045, 10, false);
    const stem = new THREE.Mesh(geometry, blackMaterial);
    stem.castShadow = true;
    bee.add(stem);

    const heartShape = new THREE.Shape();
    heartShape.moveTo(0, -0.16);
    heartShape.bezierCurveTo(-0.04, -0.10, -0.22, 0.01, -0.22, 0.14);
    heartShape.bezierCurveTo(-0.22, 0.31, -0.02, 0.34, 0, 0.20);
    heartShape.bezierCurveTo(0.02, 0.34, 0.22, 0.31, 0.22, 0.14);
    heartShape.bezierCurveTo(0.22, 0.01, 0.04, -0.10, 0, -0.16);

    const heartGeometry = new THREE.ExtrudeGeometry(heartShape, {
      depth: 0.075,
      bevelEnabled: true,
      bevelSegments: 3,
      steps: 1,
      bevelSize: 0.018,
      bevelThickness: 0.018
    });
    heartGeometry.center();

    const heart = new THREE.Mesh(heartGeometry, heartMaterial);
    heart.position.set(side * 0.72, 1.54, 1.79);
    heart.rotation.z = side * -0.22;
    heart.scale.setScalar(0.9);
    heart.castShadow = true;
    bee.add(heart);
  }

  createAntenna(-1);
  createAntenna(1);

  const legPositions = [
    { z: 0.58, angle: 0.28 },
    { z: -0.08, angle: 0 },
    { z: -0.75, angle: -0.28 }
  ];

  for (const side of [-1, 1]) {
    for (const legInfo of legPositions) {
      const leg = addScaledSphere(
        blackMaterial,
        new THREE.Vector3(side * 0.82, -0.76, legInfo.z),
        new THREE.Vector3(0.29, 0.46, 0.25)
      );
      leg.rotation.z = side * -0.47;
      leg.rotation.x = legInfo.angle;

      const foot = addScaledSphere(
        blackMaterial,
        new THREE.Vector3(side * 1.0, -1.07, legInfo.z + legInfo.angle * 0.18),
        new THREE.Vector3(0.31, 0.18, 0.3)
      );
      foot.rotation.y = side * legInfo.angle;
    }
  }

  bee.traverse((object) => {
    if (object.isMesh && object.material !== wingMaterialA && object.material !== wingMaterialB) {
      object.castShadow = true;
      object.receiveShadow = true;
    }
  });

  const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0xf6e5c8,
    roughness: 0.82,
    metalness: 0
  });
  const floor = new THREE.Mesh(new THREE.CircleGeometry(7, 96), floorMaterial);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0;
  floor.receiveShadow = true;
  scene.add(floor);

  const haloMaterial = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.14,
    depthWrite: false,
    side: THREE.DoubleSide
  });
  const halo = new THREE.Mesh(new THREE.RingGeometry(2.5, 4.7, 96), haloMaterial);
  halo.rotation.x = -Math.PI / 2;
  halo.position.y = 0.006;
  scene.add(halo);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  });

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();
    bee.position.y = 1.55 + Math.sin(time * 1.75) * 0.045;
    bee.rotation.z = Math.sin(time * 1.1) * 0.018;
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
