<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low-Poly Sitting Fox</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #dce8e4;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdce8e4);
scene.fog = new THREE.Fog(0xdce8e4, 12, 22);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.8, 4.4, 8.8);
camera.lookAt(0, 2.15, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 6;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.48;

const orange = new THREE.MeshStandardMaterial({
  color: 0xd96824,
  roughness: 0.82,
  metalness: 0,
  flatShading: true
});
const orangeLight = new THREE.MeshStandardMaterial({
  color: 0xee8135,
  roughness: 0.8,
  flatShading: true
});
const cream = new THREE.MeshStandardMaterial({
  color: 0xffe5bd,
  roughness: 0.9,
  flatShading: true
});
const dark = new THREE.MeshStandardMaterial({
  color: 0x302a2b,
  roughness: 0.88,
  flatShading: true
});
const innerEar = new THREE.MeshStandardMaterial({
  color: 0x713238,
  roughness: 0.9,
  flatShading: true
});
const eyeMat = new THREE.MeshStandardMaterial({
  color: 0x171719,
  roughness: 0.45,
  flatShading: true
});

function mesh(geometry, material, position, scale, rotation) {
  geometry.computeVertexNormals();
  const object = new THREE.Mesh(geometry, material);
  if (position) object.position.set(...position);
  if (scale) object.scale.set(...scale);
  if (rotation) object.rotation.set(...rotation);
  object.castShadow = true;
  object.receiveShadow = true;
  return object;
}

function polyEllipsoid(radius, detail, material, position, scale) {
  return mesh(
    new THREE.IcosahedronGeometry(radius, detail),
    material,
    position,
    scale
  );
}

function taperedSegment(a, b, radiusA, radiusB, material, sides = 6) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(radiusB, radiusA, length, sides, 1, false);
  const object = mesh(geometry, material);
  object.position.copy(a).add(b).multiplyScalar(0.5);
  object.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  return object;
}

function triangularPrism(width, height, depth) {
  const w = width * 0.5;
  const d = depth * 0.5;
  const vertices = new Float32Array([
    -w, 0, -d,   w, 0, -d,   0, height, -d,
    -w, 0,  d,   0, height, d, w, 0, d,
    -w, 0, -d,  -w, 0,  d,   0, height, d,
    -w, 0, -d,   0, height, d, 0, height, -d,
     w, 0, -d,   0, height, -d, 0, height, d,
     w, 0, -d,   0, height, d, w, 0, d,
    -w, 0, -d,  -w, 0,  d,   w, 0, d,
    -w, 0, -d,   w, 0,  d,   w, 0, -d
  ]);
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
  geometry.computeVertexNormals();
  return geometry;
}

const fox = new THREE.Group();
fox.rotation.y = -0.04;
scene.add(fox);

const body = polyEllipsoid(1, 2, orange, [0, 2.0, 0], [1.32, 1.72, 1.12]);
body.rotation.x = -0.08;
fox.add(body);

const chest = polyEllipsoid(1, 1, cream, [0, 2.18, 1.015], [0.72, 1.20, 0.20]);
chest.rotation.x = -0.08;
fox.add(chest);

const haunchLeft = polyEllipsoid(1, 1, orange, [-0.83, 1.15, -0.08], [0.76, 0.80, 0.84]);
const haunchRight = polyEllipsoid(1, 1, orange, [0.83, 1.15, -0.08], [0.76, 0.80, 0.84]);
fox.add(haunchLeft, haunchRight);

const frontLegLeft = taperedSegment(
  new THREE.Vector3(-0.47, 1.80, 0.77),
  new THREE.Vector3(-0.43, 0.42, 1.00),
  0.30, 0.23, orangeLight, 5
);
const frontLegRight = taperedSegment(
  new THREE.Vector3(0.47, 1.80, 0.77),
  new THREE.Vector3(0.43, 0.42, 1.00),
  0.30, 0.23, orangeLight, 5
);
fox.add(frontLegLeft, frontLegRight);

const pawLeft = polyEllipsoid(0.5, 1, dark, [-0.44, 0.35, 1.13], [0.66, 0.42, 0.88]);
const pawRight = polyEllipsoid(0.5, 1, dark, [0.44, 0.35, 1.13], [0.66, 0.42, 0.88]);
fox.add(pawLeft, pawRight);

const hindPawLeft = polyEllipsoid(0.55, 1, dark, [-0.91, 0.38, 0.43], [0.88, 0.48, 1.18]);
const hindPawRight = polyEllipsoid(0.55, 1, dark, [0.91, 0.38, 0.43], [0.88, 0.48, 1.18]);
fox.add(hindPawLeft, hindPawRight);

const neckRuff = polyEllipsoid(1, 1, cream, [0, 3.20, 0.48], [0.90, 0.72, 0.58]);
fox.add(neckRuff);

const head = polyEllipsoid(1, 2, orangeLight, [0, 3.78, 0.18], [1.12, 1.03, 1.00]);
head.rotation.x = -0.03;
fox.add(head);

const cheekLeft = polyEllipsoid(0.65, 1, cream, [-0.40, 3.54, 0.88], [0.83, 0.64, 0.48]);
const cheekRight = polyEllipsoid(0.65, 1, cream, [0.40, 3.54, 0.88], [0.83, 0.64, 0.48]);
fox.add(cheekLeft, cheekRight);

const muzzle = mesh(
  new THREE.ConeGeometry(0.48, 0.92, 5, 1, false),
  cream,
  [0, 3.53, 1.15],
  [1, 1, 0.82],
  [Math.PI * 0.5, 0, 0]
);
fox.add(muzzle);

const nose = polyEllipsoid(0.23, 1, dark, [0, 3.51, 1.61], [1.22, 0.78, 0.82]);
fox.add(nose);

const earLeft = mesh(triangularPrism(0.82, 1.34, 0.48), orange, [-0.66, 4.40, -0.03], null, [0.02, 0, -0.16]);
const earRight = mesh(triangularPrism(0.82, 1.34, 0.48), orange, [0.66, 4.40, -0.03], null, [0.02, 0, 0.16]);
fox.add(earLeft, earRight);

const earInsetLeft = mesh(triangularPrism(0.46, 0.82, 0.08), innerEar, [-0.65, 4.57, 0.225], null, [0, 0, -0.16]);
const earInsetRight = mesh(triangularPrism(0.46, 0.82, 0.08), innerEar, [0.65, 4.57, 0.225], null, [0, 0, 0.16]);
fox.add(earInsetLeft, earInsetRight);

const eyeLeft = polyEllipsoid(0.15, 1, eyeMat, [-0.39, 3.88, 1.02], [0.76, 1.02, 0.46]);
const eyeRight = polyEllipsoid(0.15, 1, eyeMat, [0.39, 3.88, 1.02], [0.76, 1.02, 0.46]);
fox.add(eyeLeft, eyeRight);

const browLeft = taperedSegment(
  new THREE.Vector3(-0.58, 4.08, 0.91),
  new THREE.Vector3(-0.24, 4.04, 1.00),
  0.045, 0.035, dark, 4
);
const browRight = taperedSegment(
  new THREE.Vector3(0.58, 4.08, 0.91),
  new THREE.Vector3(0.24, 4.04, 1.00),
  0.045, 0.035, dark, 4
);
fox.add(browLeft, browRight);

const tailPoints = [
  new THREE.Vector3(0.94, 1.25, -0.55),
  new THREE.Vector3(1.65, 1.00, -0.68),
  new THREE.Vector3(2.10, 0.62, -0.20),
  new THREE.Vector3(2.22, 0.60, 0.60),
  new THREE.Vector3(1.94, 0.93, 1.25),
  new THREE.Vector3(1.48, 1.34, 1.52)
];
const tailRadii = [0.48, 0.65, 0.73, 0.71, 0.58, 0.24];

for (let i = 0; i < tailPoints.length - 1; i++) {
  const material = i >= 4 ? cream : orangeLight;
  const segment = taperedSegment(
    tailPoints[i],
    tailPoints[i + 1],
    tailRadii[i],
    tailRadii[i + 1],
    material,
    7
  );
  fox.add(segment);
}

for (let i = 1; i < tailPoints.length - 1; i++) {
  const material = i >= 4 ? cream : orangeLight;
  const joint = polyEllipsoid(
    1,
    1,
    material,
    [tailPoints[i].x, tailPoints[i].y, tailPoints[i].z],
    [tailRadii[i] * 1.02, tailRadii[i] * 0.96, tailRadii[i] * 1.04]
  );
  fox.add(joint);
}

const tailTip = polyEllipsoid(1, 1, cream, [1.43, 1.38, 1.55], [0.28, 0.30, 0.35]);
fox.add(tailTip);

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0xa9bbb3,
  roughness: 1,
  metalness: 0
});
const ground = new THREE.Mesh(new THREE.CircleGeometry(6.2, 48), groundMaterial);
ground.rotation.x = -Math.PI * 0.5;
ground.position.y = 0.02;
ground.receiveShadow = true;
scene.add(ground);

const ambient = new THREE.HemisphereLight(0xf6fbff, 0x7e6956, 2.0);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xfff0d5, 4.2);
key.position.set(-4.5, 8, 5.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -3;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 20;
key.shadow.bias = -0.0004;
scene.add(key);

const rim = new THREE.DirectionalLight(0x9ec9dc, 2.4);
rim.position.set(5, 5, -5);
scene.add(rim);

const fill = new THREE.PointLight(0xffb77b, 1.5, 10);
fill.position.set(-3, 2.2, 4);
scene.add(fill);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
}
addEventListener('resize', resize);

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
