<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marble Sundial Column</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #d8d1c2;
}
canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8d1c2);
scene.fog = new THREE.Fog(0xd8d1c2, 13, 25);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 50);
camera.position.set(6.8, 5.6, 8.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.25, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 6;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI * 0.49;

function mulberry32(seed) {
  return function () {
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function makeMarbleTexture(seed, size = 1024) {
  const random = mulberry32(seed);
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');

  const gradient = ctx.createLinearGradient(0, 0, size, size);
  gradient.addColorStop(0, '#eeeae0');
  gradient.addColorStop(0.45, '#d9d8d1');
  gradient.addColorStop(0.72, '#f2eee5');
  gradient.addColorStop(1, '#cbcdd0');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);

  for (let i = 0; i < 9000; i++) {
    const x = random() * size;
    const y = random() * size;
    const a = random() * 0.045;
    const c = 205 + Math.floor(random() * 35);
    ctx.fillStyle = `rgba(${c},${c + 1},${c + 3},${a})`;
    ctx.fillRect(x, y, 1 + random() * 2, 1 + random() * 2);
  }

  for (let i = 0; i < 27; i++) {
    const baseY = random() * size;
    const amplitude = 15 + random() * 80;
    const frequency = 0.004 + random() * 0.012;
    const slope = (random() - 0.5) * 0.5;
    ctx.beginPath();
    for (let x = -30; x <= size + 30; x += 8) {
      const y = baseY + slope * x +
        Math.sin(x * frequency + random() * 0.15) * amplitude +
        Math.sin(x * frequency * 2.7) * amplitude * 0.18;
      if (x === -30) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    const dark = random() > 0.35;
    ctx.strokeStyle = dark
      ? `rgba(72,82,88,${0.07 + random() * 0.13})`
      : `rgba(151,145,130,${0.08 + random() * 0.11})`;
    ctx.lineWidth = 0.7 + random() * 3.2;
    ctx.stroke();

    if (random() > 0.55) {
      ctx.strokeStyle = `rgba(255,255,250,${0.12 + random() * 0.18})`;
      ctx.lineWidth = 0.5 + random();
      ctx.translate(2, 1);
      ctx.stroke();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const marbleTexture = makeMarbleTexture(9173);
marbleTexture.repeat.set(1.35, 2.6);

const plateTexture = makeMarbleTexture(4311);
plateTexture.repeat.set(1.25, 1.25);

const marbleMaterial = new THREE.MeshStandardMaterial({
  map: marbleTexture,
  color: 0xf0ede4,
  roughness: 0.32,
  metalness: 0.02
});

const edgeMarbleMaterial = new THREE.MeshStandardMaterial({
  map: marbleTexture,
  color: 0xdedbd1,
  roughness: 0.42,
  metalness: 0.01
});

const plateMaterial = new THREE.MeshStandardMaterial({
  map: plateTexture,
  color: 0xf2eee4,
  roughness: 0.29,
  metalness: 0.015
});

const bronzeMaterial = new THREE.MeshStandardMaterial({
  color: 0x76502f,
  roughness: 0.3,
  metalness: 0.78
});

const darkBronzeMaterial = new THREE.MeshStandardMaterial({
  color: 0x3e3025,
  roughness: 0.46,
  metalness: 0.58
});

const incisionMaterial = new THREE.MeshStandardMaterial({
  color: 0x5a5650,
  roughness: 0.68,
  metalness: 0.02
});

function shadows(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const monument = new THREE.Group();
scene.add(monument);

function addCylinder(radiusTop, radiusBottom, height, y, material, segments = 96) {
  const mesh = shadows(new THREE.Mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments, 1, false),
    material
  ));
  mesh.position.y = y;
  monument.add(mesh);
  return mesh;
}

addCylinder(0.93, 0.98, 0.18, 0.09, edgeMarbleMaterial);
addCylinder(0.82, 0.9, 0.17, 0.265, marbleMaterial);
addCylinder(0.72, 0.78, 0.15, 0.425, edgeMarbleMaterial);
addCylinder(0.61, 0.67, 0.16, 0.58, marbleMaterial);

function createFlutedShaft() {
  const radialSegments = 192;
  const heightSegments = 22;
  const positions = [];
  const indices = [];
  const uvs = [];
  const flutes = 16;
  const height = 2.52;

  for (let iy = 0; iy <= heightSegments; iy++) {
    const v = iy / heightSegments;
    const y = v * height;
    const taper = 0.59 - 0.055 * v;
    const entasis = Math.sin(v * Math.PI) * 0.018;

    for (let ix = 0; ix <= radialSegments; ix++) {
      const u = ix / radialSegments;
      const angle = u * Math.PI * 2;
      const grooveWave = 0.5 + 0.5 * Math.cos(angle * flutes);
      const groove = 0.044 * Math.pow(grooveWave, 4.2);
      const radius = taper + entasis - groove;
      positions.push(Math.sin(angle) * radius, y, Math.cos(angle) * radius);
      uvs.push(u, v);
    }
  }

  for (let iy = 0; iy < heightSegments; iy++) {
    for (let ix = 0; ix < radialSegments; ix++) {
      const a = iy * (radialSegments + 1) + ix;
      const b = a + radialSegments + 1;
      indices.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const shaft = shadows(new THREE.Mesh(geometry, marbleMaterial));
  shaft.position.y = 0.64;
  monument.add(shaft);
}
createFlutedShaft();

addCylinder(0.62, 0.57, 0.14, 3.23, edgeMarbleMaterial);
addCylinder(0.72, 0.61, 0.19, 3.385, marbleMaterial);
addCylinder(0.83, 0.72, 0.16, 3.56, edgeMarbleMaterial);

const neckRing = shadows(new THREE.Mesh(
  new THREE.TorusGeometry(0.61, 0.055, 12, 96),
  marbleMaterial
));
neckRing.rotation.x = Math.PI / 2;
neckRing.position.y = 3.135;
monument.add(neckRing);

function createAcanthusLeaf() {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.bezierCurveTo(-0.12, 0.08, -0.2, 0.25, -0.16, 0.42);
  shape.lineTo(-0.07, 0.34);
  shape.bezierCurveTo(-0.13, 0.56, -0.08, 0.76, 0, 0.86);
  shape.bezierCurveTo(0.08, 0.76, 0.13, 0.56, 0.07, 0.34);
  shape.lineTo(0.16, 0.42);
  shape.bezierCurveTo(0.2, 0.25, 0.12, 0.08, 0, 0);

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.045,
    bevelEnabled: true,
    bevelSegments: 2,
    bevelSize: 0.018,
    bevelThickness: 0.015,
    curveSegments: 8
  });
  geometry.translate(0, -0.42, -0.02);
  return geometry;
}

const leafGeometry = createAcanthusLeaf();
for (let i = 0; i < 12; i++) {
  const angle = i / 12 * Math.PI * 2;
  const leaf = shadows(new THREE.Mesh(leafGeometry, marbleMaterial));
  leaf.position.set(Math.sin(angle) * 0.655, 3.41, Math.cos(angle) * 0.655);
  leaf.rotation.y = angle;
  leaf.rotation.x = -0.07;
  monument.add(leaf);
}

const abacus = shadows(new THREE.Mesh(
  new THREE.BoxGeometry(1.42, 0.18, 1.42, 4, 1, 4),
  marbleMaterial
));
abacus.position.y = 3.75;
monument.add(abacus);

const abacusLip = shadows(new THREE.Mesh(
  new THREE.BoxGeometry(1.56, 0.1, 1.56),
  edgeMarbleMaterial
));
abacusLip.position.y = 3.88;
monument.add(abacusLip);

const sundial = new THREE.Group();
sundial.position.set(0, 4.08, 0.05);
sundial.rotation.x = THREE.MathUtils.degToRad(18);
monument.add(sundial);

const plate = shadows(new THREE.Mesh(
  new THREE.CylinderGeometry(1.66, 1.66, 0.16, 128, 1, false),
  plateMaterial
));
sundial.add(plate);

const underside = shadows(new THREE.Mesh(
  new THREE.CylinderGeometry(1.51, 1.56, 0.09, 96),
  edgeMarbleMaterial
));
underside.position.y = -0.12;
sundial.add(underside);

const rim = shadows(new THREE.Mesh(
  new THREE.TorusGeometry(1.55, 0.065, 16, 128),
  edgeMarbleMaterial
));
rim.rotation.x = Math.PI / 2;
rim.position.y = 0.105;
sundial.add(rim);

const innerRing = new THREE.Mesh(
  new THREE.TorusGeometry(1.22, 0.012, 6, 128),
  incisionMaterial
);
innerRing.rotation.x = Math.PI / 2;
innerRing.position.y = 0.091;
sundial.add(innerRing);

function addBar(parent, x, z, length, angle = 0) {
  const bar = new THREE.Mesh(
    new THREE.BoxGeometry(0.043, 0.022, length),
    incisionMaterial
  );
  bar.position.set(x, 0, z);
  bar.rotation.y = angle;
  bar.castShadow = true;
  parent.add(bar);
}

function createRomanGlyph(text) {
  const glyph = new THREE.Group();
  const characterWidth = 0.19;
  const totalWidth = (text.length - 1) * characterWidth;

  for (let i = 0; i < text.length; i++) {
    const x = i * characterWidth - totalWidth / 2;
    const c = text[i];

    if (c === 'I') {
      addBar(glyph, x, 0, 0.29);
      addBar(glyph, x, -0.145, 0.1, Math.PI / 2);
      addBar(glyph, x, 0.145, 0.1, Math.PI / 2);
    } else if (c === 'V') {
      addBar(glyph, x - 0.05, -0.005, 0.3, -0.34);
      addBar(glyph, x + 0.05, -0.005, 0.3, 0.34);
    } else if (c === 'X') {
      addBar(glyph, x, 0, 0.32, -0.37);
      addBar(glyph, x, 0, 0.32, 0.37);
    }
  }
  return glyph;
}

const numerals = ['XII', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI'];
for (let i = 0; i < 12; i++) {
  const angle = i / 12 * Math.PI * 2;
  const numeral = createRomanGlyph(numerals[i]);
  const radius = 1.37;
  numeral.position.set(Math.sin(angle) * radius, 0.102, Math.cos(angle) * radius);
  numeral.rotation.y = angle;
  sundial.add(numeral);

  const tick = new THREE.Mesh(
    new THREE.BoxGeometry(i % 3 === 0 ? 0.025 : 0.014, 0.018, i % 3 === 0 ? 0.14 : 0.09),
    incisionMaterial
  );
  tick.position.set(Math.sin(angle) * 1.09, 0.101, Math.cos(angle) * 1.09);
  tick.rotation.y = angle;
  sundial.add(tick);
}

function createGnomonGeometry() {
  const tx = 0.035;
  const points = [
    [-tx, -0.47, 0.105], [tx, -0.47, 0.105],
    [-tx, 0.72, 0.105], [tx, 0.72, 0.105],
    [-tx, -0.47, 1.12], [tx, -0.47, 1.12]
  ];
  const vertices = [];
  for (const p of points) vertices.push(p[0], p[2], p[1]);

  const indices = [
    0, 4, 2, 1, 3, 5,
    0, 1, 5, 0, 5, 4,
    0, 2, 3, 0, 3, 1,
    2, 4, 5, 2, 5, 3
  ];

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const gnomon = shadows(new THREE.Mesh(createGnomonGeometry(), bronzeMaterial));
gnomon.position.y = 0.02;
sundial.add(gnomon);

const gnomonFoot = shadows(new THREE.Mesh(
  new THREE.BoxGeometry(0.17, 0.065, 1.16),
  darkBronzeMaterial
));
gnomonFoot.position.set(0, 0.135, 0.1);
sundial.add(gnomonFoot);

const centralPin = shadows(new THREE.Mesh(
  new THREE.CylinderGeometry(0.075, 0.09, 0.08, 24),
  bronzeMaterial
));
centralPin.position.y = 0.15;
sundial.add(centralPin);

const weatherRandom = mulberry32(7345);
for (let i = 0; i < 31; i++) {
  const angle = weatherRandom() * Math.PI * 2;
  const radius = 0.28 + weatherRandom() * 1.15;
  const pit = new THREE.Mesh(
    new THREE.SphereGeometry(0.012 + weatherRandom() * 0.018, 10, 6),
    new THREE.MeshStandardMaterial({
      color: 0x8b8981,
      roughness: 0.9,
      transparent: true,
      opacity: 0.32
    })
  );
  pit.scale.y = 0.16;
  pit.position.set(Math.sin(angle) * radius, 0.101, Math.cos(angle) * radius);
  sundial.add(pit);
}

const chipMaterial = new THREE.MeshStandardMaterial({
  color: 0xbcb9b0,
  roughness: 0.72
});

const chipData = [
  [-1.52, 0.13, 0.38, 0.11, 0.035],
  [1.34, 0.13, -0.78, 0.085, -0.15],
  [-0.7, 0.12, -1.42, 0.075, 0.23],
  [0.82, 0.12, 1.29, 0.065, -0.18]
];

for (const data of chipData) {
  const chip = new THREE.Mesh(
    new THREE.TetrahedronGeometry(data[3], 0),
    chipMaterial
  );
  chip.position.set(data[0], data[1], data[2]);
  chip.rotation.set(data[4], data[4] * 2, data[4] * 0.6);
  chip.scale.set(1.5, 0.35, 0.8);
  sundial.add(chip);
}

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xbdb5a5,
  roughness: 0.91,
  metalness: 0
});

const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.015;
floor.receiveShadow = true;
scene.add(floor);

const ambient = new THREE.HemisphereLight(0xe9eef2, 0x665d50, 1.7);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffe4bd, 4.4);
sun.position.set(-5.5, 9.5, 4.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -5;
sun.shadow.camera.right = 5;
sun.shadow.camera.top = 7;
sun.shadow.camera.bottom = -2;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 22;
sun.shadow.bias = -0.00025;
sun.shadow.normalBias = 0.015;
sun.shadow.radius = 1;
scene.add(sun);
scene.add(sun.target);
sun.target.position.set(0, 2.3, 0);

const fill = new THREE.DirectionalLight(0xb9d2e8, 0.65);
fill.position.set(4, 4, -5);
scene.add(fill);

const warmBounce = new THREE.PointLight(0xd8ab78, 0.8, 8);
warmBounce.position.set(-2.5, 1.4, 3);
scene.add(warmBounce);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
