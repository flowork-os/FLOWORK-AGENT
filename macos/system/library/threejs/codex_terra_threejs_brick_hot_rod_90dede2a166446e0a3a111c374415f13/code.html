<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brick Hot Rod</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101218; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101218);
scene.fog = new THREE.Fog(0x101218, 18, 34);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(10.5, 6.8, 12.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 8;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.48;

const red = new THREE.MeshStandardMaterial({ color: 0xb7141d, roughness: 0.2, metalness: 0.05 });
const redDark = new THREE.MeshStandardMaterial({ color: 0x720911, roughness: 0.24, metalness: 0.05 });
const black = new THREE.MeshStandardMaterial({ color: 0x101115, roughness: 0.25, metalness: 0.12 });
const tire = new THREE.MeshStandardMaterial({ color: 0x121214, roughness: 0.63, metalness: 0.02 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xc9d5df, roughness: 0.13, metalness: 0.93 });
const warmChrome = new THREE.MeshStandardMaterial({ color: 0x9a6d37, roughness: 0.2, metalness: 0.75 });
const orange = new THREE.MeshStandardMaterial({ color: 0xff6b18, roughness: 0.24, metalness: 0.03 });
const yellow = new THREE.MeshStandardMaterial({ color: 0xffcc25, roughness: 0.23, metalness: 0.02 });
const cream = new THREE.MeshStandardMaterial({ color: 0xf4e3bf, roughness: 0.32, metalness: 0.02 });
const glass = new THREE.MeshStandardMaterial({ color: 0x182b38, roughness: 0.12, metalness: 0.35 });

function mesh(geometry, material, x = 0, y = 0, z = 0) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(x, y, z);
  object.castShadow = true;
  object.receiveShadow = true;
  return object;
}

function brick(group, x, y, z, width, depth, height, material, studs = true) {
  const body = mesh(new THREE.BoxGeometry(width, height, depth), material, x, y, z);
  group.add(body);
  if (studs) {
    const columns = Math.max(1, Math.round(width / 0.52));
    const rows = Math.max(1, Math.round(depth / 0.52));
    const radius = Math.min(0.16, width / columns * 0.28, depth / rows * 0.28);
    for (let ix = 0; ix < columns; ix++) {
      for (let iz = 0; iz < rows; iz++) {
        const sx = x - width / 2 + width * (ix + 0.5) / columns;
        const sz = z - depth / 2 + depth * (iz + 0.5) / rows;
        const stud = mesh(new THREE.CylinderGeometry(radius, radius, 0.1, 20), material, sx, y + height / 2 + 0.05, sz);
        group.add(stud);
      }
    }
  }
  return body;
}

function cylinder(group, radiusTop, radiusBottom, length, material, x, y, z, rotationX = 0, rotationY = 0, rotationZ = 0) {
  const object = mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, length, 28), material, x, y, z);
  object.rotation.set(rotationX, rotationY, rotationZ);
  group.add(object);
  return object;
}

const rod = new THREE.Group();
rod.rotation.y = -0.12;
scene.add(rod);

const chassis = new THREE.Group();
rod.add(chassis);

brick(chassis, 0, 0.95, 0.05, 4.8, 2.65, 0.42, black);
brick(chassis, 0.08, 1.2, -0.2, 5.0, 2.35, 0.32, red);
brick(chassis, -0.48, 1.47, 0.2, 3.95, 2.08, 0.34, red);
brick(chassis, 1.92, 1.47, 0.18, 1.1, 2.08, 0.34, redDark);
brick(chassis, -2.18, 1.45, 0.18, 0.75, 2.06, 0.34, black);

brick(chassis, -0.6, 1.78, 0.2, 2.5, 2.1, 0.35, red);
brick(chassis, 1.23, 1.78, 0.2, 1.2, 2.1, 0.35, red);
brick(chassis, 2.17, 1.72, 0.2, 0.7, 2.05, 0.31, black);

brick(chassis, -1.52, 2.13, 0.2, 1.25, 2.04, 0.36, red);
brick(chassis, -0.34, 2.13, 0.2, 1.1, 2.04, 0.36, red);
brick(chassis, 0.79, 2.13, 0.2, 1.12, 2.04, 0.36, redDark);
brick(chassis, 1.76, 2.06, 0.2, 0.76, 2.02, 0.3, black);

const cabin = new THREE.Group();
rod.add(cabin);
brick(cabin, -1.22, 2.47, 0.2, 1.68, 2.0, 0.4, red);
brick(cabin, -0.54, 2.84, 0.2, 0.62, 2.0, 0.36, red);
brick(cabin, -1.7, 2.84, 0.2, 0.46, 2.0, 0.36, redDark);
brick(cabin, -1.16, 3.22, 0.2, 1.5, 1.95, 0.3, black);
brick(cabin, -1.2, 3.42, 0.2, 1.28, 1.78, 0.22, black);
brick(cabin, -1.2, 3.44, 0.2, 0.86, 1.83, 0.18, glass, false);

const windshield = mesh(new THREE.BoxGeometry(0.12, 1.0, 1.75), glass, -0.36, 3.2, 0.2);
windshield.rotation.z = -0.42;
cabin.add(windshield);
const windshieldFrame = mesh(new THREE.BoxGeometry(0.15, 1.13, 1.95), chrome, -0.34, 3.2, 0.2);
windshieldFrame.rotation.z = -0.42;
cabin.add(windshieldFrame);
const windshieldInset = mesh(new THREE.BoxGeometry(0.17, 0.88, 1.63), glass, -0.31, 3.22, 0.2);
windshieldInset.rotation.z = -0.42;
cabin.add(windshieldInset);

for (const side of [-1, 1]) {
  const rearX = -1.48;
  const rearZ = side * 1.62;
  cylinder(rod, 1.08, 1.08, 0.72, tire, rearX, 1.15, rearZ, Math.PI / 2, 0, 0);
  cylinder(rod, 0.59, 0.59, 0.77, black, rearX, 1.15, rearZ, Math.PI / 2, 0, 0);
  cylinder(rod, 0.42, 0.42, 0.8, chrome, rearX, 1.15, rearZ, Math.PI / 2, 0, 0);

  const frontX = 1.75;
  const frontZ = side * 1.47;
  cylinder(rod, 0.72, 0.72, 0.5, tire, frontX, 1.06, frontZ, Math.PI / 2, 0, 0);
  cylinder(rod, 0.37, 0.37, 0.56, chrome, frontX, 1.06, frontZ, Math.PI / 2, 0, 0);

  for (let i = 0; i < 10; i++) {
    const angle = i * Math.PI * 2 / 10;
    const tread = mesh(new THREE.BoxGeometry(0.18, 0.16, 0.38), black, rearX + Math.cos(angle) * 1.06, 1.15 + Math.sin(angle) * 1.06, rearZ);
    tread.rotation.z = angle;
    rod.add(tread);
  }
}

brick(rod, 2.64, 1.52, 0.2, 0.3, 2.15, 0.28, chrome);
brick(rod, 2.48, 1.76, 0.2, 0.26, 1.6, 0.22, black);
for (const side of [-1, 1]) {
  const lamp = mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.16, 24), cream, 2.66, 1.82, side * 0.78);
  lamp.rotation.z = Math.PI / 2;
  rod.add(lamp);
}

const engine = new THREE.Group();
rod.add(engine);
brick(engine, 0.72, 2.75, 0.2, 1.45, 1.52, 0.42, black);
brick(engine, 0.72, 3.15, 0.2, 1.25, 1.4, 0.38, warmChrome);
brick(engine, 0.72, 3.53, 0.2, 1.05, 1.24, 0.35, chrome);

for (const side of [-1, 1]) {
  brick(engine, 0.7, 3.05, side * 0.89, 1.35, 0.28, 0.35, red, true);
  brick(engine, 0.7, 3.48, side * 0.77, 1.15, 0.26, 0.3, black, true);
  for (let x = 0.18; x <= 1.2; x += 0.52) {
    cylinder(engine, 0.13, 0.13, 0.72, chrome, x, 2.76, side * 1.16, 0, Math.PI / 2, 0);
  }
}

for (let z = -0.46; z <= 0.46; z += 0.46) {
  cylinder(engine, 0.24, 0.24, 0.64, chrome, 0.73, 3.95, z, 0, 0, 0);
  cylinder(engine, 0.17, 0.17, 0.12, black, 0.73, 4.32, z, 0, 0, 0);
}

const grille = new THREE.Group();
rod.add(grille);
for (let z = -0.77; z <= 0.77; z += 0.31) {
  const bar = mesh(new THREE.BoxGeometry(0.15, 0.12, 0.13), chrome, 2.79, 1.53, z);
  grille.add(bar);
}

for (const side of [-1, 1]) {
  const exhaust = new THREE.Group();
  rod.add(exhaust);
  const z = side * 1.43;
  cylinder(exhaust, 0.16, 0.16, 2.85, chrome, 0.16, 1.22, z, 0, Math.PI / 2, 0);
  cylinder(exhaust, 0.21, 0.16, 0.52, chrome, 1.72, 1.22, z, 0, Math.PI / 2, 0);
  cylinder(exhaust, 0.21, 0.16, 0.52, chrome, -1.4, 1.22, z, 0, Math.PI / 2, 0);
  for (let x = -0.8; x < 1.2; x += 0.75) {
    brick(exhaust, x, 1.3, z, 0.28, 0.24, 0.2, chrome, false);
  }
}

const flame = new THREE.Group();
rod.add(flame);
for (const side of [-1, 1]) {
  const z = side * 1.29;
  const pieces = [
    [0.15, 2.27, 0.44, 0.16, orange],
    [0.55, 2.31, 0.5, 0.16, orange],
    [0.9, 2.28, 0.34, 0.15, yellow],
    [-0.28, 2.27, 0.34, 0.14, yellow],
    [-0.58, 2.27, 0.24, 0.12, orange]
  ];
  for (const [x, y, w, h, material] of pieces) {
    const decal = mesh(new THREE.BoxGeometry(w, h, 0.045), material, x, y, z);
    flame.add(decal);
  }
  const tip = mesh(new THREE.ConeGeometry(0.2, 0.54, 3), orange, 1.13, 2.3, z);
  tip.rotation.z = -Math.PI / 2;
  tip.rotation.x = side * Math.PI / 2;
  flame.add(tip);
}

const steeringWheel = new THREE.Group();
rod.add(steeringWheel);
const ring = mesh(new THREE.TorusGeometry(0.31, 0.055, 10, 24), black, -1.25, 3.5, 0.2);
ring.rotation.y = Math.PI / 2;
ring.rotation.z = -0.35;
steeringWheel.add(ring);
const spokeA = mesh(new THREE.BoxGeometry(0.07, 0.48, 0.06), chrome, -1.25, 3.5, 0.2);
spokeA.rotation.z = -0.35;
steeringWheel.add(spokeA);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(12, 96),
  new THREE.MeshStandardMaterial({ color: 0x1a1e25, roughness: 0.8, metalness: 0.02 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.01;
floor.receiveShadow = true;
scene.add(floor);

const shadowDisk = new THREE.Mesh(
  new THREE.CircleGeometry(4.3, 64),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.16, depthWrite: false })
);
shadowDisk.rotation.x = -Math.PI / 2;
shadowDisk.position.y = 0.012;
shadowDisk.scale.set(1.4, 0.62, 1);
scene.add(shadowDisk);

scene.add(new THREE.HemisphereLight(0xaec6ff, 0x1b1010, 2.1));

const keyLight = new THREE.DirectionalLight(0xfff2da, 4.1);
keyLight.position.set(6, 10, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -9;
keyLight.shadow.camera.right = 9;
keyLight.shadow.camera.top = 9;
keyLight.shadow.camera.bottom = -9;
keyLight.shadow.bias = -0.00025;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x6eb6ff, 2.4);
rimLight.position.set(-7, 5, -8);
scene.add(rimLight);

const redGlow = new THREE.PointLight(0xff3d24, 12, 12, 2);
redGlow.position.set(-2.7, 3, -3.5);
scene.add(redGlow);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
