<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snow Berm — Plowed Parking Lot Edge</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e131a; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- basics ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb2c4);
scene.fog = new THREE.Fog(0x9fb2c4, 40, 110);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 300);
camera.position.set(13, 8, 15);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.7, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 6;
controls.maxDistance = 60;

// ---------- lighting ----------
scene.add(new THREE.HemisphereLight(0xbdd2e6, 0x4a4238, 0.75));

const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(-14, 18, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -18;
sun.shadow.camera.right = 18;
sun.shadow.camera.top = 18;
sun.shadow.camera.bottom = -18;
sun.shadow.camera.near = 2;
sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0005;
sun.shadow.radius = 4;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xa8c0dd, 0.35);
fill.position.set(10, 6, -12);
scene.add(fill);

// ---------- deterministic noise helpers ----------
function hash(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
function smooth(t) { return t * t * (3 - 2 * t); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  const u = smooth(xf), v = smooth(yf);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y) {
  return vnoise(x, y) * 0.55 + vnoise(x * 2.3, y * 2.1) * 0.28 + vnoise(x * 5.1, y * 4.7) * 0.17;
}

// ---------- one centered asset group ----------
const asset = new THREE.Group();
scene.add(asset);

// ----- asphalt lot with painted lines (canvas texture) -----
const LOT_W = 24, LOT_D = 16;                 // lot extends toward +z, berm along z = -LOT_D/2 edge
const acv = document.createElement('canvas');
acv.width = 1024; acv.height = 1024;
const g = acv.getContext('2d');
g.fillStyle = '#3b3d40';
g.fillRect(0, 0, 1024, 1024);
// asphalt speckle
for (let i = 0; i < 26000; i++) {
  const x = hash(i, 1) * 1024, y = hash(i, 2) * 1024, v = hash(i, 3);
  g.fillStyle = `rgba(${30 + v * 60 | 0},${32 + v * 58 | 0},${36 + v * 55 | 0},0.5)`;
  g.fillRect(x, y, 1 + v * 2, 1 + v * 2);
}
// large tonal patches
for (let i = 0; i < 60; i++) {
  const x = hash(i, 7) * 1024, y = hash(i, 8) * 1024, r = 40 + hash(i, 9) * 130;
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  const dark = hash(i, 10) > 0.5;
  gr.addColorStop(0, dark ? 'rgba(20,22,26,0.16)' : 'rgba(105,108,112,0.10)');
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
}
// painted parking stall lines (worn white), stalls opening toward the berm
const px = 1024 / LOT_W, pz = 1024 / LOT_D;   // canvas x = world x, canvas y = world z (+z at y=1024)
function paintLine(x0, z0, x1, z1, w) {
  g.strokeStyle = 'rgba(235,238,240,0.85)';
  g.lineWidth = w;
  g.lineCap = 'butt';
  g.beginPath();
  g.moveTo((x0 + LOT_W / 2) * px, (z0 + LOT_D / 2) * pz);
  g.lineTo((x1 + LOT_W / 2) * px, (z1 + LOT_D / 2) * pz);
  g.stroke();
}
const STALL = 3.0;
for (let i = 0; i <= 7; i++) {
  const x = -10.5 + i * STALL;
  paintLine(x, -1.6, x, 3.6, 7);              // stall dividers
}
paintLine(-10.5, 3.6, 10.5, 3.6, 7);          // stall back line
// worn dashes near lot's far edge (drive lane)
g.setLineDash([46, 34]);
g.strokeStyle = 'rgba(230,205,90,0.75)';
g.lineWidth = 8;
g.beginPath();
g.moveTo(0, (6.4 + LOT_D / 2) * pz);
g.lineTo(1024, (6.4 + LOT_D / 2) * pz);
g.stroke();
g.setLineDash([]);
// wear/grime scrubbing over paint
for (let i = 0; i < 4200; i++) {
  const x = hash(i, 21) * 1024, y = hash(i, 22) * 1024, v = hash(i, 23);
  g.fillStyle = `rgba(58,60,64,${0.15 + v * 0.3})`;
  g.fillRect(x, y, 2 + v * 5, 2 + v * 5);
}
// dirty slush stain band along the berm edge (canvas y = 0 side is z = -LOT_D/2)
const stain = g.createLinearGradient(0, 0, 0, 200);
stain.addColorStop(0, 'rgba(52,46,38,0.85)');
stain.addColorStop(0.5, 'rgba(60,55,48,0.4)');
stain.addColorStop(1, 'rgba(0,0,0,0)');
g.fillStyle = stain;
g.fillRect(0, 0, 1024, 200);
// salt bloom streaks near the edge
for (let i = 0; i < 240; i++) {
  const x = hash(i, 31) * 1024, y = 20 + hash(i, 32) * 150, r = 4 + hash(i, 33) * 22;
  g.fillStyle = `rgba(215,212,200,${0.05 + hash(i, 34) * 0.12})`;
  g.beginPath(); g.ellipse(x, y, r, r * 0.4, 0, 0, Math.PI * 2); g.fill();
}
const asphaltTex = new THREE.CanvasTexture(acv);
asphaltTex.colorSpace = THREE.SRGBColorSpace;
asphaltTex.anisotropy = 8;

const lot = new THREE.Mesh(
  new THREE.PlaneGeometry(LOT_W, LOT_D),
  new THREE.MeshStandardMaterial({ map: asphaltTex, roughness: 0.93, metalness: 0.0 })
);
lot.rotation.x = -Math.PI / 2;
lot.receiveShadow = true;
asset.add(lot);

// ----- snow berm ridge along the -z edge -----
const BERM_L = 24, BERM_W = 5.2, BERM_H = 2.1;
const SEGX = 180, SEGZ = 46;
const bermGeo = new THREE.PlaneGeometry(BERM_L, BERM_W, SEGX, SEGZ);
bermGeo.rotateX(-Math.PI / 2);
const pos = bermGeo.attributes.position;
const colors = new Float32Array(pos.count * 3);
const cleanSnow = new THREE.Color(0xf4f7fb);
const shadedSnow = new THREE.Color(0xd7e2ee);
const dirt = new THREE.Color(0x6b5c48);
const grime = new THREE.Color(0x8d8272);
const tmp = new THREE.Color();

for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i);
  const z = pos.getZ(i);                       // local: -BERM_W/2 (back) .. +BERM_W/2 (lot side)
  const u = (z + BERM_W / 2) / BERM_W;         // 0 back, 1 front(lot)
  // asymmetric ridge profile: steep plow-pushed face toward lot, gentler back
  const front = Math.pow(Math.sin(Math.min(1, u * 1.25) * Math.PI * 0.5), 1.6);
  const back = Math.pow(Math.sin(Math.min(1, (1 - u) * 1.9) * Math.PI * 0.5), 1.1);
  let h = BERM_H * Math.min(front, back);
  // long-axis undulation from plow passes
  h *= 0.72 + 0.28 * fbm(x * 0.35 + 3.7, 0.5);
  h += 0.16 * (fbm(x * 1.4, z * 1.4) - 0.5) * Math.min(1, h * 2);
  // chunky plow-churn lumps
  h += 0.11 * (fbm(x * 3.2 + 9, z * 3.2 + 4) - 0.5) * Math.min(1, h * 3);
  // taper the ends of the ridge
  const end = smooth(Math.max(0, Math.min(1, (BERM_L / 2 - Math.abs(x)) / 3.5)));
  h *= end;
  h = Math.max(h, 0.015 * end);
  pos.setY(i, h);

  // vertex colors: dirty base band, cleaner top
  const dirtBand = Math.max(0, 1 - h / 0.75);
  const n = fbm(x * 2.6 + 40, z * 2.6 + 17);
  let d = dirtBand * (0.45 + 0.55 * n);
  d = Math.min(1, Math.pow(d, 1.25) * 1.15);
  // extra grime on the lot-facing toe
  const toe = smooth(Math.max(0, (u - 0.55) / 0.45)) * Math.max(0, 1 - h / 0.5);
  tmp.copy(cleanSnow).lerp(shadedSnow, Math.max(0, 0.5 - h / BERM_H) * n);
  tmp.lerp(grime, Math.min(1, d * 0.8 + toe * 0.5));
  tmp.lerp(dirt, Math.min(1, d * 0.55 + toe * 0.45) * 0.7);
  colors[i * 3] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
}
bermGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
bermGeo.computeVertexNormals();

const snowMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.88,
  metalness: 0.0,
  flatShading: false
});
const berm = new THREE.Mesh(bermGeo, snowMat);
berm.position.set(0, 0.005, -LOT_D / 2 + BERM_W / 2 - 1.4);  // ridge straddles the lot edge
berm.castShadow = true;
berm.receiveShadow = true;
asset.add(berm);

// scattered dirty snow chunks kicked off the plow at the toe of the berm
const chunkMat = new THREE.MeshStandardMaterial({ color: 0xb9b3a4, roughness: 0.95 });
const chunkGeo = new THREE.IcosahedronGeometry(1, 0);
for (let i = 0; i < 42; i++) {
  const c = new THREE.Mesh(chunkGeo, chunkMat.clone());
  const t = hash(i, 51);
  c.material.color.lerpColors(new THREE.Color(0xcfd4d8), new THREE.Color(0x7d6f5a), hash(i, 52));
  const s = 0.07 + hash(i, 53) * 0.22;
  c.scale.set(s * (0.7 + hash(i, 54)), s * 0.7, s * (0.7 + hash(i, 55)));
  c.position.set(
    -BERM_L / 2 + 1 + t * (BERM_L - 2),
    s * 0.4,
    -LOT_D / 2 + BERM_W - 1.6 + hash(i, 56) * 1.9
  );
  c.rotation.set(hash(i, 57) * 3, hash(i, 58) * 3, hash(i, 59) * 3);
  c.castShadow = true;
  c.receiveShadow = true;
  asset.add(c);
}

// thin snow scraps left on the asphalt near the stalls
const scrapMat = new THREE.MeshStandardMaterial({ color: 0xe8edf2, roughness: 0.9 });
for (let i = 0; i < 14; i++) {
  const sc = new THREE.Mesh(new THREE.CircleGeometry(0.3 + hash(i, 61) * 0.7, 10), scrapMat);
  sc.rotation.x = -Math.PI / 2;
  sc.scale.y = 0.4 + hash(i, 62) * 0.6;
  sc.position.set(-LOT_W / 2 + 2 + hash(i, 63) * (LOT_W - 4), 0.012, -LOT_D / 2 + 4.6 + hash(i, 64) * 6);
  sc.receiveShadow = true;
  asset.add(sc);
}

// ----- soft ground shadow / grounding gradient beyond the asset -----
const shCv = document.createElement('canvas');
shCv.width = 256; shCv.height = 256;
const sg = shCv.getContext('2d');
const rg = sg.createRadialGradient(128, 128, 30, 128, 128, 128);
rg.addColorStop(0, 'rgba(15,20,28,0.42)');
rg.addColorStop(0.6, 'rgba(15,20,28,0.18)');
rg.addColorStop(1, 'rgba(15,20,28,0)');
sg.fillStyle = rg;
sg.fillRect(0, 0, 256, 256);
const shadowTex = new THREE.CanvasTexture(shCv);
const softShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(46, 34),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
);
softShadow.rotation.x = -Math.PI / 2;
softShadow.position.y = -0.02;
scene.add(softShadow);

// faint surrounding ground plane so the lot doesn't float
const surround = new THREE.Mesh(
  new THREE.CircleGeometry(90, 48),
  new THREE.MeshStandardMaterial({ color: 0xcdd8e2, roughness: 1 })
);
surround.rotation.x = -Math.PI / 2;
surround.position.y = -0.05;
surround.receiveShadow = true;
scene.add(surround);

// ---------- render loop ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
