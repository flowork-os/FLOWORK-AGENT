<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art-Deco Concert Harp</title>
<style>
  html, body { margin: 0; height: 100%; background: #121216; overflow: hidden; }
  #c { display: block; width: 100%; height: 100%; }
  #cap {
    position: fixed; left: 0; right: 0; bottom: 14px;
    text-align: center; pointer-events: none;
    font-family: "Century Gothic", "Futura", system-ui, sans-serif;
    color: #d8c79a; letter-spacing: 0.32em; font-size: 12px;
    text-transform: uppercase; opacity: 0.55;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="cap">Concert Harp · Art Déco</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const lerp = THREE.MathUtils.lerp;

/* ---------------- Renderer ---------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* ---------------- Scene / Camera ---------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14141a);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.5, 1.35, 3.1);

/* Procedural studio environment for crisp metal reflections */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.045).texture;

/* ---------------- Controls ---------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.target.set(0, 0.88, 0);
controls.minDistance = 1.9;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.53;

/* ---------------- Lighting ---------------- */
const hemi = new THREE.HemisphereLight(0xbdd6ff, 0x1c1710, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff1dc, 2.5);
key.position.set(3.4, 5.2, 3.8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 5;
key.shadow.bias = -0.0004;
{
  const s = key.shadow.camera;
  s.left = -1.6; s.right = 1.6; s.top = 2.3; s.bottom = -0.4;
  s.near = 0.5; s.far = 16; s.updateProjectionMatrix();
}
scene.add(key);

const fill = new THREE.DirectionalLight(0x9ab6ff, 0.55);
fill.position.set(-4, 2.6, 2.2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd7a0, 1.5);
rim.position.set(-2.6, 3.4, -4.2);
scene.add(rim);

/* ---------------- Ground (shadow-only) ---------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.ShadowMaterial({ opacity: 0.4 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------- Materials ---------------- */
const matGoldPolish = new THREE.MeshStandardMaterial({ color: 0xe2b64c, metalness: 1.0, roughness: 0.22, envMapIntensity: 1.15 });
const matGoldBrush  = new THREE.MeshStandardMaterial({ color: 0xc79f45, metalness: 0.95, roughness: 0.5,  envMapIntensity: 0.9 });
const matLacquer    = new THREE.MeshPhysicalMaterial({ color: 0x0a0a0d, metalness: 0.25, roughness: 0.14, clearcoat: 1.0, clearcoatRoughness: 0.05, envMapIntensity: 1.0, side: THREE.DoubleSide });
const strPale = new THREE.MeshStandardMaterial({ color: 0xeee4c6, metalness: 0.25, roughness: 0.5 });
const strRed  = new THREE.MeshStandardMaterial({ color: 0x9b1d22, metalness: 0.25, roughness: 0.5 });
const strBlue = new THREE.MeshStandardMaterial({ color: 0x1d2f63, metalness: 0.25, roughness: 0.5 });

/* ---------------- Helpers ---------------- */
// Position a Y-centred geometry so it spans p0 -> p1 (geometry height must equal |p1-p0|)
function orientY(obj, p0, p1) {
  const dir = new THREE.Vector3().subVectors(p1, p0);
  obj.position.copy(p0).addScaledVector(dir, 0.5);
  obj.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
}
// Place an object at a point with its Y axis aligned to dir
function orientAtDir(obj, point, dir) {
  obj.position.copy(point);
  obj.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
}
function tubeFromPoints(pts, r, mat, seg = 64, rad = 8) {
  const curve = new THREE.CatmullRomCurve3(pts);
  return new THREE.Mesh(new THREE.TubeGeometry(curve, seg, r, rad, false), mat);
}

/* ---------------- Attachment lines (strings) ---------------- */
function neckAttach(s) {
  const y0 = 1.565, z0 = 0.15, y1 = 1.72, z1 = -0.04, y2 = 1.47, z2 = -0.285;
  const mt = 1 - s;
  const y = mt * mt * y0 + 2 * mt * s * y1 + s * s * y2;
  const z = mt * mt * z0 + 2 * mt * s * z1 + s * s * z2;
  return new THREE.Vector3(0, y, z);
}
function boardAttach(s) {
  return new THREE.Vector3(0, lerp(0.22, 1.42, s), lerp(0.02, -0.28, s));
}

/* ---------------- Soundbox body (lofted D-section) ---------------- */
function buildBody() {
  const slices = 48, arcPts = 22;
  const positions = [], indices = [];
  const vid = (i, j) => i * arcPts + j;

  for (let i = 0; i <= slices; i++) {
    const t = i / slices;
    const cy = lerp(0.16, 1.47, t);
    const cz = lerp(0.02, -0.30, t);
    const hw = 0.05 + 0.14 * Math.pow(1 - t, 1.15);
    const bd = 0.045 + 0.12 * Math.pow(1 - t, 1.15);
    for (let j = 0; j < arcPts; j++) {
      const th = Math.PI * j / (arcPts - 1);
      const u = Math.cos(th);
      const w = -Math.sin(th);
      positions.push(u * hw, cy, cz + w * bd);
    }
  }
  for (let i = 0; i < slices; i++) {
    for (let j = 0; j < arcPts; j++) {
      const j2 = (j + 1) % arcPts;
      const a = vid(i, j), b = vid(i, j2), c = vid(i + 1, j), d = vid(i + 1, j2);
      indices.push(a, c, b, b, c, d);
    }
  }
  const cbi = positions.length / 3; positions.push(0, 0.16, 0.02);
  const cti = positions.length / 3; positions.push(0, 1.47, -0.30);
  for (let j = 0; j < arcPts; j++) {
    const j2 = (j + 1) % arcPts;
    indices.push(cbi, vid(0, j2), vid(0, j));
    indices.push(cti, vid(slices, j), vid(slices, j2));
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const mesh = new THREE.Mesh(geo, matLacquer);
  return mesh;
}

/* ---------------- Soundboard trim (brushed gold) ---------------- */
function buildBoard() {
  const g = new THREE.Group();
  const samples = 26;
  const left = [], right = [], center = [];
  for (let k = 0; k < samples; k++) {
    const t = k / (samples - 1);
    const cy = lerp(0.16, 1.47, t);
    const cz = lerp(0.02, -0.30, t);
    const hw = 0.05 + 0.14 * Math.pow(1 - t, 1.15);
    left.push(new THREE.Vector3(-hw * 0.98, cy, cz + 0.004));
    right.push(new THREE.Vector3(hw * 0.98, cy, cz + 0.004));
    center.push(new THREE.Vector3(0, cy, cz + 0.006));
  }
  g.add(tubeFromPoints(left, 0.007, matGoldBrush, 60, 8));
  g.add(tubeFromPoints(right, 0.007, matGoldBrush, 60, 8));
  g.add(tubeFromPoints(center, 0.005, matGoldBrush, 60, 8));
  return g;
}

/* ---------------- Chevron collar (art-deco band) ---------------- */
function chevronCollar(rIn, rOut, h) {
  const g = new THREE.Group();
  const low = new THREE.Mesh(new THREE.CylinderGeometry(rOut, rIn, h / 2, 24), matGoldPolish);
  low.position.y = -h / 4;
  const up = new THREE.Mesh(new THREE.CylinderGeometry(rIn, rOut, h / 2, 24), matGoldPolish);
  up.position.y = h / 4;
  g.add(low, up);
  return g;
}

/* ---------------- Fan-motif crown ---------------- */
function buildFan(hub) {
  const g = new THREE.Group();
  const n = 11, len = 0.14, spread = THREE.MathUtils.degToRad(80);

  const boss = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.03, 24), matGoldPolish);
  boss.rotation.z = Math.PI / 2;
  g.add(boss);

  for (let i = 0; i < n; i++) {
    const a = lerp(-spread, spread, i / (n - 1));
    const blade = new THREE.Mesh(new THREE.BoxGeometry(0.016, len, 0.022), matGoldPolish);
    blade.geometry.translate(0, len / 2, 0);
    blade.rotation.x = a;
    g.add(blade);
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.014, 12, 12), matGoldPolish);
    tip.position.set(0, Math.cos(a) * len, Math.sin(a) * len);
    g.add(tip);
  }
  g.position.copy(hub);
  g.rotation.x = THREE.MathUtils.degToRad(-18);
  return g;
}

/* ---------------- Gilded fluted column ---------------- */
function buildColumn() {
  const g = new THREE.Group();
  const cBot = new THREE.Vector3(0, 0.06, 0.315);
  const cTop = new THREE.Vector3(0, 1.55, 0.235);
  const axis = new THREE.Vector3().subVectors(cTop, cBot).normalize();

  // shaft
  const len = cBot.distanceTo(cTop);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.075, len, 20, 1), matGoldPolish);
  orientY(shaft, cBot, cTop);
  g.add(shaft);

  // vertical flutes
  const upv = Math.abs(axis.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
  const e1 = new THREE.Vector3().crossVectors(axis, upv).normalize();
  const e2 = new THREE.Vector3().crossVectors(axis, e1).normalize();
  const nF = 12;
  for (let k = 0; k < nF; k++) {
    const ang = k / nF * Math.PI * 2;
    const dir0 = new THREE.Vector3().addScaledVector(e1, Math.cos(ang)).addScaledVector(e2, Math.sin(ang));
    const p0 = cBot.clone().addScaledVector(dir0, 0.072);
    const p1 = cTop.clone().addScaledVector(dir0, 0.05);
    const fl = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, p0.distanceTo(p1), 6), matGoldPolish);
    orientY(fl, p0, p1);
    g.add(fl);
  }

  // chevron collars
  [0.16, 0.42, 0.68].forEach(t => {
    const p = new THREE.Vector3().lerpVectors(cBot, cTop, t);
    const rS = lerp(0.075, 0.052, t);
    const col = chevronCollar(rS, rS + 0.032, 0.055);
    orientAtDir(col, p, axis);
    g.add(col);
  });

  // base collar
  const bc = chevronCollar(0.08, 0.115, 0.06);
  orientAtDir(bc, cBot.clone().addScaledVector(axis, 0.08), axis);
  g.add(bc);

  // stepped capital
  const cap = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.05, 0.14), matGoldPolish);
  cap.position.copy(cTop);
  g.add(cap);
  const cap2 = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.04, 0.10), matGoldPolish);
  cap2.position.copy(cTop).addScaledVector(axis, 0.045);
  g.add(cap2);

  // fan crown
  g.add(buildFan(cTop.clone().addScaledVector(axis, 0.07)));

  return g;
}

/* ---------------- Neck (harmonic curve) ---------------- */
function buildNeck() {
  const g = new THREE.Group();
  const pts = [
    new THREE.Vector3(0, 1.55, 0.235),
    new THREE.Vector3(0, 1.73, 0.06),
    new THREE.Vector3(0, 1.71, -0.13),
    new THREE.Vector3(0, 1.50, -0.30)
  ];
  g.add(tubeFromPoints(pts, 0.05, matGoldPolish, 90, 16));
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.06, 20, 20), matGoldPolish);
  knob.position.set(0, 1.50, -0.30);
  g.add(knob);
  return g;
}

/* ---------------- Strings + pins ---------------- */
function buildStrings() {
  const g = new THREE.Group();
  const N = 32;
  for (let i = 0; i < N; i++) {
    const s = lerp(0.03, 0.97, i / (N - 1));
    const bot = boardAttach(s).add(new THREE.Vector3(0, 0, 0.012));
    const top = neckAttach(s);
    const len = bot.distanceTo(top);
    const r = lerp(0.0034, 0.0015, s);

    const m = i % 7;
    let mat = strPale;
    if (m === 0) mat = strRed;
    else if (m === 3) mat = strBlue;

    const str = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 5), mat);
    orientY(str, bot, top);
    g.add(str);

    const tp = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.055, 8), matGoldPolish);
    tp.position.copy(top); tp.rotation.z = Math.PI / 2;
    g.add(tp);

    const bp = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.02, 8), matGoldPolish);
    bp.position.copy(bot); bp.rotation.z = Math.PI / 2;
    g.add(bp);
  }
  return g;
}

/* ---------------- Stepped base + pedals ---------------- */
function buildBase() {
  const g = new THREE.Group();
  const steps = [
    { w: 0.50, h: 0.06, d: 0.78, y: 0.030, m: matLacquer },
    { w: 0.44, h: 0.035, d: 0.70, y: 0.078, m: matGoldPolish },
    { w: 0.38, h: 0.05, d: 0.62, y: 0.115, m: matLacquer },
    { w: 0.30, h: 0.03, d: 0.52, y: 0.150, m: matGoldPolish }
  ];
  steps.forEach(s => {
    const b = new THREE.Mesh(new THREE.BoxGeometry(s.w, s.h, s.d), s.m);
    b.position.y = s.y;
    g.add(b);
  });

  // seven pedals
  for (let i = 0; i < 7; i++) {
    const x = lerp(-0.15, 0.15, i / 6);
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.014, 0.085), matGoldPolish);
    p.position.set(x, 0.05, 0.34);
    p.rotation.x = 0.35;
    g.add(p);
  }
  return g;
}

/* ---------------- Assemble harp ---------------- */
const harp = new THREE.Group();
harp.add(buildBase());
harp.add(buildBody());
harp.add(buildBoard());
harp.add(buildColumn());
harp.add(buildNeck());
harp.add(buildStrings());

harp.traverse(o => {
  if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
});
scene.add(harp);

/* ---------------- Resize + Animate ---------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
