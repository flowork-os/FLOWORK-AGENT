let randomSeed = 735291;
function random() {
  const value = Math.sin(randomSeed++) * 43758.5453123;
  return value - Math.floor(value);
}
function range(min, max) {
  return min + (max - min) * random();
}
function choose(values) {
  return values[Math.floor(random() * values.length)];
}

function createSkyTexture() {
  const canvas = document.createElement("canvas");
  canvas.width = 1024;
  canvas.height = 512;
  const context = canvas.getContext("2d");

  const gradient = context.createLinearGradient(0, 0, 0, canvas.height);
  gradient.addColorStop(0, "#020713");
  gradient.addColorStop(0.36, "#07162a");
  gradient.addColorStop(0.7, "#12334a");
  gradient.addColorStop(1, "#376177");
  context.fillStyle = gradient;
  context.fillRect(0, 0, canvas.width, canvas.height);

  for (let index = 0; index < 420; index++) {
    const x = random() * canvas.width;
    const y = random() * canvas.height * 0.7;
    const radius = random() * 1.6 + 0.25;
    const alpha = random() * 0.75 + 0.25;
    context.beginPath();
    context.arc(x, y, radius, 0, Math.PI * 2);
    context.fillStyle = `rgba(220,240,255,${alpha})`;
    context.fill();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}

function addMesh(geometry, material, position, scale, rotation, parent) {
  const target = parent || scene;
  const object = new THREE.Mesh(geometry, material);
  if (position) {
    object.position.set(position.x || 0, position.y || 0, position.z || 0);
  }
  if (scale) {
    object.scale.set(scale.x || 1, scale.y || 1, scale.z || 1);
  }
  if (rotation) {
    object.rotation.set(rotation.x || 0, rotation.y || 0, rotation.z || 0);
  }
  object.castShadow = true;
  object.receiveShadow = true;
  target.add(object);
  return object;
}

function addBox(width, height, depth, material, position, rotation, parent) {
  return addMesh(
    new THREE.BoxGeometry(width, height, depth),
    material,
    position,
    null,
    rotation,
    parent
  );
}

function addSphere(radius, material, position, scale, parent) {
  return addMesh(
    new THREE.SphereGeometry(radius, 18, 12),
    material,
    position,
    scale,
    null,
    parent
  );
}

function addCylinder(radiusTop, radiusBottom, height, material, position, rotation, radialSegments, parent) {
  return addMesh(
    new THREE.CylinderGeometry(
      radiusTop,
      radiusBottom,
      height,
      radialSegments || 16,
      1,
      false
    ),
    material,
    position,
    null,
    rotation,
    parent
  );
}

function addCone(radius, height, material, position, scale, parent) {
  return addMesh(
    new THREE.ConeGeometry(radius, height, 9, 2, false),
    material,
    position,
    scale,
    null,
    parent
  );
}

function createDistantRange() {
  const group = new THREE.Group();
  group.position.z = -42;

  for (let index = 0; index < 17; index++) {
    const width = range(4.5, 9);
    const height = range(4, 12);
    const x = -43 + index * 5.5 + range(-1.6, 1.6);
    const mountain = addCone(
      width,
      height,
      materials.mountain,
      { x, y: height * 0.5 - 0.5, z: range(-2, 4) },
      { x: 1, y: 1, z: range(0.75, 1.25) },
      group
    );
    mountain.rotation.y = range(0, Math.PI);
  }

  for (let index = 0; index < 12; index++) {
    const width = range(2, 5);
    const height = range(2, 6);
    const x = -36 + index * 6 + range(-2, 2);
    addCone(
      width,
      height,
      materials.iceDark,
      { x, y: height * 0.5 - 0.5, z: 2.5 },
      { x: 1, y: 1, z: range(0.8, 1.2) },
      group
    );
  }

  scene.add(group);
  return group;
}

function createFloe(radius, depth, materialVariant) {
  const group = new THREE.Group();
  const edgeMaterial = materialVariant === "blue" ? materials.iceBlue : materials.iceDark;
  const topMaterial = materialVariant === "bright" ? materials.iceLight : materials.iceTop;

  const lower = addCylinder(
    radius * 0.98,
    radius * 1.07,
    depth,
    edgeMaterial,
    { x: 0, y: -depth * 0.4, z: 0 },
    { x: 0, y: range(0, Math.PI), z: 0 },
    11,
    group
  );
  lower.rotation.z = range(-0.05, 0.05);

  addCylinder(
    radius * 0.98,
    radius * 0.87,
    0.26,
    topMaterial,
    { x: 0, y: 0.08, z: 0 },
    { x: 0, y: range(0, Math.PI), z: 0 },
    11,
    group
  );

  const shardCount = Math.max(4, Math.floor(radius * 1.5));
  for (let index = 0; index < shardCount; index++) {
    const angle = random() * Math.PI * 2;
    const distance = range(radius * 0.42, radius * 0.88);
    const chunkRadius = range(0.12, 0.34);
    const shard = addMesh(
      new THREE.IcosahedronGeometry(1, 1),
      index % 3 === 0 ? materials.iceLight : topMaterial,
      {
        x: Math.cos(angle) * distance,
        y: 0.22 + range(0, 0.12),
        z: Math.sin(angle) * distance
      },
      {
        x: chunkRadius * range(0.7, 1.4),
        y: chunkRadius * range(0.3, 0.8),
        z: chunkRadius * range(0.7, 1.4)
      },
      {
        x: range(-0.3, 0.3),
        y: range(0, Math.PI),
        z: range(-0.3, 0.3)
      },
      group
    );
    shard.castShadow = true;
  }

  return group;
}

const floeRecords = [];

function placeFloe(radius, depth, x, z, variant, drift, phase) {
  const group = createFloe(radius, depth, variant);
  group.position.set(x, 0, z);
  group.userData.baseX = x;
  group.userData.baseZ = z;
  group.userData.drift = drift;
  group.userData.phase = phase;
  scene.add(group);
  floeRecords.push(group);
  return group;
}

    1.9,

  addCone(

    3.45,
    materials.iceTop,
    { x: 0.1, y: 2.55, z: 0.02 },
    { x: 0.92, y: 1, z: 0.7 },
    group
  );

  addCone(
    0.9,
    2.6,
    materials.iceLight,
    { x: -0.63, y: 2.12, z: 0.18 },
    { x: 0.65, y: 1, z: 0.54 },
    group
  );

  addMesh(
    new THREE.IcosahedronGeometry(1, 1),
    materials.iceDark,
    { x: 0.56, y: 1.15, z: -0.48 },

    { x: 0.2, y: 0.4, z: -0.2 },

  addMesh(

    { x: 0.52, y: 0.78, z: 0.4 },
    { x: -0.25, y: 0.2, z: 0.15 },
    group
  );

  scene.add(group);
  return group;
}

function createBear(parent, size, offset) {
  const group = new THREE.Group();
  group.position.set(offset.x, offset.y, offset.z);
  parent.add(group);

  addSphere(
    1,
    materials.bear,
    { x: 0, y: 1.04 * size, z: 0 },
    { x: 1.45 * size, y: 0.72 * size, z: 0.82 * size },
    group
  );

  addSphere(
    0.82,
    materials.bear,
    { x: 0, y: 1.37 * size, z: -0.91 * size },
    { x: 0.86 * size, y: 0.9 * size, z: 0.86 * size },
    group
  );

  addSphere(
    0.38,
    materials.bearShade,
    { x: 0, y: 1.23 * size, z: -1.48 * size },
    { x: 0.82 * size, y: 0.55 * size, z: 0.74 * size },
    group
  );

  const legPositions = [
    { x: -0.72, y: 0.55, z: -0.45 },
    { x: 0.72, y: 0.55, z: -0.45 },
    { x: -0.68, y: 0.5, z: 0.48 },
    { x: 0.68, y: 0.5, z: 0.48 }
  ];

  for (const legPosition of legPositions) {
    addSphere(
      0.4,
      materials.bear,
      {
        x: legPosition.x * size,
        y: legPosition.y * size,
        z: legPosition.z * size
      },
      { x: 0.75 * size, y: 1.05 * size, z: 0.7 * size },
      group
    );
  }

  addSphere(
    0.22,
    materials.nose,
    { x: 0, y: 1.39 * size, z: -1.82 * size },
    { x: 0.8 * size, y: 0.58 * size, z: 0.55 * size },
    group
  );

  const eyePositions = [-0.3, 0.3];
  for (const eyeX of eyePositions) {
    addSphere(
      0.075,
      materials.nose,
      { x: eyeX * size, y: 1.67 * size, z: -1.58 * size },
      null,
      group
    );
  }

  for (const earX of [-0.54, 0.54]) {
    addSphere(
      0.22,
      materials.bear,
      { x: earX * size, y: 1.92 * size, z: -0.94 * size },
      { x: 0.92, y: 0.8, z: 0.48 },
      group
    );
  }

  addSphere(
    0.18,
    materials.bearShade,
    { x: 0, y: 1.5 * size, z: -1.43 * size },
    { x: 0.72, y: 0.7, z: 0.64 },
    group
  );

  group.userData.baseY = offset.y;
  group.userData.phase = random() * 6;
  return group;
}

function createIgloo(position) {
  const group = new THREE.Group();
  group.position.copy(position);

  addCylinder(
    2.65,
    2.85,
    0.36,
    materials.igloo,
    { x: 0, y: 0.1, z: 0 },
    null,
    18,
    group
  );

  const dome = addSphere(
    2.45,
    materials.iglooBright,
    { x: 0, y: 0.82, z: 0 },
    { x: 1, y: 0.75, z: 1 },
    group
  );
  dome.castShadow = true;

  const blockRows = [
    { y: 0.28, radius: 2.34, count: 13, height: 0.38 },
    { y: 0.66, radius: 2.03, count: 12, height: 0.36 },
    { y: 1.02, radius: 1.64, count: 10, height: 0.34 },
    { y: 1.33, radius: 1.16, count: 8, height: 0.3 },
    { y: 1.58, radius: 0.62, count: 5, height: 0.25 }
  ];

  for (const row of blockRows) {
    for (let index = 0; index < row.count; index++) {
      const angle = (index / row.count) * Math.PI * 2 + (row.y * 0.9);
      const width = (2 * Math.PI * row.radius) / row.count * 0.88;
      const block = addBox(
        width,
        row.height,
        0.42,
        index % 4 === 0 ? materials.igloo : materials.iglooBright,
        {
          x: Math.cos(angle) * row.radius,
          y: row.y,
          z: Math.sin(angle) * row.radius
        },
        { x: 0, y: -angle, z: range(-0.04, 0.04) },
        group
      );
      block.castShadow = true;
    }
  }

  addBox(
    1.05,
    1.38,
    0.32,
    materials.doorway,
    { x: 0, y: 0.68, z: -2.57 },
    null,
    group
  );

  addSphere(
    0.54,
    materials.doorway,
    { x: 0, y: 1.34, z: -2.55 },
    { x: 1, y: 0.72, z: 0.3 },
    group
  );

  const doorwayGlow = new THREE.PointLight(0xff9b4d, 2.2, 7, 2);
  doorwayGlow.position.set(0, 0.95, -2.2);
  doorwayGlow.castShadow = true;
  group.add(doorwayGlow);

  const chimney = addCylinder(
    0.18,
    0.25,
    0.34,
    materials.igloo,
    { x: 0.1, y: 1.9, z: 0.1 },
    null,
    10,
    group
  );
  chimney.castShadow = true;

  scene.add(group);
  return group;
}

    { x: 0, y: 0.27, z: 0 },
    null,
    18,
    group
  );

  const ring = addMesh(
    new THREE.TorusGeometry(0.84, 0.11, 8, 20),
    materials.iceLight,
    { x: 0, y: 0.3, z: 0 },
    null,
    null,
    group
  );
  ring.rotation.x = 0;
  return group;
}

const breathingHole = createBreathingHole(mainFloe, { x: 3.6, y: 0, z: 1.8 });

function createIceSpires(parent, count, radius, yOffset) {
  for (let index = 0; index < count; index++) {
    const angle = random() * Math.PI * 2;
    const distance = range(radius * 0.45, radius * 0.83);
    const height = range(0.25, 0.74);
    addCone(
      range(0.12, 0.28),
      height,
      index % 2 === 0 ? materials.iceLight : materials.iceTop,
      {
        x: Math.cos(angle) * distance,
        y: yOffset + height * 0.5,
        z: Math.sin(angle) * distance
      },
      { x: range(0.6, 1.3), y: 1, z: range(0.6, 1.3) },
      parent
    );
  }
}

createIceSpires(mainFloe, 16, 6.1, 0.2);
createIceSpires(rightFloe, 9, 3.7, 0.2);
createIceSpires(rearFloe, 10, 4.4, 0.2);

function createSnowDrifts(parent, count, radius) {
  for (let index = 0; index < count; index++) {
    const angle = random() * Math.PI * 2;
    const distance = range(0.3, radius * 0.78);
    const drift = addSphere(
      range(0.15, 0.42),
      materials.snow,
      {
        x: Math.cos(angle) * distance,
        y: 0.25,
        z: Math.sin(angle) * distance
      },
      {
        x: range(1.2, 2.3),
        y: range(0.22, 0.55),
        z: range(0.65, 1.25)
      },
      parent
    );
    drift.rotation.y = angle + range(-0.5, 0.5);
  }
}

createSnowDrifts(mainFloe, 12, 5.3);
createSnowDrifts(nearFloe, 7, 2.6);

function createAuroraRibbon(colorMaterial, startX, width, baseZ, phase, height) {
  const segmentCount = 38;
  const positions = [];
  const indices = [];

  for (let index = 0; index <= segmentCount; index++) {
    const t = index / segmentCount;
    const x = startX + t * width;
    const wave = Math.sin(t * 8.3 + phase) * 1.6 + Math.sin(t * 17.2 + phase * 0.7) * 0.45;
    const z = baseZ + wave;

    positions.push(x, 6.4, z);
    positions.push(x, height + Math.sin(t * 5.1 + phase) * 0.7, z + Math.sin(t * 4.8 + phase) * 1.1);
  }

  for (let index = 0; index < segmentCount; index++) {
    const current = index * 2;
    const next = current + 2;
    indices.push(current, next, current + 1);
    indices.push(next, next + 1, current + 1);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(positions, 3)
  );
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();

  const mesh = new THREE.Mesh(geometry, colorMaterial);
  mesh.userData.startX = startX;
  mesh.userData.width = width;
  mesh.userData.baseZ = baseZ;
  mesh.userData.phase = phase;
  mesh.userData.height = height;
  mesh.userData.segmentCount = segmentCount;
  scene.add(mesh);
  return mesh;
}

const auroraRibbons = [
  createAuroraRibbon(materials.auroraGreen, -29, 18, -27, 0.8, 16.5),
  createAuroraRibbon(materials.auroraViolet, -11, 22, -31, 2.5, 14.2),
  createAuroraRibbon(materials.auroraGreen, 7, 25, -26, 4.1, 17.4),
  createAuroraRibbon(materials.auroraViolet, 23, 16, -30, 5.2, 13.5)
];

function createStars() {
  const starPositions = [];
  for (let index = 0; index < 650; index++) {
    const x = range(-58, 58);
    const y = range(8, 42);
    const z = range(-64, 10);
    starPositions.push(x, y, z);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(starPositions, 3)
  );
  geometry.computeBoundingSphere();

  const stars = new THREE.Points(geometry, materials.star);
  scene.add(stars);
  return stars;
}

createStars();

function createReflections() {
  const positions = [];
  for (let index = 0; index < 220; index++) {
    const x = range(-29, 29);
    const z = range(-33, 12);
    const y = -0.27 + range(-0.008, 0.008);
    positions.push(x, y, z);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(positions, 3)
  );
  geometry.computeBoundingSphere();

  const reflections = new THREE.Points(geometry, materials.reflection);
  scene.add(reflections);
  return reflections;
}

const reflections = createReflections();

function createIceDust() {
  const positions = [];
  for (let index = 0; index < 130; index++) {
    positions.push(
      range(-25, 25),
      range(0.4, 5.5),
      range(-30, 8)
    );
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(positions, 3)
  );
  geometry.computeBoundingSphere();

  const dustMaterial = new THREE.PointsMaterial({
    color: 0xa8d8e5,
    size: 0.045,
    transparent: true,
    opacity: 0.5,
    depthWrite: false
  });
  const dust = new THREE.Points(geometry, dustMaterial);
  scene.add(dust);
  return dust;
}

const iceDust = createIceDust();

function updateAurora(mesh, time) {
  const positionAttribute = mesh.geometry.getAttribute("position");
  const data = positionAttribute.array;
  const segmentCount = mesh.userData.segmentCount;

  for (let index = 0; index <= segmentCount; index++) {
    const t = index / segmentCount;
    const x = mesh.userData.startX + t * mesh.userData.width;
    const wave =
      Math.sin(t * 8.3 + mesh.userData.phase + time * 0.22) * 1.6 +
      Math.sin(t * 17.2 + mesh.userData.phase * 0.7 + time * 0.14) * 0.45;
    const z = mesh.userData.baseZ + wave;

    const first = index * 6;
    data[first] = x;
    data[first + 1] = 6.4 + Math.sin(t * 4.2 + time * 0.15) * 0.15;
    data[first + 2] = z;

    data[first + 3] = x;
    data[first + 4] =
      mesh.userData.height +
      Math.sin(t * 5.1 + mesh.userData.phase + time * 0.19) * 0.7;
    data[first + 5] =
      z +
      Math.sin(t * 4.8 + mesh.userData.phase + time * 0.11) * 1.1;
  }

  positionAttribute.needsUpdate = true;
}

function updateFloe(group, time) {
  const phase = group.userData.phase;
  const drift = group.userData.drift;
  group.position.x = group.userData.baseX + Math.sin(time * drift + phase) * 0.17;
  group.position.z = group.userData.baseZ + Math.cos(time * drift * 0.72 + phase) * 0.14;
  group.rotation.y = Math.sin(time * drift * 0.52 + phase) * 0.018;
}

function updateSeal(seal, time) {
  const phase = seal.userData.phase;
  seal.position.y =
    seal.userData.baseY +
    Math.sin(time * 1.45 + phase) * 0.035;
  seal.rotation.z = Math.sin(time * 1.1 + phase) * 0.025;
}

function animate() {
  requestAnimationFrame(animate);

  const elapsed = performance.now() * 0.001;

  for (const ribbon of auroraRibbons) {
    updateAurora(ribbon, elapsed);
  }

  for (const floe of floeRecords) {
    updateFloe(floe, elapsed);
  }

  bear.position.y = bear.userData.baseY + Math.sin(elapsed * 1.25 + bear.userData.phase) * 0.022;
  bear.rotation.z = Math.sin(elapsed * 0.78 + bear.userData.phase) * 0.012;

  cub.position.y = cub.userData.baseY + Math.sin(elapsed * 1.45 + cub.userData.phase) * 0.035;
  cub.rotation.z = Math.sin(elapsed * 1.1 + cub.userData.phase) * 0.022;

  for (const seal of seals) {
    updateSeal(seal, elapsed);
  }

  breathingHole.rotation.y = Math.sin(elapsed * 0.22) * 0.03;
  iglooLight.intensity = 3.55 + Math.sin(elapsed * 4.1) * 0.24;
  reflections.material.opacity = 0.39 + Math.sin(elapsed * 0.8) * 0.07;
  iceDust.rotation.y = elapsed * 0.004;

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
