<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raincoat Mannequin</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #dfe7e9;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe7e9);
scene.fog = new THREE.Fog(0xdfe7e9, 9, 18);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.5, 3.3, 6.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.target.set(0, 1.7, 0);
controls.minDistance = 3.7;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.49;

const hemi = new THREE.HemisphereLight(0xf4fbff, 0x738087, 2.0);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 3.2);
key.position.set(-4, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -2;
key.shadow.bias = -0.0005;
scene.add(key);

const rim = new THREE.DirectionalLight(0xa6d9e6, 1.8);
rim.position.set(4, 4, -4);
scene.add(rim);

const coatMaterial = new THREE.MeshStandardMaterial({
  color: 0x2d7c86,
  roughness: 0.72,
  metalness: 0.02
});
const coatDarkMaterial = new THREE.MeshStandardMaterial({
  color: 0x205e68,
  roughness: 0.78,
  metalness: 0.02
});
const mannequinMaterial = new THREE.MeshStandardMaterial({
  color: 0xb9c2c0,
  roughness: 0.88,
  metalness: 0
});
const bootMaterial = new THREE.MeshStandardMaterial({
  color: 0x182b30,
  roughness: 0.48,
  metalness: 0.08
});
const soleMaterial = new THREE.MeshStandardMaterial({
  color: 0x0c171a,
  roughness: 0.82
});
const brassMaterial = new THREE.MeshStandardMaterial({
  color: 0xb58a42,
  roughness: 0.38,
  metalness: 0.65
});
const baseMaterial = new THREE.MeshStandardMaterial({
  color: 0x76868a,
  roughness: 0.62,
  metalness: 0.18
});

function addMesh(geometry, material, position, rotation = null, scale = null) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(position);
  if (rotation) mesh.rotation.set(rotation.x, rotation.y, rotation.z);
  if (scale) mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function cylinderBetween(start, end, radius, material, radialSegments = 24) {
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius * 1.04, length, radialSegments, 1),
    material
  );
  mesh.position.copy(midpoint);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

const base = addMesh(
  new THREE.CylinderGeometry(1.72, 1.84, 0.24, 64),
  baseMaterial,
  new THREE.Vector3(0, 0.12, 0)
);
const baseInset = addMesh(
  new THREE.CylinderGeometry(1.42, 1.48, 0.045, 64),
  new THREE.MeshStandardMaterial({ color: 0x9aa7a8, roughness: 0.7 }),
  new THREE.Vector3(0, 0.255, 0)
);
const baseTrim = addMesh(
  new THREE.TorusGeometry(1.53, 0.035, 12, 64),
  brassMaterial,
  new THREE.Vector3(0, 0.275, 0)
);
baseTrim.rotation.x = Math.PI / 2;

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(22, 96),
  new THREE.MeshStandardMaterial({ color: 0xcbd5d6, roughness: 0.96 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.01;
floor.receiveShadow = true;
scene.add(floor);

const leftLeg = cylinderBetween(
  new THREE.Vector3(-0.25, 1.05, 0),
  new THREE.Vector3(-0.28, 0.48, 0),
  0.18,
  mannequinMaterial
);
const rightLeg = cylinderBetween(
  new THREE.Vector3(0.25, 1.05, 0),
  new THREE.Vector3(0.28, 0.48, 0),
  0.18,
  mannequinMaterial
);

function makeBoot(x) {
  const shaft = addMesh(
    new THREE.CylinderGeometry(0.22, 0.245, 0.54, 32),
    bootMaterial,
    new THREE.Vector3(x, 0.51, 0)
  );
  const foot = addMesh(
    new THREE.BoxGeometry(0.47, 0.27, 0.72),
    bootMaterial,
    new THREE.Vector3(x, 0.27, 0.13)
  );
  foot.geometry.translate(0, 0, 0.08);
  const sole = addMesh(
    new THREE.BoxGeometry(0.51, 0.075, 0.76),
    soleMaterial,
    new THREE.Vector3(x, 0.125, 0.15)
  );
  const cuff = addMesh(
    new THREE.TorusGeometry(0.218, 0.025, 10, 32),
    brassMaterial,
    new THREE.Vector3(x, 0.79, 0)
  );
  cuff.rotation.x = Math.PI / 2;
  shaft.receiveShadow = true;
  return { shaft, foot, sole, cuff };
}
makeBoot(-0.28);
makeBoot(0.28);

const coatBody = addMesh(
  new THREE.ConeGeometry(1.02, 1.82, 64, 1, false),
  coatMaterial,
  new THREE.Vector3(0, 1.84, 0)
);
coatBody.scale.x = 0.78;
coatBody.scale.z = 0.48;

const lowerHem = addMesh(
  new THREE.TorusGeometry(0.76, 0.055, 12, 64),
  coatDarkMaterial,
  new THREE.Vector3(0, 0.94, 0)
);
lowerHem.rotation.x = Math.PI / 2;
lowerHem.scale.z = 0.62;

const neck = addMesh(
  new THREE.CylinderGeometry(0.22, 0.24, 0.3, 32),
  mannequinMaterial,
  new THREE.Vector3(0, 2.82, 0)
);
const head = addMesh(
  new THREE.SphereGeometry(0.44, 48, 32),
  mannequinMaterial,
  new THREE.Vector3(0, 3.32, 0)
);
head.scale.set(0.88, 1.08, 0.84);

const leftShoulder = new THREE.Vector3(-0.55, 2.48, 0);
const rightShoulder = new THREE.Vector3(0.55, 2.48, 0);
const leftElbow = new THREE.Vector3(-0.77, 1.95, 0.01);
const rightElbow = new THREE.Vector3(0.77, 1.95, 0.01);
const leftWrist = new THREE.Vector3(-0.72, 1.43, 0.02);
const rightWrist = new THREE.Vector3(0.72, 1.43, 0.02);

cylinderBetween(leftShoulder, leftElbow, 0.25, coatMaterial);
cylinderBetween(leftElbow, leftWrist, 0.21, coatMaterial);
cylinderBetween(rightShoulder, rightElbow, 0.25, coatMaterial);
cylinderBetween(rightElbow, rightWrist, 0.21, coatMaterial);

addMesh(new THREE.SphereGeometry(0.16, 24, 16), mannequinMaterial, leftWrist);
addMesh(new THREE.SphereGeometry(0.16, 24, 16), mannequinMaterial, rightWrist);

const leftCuff = addMesh(
  new THREE.TorusGeometry(0.205, 0.035, 10, 32),
  coatDarkMaterial,
  leftWrist
);
leftCuff.rotation.x = Math.PI / 2;
const rightCuff = addMesh(
  new THREE.TorusGeometry(0.205, 0.035, 10, 32),
  coatDarkMaterial,
  rightWrist
);
rightCuff.rotation.x = Math.PI / 2;

const collar = addMesh(
  new THREE.TorusGeometry(0.38, 0.075, 12, 48),
  coatDarkMaterial,
  new THREE.Vector3(0, 2.77, 0)
);
collar.rotation.x = Math.PI / 2;
collar.scale.z = 0.78;

const leftLap = addMesh(
  new THREE.BoxGeometry(0.16, 0.68, 0.08),
  coatDarkMaterial,
  new THREE.Vector3(-0.19, 2.43, 0.47),
  new THREE.Vector3(0, 0, -0.28)
);
const rightLap = addMesh(
  new THREE.BoxGeometry(0.16, 0.68, 0.08),
  coatDarkMaterial,
  new THREE.Vector3(0.19, 2.43, 0.47),
  new THREE.Vector3(0, 0, 0.28)
);

const belt = addMesh(
  new THREE.TorusGeometry(0.65, 0.075, 12, 64),
  coatDarkMaterial,
  new THREE.Vector3(0, 1.91, 0)
);
belt.rotation.x = Math.PI / 2;
belt.scale.z = 0.62;

const buckle = addMesh(
  new THREE.BoxGeometry(0.24, 0.22, 0.07),
  brassMaterial,
  new THREE.Vector3(0, 1.91, 0.49)
);
const buckleInner = addMesh(
  new THREE.BoxGeometry(0.12, 0.1, 0.075),
  coatDarkMaterial,
  new THREE.Vector3(0, 1.91, 0.53)
);

const buttonGeometry = new THREE.SphereGeometry(0.055, 20, 12);
for (let i = 0; i < 4; i++) {
  addMesh(
    buttonGeometry,
    brassMaterial,
    new THREE.Vector3(0, 2.38 - i * 0.28, 0.51)
  );
}

const hoodBack = addMesh(
  new THREE.TorusGeometry(0.39, 0.08, 12, 48, Math.PI),
  coatMaterial,
  new THREE.Vector3(0, 2.93, -0.08),
  new THREE.Vector3(Math.PI / 2, 0, Math.PI)
);
hoodBack.scale.set(1, 0.75, 0.92);

const groundGlow = new THREE.Mesh(
  new THREE.CircleGeometry(1.2, 64),
  new THREE.MeshBasicMaterial({ color: 0xb7ced0, transparent: true, opacity: 0.2 })
);
groundGlow.rotation.x = -Math.PI / 2;
groundGlow.position.y = 0.285;
scene.add(groundGlow);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  groundGlow.material.opacity = 0.17 + Math.sin(elapsed * 1.4) * 0.025;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
