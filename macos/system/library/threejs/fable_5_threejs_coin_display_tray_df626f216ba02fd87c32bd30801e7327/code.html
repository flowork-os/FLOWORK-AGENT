<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ancient Coin Display Tray</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a1712;}
  canvas{display:block;}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1712);
scene.fog = new THREE.Fog(0x1a1712, 30, 60);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(7, 8.5, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.target.set(0, 0.4, 0);
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 5;
controls.maxDistance = 25;

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xfff3e0, 0x2a2018, 0.5));

const key = new THREE.DirectionalLight(0xfff0d8, 2.2);
key.position.set(6, 10, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -9; key.shadow.camera.right = 9;
key.shadow.camera.top = 9; key.shadow.camera.bottom = -9;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9db8ff, 0.45);
fill.position.set(-7, 5, -5);
scene.add(fill);

const rim = new THREE.SpotLight(0xffe6b8, 25, 40, Math.PI/6, 0.5, 1.5);
rim.position.set(-4, 9, 7);
scene.add(rim);

// ---------- Ground (soft shadow catcher) ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(24, 48).rotateX(-Math.PI/2),
  new THREE.ShadowMaterial({ opacity: 0.45 })
);
ground.receiveShadow = true;
scene.add(ground);

const groundDisc = new THREE.Mesh(
  new THREE.CircleGeometry(24, 48).rotateX(-Math.PI/2),
  new THREE.MeshStandardMaterial({ color: 0x211c15, roughness: 1 })
);
groundDisc.position.y = -0.005;
groundDisc.receiveShadow = true;
scene.add(groundDisc);

// ---------- Materials ----------
const feltMat = new THREE.MeshStandardMaterial({ color: 0x3d1f24, roughness: 0.97, metalness: 0.0 });
const feltDark = new THREE.MeshStandardMaterial({ color: 0x2e161b, roughness: 0.98, metalness: 0.0 });
const woodMat = new THREE.MeshStandardMaterial({ color: 0x4a3320, roughness: 0.55, metalness: 0.05 });

function coinMat(hue, sat, lit, rough, metal) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(hue, sat, lit),
    roughness: rough, metalness: metal
  });
}
const metals = [
  () => coinMat(0.11, 0.45, 0.42, 0.42, 0.95), // aged gold
  () => coinMat(0.09, 0.30, 0.30, 0.55, 0.9),  // dark bronze
  () => coinMat(0.13, 0.05, 0.55, 0.35, 0.95), // worn silver
  () => coinMat(0.07, 0.50, 0.26, 0.6, 0.85),  // copper patina base
  () => coinMat(0.10, 0.35, 0.36, 0.5, 0.9)    // brass
];

// ---------- Tray group (centered) ----------
const tray = new THREE.Group();
scene.add(tray);

const TW = 9, TD = 6.4, TH = 0.7, WALL = 0.35;

// slot layout: [x, z, radius]
const slots = [
  [-2.9, -1.7, 0.95], [ 0.0, -1.7, 0.80], [ 2.9, -1.7, 1.05],
  [-2.9,  1.7, 0.75], [ 0.0,  1.7, 1.00], [ 2.9,  1.7, 0.88]
];

// Tray base slab with recessed slots via Shape + holes (top plate), plus solid bottom
function roundedRectShape(w, d, r) {
  const s = new THREE.Shape();
  const x = -w/2, y = -d/2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + d - r); s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
  s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

// Bottom slab (wood)
const bottom = new THREE.Mesh(
  new THREE.ExtrudeGeometry(roundedRectShape(TW, TD, 0.4), { depth: 0.28, bevelEnabled: true, bevelSize: 0.06, bevelThickness: 0.06, bevelSegments: 3, curveSegments: 24 }),
  woodMat
);
bottom.rotation.x = -Math.PI/2;
bottom.position.y = 0.34;
bottom.castShadow = bottom.receiveShadow = true;
tray.add(bottom);

// Felt top plate with circular holes (slot recesses)
const topShape = roundedRectShape(TW - WALL, TD - WALL, 0.3);
for (const [sx, sz, r] of slots) {
  const hole = new THREE.Path();
  hole.absarc(sx, -sz, r + 0.1, 0, Math.PI * 2, true);
  topShape.holes.push(hole);
}
const topPlate = new THREE.Mesh(
  new THREE.ExtrudeGeometry(topShape, { depth: 0.22, bevelEnabled: true, bevelSize: 0.03, bevelThickness: 0.03, bevelSegments: 2, curveSegments: 32 }),
  feltMat
);
topPlate.rotation.x = -Math.PI/2;
topPlate.position.y = 0.62;
topPlate.castShadow = topPlate.receiveShadow = true;
tray.add(topPlate);

// Slot floors + walls (felt)
for (const [sx, sz, r] of slots) {
  const floor = new THREE.Mesh(new THREE.CylinderGeometry(r + 0.1, r + 0.1, 0.05, 40), feltDark);
  floor.position.set(sx, 0.40, sz);
  floor.receiveShadow = true;
  tray.add(floor);
  const wallG = new THREE.CylinderGeometry(r + 0.1, r + 0.1, 0.27, 40, 1, true);
  const wall = new THREE.Mesh(wallG, new THREE.MeshStandardMaterial({ color: 0x33191e, roughness: 0.98, side: THREE.BackSide }));
  wall.position.set(sx, 0.55, sz);
  tray.add(wall);
}

// Wooden rim frame around tray
const rimShape = roundedRectShape(TW, TD, 0.4);
const rimHole = roundedRectShape(TW - WALL, TD - WALL, 0.3);
rimShape.holes.push(rimHole);
const rimMesh = new THREE.Mesh(
  new THREE.ExtrudeGeometry(rimShape, { depth: TH - 0.28, bevelEnabled: true, bevelSize: 0.05, bevelThickness: 0.05, bevelSegments: 3, curveSegments: 24 }),
  woodMat
);
rimMesh.rotation.x = -Math.PI/2;
rimMesh.position.y = 0.30 + TH - 0.28;
rimMesh.castShadow = rimMesh.receiveShadow = true;
tray.add(rimMesh);

// Small feet
for (const fx of [-TW/2 + 0.7, TW/2 - 0.7]) for (const fz of [-TD/2 + 0.6, TD/2 - 0.6]) {
  const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 0.34, 20), woodMat);
  foot.position.set(fx, 0.17, fz);
  foot.castShadow = true;
  tray.add(foot);
}

// ---------- Coins ----------
// Deterministic pseudo-random
let seed = 7;
function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }

function makeCoin(radius, matFn, reliefType) {
  const g = new THREE.Group();
  const mat = matFn();
  const thick = 0.14 + rnd() * 0.05;

  // Slightly irregular ancient coin body (lathe-ish via scaled cylinder + noise on rim)
  const bodyGeo = new THREE.CylinderGeometry(radius, radius * (0.96 + rnd() * 0.04), thick, 48);
  const pos = bodyGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const a = Math.atan2(z, x);
    const wob = 1 + 0.025 * Math.sin(a * 5 + radius * 13) + 0.018 * Math.sin(a * 9 + radius * 7);
    const rr = Math.hypot(x, z);
    if (rr > radius * 0.5) { pos.setX(i, x * wob); pos.setZ(i, z * wob); }
  }
  bodyGeo.computeVertexNormals();
  const body = new THREE.Mesh(bodyGeo, mat);
  body.castShadow = body.receiveShadow = true;
  g.add(body);

  const topY = thick / 2;
  const reliefMat = mat.clone();
  reliefMat.roughness = Math.max(0.25, mat.roughness - 0.1);

  function addRelief(mesh, y) {
    mesh.position.y = y;
    mesh.castShadow = true;
    g.add(mesh);
  }

  // Raised rim ring (all coins)
  addRelief(new THREE.Mesh(new THREE.TorusGeometry(radius * 0.9, 0.028, 10, 56).rotateX(Math.PI/2), reliefMat), topY);

  if (reliefType === 0) {
    // Profile bust: offset dome + laurel dots
    const bust = new THREE.Mesh(new THREE.SphereGeometry(radius * 0.42, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2).scale(0.8, 0.55, 1), reliefMat);
    bust.position.x = -radius * 0.08;
    addRelief(bust, topY);
    for (let i = 0; i < 10; i++) {
      const a = -0.5 + i * 0.34;
      const dot = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 6), reliefMat);
      dot.position.set(Math.cos(a) * radius * 0.7, 0, Math.sin(a) * radius * 0.7);
      addRelief(dot, topY + 0.01);
    }
  } else if (reliefType === 1) {
    // Star / sunburst rays
    for (let i = 0; i < 8; i++) {
      const ray = new THREE.Mesh(new THREE.BoxGeometry(radius * 0.62, 0.045, 0.09), reliefMat);
      ray.rotation.y = (i / 8) * Math.PI;
      addRelief(ray, topY + 0.015);
    }
    addRelief(new THREE.Mesh(new THREE.SphereGeometry(radius * 0.16, 16, 12).scale(1, 0.5, 1), reliefMat), topY);
  } else if (reliefType === 2) {
    // Concentric rings + center boss
    addRelief(new THREE.Mesh(new THREE.TorusGeometry(radius * 0.55, 0.03, 10, 48).rotateX(Math.PI/2), reliefMat), topY);
    addRelief(new THREE.Mesh(new THREE.TorusGeometry(radius * 0.3, 0.028, 10, 40).rotateX(Math.PI/2), reliefMat), topY);
    addRelief(new THREE.Mesh(new THREE.SphereGeometry(radius * 0.1, 14, 10).scale(1, 0.6, 1), reliefMat), topY);
  } else if (reliefType === 3) {
    // Cross / quartered with pellets
    for (let i = 0; i < 2; i++) {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(radius * 1.35, 0.05, 0.13), reliefMat);
      bar.rotation.y = i * Math.PI / 2;
      addRelief(bar, topY + 0.015);
    }
    for (let i = 0; i < 4; i++) {
      const a = Math.PI/4 + i * Math.PI/2;
      const p = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), reliefMat);
      p.position.set(Math.cos(a) * radius * 0.5, 0, Math.sin(a) * radius * 0.5);
      addRelief(p, topY + 0.01);
    }
  } else {
    // Owl-like standing figure: column + head + pellet field
    const col = new THREE.Mesh(new THREE.CapsuleGeometry(radius * 0.14, radius * 0.42, 6, 12), reliefMat);
    col.scale.set(1, 0.5, 1);
    col.rotation.x = Math.PI / 2; col.rotation.z = Math.PI / 2;
    addRelief(col, topY + 0.02);
    const head = new THREE.Mesh(new THREE.SphereGeometry(radius * 0.16, 14, 10).scale(1, 0.55, 1), reliefMat);
    head.position.z = -radius * 0.38;
    addRelief(head, topY + 0.02);
    for (let i = 0; i < 6; i++) {
      const a = i * 1.047 + 0.3;
      const d = new THREE.Mesh(new THREE.SphereGeometry(0.04, 8, 6), reliefMat);
      d.position.set(Math.cos(a) * radius * 0.68, 0, Math.sin(a) * radius * 0.68);
      addRelief(d, topY + 0.01);
    }
  }
  return g;
}

slots.forEach(([sx, sz, r], i) => {
  const coin = makeCoin(r * 0.86, metals[i % metals.length], i % 5);
  coin.position.set(sx, 0.50, sz);
  coin.rotation.y = rnd() * Math.PI * 2;
  tray.add(coin);
});

// Subtle brass nameplate
const plate = new THREE.Mesh(
  new THREE.BoxGeometry(2.2, 0.05, 0.5),
  new THREE.MeshStandardMaterial({ color: 0xb08d3f, roughness: 0.35, metalness: 0.9 })
);
plate.position.set(0, 0.73, TD/2 - 0.16);
plate.castShadow = true;
tray.add(plate);

// ---------- Resize & animate ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
