<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forklift</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe3e8; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe3e8);
scene.fog = new THREE.Fog(0xdfe3e8, 18, 40);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.5, 4.5, 7.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 4;
controls.maxDistance = 20;

// Lighting
scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 0.55));
const sun = new THREE.DirectionalLight(0xfff2e0, 1.6);
sun.position.set(6, 10, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
sun.shadow.bias = -0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.4);
fill.position.set(-6, 4, -6);
scene.add(fill);

// Ground with soft shadow
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(20, 64),
  new THREE.MeshStandardMaterial({ color: 0xcfd4da, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Materials
const yellow = new THREE.MeshStandardMaterial({ color: 0xf4a900, roughness: 0.4, metalness: 0.25 });
const dark = new THREE.MeshStandardMaterial({ color: 0x2b2f33, roughness: 0.6, metalness: 0.4 });
const steel = new THREE.MeshStandardMaterial({ color: 0x8a9299, roughness: 0.35, metalness: 0.8 });
const forkSteel = new THREE.MeshStandardMaterial({ color: 0x3a3f45, roughness: 0.45, metalness: 0.7 });
const tire = new THREE.MeshStandardMaterial({ color: 0x1a1a1c, roughness: 0.9, metalness: 0 });
const hub = new THREE.MeshStandardMaterial({ color: 0xc9ced3, roughness: 0.3, metalness: 0.85 });
const seatMat = new THREE.MeshStandardMaterial({ color: 0x24262a, roughness: 0.85 });

const forklift = new THREE.Group();
scene.add(forklift);
function add(parent, geo, mat, x, y, z, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}

// ---- Body (front = +z) ----
add(forklift, new THREE.BoxGeometry(1.5, 0.5, 2.6), yellow, 0, 0.55, -0.1); // chassis
add(forklift, new THREE.BoxGeometry(1.4, 0.55, 1.1), yellow, 0, 1.05, -0.35); // engine hood
add(forklift, new THREE.BoxGeometry(1.45, 0.85, 0.75), dark, 0, 0.85, -1.25); // counterweight core
const cw = add(forklift, new THREE.CylinderGeometry(0.72, 0.78, 1.35, 24, 1, false, Math.PI, Math.PI), yellow, 0, 0.85, -1.25, 0, 0, Math.PI / 2);
cw.rotation.order = 'ZYX';
add(forklift, new THREE.BoxGeometry(1.3, 0.12, 0.7), dark, 0, 0.86, 0.55); // floor plate
add(forklift, new THREE.BoxGeometry(1.2, 0.5, 0.15), dark, 0, 1.1, 0.85); // dash
// steering column + wheel
add(forklift, new THREE.CylinderGeometry(0.035, 0.035, 0.55, 12), steel, 0, 1.45, 0.72, 0.6);
add(forklift, new THREE.TorusGeometry(0.19, 0.03, 10, 24), dark, 0, 1.62, 0.62, 0.95);
// seat
add(forklift, new THREE.BoxGeometry(0.62, 0.12, 0.55), seatMat, 0, 1.02, -0.05);
add(forklift, new THREE.BoxGeometry(0.62, 0.62, 0.14), seatMat, 0, 1.38, -0.36, -0.12);

// ---- Overhead guard cage ----
const postGeo = new THREE.CylinderGeometry(0.045, 0.045, 1.55, 10);
[[-0.62, 0.55], [0.62, 0.55], [-0.62, -0.85], [0.62, -0.85]].forEach(([x, z]) => {
  const p = add(forklift, postGeo, dark, x, 1.85, z);
  if (z > 0) { p.rotation.x = -0.12; p.position.z += 0.09; }
});
const roof = new THREE.Group();
add(roof, new THREE.BoxGeometry(1.36, 0.07, 1.75), dark, 0, 0, 0);
for (let i = -2; i <= 2; i++) add(roof, new THREE.BoxGeometry(0.05, 0.03, 1.6), steel, i * 0.28, 0.05, 0);
roof.position.set(0, 2.62, -0.12);
forklift.add(roof);

// ---- Mast ----
const mast = new THREE.Group();
const railGeo = new THREE.BoxGeometry(0.12, 2.9, 0.18);
add(mast, railGeo, forkSteel, -0.5, 1.45, 0);
add(mast, railGeo, forkSteel, 0.5, 1.45, 0);
const inRailGeo = new THREE.BoxGeometry(0.09, 2.6, 0.12);
add(mast, inRailGeo, steel, -0.33, 1.55, 0.02);
add(mast, inRailGeo, steel, 0.33, 1.55, 0.02);
[0.35, 1.5, 2.75].forEach(y => add(mast, new THREE.BoxGeometry(1.1, 0.1, 0.1), forkSteel, 0, y, -0.08));
add(mast, new THREE.CylinderGeometry(0.05, 0.05, 2.3, 12), steel, 0, 1.3, -0.04); // lift cylinder
add(mast, new THREE.CylinderGeometry(0.16, 0.16, 0.1, 16), forkSteel, 0, 2.5, -0.04); // chain sheave
mast.position.set(0, 0.12, 1.35);
mast.rotation.x = 0.04;
forklift.add(mast);
// tilt cylinders
[-0.55, 0.55].forEach(x => {
  const c = add(forklift, new THREE.CylinderGeometry(0.045, 0.045, 0.9, 10), steel, x, 0.85, 0.95);
  c.rotation.x = Math.PI / 2 - 0.35;
});

// ---- Fork carriage + forks ----
const carriage = new THREE.Group();
add(carriage, new THREE.BoxGeometry(1.05, 0.55, 0.08), forkSteel, 0, 0.28, 0);
add(carriage, new THREE.BoxGeometry(1.05, 0.07, 0.1), steel, 0, 0.56, 0.01);
[-0.28, 0.28].forEach(x => {
  add(carriage, new THREE.BoxGeometry(0.14, 0.62, 0.1), forkSteel, x, 0.31, 0.06); // vertical shank
  add(carriage, new THREE.BoxGeometry(0.14, 0.06, 1.5), forkSteel, x, 0.03, 0.8);  // blade
  add(carriage, new THREE.BoxGeometry(0.14, 0.05, 0.16), forkSteel, x, 0.035, 1.55, -0.12); // tip taper
});
carriage.position.set(0, 0.42, 1.48);
carriage.rotation.x = 0.04;
forklift.add(carriage);

// ---- Wheels ----
function wheel(x, z, r, w) {
  const g = new THREE.Group();
  const t = add(g, new THREE.CylinderGeometry(r, r, w, 28), tire, 0, 0, 0, 0, 0, Math.PI / 2);
  add(g, new THREE.CylinderGeometry(r * 0.55, r * 0.55, w + 0.02, 20), hub, 0, 0, 0, 0, 0, Math.PI / 2);
  add(g, new THREE.CylinderGeometry(r * 0.16, r * 0.16, w + 0.06, 12), dark, 0, 0, 0, 0, 0, Math.PI / 2);
  g.position.set(x, r, z);
  forklift.add(g);
  return g;
}
// large front drive wheels, smaller rear steer wheels
wheel(-0.78, 0.75, 0.42, 0.3); wheel(0.78, 0.75, 0.42, 0.3);
wheel(-0.6, -1.05, 0.3, 0.24); wheel(0.6, -1.05, 0.3, 0.24);
// fenders over front wheels
[-0.78, 0.78].forEach(x => {
  const f = add(forklift, new THREE.CylinderGeometry(0.52, 0.52, 0.34, 20, 1, true, -Math.PI * 0.15, Math.PI * 0.8), yellow, x, 0.42, 0.75, 0, 0, Math.PI / 2);
  f.material = f.material.clone();
  f.material.side = THREE.DoubleSide;
});

// center + drop to ground
const box = new THREE.Box3().setFromObject(forklift);
const c = box.getCenter(new THREE.Vector3());
forklift.position.set(-c.x, -box.min.y, -c.z);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
