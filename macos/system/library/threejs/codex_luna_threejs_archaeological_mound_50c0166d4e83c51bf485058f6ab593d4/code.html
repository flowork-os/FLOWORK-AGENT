<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archaeological Mound</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #b9b09d; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbab3a3);
scene.fog = new THREE.Fog(0xbab3a3, 34, 72);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 120);
camera.position.set(16, -18, 12);
camera.lookAt(0, 0, 1.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;
controls.minDistance = 9;
controls.maxDistance = 38;
controls.maxPolarAngle = Math.PI * 0.48;
controls.target.set(0, 0, 1.35);

scene.add(new THREE.HemisphereLight(0xe8e2d0, 0x5a4939, 1.8));

const sun = new THREE.DirectionalLight(0xffe6bd, 3.1);
sun.position.set(-14, -16, 24);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -22;
sun.shadow.camera.right = 22;
sun.shadow.camera.top = 22;
sun.shadow.camera.bottom = -22;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 65;
sun.shadow.bias = -0.0005;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x9eb7ca, 0.65);
fill.position.set(18, 7, 11);
scene.add(fill);

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x817765,
  roughness: 1,
  metalness: 0
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(70, 70), groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(70, 35, 0x655d51, 0x756d60);
grid.position.y = 0.012;
grid.material.transparent = true;
grid.material.opacity = 0.34;
scene.add(grid);

const moundRadius = 9;
const moundHeight = 3.15;
const sectors = 96;
const ringCount = 22;
const ringRadii = [];
for (let i = 0; i < ringCount; i++) ringRadii.push(0.2 + (moundRadius - 0.2) * i / (ringCount - 1));

function terrainHeight(x, y) {
  const r = Math.sqrt(x * x + y * y);
  if (r >= moundRadius) return 0.035;
  const irregularity =
    1 +
    0.018 * Math.sin(Math.atan2(y, x) * 5 + 0.8) * Math.pow(r / moundRadius, 1.4) +
    0.012 * Math.sin(r * 2.3 + x * 0.7);
  const rr = Math.min(moundRadius, r * irregularity);
  return moundHeight * Math.pow(Math.max(0, 1 - (rr / moundRadius) ** 2), 0.56) + 0.04;
}

const moundPositions = [];
const moundIndices = [];
moundPositions.push(0, 0, moundHeight + 0.04);

for (let ring = 0; ring < ringCount; ring++) {
  const baseR = ringRadii[ring];
  for (let s = 0; s < sectors; s++) {
    const angle = s / sectors * Math.PI * 2;
    const radialVariation = 1 + 0.018 * Math.sin(angle * 5.0 + 0.8) * Math.pow(baseR / moundRadius, 1.4);
    const r = baseR * radialVariation;
    const x = Math.cos(angle) * r;
    const y = Math.sin(angle) * r;
    moundPositions.push(x, y, terrainHeight(x, y));
  }
}

for (let s = 0; s < sectors; s++) {
  const next = (s + 1) % sectors;
  moundIndices.push(0, 1 + s, 1 + next);
}
for (let ring = 0; ring < ringCount - 1; ring++) {
  const a = 1 + ring * sectors;
  const b = a + sectors;
  for (let s = 0; s < sectors; s++) {
    const n = (s + 1) % sectors;
    moundIndices.push(a + s, b + s, b + n);
    moundIndices.push(a + s, b + n, a + n);
  }
}

const moundGeometry = new THREE.BufferGeometry();
moundGeometry.setAttribute("position", new THREE.Float32BufferAttribute(moundPositions, 3));
moundGeometry.setIndex(moundIndices);
moundGeometry.computeVertexNormals();

const mound = new THREE.Mesh(moundGeometry, new THREE.MeshStandardMaterial({
  color: 0x765b3e,
  roughness: 0.97,
  metalness: 0
}));
mound.castShadow = true;
mound.receiveShadow = true;
scene.add(mound);

function makeRibbon(points, material) {
  const positions = [];
  const indices = [];
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    const forward = points[Math.min(i + 1, points.length - 1)].clone().sub(points[Math.max(0, i - 1)]);
    const side = new THREE.Vector3(-forward.y, forward.x, 0).normalize();
    const width = p.w;
    const left = p.clone().addScaledVector(side, width);
    const right = p.clone().addScaledVector(side, -width);
    positions.push(left.x, left.y, left.z, right.x, right.y, right.z);
    if (i < points.length - 1) {
      const k = i * 2;
      indices.push(k, k + 1, k + 2, k + 1, k + 3, k + 2);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.receiveShadow = true;
  mesh.castShadow = true;
  scene.add(mesh);
}

const pathMaterial = new THREE.MeshStandardMaterial({
  color: 0x9b7b55,
  roughness: 1
});

function addPath(startAngle, bend) {
  const points = [];
  const count = 42;
  for (let i = 0; i < count; i++) {
    const t = i / (count - 1);
    const r = 9.8 - t * 8.55;
    const angle = startAngle + bend * Math.sin(t * Math.PI) + 0.035 * Math.sin(t * 8);
    const x = Math.cos(angle) * r;
    const y = Math.sin(angle) * r;
    points.push(new THREE.Vector3(x, y, terrainHeight(x, y) + 0.055));
    points[i].w = 0.62 - t * 0.17;
  }
  makeRibbon(points, pathMaterial);
}

addPath(-2.35, 0.12);
addPath(-0.72, -0.16);

const wornMaterial = new THREE.MeshStandardMaterial({ color: 0x6e5339, roughness: 1 });
function addWornCenter(startAngle, bend) {
  const points = [];
  const count = 34;
  for (let i = 0; i < count; i++) {
    const t = i / (count - 1);
    const r = 9.55 - t * 8.25;
    const angle = startAngle + bend * Math.sin(t * Math.PI);
    const x = Math.cos(angle) * r;
    const y = Math.sin(angle) * r;
    points.push(new THREE.Vector3(x, y, terrainHeight(x, y) + 0.072));
    points[i].w = 0.16 - t * 0.025;
  }
  makeRibbon(points, wornMaterial);
}
addWornCenter(-2.35, 0.12);
addWornCenter(-0.72, -0.16);

const postMaterial = new THREE.MeshStandardMaterial({ color: 0x403329, roughness: 0.9 });
const postBandMaterial = new THREE.MeshStandardMaterial({ color: 0x806348, roughness: 0.88 });

function addMarker(x, y, height, lean) {
  const z = terrainHeight(x, y);
  const group = new THREE.Group();
  group.position.set(x, y, z);
  group.rotation.z = lean;
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.11, height, 8), postMaterial);
  post.position.y = height / 2;
  post.castShadow = true;
  group.add(post);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(0.095, 0.095, 0.075, 8), postBandMaterial);
  band.position.y = height * 0.61;
  band.castShadow = true;
  group.add(band);
  scene.add(group);
}

addMarker(-0.75, 0.42, 1.85, -0.045);
addMarker(1.08, 0.22, 1.48, 0.035);
addMarker(0.35, 1.18, 1.65, -0.025);
addMarker(-1.55, -0.28, 1.28, 0.055);

const stoneMaterial = new THREE.MeshStandardMaterial({ color: 0x857866, roughness: 0.96 });
function addStone(x, y, scale) {
  const z = terrainHeight(x, y);
  const stone = new THREE.Mesh(new THREE.IcosahedronGeometry(scale, 1), stoneMaterial);
  stone.position.set(x, y, z + scale * 0.48);
  stone.scale.set(1.25, 0.9, 0.65);
  stone.rotation.set(0.2, 0.4, Math.atan2(y, x));
  stone.castShadow = true;
  stone.receiveShadow = true;
  scene.add(stone);
}

addStone(-3.3, 1.4, 0.34);
addStone(3.1, -0.7, 0.28);
addStone(-4.1, -2.4, 0.24);
addStone(4.8, 1.5, 0.3);
addStone(1.85, 2.35, 0.21);
addStone(-1.0, 3.0, 0.2);

const grassMaterial = new THREE.MeshStandardMaterial({ color: 0x596044, roughness: 1 });
const dryGrassMaterial = new THREE.MeshStandardMaterial({ color: 0x8b7950, roughness: 1 });

function addGrass(x, y, scale, dry) {
  const z = terrainHeight(x, y);
  const group = new THREE.Group();
  group.position.set(x, y, z);
  for (let i = 0; i < 3; i++) {
    const blade = new THREE.Mesh(new THREE.ConeGeometry(0.028 * scale, 0.55 * scale, 5), dry ? dryGrassMaterial : grassMaterial);
    blade.position.set((i - 1) * 0.065 * scale, (i % 2) * 0.04 * scale, 0.25 * scale);
    blade.rotation.z = (i - 1) * 0.23;
    blade.rotation.x = (i - 1) * 0.12;
    blade.castShadow = true;
    group.add(blade);
  }
  scene.add(group);
}

for (let i = 0; i < 24; i++) {
  const a = i * 2.399;
  const r = 6.6 + (i % 5) * 0.62;
  addGrass(Math.cos(a) * r, Math.sin(a) * r, 0.65 + (i % 3) * 0.14, i % 4 === 0);
}

const cairnMaterial = new THREE.MeshStandardMaterial({ color: 0x6e685d, roughness: 1 });
for (let i = 0; i < 7; i++) {
  const a = i * 0.91;
  const r = 1.9 + (i % 3) * 0.24;
  const x = Math.cos(a) * r;
  const y = Math.sin(a) * r;
  const z = terrainHeight(x, y);
  const pebble = new THREE.Mesh(new THREE.DodecahedronGeometry(0.12 + (i % 2) * 0.035, 0), cairnMaterial);
  pebble.position.set(x, y, z + 0.1);
  pebble.scale.y = 0.72;
  pebble.rotation.set(i * 0.4, i * 0.7, i);
  pebble.castShadow = true;
  scene.add(pebble);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
