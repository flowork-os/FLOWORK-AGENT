<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procedural Barrel Cactus</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9e3d7; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e3d7);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.4, 3.6, 6.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.35, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 3.5;
controls.maxDistance = 11;
controls.maxPolarAngle = Math.PI * 0.49;

const root = new THREE.Group();
scene.add(root);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.ShadowMaterial({ color: 0x665b4b, opacity: 0.18 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const potMaterial = new THREE.MeshStandardMaterial({
  color: 0xa94f2d,
  roughness: 0.72,
  metalness: 0.0
});
const rimMaterial = new THREE.MeshStandardMaterial({
  color: 0x8c3d23,
  roughness: 0.62
});
const soilMaterial = new THREE.MeshStandardMaterial({
  color: 0x2f2018,
  roughness: 1
});

const pot = new THREE.Mesh(
  new THREE.CylinderGeometry(1.16, 0.9, 1.15, 64, 2, true),
  potMaterial
);
pot.position.y = 0.575;
pot.castShadow = true;
pot.receiveShadow = true;
root.add(pot);

const potBottom = new THREE.Mesh(
  new THREE.CylinderGeometry(0.9, 0.9, 0.08, 64),
  potMaterial
);
potBottom.position.y = 0.04;
potBottom.castShadow = true;
root.add(potBottom);

const potRim = new THREE.Mesh(
  new THREE.TorusGeometry(1.17, 0.115, 12, 64),
  rimMaterial
);
potRim.position.y = 1.12;
potRim.rotation.x = Math.PI / 2;
potRim.castShadow = true;
root.add(potRim);

const soil = new THREE.Mesh(
  new THREE.CylinderGeometry(1.05, 1.05, 0.06, 64),
  soilMaterial
);
soil.position.y = 1.1;
soil.castShadow = true;
root.add(soil);

const cactusMaterial = new THREE.MeshStandardMaterial({
  color: 0x376f3e,
  roughness: 0.8,
  metalness: 0.0
});
const ridgeMaterial = new THREE.MeshStandardMaterial({
  color: 0x4c8b4b,
  roughness: 0.82
});
const areoleMaterial = new THREE.MeshStandardMaterial({
  color: 0xd9c487,
  roughness: 0.95
});
const spineMaterial = new THREE.MeshStandardMaterial({
  color: 0xf4e9c9,
  roughness: 0.72
});

function cactusRadius(y) {
  const t = THREE.MathUtils.clamp((y - 1.12) / 2.55, 0, 1);
  const belly = Math.sin(Math.PI * t);
  return 0.64 + 0.28 * Math.pow(belly, 0.58) - 0.15 * Math.pow(t, 3.2);
}

const ribs = 13;
const radialSegments = ribs * 8;
const heightSegments = 52;
const cactusHeight = 2.55;
const positions = [];
const normals = [];
const indices = [];

for (let iy = 0; iy <= heightSegments; iy++) {
  const y = 1.12 + cactusHeight * iy / heightSegments;
  const t = iy / heightSegments;
  const baseR = cactusRadius(y);
  for (let ix = 0; ix <= radialSegments; ix++) {
    const theta = 2 * Math.PI * ix / radialSegments;
    const ribWave = Math.pow(Math.max(0, Math.cos(ribs * theta)), 3.2);
    const radius = baseR * (0.92 + 0.105 * ribWave);
    positions.push(radius * Math.cos(theta), y, radius * Math.sin(theta));
  }
}

for (let iy = 0; iy < heightSegments; iy++) {
  for (let ix = 0; ix < radialSegments; ix++) {
    const a = iy * (radialSegments + 1) + ix;
    const b = a + radialSegments + 1;
    indices.push(a, b, a + 1, b, b + 1, a + 1);
  }
}

const cactusGeometry = new THREE.BufferGeometry();
cactusGeometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
cactusGeometry.setIndex(indices);
cactusGeometry.computeVertexNormals();

const cactus = new THREE.Mesh(cactusGeometry, cactusMaterial);
cactus.castShadow = true;
cactus.receiveShadow = true;
root.add(cactus);

const top = new THREE.Mesh(
  new THREE.SphereGeometry(0.67, 48, 24),
  cactusMaterial
);
top.scale.set(1, 0.46, 1);
top.position.y = 3.64;
top.castShadow = true;
top.receiveShadow = true;
root.add(top);

const ridgeGeometry = new THREE.CapsuleGeometry(0.022, 2.15, 4, 8);
for (let rib = 0; rib < ribs; rib++) {
  const theta = rib * 2 * Math.PI / ribs;
  const ridge = new THREE.Mesh(ridgeGeometry, ridgeMaterial);
  ridge.position.set(0.86 * Math.cos(theta), 2.35, 0.86 * Math.sin(theta));
  ridge.rotation.z = Math.PI / 2;
  ridge.rotation.y = -theta;
  ridge.scale.y = 1.07;
  ridge.castShadow = true;
  root.add(ridge);
}

const areoleGeometry = new THREE.SphereGeometry(0.052, 10, 8);
const spineGeometry = new THREE.CylinderGeometry(0.006, 0.012, 0.28, 6);
spineGeometry.translate(0, 0.14, 0);

for (let rib = 0; rib < ribs; rib++) {
  const theta = rib * 2 * Math.PI / ribs;
  const outward = new THREE.Vector3(Math.cos(theta), 0, Math.sin(theta));
  for (let row = 0; row < 7; row++) {
    const y = 1.37 + row * 0.315;
    const r = cactusRadius(y) * 1.025;
    const x = r * Math.cos(theta);
    const z = r * Math.sin(theta);

    const areole = new THREE.Mesh(areoleGeometry, areoleMaterial);
    areole.position.set(x, y, z);
    areole.castShadow = true;
    root.add(areole);

    for (let s = 0; s < 5; s++) {
      const angle = s * (Math.PI * 2 / 5) + row * 0.31;
      const direction = outward.clone()
        .multiplyScalar(0.72)
        .add(new THREE.Vector3(
          Math.cos(angle) * 0.24,
          0.3 + Math.sin(angle) * 0.21,
          0
        ).applyAxisAngle(outward, angle))
        .normalize();

      const spine = new THREE.Mesh(spineGeometry, spineMaterial);
      spine.position.copy(areole.position);
      spine.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
      spine.castShadow = true;
      root.add(spine);
    }
  }
}

const crownAreoleGeometry = new THREE.SphereGeometry(0.04, 10, 8);
for (let i = 0; i < ribs; i++) {
  const theta = i * Math.PI * 2 / ribs;
  const crown = new THREE.Mesh(crownAreoleGeometry, areoleMaterial);
  crown.position.set(0.42 * Math.cos(theta), 3.83, 0.42 * Math.sin(theta));
  root.add(crown);
}

const hemi = new THREE.HemisphereLight(0xfff6e5, 0x58664d, 1.65);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe4bb, 3.2);
key.position.set(4.5, 7, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -5;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0xb9d8ff, 0.65);
fill.position.set(-4, 3, -5);
scene.add(fill);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
