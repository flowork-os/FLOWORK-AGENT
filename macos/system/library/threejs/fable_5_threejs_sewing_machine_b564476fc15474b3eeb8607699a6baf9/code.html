<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic Sewing Machine</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1a1e; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1e);
scene.fog = new THREE.Fog(0x1a1a1e, 18, 32);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.2, 4.2, 7.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.55, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 4;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.52;

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0x8fa3c0, 0x2a2118, 0.55));

const key = new THREE.DirectionalLight(0xfff2df, 2.2);
key.position.set(6, 9, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6; key.shadow.camera.right = 6;
key.shadow.camera.top = 6; key.shadow.camera.bottom = -6;
key.shadow.camera.near = 2; key.shadow.camera.far = 25;
key.shadow.bias = -0.0004;
key.shadow.radius = 5;
scene.add(key);

const rim = new THREE.DirectionalLight(0x9db8ff, 0.9);
rim.position.set(-7, 4, -6);
scene.add(rim);

const fill = new THREE.PointLight(0xffd9a0, 12, 20, 2);
fill.position.set(-3, 2.5, 4);
scene.add(fill);

// ---------- Procedural textures (wear / speckle) ----------
function makeWearTexture(base, wearSpots) {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, 512, 512);
  // subtle mottling
  for (let i = 0; i < 900; i++) {
    const x = Math.random() * 512, y = Math.random() * 512, r = Math.random() * 3 + 0.5;
    g.fillStyle = `rgba(${Math.random() > 0.5 ? '255,240,210' : '20,18,15'},${Math.random() * 0.05})`;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  // wear patches — brassy scuffs
  for (let i = 0; i < wearSpots; i++) {
    const x = Math.random() * 512, y = Math.random() * 512, r = Math.random() * 26 + 8;
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, 'rgba(168,132,70,0.28)');
    grad.addColorStop(0.6, 'rgba(120,95,55,0.12)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function makeRoughTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#606060'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2200; i++) {
    const v = 60 + Math.random() * 120 | 0;
    g.fillStyle = `rgba(${v},${v},${v},0.25)`;
    g.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const enamelMap = makeWearTexture('#0c0c0e', 26);
const baseMap = makeWearTexture('#0a0a0c', 40);
const roughMap = makeRoughTexture();

// ---------- Materials ----------
const enamel = new THREE.MeshPhysicalMaterial({
  map: enamelMap, color: 0xffffff, metalness: 0.35, roughness: 0.22,
  roughnessMap: roughMap, clearcoat: 0.9, clearcoatRoughness: 0.25
});
const enamelBase = new THREE.MeshPhysicalMaterial({
  map: baseMap, color: 0xffffff, metalness: 0.4, roughness: 0.32,
  roughnessMap: roughMap, clearcoat: 0.7, clearcoatRoughness: 0.35
});
const gold = new THREE.MeshStandardMaterial({
  color: 0xc9a24b, metalness: 1.0, roughness: 0.35, roughnessMap: roughMap
});
const goldWorn = new THREE.MeshStandardMaterial({
  color: 0xa5843e, metalness: 1.0, roughness: 0.5, roughnessMap: roughMap
});
const steel = new THREE.MeshStandardMaterial({
  color: 0xc8ccd2, metalness: 1.0, roughness: 0.28, roughnessMap: roughMap
});
const darkSteel = new THREE.MeshStandardMaterial({
  color: 0x555a60, metalness: 0.95, roughness: 0.42
});

// ---------- Machine ----------
const machine = new THREE.Group();
scene.add(machine);

function addMesh(geo, mat, parent, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}

// --- Base plate (flat rectangle, rounded feel via bevel-ish box + trim) ---
const baseW = 5.2, baseD = 1.9, baseH = 0.28;
addMesh(new THREE.BoxGeometry(baseW, baseH, baseD), enamelBase, machine, 0, baseH / 2, 0);
// gold trim line around base
const trim = new THREE.Mesh(
  new THREE.BoxGeometry(baseW + 0.04, 0.05, baseD + 0.04), gold
);
trim.position.y = baseH - 0.05;
trim.castShadow = true;
machine.add(trim);
// small feet
[[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
  addMesh(new THREE.CylinderGeometry(0.12, 0.15, 0.12, 16), darkSteel, machine,
    sx * (baseW / 2 - 0.35), 0.06, sz * (baseD / 2 - 0.3));
});
// slide plate (needle plate) on base near needle
addMesh(new THREE.BoxGeometry(1.1, 0.03, 0.9), steel, machine, -1.55, baseH + 0.015, 0.15);
// feed-dog slot
addMesh(new THREE.BoxGeometry(0.35, 0.035, 0.08), darkSteel, machine, -1.55, baseH + 0.02, 0.15);

// --- Pillar (right vertical column) ---
const pillarX = 1.75, topY = 2.85;
const pillarPts = [];
for (let i = 0; i <= 10; i++) {
  const t = i / 10;
  const y = baseH + t * (topY - baseH);
  const r = 0.52 - 0.14 * Math.sin(t * Math.PI) - 0.06 * t;
  pillarPts.push(new THREE.Vector2(r, y));
}
const pillar = new THREE.Mesh(new THREE.LatheGeometry(pillarPts, 32), enamel);
pillar.position.x = pillarX;
pillar.castShadow = pillar.receiveShadow = true;
machine.add(pillar);
// gold band on pillar
addMesh(new THREE.TorusGeometry(0.45, 0.025, 12, 48), gold, machine, pillarX, 0.85, 0, Math.PI / 2);

// --- Horizontal arm (curved cast-iron, via tube along a gentle curve) ---
const armCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(pillarX, topY - 0.1, 0),
  new THREE.Vector3(0.9, topY + 0.12, 0),
  new THREE.Vector3(-0.4, topY + 0.16, 0),
  new THREE.Vector3(-1.35, topY - 0.02, 0),
  new THREE.Vector3(-1.62, topY - 0.35, 0)
]);
const arm = new THREE.Mesh(new THREE.TubeGeometry(armCurve, 48, 0.34, 24), enamel);
arm.castShadow = arm.receiveShadow = true;
machine.add(arm);
// gold pinstripes along the arm
const stripe1 = new THREE.Mesh(new THREE.TubeGeometry(armCurve, 48, 0.355, 24), gold);
stripe1.scale.set(1, 0.16, 1.02);
stripe1.position.y = topY * (1 - 0.16);
// simpler: decorative gold rings around the arm instead
machine.remove(stripe1);
[0.15, 0.45, 0.75].forEach(t => {
  const p = armCurve.getPoint(t);
  const tan = armCurve.getTangent(t);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.018, 10, 40), t === 0.45 ? goldWorn : gold);
  ring.position.copy(p);
  ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tan);
  ring.castShadow = true;
  machine.add(ring);
});
// gold scroll medallion on arm side
addMesh(new THREE.CylinderGeometry(0.16, 0.16, 0.02, 24), gold, machine, 0.2, topY + 0.12, 0.35, Math.PI / 2);
addMesh(new THREE.TorusGeometry(0.2, 0.015, 8, 32), gold, machine, 0.2, topY + 0.12, 0.35);

// --- Head (needle-arm housing, front-left) ---
const headX = -1.62;
const headPts = [];
for (let i = 0; i <= 8; i++) {
  const t = i / 8;
  const y = 1.35 + t * (topY - 0.3 - 1.35);
  const r = 0.34 + 0.05 * Math.sin(t * Math.PI);
  headPts.push(new THREE.Vector2(r, y));
}
const head = new THREE.Mesh(new THREE.LatheGeometry(headPts, 28), enamel);
head.position.x = headX;
head.castShadow = head.receiveShadow = true;
machine.add(head);
// faceplate (gold, with worn edge) on the head front
const facePlate = addMesh(new THREE.CylinderGeometry(0.3, 0.34, 0.9, 20, 1, false), goldWorn, machine, headX - 0.13, 1.85, 0);
facePlate.scale.z = 0.9;
facePlate.position.x = headX - 0.16;
// thread tension dial on head
addMesh(new THREE.CylinderGeometry(0.11, 0.11, 0.08, 20), steel, machine, headX - 0.1, 1.95, 0.34, Math.PI / 2);
addMesh(new THREE.CylinderGeometry(0.035, 0.035, 0.12, 12), darkSteel, machine, headX - 0.1, 1.95, 0.38, Math.PI / 2);

// --- Needle bar, needle, presser foot ---
const needleGrp = new THREE.Group();
machine.add(needleGrp);
addMesh(new THREE.CylinderGeometry(0.045, 0.045, 0.95, 12), steel, needleGrp, headX, 1.05, 0.12);
addMesh(new THREE.CylinderGeometry(0.012, 0.006, 0.42, 8), steel, needleGrp, headX, 0.62, 0.12);
// needle clamp
addMesh(new THREE.CylinderGeometry(0.07, 0.07, 0.1, 12), darkSteel, needleGrp, headX, 0.86, 0.12);
// presser bar + foot
addMesh(new THREE.CylinderGeometry(0.04, 0.04, 0.8, 12), steel, machine, headX, 1.05, -0.1);
const foot = new THREE.Group();
foot.position.set(headX, 0.46, -0.1);
machine.add(foot);
addMesh(new THREE.BoxGeometry(0.1, 0.05, 0.34), steel, foot, 0, 0, 0.1);
addMesh(new THREE.BoxGeometry(0.1, 0.04, 0.12), steel, foot, 0, 0.03, 0.3, -0.5);
addMesh(new THREE.CylinderGeometry(0.05, 0.05, 0.18, 10), darkSteel, foot, 0, 0.12, 0);
// presser-foot lift lever behind head
addMesh(new THREE.BoxGeometry(0.05, 0.3, 0.05), steel, machine, headX + 0.1, 1.35, -0.35, 0.5);

// --- Handwheel (right side) ---
const wheel = new THREE.Group();
wheel.position.set(pillarX + 0.62, topY - 0.15, 0);
wheel.rotation.z = Math.PI / 2;
machine.add(wheel);
const rimMesh = addMesh(new THREE.TorusGeometry(0.62, 0.11, 18, 48), enamel, wheel);
rimMesh.rotation.x = Math.PI / 2;
addMesh(new THREE.TorusGeometry(0.62, 0.115, 10, 48), goldWorn, wheel, 0, 0, 0, Math.PI / 2).scale.set(1, 1, 0.25);
// spokes
for (let i = 0; i < 5; i++) {
  const a = (i / 5) * Math.PI * 2;
  const s = addMesh(new THREE.CylinderGeometry(0.045, 0.06, 1.14, 10), enamel, wheel,
    Math.cos(a) * 0.29, 0, Math.sin(a) * 0.29);
  s.rotation.set(Math.PI / 2, 0, -a - Math.PI / 2);
  s.position.set(Math.cos(a) * 0.3, 0, Math.sin(a) * 0.3);
  s.rotation.set(Math.PI / 2 - 0, 0, 0);
  s.rotation.z = 0;
  s.rotation.x = Math.PI / 2;
  s.rotation.y = -a;
}
// hub + gold cap
addMesh(new THREE.CylinderGeometry(0.16, 0.16, 0.26, 20), darkSteel, wheel);
addMesh(new THREE.CylinderGeometry(0.09, 0.11, 0.3, 16), gold, wheel);
// clutch knob
addMesh(new THREE.CylinderGeometry(0.07, 0.07, 0.1, 14), goldWorn, wheel, 0, 0.2, 0);

// --- Spool pin + thread on top ---
const spoolX = 0.7, spoolTop = topY + 0.28;
addMesh(new THREE.CylinderGeometry(0.025, 0.025, 0.55, 10), steel, machine, spoolX, spoolTop + 0.25, 0);
const spool = new THREE.Group();
spool.position.set(spoolX, spoolTop + 0.28, 0);
machine.add(spool);
addMesh(new THREE.CylinderGeometry(0.13, 0.13, 0.3, 18), new THREE.MeshStandardMaterial({ color: 0x7a2020, roughness: 0.85 }), spool);
addMesh(new THREE.CylinderGeometry(0.17, 0.17, 0.04, 18), new THREE.MeshStandardMaterial({ color: 0x8a5a2a, roughness: 0.8 }), spool, 0, 0.17, 0);
addMesh(new THREE.CylinderGeometry(0.17, 0.17, 0.04, 18), new THREE.MeshStandardMaterial({ color: 0x8a5a2a, roughness: 0.8 }), spool, 0, -0.17, 0);
// second (rear) spool pin, empty
addMesh(new THREE.CylinderGeometry(0.022, 0.022, 0.45, 10), steel, machine, 1.15, spoolTop + 0.2, -0.12);

// --- Stitch-length dial + gold badge on pillar ---
addMesh(new THREE.CylinderGeometry(0.14, 0.14, 0.07, 20), goldWorn, machine, pillarX, 1.5, 0.42, Math.PI / 2);
addMesh(new THREE.CylinderGeometry(0.04, 0.04, 0.1, 10), darkSteel, machine, pillarX, 1.5, 0.46, Math.PI / 2);
// oval gold badge on pillar front
const badge = addMesh(new THREE.CylinderGeometry(0.22, 0.22, 0.02, 28), gold, machine, pillarX - 0.05, 2.1, 0.42, Math.PI / 2);
badge.scale.x = 1.5;

// --- Thread take-up lever ---
addMesh(new THREE.BoxGeometry(0.05, 0.34, 0.05), steel, machine, headX + 0.22, 2.55, 0.28, 0, 0, 0.35);
addMesh(new THREE.TorusGeometry(0.045, 0.015, 8, 16), steel, machine, headX + 0.28, 2.72, 0.28);

// center the whole machine
machine.position.x = -0.05;

// ---------- Ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 64),
  new THREE.MeshStandardMaterial({ color: 0x2b2622, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
// soft contact shadow disc
const shadowTexCanvas = document.createElement('canvas');
shadowTexCanvas.width = shadowTexCanvas.height = 256;
const sg = shadowTexCanvas.getContext('2d');
const grad = sg.createRadialGradient(128, 128, 10, 128, 128, 128);
grad.addColorStop(0, 'rgba(0,0,0,0.42)');
grad.addColorStop(0.6, 'rgba(0,0,0,0.18)');
grad.addColorStop(1, 'rgba(0,0,0,0)');
sg.fillStyle = grad; sg.fillRect(0, 0, 256, 256);
const contact = new THREE.Mesh(
  new THREE.PlaneGeometry(7.5, 4.5),
  new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shadowTexCanvas), transparent: true, depthWrite: false })
);
contact.rotation.x = -Math.PI / 2;
contact.position.y = 0.005;
scene.add(contact);

// ---------- Animation ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  wheel.rotation.y = t * 1.6;
  needleGrp.position.y = Math.sin(t * 6.4) * 0.09;
  spool.rotation.y = t * 0.5;
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
