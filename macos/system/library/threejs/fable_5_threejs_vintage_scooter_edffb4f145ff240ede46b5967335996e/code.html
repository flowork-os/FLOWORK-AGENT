<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vintage Scooter</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f2ede4; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf2ede4);
scene.fog = new THREE.Fog(0xf2ede4, 12, 28);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.2, 2.4, 5.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.85, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 3;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.49;

// Lights
scene.add(new THREE.HemisphereLight(0xfff6e8, 0xcabfa8, 0.7));
const sun = new THREE.DirectionalLight(0xfff2df, 2.2);
sun.position.set(5, 8, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -4; sun.shadow.camera.right = 4;
sun.shadow.camera.top = 4; sun.shadow.camera.bottom = -4;
sun.shadow.bias = -0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.5);
fill.position.set(-5, 3, -4);
scene.add(fill);

// Ground with soft shadow
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 64),
  new THREE.MeshStandardMaterial({ color: 0xe8e1d3, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Materials — retro pastel mint
const pastel = new THREE.MeshStandardMaterial({ color: 0xa8d8c9, roughness: 0.25, metalness: 0.15 });
const cream = new THREE.MeshStandardMaterial({ color: 0xf4efe0, roughness: 0.35, metalness: 0.05 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xd8dde2, roughness: 0.12, metalness: 0.95 });
const rubber = new THREE.MeshStandardMaterial({ color: 0x2b2b2e, roughness: 0.9 });
const seatMat = new THREE.MeshStandardMaterial({ color: 0x6b4a3a, roughness: 0.6 });
const dark = new THREE.MeshStandardMaterial({ color: 0x44484d, roughness: 0.5, metalness: 0.4 });
const glass = new THREE.MeshStandardMaterial({ color: 0xfff3c4, roughness: 0.1, metalness: 0.1, emissive: 0xffe9a8, emissiveIntensity: 0.6 });
const mirrorGlass = new THREE.MeshStandardMaterial({ color: 0xbfd4e0, roughness: 0.05, metalness: 0.9 });

const scooter = new THREE.Group();
scene.add(scooter);

function add(parent, geo, mat, pos, rot, scale) {
  const m = new THREE.Mesh(geo, mat);
  if (pos) m.position.set(...pos);
  if (rot) m.rotation.set(...rot);
  if (scale) m.scale.set(...scale);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

const WHEEL_R = 0.42;

// Wheels (front at +z, rear at -z)
function wheel(z) {
  const g = new THREE.Group();
  g.position.set(0, WHEEL_R, z);
  const tire = add(g, new THREE.TorusGeometry(WHEEL_R - 0.1, 0.11, 20, 40), rubber, [0, 0, 0], [0, Math.PI / 2, 0]);
  add(g, new THREE.CylinderGeometry(WHEEL_R - 0.14, WHEEL_R - 0.14, 0.09, 32), chrome, [0, 0, 0], [0, 0, Math.PI / 2]);
  add(g, new THREE.CylinderGeometry(0.07, 0.07, 0.16, 20), dark, [0, 0, 0], [0, 0, Math.PI / 2]);
  scooter.add(g);
  return g;
}
wheel(1.05);
wheel(-1.0);

// Rear body — bulbous engine cowl over rear wheel
const rear = new THREE.Group();
rear.position.set(0, 0.72, -0.85);
scooter.add(rear);
add(rear, new THREE.SphereGeometry(0.52, 32, 24), pastel, [0, 0.05, 0], null, [0.78, 0.72, 1.15]);
// Side cheek cowls
add(rear, new THREE.SphereGeometry(0.34, 24, 18), pastel, [0.3, -0.08, 0.05], null, [0.75, 0.85, 1.25]);
add(rear, new THREE.SphereGeometry(0.34, 24, 18), pastel, [-0.3, -0.08, 0.05], null, [0.75, 0.85, 1.25]);
// Tail light
add(rear, new THREE.SphereGeometry(0.09, 16, 12), new THREE.MeshStandardMaterial({ color: 0xc0392b, roughness: 0.2, emissive: 0x8c1d10, emissiveIntensity: 0.4 }), [0, 0.12, -0.56], null, [1, 0.8, 0.6]);
// Rear fender lip
add(rear, new THREE.TorusGeometry(0.46, 0.05, 12, 24, Math.PI), cream, [0, -0.28, -0.12], [0.1, Math.PI / 2, 0]);

// Step-through floorboard
add(scooter, new THREE.BoxGeometry(0.5, 0.07, 1.0), pastel, [0, 0.34, 0.15]);
add(scooter, new THREE.BoxGeometry(0.54, 0.03, 1.04), chrome, [0, 0.30, 0.15]);
// Central spine tunnel rising to rear
add(scooter, new THREE.CylinderGeometry(0.11, 0.16, 0.95, 16), pastel, [0, 0.5, -0.35], [Math.PI / 2.6, 0, 0]);

// Front leg shield — curved
const shield = new THREE.Group();
shield.position.set(0, 0.78, 0.72);
shield.rotation.x = -0.14;
scooter.add(shield);
add(shield, new THREE.CylinderGeometry(0.42, 0.46, 0.95, 32, 1, true, Math.PI * 0.62, Math.PI * 0.76), cream, [0, 0, 0.34], [0, Math.PI, 0]);
add(shield, new THREE.CylinderGeometry(0.42, 0.46, 0.95, 32, 1, true, Math.PI * 0.6, Math.PI * 0.8), pastel, [0, 0, 0.36], [0, Math.PI, 0]);
// Shield crest trim
add(shield, new THREE.BoxGeometry(0.05, 0.85, 0.04), chrome, [0, 0, -0.065]);

// Front fender hugging front wheel
const fender = add(scooter, new THREE.SphereGeometry(0.5, 28, 18, 0, Math.PI * 2, 0, Math.PI * 0.55), pastel, [0, 0.48, 1.05], null, [0.5, 0.9, 1.15]);
fender.rotation.x = -0.08;

// Steering column
add(scooter, new THREE.CylinderGeometry(0.055, 0.075, 1.15, 14), chrome, [0, 1.05, 0.98], [0.22, 0, 0]);
// Fork to front axle
add(scooter, new THREE.CylinderGeometry(0.035, 0.035, 0.5, 10), chrome, [0.11, 0.6, 1.08], [0.15, 0, 0]);
add(scooter, new THREE.CylinderGeometry(0.035, 0.035, 0.5, 10), chrome, [-0.11, 0.6, 1.08], [0.15, 0, 0]);

// Handlebar cluster
const bars = new THREE.Group();
bars.position.set(0, 1.62, 0.85);
scooter.add(bars);
// Headset body
add(bars, new THREE.SphereGeometry(0.16, 20, 14), pastel, [0, 0, 0], null, [1.3, 0.75, 1]);
// Bars
add(bars, new THREE.CylinderGeometry(0.028, 0.028, 0.95, 12), chrome, [0, 0.02, 0], [0, 0, Math.PI / 2]);
// Grips
add(bars, new THREE.CylinderGeometry(0.045, 0.045, 0.2, 12), rubber, [0.46, 0.02, 0], [0, 0, Math.PI / 2]);
add(bars, new THREE.CylinderGeometry(0.045, 0.045, 0.2, 12), rubber, [-0.46, 0.02, 0], [0, 0, Math.PI / 2]);
// Speedo
add(bars, new THREE.CylinderGeometry(0.07, 0.07, 0.03, 16), cream, [0, 0.12, 0.02], [0.5, 0, 0]);

// Headlight on the headset
const headGroup = new THREE.Group();
headGroup.position.set(0, 1.55, 1.02);
headGroup.rotation.x = 0.12;
scooter.add(headGroup);
add(headGroup, new THREE.SphereGeometry(0.15, 20, 14), chrome, [0, 0, -0.02], null, [1, 1, 0.9]);
add(headGroup, new THREE.CircleGeometry(0.115, 20), glass, [0, 0, 0.115]);
add(headGroup, new THREE.TorusGeometry(0.115, 0.018, 10, 24), chrome, [0, 0, 0.115]);

// Two rear-view mirrors
function mirror(x) {
  const g = new THREE.Group();
  g.position.set(x, 1.64, 0.85);
  const stem = add(g, new THREE.CylinderGeometry(0.014, 0.014, 0.42, 8), chrome, [x > 0 ? 0.06 : -0.06, 0.19, -0.02], [0.15, 0, x > 0 ? -0.3 : 0.3]);
  const head = new THREE.Group();
  head.position.set(x > 0 ? 0.13 : -0.13, 0.39, -0.05);
  head.rotation.set(-0.15, x > 0 ? -0.25 : 0.25, 0);
  add(head, new THREE.SphereGeometry(0.085, 18, 12), chrome, [0, 0, 0.012], null, [1, 1.25, 0.45]);
  add(head, new THREE.CircleGeometry(0.075, 18), mirrorGlass, [0, 0, -0.028], [0, Math.PI, 0], [1, 1.25, 1]);
  g.add(head);
  scooter.add(g);
}
mirror(0.34);
mirror(-0.34);

// Single seat with visible seam
const seat = new THREE.Group();
seat.position.set(0, 1.22, -0.55);
scooter.add(seat);
const seatTop = add(seat, new THREE.SphereGeometry(0.34, 28, 18, 0, Math.PI * 2, 0, Math.PI / 2), seatMat, [0, 0, 0], null, [0.85, 0.55, 1.5]);
// Seam piping around the seat edge
add(seat, new THREE.TorusGeometry(0.335, 0.016, 10, 48), new THREE.MeshStandardMaterial({ color: 0xf0e6d2, roughness: 0.55 }), [0, 0.005, 0], [Math.PI / 2, 0, 0], [0.85, 1.5, 1]);
// Seat base / skirt
add(seat, new THREE.CylinderGeometry(0.29, 0.24, 0.1, 24), dark, [0, -0.05, 0], null, [0.85, 1, 1.45]);
// Seat spring hint
add(seat, new THREE.CylinderGeometry(0.05, 0.06, 0.16, 10), chrome, [0, -0.16, 0.1]);
// Chrome grab rail behind seat
add(seat, new THREE.TorusGeometry(0.24, 0.02, 8, 24, Math.PI), chrome, [0, -0.02, -0.38], [0, 0, 0]);

// Center kickstand (deployed)
const stand = new THREE.Group();
stand.position.set(0, 0.42, -0.55);
stand.rotation.x = 0.35;
scooter.add(stand);
add(stand, new THREE.CylinderGeometry(0.022, 0.022, 0.44, 10), dark, [0.14, -0.2, 0], [0, 0, 0.12]);
add(stand, new THREE.CylinderGeometry(0.022, 0.022, 0.44, 10), dark, [-0.14, -0.2, 0], [0, 0, -0.12]);
add(stand, new THREE.CylinderGeometry(0.02, 0.02, 0.34, 10), dark, [0, -0.4, 0], [0, 0, Math.PI / 2]);
// Feet
add(stand, new THREE.BoxGeometry(0.06, 0.03, 0.09), dark, [0.165, -0.415, 0]);
add(stand, new THREE.BoxGeometry(0.06, 0.03, 0.09), dark, [-0.165, -0.415, 0]);

// Kickstand lean: lift rear slightly, tilt scooter
scooter.rotation.x = -0.02;
scooter.position.y = 0.015;

// Exhaust pipe
add(scooter, new THREE.CylinderGeometry(0.05, 0.065, 0.55, 14), chrome, [0.22, 0.42, -1.05], [Math.PI / 2 - 0.12, 0, 0]);

// Resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
