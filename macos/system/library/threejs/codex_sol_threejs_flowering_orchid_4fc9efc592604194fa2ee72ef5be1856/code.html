<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flowering Moth Orchid</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #eee9e2;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeee9e2);
scene.fog = new THREE.Fog(0xeee9e2, 12, 25);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.8, 4.8, 8.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.35, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.48;
controls.minDistance = 5.2;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI * 0.49;

const hemi = new THREE.HemisphereLight(0xfff8ef, 0x627060, 2.25);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e7, 4.1);
key.position.set(5, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -4;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 22;
key.shadow.bias = -0.0002;
scene.add(key);

const fill = new THREE.DirectionalLight(0xddeaff, 1.35);
fill.position.set(-6, 5, 2);
scene.add(fill);

const rim = new THREE.PointLight(0xffd7df, 1.7, 13);
rim.position.set(-3, 5.5, -3);
scene.add(rim);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xd8d1c6,
  roughness: 0.82,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(10, 96), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.02;
floor.receiveShadow = true;
scene.add(floor);

const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(22, 12),
  new THREE.MeshStandardMaterial({ color: 0xe9e4dc, roughness: 1 })
);
backdrop.position.set(0, 5.7, -5.2);
backdrop.receiveShadow = true;
scene.add(backdrop);

const orchid = new THREE.Group();
orchid.rotation.y = -0.18;
scene.add(orchid);

function enableShadows(object) {
  object.traverse(child => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });
}

function tubeBetween(points, radius, material, segments = 48, radialSegments = 8) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  return new THREE.Mesh(
    new THREE.TubeGeometry(curve, segments, radius, radialSegments, false),
    material
  );
}

const potProfile = [
  new THREE.Vector2(0.73, 0.02),
  new THREE.Vector2(0.79, 0.07),
  new THREE.Vector2(0.84, 0.22),
  new THREE.Vector2(0.93, 1.03),
  new THREE.Vector2(1.00, 1.14),
  new THREE.Vector2(1.03, 1.26),
  new THREE.Vector2(1.01, 1.36),
  new THREE.Vector2(0.92, 1.40)
];
const potMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xb8aaa0,
  roughness: 0.28,
  metalness: 0.02,
  clearcoat: 0.65,
  clearcoatRoughness: 0.24
});
const pot = new THREE.Mesh(new THREE.LatheGeometry(potProfile, 64), potMaterial);
pot.castShadow = true;
pot.receiveShadow = true;
orchid.add(pot);

const innerRim = new THREE.Mesh(
  new THREE.TorusGeometry(0.91, 0.075, 16, 64),
  new THREE.MeshPhysicalMaterial({
    color: 0x9e9087,
    roughness: 0.32,
    clearcoat: 0.45
  })
);
innerRim.rotation.x = Math.PI / 2;
innerRim.position.y = 1.32;
innerRim.castShadow = true;
orchid.add(innerRim);

const soil = new THREE.Mesh(
  new THREE.CylinderGeometry(0.88, 0.86, 0.09, 64),
  new THREE.MeshStandardMaterial({ color: 0x30271f, roughness: 1 })
);
soil.position.y = 1.31;
soil.castShadow = true;
soil.receiveShadow = true;
orchid.add(soil);

const barkMaterial = new THREE.MeshStandardMaterial({
  color: 0x59402d,
  roughness: 0.95
});
for (let i = 0; i < 30; i++) {
  const angle = i * 2.399;
  const radius = 0.18 + 0.65 * Math.sqrt((i + 1) / 30);
  const bark = new THREE.Mesh(
    new THREE.BoxGeometry(
      0.10 + 0.08 * ((i * 7) % 5) / 4,
      0.025 + 0.025 * ((i * 3) % 4) / 3,
      0.08 + 0.07 * ((i * 11) % 5) / 4
    ),
    barkMaterial
  );
  bark.position.set(Math.cos(angle) * radius, 1.375, Math.sin(angle) * radius);
  bark.rotation.set(0.15 * Math.sin(i), angle + 0.4, 0.15 * Math.cos(i));
  bark.castShadow = true;
  orchid.add(bark);
}

function createLeafGeometry(length, width, arch, twist = 0) {
  const rows = 28;
  const cols = 9;
  const positions = [];
  const uvs = [];
  const indices = [];

  for (let iy = 0; iy <= rows; iy++) {
    const t = iy / rows;
    const centerX = 0.08 * Math.sin(t * Math.PI) + twist * t * t;
    const centerY = length * t;
    const centerZ = arch * Math.sin(Math.PI * t) - 0.17 * t * t;
    const envelope = Math.pow(Math.sin(Math.PI * Math.min(0.985, t)), 0.62);
    const localWidth = Math.max(0.025, width * envelope * (1 - 0.18 * t));

    for (let ix = 0; ix <= cols; ix++) {
      const s = ix / cols * 2 - 1;
      const x = centerX + s * localWidth;
      const edgeCurl = 0.12 * Math.pow(Math.abs(s), 1.8) * Math.sin(Math.PI * t);
      const z = centerZ + edgeCurl + 0.035 * Math.cos(s * Math.PI) * envelope;
      positions.push(x, centerY, z);
      uvs.push(ix / cols, t);
    }
  }

  for (let iy = 0; iy < rows; iy++) {
    for (let ix = 0; ix < cols; ix++) {
      const a = iy * (cols + 1) + ix;
      const b = a + 1;
      const c = a + cols + 1;
      const d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const leafMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x245c36,
  roughness: 0.24,
  metalness: 0,
  clearcoat: 0.85,
  clearcoatRoughness: 0.19,
  side: THREE.DoubleSide
});
const youngLeafMaterial = leafMaterial.clone();
youngLeafMaterial.color.set(0x3b7548);

function addLeaf(length, width, rotationY, tilt, arch, twist, material = leafMaterial) {
  const leaf = new THREE.Mesh(createLeafGeometry(length, width, arch, twist), material);
  leaf.position.set(0, 1.38, 0);
  leaf.rotation.order = 'YXZ';
  leaf.rotation.y = rotationY;
  leaf.rotation.x = tilt;
  leaf.castShadow = true;
  leaf.receiveShadow = true;
  orchid.add(leaf);

  const vein = tubeBetween([
    new THREE.Vector3(0, 1.40, 0),
    new THREE.Vector3(
      Math.sin(rotationY) * length * 0.38,
      1.40 + Math.cos(tilt) * length * 0.38,
      Math.cos(rotationY) * length * 0.38
    ),
    new THREE.Vector3(
      Math.sin(rotationY) * length * 0.72,
      1.38 + Math.cos(tilt) * length * 0.72,
      Math.cos(rotationY) * length * 0.72
    )
  ], 0.012, new THREE.MeshStandardMaterial({ color: 0x77a464, roughness: 0.6 }), 24, 5);
  vein.visible = false;
}

addLeaf(2.32, 0.52, -1.43, 1.13, 0.30, -0.12);
addLeaf(2.15, 0.50, 1.42, 1.09, 0.35, 0.16);
addLeaf(1.75, 0.42, -0.16, 1.00, 0.27, 0.06, youngLeafMaterial);
addLeaf(1.48, 0.36, 2.82, 1.06, 0.24, -0.04, youngLeafMaterial);

const stemMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x477547,
  roughness: 0.42,
  clearcoat: 0.25
});
const stemPoints = [
  new THREE.Vector3(0.10, 1.43, 0.02),
  new THREE.Vector3(0.18, 2.25, -0.02),
  new THREE.Vector3(0.17, 3.20, 0.02),
  new THREE.Vector3(0.25, 4.20, 0.04),
  new THREE.Vector3(0.55, 5.05, 0.06),
  new THREE.Vector3(1.17, 5.58, 0.04),
  new THREE.Vector3(2.02, 5.72, -0.04),
  new THREE.Vector3(2.72, 5.45, -0.08)
];
const stemCurve = new THREE.CatmullRomCurve3(stemPoints, false, 'centripetal');
const stem = new THREE.Mesh(
  new THREE.TubeGeometry(stemCurve, 110, 0.048, 9, false),
  stemMaterial
);
stem.castShadow = true;
orchid.add(stem);

const stakeMaterial = new THREE.MeshStandardMaterial({
  color: 0x3f4139,
  roughness: 0.65
});
const stake = new THREE.Mesh(
  new THREE.CylinderGeometry(0.025, 0.028, 4.25, 10),
  stakeMaterial
);
stake.position.set(-0.02, 3.28, -0.13);
stake.castShadow = true;
orchid.add(stake);

const clipMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x526557,
  roughness: 0.3,
  clearcoat: 0.45
});
for (const y of [2.72, 3.63, 4.40]) {
  const clip = new THREE.Mesh(
    new THREE.TorusGeometry(0.135, 0.025, 8, 24, Math.PI * 1.72),
    clipMaterial
  );
  clip.position.set(0.07, y, -0.07);
  clip.rotation.set(Math.PI / 2, 0.18, 0.25);
  clip.castShadow = true;
  orchid.add(clip);

  const clasp = new THREE.Mesh(
    new THREE.SphereGeometry(0.055, 12, 8),
    clipMaterial
  );
  clasp.scale.set(1.25, 0.72, 0.72);
  clasp.position.set(0.16, y, -0.03);
  clasp.castShadow = true;
  orchid.add(clasp);
}

function createPetalGeometry(length = 0.66, width = 0.39, cup = 0.12, waviness = 0.025) {
  const rows = 15;
  const cols = 12;
  const positions = [];
  const uvs = [];
  const indices = [];

  for (let iy = 0; iy <= rows; iy++) {
    const t = iy / rows;
    const y = length * t;
    const envelope = Math.pow(Math.sin(Math.PI * Math.min(t, 0.992)), 0.55);
    const taper = 1 - 0.14 * t;
    const halfWidth = Math.max(0.014, width * envelope * taper);

    for (let ix = 0; ix <= cols; ix++) {
      const s = ix / cols * 2 - 1;
      const x = s * halfWidth;
      const centralCup = cup * Math.sin(Math.PI * t) * (1 - 0.62 * s * s);
      const edgeRuffle = waviness * Math.sin(s * Math.PI * 3 + t * 5) *
        Math.pow(Math.abs(s), 1.5) * envelope;
      const z = centralCup + edgeRuffle - 0.025 * t;
      positions.push(x, y, z);
      uvs.push(ix / cols, t);
    }
  }

  for (let iy = 0; iy < rows; iy++) {
    for (let ix = 0; ix < cols; ix++) {
      const a = iy * (cols + 1) + ix;
      const b = a + 1;
      const c = a + cols + 1;
      const d = c + 1;
      indices.push(a, b, c, b, d, c);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const broadPetalGeometry = createPetalGeometry(0.71, 0.40, 0.105, 0.028);
const roundPetalGeometry = createPetalGeometry(0.64, 0.44, 0.13, 0.024);
const sepalGeometry = createPetalGeometry(0.67, 0.26, 0.075, 0.016);
const smallPetalGeometry = createPetalGeometry(0.36, 0.18, 0.08, 0.015);

const petalMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffeef2,
  roughness: 0.34,
  metalness: 0,
  transmission: 0.05,
  thickness: 0.22,
  clearcoat: 0.22,
  clearcoatRoughness: 0.4,
  side: THREE.DoubleSide
});
const innerPetalMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xfff8f6,
  roughness: 0.3,
  clearcoat: 0.2,
  side: THREE.DoubleSide
});
const sepalMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xf7dce4,
  roughness: 0.38,
  side: THREE.DoubleSide
});
const lipMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x9f245b,
  roughness: 0.32,
  clearcoat: 0.32,
  side: THREE.DoubleSide
});
const throatMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xf1b63c,
  roughness: 0.38,
  clearcoat: 0.18
});

function petalMesh(geometry, material, angle, z, scaleX = 1, scaleY = 1) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.rotation.z = angle;
  mesh.position.z = z;
  mesh.scale.set(scaleX, scaleY, 1);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function createFlower(scale = 1, variant = 0) {
  const flower = new THREE.Group();

  flower.add(petalMesh(sepalGeometry, sepalMaterial, Math.PI, -0.055, 0.94, 1.04));
  flower.add(petalMesh(sepalGeometry, sepalMaterial, Math.PI * 0.31, -0.045, 1, 1));
  flower.add(petalMesh(sepalGeometry, sepalMaterial, -Math.PI * 0.31, -0.045, 1, 1));

  flower.add(petalMesh(broadPetalGeometry, petalMaterial, Math.PI * 0.52, 0.015, 1.04, 1));
  flower.add(petalMesh(broadPetalGeometry, petalMaterial, -Math.PI * 0.52, 0.015, 1.04, 1));

  flower.add(petalMesh(roundPetalGeometry, innerPetalMaterial, 0.16, 0.045, 0.92, 0.88));
  flower.add(petalMesh(roundPetalGeometry, innerPetalMaterial, -0.16, 0.052, 0.92, 0.88));

  const lowerLip = petalMesh(smallPetalGeometry, lipMaterial, Math.PI, 0.145, 1.18, 1.05);
  lowerLip.rotation.x = -0.28;
  flower.add(lowerLip);

  const leftLobe = petalMesh(smallPetalGeometry, lipMaterial, 2.18, 0.12, 0.72, 0.72);
  leftLobe.rotation.x = -0.35;
  flower.add(leftLobe);

  const rightLobe = petalMesh(smallPetalGeometry, lipMaterial, -2.18, 0.12, 0.72, 0.72);
  rightLobe.rotation.x = -0.35;
  flower.add(rightLobe);

  const column = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.075, 0.18, 5, 12),
    innerPetalMaterial
  );
  column.position.set(0, -0.06, 0.19);
  column.rotation.x = Math.PI / 2;
  column.castShadow = true;
  flower.add(column);

  const throat = new THREE.Mesh(
    new THREE.SphereGeometry(0.074, 16, 10),
    throatMaterial
  );
  throat.scale.set(1.15, 0.70, 0.62);
  throat.position.set(0, -0.18, 0.235);
  throat.castShadow = true;
  flower.add(throat);

  const speckMaterial = new THREE.MeshStandardMaterial({
    color: 0xb33a68,
    roughness: 0.45
  });
  for (let i = 0; i < 5; i++) {
    const speck = new THREE.Mesh(
      new THREE.SphereGeometry(0.018, 8, 6),
      speckMaterial
    );
    const side = i % 2 === 0 ? -1 : 1;
    speck.position.set(side * (0.035 + i * 0.006), -0.06 - i * 0.045, 0.245);
    speck.scale.set(1.0, 0.75, 0.42);
    flower.add(speck);
  }

  flower.scale.setScalar(scale);
  flower.rotation.z = variant * 0.07;
  enableShadows(flower);
  return flower;
}

const pedicelMaterial = new THREE.MeshStandardMaterial({
  color: 0x63845b,
  roughness: 0.54
});

const bloomData = [
  { t: 0.58, side: -1, scale: 0.86, offset: 0.49, drop: 0.04 },
  { t: 0.67, side: 1, scale: 0.93, offset: 0.54, drop: 0.01 },
  { t: 0.75, side: -1, scale: 1.00, offset: 0.57, drop: 0.05 },
  { t: 0.83, side: 1, scale: 0.95, offset: 0.54, drop: 0.08 },
  { t: 0.90, side: -1, scale: 0.84, offset: 0.46, drop: 0.11 }
];

bloomData.forEach((data, index) => {
  const base = stemCurve.getPointAt(data.t);
  const tangent = stemCurve.getTangentAt(data.t).normalize();
  const lateral = new THREE.Vector3(-tangent.y, tangent.x, 0).normalize();
  const front = new THREE.Vector3(0, 0, 1);
  const bloomPosition = base.clone()
    .addScaledVector(lateral, data.side * data.offset * 0.36)
    .addScaledVector(front, data.offset * 0.72)
    .add(new THREE.Vector3(0, -data.drop, 0));

  const pedicelMid = base.clone()
    .lerp(bloomPosition, 0.56)
    .add(new THREE.Vector3(0, 0.11, -0.02));
  const pedicel = tubeBetween(
    [base, pedicelMid, bloomPosition],
    0.024,
    pedicelMaterial,
    24,
    6
  );
  pedicel.castShadow = true;
  orchid.add(pedicel);

  const ovary = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.045, 0.20, 5, 10),
    pedicelMaterial
  );
  ovary.position.copy(bloomPosition).lerp(pedicelMid, 0.17);
  ovary.lookAt(bloomPosition);
  ovary.rotation.x += Math.PI / 2;
  ovary.castShadow = true;
  orchid.add(ovary);

  const flower = createFlower(data.scale, index - 2);
  flower.position.copy(bloomPosition);
  const facingTarget = bloomPosition.clone().add(new THREE.Vector3(
    data.side * 0.16,
    -0.08,
    2.4
  ));
  flower.lookAt(facingTarget);
  flower.rotateZ(data.side * 0.10);
  orchid.add(flower);
});

function createBud(scale, color = 0xeeb9ca) {
  const bud = new THREE.Group();
  const material = new THREE.MeshPhysicalMaterial({
    color,
    roughness: 0.34,
    clearcoat: 0.26
  });
  const body = new THREE.Mesh(
    new THREE.SphereGeometry(0.20, 20, 14),
    material
  );
  body.scale.set(0.78, 1.25, 0.72);
  body.castShadow = true;
  bud.add(body);

  const seamMaterial = new THREE.MeshStandardMaterial({
    color: 0xd99ab1,
    roughness: 0.5
  });
  for (let i = 0; i < 3; i++) {
    const seam = new THREE.Mesh(
      new THREE.TorusGeometry(0.135, 0.008, 5, 18, Math.PI),
      seamMaterial
    );
    seam.rotation.set(Math.PI / 2, i * Math.PI / 3, 0);
    seam.position.y = 0.01;
    bud.add(seam);
  }
  bud.scale.setScalar(scale);
  return bud;
}

const budData = [
  { t: 0.945, side: 1, scale: 0.82 },
  { t: 0.985, side: -1, scale: 0.62 }
];

budData.forEach((data, index) => {
  const base = stemCurve.getPointAt(data.t);
  const tangent = stemCurve.getTangentAt(data.t).normalize();
  const end = base.clone().add(new THREE.Vector3(
    data.side * 0.18,
    0.10 - index * 0.02,
    0.22
  ));
  const pedicel = tubeBetween(
    [base, base.clone().lerp(end, 0.55).add(new THREE.Vector3(0, 0.06, 0)), end],
    0.018,
    pedicelMaterial,
    18,
    6
  );
  pedicel.castShadow = true;
  orchid.add(pedicel);

  const bud = createBud(data.scale);
  bud.position.copy(end);
  bud.rotation.z = data.side * -0.55;
  bud.rotation.x = 0.28;
  orchid.add(bud);
});

const baseRootsMaterial = new THREE.MeshStandardMaterial({
  color: 0xa8b396,
  roughness: 0.78
});
for (let i = 0; i < 5; i++) {
  const angle = -1.3 + i * 0.62;
  const root = tubeBetween([
    new THREE.Vector3(0.04 * i - 0.10, 1.43, 0.04),
    new THREE.Vector3(Math.sin(angle) * 0.46, 1.54, Math.cos(angle) * 0.42),
    new THREE.Vector3(Math.sin(angle) * 0.75, 1.38, Math.cos(angle) * 0.72)
  ], 0.026, baseRootsMaterial, 24, 7);
  root.castShadow = true;
  orchid.add(root);
}

enableShadows(orchid);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  orchid.rotation.z = Math.sin(elapsed * 0.42) * 0.0025;
  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
