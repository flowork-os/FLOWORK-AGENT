<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Porcelain Lighthouse</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #e9f1f7;
    }
    body {
      background:
        radial-gradient(circle at 50% 34%, #ffffff 0%, #edf4f8 45%, #cad7df 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeaf1f5);
scene.fog = new THREE.Fog(0xeaf1f5, 18, 32);

const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(11.5, 8.8, 13.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4.35, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.62;
controls.minDistance = 10;
controls.maxDistance = 24;
controls.minPolarAngle = 0.42;
controls.maxPolarAngle = Math.PI * 0.49;

const porcelainWhite = new THREE.MeshPhysicalMaterial({
  color: 0xf8f6ec,
  roughness: 0.16,
  metalness: 0,
  clearcoat: 0.9,
  clearcoatRoughness: 0.12
});

const porcelainBlue = new THREE.MeshPhysicalMaterial({
  color: 0x123f92,
  roughness: 0.17,
  metalness: 0,
  clearcoat: 1,
  clearcoatRoughness: 0.1
});

const deepBlue = new THREE.MeshPhysicalMaterial({
  color: 0x082758,
  roughness: 0.15,
  clearcoat: 0.85,
  clearcoatRoughness: 0.1
});

const gold = new THREE.MeshStandardMaterial({
  color: 0xd9a83e,
  roughness: 0.24,
  metalness: 0.88
});

const darkGold = new THREE.MeshStandardMaterial({
  color: 0x9b651d,
  roughness: 0.3,
  metalness: 0.78
});

const glass = new THREE.MeshPhysicalMaterial({
  color: 0xcde8f4,
  roughness: 0.08,
  metalness: 0,
  transmission: 0.58,
  transparent: true,
  opacity: 0.6,
  thickness: 0.18,
  ior: 1.46,
  side: THREE.DoubleSide
});

const warmGlass = new THREE.MeshPhysicalMaterial({
  color: 0xffe6ac,
  emissive: 0xffc95f,
  emissiveIntensity: 0.42,
  roughness: 0.16,
  transmission: 0.25,
  transparent: true,
  opacity: 0.82
});

const lighthouse = new THREE.Group();
lighthouse.rotation.y = -0.35;
scene.add(lighthouse);

function applyShadows(object) {
  object.traverse((child) => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });
}

function mesh(geometry, material, x = 0, y = 0, z = 0) {
  const result = new THREE.Mesh(geometry, material);
  result.position.set(x, y, z);
  lighthouse.add(result);
  return result;
}

function cylinder(radiusTop, radiusBottom, height, segments, material, y) {
  return mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments, 1, false),
    material,
    0,
    y,
    0
  );
}

function torus(majorRadius, tubeRadius, material, y, radialSegments = 16, tubularSegments = 96) {
  const result = mesh(
    new THREE.TorusGeometry(majorRadius, tubeRadius, radialSegments, tubularSegments),
    material,
    0,
    y,
    0
  );
  result.rotation.x = Math.PI / 2;
  return result;
}

const baseY = 0.52;
cylinder(1.55, 1.63, 0.28, 96, porcelainWhite, baseY);
torus(1.51, 0.15, porcelainWhite, 0.65);
cylinder(1.43, 1.51, 0.34, 96, porcelainWhite, 0.84);
torus(1.39, 0.105, porcelainBlue, 1.01);

const glazePool = cylinder(1.62, 1.7, 0.075, 96, porcelainWhite, 0.37);
glazePool.material = porcelainWhite.clone();
glazePool.material.roughness = 0.09;
glazePool.material.clearcoat = 1;

const towerBottom = 1.39;
const towerTop = 0.82;
const towerHeight = 5.72;
const towerCenterY = 3.91;
const towerMinY = towerCenterY - towerHeight / 2;
const towerMaxY = towerCenterY + towerHeight / 2;

const tower = cylinder(towerTop, towerBottom, towerHeight, 128, porcelainWhite, towerCenterY);
tower.geometry.computeVertexNormals();

function towerRadiusAt(y) {
  const t = THREE.MathUtils.clamp((y - towerMinY) / towerHeight, 0, 1);
  return THREE.MathUtils.lerp(towerBottom, towerTop, t);
}

function createSpiralRibbon() {
  const turns = 3.05;
  const thetaStart = -0.48;
  const thetaEnd = thetaStart + turns * Math.PI * 2;
  const yStart = 1.25;
  const yEnd = 6.48;
  const bandHeight = 0.55;
  const alongSegments = 300;
  const acrossSegments = 5;
  const positions = [];
  const indices = [];

  for (let i = 0; i <= alongSegments; i++) {
    const u = i / alongSegments;
    const theta = THREE.MathUtils.lerp(thetaStart, thetaEnd, u);
    const centerY = THREE.MathUtils.lerp(yStart, yEnd, u);

    for (let j = 0; j <= acrossSegments; j++) {
      const v = j / acrossSegments;
      const y = centerY + (v - 0.5) * bandHeight;
      const radius = towerRadiusAt(y) + 0.012;
      positions.push(
        Math.cos(theta) * radius,
        y,
        Math.sin(theta) * radius
      );
    }
  }

  const row = acrossSegments + 1;
  for (let i = 0; i < alongSegments; i++) {
    for (let j = 0; j < acrossSegments; j++) {
      const a = i * row + j;
      const b = (i + 1) * row + j;
      const c = (i + 1) * row + j + 1;
      const d = i * row + j + 1;
      indices.push(a, b, d, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const spiral = mesh(createSpiralRibbon(), porcelainBlue);
spiral.renderOrder = 1;

function makeWindow(y, angle, scale = 1) {
  const radius = towerRadiusAt(y) + 0.035;
  const frame = new THREE.Mesh(
    new THREE.TorusGeometry(0.23 * scale, 0.065 * scale, 14, 48),
    porcelainBlue
  );
  frame.scale.y = 1.22;
  frame.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
  frame.lookAt(0, y, 0);
  frame.rotateY(Math.PI);
  lighthouse.add(frame);

  const pane = new THREE.Mesh(
    new THREE.CircleGeometry(0.205 * scale, 48),
    deepBlue
  );
  pane.scale.y = 1.22;
  pane.position.set(
    Math.cos(angle) * (radius + 0.012),
    y,
    Math.sin(angle) * (radius + 0.012)
  );
  pane.lookAt(
    Math.cos(angle) * (radius + 1),
    y,
    Math.sin(angle) * (radius + 1)
  );
  lighthouse.add(pane);

  const crossH = new THREE.Mesh(
    new THREE.BoxGeometry(0.31 * scale, 0.035 * scale, 0.025),
    gold
  );
  const crossV = new THREE.Mesh(
    new THREE.BoxGeometry(0.035 * scale, 0.39 * scale, 0.025),
    gold
  );

  for (const cross of [crossH, crossV]) {
    cross.position.copy(pane.position);
    cross.lookAt(
      Math.cos(angle) * (radius + 1),
      y,
      Math.sin(angle) * (radius + 1)
    );
    cross.translateZ(0.02);
    lighthouse.add(cross);
  }
}

makeWindow(2.72, 0.28, 0.9);
makeWindow(4.35, Math.PI + 0.44, 0.82);
makeWindow(5.65, -0.55, 0.72);

const doorAngle = Math.PI * 0.12;
const doorRadius = towerRadiusAt(1.53) + 0.045;
const doorShape = new THREE.Shape();
doorShape.moveTo(-0.36, -0.58);
doorShape.lineTo(0.36, -0.58);
doorShape.lineTo(0.36, 0.18);
doorShape.absarc(0, 0.18, 0.36, 0, Math.PI, false);
doorShape.lineTo(-0.36, -0.58);

const door = new THREE.Mesh(
  new THREE.ExtrudeGeometry(doorShape, {
    depth: 0.07,
    bevelEnabled: true,
    bevelSegments: 4,
    steps: 1,
    bevelSize: 0.045,
    bevelThickness: 0.035,
    curveSegments: 24
  }),
  deepBlue
);
door.position.set(
  Math.cos(doorAngle) * doorRadius,
  1.58,
  Math.sin(doorAngle) * doorRadius
);
door.rotation.y = Math.PI / 2 - doorAngle;
door.translateX(-0.035);
lighthouse.add(door);

const doorKnob = new THREE.Mesh(new THREE.SphereGeometry(0.055, 20, 12), gold);
doorKnob.position.set(
  Math.cos(doorAngle) * (doorRadius + 0.09) - Math.sin(doorAngle) * 0.22,
  1.42,
  Math.sin(doorAngle) * (doorRadius + 0.09) + Math.cos(doorAngle) * 0.22
);
lighthouse.add(doorKnob);

torus(0.83, 0.085, porcelainBlue, 6.76);
cylinder(1.05, 1.05, 0.16, 96, porcelainWhite, 6.88);
torus(1.01, 0.085, porcelainWhite, 6.96);
cylinder(0.88, 0.92, 0.12, 96, porcelainBlue, 7.05);

const lanternBottom = 7.09;
const lanternTop = 8.03;
const lanternRadius = 0.72;

cylinder(0.78, 0.82, 0.13, 64, porcelainWhite, lanternBottom);

const paneCount = 8;
for (let i = 0; i < paneCount; i++) {
  const angle = i * Math.PI * 2 / paneCount;
  const post = new THREE.Mesh(
    new THREE.CylinderGeometry(0.045, 0.052, 0.86, 20),
    gold
  );
  post.position.set(
    Math.cos(angle) * lanternRadius,
    7.57,
    Math.sin(angle) * lanternRadius
  );
  lighthouse.add(post);

  const nextAngle = angle + Math.PI * 2 / paneCount;
  const midAngle = (angle + nextAngle) / 2;
  const chord = 2 * lanternRadius * Math.sin(Math.PI / paneCount);
  const pane = new THREE.Mesh(
    new THREE.PlaneGeometry(chord * 0.91, 0.76),
    glass
  );
  pane.position.set(
    Math.cos(midAngle) * lanternRadius,
    7.57,
    Math.sin(midAngle) * lanternRadius
  );
  pane.lookAt(0, 7.57, 0);
  pane.rotateY(Math.PI);
  lighthouse.add(pane);
}

torus(0.72, 0.038, gold, 7.18, 10, 64);
torus(0.72, 0.038, gold, 7.96, 10, 64);

const lampCore = new THREE.Mesh(
  new THREE.SphereGeometry(0.22, 32, 20),
  warmGlass
);
lampCore.position.y = 7.58;
lighthouse.add(lampCore);

const lampStem = new THREE.Mesh(
  new THREE.CylinderGeometry(0.045, 0.075, 0.52, 18),
  gold
);
lampStem.position.y = 7.35;
lighthouse.add(lampStem);

const lampLight = new THREE.PointLight(0xffd181, 7, 4, 2);
lampLight.position.set(0, 7.62, 0);
lighthouse.add(lampLight);

cylinder(0.84, 0.78, 0.13, 64, porcelainBlue, 8.05);
torus(0.79, 0.075, porcelainWhite, 8.1);

const domeProfile = [
  new THREE.Vector2(0.0, 0.49),
  new THREE.Vector2(0.18, 0.47),
  new THREE.Vector2(0.39, 0.39),
  new THREE.Vector2(0.61, 0.25),
  new THREE.Vector2(0.77, 0.08),
  new THREE.Vector2(0.82, 0.0)
];
const dome = mesh(
  new THREE.LatheGeometry(domeProfile, 96),
  porcelainBlue,
  0,
  8.12,
  0
);
dome.geometry.computeVertexNormals();

torus(0.8, 0.055, gold, 8.14);
const crownFinial = new THREE.Mesh(
  new THREE.SphereGeometry(0.105, 28, 18),
  gold
);
crownFinial.position.y = 8.66;
lighthouse.add(crownFinial);

const vaneMast = new THREE.Mesh(
  new THREE.CylinderGeometry(0.025, 0.035, 0.88, 16),
  gold
);
vaneMast.position.y = 9.08;
lighthouse.add(vaneMast);

const compassBar = new THREE.Mesh(
  new THREE.CylinderGeometry(0.018, 0.018, 1.05, 12),
  gold
);
compassBar.rotation.z = Math.PI / 2;
compassBar.position.y = 9.15;
lighthouse.add(compassBar);

const arrowShaft = new THREE.Mesh(
  new THREE.CylinderGeometry(0.026, 0.026, 1.65, 12),
  gold
);
arrowShaft.rotation.z = Math.PI / 2;
arrowShaft.position.y = 9.43;
lighthouse.add(arrowShaft);

const arrowHeadShape = new THREE.Shape();
arrowHeadShape.moveTo(0.32, 0);
arrowHeadShape.lineTo(-0.18, 0.2);
arrowHeadShape.lineTo(-0.1, 0);
arrowHeadShape.lineTo(-0.18, -0.2);
arrowHeadShape.closePath();

const arrowHead = new THREE.Mesh(
  new THREE.ExtrudeGeometry(arrowHeadShape, {
    depth: 0.035,
    bevelEnabled: true,
    bevelSize: 0.012,
    bevelThickness: 0.012,
    bevelSegments: 2
  }),
  gold
);
arrowHead.position.set(0.82, 9.43, -0.018);
lighthouse.add(arrowHead);

const tailShape = new THREE.Shape();
tailShape.moveTo(-0.05, 0);
tailShape.lineTo(-0.48, 0.28);
tailShape.lineTo(-0.48, -0.28);
tailShape.closePath();

const arrowTail = new THREE.Mesh(
  new THREE.ExtrudeGeometry(tailShape, {
    depth: 0.035,
    bevelEnabled: true,
    bevelSize: 0.012,
    bevelThickness: 0.012,
    bevelSegments: 2
  }),
  darkGold
);
arrowTail.position.set(-0.76, 9.43, -0.018);
lighthouse.add(arrowTail);

for (const direction of [-1, 1]) {
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 10), gold);
  cap.position.set(direction * 0.54, 9.15, 0);
  lighthouse.add(cap);
}

const topCap = new THREE.Mesh(new THREE.SphereGeometry(0.06, 18, 12), gold);
topCap.position.y = 9.55;
lighthouse.add(topCap);

const displayGround = new THREE.Mesh(
  new THREE.CircleGeometry(7.5, 128),
  new THREE.MeshStandardMaterial({
    color: 0xdde7eb,
    roughness: 0.82,
    metalness: 0
  })
);
displayGround.rotation.x = -Math.PI / 2;
displayGround.position.y = 0.31;
displayGround.receiveShadow = true;
scene.add(displayGround);

const pedestalShadow = new THREE.Mesh(
  new THREE.CircleGeometry(2.25, 96),
  new THREE.MeshBasicMaterial({
    color: 0x8fa3ad,
    transparent: true,
    opacity: 0.12,
    depthWrite: false
  })
);
pedestalShadow.rotation.x = -Math.PI / 2;
pedestalShadow.position.y = 0.325;
scene.add(pedestalShadow);

applyShadows(lighthouse);

const hemisphere = new THREE.HemisphereLight(0xeaf7ff, 0x8a715d, 2.15);
scene.add(hemisphere);

const keyLight = new THREE.DirectionalLight(0xfff3dc, 5.2);
keyLight.position.set(7, 12, 8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 12;
keyLight.shadow.camera.bottom = -3;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 30;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.025;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x9bc8ff, 2.1);
fillLight.position.set(-8, 7, 5);
scene.add(fillLight);

const rimLight = new THREE.SpotLight(0xd7ecff, 18, 30, Math.PI / 5, 0.65, 1.2);
rimLight.position.set(-6, 11, -9);
rimLight.target.position.set(0, 5, 0);
scene.add(rimLight, rimLight.target);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  lampLight.intensity = 6.7 + Math.sin(elapsed * 1.7) * 0.35;
  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
