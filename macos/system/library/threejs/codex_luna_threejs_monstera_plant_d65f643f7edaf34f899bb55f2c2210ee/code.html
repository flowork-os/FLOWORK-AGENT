<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monstera Deliciosa</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #b9c6b8; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9c6b8);
scene.fog = new THREE.Fog(0xb9c6b8, 18, 34);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(10, 8.2, 14);
camera.lookAt(0, 4.4, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.target.set(0, 4.1, 0);
controls.minDistance = 8;
controls.maxDistance = 23;
controls.maxPolarAngle = Math.PI * 0.48;

scene.add(new THREE.HemisphereLight(0xe9f2e4, 0x4c5546, 2.0));

const key = new THREE.DirectionalLight(0xfff5db, 3.4);
key.position.set(-7, 13, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -12;
key.shadow.camera.right = 12;
key.shadow.camera.top = 16;
key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fc7aa, 1.1);
fill.position.set(8, 7, -7);
scene.add(fill);

const groundMat = new THREE.MeshStandardMaterial({ color: 0x8b9a87, roughness: 0.96 });
const ground = new THREE.Mesh(new THREE.CircleGeometry(20, 96), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.04;
ground.receiveShadow = true;
scene.add(ground);

const potMat = new THREE.MeshPhysicalMaterial({
  color: 0xd9d4c8,
  roughness: 0.27,
  metalness: 0,
  clearcoat: 0.25,
  clearcoatRoughness: 0.22
});

const potProfile = [
  new THREE.Vector2(1.78, 0.05),
  new THREE.Vector2(1.7, 0.18),
  new THREE.Vector2(1.56, 2.55),
  new THREE.Vector2(1.48, 2.72),
  new THREE.Vector2(1.62, 2.82),
  new THREE.Vector2(1.78, 2.84)
];
const pot = new THREE.Mesh(new THREE.LatheGeometry(potProfile, 96), potMat);
pot.castShadow = true;
pot.receiveShadow = true;
scene.add(pot);

const rim = new THREE.Mesh(new THREE.TorusGeometry(1.68, 0.115, 18, 96), potMat);
rim.rotation.x = Math.PI / 2;
rim.position.y = 2.78;
rim.castShadow = true;
scene.add(rim);

const soil = new THREE.Mesh(
  new THREE.CylinderGeometry(1.51, 1.51, 0.13, 96),
  new THREE.MeshStandardMaterial({ color: 0x34271b, roughness: 1 })
);
soil.position.y = 2.76;
soil.castShadow = true;
scene.add(soil);

function cylinderBetween(a, b, radius, material, radial = 10) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius * 0.92, direction.length(), radial),
    material
  );
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  return mesh;
}

const stemMat = new THREE.MeshStandardMaterial({
  color: 0x496d35,
  roughness: 0.63
});
const veinMat = new THREE.MeshStandardMaterial({
  color: 0x315c2b,
  roughness: 0.52
});
const leafMat = new THREE.MeshPhysicalMaterial({
  color: 0x286d35,
  roughness: 0.3,
  metalness: 0,
  clearcoat: 0.32,
  clearcoatRoughness: 0.23,
  side: THREE.DoubleSide
});

function ellipsePath(cx, cy, rx, ry, rotation = 0) {
  const p = new THREE.Path();
  p.absellipse(cx, cy, rx, ry, 0, Math.PI * 2, false, rotation);
  return p;
}

function createLeaf(scale = 1) {
  const shape = new THREE.Shape();
  shape.moveTo(0, -2.15);
  shape.quadraticCurveTo(-1.55, -2.0, -2.15, -0.78);
  shape.quadraticCurveTo(-2.68, 0.3, -2.18, 1.18);
  shape.quadraticCurveTo(-1.82, 1.84, -1.08, 1.78);
  shape.quadraticCurveTo(-0.5, 1.72, -0.18, 2.22);
  shape.quadraticCurveTo(-0.02, 2.5, 0, 3.62);
  shape.quadraticCurveTo(0.02, 2.5, 0.18, 2.22);
  shape.quadraticCurveTo(0.5, 1.72, 1.08, 1.78);
  shape.quadraticCurveTo(1.82, 1.84, 2.18, 1.18);
  shape.quadraticCurveTo(2.68, 0.3, 2.15, -0.78);
  shape.quadraticCurveTo(1.55, -2.0, 0, -2.15);

  const holes = [
    [-1.32, -0.65, 0.22, 0.5, -0.22],
    [1.32, -0.65, 0.22, 0.5, 0.22],
    [-1.55, 0.12, 0.2, 0.52, -0.32],
    [1.55, 0.12, 0.2, 0.52, 0.32],
    [-1.17, 0.78, 0.18, 0.38, -0.38],
    [1.17, 0.78, 0.18, 0.38, 0.38],
    [-0.7, 1.28, 0.14, 0.3, -0.42],
    [0.7, 1.28, 0.14, 0.3, 0.42]
  ];
  for (const h of holes) shape.holes.push(ellipsePath(...h));

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.075,
    bevelEnabled: true,
    bevelThickness: 0.025,
    bevelSize: 0.035,
    bevelSegments: 2,
    curveSegments: 12
  });
  geometry.translate(0, 0, -0.015);
  geometry.scale(scale, scale, scale);

  const group = new THREE.Group();
  const leaf = new THREE.Mesh(geometry, leafMat);
  leaf.castShadow = true;
  leaf.receiveShadow = true;
  group.add(leaf);

  const s = scale;
  const central = new THREE.Mesh(
    new THREE.CylinderGeometry(0.052 * s, 0.072 * s, 5.72 * s, 10),
    veinMat
  );
  central.position.set(0, 0.71 * s, 0.105 * s);
  central.rotation.z = 0;
  group.add(central);

  const veinYs = [-1.22, -0.62, 0.0, 0.58, 1.1, 1.58];
  const veinEnds = [1.55, 1.92, 2.16, 1.98, 1.57, 1.02];
  for (let i = 0; i < veinYs.length; i++) {
    const y = veinYs[i] * s;
    const x = veinEnds[i] * s;
    const left = cylinderBetween(
      new THREE.Vector3(0, y, 0.1 * s),
      new THREE.Vector3(-x, (y + 0.33) * s, 0.1 * s),
      0.025 * s,
      veinMat,
      7
    );
    const right = cylinderBetween(
      new THREE.Vector3(0, y, 0.1 * s),
      new THREE.Vector3(x, (y + 0.33) * s, 0.1 * s),
      0.025 * s,
      veinMat,
      7
    );
    group.add(left, right);
  }
  return group;
}

function addPlantLeaf(config) {
  const base = new THREE.Vector3(...config.base);
  const tip = new THREE.Vector3(...config.tip);
  const control = new THREE.Vector3(
    (base.x + tip.x) * 0.42 + config.bend[0],
    base.y + (tip.y - base.y) * 0.48 + config.bend[1],
    (base.z + tip.z) * 0.42 + config.bend[2]
  );
  const curve = new THREE.QuadraticBezierCurve3(base, control, tip);
  const stem = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 24, config.stem || 0.085, 10, false),
    stemMat
  );
  stem.castShadow = true;
  scene.add(stem);

  const leaf = createLeaf(config.scale);
  leaf.position.copy(tip);
  leaf.rotation.set(config.rot[0], config.rot[1], config.rot[2]);
  leaf.scale.y *= config.length || 1;
  scene.add(leaf);
}

addPlantLeaf({
  base: [-0.55, 2.82, 0.12], tip: [-2.35, 7.05, 0.1],
  bend: [-0.2, 0.35, 0.0], scale: 1.14, length: 1.08,
  rot: [0.18, -0.48, -0.7], stem: 0.105
});
addPlantLeaf({
  base: [0.35, 2.82, 0.1], tip: [2.35, 7.15, 0.05],
  bend: [0.35, 0.45, 0.1], scale: 1.12, length: 1.04,
  rot: [-0.16, 0.43, 0.62], stem: 0.105
});
addPlantLeaf({
  base: [-0.25, 2.82, -0.18], tip: [-3.65, 5.72, 0.4],
  bend: [-0.5, 0.15, 0.2], scale: 1.2, length: 0.94,
  rot: [0.2, -0.82, -1.0], stem: 0.11
});
addPlantLeaf({
  base: [0.1, 2.83, 0.25], tip: [3.62, 5.38, 0.55],
  bend: [0.55, 0.12, 0.2], scale: 1.16, length: 0.92,
  rot: [-0.2, 0.78, 0.95], stem: 0.105
});
addPlantLeaf({
  base: [-0.72, 2.84, -0.12], tip: [-3.05, 3.98, -1.05],
  bend: [-0.25, -0.15, -0.25], scale: 1.05, length: 0.9,
  rot: [0.58, -0.62, -1.05], stem: 0.095
});
addPlantLeaf({
  base: [0.72, 2.84, -0.1], tip: [3.15, 4.08, -0.82],
  bend: [0.25, -0.12, -0.18], scale: 1.0, length: 0.88,
  rot: [0.52, 0.62, 1.0], stem: 0.09
});
addPlantLeaf({
  base: [-0.12, 2.86, 0.0], tip: [-0.75, 7.72, -0.05],
  bend: [-0.1, 0.45, 0.0], scale: 1.0, length: 1.03,
  rot: [0.04, -0.1, -0.18], stem: 0.09
});
addPlantLeaf({
  base: [0.18, 2.83, -0.3], tip: [0.92, 5.65, -1.52],
  bend: [0.2, 0.2, -0.3], scale: 0.9, length: 0.95,
  rot: [0.62, 0.12, 0.32], stem: 0.082
});

const aerialMat = new THREE.MeshStandardMaterial({ color: 0x668c46, roughness: 0.8 });
const aerialRoots = [
  [[-0.72, 2.83, -0.15], [-0.9, 1.78, -0.45], [-0.74, 1.1, -0.8]],
  [[0.63, 2.83, 0.18], [0.83, 1.74, 0.48], [0.68, 1.05, 0.7]],
  [[-0.1, 2.82, 0.36], [-0.22, 1.62, 0.68], [-0.1, 0.98, 0.72]]
];
for (const points of aerialRoots) {
  const c = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const root = new THREE.Mesh(new THREE.TubeGeometry(c, 18, 0.035, 7, false), aerialMat);
  root.castShadow = true;
  scene.add(root);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
