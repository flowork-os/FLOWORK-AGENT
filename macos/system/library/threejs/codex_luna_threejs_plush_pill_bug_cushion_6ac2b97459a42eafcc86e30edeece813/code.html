<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plush Pill Bug</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #c9c4d8; }
canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9c4d8);
scene.fog = new THREE.Fog(0xc9c4d8, 11, 22);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.2, 4.6, 8.5);
camera.lookAt(0, -0.05, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.25;
controls.minDistance = 5;
controls.maxDistance = 14;
controls.target.set(0, -0.1, 0);

scene.add(new THREE.HemisphereLight(0xf5efff, 0x665d75, 2.1));

const keyLight = new THREE.DirectionalLight(0xfff5e8, 3.2);
keyLight.position.set(-4, 8, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -7;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xbfc8ff, 1.3);
fillLight.position.set(6, 3, -5);
scene.add(fillLight);

const shellColors = [0x9e9ca6, 0xa7a5ae, 0xaaa9b1, 0x9a99a4, 0xa4a2ac, 0x9897a1, 0xa8a6af, 0x9998a3];
const shellMaterials = shellColors.map(color => new THREE.MeshStandardMaterial({
  color,
  roughness: 0.96,
  metalness: 0,
  flatShading: false
}));
const lilacMaterial = new THREE.MeshStandardMaterial({
  color: 0xaaa0bb,
  roughness: 1,
  metalness: 0
});
const stitchMaterial = new THREE.MeshStandardMaterial({
  color: 0xf1dfbd,
  roughness: 0.9
});
const darkFeltMaterial = new THREE.MeshStandardMaterial({
  color: 0x575463,
  roughness: 1
});
const eyeMaterial = new THREE.MeshStandardMaterial({
  color: 0x272532,
  roughness: 0.85
});
const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0xb6b0c4,
  roughness: 1
});

const bug = new THREE.Group();
bug.rotation.y = -0.12;
scene.add(bug);

function ellipsoid(material, position, scale, segments = 32) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, segments, 20), material);
  mesh.position.set(position.x, position.y, position.z);
  mesh.scale.set(scale.x, scale.y, scale.z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  bug.add(mesh);
  return mesh;
}

const underside = ellipsoid(lilacMaterial, { x: 0.2, y: -0.49, z: 0 }, { x: 3.55, y: 0.64, z: 1.02 }, 40);

const bandXs = [-2.72, -1.95, -1.18, -0.4, 0.38, 1.16, 1.94, 2.70];
const bandScales = [
  { x: 0.88, y: 0.96, z: 0.94 },
  { x: 0.94, y: 1.04, z: 1.00 },
  { x: 0.96, y: 1.08, z: 1.04 },
  { x: 0.98, y: 1.10, z: 1.07 },
  { x: 0.99, y: 1.11, z: 1.08 },
  { x: 0.97, y: 1.08, z: 1.05 },
  { x: 0.93, y: 1.04, z: 1.01 },
  { x: 0.84, y: 0.94, z: 0.91 }
];

for (let i = 0; i < bandXs.length; i++) {
  const x = bandXs[i];
  const s = bandScales[i];
  const lift = Math.abs(x) * 0.018;
  ellipsoid(shellMaterials[i], { x, y: 0.03 + lift, z: 0 }, s, 36);

  const stitchCount = 24;
  for (let j = 0; j < stitchCount; j++) {
    const angle = (j / stitchCount) * Math.PI * 2;
    const y = 0.03 + lift + Math.cos(angle) * (s.y * 0.91);
    const z = Math.sin(angle) * (s.z * 0.925);
    const stitch = new THREE.Mesh(new THREE.SphereGeometry(0.046, 8, 6), stitchMaterial);
    stitch.position.set(x, y, z);
    stitch.scale.set(1.25, 0.68, 0.68);
    stitch.castShadow = true;
    bug.add(stitch);
  }
}

const legPositions = [-2.55, -1.82, -1.08, -0.34, 0.40, 1.14, 1.88, 2.55];

function makeLeg(x, zSide, index) {
  const start = new THREE.Vector3(x, -0.77, zSide * 0.37);
  const end = new THREE.Vector3(x + (index % 2 === 0 ? -0.08 : 0.08), -1.18, zSide * 0.85);
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.12, length, 10), darkFeltMaterial);
  leg.position.copy(start).add(end).multiplyScalar(0.5);
  leg.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  leg.castShadow = true;
  bug.add(leg);

  const foot = ellipsoid(darkFeltMaterial, end, { x: 0.16, y: 0.10, z: 0.12 }, 12);
  foot.rotation.y = zSide * 0.2;
}

for (let i = 0; i < legPositions.length; i++) {
  makeLeg(legPositions[i], -1, i);
  if (i % 2 === 1) makeLeg(legPositions[i] + 0.04, 1, i);
}

const frontX = -3.48;
for (const z of [-0.38, 0.38]) {
  const eye = ellipsoid(eyeMaterial, { x: frontX, y: 0.38, z }, { x: 0.055, y: 0.14, z: 0.14 }, 16);
  eye.rotation.z = z * 0.2;
}

for (let i = 0; i < 115; i++) {
  const t = i / 114;
  const x = -3.2 + t * 6.25;
  const angle = i * 2.399;
  const radius = 0.58 + ((i * 17) % 29) / 100;
  const y = 0.28 + Math.cos(angle) * radius * 0.72;
  const z = Math.sin(angle) * radius * 0.86;
  if (y < 0.43 || Math.abs(z) < 0.34) continue;
  const fiberMaterial = new THREE.MeshStandardMaterial({
    color: i % 3 === 0 ? 0xc0bdc4 : 0xb0aeb8,
    roughness: 1
  });
  const fiber = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.015, 0.16 + (i % 4) * 0.025, 5), fiberMaterial);
  fiber.position.set(x, y + 0.035, z);
  fiber.rotation.set(
    Math.sin(angle) * 0.55,
    Math.cos(angle) * 0.55,
    angle
  );
  fiber.castShadow = true;
  bug.add(fiber);
}

for (let i = 0; i < 16; i++) {
  const x = -2.9 + i * 0.39;
  const pucker = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 6), stitchMaterial);
  pucker.position.set(x, 0.91 + Math.sin(i * 1.7) * 0.035, 0.08 + Math.cos(i) * 0.04);
  pucker.scale.set(1.4, 0.45, 0.7);
  pucker.castShadow = true;
  bug.add(pucker);
}

const floor = new THREE.Mesh(new THREE.CircleGeometry(14, 64), groundMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.31;
floor.receiveShadow = true;
scene.add(floor);

const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(3.7, 64),
  new THREE.MeshBasicMaterial({ color: 0x81798d, transparent: true, opacity: 0.18 })
);
shadow.rotation.x = -Math.PI / 2;
shadow.scale.set(1, 0.34, 1);
shadow.position.set(0, -1.295, 0);
scene.add(shadow);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
