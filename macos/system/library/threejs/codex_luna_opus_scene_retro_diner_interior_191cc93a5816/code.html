<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1950s Retro Diner</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #120c18;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #caption {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(255, 233, 211, 0.72);
      font-family: Georgia, serif;
      letter-spacing: 0.12em;
      font-size: 11px;
      pointer-events: none;
      text-transform: uppercase;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="caption">Open all night · Established 1957</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x140d1b);
    scene.fog = new THREE.Fog(0x140d1b, 17, 32);

    const camera = new THREE.PerspectiveCamera(
      48,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(13.5, 9.5, 15.5);
    camera.lookAt(0, 2.1, -0.8);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;
    controls.minDistance = 8;
    controls.maxDistance = 26;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.target.set(0, 2.1, -0.8);

    let seed = 1957;
    function random() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    }

    const palette = {
      cream: 0xf5d8ae,
      pale: 0xffefcb,
      red: 0xb82939,
      darkRed: 0x651827,
      cherry: 0xe84050,
      teal: 0x168c91,
      cyan: 0x4de7eb,
      pink: 0xff3fa4,
      gold: 0xf2bb54,
      chrome: 0xbac7c8,
      darkChrome: 0x52636c,
      black: 0x17151a,
      wood: 0x4d211b,
      tileDark: 0x292136,
      tileLight: 0xf2d9c2,
      glass: 0x9ee8e5
    };

    const materials = {};
    function material(name, color, options = {}) {
      const params = {
        color,
        roughness: options.roughness ?? 0.48,
        metalness: options.metalness ?? 0
      };
      if (options.emissive !== undefined) {
        params.emissive = options.emissive;
        params.emissiveIntensity = options.emissiveIntensity ?? 1;
      }
      if (options.transparent) {
        params.transparent = true;
        params.opacity = options.opacity ?? 0.5;
        params.depthWrite = options.depthWrite ?? false;
      }
      const created = new THREE.MeshStandardMaterial(params);
      materials[name] = created;
      return created;
    }

    const creamMat = material('cream', palette.cream, { roughness: 0.62 });
    const paleMat = material('pale', palette.pale, { roughness: 0.58 });
    const redMat = material('red', palette.red, { roughness: 0.34 });
    const darkRedMat = material('darkRed', palette.darkRed, { roughness: 0.4 });
    const cherryMat = material('cherry', palette.cherry, { roughness: 0.28 });
    const tealMat = material('teal', palette.teal, { roughness: 0.31 });
    const goldMat = material('gold', palette.gold, { roughness: 0.3, metalness: 0.2 });
    const chromeMat = material('chrome', palette.chrome, { roughness: 0.18, metalness: 0.88 });
    const darkChromeMat = material('darkChrome', palette.darkChrome, { roughness: 0.24, metalness: 0.82 });
    const blackMat = material('black', palette.black, { roughness: 0.42 });
    const woodMat = material('wood', palette.wood, { roughness: 0.56 });
    const tileDarkMat = material('tileDark', palette.tileDark, { roughness: 0.68 });
    const tileLightMat = material('tileLight', palette.tileLight, { roughness: 0.67 });
    const glassMat = material('glass', palette.glass, {
      roughness: 0.08,
      metalness: 0.08,
      transparent: true,
      opacity: 0.22,
      depthWrite: false
    });
    const pinkGlowMat = material('pinkGlow', palette.pink, {
      roughness: 0.2,
      emissive: palette.pink,
      emissiveIntensity: 4
    });
    const cyanGlowMat = material('cyanGlow', palette.cyan, {
      roughness: 0.2,
      emissive: palette.cyan,
      emissiveIntensity: 4
    });
    const warmGlowMat = material('warmGlow', 0xffa844, {
      roughness: 0.2,
      emissive: 0xff6d20,
      emissiveIntensity: 2.8
    });

    function box(width, height, depth, mat, x, y, z, parent = scene) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function cylinder(radiusTop, radiusBottom, height, mat, x, y, z, segments = 24, parent = scene) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
        mat
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function sphere(radius, mat, x, y, z, scale = [1, 1, 1], parent = scene) {
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 28, 18), mat);
      mesh.position.set(x, y, z);
      mesh.scale.set(scale[0], scale[1], scale[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function torus(radius, tube, mat, x, y, z, rotation = [0, 0, 0], parent = scene) {
      const mesh = new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 12, 36), mat);
      mesh.position.set(x, y, z);
      mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function plane(width, height, mat, x, y, z, rotation = [0, 0, 0], parent = scene) {
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width, height), mat);
      mesh.position.set(x, y, z);
      mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function cylinderBetween(a, b, radius, mat, parent = scene, segments = 16) {
      const start = new THREE.Vector3(a[0], a[1], a[2]);
      const end = new THREE.Vector3(b[0], b[1], b[2]);
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();
      const mesh = cylinder(radius, radius, length, mat, 0, 0, 0, segments, parent);
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      return mesh;
    }

    function textTexture(text, width, height, color, background, font = 'bold 54px Georgia') {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d');
      context.fillStyle = background;
      context.fillRect(0, 0, width, height);
      context.textAlign = 'center';
      context.textBaseline = 'middle';
      context.font = font;
      context.shadowColor = color;
      context.shadowBlur = 18;
      context.fillStyle = color;
      context.fillText(text, width / 2, height / 2);
      context.shadowBlur = 0;
      context.strokeStyle = 'rgba(255,255,255,0.2)';
      context.lineWidth = 3;
      context.strokeText(text, width / 2, height / 2);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    function checkerTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const context = canvas.getContext('2d');
      const size = 32;
      for (let row = 0; row < 8; row += 1) {
        for (let col = 0; col < 8; col += 1) {
          context.fillStyle = (row + col) % 2 === 0 ? '#f0d9c2' : '#262039';
          context.fillRect(col * size, row * size, size, size);
        }
      }
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(9, 6);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const floorMat = new THREE.MeshStandardMaterial({
      map: checkerTexture(),
      roughness: 0.72,
      metalness: 0.04
    });

    box(19, 0.4, 13, floorMat, 0, -0.28, 0);
    box(19, 7.6, 0.35, woodMat, 0, 3.8, -6.25);
    box(0.35, 7.6, 13, woodMat, -9.35, 3.8, 0);
    box(0.35, 7.6, 13, woodMat, 9.35, 3.8, 0);

    box(18.4, 0.18, 0.18, goldMat, 0, 0.02, -6.03);
    box(0.18, 7.4, 0.18, goldMat, -9.12, 3.8, 0);
    box(0.18, 7.4, 0.18, goldMat, 9.12, 3.8, 0);

    for (let x = -8.5; x <= 8.5; x += 2.2) {
      box(0.08, 7.1, 0.08, darkChromeMat, x, 3.8, -6.02);
    }

    for (let x = -8.7; x <= 8.7; x += 2.1) {
      box(2.0, 0.08, 0.08, darkChromeMat, x, 3.4, -6.0);
      box(2.0, 0.08, 0.08, darkChromeMat, x, 6.2, -6.0);
    }

    const windowGlassMat = material('windowGlass', 0x172b46, {
      roughness: 0.12,
      metalness: 0.08,
      transparent: true,
      opacity: 0.58,
      depthWrite: false
    });
    box(16.5, 3.1, 0.04, windowGlassMat, 0, 4.72, -6.02);
    const windowLight = new THREE.PointLight(0x2959a0, 0.9, 13, 2);
    windowLight.position.set(0, 4.6, -5.3);
    scene.add(windowLight);

    function addNeonTube(width, height, mat, x, y, z) {
      const tube = box(width, height, 0.055, mat, x, y, z);
      tube.castShadow = false;
      tube.receiveShadow = false;
      return tube;
    }

    const signBack = box(7.6, 1.75, 0.13, blackMat, 0, 4.6, -5.85);
    const signTexture = textTexture('ALL NIGHT EATS', 1024, 220, '#ff82c4', '#22132d', 'bold 82px Georgia');
    const signMat = new THREE.MeshBasicMaterial({
      map: signTexture,
      transparent: true,
      side: THREE.DoubleSide
    });
    const signPlane = plane(7.2, 1.55, signMat, 0, 4.6, -5.76);
    signPlane.castShadow = false;
    addNeonTube(7.3, 0.06, cyanGlowMat, 0, 3.72, -5.68);
    addNeonTube(7.3, 0.06, pinkGlowMat, 0, 5.48, -5.68);
    addNeonTube(0.06, 1.7, cyanGlowMat, -3.8, 4.6, -5.68);
    addNeonTube(0.06, 1.7, pinkGlowMat, 3.8, 4.6, -5.68);

    const pinkLight = new THREE.PointLight(palette.pink, 4.5, 10, 2);
    pinkLight.position.set(3.1, 4.5, -3.3);
    scene.add(pinkLight);
    const cyanLight = new THREE.PointLight(palette.cyan, 4.0, 11, 2);
    cyanLight.position.set(-3.1, 4.3, -3.4);
    scene.add(cyanLight);

    const ceiling = box(18.5, 0.3, 12.4, creamMat, 0, 7.55, 0);
    ceiling.receiveShadow = true;

    for (let x = -8.2; x <= 8.2; x += 2.05) {
      box(0.075, 0.08, 12.1, goldMat, x, 7.38, 0);
    }
    for (let z = -5.4; z <= 5.4; z += 1.8) {
      box(18.2, 0.08, 0.075, goldMat, 0, 7.37, z);
    }

    function addCeilingLight(x, z) {
      const fixture = new THREE.Group();
      fixture.position.set(x, 7.2, z);
      scene.add(fixture);
      cylinder(0.08, 0.08, 0.45, darkChromeMat, 0, 0.26, 0, 12, fixture);
      const shade = cylinder(0.42, 0.25, 0.22, goldMat, 0, 0.02, 0, 24, fixture);
      shade.rotation.x = Math.PI;
      cylinder(0.22, 0.22, 0.05, warmGlowMat, 0, -0.11, 0, 20, fixture);
      const light = new THREE.PointLight(0xffb36a, 2.2, 6.5, 2);
      light.position.set(0, -0.16, 0);
      light.castShadow = true;
      light.shadow.mapSize.set(512, 512);
      fixture.add(light);
    }

    addCeilingLight(-5.7, -2.2);
    addCeilingLight(0.1, -2.2);
    addCeilingLight(5.8, -2.2);
    addCeilingLight(-2.7, 2.8);
    addCeilingLight(3.4, 2.8);

    const fanGroups = [];
    function addCeilingFan(x, z, scale) {
      const fan = new THREE.Group();
      fan.position.set(x, 7.05, z);
      fan.scale.setScalar(scale);
      scene.add(fan);
      cylinder(0.07, 0.07, 0.7, darkChromeMat, 0, 0.32, 0, 14, fan);
      sphere(0.23, chromeMat, 0, -0.04, 0, [1, 0.72, 1], fan);
      const blades = new THREE.Group();
      fan.add(blades);
      for (let index = 0; index < 4; index += 1) {
        const blade = box(0.18, 0.035, 1.18, tealMat, 0, -0.06, -0.57, blades);
        blade.rotation.y = index * Math.PI / 2;
        blade.rotation.x = 0.08;
        blade.position.set(
          Math.sin(index * Math.PI / 2) * 0.45,
          -0.06,
          Math.cos(index * Math.PI / 2) * 0.45
        );
        blade.castShadow = true;
      }
      fanGroups.push(blades);
    }

    addCeilingFan(-5.0, 1.7, 1.0);
    addCeilingFan(1.0, 1.9, 0.93);
    addCeilingFan(6.1, -2.0, 0.78);

    function addBooth(z) {
      const booth = new THREE.Group();
      scene.add(booth);
      box(2.35, 0.58, 3.15, redMat, 7.05, 0.9, z, booth);
      box(0.26, 2.25, 3.28, darkRedMat, 8.13, 1.8, z, booth);
      box(0.16, 1.78, 3.0, redMat, 8.0, 1.87, z, booth);
      box(2.28, 0.16, 0.13, chromeMat, 7.05, 1.23, z - 1.56, booth);
      box(2.28, 0.16, 0.13, chromeMat, 7.05, 1.23, z + 1.56, booth);
      for (const side of [-1, 1]) {
        cylinder(0.08, 0.08, 0.48, chromeMat, 6.15, 0.27, z + side * 1.22, 16, booth);
        cylinder(0.08, 0.08, 0.48, chromeMat, 7.85, 0.27, z + side * 1.22, 16, booth);
      }
      box(1.62, 0.12, 2.35, paleMat, 5.25, 1.65, z, booth);
      box(1.62, 0.05, 2.25, redMat, 5.25, 1.74, z, booth);
      for (const side of [-1, 1]) {
        cylinder(0.1, 0.1, 1.42, chromeMat, 4.72, 0.78, z + side * 0.8, 16, booth);
        cylinder(0.1, 0.1, 1.42, chromeMat, 5.78, 0.78, z + side * 0.8, 16, booth);
      }
      torus(0.73, 0.045, chromeMat, 5.25, 1.79, z - 1.15, [Math.PI / 2, 0, 0], booth);
      torus(0.73, 0.045, chromeMat, 5.25, 1.79, z + 1.15, [Math.PI / 2, 0, 0], booth);
      return booth;
    }

    addBooth(-2.25);
    addBooth(2.0);

    function addTableLamp(x, z) {
      cylinder(0.055, 0.055, 0.38, chromeMat, x, 2.05, z, 16);
      cylinder(0.27, 0.19, 0.18, pinkGlowMat, x, 2.27, z, 24);
      const lamp = new THREE.PointLight(0xff4f9f, 1.0, 2.8, 2);
      lamp.position.set(x, 2.28, z);
      scene.add(lamp);
    }

    addTableLamp(5.25, -2.25);
    addTableLamp(5.25, 2.0);

    const counterBase = box(7.7, 1.42, 1.38, darkRedMat, -4.5, 1.15, -4.3);
    box(7.85, 0.18, 1.52, chromeMat, -4.5, 1.91, -4.3);
    box(7.45, 0.1, 1.3, redMat, -4.5, 2.04, -4.3);
    box(7.55, 0.09, 0.1, goldMat, -4.5, 1.99, -5.02);
    box(7.55, 0.09, 0.1, goldMat, -4.5, 1.99, -3.58);

    for (let x = -7.3; x <= -1.7; x += 1.4) {
      cylinder(0.24, 0.24, 0.13, chromeMat, x, 0.64, -2.75, 24);
      cylinder(0.08, 0.11, 0.84, chromeMat, x, 0.25, -2.75, 18);
      torus(0.31, 0.05, darkChromeMat, x, 0.34, -2.75, [Math.PI / 2, 0, 0]);
      cylinder(0.41, 0.41, 0.12, redMat, x, 0.72, -2.75, 24);
      torus(0.4, 0.045, chromeMat, x, 0.79, -2.75, [Math.PI / 2, 0, 0]);
    }

    for (let index = 0; index < 5; index += 1) {
      const x = -7.35 + index * 1.4;
      box(0.72, 0.08, 0.08, goldMat, x, 1.42, -3.55);
      box(0.72, 0.08, 0.08, goldMat, x, 1.42, -5.05);
    }

    function addCounterShelves() {
      box(6.7, 0.1, 0.5, chromeMat, -4.5, 3.55, -5.04);
      box(6.7, 0.1, 0.5, chromeMat, -4.5, 4.62, -5.04);
      for (let index = 0; index < 7; index += 1) {
        const x = -7.55 + index * 1.02;
        box(0.08, 2.35, 0.08, darkChromeMat, x, 4.0, -5.05);
      }
      const bottleColors = [pinkGlowMat, cyanGlowMat, goldMat, tealMat, redMat];
      for (let index = 0; index < 10; index += 1) {
        const x = -7.25 + (index % 5) * 1.28;
        const y = index < 5 ? 3.98 : 5.02;
        cylinder(0.11, 0.14, 0.56, bottleColors[index % bottleColors.length], x, y, -5.04, 16);
        cylinder(0.08, 0.08, 0.12, chromeMat, x, y + 0.34, -5.04, 12);
      }
    }

    addCounterShelves();

    function addJukebox(x, z) {
      const jukebox = new THREE.Group();
      jukebox.position.set(x, 0, z);
      scene.add(jukebox);

      box(1.72, 2.4, 0.62, darkRedMat, 0, 1.32, 0, jukebox);
      box(1.5, 1.42, 0.14, tealMat, 0, 1.9, -0.36, jukebox);
      sphere(0.76, tealMat, 0, 2.53, 0, [1, 0.72, 0.68], jukebox);
      box(1.05, 0.1, 0.12, chromeMat, 0, 0.36, -0.38, jukebox);
      box(1.18, 0.08, 0.08, goldMat, 0, 1.14, -0.43, jukebox);
      box(1.18, 0.08, 0.08, goldMat, 0, 2.68, -0.43, jukebox);
      box(0.12, 1.56, 0.08, pinkGlowMat, -0.66, 1.88, -0.43, jukebox);
      box(0.12, 1.56, 0.08, pinkGlowMat, 0.66, 1.88, -0.43, jukebox);
      box(0.72, 0.08, 0.08, cyanGlowMat, 0, 2.86, -0.43, jukebox);
      for (let index = 0; index < 5; index += 1) {
        cylinder(0.07, 0.07, 0.34, index % 2 === 0 ? pinkGlowMat : cyanGlowMat, -0.38 + index * 0.19, 1.68, -0.46, 14, jukebox);
      }
      torus(0.54, 0.04, chromeMat, 0, 2.48, -0.45, [Math.PI / 2, 0, 0], jukebox);
      const pulseLight = new THREE.PointLight(palette.pink, 1.6, 3.6, 2);
      pulseLight.position.set(0, 2.0, -0.55);
      jukebox.add(pulseLight);
      return { group: jukebox, light: pulseLight };
    }

    const jukeboxParts = addJukebox(1.55, -4.65);

    function addPieCase(x, z) {
      const display = new THREE.Group();
      display.position.set(x, 0, z);
      scene.add(display);
      box(2.12, 0.14, 1.25, chromeMat, 0, 2.0, 0, display);
      box(2.0, 0.12, 1.13, redMat, 0, 2.12, 0, display);
      box(2.06, 1.42, 0.06, glassMat, 0, 2.82, -0.58, display);
      box(2.06, 1.42, 0.06, glassMat, 0, 2.82, 0.58, display);
      box(0.06, 1.42, 1.13, glassMat, -1.0, 2.82, 0, display);
      box(0.06, 1.42, 1.13, glassMat, 1.0, 2.82, 0, display);
      box(2.12, 0.08, 1.24, chromeMat, 0, 3.55, 0, display);
      for (const side of [-1, 1]) {
        box(0.08, 1.48, 0.08, goldMat, side * 0.94, 2.82, -0.55, display);
        box(0.08, 1.48, 0.08, goldMat, side * 0.94, 2.82, 0.55, display);
      }
      cylinder(0.32, 0.32, 0.09, paleMat, -0.48, 2.27, -0.1, 24, display);
      torus(0.27, 0.045, cherryMat, -0.48, 2.33, -0.1, [Math.PI / 2, 0, 0], display);
      cylinder(0.32, 0.32, 0.09, paleMat, 0.46, 2.27, 0.18, 24, display);
      torus(0.27, 0.045, goldMat, 0.46, 2.33, 0.18, [Math.PI / 2, 0, 0], display);
      box(1.4, 0.06, 0.06, cyanGlowMat, 0, 3.57, -0.62, display);
      return display;
    }

    addPieCase(-3.4, -4.25);

    function addMilkshake(x, z) {
      const shake = new THREE.Group();
      shake.position.set(x, 0, z);
      scene.add(shake);
      cylinder(0.3, 0.25, 0.72, glassMat, 0, 2.45, 0, 24, shake);
      cylinder(0.24, 0.27, 0.05, paleMat, 0, 2.84, 0, 24, shake);
      sphere(0.31, paleMat, 0, 2.9, 0, [1, 0.72, 0.72], shake);
      sphere(0.12, cherryMat, 0, 3.2, 0, [1, 0.82, 0.82], shake);
      cylinder(0.032, 0.032, 0.76, pinkGlowMat, 0.12, 3.18, 0, 12, shake).rotation.z = -0.16;
      cylinder(0.38, 0.38, 0.05, chromeMat, 0, 2.08, 0, 24, shake);
      torus(0.31, 0.035, chromeMat, 0, 2.12, 0, [Math.PI / 2, 0, 0], shake);
      return shake;
    }

    addMilkshake(-5.65, -4.08);

    function addBurgerPlate(x, z) {
      const plate = new THREE.Group();
      plate.position.set(x, 0, z);
      scene.add(plate);
      cylinder(0.78, 0.82, 0.08, chromeMat, 0, 2.13, 0, 32, plate);
      cylinder(0.67, 0.7, 0.05, paleMat, 0, 2.19, 0, 32, plate);
      cylinder(0.47, 0.52, 0.27, darkRedMat, 0, 2.48, 0, 24, plate);
      cylinder(0.5, 0.51, 0.18, goldMat, 0, 2.69, 0, 24, plate);
      sphere(0.53, creamMat, 0, 2.83, 0, [1.0, 0.48, 0.92], plate);
      cylinder(0.48, 0.48, 0.07, redMat, 0, 2.92, 0, 24, plate);
      for (let index = 0; index < 5; index += 1) {
        box(0.03, 0.01, 0.1, paleMat, -0.26 + index * 0.12, 3.03, 0.02, plate);
      }
      for (let index = 0; index < 4; index += 1) {
        cylinder(0.07, 0.07, 0.06, goldMat, -0.38 + index * 0.22, 2.23, 0.53, 16, plate);
      }
      return plate;
    }

    addBurgerPlate(-1.95, -4.15);

    function addCondiment(x, z, mat) {
      cylinder(0.16, 0.19, 0.48, mat, x, 2.34, z, 20);
      cylinder(0.1, 0.1, 0.08, chromeMat, x, 2.62, z, 16);
      sphere(0.08, mat, x, 2.7, z, [1, 0.72, 1]);
    }

    addCondiment(-0.65, -4.18, cherryMat);
    addCondiment(-0.22, -4.18, goldMat);

    function addNapkinHolder(x, z) {
      box(0.6, 0.08, 0.42, chromeMat, x, 2.18, z);
      box(0.08, 0.46, 0.08, chromeMat, x - 0.22, 2.4, z);
      box(0.08, 0.46, 0.08, chromeMat, x + 0.22, 2.4, z);
      box(0.42, 0.34, 0.025, paleMat, x, 2.42, z);
    }

    addNapkinHolder(0.42, -4.18);

    function addStool(x, z, mat) {
      cylinder(0.28, 0.28, 0.12, mat, x, 0.75, z, 24);
      torus(0.28, 0.035, chromeMat, x, 0.82, z, [Math.PI / 2, 0, 0]);
      cylinder(0.08, 0.11, 0.85, chromeMat, x, 0.28, z, 18);
      cylinder(0.43, 0.43, 0.08, darkChromeMat, x, -0.11, z, 20);
    }

    function addWallArt(x, y, text, accent) {
      box(2.1, 1.25, 0.08, woodMat, x, y, -5.96);
      const artTexture = textTexture(text, 640, 300, accent, '#291629', 'bold 54px Arial');
      const artMat = new THREE.MeshBasicMaterial({ map: artTexture });
      const artPlane = plane(1.85, 0.86, artMat, x, y, -5.9);
      artPlane.castShadow = false;
    }

    addWallArt(-7.0, 2.55, 'MALT SHOP', '#ffcb78');
    addWallArt(6.2, 2.55, 'GOOD FOOD', '#58f5df');

    function addCheckerStripe(x, y, z, horizontal = true) {
      const length = horizontal ? 2.7 : 1.5;
      const width = horizontal ? 0.08 : 0.08;
      const stripe = box(length, width, horizontal ? width : length, goldMat, x, y, z);
      stripe.castShadow = false;
      return stripe;
    }

    addCheckerStripe(-7.0, 1.82, -5.84);
    addCheckerStripe(6.2, 1.82, -5.84);

    function addDoor() {
      box(1.55, 3.5, 0.16, woodMat, -8.38, 1.7, -5.98);
      box(1.28, 2.45, 0.05, windowGlassMat, -8.38, 2.05, -5.86);
      box(0.08, 3.32, 0.08, goldMat, -9.03, 1.7, -5.78);
      box(0.08, 3.32, 0.08, goldMat, -7.73, 1.7, -5.78);
      box(1.38, 0.08, 0.08, goldMat, -8.38, 3.37, -5.78);
      cylinder(0.07, 0.07, 0.4, chromeMat, -7.98, 1.5, -5.72, 16);
    }

    addDoor();

    for (let index = 0; index < 7; index += 1) {
      const x = -8.45 + index * 2.45;
      cylinder(0.09, 0.09, 0.12, goldMat, x, 0.03, -5.93, 14);
    }

    function addClock(x, y) {
      const clockFace = cylinder(0.47, 0.47, 0.08, paleMat, x, y, -5.94, 32);
      clockFace.rotation.x = Math.PI / 2;
      torus(0.45, 0.045, goldMat, x, y, -5.88, [Math.PI / 2, 0, 0]);
      for (let index = 0; index < 12; index += 1) {
        const angle = index * Math.PI / 6;
        box(0.035, 0.12, 0.025, blackMat, x + Math.sin(angle) * 0.31, y + Math.cos(angle) * 0.31, -5.84);
      }
      box(0.035, 0.22, 0.035, blackMat, x, y + 0.1, -5.79);
      const hand = box(0.035, 0.2, 0.035, blackMat, x + 0.07, y, -5.79);
      hand.rotation.z = -0.72;
    }

    addClock(4.15, 5.62);

    function addTrashCan(x, z) {
      cylinder(0.34, 0.28, 0.7, darkChromeMat, x, 0.35, z, 24);
      cylinder(0.37, 0.37, 0.07, chromeMat, x, 0.72, z, 24);
      torus(0.31, 0.04, chromeMat, x, 0.07, z, [Math.PI / 2, 0, 0]);
    }

    addTrashCan(-8.0, 4.9);

    function addPottedPlant(x, z) {
      cylinder(0.38, 0.3, 0.45, tealMat, x, 0.2, z, 24);
      for (let index = 0; index < 7; index += 1) {
        const angle = index * Math.PI * 2 / 7;
        const stemEnd = [x + Math.sin(angle) * 0.48, 1.27 + (index % 2) * 0.25, z + Math.cos(angle) * 0.48];
        cylinderBetween([x, 0.42, z], stemEnd, 0.025, tealMat);
        sphere(0.22, greenLeafMat, stemEnd[0], stemEnd[1], stemEnd[2], [1.6, 0.35, 0.72]);
      }
    }

    const greenLeafMat = material('greenLeaf', 0x2c9b63, { roughness: 0.58 });
    addPottedPlant(8.0, 4.65);

    function addWallPanel(x, y, color) {
      box(2.8, 0.8, 0.04, color, x, y, -5.78);
      box(2.55, 0.06, 0.04, goldMat, x, y - 0.38, -5.72);
      box(2.55, 0.06, 0.04, goldMat, x, y + 0.38, -5.72);
    }

    addWallPanel(-3.6, 6.65, pinkGlowMat);
    addWallPanel(0, 6.65, cyanGlowMat);
    addWallPanel(3.6, 6.65, pinkGlowMat);

    const menuTexture = textTexture('BURGERS  ·  SHAKES  ·  PIE', 1200, 180, '#fff0b3', '#40202e', 'bold 56px Arial');
    const menuMat = new THREE.MeshBasicMaterial({ map: menuTexture });
    plane(6.0, 0.9, menuMat, -4.5, 3.0, -5.82);

    const backMenuFrame = box(7.0, 1.12, 0.06, goldMat, -4.5, 3.0, -5.76);
    backMenuFrame.castShadow = false;

    function addChromeRail(x1, y, z1, x2, z2) {
      cylinderBetween([x1, y, z1], [x2, y, z2], 0.045, chromeMat);
    }

    addChromeRail(-8.8, 0.98, -3.18, -0.2, -3.18);
    addChromeRail(4.35, 0.55, -3.65, 4.35, 3.65);

    function addDinerSign() {
      const sign = new THREE.Group();
      sign.position.set(-8.95, 5.1, 2.3);
      sign.rotation.y = Math.PI / 2;
      scene.add(sign);
      box(0.15, 2.3, 2.9, woodMat, 0, 0, 0, sign);
      box(0.06, 2.05, 2.6, pinkGlowMat, 0, 0, 0, sign);
      const texture = textTexture('DINER', 500, 900, '#f9f3c5', '#681c3d', 'bold 110px Georgia');
      const signMaterial = new THREE.MeshBasicMaterial({ map: texture });
      const panel = plane(1.92, 2.45, signMaterial, -0.09, 0, 0, [0, Math.PI / 2, 0], sign);
      panel.castShadow = false;
      const signLight = new THREE.PointLight(palette.pink, 1.8, 5, 2);
      signLight.position.set(-0.7, 0, 0);
      sign.add(signLight);
    }

    addDinerSign();

    function addRug() {
      const rugMat = material('rug', 0xb83d48, { roughness: 0.85 });
      box(4.1, 0.025, 1.25, rugMat, 0.1, -0.02, 1.0);
      box(3.7, 0.03, 0.08, paleMat, 0.1, 0.01, 1.55);
      box(3.7, 0.03, 0.08, paleMat, 0.1, 0.01, 0.45);
      box(0.08, 0.03, 1.1, paleMat, -1.75, 0.01, 1.0);
      box(0.08, 0.03, 1.1, paleMat, 1.95, 0.01, 1.0);
    }

    addRug();

    function addWallTrim() {
      box(18.2, 0.16, 0.12, goldMat, 0, 0.34, -5.86);
      box(18.2, 0.12, 0.12, darkChromeMat, 0, 0.55, -5.84);
      box(18.2, 0.08, 0.12, goldMat, 0, 6.96, -5.84);
      box(18.2, 0.08, 0.12, darkChromeMat, 0, 7.16, -5.84);
    }

    addWallTrim();

    for (let index = 0; index < 12; index += 1) {
      const x = -8.3 + random() * 16.6;
      const z = -5.35 + random() * 10.4;
      if (Math.abs(x + 4.5) < 4.3 && z < -2.7) {
        continue;
      }
      const small = 0.045 + random() * 0.035;
      sphere(small, random() > 0.5 ? pinkGlowMat : cyanGlowMat, x, 0.08, z);
    }

    const ambient = new THREE.HemisphereLight(0xffd5bf, 0x1a1631, 1.5);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xffd0a6, 2.8);
    keyLight.position.set(-5, 11, 7);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -12;
    keyLight.shadow.camera.right = 12;
    keyLight.shadow.camera.top = 13;
    keyLight.shadow.camera.bottom = -10;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    const redFill = new THREE.SpotLight(0xff315f, 4.0, 15, Math.PI / 5, 0.55, 1.6);
    redFill.position.set(7, 6, -2);
    redFill.target.position.set(3, 0, -1);
    redFill.castShadow = true;
    redFill.shadow.mapSize.set(1024, 1024);
    scene.add(redFill);
    scene.add(redFill.target);

    const tealFill = new THREE.SpotLight(0x2ee9e9, 3.4, 14, Math.PI / 4, 0.5, 1.7);
    tealFill.position.set(-7, 5, 3);
    tealFill.target.position.set(-2, 1, 0);
    tealFill.castShadow = true;
    tealFill.shadow.mapSize.set(1024, 1024);
    scene.add(tealFill);
    scene.add(tealFill.target);

    function addNeonReflection(x, z, color, rotation) {
      const reflectionMat = new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 0.12,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const reflection = plane(3.8, 0.55, reflectionMat, x, 0.018, z, [0, rotation, 0]);
      reflection.renderOrder = 2;
    }

    addNeonReflection(0, -1.2, palette.pink, 0.1);
    addNeonReflection(-4.7, -2.4, palette.cyan, -0.3);
    addNeonReflection(5.2, 0.1, palette.pink, 0.4);

    const animatedNeon = [pinkGlowMat, cyanGlowMat];
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      for (let index = 0; index < fanGroups.length; index += 1) {
        fanGroups[index].rotation.y = elapsed * (0.72 + index * 0.08);
      }

      const jukeboxPulse = 1.9 + Math.sin(elapsed * 3.2) * 0.55;
      jukeboxParts.light.intensity = jukeboxPulse;
      jukeboxParts.group.rotation.y = Math.sin(elapsed * 0.55) * 0.018;

      const neonPulse = 0.82 + Math.sin(elapsed * 5.7) * 0.12 + Math.sin(elapsed * 1.7) * 0.08;
      for (let index = 0; index < animatedNeon.length; index += 1) {
        animatedNeon[index].emissiveIntensity = 3.2 * neonPulse;
      }
      pinkLight.intensity = 4.0 + Math.sin(elapsed * 2.1) * 0.35;
      cyanLight.intensity = 3.7 + Math.sin(elapsed * 1.8 + 1.4) * 0.25;

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    animate();
  </script>
</body>
</html>
