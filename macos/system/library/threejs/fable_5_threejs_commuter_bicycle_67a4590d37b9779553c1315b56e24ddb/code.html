<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Commuter Bicycle</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#dfe4e8}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe4e8);
scene.fog = new THREE.Fog(0xdfe4e8, 8, 22);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 100);
camera.position.set(2.6, 1.3, 2.8);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

// ---------- lighting ----------
scene.add(new THREE.HemisphereLight(0xf5f8ff, 0x8a7f70, 0.7));
const sun = new THREE.DirectionalLight(0xfff2e0, 2.2);
sun.position.set(4, 6, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -3;
sun.shadow.camera.right = sun.shadow.camera.top = 3;
sun.shadow.radius = 6;
sun.shadow.bias = -0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.5);
fill.position.set(-4, 2, -3);
scene.add(fill);

// ---------- ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 64),
  new THREE.MeshStandardMaterial({color:0xd3d8dc, roughness:0.95, metalness:0})
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
const shadowDisc = new THREE.Mesh(
  new THREE.CircleGeometry(1.35, 48),
  new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.12})
);
shadowDisc.rotation.x = -Math.PI/2;
shadowDisc.position.y = 0.001;
scene.add(shadowDisc);

// ---------- materials ----------
const paint  = new THREE.MeshStandardMaterial({color:0x1f5f8b, roughness:0.35, metalness:0.55});
const alloy  = new THREE.MeshStandardMaterial({color:0xb8bec4, roughness:0.35, metalness:0.9});
const dark   = new THREE.MeshStandardMaterial({color:0x2a2c2e, roughness:0.6, metalness:0.4});
const rubber = new THREE.MeshStandardMaterial({color:0x1b1b1b, roughness:0.95, metalness:0});
const chainM = new THREE.MeshStandardMaterial({color:0x6f7377, roughness:0.45, metalness:0.85});
const rotorM = new THREE.MeshStandardMaterial({color:0xc9ced2, roughness:0.3, metalness:0.95, side:THREE.DoubleSide});
const saddleM= new THREE.MeshStandardMaterial({color:0x241f1c, roughness:0.85, metalness:0});
const spokeM = new THREE.MeshStandardMaterial({color:0x9aa0a5, roughness:0.4, metalness:0.9});

// ---------- helpers ----------
const bike = new THREE.Group();
scene.add(bike);
function tube(a, b, r, mat, r2){
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const g = new THREE.CylinderGeometry(r2 ?? r, r, len, 16);
  const m = new THREE.Mesh(g, mat);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  m.castShadow = true;
  bike.add(m);
  return m;
}
function V(x,y,z=0){ return new THREE.Vector3(x,y,z); }

// ---------- geometry key points (meters, realistic commuter) ----------
const wheelR = 0.34, tireR = 0.032;
const rearHub  = V(-0.52, wheelR);
const frontHub = V( 0.53, wheelR);
const BB       = V(-0.06, 0.285);            // bottom bracket
const seatTop  = V(-0.24, 0.78);             // seat tube top
const headTop  = V( 0.38, 0.80);             // head tube top
const headBot  = V( 0.44, 0.66);             // head tube bottom
const saddlePos= V(-0.30, 0.93);

// ---------- wheels ----------
function wheel(hub){
  const g = new THREE.Group();
  // tire
  const tire = new THREE.Mesh(new THREE.TorusGeometry(wheelR, tireR, 20, 64), rubber);
  tire.castShadow = true; g.add(tire);
  // rim
  const rim = new THREE.Mesh(new THREE.TorusGeometry(wheelR - tireR*0.9, 0.011, 12, 64), alloy);
  rim.castShadow = true; g.add(rim);
  // hub
  const hubM = new THREE.Mesh(new THREE.CylinderGeometry(0.024, 0.024, 0.09, 20), alloy);
  hubM.rotation.x = Math.PI/2; hubM.castShadow = true; g.add(hubM);
  // spokes (crossed pairs to both hub flanges)
  const rimR = wheelR - tireR*1.6;
  for(let i=0;i<28;i++){
    const a = i/28*Math.PI*2;
    const side = (i%2? 0.035 : -0.035);
    const p1 = new THREE.Vector3(Math.cos(a+0.25)*0.02, Math.sin(a+0.25)*0.02, side);
    const p2 = new THREE.Vector3(Math.cos(a)*rimR, Math.sin(a)*rimR, 0);
    const d = new THREE.Vector3().subVectors(p2,p1);
    const s = new THREE.Mesh(new THREE.CylinderGeometry(0.0016,0.0016,d.length(),4), spokeM);
    s.position.copy(p1).addScaledVector(d,0.5);
    s.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.clone().normalize());
    g.add(s);
  }
  // disc brake rotor
  const rotor = new THREE.Group();
  const disc = new THREE.Mesh(new THREE.RingGeometry(0.045, 0.08, 48), rotorM);
  disc.castShadow = true; rotor.add(disc);
  for(let i=0;i<6;i++){
    const a = i/6*Math.PI*2;
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.045, 0.002), rotorM);
    arm.position.set(Math.cos(a)*0.032, Math.sin(a)*0.032, 0);
    arm.rotation.z = a - Math.PI/2;
    rotor.add(arm);
  }
  rotor.position.z = 0.052;
  g.add(rotor);
  g.position.copy(hub);
  bike.add(g);
  return g;
}
const rearWheel = wheel(rearHub);
const frontWheel = wheel(frontHub);

// disc calipers on frame
function caliper(hub, ang){
  const c = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.055, 0.026), dark);
  c.position.set(hub.x + Math.cos(ang)*0.075, hub.y + Math.sin(ang)*0.075, 0.052);
  c.rotation.z = ang; c.castShadow = true; bike.add(c);
}
caliper(rearHub, Math.PI*0.75);
caliper(frontHub, Math.PI*0.35);

// ---------- frame (diamond) ----------
const rT = 0.017;
tube(headBot, BB, rT*1.1, paint);                        // down tube
tube(headTop.clone().add(V(-0.01,0.005)), seatTop, rT, paint); // top tube
tube(BB, seatTop.clone().add(V(0.012,0.03)), rT, paint); // seat tube (a bit past top)
tube(headBot.clone().add(V(-0.012,-0.03)), headTop.clone().add(V(0.012,0.03)), 0.024, paint); // head tube
// rear triangle: chainstays + seatstays (paired left/right)
for(const z of [0.045,-0.045]){
  tube(V(BB.x,BB.y,z*0.55), V(rearHub.x,rearHub.y,z), 0.009, paint); // chainstay
  tube(V(seatTop.x+0.005,seatTop.y-0.02,z*0.5), V(rearHub.x,rearHub.y,z), 0.008, paint); // seatstay
}
// fork: crown + blades
const crown = headBot.clone().add(V(0.006,-0.045));
tube(headBot, crown, 0.02, paint);
for(const z of [0.045,-0.045]){
  tube(V(crown.x,crown.y,z*0.6), V(frontHub.x,frontHub.y,z), 0.011, paint, 0.008);
}

// bottle-cage mounts (two bosses on down tube, two on seat tube)
function bosses(a, b, t1, t2){
  const dir = new THREE.Vector3().subVectors(b,a);
  const n = new THREE.Vector3(-dir.y, dir.x, 0).normalize();
  for(const t of [t1,t2]){
    const p = a.clone().addScaledVector(dir, t).addScaledVector(n, rT*1.1+0.004);
    const boss = new THREE.Mesh(new THREE.CylinderGeometry(0.006,0.006,0.01,10), alloy);
    boss.position.copy(p);
    boss.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), n);
    boss.castShadow = true; bike.add(boss);
  }
}
bosses(headBot, BB, 0.45, 0.58);
bosses(BB, seatTop, 0.35, 0.48);

// ---------- seatpost + saddle ----------
tube(seatTop.clone().add(V(0.006,0.015)), saddlePos.clone().add(V(0.015,-0.02)), 0.013, alloy);
const saddle = new THREE.Group();
const sTop = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), saddleM);
sTop.scale.set(0.135, 0.028, 0.055);
sTop.castShadow = true;
saddle.add(sTop);
saddle.position.copy(saddlePos);
saddle.rotation.z = -0.04;
bike.add(saddle);

// ---------- stem + flat handlebars ----------
const stemEnd = headTop.clone().add(V(0.07, 0.045));
tube(headTop.clone().add(V(0.012,0.03)), headTop.clone().add(V(0.008,0.075)), 0.016, alloy); // steerer spacer stack
tube(headTop.clone().add(V(0.008,0.075)), stemEnd, 0.014, dark); // stem
// flat bar across z with slight backsweep
const barPts = [];
for(let i=0;i<=16;i++){
  const t = i/16, z = (t-0.5)*0.6;
  barPts.push(new THREE.Vector3(stemEnd.x - Math.pow(Math.abs(t-0.5)*2,2)*0.05, stemEnd.y, z));
}
const bar = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(barPts), 32, 0.011, 12), dark);
bar.castShadow = true; bike.add(bar);
// grips
for(const s of [1,-1]){
  const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.016,0.016,0.11,14), rubber);
  grip.position.set(stemEnd.x - 0.045, stemEnd.y, s*0.245);
  grip.rotation.x = Math.PI/2;
  grip.castShadow = true; bike.add(grip);
}

// ---------- drivetrain ----------
// chainring + crank arms + pedals
const ringZ = 0.055;
const chainring = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.006, 40), chainM);
chainring.rotation.x = Math.PI/2;
chainring.position.set(BB.x, BB.y, ringZ);
chainring.castShadow = true; bike.add(chainring);
const bbShell = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.026, 0.11, 18), dark);
bbShell.rotation.x = Math.PI/2; bbShell.position.copy(BB); bbShell.castShadow = true; bike.add(bbShell);
const crank = new THREE.Group();
for(const s of [1,-1]){
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.17, 0.014), dark);
  arm.position.set(0, s*0.076, s*0.072);
  arm.castShadow = true; crank.add(arm);
  const spindle = new THREE.Mesh(new THREE.CylinderGeometry(0.009,0.009,0.05,10), alloy);
  spindle.rotation.x = Math.PI/2;
  spindle.position.set(0, s*0.155, s*0.095);
  crank.add(spindle);
  const pedal = new THREE.Mesh(new THREE.BoxGeometry(0.095, 0.02, 0.06), rubber);
  pedal.position.set(0, s*0.155, s*0.125);
  pedal.castShadow = true; crank.add(pedal);
}
crank.position.copy(BB);
crank.rotation.z = 0.5;
bike.add(crank);

// rear cassette
const cog = new THREE.Mesh(new THREE.CylinderGeometry(0.038, 0.05, 0.028, 24), chainM);
cog.rotation.x = Math.PI/2;
cog.position.set(rearHub.x, rearHub.y, -ringZ+0.005);
cog.castShadow = true; bike.add(cog);

// chain: loop around chainring & cog (top/bottom runs + arcs)
(function chain(){
  const R1 = 0.085, R2 = 0.045, cz = ringZ - 0.005;
  const pts = [];
  const A = V(BB.x, BB.y), B = V(rearHub.x, rearHub.y);
  for(let i=0;i<=10;i++){ const a = Math.PI/2 + i/10*Math.PI; pts.push(new THREE.Vector3(B.x+Math.cos(a)*R2, B.y+Math.sin(a)*R2, cz)); } // around cog
  for(let i=0;i<=10;i++){ const a = -Math.PI/2 + i/10*Math.PI; pts.push(new THREE.Vector3(A.x+Math.cos(a)*R1, A.y+Math.sin(a)*R1, cz)); } // around ring
  const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.1);
  const chain = new THREE.Mesh(new THREE.TubeGeometry(curve, 96, 0.0045, 6, true), chainM);
  chain.castShadow = true; bike.add(chain);
})();

// rear derailleur silhouette: body + cage with two jockey wheels
(function derailleur(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.05, 0.02), dark);
  body.castShadow = true; g.add(body);
  const cage = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.09, 0.004), dark);
  cage.position.set(0.008, -0.058, 0.008);
  cage.rotation.z = 0.25;
  cage.castShadow = true; g.add(cage);
  for(const dy of [-0.028, -0.088]){
    const jw = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.008, 14), chainM);
    jw.rotation.x = Math.PI/2;
    jw.position.set(0.008 + dy*-0.25, dy, 0.008);
    jw.castShadow = true; g.add(jw);
  }
  g.position.set(rearHub.x + 0.02, rearHub.y - 0.04, -ringZ);
  bike.add(g);
})();

// center bike so wheels rest on ground
bike.position.y = tireR*0 ; // hubs already at wheelR; tire bottom touches y=0... adjust:
bike.position.y = tireR;    // lift so tire outer radius (wheelR+tireR) grazes ground
bike.position.y = (wheelR + tireR) - wheelR; // = tireR

// ---------- controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.55, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 1.2;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI/2 - 0.03;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
