<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pine Coffee Table</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d9d0c3;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .caption {
      position: fixed;
      left: 24px;
      bottom: 20px;
      padding: 8px 12px;
      color: rgba(62, 44, 29, 0.72);
      background: rgba(247, 239, 226, 0.42);
      border: 1px solid rgba(93, 68, 43, 0.16);
      border-radius: 5px;
      font: 11px/1.2 system-ui, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="caption">Plain pine coffee table</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd8d0c4);
    scene.fog = new THREE.Fog(0xd8d0c4, 8, 18);

    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(5.5, 4.4, 6.2);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.05, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.7;
    controls.minDistance = 3.8;
    controls.maxDistance = 11;
    controls.maxPolarAngle = Math.PI * 0.48;

    const pineTop = new THREE.MeshStandardMaterial({
      color: 0xc89458,
      roughness: 0.72,
      metalness: 0
    });

    const pineLight = new THREE.MeshStandardMaterial({
      color: 0xd5a96d,
      roughness: 0.76,
      metalness: 0
    });

    const pineDark = new THREE.MeshStandardMaterial({
      color: 0xa9713e,
      roughness: 0.8,
      metalness: 0
    });

    const edgeMaterial = new THREE.MeshStandardMaterial({
      color: 0xb98048,
      roughness: 0.77,
      metalness: 0
    });

    function roundedPart(width, height, depth, radius, material, position) {
      const geometry = new RoundedBoxGeometry(width, height, depth, 4, radius);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(position.x, position.y, position.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function boxPart(width, height, depth, material, position) {
      const geometry = new THREE.BoxGeometry(width, height, depth);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(position.x, position.y, position.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    const topWidth = 4.5;
    const topDepth = 2.75;
    const topThickness = 0.25;
    const topY = 2.18;

    roundedPart(
      topWidth,
      topThickness,
      topDepth,
      0.075,
      pineTop,
      { x: 0, y: topY, z: 0 }
    );

    const topHighlight = new THREE.Mesh(
      new THREE.BoxGeometry(4.18, 0.012, 0.018),
      new THREE.MeshStandardMaterial({
        color: 0xe0b77b,
        roughness: 0.8
      })
    );
    topHighlight.position.set(0, topY + 0.131, -0.78);
    topHighlight.rotation.y = -0.004;
    topHighlight.castShadow = false;
    scene.add(topHighlight);

    const topSeamMaterial = new THREE.MeshStandardMaterial({
      color: 0xa87440,
      roughness: 0.9
    });

    const seamOne = new THREE.Mesh(
      new THREE.BoxGeometry(0.012, 0.008, 2.34),
      topSeamMaterial
    );
    seamOne.position.set(-0.74, topY + 0.13, 0);
    seamOne.castShadow = false;
    scene.add(seamOne);

    const seamTwo = seamOne.clone();
    seamTwo.position.x = 0.76;
    scene.add(seamTwo);

    const apronY = 1.91;
    const apronHeight = 0.34;

    roundedPart(4.02, apronHeight, 0.18, 0.025, pineDark, {
      x: 0,
      y: apronY,
      z: -1.17
    });

    roundedPart(4.02, apronHeight, 0.18, 0.025, pineLight, {
      x: 0,
      y: apronY,
      z: 1.17
    });

    roundedPart(0.18, apronHeight, 2.18, 0.025, pineDark, {
      x: -2.04,
      y: apronY,
      z: 0
    });

    roundedPart(0.18, apronHeight, 2.18, 0.025, pineLight, {
      x: 2.04,
      y: apronY,
      z: 0
    });

    const legHeight = 1.86;
    const legSize = 0.31;
    const legY = 0.95;
    const legX = 1.94;
    const legZ = 1.08;

    const legPositions = [
      { x: -legX, z: -legZ, material: pineLight },
      { x: legX, z: -legZ, material: pineTop },
      { x: -legX, z: legZ, material: pineTop },
      { x: legX, z: legZ, material: pineLight }
    ];

    for (const legPosition of legPositions) {
      roundedPart(
        legSize,
        legHeight,
        legSize,
        0.028,
        legPosition.material,
        { x: legPosition.x, y: legY, z: legPosition.z }
      );
    }

    const lowerStretchers = new THREE.Group();
    const stretcherMaterial = new THREE.MeshStandardMaterial({
      color: 0xb77e47,
      roughness: 0.82
    });

    const frontStretcher = new THREE.Mesh(
      new THREE.BoxGeometry(3.48, 0.13, 0.12),
      stretcherMaterial
    );
    frontStretcher.position.set(0, 0.32, -0.98);
    frontStretcher.castShadow = true;
    frontStretcher.receiveShadow = true;
    lowerStretchers.add(frontStretcher);

    const backStretcher = frontStretcher.clone();
    backStretcher.position.z = 0.98;
    lowerStretchers.add(backStretcher);

    const leftStretcher = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.13, 1.7),
      stretcherMaterial
    );
    leftStretcher.position.set(-1.72, 0.32, 0);
    leftStretcher.castShadow = true;
    leftStretcher.receiveShadow = true;
    lowerStretchers.add(leftStretcher);

    const rightStretcher = leftStretcher.clone();
    rightStretcher.position.x = 1.72;
    lowerStretchers.add(rightStretcher);

    scene.add(lowerStretchers);

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0xb9aa98,
      roughness: 0.92,
      metalness: 0
    });

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      floorMaterial
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0;
    floor.receiveShadow = true;
    scene.add(floor);

    const backdropMaterial = new THREE.MeshStandardMaterial({
      color: 0xd8d0c4,
      roughness: 1
    });

    const backdrop = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 16),
      backdropMaterial
    );
    backdrop.position.set(0, 5.5, -7);
    backdrop.receiveShadow = true;
    scene.add(backdrop);

    const hemiLight = new THREE.HemisphereLight(0xfff4df, 0x675342, 2.2);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffe1b7, 4.0);
    keyLight.position.set(-4.5, 7.5, 4.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -6;
    keyLight.shadow.camera.right = 6;
    keyLight.shadow.camera.top = 7;
    keyLight.shadow.camera.bottom = -4;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 18;
    keyLight.shadow.bias = -0.00025;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0xb6c9e8, 1.15);
    fillLight.position.set(5, 4, -3);
    scene.add(fillLight);

    const rimLight = new THREE.PointLight(0xffc27d, 1.1, 8, 2);
    rimLight.position.set(-1.5, 3.4, -3.5);
    scene.add(rimLight);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      rimLight.intensity = 1.05 + Math.sin(elapsed * 0.5) * 0.08;
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
