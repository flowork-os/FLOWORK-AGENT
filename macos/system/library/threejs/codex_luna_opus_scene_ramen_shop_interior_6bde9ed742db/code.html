<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080b16);
scene.fog = new THREE.Fog(0x080b16, 16, 34);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(41,window.innerWidth/window.innerHeight,.1,100);
camera.position.set(11,8.4,13.5);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .055;
controls.autoRotate = true;
controls.autoRotateSpeed = .42;
controls.target.set(0,3.25,0);
controls.minDistance = 8;
controls.maxDistance = 23;
controls.maxPolarAngle = Math.PI*.49;

let seed = 71329;
function rand(){
  seed = (seed*1664525+1013904223)>>>0;
  return seed/4294967296;
}
function pick(a,b){return a+(b-a)*rand();}
function mat(color,rough=.65,metal=0,emissive=0x000000,ei=0){
  return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,emissive,emissiveIntensity:ei});
}
function box(w,h,d,m,x=0,y=0,z=0){
  const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true; scene.add(o); return o;
}
function cyl(r1,r2,h,m,x=0,y=0,z=0,seg=16){
  const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),m);
  o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true; scene.add(o); return o;
}
function sphere(r,m,x=0,y=0,z=0){
  const o=new THREE.Mesh(new THREE.SphereGeometry(r,20,12),m);
  o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true; scene.add(o); return o;
}
function torus(R,r,m,x=0,y=0,z=0,rx=0){
  const o=new THREE.Mesh(new THREE.TorusGeometry(R,r,10,24),m);
  o.position.set(x,y,z); o.rotation.x=rx; o.castShadow=true; o.receiveShadow=true; scene.add(o); return o;
}
function group(parent=null){
  const g=new THREE.Group();
  (parent||scene).add(g); return g;
}
function addMesh(g,geo,m,p=[0,0,0],r=[0,0,0]){
  const o=new THREE.Mesh(geo,m);
  o.position.set(...p); o.rotation.set(...r);
  o.castShadow=true;o.receiveShadow=true;g.add(o);return o;
}

const woodDark=mat(0x3b2119,.78);
const wood=mat(0x70432a,.68);
const woodLight=mat(0xa36b3d,.6);
const red=mat(0x9e2e27,.68);
const redDeep=mat(0x581b24,.78);
const cream=mat(0xffd9a3,.74);
const paper=mat(0xf3d39a,.9);
const black=mat(0x17151c,.8);
const metal=mat(0x62656a,.3,.65);
const ceramic=mat(0xe5d4b0,.32);
const broth=mat(0xc8752c,.3,0,0x351304,.08);
const noodle=mat(0xf3bd5b,.42);
const green=mat(0x4f7542,.72);
const blue=mat(0x35526a,.5);
const glowOrange=mat(0xff6827,.28,0,0xff3b0b,1.8);
const glowYellow=mat(0xffc45c,.25,0,0xff7a20,1.5);

function canvasTexture(draw,w=512,h=256){
  const c=document.createElement('canvas'); c.width=w;c.height=h;
  const ctx=c.getContext('2d'); draw(ctx,w,h);
  const t=new THREE.CanvasTexture(c);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function menuTexture(){
  return canvasTexture((ctx,w,h)=>{
    ctx.fillStyle='#20151b';ctx.fillRect(0,0,w,h);
    ctx.fillStyle='#a74a31';ctx.fillRect(12,12,w-24,h-24);
    ctx.fillStyle='#ead096';ctx.fillRect(22,22,w-44,h-44);
    ctx.fillStyle='#2a1b20';ctx.textAlign='center';
    ctx.font='bold 33px serif';ctx.fillText('RAMEN  夜',w/2,61);
    ctx.font='bold 19px sans-serif';ctx.textAlign='left';
    const lines=['SHOYU  ·  8','MISO  ·  9','SPICY TANTAN  ·  10','GYOZA  ·  5','SAKE  ·  6'];
    lines.forEach((s,i)=>ctx.fillText(s,45,103+i*27));
    ctx.textAlign='right';ctx.font='italic 15px serif';
    ctx.fillText('おいしい!',w-40,207);
  });
}
function signTexture(){
  return canvasTexture((ctx,w,h)=>{
    ctx.fillStyle='#d9af72';ctx.fillRect(0,0,w,h);
    ctx.fillStyle='#7d241f';ctx.font='bold 58px serif';ctx.textAlign='center';
    ctx.fillText('らーめん',w/2,72);
    ctx.font='bold 19px sans-serif';ctx.fillText('OPEN  TILL  LATE',w/2,106);
  },512,140);
}

box(34,.25,30,ground,0,-.15,0);

function stool(x){
  const g=group();
  addMesh(g,new THREE.CylinderGeometry(.48,.54,.16,24),woodLight,[x,1.17,2.35]);
  addMesh(g,new THREE.CylinderGeometry(.27,.2,1.05,16),metal,[x,.65,2.35]);

const bowlSteam=[];
function ramenBowl(x,z,accent=red){
  const g=group();
  addMesh(g,new THREE.CylinderGeometry(.7,.54,.28,32),ceramic,[x,3.82,z]);
  addMesh(g,new THREE.CylinderGeometry(.62,.55,.08,32),broth,[x,3.98,z]);
  addMesh(g,new THREE.TorusGeometry(.61,.055,10,32),accent,[x,4.04,z]);
  for(let i=0;i<6;i++){
    const a=i*Math.PI/3;
    const n=addMesh(g,new THREE.TorusGeometry(.22,.035,7,18,.95*Math.PI),noodle,
      [x+Math.cos(a)*.27,4.07,z+Math.sin(a)*.27],[Math.PI/2,0,a]);
  }
  for(let i=0;i<3;i++){
    const n=cyl(.055,.055,.18,green,x+pick(-.25,.25),4.2,z+pick(-.2,.2),8);
    n.rotation.x=pick(-.3,.3); n.rotation.z=pick(-.3,.3);
  }
  const chop=group();
  addMesh(chop,new THREE.CylinderGeometry(.025,.025,1.45,8),woodLight,[x-.18,4.43,z-.05],[0,0,-.12]);
  addMesh(chop,new THREE.CylinderGeometry(.025,.025,1.45,8),woodLight,[x-.02,4.46,z+.05],[0,0,-.12]);
  const steam=makeSteam(x,4.25,z, .85);
  bowlSteam.push(steam);
  return g;
}
ramenBowl(-3.15,.78,red);
ramenBowl(.05,.72,blue);
ramenBowl(2.9,.82,redDeep);

function makeSteam(x,y,z,s){
  const g=group();
  for(let i=0;i<3;i++){
    const pts=[];
    const phase=pick(0,Math.PI*2);
    for(let j=0;j<7;j++){
      const t=j/6;
      pts.push(new THREE.Vector3(
        Math.sin(t*4+phase+i)*.07*s,
        t*1.25*s,
        Math.cos(t*3+phase+i)*.045*s
      ));
    }
    const curve=new THREE.CatmullRomCurve3(pts);
    const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,24,.035*s,6,false),
      new THREE.MeshBasicMaterial({color:0xf4e7d1,transparent:true,opacity:.27,depthWrite:false}));
    tube.position.set(x+pick(-.12,.12),y,z+pick(-.12,.12));
    g.add(tube);
  }
  return g;
}

const doorway=group();
addMesh(doorway,new THREE.BoxGeometry(3.4,5.8,.25),black,[0,6.35,-4.72]);
addMesh(doorway,new THREE.BoxGeometry(3.65,.3,.45),woodLight,[0,9.25,-4.78]);
for(let i=0;i<4;i++){
  const fold=addMesh(doorway,new THREE.BoxGeometry(.82,2.25,.12),paper,[-1.2+i*.8,8.2,-4.95]);
  fold.rotation.z=(i%2?-.025:.025);
}
addMesh(doorway,new THREE.BoxGeometry(3.35,.14,.14),redDeep,[0,7.15,-5.05]);
for(let i=0;i<4;i++)addMesh(doorway,new THREE.BoxGeometry(.025,2.25,.03),redDeep,[-1.6+i*.8,8.2,-5.07]);

for(let i=0;i<3;i++){
  const m=box(2.85,2.2,.09,menuMaterial,-5.1+i*3.2,7.35,-4.89);
  m.rotation.z=pick(-.025,.025);
  box(3.05,.08,.13,woodDark,-5.1+i*3.2,8.5,-4.91);
}
const sign=new THREE.Mesh(new THREE.BoxGeometry(5.3,1.45,.08),
  new THREE.MeshStandardMaterial({map:signTexture(),roughness:.8}));
sign.position.set(8.55,9.2,-4.85);sign.rotation.z=.02;sign.castShadow=true;scene.add(sign);

function lantern(x,y,z,scale=1,color=0xd94e35){
  const g=group();
  addMesh(g,new THREE.CylinderGeometry(.08,.08,1.1,8),black,[x,y+.8,z]);
  addMesh(g,new THREE.SphereGeometry(.57*scale,20,12),mat(color,.65,0,color,.24),[x,y,z]);
  addMesh(g,new THREE.CylinderGeometry(.39*scale,.43*scale,.12,20),black,[x,y+.47*scale,z]);
  addMesh(g,new THREE.CylinderGeometry(.42*scale,.39*scale,.12,20),black,[x,y-.47*scale,z]);
  addMesh(g,new THREE.TorusGeometry(.42*scale,.025,8,24),cream,[x,y,z],[0,0,0]);
  const light=new THREE.PointLight(0xff8c45,1.2,5,2);
  light.position.set(x,y-.04,z);light.castShadow=true;g.add(light);
  return g;
}
const lanterns=[
  lantern(-8.8,10.4,-3.7,.9,0xc9382f),

  lantern(4.9,10.5,-3.5,.78,0xc9382f),
  lantern(8.1,10.25,-3.8,.95,0xe18c37),
  lantern(11,9.9,-3.9,.63,0xc9382f)
];

const kitchen=group();
addMesh(kitchen,new THREE.BoxGeometry(5.2,4.7,2.2),woodDark,[8.25,3.25,-2.85]);
addMesh(kitchen,new THREE.BoxGeometry(4.8,.16,2),metal,[8.25,5.68,-2.82]);
addMesh(kitchen,new THREE.BoxGeometry(4.3,2.2,.18),black,[8.25,4.15,-3.88]);
for(let i=0;i<3;i++)addMesh(kitchen,new THREE.BoxGeometry(.08,2.1,.06),metal,[6.25+i*2,4.15,-3.78]);
const stove=addMesh(kitchen,new THREE.BoxGeometry(2.2,.22,1.3),black,[7.25,5.86,-2.7]);
for(let i=0;i<2;i++){
  addMesh(kitchen,new THREE.CylinderGeometry(.42,.42,.06,24),glowOrange,[6.7+i*1.05,6.02,-2.7]);
  const l=new THREE.PointLight(0xff612b,1.5,4,2);l.position.set(6.7+i*1.05,6.2,-2.7);kitchen.add(l);

function pot(x,z,r=.56){
  addMesh(kitchen,new THREE.CylinderGeometry(r,r*.88,.75,24),metal,[x,6.32,z]);
  addMesh(kitchen,new THREE.TorusGeometry(r*.8,.055,8,24),metal,[x,6.7,z]);

  addMesh(kitchen,new THREE.CylinderGeometry(.04,.04,1.4,8),metal,[x-.72,6.52,z],[0,0,Math.PI/2]);
  const st=makeSteam(x,6.73,z,.68);bowlSteam.push(st);
}
pot(6.55,-2.85,.54);pot(8.05,-2.78,.66);pot(9.55,-2.75,.48);

const wallFan=group();

for(let i=0;i<8;i++){

const sideTable=group();

key.shadow.camera.left=-15;key.shadow.camera.right=15;

key.shadow.bias=-.0003;scene.add(key);

fill.position.set(-8,6,5);scene.add(fill);

const rainGroup=group();
for(let i=0;i<32;i++){
  const x=pick(-13,13),z=pick(-4.5,10);
  const r=addMesh(rainGroup,new THREE.CylinderGeometry(.008,.008,pick(.25,.7),5),
    new THREE.MeshBasicMaterial({color:0x6d83ab,transparent:true,opacity:.24}),[x,pick(.4,10),z]);
  r.rotation.z=-.18;
}

const animated=[];
lanterns.forEach((l,i)=>animated.push({o:l,type:'lantern',phase:i*.9}));
bowlSteam.forEach((s,i)=>animated.push({o:s,type:'steam',phase:i*1.2}));
animated.push({o:hanging,type:'hanging',phase:0});
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  animated.forEach(a=>{
    if(a.type==='lantern'){
      a.o.rotation.z=Math.sin(t*1.15+a.phase)*.028;
      a.o.position.y=Math.sin(t*.8+a.phase)*.035;
    }
    if(a.type==='steam'){
      a.o.position.y=(Math.sin(t*.7+a.phase)*.08);
      a.o.rotation.y=Math.sin(t*.55+a.phase)*.12;
      a.o.scale.x=1+Math.sin(t*.9+a.phase)*.08;
    }
    if(a.type==='hanging'){
      a.o.rotation.z=Math.sin(t*.48)*.012;
    }
  });
  rainGroup.children.forEach((r,i)=>{
    r.position.y-=.012+(i%3)*.003;
    if(r.position.y<.2)r.position.y=10.5;
  });
  controls.update();
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
});
</script>
