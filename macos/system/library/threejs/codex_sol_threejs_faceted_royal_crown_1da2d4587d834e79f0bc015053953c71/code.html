<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jeweled Crown</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #070710;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070710);
scene.fog = new THREE.FogExp2(0x070710, 0.018);

const camera = new THREE.PerspectiveCamera(
  38,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.set(8.5, 5.5, 10.5);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance'
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.enablePan = false;
controls.minDistance = 7;
controls.maxDistance = 18;
controls.minPolarAngle = Math.PI * 0.18;
controls.maxPolarAngle = Math.PI * 0.54;
controls.target.set(0, 1.25, 0);

const crown = new THREE.Group();
crown.position.y = -1.25;
scene.add(crown);

const gold = new THREE.MeshPhysicalMaterial({
  color: 0xd99a18,
  metalness: 0.94,
  roughness: 0.19,
  clearcoat: 0.45,
  clearcoatRoughness: 0.16
});

const brightGold = new THREE.MeshPhysicalMaterial({
  color: 0xffcb45,
  metalness: 0.9,
  roughness: 0.14,
  clearcoat: 0.65,
  clearcoatRoughness: 0.1
});

const darkGold = new THREE.MeshStandardMaterial({
  color: 0x8f5707,
  metalness: 0.92,
  roughness: 0.28
});

const velvet = new THREE.MeshPhysicalMaterial({
  color: 0x350023,
  roughness: 0.68,
  metalness: 0.02,
  sheen: 1,
  sheenColor: new THREE.Color(0x8c174e),
  sheenRoughness: 0.5,
  side: THREE.DoubleSide
});

function addMesh(geometry, material, parent = crown) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function torus(radius, tube, y, material = gold, segments = 96, tubular = 10) {
  const mesh = addMesh(
    new THREE.TorusGeometry(radius, tube, tubular, segments),
    material
  );
  mesh.rotation.x = Math.PI / 2;
  mesh.position.y = y;
  return mesh;
}

function radialPosition(radius, angle, y) {
  return new THREE.Vector3(
    Math.sin(angle) * radius,
    y,
    Math.cos(angle) * radius
  );
}

function pointCylinder(a, b, radius, material, parent = crown, radialSegments = 8) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const mesh = addMesh(
    new THREE.CylinderGeometry(radius, radius, length, radialSegments, 1, false),
    material,
    parent
  );
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  return mesh;
}

function tubeAlong(points, radius, material = gold, segments = 32) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  return addMesh(
    new THREE.TubeGeometry(curve, segments, radius, 8, false),
    material
  );
}

function createBrilliantGeometry(radius = 0.5, depth = 0.34, sides = 10) {
  const positions = [];
  const tableRadius = radius * 0.42;
  const crownZ = depth * 0.46;
  const girdleZ = 0;
  const pavilionZ = -depth * 0.82;
  const backTipZ = -depth * 1.2;

  const table = [];
  const girdle = [];

  for (let i = 0; i < sides; i++) {
    const angle = (i / sides) * Math.PI * 2 + Math.PI / sides;
    table.push(new THREE.Vector3(
      Math.cos(angle) * tableRadius,
      Math.sin(angle) * tableRadius,
      crownZ
    ));
    girdle.push(new THREE.Vector3(
      Math.cos(angle) * radius,
      Math.sin(angle) * radius,
      girdleZ
    ));
  }

  const tableCenter = new THREE.Vector3(0, 0, crownZ);
  const pavilionRingRadius = radius * 0.46;
  const pavilion = [];

  for (let i = 0; i < sides; i++) {
    const angle = ((i + 0.5) / sides) * Math.PI * 2 + Math.PI / sides;
    pavilion.push(new THREE.Vector3(
      Math.cos(angle) * pavilionRingRadius,
      Math.sin(angle) * pavilionRingRadius,
      pavilionZ
    ));
  }

  const backTip = new THREE.Vector3(0, 0, backTipZ);

  function triangle(a, b, c) {
    positions.push(
      a.x, a.y, a.z,
      b.x, b.y, b.z,
      c.x, c.y, c.z
    );
  }

  for (let i = 0; i < sides; i++) {
    const n = (i + 1) % sides;
    triangle(tableCenter, table[i], table[n]);
    triangle(table[i], girdle[i], girdle[n]);
    triangle(table[i], girdle[n], table[n]);
    triangle(girdle[i], pavilion[i], pavilion[(i - 1 + sides) % sides]);
    triangle(girdle[i], girdle[n], pavilion[i]);
    triangle(pavilion[i], backTip, pavilion[n]);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions, 3)
  );
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  return geometry;
}

function gemMaterial(color, emissiveColor = color) {
  return new THREE.MeshPhysicalMaterial({
    color,
    emissive: emissiveColor,
    emissiveIntensity: 0.12,
    metalness: 0.05,
    roughness: 0.055,
    transmission: 0.18,
    thickness: 0.65,
    ior: 2.15,
    clearcoat: 1,
    clearcoatRoughness: 0.025,
    reflectivity: 1,
    transparent: true,
    opacity: 0.94,
    side: THREE.DoubleSide,
    flatShading: true
  });
}

const ruby = gemMaterial(0xd30b35, 0x5e000a);
const emerald = gemMaterial(0x08b767, 0x003c1b);
const sapphire = gemMaterial(0x1459e8, 0x00174c);
const diamond = new THREE.MeshPhysicalMaterial({
  color: 0xeef8ff,
  emissive: 0xbadfff,
  emissiveIntensity: 0.18,
  metalness: 0,
  roughness: 0.025,
  transmission: 0.52,
  thickness: 0.8,
  ior: 2.42,
  clearcoat: 1,
  clearcoatRoughness: 0,
  transparent: true,
  opacity: 0.92,
  side: THREE.DoubleSide,
  flatShading: true
});

function addGem(angle, radius, y, size, material, parent = crown) {
  const setting = new THREE.Group();
  setting.position.copy(radialPosition(radius, angle, y));
  setting.rotation.y = angle;
  parent.add(setting);

  const backing = addMesh(
    new THREE.CylinderGeometry(size * 0.7, size * 0.78, size * 0.19, 10),
    brightGold,
    setting
  );
  backing.rotation.x = Math.PI / 2;
  backing.position.z = -size * 0.1;

  const prongs = [];
  for (let i = 0; i < 4; i++) {
    const a = Math.PI * 0.25 + i * Math.PI * 0.5;
    const prong = addMesh(
      new THREE.SphereGeometry(size * 0.095, 8, 6),
      brightGold,
      setting
    );
    prong.position.set(
      Math.cos(a) * size * 0.72,
      Math.sin(a) * size * 0.72,
      size * 0.1
    );
    prongs.push(prong);
  }

  const stone = addMesh(
    createBrilliantGeometry(size * 0.72, size * 0.43, 10),
    material,
    setting
  );
  stone.position.z = size * 0.16;
  return setting;
}

const band = addMesh(
  new THREE.CylinderGeometry(3.02, 3.02, 0.92, 96, 1, true),
  gold
);
band.position.y = 0.55;

const innerBand = addMesh(
  new THREE.CylinderGeometry(2.89, 2.89, 0.76, 96, 1, true),
  velvet
);
innerBand.position.y = 0.57;

torus(3.01, 0.17, 0.08, darkGold);
torus(3.04, 0.145, 0.18, brightGold);
torus(3.04, 0.14, 0.94, brightGold);
torus(2.94, 0.065, 0.49, darkGold);

for (let i = 0; i < 24; i++) {
  const angle = (i / 24) * Math.PI * 2;
  const stud = addMesh(
    new THREE.OctahedronGeometry(i % 2 === 0 ? 0.085 : 0.06, 0),
    brightGold
  );
  stud.position.copy(radialPosition(3.09, angle, 0.24));
  stud.rotation.set(angle * 0.7, angle, angle * 0.35);
}

const jewelMaterials = [ruby, sapphire, emerald, ruby, sapphire, emerald, ruby, sapphire];
for (let i = 0; i < 8; i++) {
  const angle = (i / 8) * Math.PI * 2;
  addGem(angle, 3.08, 0.61, i === 0 ? 0.58 : 0.5, jewelMaterials[i]);
}

const peakData = [
  { angle: 0, height: 4.25, width: 0.58, material: ruby },
  { angle: Math.PI / 4, height: 3.25, width: 0.52, material: sapphire },
  { angle: Math.PI / 2, height: 3.5, width: 0.54, material: emerald },
  { angle: 3 * Math.PI / 4, height: 3.15, width: 0.5, material: ruby },
  { angle: Math.PI, height: 3.45, width: 0.53, material: sapphire },
  { angle: 5 * Math.PI / 4, height: 3.15, width: 0.5, material: emerald },
  { angle: 3 * Math.PI / 2, height: 3.5, width: 0.54, material: ruby },
  { angle: 7 * Math.PI / 4, height: 3.25, width: 0.52, material: sapphire }
];

for (let i = 0; i < peakData.length; i++) {
  const data = peakData[i];
  const spread = Math.PI / 8.2;
  const left = radialPosition(2.98, data.angle - spread, 0.94);
  const right = radialPosition(2.98, data.angle + spread, 0.94);
  const peak = radialPosition(2.52, data.angle, data.height);
  const leftMid = radialPosition(2.78, data.angle - spread * 0.48, data.height * 0.64);
  const rightMid = radialPosition(2.78, data.angle + spread * 0.48, data.height * 0.64);

  tubeAlong([left, leftMid, peak], 0.105, gold, 28);
  tubeAlong([right, rightMid, peak], 0.105, gold, 28);

  const crossY = 1.48;
  const crossLeft = radialPosition(2.89, data.angle - spread * 0.73, crossY);
  const crossRight = radialPosition(2.89, data.angle + spread * 0.73, crossY);
  pointCylinder(crossLeft, crossRight, 0.055, darkGold);

  const finial = addMesh(
    new THREE.SphereGeometry(i === 0 ? 0.17 : 0.13, 12, 8),
    brightGold
  );
  finial.position.copy(peak);

  if (i !== 0) {
    addGem(
      data.angle,
      2.7,
      data.height - 0.45,
      data.width,
      data.material
    );
  }
}

for (let i = 0; i < 8; i++) {
  const angle = i * Math.PI / 4 + Math.PI / 8;
  const base = radialPosition(2.98, angle, 0.94);
  const upper = radialPosition(2.78, angle, 2.18);
  pointCylinder(base, upper, 0.075, gold);

  const leaf = addMesh(
    new THREE.OctahedronGeometry(0.19, 0),
    brightGold
  );
  leaf.position.copy(upper);
  leaf.scale.set(0.72, 1.45, 0.55);
  leaf.rotation.y = angle;
}

const centerSetting = new THREE.Group();
centerSetting.position.copy(radialPosition(2.53, 0, 4.29));
centerSetting.rotation.y = 0;
crown.add(centerSetting);

const centerHalo = addMesh(
  new THREE.TorusGeometry(0.7, 0.075, 8, 32),
  brightGold,
  centerSetting
);
centerHalo.position.z = -0.08;

for (let i = 0; i < 12; i++) {
  const angle = (i / 12) * Math.PI * 2;
  const inner = new THREE.Vector3(
    Math.cos(angle) * 0.63,
    Math.sin(angle) * 0.63,
    -0.02
  );
  const outer = new THREE.Vector3(
    Math.cos(angle) * 0.84,
    Math.sin(angle) * 0.84,
    -0.08
  );
  pointCylinder(inner, outer, 0.035, brightGold, centerSetting, 6);

  const bead = addMesh(
    new THREE.SphereGeometry(0.07, 8, 6),
    brightGold,
    centerSetting
  );
  bead.position.copy(outer);
}

const centerStone = addMesh(
  createBrilliantGeometry(0.63, 0.48, 12),
  diamond,
  centerSetting
);
centerStone.position.z = 0.16;
centerStone.rotation.z = Math.PI / 12;

const glintMaterial = new THREE.MeshBasicMaterial({
  color: 0xeaffff,
  transparent: true,
  opacity: 0.82,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  toneMapped: false
});

const glints = new THREE.Group();
glints.position.z = 0.5;
centerSetting.add(glints);

const glintLengths = [1.22, 0.78, 0.46, 0.46, 0.32, 0.32];
const glintAngles = [
  0,
  Math.PI / 2,
  Math.PI / 4,
  -Math.PI / 4,
  Math.PI / 7,
  Math.PI - Math.PI / 7
];

for (let i = 0; i < glintLengths.length; i++) {
  const angle = glintAngles[i];
  const half = glintLengths[i] * 0.5;
  const a = new THREE.Vector3(
    -Math.cos(angle) * half,
    -Math.sin(angle) * half,
    0
  );
  const b = new THREE.Vector3(
    Math.cos(angle) * half,
    Math.sin(angle) * half,
    0
  );
  pointCylinder(
    a,
    b,
    i < 2 ? 0.018 : 0.011,
    glintMaterial,
    glints,
    5
  );
}

const starCore = addMesh(
  new THREE.OctahedronGeometry(0.12, 0),
  glintMaterial,
  glints
);
starCore.scale.set(1.25, 1.25, 0.35);

const lowerFiligree = new THREE.Group();
crown.add(lowerFiligree);

for (let i = 0; i < 16; i++) {
  const angle = (i / 16) * Math.PI * 2;
  const loop = addMesh(
    new THREE.TorusGeometry(0.18, 0.035, 6, 18),
    darkGold,
    lowerFiligree
  );
  loop.position.copy(radialPosition(3.075, angle, 0.83));
  loop.rotation.y = angle;
  loop.scale.y = 1.3;
}

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(11, 96),
  new THREE.MeshStandardMaterial({
    color: 0x090911,
    roughness: 0.82,
    metalness: 0.12
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.31;
ground.receiveShadow = true;
scene.add(ground);

const floorRing = new THREE.Mesh(
  new THREE.RingGeometry(4.3, 6.4, 96),
  new THREE.MeshBasicMaterial({
    color: 0x201126,
    transparent: true,
    opacity: 0.22,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
floorRing.rotation.x = -Math.PI / 2;
floorRing.position.y = -1.295;
scene.add(floorRing);

const hemisphere = new THREE.HemisphereLight(0x8aa9ff, 0x170512, 1.35);
scene.add(hemisphere);

const keyLight = new THREE.SpotLight(0xffe4ba, 900, 35, Math.PI / 5.2, 0.46, 1.35);
keyLight.position.set(5.5, 9.5, 7.5);
keyLight.target.position.set(0, 1.1, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.bias = -0.00025;
keyLight.shadow.normalBias = 0.025;
scene.add(keyLight, keyLight.target);

const coolLight = new THREE.PointLight(0x377cff, 180, 18, 1.8);
coolLight.position.set(-5.5, 4.5, 3.5);
scene.add(coolLight);

const rubyLight = new THREE.PointLight(0xff174f, 95, 13, 2);
rubyLight.position.set(4.2, 1.8, -3.8);
scene.add(rubyLight);

const rimLight = new THREE.DirectionalLight(0xe9d5ff, 2.8);
rimLight.position.set(-4, 7, -7);
scene.add(rimLight);

const sparkleLights = [
  { color: 0xff174f, position: new THREE.Vector3(0, 0.8, 3.7), power: 30 },
  { color: 0x1bff9b, position: new THREE.Vector3(3.8, 1.3, 0), power: 25 },
  { color: 0x3188ff, position: new THREE.Vector3(-3.7, 1.5, 0.5), power: 28 },
  { color: 0xffffff, position: new THREE.Vector3(0, 4.6, 3), power: 38 }
];

for (const data of sparkleLights) {
  const light = new THREE.PointLight(data.color, data.power, 5, 2);
  light.position.copy(data.position);
  crown.add(light);
}

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  glints.rotation.z = Math.sin(elapsed * 0.75) * 0.13;
  glintMaterial.opacity = 0.64 + Math.pow(Math.max(0, Math.sin(elapsed * 2.15)), 5) * 0.32;
  centerStone.rotation.z = Math.PI / 12 + Math.sin(elapsed * 0.45) * 0.035;

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
