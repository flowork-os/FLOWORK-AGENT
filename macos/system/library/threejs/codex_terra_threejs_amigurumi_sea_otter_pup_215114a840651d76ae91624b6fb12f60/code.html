<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crocheted Sea Otter</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dce9e7}
  canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdce9e7);
scene.fog = new THREE.Fog(0xdce9e7, 12, 24);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.2, 11.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
controls.minDistance = 7;
controls.maxDistance = 18;
controls.target.set(0, 0.05, 0);

const hemi = new THREE.HemisphereLight(0xfffcf2, 0x78969d, 2.2);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xfff2d6, 4.5);
key.position.set(-5, 8, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -8;
scene.add(key);
const fill = new THREE.PointLight(0xc6e7ff, 20, 18, 2);
fill.position.set(5, 2, 5);
scene.add(fill);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(30, 96),
  new THREE.MeshStandardMaterial({ color: 0xb7d2d1, roughness: 0.95, metalness: 0 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -4.25;
floor.receiveShadow = true;
scene.add(floor);

const root = new THREE.Group();
root.rotation.z = -0.075;
root.rotation.x = -0.08;
root.position.y = 0.05;
scene.add(root);

const brown = new THREE.MeshStandardMaterial({ color: 0x704431, roughness: 0.82, metalness: 0 });
const brownDark = new THREE.MeshStandardMaterial({ color: 0x513025, roughness: 0.87 });
const yarn = new THREE.MeshStandardMaterial({ color: 0x8b5940, roughness: 0.92 });
const cream = new THREE.MeshStandardMaterial({ color: 0xf0d6ad, roughness: 0.9 });
const peach = new THREE.MeshStandardMaterial({ color: 0xf2ab91, roughness: 0.88 });
const black = new THREE.MeshStandardMaterial({ color: 0x191416, roughness: 0.26, metalness: 0.05 });
const noseMat = new THREE.MeshStandardMaterial({ color: 0x3c2524, roughness: 0.55 });

function blob(material, scale, position, rotation = [0,0,0], segments = 32) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, segments, 20), material);
  mesh.scale.set(...scale);
  mesh.position.set(...position);
  mesh.rotation.set(...rotation);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  root.add(mesh);
  return mesh;
}

const torusGeo = new THREE.TorusGeometry(0.105, 0.038, 6, 12);
function crochetedEllipsoid(center, radii, rows, cols, stitchMaterial, baseMaterial, phase = 0) {
  const base = blob(baseMaterial, radii, center, [0, 0, 0], 36);
  const count = rows * cols;
  const stitches = new THREE.InstancedMesh(torusGeo, stitchMaterial, count);
  stitches.castShadow = true;
  stitches.receiveShadow = true;
  const matrix = new THREE.Matrix4();
  const quat = new THREE.Quaternion();
  const scl = new THREE.Vector3();
  const up = new THREE.Vector3(0, 0, 1);
  const pos = new THREE.Vector3();
  const normal = new THREE.Vector3();
  let n = 0;
  for (let r = 0; r < rows; r++) {
    const v = 0.18 + (r + 0.45) / rows * (Math.PI - 0.36);
    const sv = Math.sin(v), cv = Math.cos(v);
    for (let c = 0; c < cols; c++) {
      const u = (c / cols) * Math.PI * 2 + (r % 2 ? 0.19 : 0) + phase;
      const wobble = 1 + 0.022 * Math.sin(c * 5.7 + r * 3.1);
      pos.set(
        center[0] + radii[0] * sv * Math.cos(u) * wobble,
        center[1] + radii[1] * cv,
        center[2] + radii[2] * sv * Math.sin(u) * wobble
      );
      normal.set(
        (pos.x - center[0]) / (radii[0] * radii[0]),
        (pos.y - center[1]) / (radii[1] * radii[1]),
        (pos.z - center[2]) / (radii[2] * radii[2])
      ).normalize();
      pos.addScaledVector(normal, 0.055);
      quat.setFromUnitVectors(up, normal);
      const t = 0.83 + 0.13 * Math.sin(r * 8.3 + c * 4.2);
      scl.set(t, t * (0.86 + 0.12 * Math.cos(c * 2.1)), t);
      matrix.compose(pos, quat, scl);
      stitches.setMatrixAt(n++, matrix);
    }
  }
  stitches.instanceMatrix.needsUpdate = true;
  root.add(stitches);
  return base;
}

crochetedEllipsoid([0, -0.55, 0], [1.74, 2.52, 1.16], 15, 20, yarn, brown, 0.08);
const head = crochetedEllipsoid([-0.12, 2.15, 0.03], [1.58, 1.36, 1.12], 12, 18, yarn, brown, -0.12);
head.rotation.z = -0.10;

crochetedEllipsoid([-1.13, 3.0, -0.18], [0.53, 0.54, 0.42], 6, 9, yarn, brownDark, 0.2);
crochetedEllipsoid([1.05, 2.95, -0.17], [0.48, 0.49, 0.4], 6, 9, yarn, brownDark, -0.1);

const belly = blob(cream, [1.22, 1.7, 0.27], [0, -0.75, 1.04], [0, 0, 0], 32);
const bellyLoops = new THREE.InstancedMesh(torusGeo, cream, 72);
bellyLoops.castShadow = true;
const bm = new THREE.Matrix4(), bq = new THREE.Quaternion(), bs = new THREE.Vector3();
let bi = 0;
for (let r = 0; r < 8; r++) for (let c = 0; c < 9; c++) {
  const yy = -2.05 + r * 0.365;
  const half = 1.08 * Math.sqrt(Math.max(0.1, 1 - Math.pow((yy + 0.72) / 1.68, 2)));
  const xx = -half + (c + 0.5) / 9 * half * 2;
  const zz = 1.29 + 0.07 * Math.cos(xx * 3);
  bq.setFromEuler(new THREE.Euler(0, 0, (r % 2 ? 0.24 : 0) + c * 0.035));
  bs.setScalar(0.76 + 0.08 * Math.sin(c * 4 + r));
  bm.compose(new THREE.Vector3(xx, yy, zz), bq, bs);
  bellyLoops.setMatrixAt(bi++, bm);
}
bellyLoops.instanceMatrix.needsUpdate = true;
root.add(bellyLoops);

function capsule(material, radius, length, pos, rot) {
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(radius, length, 10, 18), material);
  m.position.set(...pos);
  m.rotation.set(...rot);
  m.castShadow = true;
  root.add(m);
  return m;
}

const tail = capsule(brownDark, 0.48, 2.0, [0.38, -3.17, -0.52], [0.1, -0.3, 0.18]);
tail.scale.set(0.84, 1, 0.82);
const tailLoops = new THREE.InstancedMesh(torusGeo, yarn, 30);
tailLoops.castShadow = true;
for (let i = 0; i < 30; i++) {
  const t = i / 30;
  const a = t * Math.PI * 10;
  const p = new THREE.Vector3(0.38 + 0.31 * Math.cos(a), -2.32 - t * 2.05, -0.12 + 0.44 * Math.sin(a));
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.1, -0.3, a));
  bm.compose(p, q, new THREE.Vector3(0.72, 0.72, 0.72));
  tailLoops.setMatrixAt(i, bm);
}
tailLoops.instanceMatrix.needsUpdate = true;
root.add(tailLoops);

const armL = capsule(brown, 0.42, 1.2, [-1.17, -0.36, 1.15], [0.25, 0.08, -0.74]);
const armR = capsule(brown, 0.42, 1.16, [1.05, -0.24, 1.17], [0.25, -0.07, 0.69]);
armL.rotation.y = 0.12;
armR.rotation.y = -0.12;

const pawL = blob(brown, [0.58, 0.64, 0.31], [-0.44, 0.07, 1.57], [0.08, -0.18, -0.35], 24);
const pawR = blob(brown, [0.58, 0.64, 0.31], [0.42, 0.08, 1.58], [0.08, 0.18, 0.33], 24);
blob(peach, [0.33, 0.38, 0.06], [-0.38, 0.11, 1.86], [0.08, -0.18, -0.35], 20);
blob(peach, [0.33, 0.38, 0.06], [0.37, 0.12, 1.87], [0.08, 0.18, 0.33], 20);
for (const [x,y,ang] of [[-0.39,0.26,-0.3],[0.38,0.27,0.3]]) {
  for (let j = -1; j <= 1; j++) blob(peach, [0.065,0.09,0.035], [x + j * 0.13, y, 1.925], [0,0,ang], 12);
}

const muzzleL = blob(cream, [0.69, 0.51, 0.23], [-0.45, 1.86, 1.08], [0, 0.04, -0.1], 28);
const muzzleR = blob(cream, [0.69, 0.51, 0.23], [0.43, 1.85, 1.09], [0, -0.04, 0.1], 28);
muzzleL.position.z += 0.05;
muzzleR.position.z += 0.05;

function eye(x, y) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.155, 20, 16), black);
  eye.position.set(x, y, 1.13);
  eye.scale.z = 0.52;
  eye.castShadow = true;
  root.add(eye);
  const glint = new THREE.Mesh(new THREE.SphereGeometry(0.037, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  glint.position.set(x - 0.038, y + 0.045, 1.21);
  root.add(glint);
}
eye(-0.58, 2.34);
eye(0.49, 2.31);

const nose = new THREE.Mesh(new THREE.SphereGeometry(0.18, 20, 12), noseMat);
nose.position.set(-0.035, 1.92, 1.39);
nose.scale.set(1.25, 0.72, 0.52);
nose.castShadow = true;
root.add(nose);

const mouthCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.035,1.83,1.41),
  new THREE.Vector3(-0.16,1.70,1.42),
  new THREE.Vector3(-0.32,1.73,1.40)
]);
const mouthCurve2 = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.035,1.83,1.41),
  new THREE.Vector3(0.11,1.69,1.42),
  new THREE.Vector3(0.28,1.73,1.40)
]);
for (const curve of [mouthCurve, mouthCurve2]) {
  const mouth = new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.024, 7, false), noseMat);
  root.add(mouth);
}

const whiskerMat = new THREE.MeshStandardMaterial({ color: 0x6a5147, roughness: 0.7 });
for (const side of [-1, 1]) {
  for (let i = 0; i < 3; i++) {
    const y = 1.82 + i * 0.12;
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(side * 0.52, y, 1.28),
      new THREE.Vector3(side * 1.02, y + (i - 1) * 0.08, 1.22),
      new THREE.Vector3(side * 1.37, y + (i - 1) * 0.14, 1.02)
    ]);
    root.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 10, 0.012, 5, false), whiskerMat));
  }
}

const halo = new THREE.Mesh(
  new THREE.TorusGeometry(3.8, 0.018, 6, 96),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 })
);
halo.rotation.x = Math.PI / 2;
halo.position.y = -4.21;
scene.add(halo);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
