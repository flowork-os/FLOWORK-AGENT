<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chrome Balloon Dog</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101018; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12101b);
scene.fog = new THREE.Fog(0x12101b, 12, 28);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(9.2, 5.5, 11.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.28;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.35, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 7;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.48;

const world = new THREE.Group();
scene.add(world);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(16, 96),
  new THREE.MeshStandardMaterial({
    color: 0x292333,
    metalness: 0.48,
    roughness: 0.24
  })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
world.add(floor);

const pedestal = new THREE.Mesh(
  new THREE.CylinderGeometry(4.15, 4.55, 0.42, 96),
  new THREE.MeshPhysicalMaterial({
    color: 0x16131d,
    metalness: 0.82,
    roughness: 0.14,
    clearcoat: 0.7,
    clearcoatRoughness: 0.08
  })
);
pedestal.position.y = 0.12;
pedestal.castShadow = true;
pedestal.receiveShadow = true;
world.add(pedestal);

const sculpture = new THREE.Group();
sculpture.position.y = 0.34;
world.add(sculpture);

const chrome = new THREE.MeshPhysicalMaterial({
  color: 0xff0a86,
  metalness: 1,
  roughness: 0.035,
  clearcoat: 1,
  clearcoatRoughness: 0.015,
  reflectivity: 1,
  envMapIntensity: 2.1
});

const darkChrome = new THREE.MeshPhysicalMaterial({
  color: 0xc80059,
  metalness: 1,
  roughness: 0.045,
  clearcoat: 1,
  clearcoatRoughness: 0.02,
  envMapIntensity: 2
});

function addSphere(position, scale, material = chrome, segments = 48) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, segments, 28), material);
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  sculpture.add(mesh);
  return mesh;
}

function addTube(a, b, radius, material = chrome, radialSegments = 40) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const mesh = new THREE.Mesh(
    new THREE.CapsuleGeometry(radius, Math.max(0.01, length - radius * 2), 10, radialSegments),
    material
  );
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  sculpture.add(mesh);
  return mesh;
}

function addJoint(position, radius, material = chrome) {
  return addSphere(position, new THREE.Vector3(radius, radius, radius), material, 44);
}

function addBezierTube(points, radius, material = chrome) {
  const vectors = points.map(point => new THREE.Vector3(...point));
  const curve = new THREE.CatmullRomCurve3(vectors, false, "centripetal", 0.45);
  const geometry = new THREE.TubeGeometry(curve, 84, radius, 32, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  sculpture.add(mesh);
  return mesh;
}

addSphere(new THREE.Vector3(0.2, 3.02, 0), new THREE.Vector3(2.48, 1.15, 1.08));
addJoint(new THREE.Vector3(-1.92, 3.0, 0), 0.75);
addJoint(new THREE.Vector3(2.18, 3.0, 0), 0.76);

addTube([-1.62, 2.48, -0.5], [-1.7, 0.84, -0.54], 0.48);
addTube([-0.65, 2.42, -0.56], [-0.55, 0.83, -0.6], 0.48);
addTube([1.1, 2.42, 0.53], [1.16, 0.84, 0.56], 0.48);
addTube([2.08, 2.45, 0.48], [2.15, 0.84, 0.52], 0.48);

addJoint(new THREE.Vector3(-1.68, 1.02, -0.54), 0.56);
addJoint(new THREE.Vector3(-0.56, 1.02, -0.6), 0.56);
addJoint(new THREE.Vector3(1.16, 1.02, 0.56), 0.56);
addJoint(new THREE.Vector3(2.15, 1.02, 0.52), 0.56);

addBezierTube([
  [-2.1, 3.38, 0.04],
  [-2.78, 3.64, 0.03],
  [-3.12, 4.2, 0.05],
  [-2.84, 4.54, 0.07],
  [-2.4, 4.2, 0.06],
  [-2.35, 3.66, 0.05]
], 0.5);

addBezierTube([
  [-1.75, 3.68, 0.08],
  [-1.9, 4.27, 0.1],
  [-1.55, 4.73, 0.1],
  [-1.1, 4.46, 0.08],
  [-1.26, 3.88, 0.06],
  [-1.5, 3.57, 0.05]
], 0.48);

addSphere(new THREE.Vector3(-2.85, 3.48, 0.02), new THREE.Vector3(1.08, 0.89, 0.82));
addJoint(new THREE.Vector3(-2.22, 3.35, 0.02), 0.5);

addBezierTube([
  [-3.56, 3.46, 0.02],
  [-3.92, 3.31, 0.02],
  [-4.08, 3.12, 0.02],
  [-3.93, 2.96, 0.02],
  [-3.66, 3.08, 0.02],
  [-3.54, 3.28, 0.02]
], 0.28, darkChrome);

addSphere(new THREE.Vector3(-3.78, 3.18, 0.02), new THREE.Vector3(0.37, 0.3, 0.3), darkChrome, 36);

const tailBase = addJoint(new THREE.Vector3(2.52, 3.12, 0), 0.56);
tailBase.scale.set(1.12, 0.95, 0.95);

addBezierTube([
  [2.7, 3.2, 0],
  [3.36, 3.5, 0.02],
  [3.64, 4.05, 0.03],
  [3.34, 4.34, 0.04],
  [3.08, 4.18, 0.04],
  [3.26, 3.91, 0.03]
], 0.31);

const hemi = new THREE.HemisphereLight(0xf4dcff, 0x22101e, 2.1);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 5.2);
key.position.set(5, 9, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -8;
scene.add(key);

const fill = new THREE.PointLight(0xff2eac, 80, 16, 2);
fill.position.set(-5, 4, 3);
scene.add(fill);

const rim = new THREE.PointLight(0x8d7cff, 95, 18, 2);
rim.position.set(4, 6, -6);
scene.add(rim);

const hotLight = new THREE.SpotLight(0xffffff, 850, 20, Math.PI / 6, 0.45, 1.5);
hotLight.position.set(-2, 8, 4);
hotLight.target.position.set(0, 2.6, 0);
hotLight.castShadow = true;
hotLight.shadow.mapSize.set(1024, 1024);
scene.add(hotLight, hotLight.target);

const environment = new THREE.Group();
scene.add(environment);

function addLightPanel(position, rotation, color, intensity) {
  const panel = new THREE.Mesh(
    new THREE.PlaneGeometry(5, 2.2),
    new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, toneMapped: false })
  );
  panel.position.set(...position);
  panel.rotation.set(...rotation);
  environment.add(panel);
  const light = new THREE.RectAreaLight(color, intensity, 5, 2.2);
  light.position.set(...position);
  light.rotation.set(...rotation);
  scene.add(light);
}

addLightPanel([0, 8.5, -5], [0.18, 0, 0], 0xc9d8ff, 6);
addLightPanel([-7, 4.5, 1], [0, Math.PI / 2, 0], 0xff75c6, 4);
addLightPanel([6.5, 4.2, -2], [0, -Math.PI / 2, 0], 0x9da8ff, 4);

const panelMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, toneMapped: false });
const ceilingStrip = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 0.75), panelMaterial);
ceilingStrip.position.set(0, 7.8, 2.2);
ceilingStrip.rotation.x = Math.PI / 2;
environment.add(ceilingStrip);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

animate();
</script>
</body>
</html>
