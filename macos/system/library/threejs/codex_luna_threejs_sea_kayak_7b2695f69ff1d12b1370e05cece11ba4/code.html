<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sea Kayak on Roof Racks</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#b9d1d7}
canvas{display:block}
#label{position:fixed;left:22px;top:18px;color:#eaf7f8;font:600 13px/1.4 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 2px 5px #234a55}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">Sea kayak · roof rack</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9c5cc);
scene.fog = new THREE.Fog(0xa9c5cc, 16, 31);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.1,100);
camera.position.set(10,-10,7.4);

const controls = new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,1.25);
controls.enableDamping = true;
controls.dampingFactor = .06;
controls.autoRotate = true;
controls.autoRotateSpeed = .55;
controls.minDistance = 7;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI*.47;

scene.add(new THREE.HemisphereLight(0xe8f7fa,0x45636b,2.3));
const sun = new THREE.DirectionalLight(0xfff1d7,4.2);
sun.position.set(-7,-8,13);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-12; sun.shadow.camera.right=12;
sun.shadow.camera.top=10; sun.shadow.camera.bottom=-8;
sun.shadow.bias=-.0005;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x9fd6e2,1.2);
fill.position.set(8,5,5);
scene.add(fill);

const hullMat = new THREE.MeshPhysicalMaterial({
  color:0x0b6074, metalness:.08, roughness:.22, clearcoat:.72, clearcoatRoughness:.14
});
const hullAccent = new THREE.MeshStandardMaterial({color:0x082f3d,roughness:.3,metalness:.1});
const rubber = new THREE.MeshStandardMaterial({color:0x171d1e,roughness:.8});
const rackMat = new THREE.MeshStandardMaterial({color:0x4b5658,metalness:.8,roughness:.25});
const silver = new THREE.MeshStandardMaterial({color:0xaeb9b8,metalness:.9,roughness:.2});
const roofMat = new THREE.MeshStandardMaterial({color:0x202b2d,metalness:.3,roughness:.42});

function mesh(geometry, material, cast=true, receive=true){
  const m=new THREE.Mesh(geometry,material);
  m.castShadow=cast; m.receiveShadow=receive; scene.add(m); return m;
}
function box(x,y,z,px,py,pz,material){
  const m=mesh(new THREE.BoxGeometry(x,y,z),material);
  m.position.set(px,py,pz); return m;
}
function cyl(radius,depth,position,material,rotation=new THREE.Euler()){
  const m=mesh(new THREE.CylinderGeometry(radius,radius,depth,24),material);
  m.position.copy(position); m.rotation.copy(rotation); return m;
}
function tube(points,radius,material,closed=false){
  const curve=new THREE.CatmullRomCurve3(points);
  return mesh(new THREE.TubeGeometry(curve,Math.max(12,points.length*8),radius,12,closed),material);
}

const ground=mesh(new THREE.PlaneGeometry(45,45),new THREE.MeshStandardMaterial({color:0x65767a,roughness:1}));
ground.rotation.x=-Math.PI/2;
ground.position.y=0;
ground.receiveShadow=true;

box(11.6,4.2,.42,0,0,.48,roofMat);
box(10.8,3.45,.06,0,0,.71,new THREE.MeshStandardMaterial({color:0x354244,roughness:.7}));
for(const y of [-1.28,1.28]){
  const rail=box(10.4,.12,.13,0,y,.88,rackMat);
  rail.castShadow=true;
}
for(const x of [-2.65,2.65]){
  box(.18,2.9,.13,x,0,1.02,rackMat);
  for(const y of [-1.05,1.05]){
    box(.38,.16,.32,x,y,.98,rackMat);
  }
  cyl(.15,2.55,new THREE.Vector3(x,0,1.2),silver,new THREE.Euler(Math.PI/2,0,0));
}

const L=10, stations=44, sides=28;
const positions=[], indices=[];
for(let i=0;i<=stations;i++){
  const u=i/stations, x=(u-.5)*L;
  const taper=Math.pow(Math.sin(Math.PI*u),.58);
  const width=.04+.91*taper;
  const center=1.43+.30*Math.pow(Math.abs(2*u-1),1.7);
  const radius=.43*Math.pow(taper,.25);
  for(let j=0;j<sides;j++){
    const a=j/sides*Math.PI*2;
    const y=width*Math.cos(a);
    const z=center+radius*Math.sin(a);
    positions.push(x,y,z);
  }
}
for(let i=0;i<stations;i++) for(let j=0;j<sides;j++){
  const a=i*sides+j,b=i*sides+(j+1)%sides,c=(i+1)*sides+(j+1)%sides,d=(i+1)*sides+j;
  indices.push(a,b,d,b,c,d);
}
const hullGeo=new THREE.BufferGeometry();
hullGeo.setAttribute("position",new THREE.Float32BufferAttribute(positions,3));
hullGeo.setIndex(indices);
hullGeo.computeVertexNormals();
mesh(hullGeo,hullMat);

function topZ(x,y=0){
  const u=x/L+.5;
  const taper=Math.pow(Math.sin(Math.PI*u),.58);
  return 1.43+.30*Math.pow(Math.abs(2*u-1),1.7)+.43*Math.pow(taper,.25)*Math.sqrt(Math.max(0,1-(y/(.04+.91*taper))**2));
}

const cockpitOpening=mesh(new THREE.CylinderGeometry(1,1,.075,64),hullAccent);
cockpitOpening.scale.set(1.42,.56,1);
cockpitOpening.position.set(-.65,0,2.005);
cockpitOpening.rotation.x=0;
const cockpitRim=mesh(new THREE.TorusGeometry(1,.105,14,64),new THREE.MeshPhysicalMaterial({color:0x073341,roughness:.27,clearcoat:.5}));
cockpitRim.scale.set(1.45,.58,1);
cockpitRim.position.set(-.65,0,2.065);

const seat=mesh(new THREE.CylinderGeometry(.42,.42,.07,32),new THREE.MeshStandardMaterial({color:0x20282a,roughness:.72}));
seat.scale.set(1.15,.7,1);
seat.position.set(-.63,0,2.11);

const hatch=mesh(new THREE.CylinderGeometry(.37,.37,.035,40),new THREE.MeshPhysicalMaterial({color:0x0b4657,roughness:.25,clearcoat:.6}));
hatch.position.set(2.72,0,topZ(2.72)+.035);
const hatchRing=mesh(new THREE.TorusGeometry(.39,.035,10,40),silver);
hatchRing.position.set(2.72,0,topZ(2.72)+.06);

const cordMat=new THREE.MeshStandardMaterial({color:0x10191a,roughness:.5});
for(const y of [-.32,.32]){
  tube([new THREE.Vector3(.25,y,topZ(.25,y)+.045),new THREE.Vector3(1.18,y,topZ(1.18,y)+.045),new THREE.Vector3(2.15,y,topZ(2.15,y)+.045)],.026,cordMat);
}
for(const x of [.5,1.05,1.6,2.05]){
  const z=topZ(x,.32)+.05;
  tube([new THREE.Vector3(x,-.34,z),new THREE.Vector3(x,0,z+.06),new THREE.Vector3(x,.34,z)],.024,cordMat);
}
for(const x of [-3.8,3.75]){
  tube([new THREE.Vector3(x,-.18,topZ(x,-.18)+.05),new THREE.Vector3(x-.18,0,topZ(x,0)+.07),new THREE.Vector3(x,.18,topZ(x,.18)+.05)],.025,cordMat);
}

for(const x of [-2.65,2.65]){
  const cradle=tube([
    new THREE.Vector3(x,-.88,1.02),
    new THREE.Vector3(x,-.96,1.23),
    new THREE.Vector3(x,-.70,1.55),
    new THREE.Vector3(x,-.43,1.67)
  ],.115,rubber);
  cradle.castShadow=true;
  const cradle2=tube([
    new THREE.Vector3(x,.88,1.02),
    new THREE.Vector3(x,.96,1.23),
    new THREE.Vector3(x,.70,1.55),
    new THREE.Vector3(x,.43,1.67)
  ],.115,rubber);
  cradle2.castShadow=true;
  box(.5,1.05,.12,x,-.52,1.1,rubber);
  box(.5,1.05,.12,x,.52,1.1,rubber);
}

const bowTip=tube([
  new THREE.Vector3(-4.72,0,1.77),
  new THREE.Vector3(-4.88,0,1.88),
  new THREE.Vector3(-4.98,0,1.98)
],.035,silver);
const sternTip=tube([
  new THREE.Vector3(4.72,0,1.77),
  new THREE.Vector3(4.88,0,1.88),
  new THREE.Vector3(4.98,0,1.98)
],.035,silver);

const waterShadow=mesh(new THREE.CircleGeometry(5.8,64),new THREE.MeshBasicMaterial({color:0x20383b,transparent:true,opacity:.13,depthWrite:false}));
waterShadow.scale.set(1,.48,1);
waterShadow.rotation.x=-Math.PI/2;
waterShadow.position.set(0,0.012,.02);

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
