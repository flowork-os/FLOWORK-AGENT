<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wizard Tower Summit</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #03040d;
    }
    canvas { display: block; }
    #title {
      position: fixed;
      left: 24px;
      bottom: 20px;
      color: rgba(210, 224, 255, .72);
      font: 12px/1.5 Georgia, serif;
      letter-spacing: .22em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 2px 8px #000;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="title">Wizard Tower Summit · Stormwatch</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030510);
    scene.fog = new THREE.FogExp2(0x080b18, 0.018);

    const camera = new THREE.PerspectiveCamera(
      48,
      innerWidth / innerHeight,
      0.1,
      260
    );
    camera.position.set(22, 18, 29);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 5.4, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.24;
    controls.minDistance = 20;
    controls.maxDistance = 58;
    controls.maxPolarAngle = Math.PI * 0.49;

    let seed = 0x91a7c3ef;
    function random() {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let t = seed;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    const range = (a, b) => a + (b - a) * random();

    function canvasTexture(size, painter, repeat = false) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      painter(ctx, size);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      if (repeat) {
        texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      }
      return texture;
    }

    const stoneTexture = canvasTexture(512, (ctx, s) => {
      ctx.fillStyle = '#505565';
      ctx.fillRect(0, 0, s, s);
      for (let i = 0; i < 9000; i++) {
        const v = Math.floor(range(45, 105));
        ctx.fillStyle = `rgba(${v},${v + 2},${v + 10},${range(.025, .11)})`;
        const r = range(.3, 2.4);
        ctx.fillRect(random() * s, random() * s, r, r);
      }
      ctx.strokeStyle = 'rgba(15,18,26,.42)';
      ctx.lineWidth = 4;
      for (let y = 0; y <= s; y += 64) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(s, y);
        ctx.stroke();
      }
      for (let y = 0; y < s; y += 64) {
        const shift = (Math.floor(y / 64) % 2) * 64;
        for (let x = shift; x < s; x += 128) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x, y + 64);
          ctx.stroke();
        }
      }
    }, true);
    stoneTexture.repeat.set(4, 4);

    const woodTexture = canvasTexture(256, (ctx, s) => {
      ctx.fillStyle = '#4a2918';
      ctx.fillRect(0, 0, s, s);
      for (let i = 0; i < 75; i++) {
        ctx.strokeStyle = `rgba(25,8,2,${range(.05, .25)})`;
        ctx.lineWidth = range(.5, 3);
        ctx.beginPath();
        const y = random() * s;
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(s * .3, y + range(-8, 8), s * .7, y + range(-8, 8), s, y);
        ctx.stroke();
      }
    }, true);
    woodTexture.repeat.set(3, 3);

    const bannerTexture = canvasTexture(256, (ctx, s) => {
      const g = ctx.createLinearGradient(0, 0, s, s);
      g.addColorStop(0, '#32105b');
      g.addColorStop(.5, '#651c7d');
      g.addColorStop(1, '#17052c');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, s, s);
      ctx.strokeStyle = '#d2aa48';
      ctx.lineWidth = 9;
      ctx.strokeRect(10, 10, s - 20, s - 20);
      ctx.translate(s / 2, s / 2);
      ctx.strokeStyle = '#f4d67a';
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.arc(0, 0, 55, .25, Math.PI * 1.75);
      ctx.stroke();
      ctx.fillStyle = '#e8c65d';
      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI / 4;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * 75, Math.sin(a) * 75, 7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.beginPath();
      ctx.moveTo(0, -43);
      ctx.lineTo(13, -8);
      ctx.lineTo(48, 0);
      ctx.lineTo(13, 9);
      ctx.lineTo(0, 45);
      ctx.lineTo(-13, 9);
      ctx.lineTo(-48, 0);
      ctx.lineTo(-13, -8);
      ctx.closePath();
      ctx.stroke();
    });

    const stoneMat = new THREE.MeshStandardMaterial({
      color: 0x737989,
      map: stoneTexture,
      roughness: 0.88,
      metalness: 0.04
    });
    const darkStoneMat = new THREE.MeshStandardMaterial({
      color: 0x252a38,
      roughness: 0.93
    });
    const brassMat = new THREE.MeshStandardMaterial({
      color: 0xb98b35,
      roughness: 0.28,
      metalness: 0.82
    });
    const brassDarkMat = new THREE.MeshStandardMaterial({
      color: 0x60421d,
      roughness: 0.38,
      metalness: 0.72
    });
    const ironMat = new THREE.MeshStandardMaterial({
      color: 0x191c25,
      roughness: 0.42,
      metalness: 0.76
    });
    const woodMat = new THREE.MeshStandardMaterial({
      color: 0x6d4025,
      map: woodTexture,
      roughness: 0.8
    });

    function shadows(object) {
      object.traverse(child => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      return object;
    }

    function cylinderBetween(a, b, radius, material, segments = 8) {
      const delta = new THREE.Vector3().subVectors(b, a);
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, delta.length(), segments),
        material
      );
      mesh.position.copy(a).add(b).multiplyScalar(.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        delta.clone().normalize()
      );
      mesh.castShadow = true;
      return mesh;
    }

    const skyDome = new THREE.Mesh(
      new THREE.SphereGeometry(150, 32, 20),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          topColor: { value: new THREE.Color(0x02030c) },
          horizonColor: { value: new THREE.Color(0x18203d) },
          glowColor: { value: new THREE.Color(0x392657) }
        },
        vertexShader: `
          varying vec3 vWorld;
          void main() {
            vec4 world = modelMatrix * vec4(position, 1.0);
            vWorld = world.xyz;
            gl_Position = projectionMatrix * viewMatrix * world;
          }
        `,
        fragmentShader: `
          uniform vec3 topColor;
          uniform vec3 horizonColor;
          uniform vec3 glowColor;
          varying vec3 vWorld;
          void main() {
            vec3 d = normalize(vWorld);
            float h = smoothstep(-0.12, 0.55, d.y);
            float band = pow(max(0.0, 1.0 - abs(d.y + 0.02)), 5.0);
            vec3 c = mix(horizonColor, topColor, h);
            c += glowColor * band * 0.32;
            gl_FragColor = vec4(c, 1.0);
          }
        `
      })
    );
    scene.add(skyDome);

    const starGeo = new THREE.BufferGeometry();
    const stars = [];
    for (let i = 0; i < 750; i++) {
      const theta = random() * Math.PI * 2;
      const phi = Math.acos(range(.05, 1));
      const r = range(105, 132);
      stars.push(
        Math.sin(phi) * Math.cos(theta) * r,
        Math.cos(phi) * r,
        Math.sin(phi) * Math.sin(theta) * r
      );
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(stars, 3));
    const starField = new THREE.Points(
      starGeo,
      new THREE.PointsMaterial({
        color: 0xb9c9ff,
        size: .22,
        transparent: true,
        opacity: .65,
        depthWrite: false
      })
    );
    scene.add(starField);

    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(4.2, 32, 24),
      new THREE.MeshBasicMaterial({ color: 0xaabce3 })
    );
    moon.position.set(-52, 47, -82);
    scene.add(moon);

    const moonHalo = new THREE.Sprite(
      new THREE.SpriteMaterial({
        map: canvasTexture(128, (ctx, s) => {
          const g = ctx.createRadialGradient(s / 2, s / 2, 1, s / 2, s / 2, s / 2);
          g.addColorStop(0, 'rgba(190,210,255,.65)');
          g.addColorStop(.25, 'rgba(140,175,255,.2)');
          g.addColorStop(1, 'rgba(60,80,180,0)');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, s, s);
        }),
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      })
    );
    moonHalo.position.copy(moon.position);
    moonHalo.scale.set(22, 22, 1);
    scene.add(moonHalo);

    const hemi = new THREE.HemisphereLight(0x647fc1, 0x0a0710, 1.15);
    scene.add(hemi);

    const moonLight = new THREE.DirectionalLight(0x9bb9ff, 2.7);
    moonLight.position.set(-32, 44, 18);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.set(2048, 2048);
    moonLight.shadow.camera.left = -28;
    moonLight.shadow.camera.right = 28;
    moonLight.shadow.camera.top = 28;
    moonLight.shadow.camera.bottom = -28;
    moonLight.shadow.camera.near = 1;
    moonLight.shadow.camera.far = 95;
    moonLight.shadow.bias = -0.0004;
    scene.add(moonLight);

    const tower = new THREE.Group();
    scene.add(tower);

    const towerShaft = new THREE.Mesh(
      new THREE.CylinderGeometry(11.4, 12.6, 15, 32),
      stoneMat
    );
    towerShaft.position.y = -3.3;
    tower.add(towerShaft);

    const platform = new THREE.Mesh(
      new THREE.CylinderGeometry(12.7, 11.8, 1.35, 40),
      stoneMat
    );
    platform.position.y = 4.55;
    tower.add(platform);

    const topFloor = new THREE.Mesh(
      new THREE.CylinderGeometry(11.75, 11.75, .26, 40),
      new THREE.MeshStandardMaterial({
        color: 0x414757,
        roughness: .92
      })
    );
    topFloor.position.y = 5.34;
    topFloor.receiveShadow = true;
    tower.add(topFloor);

    for (let i = 0; i < 20; i++) {
      const a = i / 20 * Math.PI * 2;
      const merlon = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 1.7, 1.05),
        stoneMat
      );
      merlon.position.set(Math.cos(a) * 11.9, 6.16, Math.sin(a) * 11.9);
      merlon.rotation.y = -a;
      tower.add(merlon);
    }

    for (let i = 0; i < 20; i++) {
      const a = (i + .5) / 20 * Math.PI * 2;
      const support = new THREE.Mesh(
        new THREE.BoxGeometry(.42, 1.25, .62),
        darkStoneMat
      );
      support.position.set(Math.cos(a) * 12.03, 3.65, Math.sin(a) * 12.03);
      support.rotation.y = -a;
      support.rotation.z = Math.cos(a) * .03;
      tower.add(support);
    }
    shadows(tower);

    const runeGroup = new THREE.Group();
    runeGroup.position.y = 5.49;
    scene.add(runeGroup);

    const runeMat = new THREE.MeshBasicMaterial({
      color: 0x52d8ff,
      transparent: true,
      opacity: .78,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    function lineLoop(points, material) {
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      return new THREE.LineLoop(geometry, material);
    }

    for (const radius of [4.25, 4.75, 5.55]) {
      const points = [];
      for (let i = 0; i < 96; i++) {
        const a = i / 96 * Math.PI * 2;
        points.push(new THREE.Vector3(Math.cos(a) * radius, 0, Math.sin(a) * radius));
      }
      runeGroup.add(lineLoop(points, runeMat));
    }

    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2;
      const b = (i + 4) / 12 * Math.PI * 2;
      const points = [
        new THREE.Vector3(Math.cos(a) * 4.25, 0, Math.sin(a) * 4.25),
        new THREE.Vector3(Math.cos(b) * 4.25, 0, Math.sin(b) * 4.25)
      ];
      runeGroup.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(points),
        runeMat
      ));
    }

    const runeShapes = [];
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * Math.PI * 2;
      const rune = new THREE.Group();
      rune.position.set(Math.cos(a) * 5.15, 0, Math.sin(a) * 5.15);
      rune.rotation.y = -a;
      const s1 = cylinderBetween(
        new THREE.Vector3(-.18, 0, -.22),
        new THREE.Vector3(0, 0, .28),
        .025,
        runeMat,
        5
      );
      const s2 = cylinderBetween(
        new THREE.Vector3(0, 0, .28),
        new THREE.Vector3(.2, 0, -.18),
        .025,
        runeMat,
        5
      );
      s1.rotation.x = s2.rotation.x = Math.PI / 2;
      rune.add(s1, s2);
      runeGroup.add(rune);
      runeShapes.push(rune);
    }

    const runeLight = new THREE.PointLight(0x31bfff, 5, 15, 2);
    runeLight.position.set(0, 6.5, 0);
    scene.add(runeLight);

    const pedestal = new THREE.Group();
    pedestal.position.set(0, 5.5, 0);
    scene.add(pedestal);

    const pedestalParts = [
      [new THREE.CylinderGeometry(2.05, 2.35, .55, 10), darkStoneMat, 0],
      [new THREE.CylinderGeometry(1.48, 1.86, 2.3, 10), stoneMat, 1.4],
      [new THREE.CylinderGeometry(1.82, 1.48, .52, 10), darkStoneMat, 2.75],
      [new THREE.TorusGeometry(1.25, .12, 8, 32), brassMat, 3.17]
    ];
    for (const [geometry, material, y] of pedestalParts) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.y = y;
      if (geometry.type === 'TorusGeometry') mesh.rotation.x = Math.PI / 2;
      pedestal.add(mesh);
    }

    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + Math.PI / 4;
      const prong = cylinderBetween(
        new THREE.Vector3(Math.cos(a) * .75, 3.05, Math.sin(a) * .75),
        new THREE.Vector3(Math.cos(a) * .43, 3.85, Math.sin(a) * .43),
        .065,
        brassMat,
        8
      );
      pedestal.add(prong);
    }

    const orbMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x72e6ff,
      emissive: 0x0877c7,
      emissiveIntensity: 4.2,
      roughness: .08,
      metalness: .05,
      transmission: .25,
      transparent: true,
      opacity: .92,
      clearcoat: 1
    });
    const orb = new THREE.Mesh(
      new THREE.IcosahedronGeometry(1.28, 5),
      orbMaterial
    );
    orb.position.y = 4.28;
    pedestal.add(orb);

    const orbCore = new THREE.Mesh(
      new THREE.IcosahedronGeometry(.48, 2),
      new THREE.MeshBasicMaterial({
        color: 0xe8ffff,
        blending: THREE.AdditiveBlending,
        transparent: true,
        opacity: .9
      })
    );
    orb.add(orbCore);

    const orbitRings = new THREE.Group();
    orbitRings.position.y = 4.28;
    pedestal.add(orbitRings);
    for (let i = 0; i < 3; i++) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(1.65 + i * .13, .025, 6, 64),
        runeMat
      );
      ring.rotation.set(range(-1.1, 1.1), range(0, Math.PI), range(-.5, .5));
      orbitRings.add(ring);
    }

    const orbLight = new THREE.PointLight(0x38cbff, 25, 24, 2);
    orbLight.position.y = 4.28;
    pedestal.add(orbLight);
    shadows(pedestal);

    const telescope = new THREE.Group();
    telescope.position.set(5.9, 6.35, 2.3);
    telescope.rotation.y = -.85;
    scene.add(telescope);

    const mount = new THREE.Mesh(
      new THREE.CylinderGeometry(.72, .9, .55, 12),
      brassDarkMat
    );
    telescope.add(mount);

    const pivot = new THREE.Mesh(
      new THREE.SphereGeometry(.62, 16, 12),
      brassMat
    );
    pivot.position.y = 2.15;
    telescope.add(pivot);

    for (let i = 0; i < 3; i++) {
      const a = i * Math.PI * 2 / 3;
      telescope.add(cylinderBetween(
        new THREE.Vector3(0, 1.95, 0),
        new THREE.Vector3(Math.cos(a) * 1.15, -.55, Math.sin(a) * 1.15),
        .09,
        brassDarkMat,
        8
      ));
    }

    const tube = new THREE.Group();
    tube.position.y = 2.2;
    tube.rotation.z = -.34;
    telescope.add(tube);

    const barrel = new THREE.Mesh(
      new THREE.CylinderGeometry(.4, .53, 4.7, 20),
      brassMat
    );
    barrel.rotation.z = Math.PI / 2;
    barrel.position.x = .35;
    tube.add(barrel);

    const barrelDark = new THREE.Mesh(
      new THREE.CylinderGeometry(.34, .4, 2.4, 20),
      brassDarkMat
    );
    barrelDark.rotation.z = Math.PI / 2;
    barrelDark.position.x = 2.35;
    tube.add(barrelDark);

    const lensRim = new THREE.Mesh(
      new THREE.TorusGeometry(.56, .12, 8, 24),
      brassMat
    );
    lensRim.rotation.y = Math.PI / 2;
    lensRim.position.x = 3.55;
    tube.add(lensRim);

    const lens = new THREE.Mesh(
      new THREE.CircleGeometry(.5, 24),
      new THREE.MeshPhysicalMaterial({
        color: 0x82ccff,
        emissive: 0x113d70,
        emissiveIntensity: 1,
        roughness: .05,
        metalness: .2
      })
    );
    lens.rotation.y = Math.PI / 2;
    lens.position.x = 3.57;
    tube.add(lens);

    const eyepiece = new THREE.Mesh(
      new THREE.CylinderGeometry(.18, .28, .5, 16),
      ironMat
    );
    eyepiece.rotation.z = Math.PI / 2;
    eyepiece.position.x = -2.25;
    tube.add(eyepiece);
    shadows(telescope);

    const books = [];
    function createBook(color, index) {
      const group = new THREE.Group();
      const coverMat = new THREE.MeshStandardMaterial({
        color,
        roughness: .66,
        metalness: .03
      });
      const pageMat = new THREE.MeshStandardMaterial({
        color: 0xe0cda1,
        roughness: .9
      });
      const pages = new THREE.Mesh(
        new THREE.BoxGeometry(1.28, .28, 1.8),
        pageMat
      );
      group.add(pages);
      for (const y of [-.2, .2]) {
        const cover = new THREE.Mesh(
          new THREE.BoxGeometry(1.42, .1, 1.98),
          coverMat
        );
        cover.position.y = y;
        group.add(cover);
      }
      const spine = new THREE.Mesh(
        new THREE.BoxGeometry(.13, .5, 1.98),
        coverMat
      );
      spine.position.x = -.69;
      group.add(spine);
      const clasp = new THREE.Mesh(
        new THREE.BoxGeometry(.16, .12, .42),
        brassMat
      );
      clasp.position.set(.72, 0, 0);
      group.add(clasp);
      group.userData.phase = index * Math.PI * 2 / 5;
      shadows(group);
      return group;
    }

    const bookColors = [0x622b66, 0x1c5472, 0x773629, 0x335c42, 0x3c346d];
    for (let i = 0; i < 5; i++) {
      const book = createBook(bookColors[i], i);
      books.push(book);
      scene.add(book);
    }

    function createCrate(x, z, scale = 1) {
      const group = new THREE.Group();
      const box = new THREE.Mesh(
        new THREE.BoxGeometry(2.35, 1.35, 1.75),
        woodMat
      );
      group.add(box);
      for (const y of [-.58, .58]) {
        const band = new THREE.Mesh(
          new THREE.BoxGeometry(2.5, .13, 1.9),
          ironMat
        );
        band.position.y = y;
        group.add(band);
      }
      for (const xPos of [-1.08, 1.08]) {
        const strip = new THREE.Mesh(
          new THREE.BoxGeometry(.16, 1.45, 1.88),
          woodMat
        );
        strip.position.x = xPos;
        group.add(strip);
      }
      group.position.set(x, 6.1, z);
      group.scale.setScalar(scale);
      group.rotation.y = range(-.3, .3);
      shadows(group);
      scene.add(group);
      return group;
    }

    createCrate(-6.7, 5.5, 1);
    createCrate(-8.25, 4.75, .78);

    function createBottle(color, x, y, z, s = 1) {
      const group = new THREE.Group();
      const glassMat = new THREE.MeshPhysicalMaterial({
        color,
        emissive: color,
        emissiveIntensity: .7,
        roughness: .12,
        transmission: .35,
        transparent: true,
        opacity: .82
      });
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(.3, 14, 10),
        glassMat
      );
      body.scale.y = 1.25;
      group.add(body);
      const neck = new THREE.Mesh(
        new THREE.CylinderGeometry(.1, .15, .38, 10),
        glassMat
      );
      neck.position.y = .42;
      group.add(neck);
      const cork = new THREE.Mesh(
        new THREE.CylinderGeometry(.09, .1, .16, 8),
        new THREE.MeshStandardMaterial({ color: 0x8c6542, roughness: 1 })
      );
      cork.position.y = .68;
      group.add(cork);
      group.position.set(x, y, z);
      group.scale.setScalar(s);
      shadows(group);
      scene.add(group);
      return group;
    }

    const potions = [
      createBottle(0x53ffb5, -7.1, 7.05, 5.45, 1.1),
      createBottle(0xff4ac8, -6.45, 7.0, 5.15, .85),
      createBottle(0x6e67ff, -7.75, 7.0, 5.25, .9)
    ];

    const raven = new THREE.Group();
    raven.position.set(-8.6, 8.65, -3.8);
    raven.rotation.y = .45;
    scene.add(raven);

    const featherMat = new THREE.MeshStandardMaterial({
      color: 0x090b13,
      roughness: .64,
      metalness: .12
    });
    const ravenBody = new THREE.Mesh(
      new THREE.SphereGeometry(.48, 16, 12),
      featherMat
    );
    ravenBody.scale.set(.8, 1.2, .72);
    raven.add(ravenBody);

    const ravenHead = new THREE.Mesh(
      new THREE.SphereGeometry(.3, 14, 10),
      featherMat
    );
    ravenHead.position.set(0, .65, -.18);
    raven.add(ravenHead);

    const beak = new THREE.Mesh(
      new THREE.ConeGeometry(.13, .48, 5),
      new THREE.MeshStandardMaterial({ color: 0x242329, roughness: .72 })
    );
    beak.rotation.x = -Math.PI / 2;
    beak.position.set(0, .62, -.55);
    raven.add(beak);

    for (const side of [-1, 1]) {
      const wing = new THREE.Mesh(
        new THREE.ConeGeometry(.3, 1.05, 7),
        featherMat
      );
      wing.position.set(side * .35, -.05, .05);
      wing.rotation.z = side * .22;
      raven.add(wing);

      const eye = new THREE.Mesh(
        new THREE.SphereGeometry(.035, 8, 6),
        new THREE.MeshBasicMaterial({ color: 0xbcecff })
      );
      eye.position.set(side * .22, .72, -.39);
      raven.add(eye);

      const leg = new THREE.Mesh(
        new THREE.CylinderGeometry(.025, .025, .42, 6),
        new THREE.MeshStandardMaterial({ color: 0x292633 })
      );
      leg.position.set(side * .13, -.7, 0);
      raven.add(leg);
    }

    const tail = new THREE.Mesh(
      new THREE.ConeGeometry(.36, 1.2, 5),
      featherMat
    );
    tail.position.set(0, -.62, .26);
    tail.rotation.x = -.2;
    raven.add(tail);
    shadows(raven);

    const bannerMeshes = [];
    function createBanner(angle) {
      const group = new THREE.Group();
      const r = 11.1;
      group.position.set(Math.cos(angle) * r, 6.2, Math.sin(angle) * r);
      group.rotation.y = -angle + Math.PI / 2;

      const pole = new THREE.Mesh(
        new THREE.CylinderGeometry(.1, .13, 6.4, 10),
        ironMat
      );
      pole.position.y = 2.1;
      group.add(pole);

      const finial = new THREE.Mesh(
        new THREE.ConeGeometry(.24, .72, 8),
        brassMat
      );
      finial.position.y = 5.62;
      group.add(finial);

      const crossbar = new THREE.Mesh(
        new THREE.CylinderGeometry(.065, .065, 2.8, 8),
        ironMat
      );
      crossbar.rotation.z = Math.PI / 2;
      crossbar.position.set(1.25, 4.72, 0);
      group.add(crossbar);

      const geometry = new THREE.PlaneGeometry(2.5, 3.3, 10, 14);
      geometry.translate(1.25, 2.98, 0);
      const banner = new THREE.Mesh(
        geometry,
        new THREE.MeshStandardMaterial({
          map: bannerTexture,
          color: 0xffffff,
          side: THREE.DoubleSide,
          roughness: .76
        })
      );
      banner.userData.base = Float32Array.from(
        geometry.attributes.position.array
      );
      banner.userData.phase = angle;
      banner.castShadow = true;
      group.add(banner);
      bannerMeshes.push(banner);
      shadows(group);
      scene.add(group);
    }

    createBanner(Math.PI * .18);
    createBanner(Math.PI * 1.12);
    createBanner(Math.PI * 1.64);

    const brazier = new THREE.Group();
    brazier.position.set(7.9, 6.05, -5.3);
    scene.add(brazier);

    const bowl = new THREE.Mesh(
      new THREE.SphereGeometry(.8, 16, 8, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2),
      ironMat
    );
    brazier.add(bowl);

    for (let i = 0; i < 3; i++) {
      const a = i * Math.PI * 2 / 3;
      brazier.add(cylinderBetween(
        new THREE.Vector3(Math.cos(a) * .36, -.15, Math.sin(a) * .36),
        new THREE.Vector3(Math.cos(a) * .72, -1.5, Math.sin(a) * .72),
        .055,
        ironMat,
        7
      ));
    }

    const flameMat = new THREE.MeshBasicMaterial({
      color: 0x65dfff,
      transparent: true,
      opacity: .8,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const flames = [];
    for (let i = 0; i < 5; i++) {
      const flame = new THREE.Mesh(
        new THREE.ConeGeometry(range(.12, .25), range(.55, 1.15), 8),
        flameMat
      );
      flame.position.set(range(-.34, .34), range(.35, .65), range(-.34, .34));
      flame.userData.phase = random() * Math.PI * 2;
      brazier.add(flame);
      flames.push(flame);
    }
    const fireLight = new THREE.PointLight(0x3ecbff, 9, 13, 2);
    fireLight.position.y = .8;
    brazier.add(fireLight);
    shadows(brazier);

    const cloudGroup = new THREE.Group();
    scene.add(cloudGroup);
    const cloudMat = new THREE.MeshStandardMaterial({
      color: 0x252a42,
      roughness: 1,
      transparent: true,
      opacity: .72,
      depthWrite: false
    });
    for (let i = 0; i < 54; i++) {
      const cloud = new THREE.Mesh(
        new THREE.SphereGeometry(1, 12, 8),
        cloudMat
      );
      const a = range(0, Math.PI * 2);
      const radius = range(38, 78);
      cloud.position.set(
        Math.cos(a) * radius,
        range(18, 35),
        Math.sin(a) * radius
      );
      cloud.scale.set(range(4, 10), range(1.1, 3.3), range(2.5, 6));
      cloud.rotation.y = random() * Math.PI;
      cloud.userData.speed = range(.02, .07);
      cloudGroup.add(cloud);
    }

    const cragMat = new THREE.MeshStandardMaterial({
      color: 0x111522,
      roughness: 1,
      flatShading: true
    });
    for (let i = 0; i < 34; i++) {
      const a = i / 34 * Math.PI * 2 + range(-.05, .05);
      const radius = range(48, 82);
      const height = range(9, 31);
      const crag = new THREE.Mesh(
        new THREE.ConeGeometry(range(2.5, 7), height, 5),
        cragMat
      );
      crag.position.set(
        Math.cos(a) * radius,
        -1 + height * .5,
        Math.sin(a) * radius
      );
      crag.rotation.y = random() * Math.PI;
      scene.add(crag);
    }

    const lightningMat = new THREE.LineBasicMaterial({
      color: 0xdff6ff,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending
    });
    const lightning = new THREE.Group();
    scene.add(lightning);

    function rebuildLightning() {
      lightning.clear();
      const x = range(-45, 45);
      const z = -range(45, 70);
      let p = new THREE.Vector3(x, range(37, 48), z);
      const points = [p.clone()];
      for (let i = 0; i < 11; i++) {
        p = p.clone().add(new THREE.Vector3(
          range(-2.8, 2.8),
          -range(2.5, 4.6),
          range(-1.1, 1.1)
        ));
        points.push(p);
      }
      lightning.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(points),
        lightningMat
      ));
      for (let branch = 0; branch < 3; branch++) {
        const start = points[Math.floor(range(3, 8))];
        const branchPoints = [start.clone()];
        let q = start.clone();
        for (let j = 0; j < 4; j++) {
          q = q.clone().add(new THREE.Vector3(
            range(-3.4, 3.4),
            -range(1.3, 2.8),
            range(-1, 1)
          ));
          branchPoints.push(q);
        }
        lightning.add(new THREE.Line(
          new THREE.BufferGeometry().setFromPoints(branchPoints),
          lightningMat
        ));
      }
    }
    rebuildLightning();

    const flashLight = new THREE.DirectionalLight(0xd8edff, 0);
    flashLight.position.set(-20, 38, -30);
    scene.add(flashLight);

    let nextLightning = 2.5;
    let flashAge = 10;
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();
      const dt = Math.min(clock.getDelta(), .05);

      controls.update();
      runeGroup.rotation.y = time * .045;
      runeMat.opacity = .66 + Math.sin(time * 2.4) * .14;

      orb.rotation.y = time * .28;
      orb.rotation.x = Math.sin(time * .4) * .08;
      orb.scale.setScalar(1 + Math.sin(time * 2.1) * .035);
      orbCore.rotation.set(time * .5, time * .65, time * .32);
      orbitRings.rotation.set(time * .16, time * .25, -time * .12);
      orbLight.intensity = 23 + Math.sin(time * 2.2) * 4;

      for (const book of books) {
        const phase = book.userData.phase;
        const radius = 7.1 + Math.sin(phase * 2) * .5;
        const a = time * .18 + phase;
        book.position.set(
          Math.cos(a) * radius,
          9.1 + Math.sin(time * .8 + phase) * .75,
          Math.sin(a) * radius
        );
        book.rotation.set(
          Math.sin(time + phase) * .12,
          -a + Math.PI / 2,
          Math.sin(time * .7 + phase) * .18
        );
      }

      for (const banner of bannerMeshes) {
        const pos = banner.geometry.attributes.position;
        const base = banner.userData.base;
        const phase = banner.userData.phase;
        for (let i = 0; i < pos.count; i++) {
          const x = base[i * 3];
          const y = base[i * 3 + 1];
          const strength = THREE.MathUtils.clamp(x / 2.5, 0, 1);
          pos.setXYZ(
            i,
            x,
            y + Math.sin(time * 5.2 + y * 2.6 + phase) * .05 * strength,
            Math.sin(time * 6.2 - x * 3.1 + y + phase) * .24 * strength
          );
        }
        pos.needsUpdate = true;
        banner.geometry.computeVertexNormals();
      }

      for (const flame of flames) {
        const phase = flame.userData.phase;
        flame.scale.set(
          1 + Math.sin(time * 7 + phase) * .16,
          1 + Math.sin(time * 9 + phase) * .22,
          1 + Math.sin(time * 7 + phase) * .16
        );
        flame.rotation.y = time * 2 + phase;
      }
      fireLight.intensity = 8 + Math.sin(time * 9) * 1.5;

      ravenHead.rotation.y = Math.sin(time * .9) * .18;
      raven.position.y = 8.65 + Math.sin(time * 1.2) * .025;

      for (let i = 0; i < cloudGroup.children.length; i++) {
        const cloud = cloudGroup.children[i];
        cloud.position.x += Math.sin(time * .04 + i) * .002;
        cloud.rotation.y += cloud.userData.speed * .0008;
      }
      cloudGroup.rotation.y = time * .006;
      starField.rotation.y = time * .002;

      nextLightning -= dt;
      flashAge += dt;
      if (nextLightning <= 0) {
        rebuildLightning();
        lightningMat.opacity = 1;
        flashLight.intensity = 14;
        flashAge = 0;
        nextLightning = range(5.5, 11.5);
      }
      if (flashAge < .09) {
        lightningMat.opacity = 1;
        flashLight.intensity = 13;
        renderer.toneMappingExposure = 1.45;
      } else if (flashAge < .16) {
        lightningMat.opacity = .05;
        flashLight.intensity = .6;
        renderer.toneMappingExposure = 1.12;
      } else if (flashAge < .24) {
        lightningMat.opacity = .78;
        flashLight.intensity = 8;
        renderer.toneMappingExposure = 1.3;
      } else {
        lightningMat.opacity = Math.max(0, .5 - (flashAge - .24) * 3);
        flashLight.intensity = Math.max(0, 5 - (flashAge - .24) * 28);
        renderer.toneMappingExposure += (1.12 - renderer.toneMappingExposure) * .12;
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    animate();
  </script>
</body>
</html>
