<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Magenta Balloon Dog</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #09040d;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x09040d);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(-8.5, 5.4, 10.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.05;
controls.minDistance = 7;
controls.maxDistance = 18;
controls.target.set(0, 3.15, 0);

const environmentScene = new RoomEnvironment(renderer);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(environmentScene, 0.04).texture;
environmentScene.dispose();
pmrem.dispose();

const hemi = new THREE.HemisphereLight(0xffd8f1, 0x13091b, 2.25);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffe8f7, 5.2);
keyLight.position.set(-5, 10, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -8;
keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 10;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const rimLight = new THREE.PointLight(0xff247f, 24, 18, 2);
rimLight.position.set(5, 6, -4);
scene.add(rimLight);

const frontGlow = new THREE.PointLight(0x9c2fff, 13, 12, 2);
frontGlow.position.set(-5, 4, 6);
scene.add(frontGlow);

const chromeMagenta = new THREE.MeshPhysicalMaterial({
  color: 0xb30d72,
  metalness: 1,
  roughness: 0.045,
  clearcoat: 1,
  clearcoatRoughness: 0.035,
  envMapIntensity: 2.8
});

const darkChrome = new THREE.MeshPhysicalMaterial({
  color: 0x74104e,
  metalness: 1,
  roughness: 0.06,
  clearcoat: 1,
  clearcoatRoughness: 0.04,
  envMapIntensity: 2.4
});

const floorMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x130a18,
  metalness: 0.32,
  roughness: 0.22,
  clearcoat: 0.65,
  clearcoatRoughness: 0.12,
  envMapIntensity: 1.15
});

function makeSphere(name, position, scale, material = chromeMagenta, segments = 48) {
  const geometry = new THREE.SphereGeometry(1, segments, segments);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.scale.set(scale[0], scale[1], scale[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function makeTube(name, pointA, pointB, radius, material = chromeMagenta, radialSegments = 40) {
  const start = new THREE.Vector3(pointA[0], pointA[1], pointA[2]);
  const end = new THREE.Vector3(pointB[0], pointB[1], pointB[2]);
  const delta = new THREE.Vector3().subVectors(end, start);
  const length = delta.length();
  const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
  const geometry = new THREE.CylinderGeometry(radius, radius, length, radialSegments, 1, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.copy(midpoint);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function addRoundedSegment(parent, name, pointA, pointB, radius, material = chromeMagenta) {
  const tube = makeTube(name + "-tube", pointA, pointB, radius, material);
  const capA = makeSphere(name + "-cap-a", pointA, [radius, radius, radius], material, 40);
  const capB = makeSphere(name + "-cap-b", pointB, [radius, radius, radius], material, 40);
  parent.add(tube, capA, capB);
}

function addBentTube(parent, name, points, radius, material = chromeMagenta) {
  for (let index = 0; index < points.length - 1; index += 1) {
    addRoundedSegment(parent, name + "-" + index, points[index], points[index + 1], radius, material);
  }
}

const dog = new THREE.Group();
dog.rotation.y = -0.035;
scene.add(dog);

const body = makeSphere("inflated body", [0.15, 3.0, 0], [2.55, 1.38, 1.22], chromeMagenta, 64);
dog.add(body);

const chest = makeSphere("rounded chest", [-1.7, 3.28, 0], [1.18, 1.38, 1.16], chromeMagenta, 56);
dog.add(chest);

addRoundedSegment(dog, "neck", [-1.78, 3.42, 0], [-2.28, 4.25, 0], 0.76);

const head = makeSphere("balloon head", [-2.72, 4.65, 0], [1.38, 1.28, 1.2], chromeMagenta, 64);
dog.add(head);

const muzzle = makeSphere("muzzle", [-3.78, 4.38, 0], [0.92, 0.68, 0.78], chromeMagenta, 52);
dog.add(muzzle);

addRoundedSegment(dog, "nose knot", [-4.43, 4.43, 0], [-4.78, 4.46, 0], 0.39, darkChrome);
const noseKnotTop = makeSphere("nose knot top", [-4.7, 4.72, 0], [0.34, 0.32, 0.38], darkChrome, 40);
const noseKnotBottom = makeSphere("nose knot bottom", [-4.7, 4.2, 0], [0.34, 0.32, 0.38], darkChrome, 40);
dog.add(noseKnotTop, noseKnotBottom);

const eyeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x100711,
  metalness: 0.85,
  roughness: 0.08,
  clearcoat: 1,
  envMapIntensity: 1.6
});
const leftEye = makeSphere("near eye", [-3.15, 5.12, 0.96], [0.17, 0.2, 0.12], eyeMaterial, 32);
const farEye = makeSphere("far eye", [-3.15, 5.12, -0.96], [0.17, 0.2, 0.12], eyeMaterial, 32);
dog.add(leftEye, farEye);

addBentTube(dog, "near ear", [
  [-2.9, 5.55, 0.65],
  [-2.85, 6.22, 0.72],
  [-2.52, 6.58, 0.6],
  [-2.24, 6.28, 0.53],
  [-2.35, 5.72, 0.57]
], 0.37);
addBentTube(dog, "far ear", [
  [-2.9, 5.55, -0.65],
  [-2.85, 6.22, -0.72],
  [-2.52, 6.58, -0.6],
  [-2.24, 6.28, -0.53],
  [-2.35, 5.72, -0.57]
], 0.37);

const legPositions = [
  [-1.2, 0.95, 0.72],
  [1.45, 0.95, 0.72],
  [-1.2, 0.95, -0.72],
  [1.45, 0.95, -0.72]
];

for (let legIndex = 0; legIndex < legPositions.length; legIndex += 1) {
  const legX = legPositions[legIndex][0];
  const legZ = legPositions[legIndex][2];
  const upperPoint = [legX, 2.65, legZ];
  const lowerPoint = [legX + (legIndex % 2 === 0 ? -0.08 : 0.08), 1.02, legZ];
  addRoundedSegment(dog, "leg-" + legIndex, upperPoint, lowerPoint, 0.48);
  const paw = makeSphere("paw-" + legIndex, [lowerPoint[0], 0.62, lowerPoint[2]], [0.56, 0.42, 0.54], chromeMagenta, 48);
  dog.add(paw);
}

addBentTube(dog, "tail", [
  [2.02, 3.35, 0],
  [2.9, 3.85, 0],
  [3.42, 4.65, 0],
  [3.38, 5.42, 0],
  [3.0, 5.85, 0]
], 0.47);
const tailTip = makeSphere("tail tip", [2.96, 5.88, 0], [0.55, 0.55, 0.55], chromeMagenta, 48);
dog.add(tailTip);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0.14;
floor.receiveShadow = true;
scene.add(floor);

const pedestalShadow = new THREE.Mesh(
  new THREE.CircleGeometry(4.55, 96),
  new THREE.MeshBasicMaterial({ color: 0x050207, transparent: true, opacity: 0.52 })
);
pedestalShadow.rotation.x = -Math.PI / 2;
pedestalShadow.position.y = 0.155;
pedestalShadow.scale.set(1.2, 0.7, 1);
scene.add(pedestalShadow);

const backdrop = new THREE.Mesh(
  new THREE.CylinderGeometry(14, 14, 0.5, 96),
  new THREE.MeshStandardMaterial({ color: 0x100816, roughness: 0.38, metalness: 0.15 })
);
backdrop.position.y = -0.14;
backdrop.receiveShadow = true;
scene.add(backdrop);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
