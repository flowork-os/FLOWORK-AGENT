<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Low-Poly Manta Ray</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #080d1d; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080d1d);
scene.fog = new THREE.Fog(0x080d1d, 14, 28);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.4, 5.6, 8.4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 5;
controls.maxDistance = 18;
controls.target.set(0, 0.15, 0);

scene.add(new THREE.HemisphereLight(0x9eaeef, 0x111525, 2.2));

const key = new THREE.DirectionalLight(0xc6d5ff, 4.5);
key.position.set(-5, 7, 10);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -9;
key.shadow.camera.right = 9;
key.shadow.camera.top = 9;
key.shadow.camera.bottom = -9;
scene.add(key);

const rim = new THREE.DirectionalLight(0x4e6fff, 2.2);
rim.position.set(7, -6, 3);
scene.add(rim);

const dorsal = [
  new THREE.MeshStandardMaterial({ color: 0x182b62, roughness: 0.92, flatShading: true, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x263d79, roughness: 0.9, flatShading: true, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x3b527e, roughness: 0.88, flatShading: true, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x111d48, roughness: 0.95, flatShading: true, side: THREE.DoubleSide })
];
const bone = new THREE.MeshStandardMaterial({ color: 0xd9d2b8, roughness: 0.9, flatShading: true, side: THREE.DoubleSide });
const boneShade = new THREE.MeshStandardMaterial({ color: 0xb6b39f, roughness: 0.94, flatShading: true, side: THREE.DoubleSide });
const mouthMat = new THREE.MeshStandardMaterial({ color: 0x11131b, roughness: 1, flatShading: true, side: THREE.DoubleSide });
const gillMat = new THREE.MeshStandardMaterial({ color: 0x49516b, roughness: 0.95, flatShading: true, side: THREE.DoubleSide });

function triangleMesh(triangles, materials, indices) {
  const pos = [];
  triangles.forEach(t => t.forEach(v => pos.push(v.x, v.y, v.z)));
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  triangles.forEach((_, i) => geo.addGroup(i * 3, 3, indices[i] ?? 0));
  const mesh = new THREE.Mesh(geo, materials);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const ring = [
  new THREE.Vector3(0, 2.55, 0.08),
  new THREE.Vector3(-1.2, 1.95, 0.20),
  new THREE.Vector3(-2.65, 1.15, 0.12),
  new THREE.Vector3(-4.75, 0.18, -0.02),
  new THREE.Vector3(-2.25, -1.18, 0.02),
  new THREE.Vector3(-0.85, -1.82, 0.12),
  new THREE.Vector3(0, -2.02, 0.14),
  new THREE.Vector3(0.85, -1.82, 0.12),
  new THREE.Vector3(2.25, -1.18, 0.02),
  new THREE.Vector3(4.75, 0.18, -0.02),
  new THREE.Vector3(2.65, 1.15, 0.12),
  new THREE.Vector3(1.2, 1.95, 0.20)
];

const topCenter = new THREE.Vector3(0, 0.15, 0.46);
const bottomCenter = new THREE.Vector3(0, 0.15, -0.29);
const bottomRing = ring.map((v, i) => new THREE.Vector3(v.x * 0.985, v.y, -0.16 + (i === 0 || i === 11 || i === 1 ? 0.03 : 0)));

const bodyTriangles = [];
const bodyIndices = [];
for (let i = 0; i < ring.length; i++) {
  bodyTriangles.push([topCenter, ring[i], ring[(i + 1) % ring.length]]);
  bodyIndices.push([1, 2, 0, 1, 3, 0, 2, 1, 0, 3, 1, 0][i]);
}
for (let i = 0; i < ring.length; i++) {
  bodyTriangles.push([bottomCenter, bottomRing[(i + 1) % ring.length], bottomRing[i]]);
  bodyIndices.push(4);
}
const body = triangleMesh(bodyTriangles, [...dorsal, bone, boneShade], bodyIndices);
scene.add(body);

const centerFacet = triangleMesh([
  [new THREE.Vector3(0, 0.15, 0.47), new THREE.Vector3(-1.2, 1.95, 0.2), new THREE.Vector3(0, 2.55, 0.08)],
  [new THREE.Vector3(0, 0.15, 0.47), new THREE.Vector3(0, 2.55, 0.08), new THREE.Vector3(1.2, 1.95, 0.2)],
  [new THREE.Vector3(0, 0.15, 0.47), new THREE.Vector3(1.2, 1.95, 0.2), new THREE.Vector3(0.85, -1.82, 0.12)],
  [new THREE.Vector3(0, 0.15, 0.47), new THREE.Vector3(0.85, -1.82, 0.12), new THREE.Vector3(-0.85, -1.82, 0.12)],
  [new THREE.Vector3(0, 0.15, 0.47), new THREE.Vector3(-0.85, -1.82, 0.12), new THREE.Vector3(-1.2, 1.95, 0.2)]
], dorsal, [2, 1, 0, 3, 1]);
scene.add(centerFacet);

function extrudedPolygon(points, z0, z1, materials) {
  const tris = [], ids = [];
  const c = points.reduce((a, p) => a.add(p), new THREE.Vector2()).multiplyScalar(1 / points.length);
  for (let i = 0; i < points.length; i++) {
    const a = points[i], b = points[(i + 1) % points.length];
    tris.push([new THREE.Vector3(c.x, c.y, z1), new THREE.Vector3(a.x, a.y, z1), new THREE.Vector3(b.x, b.y, z1)]);
    ids.push(0);
    tris.push([new THREE.Vector3(c.x, c.y, z0), new THREE.Vector3(b.x, b.y, z0), new THREE.Vector3(a.x, a.y, z0)]);
    ids.push(Math.min(1, materials.length - 1));
    tris.push([new THREE.Vector3(a.x, a.y, z0), new THREE.Vector3(b.x, b.y, z0), new THREE.Vector3(b.x, b.y, z1)]);
    ids.push(Math.min(1, materials.length - 1));
    tris.push([new THREE.Vector3(a.x, a.y, z0), new THREE.Vector3(b.x, b.y, z1), new THREE.Vector3(a.x, a.y, z1)]);
    ids.push(Math.min(1, materials.length - 1));
  }
  return triangleMesh(tris, materials, ids);
}

const leftHorn = extrudedPolygon([
  new THREE.Vector2(-1.05, 1.55), new THREE.Vector2(-0.36, 1.68),
  new THREE.Vector2(-0.45, 2.55), new THREE.Vector2(-0.72, 2.76)
], 0.03, 0.39, [dorsal[2], dorsal[0]]);
const rightHorn = extrudedPolygon([
  new THREE.Vector2(1.05, 1.55), new THREE.Vector2(0.36, 1.68),
  new THREE.Vector2(0.45, 2.55), new THREE.Vector2(0.72, 2.76)
], 0.03, 0.39, [dorsal[2], dorsal[0]]);
scene.add(leftHorn, rightHorn);

const mouth = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.11, 0.32), mouthMat);
mouth.position.set(0, 2.49, -0.22);
mouth.castShadow = true;
scene.add(mouth);

const lip = new THREE.Mesh(new THREE.BoxGeometry(2.02, 0.1, 0.12), bone);
lip.position.set(0, 2.44, -0.04);
lip.rotation.x = -0.08;
scene.add(lip);

function addEye(x) {
  const eye = new THREE.Mesh(new THREE.IcosahedronGeometry(0.12, 0), new THREE.MeshStandardMaterial({ color: 0x05070d, roughness: 0.3, flatShading: true }));
  eye.position.set(x, 1.56, 0.42);
  eye.castShadow = true;
  scene.add(eye);
}
addEye(-0.62);
addEye(0.62);

function addGill(x, y, flip) {
  const s = flip ? -1 : 1;
  const z = -0.335;
  const p1 = new THREE.Vector3(x, y, z);
  const p2 = new THREE.Vector3(x + s * 0.16, y - 0.58, z);
  const p3 = new THREE.Vector3(x + s * 0.28, y - 0.08, z - 0.025);
  const g = triangleMesh([[p1, p2, p3]], [gillMat], [0]);
  scene.add(g);
}
for (let side of [-1, 1]) {
  addGill(side * 0.46, 1.18, side < 0);
  addGill(side * 0.72, 1.12, side < 0);
  addGill(side * 0.98, 1.02, side < 0);
}

function addTailSegment(a, b, r1, r2) {
  const midpoint = a.clone().add(b).multiplyScalar(0.5);
  const len = a.distanceTo(b);
  const geo = new THREE.CylinderGeometry(r2, r1, len, 5, 1, false);
  const mesh = new THREE.Mesh(geo, dorsal[3]);
  mesh.position.copy(midpoint);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  mesh.castShadow = true;
  scene.add(mesh);
}
const tail = [
  new THREE.Vector3(0, -1.72, 0.03),
  new THREE.Vector3(0.02, -2.55, 0.0),
  new THREE.Vector3(-0.10, -3.45, -0.02),
  new THREE.Vector3(0.17, -4.25, -0.03),
  new THREE.Vector3(0.02, -5.12, 0.02),
  new THREE.Vector3(-0.34, -5.67, 0.05)
];
for (let i = 0; i < tail.length - 1; i++) {
  addTailSegment(tail[i], tail[i + 1], 0.13 - i * 0.022, 0.108 - i * 0.022);
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(15, 64),
  new THREE.MeshStandardMaterial({ color: 0x0d1427, roughness: 0.96, metalness: 0.02 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.position.z = -1.18;
floor.receiveShadow = true;
scene.add(floor);

const halo = new THREE.Mesh(
  new THREE.RingGeometry(4.7, 5.8, 64),
  new THREE.MeshBasicMaterial({ color: 0x172653, transparent: true, opacity: 0.24, side: THREE.DoubleSide })
);
halo.rotation.x = -Math.PI / 2;
halo.position.z = -1.16;
scene.add(halo);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  body.rotation.z = Math.sin(t * 0.72) * 0.018;
  body.position.y = Math.sin(t * 1.15) * 0.055;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
