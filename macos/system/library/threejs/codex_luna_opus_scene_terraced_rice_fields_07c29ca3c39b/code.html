<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Terraced Rice Fields</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a9b8a3}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0xbcc4a8,0.0085);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,600);
camera.position.set(34,25,38);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.055;
controls.autoRotate=true;
controls.autoRotateSpeed=.28;
controls.target.set(0,6,0);
controls.minDistance=18;
controls.maxDistance=85;
controls.maxPolarAngle=Math.PI*.47;

const clock=new THREE.Clock();
const rng=(()=>{
  let s=193817;
  return ()=>{
    s=(s*1664525+1013904223)>>>0;
    return s/4294967296;
  };
})();
const rand=(a=0,b=1)=>a+(b-a)*rng();

const mats={
  soil:new THREE.MeshStandardMaterial({color:0x76533d,roughness:1}),
  darkSoil:new THREE.MeshStandardMaterial({color:0x4d3c2d,roughness:1}),
  grass:new THREE.MeshStandardMaterial({color:0x537a3d,roughness:.95}),
  brightGrass:new THREE.MeshStandardMaterial({color:0x79a64d,roughness:.9}),
  rice:new THREE.MeshStandardMaterial({color:0x91ad4e,roughness:.8}),
  riceLight:new THREE.MeshStandardMaterial({color:0xb3c866,roughness:.82}),
  wood:new THREE.MeshStandardMaterial({color:0x6b4430,roughness:.88}),
  woodDark:new THREE.MeshStandardMaterial({color:0x412d26,roughness:.95}),
  thatch:new THREE.MeshStandardMaterial({color:0x9b7440,roughness:1}),
  leaf:new THREE.MeshStandardMaterial({color:0x326345,roughness:.82}),
  leafLight:new THREE.MeshStandardMaterial({color:0x54834d,roughness:.82}),
  mud:new THREE.MeshStandardMaterial({color:0x594633,roughness:1}),
  buffalo:new THREE.MeshStandardMaterial({color:0x282925,roughness:.98}),
  horn:new THREE.MeshStandardMaterial({color:0xc8ae76,roughness:.8}),
  white:new THREE.MeshStandardMaterial({color:0xf1eee0,roughness:.8}),
  gold:new THREE.MeshStandardMaterial({color:0xdca64c,roughness:.75}),
  stone:new THREE.MeshStandardMaterial({color:0x77796b,roughness:1})
};

function mesh(geo,mat,pos=[0,0,0],rot=[0,0,0]){
  const m=new THREE.Mesh(geo,mat);
  m.position.set(...pos);
  m.rotation.set(...rot);
  m.castShadow=true;
  m.receiveShadow=true;
  scene.add(m);
  return m;
}
function add(parent,obj){
  parent.add(obj);
  obj.castShadow=true;
  obj.receiveShadow=true;
  return obj;
}
function box(parent,size,mat,pos,rot=[0,0,0]){
  const o=add(parent,new THREE.Mesh(new THREE.BoxGeometry(...size),mat));
  o.position.set(...pos);o.rotation.set(...rot);return o;
}
function cyl(parent,r1,r2,h,mat,pos,seg=10,rot=[0,0,0]){
  const o=add(parent,new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),mat));
  o.position.set(...pos);o.rotation.set(...rot);return o;
}
function sphere(parent,scale,mat,pos){
  const o=add(parent,new THREE.Mesh(new THREE.SphereGeometry(1,14,9),mat));
  o.scale.set(...scale);o.position.set(...pos);return o;
}

function sky(){
  const g=new THREE.SphereGeometry(260,32,16);
  const m=new THREE.ShaderMaterial({
    side:THREE.BackSide,
    uniforms:{top:{value:new THREE.Color(0x748f9e)},mid:{value:new THREE.Color(0xe2a16c)},bottom:{value:new THREE.Color(0xf6c783)}},
    vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`uniform vec3 top,mid,bottom;varying vec3 vP;void main(){float h=normalize(vP).y;vec3 c=h>.05?mix(mid,top,smoothstep(.05,.65,h)):mix(bottom,mid,smoothstep(-.35,.05,h));gl_FragColor=vec4(c,1.);}`
  });
  scene.add(new THREE.Mesh(g,m));
}
sky();

const hemi=new THREE.HemisphereLight(0xffd6a0,0x445342,2.15);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffbd78,4.5);
sun.position.set(-32,48,22);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-55;sun.shadow.camera.right=55;
sun.shadow.camera.top=55;sun.shadow.camera.bottom=-40;
sun.shadow.camera.near=1;sun.shadow.camera.far=150;
sun.shadow.bias=-.00025;
scene.add(sun);
const fill=new THREE.DirectionalLight(0x9bc1bd,.65);
fill.position.set(30,18,-35);
scene.add(fill);

const ground=mesh(new THREE.PlaneGeometry(180,150),new THREE.MeshStandardMaterial({color:0x5f7549,roughness:1}),[0,-1,0],[-Math.PI/2,0,0]);

function hill(){
  const geo=new THREE.CylinderGeometry(52,72,25,48,10);
  const h=mesh(geo,new THREE.MeshStandardMaterial({color:0x5c764b,roughness:1}),[0,8,-39]);
  h.scale.z=.72;
  h.rotation.y=.17;
}
hill();

function terraceShape(zFront,zBack,y,curve=0){
  const s=new THREE.Shape();
  const n=18;
  s.moveTo(-29,zFront);
  for(let i=1;i<=n;i++){
    const x=-29+58*i/n;
    s.lineTo(x,zFront+curve*Math.pow(Math.cos((x/29)*Math.PI/2),2));
  }
  s.lineTo(29,zBack);
  s.lineTo(-29,zBack);
  s.closePath();
  return new THREE.ShapeGeometry(s);
}
const waterUniform={time:{value:0}};
function waterMaterial(){
  return new THREE.ShaderMaterial({
    uniforms:waterUniform,
    transparent:true,
    side:THREE.DoubleSide,
    vertexShader:`uniform float time;varying vec2 vUv;varying float wave;void main(){vUv=uv;vec3 p=position;wave=sin(p.x*.75+time*1.35)*.025+cos(p.y*1.7-time)*.018;p.z+=wave;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
    fragmentShader:`uniform float time;varying vec2 vUv;varying float wave;void main(){float a=.76+.12*sin(vUv.x*35.+time*1.2)+.08*sin(vUv.y*52.-time);vec3 c=mix(vec3(.18,.38,.27),vec3(.55,.68,.45),.35+wave*5.);float gl=pow(max(0.,sin(vUv.x*70.+vUv.y*20.+time*2.)),22.)*.55;gl_FragColor=vec4(c+gl, a);}`
  });
}

const levels=[
  {front:18,back:24,y:1.1,curve:1.1},
  {front:10.7,back:17,y:2.8,curve:1.6},
  {front:3.2,back:9.7,y:4.65,curve:2.3},
  {front:-4.5,back:2.4,y:6.7,curve:2.9},
  {front:-12.2,back:-5.3,y:8.95,curve:3.5},
  {front:-19.5,back:-13,y:11.4,curve:4.2}
];

const waterPlanes=[];
for(let i=0;i<levels.length;i++){
  const l=levels[i];
  const water=mesh(terraceShape(l.front,l.back,l.y,l.curve),waterMaterial(),[0,l.y,0],[-Math.PI/2,0,0]);
  water.receiveShadow=true;
  water.castShadow=false;
  waterPlanes.push(water);

  const bundGeo=terraceShape(l.front-.35,l.front+.3,l.y-.04,l.curve);
  const bund=mesh(bundGeo,mats.brightGrass,[0,l.y+.03,0],[-Math.PI/2,0,0]);
  bund.scale.set(1.015,1.0,1);
  const rear=mesh(terraceShape(l.back-.05,l.back+.46,l.y-.04,l.curve),mats.grass,[0,l.y+.02,0],[-Math.PI/2,0,0]);
  rear.scale.set(1.015,1,1);
}

function createRiceRow(z,y,x0,x1,count=24){
  const g=new THREE.Group();scene.add(g);
  for(let i=0;i<count;i++){
    const x=x0+(x1-x0)*(i+.5)/count;
    const lean=rand(-.12,.12);
    const blade=add(g,new THREE.Mesh(new THREE.ConeGeometry(.055,.6+rand(-.08,.12),5),i%3?mats.rice:mats.riceLight));
    blade.position.set(x,y+.32,z+rand(-.07,.07));
    blade.rotation.z=lean;
  }
  return g;
}
for(let i=0;i<levels.length;i++){
  const l=levels[i];
  const rows=2+(i%2);
  for(let r=0;r<rows;r++){
    const z=l.front+.9+(r+.5)*(l.back-l.front-1.4)/rows;
    createRiceRow(z,l.y,-25,25,38-i*2);
  }
}

function pathCurve(){
  const pts=[];
  for(let i=0;i<18;i++){
    const z=23-i*2.7;
    const x=-21+Math.sin(i*.75)*5+i*.7;
    const y=1.42+i*.42;
    pts.push(new THREE.Vector3(x,y,z));
  }
  return new THREE.CatmullRomCurve3(pts);
}
const path=pathCurve();
const pathMesh=mesh(new THREE.TubeGeometry(path,80,.32,8,false),mats.darkSoil);
pathMesh.scale.y=.35;

function steppingStones(){
  for(let i=0;i<22;i++){
    const t=i/21;
    const p=path.getPoint(t);
    const s=mesh(new THREE.CylinderGeometry(.42,.48,.13,8),mats.stone,[p.x,p.y+.14,p.z]);
    s.rotation.y=rand(0,Math.PI);
    s.rotation.x=.08;
  }
}
steppingStones();

function hut(){
  const g=new THREE.Group();scene.add(g);
  g.position.set(15,13.2,-10);
  for(const x of [-2.6,2.6])for(const z of [-1.7,1.7])cyl(g,.22,.27,6,mats.wood,[x,-3,z],8);
  box(g,[7.4,.32,5.2],mats.woodDark,[0,-.2,0]);
  box(g,[6.8,2.5,4.7],mats.wood,[0,1.05,0]);
  box(g,[2.1,1.6,.18],mats.darkSoil,[-1.5,1.05,2.38]);
  box(g,[1.4,1.4,.2],mats.woodDark,[1.8,1.0,2.4]);
  const roof=new THREE.Group();g.add(roof);
  const roofGeo=new THREE.ConeGeometry(4.8,2.8,4);
  const r=add(roof,new THREE.Mesh(roofGeo,mats.thatch));
  r.scale.set(1,.72,.63);
  r.position.y=2.75;
  r.rotation.y=Math.PI/4;
  for(let i=-3;i<=3;i++){
    const reed=box(g,[.14,2.65,5.3],mats.thatch,[i*.7,2.75,0],[0,0,i%2?.05:-.05]);
  }
  const ladder=new THREE.Group();g.add(ladder);
  ladder.position.set(0,-1.6,2.9);ladder.rotation.x=-.22;
  for(let i=0;i<5;i++)box(ladder,[.12,3.8,.12],mats.wood,[i?-.72:.72,-.2,0],[0,0,0]);
  for(let i=0;i<5;i++)box(ladder,[1.6,.12,.16],mats.wood,[0,-1.65+i*.72,0]);
}
hut();

function palm(x,z,h=7){
  const g=new THREE.Group();scene.add(g);
  g.position.set(x,0,z);
  const trunk=cyl(g,.26,.55,h,mats.wood,[0,h/2,0],9);
  trunk.rotation.z=rand(-.09,.09);
  const crown=new THREE.Group();g.add(crown);crown.position.y=h;
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4+rand(-.18,.18);
    const leaf=add(crown,new THREE.Mesh(new THREE.ConeGeometry(.16,3.4,5),i%2?mats.leaf:mats.leafLight));
    leaf.position.set(Math.cos(a)*1.45,.05,Math.sin(a)*1.45);
    leaf.scale.set(1,.22,1);
    leaf.rotation.z=Math.PI/2-Math.cos(a)*.35;
    leaf.rotation.y=-a;
  }
  const bud=sphere(crown,[.42,.35,.42],mats.gold,[0,.05,0]);
  return g;
}
palm(-25,-19,7.5);palm(-21,-21,6.4);palm(-27,-15,5.7);
palm(24,-25,8.1);palm(28,-22,6.6);palm(22,-20,5.8);

function buffalo(){
  const g=new THREE.Group();scene.add(g);g.position.set(-10,1.55,15);
  const body=sphere(g,[2.0,1.15,1.05],mats.buffalo,[0,1.45,0]);
  const neck=sphere(g,[.78,1.15,.78],mats.buffalo,[-1.45,1.75,.05]);
  neck.rotation.z=-.25;
  const head=sphere(g,[.75,.68,.58],mats.buffalo,[-1.9,1.18,.05]);
  head.rotation.z=-.3;
  for(const x of [-1.25,.9])for(const z of [-.55,.55])cyl(g,.16,.22,1.5,mats.buffalo,[x,.62,z],9,[0,0,rand(-.08,.08)]);
  for(const z of [-.54,.54]){
    const horn=cyl(g,.11,.22,.95,mats.horn,[-2.25,1.92,z],8,[0,0,z>0?-.8:.8]);
  }
  sphere(g,[.1,.1,.1],mats.white,[-2.42,1.3,.42]);
  const tail=new THREE.Group();g.add(tail);
  tail.position.set(1.8,1.65,0);tail.rotation.z=-.8;
  cyl(tail,.06,.09,1.4,mats.buffalo,[0,.55,0],7);
  sphere(tail,[.25,.3,.2],mats.buffalo,[0,1.2,0]);
  const mud=new THREE.Mesh(new THREE.CircleGeometry(4.1,32),mats.mud);
  mud.rotation.x=-Math.PI/2;mud.position.set(-1,0.13,0);g.add(mud);
  return g;
}
const buffaloObj=buffalo();

function farmer(){
  const g=new THREE.Group();scene.add(g);g.position.set(9,2.0,17);
  cyl(g,.36,.42,2.2,mats.wood,[0,1.1,0],10);
  sphere(g,[.45,.55,.45],mats.gold,[0,2.55,0]);
  const hat=cyl(g,.92,.72,.18,mats.thatch,[0,3.05,0],16);
  sphere(g,[.35,.18,.35],mats.gold,[0,3.12,0]);
  box(g,[.72,1.25,.25],mats.wood,[0,1.75,0]);
  for(const z of [-.28,.28])cyl(g,.13,.16,1.25,mats.wood,[0,.45,z],8);
  const staff=cyl(g,.055,.055,3.4,mats.woodDark,[.75,1.4,0],6,[0,0,-.14]);
  return g;
}
farmer();

function egret(x,y,z,scale=1){
  const g=new THREE.Group();scene.add(g);g.position.set(x,y,z);g.scale.setScalar(scale);
  sphere(g,[.4,.28,.72],mats.white,[0,0,0]);
  const neck=cyl(g,.11,.16,.8,mats.white,[.28,.34,0],8,[0,0,-.45]);
  sphere(g,[.2,.16,.24],mats.white,[.48,.74,0]);
  const beak=cyl(g,.06,.025,.45,mats.gold,[.78,.74,0],6,[0,0,-Math.PI/2]);
  for(const z2 of [-.17,.17])cyl(g,.035,.04,.95,mats.gold,[0,-.52,z2],6,[.03,0,.06]);
  for(const z2 of [-.2,.2]){
    const wing=add(g,new THREE.Mesh(new THREE.ConeGeometry(.28,.85,5),mats.white));
    wing.position.set(-.12,.08,z2);wing.rotation.z=z2>0?.7:-.7;
  }
  g.userData.phase=rand(0,Math.PI*2);
  return g;
}
const birds=[egret(-4,8.6,8,.85),egret(5,12,-2,.72),egret(-15,16,-17,.78),egret(18,14,-15,.65)];

function reeds(){
  const g=new THREE.Group();scene.add(g);
  for(let i=0;i<70;i++){
    const x=rand(-30,30),z=rand(-28,25);
    if(Math.abs(x)<18&&z<20)continue;
    const h=rand(.5,1.5);
    const stem=cyl(g,.025,.045,h,mats.brightGrass,[x,.1,z],5,[rand(-.14,.14),0,rand(-.14,.14)]);
    stem.userData.phase=rand(0,Math.PI*2);
  }
  return g;
}
const reedGroup=reeds();

function distantMountains(){
  const g=new THREE.Group();scene.add(g);
  for(let i=0;i<11;i++){
    const x=-62+i*12;
    const h=rand(13,27);
    const mountain=add(g,new THREE.Mesh(new THREE.ConeGeometry(rand(9,15),h,5),new THREE.MeshStandardMaterial({color:0x708878,roughness:1})));
    mountain.position.set(x,h/2-1,-67+rand(-3,3));
    mountain.scale.z=.5;
    mountain.rotation.y=rand(0,Math.PI);
  }
}
distantMountains();

function cloud(x,y,z,s){
  const g=new THREE.Group();scene.add(g);g.position.set(x,y,z);g.scale.setScalar(s);
  const material=new THREE.MeshStandardMaterial({color:0xf2d7b4,transparent:true,opacity:.4,roughness:1});
  for(let i=0;i<7;i++)sphere(g,[rand(1.5,3.2),rand(.35,.8),rand(.7,1.3)],material,[i*1.8-5,rand(-.2,.5),rand(-.3,.3)]);
}
cloud(-17,35,-55,1.2);cloud(21,30,-58,.8);

const sunDisc=new THREE.Mesh(new THREE.SphereGeometry(3.8,24,16),new THREE.MeshBasicMaterial({color:0xffd28a}));
sunDisc.position.set(-43,30,-78);scene.add(sunDisc);

const fireflies=[];
for(let i=0;i<28;i++){
  const p=mesh(new THREE.SphereGeometry(.045,6,6),new THREE.MeshBasicMaterial({color:0xffe7a0}),[rand(-27,27),rand(2,15),rand(-25,20)]);
  p.userData.phase=rand(0,Math.PI*2);fireflies.push(p);
}

const animatedLeaves=[];
scene.traverse(o=>{if(o.geometry&&o.geometry.type==="ConeGeometry"&&o.parent)animatedLeaves.push(o);});

function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  waterUniform.time.value=t;
  buffaloObj.rotation.y=Math.sin(t*.45)*.025;
  birds.forEach((b,i)=>{
    b.position.y+=Math.sin(t*1.7+b.userData.phase)*.002;
    b.rotation.z=Math.sin(t*2.1+b.userData.phase)*.035;
    b.position.x+=Math.sin(t*.16+b.userData.phase)*.002;
  });
  reedGroup.children.forEach((r,i)=>{
    r.rotation.z=Math.sin(t*1.5+r.userData.phase)*.06;
    r.rotation.x=Math.cos(t*1.1+r.userData.phase)*.035;
  });
  fireflies.forEach((f,i)=>{
    f.position.y+=Math.sin(t*1.8+f.userData.phase)*.004;
    f.material.opacity=.45+.4*(.5+.5*Math.sin(t*2.4+f.userData.phase));
    f.material.transparent=true;
  });
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
