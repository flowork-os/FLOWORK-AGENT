<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cartoon Cargo Trike</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #17191d; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: 500 12px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: rgba(255,255,255,0.34); letter-spacing: 0.09em; text-transform: uppercase;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="hint">Cartoon Cargo Trike &nbsp;·&nbsp; drag to orbit &nbsp;·&nbsp; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1e23);
scene.fog = new THREE.Fog(0x1b1e23, 12, 30);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(3.6, 2.35, 4.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.minDistance = 2.6;
controls.maxDistance = 13;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 0.72, 0);

/* ============================================================
   LIGHTING
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xbcd8ff, 0x2a2118, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3e0, 2.5);
key.position.set(4.2, 6.4, 4.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 25;
key.shadow.camera.left = -4.5;
key.shadow.camera.right = 4.5;
key.shadow.camera.top = 4.5;
key.shadow.camera.bottom = -4.5;
key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.022;
key.shadow.radius = 3.2;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fc4ff, 0.62);
fill.position.set(-5.0, 2.6, 3.2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9a8, 1.15);
rim.position.set(-2.6, 3.4, -5.4);
scene.add(rim);

const bounce = new THREE.PointLight(0xffc98a, 0.35, 9, 2.0);
bounce.position.set(0.6, 0.35, 1.6);
scene.add(bounce);

/* ============================================================
   GROUND (shadow-only)
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(24, 64).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   PALETTE + MATERIALS
   ============================================================ */
const COL = {
  cream:    0xf6e9d2,
  creamDk:  0xe6d4b6,
  tangerine:0xf58a35,
  tangDk:   0xd96a1c,
  mint:     0x7fd6bb,
  mintDk:   0x54b39a,
  outline:  0x241f22,
  rubber:   0x2e2a2e,
  brass:    0xd9a441,
  chrome:   0xc9cdd4,
  glass:    0xfff4cf,
  wood:     0xb98a54
};

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: opts.roughness !== undefined ? opts.roughness : 0.55,
    metalness: opts.metalness !== undefined ? opts.metalness : 0.0,
    flatShading: !!opts.flat,
    emissive: opts.emissive !== undefined ? opts.emissive : 0x000000,
    emissiveIntensity: opts.emissiveIntensity !== undefined ? opts.emissiveIntensity : 1.0,
    side: opts.side || THREE.FrontSide
  });
}

const M = {
  cream:   mat(COL.cream,   { roughness: 0.52 }),
  creamDk: mat(COL.creamDk, { roughness: 0.6 }),
  tang:    mat(COL.tangerine,{ roughness: 0.42 }),
  tangDk:  mat(COL.tangDk,  { roughness: 0.5 }),
  mint:    mat(COL.mint,    { roughness: 0.45 }),
  mintDk:  mat(COL.mintDk,  { roughness: 0.5 }),
  outline: mat(COL.outline, { roughness: 0.85 }),
  rubber:  mat(COL.rubber,  { roughness: 0.92 }),
  tread:   mat(0x201d21,    { roughness: 0.95 }),
  brass:   mat(COL.brass,   { roughness: 0.28, metalness: 0.85 }),
  chrome:  mat(COL.chrome,  { roughness: 0.24, metalness: 0.9 }),
  lampGlass: new THREE.MeshStandardMaterial({
    color: 0xfff0c2, roughness: 0.16, metalness: 0.0,
    emissive: 0xffce6a, emissiveIntensity: 1.5
  }),
  wood:    mat(COL.wood,    { roughness: 0.78 }),
  seat:    mat(0x8c4b3a,    { roughness: 0.62 }),
  dark:    mat(0x39333a,    { roughness: 0.7 })
};

/* ============================================================
   GEOMETRY HELPERS
   ============================================================ */

// Rounded box via a lathe-free approach: extruded rounded rect + spherical-ish chamfer
// Simple & robust: use a "squircle" box built from a BoxGeometry with vertices pushed
// onto a rounded-cube surface. Gives real chamfered edges with smooth normals.
function roundedBoxGeometry(w, h, d, radius, seg = 5) {
  radius = Math.min(radius, Math.min(w, h, d) * 0.5 - 1e-4);
  const geo = new THREE.BoxGeometry(w, h, d, seg, seg, seg);
  const pos = geo.attributes.position;
  const hx = w / 2 - radius, hy = h / 2 - radius, hz = d / 2 - radius;
  const v = new THREE.Vector3();
  const c = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    c.set(
      THREE.MathUtils.clamp(v.x, -hx, hx),
      THREE.MathUtils.clamp(v.y, -hy, hy),
      THREE.MathUtils.clamp(v.z, -hz, hz)
    );
    const d0 = v.clone().sub(c);
    const len = d0.length();
    if (len > 1e-6) {
      d0.multiplyScalar(radius / len);
      v.copy(c).add(d0);
    }
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  geo.deleteAttribute('uv');
  return geo;
}

function roundedBox(w, h, d, r, material, seg = 5) {
  const m = new THREE.Mesh(roundedBoxGeometry(w, h, d, r, seg), material);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function capsule(radius, length, material, capSeg = 8, radialSeg = 20) {
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(radius, length, capSeg, radialSeg), material);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function sphere(r, material, wSeg = 28, hSeg = 20) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, wSeg, hSeg), material);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function cylinder(rt, rb, h, material, seg = 28, open = false) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg, 1, open), material);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function torus(r, tube, material, radSeg = 16, tubSeg = 40, arc = Math.PI * 2) {
  const m = new THREE.Mesh(new THREE.TorusGeometry(r, tube, radSeg, tubSeg, arc), material);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// A tube swept along a Catmull-Rom curve of Vector3 points
function tubeFromPoints(points, radius, material, tubularSeg = 48, radialSeg = 12, closed = false) {
  const curve = new THREE.CatmullRomCurve3(points, closed, 'catmullrom', 0.5);
  const m = new THREE.Mesh(new THREE.TubeGeometry(curve, tubularSeg, radius, radialSeg, closed), material);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

/* --- "baked outline" seam: a thin dark band that hugs a surface ---
   Implemented as slightly-scaled dark shells / thin rings so the seams
   read as bold ink lines in the cartoon style. */
function seamRing(radius, tube, material = M.outline, arc = Math.PI * 2) {
  const t = torus(radius, tube, material, 10, 48, arc);
  t.castShadow = false;
  return t;
}

// Flat dark inset panel (used for painted seam lines on the crate faces)
function seamBar(w, h, thickness, material = M.outline) {
  const m = new THREE.Mesh(roundedBoxGeometry(w, h, thickness, Math.min(w, h, thickness) * 0.45, 3), material);
  m.castShadow = false;
  m.receiveShadow = false;
  return m;
}

/* ============================================================
   ROOT OBJECT
   ============================================================ */
const trike = new THREE.Group();
scene.add(trike);

/* ------------------------------------------------------------
   WHEELS — fat balloon tires with chunky treads, cream rims,
   mint hubs and a bold dark sidewall seam.
   ------------------------------------------------------------ */
function makeWheel(tireR, tireThick, opts = {}) {
  const g = new THREE.Group();
  const hubColor = opts.hub || M.mint;

  // main balloon tire (torus reads as a fat rounded donut)
  const tire = torus(tireR - tireThick, tireThick, M.rubber, 20, 44);
  tire.rotation.y = Math.PI / 2;
  g.add(tire);

  // inner rubber filler so the tire looks solid from the side
  const filler = cylinder(tireR - tireThick * 1.05, tireR - tireThick * 1.05, tireThick * 1.5, M.rubber, 40);
  filler.rotation.z = Math.PI / 2;
  g.add(filler);

  // chunky treads around the outside
  const treadCount = opts.treads || 18;
  const treadGeo = roundedBoxGeometry(tireThick * 0.42, tireThick * 0.5, tireThick * 2.1, tireThick * 0.16, 3);
  for (let i = 0; i < treadCount; i++) {
    const a = (i / treadCount) * Math.PI * 2;
    const t = new THREE.Mesh(treadGeo, M.tread);
    const rr = tireR - tireThick * 0.18;
    t.position.set(0, Math.cos(a) * rr, Math.sin(a) * rr);
    t.rotation.x = -a;
    t.castShadow = true;
    g.add(t);
  }

  // sidewall dark seam rings (ink line) — both sides
  for (const s of [-1, 1]) {
    const ring = seamRing(tireR - tireThick * 1.02, tireThick * 0.085, M.outline);
    ring.rotation.y = Math.PI / 2;
    ring.position.x = s * tireThick * 0.62;
    g.add(ring);
  }

  // cream rim disc
  for (const s of [-1, 1]) {
    const rim = cylinder(tireR - tireThick * 1.28, tireR - tireThick * 1.28, tireThick * 0.34, M.cream, 40);
    rim.rotation.z = Math.PI / 2;
    rim.position.x = s * (tireThick * 0.72);
    g.add(rim);

    // rim outline ring
    const rr = seamRing(tireR - tireThick * 1.28, tireThick * 0.075, M.outline);
    rr.rotation.y = Math.PI / 2;
    rr.position.x = s * (tireThick * 0.9);
    g.add(rr);
  }

  // rim body (connecting cylinder) to avoid gaps
  const rimBody = cylinder(tireR - tireThick * 1.24, tireR - tireThick * 1.24, tireThick * 1.5, M.cream, 40);
  rimBody.rotation.z = Math.PI / 2;
  g.add(rimBody);

  // hub cap (mint) with brass nut
  for (const s of [-1, 1]) {
    const hub = cylinder(tireR * 0.30, tireR * 0.33, tireThick * 0.45, hubColor, 26);
    hub.rotation.z = Math.PI / 2;
    hub.position.x = s * (tireThick * 0.9);
    g.add(hub);

    const hubEdge = seamRing(tireR * 0.315, tireThick * 0.07, M.outline);
    hubEdge.rotation.y = Math.PI / 2;
    hubEdge.position.x = s * (tireThick * 1.05);
    g.add(hubEdge);

    const nut = sphere(tireR * 0.115, M.brass, 18, 14);
    nut.scale.x = 0.7;
    nut.position.x = s * (tireThick * 1.22);
    g.add(nut);
  }

  // chunky cartoon spokes (5 fat tangerine bars per side)
  const spokeCount = 5;
  const spokeLen = (tireR - tireThick * 1.3) * 0.94;
  const spokeGeo = roundedBoxGeometry(tireThick * 0.28, spokeLen, tireThick * 0.34, tireThick * 0.1, 3);
  for (const s of [-1, 1]) {
    for (let i = 0; i < spokeCount; i++) {
      const a = (i / spokeCount) * Math.PI * 2 + (s > 0 ? 0.3 : 0);
      const sp = new THREE.Mesh(spokeGeo, opts.spoke || M.tang);
      sp.castShadow = true;
      sp.position.set(
        s * (tireThick * 0.92),
        Math.cos(a) * spokeLen * 0.52,
        Math.sin(a) * spokeLen * 0.52
      );
      sp.rotation.set(-a, 0, Math.PI / 2);
      // orient: bar along the radius in the YZ plane
      sp.rotation.set(0, 0, 0);
      sp.rotation.x = -a;
      g.add(sp);
    }
  }

  return g;
}

/* Wheel dimensions */
const R_REAR = 0.40, T_REAR = 0.135;
const R_FRONT = 0.30, T_FRONT = 0.115;

const wheelRear = makeWheel(R_REAR, T_REAR, { treads: 20, hub: M.mint, spoke: M.tang });
wheelRear.position.set(0, R_REAR, -1.02);
trike.add(wheelRear);

const wheelFL = makeWheel(R_FRONT, T_FRONT, { treads: 16, hub: M.tang, spoke: M.mint });
wheelFL.position.set(-0.60, R_FRONT, 0.72);
trike.add(wheelFL);

const wheelFR = makeWheel(R_FRONT, T_FRONT, { treads: 16, hub: M.tang, spoke: M.mint });
wheelFR.position.set(0.60, R_FRONT, 0.72);
trike.add(wheelFR);

const spinners = [wheelRear, wheelFL, wheelFR];

/* ------------------------------------------------------------
   FRAME — chunky tangerine tubes
   ------------------------------------------------------------ */
const frame = new THREE.Group();
trike.add(frame);

const TUBE_R = 0.062;

// Main spine: from rear axle up over to the front cargo deck
const spine = tubeFromPoints([
  new THREE.Vector3(0, R_REAR + 0.02, -1.02),
  new THREE.Vector3(0, 0.62, -0.80),
  new THREE.Vector3(0, 0.62, -0.30),
  new THREE.Vector3(0, 0.58, 0.10),
  new THREE.Vector3(0, 0.54, 0.45),
  new THREE.Vector3(0, 0.52, 0.72)
], TUBE_R, M.tang, 80, 14);
frame.add(spine);

// Lower spine (double-tube look)
const spineLow = tubeFromPoints([
  new THREE.Vector3(0, R_REAR - 0.02, -1.00),
  new THREE.Vector3(0, 0.36, -0.70),
  new THREE.Vector3(0, 0.34, -0.20),
  new THREE.Vector3(0, 0.34, 0.20),
  new THREE.Vector3(0, 0.36, 0.60),
  new THREE.Vector3(0, 0.40, 0.74)
], TUBE_R * 0.85, M.tangDk, 70, 12);
frame.add(spineLow);

// Seat tube (rear, holds the saddle)
const seatTube = tubeFromPoints([
  new THREE.Vector3(0, R_REAR + 0.02, -1.00),
  new THREE.Vector3(0, 0.62, -0.92),
  new THREE.Vector3(0, 0.80, -0.86),
  new THREE.Vector3(0, 0.94, -0.82)
], TUBE_R * 0.95, M.tang, 40, 12);
frame.add(seatTube);

// Rear fork arms hugging the rear wheel
for (const s of [-1, 1]) {
  const fork = tubeFromPoints([
    new THREE.Vector3(s * 0.02, 0.60, -0.78),
    new THREE.Vector3(s * 0.09, 0.52, -0.92),
    new THREE.Vector3(s * 0.11, R_REAR + 0.02, -1.02),
    new THREE.Vector3(s * 0.10, 0.30, -1.02)
  ], TUBE_R * 0.72, M.tangDk, 40, 10);
  frame.add(fork);

  const chainStay = tubeFromPoints([
    new THREE.Vector3(s * 0.03, 0.36, -0.62),
    new THREE.Vector3(s * 0.10, 0.38, -0.86),
    new THREE.Vector3(s * 0.11, R_REAR, -1.02)
  ], TUBE_R * 0.66, M.tangDk, 32, 10);
  frame.add(chainStay);
}

// Rear axle nub
const axleRear = cylinder(0.05, 0.05, 0.30, M.chrome, 18);
axleRear.rotation.z = Math.PI / 2;
axleRear.position.set(0, R_REAR, -1.02);
frame.add(axleRear);

/* ------------------------------------------------------------
   FRONT AXLE / CARGO DECK STRUCTURE
   ------------------------------------------------------------ */
const front = new THREE.Group();
trike.add(front);

// Front axle beam between the two front wheels
const axleBeam = roundedBox(1.30, 0.10, 0.13, 0.045, M.tangDk);
axleBeam.position.set(0, R_FRONT, 0.72);
front.add(axleBeam);

// Axle end caps
for (const s of [-1, 1]) {
  const cap = cylinder(0.055, 0.055, 0.10, M.chrome, 18);
  cap.rotation.z = Math.PI / 2;
  cap.position.set(s * 0.70, R_FRONT, 0.72);
  front.add(cap);
}

// Deck rails from spine tip out over the axle
for (const s of [-1, 1]) {
  const rail = tubeFromPoints([
    new THREE.Vector3(s * 0.05, 0.50, 0.30),
    new THREE.Vector3(s * 0.26, 0.50, 0.55),
    new THREE.Vector3(s * 0.30, 0.44, 0.80),
    new THREE.Vector3(s * 0.28, 0.40, 1.10)
  ], TUBE_R * 0.8, M.tang, 44, 12);
  front.add(rail);

  // diagonal strut down to the axle
  const strut = tubeFromPoints([
    new THREE.Vector3(s * 0.28, 0.48, 0.58),
    new THREE.Vector3(s * 0.48, 0.38, 0.68),
    new THREE.Vector3(s * 0.62, R_FRONT + 0.01, 0.72)
  ], TUBE_R * 0.6, M.tangDk, 32, 10);
  front.add(strut);
}

// Deck plate under the crate
const deck = roundedBox(0.86, 0.09, 0.98, 0.04, M.tangDk);
deck.position.set(0, 0.50, 0.72);
front.add(deck);

/* ------------------------------------------------------------
   CARGO CRATE — oversized, cream body with mint front panel,
   tangerine trim, bold dark seams, wooden lid.
   ------------------------------------------------------------ */
const crate = new THREE.Group();
crate.position.set(0, 0.94, 0.74);
trike.add(crate);

const CW = 1.06, CH = 0.80, CD = 1.02, CR = 0.13;

// main body
const crateBody = roundedBox(CW, CH, CD, CR, M.cream, 7);
crate.add(crateBody);

// Dark outline shell: a slightly larger dark box rendered backface-only
// gives a true baked-in ink outline around the silhouette of the crate.
const outlineMat = new THREE.MeshBasicMaterial({ color: COL.outline, side: THREE.BackSide });
const crateOutline = new THREE.Mesh(roundedBoxGeometry(CW + 0.028, CH + 0.028, CD + 0.028, CR + 0.014, 7), outlineMat);
crate.add(crateOutline);

// Mint front panel (inset)
const frontPanel = roundedBox(CW * 0.80, CH * 0.62, 0.06, 0.028, M.mint, 4);
frontPanel.position.set(0, -0.02, CD / 2 + 0.005);
crate.add(frontPanel);

// panel ink border
const panelBorder = roundedBox(CW * 0.84, CH * 0.66, 0.045, 0.03, M.outline, 4);
panelBorder.position.set(0, -0.02, CD / 2 - 0.002);
panelBorder.castShadow = false;
crate.add(panelBorder);

// Mint side panels
for (const s of [-1, 1]) {
  const sideBorder = roundedBox(0.045, CH * 0.60, CD * 0.72, 0.028, M.outline, 4);
  sideBorder.position.set(s * (CW / 2 - 0.006), -0.02, 0);
  sideBorder.castShadow = false;
  crate.add(sideBorder);

  const sidePanel = roundedBox(0.06, CH * 0.56, CD * 0.68, 0.026, M.mint, 4);
  sidePanel.position.set(s * (CW / 2 + 0.004), -0.02, 0);
  crate.add(sidePanel);
}

// Horizontal plank seams (dark bars) on the sides
for (const s of [-1, 1]) {
  for (const yy of [-0.20, 0.10]) {
    const bar = seamBar(0.055, 0.028, CD * 0.62, M.outline);
    bar.position.set(s * (CW / 2 + 0.028), yy, 0);
    crate.add(bar);
  }
}

// Vertical plank seams on the front panel
for (const xx of [-0.24, 0, 0.24]) {
  const bar = seamBar(0.026, CH * 0.52, 0.05, M.outline);
  bar.position.set(xx, -0.02, CD / 2 + 0.032);
  crate.add(bar);
}

// Tangerine trim rails along the top edge of the crate
const trimTopFB = [CD / 2, -CD / 2];
for (const z of trimTopFB) {
  const t = roundedBox(CW * 0.98, 0.085, 0.10, 0.04, M.tang, 4);
  t.position.set(0, CH / 2 - 0.055, z * 0.94);
  crate.add(t);
}
for (const s of [-1, 1]) {
  const t = roundedBox(0.10, 0.085, CD * 0.94, 0.04, M.tang, 4);
  t.position.set(s * (CW / 2 - 0.05) * 0.99, CH / 2 - 0.055, 0);
  crate.add(t);
}

// Corner bumper studs (mint) — chamfer accents
for (const sx of [-1, 1]) {
  for (const sz of [-1, 1]) {
    const stud = sphere(0.075, M.mintDk, 20, 14);
    stud.position.set(sx * (CW / 2 - 0.10), -CH / 2 + 0.09, sz * (CD / 2 - 0.10));
    stud.scale.set(1, 0.8, 1);
    crate.add(stud);
  }
}

// Lid — slightly domed cream board with wood inlay, hinged at the back
const lid = new THREE.Group();
lid.position.set(0, CH / 2 + 0.02, -CD / 2 + 0.06);
crate.add(lid);

const lidBoard = roundedBox(CW * 1.06, 0.12, CD * 1.02, 0.05, M.cream, 5);
lidBoard.position.set(0, 0.03, CD / 2 - 0.06);
lid.add(lidBoard);

const lidOutline = new THREE.Mesh(
  roundedBoxGeometry(CW * 1.06 + 0.026, 0.12 + 0.026, CD * 1.02 + 0.026, 0.05 + 0.013, 5),
  outlineMat
);
lidOutline.position.copy(lidBoard.position);
lid.add(lidOutline);

// wood inlay strips on the lid
for (const xx of [-0.28, 0, 0.28]) {
  const plank = roundedBox(0.22, 0.05, CD * 0.86, 0.022, M.wood, 4);
  plank.position.set(xx, 0.085, CD / 2 - 0.06);
  lid.add(plank);
}

// lid latch (brass) at the front
const latch = roundedBox(0.16, 0.10, 0.06, 0.028, M.brass, 4);
latch.position.set(0, -0.01, CD - 0.045);
lid.add(latch);

const latchLoop = torus(0.055, 0.018, M.brass, 12, 26);
latchLoop.rotation.x = Math.PI / 2;
latchLoop.position.set(0, -0.06, CD - 0.02);
lid.add(latchLoop);

// hinges
for (const s of [-1, 1]) {
  const h = cylinder(0.038, 0.038, 0.14, M.dark, 16);
  h.rotation.z = Math.PI / 2;
  h.position.set(s * 0.32, 0.0, 0.0);
  lid.add(h);
}

/* ------------------------------------------------------------
   HEADLAMP — one round eye above the crate
   ------------------------------------------------------------ */
const lampGroup = new THREE.Group();
lampGroup.position.set(0, 1.28, 1.20);
trike.add(lampGroup);

// mounting arm from crate front
const lampArm = tubeFromPoints([
  new THREE.Vector3(0, -0.30, -0.18),
  new THREE.Vector3(0, -0.16, -0.10),
  new THREE.Vector3(0, -0.02, -0.05)
], 0.038, M.tangDk, 24, 10);
lampGroup.add(lampArm);

// lamp housing (tangerine can)
const lampBody = cylinder(0.175, 0.155, 0.20, M.tang, 34);
lampBody.rotation.x = Math.PI / 2;
lampGroup.add(lampBody);

const lampBack = sphere(0.156, M.tangDk, 26, 18);
lampBack.scale.z = 0.7;
lampBack.position.z = -0.10;
lampGroup.add(lampBack);

// dark bezel ring (ink outline)
const bezel = torus(0.176, 0.026, M.outline, 12, 40);
bezel.position.z = 0.10;
lampGroup.add(bezel);

const bezel2 = torus(0.163, 0.020, M.chrome, 12, 40);
bezel2.position.z = 0.113;
lampGroup.add(bezel2);

// glowing lens
const lens = sphere(0.152, M.lampGlass, 30, 20);
lens.scale.z = 0.42;
lens.position.z = 0.105;
lens.castShadow = false;
lampGroup.add(lens);

// pupil highlight (cartoon eye)
const glint = new THREE.Mesh(
  new THREE.SphereGeometry(0.038, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0xffffff })
);
glint.position.set(-0.05, 0.055, 0.165);
glint.scale.z = 0.4;
lampGroup.add(glint);

// warm light cast forward from the lamp
const lampLight = new THREE.PointLight(0xffce80, 0.85, 3.2, 2.0);
lampLight.position.set(0, 0, 0.34);
lampGroup.add(lampLight);

/* ------------------------------------------------------------
   BRASS BELL — curled "nose", sitting above the crate
   ------------------------------------------------------------ */
const bell = new THREE.Group();
bell.position.set(0.30, 1.16, 0.98);
bell.rotation.z = -0.20;
trike.add(bell);

// dome via lathe for a nice curled bell profile
const bellPts = [];
for (let i = 0; i <= 14; i++) {
  const t = i / 14;
  const r = 0.135 * Math.sin(t * Math.PI * 0.5 + 0.05) * (1.0 - 0.10 * t);
  const y = t * 0.145;
  bellPts.push(new THREE.Vector2(Math.max(r, 0.006), y));
}
bellPts.push(new THREE.Vector2(0.0, 0.152));
const bellDome = new THREE.Mesh(new THREE.LatheGeometry(bellPts, 34), M.brass);
bellDome.castShadow = true;
bellDome.receiveShadow = true;
bell.add(bellDome);

// bottom rim of the bell (dark seam)
const bellRim = torus(0.132, 0.016, M.outline, 10, 34);
bellRim.rotation.x = Math.PI / 2;
bellRim.position.y = 0.006;
bell.add(bellRim);

// bell "curl" — a spiral brass ribbon wrapped over the dome
const curlPts = [];
for (let i = 0; i <= 60; i++) {
  const t = i / 60;
  const a = t * Math.PI * 3.2;
  const rad = 0.128 * (1 - t * 0.82);
  curlPts.push(new THREE.Vector3(
    Math.cos(a) * rad,
    0.055 + t * 0.115,
    Math.sin(a) * rad
  ));
}
const curl = tubeFromPoints(curlPts, 0.017, M.brass, 90, 10);
bell.add(curl);

// bell striker lever
const lever = roundedBox(0.11, 0.028, 0.035, 0.014, M.chrome, 3);
lever.position.set(0.14, 0.05, 0.02);
lever.rotation.z = 0.25;
bell.add(lever);

// bell mount post
const bellPost = cylinder(0.028, 0.034, 0.16, M.tangDk, 16);
bellPost.position.y = -0.08;
bell.add(bellPost);

/* ------------------------------------------------------------
   HANDLEBAR — comically small, bent into a smile
   ------------------------------------------------------------ */
const steer = new THREE.Group();
steer.position.set(0, 0, 0);
trike.add(steer);

// Head tube / steerer rising behind the crate
const steerer = tubeFromPoints([
  new THREE.Vector3(0, 0.60, -0.28),
  new THREE.Vector3(0, 0.82, -0.24),
  new THREE.Vector3(0, 1.02, -0.20),
  new THREE.Vector3(0, 1.16, -0.17)
], 0.058, M.tang, 40, 12);
steer.add(steerer);

const steererCollar = torus(0.072, 0.022, M.outline, 10, 28);
steererCollar.rotation.x = Math.PI / 2 - 0.18;
steererCollar.position.set(0, 1.02, -0.20);
steer.add(steererCollar);

// Stem block
const stem = roundedBox(0.15, 0.10, 0.22, 0.045, M.mintDk, 4);
stem.position.set(0, 1.20, -0.14);
stem.rotation.x = -0.16;
steer.add(stem);

// The smile bar: a small arc that curves DOWNWARD at the center and up at the tips
const smilePts = [];
const HALF = 0.30;           // comically small half-width
for (let i = 0; i <= 24; i++) {
  const t = i / 24;
  const x = -HALF + t * HALF * 2;
  const u = x / HALF;                       // -1..1
  const y = 1.20 + 0.115 * (u * u);         // parabola => smile
  const z = -0.10 + 0.035 * (1 - u * u);
  smilePts.push(new THREE.Vector3(x, y, z));
}
const smileBar = tubeFromPoints(smilePts, 0.042, M.chrome, 70, 12);
steer.add(smileBar);

// dark seam collars where the grips meet the bar
for (const s of [-1, 1]) {
  const grip = capsule(0.055, 0.15, M.mint, 8, 20);
  grip.position.set(s * (HALF - 0.02), 1.315, -0.10);
  grip.rotation.z = Math.PI / 2 - s * 0.72;
  grip.rotation.y = 0;
  steer.add(grip);

  const collar = torus(0.058, 0.016, M.outline, 10, 26);
  collar.position.set(s * (HALF - 0.10), 1.262, -0.10);
  collar.rotation.y = Math.PI / 2;
  collar.rotation.x = s * 0.6;
  steer.add(collar);

  const capEnd = sphere(0.048, M.tang, 18, 14);
  capEnd.position.set(s * (HALF + 0.055), 1.375, -0.10);
  steer.add(capEnd);

  // little brake lever
  const brake = capsule(0.016, 0.11, M.chrome, 6, 12);
  brake.position.set(s * (HALF - 0.06), 1.255, -0.02);
  brake.rotation.set(0.5, 0, Math.PI / 2 - s * 0.75);
  steer.add(brake);
}

/* ------------------------------------------------------------
   SADDLE — plump cartoon seat
   ------------------------------------------------------------ */
const saddle = new THREE.Group();
saddle.position.set(0, 1.00, -0.83);
trike.add(saddle);

const seatBody = sphere(0.20, M.seat, 30, 20);
seatBody.scale.set(1.0, 0.48, 1.55);
saddle.add(seatBody);

const seatNose = sphere(0.11, M.seat, 22, 16);
seatNose.scale.set(0.8, 0.5, 1.4);
seatNose.position.set(0, -0.005, 0.24);
saddle.add(seatNose);

// seat ink seam
const seatSeam = seamBar(0.03, 0.02, 0.46, M.outline);
seatSeam.position.set(0, 0.096, 0.02);
saddle.add(seatSeam);

// seat post clamp
const clamp = torus(0.058, 0.020, M.outline, 10, 26);
clamp.rotation.x = Math.PI / 2;
clamp.position.set(0, -0.10, -0.02);
saddle.add(clamp);

/* ------------------------------------------------------------
   CRANK / PEDALS / CHAINGUARD
   ------------------------------------------------------------ */
const drive = new THREE.Group();
drive.position.set(0, 0.34, -0.42);
trike.add(drive);

// chainring guard (mint disc with tangerine ring)
const guard = cylinder(0.185, 0.185, 0.05, M.mint, 32);
guard.rotation.z = Math.PI / 2;
guard.position.set(0.075, 0, 0);
drive.add(guard);

const guardRing = torus(0.185, 0.026, M.tang, 12, 34);
guardRing.rotation.y = Math.PI / 2;
guardRing.position.set(0.075, 0, 0);
drive.add(guardRing);

const guardInk = torus(0.130, 0.012, M.outline, 10, 30);
guardInk.rotation.y = Math.PI / 2;
guardInk.position.set(0.104, 0, 0);
drive.add(guardInk);

// bottom bracket
const bb = cylinder(0.055, 0.055, 0.22, M.chrome, 20);
bb.rotation.z = Math.PI / 2;
drive.add(bb);

// cranks + pedals
const crankGroup = new THREE.Group();
drive.add(crankGroup);
for (const s of [-1, 1]) {
  const arm = roundedBox(0.05, 0.26, 0.055, 0.024, M.tangDk, 3);
  arm.position.set(s * 0.135, s * 0.10, 0);
  arm.rotation.x = 0;
  arm.rotation.z = 0;
  // offset the two cranks 180 degrees
  arm.position.set(s * 0.135, 0, 0);
  const pivot = new THREE.Group();
  pivot.rotation.x = s > 0 ? 0.6 : 0.6 + Math.PI;
  arm.position.set(s * 0.135, 0.11, 0);
  pivot.add(arm);

  const pedal = roundedBox(0.12, 0.035, 0.16, 0.016, M.mintDk, 3);
  pedal.position.set(s * 0.175, 0.22, 0);
  pivot.add(pedal);

  const pedalInk = seamBar(0.13, 0.012, 0.05, M.outline);
  pedalInk.position.set(s * 0.175, 0.242, 0);
  pivot.add(pedalInk);

  crankGroup.add(pivot);
}

// chain (a simple dark loop from crank to rear hub)
const chainPts = [
  new THREE.Vector3(0.0, 0.34 + 0.12, -0.42),
  new THREE.Vector3(0.0, 0.44, -0.70),
  new THREE.Vector3(0.0, R_REAR + 0.06, -1.02),
  new THREE.Vector3(0.0, R_REAR - 0.06, -1.02),
  new THREE.Vector3(0.0, 0.26, -0.70),
  new THREE.Vector3(0.0, 0.34 - 0.12, -0.42),
  new THREE.Vector3(0.0, 0.34 - 0.10, -0.36),
  new THREE.Vector3(0.0, 0.34 + 0.10, -0.36)
];
const chain = tubeFromPoints(chainPts, 0.018, M.dark, 90, 8, true);
chain.position.x = -0.02;
trike.add(chain);

// rear sprocket
const sprocket = cylinder(0.09, 0.09, 0.03, M.chrome, 22);
sprocket.rotation.z = Math.PI / 2;
sprocket.position.set(-0.02, R_REAR, -1.02);
trike.add(sprocket);

/* ------------------------------------------------------------
   REAR FENDER + FRONT MUDGUARDS (mint, ink-edged)
   ------------------------------------------------------------ */
function fender(radius, width, material, arc = Math.PI * 0.85, start = Math.PI * 0.08) {
  const g = new THREE.Group();
  const shell = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, width, 34, 1, true, start, arc),
    new THREE.MeshStandardMaterial({ color: material.color, roughness: 0.45, side: THREE.DoubleSide })
  );
  shell.rotation.z = Math.PI / 2;
  shell.castShadow = true;
  shell.receiveShadow = true;
  g.add(shell);

  // ink edge rings along the open borders
  for (const s of [-1, 1]) {
    const edge = new THREE.Mesh(
      new THREE.TorusGeometry(radius, 0.012, 8, 40, arc),
      M.outline
    );
    edge.rotation.y = Math.PI / 2;
    edge.rotation.x = -start - Math.PI / 2;
    edge.position.x = s * width * 0.5;
    edge.castShadow = false;
    g.add(edge);
  }
  return g;
}

const rearFender = fender(R_REAR + 0.075, T_REAR * 2.4, M.mint, Math.PI * 0.72, Math.PI * 0.14);
rearFender.position.set(0, R_REAR, -1.02);
trike.add(rearFender);

// fender stay
const fenderStay = tubeFromPoints([
  new THREE.Vector3(0.10, R_REAR + 0.05, -1.02),
  new THREE.Vector3(0.06, R_REAR + 0.30, -0.94),
  new THREE.Vector3(0.0, 0.72, -0.88)
], 0.02, M.tangDk, 26, 8);
trike.add(fenderStay);
const fenderStay2 = fenderStay.clone();
fenderStay2.scale.x = -1;
trike.add(fenderStay2);

for (const s of [-1, 1]) {
  const f = fender(R_FRONT + 0.065, T_FRONT * 2.4, M.mint, Math.PI * 0.60, Math.PI * 0.20);
  f.position.set(s * 0.60, R_FRONT, 0.72);
  trike.add(f);
}

/* ------------------------------------------------------------
   LICENSE / NUMBER PLATE + small tangerine flag at the back
   ------------------------------------------------------------ */
const plate = roundedBox(0.24, 0.15, 0.035, 0.03, M.cream, 4);
plate.position.set(0, 0.74, -1.16);
plate.rotation.x = 0.22;
trike.add(plate);

const plateInk = roundedBox(0.27, 0.18, 0.025, 0.035, M.outline, 4);
plateInk.position.set(0, 0.74, -1.175);
plateInk.rotation.x = 0.22;
plateInk.castShadow = false;
trike.add(plateInk);

const plateDigit = seamBar(0.075, 0.075, 0.02, M.tang);
plateDigit.position.set(0, 0.742, -1.145);
plateDigit.rotation.x = 0.22;
trike.add(plateDigit);

/* ------------------------------------------------------------
   Center the whole trike on its bounding box (X/Z) so it
   orbits cleanly, and sit it exactly on the ground plane.
   ------------------------------------------------------------ */
trike.updateMatrixWorld(true);
const bbox = new THREE.Box3().setFromObject(trike);
const center = bbox.getCenter(new THREE.Vector3());
trike.position.x -= center.x;
trike.position.z -= center.z;
trike.position.y -= bbox.min.y;

trike.updateMatrixWorld(true);
const bbox2 = new THREE.Box3().setFromObject(trike);
const size2 = bbox2.getSize(new THREE.Vector3());
controls.target.set(0, size2.y * 0.46, 0);
controls.update();

/* ------------------------------------------------------------
   Soft contact shadow blob under the trike (adds cartoon weight)
   ------------------------------------------------------------ */
const blobCanvasGeo = new THREE.CircleGeometry(1.25, 48).rotateX(-Math.PI / 2);
const blobMat = new THREE.MeshBasicMaterial({
  color: 0x000000, transparent: true, opacity: 0.22, depthWrite: false
});
const blob = new THREE.Mesh(blobCanvasGeo, blobMat);
blob.scale.set(0.9, 1, 1.15);
blob.position.y = 0.004;
scene.add(blob);

/* ============================================================
   ANIMATION
   ============================================================ */
const clock = new THREE.Clock();

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}
window.addEventListener('resize', onResize);

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  // idle wheel spin + crank turn — gentle, "parked but alive"
  for (const w of spinners) w.rotation.x += dt * 0.35;
  crankGroup.rotation.x += dt * 0.35;

  // tiny cartoon bob
  trike.position.y = (trike.userData.baseY !== undefined ? trike.userData.baseY : (trike.userData.baseY = trike.position.y))
    + Math.sin(t * 1.35) * 0.008;

  // lamp gently pulses
  M.lampGlass.emissiveIntensity = 1.35 + Math.sin(t * 2.1) * 0.18;
  lampLight.intensity = 0.78 + Math.sin(t * 2.1) * 0.12;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
