<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classical Marble Bust</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #d8d2c7; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8d2c7);
scene.fog = new THREE.Fog(0xd8d2c7, 8, 18);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.4, 3.3, 7.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.55, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 4.5;
controls.maxDistance = 10;
controls.minPolarAngle = 0.85;
controls.maxPolarAngle = 1.55;

const marble = new THREE.MeshStandardMaterial({
  color: 0xe8e5dc,
  roughness: 0.27,
  metalness: 0.02
});
const marbleLight = new THREE.MeshStandardMaterial({
  color: 0xf1eee6,
  roughness: 0.23,
  metalness: 0.01
});
const marbleShadow = new THREE.MeshStandardMaterial({
  color: 0xc9c5bb,
  roughness: 0.36,
  metalness: 0.01
});
const pupilMaterial = new THREE.MeshStandardMaterial({
  color: 0x161514,
  roughness: 0.32,
  metalness: 0.05
});
const chipMaterial = new THREE.MeshStandardMaterial({
  color: 0x77746d,
  roughness: 0.62,
  metalness: 0
});

function mesh(geometry, material, position, scale, rotation) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(position[0], position[1], position[2]);
  if (scale) object.scale.set(scale[0], scale[1], scale[2]);
  if (rotation) object.rotation.set(rotation[0], rotation[1], rotation[2]);
  object.castShadow = true;
  object.receiveShadow = true;
  scene.add(object);
  return object;
}

function tube(points, radius, material, radialSegments = 8) {
  const curve = new THREE.CatmullRomCurve3(points.map((p) => new THREE.Vector3(p[0], p[1], p[2])));
  const geometry = new THREE.TubeGeometry(curve, 20, radius, radialSegments, false);
  return mesh(geometry, material, [0, 0, 0]);
}

const plinthBase = mesh(new THREE.BoxGeometry(3.15, 0.42, 2.65), marbleShadow, [0, 0.22, 0]);
const plinthBody = mesh(new THREE.BoxGeometry(2.72, 0.72, 2.25), marble, [0, 0.78, 0]);
const plinthTop = mesh(new THREE.BoxGeometry(2.92, 0.16, 2.42), marbleLight, [0, 1.22, 0]);

const torsoProfile = [
  new THREE.Vector2(0.0, 1.25),
  new THREE.Vector2(1.19, 1.25),
  new THREE.Vector2(1.42, 1.38),
  new THREE.Vector2(1.37, 1.58),
  new THREE.Vector2(1.18, 1.82),
  new THREE.Vector2(0.91, 2.04),
  new THREE.Vector2(0.68, 2.24),
  new THREE.Vector2(0.57, 2.48),
  new THREE.Vector2(0.0, 2.48)
];
mesh(new THREE.LatheGeometry(torsoProfile, 64), marble, [0, 0, 0]);

const neckProfile = [
  new THREE.Vector2(0.0, 2.15),
  new THREE.Vector2(0.51, 2.15),
  new THREE.Vector2(0.52, 2.35),
  new THREE.Vector2(0.47, 2.61),
  new THREE.Vector2(0.42, 2.82),
  new THREE.Vector2(0.0, 2.82)
];
mesh(new THREE.LatheGeometry(neckProfile, 48), marble, [0, 0, 0]);

const headProfile = [
  new THREE.Vector2(0.0, 2.42),
  new THREE.Vector2(0.53, 2.42),
  new THREE.Vector2(0.74, 2.57),
  new THREE.Vector2(0.87, 2.88),
  new THREE.Vector2(0.96, 3.29),
  new THREE.Vector2(0.98, 3.71),
  new THREE.Vector2(0.92, 4.10),
  new THREE.Vector2(0.77, 4.42),
  new THREE.Vector2(0.53, 4.64),
  new THREE.Vector2(0.0, 4.72)
];
mesh(new THREE.LatheGeometry(headProfile, 64), marbleLight, [0, 0, 0]);

mesh(new THREE.SphereGeometry(0.98, 48, 32), marbleShadow, [0, 3.62, -0.27], [1.08, 1.19, 0.84]);

const earGeometry = new THREE.SphereGeometry(0.25, 24, 16);
mesh(earGeometry, marble, [-0.91, 3.42, 0.02], [0.52, 1.15, 0.65], [0, 0, -0.12]);
mesh(earGeometry, marble, [0.91, 3.42, 0.02], [0.52, 1.15, 0.65], [0, 0, 0.12]);

const eyeWhiteGeometry = new THREE.SphereGeometry(0.22, 32, 20);
mesh(eyeWhiteGeometry, marbleLight, [-0.34, 3.67, 0.875], [1.0, 0.62, 0.22]);
mesh(eyeWhiteGeometry, marbleLight, [0.34, 3.67, 0.875], [1.0, 0.62, 0.22]);

const eyeRimGeometry = new THREE.TorusGeometry(0.145, 0.026, 8, 24);
mesh(eyeRimGeometry, marbleShadow, [-0.34, 3.67, 0.932], [1.13, 0.78, 1], [0, 0, 0]);
mesh(eyeRimGeometry, marbleShadow, [0.34, 3.67, 0.932], [1.13, 0.78, 1], [0, 0, 0]);

const pupilGeometry = new THREE.CylinderGeometry(0.105, 0.105, 0.035, 24);
mesh(pupilGeometry, pupilMaterial, [-0.34, 3.67, 0.945], [1, 1, 1], [Math.PI / 2, 0, 0]);
mesh(pupilGeometry, pupilMaterial, [0.34, 3.67, 0.945], [1, 1, 1], [Math.PI / 2, 0, 0]);

tube([[-0.62, 3.91, 0.89], [-0.34, 3.98, 0.94], [-0.07, 3.93, 0.89]], 0.045, marbleShadow, 7);
tube([[0.07, 3.93, 0.89], [0.34, 3.98, 0.94], [0.62, 3.91, 0.89]], 0.045, marbleShadow, 7);

const noseBridge = mesh(new THREE.ConeGeometry(0.19, 0.64, 7), marble, [0, 3.32, 0.91], [0.72, 1, 0.85], [0, 0, Math.PI]);
mesh(new THREE.SphereGeometry(0.24, 24, 16), marbleLight, [0, 3.04, 1.055], [0.82, 0.8, 1.08]);
mesh(new THREE.ConeGeometry(0.19, 0.25, 5), marbleShadow, [0.14, 3.03, 1.18], [0.75, 0.75, 0.8], [0, 0.15, 0.25]);

const chipShape = new THREE.Shape();
chipShape.moveTo(0, 0);
chipShape.lineTo(0.16, 0.05);
chipShape.lineTo(0.05, 0.15);
chipShape.closePath();
const chipGeometry = new THREE.ShapeGeometry(chipShape);
const chip = mesh(chipGeometry, chipMaterial, [0.12, 3.08, 1.235], [1, 1, 1], [0, 0, 0]);
chip.rotation.x = -0.08;

tube([[-0.33, 2.84, 0.93], [-0.14, 2.79, 1.01], [0, 2.81, 1.025], [0.14, 2.79, 1.01], [0.33, 2.84, 0.93]], 0.035, marbleShadow, 7);
tube([[-0.28, 2.73, 0.98], [0, 2.68, 1.02], [0.28, 2.73, 0.98]], 0.027, marbleShadow, 7);
mesh(new THREE.SphereGeometry(0.4, 32, 20), marble, [0, 2.58, 0.18], [0.8, 0.48, 0.5]);

tube([[-0.82, 1.63, 0.78], [-0.45, 1.79, 0.88], [-0.12, 1.84, 0.91]], 0.032, marbleShadow, 7);
tube([[0.82, 1.63, 0.78], [0.45, 1.79, 0.88], [0.12, 1.84, 0.91]], 0.032, marbleShadow, 7);

for (let i = 0; i < 11; i++) {
  const angle = Math.PI * (0.16 + i * 0.068);
  const x = Math.cos(angle) * 0.74;
  const y = 4.37 + Math.sin(angle) * 0.28;
  const z = 0.28 + Math.sin(angle) * 0.18;
  const lockPoints = [
    [x * 0.78, y + 0.12, z - 0.03],
    [x * 0.98, y, z + 0.08],
    [x * 1.08, y - 0.16, z + 0.11],
    [x * 1.02, y - 0.29, z + 0.03]
  ];
  tube(lockPoints, 0.095, marbleShadow, 8);
}

for (let i = 0; i < 7; i++) {
  const x = -0.72 + i * 0.24;
  const lockPoints = [
    [x, 4.57 + Math.abs(x) * 0.08, 0.22],
    [x * 1.08, 4.77, 0.12],
    [x * 0.92, 4.88, 0.02],
    [x * 0.8, 4.77, -0.06]
  ];
  tube(lockPoints, 0.105, marbleShadow, 8);
}

for (let i = 0; i < 5; i++) {
  const side = i % 2 === 0 ? -1 : 1;
  const y = 4.02 - i * 0.25;
  const x = side * (0.86 + i * 0.035);
  tube([[x, y + 0.14, 0.1], [x * 1.07, y, 0.2], [x * 1.04, y - 0.18, 0.16]], 0.09, marbleShadow, 8);
}

const floor = mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({
  color: 0xb8b0a4,
  roughness: 0.82,
  metalness: 0
}), [0, 0, 0], [1, 1, 1], [-Math.PI / 2, 0, 0]);
floor.receiveShadow = true;

const hemiLight = new THREE.HemisphereLight(0xf7f1e6, 0x514d48, 2.15);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(0xfff5df, 4.0);
keyLight.position.set(-4.5, 7.5, 5.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.bias = -0.0002;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xbcc9dc, 1.35, 12, 2);
fillLight.position.set(4, 4, 4);
scene.add(fillLight);

const rimLight = new THREE.SpotLight(0xffdcb2, 3.2, 12, Math.PI / 6, 0.5, 1.5);
rimLight.position.set(2.5, 6.5, -3.5);
rimLight.target.position.set(0, 3, 0);
scene.add(rimLight);
scene.add(rimLight.target);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
