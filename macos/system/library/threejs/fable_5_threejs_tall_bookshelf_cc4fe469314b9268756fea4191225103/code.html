<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tall Bookshelf</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1c20; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1c20);
scene.fog = new THREE.Fog(0x1a1c20, 12, 26);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.4, 2.3, 4.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 2.5;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.52;

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xbfd4e6, 0x3a3128, 0.55));

const key = new THREE.DirectionalLight(0xfff1dd, 2.2);
key.position.set(4.5, 6.5, 3.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -3.5;
key.shadow.camera.right = 3.5;
key.shadow.camera.top = 4.5;
key.shadow.camera.bottom = -1.5;
key.shadow.camera.near = 1;
key.shadow.camera.far = 20;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9db8d9, 0.5);
fill.position.set(-5, 3, -2.5);
scene.add(fill);

const rim = new THREE.SpotLight(0xffe8c8, 6, 20, Math.PI / 6, 0.5, 1.5);
rim.position.set(-2.5, 5, 5.5);
rim.target.position.set(0, 1.1, 0);
scene.add(rim, rim.target);

// ---------- Ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 64),
  new THREE.MeshStandardMaterial({ color: 0x2a2d33, roughness: 0.95, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Soft radial contact-shadow disc under the shelf
const shadowCanvas = document.createElement('canvas');
shadowCanvas.width = shadowCanvas.height = 256;
const sctx = shadowCanvas.getContext('2d');
const grad = sctx.createRadialGradient(128, 128, 20, 128, 128, 128);
grad.addColorStop(0, 'rgba(0,0,0,0.42)');
grad.addColorStop(0.6, 'rgba(0,0,0,0.16)');
grad.addColorStop(1, 'rgba(0,0,0,0)');
sctx.fillStyle = grad;
sctx.fillRect(0, 0, 256, 256);
const contactShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(2.6, 1.5),
  new THREE.MeshBasicMaterial({
    map: new THREE.CanvasTexture(shadowCanvas),
    transparent: true,
    depthWrite: false
  })
);
contactShadow.rotation.x = -Math.PI / 2;
contactShadow.position.y = 0.002;
scene.add(contactShadow);

// ---------- Materials ----------
const woodMat = new THREE.MeshStandardMaterial({ color: 0x9a6b45, roughness: 0.62, metalness: 0.03 });
const woodDarkMat = new THREE.MeshStandardMaterial({ color: 0x84573a, roughness: 0.68, metalness: 0.03 });
const backMat = new THREE.MeshStandardMaterial({ color: 0x6e4a30, roughness: 0.85, metalness: 0.0 });
const holeMat = new THREE.MeshStandardMaterial({ color: 0x241509, roughness: 0.9, metalness: 0.0 });

// ---------- Bookshelf dimensions ----------
const W = 1.1;          // outer width
const H = 2.2;          // total height
const D = 0.36;         // outer depth
const T = 0.028;        // board thickness
const BACK_T = 0.008;   // back panel thickness
const BACK_INSET = 0.02;// recess from rear face
const SHELF_COUNT = 5;  // interior shelves (plus top & bottom boards)

const shelf = new THREE.Group();

function board(w, h, d, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// --- Side panels ---
const sideL = board(T, H, D, woodMat);
sideL.position.set(-(W - T) / 2, H / 2, 0);
const sideR = sideL.clone();
sideR.position.x = (W - T) / 2;
shelf.add(sideL, sideR);

const innerW = W - 2 * T;

// --- Top & bottom boards (fixed) ---
const topBoard = board(innerW, T, D, woodMat);
topBoard.position.set(0, H - T / 2, 0);
const bottomBoard = board(innerW, T, D, woodMat);
bottomBoard.position.set(0, 0.06 + T / 2, 0);
shelf.add(topBoard, bottomBoard);

// --- Kick plate below bottom board ---
const kick = board(innerW, 0.06, T, woodDarkMat);
kick.position.set(0, 0.03, D / 2 - T / 2 - 0.02);
shelf.add(kick);

// --- Evenly spaced interior shelves (slightly shallower than sides) ---
const yBot = 0.06 + T;              // top face of bottom board
const yTop = H - T;                 // bottom face of top board
const shelfD = D - BACK_INSET - BACK_T - 0.01;
for (let i = 1; i <= SHELF_COUNT; i++) {
  const y = yBot + (yTop - yBot) * (i / (SHELF_COUNT + 1));
  const s = board(innerW, T, shelfD, woodDarkMat);
  s.position.set(0, y, (D - shelfD) / 2 - BACK_INSET - BACK_T + 0.005);
  shelf.add(s);
}

// --- Recessed thin back panel ---
const back = board(innerW, H - 0.06 - T, BACK_T, backMat);
back.position.set(0, 0.06 + (H - 0.06) / 2, -D / 2 + BACK_INSET + BACK_T / 2);
shelf.add(back);

// --- Shelf-peg holes: two vertical rows per inner side face (instanced) ---
const holeGeo = new THREE.CylinderGeometry(0.006, 0.006, 0.006, 12);
holeGeo.rotateZ(Math.PI / 2); // axis along X so discs face inward
const holeYs = [];
for (let y = yBot + 0.10; y <= yTop - 0.08; y += 0.064) holeYs.push(y);
const holeZs = [D / 2 - 0.06, -D / 2 + BACK_INSET + 0.06];
const holeCount = holeYs.length * holeZs.length * 2;
const holes = new THREE.InstancedMesh(holeGeo, holeMat, holeCount);
const dummy = new THREE.Object3D();
let hi = 0;
for (const sx of [-1, 1]) {
  const x = sx * (innerW / 2 - 0.0004); // just proud of inner face
  for (const z of holeZs) {
    for (const y of holeYs) {
      dummy.position.set(x, y, z);
      dummy.updateMatrix();
      holes.setMatrixAt(hi++, dummy.matrix);
    }
  }
}
shelf.add(holes);

// --- Subtle top trim ---
const trim = board(W + 0.04, 0.022, D + 0.03, woodDarkMat);
trim.position.set(0, H + 0.011, 0);
shelf.add(trim);

scene.add(shelf);

// ---------- Resize / Animate ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
