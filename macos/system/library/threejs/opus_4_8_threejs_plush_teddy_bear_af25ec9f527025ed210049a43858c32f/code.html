<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Plush Teddy Bear</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #131418; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="app"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- Renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

/* ---------- Scene & Camera ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15161a);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.9, 1.7, 4.4);

/* Soft procedural studio environment for gentle PBR reflections (no assets) */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.06).texture;

/* ---------- Lighting: hemisphere + key/fill/rim ---------- */
const hemi = new THREE.HemisphereLight(0xbcd2e0, 0x2a221c, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2df, 2.5);
key.position.set(4.2, 6.2, 4.8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 25;
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 4;
key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0004;
key.shadow.radius = 5;
scene.add(key);

const fill = new THREE.DirectionalLight(0xa9c4e6, 0.6);
fill.position.set(-5, 2.5, 3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9b0, 1.15);
rim.position.set(-3, 4.5, -5.5);
scene.add(rim);

/* ---------- Procedural fuzzy fabric bump texture ---------- */
function makeFuzzTexture() {
  const s = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = 'rgb(128,128,128)';
  ctx.fillRect(0, 0, s, s);
  const img = ctx.getImageData(0, 0, s, s);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = 128 + (Math.random() * 2 - 1) * 55;
    d[i] = d[i + 1] = d[i + 2] = n;
    d[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  // short strokes to suggest brushed fur
  for (let k = 0; k < 2600; k++) {
    const x = Math.random() * s, y = Math.random() * s;
    const len = 2 + Math.random() * 4;
    const ang = -Math.PI / 2 + (Math.random() - 0.5) * 0.7;
    const bright = Math.random() > 0.5;
    ctx.strokeStyle = 'rgba(' + (bright ? '255,255,255,' : '0,0,0,') + (0.10 + Math.random() * 0.18) + ')';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    ctx.stroke();
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3, 3);
  t.anisotropy = 8;
  return t;
}
const fuzz = makeFuzzTexture();

/* ---------- Materials ---------- */
const FUR   = 0xa9713f;
const CREAM = 0xe1c99d;
const PAD   = 0xc79f68;
const NOSE  = 0x2a1d15;
const EYE   = 0x0b0b0d;
const THREAD= 0x5c3d27;
const DARKTHREAD = 0x33241a;

function furMat(color, sheenCol) {
  return new THREE.MeshPhysicalMaterial({
    color: color,
    roughness: 0.95,
    metalness: 0.0,
    sheen: 1.0,
    sheenRoughness: 0.85,
    sheenColor: new THREE.Color(sheenCol || 0xffe4bf),
    bumpMap: fuzz,
    bumpScale: 0.02,
    envMapIntensity: 0.35
  });
}
const matFur   = furMat(FUR);
const matCream = furMat(CREAM, 0xfff2df);
const matPad   = new THREE.MeshStandardMaterial({ color: PAD, roughness: 0.9, metalness: 0.0, bumpMap: fuzz, bumpScale: 0.01, envMapIntensity: 0.4 });
const matNose  = new THREE.MeshPhysicalMaterial({ color: NOSE, roughness: 0.42, metalness: 0.0, clearcoat: 0.5, clearcoatRoughness: 0.5, envMapIntensity: 0.7 });
const matEye   = new THREE.MeshPhysicalMaterial({ color: EYE, roughness: 0.12, metalness: 0.0, clearcoat: 1.0, clearcoatRoughness: 0.08, envMapIntensity: 1.3 });
const matThread= new THREE.MeshStandardMaterial({ color: THREAD, roughness: 0.7, metalness: 0.0, envMapIntensity: 0.4 });
const matStitch= new THREE.MeshStandardMaterial({ color: DARKTHREAD, roughness: 0.6, metalness: 0.0, envMapIntensity: 0.5 });

/* ---------- Plush deformation: gentle stuffing bulges ---------- */
function plushify(geo, amp) {
  geo.computeVertexNormals();
  const pos = geo.attributes.position;
  const nor = geo.attributes.normal;
  const v = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    n.fromBufferAttribute(nor, i);
    const d = amp * (
      Math.sin(v.x * 2.6 + 0.6) * Math.cos(v.y * 2.3 - 0.4) * 0.6 +
      Math.sin(v.z * 2.9 - 0.5) * Math.cos(v.x * 2.1 + 0.3) * 0.4 +
      Math.sin((v.x + v.y + v.z) * 1.7) * 0.3
    );
    v.addScaledVector(n, d);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

function sphere(r, seg, mat, amp) {
  const geo = new THREE.SphereGeometry(r, seg, seg);
  plushify(geo, amp === undefined ? r * 0.06 : amp);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

/* ---------- Stitched seam (perpendicular dash marks along a curve) ---------- */
function stitchLine(pts, opts) {
  opts = opts || {};
  const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], p[1], p[2])));
  const N = opts.count || 14;
  const g = new THREE.Group();
  const center = new THREE.Vector3(...(opts.center || [0, 0, 0]));
  const stitchGeo = new THREE.CapsuleGeometry(opts.r || 0.012, opts.len || 0.05, 2, 6);
  const up = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < N; i++) {
    const t = (i + 0.5) / N;
    const p = curve.getPointAt(t);
    const tan = curve.getTangentAt(t).normalize();
    const nrm = p.clone().sub(center).normalize();
    const bin = new THREE.Vector3().crossVectors(tan, nrm).normalize();
    const m = new THREE.Mesh(stitchGeo, opts.mat || matStitch);
    m.position.copy(p).addScaledVector(nrm, 0.006);
    m.quaternion.setFromUnitVectors(up, bin);
    m.castShadow = true;
    g.add(m);
  }
  return g;
}

/* ---------- Thin thread tube (nose stitch / mouth) ---------- */
function threadTube(pts, r, mat) {
  const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], p[1], p[2])));
  const geo = new THREE.TubeGeometry(curve, 42, r, 6, false);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  return m;
}

/* ---------- Build the bear ---------- */
const bear = new THREE.Group();

/* Body */
const body = sphere(0.8, 48, matFur, 0.05);
body.scale.set(1.02, 1.18, 0.98);
body.position.set(0, 0.92, 0);
bear.add(body);

/* Belly patch (lighter sewn-on fabric) */
const belly = sphere(0.45, 36, matCream, 0.02);
belly.scale.set(1.0, 1.25, 0.5);
belly.position.set(0, 0.82, 0.6);
bear.add(belly);
bear.add(stitchLine(
  Array.from({ length: 15 }, (_, i) => {
    const th = (i / 15) * Math.PI * 2;
    return [0.42 * Math.cos(th), 0.82 + 0.52 * Math.sin(th), 0.72];
  }),
  { center: [0, 0.92, 0], count: 15, r: 0.008, len: 0.035, mat: matThread }
));

/* Head */
const head = sphere(0.62, 48, matFur, 0.04);
head.scale.set(1.06, 1.0, 1.02);
head.position.set(0, 1.98, 0.02);
bear.add(head);

/* Ears */
for (const sx of [-1, 1]) {
  const ear = sphere(0.24, 32, matFur, 0.02);
  ear.scale.set(1, 1, 0.62);
  ear.position.set(sx * 0.42, 2.42, 0.02);
  bear.add(ear);
  const inner = sphere(0.15, 24, matCream, 0.008);
  inner.scale.set(1, 1, 0.42);
  inner.position.set(sx * 0.42, 2.42, 0.14);
  bear.add(inner);
}

/* Muzzle */
const muzzle = sphere(0.30, 40, matCream, 0.02);
muzzle.scale.set(1.15, 0.82, 1.0);
muzzle.position.set(0, 1.84, 0.6);
bear.add(muzzle);

/* Nose */
const nose = sphere(0.11, 28, matNose, 0.006);
nose.scale.set(1.25, 0.85, 0.8);
nose.position.set(0, 1.92, 0.86);
bear.add(nose);

/* Mouth (stitched inverted Y) */
bear.add(threadTube([[0, 1.85, 0.86], [0, 1.79, 0.845], [0, 1.755, 0.83]], 0.011, matNose));
bear.add(threadTube([[0, 1.755, 0.83], [-0.06, 1.735, 0.815], [-0.11, 1.735, 0.79]], 0.011, matNose));
bear.add(threadTube([[0, 1.755, 0.83], [0.06, 1.735, 0.815], [0.11, 1.735, 0.79]], 0.011, matNose));

/* Button eyes with cross thread */
for (const sx of [-1, 1]) {
  const eye = sphere(0.085, 26, matEye, 0.004);
  eye.scale.set(1, 1, 0.75);
  eye.position.set(sx * 0.22, 2.12, 0.53);
  bear.add(eye);
  // thread cross through the button
  bear.add(threadTube([[sx * 0.22 - 0.05, 2.12, 0.6], [sx * 0.22 + 0.05, 2.12, 0.6]], 0.006, matThread));
  bear.add(threadTube([[sx * 0.22, 2.17, 0.6], [sx * 0.22, 2.07, 0.6]], 0.006, matThread));
}

/* Face center seam */
const headC = [0, 1.98, 0.02], hr = 0.635;
bear.add(stitchLine(
  Array.from({ length: 9 }, (_, i) => {
    const a = 0.16 * Math.PI + (0.34 * Math.PI) * (i / 8);
    return [0, headC[1] + hr * Math.cos(a), headC[2] + hr * Math.sin(a)];
  }),
  { center: headC, count: 11, r: 0.011, len: 0.05, mat: matStitch }
));

/* Center-back seam (head + body) */
bear.add(stitchLine(
  Array.from({ length: 10 }, (_, i) => {
    const a = 0.12 * Math.PI + (0.78 * Math.PI) * (i / 9);
    return [0, headC[1] + hr * Math.cos(a), headC[2] - hr * Math.sin(a)];
  }),
  { center: headC, count: 12, r: 0.011, len: 0.05, mat: matStitch }
));
bear.add(stitchLine(
  Array.from({ length: 11 }, (_, i) => {
    const a = 0.08 * Math.PI + (0.84 * Math.PI) * (i / 10);
    return [0, 0.92 + 0.98 * Math.cos(a), -0.82 * Math.sin(a)];
  }),
  { center: [0, 0.92, 0], count: 14, r: 0.011, len: 0.05, mat: matStitch }
));

/* Arms */
function makeArm(side) {
  const g = new THREE.Group();
  const geo = new THREE.CapsuleGeometry(0.2, 0.42, 8, 22);
  plushify(geo, 0.02);
  const arm = new THREE.Mesh(geo, matFur);
  arm.castShadow = arm.receiveShadow = true;
  g.add(arm);
  const pad = sphere(0.12, 22, matPad, 0.008);
  pad.scale.set(0.85, 0.5, 0.9);
  pad.position.set(0, -0.34, 0.07);
  g.add(pad);
  g.position.set(side * 0.72, 1.24, 0.18);
  g.rotation.set(-0.5, 0, side * 0.34);
  return g;
}
bear.add(makeArm(-1));
bear.add(makeArm(1));

/* Legs (sitting, extended forward) */
function makeLeg(side) {
  const g = new THREE.Group();
  const geo = new THREE.CapsuleGeometry(0.28, 0.36, 8, 22);
  plushify(geo, 0.025);
  const leg = new THREE.Mesh(geo, matFur);
  leg.castShadow = leg.receiveShadow = true;
  g.add(leg);
  // sole pad (faces forward once leg is rotated)
  const pad = sphere(0.2, 24, matPad, 0.01);
  pad.scale.set(0.72, 0.34, 0.82);
  pad.position.set(0, 0.5, 0.0);
  g.add(pad);
  // toe stitches
  for (const dx of [-0.075, 0, 0.075]) {
    const t = new THREE.Mesh(new THREE.CapsuleGeometry(0.008, 0.035, 2, 6), matStitch);
    t.position.set(dx, 0.58, 0.08);
    t.rotation.x = Math.PI / 2;
    t.castShadow = true;
    g.add(t);
  }
  g.position.set(side * 0.42, 0.5, 0.06);
  g.rotation.set(1.5, 0, side * -0.05);
  return g;
}
bear.add(makeLeg(-1));
bear.add(makeLeg(1));

/* Little tail */
const tail = sphere(0.13, 24, matFur, 0.01);
tail.position.set(0, 0.62, -0.8);
bear.add(tail);

scene.add(bear);

/* ---------- Center the object & seat it on the ground ---------- */
const box = new THREE.Box3().setFromObject(bear);
const center = box.getCenter(new THREE.Vector3());
bear.position.set(-center.x, -center.y, -center.z);
const size = box.getSize(new THREE.Vector3());
const groundY = -size.y / 2;

/* Shadow-only ground plane */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.38 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = groundY + 0.002;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- Controls ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 2.5;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 0.05, 0);
controls.update();

/* ---------- Resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

/* ---------- Render loop ---------- */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
