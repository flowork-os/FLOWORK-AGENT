<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archaeological Mound</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #b8c0b6; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8c1b8);
scene.fog = new THREE.FogExp2(0xb8c1b8, 0.015);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 180);
camera.position.set(24, 16, 27);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;
controls.minDistance = 13;
controls.maxDistance = 65;
controls.maxPolarAngle = Math.PI * 0.47;

const hemiLight = new THREE.HemisphereLight(0xdde5df, 0x665b46, 1.65);
scene.add(hemiLight);

const sun = new THREE.DirectionalLight(0xfff2d5, 3.2);
sun.position.set(-16, 24, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -28;
sun.shadow.camera.right = 28;
sun.shadow.camera.top = 25;
sun.shadow.camera.bottom = -25;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 70;
sun.shadow.bias = -0.00015;
sun.shadow.normalBias = 0.025;
scene.add(sun);

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x706e54,
  roughness: 1,
  metalness: 0
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(64, 64), groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.035;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(64, 64, 0x4c5143, 0x5c604e);
grid.position.y = -0.018;
grid.material.transparent = true;
grid.material.opacity = 0.16;
grid.material.depthWrite = false;
scene.add(grid);

function hashNoise(x, z) {
  const value = Math.sin(x * 127.1 + z * 311.7) * 43758.5453123;
  return value - Math.floor(value);
}

function smoothNoise(x, z) {
  const ix = Math.floor(x);
  const iz = Math.floor(z);
  const fx = x - ix;
  const fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx);
  const uz = fz * fz * (3 - 2 * fz);
  const a = hashNoise(ix, iz);
  const b = hashNoise(ix + 1, iz);
  const c = hashNoise(ix, iz + 1);
  const d = hashNoise(ix + 1, iz + 1);
  return THREE.MathUtils.lerp(
    THREE.MathUtils.lerp(a, b, ux),
    THREE.MathUtils.lerp(c, d, ux),
    uz
  );
}

const moundRadiusX = 12.5;
const moundRadiusZ = 9.2;
const moundHeight = 3.35;

function moundElevation(x, z) {
  const nx = x / moundRadiusX;
  const nz = z / moundRadiusZ;
  const radial = Math.sqrt(nx * nx + nz * nz);
  if (radial >= 1) return 0;
  const profile = Math.pow(Math.max(0, 1 - Math.pow(radial, 1.72)), 1.22);
  const broadIrregularity =
    (smoothNoise(x * 0.19 + 8.2, z * 0.19 - 3.7) - 0.5) * 0.30 +
    (smoothNoise(x * 0.47 - 4.1, z * 0.47 + 9.6) - 0.5) * 0.09;
  const summitDip = -0.10 * Math.exp(-((x + 0.7) ** 2 + (z - 0.25) ** 2) / 7);
  return Math.max(0, moundHeight * profile + broadIrregularity * Math.sin(Math.PI * radial) + summitDip);
}

function edgeScale(angle) {
  return 1 +
    0.022 * Math.sin(angle * 3 + 0.6) +
    0.014 * Math.sin(angle * 7 - 1.1) +
    0.008 * Math.sin(angle * 13 + 2.2);
}

function createMoundGeometry() {
  const radialSegments = 44;
  const angularSegments = 160;
  const positions = [];
  const colors = [];
  const indices = [];
  const earthLow = new THREE.Color(0x756847);
  const earthHigh = new THREE.Color(0x887653);
  const earthPatch = new THREE.Color(0x676347);

  positions.push(0, moundElevation(0, 0), 0);
  colors.push(earthHigh.r, earthHigh.g, earthHigh.b);

  for (let ring = 1; ring <= radialSegments; ring++) {
    const u = ring / radialSegments;
    for (let segment = 0; segment < angularSegments; segment++) {
      const angle = segment / angularSegments * Math.PI * 2;
      const boundary = edgeScale(angle);
      const x = moundRadiusX * u * boundary * Math.cos(angle);
      const z = moundRadiusZ * u * boundary * Math.sin(angle);
      const y = moundElevation(x, z);
      positions.push(x, y, z);

      const heightMix = THREE.MathUtils.clamp(y / moundHeight, 0, 1);
      const patch = smoothNoise(x * 0.33 + 20, z * 0.33 - 11);
      const color = earthLow.clone().lerp(earthHigh, heightMix * 0.72);
      if (patch > 0.62) color.lerp(earthPatch, (patch - 0.62) * 0.8);
      color.offsetHSL(0, 0, (smoothNoise(x * 0.91, z * 0.91) - 0.5) * 0.055);
      colors.push(color.r, color.g, color.b);
    }
  }

  for (let segment = 0; segment < angularSegments; segment++) {
    indices.push(0, 1 + segment, 1 + (segment + 1) % angularSegments);
  }

  for (let ring = 1; ring < radialSegments; ring++) {
    const innerStart = 1 + (ring - 1) * angularSegments;
    const outerStart = 1 + ring * angularSegments;
    for (let segment = 0; segment < angularSegments; segment++) {
      const next = (segment + 1) % angularSegments;
      const a = innerStart + segment;
      const b = outerStart + segment;
      const c = outerStart + next;
      const d = innerStart + next;
      indices.push(a, b, d, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  return geometry;
}

const moundMaterial = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.97,
  metalness: 0
});
const mound = new THREE.Mesh(createMoundGeometry(), moundMaterial);
mound.castShadow = true;
mound.receiveShadow = true;
scene.add(mound);

function createPath(angle, curveAmount, width, innerRadius) {
  const steps = 54;
  const positions = [];
  const colors = [];
  const indices = [];
  const pathColorA = new THREE.Color(0x9a8661);
  const pathColorB = new THREE.Color(0x7e6b4c);

  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const radial = THREE.MathUtils.lerp(innerRadius, 1.03, t);
    const bend = curveAmount * Math.sin(t * Math.PI) + 0.035 * Math.sin(t * Math.PI * 2);
    const theta = angle + bend;
    const centerX = Math.cos(theta) * moundRadiusX * radial;
    const centerZ = Math.sin(theta) * moundRadiusZ * radial;
    const tangentTheta = theta + Math.PI / 2;
    const halfWidth = width * (0.72 + 0.28 * t) * 0.5;
    const sideX = Math.cos(tangentTheta) * halfWidth;
    const sideZ = Math.sin(tangentTheta) * halfWidth;

    for (const side of [-1, 1]) {
      const x = centerX + sideX * side;
      const z = centerZ + sideZ * side;
      const y = moundElevation(x, z) + 0.045;
      positions.push(x, y, z);
      const variation = smoothNoise(x * 1.3 + 5, z * 1.3 - 2);
      const color = pathColorA.clone().lerp(pathColorB, variation * 0.48);
      colors.push(color.r, color.g, color.b);
    }
  }

  for (let i = 0; i < steps; i++) {
    const a = i * 2;
    const b = a + 1;
    const c = a + 2;
    const d = a + 3;
    indices.push(a, c, b, c, d, b);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const material = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 1,
    polygonOffset: true,
    polygonOffsetFactor: -1,
    polygonOffsetUnits: -1
  });
  const path = new THREE.Mesh(geometry, material);
  path.receiveShadow = true;
  scene.add(path);
}

createPath(-0.52, 0.19, 1.15, 0.10);
createPath(2.48, -0.22, 0.92, 0.22);

const stoneMaterial = new THREE.MeshStandardMaterial({
  color: 0x777263,
  roughness: 0.96
});

function addStone(x, z, scale, rotation) {
  const geometry = new THREE.DodecahedronGeometry(scale, 1);
  const position = geometry.attributes.position;
  for (let i = 0; i < position.count; i++) {
    position.setXYZ(
      i,
      position.getX(i) * (0.85 + 0.12 * smoothNoise(i, 2)),
      position.getY(i) * 0.62,
      position.getZ(i) * (0.82 + 0.10 * smoothNoise(i, 7))
    );
  }
  geometry.computeVertexNormals();
  const stone = new THREE.Mesh(geometry, stoneMaterial);
  stone.position.set(x, moundElevation(x, z) + scale * 0.22, z);
  stone.rotation.set(0.18, rotation, -0.08);
  stone.castShadow = true;
  stone.receiveShadow = true;
  scene.add(stone);
}

addStone(-8.2, 4.9, 0.33, 0.5);
addStone(7.4, 4.4, 0.28, 1.7);
addStone(9.5, -2.4, 0.22, 0.2);
addStone(-5.8, -6.1, 0.25, 2.2);
addStone(2.8, 7.3, 0.19, 0.8);

const postWoodMaterial = new THREE.MeshStandardMaterial({
  color: 0x5c4630,
  roughness: 0.88
});
const postBandMaterial = new THREE.MeshStandardMaterial({
  color: 0xd4cfb2,
  roughness: 0.72
});
const postTipMaterial = new THREE.MeshStandardMaterial({
  color: 0x493723,
  roughness: 0.9
});

function addMarkerPost(x, z, height, leanX, leanZ) {
  const groundY = moundElevation(x, z);
  const group = new THREE.Group();
  group.position.set(x, groundY, z);
  group.rotation.x = leanX;
  group.rotation.z = leanZ;

  const shaft = new THREE.Mesh(
    new THREE.CylinderGeometry(0.055, 0.073, height, 10),
    postWoodMaterial
  );
  shaft.position.y = height * 0.5;
  shaft.castShadow = true;
  shaft.receiveShadow = true;
  group.add(shaft);

  const band = new THREE.Mesh(
    new THREE.CylinderGeometry(0.061, 0.061, 0.16, 10),
    postBandMaterial
  );
  band.position.y = height * 0.77;
  band.castShadow = true;
  group.add(band);

  const tip = new THREE.Mesh(
    new THREE.ConeGeometry(0.073, 0.18, 10),
    postTipMaterial
  );
  tip.position.y = height + 0.09;
  tip.castShadow = true;
  group.add(tip);

  scene.add(group);
}

addMarkerPost(-1.7, 0.55, 1.25, 0.012, -0.018);
addMarkerPost(1.55, -0.35, 1.38, -0.015, 0.012);
addMarkerPost(0.35, 1.65, 1.18, 0.018, 0.008);
addMarkerPost(2.45, 1.15, 1.30, -0.01, -0.016);

const grassMaterial = new THREE.MeshStandardMaterial({
  color: 0x696b45,
  roughness: 1,
  side: THREE.DoubleSide
});
const grassGeometry = new THREE.ConeGeometry(0.05, 0.42, 3);

for (let i = 0; i < 52; i++) {
  const angle = i * 2.399963 + smoothNoise(i, 4) * 0.45;
  const radial = 0.56 + smoothNoise(i, 9) * 0.47;
  const x = Math.cos(angle) * moundRadiusX * radial;
  const z = Math.sin(angle) * moundRadiusZ * radial;
  if (Math.abs(Math.sin(angle + 0.52)) < 0.11 || Math.abs(Math.sin(angle - 2.48)) < 0.09) continue;
  const blade = new THREE.Mesh(grassGeometry, grassMaterial);
  const scale = 0.58 + smoothNoise(i, 13) * 0.75;
  blade.scale.set(scale, scale, scale);
  blade.position.set(x, moundElevation(x, z) + 0.1 * scale, z);
  blade.rotation.set(
    (smoothNoise(i, 17) - 0.5) * 0.35,
    angle,
    (smoothNoise(i, 21) - 0.5) * 0.3
  );
  blade.castShadow = true;
  scene.add(blade);
}

const horizonRing = new THREE.Mesh(
  new THREE.RingGeometry(31.5, 66, 96),
  new THREE.MeshStandardMaterial({
    color: 0x65664f,
    roughness: 1,
    side: THREE.DoubleSide
  })
);
horizonRing.rotation.x = -Math.PI / 2;
horizonRing.position.y = -0.045;
horizonRing.receiveShadow = true;
scene.add(horizonRing);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
