<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Construction Worker</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #b9c7d0; }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9c7d0);
scene.fog = new THREE.Fog(0xb9c7d0, 7, 15);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 50);
camera.position.set(4.2, 2.8, 5.7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.25, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 3.2;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.49;

const hemi = new THREE.HemisphereLight(0xe8f4ff, 0x596054, 2.2);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff3dd, 4.3);
keyLight.position.set(4, 7, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -4;
keyLight.shadow.camera.right = 4;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 16;
keyLight.shadow.bias = -0.00025;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x8fc5ff, 1.4);
rimLight.position.set(-5, 4, -4);
scene.add(rimLight);

const materials = {
  skin: new THREE.MeshStandardMaterial({ color: 0xb97850, roughness: 0.72 }),
  skinLight: new THREE.MeshStandardMaterial({ color: 0xc9875e, roughness: 0.7 }),
  hair: new THREE.MeshStandardMaterial({ color: 0x30251f, roughness: 0.95 }),
  eye: new THREE.MeshStandardMaterial({ color: 0x20252a, roughness: 0.45 }),
  white: new THREE.MeshStandardMaterial({ color: 0xf2eee5, roughness: 0.55 }),
  shirt: new THREE.MeshStandardMaterial({ color: 0x294b69, roughness: 0.82 }),
  shirtDark: new THREE.MeshStandardMaterial({ color: 0x172b3d, roughness: 0.88 }),
  vest: new THREE.MeshStandardMaterial({ color: 0xd8ea22, roughness: 0.68 }),
  vestEdge: new THREE.MeshStandardMaterial({ color: 0x9ca90e, roughness: 0.75 }),
  reflective: new THREE.MeshStandardMaterial({
    color: 0xe5e9d7,
    roughness: 0.28,
    metalness: 0.12,
    emissive: 0xa8b49b,
    emissiveIntensity: 0.22
  }),
  pants: new THREE.MeshStandardMaterial({ color: 0x3e4b52, roughness: 0.92 }),
  pantsDark: new THREE.MeshStandardMaterial({ color: 0x273137, roughness: 0.96 }),
  boot: new THREE.MeshStandardMaterial({ color: 0x342d27, roughness: 0.86 }),
  sole: new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.98 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x50545a, roughness: 0.48, metalness: 0.52 }),
  helmet: new THREE.MeshStandardMaterial({ color: 0xf2b705, roughness: 0.42 }),
  helmetDark: new THREE.MeshStandardMaterial({ color: 0xd28e00, roughness: 0.56 }),
  buckle: new THREE.MeshStandardMaterial({ color: 0x202327, roughness: 0.35, metalness: 0.45 })
};

function mesh(geometry, material, parent, position, rotation = [0, 0, 0], scale = [1, 1, 1]) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(position[0], position[1], position[2]);
  object.rotation.set(rotation[0], rotation[1], rotation[2]);
  object.scale.set(scale[0], scale[1], scale[2]);
  object.castShadow = true;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}

function box(parent, size, position, material, rotation = [0, 0, 0]) {
  return mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material, parent, position, rotation);
}

function sphere(parent, radius, position, material, scale = [1, 1, 1], segments = 24) {
  return mesh(new THREE.SphereGeometry(radius, segments, Math.max(12, segments / 2)), material, parent, position, [0, 0, 0], scale);
}

function limb(parent, start, end, topRadius, bottomRadius, material) {
  const a = new THREE.Vector3(start[0], start[1], start[2]);
  const b = new THREE.Vector3(end[0], end[1], end[2]);
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(topRadius, bottomRadius, length, 20, 1, false);
  const object = new THREE.Mesh(geometry, material);
  object.position.copy(a).add(b).multiplyScalar(0.5);
  object.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  object.castShadow = true;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}

const worker = new THREE.Group();
worker.rotation.y = -0.08;
scene.add(worker);

const pelvis = new THREE.Group();
worker.add(pelvis);

box(pelvis, [0.63, 0.25, 0.38], [0, 1.08, 0], materials.pants);
box(pelvis, [0.66, 0.075, 0.4], [0, 1.185, 0], materials.pantsDark);
box(pelvis, [0.12, 0.075, 0.035], [0, 1.185, 0.215], materials.buckle);

const leftHip = [-0.19, 1.04, 0];
const leftKnee = [-0.22, 0.65, 0.018];
const leftAnkle = [-0.23, 0.27, 0.02];
limb(worker, leftHip, leftKnee, 0.165, 0.145, materials.pants);
limb(worker, leftKnee, leftAnkle, 0.145, 0.105, materials.pants);
sphere(worker, 0.145, leftKnee, materials.pants, [1, 0.85, 1]);

const rightHip = [0.19, 1.04, 0];
const rightKnee = [0.25, 0.66, -0.018];
const rightAnkle = [0.29, 0.27, -0.03];
limb(worker, rightHip, rightKnee, 0.165, 0.145, materials.pants);
limb(worker, rightKnee, rightAnkle, 0.145, 0.105, materials.pants);
sphere(worker, 0.145, rightKnee, materials.pants, [1, 0.85, 1]);

box(worker, [0.18, 0.24, 0.045], [-0.225, 0.72, 0.145], materials.pantsDark, [0.04, 0, 0]);
box(worker, [0.18, 0.24, 0.045], [0.245, 0.73, 0.125], materials.pantsDark, [0.04, 0, 0]);

function createBoot(position, yaw) {
  const bootGroup = new THREE.Group();
  bootGroup.position.set(position[0], position[1], position[2]);
  bootGroup.rotation.y = yaw;
  worker.add(bootGroup);

  box(bootGroup, [0.27, 0.23, 0.34], [0, 0.13, 0.04], materials.boot);
  box(bootGroup, [0.3, 0.07, 0.48], [0, 0.035, 0.09], materials.sole);
  sphere(bootGroup, 0.16, [0, 0.13, 0.23], materials.boot, [0.91, 0.64, 1.22]);
  mesh(
    new THREE.SphereGeometry(0.162, 24, 12, 0, Math.PI * 2, 0, Math.PI * 0.48),
    materials.steel,
    bootGroup,
    [0, 0.13, 0.265],
    [Math.PI / 2, 0, 0],
    [0.88, 0.55, 0.62]
  );
  box(bootGroup, [0.19, 0.018, 0.19], [0, 0.205, 0.075], materials.sole, [0.34, 0, 0]);
  box(bootGroup, [0.19, 0.018, 0.19], [0, 0.205, 0.14], materials.sole, [0.34, 0, 0]);
}

createBoot([-0.23, 0, 0.035], -0.08);
createBoot([0.29, 0, -0.015], 0.12);

const torso = new THREE.Group();
worker.add(torso);

mesh(new THREE.CylinderGeometry(0.31, 0.36, 0.61, 24), materials.shirt, torso, [0, 1.49, 0], [0, 0, 0], [1, 1, 0.72]);
sphere(torso, 0.31, [0, 1.73, 0], materials.shirt, [1.08, 0.58, 0.76]);

const vestFrontZ = 0.238;
box(torso, [0.27, 0.52, 0.038], [-0.16, 1.48, vestFrontZ], materials.vest, [0, 0, -0.035]);
box(torso, [0.27, 0.52, 0.038], [0.16, 1.48, vestFrontZ], materials.vest, [0, 0, 0.035]);
box(torso, [0.055, 0.54, 0.045], [0, 1.455, vestFrontZ + 0.006], materials.vestEdge);
box(torso, [0.57, 0.055, 0.048], [0, 1.38, vestFrontZ + 0.012], materials.reflective);
box(torso, [0.57, 0.055, 0.048], [0, 1.53, vestFrontZ + 0.012], materials.reflective);
box(torso, [0.052, 0.33, 0.05], [-0.19, 1.61, vestFrontZ + 0.014], materials.reflective, [0, 0, -0.13]);
box(torso, [0.052, 0.33, 0.05], [0.19, 1.61, vestFrontZ + 0.014], materials.reflective, [0, 0, 0.13]);

box(torso, [0.54, 0.48, 0.035], [0, 1.49, -0.235], materials.vest);
box(torso, [0.54, 0.055, 0.045], [0, 1.39, -0.258], materials.reflective);
box(torso, [0.54, 0.055, 0.045], [0, 1.54, -0.258], materials.reflective);
box(torso, [0.055, 0.37, 0.045], [-0.17, 1.57, -0.258], materials.reflective, [0, 0, -0.1]);
box(torso, [0.055, 0.37, 0.045], [0.17, 1.57, -0.258], materials.reflective, [0, 0, 0.1]);

const neckOpening = new THREE.Shape();
neckOpening.moveTo(-0.13, 0.1);
neckOpening.lineTo(0.13, 0.1);
neckOpening.lineTo(0, -0.13);
neckOpening.closePath();
const neckInsert = mesh(
  new THREE.ShapeGeometry(neckOpening),
  materials.shirtDark,
  torso,
  [0, 1.705, vestFrontZ + 0.034]
);
neckInsert.castShadow = false;

box(torso, [0.13, 0.16, 0.05], [0.16, 1.31, vestFrontZ + 0.035], materials.vestEdge);
box(torso, [0.09, 0.022, 0.055], [0.16, 1.36, vestFrontZ + 0.065], materials.reflective);

const leftShoulder = [-0.38, 1.68, 0];
const leftElbow = [-0.48, 1.31, 0.035];
const leftWrist = [-0.43, 0.99, 0.13];
sphere(worker, 0.17, leftShoulder, materials.shirt, [1, 0.9, 0.9]);
limb(worker, leftShoulder, leftElbow, 0.14, 0.12, materials.shirt);
sphere(worker, 0.115, leftElbow, materials.shirt, [1, 0.9, 1]);
limb(worker, leftElbow, leftWrist, 0.105, 0.085, materials.skin);
sphere(worker, 0.095, [-0.425, 0.915, 0.15], materials.skin, [0.82, 1.25, 0.72]);
box(worker, [0.13, 0.05, 0.16], [-0.43, 1.015, 0.12], materials.shirtDark);

const rightShoulder = [0.38, 1.68, 0];
const rightElbow = [0.49, 1.34, -0.045];
const rightWrist = [0.46, 1.02, -0.02];
sphere(worker, 0.17, rightShoulder, materials.shirt, [1, 0.9, 0.9]);
limb(worker, rightShoulder, rightElbow, 0.14, 0.12, materials.shirt);
sphere(worker, 0.115, rightElbow, materials.shirt, [1, 0.9, 1]);
limb(worker, rightElbow, rightWrist, 0.105, 0.085, materials.skin);
sphere(worker, 0.095, [0.46, 0.94, 0], materials.skin, [0.82, 1.25, 0.72]);
box(worker, [0.13, 0.05, 0.16], [0.465, 1.045, -0.015], materials.shirtDark);

mesh(new THREE.CylinderGeometry(0.105, 0.12, 0.18, 20), materials.skin, worker, [0, 1.86, 0]);

const head = new THREE.Group();
head.position.set(0, 2.08, 0.015);
worker.add(head);

sphere(head, 0.235, [0, 0, 0], materials.skinLight, [0.88, 1.12, 0.9], 32);
sphere(head, 0.052, [-0.22, 0.01, 0], materials.skin, [0.55, 1.05, 0.65]);
sphere(head, 0.052, [0.22, 0.01, 0], materials.skin, [0.55, 1.05, 0.65]);
sphere(head, 0.058, [0, 0.005, 0.224], materials.skin, [0.68, 1.0, 0.75]);

sphere(head, 0.025, [-0.085, 0.065, 0.214], materials.white, [1.3, 0.58, 0.42], 16);
sphere(head, 0.025, [0.085, 0.065, 0.214], materials.white, [1.3, 0.58, 0.42], 16);
sphere(head, 0.012, [-0.085, 0.065, 0.228], materials.eye, [1, 1, 0.6], 12);
sphere(head, 0.012, [0.085, 0.065, 0.228], materials.eye, [1, 1, 0.6], 12);

box(head, [0.092, 0.016, 0.018], [-0.087, 0.116, 0.214], materials.hair, [0, 0, -0.08]);
box(head, [0.092, 0.016, 0.018], [0.087, 0.116, 0.214], materials.hair, [0, 0, 0.08]);

mesh(
  new THREE.TorusGeometry(0.052, 0.008, 8, 24, Math.PI),
  materials.hair,
  head,
  [0, -0.105, 0.224],
  [0, 0, Math.PI]
);

sphere(head, 0.19, [0, 0.105, -0.015], materials.hair, [0.91, 0.72, 0.86], 24);

const helmet = new THREE.Group();
helmet.position.set(0, 0.21, -0.005);
head.add(helmet);

mesh(
  new THREE.SphereGeometry(0.29, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2),
  materials.helmet,
  helmet,
  [0, 0, 0],
  [0, 0, 0],
  [1, 0.76, 0.92]
);
mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.045, 32), materials.helmet, helmet, [0, 0, 0], [0, 0, 0], [1, 1, 0.84]);
box(helmet, [0.075, 0.045, 0.29], [0, 0.19, -0.01], materials.helmetDark);
box(helmet, [0.045, 0.035, 0.25], [-0.12, 0.14, -0.01], materials.helmetDark, [0, 0, -0.17]);
box(helmet, [0.045, 0.035, 0.25], [0.12, 0.14, -0.01], materials.helmetDark, [0, 0, 0.17]);
box(helmet, [0.44, 0.05, 0.055], [0, 0.02, 0.255], materials.helmet);
box(helmet, [0.5, 0.035, 0.045], [0, -0.005, 0.28], materials.helmetDark);

const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x747d78, roughness: 0.94 });
const ground = mesh(new THREE.CircleGeometry(6.5, 80), groundMaterial, scene, [0, -0.045, 0], [-Math.PI / 2, 0, 0]);
ground.receiveShadow = true;
ground.castShadow = false;

const pad = mesh(
  new THREE.CylinderGeometry(1.4, 1.48, 0.12, 64),
  new THREE.MeshStandardMaterial({ color: 0xa8aea8, roughness: 0.88 }),
  scene,
  [0, -0.02, 0]
);
pad.receiveShadow = true;
pad.castShadow = false;

const grid = new THREE.GridHelper(13, 26, 0x77817b, 0x909994);
grid.position.y = 0.018;
grid.material.transparent = true;
grid.material.opacity = 0.24;
scene.add(grid);

const shadowDisc = mesh(
  new THREE.CircleGeometry(0.85, 48),
  new THREE.MeshBasicMaterial({ color: 0x222a27, transparent: true, opacity: 0.12, depthWrite: false }),
  scene,
  [0, 0.025, 0.06],
  [-Math.PI / 2, 0, 0]
);
shadowDisc.castShadow = false;
shadowDisc.receiveShadow = false;

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  worker.position.y = Math.sin(time * 1.25) * 0.004;
  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
