<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal Seahorse</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050817; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050817);
scene.fog = new THREE.FogExp2(0x050817, 0.055);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.6, 1.3, 7.8);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 4;
controls.maxDistance = 12;
controls.target.set(0, 0.2, 0);

const ambient = new THREE.HemisphereLight(0x9ab8ff, 0x10132e, 1.8);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xb9d8ff, 4.5);
key.position.set(-4, 6, 5);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
scene.add(key);

const rim = new THREE.PointLight(0x7c5cff, 15, 8, 2);
rim.position.set(3, 1.8, -2.5);
scene.add(rim);

const rainbow = new THREE.PointLight(0xff72ce, 11, 7, 2);
rainbow.position.set(-2.5, -1.2, 3);
scene.add(rainbow);

const crystal = new THREE.MeshPhysicalMaterial({
  color: 0xd8ecff,
  metalness: 0.08,
  roughness: 0.08,
  transmission: 0.88,
  thickness: 0.8,
  ior: 2.05,
  clearcoat: 1,
  clearcoatRoughness: 0.04,
  iridescence: 0.7,
  iridescenceIOR: 1.45,
  transparent: true,
  opacity: 0.82,
  side: THREE.DoubleSide
});

const paleCrystal = crystal.clone();
paleCrystal.color.set(0xbfe4ff);
paleCrystal.transmission = 0.94;
paleCrystal.opacity = 0.7;

const violetCrystal = crystal.clone();
violetCrystal.color.set(0xc7b7ff);
violetCrystal.opacity = 0.58;
violetCrystal.transmission = 0.9;

const cyanCrystal = crystal.clone();
cyanCrystal.color.set(0x8ff4ff);
cyanCrystal.opacity = 0.5;
cyanCrystal.transmission = 0.92;

const pinkCrystal = crystal.clone();
pinkCrystal.color.set(0xffb9e7);
pinkCrystal.opacity = 0.42;
pinkCrystal.transmission = 0.94;

const solidFacet = new THREE.MeshPhysicalMaterial({
  color: 0x9edaff,
  metalness: 0.18,
  roughness: 0.13,
  transmission: 0.35,
  thickness: 0.35,
  ior: 1.8,
  clearcoat: 1,
  iridescence: 0.85,
  transparent: true,
  opacity: 0.74,
  side: THREE.DoubleSide
});

const seahorse = new THREE.Group();
seahorse.rotation.y = -0.15;
scene.add(seahorse);

function mesh(geometry, material, position, scale, rotation) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(position.x, position.y, position.z);
  if (scale) object.scale.set(scale.x, scale.y, scale.z);
  if (rotation) object.rotation.set(rotation.x, rotation.y, rotation.z);
  object.castShadow = true;
  object.receiveShadow = true;
  seahorse.add(object);
  return object;
}

function tube(points, radius, material, radialSegments = 10, tubularSegments = 48) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geometry = new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, false);
  return mesh(geometry, material, new THREE.Vector3(0, 0, 0), null, null);
}

const torso = mesh(
  new THREE.SphereGeometry(1, 28, 20),
  crystal,
  new THREE.Vector3(-0.1, 0.05, 0),
  new THREE.Vector3(0.72, 1.38, 0.48),
  new THREE.Euler(0, 0, -0.08)
);

const chest = mesh(
  new THREE.SphereGeometry(1, 24, 16),
  paleCrystal,
  new THREE.Vector3(0.18, 0.68, 0.01),
  new THREE.Vector3(0.57, 0.82, 0.39),
  new THREE.Euler(0, 0, -0.2)
);

const neck = tube([
  new THREE.Vector3(0.02, 0.7, 0),
  new THREE.Vector3(0.17, 1.05, 0),
  new THREE.Vector3(0.35, 1.34, 0),
  new THREE.Vector3(0.48, 1.58, 0)
], 0.25, crystal, 12, 36);

const head = mesh(
  new THREE.SphereGeometry(1, 26, 18),
  crystal,
  new THREE.Vector3(0.56, 1.73, 0),
  new THREE.Vector3(0.48, 0.42, 0.37),
  new THREE.Euler(0, 0, -0.18)
);

const muzzle = tube([
  new THREE.Vector3(0.75, 1.77, 0),
  new THREE.Vector3(1.02, 1.72, 0),
  new THREE.Vector3(1.29, 1.62, 0)
], 0.105, paleCrystal, 10, 28);

const snoutTip = mesh(
  new THREE.SphereGeometry(1, 16, 10),
  cyanCrystal,
  new THREE.Vector3(1.3, 1.62, 0),
  new THREE.Vector3(0.14, 0.11, 0.13),
  null
);

const eyeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x6f42ff,
  emissive: 0x3214aa,
  emissiveIntensity: 2,
  roughness: 0.05,
  metalness: 0.3,
  clearcoat: 1
});

mesh(new THREE.SphereGeometry(1, 16, 12), eyeMaterial,
  new THREE.Vector3(0.77, 1.89, 0.32),
  new THREE.Vector3(0.07, 0.07, 0.045), null);

mesh(new THREE.SphereGeometry(1, 16, 12), eyeMaterial,
  new THREE.Vector3(0.77, 1.89, -0.32),
  new THREE.Vector3(0.07, 0.07, 0.045), null);

const tailPoints = [
  new THREE.Vector3(-0.18, -0.92, 0),
  new THREE.Vector3(-0.45, -1.3, 0.02),
  new THREE.Vector3(-0.58, -1.72, 0.03),
  new THREE.Vector3(-0.44, -2.05, 0.02),
  new THREE.Vector3(-0.08, -2.2, 0.01),
  new THREE.Vector3(0.2, -2.05, 0),
  new THREE.Vector3(0.24, -1.76, -0.01),
  new THREE.Vector3(0.08, -1.58, -0.02),
  new THREE.Vector3(-0.12, -1.66, -0.02),
  new THREE.Vector3(-0.18, -1.82, -0.02)
];
tube(tailPoints, 0.16, crystal, 12, 72);

const tailSpines = [];
for (let i = 0; i < 8; i++) {
  const t = i / 7;
  const x = -0.47 + Math.sin(t * Math.PI * 1.15) * 0.48;
  const y = -1.28 - t * 0.78;
  const spike = mesh(
    new THREE.ConeGeometry(0.11 - t * 0.045, 0.3 - t * 0.09, 5),
    violetCrystal,
    new THREE.Vector3(x, y, 0),
    new THREE.Vector3(1, 1, 1),
    new THREE.Euler(0, 0, -0.7 + t * 1.4)
  );
  tailSpines.push(spike);
}

const crownMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xf2d2ff,
  metalness: 0.22,
  roughness: 0.09,
  transmission: 0.5,
  thickness: 0.25,
  ior: 1.9,
  clearcoat: 1,
  iridescence: 1,
  transparent: true,
  opacity: 0.82
});

for (let i = 0; i < 7; i++) {
  const angle = -0.95 + i * 0.3;
  const x = 0.28 + Math.cos(angle) * 0.3;
  const y = 2.02 + Math.sin(angle) * 0.11;
  const spike = mesh(
    new THREE.ConeGeometry(0.105, 0.5 + (i % 2) * 0.13, 5),
    crownMaterial,
    new THREE.Vector3(x, y, 0),
    new THREE.Vector3(1, 1, 1),
    new THREE.Euler(0, 0, -0.28 + angle * 0.42)
  );
  spike.rotation.y = i * 0.18;
}

const dorsalFinGeometry = new THREE.BufferGeometry();
dorsalFinGeometry.setAttribute('position', new THREE.Float32BufferAttribute([
  -0.56, 0.72, -0.33,
  -0.88, 0.96, -0.38,
  -0.77, 0.32, -0.42,
  -0.56, -0.12, -0.31,
  -0.68, 0.48, -0.4,
  -0.92, 0.58, -0.42
], 3));
dorsalFinGeometry.setIndex([0, 1, 2, 0, 2, 3, 0, 4, 1, 1, 4, 5]);
dorsalFinGeometry.computeVertexNormals();
mesh(dorsalFinGeometry, cyanCrystal, new THREE.Vector3(0, 0, 0), null, null);

for (let i = 0; i < 9; i++) {
  const y = 0.95 - i * 0.22;
  const width = 0.39 - i * 0.018;
  const rib = mesh(
    new THREE.TorusGeometry(width, 0.025, 5, 18, Math.PI * 1.15),
    i % 3 === 0 ? pinkCrystal : cyanCrystal,
    new THREE.Vector3(-0.15, y, 0),
    new THREE.Vector3(1, 0.82, 0.72),
    new THREE.Euler(Math.PI / 2, 0, 0.15)
  );
  rib.rotation.z = 0.12;
}

for (let i = 0; i < 5; i++) {
  const y = 0.85 - i * 0.33;
  tube([
    new THREE.Vector3(-0.58, y + 0.15, 0.33),
    new THREE.Vector3(-0.73, y, 0.4),
    new THREE.Vector3(-0.55, y - 0.16, 0.34)
  ], 0.028, i % 2 ? violetCrystal : cyanCrystal, 6, 16);
}

const sparkleMaterial = new THREE.MeshBasicMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.82
});

for (let i = 0; i < 18; i++) {
  const a = i * 2.399;
  const y = -1.65 + (i % 9) * 0.39;
  const x = -0.56 + Math.sin(a) * 0.48;
  const z = Math.cos(a * 1.7) * 0.38;
  const glint = mesh(
    new THREE.OctahedronGeometry(0.035 + (i % 3) * 0.014, 0),
    i % 4 === 0 ? pinkCrystal : sparkleMaterial,
    new THREE.Vector3(x, y, z),
    new THREE.Vector3(1.8, 0.32, 0.32),
    new THREE.Euler(0, a, a * 0.5)
  );
  glint.renderOrder = 4;
}

const haloMaterial = new THREE.MeshBasicMaterial({
  color: 0x668dff,
  transparent: true,
  opacity: 0.06,
  side: THREE.BackSide,
  blending: THREE.AdditiveBlending
});

mesh(
  new THREE.SphereGeometry(1, 32, 24),
  haloMaterial,
  new THREE.Vector3(-0.02, 0.05, 0),
  new THREE.Vector3(1.02, 1.76, 0.72),
  null
);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
