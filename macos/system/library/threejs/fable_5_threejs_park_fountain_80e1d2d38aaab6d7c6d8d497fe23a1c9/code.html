<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Park Fountain</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0e1116}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1116);
scene.fog = new THREE.Fog(0x0e1116, 18, 40);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(5.2, 3.4, 6.2);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 3;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.49;

// --- Lighting ---
scene.add(new THREE.HemisphereLight(0xbcd0e8, 0x3a3630, 0.55));
const sun = new THREE.DirectionalLight(0xfff1dd, 2.2);
sun.position.set(6, 9, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -6; sun.shadow.camera.right = 6;
sun.shadow.camera.top = 6; sun.shadow.camera.bottom = -6;
sun.shadow.camera.near = 2; sun.shadow.camera.far = 25;
sun.shadow.bias = -0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8fa8c8, 0.35);
fill.position.set(-5, 3, -6);
scene.add(fill);

// --- Weathered stone texture (procedural canvas) ---
function stoneTexture(base, grime, size=256){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0,0,size,size);
  for(let i=0;i<9000;i++){
    const x = Math.random()*size, y = Math.random()*size;
    const v = Math.random();
    g.fillStyle = v < 0.5 ? `rgba(0,0,0,${0.03+Math.random()*0.07})` : `rgba(255,255,255,${0.02+Math.random()*0.05})`;
    g.fillRect(x, y, 1+Math.random()*2, 1+Math.random()*2);
  }
  for(let i=0;i<26;i++){ // grime streaks / lichen blotches
    const x = Math.random()*size, y = Math.random()*size, r = 6+Math.random()*22;
    const rg = g.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0, grime); rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const stoneMap = stoneTexture('#9a917f', 'rgba(70,78,58,0.25)');
const stoneMat = new THREE.MeshStandardMaterial({map: stoneMap, roughness: 0.92, metalness: 0.0});
const groundMap = stoneTexture('#7d766a', 'rgba(52,58,44,0.3)');
groundMap.repeat.set(3,3);
const apronMat = new THREE.MeshStandardMaterial({map: groundMap, roughness: 0.95});

const waterMat = new THREE.MeshPhysicalMaterial({
  color: 0x2e6b74, roughness: 0.08, metalness: 0.0,
  transmission: 0.35, transparent: true, opacity: 0.92,
  clearcoat: 1.0, clearcoatRoughness: 0.05
});

const fountain = new THREE.Group();
scene.add(fountain);
function add(mesh, y=0){ mesh.position.y = y; mesh.castShadow = mesh.receiveShadow = true; fountain.add(mesh); return mesh; }

// --- Lathe helper: bowl with visible wall thickness ---
function bowlProfile(rOuter, rInner, hBase, hTop, floorY){
  // outer wall up, over the rim, inner wall down to basin floor
  const pts = [];
  pts.push(new THREE.Vector2(rOuter*0.92, hBase));
  pts.push(new THREE.Vector2(rOuter, hBase + (hTop-hBase)*0.25));
  pts.push(new THREE.Vector2(rOuter, hTop - 0.03));
  pts.push(new THREE.Vector2(rOuter - 0.02, hTop));      // outer rim edge
  pts.push(new THREE.Vector2(rInner + 0.02, hTop));      // across rim top
  pts.push(new THREE.Vector2(rInner, hTop - 0.03));      // inner rim edge
  pts.push(new THREE.Vector2(rInner*0.96, floorY + 0.04));
  pts.push(new THREE.Vector2(0.0, floorY));              // basin floor
  return pts;
}

// --- Ground apron (octagonal paved pad) ---
const apron = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 3.5, 0.12, 8), apronMat);
apron.receiveShadow = true; apron.castShadow = true;
apron.position.y = 0.06;
fountain.add(apron);

// --- Lower basin: plinth + thick bowl + coping rim ---
const plinth = add(new THREE.Mesh(new THREE.CylinderGeometry(2.35, 2.5, 0.22, 48), stoneMat), 0.12 + 0.11);
const lowerBowl = new THREE.Mesh(new THREE.LatheGeometry(bowlProfile(2.2, 2.0, 0.0, 0.85, 0.30), 64), stoneMat);
lowerBowl.position.y = 0.34;
lowerBowl.castShadow = lowerBowl.receiveShadow = true;
fountain.add(lowerBowl);
// coping rim (torus cap on the wall top)
const coping = new THREE.Mesh(new THREE.TorusGeometry(2.1, 0.09, 16, 64), stoneMat);
coping.rotation.x = Math.PI/2;
coping.position.y = 0.34 + 0.85;
coping.castShadow = coping.receiveShadow = true;
fountain.add(coping);

// --- Lower water plane ---
const lowerWater = new THREE.Mesh(new THREE.CircleGeometry(1.98, 64), waterMat);
lowerWater.rotation.x = -Math.PI/2;
lowerWater.position.y = 0.34 + 0.72;
lowerWater.receiveShadow = true;
fountain.add(lowerWater);

// --- Central pedestal ---
const pedBase = add(new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.55, 0.18, 32), stoneMat), 0.64 + 0.09);
const pedestal = add(new THREE.Mesh(new THREE.CylinderGeometry(0.20, 0.30, 1.05, 32), stoneMat), 0.82 + 0.525);
const pedCollar = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.05, 12, 32), stoneMat);
pedCollar.rotation.x = Math.PI/2; pedCollar.position.y = 1.86;
pedCollar.castShadow = pedCollar.receiveShadow = true;
fountain.add(pedCollar);

// --- Upper bowl (smaller, thick-walled) ---
const upperBowlPts = [];
upperBowlPts.push(new THREE.Vector2(0.0, 0.0));
upperBowlPts.push(new THREE.Vector2(0.45, 0.02));
upperBowlPts.push(new THREE.Vector2(0.78, 0.16));
upperBowlPts.push(new THREE.Vector2(0.88, 0.30));       // outer lip
upperBowlPts.push(new THREE.Vector2(0.85, 0.33));
upperBowlPts.push(new THREE.Vector2(0.78, 0.30));       // inner lip
upperBowlPts.push(new THREE.Vector2(0.60, 0.20));
upperBowlPts.push(new THREE.Vector2(0.0, 0.14));        // inner floor
const upperBowl = new THREE.Mesh(new THREE.LatheGeometry(upperBowlPts, 48), stoneMat);
upperBowl.position.y = 1.92;
upperBowl.castShadow = upperBowl.receiveShadow = true;
fountain.add(upperBowl);

// --- Upper water plane ---
const upperWater = new THREE.Mesh(new THREE.CircleGeometry(0.76, 48), waterMat);
upperWater.rotation.x = -Math.PI/2;
upperWater.position.y = 1.92 + 0.27;
fountain.add(upperWater);

// --- Finial spout ---
const finial = add(new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.075, 0.34, 16), stoneMat), 2.06 + 0.17);
const finialKnob = add(new THREE.Mesh(new THREE.SphereGeometry(0.075, 16, 12), stoneMat), 2.42);

// --- Water jet + falling streams (subtle) ---
const jetMat = new THREE.MeshPhysicalMaterial({color: 0xbfe3ea, roughness: 0.1, transparent: true, opacity: 0.5, transmission: 0.5});
const jet = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.045, 0.5, 10), jetMat);
jet.position.y = 2.42 + 0.28;
fountain.add(jet);
const streams = new THREE.Group();
for(let i=0;i<6;i++){
  const a = i/6 * Math.PI*2;
  const s = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.02, 1.12, 8), jetMat);
  s.position.set(Math.cos(a)*0.82, 1.92 + 0.30 - 0.56, Math.sin(a)*0.82);
  streams.add(s);
}
fountain.add(streams);

// --- Soft ground / contact shadow ---
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 48), new THREE.MeshStandardMaterial({color: 0x565a52, roughness: 1}));
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
const shadCanvas = document.createElement('canvas'); shadCanvas.width = shadCanvas.height = 128;
const sg = shadCanvas.getContext('2d');
const rad = sg.createRadialGradient(64,64,8,64,64,64);
rad.addColorStop(0,'rgba(0,0,0,0.45)'); rad.addColorStop(1,'rgba(0,0,0,0)');
sg.fillStyle = rad; sg.fillRect(0,0,128,128);
const shadTex = new THREE.CanvasTexture(shadCanvas);
const softShadow = new THREE.Mesh(new THREE.PlaneGeometry(9,9), new THREE.MeshBasicMaterial({map: shadTex, transparent: true, depthWrite: false}));
softShadow.rotation.x = -Math.PI/2;
softShadow.position.y = 0.005;
scene.add(softShadow);

// --- Animate ---
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  lowerWater.position.y = 0.34 + 0.72 + Math.sin(t*1.4)*0.006;
  upperWater.position.y = 1.92 + 0.27 + Math.sin(t*1.8+1)*0.004;
  jet.scale.y = 1 + Math.sin(t*5)*0.05;
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
