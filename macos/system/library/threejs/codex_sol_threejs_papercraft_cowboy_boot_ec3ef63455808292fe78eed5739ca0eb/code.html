<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papercraft Cowboy Boot</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #eee5d4;
  }
  body {
    background: radial-gradient(circle at 50% 35%, #fffaf0 0%, #eee4d0 58%, #d8c8ae 100%);
  }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeee5d4);
scene.fog = new THREE.Fog(0xeee5d4, 11, 22);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 50);
camera.position.set(6.2, 4.35, 7.2);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.45, 1.65, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 5.2;
controls.maxDistance = 13;
controls.maxPolarAngle = Math.PI * 0.48;

const hemi = new THREE.HemisphereLight(0xfff8e8, 0x665644, 2.1);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe5bd, 4.1);
key.position.set(4.5, 7.5, 5.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -4;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 20;
key.shadow.bias = -0.0007;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8ed7d0, 1.15);
fill.position.set(-4, 3, -5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd18b, 1.4);
rim.position.set(-5, 5, 3);
scene.add(rim);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0xd8c9b1, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.025;
ground.receiveShadow = true;
scene.add(ground);

const boot = new THREE.Group();
boot.rotation.y = -0.12;
boot.position.x = -0.35;
scene.add(boot);

const tan = new THREE.MeshStandardMaterial({
  color: 0xb9783f,
  roughness: 0.92,
  metalness: 0,
  flatShading: true
});
const tanLight = new THREE.MeshStandardMaterial({
  color: 0xd49b5e,
  roughness: 0.9,
  flatShading: true
});
const tanDark = new THREE.MeshStandardMaterial({
  color: 0x704225,
  roughness: 0.96,
  flatShading: true
});
const turquoise = new THREE.MeshStandardMaterial({
  color: 0x249b98,
  roughness: 0.88,
  flatShading: true
});
const turquoiseDark = new THREE.MeshStandardMaterial({
  color: 0x176f70,
  roughness: 0.92,
  flatShading: true
});
const stitchMaterial = new THREE.MeshStandardMaterial({
  color: 0xf5dfb1,
  roughness: 0.9
});
const edgeMaterial = new THREE.LineBasicMaterial({
  color: 0x5b3928,
  transparent: true,
  opacity: 0.48
});
const darkInterior = new THREE.MeshStandardMaterial({
  color: 0x33251f,
  roughness: 1,
  side: THREE.DoubleSide
});

function addEdges(mesh, opacity = 0.45, threshold = 15) {
  const material = edgeMaterial.clone();
  material.opacity = opacity;
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(mesh.geometry, threshold),
    material
  );
  edges.position.copy(mesh.position);
  edges.rotation.copy(mesh.rotation);
  edges.scale.copy(mesh.scale);
  mesh.parent.add(edges);
  return edges;
}

function makeHorizontalLoft(sections, material) {
  const sides = 8;
  const vertices = [];
  const indices = [];

  for (const section of sections) {
    for (let i = 0; i < sides; i++) {
      const angle = i / sides * Math.PI * 2;
      const cosine = Math.cos(angle);
      const sine = Math.sin(angle);
      const lowerShape = cosine < -0.35 ? -0.82 : cosine;
      vertices.push(
        section.x,
        section.y + section.ry * lowerShape,
        section.rz * sine
      );
    }
  }

  for (let s = 0; s < sections.length - 1; s++) {
    for (let i = 0; i < sides; i++) {
      const next = (i + 1) % sides;
      const a = s * sides + i;
      const b = s * sides + next;
      const c = (s + 1) * sides + next;
      const d = (s + 1) * sides + i;
      indices.push(a, b, d, b, c, d);
    }
  }

  for (let i = 1; i < sides - 1; i++) indices.push(0, i + 1, i);
  const end = (sections.length - 1) * sides;
  for (let i = 1; i < sides - 1; i++) indices.push(end, end + i, end + i + 1);

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  boot.add(mesh);
  addEdges(mesh, 0.34, 10);
  return mesh;
}

function makeVerticalLoft(rings, material) {
  const sides = 8;
  const vertices = [];
  const indices = [];

  for (const ring of rings) {
    for (let i = 0; i < sides; i++) {
      const angle = i / sides * Math.PI * 2;
      vertices.push(
        ring.cx + ring.rx * Math.cos(angle),
        ring.y,
        ring.rz * Math.sin(angle)
      );
    }
  }

  for (let r = 0; r < rings.length - 1; r++) {
    for (let i = 0; i < sides; i++) {
      const next = (i + 1) % sides;
      const a = r * sides + i;
      const b = r * sides + next;
      const c = (r + 1) * sides + next;
      const d = (r + 1) * sides + i;
      indices.push(a, d, b, b, d, c);
    }
  }

  for (let i = 1; i < sides - 1; i++) indices.push(0, i, i + 1);

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  boot.add(mesh);
  addEdges(mesh, 0.42, 9);
  return mesh;
}

makeHorizontalLoft([
  { x: -0.92, y: 0.71, ry: 0.39, rz: 0.49 },
  { x: -0.35, y: 0.69, ry: 0.45, rz: 0.61 },
  { x: 0.45, y: 0.61, ry: 0.39, rz: 0.64 },
  { x: 1.23, y: 0.51, ry: 0.31, rz: 0.53 },
  { x: 1.93, y: 0.39, ry: 0.21, rz: 0.34 },
  { x: 2.52, y: 0.32, ry: 0.09, rz: 0.075 }
], tanLight);

makeVerticalLoft([
  { cx: -0.56, y: 0.72, rx: 0.49, rz: 0.49 },
  { cx: -0.52, y: 1.25, rx: 0.58, rz: 0.55 },
  { cx: -0.65, y: 2.05, rx: 0.57, rz: 0.51 },
  { cx: -0.76, y: 2.86, rx: 0.52, rz: 0.47 },
  { cx: -0.68, y: 3.48, rx: 0.58, rz: 0.5 }
], tan);

function footprintShape() {
  const shape = new THREE.Shape();
  shape.moveTo(-1.18, -0.41);
  shape.lineTo(-0.54, -0.57);
  shape.lineTo(0.43, -0.65);
  shape.lineTo(1.38, -0.53);
  shape.lineTo(2.22, -0.26);
  shape.lineTo(2.64, -0.055);
  shape.lineTo(2.64, 0.055);
  shape.lineTo(2.22, 0.26);
  shape.lineTo(1.38, 0.53);
  shape.lineTo(0.43, 0.65);
  shape.lineTo(-0.54, 0.57);
  shape.lineTo(-1.18, 0.41);
  shape.closePath();
  return shape;
}

const soleGeometry = new THREE.ExtrudeGeometry(footprintShape(), {
  depth: 0.12,
  bevelEnabled: false,
  curveSegments: 1
});
soleGeometry.rotateX(Math.PI / 2);
const sole = new THREE.Mesh(soleGeometry, tanDark);
sole.position.y = 0.22;
sole.castShadow = true;
sole.receiveShadow = true;
boot.add(sole);
addEdges(sole, 0.65, 8);

const weltGeometry = new THREE.ExtrudeGeometry(footprintShape(), {
  depth: 0.045,
  bevelEnabled: false,
  curveSegments: 1
});
weltGeometry.rotateX(Math.PI / 2);
const welt = new THREE.Mesh(weltGeometry, turquoiseDark);
welt.scale.set(1.012, 1, 1.012);
welt.position.y = 0.27;
welt.castShadow = true;
boot.add(welt);
addEdges(welt, 0.35, 8);

function makeFrustum() {
  const v = [
    -1.08, 0.18, -0.33,  -0.48, 0.18, -0.28,
    -0.48, 0.18,  0.28,  -1.08, 0.18,  0.33,
    -1.17, 0.63, -0.45,  -0.35, 0.63, -0.43,
    -0.35, 0.63,  0.43,  -1.17, 0.63,  0.45
  ];
  const f = [
    0,1,2, 0,2,3, 4,6,5, 4,7,6,
    0,4,5, 0,5,1, 1,5,6, 1,6,2,
    2,6,7, 2,7,3, 3,7,4, 3,4,0
  ];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(v, 3));
  g.setIndex(f);
  g.computeVertexNormals();
  return g;
}

const heel = new THREE.Mesh(makeFrustum(), tanDark);
heel.castShadow = true;
heel.receiveShadow = true;
boot.add(heel);
addEdges(heel, 0.62, 5);

const heelCap = new THREE.Mesh(
  new THREE.BoxGeometry(0.66, 0.055, 0.7),
  turquoiseDark
);
heelCap.position.set(-0.78, 0.16, 0);
heelCap.rotation.z = 0.015;
heelCap.castShadow = true;
boot.add(heelCap);

const opening = new THREE.Mesh(
  new THREE.CircleGeometry(0.405, 8),
  darkInterior
);
opening.rotation.x = -Math.PI / 2;
opening.scale.set(1.35, 1, 1);
opening.position.set(-0.68, 3.492, 0);
boot.add(opening);

const rimGeometry = new THREE.TorusGeometry(0.405, 0.045, 4, 8);
const topRim = new THREE.Mesh(rimGeometry, tanDark);
topRim.rotation.x = Math.PI / 2;
topRim.scale.set(1.38, 1, 1);
topRim.position.set(-0.68, 3.5, 0);
topRim.castShadow = true;
boot.add(topRim);

function polygonPanel(points, z, material) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
  shape.closePath();
  const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), material);
  mesh.position.z = z;
  mesh.castShadow = true;
  boot.add(mesh);
  const outline = new THREE.LineSegments(
    new THREE.EdgesGeometry(mesh.geometry, 1),
    new THREE.LineBasicMaterial({ color: 0x5a3926, transparent: true, opacity: 0.72 })
  );
  outline.position.copy(mesh.position);
  boot.add(outline);
  return mesh;
}

function beamBetween(a, b, z, width, depth, material) {
  const dx = b[0] - a[0];
  const dy = b[1] - a[1];
  const length = Math.hypot(dx, dy);
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(length, width, depth),
    material
  );
  mesh.position.set((a[0] + b[0]) * 0.5, (a[1] + b[1]) * 0.5, z);
  mesh.rotation.z = Math.atan2(dy, dx);
  mesh.castShadow = true;
  boot.add(mesh);
  return mesh;
}

function stitchPath(points, z, spacing = 0.13, size = 0.052) {
  for (let p = 0; p < points.length; p++) {
    const a = points[p];
    const b = points[(p + 1) % points.length];
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const length = Math.hypot(dx, dy);
    const count = Math.max(1, Math.floor(length / spacing));
    const angle = Math.atan2(dy, dx);
    for (let i = 0; i < count; i++) {
      const t = (i + 0.5) / count;
      const dash = new THREE.Mesh(
        new THREE.BoxGeometry(size, 0.018, 0.018),
        stitchMaterial
      );
      dash.position.set(a[0] + dx * t, a[1] + dy * t, z);
      dash.rotation.z = angle;
      boot.add(dash);
    }
  }
}

const shaftPanel = [
  [-1.06, 1.38],
  [-0.73, 1.67],
  [-0.42, 1.42],
  [-0.29, 2.22],
  [-0.58, 2.72],
  [-0.76, 2.43],
  [-0.99, 2.73],
  [-1.17, 2.18]
];

const footPanel = [
  [-0.16, 0.48],
  [0.34, 0.34],
  [1.18, 0.34],
  [1.76, 0.40],
  [1.33, 0.66],
  [0.46, 0.82],
  [-0.05, 0.74]
];

for (const side of [-1, 1]) {
  const shaftZ = side * 0.522;
  const footZ = side * 0.655;
  polygonPanel(shaftPanel, shaftZ, turquoise);
  stitchPath(shaftPanel, side * 0.536, 0.145, 0.06);

  polygonPanel(footPanel, footZ, turquoise);
  stitchPath(footPanel, side * 0.669, 0.14, 0.055);

  const topBand = [
    [-1.18, 3.05],
    [-0.69, 3.20],
    [-0.19, 3.06],
    [-0.16, 3.30],
    [-0.67, 3.43],
    [-1.21, 3.29]
  ];
  polygonPanel(topBand, side * 0.505, turquoiseDark);
  stitchPath(topBand, side * 0.52, 0.13, 0.05);

  beamBetween([-0.76, 1.52], [-0.76, 2.46], side * 0.547, 0.035, 0.024, stitchMaterial);
  beamBetween([-1.02, 1.9], [-0.49, 2.18], side * 0.548, 0.03, 0.024, stitchMaterial);
  beamBetween([-1.01, 2.18], [-0.51, 1.9], side * 0.548, 0.03, 0.024, stitchMaterial);
}

function foldedStrap(zSign) {
  const z = zSign * 0.54;
  const strapMaterial = zSign > 0 ? tanLight : tan;
  const left = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.69, 0.075), strapMaterial);
  left.position.set(-1.08, 3.22, zSign * 0.565);
  left.rotation.z = -0.12;
  left.castShadow = true;
  boot.add(left);

  const right = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.67, 0.075), strapMaterial);
  right.position.set(-0.73, 3.22, zSign * 0.565);
  right.rotation.z = 0.14;
  right.castShadow = true;
  boot.add(right);

  const bridge = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.13, 0.075), strapMaterial);
  bridge.position.set(-0.9, 3.55, zSign * 0.565);
  bridge.castShadow = true;
  boot.add(bridge);

  const crease = beamBetween([-1.01, 3.22], [-0.8, 3.22], zSign * 0.609, 0.018, 0.012, tanDark);
  crease.rotation.z = 0;
  void z;
}

foldedStrap(-1);
foldedStrap(1);

const toeCreaseMaterial = new THREE.LineBasicMaterial({
  color: 0x75462c,
  transparent: true,
  opacity: 0.38
});
for (const side of [-1, 1]) {
  const lines = [
    new THREE.Vector3(0.35, 0.95, side * 0.32),
    new THREE.Vector3(1.28, 0.7, side * 0.42),
    new THREE.Vector3(2.32, 0.38, side * 0.09)
  ];
  const lineGeometry = new THREE.BufferGeometry().setFromPoints(lines);
  const line = new THREE.Line(lineGeometry, toeCreaseMaterial);
  boot.add(line);
}

const spurZ = -0.73;
beamBetween([-1.12, 0.68], [-1.48, 0.56], spurZ, 0.09, 0.07, turquoiseDark);
beamBetween([-1.1, 0.48], [-1.48, 0.56], spurZ, 0.09, 0.07, turquoiseDark);

const spurStar = new THREE.Shape();
const points = 16;
for (let i = 0; i < points; i++) {
  const angle = i / points * Math.PI * 2;
  const radius = i % 2 === 0 ? 0.24 : 0.105;
  const x = -1.58 + Math.cos(angle) * radius;
  const y = 0.55 + Math.sin(angle) * radius;
  if (i === 0) spurStar.moveTo(x, y);
  else spurStar.lineTo(x, y);
}
spurStar.closePath();

const spurWheel = new THREE.Mesh(
  new THREE.ExtrudeGeometry(spurStar, {
    depth: 0.055,
    bevelEnabled: false,
    curveSegments: 1
  }),
  tanLight
);
spurWheel.position.z = -0.79;
spurWheel.castShadow = true;
boot.add(spurWheel);
addEdges(spurWheel, 0.75, 5);

const spurPin = new THREE.Mesh(
  new THREE.CylinderGeometry(0.055, 0.055, 0.1, 8),
  tanDark
);
spurPin.rotation.x = Math.PI / 2;
spurPin.position.set(-1.58, 0.55, -0.825);
spurPin.castShadow = true;
boot.add(spurPin);

const ankleStrap = new THREE.Mesh(
  new THREE.TorusGeometry(0.51, 0.045, 4, 8, Math.PI * 1.38),
  turquoiseDark
);
ankleStrap.rotation.set(Math.PI / 2, 0, -0.25);
ankleStrap.scale.set(1.12, 1, 0.92);
ankleStrap.position.set(-0.63, 0.82, -0.06);
ankleStrap.castShadow = true;
boot.add(ankleStrap);

const paperTriangles = [
  [[-1.13, 1.05], [-0.57, 1.25], [-1.08, 1.47]],
  [[-0.54, 1.25], [-0.02, 1.08], [-0.25, 1.53]],
  [[-1.17, 2.79], [-0.72, 3.03], [-1.13, 3.11]],
  [[-0.67, 3.02], [-0.18, 2.79], [-0.18, 3.12]]
];
const facetMaterial = new THREE.MeshStandardMaterial({
  color: 0xe0aa6b,
  roughness: 0.95,
  transparent: true,
  opacity: 0.42,
  side: THREE.DoubleSide
});
for (const side of [-1, 1]) {
  for (const triangle of paperTriangles) {
    polygonPanel(triangle, side * 0.514, facetMaterial);
  }
}

const contact = new THREE.Mesh(
  new THREE.CircleGeometry(2.15, 48),
  new THREE.MeshBasicMaterial({
    color: 0x725944,
    transparent: true,
    opacity: 0.12,
    depthWrite: false
  })
);
contact.rotation.x = -Math.PI / 2;
contact.scale.set(1.45, 0.48, 1);
contact.position.set(0.35, 0.006, 0);
scene.add(contact);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
