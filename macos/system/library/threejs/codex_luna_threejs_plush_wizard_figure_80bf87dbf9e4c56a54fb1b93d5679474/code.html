<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plush Wizard</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#161427}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171529);
scene.fog = new THREE.Fog(0x171529, 8, 18);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.2, 4.2, 8.2);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.15;
controls.minDistance = 5;
controls.maxDistance = 12;
controls.target.set(0, 2.35, 0);

const hemi = new THREE.HemisphereLight(0xaeb8e8, 0x251b2d, 2.1);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe4cf, 3.7);
key.position.set(-4.5, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -2;
scene.add(key);

const fill = new THREE.PointLight(0x899dff, 18, 12, 2);
fill.position.set(4, 3.5, 3);
scene.add(fill);

const rim = new THREE.PointLight(0xff9ac9, 15, 10, 2);
rim.position.set(-4, 4, -3);
scene.add(rim);

function fabricTexture(base, fleck, density, scale) {
  const canvas = document.createElement("canvas");
  canvas.width = 256;
  canvas.height = 256;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < density; i++) {
    const x = Math.random() * 256;
    const y = Math.random() * 256;
    const a = 0.035 + Math.random() * 0.09;
    const r = 0.35 + Math.random() * 1.3;
    ctx.fillStyle = fleck.replace("ALPHA", a.toFixed(3));
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(scale, scale);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const robeTex = fabricTexture("#432d76", "rgba(219,190,255,ALPHA)", 1600, 3);
const hatTex = fabricTexture("#302350", "rgba(208,171,245,ALPHA)", 1500, 3);
const skinTex = fabricTexture("#bd6d62", "rgba(255,211,184,ALPHA)", 1200, 2);
const beardTex = fabricTexture("#d5b58d", "rgba(255,244,211,ALPHA)", 1800, 4);
const goldTex = fabricTexture("#d6952f", "rgba(255,220,122,ALPHA)", 700, 2);

const robeMat = new THREE.MeshStandardMaterial({ map:robeTex, color:0x7652a7, roughness:0.96 });
const hatMat = new THREE.MeshStandardMaterial({ map:hatTex, color:0x554087, roughness:1 });
const skinMat = new THREE.MeshStandardMaterial({ map:skinTex, color:0xd48678, roughness:1 });
const beardMat = new THREE.MeshStandardMaterial({ map:beardTex, color:0xe2c49d, roughness:1 });
const goldMat = new THREE.MeshStandardMaterial({ map:goldTex, color:0xe1a83e, roughness:0.84, metalness:0.08 });
const darkMat = new THREE.MeshStandardMaterial({ color:0x211728, roughness:0.75 });
const eyeMat = new THREE.MeshStandardMaterial({ color:0x10101c, roughness:0.36 });
const redMat = new THREE.MeshStandardMaterial({ color:0xb94359, roughness:0.92 });
const wandMat = new THREE.MeshStandardMaterial({ color:0x774b39, roughness:1 });

function mesh(geometry, material, position, scale, rotation) {
  const m = new THREE.Mesh(geometry, material);
  if (position) m.position.set(...position);
  if (scale) m.scale.set(...scale);
  if (rotation) m.rotation.set(...rotation);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

function addSeamRing(parent, y, radius, tube, material, zScale=1) {
  const ring = mesh(new THREE.TorusGeometry(radius, tube, 8, 48), material, [0,y,0], [1,zScale,1], [0,0,0]);
  parent.add(ring);
  return ring;
}

function starShape(radius, points, inner) {
  const shape = new THREE.Shape();
  for (let i = 0; i < points * 2; i++) {
    const a = i * Math.PI / points - Math.PI / 2;
    const r = i % 2 === 0 ? radius : inner;
    const x = Math.cos(a) * r;
    const y = Math.sin(a) * r;
    if (i === 0) shape.moveTo(x,y); else shape.lineTo(x,y);
  }
  shape.closePath();
  return shape;
}

function star(x,y,z,s,rot) {
  const geo = new THREE.ExtrudeGeometry(starShape(1,5,0.43), { depth:0.055, bevelEnabled:true, bevelSegments:2, bevelSize:0.025, bevelThickness:0.02 });
  geo.center();
  const obj = mesh(geo, goldMat, [x,y,z], [s,s,s], [Math.PI/2,0,rot]);
  return obj;
}

function yarn(x1,y1,z1,x2,y2,z2,phase) {
  const points = [];
  const dx = x2-x1;
  const dy = y2-y1;
  const dz = z2-z1;
  for (let i=0;i<9;i++) {
    const t=i/8;
    const wave=Math.sin(t*Math.PI*3+phase)*0.035*(1-t*0.45);
    points.push(new THREE.Vector3(x1+dx*t+wave, y1+dy*t, z1+dz*t+wave*0.65));
  }
  const curve = new THREE.CatmullRomCurve3(points);
  return mesh(new THREE.TubeGeometry(curve, 18, 0.045, 7, false), beardMat);
}

const wizard = new THREE.Group();
wizard.position.y = -0.18;
scene.add(wizard);

const body = mesh(new THREE.SphereGeometry(1, 48, 32), robeMat, [0,1.42,0], [0.93,1.18,0.7]);
wizard.add(body);

const bellyPatch = mesh(new THREE.SphereGeometry(0.72, 32, 24), robeMat, [0,1.55,0.57], [1,1.05,0.12]);
wizard.add(bellyPatch);

const collar = mesh(new THREE.TorusGeometry(0.52,0.11,12,40), goldMat, [0,2.36,0], [1,0.72,1], [0,0,0]);
wizard.add(collar);

const belt = mesh(new THREE.TorusGeometry(0.68,0.105,12,48), redMat, [0,1.72,0], [1,0.62,1], [Math.PI/2,0,0]);
wizard.add(belt);
const buckle = mesh(new THREE.BoxGeometry(0.23,0.25,0.08), goldMat, [0,1.7,0.67], [1,1,1]);
wizard.add(buckle);

addSeamRing(wizard, 0.75, 0.67, 0.025, goldMat, 0.62);
addSeamRing(wizard, 2.1, 0.68, 0.023, goldMat, 0.64);

star(0.33,1.22,0.68,0.13,0.15);
star(-0.38,1.55,0.66,0.11,-0.2);
star(0.35,1.93,0.62,0.085,0.3);
star(-0.26,0.95,0.63,0.075,0.1);

const footL = mesh(new THREE.SphereGeometry(0.38, 28, 20), redMat, [-0.38,0.38,0.1], [1,0.55,1.25]);
const footR = mesh(new THREE.SphereGeometry(0.38, 28, 20), redMat, [0.38,0.38,0.1], [1,0.55,1.25]);
wizard.add(footL, footR);

const head = mesh(new THREE.SphereGeometry(0.78, 40, 30), skinMat, [0,2.82,0.04], [0.98,0.95,0.88]);
wizard.add(head);

const earL = mesh(new THREE.SphereGeometry(0.22, 20, 16), skinMat, [-0.7,2.85,0], [0.72,1,0.62]);
const earR = mesh(new THREE.SphereGeometry(0.22, 20, 16), skinMat, [0.7,2.85,0], [0.72,1,0.62]);
wizard.add(earL, earR);

const eyeL = mesh(new THREE.SphereGeometry(0.115, 20, 16), eyeMat, [-0.27,3.02,0.7], [1,1,0.42]);
const eyeR = mesh(new THREE.SphereGeometry(0.115, 20, 16), eyeMat, [0.27,3.02,0.7], [1,1,0.42]);
wizard.add(eyeL, eyeR);

const nose = mesh(new THREE.SphereGeometry(0.12, 20, 16), skinMat, [0,2.82,0.76], [0.85,0.75,0.8]);
wizard.add(nose);

const mouth = mesh(new THREE.TorusGeometry(0.16,0.025,8,24,Math.PI), darkMat, [0,2.65,0.72], [1,0.8,1], [Math.PI/2,0,0]);
wizard.add(mouth);

for (let i=0;i<9;i++) {
  const a = -0.8 + i*0.2;
  const x = Math.sin(a)*0.58;
  const y = 2.63 + Math.cos(a)*0.2;
  const z = 0.67;
  wizard.add(yarn(x,y,z,x*1.22,2.08+(i%3)*0.04,z+0.08,(i%4)*0.7));
}
for (let i=0;i<5;i++) {
  const x = -0.34+i*0.17;
  wizard.add(yarn(x,2.65,0.7,x*1.15,2.3,0.76,i));
}

const hat = new THREE.Group();
hat.position.set(0,3.56,-0.02);
wizard.add(hat);

const brim = mesh(new THREE.SphereGeometry(0.92, 40, 20), hatMat, [0,0,0], [1,0.18,0.82]);
hat.add(brim);

const crown = mesh(new THREE.ConeGeometry(0.58,1.38,40,12), hatMat, [0,0.62,0], [1,1,1], [0,0,-0.08]);
hat.add(crown);

const tip = mesh(new THREE.SphereGeometry(0.34, 28, 20), hatMat, [-0.22,1.28,0], [1.15,0.65,0.9], [0,0,-0.2]);
hat.add(tip);

const hatBand = mesh(new THREE.TorusGeometry(0.57,0.075,10,48), redMat, [0,0.22,0], [1,0.84,1], [Math.PI/2,0,0]);
hat.add(hatBand);
hat.add(star(0.16,0.61,0.55,0.13,0.1));

const armL = new THREE.Group();
armL.position.set(-0.78,1.85,0.03);
armL.rotation.z = -0.28;
armL.add(mesh(new THREE.SphereGeometry(0.32, 28, 22), robeMat, [0,0,0], [0.72,1.5,0.72]));
armL.add(mesh(new THREE.SphereGeometry(0.3, 24, 18), skinMat, [0,-0.58,0.02], [0.92,0.85,0.82]));
wizard.add(armL);

const armR = new THREE.Group();
armR.position.set(0.78,1.85,0.03);
armR.rotation.z = 0.28;
armR.add(mesh(new THREE.SphereGeometry(0.32, 28, 22), robeMat, [0,0,0], [0.72,1.5,0.72]));
armR.add(mesh(new THREE.SphereGeometry(0.3, 24, 18), skinMat, [0,-0.58,0.02], [0.92,0.85,0.82]));
wizard.add(armR);

const wand = new THREE.Group();
wand.rotation.z = -0.42;
wand.position.set(0.03,1.35,0.78);
const wandStem = mesh(new THREE.CylinderGeometry(0.055,0.075,2.05,16), wandMat, [0,0.15,0], [1,1,1], [0,0,0]);
wandStem.rotation.z = Math.PI/2;
wand.add(wandStem);
const wandGem = mesh(new THREE.SphereGeometry(0.16, 20, 16), goldMat, [1.05,0.15,0], [1,1,1]);
wand.add(wandGem);
const glow = new THREE.PointLight(0xffc46e, 2.7, 2.3, 2);
glow.position.set(1.05,0.15,0.2);
wand.add(glow);
wizard.add(wand);

for (let i=0;i<7;i++) {
  const a = i*Math.PI*2/7;
  const r = 0.32 + (i%2)*0.07;
  const spark = mesh(new THREE.SphereGeometry(0.035, 10, 8), goldMat, [1.05+Math.cos(a)*r,1.5+Math.sin(a)*r,0.78]);
  wizard.add(spark);
}

const seamMat = new THREE.MeshStandardMaterial({ color:0x2b1b47, roughness:1 });
const seamCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.9,2.2,0.2),
  new THREE.Vector3(-0.98,1.55,0.35),
  new THREE.Vector3(-0.75,0.8,0.28)
]);
wizard.add(mesh(new THREE.TubeGeometry(seamCurve, 24, 0.018, 6, false), seamMat));

const floor = mesh(new THREE.CircleGeometry(5.5, 64), new THREE.MeshStandardMaterial({color:0x211c35, roughness:1}), [0,0,0], [1,1,1], [-Math.PI/2,0,0]);
floor.receiveShadow = true;
scene.add(floor);

const shadow = mesh(new THREE.CircleGeometry(1.45, 48), new THREE.MeshBasicMaterial({color:0x0b0913, transparent:true, opacity:0.42}), [0,0.018,0], [1.25,0.65,1]);
scene.add(shadow);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
