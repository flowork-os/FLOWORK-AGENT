<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Dragon Figurine</title>
<style>
  html, body { margin: 0; height: 100%; background: #08080d; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  .hint {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    color: #b9a9d6; font: 12px/1.4 system-ui, sans-serif; letter-spacing: .04em;
    opacity: .55; pointer-events: none; user-select: none; text-align: center;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">Amethyst Crystal Dragon — drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- Renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

/* ---------- Scene / Camera ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a11);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3.0, 1.7, 3.6);

/* environment for glassy reflections */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------- Controls ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.enablePan = false;
controls.minDistance = 1.8;
controls.maxDistance = 12;

/* ---------- Lighting ---------- */
scene.add(new THREE.HemisphereLight(0x8a9dff, 0x1a0f26, 0.55));
scene.add(new THREE.AmbientLight(0x352548, 0.25));

const key = new THREE.DirectionalLight(0xfff2ff, 3.1);
key.position.set(4.5, 7.5, 5.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 26;
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 4;
key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x6b7dff, 0.9);
fill.position.set(-5, 3, 2.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xd58cff, 2.4);
rim.position.set(-2, 4.5, -6);
scene.add(rim);

/* ---------- Ground (shadow-only) ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.38 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- Materials ---------- */
const crystalMat = new THREE.MeshPhysicalMaterial({
  color: 0x7c40b4,
  metalness: 0.0,
  roughness: 0.06,
  transmission: 0.95,
  thickness: 0.6,
  ior: 1.82,
  reflectivity: 0.6,
  attenuationColor: new THREE.Color(0x49206f),
  attenuationDistance: 1.1,
  clearcoat: 1.0,
  clearcoatRoughness: 0.12,
  iridescence: 0.35,
  iridescenceIOR: 1.3,
  specularIntensity: 1.0,
  emissive: new THREE.Color(0x220a38),
  emissiveIntensity: 0.35,
  envMapIntensity: 1.5,
  flatShading: true,
  side: THREE.FrontSide
});

const wingMat = crystalMat.clone();
wingMat.thickness = 0.22;
wingMat.attenuationDistance = 0.7;
wingMat.side = THREE.DoubleSide;
wingMat.flatShading = true;

const eyeMat = new THREE.MeshStandardMaterial({
  color: 0xffd6f2, emissive: 0xff3fae, emissiveIntensity: 2.4, roughness: 0.2, metalness: 0.0
});

const sparkGeo = new THREE.OctahedronGeometry(0.02, 0);
const sparkMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, emissive: 0xe9c9ff, emissiveIntensity: 2.2, roughness: 0.1, metalness: 0.0
});

/* ---------- Helpers ---------- */
function buildTubeGeometry(curve, radiusFn, tubularSegments, radialSegments) {
  const frames = curve.computeFrenetFrames(tubularSegments, false);
  const positions = [];
  const indices = [];
  const P = new THREE.Vector3();
  for (let i = 0; i <= tubularSegments; i++) {
    const t = i / tubularSegments;
    curve.getPointAt(t, P);
    const N = frames.normals[i], B = frames.binormals[i];
    const r = radiusFn(t);
    for (let j = 0; j < radialSegments; j++) {
      const v = (j / radialSegments) * Math.PI * 2;
      const cx = Math.cos(v), sy = Math.sin(v);
      const nx = cx * N.x + sy * B.x;
      const ny = cx * N.y + sy * B.y;
      const nz = cx * N.z + sy * B.z;
      positions.push(P.x + r * nx, P.y + r * ny, P.z + r * nz);
    }
  }
  for (let i = 0; i < tubularSegments; i++) {
    for (let j = 0; j < radialSegments; j++) {
      const a = i * radialSegments + j;
      const b = i * radialSegments + (j + 1) % radialSegments;
      const c = (i + 1) * radialSegments + j;
      const d = (i + 1) * radialSegments + (j + 1) % radialSegments;
      indices.push(a, c, b, b, c, d);
    }
  }
  // caps
  const sC = curve.getPointAt(0);
  const eC = curve.getPointAt(1);
  const sIdx = (tubularSegments + 1) * radialSegments;
  positions.push(sC.x, sC.y, sC.z);
  const eIdx = sIdx + 1;
  positions.push(eC.x, eC.y, eC.z);
  for (let j = 0; j < radialSegments; j++) {
    indices.push(sIdx, (j + 1) % radialSegments, j);
  }
  const last = tubularSegments * radialSegments;
  for (let j = 0; j < radialSegments; j++) {
    indices.push(eIdx, last + j, last + (j + 1) % radialSegments);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return geo;
}

function makeRod(x1, y1, x2, y2) {
  const a = new THREE.Vector3(x1, y1, 0.02);
  const b = new THREE.Vector3(x2, y2, 0.02);
  const len = a.distanceTo(b);
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.006, len, 5), crystalMat);
  rod.position.copy(a).lerp(b, 0.5);
  rod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  rod.castShadow = true;
  return rod;
}

/* ---------- Dragon ---------- */
const dragon = new THREE.Group();
scene.add(dragon);
const sparkles = [];

/* Spine: coiled body + rising neck */
const control = [];
const coilTurns = 2.15, coilSteps = 48;
for (let i = 0; i <= coilSteps; i++) {
  const u = i / coilSteps;
  const a = -u * coilTurns * Math.PI * 2 + 0.5;
  const rad = 1.25 * (1 - 0.58 * u) + 0.08;
  const h = -0.32 + u * 0.62;
  control.push(new THREE.Vector3(Math.cos(a) * rad, h, Math.sin(a) * rad));
}
control.push(new THREE.Vector3(0.12, 0.55, -0.18));
control.push(new THREE.Vector3(0.02, 0.82, 0.06));
control.push(new THREE.Vector3(-0.02, 0.98, 0.40));
control.push(new THREE.Vector3(-0.02, 1.02, 0.72));
const curve = new THREE.CatmullRomCurve3(control, false, 'centripetal', 0.5);

function radiusFn(t) {
  const k = Math.min(t / 0.92, 1);
  const belly = Math.sin(Math.PI * k);
  return 0.055 + 0.205 * Math.pow(belly, 0.65);
}

/* Body */
const bodyGeo = buildTubeGeometry(curve, radiusFn, 300, 7);
const body = new THREE.Mesh(bodyGeo, crystalMat);
body.castShadow = true;
dragon.add(body);

/* Dorsal spikes (gem-cut ridge) */
const numSpikes = 40;
for (let i = 0; i < numSpikes; i++) {
  const t = 0.06 + (i / (numSpikes - 1)) * 0.86;
  const p = curve.getPointAt(t);
  const tg = curve.getTangentAt(t).normalize();
  const up = new THREE.Vector3(0, 1, 0);
  up.addScaledVector(tg, -up.dot(tg));
  if (up.lengthSq() < 1e-5) up.set(1, 0, 0); else up.normalize();
  const r = radiusFn(t);
  const grow = 0.45 + 0.85 * Math.sin(Math.PI * Math.min(t / 0.95, 1));
  const base = r * 0.62 * grow;
  const h = base * 3.4;
  const spike = new THREE.Mesh(new THREE.ConeGeometry(base, h, 4), crystalMat);
  spike.position.copy(p).addScaledVector(up, r * 0.8);
  spike.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), up);
  spike.castShadow = true;
  dragon.add(spike);
}

/* Head */
const Pe = curve.getPointAt(1);
const Te = curve.getTangentAt(1).normalize();
const head = new THREE.Group();

const skull = new THREE.Mesh(new THREE.IcosahedronGeometry(0.17, 0), crystalMat);
skull.scale.set(0.95, 0.85, 1.15);
skull.castShadow = true;
head.add(skull);

const snout = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.28, 6), crystalMat);
snout.rotation.x = Math.PI / 2;
snout.position.set(0, -0.02, 0.2);
snout.castShadow = true;
head.add(snout);

const jaw = new THREE.Mesh(new THREE.ConeGeometry(0.085, 0.2, 5), crystalMat);
jaw.rotation.x = Math.PI / 2;
jaw.position.set(0, -0.09, 0.16);
jaw.scale.set(1, 0.6, 1);
head.add(jaw);

for (const s of [-1, 1]) {
  const horn = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.42, 4), crystalMat);
  horn.position.set(0.07 * s, 0.13, -0.05);
  horn.rotation.set(-0.95, 0, 0.2 * s);
  horn.castShadow = true;
  head.add(horn);

  const ear = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.13, 4), crystalMat);
  ear.position.set(0.115 * s, 0.06, -0.01);
  ear.rotation.set(-0.3, 0, 0.6 * s);
  ear.castShadow = true;
  head.add(ear);

  const eye = new THREE.Mesh(new THREE.IcosahedronGeometry(0.036, 0), eyeMat);
  eye.position.set(0.11 * s, 0.035, 0.08);
  head.add(eye);
}

head.position.copy(Pe).add(Te.clone().multiplyScalar(0.12));
head.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), Te);
dragon.add(head);

/* Wings */
function makeWing() {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.lineTo(0.15, 0.35);
  s.lineTo(0.9, 0.95);
  s.lineTo(1.5, 1.15);
  s.lineTo(1.15, 0.7);
  s.lineTo(1.35, 0.5);
  s.lineTo(0.95, 0.33);
  s.lineTo(1.05, 0.08);
  s.lineTo(0.62, 0.04);
  s.lineTo(0.7, -0.22);
  s.lineTo(0.3, -0.03);
  s.lineTo(0.26, -0.3);
  s.lineTo(0.05, -0.04);
  s.lineTo(0, 0);
  const geo = new THREE.ExtrudeGeometry(s, {
    depth: 0.04, bevelEnabled: true, bevelThickness: 0.015, bevelSize: 0.015, bevelSegments: 1
  });
  geo.translate(0, 0, -0.02);
  const g = new THREE.Group();
  const mem = new THREE.Mesh(geo, wingMat);
  mem.castShadow = true;
  g.add(mem);
  const rods = [
    [0, 0, 0.9, 0.95], [0.9, 0.95, 1.5, 1.15], [0.9, 0.95, 1.35, 0.5],
    [0.9, 0.95, 1.05, 0.08], [0, 0, 0.65, 0.03]
  ];
  for (const [x1, y1, x2, y2] of rods) g.add(makeRod(x1, y1, x2, y2));
  return g;
}

const shoulder = curve.getPointAt(0.7);
const wingL = makeWing();
wingL.position.copy(shoulder).add(new THREE.Vector3(0.04, 0.14, -0.04));
wingL.rotation.set(0.2, -0.55, 0.32);
wingL.scale.setScalar(0.8);
dragon.add(wingL);

const wingR = makeWing();
wingR.position.copy(shoulder).add(new THREE.Vector3(-0.04, 0.14, -0.04));
wingR.rotation.set(0.2, -0.55, 0.32);
wingR.scale.set(-0.8, 0.8, 0.8);
dragon.add(wingR);

/* Forelimbs */
function makeLimb() {
  const pts = [
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(0.03, -0.13, 0.05),
    new THREE.Vector3(0.0, -0.24, 0.14)
  ];
  const c = new THREE.CatmullRomCurve3(pts);
  const geo = buildTubeGeometry(c, (tt) => 0.055 * (1 - 0.55 * tt) + 0.012, 24, 5);
  const g = new THREE.Group();
  const limb = new THREE.Mesh(geo, crystalMat);
  limb.castShadow = true;
  g.add(limb);
  for (let k = 0; k < 3; k++) {
    const claw = new THREE.Mesh(new THREE.ConeGeometry(0.014, 0.07, 4), crystalMat);
    claw.position.set((k - 1) * 0.035, -0.25, 0.17);
    claw.rotation.set(1.9, 0, 0);
    claw.castShadow = true;
    g.add(claw);
  }
  return g;
}

const chest = curve.getPointAt(0.63);
const limbL = makeLimb();
limbL.position.copy(chest).add(new THREE.Vector3(0.14, 0.02, 0.16));
limbL.rotation.set(0.1, 0.3, -0.2);
dragon.add(limbL);

const limbR = makeLimb();
limbR.position.copy(chest).add(new THREE.Vector3(-0.14, 0.02, 0.16));
limbR.rotation.set(0.1, -0.3, 0.2);
limbR.scale.x = -1;
dragon.add(limbR);

/* Internal sparkle */
const numSparks = 72;
for (let i = 0; i < numSparks; i++) {
  const t = 0.05 + Math.random() * 0.86;
  const p = curve.getPointAt(t);
  const tg = curve.getTangentAt(t).normalize();
  let up = new THREE.Vector3(0, 1, 0);
  if (Math.abs(tg.y) > 0.9) up.set(1, 0, 0);
  const n = new THREE.Vector3().crossVectors(tg, up).normalize();
  const b = new THREE.Vector3().crossVectors(tg, n).normalize();
  const rr = radiusFn(t) * 0.72 * Math.sqrt(Math.random());
  const a = Math.random() * Math.PI * 2;
  const pos = p.clone().addScaledVector(n, Math.cos(a) * rr).addScaledVector(b, Math.sin(a) * rr);
  const m = new THREE.Mesh(sparkGeo, sparkMat.clone());
  m.position.copy(pos);
  m.scale.setScalar(0.45 + Math.random() * 1.1);
  m.rotation.set(Math.random() * 6.28, Math.random() * 6.28, Math.random() * 6.28);
  dragon.add(m);
  sparkles.push({ m, phase: Math.random() * 6.28, speed: 1 + Math.random() * 3, base: 1.4 + Math.random() * 1.8, spin: (Math.random() - 0.5) * 2 });
}

/* ---------- Center & scale on ground ---------- */
let box = new THREE.Box3().setFromObject(dragon);
const ctr = box.getCenter(new THREE.Vector3());
dragon.position.x -= ctr.x;
dragon.position.z -= ctr.z;
dragon.position.y -= box.min.y;

box = new THREE.Box3().setFromObject(dragon);
const midY = (box.min.y + box.max.y) / 2;
controls.target.set(0, midY, 0);
controls.update();

/* soft internal glow */
const coreLight = new THREE.PointLight(0xb060ff, 0.9, 3.2, 2.0);
coreLight.position.set(0, midY, 0);
scene.add(coreLight);

/* ---------- Resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- Animate ---------- */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;
  for (const s of sparkles) {
    s.m.material.emissiveIntensity = s.base * (0.35 + 0.65 * Math.abs(Math.sin(t * s.speed + s.phase)));
    s.m.rotation.y += dt * s.spin;
  }
  coreLight.intensity = 0.75 + 0.25 * Math.sin(t * 1.6);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
