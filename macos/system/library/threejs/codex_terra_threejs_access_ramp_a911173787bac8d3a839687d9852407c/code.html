<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADA Access Ramp</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #b9c4cc; }
  canvas { display: block; }
  .label {
    position: fixed; left: 18px; bottom: 16px; color: rgba(255,255,255,.86);
    font: 12px/1.45 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase;
    pointer-events: none; text-shadow: 0 1px 3px #0008;
  }
</style>
</head>
<body>
<div class="label">ADA-style accessibility ramp · drag to orbit · scroll to zoom</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9c4cc);
scene.fog = new THREE.Fog(0xb9c4cc, 18, 42);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.05, 100);
camera.position.set(9.2, 6.2, 10.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, 0.4);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
controls.minDistance = 5;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.48;

const hemi = new THREE.HemisphereLight(0xdcecff, 0x5d5148, 2.0);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff2d6, 3.2);
sun.position.set(-7, 11, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12;
sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;
sun.shadow.camera.bottom = -12;
sun.shadow.camera.near = 0.1;
sun.shadow.camera.far = 35;
sun.shadow.bias = -0.00015;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xa9c8e8, 0.7);
fill.position.set(8, 5, -7);
scene.add(fill);

const groundMat = new THREE.MeshStandardMaterial({ color: 0x7f887d, roughness: 0.93, metalness: 0 });
const concreteMat = new THREE.MeshStandardMaterial({ color: 0xa7a39b, roughness: 0.82, metalness: 0 });
const edgeMat = new THREE.MeshStandardMaterial({ color: 0x8d8981, roughness: 0.72, metalness: 0 });
const steelMat = new THREE.MeshStandardMaterial({ color: 0x4c5559, roughness: 0.28, metalness: 0.78 });
const footMat = new THREE.MeshStandardMaterial({ color: 0x3e4548, roughness: 0.48, metalness: 0.62 });
const tactileMat = new THREE.MeshStandardMaterial({ color: 0x735d2e, roughness: 0.75, metalness: 0.05 });

function mesh(geometry, material, position = [0, 0, 0], cast = true, receive = true) {
  const m = new THREE.Mesh(geometry, material);
  m.position.set(...position);
  m.castShadow = cast;
  m.receiveShadow = receive;
  scene.add(m);
  return m;
}

const ground = mesh(new THREE.PlaneGeometry(30, 30), groundMat, [0, -0.012, 0], false, true);
ground.rotation.x = -Math.PI / 2;

const rampWidth = 1.52;
const run = 7.32;
const rise = 0.61;
const rampStartZ = -3.66;
const rampEndZ = 3.66;
const deckThickness = 0.18;
const slopeAngle = Math.atan2(rise, run);
const rampLength = Math.hypot(run, rise);

const rampDeck = mesh(
  new THREE.BoxGeometry(rampWidth, deckThickness, rampLength),
  concreteMat,
  [0, rise / 2 - deckThickness / 2, 0]
);
rampDeck.rotation.x = slopeAngle;

const landingLength = 1.52;
const landingCenterZ = rampEndZ + landingLength / 2;
mesh(
  new THREE.BoxGeometry(rampWidth, deckThickness, landingLength),
  concreteMat,
  [0, rise - deckThickness / 2, landingCenterZ]
);

const lowerPadLength = 1.52;
const lowerPadCenterZ = rampStartZ - lowerPadLength / 2;
mesh(
  new THREE.BoxGeometry(rampWidth, deckThickness, lowerPadLength),
  concreteMat,
  [0, -deckThickness / 2, lowerPadCenterZ]
);

function addCurbs(zCenter, length, yCenter, rotationX = 0) {
  for (const side of [-1, 1]) {
    const curb = mesh(
      new THREE.BoxGeometry(0.11, 0.11, length),
      edgeMat,
      [side * (rampWidth / 2 - 0.055), yCenter, zCenter]
    );
    curb.rotation.x = rotationX;
  }
}
addCurbs(0, rampLength, rise / 2 + 0.02, slopeAngle);
addCurbs(landingCenterZ, landingLength, rise + 0.02);
addCurbs(lowerPadCenterZ, lowerPadLength, 0.02);

const grooveMat = new THREE.MeshStandardMaterial({ color: 0x8c8983, roughness: 0.9 });
for (let i = 1; i <= 12; i++) {
  const t = i / 13;
  const z = rampStartZ + run * t;
  const y = rise * t + 0.008;
  const groove = mesh(new THREE.BoxGeometry(rampWidth - 0.24, 0.012, 0.018), grooveMat, [0, y, z], false, true);
  groove.rotation.x = slopeAngle;
}

const domeGeo = new THREE.SphereGeometry(0.028, 10, 7);
for (let row = 0; row < 4; row++) {
  for (let col = 0; col < 18; col++) {
    const x = -0.59 + col * 0.069;
    const z = rampStartZ - 0.6 + row * 0.105;
    const dome = mesh(domeGeo, tactileMat, [x, 0.02, z], true, true);
    dome.scale.y = 0.55;
  }
}

function cylinderBetween(a, b, radius, material) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const direction = new THREE.Vector3().subVectors(end, start);
  const c = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, direction.length(), 16),
    material
  );
  c.position.copy(start).add(end).multiplyScalar(0.5);
  c.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  c.castShadow = true;
  c.receiveShadow = true;
  scene.add(c);
  return c;
}

const railX = rampWidth / 2 + 0.09;
const railHeight = 0.865;
const lowerRailOffset = 0.205;
const railBottomOffset = 0.10;
const rampPostTs = [0.02, 0.26, 0.5, 0.74, 0.98];
const topYAt = t => rise * t;
const zAt = t => rampStartZ + run * t;

for (const side of [-1, 1]) {
  const x = side * railX;
  for (const t of rampPostTs) {
    const deckY = topYAt(t);
    const z = zAt(t);
    cylinderBetween([x, deckY + railBottomOffset, z], [x, deckY + railHeight, z], 0.028, steelMat);
    mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.012, 16), footMat, [x, deckY + 0.012, z], true, true);
  }
  cylinderBetween(
    [x, railHeight, rampStartZ - 0.18],
    [x, rise + railHeight, rampEndZ + 0.18],
    0.032, steelMat
  );
  cylinderBetween(
    [x, lowerRailOffset, rampStartZ],
    [x, rise + lowerRailOffset, rampEndZ],
    0.022, steelMat
  );

  const landingPostZ = [rampEndZ + 0.03, rampEndZ + 0.78, rampEndZ + 1.45];
  for (const z of landingPostZ) {
    cylinderBetween([x, rise + railBottomOffset, z], [x, rise + railHeight, z], 0.028, steelMat);
    mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.012, 16), footMat, [x, rise + 0.012, z], true, true);
  }
  cylinderBetween([x, rise + railHeight, rampEndZ], [x, rise + railHeight, rampEndZ + landingLength], 0.032, steelMat);
  cylinderBetween([x, rise + lowerRailOffset, rampEndZ], [x, rise + lowerRailOffset, rampEndZ + landingLength], 0.022, steelMat);

  cylinderBetween([x, railHeight, rampStartZ - 0.72], [x, railHeight, rampStartZ + 0.15], 0.032, steelMat);
  cylinderBetween([x, lowerRailOffset, rampStartZ - 0.42], [x, lowerRailOffset, rampStartZ + 0.05], 0.022, steelMat);
  cylinderBetween([x, railHeight, rampEndZ + landingLength - 0.1], [x, railHeight, rampEndZ + landingLength + 0.48], 0.032, steelMat);
}

for (const side of [-1, 1]) {
  const x = side * railX;
  cylinderBetween([x, 0.10, rampStartZ - 0.61], [x, railHeight, rampStartZ - 0.61], 0.028, steelMat);
  mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.012, 16), footMat, [x, 0.012, rampStartZ - 0.61], true, true);
  cylinderBetween([x, rise + 0.10, rampEndZ + landingLength + 0.39], [x, rise + railHeight, rampEndZ + landingLength + 0.39], 0.028, steelMat);
  mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.012, 16), footMat, [x, rise + 0.012, rampEndZ + landingLength + 0.39], true, true);
}

const retainingMat = new THREE.MeshStandardMaterial({ color: 0x777873, roughness: 0.9 });
mesh(new THREE.BoxGeometry(4.2, 0.38, 1.05), retainingMat, [0, rise - 0.19, rampEndZ + landingLength + 0.61], true, true);

const signPost = cylinderBetween([-1.85, 0.02, 3.55], [-1.85, 1.75, 3.55], 0.025, steelMat);
const sign = mesh(new THREE.BoxGeometry(0.52, 0.65, 0.035), new THREE.MeshStandardMaterial({ color: 0x285e8e, roughness: 0.45, metalness: 0.12 }), [-1.85, 1.62, 3.55], true, true);
const signFace = mesh(new THREE.CircleGeometry(0.12, 24), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 }), [-1.85, 1.65, 3.529], false, true);
signFace.rotation.y = Math.PI;

const axes = new THREE.AxesHelper(0);
scene.add(axes);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
