<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Porcelain Mermaid Figurine</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #dbe8e8; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdcebea);
scene.fog = new THREE.Fog(0xdcebea, 8, 18);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.4, 3.9, 7.6);
camera.lookAt(0, 1.55, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 5;
controls.maxDistance = 11;
controls.target.set(0, 1.45, 0);

const porcelain = new THREE.MeshPhysicalMaterial({
  color: 0xf5fbf8,
  roughness: 0.17,
  metalness: 0.02,
  clearcoat: 0.8,
  clearcoatRoughness: 0.1
});
const aqua = new THREE.MeshPhysicalMaterial({
  color: 0x80d9d0,
  roughness: 0.2,
  metalness: 0.04,
  clearcoat: 0.85,
  clearcoatRoughness: 0.08
});
const aquaDeep = new THREE.MeshPhysicalMaterial({
  color: 0x3caea9,
  roughness: 0.22,
  metalness: 0.03,
  clearcoat: 0.75
});
const gold = new THREE.MeshPhysicalMaterial({
  color: 0xd7a93d,
  roughness: 0.18,
  metalness: 0.82,
  clearcoat: 0.55,
  clearcoatRoughness: 0.12
});
const darkGlaze = new THREE.MeshPhysicalMaterial({
  color: 0x315c5b,
  roughness: 0.2,
  metalness: 0.05,
  clearcoat: 0.5
});

const figurine = new THREE.Group();
scene.add(figurine);

function smoothSphere(name, position, scale, material, segments = 32) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, segments, 20), material);
  mesh.name = name;
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  figurine.add(mesh);
  return mesh;
}

function tube(name, points, radius, material, tubular = 28) {
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, tubular, radius, 12, false), material);
  mesh.name = name;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  figurine.add(mesh);
  return mesh;
}

function cylinderBetween(name, start, end, radius, material, radial = 20) {
  const direction = new THREE.Vector3().subVectors(end, start);
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius * 1.08, direction.length(), radial), material);
  mesh.name = name;
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  figurine.add(mesh);
  return mesh;
}

function torus(name, position, major, minor, material, rotation = new THREE.Euler()) {
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(major, minor, 12, 48), material);
  mesh.name = name;
  mesh.position.copy(position);
  mesh.rotation.copy(rotation);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  figurine.add(mesh);
  return mesh;
}

function shell(position, rotation, scale = 1) {
  const shellGroup = new THREE.Group();
  shellGroup.position.copy(position);
  shellGroup.rotation.copy(rotation);
  figurine.add(shellGroup);

  const fan = new THREE.Mesh(new THREE.ConeGeometry(0.18 * scale, 0.16 * scale, 9, 1), gold);
  fan.rotation.x = Math.PI / 2;
  fan.scale.y = 0.72;
  fan.castShadow = true;
  shellGroup.add(fan);

  for (let i = -2; i <= 2; i++) {
    const ridge = new THREE.Mesh(new THREE.TorusGeometry(0.075 * scale, 0.012 * scale, 6, 18, Math.PI), gold);
    ridge.rotation.set(Math.PI / 2, 0, i * 0.22);
    ridge.position.z = 0.075 * scale;
    shellGroup.add(ridge);
  }
  return shellGroup;
}

const base = new THREE.Mesh(new THREE.CylinderGeometry(2.18, 2.3, 0.3, 64), aquaDeep);
base.position.y = 0.15;
base.castShadow = true;
base.receiveShadow = true;
figurine.add(base);

const baseTop = new THREE.Mesh(new THREE.CylinderGeometry(1.9, 2.08, 0.13, 64), porcelain);
baseTop.position.y = 0.34;
baseTop.castShadow = true;
baseTop.receiveShadow = true;
figurine.add(baseTop);

tube('front wave', [
  new THREE.Vector3(-1.95, 0.4, 0.35),
  new THREE.Vector3(-1.3, 0.55, 0.68),
  new THREE.Vector3(-0.55, 0.43, 0.78),
  new THREE.Vector3(0.2, 0.56, 0.7),
  new THREE.Vector3(0.9, 0.43, 0.56),
  new THREE.Vector3(1.65, 0.56, 0.27)
], 0.11, aqua);

tube('curling base wave', [
  new THREE.Vector3(1.62, 0.42, 0.28),
  new THREE.Vector3(1.95, 0.7, 0.16),
  new THREE.Vector3(1.86, 0.98, 0.04),
  new THREE.Vector3(1.53, 1.0, 0.02),
  new THREE.Vector3(1.42, 0.78, 0.03)
], 0.1, aquaDeep);

torus('golden pedestal rim', new THREE.Vector3(0, 0.38, 0), 1.95, 0.035, gold, new THREE.Euler(0, 0, 0));

shell(new THREE.Vector3(-1.45, 0.47, 0.78), new THREE.Euler(-0.15, 0, 0.1), 0.82);
shell(new THREE.Vector3(-0.62, 0.48, 0.98), new THREE.Euler(-0.2, 0, -0.08), 0.62);
shell(new THREE.Vector3(0.62, 0.48, 0.97), new THREE.Euler(-0.2, 0, 0.06), 0.62);
shell(new THREE.Vector3(1.42, 0.48, 0.7), new THREE.Euler(-0.12, 0, -0.1), 0.78);

const tailPath = [
  new THREE.Vector3(0, 2.0, 0),
  new THREE.Vector3(0.08, 1.62, 0.02),
  new THREE.Vector3(0.3, 1.24, 0.05),
  new THREE.Vector3(0.38, 0.9, 0.08),
  new THREE.Vector3(0.16, 0.66, 0.12),
  new THREE.Vector3(-0.34, 0.58, 0.14),
  new THREE.Vector3(-0.78, 0.7, 0.12),
  new THREE.Vector3(-1.02, 0.95, 0.05),
  new THREE.Vector3(-0.92, 1.2, -0.04)
];
tube('porcelain aqua tail', tailPath, 0.29, aqua, 46);

const tailTip = new THREE.Mesh(new THREE.ConeGeometry(0.38, 0.92, 24), aqua);
tailTip.position.set(-0.92, 1.3, -0.04);
tailTip.rotation.z = -0.85;
tailTip.scale.set(0.42, 1, 0.16);
tailTip.castShadow = true;
figurine.add(tailTip);

for (let i = 0; i < 5; i++) {
  const y = 0.78 + i * 0.2;
  const ring = torus('tail gold scale band', new THREE.Vector3(0.22 + Math.sin(i * 0.8) * 0.08, y, 0.08), 0.31 - i * 0.018, 0.018, gold);
  ring.rotation.x = Math.PI / 2;
  ring.rotation.z = -0.2;
}

smoothSphere('torso', new THREE.Vector3(0, 2.47, 0), new THREE.Vector3(0.47, 0.66, 0.34), porcelain);
smoothSphere('chest aqua accent', new THREE.Vector3(0, 2.5, 0.31), new THREE.Vector3(0.32, 0.26, 0.045), aqua);
torus('necklace', new THREE.Vector3(0, 2.84, 0), 0.31, 0.025, gold, new THREE.Euler(Math.PI / 2, 0, 0));

const head = smoothSphere('head', new THREE.Vector3(0, 3.18, 0), new THREE.Vector3(0.43, 0.48, 0.38), porcelain);
smoothSphere('left eye', new THREE.Vector3(-0.145, 3.23, 0.345), new THREE.Vector3(0.035, 0.052, 0.018), darkGlaze, 16);
smoothSphere('right eye', new THREE.Vector3(0.145, 3.23, 0.345), new THREE.Vector3(0.035, 0.052, 0.018), darkGlaze, 16);
smoothSphere('cheek left', new THREE.Vector3(-0.22, 3.08, 0.335), new THREE.Vector3(0.055, 0.032, 0.016), aqua, 16);
smoothSphere('cheek right', new THREE.Vector3(0.22, 3.08, 0.335), new THREE.Vector3(0.055, 0.032, 0.016), aqua, 16);

const hairCurves = [
  [new THREE.Vector3(-0.3, 3.52, 0), new THREE.Vector3(-0.76, 3.45, -0.03), new THREE.Vector3(-1.03, 3.12, 0.02), new THREE.Vector3(-0.9, 2.65, 0.08), new THREE.Vector3(-0.55, 2.35, 0.02)],
  [new THREE.Vector3(-0.12, 3.58, -0.02), new THREE.Vector3(-0.72, 3.7, -0.1), new THREE.Vector3(-1.25, 3.4, -0.12), new THREE.Vector3(-1.22, 2.9, -0.05), new THREE.Vector3(-0.87, 2.55, 0.05)],
  [new THREE.Vector3(0.25, 3.54, 0), new THREE.Vector3(0.76, 3.52, -0.04), new THREE.Vector3(1.04, 3.18, 0.02), new THREE.Vector3(0.88, 2.7, 0.08), new THREE.Vector3(0.55, 2.42, 0.02)],
  [new THREE.Vector3(0.38, 3.35, -0.08), new THREE.Vector3(0.92, 3.2, -0.16), new THREE.Vector3(1.27, 2.88, -0.14), new THREE.Vector3(1.18, 2.55, -0.04)]
];
hairCurves.forEach((path, index) => tube('flowing hair ' + index, path, index === 1 ? 0.13 : 0.1, aquaDeep, 30));

const leftShoulder = new THREE.Vector3(-0.34, 2.75, 0);
const leftElbow = new THREE.Vector3(-0.72, 2.43, 0.03);
const leftHand = new THREE.Vector3(-0.95, 2.15, 0.17);
cylinderBetween('left upper arm', leftShoulder, leftElbow, 0.1, porcelain);
cylinderBetween('left forearm', leftElbow, leftHand, 0.085, porcelain);
smoothSphere('left hand', leftHand, new THREE.Vector3(0.12, 0.16, 0.1), porcelain);

const rightShoulder = new THREE.Vector3(0.34, 2.76, 0);
const rightElbow = new THREE.Vector3(0.65, 2.98, 0.02);
const rightHand = new THREE.Vector3(0.88, 3.22, 0.12);
cylinderBetween('right upper arm', rightShoulder, rightElbow, 0.1, porcelain);
cylinderBetween('right forearm', rightElbow, rightHand, 0.085, porcelain);
smoothSphere('right hand', rightHand, new THREE.Vector3(0.12, 0.16, 0.1), porcelain);

for (let i = 0; i < 3; i++) {
  const finger = new THREE.Mesh(new THREE.CapsuleGeometry(0.025, 0.12, 6, 10), porcelain);
  finger.position.set(-1.02 + i * 0.055, 2.05 + i * 0.015, 0.17);
  finger.rotation.z = -0.35 + i * 0.12;
  finger.castShadow = true;
  figurine.add(finger);
}

const finLeft = new THREE.Mesh(new THREE.ConeGeometry(0.18, 0.58, 18), aqua);
finLeft.position.set(-1.12, 1.25, 0.02);
finLeft.rotation.z = -1.25;
finLeft.scale.set(0.35, 1, 0.12);
finLeft.castShadow = true;
figurine.add(finLeft);

const finRight = finLeft.clone();
finRight.position.x = -0.72;
finRight.rotation.z = -1.9;
figurine.add(finRight);

const keyLight = new THREE.DirectionalLight(0xfff6df, 4.2);
keyLight.position.set(4, 7, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x9edbdc, 2.2);
fillLight.position.set(-5, 4, 2);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xffdca0, 2.8, 8);
rimLight.position.set(1.5, 4.8, -2.5);
scene.add(rimLight);

scene.add(new THREE.HemisphereLight(0xf4ffff, 0x60878a, 1.7));

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(9, 64),
  new THREE.MeshStandardMaterial({ color: 0xc5d9d8, roughness: 0.82, metalness: 0 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.015;
floor.receiveShadow = true;
scene.add(floor);

const shadowDisc = new THREE.Mesh(
  new THREE.CircleGeometry(2.65, 64),
  new THREE.MeshBasicMaterial({ color: 0x729292, transparent: true, opacity: 0.12 })
);
shadowDisc.rotation.x = -Math.PI / 2;
shadowDisc.position.y = 0.006;
shadowDisc.scale.set(1, 0.52, 1);
scene.add(shadowDisc);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
