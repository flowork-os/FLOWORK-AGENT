<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Houseplant</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #d9e2dc; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9e2dc);
scene.fog = new THREE.Fog(0xd9e2dc, 145, 260);

const camera = new THREE.PerspectiveCamera(39, innerWidth / innerHeight, 0.1, 500);
camera.position.set(104, 77, 116);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 55;
controls.maxDistance = 220;
controls.target.set(0, 40, 0);
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xf0f5ed, 0x675647, 2.15));

const keyLight = new THREE.DirectionalLight(0xfff1d6, 3.2);
keyLight.position.set(-72, 135, 86);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -105;
keyLight.shadow.camera.right = 105;
keyLight.shadow.camera.top = 160;
keyLight.shadow.camera.bottom = -35;
keyLight.shadow.bias = -0.00025;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xbfd7ff, 0.75);
fillLight.position.set(90, 70, -80);
scene.add(fillLight);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xc6d0ca,
  roughness: 0.86,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(230, 96), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1;
floor.receiveShadow = true;
scene.add(floor);

const saucerMaterial = new THREE.MeshStandardMaterial({
  color: 0x9b5b3e,
  roughness: 0.34,
  metalness: 0.02
});
const saucerProfile = [
  new THREE.Vector2(0, 0),
  new THREE.Vector2(11.5, 0),
  new THREE.Vector2(16.6, 0.45),
  new THREE.Vector2(18.3, 1.55),
  new THREE.Vector2(17.8, 2.7),
  new THREE.Vector2(16.2, 3.45),
  new THREE.Vector2(12.6, 3.65),
  new THREE.Vector2(0, 3.65)
];
const saucer = new THREE.Mesh(new THREE.LatheGeometry(saucerProfile, 64), saucerMaterial);
saucer.position.y = 0;
saucer.castShadow = true;
saucer.receiveShadow = true;
scene.add(saucer);

const potMaterial = new THREE.MeshStandardMaterial({
  color: 0xb76b4a,
  roughness: 0.38,
  metalness: 0.015
});
const potProfile = [
  new THREE.Vector2(10.8, 0),
  new THREE.Vector2(11.8, 0.8),
  new THREE.Vector2(12.6, 3.0),
  new THREE.Vector2(13.25, 13.8),
  new THREE.Vector2(13.7, 16.0),
  new THREE.Vector2(14.25, 16.65),
  new THREE.Vector2(14.25, 17.35),
  new THREE.Vector2(13.55, 17.85),
  new THREE.Vector2(12.55, 17.65),
  new THREE.Vector2(12.2, 16.55),
  new THREE.Vector2(11.85, 14.1),
  new THREE.Vector2(11.35, 3.3),
  new THREE.Vector2(10.45, 1.0)
];
const pot = new THREE.Mesh(new THREE.LatheGeometry(potProfile, 72), potMaterial);
pot.position.y = 2.2;
pot.castShadow = true;
pot.receiveShadow = true;
scene.add(pot);

const rim = new THREE.Mesh(
  new THREE.TorusGeometry(13.67, 0.62, 18, 72),
  new THREE.MeshStandardMaterial({ color: 0xa85d41, roughness: 0.32 })
);
rim.rotation.x = Math.PI / 2;
rim.position.y = 19.1;
rim.castShadow = true;
scene.add(rim);

const soil = new THREE.Mesh(
  new THREE.CylinderGeometry(12.18, 12.18, 0.72, 64),
  new THREE.MeshStandardMaterial({ color: 0x3c2419, roughness: 1 })
);
soil.position.y = 19.25;
soil.receiveShadow = true;
scene.add(soil);

const soilSpeckMaterial = new THREE.MeshStandardMaterial({ color: 0x6a4229, roughness: 1 });
for (let i = 0; i < 24; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = Math.sqrt(Math.random()) * 11.3;
  const speck = new THREE.Mesh(
    new THREE.SphereGeometry(0.34 + Math.random() * 0.42, 7, 5),
    soilSpeckMaterial
  );
  speck.scale.y = 0.45;
  speck.position.set(Math.cos(angle) * radius, 19.72, Math.sin(angle) * radius);
  speck.castShadow = true;
  scene.add(speck);
}

const stemMaterial = new THREE.MeshStandardMaterial({
  color: 0x315c32,
  roughness: 0.72
});
const veinMaterial = new THREE.MeshStandardMaterial({
  color: 0x6d984d,
  roughness: 0.7
});
const leafMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x3e783f, roughness: 0.63, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x518d49, roughness: 0.59, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x2f6939, roughness: 0.67, side: THREE.DoubleSide })
];

function makeLeafGeometry(length, width) {
  const longitudinal = 22;
  const lateral = 10;
  const vertices = [];
  const indices = [];
  for (let i = 0; i <= longitudinal; i++) {
    const u = i / longitudinal;
    const taper = Math.pow(Math.sin(Math.PI * u), 0.62);
    for (let j = 0; j <= lateral; j++) {
      const v = j / lateral * 2 - 1;
      const edgeSoftness = 0.97 - 0.08 * u;
      const x = v * width * taper * edgeSoftness;
      const y = u * length;
      const z = Math.pow(1 - Math.abs(v), 1.6) * Math.sin(Math.PI * u) * 0.92;
      vertices.push(x, y, z);
    }
  }
  for (let i = 0; i < longitudinal; i++) {
    for (let j = 0; j < lateral; j++) {
      const a = i * (lateral + 1) + j;
      const b = a + 1;
      const c = a + lateral + 1;
      const d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function addStemAndLeaf(index, angle, height, radius, length, width, material) {
  const base = new THREE.Vector3(0, 19.45, 0);
  const endpoint = new THREE.Vector3(
    Math.cos(angle) * radius,
    height,
    Math.sin(angle) * radius
  );
  const control1 = new THREE.Vector3(
    Math.cos(angle) * radius * 0.18,
    30 + height * 0.08,
    Math.sin(angle) * radius * 0.18
  );
  const control2 = new THREE.Vector3(
    Math.cos(angle) * radius * 0.78,
    height - 6,
    Math.sin(angle) * radius * 0.78
  );
  const curve = new THREE.CubicBezierCurve3(base, control1, control2, endpoint);
  const stem = new THREE.Mesh(new THREE.TubeGeometry(curve, 22, 0.58, 9, false), stemMaterial);
  stem.castShadow = true;
  scene.add(stem);

  const leafDirection = new THREE.Vector3(
    Math.cos(angle) * 0.62 + Math.cos(angle + 0.5) * 0.12,
    0.73 + index * 0.008,
    Math.sin(angle) * 0.62 + Math.sin(angle + 0.5) * 0.12
  ).normalize();

  const leafGroup = new THREE.Group();
  leafGroup.position.copy(endpoint);
  const directionQuaternion = new THREE.Quaternion();
  directionQuaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), leafDirection);
  leafGroup.quaternion.copy(directionQuaternion);
  leafGroup.rotateY((index % 2 === 0 ? 1 : -1) * (0.16 + (index % 3) * 0.08));

  const leaf = new THREE.Mesh(makeLeafGeometry(length, width), material);
  leaf.position.y = 0.2;
  leaf.rotation.z = (index % 2 === 0 ? 1 : -1) * 0.045;
  leaf.castShadow = true;
  leaf.receiveShadow = true;
  leafGroup.add(leaf);

  const vein = new THREE.Mesh(
    new THREE.CylinderGeometry(0.075, 0.16, length * 0.88, 8),
    veinMaterial
  );
  vein.position.set(0, length * 0.46, 0.42);
  vein.castShadow = true;
  leafGroup.add(vein);

  scene.add(leafGroup);
}

const leafData = [
  [-2.85, 49, 19, 30, 12],
  [-2.25, 61, 24, 34, 13],
  [-1.73, 72, 22, 29, 12],
  [-1.25, 55, 29, 32, 14],
  [-0.72, 79, 20, 27, 11],
  [-0.2, 67, 26, 35, 14],
  [0.35, 82, 21, 30, 12],
  [0.78, 58, 28, 33, 13],
  [1.28, 73, 24, 31, 13],
  [1.82, 52, 25, 29, 12],
  [2.3, 64, 22, 35, 14],
  [2.82, 47, 20, 28, 11]
];

leafData.forEach((entry, index) => {
  addStemAndLeaf(index, entry[0], entry[1], entry[2], entry[3], entry[4], leafMaterials[index % leafMaterials.length]);
});

const centralCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 19.3, 0),
  new THREE.Vector3(0.8, 35, 0.2),
  new THREE.Vector3(-1.1, 54, -0.2),
  new THREE.Vector3(0.2, 77, 0)
]);
const centralStem = new THREE.Mesh(
  new THREE.TubeGeometry(centralCurve, 28, 0.72, 10, false),
  stemMaterial
);
centralStem.castShadow = true;
scene.add(centralStem);

const bud = new THREE.Mesh(
  new THREE.SphereGeometry(1.5, 16, 12),
  new THREE.MeshStandardMaterial({ color: 0x4c813c, roughness: 0.66 })
);
bud.position.set(0.2, 77, 0);
bud.scale.set(0.75, 1.5, 0.75);
bud.castShadow = true;
scene.add(bud);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
