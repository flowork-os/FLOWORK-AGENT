<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Late-Night Ramen Shop</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090b18;
    }
    canvas { display: block; }
    #title {
      position: fixed;
      left: 24px;
      bottom: 20px;
      color: #ffe4b0;
      font: 600 13px/1.4 system-ui, sans-serif;
      letter-spacing: .22em;
      text-transform: uppercase;
      text-shadow: 0 2px 10px #000;
      opacity: .8;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="title">Midnight Ramen · 深夜ラーメン</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // -------------------------------------------------------------------------
    // Core setup
    // -------------------------------------------------------------------------

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090c1b);
    scene.fog = new THREE.FogExp2(0x0b0d18, 0.025);

    const camera = new THREE.PerspectiveCamera(
      42,
      innerWidth / innerHeight,
      0.1,
      120
    );
    camera.position.set(12.5, 8.5, 16.5);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.25, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.32;
    controls.minDistance = 10;
    controls.maxDistance = 28;
    controls.maxPolarAngle = Math.PI * 0.49;

    // -------------------------------------------------------------------------
    // Seeded randomness and shared helpers
    // -------------------------------------------------------------------------

    let seed = 0x5eeda11;
    function random() {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let t = seed;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }

    function range(a, b) {
      return a + (b - a) * random();
    }

    function mat(color, roughness = 0.7, metalness = 0) {
      return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness
      });
    }

    const materials = {
      darkWood: mat(0x3a2018, 0.72),
      wood: mat(0x79432a, 0.62),
      paleWood: mat(0xa9683d, 0.67),
      trim: mat(0x241512, 0.8),
      plaster: mat(0xbaa984, 0.95),
      tile: mat(0x303a3b, 0.72),
      steel: mat(0x7c8583, 0.28, 0.72),
      blackSteel: mat(0x17191a, 0.35, 0.75),
      ceramic: mat(0xe8ddc5, 0.36),
      redCeramic: mat(0x8d201a, 0.45),
      cloth: mat(0x263b64, 0.95),
      red: mat(0xb9271e, 0.72),
      black: mat(0x111013, 0.72),
      paper: mat(0xf4d6a0, 0.84),
      noodle: mat(0xe9c875, 0.62),
      broth: mat(0x7c3217, 0.22),
      green: mat(0x487737, 0.82),
      pink: mat(0xd47d78, 0.75),
      bottle: new THREE.MeshPhysicalMaterial({
        color: 0x294e3b,
        roughness: 0.2,
        transmission: 0.12,
        transparent: true,
        opacity: 0.88
      })
    };

    function mesh(geometry, material, parent = scene) {
      const object = new THREE.Mesh(geometry, material);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function box(w, h, d, material, x, y, z, parent = scene) {
      const object = mesh(
        new THREE.BoxGeometry(w, h, d),
        material,
        parent
      );
      object.position.set(x, y, z);
      return object;
    }

    function cylinder(rt, rb, h, segments, material, x, y, z, parent = scene) {
      const object = mesh(
        new THREE.CylinderGeometry(rt, rb, h, segments),
        material,
        parent
      );
      object.position.set(x, y, z);
      return object;
    }

    function canvasTexture(width, height, draw) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d');
      draw(context, width, height);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    function roundedRect(context, x, y, w, h, radius) {
      context.beginPath();
      context.roundRect(x, y, w, h, radius);
    }

    // -------------------------------------------------------------------------
    // Procedural textures
    // -------------------------------------------------------------------------

    const floorTexture = canvasTexture(512, 512, (ctx, w, h) => {
      ctx.fillStyle = '#303335';
      ctx.fillRect(0, 0, w, h);
      for (let y = 0; y < h; y += 64) {
        for (let x = 0; x < w; x += 64) {
          const odd = ((x + y) / 64) % 2;
          ctx.fillStyle = odd ? '#353839' : '#2b2f31';
          ctx.fillRect(x + 2, y + 2, 60, 60);
          ctx.strokeStyle = 'rgba(255,255,255,.035)';
          ctx.strokeRect(x + 4, y + 4, 56, 56);
        }
      }
      for (let i = 0; i < 900; i++) {
        const v = Math.floor(range(40, 90));
        ctx.fillStyle = `rgba(${v},${v},${v},${range(.02, .08)})`;
        ctx.fillRect(range(0, w), range(0, h), 2, 2);
      }
    });
    floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
    floorTexture.repeat.set(5, 4);

    const woodTexture = canvasTexture(512, 256, (ctx, w, h) => {
      const gradient = ctx.createLinearGradient(0, 0, 0, h);
      gradient.addColorStop(0, '#9a5a32');
      gradient.addColorStop(.5, '#704025');
      gradient.addColorStop(1, '#4e2a1d');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);
      for (let i = 0; i < 45; i++) {
        ctx.strokeStyle = `rgba(38,16,10,${range(.06, .2)})`;
        ctx.lineWidth = range(1, 4);
        ctx.beginPath();
        const y = range(0, h);
        ctx.moveTo(0, y);
        for (let x = 0; x <= w; x += 24) {
          ctx.lineTo(x, y + Math.sin(x * .025 + i) * range(1, 7));
        }
        ctx.stroke();
      }
    });

    const signTexture = canvasTexture(768, 180, (ctx, w, h) => {
      ctx.fillStyle = '#efe2be';
      ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = '#8e2d25';
      ctx.lineWidth = 12;
      ctx.strokeRect(8, 8, w - 16, h - 16);
      ctx.fillStyle = '#24201a';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 75px serif';
      ctx.fillText('深 夜 ラ ー メ ン', w / 2, h / 2 + 3);
      for (let i = 0; i < 70; i++) {
        ctx.fillStyle = `rgba(90,60,30,${range(.02, .08)})`;
        ctx.fillRect(range(0, w), range(0, h), range(1, 5), range(1, 5));
      }
    });

    const norenTextures = ['ら', 'ー', 'め', 'ん'].map(character =>
      canvasTexture(180, 280, (ctx, w, h) => {
        ctx.fillStyle = '#273d67';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = 'rgba(255,255,255,.055)';
        for (let x = 0; x < w; x += 7) ctx.fillRect(x, 0, 2, h);
        ctx.fillStyle = '#f4e4c2';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 105px serif';
        ctx.fillText(character, w / 2, h / 2 - 5);
      })
    );

    const steamTexture = canvasTexture(128, 128, (ctx, w, h) => {
      const gradient = ctx.createRadialGradient(
        w / 2, h / 2, 4,
        w / 2, h / 2, w / 2
      );
      gradient.addColorStop(0, 'rgba(255,255,245,.56)');
      gradient.addColorStop(.3, 'rgba(255,255,245,.25)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);
    });

    // -------------------------------------------------------------------------
    // Environment shell
    // -------------------------------------------------------------------------

    const floorMat = new THREE.MeshStandardMaterial({
      map: floorTexture,
      color: 0x777777,
      roughness: 0.82
    });

    box(24, .25, 18, floorMat, 0, -.15, 1);
    box(15.5, 7.4, .32, materials.plaster, 0, 3.55, -4.25);
    box(.35, 7.4, 10.5, materials.darkWood, -7.55, 3.55, .85);
    box(.35, 7.4, 10.5, materials.darkWood, 7.55, 3.55, .85);
    box(15.8, .34, 10.8, materials.trim, 0, 7.25, .9);

    for (let i = 0; i < 8; i++) {
      box(
        .13, 7.1, .16,
        materials.darkWood,
        -7 + i * 2,
        3.55,
        -4.03
      );
    }

    box(7.1, .18, .12, materials.trim, -3.9, 4.78, -3.98);
    box(7.1, .18, .12, materials.trim, 3.9, 2.15, -3.98);

    const sign = box(
      6.2, 1.42, .2,
      new THREE.MeshStandardMaterial({
        map: signTexture,
        roughness: .75,
        emissive: 0x4a2814,
        emissiveIntensity: .17
      }),
      0, 6.23, -3.96
    );

    // Outer alley suggestion and moonlit pavement
    box(24, .12, 5, mat(0x161b26, .9), 0, -.02, 9.2);
    for (let i = 0; i < 25; i++) {
      const puddle = mesh(
        new THREE.CircleGeometry(range(.1, .45), 20),
        new THREE.MeshStandardMaterial({
          color: 0x253d56,
          roughness: .12,
          metalness: .15,
          transparent: true,
          opacity: .45
        })
      );
      puddle.rotation.x = -Math.PI / 2;
      puddle.scale.x = range(1.4, 3.2);
      puddle.position.set(range(-10, 10), .055, range(7, 11));
    }

    // -------------------------------------------------------------------------
    // Counter and stools
    // -------------------------------------------------------------------------

    const counter = new THREE.Group();
    scene.add(counter);

    const counterTopMat = new THREE.MeshStandardMaterial({
      map: woodTexture,
      color: 0xd89b63,
      roughness: .5
    });

    box(11.9, .36, 1.45, counterTopMat, 0, 3.25, 1.15, counter);
    box(11.5, 2.75, .24, materials.darkWood, 0, 1.72, .53, counter);
    box(11.1, .18, .5, materials.trim, 0, .36, .45, counter);

    for (let x = -5.4; x <= 5.4; x += 1.8) {
      box(.13, 2.75, .64, materials.trim, x, 1.72, .54, counter);
    }

    function makeStool(x, z) {
      const stool = new THREE.Group();
      stool.position.set(x, 0, z);
      cylinder(.52, .48, .18, 24, materials.redCeramic, 0, 1.82, 0, stool);
      cylinder(.33, .38, 1.55, 16, materials.blackSteel, 0, .98, 0, stool);
      cylinder(.57, .57, .1, 20, materials.blackSteel, 0, .18, 0, stool);
      const ring = mesh(
        new THREE.TorusGeometry(.42, .045, 8, 24),
        materials.steel,
        stool
      );
      ring.rotation.x = Math.PI / 2;
      ring.position.y = .75;
      scene.add(stool);
    }

    [-4.7, -2.35, 0, 2.35, 4.7].forEach(x => makeStool(x, 3.05));

    // -------------------------------------------------------------------------
    // Ramen bowls and countertop details
    // -------------------------------------------------------------------------

    const steamParticles = [];

    function addSteam(parent, x, y, z, count = 7, scale = 1) {
      for (let i = 0; i < count; i++) {
        const material = new THREE.SpriteMaterial({
          map: steamTexture,
          transparent: true,
          opacity: 0,
          depthWrite: false,
          color: 0xfff4de,
          blending: THREE.AdditiveBlending
        });
        const sprite = new THREE.Sprite(material);
        sprite.position.set(
          x + range(-.17, .17),
          y + range(0, 1.35),
          z + range(-.12, .12)
        );
        const size = range(.28, .5) * scale;
        sprite.scale.set(size, size * 1.65, 1);
        sprite.userData = {
          baseX: sprite.position.x,
          baseY: y,
          baseZ: sprite.position.z,
          phase: random(),
          speed: range(.11, .18),
          sway: range(.08, .2),
          size
        };
        parent.add(sprite);
        steamParticles.push(sprite);
      }
    }

    function makeRamenBowl(x, z, rotation = 0) {
      const group = new THREE.Group();
      group.position.set(x, 3.47, z);
      group.rotation.y = rotation;

      const bowl = mesh(
        new THREE.SphereGeometry(.52, 32, 16, 0, Math.PI * 2, 0, 1.22),
        materials.ceramic,
        group
      );
      bowl.scale.y = .58;
      bowl.position.y = -.08;

      const band = mesh(
        new THREE.TorusGeometry(.42, .035, 8, 32),
        materials.red,
        group
      );
      band.rotation.x = Math.PI / 2;
      band.position.y = -.03;

      const broth = cylinder(
        .425, .425, .035, 32,
        materials.broth,
        0, .095, 0,
        group
      );

      for (let i = 0; i < 5; i++) {
        const noodle = mesh(
          new THREE.TorusGeometry(
            range(.18, .34),
            .018,
            6,
            32,
            range(3.8, 5.5)
          ),
          materials.noodle,
          group
        );
        noodle.rotation.x = Math.PI / 2;
        noodle.rotation.z = range(-.7, .7);
        noodle.position.set(range(-.08, .08), .13 + i * .006, range(-.06, .06));
      }

      cylinder(.1, .1, .035, 20, materials.pink, -.2, .16, .02, group);

      for (let i = 0; i < 4; i++) {
        cylinder(
          .025, .025, .035, 10,
          materials.green,
          range(-.27, .27),
          .17,
          range(-.25, .25),
          group
        );
      }

      for (const dz of [-.045, .045]) {
        const chopstick = cylinder(
          .018, .026, 1.35, 8,
          materials.darkWood,
          .35 + dz,
          .62,
          -.2,
          group
        );
        chopstick.rotation.z = -.28;
        chopstick.rotation.x = .1;
      }

      addSteam(group, 0, .2, 0, 7, 1);
      scene.add(group);
      return group;
    }

    makeRamenBowl(-3.9, 1.22, .08);
    makeRamenBowl(-1.25, 1.12, -.1);
    makeRamenBowl(2.1, 1.18, .13);
    makeRamenBowl(4.45, 1.08, -.06);

    // Condiment trays, cups, napkin holders
    for (const x of [-2.6, .45, 3.45]) {
      box(.82, .08, .34, materials.darkWood, x, 3.48, .68);
      cylinder(.11, .13, .42, 16, materials.redCeramic, x - .22, 3.72, .68);
      cylinder(.1, .12, .3, 16, materials.black, x + .05, 3.65, .68);
      box(.16, .34, .23, materials.steel, x + .29, 3.69, .68);
    }

    for (const x of [-5.25, 5.25]) {
      cylinder(.23, .18, .36, 20, materials.ceramic, x, 3.61, 1.15);
    }

    // -------------------------------------------------------------------------
    // Noren doorway
    // -------------------------------------------------------------------------

    const doorway = new THREE.Group();
    doorway.position.set(-4.75, 0, -3.82);
    scene.add(doorway);

    box(4.2, 5.5, .22, materials.trim, 0, 2.7, 0, doorway);
    box(3.55, 4.9, .25, materials.black, 0, 2.55, .08, doorway);
    box(.23, 5.15, .38, materials.darkWood, -1.92, 2.62, .12, doorway);
    box(.23, 5.15, .38, materials.darkWood, 1.92, 2.62, .12, doorway);
    box(4.1, .24, .38, materials.darkWood, 0, 5.15, .12, doorway);

    const norenPanels = [];
    for (let i = 0; i < 4; i++) {
      const panelMat = new THREE.MeshStandardMaterial({
        map: norenTextures[i],
        side: THREE.DoubleSide,
        roughness: .9
      });
      const geometry = new THREE.PlaneGeometry(.88, 1.52, 8, 8);
      const panel = mesh(geometry, panelMat, doorway);
      panel.position.set(-1.35 + i * .9, 4.22, .36);
      panel.userData.baseX = panel.position.x;
      panel.userData.phase = i * .8;
      norenPanels.push(panel);
    }

    // Door threshold and warm interior strip
    box(4.05, .16, .68, materials.paleWood, -4.75, .09, -3.48);
    box(
      3.4, 4.6, .05,
      new THREE.MeshBasicMaterial({ color: 0x5a260f }),
      -4.75, 2.48, -3.65
    );

    // -------------------------------------------------------------------------
    // Handwritten menu board wall
    // -------------------------------------------------------------------------

    const menuGroup = new THREE.Group();
    menuGroup.position.set(3.45, 4.75, -3.91);
    scene.add(menuGroup);

    const menuItems = [
      ['醤油', '¥780'],
      ['味噌', '¥850'],
      ['餃子', '¥420'],
      ['酒', '¥500']
    ];

    menuItems.forEach((item, index) => {
      const texture = canvasTexture(256, 360, (ctx, w, h) => {
        ctx.fillStyle = index % 2 ? '#292422' : '#202425';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = '#9b6a42';
        ctx.lineWidth = 12;
        ctx.strokeRect(7, 7, w - 14, h - 14);
        ctx.textAlign = 'center';
        ctx.fillStyle = '#f1dfb7';
        ctx.font = 'bold 78px serif';
        ctx.fillText(item[0], w / 2, 130);
        ctx.fillStyle = '#e08158';
        ctx.font = 'bold 43px sans-serif';
        ctx.fillText(item[1], w / 2, 245);
        ctx.strokeStyle = 'rgba(255,255,255,.25)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(42, 285);
        ctx.lineTo(214, 295);
        ctx.stroke();
      });

      const board = box(
        1.3, 1.85, .12,
        new THREE.MeshStandardMaterial({
          map: texture,
          roughness: .88
        }),
        -2.2 + index * 1.48,
        0,
        0,
        menuGroup
      );
      board.rotation.z = range(-.025, .025);
    });

    // -------------------------------------------------------------------------
    // Kitchen nook
    // -------------------------------------------------------------------------

    const kitchen = new THREE.Group();
    kitchen.position.set(0, 0, -1.9);
    scene.add(kitchen);

    box(11.5, .18, 1.45, materials.steel, .35, 2.42, 0, kitchen);
    box(11.2, 2.2, .22, materials.tile, .35, 1.3, -.56, kitchen);

    for (let x = -5; x < 6; x += .7) {
      box(.025, 2.05, .025, materials.black, x, 1.3, -.43, kitchen);
    }
    for (let y = .35; y < 2.3; y += .7) {
      box(10.9, .025, .025, materials.black, .35, y, -.43, kitchen);
    }

    // Stove
    box(3.35, 1.25, 1.35, materials.blackSteel, 3.35, 1.45, .05, kitchen);
    box(3.1, .12, 1.18, materials.steel, 3.35, 2.11, .05, kitchen);

    const burnerRings = [];
    [-.85, .85].forEach(offset => {
      const ring = mesh(
        new THREE.TorusGeometry(.42, .075, 10, 28),
        materials.blackSteel,
        kitchen
      );
      ring.rotation.x = Math.PI / 2;
      ring.position.set(3.35 + offset, 2.19, .05);
      burnerRings.push(ring);

      const glow = mesh(
        new THREE.CircleGeometry(.34, 32),
        new THREE.MeshBasicMaterial({
          color: 0xff4b17,
          transparent: true,
          opacity: .72
        }),
        kitchen
      );
      glow.rotation.x = -Math.PI / 2;
      glow.position.set(3.35 + offset, 2.205, .05);
      glow.userData.phase = offset;
      burnerRings.push(glow);
    });

    // Stock pots
    function makePot(x, z, radius, height) {
      const group = new THREE.Group();
      group.position.set(x, 2.27, z);
      kitchen.add(group);

      cylinder(radius, radius * .96, height, 32, materials.steel, 0, height / 2, 0, group);
      const rim = mesh(
        new THREE.TorusGeometry(radius, .045, 8, 32),
        materials.blackSteel,
        group
      );
      rim.rotation.x = Math.PI / 2;
      rim.position.y = height;

      for (const side of [-1, 1]) {
        const handle = mesh(
          new THREE.TorusGeometry(.17, .035, 8, 18, Math.PI),
          materials.blackSteel,
          group
        );
        handle.rotation.set(Math.PI / 2, 0, side * Math.PI / 2);
        handle.position.set(side * (radius + .11), height * .66, 0);
      }

      addSteam(group, 0, height, 0, 10, 1.25);
      return group;
    }

    makePot(2.5, .05, .58, .72);
    makePot(4.2, .05, .68, .85);

    // Sink and dishes
    box(2.65, .2, 1.1, materials.steel, -3.9, 2.46, .02, kitchen);
    box(
      1.7, .08, .7,
      mat(0x182223, .18, .35),
      -3.9, 2.53, .02,
      kitchen
    );
    const faucet = mesh(
      new THREE.TorusGeometry(.35, .045, 8, 24, Math.PI),
      materials.steel,
      kitchen
    );
    faucet.position.set(-3.9, 3.05, -.28);
    faucet.rotation.z = Math.PI / 2;

    for (let i = 0; i < 6; i++) {
      cylinder(
        .37 - i * .018,
        .32 - i * .018,
        .09,
        24,
        i % 2 ? materials.ceramic : materials.redCeramic,
        -5.05,
        2.61 + i * .085,
        .08,
        kitchen
      );
    }

    // Hanging utensils and shelf
    box(10.5, .17, .58, materials.darkWood, .2, 4.02, -.32, kitchen);
    box(.15, 1.55, .15, materials.darkWood, -4.9, 4.67, -.32, kitchen);
    box(.15, 1.55, .15, materials.darkWood, 5.3, 4.67, -.32, kitchen);

    for (let i = 0; i < 8; i++) {
      const x = -3.5 + i * .72;
      cylinder(.025, .025, .76, 8, materials.steel, x, 3.33, -.12, kitchen);
      const utensil = mesh(
        new THREE.TorusGeometry(.13, .03, 8, 18),
        i % 3 === 0 ? materials.blackSteel : materials.steel,
        kitchen
      );
      utensil.rotation.x = Math.PI / 2;
      utensil.position.set(x, 2.93, -.12);
    }

    // Kitchen crates and ingredients
    box(1.5, .8, 1.1, materials.paleWood, -5.6, .6, -.15, kitchen);
    box(1.3, .13, 1, materials.darkWood, -5.6, 1.03, -.15, kitchen);
    for (let i = 0; i < 12; i++) {
      const vegetable = cylinder(
        .07, .11, range(.45, .72), 9,
        i % 3 ? materials.green : materials.paper,
        -5.95 + (i % 4) * .23,
        1.26,
        -.45 + Math.floor(i / 4) * .3,
        kitchen
      );
      vegetable.rotation.z = range(-.25, .25);
    }

    // -------------------------------------------------------------------------
    // Sake bottles and small storage
    // -------------------------------------------------------------------------

    const sakeRack = new THREE.Group();
    sakeRack.position.set(5.85, 0, -3.45);
    scene.add(sakeRack);

    box(2.25, 3.6, .5, materials.darkWood, 0, 2.5, 0, sakeRack);
    box(1.95, 3.3, .7, materials.black, 0, 2.5, .22, sakeRack);

    for (let y = 1.18; y <= 3.95; y += .9) {
      box(2.05, .12, .78, materials.paleWood, 0, y, .26, sakeRack);
    }

    function makeBottle(x, y, z, colorMat, scale = 1) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.scale.setScalar(scale);

      cylinder(.15, .17, .62, 18, colorMat, 0, .31, 0, group);
      cylinder(.07, .095, .25, 16, colorMat, 0, .74, 0, group);
      cylinder(.082, .082, .055, 16, materials.paper, 0, .89, 0, group);

      const label = box(
        .305, .27, .018,
        materials.paper,
        0, .38, .17,
        group
      );
      label.castShadow = false;
      sakeRack.add(group);
    }

    for (let shelf = 0; shelf < 4; shelf++) {
      for (let i = 0; i < 5; i++) {
        makeBottle(
          -.75 + i * .37,
          1.28 + shelf * .9,
          .42,
          i % 3 === 0 ? materials.redCeramic : materials.bottle,
          range(.82, .96)
        );
      }
    }

    // Stacked boxes and rice sacks
    for (let i = 0; i < 4; i++) {
      const crate = box(
        1.1, .55, .85,
        i % 2 ? materials.paleWood : materials.wood,
        6.45 + (i % 2) * .12,
        .32 + Math.floor(i / 2) * .58,
        -.95 + (i % 2) * .15
      );
      crate.rotation.y = range(-.06, .06);
    }

    // -------------------------------------------------------------------------
    // Paper lanterns
    // -------------------------------------------------------------------------

    const lanterns = [];

    function makeLantern(x, y, z, scale = 1, symbol = 'ラ') {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.scale.setScalar(scale);
      scene.add(group);

      cylinder(.025, .025, 1.4, 8, materials.blackSteel, 0, .7, 0, group);
      cylinder(.42, .42, .08, 24, materials.blackSteel, 0, -.04, 0, group);
      cylinder(.42, .42, .08, 24, materials.blackSteel, 0, -1.14, 0, group);

      const lanternTexture = canvasTexture(256, 512, (ctx, w, h) => {
        const gradient = ctx.createLinearGradient(0, 0, w, 0);
        gradient.addColorStop(0, '#b84926');
        gradient.addColorStop(.42, '#ffe0a0');
        gradient.addColorStop(.58, '#ffe8ae');
        gradient.addColorStop(1, '#a83a22');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#462019';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 135px serif';
        ctx.fillText(symbol, w / 2, h / 2);
        ctx.fillStyle = 'rgba(70,25,15,.18)';
        for (let yy = 20; yy < h; yy += 28) ctx.fillRect(0, yy, w, 4);
      });

      const lanternMaterial = new THREE.MeshStandardMaterial({
        map: lanternTexture,
        roughness: .82,
        emissive: 0xff6d28,
        emissiveIntensity: 1.25
      });

      const body = mesh(
        new THREE.SphereGeometry(.56, 28, 20),
        lanternMaterial,
        group
      );
      body.scale.y = 1.02;
      body.position.y = -.59;

      const light = new THREE.PointLight(0xff8b45, 14, 7, 2);
      light.position.y = -.55;
      light.castShadow = false;
      group.add(light);

      group.userData = {
        baseRotation: range(-.03, .03),
        phase: random() * Math.PI * 2,
        light
      };
      lanterns.push(group);
      return group;
    }

    makeLantern(-4.7, 6.75, 2.15, .9, '麺');
    makeLantern(-1.65, 6.8, 1.05, .82, 'ラ');
    makeLantern(1.65, 6.8, 1.05, .82, 'ー');
    makeLantern(4.7, 6.75, 2.15, .9, '酒');

    // -------------------------------------------------------------------------
    // Decorative overhead details
    // -------------------------------------------------------------------------

    box(13.8, .13, .13, materials.blackSteel, 0, 6.65, .25);
    for (let x = -6; x <= 6; x += 1.5) {
      box(.05, .45, .05, materials.blackSteel, x, 6.88, .25);
    }

    // Vent hood
    const hood = new THREE.Group();
    hood.position.set(3.35, 4.85, -1.62);
    scene.add(hood);
    const hoodTop = box(3.6, .65, 1.35, materials.steel, 0, 0, 0, hood);
    hoodTop.geometry.translate(0, 0, 0);
    box(1.25, 1.25, .85, materials.steel, 0, .92, -.1, hood);
    box(.75, 1.25, .65, materials.steel, 0, 2.05, -.1, hood);

    // Hanging garlic and drying herbs
    for (let i = 0; i < 5; i++) {
      const string = cylinder(
        .012, .012, .9, 6,
        materials.paper,
        -1.2 + i * .36,
        4.65,
        -3.65
      );
      for (let j = 0; j < 3; j++) {
        const bulb = mesh(
          new THREE.SphereGeometry(.11, 12, 8),
          materials.paper
        );
        bulb.scale.y = .78;
        bulb.position.set(-1.2 + i * .36, 4.35 - j * .22, -3.65);
      }
    }

    // -------------------------------------------------------------------------
    // Lighting rig
    // -------------------------------------------------------------------------

    const ambient = new THREE.HemisphereLight(0x61749b, 0x31190f, 1.5);
    scene.add(ambient);

    const keyLight = new THREE.DirectionalLight(0xffc477, 3.2);
    keyLight.position.set(-4, 9, 7);
    keyLight.target.position.set(0, 2, 0);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -10;
    keyLight.shadow.camera.right = 10;
    keyLight.shadow.camera.top = 10;
    keyLight.shadow.camera.bottom = -6;
    keyLight.shadow.camera.near = .5;
    keyLight.shadow.camera.far = 30;
    keyLight.shadow.bias = -.0004;
    scene.add(keyLight, keyLight.target);

    const kitchenLight = new THREE.PointLight(0xff7335, 55, 9, 2);
    kitchenLight.position.set(3.25, 3.1, -1);
    kitchenLight.castShadow = true;
    kitchenLight.shadow.mapSize.set(512, 512);
    scene.add(kitchenLight);

    const doorLight = new THREE.PointLight(0xff9d55, 45, 7, 2);
    doorLight.position.set(-4.7, 3.1, -2.8);
    scene.add(doorLight);

    const moonLight = new THREE.DirectionalLight(0x698bd7, 2.2);
    moonLight.position.set(8, 10, 12);
    scene.add(moonLight);

    // Stove glow light
    const stoveLight = new THREE.PointLight(0xff3f10, 18, 4, 2);
    stoveLight.position.set(3.4, 2.5, -1.7);
    scene.add(stoveLight);

    // -------------------------------------------------------------------------
    // Foreground alley props
    // -------------------------------------------------------------------------

    // Sidewalk curb
    box(24, .28, .5, mat(0x555657, .9), 0, .02, 6.65);

    // Bicycle-like silhouette for environmental depth
    const bicycle = new THREE.Group();
    bicycle.position.set(-7.3, 1.15, 6.2);
    bicycle.rotation.y = .32;
    scene.add(bicycle);

    for (const x of [-.95, .95]) {
      const wheel = mesh(
        new THREE.TorusGeometry(.72, .035, 8, 36),
        materials.blackSteel,
        bicycle
      );
      wheel.position.x = x;
      for (let i = 0; i < 10; i++) {
        const spoke = cylinder(
          .008, .008, 1.35, 5,
          materials.steel,
          x, 0, 0,
          bicycle
        );
        spoke.rotation.z = i * Math.PI / 10;
      }
    }

    const frameBars = [
      [-.95, 0, 0, .15, .55, 0],
      [.15, .55, 0, .95, 0, 0],
      [-.95, 0, 0, .55, -.05, 0],
      [.55, -.05, 0, .15, .55, 0],
      [.15, .55, 0, .45, 1.03, 0]
    ];

    frameBars.forEach(points => {
      const a = new THREE.Vector3(points[0], points[1], points[2]);
      const b = new THREE.Vector3(points[3], points[4], points[5]);
      const direction = b.clone().sub(a);
      const bar = cylinder(
        .025, .025, direction.length(), 7,
        materials.blackSteel,
        0, 0, 0,
        bicycle
      );
      bar.position.copy(a).add(b).multiplyScalar(.5);
      bar.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
    });

    // Menu stand outside
    const streetMenuTexture = canvasTexture(320, 420, (ctx, w, h) => {
      ctx.fillStyle = '#ece0b8';
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#a83024';
      ctx.textAlign = 'center';
      ctx.font = 'bold 70px serif';
      ctx.fillText('本日', w / 2, 105);
      ctx.fillStyle = '#25201b';
      ctx.font = 'bold 50px serif';
      ctx.fillText('特製', w / 2, 205);
      ctx.fillText('拉麺', w / 2, 275);
      ctx.font = 'bold 35px sans-serif';
      ctx.fillText('¥980', w / 2, 350);
    });

    const stand = new THREE.Group();
    stand.position.set(6.8, 0, 5.85);
    stand.rotation.y = -.18;
    scene.add(stand);
    box(
      1.55, 2.05, .1,
      new THREE.MeshStandardMaterial({
        map: streetMenuTexture,
        roughness: .82
      }),
      0, 1.25, 0,
      stand
    );
    box(.12, 2.6, .12, materials.darkWood, -.7, 1.2, -.08, stand);
    box(.12, 2.6, .12, materials.darkWood, .7, 1.2, -.08, stand);
    box(1.8, .12, .45, materials.darkWood, 0, .1, 0, stand);

    // -------------------------------------------------------------------------
    // Animation
    // -------------------------------------------------------------------------

    const clock = new THREE.Clock();

    function animateSteam(elapsed) {
      for (const sprite of steamParticles) {
        const data = sprite.userData;
        const cycle = (elapsed * data.speed + data.phase) % 1;
        sprite.position.y = data.baseY + cycle * 1.55;
        sprite.position.x =
          data.baseX +
          Math.sin(elapsed * 1.8 + data.phase * 10) * data.sway * cycle;
        sprite.position.z =
          data.baseZ +
          Math.cos(elapsed * 1.3 + data.phase * 8) * data.sway * .5;
        const swell = 1 + cycle * 1.4;
        sprite.scale.set(
          data.size * swell,
          data.size * 1.65 * swell,
          1
        );
        sprite.material.opacity =
          Math.sin(cycle * Math.PI) * .28;
      }
    }

    function animateLanterns(elapsed) {
      lanterns.forEach((lantern, index) => {
        lantern.rotation.z =
          lantern.userData.baseRotation +
          Math.sin(elapsed * .75 + lantern.userData.phase) * .025;
        lantern.rotation.x =
          Math.cos(elapsed * .62 + index) * .012;
        lantern.userData.light.intensity =
          13 + Math.sin(elapsed * 2.2 + index * 1.7) * 1.25;
      });
    }

    function animateNoren(elapsed) {
      norenPanels.forEach((panel, index) => {
        const positions = panel.geometry.attributes.position;
        for (let i = 0; i < positions.count; i++) {
          const x = positions.getX(i);
          const y = positions.getY(i);
          const normalized = (y + .76) / 1.52;
          positions.setZ(
            i,
            Math.sin(elapsed * 1.25 + x * 3.2 + index * .65) *
            .035 *
            (1 - normalized)
          );
        }
        positions.needsUpdate = true;
        panel.rotation.z =
          Math.sin(elapsed * .7 + panel.userData.phase) * .012;
      });
    }

    function animateStove(elapsed) {
      const flicker =
        1 + Math.sin(elapsed * 8.1) * .08 + Math.sin(elapsed * 13.7) * .04;
      stoveLight.intensity = 18 * flicker;
      kitchenLight.intensity = 55 + Math.sin(elapsed * 3.2) * 2;
      burnerRings.forEach((ring, index) => {
        if (ring.material.opacity !== undefined) {
          ring.material.opacity =
            .62 + Math.sin(elapsed * 9 + index) * .12;
        }
      });
    }

    function render() {
      requestAnimationFrame(render);
      const elapsed = clock.getElapsedTime();

      animateSteam(elapsed);
      animateLanterns(elapsed);
      animateNoren(elapsed);
      animateStove(elapsed);

      sign.rotation.z = Math.sin(elapsed * .25) * .002;
      controls.update();
      renderer.render(scene, camera);
    }

    render();

    // -------------------------------------------------------------------------
    // Responsive viewport
    // -------------------------------------------------------------------------

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
