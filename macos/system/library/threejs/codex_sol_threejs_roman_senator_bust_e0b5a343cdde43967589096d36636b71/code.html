<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roman Senator Bust</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171817}
canvas{display:block}
#label{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);color:#d8d3c8;font:11px/1.5 Georgia,serif;letter-spacing:.22em;text-transform:uppercase;opacity:.72;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">Portrait of a Roman Senator</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x191a19);
scene.fog = new THREE.Fog(0x191a19, 15, 28);

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 60);
camera.position.set(8.2, 5.8, 12.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.25, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.48;
controls.minDistance = 8;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI * 0.58;

const marble = new THREE.MeshStandardMaterial({
  color: 0xe4e0d6,
  roughness: 0.68,
  metalness: 0.0
});
const marbleLight = new THREE.MeshStandardMaterial({
  color: 0xf0ede5,
  roughness: 0.61
});
const marbleShade = new THREE.MeshStandardMaterial({
  color: 0xc8c4bb,
  roughness: 0.78
});
const crevice = new THREE.MeshStandardMaterial({
  color: 0x8e8b84,
  roughness: 0.9
});
const bronze = new THREE.MeshStandardMaterial({
  color: 0x302b22,
  roughness: 0.72,
  metalness: 0.22
});

const bust = new THREE.Group();
bust.rotation.y = -0.06;
scene.add(bust);

function mesh(geometry, material = marble, parent = bust) {
  const object = new THREE.Mesh(geometry, material);
  object.castShadow = true;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}

function ellipsoid(radius, position, scale, material = marble, segments = 48) {
  const object = mesh(new THREE.SphereGeometry(radius, segments, Math.floor(segments * 0.7)), material);
  object.position.copy(position);
  object.scale.copy(scale);
  return object;
}

function tube(points, radius, material = marbleLight, segments = 32, radial = 7, parent = bust) {
  const curve = new THREE.CatmullRomCurve3(points);
  return mesh(new THREE.TubeGeometry(curve, segments, radius, radial, false), material, parent);
}

function makePlinthShape(width, depth, chip) {
  const w = width * 0.5;
  const d = depth * 0.5;
  const shape = new THREE.Shape();
  shape.moveTo(-w, -d);
  shape.lineTo(w, -d);
  shape.lineTo(w, d - chip);
  shape.lineTo(w - chip * 0.75, d);
  shape.lineTo(-w, d);
  shape.lineTo(-w, -d);
  return shape;
}

function plinthLayer(width, depth, height, y, bevel, material) {
  const shape = makePlinthShape(width, depth, width * 0.075);
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: height,
    bevelEnabled: true,
    bevelSegments: 2,
    bevelSize: bevel,
    bevelThickness: bevel,
    curveSegments: 1
  });
  geometry.rotateX(-Math.PI / 2);
  geometry.translate(0, y, 0);
  geometry.computeVertexNormals();
  return mesh(geometry, material);
}

plinthLayer(4.05, 2.8, 0.34, 0.18, 0.055, marbleShade);
plinthLayer(3.62, 2.46, 0.36, 0.49, 0.035, marble);
plinthLayer(3.88, 2.66, 0.19, 0.82, 0.035, marbleLight);

const chipScar = mesh(new THREE.TetrahedronGeometry(0.18, 0), marbleShade);
chipScar.position.set(1.83, 0.36, 1.2);
chipScar.rotation.set(0.4, -0.6, 0.2);

const support = mesh(new THREE.CylinderGeometry(1.18, 1.34, 0.65, 48), marbleShade);
support.position.y = 1.15;
support.scale.z = 0.72;

const torso = ellipsoid(
  1,
  new THREE.Vector3(0, 2.35, -0.03),
  new THREE.Vector3(2.32, 1.5, 1.12),
  marble,
  64
);
torso.rotation.x = -0.04;

const chestCore = ellipsoid(
  1,
  new THREE.Vector3(0, 2.72, 0.13),
  new THREE.Vector3(1.75, 1.18, 1.0),
  marbleLight,
  56
);

const leftShoulder = ellipsoid(
  0.72,
  new THREE.Vector3(-1.8, 2.54, 0.0),
  new THREE.Vector3(1.12, 0.72, 1.08),
  marble,
  40
);
leftShoulder.rotation.z = -0.15;

const rightShoulder = ellipsoid(
  0.72,
  new THREE.Vector3(1.76, 2.53, -0.02),
  new THREE.Vector3(1.12, 0.72, 1.08),
  marble,
  40
);
rightShoulder.rotation.z = 0.14;

const neck = mesh(new THREE.CylinderGeometry(0.57, 0.7, 1.28, 48, 3), marbleLight);
neck.position.set(0, 3.73, -0.02);
neck.scale.z = 0.89;

ellipsoid(
  0.48,
  new THREE.Vector3(0, 3.38, 0.35),
  new THREE.Vector3(1.2, 0.65, 0.58),
  marbleLight,
  40
);

const head = ellipsoid(
  1,
  new THREE.Vector3(0, 4.72, 0.08),
  new THREE.Vector3(0.94, 1.18, 0.82),
  marbleLight,
  64
);
head.rotation.x = -0.025;

const jaw = ellipsoid(
  0.69,
  new THREE.Vector3(0, 4.23, 0.22),
  new THREE.Vector3(1.05, 0.76, 0.92),
  marbleLight,
  52
);

const chin = ellipsoid(
  0.34,
  new THREE.Vector3(0, 3.99, 0.77),
  new THREE.Vector3(1.18, 0.65, 0.72),
  marbleLight,
  40
);

const leftEar = ellipsoid(
  0.27,
  new THREE.Vector3(-0.91, 4.7, 0.04),
  new THREE.Vector3(0.52, 1.12, 0.48),
  marble,
  32
);
leftEar.rotation.z = -0.12;

const rightEar = ellipsoid(
  0.27,
  new THREE.Vector3(0.91, 4.7, 0.04),
  new THREE.Vector3(0.52, 1.12, 0.48),
  marble,
  32
);
rightEar.rotation.z = 0.12;

for (const side of [-1, 1]) {
  tube([
    new THREE.Vector3(side * 0.92, 4.86, 0.1),
    new THREE.Vector3(side * 1.0, 4.72, 0.16),
    new THREE.Vector3(side * 0.94, 4.52, 0.13)
  ], 0.035, marbleShade, 18, 6);
}

const nose = mesh(new THREE.ConeGeometry(0.23, 0.78, 24, 2), marbleLight);
nose.position.set(0, 4.67, 0.86);
nose.rotation.x = Math.PI / 2;
nose.scale.set(0.72, 1, 1.15);

const noseBase = ellipsoid(
  0.2,
  new THREE.Vector3(0, 4.4, 1.02),
  new THREE.Vector3(0.95, 0.56, 0.76),
  marbleLight,
  30
);

for (const side of [-1, 1]) {
  ellipsoid(
    0.12,
    new THREE.Vector3(side * 0.17, 4.42, 0.97),
    new THREE.Vector3(1.0, 0.55, 0.75),
    marbleShade,
    24
  );
}

for (const side of [-1, 1]) {
  const eye = ellipsoid(
    0.19,
    new THREE.Vector3(side * 0.36, 4.76, 0.79),
    new THREE.Vector3(1.25, 0.54, 0.48),
    marbleShade,
    32
  );
  eye.rotation.z = side * 0.05;

  ellipsoid(
    0.047,
    new THREE.Vector3(side * 0.36, 4.76, 0.887),
    new THREE.Vector3(1, 1, 0.45),
    crevice,
    20
  );

  tube([
    new THREE.Vector3(side * 0.62, 4.86, 0.72),
    new THREE.Vector3(side * 0.37, 4.93, 0.82),
    new THREE.Vector3(side * 0.13, 4.88, 0.82)
  ], 0.047, marble, 20, 7);

  tube([
    new THREE.Vector3(side * 0.66, 5.02, 0.65),
    new THREE.Vector3(side * 0.4, 5.1, 0.72),
    new THREE.Vector3(side * 0.14, 5.05, 0.73)
  ], 0.065, marbleShade, 20, 7);
}

tube([
  new THREE.Vector3(-0.42, 4.2, 0.83),
  new THREE.Vector3(-0.18, 4.16, 0.94),
  new THREE.Vector3(0, 4.18, 0.97),
  new THREE.Vector3(0.18, 4.16, 0.94),
  new THREE.Vector3(0.42, 4.2, 0.83)
], 0.065, marbleLight, 30, 8);

tube([
  new THREE.Vector3(-0.39, 4.14, 0.84),
  new THREE.Vector3(-0.17, 4.1, 0.92),
  new THREE.Vector3(0, 4.09, 0.93),
  new THREE.Vector3(0.17, 4.1, 0.92),
  new THREE.Vector3(0.39, 4.14, 0.84)
], 0.022, crevice, 28, 6);

tube([
  new THREE.Vector3(-0.32, 4.04, 0.79),
  new THREE.Vector3(0, 4.0, 0.86),
  new THREE.Vector3(0.32, 4.04, 0.79)
], 0.035, marbleShade, 22, 6);

for (const side of [-1, 1]) {
  tube([
    new THREE.Vector3(side * 0.22, 4.4, 0.92),
    new THREE.Vector3(side * 0.34, 4.31, 0.88),
    new THREE.Vector3(side * 0.43, 4.23, 0.8)
  ], 0.025, marbleShade, 18, 6);
}

tube([
  new THREE.Vector3(-0.22, 5.17, 0.72),
  new THREE.Vector3(0, 5.11, 0.78),
  new THREE.Vector3(0.22, 5.17, 0.72)
], 0.026, marbleShade, 18, 6);

const hairCap = ellipsoid(
  0.89,
  new THREE.Vector3(0, 5.46, -0.01),
  new THREE.Vector3(1.02, 0.59, 0.91),
  marbleShade,
  52
);
hairCap.rotation.x = -0.05;

const hairLocks = [
  [-0.72,5.38,0.48,-0.35],[-0.53,5.53,0.61,-0.2],[-0.3,5.61,0.67,-0.12],
  [-0.06,5.64,0.68,0.02],[0.2,5.62,0.67,0.14],[0.44,5.54,0.61,0.24],
  [0.65,5.4,0.5,0.36],[-0.82,5.24,0.27,-0.45],[0.81,5.23,0.27,0.45],
  [-0.62,5.64,0.24,-0.22],[-0.32,5.78,0.24,-0.1],[0,5.82,0.24,0],
  [0.32,5.77,0.24,0.1],[0.62,5.63,0.23,0.22]
];

for (const [x, y, z, rz] of hairLocks) {
  const lock = mesh(new THREE.ConeGeometry(0.105, 0.37, 10), marble);
  lock.position.set(x, y, z);
  lock.rotation.set(Math.PI / 2.6, 0, rz);
  lock.scale.set(0.8, 1, 0.65);
}

for (let i = 0; i < 10; i++) {
  const angle = (i / 9) * Math.PI * 0.9 + Math.PI * 1.05;
  const x = Math.cos(angle) * 0.77;
  const z = Math.sin(angle) * 0.56 - 0.18;
  const lock = ellipsoid(
    0.15,
    new THREE.Vector3(x, 5.49 + Math.sin(i * 1.7) * 0.055, z),
    new THREE.Vector3(0.75, 1.2, 0.65),
    marble,
    20
  );
  lock.rotation.z = Math.cos(angle) * 0.35;
}

tube([
  new THREE.Vector3(-1.95, 2.85, 0.72),
  new THREE.Vector3(-1.43, 3.18, 0.9),
  new THREE.Vector3(-0.8, 3.03, 0.98),
  new THREE.Vector3(-0.18, 2.75, 1.08),
  new THREE.Vector3(0.55, 2.36, 1.04),
  new THREE.Vector3(1.25, 2.05, 0.82)
], 0.18, marbleLight, 52, 10);

tube([
  new THREE.Vector3(-1.83, 3.04, 0.52),
  new THREE.Vector3(-1.3, 3.32, 0.72),
  new THREE.Vector3(-0.72, 3.17, 0.9),
  new THREE.Vector3(-0.12, 2.88, 0.98),
  new THREE.Vector3(0.64, 2.51, 0.94),
  new THREE.Vector3(1.43, 2.23, 0.67)
], 0.075, marbleShade, 50, 8);

const togaFolds = [
  [[-1.72,2.7,0.71],[-1.2,2.48,0.99],[-0.72,1.7,0.99]],
  [[-1.35,2.9,0.86],[-0.88,2.45,1.08],[-0.5,1.53,0.96]],
  [[-0.92,2.92,0.99],[-0.48,2.4,1.13],[-0.2,1.46,1.0]],
  [[-0.42,2.75,1.08],[-0.04,2.23,1.16],[0.1,1.4,0.98]],
  [[0.15,2.48,1.12],[0.48,2.04,1.11],[0.62,1.42,0.91]],
  [[0.72,2.26,1.0],[1.03,1.93,0.94],[1.14,1.45,0.72]],
  [[1.24,2.14,0.79],[1.48,1.85,0.7],[1.58,1.48,0.48]]
];

for (let i = 0; i < togaFolds.length; i++) {
  const points = togaFolds[i].map(p => new THREE.Vector3(p[0], p[1], p[2]));
  tube(points, i % 2 === 0 ? 0.085 : 0.06, i % 3 === 0 ? marbleShade : marbleLight, 28, 7);
}

tube([
  new THREE.Vector3(-1.85, 2.14, 0.64),
  new THREE.Vector3(-1.2, 1.92, 0.91),
  new THREE.Vector3(-0.45, 1.84, 1.04),
  new THREE.Vector3(0.35, 1.82, 1.05),
  new THREE.Vector3(1.2, 1.82, 0.81),
  new THREE.Vector3(1.82, 2.02, 0.5)
], 0.09, marbleShade, 44, 8);

tube([
  new THREE.Vector3(-0.64, 3.48, 0.57),
  new THREE.Vector3(-0.73, 3.28, 0.72),
  new THREE.Vector3(-0.86, 3.09, 0.8)
], 0.055, marbleShade, 18, 7);

tube([
  new THREE.Vector3(0.62, 3.45, 0.56),
  new THREE.Vector3(0.74, 3.23, 0.7),
  new THREE.Vector3(0.9, 3.02, 0.79)
], 0.05, marbleShade, 18, 7);

const plaque = mesh(new THREE.BoxGeometry(1.65, 0.35, 0.06), bronze);
plaque.position.set(0, 0.62, 1.37);
plaque.rotation.x = -0.03;

const plaqueInner = mesh(new THREE.BoxGeometry(1.47, 0.2, 0.025), new THREE.MeshStandardMaterial({
  color: 0x756b56,
  roughness: 0.65,
  metalness: 0.38
}));
plaqueInner.position.set(0, 0.62, 1.408);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(18, 96),
  new THREE.MeshStandardMaterial({ color: 0x262724, roughness: 0.92 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.05;
floor.receiveShadow = true;
scene.add(floor);

const rearWall = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 18),
  new THREE.MeshStandardMaterial({ color: 0x20211f, roughness: 1 })
);
rearWall.position.set(0, 7, -7);
rearWall.receiveShadow = true;
scene.add(rearWall);

const hemi = new THREE.HemisphereLight(0xdde6ef, 0x30281f, 1.25);
scene.add(hemi);

const key = new THREE.SpotLight(0xfff0d6, 115, 24, Math.PI / 5.4, 0.5, 1.35);
key.position.set(5.5, 10, 7);
key.target.position.set(0, 3.5, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.00018;
key.shadow.normalBias = 0.025;
scene.add(key, key.target);

const fill = new THREE.DirectionalLight(0xa9c5dd, 2.2);
fill.position.set(-6, 5, 5);
scene.add(fill);

const rim = new THREE.SpotLight(0xffddb4, 68, 20, Math.PI / 4.2, 0.65, 1.5);
rim.position.set(-4, 8, -5);
rim.target.position.set(0, 4, 0);
scene.add(rim, rim.target);

const baseLight = new THREE.PointLight(0xc6d8e6, 8, 7, 2);
baseLight.position.set(3, 1.2, 4);
scene.add(baseLight);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  rim.intensity = 67 + Math.sin(elapsed * 0.35) * 1.5;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
