<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cutaway Turbofan Core</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101216; }
  #app { position: fixed; inset: 0; }
  #label {
    position: fixed; left: 18px; bottom: 16px;
    font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #aeb6c2; letter-spacing: .3px; user-select: none; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  #label b { color: #e7ecf3; font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<div id="label"><b>Turbofan Core — Cutaway</b><br>fan · compressor · combustor · turbine · shaft</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------ *
 *  Renderer / Scene / Camera
 * ------------------------------------------------------------------ */
const container = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1115);
scene.fog = new THREE.FogExp2(0x0f1115, 0.011);

// Procedural studio environment for realistic metal reflections (no external assets)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(7.4, 3.1, 9.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 5;
controls.maxDistance = 22;
controls.target.set(0, 0, 0);

/* ------------------------------------------------------------------ *
 *  Lighting  (hemisphere + key/fill/rim)
 * ------------------------------------------------------------------ */
scene.add(new THREE.HemisphereLight(0x9fb4d6, 0x1c1e24, 0.55));

const key = new THREE.DirectionalLight(0xfff4e6, 3.0);
key.position.set(8, 11, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 45;
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -7;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9db6d8, 0.85);
fill.position.set(-9, 3, 4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xbfd4ff, 1.6);
rim.position.set(-4, 5, -10);
scene.add(rim);

/* Ground plane – receives shadows only */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.98;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ *
 *  Materials
 * ------------------------------------------------------------------ */
const matCasing   = new THREE.MeshStandardMaterial({ color: 0x9aa2ac, metalness: 0.9,  roughness: 0.42, side: THREE.DoubleSide });
const matCasing2  = new THREE.MeshStandardMaterial({ color: 0x848b95, metalness: 0.9,  roughness: 0.5,  side: THREE.DoubleSide });
const matFanBlade = new THREE.MeshStandardMaterial({ color: 0xcbd3dd, metalness: 0.95, roughness: 0.26 });
const matComp     = new THREE.MeshStandardMaterial({ color: 0xb7c0cb, metalness: 0.95, roughness: 0.30 });
const matStator   = new THREE.MeshStandardMaterial({ color: 0x8f97a2, metalness: 0.85, roughness: 0.45 });
const matDrum     = new THREE.MeshStandardMaterial({ color: 0x6d727b, metalness: 0.85, roughness: 0.5,  side: THREE.DoubleSide });
const matShaft    = new THREE.MeshStandardMaterial({ color: 0x585c64, metalness: 0.9,  roughness: 0.4 });
const matSpinner  = new THREE.MeshStandardMaterial({ color: 0x24272c, metalness: 0.7,  roughness: 0.35, side: THREE.DoubleSide });
const matCombust  = new THREE.MeshStandardMaterial({ color: 0x6e6459, metalness: 0.75, roughness: 0.62, side: THREE.DoubleSide });
const matFlame    = new THREE.MeshStandardMaterial({ color: 0x2a140a, metalness: 0.2,  roughness: 0.9,  emissive: 0xff5a1e, emissiveIntensity: 1.4, side: THREE.DoubleSide });
const matTurbine  = new THREE.MeshStandardMaterial({ color: 0x9b8a6a, metalness: 0.9,  roughness: 0.42, emissive: 0x1a0a02, emissiveIntensity: 0.6 });
const matTurbineHot = matTurbine.clone(); matTurbineHot.emissive = new THREE.Color(0xff4d12); matTurbineHot.emissiveIntensity = 0.9;
const matNozzle   = new THREE.MeshStandardMaterial({ color: 0x7c7168, metalness: 0.85, roughness: 0.55, side: THREE.DoubleSide });
const matNoz2     = new THREE.MeshStandardMaterial({ color: 0x565049, metalness: 0.8,  roughness: 0.6,  side: THREE.DoubleSide });

/* ------------------------------------------------------------------ *
 *  Cutaway wedge — every rotational part spans this angular range,
 *  leaving a ~90° wedge removed so the stages read as a section.
 * ------------------------------------------------------------------ */
const CUT = { start: 0.0, length: Math.PI * 1.5 };
const TAU = Math.PI * 2;
function inCut(phi) {
  let d = (phi - CUT.start) % TAU;
  if (d < 0) d += TAU;
  return d <= CUT.length;
}

/* The engine is built with its axis along +Y (front at ax=0). */
const axis = new THREE.Group();

/* ------------------------------------------------------------------ *
 *  Helpers
 * ------------------------------------------------------------------ */
// Closed-profile lathe shell (has real wall thickness + end faces)
function shell(stations, wall, mat) {
  const pts = [];
  for (const s of stations) pts.push(new THREE.Vector2(s.r, s.ax));
  for (let i = stations.length - 1; i >= 0; i--) {
    const s = stations[i];
    pts.push(new THREE.Vector2(Math.max(0.02, s.r - wall), s.ax));
  }
  pts.push(new THREE.Vector2(stations[0].r, stations[0].ax));
  const g = new THREE.LatheGeometry(pts, 120, CUT.start, CUT.length);
  const m = new THREE.Mesh(g, mat);
  m.castShadow = true; m.receiveShadow = true;
  axis.add(m);
  return m;
}

// Full-360 single-wall lathe (rotor drums / cones / spinner)
function lathe360(points, mat, seg = 96) {
  const g = new THREE.LatheGeometry(points, seg);
  const m = new THREE.Mesh(g, mat);
  m.castShadow = true; m.receiveShadow = true;
  axis.add(m);
  return m;
}

// A single twisted, tapered airfoil blade (radial=Y, chord=X, thickness=Z)
function bladeGeometry(radialLen, chord, thick, tipScale, twist) {
  const g = new THREE.BoxGeometry(chord, radialLen, thick, 1, 8, 1);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const t = (y + radialLen / 2) / radialLen;      // 0 root → 1 tip
    const s = 1 - (1 - tipScale) * t;               // planform taper
    x *= s; z *= s;
    const a = twist * (t - 0.5);                     // spanwise twist
    const nx = x * Math.cos(a) - z * Math.sin(a);
    const nz = x * Math.sin(a) + z * Math.cos(a);
    p.setXYZ(i, nx, y, nz);
  }
  p.needsUpdate = true;
  g.computeVertexNormals();
  return g;
}

// A ring of blades at an axial station, restricted to the cutaway span
function bladeRing(cfg) {
  const radialLen = cfg.tip - cfg.hub;
  const mid = cfg.hub + radialLen / 2;
  const base = bladeGeometry(radialLen, cfg.chord, cfg.thick, cfg.tipScale, cfg.twist);
  const geos = [];
  for (let i = 0; i < cfg.count; i++) {
    const phi = (i / cfg.count) * TAU;
    if (!inCut(phi)) continue;
    const g = base.clone();
    g.rotateY(cfg.pitch);            // stagger about radial axis
    g.translate(0, mid, 0);          // out to mid radius
    g.rotateZ(-Math.PI / 2);         // radial: Y → X (into rotor plane)
    g.translate(0, cfg.ax, 0);       // set axial station
    g.rotateY(phi);                  // distribute around the axis
    geos.push(g);
  }
  base.dispose();
  const merged = mergeGeometries(geos, false);
  const m = new THREE.Mesh(merged, cfg.mat);
  m.castShadow = true; m.receiveShadow = true;
  axis.add(m);
  return m;
}

/* ================================================================== *
 *  1.  NOSE SPINNER  +  CENTRAL SHAFT
 * ================================================================== */
const noseTip = 0.0, noseBase = 0.78, hubR = 0.50;
const noseProfile = [];
for (let i = 0; i <= 14; i++) {
  const t = i / 14;
  const ax = noseTip + t * (noseBase - noseTip);
  const r = hubR * Math.pow(t, 0.62);              // ogive nose
  noseProfile.push(new THREE.Vector2(r, ax));
}
noseProfile.push(new THREE.Vector2(0.16, noseBase));
lathe360(noseProfile, matSpinner, 64);

// LP shaft running through the whole core
const shaftGeo = new THREE.CylinderGeometry(0.15, 0.15, 4.9, 40, 1, false);
const shaft = new THREE.Mesh(shaftGeo, matShaft);
shaft.position.y = 0.8 + 4.9 / 2;
shaft.castShadow = true; shaft.receiveShadow = true;
axis.add(shaft);

/* ================================================================== *
 *  2.  FRONT INTAKE LIP + NACELLE (fan case)  +  LARGE FAN
 * ================================================================== */
const nInner = 1.74, nOuter = 1.94, axLip = 0.50, axBackN = 1.72;
const lipR = (nOuter - nInner) / 2, midRN = (nOuter + nInner) / 2;
const nacelle = [];
nacelle.push({ r: nInner, ax: axBackN });          // inner wall (back → front)
nacelle.push({ r: nInner, ax: axLip });
for (let i = 0; i <= 10; i++) {                     // rounded intake lip
  const a = Math.PI + (i / 10) * Math.PI;
  nacelle.push({ r: midRN + lipR * Math.cos(a), ax: axLip + lipR * Math.sin(a) });
}
nacelle.push({ r: nOuter, ax: axBackN });           // outer wall (front → back)
{
  const pts = nacelle.map(s => new THREE.Vector2(s.r, s.ax));
  pts.push(pts[0].clone());
  const g = new THREE.LatheGeometry(pts, 120, CUT.start, CUT.length);
  const m = new THREE.Mesh(g, matCasing);
  m.castShadow = true; m.receiveShadow = true;
  axis.add(m);
}

// Fan disk + big twisted fan blades
lathe360([
  new THREE.Vector2(0.16, 0.82), new THREE.Vector2(hubR, 0.82),
  new THREE.Vector2(hubR, 1.08), new THREE.Vector2(0.16, 1.08)
], matDrum, 48);
bladeRing({ ax: 0.95, hub: 0.50, tip: 1.66, count: 22, chord: 0.44, thick: 0.05,
            pitch: 0.55, tipScale: 0.5, twist: 1.0, mat: matFanBlade });

// A few outlet guide vanes just behind the fan (bypass hint)
bladeRing({ ax: 1.45, hub: 0.60, tip: 1.68, count: 40, chord: 0.20, thick: 0.03,
            pitch: -0.35, tipScale: 0.9, twist: 0.1, mat: matStator });

/* ================================================================== *
 *  3.  COMPRESSOR — stacked stages, increasing then decreasing radius
 * ================================================================== */
const compTips = [0.60, 0.67, 0.73, 0.79, 0.83, 0.79, 0.73, 0.67, 0.60];
const compAx0 = 1.98, compSpace = 0.19;
const comp = compTips.map((tip, i) => ({ ax: compAx0 + i * compSpace, tip, hub: tip - 0.30 }));

// Rotor drum following the hub line
lathe360([
  new THREE.Vector2(0.15, comp[0].ax - 0.1),
  ...comp.map(s => new THREE.Vector2(s.hub, s.ax)),
  new THREE.Vector2(comp[comp.length - 1].hub, comp[comp.length - 1].ax + 0.1),
  new THREE.Vector2(0.15, comp[comp.length - 1].ax + 0.1)
], matDrum, 96);

// Core casing over the compressor (barrel silhouette)
shell([
  { r: comp[0].tip + 0.05, ax: comp[0].ax - 0.14 },
  ...comp.map(s => ({ r: s.tip + 0.06, ax: s.ax })),
  { r: comp[comp.length - 1].tip + 0.05, ax: comp[comp.length - 1].ax + 0.12 }
], 0.05, matCasing);

// Each stage: rotor blade row + downstream stator vane row
for (let i = 0; i < comp.length; i++) {
  const s = comp[i];
  bladeRing({ ax: s.ax, hub: s.hub, tip: s.tip, count: 34, chord: 0.13, thick: 0.022,
              pitch: 0.85, tipScale: 0.72, twist: 0.5, mat: matComp });
  bladeRing({ ax: s.ax + compSpace * 0.5, hub: s.hub + 0.01,
              tip: (comp[Math.min(i + 1, comp.length - 1)].tip + s.tip) / 2 + 0.02,
              count: 40, chord: 0.10, thick: 0.02, pitch: -0.6, tipScale: 0.9,
              twist: 0.15, mat: matStator });
}

/* ================================================================== *
 *  4.  ANNULAR COMBUSTOR
 * ================================================================== */
const cbFront = 3.62, cbBack = 4.46;
// Inner shaft/liner drum through combustor
lathe360([
  new THREE.Vector2(0.15, cbFront - 0.05), new THREE.Vector2(0.40, cbFront),
  new THREE.Vector2(0.40, cbBack), new THREE.Vector2(0.15, cbBack + 0.05)
], matDrum, 64);

// Outer casing of combustor
shell([
  { r: 0.66, ax: cbFront - 0.02 }, { r: 0.72, ax: cbFront + 0.16 },
  { r: 0.72, ax: cbBack - 0.16 },  { r: 0.66, ax: cbBack + 0.02 }
], 0.055, matCombust);

// Glowing annular flame tube (double-walled liner)
shell([
  { r: 0.60, ax: cbFront + 0.06 }, { r: 0.63, ax: cbFront + 0.22 },
  { r: 0.63, ax: cbBack - 0.20 },  { r: 0.58, ax: cbBack - 0.02 }
], 0.20, matFlame);

// Warm light from combustion tinting nearby metal
const flameLight = new THREE.PointLight(0xff6a2a, 14, 4.5, 2.0);
flameLight.position.set(0.35, (cbFront + cbBack) / 2, 0.15);
axis.add(flameLight);

// Fuel injectors around the front dome
{
  const injGeos = [];
  const injBase = new THREE.CylinderGeometry(0.045, 0.06, 0.16, 12);
  for (let i = 0; i < 12; i++) {
    const phi = (i / 12) * TAU;
    if (!inCut(phi)) continue;
    const g = injBase.clone();
    g.translate(0, 0.62, 0);
    g.rotateZ(-Math.PI / 2);
    g.translate(0, cbFront + 0.02, 0);
    g.rotateY(phi);
    injGeos.push(g);
  }
  injBase.dispose();
  const inj = new THREE.Mesh(mergeGeometries(injGeos, false), matShaft);
  inj.castShadow = true; inj.receiveShadow = true;
  axis.add(inj);
}

/* ================================================================== *
 *  5.  TURBINE — hot section, larger blades
 * ================================================================== */
const turbTips = [0.66, 0.74, 0.82, 0.90];
const turbAx0 = 4.66, turbSpace = 0.24;
const turb = turbTips.map((tip, i) => ({ ax: turbAx0 + i * turbSpace, tip, hub: tip - 0.26 }));

// Turbine rotor drum
lathe360([
  new THREE.Vector2(0.15, turb[0].ax - 0.12),
  ...turb.map(s => new THREE.Vector2(s.hub, s.ax)),
  new THREE.Vector2(turb[turb.length - 1].hub, turb[turb.length - 1].ax + 0.12),
  new THREE.Vector2(0.15, turb[turb.length - 1].ax + 0.12)
], matDrum, 96);

// Turbine casing
shell([
  { r: turb[0].tip + 0.05, ax: turb[0].ax - 0.16 },
  ...turb.map(s => ({ r: s.tip + 0.06, ax: s.ax })),
  { r: turb[turb.length - 1].tip + 0.05, ax: turb[turb.length - 1].ax + 0.14 }
], 0.05, matCasing2);

for (let i = 0; i < turb.length; i++) {
  const s = turb[i];
  // Nozzle guide vanes ahead of each rotor
  bladeRing({ ax: s.ax - 0.11, hub: s.hub + 0.01, tip: s.tip - 0.01, count: 36,
              chord: 0.12, thick: 0.03, pitch: -0.9, tipScale: 0.92, twist: 0.2,
              mat: matStator });
  // Rotor blades (first stage runs hottest)
  bladeRing({ ax: s.ax, hub: s.hub, tip: s.tip, count: 40, chord: 0.14, thick: 0.03,
              pitch: 1.0, tipScale: 0.86, twist: 0.35,
              mat: i === 0 ? matTurbineHot : matTurbine });
}

/* ================================================================== *
 *  6.  EXHAUST — tail cone (plug) + convergent nozzle
 * ================================================================== */
const exFront = 5.5, exBack = 6.75;
const plug = [];
for (let i = 0; i <= 14; i++) {
  const t = i / 14;
  const ax = exFront + t * (exBack - exFront);
  const r = 0.62 * (1 - Math.pow(t, 1.7));
  plug.push(new THREE.Vector2(Math.max(0.02, r), ax));
}
lathe360(plug, matNoz2, 64);

shell([
  { r: 0.95, ax: 5.38 }, { r: 0.92, ax: 5.7 },
  { r: 0.86, ax: 6.05 }, { r: 0.80, ax: 6.32 }
], 0.05, matNozzle);

/* ================================================================== *
 *  Assemble: center along axis and lay horizontal
 * ================================================================== */
const L = 6.75;
axis.position.y = -L / 2;

const engine = new THREE.Group();
engine.add(axis);
engine.rotation.z = Math.PI / 2;   // axis Y → world X (horizontal)
scene.add(engine);

/* ------------------------------------------------------------------ *
 *  Resize + Render loop
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
