<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roman Terracotta Oil Lamp</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #18130f;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(255, 235, 209, 0.72);
      font: 12px/1.5 Georgia, serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Roman terracotta oil lamp</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x18130f);
    scene.fog = new THREE.FogExp2(0x18130f, 0.035);

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(6.8, 5.2, 8.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.65, 0.3);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;
    controls.minDistance = 5.5;
    controls.maxDistance = 15;
    controls.maxPolarAngle = Math.PI * 0.48;

    const lamp = new THREE.Group();
    lamp.rotation.y = -0.12;
    scene.add(lamp);

    const terracotta = new THREE.MeshStandardMaterial({
      color: 0xa84f2d,
      roughness: 0.88,
      metalness: 0.0,
      bumpScale: 0.03
    });

    const terracottaDark = new THREE.MeshStandardMaterial({
      color: 0x7e321d,
      roughness: 0.95,
      metalness: 0
    });

    const reliefMaterial = new THREE.MeshStandardMaterial({
      color: 0xb95c35,
      roughness: 0.83,
      metalness: 0
    });

    const sootMaterial = new THREE.MeshStandardMaterial({
      color: 0x1b100b,
      roughness: 1,
      metalness: 0
    });

    const innerMaterial = new THREE.MeshStandardMaterial({
      color: 0x100a07,
      roughness: 1,
      side: THREE.DoubleSide
    });

    function shadow(mesh) {
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    const bodyProfile = [
      new THREE.Vector2(0.05, 0.12),
      new THREE.Vector2(1.18, 0.12),
      new THREE.Vector2(1.55, 0.22),
      new THREE.Vector2(1.78, 0.45),
      new THREE.Vector2(1.88, 0.72),
      new THREE.Vector2(1.81, 0.96),
      new THREE.Vector2(1.62, 1.13),
      new THREE.Vector2(1.25, 1.25),
      new THREE.Vector2(0.72, 1.31),
      new THREE.Vector2(0.08, 1.33)
    ];
    const body = shadow(new THREE.Mesh(
      new THREE.LatheGeometry(bodyProfile, 96),
      terracotta
    ));
    body.scale.z = 0.88;
    lamp.add(body);

    const foot = shadow(new THREE.Mesh(
      new THREE.CylinderGeometry(1.14, 1.24, 0.18, 80),
      terracottaDark
    ));
    foot.position.y = 0.12;
    foot.scale.z = 0.88;
    lamp.add(foot);

    const footInset = new THREE.Mesh(
      new THREE.CylinderGeometry(0.82, 0.82, 0.012, 64),
      innerMaterial
    );
    footInset.position.y = 0.025;
    lamp.add(footInset);

    const topDisc = shadow(new THREE.Mesh(
      new THREE.CylinderGeometry(1.18, 1.28, 0.13, 80),
      terracotta
    ));
    topDisc.position.y = 1.29;
    topDisc.scale.z = 0.9;
    lamp.add(topDisc);

    const outerMoulding = shadow(new THREE.Mesh(
      new THREE.TorusGeometry(1.28, 0.075, 14, 96),
      reliefMaterial
    ));
    outerMoulding.rotation.x = Math.PI / 2;
    outerMoulding.scale.z = 0.9;
    outerMoulding.position.y = 1.39;
    lamp.add(outerMoulding);

    const innerMoulding = shadow(new THREE.Mesh(
      new THREE.TorusGeometry(0.72, 0.035, 10, 72),
      reliefMaterial
    ));
    innerMoulding.rotation.x = Math.PI / 2;
    innerMoulding.position.y = 1.405;
    lamp.add(innerMoulding);

    function createSpoutGeometry() {
      const segments = 48;
      const rings = [
        { z: 1.18, y: 0.72, rx: 1.22, ry: 0.49 },
        { z: 1.62, y: 0.69, rx: 1.08, ry: 0.46 },
        { z: 2.08, y: 0.67, rx: 0.79, ry: 0.40 },
        { z: 2.54, y: 0.68, rx: 0.60, ry: 0.36 },
        { z: 2.80, y: 0.70, rx: 0.55, ry: 0.34 }
      ];
      const positions = [];
      const indices = [];

      for (const ring of rings) {
        for (let i = 0; i < segments; i++) {
          const a = i / segments * Math.PI * 2;
          const x = Math.cos(a) * ring.rx;
          const y = ring.y + Math.sin(a) * ring.ry;
          positions.push(x, y, ring.z);
        }
      }

      for (let r = 0; r < rings.length - 1; r++) {
        for (let i = 0; i < segments; i++) {
          const n = (i + 1) % segments;
          const a = r * segments + i;
          const b = r * segments + n;
          const c = (r + 1) * segments + n;
          const d = (r + 1) * segments + i;
          indices.push(a, b, d, b, c, d);
        }
      }

      const frontCenter = positions.length / 3;
      positions.push(0, rings.at(-1).y, rings.at(-1).z);
      const backCenter = positions.length / 3;
      positions.push(0, rings[0].y, rings[0].z);

      for (let i = 0; i < segments; i++) {
        const n = (i + 1) % segments;
        indices.push(frontCenter, (rings.length - 1) * segments + n, (rings.length - 1) * segments + i);
        indices.push(backCenter, i, n);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    const spout = shadow(new THREE.Mesh(createSpoutGeometry(), terracotta));
    lamp.add(spout);

    const nozzleCollar = shadow(new THREE.Mesh(
      new THREE.CylinderGeometry(0.48, 0.54, 0.13, 64),
      terracottaDark
    ));
    nozzleCollar.position.set(0, 1.055, 2.45);
    nozzleCollar.scale.z = 0.82;
    lamp.add(nozzleCollar);

    const nozzleRim = shadow(new THREE.Mesh(
      new THREE.TorusGeometry(0.34, 0.075, 14, 64),
      reliefMaterial
    ));
    nozzleRim.rotation.x = Math.PI / 2;
    nozzleRim.position.set(0, 1.145, 2.46);
    nozzleRim.scale.z = 0.82;
    lamp.add(nozzleRim);

    const wickHole = new THREE.Mesh(
      new THREE.CircleGeometry(0.30, 64),
      sootMaterial
    );
    wickHole.rotation.x = -Math.PI / 2;
    wickHole.position.set(0, 1.151, 2.46);
    wickHole.scale.y = 0.82;
    lamp.add(wickHole);

    const charMark = new THREE.Mesh(
      new THREE.RingGeometry(0.30, 0.43, 64, 1, -0.45, 0.9),
      sootMaterial
    );
    charMark.rotation.x = -Math.PI / 2;
    charMark.position.set(0, 1.222, 2.46);
    charMark.scale.y = 0.82;
    lamp.add(charMark);

    const fillRim = shadow(new THREE.Mesh(
      new THREE.TorusGeometry(0.33, 0.085, 16, 72),
      reliefMaterial
    ));
    fillRim.rotation.x = Math.PI / 2;
    fillRim.position.set(0, 1.50, 0.02);
    lamp.add(fillRim);

    const fillWell = new THREE.Mesh(
      new THREE.CircleGeometry(0.28, 64),
      innerMaterial
    );
    fillWell.rotation.x = -Math.PI / 2;
    fillWell.position.set(0, 1.505, 0.02);
    lamp.add(fillWell);

    const fillInnerWall = new THREE.Mesh(
      new THREE.CylinderGeometry(0.285, 0.255, 0.18, 64, 1, true),
      terracottaDark
    );
    fillInnerWall.position.set(0, 1.42, 0.02);
    lamp.add(fillInnerWall);

    const petalShape = new THREE.Shape();
    petalShape.moveTo(0, 0.12);
    petalShape.bezierCurveTo(0.16, 0.22, 0.17, 0.48, 0, 0.62);
    petalShape.bezierCurveTo(-0.17, 0.48, -0.16, 0.22, 0, 0.12);

    const petalGeometry = new THREE.ExtrudeGeometry(petalShape, {
      depth: 0.035,
      bevelEnabled: true,
      bevelSegments: 2,
      steps: 1,
      bevelSize: 0.018,
      bevelThickness: 0.012,
      curveSegments: 12
    });
    petalGeometry.rotateX(Math.PI / 2);
    petalGeometry.translate(0, 0, 0);

    for (let i = 0; i < 12; i++) {
      const angle = i / 12 * Math.PI * 2;
      const petal = shadow(new THREE.Mesh(petalGeometry, reliefMaterial));
      petal.rotation.y = angle;
      petal.position.set(
        Math.sin(angle) * 0.32,
        1.445,
        Math.cos(angle) * 0.32 + 0.02
      );
      petal.scale.set(0.72, 0.72, 0.72);
      lamp.add(petal);
    }

    const beadGeometry = new THREE.SphereGeometry(0.045, 16, 10);
    for (let i = 0; i < 24; i++) {
      const angle = i / 24 * Math.PI * 2;
      const bead = shadow(new THREE.Mesh(beadGeometry, reliefMaterial));
      bead.position.set(
        Math.sin(angle) * 1.02,
        1.47,
        Math.cos(angle) * 0.92
      );
      bead.scale.y = 0.55;
      lamp.add(bead);
    }

    const voluteGeometry = new THREE.TorusGeometry(0.20, 0.045, 10, 36, Math.PI * 1.65);
    for (const side of [-1, 1]) {
      const volute = shadow(new THREE.Mesh(voluteGeometry, reliefMaterial));
      volute.rotation.x = Math.PI / 2;
      volute.rotation.z = side > 0 ? 0.55 : Math.PI - 0.55;
      volute.position.set(side * 0.67, 1.19, 1.50);
      volute.scale.z = 0.72;
      lamp.add(volute);
    }

    class HandleCurve extends THREE.Curve {
      getPoint(t, target = new THREE.Vector3()) {
        const angle = Math.PI * (0.08 + t * 0.84);
        const z = -1.48 - Math.sin(angle) * 0.72;
        const y = 0.72 + Math.sin(angle) * 1.03;
        const x = Math.cos(angle) * 0.16;
        return target.set(x, y, z);
      }
    }

    const handle = shadow(new THREE.Mesh(
      new THREE.TubeGeometry(new HandleCurve(), 64, 0.16, 14, false),
      terracottaDark
    ));
    lamp.add(handle);

    const handleInner = new THREE.Mesh(
      new THREE.TubeGeometry(new HandleCurve(), 64, 0.075, 12, false),
      reliefMaterial
    );
    handleInner.scale.set(1.01, 1.01, 1.01);
    lamp.add(handleInner);

    for (const x of [-0.32, 0.32]) {
      const handleBoss = shadow(new THREE.Mesh(
        new THREE.SphereGeometry(0.25, 28, 18),
        terracotta
      ));
      handleBoss.position.set(x, 0.78, -1.52);
      handleBoss.scale.set(1.1, 0.9, 0.8);
      lamp.add(handleBoss);
    }

    const claySpeckMaterial = new THREE.MeshStandardMaterial({
      color: 0x6f2c1a,
      roughness: 1
    });
    const speckGeometry = new THREE.SphereGeometry(0.018, 8, 6);
    const random = (() => {
      let seed = 1729;
      return () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      };
    })();

    for (let i = 0; i < 75; i++) {
      const angle = random() * Math.PI * 2;
      const radius = 1.72 + random() * 0.08;
      const y = 0.32 + random() * 0.73;
      const speck = new THREE.Mesh(speckGeometry, claySpeckMaterial);
      speck.position.set(
        Math.cos(angle) * radius,
        y,
        Math.sin(angle) * radius * 0.88
      );
      speck.scale.setScalar(0.45 + random() * 0.8);
      lamp.add(speck);
    }

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x5b4737,
      roughness: 0.96,
      metalness: 0
    });

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(13, 96),
      floorMaterial
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.075;
    floor.receiveShadow = true;
    scene.add(floor);

    const pedestal = shadow(new THREE.Mesh(
      new THREE.CylinderGeometry(2.7, 2.82, 0.20, 96),
      new THREE.MeshStandardMaterial({
        color: 0x705746,
        roughness: 0.92
      })
    ));
    pedestal.position.y = -0.02;
    scene.add(pedestal);

    const pedestalTop = new THREE.Mesh(
      new THREE.CylinderGeometry(2.58, 2.64, 0.05, 96),
      new THREE.MeshStandardMaterial({
        color: 0x806453,
        roughness: 0.9
      })
    );
    pedestalTop.position.y = 0.105;
    pedestalTop.receiveShadow = true;
    scene.add(pedestalTop);

    const hemiLight = new THREE.HemisphereLight(0xffd9b2, 0x211812, 1.45);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffc792, 4.4);
    keyLight.position.set(4.5, 7.5, 5.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -6;
    keyLight.shadow.camera.right = 6;
    keyLight.shadow.camera.top = 6;
    keyLight.shadow.camera.bottom = -6;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 25;
    keyLight.shadow.bias = -0.0003;
    keyLight.shadow.normalBias = 0.035;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x8aa5c5, 1.15);
    fillLight.position.set(-5, 3.5, -4);
    scene.add(fillLight);

    const warmLight = new THREE.PointLight(0xff7435, 18, 9, 2);
    warmLight.position.set(0, 2.2, 4);
    scene.add(warmLight);

    const rimLight = new THREE.SpotLight(0xffd0a0, 45, 18, 0.55, 0.7, 1.4);
    rimLight.position.set(-5, 6, -5);
    rimLight.target.position.set(0, 0.8, 0);
    scene.add(rimLight, rimLight.target);

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    }
    addEventListener('resize', resize);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      warmLight.intensity = 17.5 + Math.sin(elapsed * 2.7) * 0.55;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
