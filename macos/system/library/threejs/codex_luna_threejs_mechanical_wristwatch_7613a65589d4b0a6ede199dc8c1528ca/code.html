<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Mechanical Wristwatch</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090b0e;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .label {
      position: fixed;
      left: 24px;
      bottom: 20px;
      color: rgba(220, 228, 232, 0.55);
      font: 11px/1.4 system-ui, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Mechanical Chronometer · 316L Steel</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090b0e);
    scene.fog = new THREE.Fog(0x090b0e, 16, 30);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(7.8, 6.2, 9.2);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.minDistance = 7;
    controls.maxDistance = 20;
    controls.target.set(0, 0, 0);

    const steel = new THREE.MeshStandardMaterial({
      color: 0x899096,
      metalness: 0.92,
      roughness: 0.28
    });
    const polishedSteel = new THREE.MeshStandardMaterial({
      color: 0xc8d0d4,
      metalness: 0.98,
      roughness: 0.12
    });
    const darkSteel = new THREE.MeshStandardMaterial({
      color: 0x3c454a,
      metalness: 0.9,
      roughness: 0.3
    });
    const edgeSteel = new THREE.LineBasicMaterial({
      color: 0x252b2f,
      transparent: true,
      opacity: 0.8
    });
    const dialMaterial = new THREE.MeshStandardMaterial({
      color: 0x10191d,
      metalness: 0.45,
      roughness: 0.3
    });
    const dialInsetMaterial = new THREE.MeshStandardMaterial({
      color: 0x18272a,
      metalness: 0.4,
      roughness: 0.36
    });
    const markerMaterial = new THREE.MeshStandardMaterial({
      color: 0xd8e5df,
      emissive: 0x536963,
      emissiveIntensity: 0.34,
      metalness: 0.72,
      roughness: 0.2
    });
    const handMaterial = new THREE.MeshStandardMaterial({
      color: 0xe3e8e7,
      metalness: 0.82,
      roughness: 0.17
    });
    const secondMaterial = new THREE.MeshStandardMaterial({
      color: 0xb98a45,
      metalness: 0.84,
      roughness: 0.2
    });
    const blackMaterial = new THREE.MeshStandardMaterial({
      color: 0x050708,
      metalness: 0.35,
      roughness: 0.28
    });
    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xa8d0d1,
      metalness: 0.08,
      roughness: 0.08,
      transmission: 0.35,
      transparent: true,
      opacity: 0.17,
      thickness: 0.08,
      clearcoat: 1,
      clearcoatRoughness: 0.08
    });

    function addEdges(mesh, threshold = 20) {
      const edgeGeometry = new THREE.EdgesGeometry(mesh.geometry, threshold);
      const edgeLines = new THREE.LineSegments(edgeGeometry, edgeSteel);
      mesh.add(edgeLines);
      return mesh;
    }

    function addBox(parent, width, height, depth, position, material, rotationY = 0) {
      const box = new THREE.Mesh(
        new THREE.BoxGeometry(width, height, depth),
        material
      );
      box.position.set(position.x, position.y, position.z);
      box.rotation.y = rotationY;
      box.castShadow = true;
      box.receiveShadow = true;
      parent.add(box);
      return box;
    }

    function addCylinder(parent, radius, depth, position, material, radialSegments = 64) {
      const cylinder = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, depth, radialSegments),
        material
      );
      cylinder.position.set(position.x, position.y, position.z);
      cylinder.castShadow = true;
      cylinder.receiveShadow = true;
      parent.add(cylinder);
      return cylinder;
    }

    const watch = new THREE.Group();
    scene.add(watch);

    const bracelet = new THREE.Group();
    watch.add(bracelet);

    const linkMaterial = new THREE.MeshStandardMaterial({
      color: 0x777f83,
      metalness: 0.94,
      roughness: 0.25
    });
    const linkHighlight = new THREE.MeshStandardMaterial({
      color: 0xb3bdc0,
      metalness: 0.97,
      roughness: 0.16
    });

    for (let sideIndex = -1; sideIndex <= 1; sideIndex += 2) {
      for (let linkIndex = 0; linkIndex < 7; linkIndex += 1) {
        const zPosition = sideIndex * (3.17 + linkIndex * 0.68);
        const link = addBox(
          bracelet,
          2.18,
          0.38,
          0.57,
          { x: 0, y: -0.16, z: zPosition },
          linkMaterial
        );
        addEdges(link);

        addBox(
          bracelet,
          0.76,
          0.10,
          0.49,
          { x: 0, y: 0.055, z: zPosition },
          linkHighlight
        );

        addBox(
          bracelet,
          0.16,
          0.08,
          0.46,
          { x: -0.82, y: 0.06, z: zPosition },
          polishedSteel
        );
        addBox(
          bracelet,
          0.16,
          0.08,
          0.46,
          { x: 0.82, y: 0.06, z: zPosition },
          polishedSteel
        );
      }
    }

    const clasp = addBox(
      bracelet,
      2.26,
      0.43,
      1.52,
      { x: 0, y: -0.13, z: -6.02 },
      steel
    );
    addEdges(clasp);
    addBox(
      bracelet,
      1.72,
      0.11,
      1.18,
      { x: 0, y: 0.095, z: -6.02 },
      polishedSteel
    );
    addBox(
      bracelet,
      0.045,
      0.13,
      1.14,
      { x: 0, y: 0.16, z: -6.02 },
      darkSteel
    );

    const caseBack = addCylinder(
      watch,
      2.7,
      0.24,
      { x: 0, y: -0.48, z: 0 },
      darkSteel,
      96
    );
    const backRing = new THREE.Mesh(
      new THREE.TorusGeometry(2.48, 0.08, 12, 96),
      polishedSteel
    );
    backRing.rotation.x = Math.PI / 2;
    backRing.position.y = -0.62;
    backRing.castShadow = true;
    watch.add(backRing);

    const caseBody = addCylinder(
      watch,
      2.9,
      0.86,
      { x: 0, y: 0, z: 0 },
      steel,
      96
    );
    addEdges(caseBody, 15);

    const caseTopRing = new THREE.Mesh(
      new THREE.TorusGeometry(2.67, 0.16, 18, 96),
      polishedSteel
    );
    caseTopRing.rotation.x = Math.PI / 2;
    caseTopRing.position.y = 0.44;
    caseTopRing.castShadow = true;
    watch.add(caseTopRing);

    const caseBottomRing = new THREE.Mesh(
      new THREE.TorusGeometry(2.73, 0.08, 14, 96),
      darkSteel
    );
    caseBottomRing.rotation.x = Math.PI / 2;
    caseBottomRing.position.y = -0.43;
    watch.add(caseBottomRing);

    const dial = addCylinder(
      watch,
      2.47,
      0.12,
      { x: 0, y: 0.53, z: 0 },
      dialMaterial,
      96
    );

    const dialInnerRing = new THREE.Mesh(
      new THREE.TorusGeometry(2.29, 0.035, 10, 96),
      darkSteel
    );
    dialInnerRing.rotation.x = Math.PI / 2;
    dialInnerRing.position.y = 0.605;
    watch.add(dialInnerRing);

    const bezel = new THREE.Group();
    bezel.position.y = 0.59;
    watch.add(bezel);

    const bezelOuter = new THREE.Mesh(
      new THREE.TorusGeometry(2.73, 0.22, 18, 96),
      polishedSteel
    );
    bezelOuter.rotation.x = Math.PI / 2;
    bezelOuter.castShadow = true;
    bezel.add(bezelOuter);

    const bezelInner = new THREE.Mesh(
      new THREE.TorusGeometry(2.49, 0.045, 10, 96),
      darkSteel
    );
    bezelInner.rotation.x = Math.PI / 2;
    bezel.add(bezelInner);

    for (let tickIndex = 0; tickIndex < 60; tickIndex += 1) {
      const tickAngle = (tickIndex / 60) * Math.PI * 2;
      const isMajor = tickIndex % 5 === 0;
      const tickLength = isMajor ? 0.27 : 0.13;
      const tickWidth = isMajor ? 0.075 : 0.035;
      const tickRadius = 2.73;
      const tick = new THREE.Mesh(
        new THREE.BoxGeometry(tickWidth, 0.075, tickLength),
        isMajor ? blackMaterial : darkSteel
      );
      tick.position.set(
        Math.sin(tickAngle) * tickRadius,
        0.18,
        Math.cos(tickAngle) * tickRadius
      );
      tick.rotation.y = tickAngle;
      tick.castShadow = true;
      bezel.add(tick);
    }

    for (let minuteIndex = 0; minuteIndex < 60; minuteIndex += 1) {
      const minuteAngle = (minuteIndex / 60) * Math.PI * 2;
      const minuteMajor = minuteIndex % 5 === 0;
      const minuteTick = new THREE.Mesh(
        new THREE.BoxGeometry(
          minuteMajor ? 0.045 : 0.022,
          0.045,
          minuteMajor ? 0.18 : 0.09
        ),
        darkSteel
      );
      minuteTick.position.set(
        Math.sin(minuteAngle) * 2.22,
        0.63,
        Math.cos(minuteAngle) * 2.22
      );
      minuteTick.rotation.y = minuteAngle;
      watch.add(minuteTick);
    }

    for (let hourIndex = 0; hourIndex < 12; hourIndex += 1) {
      const hourAngle = (hourIndex / 12) * Math.PI * 2;
      const isCardinal = hourIndex % 3 === 0;
      const markerWidth = isCardinal ? 0.17 : 0.115;
      const markerLength = isCardinal ? 0.40 : 0.30;
      const markerRadius = 1.93;
      const marker = new THREE.Mesh(
        new THREE.BoxGeometry(markerWidth, 0.10, markerLength),
        markerMaterial
      );
      marker.position.set(
        Math.sin(hourAngle) * markerRadius,
        0.66,
        Math.cos(hourAngle) * markerRadius
      );
      marker.rotation.y = hourAngle;
      marker.castShadow = true;
      watch.add(marker);
    }

    const twelveMarker = new THREE.Mesh(
      new THREE.ConeGeometry(0.15, 0.28, 4),
      markerMaterial
    );
    twelveMarker.rotation.x = Math.PI / 2;
    twelveMarker.position.set(0, 0.69, 1.94);
    twelveMarker.castShadow = true;
    watch.add(twelveMarker);

    const dateWindow = addBox(
      watch,
      0.48,
      0.055,
      0.32,
      { x: 1.72, y: 0.68, z: 0 },
      polishedSteel
    );
    const dateInset = addBox(
      watch,
      0.34,
      0.02,
      0.23,
      { x: 1.72, y: 0.72, z: 0 },
      blackMaterial
    );
    addBox(
      watch,
      0.03,
      0.025,
      0.15,
      { x: 1.72, y: 0.74, z: 0 },
      markerMaterial
    );

    const subdial = addCylinder(
      watch,
      0.48,
      0.035,
      { x: 0, y: 0.68, z: -1.03 },
      dialInsetMaterial,
      48
    );
    const subdialRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.42, 0.025, 8, 48),
      darkSteel
    );
    subdialRing.rotation.x = Math.PI / 2;
    subdialRing.position.set(0, 0.71, -1.03);
    watch.add(subdialRing);

    for (let subTickIndex = 0; subTickIndex < 12; subTickIndex += 1) {
      const subTickAngle = (subTickIndex / 12) * Math.PI * 2;
      const subTick = new THREE.Mesh(
        new THREE.BoxGeometry(0.025, 0.035, 0.11),
        markerMaterial
      );
      subTick.position.set(
        Math.sin(subTickAngle) * 0.35,
        0.72,
        -1.03 + Math.cos(subTickAngle) * 0.35
      );
      subTick.rotation.y = subTickAngle;
      watch.add(subTick);
    }

    const handGroups = {};

    function createHand(key, width, length, thickness, material, angle) {
      const handGroup = new THREE.Group();
      handGroup.position.y = 0.76;
      const handMesh = new THREE.Mesh(
        new THREE.BoxGeometry(width, thickness, length),
        material
      );
      handMesh.position.z = length / 2;
      handMesh.castShadow = true;
      handGroup.add(handMesh);
      handGroup.rotation.y = angle;
      watch.add(handGroup);
      handGroups[key] = handGroup;
      return handGroup;
    }

    createHand("hour", 0.19, 1.18, 0.075, handMaterial, 0.52);
    createHand("minute", 0.13, 1.73, 0.065, handMaterial, 4.82);
    createHand("second", 0.035, 2.02, 0.028, secondMaterial, 2.2);

    const counterweight = new THREE.Mesh(
      new THREE.BoxGeometry(0.075, 0.035, 0.48),
      secondMaterial
    );
    counterweight.position.z = -0.22;
    handGroups.second.add(counterweight);

    const centerPin = addCylinder(
      watch,
      0.16,
      0.14,
      { x: 0, y: 0.79, z: 0 },
      polishedSteel,
      32
    );

    const centerCap = addCylinder(
      watch,
      0.075,
      0.16,
      { x: 0, y: 0.87, z: 0 },
      secondMaterial,
      32
    );

    const crownGuards = new THREE.Group();
    watch.add(crownGuards);

    const upperGuard = new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 24, 16),
      steel
    );
    upperGuard.scale.set(0.8, 0.72, 0.48);
    upperGuard.position.set(2.73, 0.08, 0.76);
    upperGuard.castShadow = true;
    crownGuards.add(upperGuard);

    const lowerGuard = new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 24, 16),
      steel
    );
    lowerGuard.scale.set(0.8, 0.72, 0.48);
    lowerGuard.position.set(2.73, 0.08, 0.12);
    lowerGuard.castShadow = true;
    crownGuards.add(lowerGuard);

    const crown = addCylinder(
      watch,
      0.39,
      0.54,
      { x: 3.08, y: 0.08, z: 0.44 },
      polishedSteel,
      48
    );
    crown.rotation.z = Math.PI / 2;

    const crownCore = addCylinder(
      watch,
      0.3,
      0.62,
      { x: 3.13, y: 0.08, z: 0.44 },
      darkSteel,
      40
    );
    crownCore.rotation.z = Math.PI / 2;

    for (let crownToothIndex = 0; crownToothIndex < 20; crownToothIndex += 1) {
      const toothAngle = (crownToothIndex / 20) * Math.PI * 2;
      const tooth = new THREE.Mesh(
        new THREE.BoxGeometry(0.10, 0.095, 0.18),
        polishedSteel
      );
      tooth.position.set(
        3.42,
        0.08 + Math.sin(toothAngle) * 0.32,
        0.44 + Math.cos(toothAngle) * 0.32
      );
      tooth.rotation.x = toothAngle;
      tooth.castShadow = true;
      watch.add(tooth);
    }

    const crownEnd = new THREE.Mesh(
      new THREE.CylinderGeometry(0.29, 0.29, 0.035, 40),
      polishedSteel
    );
    crownEnd.rotation.z = Math.PI / 2;
    crownEnd.position.set(3.42, 0.08, 0.44);
    crownEnd.castShadow = true;
    watch.add(crownEnd);

    const lugMaterial = new THREE.MeshStandardMaterial({
      color: 0x7d868a,
      metalness: 0.94,
      roughness: 0.22
    });

    for (let lugSide = -1; lugSide <= 1; lugSide += 2) {
      const topLug = addBox(
        watch,
        1.58,
        0.58,
        0.66,
        { x: 0, y: -0.03, z: lugSide * 2.91 },
        lugMaterial
      );
      topLug.rotation.x = lugSide * 0.16;
      addEdges(topLug, 15);
    }

    const crystal = addCylinder(
      watch,
      2.53,
      0.075,
      { x: 0, y: 0.78, z: 0 },
      glassMaterial,
      96
    );
    crystal.castShadow = true;

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x11161a,
      metalness: 0.18,
      roughness: 0.68
    });
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      floorMaterial
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.08;
    floor.receiveShadow = true;
    scene.add(floor);

    const rimLight = new THREE.DirectionalLight(0xa8c9d8, 3.3);
    rimLight.position.set(-6, 9, -8);
    rimLight.castShadow = true;
    rimLight.shadow.mapSize.set(2048, 2048);
    rimLight.shadow.camera.left = -8;
    rimLight.shadow.camera.right = 8;
    rimLight.shadow.camera.top = 10;
    rimLight.shadow.camera.bottom = -10;
    rimLight.shadow.camera.near = 1;
    rimLight.shadow.camera.far = 30;
    scene.add(rimLight);

    const keyLight = new THREE.DirectionalLight(0xffe3bd, 2.5);
    keyLight.position.set(7, 10, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -8;
    keyLight.shadow.camera.right = 8;
    keyLight.shadow.camera.top = 8;
    keyLight.shadow.camera.bottom = -8;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 28;
    scene.add(keyLight);

    const fillLight = new THREE.PointLight(0x5b9baa, 18, 18, 2);
    fillLight.position.set(-6, 3, 5);
    scene.add(fillLight);

    const warmLight = new THREE.PointLight(0xffa65b, 12, 15, 2);
    warmLight.position.set(5, 2, -6);
    scene.add(warmLight);

    const hemisphere = new THREE.HemisphereLight(0x9bb8c7, 0x111318, 1.2);
    scene.add(hemisphere);

    const clock = new THREE.Clock();

    function updateHands() {
      const elapsed = clock.getElapsedTime();
      const now = new Date();
      const seconds = now.getSeconds() + now.getMilliseconds() / 1000;
      const minutes = now.getMinutes() + seconds / 60;
      const hours = (now.getHours() % 12) + minutes / 60;

      handGroups.second.rotation.y = seconds * (Math.PI * 2 / 60);
      handGroups.minute.rotation.y = minutes * (Math.PI * 2 / 60);
      handGroups.hour.rotation.y = hours * (Math.PI * 2 / 12);

      handGroups.second.position.y = 0.765 + Math.sin(elapsed * 2.5) * 0.002;
    }

    function animate() {
      requestAnimationFrame(animate);
      bezel.rotation.y += 0.00035;
      updateHands();
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
