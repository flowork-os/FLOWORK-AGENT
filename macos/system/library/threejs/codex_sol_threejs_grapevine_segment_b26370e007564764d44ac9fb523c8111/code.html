<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Grapevine</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #182019; }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(241, 235, 207, 0.78);
      font: 12px/1.45 Georgia, serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 1px 5px #000;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Vitis vinifera · young fruiting cane</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x182019);
    scene.fog = new THREE.FogExp2(0x182019, 0.035);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(8.6, 5.7, 10.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.1, 1.7, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.48;
    controls.minDistance = 6;
    controls.maxDistance = 24;
    controls.maxPolarAngle = Math.PI * 0.86;

    const hemi = new THREE.HemisphereLight(0xdce8ca, 0x30261e, 1.55);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xfff0cf, 4.2);
    key.position.set(-5, 10, 7);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -8;
    key.shadow.camera.right = 8;
    key.shadow.camera.top = 8;
    key.shadow.camera.bottom = -6;
    key.shadow.camera.near = 0.5;
    key.shadow.camera.far = 30;
    key.shadow.bias = -0.0003;
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x8eb6ff, 1.4);
    rim.position.set(7, 5, -8);
    scene.add(rim);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(15, 96),
      new THREE.MeshStandardMaterial({ color: 0x24291f, roughness: 0.97, metalness: 0 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.55;
    ground.receiveShadow = true;
    scene.add(ground);

    const vine = new THREE.Group();
    vine.rotation.z = -0.08;
    vine.rotation.y = -0.18;
    scene.add(vine);

    const stemPoints = [
      new THREE.Vector3(-4.4, -0.62, 0.05),
      new THREE.Vector3(-3.65, -0.22, -0.12),
      new THREE.Vector3(-2.75, 0.15, 0.18),
      new THREE.Vector3(-1.85, 0.58, -0.05),
      new THREE.Vector3(-0.95, 0.92, 0.16),
      new THREE.Vector3(0.02, 1.30, -0.10),
      new THREE.Vector3(1.02, 1.58, 0.13),
      new THREE.Vector3(2.08, 1.94, -0.05),
      new THREE.Vector3(3.12, 2.18, 0.16),
      new THREE.Vector3(4.12, 2.55, 0.02)
    ];
    const stemCurve = new THREE.CatmullRomCurve3(stemPoints, false, 'centripetal');

    const woodMaterial = new THREE.MeshStandardMaterial({
      color: 0x654226,
      roughness: 0.92,
      metalness: 0,
      bumpScale: 0.1
    });
    const stem = new THREE.Mesh(
      new THREE.TubeGeometry(stemCurve, 128, 0.205, 12, false),
      woodMaterial
    );
    stem.castShadow = true;
    stem.receiveShadow = true;
    vine.add(stem);

    const nodeMaterial = new THREE.MeshStandardMaterial({
      color: 0x805c35,
      roughness: 0.88
    });

    function addNode(t, scale = 1) {
      const p = stemCurve.getPointAt(t);
      const tangent = stemCurve.getTangentAt(t).normalize();
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.215 * scale, 0.035, 7, 18),
        nodeMaterial
      );
      ring.position.copy(p);
      ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), tangent);
      ring.castShadow = true;
      vine.add(ring);
    }

    [0.12, 0.28, 0.46, 0.63, 0.79, 0.92].forEach((t, i) => addNode(t, 1 - i * 0.025));

    const barkMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x9a7045, roughness: 1, side: THREE.DoubleSide }),
      new THREE.MeshStandardMaterial({ color: 0x4b2f1c, roughness: 0.98, side: THREE.DoubleSide }),
      new THREE.MeshStandardMaterial({ color: 0xb08a5a, roughness: 1, side: THREE.DoubleSide })
    ];

    function makeBarkStrip(startT, length, angle, width, lift, materialIndex) {
      const segments = 10;
      const positions = [];
      const indices = [];
      for (let i = 0; i <= segments; i++) {
        const t = Math.min(0.985, startT + length * i / segments);
        const p = stemCurve.getPointAt(t);
        const tangent = stemCurve.getTangentAt(t).normalize();
        let side = new THREE.Vector3(0, 1, 0).cross(tangent);
        if (side.lengthSq() < 0.01) side.set(1, 0, 0);
        side.normalize();
        const up = new THREE.Vector3().crossVectors(tangent, side).normalize();
        const a = angle + i * 0.36;
        const radial = side.multiplyScalar(Math.cos(a)).add(up.multiplyScalar(Math.sin(a))).normalize();
        const across = new THREE.Vector3().crossVectors(tangent, radial).normalize();
        const endLift = Math.pow(i / segments, 2) * lift;
        const center = p.clone().addScaledVector(radial, 0.218 + endLift);
        const taper = (1 - 0.62 * i / segments) * width;
        positions.push(
          center.x - across.x * taper, center.y - across.y * taper, center.z - across.z * taper,
          center.x + across.x * taper, center.y + across.y * taper, center.z + across.z * taper
        );
        if (i < segments) {
          const k = i * 2;
          indices.push(k, k + 1, k + 2, k + 1, k + 3, k + 2);
        }
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      const strip = new THREE.Mesh(geometry, barkMaterials[materialIndex % barkMaterials.length]);
      strip.castShadow = true;
      vine.add(strip);
    }

    const barkData = [
      [0.03, 0.17, 0.3, 0.052, 0.11, 0],
      [0.10, 0.12, 2.1, 0.042, 0.17, 2],
      [0.20, 0.19, 4.4, 0.055, 0.09, 1],
      [0.33, 0.13, 1.2, 0.046, 0.19, 0],
      [0.44, 0.18, 3.6, 0.052, 0.12, 2],
      [0.58, 0.12, 5.3, 0.043, 0.16, 0],
      [0.69, 0.17, 2.7, 0.047, 0.11, 1],
      [0.83, 0.11, 0.7, 0.039, 0.15, 2]
    ];
    barkData.forEach(d => makeBarkStrip(...d));

    function addBranch(t, direction, length, radius = 0.075) {
      const base = stemCurve.getPointAt(t);
      const d = direction.clone().normalize();
      const points = [
        base,
        base.clone().addScaledVector(d, length * 0.34).add(new THREE.Vector3(0.03, 0.1, 0)),
        base.clone().addScaledVector(d, length * 0.70).add(new THREE.Vector3(-0.06, 0.16, 0.05)),
        base.clone().addScaledVector(d, length).add(new THREE.Vector3(0, 0.22, 0))
      ];
      const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
      const mesh = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 30, radius, 8, false),
        nodeMaterial
      );
      mesh.castShadow = true;
      vine.add(mesh);
      return { curve, tip: points[points.length - 1] };
    }

    const branchA = addBranch(0.25, new THREE.Vector3(-0.12, 0.82, 0.56), 0.84, 0.075);
    const branchB = addBranch(0.51, new THREE.Vector3(0.05, 0.68, -0.72), 0.92, 0.07);
    const branchC = addBranch(0.73, new THREE.Vector3(-0.05, 0.86, 0.48), 0.78, 0.06);
    const branchD = addBranch(0.89, new THREE.Vector3(0.04, 0.74, -0.63), 0.62, 0.05);

    function createLeafGeometry() {
      const outline = [
        [0, 0], [-0.24, 0.28], [-0.66, 0.32], [-0.52, 0.60],
        [-1.12, 0.82], [-0.72, 1.02], [-1.22, 1.43], [-0.59, 1.36],
        [-0.75, 1.88], [-0.26, 1.58], [0, 2.30],
        [0.26, 1.58], [0.75, 1.88], [0.59, 1.36], [1.22, 1.43],
        [0.72, 1.02], [1.12, 0.82], [0.52, 0.60], [0.66, 0.32], [0.24, 0.28]
      ];
      const shape = new THREE.Shape();
      shape.moveTo(outline[0][0], outline[0][1]);
      for (let i = 1; i < outline.length; i++) shape.lineTo(outline[i][0], outline[i][1]);
      shape.closePath();
      const geometry = new THREE.ShapeGeometry(shape, 3);
      const pos = geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const edgeCurl = 0.055 * Math.sin(y * 5.4 + x * 3.1);
        const bowl = 0.115 * x * x - 0.035 * y;
        pos.setZ(i, edgeCurl + bowl);
      }
      geometry.computeVertexNormals();
      return geometry;
    }

    const leafGeometry = createLeafGeometry();
    const leafColors = [0x365f29, 0x497b32, 0x6e923d, 0x8a9b46, 0x587731];

    function makeLeaf(position, scale, rotation, colorIndex) {
      const group = new THREE.Group();
      group.position.copy(position);
      group.rotation.set(rotation.x, rotation.y, rotation.z);
      group.scale.setScalar(scale);

      const leafMaterial = new THREE.MeshStandardMaterial({
        color: leafColors[colorIndex % leafColors.length],
        roughness: 0.82,
        metalness: 0,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.97
      });
      const leaf = new THREE.Mesh(leafGeometry, leafMaterial);
      leaf.castShadow = true;
      leaf.receiveShadow = true;
      group.add(leaf);

      const veinMaterial = new THREE.LineBasicMaterial({
        color: colorIndex === 3 ? 0xb1b66b : 0x9aaa65,
        transparent: true,
        opacity: 0.66
      });

      const centerPoints = [];
      for (let i = 0; i <= 12; i++) {
        const y = 0.08 + i * 0.175;
        centerPoints.push(new THREE.Vector3(0, y, 0.035 + 0.006 * i));
      }
      group.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(centerPoints),
        veinMaterial
      ));

      const sideVeins = [
        [0.38, 0.63], [0.72, 1.03], [1.08, 1.42], [1.42, 1.72]
      ];
      sideVeins.forEach((v, i) => {
        const spread = [0.50, 0.86, 1.02, 0.68][i];
        for (const sign of [-1, 1]) {
          const points = [
            new THREE.Vector3(0, v[0], 0.05),
            new THREE.Vector3(sign * spread * 0.48, (v[0] + v[1]) * 0.51, 0.09),
            new THREE.Vector3(sign * spread, v[1], 0.10 + 0.02 * i)
          ];
          group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(points),
            veinMaterial
          ));
        }
      });

      const petiole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.024, 0.034, 0.48, 7),
        new THREE.MeshStandardMaterial({ color: 0x70813c, roughness: 0.85 })
      );
      petiole.position.set(0, -0.22, 0);
      petiole.rotation.z = 0.08;
      petiole.castShadow = true;
      group.add(petiole);

      vine.add(group);
    }

    makeLeaf(branchA.tip, 0.83, new THREE.Euler(-0.48, 0.32, -0.80), 2);
    makeLeaf(branchB.tip, 1.02, new THREE.Euler(0.74, -0.28, 0.47), 0);
    makeLeaf(branchC.tip, 0.92, new THREE.Euler(-0.34, -0.28, -0.46), 1);
    makeLeaf(branchD.tip, 0.66, new THREE.Euler(0.72, 0.12, 0.66), 3);
    makeLeaf(stemCurve.getPointAt(0.10).add(new THREE.Vector3(-0.06, 0.25, -0.05)), 0.72, new THREE.Euler(0.52, 0.16, -1.22), 4);

    const tendrilMaterial = new THREE.MeshStandardMaterial({
      color: 0x789142,
      roughness: 0.72
    });

    function addTendril(t, axis, length, coils, handedness = 1) {
      const base = stemCurve.getPointAt(t);
      const direction = axis.clone().normalize();
      let u = new THREE.Vector3(0, 1, 0).cross(direction);
      if (u.lengthSq() < 0.02) u.set(1, 0, 0);
      u.normalize();
      const v = new THREE.Vector3().crossVectors(direction, u).normalize();
      const points = [];
      const count = 90;
      for (let i = 0; i <= count; i++) {
        const s = i / count;
        const angle = handedness * s * coils * Math.PI * 2;
        const radius = 0.20 * (0.35 + 0.65 * s);
        const p = base.clone()
          .addScaledVector(direction, length * s)
          .addScaledVector(u, Math.cos(angle) * radius * s)
          .addScaledVector(v, Math.sin(angle) * radius * s);
        p.y += 0.14 * Math.sin(s * Math.PI);
        points.push(p);
      }
      const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
      const tendril = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 110, 0.024, 6, false),
        tendrilMaterial
      );
      tendril.castShadow = true;
      vine.add(tendril);
    }

    addTendril(0.34, new THREE.Vector3(-0.08, 0.62, 0.72), 1.28, 2.65, 1);
    addTendril(0.67, new THREE.Vector3(0.18, 0.75, -0.62), 1.42, 3.25, -1);
    addTendril(0.93, new THREE.Vector3(0.34, 0.72, 0.55), 1.05, 2.55, 1);

    const clusterAnchor = stemCurve.getPointAt(0.56).add(new THREE.Vector3(0.10, -0.12, 0.06));
    const clusterStemPoints = [
      clusterAnchor,
      clusterAnchor.clone().add(new THREE.Vector3(0.08, -0.35, 0.04)),
      clusterAnchor.clone().add(new THREE.Vector3(0.02, -0.75, 0.08))
    ];
    const clusterStemCurve = new THREE.CatmullRomCurve3(clusterStemPoints);
    const clusterStem = new THREE.Mesh(
      new THREE.TubeGeometry(clusterStemCurve, 24, 0.035, 7, false),
      tendrilMaterial
    );
    clusterStem.castShadow = true;
    vine.add(clusterStem);

    const grapeMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x604077,
      roughness: 0.29,
      metalness: 0,
      clearcoat: 0.4,
      clearcoatRoughness: 0.3,
      transmission: 0.04
    });
    const grapeGeometry = new THREE.SphereGeometry(0.18, 18, 14);
    const grapeCount = 42;
    const grapes = new THREE.InstancedMesh(grapeGeometry, grapeMaterial, grapeCount);
    grapes.castShadow = true;
    grapes.receiveShadow = true;

    const dummy = new THREE.Object3D();
    let grapeIndex = 0;
    const clusterTop = clusterAnchor.clone().add(new THREE.Vector3(0.03, -0.72, 0.08));
    for (let row = 0; row < 7; row++) {
      const count = Math.max(2, 9 - row);
      const width = 0.53 * (1 - row / 8.3);
      for (let j = 0; j < count && grapeIndex < grapeCount; j++) {
        const angle = j * 2.399963 + row * 0.72;
        const radial = width * (0.58 + 0.38 * ((j * 37 + row * 11) % 10) / 10);
        const x = Math.cos(angle) * radial;
        const z = Math.sin(angle) * radial * 0.78;
        const y = -row * 0.245 - 0.055 * Math.sin(j * 1.7);
        dummy.position.copy(clusterTop).add(new THREE.Vector3(x, y, z));
        const size = 0.88 + 0.14 * Math.sin((j + 1) * (row + 2));
        dummy.scale.set(size, size * 1.07, size);
        dummy.rotation.set(j * 0.3, row * 0.4, angle);
        dummy.updateMatrix();
        grapes.setMatrixAt(grapeIndex++, dummy.matrix);
      }
    }
    grapes.count = grapeIndex;
    vine.add(grapes);

    const bloomMaterial = new THREE.MeshStandardMaterial({
      color: 0xa897b1,
      roughness: 1,
      transparent: true,
      opacity: 0.2,
      depthWrite: false
    });
    const bloom = new THREE.InstancedMesh(
      new THREE.SphereGeometry(0.184, 12, 9),
      bloomMaterial,
      grapeIndex
    );
    for (let i = 0; i < grapeIndex; i++) {
      grapes.getMatrixAt(i, dummy.matrix);
      bloom.setMatrixAt(i, dummy.matrix);
    }
    vine.add(bloom);

    const twigMaterial = new THREE.MeshStandardMaterial({ color: 0x71813b, roughness: 0.9 });
    for (let i = 0; i < 7; i++) {
      const angle = i * 2.4;
      const start = clusterTop.clone().add(new THREE.Vector3(0, -0.05, 0));
      const end = clusterTop.clone().add(new THREE.Vector3(
        Math.cos(angle) * 0.4,
        -0.32 - (i % 3) * 0.12,
        Math.sin(angle) * 0.32
      ));
      const curve = new THREE.QuadraticBezierCurve3(
        start,
        start.clone().lerp(end, 0.5).add(new THREE.Vector3(0, 0.08, 0)),
        end
      );
      const twig = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 12, 0.016, 5, false),
        twigMaterial
      );
      vine.add(twig);
    }

    const dustGeometry = new THREE.BufferGeometry();
    const dustPositions = [];
    for (let i = 0; i < 140; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = 3.5 + Math.random() * 9;
      dustPositions.push(
        Math.cos(a) * r,
        -0.7 + Math.random() * 7,
        Math.sin(a) * r
      );
    }
    dustGeometry.setAttribute('position', new THREE.Float32BufferAttribute(dustPositions, 3));
    const dust = new THREE.Points(
      dustGeometry,
      new THREE.PointsMaterial({
        color: 0xc7c5a0,
        size: 0.022,
        transparent: true,
        opacity: 0.35,
        depthWrite: false
      })
    );
    scene.add(dust);

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();
      vine.rotation.x = Math.sin(time * 0.23) * 0.012;
      dust.rotation.y = time * 0.008;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
