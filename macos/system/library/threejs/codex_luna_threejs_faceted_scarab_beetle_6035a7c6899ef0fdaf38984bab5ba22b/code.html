<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faceted Scarab Beetle</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02090b;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02090b);
scene.fog = new THREE.Fog(0x02090b, 10, 22);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.8, 3.8, 7.6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 5;
controls.maxDistance = 12;
controls.target.set(0, 0.25, 0);

scene.add(new THREE.HemisphereLight(0x78b8a9, 0x020509, 1.35));

const keyLight = new THREE.DirectionalLight(0xd9fff1, 3.2);
keyLight.position.set(-4.5, 7.5, 5.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -6;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 20;
scene.add(keyLight);

const rimLight = new THREE.SpotLight(0x2be4c0, 18, 15, Math.PI / 5, 0.55, 1.3);
rimLight.position.set(4.5, 5.5, -4.5);
rimLight.target.position.set(0, 0.5, 0);
rimLight.castShadow = true;
rimLight.shadow.mapSize.set(1024, 1024);
scene.add(rimLight);
scene.add(rimLight.target);

const amberLight = new THREE.PointLight(0xffa63d, 3.4, 7, 2);
amberLight.position.set(0, 1.4, 3.2);
scene.add(amberLight);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(24, 24),
  new THREE.MeshStandardMaterial({
    color: 0x061417,
    roughness: 0.72,
    metalness: 0.2
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.72;
floor.receiveShadow = true;
scene.add(floor);

const beetle = new THREE.Group();
beetle.position.y = 0.04;
scene.add(beetle);

function makeFacetGeometry(radius, detail, palette) {
  const geometry = new THREE.IcosahedronGeometry(radius, detail).toNonIndexed();
  const position = geometry.getAttribute("position");
  const colorArray = new Float32Array(position.count * 3);

  for (let i = 0; i < position.count; i += 3) {
    const color = new THREE.Color(palette[(i / 3 * 7 + 2) % palette.length]);
    const variation = 0.88 + (((i / 3 * 13) % 9) / 100);
    color.multiplyScalar(variation);

    for (let j = 0; j < 3; j++) {
      colorArray[(i + j) * 3] = color.r;
      colorArray[(i + j) * 3 + 1] = color.g;
      colorArray[(i + j) * 3 + 2] = color.b;
    }
  }

  geometry.setAttribute("color", new THREE.Float32BufferAttribute(colorArray, 3));
  return geometry;
}

function gemMaterial(options = {}) {
  return new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    vertexColors: true,
    flatShading: true,
    roughness: options.roughness ?? 0.22,
    metalness: options.metalness ?? 0.36,
    clearcoat: options.clearcoat ?? 0.8,
    clearcoatRoughness: options.clearcoatRoughness ?? 0.12,
    transmission: options.transmission ?? 0.06,
    ior: 1.46,
    side: THREE.DoubleSide
  });
}

function addGem(radius, detail, scale, position, palette, materialOptions = {}) {
  const mesh = new THREE.Mesh(
    makeFacetGeometry(radius, detail, palette),
    gemMaterial(materialOptions)
  );
  mesh.scale.set(scale.x, scale.y, scale.z);
  mesh.position.copy(position);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  beetle.add(mesh);
  return mesh;
}

function addCylinderBetween(start, end, radiusStart, radiusEnd, material, radialSegments = 6) {
  const direction = end.clone().sub(start);
  const length = direction.length();
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radiusStart, radiusEnd, length, radialSegments, 1, false),
    material
  );
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  beetle.add(mesh);
  return mesh;
}

function addConeBetween(base, tip, radius, material) {
  const direction = tip.clone().sub(base);
  const length = direction.length();
  const mesh = new THREE.Mesh(
    new THREE.ConeGeometry(radius, length, 6, 1, false),
    material
  );
  mesh.position.copy(base).add(tip).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  beetle.add(mesh);
  return mesh;
}

const greenPalette = [
  0x062c2d,
  0x07473d,
  0x096454,
  0x0c8066,
  0x159b78,
  0x185f69,
  0x0a3944,
  0x28a989
];

const darkPalette = [
  0x031b22,
  0x063139,
  0x074b4b,
  0x0a6358,
  0x0e7c67
];

const goldPalette = [
  0x6c3510,
  0x9e5518,
  0xd18425,
  0xf0ad42,
  0x8b4514,
  0xffc965
];

const shellMaterialOptions = {
  roughness: 0.16,
  metalness: 0.38,
  clearcoat: 1,
  clearcoatRoughness: 0.08,
  transmission: 0.12
};

addGem(1, 2, { x: 1.53, y: 0.93, z: 1.82 }, new THREE.Vector3(0, 0.38, -0.05), darkPalette, {
  roughness: 0.25,
  metalness: 0.42,
  clearcoat: 0.8,
  transmission: 0.05
});

addGem(1, 2, { x: 1.27, y: 1.13, z: 1.63 }, new THREE.Vector3(-0.61, 0.72, -0.05), greenPalette, shellMaterialOptions);
addGem(1, 2, { x: 1.27, y: 1.13, z: 1.63 }, new THREE.Vector3(0.61, 0.72, -0.05), greenPalette, shellMaterialOptions);

const seamMaterial = new THREE.MeshStandardMaterial({
  color: 0x01191c,
  roughness: 0.28,
  metalness: 0.58,
  flatShading: true
});

const seam = new THREE.Mesh(
  new THREE.CylinderGeometry(0.034, 0.034, 2.88, 6, 1, false),
  seamMaterial
);
seam.rotation.x = Math.PI / 2;
seam.position.set(0, 1.52, -0.03);
seam.scale.z = 0.98;
seam.castShadow = true;
beetle.add(seam);

const thorax = addGem(
  1,
  1,
  { x: 1.03, y: 0.64, z: 0.58 },
  new THREE.Vector3(0, 0.64, 1.16),
  darkPalette,
  { roughness: 0.2, metalness: 0.5, clearcoat: 0.9 }
);

const goldMaterial = gemMaterial({
  roughness: 0.19,
  metalness: 0.62,
  clearcoat: 0.9,
  clearcoatRoughness: 0.1,
  transmission: 0.03
});
goldMaterial.vertexColors = true;

const head = new THREE.Mesh(
  makeFacetGeometry(1, 1, goldPalette),
  goldMaterial
);
head.scale.set(0.82, 0.62, 0.72);
head.position.set(0, 0.62, 1.82);
head.castShadow = true;
head.receiveShadow = true;
beetle.add(head);

const facePlate = new THREE.Mesh(
  makeFacetGeometry(1, 1, [0x8b4313, 0xc06c20, 0xf0a73e, 0x6d3010]),
  goldMaterial
);
facePlate.scale.set(0.52, 0.38, 0.27);
facePlate.position.set(0, 0.53, 2.38);
facePlate.castShadow = true;
beetle.add(facePlate);

const eyeMaterial = new THREE.MeshStandardMaterial({
  color: 0x062b2b,
  roughness: 0.16,
  metalness: 0.62,
  emissive: 0x0b6860,
  emissiveIntensity: 0.65,
  flatShading: true
});

for (const side of [-1, 1]) {
  const eye = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.115, 1),
    eyeMaterial
  );
  eye.scale.set(1, 0.82, 0.7);
  eye.position.set(side * 0.56, 0.75, 2.28);
  eye.castShadow = true;
  beetle.add(eye);
}

for (const side of [-1, 1]) {
  const hornBase = new THREE.Vector3(side * 0.3, 0.96, 2.17);
  const hornTip = new THREE.Vector3(side * 0.55, 1.67, 2.35);
  addConeBetween(hornBase, hornTip, 0.16, goldMaterial);

  const hornTipBase = new THREE.Vector3(side * 0.55, 1.67, 2.35);
  const hornTipEnd = new THREE.Vector3(side * 0.76, 1.79, 2.56);
  addConeBetween(hornTipBase, hornTipEnd, 0.105, goldMaterial);

  const antennaA = new THREE.Vector3(side * 0.45, 0.71, 2.36);
  const antennaB = new THREE.Vector3(side * 0.78, 0.59, 2.72);
  const antennaC = new THREE.Vector3(side * 1.08, 0.68, 2.88);
  addCylinderBetween(antennaA, antennaB, 0.035, 0.028, goldMaterial, 5);
  addCylinderBetween(antennaB, antennaC, 0.028, 0.014, goldMaterial, 5);

  const antennaTip = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.06, 1),
    goldMaterial
  );
  antennaTip.position.copy(antennaC);
  antennaTip.castShadow = true;
  beetle.add(antennaTip);
}

function addLeg(side, zPosition, style) {
  const s = side;
  const attach = new THREE.Vector3(s * 1.02, 0.32, zPosition);
  const elbow = new THREE.Vector3(s * (1.52 + style * 0.05), -0.02, zPosition + style * 0.18);
  const wrist = new THREE.Vector3(s * (1.94 + style * 0.09), -0.42, zPosition + style * 0.4);
  const foot = new THREE.Vector3(s * (2.32 + style * 0.06), -0.56, zPosition + style * 0.55);

  addCylinderBetween(attach, elbow, 0.105, 0.085, goldMaterial, 6);
  addCylinderBetween(elbow, wrist, 0.085, 0.06, goldMaterial, 6);
  addCylinderBetween(wrist, foot, 0.06, 0.023, goldMaterial, 5);

  const elbowJoint = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.105, 1),
    goldMaterial
  );
  elbowJoint.position.copy(elbow);
  elbowJoint.castShadow = true;
  beetle.add(elbowJoint);

  const footJoint = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.07, 1),
    goldMaterial
  );
  footJoint.position.copy(foot);
  footJoint.castShadow = true;
  beetle.add(footJoint);

  const toeForward = foot.clone().add(new THREE.Vector3(s * 0.3, -0.02, 0.18));
  const toeBackward = foot.clone().add(new THREE.Vector3(s * 0.25, -0.015, -0.17));
  addConeBetween(foot, toeForward, 0.035, goldMaterial);
  addConeBetween(foot, toeBackward, 0.032, goldMaterial);
}

addLeg(-1, 0.96, 1);
addLeg(1, 0.96, 1);
addLeg(-1, 0.02, 0);
addLeg(1, 0.02, 0);
addLeg(-1, -0.91, -1);
addLeg(1, -0.91, -1);

const undersideMaterial = new THREE.MeshStandardMaterial({
  color: 0x052a2c,
  roughness: 0.32,
  metalness: 0.48,
  flatShading: true
});

const underside = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1, 1),
  undersideMaterial
);
underside.scale.set(1.22, 0.35, 1.38);
underside.position.set(0, -0.12, -0.05);
underside.castShadow = true;
beetle.add(underside);

const accentMaterial = new THREE.MeshStandardMaterial({
  color: 0x55e0b4,
  roughness: 0.18,
  metalness: 0.55,
  emissive: 0x0d6e5b,
  emissiveIntensity: 0.22,
  flatShading: true
});

for (const side of [-1, 1]) {
  const accent = new THREE.Mesh(
    new THREE.CylinderGeometry(0.018, 0.018, 2.42, 5, 1, false),
    accentMaterial
  );
  accent.rotation.x = Math.PI / 2;
  accent.position.set(side * 1.17, 1.28, -0.05);
  accent.rotation.z = side * 0.18;
  accent.castShadow = true;
  beetle.add(accent);
}

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  amberLight.intensity = 3.2 + Math.sin(elapsed * 1.7) * 0.35;
  rimLight.intensity = 17.5 + Math.sin(elapsed * 1.15 + 1.4) * 1.2;
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
