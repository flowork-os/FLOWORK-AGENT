<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moth Orchid — Phalaenopsis</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16171a; }
  #app { position: fixed; inset: 0; }
  .caption {
    position: fixed; left: 18px; bottom: 16px; z-index: 10;
    font: 300 13px/1.5 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    letter-spacing: .04em; color: rgba(235,232,228,.55);
    pointer-events: none; user-select: none;
  }
  .caption b { font-weight: 500; color: rgba(245,243,240,.82); letter-spacing:.06em; }
</style>
</head>
<body>
<div id="app"></div>
<div class="caption"><b>Phalaenopsis</b> &nbsp;·&nbsp; procedural moth orchid · drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const DEG = Math.PI / 180;

/* ------------------------------------------------------------------ *
 *  Renderer / Scene / Camera
 * ------------------------------------------------------------------ */
const container = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17181b);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(6.6, 4.4, 8.6);

/* Soft indoor environment for physically-based reflections (procedural, no assets) */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ *
 *  Lighting  — hemisphere fill + directional key + rim
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xdfe8ff, 0x2b2419, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e8, 2.5);
key.position.set(5.5, 9.0, 5.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 34;
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 10;
key.shadow.camera.bottom = -1.5;
key.shadow.bias = -0.0005;
key.shadow.normalBias = 0.02;
key.shadow.radius = 5;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd0ff, 0.55);
fill.position.set(-6.5, 4.2, 3.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffe6cf, 1.15);
rim.position.set(-3.5, 6.5, -7.5);
scene.add(rim);

/* ------------------------------------------------------------------ *
 *  Ground — receives shadow only
 * ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.ShadowMaterial({ opacity: 0.4 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ *
 *  Materials
 * ------------------------------------------------------------------ */
const matPetal = new THREE.MeshPhysicalMaterial({
  vertexColors: true, color: 0xffffff, roughness: 0.5, metalness: 0.0,
  clearcoat: 0.25, clearcoatRoughness: 0.35,
  sheen: 0.7, sheenRoughness: 0.6, sheenColor: new THREE.Color(0xffe0e8),
  emissive: 0xffd9e0, emissiveIntensity: 0.025,
  side: THREE.DoubleSide
});

const matLip = new THREE.MeshPhysicalMaterial({
  vertexColors: true, color: 0xffffff, roughness: 0.45, clearcoat: 0.25,
  clearcoatRoughness: 0.35, sheen: 0.4, sheenColor: new THREE.Color(0xffc0d8),
  side: THREE.DoubleSide
});

const matThroat = new THREE.MeshPhysicalMaterial({
  color: 0xf2bd18, roughness: 0.45, clearcoat: 0.3,
  emissive: 0xffcb33, emissiveIntensity: 0.18
});

const matAnther = new THREE.MeshPhysicalMaterial({
  color: 0xfff0c2, roughness: 0.4, clearcoat: 0.4
});

const matColumn = new THREE.MeshPhysicalMaterial({
  color: 0xfff3f2, roughness: 0.35, clearcoat: 0.45, clearcoatRoughness: 0.25
});

const matLeaf = new THREE.MeshPhysicalMaterial({
  vertexColors: true, color: 0xffffff, roughness: 0.34, metalness: 0.0,
  clearcoat: 0.6, clearcoatRoughness: 0.24,
  sheen: 0.3, sheenColor: new THREE.Color(0x8fae66),
  side: THREE.DoubleSide
});

const matStem = new THREE.MeshPhysicalMaterial({
  color: 0x5f7f3f, roughness: 0.55, clearcoat: 0.22, clearcoatRoughness: 0.4
});

const matPedicel = new THREE.MeshStandardMaterial({ color: 0x6c8a46, roughness: 0.6 });

const matStake = new THREE.MeshPhysicalMaterial({
  color: 0x3c6b38, roughness: 0.35, clearcoat: 0.5, clearcoatRoughness: 0.3
});

const matClip = new THREE.MeshPhysicalMaterial({
  color: 0x74c258, roughness: 0.35, clearcoat: 0.35, clearcoatRoughness: 0.3
});

const matBud = new THREE.MeshPhysicalMaterial({
  color: 0x8ba85a, roughness: 0.5, clearcoat: 0.3, sheen: 0.25
});

const matPot = new THREE.MeshPhysicalMaterial({
  color: 0xe9e2d3, roughness: 0.5, metalness: 0.0,
  clearcoat: 0.35, clearcoatRoughness: 0.4
});

const matBark = new THREE.MeshStandardMaterial({ color: 0x4a3524, roughness: 0.96 });
const matRoot = new THREE.MeshPhysicalMaterial({ color: 0xaebf9f, roughness: 0.55, clearcoat: 0.2 });

/* ------------------------------------------------------------------ *
 *  Parametric petal / leaf geometry
 *  A grid strip that widens & narrows along its length, with cupping,
 *  lengthwise curl, optional arc-bend (for leaves), and vertex colours.
 * ------------------------------------------------------------------ */
function makePetal(o) {
  const {
    length = 1, width = 1, a = 0.6, b = 0.45,
    cup = 0.25, curl = -0.1, bend = 0, ruffle = 0,
    segU = 26, segV = 14,
    colBase = new THREE.Color(0xffffff),
    colTip = new THREE.Color(0xffffff),
    colBias = 1.0
  } = o;

  // width profile normalised so its max === 1
  const prof = new Array(segU + 1);
  let mx = 1e-6;
  for (let i = 0; i <= segU; i++) {
    const u = i / segU;
    const p = Math.pow(u, a) * Math.pow(1 - u, b);
    prof[i] = p;
    if (p > mx) mx = p;
  }
  for (let i = 0; i <= segU; i++) prof[i] /= mx;

  const pos = [], uv = [], col = [], idx = [];
  const c = new THREE.Color();

  for (let i = 0; i <= segU; i++) {
    const u = i / segU;
    const hw = width * 0.5 * prof[i];
    for (let j = 0; j <= segV; j++) {
      const t = j / segV;
      const s = (t - 0.5) * 2;             // -1 .. 1 across
      let x = s * hw;
      let y = u * length;
      let z = cup * (s * s) * width * 0.5; // cross-section cupping (edges toward front)
      z += curl * (u * u) * length;        // lengthwise curl
      if (ruffle) z += ruffle * width * 0.15 * Math.sin(u * Math.PI * 5) * Math.abs(s);
      if (bend) {                          // gentle arc along the length (leaves)
        const R = length / bend;
        const ang = y / R;
        y = R * Math.sin(ang);
        z = z + R * (1 - Math.cos(ang));
      }
      pos.push(x, y, z);
      uv.push(t, u);
      c.copy(colBase).lerp(colTip, Math.pow(u, colBias));
      col.push(c.r, c.g, c.b);
    }
  }

  for (let i = 0; i < segU; i++) {
    for (let j = 0; j < segV; j++) {
      const p = i * (segV + 1) + j;
      idx.push(p, p + segV + 1, p + 1, p + 1, p + segV + 1, p + segV + 2);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* helper: a tapered cylinder spanning two world points */
function tubeBetween(p1, p2, r1, r2, mat, seg = 8) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(r2, r1, len, seg, 1, false);
  geo.translate(0, len / 2, 0);
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(p1);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

/* helper: orient an object so its local +Z faces `dir` */
const _lm = new THREE.Matrix4();
const _up = new THREE.Vector3(0, 1, 0);
const _o = new THREE.Vector3(0, 0, 0);
function faceZ(obj, dir) {
  _lm.lookAt(dir.clone().normalize(), _o, _up);
  obj.quaternion.setFromRotationMatrix(_lm);
}

/* ------------------------------------------------------------------ *
 *  Shared flower part geometries
 * ------------------------------------------------------------------ */
const ivory = new THREE.Color(0xf5f1e2);
const white = new THREE.Color(0xfffdfd);
const yellow = new THREE.Color(0xf2c62a);
const magenta = new THREE.Color(0xc23a78);

const geoPetal  = makePetal({ length: 0.98, width: 1.04, a: 0.62, b: 0.42, cup: 0.30, curl: -0.10, colBase: ivory, colTip: white, colBias: 1.3 });
const geoSepalD = makePetal({ length: 0.95, width: 0.50, a: 0.50, b: 0.62, cup: 0.22, curl: -0.08, colBase: ivory, colTip: white, colBias: 1.3 });
const geoSepalL = makePetal({ length: 1.00, width: 0.58, a: 0.50, b: 0.55, cup: 0.22, curl: -0.10, colBase: ivory, colTip: white, colBias: 1.3 });
const geoLipMid = makePetal({ length: 0.58, width: 0.60, a: 0.50, b: 0.42, cup: 0.55, curl: 0.42, colBase: yellow, colTip: magenta, colBias: 0.65, segU: 20, segV: 12 });
const geoLipSide = makePetal({ length: 0.32, width: 0.26, a: 0.6, b: 0.55, cup: 0.6, curl: 0.15, colBase: yellow, colTip: magenta, colBias: 0.7, segU: 14, segV: 10 });

const geoCallus  = new THREE.SphereGeometry(0.05, 14, 12);
const geoAnther  = new THREE.SphereGeometry(0.05, 14, 12);
const geoColumn  = new THREE.CapsuleGeometry(0.075, 0.22, 6, 14);
const geoAntenna = new THREE.CylinderGeometry(0.006, 0.014, 0.24, 6);
geoAntenna.translate(0, 0.12, 0);

/* ------------------------------------------------------------------ *
 *  Build a single bloom
 * ------------------------------------------------------------------ */
function makeFlower() {
  const g = new THREE.Group();

  const petal = (geo, ang, fwd) => {
    const pivot = new THREE.Object3D();
    pivot.rotation.z = ang;
    const arm = new THREE.Object3D();
    arm.rotation.x = fwd;
    const m = new THREE.Mesh(geo, matPetal);
    m.castShadow = true;
    m.receiveShadow = true;
    arm.add(m);
    pivot.add(arm);
    g.add(pivot);
  };

  // dorsal sepal (top), two lateral sepals (lower), two broad petals (sides)
  petal(geoSepalD, 0, 0.02);
  petal(geoSepalL, 2.30, 0.02);
  petal(geoSepalL, -2.30, 0.02);
  petal(geoPetal, 1.05, 0.05);
  petal(geoPetal, -1.05, 0.05);

  // labellum (lip)
  const lip = new THREE.Group();
  const mid = new THREE.Mesh(geoLipMid, matLip);
  mid.rotation.z = Math.PI;
  mid.position.set(0, -0.02, 0.02);
  mid.castShadow = true;
  lip.add(mid);

  const sideLobe = (sgn) => {
    const s = new THREE.Mesh(geoLipSide, matLip);
    s.rotation.z = Math.PI + sgn * 0.6;
    s.rotation.x = -0.5;
    s.position.set(sgn * 0.1, 0.0, 0.08);
    lip.add(s);
  };
  sideLobe(1);
  sideLobe(-1);

  const callus = new THREE.Mesh(geoCallus, matThroat);
  callus.position.set(0, 0.0, 0.14);
  callus.scale.set(1, 1.7, 1);
  lip.add(callus);

  const antenna = (sgn) => {
    const a = new THREE.Mesh(geoAntenna, matAnther);
    a.position.set(sgn * 0.04, 0.05, 0.15);
    a.rotation.x = -1.15;
    a.rotation.z = sgn * 0.32;
    lip.add(a);
  };
  antenna(1);
  antenna(-1);
  g.add(lip);

  // column + anther cap
  const col = new THREE.Mesh(geoColumn, matColumn);
  col.position.set(0, 0.06, 0.12);
  col.rotation.x = 2.3;
  col.castShadow = true;
  g.add(col);

  const cap = new THREE.Mesh(geoAnther, matAnther);
  cap.position.set(0, -0.02, 0.28);
  cap.scale.setScalar(0.85);
  g.add(cap);

  return g;
}

/* ------------------------------------------------------------------ *
 *  Bud geometry (teardrop via lathe)
 * ------------------------------------------------------------------ */
const budPts = [
  new THREE.Vector2(0.001, 0.0),
  new THREE.Vector2(0.05, 0.03),
  new THREE.Vector2(0.10, 0.12),
  new THREE.Vector2(0.135, 0.27),
  new THREE.Vector2(0.12, 0.44),
  new THREE.Vector2(0.07, 0.60),
  new THREE.Vector2(0.006, 0.66)
];
const geoBud = new THREE.LatheGeometry(budPts, 16);

/* ================================================================== *
 *  ASSEMBLE THE ORCHID
 * ================================================================== */
const orchid = new THREE.Group();

/* ---- Ceramic pot (lathe profile, hollow with rim) ---- */
const potProfile = [
  [0.00, 0.00], [0.94, 0.00], [0.97, 0.10], [1.10, 0.75],
  [1.30, 1.40], [1.35, 1.50], [1.30, 1.52], [1.16, 1.48],
  [1.12, 1.30], [1.05, 0.55], [1.00, 0.28]
].map(p => new THREE.Vector2(p[0], p[1]));
const potGeo = new THREE.LatheGeometry(potProfile, 56);
potGeo.computeVertexNormals();
const pot = new THREE.Mesh(potGeo, matPot);
pot.castShadow = true;
pot.receiveShadow = true;
orchid.add(pot);

/* ---- Substrate / bark mix ---- */
const substrate = new THREE.Mesh(
  new THREE.CylinderGeometry(1.08, 0.98, 0.34, 40),
  matBark
);
substrate.position.y = 1.30;
substrate.receiveShadow = true;
substrate.castShadow = true;
orchid.add(substrate);

// scattered bark chips
const chipGeo = new THREE.BoxGeometry(1, 0.5, 0.7);
for (let i = 0; i < 30; i++) {
  const r = Math.sqrt(Math.random()) * 1.0;
  const th = Math.random() * Math.PI * 2;
  const s = 0.11 + Math.random() * 0.09;
  const chip = new THREE.Mesh(chipGeo, matBark.clone());
  chip.material.color.setHSL(0.08 + Math.random() * 0.04, 0.4, 0.14 + Math.random() * 0.08);
  chip.scale.set(s, s * 0.5, s * 0.75);
  chip.position.set(Math.cos(th) * r, 1.45 + Math.random() * 0.03, Math.sin(th) * r);
  chip.rotation.set(Math.random() * 0.6, Math.random() * Math.PI, Math.random() * 0.6);
  chip.castShadow = true;
  chip.receiveShadow = true;
  orchid.add(chip);
}
// moss clumps
const mossGeo = new THREE.IcosahedronGeometry(0.09, 0);
for (let i = 0; i < 14; i++) {
  const r = Math.sqrt(Math.random()) * 0.95;
  const th = Math.random() * Math.PI * 2;
  const moss = new THREE.Mesh(mossGeo, new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(0.24, 0.4, 0.24 + Math.random() * 0.08), roughness: 0.95
  }));
  moss.scale.set(1 + Math.random() * 0.6, 0.6, 1 + Math.random() * 0.6);
  moss.position.set(Math.cos(th) * r, 1.46, Math.sin(th) * r);
  moss.castShadow = true;
  moss.receiveShadow = true;
  orchid.add(moss);
}

/* ---- Basal leaves (broad, glossy, arching) ---- */
const darkGreen = new THREE.Color(0x244f1c);
const litGreen = new THREE.Color(0x3f7e31);
const leafData = [
  { az: -0.55, pitch: 1.34, len: 2.75, wid: 1.38, bend: 0.85, roll: 0.10 },
  { az: 2.55, pitch: 1.40, len: 2.55, wid: 1.26, bend: 0.92, roll: -0.10 },
  { az: 1.15, pitch: 1.16, len: 2.95, wid: 1.46, bend: 0.80, roll: 0.05 },
  { az: -2.25, pitch: 1.22, len: 2.60, wid: 1.30, bend: 0.90, roll: -0.06 }
];
for (const d of leafData) {
  const geo = makePetal({
    length: d.len, width: d.wid, a: 0.55, b: 0.5, cup: 0.30, curl: 0, bend: d.bend,
    segU: 30, segV: 14, colBase: darkGreen, colTip: litGreen, colBias: 0.8
  });
  const m = new THREE.Mesh(geo, matLeaf);
  m.castShadow = true;
  m.receiveShadow = true;
  const pivot = new THREE.Object3D();
  pivot.position.set(0, 1.5, 0);
  pivot.rotation.y = d.az;
  const arm = new THREE.Object3D();
  arm.rotation.x = d.pitch;
  arm.rotation.y = d.roll;
  arm.position.z = 0.12;
  arm.add(m);
  pivot.add(arm);
  orchid.add(pivot);
}

/* ---- Arching flower stem (tube along a curve) ---- */
const stemPts = [
  [0.05, 1.55, 0.00], [0.10, 2.40, 0.02], [0.14, 3.30, 0.03], [0.17, 4.10, 0.05],
  [0.30, 4.90, 0.10], [0.75, 5.62, 0.20], [1.55, 6.02, 0.30], [2.50, 5.92, 0.36],
  [3.35, 5.46, 0.44], [3.92, 5.00, 0.50]
].map(p => new THREE.Vector3(p[0], p[1], p[2]));
const stemCurve = new THREE.CatmullRomCurve3(stemPts, false, 'catmullrom', 0.5);
const stemGeo = new THREE.TubeGeometry(stemCurve, 140, 0.062, 10, false);
const stem = new THREE.Mesh(stemGeo, matStem);
stem.castShadow = true;
stem.receiveShadow = true;
orchid.add(stem);

/* ---- Vertical support stake + clips ---- */
const stakeBase = new THREE.Vector3(0.15, 1.55, 0.05);
const stakeTop = new THREE.Vector3(0.20, 4.35, 0.06);
orchid.add(tubeBetween(stakeBase, stakeTop, 0.035, 0.03, matStake, 8));
// clip rings that tie the stem to the stake
const clipGeo = new THREE.TorusGeometry(0.115, 0.028, 10, 20);
[2.55, 3.55].forEach(y => {
  const t = (y - stemPts[0].y) / (stemPts[stemPts.length - 1].y - stemPts[0].y);
  const p = stemCurve.getPoint(Math.min(0.42 * (y - 1.55) / (4.35 - 1.55), 0.42));
  const clip = new THREE.Mesh(clipGeo, matClip);
  clip.position.set(0.16, y, 0.05);
  clip.rotation.x = Math.PI / 2;
  clip.castShadow = true;
  orchid.add(clip);
});

/* ---- A couple of draping aerial roots ---- */
function rootCurve(a) {
  const pts = [
    new THREE.Vector3(0.2 * Math.cos(a), 1.45, 0.2 * Math.sin(a)),
    new THREE.Vector3(0.9 * Math.cos(a), 1.5, 0.9 * Math.sin(a)),
    new THREE.Vector3(1.35 * Math.cos(a), 1.35, 1.35 * Math.sin(a)),
    new THREE.Vector3(1.45 * Math.cos(a), 0.9, 1.45 * Math.sin(a)),
    new THREE.Vector3(1.4 * Math.cos(a + 0.2), 0.55, 1.4 * Math.sin(a + 0.2))
  ];
  const c = new THREE.CatmullRomCurve3(pts);
  const r = new THREE.Mesh(new THREE.TubeGeometry(c, 40, 0.045, 7, false), matRoot);
  r.castShadow = true;
  r.receiveShadow = true;
  return r;
}
orchid.add(rootCurve(-1.9));
orchid.add(rootCurve(2.7));

/* ---- Blooms along the arch ---- */
const bloomT = [0.34, 0.44, 0.54, 0.63, 0.72, 0.81];
const yAxis = new THREE.Vector3(0, 1, 0);
bloomT.forEach((t, i) => {
  const P = stemCurve.getPointAt(t);
  const radial = new THREE.Vector3(P.x, 0, P.z);
  if (radial.length() < 0.15) radial.set(1, 0, 0);
  radial.normalize();
  const side = new THREE.Vector3().crossVectors(radial, yAxis).normalize();
  const zsign = (i % 2 === 0 ? 1 : -1) * (0.25 + 0.04 * i);

  const outDir = radial.clone().multiplyScalar(0.72)
    .add(side.clone().multiplyScalar(zsign))
    .add(new THREE.Vector3(0, -0.36, 0)).normalize();
  const fpos = P.clone().add(outDir.clone().multiplyScalar(0.55));

  // pedicel from stem to flower
  orchid.add(tubeBetween(P, fpos, 0.045, 0.03, matPedicel, 7));

  // the flower
  const fl = makeFlower();
  const scale = 0.82 - 0.02 * i;
  fl.scale.setScalar(scale);
  fl.position.copy(fpos);
  const faceDir = radial.clone().multiplyScalar(0.9)
    .add(side.clone().multiplyScalar(zsign * 0.7))
    .add(new THREE.Vector3(0, 0.04, 0)).normalize();
  faceZ(fl, faceDir);
  fl.rotateZ((Math.random() - 0.5) * 0.5); // slight natural roll about the facing axis
  orchid.add(fl);
});

/* ---- Buds near the tip ---- */
const budT = [0.88, 0.94, 0.99];
budT.forEach((t, i) => {
  const P = stemCurve.getPointAt(t);
  const radial = new THREE.Vector3(P.x, 0, P.z).normalize();
  const side = new THREE.Vector3().crossVectors(radial, yAxis).normalize();
  const zsign = (i % 2 === 0 ? 1 : -1) * 0.2;
  const outDir = radial.clone().multiplyScalar(0.6)
    .add(side.clone().multiplyScalar(zsign))
    .add(new THREE.Vector3(0, -0.4, 0)).normalize();
  const bpos = P.clone().add(outDir.clone().multiplyScalar(0.28));
  orchid.add(tubeBetween(P, bpos, 0.035, 0.025, matPedicel, 6));

  const bud = new THREE.Mesh(geoBud, matBud);
  const s = 0.9 - i * 0.18;
  bud.scale.setScalar(s);
  bud.position.copy(bpos);
  bud.quaternion.setFromUnitVectors(yAxis, outDir.clone().negate());
  bud.castShadow = true;
  orchid.add(bud);
});

scene.add(orchid);

/* ---- Centre the object horizontally & set the orbit target ---- */
const box = new THREE.Box3().setFromObject(orchid);
const c = box.getCenter(new THREE.Vector3());
orchid.position.x -= c.x;
orchid.position.z -= c.z;
const targetY = THREE.MathUtils.lerp(box.min.y, box.max.y, 0.46);

/* ------------------------------------------------------------------ *
 *  Controls
 * ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 4.5;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI * 0.5;
controls.target.set(0, targetY, 0);
controls.update();

/* ------------------------------------------------------------------ *
 *  Resize + render loop
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
