<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carved-Wood Acoustic Guitar</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(circle at 50% 38%, #30291f 0%, #171510 58%, #090908 100%);
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12100d);
scene.fog = new THREE.FogExp2(0x12100d, 0.025);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(8.2, 2.4, 14.5);
camera.lookAt(0, 0.6, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.target.set(0, 0.65, 0);
controls.minDistance = 9;
controls.maxDistance = 25;
controls.minPolarAngle = Math.PI * 0.22;
controls.maxPolarAngle = Math.PI * 0.78;

const hemi = new THREE.HemisphereLight(0xf5dfbd, 0x24190f, 1.8);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffd9a8, 4.2);
keyLight.position.set(-5, 8, 10);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -8;
keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 11;
keyLight.shadow.camera.bottom = -8;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 35;
keyLight.shadow.bias = -0.0003;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xa9c7ff, 2.3);
rimLight.position.set(7, 2, -6);
scene.add(rimLight);

const warmFill = new THREE.PointLight(0xff9b55, 24, 24, 2);
warmFill.position.set(-5, -3, 6);
scene.add(warmFill);

const guitar = new THREE.Group();
guitar.rotation.x = -0.045;
guitar.rotation.y = -0.12;
guitar.position.y = -1.75;
scene.add(guitar);

function makeWoodTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 1024;
  canvas.height = 1024;
  const ctx = canvas.getContext('2d');

  const gradient = ctx.createLinearGradient(0, 0, 1024, 0);
  gradient.addColorStop(0, '#b87436');
  gradient.addColorStop(0.3, '#dda95b');
  gradient.addColorStop(0.52, '#edc477');
  gradient.addColorStop(0.72, '#d9a454');
  gradient.addColorStop(1, '#a96530');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 1024, 1024);

  ctx.globalCompositeOperation = 'multiply';
  for (let i = 0; i < 150; i++) {
    const baseX = (i / 149) * 1080 - 28;
    const alpha = 0.035 + (i % 7) * 0.008;
    ctx.strokeStyle = `rgba(91,45,17,${alpha})`;
    ctx.lineWidth = 0.7 + (i % 4) * 0.35;
    ctx.beginPath();
    for (let y = -20; y <= 1044; y += 16) {
      const x = baseX + Math.sin(y * 0.012 + i * 0.58) * (3 + (i % 6));
      if (y === -20) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  for (let i = 0; i < 22; i++) {
    const cx = 70 + ((i * 181) % 890);
    const cy = 60 + ((i * 307) % 900);
    ctx.strokeStyle = 'rgba(75,35,13,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 18 + (i % 5) * 6, 90 + (i % 4) * 20, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.globalCompositeOperation = 'source-over';
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

function makeRosewoodTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 1024;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createLinearGradient(0, 0, 512, 0);
  gradient.addColorStop(0, '#321611');
  gradient.addColorStop(0.22, '#6d2e1d');
  gradient.addColorStop(0.5, '#3a1714');
  gradient.addColorStop(0.73, '#793721');
  gradient.addColorStop(1, '#26100f');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 512, 1024);

  for (let i = 0; i < 70; i++) {
    const x = (i / 69) * 540 - 14;
    ctx.strokeStyle = `rgba(18,5,4,${0.08 + (i % 5) * 0.025})`;
    ctx.lineWidth = 1 + (i % 4);
    ctx.beginPath();
    for (let y = 0; y <= 1024; y += 20) {
      const px = x + Math.sin(y * 0.018 + i) * (4 + i % 8);
      if (y === 0) ctx.moveTo(px, y);
      else ctx.lineTo(px, y);
    }
    ctx.stroke();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const spruceTexture = makeWoodTexture();
const rosewoodTexture = makeRosewoodTexture();

const spruceMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xe0a65b,
  map: spruceTexture,
  roughness: 0.36,
  metalness: 0,
  clearcoat: 0.32,
  clearcoatRoughness: 0.5
});

const rosewoodMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x5c281c,
  map: rosewoodTexture,
  roughness: 0.38,
  clearcoat: 0.38,
  clearcoatRoughness: 0.42,
  flatShading: true
});

const darkWoodMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x2b1712,
  roughness: 0.32,
  clearcoat: 0.45,
  clearcoatRoughness: 0.38
});

const ebonyMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x171313,
  roughness: 0.28,
  clearcoat: 0.2,
  clearcoatRoughness: 0.45
});

const brassMaterial = new THREE.MeshStandardMaterial({
  color: 0xcaa665,
  metalness: 0.72,
  roughness: 0.28
});

const steelMaterial = new THREE.MeshStandardMaterial({
  color: 0xd9d1bd,
  metalness: 0.82,
  roughness: 0.24
});

const boneMaterial = new THREE.MeshStandardMaterial({
  color: 0xf0dfbd,
  roughness: 0.42
});

const blackMaterial = new THREE.MeshStandardMaterial({
  color: 0x060504,
  roughness: 0.88
});

function createBodyShape() {
  const shape = new THREE.Shape();
  shape.moveTo(0, -3.05);
  shape.bezierCurveTo(0.9, -3.02, 1.62, -2.56, 1.73, -1.84);
  shape.bezierCurveTo(1.88, -0.92, 1.58, -0.35, 1.08, 0.08);
  shape.bezierCurveTo(0.87, 0.35, 0.93, 0.72, 1.24, 1.14);
  shape.bezierCurveTo(1.56, 1.61, 1.35, 2.22, 0.73, 2.47);
  shape.bezierCurveTo(0.48, 2.57, 0.31, 2.57, 0, 2.57);
  shape.bezierCurveTo(-0.31, 2.57, -0.48, 2.57, -0.73, 2.47);
  shape.bezierCurveTo(-1.35, 2.22, -1.56, 1.61, -1.24, 1.14);
  shape.bezierCurveTo(-0.93, 0.72, -0.87, 0.35, -1.08, 0.08);
  shape.bezierCurveTo(-1.58, -0.35, -1.88, -0.92, -1.73, -1.84);
  shape.bezierCurveTo(-1.62, -2.56, -0.9, -3.02, 0, -3.05);
  return shape;
}

const bodyShape = createBodyShape();
const bodyGeometry = new THREE.ExtrudeGeometry(bodyShape, {
  depth: 0.62,
  steps: 1,
  bevelEnabled: true,
  bevelThickness: 0.12,
  bevelSize: 0.11,
  bevelOffset: 0,
  bevelSegments: 3,
  curveSegments: 24
});
bodyGeometry.translate(0, 0, -0.31);
bodyGeometry.computeVertexNormals();

const body = new THREE.Mesh(bodyGeometry, rosewoodMaterial);
body.castShadow = true;
body.receiveShadow = true;
guitar.add(body);

const topGeometry = new THREE.ShapeGeometry(bodyShape, 32);
const top = new THREE.Mesh(topGeometry, spruceMaterial);
top.position.z = 0.435;
top.scale.set(0.955, 0.965, 1);
top.castShadow = true;
top.receiveShadow = true;
guitar.add(top);

const back = new THREE.Mesh(topGeometry.clone(), rosewoodMaterial);
back.position.z = -0.435;
back.rotation.y = Math.PI;
back.scale.set(0.955, 0.965, 1);
back.castShadow = true;
guitar.add(back);

const bindingShape = createBodyShape();
const bindingGeometry = new THREE.ExtrudeGeometry(bindingShape, {
  depth: 0.035,
  steps: 1,
  bevelEnabled: false,
  curveSegments: 28
});
bindingGeometry.translate(0, 0, -0.0175);
const binding = new THREE.Mesh(bindingGeometry, boneMaterial);
binding.scale.set(1.004, 1.004, 1);
binding.position.z = 0.405;
guitar.add(binding);
top.position.z = 0.447;

const soundHole = new THREE.Mesh(
  new THREE.CircleGeometry(0.48, 64),
  blackMaterial
);
soundHole.position.set(0, 0.79, 0.47);
guitar.add(soundHole);

const innerHole = new THREE.Mesh(
  new THREE.CircleGeometry(0.39, 64),
  new THREE.MeshStandardMaterial({ color: 0x120905, roughness: 1 })
);
innerHole.position.set(0, 0.79, 0.486);
guitar.add(innerHole);

const rosetteColors = [0x2a1711, 0xd0aa67, 0x5b2619, 0xe0c58d, 0x321811];
const rosetteRadii = [0.505, 0.535, 0.568, 0.595, 0.622];
for (let i = 0; i < rosetteRadii.length; i++) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(rosetteRadii[i], i === 2 ? 0.022 : 0.012, 8, 64),
    new THREE.MeshStandardMaterial({
      color: rosetteColors[i],
      roughness: 0.42,
      metalness: 0.02
    })
  );
  ring.position.set(0, 0.79, 0.505 + i * 0.002);
  ring.castShadow = true;
  guitar.add(ring);
}

for (let i = 0; i < 28; i++) {
  const angle = (i / 28) * Math.PI * 2;
  const chip = new THREE.Mesh(
    new THREE.BoxGeometry(0.055, 0.018, 0.022),
    new THREE.MeshStandardMaterial({
      color: i % 2 === 0 ? 0xd6b36f : 0x4c2117,
      roughness: 0.52
    })
  );
  chip.position.set(
    Math.cos(angle) * 0.568,
    0.79 + Math.sin(angle) * 0.568,
    0.525
  );
  chip.rotation.z = angle;
  guitar.add(chip);
}

const pickguardShape = new THREE.Shape();
pickguardShape.moveTo(0.48, 0.62);
pickguardShape.bezierCurveTo(0.82, 0.48, 0.95, 0.05, 0.72, -0.24);
pickguardShape.bezierCurveTo(0.55, -0.42, 0.31, -0.28, 0.34, -0.03);
pickguardShape.bezierCurveTo(0.38, 0.2, 0.35, 0.42, 0.48, 0.62);
const pickguard = new THREE.Mesh(
  new THREE.ShapeGeometry(pickguardShape, 18),
  new THREE.MeshPhysicalMaterial({
    color: 0x401b16,
    roughness: 0.3,
    clearcoat: 0.45,
    transparent: true,
    opacity: 0.92
  })
);
pickguard.position.z = 0.485;
guitar.add(pickguard);

const bridge = new THREE.Mesh(
  new THREE.BoxGeometry(1.55, 0.3, 0.16, 8, 3, 2),
  ebonyMaterial
);
bridge.position.set(0, -0.78, 0.555);
bridge.castShadow = true;
guitar.add(bridge);

const bridgeWingGeometry = new THREE.CylinderGeometry(0.15, 0.15, 0.46, 12);
for (const side of [-1, 1]) {
  const wing = new THREE.Mesh(bridgeWingGeometry, ebonyMaterial);
  wing.rotation.z = Math.PI / 2;
  wing.scale.set(1, 1.15, 0.48);
  wing.position.set(side * 0.77, -0.78, 0.555);
  wing.castShadow = true;
  guitar.add(wing);
}

const saddle = new THREE.Mesh(
  new THREE.BoxGeometry(1.18, 0.052, 0.14),
  boneMaterial
);
saddle.position.set(0, -0.675, 0.67);
saddle.rotation.z = -0.025;
guitar.add(saddle);

for (let i = 0; i < 6; i++) {
  const pin = new THREE.Mesh(
    new THREE.CylinderGeometry(0.035, 0.026, 0.08, 12),
    boneMaterial
  );
  pin.rotation.x = Math.PI / 2;
  pin.position.set((i - 2.5) * 0.17, -0.86, 0.68);
  guitar.add(pin);
}

function createTaperedPrism(bottomWidth, topWidth, height, depth, material) {
  const halfBottom = bottomWidth * 0.5;
  const halfTop = topWidth * 0.5;
  const halfDepth = depth * 0.5;
  const positions = new Float32Array([
    -halfBottom, 0, halfDepth, halfBottom, 0, halfDepth, halfTop, height, halfDepth,
    -halfBottom, 0, halfDepth, halfTop, height, halfDepth, -halfTop, height, halfDepth,
    halfBottom, 0, -halfDepth, -halfBottom, 0, -halfDepth, -halfTop, height, -halfDepth,
    halfBottom, 0, -halfDepth, -halfTop, height, -halfDepth, halfTop, height, -halfDepth,
    -halfBottom, 0, -halfDepth, -halfBottom, 0, halfDepth, -halfTop, height, halfDepth,
    -halfBottom, 0, -halfDepth, -halfTop, height, halfDepth, -halfTop, height, -halfDepth,
    halfBottom, 0, halfDepth, halfBottom, 0, -halfDepth, halfTop, height, -halfDepth,
    halfBottom, 0, halfDepth, halfTop, height, -halfDepth, halfTop, height, halfDepth,
    -halfTop, height, halfDepth, halfTop, height, halfDepth, halfTop, height, -halfDepth,
    -halfTop, height, halfDepth, halfTop, height, -halfDepth, -halfTop, height, -halfDepth,
    -halfBottom, 0, -halfDepth, halfBottom, 0, -halfDepth, halfBottom, 0, halfDepth,
    -halfBottom, 0, -halfDepth, halfBottom, 0, halfDepth, -halfBottom, 0, halfDepth
  ]);
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const neck = createTaperedPrism(0.86, 0.62, 4.45, 0.34, rosewoodMaterial);
neck.position.set(0, 1.35, 0.31);
guitar.add(neck);

const heel = new THREE.Mesh(
  new THREE.CylinderGeometry(0.38, 0.57, 0.94, 10),
  rosewoodMaterial
);
heel.rotation.x = Math.PI / 2;
heel.scale.set(1, 1, 0.68);
heel.position.set(0, 2.05, 0.04);
heel.castShadow = true;
guitar.add(heel);

const fretboard = createTaperedPrism(0.83, 0.58, 4.55, 0.13, ebonyMaterial);
fretboard.position.set(0, 1.28, 0.59);
guitar.add(fretboard);

const fretCount = 20;
for (let i = 0; i < fretCount; i++) {
  const fraction = 1 - Math.pow(2, -i / 12);
  const y = 1.42 + fraction * 4.18;
  const progress = (y - 1.28) / 4.55;
  const width = THREE.MathUtils.lerp(0.83, 0.58, progress);
  const fret = new THREE.Mesh(
    new THREE.BoxGeometry(width + 0.025, 0.026, 0.035),
    steelMaterial
  );
  fret.position.set(0, y, 0.675);
  fret.castShadow = true;
  guitar.add(fret);
}

const markerFrets = [3, 5, 7, 9, 12, 15, 17];
for (const markerFret of markerFrets) {
  const fraction = 1 - Math.pow(2, -(markerFret - 0.5) / 12);
  const y = 1.42 + fraction * 4.18;
  if (markerFret === 12) {
    for (const dx of [-0.12, 0.12]) {
      const marker = new THREE.Mesh(
        new THREE.CircleGeometry(0.045, 20),
        boneMaterial
      );
      marker.position.set(dx, y, 0.696);
      guitar.add(marker);
    }
  } else {
    const marker = new THREE.Mesh(
      new THREE.CircleGeometry(0.045, 20),
      boneMaterial
    );
    marker.position.set(0, y, 0.696);
    guitar.add(marker);
  }
}

const nut = new THREE.Mesh(
  new THREE.BoxGeometry(0.64, 0.075, 0.15),
  boneMaterial
);
nut.position.set(0, 5.78, 0.68);
guitar.add(nut);

const headShape = new THREE.Shape();
headShape.moveTo(-0.31, 5.77);
headShape.bezierCurveTo(-0.39, 6.12, -0.52, 6.5, -0.47, 6.86);
headShape.bezierCurveTo(-0.43, 7.14, -0.63, 7.3, -0.51, 7.51);
headShape.bezierCurveTo(-0.36, 7.76, -0.12, 7.58, 0, 7.82);
headShape.bezierCurveTo(0.12, 7.58, 0.36, 7.76, 0.51, 7.51);
headShape.bezierCurveTo(0.63, 7.3, 0.43, 7.14, 0.47, 6.86);
headShape.bezierCurveTo(0.52, 6.5, 0.39, 6.12, 0.31, 5.77);
headShape.lineTo(-0.31, 5.77);

const headGeometry = new THREE.ExtrudeGeometry(headShape, {
  depth: 0.25,
  bevelEnabled: true,
  bevelThickness: 0.055,
  bevelSize: 0.045,
  bevelSegments: 2,
  curveSegments: 16
});
headGeometry.translate(0, 0, 0.47);
const headstock = new THREE.Mesh(headGeometry, rosewoodMaterial);
headstock.castShadow = true;
guitar.add(headstock);

const headVeneer = new THREE.Mesh(
  new THREE.ShapeGeometry(headShape, 20),
  darkWoodMaterial
);
headVeneer.position.z = 0.79;
headVeneer.scale.set(0.92, 0.99, 1);
guitar.add(headVeneer);

const crestOuter = new THREE.Mesh(
  new THREE.TorusGeometry(0.18, 0.025, 7, 28, Math.PI * 1.35),
  brassMaterial
);
crestOuter.position.set(0, 7.37, 0.82);
crestOuter.rotation.z = -Math.PI * 0.175;
guitar.add(crestOuter);

const crestInner = new THREE.Mesh(
  new THREE.TorusGeometry(0.09, 0.018, 7, 24, Math.PI * 1.5),
  boneMaterial
);
crestInner.position.set(0, 7.37, 0.83);
crestInner.rotation.z = Math.PI * 0.25;
guitar.add(crestInner);

function addCylinderBetween(parent, start, end, radius, material, segments = 8) {
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(radius, radius, length, segments);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.clone().normalize()
  );
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

const tunerY = [6.22, 6.68, 7.14];
const tunerPosts = [];
for (let sideIndex = 0; sideIndex < 2; sideIndex++) {
  const side = sideIndex === 0 ? -1 : 1;
  for (let row = 0; row < 3; row++) {
    const postX = side * (0.39 + row * 0.025);
    const postY = tunerY[row];
    const post = new THREE.Mesh(
      new THREE.CylinderGeometry(0.055, 0.055, 0.42, 12),
      brassMaterial
    );
    post.rotation.z = Math.PI / 2;
    post.position.set(postX, postY, 0.72);
    post.castShadow = true;
    guitar.add(post);

    const button = new THREE.Mesh(
      new THREE.BoxGeometry(0.16, 0.22, 0.09),
      boneMaterial
    );
    button.position.set(side * 0.66, postY, 0.72);
    button.rotation.z = side * 0.08;
    button.castShadow = true;
    guitar.add(button);

    const cap = new THREE.Mesh(
      new THREE.CylinderGeometry(0.074, 0.074, 0.055, 16),
      brassMaterial
    );
    cap.rotation.x = Math.PI / 2;
    cap.position.set(postX, postY, 0.835);
    guitar.add(cap);
    tunerPosts.push(new THREE.Vector3(postX, postY, 0.84));
  }
}

const stringMaterials = [];
for (let i = 0; i < 6; i++) {
  stringMaterials.push(new THREE.MeshStandardMaterial({
    color: i < 3 ? 0xc7a268 : 0xe2ddd1,
    metalness: 0.88,
    roughness: 0.2
  }));
}

for (let i = 0; i < 6; i++) {
  const bridgeX = (i - 2.5) * 0.17;
  const nutX = (i - 2.5) * 0.105;
  const radius = 0.008 + i * 0.0018;
  addCylinderBetween(
    guitar,
    new THREE.Vector3(bridgeX, -0.69, 0.76),
    new THREE.Vector3(nutX, 5.82, 0.79),
    radius,
    stringMaterials[i],
    7
  );

  const targetIndex = i < 3 ? i : i;
  const targetPost = tunerPosts[targetIndex];
  addCylinderBetween(
    guitar,
    new THREE.Vector3(nutX, 5.82, 0.79),
    targetPost,
    radius,
    stringMaterials[i],
    7
  );
}

for (let i = 0; i < 9; i++) {
  const grooveY = -2.62 + i * 0.57;
  const width = 1.1 + Math.sin((grooveY + 3) * 1.2) * 0.45;
  const groove = new THREE.Mesh(
    new THREE.TorusGeometry(width, 0.007, 5, 48, Math.PI),
    new THREE.MeshStandardMaterial({
      color: 0x7b421f,
      roughness: 0.8,
      transparent: true,
      opacity: 0.45
    })
  );
  groove.scale.y = 0.08;
  groove.rotation.z = i % 2 === 0 ? 0.03 : -0.035;
  groove.position.set(0, grooveY, 0.492);
  guitar.add(groove);
}

const shadowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.34 })
);
shadowPlane.position.set(0, -5.05, 0);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);

const pedestal = new THREE.Mesh(
  new THREE.CylinderGeometry(3.8, 4.4, 0.35, 64),
  new THREE.MeshStandardMaterial({
    color: 0x221c16,
    roughness: 0.82,
    metalness: 0.02
  })
);
pedestal.position.y = -5.25;
pedestal.receiveShadow = true;
scene.add(pedestal);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
