<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Underground Subway Platform</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#090b0d}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const seed=739184;
let state=seed;
function rnd(){
  state=(state*1664525+1013904223)>>>0;
  return state/4294967296;
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function mat(color,rough=.8,metal=0,emissive=0){
  return new THREE.MeshStandardMaterial({
    color,roughness:rough,metalness:metal,
    emissive:emissive?color:0,
    emissiveIntensity:emissive
  });
}
function box(w,h,d,m,x=0,y=0,z=0){
  const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true; return o;
}
function cyl(r,h,m,x=0,y=0,z=0,rot=null){
  const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,20),m);
  o.position.set(x,y,z);
  if(rot)o.rotation.set(rot.x,rot.y,rot.z);
  o.castShadow=true;o.receiveShadow=true;return o;
}
function canvasTexture(draw,w=512,h=256){
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const x=c.getContext("2d");draw(x,w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function tiledTexture(base,grout){
  return canvasTexture((x,w,h)=>{
    x.fillStyle=base;x.fillRect(0,0,w,h);
    x.strokeStyle=grout;x.lineWidth=5;
    for(let i=0;i<=w;i+=64){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke()}
    for(let j=0;j<=h;j+=64){x.beginPath();x.moveTo(0,j);x.lineTo(w,j);x.stroke()}
    for(let i=0;i<700;i++){
      x.fillStyle=`rgba(20,20,20,${rnd()*.07})`;
      x.fillRect(rnd()*w,rnd()*h,1+rnd()*7,1+rnd()*3);
    }
  });
}
function labelTexture(title,sub,color="#f2d74c"){
  return canvasTexture((x,w,h)=>{
    x.fillStyle="#111719";x.fillRect(0,0,w,h);
    x.fillStyle=color;x.fillRect(0,0,w,16);
    x.font="bold 42px Arial";x.fillStyle="#e9eeee";x.fillText(title,30,93);
    x.font="20px Arial";x.fillStyle="#98a5a5";x.fillText(sub,31,138);
    x.strokeStyle="#4f5c5d";x.strokeRect(15,15,w-30,h-30);
  },512,220);
}
function glowMat(color,intensity=4){
  return new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:intensity,roughness:.35});
}

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x090c0e);
scene.fog=new THREE.FogExp2(0x111719,.018);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,300);
camera.position.set(18,10,25);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.055;
controls.autoRotate=true;controls.autoRotateSpeed=.32;
controls.target.set(0,4,-4);
controls.minDistance=10;controls.maxDistance=48;
controls.maxPolarAngle=Math.PI*.47;

const concrete=mat(0x4b5050,.96);
const darkConcrete=mat(0x292e2f,1);
const floorMat=mat(0x383d3c,.9);
const tileTex=tiledTexture("#a6aaa4","#545b58");
const tileMat=new THREE.MeshStandardMaterial({map:tileTex,roughness:.92});
const ivory=mat(0xc4c6bc,.84);
const black=mat(0x111516,.72,.15);
const steel=mat(0x727a78,.35,.72);
const yellow=mat(0xd1a91f,.62);
const red=mat(0xb32927,.66);
const paperMat=mat(0xd1d0ba,.98);
const green=mat(0x28705c,.6);
const glass=new THREE.MeshPhysicalMaterial({color:0x132c32,roughness:.12,metalness:.25,transmission:.18,transparent:true,opacity:.8});
const amber=glowMat(0xffbd35,5);
const fluorescent=glowMat(0xdfffe8,7);
const redGlow=glowMat(0xff2820,4);

const world=new THREE.Group();scene.add(world);

world.add(box(72,.4,55,darkConcrete,0,-.2,-7));
world.add(box(72,.4,4,concrete,0,7.3,-7));
world.add(box(1,14,55,concrete,-27,3.5,-7));
world.add(box(1,14,55,concrete,27,3.5,-7));

const platform=box(38,.55,15,floorMat,0,.1,3);
world.add(platform);
const trackBed=box(38,.32,12,darkConcrete,0,-.04,-10);
world.add(trackBed);
for(let z=-4;z>-17;z-=1.25){
  world.add(box(37,.16,.22,mat(0x656964,.8),0,.15,z));
}
const railMat=mat(0x1c2424,.45,.7);
for(const x of [-15,-10,-5,0,5,10,15]){
  world.add(cyl(.07,.55,railMat,x,.42,-5.3));
  world.add(cyl(.07,.55,railMat,x,.42,-14.7));
}
world.add(box(38,.12,.15,steel,0,.66,-5.3));
world.add(box(38,.12,.15,steel,0,.66,-14.7));

const stripMat=new THREE.MeshStandardMaterial({color:0xd7ae20,roughness:.72});
world.add(box(38,.035,.62,stripMat,0,.4,-4.35));
for(let x=-18;x<18;x+=1.2)world.add(box(.55,.04,.66,mat(0x252525,.85),x,.425,-4.35));

function archSegment(x,z){
  const g=new THREE.Group();
  const r=15, depth=1.5;
  const geo=new THREE.CylinderGeometry(r,r,depth,32,1,false,Math.PI,Math.PI);
  const m=new THREE.Mesh(geo,concrete);m.rotation.z=Math.PI/2;m.position.set(x,9,z);
  m.scale.set(1,.42,1);m.castShadow=true;m.receiveShadow=true;g.add(m);
  return g;
}
for(let z=18;z>-34;z-=4)world.add(archSegment(0,z));
world.add(box(54,.5,55,concrete,0,9,-7));

function pillar(x,z){
  const p=new THREE.Group();
  p.add(box(1.25,7.7,1.25,tileMat,x,3.85,z));
  p.add(box(1.5,.22,1.5,concrete,x,7.85,z));
  p.add(box(1.5,.24,1.5,darkConcrete,x,-.05,z));
  return p;
}
for(const z of [15,8,1,-6,-13,-20]){world.add(pillar(-20,z));world.add(pillar(20,z))}

const train=new THREE.Group();train.position.set(0,.65,-9.15);world.add(train);
train.add(box(38,4.9,3.8,mat(0x424b4e,.5,.5),0,3.1,0));
train.add(box(38,1.05,3.9,mat(0x182022,.62,.5),0,.65,0));
train.add(box(37.6,.32,3.5,red,0,5.52,0));
train.add(box(38,.28,3.7,black,0,1.05,0));
for(const side of [-1,1]){
  const sy=side*1.93;
  train.add(box(37.5,3.4,.08,glass,0,3.35,sy));
  for(let x=-17.5;x<=17.5;x+=4.1){
    train.add(box(.12,3.55,.14,steel,x,3.35,sy*1.02));
  }
  for(let x=-15;x<=15;x+=6.8){
    train.add(box(1.55,3.2,.12,black,x,3.35,sy*1.03));
    train.add(box(1.35,2.7,.05,glowMat(0xe8dca8,1.25),x,3.4,sy*1.04));
  }
}
for(const x of [-14,-8,-2,2,8,14]){
  train.add(box(.12,3.8,.18,steel,x,3.3,0));
  train.add(box(2.45,3.55,.08,mat(0x566064,.38,.65),x,3.3,1.91));
}
for(const x of [-17,17])train.add(box(.26,4.2,.22,redGlow,x,3.2,1.98));

const trainSignTex=labelTexture("M7  •  NORTHBOUND","NEXT STOP  UNION SQUARE","#e64c36");
const trainSign=new THREE.Mesh(new THREE.PlaneGeometry(5.2,1.8),new THREE.MeshBasicMaterial({map:trainSignTex}));
trainSign.position.set(0,4.6,2.02);trainSign.rotation.y=Math.PI;train.add(trainSign);

function bench(x,z,rot=0){
  const b=new THREE.Group();b.position.set(x,.65,z);b.rotation.y=rot;
  b.add(box(3.2,.18,.48,mat(0x72513a,.78),0,1.35,0));
  b.add(box(3.2,.18,.42,mat(0x76563e,.78),0,2.15,0));
  b.add(box(.16,1.45,.28,steel,-1.2,.65,0));
  b.add(box(.16,1.45,.28,steel,1.2,.65,0));
  b.add(box(3.45,.12,.65,black,0,.02,0));return b;
}
world.add(bench(-9,2));world.add(bench(10,1,Math.PI));

function mapBox(x,z){
  const g=new THREE.Group();g.position.set(x,4.1,z);
  g.add(box(4.7,3.3,.4,black,0,0,0));
  const tex=canvasTexture((c,w,h)=>{
    c.fillStyle="#d8d0af";c.fillRect(0,0,w,h);
    c.strokeStyle="#be3b37";c.lineWidth=9;c.beginPath();c.moveTo(35,80);c.lineTo(450,80);c.lineTo(100,180);c.stroke();
    c.strokeStyle="#3f8490";c.lineWidth=8;c.beginPath();c.moveTo(20,210);c.lineTo(330,45);c.stroke();
    c.fillStyle="#1d2525";c.font="bold 22px Arial";c.fillText("CITY TRANSIT",26,30);
    for(let i=0;i<11;i++){c.fillStyle="#1d2525";c.beginPath();c.arc(45+i*39,80+(i%3)*25,6,0,7);c.fill()}
  },512,256);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(4.1,2.25),new THREE.MeshStandardMaterial({map:tex,emissive:0x332f22,emissiveIntensity:.45}));
  m.position.set(0,0,.23);g.add(m);g.add(box(4.35,.12,.1,fluorescent,0,1.42,.24));
  return g;
}
world.add(mapBox(-15,2.2));

function vending(x,z){
  const g=new THREE.Group();g.position.set(x,2,z);
  g.add(box(2.1,4,.85,mat(0x253638,.38,.3)));
  g.add(box(1.72,2.1,.06,glass,0,.72,.47));
  for(let i=0;i<3;i++){
    g.add(cyl(.17,.1,[red,green,amber][i],-.55+i*.52,.95,.53,{x:Math.PI/2,y:0,z:0}));
    g.add(box(.25,.8,.05,[red,green,amber][i],-.55+i*.52,.15,.53));
  }
  g.add(box(1.6,.1,.08,fluorescent,0,1.87,.5));
  return g;
}
world.add(vending(15,4));world.add(vending(17,4));

function stairs(){
  const g=new THREE.Group();g.position.set(22,.3,6);
  for(let i=0;i<8;i++)g.add(box(5,.3+i*.01,.65,mat(0x777a73,.9),0,i*.3,i*.66));
  g.add(box(5,3,.3,darkConcrete,0,1.2,5.1));
  const hand=new THREE.Group();
  hand.add(cyl(.09,7,steel,2.1,2.4,2.4,{x:0,z:Math.PI/2}));
  hand.add(cyl(.09,2.4,steel,2.1,1.2,.8));
  hand.add(cyl(.09,2.4,steel,2.1,1.2,3.8));
  g.add(hand);return g;
}
world.add(stairs());

function hangingSign(x,z,title,sub){
  const g=new THREE.Group();g.position.set(x,6.2,z);
  g.add(cyl(.035,1.3,steel,0,.65,0));
  g.add(box(3.9,1.3,.16,black,0,0,0));
  const t=labelTexture(title,sub,"#e5bd24");
  const p=new THREE.Mesh(new THREE.PlaneGeometry(3.5,.95),new THREE.MeshBasicMaterial({map:t}));
  p.position.z=.1;g.add(p);return g;
}
world.add(hangingSign(-4,4,"PLATFORM 2","DOWNTOWN • 8 MIN"));
world.add(hangingSign(9,-1,"EXIT  •  14","BROOKLYN / WEST"));

function lightTube(x,z,phase=0){
  const g=new THREE.Group();g.position.set(x,7.75,z);
  g.add(cyl(.11,4.7,fluorescent,0,0,0,{x:0,z:Math.PI/2}));
  const l=new THREE.PointLight(0xd9ffe8,3.2,8,2);l.position.set(0,-.2,0);l.castShadow=true;g.add(l);
  g.userData={light:l,phase};return g;
}
const tubes=[lightTube(-14,6,0),lightTube(0,6,1.8),lightTube(14,6,3.1)];
tubes.forEach(t=>world.add(t));

const papers=[];
for(let i=0;i<13;i++){
  const p=new THREE.Mesh(new THREE.PlaneGeometry(.55+.4*rnd(),.35+.25*rnd()),paperMat);
  p.rotation.set(-Math.PI/2,rnd()*Math.PI,rnd()*.3);
  p.position.set(-17+rnd()*34,.47,1+rnd()*3.1);
  p.userData={base:p.position.clone(),phase:rnd()*7,speed:.35+rnd()*.5};
  world.add(p);papers.push(p);
}

const trash=new THREE.Group();trash.position.set(5,.65,2);
trash.add(cyl(.48,1.2,mat(0x315250,.72),0,.6,0));
trash.add(box(.58,.08,1.1,black,0,1.18,0));
for(let i=0;i<3;i++)trash.add(box(.12,.55,.12,steel,-.33+i*.33,.3,0));
world.add(trash);

const posters=[];
for(let i=0;i<5;i++){
  const g=new THREE.Group();g.position.set(-19.35,3.2,-18+i*6);
  g.add(box(2.8,3.8,.1,black,0,0,0));
  const tx=canvasTexture((c,w,h)=>{
    c.fillStyle=["#872d2a","#2d5363","#b07a2c"][i%3];c.fillRect(0,0,w,h);
    c.fillStyle="#e7dfc4";c.font="bold 34px Arial";c.fillText(i%2?"CITY NIGHTS":"RIDE SMART",32,75);
    c.font="20px Arial";c.fillText("EVERY JOURNEY",34,115);c.fillText("HAS A STORY",34,145);
    c.fillStyle="rgba(0,0,0,.25)";c.fillRect(20,180,470,42);
  },512,256);
  const p=new THREE.Mesh(new THREE.PlaneGeometry(2.45,2.2),new THREE.MeshBasicMaterial({map:tx}));
  p.position.set(0,.1,.08);p.rotation.y=Math.PI/2;g.add(p);world.add(g);posters.push(g);
}

const dust=[];
for(let i=0;i<80;i++){
  const d=new THREE.Mesh(new THREE.SphereGeometry(.018+rnd()*.025,5,4),new THREE.MeshBasicMaterial({color:0xaaa990,transparent:true,opacity:.14}));
  d.position.set(-24+rnd()*48,1+rnd()*8,-27+rnd()*38);world.add(d);dust.push(d);
}

const hemi=new THREE.HemisphereLight(0x718187,0x111313,1.1);scene.add(hemi);
const key=new THREE.DirectionalLight(0xd8d0b6,2.1);
key.position.set(-10,15,12);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-30;key.shadow.camera.right=30;key.shadow.camera.top=20;key.shadow.camera.bottom=-25;
scene.add(key);
const tunnelLight=new THREE.PointLight(0xffa34b,18,28,2);
tunnelLight.position.set(4,5,-15);scene.add(tunnelLight);

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  tubes.forEach((g,i)=>{
    const wave=Math.sin(t*13+g.userData.phase)+Math.sin(t*29+i);
    const on=wave>.05;
    g.userData.light.intensity=on?(2.5+Math.sin(t*4+i)*.35):.25;
    g.children[0].material.emissiveIntensity=on?7:.8;
  });
  papers.forEach((p,i)=>{
    const u=p.userData;
    p.position.x=u.base.x+Math.sin(t*u.speed+u.phase)*(.18+.06*i%3);
    p.position.z=u.base.z+Math.cos(t*u.speed*.8+u.phase)*.22;
    p.rotation.z+=.008*u.speed;
  });
  dust.forEach((d,i)=>{
    d.position.y+=Math.sin(t*.7+i)*.0009;
    d.position.x+=Math.sin(t*.23+i)*.00025;
  });
  train.position.y=.65+Math.sin(t*1.2)*.018;
  tunnelLight.intensity=17+Math.sin(t*.8)*2;
  controls.update();
  renderer.render(scene,camera);
}
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
});
animate();
</script>
</body>
</html>
