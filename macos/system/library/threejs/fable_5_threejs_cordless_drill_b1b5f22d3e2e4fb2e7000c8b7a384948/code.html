<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cordless Drill</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#171a1f}canvas{display:block}</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171a1f);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.4, 2.6, 4.4);

const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(4, 7, 3);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 1; key.shadow.camera.far = 16;
key.shadow.camera.left = key.shadow.camera.bottom = -3.5;
key.shadow.camera.right = key.shadow.camera.top = 3.5;
key.shadow.radius = 6; key.shadow.blurSamples = 16; key.shadow.bias = -0.0005;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x35302a, 0.45));
const rim = new THREE.DirectionalLight(0x9db9ff, 0.9);
rim.position.set(-4, 3, -4);
scene.add(rim);

// procedural noise texture (rubber stipple / knurling)
function noiseTex(rx, ry) {
  const s = 128, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d'), img = g.createImageData(s, s);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 90 + Math.random() * 70;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  return t;
}

const teal    = new THREE.MeshStandardMaterial({ color: 0x0f7d72, roughness: 0.42, metalness: 0.05 });
const rubber  = new THREE.MeshStandardMaterial({ color: 0x26262a, roughness: 0.95, metalness: 0.0, bumpMap: noiseTex(3, 3), bumpScale: 0.15 });
const charcoal= new THREE.MeshStandardMaterial({ color: 0x2c2d31, roughness: 0.7, metalness: 0.1 });
const metal   = new THREE.MeshStandardMaterial({ color: 0xb4bac1, roughness: 0.3, metalness: 0.95, bumpMap: noiseTex(10, 2), bumpScale: 0.05 });
const dkmetal = new THREE.MeshStandardMaterial({ color: 0x53575e, roughness: 0.45, metalness: 0.85 });
const black   = new THREE.MeshStandardMaterial({ color: 0x121214, roughness: 0.55, metalness: 0.1 });

const drill = new THREE.Group();
scene.add(drill);

const cylZ = (rt, rb, h, seg = 48) => new THREE.CylinderGeometry(rt, rb, h, seg).rotateX(Math.PI / 2);
const cylX = (rt, rb, h, seg = 24) => new THREE.CylinderGeometry(rt, rb, h, seg).rotateZ(Math.PI / 2);
function add(parent, geo, mat, p = [0, 0, 0], r = [0, 0, 0], s = [1, 1, 1]) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...p); m.rotation.set(...r); m.scale.set(...s);
  parent.add(m); return m;
}

// ---- main body (motor housing, drill axis = +Z toward chuck) ----
add(drill, cylZ(0.42, 0.42, 1.6), teal, [0, 0, -0.1]);
add(drill, cylZ(0.36, 0.36, 0.45), charcoal, [0, 0, -1.05]);            // rear cap
add(drill, new THREE.SphereGeometry(0.36, 32, 16), charcoal, [0, 0, -1.27], [0, 0, 0], [1, 1, 0.55]); // rear dome
add(drill, new THREE.BoxGeometry(0.012, 0.02, 1.5), black, [0, 0.412, -0.1]); // mold seam
// vents
for (let i = 0; i < 3; i++) for (const sx of [1, -1])
  add(drill, new THREE.BoxGeometry(0.05, 0.24, 0.06), black, [sx * 0.4, 0, -0.5 - i * 0.14]);

// ---- clutch / torque collar with ribs ----
add(drill, cylZ(0.4, 0.4, 0.26), charcoal, [0, 0, 0.83]);
for (let i = 0; i < 16; i++) {
  const a = i / 16 * Math.PI * 2;
  add(drill, new THREE.BoxGeometry(0.03, 0.022, 0.25), charcoal,
    [Math.cos(a) * 0.405, Math.sin(a) * 0.405, 0.83], [0, 0, a]);
}
add(drill, cylZ(0.3, 0.38, 0.2), dkmetal, [0, 0, 1.06]); // gearbox taper

// ---- keyless chuck ----
add(drill, cylZ(0.32, 0.32, 0.42), metal, [0, 0, 1.37]);                // knurled sleeve
for (let i = 0; i < 20; i++) {                                          // flutes
  const a = i / 20 * Math.PI * 2;
  add(drill, new THREE.BoxGeometry(0.025, 0.018, 0.4), dkmetal,
    [Math.cos(a) * 0.322, Math.sin(a) * 0.322, 1.37], [0, 0, a]);
}
add(drill, cylZ(0.325, 0.325, 0.02), dkmetal, [0, 0, 1.2]);             // groove rings
add(drill, cylZ(0.325, 0.325, 0.02), dkmetal, [0, 0, 1.54]);
add(drill, cylZ(0.14, 0.32, 0.18), metal, [0, 0, 1.67]);                // nose cone
add(drill, cylZ(0.05, 0.05, 0.18), black, [0, 0, 1.68]);                // throat
for (let i = 0; i < 3; i++) {                                           // three jaws
  const p = new THREE.Group();
  p.rotation.z = i * Math.PI * 2 / 3; p.position.z = 1.74;
  const j = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.05, 0.26), metal);
  j.position.y = 0.08; j.rotation.x = 0.32;
  p.add(j); drill.add(p);
}

// ---- pistol grip (rubber overmold) + trigger ----
const handle = new THREE.Group();
handle.position.set(0, -0.3, -0.25); handle.rotation.x = 0.18;
drill.add(handle);
add(handle, new THREE.CapsuleGeometry(0.26, 0.75, 8, 24), rubber, [0, -0.62, 0], [0, 0, 0], [0.85, 1, 1.25]);
add(handle, new THREE.CapsuleGeometry(0.08, 0.16, 6, 16), black, [0, -0.3, 0.36], [-0.12, 0, 0], [1, 1, 0.7]); // trigger
add(handle, cylX(0.045, 0.045, 0.6), charcoal, [0, -0.06, 0.16]);       // fwd/rev selector

// ---- slide-in battery pack ----
add(drill, new THREE.BoxGeometry(0.55, 0.16, 0.95), charcoal, [0, -1.36, -0.44]); // mount collar
add(drill, new THREE.BoxGeometry(0.68, 0.55, 1.2), charcoal, [0, -1.62, -0.42]);  // pack body
add(drill, new THREE.BoxGeometry(0.72, 0.08, 1.26), black, [0, -1.905, -0.42]);   // base plate
for (const sx of [1, -1]) {
  add(drill, new THREE.BoxGeometry(0.08, 0.06, 0.9), black, [sx * 0.18, -1.32, -0.42]);      // slide rails
  add(drill, new THREE.BoxGeometry(0.07, 0.12, 0.2), teal, [sx * 0.345, -1.44, -0.02]);      // release buttons
}
add(drill, new THREE.BoxGeometry(0.5, 0.1, 0.03), teal, [0, -1.55, 0.185]); // accent stripe

// ---- screws on body halves ----
function screw(x, y, z, sgn) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(cylX(0.048, 0.048, 0.035), dkmetal));
  const s1 = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.066, 0.02), black);
  const s2 = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.02, 0.066), black);
  s1.position.x = s2.position.x = sgn * 0.019;
  g.add(s1, s2); g.position.set(x, y, z); drill.add(g);
}
[[0.378, 0.16, -0.7], [0.378, -0.16, -0.7], [0.378, 0.16, 0.35], [0.378, -0.13, 0.42],
 [0.352, 0, -1.12], [0.205, -0.89, -0.36], [0.332, -1.62, -0.85]]
  .forEach(([x, y, z]) => { screw(x, y, z, 1); screw(-x, y, z, -1); });

drill.position.y = 1.95;
drill.rotation.y = 0.5;
drill.traverse(o => { if (o.isMesh) o.castShadow = o.receiveShadow = true; });

// ---- ground (soft shadow catcher) ----
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(8, 48).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.32 })
);
ground.receiveShadow = true;
scene.add(ground);

// ---- controls / loop ----
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.55, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.8;
controls.minDistance = 2.5; controls.maxDistance = 12;
controls.maxPolarAngle = 1.48;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
