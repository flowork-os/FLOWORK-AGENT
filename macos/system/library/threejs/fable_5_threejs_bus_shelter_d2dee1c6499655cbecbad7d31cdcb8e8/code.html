<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bus Shelter — procedural three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141518; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 16px; bottom: 14px;
    font: 12px/1.4 system-ui, -apple-system, sans-serif;
    color: #8f98a3; letter-spacing: .04em; user-select: none; pointer-events: none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hint">bus shelter &middot; drag to orbit &middot; scroll to zoom</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- renderer / scene / camera ---------- */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16181c);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.6, 2.9, 6.2);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.minDistance = 3;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.495;
controls.update();

/* ---------- lighting: key + fill + rim + soft hemi ---------- */

const hemi = new THREE.HemisphereLight(0x9fb4c9, 0x2b2724, 0.35);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff0dd, 2.1);
key.position.set(6.5, 8.5, 4.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6; key.shadow.camera.right = 6;
key.shadow.camera.top = 6;  key.shadow.camera.bottom = -6;
key.shadow.camera.near = 2;  key.shadow.camera.far = 30;
key.shadow.bias = -0.0002;
key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9db6ff, 0.55);
fill.position.set(-6, 3.5, 4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xdfe9ff, 0.9);
rim.position.set(-3.5, 6, -7);
scene.add(rim);

/* ---------- shadow-catcher ground ---------- */

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 64),
  new THREE.ShadowMaterial({ opacity: 0.38 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- materials ---------- */

const M = {
  frame:  new THREE.MeshStandardMaterial({ color: 0x33383d, metalness: 0.85, roughness: 0.38 }), // anthracite steel
  gutter: new THREE.MeshStandardMaterial({ color: 0x272b2f, metalness: 0.85, roughness: 0.45 }),
  roof:   new THREE.MeshStandardMaterial({ color: 0x585f66, metalness: 0.7,  roughness: 0.5  }),
  adBox:  new THREE.MeshStandardMaterial({ color: 0x212529, metalness: 0.8,  roughness: 0.4  }),
  bezel:  new THREE.MeshStandardMaterial({ color: 0xe6e8ea, metalness: 0.1,  roughness: 0.5  }),
  wood:   new THREE.MeshStandardMaterial({ color: 0x96633a, metalness: 0.0,  roughness: 0.62 }),
  glass:  new THREE.MeshPhysicalMaterial({
    color: 0xeaf6f2, metalness: 0, roughness: 0.06,
    transmission: 0.93, thickness: 0.02, ior: 1.5, transparent: true
  })
};
for (const m of Object.values(M)) m.envMapIntensity = 0.6;
M.glass.envMapIntensity = 0.9;

/* ---------- the shelter (one centered object) ----------
   Real street-furniture scale (metres):
   footprint ~4.2 x 1.5, roof 4.5 x 1.8, roof underside 2.28 m,
   glass to 2.24 m, bench seat 0.46 m, ad lightbox 1.2 x 1.9. */

const shelter = new THREE.Group();
scene.add(shelter);

function addBox(mat, w, h, d, x, y, z, cast = true) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = cast;
  mesh.receiveShadow = true;
  shelter.add(mesh);
  return mesh;
}

/* --- slim posts (4 corners, 90 mm dia) --- */
const postGeo = new THREE.CylinderGeometry(0.045, 0.045, 2.35, 20);
for (const px of [-1.95, 1.95]) {
  for (const pz of [-0.65, 0.65]) {
    const post = new THREE.Mesh(postGeo, M.frame);
    post.position.set(px, 1.175, pz);
    post.castShadow = true;
    post.receiveShadow = true;
    shelter.add(post);
  }
}

/* --- slightly curved roof canopy (extruded arc slab) --- */
const roofShape = new THREE.Shape();
roofShape.moveTo(-0.9, 0);
roofShape.quadraticCurveTo(0, 0.20, 0.9, 0);
roofShape.lineTo(0.9, 0.06);
roofShape.quadraticCurveTo(0, 0.26, -0.9, 0.06);
roofShape.closePath();
const roofGeo = new THREE.ExtrudeGeometry(roofShape, { depth: 4.5, bevelEnabled: false, curveSegments: 32 });
roofGeo.translate(0, 0, -2.25);
roofGeo.rotateY(Math.PI / 2);
const roof = new THREE.Mesh(roofGeo, M.roof);
roof.position.y = 2.28;
roof.castShadow = true;
roof.receiveShadow = true;
shelter.add(roof);

/* --- visible roof gutter edge along both long eaves --- */
addBox(M.gutter, 4.56, 0.12, 0.06, 0,  2.31,  0.92);
addBox(M.gutter, 4.56, 0.12, 0.06, 0,  2.31, -0.92);

/* --- curved end fascia caps (follow the roof arc) --- */
const fasciaShape = new THREE.Shape();
fasciaShape.moveTo(-0.92, -0.02);
fasciaShape.quadraticCurveTo(0, 0.185, 0.92, -0.02);
fasciaShape.lineTo(0.92, 0.10);
fasciaShape.quadraticCurveTo(0, 0.305, -0.92, 0.10);
fasciaShape.closePath();
const fasciaGeo = new THREE.ExtrudeGeometry(fasciaShape, { depth: 0.05, bevelEnabled: false, curveSegments: 32 });
fasciaGeo.rotateY(Math.PI / 2);
for (const fx of [2.21, -2.26]) {
  const fascia = new THREE.Mesh(fasciaGeo, M.gutter);
  fascia.position.set(fx, 2.28, 0);
  fascia.castShadow = true;
  fascia.receiveShadow = true;
  shelter.add(fascia);
}

/* --- header beams under the roof (front + back + both ends) --- */
addBox(M.frame, 3.9,  0.08, 0.07, 0,     2.285, -0.65);
addBox(M.frame, 3.9,  0.08, 0.07, 0,     2.285,  0.65);
addBox(M.frame, 0.07, 0.08, 1.30, -1.95, 2.285,  0);
addBox(M.frame, 0.07, 0.08, 1.30,  1.95, 2.285,  0);

/* --- back wall: bottom rail, mullions, 3 glass panels --- */
addBox(M.frame, 3.9, 0.06, 0.07, 0, 0.11, -0.65);                 // bottom rail
addBox(M.frame, 0.05, 2.10, 0.06, -0.635, 1.19, -0.65);           // mullion
addBox(M.frame, 0.05, 2.10, 0.06,  0.635, 1.19, -0.65);           // mullion
for (const gx of [-1.27, 0, 1.27]) {
  const g = addBox(M.glass, 1.18, 2.10, 0.012, gx, 1.19, -0.65, false);
  g.receiveShadow = false;
}

/* --- left end: glass side panel with rails --- */
addBox(M.frame, 0.07, 0.06, 1.30, -1.95, 0.11, 0);                // bottom rail
const sideGlass = addBox(M.glass, 0.012, 2.10, 1.20, -1.95, 1.19, 0, false);
sideGlass.receiveShadow = false;

/* --- bench along the back (slatted, on steel legs) --- */
for (const sz of [-0.62, -0.505, -0.39]) {
  addBox(M.wood, 2.4, 0.032, 0.10, 0, 0.445, sz);
}
addBox(M.frame, 2.3, 0.05, 0.05, 0, 0.405, -0.505);               // cross rail
for (const lx of [-0.95, 0.95]) {
  addBox(M.frame, 0.06, 0.40, 0.08, lx, 0.20, -0.505);            // legs
  addBox(M.frame, 0.06, 0.03, 0.34, lx, 0.415, -0.505);           // seat brackets
}

/* --- advertising lightbox mounted on the right end --- */
addBox(M.adBox, 0.15, 1.90, 1.20, 1.95, 1.25, 0);                 // body
addBox(M.adBox, 0.08, 0.32, 0.10, 1.95, 0.16,  0.35);             // feet
addBox(M.adBox, 0.08, 0.32, 0.10, 1.95, 0.16, -0.35);

function makePosterTexture() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 768;
  const g = c.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, 768);
  sky.addColorStop(0, '#123a6b');
  sky.addColorStop(0.55, '#2a6ea8');
  sky.addColorStop(1, '#7fc4d8');
  g.fillStyle = sky; g.fillRect(0, 0, 512, 768);
  g.fillStyle = '#ffd166';
  g.beginPath(); g.arc(360, 200, 95, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#0d2c50';
  g.beginPath();
  g.moveTo(0, 500);
  g.quadraticCurveTo(130, 396, 300, 500);
  g.quadraticCurveTo(420, 430, 512, 488);
  g.lineTo(512, 768); g.lineTo(0, 768); g.closePath(); g.fill();
  g.fillStyle = '#ffffff';
  g.font = '700 68px system-ui, sans-serif';
  g.fillText('EXPLORE', 40, 110);
  g.fillText('YOUR CITY', 40, 184);
  g.font = '400 26px system-ui, sans-serif';
  g.fillStyle = '#d9e6f4';
  g.fillText('Hop on — it\'s closer than you think.', 40, 232);
  g.fillStyle = '#f3f5f7'; g.fillRect(0, 640, 512, 128);
  g.fillStyle = '#0f172a';
  g.textAlign = 'center';
  g.font = '700 40px system-ui, sans-serif';
  g.fillText('LINE M7 · every 10 min', 256, 698);
  g.font = '600 24px system-ui, sans-serif';
  g.fillStyle = '#5b6673';
  g.fillText('CITY TRANSIT', 256, 736);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

const posterTex = makePosterTexture();
const posterMat = new THREE.MeshStandardMaterial({
  map: posterTex, emissive: 0xffffff, emissiveMap: posterTex,
  emissiveIntensity: 0.5, roughness: 0.4, metalness: 0
});
const posterGeo = new THREE.PlaneGeometry(1.02, 1.53);
const bezelGeo  = new THREE.PlaneGeometry(1.10, 1.61);

const bezelOut = new THREE.Mesh(bezelGeo, M.bezel);
bezelOut.position.set(2.0265, 1.25, 0); bezelOut.rotation.y = Math.PI / 2;
const posterOut = new THREE.Mesh(posterGeo, posterMat);
posterOut.position.set(2.028, 1.25, 0); posterOut.rotation.y = Math.PI / 2;
const bezelIn = new THREE.Mesh(bezelGeo, M.bezel);
bezelIn.position.set(1.8735, 1.25, 0); bezelIn.rotation.y = -Math.PI / 2;
const posterIn = new THREE.Mesh(posterGeo, posterMat);
posterIn.position.set(1.872, 1.25, 0); posterIn.rotation.y = -Math.PI / 2;
shelter.add(bezelOut, posterOut, bezelIn, posterIn);

/* ---------- resize + loop ---------- */

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
