<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porcelain Chanterelle Cluster</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eee6d8}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeee6d8);
scene.fog = new THREE.Fog(0xeee6d8, 7, 13);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 1.65, 5.2);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.15;
controls.minDistance = 3.2;
controls.maxDistance = 7;
controls.target.set(0, 1.05, 0);

const porcelain = new THREE.MeshPhysicalMaterial({
  color: 0xe9b86b,
  roughness: 0.19,
  metalness: 0.02,
  clearcoat: 0.85,
  clearcoatRoughness: 0.1,
  sheen: 0.2,
  sheenColor: 0xffd89a
});
const porcelainLight = new THREE.MeshPhysicalMaterial({
  color: 0xf2c982,
  roughness: 0.2,
  metalness: 0.01,
  clearcoat: 0.9,
  clearcoatRoughness: 0.08
});
const gillMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xd99b4c,
  roughness: 0.28,
  clearcoat: 0.6,
  clearcoatRoughness: 0.14
});
const blushMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xe98c68,
  roughness: 0.27,
  clearcoat: 0.55,
  clearcoatRoughness: 0.18,
  transparent: true,
  opacity: 0.72
});
const baseMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xd7c5aa,
  roughness: 0.26,
  clearcoat: 0.7,
  clearcoatRoughness: 0.15
});

scene.add(new THREE.HemisphereLight(0xfff4df, 0x8d7766, 2.15));

const key = new THREE.DirectionalLight(0xffe5bd, 3.5);
key.position.set(-3.5, 6, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -2;
key.shadow.bias = -0.0005;
scene.add(key);

const rim = new THREE.DirectionalLight(0xffbd91, 1.8);
rim.position.set(4, 3, -3);
scene.add(rim);

const fill = new THREE.PointLight(0xffd9ad, 1.2, 7);
fill.position.set(-2, 1.7, 2.5);
scene.add(fill);

function makeTrumpetGeometry(phase, waveAmount) {
  const profile = [
    [0.22,0.04],[0.245,0.14],[0.205,0.34],[0.19,0.56],
    [0.235,0.71],[0.36,0.79],[0.57,0.87],[0.77,0.96],
    [0.91,1.045],[0.94,1.105],[0.87,1.18],[0.68,1.245],
    [0.47,1.285],[0.26,1.275],[0.085,1.22],[0.035,1.16]
  ];
  const segments = 64;
  const positions = [];
  const indices = [];
  for (let i = 0; i < profile.length; i++) {
    const radius = profile[i][0];
    const y = profile[i][1];
    const capFactor = Math.max(0, Math.min(1, (radius - 0.28) / 0.64));
    for (let j = 0; j < segments; j++) {
      const a = j / segments * Math.PI * 2;
      const wave = 1 + waveAmount * capFactor * (
        0.58 * Math.sin(a * 5 + phase) +
        0.22 * Math.sin(a * 9 - phase * 0.7)
      );
      const r = Math.max(0.012, radius * wave);
      const subtle = 0.018 * capFactor * Math.sin(a * 3 + phase * 1.4);
      positions.push(Math.cos(a) * r + subtle, y, Math.sin(a) * r);
    }
  }
  for (let i = 0; i < profile.length - 1; i++) {
    for (let j = 0; j < segments; j++) {
      const n = (j + 1) % segments;
      const a = i * segments + j;
      const b = i * segments + n;
      const c = (i + 1) * segments + n;
      const d = (i + 1) * segments + j;
      indices.push(a,b,d,b,c,d);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function addBlush(parent, x, y, z, sx, sy, sz, rotation) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 14), blushMaterial);
  mesh.position.set(x, y, z);
  mesh.scale.set(sx, sy, sz);
  mesh.rotation.set(rotation.x, rotation.y, rotation.z);
  mesh.castShadow = true;
  parent.add(mesh);
}

function addGills(parent, phase, count) {
  for (let i = 0; i < count; i++) {
    const a = i / count * Math.PI * 2 + phase * 0.2;
    const ca = Math.cos(a), sa = Math.sin(a);
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(ca * 0.16, 0.735, sa * 0.16),
      new THREE.Vector3(ca * 0.29, 0.77, sa * 0.29),
      new THREE.Vector3(ca * 0.52, 0.865, sa * 0.52),
      new THREE.Vector3(ca * 0.75, 0.96, sa * 0.75),
      new THREE.Vector3(ca * 0.9, 1.045, sa * 0.9)
    ]);
    const tube = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 12, 0.014 + (i % 3) * 0.002, 6, false),
      gillMaterial
    );
    tube.castShadow = true;
    tube.receiveShadow = true;
    parent.add(tube);
  }
}

function makeMushroom(config) {
  const group = new THREE.Group();
  group.position.set(config.x, 0.2, config.z);
  group.rotation.y = config.rotation;
  group.scale.setScalar(config.scale);

  const body = new THREE.Mesh(makeTrumpetGeometry(config.phase, 0.075), config.material);
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  addGills(group, config.phase, 27);

  addBlush(group, -0.46, 1.17, 0.58, 0.24, 0.055, 0.09, new THREE.Euler(-0.18,0.1,0.2));
  addBlush(group, 0.38, 0.97, 0.67, 0.17, 0.045, 0.07, new THREE.Euler(0.05,-0.2,-0.3));
  addBlush(group, -0.17, 0.52, 0.2, 0.095, 0.16, 0.035, new THREE.Euler(0.2,0.4,0.15));

  scene.add(group);
}

const baseProfile = [
  [0.12,0.02],[0.52,0.03],[0.88,0.1],[1.12,0.22],
  [1.18,0.32],[1.06,0.42],[0.72,0.48],[0.25,0.5]
];
const base = new THREE.Mesh(new THREE.LatheGeometry(
  baseProfile.map(p => new THREE.Vector2(p[0], p[1])), 64
), baseMaterial);
base.position.y = 0.02;
base.scale.set(1.05, 0.72, 0.82);
base.castShadow = true;
base.receiveShadow = true;
scene.add(base);

makeMushroom({x:0,z:0.06,scale:1.12,rotation:0.15,phase:0.7,material:porcelainLight});
makeMushroom({x:-0.53,z:0.02,scale:0.87,rotation:-0.35,phase:2.6,material:porcelain});
makeMushroom({x:0.52,z:-0.02,scale:0.92,rotation:0.45,phase:4.2,material:porcelain});

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(200, 64),
  new THREE.MeshStandardMaterial({color:0xeee6d8, roughness:0.8})
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.35;
floor.receiveShadow = true;
scene.add(floor);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
