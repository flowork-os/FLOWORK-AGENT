<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADA Access Ramp — Procedural three.js</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #141619; }
  canvas { display: block; }
  #caption {
    position: fixed; left: 0; right: 0; bottom: 14px;
    text-align: center; pointer-events: none;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(220, 224, 228, 0.55);
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="caption">ADA Access Ramp &mdash; 1:12 slope &middot; 500&nbsp;mm rise &middot; 6.0&nbsp;m run</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------
   ADA-compliant proportions (meters)
   - Slope 1:12  (max allowed by ADA 405.2)
   - Rise 0.50 m (< 760 mm max rise per run, ADA 405.6)
   - Clear width 1.22 m (48", > 36" min, ADA 405.5)
   - Top landing 1.60 m long (> 60" min, ADA 405.7)
   - Handrail height 865 mm (34", within 34"-38", ADA 505.4)
   - Rail diameter 38 mm (1.25"-2" gripping range, ADA 505.7)
   - 305 mm (12") horizontal handrail extension at bottom (ADA 505.10)
   - 50 mm (2") edge-protection curbs (ADA 405.9)
------------------------------------------------------------------- */
const RUN    = 6.0;     // horizontal ramp run
const RISE   = 0.5;     // total rise
const W      = 1.22;    // deck width
const LAND   = 1.6;     // top landing length
const RAIL_H = 0.865;   // handrail height above surface
const MID_H  = 0.50;    // intermediate rail height
const CURB   = 0.05;    // edge protection curb
const EXT    = 0.305;   // bottom handrail extension
const RAIL_R = 0.019;   // rail radius (38 mm dia)
const POST_R = 0.024;   // post radius (48 mm pipe)

const X_TOP  = -RUN / 2;            // top of ramp
const X_BOT  =  RUN / 2;            // bottom of ramp
const X_BACK = X_TOP - LAND;        // back of landing
const SLOPE  = Math.atan2(RISE, RUN);

// deck surface height at any x
function surfY(x) {
  if (x <= X_TOP) return RISE;
  if (x >= X_BOT) return 0;
  return RISE * (X_BOT - x) / RUN;
}

/* ---------------- renderer / scene / camera ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141619);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(7.5, 4.2, 9.0);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 3;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI / 2 - 0.03;

// soft studio environment for believable metal / concrete response
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

/* ---------------- lighting: key + fill + rim ---------------- */
const hemi = new THREE.HemisphereLight(0x6b7686, 0x1c1e22, 0.45);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff0dd, 2.6);
key.position.set(6, 9, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -7;
key.shadow.camera.near = 1;
key.shadow.camera.far = 30;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fa8c8, 0.6);
fill.position.set(-7, 3.5, 4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xdfe8ff, 1.3);
rim.position.set(-4, 6, -8);
scene.add(rim);

/* ---------------- ground: shadow-only plane ---------------- */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(22, 64),
  new THREE.ShadowMaterial({ opacity: 0.38 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.002;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------- procedural concrete texture ---------------- */
function concreteCanvas() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = '#aaa69d';
  g.fillRect(0, 0, 512, 512);
  // large soft blotches
  for (let i = 0; i < 70; i++) {
    const x = Math.random() * 512, y = Math.random() * 512, r = 30 + Math.random() * 90;
    const v = 150 + Math.floor(Math.random() * 40);
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, 'rgba(' + v + ',' + v + ',' + (v - 6) + ',0.10)');
    grad.addColorStop(1, 'rgba(' + v + ',' + v + ',' + (v - 6) + ',0)');
    g.fillStyle = grad;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // fine aggregate speckle
  for (let i = 0; i < 16000; i++) {
    const x = Math.random() * 512, y = Math.random() * 512;
    const v = 120 + Math.floor(Math.random() * 90);
    g.fillStyle = 'rgba(' + v + ',' + v + ',' + (v - 5) + ',' + (0.05 + Math.random() * 0.13) + ')';
    const s = 0.4 + Math.random() * 1.5;
    g.fillRect(x, y, s, s);
  }
  return c;
}
const cCanvas = concreteCanvas();
const concreteMap = new THREE.CanvasTexture(cCanvas);
concreteMap.wrapS = concreteMap.wrapT = THREE.RepeatWrapping;
concreteMap.colorSpace = THREE.SRGBColorSpace;
concreteMap.repeat.set(0.5, 0.5);
const concreteBump = new THREE.CanvasTexture(cCanvas);
concreteBump.wrapS = concreteBump.wrapT = THREE.RepeatWrapping;
concreteBump.repeat.set(0.5, 0.5);

/* ---------------- materials ---------------- */
const concreteMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, map: concreteMap, bumpMap: concreteBump, bumpScale: 0.015,
  roughness: 0.93, metalness: 0.0, envMapIntensity: 0.35
});
const steelMat = new THREE.MeshStandardMaterial({
  color: 0xc8cdd2, metalness: 0.88, roughness: 0.3, envMapIntensity: 0.9
});
const jointMat = new THREE.MeshStandardMaterial({
  color: 0x3c3b38, roughness: 1.0, metalness: 0.0, envMapIntensity: 0.2
});

/* ---------------- the single centered object ---------------- */
const ramp = new THREE.Group();

function addMesh(geo, mat) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  ramp.add(m);
  return m;
}

// --- solid poured-concrete body: landing block + wedge as one profile ---
const prof = new THREE.Shape();
prof.moveTo(X_BACK, 0);
prof.lineTo(X_BOT, 0);
prof.lineTo(X_TOP, RISE);
prof.lineTo(X_BACK, RISE);
prof.closePath();
const bodyGeo = new THREE.ExtrudeGeometry(prof, { depth: W, bevelEnabled: false });
bodyGeo.translate(0, 0, -W / 2);
addMesh(bodyGeo, concreteMat);

// --- 2" edge-protection curbs, both sides ---
const rampLen = Math.hypot(RUN, RISE);
for (const s of [-1, 1]) {
  const zc = s * (W / 2 - CURB / 2);
  // sloped curb along ramp
  const cr = addMesh(new THREE.BoxGeometry(rampLen, CURB, CURB), concreteMat);
  cr.rotation.z = -SLOPE;
  cr.position.set(0, RISE / 2 + CURB / 2, zc);
  // level curb along landing
  const cl = addMesh(new THREE.BoxGeometry(LAND, CURB, CURB), concreteMat);
  cl.position.set(X_BACK + LAND / 2, RISE + CURB / 2, zc);
}

// --- control joints scored across the ramp surface ---
for (const jx of [-1.5, 0, 1.5]) {
  const j = addMesh(new THREE.BoxGeometry(0.016, 0.004, W - 2 * CURB - 0.02), jointMat);
  j.rotation.z = -SLOPE;
  j.position.set(jx, surfY(jx) + 0.001, 0);
  j.castShadow = false;
}

// --- handrail helpers ---
const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
const UP = new THREE.Vector3(0, 1, 0);

function bar(p1, p2, r) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  const m = addMesh(new THREE.CylinderGeometry(r, r, len, 20), steelMat);
  m.position.copy(p1).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(UP, dir.normalize());
  return m;
}
function joint(p, r) {
  const m = addMesh(new THREE.SphereGeometry(r, 16, 12), steelMat);
  m.position.copy(p);
  return m;
}
function polyline(pts, r) {
  for (let i = 0; i < pts.length - 1; i++) bar(pts[i], pts[i + 1], r);
  for (const p of pts) joint(p, r);
}
function flange(x, y, z) {
  const f = addMesh(new THREE.CylinderGeometry(0.055, 0.06, 0.012, 20), steelMat);
  f.position.set(x, y + 0.006, z);
}

// --- handrails: continuous top rail + intermediate rail, both sides ---
const zRail = W / 2 - 0.09;                       // rail centreline inset from edge
const POST_X = [X_BACK + 0.1, X_TOP, -1.8, -0.6, 0.6, 1.8, X_BOT]; // ~1.2 m spacing
const xEnd = X_BOT + EXT;                          // bottom extension end

for (const s of [-1, 1]) {
  const z = s * zRail;

  // top gripping rail: level over landing (= required top extension),
  // sloped down the run, then 305 mm level extension past the bottom
  polyline([
    v3(X_BACK + 0.05, RISE + RAIL_H, z),
    v3(X_TOP,         RISE + RAIL_H, z),
    v3(X_BOT,         RAIL_H,        z),
    v3(xEnd,          RAIL_H,        z)
  ], RAIL_R);

  // intermediate rail
  polyline([
    v3(X_BACK + 0.05, RISE + MID_H, z),
    v3(X_TOP,         RISE + MID_H, z),
    v3(X_BOT,         MID_H,        z),
    v3(xEnd,          MID_H,        z)
  ], RAIL_R);

  // extension end returns to a grounded terminal post
  bar(v3(xEnd, RAIL_H, z), v3(xEnd, 0, z), POST_R);
  flange(xEnd, 0, z);

  // vertical posts down to the deck, with base flanges
  for (const px of POST_X) {
    const y0 = surfY(px);
    bar(v3(px, y0 + RAIL_H, z), v3(px, y0, z), POST_R);
    flange(px, y0, z);
  }
}

// centre the whole assembly at the origin
new THREE.Box3().setFromObject(ramp);
ramp.position.x = -(X_BACK + xEnd) / 2;
scene.add(ramp);

/* ---------------- resize + loop ---------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
