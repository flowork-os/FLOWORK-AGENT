<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pineapple</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#f3ece0}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3ece0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.1, 1.7, 3.9);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.25, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.3;
controls.minDistance = 2.2;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.52;

// Lights
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x6b5a3e, 0.55));
const key = new THREE.DirectionalLight(0xfff0d8, 1.7);
key.position.set(3.5, 5.5, 2.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -3;
key.shadow.camera.right = key.shadow.camera.top = 3;
key.shadow.camera.near = 1;
key.shadow.camera.far = 14;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);
const rim = new THREE.DirectionalLight(0xcfe0ff, 0.45);
rim.position.set(-4, 2, -3);
scene.add(rim);

// Ground (soft shadow catcher)
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(6, 48).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.26 })
);
ground.position.y = -1.09;
ground.receiveShadow = true;
scene.add(ground);

const pineapple = new THREE.Group();
scene.add(pineapple);

// --- Body profile & asymmetry helpers ---
const Y0 = -1.02, H = 2.06;
const prof = t => 0.78 * Math.pow(Math.sin(Math.PI * (0.04 + 0.92 * t)), 0.62) * (1.02 - 0.12 * t);
const lean = y => 0.06 * Math.sin(Math.PI * Math.min(Math.max((y + 1.08) / 2.16, 0), 1));
const bulge = (th, y) => 1 + 0.04 * Math.cos(th + 0.7) * Math.sin(Math.PI * Math.min(Math.max((y + 1.08) / 2.16, 0), 1));

// --- Body (slightly asymmetric ovoid) ---
const pts = [new THREE.Vector2(0.02, -1.08)];
for (let i = 0; i <= 24; i++) {
  const t = i / 24;
  pts.push(new THREE.Vector2(prof(t), Y0 + H * t));
}
pts.push(new THREE.Vector2(0.02, 1.09));
const bodyGeo = new THREE.LatheGeometry(pts, 48);
const bp = bodyGeo.attributes.position;
for (let i = 0; i < bp.count; i++) {
  let x = bp.getX(i), y = bp.getY(i), z = bp.getZ(i);
  const th = Math.atan2(z, x), b = bulge(th, y);
  bp.setXYZ(i, x * b + lean(y), y, z * b);
}
bodyGeo.computeVertexNormals();
const body = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ color: 0x9a6a22, roughness: 0.72 }));
body.castShadow = body.receiveShadow = true;
pineapple.add(body);

// --- Eyes: diamond grid of raised hexagonal bumps ---
const ROWS = 10, COLS = 11;
const eyeGeo = new THREE.ConeGeometry(1, 0.7, 6);
eyeGeo.translate(0, 0.35, 0);
const eyes = new THREE.InstancedMesh(
  eyeGeo,
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55, flatShading: true }),
  ROWS * COLS
);
eyes.castShadow = true;
const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), P = new THREE.Vector3(),
      S = new THREE.Vector3(), N = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0),
      C = new THREE.Color();
let idx = 0;
for (let r = 0; r < ROWS; r++) {
  const t = 0.07 + 0.88 * (r / (ROWS - 1));
  const y = Y0 + H * t;
  for (let c = 0; c < COLS; c++) {
    const th = (c + (r % 2) * 0.5) / COLS * Math.PI * 2 + 0.07 * (rnd() - 0.5);
    const rad = prof(t) * bulge(th, y);
    P.set(Math.cos(th) * rad + lean(y), y, Math.sin(th) * rad);
    N.set(P.x - lean(y), y * 0.55, P.z).normalize();
    Q.setFromUnitVectors(UP, N);
    const s = Math.max(0.05, Math.min(0.15, Math.PI * rad / COLS * 0.82)) * (0.92 + 0.16 * rnd());
    S.set(s, s * 0.85, s);
    P.addScaledVector(N, -0.012);
    M.compose(P, Q, S);
    eyes.setMatrixAt(idx, M);
    C.setHSL(rnd() < 0.15 ? 0.15 : 0.08 + 0.04 * rnd(), 0.62 + 0.18 * rnd(), 0.40 + 0.11 * rnd());
    eyes.setColorAt(idx++, C);
  }
}
pineapple.add(eyes);

// --- Crown of stiff serrated leaves ---
function leafGeo(L, W, curl) {
  const seg = 18, p = [], id = [];
  for (let i = 0; i <= seg; i++) {
    const t = i / seg;
    const saw = 1 - 0.28 * Math.abs(((t * 16) % 1) - 0.5) * 2; // serration
    const w = W * Math.pow(1 - t, 0.9) * saw + 0.003;
    const y = L * t, z = curl * L * t * t, f = 0.5 * w;      // folded V section
    p.push(-w, y, z + f, 0, y, z, w, y, z + f);
  }
  for (let i = 0; i < seg; i++) {
    const a = i * 3, b = a + 3;
    id.push(a, b, a + 1, a + 1, b, b + 1, a + 1, b + 1, a + 2, a + 2, b + 1, b + 2);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  g.setIndex(id);
  g.computeVertexNormals();
  return g;
}
const crown = new THREE.Group();
crown.position.y = 0.97;
const leafMatA = new THREE.MeshStandardMaterial({ color: 0x2f7a2b, roughness: 0.75, side: THREE.DoubleSide });
const leafMatB = new THREE.MeshStandardMaterial({ color: 0x256b26, roughness: 0.8, side: THREE.DoubleSide });
const core = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.35, 8), leafMatB);
core.position.y = 0.12;
crown.add(core);
const rings = [
  { n: 5, len: 0.45, tilt: 0.15, curl: 0.25 },
  { n: 7, len: 0.75, tilt: 0.42, curl: 0.45 },
  { n: 9, len: 1.00, tilt: 0.72, curl: 0.60 },
  { n: 10, len: 1.15, tilt: 1.02, curl: 0.75 }
];
rings.forEach((ring, ri) => {
  for (let k = 0; k < ring.n; k++) {
    const g = new THREE.Group();
    g.rotation.y = (k / ring.n) * Math.PI * 2 + ri * 0.9 + (rnd() - 0.5) * 0.3;
    const leaf = new THREE.Mesh(
      leafGeo(ring.len * (0.85 + 0.3 * rnd()), 0.09 + 0.02 * ri, ring.curl * (0.8 + 0.4 * rnd())),
      rnd() < 0.5 ? leafMatA : leafMatB
    );
    leaf.rotation.x = ring.tilt * (0.9 + 0.2 * rnd());
    leaf.position.set(0, -0.02 * ri, 0.02 + 0.03 * ri);
    leaf.castShadow = true;
    g.add(leaf);
    crown.add(g);
  }
});
pineapple.add(crown);
pineapple.rotation.y = 0.4;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
