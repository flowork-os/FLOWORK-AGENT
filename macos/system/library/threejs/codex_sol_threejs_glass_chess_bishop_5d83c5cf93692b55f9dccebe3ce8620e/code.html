<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal Bishop</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #071116;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x071116);
scene.fog = new THREE.FogExp2(0x071116, 0.025);

const camera = new THREE.PerspectiveCamera(
  34,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.set(8.2, 5.5, 10.5);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance'
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0x071116, 1);
document.body.appendChild(renderer.domElement);

const pmremGenerator = new THREE.PMREMGenerator(renderer);
const roomEnvironment = new RoomEnvironment();
scene.environment = pmremGenerator.fromScene(roomEnvironment, 0.045).texture;
roomEnvironment.dispose();
pmremGenerator.dispose();

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.enablePan = false;
controls.minDistance = 7.5;
controls.maxDistance = 18;
controls.minPolarAngle = Math.PI * 0.24;
controls.maxPolarAngle = Math.PI * 0.57;
controls.update();

scene.add(new THREE.HemisphereLight(0xb8e9ff, 0x071015, 1.65));

const keyLight = new THREE.SpotLight(0xe7fbff, 110, 28, Math.PI * 0.18, 0.55, 1.4);
keyLight.position.set(5.5, 10.5, 7);
keyLight.target.position.set(0, 2.7, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 2;
keyLight.shadow.camera.far = 26;
keyLight.shadow.bias = -0.00025;
keyLight.shadow.normalBias = 0.025;
scene.add(keyLight, keyLight.target);

const rimLight = new THREE.SpotLight(0x57e6ff, 90, 24, Math.PI * 0.2, 0.65, 1.6);
rimLight.position.set(-6.5, 7, -5.5);
rimLight.target.position.set(0, 3.6, 0);
scene.add(rimLight, rimLight.target);

const warmLight = new THREE.PointLight(0xffe3c4, 28, 14, 1.6);
warmLight.position.set(4.5, 2.3, -4.2);
scene.add(warmLight);

const topLight = new THREE.PointLight(0xc5ffff, 36, 12, 1.5);
topLight.position.set(-1.5, 9, 2);
scene.add(topLight);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x0a171c,
  roughness: 0.23,
  metalness: 0.08,
  envMapIntensity: 0.7
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(18, 128), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.035;
floor.receiveShadow = true;
scene.add(floor);

function createCausticTexture() {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const context = canvas.getContext('2d');

  context.clearRect(0, 0, size, size);

  const glow = context.createRadialGradient(256, 256, 12, 256, 256, 220);
  glow.addColorStop(0, 'rgba(170,255,250,0.30)');
  glow.addColorStop(0.22, 'rgba(88,225,235,0.15)');
  glow.addColorStop(0.55, 'rgba(40,170,190,0.055)');
  glow.addColorStop(1, 'rgba(0,80,100,0)');
  context.fillStyle = glow;
  context.fillRect(0, 0, size, size);

  context.save();
  context.translate(256, 256);
  context.globalCompositeOperation = 'screen';
  for (let index = 0; index < 22; index++) {
    const angle = index * 2.3999632297;
    const radius = 38 + (index % 7) * 20;
    const x = Math.cos(angle) * radius;
    const y = Math.sin(angle) * radius * 0.68;
    const length = 32 + (index % 5) * 13;

    context.save();
    context.translate(x, y);
    context.rotate(angle + Math.PI * 0.5);
    const streak = context.createLinearGradient(-length, 0, length, 0);
    streak.addColorStop(0, 'rgba(75,220,240,0)');
    streak.addColorStop(0.48, 'rgba(190,255,250,0.18)');
    streak.addColorStop(0.52, 'rgba(235,255,255,0.27)');
    streak.addColorStop(1, 'rgba(75,220,240,0)');
    context.fillStyle = streak;
    context.beginPath();
    context.ellipse(0, 0, length, 2.2 + (index % 3), 0, 0, Math.PI * 2);
    context.fill();
    context.restore();
  }
  context.restore();

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.needsUpdate = true;
  return texture;
}

const causticMaterial = new THREE.MeshBasicMaterial({
  map: createCausticTexture(),
  transparent: true,
  opacity: 0.72,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  toneMapped: false
});
const caustics = new THREE.Mesh(new THREE.PlaneGeometry(5.8, 5.8), causticMaterial);
caustics.rotation.x = -Math.PI / 2;
caustics.rotation.z = -0.35;
caustics.position.set(0.28, -0.017, 0.2);
scene.add(caustics);

const crystalMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xd8ffff,
  roughness: 0.035,
  metalness: 0,
  transmission: 1,
  thickness: 1.7,
  ior: 1.48,
  attenuationColor: new THREE.Color(0x83ddd7),
  attenuationDistance: 7.5,
  specularIntensity: 1,
  specularColor: new THREE.Color(0xffffff),
  clearcoat: 1,
  clearcoatRoughness: 0.025,
  envMapIntensity: 2.5,
  transparent: true,
  opacity: 1,
  side: THREE.DoubleSide
});

const edgeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x72f0ec,
  roughness: 0.07,
  metalness: 0,
  transmission: 0.72,
  thickness: 0.3,
  ior: 1.43,
  attenuationColor: new THREE.Color(0x37bfc3),
  attenuationDistance: 2.4,
  clearcoat: 1,
  clearcoatRoughness: 0.04,
  transparent: true,
  opacity: 0.28,
  envMapIntensity: 3,
  depthWrite: false,
  side: THREE.DoubleSide
});

const cutMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x6de8e8,
  roughness: 0.08,
  metalness: 0,
  transmission: 0.38,
  thickness: 0.12,
  ior: 1.52,
  clearcoat: 1,
  clearcoatRoughness: 0.025,
  transparent: true,
  opacity: 0.48,
  envMapIntensity: 3.5,
  side: THREE.DoubleSide,
  depthWrite: false
});

const bishop = new THREE.Group();
scene.add(bishop);

const profile = [
  [0.03, 0.00],
  [1.22, 0.00],
  [1.48, 0.045],
  [1.66, 0.15],
  [1.73, 0.29],
  [1.70, 0.43],
  [1.57, 0.58],
  [1.39, 0.70],
  [1.18, 0.78],
  [1.09, 0.88],
  [1.08, 0.98],
  [0.96, 1.08],
  [0.79, 1.20],
  [0.67, 1.43],
  [0.59, 1.75],
  [0.54, 2.12],
  [0.55, 2.48],
  [0.61, 2.72],
  [0.72, 2.89],
  [0.91, 3.01],
  [1.05, 3.10],
  [1.10, 3.23],
  [1.05, 3.37],
  [0.91, 3.46],
  [0.73, 3.53],
  [0.64, 3.66],
  [0.62, 3.83],
  [0.68, 4.01],
  [0.81, 4.16],
  [0.94, 4.28],
  [0.97, 4.40],
  [0.89, 4.51],
  [0.72, 4.61],
  [0.52, 4.68],
  [0.30, 4.75],
  [0.04, 4.79]
].map(([radius, height]) => new THREE.Vector2(radius, height));

const bodyGeometry = new THREE.LatheGeometry(profile, 160);
bodyGeometry.computeVertexNormals();

const body = new THREE.Mesh(bodyGeometry, crystalMaterial);
body.castShadow = true;
body.receiveShadow = true;
bishop.add(body);

const innerMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xa8ffff,
  roughness: 0.08,
  metalness: 0,
  transmission: 0.54,
  thickness: 0.65,
  ior: 1.38,
  attenuationColor: new THREE.Color(0x55d7d2),
  attenuationDistance: 4,
  transparent: true,
  opacity: 0.105,
  envMapIntensity: 2,
  depthWrite: false,
  side: THREE.BackSide
});

const innerBody = new THREE.Mesh(bodyGeometry, innerMaterial);
innerBody.scale.set(0.965, 0.985, 0.965);
innerBody.position.y = 0.028;
bishop.add(innerBody);

function addHorizontalRing(radius, tube, height, opacityScale = 1) {
  const geometry = new THREE.TorusGeometry(radius, tube, 20, 128);
  const material = edgeMaterial.clone();
  material.opacity *= opacityScale;
  const ring = new THREE.Mesh(geometry, material);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = height;
  bishop.add(ring);
  return ring;
}

addHorizontalRing(1.61, 0.022, 0.18, 0.72);
addHorizontalRing(1.52, 0.018, 0.55, 0.62);
addHorizontalRing(1.02, 0.017, 0.99, 0.58);
addHorizontalRing(1.03, 0.022, 3.20, 0.78);
addHorizontalRing(0.88, 0.016, 3.48, 0.56);
addHorizontalRing(0.91, 0.016, 4.34, 0.5);

const mitreGeometry = new THREE.SphereGeometry(1, 128, 96);
const mitreMaterial = crystalMaterial.clone();
mitreMaterial.thickness = 1.25;
mitreMaterial.attenuationDistance = 5.2;
mitreMaterial.onBeforeCompile = (shader) => {
  shader.vertexShader = shader.vertexShader.replace(
    '#include <common>',
    '#include <common>\nvarying vec3 vMitreLocalPosition;'
  );
  shader.vertexShader = shader.vertexShader.replace(
    '#include <begin_vertex>',
    '#include <begin_vertex>\nvMitreLocalPosition = position;'
  );
  shader.fragmentShader = shader.fragmentShader.replace(
    '#include <common>',
    '#include <common>\nvarying vec3 vMitreLocalPosition;'
  );
  shader.fragmentShader = shader.fragmentShader.replace(
    '#include <clipping_planes_fragment>',
    `#include <clipping_planes_fragment>
     float slotDistance = vMitreLocalPosition.y - 0.68 * vMitreLocalPosition.x - 0.02;
     if (abs(slotDistance) < 0.105) discard;`
  );
};
mitreMaterial.customProgramCacheKey = () => 'crystal-bishop-mitre-slot-v1';

const mitreAssembly = new THREE.Group();
mitreAssembly.position.y = 5.39;
mitreAssembly.scale.set(0.94, 1.16, 0.94);
bishop.add(mitreAssembly);

const mitre = new THREE.Mesh(mitreGeometry, mitreMaterial);
mitre.castShadow = true;
mitre.receiveShadow = true;
mitreAssembly.add(mitre);

const slotNormalRaw = new THREE.Vector3(-0.68, 1, 0);
const slotNormal = slotNormalRaw.clone().normalize();
const slotNormalLengthSquared = slotNormalRaw.lengthSq();
const slotQuaternion = new THREE.Quaternion().setFromUnitVectors(
  new THREE.Vector3(0, 0, 1),
  slotNormal
);

for (const slotEquationValue of [-0.085, 0.125]) {
  const face = new THREE.Mesh(
    new THREE.CircleGeometry(0.965, 128),
    cutMaterial
  );
  face.quaternion.copy(slotQuaternion);
  face.position.copy(
    slotNormalRaw.clone().multiplyScalar(slotEquationValue / slotNormalLengthSquared)
  );
  mitreAssembly.add(face);
}

const slotGlowGeometry = new THREE.PlaneGeometry(1.86, 0.032);
const slotGlowMaterial = new THREE.MeshBasicMaterial({
  color: 0xb8ffff,
  transparent: true,
  opacity: 0.29,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  side: THREE.DoubleSide,
  toneMapped: false
});
const slotGlow = new THREE.Mesh(slotGlowGeometry, slotGlowMaterial);
slotGlow.rotation.z = Math.atan(0.68);
slotGlow.position.set(0, 5.41, 0.035);
bishop.add(slotGlow);

const capGeometry = new THREE.SphereGeometry(0.255, 96, 64);
const cap = new THREE.Mesh(capGeometry, crystalMaterial);
cap.position.y = 6.675;
cap.castShadow = true;
cap.receiveShadow = true;
bishop.add(cap);

const capCoreMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xa8ffff,
  roughness: 0.02,
  transmission: 0.5,
  thickness: 0.22,
  ior: 1.42,
  transparent: true,
  opacity: 0.16,
  envMapIntensity: 3,
  depthWrite: false
});
const capCore = new THREE.Mesh(
  new THREE.SphereGeometry(0.18, 64, 48),
  capCoreMaterial
);
capCore.position.copy(cap.position);
bishop.add(capCore);

const baseHighlight = new THREE.Mesh(
  new THREE.TorusGeometry(1.69, 0.012, 16, 160),
  new THREE.MeshBasicMaterial({
    color: 0xc8ffff,
    transparent: true,
    opacity: 0.23,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    toneMapped: false
  })
);
baseHighlight.rotation.x = Math.PI / 2;
baseHighlight.position.y = 0.31;
bishop.add(baseHighlight);

bishop.position.y = 0.02;
bishop.rotation.y = -0.24;

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  slotGlow.material.opacity = 0.24 + Math.sin(elapsed * 1.35) * 0.045;
  caustics.material.opacity = 0.68 + Math.sin(elapsed * 0.48) * 0.05;

  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
