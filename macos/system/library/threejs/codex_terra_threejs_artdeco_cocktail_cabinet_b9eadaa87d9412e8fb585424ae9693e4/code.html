<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art Deco Cocktail Cabinet</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #090a0d; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090a0d);
scene.fog = new THREE.Fog(0x090a0d, 12, 28);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(7.6, 5.2, 9.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.95, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.42;
controls.minDistance = 6.5;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.49;

const ebony = new THREE.MeshPhysicalMaterial({
  color: 0x090b0d,
  metalness: 0.28,
  roughness: 0.16,
  clearcoat: 1,
  clearcoatRoughness: 0.08,
  reflectivity: 0.9
});
const ebonySoft = new THREE.MeshPhysicalMaterial({
  color: 0x121316,
  metalness: 0.12,
  roughness: 0.28,
  clearcoat: 0.8,
  clearcoatRoughness: 0.16
});
const blackEdge = new THREE.MeshStandardMaterial({
  color: 0x030405,
  metalness: 0.55,
  roughness: 0.22
});
const brass = new THREE.MeshPhysicalMaterial({
  color: 0xb98b34,
  metalness: 0.97,
  roughness: 0.16,
  clearcoat: 0.35,
  clearcoatRoughness: 0.12
});
const brightGold = new THREE.MeshPhysicalMaterial({
  color: 0xf0c15c,
  metalness: 1,
  roughness: 0.13,
  clearcoat: 0.45
});
const darkGold = new THREE.MeshStandardMaterial({
  color: 0x72531d,
  metalness: 0.95,
  roughness: 0.25
});
const mirror = new THREE.MeshPhysicalMaterial({
  color: 0x65706e,
  metalness: 1,
  roughness: 0.055,
  clearcoat: 1,
  clearcoatRoughness: 0.03
});

const cabinet = new THREE.Group();
scene.add(cabinet);

function box(width, height, depth, material, x = 0, y = 0, z = 0, bevel = 0) {
  const geometry = new THREE.BoxGeometry(width, height, depth, 1, 1, 1);
  if (bevel > 0) {
    geometry.translate(0, 0, 0);
  }
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  cabinet.add(mesh);
  return mesh;
}

function cylinder(radiusTop, radiusBottom, height, material, x, y, z, segments = 24) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments), material);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  cabinet.add(mesh);
  return mesh;
}

function createRodBetween(a, b, radius, material) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const midpoint = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, direction.length(), 12), material);
  mesh.position.copy(midpoint);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  cabinet.add(mesh);
  return mesh;
}

box(4.3, 0.32, 1.8, blackEdge, 0, 0.37, 0);
box(4.12, 0.18, 1.7, brass, 0, 0.56, 0.01);
box(3.88, 5.42, 1.54, ebonySoft, 0, 3.28, 0);
box(4.12, 5.68, 1.72, blackEdge, 0, 3.34, -0.02);

box(4.22, 0.19, 1.78, brass, 0, 5.94, 0);
box(4.37, 0.24, 1.85, blackEdge, 0, 6.1, 0);
box(3.83, 0.25, 1.59, brass, 0, 6.26, 0);
box(3.46, 0.27, 1.43, blackEdge, 0, 6.43, 0);
box(2.92, 0.27, 1.25, brass, 0, 6.6, 0);
box(2.35, 0.32, 1.08, blackEdge, 0, 6.78, 0);
box(1.72, 0.25, 0.92, brass, 0, 6.95, 0);
box(1.18, 0.31, 0.78, blackEdge, 0, 7.11, 0);

for (const side of [-1, 1]) {
  box(0.18, 5.36, 1.8, brass, side * 2.02, 3.25, 0.01);
  box(0.11, 5.12, 1.87, darkGold, side * 2.18, 3.25, 0.01);
  box(0.17, 0.24, 1.88, brass, side * 2.04, 5.95, 0);
  box(0.17, 0.24, 1.88, brass, side * 2.04, 0.7, 0);
}

const frontZ = 0.82;
const doorY = 3.35;
const doorHeight = 4.8;
const doorWidth = 1.84;
for (const side of [-1, 1]) {
  const doorX = side * 0.965;
  box(doorWidth, doorHeight, 0.105, ebony, doorX, doorY, frontZ);
  box(doorWidth + 0.1, 0.11, 0.14, brass, doorX, doorY + doorHeight / 2 - 0.08, frontZ + 0.022);
  box(doorWidth + 0.1, 0.11, 0.14, brass, doorX, doorY - doorHeight / 2 + 0.08, frontZ + 0.022);
  box(0.1, doorHeight, 0.14, brass, doorX - side * (doorWidth / 2 - 0.05), doorY, frontZ + 0.022);
  box(0.072, doorHeight - 0.14, 0.14, darkGold, doorX + side * (doorWidth / 2 - 0.12), doorY, frontZ + 0.026);
  for (let i = -3; i <= 3; i++) {
    const y = doorY + i * 0.57;
    cylinder(0.038, 0.038, 0.32, brass, doorX + side * 0.65, y, frontZ + 0.11, 14).rotation.x = Math.PI / 2;
  }
}

box(0.13, 5.03, 0.17, brightGold, 0, doorY, frontZ + 0.04);
box(0.19, 0.5, 0.21, brass, 0, 3.34, frontZ + 0.12);
cylinder(0.105, 0.105, 0.08, brightGold, 0, 3.34, frontZ + 0.24, 24).rotation.x = Math.PI / 2;

const rayOrigin = new THREE.Vector3(0, 3.58, frontZ + 0.11);
for (let i = -8; i <= 8; i++) {
  if (i === 0) continue;
  const angle = i * 0.112;
  const length = 1.27 - Math.abs(i) * 0.045;
  const endpoint = new THREE.Vector3(Math.sin(angle) * length, rayOrigin.y + Math.cos(angle) * length * 0.82, frontZ + 0.13);
  createRodBetween(rayOrigin, endpoint, 0.028, brightGold);
}
createRodBetween(
  new THREE.Vector3(-1.54, 2.15, frontZ + 0.105),
  new THREE.Vector3(0, 3.58, frontZ + 0.105),
  0.032,
  brass
);
createRodBetween(
  new THREE.Vector3(1.54, 2.15, frontZ + 0.105),
  new THREE.Vector3(0, 3.58, frontZ + 0.105),
  0.032,
  brass
);
createRodBetween(
  new THREE.Vector3(-1.42, 4.79, frontZ + 0.105),
  new THREE.Vector3(0, 3.58, frontZ + 0.105),
  0.026,
  darkGold
);
createRodBetween(
  new THREE.Vector3(1.42, 4.79, frontZ + 0.105),
  new THREE.Vector3(0, 3.58, frontZ + 0.105),
  0.026,
  darkGold
);

for (const side of [-1, 1]) {
  const x = side * 1.68;
  const leg = cylinder(0.105, 0.062, 1.58, ebonySoft, x, -0.48, 0.48, 16);
  leg.rotation.z = side * 0.1;
  cylinder(0.15, 0.08, 0.22, brass, side * 1.76, -1.28, 0.49, 16);
  cylinder(0.09, 0.13, 0.1, brightGold, side * 1.77, -1.43, 0.49, 16);
  const rearLeg = cylinder(0.085, 0.052, 1.48, ebonySoft, side * 1.68, -0.43, -0.57, 16);
  rearLeg.rotation.z = side * 0.08;
  cylinder(0.115, 0.07, 0.18, brass, side * 1.75, -1.2, -0.57, 16);
}

box(3.72, 0.14, 0.19, brass, 0, 0.52, 0.79);
box(3.72, 0.13, 0.19, brass, 0, 0.52, -0.79);

const mirrorPanel = box(1.36, 0.73, 0.035, mirror, 0, 6.78, 0.48);
mirrorPanel.rotation.x = -0.13;
box(1.52, 0.08, 0.1, brass, 0, 7.13, 0.48);
box(1.52, 0.08, 0.1, brass, 0, 6.43, 0.48);

const floor = new THREE.Mesh(
  new THREE.CylinderGeometry(8.8, 8.8, 0.22, 96),
  new THREE.MeshStandardMaterial({ color: 0x151116, metalness: 0.35, roughness: 0.28 })
);
floor.position.y = -1.57;
floor.receiveShadow = true;
scene.add(floor);

const inset = new THREE.Mesh(
  new THREE.RingGeometry(6.6, 6.72, 96),
  new THREE.MeshStandardMaterial({ color: 0x9a762d, metalness: 0.9, roughness: 0.24 })
);
inset.rotation.x = -Math.PI / 2;
inset.position.y = -1.445;
scene.add(inset);

scene.add(new THREE.HemisphereLight(0x7b89b5, 0x21120d, 1.3));

const keyLight = new THREE.DirectionalLight(0xffe2aa, 4.1);
keyLight.position.set(5.5, 9, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -5;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0x81a8ff, 38, 16, 2);
fillLight.position.set(-5, 4.8, 4.5);
scene.add(fillLight);

const warmRim = new THREE.PointLight(0xffb94b, 42, 14, 2);
warmRim.position.set(3.8, 3.5, -4.6);
scene.add(warmRim);

const topGlow = new THREE.SpotLight(0xffe5b0, 480, 18, Math.PI / 7, 0.55, 1.4);
topGlow.position.set(0, 10, 4);
topGlow.target.position.set(0, 3, 0);
topGlow.castShadow = true;
topGlow.shadow.mapSize.set(1024, 1024);
scene.add(topGlow, topGlow.target);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
