<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cherry Blossom Shrine</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#f6dcec}
  canvas{display:block}
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   CONFIG & PALETTE  (spring pastel)
   ============================================================ */
const SEED = 796137;
const PAL = {
  fog: 0xf3dce8, vermilion: 0xd05038, vermDark: 0xa93b28,
  blossomA: 0xf7c6d9, blossomB: 0xf2aec9, blossomC: 0xfadbe6,
  stoneDark: 0x8e887d, woodLight: 0xb08a63, pondBed: 0x49695e,
  paper: 0xfff6ec, gold: 0xd9a441, glow: 0xffd9a0,
  koiOrange: 0xe8703a, koiWhite: 0xf4efe6, koiRed: 0xd8543a
};

/* ============================================================
   SEEDED PRNG & SMALL HELPERS
   ============================================================ */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(SEED);
const rr = (a, b) => a + rand() * (b - a);
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

// Create a mesh, position it and optionally attach it in one call.
function mesh(geo, mat, x = 0, y = 0, z = 0, parent = null) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (parent) parent.add(m);
  return m;
}
// Enable shadows on every mesh inside a group.
function shadowify(root) {
  root.traverse((o) => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
  return root;
}

// Hillside height field: flat forecourt in front, smooth rise to the
// shrine terrace at the back, gentle rolling noise away from the path,
// and a shallow scooped basin where the koi pond sits.
const POND = { x: 8.6, z: 7.6, r: 2.9 };
function groundHeight(x, z) {
  const t = THREE.MathUtils.clamp((4.5 - z) / 15, 0, 1);
  const hill = 5.2 * t * t * (3 - 2 * t);
  const noise = Math.sin(x * 0.34 + z * 0.21) * 0.35 + Math.sin(x * 0.13 - z * 0.41) * 0.3;
  const pathDamp = THREE.MathUtils.smoothstep(Math.abs(x), 1.9, 5.6);
  const pondDip = 1 - THREE.MathUtils.smoothstep(Math.hypot(x - POND.x, z - POND.z), POND.r + 0.4, POND.r + 2.2);
  return hill + noise * 0.55 * pathDamp * (1 - pondDip) - pondDip * 0.6;
}

/* ============================================================
   CANVAS TEXTURES (procedural surfaces)
   ============================================================ */
function makeTexture(size, draw, repeatX = 1, repeatY = 1) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeatX, repeatY);
  return tex;
}

// Pastel lawn dusted with fallen petals.
const grassTex = makeTexture(256, (ctx, s) => {
  ctx.fillStyle = '#a9cf96'; ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 900; i++) {
    ctx.fillStyle = pick(['#9cc489', '#b4d6a1', '#a2c98e', '#8fbc7e']);
    ctx.globalAlpha = rr(0.25, 0.7);
    ctx.fillRect(rand() * s, rand() * s, rr(2, 6), rr(2, 5));
  }
  for (let i = 0; i < 240; i++) {           // petal confetti on the grass
    ctx.fillStyle = pick(['#f7c6d9', '#f2aec9', '#fadbe6']);
    ctx.globalAlpha = rr(0.5, 0.95);
    ctx.beginPath();
    ctx.ellipse(rand() * s, rand() * s, rr(1.3, 3), rr(0.9, 1.8), rand() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}, 9, 9);

// Weathered granite for steps, lanterns and the pond rim.
const stoneTex = makeTexture(256, (ctx, s) => {
  ctx.fillStyle = '#b7b1a6'; ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 700; i++) {
    ctx.fillStyle = pick(['#aaa398', '#c2bcb1', '#9e978c', '#bfb9ad']);
    ctx.globalAlpha = rr(0.2, 0.6);
    ctx.fillRect(rand() * s, rand() * s, rr(2, 9), rr(2, 7));
  }
  ctx.globalAlpha = 0.5; ctx.strokeStyle = '#8e887d'; ctx.lineWidth = 1.4;
  for (let i = 0; i < 12; i++) {            // hairline cracks
    let x = rand() * s, y = rand() * s;
    ctx.beginPath(); ctx.moveTo(x, y);
    for (let k = 0; k < 4; k++) { x += rr(-24, 24); y += rr(-18, 24); ctx.lineTo(x, y); }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}, 2, 2);

// Warm cedar planks.
const woodTex = makeTexture(256, (ctx, s) => {
  ctx.fillStyle = '#8a6248'; ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 46; i++) {
    ctx.strokeStyle = pick(['#7a563e', '#9a7052', '#6e4d38', '#a0765a']);
    ctx.globalAlpha = rr(0.3, 0.8); ctx.lineWidth = rr(1, 3.2);
    const y = rand() * s;
    ctx.beginPath(); ctx.moveTo(0, y);
    ctx.bezierCurveTo(s * 0.3, y + rr(-7, 7), s * 0.7, y + rr(-7, 7), s, y + rr(-4, 4));
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}, 2, 1);

// Shoji panel: cream paper behind a dark timber lattice.
const shojiTex = makeTexture(256, (ctx, s) => {
  ctx.fillStyle = '#fdf3e3'; ctx.fillRect(0, 0, s, s);
  ctx.fillStyle = 'rgba(220,190,170,0.25)';
  for (let i = 0; i < 160; i++) ctx.fillRect(rand() * s, rand() * s, rr(2, 8), rr(2, 8));
  ctx.strokeStyle = '#5c4331'; ctx.lineWidth = 7;
  ctx.strokeRect(4, 4, s - 8, s - 8);
  ctx.lineWidth = 4;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo((s / 4) * i, 4); ctx.lineTo((s / 4) * i, s - 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, (s / 4) * i); ctx.lineTo(s - 4, (s / 4) * i); ctx.stroke();
  }
});

// Slate tile courses for the curved roof.
const roofTex = makeTexture(256, (ctx, s) => {
  ctx.fillStyle = '#5b6570'; ctx.fillRect(0, 0, s, s);
  for (let r = 0; r < 8; r++) {
    const y = (r + 1) * (s / 8);
    ctx.strokeStyle = '#454e58'; ctx.lineWidth = 3; ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(s, y); ctx.stroke();
    ctx.globalAlpha = 0.45; ctx.lineWidth = 2; ctx.strokeStyle = '#6d7883';
    for (let col = 0; col < 10; col++) {
      const x = (col + (r % 2 ? 0.5 : 0)) * (s / 10);
      ctx.beginPath(); ctx.moveTo(x, y - s / 8); ctx.lineTo(x, y); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}, 4, 2);

// Soft ripple rings for the pond surface.
const waterTex = makeTexture(256, (ctx, s) => {
  ctx.fillStyle = '#8fd0cc'; ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 26; i++) {
    ctx.strokeStyle = pick(['#a8dedb', '#7fc4bf', '#bde8e4']);
    ctx.globalAlpha = rr(0.15, 0.4); ctx.lineWidth = rr(1, 3);
    ctx.beginPath(); ctx.arc(rand() * s, rand() * s, rr(8, 40), 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
});
waterTex.center.set(0.5, 0.5);

/* ============================================================
   MATERIALS (single shared palette)
   ============================================================ */
const std = (opts) => new THREE.MeshStandardMaterial(opts);
const MAT = {
  grass: std({ map: grassTex, roughness: 1 }),
  stone: std({ map: stoneTex, roughness: 0.95 }),
  stoneDark: std({ color: PAL.stoneDark, roughness: 1 }),
  verm: std({ color: PAL.vermilion, roughness: 0.55 }),
  vermDark: std({ color: PAL.vermDark, roughness: 0.6 }),
  wood: std({ map: woodTex, roughness: 0.85 }),
  woodLight: std({ color: PAL.woodLight, roughness: 0.8 }),
  shoji: std({ map: shojiTex, roughness: 0.9 }),
  roof: std({ map: roofTex, roughness: 0.8, metalness: 0.05 }),
  trunk: std({ color: 0x6d5343, roughness: 1 }),
  water: std({ map: waterTex, transparent: true, opacity: 0.82, roughness: 0.25, metalness: 0.1 }),
  pondBed: std({ color: PAL.pondBed, roughness: 1 }),
  paper: std({ color: PAL.paper, roughness: 0.9, side: THREE.DoubleSide }),
  gold: std({ color: PAL.gold, roughness: 0.35, metalness: 0.7 }),
  rope: std({ color: 0xc9503c, roughness: 0.9 }),
  glow: std({ color: 0xfff0d0, emissive: PAL.glow, emissiveIntensity: 1.1, roughness: 0.6 }),
  petal: std({ color: PAL.blossomA, roughness: 0.85, side: THREE.DoubleSide }),
  blossoms: [PAL.blossomA, PAL.blossomB, PAL.blossomC].map((c) => std({ color: c, roughness: 0.9 })),
  koi: [PAL.koiOrange, PAL.koiWhite, PAL.koiRed].map((c) => std({ color: c, roughness: 0.5 }))
};

/* ============================================================
   RENDERER / SCENE / CAMERA / CONTROLS
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(PAL.fog, 34, 110);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 300);
camera.position.set(18.5, 12.5, 21.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.4, 3.0, -1.0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.minDistance = 16;
controls.maxDistance = 52;
controls.maxPolarAngle = 1.42;

/* ============================================================
   BUILDERS — every focal structure returns a THREE.Group
   ============================================================ */

// ---- Sky dome (pastel gradient, unaffected by fog) ----
function buildSky() {
  const g = new THREE.Group();
  const tex = makeTexture(256, (ctx, s) => {
    const grad = ctx.createLinearGradient(0, 0, 0, s);
    grad.addColorStop(0, '#8fb6e6'); grad.addColorStop(0.45, '#cfe0f2');
    grad.addColorStop(0.72, '#f3d3e2'); grad.addColorStop(1, '#fbe9ef');
    ctx.fillStyle = grad; ctx.fillRect(0, 0, s, s);
  });
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  g.add(new THREE.Mesh(new THREE.SphereGeometry(140, 32, 18),
    new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false })));
  return g;
}

// ---- Terrain: displaced plane using the shared height field ----
function buildTerrain() {
  const g = new THREE.Group();
  const geo = new THREE.PlaneGeometry(90, 90, 100, 100);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setY(i, groundHeight(pos.getX(i), pos.getZ(i)));
  geo.computeVertexNormals();
  const ground = new THREE.Mesh(geo, MAT.grass);
  ground.receiveShadow = true;
  g.add(ground);
  return g;
}

// ---- Vermilion torii gate with curved kasagi lintel ----
function buildToriiGate() {
  const g = new THREE.Group();
  const pillarGeo = new THREE.CylinderGeometry(0.22, 0.26, 4.4, 12);
  for (const sx of [-1, 1]) {
    const p = mesh(pillarGeo, MAT.verm, sx * 2.1, 2.2, 0, g);
    p.rotation.z = -sx * 0.045;               // classic inward lean
    mesh(new THREE.CylinderGeometry(0.34, 0.4, 0.3, 12), MAT.stoneDark, sx * 2.1, 0.15, 0, g);
  }
  const kasagiShape = new THREE.Shape();       // curved top beam profile
  kasagiShape.moveTo(-3.1, 0.34);
  kasagiShape.quadraticCurveTo(0, -0.2, 3.1, 0.34);
  kasagiShape.lineTo(3.1, 0.62);
  kasagiShape.quadraticCurveTo(0, 0.08, -3.1, 0.62);
  kasagiShape.closePath();
  const kasagiGeo = new THREE.ExtrudeGeometry(kasagiShape, { depth: 0.5, bevelEnabled: false });
  kasagiGeo.translate(0, 0, -0.25);
  mesh(kasagiGeo, MAT.vermDark, 0, 4.45, 0, g);
  mesh(new THREE.BoxGeometry(5.7, 0.26, 0.42), MAT.verm, 0, 4.4, 0, g);       // shimaki
  mesh(new THREE.BoxGeometry(5.3, 0.24, 0.3), MAT.verm, 0, 3.55, 0, g);       // nuki tie beam
  mesh(new THREE.BoxGeometry(0.28, 0.75, 0.24), MAT.vermDark, 0, 3.98, 0, g); // gakuzuka strut
  mesh(new THREE.BoxGeometry(0.5, 0.62, 0.08), MAT.gold, 0, 3.98, 0.16, g);   // name plaque
  return shadowify(g);
}

// ---- Stone stairway climbing the hillside ----
function buildStoneSteps() {
  const g = new THREE.Group();
  const stepCount = 14;
  const steps = new THREE.InstancedMesh(new THREE.BoxGeometry(3.7, 1.15, 0.85), MAT.stone, stepCount);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < stepCount; i++) {
    const top = 0.28 + (i / (stepCount - 1)) * 4.62;
    dummy.position.set(0, top - 0.575, 3.4 - i * 0.8);
    dummy.updateMatrix();
    steps.setMatrixAt(i, dummy.matrix);
  }
  steps.castShadow = steps.receiveShadow = true;
  g.add(steps);
  for (const sx of [-1, 1]) {                 // low flanking curbs follow the slope
    const curb = mesh(new THREE.BoxGeometry(0.3, 0.34, 11.6), MAT.stoneDark, sx * 1.98, 2.45, -1.75, g);
    curb.rotation.x = -0.395;
    curb.castShadow = curb.receiveShadow = true;
  }
  return g;
}

// ---- Flat stone slabs (approach path + terrace landing) ----
function buildPathSlabs() {
  const g = new THREE.Group();
  const spots = [[0, 6.2], [0.15, 5.3], [-0.1, 4.4], [0, -7.65], [0.1, -8.3]];
  const slabs = new THREE.InstancedMesh(new THREE.BoxGeometry(2.0, 0.14, 0.72), MAT.stone, spots.length);
  const dummy = new THREE.Object3D();
  spots.forEach(([x, z], i) => {
    dummy.position.set(x, groundHeight(x, z) + 0.05, z);
    dummy.rotation.set(0, rr(-0.1, 0.1), 0);
    dummy.updateMatrix();
    slabs.setMatrixAt(i, dummy.matrix);
  });
  slabs.castShadow = slabs.receiveShadow = true;
  g.add(slabs);
  return g;
}

// ---- Stone lantern (toro) with glowing firebox ----
const lanternGlowMats = [];
function buildStoneLantern() {
  const g = new THREE.Group();
  mesh(new THREE.BoxGeometry(0.92, 0.26, 0.92), MAT.stone, 0, 0.13, 0, g);          // base
  mesh(new THREE.CylinderGeometry(0.13, 0.17, 0.92, 8), MAT.stone, 0, 0.72, 0, g);  // pedestal
  mesh(new THREE.BoxGeometry(0.62, 0.15, 0.62), MAT.stone, 0, 1.24, 0, g);          // platform
  mesh(new THREE.BoxGeometry(0.5, 0.46, 0.5), MAT.stoneDark, 0, 1.55, 0, g);        // firebox
  const glowMat = MAT.glow.clone();
  lanternGlowMats.push(glowMat);
  for (let k = 0; k < 4; k++) {               // warm windows on all faces
    const w = mesh(new THREE.PlaneGeometry(0.26, 0.24), glowMat, 0, 1.55, 0, g);
    w.rotation.y = k * Math.PI / 2;
    w.translateZ(0.253);
  }
  const roof = mesh(new THREE.ConeGeometry(0.58, 0.42, 4), MAT.stone, 0, 1.99, 0, g);
  roof.rotation.y = Math.PI / 4;
  mesh(new THREE.SphereGeometry(0.1, 10, 8), MAT.stone, 0, 2.26, 0, g);             // jewel finial
  return shadowify(g);
}

// ---- Curved-eave roof geometry shared by the shrine hall ----
function curvedRoofGeometry(halfDepth, rise, thick, width) {
  const s = new THREE.Shape();
  s.moveTo(-halfDepth, 0);
  s.quadraticCurveTo(-halfDepth * 0.42, rise * 0.16, 0, rise);
  s.quadraticCurveTo(halfDepth * 0.42, rise * 0.16, halfDepth, 0);
  s.lineTo(halfDepth, thick);
  s.quadraticCurveTo(halfDepth * 0.42, rise * 0.16 + thick, 0, rise + thick);
  s.quadraticCurveTo(-halfDepth * 0.42, rise * 0.16 + thick, -halfDepth, thick);
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: width, bevelEnabled: false });
  geo.translate(0, 0, -width / 2);
  geo.rotateY(Math.PI / 2);                   // ridge runs along X
  return geo;
}

// ---- Shrine hall: stone terrace, timber frame, shoji, rope bell ----
let bellRig = null;
function buildShrineHall() {
  const g = new THREE.Group();
  mesh(new THREE.BoxGeometry(7.6, 0.9, 5.6), MAT.stone, 0, 0.45, 0, g);       // terrace
  mesh(new THREE.BoxGeometry(6.2, 0.28, 4.4), MAT.wood, 0, 1.04, 0, g);       // deck
  const postGeo = new THREE.CylinderGeometry(0.14, 0.16, 2.5, 10);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) mesh(postGeo, MAT.verm, sx * 2.6, 2.43, sz * 1.7, g);
  mesh(new THREE.BoxGeometry(5.9, 0.24, 0.26), MAT.vermDark, 0, 3.62, 1.7, g);   // front beam
  mesh(new THREE.BoxGeometry(5.9, 0.24, 0.26), MAT.vermDark, 0, 3.62, -1.7, g);  // rear beam
  mesh(new THREE.BoxGeometry(5.2, 2.3, 0.14), MAT.shoji, 0, 2.35, -1.6, g);      // back wall
  for (const sx of [-1, 1]) {
    mesh(new THREE.BoxGeometry(0.14, 2.3, 3.2), MAT.shoji, sx * 2.55, 2.35, 0, g);   // side wall
    mesh(new THREE.BoxGeometry(1.7, 2.3, 0.12), MAT.shoji, sx * 1.75, 2.35, 1.62, g); // front shoji
  }
  mesh(curvedRoofGeometry(3.5, 1.6, 0.22, 7.4), MAT.roof, 0, 3.75, 0, g);     // curved slate roof
  mesh(new THREE.BoxGeometry(7.5, 0.24, 0.5), MAT.vermDark, 0, 5.45, 0, g);   // ridge beam
  for (const sx of [-1, 1]) mesh(new THREE.BoxGeometry(0.3, 0.5, 0.4), MAT.gold, sx * 3.6, 5.55, 0, g);
  // Rope bell rig hanging over the offering step
  bellRig = new THREE.Group();
  bellRig.position.set(0, 3.9, 1.95);
  mesh(new THREE.CylinderGeometry(0.05, 0.07, 1.7, 8), MAT.rope, 0, -0.85, 0, bellRig);
  mesh(new THREE.BoxGeometry(0.34, 0.5, 0.05), MAT.paper, 0, -1.35, 0, bellRig);
  const bell = mesh(new THREE.SphereGeometry(0.3, 14, 12), MAT.gold, 0, -1.95, 0, bellRig);
  bell.scale.set(1, 0.85, 1);
  mesh(new THREE.BoxGeometry(0.34, 0.06, 0.1), MAT.vermDark, 0, -2.14, 0, bellRig);
  g.add(bellRig);
  return shadowify(g);
}

// ---- Offering box in front of the hall ----
function buildOfferingBox() {
  const g = new THREE.Group();
  mesh(new THREE.BoxGeometry(1.25, 0.6, 0.8), MAT.wood, 0, 0.42, 0, g);
  for (let i = 0; i < 4; i++) mesh(new THREE.BoxGeometry(1.2, 0.07, 0.1), MAT.woodLight, 0, 0.76, -0.27 + i * 0.18, g);
  for (const sx of [-1, 1]) mesh(new THREE.BoxGeometry(0.14, 0.24, 0.7), MAT.wood, sx * 0.48, 0.12, 0, g);
  return shadowify(g);
}

// ---- Koi pond: stone rim, tinted water, koi trio, floating petals ----
const koiFish = [];
let pondPetals = null;
function buildKoiPond() {
  const g = new THREE.Group();
  const bed = mesh(new THREE.CircleGeometry(2.75, 36), MAT.pondBed, 0, -0.5, 0, g);
  bed.rotation.x = -Math.PI / 2;
  const water = mesh(new THREE.CircleGeometry(2.62, 40), MAT.water, 0, -0.06, 0, g);
  water.rotation.x = -Math.PI / 2;
  water.receiveShadow = true;
  const rimCount = 16;                        // ring of rim boulders
  const rim = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(0.36, 0), MAT.stone, rimCount);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < rimCount; i++) {
    const a = (i / rimCount) * Math.PI * 2 + rr(-0.08, 0.08);
    dummy.position.set(Math.cos(a) * 2.78, 0.02, Math.sin(a) * 2.78);
    dummy.rotation.set(rand() * Math.PI, rand() * Math.PI, rand() * Math.PI);
    dummy.scale.setScalar(rr(0.75, 1.25));
    dummy.updateMatrix();
    rim.setMatrixAt(i, dummy.matrix);
  }
  rim.castShadow = rim.receiveShadow = true;
  g.add(rim);
  for (let i = 0; i < 3; i++) {               // koi built facing +Z, steered in the loop
    const fish = new THREE.Group();
    const bodyGeo = new THREE.CapsuleGeometry(0.11, 0.34, 4, 10);
    bodyGeo.rotateX(Math.PI / 2);
    mesh(bodyGeo, MAT.koi[i], 0, 0, 0, fish).scale.y = 0.75;
    const tailGeo = new THREE.ConeGeometry(0.1, 0.26, 6);
    tailGeo.rotateX(-Math.PI / 2);
    mesh(tailGeo, MAT.koi[i], 0, 0, -0.34, fish);
    fish.position.y = -0.26;
    koiFish.push({ node: fish, r: rr(1.35, 1.95), speed: rr(0.25, 0.45) * pick([-1, 1]), phase: rr(0, Math.PI * 2) });
    g.add(fish);
  }
  pondPetals = new THREE.Group();             // petals resting on the surface
  const pp = new THREE.InstancedMesh(new THREE.CircleGeometry(0.06, 6), MAT.petal, 40);
  for (let i = 0; i < 40; i++) {
    const a = rand() * Math.PI * 2, r = Math.sqrt(rand()) * 2.4;
    dummy.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
    dummy.rotation.set(-Math.PI / 2, 0, rand() * Math.PI * 2);
    dummy.scale.setScalar(rr(0.7, 1.3));
    dummy.updateMatrix();
    pp.setMatrixAt(i, dummy.matrix);
  }
  pondPetals.add(pp);
  pondPetals.position.y = 0.02;
  g.add(pondPetals);
  return g;
}

// ---- Wooden resting bench ----
function buildBench() {
  const g = new THREE.Group();
  for (let i = 0; i < 3; i++) mesh(new THREE.BoxGeometry(2.1, 0.07, 0.17), MAT.woodLight, 0, 0.55, -0.18 + i * 0.18, g);
  for (const sx of [-1, 1]) {
    mesh(new THREE.BoxGeometry(0.16, 0.55, 0.52), MAT.wood, sx * 0.85, 0.27, 0, g);
    mesh(new THREE.BoxGeometry(0.12, 0.62, 0.12), MAT.wood, sx * 0.85, 0.86, -0.24, g);
  }
  mesh(new THREE.BoxGeometry(2.1, 0.24, 0.07), MAT.woodLight, 0, 1.05, -0.26, g);
  return shadowify(g);
}

// ---- Cherry tree: gnarled trunk + pastel blossom canopy ----
const swayTrees = [];
function buildCherryTree(scale) {
  const g = new THREE.Group();
  const trunkH = 2.7 * scale;
  const trunk = mesh(new THREE.CylinderGeometry(0.14 * scale, 0.24 * scale, trunkH, 8), MAT.trunk, 0, trunkH / 2, 0, g);
  trunk.rotation.z = rr(-0.08, 0.08);
  for (let b = 0; b < 3; b++) {
    const len = rr(1.1, 1.7) * scale;
    const a = rr(0, Math.PI * 2);
    const branch = mesh(new THREE.CylinderGeometry(0.05 * scale, 0.09 * scale, len, 6), MAT.trunk,
      Math.cos(a) * 0.5 * scale, trunkH * rr(0.78, 0.95), Math.sin(a) * 0.5 * scale, g);
    branch.rotation.set(Math.sin(a) * rr(0.5, 0.9), 0, Math.cos(a) * rr(0.5, 0.9));
  }
  const canopy = new THREE.Group();
  canopy.position.y = trunkH * 0.98;
  const puffGeo = new THREE.IcosahedronGeometry(1, 1);
  for (let p = 0; p < 7; p++) {
    const a = (p / 7) * Math.PI * 2 + rr(-0.4, 0.4);
    const rad = p === 0 ? 0 : rr(0.8, 1.7) * scale;
    const puff = mesh(puffGeo, pick(MAT.blossoms), Math.cos(a) * rad, rr(-0.15, 0.75) * scale, Math.sin(a) * rad, canopy);
    puff.scale.set(rr(0.9, 1.5) * scale, rr(0.7, 1.05) * scale, rr(0.9, 1.5) * scale);
    puff.rotation.set(rand() * Math.PI, rand() * Math.PI, rand() * Math.PI);
  }
  g.add(canopy);
  swayTrees.push({ canopy, phase: rr(0, Math.PI * 2) });
  return shadowify(g);
}

// ---- Paper fortunes (omikuji) knotted beneath a tree's branches ----
const fortuneStrips = [];
function buildFortuneStrips(scale) {
  const g = new THREE.Group();
  const stripGeo = new THREE.PlaneGeometry(0.13, 0.4);
  stripGeo.translate(0, -0.2, 0);             // pivot at the tied top edge
  for (let i = 0; i < 22; i++) {
    const a = rr(0, Math.PI * 2);
    const strip = mesh(stripGeo, MAT.paper, Math.cos(a) * rr(0.7, 1.9) * scale, rr(2.0, 2.75) * scale, Math.sin(a) * rr(0.7, 1.9) * scale, g);
    strip.rotation.y = rr(0, Math.PI * 2);
    strip.castShadow = true;
    fortuneStrips.push({ node: strip, phase: rr(0, Math.PI * 2), baseY: strip.rotation.y });
  }
  return g;
}

// ---- Mossy boulders scattered around the grounds ----
function buildRocks() {
  const g = new THREE.Group();
  const spots = [[-5.6, 8.6], [12.2, 3.4], [-9.4, -2.2], [10.6, -8.4], [-3.4, 12.4], [4.9, 11.8], [-11.8, -8.8], [12.8, -1.6]];
  const rocks = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(0.5, 0), MAT.stoneDark, spots.length);
  const dummy = new THREE.Object3D();
  spots.forEach(([x, z], i) => {
    dummy.position.set(x, groundHeight(x, z) + 0.1, z);
    dummy.rotation.set(rand() * Math.PI, rand() * Math.PI, rand() * Math.PI);
    dummy.scale.set(rr(0.7, 1.7), rr(0.5, 1.1), rr(0.7, 1.7));
    dummy.updateMatrix();
    rocks.setMatrixAt(i, dummy.matrix);
  });
  rocks.castShadow = rocks.receiveShadow = true;
  g.add(rocks);
  return g;
}

/* ============================================================
   ASSEMBLY & LAYOUT
   ============================================================ */
const placeOnGround = (obj, x, z, lift = 0, ry = 0) => {
  obj.position.set(x, groundHeight(x, z) + lift, z);
  obj.rotation.y = ry;
  scene.add(obj);
  return obj;
};

scene.add(buildSky(), buildTerrain(), buildStoneSteps(), buildPathSlabs(), buildRocks());
placeOnGround(buildToriiGate(), 0, 6.9, -0.05);

// Lantern pairs flanking the climb
const lanternSpots = [[-2.75, 3.1], [2.75, 3.1], [-2.75, -0.6], [2.75, -0.6], [-2.75, -4.2], [2.75, -4.2]];
for (const [lx, lz] of lanternSpots) placeOnGround(buildStoneLantern(), lx, lz, -0.06);

// Shrine hall on the hilltop terrace, offering box at its step
placeOnGround(buildShrineHall(), 0, -11.2, -0.15);
placeOnGround(buildOfferingBox(), 0, -8.85, 0);

// Koi pond + bench resting spot in the forecourt
const pond = buildKoiPond();
pond.position.set(POND.x, -0.02, POND.z);
scene.add(pond);
placeOnGround(buildBench(), 4.9, 8.9, 0.02, Math.PI / 3.2);

// Cherry grove: pink canopies leaning over path, pond and shrine
const treeSpots = [
  [-4.4, 1.6, 1.3], [4.5, -2.6, 1.25], [-7.2, -5.8, 1.1], [7.8, -7.6, 1.05],
  [-5.2, -11.6, 1.2], [5.6, -12.4, 1.15], [-8.6, 5.2, 1.0], [11.9, 8.9, 0.95],
  [-11.4, -0.8, 0.9], [2.9, 12.6, 1.0]
];
for (const [tx, tz, ts] of treeSpots) placeOnGround(buildCherryTree(ts), tx, tz, -0.08, rr(0, Math.PI * 2));

// Fortune papers hang from the tree beside the first lantern pair
placeOnGround(buildFortuneStrips(treeSpots[0][2]), treeSpots[0][0], treeSpots[0][1], -0.08);

/* ============================================================
   FALLING BLOSSOM PETALS (instanced, endlessly looping)
   ============================================================ */
const PETAL_COUNT = 240;
const petalMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.1, 0.15), MAT.petal, PETAL_COUNT);
petalMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
petalMesh.frustumCulled = false;
const petalData = [];
for (let i = 0; i < PETAL_COUNT; i++) {
  const bx = rr(-13, 13), bz = rr(-14, 12);
  petalData.push({
    bx, bz, minY: groundHeight(bx, bz) + 0.15,
    span: rr(8, 12.5), speed: rr(0.35, 0.8), off: rr(0, 40),
    swayA: rr(0.4, 1.1), swayF: rr(0.5, 1.1),
    rotA: rr(0.6, 2.0), rotB: rr(0.6, 2.0),
    phase: rr(0, Math.PI * 2), scale: rr(0.7, 1.4)
  });
}
scene.add(petalMesh);

/* ============================================================
   LIGHTING RIG
   ============================================================ */
const sun = new THREE.DirectionalLight(0xfff1dc, 1.3);
sun.position.set(22, 30, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 4, far: 80 });
sun.shadow.bias = -0.0006;
sun.target.position.set(0, 2, -2);
scene.add(sun, sun.target);

scene.add(new THREE.HemisphereLight(0xbcd8f5, 0xe9cbd6, 0.55));
scene.add(new THREE.AmbientLight(0xfff0f4, 0.16));

// Warm accents: the first lantern pair and the hall interior
const accentLights = [];
for (const [lx, lz] of [lanternSpots[0], lanternSpots[1]]) {
  const pl = new THREE.PointLight(PAL.glow, 5.5, 8, 2);
  pl.position.set(lx, groundHeight(lx, lz) + 1.6, lz);
  accentLights.push(pl);
  scene.add(pl);
}
const hallLight = new THREE.PointLight(0xffc98e, 6, 9, 2);
hallLight.position.set(0, groundHeight(0, -11.2) + 2.4, -10.6);
accentLights.push(hallLight);
scene.add(hallLight);

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
const clock = new THREE.Clock();
const dummyPetal = new THREE.Object3D();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // 1) Blossoms drifting down like snow
  for (let i = 0; i < PETAL_COUNT; i++) {
    const p = petalData[i];
    const fall = (t * p.speed + p.off) % p.span;
    dummyPetal.position.set(
      p.bx + Math.sin(t * p.swayF + p.phase) * p.swayA,
      p.minY + (p.span - fall),
      p.bz + Math.cos(t * p.swayF * 0.8 + p.phase) * p.swayA * 0.7
    );
    dummyPetal.rotation.set(t * p.rotA + p.phase, t * p.rotB, p.phase * 2);
    dummyPetal.scale.setScalar(p.scale);
    dummyPetal.updateMatrix();
    petalMesh.setMatrixAt(i, dummyPetal.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate = true;

  // 2) Koi gliding in lazy circles beneath the surface
  for (const k of koiFish) {
    const a = t * k.speed + k.phase;
    k.node.position.set(Math.cos(a) * k.r, -0.26 + Math.sin(t * 1.3 + k.phase) * 0.03, Math.sin(a) * k.r);
    k.node.rotation.y = (k.speed >= 0 ? -a : -a + Math.PI) + Math.sin(t * 5 + k.phase) * 0.09;
  }

  // 3) Petals swirling on the pond + drifting ripple texture
  pondPetals.rotation.y = t * 0.045;
  waterTex.rotation = t * 0.02;

  // 4) Rope bell swaying at the shrine eave
  bellRig.rotation.z = Math.sin(t * 0.9) * 0.055;
  bellRig.rotation.x = Math.sin(t * 0.63 + 1.2) * 0.04;

  // 5) Paper fortunes fluttering on their knots
  for (const f of fortuneStrips) {
    f.node.rotation.z = Math.sin(t * 2.1 + f.phase) * 0.22;
    f.node.rotation.y = f.baseY + Math.sin(t * 1.4 + f.phase) * 0.3;
  }

  // 6) Blossom canopies breathing in the breeze
  for (const s of swayTrees) {
    s.canopy.rotation.z = Math.sin(t * 0.7 + s.phase) * 0.02;
    s.canopy.rotation.x = Math.cos(t * 0.55 + s.phase) * 0.016;
  }

  // 7) Lantern glow flicker
  lanternGlowMats.forEach((m, i) => { m.emissiveIntensity = 1.1 + Math.sin(t * 3.1 + i * 1.7) * 0.18; });
  accentLights.forEach((l, i) => { l.intensity = (i === 2 ? 6 : 5.5) + Math.sin(t * 2.7 + i * 2.1) * 0.5; });

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ============================================================
   RESIZE
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
