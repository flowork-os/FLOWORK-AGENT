<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plush Narwhal</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #e9e4dc; }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e4dc);
scene.fog = new THREE.Fog(0xe9e4dc, 13, 23);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(-0.4, 2.4, 9.4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.25, 0.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 6;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.72;

scene.add(new THREE.HemisphereLight(0xfffaf2, 0x77819a, 2.2));

const key = new THREE.DirectionalLight(0xffead7, 4.1);
key.position.set(-4, 7, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -5;
key.shadow.camera.near = 1;
key.shadow.camera.far = 20;
key.shadow.bias = -0.0002;
scene.add(key);

const rim = new THREE.DirectionalLight(0xb9c9ff, 2.2);
rim.position.set(5, 3, -5);
scene.add(rim);

const narwhal = new THREE.Group();
narwhal.position.set(-0.15, 0.35, 0);
narwhal.rotation.y = -0.04;
scene.add(narwhal);

const fleece = new THREE.MeshStandardMaterial({
  color: 0x7f91d2,
  roughness: 0.94,
  metalness: 0,
  bumpScale: 0.02
});
const fleeceLight = new THREE.MeshStandardMaterial({
  color: 0x91a1dc,
  roughness: 0.96,
  metalness: 0
});
const fleeceDark = new THREE.MeshStandardMaterial({
  color: 0x6779ba,
  roughness: 0.96,
  metalness: 0
});
const cream = new THREE.MeshStandardMaterial({
  color: 0xf4e5c4,
  roughness: 0.95,
  metalness: 0
});
const ivory = new THREE.MeshStandardMaterial({
  color: 0xf2e8cf,
  roughness: 0.82,
  metalness: 0
});
const ivoryRidge = new THREE.MeshStandardMaterial({
  color: 0xd5c39f,
  roughness: 0.9,
  metalness: 0
});
const stitchMat = new THREE.MeshStandardMaterial({
  color: 0x5668a5,
  roughness: 0.72
});
const creamStitchMat = new THREE.MeshStandardMaterial({
  color: 0xd8c49a,
  roughness: 0.75
});
const cheekMat = new THREE.MeshStandardMaterial({
  color: 0xeaa4ae,
  roughness: 1
});
const buttonMat = new THREE.MeshPhysicalMaterial({
  color: 0x08090d,
  roughness: 0.18,
  metalness: 0.08,
  clearcoat: 1,
  clearcoatRoughness: 0.12
});

function finishMesh(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const bodyGeo = new THREE.SphereGeometry(1, 72, 48);
const body = finishMesh(new THREE.Mesh(bodyGeo, fleece));
body.scale.set(2.35, 1.18, 1.05);
body.position.set(0, 0.12, 0);
narwhal.add(body);

const snout = finishMesh(new THREE.Mesh(new THREE.SphereGeometry(1, 56, 36), fleeceLight));
snout.scale.set(1.12, 0.98, 0.94);
snout.position.set(-1.72, 0.17, 0.03);
narwhal.add(snout);

const bellyShape = new THREE.Shape();
bellyShape.moveTo(-1.75, -0.18);
bellyShape.bezierCurveTo(-1.5, -0.84, -0.85, -1.02, 0.05, -1.01);
bellyShape.bezierCurveTo(0.98, -1.00, 1.66, -0.65, 1.84, -0.15);
bellyShape.bezierCurveTo(1.2, -0.35, 0.58, -0.43, -0.02, -0.43);
bellyShape.bezierCurveTo(-0.68, -0.43, -1.3, -0.35, -1.75, -0.18);
const bellyGeo = new THREE.ExtrudeGeometry(bellyShape, {
  depth: 0.035,
  bevelEnabled: true,
  bevelSize: 0.055,
  bevelThickness: 0.025,
  bevelSegments: 3,
  curveSegments: 32
});
bellyGeo.center();
const belly = finishMesh(new THREE.Mesh(bellyGeo, cream));
belly.position.set(-0.05, -0.15, 1.005);
belly.scale.set(0.93, 0.94, 1);
narwhal.add(belly);

function tubeFromPoints(points, radius, material, tubularSegments = 64, radialSegments = 7, closed = false) {
  const curve = new THREE.CatmullRomCurve3(points, closed, 'centripetal');
  return finishMesh(new THREE.Mesh(
    new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, closed),
    material
  ));
}

const bellyBorder = [];
for (let i = 0; i <= 64; i++) {
  const a = i / 64 * Math.PI * 2;
  const rx = 1.72;
  const ry = 0.37;
  bellyBorder.push(new THREE.Vector3(
    -0.04 + Math.cos(a) * rx,
    -0.55 + Math.sin(a) * ry,
    1.055
  ));
}
const bellyPiping = tubeFromPoints(bellyBorder, 0.018, creamStitchMat, 96, 6, true);
narwhal.add(bellyPiping);

for (let i = 0; i < 34; i++) {
  const a = i / 34 * Math.PI * 2;
  const center = new THREE.Vector3(
    -0.04 + Math.cos(a) * 1.72,
    -0.55 + Math.sin(a) * 0.37,
    1.078
  );
  const tangent = new THREE.Vector3(
    -Math.sin(a) * 1.72,
    Math.cos(a) * 0.37,
    0
  ).normalize();
  const normal = new THREE.Vector3(-tangent.y, tangent.x, 0);
  const stitch = tubeFromPoints([
    center.clone().addScaledVector(normal, -0.045),
    center.clone().addScaledVector(normal, 0.045)
  ], 0.011, creamStitchMat, 3, 5);
  narwhal.add(stitch);
}

const spinePoints = [];
for (let i = 0; i <= 36; i++) {
  const x = -1.9 + i / 36 * 3.75;
  const normalized = x / 2.35;
  const y = 0.16 + 1.18 * Math.sqrt(Math.max(0.01, 1 - normalized * normalized));
  spinePoints.push(new THREE.Vector3(x, y + 0.015, 0.005));
}
narwhal.add(tubeFromPoints(spinePoints, 0.022, stitchMat, 100, 6));

for (let i = 0; i < 23; i++) {
  const x = -1.78 + i * 0.154;
  const normalized = x / 2.35;
  const y = 0.16 + 1.18 * Math.sqrt(Math.max(0.02, 1 - normalized * normalized));
  const stitch = tubeFromPoints([
    new THREE.Vector3(x, y + 0.025, -0.085),
    new THREE.Vector3(x, y + 0.035, 0.085)
  ], 0.013, stitchMat, 3, 5);
  narwhal.add(stitch);
}

const tailRoot = finishMesh(new THREE.Mesh(new THREE.SphereGeometry(1, 36, 24), fleeceDark));
tailRoot.scale.set(0.76, 0.47, 0.52);
tailRoot.position.set(2.12, 0.13, -0.02);
narwhal.add(tailRoot);

function makeFluke(sign) {
  const shape = new THREE.Shape();
  shape.moveTo(2.25, 0.12);
  shape.bezierCurveTo(2.67, 0.15, 3.22, 0.25 * sign, 3.76, 0.88 * sign);
  shape.bezierCurveTo(3.95, 1.13 * sign, 3.77, 1.34 * sign, 3.43, 1.20 * sign);
  shape.bezierCurveTo(2.90, 1.00 * sign, 2.54, 0.61 * sign, 2.25, 0.12);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: 0.12,
    bevelEnabled: true,
    bevelSegments: 4,
    bevelSize: 0.055,
    bevelThickness: 0.045,
    curveSegments: 30
  });
  const mesh = finishMesh(new THREE.Mesh(geo, fleeceLight));
  mesh.position.z = -0.06;
  narwhal.add(mesh);

  const edge = [
    new THREE.Vector3(2.27, 0.12, 0.085),
    new THREE.Vector3(2.82, 0.30 * sign, 0.085),
    new THREE.Vector3(3.46, 1.15 * sign, 0.085),
    new THREE.Vector3(3.79, 1.15 * sign, 0.085),
    new THREE.Vector3(3.56, 0.77 * sign, 0.085),
    new THREE.Vector3(2.76, 0.27 * sign, 0.085),
    new THREE.Vector3(2.27, 0.12, 0.085)
  ];
  narwhal.add(tubeFromPoints(edge, 0.022, stitchMat, 65, 6));

  const inner = [
    new THREE.Vector3(2.64, 0.22 * sign, 0.092),
    new THREE.Vector3(3.03, 0.48 * sign, 0.092),
    new THREE.Vector3(3.48, 0.93 * sign, 0.092)
  ];
  narwhal.add(tubeFromPoints(inner, 0.014, stitchMat, 35, 5));
}
makeFluke(1);
makeFluke(-1);

const flipperShape = new THREE.Shape();
flipperShape.moveTo(-0.25, -0.3);
flipperShape.bezierCurveTo(0.05, -0.65, 0.12, -1.42, -0.22, -1.72);
flipperShape.bezierCurveTo(-0.5, -1.9, -0.74, -1.57, -0.71, -1.18);
flipperShape.bezierCurveTo(-0.67, -0.76, -0.52, -0.43, -0.25, -0.3);
const flipperGeo = new THREE.ExtrudeGeometry(flipperShape, {
  depth: 0.18,
  bevelEnabled: true,
  bevelSize: 0.07,
  bevelThickness: 0.055,
  bevelSegments: 4,
  curveSegments: 30
});
const flipper = finishMesh(new THREE.Mesh(flipperGeo, fleeceLight));
flipper.position.set(0.06, 0.08, 0.74);
flipper.rotation.z = -0.25;
flipper.rotation.y = -0.15;
narwhal.add(flipper);

const flipperSeam = [
  new THREE.Vector3(-0.22, -0.35, 0.99),
  new THREE.Vector3(-0.42, -0.75, 1.02),
  new THREE.Vector3(-0.55, -1.29, 1.02),
  new THREE.Vector3(-0.26, -1.63, 1.02)
];
narwhal.add(tubeFromPoints(flipperSeam, 0.016, stitchMat, 45, 5));

function makeFaceSide(zSign) {
  const z = zSign * 0.88;
  const eye = finishMesh(new THREE.Mesh(new THREE.SphereGeometry(0.18, 32, 20), buttonMat));
  eye.scale.set(1, 1, 0.42);
  eye.position.set(-1.7, 0.48, z);
  narwhal.add(eye);

  const shank = finishMesh(new THREE.Mesh(
    new THREE.CylinderGeometry(0.065, 0.065, 0.09, 18),
    buttonMat
  ));
  shank.rotation.x = Math.PI / 2;
  shank.position.set(-1.7, 0.48, z - zSign * 0.09);
  narwhal.add(shank);

  const cheek = finishMesh(new THREE.Mesh(
    new THREE.CylinderGeometry(0.22, 0.22, 0.035, 40),
    cheekMat
  ));
  cheek.rotation.x = Math.PI / 2;
  cheek.position.set(-1.52, 0.03, zSign * 0.965);
  narwhal.add(cheek);
}
makeFaceSide(1);
makeFaceSide(-1);

const mouth = tubeFromPoints([
  new THREE.Vector3(-2.05, -0.12, 0.924),
  new THREE.Vector3(-1.96, -0.18, 0.956),
  new THREE.Vector3(-1.86, -0.12, 0.94)
], 0.018, stitchMat, 24, 6);
narwhal.add(mouth);

const tusk = finishMesh(new THREE.Mesh(
  new THREE.ConeGeometry(0.31, 1.9, 48, 20, false),
  ivory
));
tusk.rotation.z = Math.PI / 2;
tusk.position.set(-2.82, 0.56, 0);
narwhal.add(tusk);

const tuskSpiral = [];
const turns = 4.7;
for (let i = 0; i <= 150; i++) {
  const t = i / 150;
  const x = -2.0 - t * 1.72;
  const radius = 0.292 * (1 - t) + 0.015;
  const angle = t * turns * Math.PI * 2;
  tuskSpiral.push(new THREE.Vector3(
    x,
    0.56 + Math.cos(angle) * radius,
    Math.sin(angle) * radius
  ));
}
narwhal.add(tubeFromPoints(tuskSpiral, 0.032, ivoryRidge, 180, 7));

const tuskBase = finishMesh(new THREE.Mesh(
  new THREE.TorusGeometry(0.31, 0.045, 10, 48),
  ivoryRidge
));
tuskBase.rotation.y = Math.PI / 2;
tuskBase.position.set(-1.94, 0.56, 0);
narwhal.add(tuskBase);

const fiberPositions = [];
const fiberColors = [];
const rng = (() => {
  let seed = 72631;
  return () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };
})();

for (let i = 0; i < 260; i++) {
  const u = rng() * Math.PI * 2;
  const v = Math.acos(2 * rng() - 1);
  const nx = Math.sin(v) * Math.cos(u);
  const ny = Math.cos(v);
  const nz = Math.sin(v) * Math.sin(u);
  if (nz < -0.45) continue;
  const p = new THREE.Vector3(
    nx * 2.34,
    0.12 + ny * 1.17,
    nz * 1.045
  );
  const n = new THREE.Vector3(nx / 2.34, ny / 1.17, nz / 1.045).normalize();
  const tangent = new THREE.Vector3(-n.y, n.x, 0.2 * (rng() - 0.5)).normalize();
  const length = 0.025 + rng() * 0.035;
  fiberPositions.push(
    p.x - tangent.x * length, p.y - tangent.y * length, p.z - tangent.z * length,
    p.x + tangent.x * length, p.y + tangent.y * length, p.z + tangent.z * length
  );
  const brightness = 0.72 + rng() * 0.18;
  fiberColors.push(
    brightness * 0.62, brightness * 0.68, brightness,
    brightness * 0.62, brightness * 0.68, brightness
  );
}
const fibersGeo = new THREE.BufferGeometry();
fibersGeo.setAttribute('position', new THREE.Float32BufferAttribute(fiberPositions, 3));
fibersGeo.setAttribute('color', new THREE.Float32BufferAttribute(fiberColors, 3));
const fibers = new THREE.LineSegments(fibersGeo, new THREE.LineBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.36
}));
narwhal.add(fibers);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(10, 96),
  new THREE.MeshStandardMaterial({
    color: 0xe4ddd3,
    roughness: 1,
    metalness: 0
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.83;
floor.receiveShadow = true;
scene.add(floor);

const shadowDisc = new THREE.Mesh(
  new THREE.CircleGeometry(3.35, 64),
  new THREE.MeshBasicMaterial({
    color: 0x7f7b80,
    transparent: true,
    opacity: 0.085,
    depthWrite: false
  })
);
shadowDisc.rotation.x = -Math.PI / 2;
shadowDisc.scale.set(1, 0.35, 1);
shadowDisc.position.set(0.25, -1.815, 0.25);
scene.add(shadowDisc);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
