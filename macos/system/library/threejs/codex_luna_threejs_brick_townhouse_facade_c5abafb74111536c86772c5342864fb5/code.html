<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Brick Townhouse Facade</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #17191b;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .label {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(255, 245, 225, 0.7);
      font: 11px/1.4 Georgia, serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Brick townhouse · dusk study</div>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x17191b);
    scene.fog = new THREE.Fog(0x17191b, 24, 42);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(13, 9.5, 18);
    camera.lookAt(0, 6.1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.42;
    controls.target.set(0, 6.0, 0);
    controls.minDistance = 11;
    controls.maxDistance = 28;
    controls.maxPolarAngle = Math.PI * 0.48;

    const brickMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x7b3026, roughness: 0.9 }),
      new THREE.MeshStandardMaterial({ color: 0x8d3b2d, roughness: 0.88 }),
      new THREE.MeshStandardMaterial({ color: 0x6c2822, roughness: 0.92 }),
      new THREE.MeshStandardMaterial({ color: 0x984332, roughness: 0.87 }),
      new THREE.MeshStandardMaterial({ color: 0x733329, roughness: 0.9 })
    ];
    const mortarMaterial = new THREE.MeshStandardMaterial({ color: 0xb39b83, roughness: 1 });
    const darkStoneMaterial = new THREE.MeshStandardMaterial({ color: 0x302e2b, roughness: 0.84 });
    const trimMaterial = new THREE.MeshStandardMaterial({ color: 0xc7b39a, roughness: 0.78 });
    const woodMaterial = new THREE.MeshStandardMaterial({ color: 0x3d2118, roughness: 0.62 });
    const woodInsetMaterial = new THREE.MeshStandardMaterial({ color: 0x281512, roughness: 0.68 });
    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x547681,
      metalness: 0.08,
      roughness: 0.13,
      transmission: 0.22,
      transparent: true,
      opacity: 0.78
    });
    const blackMaterial = new THREE.MeshStandardMaterial({ color: 0x08090a, roughness: 0.9 });
    const brassMaterial = new THREE.MeshStandardMaterial({ color: 0xb28a46, metalness: 0.72, roughness: 0.28 });

    function box(name, size, position, material, cast = true, receive = true) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material);
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      scene.add(mesh);
      return mesh;
    }

    function cylinder(name, radius, height, position, material, segments = 24) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, segments), material);
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    const wallWidth = 8;
    const wallHeight = 12;
    const wallDepth = 0.68;

    box("mortar wall", [wallWidth, wallHeight, wallDepth], [0, 6, 0], mortarMaterial);

    function addBrickCourse(y, offset, courseIndex) {
      const brickHeight = 0.57;
      const brickDepth = 0.12;
      const brickWidth = 1.04;
      const gap = 0.055;
      const step = brickWidth + gap;
      const start = -4.05 + offset;
      let index = 0;
      for (let x = start; x < 4.15; x += step) {
        const actualWidth = Math.min(brickWidth, 4.08 - x);
        if (actualWidth > 0.22) {
          box(
            "individual facade brick",
            [actualWidth, brickHeight, brickDepth],
            [x + actualWidth * 0.5, y, 0.405],
            brickMaterials[(courseIndex * 3 + index) % brickMaterials.length]
          );
        }
        index++;
      }
    }

    for (let row = 0; row < 20; row++) {
      addBrickCourse(0.42 + row * 0.59, row % 2 === 0 ? 0 : -0.52, row);
    }

    function addBand(y, width = 8.16) {
      box("projecting string course", [width, 0.19, 0.24], [0, y, 0.47], trimMaterial);
      box("string course shadow", [width - 0.06, 0.045, 0.03], [0, y - 0.12, 0.602], darkStoneMaterial, false);
    }

    addBand(3.86);
    addBand(7.48);
    addBand(11.1);

    box("left corner quoin", [0.18, 11.7, 0.23], [-3.94, 5.95, 0.48], darkStoneMaterial);
    box("right corner quoin", [0.18, 11.7, 0.23], [3.94, 5.95, 0.48], darkStoneMaterial);

    box("parapet body", [8.32, 0.94, 0.82], [0, 12.42, 0.02], brickMaterials[2]);
    box("parapet cap", [8.72, 0.22, 1.08], [0, 12.99, -0.02], trimMaterial);
    box("parapet cap upper edge", [8.48, 0.08, 0.94], [0, 13.14, -0.02], darkStoneMaterial);

    for (let i = 0; i < 8; i++) {
      box(
        "parapet cap brick joint",
        [0.035, 0.24, 1.1],
        [-3.82 + i * 1.09, 13.0, 0.015],
        darkStoneMaterial,
        false
      );
    }

    function addDoor() {
      const x = 0;
      const bottom = 0.18;
      const height = 3.35;
      const width = 2.18;

      box("doorway darkness", [2.55, 3.78, 0.16], [x, 2.0, 0.355], blackMaterial, false);
      box("door slab", [width, height, 0.16], [x, bottom + height / 2, 0.49], woodMaterial);
      box("door left stile", [0.16, height - 0.16, 0.07], [x - 0.83, 1.84, 0.595], woodInsetMaterial);
      box("door right stile", [0.16, height - 0.16, 0.07], [x + 0.83, 1.84, 0.595], woodInsetMaterial);
      box("door top rail", [width - 0.14, 0.16, 0.07], [x, 3.39, 0.595], woodInsetMaterial);
      box("door middle rail", [width - 0.14, 0.13, 0.07], [x, 2.0, 0.595], woodInsetMaterial);
      box("door lower rail", [width - 0.14, 0.13, 0.07], [x, 0.68, 0.595], woodInsetMaterial);
      box("door upper panel", [1.33, 1.18, 0.06], [x, 2.72, 0.602], woodInsetMaterial);
      box("door lower panel", [1.33, 1.0, 0.06], [x, 1.32, 0.602], woodInsetMaterial);

      box("door lintel", [2.72, 0.27, 0.34], [x, 3.79, 0.49], trimMaterial);
      box("door left jamb", [0.26, 3.72, 0.34], [x - 1.29, 2.02, 0.49], trimMaterial);
      box("door right jamb", [0.26, 3.72, 0.34], [x + 1.29, 2.02, 0.49], trimMaterial);
      box("door threshold", [2.7, 0.18, 0.5], [x, 0.08, 0.43], darkStoneMaterial);

      const knob = new THREE.Mesh(new THREE.SphereGeometry(0.095, 20, 14), brassMaterial);
      knob.position.set(0.64, 1.88, 0.69);
      knob.castShadow = true;
      scene.add(knob);

      cylinder("door knob stem", 0.035, 0.08, [0.64, 1.88, 0.63], brassMaterial, 16);
    }
    addDoor();

    function addWindow(x, y, width, height, label) {
      const frameDepth = 0.28;
      const frameWidth = 0.19;

      box(label + " recess", [width + 0.38, height + 0.42, 0.14], [x, y, 0.355], blackMaterial, false);
      box(label + " glass", [width, height, 0.07], [x, y, 0.52], glassMaterial, false);

      box(label + " left frame", [frameWidth, height + 0.2, frameDepth], [x - width / 2 - 0.095, y, 0.6], trimMaterial);
      box(label + " right frame", [frameWidth, height + 0.2, frameDepth], [x + width / 2 + 0.095, y, 0.6], trimMaterial);
      box(label + " top frame", [width + 0.38, frameWidth, frameDepth], [x, y + height / 2 + 0.095, 0.6], trimMaterial);
      box(label + " bottom frame", [width + 0.38, frameWidth, frameDepth], [x, y - height / 2 - 0.095, 0.6], trimMaterial);

      box(label + " vertical mullion", [0.095, height, 0.1], [x, y, 0.665], trimMaterial);
      box(label + " horizontal mullion", [width, 0.095, 0.1], [x, y, 0.668], trimMaterial);

      box(label + " projecting sill", [width + 0.62, 0.22, 0.48], [x, y - height / 2 - 0.31, 0.58], trimMaterial);
      box(label + " sill underside", [width + 0.48, 0.09, 0.39], [x, y - height / 2 - 0.46, 0.53], darkStoneMaterial);
      box(label + " lintel accent", [width + 0.52, 0.13, 0.34], [x, y + height / 2 + 0.27, 0.53], trimMaterial);
    }

    addWindow(-1.88, 5.55, 1.62, 1.68, "left upper window");
    addWindow(1.88, 5.55, 1.62, 1.68, "right upper window");
    addWindow(0, 9.12, 2.06, 1.88, "top window");

    box("top window pediment base", [2.72, 0.16, 0.38], [0, 10.34, 0.5], trimMaterial);
    const pediment = new THREE.Mesh(
      new THREE.ConeGeometry(1.42, 0.58, 4, 1, false, Math.PI / 4),
      trimMaterial
    );
    pediment.scale.z = 0.28;
    pediment.position.set(0, 10.72, 0.49);
    pediment.rotation.y = Math.PI / 4;
    pediment.castShadow = true;
    scene.add(pediment);

    box("entry lantern backplate", [0.46, 0.88, 0.1], [-1.7, 3.26, 0.67], darkStoneMaterial);
    cylinder("entry lantern", 0.19, 0.43, [-1.7, 3.28, 0.76], brassMaterial, 6);
    const lanternGlass = new THREE.Mesh(
      new THREE.CylinderGeometry(0.13, 0.13, 0.3, 6),
      new THREE.MeshStandardMaterial({ color: 0xffc66d, emissive: 0x9c4c16, emissiveIntensity: 1.3 })
    );
    lanternGlass.position.set(-1.7, 3.28, 0.77);
    scene.add(lanternGlass);

    box("right entry lantern backplate", [0.46, 0.88, 0.1], [1.7, 3.26, 0.67], darkStoneMaterial);
    cylinder("right entry lantern", 0.19, 0.43, [1.7, 3.28, 0.76], brassMaterial, 6);
    const rightLanternGlass = new THREE.Mesh(
      new THREE.CylinderGeometry(0.13, 0.13, 0.3, 6),
      new THREE.MeshStandardMaterial({ color: 0xffc66d, emissive: 0x9c4c16, emissiveIntensity: 1.3 })
    );
    rightLanternGlass.position.set(1.7, 3.28, 0.77);
    scene.add(rightLanternGlass);

    box("side pavement", [26, 0.32, 24], [0, -0.2, -1.4], new THREE.MeshStandardMaterial({ color: 0x36383a, roughness: 0.98 }), false, true);
    box("front step", [4.2, 0.22, 1.25], [0, 0.06, 0.76], darkStoneMaterial);
    box("front step top", [4.05, 0.08, 1.18], [0, 0.21, 0.76], trimMaterial);

    for (let i = -4; i <= 4; i++) {
      box("pavement seam", [0.025, 0.012, 24], [i * 2.7, -0.03, -1.4], darkStoneMaterial, false);
    }
    for (let i = -3; i <= 5; i++) {
      box("pavement cross seam", [26, 0.012, 0.025], [0, -0.025, i * 2.8], darkStoneMaterial, false);
    }

    const sideWallMaterial = new THREE.MeshStandardMaterial({ color: 0x54251f, roughness: 0.95 });
    box("left return wall", [0.35, 12.3, 4.5], [-4.08, 6.1, -1.8], sideWallMaterial);
    box("right return wall", [0.35, 12.3, 4.5], [4.08, 6.1, -1.8], sideWallMaterial);

    const warmLight = new THREE.PointLight(0xffb45d, 3.1, 7, 2);
    warmLight.position.set(0, 2.7, 2.0);
    warmLight.castShadow = true;
    warmLight.shadow.mapSize.set(1024, 1024);
    scene.add(warmLight);

    const leftLanternLight = new THREE.PointLight(0xffaa5b, 1.2, 4, 2);
    leftLanternLight.position.set(-1.7, 3.25, 1.08);
    scene.add(leftLanternLight);

    const rightLanternLight = new THREE.PointLight(0xffaa5b, 1.2, 4, 2);
    rightLanternLight.position.set(1.7, 3.25, 1.08);
    scene.add(rightLanternLight);

    const hemiLight = new THREE.HemisphereLight(0x839bb2, 0x261b18, 1.45);
    scene.add(hemiLight);

    const moonLight = new THREE.DirectionalLight(0xb9c8e2, 2.2);
    moonLight.position.set(-8, 15, 10);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.set(2048, 2048);
    moonLight.shadow.camera.left = -14;
    moonLight.shadow.camera.right = 14;
    moonLight.shadow.camera.top = 18;
    moonLight.shadow.camera.bottom = -4;
    moonLight.shadow.camera.near = 1;
    moonLight.shadow.camera.far = 40;
    scene.add(moonLight);

    const fillLight = new THREE.DirectionalLight(0xd47e54, 0.65);
    fillLight.position.set(10, 5, 8);
    scene.add(fillLight);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
