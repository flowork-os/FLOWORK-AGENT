<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low Dune Field</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #dcb77d;
    }
    canvas {
      display: block;
    }
    .label {
      position: fixed;
      left: 24px;
      bottom: 22px;
      color: rgba(76, 48, 25, 0.72);
      font: 600 11px/1.4 Arial, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">low dune reserve · wind-shaped sand</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd8bd91);
    scene.fog = new THREE.Fog(0xd8bd91, 78, 165);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 260);
    camera.position.set(54, 31, 57);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.22;
    controls.minDistance = 25;
    controls.maxDistance = 125;
    controls.maxPolarAngle = Math.PI * 0.485;
    controls.target.set(0, 3.1, 0);

    const hemi = new THREE.HemisphereLight(0xffedc7, 0x8d6741, 2.15);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffdca7, 3.2);
    sun.position.set(-38, 62, 27);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -75;
    sun.shadow.camera.right = 75;
    sun.shadow.camera.top = 75;
    sun.shadow.camera.bottom = -75;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 170;
    sun.shadow.bias = -0.00018;
    scene.add(sun);

    const sandColor = new THREE.Color(0xc99b5b);
    const terrainWidth = 120;
    const terrainDepth = 92;
    const terrainSegmentsX = 180;
    const terrainSegmentsZ = 145;

    function duneHeight(x, z) {
      const broadRidges = 2.35 * Math.sin(z * 0.155 + 0.38 * Math.sin(x * 0.055));
      const rolling = 0.72 * Math.sin(x * 0.105 + z * 0.062) + 0.38 * Math.cos(x * 0.22 - z * 0.035);
      const troughs = 0.22 * Math.sin(z * 0.48 + x * 0.07);
      const edgeFade = Math.min(1, Math.max(0, (terrainWidth * 0.5 - Math.abs(x)) / 13));
      return 2.65 + (broadRidges + rolling + troughs) * (0.72 + 0.28 * edgeFade);
    }

    const terrainPositions = [];
    const terrainIndices = [];
    const terrainUvs = [];
    const terrainColors = [];

    for (let iz = 0; iz <= terrainSegmentsZ; iz++) {
      const z = -terrainDepth * 0.5 + terrainDepth * iz / terrainSegmentsZ;
      for (let ix = 0; ix <= terrainSegmentsX; ix++) {
        const x = -terrainWidth * 0.5 + terrainWidth * ix / terrainSegmentsX;
        const y = duneHeight(x, z);
        terrainPositions.push(x, y, z);
        terrainUvs.push(ix / terrainSegmentsX, iz / terrainSegmentsZ);
        const warm = 0.92 + 0.08 * Math.sin(x * 0.13 + z * 0.08);
        terrainColors.push(
          sandColor.r * warm,
          sandColor.g * warm,
          sandColor.b * warm
        );
      }
    }

    for (let iz = 0; iz < terrainSegmentsZ; iz++) {
      for (let ix = 0; ix < terrainSegmentsX; ix++) {
        const row = terrainSegmentsX + 1;
        const a = iz * row + ix;
        const b = a + 1;
        const c = a + row;
        const d = c + 1;
        terrainIndices.push(a, c, b, b, c, d);
      }
    }

    const terrainGeometry = new THREE.BufferGeometry();
    terrainGeometry.setAttribute("position", new THREE.Float32BufferAttribute(terrainPositions, 3));
    terrainGeometry.setAttribute("uv", new THREE.Float32BufferAttribute(terrainUvs, 2));
    terrainGeometry.setAttribute("color", new THREE.Float32BufferAttribute(terrainColors, 3));
    terrainGeometry.setIndex(terrainIndices);
    terrainGeometry.computeVertexNormals();

    const terrainMaterial = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.96,
      metalness: 0,
      flatShading: false
    });
    const terrain = new THREE.Mesh(terrainGeometry, terrainMaterial);
    terrain.receiveShadow = true;
    scene.add(terrain);

    const groundGeometry = new THREE.PlaneGeometry(190, 160);
    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0xa87945,
      roughness: 1
    });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI * 0.5;
    ground.position.y = -0.45;
    ground.receiveShadow = true;
    scene.add(ground);

    const ripplePositions = [];
    const rippleCount = 66;
    const rippleSamples = 76;

    for (let r = 0; r < rippleCount; r++) {
      const zBase = -40 + r * 1.22 + Math.sin(r * 1.7) * 0.28;
      const phase = r * 0.73;
      for (let i = 0; i < rippleSamples; i++) {
        const x = -57 + i * (114 / (rippleSamples - 1));
        const z = zBase
          + 0.30 * Math.sin(x * 0.17 + phase)
          + 0.10 * Math.sin(x * 0.49 - phase * 0.7);
        const y = duneHeight(x, z) + 0.035;
        ripplePositions.push(x, y, z);
      }
    }

    const rippleGeometry = new THREE.BufferGeometry();
    rippleGeometry.setAttribute("position", new THREE.Float32BufferAttribute(ripplePositions, 3));
    const rippleMaterial = new THREE.LineBasicMaterial({
      color: 0x9b6c3b,
      transparent: true,
      opacity: 0.34,
      depthWrite: false
    });

    for (let r = 0; r < rippleCount; r++) {
      const start = r * rippleSamples;
      const lineGeometry = new THREE.BufferGeometry();
      const slice = ripplePositions.slice(start * 3, (start + rippleSamples) * 3);
      lineGeometry.setAttribute("position", new THREE.Float32BufferAttribute(slice, 3));
      const line = new THREE.Line(lineGeometry, rippleMaterial);
      scene.add(line);
    }

    const boardwalkGroup = new THREE.Group();
    const woodMaterial = new THREE.MeshStandardMaterial({
      color: 0x765033,
      roughness: 0.82,
      metalness: 0
    });
    const woodTopMaterial = new THREE.MeshStandardMaterial({
      color: 0x9b6b3f,
      roughness: 0.9
    });

    const plankCount = 29;
    const plankLength = 1.78;
    const boardwalkZ = 10.5;

    for (let i = 0; i < plankCount; i++) {
      const x = -25 + i * 1.78;
      const y = duneHeight(x, boardwalkZ) + 1.02;
      const plank = new THREE.Mesh(new THREE.BoxGeometry(plankLength - 0.12, 0.25, 3.0), woodTopMaterial);
      plank.position.set(x, y, boardwalkZ);
      plank.castShadow = true;
      plank.receiveShadow = true;
      boardwalkGroup.add(plank);

      if (i % 3 === 1) {
        const supportHeight = y - duneHeight(x, boardwalkZ) - 0.12;
        const support = new THREE.Mesh(new THREE.BoxGeometry(0.22, supportHeight, 0.22), woodMaterial);
        support.position.set(x, y - supportHeight * 0.5 - 0.1, boardwalkZ);
        support.castShadow = true;
        boardwalkGroup.add(support);
      }
    }

    const sideBeam = new THREE.Mesh(new THREE.BoxGeometry(51.5, 0.25, 0.22), woodMaterial);
    sideBeam.position.set(0.0, duneHeight(0, boardwalkZ) + 0.73, boardwalkZ - 1.28);
    sideBeam.castShadow = true;
    boardwalkGroup.add(sideBeam);

    const sideBeamBack = sideBeam.clone();
    sideBeamBack.position.z = boardwalkZ + 1.28;
    boardwalkGroup.add(sideBeamBack);
    scene.add(boardwalkGroup);

    const fenceGroup = new THREE.Group();
    const fenceMaterial = new THREE.MeshStandardMaterial({
      color: 0x59402d,
      roughness: 0.93
    });
    const fenceWireMaterial = new THREE.LineBasicMaterial({
      color: 0x3f3328,
      transparent: true,
      opacity: 0.82
    });
    const fenceZ = -14.5;
    const postXs = [-48, -38, -27, -14, 0, 14, 29, 43];

    for (const x of postXs) {
      const baseY = duneHeight(x, fenceZ);
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.16, 2.8, 8), fenceMaterial);
      post.position.set(x, baseY + 1.4, fenceZ);
      post.castShadow = true;
      post.receiveShadow = true;
      fenceGroup.add(post);
    }

    function addFenceWire(height, sagAmount) {
      const points = [];
      for (let p = 0; p < postXs.length - 1; p++) {
        const x1 = postXs[p];
        const x2 = postXs[p + 1];
        const y1 = duneHeight(x1, fenceZ) + height;
        const y2 = duneHeight(x2, fenceZ) + height;
        for (let s = 0; s < 8; s++) {
          const t = s / 8;
          const x = THREE.MathUtils.lerp(x1, x2, t);
          const y = THREE.MathUtils.lerp(y1, y2, t) - sagAmount * Math.sin(Math.PI * t);
          points.push(new THREE.Vector3(x, y, fenceZ));
        }
      }
      const lastX = postXs[postXs.length - 1];
      points.push(new THREE.Vector3(lastX, duneHeight(lastX, fenceZ) + height, fenceZ));
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      fenceGroup.add(new THREE.Line(geometry, fenceWireMaterial));
    }

    addFenceWire(2.35, 0.18);
    addFenceWire(1.28, 0.12);
    scene.add(fenceGroup);

    const grassMaterial = new THREE.MeshStandardMaterial({
      color: 0x6f6a3c,
      roughness: 1
    });

    function addGrassTuft(x, z, scale) {
      const baseY = duneHeight(x, z) + 0.04;
      const tuft = new THREE.Group();
      for (let i = 0; i < 5; i++) {
        const blade = new THREE.Mesh(new THREE.ConeGeometry(0.035 * scale, 0.85 * scale, 4), grassMaterial);
        blade.position.set(
          (i - 2) * 0.075 * scale,
          0.4 * scale,
          Math.sin(i * 2.1) * 0.08 * scale
        );
        blade.rotation.z = (i - 2) * 0.15;
        blade.castShadow = true;
        tuft.add(blade);
      }
      tuft.position.set(x, baseY, z);
      scene.add(tuft);
    }

    addGrassTuft(-44, -8, 1.05);
    addGrassTuft(-20, -22, 0.78);
    addGrassTuft(18, -8, 0.92);
    addGrassTuft(38, 5, 0.68);
    addGrassTuft(-5, 29, 0.72);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      controls.update();
      sun.position.x = -38 + Math.sin(elapsed * 0.035) * 5;
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
