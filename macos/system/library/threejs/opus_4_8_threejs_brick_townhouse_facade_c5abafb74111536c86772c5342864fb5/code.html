<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brick Townhouse Facade</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dedee2; }
  #c { width: 100%; height: 100%; display: block; }
</style>

<!-- three.js + OrbitControls via importmap (jsDelivr CDN, three@0.160.0) -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   Renderer
   ============================================================ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

/* ============================================================
   Scene & neutral studio background
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdedee2);

/* ============================================================
   Camera
   ============================================================ */
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);

/* ============================================================
   Lighting: hemisphere fill + directional key (shadows) + subtle fill
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xffffff, 0x60584f, 0.85);
hemi.position.set(0, 20, 0);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff2e0, 2.4);
keyLight.position.set(9, 14, 11);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 60;
keyLight.shadow.camera.left = -13;
keyLight.shadow.camera.right = 13;
keyLight.shadow.camera.top = 15;
keyLight.shadow.camera.bottom = -3;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xbfd0ff, 0.5);
fillLight.position.set(-10, 6, -6);
scene.add(fillLight);

/* ============================================================
   Procedural red-brick CanvasTexture (represents ~1m x 1m)
   ============================================================ */
function makeBrickTexture() {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');

  // mortar background
  ctx.fillStyle = '#b9afa2';
  ctx.fillRect(0, 0, size, size);

  const cols = 4;               // ~4 bricks per metre
  const rows = 12;              // ~12 courses per metre
  const bw = size / cols;       // brick width in px
  const bh = size / rows;       // course height in px
  const mortar = 3;             // mortar gap in px

  const baseColors = ['#9c3b28', '#a8432c', '#8f3524', '#b04a30', '#953d29', '#a03e26'];

  for (let r = 0; r < rows; r++) {
    const offset = (r % 2) * (bw / 2); // running bond: alternate half-brick offset
    // draw one extra brick so the half-offset wraps cleanly across the tile seam
    for (let c = -1; c <= cols; c++) {
      const x = c * bw + offset;
      const y = r * bh;
      const col = baseColors[(r * 3 + c * 7 + cols * rows) % baseColors.length];
      ctx.fillStyle = col;
      ctx.fillRect(x + mortar, y + mortar, bw - mortar * 2, bh - mortar * 2);

      // subtle per-brick shading for texture
      ctx.fillStyle = 'rgba(0,0,0,0.10)';
      ctx.fillRect(x + mortar, y + bh - mortar * 2, bw - mortar * 2, mortar);
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(x + mortar, y + mortar, bw - mortar * 2, mortar);
    }
  }

  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const brickTex = makeBrickTexture();
const brickBump = brickTex.clone();
brickBump.colorSpace = THREE.NoColorSpace;

/* ============================================================
   Materials
   ============================================================ */
const brickMat = new THREE.MeshStandardMaterial({
  map: brickTex,
  bumpMap: brickBump,
  bumpScale: 0.015,
  color: 0xffffff,
  roughness: 0.95,
  metalness: 0.0
});

const stoneMat = new THREE.MeshStandardMaterial({ color: 0xd9d3c4, roughness: 0.85, metalness: 0.0 });
const capMat   = new THREE.MeshStandardMaterial({ color: 0xc9c2b2, roughness: 0.8,  metalness: 0.0 });
const frameMat = new THREE.MeshStandardMaterial({ color: 0xf2f0ea, roughness: 0.5,  metalness: 0.0 });
const woodMat  = new THREE.MeshStandardMaterial({ color: 0x5a2f26, roughness: 0.55, metalness: 0.05 });
const knobMat  = new THREE.MeshStandardMaterial({ color: 0xcaa24a, roughness: 0.3,  metalness: 0.9 });
const darkMat  = new THREE.MeshStandardMaterial({ color: 0x1b1b20, roughness: 0.9,  metalness: 0.0 });
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0x2b3d47, roughness: 0.06, metalness: 0.0,
  transmission: 0.55, transparent: true, opacity: 0.75,
  ior: 1.5, thickness: 0.05, reflectivity: 0.4
});

/* ============================================================
   Facade dimensions (metres) & the main Group
   ============================================================ */
const W = 5.0;   // facade width
const H = 10.0;  // facade height (~3 storeys + parapet)
const T = 0.45;  // wall thickness (depth); front face at z = T

const facade = new THREE.Group();
facade.name = 'TownhouseFacade';

// small helper to create a named box mesh with shadows
function box(w, h, d, mat, name) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.name = name;
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

/* ------------------------------------------------------------
   Opening rectangles: [x0, x1, y0, y1]
   ------------------------------------------------------------ */
const doorRect = [-0.65, 0.65, 0.15, 2.55];
const winRects = [
  [-1.85, -0.65, 3.60, 5.20],  // floor 2 left
  [ 0.65,  1.85, 3.60, 5.20],  // floor 2 right
  [-1.85, -0.65, 6.40, 8.00],  // floor 3 left
  [ 0.65,  1.85, 6.40, 8.00]   // floor 3 right
];

/* ------------------------------------------------------------
   Main brick wall via ExtrudeGeometry with door + window holes
   ------------------------------------------------------------ */
const wallShape = new THREE.Shape();
wallShape.moveTo(-W / 2, 0);
wallShape.lineTo( W / 2, 0);
wallShape.lineTo( W / 2, H);
wallShape.lineTo(-W / 2, H);
wallShape.lineTo(-W / 2, 0);

function addHole(shape, [x0, x1, y0, y1]) {
  const p = new THREE.Path();
  p.moveTo(x0, y0);
  p.lineTo(x1, y0);
  p.lineTo(x1, y1);
  p.lineTo(x0, y1);
  p.lineTo(x0, y0);
  shape.holes.push(p);
}
addHole(wallShape, doorRect);
winRects.forEach(r => addHole(wallShape, r));

const wallGeo = new THREE.ExtrudeGeometry(wallShape, { depth: T, bevelEnabled: false });
const wall = new THREE.Mesh(wallGeo, brickMat);
wall.name = 'BrickWall';
wall.castShadow = true;
wall.receiveShadow = true;
facade.add(wall);

/* ------------------------------------------------------------
   String-course brick banding (protruding horizontal bands)
   ------------------------------------------------------------ */
function addStringCourse(y, name) {
  const band = box(W + 0.16, 0.28, T + 0.14, stoneMat, name);
  band.position.set(0, y, T / 2);
  facade.add(band);
}
addStringCourse(3.30, 'StringCourse_1');
addStringCourse(6.10, 'StringCourse_2');
addStringCourse(8.55, 'StringCourse_3');

// ground-level base plinth band
const plinth = box(W + 0.12, 0.55, T + 0.10, stoneMat, 'BasePlinth');
plinth.position.set(0, 0.275, T / 2);
facade.add(plinth);

/* ------------------------------------------------------------
   Flat-roof parapet cap (coping) at the top
   ------------------------------------------------------------ */
const parapetBrick = box(W, 0.55, T, brickMat, 'Parapet');
parapetBrick.position.set(0, H - 0.275, T / 2);
facade.add(parapetBrick);

const coping = box(W + 0.28, 0.22, T + 0.28, capMat, 'ParapetCap');
coping.position.set(0, H + 0.11, T / 2);
facade.add(coping);

/* ------------------------------------------------------------
   Window unit: recessed frame + glass + mullions + sill + lintel
   ------------------------------------------------------------ */
function makeWindow([x0, x1, y0, y1], index) {
  const g = new THREE.Group();
  g.name = 'Window_' + index;
  const cx = (x0 + x1) / 2;
  const cy = (y0 + y1) / 2;
  const w = x1 - x0;
  const h = y1 - y0;

  const frontZ = T;          // wall front face
  const barT = 0.09;         // frame bar thickness
  const barD = 0.12;         // frame depth

  // dark interior panel (seen through the recess)
  const interior = box(w + 0.06, h + 0.06, 0.04, darkMat, 'WinInterior');
  interior.position.set(cx, cy, 0.06);
  g.add(interior);

  // glass pane (recessed behind the front face)
  const glass = box(w - 0.02, h - 0.02, 0.03, glassMat, 'WinGlass');
  glass.position.set(cx, cy, frontZ - 0.16);
  glass.castShadow = false;
  g.add(glass);

  // frame ring (four painted bars), set just inside the front face
  const fz = frontZ - 0.05;
  const top = box(w, barT, barD, frameMat, 'WinFrameTop');
  top.position.set(cx, cy + h / 2 - barT / 2, fz);
  const bot = box(w, barT, barD, frameMat, 'WinFrameBottom');
  bot.position.set(cx, cy - h / 2 + barT / 2, fz);
  const left = box(barT, h - barT * 2, barD, frameMat, 'WinFrameLeft');
  left.position.set(cx - w / 2 + barT / 2, cy, fz);
  const right = box(barT, h - barT * 2, barD, frameMat, 'WinFrameRight');
  right.position.set(cx + w / 2 - barT / 2, cy, fz);
  g.add(top, bot, left, right);

  // mullions: one vertical + one horizontal dividing the pane
  const mz = frontZ - 0.12;
  const vMul = box(0.05, h - barT * 2, 0.05, frameMat, 'WinMullionV');
  vMul.position.set(cx, cy, mz);
  const hMul = box(w - barT * 2, 0.05, 0.05, frameMat, 'WinMullionH');
  hMul.position.set(cx, cy, mz);
  g.add(vMul, hMul);

  // protruding stone sill under the window
  const sill = box(w + 0.30, 0.14, 0.42, capMat, 'WinSill');
  sill.position.set(cx, y0 - 0.02, frontZ + 0.02);
  g.add(sill);

  // stone lintel above the window
  const lintel = box(w + 0.24, 0.18, T + 0.10, stoneMat, 'WinLintel');
  lintel.position.set(cx, y1 + 0.11, T / 2 + 0.03);
  g.add(lintel);

  return g;
}
winRects.forEach((r, i) => facade.add(makeWindow(r, i + 1)));

/* ------------------------------------------------------------
   Recessed doorway: stone surround + door + fanlight + steps
   ------------------------------------------------------------ */
function makeDoor([x0, x1, y0, y1]) {
  const g = new THREE.Group();
  g.name = 'Doorway';
  const cx = (x0 + x1) / 2;
  const w = x1 - x0;
  const h = y1 - y0;
  const frontZ = T;

  // dark recess interior behind the door
  const interior = box(w + 0.1, h + 0.1, 0.04, darkMat, 'DoorInterior');
  interior.position.set(cx, (y0 + y1) / 2, 0.05);
  g.add(interior);

  // protruding stone surround (emphasises the recessed doorway)
  const surroundD = T + 0.12;
  const jL = box(0.18, h + 0.35, surroundD, stoneMat, 'DoorSurroundLeft');
  jL.position.set(x0 - 0.09, (y0 + y1) / 2 + 0.05, T / 2 + 0.03);
  const jR = box(0.18, h + 0.35, surroundD, stoneMat, 'DoorSurroundRight');
  jR.position.set(x1 + 0.09, (y0 + y1) / 2 + 0.05, T / 2 + 0.03);
  const jTop = box(w + 0.36, 0.22, surroundD, stoneMat, 'DoorSurroundTop');
  jTop.position.set(cx, y1 + 0.16, T / 2 + 0.03);
  g.add(jL, jR, jTop);

  // fanlight (glass transom) at the top of the opening
  const fanH = 0.42;
  const fan = box(w - 0.06, fanH, 0.03, glassMat, 'DoorFanlight');
  fan.position.set(cx, y1 - fanH / 2 - 0.05, frontZ - 0.14);
  fan.castShadow = false;
  g.add(fan);

  // the door leaf itself, recessed into the opening
  const doorTop = y1 - fanH - 0.12;
  const doorH = doorTop - y0;
  const doorCy = y0 + doorH / 2;
  const doorZ = frontZ - 0.22;
  const door = box(w - 0.10, doorH, 0.08, woodMat, 'DoorLeaf');
  door.position.set(cx, doorCy, doorZ);
  g.add(door);

  // recessed raised panels on the door for detail
  const pW = (w - 0.10) / 2 - 0.14;
  for (let ix = 0; ix < 2; ix++) {
    for (let iy = 0; iy < 2; iy++) {
      const px = cx + (ix === 0 ? -1 : 1) * (pW / 2 + 0.09);
      const py = doorCy + (iy === 0 ? -1 : 1) * (doorH / 4);
      const panel = box(pW, doorH / 2 - 0.16, 0.04, woodMat, 'DoorPanel');
      panel.material = new THREE.MeshStandardMaterial({ color: 0x4a2620, roughness: 0.6 });
      panel.position.set(px, py, doorZ + 0.05);
      g.add(panel);
    }
  }

  // brass doorknob
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.06, 20, 16), knobMat);
  knob.name = 'DoorKnob';
  knob.castShadow = true;
  knob.position.set(cx + w / 2 - 0.22, doorCy, doorZ + 0.09);
  g.add(knob);

  // stone threshold + two entrance steps protruding forward
  for (let s = 0; s < 2; s++) {
    const stepD = 0.5 - s * 0.18;
    const step = box(w + 0.5 - s * 0.2, 0.12, stepD, capMat, 'Step_' + s);
    step.position.set(cx, 0.06 + s * 0.12, frontZ + stepD / 2 - 0.02);
    g.add(step);
  }

  return g;
}
facade.add(makeDoor(doorRect));

/* ============================================================
   Center the facade at the origin (x,z) with its base on y = 0
   ============================================================ */
scene.add(facade);
facade.updateWorldMatrix(true, true);
let bbox = new THREE.Box3().setFromObject(facade);
const center = bbox.getCenter(new THREE.Vector3());
facade.position.x -= center.x;
facade.position.z -= center.z;
facade.position.y -= bbox.min.y;  // rest exactly on the ground plane

/* ============================================================
   Soft ground / contact-shadow plane
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(40, 64),
  new THREE.MeshStandardMaterial({ color: 0xcfccc6, roughness: 1.0, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
ground.name = 'Ground';
scene.add(ground);

/* ============================================================
   OrbitControls with damping + gentle autorotate
   ============================================================ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 6;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.5;   // stay above the ground

/* ============================================================
   Auto-frame the camera to the object's bounding box
   ============================================================ */
bbox = new THREE.Box3().setFromObject(facade);
const size = bbox.getSize(new THREE.Vector3());
const focus = bbox.getCenter(new THREE.Vector3());
const maxDim = Math.max(size.x, size.y, size.z);
const fov = camera.fov * Math.PI / 180;
let dist = (maxDim / 2) / Math.tan(fov / 2);
dist *= 1.5; // padding

camera.position.set(focus.x + dist * 0.55, focus.y + size.y * 0.15, focus.z + dist * 0.95);
camera.near = 0.1;
camera.far = dist * 8;
camera.updateProjectionMatrix();
controls.target.copy(focus);
controls.update();

/* ============================================================
   Resize handling
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   Render loop
   ============================================================ */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
