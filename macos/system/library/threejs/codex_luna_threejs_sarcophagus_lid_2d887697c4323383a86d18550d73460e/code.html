<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egyptian Sarcophagus Lid</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11100e}
canvas{display:block}
#label{position:fixed;left:24px;bottom:20px;color:#d7c18a;font:12px/1.4 Georgia,serif;letter-spacing:.18em;text-transform:uppercase;opacity:.72;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">Anthropoid Sarcophagus Lid · Museum Scale · 210 cm</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11100e);
scene.fog = new THREE.Fog(0x11100e, 360, 650);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 1, 1000);
camera.position.set(260, 145, 285);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .055;
controls.autoRotate = true;
controls.autoRotateSpeed = .55;
controls.minDistance = 180;
controls.maxDistance = 470;
controls.target.set(0,110,0);

const stone = new THREE.MeshStandardMaterial({color:0x9c7950,roughness:.7,metalness:.08});
const stoneLight = new THREE.MeshStandardMaterial({color:0xc4a778,roughness:.62,metalness:.1});
const stoneDark = new THREE.MeshStandardMaterial({color:0x654a32,roughness:.8,metalness:.05});
const gold = new THREE.MeshStandardMaterial({color:0xc99b38,roughness:.28,metalness:.7});
const goldDark = new THREE.MeshStandardMaterial({color:0x73501d,roughness:.38,metalness:.55});
const lapis = new THREE.MeshStandardMaterial({color:0x173a52,roughness:.35,metalness:.18});
const black = new THREE.MeshStandardMaterial({color:0x120f0b,roughness:.48,metalness:.1});
const eyeWhite = new THREE.MeshStandardMaterial({color:0xd8c49a,roughness:.35});
const floorMat = new THREE.MeshStandardMaterial({color:0x29231c,roughness:.86});

function mesh(geometry,material,x=0,y=0,z=0){
  const object = new THREE.Mesh(geometry,material);
  object.position.set(x,y,z);
  object.castShadow = true;
  object.receiveShadow = true;
  scene.add(object);
  return object;
}
function box(w,h,d,material,x=0,y=0,z=0,rx=0,ry=0,rz=0){
  const object = mesh(new THREE.BoxGeometry(w,h,d),material,x,y,z);
  object.rotation.set(rx,ry,rz);
  return object;
}
function cyl(radius,depth,material,x=0,y=0,z=0,rx=0,ry=0,rz=0,segments=32){
  const object = mesh(new THREE.CylinderGeometry(radius,radius,depth,segments),material,x,y,z);
  object.rotation.set(rx,ry,rz);
  return object;
}
function ellipsoid(material,x,y,z,sx,sy,sz){
  const object = mesh(new THREE.SphereGeometry(1,40,24),material,x,y,z);
  object.scale.set(sx,sy,sz);
  return object;
}
function addBand(y,width,depth=3,material=goldDark){
  box(width,3.2,depth,material,0,y,14.8);
  box(width-5,1.0,.8,gold,0,y+1.8,16.35);
}
function addGlyph(x,y,h,flip=false){
  const s = flip ? -1 : 1;
  box(2.3,h,1.5,goldDark,x,y,16.2,0,0,s*.12);
  box(7,2.2,1.5,goldDark,x+s*3,y+h*.27,16.2,0,0,s*.35);
  box(6,2.2,1.5,goldDark,x-s*2,y-h*.25,16.2,0,0,s*-.28);
  cyl(1.4,1.7,gold,x+s*4,y+h*.52,16.4,Math.PI/2,0,0,12);
}

const outline = new THREE.Shape();
outline.moveTo(-24,0);
outline.lineTo(24,0);
outline.lineTo(28,24);
outline.lineTo(30,65);
outline.lineTo(34,105);
outline.lineTo(39,138);
outline.quadraticCurveTo(35,153,24,164);
outline.lineTo(19,174);
outline.lineTo(20,192);
outline.quadraticCurveTo(25,207,17,224);
outline.lineTo(-17,224);
outline.quadraticCurveTo(-25,207,-20,192);
outline.lineTo(-19,174);
outline.lineTo(-24,164);
outline.quadraticCurveTo(-35,153,-39,138);
outline.lineTo(-34,105);
outline.lineTo(-30,65);
outline.lineTo(-28,24);
outline.closePath();

const lidGeometry = new THREE.ExtrudeGeometry(outline,{
  depth:28,
  bevelEnabled:true,
  bevelSegments:3,
  bevelSize:2.2,
  bevelThickness:2.1,
  curveSegments:8
});
lidGeometry.translate(0,0,-14);
mesh(lidGeometry,stone,0,0,0);

const pedestal = box(112,7,72,floorMat,0,-8,0);
box(96,8,60,stoneDark,0,-1,0);
box(84,5,50,goldDark,0,5,0);

const sideLeft = box(4,186,3,stoneDark,-37,100,15.2);
const sideRight = box(4,186,3,stoneDark,37,100,15.2);
sideLeft.rotation.z=.015;
sideRight.rotation.z=-.015;

for(let i=0;i<7;i++){
  const y=18+i*17;
  const width=25+i*1.5;
  addBand(y,width,3.2,i%2===0?goldDark:stoneDark);
}
for(let i=0;i<5;i++){
  const y=55+i*19;
  box(2.6,15,2.6,goldDark,-12,y,15.3,0,0,-.22);
  box(2.6,15,2.6,goldDark,12,y,15.3,0,0,.22);
}
box(7,110,2.4,stoneDark,0,76,15.2);
box(3.2,108,1.4,gold,0,76,16.45);
for(let i=0;i<8;i++){
  const y=28+i*13;
  box(18,1.8,1.7,goldDark,0,y,16.3);
  box(4,5,1.5,goldDark,-8,y+4,16.25,0,0,-.45);
  box(4,5,1.5,goldDark,8,y+4,16.25,0,0,.45);
}
addGlyph(-19,49,14,false);
addGlyph(19,73,13,true);
addGlyph(-19,98,15,true);
addGlyph(19,122,14,false);

const collarY=151;
for(let i=0;i<6;i++){
  const width=31+i*2.7;
  box(width,3.1,3.2,i%2?gold:lapis,0,collarY+i*4.3,16.2);
}
box(72,3,3,stoneDark,0,149,15.7);

const head = ellipsoid(stoneLight,0,190,16,18,25,12);
ellipsoid(stone,0,189,26,15,22,4.5);
box(26,4,5,goldDark,0,166,18);
box(22,3,4,gold,0,169.5,18.5);
ellipsoid(stoneLight,0,185,27,4.5,11,3.2);
box(9,18,3.4,stoneLight,0,169,25.6);
box(7,16,2.2,goldDark,0,168.5,27.1);

for(let i=-3;i<=3;i++){
  const x=i*5.2;
  const lock=box(4.5,33,5,i%2===0?gold:goldDark,x,194,15.4,0,0,i*.018);
  lock.scale.y=1+Math.abs(i)*.035;
}
box(42,5,5,goldDark,0,213,15);
box(36,3,4,gold,0,216,15.5);

const browY=191;
for(const x of [-7.2,7.2]){
  box(10,2.8,3,goldDark,x,browY,28,0,0,x<0?-0.08:0.08);
  ellipsoid(black,x,186.6,28.2,4.3,2.2,1.4);
  ellipsoid(eyeWhite,x+(x<0?.8:-.8),186.8,29.3,.8,.8,.45);
}
box(2.8,11,3.2,stoneDark,0,183.5,27.5,0,0,.05);
box(8,2.6,3.4,stoneDark,0,176.7,27.4,0,0,.02);
box(10,2.3,3.2,goldDark,0,173.8,27.5);
box(7,1.4,3,gold,0,174.1,29);

for(const side of [-1,1]){
  box(3,23,4,goldDark,side*20,190,15.5,0,0,side*.08);
  box(2,21,3,gold,side*24,190,15.8,0,0,side*.08);
  box(5,3,4,goldDark,side*22,179,16,0,0,side*.08);
  box(5,3,4,goldDark,side*22,201,16,0,0,side*.08);
}

const armAngle=.35;
const armLeft=box(9,65,7,stoneLight,-16,132,19,0,0,armAngle);
const armRight=box(9,65,7,stoneLight,16,132,19,0,0,-armAngle);
box(11,9,8,stoneLight,-27,103,19,0,0,-.35);
box(11,9,8,stoneLight,27,103,19,0,0,.35);
box(8,3,9,gold,-27,106,20,0,0,-.35);
box(8,3,9,gold,27,106,20,0,0,.35);
box(8,4,8,goldDark,-8,147,20);
box(8,4,8,goldDark,8,147,20);

const chestPlate = new THREE.Shape();
chestPlate.moveTo(-25,145);
chestPlate.lineTo(25,145);
chestPlate.lineTo(20,119);
chestPlate.lineTo(0,108);
chestPlate.lineTo(-20,119);
chestPlate.closePath();
const plateGeo = new THREE.ExtrudeGeometry(chestPlate,{depth:2.2,bevelEnabled:true,bevelSize:1,bevelThickness:.6});
plateGeo.translate(0,0,0);
mesh(plateGeo,lapis,0,0,18.2);
for(let i=0;i<5;i++){
  box(34-i*3,2.2,1.5,i%2?gold:goldDark,0,139-i*5.2,20.2);
}
box(3,33,2,gold,0,124,20.5);
for(let i=0;i<7;i++){
  const yy=31+i*12;
  box(12,1.5,2,gold,0,yy,17.5);
}

const floor = box(620,3,620,floorMat,0,-14,0);
floor.receiveShadow=true;

const hemi = new THREE.HemisphereLight(0xd9c39c,0x211b17,2.05);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffe0a6,4.2);
key.position.set(-150,280,210);
key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-180;
key.shadow.camera.right=180;
key.shadow.camera.top=320;
key.shadow.camera.bottom=-30;
key.shadow.bias=-.0002;
scene.add(key);
const fill = new THREE.PointLight(0x6da0b8,18,360,2);
fill.position.set(150,120,170);
scene.add(fill);
const rim = new THREE.SpotLight(0xffb84d,850,500,Math.PI/7,.55,1.4);
rim.position.set(-115,235,-130);
rim.target.position.set(0,110,0);
rim.castShadow=true;
scene.add(rim);
scene.add(rim.target);

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  const t=clock.getElapsedTime();
  key.intensity=4.05+Math.sin(t*.45)*.12;
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
