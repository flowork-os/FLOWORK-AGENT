<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden Shed</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #cfe0ea; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe0ea);
scene.fog = new THREE.Fog(0xcfe0ea, 18, 45);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.5, 4.2, 7.5);

// Shed footprint: W (x) x D (z), origin at front-left corner (front = +z face)
const W = 3.0, D = 2.4, WALL_H = 2.2, RIDGE_H = 3.0, T = 0.09, EAVE = 0.25;
const center = new THREE.Vector3(W / 2, 1.2, -D / 2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(center);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 3;
controls.maxDistance = 20;

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0xbfd8ee, 0x6b7a55, 0.7));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(8, 10, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 30;
sun.shadow.bias = -0.0004;
sun.shadow.radius = 4;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.35);
fill.position.set(-6, 4, -4);
scene.add(fill);

// ---------- Procedural wood plank texture ----------
function woodTexture(base = '#a9743f', dark = '#7d5227', planks = 8, vertical = false) {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = base;
  g.fillRect(0, 0, 512, 512);
  const pw = 512 / planks;
  for (let i = 0; i < planks; i++) {
    const shade = (Math.sin(i * 12.9898) * 43758.5453) % 1;
    g.fillStyle = `rgba(0,0,0,${0.05 + Math.abs(shade) * 0.10})`;
    vertical ? g.fillRect(i * pw, 0, pw, 512) : g.fillRect(0, i * pw, 512, pw);
    g.strokeStyle = dark;
    g.lineWidth = 3;
    g.beginPath();
    if (vertical) { g.moveTo(i * pw + 1, 0); g.lineTo(i * pw + 1, 512); }
    else { g.moveTo(0, i * pw + 1); g.lineTo(512, i * pw + 1); }
    g.stroke();
    // grain streaks
    g.strokeStyle = 'rgba(60,35,12,0.18)';
    g.lineWidth = 1;
    for (let s = 0; s < 14; s++) {
      const r = Math.abs((Math.sin((i * 37 + s) * 78.233) * 12543.123) % 1);
      const p = i * pw + 4 + r * (pw - 8);
      g.beginPath();
      if (vertical) { g.moveTo(p, 0); g.lineTo(p + (r - 0.5) * 20, 512); }
      else { g.moveTo(0, p); g.lineTo(512, p + (r - 0.5) * 20); }
      g.stroke();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 8;
  return t;
}

const sidingTex = woodTexture('#a9743f', '#6f4a22', 9, false);
const doorTex = woodTexture('#8a5a2b', '#5c3a17', 6, true);
const roofTex = woodTexture('#5f5granite', '#3f3f46', 12, false);
// fix accidental value: regenerate properly
const roofTex2 = woodTexture('#606066', '#3c3c44', 14, false);

const matSiding = new THREE.MeshStandardMaterial({ map: sidingTex, roughness: 0.85, metalness: 0.0 });
const matSidingGable = matSiding.clone();
const matDoor = new THREE.MeshStandardMaterial({ map: doorTex, roughness: 0.8 });
const matTrim = new THREE.MeshStandardMaterial({ color: 0xe8e2d4, roughness: 0.7 });
const matRoof = new THREE.MeshStandardMaterial({ map: roofTex2, roughness: 0.9 });
const matGlass = new THREE.MeshPhysicalMaterial({ color: 0x9fc4d8, roughness: 0.1, metalness: 0, transmission: 0.85, transparent: true, opacity: 0.85 });
const matFloor = new THREE.MeshStandardMaterial({ color: 0x6b5136, roughness: 0.95 });

// ---------- Shed group (origin at front-left corner, front faces +z) ----------
const shed = new THREE.Group();
scene.add(shed);

function box(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  shed.add(m);
  return m;
}

// Floor slab
box(W, 0.12, D, matFloor, W / 2, 0.06, -D / 2);

// Walls (front wall has door + window openings built from segments)
const doorW = 0.9, doorH = 1.9, doorX = 0.75;         // door center x on front wall
const winW = 0.7, winH = 0.6, winX = 2.25, winY = 1.45; // window center on front wall

// Back wall
box(W, WALL_H, T, matSiding, W / 2, WALL_H / 2, -D + T / 2);
// Left / right walls
box(T, WALL_H, D, matSiding, T / 2, WALL_H / 2, -D / 2);
box(T, WALL_H, D, matSiding, W - T / 2, WALL_H / 2, -D / 2);

// Front wall segments (z = -T/2 plane, front face at z=0)
const fz = -T / 2;
const dL = doorX - doorW / 2, dR = doorX + doorW / 2;
const wL = winX - winW / 2, wR = winX + winW / 2;
const wB = winY - winH / 2, wT = winY + winH / 2;
// left of door
box(dL, WALL_H, T, matSiding, dL / 2, WALL_H / 2, fz);
// between door and window
box(wL - dR, WALL_H, T, matSiding, (dR + wL) / 2, WALL_H / 2, fz);
// right of window
box(W - wR, WALL_H, T, matSiding, (wR + W) / 2, WALL_H / 2, fz);
// above door
box(doorW, WALL_H - doorH, T, matSiding, doorX, doorH + (WALL_H - doorH) / 2, fz);
// below / above window (within the window column)
box(winW, wB, T, matSiding, winX, wB / 2, fz);
box(winW, WALL_H - wT, T, matSiding, winX, wT + (WALL_H - wT) / 2, fz);

// Gable triangles (front & back) via shape extrude
const gShape = new THREE.Shape();
gShape.moveTo(0, WALL_H);
gShape.lineTo(W, WALL_H);
gShape.lineTo(W / 2, RIDGE_H);
gShape.closePath();
const gGeo = new THREE.ExtrudeGeometry(gShape, { depth: T, bevelEnabled: false });
const gFront = new THREE.Mesh(gGeo, matSidingGable);
gFront.position.set(0, 0, -T);
gFront.castShadow = gFront.receiveShadow = true;
shed.add(gFront);
const gBack = gFront.clone();
gBack.position.set(0, 0, -D);
shed.add(gBack);

// ---------- Door (hinged on left jamb, slightly ajar) ----------
const hinge = new THREE.Group();
hinge.position.set(dL, 0, 0.01);
hinge.rotation.y = 0.5; // ajar
shed.add(hinge);
const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(doorW - 0.04, doorH - 0.04, 0.06), matDoor);
doorMesh.position.set((doorW - 0.04) / 2, 0.02 + (doorH - 0.04) / 2 + 0.06, 0.03);
doorMesh.castShadow = doorMesh.receiveShadow = true;
hinge.add(doorMesh);
// Z-brace on door
const braceM = new THREE.MeshStandardMaterial({ map: doorTex, roughness: 0.8, color: 0xcfa87a });
for (const [ry, y] of [[0, 0.35], [0, 1.65], [-0.9, 1.0]]) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(ry ? 1.05 : doorW - 0.12, 0.12, 0.03), braceM);
  b.position.set((doorW - 0.04) / 2, y, 0.075);
  b.rotation.z = ry;
  b.castShadow = true;
  hinge.add(b);
}
// Handle
const handle = new THREE.Mesh(
  new THREE.SphereGeometry(0.035, 16, 12),
  new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.4, metalness: 0.8 })
);
handle.position.set(doorW - 0.14, 1.0, 0.1);
handle.castShadow = true;
hinge.add(handle);
// Door frame trim
box(0.07, doorH + 0.07, 0.05, matTrim, dL - 0.02, (doorH + 0.07) / 2, 0.02);
box(0.07, doorH + 0.07, 0.05, matTrim, dR + 0.02, (doorH + 0.07) / 2, 0.02);
box(doorW + 0.18, 0.07, 0.05, matTrim, doorX, doorH + 0.035, 0.02);

// ---------- Window ----------
const glass = new THREE.Mesh(new THREE.PlaneGeometry(winW - 0.06, winH - 0.06), matGlass);
glass.position.set(winX, winY, fz);
shed.add(glass);
// window trim + muntins
box(winW + 0.14, 0.06, 0.05, matTrim, winX, wT + 0.03, 0.02);
box(winW + 0.14, 0.06, 0.05, matTrim, winX, wB - 0.03, 0.02);
box(0.06, winH + 0.02, 0.05, matTrim, wL - 0.03, winY, 0.02);
box(0.06, winH + 0.02, 0.05, matTrim, wR + 0.03, winY, 0.02);
box(0.035, winH, 0.04, matTrim, winX, winY, 0.015);
box(winW, 0.035, 0.04, matTrim, winX, winY, 0.015);
// sill
box(winW + 0.2, 0.05, 0.1, matTrim, winX, wB - 0.085, 0.04);

// ---------- Pitched gable roof with eaves overhang ----------
const slopeW = Math.hypot(W / 2, RIDGE_H - WALL_H) + EAVE;      // along the slope
const roofLen = D + EAVE * 2;                                     // along ridge (z)
const pitch = Math.atan2(RIDGE_H - WALL_H, W / 2);
function roofPanel(sign) {
  const panel = new THREE.Mesh(new THREE.BoxGeometry(slopeW + EAVE * 0.4, 0.07, roofLen), matRoof);
  panel.castShadow = panel.receiveShadow = true;
  const g = new THREE.Group();
  g.position.set(W / 2, RIDGE_H + 0.02, -D / 2);
  g.rotation.z = sign * pitch;
  panel.position.set(-sign * (slopeW + EAVE * 0.4) / 2 + sign * 0.02, 0.035, 0);
  g.add(panel);
  shed.add(g);
}
roofPanel(1);
roofPanel(-1);
// Ridge cap
const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.09, roofLen), new THREE.MeshStandardMaterial({ color: 0x4a4a52, roughness: 0.85 }));
ridge.position.set(W / 2, RIDGE_H + 0.08, -D / 2);
ridge.castShadow = true;
shed.add(ridge);

// Corner trim boards
for (const [x, z] of [[T / 2, 0.02], [W - T / 2, 0.02], [T / 2, -D - 0.02 + T], [W - T / 2, -D + T - 0.02]]) {
  box(0.1, WALL_H, 0.06, matTrim, x, WALL_H / 2, z > -1 ? 0.0 : -D);
}

// Small step in front of door
box(1.0, 0.09, 0.4, new THREE.MeshStandardMaterial({ color: 0x9a9a94, roughness: 0.95 }), doorX, 0.045, 0.22);

// ---------- Ground + soft shadow ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(16, 64),
  new THREE.MeshStandardMaterial({ color: 0x7d9159, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Extra soft contact-shadow blob
const shadCanvas = document.createElement('canvas');
shadCanvas.width = shadCanvas.height = 256;
const sg = shadCanvas.getContext('2d');
const grad = sg.createRadialGradient(128, 128, 20, 128, 128, 128);
grad.addColorStop(0, 'rgba(0,0,0,0.30)');
grad.addColorStop(1, 'rgba(0,0,0,0)');
sg.fillStyle = grad;
sg.fillRect(0, 0, 256, 256);
const shadTex = new THREE.CanvasTexture(shadCanvas);
const contact = new THREE.Mesh(
  new THREE.PlaneGeometry(W + 3.5, D + 3.5),
  new THREE.MeshBasicMaterial({ map: shadTex, transparent: true, depthWrite: false })
);
contact.rotation.x = -Math.PI / 2;
contact.position.set(W / 2, 0.005, -D / 2);
scene.add(contact);

// ---------- Resize + animate ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
