<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cyberpunk Hoverbike</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0d; overflow: hidden; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #7d8792; letter-spacing: .12em; text-transform: uppercase;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="hint">drag&nbsp;·&nbsp;orbit&nbsp;&nbsp;|&nbsp;&nbsp;scroll&nbsp;·&nbsp;zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0c10);
scene.fog = new THREE.FogExp2(0x0b0c10, 0.022);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 200);
camera.position.set(3.4, 1.75, 4.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.target.set(0, 0.72, 0);
controls.minDistance = 2.2;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.495;

/* ============================================================
   COLORS
   ============================================================ */
const C = {
  pink:    0xff1f7a,
  pinkDim: 0xc4145c,
  acid:    0x9dff2f,
  cyan:    0x2ff2ff,
  amber:   0xffa42b,
  carbon:  0x111318,
  carbon2: 0x1a1d24,
  metal:   0x53585f,
  darkMet: 0x2b2f36,
  rubber:  0x0d0e11,
  scav:    0x6d675c
};

/* ============================================================
   LIGHTING
   ============================================================ */
const hemi = new THREE.HemisphereLight(0x4a5b7a, 0x120a14, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xdfe9ff, 2.1);
key.position.set(4.2, 6.4, 3.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 22;
key.shadow.camera.left = -3.2;
key.shadow.camera.right = 3.2;
key.shadow.camera.top = 3.2;
key.shadow.camera.bottom = -3.2;
key.shadow.bias = -0.0008;
key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0x2b6bff, 0.55);
fill.position.set(-5.0, 2.2, 2.4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xff2f86, 1.15);
rim.position.set(-2.6, 1.8, -5.2);
scene.add(rim);

// practical glows tied to the bike's own emissives
const glowPinkA = new THREE.PointLight(C.pink, 3.0, 3.2, 2.0); glowPinkA.position.set(0.55, 0.85, 0.0);
const glowPinkB = new THREE.PointLight(C.pink, 2.2, 3.0, 2.0); glowPinkB.position.set(-0.75, 0.82, 0.0);
const glowThrust = new THREE.PointLight(C.cyan, 3.4, 2.6, 2.0); glowThrust.position.set(-0.55, 0.42, 0.0);
const glowAcid = new THREE.PointLight(C.acid, 1.5, 1.6, 2.0); glowAcid.position.set(0.95, 1.16, 0.0);
scene.add(glowPinkA, glowPinkB, glowThrust, glowAcid);

/* ============================================================
   GROUND — shadow catcher + faint grid
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.55 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(40, 80, 0x1c2734, 0x141a22);
grid.material.transparent = true;
grid.material.opacity = 0.35;
grid.material.depthWrite = false;
grid.position.y = 0.001;
scene.add(grid);

/* ============================================================
   MATERIAL LIBRARY
   ============================================================ */
const matCarbon = new THREE.MeshPhysicalMaterial({
  color: C.carbon, metalness: 0.55, roughness: 0.34,
  clearcoat: 0.85, clearcoatRoughness: 0.18
});
const matCarbonMatte = new THREE.MeshStandardMaterial({
  color: C.carbon2, metalness: 0.35, roughness: 0.72
});
const matMetal = new THREE.MeshStandardMaterial({
  color: C.metal, metalness: 0.95, roughness: 0.3
});
const matDarkMetal = new THREE.MeshStandardMaterial({
  color: C.darkMet, metalness: 0.85, roughness: 0.48
});
const matRubber = new THREE.MeshStandardMaterial({
  color: C.rubber, metalness: 0.1, roughness: 0.92
});
const matScav = new THREE.MeshStandardMaterial({
  color: C.scav, metalness: 0.8, roughness: 0.78
});
const matBolt = new THREE.MeshStandardMaterial({
  color: 0x9aa2ab, metalness: 1.0, roughness: 0.35
});
const matGlassDark = new THREE.MeshPhysicalMaterial({
  color: 0x05070a, metalness: 0.2, roughness: 0.08,
  clearcoat: 1.0, transmission: 0.35, thickness: 0.2,
  transparent: true, opacity: 0.85
});

function emissive(hex, intensity = 2.4, opacity = 1.0) {
  return new THREE.MeshStandardMaterial({
    color: 0x000000,
    emissive: hex,
    emissiveIntensity: intensity,
    roughness: 0.4,
    metalness: 0.0,
    transparent: opacity < 1.0,
    opacity: opacity,
    toneMapped: true
  });
}
const matPinkStrip = emissive(C.pink, 3.2);
const matPinkStripSoft = emissive(C.pink, 1.6);
const matAcid = emissive(C.acid, 2.6);
const matCyan = emissive(C.cyan, 3.4);
const matAmber = emissive(C.amber, 2.4);

/* ============================================================
   PROCEDURAL CANVAS TEXTURES (decal glyphs / holo readout)
   ============================================================ */
function makeCanvas(w, h) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  return cv;
}

// Taped-on decal: dirty tape strip with cryptic glyph block
function makeDecalTexture(seed, tint) {
  const w = 256, h = 128;
  const cv = makeCanvas(w, h);
  const g = cv.getContext('2d');
  // tape base
  g.fillStyle = '#d9d3c4';
  g.fillRect(0, 0, w, h);
  // grime blotches
  let s = seed;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 0; i < 90; i++) {
    const r = 4 + rnd() * 26;
    g.fillStyle = `rgba(${90 + rnd() * 60 | 0},${85 + rnd() * 50 | 0},${75 + rnd() * 40 | 0},${0.05 + rnd() * 0.12})`;
    g.beginPath();
    g.arc(rnd() * w, rnd() * h, r, 0, Math.PI * 2);
    g.fill();
  }
  // torn edges (top/bottom nibbles)
  g.fillStyle = 'rgba(0,0,0,0)';
  g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 26; i++) {
    g.beginPath();
    g.arc(rnd() * w, rnd() < 0.5 ? 0 : h, 3 + rnd() * 9, 0, Math.PI * 2);
    g.fill();
  }
  g.globalCompositeOperation = 'source-over';
  // glyph block
  g.fillStyle = tint;
  const glyphs = '\u30a2\u30ab\u30b5\u30bf\u30ca\u30cf\u30de\u30e4\u30e9\u30ef\u30f3\u30f6';
  const latin = 'XZ7\u00d84K9\u00c6VN2';
  g.font = 'bold 42px monospace';
  g.textBaseline = 'middle';
  for (let i = 0; i < 5; i++) {
    const ch = (rnd() < 0.55)
      ? glyphs[(rnd() * glyphs.length) | 0]
      : latin[(rnd() * latin.length) | 0];
    g.save();
    g.translate(22 + i * 45, h * 0.5 + (rnd() - 0.5) * 10);
    g.rotate((rnd() - 0.5) * 0.18);
    g.fillText(ch, -16, 0);
    g.restore();
  }
  // hazard stripe along bottom
  g.globalAlpha = 0.75;
  for (let x = -h; x < w; x += 22) {
    g.fillStyle = (((x / 22) | 0) % 2 === 0) ? '#171717' : tint;
    g.beginPath();
    g.moveTo(x, h);
    g.lineTo(x + 11, h);
    g.lineTo(x + 11 + 14, h - 14);
    g.lineTo(x + 14, h - 14);
    g.closePath();
    g.fill();
  }
  g.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

// Stencilled serial / warning block printed straight onto fairing
function makeStencilTexture(text, color) {
  const w = 512, h = 128;
  const cv = makeCanvas(w, h);
  const g = cv.getContext('2d');
  g.clearRect(0, 0, w, h);
  g.fillStyle = color;
  g.font = 'bold 74px ui-monospace, monospace';
  g.textBaseline = 'middle';
  g.textAlign = 'center';
  g.globalAlpha = 0.92;
  g.fillText(text, w / 2, h / 2);
  // scuff it up
  g.globalCompositeOperation = 'destination-out';
  let s = 1337;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 0; i < 120; i++) {
    g.beginPath();
    g.arc(rnd() * w, rnd() * h, rnd() * 7, 0, Math.PI * 2);
    g.fill();
  }
  g.globalCompositeOperation = 'source-over';
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}

// Holographic instrument sliver content (acid green HUD)
function makeHudTexture() {
  const w = 512, h = 256;
  const cv = makeCanvas(w, h);
  const g = cv.getContext('2d');
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;

  const A = '#a8ff35';
  function draw(t) {
    g.clearRect(0, 0, w, h);

    // scanlines
    g.globalAlpha = 0.18;
    g.fillStyle = A;
    for (let y = 0; y < h; y += 4) g.fillRect(0, y, w, 1);
    g.globalAlpha = 1;

    // frame brackets
    g.strokeStyle = A; g.lineWidth = 3; g.globalAlpha = 0.85;
    const pad = 12, cLen = 44;
    const corners = [[pad, pad, 1, 1], [w - pad, pad, -1, 1], [pad, h - pad, 1, -1], [w - pad, h - pad, -1, -1]];
    for (const [x, y, sx, sy] of corners) {
      g.beginPath();
      g.moveTo(x + sx * cLen, y);
      g.lineTo(x, y);
      g.lineTo(x, y + sy * cLen);
      g.stroke();
    }

    // big speed number
    const spd = 180 + Math.round(58 * (0.5 + 0.5 * Math.sin(t * 0.9)) + 6 * Math.sin(t * 5.3));
    g.globalAlpha = 0.98;
    g.fillStyle = A;
    g.font = 'bold 96px ui-monospace, monospace';
    g.textBaseline = 'alphabetic';
    g.textAlign = 'left';
    g.fillText(String(spd).padStart(3, '0'), 42, 132);
    g.font = 'bold 26px ui-monospace, monospace';
    g.fillText('KPH', 232, 132);

    // sub labels
    g.font = 'bold 22px ui-monospace, monospace';
    g.globalAlpha = 0.8;
    g.fillText('THR', 42, 176);
    g.fillText('LIFT', 42, 210);

    // bars
    const thr = 0.55 + 0.42 * (0.5 + 0.5 * Math.sin(t * 1.7));
    const lift = 0.62 + 0.30 * (0.5 + 0.5 * Math.sin(t * 1.1 + 2.0));
    function bar(y, v) {
      g.globalAlpha = 0.28;
      g.fillRect(112, y, 240, 16);
      g.globalAlpha = 0.95;
      g.fillRect(112, y, 240 * v, 16);
      g.globalAlpha = 0.6;
      for (let i = 0; i <= 8; i++) g.fillRect(112 + i * 30, y - 5, 2, 5);
    }
    bar(160, thr);
    bar(194, lift);

    // right side: rolling telemetry sparkline
    g.globalAlpha = 0.9;
    g.strokeStyle = A; g.lineWidth = 2.5;
    g.beginPath();
    for (let i = 0; i <= 60; i++) {
      const x = 300 + i * 3.2;
      const yv = 70 + Math.sin(i * 0.42 + t * 3.1) * 16 + Math.sin(i * 1.31 + t * 1.7) * 7;
      i === 0 ? g.moveTo(x, yv) : g.lineTo(x, yv);
    }
    g.stroke();

    // status glyph row
    g.font = 'bold 20px ui-monospace, monospace';
    g.globalAlpha = 0.55 + 0.45 * (Math.sin(t * 4.0) > -0.2 ? 1 : 0.2);
    g.textAlign = 'right';
    g.fillText('\u25b2 GRID-LOCK  \u25cf NAV \u00b7 7\u00b73\u00b71', w - 26, 226);
    g.textAlign = 'left';
    g.globalAlpha = 1;

    tex.needsUpdate = true;
  }
  draw(0);
  return { tex, draw };
}

/* ============================================================
   HELPERS
   ============================================================ */
function mesh(geo, mat, cast = true, receive = false) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast;
  m.receiveShadow = receive;
  return m;
}

// Lathe-style extruded panel from a 2D outline (side profile pieces)
function panel(points2D, depth, mat, bevel = 0.012) {
  const shape = new THREE.Shape();
  shape.moveTo(points2D[0][0], points2D[0][1]);
  for (let i = 1; i < points2D.length; i++) shape.lineTo(points2D[i][0], points2D[i][1]);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: depth,
    bevelEnabled: bevel > 0,
    bevelThickness: bevel,
    bevelSize: bevel,
    bevelSegments: 3,
    curveSegments: 12
  });
  geo.translate(0, 0, -depth / 2);
  return mesh(geo, mat);
}

// Tube from a list of Vector3 (cable looms)
function cable(pts, radius, mat, seg = 64) {
  const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], p[1], p[2])));
  const geo = new THREE.TubeGeometry(curve, seg, radius, 8, false);
  return mesh(geo, mat);
}

function bolt(x, y, z, r = 0.014, rot = [0, 0, Math.PI / 2]) {
  const b = mesh(new THREE.CylinderGeometry(r, r, 0.02, 6), matBolt);
  b.position.set(x, y, z);
  b.rotation.set(rot[0], rot[1], rot[2]);
  return b;
}

/* ============================================================
   BIKE ROOT
   ============================================================
   Coordinate convention:
     +X = forward (nose)   -X = tail
     +Y = up
     ±Z = left / right
   Overall length ≈ 2.35 m, height ≈ 1.25 m. Realistic single-seat scale.
*/
const bike = new THREE.Group();
scene.add(bike);

const frame = new THREE.Group();          // everything that shares the forward cant
frame.rotation.z = 0.0;
bike.add(frame);

/* ---------- 1. MAIN SPINE / CHASSIS BEAM (forward-canted) ---------- */
const spine = new THREE.Group();
spine.rotation.z = THREE.MathUtils.degToRad(9); // nose pitched down => forward cant
spine.position.set(0, 0.86, 0);
frame.add(spine);

// central structural box beam
{
  const beam = mesh(new THREE.BoxGeometry(1.72, 0.13, 0.19), matDarkMetal);
  beam.position.set(0.02, 0.0, 0);
  spine.add(beam);

  // beam lightening cut-outs (holes suggested by inset dark plates)
  for (let i = -2; i <= 2; i++) {
    const cut = mesh(new THREE.BoxGeometry(0.13, 0.085, 0.205), matRubber, false);
    cut.position.set(i * 0.24, 0, 0);
    spine.add(cut);
  }

  // upper spine rail with pink light channel
  const rail = mesh(new THREE.BoxGeometry(1.44, 0.05, 0.115), matCarbon);
  rail.position.set(0.06, 0.09, 0);
  spine.add(rail);
  const railGlow = mesh(new THREE.BoxGeometry(1.40, 0.016, 0.055), matPinkStrip, false);
  railGlow.position.set(0.06, 0.118, 0);
  spine.add(railGlow);
}

/* ---------- 2. NOSE / FRONT FAIRING ---------- */
{
  const noseGrp = new THREE.Group();
  noseGrp.position.set(0.86, 0.02, 0);
  spine.add(noseGrp);

  // Prow: tapered wedge built from a lathe-free custom profile
  const prowProfile = [
    [0.00, -0.13], [0.30, -0.115], [0.55, -0.055],
    [0.62, 0.02], [0.50, 0.115], [0.22, 0.165], [0.00, 0.17]
  ];
  const prow = panel(prowProfile, 0.30, matCarbon, 0.02);
  prow.rotation.y = 0;
  noseGrp.add(prow);

  // side cheeks that taper the prow to a knife edge
  for (const s of [1, -1]) {
    const cheekProfile = [
      [0.00, -0.13], [0.32, -0.11], [0.58, -0.05], [0.62, 0.02], [0.48, 0.12], [0.00, 0.16]
    ];
    const cheek = panel(cheekProfile, 0.055, matCarbon, 0.014);
    cheek.position.z = s * 0.175;
    cheek.rotation.x = 0;
    cheek.scale.set(0.96, 0.93, 1);
    noseGrp.add(cheek);

    // hot-pink slash strip along the fairing flank
    const slash = mesh(new THREE.BoxGeometry(0.52, 0.022, 0.012), matPinkStrip, false);
    slash.position.set(0.27, 0.015, s * 0.207);
    slash.rotation.z = THREE.MathUtils.degToRad(-7);
    noseGrp.add(slash);

    // second thinner slash below
    const slash2 = mesh(new THREE.BoxGeometry(0.34, 0.012, 0.010), matPinkStripSoft, false);
    slash2.position.set(0.20, -0.055, s * 0.205);
    slash2.rotation.z = THREE.MathUtils.degToRad(-5);
    noseGrp.add(slash2);
  }

  // headlight bar recessed in the prow tip
  const lampHousing = mesh(new THREE.BoxGeometry(0.07, 0.055, 0.20), matDarkMetal);
  lampHousing.position.set(0.575, 0.005, 0);
  noseGrp.add(lampHousing);
  const lamp = mesh(new THREE.BoxGeometry(0.022, 0.032, 0.165), emissive(0xfff0d8, 3.2), false);
  lamp.position.set(0.612, 0.005, 0);
  noseGrp.add(lamp);

  const lampLight = new THREE.SpotLight(0xffe9c8, 6.0, 6.5, 0.5, 0.65, 1.6);
  lampLight.position.set(0.62, 0.01, 0);
  lampLight.target.position.set(4.0, -0.5, 0);
  noseGrp.add(lampLight, lampLight.target);

  // chin sensor pod
  const chin = mesh(new THREE.CylinderGeometry(0.045, 0.055, 0.14, 12), matDarkMetal);
  chin.rotation.z = Math.PI / 2;
  chin.position.set(0.44, -0.115, 0);
  noseGrp.add(chin);
  const chinEye = mesh(new THREE.CircleGeometry(0.032, 16), matCyan, false);
  chinEye.rotation.y = Math.PI / 2;
  chinEye.position.set(0.515, -0.115, 0);
  noseGrp.add(chinEye);

  // taped-on decal glyph plates on the nose flanks
  const decalTex = makeDecalTexture(9137, '#ff2f86');
  const decalMat = new THREE.MeshStandardMaterial({
    map: decalTex, transparent: true, roughness: 0.85, metalness: 0.05,
    side: THREE.DoubleSide, alphaTest: 0.02
  });
  for (const s of [1, -1]) {
    const d = mesh(new THREE.PlaneGeometry(0.26, 0.13), decalMat, false);
    d.position.set(0.16, 0.075, s * 0.213);
    d.rotation.y = s > 0 ? 0 : Math.PI;
    d.rotation.x = 0;
    d.rotation.z = THREE.MathUtils.degToRad(s > 0 ? -6 : 6) * 0 + THREE.MathUtils.degToRad(-6);
    noseGrp.add(d);
  }
}

/* ---------- 3. MID FAIRING / TANK SHROUD ---------- */
{
  const tankGrp = new THREE.Group();
  tankGrp.position.set(0.28, 0.10, 0);
  spine.add(tankGrp);

  // tank body: chamfered box via lathe-ish scaled octagon
  const tankGeo = new THREE.CylinderGeometry(0.155, 0.135, 0.62, 8, 1, false);
  const tank = mesh(tankGeo, matCarbon);
  tank.rotation.z = Math.PI / 2;
  tank.rotation.y = Math.PI / 8;
  tank.scale.set(1.0, 1.0, 0.82);
  tankGrp.add(tank);

  // top spine cap
  const cap = mesh(new THREE.BoxGeometry(0.5, 0.035, 0.15), matCarbonMatte);
  cap.position.set(-0.02, 0.14, 0);
  tankGrp.add(cap);

  // fuel/cell filler
  const filler = mesh(new THREE.CylinderGeometry(0.042, 0.042, 0.03, 12), matMetal);
  filler.position.set(0.12, 0.16, 0);
  tankGrp.add(filler);
  const fillerRing = mesh(new THREE.TorusGeometry(0.048, 0.007, 8, 20), matPinkStripSoft, false);
  fillerRing.position.set(0.12, 0.172, 0);
  fillerRing.rotation.x = Math.PI / 2;
  tankGrp.add(fillerRing);

  // hot pink light strips slashing the tank flanks
  for (const s of [1, -1]) {
    const strip = mesh(new THREE.BoxGeometry(0.50, 0.026, 0.012), matPinkStrip, false);
    strip.position.set(-0.01, 0.02, s * 0.132);
    strip.rotation.z = THREE.MathUtils.degToRad(6);
    tankGrp.add(strip);

    const strip2 = mesh(new THREE.BoxGeometry(0.30, 0.014, 0.010), matPinkStripSoft, false);
    strip2.position.set(-0.10, -0.055, s * 0.136);
    strip2.rotation.z = THREE.MathUtils.degToRad(10);
    tankGrp.add(strip2);
  }

  // stencilled serial across the tank top
  const stencilTex = makeStencilTexture('K-77 \u00b7 NOX', '#e9edf2');
  const stencilMat = new THREE.MeshStandardMaterial({
    map: stencilTex, transparent: true, roughness: 0.9, metalness: 0.0,
    depthWrite: false, alphaTest: 0.02
  });
  const stencil = mesh(new THREE.PlaneGeometry(0.42, 0.105), stencilMat, false);
  stencil.rotation.x = -Math.PI / 2;
  stencil.position.set(-0.05, 0.159, 0);
  tankGrp.add(stencil);
}

/* ---------- 4. SEAT / TAIL ---------- */
{

/* ---------- 7. TWIN DUCTED THRUST PODS (beneath the frame) ---------- */
const podFans = [];
const podGlows = [];

function buildThrustPod(sign) {
  const pod = new THREE.Group();

  // outer duct shroud
  const shroud = mesh(new THREE.CylinderGeometry(0.20, 0.215, 0.40, 24, 1, true), matCarbon, true, true);
  shroud.rotation.z = Math.PI / 2;
  pod.add(shroud);

  // inner duct liner (dark)
  const liner = mesh(new THREE.CylinderGeometry(0.172, 0.185, 0.395, 24, 1, true), matCarbonMatte, false, true);
  liner.rotation.z = Math.PI / 2;
  liner.material = new THREE.MeshStandardMaterial({
    color: 0x0c0e12, metalness: 0.6, roughness: 0.5, side: THREE.BackSide
  });
  pod.add(liner);

  // intake lip torus (front) & exhaust lip (rear)
  const lipF = mesh(new THREE.TorusGeometry(0.203, 0.020, 10, 28), matDarkMetal);
  lipF.position.x = 0.20; lipF.rotation.y = Math.PI / 2;
  pod.add(lipF);
  const lipR = mesh(new THREE.TorusGeometry(0.212, 0.022, 10, 28), matDarkMetal);
  lipR.position.x = -0.20; lipR.rotation.y = Math.PI / 2;
  pod.add(lipR);

  // hot-pink light ring on the intake lip
  const ringF = mesh(new THREE.TorusGeometry(0.208, 0.008, 8, 32), matPinkStrip, false);
  ringF.position.x = 0.215; ringF.rotation.y = Math.PI / 2;
  pod.add(ringF);

  // stator vanes (fixed) at the rear
  for (let i = 0; i < 7; i++) {
    const v = mesh(new THREE.BoxGeometry(0.05, 0.165, 0.012), matDarkMetal);
    v.position.x = -0.13;
    v.rotation.x = (i / 7) * Math.PI * 2;
    v.position.y = Math.cos((i / 7) * Math.PI * 2) * 0.093;
    v.position.z = Math.sin((i / 7) * Math.PI * 2) * 0.093;
    pod.add(v);
  }

  // spinning rotor assembly
  const rotor = new THREE.Group();
  rotor.position.x = 0.06;
  const hub = mesh(new THREE.CylinderGeometry(0.045, 0.05, 0.12, 14), matMetal);
  hub.rotation.z = Math.PI / 2;
  rotor.add(hub);
  const nose = mesh(new THREE.ConeGeometry(0.045, 0.08, 14), matMetal);
  nose.position.x = 0.10; nose.rotation.z = -Math.PI / 2;
  rotor.add(nose);

  const bladeGeo = new THREE.BoxGeometry(0.055, 0.145, 0.010);
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * Math.PI * 2;
    const b = mesh(bladeGeo, matMetal, true);
    b.position.set(0, Math.cos(a) * 0.105, Math.sin(a) * 0.105);
    b.rotation.x = a;
    b.rotation.y = THREE.MathUtils.degToRad(26);
    rotor.add(b);
  }
  pod.add(rotor);
  podFans.push(rotor);

  // exhaust glow disc + inner core
  const gm = new THREE.MeshBasicMaterial({
    color: C.cyan, transparent: true, opacity: 0.55,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false
  });
  const gdisc = new THREE.Mesh(new THREE.CircleGeometry(0.175, 28), gm);
  gdisc.position.x = -0.185;
  gdisc.rotation.y = -Math.PI / 2;
  pod.add(gdisc);
  podGlows.push(gm);

  const coreM = new THREE.MeshBasicMaterial({
    color: 0xd6fbff, transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false
  });
  const core = new THREE.Mesh(new THREE.CircleGeometry(0.095, 24), coreM);
  core.position.x = -0.191;
  core.rotation.y = -Math.PI / 2;
  pod.add(core);

  // downwash plume cone toward the ground
  const plumeM = new THREE.MeshBasicMaterial({
    color: 0x36d8ff, transparent: true, opacity: 0.10,
    blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, toneMapped: false
  });
  const plume = new THREE.Mesh(new THREE.CylinderGeometry(0.155, 0.30, 0.44, 20, 1, true), plumeM);
  plume.position.set(0, -0.31, 0);
  plume.name = 'plume';
  pod.add(plume);

  // exterior casing details: cooling ribs + service hatch
  for (let i = -1; i <= 1; i++) {
    const rib = mesh(new THREE.TorusGeometry(0.207, 0.007, 6, 24), matCarbonMatte);
    rib.position.x = i * 0.09;
    rib.rotation.y = Math.PI / 2;
    pod.add(rib);
  }
  const hatch = mesh(new THREE.BoxGeometry(0.20, 0.03, 0.11), matCarbonMatte);
  hatch.position.set(0.0, 0.198, sign * 0.02);
  pod.add(hatch);
  for (const dx of [-0.075, 0.075]) pod.add(bolt(dx, 0.214, sign * 0.02, 0.010, [0, 0, 0]));

  // pylon mounting the pod to the spine
  const pylon = mesh(new THREE.BoxGeometry(0.10, 0.30, 0.055), matDarkMetal);
  pylon.position.set(0.0, 0.30, 0);
  pylon.rotation.z = THREE.MathUtils.degToRad(sign * 0);
  pod.add(pylon);
  const pylonGlow = mesh(new THREE.BoxGeometry(0.012, 0.24, 0.014), matPinkStripSoft, false);
  pylonGlow.position.set(0.038, 0.30, sign * 0.030);
  pod.add(pylonGlow);

  // gimbal ring where pylon meets pod
  const gim = mesh(new THREE.TorusGeometry(0.055, 0.014, 8, 18), matMetal);
  gim.position.set(0, 0.185, 0);
  gim.rotation.x = Math.PI / 2;
  pod.add(gim);

  return pod;
}

  const loomA = [

  const loomB = [

    [0.14, -0.20, -0.17], [0.04, -0.33, -0.23], [0.02, -0.43, -0.28]
  ];
  // tail-to-pod power runs
  const loomC = [
    [-0.62, 0.05, 0.07], [-0.46, -0.06, 0.11], [-0.28, -0.18, 0.16],
    [-0.12, -0.32, 0.24], [-0.02, -0.42, 0.29]
  ];
  const loomD = [
    [-0.60, 0.02, -0.06], [-0.44, -0.10, -0.10], [-0.26, -0.22, -0.15],
    [-0.10, -0.34, -0.23], [-0.01, -0.43, -0.29]
  ];
  // sagging free loop between the two pods (classic scavenger look)
  const loomE = [
    [0.14, -0.40, 0.30], [0.16, -0.62, 0.16], [0.15, -0.66, 0.0],
    [0.16, -0.62, -0.16], [0.14, -0.40, -0.30]
  ];
  // secondary spine loom running along the beam underside
  const loomF = [
    [0.60, -0.09, 0.0], [0.30, -0.14, 0.03], [0.0, -0.15, 0.04],
    [-0.30, -0.13, 0.02], [-0.56, -0.06, 0.0]
  ];

  const looms = [
    [loomA, 0.016, 0], [loomA.map(p => [p[0], p[1] - 0.022, p[2] + 0.016]), 0.010, 1],
    [loomB, 0.015, 0], [loomB.map(p => [p[0], p[1] - 0.020, p[2] - 0.015]), 0.009, 2],
    [loomC, 0.014, 0], [loomC.map(p => [p[0] - 0.02, p[1] - 0.018, p[2] + 0.014]), 0.008, 3],
    [loomD, 0.013, 0], [loomD.map(p => [p[0] - 0.02, p[1] - 0.018, p[2] - 0.013]), 0.008, 1],
    [loomE, 0.012, 2], [loomE.map(p => [p[0] - 0.045, p[1] - 0.012, p[2]]), 0.009, 1],
    [loomF, 0.011, 3]
  ];
  for (const [pts, r, mi] of looms) {
    spine.add(cable(pts, r, loomMats[mi]));
  }

  // zip-tie clamps binding the looms at intervals
  const tiePts = [
    [0.52, 0.08, 0.11], [0.18, -0.17, 0.155], [0.50, 0.06, -0.12], [0.14, -0.21, -0.175],
    [-0.44, -0.07, 0.11], [-0.26, -0.23, -0.155], [0.15, -0.655, 0.0], [0.0, -0.16, 0.04]
  ];
  for (const [tx, ty, tz] of tiePts) {
    const t = mesh(new THREE.TorusGeometry(0.024, 0.006, 6, 14), matCarbonMatte);
    t.position.set(tx, ty, tz);
    t.rotation.y = Math.PI / 2;
    t.rotation.z = THREE.MathUtils.degToRad(20);
    spine.add(t);
  }

  // glowing data-line accents woven through the loom
  const dataMat = emissive(C.pink, 2.0);
  const dataA = cable([
    [0.64, 0.20, 0.10], [0.46, 0.04, 0.13], [0.24, -0.12, 0.16], [0.06, -0.28, 0.22], [0.02, -0.40, 0.28]
  ], 0.0045, dataMat);
  dataA.castShadow = false;
  const dataB = cable([
    [-0.58, 0.00, -0.07], [-0.40, -0.13, -0.12], [-0.20, -0.26, -0.18], [-0.02, -0.41, -0.28]
  ], 0.0045, dataMat);
  dataB.castShadow = false;
  spine.add(dataA, dataB);
}

/* ---------- 11. UNDER-CHASSIS HOVER FIELD EMITTERS ---------- */
{
  const emitMat = new THREE.MeshBasicMaterial({
    color: 0x3fdcff, transparent: true, opacity: 0.30,
    blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false
  });
  for (const x of [0.52, -0.44]) {
    const pad = mesh(new THREE.CylinderGeometry(0.075, 0.062, 0.05, 14), matDarkMetal);
    pad.position.set(x, -0.135, 0);
    spine.add(pad);
    const halo = new THREE.Mesh(new THREE.CircleGeometry(0.072, 20), emitMat);
    halo.position.set(x, -0.163, 0);
    halo.rotation.x = -Math.PI / 2;
    spine.add(halo);
  }
}

/* ---------- 12. GROUND REFLECTION POOLS (fake bloom on the deck) ---------- */
const pools = new THREE.Group();
{
  function pool(color, radius, opacity) {
    const cv = makeCanvas(128, 128);
    const g = cv.getContext('2d');
    const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    const c = new THREE.Color(color);
    const rgb = `${(c.r * 255) | 0},${(c.g * 255) | 0},${(c.b * 255) | 0}`;
    grd.addColorStop(0, `rgba(${rgb},1)`);
    grd.addColorStop(0.45, `rgba(${rgb},0.35)`);
    grd.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = grd;
    g.fillRect(0, 0, 128, 128);
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(radius * 2, radius * 2),
      new THREE.MeshBasicMaterial({
        map: tex, transparent: true, opacity, blending: THREE.AdditiveBlending,
        depthWrite: false, toneMapped: false
      })
    );
    m.rotation.x = -Math.PI / 2;
    return m;
  }
  const p1 = pool(0x2ff2ff, 0.62, 0.42); p1.position.set(0.05, 0.004, 0.32);
  const p2 = pool(0x2ff2ff, 0.62, 0.42); p2.position.set(0.05, 0.004, -0.32);
  const p3 = pool(0xff1f7a, 1.05, 0.20); p3.position.set(0.05, 0.003, 0);
  pools.add(p1, p2, p3);
  scene.add(pools);
}

/* ============================================================
   FINAL PLACEMENT — center the bike, hover it off the deck
   ============================================================ */
bike.position.y = 0.0;

// Compute bounds and recenter horizontally so orbit stays on the object
{
  const box = new THREE.Box3().setFromObject(bike);
  const center = new THREE.Vector3();
  box.getCenter(center);
  frame.position.x -= center.x;
  frame.position.z -= center.z;
  const box2 = new THREE.Box3().setFromObject(bike);
  controls.target.set(0, (box2.min.y + box2.max.y) * 0.5, 0);
}

/* ============================================================
   ANIMATION
   ============================================================ */
const clock = new THREE.Clock();
const scanBar = holo.getObjectByName('scan');
const plumes = [];
bike.traverse(o => { if (o.name === 'plume') plumes.push(o); });

function animate() {
  const t = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta(), 0.05);

  // idle hover bob + subtle roll/pitch drift
  const bob = Math.sin(t * 1.25) * 0.022 + Math.sin(t * 2.7) * 0.006;
  bike.position.y = 0.10 + bob;
  bike.rotation.z = Math.sin(t * 0.9) * 0.012;
  bike.rotation.x = Math.sin(t * 0.66 + 1.2) * 0.010;

  // rotors
  for (let i = 0; i < podFans.length; i++) {
    podFans[i].rotation.x += (i === 0 ? 26 : -26) * dt;
  }

  // thrust flicker
  const flick = 0.48 + 0.16 * Math.sin(t * 7.3) + 0.08 * Math.sin(t * 17.1);
  for (const gm of podGlows) gm.opacity = flick;
  for (const p of plumes) {
    p.material.opacity = 0.075 + 0.045 * (0.5 + 0.5 * Math.sin(t * 5.1));
    p.scale.y = 1.0 + 0.10 * Math.sin(t * 3.3);
  }
  glowThrust.intensity = 2.6 + 1.1 * Math.sin(t * 6.1);

  // pink strip breathing
  const pulse = 2.9 + 0.55 * Math.sin(t * 1.9);
  matPinkStrip.emissiveIntensity = pulse;
  matPinkStripSoft.emissiveIntensity = pulse * 0.5;
  glowPinkA.intensity = 2.4 + 0.7 * Math.sin(t * 1.9);
  glowPinkB.intensity = 1.9 + 0.5 * Math.sin(t * 1.9 + 0.8);

  // holo HUD
  hud.draw(t);
  if (scanBar) {
    scanBar.position.y = Math.sin(t * 1.1) * 0.075;
    scanBar.material.opacity = 0.22 + 0.20 * (0.5 + 0.5 * Math.sin(t * 6.0));
  }
  holo.rotation.z = Math.sin(t * 0.8) * 0.012;
  holo.position.y = 0.24 + Math.sin(t * 1.6) * 0.006;

  // ground pools track the bike's sway
  pools.position.x = bike.position.x + Math.sin(t * 0.9) * 0.01;
  pools.rotation.y = bike.rotation.y;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();

/* ============================================================
   RESIZE
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
