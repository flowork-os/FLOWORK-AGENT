<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Potted Cactus</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eef0f2; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef0f2);
scene.fog = new THREE.Fog(0xeef0f2, 12, 30);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.2, 2.4, 4.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 2.5;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.55;

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0xdfeaff, 0x8a7060, 0.7));

const sun = new THREE.DirectionalLight(0xfff2e0, 1.6);
sun.position.set(4, 6, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -4; sun.shadow.camera.right = 4;
sun.shadow.camera.top = 4;   sun.shadow.camera.bottom = -4;
sun.shadow.camera.near = 1;  sun.shadow.camera.far = 15;
sun.shadow.radius = 6;
sun.shadow.bias = -0.0004;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xbfd4ff, 0.35);
fill.position.set(-4, 3, -3);
scene.add(fill);

// ---------- Ground (soft shadow catcher) ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 48),
  new THREE.MeshStandardMaterial({ color: 0xe4e6e9, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- Potted cactus group ----------
const plant = new THREE.Group();
scene.add(plant);

// --- Terracotta pot (separate part: tapered body + rim, hollow look) ---
const terracotta = new THREE.MeshStandardMaterial({ color: 0xb5622f, roughness: 0.85, metalness: 0.02 });
const terracottaDark = new THREE.MeshStandardMaterial({ color: 0x9c5226, roughness: 0.9 });

const pot = new THREE.Group();
const potBody = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.44, 0.72, 48, 1, true), terracotta);
potBody.position.y = 0.36;
const potBase = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.42, 0.04, 48), terracottaDark);
potBase.position.y = 0.02;
const potRim = new THREE.Mesh(new THREE.CylinderGeometry(0.68, 0.68, 0.16, 48, 1, true), terracotta);
potRim.position.y = 0.78;
const potRimTop = new THREE.Mesh(new THREE.TorusGeometry(0.655, 0.028, 16, 48), terracotta);
potRimTop.rotation.x = Math.PI / 2;
potRimTop.position.y = 0.86;
const potRimBottom = new THREE.Mesh(new THREE.TorusGeometry(0.655, 0.026, 16, 48), terracotta);
potRimBottom.rotation.x = Math.PI / 2;
potRimBottom.position.y = 0.70;
const potInner = new THREE.Mesh(
  new THREE.CylinderGeometry(0.6, 0.5, 0.5, 48, 1, true),
  new THREE.MeshStandardMaterial({ color: 0x7e421f, roughness: 0.95, side: THREE.BackSide })
);
potInner.position.y = 0.6;
pot.add(potBody, potBase, potRim, potRimTop, potRimBottom, potInner);
pot.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
plant.add(pot);

// --- Packed soil (slightly domed disc with grainy bumps) ---
const soilGeo = new THREE.CylinderGeometry(0.585, 0.585, 0.1, 48, 1);
const sp = soilGeo.attributes.position;
for (let i = 0; i < sp.count; i++) {
  const x = sp.getX(i), y = sp.getY(i), z = sp.getZ(i);
  if (y > 0) {
    const r = Math.hypot(x, z);
    const dome = 0.05 * Math.cos(Math.min(r / 0.585, 1) * Math.PI * 0.5);
    const grain = 0.012 * Math.sin(x * 41.7) * Math.cos(z * 37.3);
    sp.setY(i, y + dome + grain);
  }
}
soilGeo.computeVertexNormals();
const soil = new THREE.Mesh(soilGeo, new THREE.MeshStandardMaterial({ color: 0x4a3526, roughness: 1 }));
soil.position.y = 0.82;
soil.castShadow = true;
soil.receiveShadow = true;
plant.add(soil);

// --- Ribbed globular cactus body (displaced sphere) ---
const RIBS = 10;
const bodyGeo = new THREE.SphereGeometry(0.52, 128, 64);
const bp = bodyGeo.attributes.position;
const v = new THREE.Vector3();
for (let i = 0; i < bp.count; i++) {
  v.fromBufferAttribute(bp, i);
  const theta = Math.atan2(v.z, v.x);
  const polar = Math.acos(THREE.MathUtils.clamp(v.y / 0.52, -1, 1));
  const fade = Math.sin(polar);                       // ribs vanish at poles
  const rib = Math.pow(Math.abs(Math.sin(theta * RIBS * 0.5)), 0.7);
  const scale = 1 + 0.085 * (rib - 0.5) * fade;
  v.multiplyScalar(scale);
  v.y *= 1.12;                                        // gently squashed globe
  bp.setXYZ(i, v.x, v.y, v.z);
}
bodyGeo.computeVertexNormals();
const cactusMat = new THREE.MeshStandardMaterial({ color: 0x3f7d3a, roughness: 0.65, metalness: 0.0 });
const body = new THREE.Mesh(bodyGeo, cactusMat);
body.position.y = 1.36;
body.castShadow = true;
body.receiveShadow = true;
plant.add(body);

// tiny crown tuft at the apex
const crown = new THREE.Mesh(
  new THREE.SphereGeometry(0.085, 16, 12),
  new THREE.MeshStandardMaterial({ color: 0xd8cfae, roughness: 1 })
);
crown.scale.y = 0.55;
crown.position.set(0, 1.36 + 0.52 * 1.12 - 0.01, 0);
crown.castShadow = true;
plant.add(crown);

// --- Spine clusters: areoles along each rib crest with tiny radiating spines ---
const areoleGeo = new THREE.SphereGeometry(0.028, 8, 6);
const areoleMat = new THREE.MeshStandardMaterial({ color: 0xe8e2c8, roughness: 1 });
const spineGeo = new THREE.CylinderGeometry(0.0035, 0.001, 0.11, 4);
spineGeo.translate(0, 0.055, 0);
const spineMat = new THREE.MeshStandardMaterial({ color: 0xf2ecd8, roughness: 0.9 });

const bodyR = 0.52, ROWS = 4;
const up = new THREE.Vector3(0, 1, 0), q = new THREE.Quaternion();
for (let ribI = 0; ribI < RIBS; ribI++) {
  const theta = ((ribI + 0.5) / RIBS) * Math.PI * 2;   // rib crest angle
  for (let rowI = 0; rowI < ROWS; rowI++) {
    const polar = THREE.MathUtils.lerp(0.32, 0.78, rowI / (ROWS - 1)) * Math.PI;
    const fade = Math.sin(polar);
    const rr = bodyR * (1 + 0.085 * 0.5 * fade);       // crest radius
    const n = new THREE.Vector3(
      Math.cos(theta) * Math.sin(polar),
      Math.cos(polar) * 1.12,
      Math.sin(theta) * Math.sin(polar)
    ).normalize();
    const pos = new THREE.Vector3(
      rr * Math.cos(theta) * Math.sin(polar),
      rr * Math.cos(polar) * 1.12 + 1.36,
      rr * Math.sin(theta) * Math.sin(polar)
    );
    const cluster = new THREE.Group();
    cluster.position.copy(pos).addScaledVector(n, 0.004);
    q.setFromUnitVectors(up, n);
    cluster.quaternion.copy(q);
    const areole = new THREE.Mesh(areoleGeo, areoleMat);
    areole.scale.y = 0.5;
    cluster.add(areole);
    const SPINES = 5;
    for (let s = 0; s < SPINES; s++) {
      const spine = new THREE.Mesh(spineGeo, spineMat);
      const az = (s / SPINES) * Math.PI * 2 + ribI * 0.7 + rowI * 1.3;
      spine.rotation.set(Math.sin(az) * 0.95, 0, Math.cos(az) * 0.95);
      spine.castShadow = false;
      cluster.add(spine);
    }
    plant.add(cluster);
  }
}

// ---------- Resize & animate ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
