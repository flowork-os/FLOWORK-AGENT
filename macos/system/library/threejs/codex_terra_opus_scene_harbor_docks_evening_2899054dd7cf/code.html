<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harbor Docks at Evening</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #120f12; }
  canvas { display: block; }
  #label {
    position: fixed; left: 18px; bottom: 16px; color: rgba(255,235,204,.82);
    font: 12px/1.4 Georgia, serif; letter-spacing: .13em; text-transform: uppercase;
    text-shadow: 0 1px 5px #080609; pointer-events: none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">Harbor Docks · Evening Tide</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x8d6670, 0.018);

const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 220);
camera.position.set(20, 12, 25);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.1, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.22;
controls.minDistance = 10;
controls.maxDistance = 52;
controls.maxPolarAngle = Math.PI * 0.49;

let seed = 53819;
function random() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(min, max) {
  return min + (max - min) * random();
}
function choice(items) {
  return items[Math.floor(random() * items.length)];
}
function shadow(object, cast = true, receive = true) {
  object.traverse(node => {
    if (node.isMesh) {
      node.castShadow = cast;
      node.receiveShadow = receive;
    }
  });
  return object;
}
function material(color, roughness = 0.75, metalness = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness, metalness });
}
function box(width, height, depth, mat, x = 0, y = 0, z = 0) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function cylinder(radiusTop, radiusBottom, height, mat, x = 0, y = 0, z = 0, radial = 12) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, radial),
    mat
  );
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function sphere(radius, mat, x = 0, y = 0, z = 0) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 18, 12), mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function torus(radius, tube, mat, x = 0, y = 0, z = 0, rotation = null) {
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 9, 24), mat);
  mesh.position.set(x, y, z);
  if (rotation) mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function beamBetween(a, b, thickness, mat, radial = 8) {
  const start = new THREE.Vector3(a[0], a[1], a[2]);
  const end = new THREE.Vector3(b[0], b[1], b[2]);
  const vector = end.clone().sub(start);
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(thickness, thickness, vector.length(), radial),
    mat
  );
  mesh.position.copy(start.clone().add(end).multiplyScalar(0.5));
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), vector.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function canvasTexture(draw, width = 512, height = 512) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const context = canvas.getContext('2d');
  draw(context, width, height);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  return texture;
}
function irregularPolygon(ctx, cx, cy, radius, points) {
  ctx.beginPath();
  for (let i = 0; i < points; i++) {
    const angle = i / points * Math.PI * 2;
    const r = radius * range(0.65, 1.28);
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

const woodTexture = canvasTexture((ctx, w, h) => {
  ctx.fillStyle = '#5e3d28';
  ctx.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 23) {
    ctx.fillStyle = `rgba(30,18,11,${range(0.10, 0.28)})`;
    ctx.fillRect(0, y, w, range(1, 3));
  }
  for (let i = 0; i < 360; i++) {
    const y = random() * h;
    ctx.strokeStyle = `rgba(24,13,8,${range(0.08, 0.24)})`;
    ctx.lineWidth = range(0.4, 2);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.bezierCurveTo(w * .3, y + range(-9, 9), w * .7, y + range(-9, 9), w, y + range(-5, 5));
    ctx.stroke();
  }
  for (let i = 0; i < 45; i++) {
    ctx.fillStyle = 'rgba(20,12,8,.22)';
    ctx.beginPath();
    ctx.ellipse(random() * w, random() * h, range(3, 10), range(1, 3), random() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
  }
});
woodTexture.repeat.set(3, 2);

const plankedTexture = canvasTexture((ctx, w, h) => {
  ctx.fillStyle = '#6a4931';
  ctx.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 64) {
    ctx.fillStyle = 'rgba(25,14,9,.32)';
    ctx.fillRect(0, y, w, 3);
    for (let x = 15; x < w; x += 96) {
      ctx.fillStyle = 'rgba(31,19,11,.34)';
      ctx.fillRect(x + (Math.floor(y / 64) % 2) * 45, y + 9, 2, 46);
    }
  }
  for (let i = 0; i < 260; i++) {
    ctx.fillStyle = `rgba(15,8,5,${range(.04, .17)})`;
    ctx.fillRect(random() * w, random() * h, range(1, 7), 1);
  }
});
plankedTexture.repeat.set(5, 4);

const rustTexture = canvasTexture((ctx, w, h) => {
  ctx.fillStyle = '#28444a';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 280; i++) {
    const x = random() * w;
    const y = random() * h;
    const r = range(2, 22);
    ctx.fillStyle = choice([
      'rgba(126,58,27,.56)',
      'rgba(194,102,42,.36)',
      'rgba(26,42,41,.48)',
      'rgba(226,141,64,.20)'
    ]);
    irregularPolygon(ctx, x, y, r, Math.floor(range(5, 10)));
    ctx.fill();
  }
  for (let y = 0; y < h; y += 18) {
    ctx.fillStyle = 'rgba(12,22,23,.12)';
    ctx.fillRect(0, y, w, 2);
  }
});
rustTexture.repeat.set(2, 2);

const corrugatedTexture = canvasTexture((ctx, w, h) => {
  ctx.fillStyle = '#7d7466';
  ctx.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 20) {
    ctx.fillStyle = x % 40 === 0 ? 'rgba(40,45,45,.32)' : 'rgba(235,221,179,.18)';
    ctx.fillRect(x, 0, 9, h);
  }
  for (let i = 0; i < 120; i++) {
    ctx.fillStyle = choice(['rgba(129,55,29,.25)', 'rgba(22,38,39,.16)', 'rgba(225,204,158,.10)']);
    ctx.fillRect(random() * w, random() * h, range(2, 18), range(2, 8));
  }
});
corrugatedTexture.repeat.set(2, 1);

const roofTexture = canvasTexture((ctx, w, h) => {
  ctx.fillStyle = '#293c41';
  ctx.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 36) {
    ctx.fillStyle = 'rgba(11,18,20,.38)';
    ctx.fillRect(0, y, w, 4);
    ctx.fillStyle = 'rgba(159,113,69,.11)';
    ctx.fillRect(0, y + 5, w, 2);
  }
  for (let i = 0; i < 130; i++) {
    ctx.fillStyle = choice(['rgba(182,86,34,.18)', 'rgba(8,14,16,.2)', 'rgba(205,173,105,.08)']);
    ctx.fillRect(random() * w, random() * h, range(3, 24), range(1, 4));
  }
});
roofTexture.repeat.set(2, 3);

const dockWood = new THREE.MeshStandardMaterial({
  color: 0x765036,
  roughness: 0.88,
  map: plankedTexture
});
const oldWood = new THREE.MeshStandardMaterial({
  color: 0x63432d,
  roughness: 0.92,
  map: woodTexture
});
const rustyMetal = new THREE.MeshStandardMaterial({
  color: 0x305058,
  roughness: 0.76,
  metalness: 0.48,
  map: rustTexture
});
const corrugated = new THREE.MeshStandardMaterial({
  color: 0x8b8274,
  roughness: 0.83,
  metalness: 0.34,
  map: corrugatedTexture
});
const darkRoof = new THREE.MeshStandardMaterial({
  color: 0x293d42,
  roughness: 0.75,
  metalness: 0.45,
  map: roofTexture
});
const ropeMat = material(0xa38458, 0.95, 0);
const ironMat = material(0x202b2c, 0.55, 0.72);
const concreteMat = material(0x77736a, 0.92, 0);
const whitePaint = material(0xd7d0b8, 0.62, 0.08);
const fadedBlue = material(0x2d6570, 0.67, 0.22);
const cabinBlue = material(0x477e88, 0.60, 0.2);
const redPaint = material(0xae4b35, 0.65, 0.18);
const yellowPaint = material(0xce9e48, 0.64, 0.12);
const windowMat = new THREE.MeshStandardMaterial({
  color: 0x294b56,
  roughness: 0.22,
  metalness: 0.55,
  emissive: 0x172b31,
  emissiveIntensity: 0.35
});
const warmWindow = new THREE.MeshStandardMaterial({
  color: 0xe8ad5e,
  roughness: 0.5,
  emissive: 0xe68139,
  emissiveIntensity: 1.45
});
const gullMat = material(0xdedbd0, 0.75, 0);
const gullWingMat = material(0x80847e, 0.84, 0);
const blackMat = material(0x161b1b, 0.7, 0);

const sky = new THREE.Mesh(
  new THREE.SphereGeometry(115, 40, 20),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      topColor: { value: new THREE.Color(0x283d67) },
      midColor: { value: new THREE.Color(0xd67851) },
      bottomColor: { value: new THREE.Color(0xf0bd78) },
      offset: { value: 20.0 },
      exponent: { value: 0.72 }
    },
    vertexShader: `
      varying vec3 vWorldPosition;
      void main() {
        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
        vWorldPosition = worldPosition.xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 topColor;
      uniform vec3 midColor;
      uniform vec3 bottomColor;
      uniform float offset;
      uniform float exponent;
      varying vec3 vWorldPosition;
      void main() {
        float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;
        float t = max(h, 0.0);
        vec3 horizon = mix(bottomColor, midColor, smoothstep(0.0, 0.28, t));
        vec3 finalColor = mix(horizon, topColor, pow(t, exponent));
        gl_FragColor = vec4(finalColor, 1.0);
      }
    `
  })
);
scene.add(sky);

const sunGlow = new THREE.Mesh(
  new THREE.SphereGeometry(2.6, 24, 16),
  new THREE.MeshBasicMaterial({ color: 0xffcc7d, transparent: true, opacity: 0.91 })
);
sunGlow.position.set(-33, 10, -48);
scene.add(sunGlow);

const sun = new THREE.DirectionalLight(0xffbc72, 3.3);
sun.position.set(-24, 24, -18);
sun.target.position.set(0, 0, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30;
sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30;
sun.shadow.camera.bottom = -30;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 75;
sun.shadow.bias = -0.00035;
scene.add(sun, sun.target);

const hemi = new THREE.HemisphereLight(0x566b9b, 0x49301f, 1.55);
scene.add(hemi);

const harborFill = new THREE.DirectionalLight(0xa1b4bf, 0.38);
harborFill.position.set(14, 18, 16);
scene.add(harborFill);

const warehouseLamp = new THREE.PointLight(0xffb25c, 18, 19, 2);
warehouseLamp.position.set(-7.2, 6.3, -6.2);
warehouseLamp.castShadow = true;
warehouseLamp.shadow.mapSize.set(512, 512);
scene.add(warehouseLamp);

const waterGeometry = new THREE.PlaneGeometry(140, 140, 120, 120);
const waterMaterial = new THREE.ShaderMaterial({
  transparent: false,
  uniforms: {
    time: { value: 0 },
    sunDirection: { value: new THREE.Vector3(-0.66, 0.48, -0.54).normalize() }
  },
  vertexShader: `
    uniform float time;
    varying vec3 vWorld;
    varying vec3 vNormal;
    varying float vWave;
    void main() {
      vec3 p = position;
      float waveA = sin(p.x * 0.24 + time * 0.70) * 0.14;
      float waveB = cos(p.y * 0.31 - time * 0.48) * 0.11;
      float waveC = sin((p.x + p.y) * 0.52 + time * 1.15) * 0.045;
      p.z += waveA + waveB + waveC;
      vWave = waveA + waveB + waveC;
      vec4 world = modelMatrix * vec4(p, 1.0);
      vWorld = world.xyz;
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * viewMatrix * world;
    }
  `,
  fragmentShader: `
    uniform vec3 sunDirection;
    varying vec3 vWorld;
    varying vec3 vNormal;
    varying float vWave;
    void main() {
      vec3 viewDir = normalize(cameraPosition - vWorld);
      float fresnel = pow(1.0 - max(dot(viewDir, normalize(vNormal)), 0.0), 3.0);
      float reflected = pow(max(dot(reflect(-sunDirection, normalize(vNormal)), viewDir), 0.0), 26.0);
      float ribbons = pow(max(0.0, sin(vWorld.x * 0.52 + vWorld.y * 0.18) * 0.5 + 0.5), 12.0);
      vec3 deep = vec3(0.035, 0.155, 0.19);
      vec3 shallow = vec3(0.12, 0.34, 0.37);
      vec3 color = mix(deep, shallow, fresnel * 0.65 + 0.14 + vWave * 0.7);
      color += vec3(1.0, 0.45, 0.17) * reflected * 1.5;
      color += vec3(0.82, 0.40, 0.16) * ribbons * 0.06;
      gl_FragColor = vec4(color, 1.0);
    }
  `
});
const water = new THREE.Mesh(waterGeometry, waterMaterial);
water.rotation.x = -Math.PI / 2;
water.position.y = -0.18;
water.receiveShadow = true;
scene.add(water);

const farLand = new THREE.Group();
const farMat = material(0x4d5351, 0.95, 0);
for (let i = 0; i < 28; i++) {
  const width = range(1.4, 4.8);
  const height = range(1.2, 6.8);
  const depth = range(1.2, 3.2);
  const building = box(width, height, depth, farMat, -36 + i * 2.8, height * 0.5 - 0.05, -30 + range(-1.2, 1.2));
  farLand.add(building);
}
farLand.position.z = -2;
scene.add(farLand);

const warehouse = new THREE.Group();
warehouse.position.set(-7.4, 0, -7.9);

const warehouseMain = box(14.2, 6.6, 7.1, corrugated, 0, 3.3, 0);
warehouse.add(warehouseMain);

const roof = new THREE.Mesh(
  new THREE.ConeGeometry(6.25, 3.0, 4),
  darkRoof
);
roof.scale.set(1.34, 1, 0.88);
roof.rotation.y = Math.PI * 0.25;
roof.position.set(0, 8.1, 0);
roof.castShadow = true;
roof.receiveShadow = true;
warehouse.add(roof);

const roofRidge = box(12.9, 0.25, 0.32, ironMat, 0, 9.42, 0);
roofRidge.rotation.z = 0.01;
warehouse.add(roofRidge);

for (let x = -5.7; x <= 5.7; x += 2.85) {
  const windowFrame = box(1.45, 1.55, 0.1, ironMat, x, 3.95, 3.59);
  warehouse.add(windowFrame);
  const windowGlow = box(1.17, 1.26, 0.12, warmWindow, x, 3.95, 3.65);
  warehouse.add(windowGlow);
  warehouse.add(box(0.08, 1.5, 0.14, blackMat, x, 3.95, 3.72));
  warehouse.add(box(1.35, 0.08, 0.14, blackMat, x, 3.95, 3.72));
}

const warehouseDoor = box(3.05, 4.5, 0.16, rustyMetal, -3.9, 2.25, 3.62);
warehouse.add(warehouseDoor);
for (let x = -5.2; x < -2.5; x += 0.55) {
  warehouse.add(box(0.08, 4.35, 0.08, ironMat, x, 2.25, 3.75));
}

for (let i = 0; i < 8; i++) {
  const vent = cylinder(0.22, 0.28, 1.1, ironMat, -5.6 + i * 1.6, 9.85, range(-1.2, 1.3), 10);
  warehouse.add(vent);
  warehouse.add(new THREE.Mesh(
    new THREE.ConeGeometry(0.43, 0.26, 10),
    ironMat
  ));
  const cap = warehouse.children[warehouse.children.length - 1];
  cap.position.copy(vent.position);
  cap.position.y += 0.67;
}
shadow(warehouse);
scene.add(warehouse);

const dock = new THREE.Group();
const dockBase = box(23.5, 0.52, 9.2, dockWood, 3.7, 0.5, 2.6);
dock.add(dockBase);

for (let z = -1.25; z <= 6.25; z += 1.07) {
  const seam = box(23.45, 0.04, 0.045, blackMat, 3.7, 0.78, z);
  dock.add(seam);
}
for (let x = -7.3; x < 15.1; x += 2.85) {
  const seam = box(0.035, 0.045, 9.15, blackMat, x, 0.79, 2.6);
  dock.add(seam);
}

const dockExtension = box(6.2, 0.50, 15.0, dockWood, 12.35, 0.5, -8.6);
dock.add(dockExtension);
for (let z = -15.4; z <= -1.5; z += 1.05) {
  dock.add(box(6.15, 0.04, 0.045, blackMat, 12.35, 0.78, z));
}

const pilingLocations = [
  [-7.2, -1.1], [-7.2, 6.5], [0.1, -1.1], [7.0, -1.1],
  [14.8, -1.1], [14.8, 6.5], [9.25, -15.5], [15.45, -15.5],
  [15.45, -1.7], [9.25, -1.7]
];
const perchPilings = [];
for (const pos of pilingLocations) {
  const height = range(3.7, 5.2);
  const piling = cylinder(0.34, 0.46, height, oldWood, pos[0], height * 0.5 - 0.45, pos[1], 10);
  piling.rotation.z = range(-0.025, 0.025);
  dock.add(piling);
  const top = new THREE.Mesh(new THREE.ConeGeometry(0.48, 0.42, 10), oldWood);
  top.position.set(pos[0], height - 0.45, pos[1]);
  top.castShadow = true;
  dock.add(top);
  perchPilings.push({ x: pos[0], y: height - 0.18, z: pos[1] });
}
scene.add(dock);

function createBollard(x, z) {
  const group = new THREE.Group();
  group.position.set(x, 0.84, z);
  group.add(cylinder(0.18, 0.23, 0.42, ironMat, 0, 0.21, 0, 12));
  group.add(cylinder(0.40, 0.40, 0.12, ironMat, 0, 0.43, 0, 12));
  group.add(cylinder(0.10, 0.10, 0.48, ironMat, 0, 0.51, 0, 10));
  return group;
}
for (const p of [[-4.8, 5.6], [-1.4, 5.6], [5.2, 5.6], [10.4, 5.6], [11.0, -9.5], [11.0, -4.2]]) {
  scene.add(createBollard(p[0], p[1]));
}

function createRopeCoil(x, z, scale = 1) {
  const group = new THREE.Group();
  group.position.set(x, 0.87, z);
  for (let i = 0; i < 4; i++) {
    const ring = torus((0.28 + i * 0.085) * scale, 0.032 * scale, ropeMat, 0, i * 0.024, 0, [Math.PI / 2, 0, range(-0.24, 0.24)]);
    group.add(ring);
  }
  return group;
}
scene.add(createRopeCoil(-3.9, 5.0, 1.1));
scene.add(createRopeCoil(7.8, 5.25, 0.85));
scene.add(createRopeCoil(11.4, -5.8, 1.0));

function createCrate(width, height, depth, color) {
  const group = new THREE.Group();
  const baseMat = material(color, 0.84, 0.04);
  group.add(box(width, height, depth, baseMat, 0, height * 0.5, 0));
  const slatMat = material(0x3c2619, 0.9, 0);
  for (const z of [-depth * 0.42, depth * 0.42]) {
    group.add(box(width + 0.04, height * 0.105, 0.08, slatMat, 0, height * 0.2, z));
    group.add(box(width + 0.04, height * 0.105, 0.08, slatMat, 0, height * 0.8, z));
  }
  for (const x of [-width * 0.43, width * 0.43]) {
    group.add(box(0.08, height + 0.03, 0.08, slatMat, x, height * 0.5, -depth * 0.43));
    group.add(box(0.08, height + 0.03, 0.08, slatMat, x, height * 0.5, depth * 0.43));
  }
  shadow(group);
  return group;
}

const crateStack = new THREE.Group();
crateStack.position.set(-1.5, 0.8, 3.2);
const crateA = createCrate(1.35, 1.1, 1.15, 0x875437);
crateA.rotation.y = -0.09;
crateStack.add(crateA);
const crateB = createCrate(1.28, 0.98, 1.1, 0x756038);
crateB.position.set(0.12, 0, 0.2);
crateB.rotation.y = 0.16;
crateStack.add(crateB);
const crateC = createCrate(1.26, 1.08, 1.1, 0x9d6e36);
crateC.position.set(0.03, 1.01, 0.08);

  group.add(box(w * 0.75, 0.09, 0.05, sideMat, 0, h * 0.28, d * 0.53));

}

  const points = [];

      THREE.MathUtils.lerp(start[0], end[0], t),
      THREE.MathUtils.lerp(start[1], end[1], t) - Math.sin(t * Math.PI) * 0.28,
      THREE.MathUtils.lerp(start[2], end[2], t)
    ));
  }
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(points),
    new THREE.LineBasicMaterial({ color: 0x8c7956 })
  );
  scene.add(line);
  mooringLines.push({ line, start, end });
}

  const group = new THREE.Group();

  body.scale.set(1.35, 1.0, 2.15);

  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.027 * scale, 0.14 * scale, 5), yellowPaint);
  beak.rotation.x = -Math.PI / 2;
  beak.position.set(0, 0.085 * scale, -0.30 * scale);

  const wingA = new THREE.Mesh(new THREE.ConeGeometry(0.11 * scale, 0.52 * scale, 4), gullWingMat);
  wingA.rotation.set(0, 0.25, Math.PI * 0.65);

  const wingB = wingA.clone();
  wingB.rotation.z = -Math.PI * 0.65;
  wingB.position.x = 0.16 * scale;
  group.add(wingB);
  return group;
}

const clock = new THREE.Clock();

function updateMooring(lineData, swayX, swayZ) {
  const positions = lineData.line.geometry.attributes.position;
  for (let i = 0; i <= 16; i++) {
    const t = i / 16;
    const sx = lineData.start[0] + swayX;
    const sy = lineData.start[1];
    const sz = lineData.start[2] + swayZ;
    positions.setXYZ(
      i,
      THREE.MathUtils.lerp(sx, lineData.end[0], t),
      THREE.MathUtils.lerp(sy, lineData.end[1], t) - Math.sin(t * Math.PI) * (0.26 + Math.abs(swayX) * .14),
      THREE.MathUtils.lerp(sz, lineData.end[2], t)
    );
  }
  positions.needsUpdate = true;
}

function animate() {
  const time = clock.getElapsedTime();

  waterMaterial.uniforms.time.value = time;

  const swayX = Math.sin(time * 0.63) * 0.13;
  const swayZ = Math.cos(time * 0.49) * 0.09;
  boat.position.x = 3.5 + swayX;
  boat.position.y = 1.05 + Math.sin(time * 1.18) * 0.075;
  boat.position.z = -5.1 + swayZ;
  boat.rotation.z = Math.sin(time * 0.75) * 0.026;
  boat.rotation.x = Math.cos(time * 0.92) * 0.018;
  mast.rotation.z = Math.sin(time * 0.75) * -0.005;
  flag.rotation.z = Math.sin(time * 3.1) * 0.16;
  craneHook.position.y = 2.22 + Math.sin(time * 0.82) * 0.11;
  craneCable.scale.y = 1 + Math.sin(time * 0.82) * 0.025;

  for (const data of mooringLines) {
    updateMooring(data, swayX, swayZ);
  }

  for (const buoy of buoys) {
    buoy.group.position.y = buoy.baseY + Math.sin(time * 1.35 + buoy.phase) * 0.13;
    buoy.group.rotation.z = Math.sin(time * 1.07 + buoy.phase) * 0.16;
    buoy.group.rotation.x = Math.cos(time * 1.20 + buoy.phase) * 0.12;
  }

  for (const item of perchedGulls) {
    item.gull.position.y += Math.sin(time * 1.8 + item.phase) * 0.0012;
    item.gull.rotation.y += Math.sin(time * 0.6 + item.phase) * 0.001;
  }

  for (const bird of flyingGulls) {
    const a = time * bird.speed + bird.phase;
    bird.gull.position.x = bird.centerX + Math.cos(a) * bird.radius;
    bird.gull.position.z = bird.centerZ + Math.sin(a) * bird.radius * 0.42;
    bird.gull.position.y = bird.centerY + Math.sin(a * 2.0) * 0.45;
    bird.gull.rotation.y = -a + Math.PI * 0.5;
    const wing = bird.gull.children[3];
    const wingOther = bird.gull.children[4];
    wing.rotation.z = Math.PI * 0.65 + Math.sin(time * 8 + bird.phase) * 0.42;
    wingOther.rotation.z = -Math.PI * 0.65 - Math.sin(time * 8 + bird.phase) * 0.42;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
