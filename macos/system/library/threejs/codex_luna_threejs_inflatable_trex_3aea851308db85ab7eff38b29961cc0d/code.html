<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inflatable T-Rex</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #bfe8ee; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe8ee);
scene.fog = new THREE.Fog(0xbfe8ee, 15, 31);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.7, 5.2, 9.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.25, 1.45, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 6;
controls.maxDistance = 17;
controls.maxPolarAngle = Math.PI * 0.47;

scene.add(new THREE.HemisphereLight(0xeaffff, 0x426b70, 2.3));

const key = new THREE.DirectionalLight(0xffffff, 4.7);
key.position.set(5, 10, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -9;
key.shadow.camera.right = 9;
key.shadow.camera.top = 10;
key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0005;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8bdcf2, 2.3);
fill.position.set(-7, 4, 8);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xd5ffb4, 2.5);
rim.position.set(-5, 7, -8);
scene.add(rim);

const toyGreen = new THREE.MeshPhysicalMaterial({
  color: 0x83d51b,
  roughness: 0.2,
  metalness: 0.02,
  clearcoat: 0.85,
  clearcoatRoughness: 0.14
});
const greenDark = new THREE.MeshPhysicalMaterial({
  color: 0x55a912,
  roughness: 0.25,
  metalness: 0.01,
  clearcoat: 0.75,
  clearcoatRoughness: 0.18
});
const seamMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x6dbc17,
  roughness: 0.27,
  metalness: 0,
  clearcoat: 0.65,
  clearcoatRoughness: 0.2
});
const mouthMaterial = new THREE.MeshStandardMaterial({ color: 0x3b1715, roughness: 0.62 });
const gumMaterial = new THREE.MeshStandardMaterial({ color: 0xf06a61, roughness: 0.45 });
const toothMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xfff4ca,
  roughness: 0.25,
  clearcoat: 0.55
});
const eyeWhite = new THREE.MeshPhysicalMaterial({ color: 0xfffbe8, roughness: 0.16, clearcoat: 0.7 });
const pupilMaterial = new THREE.MeshStandardMaterial({ color: 0x17220d, roughness: 0.28 });
const plugMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x4f9d14,
  roughness: 0.24,
  clearcoat: 0.8
});

const rex = new THREE.Group();
rex.rotation.y = -0.08;
scene.add(rex);

function sphere(name, position, scale, material = toyGreen, segments = 32) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, segments, 24), material);
  mesh.name = name;
  mesh.position.set(...position);
  mesh.scale.set(...scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  rex.add(mesh);
  return mesh;
}

function cylinder(name, position, radius, height, material, rotation = [0, 0, 0], radial = 24) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius * 0.94, height, radial), material);
  mesh.name = name;
  mesh.position.set(...position);
  mesh.rotation.set(...rotation);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  rex.add(mesh);
  return mesh;
}

function tube(name, points, radius, material, tubular = 32) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, tubular, radius, 12, false), material);
  mesh.name = name;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  rex.add(mesh);
  return mesh;
}

function seamRing(position, scale, rotation = [0, Math.PI / 2, 0]) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(1, 0.065, 10, 36), seamMaterial);
  ring.position.set(...position);
  ring.rotation.set(...rotation);
  ring.scale.set(...scale);
  ring.castShadow = true;
  ring.receiveShadow = true;
  rex.add(ring);
  return ring;
}

function eye(position) {
  const white = sphere("bright eye", position, [0.22, 0.27, 0.13], eyeWhite, 24);
  const pupil = sphere("black pupil", [position[0] + 0.025, position[1] + 0.015, position[2] + 0.115], [0.085, 0.13, 0.045], pupilMaterial, 20);
  pupil.rotation.x = -0.08;
  return white;
}

function tooth(position, rotation = [0, 0, Math.PI]) {
  const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.105, 0.32, 16), toothMaterial);
  tooth.position.set(...position);
  tooth.rotation.set(...rotation);
  tooth.castShadow = true;
  rex.add(tooth);
}

sphere("inflated torso", [-0.55, 1.52, 0], [2.55, 1.48, 1.34]);
sphere("rounded chest", [0.95, 1.62, 0], [1.42, 1.35, 1.24], toyGreen);
sphere("soft neck", [1.38, 2.1, 0], [1.2, 1.35, 1.12], toyGreen);

seamRing([-1.42, 1.52, 0], [1, 1.43, 1.3]);
seamRing([-0.25, 1.53, 0], [1, 1.48, 1.34]);
seamRing([0.68, 1.61, 0], [1, 1.32, 1.2]);

sphere("head", [2.08, 2.36, 0], [1.48, 1.18, 1.08]);
sphere("puffed snout", [3.0, 2.12, 0], [1.28, 0.78, 0.84], toyGreen);
seamRing([2.63, 2.25, 0], [1, 0.91, 0.87]);
sphere("lower jaw", [2.72, 1.59, 0.02], [1.24, 0.51, 0.78], greenDark);
sphere("pink gum", [2.63, 1.91, 0.78], [1.08, 0.105, 0.07], gumMaterial, 24);

const mouth = tube("wide cartoon grin", [
  [1.65, 1.99, 0.96],
  [2.2, 1.83, 1.0],
  [2.82, 1.84, 0.96],
  [3.55, 1.98, 0.72]
], 0.055, mouthMaterial, 28);

for (const p of [
  [1.82, 1.88, 1.0], [2.13, 1.82, 1.03], [2.45, 1.81, 1.02],
  [2.78, 1.83, 0.98], [3.10, 1.88, 0.88], [3.38, 1.94, 0.77]
]) tooth(p);

eye([2.08, 2.82, 0.88]);
eye([2.08, 2.82, -0.88]);

sphere("brow near", [2.05, 3.08, 0.86], [0.5, 0.14, 0.18], greenDark);
sphere("brow far", [2.05, 3.08, -0.86], [0.5, 0.14, 0.18], greenDark);
sphere("near nostril", [3.47, 2.36, 0.63], [0.12, 0.09, 0.055], mouthMaterial, 20);
sphere("far nostril", [3.47, 2.36, -0.63], [0.12, 0.09, 0.055], mouthMaterial, 20);

const tailParts = [
  [-2.35, 1.45, 0, 1.7, 0.95, 0.95],
  [-3.65, 1.34, 0, 1.48, 0.7, 0.7],
  [-4.78, 1.2, 0, 1.18, 0.46, 0.46],
  [-5.72, 1.1, 0, 0.8, 0.25, 0.25]
];
for (const [x, y, z, sx, sy, sz] of tailParts) sphere("puffed tail segment", [x, y, z], [sx, sy, sz], toyGreen);
seamRing([-2.95, 1.4, 0], [1, 0.82, 0.82]);
seamRing([-4.2, 1.28, 0], [1, 0.57, 0.57]);
seamRing([-5.25, 1.16, 0], [1, 0.35, 0.35]);

function leg(x, z, far = false) {
  const mat = far ? greenDark : toyGreen;
  sphere("puffy thigh", [x, 0.7, z], [0.68, 0.83, 0.62], mat);
  sphere("rounded shin", [x + 0.1, 0.31, z + 0.04], [0.47, 0.55, 0.48], mat);
  sphere("big inflatable foot", [x + 0.28, 0.2, z + 0.18], [0.72, 0.28, 0.58], mat);
  seamRing([x + 0.08, 0.47, z], [1, 0.5, 0.52], [0, Math.PI / 2, 0]);
}
leg(-0.85, -0.7, true);
leg(0.48, -0.72, true);
leg(-0.78, 0.7, false);
leg(0.56, 0.68, false);

function arm(z, far = false) {
  const mat = far ? greenDark : toyGreen;
  sphere("stubby upper arm", [1.05, 1.45, z], [0.38, 0.7, 0.36], mat);
  const forearm = sphere("tiny forearm", [1.25, 0.88, z + (z > 0 ? 0.08 : -0.08)], [0.3, 0.55, 0.3], mat);
  forearm.rotation.z = -0.28;
  sphere("little hand", [1.46, 0.62, z + (z > 0 ? 0.12 : -0.12)], [0.34, 0.22, 0.3], mat);
  seamRing([1.14, 1.17, z], [1, 0.34, 0.34], [0, Math.PI / 2, 0]);
}
arm(-0.85, true);
arm(0.94, false);

cylinder("air plug stem", [-0.56, 3.06, 0.05], 0.16, 0.28, plugMaterial, [0, 0, 0], 20);
const plugCap = new THREE.Mesh(new THREE.SphereGeometry(0.2, 20, 12), plugMaterial);
plugCap.position.set(-0.56, 3.23, 0.05);
plugCap.scale.set(1, 0.58, 1);
plugCap.castShadow = true;
rex.add(plugCap);
seamRing([-0.56, 2.99, 0.05], [1, 0.18, 0.18]);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(18, 64),
  new THREE.MeshStandardMaterial({ color: 0x8bc7b2, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.1;
floor.receiveShadow = true;
scene.add(floor);

const shadow = new THREE.Mesh(
  new THREE.PlaneGeometry(11, 5.2),
  new THREE.MeshBasicMaterial({ color: 0x4c8b78, transparent: true, opacity: 0.17 })
);
shadow.rotation.x = -Math.PI / 2;
shadow.position.set(-0.8, -0.095, 0.25);
shadow.scale.set(1, 0.7, 1);
scene.add(shadow);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
