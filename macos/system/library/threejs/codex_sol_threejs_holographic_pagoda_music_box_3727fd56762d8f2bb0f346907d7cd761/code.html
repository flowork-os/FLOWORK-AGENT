<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Music Box</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, #10263a 0%, #07111d 38%, #02050b 78%, #000 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02060d);
scene.fog = new THREE.FogExp2(0x02060d, 0.035);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.2, 6.1, 9.2);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.enablePan = false;
controls.minDistance = 7;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.49;
controls.target.set(0, 1.55, 0);

scene.add(new THREE.HemisphereLight(0x7edfff, 0x10051e, 1.5));

const keyLight = new THREE.SpotLight(0xd8ffff, 90, 25, Math.PI / 5, 0.45, 1.35);
keyLight.position.set(5, 9, 6);
keyLight.target.position.set(0, 1, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1536, 1536);
keyLight.shadow.bias = -0.0004;
scene.add(keyLight, keyLight.target);

const violetLight = new THREE.PointLight(0x9a46ff, 46, 15, 1.7);
violetLight.position.set(-5, 4.5, 2);
scene.add(violetLight);

const goldLight = new THREE.PointLight(0xffc85a, 34, 13, 1.8);
goldLight.position.set(4, 2, -5);
scene.add(goldLight);

const cyanLight = new THREE.PointLight(0x20edff, 30, 12, 1.8);
cyanLight.position.set(-3, 1, 5);
scene.add(cyanLight);

const shellMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x167d88,
  metalness: 0.62,
  roughness: 0.15,
  clearcoat: 1,
  clearcoatRoughness: 0.08,
  iridescence: 1,
  iridescenceIOR: 1.55,
  iridescenceThicknessRange: [180, 760],
  sheen: 0.7,
  sheenColor: new THREE.Color(0x983cff),
  sheenRoughness: 0.18,
  emissive: 0x06283c,
  emissiveIntensity: 0.38
});

const trimMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xb5eeff,
  metalness: 0.9,
  roughness: 0.09,
  clearcoat: 1,
  iridescence: 1,
  iridescenceIOR: 1.8,
  iridescenceThicknessRange: [110, 920],
  emissive: 0x15316a,
  emissiveIntensity: 0.28
});

const darkMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x071321,
  metalness: 0.72,
  roughness: 0.24,
  clearcoat: 0.85,
  iridescence: 0.75,
  iridescenceThicknessRange: [220, 620]
});

const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x5ddcff,
  metalness: 0.05,
  roughness: 0.08,
  transmission: 0.38,
  transparent: true,
  opacity: 0.48,
  depthWrite: false,
  side: THREE.DoubleSide,
  clearcoat: 1,
  iridescence: 1,
  iridescenceIOR: 1.45,
  iridescenceThicknessRange: [120, 650],
  emissive: 0x164b86,
  emissiveIntensity: 0.72
});

const hologramMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x75faff,
  metalness: 0.08,
  roughness: 0.16,
  transmission: 0.2,
  transparent: true,
  opacity: 0.68,
  depthWrite: false,
  side: THREE.DoubleSide,
  clearcoat: 1,
  iridescence: 1,
  iridescenceIOR: 1.7,
  iridescenceThicknessRange: [100, 800],
  emissive: 0x1a8cff,
  emissiveIntensity: 1.25
});

function polygonShape(radius, sides = 8, rotation = Math.PI / 8) {
  const shape = new THREE.Shape();
  for (let i = 0; i < sides; i++) {
    const a = rotation + i * Math.PI * 2 / sides;
    const x = Math.cos(a) * radius;
    const y = Math.sin(a) * radius;
    if (i === 0) shape.moveTo(x, y);
    else shape.lineTo(x, y);
  }
  shape.closePath();
  return shape;
}

function octagonalPrism(radius, height, bevel = 0.1) {
  const geometry = new THREE.ExtrudeGeometry(polygonShape(radius), {
    depth: height,
    steps: 1,
    bevelEnabled: true,
    bevelSegments: 3,
    bevelSize: bevel,
    bevelThickness: bevel,
    curveSegments: 1
  });
  geometry.rotateX(-Math.PI / 2);
  geometry.translate(0, -height / 2, 0);
  geometry.computeVertexNormals();
  return geometry;
}

function addPrismaticEdges(mesh, opacity = 0.8, threshold = 24) {
  const edgeGeometry = new THREE.EdgesGeometry(mesh.geometry, threshold);
  const positions = edgeGeometry.getAttribute('position');
  const colors = [];
  const color = new THREE.Color();

  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i);
    const y = positions.getY(i);
    const z = positions.getZ(i);
    const hue = ((Math.atan2(z, x) / (Math.PI * 2)) + 0.58 + y * 0.09 + 1) % 1;
    color.setHSL(hue, 1, 0.66);
    colors.push(color.r, color.g, color.b);
  }
  edgeGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

  const line = new THREE.LineSegments(edgeGeometry, new THREE.LineBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  }));
  line.scale.setScalar(1.003);
  line.renderOrder = 4;
  mesh.add(line);

  const fringe = line.clone();
  fringe.material = new THREE.LineBasicMaterial({
    color: 0xff3ccf,
    transparent: true,
    opacity: opacity * 0.22,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  fringe.scale.setScalar(1.012);
  fringe.renderOrder = 3;
  mesh.add(fringe);
}

function meshWithEdges(geometry, material, opacity = 0.75) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  addPrismaticEdges(mesh, opacity);
  return mesh;
}

const musicBox = new THREE.Group();
musicBox.position.y = 0.15;
scene.add(musicBox);

const body = meshWithEdges(octagonalPrism(2.42, 1.5, 0.12), shellMaterial, 0.86);
body.position.y = 0;
musicBox.add(body);

const lowerBand = meshWithEdges(octagonalPrism(2.49, 0.18, 0.055), trimMaterial, 0.95);
lowerBand.position.y = -0.64;
musicBox.add(lowerBand);

const upperBand = meshWithEdges(octagonalPrism(2.5, 0.16, 0.05), trimMaterial, 0.95);
upperBand.position.y = 0.65;
musicBox.add(upperBand);

const topDeck = meshWithEdges(octagonalPrism(2.18, 0.16, 0.05), darkMaterial, 0.65);
topDeck.position.y = 0.78;
musicBox.add(topDeck);

const inlay = new THREE.Mesh(
  new THREE.CylinderGeometry(1.42, 1.47, 0.1, 8, 1, false, Math.PI / 8),
  glassMaterial
);
inlay.position.y = 0.91;
inlay.castShadow = true;
inlay.receiveShadow = true;
musicBox.add(inlay);
addPrismaticEdges(inlay, 0.8);

for (let i = 0; i < 8; i++) {
  const angle = Math.PI / 8 + i * Math.PI / 4;
  const gem = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.1, 0),
    i % 2 ? trimMaterial : glassMaterial
  );
  gem.position.set(Math.cos(angle) * 1.8, 0.98, Math.sin(angle) * 1.8);
  gem.rotation.y = -angle;
  gem.scale.y = 0.65;
  musicBox.add(gem);
}

const topRings = new THREE.Group();
topRings.position.y = 0.98;
musicBox.add(topRings);

for (const [radius, tube, color, opacity] of [
  [1.56, 0.026, 0x42f5ff, 0.78],
  [1.27, 0.018, 0xd94dff, 0.65],
  [0.95, 0.016, 0xffcf54, 0.58]
]) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(radius, tube, 8, 8),
    new THREE.MeshBasicMaterial({
      color,
      transparent: true,
      opacity,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    })
  );
  ring.rotation.x = Math.PI / 2;
  ring.rotation.z = Math.PI / 8;
  topRings.add(ring);
}

const frontMedallion = new THREE.Group();
frontMedallion.position.set(0, -0.03, 2.31);
musicBox.add(frontMedallion);

const medallion = new THREE.Mesh(
  new THREE.CylinderGeometry(0.48, 0.48, 0.13, 8, 1, false, Math.PI / 8),
  trimMaterial
);
medallion.rotation.x = Math.PI / 2;
frontMedallion.add(medallion);
addPrismaticEdges(medallion, 0.9);

const medallionCenter = new THREE.Mesh(new THREE.OctahedronGeometry(0.25, 1), glassMaterial);
medallionCenter.position.z = 0.1;
medallionCenter.rotation.z = Math.PI / 4;
frontMedallion.add(medallionCenter);

for (let i = 0; i < 4; i++) {
  const foot = meshWithEdges(octagonalPrism(0.28, 0.34, 0.055), trimMaterial, 0.75);
  const a = Math.PI / 4 + i * Math.PI / 2;
  foot.position.set(Math.cos(a) * 1.75, -0.93, Math.sin(a) * 1.75);
  foot.scale.set(1.25, 1, 1.25);
  musicBox.add(foot);
}

const lidPivot = new THREE.Group();
lidPivot.position.set(0, 0.78, -2.13);
lidPivot.rotation.x = -1.03;
musicBox.add(lidPivot);

const lid = meshWithEdges(octagonalPrism(2.45, 0.28, 0.1), shellMaterial, 0.92);
lid.position.set(0, 0.06, 2.13);
lidPivot.add(lid);

const lidInset = new THREE.Mesh(
  new THREE.CylinderGeometry(1.72, 1.72, 0.075, 8, 1, false, Math.PI / 8),
  glassMaterial
);
lidInset.position.set(0, 0.225, 2.13);
lidPivot.add(lidInset);
addPrismaticEdges(lidInset, 0.78);

const lidInnerRing = new THREE.Mesh(
  new THREE.TorusGeometry(1.91, 0.065, 10, 8),
  trimMaterial
);
lidInnerRing.rotation.x = Math.PI / 2;
lidInnerRing.rotation.z = Math.PI / 8;
lidInnerRing.position.set(0, 0.275, 2.13);
lidPivot.add(lidInnerRing);

const star = new THREE.Group();
star.position.set(0, 0.29, 2.13);
lidPivot.add(star);
for (let i = 0; i < 8; i++) {
  const ray = new THREE.Mesh(
    new THREE.BoxGeometry(0.055, 0.018, 1.35),
    new THREE.MeshBasicMaterial({
      color: i % 2 ? 0xf36cff : 0x56f9ff,
      transparent: true,
      opacity: 0.52,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    })
  );
  ray.rotation.y = i * Math.PI / 4;
  star.add(ray);
}

const hinge = new THREE.Group();
hinge.position.set(0, 0.78, -2.13);
musicBox.add(hinge);

for (const x of [-1.4, -0.47, 0.47, 1.4]) {
  const barrel = new THREE.Mesh(
    new THREE.CylinderGeometry(0.16, 0.16, 0.72, 24),
    trimMaterial
  );
  barrel.rotation.z = Math.PI / 2;
  barrel.position.x = x;
  barrel.castShadow = true;
  hinge.add(barrel);
  addPrismaticEdges(barrel, 0.8);
}

const hingePin = new THREE.Mesh(
  new THREE.CylinderGeometry(0.065, 0.065, 3.9, 20),
  glassMaterial
);
hingePin.rotation.z = Math.PI / 2;
hinge.add(hingePin);

const spindle = new THREE.Group();
spindle.position.y = 0.98;
musicBox.add(spindle);

const spindleBase = new THREE.Mesh(
  new THREE.CylinderGeometry(0.4, 0.52, 0.22, 32),
  trimMaterial
);
spindleBase.position.y = 0.1;
spindleBase.castShadow = true;
spindle.add(spindleBase);

const spindleRod = new THREE.Mesh(
  new THREE.CylinderGeometry(0.055, 0.075, 1.45, 18),
  glassMaterial
);
spindleRod.position.y = 0.82;
spindle.add(spindleRod);

const dancer = new THREE.Group();
dancer.position.y = 1.22;
spindle.add(dancer);

function capsuleBetween(a, b, radius, material) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const mesh = new THREE.Mesh(
    new THREE.CapsuleGeometry(radius, Math.max(0.01, length - radius * 2), 8, 16),
    material
  );
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  return mesh;
}

const torso = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.2, 0.6, 12, 24),
  hologramMaterial
);
torso.position.y = 1.23;
torso.scale.set(0.86, 1, 0.63);
dancer.add(torso);

const bodice = new THREE.Mesh(
  new THREE.CylinderGeometry(0.18, 0.34, 0.48, 20),
  hologramMaterial
);
bodice.position.y = 1.02;
dancer.add(bodice);

const skirt = new THREE.Mesh(
  new THREE.CylinderGeometry(0.25, 0.84, 0.34, 48, 1, true),
  hologramMaterial
);
skirt.position.y = 0.79;
skirt.castShadow = true;
dancer.add(skirt);
addPrismaticEdges(skirt, 0.62);

const tutu = new THREE.Mesh(
  new THREE.TorusGeometry(0.62, 0.095, 12, 48),
  new THREE.MeshPhysicalMaterial({
    color: 0xff8ff0,
    emissive: 0x7219ff,
    emissiveIntensity: 1.3,
    transparent: true,
    opacity: 0.58,
    depthWrite: false,
    iridescence: 1,
    iridescenceThicknessRange: [100, 700],
    side: THREE.DoubleSide
  })
);
tutu.rotation.x = Math.PI / 2;
tutu.position.y = 0.83;
dancer.add(tutu);

const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.105, 0.22, 16), hologramMaterial);
neck.position.y = 1.71;
dancer.add(neck);

const head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 24, 18), hologramMaterial);
head.position.set(0, 1.96, 0);
head.scale.set(0.9, 1.08, 0.88);
dancer.add(head);

const bun = new THREE.Mesh(new THREE.SphereGeometry(0.14, 18, 14), hologramMaterial);
bun.position.set(0, 2.2, -0.08);
dancer.add(bun);

dancer.add(capsuleBetween(
  new THREE.Vector3(-0.17, 1.47, 0),
  new THREE.Vector3(-0.72, 1.73, 0.05),
  0.075,
  hologramMaterial
));
dancer.add(capsuleBetween(
  new THREE.Vector3(-0.72, 1.73, 0.05),
  new THREE.Vector3(-1.03, 2.12, 0.02),
  0.06,
  hologramMaterial
));
dancer.add(capsuleBetween(
  new THREE.Vector3(0.17, 1.47, 0),
  new THREE.Vector3(0.76, 1.57, -0.05),
  0.075,
  hologramMaterial
));
dancer.add(capsuleBetween(
  new THREE.Vector3(0.76, 1.57, -0.05),
  new THREE.Vector3(1.12, 1.35, 0.04),
  0.06,
  hologramMaterial
));

dancer.add(capsuleBetween(
  new THREE.Vector3(-0.16, 0.7, 0),
  new THREE.Vector3(-0.2, 0.08, 0.06),
  0.085,
  hologramMaterial
));
dancer.add(capsuleBetween(
  new THREE.Vector3(-0.2, 0.08, 0.06),
  new THREE.Vector3(-0.28, -0.55, 0.2),
  0.065,
  hologramMaterial
));
dancer.add(capsuleBetween(
  new THREE.Vector3(0.15, 0.7, 0),
  new THREE.Vector3(0.45, 0.25, -0.1),
  0.085,
  hologramMaterial
));
dancer.add(capsuleBetween(
  new THREE.Vector3(0.45, 0.25, -0.1),
  new THREE.Vector3(0.72, 0.68, -0.2),
  0.065,
  hologramMaterial
));

const raisedFoot = new THREE.Mesh(new THREE.SphereGeometry(0.095, 14, 10), hologramMaterial);
raisedFoot.position.set(0.76, 0.73, -0.2);
raisedFoot.scale.set(1.7, 0.6, 0.8);
dancer.add(raisedFoot);

const standingFoot = raisedFoot.clone();
standingFoot.position.set(-0.29, -0.61, 0.29);
standingFoot.rotation.x = -0.3;
dancer.add(standingFoot);

const halo = new THREE.Mesh(
  new THREE.TorusGeometry(1.08, 0.022, 8, 64),
  new THREE.MeshBasicMaterial({
    color: 0x72eaff,
    transparent: true,
    opacity: 0.58,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
halo.position.y = 1.02;
halo.rotation.x = Math.PI / 2;
dancer.add(halo);

const halo2 = halo.clone();
halo2.material = halo.material.clone();
halo2.material.color.set(0xff51d7);
halo2.scale.setScalar(0.77);
halo2.position.y = 1.44;
dancer.add(halo2);

const sparkleGeometry = new THREE.BufferGeometry();
const sparklePositions = [];
const sparkleColors = [];
const sparkleColor = new THREE.Color();

for (let i = 0; i < 70; i++) {
  const angle = i * 2.399963;
  const radius = 0.75 + ((i * 37) % 31) / 31 * 0.85;
  const y = ((i * 53) % 97) / 97 * 2.8 - 0.35;
  sparklePositions.push(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
  sparkleColor.setHSL((i * 0.091) % 1, 1, 0.68);
  sparkleColors.push(sparkleColor.r, sparkleColor.g, sparkleColor.b);
}

sparkleGeometry.setAttribute('position', new THREE.Float32BufferAttribute(sparklePositions, 3));
sparkleGeometry.setAttribute('color', new THREE.Float32BufferAttribute(sparkleColors, 3));

const sparkles = new THREE.Points(
  sparkleGeometry,
  new THREE.PointsMaterial({
    size: 0.055,
    vertexColors: true,
    transparent: true,
    opacity: 0.74,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
  })
);
sparkles.position.y = 0.55;
spindle.add(sparkles);

const windKey = new THREE.Group();
windKey.position.set(2.45, -0.08, 0);
windKey.rotation.z = Math.PI / 2;
musicBox.add(windKey);

const keyStem = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.48, 16), trimMaterial);
windKey.add(keyStem);

const keyLoop = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.055, 10, 28), trimMaterial);
keyLoop.position.y = 0.42;
keyLoop.rotation.x = Math.PI / 2;
windKey.add(keyLoop);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(12, 96),
  new THREE.MeshStandardMaterial({
    color: 0x020711,
    roughness: 0.52,
    metalness: 0.35,
    transparent: true,
    opacity: 0.9
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.98;
floor.receiveShadow = true;
scene.add(floor);

const floorAura = new THREE.Mesh(
  new THREE.RingGeometry(2.7, 4.5, 96),
  new THREE.MeshBasicMaterial({
    color: 0x165d8d,
    transparent: true,
    opacity: 0.12,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide
  })
);
floorAura.rotation.x = -Math.PI / 2;
floorAura.position.y = -0.965;
scene.add(floorAura);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  spindle.rotation.y = t * 0.68;
  dancer.position.y = 1.22 + Math.sin(t * 1.4) * 0.025;
  halo.rotation.z = t * 0.55;
  halo2.rotation.z = -t * 0.8;
  sparkles.rotation.y = -t * 0.18;
  sparkles.material.opacity = 0.62 + Math.sin(t * 2.2) * 0.12;
  topRings.rotation.y = Math.sin(t * 0.32) * 0.12;
  star.rotation.y = t * 0.09;

  shellMaterial.iridescenceThicknessRange[0] = 170 + Math.sin(t * 0.42) * 35;
  shellMaterial.iridescenceThicknessRange[1] = 760 + Math.cos(t * 0.37) * 80;

  controls.update();
  renderer.render(scene, camera);
}

animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
