<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Procedural Mechanical Wristwatch</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b0e}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090b0e);
scene.fog = new THREE.FogExp2(0x090b0e, 0.018);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 200);
camera.position.set(20, -19, 25);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 18;
controls.maxDistance = 55;
controls.target.set(0, 0, 0);

const steel = new THREE.MeshPhysicalMaterial({
  color: 0xaeb5ba, metalness: 1, roughness: 0.27,
  clearcoat: 0.25, clearcoatRoughness: 0.35
});
const brightSteel = new THREE.MeshPhysicalMaterial({
  color: 0xd9dee1, metalness: 1, roughness: 0.16,
  clearcoat: 0.35, clearcoatRoughness: 0.18
});
const darkSteel = new THREE.MeshStandardMaterial({
  color: 0x343a3f, metalness: 0.92, roughness: 0.3
});
const bezelMat = new THREE.MeshPhysicalMaterial({
  color: 0x151a1d, metalness: 0.78, roughness: 0.24,
  clearcoat: 0.45, clearcoatRoughness: 0.18
});
const dialMat = new THREE.MeshPhysicalMaterial({
  color: 0x0b171a, metalness: 0.42, roughness: 0.31,
  clearcoat: 0.3, clearcoatRoughness: 0.22
});
const lume = new THREE.MeshStandardMaterial({
  color: 0xe8ead3, emissive: 0xb9c9aa, emissiveIntensity: 0.22,
  roughness: 0.55
});
const white = new THREE.MeshStandardMaterial({
  color: 0xf2f2e8, metalness: 0.08, roughness: 0.4
});
const red = new THREE.MeshStandardMaterial({
  color: 0xb51f1c, metalness: 0.2, roughness: 0.32
});
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xdcefff, transparent: true, opacity: 0.2,
  transmission: 0.92, thickness: 0.25, ior: 1.48,
  roughness: 0.04, metalness: 0, clearcoat: 1
});

function mesh(geometry, material, parent, position = [0,0,0], rotation = [0,0,0]) {
  const m = new THREE.Mesh(geometry, material);
  m.position.set(...position);
  m.rotation.set(...rotation);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function roundedBox(w, h, d, r, material, parent, position = [0,0,0]) {
  const shape = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  shape.moveTo(x + r, y);
  shape.lineTo(x + w - r, y);
  shape.quadraticCurveTo(x + w, y, x + w, y + r);
  shape.lineTo(x + w, y + h - r);
  shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  shape.lineTo(x + r, y + h);
  shape.quadraticCurveTo(x, y + h, x, y + h - r);
  shape.lineTo(x, y + r);
  shape.quadraticCurveTo(x, y, x + r, y);
  const g = new THREE.ExtrudeGeometry(shape, {
    depth: d, bevelEnabled: true, bevelSegments: 2,
    steps: 1, bevelSize: Math.min(r * 0.22, 0.13), bevelThickness: 0.08
  });
  g.translate(0, 0, -d / 2);
  return mesh(g, material, parent, position);
}

const watch = new THREE.Group();
watch.rotation.set(-0.08, 0.12, -0.08);
scene.add(watch);

const caseGroup = new THREE.Group();
caseGroup.position.z = 0.35;
watch.add(caseGroup);

mesh(new THREE.CylinderGeometry(6.25, 6.25, 1.55, 128), steel, caseGroup, [0,0,0], [Math.PI/2,0,0]);
mesh(new THREE.CylinderGeometry(5.92, 5.92, 0.18, 128), darkSteel, caseGroup, [0,0,-0.86], [Math.PI/2,0,0]);

for (let i = 0; i < 72; i++) {
  const a = i * Math.PI * 2 / 72;
  const m = mesh(
    new THREE.BoxGeometry(i % 3 === 0 ? 0.12 : 0.075, 0.34, 0.88),
    i % 3 === 0 ? brightSteel : steel, caseGroup
  );
  m.position.set(Math.cos(a) * 6.18, Math.sin(a) * 6.18, 0.12);
  m.rotation.z = a - Math.PI / 2;
}

mesh(new THREE.TorusGeometry(5.82, 0.52, 12, 128), bezelMat, caseGroup, [0,0,1.05]);
mesh(new THREE.TorusGeometry(5.37, 0.08, 8, 128), brightSteel, caseGroup, [0,0,1.09]);

for (let i = 0; i < 60; i++) {
  const a = i * Math.PI * 2 / 60;
  const major = i % 5 === 0;
  const g = major
    ? new THREE.BoxGeometry(0.13, 0.56, 0.065)
    : new THREE.BoxGeometry(0.055, 0.3, 0.05);
  const mark = mesh(g, white, caseGroup);
  mark.position.set(Math.sin(a) * 5.62, Math.cos(a) * 5.62, 1.54);
  mark.rotation.z = -a;
}

const bezelTriangle = new THREE.Shape();
bezelTriangle.moveTo(0, 0.28);
bezelTriangle.lineTo(-0.2, -0.15);
bezelTriangle.lineTo(0.2, -0.15);
bezelTriangle.closePath();
const triangleGeo = new THREE.ShapeGeometry(bezelTriangle);
mesh(triangleGeo, lume, caseGroup, [0,5.62,1.59]);

mesh(new THREE.CylinderGeometry(5.15, 5.15, 0.18, 128), dialMat, caseGroup, [0,0,1.28], [Math.PI/2,0,0]);
mesh(new THREE.TorusGeometry(4.94, 0.035, 8, 128), brightSteel, caseGroup, [0,0,1.41]);

for (let i = 0; i < 60; i++) {
  const a = i * Math.PI * 2 / 60;
  const major = i % 5 === 0;
  const mark = mesh(
    new THREE.BoxGeometry(major ? 0.08 : 0.025, major ? 0.34 : 0.16, 0.045),
    major ? lume : white, caseGroup
  );
  mark.position.set(Math.sin(a) * 4.67, Math.cos(a) * 4.67, 1.46);
  mark.rotation.z = -a;
}

for (let h = 0; h < 12; h++) {
  const a = h * Math.PI * 2 / 12;
  let marker;
  if (h === 0) {
    const shape = new THREE.Shape();
    shape.moveTo(0, 0.46);
    shape.lineTo(-0.26, -0.28);
    shape.lineTo(0.26, -0.28);
    shape.closePath();
    marker = mesh(new THREE.ShapeGeometry(shape), lume, caseGroup);
  } else if (h === 3 || h === 6 || h === 9) {
    marker = mesh(new THREE.BoxGeometry(0.38, 0.72, 0.1), lume, caseGroup);
  } else {
    marker = mesh(new THREE.BoxGeometry(0.28, 0.62, 0.1), lume, caseGroup);
  }
  marker.position.set(Math.sin(a) * 4.05, Math.cos(a) * 4.05, 1.52);
  marker.rotation.z = -a;
}

mesh(new THREE.TorusGeometry(1.05, 0.055, 8, 64), brightSteel, caseGroup, [0,-2.05,1.5]);
mesh(new THREE.CircleGeometry(0.93, 64), dialMat, caseGroup, [0,-2.05,1.49]);
for (let i = 0; i < 30; i++) {
  const a = i * Math.PI * 2 / 30;
  const tick = mesh(new THREE.BoxGeometry(0.025, i % 5 === 0 ? 0.17 : 0.1, 0.025), white, caseGroup);
  tick.position.set(Math.sin(a) * 0.78, -2.05 + Math.cos(a) * 0.78, 1.54);
  tick.rotation.z = -a;
}
const subHand = mesh(new THREE.BoxGeometry(0.045, 0.67, 0.035), red, caseGroup, [0,-1.76,1.59]);
subHand.rotation.z = -0.34;

function handShape(width, length, tail, material, z) {
  const s = new THREE.Shape();
  s.moveTo(-width * 0.42, -tail);
  s.lineTo(-width / 2, length * 0.7);
  s.lineTo(0, length);
  s.lineTo(width / 2, length * 0.7);
  s.lineTo(width * 0.42, -tail);
  s.closePath();
  return mesh(new THREE.ShapeGeometry(s), material, caseGroup, [0,0,z]);
}

const hourHand = handShape(0.42, 2.35, 0.35, lume, 1.7);
hourHand.rotation.z = -1.12;
const minuteHand = handShape(0.3, 3.45, 0.42, lume, 1.76);
minuteHand.rotation.z = 0.48;
const secondHand = mesh(new THREE.BoxGeometry(0.055, 4.45, 0.045), red, caseGroup, [0,1.34,1.84]);
secondHand.rotation.z = -0.75;
mesh(new THREE.CircleGeometry(0.25, 32), brightSteel, caseGroup, [0,0,1.9]);
mesh(new THREE.CircleGeometry(0.11, 24), red, caseGroup, [0,0,1.93]);

const dateFrame = roundedBox(0.95, 0.72, 0.06, 0.1, brightSteel, caseGroup, [3.0,0,1.53]);
dateFrame.scale.set(1,1,1);
roundedBox(0.78, 0.56, 0.07, 0.07, white, caseGroup, [3.0,0,1.58]);
for (const dx of [-0.13, 0.13]) {
  mesh(new THREE.BoxGeometry(0.06, 0.32, 0.025), darkSteel, caseGroup, [3.0 + dx, 0, 1.66]);
}

mesh(new THREE.SphereGeometry(5.12, 96, 32, 0, Math.PI*2, 0, 0.23), glassMat, caseGroup, [0,0,1.44]);

function lug(x, y) {
  const l = roundedBox(1.25, 2.55, 1.15, 0.38, steel, watch, [x,y,-0.28]);
  l.rotation.z = x > 0 ? -0.12 : 0.12;
  return l;
}
lug(-4.55, 5.55);
lug(4.55, 5.55);
lug(-4.55, -5.55);
lug(4.55, -5.55);

for (const y of [-6.25, 6.25]) {
  mesh(new THREE.CylinderGeometry(0.19,0.19,8.3,32), brightSteel, watch, [0,y,-0.35], [0,0,Math.PI/2]);
}

const crown = new THREE.Group();
crown.position.set(7.15, 0, 0.32);
watch.add(crown);
mesh(new THREE.CylinderGeometry(0.58,0.7,1.15,48), steel, crown, [0,0,0], [0,0,Math.PI/2]);
mesh(new THREE.CylinderGeometry(0.82,0.82,0.9,64), brightSteel, crown, [0.7,0,0], [0,0,Math.PI/2]);
for (let i = 0; i < 32; i++) {
  const a = i * Math.PI * 2 / 32;
  const ridge = mesh(new THREE.BoxGeometry(0.92,0.08,0.12), darkSteel, crown);
  ridge.position.set(0.72, Math.cos(a)*0.79, Math.sin(a)*0.79);
  ridge.rotation.x = a;
}
mesh(new THREE.CircleGeometry(0.58,48), darkSteel, crown, [1.17,0,0], [0,Math.PI/2,0]);
mesh(new THREE.TorusGeometry(0.29,0.06,8,32), brightSteel, crown, [1.18,0,0], [0,Math.PI/2,0]);

for (const y of [-1.35, 1.35]) {
  const guard = roundedBox(1.8, 1.15, 1.25, 0.36, steel, watch, [6.25,y,-0.08]);
  guard.rotation.z = y > 0 ? -0.12 : 0.12;
}

const bracelet = new THREE.Group();
bracelet.position.z = -0.65;
watch.add(bracelet);

function braceletLink(y, width, height, scale = 1) {
  const g = new THREE.Group();
  g.position.y = y;
  g.scale.x = scale;
  bracelet.add(g);
  roundedBox(width * 0.34, height, 0.72, 0.16, brightSteel, g, [0,0,0.12]);
  roundedBox(width * 0.29, height * 0.94, 0.58, 0.14, steel, g, [-width*0.32,0,0]);
  roundedBox(width * 0.29, height * 0.94, 0.58, 0.14, steel, g, [width*0.32,0,0]);
  roundedBox(width * 0.12, height * 0.85, 0.48, 0.1, darkSteel, g, [-width*0.49,0,-0.02]);
  roundedBox(width * 0.12, height * 0.85, 0.48, 0.1, darkSteel, g, [width*0.49,0,-0.02]);
}

const linkH = 1.18;
for (let i = 0; i < 10; i++) {
  const y = 6.75 + i * 1.1;
  braceletLink(y, 7.75 - i*0.18, linkH, 1);
}
for (let i = 0; i < 10; i++) {
  const y = -6.75 - i * 1.1;
  braceletLink(y, 7.75 - i*0.18, linkH, 1);
}

roundedBox(6.1, 3.05, 0.85, 0.48, steel, bracelet, [0,17.75,-0.02]);
roundedBox(4.9, 2.25, 0.18, 0.34, darkSteel, bracelet, [0,17.75,0.48]);
roundedBox(3.75, 1.1, 0.12, 0.25, brightSteel, bracelet, [0,17.75,0.62]);
mesh(new THREE.TorusGeometry(0.36,0.08,8,36), darkSteel, bracelet, [0,17.75,0.7]);
roundedBox(6.1, 3.05, 0.85, 0.48, steel, bracelet, [0,-17.75,-0.02]);
roundedBox(5.1, 2.1, 0.16, 0.34, darkSteel, bracelet, [0,-17.75,0.5]);

for (const side of [-1,1]) {
  roundedBox(0.38, 2.1, 0.55, 0.12, brightSteel, bracelet, [side*3.05,17.75,0]);
  roundedBox(0.38, 2.1, 0.55, 0.12, brightSteel, bracelet, [side*3.05,-17.75,0]);
}

const floor = mesh(
  new THREE.CircleGeometry(45,128),
  new THREE.MeshStandardMaterial({color:0x11161a,metalness:0.1,roughness:0.72}),
  scene,[0,0,-4.1]
);
floor.receiveShadow = true;

const ring = mesh(
  new THREE.TorusGeometry(15,0.025,6,160),
  new THREE.MeshBasicMaterial({color:0x38434a,transparent:true,opacity:0.35}),
  scene,[0,0,-4.0]
);

const hemi = new THREE.HemisphereLight(0xc8dded, 0x16120f, 1.35);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 5.2);
key.position.set(-9,-10,22);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left = -25;
key.shadow.camera.right = 25;
key.shadow.camera.top = 25;
key.shadow.camera.bottom = -25;
key.shadow.camera.near = 1;
key.shadow.camera.far = 60;
key.shadow.bias = -0.0002;
scene.add(key);

const rim = new THREE.SpotLight(0x8dc9ff, 70, 55, 0.48, 0.65, 1.5);
rim.position.set(14,16,16);
rim.target.position.set(0,2,0);
scene.add(rim, rim.target);

const warm = new THREE.SpotLight(0xffbd85, 45, 50, 0.55, 0.75, 1.7);
warm.position.set(-16,10,8);
warm.target.position.set(0,0,0);
scene.add(warm, warm.target);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
}
addEventListener('resize', resize);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  secondHand.rotation.z = -0.75 - t * Math.PI / 30;
  subHand.rotation.z = -0.34 - t * Math.PI / 30;
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
