<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kawaii Honeybee</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #17181d; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------------------
// Renderer / Scene / Camera
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x191a20);
scene.fog = new THREE.Fog(0x191a20, 3.2, 9.0);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(0.95, 0.72, 1.55);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.target.set(0, 0.30, 0);
controls.minDistance = 0.75;
controls.maxDistance = 5.0;
controls.maxPolarAngle = Math.PI * 0.52;

// ---------------------------------------------------------------------------
// Lighting: hemisphere ambience + key / fill / rim
// ---------------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0xdfe6ff, 0x2a2620, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3dd, 2.35);
key.position.set(1.9, 2.9, 2.1);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 4;
key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.012;
const kc = key.shadow.camera;
kc.near = 0.5; kc.far = 10; kc.left = -1.6; kc.right = 1.6; kc.top = 1.6; kc.bottom = -1.6;
kc.updateProjectionMatrix();
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd2ff, 0.62);
fill.position.set(-2.4, 1.15, 1.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9ec, 1.15);
rim.position.set(-1.1, 1.8, -2.6);
scene.add(rim);

const bounce = new THREE.PointLight(0xffe6b0, 0.35, 4.0, 2.0);
bounce.position.set(0, 0.06, 0.85);
scene.add(bounce);

// Shadow-only ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(14, 14),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// ---------------------------------------------------------------------------
// Materials (soft satin sheen)
// ---------------------------------------------------------------------------
const matYellow = new THREE.MeshPhysicalMaterial({
  color: 0xffce4a, roughness: 0.42, metalness: 0.0,
  clearcoat: 0.55, clearcoatRoughness: 0.5, sheen: 0.7,
  sheenColor: new THREE.Color(0xfff0bb), sheenRoughness: 0.65
});
const matBlack = new THREE.MeshPhysicalMaterial({
  color: 0x2b2823, roughness: 0.72, metalness: 0.0,
  clearcoat: 0.22, clearcoatRoughness: 0.75, sheen: 0.45,
  sheenColor: new THREE.Color(0x6b6357), sheenRoughness: 0.8
});
const matEye = new THREE.MeshPhysicalMaterial({
  color: 0x0d0c10, roughness: 0.06, metalness: 0.0,
  clearcoat: 1.0, clearcoatRoughness: 0.03
});
const matWhite = new THREE.MeshStandardMaterial({
  color: 0xffffff, roughness: 0.22, metalness: 0.0,
  emissive: 0xffffff, emissiveIntensity: 0.35
});
const matBlush = new THREE.MeshStandardMaterial({
  color: 0xff9bb4, roughness: 0.85, metalness: 0.0,
  transparent: true, opacity: 0.82
});
const matSmile = new THREE.MeshStandardMaterial({ color: 0x4a3326, roughness: 0.6 });
const matHeart = new THREE.MeshPhysicalMaterial({
  color: 0xff8fb0, roughness: 0.3, metalness: 0.0,
  clearcoat: 0.8, clearcoatRoughness: 0.25, sheen: 0.6,
  sheenColor: new THREE.Color(0xffd7e4)
});
const matWing = new THREE.MeshPhysicalMaterial({
  color: 0xdcefff, roughness: 0.32, metalness: 0.0,
  transmission: 0.82, thickness: 0.05, ior: 1.28,
  transparent: true, opacity: 0.62, side: THREE.DoubleSide,
  clearcoat: 0.9, clearcoatRoughness: 0.28,
  iridescence: 0.55, iridescenceIOR: 1.25,
  sheen: 0.9, sheenColor: new THREE.Color(0xffe2f4),
  attenuationColor: new THREE.Color(0xcfe6ff), attenuationDistance: 0.4
});
const matWingRib = new THREE.MeshStandardMaterial({
  color: 0xbfd8f2, roughness: 0.45, transparent: true, opacity: 0.5
});
const matStinger = new THREE.MeshStandardMaterial({ color: 0x3a3229, roughness: 0.5 });

// ---------------------------------------------------------------------------
// Root
// ---------------------------------------------------------------------------
const bee = new THREE.Group();
scene.add(bee);

function shade(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// ---------------------------------------------------------------------------
// BODY — rounded jellybean abdomen (lathe of a bean profile), sliced into
// fat alternating bands of butter-yellow and matte black.
// ---------------------------------------------------------------------------
// Body axis runs along +Z (back) .. -Z (front). We build it along local Y then
// rotate, using a lathe profile that bulges like a jellybean.
const BODY_LEN = 0.44;   // along axis
const BODY_MAXR = 0.185; // fattest radius

function bodyRadiusAt(t) {
  // t in [0,1] from front (0) to tail (1). Jellybean: fat mid, rounded ends,
  // slightly fatter toward the rear.
  const s = Math.sin(Math.PI * Math.pow(t, 0.86));
  const bias = 0.86 + 0.30 * t - 0.16 * t * t;
  return BODY_MAXR * Math.pow(s, 0.62) * bias;
}

const bodyGroup = new THREE.Group();
bee.add(bodyGroup);

// Bands: 5 segments alternating yellow / black across the body length.
const BANDS = 5;
const SEGS_PER_BAND = 14;
const RADIAL = 64;

for (let b = 0; b < BANDS; b++) {
  const t0 = b / BANDS;
  const t1 = (b + 1) / BANDS;
  const pts = [];
  // small overlap to avoid hairline seams
  const pad = 0.004;
  const a = Math.max(0, t0 - (b === 0 ? 0 : pad));
  const c = Math.min(1, t1 + (b === BANDS - 1 ? 0 : pad));
  for (let i = 0; i <= SEGS_PER_BAND; i++) {
    const t = a + (c - a) * (i / SEGS_PER_BAND);
    const r = Math.max(0.0008, bodyRadiusAt(t));
    pts.push(new THREE.Vector2(r, -t * BODY_LEN));
  }
  const g = new THREE.LatheGeometry(pts, RADIAL);
  const m = new THREE.Mesh(g, (b % 2 === 0) ? matYellow : matBlack);
  bodyGroup.add(shade(m));
}

// Orient body: local -Y (t increasing) should point toward +Z (rear) and tilt up.
bodyGroup.rotation.x = -Math.PI / 2;
bodyGroup.position.set(0, 0.255, 0.045);
bodyGroup.rotation.z = 0;
// slight upward tilt of the tail for a perky chibi pose
bodyGroup.rotation.x = -Math.PI / 2 - 0.16;

// Tiny soft stinger nub at the tail
const stinger = shade(new THREE.Mesh(new THREE.ConeGeometry(0.026, 0.062, 20), matStinger));
stinger.position.set(0, 0.278, 0.475);
stinger.rotation.x = Math.PI / 2 + 0.30;
bee.add(stinger);

// ---------------------------------------------------------------------------
// HEAD — oversized, softly squashed sphere
// ---------------------------------------------------------------------------
const HEAD_R = 0.235;
const head = new THREE.Group();
head.position.set(0, 0.335, -0.205);
bee.add(head);

const headGeo = new THREE.SphereGeometry(HEAD_R, 72, 56);
// gentle squash + slightly flattened face
{
  const p = headGeo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    v.y *= 0.94;
    v.z *= 0.97;
    // flatten the very front a touch so the face reads flat-ish
    const front = Math.max(0, -v.z / HEAD_R);
    v.z += front * front * 0.022 * HEAD_R / 0.235 * 0.235;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  headGeo.computeVertexNormals();
}
const headMesh = shade(new THREE.Mesh(headGeo, matBlack));
head.add(headMesh);

// Butter-yellow "face patch" — a shallow cap on the front of the head
{
  const faceGeo = new THREE.SphereGeometry(HEAD_R * 1.004, 64, 48, 0, Math.PI * 2, 0, Math.PI * 0.62);
  const p = faceGeo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    v.y *= 0.94;
    v.z *= 0.97;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  faceGeo.computeVertexNormals();
  const face = new THREE.Mesh(faceGeo, matYellow);
  face.castShadow = false;
  face.receiveShadow = true;
  face.rotation.x = -Math.PI / 2; // cap faces -Z (forward)
  face.position.set(0, -0.012, 0.0);
  head.add(face);
}

// ---- Eyes ------------------------------------------------------------------
function makeEye(side) {
  const g = new THREE.Group();
  const eyeR = 0.055;
  const eye = new THREE.Mesh(new THREE.SphereGeometry(eyeR, 40, 32), matEye);
  eye.scale.set(1.0, 1.14, 0.82);
  eye.castShadow = false;
  g.add(eye);

  // big kawaii highlight
  const hi = new THREE.Mesh(new THREE.SphereGeometry(eyeR * 0.30, 20, 16), matWhite);
  hi.position.set(-side * eyeR * 0.30, eyeR * 0.40, -eyeR * 0.72);
  hi.scale.set(1, 1, 0.55);
  g.add(hi);

  // small secondary sparkle
  const hi2 = new THREE.Mesh(new THREE.SphereGeometry(eyeR * 0.15, 16, 12), matWhite);
  hi2.position.set(side * eyeR * 0.34, -eyeR * 0.38, -eyeR * 0.70);
  hi2.scale.set(1, 1, 0.55);
  g.add(hi2);

  return g;
}

const eyeX = 0.108, eyeY = 0.020, eyeZ = -HEAD_R * 0.895;
const eyeL = makeEye(1);  eyeL.position.set(-eyeX, eyeY, eyeZ); eyeL.rotation.y = -0.30; head.add(eyeL);
const eyeR = makeEye(-1); eyeR.position.set( eyeX, eyeY, eyeZ); eyeR.rotation.y =  0.30; head.add(eyeR);

// ---- Blush ovals -----------------------------------------------------------
function makeBlush(sign) {
  const g = new THREE.Mesh(new THREE.CircleGeometry(0.046, 40), matBlush);
  g.scale.set(1.0, 0.66, 1.0);
  const ang = sign * 0.72;
  const r = HEAD_R * 0.985;
  g.position.set(Math.sin(ang) * r * 0.96, -0.070, -Math.cos(ang) * r * 0.95);
  g.lookAt(
    g.position.x * 2.2,
    g.position.y * 2.2 - 0.02,
    g.position.z * 2.2
  );
  g.renderOrder = 2;
  return g;
}
head.add(makeBlush(1));
head.add(makeBlush(-1));

// ---- Little smile ----------------------------------------------------------
{
  const smileShape = new THREE.TorusGeometry(0.042, 0.0072, 12, 40, Math.PI * 0.82);
  const smile = new THREE.Mesh(smileShape, matSmile);
  smile.position.set(0, -0.036, -HEAD_R * 0.935);
  smile.rotation.z = Math.PI + Math.PI * 0.09;
  smile.rotation.x = Math.PI;
  smile.scale.set(1, 0.72, 1);
  head.add(smile);
}

// ---------------------------------------------------------------------------
// ANTENNAE — stubby stalks ending in little hearts
// ---------------------------------------------------------------------------
function makeHeart(size) {
  const s = new THREE.Shape();
  const k = size;
  s.moveTo(0, -1.0 * k);
  s.bezierCurveTo(-1.25 * k, 0.05 * k, -0.95 * k, 1.15 * k, 0, 0.52 * k);
  s.bezierCurveTo(0.95 * k, 1.15 * k, 1.25 * k, 0.05 * k, 0, -1.0 * k);
  const g = new THREE.ExtrudeGeometry(s, {
    depth: k * 0.42, bevelEnabled: true,
    bevelThickness: k * 0.20, bevelSize: k * 0.20, bevelSegments: 5, curveSegments: 24
  });
  g.center();
  return g;
}

const heartGeo = makeHeart(0.042);

function makeAntenna(sign) {
  const g = new THREE.Group();

  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(sign * 0.022, 0.052, -0.016),
    new THREE.Vector3(sign * 0.056, 0.094, -0.034),
    new THREE.Vector3(sign * 0.086, 0.122, -0.046)
  ]);
  const stalk = shade(new THREE.Mesh(
    new THREE.TubeGeometry(curve, 40, 0.0125, 14, false), matBlack
  ));
  g.add(stalk);

  const capA = new THREE.Mesh(new THREE.SphereGeometry(0.0125, 16, 12), matBlack);
  g.add(capA);

  const heart = shade(new THREE.Mesh(heartGeo, matHeart));
  const end = curve.getPoint(1);
  heart.position.copy(end).add(new THREE.Vector3(sign * 0.012, 0.030, -0.006));
  heart.rotation.set(0.12, sign * 0.42, -sign * 0.30);
  g.add(heart);

  return g;
}

const antL = makeAntenna(-1);
antL.position.set(-0.070, HEAD_R * 0.80, -0.060);
head.add(antL);
const antR = makeAntenna(1);
antR.position.set(0.070, HEAD_R * 0.80, -0.060);
head.add(antR);

// ---------------------------------------------------------------------------
// WINGS — four frosted-glass petals on the back
// ---------------------------------------------------------------------------
function makeWingGeometry(len, wid) {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.bezierCurveTo(len * 0.22, wid * 0.95, len * 0.72, wid * 1.02, len, wid * 0.16);
  s.bezierCurveTo(len * 0.80, -wid * 0.62, len * 0.30, -wid * 0.70, 0, 0);
  return new THREE.ExtrudeGeometry(s, {
    depth: 0.006, bevelEnabled: true,
    bevelThickness: 0.005, bevelSize: 0.006, bevelSegments: 4, curveSegments: 40
  });
}

function makeWing(len, wid) {
  const g = new THREE.Group();
  const petal = new THREE.Mesh(makeWingGeometry(len, wid), matWing);
  petal.castShadow = false;
  g.add(petal);

  // a couple of faint ribs for that frosted-petal read
  const ribCurves = [
    [new THREE.Vector3(0.01, 0.004, 0.004), new THREE.Vector3(len * 0.45, wid * 0.42, 0.004), new THREE.Vector3(len * 0.94, wid * 0.20, 0.004)],
    [new THREE.Vector3(0.01, 0.000, 0.004), new THREE.Vector3(len * 0.48, -wid * 0.12, 0.004), new THREE.Vector3(len * 0.92, wid * 0.06, 0.004)]
  ];
  for (const pts of ribCurves) {
    const c = new THREE.CatmullRomCurve3(pts);
    const rib = new THREE.Mesh(new THREE.TubeGeometry(c, 30, 0.0035, 8, false), matWingRib);
    g.add(rib);
  }
  return g;
}

const wings = new THREE.Group();
wings.position.set(0, 0.375, 0.010);
bee.add(wings);

const wingSpecs = [
  // sign, len, wid, yaw, pitch, roll, pos
  { s: -1, len: 0.315, wid: 0.145, pos: [-0.045, 0.030, -0.010], rot: [0.30, 0.55, 0.55] },
  { s:  1, len: 0.315, wid: 0.145, pos: [ 0.045, 0.030, -0.010], rot: [0.30, -0.55, -0.55] },
  { s: -1, len: 0.245, wid: 0.110, pos: [-0.040, -0.010, 0.045], rot: [0.05, 0.95, 0.16] },
  { s:  1, len: 0.245, wid: 0.110, pos: [ 0.040, -0.010, 0.045], rot: [0.05, -0.95, -0.16] }
];

const wingMeshes = [];
for (const w of wingSpecs) {
  const g = makeWing(w.len, w.wid);
  g.position.set(w.pos[0], w.pos[1], w.pos[2]);
  g.rotation.set(w.rot[0], w.rot[1], w.rot[2]);
  if (w.s < 0) g.scale.x = 1; // shape already mirrored by yaw
  g.scale.set(w.s < 0 ? -1 : 1, 1, 1);
  wings.add(g);
  wingMeshes.push({ obj: g, base: g.rotation.clone(), sign: w.s });
}

// ---------------------------------------------------------------------------
// LEGS — six stubby nubs
// ---------------------------------------------------------------------------
function makeNub(len, r) {
  const g = new THREE.Group();
  const body = shade(new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 8, 20), matBlack));
  g.add(body);
  const foot = shade(new THREE.Mesh(new THREE.SphereGeometry(r * 1.20, 22, 16), matBlack));
  foot.position.y = -len / 2 - r * 0.18;
  foot.scale.set(1.12, 0.80, 1.20);
  g.add(foot);
  return g;
}

const legData = [
  { z: -0.115, x: 0.118, len: 0.070, r: 0.031, tilt: 0.42, spread: 0.30 },
  { z:  0.030, x: 0.132, len: 0.078, r: 0.033, tilt: 0.34, spread: 0.06 },
  { z:  0.170, x: 0.118, len: 0.066, r: 0.030, tilt: 0.30, spread: -0.24 }
];

for (const L of legData) {
  for (const s of [-1, 1]) {
    const nub = makeNub(L.len, L.r);
    const yTop = 0.145;
    nub.position.set(s * L.x, yTop - L.len * 0.30, L.z);
    nub.rotation.z = s * L.tilt;
    nub.rotation.x = L.spread;
    bee.add(nub);
  }
}

// ---------------------------------------------------------------------------
// Fit the bee just above the ground plane
// ---------------------------------------------------------------------------
{
  const box = new THREE.Box3().setFromObject(bee);
  bee.position.y -= box.min.y;
}

// A soft contact shadow disc is unnecessary — the ShadowMaterial plane handles it.

// ---------------------------------------------------------------------------
// Animation
// ---------------------------------------------------------------------------
const clock = new THREE.Clock();
const baseY = bee.position.y;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // gentle idle bob + micro sway
  bee.position.y = baseY + Math.sin(t * 1.6) * 0.008;
  bee.rotation.z = Math.sin(t * 0.9) * 0.020;

  // wing shimmer flutter
  for (let i = 0; i < wingMeshes.length; i++) {
    const w = wingMeshes[i];
    const f = Math.sin(t * 6.0 + i * 0.7) * 0.075;
    w.obj.rotation.x = w.base.x + f;
    w.obj.rotation.z = w.base.z + w.sign * f * 0.35;
  }

  // antenna hearts wiggle
  antL.rotation.z = Math.sin(t * 1.9) * 0.07;
  antR.rotation.z = Math.sin(t * 1.9 + 0.6) * -0.07;

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
