import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const seed = 718274;
let randomState = seed >>> 0;
function rand() {
  randomState = (randomState * 1664525 + 1013904223) >>> 0;
  return randomState / 4294967296;
}
function range(min, max) {
  return min + (max - min) * rand();
}
function choose(items) {
  return items[Math.floor(rand() * items.length)];
}

function canvasTexture(width, height, draw, repeatX = 1, repeatY = 1) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  draw(ctx, width, height);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(repeatX, repeatY);
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const concreteMap = canvasTexture(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#515556';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 3500; i++) {
    const shade = Math.floor(range(55, 105));
    ctx.fillStyle = `rgba(${shade},${shade + 2},${shade + 2},${range(0.02, 0.12)})`;
    const s = range(0.3, 2.4);
    ctx.fillRect(rand() * w, rand() * h, s, s);
  }
  for (let i = 0; i < 32; i++) {
    ctx.strokeStyle = `rgba(25,25,23,${range(0.05, 0.18)})`;
    ctx.lineWidth = range(0.3, 1.2);
    ctx.beginPath();
    ctx.moveTo(rand() * w, rand() * h);
    ctx.lineTo(rand() * w, rand() * h);
    ctx.stroke();
  }
}, 6, 6);

const tileMap = canvasTexture(192, 192, (ctx, w, h) => {
  ctx.fillStyle = '#b2afa2';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#6c6a62';
  ctx.lineWidth = 5;
  for (let y = 0; y <= h; y += 48) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }
  for (let x = 0; x <= w; x += 48) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, h);
    ctx.stroke();
  }
  for (let i = 0; i < 1100; i++) {
    ctx.fillStyle = `rgba(65,62,54,${range(0.015, 0.09)})`;
    ctx.fillRect(rand() * w, rand() * h, range(0.4, 2), range(0.4, 2));
  }
  ctx.fillStyle = 'rgba(55,49,37,.13)';
  ctx.fillRect(0, 145, w, 18);
}, 5, 2);

const floorMap = canvasTexture(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#77766e';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#3d3e3c';
  ctx.lineWidth = 3;
  for (let y = 0; y <= h; y += 64) {
    for (let x = 0; x <= w; x += 64) {
      ctx.strokeRect(x, y, 64, 64);
    }
  }
  for (let i = 0; i < 900; i++) {
    const gray = Math.floor(range(80, 150));
    ctx.fillStyle = `rgba(${gray},${gray},${gray - 4},${range(0.02, 0.13)})`;
    ctx.fillRect(rand() * w, rand() * h, range(0.5, 2), range(0.5, 2));
  }
  for (let i = 0; i < 22; i++) {
    ctx.strokeStyle = `rgba(32,31,27,${range(.06,.2)})`;
    ctx.lineWidth = range(.4, 1.8);
    ctx.beginPath();
    ctx.moveTo(rand() * w, rand() * h);
    ctx.lineTo(rand() * w, rand() * h);
    ctx.stroke();
  }
}, 10, 3);

    ctx.stroke();

function mesh(geometry, material, x = 0, y = 0, z = 0, cast = true, receive = true) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(x, y, z);
  object.castShadow = cast;
  object.receiveShadow = receive;
  scene.add(object);
  return object;
}

function groupMesh(geometry, material, parent, x = 0, y = 0, z = 0, cast = true, receive = true) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(x, y, z);
  object.castShadow = cast;
  object.receiveShadow = receive;
  parent.add(object);
  return object;
}

function box(parent, w, h, d, material, x, y, z, cast = true, receive = true) {
  return groupMesh(new THREE.BoxGeometry(w, h, d), material, parent, x, y, z, cast, receive);
}

function cylinder(parent, radiusTop, radiusBottom, height, material, x, y, z, rotationZ = 0) {
  const object = groupMesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, 12),
    material,
    parent,
    x,
    y,
    z
  );
  object.rotation.z = rotationZ;
  return object;
}

function signTexture(title, subline, background, foreground) {
  return canvasTexture(768, 220, (ctx, w, h) => {
    ctx.fillStyle = background;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.fillRect(0, 0, w, 8);
    ctx.fillStyle = foreground;
    ctx.font = 'bold 92px Arial, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText(title, 42, 92);
    ctx.font = 'bold 29px Arial, sans-serif';
    ctx.globalAlpha = 0.82;
    ctx.fillText(subline, 46, 160);
    ctx.globalAlpha = 1;
  });
}

function makeHangingSign(x, z, title, subline, color) {
  const sign = new THREE.Group();
  sign.position.set(x, 5.2, z);
  scene.add(sign);
  const faceMap = signTexture(title, subline, color, '#f5f0dc');
  const faceMat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    map: faceMap,
    emissive: new THREE.Color(0xffffff),
    emissiveMap: faceMap,
    emissiveIntensity: 0.28,
    roughness: 0.38
  });
  box(sign, 4.8, 1.35, 0.13, darkSteelMat, 0, 0, 0);
  groupMesh(new THREE.PlaneGeometry(4.45, 1.08), faceMat, sign, 0, 0, 0.076, false, false);
  groupMesh(new THREE.PlaneGeometry(4.45, 1.08), faceMat, sign, 0, 0, -0.076, false, false).rotation.y = Math.PI;
  const cableMat = new THREE.MeshStandardMaterial({ color: 0x242728, roughness: 0.65, metalness: 0.7 });
  cylinder(sign, 0.032, 0.032, 1.45, cableMat, -1.5, 1.37, 0);
  cylinder(sign, 0.032, 0.032, 1.45, cableMat, 1.5, 1.37, 0);
  return sign;
}

function routeMapTexture() {
  return canvasTexture(700, 430, (ctx, w, h) => {
    ctx.fillStyle = '#e5dfc8';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#1d2c35';
    ctx.font = 'bold 40px Arial';
    ctx.fillText('METRO NETWORK', 34, 55);
    const lines = [
      ['#ca2d2b', [[60,110],[170,150],[270,130],[370,190],[490,165],[640,245]]],
      ['#1b75ba', [[70,320],[160,260],[250,275],[350,220],[470,260],[625,175]]],
      ['#d39f27', [[100,180],[180,205],[245,195],[325,260],[420,315],[590,340]]]
    ];
    for (const line of lines) {
      ctx.strokeStyle = line[0];
      ctx.lineWidth = 12;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(line[1][0][0], line[1][0][1]);
      for (let i = 1; i < line[1].length; i++) {
        ctx.lineTo(line[1][i][0], line[1][i][1]);
      }
      ctx.stroke();
      for (const point of line[1]) {
        ctx.fillStyle = '#fbf8e9';
        ctx.beginPath();
        ctx.arc(point[0], point[1], 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#17242d';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
    ctx.fillStyle = '#45525a';
    ctx.font = '18px Arial';
    ctx.fillText('You are here', 448, 385);
    ctx.fillStyle = '#ca2d2b';
    ctx.beginPath();
    ctx.arc(425, 380, 9, 0, Math.PI * 2);
    ctx.fill();
  });
}

function vendingTexture(kind) {
  return canvasTexture(320, 620, (ctx, w, h) => {
    const cool = kind === 'DRINKS';
    ctx.fillStyle = cool ? '#1e5268' : '#a72824';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    ctx.fillRect(14, 18, w - 28, 90);
    ctx.fillStyle = '#f3ead3';
    ctx.font = 'bold 38px Arial';
    ctx.fillText(kind, 25, 76);
    ctx.fillStyle = '#172227';
    ctx.fillRect(24, 132, 190, 312);
    for (let row = 0; row < 4; row++) {
      for (let col = 0; col < 4; col++) {
        ctx.fillStyle = choose(['#ebc03b','#e9e7de','#6fb1c5','#d85a35','#7ea567']);
        ctx.fillRect(37 + col * 43, 147 + row * 68, 29, 46);
        ctx.fillStyle = 'rgba(255,255,255,.24)';
        ctx.fillRect(41 + col * 43, 151 + row * 68, 21, 7);
      }
    }
    ctx.fillStyle = '#263038';
    ctx.fillRect(230, 150, 62, 295);
    ctx.fillStyle = '#c0c8c4';
    ctx.fillRect(244, 174, 34, 37);
    ctx.fillRect(244, 246, 34, 17);
    ctx.fillStyle = '#101314';
    ctx.fillRect(40, 474, 238, 80);
    ctx.fillStyle = '#d2d5cc';
    ctx.fillRect(87, 505, 146, 13);
  });
}

  box(car, 10.94, 0.12, 0.26, darkSteelMat, 0, -0.34, 1.34);
  for (const side of [-1, 1]) {
    const sideZ = side * 1.341;
    for (const windowX of [-3.68, -2.35, -0.75, 0.75, 2.35, 3.68]) {
      box(car, 0.95, 1.18, 0.06, windowMat, windowX, 0.45, sideZ);
      const separator = box(car, 0.05, 1.35, 0.11, darkSteelMat, windowX + 0.52, 0.45, sideZ);
      separator.castShadow = false;
    }
    for (const doorX of [-1.55, 1.55]) {
      box(car, 1.14, 1.72, 0.085, doorMat, doorX, 0.15, sideZ);
      box(car, 0.035, 1.66, 0.105, darkSteelMat, doorX, 0.15, sideZ);
      box(car, 0.19, 0.045, 0.11, steelMat, doorX + 0.33, 0.22, sideZ * 1.02);

    box(car, 10.5, 0.1, 0.1, new THREE.MeshStandardMaterial({ color: 0xc8bb80, emissive: 0x887527, emissiveIntensity: 0.45 }), 0, 1.25, sideZ * 1.02);
  }
  for (const wheelX of [-3.9, 3.9]) {
    const wheel = groupMesh(new THREE.CylinderGeometry(0.48, 0.48, 0.24, 16), darkSteelMat, car, wheelX, -1.78, 0.9);
    wheel.rotation.x = Math.PI / 2;
    const wheelBack = groupMesh(new THREE.CylinderGeometry(0.48, 0.48, 0.24, 16), darkSteelMat, car, wheelX, -1.78, -0.9);
    wheelBack.rotation.x = Math.PI / 2;
  }
  const cabinGlow = new THREE.PointLight(0xa8e3c8, 1.1, 5.5, 2);
  cabinGlow.position.set(0, 0.5, 0);
  car.add(cabinGlow);
  return car;
}

const fluorescentFixtures = [];
function createFluorescent(x, y, z, length, flickerOffset) {
  const fixture = new THREE.Group();
  fixture.position.set(x, y, z);
  scene.add(fixture);
  const housing = box(fixture, length + 0.32, 0.12, 0.38, darkSteelMat, 0, 0, 0);
  housing.castShadow = false;
  const tubeMat = new THREE.MeshStandardMaterial({
    color: 0xe6f4e5,
    emissive: 0xc9f4d4,
    emissiveIntensity: 1.7,
    roughness: 0.2
  });
  const tube = box(fixture, length, 0.075, 0.115, tubeMat, 0, -0.09, 0.02, false, false);
  const light = new THREE.PointLight(0xcbeedb, 2.1, 11, 1.45);
  light.position.set(0, -0.45, 0.1);
  fixture.add(light);
  fluorescentFixtures.push({ tube, light, offset: flickerOffset });
  return fixture;
}

function posterTexture(label, stripe) {
  return canvasTexture(360, 540, (ctx, w, h) => {
    ctx.fillStyle = '#ddd5bd';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = stripe;
    ctx.fillRect(0, 0, w, 126);
    ctx.fillStyle = '#1e2526';
    ctx.font = 'bold 56px Arial';
    ctx.fillText(label, 25, 88);
    ctx.font = 'bold 34px Arial';
    ctx.fillText('CITY MOVES', 25, 198);
    ctx.fillStyle = '#4d5653';
    for (let i = 0; i < 8; i++) {
      ctx.fillRect(25, 230 + i * 31, 250 - i * 18, 12);
    }
    ctx.fillStyle = '#b1342f';
    ctx.beginPath();
    ctx.arc(262, 392, 47, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f0ddbd';
    ctx.font = 'bold 31px Arial';
    ctx.fillText('24 HRS', 221, 401);
  });
}

    roughness: 0.55
  });

}

}

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  for (const fixture of fluorescentFixtures) {
    const pulse = 0.82 + Math.sin(time * 1.8 + fixture.offset) * 0.08;
    const glitch = Math.sin(time * 13.7 + fixture.offset * 4.1) > 0.965 ? 0.18 : 1;
    fixture.light.intensity = 2.1 * pulse * glitch;
    fixture.tube.material.emissiveIntensity = 1.7 * pulse * glitch;
  }

  train.position.x = Math.sin(time * 0.22) * 0.24;
  train.rotation.z = Math.sin(time * 0.62) * 0.0017;
  arrivalLight.intensity = 1.8 + Math.sin(time * 4.4) * 0.35;

  for (const paper of papers) {
    const drift = Math.sin(time * paper.speed + paper.phase);
    paper.mesh.position.x = paper.originX + drift * 0.24;
    paper.mesh.position.z = paper.originZ + Math.cos(time * paper.speed * 0.72 + paper.phase) * 0.16;
    paper.mesh.position.y = 0.055 + Math.max(0, Math.sin(time * paper.speed * 1.6 + paper.phase)) * 0.12;
    paper.mesh.rotation.x = -Math.PI / 2 + Math.sin(time * paper.speed * 2 + paper.phase) * 0.31;
    paper.mesh.rotation.z += 0.002 + paper.speed * 0.002;
  }

  for (const particle of ambientMist) {
    particle.mesh.position.x += Math.sin(time * particle.speed + particle.phase) * 0.0012;
    particle.mesh.position.y += Math.cos(time * particle.speed * 0.7 + particle.phase) * 0.001;
    particle.mesh.material.opacity = 0.035 + Math.sin(time * particle.speed + particle.phase) * 0.012;
  }

  minuteHand.rotation.z = -0.8 - time * 0.035;
  hourHand.rotation.z = 0.65 - time * 0.003;

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

animate();
