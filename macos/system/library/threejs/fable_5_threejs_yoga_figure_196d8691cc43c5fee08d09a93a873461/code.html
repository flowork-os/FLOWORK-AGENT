<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seated Yoga Figure</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e9e4db}</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e4db);
scene.fog = new THREE.Fog(0xe9e4db, 7, 13);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 50);
camera.position.set(2.4, 1.5, 3.0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.7, 0.1);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 1.6;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.49;

// Lights
scene.add(new THREE.HemisphereLight(0xfff6ea, 0x9a8f80, 0.85));
const key = new THREE.DirectionalLight(0xfff2e2, 1.7);
key.position.set(3, 5, 2.5);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.radius = 7;
key.shadow.blurSamples = 14;
key.shadow.bias = -0.0004;
const sc = key.shadow.camera;
sc.left = sc.bottom = -2.5; sc.right = sc.top = 2.5; sc.near = 0.5; sc.far = 15;
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.45);
fill.position.set(-4, 2, -2);
scene.add(fill);

// Ground
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(6, 64),
  new THREE.MeshStandardMaterial({ color: 0xded7cb, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Materials
const mat = (c, r) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: 0 });
const skin  = mat(0xc98e6f, 0.55);
const cloth = mat(0x6f8f7f, 0.85); // fitted top, soft sage
const pant  = mat(0x3f4a58, 0.9);  // slate leggings
const hairM = mat(0x3a2a22, 0.65);

// Figure
const fig = new THREE.Group();
scene.add(fig);

const V = (x, y, z) => new THREE.Vector3(x, y, z);
function blob(r, m, x, y, z, sx = 1, sy = 1, sz = 1) {
  const o = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 24), m);
  o.position.set(x, y, z); o.scale.set(sx, sy, sz);
  o.castShadow = o.receiveShadow = true;
  fig.add(o); return o;
}
function limb(a, b, r, m) {
  const d = new THREE.Vector3().subVectors(b, a);
  const o = new THREE.Mesh(new THREE.CapsuleGeometry(r, d.length(), 8, 24), m);
  o.position.copy(a).add(b).multiplyScalar(0.5);
  o.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize());
  o.castShadow = o.receiveShadow = true;
  fig.add(o); return o;
}

// Pelvis (leggings)
blob(0.30, pant, 0, 0.26, 0.02, 1, 0.72, 0.85);

// Torso — fitted top, upright back (lathe profile, elliptical section)
const prof = [[0.001,0],[0.26,0.02],[0.295,0.10],[0.275,0.24],[0.23,0.40],[0.24,0.54],[0.205,0.63],[0.07,0.695],[0.001,0.70]]
  .map(p => new THREE.Vector2(p[0], p[1]));
const torso = new THREE.Mesh(new THREE.LatheGeometry(prof, 48), cloth);
torso.position.y = 0.26; torso.scale.z = 0.72;
torso.castShadow = torso.receiveShadow = true;
fig.add(torso);

// Neck & head
limb(V(0, 0.89, 0.01), V(0, 1.06, 0.015), 0.055, skin);
blob(0.15, skin, 0, 1.20, 0.02, 0.92, 1, 0.95);
blob(0.157, hairM, 0, 1.215, -0.018);           // hair
blob(0.062, hairM, 0, 1.345, -0.09);            // bun
blob(0.02, skin, 0, 1.185, 0.155, 0.8, 1, 1);   // nose
blob(0.026, hairM, -0.055, 1.225, 0.145, 1, 0.18, 0.4); // closed eyes
blob(0.026, hairM, 0.055, 1.225, 0.145, 1, 0.18, 0.4);

// Mirrored limbs
for (const s of [-1, 1]) {
  // shoulder cap
  blob(0.095, cloth, 0.20 * s, 0.895, 0.01);
  // legs — crossed shins, one in front of the other
  limb(V(0.14 * s, 0.26, 0.04), V(0.42 * s, 0.16, 0.30), 0.115, pant); // thigh
  const yA = 0.10 + 0.028 * s, zA = 0.46 - 0.04 * s;
  limb(V(0.40 * s, 0.14, 0.32), V(-0.11 * s, yA, zA), 0.075, pant);    // shin
  const foot = blob(0.068, skin, -0.16 * s, yA + 0.005, zA + 0.05, 1.4, 0.62, 1);
  foot.rotation.y = -0.5 * s;
  // arms — hands resting on knees
  const sh = V(0.20 * s, 0.90, 0.02), el = V(0.33 * s, 0.60, 0.10), wr = V(0.40 * s, 0.31, 0.28);
  limb(sh, el, 0.07, cloth);   // sleeve to elbow
  limb(el, wr, 0.052, skin);   // forearm
  const hand = blob(0.055, skin, 0.42 * s, 0.285, 0.335, 1, 0.55, 1.35);
  hand.rotation.x = -0.25;
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
