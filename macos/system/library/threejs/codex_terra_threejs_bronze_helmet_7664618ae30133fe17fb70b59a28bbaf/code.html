<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bronze Age Helmet</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #11100d; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171611);
scene.fog = new THREE.Fog(0x171611, 9, 22);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.2, 3.2, 7.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.35, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 4.4;
controls.maxDistance = 13;
controls.maxPolarAngle = Math.PI * 0.49;

const helmet = new THREE.Group();
helmet.rotation.y = -0.25;
scene.add(helmet);

const bronzeMaterial = new THREE.MeshStandardMaterial({
  color: 0x6f542d,
  roughness: 0.41,
  metalness: 0.88,
  envMapIntensity: 1.1
});

const darkBronzeMaterial = new THREE.MeshStandardMaterial({
  color: 0x3c2e1d,
  roughness: 0.5,
  metalness: 0.77
});

const patinaMaterial = new THREE.MeshStandardMaterial({
  color: 0x315b4c,
  roughness: 0.74,
  metalness: 0.3,
  transparent: true,
  opacity: 0.72
});

const leatherMaterial = new THREE.MeshStandardMaterial({
  color: 0x21170e,
  roughness: 0.86,
  metalness: 0.04
});

function createDomeGeometry() {
  const geometry = new THREE.SphereGeometry(2.02, 64, 36, 0, Math.PI * 2, 0.06, Math.PI * 0.60);
  const position = geometry.attributes.position;
  const vertex = new THREE.Vector3();

  for (let i = 0; i < position.count; i++) {
    vertex.fromBufferAttribute(position, i);
    const yNorm = (vertex.y + 0.2) / 2.15;
    const angle = Math.atan2(vertex.z, vertex.x);
    const rippling = Math.sin(angle * 5.0 + vertex.y * 2.4) * 0.027;
    const hammering = Math.sin(vertex.x * 4.2 + vertex.z * 3.1) * Math.sin(vertex.y * 5.6) * 0.019;
    const domeScale = 1 + rippling + hammering;
    vertex.x *= domeScale * (0.98 + yNorm * 0.02);
    vertex.z *= domeScale;
    vertex.y *= 0.96;
    position.setXYZ(i, vertex.x, vertex.y, vertex.z);
  }

  geometry.computeVertexNormals();
  return geometry;
}

const dome = new THREE.Mesh(createDomeGeometry(), bronzeMaterial);
dome.position.y = 0.05;
dome.scale.set(1, 1, 0.9);
dome.castShadow = true;
dome.receiveShadow = true;
helmet.add(dome);

const lowerBandGeometry = new THREE.TorusGeometry(1.79, 0.095, 12, 64, Math.PI * 1.72);
const lowerBand = new THREE.Mesh(lowerBandGeometry, darkBronzeMaterial);
lowerBand.rotation.x = Math.PI * 0.5;
lowerBand.rotation.z = -0.64;
lowerBand.scale.set(1, 1, 0.84);
lowerBand.position.set(0.02, -0.2, 0.08);
lowerBand.castShadow = true;
helmet.add(lowerBand);

const crestShape = new THREE.Shape();
crestShape.moveTo(-0.13, -1.67);
crestShape.lineTo(-0.23, -0.55);
crestShape.quadraticCurveTo(-0.20, 0.95, -0.10, 1.95);
crestShape.quadraticCurveTo(0, 2.15, 0.1, 1.95);
crestShape.quadraticCurveTo(0.2, 0.95, 0.23, -0.55);
crestShape.lineTo(0.13, -1.67);
crestShape.closePath();

const crestGeometry = new THREE.ExtrudeGeometry(crestShape, {
  depth: 0.22,
  bevelEnabled: true,
  bevelSegments: 3,
  bevelSize: 0.035,
  bevelThickness: 0.035,
  curveSegments: 16
});
crestGeometry.center();
const crest = new THREE.Mesh(crestGeometry, bronzeMaterial);
crest.rotation.y = Math.PI * 0.5;
crest.position.set(0, 0.43, 0.02);
crest.castShadow = true;
helmet.add(crest);

const crestRivetGeometry = new THREE.SphereGeometry(0.115, 18, 12);
for (const y of [-1.02, -0.45, 0.13, 0.72, 1.26]) {
  const rivet = new THREE.Mesh(crestRivetGeometry, darkBronzeMaterial);
  rivet.position.set(0, y + 0.42, 0.175);
  rivet.scale.set(1, 1, 0.45);
  rivet.castShadow = true;
  helmet.add(rivet);
}

function createGuardShape(side) {
  const shape = new THREE.Shape();
  shape.moveTo(side * 1.55, 0.15);
  shape.quadraticCurveTo(side * 2.08, -0.25, side * 1.82, -1.58);
  shape.quadraticCurveTo(side * 1.58, -1.98, side * 1.18, -1.66);
  shape.lineTo(side * 1.12, -0.55);
  shape.quadraticCurveTo(side * 1.15, -0.08, side * 1.55, 0.15);
  return shape;
}

function createCheekGuard(side) {
  const geometry = new THREE.ExtrudeGeometry(createGuardShape(side), {
    depth: 0.16,
    bevelEnabled: true,
    bevelSegments: 2,
    bevelSize: 0.045,
    bevelThickness: 0.04,
    curveSegments: 14
  });
  const guard = new THREE.Mesh(geometry, bronzeMaterial);
  guard.position.set(0, -0.12, -0.45);
  guard.rotation.y = side * 0.12;
  guard.castShadow = true;
  guard.receiveShadow = true;
  helmet.add(guard);

  const edge = new THREE.Mesh(
    new THREE.TorusGeometry(0.11, 0.04, 8, 16),
    darkBronzeMaterial
  );
  edge.scale.set(1.35, 1, 1);
  edge.rotation.x = Math.PI * 0.5;
  edge.position.set(side * 1.52, -1.55, -0.33);
  helmet.add(edge);

  const hinge = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.32, 16), darkBronzeMaterial);
  hinge.rotation.z = Math.PI * 0.5;
  hinge.position.set(side * 1.48, -0.18, -0.43);
  hinge.castShadow = true;
  helmet.add(hinge);
}

createCheekGuard(-1);
createCheekGuard(1);

const neckGuardShape = new THREE.Shape();
neckGuardShape.moveTo(-1.55, -0.15);
neckGuardShape.quadraticCurveTo(-1.8, -0.7, -1.72, -1.45);
neckGuardShape.quadraticCurveTo(0, -1.95, 1.72, -1.45);
neckGuardShape.quadraticCurveTo(1.8, -0.7, 1.55, -0.15);
neckGuardShape.quadraticCurveTo(0, -0.52, -1.55, -0.15);

const neckGuardGeometry = new THREE.ExtrudeGeometry(neckGuardShape, {
  depth: 0.18,
  bevelEnabled: true,
  bevelSegments: 3,
  bevelSize: 0.05,
  bevelThickness: 0.04,
  curveSegments: 20
});
const neckGuard = new THREE.Mesh(neckGuardGeometry, bronzeMaterial);
neckGuard.position.set(0, -0.27, 1.38);
neckGuard.rotation.x = -0.22;
neckGuard.castShadow = true;
neckGuard.receiveShadow = true;
helmet.add(neckGuard);

const neckEdge = new THREE.Mesh(
  new THREE.TorusGeometry(1.47, 0.065, 10, 48, Math.PI),
  darkBronzeMaterial
);
neckEdge.rotation.x = Math.PI * 0.5;
neckEdge.rotation.z = Math.PI;
neckEdge.scale.set(1, 1, 0.64);
neckEdge.position.set(0, -1.62, 1.28);
helmet.add(neckEdge);

const noseGuard = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.11, 0.8, 8, 16),
  bronzeMaterial
);
noseGuard.scale.set(0.82, 1, 0.55);
noseGuard.position.set(0, -0.72, -1.76);
noseGuard.rotation.x = 0.16;
noseGuard.castShadow = true;
helmet.add(noseGuard);

const browRivetGeometry = new THREE.SphereGeometry(0.105, 16, 12);
for (let i = -3; i <= 3; i++) {
  const x = i * 0.43;
  const z = -Math.sqrt(Math.max(0.1, 3.0 - x * x)) * 0.76;
  const rivet = new THREE.Mesh(browRivetGeometry, darkBronzeMaterial);
  rivet.position.set(x, -0.03 + Math.abs(i) * 0.035, z - 0.04);
  rivet.scale.set(1, 0.72, 0.42);
  helmet.add(rivet);
}

const dentMaterial = new THREE.MeshStandardMaterial({
  color: 0x243f38,
  roughness: 0.82,
  metalness: 0.28,
  transparent: true,
  opacity: 0.52,
  side: THREE.DoubleSide
});

const dents = [
  { p: [0.83, 0.95, -1.43], r: [0.18, 0.09, 0.035], rot: [0.35, -0.45, 0.4] },
  { p: [-1.16, 0.18, -1.25], r: [0.21, 0.075, 0.03], rot: [0.1, 0.3, -0.65] },
  { p: [1.46, -0.35, 0.38], r: [0.16, 0.06, 0.028], rot: [0.2, 0.2, 0.7] }
];

for (const dentInfo of dents) {
  const dent = new THREE.Mesh(new THREE.CircleGeometry(1, 24), dentMaterial);
  dent.position.set(...dentInfo.p);
  dent.scale.set(...dentInfo.r);
  dent.rotation.set(...dentInfo.rot);
  helmet.add(dent);
}

const patinaPositions = [
  [-0.82, 1.05, -1.47, 0.24],
  [1.18, 0.42, -1.41, 0.19],
  [-1.42, -0.55, -0.72, 0.16],
  [1.35, -0.5, 0.9, 0.15],
  [0.52, 1.68, 0.65, 0.14],
  [-0.26, -1.13, 1.53, 0.24],
  [0.78, -0.74, -1.56, 0.13]
];

for (const [x, y, z, size] of patinaPositions) {
  const patch = new THREE.Mesh(new THREE.CircleGeometry(1, 18), patinaMaterial);
  patch.position.set(x, y, z);
  patch.scale.set(size * 1.55, size, 1);
  patch.lookAt(0, 0.15, 0);
  patch.rotateZ((x + y) * 2.1);
  helmet.add(patch);
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(11, 96),
  new THREE.MeshStandardMaterial({ color: 0x252218, roughness: 0.88, metalness: 0.03 })
);
floor.rotation.x = -Math.PI * 0.5;
floor.position.y = -2.13;
floor.receiveShadow = true;
scene.add(floor);

const pedestal = new THREE.Mesh(
  new THREE.CylinderGeometry(1.75, 1.95, 0.34, 64),
  new THREE.MeshStandardMaterial({ color: 0x211d16, roughness: 0.58, metalness: 0.36 })
);
pedestal.position.y = -1.98;
pedestal.castShadow = true;
pedestal.receiveShadow = true;
scene.add(pedestal);

const hemiLight = new THREE.HemisphereLight(0x9eb5b0, 0x3b2417, 1.65);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(0xffdeb2, 4.2);
keyLight.position.set(4.5, 6.5, 3.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -6;
keyLight.shadow.bias = -0.00025;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x75a6a5, 2.2);
rimLight.position.set(-5, 3, 2);
scene.add(rimLight);

const warmFill = new THREE.PointLight(0xe28745, 22, 10, 2);
warmFill.position.set(0, 1.4, -4.3);
scene.add(warmFill);

const coolFill = new THREE.PointLight(0x4c8078, 12, 8, 2);
coolFill.position.set(-3.6, 0.8, 2.7);
scene.add(coolFill);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
