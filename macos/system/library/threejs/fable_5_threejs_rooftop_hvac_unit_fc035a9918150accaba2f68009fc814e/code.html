<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rooftop HVAC Package Unit</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd4d8; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- renderer / scene / camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfd4d8);
scene.fog = new THREE.Fog(0xcfd4d8, 14, 30);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.6, 2.8, 4.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.85, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 2.5;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.49;

// ---------- lighting ----------
scene.add(new THREE.HemisphereLight(0xdfe8f0, 0x707a80, 0.75));
const sun = new THREE.DirectionalLight(0xfff3e0, 2.2);
sun.position.set(5, 8, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -4; sun.shadow.camera.right = 4;
sun.shadow.camera.top = 4; sun.shadow.camera.bottom = -4;
sun.shadow.camera.near = 2; sun.shadow.camera.far = 20;
sun.shadow.bias = -0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd0e0, 0.5);
fill.position.set(-6, 3, -5);
scene.add(fill);

// ---------- ground ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(16, 64),
  new THREE.MeshStandardMaterial({ color: 0xb7bcbf, roughness: 0.95, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ---------- materials ----------
const matBody   = new THREE.MeshStandardMaterial({ color: 0x9aa0a4, roughness: 0.45, metalness: 0.65 });
const matPanel  = new THREE.MeshStandardMaterial({ color: 0x8c9296, roughness: 0.5,  metalness: 0.6 });
const matDark   = new THREE.MeshStandardMaterial({ color: 0x4c5155, roughness: 0.6,  metalness: 0.5 });
const matLouver = new THREE.MeshStandardMaterial({ color: 0x6f7579, roughness: 0.55, metalness: 0.55 });
const matCurb   = new THREE.MeshStandardMaterial({ color: 0x5b6064, roughness: 0.8,  metalness: 0.3 });
const matFan    = new THREE.MeshStandardMaterial({ color: 0x2e3235, roughness: 0.5,  metalness: 0.6 });
const matGrille = new THREE.MeshStandardMaterial({ color: 0x3a3f43, roughness: 0.45, metalness: 0.7 });
const matHandle = new THREE.MeshStandardMaterial({ color: 0x2b2e31, roughness: 0.4,  metalness: 0.7 });
const matBadge  = new THREE.MeshStandardMaterial({ color: 0xd8dbdd, roughness: 0.35, metalness: 0.4 });

// ---------- unit group ----------
const unit = new THREE.Group();
scene.add(unit);

function box(w, h, d, mat, x, y, z, parent = unit) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}

// dimensions (meters)
const W = 2.6, D = 1.5, H = 1.15;      // cabinet
const curbH = 0.22, curbIn = 0.10;     // raised base curb
const yBase = curbH;                   // cabinet bottom sits on curb

// base curb
box(W - curbIn * 2, curbH, D - curbIn * 2, matCurb, 0, curbH / 2, 0);
box(W - curbIn * 2 + 0.06, 0.03, D - curbIn * 2 + 0.06, matDark, 0, curbH - 0.015, 0); // curb cap flashing

// main cabinet
box(W, H, D, matBody, 0, yBase + H / 2, 0);

// top lid with slight lip
box(W + 0.05, 0.06, D + 0.05, matPanel, 0, yBase + H + 0.03, 0);

// corner posts (trim)
for (const sx of [-1, 1]) for (const sz of [-1, 1])
  box(0.07, H, 0.07, matDark, sx * (W / 2 - 0.02), yBase + H / 2, sz * (D / 2 - 0.02));

// ---------- removable access panels (front & back, right half) ----------
function accessPanel(z, sign) {
  const g = new THREE.Group();
  const pw = 0.78, ph = 0.86;
  const p = box(pw, ph, 0.03, matPanel, 0, 0, 0, g);
  // raised border frame
  box(pw + 0.05, 0.04, 0.045, matDark, 0,  ph / 2 - 0.01, 0, g);
  box(pw + 0.05, 0.04, 0.045, matDark, 0, -ph / 2 + 0.01, 0, g);
  box(0.04, ph, 0.045, matDark, -pw / 2 + 0.01, 0, 0, g);
  box(0.04, ph, 0.045, matDark,  pw / 2 - 0.01, 0, 0, g);
  // handle
  const h = box(0.05, 0.16, 0.05, matHandle, pw / 2 - 0.12, 0, sign * 0.045, g);
  // screws
  const screwGeo = new THREE.CylinderGeometry(0.014, 0.014, 0.02, 8);
  for (const [sx, sy] of [[-1,-1],[-1,1],[1,-1],[1,1]]) {
    const s = new THREE.Mesh(screwGeo, matHandle);
    s.rotation.x = Math.PI / 2;
    s.position.set(sx * (pw / 2 - 0.07), sy * (ph / 2 - 0.07), sign * 0.02);
    s.castShadow = true;
    g.add(s);
  }
  g.position.set(0.62, yBase + H / 2, z + sign * 0.015);
  unit.add(g);
}
accessPanel( D / 2,  1);
accessPanel(-D / 2, -1);

// nameplate badge on front panel
box(0.3, 0.12, 0.012, matBadge, 0.62, yBase + H - 0.22, D / 2 + 0.032);

// ---------- louvered grille sections (condenser end + left halves) ----------
function louverSection(x, y, z, w, h, ry) {
  const g = new THREE.Group();
  // frame backing
  box(w, h, 0.02, matDark, 0, 0, -0.015, g);
  const n = Math.max(4, Math.floor(h / 0.075));
  const slat = new THREE.BoxGeometry(w - 0.06, 0.018, 0.055);
  for (let i = 0; i < n; i++) {
    const s = new THREE.Mesh(slat, matLouver);
    s.position.y = -h / 2 + 0.05 + i * ((h - 0.1) / (n - 1));
    s.rotation.x = -0.62;
    s.castShadow = s.receiveShadow = true;
    g.add(s);
  }
  // frame edges
  box(w, 0.045, 0.05, matDark, 0,  h / 2 - 0.012, 0.01, g);
  box(w, 0.045, 0.05, matDark, 0, -h / 2 + 0.012, 0.01, g);
  box(0.045, h, 0.05, matDark, -w / 2 + 0.012, 0, 0.01, g);
  box(0.045, h, 0.05, matDark,  w / 2 - 0.012, 0, 0.01, g);
  g.position.set(x, y, z);
  g.rotation.y = ry;
  unit.add(g);
}
// condenser end (left side, full face)
louverSection(-W / 2 - 0.012, yBase + H / 2, 0, D - 0.25, H - 0.24, -Math.PI / 2);
// left halves of front & back faces
louverSection(-0.62, yBase + H / 2,  D / 2 + 0.012, 0.95, H - 0.28, 0);
louverSection(-0.62, yBase + H / 2, -D / 2 - 0.012, 0.95, H - 0.28, Math.PI);

// ---------- top fan + grille ----------
const fanCX = -0.62, fanR = 0.42, topY = yBase + H + 0.06;
// fan shroud ring
const shroud = new THREE.Mesh(new THREE.CylinderGeometry(fanR + 0.06, fanR + 0.09, 0.12, 40), matPanel);
shroud.position.set(fanCX, topY + 0.06, 0);
shroud.castShadow = shroud.receiveShadow = true;
unit.add(shroud);
// dark recess
const recess = new THREE.Mesh(new THREE.CylinderGeometry(fanR, fanR, 0.02, 40), new THREE.MeshStandardMaterial({ color: 0x17191b, roughness: 0.9 }));
recess.position.set(fanCX, topY + 0.02, 0);
unit.add(recess);

// spinning fan blades
const fan = new THREE.Group();
fan.position.set(fanCX, topY + 0.07, 0);
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.09, 20), matFan);
hub.castShadow = true;
fan.add(hub);
const bladeGeo = new THREE.BoxGeometry(fanR - 0.1, 0.012, 0.14);
bladeGeo.translate((fanR - 0.1) / 2 + 0.07, 0, 0);
for (let i = 0; i < 5; i++) {
  const b = new THREE.Mesh(bladeGeo, matFan);
  b.rotation.y = (i / 5) * Math.PI * 2;
  b.rotation.x = 0.35;
  b.castShadow = true;
  fan.add(b);
}
unit.add(fan);

// wire grille: concentric rings + radial spokes
const grille = new THREE.Group();
grille.position.set(fanCX, topY + 0.135, 0);
for (let r = 0.09; r <= fanR + 0.02; r += 0.075) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.007, 6, 48), matGrille);
  ring.rotation.x = Math.PI / 2;
  ring.castShadow = true;
  grille.add(ring);
}
const spokeGeo = new THREE.CylinderGeometry(0.007, 0.007, fanR + 0.04, 6);
for (let i = 0; i < 8; i++) {
  const sp = new THREE.Mesh(spokeGeo, matGrille);
  sp.rotation.z = Math.PI / 2;
  sp.rotation.y = (i / 8) * Math.PI;
  sp.position.y = 0.004;
  sp.castShadow = true;
  grille.add(sp);
}
unit.add(grille);

// ---------- rooftop details ----------
// electrical disconnect box
box(0.22, 0.3, 0.09, matDark, 1.02, yBase + H - 0.28, D / 2 + 0.06);
// conduit
const conduit = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, yBase + H - 0.45, 10), matGrille);
conduit.position.set(1.02, (yBase + H - 0.45) / 2, D / 2 + 0.06);
conduit.castShadow = true;
unit.add(conduit);
// refrigerant line stubs on right end
for (const [r, y] of [[0.045, 0.55], [0.028, 0.4]]) {
  const pipe = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.22, 12), matGrille);
  pipe.rotation.z = Math.PI / 2;
  pipe.position.set(W / 2 + 0.1, yBase + y, -0.35);
  pipe.castShadow = true;
  unit.add(pipe);
}
// duct collars on top (supply/return)
box(0.4, 0.14, 0.4, matDark, 0.55, yBase + H + 0.13, -0.3);
box(0.4, 0.14, 0.4, matDark, 0.55, yBase + H + 0.13, 0.35);

// ---------- soft contact shadow ----------
const shadowTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(128, 128, 20, 128, 128, 128);
  g.addColorStop(0, 'rgba(0,0,0,0.38)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const softShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(4.6, 3.4),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
);
softShadow.rotation.x = -Math.PI / 2;
softShadow.position.y = 0.005;
scene.add(softShadow);

// ---------- animate ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  fan.rotation.y += clock.getDelta() * 6;
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
