<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metal Workshop Stool</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e7e5e1}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe7e5e1);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 50);
camera.position.set(1.05, 0.75, 1.05);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.34, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 0.6;
controls.maxDistance = 4;
controls.maxPolarAngle = Math.PI * 0.52;

const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(2, 3.5, 1.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -0.7;
key.shadow.camera.right = key.shadow.camera.top = 0.7;
key.shadow.camera.near = 1; key.shadow.camera.far = 8;
key.shadow.bias = -0.0004;
key.shadow.radius = 6;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xf4f2ee, 0x8a857c, 0.5));

// procedural scuff/wear texture (roughness map)
const cv = document.createElement('canvas'); cv.width = cv.height = 256;
const ctx = cv.getContext('2d');
ctx.fillStyle = '#9a9a9a'; ctx.fillRect(0, 0, 256, 256);
for (let i = 0; i < 900; i++) {
  const v = 110 + (Math.random() * 120) | 0;
  ctx.strokeStyle = `rgba(${v},${v},${v},${0.15 + Math.random() * 0.3})`;
  ctx.lineWidth = 0.5 + Math.random() * 1.5;
  const x = Math.random() * 256, y = Math.random() * 256, a = Math.random() * Math.PI;
  const l = 4 + Math.random() * 26;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); ctx.stroke();
}
const scuff = new THREE.CanvasTexture(cv);
scuff.wrapS = scuff.wrapT = THREE.RepeatWrapping;

const seatMat = new THREE.MeshStandardMaterial({ color: 0xb4b8bc, metalness: 0.85, roughness: 0.45, roughnessMap: scuff });
const tubeMat = new THREE.MeshStandardMaterial({ color: 0xc6cacd, metalness: 0.9, roughness: 0.32, roughnessMap: scuff });
const rubberMat = new THREE.MeshStandardMaterial({ color: 0x1b1b1b, metalness: 0.0, roughness: 0.95, roughnessMap: scuff });

const stool = new THREE.Group();
scene.add(stool);
const add = (geo, mat, x = 0, y = 0, z = 0) => {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  stool.add(m); return m;
};

// dimensions (meters)
const seatY = 0.65, seatR = 0.175, legTopR = 0.10, legBotR = 0.235, footH = 0.028, braceY = 0.21;

// seat: flat disc with rolled edge + mounting plate
add(new THREE.CylinderGeometry(seatR, seatR, 0.02, 64), seatMat, 0, seatY, 0);
const rim = add(new THREE.TorusGeometry(seatR - 0.004, 0.008, 12, 64), seatMat, 0, seatY - 0.008, 0);
rim.rotation.x = Math.PI / 2;
add(new THREE.CylinderGeometry(0.125, 0.115, 0.016, 32), seatMat, 0, seatY - 0.018, 0);

// four splayed tubular legs + rubber feet + weld beads at brace
const up = new THREE.Vector3(0, 1, 0), legRad = 0.012;
const topY = seatY - 0.024, botY = footH;
for (let i = 0; i < 4; i++) {
  const a = i * Math.PI / 2 + Math.PI / 4;
  const dx = Math.cos(a), dz = Math.sin(a);
  const top = new THREE.Vector3(legTopR * dx, topY, legTopR * dz);
  const bot = new THREE.Vector3(legBotR * dx, botY, legBotR * dz);
  const dir = bot.clone().sub(top);
  const leg = add(new THREE.CylinderGeometry(legRad, legRad, dir.length(), 20), tubeMat);
  leg.position.copy(top).addScaledVector(dir, 0.5);
  leg.quaternion.setFromUnitVectors(up, dir.clone().normalize());
  // scuffed rubber foot
  const fr = legBotR + 0.004;
  add(new THREE.CylinderGeometry(0.017, 0.02, footH, 20), rubberMat, fr * dx, footH / 2, fr * dz);
  // weld bead where ring brace meets the leg
  const t = (topY - braceY) / (topY - botY);
  const wr = legTopR + (legBotR - legTopR) * t;
  add(new THREE.SphereGeometry(0.0135, 14, 12), tubeMat, wr * dx, braceY, wr * dz);
}

// welded ring brace at leg radius for its height
const braceR = legTopR + (legBotR - legTopR) * ((topY - braceY) / (topY - botY));
const ring = add(new THREE.TorusGeometry(braceR, 0.0085, 14, 72), tubeMat, 0, braceY, 0);
ring.rotation.x = Math.PI / 2;

// ground: subtle matte floor catching a soft shadow
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(6, 64),
  new THREE.MeshStandardMaterial({ color: 0xdcdad5, metalness: 0, roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const shadowCatch = new THREE.Mesh(
  new THREE.CircleGeometry(1.2, 48),
  new THREE.ShadowMaterial({ opacity: 0.28 })
);
shadowCatch.rotation.x = -Math.PI / 2;
shadowCatch.position.y = 0.001;
shadowCatch.receiveShadow = true;
scene.add(shadowCatch);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
