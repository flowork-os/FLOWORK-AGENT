<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Earth</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 48%, #071925 0%, #02070c 42%, #000205 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x01050a);
  scene.fog = new THREE.FogExp2(0x01050a, 0.055);

  const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(4.2, 3.15, 6.6);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.25;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.45, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.045;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.55;
  controls.enablePan = false;
  controls.minDistance = 4.4;
  controls.maxDistance = 11;
  controls.minPolarAngle = 0.45;
  controls.maxPolarAngle = 1.53;

  const cyan = 0x39eaff;
  const paleCyan = 0xa8f8ff;
  const deepCyan = 0x008aa8;
  const darkMetal = 0x08121b;
  const globeCenterY = 2.12;
  const globeRadius = 1.18;

  const holoAssembly = new THREE.Group();
  scene.add(holoAssembly);

  const ambient = new THREE.HemisphereLight(0x42dfff, 0x010207, 0.45);
  scene.add(ambient);

  const keyLight = new THREE.DirectionalLight(0xa8f7ff, 1.8);
  keyLight.position.set(3.5, 6, 4);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(1024, 1024);
  keyLight.shadow.camera.near = 1;
  keyLight.shadow.camera.far = 14;
  keyLight.shadow.camera.left = -4;
  keyLight.shadow.camera.right = 4;
  keyLight.shadow.camera.top = 5;
  keyLight.shadow.camera.bottom = -2;
  scene.add(keyLight);

  const rimLight = new THREE.PointLight(0x00ccff, 16, 8, 2);
  rimLight.position.set(-2.2, 2.6, -2.4);
  scene.add(rimLight);

  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(4.8, 96),
    new THREE.MeshStandardMaterial({
      color: 0x02070c,
      roughness: 0.88,
      metalness: 0.32,
      transparent: true,
      opacity: 0.92
    })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.025;
  floor.receiveShadow = true;
  scene.add(floor);

  const floorRingMaterial = new THREE.MeshBasicMaterial({
    color: deepCyan,
    transparent: true,
    opacity: 0.14,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  for (const radius of [1.22, 1.85, 2.65]) {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(radius - 0.006, radius + 0.006, 128),
      floorRingMaterial
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.002;
    scene.add(ring);
  }

  const base = new THREE.Group();
  holoAssembly.add(base);

  const baseLower = new THREE.Mesh(
    new THREE.CylinderGeometry(0.82, 0.94, 0.22, 64, 1),
    new THREE.MeshStandardMaterial({
      color: 0x071019,
      roughness: 0.3,
      metalness: 0.92
    })
  );
  baseLower.position.y = 0.11;
  baseLower.castShadow = true;
  baseLower.receiveShadow = true;
  base.add(baseLower);

  const baseUpper = new THREE.Mesh(
    new THREE.CylinderGeometry(0.68, 0.8, 0.19, 64, 1),
    new THREE.MeshStandardMaterial({
      color: darkMetal,
      roughness: 0.23,
      metalness: 0.96
    })
  );
  baseUpper.position.y = 0.315;
  baseUpper.castShadow = true;
  base.add(baseUpper);

  const topPlate = new THREE.Mesh(
    new THREE.CylinderGeometry(0.59, 0.63, 0.055, 64),
    new THREE.MeshStandardMaterial({
      color: 0x0d2732,
      emissive: 0x005c72,
      emissiveIntensity: 0.65,
      roughness: 0.2,
      metalness: 0.82
    })
  );
  topPlate.position.y = 0.435;
  topPlate.castShadow = true;
  base.add(topPlate);

  const emissiveRingMaterial = new THREE.MeshBasicMaterial({
    color: cyan,
    transparent: true,
    opacity: 0.84,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    toneMapped: false
  });

  const glowRingMaterial = new THREE.MeshBasicMaterial({
    color: cyan,
    transparent: true,
    opacity: 0.16,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    toneMapped: false
  });

  const emitterRing = new THREE.Mesh(
    new THREE.TorusGeometry(0.51, 0.016, 10, 96),
    emissiveRingMaterial
  );
  emitterRing.rotation.x = Math.PI / 2;
  emitterRing.position.y = 0.477;
  base.add(emitterRing);

  const emitterGlow = new THREE.Mesh(
    new THREE.TorusGeometry(0.51, 0.06, 12, 96),
    glowRingMaterial
  );
  emitterGlow.rotation.x = Math.PI / 2;
  emitterGlow.position.y = 0.476;
  base.add(emitterGlow);

  const innerEmitter = new THREE.Mesh(
    new THREE.CircleGeometry(0.43, 64),
    new THREE.MeshBasicMaterial({
      color: 0x00bcd9,
      transparent: true,
      opacity: 0.2,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide,
      toneMapped: false
    })
  );
  innerEmitter.rotation.x = -Math.PI / 2;
  innerEmitter.position.y = 0.471;
  base.add(innerEmitter);

  for (let i = 0; i < 12; i++) {
    const angle = i * Math.PI * 2 / 12;
    const segment = new THREE.Mesh(
      new THREE.BoxGeometry(0.17, 0.025, 0.018),
      new THREE.MeshBasicMaterial({
        color: i % 3 === 0 ? paleCyan : deepCyan,
        transparent: true,
        opacity: i % 3 === 0 ? 0.82 : 0.38,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        toneMapped: false
      })
    );
    segment.position.set(Math.cos(angle) * 0.72, 0.43, Math.sin(angle) * 0.72);
    segment.rotation.y = -angle;
    base.add(segment);
  }

  const cone = new THREE.Mesh(
    new THREE.CylinderGeometry(1.02, 0.28, 1.76, 64, 1, true),
    new THREE.MeshBasicMaterial({
      color: 0x25dcff,
      transparent: true,
      opacity: 0.035,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide,
      toneMapped: false
    })
  );
  cone.position.y = 1.36;
  holoAssembly.add(cone);

  const coneCore = new THREE.Mesh(
    new THREE.CylinderGeometry(0.57, 0.13, 1.64, 48, 1, true),
    new THREE.MeshBasicMaterial({
      color: 0x93f6ff,
      transparent: true,
      opacity: 0.028,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide,
      toneMapped: false
    })
  );
  coneCore.position.y = 1.31;
  holoAssembly.add(coneCore);

  const globe = new THREE.Group();
  globe.position.y = globeCenterY;
  globe.rotation.z = THREE.MathUtils.degToRad(-23.4);
  holoAssembly.add(globe);

  const sphereShell = new THREE.Mesh(
    new THREE.SphereGeometry(globeRadius * 0.985, 64, 40),
    new THREE.MeshBasicMaterial({
      color: 0x00b8d8,
      transparent: true,
      opacity: 0.032,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide,
      toneMapped: false
    })
  );
  globe.add(sphereShell);

  const innerShell = new THREE.Mesh(
    new THREE.SphereGeometry(globeRadius * 0.9, 48, 32),
    new THREE.MeshBasicMaterial({
      color: 0x006c87,
      transparent: true,
      opacity: 0.018,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.BackSide,
      toneMapped: false
    })
  );
  globe.add(innerShell);

  const gridMaterial = new THREE.LineBasicMaterial({
    color: cyan,
    transparent: true,
    opacity: 0.31,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    toneMapped: false
  });

  const gridGlowMaterial = new THREE.LineBasicMaterial({
    color: cyan,
    transparent: true,
    opacity: 0.07,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    toneMapped: false
  });

  function addLine(points, material, parent = globe, loop = false) {
    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    const line = loop
      ? new THREE.LineLoop(geometry, material)
      : new THREE.Line(geometry, material);
    parent.add(line);
    return line;
  }

  for (let latitude = -75; latitude <= 75; latitude += 15) {
    const lat = THREE.MathUtils.degToRad(latitude);
    const y = Math.sin(lat) * globeRadius;
    const radius = Math.cos(lat) * globeRadius;
    const points = [];
    for (let i = 0; i < 160; i++) {
      const angle = i / 160 * Math.PI * 2;
      points.push(new THREE.Vector3(
        Math.sin(angle) * radius,
        y,
        Math.cos(angle) * radius
      ));
    }
    addLine(points, gridMaterial, globe, true);
  }

  for (let longitude = 0; longitude < 360; longitude += 15) {
    const lon = THREE.MathUtils.degToRad(longitude);
    const points = [];
    for (let i = 0; i <= 100; i++) {
      const lat = THREE.MathUtils.lerp(-Math.PI * 0.472, Math.PI * 0.472, i / 100);
      points.push(new THREE.Vector3(
        Math.cos(lat) * Math.sin(lon) * globeRadius,
        Math.sin(lat) * globeRadius,
        Math.cos(lat) * Math.cos(lon) * globeRadius
      ));
    }
    addLine(points, gridMaterial);
  }

  const equatorPoints = [];
  for (let i = 0; i < 192; i++) {
    const angle = i / 192 * Math.PI * 2;
    equatorPoints.push(new THREE.Vector3(
      Math.sin(angle) * globeRadius * 1.008,
      0,
      Math.cos(angle) * globeRadius * 1.008
    ));
  }
  addLine(equatorPoints, new THREE.LineBasicMaterial({
    color: paleCyan,
    transparent: true,
    opacity: 0.62,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    toneMapped: false
  }), globe, true);

  const continentMaterial = new THREE.LineBasicMaterial({
    color: paleCyan,
    transparent: true,
    opacity: 0.88,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    toneMapped: false
  });

  const continentGlowMaterial = new THREE.LineBasicMaterial({
    color: cyan,
    transparent: true,
    opacity: 0.16,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    toneMapped: false
  });

  function geoPoint(lonDeg, latDeg, radius) {
    const lon = THREE.MathUtils.degToRad(lonDeg);
    const lat = THREE.MathUtils.degToRad(latDeg);
    return new THREE.Vector3(
      Math.cos(lat) * Math.sin(lon) * radius,
      Math.sin(lat) * radius,
      Math.cos(lat) * Math.cos(lon) * radius
    );
  }

  function addContinent(coords, closed = true) {
    const finePoints = [];
    const radius = globeRadius * 1.012;
    const segmentCount = closed ? coords.length : coords.length - 1;

    for (let i = 0; i < segmentCount; i++) {
      const a = coords[i];
      const b = coords[(i + 1) % coords.length];
      const steps = Math.max(2, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / 3));
      const va = geoPoint(a[0], a[1], radius).normalize();
      const vb = geoPoint(b[0], b[1], radius).normalize();
      const angle = Math.acos(THREE.MathUtils.clamp(va.dot(vb), -1, 1));

      for (let j = 0; j < steps; j++) {
        const t = j / steps;
        let direction;
        if (angle < 0.0001) {
          direction = va.clone();
        } else {
          const sinAngle = Math.sin(angle);
          direction = va.clone().multiplyScalar(Math.sin((1 - t) * angle) / sinAngle)
            .add(vb.clone().multiplyScalar(Math.sin(t * angle) / sinAngle))
            .normalize();
        }
        finePoints.push(direction.multiplyScalar(radius));
      }
    }

    if (!closed) finePoints.push(geoPoint(coords[coords.length - 1][0], coords[coords.length - 1][1], radius));

    const glow = addLine(finePoints, continentGlowMaterial, globe, closed);
    glow.scale.setScalar(1.008);
    addLine(finePoints, continentMaterial, globe, closed);
  }

  addContinent([
    [-168, 66], [-151, 70], [-137, 59], [-126, 53], [-123, 46],
    [-116, 32], [-106, 24], [-97, 19], [-88, 19], [-82, 25],
    [-80, 31], [-75, 37], [-69, 45], [-61, 50], [-58, 57],
    [-67, 61], [-76, 63], [-85, 67], [-95, 72], [-110, 73],
    [-125, 69], [-142, 71], [-157, 72]
  ]);

  addContinent([
    [-81, 12], [-75, 9], [-70, 11], [-64, 10], [-59, 7],
    [-52, 1], [-48, -8], [-42, -14], [-39, -23], [-46, -29],
    [-51, -34], [-56, -40], [-62, -49], [-68, -55], [-73, -50],
    [-74, -41], [-71, -31], [-75, -20], [-79, -8], [-80, 1]
  ]);

  addContinent([
    [-54, 60], [-47, 66], [-44, 75], [-33, 82], [-20, 81],
    [-18, 72], [-26, 64], [-40, 59]
  ]);

  addContinent([
    [-17, 36], [-6, 37], [5, 36], [13, 33], [25, 31],
    [33, 27], [43, 12], [51, 11], [50, 2], [43, -12],
    [39, -20], [32, -29], [24, -34], [17, -35], [12, -29],
    [5, -19], [0, -5], [-8, 5], [-15, 15]
  ]);

  addContinent([
    [-10, 36], [-9, 43], [-3, 48], [7, 53], [17, 59],
    [29, 61], [39, 66], [53, 69], [69, 72], [89, 71],
    [107, 67], [125, 55], [143, 51], [158, 59], [169, 60],
    [178, 52], [163, 45], [151, 39], [139, 35], [130, 29],
    [122, 23], [116, 17], [108, 11], [101, 7], [95, 15],
    [88, 22], [79, 28], [70, 25], [61, 26], [52, 31],
    [42, 38], [34, 36], [27, 41], [19, 45], [11, 44],
    [4, 43], [-2, 40]
  ]);

  addContinent([
    [113, -22], [115, -33], [124, -36], [136, -35], [146, -39],
    [153, -29], [151, -20], [143, -12], [133, -12], [124, -16]
  ]);

  addContinent([
    [47, -13], [50, -16], [49, -24], [45, -26], [43, -20]
  ]);

  addContinent([
    [130, 33], [135, 35], [140, 41], [144, 44]
  ], false);

  const haloMaterial = new THREE.MeshBasicMaterial({
    color: cyan,
    transparent: true,
    opacity: 0.3,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    toneMapped: false
  });

  const orbitalRing = new THREE.Mesh(
    new THREE.TorusGeometry(globeRadius * 1.19, 0.008, 8, 160),
    haloMaterial
  );
  orbitalRing.rotation.x = Math.PI / 2;
  orbitalRing.rotation.y = THREE.MathUtils.degToRad(18);
  globe.add(orbitalRing);

  const orbitalRing2 = new THREE.Mesh(
    new THREE.TorusGeometry(globeRadius * 1.31, 0.006, 8, 160),
    new THREE.MeshBasicMaterial({
      color: cyan,
      transparent: true,
      opacity: 0.15,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      toneMapped: false
    })
  );
  orbitalRing2.rotation.x = THREE.MathUtils.degToRad(70);
  orbitalRing2.rotation.z = THREE.MathUtils.degToRad(28);
  globe.add(orbitalRing2);

  const markerMaterial = new THREE.MeshBasicMaterial({
    color: paleCyan,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    toneMapped: false
  });

  const markers = [
    [-74, 40.7], [-0.1, 51.5], [31.2, 30], [77.2, 28.6],
    [103.8, 1.3], [139.7, 35.7], [151.2, -33.9], [-46.6, -23.5]
  ];

  for (const [lon, lat] of markers) {
    const p = geoPoint(lon, lat, globeRadius * 1.02);
    const marker = new THREE.Mesh(
      new THREE.RingGeometry(0.018, 0.03, 20),
      markerMaterial
    );
    marker.position.copy(p);
    marker.lookAt(p.clone().multiplyScalar(2));
    globe.add(marker);
  }

  const scanRing = new THREE.Mesh(
    new THREE.TorusGeometry(globeRadius * 1.025, 0.012, 8, 160),
    new THREE.MeshBasicMaterial({
      color: 0xc7fbff,
      transparent: true,
      opacity: 0.72,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      toneMapped: false
    })
  );
  scanRing.rotation.x = Math.PI / 2;
  globe.add(scanRing);

  const scanGlow = new THREE.Mesh(
    new THREE.TorusGeometry(globeRadius * 1.028, 0.04, 10, 160),
    new THREE.MeshBasicMaterial({
      color: cyan,
      transparent: true,
      opacity: 0.09,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      toneMapped: false
    })
  );
  scanGlow.rotation.x = Math.PI / 2;
  globe.add(scanGlow);

  const verticalBeam = new THREE.Mesh(
    new THREE.CylinderGeometry(0.015, 0.06, 2.9, 16),
    new THREE.MeshBasicMaterial({
      color: paleCyan,
      transparent: true,
      opacity: 0.12,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      toneMapped: false
    })
  );
  verticalBeam.position.y = 1.76;
  holoAssembly.add(verticalBeam);

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();

    globe.rotation.y = t * 0.105;
    globe.position.y = globeCenterY + Math.sin(t * 1.25) * 0.035;

    const scanLatitude = Math.sin(t * 0.82) * globeRadius * 0.88;
    const scanRadius = Math.sqrt(Math.max(
      0.001,
      globeRadius * globeRadius - scanLatitude * scanLatitude
    ));
    scanRing.position.y = scanLatitude;
    scanRing.scale.setScalar(scanRadius / globeRadius);
    scanGlow.position.y = scanLatitude;
    scanGlow.scale.setScalar(scanRadius / globeRadius);

    emitterRing.material.opacity = 0.72 + Math.sin(t * 3.2) * 0.16;
    emitterGlow.material.opacity = 0.12 + Math.sin(t * 2.4 + 0.8) * 0.045;
    innerEmitter.material.opacity = 0.16 + Math.sin(t * 2.8) * 0.05;
    cone.material.opacity = 0.031 + Math.sin(t * 2.1) * 0.008;
    coneCore.material.opacity = 0.024 + Math.sin(t * 2.7 + 1.1) * 0.007;

    orbitalRing.rotation.z = t * 0.09;
    orbitalRing2.rotation.y = -t * 0.075;

    controls.update();
    renderer.render(scene, camera);
  }

  animate();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  });
</script>
</body>
</html>
