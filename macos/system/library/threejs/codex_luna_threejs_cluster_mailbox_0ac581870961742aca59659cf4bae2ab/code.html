<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cluster Mailbox Unit</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#aeb7ba}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb2bdc0);
scene.fog = new THREE.Fog(0xb2bdc0, 20, 42);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(42,window.innerWidth/window.innerHeight,.1,100);
camera.position.set(10,8.1,12);
camera.lookAt(0,3.8,0);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .06;
controls.autoRotate = true;
controls.autoRotateSpeed = .7;
controls.target.set(0,3.8,0);
controls.minDistance = 8;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI*.48;

const hemi = new THREE.HemisphereLight(0xdde8ec,0x465158,2.2);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2dc,3.2);
key.position.set(-7,13,9);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left = -12;
key.shadow.camera.right = 12;
key.shadow.camera.top = 15;
key.shadow.camera.bottom = -5;
key.shadow.bias = -.0005;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9cb9d0,1.1);
fill.position.set(8,7,-9);
scene.add(fill);

const postal = new THREE.MeshStandardMaterial({color:0x626d70,metalness:.72,roughness:.32});
const edge = new THREE.MeshStandardMaterial({color:0x374144,metalness:.8,roughness:.27});
const doorMat = new THREE.MeshStandardMaterial({color:0x707b7d,metalness:.68,roughness:.3});
const dark = new THREE.MeshStandardMaterial({color:0x182124,metalness:.65,roughness:.25});
const handleMat = new THREE.MeshStandardMaterial({color:0xb8c0be,metalness:.9,roughness:.2});
const labelMat = new THREE.MeshStandardMaterial({color:0xc5cdca,metalness:.55,roughness:.28});
const concrete = new THREE.MeshStandardMaterial({color:0x858b88,roughness:.88,metalness:.05});
const groundMat = new THREE.MeshStandardMaterial({color:0x68716e,roughness:.96});

function box(name,w,h,d,material,x,y,z,rx=0,ry=0,rz=0){
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  mesh.name=name;
  mesh.position.set(x,y,z);
  mesh.rotation.set(rx,ry,rz);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  scene.add(mesh);
  return mesh;
}

function cylinder(name,radius,height,material,x,y,z,rx=0,ry=0,rz=0,segments=16){
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,height,segments),material);
  mesh.name=name;
  mesh.position.set(x,y,z);
  mesh.rotation.set(rx,ry,rz);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  scene.add(mesh);
  return mesh;
}

function addHandle(x,y,w=.34){
  box("handle grip",w,.075,.075,handleMat,x,y,-1.34);
  box("handle mount L",.055,.16,.1,handleMat,x-w*.37,y+.055,-1.30);
  box("handle mount R",.055,.16,.1,handleMat,x+w*.37,y+.055,-1.30);
}

function addKeySlot(x,y){
  box("key slot",.12,.035,.018,dark,x,y,-1.355);
  cylinder("key cylinder",.035,.025,dark,x,y-.03,-1.37,Math.PI/2,0,0,12);
}

function addLabel(x,y,w=.48){
  box("name plate",w,.105,.018,labelMat,x,y,-1.35);
  box("label inset",w-.07,.035,.02,dark,x,y,-1.365);
}

const ground = box("ground",40,.3,40,groundMat,0,-.15,0);
ground.receiveShadow=true;

box("foundation",5.4,.38,3.0,concrete,0,.19,0);
box("pedestal shaft",2.35,2.25,1.55,postal,0,1.48,.05);
box("pedestal front plate",2.05,1.72,.12,edge,0,1.5,-.77);
box("pedestal cap",2.8,.22,1.95,edge,0,2.63,0);

const cabinetW = 5.8;
const cabinetH = 5.25;
const cabinetD = 2.25;
const cabinetY = 5.15;

box("cabinet shell",cabinetW,cabinetH,cabinetD,postal,0,cabinetY,0);
box("left side rail",.16,cabinetH+.12,cabinetD+.08,edge,-2.9,cabinetY,0);
box("right side rail",.16,cabinetH+.12,cabinetD+.08,edge,2.9,cabinetY,0);
box("top rail",cabinetW+.18,.18,cabinetD+.08,edge,0,7.78,0);
box("lower rail",cabinetW+.18,.18,cabinetD+.08,edge,0,2.52,0);
box("front inner panel",5.48,4.98,.08,dark,0,cabinetY,-1.16);

const cols = 5;
const rows = 4;
const doorW = .99;
const doorH = .79;
const gapX = .105;
const gapY = .12;
const startX = -2.16;
const startY = 3.28;

for(let row=0;row<rows;row++){
  for(let col=0;col<cols;col++){
    const x=startX+col*(doorW+gapX);
    const y=startY+row*(doorH+gapY);
    box("small locked door",doorW,doorH,.11,doorMat,x,y,-1.23);
    box("door seam",doorW-.11,.018,.018,edge,x,y-doorH*.38,-1.302);
    addHandle(x,y+.08,.27);
    addKeySlot(x,y-.19);
    if((row+col)%2===0) addLabel(x,y+.27,.42);
  }
}

box("parcel locker divider",.13,1.75,.14,edge,0,2.78,-1.26);
for(const x of [-1.38,1.38]){
  box("parcel locker door",2.62,1.7,.13,doorMat,x,2.78,-1.24);
  box("parcel door lower seam",2.43,.022,.02,edge,x,2.05,-1.315);
  addHandle(x,2.93,.42);
  addKeySlot(x,2.56);
  addLabel(x,2.34,.7);
}

for(const x of [-2.63,2.63]){
  for(const y of [2.78,7.45]){
    cylinder("corner fastener",.055,.025,handleMat,x,y,-1.35,Math.PI/2,0,0,12);
  }
}

box("rear top shadow strip",5.95,.18,.18,dark,0,7.68,1.12);

const roofAngle = .52;
const roofHalfW = 3.18;
const roofDepth = 1.58;
const roofY = 8.02;
const roofZ = .03;
const leftRoof = box("rain hood left",roofHalfW,.18,roofDepth,edge,-1.52,roofY,roofZ,roofAngle,0,0);
const rightRoof = box("rain hood right",roofHalfW,.18,roofDepth,edge,1.52,roofY,roofZ,-roofAngle,0,0);
leftRoof.castShadow=true;
rightRoof.castShadow=true;
box("hood ridge",.18,.22,1.78,dark,0,8.43,0);
box("front hood fascia",6.28,.22,.16,edge,0,7.62,-.76);
box("hood underside",6.05,.08,1.65,dark,0,7.79,0);

for(const x of [-2.54,2.54]){
  cylinder("base bolt",.09,.035,handleMat,x,.42,-.9,Math.PI/2,0,0,16);
  cylinder("base bolt",.09,.035,handleMat,x,.42,.9,Math.PI/2,0,0,16);
}

const ambientGlow = new THREE.PointLight(0x91b5c5,.45,10);
ambientGlow.position.set(0,5,-3);
scene.add(ambientGlow);

window.addEventListener("resize",()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
