<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brick Townhouse Facade</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: linear-gradient(#b9c8d3, #e8e1d5);
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; }
    .caption {
      position: fixed;
      left: 18px;
      bottom: 16px;
      padding: 8px 11px;
      color: rgba(255,255,255,.88);
      background: rgba(22,25,27,.38);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 7px;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      pointer-events: none;
      backdrop-filter: blur(7px);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="caption">Brick Townhouse · Drag to orbit · Scroll to zoom</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xbecbd3);
    scene.fog = new THREE.Fog(0xbecbd3, 26, 54);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(11.5, 8.2, 17.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 5.7, -0.15);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.42;
    controls.minDistance = 10;
    controls.maxDistance = 31;
    controls.maxPolarAngle = Math.PI * 0.49;

    const hemi = new THREE.HemisphereLight(0xddeeff, 0x66574b, 2.0);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffe4c4, 4.2);
    sun.position.set(-9, 15, 11);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -12;
    sun.shadow.camera.right = 12;
    sun.shadow.camera.top = 18;
    sun.shadow.camera.bottom = -5;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 42;
    sun.shadow.bias = -0.0004;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xb7d5ff, 1.15);
    fill.position.set(10, 8, 7);
    scene.add(fill);

    const facade = new THREE.Group();
    facade.rotation.y = -0.025;
    scene.add(facade);

    const mat = {
      mortar: new THREE.MeshStandardMaterial({ color: 0x9d6e58, roughness: 0.96 }),
      brick: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.91, vertexColors: true }),
      sideBrick: new THREE.MeshStandardMaterial({ color: 0x7b3227, roughness: 0.98 }),
      sandstone: new THREE.MeshStandardMaterial({ color: 0xc7b59b, roughness: 0.88 }),
      sandstoneDark: new THREE.MeshStandardMaterial({ color: 0x97816b, roughness: 0.92 }),
      glass: new THREE.MeshPhysicalMaterial({
        color: 0x263b48,
        roughness: 0.16,
        metalness: 0.06,
        transmission: 0.08,
        clearcoat: 0.5
      }),
      frame: new THREE.MeshStandardMaterial({ color: 0xe8e1d2, roughness: 0.58 }),
      frameDark: new THREE.MeshStandardMaterial({ color: 0x272c2c, roughness: 0.55 }),
      door: new THREE.MeshStandardMaterial({ color: 0x17362f, roughness: 0.48 }),
      doorInset: new THREE.MeshStandardMaterial({ color: 0x102a25, roughness: 0.52 }),
      brass: new THREE.MeshStandardMaterial({ color: 0xb78c3f, roughness: 0.28, metalness: 0.82 }),
      iron: new THREE.MeshStandardMaterial({ color: 0x202323, roughness: 0.55, metalness: 0.55 }),
      dark: new THREE.MeshStandardMaterial({ color: 0x151818, roughness: 0.96 }),
      concrete: new THREE.MeshStandardMaterial({ color: 0x77736d, roughness: 1 }),
      pavement: new THREE.MeshStandardMaterial({ color: 0x878987, roughness: 1 }),
      asphalt: new THREE.MeshStandardMaterial({ color: 0x3f4446, roughness: 1 }),
      foliage: new THREE.MeshStandardMaterial({ color: 0x315940, roughness: 0.9 }),
      soil: new THREE.MeshStandardMaterial({ color: 0x30241b, roughness: 1 })
    };

    function box(w, h, d, material, x, y, z, cast = true, receive = true) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      facade.add(mesh);
      return mesh;
    }

    const buildingWidth = 7.15;
    const wallHeight = 12.05;
    const wallFront = 0;

    box(buildingWidth, wallHeight, 1.3, mat.mortar, 0, wallHeight / 2, -0.65);
    box(0.58, wallHeight + 0.25, 1.55, mat.sideBrick, -3.865, wallHeight / 2, -0.7);
    box(0.58, wallHeight + 0.25, 1.55, mat.sideBrick, 3.865, wallHeight / 2, -0.7);

    const openings = [
      { x: -1.62, y: 2.05, w: 1.78, h: 3.72 },
      { x: 1.25, y: 2.37, w: 2.12, h: 2.38 },
      { x: 0.52, y: 6.10, w: 2.48, h: 2.50 },
      { x: 0.42, y: 9.29, w: 2.35, h: 2.42 }
    ];

    function overlapsOpening(x, y, w, h) {
      for (const opening of openings) {
        if (
          x + w / 2 > opening.x - opening.w / 2 - 0.08 &&
          x - w / 2 < opening.x + opening.w / 2 + 0.08 &&
          y + h / 2 > opening.y - opening.h / 2 - 0.08 &&
          y - h / 2 < opening.y + opening.h / 2 + 0.08
        ) return true;
      }
      return false;
    }

    function random(seed) {
      const value = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
      return value - Math.floor(value);
    }

    const brickData = [];
    const courseHeight = 0.255;
    const verticalJoint = 0.035;
    const brickHeight = courseHeight - verticalJoint;
    const nominalWidth = 0.67;
    let seed = 1;

    for (let row = 0; row < 46; row++) {
      const y = 0.18 + row * courseHeight;
      const offset = row % 2 ? nominalWidth * 0.5 : 0;
      for (let column = -7; column <= 7; column++) {
        const variation = 0.93 + random(seed++) * 0.12;
        const width = nominalWidth * variation - 0.04;
        const x = column * nominalWidth + offset;
        if (x - width / 2 < -3.54 || x + width / 2 > 3.54) continue;
        if (overlapsOpening(x, y, width, brickHeight)) continue;
        brickData.push({
          x,
          y,
          w: width,
          h: brickHeight * (0.97 + random(seed++) * 0.03),
          d: 0.115 + random(seed++) * 0.025,
          shade: random(seed++)
        });
      }
    }

    const brickGeometry = new THREE.BoxGeometry(1, 1, 1);
    const bricks = new THREE.InstancedMesh(brickGeometry, mat.brick, brickData.length);
    const dummy = new THREE.Object3D();
    const color = new THREE.Color();

    brickData.forEach((brick, index) => {
      dummy.position.set(brick.x, brick.y, 0.045 + brick.d / 2);
      dummy.scale.set(brick.w, brick.h, brick.d);
      dummy.updateMatrix();
      bricks.setMatrixAt(index, dummy.matrix);

      const hue = 0.015 + brick.shade * 0.012;
      const saturation = 0.53 + brick.shade * 0.13;
      const lightness = 0.24 + brick.shade * 0.12;
      color.setHSL(hue, saturation, lightness);
      bricks.setColorAt(index, color);
    });
    bricks.castShadow = true;
    bricks.receiveShadow = true;
    facade.add(bricks);

    function addWindow(x, y, w, h) {
      const group = new THREE.Group();
      group.position.set(x, y, 0);
      facade.add(group);

      const recess = new THREE.Mesh(new THREE.BoxGeometry(w + 0.13, h + 0.12, 0.13), mat.dark);
      recess.position.z = 0.135;
      recess.castShadow = true;
      group.add(recess);

      const glass = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.28, h - 0.30), mat.glass);
      glass.position.z = 0.208;
      group.add(glass);

      const frameDepth = 0.13;
      const frameZ = 0.275;
      const sideWidth = 0.115;

      const left = new THREE.Mesh(new THREE.BoxGeometry(sideWidth, h - 0.15, frameDepth), mat.frame);
      left.position.set(-w / 2 + 0.14, 0, frameZ);
      left.castShadow = true;
      group.add(left);

      const right = left.clone();
      right.position.x = w / 2 - 0.14;
      group.add(right);

      const top = new THREE.Mesh(new THREE.BoxGeometry(w - 0.16, sideWidth, frameDepth), mat.frame);
      top.position.set(0, h / 2 - 0.13, frameZ);
      top.castShadow = true;
      group.add(top);

      const bottom = top.clone();
      bottom.position.y = -h / 2 + 0.13;
      group.add(bottom);

      const meetingRail = new THREE.Mesh(new THREE.BoxGeometry(w - 0.25, 0.13, 0.15), mat.frame);
      meetingRail.position.set(0, 0.04, frameZ + 0.015);
      meetingRail.castShadow = true;
      group.add(meetingRail);

      const verticalRail = new THREE.Mesh(new THREE.BoxGeometry(0.095, h - 0.34, 0.14), mat.frame);
      verticalRail.position.set(0, 0, frameZ + 0.01);
      verticalRail.castShadow = true;
      group.add(verticalRail);

      for (const paneX of [-w * 0.245, w * 0.245]) {
        const slim = new THREE.Mesh(new THREE.BoxGeometry(0.036, h - 0.38, 0.055), mat.frameDark);
        slim.position.set(paneX, 0, frameZ + 0.045);
        group.add(slim);
      }

      const lintel = new THREE.Mesh(new THREE.BoxGeometry(w + 0.46, 0.24, 0.30), mat.sandstone);
      lintel.position.set(0, h / 2 + 0.19, 0.22);
      lintel.castShadow = true;
      lintel.receiveShadow = true;
      group.add(lintel);

      const sill = new THREE.Mesh(new THREE.BoxGeometry(w + 0.50, 0.18, 0.48), mat.sandstone);
      sill.position.set(0, -h / 2 - 0.15, 0.29);
      sill.castShadow = true;
      sill.receiveShadow = true;
      group.add(sill);

      const sillShadow = new THREE.Mesh(new THREE.BoxGeometry(w + 0.35, 0.10, 0.24), mat.sandstoneDark);
      sillShadow.position.set(0, -h / 2 - 0.265, 0.15);
      group.add(sillShadow);

      const curtainMaterial = new THREE.MeshStandardMaterial({
        color: 0xd8c9ad,
        roughness: 0.95,
        transparent: true,
        opacity: 0.38,
        side: THREE.DoubleSide
      });
      const curtainLeft = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.30, h - 0.42), curtainMaterial);
      curtainLeft.position.set(-w * 0.30, 0, 0.215);
      group.add(curtainLeft);

      const curtainRight = curtainLeft.clone();
      curtainRight.position.x = w * 0.30;
      group.add(curtainRight);
    }

    addWindow(1.25, 2.37, 2.12, 2.38);
    addWindow(0.52, 6.10, 2.48, 2.50);
    addWindow(0.42, 9.29, 2.35, 2.42);

    function addDoor() {
      const x = -1.62;
      const y = 2.05;
      const w = 1.78;
      const h = 3.72;
      const group = new THREE.Group();
      group.position.set(x, y, 0);
      facade.add(group);

      const shadow = new THREE.Mesh(new THREE.BoxGeometry(w + 0.28, h + 0.22, 0.16), mat.dark);
      shadow.position.z = 0.13;
      shadow.castShadow = true;
      group.add(shadow);

      const door = new THREE.Mesh(new THREE.BoxGeometry(w - 0.22, h - 0.28, 0.16), mat.door);
      door.position.set(0, -0.02, 0.235);
      door.castShadow = true;
      group.add(door);

      const jambWidth = 0.16;
      const jambLeft = new THREE.Mesh(new THREE.BoxGeometry(jambWidth, h + 0.10, 0.34), mat.sandstone);
      jambLeft.position.set(-w / 2 - 0.03, 0, 0.25);
      jambLeft.castShadow = true;
      group.add(jambLeft);

      const jambRight = jambLeft.clone();
      jambRight.position.x = w / 2 + 0.03;
      group.add(jambRight);

      const lintel = new THREE.Mesh(new THREE.BoxGeometry(w + 0.44, 0.28, 0.38), mat.sandstone);
      lintel.position.set(0, h / 2 + 0.08, 0.27);
      lintel.castShadow = true;
      group.add(lintel);

      const transomGlass = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.42, 0.48), mat.glass);
      transomGlass.position.set(0, h / 2 - 0.40, 0.33);
      group.add(transomGlass);

      const transomFrame = new THREE.Mesh(new THREE.BoxGeometry(w - 0.32, 0.09, 0.12), mat.frame);
      transomFrame.position.set(0, h / 2 - 0.68, 0.36);
      transomFrame.castShadow = true;
      group.add(transomFrame);

      const transomVertical = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.46, 0.10), mat.frame);
      transomVertical.position.set(0, h / 2 - 0.40, 0.36);
      group.add(transomVertical);

      const panelYs = [-0.98, -0.30, 0.47];
      const panelHeights = [0.48, 0.48, 0.64];
      for (let i = 0; i < panelYs.length; i++) {
        const inset = new THREE.Mesh(
          new THREE.BoxGeometry(w - 0.57, panelHeights[i], 0.055),
          mat.doorInset
        );
        inset.position.set(0, panelYs[i], 0.335);
        inset.castShadow = true;
        group.add(inset);

        const topTrim = new THREE.Mesh(
          new THREE.BoxGeometry(w - 0.49, 0.055, 0.075),
          mat.door
        );
        topTrim.position.set(0, panelYs[i] + panelHeights[i] / 2 + 0.035, 0.375);
        group.add(topTrim);
      }

      const knob = new THREE.Mesh(new THREE.SphereGeometry(0.075, 20, 12), mat.brass);
      knob.position.set(0.52, -0.20, 0.44);
      knob.castShadow = true;
      group.add(knob);

      const keyplate = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.19, 0.035), mat.brass);
      keyplate.position.set(0.52, -0.36, 0.42);
      group.add(keyplate);

      const mailSlot = new THREE.Mesh(new THREE.BoxGeometry(0.46, 0.10, 0.055), mat.brass);
      mailSlot.position.set(0, 0.05, 0.42);
      mailSlot.castShadow = true;
      group.add(mailSlot);

      const threshold = new THREE.Mesh(new THREE.BoxGeometry(w + 0.12, 0.14, 0.58), mat.sandstoneDark);
      threshold.position.set(0, -h / 2 - 0.02, 0.30);
      threshold.castShadow = true;
      group.add(threshold);

      const lampStem = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.36, 0.08), mat.iron);
      lampStem.position.set(w / 2 + 0.42, 0.66, 0.33);
      group.add(lampStem);

      const lamp = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18, 0.24, 0.42, 6),
        new THREE.MeshStandardMaterial({
          color: 0xffcf76,
          emissive: 0xffa632,
          emissiveIntensity: 1.6,
          roughness: 0.35
        })
      );
      lamp.position.set(w / 2 + 0.42, 0.44, 0.38);
      lamp.castShadow = true;
      group.add(lamp);

      const lampLight = new THREE.PointLight(0xffb75d, 1.2, 4.5, 2);
      lampLight.position.set(w / 2 + 0.42, 0.43, 0.65);
      group.add(lampLight);
    }

    addDoor();

    function addCourse(y, style = 0) {
      const height = style === 1 ? 0.22 : 0.15;
      const depth = style === 1 ? 0.28 : 0.21;
      box(buildingWidth + 0.20, height, depth, mat.sandstoneDark, 0, y, 0.13 + depth / 2);
      if (style === 1) {
        box(buildingWidth + 0.36, 0.09, 0.38, mat.sandstone, 0, y + 0.13, 0.20);
      }
    }

    addCourse(4.25, 0);
    addCourse(7.63, 0);

    box(buildingWidth + 0.18, 0.22, 0.31, mat.sandstoneDark, 0, 11.43, 0.17);
    box(buildingWidth + 0.42, 0.26, 0.47, mat.sandstone, 0, 11.69, 0.24);
    box(buildingWidth + 0.58, 0.18, 0.60, mat.sandstoneDark, 0, 11.94, 0.29);
    box(buildingWidth + 0.72, 0.24, 0.74, mat.sandstone, 0, 12.18, 0.34);
    box(buildingWidth + 0.78, 0.12, 0.88, mat.sandstoneDark, 0, 12.35, 0.41);

    for (let i = 0; i < 8; i++) {
      box(0.55, 0.32, 0.38, mat.sandstoneDark, -3.06 + i * 0.875, 11.50, 0.28);
    }

    box(2.35, 0.28, 1.25, mat.concrete, -1.53, 0.19, 0.63);
    box(2.65, 0.23, 1.58, mat.concrete, -1.53, -0.04, 0.86);
    box(2.92, 0.21, 1.93, mat.concrete, -1.53, -0.25, 1.08);

    function railPost(x, z, h) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, h, 10), mat.iron);
      post.position.set(x, h / 2 - 0.05, z);
      post.castShadow = true;
      facade.add(post);
    }

    for (const x of [-2.82, -0.25]) {
      railPost(x, 1.12, 1.0);
      railPost(x, 1.78, 0.76);
      const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.82, 10), mat.iron);
      rail.position.set(x, 0.67, 1.45);
      rail.rotation.x = Math.PI / 2;
      rail.rotation.z = -0.30;
      rail.castShadow = true;
      facade.add(rail);
    }

    box(0.13, 11.0, 0.13, mat.iron, 3.12, 5.55, 0.27);
    const drainTop = new THREE.Mesh(new THREE.TorusGeometry(0.13, 0.045, 8, 16, Math.PI), mat.iron);
    drainTop.position.set(3.12, 11.03, 0.25);
    drainTop.rotation.z = Math.PI / 2;
    facade.add(drainTop);

    function planter(x, z) {
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.23, 0.48, 12), mat.sandstoneDark);
      pot.position.set(x, 0.25, z);
      pot.castShadow = true;
      pot.receiveShadow = true;
      facade.add(pot);

      const soil = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.035, 12), mat.soil);
      soil.position.set(x, 0.50, z);
      facade.add(soil);

      for (let i = 0; i < 9; i++) {
        const leaf = new THREE.Mesh(
          new THREE.SphereGeometry(0.16 + random(i + x) * 0.09, 10, 8),
          mat.foliage
        );
        const angle = i * 2.399;
        const radius = 0.12 + (i % 3) * 0.075;
        leaf.scale.set(0.65, 1.3, 0.65);
        leaf.position.set(
          x + Math.cos(angle) * radius,
          0.58 + (i % 4) * 0.12,
          z + Math.sin(angle) * radius
        );
        leaf.castShadow = true;
        facade.add(leaf);
      }
    }

    planter(2.85, 0.78);

    const sidewalk = new THREE.Mesh(new THREE.BoxGeometry(24, 0.35, 6.4), mat.pavement);
    sidewalk.position.set(0, -0.49, 2.08);
    sidewalk.receiveShadow = true;
    scene.add(sidewalk);

    const curb = new THREE.Mesh(new THREE.BoxGeometry(24, 0.43, 0.42), mat.concrete);
    curb.position.set(0, -0.48, 5.17);
    curb.castShadow = true;
    curb.receiveShadow = true;
    scene.add(curb);

    const road = new THREE.Mesh(new THREE.PlaneGeometry(40, 30), mat.asphalt);
    road.rotation.x = -Math.PI / 2;
    road.position.set(0, -0.69, 19.8);
    road.receiveShadow = true;
    scene.add(road);

    const sideWallLeft = new THREE.Mesh(
      new THREE.BoxGeometry(5.0, 11.2, 1.1),
      new THREE.MeshStandardMaterial({ color: 0x6e6257, roughness: 1 })
    );
    sideWallLeft.position.set(-6.05, 5.2, -1.12);
    sideWallLeft.receiveShadow = true;
    sideWallLeft.castShadow = true;
    scene.add(sideWallLeft);

    const sideWallRight = sideWallLeft.clone();
    sideWallRight.material = new THREE.MeshStandardMaterial({ color: 0x85786b, roughness: 1 });
    sideWallRight.position.x = 6.05;
    sideWallRight.position.y = 4.85;
    scene.add(sideWallRight);

    const skyGlow = new THREE.Mesh(
      new THREE.SphereGeometry(48, 32, 16),
      new THREE.MeshBasicMaterial({
        color: 0xc6d3d9,
        side: THREE.BackSide,
        fog: false
      })
    );
    scene.add(skyGlow);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    animate();
  </script>
</body>
</html>
