<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mechanical Wristwatch</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#14161a}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const TAU=Math.PI*2;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x14161a);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,100);
camera.position.set(3.6,2.3,7.2);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture;

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.15,0);
controls.enableDamping=true;
controls.autoRotate=true;
controls.autoRotateSpeed=1.3;
controls.minDistance=3;controls.maxDistance=15;

// lights
const key=new THREE.DirectionalLight(0xffffff,2.4);
key.position.set(4,7,5);
key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=key.shadow.camera.bottom=-5.5;
key.shadow.camera.right=key.shadow.camera.top=5.5;
key.shadow.camera.near=1;key.shadow.camera.far=20;
key.shadow.bias=-0.0004;key.shadow.normalBias=0.02;
scene.add(key);
scene.add(new THREE.HemisphereLight(0x93a4c0,0x1c1e22,0.5));
const fill=new THREE.DirectionalLight(0xbfd0ff,0.5);
fill.position.set(-5,2,-4);scene.add(fill);

// materials
const M={
 steel:new THREE.MeshStandardMaterial({color:0xb8bdc4,metalness:1,roughness:0.38}),
 polish:new THREE.MeshStandardMaterial({color:0xd6dade,metalness:1,roughness:0.16}),
 bezel:new THREE.MeshStandardMaterial({color:0x8a9099,metalness:1,roughness:0.27}),
 dark:new THREE.MeshStandardMaterial({color:0x11141a,metalness:0.4,roughness:0.6}),
 dial:new THREE.MeshStandardMaterial({color:0x0c2242,metalness:0.55,roughness:0.42}),
 lume:new THREE.MeshStandardMaterial({color:0xe9eef4,metalness:0.7,roughness:0.25}),
 red:new THREE.MeshStandardMaterial({color:0xc0392b,metalness:0.5,roughness:0.4}),
 glass:new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:0,roughness:0.05,transparent:true,opacity:0.15,clearcoat:1})
};
const box=(w,h,d,m)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.castShadow=true;return o};
const cyl=(rt,rb,h,m,s=48)=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s),m);o.castShadow=true;return o};

const watch=new THREE.Group();
const R=2.6;

// ---- head ----
const head=new THREE.Group();
head.position.y=R;
const caseBody=cyl(1.56,1.48,0.62,M.steel,96);head.add(caseBody);
const back=cyl(1.22,1.28,0.12,M.polish,64);back.position.y=-0.36;head.add(back);

// bezel (ring with engraved ticks + knurled edge)
const shp=new THREE.Shape();shp.absarc(0,0,1.72,0,TAU);
const hole=new THREE.Path();hole.absarc(0,0,1.34,0,TAU,true);shp.holes.push(hole);
const bezGeo=new THREE.ExtrudeGeometry(shp,{depth:0.2,bevelEnabled:true,bevelThickness:0.03,bevelSize:0.03,bevelSegments:2,curveSegments:72});
bezGeo.rotateX(-Math.PI/2);
const bezel=new THREE.Group();
const bezRing=new THREE.Mesh(bezGeo,M.bezel);bezRing.castShadow=true;bezRing.position.y=0.34;bezel.add(bezRing);
for(let i=0;i<60;i++){const th=i/60*TAU,big=i%5===0;
 const t=box(big?0.22:0.1,0.02,big?0.05:0.03,M.dark);
 t.position.set(Math.cos(th)*1.51,0.575,Math.sin(th)*1.51);t.rotation.y=-th;bezel.add(t);}
const pip=box(0.13,0.035,0.09,M.lume);pip.position.set(1.51,0.585,0);bezel.add(pip);
for(let i=0;i<80;i++){const th=i/80*TAU;
 const k=box(0.05,0.2,0.04,M.steel);
 k.position.set(Math.cos(th)*1.74,0.44,Math.sin(th)*1.74);k.rotation.y=-th;bezel.add(k);}
head.add(bezel);

// dial + markers + minute track
const dial=cyl(1.33,1.33,0.03,M.dial,72);dial.position.y=0.33;head.add(dial);
for(let h=0;h<12;h++){const th=h/12*TAU;
 if(h===0){for(const dz of[-0.07,0.07]){const m=box(0.28,0.04,0.06,M.lume);
  m.position.set(Math.cos(th)*1.03,0.365,Math.sin(th)*1.03+dz);m.rotation.y=-th;head.add(m);}}
 else{const m=box(0.28,0.04,0.1,M.lume);
  m.position.set(Math.cos(th)*1.03,0.365,Math.sin(th)*1.03);m.rotation.y=-th;head.add(m);}}
for(let i=0;i<60;i++){const th=i/60*TAU;
 const t=box(0.06,0.012,0.014,M.lume);
 t.position.set(Math.cos(th)*1.26,0.352,Math.sin(th)*1.26);t.rotation.y=-th;head.add(t);}

// hands (10:08:30)
const mkHand=(len,w,thick,m,off)=>{const g=new THREE.BoxGeometry(len,thick,w);g.translate(off,0,0);
 const o=new THREE.Mesh(g,m);o.castShadow=true;return o};
const hourH=mkHand(0.72,0.09,0.025,M.lume,0.3);hourH.position.y=0.39;
hourH.rotation.y=-((10+8/60)/12*TAU);head.add(hourH);
const minH=mkHand(1.06,0.06,0.02,M.lume,0.47);minH.position.y=0.41;
minH.rotation.y=-(8/60*TAU);head.add(minH);
const secH=mkHand(1.32,0.02,0.012,M.red,0.44);secH.position.y=0.43;head.add(secH);
const cap=cyl(0.06,0.06,0.08,M.polish,24);cap.position.y=0.42;head.add(cap);

// crystal
const crystal=cyl(1.3,1.33,0.06,M.glass,72);crystal.position.y=0.5;crystal.castShadow=false;head.add(crystal);

// crown + guards (at 3 o'clock, +Z)
const stem=cyl(0.1,0.1,0.3,M.steel,24);stem.rotation.x=Math.PI/2;stem.position.set(0,0,1.6);head.add(stem);
const crown=cyl(0.27,0.27,0.26,M.polish,32);crown.rotation.x=Math.PI/2;crown.position.set(0,0,1.8);head.add(crown);
for(let i=0;i<18;i++){const th=i/18*TAU;
 const k=box(0.045,0.045,0.28,M.steel);
 k.position.set(Math.cos(th)*0.27,Math.sin(th)*0.27,1.8);k.rotation.z=th;head.add(k);}
const endcap=cyl(0.2,0.2,0.05,M.polish,24);endcap.rotation.x=Math.PI/2;endcap.position.set(0,0,1.945);head.add(endcap);
for(const sx of[-1,1]){const g=new THREE.Mesh(new THREE.SphereGeometry(0.28,24,16),M.steel);
 g.scale.set(1.1,0.75,1.6);g.position.set(sx*0.44,0,1.5);g.castShadow=true;head.add(g);}
watch.add(head);

// ---- bracelet: segmented links around a loop, folding clasp at bottom ----
const N=25,phi0=0.62,step=(TAU-2*phi0)/N;
for(let i=0;i<=N;i++){const p=phi0+i*step;
 if(Math.abs(p-Math.PI)<0.34)continue;
 const L=new THREE.Group();
 const c=box(0.46,0.26,0.5,M.polish);c.position.y=0.012;L.add(c);
 for(const sz of[-1,1]){const s=box(0.46,0.22,0.4,M.steel);s.position.z=sz*0.47;L.add(s);}
 L.position.set(Math.sin(p)*R,Math.cos(p)*R,0);L.rotation.z=-p;
 watch.add(L);}
const clasp=new THREE.Group();
clasp.add(box(1.55,0.15,1.25,M.steel));
const p2=box(1.25,0.06,1.05,M.polish);p2.position.y=-0.13;clasp.add(p2);
const p3=box(0.85,0.06,0.95,M.steel);p3.position.y=-0.2;clasp.add(p3);
for(const sz of[-1,1]){const b=cyl(0.05,0.05,0.12,M.polish,16);
 b.rotation.x=Math.PI/2;b.position.set(0,-0.04,sz*0.66);clasp.add(b);}
clasp.position.set(0,-2.54,0);clasp.rotation.z=-Math.PI;
watch.add(clasp);

watch.rotation.x=0.35;
scene.add(watch);

// ground with soft shadow
const ground=new THREE.Mesh(new THREE.CircleGeometry(14,64),new THREE.MeshStandardMaterial({color:0x191c21,roughness:1,metalness:0}));
ground.rotation.x=-Math.PI/2;ground.position.y=-2.83;ground.receiveShadow=true;scene.add(ground);
const shadowPlane=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.ShadowMaterial({opacity:0.35}));
shadowPlane.rotation.x=-Math.PI/2;shadowPlane.position.y=-2.825;shadowPlane.receiveShadow=true;scene.add(shadowPlane);

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
 const t=clock.getElapsedTime();
 secH.rotation.y=-(Math.PI+t*TAU/60);
 minH.rotation.y=-(8/60*TAU+t*TAU/3600);
 controls.update();
 renderer.render(scene,camera);
});
</script>
</body>
</html>
