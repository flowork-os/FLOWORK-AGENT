<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backyard Greenhouse — three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141619; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------------------------- renderer / scene / camera ---------------------------------- */

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141619);
scene.fog = new THREE.Fog(0x141619, 14, 34);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.8, 2.7, 5.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 3;
controls.maxDistance = 14;
controls.maxPolarAngle = 1.52;

/* ---------------------------------- lighting ---------------------------------- */

scene.add(new THREE.HemisphereLight(0xbdd0e0, 0x40362a, 0.55));

const key = new THREE.DirectionalLight(0xffe8cf, 2.4);
key.position.set(4.5, 6.5, 3.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4.5;
key.shadow.camera.right = 4.5;
key.shadow.camera.top = 4.5;
key.shadow.camera.bottom = -4.5;
key.shadow.camera.near = 1;
key.shadow.camera.far = 20;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fa8c8, 0.6);
fill.position.set(-5, 2.5, -1.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xcfe0ff, 1.0);
rim.position.set(-2.5, 4.5, -5.5);
scene.add(rim);

/* ---------------------------------- shadow-catcher ground ---------------------------------- */

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.35 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------- materials ---------------------------------- */

const alu = new THREE.MeshStandardMaterial({ color: 0xc3c8ce, metalness: 0.85, roughness: 0.38 });
const aluDark = new THREE.MeshStandardMaterial({ color: 0x9aa0a6, metalness: 0.9, roughness: 0.3 });
const glass = new THREE.MeshPhysicalMaterial({
  color: 0xd6ecf2, transparent: true, opacity: 0.18,
  roughness: 0.06, metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.1,
  side: THREE.DoubleSide, depthWrite: false
});
const concrete = new THREE.MeshStandardMaterial({ color: 0x84878b, roughness: 0.95, metalness: 0 });
const wood = new THREE.MeshStandardMaterial({ color: 0x6b543a, roughness: 0.85, metalness: 0 });
const woodDark = new THREE.MeshStandardMaterial({ color: 0x4a3a28, roughness: 0.9, metalness: 0 });
const terracotta = new THREE.MeshStandardMaterial({ color: 0xa85f3d, roughness: 0.8, metalness: 0 });
const soilMat = new THREE.MeshStandardMaterial({ color: 0x2e2419, roughness: 1, metalness: 0 });
const steel = new THREE.MeshStandardMaterial({ color: 0x777c82, metalness: 0.95, roughness: 0.25 });
const greens = [0x3f7a3a, 0x4d8a44, 0x35682f].map(
  c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.95, metalness: 0 })
);

/* ---------------------------------- dimensions (metres, realistic 6x10 ft greenhouse) ---------------------------------- */

const W = 2.6;                    // width  (x)
const D = 3.2;                    // depth  (z)
const EAVE = 1.9;                 // eave height
const RIDGE = 2.62;               // ridge height
const T = 0.05;                   // main frame member
const B = 0.028;                  // glazing bar
const y0 = 0.1;                   // top of concrete plinth
const doorW = 0.78, doorH = 1.82;
const pitch = Math.atan2(RIDGE - EAVE, W / 2);
const slope = Math.hypot(W / 2, RIDGE - EAVE);

const G = new THREE.Group();      // the single centered object
scene.add(G);

/* ---------------------------------- helpers ---------------------------------- */

function box(mat, sx, sy, sz, x, y, z, rz = 0, ry = 0, parent = G) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
  m.position.set(x, y, z);
  m.rotation.set(0, ry, rz);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function cyl(mat, rTop, rBot, h, x, y, z, rz = 0, parent = G, seg = 14) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, h, seg), mat);
  m.position.set(x, y, z);
  m.rotation.z = rz;
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* ---------------------------------- concrete plinth / floor ---------------------------------- */

box(concrete, W + 0.16, 0.1, D + 0.16, 0, 0.05, 0);

/* ---------------------------------- aluminum frame skeleton ---------------------------------- */

const postH = EAVE - y0;
const postY = (EAVE + y0) / 2;
const zs = [-D / 2, -D / 4, 0, D / 4, D / 2];
const zsMid = [-3 * D / 8, -D / 8, D / 8, 3 * D / 8];

for (const s of [-1, 1]) {
  // side-wall posts + thin glazing bars
  for (const z of zs) box(alu, T, postH, T, s * W / 2, postY, z);
  for (const z of zsMid) box(aluDark, B, postH, B, s * W / 2, postY, z);
  // sill, mid rail, eave rail along each side
  box(alu, T, T, D, s * W / 2, y0 + T / 2, 0);
  box(aluDark, T * 0.7, T * 0.7, D, s * W / 2, 0.8, 0);
  box(alu, T, T, D, s * W / 2, EAVE, 0);
}

// back-wall mullions and rails (z = -D/2)
for (const x of [-W / 6, W / 6]) box(alu, T, postH, T, x, postY, -D / 2);
box(alu, W, T, T, 0, y0 + T / 2, -D / 2);
box(aluDark, W, T * 0.7, T * 0.7, 0, 0.8, -D / 2);

// eave-level rails across both gable ends
for (const s of [-1, 1]) box(alu, W, T, T, 0, EAVE, s * D / 2);

// front-wall door jambs, header, sill segments (z = +D/2)
for (const s of [-1, 1]) {
  box(alu, T, postH, T, s * (doorW / 2 + T / 2), postY, D / 2);
  const sillLen = W / 2 - doorW / 2 - T;
  box(alu, sillLen, T, T, s * (W / 2 + doorW / 2 + T) / 2, y0 + T / 2, D / 2);
}
box(alu, doorW + 2 * T, T, T, 0, doorH + T / 2, D / 2);
box(aluDark, B, EAVE - doorH - T, B, 0, (EAVE + doorH + T) / 2, D / 2);

// gable in-fill bars (small verticals in the triangles)
for (const sz of [-1, 1]) {
  for (const sx of [-1, 1]) {
    const x = sx * 0.45;
    const hAt = RIDGE - (RIDGE - EAVE) * Math.abs(x) / (W / 2);
    box(aluDark, B, hAt - EAVE, B, x, (hAt + EAVE) / 2, sz * D / 2);
  }
}

// rafters (gable top chords included) + roof glazing bars
const rafY = (EAVE + RIDGE) / 2;
for (const s of [-1, 1]) {
  for (const z of zs) box(alu, slope, T, T, s * W / 4, rafY, z, -s * pitch);
  for (const z of zsMid) box(aluDark, slope, B, B, s * W / 4, rafY, z, -s * pitch);
  // mid-slope purlin
  box(aluDark, 0.035, 0.035, D, s * W / 4, rafY, 0, -s * pitch);
}

// ridge beam
box(alu, 0.07, 0.1, D + 0.12, 0, RIDGE + 0.02, 0);

/* ---------------------------------- glazing ---------------------------------- */

function addGlass(mesh) {
  mesh.castShadow = false;
  mesh.receiveShadow = false;
  mesh.renderOrder = 2;
  G.add(mesh);
  return mesh;
}

// roof panes (slight overhang)
for (const s of [-1, 1]) {
  const geo = new THREE.PlaneGeometry(slope + 0.06, D + 0.12);
  geo.rotateX(-Math.PI / 2);
  const g = new THREE.Mesh(geo, glass);
  g.position.set(s * W / 4, rafY, 0);
  g.rotation.z = -s * pitch;
  addGlass(g);
}

// side-wall panes
for (const s of [-1, 1]) {
  const g = new THREE.Mesh(new THREE.PlaneGeometry(D, postH), glass);
  g.position.set(s * (W / 2 - 0.008), postY, 0);
  g.rotation.y = s * Math.PI / 2;
  addGlass(g);
}

// gable pentagon shape (whole end wall)
function gableShape(withDoorHole) {
  const sh = new THREE.Shape();
  sh.moveTo(-W / 2, y0);
  sh.lineTo(W / 2, y0);
  sh.lineTo(W / 2, EAVE);
  sh.lineTo(0, RIDGE);
  sh.lineTo(-W / 2, EAVE);
  sh.closePath();
  if (withDoorHole) {
    const hole = new THREE.Path();
    hole.moveTo(-doorW / 2, y0);
    hole.lineTo(-doorW / 2, doorH);
    hole.lineTo(doorW / 2, doorH);
    hole.lineTo(doorW / 2, y0);
    hole.closePath();
    sh.holes.push(hole);
  }
  return new THREE.ShapeGeometry(sh);
}

const backGlass = new THREE.Mesh(gableShape(false), glass);
backGlass.position.z = -D / 2;
addGlass(backGlass);

const frontGlass = new THREE.Mesh(gableShape(true), glass);
frontGlass.position.z = D / 2;
addGlass(frontGlass);

/* ---------------------------------- hinged door with handle (slightly ajar) ---------------------------------- */

const door = new THREE.Group();
door.position.set(-doorW / 2, 0, D / 2 + 0.03);   // hinge axis at left jamb
door.rotation.y = -0.55;                          // swung open ~31 degrees
G.add(door);

const dBot = 0.12, dTop = 1.8, dMid = (dBot + dTop) / 2;

// stiles
box(alu, 0.05, dTop - dBot, 0.04, 0.025, dMid, 0, 0, 0, door);
box(alu, 0.05, dTop - dBot, 0.04, doorW - 0.025, dMid, 0, 0, 0, door);
// rails: top, mid, tall kick rail
box(alu, doorW - 0.1, 0.05, 0.04, doorW / 2, dTop - 0.025, 0, 0, 0, door);
box(aluDark, doorW - 0.1, 0.045, 0.035, doorW / 2, 0.86, 0, 0, 0, door);
box(alu, doorW - 0.1, 0.13, 0.04, doorW / 2, dBot + 0.065, 0, 0, 0, door);
// door glazing
const doorGlass = new THREE.Mesh(new THREE.PlaneGeometry(doorW - 0.08, dTop - dBot - 0.08), glass);
doorGlass.position.set(doorW / 2, dMid, 0);
doorGlass.castShadow = false;
doorGlass.renderOrder = 2;
door.add(doorGlass);
// hinge barrels on the pivot edge
cyl(steel, 0.015, 0.015, 0.1, 0, 0.4, 0, 0, door);
cyl(steel, 0.015, 0.015, 0.1, 0, 1.55, 0, 0, door);
// handle: backplate + lever outside, knob inside
box(steel, 0.03, 0.15, 0.012, doorW - 0.09, 0.98, 0.026, 0, 0, door);
cyl(steel, 0.011, 0.011, 0.13, doorW - 0.145, 1.0, 0.048, Math.PI / 2, door);
cyl(steel, 0.014, 0.014, 0.03, doorW - 0.09, 1.0, 0.03, 0, door).rotation.x = Math.PI / 2;
cyl(steel, 0.016, 0.016, 0.025, doorW - 0.09, 0.98, -0.025, 0, door).rotation.x = Math.PI / 2;

/* ---------------------------------- interior: potting benches + plants ---------------------------------- */

function pot(parent, x, z, y, s, gi) {
  const p = new THREE.Group();
  p.position.set(x, y, z);
  parent.add(p);
  cyl(terracotta, 0.09 * s, 0.07 * s, 0.15 * s, 0, 0.075 * s, 0, 0, p, 12);
  cyl(soilMat, 0.082 * s, 0.082 * s, 0.02, 0, 0.145 * s, 0, 0, p, 12);
  const blobGeo = new THREE.IcosahedronGeometry(1, 1);
  const offsets = [[0, 0.24, 0, 0.13], [0.06, 0.19, 0.04, 0.09], [-0.05, 0.2, -0.05, 0.08]];
  for (let i = 0; i < offsets.length; i++) {
    const o = offsets[i];
    const b = new THREE.Mesh(blobGeo, greens[(gi + i) % greens.length]);
    b.position.set(o[0] * s, o[1] * s, o[2] * s);
    b.scale.setScalar(o[3] * s);
    b.castShadow = true;
    p.add(b);
  }
  return p;
}

function bench(len, wid, x, z) {
  const topY = 0.82, shelfY = 0.34;
  const b = new THREE.Group();
  b.position.set(x, 0, z);
  G.add(b);
  box(wood, len, 0.045, wid, 0, topY, 0, 0, 0, b);
  box(woodDark, len - 0.16, 0.035, wid - 0.14, 0, shelfY, 0, 0, 0, b);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    box(woodDark, 0.05, topY - y0, 0.05, sx * (len / 2 - 0.06), (topY + y0) / 2, sz * (wid / 2 - 0.06), 0, 0, b);
  }
  return { group: b, topY };
}

// bench along the right wall (long, x-axis rotated group not needed: length along z)
const bR = bench(0.55, D - 1.0, 0, 0);   // placeholder sizing below via rotation
bR.group.rotation.y = Math.PI / 2;
bR.group.position.set(W / 2 - 0.38, 0, -0.1);

// bench along the left wall, a bit shorter
const bL = bench(0.55, D - 1.5, 0, 0);
bL.group.rotation.y = Math.PI / 2;
bL.group.position.set(-(W / 2 - 0.38), 0, -0.35);

// pots on the benches (positions in each bench's local frame: x = across, z = along wall)
pot(bR.group, 0.05, -0.85, bR.topY + 0.02, 1.0, 0);
pot(bR.group, -0.1, -0.3, bR.topY + 0.02, 0.8, 1);
pot(bR.group, 0.08, 0.25, bR.topY + 0.02, 1.15, 2);
pot(bR.group, -0.05, 0.8, bR.topY + 0.02, 0.9, 0);
pot(bL.group, 0.0, -0.5, bL.topY + 0.02, 1.05, 1);
pot(bL.group, 0.08, 0.1, bL.topY + 0.02, 0.85, 2);
pot(bL.group, -0.08, 0.55, bL.topY + 0.02, 0.95, 0);

// tall floor plant in the back corner + a spare pot by the door
const tall = new THREE.Group();
tall.position.set(-0.75, y0, -1.15);
G.add(tall);
cyl(terracotta, 0.16, 0.12, 0.3, 0, 0.15, 0, 0, tall, 14);
cyl(soilMat, 0.145, 0.145, 0.02, 0, 0.29, 0, 0, tall, 14);
const stem = cyl(woodDark, 0.02, 0.025, 0.5, 0, 0.55, 0, 0, tall, 8);
stem.castShadow = true;
const canopy = [[0, 0.95, 0, 0.24], [0.14, 0.8, 0.06, 0.16], [-0.12, 0.82, -0.08, 0.15], [0.02, 1.1, -0.03, 0.14]];
const blobGeo2 = new THREE.IcosahedronGeometry(1, 1);
canopy.forEach((o, i) => {
  const b = new THREE.Mesh(blobGeo2, greens[i % 3]);
  b.position.set(o[0], o[1], o[2]);
  b.scale.setScalar(o[3]);
  b.castShadow = true;
  tall.add(b);
});
pot(G, 0.7, 1.2, y0, 1.1, 1);

/* ---------------------------------- resize + loop ---------------------------------- */

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
