<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Bus Shelter</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #c9d4dc; }
    canvas { display: block; }
    #label {
      position: fixed;
      left: 18px;
      bottom: 16px;
      color: rgba(25, 33, 38, 0.68);
      font: 500 11px/1.4 system-ui, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="label">City shelter · drag to orbit</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcbd6dc);
    scene.fog = new THREE.Fog(0xcbd6dc, 14, 30);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 80);
    camera.position.set(6.7, 4.3, 7.4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.35, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.42;
    controls.minDistance = 4.5;
    controls.maxDistance = 14;
    controls.maxPolarAngle = Math.PI * 0.48;

    const maxAniso = renderer.capabilities.getMaxAnisotropy();

    const metal = new THREE.MeshStandardMaterial({
      color: 0x263137,
      metalness: 0.78,
      roughness: 0.28
    });

    const darkMetal = new THREE.MeshStandardMaterial({
      color: 0x11191d,
      metalness: 0.82,
      roughness: 0.25
    });

    const roofMaterial = new THREE.MeshStandardMaterial({
      color: 0x85959b,
      metalness: 0.72,
      roughness: 0.34
    });

    const wood = new THREE.MeshStandardMaterial({
      color: 0x9b5d31,
      roughness: 0.5,
      metalness: 0.02
    });

    const woodEdge = new THREE.MeshStandardMaterial({
      color: 0x6a371e,
      roughness: 0.56
    });

    const concrete = new THREE.MeshStandardMaterial({
      color: 0xaaa9a2,
      roughness: 0.91
    });

    const pavement = new THREE.MeshStandardMaterial({
      color: 0x7e8586,
      roughness: 0.96
    });

    const roadMaterial = new THREE.MeshStandardMaterial({
      color: 0x3e4547,
      roughness: 0.98
    });

    const glass = new THREE.MeshPhysicalMaterial({
      color: 0xb9deea,
      roughness: 0.08,
      metalness: 0,
      transparent: true,
      opacity: 0.27,
      transmission: 0.18,
      thickness: 0.018,
      ior: 1.45,
      depthWrite: false,
      side: THREE.DoubleSide
    });

    function box(name, size, position, material, cast = true, receive = true) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), material);
      mesh.name = name;
      mesh.position.set(...position);
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      scene.add(mesh);
      return mesh;
    }

    function cylinder(name, radius, depth, position, material, rotation = [0, 0, 0], segments = 20) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, depth, segments),
        material
      );
      mesh.name = name;
      mesh.position.set(...position);
      mesh.rotation.set(...rotation);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function roundedRectTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 768;
      const ctx = canvas.getContext('2d');

      const gradient = ctx.createLinearGradient(0, 0, 512, 768);
      gradient.addColorStop(0, '#ef7e45');
      gradient.addColorStop(0.48, '#dd4362');
      gradient.addColorStop(1, '#624fc0');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 512, 768);

      ctx.globalAlpha = 0.18;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(438, 112, 175, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(94, 650, 220, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.fillStyle = '#fff8ed';
      ctx.font = '700 70px Arial, sans-serif';
      ctx.fillText('MOVE', 48, 170);
      ctx.fillText('WITH', 48, 246);
      ctx.fillText('THE CITY', 48, 322);

      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.font = '400 26px Arial, sans-serif';
      ctx.fillText('Every stop is a beginning.', 51, 378);

      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(54, 427);
      ctx.lineTo(455, 427);
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(256, 566, 91, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#dd4968';
      ctx.beginPath();
      ctx.moveTo(227, 511);
      ctx.lineTo(227, 621);
      ctx.lineTo(319, 566);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = '600 18px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('CITY TRANSIT · 2026', 256, 712);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = maxAniso;
      return texture;
    }

    function timetableTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 384;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#f1f0e9';
      ctx.fillRect(0, 0, 256, 384);
      ctx.fillStyle = '#1d6578';
      ctx.fillRect(0, 0, 256, 65);
      ctx.fillStyle = '#fff';
      ctx.font = '700 31px Arial';
      ctx.fillText('ROUTE 24', 19, 43);
      ctx.fillStyle = '#25373d';
      ctx.font = '700 18px Arial';
      ctx.fillText('CENTRAL STATION', 18, 99);
      ctx.font = '14px Arial';
      const rows = [
        ['06:12', '06:27', '06:42'],
        ['07:02', '07:17', '07:32'],
        ['08:02', '08:17', '08:32'],
        ['09:02', '09:22', '09:42'],
        ['10:02', '10:22', '10:42'],
        ['11:02', '11:22', '11:42']
      ];
      rows.forEach((row, i) => {
        const y = 137 + i * 37;
        ctx.strokeStyle = '#bdc5c5';
        ctx.beginPath();
        ctx.moveTo(18, y + 13);
        ctx.lineTo(238, y + 13);
        ctx.stroke();
        ctx.fillStyle = '#34484e';
        ctx.fillText(row[0], 20, y);
        ctx.fillText(row[1], 99, y);
        ctx.fillText(row[2], 178, y);
      });
      ctx.fillStyle = '#d34d43';
      ctx.beginPath();
      ctx.arc(35, 348, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#526267';
      ctx.font = '12px Arial';
      ctx.fillText('LIVE TIMES AVAILABLE', 56, 353);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = maxAniso;
      return texture;
    }

    // Ground, road and curb
    box('pavement', [16, 0.18, 8], [0, -0.09, 0.95], pavement, false, true);
    box('road', [16, 0.12, 8], [0, -0.19, -6.5], roadMaterial, false, true);
    box('curb-face', [16, 0.25, 0.28], [0, -0.07, -2.92], concrete, false, true);
    box('curb-top', [16, 0.1, 0.42], [0, 0.04, -2.82], concrete, false, true);

    // Concrete shelter footing
    box('shelter-pad', [5.9, 0.10, 2.35], [0, 0.04, 0], concrete, false, true);

    // Main posts and roof support rails
    const postX = [-2.45, 2.45];
    const postZ = [-0.73, 0.73];
    for (const x of postX) {
      for (const z of postZ) {
        box('slim-post', [0.105, 2.55, 0.105], [x, 1.30, z], metal);
        box('post-foot', [0.22, 0.045, 0.22], [x, 0.095, z], darkMetal);
      }
    }
    box('back-top-rail', [5.0, 0.10, 0.10], [0, 2.38, 0.73], metal);
    box('front-top-rail', [5.0, 0.10, 0.10], [0, 2.38, -0.73], metal);

    // Slightly arched, extruded canopy
    const roofWidth = 5.45;
    const roofDepth = 2.02;
    const roofHalf = roofWidth / 2;
    const roofShape = new THREE.Shape();
    const topPoints = [];
    const bottomPoints = [];
    const segments = 24;
    for (let i = 0; i <= segments; i++) {
      const x = -roofHalf + roofWidth * i / segments;
      const arch = 0.12 * (1 - Math.pow(x / roofHalf, 2));
      topPoints.push(new THREE.Vector2(x, arch));
      bottomPoints.push(new THREE.Vector2(x, arch - 0.095));
    }
    roofShape.moveTo(topPoints[0].x, topPoints[0].y);
    for (let i = 1; i < topPoints.length; i++) roofShape.lineTo(topPoints[i].x, topPoints[i].y);
    for (let i = bottomPoints.length - 1; i >= 0; i--) roofShape.lineTo(bottomPoints[i].x, bottomPoints[i].y);
    roofShape.closePath();

    const roofGeometry = new THREE.ExtrudeGeometry(roofShape, {
      depth: roofDepth,
      bevelEnabled: false,
      curveSegments: 16
    });
    roofGeometry.translate(0, 2.62, -roofDepth / 2);
    roofGeometry.computeVertexNormals();
    const roof = new THREE.Mesh(roofGeometry, roofMaterial);
    roof.castShadow = true;
    roof.receiveShadow = true;
    scene.add(roof);

    // Front gutter and downspout
    cylinder(
      'front-gutter',
      0.075,
      5.42,
      [0, 2.57, -1.02],
      darkMetal,
      [0, 0, Math.PI / 2],
      24
    );
    cylinder('downspout', 0.038, 2.28, [-2.66, 1.39, -0.99], darkMetal, [0, 0, 0], 16);
    cylinder(
      'gutter-elbow',
      0.038,
      0.28,
      [-2.53, 2.52, -1.00],
      darkMetal,
      [0, 0, Math.PI / 2],
      16
    );

    // Back glass panels and separators
    for (const x of [-1.22, 0, 1.22]) {
      const panel = box('back-glass', [1.16, 2.08, 0.018], [x, 1.29, 0.72], glass, false, true);
      panel.renderOrder = 1;
    }
    for (const x of [-1.82, -0.61, 0.61, 1.82]) {
      box('back-mullion', [0.055, 2.16, 0.075], [x, 1.30, 0.72], metal);
    }
    box('back-bottom-rail', [4.92, 0.075, 0.075], [0, 0.21, 0.72], metal);

    // Left glass end panel
    const sideGlass = box('side-glass', [0.018, 2.08, 1.34], [-2.44, 1.29, 0], glass, false, true);
    sideGlass.renderOrder = 1;
    box('side-lower-rail', [0.075, 0.075, 1.42], [-2.44, 0.21, 0], metal);
    box('side-mid-marker', [0.024, 0.055, 1.25], [-2.46, 1.18, 0], new THREE.MeshStandardMaterial({
      color: 0xe7edf0,
      transparent: true,
      opacity: 0.7
    }), false, false);

    // Wooden slatted bench
    const slatPositions = [-0.29, -0.12, 0.05, 0.22];
    for (const z of slatPositions) {
      const slat = box('seat-slat', [3.58, 0.09, 0.13], [-0.25, 0.67, z], wood);
      slat.geometry.translate(0, 0, 0);
    }
    for (let i = 0; i < 4; i++) {
      const y = 0.91 + i * 0.16;
      box('backrest-slat', [3.58, 0.12, 0.075], [-0.25, y, 0.48], wood);
    }
    for (const x of [-1.55, 1.05]) {
      box('bench-leg', [0.10, 0.59, 0.10], [x, 0.38, 0.11], darkMetal);
      box('bench-foot', [0.31, 0.055, 0.30], [x, 0.10, 0.11], darkMetal);
      box('seat-bracket', [0.10, 0.08, 0.65], [x, 0.60, 0.10], darkMetal);
      const backSupport = box('back-support', [0.10, 0.74, 0.08], [x, 1.00, 0.50], darkMetal);
      backSupport.rotation.x = -0.08;
    }
    box('bench-front-edge', [3.64, 0.10, 0.055], [-0.25, 0.64, -0.38], woodEdge);

    // Advertising display mounted on right end
    box('ad-casing', [0.16, 2.07, 1.53], [2.52, 1.35, 0], darkMetal);
    box('ad-inner', [0.175, 1.84, 1.29], [2.615, 1.37, 0], new THREE.MeshStandardMaterial({
      color: 0xe6e2d7,
      metalness: 0.15,
      roughness: 0.34
    }));

    const adMaterial = new THREE.MeshStandardMaterial({
      map: roundedRectTexture(),
      emissive: 0xffffff,
      emissiveMap: roundedRectTexture(),
      emissiveIntensity: 0.12,
      roughness: 0.42
    });
    const ad = new THREE.Mesh(new THREE.PlaneGeometry(1.22, 1.76), adMaterial);
    ad.position.set(2.71, 1.37, 0);
    ad.rotation.y = Math.PI / 2;
    ad.castShadow = false;
    scene.add(ad);

    // Timetable panel on rear glass
    box('schedule-frame', [0.72, 1.08, 0.045], [1.63, 1.43, 0.675], darkMetal);
    const schedule = new THREE.Mesh(
      new THREE.PlaneGeometry(0.63, 0.94),
      new THREE.MeshStandardMaterial({
        map: timetableTexture(),
        roughness: 0.58
      })
    );
    schedule.position.set(1.63, 1.43, 0.648);
    schedule.rotation.y = Math.PI;
    scene.add(schedule);

    // Small shelter identifier
    const signCanvas = document.createElement('canvas');
    signCanvas.width = 512;
    signCanvas.height = 128;
    const signCtx = signCanvas.getContext('2d');
    signCtx.fillStyle = '#1a667b';
    signCtx.fillRect(0, 0, 512, 128);
    signCtx.fillStyle = '#ffffff';
    signCtx.font = '700 48px Arial';
    signCtx.textAlign = 'center';
    signCtx.textBaseline = 'middle';
    signCtx.fillText('MARKET STREET', 256, 64);
    const signTexture = new THREE.CanvasTexture(signCanvas);
    signTexture.colorSpace = THREE.SRGBColorSpace;
    signTexture.anisotropy = maxAniso;
    const stopSign = new THREE.Mesh(
      new THREE.PlaneGeometry(1.55, 0.38),
      new THREE.MeshStandardMaterial({ map: signTexture, roughness: 0.45 })
    );
    stopSign.position.set(-1.28, 2.30, -0.792);
    scene.add(stopSign);

    // Bus stop pole and roundel
    cylinder('stop-pole', 0.047, 2.65, [-3.24, 1.36, -0.8], darkMetal, [0, 0, 0], 18);
    box('stop-pole-foot', [0.25, 0.055, 0.25], [-3.24, 0.10, -0.8], darkMetal);
    const roundel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.27, 0.27, 0.07, 32),
      new THREE.MeshStandardMaterial({ color: 0x1d7c91, metalness: 0.35, roughness: 0.35 })
    );
    roundel.rotation.z = Math.PI / 2;
    roundel.position.set(-3.24, 2.48, -0.8);
    roundel.castShadow = true;
    scene.add(roundel);

    const roundelInset = new THREE.Mesh(
      new THREE.CylinderGeometry(0.17, 0.17, 0.075, 32),
      new THREE.MeshStandardMaterial({ color: 0xf1eee6, roughness: 0.5 })
    );
    roundelInset.rotation.z = Math.PI / 2;
    roundelInset.position.set(-3.285, 2.48, -0.8);
    scene.add(roundelInset);

    // Pavement scoring and tactile strip
    const lineMaterial = new THREE.MeshStandardMaterial({ color: 0x686f70, roughness: 1 });
    for (let x = -7; x <= 7; x += 1.5) {
      box('paving-joint', [0.018, 0.006, 5.4], [x, 0.006, 0.25], lineMaterial, false, true);
    }
    for (let z = -2.2; z <= 3.1; z += 1.35) {
      box('paving-joint', [14, 0.006, 0.018], [0, 0.007, z], lineMaterial, false, true);
    }

    const tactileMaterial = new THREE.MeshStandardMaterial({
      color: 0xd0ad4e,
      roughness: 0.84
    });
    box('tactile-strip', [6.8, 0.025, 0.48], [0, 0.08, -2.45], tactileMaterial, false, true);
    for (let x = -3.2; x <= 3.2; x += 0.22) {
      for (const z of [-2.56, -2.40, -2.32]) {
        const stud = new THREE.Mesh(
          new THREE.CylinderGeometry(0.035, 0.045, 0.018, 12),
          tactileMaterial
        );
        stud.position.set(x, 0.105, z);
        stud.receiveShadow = true;
        scene.add(stud);
      }
    }

    // Lighting
    const hemisphere = new THREE.HemisphereLight(0xe8f4fb, 0x596065, 2.15);
    scene.add(hemisphere);

    const sun = new THREE.DirectionalLight(0xfff2dc, 3.25);
    sun.position.set(-4.5, 8, 5.5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -8;
    sun.shadow.camera.right = 8;
    sun.shadow.camera.top = 7;
    sun.shadow.camera.bottom = -5;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 25;
    sun.shadow.bias = -0.00025;
    sun.shadow.normalBias = 0.025;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x9bc8df, 0.85);
    fill.position.set(5, 3, -5);
    scene.add(fill);

    // Warm integrated canopy lights
    for (const x of [-1.55, 0, 1.55]) {
      const lamp = new THREE.Mesh(
        new THREE.CylinderGeometry(0.10, 0.10, 0.025, 24),
        new THREE.MeshStandardMaterial({
          color: 0xfff1c6,
          emissive: 0xffd47b,
          emissiveIntensity: 2.2,
          roughness: 0.28
        })
      );
      lamp.position.set(x, 2.54, 0.05);
      scene.add(lamp);

      const light = new THREE.PointLight(0xffd99a, 0.42, 2.8, 2);
      light.position.set(x, 2.46, 0.05);
      scene.add(light);
    }

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
