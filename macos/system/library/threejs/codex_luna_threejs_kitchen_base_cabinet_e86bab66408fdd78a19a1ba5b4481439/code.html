<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contemporary Kitchen Base Cabinet</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d8d0c4;
    }
    body {
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9d2c7);
scene.fog = new THREE.Fog(0xd9d2c7, 11, 22);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(6.4, 4.6, 7.4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.15;
controls.target.set(0, 1.55, 0);
controls.minDistance = 5.2;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minPolarAngle = Math.PI * 0.23;

const cabinetWidth = 5.2;
const cabinetDepth = 2.18;
const bodyHeight = 2.85;
const plinthHeight = 0.38;
const countertopHeight = 0.28;
const frontZ = cabinetDepth * 0.5 + 0.035;

const wood = new THREE.MeshStandardMaterial({
  color: 0xeee9df,
  roughness: 0.62,
  metalness: 0.02
});
const woodEdge = new THREE.MeshStandardMaterial({
  color: 0xd8d0c4,
  roughness: 0.68,
  metalness: 0.01
});
const frontMaterial = new THREE.MeshStandardMaterial({
  color: 0xf3f0ea,
  roughness: 0.48,
  metalness: 0.02
});
const shadowGap = new THREE.MeshStandardMaterial({
  color: 0x24272a,
  roughness: 0.86,
  metalness: 0
});
const countertopMaterial = new THREE.MeshStandardMaterial({
  color: 0x45494b,
  roughness: 0.3,
  metalness: 0.12
});
const countertopEdgeMaterial = new THREE.MeshStandardMaterial({
  color: 0x303336,
  roughness: 0.34,
  metalness: 0.1
});
const handleMaterial = new THREE.MeshStandardMaterial({
  color: 0x17191a,
  roughness: 0.22,
  metalness: 0.78
});
const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xa99f91,
  roughness: 0.9,
  metalness: 0
});
const wallMaterial = new THREE.MeshStandardMaterial({
  color: 0xd9d2c7,
  roughness: 0.94,
  metalness: 0
});

function makeBox(name, sizeX, sizeY, sizeZ, position, material, cast = true, receive = true) {
  const geometry = new THREE.BoxGeometry(sizeX, sizeY, sizeZ);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.set(position.x, position.y, position.z);
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  scene.add(mesh);
  return mesh;
}

function addVerticalHandle(x, y, z, height) {
  const barGeometry = new THREE.CylinderGeometry(0.034, 0.034, height, 20);
  const bar = new THREE.Mesh(barGeometry, handleMaterial);
  bar.position.set(x, y, z + 0.105);
  bar.castShadow = true;
  scene.add(bar);

  const mountGeometry = new THREE.CylinderGeometry(0.062, 0.062, 0.115, 20);
  for (const offset of [-height * 0.37, height * 0.37]) {
    const mount = new THREE.Mesh(mountGeometry, handleMaterial);
    mount.rotation.x = Math.PI * 0.5;
    mount.position.set(x, y + offset, z + 0.055);
    mount.castShadow = true;
    scene.add(mount);
  }
}

function addHorizontalHandle(x, y, z, width) {
  const barGeometry = new THREE.CylinderGeometry(0.034, 0.034, width, 20);
  const bar = new THREE.Mesh(barGeometry, handleMaterial);
  bar.rotation.z = Math.PI * 0.5;
  bar.position.set(x, y, z + 0.108);
  bar.castShadow = true;
  scene.add(bar);

  const mountGeometry = new THREE.CylinderGeometry(0.062, 0.062, 0.115, 20);
  for (const offset of [-width * 0.37, width * 0.37]) {
    const mount = new THREE.Mesh(mountGeometry, handleMaterial);
    mount.rotation.x = Math.PI * 0.5;
    mount.position.set(x + offset, y, z + 0.055);
    mount.castShadow = true;
    scene.add(mount);
  }
}

const cabinet = new THREE.Group();
scene.add(cabinet);

const lowerBodyHeight = bodyHeight - plinthHeight - countertopHeight;
const bodyCenterY = plinthHeight + lowerBodyHeight * 0.5;

makeBox(
  'left side panel',
  0.16,
  lowerBodyHeight,
  cabinetDepth,
  { x: -cabinetWidth * 0.5 + 0.08, y: bodyCenterY, z: 0 },
  wood
);
makeBox(
  'right side panel',
  0.16,
  lowerBodyHeight,
  cabinetDepth,
  { x: cabinetWidth * 0.5 - 0.08, y: bodyCenterY, z: 0 },
  wood
);
makeBox(
  'cabinet top rail',
  cabinetWidth - 0.28,
  0.12,
  cabinetDepth,
  { x: 0, y: bodyHeight - countertopHeight - 0.06, z: 0 },
  wood
);
makeBox(
  'cabinet bottom',
  cabinetWidth - 0.28,
  0.12,
  cabinetDepth,
  { x: 0, y: plinthHeight + 0.06, z: 0 },
  woodEdge
);
makeBox(
  'rear panel',
  cabinetWidth - 0.28,
  lowerBodyHeight - 0.18,
  0.08,
  { x: 0, y: bodyCenterY, z: -cabinetDepth * 0.5 + 0.07 },
  woodEdge
);

const centerDividerY = plinthHeight + 0.92;
makeBox(
  'center divider',
  0.11,
  lowerBodyHeight - 0.25,
  cabinetDepth - 0.1,
  { x: 0, y: centerDividerY + 0.42, z: 0 },
  woodEdge
);

makeBox(
  'drawer shadow reveal',
  cabinetWidth - 0.38,
  0.07,
  0.055,
  { x: 0, y: 2.13, z: frontZ + 0.006 },
  shadowGap,
  false,
  false
);

const doorWidth = (cabinetWidth - 0.42) * 0.5;
const doorHeight = 1.48;
const doorY = plinthHeight + 0.88;
const leftDoorX = -(doorWidth * 0.5 + 0.105);
const rightDoorX = doorWidth * 0.5 + 0.105;

makeBox(
  'left lower door',
  doorWidth,
  doorHeight,
  0.105,
  { x: leftDoorX, y: doorY, z: frontZ },
  frontMaterial
);
makeBox(
  'right lower door',
  doorWidth,
  doorHeight,
  0.105,
  { x: rightDoorX, y: doorY, z: frontZ },
  frontMaterial
);

const doorTrimMaterial = new THREE.MeshStandardMaterial({
  color: 0xded8cf,
  roughness: 0.56,
  metalness: 0.01
});

for (const x of [leftDoorX, rightDoorX]) {
  makeBox('door upper edge', doorWidth - 0.08, 0.025, 0.014, { x, y: doorY + doorHeight * 0.5 - 0.055, z: frontZ + 0.059 }, doorTrimMaterial, false, false);
  makeBox('door lower edge', doorWidth - 0.08, 0.025, 0.014, { x, y: doorY - doorHeight * 0.5 + 0.055, z: frontZ + 0.059 }, doorTrimMaterial, false, false);
  makeBox('door left edge', 0.025, doorHeight - 0.08, 0.014, { x: x - doorWidth * 0.5 + 0.055, y: doorY, z: frontZ + 0.059 }, doorTrimMaterial, false, false);
  makeBox('door right edge', 0.025, doorHeight - 0.08, 0.014, { x: x + doorWidth * 0.5 - 0.055, y: doorY, z: frontZ + 0.059 }, doorTrimMaterial, false, false);
}

const drawerWidth = cabinetWidth - 0.42;
const drawerHeight = 0.56;
const drawerY = 2.43;

makeBox(
  'drawer front',
  drawerWidth,
  drawerHeight,
  0.12,
  { x: 0, y: drawerY, z: frontZ + 0.005 },
  frontMaterial
);
makeBox(
  'drawer upper reveal',
  drawerWidth - 0.08,
  0.022,
  0.016,
  { x: 0, y: drawerY + drawerHeight * 0.5 - 0.055, z: frontZ + 0.07 },
  doorTrimMaterial,
  false,
  false
);
makeBox(
  'drawer lower reveal',
  drawerWidth - 0.08,
  0.022,
  0.016,
  { x: 0, y: drawerY - drawerHeight * 0.5 + 0.055, z: frontZ + 0.07 },
  doorTrimMaterial,
  false,
  false
);

addVerticalHandle(leftDoorX + doorWidth * 0.5 - 0.22, doorY, frontZ, 0.62);
addVerticalHandle(rightDoorX - doorWidth * 0.5 + 0.22, doorY, frontZ, 0.62);
addHorizontalHandle(0, drawerY, frontZ, 1.12);

makeBox(
  'toe kick',
  cabinetWidth - 0.16,
  plinthHeight,
  0.16,
  { x: 0, y: plinthHeight * 0.5, z: cabinetDepth * 0.5 - 0.05 },
  shadowGap
);
makeBox(
  'toe kick top shadow',
  cabinetWidth - 0.16,
  0.045,
  0.07,
  { x: 0, y: plinthHeight + 0.025, z: cabinetDepth * 0.5 + 0.01 },
  shadowGap,
  false,
  false
);

makeBox(
  'countertop',
  cabinetWidth + 0.16,
  countertopHeight,
  cabinetDepth + 0.18,
  { x: 0, y: bodyHeight + countertopHeight * 0.5, z: 0 },
  countertopMaterial
);
makeBox(
  'countertop front edge',
  cabinetWidth + 0.16,
  0.095,
  0.045,
  { x: 0, y: bodyHeight + 0.035, z: cabinetDepth * 0.5 + 0.095 },
  countertopEdgeMaterial,
  true,
  false
);
makeBox(
  'countertop rear edge',
  cabinetWidth + 0.16,
  0.06,
  0.04,
  { x: 0, y: bodyHeight + 0.045, z: -cabinetDepth * 0.5 - 0.095 },
  countertopEdgeMaterial,
  true,
  false
);

makeBox(
  'floor',
  24,
  0.12,
  24,
  { x: 0, y: -0.06, z: 0 },
  floorMaterial,
  false,
  true
);
makeBox(
  'back wall',
  24,
  12,
  0.12,
  { x: 0, y: 5.8, z: -3.8 },
  wallMaterial,
  false,
  true
);

const wallTrimMaterial = new THREE.MeshStandardMaterial({
  color: 0xc6bcae,
  roughness: 0.84,
  metalness: 0
});
makeBox(
  'wall-floor trim',
  24,
  0.12,
  0.12,
  { x: 0, y: 0.06, z: -3.69 },
  wallTrimMaterial,
  false,
  true
);

const ceilingLight = new THREE.HemisphereLight(0xf4eee3, 0x746a5d, 2.1);
scene.add(ceilingLight);

const keyLight = new THREE.DirectionalLight(0xfff4df, 4.2);
keyLight.position.set(-4.5, 8.5, 5.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 2048;
keyLight.shadow.mapSize.height = 2048;
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 24;
keyLight.shadow.bias = -0.00035;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xcbdcff, 1.25);
fillLight.position.set(6, 4, -4);
scene.add(fillLight);

const frontLight = new THREE.PointLight(0xffd8ae, 18, 8, 2);
frontLight.position.set(0, 4.7, 4.3);
scene.add(frontLight);

const cabinetGlow = new THREE.PointLight(0xffc98e, 4, 3.5, 2);
cabinetGlow.position.set(0, 2.8, 1.3);
scene.add(cabinetGlow);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  frontLight.intensity = 17.5 + Math.sin(elapsed * 0.7) * 0.35;
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
