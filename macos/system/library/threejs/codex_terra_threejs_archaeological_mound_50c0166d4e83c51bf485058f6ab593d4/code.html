<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archaeological Mound</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #aeb8bd; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xaebbc0);
scene.fog = new THREE.Fog(0xaebbc0, 42, 105);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 220);
camera.position.set(24, 16, 25);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.32;
controls.minDistance = 13;
controls.maxDistance = 58;
controls.maxPolarAngle = Math.PI * 0.475;

const hemi = new THREE.HemisphereLight(0xdce6e7, 0x6b5038, 2.0);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff3d2, 3.1);
sun.position.set(-20, 27, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -35;
sun.shadow.camera.right = 35;
sun.shadow.camera.top = 35;
sun.shadow.camera.bottom = -35;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 80;
sun.shadow.bias = -0.00012;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xb5c9d4, 0.65);
fill.position.set(19, 12, -22);
scene.add(fill);

const groundSize = 82;
const groundGeometry = new THREE.PlaneGeometry(groundSize, groundSize, 80, 80);
groundGeometry.rotateX(-Math.PI / 2);
const groundPositions = groundGeometry.attributes.position;
for (let i = 0; i < groundPositions.count; i++) {
  const x = groundPositions.getX(i);
  const z = groundPositions.getZ(i);
  const distantVariation =
    Math.sin(x * 0.55 + z * 0.17) * 0.025 +
    Math.sin(z * 0.71 - x * 0.09) * 0.018;
  const r = Math.hypot(x, z);
  groundPositions.setY(i, distantVariation - Math.max(0, 1 - r / 18) * 0.018);
}
groundGeometry.computeVertexNormals();

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x7b765c,
  roughness: 0.98,
  metalness: 0
});
const ground = new THREE.Mesh(groundGeometry, groundMaterial);
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(80, 40, 0x686b61, 0x85806a);
grid.position.y = 0.012;
const gridMaterials = Array.isArray(grid.material) ? grid.material : [grid.material];
for (const material of gridMaterials) {
  material.transparent = true;
  material.opacity = 0.26;
}
scene.add(grid);

function moundHeight(x, z) {
  const sx = x / 12.8;
  const sz = z / 10.4;
  const r2 = sx * sx + sz * sz;
  const core = Math.max(0, 1 - r2);
  const softened = Math.pow(core, 1.55);
  const undulation =
    Math.sin(x * 0.52 + z * 0.16) * 0.08 +
    Math.sin(z * 0.74 - x * 0.11) * 0.05 +
    Math.sin((x + z) * 1.33) * 0.025;
  const rim = Math.exp(-Math.pow(Math.sqrt(r2) - 0.77, 2) / 0.035) * 0.13;
  return Math.max(0, softened * 5.25 + softened * undulation + rim);
}

const moundGeometry = new THREE.PlaneGeometry(29, 25, 118, 102);
moundGeometry.rotateX(-Math.PI / 2);
const moundPosition = moundGeometry.attributes.position;
const moundColor = new THREE.Color();
const moundColors = new Float32Array(moundPosition.count * 3);

for (let i = 0; i < moundPosition.count; i++) {
  const x = moundPosition.getX(i);
  const z = moundPosition.getZ(i);
  const y = moundHeight(x, z);
  moundPosition.setY(i, y);

  const normalized = Math.min(1, y / 5.3);
  const variation = 0.06 * Math.sin(x * 1.7 + z * 0.82) + 0.035 * Math.sin(z * 3.5);
  moundColor.setHSL(0.093 + variation * 0.15, 0.24 + normalized * 0.03, 0.285 + normalized * 0.09 + variation);
  moundColors[i * 3] = moundColor.r;
  moundColors[i * 3 + 1] = moundColor.g;
  moundColors[i * 3 + 2] = moundColor.b;
}
moundGeometry.setAttribute('color', new THREE.BufferAttribute(moundColors, 3));
moundGeometry.computeVertexNormals();

const moundMaterial = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.96,
  metalness: 0
});
const mound = new THREE.Mesh(moundGeometry, moundMaterial);
mound.castShadow = true;
mound.receiveShadow = true;
scene.add(mound);

function createPath(points, width, color) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal', 0.45);
  const pathGeometry = new THREE.TubeGeometry(curve, 80, width, 9, false);
  const pathMaterial = new THREE.MeshStandardMaterial({
    color,
    roughness: 1,
    metalness: 0
  });
  const path = new THREE.Mesh(pathGeometry, pathMaterial);
  path.castShadow = false;
  path.receiveShadow = true;
  scene.add(path);

  const edgeMaterial = new THREE.MeshStandardMaterial({
    color: 0x765b3f,
    roughness: 1
  });
  for (const side of [-1, 1]) {
    const offsetPoints = [];
    for (let i = 0; i < 42; i++) {
      const t = i / 41;
      const p = curve.getPoint(t);
      const tangent = curve.getTangent(t).normalize();
      const nx = -tangent.z * side;
      const nz = tangent.x * side;
      offsetPoints.push(new THREE.Vector3(
        p.x + nx * width * 1.05,
        p.y - 0.02,
        p.z + nz * width * 1.05
      ));
    }
    const edgeCurve = new THREE.CatmullRomCurve3(offsetPoints);
    const edge = new THREE.Mesh(new THREE.TubeGeometry(edgeCurve, 50, 0.026, 6, false), edgeMaterial);
    edge.receiveShadow = true;
    scene.add(edge);
  }
}

createPath([
  new THREE.Vector3(-10.8, 0.11, 6.1),
  new THREE.Vector3(-7.1, moundHeight(-7.1, 4.3) + 0.11, 4.3),
  new THREE.Vector3(-4.4, moundHeight(-4.4, 1.9) + 0.11, 1.9),
  new THREE.Vector3(-1.7, moundHeight(-1.7, 0.2) + 0.11, 0.2),
  new THREE.Vector3(0.4, moundHeight(0.4, -0.45) + 0.11, -0.45)
], 0.56, 0x9a7951);

createPath([
  new THREE.Vector3(9.8, 0.1, -6.7),
  new THREE.Vector3(6.8, moundHeight(6.8, -4.6) + 0.1, -4.6),
  new THREE.Vector3(4.6, moundHeight(4.6, -2.1) + 0.1, -2.1),
  new THREE.Vector3(2.35, moundHeight(2.35, -0.55) + 0.1, -0.55),
  new THREE.Vector3(1.0, moundHeight(1.0, 0.25) + 0.1, 0.25)
], 0.43, 0x94734d);

const stoneMaterial = new THREE.MeshStandardMaterial({ color: 0x605b4f, roughness: 0.9 });
const capMaterial = new THREE.MeshStandardMaterial({ color: 0x797061, roughness: 0.84 });
const woodMaterial = new THREE.MeshStandardMaterial({ color: 0x493728, roughness: 0.92 });

function addMarker(x, z, height, rotation) {
  const y = moundHeight(x, z);
  const group = new THREE.Group();
  group.position.set(x, y, z);
  group.rotation.y = rotation;

  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.33, 0.43, 0.28, 7), stoneMaterial);
  base.position.y = 0.14;
  base.rotation.y = rotation * 0.7;
  base.castShadow = true;
  base.receiveShadow = true;
  group.add(base);

  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.13, height, 7), woodMaterial);
  post.position.y = 0.28 + height * 0.5;
  post.rotation.z = 0.025;
  post.castShadow = true;
  post.receiveShadow = true;
  group.add(post);

  const cap = new THREE.Mesh(new THREE.ConeGeometry(0.19, 0.32, 4), capMaterial);
  cap.position.y = 0.28 + height + 0.15;
  cap.rotation.y = Math.PI * 0.25;
  cap.castShadow = true;
  cap.receiveShadow = true;
  group.add(cap);

  scene.add(group);
}

addMarker(-1.45, -0.7, 1.5, 0.2);
addMarker(1.35, 0.65, 1.18, -0.4);
addMarker(0.35, 2.05, 0.9, 0.75);

const scatterMaterial = new THREE.MeshStandardMaterial({ color: 0x706751, roughness: 1 });
const stoneGeometry = new THREE.DodecahedronGeometry(0.16, 0);
for (let i = 0; i < 55; i++) {
  const angle = i * 2.39996323;
  const radius = 6.5 + ((i * 37) % 100) / 100 * 11;
  const x = Math.cos(angle) * radius;
  const z = Math.sin(angle) * radius;
  const r = Math.hypot(x / 12.8, z / 10.4);
  if (r > 0.8 && r < 1.65) {
    const rock = new THREE.Mesh(stoneGeometry, scatterMaterial);
    const scale = 0.45 + ((i * 19) % 100) / 170;
    rock.scale.set(scale * 1.35, scale * 0.55, scale);
    rock.position.set(x, moundHeight(x, z) + scale * 0.07, z);
    rock.rotation.set(i * 0.61, i * 1.37, i * 0.23);
    rock.castShadow = true;
    rock.receiveShadow = true;
    scene.add(rock);
  }
}

const horizon = new THREE.Mesh(
  new THREE.CylinderGeometry(52, 52, 0.1, 96),
  new THREE.MeshStandardMaterial({ color: 0x7b806c, roughness: 1 })
);
horizon.position.y = -0.1;
horizon.receiveShadow = true;
scene.add(horizon);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
