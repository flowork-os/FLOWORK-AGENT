<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Papercraft King Crab</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #14161a; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: rgba(255,255,255,0.42); letter-spacing: 0.04em; pointer-events: none;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="hint">Papercraft King Crab &mdash; drag to orbit &middot; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   Renderer / Scene / Camera
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171b);
scene.fog = new THREE.Fog(0x15171b, 22, 60);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(7.2, 4.6, 8.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.target.set(0, 1.05, 0);
controls.minDistance = 4.5;
controls.maxDistance = 26;
controls.maxPolarAngle = Math.PI * 0.495;

/* ============================================================
   Lighting: hemisphere + key + fill + rim
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xbcd2ff, 0x2a2118, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e2, 2.5);
key.position.set(6.5, 9.5, 5.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 40;
key.shadow.camera.left = -10;
key.shadow.camera.right = 10;
key.shadow.camera.top = 10;
key.shadow.camera.bottom = -10;
key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.022;
key.shadow.radius = 2.4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fc0ff, 0.55);
fill.position.set(-7.0, 4.0, 4.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd7b0, 1.15);
rim.position.set(-3.5, 5.0, -8.0);
scene.add(rim);

const bounce = new THREE.PointLight(0xffb894, 0.5, 24, 2.0);
bounce.position.set(0, -0.6, 2.2);
scene.add(bounce);

/* ============================================================
   Shadow-only ground
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.ShadowMaterial({ opacity: 0.36 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   Deterministic RNG (so speckles are stable per reload)
   ============================================================ */
let _seed = 20260720;
function rnd() {
  _seed = (_seed * 1664525 + 1013904223) % 4294967296;
  return _seed / 4294967296;
}
function rrange(a, b) { return a + (b - a) * rnd(); }

/* ============================================================
   Procedural "cardstock" texture: paper fibre + printed speckles
   ============================================================ */
function makePaperTexture(baseHex, speckleHex, opts) {
  const o = opts || {};
  const size = o.size || 512;
  const speckles = o.speckles === undefined ? 0 : o.speckles;
  const fibre = o.fibre === undefined ? 0.055 : o.fibre;

  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');

  const base = new THREE.Color(baseHex);
  ctx.fillStyle = '#' + base.getHexString();
  ctx.fillRect(0, 0, size, size);

  // subtle paper fibre noise
  const img = ctx.getImageData(0, 0, size, size);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (rnd() - 0.5) * 255 * fibre;
    d[i] = Math.max(0, Math.min(255, d[i] + n));
    d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n));
    d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n));
  }
  ctx.putImageData(img, 0, 0);

  // faint horizontal grain streaks (paper machine direction)
  ctx.globalAlpha = 0.05;
  for (let i = 0; i < 220; i++) {
    const y = rnd() * size;
    ctx.strokeStyle = rnd() > 0.5 ? '#ffffff' : '#000000';
    ctx.lineWidth = rrange(0.4, 1.4);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.bezierCurveTo(size * 0.3, y + rrange(-3, 3), size * 0.7, y + rrange(-3, 3), size, y + rrange(-2, 2));
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // printed speckles (ink dots on the carapace stock)
  const sp = new THREE.Color(speckleHex);
  const spStr = '#' + sp.getHexString();
  for (let i = 0; i < speckles; i++) {
    const x = rnd() * size, y = rnd() * size;
    const r = rrange(1.0, 5.0);
    ctx.globalAlpha = rrange(0.16, 0.6);
    ctx.fillStyle = spStr;
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * rrange(0.6, 1.0), rnd() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
    // occasional pale highlight dot for printed dither look
    if (rnd() > 0.78) {
      ctx.globalAlpha = rrange(0.10, 0.28);
      ctx.fillStyle = '#fff1e2';
      ctx.beginPath();
      ctx.arc(x + rrange(-6, 6), y + rrange(-6, 6), rrange(0.6, 2.0), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* Bump map from a grayscale fibre canvas (shared, cheap) */
function makeFibreBump(size) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#808080';
  ctx.fillRect(0, 0, size, size);
  const img = ctx.getImageData(0, 0, size, size);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = 128 + (rnd() - 0.5) * 78;
    d[i] = d[i + 1] = d[i + 2] = n;
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

const bumpTex = makeFibreBump(256);
bumpTex.repeat.set(3, 3);

/* ============================================================
   Palette + materials
   ============================================================ */
const COL = {
  shell:     0xe8622c,   // coral-orange cardstock
  shellDeep: 0xc94b21,
  speckle:   0x8f2c14,
  limb:      0xf07a3c,
  limbDeep:  0xd4551f,
  cream:     0xf6e2cc,   // pale underside / tab stock
  tab:       0xf2d3b4,   // glue tab stock (slightly lighter)
  crease:    0xa8380f,   // crease / fold line ink
  eyeWhite:  0xf7f2ea,
  eyeInk:    0x201a18
};

const shellTex = makePaperTexture(COL.shell, COL.speckle, { speckles: 900, fibre: 0.05 });
shellTex.repeat.set(1, 1);
const limbTex = makePaperTexture(COL.limb, COL.speckle, { speckles: 260, fibre: 0.05 });
limbTex.repeat.set(2, 2);
const creamTex = makePaperTexture(COL.cream, 0xd9b894, { speckles: 90, fibre: 0.045 });
creamTex.repeat.set(2, 2);
const tabTex = makePaperTexture(COL.tab, 0xd8b48e, { speckles: 40, fibre: 0.05 });

function paperMat(map, color, extra) {
  const m = new THREE.MeshStandardMaterial({
    map: map || null,
    color: color === undefined ? 0xffffff : color,
    roughness: 0.94,
    metalness: 0.0,
    flatShading: true,
    bumpMap: bumpTex,
    bumpScale: 0.012,
    side: THREE.DoubleSide
  });
  if (extra) Object.assign(m, extra);
  return m;
}

const MAT = {
  shell:  paperMat(shellTex, 0xffffff),
  shell2: paperMat(shellTex, 0xd9d0cc, { bumpScale: 0.010 }),
  limb:   paperMat(limbTex, 0xffffff),
  limbDk: paperMat(limbTex, 0xd8cec8),
  cream:  paperMat(creamTex, 0xffffff),
  tab:    paperMat(tabTex, 0xffffff, { roughness: 0.96 }),
  eyeW:   new THREE.MeshStandardMaterial({ color: COL.eyeWhite, roughness: 0.85, metalness: 0.0, flatShading: false }),
  eyeInk: new THREE.MeshStandardMaterial({ color: COL.eyeInk, roughness: 0.6, metalness: 0.0 }),
  stalk:  paperMat(creamTex, 0xffd9bb)
};

const creaseMat = new THREE.LineBasicMaterial({
  color: COL.crease,
  transparent: true,
  opacity: 0.62
});
const creaseMatLight = new THREE.LineBasicMaterial({
  color: 0x7a2b10,
  transparent: true,
  opacity: 0.4
});

/* ============================================================
   Helpers
   ============================================================ */

// Crisp crease lines along every polygon joint of a geometry.
function addCreases(mesh, mat, thresholdDeg) {
  const eg = new THREE.EdgesGeometry(mesh.geometry, thresholdDeg === undefined ? 14 : thresholdDeg);
  const lines = new THREE.LineSegments(eg, mat || creaseMat);
  lines.renderOrder = 2;
  mesh.add(lines);
  return lines;
}

function shellMesh(geo, mat, creaseAngle, creaseMaterial) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  addCreases(m, creaseMaterial, creaseAngle);
  return m;
}

// A little folded paper glue tab: a trapezoid plane with a fold crease.
function makeGlueTab(w, h, taper, mat) {
  const hw = w * 0.5;
  const tw = hw * (taper === undefined ? 0.72 : taper);
  const geo = new THREE.BufferGeometry();
  const verts = new Float32Array([
    -hw, 0, 0,
     hw, 0, 0,
     tw, h, 0,
    -tw, h, 0
  ]);
  const uvs = new Float32Array([0, 0, 1, 0, 1, 1, 0, 1]);
  const idx = [0, 1, 2, 0, 2, 3];
  geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, mat || MAT.tab);
  m.castShadow = true;
  m.receiveShadow = true;

  // outline crease around the tab
  const outline = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-hw, 0, 0), new THREE.Vector3(hw, 0, 0),
    new THREE.Vector3(hw, 0, 0), new THREE.Vector3(tw, h, 0),
    new THREE.Vector3(tw, h, 0), new THREE.Vector3(-tw, h, 0),
    new THREE.Vector3(-tw, h, 0), new THREE.Vector3(-hw, 0, 0)
  ]);
  const ol = new THREE.LineSegments(outline, creaseMatLight);
  m.add(ol);
  return m;
}

// Ring of tabs around a radius (used along carapace rim seams)
function tabRing(parent, radiusFn, count, tabW, tabH, yFn, tiltDeg, mat) {
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + Math.PI / count;
    const r = radiusFn(a);
    const y = yFn(a);
    const g = new THREE.Group();
    g.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
    g.rotation.y = -a + Math.PI / 2;
    const t = makeGlueTab(tabW, tabH, 0.7, mat);
    t.rotation.x = THREE.MathUtils.degToRad(tiltDeg);
    g.add(t);
    parent.add(g);
  }
}

/* Faceted low-poly dome via lathe with angular segments (papercraft look) */
function domeGeometry(profilePts, radialSegs) {
  const geo = new THREE.LatheGeometry(profilePts, radialSegs);
  geo.computeVertexNormals();
  return geo;
}

/* Tapered faceted paper cone segment (a leg/claw section) */
function coneSegGeometry(r1, r2, len, radialSegs) {
  const g = new THREE.CylinderGeometry(r2, r1, len, radialSegs, 1, false);
  g.translate(0, len * 0.5, 0);
  return g;
}

/* ============================================================
   THE CRAB
   ============================================================ */
const crab = new THREE.Group();
crab.position.y = 0.02;
scene.add(crab);

const BODY_Y = 1.32;          // body height above ground
const body = new THREE.Group();
body.position.y = BODY_Y;
crab.add(body);

/* ---------- Domed carapace (faceted, papercraft) ---------- */
const carapaceProfile = [];
{
  const steps = 7;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const r = 1.62 * Math.cos(t * Math.PI * 0.5) ** 0.62;
    const y = 0.72 * Math.sin(t * Math.PI * 0.5) ** 1.05;
    carapaceProfile.push(new THREE.Vector2(Math.max(r, 0.012), y));
  }
}
const carapaceGeo = domeGeometry(carapaceProfile, 13);
// squash slightly along X for a crab-ish oval, and flare the front
carapaceGeo.scale(1.0, 1.0, 0.86);
const carapace = shellMesh(carapaceGeo, MAT.shell, 12);
body.add(carapace);

/* Bottom plate of the carapace (cream underside cardstock) */
const underProfile = [];
{
  const steps = 4;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const r = 1.62 * Math.cos(t * Math.PI * 0.5) ** 0.62;
    underProfile.push(new THREE.Vector2(Math.max(r, 0.012), -0.16 * t * t));
  }
}
const underGeo = domeGeometry(underProfile, 13);
underGeo.scale(1.0, 1.0, 0.86);
const underside = shellMesh(underGeo, MAT.cream, 16, creaseMatLight);
body.add(underside);

/* Rim band that hides the seam + reads as a folded skirt */
const rimGeo = new THREE.CylinderGeometry(1.615, 1.55, 0.17, 13, 1, true);
rimGeo.scale(1.0, 1.0, 0.86);
const rimBand = shellMesh(rimGeo, MAT.shell2, 12);
rimBand.position.y = -0.06;
body.add(rimBand);

/* Raised central ridge / keel panel on the carapace back */
const keelShape = new THREE.Shape();
keelShape.moveTo(0, 0.86);
keelShape.lineTo(0.42, 0.30);
keelShape.lineTo(0.30, -0.60);
keelShape.lineTo(0, -0.86);
keelShape.lineTo(-0.30, -0.60);
keelShape.lineTo(-0.42, 0.30);
keelShape.lineTo(0, 0.86);
const keelGeo = new THREE.ExtrudeGeometry(keelShape, {
  depth: 0.14, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.06, bevelSegments: 1, steps: 1
});
keelGeo.rotateX(-Math.PI / 2);
const keel = shellMesh(keelGeo, MAT.shell2, 20);
keel.position.set(0, 0.60, -0.02);
keel.scale.set(1.0, 1.0, 0.95);
body.add(keel);

/* A few small faceted spine bumps (king crab knobbly shell), as folded pyramids */
function spikeGeometry(r, h) {
  const g = new THREE.ConeGeometry(r, h, 4, 1);
  g.translate(0, h * 0.5, 0);
  return g;
}
const spikePositions = [
  [0.00, 0.90, -0.62, 0.16, 0.24],
  [0.62, 0.72, -0.28, 0.13, 0.20],
  [-0.62, 0.72, -0.28, 0.13, 0.20],
  [0.95, 0.50,  0.32, 0.12, 0.18],
  [-0.95, 0.50, 0.32, 0.12, 0.18],
  [0.00, 0.86,  0.46, 0.13, 0.20],
  [0.42, 0.84, -0.86, 0.10, 0.15],
  [-0.42, 0.84, -0.86, 0.10, 0.15],
  [1.24, 0.28, -0.05, 0.11, 0.17],
  [-1.24, 0.28, -0.05, 0.11, 0.17]
];
spikePositions.forEach((p) => {
  const s = shellMesh(spikeGeometry(p[3], p[4]), MAT.shell, 18);
  s.position.set(p[0], p[1], p[2]);
  // tilt outward from center
  const dir = new THREE.Vector3(p[0], 0.9, p[2]).normalize();
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
  s.quaternion.copy(q);
  body.add(s);
});

/* Front rostrum / face plate wedge */
const rostrumGeo = new THREE.CylinderGeometry(0.10, 0.46, 0.66, 5, 1);
rostrumGeo.rotateX(Math.PI / 2);
const rostrum = shellMesh(rostrumGeo, MAT.shell, 16);
rostrum.position.set(0, 0.16, 1.42);
rostrum.rotation.x = -0.30;
body.add(rostrum);

/* Glue tabs around the carapace rim */
tabRing(
  body,
  () => 1.60,
  16,
  0.30, 0.20,
  () => -0.03,
  -78,
  MAT.tab
);
// scale tab ring's Z-oval by re-positioning children (approximate oval fit)
body.children.forEach((ch) => {
  if (ch.isGroup && ch.children.length === 1 && ch.children[0].geometry && ch.children[0].geometry.getAttribute('uv') && ch.children[0].geometry.index && ch.children[0].geometry.index.count === 6) {
    ch.position.z *= 0.86;
  }
});

/* Seam creases: meridians drawn on the dome so folds read clearly */
{
  const seams = new THREE.Group();
  const merid = 13;
  for (let i = 0; i < merid; i++) {
    const a = (i / merid) * Math.PI * 2;
    const pts = [];
    for (let j = 0; j < carapaceProfile.length; j++) {
      const p = carapaceProfile[j];
      pts.push(new THREE.Vector3(Math.cos(a) * p.x * 1.004, p.y * 1.004 + 0.002, Math.sin(a) * p.x * 0.86 * 1.004));
    }
    const g = new THREE.BufferGeometry().setFromPoints(pts);
    seams.add(new THREE.Line(g, creaseMat));
  }
  body.add(seams);
}

/* ============================================================
   Limb builder: tapered paper cone segments with tabs + creases
   ============================================================ */
function makeSegment(r1, r2, len, seg, mat, withTabs) {
  const grp = new THREE.Group();
  const geo = coneSegGeometry(r1, r2, len, seg);
  const m = shellMesh(geo, mat, 14);
  grp.add(m);

  // joint collar (a folded paper ring where two cones butt together)
  const collar = shellMesh(
    (function () {
      const g = new THREE.CylinderGeometry(r1 * 1.22, r1 * 1.22, r1 * 0.42, seg, 1, true);
      g.translate(0, r1 * 0.21, 0);
      return g;
    })(),
    MAT.cream, 14, creaseMatLight
  );
  grp.add(collar);

  if (withTabs) {
    const n = 4;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + 0.4;
      const holder = new THREE.Group();
      holder.position.set(Math.cos(a) * r1 * 1.02, len * 0.5, Math.sin(a) * r1 * 1.02);
      holder.rotation.y = -a + Math.PI / 2;
      const t = makeGlueTab(len * 0.34, r1 * 0.62, 0.6, MAT.tab);
      t.rotation.z = Math.PI / 2;
      t.rotation.y = 0;
      t.rotation.x = 0;
      holder.add(t);
      grp.add(holder);
    }
  }
  return grp;
}

/**
 * Build a multi-segment tapered limb.
 * spec: array of {len, r1, r2, pitch, yaw, roll}
 */
function buildLimb(spec, mat, tabEvery) {
  const root = new THREE.Group();
  let cursor = root;
  spec.forEach((s, i) => {
    const joint = new THREE.Group();
    joint.rotation.set(s.pitch || 0, s.yaw || 0, s.roll || 0);
    cursor.add(joint);
    const seg = makeSegment(s.r1, s.r2, s.len, s.seg || 6, mat, tabEvery ? (i % tabEvery === 0) : false);
    joint.add(seg);
    const tip = new THREE.Group();
    tip.position.y = s.len;
    joint.add(tip);
    cursor = tip;
  });
  return { root: root, tip: cursor };
}

/* ---------- Walking legs (8) ---------- */
/* Layout: 4 per side, fanned front-to-back. Each has 4 tapered cone
   segments: coxa/merus (out+up), carpus (out), propodus (down), dactyl (down, pointed). */
const legAngles = [0.86, 0.30, -0.26, -0.80]; // yaw offsets from +X axis (front to back)
const legLift   = [0.10, 0.02, -0.02, -0.10];
const legScale  = [0.94, 1.03, 1.02, 0.90];

function buildWalkingLeg(scale) {
  const s = scale;
  const spec = [
    { len: 0.62 * s, r1: 0.155 * s, r2: 0.125 * s, pitch: 0, yaw: 0, roll: -1.02, seg: 6 },
    { len: 1.02 * s, r1: 0.125 * s, r2: 0.095 * s, pitch: 0, yaw: 0, roll: -0.46, seg: 6 },
    { len: 1.10 * s, r1: 0.095 * s, r2: 0.062 * s, pitch: 0, yaw: 0, roll: 1.44, seg: 6 },
    { len: 0.86 * s, r1: 0.062 * s, r2: 0.012 * s, pitch: 0, yaw: 0, roll: 0.52, seg: 5 }
  ];
  const limb = buildLimb(spec, MAT.limb, 2);
  // tiny paper claw-tip fold at the very end
  const tipGeo = new THREE.ConeGeometry(0.045 * s, 0.16 * s, 4, 1);
  tipGeo.translate(0, 0.08 * s, 0);
  const tipM = shellMesh(tipGeo, MAT.cream, 16, creaseMatLight);
  limb.tip.add(tipM);
  return limb.root;
}

const legsGroup = new THREE.Group();
body.add(legsGroup);

for (let side = 0; side < 2; side++) {
  const sgn = side === 0 ? 1 : -1;
  for (let i = 0; i < 4; i++) {
    const hip = new THREE.Group();
    const a = legAngles[i];
    // attach around the body rim
    const ax = Math.cos(a) * 1.42 * sgn;
    const az = Math.sin(a) * 1.20;
    hip.position.set(ax, -0.04 + legLift[i] * 0.4, az);
    hip.rotation.y = sgn > 0 ? -a : Math.PI + a;
    hip.rotation.z = 0;

    const leg = buildWalkingLeg(legScale[i]);
    // orient limb root: rotate so segment roll swings it outward in local XY
    leg.rotation.z = -0.10;
    hip.add(leg);

    // shoulder socket: faceted paper knuckle
    const socket = shellMesh(new THREE.DodecahedronGeometry(0.20 * legScale[i], 0), MAT.shell2, 18);
    hip.add(socket);

    // glue tab attaching the leg to the body
    const tabHolder = new THREE.Group();
    tabHolder.position.set(-0.02, 0.0, 0);
    const tb = makeGlueTab(0.30, 0.20, 0.65, MAT.tab);
    tb.rotation.y = Math.PI / 2;
    tb.rotation.z = -1.25;
    tabHolder.add(tb);
    hip.add(tabHolder);

    legsGroup.add(hip);
  }
}

/* ---------- Chunky claws (2) ---------- */
function buildClaw(sideSign, scale) {
  const s = scale;
  const grp = new THREE.Group();

  // arm: two tapered cones
  const armSpec = [
    { len: 0.86 * s, r1: 0.21 * s, r2: 0.175 * s, roll: -0.72, seg: 6 },
    { len: 0.98 * s, r1: 0.175 * s, r2: 0.155 * s, roll: 0.98, seg: 6 }
  ];
  const arm = buildLimb(armSpec, MAT.limb, 1);
  grp.add(arm.root);

  // ----- hand (propodus): chunky folded paper block -----
  const hand = new THREE.Group();
  hand.rotation.set(0, 0, -0.42);
  arm.tip.add(hand);

  const palmGeo = new THREE.CylinderGeometry(0.34 * s, 0.20 * s, 0.82 * s, 6, 1);
  palmGeo.translate(0, 0.40 * s, 0);
  palmGeo.scale(1.0, 1.0, 0.72);
  const palm = shellMesh(palmGeo, MAT.limb, 14);
  hand.add(palm);

  // palm end cap wedge
  const capGeo = new THREE.ConeGeometry(0.34 * s, 0.30 * s, 6, 1);
  capGeo.translate(0, 0.14 * s, 0);
  capGeo.scale(1.0, 1.0, 0.72);
  const cap = shellMesh(capGeo, MAT.limbDk, 16);
  cap.position.y = 0.80 * s;
  hand.add(cap);

  // pincer fingers: two long tapered cones, slightly opened
  const fixedFinger = shellMesh(
    (function () {
      const g = new THREE.CylinderGeometry(0.035 * s, 0.155 * s, 0.86 * s, 5, 1);
      g.translate(0, 0.43 * s, 0);
      g.scale(1.0, 1.0, 0.82);
      return g;
    })(),
    MAT.limb, 14
  );
  fixedFinger.position.set(0.10 * s, 0.82 * s, 0);
  fixedFinger.rotation.z = -0.24;
  hand.add(fixedFinger);

  const movableFinger = shellMesh(
    (function () {
      const g = new THREE.CylinderGeometry(0.032 * s, 0.135 * s, 0.78 * s, 5, 1);
      g.translate(0, 0.39 * s, 0);
      g.scale(1.0, 1.0, 0.82);
      return g;
    })(),
    MAT.limb, 14
  );
  movableFinger.position.set(-0.12 * s, 0.80 * s, 0);
  movableFinger.rotation.z = 0.34;
  hand.add(movableFinger);

  // cream inner-edge strips on the fingers (paper accents)
  const strip1 = new THREE.Mesh(new THREE.PlaneGeometry(0.06 * s, 0.72 * s), MAT.cream);
  strip1.position.set(0.055 * s, 1.18 * s, 0.0);
  strip1.rotation.set(0, Math.PI / 2, -0.24);
  strip1.castShadow = false; strip1.receiveShadow = true;
  hand.add(strip1);

  const strip2 = new THREE.Mesh(new THREE.PlaneGeometry(0.055 * s, 0.66 * s), MAT.cream);
  strip2.position.set(-0.07 * s, 1.14 * s, 0.0);
  strip2.rotation.set(0, Math.PI / 2, 0.34);
  strip2.castShadow = false; strip2.receiveShadow = true;
  hand.add(strip2);

  // glue tabs along the palm seam
  for (let i = 0; i < 3; i++) {
    const h = new THREE.Group();
    h.position.set(0.30 * s, (0.18 + i * 0.26) * s, 0.0);
    h.rotation.y = Math.PI / 2;
    const t = makeGlueTab(0.20 * s, 0.13 * s, 0.65, MAT.tab);
    t.rotation.z = Math.PI / 2;
    h.add(t);
    hand.add(h);
  }
  for (let i = 0; i < 3; i++) {
    const h = new THREE.Group();
    h.position.set(-0.30 * s, (0.18 + i * 0.26) * s, 0.0);
    h.rotation.y = -Math.PI / 2;
    const t = makeGlueTab(0.20 * s, 0.13 * s, 0.65, MAT.tab);
    t.rotation.z = Math.PI / 2;
    h.add(t);
    hand.add(h);
  }

  // faceted knuckle at the shoulder
  const knuckle = shellMesh(new THREE.DodecahedronGeometry(0.24 * s, 0), MAT.shell2, 18);
  grp.add(knuckle);

  return grp;
}

const clawL = new THREE.Group();
clawL.position.set(1.02, -0.02, 1.02);
clawL.rotation.y = -0.62;
clawL.rotation.x = 0.06;
clawL.add(buildClaw(1, 1.10));
body.add(clawL);

const clawR = new THREE.Group();
clawR.position.set(-1.02, -0.02, 1.02);
clawR.rotation.y = Math.PI + 0.62;
clawR.rotation.x = 0.06;
clawR.add(buildClaw(-1, 0.96));
body.add(clawR);

/* ---------- Eyes on short cylindrical stalks ---------- */
function makeEye(xSign) {
  const g = new THREE.Group();

  // short paper cylinder stalk
  const stalkGeo = new THREE.CylinderGeometry(0.075, 0.085, 0.40, 8, 1, true);
  stalkGeo.translate(0, 0.20, 0);
  const stalk = shellMesh(stalkGeo, MAT.stalk, 16, creaseMatLight);
  g.add(stalk);

  // ring crease band around the stalk base
  const bandGeo = new THREE.CylinderGeometry(0.092, 0.092, 0.07, 8, 1, true);
  bandGeo.translate(0, 0.05, 0);
  const band = shellMesh(bandGeo, MAT.limbDk, 16, creaseMatLight);
  g.add(band);

  // paper-punch eye: a flat white disc + smaller ink disc
  const discW = new THREE.Mesh(new THREE.CircleGeometry(0.135, 20), MAT.eyeW);
  const discBack = new THREE.Mesh(new THREE.CircleGeometry(0.135, 20), MAT.eyeW);
  const shim = new THREE.Mesh(new THREE.CylinderGeometry(0.132, 0.132, 0.035, 20, 1, true), MAT.eyeW);
  const pupil = new THREE.Mesh(new THREE.CircleGeometry(0.072, 18), MAT.eyeInk);
  const glint = new THREE.Mesh(new THREE.CircleGeometry(0.022, 12), MAT.eyeW);

  const eyeHead = new THREE.Group();
  eyeHead.position.y = 0.44;

  discW.position.z = 0.018;
  discBack.position.z = -0.018;
  discBack.rotation.y = Math.PI;
  shim.rotation.x = Math.PI / 2;
  pupil.position.z = 0.0225;
  glint.position.set(-0.030, 0.032, 0.026);

  [discW, discBack, shim].forEach((m) => { m.castShadow = true; m.receiveShadow = true; });
  eyeHead.add(discW, discBack, shim, pupil, glint);

  // crease outline around the punched disc
  const ringPts = [];
  for (let i = 0; i <= 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    ringPts.push(new THREE.Vector3(Math.cos(a) * 0.136, Math.sin(a) * 0.136, 0.019));
  }
  const ring = new THREE.Line(new THREE.BufferGeometry().setFromPoints(ringPts), creaseMatLight);
  eyeHead.add(ring);

  eyeHead.rotation.y = xSign * -0.22;
  eyeHead.rotation.x = -0.06;
  g.add(eyeHead);

  return g;
}

const eyeL = makeEye(1);
eyeL.position.set(0.30, 0.44, 1.15);
eyeL.rotation.set(0.34, 0, -0.14);
body.add(eyeL);

const eyeR = makeEye(-1);
eyeR.position.set(-0.30, 0.44, 1.15);
eyeR.rotation.set(0.34, 0, 0.14);
body.add(eyeR);

/* ---------- Mouth parts / small folded plates under the rostrum ---------- */
{
  const mouth = new THREE.Group();
  mouth.position.set(0, -0.02, 1.24);
  const plate = shellMesh(new THREE.BoxGeometry(0.42, 0.10, 0.30), MAT.cream, 18, creaseMatLight);
  plate.rotation.x = 0.35;
  mouth.add(plate);
  for (let i = -1; i <= 1; i += 2) {
    const flap = shellMesh(new THREE.BoxGeometry(0.14, 0.06, 0.26), MAT.limbDk, 18);
    flap.position.set(i * 0.16, -0.07, 0.06);
    flap.rotation.x = 0.6;
    flap.rotation.z = i * 0.2;
    mouth.add(flap);
  }
  // two short antennae from folded paper strips
  for (let i = -1; i <= 1; i += 2) {
    const ant = shellMesh(
      (function () {
        const g = new THREE.CylinderGeometry(0.008, 0.030, 0.46, 4, 1);
        g.translate(0, 0.23, 0);
        return g;
      })(),
      MAT.cream, 20, creaseMatLight
    );
    ant.position.set(i * 0.14, 0.06, 0.10);
    ant.rotation.set(0.85, 0, i * 0.42);
    mouth.add(ant);
  }
  body.add(mouth);
}

/* ---------- Abdomen flap folded under the rear ---------- */
{
  const flap = shellMesh(new THREE.CylinderGeometry(0.26, 0.42, 0.62, 5, 1), MAT.cream, 16, creaseMatLight);
  flap.position.set(0, -0.16, -0.85);
  flap.rotation.x = 1.32;
  flap.scale.set(1.0, 1.0, 0.42);
  body.add(flap);

  const tabH = new THREE.Group();
  tabH.position.set(0, -0.14, -1.10);
  tabH.rotation.x = -1.35;
  const t = makeGlueTab(0.44, 0.22, 0.7, MAT.tab);
  tabH.add(t);
  body.add(tabH);
}

/* ============================================================
   Ground contact: settle the crab so leg tips reach y = 0
   ============================================================ */
crab.updateMatrixWorld(true);
{
  const box = new THREE.Box3().setFromObject(crab);
  const minY = box.min.y;
  if (isFinite(minY)) {
    crab.position.y -= minY;
  }
  // recenter horizontally
  crab.updateMatrixWorld(true);
  const box2 = new THREE.Box3().setFromObject(crab);
  const c = new THREE.Vector3();
  box2.getCenter(c);
  crab.position.x -= c.x;
  crab.position.z -= c.z;
  crab.updateMatrixWorld(true);

  const box3 = new THREE.Box3().setFromObject(crab);
  const size = new THREE.Vector3();
  box3.getSize(size);
  controls.target.set(0, size.y * 0.42, 0);
  controls.update();
}

/* ============================================================
   Animation
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // gentle breathing bob so the paper model feels alive
  body.position.y = BODY_Y + Math.sin(t * 0.9) * 0.018;
  body.rotation.z = Math.sin(t * 0.62) * 0.008;
  eyeL.rotation.z = -0.14 + Math.sin(t * 1.4) * 0.05;
  eyeR.rotation.z = 0.14 - Math.sin(t * 1.4 + 0.6) * 0.05;

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>
