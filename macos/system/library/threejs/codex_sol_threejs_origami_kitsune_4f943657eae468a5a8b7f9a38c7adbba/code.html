<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Origami Nine-Tail Fox</title>
<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #e9e2d6;
  }
  canvas {
    display: block;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e2d6);
scene.fog = new THREE.Fog(0xe9e2d6, 11, 19);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 50);
camera.position.set(7.4, 5.3, 10.6);
camera.lookAt(0, 2.45, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.45, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 7;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.48;

const fox = new THREE.Group();
fox.rotation.y = -0.08;
scene.add(fox);

function createWashiTexture() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#f4eee5';
  ctx.fillRect(0, 0, size, size);

  let seed = 928371;
  const random = () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };

  const image = ctx.getImageData(0, 0, size, size);
  for (let i = 0; i < image.data.length; i += 4) {
    const n = Math.floor((random() - 0.5) * 14);
    image.data[i] = Math.max(0, Math.min(255, image.data[i] + n));
    image.data[i + 1] = Math.max(0, Math.min(255, image.data[i + 1] + n));
    image.data[i + 2] = Math.max(0, Math.min(255, image.data[i + 2] + n));
  }
  ctx.putImageData(image, 0, 0);

  ctx.lineCap = 'round';
  for (let i = 0; i < 340; i++) {
    const x = random() * size;
    const y = random() * size;
    const length = 5 + random() * 28;
    const angle = (random() - 0.5) * 0.3;
    ctx.strokeStyle = random() > 0.48
      ? `rgba(120,92,70,${0.018 + random() * 0.035})`
      : `rgba(255,255,255,${0.04 + random() * 0.08})`;
    ctx.lineWidth = 0.25 + random() * 0.65;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(angle) * length, y + Math.sin(angle) * length);
    ctx.stroke();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(2.7, 2.7);
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const washiTexture = createWashiTexture();

const paperMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  map: washiTexture,
  vertexColors: true,
  roughness: 0.91,
  metalness: 0,
  flatShading: true,
  side: THREE.DoubleSide
});

const darkPaperMaterial = new THREE.MeshStandardMaterial({
  color: 0x241918,
  roughness: 0.9,
  metalness: 0,
  flatShading: true,
  side: THREE.DoubleSide
});

const creaseMaterial = new THREE.LineBasicMaterial({
  color: 0x6f201b,
  transparent: true,
  opacity: 0.72,
  depthWrite: false
});

const paleCreaseMaterial = new THREE.LineBasicMaterial({
  color: 0x9d7467,
  transparent: true,
  opacity: 0.55,
  depthWrite: false
});

const vermilion = new THREE.Color(0xd9472f);
const redLight = new THREE.Color(0xec6244);
const redDark = new THREE.Color(0xa92f25);
const redDeep = new THREE.Color(0x7e251f);
const paperWhite = new THREE.Color(0xf7f0e5);
const paperShade = new THREE.Color(0xdccfc0);
const paperWarm = new THREE.Color(0xeee0cf);

function addTriangle(vertices, colors, a, b, c, color) {
  const points = [a, b, c];
  for (const point of points) {
    vertices.push(point.x, point.y, point.z);
    colors.push(color.r, color.g, color.b);
  }
}

function createFacetedMesh(points, faces, palette, parent = fox) {
  const vertices = [];
  const colors = [];

  for (const face of faces) {
    const faceColor = palette[face[3] ?? 0];
    if (face.length === 4) {
      addTriangle(vertices, colors, points[face[0]], points[face[1]], points[face[2]], faceColor);
    } else {
      for (let i = 1; i < face.length - 2; i++) {
        addTriangle(vertices, colors, points[face[0]], points[face[i]], points[face[i + 1]], faceColor);
      }
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geometry.computeVertexNormals();

  const mesh = new THREE.Mesh(geometry, paperMaterial);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function addCrease(points, material = creaseMaterial, parent = fox) {
  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  const line = new THREE.Line(geometry, material);
  line.renderOrder = 3;
  parent.add(line);
  return line;
}

function createFoldedStrip(points, widths, thicknesses, whiteStart, parent = fox) {
  const vertices = [];
  const colors = [];
  const sections = [];

  for (let i = 0; i < points.length; i++) {
    const previous = points[Math.max(0, i - 1)];
    const next = points[Math.min(points.length - 1, i + 1)];
    const tangent = new THREE.Vector3().subVectors(next, previous).normalize();
    const side = new THREE.Vector3(-tangent.y, tangent.x, 0).normalize();
    if (side.lengthSq() < 0.001) side.set(1, 0, 0);

    const w = widths[i];
    const t = thicknesses[i];
    sections.push([
      points[i].clone().addScaledVector(side, w).add(new THREE.Vector3(0, 0, t)),
      points[i].clone().addScaledVector(side, -w).add(new THREE.Vector3(0, 0, t)),
      points[i].clone().addScaledVector(side, -w).add(new THREE.Vector3(0, 0, -t)),
      points[i].clone().addScaledVector(side, w).add(new THREE.Vector3(0, 0, -t))
    ]);
  }

  for (let i = 0; i < sections.length - 1; i++) {
    const current = sections[i];
    const next = sections[i + 1];
    const isWhite = i >= whiteStart;
    const frontColor = isWhite ? paperWhite : (i % 2 === 0 ? redLight : vermilion);
    const sideColor = isWhite ? paperShade : (i % 2 === 0 ? redDark : redDeep);
    const backColor = isWhite ? paperWarm : redDark;

    addTriangle(vertices, colors, current[0], current[1], next[0], frontColor);
    addTriangle(vertices, colors, current[1], next[1], next[0], frontColor);
    addTriangle(vertices, colors, current[1], current[2], next[1], sideColor);
    addTriangle(vertices, colors, current[2], next[2], next[1], sideColor);
    addTriangle(vertices, colors, current[2], current[3], next[2], backColor);
    addTriangle(vertices, colors, current[3], next[3], next[2], backColor);
    addTriangle(vertices, colors, current[3], current[0], next[3], sideColor);
    addTriangle(vertices, colors, current[0], next[0], next[3], sideColor);
  }

  const first = sections[0];
  const last = sections[sections.length - 1];
  addTriangle(vertices, colors, first[0], first[2], first[1], redDark);
  addTriangle(vertices, colors, first[0], first[3], first[2], redDark);
  addTriangle(vertices, colors, last[0], last[1], last[2], paperShade);
  addTriangle(vertices, colors, last[0], last[2], last[3], paperShade);

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geometry.computeVertexNormals();

  const mesh = new THREE.Mesh(geometry, paperMaterial);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);

  const ridgePoints = points.map((p, i) => p.clone().add(new THREE.Vector3(0, 0, thicknesses[i] + 0.009)));
  addCrease(ridgePoints, creaseMaterial, parent);
  return mesh;
}

const tailGroup = new THREE.Group();
tailGroup.position.z = -0.22;
fox.add(tailGroup);

for (let i = 0; i < 9; i++) {
  const spread = (i - 4) / 4;
  const layer = Math.abs(spread);
  const baseX = spread * 0.22;
  const side = spread * (1.4 + 0.45 * layer);
  const curl = spread === 0 ? 0.16 : -Math.sign(spread) * (0.08 + layer * 0.12);
  const topY = 5.35 - layer * 0.72;
  const zLayer = -0.75 - layer * 0.18 + (i % 2) * 0.055;

  const points = [
    new THREE.Vector3(baseX, 1.62, -0.18 + zLayer),
    new THREE.Vector3(side * 0.32, 2.25, zLayer),
    new THREE.Vector3(side * 0.72, 3.18, zLayer + 0.05),
    new THREE.Vector3(side, 4.13 - layer * 0.12, zLayer + 0.12),
    new THREE.Vector3(side * 1.08 + curl, topY - 0.34, zLayer + 0.24),
    new THREE.Vector3(side * 0.96 + curl * 1.6, topY, zLayer + 0.38)
  ];

  createFoldedStrip(
    points,
    [0.31, 0.34, 0.31, 0.25, 0.16, 0.025],
    [0.075, 0.08, 0.075, 0.065, 0.045, 0.018],
    3,
    tailGroup
  );
}

const bodyPoints = [
  new THREE.Vector3(0, 3.22, 0.02),
  new THREE.Vector3(-0.76, 2.62, 0.38),
  new THREE.Vector3(0.76, 2.62, 0.38),
  new THREE.Vector3(-0.67, 1.52, 0.22),
  new THREE.Vector3(0.67, 1.52, 0.22),
  new THREE.Vector3(-0.55, 1.68, -0.68),
  new THREE.Vector3(0.55, 1.68, -0.68),
  new THREE.Vector3(0, 2.72, -0.76),
  new THREE.Vector3(0, 1.32, -0.22)
];

const bodyFaces = [
  [0, 1, 2, 1],
  [1, 3, 4, 0],
  [1, 4, 2, 1],
  [2, 4, 6, 0],
  [2, 6, 7, 2],
  [2, 7, 0, 1],
  [0, 7, 5, 2],
  [0, 5, 1, 0],
  [1, 5, 3, 2],
  [3, 5, 8, 1],
  [5, 6, 8, 2],
  [6, 4, 8, 1],
  [5, 7, 6, 2],
  [3, 8, 4, 0]
];

createFacetedMesh(bodyPoints, bodyFaces, [vermilion, redLight, redDark]);
addCrease([
  new THREE.Vector3(-0.745, 2.62, 0.395),
  new THREE.Vector3(0, 2.09, 0.48),
  new THREE.Vector3(0.745, 2.62, 0.395)
]);
addCrease([
  new THREE.Vector3(0.01, 3.22, 0.035),
  new THREE.Vector3(0, 2.09, 0.48),
  new THREE.Vector3(0, 1.34, -0.205)
]);

function createLeg(x, z, isFront) {
  const kneeOut = x * 1.11;
  const kneeY = isFront ? 1.05 : 0.98;
  const footZ = z + (isFront ? 0.15 : -0.11);
  const points = [
    new THREE.Vector3(x, 1.78, z),
    new THREE.Vector3(kneeOut, kneeY, z + (isFront ? 0.06 : -0.03)),
    new THREE.Vector3(x * 1.04, 0.22, footZ)
  ];
  createFoldedStrip(points, [0.22, 0.17, 0.115], [0.11, 0.09, 0.06], 1);
}

createLeg(-0.48, 0.29, true);
createLeg(0.48, 0.29, true);
createLeg(-0.48, -0.48, false);
createLeg(0.48, -0.48, false);

const neckPoints = [
  new THREE.Vector3(-0.45, 2.75, 0.25),
  new THREE.Vector3(0.45, 2.75, 0.25),
  new THREE.Vector3(-0.37, 3.55, 0.5),
  new THREE.Vector3(0.37, 3.55, 0.5),
  new THREE.Vector3(0, 3.12, -0.3)
];

const neckFaces = [
  [0, 1, 3, 1],
  [0, 3, 2, 0],
  [0, 2, 4, 2],
  [2, 3, 4, 1],
  [3, 1, 4, 2],
  [1, 0, 4, 0]
];
createFacetedMesh(neckPoints, neckFaces, [vermilion, redLight, redDark]);

const headPoints = [
  new THREE.Vector3(0, 4.34, 0.72),
  new THREE.Vector3(-0.64, 3.86, 0.76),
  new THREE.Vector3(0.64, 3.86, 0.76),
  new THREE.Vector3(-0.54, 3.37, 0.82),
  new THREE.Vector3(0.54, 3.37, 0.82),
  new THREE.Vector3(0, 3.06, 1.08),
  new THREE.Vector3(0, 3.52, 1.72),
  new THREE.Vector3(-0.48, 3.72, 0.16),
  new THREE.Vector3(0.48, 3.72, 0.16),
  new THREE.Vector3(0, 4.08, 0.22)
];

const headFaces = [
  [0, 1, 6, 1],
  [0, 6, 2, 0],
  [1, 3, 6, 2],
  [2, 6, 4, 1],
  [3, 5, 6, 3],
  [6, 5, 4, 3],
  [1, 7, 3, 0],
  [3, 7, 5, 2],
  [5, 7, 8, 1],
  [5, 8, 4, 2],
  [4, 8, 2, 0],
  [0, 9, 7, 1],
  [0, 7, 1, 2],
  [0, 2, 8, 0],
  [0, 8, 9, 2],
  [7, 9, 8, 2]
];

createFacetedMesh(headPoints, headFaces, [vermilion, redLight, redDark, paperWhite]);

const leftEarPoints = [
  new THREE.Vector3(-0.58, 4.05, 0.61),
  new THREE.Vector3(-0.35, 5.08, 0.43),
  new THREE.Vector3(-0.04, 4.16, 0.63),
  new THREE.Vector3(-0.35, 4.08, 0.14)
];
const rightEarPoints = [
  new THREE.Vector3(0.04, 4.16, 0.63),
  new THREE.Vector3(0.35, 5.08, 0.43),
  new THREE.Vector3(0.58, 4.05, 0.61),
  new THREE.Vector3(0.35, 4.08, 0.14)
];
const earFaces = [
  [0, 1, 2, 0],
  [0, 3, 1, 2],
  [1, 3, 2, 1],
  [2, 3, 0, 2]
];
createFacetedMesh(leftEarPoints, earFaces, [vermilion, redLight, redDark]);
createFacetedMesh(rightEarPoints, earFaces, [vermilion, redLight, redDark]);

const innerEarFaces = [[0, 1, 2, 0]];
createFacetedMesh([
  new THREE.Vector3(-0.515, 4.14, 0.632),
  new THREE.Vector3(-0.35, 4.86, 0.507),
  new THREE.Vector3(-0.115, 4.20, 0.648)
], innerEarFaces, [paperWarm]);
createFacetedMesh([
  new THREE.Vector3(0.115, 4.20, 0.648),
  new THREE.Vector3(0.35, 4.86, 0.507),
  new THREE.Vector3(0.515, 4.14, 0.632)
], innerEarFaces, [paperWarm]);

addCrease([
  new THREE.Vector3(-0.515, 4.14, 0.644),
  new THREE.Vector3(-0.35, 4.86, 0.519),
  new THREE.Vector3(-0.115, 4.20, 0.66)
], paleCreaseMaterial);
addCrease([
  new THREE.Vector3(0.115, 4.20, 0.66),
  new THREE.Vector3(0.35, 4.86, 0.519),
  new THREE.Vector3(0.515, 4.14, 0.644)
], paleCreaseMaterial);

addCrease([
  new THREE.Vector3(0, 4.335, 0.742),
  new THREE.Vector3(0, 3.535, 1.735)
]);
addCrease([
  new THREE.Vector3(-0.625, 3.865, 0.782),
  new THREE.Vector3(0, 3.535, 1.735),
  new THREE.Vector3(0.625, 3.865, 0.782)
]);
addCrease([
  new THREE.Vector3(-0.525, 3.375, 0.842),
  new THREE.Vector3(0, 3.075, 1.102),
  new THREE.Vector3(0.525, 3.375, 0.842)
], paleCreaseMaterial);

function createTriangleFeature(a, b, c, material) {
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute([
    a.x, a.y, a.z,
    b.x, b.y, b.z,
    c.x, c.y, c.z
  ], 3));
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  fox.add(mesh);
  return mesh;
}

createTriangleFeature(
  new THREE.Vector3(-0.39, 3.78, 1.145),
  new THREE.Vector3(-0.17, 3.80, 1.31),
  new THREE.Vector3(-0.33, 3.66, 1.25),
  darkPaperMaterial
);
createTriangleFeature(
  new THREE.Vector3(0.17, 3.80, 1.31),
  new THREE.Vector3(0.39, 3.78, 1.145),
  new THREE.Vector3(0.33, 3.66, 1.25),
  darkPaperMaterial
);

const noseGeometry = new THREE.BufferGeometry();
noseGeometry.setAttribute('position', new THREE.Float32BufferAttribute([
  0, 3.53, 1.79,
  -0.105, 3.58, 1.68,
  0.105, 3.58, 1.68,
  0, 3.43, 1.69
], 3));
noseGeometry.setIndex([
  0, 1, 2,
  0, 3, 1,
  0, 2, 3,
  1, 3, 2
]);
noseGeometry.computeVertexNormals();
const nose = new THREE.Mesh(noseGeometry, darkPaperMaterial);
nose.castShadow = true;
fox.add(nose);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(7.5, 96),
  new THREE.MeshStandardMaterial({
    color: 0xd8cfc1,
    roughness: 1,
    metalness: 0
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.085;
ground.receiveShadow = true;
scene.add(ground);

const outerGround = new THREE.Mesh(
  new THREE.PlaneGeometry(35, 35),
  new THREE.MeshStandardMaterial({
    color: 0xe9e2d6,
    roughness: 1,
    metalness: 0
  })
);
outerGround.rotation.x = -Math.PI / 2;
outerGround.position.y = 0.04;
outerGround.receiveShadow = true;
scene.add(outerGround);

const hemisphere = new THREE.HemisphereLight(0xfff8eb, 0x6e5548, 1.45);
scene.add(hemisphere);

const keyLight = new THREE.DirectionalLight(0xffead3, 4.1);
keyLight.position.set(5.5, 9.5, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 24;
keyLight.shadow.bias = -0.00025;
keyLight.shadow.normalBias = 0.025;
keyLight.shadow.radius = 1.2;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xff9d78, 1.65);
rimLight.position.set(-6, 6, -7);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xc7d9ff, 0.75);
fillLight.position.set(-4, 3, 6);
scene.add(fillLight);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
