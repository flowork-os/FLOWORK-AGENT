<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elderly Bronze Memorial Figure</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #11100e;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const canvas = document.getElementById("scene");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x11100e);
    scene.fog = new THREE.Fog(0x11100e, 8, 18);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(5.7, 4.0, 6.8);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.42;
    controls.minDistance = 4.6;
    controls.maxDistance = 11;
    controls.target.set(0, 1.8, 0.2);

    const bronze = new THREE.MeshPhysicalMaterial({
      color: 0x514235,
      metalness: 0.92,
      roughness: 0.3,
      clearcoat: 0.24,
      clearcoatRoughness: 0.22
    });

    const bronzeLight = new THREE.MeshPhysicalMaterial({
      color: 0x765b3c,
      metalness: 0.9,
      roughness: 0.27,
      clearcoat: 0.3,
      clearcoatRoughness: 0.2
    });

    const patina = new THREE.MeshPhysicalMaterial({
      color: 0x304039,
      metalness: 0.86,
      roughness: 0.4,
      clearcoat: 0.12,
      clearcoatRoughness: 0.35
    });

    const darkBronze = new THREE.MeshPhysicalMaterial({
      color: 0x241f1a,
      metalness: 0.84,
      roughness: 0.44
    });

    const stone = new THREE.MeshStandardMaterial({
      color: 0x292724,
      roughness: 0.86,
      metalness: 0.08
    });

    const stoneEdge = new THREE.MeshStandardMaterial({
      color: 0x3b3630,
      roughness: 0.75,
      metalness: 0.1
    });

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x171614,
      roughness: 0.96,
      metalness: 0
    });

    function finishMesh(mesh, cast = true, receive = true) {
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      return mesh;
    }

    function box(name, size, position, material, parent = scene, rotation = [0, 0, 0]) {
      const mesh = finishMesh(new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material));
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
      parent.add(mesh);
      return mesh;
    }

    function ellipsoid(name, position, scale, material, parent = scene, rotation = [0, 0, 0], segments = 32) {
      const mesh = finishMesh(new THREE.Mesh(new THREE.SphereGeometry(1, segments, 24), material));
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      mesh.scale.set(scale[0], scale[1], scale[2]);
      mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
      parent.add(mesh);
      return mesh;
    }

    function capsuleBetween(name, start, end, radius, material, parent = scene, taper = 1) {
      const a = new THREE.Vector3(start[0], start[1], start[2]);
      const b = new THREE.Vector3(end[0], end[1], end[2]);
      const direction = new THREE.Vector3().subVectors(b, a);
      const length = direction.length();
      const midpoint = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);

      const group = new THREE.Group();
      group.name = name;
      group.position.copy(midpoint);

      const cylinder = finishMesh(new THREE.Mesh(
        new THREE.CylinderGeometry(radius * taper, radius, length, 24, 1, false),
        material
      ));
      cylinder.castShadow = true;
      cylinder.receiveShadow = true;
      cylinder.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      group.add(cylinder);

      const capA = finishMesh(new THREE.Mesh(new THREE.SphereGeometry(radius, 24, 16), material));
      const capB = finishMesh(new THREE.Mesh(new THREE.SphereGeometry(radius * taper, 24, 16), material));
      capA.position.set(0, -length * 0.5, 0);
      capB.position.set(0, length * 0.5, 0);
      group.add(capA, capB);

      parent.add(group);
      return group;
    }

    function tubePath(name, points, radius, material, parent = scene) {
      const curve = new THREE.CatmullRomCurve3(
        points.map((point) => new THREE.Vector3(point[0], point[1], point[2]))
      );
      const geometry = new THREE.TubeGeometry(curve, 18, radius, 8, false);
      const mesh = finishMesh(new THREE.Mesh(geometry, material));
      mesh.name = name;
      parent.add(mesh);
      return mesh;
    }

    const hemiLight = new THREE.HemisphereLight(0x9da9a5, 0x17110c, 2.0);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffd2a0, 4.1);
    keyLight.position.set(-4.5, 7.5, 5.2);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -5;
    keyLight.shadow.camera.right = 5;
    keyLight.shadow.camera.top = 7;
    keyLight.shadow.camera.bottom = -2;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 18;
    keyLight.shadow.bias = -0.00025;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x75949c, 2.4);
    rimLight.position.set(4.8, 5.5, -4.5);
    scene.add(rimLight);

    const fillLight = new THREE.PointLight(0x9f7652, 1.25, 10, 2);
    fillLight.position.set(-3.5, 2.8, 4.8);
    scene.add(fillLight);

    const ground = finishMesh(new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      groundMaterial
    ), false, true);
    ground.rotation.x = -Math.PI * 0.5;
    ground.position.y = -0.015;
    scene.add(ground);

    box("lower memorial plinth", [4.5, 0.42, 2.55], [0, 0.21, 0], stone);
    box("upper memorial plinth", [3.95, 0.24, 2.18], [0, 0.54, 0], stoneEdge);

    box("bench seat", [3.35, 0.3, 1.08], [0, 1.2, 0], stoneEdge);
    box("bench left support", [0.38, 0.68, 0.82], [-1.2, 0.81, -0.02], stone);
    box("bench right support", [0.38, 0.68, 0.82], [1.2, 0.81, -0.02], stone);
    box("bench back", [3.34, 0.68, 0.18], [0, 1.68, -0.47], stone);

    box("memorial plaque", [1.2, 0.38, 0.055], [0, 0.43, 1.285], darkBronze);
    box("plaque highlight", [0.84, 0.025, 0.018], [0, 0.56, 1.32], bronzeLight, scene, [0, 0, 0]);
    ellipsoid("plaque stud left", [-0.48, 0.43, 1.325], [0.035, 0.035, 0.018], bronzeLight);
    ellipsoid("plaque stud right", [0.48, 0.43, 1.325], [0.035, 0.035, 0.018], bronzeLight);

    const statue = new THREE.Group();
    statue.name = "elderly seated bronze figure";
    scene.add(statue);

    ellipsoid(
      "left trouser thigh",
      [-0.48, 1.5, 0.28],
      [0.35, 0.42, 0.64],
      darkBronze,
      statue,
      [0.26, 0, 0]
    );
    ellipsoid(
      "right trouser thigh",
      [0.48, 1.5, 0.28],
      [0.35, 0.42, 0.64],
      darkBronze,
      statue,
      [0.26, 0, 0]
    );

    capsuleBetween("left lower leg", [-0.48, 1.35, 0.68], [-0.48, 0.64, 0.84], 0.2, darkBronze, statue, 0.9);
    capsuleBetween("right lower leg", [0.48, 1.35, 0.68], [0.48, 0.64, 0.84], 0.2, darkBronze, statue, 0.9);

    ellipsoid("left shoe", [-0.48, 0.59, 1.0], [0.29, 0.18, 0.46], darkBronze, statue, [0.03, 0, 0]);
    ellipsoid("right shoe", [0.48, 0.59, 1.0], [0.29, 0.18, 0.46], darkBronze, statue, [0.03, 0, 0]);
    box("left shoe sole", [0.42, 0.045, 0.62], [-0.48, 0.445, 1.0], bronze, statue);
    box("right shoe sole", [0.42, 0.045, 0.62], [0.48, 0.445, 1.0], bronze, statue);

    ellipsoid(
      "coat lower drape",
      [0, 1.78, 0.18],
      [0.9, 0.64, 0.62],
      bronze,
      statue,
      [0.12, 0, 0]
    );
    ellipsoid(
      "left hanging coat panel",
      [-0.68, 1.88, 0.12],
      [0.32, 0.78, 0.43],
      bronze,
      statue,
      [0.14, 0, -0.08]
    );
    ellipsoid(
      "right hanging coat panel",
      [0.68, 1.88, 0.12],
      [0.32, 0.78, 0.43],
      bronze,
      statue,
      [0.14, 0, 0.08]
    );

    ellipsoid(
      "hunched coat torso",
      [0, 2.37, 0.28],
      [0.88, 1.12, 0.58],
      bronze,
      statue,
      [0.2, 0, 0]
    );
    ellipsoid(
      "coat shoulder mass",
      [0, 2.77, 0.45],
      [1.03, 0.53, 0.54],
      bronze,
      statue,
      [0.13, 0, 0]
    );

    ellipsoid("left coat lapel", [-0.27, 2.55, 0.86], [0.16, 0.62, 0.055], bronzeLight, statue, [0.2, 0, -0.12]);
    ellipsoid("right coat lapel", [0.27, 2.55, 0.86], [0.16, 0.62, 0.055], bronzeLight, statue, [0.2, 0, 0.12]);
    ellipsoid("coat collar left", [-0.32, 2.89, 0.69], [0.3, 0.14, 0.08], patina, statue, [0.15, 0, -0.18]);
    ellipsoid("coat collar right", [0.32, 2.89, 0.69], [0.3, 0.14, 0.08], patina, statue, [0.15, 0, 0.18]);

    capsuleBetween("left coat seam", [-0.62, 2.64, 0.82], [-0.68, 2.18, 0.81], 0.025, patina, statue, 0.9);
    capsuleBetween("right coat seam", [0.62, 2.64, 0.82], [0.68, 2.18, 0.81], 0.025, patina, statue, 0.9);
    tubePath(
      "left coat fold",
      [[-0.42, 2.42, 0.84], [-0.5, 2.08, 0.78], [-0.46, 1.72, 0.69]],
      0.022,
      darkBronze,
      statue
    );
    tubePath(
      "right coat fold",
      [[0.42, 2.42, 0.84], [0.5, 2.08, 0.78], [0.46, 1.72, 0.69]],
      0.022,
      darkBronze,
      statue
    );

    ellipsoid("coat button upper", [0, 2.66, 0.91], [0.055, 0.055, 0.035], bronzeLight, statue);
    ellipsoid("coat button middle", [0, 2.42, 0.94], [0.055, 0.055, 0.035], bronzeLight, statue);
    ellipsoid("coat button lower", [0, 2.18, 0.9], [0.055, 0.055, 0.035], bronzeLight, statue);

    capsuleBetween("left upper sleeve", [-0.76, 2.72, 0.42], [-0.84, 2.08, 0.64], 0.245, bronze, statue, 0.88);
    capsuleBetween("right upper sleeve", [0.76, 2.72, 0.42], [0.84, 2.08, 0.64], 0.245, bronze, statue, 0.88);
    ellipsoid("left elbow fold", [-0.82, 2.08, 0.64], [0.25, 0.28, 0.24], patina, statue);
    ellipsoid("right elbow fold", [0.82, 2.08, 0.64], [0.25, 0.28, 0.24], patina, statue);

    capsuleBetween("left forearm", [-0.82, 2.03, 0.66], [-0.27, 1.67, 0.93], 0.18, bronze, statue, 0.84);
    capsuleBetween("right forearm", [0.82, 2.03, 0.66], [0.27, 1.67, 0.93], 0.18, bronze, statue, 0.84);

    ellipsoid("left hand", [-0.25, 1.61, 0.98], [0.19, 0.13, 0.28], bronzeLight, statue, [0.25, 0, 0]);
    ellipsoid("right hand", [0.25, 1.61, 0.98], [0.19, 0.13, 0.28], bronzeLight, statue, [0.25, 0, 0]);

    for (let index = 0; index < 3; index += 1) {
      const offset = (index - 1) * 0.075;
      ellipsoid(
        "left resting finger " + index,
        [-0.25 + offset, 1.55, 1.15],
        [0.047, 0.05, 0.19],
        bronzeLight,
        statue,
        [0.18, 0, 0]
      );
      ellipsoid(
        "right resting finger " + index,
        [0.25 + offset, 1.55, 1.15],
        [0.047, 0.05, 0.19],
        bronzeLight,
        statue,
        [0.18, 0, 0]
      );
    }

    capsuleBetween("neck", [0, 3.0, 0.51], [0, 3.28, 0.62], 0.245, patina, statue, 0.88);
    ellipsoid("head", [0, 3.52, 0.71], [0.43, 0.5, 0.42], bronze, statue, [0.05, 0, 0]);
    ellipsoid("bald crown", [0, 3.68, 0.58], [0.44, 0.27, 0.37], darkBronze, statue, [0.02, 0, 0]);
    ellipsoid("left side hair", [-0.38, 3.53, 0.64], [0.11, 0.28, 0.15], darkBronze, statue, [0, 0, -0.12]);
    ellipsoid("right side hair", [0.38, 3.53, 0.64], [0.11, 0.28, 0.15], darkBronze, statue, [0, 0, 0.12]);

    ellipsoid("left ear", [-0.42, 3.5, 0.73], [0.1, 0.15, 0.09], bronzeLight, statue);
    ellipsoid("right ear", [0.42, 3.5, 0.73], [0.1, 0.15, 0.09], bronzeLight, statue);
    ellipsoid("nose", [0, 3.43, 1.105], [0.105, 0.13, 0.16], bronzeLight, statue, [0.06, 0, 0]);
    ellipsoid("left brow", [-0.16, 3.61, 1.055], [0.13, 0.045, 0.045], darkBronze, statue, [0, 0, -0.1]);
    ellipsoid("right brow", [0.16, 3.61, 1.055], [0.13, 0.045, 0.045], darkBronze, statue, [0, 0, 0.1]);
    ellipsoid("left eye shadow", [-0.16, 3.52, 1.08], [0.043, 0.035, 0.025], darkBronze, statue);
    ellipsoid("right eye shadow", [0.16, 3.52, 1.08], [0.043, 0.035, 0.025], darkBronze, statue);
    ellipsoid("mouth shadow", [0, 3.28, 1.075], [0.14, 0.025, 0.025], darkBronze, statue, [0, 0, 0]);

    tubePath(
      "left cheek wrinkle",
      [[-0.28, 3.44, 1.045], [-0.31, 3.36, 1.055], [-0.27, 3.3, 1.045]],
      0.014,
      patina,
      statue
    );
    tubePath(
      "right cheek wrinkle",
      [[0.28, 3.44, 1.045], [0.31, 3.36, 1.055], [0.27, 3.3, 1.045]],
      0.014,
      patina,
      statue
    );

    const clock = new THREE.Clock();

    function render() {
      controls.update();
      renderer.render(scene, camera);
    }

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", resize);
    renderer.setAnimationLoop(() => {
      clock.getElapsedTime();
      render();
    });
  </script>
</body>
</html>
