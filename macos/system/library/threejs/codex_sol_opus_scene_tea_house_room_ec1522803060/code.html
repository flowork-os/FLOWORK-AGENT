<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japanese Tea House Room</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #171512; }
    canvas { display: block; }
    .caption {
      position: fixed;
      left: 24px;
      bottom: 20px;
      color: rgba(245, 232, 205, 0.72);
      font: 12px/1.4 Georgia, serif;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 1px 4px #000;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="caption">Afternoon tea · 静寂</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xaaa28f);
    scene.fog = new THREE.FogExp2(0xb8ae98, 0.018);

    const camera = new THREE.PerspectiveCamera(
      42,
      innerWidth / innerHeight,
      0.1,
      100
    );
    camera.position.set(9.7, 6.4, 11.8);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.55, -0.35);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.19;
    controls.minDistance = 7;
    controls.maxDistance = 20;
    controls.maxPolarAngle = Math.PI * 0.49;

    let seed = 1357911;
    function random() {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    function range(a, b) {
      return a + (b - a) * random();
    }

    const mats = {
      darkWood: new THREE.MeshStandardMaterial({
        color: 0x352218,
        roughness: 0.67,
        metalness: 0.02
      }),
      wood: new THREE.MeshStandardMaterial({
        color: 0x684329,
        roughness: 0.66
      }),
      paleWood: new THREE.MeshStandardMaterial({
        color: 0xa78960,
        roughness: 0.74
      }),
      plaster: new THREE.MeshStandardMaterial({
        color: 0xd3c8a9,
        roughness: 0.96
      }),
      tatami: new THREE.MeshStandardMaterial({
        color: 0xa69a61,
        roughness: 0.92
      }),
      border: new THREE.MeshStandardMaterial({
        color: 0x443d29,
        roughness: 0.9
      }),
      paper: new THREE.MeshStandardMaterial({
        color: 0xf3e4c5,
        roughness: 0.83,
        transparent: true,
        opacity: 0.73,
        side: THREE.DoubleSide
      }),
      ceramic: new THREE.MeshStandardMaterial({
        color: 0x756f5f,
        roughness: 0.5
      }),
      blackIron: new THREE.MeshStandardMaterial({
        color: 0x151615,
        roughness: 0.7,
        metalness: 0.42
      }),
      bamboo: new THREE.MeshStandardMaterial({
        color: 0x6f7040,
        roughness: 0.75
      }),
      leaf: new THREE.MeshStandardMaterial({
        color: 0x29412b,
        roughness: 0.82
      }),
      stone: new THREE.MeshStandardMaterial({
        color: 0x77756c,
        roughness: 0.98
      }),
      water: new THREE.MeshPhysicalMaterial({
        color: 0x5a5845,
        roughness: 0.18,
        transmission: 0.05,
        clearcoat: 0.3
      })
    };

    function canvasTexture(size, painter) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      painter(ctx, size);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    const woodTexture = canvasTexture(512, (ctx, s) => {
      ctx.fillStyle = '#765035';
      ctx.fillRect(0, 0, s, s);
      for (let i = 0; i < 180; i++) {
        const y = random() * s;
        ctx.strokeStyle = `rgba(45,24,12,${range(0.025, 0.11)})`;
        ctx.lineWidth = range(0.4, 2.2);
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x <= s; x += 18) {
          ctx.lineTo(x, y + Math.sin(x * 0.03 + i) * range(0.5, 3));
        }
        ctx.stroke();
      }
    });
    woodTexture.wrapS = woodTexture.wrapT = THREE.RepeatWrapping;
    woodTexture.repeat.set(2, 2);
    mats.wood.map = woodTexture;

    const tatamiTexture = canvasTexture(512, (ctx, s) => {
      ctx.fillStyle = '#afa269';
      ctx.fillRect(0, 0, s, s);
      for (let y = 0; y < s; y += 4) {
        ctx.strokeStyle = y % 8 === 0 ? '#968b58' : '#c0b37a';
        ctx.globalAlpha = 0.32;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(s, y + range(-1, 1));
        ctx.stroke();
      }
      ctx.globalAlpha = 0.16;
      for (let x = 0; x < s; x += 7) {
        ctx.fillStyle = x % 14 ? '#615c3d' : '#f2e2a4';
        ctx.fillRect(x, 0, 1, s);
      }
      ctx.globalAlpha = 1;
    });
    tatamiTexture.wrapS = tatamiTexture.wrapT = THREE.RepeatWrapping;
    tatamiTexture.repeat.set(2.8, 1.3);
    mats.tatami.map = tatamiTexture;

    const scrollTexture = canvasTexture(512, (ctx, s) => {
      ctx.fillStyle = '#e5ddc8';
      ctx.fillRect(0, 0, s, s);
      const wash = ctx.createRadialGradient(280, 220, 20, 280, 220, 260);
      wash.addColorStop(0, 'rgba(105,110,92,.18)');
      wash.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = wash;
      ctx.fillRect(0, 0, s, s);
      ctx.strokeStyle = 'rgba(38,38,29,.85)';
      ctx.lineCap = 'round';
      ctx.lineWidth = 13;
      ctx.beginPath();
      ctx.moveTo(255, 78);
      ctx.bezierCurveTo(207, 142, 299, 181, 229, 242);
      ctx.bezierCurveTo(194, 274, 226, 326, 168, 398);
      ctx.stroke();
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(281, 90);
      ctx.bezierCurveTo(326, 140, 286, 200, 343, 245);
      ctx.stroke();
      ctx.fillStyle = '#9a4734';
      ctx.fillRect(348, 386, 47, 47);
      ctx.fillStyle = 'rgba(45,35,27,.7)';
      ctx.font = '26px serif';
      ctx.fillText('和', 358, 420);
    });

    function mesh(geometry, material, position, rotation = null) {
      const object = new THREE.Mesh(geometry, material);
      object.position.set(position[0], position[1], position[2]);
      if (rotation) object.rotation.set(rotation[0], rotation[1], rotation[2]);
      object.castShadow = true;
      object.receiveShadow = true;
      scene.add(object);
      return object;
    }

    function box(name, size, position, material, rotation = null, parent = scene) {
      const object = new THREE.Mesh(
        new THREE.BoxGeometry(size[0], size[1], size[2]),
        material
      );
      object.name = name;
      object.position.set(...position);
      if (rotation) object.rotation.set(...rotation);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function cylinder(
      radiusTop,
      radiusBottom,
      height,
      segments,
      material,
      position,
      rotation = null,
      parent = scene
    ) {
      const object = new THREE.Mesh(
        new THREE.CylinderGeometry(
          radiusTop,
          radiusBottom,
          height,
          segments
        ),
        material
      );
      object.position.set(...position);
      if (rotation) object.rotation.set(...rotation);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    const room = new THREE.Group();
    scene.add(room);

    box(
      'foundation',
      [13.7, 0.34, 11],
      [0, -0.23, 0],
      mats.darkWood,
      null,
      room
    );
    box(
      'back wall',
      [13.5, 5.7, 0.18],
      [0, 2.7, -5.1],
      mats.plaster,
      null,
      room
    );
    box(
      'left wall',
      [0.18, 5.7, 10.3],
      [-6.67, 2.7, 0],
      mats.plaster,
      null,
      room
    );
    box(
      'ceiling beam',
      [13.7, 0.25, 0.25],
      [0, 5.35, -4.92],
      mats.darkWood,
      null,
      room
    );
    box(
      'left beam',
      [0.28, 5.5, 0.3],
      [-6.48, 2.62, -4.88],
      mats.darkWood,
      null,
      room
    );

    function makeTatami(x, z, w, d, rotate = false) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);
      if (rotate) group.rotation.y = Math.PI / 2;
      room.add(group);
      box(
        'tatami',
        [w, 0.12, d],
        [0, 0, 0],
        mats.tatami,
        null,
        group
      );
      box(
        'border left',
        [0.07, 0.135, d + 0.03],
        [-w / 2 + 0.025, 0.012, 0],
        mats.border,
        null,
        group
      );
      box(
        'border right',
        [0.07, 0.135, d + 0.03],
        [w / 2 - 0.025, 0.012, 0],
        mats.border,
        null,
        group
      );
    }

    makeTatami(-4.2, 2.45, 2.05, 4.65);
    makeTatami(-1.98, 2.45, 2.05, 4.65);
    makeTatami(0.25, 2.45, 2.05, 4.65);
    makeTatami(2.48, 2.45, 2.05, 4.65);
    makeTatami(4.72, 2.45, 2.05, 4.65);
    makeTatami(-4.2, -2.25, 2.05, 4.45);
    makeTatami(-1.98, -2.25, 2.05, 4.45);
    makeTatami(0.25, -2.25, 2.05, 4.45);
    makeTatami(2.48, -2.25, 2.05, 4.45);
    makeTatami(4.72, -2.25, 2.05, 4.45);

    const alcove = new THREE.Group();
    alcove.position.set(-3.72, 0, -4.76);
    scene.add(alcove);
    box(
      'alcove side',
      [0.18, 4.95, 1.15],
      [-1.75, 2.5, 0.45],
      mats.darkWood,
      null,
      alcove
    );
    box(
      'alcove top',
      [3.55, 0.2, 1.15],
      [0, 4.83, 0.45],
      mats.darkWood,
      null,
      alcove
    );
    box(
      'alcove platform',
      [3.5, 0.25, 1.15],
      [0, 0.23, 0.45],
      mats.paleWood,
      null,
      alcove
    );
    const scrollMat = new THREE.MeshStandardMaterial({
      map: scrollTexture,
      roughness: 0.9,
      side: THREE.DoubleSide
    });
    box(
      'scroll',
      [1.28, 3.02, 0.035],
      [-0.62, 2.9, 1.03],
      scrollMat,
      null,
      alcove
    );
    cylinder(
      0.055,
      0.055,
      1.5,
      14,
      mats.darkWood,
      [-0.62, 1.38, 1.01],
      [0, 0, Math.PI / 2],
      alcove
    );
    cylinder(
      0.047,
      0.047,
      1.38,
      14,
      mats.darkWood,
      [-0.62, 4.43, 1.01],
      [0, 0, Math.PI / 2],
      alcove
    );

    const ikebana = new THREE.Group();
    ikebana.position.set(0.72, 0.58, 0.78);
    alcove.add(ikebana);
    cylinder(
      0.36,
      0.26,
      0.48,
      28,
      new THREE.MeshStandardMaterial({
        color: 0x363b37,
        roughness: 0.42,
        metalness: 0.1
      }),
      [0, 0.24, 0],
      null,
      ikebana
    );

    function branchBetween(a, b, radius, material, parent) {
      const start = new THREE.Vector3(...a);
      const end = new THREE.Vector3(...b);
      const mid = start.clone().add(end).multiplyScalar(0.5);
      const direction = end.clone().sub(start);
      const branch = new THREE.Mesh(
        new THREE.CylinderGeometry(
          radius * 0.72,
          radius,
          direction.length(),
          8
        ),
        material
      );
      branch.position.copy(mid);
      branch.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      branch.castShadow = true;
      parent.add(branch);
      return branch;
    }

    branchBetween(
      [0, 0.45, 0],
      [-0.38, 1.7, 0.08],
      0.035,
      mats.bamboo,
      ikebana
    );
    branchBetween(
      [0, 0.48, 0],
      [0.68, 1.2, -0.05],
      0.03,
      mats.bamboo,
      ikebana
    );
    branchBetween(
      [0.02, 0.46, 0],
      [0.18, 2.05, 0.02],
      0.027,
      mats.bamboo,
      ikebana
    );

    const flowerMat = new THREE.MeshStandardMaterial({
      color: 0xa35c50,
      roughness: 0.8
    });
    for (const p of [
      [-0.38, 1.7, 0.08],
      [0.68, 1.2, -0.05],
      [0.18, 2.05, 0.02],
      [-0.1, 1.2, 0.05]
    ]) {
      const flower = new THREE.Group();
      flower.position.set(...p);
      ikebana.add(flower);
      for (let i = 0; i < 5; i++) {
        const petal = new THREE.Mesh(
          new THREE.SphereGeometry(0.115, 10, 8),
          flowerMat
        );
        petal.scale.set(1.2, 0.55, 0.5);
        petal.position.set(
          Math.cos(i * Math.PI * 0.4) * 0.1,
          Math.sin(i * Math.PI * 0.4) * 0.1,
          0
        );
        petal.rotation.z = i * Math.PI * 0.4;
        flower.add(petal);
      }
    }

    function makeShojiPanel(x, z, width, height, angle = 0) {
      const panel = new THREE.Group();
      panel.position.set(x, height / 2 + 0.12, z);
      panel.rotation.y = angle;
      scene.add(panel);

      box(
        'shoji paper',
        [width - 0.16, height - 0.16, 0.035],
        [0, 0, 0],
        mats.paper,
        null,
        panel
      );
      const frame = 0.085;
      box(
        'frame',
        [frame, height, 0.1],
        [-width / 2, 0, 0],
        mats.darkWood,
        null,
        panel
      );
      box(
        'frame',
        [frame, height, 0.1],
        [width / 2, 0, 0],
        mats.darkWood,
        null,
        panel
      );
      box(
        'frame',
        [width, frame, 0.1],
        [0, -height / 2, 0],
        mats.darkWood,
        null,
        panel
      );
      box(
        'frame',
        [width, frame, 0.1],
        [0, height / 2, 0],
        mats.darkWood,
        null,
        panel
      );
      for (let i = 1; i < 4; i++) {
        box(
          'vertical lattice',
          [0.045, height - 0.1, 0.075],
          [-width / 2 + i * width / 4, 0, -0.01],
          mats.wood,
          null,
          panel
        );
      }
      for (let i = 1; i < 7; i++) {
        box(
          'horizontal lattice',
          [width - 0.1, 0.04, 0.075],
          [0, -height / 2 + i * height / 7, -0.01],
          mats.wood,
          null,
          panel
        );
      }
      return panel;
    }

    makeShojiPanel(3.9, -4.93, 2.15, 4.75);
    makeShojiPanel(6.05, -4.93, 2.15, 4.75);
    const openShoji = makeShojiPanel(2.35, -3.92, 2.15, 4.75, -0.7);

    box(
      'shoji rail',
      [6.3, 0.13, 0.3],
      [3.42, 0.15, -4.88],
      mats.darkWood
    );
    box(
      'shoji upper rail',
      [6.3, 0.14, 0.3],
      [3.42, 4.93, -4.88],
      mats.darkWood
    );

    const garden = new THREE.Group();
    garden.position.set(2.6, -0.38, -7.6);
    scene.add(garden);
    box(
      'garden bed',
      [10, 0.28, 6],
      [0, 0, 0],
      new THREE.MeshStandardMaterial({
        color: 0xc7c0a8,
        roughness: 1
      }),
      null,
      garden
    );

    const gravelMat = new THREE.MeshStandardMaterial({
      color: 0xbdb5a0,
      roughness: 0.98
    });
    for (let i = 0; i < 48; i++) {
      const groove = new THREE.Mesh(
        new THREE.TorusGeometry(
          0.55 + i * 0.065,
          0.008,
          4,
          60,
          Math.PI * range(0.65, 1.25)
        ),
        new THREE.MeshStandardMaterial({
          color: 0x817d72,
          roughness: 1
        })
      );
      groove.rotation.x = -Math.PI / 2;
      groove.rotation.z = range(-0.2, 0.2);
      groove.position.set(-1.1, 0.16 + i * 0.0002, 0);
      garden.add(groove);
    }

    for (const p of [
      [-1.2, 0.38, -0.1, 0.85],
      [1.5, 0.32, -0.7, 0.62],
      [2.4, 0.25, 1.2, 0.48],
      [-2.6, 0.23, 1.25, 0.42]
    ]) {
      const stone = new THREE.Mesh(
        new THREE.DodecahedronGeometry(p[3], 1),
        mats.stone
      );
      stone.scale.set(1.35, 0.65, 1);
      stone.position.set(p[0], p[1], p[2]);
      stone.rotation.set(range(-0.2, 0.2), range(0, 3), range(-0.1, 0.1));
      stone.castShadow = true;
      stone.receiveShadow = true;
      garden.add(stone);
    }

    const table = new THREE.Group();
    table.position.set(0.15, 0.08, 0.65);
    scene.add(table);
    box(
      'tabletop',
      [4.35, 0.22, 2.15],
      [0, 1.05, 0],
      mats.wood,
      null,
      table
    );
    for (const x of [-1.78, 1.78]) {
      for (const z of [-0.74, 0.74]) {
        box(
          'table leg',
          [0.22, 0.98, 0.22],
          [x, 0.52, z],
          mats.darkWood,
          null,
          table
        );
      }
    }
    box(
      'table apron',
      [3.75, 0.34, 0.13],
      [0, 0.82, -0.86],
      mats.darkWood,
      null,
      table
    );
    box(
      'table apron',
      [3.75, 0.34, 0.13],
      [0, 0.82, 0.86],
      mats.darkWood,
      null,
      table
    );

    function latheCup(profile, material, position, scale = 1, parent = scene) {
      const points = profile.map(p => new THREE.Vector2(p[0], p[1]));
      const cup = new THREE.Mesh(
        new THREE.LatheGeometry(points, 32),
        material
      );
      cup.position.set(...position);
      cup.scale.setScalar(scale);
      cup.castShadow = true;
      cup.receiveShadow = true;
      parent.add(cup);
      return cup;
    }

    const teaGreen = new THREE.MeshStandardMaterial({
      color: 0x3f5b3e,
      roughness: 0.54
    });
    const cupProfile = [
      [0.0, 0],
      [0.29, 0],
      [0.33, 0.07],
      [0.38, 0.39],
      [0.4, 0.48],
      [0.38, 0.52]
    ];
    latheCup(cupProfile, teaGreen, [-0.85, 1.22, 0.82], 0.75, table);
    latheCup(cupProfile, mats.ceramic, [0.78, 1.22, 0.75], 0.72, table);
    latheCup(cupProfile, mats.ceramic, [1.42, 1.22, -0.32], 0.6, table);

    for (const p of [
      [-0.85, 1.615, 0.82, 0.212],
      [0.78, 1.598, 0.75, 0.202],
      [1.42, 1.54, -0.32, 0.17]
    ]) {
      cylinder(
        p[3],
        p[3],
        0.012,
        24,
        mats.water,
        [p[0], p[1], p[2]],
        null,
        table
      );
    }

    const tray = cylinder(
      0.76,
      0.82,
      0.08,
      36,
      mats.darkWood,
      [0.95, 1.2, 0.3],
      null,
      table
    );
    tray.scale.z = 0.72;

    const kettle = new THREE.Group();
    kettle.position.set(-0.15, 1.2, -0.15);
    table.add(kettle);
    const kettleBody = new THREE.Mesh(
      new THREE.SphereGeometry(0.55, 32, 20),
      mats.blackIron
    );
    kettleBody.scale.y = 0.77;
    kettleBody.position.y = 0.42;
    kettleBody.castShadow = true;
    kettle.add(kettleBody);
    cylinder(
      0.43,
      0.49,
      0.24,
      28,
      mats.blackIron,
      [0, 0.73, 0],
      null,
      kettle
    );
    const lid = cylinder(
      0.32,
      0.38,
      0.075,
      28,
      mats.blackIron,
      [0, 0.89, 0],
      null,
      kettle
    );
    cylinder(
      0.085,
      0.105,
      0.1,
      18,
      mats.darkWood,
      [0, 0.98, 0],
      null,
      kettle
    );
    const spout = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.2, 0.62, 18),
      mats.blackIron
    );
    spout.position.set(0.49, 0.57, 0);
    spout.rotation.z = -0.87;
    spout.castShadow = true;
    kettle.add(spout);
    const spoutLip = new THREE.Mesh(
      new THREE.TorusGeometry(0.13, 0.025, 8, 20),
      mats.blackIron
    );
    spoutLip.position.set(0.72, 0.81, 0);
    spoutLip.rotation.y = Math.PI / 2;
    kettle.add(spoutLip);

    const handleCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-0.43, 0.56, 0),
      new THREE.Vector3(-0.43, 1.18, 0),
      new THREE.Vector3(0, 1.42, 0),
      new THREE.Vector3(0.43, 1.18, 0),
      new THREE.Vector3(0.43, 0.56, 0)
    ]);
    const handle = new THREE.Mesh(
      new THREE.TubeGeometry(handleCurve, 32, 0.045, 8, false),
      mats.blackIron
    );
    handle.rotation.x = -0.05;
    kettle.add(handle);

    const teaCaddy = cylinder(
      0.23,
      0.25,
      0.45,
      24,
      new THREE.MeshStandardMaterial({
        color: 0x735845,
        roughness: 0.65
      }),
      [-1.45, 1.42, -0.45],
      null,
      table
    );
    cylinder(
      0.255,
      0.255,
      0.06,
      24,
      mats.darkWood,
      [-1.45, 1.68, -0.45],
      null,
      table
    );

    const whisk = new THREE.Group();
    whisk.position.set(1.55, 1.23, 0.52);
    table.add(whisk);
    cylinder(
      0.07,
      0.09,
      0.42,
      12,
      mats.bamboo,
      [0, 0.21, 0],
      null,
      whisk
    );
    for (let i = 0; i < 18; i++) {
      const a = i / 18 * Math.PI * 2;
      branchBetween(
        [0, 0.4, 0],
        [Math.cos(a) * 0.17, 0.67, Math.sin(a) * 0.17],
        0.009,
        mats.bamboo,
        whisk
      );
    }

    const cloth = box(
      'tea cloth',
      [0.72, 0.018, 0.5],
      [-1.25, 1.175, 0.3],
      new THREE.MeshStandardMaterial({
        color: 0x9a6b55,
        roughness: 1
      }),
      [0, 0.18, 0],
      table
    );

    const bonsai = new THREE.Group();
    bonsai.position.set(4.4, 0.16, -3.82);
    scene.add(bonsai);
    box(
      'bonsai stand',
      [1.55, 0.12, 0.82],
      [0, 0.72, 0],
      mats.darkWood,
      null,
      bonsai
    );
    for (const x of [-0.58, 0.58]) {
      box(
        'bonsai stand leg',
        [0.13, 0.7, 0.13],
        [x, 0.36, 0],
        mats.darkWood,
        null,
        bonsai
      );
    }
    const pot = new THREE.Mesh(
      new THREE.BoxGeometry(0.95, 0.32, 0.62),
      new THREE.MeshStandardMaterial({
        color: 0x4d554f,
        roughness: 0.58
      })
    );
    pot.position.y = 0.97;
    pot.castShadow = true;
    bonsai.add(pot);
    box(
      'bonsai soil',
      [0.82, 0.04, 0.5],
      [0, 1.145, 0],
      new THREE.MeshStandardMaterial({
        color: 0x30281f,
        roughness: 1
      }),
      null,
      bonsai
    );

    const trunkMat = new THREE.MeshStandardMaterial({
      color: 0x493324,
      roughness: 0.93
    });
    branchBetween(
      [0, 1.12, 0],
      [-0.12, 2.5, 0],
      0.13,
      trunkMat,
      bonsai
    );
    branchBetween(
      [-0.07, 1.8, 0],
      [-0.87, 2.22, 0.05],
      0.08,
      trunkMat,
      bonsai
    );
    branchBetween(
      [-0.1, 2.15, 0],
      [0.72, 2.65, -0.04],
      0.07,
      trunkMat,
      bonsai
    );
    branchBetween(
      [-0.12, 2.43, 0],
      [-0.35, 3.05, 0.03],
      0.055,
      trunkMat,
      bonsai
    );

    const leafClusters = [];
    for (const p of [
      [-0.9, 2.25, 0.05, 0.48],
      [-0.5, 2.45, 0, 0.42],
      [0.68, 2.69, -0.02, 0.52],
      [0.27, 2.64, 0.05, 0.4],
      [-0.35, 3.07, 0.03, 0.44],
      [-0.08, 2.84, -0.1, 0.38]
    ]) {
      const cluster = new THREE.Group();
      cluster.position.set(p[0], p[1], p[2]);
      bonsai.add(cluster);
      for (let i = 0; i < 10; i++) {
        const leaf = new THREE.Mesh(
          new THREE.IcosahedronGeometry(p[3] * range(0.38, 0.62), 1),
          mats.leaf
        );
        leaf.scale.set(
          range(1.1, 1.7),
          range(0.5, 0.85),
          range(0.7, 1.15)
        );
        leaf.position.set(
          range(-p[3] * 0.65, p[3] * 0.65),
          range(-p[3] * 0.3, p[3] * 0.3),
          range(-p[3] * 0.38, p[3] * 0.38)
        );
        leaf.castShadow = true;
        cluster.add(leaf);
      }
      leafClusters.push(cluster);
    }

    function makeCushion(x, z, color, rotation = 0) {
      const cushionMat = new THREE.MeshStandardMaterial({
        color,
        roughness: 0.9
      });
      const cushion = new THREE.Mesh(
        new THREE.RoundedBoxGeometry
          ? new THREE.RoundedBoxGeometry(1.55, 0.18, 1.35, 4, 0.12)
          : new THREE.BoxGeometry(1.55, 0.18, 1.35, 4, 2, 4),
        cushionMat
      );
      cushion.position.set(x, 0.22, z);
      cushion.rotation.y = rotation;
      cushion.scale.set(1, 1, 1);
      cushion.castShadow = true;
      scene.add(cushion);
    }

    function cushionGeometry() {
      const shape = new THREE.Shape();
      const w = 0.78;
      const h = 0.68;
      const r = 0.12;
      shape.moveTo(-w + r, -h);
      shape.lineTo(w - r, -h);
      shape.quadraticCurveTo(w, -h, w, -h + r);
      shape.lineTo(w, h - r);
      shape.quadraticCurveTo(w, h, w - r, h);
      shape.lineTo(-w + r, h);
      shape.quadraticCurveTo(-w, h, -w, h - r);
      shape.lineTo(-w, -h + r);
      shape.quadraticCurveTo(-w, -h, -w + r, -h);
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: 0.17,
        bevelEnabled: true,
        bevelSize: 0.06,
        bevelThickness: 0.05,
        bevelSegments: 3
      });
      geometry.rotateX(Math.PI / 2);
      geometry.translate(0, 0.13, 0);
      return geometry;
    }

    const cushionMat = new THREE.MeshStandardMaterial({
      color: 0x6f5548,
      roughness: 0.93
    });
    for (const p of [
      [0.1, 2.65, 0],
      [-3.05, 0.7, Math.PI / 2],
      [3.25, 0.7, Math.PI / 2]
    ]) {
      const cushion = new THREE.Mesh(cushionGeometry(), cushionMat);
      cushion.position.set(p[0], 0.1, p[1]);
      cushion.rotation.y = p[2];
      cushion.castShadow = true;
      cushion.receiveShadow = true;
      scene.add(cushion);
    }

    const steamTexture = canvasTexture(128, (ctx, s) => {
      const gradient = ctx.createRadialGradient(
        s / 2,
        s / 2,
        0,
        s / 2,
        s / 2,
        s / 2
      );
      gradient.addColorStop(0, 'rgba(255,255,255,.72)');
      gradient.addColorStop(0.25, 'rgba(240,240,230,.38)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, s, s);
    });

    const steamParticles = [];
    for (let i = 0; i < 12; i++) {
      const material = new THREE.SpriteMaterial({
        map: steamTexture,
        transparent: true,
        opacity: 0.2,
        depthWrite: false,
        blending: THREE.NormalBlending
      });
      const sprite = new THREE.Sprite(material);
      sprite.userData.offset = i / 12;
      sprite.userData.phase = range(0, Math.PI * 2);
      sprite.scale.setScalar(range(0.25, 0.42));
      scene.add(sprite);
      steamParticles.push(sprite);
    }

    const dust = [];
    const dustMat = new THREE.MeshBasicMaterial({
      color: 0xffe3ab,
      transparent: true,
      opacity: 0.32,
      depthWrite: false
    });
    for (let i = 0; i < 55; i++) {
      const mote = new THREE.Mesh(
        new THREE.SphereGeometry(range(0.008, 0.025), 5, 4),
        dustMat
      );
      mote.position.set(
        range(-5.8, 5.8),
        range(0.5, 4.8),
        range(-4.5, 4.5)
      );
      mote.userData.speed = range(0.05, 0.14);
      mote.userData.phase = range(0, Math.PI * 2);
      scene.add(mote);
      dust.push(mote);
    }

    const ambient = new THREE.HemisphereLight(0xd8e0df, 0x46382b, 1.25);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffd29a, 4.3);
    sun.position.set(7.5, 7.8, -7.5);
    sun.target.position.set(0, 1, 0);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -9;
    sun.shadow.camera.right = 9;
    sun.shadow.camera.top = 9;
    sun.shadow.camera.bottom = -9;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 25;
    sun.shadow.bias = -0.00025;
    scene.add(sun, sun.target);

    const screenGlow = new THREE.RectAreaLight(
      0xffd8a3,
      5.2,
      5.8,
      4.3
    );
    screenGlow.position.set(4.2, 2.6, -4.65);
    screenGlow.rotation.y = Math.PI;
    scene.add(screenGlow);

    const warmFill = new THREE.PointLight(0xe6ad73, 13, 9, 2);
    warmFill.position.set(-3.2, 3.3, -3.5);
    scene.add(warmFill);

    const clock = new THREE.Clock();

    function animate() {
      const elapsed = clock.getElapsedTime();

      for (let i = 0; i < steamParticles.length; i++) {
        const sprite = steamParticles[i];
        const t = (elapsed * 0.12 + sprite.userData.offset) % 1;
        sprite.position.set(
          -0.01 + Math.sin(t * 9 + sprite.userData.phase) * (0.05 + t * 0.14),
          2.2 + t * 1.6,
          0.5 + Math.cos(t * 7 + sprite.userData.phase) * 0.07
        );
        const scale = 0.18 + t * 0.62;
        sprite.scale.set(scale, scale * 1.22, scale);
        sprite.material.opacity = Math.sin(Math.PI * t) * 0.18;
      }

      dust.forEach((mote, i) => {
        mote.position.y += mote.userData.speed * 0.006;
        mote.position.x += Math.sin(
          elapsed * 0.23 + mote.userData.phase
        ) * 0.0007;
        if (mote.position.y > 5) mote.position.y = 0.35;
        mote.material.opacity = 0.2 + Math.sin(
          elapsed * 0.8 + i
        ) * 0.08;
      });

      leafClusters.forEach((cluster, i) => {
        cluster.rotation.z = Math.sin(elapsed * 0.42 + i) * 0.012;
        cluster.rotation.x = Math.cos(elapsed * 0.34 + i * 0.7) * 0.009;
      });

      lid.rotation.y = Math.sin(elapsed * 1.35) * 0.012;
      openShoji.rotation.y = -0.7 + Math.sin(elapsed * 0.18) * 0.006;
      screenGlow.intensity = 5.1 + Math.sin(elapsed * 0.35) * 0.18;
      cloth.rotation.z = Math.sin(elapsed * 0.21) * 0.003;

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
