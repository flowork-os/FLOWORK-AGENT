<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carved Wooden Ritual Mask</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101215; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #caption {
    position: fixed; left: 16px; bottom: 14px;
    font: 12px/1.4 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    color: rgba(226, 214, 196, 0.55);
    letter-spacing: 0.08em; text-transform: uppercase;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="caption">Carved Wooden Ritual Mask · procedural · drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ------------------------------------------------------------------
// Small math helpers
// ------------------------------------------------------------------
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}
function softWindow(v, a, b) {
  // ~1 well inside [a,b], smoothly 0 outside
  const m = 0.02;
  return Math.min(smoothstep(a - m, a + m, v), 1 - smoothstep(b - m, b + m, v));
}

// ------------------------------------------------------------------
// Mask dimensions (metres) — a realistically proportioned mask,
// roughly 52 cm tall, 37 cm wide, ~3 cm thick wooden plate.
// ------------------------------------------------------------------
const FW = 0.185;   // half width
const FH = 0.260;   // half height
const THICK = 0.032; // plate thickness

// ------------------------------------------------------------------
// Where the oval face plate exists, and where the eyes are cut out
// ------------------------------------------------------------------
function insideFace(nx, ny) {
  if (ny > 1.0 || ny < -1.0) return false;
  let hw = Math.sqrt(Math.max(0, 1 - ny * ny)); // ellipse half-width
  hw *= (1 - 0.10 * Math.max(0, -ny));          // narrower chin
  hw *= (1 + 0.03 * Math.max(0, ny));           // slightly fuller brow
  return Math.abs(nx) <= hw;
}

const EYE = { ex: 0.076, ey: 0.028, hw: 0.046, hh: 0.028, tilt: 0.16 };
function inEyeHole(x, y) {
  for (const s of [-1, 1]) {
    const cx = s * EYE.ex, cy = EYE.ey;
    const dx = x - cx, dy = y - cy;
    const ct = Math.cos(s * EYE.tilt), st = Math.sin(s * EYE.tilt);
    const rx = dx * ct + dy * st;
    const ry = -dx * st + dy * ct;
    const val = Math.pow(Math.abs(rx / EYE.hw), 2.0) + Math.pow(Math.abs(ry / EYE.hh), 1.5);
    if (val <= 1) return true;
  }
  return false;
}

// ------------------------------------------------------------------
// The carved relief: forward displacement (metres) of the face surface.
// Combines dome, brow ridge, sunken eye region, protruding nose with
// nostrils, cheeks, defined lips + groove, chin and adze tool-marks.
// ------------------------------------------------------------------
function profile(x, y) {
  const nx = x / FW, ny = y / FH;
  const r2 = nx * nx + ny * ny;
  let z = 0;

  // gently domed oval plate (flattens toward the rim)
  z += 0.024 * Math.max(0, 1 - r2);

  // connected brow ridge above the eyes (dips slightly at centre)
  {
    const dz = Math.exp(-Math.pow((y - 0.058) / 0.028, 2)) *
               Math.exp(-Math.pow(x / 0.115, 2));
    const dip = 1 - 0.35 * Math.exp(-Math.pow(x / 0.020, 2));
    z += 0.019 * dz * dip;
  }

  // recessed eye sockets
  for (const s of [-1, 1]) {
    const ex = s * EYE.ex, ey = EYE.ey;
    z -= 0.010 * Math.exp(-Math.pow((x - ex) / 0.055, 2)) *
                 Math.exp(-Math.pow((y - ey) / 0.045, 2));
  }

  // protruding carved nose: thin bridge widening to a broad tip
  {
    const top = 0.078, bot = -0.058;
    if (y < top + 0.03 && y > bot - 0.03) {
      const t = clamp((y - bot) / (top - bot), 0, 1); // 1 top, 0 bottom
      const width = 0.048 - 0.031 * t;                // wide at nostrils
      const height = 0.020 + 0.030 * Math.exp(-Math.pow((y + 0.002) / 0.052, 2));
      z += height * Math.exp(-Math.pow(x / width, 2)) * softWindow(y, bot, top);
    }
    // nostril dimples
    for (const s of [-1, 1]) {
      z -= 0.015 * Math.exp(-Math.pow((x - s * 0.026) / 0.013, 2)) *
                   Math.exp(-Math.pow((y + 0.040) / 0.012, 2));
    }
  }

  // cheek fullness beside the nose
  for (const s of [-1, 1]) {
    z += 0.010 * Math.exp(-Math.pow((x - s * 0.085) / 0.060, 2)) *
                 Math.exp(-Math.pow((y + 0.045) / 0.070, 2));
  }

  // defined mouth: raised lips with a central groove, fuller lower lip
  {
    const my = -0.120;
    z += 0.012 * Math.exp(-Math.pow((y - my) / 0.030, 2)) *
                 Math.exp(-Math.pow(x / 0.062, 2));
    z -= 0.014 * Math.exp(-Math.pow((y - my) / 0.006, 2)) *
                 Math.exp(-Math.pow(x / 0.050, 2));
    z += 0.006 * Math.exp(-Math.pow((y - (my - 0.020)) / 0.014, 2)) *
                 Math.exp(-Math.pow(x / 0.045, 2));
  }

  // chin
  z += 0.008 * Math.exp(-Math.pow((y + 0.200) / 0.050, 2)) *
               Math.exp(-Math.pow(x / 0.050, 2));

  // raised tool-mark ridges (chattered adze carving), faded near features
  {
    const rr = Math.sqrt(x * x + y * y);
    const ang = Math.atan2(y, x);
    let tm = Math.sin(rr * 210.0) * 0.55
           + Math.sin(ny * 10.0) * 0.30
           + Math.sin(ang * 22.0 + rr * 60.0) * 0.25;
    const feature = 1
      - 0.8 * Math.exp(-Math.pow((y - EYE.ey) / 0.05, 2)) // quieter round eyes
      - 0.7 * Math.exp(-Math.pow((y + 0.120) / 0.04, 2)); // quieter round mouth
    z += 0.0017 * tm * clamp(feature, 0.15, 1);
  }

  return z;
}

// ------------------------------------------------------------------
// Build the mask as a single thick shell (front + back + rim walls)
// on a masked height-field grid, so the eyes are true cut-outs.
// ------------------------------------------------------------------
function buildMaskGeometry() {
  const NU = 140, NV = 224;
  const cols = NU + 1, rows = NV + 1, N = cols * rows;

  const solid = new Uint8Array(N);
  const px = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N);
  const uu = new Float32Array(N), vv = new Float32Array(N);

  for (let j = 0; j < rows; j++) {
    const ny = -1 + 2 * j / NV;
    const y = ny * FH;
    for (let i = 0; i < cols; i++) {
      const nx = -1 + 2 * i / NU;
      const x = nx * FW;
      const idx = j * cols + i;
      solid[idx] = (insideFace(nx, ny) && !inEyeHole(x, y)) ? 1 : 0;
      px[idx] = x; py[idx] = y; pz[idx] = profile(x, y);
      uu[idx] = (nx + 1) * 0.5; vv[idx] = (ny + 1) * 0.5;
    }
  }

  const positions = [], uvs = [], indices = [];
  const frontI = new Int32Array(N).fill(-1);
  const backI = new Int32Array(N).fill(-1);

  function vf(idx) {
    if (frontI[idx] < 0) {
      frontI[idx] = positions.length / 3;
      positions.push(px[idx], py[idx], pz[idx]);
      uvs.push(uu[idx], vv[idx]);
    }
    return frontI[idx];
  }
  function vb(idx) {
    if (backI[idx] < 0) {
      backI[idx] = positions.length / 3;
      positions.push(px[idx], py[idx], pz[idx] - THICK);
      uvs.push(uu[idx], vv[idx]);
    }
    return backI[idx];
  }
  function cellSolid(i, j) {
    if (i < 0 || j < 0 || i >= NU || j >= NV) return false;
    const a = j * cols + i;
    return solid[a] && solid[a + 1] && solid[a + cols + 1] && solid[a + cols];
  }

  for (let j = 0; j < NV; j++) {
    for (let i = 0; i < NU; i++) {
      if (!cellSolid(i, j)) continue;
      const a = j * cols + i, b = a + 1, c = a + cols + 1, d = a + cols;
      const fa = vf(a), fb = vf(b), fc = vf(c), fd = vf(d);
      // front cap (faces +z)
      indices.push(fa, fb, fc, fa, fc, fd);
      // back cap (faces -z)
      const ba = vb(a), bb = vb(b), bc = vb(c), bd = vb(d);
      indices.push(ba, bc, bb, ba, bd, bc);
      // rim walls along boundaries (outer edge + eye cut-outs)
      if (!cellSolid(i - 1, j)) indices.push(fa, fd, vb(d), fa, vb(d), vb(a));
      if (!cellSolid(i + 1, j)) indices.push(fb, vb(c), fc, fb, vb(b), vb(c));
      if (!cellSolid(i, j - 1)) indices.push(fa, vb(b), fb, fa, vb(a), vb(b));
      if (!cellSolid(i, j + 1)) indices.push(fd, fc, vb(c), fd, vb(c), vb(d));
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  geo.center();
  return geo;
}

// ------------------------------------------------------------------
// Procedural value-noise (for wood grain and worn paint)
// ------------------------------------------------------------------
function makeValueNoise() {
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const t = p[i]; p[i] = p[j]; p[j] = t;
  }
  const perm = new Uint8Array(512);
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const fade = (t) => t * t * (3 - 2 * t);
  return function (x, y) {
    const xi = Math.floor(x) & 255, yi = Math.floor(y) & 255;
    const xf = x - Math.floor(x), yf = y - Math.floor(y);
    const v00 = perm[perm[xi] + yi] / 255;
    const v10 = perm[perm[xi + 1] + yi] / 255;
    const v01 = perm[perm[xi] + yi + 1] / 255;
    const v11 = perm[perm[xi + 1] + yi + 1] / 255;
    const u = fade(xf), v = fade(yf);
    return (v00 * (1 - u) + v10 * u) * (1 - v) + (v01 * (1 - u) + v11 * u) * v;
  };
}

// ------------------------------------------------------------------
// Colour / bump / roughness maps: warm carved wood with worn paint.
// UV space is oriented so v=1 is the forehead (top), v=0 the chin.
// ------------------------------------------------------------------
function makeMaskTextures() {
  const S = 1024;
  const noise = makeValueNoise();
  const fbm = (x, y, oct) => {
    let a = 0, amp = 1, f = 1, tot = 0;
    for (let i = 0; i < oct; i++) { a += amp * noise(x * f, y * f); tot += amp; amp *= 0.5; f *= 2; }
    return a / tot;
  };

  const cmap = document.createElement('canvas'); cmap.width = cmap.height = S;
  const bmap = document.createElement('canvas'); bmap.width = bmap.height = S;
  const rmap = document.createElement('canvas'); rmap.width = rmap.height = S;
  const cctx = cmap.getContext('2d'), bctx = bmap.getContext('2d'), rctx = rmap.getContext('2d');
  const cimg = cctx.createImageData(S, S), bimg = bctx.createImageData(S, S), rimg = rctx.createImageData(S, S);
  const cd = cimg.data, bd = bimg.data, rd = rimg.data;

  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const fu = x / S;
      const fv = 1 - y / S; // face-space v (matches geometry UVs under flipY)

      // ---- wood grain ----
      const warp = fbm(fu * 3.0, fv * 2.0, 4);
      const grain = fbm(fu * 50.0 + warp * 8.0, fv * 7.0, 4);
      const line = Math.pow(0.5 + 0.5 * Math.sin((fu * 62.0 + warp * 14.0 + fbm(fu * 8, fv * 8, 3) * 8.0)), 4);
      const shade = 0.72 + 0.50 * grain - 0.28 * line;
      let R = 152 * shade, G = 94 * shade, B = 55 * shade;
      R += 10 * (grain - 0.5); // faint warm variation

      // ---- worn paint accents ----
      let cover = 0;
      const paint = (cr, cg, cb, a) => {
        a = clamp(a, 0, 1);
        R = R * (1 - a) + cr * a; G = G * (1 - a) + cg * a; B = B * (1 - a) + cb * a;
        cover = Math.min(1, cover + a);
      };

      // ochre forehead band
      {
        const band = smoothstep(0.70, 0.74, fv) * (1 - smoothstep(0.88, 0.93, fv)) *
                     smoothstep(0.18, 0.26, fu) * (1 - smoothstep(0.74, 0.82, fu));
        const wear = fbm(fu * 22 + 3, fv * 22 + 7, 4);
        paint(198, 150, 58, band * clamp((wear - 0.30) * 2.3, 0, 1) * 0.92);
      }
      // white paint around the eyes
      for (const cu of [0.29, 0.71]) {
        const du = (fu - cu) / 0.13, dv = (fv - 0.55) / 0.10;
        const patch = 1 - smoothstep(0.55, 1.0, du * du + dv * dv);
        const wear = fbm(fu * 26 + cu * 10, fv * 26, 4);
        paint(226, 214, 187, patch * clamp((wear - 0.28) * 2.4, 0, 1) * 0.85);
      }
      // terracotta cheek marks
      for (const cu of [0.27, 0.73]) {
        const du = (fu - cu) / 0.07, dv = (fv - 0.36) / 0.06;
        const patch = 1 - smoothstep(0.5, 1.0, du * du + dv * dv);
        const wear = fbm(fu * 30 + cu * 5, fv * 30 + 3, 4);
        paint(170, 66, 42, patch * clamp((wear - 0.32) * 2.4, 0, 1) * 0.82);
      }
      // white nose-bridge stripe
      {
        const du = (fu - 0.5) / 0.028, dv = (fv - 0.55) / 0.17;
        const s = 1 - smoothstep(0.5, 1.0, du * du + dv * dv);
        const wear = fbm(fu * 34, fv * 34, 4);
        paint(222, 209, 182, s * clamp((wear - 0.30) * 2.2, 0, 1) * 0.72);
      }
      // dark red lips
      {
        const du = (fu - 0.5) / 0.10, dv = (fv - 0.27) / 0.028;
        const s = 1 - smoothstep(0.6, 1.0, du * du + dv * dv);
        const wear = fbm(fu * 40, fv * 40, 4);
        paint(152, 42, 38, s * clamp((wear - 0.25) * 2.6, 0, 1) * 0.86);
      }

      // rim patina darkening near the outer edge
      {
        const re = Math.sqrt(Math.pow((fu - 0.5) / 0.5, 2) + Math.pow((fv - 0.5) / 0.5, 2));
        const d = smoothstep(0.82, 1.05, re) * 0.35;
        R *= (1 - d); G *= (1 - d); B *= (1 - d);
      }

      const p = (y * S + x) * 4;
      cd[p] = clamp(R, 0, 255); cd[p + 1] = clamp(G, 0, 255); cd[p + 2] = clamp(B, 0, 255); cd[p + 3] = 255;

      // ---- bump (fine grain + faint concentric tool chatter) ----
      const fine = fbm(fu * 150, fv * 26, 3);
      const rr = Math.sqrt(Math.pow(fu - 0.5, 2) + Math.pow((fv - 0.5) * 0.7, 2));
      let bump = 0.5 + (grain - 0.5) * 0.5 + (fine - 0.5) * 0.4 - line * 0.34
                 + 0.10 * Math.sin(rr * 85.0);
      const bg = clamp(bump, 0, 1) * 255;
      bd[p] = bg; bd[p + 1] = bg; bd[p + 2] = bg; bd[p + 3] = 255;

      // ---- roughness (paint a touch smoother than bare, worn wood) ----
      let rough = 0.86 - cover * 0.22 + line * 0.06 + (grain - 0.5) * 0.05;
      const rgv = clamp(rough, 0.25, 0.98) * 255;
      rd[p] = rgv; rd[p + 1] = rgv; rd[p + 2] = rgv; rd[p + 3] = 255;
    }
  }
  cctx.putImageData(cimg, 0, 0);
  bctx.putImageData(bimg, 0, 0);
  rctx.putImageData(rimg, 0, 0);

  const map = new THREE.CanvasTexture(cmap);
  const bumpMap = new THREE.CanvasTexture(bmap);
  const roughnessMap = new THREE.CanvasTexture(rmap);
  map.colorSpace = THREE.SRGBColorSpace;
  return { map, bumpMap, roughnessMap };
}

// ------------------------------------------------------------------
// Renderer / scene / camera
// ------------------------------------------------------------------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121417);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(0.06, 0.05, 0.72);

// ------------------------------------------------------------------
// Lighting: hemisphere fill + directional key (shadows) + fill + rim
// ------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0x9fb2c6, 0x241d17, 0.42);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe6c2, 2.7);
key.position.set(0.55, 0.75, 0.85);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.2;
key.shadow.camera.far = 4;
key.shadow.camera.left = -0.4;
key.shadow.camera.right = 0.4;
key.shadow.camera.top = 0.4;
key.shadow.camera.bottom = -0.4;
key.shadow.bias = -0.0005;
key.shadow.normalBias = 0.012;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd0ff, 0.55);
fill.position.set(-0.75, 0.18, 0.55);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd6a8, 1.5);
rim.position.set(-0.35, 0.45, -0.9);
scene.add(rim);

// ------------------------------------------------------------------
// The one centered object: the carved ritual mask
// ------------------------------------------------------------------
const geometry = buildMaskGeometry();
const { map, bumpMap, roughnessMap } = makeMaskTextures();
const maxAniso = renderer.capabilities.getMaxAnisotropy();
map.anisotropy = bumpMap.anisotropy = roughnessMap.anisotropy = maxAniso;

const maskMaterial = new THREE.MeshStandardMaterial({
  map,
  bumpMap,
  bumpScale: 0.4,
  roughnessMap,
  roughness: 1.0,
  metalness: 0.0,
  side: THREE.DoubleSide,
});

const mask = new THREE.Mesh(geometry, maskMaterial);
mask.castShadow = true;
mask.receiveShadow = true;
mask.rotation.x = -0.05; // lean the crown back a touch
scene.add(mask);

// ------------------------------------------------------------------
// Ground plane that only receives shadows
// ------------------------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(4, 4),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.42;
ground.receiveShadow = true;
scene.add(ground);

// ------------------------------------------------------------------
// Orbit controls (auto-rotate so the object slowly turns)
// ------------------------------------------------------------------
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 0.32;
controls.maxDistance = 2.0;
controls.maxPolarAngle = Math.PI * 0.86;
controls.update();

// ------------------------------------------------------------------
// Resize + render loop
// ------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
