<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jazz Lounge Stage</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#060307}canvas{display:block}
#label{position:fixed;left:22px;bottom:18px;color:#d8b982;font:600 11px/1.2 Georgia,serif;letter-spacing:.28em;text-transform:uppercase;opacity:.72;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">The Midnight Room</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070309);
scene.fog = new THREE.FogExp2(0x09050d, 0.035);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.23;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(43, innerWidth / innerHeight, 0.1, 100);
camera.position.set(12, 7.2, 15.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.3, -1.6);
controls.enableDamping = true;
controls.dampingFactor = .045;
controls.autoRotate = true;
controls.autoRotateSpeed = .20;
controls.maxPolarAngle = Math.PI * .48;
controls.minDistance = 9;
controls.maxDistance = 23;

let seed = 743921;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const group = () => new THREE.Group();
const v3 = (x,y,z) => new THREE.Vector3(x,y,z);

const mats = {
  black: new THREE.MeshStandardMaterial({color:0x0b0b10,roughness:.32,metalness:.6}),
  brass: new THREE.MeshStandardMaterial({color:0xa46c20,roughness:.24,metalness:.92}),
  gold: new THREE.MeshStandardMaterial({color:0xd2a744,roughness:.26,metalness:.82}),
  wood: new THREE.MeshStandardMaterial({color:0x26120d,roughness:.34,metalness:.04}),
  woodLight: new THREE.MeshStandardMaterial({color:0x5d2d18,roughness:.36,metalness:.05}),
  velvet: new THREE.MeshStandardMaterial({color:0x3c0618,roughness:.87,metalness:0}),
  red: new THREE.MeshStandardMaterial({color:0x6d1025,roughness:.64}),
  cream: new THREE.MeshStandardMaterial({color:0xe9ddbd,roughness:.5}),
  ivory: new THREE.MeshStandardMaterial({color:0xf3ecda,roughness:.3}),
  drum: new THREE.MeshStandardMaterial({color:0x28121b,roughness:.3,metalness:.28}),
  chrome: new THREE.MeshStandardMaterial({color:0xb9b4a9,roughness:.15,metalness:1}),
  smoke: new THREE.MeshBasicMaterial({color:0x8d6389,transparent:true,opacity:.042,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending})
};
const emission = (color,intensity=1) => new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:intensity,roughness:.35,metalness:.1});

function mesh(geo, mat, x=0,y=0,z=0) {
  const o = new THREE.Mesh(geo,mat);
  o.position.set(x,y,z); o.castShadow = true; o.receiveShadow = true;
  return o;
}
function cylinder(r1,r2,h,mat,x=0,y=0,z=0,radial=24) {
  return mesh(new THREE.CylinderGeometry(r1,r2,h,radial),mat,x,y,z);
}
function box(x,y,z,mat,px=0,py=0,pz=0) {
  return mesh(new THREE.BoxGeometry(x,y,z),mat,px,py,pz);
}
function sphere(r,mat,x=0,y=0,z=0) {
  return mesh(new THREE.SphereGeometry(r,24,16),mat,x,y,z);
}
function torus(r,t,mat,x=0,y=0,z=0) {
  return mesh(new THREE.TorusGeometry(r,t,10,32),mat,x,y,z);
}
function rod(a,b,r,mat) {
  const d = b.clone().sub(a), m = a.clone().add(b).multiplyScalar(.5);
  const o = cylinder(r,r,d.length(),mat,m.x,m.y,m.z,12);
  o.quaternion.setFromUnitVectors(v3(0,1,0),d.normalize());
  return o;
}
function disk(radius,mat,x,y,z) {
  const o = cylinder(radius,radius,.065,mat,x,y,z,40);
  return o;
}

const root = group();
scene.add(root);

const floorTex = document.createElement("canvas");
floorTex.width = floorTex.height = 512;
const fc = floorTex.getContext("2d");
fc.fillStyle="#170d14"; fc.fillRect(0,0,512,512);
for(let i=0;i<6000;i++){
  const c = Math.floor(12+rnd()*25);
  fc.fillStyle=`rgba(${c+15},${c},${c+11},${rnd()*.14})`;
  fc.fillRect(rnd()*512,rnd()*512,1+rnd()*2,1);
}
for(let i=0;i<17;i++){
  fc.strokeStyle="rgba(117,67,39,.22)"; fc.lineWidth=2;
  fc.beginPath(); fc.moveTo(i*32,0); fc.lineTo(i*32,512); fc.stroke();
}
const floorMap = new THREE.CanvasTexture(floorTex);
floorMap.wrapS=floorMap.wrapT=THREE.RepeatWrapping;
floorMap.repeat.set(5,5);
const floorMat = new THREE.MeshStandardMaterial({map:floorMap,color:0x4d2730,roughness:.72,metalness:.05});
const floor = mesh(new THREE.PlaneGeometry(34,28),floorMat,0,0,1);
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; root.add(floor);

const stage = group();
stage.position.set(0,.18,-3.5); root.add(stage);
const stageDeck = cylinder(6.65,6.9,.42,mats.wood,0,0,0,64); stageDeck.scale.z=.54; stage.add(stageDeck);
const stageTop = mesh(new THREE.CylinderGeometry(6.65,6.65,.05,64),new THREE.MeshStandardMaterial({color:0x31150f,roughness:.52}),0,.235,0);
stageTop.scale.z=.54; stage.add(stageTop);
for(let i=0;i<20;i++){
  const a=i/20*Math.PI*2, x=Math.cos(a)*6.73, z=Math.sin(a)*3.62;
  const bulb=sphere(.075,emission(0xff9f45,1.8),x,.37,z); stage.add(bulb);
}
const trim = new THREE.Mesh(new THREE.TorusGeometry(6.7,.07,8,64),mats.gold);
trim.scale.z=.54; trim.rotation.x=Math.PI/2; trim.position.y=.22; stage.add(trim);

const curtain = group(); curtain.position.set(0,0,-7.0); root.add(curtain);
const wall = box(18,10,.3,new THREE.MeshStandardMaterial({color:0x160716,roughness:.9}),0,5,0); curtain.add(wall);
for(let i=0;i<24;i++){
  const x=-8.5+i*.74, h=7.8+rnd()*1.5;
  const panel=mesh(new THREE.CylinderGeometry(.39,.53,h,16,1,false),mats.velvet,x,h/2+.4,-.22);
  panel.scale.z=.35; panel.castShadow=true; curtain.add(panel);
}
const valance = box(18.2,.65,.46,mats.velvet,0,9.45,-.02); curtain.add(valance);
for(let i=0;i<30;i++) curtain.add(sphere(.035,emission(0xff9c45,1.5),-8.65+i*.595,9.05,.27));

function arch(x) {
  const g=group(); g.position.x=x; root.add(g);
  g.add(box(.35,7,.35,mats.black,0,3.5,-6.45));
  g.add(box(.35,7,.35,mats.black,0,3.5,2.6));
  const ring=new THREE.Mesh(new THREE.TorusGeometry(4.53,.17,10,32,Math.PI),mats.gold);
  ring.position.set(0,6.95,-1.9); ring.rotation.z=Math.PI/2; ring.scale.z=1.0; g.add(ring);
}
arch(-9); arch(9);

const artDeco = group(); artDeco.position.set(0,5.2,-6.55); root.add(artDeco);
for(let i=0;i<3;i++){
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.35+i*.42,.032,8,32),mats.gold);
  ring.rotation.x=Math.PI/2; ring.position.z=.03; artDeco.add(ring);
}
artDeco.add(disk(.28,emission(0xffb64f,1.4),0,0,.05));

function createBass() {
  const g=group(); g.position.set(-3.1,.5,-3.0); g.rotation.y=.18; root.add(g);
  const bodyMat=new THREE.MeshStandardMaterial({color:0x5c2110,roughness:.27,metalness:.05});
  const lower=mesh(new THREE.SphereGeometry(.78,26,18),bodyMat,0,1.53,0); lower.scale.set(.83,1.25,.34); g.add(lower);
  const upper=mesh(new THREE.SphereGeometry(.59,26,18),bodyMat,0,2.55,0); upper.scale.set(.84,1.2,.34); g.add(upper);
  g.add(box(.22,1.67,.08,mats.black,0,2.1,-.35));
  g.add(box(.18,2.25,.12,mats.woodLight,0,4.27,0));
  const scroll=sphere(.22,mats.woodLight,0,5.48,0); scroll.scale.z=.65; g.add(scroll);
  g.add(rod(v3(0,.35,0),v3(0,.72,0),.035,mats.chrome));
  for(const x of [-.07,-.023,.023,.07]) g.add(rod(v3(x,1.12,-.38),v3(x,5.35,-.08),.011,mats.chrome));
  for(const s of [-1,1]){
    const peg=rod(v3(0,5.04,0),v3(s*.35,5.04,0),.035,mats.black); g.add(peg);
    g.add(sphere(.10,mats.black,s*.39,5.04,0));
  }
  const bridge=box(.49,.4,.07,mats.cream,0,2.27,-.37); g.add(bridge);
  return g;
}
const bass=createBass();

function createPiano() {
  const g=group(); g.position.set(2.25,.46,-3.65); g.rotation.y=-.18; root.add(g);
  const shell=new THREE.MeshStandardMaterial({color:0x100c11,roughness:.16,metalness:.38});
  const body=box(3.7,.72,1.8,shell,0,1.58,0); g.add(body);
  const curved=mesh(new THREE.SphereGeometry(1.55,32,16),shell,.75,1.6,.22); curved.scale.set(1.2,.4,.62); g.add(curved);
  const keys=box(2.35,.11,.55,mats.ivory,-1.37,1.55,-.5); g.add(keys);
  for(let i=0;i<17;i++){
    const key=box(.06,.035,.27,mats.black,-2.36+i*.13,1.64,-.45); g.add(key);
  }
  const lid=box(3.85,.10,1.85,shell,.18,3.18,.18); lid.rotation.z=-.34; g.add(lid);
  g.add(rod(v3(1.35,1.9,.45),v3(1.35,3.0,.45),.045,mats.gold));
  for(const [x,z] of [[-1.5,-.65],[1.45,-.65],[1.45,.65]]) {
    g.add(rod(v3(x,1.3,z),v3(x,.18,z),.07,mats.black));
    g.add(sphere(.13,mats.gold,x,.17,z));
  }
  g.add(box(.13,.8,.13,mats.gold,-2.38,1.1,-.5));
  return g;
}
const piano=createPiano();

function drumHead(r,x,y,z,rotation=0) {
  const g=group(); g.position.set(x,y,z); g.rotation.z=rotation; root.add(g);
  const shell=cylinder(r,r,1.05,mats.drum,0,0,0,32); shell.rotation.z=Math.PI/2; g.add(shell);
  const head=cylinder(r*.94,r*.94,.045,mats.cream,.55,0,0,32); head.rotation.z=Math.PI/2; g.add(head);
  const hoop=torus(r,.045,mats.chrome,.58,0,0); hoop.rotation.y=Math.PI/2; g.add(hoop);
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2;g.add(sphere(.045,mats.chrome,.59,Math.cos(a)*r*.88,Math.sin(a)*r*.88));}
  return g;
}
function createDrums() {
  const g=group(); g.position.set(3.8,.45,-2.25); g.rotation.y=-.28; root.add(g);
  const kick=drumHead(1.05,0,1.05,0); root.remove(kick); g.add(kick);
  const tom1=drumHead(.55,-.28,2.05,-.18); root.remove(tom1); tom1.rotation.y=.1; g.add(tom1);
  const tom2=drumHead(.48,.75,1.91,-.18); root.remove(tom2); g.add(tom2);
  const floorTom=drumHead(.68,.95,1.05,.62); root.remove(floorTom); g.add(floorTom);
  for(const [x,z] of [[.45,.8],[1.35,.75],[-.45,.6]]) g.add(rod(v3(x,.7,z),v3(x,.05,z),.035,mats.chrome));
  function cymbal(x,z,h,r){
    g.add(rod(v3(x,.2,z),v3(x,h,z),.028,mats.chrome));
    const c=disk(r,mats.brass,x,h,z); c.scale.y=.45; c.rotation.z=.04; g.add(c);
    g.add(sphere(.08,mats.gold,x,h+.06,z));
    return c;
  }
  const ride=cymbal(1.55,.12,2.65,.88);
  const crash=cymbal(-1.2,.0,2.72,.76);
  const hat1=cymbal(-1.05,.68,1.9,.52);
  const hat2=cymbal(-1.05,.68,1.97,.52);
  g.userData.cymbals=[ride,crash,hat1,hat2];
  return g;
}
const drums=createDrums();

function createMic() {
  const g=group(); g.position.set(-.15,.42,-.95); root.add(g);
  g.add(cylinder(.44,.44,.045,mats.black,0,.02,0,32));
  g.add(rod(v3(0,.08,0),v3(0,3.1,0),.04,mats.chrome));
  for(let i=0;i<3;i++){const a=i/3*Math.PI*2;g.add(rod(v3(0,.08,0),v3(Math.cos(a)*.55,.02,Math.sin(a)*.55),.025,mats.chrome));}
  const head=mesh(new THREE.SphereGeometry(.23,24,16),mats.chrome,0,3.38,0); head.scale.y=1.28; g.add(head);
  const grill=torus(.205,.012,mats.black,0,3.38,0);
  for(let i=0;i<5;i++){const t=torus(.205-i*.027,.009,mats.black,0,3.38+i*.07,0);t.rotation.x=Math.PI/2;g.add(t);}
  g.add(grill);
  const collar=cylinder(.15,.18,.18,mats.black,0,3.12,0,20); g.add(collar);
  return g;
}
const mic=createMic();

function createTable(x,z,scale=1) {
  const g=group(); g.position.set(x,0,z); g.scale.setScalar(scale); root.add(g);
  g.add(cylinder(.68,.68,.11,mats.woodLight,0,1.14,0,32));
  g.add(torus(.68,.035,mats.gold,0,1.18,0));
  g.add(rod(v3(0,1.1,0),v3(0,.08,0),.065,mats.black));
  for(let i=0;i<3;i++){const a=i/3*Math.PI*2;g.add(rod(v3(0,.12,0),v3(Math.cos(a)*.47,.04,Math.sin(a)*.47),.035,mats.black));}
  const lamp=group(); lamp.position.y=1.25; g.add(lamp);
  lamp.add(cylinder(.09,.12,.09,mats.brass,0,0,0,16));
  lamp.add(cylinder(.2,.12,.18,new THREE.MeshStandardMaterial({color:0xff9a45,emissive:0xff5c18,emissiveIntensity:2,transparent:true,opacity:.83}),0,.14,0,20));
  const flame=sphere(.07,emission(0xffd46d,2.8),0,.31,0); lamp.add(flame);
  const light=new THREE.PointLight(0xff7733,1.35,3.2,2); light.position.set(0,.35,0); g.add(light);
  g.userData.flame=flame; return g;
}
const tables=[
  createTable(-4.6,3.25,1.05),createTable(-1.5,4.25,.87),createTable(2.1,4.45,.95),
  createTable(5.15,3.35,1.08),createTable(-6.5,1.1,.85),createTable(6.45,.6,.8)
];

function chair(x,z,rot) {
  const g=group();g.position.set(x,.05,z);g.rotation.y=rot;root.add(g);
  g.add(box(.7,.08,.68,mats.red,0,.55,0));
  g.add(box(.72,.72,.1,mats.red,0,.97,.29));
  for(const a of [[-.27,-.25],[.27,-.25],[-.27,.25],[.27,.25]])g.add(rod(v3(a[0],.54,a[1]),v3(a[0]*1.1,.02,a[1]*1.1),.035,mats.black));
}
chair(-4.6,4.38,.1);chair(-1.5,5.1,-.1);chair(2.1,5.33,.25);chair(5.15,4.55,-.2);chair(-6.45,1.95,.6);chair(6.45,1.35,-.7);

const haze = group(); root.add(haze);
for(let i=0;i<22;i++){
  const puff=sphere(.7+rnd()*1.5,mats.smoke,(rnd()-.5)*13,1+rnd()*5,-5+rnd()*7);
  puff.scale.set(1.3,.45,1); haze.add(puff);
}
const beamMatA=new THREE.MeshBasicMaterial({color:0xbe276d,transparent:true,opacity:.105,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending});
const beamMatB=new THREE.MeshBasicMaterial({color:0x3556c7,transparent:true,opacity:.1,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending});
function makeBeam(mat) {
  const b=mesh(new THREE.ConeGeometry(.95,10,32,1,true),mat,0,0,0);
  b.castShadow=false;b.receiveShadow=false; return b;
}
const beams=group(); root.add(beams);
const beam1=makeBeam(beamMatA), beam2=makeBeam(beamMatB);
beam1.position.set(-4.8,7.9,-4.6); beam2.position.set(4.8,7.9,-4.6);
beams.add(beam1,beam2);
beam1.rotation.z=-.58; beam2.rotation.z=.58;
beam1.rotation.x=Math.PI; beam2.rotation.x=Math.PI;

const ambient=new THREE.HemisphereLight(0x53386f,0x180c10,1.1);scene.add(ambient);
const key=new THREE.SpotLight(0xffbc7c,100,24,.4,.55,1.4);
key.position.set(-1.5,8,3);key.target.position.set(0,1,-3);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key,key.target);
const blue=new THREE.SpotLight(0x586ed5,80,22,.34,.65,1.5);
blue.position.set(6,7,1);blue.target.position.set(0,1,-3);scene.add(blue,blue.target);
const magenta=new THREE.SpotLight(0xb42660,62,21,.38,.72,1.4);
magenta.position.set(-6,7,0);magenta.target.position.set(0,1,-3);scene.add(magenta,magenta.target);
const rim=new THREE.PointLight(0xe19442,26,11,2);rim.position.set(0,5,-5.5);scene.add(rim);

const rig=group();rig.position.set(0,8.7,-1.3);root.add(rig);
rig.add(box(13,.12,.12,mats.black,0,0,0));
for(const x of [-5,-2.5,0,2.5,5]){
  rig.add(rod(v3(x,0,0),v3(x,-.45,0),.05,mats.black));
  rig.add(cylinder(.16,.1,.3,mats.black,x,-.55,0,16));
}

const clock=new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  controls.update();
  key.position.x=-1.8+Math.sin(t*.34)*4.2;
  blue.position.x=5+Math.sin(t*.27+1)*2.2;
  magenta.position.x=-5+Math.cos(t*.31)*2.0;
  beam1.rotation.z=-.56+Math.sin(t*.34)*.28;
  beam2.rotation.z=.56+Math.cos(t*.27)*.28;
  beam1.material.opacity=.075+Math.sin(t*.7)*.018;
  beam2.material.opacity=.075+Math.cos(t*.65)*.018;
  haze.children.forEach((p,i)=>{p.position.x+=Math.sin(t*.12+i)*.0015;p.position.y+=Math.sin(t*.21+i)*.001;});
  tables.forEach((table,i)=>{
    const flame=table.userData.flame;
    flame.scale.setScalar(.82+Math.sin(t*4+i*1.7)*.17);
    flame.material.emissiveIntensity=2.2+Math.sin(t*5+i)*.7;
  });
  drums.userData.cymbals.forEach((c,i)=>{c.rotation.z=Math.sin(t*1.25+i)*.025;});
  mic.rotation.y=Math.sin(t*.55)*.028;
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
