<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observatory Dome Interior</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02040a;
    }
    canvas { display: block; }
    #caption {
      position: fixed;
      left: 24px;
      bottom: 20px;
      color: rgba(205, 224, 238, 0.76);
      font: 11px/1.5 Georgia, serif;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 2px 8px #000;
    }
    #caption span {
      display: block;
      color: rgba(140, 177, 198, 0.5);
      font-size: 9px;
      letter-spacing: 0.15em;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="caption">
    North Meridian Observatory
    <span>Refractor tracking · sidereal drive engaged</span>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02050b);
    scene.fog = new THREE.FogExp2(0x071018, 0.017);

    const camera = new THREE.PerspectiveCamera(
      49,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(15.5, 8.8, 18.5);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 5.8, -0.8);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.16;
    controls.minDistance = 9;
    controls.maxDistance = 31;
    controls.maxPolarAngle = Math.PI * 0.49;

    let seed = 731294;
    function random() {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let value = Math.imul(seed ^ seed >>> 15, 1 | seed);
      value = value + Math.imul(value ^ value >>> 7, 61 | value) ^ value;
      return ((value ^ value >>> 14) >>> 0) / 4294967296;
    }

    function range(min, max) {
      return min + (max - min) * random();
    }

    function choose(values) {
      return values[Math.floor(random() * values.length)];
    }

    const metalDark = new THREE.MeshStandardMaterial({
      color: 0x20262a,
      roughness: 0.48,
      metalness: 0.75
    });
    const iron = new THREE.MeshStandardMaterial({
      color: 0x31383b,
      roughness: 0.58,
      metalness: 0.82
    });
    const paintedSteel = new THREE.MeshStandardMaterial({
      color: 0x45545a,
      roughness: 0.62,
      metalness: 0.58
    });
    const brass = new THREE.MeshStandardMaterial({
      color: 0x9b7130,
      roughness: 0.32,
      metalness: 0.92
    });
    const antiqueBrass = new THREE.MeshStandardMaterial({
      color: 0x5f4a25,
      roughness: 0.5,
      metalness: 0.82
    });
    const telescopeIvory = new THREE.MeshStandardMaterial({
      color: 0xc8c2ac,
      roughness: 0.36,
      metalness: 0.18
    });
    const redPaint = new THREE.MeshStandardMaterial({
      color: 0x512522,
      roughness: 0.55,
      metalness: 0.3
    });
    const wood = new THREE.MeshStandardMaterial({
      color: 0x392517,
      roughness: 0.72,
      metalness: 0.04
    });
    const woodLight = new THREE.MeshStandardMaterial({
      color: 0x654329,
      roughness: 0.66,
      metalness: 0.05
    });
    const concrete = new THREE.MeshStandardMaterial({
      color: 0x45494a,
      roughness: 0.93,
      metalness: 0.02
    });
    const paper = new THREE.MeshStandardMaterial({
      color: 0xd2cbb0,
      roughness: 0.9,
      metalness: 0
    });
    const rubber = new THREE.MeshStandardMaterial({
      color: 0x111315,
      roughness: 0.85,
      metalness: 0.05
    });
    const glass = new THREE.MeshPhysicalMaterial({
      color: 0x4b83a0,
      roughness: 0.08,
      metalness: 0.05,
      transmission: 0.35,
      transparent: true,
      opacity: 0.68
    });

    function mesh(geometry, material, parent = scene) {
      const object = new THREE.Mesh(geometry, material);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function box(sizeX, sizeY, sizeZ, material, parent = scene) {
      return mesh(new THREE.BoxGeometry(sizeX, sizeY, sizeZ), material, parent);
    }

    function cylinder(radiusTop, radiusBottom, height, segments, material, parent = scene) {
      return mesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
        material,
        parent
      );
    }

    function rodBetween(start, end, radius, material, parent = scene, segments = 10) {
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();
      const rod = cylinder(radius, radius, length, segments, material, parent);
      rod.position.copy(start).add(end).multiplyScalar(0.5);
      rod.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      return rod;
    }

    function canvasTexture(width, height, drawFunction) {
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext('2d');
      drawFunction(context, width, height);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    function placeOnWall(object, angle, height, radius) {
      object.position.set(
        Math.cos(angle) * radius,
        height,
        Math.sin(angle) * radius
      );
      object.lookAt(0, height, 0);
    }

    const domeRadius = 12.8;
    const domeBase = 3.2;
    const slitCenter = -Math.PI / 2;
    const slitHalfWidth = 0.235;
    const domePositions = [];
    const longitudeSegments = 52;
    const latitudeSegments = 13;

    function angularDistance(a, b) {
      return Math.atan2(Math.sin(a - b), Math.cos(a - b));
    }

    function domePoint(theta, phi) {
      const horizontalRadius = domeRadius * Math.cos(theta);
      return new THREE.Vector3(
        horizontalRadius * Math.cos(phi),
        domeBase + domeRadius * Math.sin(theta),
        horizontalRadius * Math.sin(phi)
      );
    }

    for (let lat = 0; lat < latitudeSegments; lat++) {
      const theta0 = lat / latitudeSegments * (Math.PI * 0.5 - 0.045);
      const theta1 = (lat + 1) / latitudeSegments * (Math.PI * 0.5 - 0.045);

      for (let lon = 0; lon < longitudeSegments; lon++) {
        const phi0 = lon / longitudeSegments * Math.PI * 2;
        const phi1 = (lon + 1) / longitudeSegments * Math.PI * 2;
        const phiMid = (phi0 + phi1) * 0.5;

        if (Math.abs(angularDistance(phiMid, slitCenter)) < slitHalfWidth) {
          continue;
        }

        const p00 = domePoint(theta0, phi0);
        const p10 = domePoint(theta0, phi1);
        const p01 = domePoint(theta1, phi0);
        const p11 = domePoint(theta1, phi1);

        domePositions.push(
          p00.x, p00.y, p00.z,
          p10.x, p10.y, p10.z,
          p11.x, p11.y, p11.z,
          p00.x, p00.y, p00.z,
          p11.x, p11.y, p11.z,
          p01.x, p01.y, p01.z
        );
      }
    }

    const domeGeometry = new THREE.BufferGeometry();
    domeGeometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(domePositions, 3)
    );
    domeGeometry.computeVertexNormals();

    const domeMaterial = new THREE.MeshStandardMaterial({
      color: 0x59656a,
      roughness: 0.74,
      metalness: 0.42,
      side: THREE.DoubleSide
    });
    const domeShell = mesh(domeGeometry, domeMaterial);
    domeShell.castShadow = false;
    domeShell.receiveShadow = true;

    const lowerWall = mesh(
      new THREE.CylinderGeometry(
        domeRadius,
        domeRadius,
        domeBase + 0.15,
        64,
        1,
        true
      ),
      new THREE.MeshStandardMaterial({
        color: 0x424c50,
        roughness: 0.82,
        metalness: 0.25,
        side: THREE.BackSide
      })
    );
    lowerWall.position.y = domeBase * 0.5;
    lowerWall.castShadow = false;

    for (let lat = 0; lat <= 6; lat++) {
      const theta = 0.04 + lat / 7 * 1.25;
      const pathPoints = [];
      const start = slitCenter + slitHalfWidth + 0.03;
      const span = Math.PI * 2 - slitHalfWidth * 2 - 0.06;

      for (let step = 0; step <= 72; step++) {
        pathPoints.push(domePoint(theta, start + span * step / 72));
      }

      const curve = new THREE.CatmullRomCurve3(pathPoints, false);
      const rib = mesh(
        new THREE.TubeGeometry(curve, 120, 0.045, 6, false),
        iron
      );
      rib.castShadow = false;
    }

    for (let lon = 0; lon < 18; lon++) {
      const phi = lon / 18 * Math.PI * 2;
      if (Math.abs(angularDistance(phi, slitCenter)) < slitHalfWidth + 0.03) {
        continue;
      }

      const pathPoints = [];
      for (let step = 0; step <= 22; step++) {
        pathPoints.push(
          domePoint(step / 22 * (Math.PI * 0.5 - 0.08), phi)
        );
      }

      const curve = new THREE.CatmullRomCurve3(pathPoints);
      const rib = mesh(
        new THREE.TubeGeometry(curve, 40, 0.055, 6, false),
        metalDark
      );
      rib.castShadow = false;
    }

    const floorTexture = canvasTexture(512, 512, (context, width, height) => {
      context.fillStyle = '#313638';
      context.fillRect(0, 0, width, height);

      for (let index = 0; index < 3200; index++) {
        const shade = Math.floor(range(34, 76));
        context.fillStyle = `rgba(${shade},${shade + 3},${shade + 4},${range(0.03, 0.14)})`;
        const size = range(0.5, 3.2);
        context.fillRect(random() * width, random() * height, size, size);
      }

      context.strokeStyle = 'rgba(10,13,14,0.32)';
      context.lineWidth = 3;
      context.beginPath();
      context.moveTo(width * 0.5, 0);
      context.lineTo(width * 0.5, height);
      context.moveTo(0, height * 0.5);
      context.lineTo(width, height * 0.5);
      context.stroke();

      context.strokeStyle = 'rgba(130,145,148,0.08)';
      context.lineWidth = 1;
      for (let grid = 0; grid <= 8; grid++) {
        const value = grid * width / 8;
        context.beginPath();
        context.moveTo(value, 0);
        context.lineTo(value, height);
        context.moveTo(0, value);
        context.lineTo(width, value);
        context.stroke();
      }
    });
    floorTexture.wrapS = THREE.RepeatWrapping;
    floorTexture.wrapT = THREE.RepeatWrapping;
    floorTexture.repeat.set(5, 5);

    const floor = mesh(
      new THREE.CircleGeometry(domeRadius - 0.2, 80),
      new THREE.MeshStandardMaterial({
        map: floorTexture,
        color: 0x9aa0a0,
        roughness: 0.9,
        metalness: 0.08
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0.02;

    const floorRing = mesh(
      new THREE.TorusGeometry(8.2, 0.11, 10, 80),
      antiqueBrass
    );
    floorRing.rotation.x = Math.PI / 2;
    floorRing.position.y = 0.07;

    const starVertices = [];
    const starColors = [];
    for (let index = 0; index < 2200; index++) {
      const radius = range(32, 45);
      const azimuth = random() * Math.PI * 2;
      const elevation = range(-0.15, 1.15);
      const horizontal = Math.cos(elevation) * radius;

      starVertices.push(
        Math.cos(azimuth) * horizontal,
        5 + Math.sin(elevation) * radius,
        Math.sin(azimuth) * horizontal
      );

      const warmth = random();
      starColors.push(
        0.72 + warmth * 0.28,
        0.78 + warmth * 0.2,
        0.92 + (1 - warmth) * 0.08
      );
    }

    const starGeometry = new THREE.BufferGeometry();
    starGeometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(starVertices, 3)
    );
    starGeometry.setAttribute(
      'color',
      new THREE.Float32BufferAttribute(starColors, 3)
    );

    const stars = new THREE.Points(
      starGeometry,
      new THREE.PointsMaterial({
        size: 0.105,
        sizeAttenuation: true,
        vertexColors: true,
        transparent: true,
        opacity: 0.92,
        depthWrite: false
      })
    );
    scene.add(stars);

    const milkyWayTexture = canvasTexture(512, 1024, (context, width, height) => {
      context.clearRect(0, 0, width, height);
      const gradient = context.createLinearGradient(0, height, width, 0);
      gradient.addColorStop(0, 'rgba(28,38,72,0)');
      gradient.addColorStop(0.32, 'rgba(92,112,158,0.16)');
      gradient.addColorStop(0.5, 'rgba(205,211,220,0.34)');
      gradient.addColorStop(0.68, 'rgba(87,101,145,0.15)');
      gradient.addColorStop(1, 'rgba(20,28,55,0)');
      context.fillStyle = gradient;
      context.fillRect(0, 0, width, height);

      for (let index = 0; index < 2300; index++) {
        const progress = random();
        const centerX = width * (0.15 + progress * 0.7);
        const centerY = height * (0.88 - progress * 0.76);
        const spread = range(20, 118);
        const x = centerX + range(-spread, spread);
        const y = centerY + range(-spread * 1.8, spread * 1.8);
        const alpha = range(0.015, 0.16);
        const radius = range(0.3, 1.8);
        context.fillStyle = `rgba(220,228,244,${alpha})`;
        context.beginPath();
        context.arc(x, y, radius, 0, Math.PI * 2);
        context.fill();
      }
    });

    const milkyWay = mesh(
      new THREE.PlaneGeometry(15, 30),
      new THREE.MeshBasicMaterial({
        map: milkyWayTexture,
        transparent: true,
        opacity: 0.95,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
      })
    );
    milkyWay.position.set(0, 13.5, -32);
    milkyWay.rotation.z = -0.16;
    milkyWay.castShadow = false;
    milkyWay.receiveShadow = false;

    const slitFrameMaterial = new THREE.MeshStandardMaterial({
      color: 0x68757a,
      roughness: 0.5,
      metalness: 0.72
    });

    for (const side of [-1, 1]) {
      const edgeAngle = slitCenter + side * slitHalfWidth;
      const edgePoints = [];
      for (let step = 0; step <= 28; step++) {
        edgePoints.push(
          domePoint(step / 28 * (Math.PI * 0.5 - 0.055), edgeAngle)
        );
      }

      const edgeCurve = new THREE.CatmullRomCurve3(edgePoints);
      mesh(
        new THREE.TubeGeometry(edgeCurve, 60, 0.13, 8, false),
        slitFrameMaterial
      );

      const shutter = new THREE.Group();
      for (let panel = 0; panel < 8; panel++) {
        const theta = 0.06 + panel * 0.16;
        const center = domePoint(theta, edgeAngle + side * 0.07);
        const plate = box(0.62, 1.62, 0.12, paintedSteel, shutter);
        plate.position.copy(center);
        plate.lookAt(0, center.y, 0);
        plate.rotateZ(-side * theta * 0.26);
      }
      scene.add(shutter);
    }

    const catwalk = new THREE.Group();
    scene.add(catwalk);

    const catwalkRing = mesh(
      new THREE.TorusGeometry(10.1, 0.42, 8, 96),
      iron,
      catwalk
    );
    catwalkRing.rotation.x = Math.PI / 2;
    catwalkRing.scale.y = 0.42;
    catwalkRing.position.y = 7.05;

    const innerRail = mesh(
      new THREE.TorusGeometry(9.45, 0.055, 7, 96),
      antiqueBrass,
      catwalk
    );
    innerRail.rotation.x = Math.PI / 2;
    innerRail.position.y = 8.18;

    const outerRail = mesh(
      new THREE.TorusGeometry(10.65, 0.055, 7, 96),
      antiqueBrass,
      catwalk
    );
    outerRail.rotation.x = Math.PI / 2;
    outerRail.position.y = 8.18;

    for (let index = 0; index < 32; index++) {
      const angle = index / 32 * Math.PI * 2;
      for (const radius of [9.45, 10.65]) {
        const post = cylinder(0.035, 0.045, 1.15, 7, iron, catwalk);
        post.position.set(
          Math.cos(angle) * radius,
          7.61,
          Math.sin(angle) * radius
        );
      }
    }

    for (let index = 0; index < 24; index++) {
      const angle = index / 24 * Math.PI * 2;
      const beam = rodBetween(
        new THREE.Vector3(
          Math.cos(angle) * 9.45,
          6.9,
          Math.sin(angle) * 9.45
        ),
        new THREE.Vector3(
          Math.cos(angle) * 10.65,
          6.9,
          Math.sin(angle) * 10.65
        ),
        0.045,
        metalDark,
        catwalk
      );
      beam.castShadow = true;
    }

    const mount = new THREE.Group();
    scene.add(mount);

    const pierBase = cylinder(2.45, 2.65, 0.55, 32, concrete, mount);
    pierBase.position.y = 0.3;

    const pierStep = cylinder(1.95, 2.25, 0.72, 28, iron, mount);
    pierStep.position.y = 0.92;

    const pier = cylinder(1.26, 1.62, 4.85, 24, paintedSteel, mount);
    pier.position.y = 3.7;

    const pierCollar = cylinder(1.62, 1.62, 0.36, 28, brass, mount);
    pierCollar.position.y = 5.9;

    for (let index = 0; index < 12; index++) {
      const angle = index / 12 * Math.PI * 2;
      const bolt = cylinder(0.085, 0.085, 0.14, 8, metalDark, mount);
      bolt.position.set(
        Math.cos(angle) * 1.35,
        6.12,
        Math.sin(angle) * 1.35
      );
    }

    const equatorialHead = new THREE.Group();
    equatorialHead.position.y = 6.35;
    equatorialHead.rotation.z = -0.38;
    mount.add(equatorialHead);

    const polarHousing = cylinder(
      0.72,
      0.84,
      3.1,
      24,
      iron,
      equatorialHead
    );

    const polarCapA = cylinder(
      0.92,
      0.92,
      0.28,
      24,
      antiqueBrass,
      equatorialHead
    );
    polarCapA.position.y = 1.62;

    const polarCapB = cylinder(
      0.92,
      0.92,
      0.28,
      24,
      antiqueBrass,
      equatorialHead
    );
    polarCapB.position.y = -1.62;

    const trackingGroup = new THREE.Group();
    trackingGroup.position.set(0, 1.55, 0);
    equatorialHead.add(trackingGroup);

    const declinationAxis = cylinder(
      0.5,
      0.5,
      4.3,
      20,
      metalDark,
      trackingGroup
    );
    declinationAxis.rotation.z = Math.PI / 2;

    const declinationWheel = mesh(
      new THREE.TorusGeometry(1.15, 0.1, 10, 40),
      brass,
      trackingGroup
    );
    declinationWheel.rotation.y = Math.PI / 2;
    declinationWheel.position.x = -1.65;

    for (let index = 0; index < 12; index++) {
      const angle = index / 12 * Math.PI * 2;
      rodBetween(
        new THREE.Vector3(
          -1.65,
          Math.cos(angle) * 0.2,
          Math.sin(angle) * 0.2
        ),
        new THREE.Vector3(
          -1.65,
          Math.cos(angle) * 1.02,
          Math.sin(angle) * 1.02
        ),
        0.025,
        antiqueBrass,
        trackingGroup,
        6
      );
    }

    const counterRod = cylinder(
      0.075,
      0.075,
      3.45,
      10,
      brass,
      trackingGroup
    );
    counterRod.rotation.z = Math.PI / 2;
    counterRod.position.x = 2.5;

    const counterweight = cylinder(
      0.78,
      0.78,
      0.7,
      20,
      iron,
      trackingGroup
    );
    counterweight.rotation.z = Math.PI / 2;
    counterweight.position.x = 3.55;

    const opticalAssembly = new THREE.Group();
    opticalAssembly.position.set(-0.55, 0.1, -0.2);
    trackingGroup.add(opticalAssembly);

    const telescopeDirection = new THREE.Vector3(0, 0.43, -1).normalize();
    opticalAssembly.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      telescopeDirection
    );

    const mainTube = cylinder(
      0.63,
      0.82,
      8.8,
      32,
      telescopeIvory,
      opticalAssembly
    );
    mainTube.position.y = 0.45;

    const frontCell = cylinder(
      0.95,
      0.95,
      0.52,
      32,
      antiqueBrass,
      opticalAssembly
    );
    frontCell.position.y = 5.05;

    const frontRim = mesh(
      new THREE.TorusGeometry(0.96, 0.09, 12, 40),
      brass,
      opticalAssembly
    );
    frontRim.rotation.x = Math.PI / 2;
    frontRim.position.y = 5.33;

    const objective = cylinder(
      0.78,
      0.78,
      0.045,
      32,
      glass,
      opticalAssembly
    );
    objective.position.y = 5.34;

    const rearCell = cylinder(
      0.88,
      0.72,
      0.66,
      28,
      antiqueBrass,
      opticalAssembly
    );
    rearCell.position.y = -4.15;

    const focuser = cylinder(
      0.24,
      0.36,
      1.25,
      18,
      metalDark,
      opticalAssembly
    );
    focuser.position.y = -5.05;

    const eyepiece = cylinder(
      0.18,
      0.13,
      0.65,
      16,
      rubber,
      opticalAssembly
    );
    eyepiece.position.y = -5.93;

    for (const yPosition of [-2.2, 2.5]) {
      const clamp = mesh(
        new THREE.TorusGeometry(0.79, 0.105, 10, 36),
        brass,
        opticalAssembly
      );
      clamp.rotation.x = Math.PI / 2;
      clamp.position.y = yPosition;
    }

    const finder = new THREE.Group();
    finder.position.set(0.82, 0.1, 0);
    opticalAssembly.add(finder);

    const finderTube = cylinder(
      0.14,
      0.18,
      3.2,
      16,
      metalDark,
      finder
    );
    finderTube.position.y = 0.65;

    const finderLens = cylinder(
      0.17,
      0.17,
      0.05,
      16,
      glass,
      finder
    );
    finderLens.position.y = 2.28;

    const driveBox = box(1.2, 0.82, 1.25, redPaint, equatorialHead);
    driveBox.position.set(-1.35, -0.4, 0.82);

    const driveGear = cylinder(0.47, 0.47, 0.16, 24, brass, equatorialHead);
    driveGear.rotation.x = Math.PI / 2;
    driveGear.position.set(-1.35, -0.4, 1.52);

    const desk = new THREE.Group();
    desk.position.set(-6.9, 0, 3.6);
    desk.rotation.y = 0.32;
    scene.add(desk);

    const deskBody = box(4.3, 1.18, 1.65, wood, desk);
    deskBody.position.y = 1.35;

    const deskTop = box(4.65, 0.18, 1.9, woodLight, desk);
    deskTop.position.y = 2.03;

    const consolePanel = box(4.18, 1.25, 0.24, metalDark, desk);
    consolePanel.position.set(0, 2.7, -0.56);
    consolePanel.rotation.x = -0.38;

    for (const side of [-1, 1]) {
      const legFront = box(0.25, 1.8, 0.25, iron, desk);
      legFront.position.set(side * 1.75, 0.72, 0.55);
      const legRear = box(0.25, 1.8, 0.25, iron, desk);
      legRear.position.set(side * 1.75, 0.72, -0.55);
    }

    const dialGlows = [];
    const dialNeedles = [];

    for (let index = 0; index < 6; index++) {
      const x = -1.55 + index * 0.62;
      const dialFace = cylinder(
        0.22,
        0.22,
        0.035,
        24,
        new THREE.MeshStandardMaterial({
          color: 0x17312e,
          emissive: 0x2bb79c,
          emissiveIntensity: 0.55,
          roughness: 0.35,
          metalness: 0.15
        }),
        desk
      );
      dialFace.rotation.x = Math.PI / 2 - 0.38;
      dialFace.position.set(x, 2.73, -0.705);
      dialGlows.push(dialFace.material);

      const needle = box(0.018, 0.16, 0.015, paper, desk);
      needle.position.set(x, 2.75, -0.735);
      needle.rotation.z = range(-0.7, 0.7);
      needle.rotation.x = -0.38;
      dialNeedles.push(needle);
    }

    const indicatorLights = [];
    for (let index = 0; index < 10; index++) {
      const indicatorMaterial = new THREE.MeshStandardMaterial({
        color: index % 3 === 0 ? 0x7d2619 : 0x1b5b45,
        emissive: index % 3 === 0 ? 0xff3b18 : 0x36e7a7,
        emissiveIntensity: 0.8,
        roughness: 0.3
      });
      const indicator = mesh(
        new THREE.SphereGeometry(0.055, 10, 8),
        indicatorMaterial,
        desk
      );
      indicator.position.set(
        -1.65 + index * 0.36,
        2.42,
        -0.69
      );
      indicatorLights.push(indicatorMaterial);
    }

    for (let index = 0; index < 7; index++) {
      const leverBase = cylinder(0.09, 0.11, 0.08, 12, brass, desk);
      leverBase.rotation.x = Math.PI / 2;
      leverBase.position.set(-1.45 + index * 0.48, 2.18, 0.02);

      const lever = rodBetween(
        new THREE.Vector3(-1.45 + index * 0.48, 2.2, 0),
        new THREE.Vector3(
          -1.45 + index * 0.48 + range(-0.08, 0.08),
          2.47,
          range(-0.05, 0.1)
        ),
        0.025,
        brass,
        desk,
        8
      );
      lever.castShadow = true;
    }

    const stool = new THREE.Group();
    stool.position.set(-6.1, 0, 6.1);
    scene.add(stool);

    const stoolSeat = cylinder(0.7, 0.7, 0.18, 24, woodLight, stool);
    stoolSeat.position.y = 1.25;

    const stoolPost = cylinder(0.09, 0.12, 1.25, 12, iron, stool);
    stoolPost.position.y = 0.62;

    for (let index = 0; index < 4; index++) {
      const angle = index / 4 * Math.PI * 2;
      rodBetween(
        new THREE.Vector3(0, 0.25, 0),
        new THREE.Vector3(
          Math.cos(angle) * 0.65,
          0.05,
          Math.sin(angle) * 0.65
        ),
        0.045,
        iron,
        stool
      );
    }

    function createStarChart(title, variation) {
      return canvasTexture(512, 384, (context, width, height) => {
        context.fillStyle = '#d4caaa';
        context.fillRect(0, 0, width, height);

        for (let index = 0; index < 1100; index++) {
          const tone = Math.floor(range(115, 170));
          context.fillStyle = `rgba(${tone},${tone - 10},${tone - 30},0.05)`;
          context.fillRect(random() * width, random() * height, 1, 1);
        }

        context.strokeStyle = 'rgba(60,70,67,0.25)';
        context.lineWidth = 1;
        for (let ring = 1; ring <= 5; ring++) {
          context.beginPath();
          context.arc(
            width * 0.5,
            height * 0.54,
            ring * 31,
            0,
            Math.PI * 2
          );
          context.stroke();
        }

        for (let ray = 0; ray < 16; ray++) {
          const angle = ray / 16 * Math.PI * 2;
          context.beginPath();
          context.moveTo(width * 0.5, height * 0.54);
          context.lineTo(
            width * 0.5 + Math.cos(angle) * 165,
            height * 0.54 + Math.sin(angle) * 165
          );
          context.stroke();
        }

        const points = [];
        for (let index = 0; index < 28; index++) {
          const x = range(58, width - 58);
          const y = range(62, height - 38);
          points.push({ x, y });

          context.fillStyle = index % 6 === 0 ? '#7b3c2d' : '#263b43';
          context.beginPath();
          context.arc(x, y, range(2, 5), 0, Math.PI * 2);
          context.fill();
        }

        context.strokeStyle = 'rgba(65,77,80,0.72)';
        context.lineWidth = 1.6;
        context.beginPath();
        for (let index = 0; index < points.length - 1; index++) {
          if ((index + variation) % 3 !== 0) {
            context.moveTo(points[index].x, points[index].y);
            context.lineTo(points[index + 1].x, points[index + 1].y);
          }
        }
        context.stroke();

        context.fillStyle = '#293b3f';
        context.font = 'bold 20px Georgia';
        context.textAlign = 'center';
        context.fillText(title, width * 0.5, 30);

        context.font = '11px Georgia';
        context.fillText('RIGHT ASCENSION · DECLINATION', width * 0.5, 49);
        context.strokeStyle = '#4e5a57';
        context.strokeRect(12, 12, width - 24, height - 24);
      });
    }

    const chartData = [
      { angle: 2.42, height: 4.55, title: 'CYGNUS & LYRA' },
      { angle: 2.78, height: 3.55, title: 'THE NORTHERN SKY' },
      { angle: 3.22, height: 4.7, title: 'LUNAR LIMB STUDY' }
    ];

    chartData.forEach((data, index) => {
      const chart = mesh(
        new THREE.PlaneGeometry(2.8, 2.1),
        new THREE.MeshStandardMaterial({
          map: createStarChart(data.title, index),
          roughness: 0.88,
          metalness: 0,
          side: THREE.DoubleSide
        })
      );
      placeOnWall(chart, data.angle, data.height, 12.42);

      for (const corner of [
        [-1.31, 0.96],
        [1.31, 0.96],
        [-1.31, -0.96],
        [1.31, -0.96]
      ]) {
        const pin = mesh(
          new THREE.SphereGeometry(0.045, 8, 6),
          brass,
          chart
        );
        pin.position.set(corner[0], corner[1], 0.04);
      }
    });

    const bookcase = new THREE.Group();
    placeOnWall(bookcase, 0.56, 2.55, 11.68);
    scene.add(bookcase);

    const caseBack = box(4.2, 5.1, 0.3, wood, bookcase);
    const caseTop = box(4.5, 0.24, 0.78, woodLight, bookcase);
    caseTop.position.set(0, 2.64, 0.15);

    for (const side of [-1, 1]) {
      const sidePanel = box(0.26, 5.2, 0.82, woodLight, bookcase);
      sidePanel.position.set(side * 2.08, 0, 0.15);
    }

    for (let shelfIndex = 0; shelfIndex < 5; shelfIndex++) {
      const shelfY = -2.15 + shelfIndex * 1.05;
      const shelf = box(4.12, 0.16, 0.82, woodLight, bookcase);
      shelf.position.set(0, shelfY, 0.17);

      let cursor = -1.85;
      while (cursor < 1.72) {
        const bookWidth = range(0.13, 0.28);
        const bookHeight = range(0.55, 0.89);
        const bookDepth = range(0.42, 0.62);
        const bookMaterial = new THREE.MeshStandardMaterial({
          color: choose([
            0x58342d,
            0x394f51,
            0x6d5837,
            0x3b4030,
            0x63483c,
            0x233a49
          ]),
          roughness: 0.78,
          metalness: 0.02
        });
        const book = box(
          bookWidth,
          bookHeight,
          bookDepth,
          bookMaterial,
          bookcase
        );
        book.position.set(
          cursor + bookWidth * 0.5,
          shelfY + bookHeight * 0.5 + 0.08,
          0.32
        );
        book.rotation.z = range(-0.035, 0.035);
        cursor += bookWidth + range(0.025, 0.065);
      }
    }

    const ladder = new THREE.Group();
    ladder.position.set(8.65, 0, 6.1);
    ladder.rotation.y = -0.72;
    ladder.rotation.z = -0.09;
    scene.add(ladder);

    const ladderLeft = box(0.16, 6.5, 0.2, woodLight, ladder);
    ladderLeft.position.x = -0.62;
    const ladderRight = box(0.16, 6.5, 0.2, woodLight, ladder);
    ladderRight.position.x = 0.62;

    for (let rung = 0; rung < 10; rung++) {
      const rungObject = cylinder(0.065, 0.065, 1.25, 10, brass, ladder);
      rungObject.rotation.z = Math.PI / 2;
      rungObject.position.y = -2.72 + rung * 0.59;
    }

    const chartTable = new THREE.Group();
    chartTable.position.set(5.7, 0, 4.9);
    chartTable.rotation.y = -0.35;
    scene.add(chartTable);

    const tableTop = cylinder(1.55, 1.55, 0.18, 32, woodLight, chartTable);
    tableTop.position.y = 1.7;

    const tablePost = cylinder(0.18, 0.28, 1.62, 16, iron, chartTable);
    tablePost.position.y = 0.82;

    const openChart = mesh(
      new THREE.CircleGeometry(1.32, 48),
      new THREE.MeshStandardMaterial({
        map: createStarChart('SIDEREAL EPHEMERIS', 4),
        roughness: 0.88
      }),
      chartTable
    );
    openChart.rotation.x = -Math.PI / 2;
    openChart.position.y = 1.81;

    const redLampMaterial = new THREE.MeshStandardMaterial({
      color: 0x54190f,
      emissive: 0xff3a18,
      emissiveIntensity: 2.1,
      roughness: 0.28
    });
    const redLampShade = cylinder(
      0.26,
      0.5,
      0.52,
      20,
      redLampMaterial,
      chartTable
    );
    redLampShade.position.set(1.1, 2.7, 0.15);

    const redLampStem = cylinder(
      0.045,
      0.055,
      1.35,
      10,
      brass,
      chartTable
    );
    redLampStem.position.set(1.1, 2.15, 0.15);

    const redPointLight = new THREE.PointLight(0xff3a1b, 11, 5.5, 2);
    redPointLight.position.set(1.1, 2.5, 0.15);
    redPointLight.castShadow = true;
    redPointLight.shadow.mapSize.set(512, 512);
    chartTable.add(redPointLight);

    const loosePapers = new THREE.Group();
    scene.add(loosePapers);

    for (let index = 0; index < 5; index++) {
      const sheet = mesh(
        new THREE.PlaneGeometry(range(0.6, 1.1), range(0.45, 0.85)),
        paper,
        loosePapers
      );
      sheet.rotation.x = -Math.PI / 2;
      sheet.rotation.z = range(0, Math.PI * 2);
      sheet.position.set(range(-10, 10), 0.045 + index * 0.002, range(-3, 9));
    }

    const hemisphereLight = new THREE.HemisphereLight(
      0x7394b6,
      0x16110d,
      1.15
    );
    scene.add(hemisphereLight);

    const moonLight = new THREE.DirectionalLight(0xaecfff, 3.2);
    moonLight.position.set(-4, 18, -12);
    moonLight.target.position.set(0, 4, 0);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.set(2048, 2048);
    moonLight.shadow.camera.left = -16;
    moonLight.shadow.camera.right = 16;
    moonLight.shadow.camera.top = 18;
    moonLight.shadow.camera.bottom = -10;
    moonLight.shadow.camera.near = 1;
    moonLight.shadow.camera.far = 45;
    moonLight.shadow.bias = -0.0003;
    scene.add(moonLight, moonLight.target);

    const consoleLight = new THREE.PointLight(0x59e6cf, 8, 7, 2);
    consoleLight.position.set(-6.5, 3.1, 3.2);
    scene.add(consoleLight);

    const warmFill = new THREE.SpotLight(
      0xd8a36c,
      24,
      19,
      Math.PI / 5,
      0.65,
      1.7
    );
    warmFill.position.set(8, 11, 7);
    warmFill.target.position.set(0, 3, 0);
    warmFill.castShadow = true;
    warmFill.shadow.mapSize.set(1024, 1024);
    scene.add(warmFill, warmFill.target);

    const slitGlow = new THREE.SpotLight(
      0x8cbfff,
      18,
      28,
      Math.PI / 7,
      0.75,
      1.5
    );
    slitGlow.position.set(0, 15, -11);
    slitGlow.target.position.set(0, 5, 1);
    scene.add(slitGlow, slitGlow.target);

    const dustGeometry = new THREE.BufferGeometry();
    const dustPositions = [];
    for (let index = 0; index < 260; index++) {
      const radius = Math.sqrt(random()) * 11;
      const angle = random() * Math.PI * 2;
      dustPositions.push(
        Math.cos(angle) * radius,
        range(0.3, 14),
        Math.sin(angle) * radius
      );
    }
    dustGeometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(dustPositions, 3)
    );

    const dust = new THREE.Points(
      dustGeometry,
      new THREE.PointsMaterial({
        color: 0xbfd8dd,
        size: 0.028,
        transparent: true,
        opacity: 0.23,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      })
    );
    scene.add(dust);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();

      trackingGroup.rotation.y = Math.sin(elapsed * 0.08) * 0.018;
      opticalAssembly.rotation.z = Math.sin(elapsed * 0.055) * 0.004;

      stars.rotation.y = elapsed * 0.003;
      stars.material.opacity = 0.88 + Math.sin(elapsed * 0.72) * 0.05;
      milkyWay.material.opacity = 0.88 + Math.sin(elapsed * 0.19) * 0.06;

      dust.rotation.y = elapsed * 0.012;
      dust.position.y = Math.sin(elapsed * 0.2) * 0.08;

      dialGlows.forEach((material, index) => {
        material.emissiveIntensity =
          0.48 + Math.sin(elapsed * 1.6 + index * 0.72) * 0.14;
      });

      dialNeedles.forEach((needle, index) => {
        needle.rotation.z =
          Math.sin(elapsed * (0.25 + index * 0.035) + index) * 0.55;
      });

      indicatorLights.forEach((material, index) => {
        const pulse = Math.sin(elapsed * (1.2 + index * 0.08) + index * 1.7);
        material.emissiveIntensity = pulse > 0.52 ? 1.9 : 0.32;
      });

      redLampMaterial.emissiveIntensity =
        1.9 + Math.sin(elapsed * 1.35) * 0.18;
      redPointLight.intensity = 10.5 + Math.sin(elapsed * 1.35) * 1.2;
      consoleLight.intensity = 7.5 + Math.sin(elapsed * 0.9) * 0.6;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
