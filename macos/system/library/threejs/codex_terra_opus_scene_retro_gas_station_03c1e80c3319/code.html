<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Retro Gas Station</title>

  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#281211}
  canvas{display:block}
  #label{position:fixed;left:18px;bottom:15px;color:#f6c37e;font:11px/1.2 Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;opacity:.72;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">Route 66 &nbsp; • &nbsp; Last Gas for 120 Miles</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x6e2e22);
scene.fog = new THREE.Fog(0x9b5030, 70, 210);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(43, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(23, 14, 28);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.24;
controls.minDistance = 15;
controls.maxDistance = 58;
controls.maxPolarAngle = Math.PI * 0.48;

let seed = 1966;
function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a, b) {
  return a + (b - a) * rand();
}
function pick(list) {
  return list[Math.floor(rand() * list.length)];
}

function canvasTexture(draw, width = 512, height = 512) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  draw(ctx, width, height);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const concreteTexture = canvasTexture((ctx, w, h) => {
  ctx.fillStyle = '#8b7863';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 12000; i++) {
    const v = 105 + Math.floor(rand() * 55);
    ctx.fillStyle = `rgba(${v},${v - 8},${v - 16},${rand() * .12})`;
    ctx.fillRect(rand() * w, rand() * h, 1 + rand() * 2, 1 + rand() * 2);
  }
  ctx.strokeStyle = 'rgba(59,45,38,.60)';
  ctx.lineWidth = 3;
  for (let i = 0; i < 42; i++) {
    let x = rand() * w;
    let y = rand() * h;
    ctx.beginPath();
    ctx.moveTo(x, y);
    for (let j = 0; j < 5; j++) {
      x += range(-24, 24);
      y += range(-22, 22);
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}, 1024, 1024);
concreteTexture.wrapS = concreteTexture.wrapT = THREE.RepeatWrapping;
concreteTexture.repeat.set(5, 5);

const asphaltTexture = canvasTexture((ctx, w, h) => {
  ctx.fillStyle = '#563e32';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 17000; i++) {
    const c = Math.floor(range(45, 115));
    ctx.fillStyle = `rgba(${c},${c - 7},${c - 11},${range(.08, .35)})`;
    const s = range(.5, 2.6);
    ctx.fillRect(rand() * w, rand() * h, s, s);
  }
  ctx.strokeStyle = 'rgba(35,26,25,.70)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 50; i++) {
    let x = rand() * w;
    let y = rand() * h;
    ctx.beginPath();
    ctx.moveTo(x, y);
    for (let j = 0; j < 7; j++) {
      x += range(-31, 31);
      y += range(-15, 15);
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}, 1024, 1024);
asphaltTexture.wrapS = asphaltTexture.wrapT = THREE.RepeatWrapping;
asphaltTexture.repeat.set(7, 7);

const sandTexture = canvasTexture((ctx, w, h) => {
  const gradient = ctx.createLinearGradient(0, 0, 0, h);
  gradient.addColorStop(0, '#bb7250');
  gradient.addColorStop(1, '#8f4b38');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 11000; i++) {
    const c = Math.floor(range(110, 195));
    ctx.fillStyle = `rgba(${c + 30},${c},${Math.max(30,c - 40)},${range(.04,.17)})`;
    ctx.fillRect(rand() * w, rand() * h, range(.5, 2), range(.5, 2));
  }
}, 512, 512);
sandTexture.wrapS = sandTexture.wrapT = THREE.RepeatWrapping;
sandTexture.repeat.set(12, 12);

const rustyTexture = canvasTexture((ctx, w, h) => {
  ctx.fillStyle = '#a84626';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 2900; i++) {
    const red = Math.floor(range(70, 205));
    const green = Math.floor(range(34, 99));
    ctx.fillStyle = `rgba(${red},${green},${range(20,55)},${range(.12,.52)})`;
    ctx.beginPath();
    ctx.arc(rand() * w, rand() * h, range(1, 12), 0, Math.PI * 2);
    ctx.fill();
  }
}, 512, 512);

const signTexture = canvasTexture((ctx, w, h) => {
  ctx.fillStyle = '#f7dd9c';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#b83024';
  ctx.fillRect(11, 11, w - 22, h - 22);
  ctx.strokeStyle = '#f8c965';
  ctx.lineWidth = 13;
  ctx.strokeRect(28, 28, w - 56, h - 56);
  ctx.fillStyle = '#fff2b9';
  ctx.textAlign = 'center';
  ctx.font = 'bold 62px Arial';
  ctx.fillText('GAS', w / 2, 157);
  ctx.font = 'bold 41px Arial';
  ctx.fillText('OASIS', w / 2, 223);
  ctx.fillStyle = '#172d3b';
  ctx.font = 'bold 30px Arial';
  ctx.fillText('SERVICE', w / 2, 286);
  ctx.fillStyle = '#f9d16b';
  ctx.font = 'bold 23px Arial';
  ctx.fillText('OPEN 24 HOURS', w / 2, 348);
}, 512, 400);

const sodaTexture = canvasTexture((ctx, w, h) => {
  ctx.fillStyle = '#20394a';
  ctx.fillRect(0, 0, w, h);
  const g = ctx.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, '#ec4933');
  g.addColorStop(.48, '#ee392d');
  g.addColorStop(.49, '#f4c34e');
  g.addColorStop(.54, '#f4c34e');
  g.addColorStop(.55, '#b92d2c');
  g.addColorStop(1, '#a81f26');
  ctx.fillStyle = g;
  ctx.fillRect(22, 18, w - 44, h - 36);
  ctx.fillStyle = '#ffe16c';
  ctx.font = 'bold italic 52px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('FIZZ', w / 2, 126);
  ctx.fillStyle = '#fff4c2';
  ctx.font = 'bold 29px Arial';
  ctx.fillText('ICE COLD', w / 2, 176);
  ctx.fillStyle = 'rgba(255,249,190,.62)';
  ctx.fillRect(58, 220, w - 116, 152);
  ctx.fillStyle = '#1c4551';
  for (let i = 0; i < 5; i++) {
    ctx.fillRect(78 + i * 70, 246, 38, 92);
    ctx.fillStyle = '#efdd9e';
    ctx.fillRect(80 + i * 70, 264, 34, 15);
    ctx.fillStyle = '#1c4551';
  }
}, 512, 768);

const windowTexture = canvasTexture((ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#fff0ac');
  g.addColorStop(.18, '#cc9150');
  g.addColorStop(.58, '#25465a');
  g.addColorStop(1, '#132535');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(254,226,150,.45)';
  ctx.lineWidth = 4;
  for (let i = -h; i < w; i += 90) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i + h, h);
    ctx.stroke();
  }
}, 256, 256);

const skyTexture = canvasTexture((ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#25112b');
  g.addColorStop(.34, '#8d3340');
  g.addColorStop(.66, '#e16635');
  g.addColorStop(.83, '#f0a052');
  g.addColorStop(1, '#f4be73');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 110; i++) {
    ctx.fillStyle = `rgba(255,190,105,${range(.025,.12)})`;
    ctx.beginPath();
    ctx.ellipse(rand() * w, range(h * .25, h * .75), range(20, 105), range(2, 15), 0, 0, Math.PI * 2);
    ctx.fill();
  }
}, 1024, 1024);

const materials = {
  sand: new THREE.MeshStandardMaterial({ map: sandTexture, roughness: 1 }),
  concrete: new THREE.MeshStandardMaterial({ map: concreteTexture, roughness: .94, color: 0xc2a17a }),
  asphalt: new THREE.MeshStandardMaterial({ map: asphaltTexture, roughness: .96 }),
  cream: new THREE.MeshStandardMaterial({ color: 0xe7c889, roughness: .75 }),
  red: new THREE.MeshStandardMaterial({ color: 0xb83427, roughness: .56, metalness: .12 }),
  darkRed: new THREE.MeshStandardMaterial({ color: 0x6a211f, roughness: .63 }),
  teal: new THREE.MeshStandardMaterial({ color: 0x1e5862, roughness: .47, metalness: .18 }),
  darkTeal: new THREE.MeshStandardMaterial({ color: 0x123b46, roughness: .62 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xb8b7ac, metalness: .9, roughness: .22 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x131315, roughness: .92 }),
  rust: new THREE.MeshStandardMaterial({ map: rustyTexture, roughness: .84, metalness: .12 }),
  black: new THREE.MeshStandardMaterial({ color: 0x19191b, roughness: .7 }),
  glass: new THREE.MeshStandardMaterial({ map: windowTexture, roughness: .18, metalness: .25, emissive: 0x382719, emissiveIntensity: .18 }),
  cactus: new THREE.MeshStandardMaterial({ color: 0x385e42, roughness: .87 }),
  cactusLight: new THREE.MeshStandardMaterial({ color: 0x50794a, roughness: .8 }),
  yellow: new THREE.MeshStandardMaterial({ color: 0xf6bb42, roughness: .48, metalness: .1 }),
  white: new THREE.MeshStandardMaterial({ color: 0xffeac4, roughness: .55 }),
  glow: new THREE.MeshStandardMaterial({ color: 0xffc363, emissive: 0xff7d28, emissiveIntensity: 2.2, roughness: .45 }),
  redGlow: new THREE.MeshStandardMaterial({ color: 0xff5b40, emissive: 0xf32516, emissiveIntensity: 2.7 })
};

function mesh(geometry, material, x = 0, y = 0, z = 0) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(x, y, z);
  object.castShadow = true;
  object.receiveShadow = true;
  return object;
}
function box(w, h, d, material, x, y, z) {
  return mesh(new THREE.BoxGeometry(w, h, d), material, x, y, z);
}
function cylinder(radiusTop, radiusBottom, height, material, x, y, z, segments = 16) {
  return mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments), material, x, y, z);
}
function sphere(radius, material, x, y, z) {
  return mesh(new THREE.SphereGeometry(radius, 18, 12), material, x, y, z);
}
function addGroup(parent, child) {
  parent.add(child);
  return child;
}
function shadowTree(object) {
  object.traverse(child => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });
}

const sky = mesh(new THREE.SphereGeometry(240, 32, 20), new THREE.MeshBasicMaterial({
  map: skyTexture,
  side: THREE.BackSide,
  fog: false
}));
sky.rotation.y = -0.5;
scene.add(sky);

const sunDisc = mesh(new THREE.CircleGeometry(5.2, 40), new THREE.MeshBasicMaterial({
  color: 0xffbe63,
  transparent: true,
  opacity: .9,
  fog: false,
  side: THREE.DoubleSide
}), -54, 17, -110);
sunDisc.rotation.y = 0.44;
scene.add(sunDisc);

const desert = mesh(new THREE.PlaneGeometry(360, 360), materials.sand, 0, -0.18, 0);
desert.rotation.x = -Math.PI / 2;
scene.add(desert);

const road = mesh(new THREE.PlaneGeometry(90, 18), materials.asphalt, 2, -0.12, 19);
road.rotation.x = -Math.PI / 2;
road.rotation.z = -0.06;
scene.add(road);

const forecourt = mesh(new THREE.PlaneGeometry(33, 24), materials.concrete, -1, -0.07, 2);
forecourt.rotation.x = -Math.PI / 2;
scene.add(forecourt);

const roadStripeMaterial = new THREE.MeshStandardMaterial({ color: 0xd6ad64, roughness: .8 });
for (let i = -3; i < 4; i++) {
  const stripe = box(6, .025, .31, roadStripeMaterial, i * 13 + 3, -.08, 19);
  stripe.rotation.y = -0.06;
  scene.add(stripe);
}

const horizonDunes = new THREE.Group();
for (let i = 0; i < 25; i++) {
  const dune = mesh(
    new THREE.SphereGeometry(range(5, 15), 22, 10),
    new THREE.MeshStandardMaterial({ color: pick([0x9b4a36, 0xaa5940, 0x8f4335]), roughness: 1 }),
    range(-100, 100), range(1.5, 3.6), range(-75, -51)
  );
  dune.scale.y = range(.15, .34);
  dune.scale.z = range(.25, .55);
  dune.castShadow = false;
  horizonDunes.add(dune);
}
scene.add(horizonDunes);

function createOffice() {
  const group = new THREE.Group();
  const wallMat = new THREE.MeshStandardMaterial({ color: 0xc9a66f, roughness: .82 });
  const trimMat = new THREE.MeshStandardMaterial({ color: 0x73292a, roughness: .62 });
  group.add(box(13.4, 6.3, 8.1, wallMat, 3.3, 3.15, -5.0));
  group.add(box(13.75, .34, 8.45, trimMat, 3.3, 6.25, -5.0));
  group.add(box(14.05, .21, 8.7, materials.cream, 3.3, 6.56, -5.0));

  const roof = box(14.45, .48, 8.95, materials.darkRed, 3.3, 6.86, -5.0);
  roof.rotation.z = .03;
  group.add(roof);

  const garageFrame = new THREE.Group();
  garageFrame.add(box(5.7, 5.3, .28, materials.darkRed, 6.05, 2.72, -0.89));
  garageFrame.add(box(5.15, 4.66, .18, new THREE.MeshStandardMaterial({ color: 0x6d7068, roughness: .72 }), 6.05, 2.65, -0.72));
  for (let j = 0; j < 5; j++) {
    garageFrame.add(box(5.0, .09, .04, materials.cream, 6.05, .82 + j * .88, -0.62));
  }
  garageFrame.add(box(.25, 5.55, .38, materials.cream, 3.15, 2.75, -0.92));
  garageFrame.add(box(.25, 5.55, .38, materials.cream, 8.95, 2.75, -0.92));
  garageFrame.add(box(6.02, .25, .38, materials.cream, 6.05, 5.48, -0.92));
  group.add(garageFrame);

  const officeWindow = new THREE.Group();
  officeWindow.add(box(3.15, 2.3, .14, materials.glass, -.25, 3.6, -.9));
  officeWindow.add(box(3.45, .2, .3, materials.darkRed, -.25, 4.78, -.95));
  officeWindow.add(box(3.45, .2, .3, materials.darkRed, -.25, 2.42, -.95));
  officeWindow.add(box(.2, 2.55, .3, materials.darkRed, -1.95, 3.6, -.95));
  officeWindow.add(box(.2, 2.55, .3, materials.darkRed, 1.45, 3.6, -.95));
  officeWindow.add(box(.12, 2.25, .2, materials.darkRed, -.25, 3.6, -.98));
  group.add(officeWindow);

  const door = new THREE.Group();
  door.add(box(1.45, 3.25, .14, materials.teal, 1.82, 1.62, -.91));
  door.add(box(1.75, .18, .25, materials.darkRed, 1.82, 3.3, -.97));
  door.add(sphere(.10, materials.chrome, 2.35, 1.7, -1.03));
  group.add(door);

  const awning = new THREE.Group();
  awning.add(box(5.7, .18, 1.45, materials.red, -.15, 5.52, -.45));
  awning.add(box(5.9, .16, .2, materials.cream, -.15, 5.36, .18));
  const supports = [-2.65, 2.35];
  for (const sx of supports) {
    awning.add(box(.12, 1.2, .12, materials.darkRed, sx, 4.92, .1));
  }
  group.add(awning);

  const shopSign = new THREE.Group();
  shopSign.add(box(5.2, 1.1, .12, materials.darkRed, -.05, 7.35, -.8));
  shopSign.add(box(4.88, .78, .08, materials.yellow, -.05, 7.35, -.88));
  const signCanvas = canvasTexture((ctx, w, h) => {
    ctx.fillStyle = '#f3d264';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#94292b';
    ctx.font = 'bold 65px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('SUNSET', w / 2, 80);
    ctx.font = 'bold 30px Arial';
    ctx.fillText('SERVICE', w / 2, 132);
  }, 512, 160);
  const signFace = new THREE.Mesh(new THREE.PlaneGeometry(4.88, .78), new THREE.MeshBasicMaterial({ map: signCanvas }));
  signFace.position.set(-.05, 7.35, -.95);
  group.add(signFace);

  shadowTree(group);
  return group;
}
scene.add(createOffice());

function createCanopy() {
  const group = new THREE.Group();
  const roof = box(14.5, .55, 8.1, materials.cream, -4.8, 8.05, 1.2);
  group.add(roof);
  group.add(box(14.8, .33, 8.42, materials.red, -4.8, 7.71, 1.2));
  group.add(box(13.7, .14, .18, materials.yellow, -4.8, 7.5, -2.94));
  group.add(box(13.7, .14, .18, materials.yellow, -4.8, 7.5, 5.34));
  const poles = [
    [-10.7, -2.2], [-10.7, 4.5], [1.1, -2.2], [1.1, 4.5]
  ];
  for (const [px, pz] of poles) {
    group.add(cylinder(.24, .3, 7.55, materials.teal, px, 3.75, pz, 16));
    group.add(cylinder(.37, .37, .16, materials.chrome, px, .1, pz, 16));
    group.add(cylinder(.39, .34, .18, materials.darkRed, px, 7.47, pz, 16));
  }
  for (let i = 0; i < 6; i++) {
    const lamp = new THREE.PointLight(0xffbb72, 5, 9, 2);
    lamp.position.set(-9.5 + i * 2, 7.25, i % 2 ? 3.35 : -1.0);
    group.add(lamp);
    group.add(cylinder(.22, .22, .08, materials.glow, lamp.position.x, 7.45, lamp.position.z, 12));
  }
  shadowTree(group);
  return group;
}
scene.add(createCanopy());

function createPump(x, z, accent) {
  const group = new THREE.Group();
  const body = cylinder(.73, .79, 3.25, materials.cream, 0, 1.72, 0, 20);
  body.scale.z = .76;
  group.add(body);
  group.add(cylinder(.78, .78, .2, materials.darkRed, 0, .2, 0, 20));
  group.add(cylinder(.77, .74, .22, accent, 0, 3.34, 0, 20));
  group.add(box(1.13, 1.23, .22, materials.darkTeal, 0, 2.25, -.59));
  group.add(box(.92, .85, .08, new THREE.MeshStandardMaterial({
    color: 0x21333a, roughness: .25, metalness: .35, emissive: 0x102a32, emissiveIntensity: .25
  }), 0, 2.3, -.72));
  group.add(box(1.05, .12, .1, accent, 0, 2.98, -.76));
  group.add(sphere(.075, materials.redGlow, -.29, 3.06, -.76));
  group.add(sphere(.075, materials.redGlow, .29, 3.06, -.76));
  group.add(box(.18, .6, .15, materials.chrome, .83, 2.5, -.12));
  const hoseCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(.84, 2.68, -.15),
    new THREE.Vector3(1.23, 2.36, -.08),
    new THREE.Vector3(1.17, 1.48, .32),
    new THREE.Vector3(.72, 1.12, .47),
    new THREE.Vector3(.62, 1.44, .48)
  ]);
  const hose = new THREE.Mesh(new THREE.TubeGeometry(hoseCurve, 28, .065, 8, false), materials.rubber);
  hose.castShadow = true;
  group.add(hose);
  const nozzle = new THREE.Group();
  nozzle.add(cylinder(.1, .1, .55, materials.chrome, .61, 1.48, .48, 10));
  nozzle.children[0].rotation.z = Math.PI / 2;
  nozzle.add(box(.25, .1, .12, materials.black, .36, 1.48, .48));
  group.add(nozzle);
  group.position.set(x, 0, z);
  shadowTree(group);
  return group;
}
const pumpA = createPump(-7.5, .5, materials.red);
const pumpB = createPump(-3.7, .5, materials.teal);
scene.add(pumpA, pumpB);

function createPickup() {
  const group = new THREE.Group();
  const paint = new THREE.MeshStandardMaterial({ color: 0x9e3d2b, roughness: .5, metalness: .2 });
  const faded = new THREE.MeshStandardMaterial({ color: 0xb94e31, roughness: .58, metalness: .12 });
  const windshield = new THREE.MeshStandardMaterial({ color: 0x35525c, roughness: .12, metalness: .35, emissive: 0x273334, emissiveIntensity: .25 });
  const chassis = box(6.7, .35, 2.45, materials.black, 0, .72, 0);
  group.add(chassis);
  group.add(box(3.05, 1.0, 2.3, paint, -1.3, 1.35, 0));
  group.add(box(2.65, .88, 2.2, faded, 1.9, 1.25, 0));
  group.add(box(2.4, .16, 2.35, materials.rust, 2.25, 1.72, 0));
  group.add(box(2.1, 1.05, 2.1, paint, -.75, 2.2, 0));
  const hood = box(1.35, .27, 2.22, faded, -2.95, 1.93, 0);
  hood.rotation.z = -.04;
  group.add(hood);
  group.add(box(.9, .72, 1.84, windshield, -.48, 2.32, 0));
  group.add(box(.08, .87, 2.05, materials.chrome, -.99, 2.38, 0));
  group.add(box(.08, .87, 2.05, materials.chrome, .05, 2.38, 0));
  group.add(box(1.13, .08, 2.05, materials.chrome, -.48, 2.81, 0));
  group.add(box(3.52, .15, 2.55, materials.chrome, -.2, .82, 0));
  group.add(box(.12, .18, 1.78, materials.cream, -3.67, 1.44, 0));
  group.add(box(.15, .65, 2.04, materials.chrome, -3.58, 1.07, 0));
  group.add(sphere(.16, materials.glow, -3.67, 1.52, -.76));
  group.add(sphere(.16, materials.glow, -3.67, 1.52, .76));
  group.add(box(.45, .12, 1.34, materials.darkRed, 3.4, 1.18, 0));
  group.add(sphere(.11, materials.redGlow, 3.48, 1.43, -.73));
  group.add(sphere(.11, materials.redGlow, 3.48, 1.43, .73));
  for (const tx of [-2.15, 2.1]) {
    for (const tz of [-1.18, 1.18]) {
      const tire = new THREE.Mesh(new THREE.CylinderGeometry(.58, .58, .34, 18), materials.rubber);
      tire.rotation.x = Math.PI / 2;
      tire.position.set(tx, .69, tz);
      tire.castShadow = true;
      group.add(tire);
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(.23, .23, .36, 12), materials.chrome);
      hub.rotation.x = Math.PI / 2;
      hub.position.set(tx, .69, tz);
      group.add(hub);
    }
  }
  group.add(box(.14, .12, .7, materials.chrome, -.12, 2.04, -1.18));
  group.add(box(.14, .12, .7, materials.chrome, -.12, 2.04, 1.18));
  group.position.set(5.2, 0, 5.15);
  group.rotation.y = -.32;
  shadowTree(group);
  return group;
}
const pickup = createPickup();
scene.add(pickup);

function createVendingMachine() {
  const group = new THREE.Group();
  const caseMat = new THREE.MeshStandardMaterial({ color: 0xa42729, roughness: .45, metalness: .2 });
  group.add(box(1.45, 3.2, .95, caseMat, 0, 1.62, 0));
  group.add(box(1.18, 2.66, .04, new THREE.MeshBasicMaterial({ map: sodaTexture }), 0, 1.85, -.5));
  group.add(box(1.54, .12, 1.04, materials.chrome, 0, .12, 0));
  group.add(cylinder(.08, .08, .12, materials.chrome, .48, .83, -.56, 12));
  const light = new THREE.PointLight(0x78d9ff, 1.7, 6, 2);
  light.position.set(0, 2.2, -.8);
  group.add(light);
  group.position.set(-2.0, 0, -5.7);
  shadowTree(group);
  return { group, light };
}
const vending = createVendingMachine();
scene.add(vending.group);

function createTireStack() {
  const group = new THREE.Group();
  for (let i = 0; i < 4; i++) {
    const tire = new THREE.Mesh(new THREE.TorusGeometry(.5, .18, 10, 20), materials.rubber);
    tire.rotation.x = Math.PI / 2;
    tire.position.set(range(-.08,.08), .28 + i * .34, range(-.08,.08));
    tire.rotation.z = range(-.14,.14);
    tire.castShadow = true;
    tire.receiveShadow = true;
    group.add(tire);
  }
  group.position.set(10.8, 0, -1.4);
  return group;
}
scene.add(createTireStack());

function createCactus(x, z, scale = 1) {
  const group = new THREE.Group();
  const trunk = cylinder(.3 * scale, .36 * scale, 3.9 * scale, materials.cactus, 0, 1.95 * scale, 0, 12);
  group.add(trunk);
  group.add(sphere(.31 * scale, materials.cactusLight, 0, 3.88 * scale, 0));
  const sideA = new THREE.Group();
  sideA.add(cylinder(.2 * scale, .22 * scale, 1.5 * scale, materials.cactus, 0, .75 * scale, 0, 10));
  sideA.position.set(.65 * scale, 2.12 * scale, 0);
  sideA.rotation.z = -Math.PI / 2;
  group.add(sideA);
  group.add(cylinder(.2 * scale, .22 * scale, 1.13 * scale, materials.cactus, 1.29 * scale, 2.71 * scale, 0, 10));
  const sideB = new THREE.Group();
  sideB.add(cylinder(.18 * scale, .2 * scale, 1.08 * scale, materials.cactus, 0, .54 * scale, 0, 10));
  sideB.position.set(-.58 * scale, 1.43 * scale, 0);
  sideB.rotation.z = Math.PI / 2;
  group.add(sideB);
  group.add(cylinder(.18 * scale, .2 * scale, .78 * scale, materials.cactus, -1.08 * scale, 1.97 * scale, 0, 10));
  group.position.set(x, 0, z);
  shadowTree(group);
  return group;
}
scene.add(createCactus(-17, -4, 1.45));
scene.add(createCactus(15, -12, 1.05));
scene.add(createCactus(-13, -19, .75));
scene.add(createCactus(23, 4, .63));

function createTumbleweed(x, z, size) {
  const group = new THREE.Group();
  const twigMat = new THREE.MeshStandardMaterial({ color: 0x76503a, roughness: 1 });
  for (let i = 0; i < 19; i++) {
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(range(-size,.0), range(-size*.2,size*.2), range(-size,size)),
      new THREE.Vector3(range(-size,size), range(-size,size), range(-size,size)),
      new THREE.Vector3(range(-size,size), range(-size,size), range(-size,size))
    ]);
    const twig = new THREE.Mesh(new THREE.TubeGeometry(curve, 5, .018, 5, false), twigMat);
    twig.castShadow = true;
    group.add(twig);
  }
  group.position.set(x, size * .55, z);
  return group;
}
const tumbleweed = createTumbleweed(-16, 11, 1.1);
scene.add(tumbleweed);
scene.add(createTumbleweed(15, 13, .66));
scene.add(createTumbleweed(-25, -8, .58));

function createPoleSign() {
  const group = new THREE.Group();
  group.add(cylinder(.28, .42, 10.5, materials.teal, 0, 5.25, 0, 16));
  group.add(cylinder(.55, .65, .35, materials.chrome, 0, .16, 0, 16));
  group.add(cylinder(.47, .47, .25, materials.red, 0, 10.55, 0, 16));
  const sign = new THREE.Group();
  const body = box(4.7, 3.68, .24, materials.cream, 0, 0, 0);
  sign.add(body);
  sign.add(box(4.42, 3.4, .13, materials.red, 0, 0, -.17));
  const face = new THREE.Mesh(new THREE.PlaneGeometry(4.17, 3.16), new THREE.MeshBasicMaterial({ map: signTexture }));
  face.position.set(0, 0, -.25);
  sign.add(face);
  sign.add(box(4.7, .2, .32, materials.teal, 0, 1.96, 0));
  sign.add(box(4.7, .2, .32, materials.teal, 0, -1.96, 0));
  sign.position.set(0, 12.5, 0);
  group.add(sign);
  group.position.set(-15, 0, -12);
  shadowTree(group);
  return { group, sign };
}
const poleSign = createPoleSign();
scene.add(poleSign.group);

function createUtilityStuff() {
  const group = new THREE.Group();
  const barrelMat = new THREE.MeshStandardMaterial({ color: 0x355a65, roughness: .65, metalness: .35 });
  for (let i = 0; i < 3; i++) {
    const barrel = cylinder(.37, .37, .92, barrelMat, 0, .48, 0, 16);
    barrel.rotation.z = i === 2 ? Math.PI / 2 - .2 : 0;
    barrel.position.set(9.3 + i * .58, i === 2 ? .35 : .48, -6.8 + i * .07);
    group.add(barrel);
  }
  group.add(box(1.5, .82, 1.1, materials.rust, 11.1, .42, -5.45));
  group.add(box(1.2, .12, .95, materials.darkRed, 11.1, .92, -5.45));
  const antenna = cylinder(.035, .035, 2.0, materials.chrome, 10.35, 1.7, -7.2, 8);
  group.add(antenna);
  return group;
}
scene.add(createUtilityStuff());

function createPowerLines() {
  const group = new THREE.Group();
  const wireMaterial = new THREE.LineBasicMaterial({ color: 0x382727 });
  for (let i = 0; i < 4; i++) {
    const px = 18 + i * 11;
    group.add(cylinder(.12, .16, 8, materials.rust, px, 4, -20, 10));
    group.add(box(2.2, .11, .12, materials.rust, px, 7.4, -20));
  }
  for (let wire = 0; wire < 2; wire++) {
    const points = [];
    for (let i = 0; i < 4; i++) {
      points.push(new THREE.Vector3(18 + i * 11, 7.3 - wire * .35, -20));
      if (i < 3) points.push(new THREE.Vector3(23.5 + i * 11, 6.3 - wire * .35, -20));
    }
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), wireMaterial));
  }
  return group;
}
scene.add(createPowerLines());

const smallDebris = new THREE.Group();
for (let i = 0; i < 85; i++) {
  const angle = rand() * Math.PI * 2;
  const distance = range(15, 60);
  const stone = mesh(
    new THREE.DodecahedronGeometry(range(.04,.19), 0),
    new THREE.MeshStandardMaterial({ color: pick([0x745043, 0x8e5e45, 0x5c4138]), roughness: 1 }),
    Math.cos(angle) * distance,
    range(.01,.1),
    Math.sin(angle) * distance
  );
  stone.scale.y = range(.35,.8);
  smallDebris.add(stone);
}
scene.add(smallDebris);

const ambient = new THREE.HemisphereLight(0xf4a06b, 0x302d2b, 2.15);
scene.add(ambient);

const sunLight = new THREE.DirectionalLight(0xff9c59, 4.3);
sunLight.position.set(-33, 24, -27);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -34;
sunLight.shadow.camera.right = 34;
sunLight.shadow.camera.top = 29;
sunLight.shadow.camera.bottom = -25;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 95;
sunLight.shadow.bias = -0.00035;
scene.add(sunLight);

const fill = new THREE.DirectionalLight(0xa55b81, .75);
fill.position.set(20, 12, 19);
scene.add(fill);

const officeLight = new THREE.PointLight(0xffbf6b, 2.4, 15, 2);
officeLight.position.set(-.1, 5.55, -.2);
scene.add(officeLight);

const clock = new THREE.Clock();
const windObjects = [];
for (const child of tumbleweed.children) {
  windObjects.push(child);
}

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  poleSign.sign.rotation.y = Math.sin(elapsed * .58) * .18 + elapsed * .075;
  poleSign.sign.rotation.z = Math.sin(elapsed * 1.15) * .018;
  vending.light.intensity = 1.3 + Math.sin(elapsed * 8.0) * .55 + Math.sin(elapsed * 2.3) * .22;
  pumpA.children[7].material.emissiveIntensity = 1.7 + Math.sin(elapsed * 5) * .85;
  pumpB.children[7].material.emissiveIntensity = 1.7 + Math.cos(elapsed * 5.4) * .85;
  tumbleweed.rotation.z = elapsed * .52;
  tumbleweed.rotation.y = elapsed * .21;
  tumbleweed.position.x = -16 + Math.sin(elapsed * .28) * 1.7;
  for (let i = 0; i < windObjects.length; i++) {
    windObjects[i].rotation.x = Math.sin(elapsed * 1.5 + i) * .08;
  }
  sky.rotation.y = elapsed * .006;
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
