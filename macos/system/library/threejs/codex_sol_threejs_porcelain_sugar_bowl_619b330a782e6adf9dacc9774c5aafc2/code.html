<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Porcelain Sugar Bowl</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #e8e4dc;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e4dc);
scene.fog = new THREE.Fog(0xe8e4dc, 9, 16);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 50);
camera.position.set(4.6, 3.25, 6.3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.45, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 4.4;
controls.maxDistance = 10;
controls.minPolarAngle = 0.55;
controls.maxPolarAngle = 1.52;

const porcelain = new THREE.MeshPhysicalMaterial({
  color: 0xfffdf4,
  roughness: 0.16,
  metalness: 0,
  clearcoat: 1,
  clearcoatRoughness: 0.08,
  sheen: 0.12,
  sheenColor: new THREE.Color(0xf5eadc)
});

const porcelainShade = new THREE.MeshPhysicalMaterial({
  color: 0xece8dd,
  roughness: 0.22,
  clearcoat: 0.85,
  clearcoatRoughness: 0.1
});

const cobalt = new THREE.MeshPhysicalMaterial({
  color: 0x123d88,
  roughness: 0.2,
  clearcoat: 0.9,
  clearcoatRoughness: 0.08
});

const cobaltDark = new THREE.MeshPhysicalMaterial({
  color: 0x09295f,
  roughness: 0.23,
  clearcoat: 0.75
});

const gold = new THREE.MeshPhysicalMaterial({
  color: 0xd5a53c,
  metalness: 0.82,
  roughness: 0.22,
  clearcoat: 0.35
});

const blush = new THREE.MeshPhysicalMaterial({
  color: 0xf3ddd0,
  roughness: 0.24,
  clearcoat: 0.9,
  clearcoatRoughness: 0.1
});

const bowl = new THREE.Group();
bowl.rotation.y = -0.08;
scene.add(bowl);

function bodyRadius(y) {
  const t = THREE.MathUtils.clamp((y - 0.56) / 1.5, 0, 1);
  return 0.79 + 0.54 * Math.pow(Math.sin(Math.PI * t), 0.72) + 0.08 * t;
}

function lidRadius(y) {
  const t = THREE.MathUtils.clamp((y - 2.02) / 0.68, 0, 1);
  return 0.14 + 0.99 * Math.pow(Math.cos(t * Math.PI * 0.5), 0.72);
}

function makeFlutedSurface(y0, y1, radiusFunction, ribs, amplitude, radialSegments = 144, verticalSegments = 44) {
  const positions = [];
  const uvs = [];
  const indices = [];

  for (let iy = 0; iy <= verticalSegments; iy++) {
    const v = iy / verticalSegments;
    const y = THREE.MathUtils.lerp(y0, y1, v);
    const baseRadius = radiusFunction(y);
    const fade = 0.42 + 0.58 * Math.pow(Math.sin(Math.PI * v), 0.35);

    for (let ix = 0; ix <= radialSegments; ix++) {
      const u = ix / radialSegments;
      const angle = u * Math.PI * 2;
      const fluting = 1 + amplitude * fade * Math.cos(ribs * angle);
      const r = baseRadius * fluting;
      positions.push(r * Math.cos(angle), y, r * Math.sin(angle));
      uvs.push(u, v);
    }
  }

  for (let iy = 0; iy < verticalSegments; iy++) {
    for (let ix = 0; ix < radialSegments; ix++) {
      const a = iy * (radialSegments + 1) + ix;
      const b = a + radialSegments + 1;
      indices.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function addMesh(geometry, material, parent = bowl) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

const bodyMesh = addMesh(
  makeFlutedSurface(0.56, 2.06, bodyRadius, 12, 0.052),
  porcelain
);

const footProfile = [
  new THREE.Vector2(0.65, 0.42),
  new THREE.Vector2(0.73, 0.43),
  new THREE.Vector2(0.78, 0.48),
  new THREE.Vector2(0.79, 0.55),
  new THREE.Vector2(0.76, 0.61),
  new THREE.Vector2(0.70, 0.65)
];
addMesh(new THREE.LatheGeometry(footProfile, 96), porcelain);

const footShadow = new THREE.Mesh(
  new THREE.TorusGeometry(0.715, 0.018, 10, 96),
  porcelainShade
);
footShadow.rotation.x = Math.PI / 2;
footShadow.position.y = 0.432;
bowl.add(footShadow);

const shoulderCollar = addMesh(
  new THREE.TorusGeometry(0.925, 0.055, 16, 128),
  porcelain
);
shoulderCollar.rotation.x = Math.PI / 2;
shoulderCollar.position.y = 2.035;

const lid = new THREE.Group();
bowl.add(lid);

addMesh(
  makeFlutedSurface(2.02, 2.70, lidRadius, 12, 0.045, 144, 38),
  porcelain,
  lid
);

const lidLip = addMesh(
  new THREE.TorusGeometry(1.105, 0.065, 18, 144),
  porcelain,
  lid
);
lidLip.rotation.x = Math.PI / 2;
lidLip.position.y = 2.035;

function torusRing(radius, tube, y, material, parent = bowl) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(radius, tube, 10, 144),
    material
  );
  ring.rotation.x = Math.PI / 2;
  ring.position.y = y;
  ring.castShadow = true;
  parent.add(ring);
  return ring;
}

torusRing(0.91, 0.014, 2.092, gold);
torusRing(1.116, 0.016, 2.061, gold, lid);
torusRing(0.755, 0.012, 0.471, gold);

function surfacePoint(y, theta, radiusFunction, fluteAmplitude, ribs = 12, offset = 0) {
  const r = radiusFunction(y) * (1 + fluteAmplitude * Math.cos(ribs * theta)) + offset;
  return new THREE.Vector3(r * Math.cos(theta), y, r * Math.sin(theta));
}

function addTube(points, radius, material, parent = bowl, segments = 80) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  return addMesh(new THREE.TubeGeometry(curve, segments, radius, 7, false), material, parent);
}

for (let rib = 0; rib < 12; rib++) {
  const baseTheta = rib * Math.PI * 2 / 12;
  const points = [];

  for (let j = 0; j <= 16; j++) {
    const t = j / 16;
    const y = 0.69 + t * 1.27;
    const theta = baseTheta + 0.024 * Math.sin(t * Math.PI * 4 + rib * 0.65);
    points.push(surfacePoint(y, theta, bodyRadius, 0.052, 12, 0.026));
  }

  addTube(points, 0.014, cobalt, bowl, 72);

  for (let j = 0; j < 3; j++) {
    const t = 0.25 + j * 0.235;
    const y = 0.69 + t * 1.27;
    const theta = baseTheta + 0.024 * Math.sin(t * Math.PI * 4 + rib * 0.65);
    const p = surfacePoint(y, theta, bodyRadius, 0.052, 12, 0.048);
    const leaf = addMesh(new THREE.SphereGeometry(1, 12, 8), j % 2 ? cobalt : cobaltDark);
    leaf.position.copy(p);
    leaf.scale.set(0.038, 0.092, 0.012);
    leaf.rotation.y = -theta;
    leaf.rotation.z = (j % 2 ? 0.58 : -0.58);
  }
}

for (let rib = 0; rib < 12; rib++) {
  const theta = rib * Math.PI * 2 / 12;
  const points = [];

  for (let j = 0; j <= 10; j++) {
    const t = j / 10;
    const y = 2.10 + t * 0.47;
    const wavingTheta = theta + 0.021 * Math.sin(t * Math.PI * 3 + rib * 0.5);
    points.push(surfacePoint(y, wavingTheta, lidRadius, 0.045, 12, 0.022));
  }

  addTube(points, 0.012, cobalt, lid, 48);
}

function makeHandle(side) {
  const points = [
    new THREE.Vector3(side * 1.12, 1.79, 0),
    new THREE.Vector3(side * 1.47, 1.86, 0),
    new THREE.Vector3(side * 1.72, 1.67, 0),
    new THREE.Vector3(side * 1.73, 1.38, 0),
    new THREE.Vector3(side * 1.56, 1.13, 0),
    new THREE.Vector3(side * 1.20, 1.18, 0)
  ];

  addTube(points, 0.092, porcelain, bowl, 72);

  const paintedPoints = points.map((p, index) => {
    const q = p.clone();
    q.z = 0.088;
    if (index === 0 || index === points.length - 1) q.z = 0.045;
    return q;
  });
  addTube(paintedPoints, 0.015, cobalt, bowl, 72);

  for (const y of [1.19, 1.79]) {
    const rosette = addMesh(new THREE.SphereGeometry(0.145, 24, 14), porcelain);
    rosette.position.set(side * 1.09, y, 0);
    rosette.scale.set(0.62, 1, 1);
    const center = addMesh(new THREE.SphereGeometry(0.045, 16, 10), gold);
    center.position.set(side * 1.165, y, 0.055);
  }
}

makeHandle(1);
makeHandle(-1);

const finial = new THREE.Group();
finial.position.y = 2.66;
lid.add(finial);

const stem = addMesh(new THREE.CylinderGeometry(0.09, 0.13, 0.27, 24), porcelain, finial);
stem.position.y = 0.12;

for (let i = 0; i < 5; i++) {
  const angle = i * Math.PI * 2 / 5;
  const leaf = addMesh(new THREE.SphereGeometry(1, 18, 10), porcelain, finial);
  leaf.scale.set(0.17, 0.055, 0.085);
  leaf.position.set(Math.cos(angle) * 0.15, 0.17, Math.sin(angle) * 0.15);
  leaf.rotation.y = -angle;
  leaf.rotation.z = 0.3;
}

const budCore = addMesh(new THREE.SphereGeometry(0.18, 24, 18), blush, finial);
budCore.position.y = 0.38;
budCore.scale.set(0.78, 1.15, 0.78);

for (let i = 0; i < 8; i++) {
  const angle = i * Math.PI * 2 / 8 + (i % 2) * 0.16;
  const petal = addMesh(
    new THREE.SphereGeometry(1, 20, 14, 0, Math.PI * 2, 0.2, Math.PI * 0.72),
    i % 3 === 0 ? blush : porcelain,
    finial
  );
  const radius = i < 4 ? 0.105 : 0.16;
  petal.position.set(
    Math.cos(angle) * radius,
    i < 4 ? 0.40 : 0.35,
    Math.sin(angle) * radius
  );
  petal.scale.set(0.13, 0.19, 0.075);
  petal.rotation.order = 'YXZ';
  petal.rotation.y = -angle;
  petal.rotation.x = i < 4 ? -0.16 : -0.34;
  petal.rotation.z = Math.cos(angle) * 0.16;
}

const topPetal = addMesh(new THREE.SphereGeometry(1, 20, 14), blush, finial);
topPetal.position.y = 0.49;
topPetal.scale.set(0.105, 0.145, 0.105);

function seededRandom(seed) {
  let value = seed >>> 0;
  return () => {
    value = (value * 1664525 + 1013904223) >>> 0;
    return value / 4294967296;
  };
}

const random = seededRandom(9137);
const crackPositions = [];

function crackPoint(theta, y) {
  const r = bodyRadius(y) * (1 + 0.052 * Math.cos(12 * theta)) + 0.018;
  return new THREE.Vector3(r * Math.cos(theta), y, r * Math.sin(theta));
}

for (let i = 0; i < 42; i++) {
  const theta = random() * Math.PI * 2;
  const y = 0.61 + random() * 0.22;
  const length = 0.035 + random() * 0.055;
  const angleDirection = (random() - 0.5) * 0.055;
  const p0 = crackPoint(theta, y);
  const p1 = crackPoint(theta + angleDirection, y + length);
  crackPositions.push(p0.x, p0.y, p0.z, p1.x, p1.y, p1.z);

  if (random() > 0.45) {
    const branch = crackPoint(
      theta + angleDirection + (random() - 0.5) * 0.035,
      y + length * (0.55 + random() * 0.3)
    );
    crackPositions.push(p1.x, p1.y, p1.z, branch.x, branch.y, branch.z);
  }
}

const crackGeometry = new THREE.BufferGeometry();
crackGeometry.setAttribute('position', new THREE.Float32BufferAttribute(crackPositions, 3));
const cracks = new THREE.LineSegments(
  crackGeometry,
  new THREE.LineBasicMaterial({
    color: 0x8d877c,
    transparent: true,
    opacity: 0.38,
    depthWrite: false
  })
);
bowl.add(cracks);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(7, 96),
  new THREE.MeshStandardMaterial({
    color: 0xd9d5cc,
    roughness: 0.88,
    metalness: 0
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.405;
ground.receiveShadow = true;
scene.add(ground);

const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(28, 16),
  new THREE.MeshStandardMaterial({
    color: 0xe8e4dc,
    roughness: 1,
    side: THREE.DoubleSide
  })
);
backdrop.position.set(0, 5, -6);
backdrop.receiveShadow = true;
scene.add(backdrop);

const hemi = new THREE.HemisphereLight(0xfff8ec, 0x707781, 2.1);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2df, 4.4);
key.position.set(4.5, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -2;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 18;
key.shadow.bias = -0.00018;
key.shadow.normalBias = 0.025;
scene.add(key);

const fill = new THREE.DirectionalLight(0xb9d4ff, 1.65);
fill.position.set(-5, 3.8, 3);
scene.add(fill);

const rimLight = new THREE.DirectionalLight(0xffdfbc, 2.2);
rimLight.position.set(-2, 5, -5);
scene.add(rimLight);

const frontSoft = new THREE.PointLight(0xffffff, 1.35, 9, 2);
frontSoft.position.set(0, 2.8, 5);
scene.add(frontSoft);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
