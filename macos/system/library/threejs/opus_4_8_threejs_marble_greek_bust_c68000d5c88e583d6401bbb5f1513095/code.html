<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marble Greek Philosopher Bust</title>
<style>
  html, body { margin: 0; height: 100%; background: #101114; overflow: hidden; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 -apple-system, Segoe UI, Roboto, sans-serif;
    color: rgba(230,228,222,0.35); user-select: none; pointer-events: none;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div id="hint">Carrara marble · drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------------------------------------------------------------------------
   Renderer
--------------------------------------------------------------------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ---------------------------------------------------------------------------
   Scene & camera
--------------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111216);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(0.85, 0.98, 1.55);

// Studio environment for soft polished-stone reflections
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------------------------------------------------------------------------
   Controls
--------------------------------------------------------------------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 0.9;
controls.maxDistance = 4.0;
controls.minPolarAngle = 0.45;
controls.maxPolarAngle = 1.52;

/* ---------------------------------------------------------------------------
   Lighting : Hemisphere + key / fill / rim, soft shadows
--------------------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0xc3d6ff, 0x2a2622, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e6, 3.0);
key.position.set(1.3, 2.1, 1.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 7;
key.shadow.camera.left = -1.2;
key.shadow.camera.right = 1.2;
key.shadow.camera.top = 1.4;
key.shadow.camera.bottom = -0.6;
key.shadow.bias = -0.0003;
key.shadow.normalBias = 0.02;
key.shadow.radius = 5;
key.target.position.set(0, 0.62, 0);
scene.add(key, key.target);

const fill = new THREE.DirectionalLight(0xbcd0ff, 0.75);
fill.position.set(-1.7, 0.9, 0.9);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 2.0);
rim.position.set(-0.7, 1.7, -1.9);
scene.add(rim);

/* ---------------------------------------------------------------------------
   Ground plane : receives shadows only
--------------------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(24, 24),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------------
   Procedural marble veining texture
--------------------------------------------------------------------------- */
function makeMarbleTexture() {
  const s = 1024;
  const cvs = document.createElement('canvas');
  cvs.width = cvs.height = s;
  const x = cvs.getContext('2d');

  x.fillStyle = '#ece9e2';
  x.fillRect(0, 0, s, s);

  // soft mottling
  for (let i = 0; i < 1600; i++) {
    const r = Math.random() * 95 + 18;
    const gx = Math.random() * s, gy = Math.random() * s;
    const g = x.createRadialGradient(gx, gy, 0, gx, gy, r);
    const tone = Math.random() > 0.5 ? 252 : 224;
    const a = Math.random() * 0.05;
    g.addColorStop(0, `rgba(${tone},${tone},${tone - 4},${a})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g;
    x.fillRect(gx - r, gy - r, r * 2, r * 2);
  }

  // faint grey veins (random walks with a few branches)
  function vein(px, py, segs, width, alpha) {
    x.beginPath();
    x.moveTo(px, py);
    let a = Math.random() * Math.PI * 2;
    for (let k = 0; k < segs; k++) {
      a += (Math.random() - 0.5) * 0.9;
      px += Math.cos(a) * (8 + Math.random() * 14);
      py += Math.sin(a) * (8 + Math.random() * 14);
      x.lineTo(px, py);
    }
    x.strokeStyle = `rgba(122,124,131,${alpha})`;
    x.lineWidth = width;
    x.stroke();
    return { px, py };
  }
  for (let v = 0; v < 24; v++) {
    const sx = Math.random() * s, sy = Math.random() * s;
    const end = vein(sx, sy, 22 + (Math.random() * 26 | 0), 0.6 + Math.random() * 1.7, 0.045 + Math.random() * 0.08);
    if (Math.random() > 0.4) vein(end.px, end.py, 10 + (Math.random() * 14 | 0), 0.4 + Math.random() * 0.9, 0.03 + Math.random() * 0.05);
  }

  const tex = new THREE.CanvasTexture(cvs);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

const veinTex = makeMarbleTexture();

/* ---------------------------------------------------------------------------
   Marble materials (translucent polished stone)
--------------------------------------------------------------------------- */
const marble = new THREE.MeshPhysicalMaterial({
  color: 0xe9e6df,
  map: veinTex,
  bumpMap: veinTex,
  bumpScale: 0.0035,
  roughness: 0.32,
  metalness: 0.0,
  clearcoat: 0.25,
  clearcoatRoughness: 0.5,
  transmission: 0.14,
  thickness: 0.6,
  ior: 1.48,
  attenuationColor: new THREE.Color(0xf0ece3),
  attenuationDistance: 0.7,
  envMapIntensity: 0.9
});

const marbleHair = marble.clone();
marbleHair.roughness = 0.5;
marbleHair.clearcoat = 0.1;
marbleHair.transmission = 0.06;
marbleHair.bumpScale = 0.006;

const marblePlinth = marble.clone();
marblePlinth.color = new THREE.Color(0xdedbd3);
marblePlinth.roughness = 0.46;
marblePlinth.clearcoat = 0.08;
marblePlinth.transmission = 0.04;

/* ---------------------------------------------------------------------------
   Geometry helpers
--------------------------------------------------------------------------- */
const rand = (a, b) => a + Math.random() * (b - a);

// merge a set of geometries into one (normalise index state first)
function mergeAll(geos) {
  return mergeGeometries(geos.map(g => (g.index ? g.toNonIndexed() : g)), false);
}

// Head parameters (face looks toward +Z)
const HEAD = { cx: 0, cy: 0.86, cz: 0.0, r: 0.115, sx: 0.92, sy: 1.06, sz: 0.98 };
const FRONT = HEAD.r * HEAD.sz; // front-surface depth at centre height

// point on the (slightly enlarged) scalp ellipsoid; phi measured from +Z front
function pointOnHead(theta, phi, rmul) {
  const st = Math.sin(theta), ct = Math.cos(theta);
  const x = st * Math.sin(phi);
  const y = ct;
  const z = st * Math.cos(phi);
  return new THREE.Vector3(
    HEAD.cx + x * HEAD.r * HEAD.sx * rmul,
    HEAD.cy + y * HEAD.r * HEAD.sy * rmul,
    HEAD.cz + z * HEAD.r * HEAD.sz * rmul
  );
}

// an irregular little "curl" ball
function curlGeo(r) {
  const g = new THREE.IcosahedronGeometry(r, 1);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const n = 1 + (Math.random() - 0.5) * 0.4;
    p.setXYZ(i, p.getX(i) * n, p.getY(i) * n, p.getZ(i) * n);
  }
  g.computeVertexNormals();
  return g;
}

function curlAt(pos, r) {
  const g = curlGeo(r);
  g.scale(rand(0.9, 1.2), rand(0.8, 1.1), rand(0.9, 1.2));
  g.rotateX(Math.random() * Math.PI);
  g.rotateY(Math.random() * Math.PI);
  g.translate(pos.x, pos.y, pos.z);
  return g;
}

/* ---------------------------------------------------------------------------
   Build the smooth "skin" sculpture : head, face, neck, chest, socle
--------------------------------------------------------------------------- */
function buildSculpture() {
  const geos = [];
  const ell = (rx, ry, rz, px, py, pz) => {
    const g = new THREE.SphereGeometry(1, 40, 28);
    g.scale(rx, ry, rz);
    g.translate(px, py, pz);
    return g;
  };

  // cranium
  const head = new THREE.SphereGeometry(HEAD.r, 56, 48);
  head.scale(HEAD.sx, HEAD.sy, HEAD.sz);
  head.translate(HEAD.cx, HEAD.cy, HEAD.cz);
  geos.push(head);

  // brow ridge
  geos.push(ell(0.072, 0.016, 0.028, 0, 0.892, 0.100));

  // eyes (serene, almond)
  for (const side of [-1, 1]) {
    const ex = side * 0.042;
    geos.push(ell(0.019, 0.017, 0.016, ex, 0.877, 0.090));       // eyeball, recessed
    geos.push(ell(0.028, 0.011, 0.013, ex, 0.887, 0.097));       // upper lid
    geos.push(ell(0.026, 0.008, 0.012, ex, 0.866, 0.097));       // lower lid
  }

  // nose : bridge + tip + wings
  geos.push(ell(0.014, 0.050, 0.020, 0, 0.857, 0.104));
  geos.push(ell(0.021, 0.020, 0.022, 0, 0.815, 0.119));
  for (const side of [-1, 1]) geos.push(ell(0.014, 0.013, 0.014, side * 0.019, 0.812, 0.106));

  // cheeks
  for (const side of [-1, 1]) geos.push(ell(0.045, 0.050, 0.030, side * 0.056, 0.835, 0.086));

  // lips (mostly framed by moustache/beard)
  geos.push(ell(0.030, 0.010, 0.014, 0, 0.802, 0.104));
  geos.push(ell(0.028, 0.011, 0.014, 0, 0.789, 0.102));

  // neck
  const neck = new THREE.CylinderGeometry(0.052, 0.078, 0.17, 40);
  neck.translate(0, 0.705, 0.004);
  geos.push(neck);

  // chest / shoulders — widest mass
  geos.push(ell(0.26, 0.17, 0.18, 0, 0.55, 0));

  // socle foot : narrow pedestal from plinth up into the chest
  const pts = [
    new THREE.Vector2(0.02, 0.200),
    new THREE.Vector2(0.115, 0.205),
    new THREE.Vector2(0.100, 0.245),
    new THREE.Vector2(0.086, 0.300),
    new THREE.Vector2(0.092, 0.360),
    new THREE.Vector2(0.108, 0.410),
    new THREE.Vector2(0.125, 0.445)
  ];
  const socle = new THREE.LatheGeometry(pts, 48);
  geos.push(socle);

  const mesh = new THREE.Mesh(mergeAll(geos), marble);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

/* ---------------------------------------------------------------------------
   Curly hair (cap + fringe framing the face)
--------------------------------------------------------------------------- */
function buildHair() {
  const geos = [];
  const layers = [
    { rmul: 0.99, r: 0.021 },
    { rmul: 1.06, r: 0.023 },
    { rmul: 1.12, r: 0.020 }
  ];
  for (const L of layers) {
    for (let th = 0.05; th < 0.75; th += 0.072) {
      const theta = th * Math.PI;
      const circ = Math.sin(theta);
      const steps = Math.max(6, Math.round(circ * 27));
      for (let s = 0; s < steps; s++) {
        let phi = (s / steps) * Math.PI * 2;
        const pf = phi > Math.PI ? phi - 2 * Math.PI : phi; // -PI..PI, 0 = front
        const front = Math.cos(pf);
        let isHair;
        if (front > 0.30) isHair = theta < 0.30 * Math.PI;      // forehead fringe only
        else isHair = theta < 0.76 * Math.PI;                    // sides / back full cap
        if (!isHair) continue;

        const jt = theta + rand(-0.03, 0.03);
        const jp = pf + rand(-0.06, 0.06);
        const pos = pointOnHead(jt, jp, L.rmul + Math.random() * 0.03);
        geos.push(curlAt(pos, L.r * rand(0.75, 1.35)));
      }
    }
  }
  // a few side locks hanging in front of the ears
  for (const side of [-1, 1]) {
    for (let i = 0; i < 10; i++) {
      const pos = pointOnHead(rand(0.62, 0.78) * Math.PI, side * rand(0.42, 0.62) * Math.PI, 1.04);
      pos.y -= rand(0.0, 0.03);
      geos.push(curlAt(pos, 0.02 * rand(0.8, 1.2)));
    }
  }

  const mesh = new THREE.Mesh(mergeAll(geos), marbleHair);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

/* ---------------------------------------------------------------------------
   Curly beard + moustache
--------------------------------------------------------------------------- */
function buildBeard() {
  const geos = [];

  // beard mass on jaw / lower face shell
  for (let th = 0.50; th < 1.0; th += 0.055) {
    const theta = th * Math.PI;
    const circ = Math.sin(theta);
    const steps = Math.max(5, Math.round(circ * 24));
    for (let s = 0; s < steps; s++) {
      let phi = (s / steps) * Math.PI * 2;
      const pf = phi > Math.PI ? phi - 2 * Math.PI : phi;
      const front = Math.cos(pf);
      if (front < 0.12) continue;                       // front / sideburns only
      const yy = Math.cos(theta);
      // central beard starts low (leaves cheeks bare); sideburns reach higher
      const allowedY = -0.30 + ((1 - front) / (1 - 0.12)) * 0.40;
      if (yy > allowedY) continue;

      const jt = theta + rand(-0.025, 0.025);
      const jp = pf + rand(-0.05, 0.05);
      const pos = pointOnHead(jt, jp, 1.03 + Math.random() * 0.05);
      geos.push(curlAt(pos, 0.018 * rand(0.7, 1.3)));
    }
  }

  // hanging beard tuft below the chin, tapering to a point
  const chin = new THREE.Vector3(0, 0.78, 0.095);
  for (let i = 0; i < 120; i++) {
    const t = Math.random();
    const drop = t * 0.16;
    const spread = (1 - t) * 0.075 + 0.018;
    const ang = Math.random() * Math.PI * 2;
    const rr = Math.sqrt(Math.random()) * spread;
    const pos = new THREE.Vector3(
      chin.x + Math.cos(ang) * rr,
      chin.y - drop + rand(-0.012, 0.012),
      chin.z + Math.sin(ang) * rr * 0.65 - t * 0.03
    );
    geos.push(curlAt(pos, 0.017 * rand(0.7, 1.3)));
  }

  // moustache over the upper lip
  for (const side of [-1, 1]) {
    for (let i = 0; i < 12; i++) {
      const k = i / 12;
      const pos = new THREE.Vector3(
        side * (0.008 + k * 0.048),
        0.812 - k * 0.012 + rand(-0.006, 0.006),
        0.108 - k * 0.014
      );
      geos.push(curlAt(pos, 0.013 * rand(0.8, 1.25)));
    }
  }

  const mesh = new THREE.Mesh(mergeAll(geos), marbleHair);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

/* ---------------------------------------------------------------------------
   Short classical plinth
--------------------------------------------------------------------------- */
function buildPlinth() {
  const geos = [];
  const box = (w, h, d, y) => {
    const g = new THREE.BoxGeometry(w, h, d);
    g.translate(0, y, 0);
    return g;
  };
  geos.push(box(0.34, 0.05, 0.34, 0.025));  // base
  geos.push(box(0.28, 0.12, 0.28, 0.110));  // die
  geos.push(box(0.31, 0.03, 0.31, 0.185));  // top moulding

  const mesh = new THREE.Mesh(mergeAll(geos), marblePlinth);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

/* ---------------------------------------------------------------------------
   Assemble the single centered object
--------------------------------------------------------------------------- */
const bust = new THREE.Group();
bust.add(buildSculpture());
bust.add(buildHair());
bust.add(buildBeard());
bust.add(buildPlinth());
scene.add(bust);

/* ---------------------------------------------------------------------------
   Resize handling
--------------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------------------------------------------------------------------------
   Render loop
--------------------------------------------------------------------------- */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
