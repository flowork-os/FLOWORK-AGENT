<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bronze Memorial — Seated Elder</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0e11; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #caption {
    position: fixed; left: 0; right: 0; bottom: 14px;
    text-align: center; color: #b9b3a6; font-family: Georgia, 'Times New Roman', serif;
    font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    opacity: 0.5; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="caption">Seated Elder &middot; Patinated Bronze</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------------------
   Renderer
--------------------------------------------------------------------------- */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

/* ---------------------------------------------------------------------------
   Scene, camera, environment
--------------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x121216);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.7, 1.35, 3.1);

// Soft indoor reflections for believable metal
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------------------------------------------------------------------------
   Lighting : hemisphere + key + fill + rim, soft shadows
--------------------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0x9fb0cc, 0x211c14, 0.45);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff1de, 2.6);
key.position.set(2.6, 4.2, 2.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 20;
key.shadow.camera.left = -2.6;
key.shadow.camera.right = 2.6;
key.shadow.camera.top = 2.8;
key.shadow.camera.bottom = -1.0;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 6;
scene.add(key);

const fill = new THREE.DirectionalLight(0xb9d0ff, 0.55);
fill.position.set(-3.2, 1.8, 1.6);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffe8c4, 1.7);
rim.position.set(-1.6, 3.0, -3.4);
scene.add(rim);

/* ---------------------------------------------------------------------------
   Shadow-only ground
--------------------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------------
   Materials : dark patinated bronze
--------------------------------------------------------------------------- */
const bronze = new THREE.MeshPhysicalMaterial({
  color: 0x4a3d2b,
  metalness: 1.0,
  roughness: 0.52,
  clearcoat: 0.18,
  clearcoatRoughness: 0.6,
  envMapIntensity: 1.05
});
bronze.emissive = new THREE.Color(0x0a0f0a);
bronze.emissiveIntensity = 0.25; // faint verdigris glow in shadows

const benchMat = new THREE.MeshPhysicalMaterial({
  color: 0x33362b,
  metalness: 0.95,
  roughness: 0.58,
  clearcoat: 0.1,
  clearcoatRoughness: 0.7,
  envMapIntensity: 0.9
});

/* ---------------------------------------------------------------------------
   Procedural helpers
--------------------------------------------------------------------------- */
function noise3(x, y, z) {
  return (
    Math.sin(x) * Math.cos(y * 1.3) +
    Math.sin(z * 0.7 + x * 0.6) +
    Math.cos((x + z) * 1.7) * Math.sin(y * 0.9)
  ) / 3;
}

// Displace vertices along their normals for a hand-sculpted / draped surface
function roughen(geo, amp, freq) {
  const p = geo.attributes.position;
  const n = geo.attributes.normal;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const d = amp * noise3(x * freq, y * freq, z * freq);
    p.setXYZ(i, x + n.getX(i) * d, y + n.getY(i) * d, z + n.getZ(i) * d);
  }
  p.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

const sculpture = new THREE.Group();
const figure = new THREE.Group();
const bench = new THREE.Group();
sculpture.add(bench, figure);
scene.add(sculpture);

function addMesh(geo, mat, parent) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

// Ellipsoidal soft body mass
function mass(x, y, z, sx, sy, sz, rough = 0.045) {
  const g = new THREE.SphereGeometry(1, 48, 32);
  if (rough) roughen(g, rough, 6);
  const m = addMesh(g, bronze, figure);
  m.scale.set(sx, sy, sz);
  m.position.set(x, y, z);
  return m;
}

// Capsule limb from point A to point B
const UP = new THREE.Vector3(0, 1, 0);
function limb(a, b, r, rough = 0.02) {
  const A = new THREE.Vector3().fromArray(a);
  const B = new THREE.Vector3().fromArray(b);
  const dir = new THREE.Vector3().subVectors(B, A);
  const len = dir.length();
  const cyl = Math.max(0.001, len - 2 * r);
  const g = new THREE.CapsuleGeometry(r, cyl, 14, 24);
  if (rough) roughen(g, rough, 9);
  const m = addMesh(g, bronze, figure);
  m.quaternion.setFromUnitVectors(UP, dir.normalize());
  m.position.copy(A).add(B).multiplyScalar(0.5);
  return m;
}

function bBox(x, y, z, sx, sy, sz, rot, mat = benchMat) {
  const m = addMesh(new THREE.BoxGeometry(sx, sy, sz), mat, bench);
  m.position.set(x, y, z);
  if (rot) m.rotation.set(rot[0] || 0, rot[1] || 0, rot[2] || 0);
  return m;
}

/* ---------------------------------------------------------------------------
   The bench (cast bronze, memorial style)
--------------------------------------------------------------------------- */
const SEAT_Y = 0.46;
// Seat slats (front toward +z)
for (let i = 0; i < 4; i++) {
  bBox(0, SEAT_Y, -0.15 + i * 0.155, 1.34, 0.04, 0.13);
}
// Backrest slats (slightly reclined)
for (let i = 0; i < 3; i++) {
  bBox(0, 0.60 + i * 0.15, -0.235 - i * 0.028, 1.34, 0.11, 0.03, [-0.18, 0, 0]);
}
// End frames / legs
for (const sx of [-0.6, 0.6]) {
  bBox(sx, 0.23, 0.20, 0.07, 0.46, 0.07);   // front leg
  bBox(sx, 0.23, -0.14, 0.07, 0.46, 0.07);  // back leg
  bBox(sx, 0.45, 0.03, 0.09, 0.06, 0.42);   // seat rail
  bBox(sx, 0.615, 0.06, 0.08, 0.05, 0.42);  // armrest
  bBox(sx, 0.54, 0.24, 0.06, 0.20, 0.06);   // arm support
}

/* ---------------------------------------------------------------------------
   The seated elderly figure — hunched, coated, hands in lap
   (built forward-leaning: masses shift toward +z as they rise = the hunch)
--------------------------------------------------------------------------- */

// Pelvis / seated base
mass(0, 0.53, 0.06, 0.22, 0.14, 0.18);

// Thighs (roughly horizontal, forward), knees, calves, feet
for (const s of [-1, 1]) {
  limb([0.12 * s, 0.51, 0.02], [0.135 * s, 0.50, 0.40], 0.105);           // thigh
  mass(0.135 * s, 0.50, 0.42, 0.10, 0.10, 0.10, 0.03);                     // knee
  limb([0.135 * s, 0.49, 0.42], [0.145 * s, 0.10, 0.33], 0.078);          // calf
  const foot = addMesh(new THREE.BoxGeometry(0.13, 0.07, 0.27), bronze, figure);
  foot.position.set(0.145 * s, 0.05, 0.38);
  foot.castShadow = foot.receiveShadow = true;
}

// Coat draped over the lap (folds), where the hands will rest
const lap = mass(0, 0.55, 0.30, 0.30, 0.11, 0.25, 0.06);
lap.rotation.x = -0.12;

// Hunched torso — a curved stack of coat masses leaning forward
mass(0, 0.72, 0.10, 0.205, 0.16, 0.17, 0.05);   // lower torso
mass(0, 0.87, 0.15, 0.20, 0.155, 0.165, 0.05);  // mid torso
mass(0, 1.00, 0.21, 0.205, 0.15, 0.16, 0.05);   // upper chest/back
// Coat drape hanging down the back (defines the hunched silhouette)
mass(0, 0.90, 0.02, 0.21, 0.24, 0.13, 0.07);
// Broad rounded shoulders, pulled forward
mass(0, 1.075, 0.26, 0.24, 0.125, 0.16, 0.045);

// Coat collar around the neck
const collar = addMesh(
  roughen(new THREE.TorusGeometry(0.125, 0.05, 16, 40), 0.02, 9),
  bronze, figure
);
collar.position.set(0, 1.06, 0.27);
collar.rotation.x = Math.PI * 0.42;

// Neck + bowed head (facial detail intentionally minimal)
limb([0, 1.06, 0.28], [0, 1.14, 0.34], 0.052, 0.015);
const head = mass(0, 1.185, 0.375, 0.10, 0.115, 0.105, 0.02);
head.rotation.x = 0.35; // bowed downward/forward
// faint brow / nose suggestion
const brow = mass(0, 1.17, 0.47, 0.06, 0.035, 0.035, 0);
brow.rotation.x = 0.35;

// Arms wrapped forward, coat sleeves, hands clasped in the lap
for (const s of [-1, 1]) {
  limb([0.205 * s, 1.05, 0.24], [0.225 * s, 0.82, 0.31], 0.082, 0.025); // upper arm
  limb([0.225 * s, 0.82, 0.31], [0.075 * s, 0.63, 0.40], 0.072, 0.02);  // forearm to lap
  const hand = mass(0.06 * s, 0.61, 0.44, 0.09, 0.05, 0.11, 0.02);       // hand resting
  hand.rotation.x = -0.2;
}
// Suggestion of clasped hands at the center of the lap
mass(0, 0.615, 0.46, 0.09, 0.05, 0.08, 0.03);

/* ---------------------------------------------------------------------------
   Center the whole sculpture on the ground and at the origin
--------------------------------------------------------------------------- */
const box = new THREE.Box3().setFromObject(sculpture);
const center = box.getCenter(new THREE.Vector3());
sculpture.position.x -= center.x;
sculpture.position.z -= center.z;
sculpture.position.y -= box.min.y;

/* ---------------------------------------------------------------------------
   Controls
--------------------------------------------------------------------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 1.8;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.5;
controls.target.set(0, 0.9, 0.1);
controls.update();

/* ---------------------------------------------------------------------------
   Resize + render loop
--------------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
