<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brushed Steel Grinder</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #17191b;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x17191b);
  scene.fog = new THREE.Fog(0x17191b, 14, 25);

  const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 60);
  camera.position.set(9.3, 5.9, 11.2);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.55, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.enablePan = false;
  controls.minDistance = 8;
  controls.maxDistance = 22;
  controls.minPolarAngle = 0.55;
  controls.maxPolarAngle = 1.72;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.65;

  function seededNoise(x, y, seed = 1) {
    const value = Math.sin(x * 127.1 + y * 311.7 + seed * 74.7) * 43758.5453123;
    return value - Math.floor(value);
  }

  function makeSteelGrainTexture() {
    const width = 512;
    const height = 512;
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const context = canvas.getContext('2d');
    const image = context.createImageData(width, height);

    for (let y = 0; y < height; y++) {
      const fine = Math.sin(y * 2.8) * 5 + Math.sin(y * 0.73) * 4;
      const broad = Math.sin(y * 0.105) * 7;
      for (let x = 0; x < width; x++) {
        const noise = (seededNoise(x, y, 3) - 0.5) * 12;
        const streak = (seededNoise(Math.floor(x / 13), y, 8) - 0.5) * 4;
        const value = Math.max(0, Math.min(255, 128 + fine + broad + noise + streak));
        const index = (y * width + x) * 4;
        image.data[index] = value;
        image.data[index + 1] = value;
        image.data[index + 2] = value;
        image.data[index + 3] = 255;
      }
    }

    context.putImageData(image, 0, 0);
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(2.5, 8);
    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return texture;
  }

  function makeKnurlTexture() {
    const size = 512;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const context = canvas.getContext('2d');

    context.fillStyle = '#777777';
    context.fillRect(0, 0, size, size);
    context.lineCap = 'round';

    for (let offset = -size; offset < size * 2; offset += 31) {
      context.strokeStyle = '#dedede';
      context.lineWidth = 9;
      context.beginPath();
      context.moveTo(offset, 0);
      context.lineTo(offset + size, size);
      context.stroke();

      context.strokeStyle = '#343434';
      context.lineWidth = 3;
      context.beginPath();
      context.moveTo(offset + 8, 0);
      context.lineTo(offset + size + 8, size);
      context.stroke();

      context.strokeStyle = '#d4d4d4';
      context.lineWidth = 9;
      context.beginPath();
      context.moveTo(offset + size, 0);
      context.lineTo(offset, size);
      context.stroke();

      context.strokeStyle = '#303030';
      context.lineWidth = 3;
      context.beginPath();
      context.moveTo(offset + size - 8, 0);
      context.lineTo(offset - 8, size);
      context.stroke();
    }

    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(6, 1.45);
    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return texture;
  }

  function makeWalnutTexture() {
    const width = 512;
    const height = 256;
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    const context = canvas.getContext('2d');
    const image = context.createImageData(width, height);

    for (let y = 0; y < height; y++) {
      for (let x = 0; x < width; x++) {
        const wave = Math.sin(x * 0.055 + Math.sin(y * 0.052) * 2.5);
        const fine = Math.sin(x * 0.19 + y * 0.013) * 0.35;
        const grain = wave + fine + (seededNoise(x, y, 11) - 0.5) * 0.35;
        const dark = Math.pow(Math.abs(grain), 5);
        const index = (y * width + x) * 4;
        image.data[index] = 105 - dark * 52;
        image.data[index + 1] = 55 - dark * 27;
        image.data[index + 2] = 27 - dark * 13;
        image.data[index + 3] = 255;
      }
    }

    context.putImageData(image, 0, 0);
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(1.7, 1);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return texture;
  }

  const steelGrain = makeSteelGrainTexture();
  const knurlTexture = makeKnurlTexture();
  const walnutTexture = makeWalnutTexture();

  const steel = new THREE.MeshPhysicalMaterial({
    color: 0xb8bdbe,
    metalness: 1,
    roughness: 0.42,
    bumpMap: steelGrain,
    bumpScale: 0.018,
    clearcoat: 0.08,
    clearcoatRoughness: 0.7
  });

  const steelLight = new THREE.MeshPhysicalMaterial({
    color: 0xd0d4d3,
    metalness: 1,
    roughness: 0.31,
    bumpMap: steelGrain,
    bumpScale: 0.012,
    clearcoat: 0.1,
    clearcoatRoughness: 0.62
  });

  const steelDark = new THREE.MeshStandardMaterial({
    color: 0x555b5c,
    metalness: 0.93,
    roughness: 0.48
  });

  const knurledSteel = new THREE.MeshPhysicalMaterial({
    color: 0x9ca1a1,
    metalness: 1,
    roughness: 0.5,
    bumpMap: knurlTexture,
    bumpScale: 0.075,
    clearcoat: 0.04,
    clearcoatRoughness: 0.8
  });

  const walnut = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    map: walnutTexture,
    roughness: 0.43,
    metalness: 0,
    clearcoat: 0.24,
    clearcoatRoughness: 0.48
  });

  function createFlutedCylinder(radius, height, radialSegments, flutes, amplitude, material) {
    const geometry = new THREE.CylinderGeometry(
      radius,
      radius,
      height,
      radialSegments,
      1,
      false
    );
    const positions = geometry.attributes.position;

    for (let i = 0; i < positions.count; i++) {
      const x = positions.getX(i);
      const z = positions.getZ(i);
      const radialDistance = Math.hypot(x, z);

      if (radialDistance > radius * 0.8) {
        const angle = Math.atan2(z, x);
        const modulation = 1 + amplitude * Math.cos(angle * flutes);
        positions.setX(i, x * modulation);
        positions.setZ(i, z * modulation);
      }
    }

    positions.needsUpdate = true;
    geometry.computeVertexNormals();
    return new THREE.Mesh(geometry, material);
  }

  function makeRing(radius, tube, y, material = steelLight) {
    const mesh = new THREE.Mesh(
      new THREE.TorusGeometry(radius, tube, 12, 128),
      material
    );
    mesh.rotation.x = Math.PI / 2;
    mesh.position.y = y;
    return mesh;
  }

  function enableShadows(root) {
    root.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });
  }

  const grinder = new THREE.Group();
  grinder.rotation.y = -0.32;
  scene.add(grinder);

  const catchCup = createFlutedCylinder(1.46, 2.78, 192, 28, 0.005, steel);
  catchCup.position.y = -2.31;
  grinder.add(catchCup);

  const catchShoulder = new THREE.Mesh(
    new THREE.CylinderGeometry(1.43, 1.46, 0.28, 128),
    steel
  );
  catchShoulder.position.y = -0.78;
  grinder.add(catchShoulder);

  const baseBevel = new THREE.Mesh(
    new THREE.CylinderGeometry(1.34, 1.45, 0.22, 128),
    steel
  );
  baseBevel.position.y = -3.81;
  grinder.add(baseBevel);

  const baseInset = new THREE.Mesh(
    new THREE.CylinderGeometry(1.32, 1.32, 0.08, 128),
    steelDark
  );
  baseInset.position.y = -3.95;
  grinder.add(baseInset);

  grinder.add(makeRing(1.43, 0.035, -3.72));
  grinder.add(makeRing(1.43, 0.035, -0.89));

  const lowerBody = createFlutedCylinder(1.52, 1.36, 192, 30, 0.0055, steel);
  lowerBody.position.y = -0.01;
  grinder.add(lowerBody);

  const upperBody = createFlutedCylinder(1.52, 2.48, 192, 30, 0.0055, steel);
  upperBody.position.y = 2.07;
  grinder.add(upperBody);

  const knurlBand = new THREE.Mesh(
    new THREE.CylinderGeometry(1.58, 1.58, 1.12, 192, 1, false),
    knurledSteel
  );
  knurlBand.position.y = 0.82;
  grinder.add(knurlBand);

  grinder.add(makeRing(1.57, 0.045, 0.27));
  grinder.add(makeRing(1.57, 0.045, 1.37));

  const collar = new THREE.Mesh(
    new THREE.CylinderGeometry(1.53, 1.53, 0.34, 128),
    steelDark
  );
  collar.position.y = -0.72;
  grinder.add(collar);

  grinder.add(makeRing(1.53, 0.042, -0.55, steelLight));
  grinder.add(makeRing(1.53, 0.042, -0.88, steelLight));

  const threadPoints = [];
  const threadTurns = 2.55;
  const threadSegments = 280;
  for (let i = 0; i <= threadSegments; i++) {
    const fraction = i / threadSegments;
    const angle = fraction * Math.PI * 2 * threadTurns;
    threadPoints.push(new THREE.Vector3(
      Math.cos(angle) * 1.546,
      -0.91 + fraction * 0.38,
      Math.sin(angle) * 1.546
    ));
  }
  const threadCurve = new THREE.CatmullRomCurve3(threadPoints);
  const thread = new THREE.Mesh(
    new THREE.TubeGeometry(threadCurve, threadSegments, 0.026, 7, false),
    steelLight
  );
  grinder.add(thread);

  const topShoulder = new THREE.Mesh(
    new THREE.CylinderGeometry(1.43, 1.52, 0.26, 128),
    steel
  );
  topShoulder.position.y = 3.44;
  grinder.add(topShoulder);

  grinder.add(makeRing(1.47, 0.045, 3.34));

  const domeProfile = [
    new THREE.Vector2(0.02, 0.72),
    new THREE.Vector2(0.28, 0.7),
    new THREE.Vector2(0.62, 0.61),
    new THREE.Vector2(0.96, 0.45),
    new THREE.Vector2(1.24, 0.25),
    new THREE.Vector2(1.43, 0.04),
    new THREE.Vector2(1.43, 0)
  ];
  const dome = new THREE.Mesh(
    new THREE.LatheGeometry(domeProfile, 160),
    steelLight
  );
  dome.position.y = 3.57;
  grinder.add(dome);

  const topCap = new THREE.Mesh(
    new THREE.CylinderGeometry(0.35, 0.42, 0.16, 64),
    steelDark
  );
  topCap.position.y = 4.3;
  grinder.add(topCap);

  const spindle = new THREE.Mesh(
    new THREE.CylinderGeometry(0.13, 0.13, 0.48, 48),
    steelLight
  );
  spindle.position.y = 4.57;
  grinder.add(spindle);

  const pivotDisk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.29, 0.29, 0.23, 64),
    steelLight
  );
  pivotDisk.rotation.x = Math.PI / 2;
  pivotDisk.position.set(0, 4.74, 0);
  grinder.add(pivotDisk);

  const pivotInset = new THREE.Mesh(
    new THREE.CylinderGeometry(0.11, 0.11, 0.242, 40),
    steelDark
  );
  pivotInset.rotation.x = Math.PI / 2;
  pivotInset.position.set(0, 4.74, 0);
  grinder.add(pivotInset);

  function makeCapsuleArm(length, width, depth) {
    const radius = width * 0.5;
    const shape = new THREE.Shape();
    shape.moveTo(radius, -radius);
    shape.lineTo(length - radius, -radius);
    shape.quadraticCurveTo(length, -radius, length, 0);
    shape.quadraticCurveTo(length, radius, length - radius, radius);
    shape.lineTo(radius, radius);
    shape.quadraticCurveTo(0, radius, 0, 0);
    shape.quadraticCurveTo(0, -radius, radius, -radius);

    const geometry = new THREE.ExtrudeGeometry(shape, {
      depth,
      bevelEnabled: true,
      bevelSegments: 3,
      bevelSize: 0.045,
      bevelThickness: 0.035,
      curveSegments: 16
    });
    geometry.translate(0, 0, -depth * 0.5);
    return geometry;
  }

  const armAngle = 0.235;
  const armLength = 2.48;
  const crankArm = new THREE.Mesh(
    makeCapsuleArm(armLength, 0.28, 0.18),
    steelLight
  );
  crankArm.position.set(0, 4.74, 0);
  crankArm.rotation.z = armAngle;
  grinder.add(crankArm);

  const armEndX = Math.cos(armAngle) * armLength;
  const armEndY = 4.74 + Math.sin(armAngle) * armLength;

  const endHinge = new THREE.Mesh(
    new THREE.CylinderGeometry(0.25, 0.25, 0.27, 64),
    steelLight
  );
  endHinge.rotation.x = Math.PI / 2;
  endHinge.position.set(armEndX, armEndY, 0);
  grinder.add(endHinge);

  const handlePin = new THREE.Mesh(
    new THREE.CylinderGeometry(0.105, 0.105, 1.18, 48),
    steelDark
  );
  handlePin.position.set(armEndX, armEndY + 0.04, 0);
  grinder.add(handlePin);

  const knobProfile = [
    new THREE.Vector2(0.21, -0.54),
    new THREE.Vector2(0.28, -0.49),
    new THREE.Vector2(0.33, -0.36),
    new THREE.Vector2(0.35, -0.1),
    new THREE.Vector2(0.35, 0.23),
    new THREE.Vector2(0.32, 0.43),
    new THREE.Vector2(0.25, 0.54)
  ];
  const knob = new THREE.Mesh(
    new THREE.LatheGeometry(knobProfile, 80),
    walnut
  );
  knob.position.set(armEndX, armEndY + 0.14, 0);
  grinder.add(knob);

  const knobTop = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2, 0.25, 0.05, 64),
    walnut
  );
  knobTop.position.set(armEndX, armEndY + 0.7, 0);
  grinder.add(knobTop);

  const knobBolt = new THREE.Mesh(
    new THREE.CylinderGeometry(0.075, 0.075, 0.04, 32),
    steelLight
  );
  knobBolt.position.set(armEndX, armEndY + 0.735, 0);
  grinder.add(knobBolt);

  enableShadows(grinder);

  const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0x25282a,
    roughness: 0.94,
    metalness: 0.03
  });
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(12, 128),
    floorMaterial
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -4.01;
  floor.receiveShadow = true;
  scene.add(floor);

  const softBackdrop = new THREE.Mesh(
    new THREE.CircleGeometry(8, 96),
    new THREE.MeshBasicMaterial({
      color: 0x202427,
      transparent: true,
      opacity: 0.22,
      depthWrite: false
    })
  );
  softBackdrop.rotation.x = -Math.PI / 2;
  softBackdrop.position.y = -4.005;
  scene.add(softBackdrop);

  const hemisphere = new THREE.HemisphereLight(0xcbd8df, 0x161414, 1.25);
  scene.add(hemisphere);

  const keyLight = new THREE.DirectionalLight(0xf4f7f5, 4.3);
  keyLight.position.set(5.5, 10, 6);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.left = -6;
  keyLight.shadow.camera.right = 6;
  keyLight.shadow.camera.top = 8;
  keyLight.shadow.camera.bottom = -6;
  keyLight.shadow.camera.near = 1;
  keyLight.shadow.camera.far = 24;
  keyLight.shadow.bias = -0.00025;
  keyLight.shadow.normalBias = 0.025;
  scene.add(keyLight);

  const rimLight = new THREE.DirectionalLight(0x9fc3d6, 2.6);
  rimLight.position.set(-7, 5, -7);
  scene.add(rimLight);

  const warmFill = new THREE.PointLight(0xffc89a, 1.9, 18, 2);
  warmFill.position.set(4, 1, -5);
  scene.add(warmFill);

  const frontFill = new THREE.DirectionalLight(0xdde9ee, 1.05);
  frontFill.position.set(-2, 2, 8);
  scene.add(frontFill);

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
  });

  animate();
</script>
</body>
</html>
