<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kawaii Cactus</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f8dfd0; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf8dfd0);
scene.fog = new THREE.Fog(0xf8dfd0, 8, 15);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2.7, 8);
camera.lookAt(0, 2.25, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.5;
controls.minDistance = 5.5;
controls.maxDistance = 11;
controls.target.set(0, 2.25, 0);

const ambient = new THREE.HemisphereLight(0xfff4e8, 0xb5775c, 2.2);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xfff5df, 3.5);
keyLight.position.set(-4, 7, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 20;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xffc4b0, 1.2);
fillLight.position.set(4, 3, -4);
scene.add(fillLight);

const cactusMaterial = new THREE.MeshToonMaterial({ color: 0x72c978 });
const cactusLightMaterial = new THREE.MeshToonMaterial({ color: 0x8bd987 });
const potMaterial = new THREE.MeshToonMaterial({ color: 0xd47758 });
const potDarkMaterial = new THREE.MeshToonMaterial({ color: 0xb75c49 });
const darkMaterial = new THREE.MeshToonMaterial({ color: 0x3b3940 });
const pinkMaterial = new THREE.MeshToonMaterial({ color: 0xf58eae });
const pinkLightMaterial = new THREE.MeshToonMaterial({ color: 0xffb0c5 });
const yellowMaterial = new THREE.MeshToonMaterial({ color: 0xffd768 });
const spineMaterial = new THREE.MeshToonMaterial({ color: 0xf6df9b });
const soilMaterial = new THREE.MeshToonMaterial({ color: 0x734b3a });

function makeMesh(geometry, material, position, scale) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(position);
  if (scale) mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function cylinderBetween(start, end, radius, material, radialSegments = 20) {
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(radius, radius * 1.05, length, radialSegments);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const character = new THREE.Group();
scene.add(character);

const pot = makeMesh(
  new THREE.CylinderGeometry(0.82, 0.62, 1.05, 48),
  potMaterial,
  new THREE.Vector3(0, 0.75, 0)
);
character.add(pot);

const potRim = makeMesh(
  new THREE.TorusGeometry(0.79, 0.13, 12, 48),
  potDarkMaterial,
  new THREE.Vector3(0, 1.25, 0)
);
potRim.rotation.x = Math.PI / 2;
character.add(potRim);

const soil = makeMesh(
  new THREE.CylinderGeometry(0.69, 0.69, 0.055, 48),
  soilMaterial,
  new THREE.Vector3(0, 1.29, 0)
);
character.add(soil);

const body = makeMesh(
  new THREE.SphereGeometry(1, 48, 32),
  cactusMaterial,
  new THREE.Vector3(0, 2.45, 0),
  new THREE.Vector3(1.28, 1.45, 0.9)
);
character.add(body);

const bodyHighlight = makeMesh(
  new THREE.SphereGeometry(1, 32, 24),
  cactusLightMaterial,
  new THREE.Vector3(-0.48, 2.95, 0.62),
  new THREE.Vector3(0.25, 0.42, 0.08)
);
bodyHighlight.castShadow = false;
character.add(bodyHighlight);

const leftShoulder = makeMesh(
  new THREE.SphereGeometry(1, 32, 24),
  cactusMaterial,
  new THREE.Vector3(-1.08, 2.7, 0),
  new THREE.Vector3(0.52, 0.58, 0.52)
);
character.add(leftShoulder);

const rightShoulder = makeMesh(
  new THREE.SphereGeometry(1, 32, 24),
  cactusMaterial,
  new THREE.Vector3(1.08, 2.7, 0),
  new THREE.Vector3(0.52, 0.58, 0.52)
);
character.add(rightShoulder);

const leftArmStart = new THREE.Vector3(-1.12, 2.78, 0);
const leftArmEnd = new THREE.Vector3(-1.55, 3.45, 0.02);
const rightArmStart = new THREE.Vector3(1.12, 2.78, 0);
const rightArmEnd = new THREE.Vector3(1.55, 3.45, 0.02);

character.add(cylinderBetween(leftArmStart, leftArmEnd, 0.27, cactusMaterial));
character.add(cylinderBetween(rightArmStart, rightArmEnd, 0.27, cactusMaterial));

const leftHand = makeMesh(
  new THREE.SphereGeometry(1, 28, 20),
  cactusMaterial,
  leftArmEnd,
  new THREE.Vector3(0.3, 0.3, 0.3)
);
const rightHand = makeMesh(
  new THREE.SphereGeometry(1, 28, 20),
  cactusMaterial,
  rightArmEnd,
  new THREE.Vector3(0.3, 0.3, 0.3)
);
character.add(leftHand, rightHand);

const eyeGeometry = new THREE.SphereGeometry(1, 24, 16);
const leftEye = makeMesh(eyeGeometry, darkMaterial, new THREE.Vector3(-0.38, 2.52, 0.83), new THREE.Vector3(0.105, 0.145, 0.08));
const rightEye = makeMesh(eyeGeometry, darkMaterial, new THREE.Vector3(0.38, 2.52, 0.83), new THREE.Vector3(0.105, 0.145, 0.08));
character.add(leftEye, rightEye);

const eyeSparkleMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
const sparkleGeometry = new THREE.SphereGeometry(1, 12, 8);
const leftSparkle = makeMesh(sparkleGeometry, eyeSparkleMaterial, new THREE.Vector3(-0.415, 2.58, 0.9), new THREE.Vector3(0.027, 0.035, 0.018));
const rightSparkle = makeMesh(sparkleGeometry, eyeSparkleMaterial, new THREE.Vector3(0.345, 2.58, 0.9), new THREE.Vector3(0.027, 0.035, 0.018));
leftSparkle.castShadow = false;
rightSparkle.castShadow = false;
character.add(leftSparkle, rightSparkle);

const cheekGeometry = new THREE.SphereGeometry(1, 24, 16);
const leftCheek = makeMesh(cheekGeometry, pinkLightMaterial, new THREE.Vector3(-0.72, 2.2, 0.79), new THREE.Vector3(0.2, 0.105, 0.06));
const rightCheek = makeMesh(cheekGeometry, pinkLightMaterial, new THREE.Vector3(0.72, 2.2, 0.79), new THREE.Vector3(0.2, 0.105, 0.06));
character.add(leftCheek, rightCheek);

const smile = new THREE.Group();
const smileLeft = makeMesh(new THREE.SphereGeometry(1, 20, 14), darkMaterial, new THREE.Vector3(-0.105, 2.25, 0.86), new THREE.Vector3(0.07, 0.13, 0.055));
const smileRight = makeMesh(new THREE.SphereGeometry(1, 20, 14), darkMaterial, new THREE.Vector3(0.105, 2.25, 0.86), new THREE.Vector3(0.07, 0.13, 0.055));
smileLeft.rotation.z = -0.45;
smileRight.rotation.z = 0.45;
smile.add(smileLeft, smileRight);
character.add(smile);

const spinePositions = [
  [-0.78, 3.18, 0.58], [0, 3.48, 0.55], [0.78, 3.18, 0.58],
  [-0.95, 2.86, 0.58], [0.96, 2.86, 0.58],
  [-1.02, 2.35, 0.54], [1.02, 2.35, 0.54],
  [-0.78, 1.88, 0.53], [0, 1.7, 0.58], [0.78, 1.88, 0.53]
];
for (const position of spinePositions) {
  const spine = makeMesh(
    new THREE.SphereGeometry(1, 12, 8),
    spineMaterial,
    new THREE.Vector3(position[0], position[1], position[2]),
    new THREE.Vector3(0.055, 0.11, 0.035)
  );
  spine.rotation.z = position[0] * 0.35;
  spine.castShadow = false;
  character.add(spine);
}

const flower = new THREE.Group();
flower.position.set(0, 3.95, 0.02);

const stem = makeMesh(
  new THREE.CylinderGeometry(0.075, 0.09, 0.48, 16),
  cactusMaterial,
  new THREE.Vector3(0, -0.18, 0)
);
flower.add(stem);

const petalGeometry = new THREE.SphereGeometry(1, 24, 16);
const petalData = [
  [0, 0.28, 0, 0.27, 0.38, 0.13],
  [0.28, 0, 0, 0.38, 0.27, 0.13],
  [0, -0.28, 0, 0.27, 0.38, 0.13],
  [-0.28, 0, 0, 0.38, 0.27, 0.13],
  [0.2, 0.2, 0, 0.26, 0.3, 0.13],
  [-0.2, 0.2, 0, 0.26, 0.3, 0.13]
];
for (const item of petalData) {
  const petal = makeMesh(
    petalGeometry,
    pinkMaterial,
    new THREE.Vector3(item[0], item[1], item[2]),
    new THREE.Vector3(item[3], item[4], item[5])
  );
  flower.add(petal);
}
const flowerCenter = makeMesh(
  new THREE.SphereGeometry(1, 24, 16),
  yellowMaterial,
  new THREE.Vector3(0, 0, 0.1),
  new THREE.Vector3(0.2, 0.2, 0.14)
);
flower.add(flowerCenter);
character.add(flower);

const ground = makeMesh(
  new THREE.CircleGeometry(5.5, 64),
  new THREE.MeshToonMaterial({ color: 0xf4cdbd }),
  new THREE.Vector3(0, 0.18, 0)
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const shadow = makeMesh(
  new THREE.EllipseCurve ? new THREE.CircleGeometry(1.4, 48) : new THREE.CircleGeometry(1.4, 48),
  new THREE.MeshBasicMaterial({ color: 0xc99386, transparent: true, opacity: 0.24 }),
  new THREE.Vector3(0, 0.195, 0.05),
  new THREE.Vector3(1.25, 0.42, 1)
);
shadow.rotation.x = -Math.PI / 2;
shadow.renderOrder = 1;
scene.add(shadow);

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener("resize", resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
