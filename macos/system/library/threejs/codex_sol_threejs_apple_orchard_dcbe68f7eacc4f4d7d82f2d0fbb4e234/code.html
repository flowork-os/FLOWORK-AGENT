<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Small Apple Orchard</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #bcd8e4;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .caption {
      position: fixed;
      left: 20px;
      bottom: 18px;
      padding: 10px 14px;
      color: rgba(255,255,255,.92);
      background: rgba(24,38,24,.42);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 8px;
      font: 12px/1.4 system-ui, sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      backdrop-filter: blur(6px);
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="caption">Apple orchard · 5.2 m tree spacing</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xbad7e5);
    scene.fog = new THREE.FogExp2(0xbad7e5, 0.026);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(11.5, 7.2, 13.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.25, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.42;
    controls.minDistance = 7;
    controls.maxDistance = 26;
    controls.maxPolarAngle = Math.PI * 0.475;

    const hemisphere = new THREE.HemisphereLight(0xd9f0ff, 0x52613a, 2.0);
    scene.add(hemisphere);

    const sun = new THREE.DirectionalLight(0xfff1cd, 4.0);
    sun.position.set(-8, 13, 7);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -14;
    sun.shadow.camera.right = 14;
    sun.shadow.camera.top = 11;
    sun.shadow.camera.bottom = -10;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 35;
    sun.shadow.bias = -0.00035;
    sun.shadow.normalBias = 0.025;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xb8d8ff, 0.55);
    fill.position.set(8, 5, -9);
    scene.add(fill);

    function groundHeight(x, z) {
      return (
        0.10 * Math.sin(x * 0.35) +
        0.07 * Math.cos(z * 0.48) +
        0.035 * Math.sin(x * 0.72 + z * 0.41)
      );
    }

    const groundGeometry = new THREE.PlaneGeometry(28, 19, 84, 58);
    groundGeometry.rotateX(-Math.PI / 2);
    const groundPositions = groundGeometry.attributes.position;
    for (let i = 0; i < groundPositions.count; i++) {
      const x = groundPositions.getX(i);
      const z = groundPositions.getZ(i);
      groundPositions.setY(i, groundHeight(x, z));
    }
    groundGeometry.computeVertexNormals();

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x668b46,
      roughness: 0.96,
      metalness: 0
    });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.receiveShadow = true;
    scene.add(ground);

    const distantGround = new THREE.Mesh(
      new THREE.CircleGeometry(46, 64),
      new THREE.MeshStandardMaterial({
        color: 0x789b58,
        roughness: 1
      })
    );
    distantGround.rotation.x = -Math.PI / 2;
    distantGround.position.y = -0.22;
    distantGround.receiveShadow = true;
    scene.add(distantGround);

    function mulberry32(seed) {
      return function () {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    const trunkMaterial = new THREE.MeshStandardMaterial({
      color: 0x6d4529,
      roughness: 0.92
    });
    const branchMaterial = new THREE.MeshStandardMaterial({
      color: 0x765036,
      roughness: 0.9
    });
    const leafMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x416d32, roughness: 0.88 }),
      new THREE.MeshStandardMaterial({ color: 0x527f3b, roughness: 0.9 }),
      new THREE.MeshStandardMaterial({ color: 0x608d42, roughness: 0.9 }),
      new THREE.MeshStandardMaterial({ color: 0x355f2d, roughness: 0.9 })
    ];
    const appleMaterials = [
      new THREE.MeshStandardMaterial({ color: 0xb92f24, roughness: 0.5 }),
      new THREE.MeshStandardMaterial({ color: 0xd3462d, roughness: 0.48 }),
      new THREE.MeshStandardMaterial({ color: 0xa92420, roughness: 0.52 }),
      new THREE.MeshStandardMaterial({ color: 0xd75a31, roughness: 0.5 })
    ];
    const stemMaterial = new THREE.MeshStandardMaterial({
      color: 0x4d3420,
      roughness: 0.9
    });
    const mulchMaterial = new THREE.MeshStandardMaterial({
      color: 0x5b472c,
      roughness: 1
    });

    const leafGeometry = new THREE.IcosahedronGeometry(1, 2);
    const appleGeometry = new THREE.SphereGeometry(0.105, 12, 9);
    appleGeometry.scale(1, 0.96, 1);
    const stemGeometry = new THREE.CylinderGeometry(0.012, 0.016, 0.11, 6);
    const branchGeometry = new THREE.CylinderGeometry(1, 1, 1, 8, 1);

    function makeCylinderBetween(start, end, radiusStart, radiusEnd, material) {
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();
      const geometry = branchGeometry.clone();
      const position = geometry.attributes.position;

      for (let i = 0; i < position.count; i++) {
        const y = position.getY(i);
        const t = y + 0.5;
        const radius = THREE.MathUtils.lerp(radiusStart, radiusEnd, t);
        position.setX(i, position.getX(i) * radius);
        position.setZ(i, position.getZ(i) * radius);
        position.setY(i, y * length);
      }
      geometry.computeVertexNormals();

      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function createTree(x, z, seed) {
      const random = mulberry32(seed);
      const baseY = groundHeight(x, z);
      const tree = new THREE.Group();
      tree.position.set(x, baseY, z);
      scene.add(tree);

      const mulch = new THREE.Mesh(
        new THREE.CircleGeometry(0.67, 28),
        mulchMaterial
      );
      mulch.rotation.x = -Math.PI / 2;
      mulch.position.y = 0.025;
      mulch.scale.set(1, 0.84, 1);
      mulch.receiveShadow = true;
      tree.add(mulch);

      const trunkHeight = 2.65 + random() * 0.18;
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.145, 0.255, trunkHeight, 12, 4),
        trunkMaterial
      );
      trunk.position.y = trunkHeight * 0.5;
      trunk.rotation.z = (random() - 0.5) * 0.025;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      tree.add(trunk);

      const clusterCenters = [
        new THREE.Vector3(-0.72, 3.38, 0.05),
        new THREE.Vector3(0.68, 3.42, 0.12),
        new THREE.Vector3(-0.18, 4.03, 0.02),
        new THREE.Vector3(0.13, 3.53, -0.72),
        new THREE.Vector3(0.08, 3.48, 0.72),
        new THREE.Vector3(-0.65, 3.72, -0.55),
        new THREE.Vector3(0.67, 3.78, 0.53),
        new THREE.Vector3(0.02, 4.32, -0.12)
      ];

      for (let i = 0; i < clusterCenters.length; i++) {
        const center = clusterCenters[i];
        center.x += (random() - 0.5) * 0.22;
        center.y += (random() - 0.5) * 0.18;
        center.z += (random() - 0.5) * 0.22;

        if (i < 7) {
          const branchStart = new THREE.Vector3(
            (random() - 0.5) * 0.06,
            1.55 + random() * 0.65,
            (random() - 0.5) * 0.06
          );
          const branchEnd = center.clone().multiplyScalar(0.76);
          branchEnd.y -= 0.15;
          tree.add(
            makeCylinderBetween(
              branchStart,
              branchEnd,
              0.075 + random() * 0.025,
              0.025,
              branchMaterial
            )
          );
        }

        const crown = new THREE.Mesh(
          leafGeometry,
          leafMaterials[Math.floor(random() * leafMaterials.length)]
        );
        crown.position.copy(center);
        const scale = 0.78 + random() * 0.22;
        crown.scale.set(
          scale * (1.08 + random() * 0.18),
          scale * (0.82 + random() * 0.16),
          scale * (1.0 + random() * 0.2)
        );
        crown.rotation.set(random() * 2, random() * 2, random() * 2);
        crown.castShadow = true;
        crown.receiveShadow = true;
        tree.add(crown);
      }

      for (let i = 0; i < 19; i++) {
        const angle = random() * Math.PI * 2;
        const vertical = -0.72 + random() * 1.45;
        const horizontalRadius = Math.sqrt(Math.max(0.1, 1 - vertical * vertical)) *
          (1.18 + random() * 0.35);
        const apple = new THREE.Mesh(
          appleGeometry,
          appleMaterials[Math.floor(random() * appleMaterials.length)]
        );
        apple.position.set(
          Math.cos(angle) * horizontalRadius + (random() - 0.5) * 0.35,
          3.62 + vertical * 0.95,
          Math.sin(angle) * horizontalRadius * 0.86 + (random() - 0.5) * 0.28
        );
        const appleScale = 0.82 + random() * 0.34;
        apple.scale.setScalar(appleScale);
        apple.castShadow = true;
        tree.add(apple);

        const stem = new THREE.Mesh(stemGeometry, stemMaterial);
        stem.position.copy(apple.position);
        stem.position.y += 0.1 * appleScale;
        stem.rotation.z = (random() - 0.5) * 0.35;
        stem.castShadow = true;
        tree.add(stem);
      }
    }

    createTree(-5.2, 0, 8123);
    createTree(0, 0, 16411);
    createTree(5.2, 0, 30107);

    const grassGeometry = new THREE.ConeGeometry(0.025, 0.2, 3);
    grassGeometry.translate(0, 0.1, 0);
    const grassMaterial = new THREE.MeshStandardMaterial({
      color: 0x3f7136,
      roughness: 1,
      side: THREE.DoubleSide
    });
    const grass = new THREE.InstancedMesh(grassGeometry, grassMaterial, 360);
    const grassRandom = mulberry32(90210);
    const dummy = new THREE.Object3D();

    for (let i = 0; i < 360; i++) {
      let gx = (grassRandom() - 0.5) * 25;
      let gz = (grassRandom() - 0.5) * 16;
      let safe = false;

      for (let attempt = 0; attempt < 8 && !safe; attempt++) {
        safe = true;
        for (const tx of [-5.2, 0, 5.2]) {
          if (Math.hypot(gx - tx, gz) < 0.78) {
            gx = (grassRandom() - 0.5) * 25;
            gz = (grassRandom() - 0.5) * 16;
            safe = false;
            break;
          }
        }
      }

      dummy.position.set(gx, groundHeight(gx, gz) + 0.012, gz);
      dummy.rotation.set(
        (grassRandom() - 0.5) * 0.12,
        grassRandom() * Math.PI * 2,
        (grassRandom() - 0.5) * 0.12
      );
      const bladeScale = 0.55 + grassRandom() * 1.25;
      dummy.scale.set(
        0.7 + grassRandom() * 0.65,
        bladeScale,
        0.7 + grassRandom() * 0.65
      );
      dummy.updateMatrix();
      grass.setMatrixAt(i, dummy.matrix);
    }
    grass.instanceMatrix.needsUpdate = true;
    grass.receiveShadow = true;
    scene.add(grass);

    const rowMarkerMaterial = new THREE.MeshStandardMaterial({
      color: 0xd6c59b,
      roughness: 0.9
    });
    for (const x of [-7.8, 7.8]) {
      const post = new THREE.Mesh(
        new THREE.CylinderGeometry(0.045, 0.06, 0.72, 8),
        rowMarkerMaterial
      );
      const z = 0;
      post.position.set(x, groundHeight(x, z) + 0.36, z);
      post.castShadow = true;
      scene.add(post);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    animate();
  </script>
</body>
</html>
