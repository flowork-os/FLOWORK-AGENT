<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claymation Sloth</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #d8c9b5;
}
canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8c9b5);
scene.fog = new THREE.Fog(0xd8c9b5, 10, 19);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.3, 2.8, 9.4);
camera.lookAt(0, 0.1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.target.set(0, 0.15, 0);
controls.minDistance = 6.5;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.78;

scene.add(new THREE.HemisphereLight(0xfff3df, 0x66584f, 2.15));

const keyLight = new THREE.DirectionalLight(0xffe7c5, 4.2);
keyLight.position.set(-4.5, 7, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -5;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 18;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xb7c9d6, 2.1);
rimLight.position.set(5, 3, -5);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0xffcda5, 24, 12, 2);
fillLight.position.set(3.5, -1, 4);
scene.add(fillLight);

const sloth = new THREE.Group();
sloth.rotation.y = -0.08;
scene.add(sloth);

const materials = {
  coat: new THREE.MeshStandardMaterial({ color: 0x655b51, roughness: 0.81, metalness: 0 }),
  coatLight: new THREE.MeshStandardMaterial({ color: 0x776b5e, roughness: 0.84 }),
  coatDark: new THREE.MeshStandardMaterial({ color: 0x4c4540, roughness: 0.88 }),
  coatWarm: new THREE.MeshStandardMaterial({ color: 0x887666, roughness: 0.82 }),
  mask: new THREE.MeshStandardMaterial({ color: 0xc7a982, roughness: 0.76 }),
  maskLight: new THREE.MeshStandardMaterial({ color: 0xd2b68f, roughness: 0.73 }),
  eye: new THREE.MeshStandardMaterial({ color: 0x171413, roughness: 0.55 }),
  highlight: new THREE.MeshStandardMaterial({ color: 0xf7ead7, roughness: 0.45 }),
  claw: new THREE.MeshStandardMaterial({ color: 0xd8c69e, roughness: 0.67 }),
  mouth: new THREE.MeshStandardMaterial({ color: 0x30231f, roughness: 0.78 }),
  branch: new THREE.MeshStandardMaterial({ color: 0x60452f, roughness: 0.91 }),
  branchLight: new THREE.MeshStandardMaterial({ color: 0x846044, roughness: 0.9 }),
  groove: new THREE.MeshStandardMaterial({ color: 0x413a35, roughness: 0.95 })
};

function seedRandom(seed) {
  let value = seed >>> 0;
  return () => {
    value = (value * 1664525 + 1013904223) >>> 0;
    return value / 4294967296;
  };
}
const random = seedRandom(81927);

function clayGeometry(geometry, strength = 0.035, frequency = 4) {
  geometry.computeVertexNormals();
  const position = geometry.attributes.position;
  const normal = geometry.attributes.normal;
  const vertex = new THREE.Vector3();
  const direction = new THREE.Vector3();

  for (let i = 0; i < position.count; i++) {
    vertex.fromBufferAttribute(position, i);
    direction.fromBufferAttribute(normal, i);
    const noise =
      Math.sin(vertex.x * frequency * 2.17 + vertex.y * 3.41) *
      Math.sin(vertex.z * frequency * 2.63 - vertex.x * 2.09) *
      Math.cos(vertex.y * frequency * 1.73 + vertex.z * 3.07);
    vertex.addScaledVector(direction, noise * strength);
    position.setXYZ(i, vertex.x, vertex.y, vertex.z);
  }
  position.needsUpdate = true;
  geometry.computeVertexNormals();
  return geometry;
}

function mesh(geometry, material, position, scale, parent = sloth) {
  const object = new THREE.Mesh(geometry, material);
  object.position.copy(position);
  object.scale.copy(scale);
  object.castShadow = true;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}

function claySphere(position, scale, material, detail = 5, wobble = 0.028, parent = sloth) {
  const geometry = clayGeometry(new THREE.SphereGeometry(1, 32, 22), wobble, detail);
  return mesh(geometry, material, position, scale, parent);
}

function tube(points, radius, material, segments = 30, radialSegments = 8, parent = sloth) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geometry = clayGeometry(
    new THREE.TubeGeometry(curve, segments, radius, radialSegments, false),
    radius * 0.09,
    19
  );
  return mesh(geometry, material, new THREE.Vector3(), new THREE.Vector3(1, 1, 1), parent);
}

function orientBetween(object, start, end) {
  const direction = new THREE.Vector3().subVectors(end, start);
  object.position.copy(start).add(end).multiplyScalar(0.5);
  object.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.clone().normalize()
  );
  return direction.length();
}

function capsuleBetween(start, end, radius, material, parent = sloth) {
  const length = start.distanceTo(end);
  const geometry = clayGeometry(
    new THREE.CapsuleGeometry(radius, Math.max(0.01, length - radius * 2), 7, 14),
    radius * 0.035,
    13
  );
  const object = mesh(geometry, material, new THREE.Vector3(), new THREE.Vector3(1, 1, 1), parent);
  orientBetween(object, start, end);
  return object;
}

function addTip(point, direction, radius, material, parent = sloth) {
  const geometry = clayGeometry(new THREE.ConeGeometry(radius, radius * 2.5, 12, 3), radius * 0.06, 18);
  const tip = mesh(geometry, material, point.clone(), new THREE.Vector3(1, 1, 1), parent);
  tip.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.clone().normalize());
  return tip;
}

function fingerprint(center, radius, material, z, parent = sloth, flatten = 1) {
  for (let ring = 0; ring < 3; ring++) {
    const r = radius * (0.46 + ring * 0.23);
    const points = [];
    for (let i = 0; i <= 18; i++) {
      const angle = THREE.MathUtils.lerp(-2.45, 0.65, i / 18);
      points.push(new THREE.Vector3(
        center.x + Math.cos(angle) * r,
        center.y + Math.sin(angle) * r * flatten,
        z + ring * 0.001
      ));
    }
    tube(points, 0.008, material, 18, 5, parent);
  }
}

const branchGroup = new THREE.Group();
sloth.add(branchGroup);

const branchGeometry = clayGeometry(new THREE.CylinderGeometry(0.235, 0.29, 4.65, 18, 7), 0.025, 11);
const branch = mesh(
  branchGeometry,
  materials.branch,
  new THREE.Vector3(0, 2.28, -0.04),
  new THREE.Vector3(1, 1, 1),
  branchGroup
);
branch.rotation.z = Math.PI / 2;

const leftCut = claySphere(
  new THREE.Vector3(-2.32, 2.28, -0.04),
  new THREE.Vector3(0.028, 0.225, 0.225),
  materials.branchLight,
  8,
  0.01,
  branchGroup
);
leftCut.rotation.z = Math.PI / 2;

const rightCut = claySphere(
  new THREE.Vector3(2.32, 2.28, -0.04),
  new THREE.Vector3(0.028, 0.27, 0.27),
  materials.branchLight,
  8,
  0.01,
  branchGroup
);
rightCut.rotation.z = Math.PI / 2;

const twigStart = new THREE.Vector3(1.55, 2.32, -0.04);
const twigEnd = new THREE.Vector3(1.94, 2.82, -0.12);
capsuleBetween(twigStart, twigEnd, 0.12, materials.branch, branchGroup);
claySphere(new THREE.Vector3(1.94, 2.82, -0.12), new THREE.Vector3(0.12, 0.055, 0.12), materials.branchLight, 7, 0.01, branchGroup);

for (let i = 0; i < 14; i++) {
  const x = -2.05 + i * 0.31;
  const angle = random() * Math.PI * 2;
  const y = 2.28 + Math.cos(angle) * 0.242;
  const z = -0.04 + Math.sin(angle) * 0.242;
  const points = [
    new THREE.Vector3(x - 0.11, y, z),
    new THREE.Vector3(x, y + 0.012, z),
    new THREE.Vector3(x + 0.12, y - 0.006, z)
  ];
  tube(points, 0.013, i % 3 === 0 ? materials.branchLight : materials.groove, 8, 5, branchGroup);
}

const body = claySphere(
  new THREE.Vector3(0, -0.23, -0.05),
  new THREE.Vector3(1.08, 1.52, 0.67),
  materials.coat,
  5,
  0.045
);
body.rotation.z = -0.025;

const belly = claySphere(
  new THREE.Vector3(0.03, -0.52, 0.52),
  new THREE.Vector3(0.76, 1.05, 0.17),
  materials.coatLight,
  5,
  0.032
);

const coatPalette = [materials.coatLight, materials.coatDark, materials.coatWarm, materials.coat];
for (let i = 0; i < 72; i++) {
  const theta = 0.3 + random() * 2.48;
  const phi = random() * Math.PI * 2;
  const sx = 0.99 * Math.sin(theta) * Math.cos(phi);
  const sy = -0.2 + 1.39 * Math.cos(theta);
  const sz = 0.61 * Math.sin(theta) * Math.sin(phi);
  const length = 0.19 + random() * 0.21;
  const curl = (random() - 0.5) * 0.13;
  const points = [
    new THREE.Vector3(sx, sy + length * 0.45, sz),
    new THREE.Vector3(sx + curl, sy, sz + (random() - 0.5) * 0.055),
    new THREE.Vector3(sx - curl * 0.45, sy - length * 0.55, sz + 0.018)
  ];
  tube(points, 0.042 + random() * 0.018, coatPalette[i % coatPalette.length], 9, 6);
}

const leftArmPoints = [
  new THREE.Vector3(-0.72, 0.55, 0.03),
  new THREE.Vector3(-1.23, 0.91, 0.03),
  new THREE.Vector3(-1.64, 1.47, 0.02),
  new THREE.Vector3(-1.72, 2.04, 0.04)
];
const rightArmPoints = [
  new THREE.Vector3(0.7, 0.56, 0.02),
  new THREE.Vector3(1.19, 0.95, 0.02),
  new THREE.Vector3(1.59, 1.5, 0.03),
  new THREE.Vector3(1.69, 2.04, 0.04)
];
tube(leftArmPoints, 0.25, materials.coat, 36, 12);
tube(rightArmPoints, 0.25, materials.coat, 36, 12);

for (const side of [-1, 1]) {
  for (let i = 0; i < 7; i++) {
    const offset = (i - 3) * 0.035;
    const armPoints = side < 0 ? leftArmPoints : rightArmPoints;
    const shifted = armPoints.map((point, index) => new THREE.Vector3(
      point.x + offset * (0.3 + index * 0.15),
      point.y - 0.025 + Math.sin(i * 1.7) * 0.018,
      point.z + 0.21 + (i % 2) * 0.02
    ));
    tube(shifted, 0.025 + (i % 3) * 0.004, coatPalette[(i + (side > 0 ? 1 : 0)) % coatPalette.length], 20, 5);
  }

  const handX = side * 1.72;
  claySphere(
    new THREE.Vector3(handX, 2.02, 0.07),
    new THREE.Vector3(0.34, 0.3, 0.27),
    materials.coatWarm,
    6,
    0.024
  );

  fingerprint(
    new THREE.Vector3(handX - side * 0.015, 2.01, 0.34),
    0.13,
    materials.coatDark,
    0.347,
    sloth,
    0.72
  );

  for (let clawIndex = 0; clawIndex < 3; clawIndex++) {
    const z = 0.18 + clawIndex * 0.115;
    const spread = (clawIndex - 1) * 0.105;
    const root = new THREE.Vector3(handX + spread, 2.08, z);
    const crest = new THREE.Vector3(handX + side * (0.03 + clawIndex * 0.012), 2.51, z - 0.015);
    const hook = new THREE.Vector3(handX - side * (0.19 + clawIndex * 0.018), 2.23, z - 0.075);
    const end = new THREE.Vector3(handX - side * (0.22 + clawIndex * 0.02), 2.02, z - 0.09);
    tube([root, crest, hook, end], 0.074, materials.claw, 24, 9);
    addTip(
      end,
      new THREE.Vector3(-side * 0.06, -0.19, -0.02),
      0.071,
      materials.claw
    );
  }
}

const leftLeg = [
  new THREE.Vector3(-0.56, -0.74, 0.02),
  new THREE.Vector3(-0.82, -1.21, 0.06),
  new THREE.Vector3(-0.55, -1.57, 0.22),
  new THREE.Vector3(-0.14, -1.46, 0.38)
];
const rightLeg = [
  new THREE.Vector3(0.55, -0.72, 0.01),
  new THREE.Vector3(0.82, -1.18, 0.05),
  new THREE.Vector3(0.56, -1.56, 0.2),
  new THREE.Vector3(0.14, -1.47, 0.39)
];
tube(leftLeg, 0.28, materials.coatDark, 28, 11);
tube(rightLeg, 0.28, materials.coatDark, 28, 11);

for (const side of [-1, 1]) {
  const foot = claySphere(
    new THREE.Vector3(side * 0.22, -1.48, 0.42),
    new THREE.Vector3(0.42, 0.24, 0.28),
    materials.coatWarm,
    5,
    0.023
  );
  foot.rotation.z = side * 0.18;
  for (let i = 0; i < 3; i++) {
    const start = new THREE.Vector3(side * (0.08 + i * 0.09), -1.48 + i * 0.015, 0.61);
    const end = new THREE.Vector3(side * (0.05 + i * 0.11), -1.57, 0.82 + i * 0.015);
    capsuleBetween(start, end, 0.052, materials.claw);
    addTip(end, new THREE.Vector3(side * 0.01, -0.07, 0.1), 0.05, materials.claw);
  }
}

const head = claySphere(
  new THREE.Vector3(0, 0.73, 0.42),
  new THREE.Vector3(0.9, 0.82, 0.5),
  materials.coatWarm,
  5,
  0.038
);

const leftMask = claySphere(
  new THREE.Vector3(-0.27, 0.76, 0.82),
  new THREE.Vector3(0.47, 0.51, 0.11),
  materials.mask,
  6,
  0.022
);
leftMask.rotation.z = -0.23;

const rightMask = claySphere(
  new THREE.Vector3(0.27, 0.76, 0.82),
  new THREE.Vector3(0.47, 0.51, 0.11),
  materials.maskLight,
  6,
  0.022
);
rightMask.rotation.z = 0.23;

claySphere(
  new THREE.Vector3(0, 0.54, 0.91),
  new THREE.Vector3(0.42, 0.29, 0.11),
  materials.maskLight,
  6,
  0.016
);

for (const side of [-1, 1]) {
  const eye = claySphere(
    new THREE.Vector3(side * 0.27, 0.8, 0.947),
    new THREE.Vector3(0.145, 0.105, 0.05),
    materials.eye,
    7,
    0.008
  );
  eye.rotation.z = side * 0.08;

  claySphere(
    new THREE.Vector3(side * 0.245, 0.826, 0.994),
    new THREE.Vector3(0.035, 0.023, 0.013),
    materials.highlight,
    8,
    0.002
  );

  const lidPoints = [
    new THREE.Vector3(side * 0.41, 0.86, 1.0),
    new THREE.Vector3(side * 0.27, 0.91, 1.01),
    new THREE.Vector3(side * 0.13, 0.865, 1.0)
  ];
  tube(lidPoints, 0.034, materials.coatDark, 14, 7);
}

const nose = claySphere(
  new THREE.Vector3(0, 0.59, 1.035),
  new THREE.Vector3(0.13, 0.09, 0.055),
  materials.mouth,
  7,
  0.007
);
nose.rotation.x = 0.1;

const grinPoints = [];
for (let i = 0; i <= 24; i++) {
  const x = THREE.MathUtils.lerp(-0.33, 0.33, i / 24);
  const y = 0.39 - 0.12 * (1 - Math.pow(x / 0.33, 2));
  grinPoints.push(new THREE.Vector3(x, y, 1.015));
}
tube(grinPoints, 0.026, materials.mouth, 24, 7);

for (const side of [-1, 1]) {
  const cheekPoints = [
    new THREE.Vector3(side * 0.32, 0.41, 1.012),
    new THREE.Vector3(side * 0.37, 0.44, 1.006),
    new THREE.Vector3(side * 0.4, 0.48, 0.993)
  ];
  tube(cheekPoints, 0.019, materials.mouth, 10, 6);
}

fingerprint(new THREE.Vector3(-0.43, 0.66, 0), 0.11, materials.coatWarm, 0.948, sloth, 0.7);
fingerprint(new THREE.Vector3(0.46, 0.62, 0), 0.095, materials.mask, 0.949, sloth, 0.7);

for (let i = 0; i < 18; i++) {
  const angle = THREE.MathUtils.lerp(0.08, Math.PI - 0.08, i / 17);
  const x = Math.cos(angle) * 0.78;
  const y = 0.78 + Math.sin(angle) * 0.68;
  const z = 0.58 + Math.sin(angle) * 0.11;
  const direction = new THREE.Vector3(
    x * 1.06,
    y - 0.17 - random() * 0.16,
    z + 0.04
  );
  tube(
    [
      new THREE.Vector3(x, y, z),
      new THREE.Vector3(
        THREE.MathUtils.lerp(x, direction.x, 0.55) + (random() - 0.5) * 0.05,
        THREE.MathUtils.lerp(y, direction.y, 0.55),
        z + 0.015
      ),
      direction
    ],
    0.032 + random() * 0.012,
    coatPalette[i % coatPalette.length],
    9,
    5
  );
}

for (let i = 0; i < 9; i++) {
  const x = -0.56 + i * 0.14;
  const points = [
    new THREE.Vector3(x, 1.28 + random() * 0.1, 0.79),
    new THREE.Vector3(x + (random() - 0.5) * 0.08, 1.12, 0.87),
    new THREE.Vector3(x + (random() - 0.5) * 0.06, 1.01, 0.91)
  ];
  tube(points, 0.028 + random() * 0.012, coatPalette[(i + 1) % coatPalette.length], 9, 5);
}

const shadowPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.ShadowMaterial({ color: 0x5c4d42, opacity: 0.18 })
);
shadowPlane.rotation.x = -Math.PI / 2;
shadowPlane.position.y = -2.06;
shadowPlane.receiveShadow = true;
scene.add(shadowPlane);

const backdrop = new THREE.Mesh(
  new THREE.CircleGeometry(5.4, 64),
  new THREE.MeshBasicMaterial({ color: 0xe1d4c2, side: THREE.DoubleSide })
);
backdrop.position.set(0, 0.35, -3.2);
scene.add(backdrop);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  sloth.rotation.z = Math.sin(elapsed * 0.55) * 0.008;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
