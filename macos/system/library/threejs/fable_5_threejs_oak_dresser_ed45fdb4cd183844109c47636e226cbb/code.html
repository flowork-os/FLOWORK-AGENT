<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Oak Dresser</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#20242a}canvas{display:block}</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---- Scene / camera / renderer ------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x23272e);
scene.fog = new THREE.Fog(0x23272e, 400, 900);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 2000);
camera.position.set(160, 110, 190);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

// ---- Procedural oak texture ----------------------------------------------
function oakTexture(w, h, base, streak, rings) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < rings; i++) {
    const x = Math.random() * w;
    g.strokeStyle = streak;
    g.globalAlpha = 0.06 + Math.random() * 0.12;
    g.lineWidth = 1 + Math.random() * 3;
    g.beginPath();
    let y = 0; g.moveTo(x, 0);
    const wob = 4 + Math.random() * 10;
    while (y < h) { y += 12 + Math.random() * 20; g.lineTo(x + Math.sin(y * 0.05 + i) * wob, y); }
    g.stroke();
  }
  // faint cathedral arcs
  for (let i = 0; i < 6; i++) {
    g.strokeStyle = streak; g.globalAlpha = 0.05;
    g.lineWidth = 2;
    g.beginPath();
    g.ellipse(w * Math.random(), h * (0.3 + Math.random() * 0.4), 20 + Math.random() * 40, 60 + Math.random() * 120, 0, 0, Math.PI * 2);
    g.stroke();
  }
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

const texBody   = oakTexture(512, 512, '#9a6b3c', '#5e3d1f', 60);
const texDrawer = oakTexture(512, 512, '#a8763f', '#6b4522', 70);
const texTop    = oakTexture(512, 512, '#8f6236', '#553517', 80);

const matBody = new THREE.MeshStandardMaterial({ map: texBody, roughness: 0.62, metalness: 0.02 });
const matDrawer = new THREE.MeshStandardMaterial({ map: texDrawer, roughness: 0.55, metalness: 0.02 });
const matTop = new THREE.MeshStandardMaterial({ map: texTop, roughness: 0.45, metalness: 0.03 });
const matKnob = new THREE.MeshStandardMaterial({ color: 0x5a3a1c, roughness: 0.4, metalness: 0.05 });
const matGap = new THREE.MeshStandardMaterial({ color: 0x2a1a0c, roughness: 0.9 });

// ---- Dresser (dimensions in cm) ------------------------------------------
// Overall: 110 wide x 78 high x 48 deep — typical 6-drawer double dresser.
const W = 110, H = 78, D = 48;
const plinthH = 8, topT = 3, frameT = 2.5;
const gap = 0.5;                     // reveal between drawer fronts
const cols = 2, rows = 3;

const dresser = new THREE.Group();

// Plinth base (slightly recessed)
const plinth = new THREE.Mesh(new THREE.BoxGeometry(W - 6, plinthH, D - 6), matBody);
plinth.position.y = plinthH / 2;
dresser.add(plinth);

// Carcass (dark interior color shows through the drawer gaps)
const carcassH = H - plinthH - topT;
const carcass = new THREE.Mesh(new THREE.BoxGeometry(W, carcassH, D), matGap);
carcass.position.y = plinthH + carcassH / 2;
dresser.add(carcass);

// Side / back / face-frame panels in oak
function panel(w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matBody);
  m.position.set(x, y, z);
  dresser.add(m);
  return m;
}
const cy = plinth.position.y + plinthH / 2 + carcassH / 2;
panel(frameT, carcassH, D + 0.4, -(W - frameT) / 2, cy, 0);      // left side
panel(frameT, carcassH, D + 0.4,  (W - frameT) / 2, cy, 0);      // right side
panel(W, carcassH, frameT, 0, cy, -(D - frameT) / 2 - 0.2);      // back

// Top surface with slight overhang
const top = new THREE.Mesh(new THREE.BoxGeometry(W + 4, topT, D + 4), matTop);
top.position.y = plinthH + carcassH + topT / 2;
dresser.add(top);

// Drawers: 2 columns x 3 rows
const faceZ = D / 2;                          // front plane of carcass
const innerW = W - 2 * frameT;
const innerH = carcassH - 2 * frameT;
const drawerW = (innerW - (cols + 1) * gap) / cols;
const drawerH = (innerH - (rows + 1) * gap) / rows;
const frontT = 2;

const knobGeo = new THREE.SphereGeometry(1.6, 24, 16);
const knobNeck = new THREE.CylinderGeometry(0.7, 0.9, 1.2, 12);

for (let r = 0; r < rows; r++) {
  for (let c = 0; c < cols; c++) {
    const x = -innerW / 2 + gap + drawerW / 2 + c * (drawerW + gap);
    const y = plinthH + frameT + gap + drawerH / 2 + r * (drawerH + gap);

    const front = new THREE.Mesh(new THREE.BoxGeometry(drawerW, drawerH, frontT), matDrawer);
    front.position.set(x, y, faceZ + frontT / 2 - 0.5);
    dresser.add(front);

    // subtle bevel line: thin inset frame on each drawer front
    const inset = new THREE.Mesh(new THREE.BoxGeometry(drawerW - 4, drawerH - 4, 0.4), matDrawer.clone());
    inset.material.roughness = 0.5;
    inset.position.set(x, y, faceZ + frontT + 0.1 - 0.5);
    dresser.add(inset);

    // round wooden knob (sphere + neck), centered on each drawer
    const kz = faceZ + frontT - 0.5;
    const neck = new THREE.Mesh(knobNeck, matKnob);
    neck.rotation.x = Math.PI / 2;
    neck.position.set(x, y, kz + 0.6);
    const knob = new THREE.Mesh(knobGeo, matKnob);
    knob.scale.z = 0.75;
    knob.position.set(x, y, kz + 1.6);
    dresser.add(neck, knob);
  }
}

dresser.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
scene.add(dresser);

// ---- Ground + soft shadow -------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(400, 64),
  new THREE.MeshStandardMaterial({ color: 0x2b2f36, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const shadowCatcher = new THREE.Mesh(
  new THREE.CircleGeometry(120, 48),
  new THREE.ShadowMaterial({ opacity: 0.35 })
);
shadowCatcher.rotation.x = -Math.PI / 2;
shadowCatcher.position.y = 0.05;
shadowCatcher.receiveShadow = true;
scene.add(shadowCatcher);

// ---- Lighting ---------------------------------------------------------------
scene.add(new THREE.HemisphereLight(0xfff2e0, 0x30281f, 0.55));

const key = new THREE.DirectionalLight(0xffe6c4, 2.2);
key.position.set(120, 180, 140);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -120; key.shadow.camera.right = 120;
key.shadow.camera.top = 140; key.shadow.camera.bottom = -60;
key.shadow.camera.near = 50; key.shadow.camera.far = 500;
key.shadow.radius = 6; key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9db4ff, 0.5);
fill.position.set(-150, 80, -60);
scene.add(fill);

const rim = new THREE.PointLight(0xffd9a0, 60, 400, 1.8);
rim.position.set(-60, 100, 120);
scene.add(rim);

// ---- Controls / loop --------------------------------------------------------
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, H / 2, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 90;
controls.maxDistance = 500;
controls.maxPolarAngle = Math.PI / 2 - 0.02;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
