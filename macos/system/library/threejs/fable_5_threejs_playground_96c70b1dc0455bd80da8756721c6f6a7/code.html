<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #bfe3f5; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe3f5);
scene.fog = new THREE.Fog(0xbfe3f5, 30, 70);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(11, 8, 13);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 5;
controls.maxDistance = 40;

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xdcefff, 0x8a7a5a, 0.75));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(10, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
sun.shadow.camera.near = 2; sun.shadow.camera.far = 40;
sun.shadow.bias = -0.0004;
sun.shadow.radius = 4;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xcfe6ff, 0.5);
fill.position.set(-8, 6, -8);
scene.add(fill);

// ---------- Materials ----------
const mat = (color, rough = 0.6, metal = 0.05) =>
  new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
const RED = mat(0xe0342b, 0.5);
const BLUE = mat(0x1e63d0, 0.45);
const YELLOW = mat(0xf7c518, 0.5);
const GREEN = mat(0x2ba24a, 0.55);
const STEEL = mat(0x9aa4ad, 0.35, 0.6);
const WOOD = mat(0xb5854f, 0.85);
const MULCH = mat(0xa9743f, 1.0);
const CURB = mat(0xd8d3c8, 0.9);
const SEAT = mat(0x222831, 0.7);

// ---------- Root group (centered procedural object) ----------
const playground = new THREE.Group();
scene.add(playground);

const box = (w, h, d, m, x, y, z, ry = 0) => {
  const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  o.position.set(x, y, z); o.rotation.y = ry;
  o.castShadow = o.receiveShadow = true;
  return o;
};
const cyl = (rt, rb, h, m, x, y, z, seg = 20) => {
  const o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
  o.position.set(x, y, z);
  o.castShadow = o.receiveShadow = true;
  return o;
};

// ---------- Ground base: mulch pad + surrounding grass ----------
const grass = new THREE.Mesh(new THREE.CircleGeometry(30, 48), mat(0x74b653, 1.0));
grass.rotation.x = -Math.PI / 2;
grass.position.y = -0.02;
grass.receiveShadow = true;
scene.add(grass);

const PAD_W = 13, PAD_D = 9;
const mulch = new THREE.Mesh(new THREE.BoxGeometry(PAD_W, 0.12, PAD_D), MULCH);
mulch.position.y = 0.06;
mulch.receiveShadow = true;
playground.add(mulch);

// ---------- Perimeter curb ----------
const curbH = 0.28, curbT = 0.25;
[
  box(PAD_W + curbT * 2, curbH, curbT, CURB, 0, curbH / 2, PAD_D / 2 + curbT / 2),
  box(PAD_W + curbT * 2, curbH, curbT, CURB, 0, curbH / 2, -PAD_D / 2 - curbT / 2),
  box(curbT, curbH, PAD_D, CURB, PAD_W / 2 + curbT / 2, curbH / 2, 0),
  box(curbT, curbH, PAD_D, CURB, -PAD_W / 2 - curbT / 2, curbH / 2, 0),
].forEach(c => playground.add(c));

// ---------- Slide tower ----------
const tower = new THREE.Group();
tower.position.set(-3.2, 0, -1.2);
playground.add(tower);

const platH = 1.8, platS = 1.8;
// legs
[[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) =>
  tower.add(box(0.14, platH, 0.14, WOOD, sx * (platS / 2 - 0.1), platH / 2 + 0.12, sz * (platS / 2 - 0.1))));
// platform deck
tower.add(box(platS, 0.12, platS, YELLOW, 0, platH + 0.12, 0));
// railings (leave openings: +x for slide, -z for ladder)
tower.add(box(platS, 0.08, 0.08, RED, 0, platH + 0.75, platS / 2));
tower.add(box(0.08, 0.08, platS, RED, -platS / 2, platH + 0.75, 0));
tower.add(box(platS, 0.5, 0.05, BLUE, 0, platH + 0.45, platS / 2));
tower.add(box(0.05, 0.5, platS, BLUE, -platS / 2, platH + 0.45, 0));
// corner posts + pyramid roof
const roofBaseY = platH + 1.5;
[[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) =>
  tower.add(box(0.1, roofBaseY - platH - 0.1, 0.1, WOOD, sx * (platS / 2 - 0.08), (roofBaseY + platH) / 2 + 0.06, sz * (platS / 2 - 0.08))));
const roof = new THREE.Mesh(new THREE.ConeGeometry(platS * 0.85, 1.0, 4), RED);
roof.rotation.y = Math.PI / 4;
roof.position.y = roofBaseY + 0.5;
roof.castShadow = true;
tower.add(roof);
const finial = cyl(0.05, 0.05, 0.35, YELLOW, 0, roofBaseY + 1.1, 0);
tower.add(finial);

// ladder on -z side
const ladder = new THREE.Group();
ladder.position.set(0, 0, -platS / 2);
ladder.rotation.x = 0.32;
const ladH = platH + 0.35;
ladder.add(cyl(0.045, 0.045, ladH, STEEL, -0.35, ladH / 2, 0));
ladder.add(cyl(0.045, 0.045, ladH, STEEL, 0.35, ladH / 2, 0));
for (let i = 1; i <= 5; i++) {
  const rung = cyl(0.035, 0.035, 0.7, STEEL, 0, (ladH / 6) * i, 0);
  rung.rotation.z = Math.PI / 2;
  ladder.add(rung);
}
tower.add(ladder);

// curved slide (extruded U-channel along a swooping curve, exiting +x)
const slidePath = new THREE.CatmullRomCurve3([
  new THREE.Vector3(platS / 2 - 0.1, platH + 0.15, 0),
  new THREE.Vector3(platS / 2 + 1.1, platH * 0.72, 0.25),
  new THREE.Vector3(platS / 2 + 2.2, platH * 0.38, 1.1),
  new THREE.Vector3(platS / 2 + 2.9, 0.35, 2.3),
  new THREE.Vector3(platS / 2 + 3.1, 0.22, 3.1),
]);
const uShape = new THREE.Shape();
uShape.moveTo(-0.42, 0.3);
uShape.lineTo(-0.42, 0.05);
uShape.quadraticCurveTo(-0.42, -0.06, -0.3, -0.06);
uShape.lineTo(0.3, -0.06);
uShape.quadraticCurveTo(0.42, -0.06, 0.42, 0.05);
uShape.lineTo(0.42, 0.3);
uShape.lineTo(0.34, 0.3);
uShape.lineTo(0.34, 0.04);
uShape.quadraticCurveTo(0.34, 0.02, 0.31, 0.02);
uShape.lineTo(-0.31, 0.02);
uShape.quadraticCurveTo(-0.34, 0.02, -0.34, 0.04);
uShape.lineTo(-0.34, 0.3);
uShape.closePath();
const slideGeo = new THREE.ExtrudeGeometry(uShape, { steps: 60, extrudePath: slidePath, bevelEnabled: false });
const slide = new THREE.Mesh(slideGeo, GREEN);
slide.castShadow = slide.receiveShadow = true;
tower.add(slide);
// slide support post
tower.add(cyl(0.06, 0.06, 1.0, STEEL, platS / 2 + 2.2, 0.55, 1.1));

// ---------- Swing set ----------
const swings = new THREE.Group();
swings.position.set(3.4, 0, 1.4);
swings.rotation.y = -0.15;
playground.add(swings);

const frameH = 2.4, beamLen = 3.4, spread = 0.9;
// A-frame legs
[[-1], [1]].forEach(([side]) => {
  [[-1], [1]].forEach(([zdir]) => {
    const leg = cyl(0.07, 0.07, Math.hypot(frameH, spread) + 0.1, BLUE, 0, 0, 0);
    leg.position.set(side * beamLen / 2, frameH / 2 + 0.1, zdir * spread / 2);
    leg.rotation.x = zdir * Math.atan2(spread, frameH);
    swings.add(leg);
  });
});
// top beam
const beam = cyl(0.08, 0.08, beamLen + 0.5, RED, 0, frameH + 0.12, 0);
beam.rotation.z = Math.PI / 2;
swings.add(beam);

// two swings
[-0.85, 0.85].forEach((sx, i) => {
  const swing = new THREE.Group();
  swing.position.set(sx, frameH + 0.12, 0);
  swing.rotation.x = i === 0 ? 0.28 : -0.18;
  const chainL = 1.55;
  [-0.25, 0.25].forEach(cx => {
    const chain = cyl(0.02, 0.02, chainL, STEEL, cx, -chainL / 2, 0, 10);
    swing.add(chain);
  });
  const seat = box(0.62, 0.06, 0.24, SEAT, 0, -chainL, 0);
  swing.add(seat);
  swings.add(swing);
  swing.userData.phase = i * Math.PI;
  animatedSwings.push(swing);
});

// ---------- Decorative bollards ----------
[[-5.5, 3.5], [5.5, -3.5], [-5.5, -3.5], [5.5, 3.5]].forEach(([x, z], i) => {
  const b = cyl(0.09, 0.09, 0.55, [RED, BLUE, YELLOW, GREEN][i % 4], x, 0.39, z);
  playground.add(b);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), STEEL);
  cap.position.set(x, 0.68, z);
  cap.castShadow = true;
  playground.add(cap);
});

// ---------- Soft contact shadow disc ----------
const shadowTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128, 128, 20, 128, 128, 128);
  grd.addColorStop(0, 'rgba(0,0,0,0.28)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const softShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(19, 15),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
);
softShadow.rotation.x = -Math.PI / 2;
softShadow.position.y = 0.005;
scene.add(softShadow);

// ---------- Animation ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  animatedSwings.forEach(s => { s.rotation.x = Math.sin(t * 1.6 + s.userData.phase) * 0.3; });
  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
<script>
// declared before module usage via hoisted global
var animatedSwings = [];
</script>
</body>
</html>
