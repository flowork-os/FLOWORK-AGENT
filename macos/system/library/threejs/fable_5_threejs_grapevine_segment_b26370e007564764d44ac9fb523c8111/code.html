<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grapevine Segment</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#efe9dc}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// seeded random for stable natural irregularity
let seed = 7;
const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xefe9dc);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 50);
camera.position.set(2.2, 0.8, 3.0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.05, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 1.5;
controls.maxDistance = 8;

// lighting
scene.add(new THREE.HemisphereLight(0xfff6e8, 0x9a8f78, 0.75));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.0);
sun.position.set(3.5, 5, 2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -3;
sun.shadow.camera.right = sun.shadow.camera.top = 3;
sun.shadow.radius = 6;
sun.shadow.bias = -0.0005;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.5);
fill.position.set(-3, 1.5, -2);
scene.add(fill);

// soft ground shadow
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(3.5, 48),
  new THREE.ShadowMaterial({ opacity: 0.28 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.52;
ground.receiveShadow = true;
scene.add(ground);

const vine = new THREE.Group();
scene.add(vine);

// ---- twisting woody stem ----
const stemPts = [];
for (let i = 0; i <= 8; i++) {
  const u = i / 8;
  stemPts.push(new THREE.Vector3(
    Math.sin(u * 5.2 + 0.7) * 0.22 + (R() - 0.5) * 0.12,
    -1.35 + u * 2.75,
    Math.cos(u * 4.1) * 0.2 + (R() - 0.5) * 0.12
  ));
}
const curve = new THREE.CatmullRomCurve3(stemPts);
const stemGeo = new THREE.TubeGeometry(curve, 140, 1, 12);
{ // taper + woody irregularity (constructor radius 1 = unit offsets)
  const pos = stemGeo.attributes.position, c = new THREE.Vector3(), v = new THREE.Vector3();
  for (let row = 0; row <= 140; row++) {
    const t = row / 140;
    curve.getPointAt(t, c);
    const s = 0.095 * (1 - 0.55 * t) * (1 + 0.14 * Math.sin(t * 38) + 0.08 * Math.sin(t * 91 + 2));
    for (let j = 0; j <= 12; j++) {
      const i = row * 13 + j;
      v.fromBufferAttribute(pos, i).sub(c).multiplyScalar(s * (1 + 0.1 * Math.sin(j * 2.6 + row))).add(c);
      pos.setXYZ(i, v.x, v.y, v.z);
    }
  }
  stemGeo.computeVertexNormals();
}
const barkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a33, roughness: 0.95 });
const stem = new THREE.Mesh(stemGeo, barkMat);
stem.castShadow = true;
vine.add(stem);

// helper: oriented group at a point on the stem
function nodeGroup(t, angle) {
  const g = new THREE.Group();
  g.position.copy(curve.getPointAt(t));
  g.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), curve.getTangentAt(t));
  g.rotateY(angle);
  vine.add(g);
  return g;
}

// ---- peeling bark strips ----
const peelMatA = new THREE.MeshStandardMaterial({ color: 0x8a6a4c, roughness: 1, side: THREE.DoubleSide });
const peelMatB = new THREE.MeshStandardMaterial({ color: 0x503626, roughness: 1, side: THREE.DoubleSide });
for (let i = 0; i < 9; i++) {
  const t = 0.06 + R() * 0.85;
  const r = 0.1 * (1 - 0.55 * t);
  const len = 0.14 + R() * 0.2;
  const peel = new THREE.Mesh(
    new THREE.CylinderGeometry(r * 1.28, r * 1.12, len, 7, 1, true, 0, 0.7 + R() * 0.9),
    R() > 0.5 ? peelMatA : peelMatB
  );
  peel.castShadow = true;
  const g = nodeGroup(t, R() * Math.PI * 2);
  peel.rotation.z = 0.12 + R() * 0.22; // lifted, curling away
  peel.rotation.x = (R() - 0.5) * 0.25;
  g.add(peel);
}

// ---- broad lobed grape leaf geometry ----
function leafGeometry() {
  const shp = new THREE.Shape(), N = 90;
  for (let i = 0; i <= N; i++) {
    const a = -Math.PI / 2 + (i / N) * Math.PI * 2;
    const f = Math.sin((a + Math.PI / 2) / 2);
    let r = (0.25 + 0.75 * f) * (0.8 + 0.2 * Math.cos(5 * (a - Math.PI / 2)));
    r *= 1 + 0.025 * Math.sin(a * 24); // serrated margin
    i === 0 ? shp.moveTo(Math.cos(a) * r, Math.sin(a) * r) : shp.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  const g = new THREE.ShapeGeometry(shp, 14);
  g.translate(0, 0.16, 0); // petiole notch at origin
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { // gentle cupping / rumple
    const x = p.getX(i), y = p.getY(i);
    p.setZ(i, 0.13 * x * x + 0.05 * Math.sin(y * 3.5) * y - 0.06 * y * y);
  }
  g.computeVertexNormals();
  return g;
}
const leafGeo = leafGeometry();
const petioleMat = new THREE.MeshStandardMaterial({ color: 0x7a6a3a, roughness: 0.9 });

function addLeaf(t, angle, size, color) {
  const g = nodeGroup(t, angle);
  const pts = [new THREE.Vector3(0, 0, 0.05), new THREE.Vector3(0, 0.06 + R() * 0.05, 0.26), new THREE.Vector3(0, -0.02 + R() * 0.06, 0.48)];
  const pet = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 10, 0.013, 6), petioleMat);
  pet.castShadow = true;
  g.add(pet);
  const leaf = new THREE.Mesh(leafGeo, new THREE.MeshStandardMaterial({ color, roughness: 0.62, side: THREE.DoubleSide }));
  leaf.castShadow = true;
  leaf.position.copy(pts[2]);
  leaf.rotation.set(Math.PI / 2 - 0.5 - R() * 0.6, (R() - 0.5) * 0.5, (R() - 0.5) * 0.5);
  leaf.scale.setScalar(0.55);
  g.add(leaf);
  g.scale.setScalar(size);
}
// maturity shades: old dark leaves low, tender bright leaves high
[
  [0.16, 0.5, 1.25, 0x3f6323], [0.32, 2.7, 1.15, 0x4c7429], [0.48, 1.3, 1.05, 0x5c8a2f],
  [0.64, 4.5, 0.95, 0x76a03c], [0.79, 3.2, 0.8, 0x93b851], [0.93, 5.6, 0.62, 0xb3cc72]
].forEach(([t, a, s, c]) => addLeaf(t, a, s, c));

// ---- curling tendrils ----
const tendrilMat = new THREE.MeshStandardMaterial({ color: 0x8f9a4e, roughness: 0.85 });
function addTendril(t, angle, len, coils) {
  const pts = [];
  for (let i = 0; i <= 70; i++) {
    const u = i / 70, a = coils * Math.PI * 2 * Math.pow(u, 1.9);
    const cr = 0.085 * Math.min(1, Math.max(0, (u - 0.3) * 2.2));
    pts.push(new THREE.Vector3(
      Math.cos(a) * cr + Math.sin(u * 4) * 0.03,
      0.12 * Math.sin(u * 2.2) + Math.sin(a) * cr,
      0.05 + u * len
    ));
  }
  const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 90, 0.008, 5), tendrilMat);
  m.castShadow = true;
  const g = nodeGroup(t, angle);
  g.rotateX(-0.5 - R() * 0.4);
  g.add(m);
}
addTendril(0.42, 5.4, 0.5, 2.6);
addTendril(0.7, 0.9, 0.42, 3.2);
addTendril(0.96, 2.3, 0.36, 2.2);

// ---- hanging grape cluster ----
{
  const g = nodeGroup(0.3, 3.7);
  const stalkPts = [new THREE.Vector3(0, 0, 0.04), new THREE.Vector3(0, -0.09, 0.13), new THREE.Vector3(0, -0.2, 0.16)];
  const stalk = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(stalkPts), 8, 0.016, 6), petioleMat);
  stalk.castShadow = true;
  g.add(stalk);
  const n = 30;
  const grapes = new THREE.InstancedMesh(
    new THREE.SphereGeometry(0.046, 18, 14),
    new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.35, clearcoat: 0.6, clearcoatRoughness: 0.4 }),
    n
  );
  grapes.castShadow = true;
  const dummy = new THREE.Object3D(), col = new THREE.Color();
  for (let k = 0; k < n; k++) {
    const u = k / (n - 1);
    const rad = 0.105 * (1 - 0.8 * u) * (0.55 + 0.45 * Math.min(1, u * 5)) + R() * 0.014;
    const a = k * 2.399 + R() * 0.5;
    dummy.position.set(
      stalkPts[2].x + Math.cos(a) * rad,
      stalkPts[2].y - 0.03 - u * 0.34 + (R() - 0.5) * 0.02,
      stalkPts[2].z + Math.sin(a) * rad
    );
    dummy.scale.setScalar(0.8 + R() * 0.35);
    dummy.updateMatrix();
    grapes.setMatrixAt(k, dummy.matrix);
    grapes.setColorAt(k, col.setHSL(0.76 + R() * 0.05, 0.42 + R() * 0.15, 0.26 + R() * 0.1));
  }
  g.add(grapes);
}

// center the object nicely
vine.position.y = 0.05;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
