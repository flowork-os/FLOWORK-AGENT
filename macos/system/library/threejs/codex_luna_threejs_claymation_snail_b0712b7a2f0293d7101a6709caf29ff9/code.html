<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claymation Snail</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4d9b9;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4d9b9);
scene.fog = new THREE.Fog(0xf4d9b9, 8, 15);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.1, 3.0, 7.4);
camera.lookAt(0.25, 1.05, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 4.8;
controls.maxDistance = 10;
controls.target.set(0.25, 1.05, 0);

scene.add(new THREE.HemisphereLight(0xfff0d2, 0x9a6b54, 2.0));

const keyLight = new THREE.DirectionalLight(0xffe3bc, 3.4);
keyLight.position.set(-4, 7, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -3;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xffb8a0, 1.2, 8);
fillLight.position.set(4, 2.5, 4);
scene.add(fillLight);

function clayMaterial(color, roughness = 0.9) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness: 0,
    flatShading: false
  });
}

function blobGeometry(radius, width, height, depth, segments = 32, rings = 18, seed = 1) {
  const geometry = new THREE.SphereGeometry(radius, segments, rings);
  const position = geometry.attributes.position;
  for (let i = 0; i < position.count; i++) {
    const x = position.getX(i);
    const y = position.getY(i);
    const z = position.getZ(i);
    const len = Math.sqrt(x * x + y * y + z * z) || 1;
    const n = 1 + 0.025 * Math.sin(i * 2.17 + seed) + 0.012 * Math.sin(i * 6.31 + seed * 2.3);
    position.setXYZ(
      i,
      x / len * radius * width * n,
      y / len * radius * height * n,
      z / len * radius * depth * n
    );
  }
  position.needsUpdate = true;
  geometry.computeVertexNormals();
  return geometry;
}

function meshFrom(geometry, material, position, scale = [1, 1, 1], rotation = [0, 0, 0]) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(position[0], position[1], position[2]);
  mesh.scale.set(scale[0], scale[1], scale[2]);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const bodyMat = clayMaterial(0xd98963);
const headMat = clayMaterial(0xe39a70);
const shellMat = clayMaterial(0xd97955);
const spiralMat = clayMaterial(0xb85d4c);
const eyeMat = clayMaterial(0x483432, 0.72);
const pupilMat = clayMaterial(0x19191a, 0.55);
const blushMat = clayMaterial(0xe98e79);
const groundMat = clayMaterial(0xe9bd91);

const snail = new THREE.Group();
snail.position.y = 0.05;
scene.add(snail);

const foot = meshFrom(blobGeometry(1, 1.72, 0.36, 0.48, 42, 18, 4), bodyMat, [0, 0.42, 0], [1, 1, 1]);
snail.add(foot);

const tail = meshFrom(blobGeometry(0.56, 1.45, 0.65, 0.55, 28, 16, 6), bodyMat, [-1.25, 0.67, -0.02], [1, 1, 1], [0, 0.12, -0.1]);
snail.add(tail);

const neck = meshFrom(blobGeometry(0.78, 0.88, 1.0, 0.72, 32, 18, 8), headMat, [1.16, 1.0, 0.02], [1, 1, 1], [0, 0, -0.12]);
snail.add(neck);

const head = meshFrom(blobGeometry(0.72, 1.12, 0.92, 0.8, 34, 18, 9), headMat, [1.65, 1.36, 0.12], [1, 1, 1]);
snail.add(head);

const shell = meshFrom(blobGeometry(1.38, 1.0, 1.05, 0.56, 48, 26, 12), shellMat, [-0.2, 1.52, -0.12], [1, 1, 1], [0.02, -0.04, 0.02]);
snail.add(shell);

const spiralPoints = [];
const turns = Math.PI * 4.35;
const steps = 46;
for (let i = 0; i < steps; i++) {
  const t = i / (steps - 1);
  const angle = t * turns;
  const radius = 1.02 * (1 - 0.78 * t) + 0.035;
  const x = -0.2 + Math.cos(angle) * radius;
  const y = 1.52 + Math.sin(angle) * radius * 1.02;
  const z = 0.62 + 0.11 * t;
  spiralPoints.push(new THREE.Vector3(x, y, z));
}
const spiralCurve = new THREE.CatmullRomCurve3(spiralPoints);
const spiral = new THREE.Mesh(
  new THREE.TubeGeometry(spiralCurve, 80, 0.115, 10, false),
  spiralMat
);
spiral.castShadow = true;
spiral.receiveShadow = true;
snail.add(spiral);

const spiralCenter = meshFrom(
  new THREE.IcosahedronGeometry(0.18, 2),
  spiralMat,
  spiralPoints[spiralPoints.length - 1].toArray(),
  [1.05, 1.05, 0.8]
);
snail.add(spiralCenter);

function addDimple(x, y, z, scale, rotationZ = 0) {
  const dimple = meshFrom(
    new THREE.SphereGeometry(0.09, 12, 8),
    spiralMat,
    [x, y, z],
    [scale, scale * 0.72, 0.3],
    [0, 0, rotationZ]
  );
  snail.add(dimple);
}

addDimple(-0.92, 2.08, 0.50, 0.8, 0.2);
addDimple(-0.63, 0.72, 0.51, 0.7, -0.4);
addDimple(0.42, 1.98, 0.54, 0.62, 0.8);
addDimple(0.42, 1.12, 0.55, 0.72, -0.2);
addDimple(-0.34, 2.47, 0.48, 0.55, 0.1);

const cheekL = meshFrom(new THREE.SphereGeometry(0.16, 18, 12), blushMat, [1.34, 1.17, 0.69], [1.25, 0.72, 0.28]);
const cheekR = meshFrom(new THREE.SphereGeometry(0.14, 18, 12), blushMat, [1.94, 1.19, 0.66], [1.2, 0.7, 0.25]);
snail.add(cheekL, cheekR);

function makeStalk(points) {
  const curve = new THREE.CatmullRomCurve3(points);
  const stalk = new THREE.Mesh(new THREE.TubeGeometry(curve, 30, 0.09, 10, false), headMat);
  stalk.castShadow = true;
  stalk.receiveShadow = true;
  return stalk;
}

const leftStalkPoints = [
  new THREE.Vector3(1.38, 1.78, 0.12),
  new THREE.Vector3(1.22, 2.23, 0.15),
  new THREE.Vector3(1.34, 2.55, 0.18),
  new THREE.Vector3(1.56, 2.61, 0.19),
  new THREE.Vector3(1.66, 2.48, 0.2)
];
const rightStalkPoints = [
  new THREE.Vector3(1.82, 1.79, 0.2),
  new THREE.Vector3(2.02, 2.2, 0.23),
  new THREE.Vector3(2.17, 2.48, 0.25),
  new THREE.Vector3(2.38, 2.52, 0.25),
  new THREE.Vector3(2.46, 2.37, 0.25)
];
snail.add(makeStalk(leftStalkPoints), makeStalk(rightStalkPoints));

function addEye(point) {
  const eye = meshFrom(new THREE.SphereGeometry(0.17, 20, 14), eyeMat, point, [1, 1, 0.85]);
  const pupil = meshFrom(new THREE.SphereGeometry(0.078, 16, 10), pupilMat, [point[0] + 0.075, point[1] + 0.015, point[2] + 0.13], [0.9, 1.05, 0.6]);
  const glint = meshFrom(new THREE.SphereGeometry(0.022, 10, 8), new THREE.MeshBasicMaterial({ color: 0xfff5dc }), [point[0] + 0.095, point[1] + 0.06, point[2] + 0.185], [1, 1, 0.55]);
  snail.add(eye, pupil, glint);
}

addEye([1.66, 2.48, 0.2]);
addEye([2.46, 2.37, 0.25]);

const smileCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(1.72, 1.12, 0.71),
  new THREE.Vector3(1.84, 1.05, 0.76),
  new THREE.Vector3(1.98, 1.09, 0.73)
]);
const smile = new THREE.Mesh(new THREE.TubeGeometry(smileCurve, 20, 0.026, 8, false), eyeMat);
smile.castShadow = true;
snail.add(smile);

const ground = new THREE.Mesh(new THREE.CircleGeometry(20, 64), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.03;
ground.receiveShadow = true;
scene.add(ground);

const puddle = new THREE.Mesh(
  new THREE.CircleGeometry(2.8, 64),
  new THREE.MeshStandardMaterial({ color: 0xf0cba3, roughness: 1 })
);
puddle.rotation.x = -Math.PI / 2;
puddle.position.set(0.25, 0.045, 0);
puddle.scale.set(1.55, 0.64, 1);
puddle.receiveShadow = true;
scene.add(puddle);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
