<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glowing Jellyfish Lantern</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #020914;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020914);
scene.fog = new THREE.FogExp2(0x020914, 0.055);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(6.5, 2.8, 7.2);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 4.5;
controls.maxDistance = 12;
controls.target.set(0, 0.05, 0);

scene.add(new THREE.HemisphereLight(0x73dfff, 0x02040c, 0.34));

const keyLight = new THREE.PointLight(0x31eaff, 3.2, 8, 2);
keyLight.position.set(0, 0.9, 1.1);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
scene.add(keyLight);

const violetLight = new THREE.PointLight(0x6d39ff, 1.2, 7, 2);
violetLight.position.set(0, -2.2, 0.8);
scene.add(violetLight);

const lantern = new THREE.Group();
lantern.rotation.y = 0.18;
scene.add(lantern);

const haloMaterial = new THREE.MeshBasicMaterial({
  color: 0x25e6e1,
  transparent: true,
  opacity: 0.075,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  side: THREE.DoubleSide
});
const halo = new THREE.Mesh(new THREE.SphereGeometry(3.25, 48, 32), haloMaterial);
halo.scale.set(1, 0.78, 1);
halo.position.y = 0.72;
lantern.add(halo);

const capProfile = [
  new THREE.Vector2(0.02, 2.18),
  new THREE.Vector2(0.38, 2.16),
  new THREE.Vector2(0.78, 2.06),
  new THREE.Vector2(1.22, 1.87),
  new THREE.Vector2(1.67, 1.58),
  new THREE.Vector2(2.05, 1.22),
  new THREE.Vector2(2.36, 0.83),
  new THREE.Vector2(2.58, 0.48),
  new THREE.Vector2(2.65, 0.25),
  new THREE.Vector2(2.58, 0.13),
  new THREE.Vector2(2.16, 0.10),
  new THREE.Vector2(1.45, 0.105),
  new THREE.Vector2(0.72, 0.11),
  new THREE.Vector2(0.02, 0.11)
];

const capGeometry = new THREE.LatheGeometry(capProfile, 96);
capGeometry.computeVertexNormals();

const capMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x3ce9e4,
  emissive: 0x18dcd6,
  emissiveIntensity: 1.15,
  roughness: 0.2,
  metalness: 0.05,
  transmission: 0.24,
  thickness: 0.65,
  transparent: true,
  opacity: 0.72,
  side: THREE.DoubleSide
});
const cap = new THREE.Mesh(capGeometry, capMaterial);
cap.position.y = 0.1;
cap.castShadow = true;
cap.receiveShadow = true;
lantern.add(cap);

const rimGeometry = new THREE.TorusGeometry(2.57, 0.075, 12, 96);
const rimMaterial = new THREE.MeshBasicMaterial({
  color: 0x8cffff,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending
});
const rim = new THREE.Mesh(rimGeometry, rimMaterial);
rim.rotation.x = Math.PI / 2;
rim.position.y = 0.36;
lantern.add(rim);

function domeRadiusAtY(y) {
  const normalized = THREE.MathUtils.clamp((2.18 - y) / 1.93, 0, 1);
  return 2.65 * Math.pow(normalized, 0.56);
}

function addTube(points, radius, color, intensity) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geometry = new THREE.TubeGeometry(curve, 28, radius, 8, false);
  const material = new THREE.MeshBasicMaterial({
    color,
    transparent: true,
    opacity: 0.92,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.userData.intensity = intensity;
  lantern.add(mesh);
  return mesh;
}

const veinColors = [0x8dffff, 0x54f8ee, 0x36dfe0, 0x4bc8f4];

for (let branch = 0; branch < 10; branch++) {
  const angle = branch * Math.PI * 2 / 10 + 0.12;
  const endY = 0.55 + (branch % 3) * 0.12;
  const endRadius = domeRadiusAtY(endY) * (0.86 + (branch % 2) * 0.06);
  const directionX = Math.cos(angle);
  const directionZ = Math.sin(angle);
  const points = [];
  for (let step = 0; step <= 6; step++) {
    const t = step / 6;
    const y = 2.03 + (endY - 2.03) * t;
    const radius = endRadius * Math.pow(t, 0.83) + 0.04 * Math.sin(t * Math.PI);
    const wobble = Math.sin(t * 9 + branch) * 0.045 * t;
    points.push(new THREE.Vector3(
      directionX * (radius + wobble),
      y,
      directionZ * (radius + wobble)
    ));
  }
  addTube(points, 0.027 + (branch % 3) * 0.006, veinColors[branch % veinColors.length], 1);
  
  if (branch % 2 === 0) {
    const splitT = 0.42 + (branch % 3) * 0.07;
    const splitY = 2.03 + (endY - 2.03) * splitT;
    const splitRadius = endRadius * Math.pow(splitT, 0.83);
    const splitAngle = angle + (branch % 4 < 2 ? 0.34 : -0.34);
    const splitPoints = [
      new THREE.Vector3(directionX * splitRadius, splitY, directionZ * splitRadius),
      new THREE.Vector3(
        Math.cos(splitAngle) * (splitRadius + 0.34),
        splitY - 0.18,
        Math.sin(splitAngle) * (splitRadius + 0.34)
      ),
      new THREE.Vector3(
        Math.cos(splitAngle) * (splitRadius + 0.82),
        splitY - 0.38,
        Math.sin(splitAngle) * (splitRadius + 0.82)
      )
    ];
    addTube(splitPoints, 0.018, 0x7afff8, 1);
  }
}

function createTaperedTube(points, radii, radialSegments) {
  const positions = [];
  const indices = [];
  const ringCount = points.length;
  
  for (let i = 0; i < ringCount; i++) {
    const previous = points[Math.max(0, i - 1)];
    const next = points[Math.min(ringCount - 1, i + 1)];
    const tangent = next.clone().sub(previous).normalize();
    let reference = new THREE.Vector3(0, 1, 0);
    let normalA = tangent.clone().cross(reference);
    if (normalA.lengthSq() < 0.0001) {
      reference.set(1, 0, 0);
      normalA = tangent.clone().cross(reference);
    }
    normalA.normalize();
    const normalB = tangent.clone().cross(normalA).normalize();
    
    for (let j = 0; j < radialSegments; j++) {
      const theta = j / radialSegments * Math.PI * 2;
      const offset = normalA.clone().multiplyScalar(Math.cos(theta) * radii[i])
        .add(normalB.clone().multiplyScalar(Math.sin(theta) * radii[i]));
      const vertex = points[i].clone().add(offset);
      positions.push(vertex.x, vertex.y, vertex.z);
    }
  }
  
  for (let i = 0; i < ringCount - 1; i++) {
    for (let j = 0; j < radialSegments; j++) {
      const a = i * radialSegments + j;
      const b = i * radialSegments + (j + 1) % radialSegments;
      const c = (i + 1) * radialSegments + (j + 1) % radialSegments;
      const d = (i + 1) * radialSegments + j;
      indices.push(a, b, d, b, c, d);
    }
  }
  
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const tentacleCount = 12;
for (let i = 0; i < tentacleCount; i++) {
  const angle = i * Math.PI * 2 / tentacleCount + 0.16;
  const ring = i % 3;
  const startRadius = 0.22 + ring * 0.075;
  const startY = 0.04 - (i % 2) * 0.035;
  const length = 2.35 + (i % 4) * 0.28;
  const points = [];
  
  for (let p = 0; p < 9; p++) {
    const t = p / 8;
    const sway = Math.sin(t * 4.6 + i * 1.7) * (0.09 + t * 0.16);
    const drift = Math.cos(t * 3.3 + i) * t * 0.16;
    const radial = startRadius + sway;
    points.push(new THREE.Vector3(
      Math.cos(angle) * radial + Math.cos(angle + Math.PI / 2) * drift,
      startY - t * length,
      Math.sin(angle) * radial + Math.sin(angle + Math.PI / 2) * drift
    ));
  }
  
  const radii = points.map((point, index) => {
    const t = index / (points.length - 1);
    return 0.11 * Math.pow(1 - t, 0.72) + 0.012;
  });
  
  const geometry = createTaperedTube(points, radii, 9);
  const color = new THREE.Color().setHSL(0.52 - (i % 5) * 0.018 - 0.24 * (i / tentacleCount), 0.94, 0.54);
  const material = new THREE.MeshStandardMaterial({
    color,
    emissive: color.clone().multiplyScalar(0.72),
    emissiveIntensity: 2.35 - (i % 3) * 0.12,
    roughness: 0.24,
    metalness: 0.08,
    transparent: true,
    opacity: 0.94
  });
  const tentacle = new THREE.Mesh(geometry, material);
  tentacle.castShadow = true;
  lantern.add(tentacle);
  
  const baseGlow = new THREE.Mesh(
    new THREE.SphereGeometry(0.13, 16, 12),
    new THREE.MeshBasicMaterial({
      color: 0xa6ffff,
      transparent: true,
      opacity: 0.8,
      blending: THREE.AdditiveBlending
    })
  );
  baseGlow.position.copy(points[0]);
  lantern.add(baseGlow);
}

const loopMaterial = new THREE.MeshStandardMaterial({
  color: 0x07101a,
  roughness: 0.8,
  metalness: 0.55
});
const loopCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 2.17, 0),
  new THREE.Vector3(0, 2.62, 0),
  new THREE.Vector3(0.02, 2.96, 0),
  new THREE.Vector3(0.34, 3.16, 0),
  new THREE.Vector3(0.62, 3.06, 0),
  new THREE.Vector3(0.68, 2.76, 0),
  new THREE.Vector3(0.54, 2.58, 0)
]);
const loop = new THREE.Mesh(new THREE.TubeGeometry(loopCurve, 40, 0.045, 10, false), loopMaterial);
loop.castShadow = true;
lantern.add(loop);

const capPointLight = new THREE.PointLight(0x35fff1, 1.7, 5, 2);
capPointLight.position.set(0, 1.2, 0);
lantern.add(capPointLight);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  halo.scale.set(1 + Math.sin(elapsed * 1.4) * 0.025, 0.78 + Math.sin(elapsed * 1.4) * 0.018, 1 + Math.sin(elapsed * 1.4) * 0.025);
  capPointLight.intensity = 1.65 + Math.sin(elapsed * 2.1) * 0.18;
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
