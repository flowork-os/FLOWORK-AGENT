<!DOCTYPE html>

<head>

<title>European Plaza Fountain</title>

  canvas{display:block}
  #label{position:fixed;left:18px;bottom:15px;color:#fff6df;font:12px/1.4 Georgia,serif;letter-spacing:.12em;text-shadow:0 2px 5px #5c321b;pointer-events:none;opacity:.85}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">PIAZZA DEL SOLE</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9bd78);
scene.fog = new THREE.FogExp2(0xe9bd78, 0.017);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 180);
camera.position.set(15, 10, 19);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;
controls.minDistance = 9;
controls.maxDistance = 34;
controls.maxPolarAngle = Math.PI * 0.48;

const rng = (() => {
  let state = 0x8b3a3d19;
  return () => {
    state = (state * 1664525 + 1013904223) >>> 0;
    return state / 4294967296;
  };
})();
const rand = (a=0, b=1) => a + (b-a) * rng();
const pick = a => a[Math.floor(rng() * a.length)];

const group = new THREE.Group();
scene.add(group);

const mats = {
  stone: new THREE.MeshStandardMaterial({color:0xd5b987,roughness:.83}),
  stoneDark: new THREE.MeshStandardMaterial({color:0x9b7955,roughness:.9}),
  stoneLight: new THREE.MeshStandardMaterial({color:0xe7d0a1,roughness:.8}),
  water: new THREE.MeshPhysicalMaterial({
    color:0x70c9dc, roughness:.08, metalness:0,
    transmission:.18, transparent:true, opacity:.78,
    clearcoat:.55, clearcoatRoughness:.08, side:THREE.DoubleSide
  }),
  waterWhite: new THREE.MeshStandardMaterial({
    color:0xd9f6ee, emissive:0x8fd7d1, emissiveIntensity:.38,
    roughness:.18, transparent:true, opacity:.76, side:THREE.DoubleSide
  }),
  iron: new THREE.MeshStandardMaterial({color:0x283537,roughness:.48,metalness:.75}),
  wood: new THREE.MeshStandardMaterial({color:0x71452d,roughness:.72}),
  darkWood: new THREE.MeshStandardMaterial({color:0x3e281f,roughness:.76}),
  terracotta: new THREE.MeshStandardMaterial({color:0xb95431,roughness:.8}),
  leaf: new THREE.MeshStandardMaterial({color:0x426638,roughness:.77}),
  leafLight: new THREE.MeshStandardMaterial({color:0x5f843c,roughness:.74}),
  orange: new THREE.MeshStandardMaterial({color:0xf18a19,roughness:.48}),
  cream: new THREE.MeshStandardMaterial({color:0xf0d6a0,roughness:.86}),
  red: new THREE.MeshStandardMaterial({color:0x9f302a,roughness:.76}),
  blue: new THREE.MeshStandardMaterial({color:0x315d7d,roughness:.72}),
  yellow: new THREE.MeshStandardMaterial({color:0xdfa33c,roughness:.7}),
  glass: new THREE.MeshPhysicalMaterial({color:0x9ed7da,roughness:.1,transparent:true,opacity:.45,side:THREE.DoubleSide})
};

function canvasTexture(draw, w=512, h=512) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const x = c.getContext("2d");
  draw(x,w,h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

const cobbleTex = canvasTexture((x,w,h) => {
  x.fillStyle="#b79870"; x.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=38){
    for(let xx=(Math.floor(y/38)%2)*22-8;xx<w;xx+=55){
      const q=rand(-3,3), r=rand(-2,2);
      x.beginPath();
      x.roundRect(xx+3+q,y+4+r,48+rand(-5,3),29+rand(-3,4),7);
      x.fillStyle=pick(["#c9ae86","#ad8c65","#d2b78e","#9c7a5b","#bea077"]);
      x.fill();
      x.strokeStyle="rgba(85,58,40,.34)";
      x.lineWidth=2; x.stroke();
      x.fillStyle="rgba(255,245,205,.12)";
      x.fillRect(xx+9,y+9,26,2);
    }
  }
}, 768, 768);
cobbleTex.repeat.set(5.2,5.2);
const groundMat = new THREE.MeshStandardMaterial({map:cobbleTex,roughness:.88});

const stuccoTex = canvasTexture((x,w,h) => {
  x.fillStyle="#d9b977"; x.fillRect(0,0,w,h);
  for(let i=0;i<4400;i++){
    const v=Math.floor(rand(0,34));
    x.fillStyle=`rgba(${105+v},${74+v},${38+v},${rand(.025,.09)})`;
    x.fillRect(rand(0,w),rand(0,h),rand(1,3),rand(1,3));
  }
  for(let i=0;i<22;i++){
    x.strokeStyle="rgba(96,61,31,.16)";
    x.lineWidth=rand(.5,1.6);
    x.beginPath(); x.moveTo(rand(0,w),rand(0,h)); x.lineTo(rand(0,w),rand(0,h)); x.stroke();
  }
});

function box(w,h,d,mat,pos, parent=group) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.copy(pos); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
function cyl(rt,rb,h,mat,pos,parent=group,segments=24) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,segments),mat);
  m.position.copy(pos); m.castShadow=m.receiveShadow=true; parent.add(m); return m;
}
function sphere(r,mat,pos,parent=group) {
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,12),mat);
  m.position.copy(pos);m.castShadow=m.receiveShadow=true;parent.add(m);return m;
}
function torus(major,tube,mat,pos,parent=group) {
  const m=new THREE.Mesh(new THREE.TorusGeometry(major,tube,12,32),mat);
  m.rotation.x=Math.PI/2;m.position.copy(pos);m.castShadow=m.receiveShadow=true;parent.add(m);return m;
}

const ground = new THREE.Mesh(new THREE.PlaneGeometry(48,42), groundMat);
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; group.add(ground);

const plazaInset = new THREE.Mesh(
  new THREE.CircleGeometry(6.5,64),
  new THREE.MeshStandardMaterial({color:0xd5b98e,roughness:.9})
);
plazaInset.rotation.x=-Math.PI/2; plazaInset.position.y=.012; plazaInset.receiveShadow=true; group.add(plazaInset);
for(let r=2.3;r<6.4;r+=1.28) torus(r,.035,mats.stoneDark,new THREE.Vector3(0,.026,0));

function facade(x,z,w,h,color,roof=true) {
  const f = new THREE.Group(); f.position.set(x,0,z); group.add(f);
  const wallMat = new THREE.MeshStandardMaterial({map:stuccoTex,color,roughness:.9});
  box(w,h,.58,wallMat,new THREE.Vector3(0,h/2,0),f);
  box(w+.28,.32,.9,mats.stoneLight,new THREE.Vector3(0,.18,.08),f);
  box(w+.4,.24,.88,mats.stoneLight,new THREE.Vector3(0,h-.04,.08),f);
  if(roof){
    const roofMat=new THREE.MeshStandardMaterial({color:0x9a4930,roughness:.84});
    const r=new THREE.Mesh(new THREE.ConeGeometry(w*.75,.95,4),roofMat);
    r.rotation.y=Math.PI/4;r.position.set(0,h+.42,.03);r.scale.z=.62;r.castShadow=true;f.add(r);
  }
  return f;
}
function windowWithShutters(parent,x,y,z,shutterColor,wide=1) {
  box(.74*wide,.94,.05,mats.glass,new THREE.Vector3(x,y,z),parent);
  box(.82*wide,.11,.13,mats.stoneLight,new THREE.Vector3(x,y+.54,z+.02),parent);
  box(.82*wide,.11,.13,mats.stoneLight,new THREE.Vector3(x,y-.54,z+.02),parent);
  box(.10,.98,.12,new THREE.MeshStandardMaterial({color:shutterColor,roughness:.74}),new THREE.Vector3(x-.49*wide,y,z+.04),parent);
  box(.10,.98,.12,new THREE.MeshStandardMaterial({color:shutterColor,roughness:.74}),new THREE.Vector3(x+.49*wide,y,z+.04),parent);
}
function balcony(parent,x,y,z,w) {
  box(w,.11,.74,mats.stoneLight,new THREE.Vector3(x,y,z),parent);
  for(let i=-w/2+.13;i<w/2;i+=.17){
    cyl(.017,.017,.45,mats.iron,new THREE.Vector3(x+i,y+.25,z+.25),parent,8);
  }
  box(w,.04,.04,mats.iron,new THREE.Vector3(x,y+.47,z+.25),parent);
  box(.06,.55,.06,mats.iron,new THREE.Vector3(x-w/2+.04,y+.23,z+.25),parent);
  box(.06,.55,.06,mats.iron,new THREE.Vector3(x+w/2-.04,y+.23,z+.25),parent);
  for(let i=-w/2+.23;i<w/2;i+=.42){
    const p=cyl(.12,.16,.17,mats.terracotta,new THREE.Vector3(x+i,y+.56,z+.13),parent,14);
    sphere(.15,mats.leafLight,new THREE.Vector3(x+i,y+.7,z+.13),parent);
  }
}

const back=facade(0,-11.5,22,7.1,0xefcf8b);
for(let x=-8.6;x<=8.6;x+=2.15){
  windowWithShutters(back,x,4.5,.33,pick([0x41617b,0x6c8551,0x934031]));
  balcony(back,x,3.8,.47,1.45);
  windowWithShutters(back,x,2.15,.33,pick([0x41617b,0x6c8551,0x934031]));
}
box(2.1,2.55,.13,mats.darkWood,new THREE.Vector3(0,1.45,.36),back);
box(2.45,.23,.36,mats.stoneLight,new THREE.Vector3(0,2.78,.42),back);

const left=facade(-11,-2.3,9.5,6.2,0xd69762);
left.rotation.y=Math.PI/2;
for(let z=-5.2;z<=2.4;z+=2.1){
  windowWithShutters(left,z,4,-.33,0x496a76);
  balcony(left,z,3.32,-.47,1.4);
  windowWithShutters(left,z,1.85,-.33,0x496a76);
}
const right=facade(11,-1.4,10.7,6.55,0xdcc17e);
right.rotation.y=-Math.PI/2;
for(let z=-5.2;z<=3.3;z+=2.15){
  windowWithShutters(right,z,4.17,-.33,0x7d4731);
  balcony(right,z,3.48,-.47,1.42);
  windowWithShutters(right,z,1.92,-.33,0x7d4731);
}

function arcade(x,z,rotation,count) {
  const a=new THREE.Group();a.position.set(x,0,z);a.rotation.y=rotation;group.add(a);
  box(count*1.85+.25,.32,.7,mats.stoneLight,new THREE.Vector3(0,3.35,0),a);
  for(let i=0;i<count;i++){
    const px=(i-(count-1)/2)*1.85;
    cyl(.20,.24,3.2,mats.cream,new THREE.Vector3(px,1.63,0),a,16);
    torus(.47,.09,mats.cream,new THREE.Vector3(px,3.02,.02),a);
    const arch=new THREE.Mesh(new THREE.TorusGeometry(.52,.115,10,18,Math.PI),mats.cream);
    arch.position.set(px,3.04,.02);arch.rotation.y=Math.PI/2;arch.rotation.z=Math.PI;arch.castShadow=true;a.add(arch);
  }
}
arcade(-7.1,-8.85,0,5);
arcade(7.4,-8.85,0,4);

const tower = new THREE.Group();
tower.position.set(7.75,0,-10.55); group.add(tower);
box(2.45,9.3,2.35,new THREE.MeshStandardMaterial({color:0xd6ad62,roughness:.88}),new THREE.Vector3(0,4.65,0),tower);
box(2.72,.26,2.65,mats.stoneLight,new THREE.Vector3(0,7.2,0),tower);
box(2.72,.26,2.65,mats.stoneLight,new THREE.Vector3(0,9.2,0),tower);
const roof = new THREE.Mesh(new THREE.ConeGeometry(1.83,2.3,4),new THREE.MeshStandardMaterial({color:0x744431,roughness:.8}));
roof.position.y=10.42;roof.rotation.y=Math.PI/4;roof.castShadow=true;tower.add(roof);
for(const sx of [-1,1]) for(const sz of [-1,1]) {
  box(.15,1.1,.15,mats.stoneDark,new THREE.Vector3(sx*1.15,9.66,sz*1.15),tower);
}
const clock=new THREE.Group();clock.position.set(0,7.98,1.2);tower.add(clock);
const clockFace=new THREE.Mesh(new THREE.CircleGeometry(.69,32),new THREE.MeshStandardMaterial({color:0xf1dfb8,roughness:.7}));
clockFace.position.z=.035;clock.add(clockFace);
torus(.69,.06,mats.stoneDark,new THREE.Vector3(0,0,.06),clock);
for(let i=0;i<12;i++){
  const m=new THREE.Mesh(new THREE.BoxGeometry(.045,.12,.025),mats.iron);
  m.position.set(Math.sin(i*Math.PI/6)*.54,Math.cos(i*Math.PI/6)*.54,.09);m.rotation.z=-i*Math.PI/6;clock.add(m);
}
const minute=new THREE.Mesh(new THREE.BoxGeometry(.055,.48,.035),mats.iron);
minute.position.set(.12,.17,.12);minute.rotation.z=-.62;clock.add(minute);
const hour=new THREE.Mesh(new THREE.BoxGeometry(.065,.34,.04),mats.iron);
hour.position.set(-.08,-.11,.13);hour.rotation.z=.82;clock.add(hour);

const fountain=new THREE.Group();group.add(fountain);
const wetParts=[];
function basin(radius,height,y) {
  cyl(radius,radius*.91,height,mats.stone,new THREE.Vector3(0,y,0),fountain,56);
  torus(radius*.92,.17,mats.stoneLight,new THREE.Vector3(0,y+height/2-.05,0),fountain);
  const water=new THREE.Mesh(new THREE.CircleGeometry(radius*.78,48),mats.water);
  water.rotation.x=-Math.PI/2;water.position.y=y+height/2+.015;water.receiveShadow=true;fountain.add(water);wetParts.push(water);
}
basin(3.02,.63,.35);
basin(1.92,.48,1.55);
basin(1.13,.42,2.52);
cyl(.48,.62,1.72,mats.stone,new THREE.Vector3(0,3.57,0),fountain,32);
torus(.68,.12,mats.stoneLight,new THREE.Vector3(0,4.38,0),fountain);
const topWater=new THREE.Mesh(new THREE.CircleGeometry(.54,32),mats.water);
topWater.rotation.x=-Math.PI/2;topWater.position.y=4.43;fountain.add(topWater);wetParts.push(topWater);

const streams=[];
function stream(x,z,from,to,spread=.11) {
  const h=from-to;
  const m=new THREE.Mesh(new THREE.CylinderGeometry(spread,spread*.75,h,8,1,true),mats.waterWhite);
  m.position.set(x,(from+to)/2,z);m.castShadow=true;fountain.add(m);streams.push({m,base:y=>y,phase:rand(0,Math.PI*2)});
}
for(let i=0;i<12;i++){
  const a=i/12*Math.PI*2;
  stream(Math.cos(a)*.36,Math.sin(a)*.36,4.5,3.0,.052);
}
for(let i=0;i<10;i++){
  const a=i/10*Math.PI*2+.21;
  stream(Math.cos(a)*1.5,Math.sin(a)*1.5,2.0,1.08,.065);
}
for(let i=0;i<14;i++){
  const a=i/14*Math.PI*2;
  stream(Math.cos(a)*2.52,Math.sin(a)*2.52,1.0,.13,.07);
}
const centralJet=new THREE.Mesh(new THREE.CylinderGeometry(.055,.08,1.45,10,1,true),mats.waterWhite);
centralJet.position.y=5.18;fountain.add(centralJet);streams.push({m:centralJet,phase:0});
for(let i=0;i<28;i++){
  const a=rand(0,Math.PI*2),r=rand(.1,2.55);
  const sparkle=sphere(rand(.018,.045),mats.waterWhite,new THREE.Vector3(Math.cos(a)*r,rand(.76,1.05),Math.sin(a)*r),fountain);
  sparkle.userData={a,r,phase:rand(0,6.28),base:sparkle.position.y};
  wetParts.push(sparkle);
}

function umbrella(x,z,colors=[mats.red,mats.cream]) {
  const u=new THREE.Group();u.position.set(x,0,z);group.add(u);
  cyl(.055,.075,2.1,mats.wood,new THREE.Vector3(0,1.05,0),u,10);
  const canopy=new THREE.Group();canopy.position.y=2.08;u.add(canopy);
  for(let i=0;i<10;i++){
    const a=i*Math.PI*2/10;
    const shape=new THREE.Shape();
    shape.moveTo(0,0);shape.lineTo(.8,-.11);shape.quadraticCurveTo(1.5,-.18,1.65,0);shape.lineTo(0,0);
    const mesh=new THREE.Mesh(new THREE.ShapeGeometry(shape),colors[i%2]);
    mesh.rotation.y=a;mesh.rotation.x=-.18;mesh.castShadow=true;canopy.add(mesh);
  }
  const top=sphere(.11,mats.wood,new THREE.Vector3(0,.06,0),canopy);
  return u;
}
function cafeSet(x,z) {
  cyl(.49,.49,.08,mats.cream,new THREE.Vector3(x,.78,z),group,24);
  cyl(.06,.09,.72,mats.iron,new THREE.Vector3(x,.42,z),group,10);
  cyl(.34,.18,.07,mats.iron,new THREE.Vector3(x,.07,z),group,16);
  for(let i=0;i<3;i++){
    const a=i*2.094+.2;
    const cx=x+Math.cos(a)*.82,cz=z+Math.sin(a)*.82;
    cyl(.22,.22,.06,mats.wood,new THREE.Vector3(cx,.45,cz),group,12);
    for(let j=0;j<3;j++){
      const b=j*2.094;
      const leg=cyl(.027,.027,.44,mats.iron,new THREE.Vector3(cx+Math.cos(b)*.14,.22,cz+Math.sin(b)*.14),group,7);
      leg.rotation.z=0;
    }
    box(.38,.42,.055,mats.wood,new THREE.Vector3(cx,.73,cz),group).rotation.y=-a;
  }
}
umbrella(-6.3,4.25,[mats.red,mats.cream]); cafeSet(-6.3,4.25);
umbrella(5.8,4.6,[mats.blue,mats.cream]); cafeSet(5.8,4.6);
umbrella(-7.4,-2.5,[mats.yellow,mats.cream]); cafeSet(-7.4,-2.5);

function orangeTree(x,z,s=1) {
  const t=new THREE.Group();t.position.set(x,0,z);t.scale.setScalar(s);group.add(t);
  cyl(.14,.20,1.25,mats.wood,new THREE.Vector3(0,.72,0),t,10);
  const pot=cyl(.39,.29,.45,mats.terracotta,new THREE.Vector3(0,.225,0),t,20);
  torus(.37,.055,mats.terracotta,new THREE.Vector3(0,.43,0),t);
  for(let i=0;i<13;i++){
    const a=i*2.4,r=rand(.1,.55),y=1.27+rand(-.12,.6);
    sphere(rand(.24,.37),i%2?mats.leaf:mats.leafLight,new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r),t);
  }
  for(let i=0;i<9;i++){
    const a=rand(0,6.28),r=rand(.08,.58);
    sphere(.075,mats.orange,new THREE.Vector3(Math.cos(a)*r,1.3+rand(-.04,.58),Math.sin(a)*r),t);
  }
  return t;
}
orangeTree(-3.9,-6.5,.96);
orangeTree(4.25,-6.65,1.06);
orangeTree(-9.1,3.6,.83);
orangeTree(9.1,3.25,.82);

const cart = new THREE.Group();cart.position.set(5.7,0,-4.8);cart.rotation.y=-.32;group.add(cart);
box(2.0,.7,.92,mats.wood,new THREE.Vector3(0,.78,0),cart);
box(2.18,.11,1.06,mats.stoneLight,new THREE.Vector3(0,1.17,0),cart);
for(const x of [-.78,.78]) for(const z of [-.54,.54]) {
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.26,.26,.1,16),mats.darkWood);
  wheel.rotation.x=Math.PI/2;wheel.position.set(x,.29,z);wheel.castShadow=true;cart.add(wheel);
}
for(let i=0;i<8;i++){
  const px=-.72+(i%4)*.48,pz=-.25+Math.floor(i/4)*.46;
  const crate=box(.4,.24,.36,mats.terracotta,new THREE.Vector3(px,1.4,pz),cart);
  for(let j=0;j<5;j++) sphere(.07,pick([mats.red,mats.yellow,mats.orange]),new THREE.Vector3(px+rand(-.13,.13),1.58,pz+rand(-.1,.1)),cart);
}
for(const x of [-1.0,1.0]) cyl(.045,.045,2.7,mats.wood,new THREE.Vector3(x,2.38,0),cart,8);
box(2.35,.08,.08,mats.wood,new THREE.Vector3(0,3.68,0),cart);
const awning = new THREE.Mesh(new THREE.PlaneGeometry(2.5,1.32),mats.cream);
awning.rotation.x=Math.PI/2;awning.position.y=3.6;awning.castShadow=true;cart.add(awning);
for(let i=-.9;i<=.9;i+=.45) box(.2,.018,1.36,mats.red,new THREE.Vector3(i,3.615,0),cart);

function lantern(x,z) {
  const l=new THREE.Group();l.position.set(x,0,z);group.add(l);
  cyl(.055,.09,3.1,mats.iron,new THREE.Vector3(0,1.55,0),l,10);
  cyl(.24,.24,.10,mats.iron,new THREE.Vector3(0,3.04,0),l,10);
  const bulb=sphere(.17,new THREE.MeshStandardMaterial({color:0xffd783,emissive:0xffa63b,emissiveIntensity:.8}),new THREE.Vector3(0,2.83,0),l);
  box(.38,.42,.38,mats.iron,new THREE.Vector3(0,2.82,0),l);
  const glow=new THREE.PointLight(0xffb85a,.4,5,2);glow.position.set(0,2.8,0);l.add(glow);
}
lantern(-4.7,-8.8); lantern(3.2,-8.8); lantern(-9.3,1.0); lantern(9.3,-.5);

for(let i=0;i<26;i++){
  const a=i/26*Math.PI*2+rand(-.05,.05),r=rand(7,10.7);
  const pot=cyl(.2,.16,.34,mats.terracotta,new THREE.Vector3(Math.cos(a)*r,.17,Math.sin(a)*r),group,14);
  sphere(.31,pick([mats.leaf,mats.leafLight]),new THREE.Vector3(Math.cos(a)*r,.54,Math.sin(a)*r),group);
}

const sun = new THREE.DirectionalLight(0xffe1a6,4.4);
sun.position.set(-9,15,7);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-18;sun.shadow.camera.right=18;
sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;
sun.shadow.camera.near=.5;sun.shadow.camera.far=45;
sun.shadow.bias=-.00025;scene.add(sun);
scene.add(new THREE.HemisphereLight(0xa8d8ef,0xc07143,2.1));
const fill=new THREE.DirectionalLight(0xffc67b,.7);fill.position.set(10,7,-10);scene.add(fill);

const clouds=[];
for(let i=0;i<18;i++){
  const cloud=sphere(rand(.55,1.35),new THREE.MeshBasicMaterial({color:0xffefd0,transparent:true,opacity:rand(.13,.28)}),new THREE.Vector3(rand(-18,18),rand(10,14),rand(-17,-9)),scene);
  cloud.scale.z=.34;clouds.push(cloud);
}

const clockStart=performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const t=(now-clockStart)*.001;
  controls.update();

  streams.forEach((s,i)=>{
    const sway=Math.sin(t*2.7+s.phase)*.026;
    s.m.scale.x=1+sway*5;
    s.m.scale.z=1-sway*4;
    s.m.material.opacity=.56+.20*Math.sin(t*3+s.phase);
  });
  wetParts.forEach((p,i)=>{
    if(p.userData.phase!==undefined){
      p.position.y=p.userData.base+Math.sin(t*2.4+p.userData.phase)*.04;
      p.material.opacity=.55+.35*Math.max(0,Math.sin(t*3+p.userData.phase));
    } else {
      p.material.opacity=.69+.08*Math.sin(t*1.8+i);
    }
  });
  centralJet.scale.y=1+.12*Math.sin(t*2.1);
  clouds.forEach((c,i)=>{c.position.x+=.0025+(i%3)*.0006;if(c.position.x>20)c.position.x=-20;});
  clock.rotation.z=-t*.008;
  renderer.render(scene,camera);
}
animate(performance.now());

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
