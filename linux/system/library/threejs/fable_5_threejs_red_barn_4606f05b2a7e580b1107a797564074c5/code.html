<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weathered Red Barn</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd8dc; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfd4e0);
scene.fog = new THREE.Fog(0xbfd4e0, 60, 160);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 300);
camera.position.set(16, 9, 20);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 8;
controls.maxDistance = 60;

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xcfe4f5, 0x6b6250, 0.65));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.2);
sun.position.set(18, 24, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -20; sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20; sun.shadow.camera.bottom = -20;
sun.shadow.camera.near = 5; sun.shadow.camera.far = 70;
sun.shadow.bias = -0.0004;
sun.shadow.radius = 4;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xa8c4e0, 0.35);
fill.position.set(-14, 8, -10);
scene.add(fill);

// ---------- Procedural textures ----------
function canvasTex(w, h, draw, repX = 1, repY = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repX, repY);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// Faded red plank siding (vertical boards, weathered)
function plankTexture(repX, repY) {
  return canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#8d3a30'; g.fillRect(0, 0, w, h);
    const bw = 32;
    for (let x = 0; x < w; x += bw) {
      const shade = 0.78 + rnd() * 0.35;
      g.fillStyle = `rgb(${Math.round(148 * shade)},${Math.round(62 * shade)},${Math.round(50 * shade)})`;
      g.fillRect(x, 0, bw - 2, h);
      // weathering streaks
      for (let i = 0; i < 14; i++) {
        const gx = x + rnd() * (bw - 3), gy = rnd() * h, gl = 20 + rnd() * 90;
        g.strokeStyle = rnd() > 0.55 ? 'rgba(70,35,28,0.22)' : 'rgba(210,190,170,0.10)';
        g.lineWidth = 1;
        g.beginPath(); g.moveTo(gx, gy); g.lineTo(gx + (rnd() - .5) * 2, gy + gl); g.stroke();
      }
      // board gap
      g.fillStyle = 'rgba(40,18,14,0.85)'; g.fillRect(x + bw - 2, 0, 2, h);
      // nail heads
      g.fillStyle = 'rgba(45,30,25,0.6)';
      g.fillRect(x + bw / 2, 18, 2, 2); g.fillRect(x + bw / 2, h - 22, 2, 2);
    }
    // faded patches
    for (let i = 0; i < 10; i++) {
      const px = rnd() * w, py = rnd() * h, pr = 30 + rnd() * 70;
      const grad = g.createRadialGradient(px, py, 0, px, py, pr);
      grad.addColorStop(0, 'rgba(196,150,130,0.13)');
      grad.addColorStop(1, 'rgba(196,150,130,0)');
      g.fillStyle = grad; g.beginPath(); g.arc(px, py, pr, 0, 7); g.fill();
    }
  }, repX, repY);
}

// Corrugated galvanized metal roof
function roofTexture(repX, repY) {
  return canvasTex(512, 512, (g, w, h) => {
    g.fillStyle = '#9aa1a6'; g.fillRect(0, 0, w, h);
    const cw = 16;
    for (let x = 0; x < w; x += cw) {
      const gr = g.createLinearGradient(x, 0, x + cw, 0);
      gr.addColorStop(0, '#7c8489'); gr.addColorStop(0.35, '#c3cacd');
      gr.addColorStop(0.6, '#98a0a5'); gr.addColorStop(1, '#767e83');
      g.fillStyle = gr; g.fillRect(x, 0, cw, h);
    }
    // panel seams
    g.fillStyle = 'rgba(60,66,70,0.55)';
    for (let y = 0; y < h; y += 128) g.fillRect(0, y, w, 2);
    // rust specks
    for (let i = 0; i < 220; i++) {
      g.fillStyle = `rgba(${140 + rnd() * 60 | 0},${70 + rnd() * 30 | 0},40,${0.06 + rnd() * 0.16})`;
      const r = 1 + rnd() * 4;
      g.beginPath(); g.arc(rnd() * w, rnd() * h, r, 0, 7); g.fill();
    }
  }, repX, repY);
}

// Grass ground
const grassTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#6c8f4e'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 5000; i++) {
    const v = rnd();
    g.fillStyle = `rgba(${60 + v * 60 | 0},${110 + v * 50 | 0},${45 + v * 30 | 0},0.5)`;
    g.fillRect(rnd() * w, rnd() * h, 2, 2 + rnd() * 3);
  }
}, 18, 18);

// Concrete
const concreteTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#a7a49c'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1600; i++) {
    const v = rnd();
    g.fillStyle = `rgba(${120 + v * 90 | 0},${118 + v * 88 | 0},${112 + v * 84 | 0},0.35)`;
    g.fillRect(rnd() * w, rnd() * h, 2, 2);
  }
}, 2, 1);

// ---------- Materials ----------
const sidingMat  = new THREE.MeshStandardMaterial({ map: plankTexture(4, 2), roughness: 0.92, metalness: 0.0 });
const gableMat   = new THREE.MeshStandardMaterial({ map: plankTexture(3, 2), roughness: 0.92 });
const roofMat    = new THREE.MeshStandardMaterial({ map: roofTexture(6, 3), roughness: 0.55, metalness: 0.65 });
const trimMat    = new THREE.MeshStandardMaterial({ color: 0xece5d8, roughness: 0.8 });
const doorMat    = new THREE.MeshStandardMaterial({ map: plankTexture(2, 2), color: 0xb0aca6, roughness: 0.95 });
const darkMat    = new THREE.MeshStandardMaterial({ color: 0x3a3733, roughness: 0.6, metalness: 0.4 });
const glassMat   = new THREE.MeshStandardMaterial({ color: 0x8fb6c9, roughness: 0.15, metalness: 0.1, emissive: 0x24343d, emissiveIntensity: 0.4 });
const concMat    = new THREE.MeshStandardMaterial({ map: concreteTex, roughness: 0.95 });

// ---------- Barn (real-world units, meters) ----------
// Body: 12 m long (Z), 9 m wide (X), 3.6 m wall height.
// Gambrel roof: lower pitch steep, upper pitch shallow; ridge ~8 m.
const barn = new THREE.Group();
scene.add(barn);

const W = 9, L = 12, WALL = 3.6;
const midX = 3.1, midY = 6.4, ridgeY = 8.0; // gambrel break point and ridge heights

function box(w, h, d, mat, x, y, z, cast = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = cast; m.receiveShadow = true;
  barn.add(m);
  return m;
}

// Walls
box(W, WALL, L, sidingMat, 0, WALL / 2, 0);

// Gambrel gable ends (extruded profile)
const profile = new THREE.Shape();
profile.moveTo(-W / 2, WALL);
profile.lineTo(-midX, midY);
profile.lineTo(0, ridgeY);
profile.lineTo(midX, midY);
profile.lineTo(W / 2, WALL);
profile.closePath();
const gableGeo = new THREE.ExtrudeGeometry(profile, { depth: L, bevelEnabled: false });
gableGeo.translate(0, 0, -L / 2);
const gable = new THREE.Mesh(gableGeo, gableMat);
gable.castShadow = gable.receiveShadow = true;
barn.add(gable);

// Roof panels (4 slopes, slight overhang)
const over = 0.45, zLen = L + 0.9, thick = 0.1;
function roofPanel(x1, y1, x2, y2, flipX) {
  const len = Math.hypot(x2 - x1, y2 - y1) + over * (y1 <= WALL + 3 ? 1 : 0.4);
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const geo = new THREE.BoxGeometry(len, thick, zLen);
  const m = new THREE.Mesh(geo, roofMat);
  const cx = (x1 + x2) / 2 - Math.cos(ang) * (len - Math.hypot(x2 - x1, y2 - y1)) / 2 * (flipX ? -1 : 1) * 0 ;
  m.position.set((x1 + x2) / 2, (y1 + y2) / 2 + thick, 0);
  m.rotation.z = ang;
  // shift outward along slope so overhang extends past eave
  m.translateX(-over * 0.5 * (y1 < y2 ? 1 : -1) * 0);
  m.castShadow = m.receiveShadow = true;
  barn.add(m);
  return m;
}
// lower slopes (with eave overhang) and upper slopes
function slope(xa, ya, xb, yb, extend) {
  const dx = xb - xa, dy = yb - ya, d = Math.hypot(dx, dy);
  const ux = dx / d, uy = dy / d;
  const x1 = xa - ux * extend, y1 = ya - uy * extend;
  const len = d + extend + 0.12;
  const m = new THREE.Mesh(new THREE.BoxGeometry(len, thick, zLen), roofMat);
  m.position.set((x1 + xb) / 2, (y1 + yb) / 2 + 0.02, 0);
  m.rotation.z = Math.atan2(yb - y1, xb - x1);
  m.castShadow = m.receiveShadow = true;
  barn.add(m);
}
slope(-W / 2, WALL, -midX, midY, over);
slope( W / 2, WALL,  midX, midY, over);
slope(-midX, midY, 0, ridgeY, 0.05);
slope( midX, midY, 0, ridgeY, 0.05);

// Ridge cap
box(0.5, 0.14, zLen, roofMat, 0, ridgeY + 0.1, 0);

// Raised concrete threshold / foundation slab
box(W + 0.4, 0.35, L + 0.4, concMat, 0, 0.175, 0);
box(3.6, 0.22, 1.6, concMat, 0, 0.11, L / 2 + 0.85); // apron in front of door

// ---------- Gable-end big sliding door (front, +Z) ----------
const doorW = 3.0, doorH = 3.0, zF = L / 2;
// door panel (slid slightly open to one side)
const door = box(doorW, doorH, 0.12, doorMat, 0.55, 0.35 + doorH / 2, zF + 0.16);
// cross-brace trim on door
const braceMat = new THREE.MeshStandardMaterial({ color: 0xd9d2c4, roughness: 0.85 });
function doorTrim(w, h, x, y, rz = 0) {
  const t = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.04), braceMat);
  t.position.set(x, y, zF + 0.24); t.rotation.z = rz;
  t.castShadow = true; barn.add(t);
}
doorTrim(doorW, 0.16, 0.55, 0.35 + 0.1);
doorTrim(doorW, 0.16, 0.55, 0.35 + doorH - 0.1);
doorTrim(0.16, doorH, 0.55 - doorW / 2 + 0.09, 0.35 + doorH / 2);
doorTrim(0.16, doorH, 0.55 + doorW / 2 - 0.09, 0.35 + doorH / 2);
doorTrim(Math.hypot(doorW, doorH) - 0.35, 0.15, 0.55, 0.35 + doorH / 2,  Math.atan2(doorH, doorW));
doorTrim(Math.hypot(doorW, doorH) - 0.35, 0.15, 0.55, 0.35 + doorH / 2, -Math.atan2(doorH, doorW));
// dark opening revealed by the partly-open door
box(2.2, doorH - 0.1, 0.05, new THREE.MeshStandardMaterial({ color: 0x14100c, roughness: 1 }), -0.6, 0.35 + (doorH - 0.1) / 2, zF + 0.03, false);
// sliding track + hangers
box(4.6, 0.12, 0.16, darkMat, 0.3, 0.35 + doorH + 0.28, zF + 0.2);
for (const hx of [0.55 - 1.1, 0.55, 0.55 + 1.1]) {
  box(0.08, 0.3, 0.06, darkMat, hx, 0.35 + doorH + 0.12, zF + 0.22);
}

// ---------- Windows ----------
function windowUnit(x, y, z, ry, w = 0.9, h = 1.1) {
  const g = new THREE.Group();
  const frame = new THREE.Mesh(new THREE.BoxGeometry(w + 0.16, h + 0.16, 0.1), trimMat);
  const glass = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.06), glassMat);
  glass.position.z = 0.03;
  const mH = new THREE.Mesh(new THREE.BoxGeometry(w, 0.06, 0.04), trimMat); mH.position.z = 0.07;
  const mV = new THREE.Mesh(new THREE.BoxGeometry(0.06, h, 0.04), trimMat); mV.position.z = 0.07;
  frame.castShadow = true;
  g.add(frame, glass, mH, mV);
  g.position.set(x, y, z); g.rotation.y = ry;
  barn.add(g);
}
// side walls
for (const s of [-1, 1]) {
  for (const z of [-3.8, 0, 3.8]) windowUnit(s * (W / 2 + 0.06), 2.1, z, s * Math.PI / 2);
}
// hayloft window on front gable + one on rear
windowUnit(0, 6.1, zF + 0.06, 0, 0.8, 0.95);
windowUnit(-2.7, 2.1, zF + 0.06, 0);
windowUnit(0, 5.9, -zF - 0.06, Math.PI, 0.8, 0.95);

// Corner trim boards
for (const sx of [-1, 1]) for (const sz of [-1, 1])
  box(0.18, WALL, 0.18, trimMat, sx * (W / 2 - 0.02), WALL / 2 + 0.05, sz * (L / 2 - 0.02));

// ---------- Ground + soft shadow ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(70, 64),
  new THREE.MeshStandardMaterial({ map: grassTex, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// soft radial contact shadow under the barn
const shadowTex = canvasTex(256, 256, (g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 20, w / 2, h / 2, w / 2);
  gr.addColorStop(0, 'rgba(0,0,0,0.35)');
  gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const contact = new THREE.Mesh(
  new THREE.PlaneGeometry(22, 24),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
);
contact.rotation.x = -Math.PI / 2;
contact.position.y = 0.02;
scene.add(contact);

// ---------- Resize / Loop ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
