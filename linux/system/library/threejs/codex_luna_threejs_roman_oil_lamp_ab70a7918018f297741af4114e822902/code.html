<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roman Terracotta Oil Lamp</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #17100c;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17100c);
scene.fog = new THREE.Fog(0x17100c, 10, 22);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.7, 4.6, 7.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.065;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.15;
controls.minDistance = 4.5;
controls.maxDistance = 12;
controls.target.set(0, 0.25, 0);

const terracotta = new THREE.MeshStandardMaterial({
  color: 0x9b4228,
  roughness: 0.82,
  metalness: 0.02
});
const terracottaDark = new THREE.MeshStandardMaterial({
  color: 0x6e291c,
  roughness: 0.9,
  metalness: 0
});
const reliefMaterial = new THREE.MeshStandardMaterial({
  color: 0xb35936,
  roughness: 0.76,
  metalness: 0.01
});
const sootMaterial = new THREE.MeshStandardMaterial({
  color: 0x100b08,
  roughness: 0.98,
  metalness: 0
});
const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x2b1b14,
  roughness: 0.93,
  metalness: 0
});

function addMesh(geometry, material, position, rotation, scale) {
  const object = new THREE.Mesh(geometry, material);
  if (position) object.position.set(position.x, position.y, position.z);
  if (rotation) object.rotation.set(rotation.x, rotation.y, rotation.z);
  if (scale) object.scale.set(scale.x, scale.y, scale.z);
  object.castShadow = true;
  object.receiveShadow = true;
  scene.add(object);
  return object;
}

const reservoirProfile = [
  new THREE.Vector2(0.02, -0.68),
  new THREE.Vector2(1.03, -0.68),
  new THREE.Vector2(1.38, -0.59),
  new THREE.Vector2(1.62, -0.38),
  new THREE.Vector2(1.72, -0.08),
  new THREE.Vector2(1.69, 0.19),
  new THREE.Vector2(1.54, 0.41),
  new THREE.Vector2(1.28, 0.54),
  new THREE.Vector2(0.02, 0.55)
];
const reservoir = addMesh(
  new THREE.LatheGeometry(reservoirProfile, 64),
  terracotta,
  { x: 0, y: 0, z: 0 },
  null,
  { x: 1, y: 1, z: 1.18 }
);

addMesh(
  new THREE.TorusGeometry(1.4, 0.075, 12, 64),
  reliefMaterial,
  { x: 0, y: 0.49, z: 0 },
  null,
  { x: 1, y: 1, z: 1.18 }
);

addMesh(
  new THREE.CylinderGeometry(1.48, 1.58, 0.16, 64),
  terracotta,
  { x: 0, y: 0.57, z: 0 },
  null,
  { x: 1, y: 1, z: 1.06 }
);

addMesh(
  new THREE.TorusGeometry(1.31, 0.055, 10, 64),
  terracottaDark,
  { x: 0, y: 0.67, z: 0 },
  null,
  { x: 1, y: 1, z: 1.06 }
);

addMesh(
  new THREE.CylinderGeometry(0.36, 0.43, 0.12, 40),
  terracottaDark,
  { x: 0, y: 0.68, z: 0 },
  null,
  { x: 1, y: 1, z: 1 }
);

addMesh(
  new THREE.TorusGeometry(0.39, 0.075, 12, 40),
  reliefMaterial,
  { x: 0, y: 0.75, z: 0 },
  null,
  { x: 1, y: 1, z: 1 }
);

addMesh(
  new THREE.CylinderGeometry(0.25, 0.28, 0.08, 32),
  sootMaterial,
  { x: 0, y: 0.765, z: 0 },
  null,
  { x: 1, y: 1, z: 1 }
);

for (let index = 0; index < 10; index += 1) {
  const angle = (index / 10) * Math.PI * 2;
  const radius = 0.89;
  const petal = addMesh(
    new THREE.SphereGeometry(0.22, 20, 12),
    reliefMaterial,
    {
      x: Math.cos(angle) * radius,
      y: 0.73,
      z: Math.sin(angle) * radius * 0.98
    },
    { x: 0, y: -angle, z: 0 },
    { x: 0.47, y: 0.12, z: 1.15 }
  );
  petal.rotation.y = -angle;
}

for (let index = 0; index < 10; index += 1) {
  const angle = (index / 10) * Math.PI * 2 + Math.PI / 10;
  const radius = 0.56;
  addMesh(
    new THREE.SphereGeometry(0.11, 16, 10),
    terracottaDark,
    {
      x: Math.cos(angle) * radius,
      y: 0.735,
      z: Math.sin(angle) * radius
    },
    null,
    { x: 0.65, y: 0.1, z: 1.05 }
  );
}

const spoutGroup = new THREE.Group();
scene.add(spoutGroup);
spoutGroup.position.set(0, 0.18, -1.67);
spoutGroup.rotation.x = -Math.PI / 2;

const spout = new THREE.Mesh(
  new THREE.ConeGeometry(0.56, 1.62, 40, 1, false),
  terracotta
);
spout.scale.set(1, 1, 0.75);
spout.castShadow = true;
spout.receiveShadow = true;
spoutGroup.add(spout);

const spoutCollar = new THREE.Mesh(
  new THREE.CylinderGeometry(0.58, 0.67, 0.22, 40),
  terracottaDark
);
spoutCollar.position.y = 0.72;
spoutCollar.castShadow = true;
spoutCollar.receiveShadow = true;
spoutGroup.add(spoutCollar);

const spoutRim = new THREE.Mesh(
  new THREE.TorusGeometry(0.225, 0.06, 12, 40),
  reliefMaterial
);
spoutRim.position.y = -0.83;
spoutRim.castShadow = true;
spoutRim.receiveShadow = true;
spoutGroup.add(spoutRim);

const wickOpening = new THREE.Mesh(
  new THREE.CylinderGeometry(0.17, 0.18, 0.075, 32),
  sootMaterial
);
wickOpening.position.y = -0.84;
wickOpening.castShadow = true;
spoutGroup.add(wickOpening);

const handleGroup = new THREE.Group();
scene.add(handleGroup);
handleGroup.position.set(0, 0.16, 1.92);
handleGroup.rotation.x = Math.PI / 2;

const handle = new THREE.Mesh(
  new THREE.TorusGeometry(0.66, 0.13, 20, 48, Math.PI * 1.72),
  terracotta
);
handle.rotation.z = Math.PI;
handle.scale.set(1.05, 0.82, 1);
handle.castShadow = true;
handle.receiveShadow = true;
handleGroup.add(handle);

const handleBaseLeft = new THREE.Mesh(
  new THREE.CylinderGeometry(0.17, 0.23, 0.36, 24),
  terracottaDark
);
handleBaseLeft.position.set(-0.46, 0.03, 0);
handleBaseLeft.rotation.z = Math.PI / 2;
handleBaseLeft.castShadow = true;
handleBaseLeft.receiveShadow = true;
handleGroup.add(handleBaseLeft);

const handleBaseRight = handleBaseLeft.clone();
handleBaseRight.position.x = 0.46;
handleGroup.add(handleBaseRight);

addMesh(
  new THREE.TorusGeometry(1.18, 0.045, 10, 48),
  terracottaDark,
  { x: 0, y: -0.56, z: 0 },
  null,
  { x: 1, y: 1, z: 1.18 }
);

const ground = addMesh(
  new THREE.CircleGeometry(14, 96),
  groundMaterial,
  { x: 0, y: -0.86, z: 0 },
  { x: -Math.PI / 2, y: 0, z: 0 },
  null
);
ground.castShadow = false;
ground.receiveShadow = true;

const hemiLight = new THREE.HemisphereLight(0xd8b28b, 0x24130c, 2.1);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(0xffd2a1, 4.2);
keyLight.position.set(-4.5, 7.5, 5.2);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -5;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x9aafd0, 1.15);
fillLight.position.set(5, 3, -4);
scene.add(fillLight);

const warmPoint = new THREE.PointLight(0xf28a3d, 1.4, 5.5, 2);
warmPoint.position.set(0, 1.1, -0.12);
scene.add(warmPoint);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
