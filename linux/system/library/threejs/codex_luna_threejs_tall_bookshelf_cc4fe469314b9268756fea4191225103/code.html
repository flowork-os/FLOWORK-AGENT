<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Bookshelf</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d8d0c4;
    }
    canvas {
      display: block;
    }
    #label {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(40, 30, 24, 0.58);
      font: 600 12px/1.4 system-ui, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="label">Oak library shelving</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd8d0c4);
    scene.fog = new THREE.Fog(0xd8d0c4, 16, 28);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(10.6, 8.1, 12.5);
    camera.lookAt(0, 4.1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.minDistance = 8;
    controls.maxDistance = 21;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.target.set(0, 4.25, 0);

    const wood = new THREE.MeshStandardMaterial({
      color: 0x765039,
      roughness: 0.48,
      metalness: 0.02
    });
    const woodTop = new THREE.MeshStandardMaterial({
      color: 0x8b6144,
      roughness: 0.42,
      metalness: 0.02
    });
    const woodEdge = new THREE.MeshStandardMaterial({
      color: 0x5b3b2a,
      roughness: 0.52
    });
    const backMat = new THREE.MeshStandardMaterial({
      color: 0x493126,
      roughness: 0.72
    });
    const holeMat = new THREE.MeshStandardMaterial({
      color: 0x17100d,
      roughness: 0.9
    });
    const brass = new THREE.MeshStandardMaterial({
      color: 0xb8874d,
      roughness: 0.28,
      metalness: 0.72
    });

    function box(name, size, position, material, bevel = 0) {
      const geometry = new THREE.BoxGeometry(size[0], size[1], size[2]);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function cylinder(name, radius, length, position, material, rotation = [0, 0, 0], segments = 20) {
      const geometry = new THREE.CylinderGeometry(radius, radius, length, segments);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    const shelfWidth = 5.36;
    const shelfDepth = 1.22;
    const shelfThickness = 0.27;
    const innerX = 2.68;

    box("Left side panel", [0.34, 8.55, 1.48], [-2.85, 4.5, 0], wood);
    box("Right side panel", [0.34, 8.55, 1.48], [2.85, 4.5, 0], wood);
    box("Recessed back panel", [5.42, 8.18, 0.13], [0, 4.48, -0.675], backMat);

    box("Top crown", [6.12, 0.38, 1.67], [0, 8.92, 0], woodTop);
    box("Top shadow line", [5.72, 0.12, 1.52], [0, 8.67, -0.01], woodEdge);
    box("Bottom shelf", [shelfWidth, 0.33, shelfDepth], [0, 0.74, 0.03], woodTop);

    const shelfYs = [1.86, 3.05, 4.24, 5.43, 6.62, 7.81];
    shelfYs.forEach((y, i) => {
      box(`Adjustable shelf ${i + 1}`, [shelfWidth, shelfThickness, shelfDepth], [0, y, 0.02], woodTop);
      box(`Shelf front nosing ${i + 1}`, [shelfWidth + 0.035, 0.12, 0.09], [0, y + 0.115, 0.58], woodEdge);
    });

    box("Lower plinth", [6.3, 0.42, 1.8], [0, 0.22, 0.03], woodEdge);
    box("Left foot", [1.18, 0.22, 1.5], [-2.18, 0.02, 0], woodEdge);
    box("Right foot", [1.18, 0.22, 1.5], [2.18, 0.02, 0], woodEdge);

    const holeLevels = [1.08, 1.34, 2.26, 2.52, 3.45, 3.71, 4.64, 4.90, 5.83, 6.09, 7.02, 7.28, 8.19];
    for (const y of holeLevels) {
      for (const x of [-2.676, 2.676]) {
        for (const z of [-0.44, 0.34]) {
          cylinder("Shelf peg hole", 0.047, 0.018, [x, y, z], holeMat, [0, 0, Math.PI / 2], 18);
          cylinder("Hole rim", 0.066, 0.009, [x + (x < 0 ? -0.011 : 0.011), y, z], woodEdge, [0, 0, Math.PI / 2], 18);
        }
      }
    }

    function addBook(x, y, z, w, h, d, color, angle = 0) {
      const mat = new THREE.MeshStandardMaterial({
        color,
        roughness: 0.68,
        metalness: 0.01
      });
      const book = box("Book", [w, h, d], [x, y + h / 2, z], mat);
      book.rotation.z = angle;
      return book;
    }

    const bookColors = [0x294b52, 0x914f3d, 0xc28b4f, 0x3d4e72, 0x6c7141, 0x7d3944, 0x344038, 0xb7a37c];

    function bookRow(y, z, start, count, scale = 1) {
      let x = start;
      for (let i = 0; i < count; i++) {
        const w = (0.23 + ((i * 17) % 5) * 0.045) * scale;
        const h = (0.63 + ((i * 13) % 5) * 0.08) * scale;
        const d = 0.75;
        const angle = i === count - 1 ? -0.08 : (i % 7 === 0 ? 0.035 : 0);
        addBook(x + w / 2, y + 0.15, z, w, h, d, bookColors[(i + Math.round(y)) % bookColors.length], angle);
        x += w + 0.045 * scale;
      }
    }

    bookRow(0.74, -0.03, -2.43, 9, 1.0);
    bookRow(1.86, -0.03, -2.42, 7, 0.9);
    bookRow(3.05, -0.03, -2.42, 10, 0.82);
    bookRow(4.24, -0.03, -2.42, 8, 0.92);
    bookRow(5.43, -0.03, -2.42, 9, 0.78);
    bookRow(6.62, -0.03, -2.42, 7, 0.9);

    addBook(1.42, 1.86, -0.02, 0.34, 0.88, 0.75, 0x5d3028, -0.18);
    addBook(-1.32, 4.24, -0.02, 0.42, 0.91, 0.75, 0x30485b, 0.13);
    addBook(1.84, 5.43, -0.02, 0.31, 0.72, 0.75, 0x9d7040, -0.12);

    for (const x of [-2.68, 2.68]) {
      box("Vertical side highlight", [0.035, 8.15, 0.035], [x, 4.55, 0.69], woodTop);
    }

    cylinder("Decorative brass pin", 0.08, 0.045, [0, 8.92, 0.79], brass, [Math.PI / 2, 0, 0], 24);

    const floorMat = new THREE.MeshStandardMaterial({
      color: 0xb8a996,
      roughness: 0.86,
      metalness: 0
    });
    box("Floor", [30, 0.18, 30], [0, -0.25, 0], floorMat);

    const wallMat = new THREE.MeshStandardMaterial({
      color: 0xd8d0c4,
      roughness: 0.94
    });
    box("Back wall", [30, 18, 0.18], [0, 8.5, -2.1], wallMat);

    const rugMat = new THREE.MeshStandardMaterial({
      color: 0x8a7566,
      roughness: 0.95
    });
    box("Rug", [8.7, 0.035, 5.1], [0, -0.14, 1.0], rugMat);

    const ambient = new THREE.HemisphereLight(0xf5ead9, 0x4d3c32, 2.25);
    scene.add(ambient);

    const key = new THREE.DirectionalLight(0xffe3bd, 4.1);
    key.position.set(-6, 12, 8);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -8;
    key.shadow.camera.right = 8;
    key.shadow.camera.top = 13;
    key.shadow.camera.bottom = -3;
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 30;
    key.shadow.bias = -0.00035;
    scene.add(key);

    const fill = new THREE.PointLight(0xc1d7ff, 34, 14, 2);
    fill.position.set(4.5, 6.5, 4);
    scene.add(fill);

    const warm = new THREE.PointLight(0xffad67, 18, 9, 2);
    warm.position.set(-3.5, 2.7, 2.4);
    scene.add(warm);

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      const t = clock.getElapsedTime();
      warm.intensity = 17.5 + Math.sin(t * 0.7) * 1.2;
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
