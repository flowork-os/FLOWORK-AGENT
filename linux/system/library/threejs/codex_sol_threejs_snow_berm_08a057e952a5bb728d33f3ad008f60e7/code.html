<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snow Berm at a Plowed Lot Edge</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #cbd5dc; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcbd6dd);
scene.fog = new THREE.Fog(0xcbd6dd, 24, 56);

const camera = new THREE.PerspectiveCamera(43, innerWidth / innerHeight, 0.1, 100);
camera.position.set(13.5, 8.2, 14.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.65, -1.2);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.32;
controls.minDistance = 8;
controls.maxDistance = 34;
controls.maxPolarAngle = Math.PI * 0.475;

function hash2(x, y) {
  const v = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return v - Math.floor(v);
}

function smoothNoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy);
  const b = hash2(ix + 1, iy);
  const c = hash2(ix, iy + 1);
  const d = hash2(ix + 1, iy + 1);
  return THREE.MathUtils.lerp(
    THREE.MathUtils.lerp(a, b, ux),
    THREE.MathUtils.lerp(c, d, ux),
    uy
  );
}

function fbm(x, y) {
  let value = 0;
  let amplitude = 0.55;
  let frequency = 1;
  for (let i = 0; i < 4; i++) {
    value += smoothNoise(x * frequency, y * frequency) * amplitude;
    frequency *= 2.03;
    amplitude *= 0.48;
  }
  return value;
}

function seeded(index, salt = 0) {
  return hash2(index * 1.731 + salt * 9.17, index * 0.617 - salt * 3.13);
}

const asphaltGeometry = new THREE.PlaneGeometry(30, 18, 30, 18);
asphaltGeometry.rotateX(-Math.PI / 2);
asphaltGeometry.translate(0, 0, 5.2);

const asphaltColors = [];
const asphaltPosition = asphaltGeometry.attributes.position;
for (let i = 0; i < asphaltPosition.count; i++) {
  const x = asphaltPosition.getX(i);
  const z = asphaltPosition.getZ(i);
  const variation = (fbm(x * 0.32, z * 0.32) - 0.5) * 0.075;
  const c = new THREE.Color(0x303437);
  c.offsetHSL(0, 0, variation);
  asphaltColors.push(c.r, c.g, c.b);
}
asphaltGeometry.setAttribute('color', new THREE.Float32BufferAttribute(asphaltColors, 3));

const asphalt = new THREE.Mesh(
  asphaltGeometry,
  new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.91,
    metalness: 0.02
  })
);
asphalt.receiveShadow = true;
scene.add(asphalt);

const underGeometry = new THREE.PlaneGeometry(70, 70);
underGeometry.rotateX(-Math.PI / 2);
underGeometry.translate(0, -0.09, 0);
const underGround = new THREE.Mesh(
  underGeometry,
  new THREE.MeshStandardMaterial({ color: 0x7f8789, roughness: 1 })
);
underGround.receiveShadow = true;
scene.add(underGround);

const lineMaterial = new THREE.MeshStandardMaterial({
  color: 0xe3d9aa,
  roughness: 0.85,
  metalness: 0
});

for (let x = -11.8; x <= 12; x += 4.75) {
  const line = new THREE.Mesh(new THREE.BoxGeometry(0.105, 0.018, 6.4), lineMaterial);
  line.position.set(x, 0.018, 5.9);
  line.rotation.y = 0.015 * Math.sin(x);
  line.receiveShadow = true;
  scene.add(line);
}

const fadedEdgeSegments = [];
for (let i = 0; i < 15; i++) {
  if (i === 3 || i === 10) continue;
  const segment = new THREE.Mesh(
    new THREE.BoxGeometry(1.48, 0.016, 0.085),
    lineMaterial
  );
  segment.position.set(-13.4 + i * 1.88, 0.017, -1.95);
  segment.material = lineMaterial;
  fadedEdgeSegments.push(segment);
  scene.add(segment);
}

function bermHeight(x, z) {
  const waviness = 0.24 * Math.sin(x * 0.45) + 0.11 * Math.sin(x * 1.23 + 1.6);
  const center = -3.72 + 0.15 * Math.sin(x * 0.31) + 0.08 * Math.sin(x * 0.91);
  const dz = z - center;
  const width = dz < 0 ? 3.15 : 1.42;
  const profile = Math.max(0, 1 - Math.abs(dz) / width);
  const shaped = Math.pow(profile, dz < 0 ? 1.7 : 1.12);
  const endFade = THREE.MathUtils.smoothstep(15.7 - Math.abs(x), 0, 2.2);
  const heightVariation = 1.86 + waviness + (fbm(x * 0.19, 2.7) - 0.5) * 0.46;
  const lumps = (fbm(x * 0.48, z * 0.62) - 0.48) * 0.34 * Math.pow(profile, 0.6);
  const compactedBase = 0.07 + 0.05 * fbm(x * 0.35, z * 0.35);
  return compactedBase + Math.max(0, shaped * heightVariation * endFade + lumps * endFade);
}

const bermWidthSegments = 180;
const bermDepthSegments = 56;
const xMin = -16.5, xMax = 16.5;
const zMin = -8.2, zMax = -2.22;
const positions = [];
const colors = [];
const indices = [];
const snowClean = new THREE.Color(0xe8eceb);
const snowBlue = new THREE.Color(0xcbd6d9);
const dirtySnow = new THREE.Color(0x696961);
const slush = new THREE.Color(0x898a7f);

for (let iz = 0; iz <= bermDepthSegments; iz++) {
  const tz = iz / bermDepthSegments;
  const z = THREE.MathUtils.lerp(zMin, zMax, tz);
  for (let ix = 0; ix <= bermWidthSegments; ix++) {
    const tx = ix / bermWidthSegments;
    const x = THREE.MathUtils.lerp(xMin, xMax, tx);
    const y = bermHeight(x, z);
    positions.push(x, y, z);

    const center = -3.72 + 0.15 * Math.sin(x * 0.31) + 0.08 * Math.sin(x * 0.91);
    const lotSide = THREE.MathUtils.smoothstep(z, center - 0.45, -2.25);
    const baseDirt = 1 - THREE.MathUtils.smoothstep(y, 0.08, 0.66);
    const grimeNoise = THREE.MathUtils.clamp(
      baseDirt * (0.48 + fbm(x * 0.7, z * 0.9) * 0.72) * lotSide,
      0,
      1
    );
    const coolShade = THREE.MathUtils.clamp((center - z) / 4.3, 0, 1) * 0.25;
    const c = snowClean.clone().lerp(snowBlue, coolShade);
    c.lerp(slush, grimeNoise * 0.42);
    c.lerp(dirtySnow, Math.max(0, grimeNoise - 0.45) * 0.92);
    const sparkleVariation = (hash2(ix * 0.71, iz * 1.37) - 0.5) * 0.035;
    c.offsetHSL(0, 0, sparkleVariation);
    colors.push(c.r, c.g, c.b);
  }
}

for (let iz = 0; iz < bermDepthSegments; iz++) {
  for (let ix = 0; ix < bermWidthSegments; ix++) {
    const a = iz * (bermWidthSegments + 1) + ix;
    const b = a + 1;
    const c = a + bermWidthSegments + 1;
    const d = c + 1;
    indices.push(a, c, b, b, c, d);
  }
}

const bermGeometry = new THREE.BufferGeometry();
bermGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
bermGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
bermGeometry.setIndex(indices);
bermGeometry.computeVertexNormals();
bermGeometry.computeBoundingSphere();

const berm = new THREE.Mesh(
  bermGeometry,
  new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.88,
    metalness: 0
  })
);
berm.castShadow = true;
berm.receiveShadow = true;
scene.add(berm);

const distantSnowGeometry = new THREE.PlaneGeometry(42, 17, 42, 16);
distantSnowGeometry.rotateX(-Math.PI / 2);
const distantPos = distantSnowGeometry.attributes.position;
const distantColors = [];
for (let i = 0; i < distantPos.count; i++) {
  const x = distantPos.getX(i);
  const localZ = distantPos.getZ(i);
  const z = localZ - 14.3;
  const y = 0.03 + (fbm(x * 0.16, z * 0.18) - 0.45) * 0.16;
  distantPos.setY(i, y);
  const c = new THREE.Color(0xdde5e5);
  c.offsetHSL(0, 0, (fbm(x * 0.31, z * 0.31) - 0.5) * 0.05);
  distantColors.push(c.r, c.g, c.b);
}
distantSnowGeometry.setAttribute('color', new THREE.Float32BufferAttribute(distantColors, 3));
distantSnowGeometry.computeVertexNormals();
const distantSnow = new THREE.Mesh(
  distantSnowGeometry,
  new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.94 })
);
distantSnow.position.z = -14.3;
distantSnow.receiveShadow = true;
scene.add(distantSnow);

const slushMaterial = new THREE.MeshStandardMaterial({
  color: 0xaeb5b2,
  roughness: 0.96
});
const dirtySlushMaterial = new THREE.MeshStandardMaterial({
  color: 0x777a72,
  roughness: 1
});

for (let i = 0; i < 34; i++) {
  const x = -14.2 + seeded(i, 1) * 28.4;
  const z = -2.02 + seeded(i, 2) * 1.1;
  const radius = 0.075 + seeded(i, 3) * 0.19;
  const blob = new THREE.Mesh(
    new THREE.IcosahedronGeometry(radius, 1),
    seeded(i, 4) > 0.42 ? slushMaterial : dirtySlushMaterial
  );
  blob.scale.set(1.5 + seeded(i, 5) * 2.6, 0.28 + seeded(i, 6) * 0.35, 0.8 + seeded(i, 7));
  blob.position.set(x, radius * blob.scale.y * 0.72, z);
  blob.rotation.set(seeded(i, 8) * Math.PI, seeded(i, 9) * Math.PI, seeded(i, 10) * Math.PI);
  blob.castShadow = true;
  blob.receiveShadow = true;
  scene.add(blob);
}

const gritMaterial = new THREE.MeshStandardMaterial({
  color: 0x4b4b45,
  roughness: 1
});

for (let i = 0; i < 95; i++) {
  const x = -15 + seeded(i, 11) * 30;
  const z = -2.33 + seeded(i, 12) * 0.72;
  const r = 0.018 + seeded(i, 13) * 0.045;
  const grit = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 0), gritMaterial);
  grit.position.set(x, r * 0.62 + 0.018, z);
  grit.scale.y = 0.45 + seeded(i, 14) * 0.7;
  grit.rotation.set(seeded(i, 15) * 3, seeded(i, 16) * 3, seeded(i, 17) * 3);
  grit.castShadow = true;
  scene.add(grit);
}

const wetMaterial = new THREE.MeshStandardMaterial({
  color: 0x20282b,
  roughness: 0.3,
  metalness: 0.02,
  transparent: true,
  opacity: 0.62
});

for (let i = 0; i < 13; i++) {
  const puddle = new THREE.Mesh(new THREE.CircleGeometry(0.35 + seeded(i, 21) * 0.8, 20), wetMaterial);
  puddle.rotation.x = -Math.PI / 2;
  puddle.scale.set(1.7 + seeded(i, 22) * 2.4, 0.42 + seeded(i, 23) * 0.55, 1);
  puddle.position.set(-12.5 + seeded(i, 24) * 25, 0.013, -1.1 + seeded(i, 25) * 1.45);
  puddle.rotation.z = seeded(i, 26) * Math.PI;
  scene.add(puddle);
}

const tireMaterial = new THREE.MeshStandardMaterial({
  color: 0x232729,
  roughness: 0.82,
  transparent: true,
  opacity: 0.3
});

for (const x of [-3.25, -2.55, 7.4, 8.1]) {
  const track = new THREE.Mesh(new THREE.PlaneGeometry(0.17, 8.8), tireMaterial);
  track.rotation.x = -Math.PI / 2;
  track.rotation.z = 0.035;
  track.position.set(x, 0.012, 5.35);
  scene.add(track);
}

const hemiLight = new THREE.HemisphereLight(0xeaf4fa, 0x626663, 2.05);
scene.add(hemiLight);

const sun = new THREE.DirectionalLight(0xfff3dd, 3.25);
sun.position.set(-10, 15, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -20;
sun.shadow.camera.right = 20;
sun.shadow.camera.top = 17;
sun.shadow.camera.bottom = -17;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 45;
sun.shadow.bias = -0.00025;
sun.shadow.normalBias = 0.025;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xb9d6e8, 0.7);
fill.position.set(10, 7, -12);
scene.add(fill);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
