<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Articulated Desk Lamp</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17191c; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17191c);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 10, 10000);
camera.position.set(1120, 780, 1260);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(60, 330, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
controls.minDistance = 550;
controls.maxDistance = 2800;

const matteGraphite = new THREE.MeshStandardMaterial({
  color: 0x2b2e31, roughness: 0.5, metalness: 0.78
});
const darkMetal = new THREE.MeshStandardMaterial({
  color: 0x151719, roughness: 0.35, metalness: 0.88
});
const jointMetal = new THREE.MeshStandardMaterial({
  color: 0x555a5d, roughness: 0.3, metalness: 0.9
});
const brassMetal = new THREE.MeshStandardMaterial({
  color: 0x9d7440, roughness: 0.28, metalness: 0.83
});
const shadeInside = new THREE.MeshStandardMaterial({
  color: 0xd6c6a8, roughness: 0.72, metalness: 0.05, side: THREE.BackSide
});
const cableMaterial = new THREE.MeshStandardMaterial({
  color: 0x111214, roughness: 0.65, metalness: 0.08
});

function addMesh(geometry, material, position, castShadow = true, receiveShadow = true) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(position);
  mesh.castShadow = castShadow;
  mesh.receiveShadow = receiveShadow;
  return mesh;
}

function cylinderBetween(start, end, radius, material, radialSegments = 16) {
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, length, radialSegments),
    material
  );
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function springBetween(start, end, radius, tubeRadius, turns, material) {
  const axis = new THREE.Vector3().subVectors(end, start);
  const length = axis.length();
  const axisDirection = axis.clone().normalize();
  const reference = Math.abs(axisDirection.y) < 0.92
    ? new THREE.Vector3(0, 1, 0)
    : new THREE.Vector3(1, 0, 0);
  const u = new THREE.Vector3().crossVectors(axisDirection, reference).normalize();
  const v = new THREE.Vector3().crossVectors(axisDirection, u).normalize();
  const points = [];
  const samples = turns * 28;
  for (let i = 0; i <= samples; i++) {
    const t = i / samples;
    const angle = t * turns * Math.PI * 2;
    const point = start.clone()
      .addScaledVector(axis, t)
      .addScaledVector(u, Math.cos(angle) * radius)
      .addScaledVector(v, Math.sin(angle) * radius);
    points.push(point);
  }
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = new THREE.Mesh(
    new THREE.TubeGeometry(curve, samples, tubeRadius, 7, false),
    material
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function joint(position, axisAngle = Math.PI / 2) {
  const group = new THREE.Group();
  group.position.copy(position);

  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(34, 34, 58, 32),
    jointMetal
  );
  body.rotation.z = axisAngle;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  const capLeft = new THREE.Mesh(
    new THREE.CylinderGeometry(25, 25, 3, 32),
    brassMetal
  );
  capLeft.rotation.z = axisAngle;
  capLeft.position.z = 30;
  capLeft.castShadow = true;
  group.add(capLeft);

  const capRight = capLeft.clone();
  capRight.position.z = -30;
  group.add(capRight);

  const screw = new THREE.Mesh(
    new THREE.CylinderGeometry(8, 8, 5, 20),
    darkMetal
  );
  screw.rotation.z = axisAngle;
  screw.position.z = 33;
  screw.castShadow = true;
  group.add(screw);

  return group;
}

const floor = addMesh(
  new THREE.PlaneGeometry(5000, 5000),
  new THREE.MeshStandardMaterial({ color: 0x303236, roughness: 0.88, metalness: 0.03 }),
  new THREE.Vector3(0, 0, 0),
  false,
  true
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const baseGroup = new THREE.Group();
scene.add(baseGroup);

const base = addMesh(
  new THREE.CylinderGeometry(205, 214, 50, 80),
  matteGraphite,
  new THREE.Vector3(0, 25, 0)
);
baseGroup.add(base);

const baseBevel = addMesh(
  new THREE.TorusGeometry(203, 7, 12, 80),
  darkMetal,
  new THREE.Vector3(0, 48, 0)
);
baseBevel.rotation.x = Math.PI / 2;
baseGroup.add(baseBevel);

const underside = addMesh(
  new THREE.CylinderGeometry(180, 180, 7, 64),
  darkMetal,
  new THREE.Vector3(0, 3.5, 0)
);
baseGroup.add(underside);

const swivel = addMesh(
  new THREE.CylinderGeometry(50, 58, 78, 40),
  darkMetal,
  new THREE.Vector3(0, 88, 0)
);
baseGroup.add(swivel);

const collar = addMesh(
  new THREE.CylinderGeometry(69, 69, 15, 40),
  brassMetal,
  new THREE.Vector3(0, 121, 0)
);
baseGroup.add(collar);

const pivotA = new THREE.Vector3(0, 163, 0);
baseGroup.add(joint(pivotA));

const pivotB = new THREE.Vector3(245, 473, 0);
const pivotC = new THREE.Vector3(590, 322, 0);
const shadePivot = new THREE.Vector3(688, 231, 0);

const armGroup = new THREE.Group();
scene.add(armGroup);

function armRail(start, end, offsetZ) {
  const startOffset = start.clone().add(new THREE.Vector3(0, 0, offsetZ));
  const endOffset = end.clone().add(new THREE.Vector3(0, 0, offsetZ));
  return cylinderBetween(startOffset, endOffset, 13, matteGraphite, 16);
}

const firstDirection = new THREE.Vector3().subVectors(pivotB, pivotA).normalize();
const secondDirection = new THREE.Vector3().subVectors(pivotC, pivotB).normalize();
const outerOffset = 43;

armGroup.add(armRail(pivotA.clone().addScaledVector(firstDirection, 28), pivotB.clone().addScaledVector(firstDirection, -30), outerOffset));
armGroup.add(armRail(pivotA.clone().addScaledVector(firstDirection, 28), pivotB.clone().addScaledVector(firstDirection, -30), -outerOffset));
armGroup.add(armRail(pivotB.clone().addScaledVector(secondDirection, 30), pivotC.clone().addScaledVector(secondDirection, -31), outerOffset));
armGroup.add(armRail(pivotB.clone().addScaledVector(secondDirection, 30), pivotC.clone().addScaledVector(secondDirection, -31), -outerOffset));

const braceStart1 = pivotA.clone().add(new THREE.Vector3(17, 36, 0));
const braceEnd1 = pivotB.clone().add(new THREE.Vector3(-29, -38, 0));
const braceStart2 = pivotB.clone().add(new THREE.Vector3(27, -31, 0));
const braceEnd2 = pivotC.clone().add(new THREE.Vector3(-31, 18, 0));

for (const z of [51, -51]) {
  armGroup.add(springBetween(
    braceStart1.clone().add(new THREE.Vector3(0, 0, z)),
    braceEnd1.clone().add(new THREE.Vector3(0, 0, z)),
    11, 3.4, 16, brassMetal
  ));
  armGroup.add(springBetween(
    braceStart2.clone().add(new THREE.Vector3(0, 0, z)),
    braceEnd2.clone().add(new THREE.Vector3(0, 0, z)),
    10, 3.2, 15, brassMetal
  ));
}

const crossBar1 = cylinderBetween(
  pivotA.clone().add(new THREE.Vector3(0, 0, -outerOffset)),
  pivotA.clone().add(new THREE.Vector3(0, 0, outerOffset)),
  12,
  darkMetal
);
const crossBar2 = cylinderBetween(
  pivotB.clone().add(new THREE.Vector3(0, 0, -outerOffset)),
  pivotB.clone().add(new THREE.Vector3(0, 0, outerOffset)),
  12,
  darkMetal
);
const crossBar3 = cylinderBetween(
  pivotC.clone().add(new THREE.Vector3(0, 0, -outerOffset)),
  pivotC.clone().add(new THREE.Vector3(0, 0, outerOffset)),
  12,
  darkMetal
);
armGroup.add(crossBar1, crossBar2, crossBar3);
armGroup.add(joint(pivotB), joint(pivotC));

const endStem = cylinderBetween(
  pivotC.clone().addScaledVector(new THREE.Vector3().subVectors(shadePivot, pivotC).normalize(), 24),
  shadePivot,
  19,
  matteGraphite,
  20
);
armGroup.add(endStem);
armGroup.add(joint(shadePivot));

const shadeGroup = new THREE.Group();
shadeGroup.position.copy(shadePivot);
armGroup.add(shadeGroup);

const shadeAxis = new THREE.Vector3(-0.73, -0.68, 0).normalize();
shadeGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), shadeAxis);

const shadeNeck = new THREE.Mesh(
  new THREE.CylinderGeometry(27, 27, 70, 32),
  darkMetal
);
shadeNeck.position.y = -42;
shadeNeck.castShadow = true;
shadeGroup.add(shadeNeck);

const shadeRim = new THREE.Mesh(
  new THREE.TorusGeometry(128, 6, 12, 64),
  darkMetal
);
shadeRim.rotation.x = Math.PI / 2;
shadeRim.position.y = -151;
shadeRim.castShadow = true;
shadeGroup.add(shadeRim);

const shadeShell = new THREE.Mesh(
  new THREE.ConeGeometry(130, 185, 64, 1, true),
  matteGraphite
);
shadeShell.position.y = -77;
shadeShell.castShadow = true;
shadeShell.receiveShadow = true;
shadeGroup.add(shadeShell);

const shadeLiner = new THREE.Mesh(
  new THREE.ConeGeometry(124, 178, 64, 1, true),
  shadeInside
);
shadeLiner.position.y = -78;
shadeGroup.add(shadeLiner);

const bulb = new THREE.Mesh(
  new THREE.SphereGeometry(48, 32, 20),
  new THREE.MeshStandardMaterial({
    color: 0xffc56a,
    emissive: 0xffa331,
    emissiveIntensity: 1.3,
    roughness: 0.28,
    metalness: 0.05
  })
);
bulb.position.y = -130;
bulb.castShadow = true;
shadeGroup.add(bulb);

const bulbLight = new THREE.SpotLight(0xffc36c, 4200, 1600, Math.PI / 4.2, 0.42, 1.5);
bulbLight.position.copy(shadePivot).addScaledVector(shadeAxis, 145);
bulbLight.target.position.copy(shadePivot).addScaledVector(shadeAxis, 900);
bulbLight.castShadow = true;
bulbLight.shadow.mapSize.set(1024, 1024);
bulbLight.shadow.bias = -0.0003;
scene.add(bulbLight);
scene.add(bulbLight.target);

const cablePoints = [
  new THREE.Vector3(-35, 129, -58),
  new THREE.Vector3(-72, 238, -64),
  new THREE.Vector3(30, 365, -64),
  new THREE.Vector3(222, 464, -64),
  new THREE.Vector3(446, 393, -64),
  new THREE.Vector3(584, 330, -64),
  new THREE.Vector3(647, 270, -58)
];
const cableCurve = new THREE.CatmullRomCurve3(cablePoints);
const cable = new THREE.Mesh(
  new THREE.TubeGeometry(cableCurve, 100, 4.2, 10, false),
  cableMaterial
);
cable.castShadow = true;
armGroup.add(cable);

const hemi = new THREE.HemisphereLight(0xc9d9ff, 0x19130f, 1.65);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffefd8, 3.4);
keyLight.position.set(700, 1200, 900);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -1000;
keyLight.shadow.camera.right = 1000;
keyLight.shadow.camera.top = 1000;
keyLight.shadow.camera.bottom = -1000;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x8cb7ff, 1.3);
fillLight.position.set(-850, 650, -700);
scene.add(fillLight);

const warmLight = new THREE.PointLight(0xffa960, 260, 950, 2);
warmLight.position.set(460, 590, 430);
scene.add(warmLight);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
