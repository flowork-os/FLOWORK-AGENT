<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Park Fountain</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #b8c5c0;
    }
    canvas {
      display: block;
    }
    .label {
      position: fixed;
      left: 20px;
      bottom: 18px;
      color: rgba(255,255,255,.72);
      font: 12px/1.4 system-ui, sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,.45);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Park Fountain · Weathered Stone</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb9c8c3);
    scene.fog = new THREE.Fog(0xb9c8c3, 18, 38);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(8.6, 6.2, 9.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.minDistance = 6;
    controls.maxDistance = 20;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.target.set(0, 1.55, 0);

    const stone = new THREE.MeshStandardMaterial({
      color: 0x8c9185,
      roughness: 0.86,
      metalness: 0.02,
      flatShading: true
    });

    const stoneLight = new THREE.MeshStandardMaterial({
      color: 0xa6a99b,
      roughness: 0.82,
      metalness: 0.01,
      flatShading: true
    });

    const stoneDark = new THREE.MeshStandardMaterial({
      color: 0x6f766e,
      roughness: 0.9,
      metalness: 0.01,
      flatShading: true
    });

    const stoneWarm = new THREE.MeshStandardMaterial({
      color: 0x9b9582,
      roughness: 0.88,
      metalness: 0.01,
      flatShading: true
    });

    const water = new THREE.MeshPhysicalMaterial({
      color: 0x3e9fa3,
      roughness: 0.08,
      metalness: 0.08,
      transmission: 0.08,
      transparent: true,
      opacity: 0.78,
      clearcoat: 0.8,
      clearcoatRoughness: 0.12,
      side: THREE.DoubleSide
    });

    const waterDark = new THREE.MeshPhysicalMaterial({
      color: 0x247579,
      roughness: 0.12,
      metalness: 0.06,
      transparent: true,
      opacity: 0.72,
      side: THREE.DoubleSide
    });

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x768078,
      roughness: 1,
      metalness: 0
    });

    const waterGroup = new THREE.Group();
    scene.add(waterGroup);

    function lathe(points, material, segments = 96) {
      const geometry = new THREE.LatheGeometry(
        points.map(point => new THREE.Vector2(point[0], point[1])),
        segments
      );
      geometry.computeVertexNormals();
      const mesh = new THREE.Mesh(geometry, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function torus(radius, tube, y, material, radialSegments = 12, tubularSegments = 96) {
      const mesh = new THREE.Mesh(
        new THREE.TorusGeometry(radius, tube, radialSegments, tubularSegments),
        material
      );
      mesh.position.y = y;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function cylinder(radiusTop, radiusBottom, height, y, material, segments = 64) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
        material
      );
      mesh.position.y = y;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function addWaterDisc(radius, y, material) {
      const mesh = new THREE.Mesh(new THREE.CircleGeometry(radius, 96), material);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.y = y;
      mesh.receiveShadow = true;
      waterGroup.add(mesh);
      return mesh;
    }

    function addCylinderBetween(a, b, radius, material) {
      const direction = new THREE.Vector3().subVectors(b, a);
      const length = direction.length();
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius * 0.92, length, 12),
        material
      );
      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      mesh.castShadow = true;
      waterGroup.add(mesh);
      return mesh;
    }

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(19, 96),
      new THREE.MeshStandardMaterial({ color: 0x7d887f, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.035;
    ground.receiveShadow = true;
    scene.add(ground);

    const apron = cylinder(4.55, 4.65, 0.18, 0.02, stoneDark, 96);
    scene.add(apron);

    const apronTop = cylinder(4.32, 4.38, 0.08, 0.15, stoneLight, 96);
    scene.add(apronTop);

    for (let i = 0; i < 16; i++) {
      const angle = (i / 16) * Math.PI * 2;
      const block = new THREE.Mesh(
        new THREE.BoxGeometry(1.45, 0.16, 0.62),
        i % 3 === 0 ? stoneWarm : (i % 2 === 0 ? stoneLight : stone)
      );
      block.position.set(Math.cos(angle) * 3.7, 0.28, Math.sin(angle) * 3.7);
      block.rotation.y = -angle;
      block.castShadow = true;
      block.receiveShadow = true;
      scene.add(block);
    }

    scene.add(torus(4.38, 0.075, 0.22, stoneDark, 10, 96));

    const lowerBasin = lathe([
      [0.00, 0.28],
      [1.45, 0.28],
      [2.18, 0.34],
      [2.55, 0.43],
      [2.76, 0.60],
      [2.86, 0.82],
      [2.83, 1.02],
      [2.72, 1.18],
      [2.57, 1.28],
      [2.35, 1.29],
      [2.35, 1.15],
      [2.28, 1.00],
      [2.16, 0.82],
      [1.90, 0.65],
      [1.48, 0.52],
      [0.92, 0.44],
      [0.00, 0.42]
    ], stone, 128);
    scene.add(lowerBasin);

    scene.add(torus(2.69, 0.105, 1.23, stoneLight, 14, 128));
    scene.add(torus(2.40, 0.045, 1.115, stoneDark, 10, 128));
    scene.add(torus(2.73, 0.045, 0.71, stoneDark, 10, 128));
    addWaterDisc(2.22, 1.035, water);

    const lowerWaterRing = torus(1.53, 0.018, 1.052, new THREE.MeshBasicMaterial({
      color: 0x75d3d0,
      transparent: true,
      opacity: 0.33
    }), 8, 96);
    waterGroup.add(lowerWaterRing);

    const pedestalBase = cylinder(1.36, 1.5, 0.28, 1.38, stoneDark, 64);
    scene.add(pedestalBase);
    scene.add(torus(1.26, 0.11, 1.53, stoneLight, 12, 96));

    const pedestalFoot = lathe([
      [0.0, 1.52],
      [0.72, 1.52],
      [0.88, 1.60],
      [0.92, 1.72],
      [0.82, 1.82],
      [0.62, 1.87],
      [0.0, 1.87]
    ], stoneLight, 64);
    scene.add(pedestalFoot);

    const column = lathe([
      [0.0, 1.82],
      [0.50, 1.82],
      [0.58, 1.93],
      [0.53, 2.10],
      [0.45, 2.23],
      [0.43, 2.82],
      [0.48, 2.96],
      [0.60, 3.05],
      [0.0, 3.05]
    ], stone, 64);
    scene.add(column);

    scene.add(torus(0.52, 0.07, 2.26, stoneDark, 10, 64));
    scene.add(torus(0.56, 0.08, 2.92, stoneLight, 10, 64));

    const upperBasin = lathe([
      [0.0, 2.96],
      [0.78, 2.96],
      [1.12, 3.02],
      [1.33, 3.15],
      [1.42, 3.34],
      [1.39, 3.52],
      [1.30, 3.65],
      [1.16, 3.72],
      [1.03, 3.72],
      [1.02, 3.59],
      [0.95, 3.43],
      [0.79, 3.30],
      [0.53, 3.21],
      [0.0, 3.20]
    ], stoneLight, 96);
    scene.add(upperBasin);

    scene.add(torus(1.22, 0.075, 3.68, stone, 12, 96));
    scene.add(torus(1.03, 0.035, 3.57, stoneDark, 10, 96));
    addWaterDisc(0.91, 3.455, waterDark);

    const finialStem = cylinder(0.14, 0.18, 0.42, 3.91, stoneDark, 32);
    scene.add(finialStem);

    const finial = new THREE.Mesh(
      new THREE.SphereGeometry(0.24, 24, 16),
      stoneLight
    );
    finial.position.y = 4.15;
    finial.scale.y = 0.72;
    finial.castShadow = true;
    finial.receiveShadow = true;
    scene.add(finial);

    const nozzle = cylinder(0.07, 0.11, 0.12, 4.30, stoneDark, 24);
    scene.add(nozzle);

    const jetMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x70d0d0,
      roughness: 0.05,
      transmission: 0.12,
      transparent: true,
      opacity: 0.7,
      side: THREE.DoubleSide
    });

    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2 + Math.PI / 8;
      const start = new THREE.Vector3(0, 3.59, 0);
      const end = new THREE.Vector3(Math.cos(angle) * 0.72, 3.47, Math.sin(angle) * 0.72);
      addCylinderBetween(start, end, 0.018, jetMaterial);
    }

    for (let i = 0; i < 5; i++) {
      const angle = (i / 5) * Math.PI * 2;
      const start = new THREE.Vector3(Math.cos(angle) * 0.68, 1.075, Math.sin(angle) * 0.68);
      const end = new THREE.Vector3(Math.cos(angle) * 0.68, 1.55, Math.sin(angle) * 0.68);
      addCylinderBetween(start, end, 0.022, jetMaterial);

      const drop = new THREE.Mesh(
        new THREE.SphereGeometry(0.052, 12, 8),
        jetMaterial
      );
      drop.position.copy(end);
      waterGroup.add(drop);
    }

    const waterGlow = new THREE.PointLight(0x54c8c6, 0.55, 4.5);
    waterGlow.position.set(0, 2.25, 0);
    scene.add(waterGlow);

    const hemi = new THREE.HemisphereLight(0xdce8e5, 0x4e584f, 2.0);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffe2bd, 3.2);
    sun.position.set(-7, 11, 6);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -9;
    sun.shadow.camera.right = 9;
    sun.shadow.camera.top = 9;
    sun.shadow.camera.bottom = -9;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 28;
    sun.shadow.bias = -0.0003;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x9ec9d1, 0.75);
    fill.position.set(8, 5, -6);
    scene.add(fill);

    const smallPebbles = new THREE.Group();
    for (let i = 0; i < 42; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 4.8 + Math.random() * 2.2;
      const pebble = new THREE.Mesh(
        new THREE.SphereGeometry(0.035 + Math.random() * 0.05, 8, 6),
        i % 2 === 0 ? stoneDark : stoneLight
      );
      pebble.position.set(
        Math.cos(angle) * radius,
        0.03 + Math.random() * 0.025,
        Math.sin(angle) * radius
      );
      pebble.scale.y = 0.35;
      pebble.castShadow = true;
      smallPebbles.add(pebble);
    }
    scene.add(smallPebbles);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    animate();
  </script>
</body>
</html>
