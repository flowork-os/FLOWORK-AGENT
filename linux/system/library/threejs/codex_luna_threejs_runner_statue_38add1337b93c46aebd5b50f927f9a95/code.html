<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bronze Runner Statue</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b8c8c8}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8c9c7);
scene.fog = new THREE.Fog(0xb8c9c7, 12, 28);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.3, 4.1, 4.8);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 1.55);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 3.2;
controls.maxDistance = 10;
controls.maxPolarAngle = Math.PI * 0.48;

scene.add(new THREE.HemisphereLight(0xdde9e3, 0x53624d, 2.1));

const sun = new THREE.DirectionalLight(0xfff0d2, 3.2);
sun.position.set(-4, -5, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = -7;
sun.shadow.camera.right = 7;
sun.shadow.camera.top = 7;
sun.shadow.camera.bottom = -7;
sun.shadow.bias = -0.0004;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x9bbdce, 0.8);
fill.position.set(6, 3, 5);
scene.add(fill);

const bronze = new THREE.MeshStandardMaterial({
  color: 0x76502b,
  metalness: 0.82,
  roughness: 0.27
});
const bronzeDark = new THREE.MeshStandardMaterial({
  color: 0x39291b,
  metalness: 0.8,
  roughness: 0.34
});
const stone = new THREE.MeshStandardMaterial({
  color: 0xaaa99a,
  roughness: 0.78,
  metalness: 0.03
});
const stoneTop = new THREE.MeshStandardMaterial({
  color: 0xc2c0ad,
  roughness: 0.7
});
const grass = new THREE.MeshStandardMaterial({color:0x506c4a, roughness:1});
const pathMat = new THREE.MeshStandardMaterial({color:0x8d927d, roughness:1});
const bark = new THREE.MeshStandardMaterial({color:0x463523, roughness:1});
const leaves = new THREE.MeshStandardMaterial({color:0x31583a, roughness:0.95});

function shadow(mesh, cast=true, receive=true){
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  return mesh;
}

function roundedBlock(w,d,h,material,bevel=0.06){
  const s = new THREE.Shape();
  const x=w/2, y=d/2, r=Math.min(bevel, w/2-0.01, d/2-0.01);
  s.moveTo(-x+r,-y); s.lineTo(x-r,-y);
  s.quadraticCurveTo(x,-y,x,-y+r);
  s.lineTo(x,y-r); s.quadraticCurveTo(x,y,x-r,y);
  s.lineTo(-x+r,y); s.quadraticCurveTo(-x,y,-x,y-r);
  s.lineTo(-x,-y+r); s.quadraticCurveTo(-x,-y,-x+r,-y);
  const g = new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:true,bevelSegments:3,bevelSize:r*0.65,bevelThickness:r*0.65,curveSegments:3});
  g.computeVertexNormals();
  const m=shadow(new THREE.Mesh(g,material));
  m.position.z=0;
  return m;
}

const ground = shadow(new THREE.Mesh(new THREE.PlaneGeometry(40,40),grass),false,true);
ground.rotation.x=-Math.PI/2;
ground.position.y=0;
scene.add(ground);

const path = shadow(new THREE.Mesh(new THREE.CircleGeometry(5.8,64),pathMat),false,true);
path.rotation.x=-Math.PI/2;
path.position.y=0.006;
scene.add(path);

const lawn = shadow(new THREE.Mesh(new THREE.CircleGeometry(4.9,64),grass),false,true);
lawn.rotation.x=-Math.PI/2;
lawn.position.y=0.012;
scene.add(lawn);

const plinth = roundedBlock(1.55,1.18,0.72,stone,0.09);
plinth.position.set(0,0,0.02);
scene.add(plinth);

const cap = roundedBlock(1.82,1.42,0.22,stoneTop,0.07);
cap.position.set(0,0,0.72);
scene.add(cap);

const baseTrim = roundedBlock(1.66,1.28,0.09,stone,0.025);
baseTrim.position.set(0,0,0.94);
scene.add(baseTrim);

function addLimb(a,b,r,material=bronze){
  const A=new THREE.Vector3(...a), B=new THREE.Vector3(...b);
  const dir=new THREE.Vector3().subVectors(B,A);
  const len=dir.length();
  const mesh=shadow(new THREE.Mesh(new THREE.CylinderGeometry(r*0.9,r,len,16),material));
  mesh.position.copy(A).add(B).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
  scene.add(mesh);
  return mesh;
}
function addJoint(p,r,material=bronze){
  const mesh=shadow(new THREE.Mesh(new THREE.SphereGeometry(r,20,12),material));
  mesh.position.set(...p);
  scene.add(mesh);
  return mesh;
}
function addEllipsoid(p,scale,material=bronze){
  const mesh=shadow(new THREE.Mesh(new THREE.SphereGeometry(1,28,18),material));
  mesh.position.set(...p);
  mesh.scale.set(...scale);
  scene.add(mesh);
  return mesh;
}

const z=0.99;
const hip=[0,0,1.98];
const torso=addEllipsoid([0.02,0,2.38],[0.34,0.235,0.58]);
torso.rotation.y=-0.10;
addEllipsoid([0.02,0,1.96],[0.29,0.22,0.24]);
addLimb([-0.18,0.16,2.63],[0.02,0.22,2.92],0.13);
addLimb([0.18,0.16,2.63],[0.03,-0.22,2.92],0.13);

const neck=addLimb([0,0,2.78],[0.02,0,2.91],0.105);
const head=addEllipsoid([0.04,0,3.08],[0.205,0.18,0.26]);
head.rotation.y=-0.12;
addEllipsoid([0.225,-0.005,3.085],[0.075,0.11,0.075],bronzeDark);
addEllipsoid([-0.035,0.015,3.27],[0.22,0.185,0.095],bronzeDark);

const shoulderL=[0.03,0.25,2.64], elbowL=[0.34,0.47,2.34], handL=[0.72,0.43,2.18];
const shoulderR=[0.03,-0.25,2.64], elbowR=[-0.38,-0.43,2.43], handR=[-0.73,-0.37,2.66];
for(const [a,b,c] of [[shoulderL,elbowL,handL],[shoulderR,elbowR,handR]]){
  addLimb(a,b,0.105); addLimb(b,c,0.085);
  addJoint(a,0.125); addJoint(b,0.105); addEllipsoid(c,[0.11,0.085,0.13]);
}

const kneeF=[0.39,-0.02,1.52], ankleF=[0.91,-0.03,1.08], toeF=[1.22,-0.04,1.03];
const kneeB=[-0.39,0.07,1.48], ankleB=[-0.76,0.10,1.07], toeB=[-1.04,0.10,1.03];
for(const [k,a,t] of [[kneeF,ankleF,toeF],[kneeB,ankleB,toeB]]){
  addLimb(hip,k,0.145); addLimb(k,a,0.105);
  addJoint(k,0.135); addJoint(a,0.095);
  addEllipsoid(t,[0.28,0.12,0.085]);
}
addJoint(hip,0.18);

function tree(x,y,s){
  const trunk=shadow(new THREE.Mesh(new THREE.CylinderGeometry(0.12*s,0.18*s,2.0*s,10),bark));
  trunk.position.set(x,y,1.0*s);
  scene.add(trunk);
  const crown=shadow(new THREE.Mesh(new THREE.IcosahedronGeometry(0.82*s,2),leaves));
  crown.position.set(x,y,2.15*s);
  crown.scale.y=1.18;
  scene.add(crown);
  const crown2=shadow(new THREE.Mesh(new THREE.IcosahedronGeometry(0.58*s,1),leaves));
  crown2.position.set(x+0.28*s,y-0.08*s,2.62*s);
  scene.add(crown2);
}
tree(-5.2,-2.7,1.25);
tree(5.0,-2.0,1.0);
tree(-5.1,3.7,1.05);
tree(5.2,3.6,1.18);

for(let i=0;i<10;i++){
  const a=i*Math.PI*2/10;
  const r=5.7;
  const bush=shadow(new THREE.Mesh(new THREE.IcosahedronGeometry(0.34+(i%3)*0.06,1),leaves));
  bush.position.set(Math.cos(a)*r,Math.sin(a)*r,0.27);
  bush.scale.y=0.8;
  scene.add(bush);
}

const warm = new THREE.PointLight(0xc19b65,0.45,5);
warm.position.set(1.8,-1.4,2.2);
scene.add(warm);

addLimb([0.02,-0.02,0.99],[0.02,-0.02,1.01],0.01,bronze);

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
