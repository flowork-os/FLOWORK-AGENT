<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Chrome Blob</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050608;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050608);
scene.fog = new THREE.Fog(0x050608, 7, 15);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.2, 2.7, 5.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
const environment = new RoomEnvironment(renderer);
scene.environment = pmrem.fromScene(environment, 0.04).texture;
environment.dispose();
pmrem.dispose();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 3.1;
controls.maxDistance = 9;
controls.target.set(0, 0.45, 0);

const chrome = new THREE.MeshPhysicalMaterial({
  color: 0xcbd0d4,
  metalness: 1,
  roughness: 0.075,
  envMapIntensity: 2.5,
  clearcoat: 0.5,
  clearcoatRoughness: 0.06
});

function gaussian(value, center, width) {
  const delta = value - center;
  return Math.exp(-(delta * delta) / (2 * width * width));
}

function createBlobGeometry() {
  const rings = 72;
  const segments = 128;
  const positions = [];
  const uvs = [];
  const indices = [];

  for (let iy = 0; iy <= rings; iy++) {
    const theta = (iy / rings) * Math.PI;
    const sinTheta = Math.sin(theta);
    const cosTheta = Math.cos(theta);

    for (let ix = 0; ix <= segments; ix++) {
      const phi = (ix / segments) * Math.PI * 2;
      const sinPhi = Math.sin(phi);
      const cosPhi = Math.cos(phi);

      const nx = sinTheta * cosPhi;
      const ny = cosTheta;
      const nz = sinTheta * sinPhi;

      const lobeA = 0.31 * Math.exp(5.4 * (nx * 0.82 + ny * 0.18 + nz * 0.52 - 0.86));
      const lobeB = 0.25 * Math.exp(5.7 * (-nx * 0.54 + ny * 0.15 + nz * 0.84 - 0.86));
      const lobeC = 0.22 * Math.exp(5.0 * (nx * 0.18 - ny * 0.95 + nz * 0.24 - 0.86));
      const lowerBulge = 0.17 * gaussian(theta, Math.PI * 0.69, 0.28);
      const taper = 1 - 0.13 * gaussian(theta, 0, 0.32);
      const ripple = 0.035 * Math.sin(phi * 3 + theta * 5) * sinTheta * sinTheta;
      const radius = (0.98 + lobeA + lobeB + lobeC + lowerBulge + ripple) * taper;

      const x = nx * radius * 1.34;
      const y = ny * radius * 1.08 + 0.05;
      const z = nz * radius * 1.14;

      positions.push(x, y, z);
      uvs.push(ix / segments, iy / rings);
    }
  }

  for (let iy = 0; iy < rings; iy++) {
    for (let ix = 0; ix < segments; ix++) {
      const a = iy * (segments + 1) + ix;
      const b = a + 1;
      const c = a + segments + 1;
      const d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const sculpture = new THREE.Group();
const blob = new THREE.Mesh(createBlobGeometry(), chrome);
blob.castShadow = true;
blob.receiveShadow = true;
sculpture.add(blob);

function addDroplet(position, scale, rotation) {
  const geometry = new THREE.SphereGeometry(1, 48, 32);
  const droplet = new THREE.Mesh(geometry, chrome);
  droplet.position.copy(position);
  droplet.scale.set(scale.x, scale.y, scale.z);
  droplet.rotation.set(rotation.x, rotation.y, rotation.z);
  droplet.castShadow = true;
  droplet.receiveShadow = true;
  sculpture.add(droplet);
}

addDroplet(new THREE.Vector3(0.92, 2.02, 0.08), new THREE.Vector3(0.17, 0.34, 0.17), new THREE.Vector3(0.12, 0.1, -0.18));
addDroplet(new THREE.Vector3(-0.68, 1.82, 0.22), new THREE.Vector3(0.13, 0.28, 0.13), new THREE.Vector3(-0.2, 0.18, 0.15));
addDroplet(new THREE.Vector3(1.22, 1.33, -0.18), new THREE.Vector3(0.11, 0.2, 0.11), new THREE.Vector3(0.3, 0.1, 0.2));

const neckA = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.42, 16, 32), chrome);
neckA.position.set(0.75, 1.32, 0.05);
neckA.rotation.z = -0.48;
neckA.rotation.x = 0.08;
neckA.scale.set(0.9, 1.1, 0.9);
neckA.castShadow = true;
sculpture.add(neckA);

const neckB = new THREE.Mesh(new THREE.CapsuleGeometry(0.105, 0.34, 16, 32), chrome);
neckB.position.set(-0.56, 1.25, 0.2);
neckB.rotation.z = 0.55;
neckB.rotation.y = -0.12;
neckB.castShadow = true;
sculpture.add(neckB);

sculpture.position.y = 0.12;
scene.add(sculpture);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(7, 96),
  new THREE.MeshStandardMaterial({ color: 0x101216, metalness: 0.35, roughness: 0.32 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.24;
floor.receiveShadow = true;
scene.add(floor);

const halo = new THREE.Mesh(
  new THREE.RingGeometry(1.7, 2.55, 96),
  new THREE.MeshBasicMaterial({ color: 0x1a2530, transparent: true, opacity: 0.2, side: THREE.DoubleSide })
);
halo.rotation.x = -Math.PI / 2;
halo.position.y = -1.225;
scene.add(halo);

const key = new THREE.SpotLight(0xffffff, 105, 12, Math.PI / 5.5, 0.55, 1.3);
key.position.set(-3.8, 5.2, 4.5);
key.target.position.set(0, 0.35, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.00015;
scene.add(key, key.target);

const rim = new THREE.PointLight(0x8bbcff, 34, 8, 2);
rim.position.set(3.8, 2.6, -3.5);
scene.add(rim);

const fill = new THREE.PointLight(0xffd6b0, 18, 7, 2);
fill.position.set(-3.5, 0.6, -2.5);
scene.add(fill);

const top = new THREE.DirectionalLight(0xd9e9ff, 2.2);
top.position.set(0, 6, 1);
scene.add(top);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
