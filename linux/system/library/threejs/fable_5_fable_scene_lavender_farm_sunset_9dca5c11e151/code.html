<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lavender Farm Sunset</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2a1630}
  canvas{display:block}
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================ config / palette ================================ */
const PAL = {
  skyTop:    '#33234f', skyMid: '#8a4a7d', skyLow: '#e2637a', skyHorizon: '#ff9a4a',
  fog:       0xdd8a66,
  sun:       0xffb347,  sunCore: 0xffe0a0,
  ground:    '#7a5f49', furrow: '#5e4636',
  stoneA:    '#c9b8a0', stoneB: '#a89478',  mortar: '#8f8070',
  roofA:     '#b4643c', roofB: '#8f4a2c',
  shutter:   0x3a6ea5, door: 0x2f5d8a,
  lavender:  [0x8a5fc8, 0x9b6fd8, 0x7a4fb8, 0xa87fe0],
  stem:      0x5c7a48,
  cypress:   0x2b4632, trunk: 0x5a4432,
  straw:     '#d8b258', strawDark: '#a8823a',
  rust:      0x9a4f28,
  hill:      0x6f4a72, hillFar: 0x5a3c66,
  path:      0xb08a5e,
  hive:      [0xe8e2d2, 0xa8c0d8, 0xd8c8a0]
};
const SEED = 91517;

/* ================================ prng / helpers ================================ */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(SEED);
const rand  = (lo, hi) => lo + rng() * (hi - lo);
const pick  = (arr) => arr[Math.floor(rng() * arr.length)];

function tubeBetween(a, b, r, mat){
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, 8), mat);
  mesh.position.copy(a).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return mesh;
}

/* ================================ canvas textures ================================ */
function makeCanvas(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}
function toTex(c, rx = 1, ry = 1){
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  return t;
}
function stoneTexture(){
  const [c, g] = makeCanvas(256, 256);
  g.fillStyle = PAL.mortar; g.fillRect(0, 0, 256, 256);
  for (let y = 0; y < 8; y++){
    const off = (y % 2) * 18;
    for (let x = -1; x < 8; x++){
      g.fillStyle = rng() < 0.5 ? PAL.stoneA : PAL.stoneB;
      g.fillRect(x * 36 + off + 2, y * 32 + 2, 32 - rand(0, 6), 28 - rand(0, 5));
    }
  }
  for (let i = 0; i < 500; i++){
    g.fillStyle = `rgba(60,45,30,${rand(0.04, 0.14)})`;
    g.fillRect(rand(0, 256), rand(0, 256), rand(1, 3), rand(1, 3));
  }
  return c;
}
function roofTexture(){
  const [c, g] = makeCanvas(256, 256);
  g.fillStyle = PAL.roofB; g.fillRect(0, 0, 256, 256);
  for (let y = 0; y < 8; y++){
    for (let x = 0; x < 8; x++){
      g.fillStyle = rng() < 0.6 ? PAL.roofA : PAL.roofB;
      g.beginPath();
      g.arc(x * 32 + 16 + (y % 2) * 16, y * 32 + 16, 15, 0, Math.PI, true);
      g.fill();
    }
  }
  return c;
}
function groundTexture(){
  const [c, g] = makeCanvas(512, 512);
  g.fillStyle = PAL.ground; g.fillRect(0, 0, 512, 512);
  for (let x = 0; x < 512; x += 40){
    g.fillStyle = PAL.furrow;
    g.fillRect(x + 12, 0, 14, 512);
  }
  for (let i = 0; i < 2200; i++){
    g.fillStyle = rng() < 0.5 ? `rgba(50,36,26,${rand(0.05, 0.2)})` : `rgba(200,170,120,${rand(0.04, 0.12)})`;
    g.fillRect(rand(0, 512), rand(0, 512), rand(1, 4), rand(1, 4));
  }
  return c;
}
function strawTexture(){
  const [c, g] = makeCanvas(256, 256);
  g.fillStyle = PAL.straw; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 350; i++){
    g.strokeStyle = rng() < 0.5 ? PAL.strawDark : '#eecb78';
    g.lineWidth = rand(1, 2.4);
    const y = rand(0, 256);
    g.beginPath(); g.moveTo(0, y); g.lineTo(256, y + rand(-14, 14)); g.stroke();
  }
  return c;
}
function skyTexture(){
  const [c, g] = makeCanvas(64, 512);
  const grad = g.createLinearGradient(0, 0, 0, 512);
  grad.addColorStop(0.0, PAL.skyTop);
  grad.addColorStop(0.42, PAL.skyMid);
  grad.addColorStop(0.62, PAL.skyLow);
  grad.addColorStop(0.78, PAL.skyHorizon);
  grad.addColorStop(1.0, '#ffb066');
  g.fillStyle = grad; g.fillRect(0, 0, 64, 512);
  return c;
}
function glowTexture(){
  const [c, g] = makeCanvas(256, 256);
  const grad = g.createRadialGradient(128, 128, 8, 128, 128, 128);
  grad.addColorStop(0, 'rgba(255,220,160,0.95)');
  grad.addColorStop(0.35, 'rgba(255,160,80,0.5)');
  grad.addColorStop(1, 'rgba(255,120,60,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
  return c;
}

/* ================================ materials ================================ */
const MAT = {
  stone:   new THREE.MeshStandardMaterial({ map: toTex(stoneTexture(), 2, 1), roughness: 0.95 }),
  stoneMill:new THREE.MeshStandardMaterial({ map: toTex(stoneTexture(), 3, 2), roughness: 0.95 }),
  roof:    new THREE.MeshStandardMaterial({ map: toTex(roofTexture(), 3, 1.5), roughness: 0.85 }),
  ground:  new THREE.MeshStandardMaterial({ map: toTex(groundTexture(), 16, 16), roughness: 1 }),
  straw:   new THREE.MeshStandardMaterial({ map: toTex(strawTexture(), 1.6, 1), roughness: 0.9 }),
  wood:    new THREE.MeshStandardMaterial({ color: 0x8a6a48, roughness: 0.9 }),
  darkWood:new THREE.MeshStandardMaterial({ color: 0x5f4630, roughness: 0.9 }),
  shutter: new THREE.MeshStandardMaterial({ color: PAL.shutter, roughness: 0.7 }),
  door:    new THREE.MeshStandardMaterial({ color: PAL.door, roughness: 0.7 }),
  glass:   new THREE.MeshStandardMaterial({ color: 0x2a2438, emissive: 0xffa050, emissiveIntensity: 0.9, roughness: 0.4 }),
  stem:    new THREE.MeshStandardMaterial({ color: PAL.stem, roughness: 0.95 }),
  bloom:   new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.85 }),
  cypress: new THREE.MeshStandardMaterial({ color: PAL.cypress, roughness: 0.95 }),
  trunk:   new THREE.MeshStandardMaterial({ color: PAL.trunk, roughness: 0.95 }),
  rust:    new THREE.MeshStandardMaterial({ color: PAL.rust, roughness: 0.72, metalness: 0.45 }),
  rustDark:new THREE.MeshStandardMaterial({ color: 0x6a3420, roughness: 0.8, metalness: 0.4 }),
  hill:    new THREE.MeshStandardMaterial({ color: PAL.hill, roughness: 1 }),
  hillFar: new THREE.MeshStandardMaterial({ color: PAL.hillFar, roughness: 1 }),
  path:    new THREE.MeshStandardMaterial({ color: PAL.path, roughness: 1 }),
  sun:     new THREE.MeshBasicMaterial({ color: PAL.sunCore, fog: false })
};

/* ================================ renderer / scene / camera ================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(PAL.fog, 130, 430);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 900);
camera.position.set(42, 24, 61);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, -4);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 34;
controls.maxDistance = 120;
controls.maxPolarAngle = 1.42;

/* ================================ sky, sun & terrain ================================ */
function buildSky(){
  const g = new THREE.Group();
  const dome = new THREE.Mesh(
    new THREE.SphereGeometry(360, 32, 20),
    new THREE.MeshBasicMaterial({ map: toTex(skyTexture()), side: THREE.BackSide, fog: false })
  );
  g.add(dome);
  const sun = new THREE.Mesh(new THREE.CircleGeometry(26, 48), MAT.sun);
  sun.position.set(0, 15, -252);
  g.add(sun);
  const halo = new THREE.Mesh(
    new THREE.CircleGeometry(34, 48),
    new THREE.MeshBasicMaterial({ color: PAL.sun, transparent: true, opacity: 0.4, fog: false })
  );
  halo.position.set(0, 15, -256);
  halo.renderOrder = 1;
  g.add(halo);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: toTex(glowTexture()), color: 0xffc080, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, fog: false
  }));
  glow.scale.setScalar(150);
  glow.position.set(0, 15, -246);
  glow.renderOrder = 2;
  g.add(glow);
  g.userData = { glow, halo };
  return g;
}
function buildTerrain(){
  const g = new THREE.Group();
  const ground = new THREE.Mesh(new THREE.CircleGeometry(280, 64), MAT.ground);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  g.add(ground);
  // dirt lane converging toward the farmhouse
  const shape = new THREE.Shape();
  shape.moveTo(-4.6, 52); shape.lineTo(4.6, 52); shape.lineTo(1.6, -33); shape.lineTo(-1.6, -33);
  const path = new THREE.Mesh(new THREE.ShapeGeometry(shape), MAT.path);
  path.rotation.x = -Math.PI / 2;
  path.position.y = 0.06;
  path.receiveShadow = true;
  g.add(path);
  // rolling hill silhouettes ringing the horizon (the sun sinks behind the back ones)
  const hillGeo = new THREE.SphereGeometry(1, 24, 16);
  const defs = [
    [0, -190, 90, 26, MAT.hill], [-95, -175, 70, 20, MAT.hill], [95, -178, 76, 22, MAT.hill],
    [-180, -90, 85, 24, MAT.hillFar], [180, -85, 80, 21, MAT.hillFar],
    [-200, 60, 95, 26, MAT.hillFar], [205, 70, 88, 23, MAT.hillFar],
    [-90, 195, 90, 24, MAT.hill], [95, 190, 85, 22, MAT.hill], [5, 215, 100, 27, MAT.hillFar]
  ];
  for (const [x, z, r, h, m] of defs){
    const hill = new THREE.Mesh(hillGeo, m);
    hill.scale.set(r, h, r * 0.8);
    hill.position.set(x, -3, z);
    g.add(hill);
  }
  return g;
}

/* ================================ builder: farmhouse ================================ */
function buildFarmhouse(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(17, 8.4, 10.5), MAT.stone);
  body.position.y = 4.2;
  body.castShadow = body.receiveShadow = true;
  g.add(body);
  // gabled terracotta roof + stone gable triangles
  const roofL = new THREE.Mesh(new THREE.BoxGeometry(18.6, 0.5, 7.4), MAT.roof);
  roofL.position.set(0, 10.1, -2.85); roofL.rotation.x = 0.46; roofL.castShadow = true;
  const roofR = roofL.clone(); roofR.position.z = 2.85; roofR.rotation.x = -0.46;
  g.add(roofL, roofR);
  const gShape = new THREE.Shape();
  gShape.moveTo(-5.25, 0); gShape.lineTo(5.25, 0); gShape.lineTo(0, 3.2);
  for (const sx of [-8.5, 8.5]){
    const gable = new THREE.Mesh(new THREE.ShapeGeometry(gShape), MAT.stone);
    gable.position.set(sx, 8.4, 0); gable.rotation.y = -Math.PI / 2;
    g.add(gable);
  }
  const chimney = new THREE.Mesh(new THREE.BoxGeometry(1.4, 3.4, 1.4), MAT.stone);
  chimney.position.set(5.4, 11, 0); chimney.castShadow = true;
  g.add(chimney);
  // windows with provencal blue shutters on both long faces
  const winGeo = new THREE.BoxGeometry(1.5, 2, 0.15);
  const shGeo = new THREE.BoxGeometry(0.72, 2, 0.1);
  function addWindow(x, y, z, ry){
    const w = new THREE.Group();
    const pane = new THREE.Mesh(winGeo, MAT.glass);
    const s1 = new THREE.Mesh(shGeo, MAT.shutter); s1.position.set(-1.18, 0, 0.03);
    const s2 = new THREE.Mesh(shGeo, MAT.shutter); s2.position.set(1.18, 0, 0.03);
    const sill = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.18, 0.3), MAT.wood);
    sill.position.y = -1.1;
    w.add(pane, s1, s2, sill);
    w.position.set(x, y, z); w.rotation.y = ry;
    g.add(w);
  }
  for (const x of [-5.6, -2.2, 2.2, 5.6]) addWindow(x, 6.2, 5.28, 0);
  for (const x of [-4.4, 0, 4.4]) addWindow(x, 5.6, -5.28, Math.PI);
  addWindow(-4.2, 3.2, 5.28, 0); addWindow(4.2, 3.2, 5.28, 0);
  // arched blue door with stone lintel and lavender pots
  const door = new THREE.Mesh(new THREE.BoxGeometry(2, 3.4, 0.2), MAT.door);
  door.position.set(0, 1.7, 5.3);
  const lintel = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.5, 0.4), MAT.wood);
  lintel.position.set(0, 3.6, 5.3);
  g.add(door, lintel);
  for (const px of [-1.9, 1.9]){
    const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.3, 0.62, 10), MAT.roof);
    pot.position.set(px, 0.31, 5.7); pot.castShadow = true;
    const tuft = new THREE.Mesh(new THREE.SphereGeometry(0.42, 10, 8), MAT.cypress);
    tuft.position.set(px, 0.85, 5.7);
    const bud = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 6),
      new THREE.MeshStandardMaterial({ color: pick(PAL.lavender), roughness: 0.85 }));
    bud.position.set(px, 1.2, 5.7);
    g.add(pot, tuft, bud);
  }
  return g;
}

/* ================================ builder: windmill ================================ */
function buildWindmill(){
  const g = new THREE.Group();
  const tower = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 3.5, 11, 12), MAT.stoneMill);
  tower.position.y = 5.5;
  tower.castShadow = tower.receiveShadow = true;
  g.add(tower);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(3, 2.8, 12), MAT.darkWood);
  cap.position.y = 12.4; cap.castShadow = true;
  g.add(cap);
  const doorM = new THREE.Mesh(new THREE.BoxGeometry(1.3, 2.2, 0.2), MAT.darkWood);
  doorM.position.set(0, 1.1, 3.1); doorM.rotation.x = -0.09;
  g.add(doorM);
  const winM = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.2), MAT.glass);
  winM.position.set(0, 7.5, 2.75); winM.rotation.x = 0.09;
  g.add(winM);
  // rotating four-sail assembly on a stub axle
  const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 2.2, 8), MAT.darkWood);
  axle.rotation.x = Math.PI / 2; axle.position.set(0, 11.4, 3);
  g.add(axle);
  const blades = new THREE.Group();
  blades.position.set(0, 11.4, 4.1);
  const hub = new THREE.Mesh(new THREE.SphereGeometry(0.55, 10, 8), MAT.darkWood);
  blades.add(hub);
  for (let i = 0; i < 4; i++){
    const arm = new THREE.Group();
    arm.rotation.z = i * Math.PI / 2;
    const spar = new THREE.Mesh(new THREE.BoxGeometry(0.22, 6.4, 0.22), MAT.darkWood);
    spar.position.y = 3.2; spar.castShadow = true;
    const sail = new THREE.Mesh(new THREE.BoxGeometry(1.5, 5.2, 0.08), MAT.straw);
    sail.position.set(0.78, 3.6, 0); sail.castShadow = true;
    arm.add(spar, sail);
    blades.add(arm);
  }
  g.add(blades);
  g.userData.blades = blades;
  return g;
}

/* ================================ builder: beehive & hay bale ================================ */
function buildBeehive(){
  const g = new THREE.Group();
  const n = 2 + Math.floor(rng() * 2);
  let y = 0.14;
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.24, 1.6), MAT.darkWood);
  base.position.y = y; g.add(base);
  y += 0.12;
  for (let i = 0; i < n; i++){
    const h = 0.62;
    const box = new THREE.Mesh(new THREE.BoxGeometry(1.7, h, 1.4),
      new THREE.MeshStandardMaterial({ color: pick(PAL.hive), roughness: 0.85 }));
    box.position.y = y + h / 2;
    box.castShadow = box.receiveShadow = true;
    g.add(box);
    y += h + 0.03;
  }
  const lid = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.16, 1.65), MAT.darkWood);
  lid.position.y = y + 0.08; lid.castShadow = true;
  g.add(lid);
  const slot = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.1, 0.06), new THREE.MeshBasicMaterial({ color: 0x1a1008 }));
  slot.position.set(0, 0.42, 0.71);
  g.add(slot);
  return g;
}
function buildHayBale(){
  const g = new THREE.Group();
  const bale = new THREE.Mesh(new THREE.CylinderGeometry(1.55, 1.55, 2.5, 18), MAT.straw);
  bale.rotation.z = Math.PI / 2;
  bale.position.y = 1.55;
  bale.castShadow = bale.receiveShadow = true;
  g.add(bale);
  const band1 = new THREE.Mesh(new THREE.TorusGeometry(1.58, 0.045, 6, 24), MAT.darkWood);
  band1.rotation.y = Math.PI / 2; band1.position.set(-0.6, 1.55, 0);
  const band2 = band1.clone(); band2.position.x = 0.6;
  g.add(band1, band2);
  return g;
}

/* ================================ builder: fence & rusty bicycle ================================ */
function buildFence(len){
  const g = new THREE.Group();
  const posts = Math.round(len / 2.8) + 1;
  for (let i = 0; i < posts; i++){
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.7, 0.22), MAT.darkWood);
    post.position.set(-len / 2 + i * (len / (posts - 1)), 0.85, 0);
    post.rotation.z = rand(-0.04, 0.04);
    post.castShadow = true;
    g.add(post);
  }
  for (const ry of [1.35, 0.75]){
    const rail = new THREE.Mesh(new THREE.BoxGeometry(len + 0.4, 0.14, 0.1), MAT.wood);
    rail.position.y = ry; rail.castShadow = true;
    g.add(rail);
  }
  return g;
}
function buildBicycle(){
  const g = new THREE.Group();
  const wheelGeo = new THREE.TorusGeometry(1.02, 0.07, 8, 28);
  const R = new THREE.Vector3(-1.05, 1.02, 0), F = new THREE.Vector3(1.08, 1.02, 0);
  const S = new THREE.Vector3(-0.42, 2.18, 0), H = new THREE.Vector3(0.72, 2.12, 0);
  const C = new THREE.Vector3(0.02, 0.98, 0);
  for (const hubPos of [R, F]){
    const wheel = new THREE.Mesh(wheelGeo, MAT.rustDark);
    wheel.position.copy(hubPos); wheel.castShadow = true;
    g.add(wheel);
    for (let s = 0; s < 6; s++){
      const a = s * Math.PI / 3;
      const spoke = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 1.95, 5), MAT.rust);
      spoke.position.copy(hubPos); spoke.rotation.z = a;
      g.add(spoke);
    }
  }
  for (const [a, b] of [[R, S], [R, C], [C, S], [S, H], [C, H], [H, F]]){
    const t = tubeBetween(a, b, 0.055, MAT.rust);
    t.castShadow = true;
    g.add(t);
  }
  const stem = tubeBetween(H, new THREE.Vector3(0.66, 2.5, 0), 0.05, MAT.rust);
  const bars = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 1.15, 8), MAT.rust);
  bars.rotation.x = Math.PI / 2; bars.position.set(0.66, 2.5, 0);
  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.26), MAT.rustDark);
  seat.position.set(-0.44, 2.32, 0);
  const basket = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.5), MAT.wood);
  basket.position.set(1.05, 2.1, 0); basket.castShadow = true;
  g.add(stem, bars, seat, basket);
  return g;
}

/* ================================ builder: cypress ================================ */
function buildCypress(){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.26, 1.2, 7), MAT.trunk);
  trunk.position.y = 0.6; trunk.castShadow = true;
  g.add(trunk);
  const tiers = [[1.15, 3.4, 2.5], [0.88, 3.2, 4.9], [0.55, 2.6, 7.0]];
  for (const [r, h, y] of tiers){
    const cone = new THREE.Mesh(new THREE.ConeGeometry(r, h, 9), MAT.cypress);
    cone.position.y = y;
    cone.castShadow = true;
    g.add(cone);
  }
  const s = rand(0.85, 1.25);
  g.scale.set(s, s * rand(0.95, 1.3), s);
  g.rotation.y = rand(0, Math.PI * 2);
  return g;
}

/* ================================ builder: lavender rows ================================ */
const lavenderRows = [];
function buildLavenderRow(length, clumps){
  const row = new THREE.Group();
  const stemGeo = new THREE.ConeGeometry(0.55, 1.0, 7);
  const bloomGeo = new THREE.CapsuleGeometry(0.3, 0.7, 3, 8);
  const stems = new THREE.InstancedMesh(stemGeo, MAT.stem, clumps);
  const blooms = new THREE.InstancedMesh(bloomGeo, MAT.bloom, clumps);
  stems.castShadow = stems.receiveShadow = true;
  blooms.castShadow = true;
  const dummy = new THREE.Object3D();
  const col = new THREE.Color();
  for (let i = 0; i < clumps; i++){
    const z = -length / 2 + (i / (clumps - 1)) * length + rand(-0.35, 0.35);
    const x = rand(-0.3, 0.3);
    const s = rand(0.8, 1.25);
    dummy.position.set(x, 0.5 * s, z);
    dummy.scale.set(s, s, s);
    dummy.rotation.y = rand(0, Math.PI);
    dummy.updateMatrix();
    stems.setMatrixAt(i, dummy.matrix);
    dummy.position.y = (0.95 + 0.35) * s;
    dummy.updateMatrix();
    blooms.setMatrixAt(i, dummy.matrix);
    blooms.setColorAt(i, col.setHex(pick(PAL.lavender)));
  }
  row.add(stems, blooms);
  row.userData.phase = rand(0, Math.PI * 2);
  lavenderRows.push(row);
  return row;
}

/* ================================ builder: butterflies ================================ */
const butterflies = [];
function buildButterflies(count){
  const g = new THREE.Group();
  const wingShape = new THREE.Shape();
  wingShape.moveTo(0, 0);
  wingShape.quadraticCurveTo(0.5, 0.42, 0.6, 0.1);
  wingShape.quadraticCurveTo(0.52, -0.22, 0, -0.06);
  const wingGeoR = new THREE.ShapeGeometry(wingShape);
  wingGeoR.rotateX(-Math.PI / 2);
  const wingGeoL = wingGeoR.clone(); wingGeoL.scale(-1, 1, 1);
  const colors = [0xfff4d8, 0xffd867, 0xff9a5e, 0xf2f2f2];
  for (let i = 0; i < count; i++){
    const b = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({
      color: colors[i % colors.length], emissive: colors[i % colors.length],
      emissiveIntensity: 0.4, side: THREE.DoubleSide, roughness: 0.7
    });
    const wr = new THREE.Mesh(wingGeoR, mat);
    const wl = new THREE.Mesh(wingGeoL, mat);
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.05, 0.3, 3, 6),
      new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.8 }));
    body.rotation.x = Math.PI / 2;
    b.add(wr, wl, body);
    b.userData = {
      wr, wl,
      cx: rand(-28, 28), cz: rand(-16, 40),
      rx: rand(3, 9), rz: rand(3, 8),
      h: rand(2.4, 4.6), speed: rand(0.25, 0.5), phase: rand(0, Math.PI * 2)
    };
    butterflies.push(b);
    g.add(b);
  }
  return g;
}

/* ================================ assembly / layout ================================ */
const sky = buildSky();
scene.add(sky);
scene.add(buildTerrain());

const farmhouse = buildFarmhouse();
farmhouse.position.set(0, 0, -39);
scene.add(farmhouse);

const windmill = buildWindmill();
windmill.position.set(-27, 0, -30);
windmill.rotation.y = 0.55;
scene.add(windmill);

// long purple rows converging toward the farmhouse
for (let i = 0; i < 12; i++){
  const x = -26.4 + i * 4.8;
  if (Math.abs(x) < 5.4) continue;             // keep the central lane clear
  const row = buildLavenderRow(72, 36);
  row.position.set(x, 0, 12);
  scene.add(row);
}
for (const x of [-2.7, 2.7]){                  // short rows flanking the lane mouth
  const row = buildLavenderRow(22, 12);
  row.position.set(x, 0, 40);
  scene.add(row);
}

// cypress sentinels along the drive and behind the farmhouse
const cypresses = [];
const cypressSpots = [[-9, -44], [9, -44], [-14, -37], [14, -37], [-6.5, 46], [6.5, 46], [30, -18], [31.5, 6], [-33, 16]];
for (const [x, z] of cypressSpots){
  const c = buildCypress();
  c.position.set(x + rand(-0.6, 0.6), 0, z + rand(-0.6, 0.6));
  cypresses.push(c);
  scene.add(c);
}

// beehive boxes in a sunny clearing on the right
for (let i = 0; i < 4; i++){
  const hive = buildBeehive();
  hive.position.set(24 + rand(-1, 1) + i * 2.6, 0, 26 + rand(-2.2, 2.2));
  hive.rotation.y = rand(-0.4, 0.4);
  scene.add(hive);
}

// round hay bales on the mowed strip along the left field edge
const baleSpots = [[-31.5, -9], [-33.2, -1], [-30.5, 7.5]];
for (const [bx, bz] of baleSpots){
  const bale = buildHayBale();
  bale.position.set(bx + rand(-0.5, 0.5), 0, bz + rand(-0.8, 0.8));
  bale.rotation.y = rand(0, Math.PI);
  scene.add(bale);
}

// fence along the front with the rusty bicycle leaning on it
const fence = buildFence(22);
fence.position.set(16, 0, 39.5);
fence.rotation.y = -0.12;
scene.add(fence);
const bicycle = buildBicycle();
bicycle.position.set(13.5, 0.06, 38.4);
bicycle.rotation.set(0, -0.12 + Math.PI / 2, 0);
bicycle.rotateOnAxis(new THREE.Vector3(0, 0, 1), -0.16);
scene.add(bicycle);

scene.add(buildButterflies(9));

/* ================================ lighting rig ================================ */
const sunLight = new THREE.DirectionalLight(0xffa050, 2.6);
sunLight.position.set(4, 34, -120);
sunLight.target.position.set(0, 0, 10);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = -70; sunLight.shadow.camera.right = 70;
sunLight.shadow.camera.top = 70; sunLight.shadow.camera.bottom = -70;
sunLight.shadow.camera.near = 20; sunLight.shadow.camera.far = 260;
sunLight.shadow.bias = -0.0006;
sunLight.shadow.normalBias = 0.6;
scene.add(sunLight, sunLight.target);

const hemi = new THREE.HemisphereLight(0xffb98a, 0x5a3c66, 0.55);
scene.add(hemi);

const bounce = new THREE.DirectionalLight(0x9a6fd8, 0.35);   // violet fill from the field
bounce.position.set(30, 20, 60);
scene.add(bounce);

const porch = new THREE.PointLight(0xffb060, 14, 26, 2);      // warm glow by the farmhouse door
porch.position.set(0, 3.4, -32.5);
scene.add(porch);

/* ================================ animation loop ================================ */
const clock = new THREE.Clock();
const glowSprite = sky.userData.glow;
const halo = sky.userData.halo;

function animate(){
  const t = clock.getElapsedTime();
  // 1) lavender rows sway in the evening breeze
  for (const row of lavenderRows){
    row.rotation.z = Math.sin(t * 0.85 + row.userData.phase) * 0.045;
  }
  // 2) windmill sails turn lazily
  windmill.userData.blades.rotation.z = t * 0.5;
  // 3) butterflies flutter and drift over the blooms
  for (const b of butterflies){
    const d = b.userData;
    const px = d.cx + Math.cos(t * d.speed + d.phase) * d.rx;
    const pz = d.cz + Math.sin(t * d.speed * 0.85 + d.phase) * d.rz;
    b.position.set(px, d.h + Math.sin(t * 2.2 + d.phase) * 0.4, pz);
    b.rotation.y = -Math.atan2(
      Math.cos(t * d.speed * 0.85 + d.phase) * d.rz * 0.85,
      -Math.sin(t * d.speed + d.phase) * d.rx
    ) + Math.PI / 2;
    const flap = Math.sin(t * 13 + d.phase) * 0.85;
    d.wr.rotation.z = flap;
    d.wl.rotation.z = -flap;
  }
  // 4) sun glow breathes softly
  glowSprite.material.opacity = 0.82 + Math.sin(t * 0.6) * 0.1;
  halo.material.opacity = 0.38 + Math.sin(t * 0.6 + 1) * 0.06;
  // 5) cypresses lean gently with the wind
  for (let i = 0; i < cypresses.length; i++){
    cypresses[i].rotation.x = Math.sin(t * 0.7 + i * 1.7) * 0.02;
  }
  controls.update();
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

/* ================================ resize ================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
