<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faceted Owl — Low-Poly Stone Sculpture</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #131417; }
  #app { position: fixed; inset: 0; }
  #hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: rgba(220,222,228,0.35); letter-spacing: .12em; text-transform: uppercase;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hint">drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------------------------------------------------------------------
   Renderer
--------------------------------------------------------------------------- */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

/* ---------------------------------------------------------------------------
   Scene & Camera
--------------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x131417);
scene.fog = new THREE.Fog(0x131417, 13, 34);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3.4, 2.4, 6.0);

/* ---------------------------------------------------------------------------
   Lighting — hemisphere ambient + key/fill/rim
--------------------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0x9aa3ad, 0x2a2723, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff6ea, 2.3);
key.position.set(4.5, 7.5, 5.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 26;
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 6.5;
key.shadow.camera.bottom = -2;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key);
key.target.position.set(0, 1.35, 0);
scene.add(key.target);

const fill = new THREE.DirectionalLight(0x9fb4d0, 0.55);
fill.position.set(-5.5, 3.0, 3.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xdfe6ff, 1.25);
rim.position.set(-3.5, 5.5, -6.0);
scene.add(rim);

/* ---------------------------------------------------------------------------
   Ground — receives shadows only
--------------------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.36 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------------
   Helpers — seeded jitter for a hand-carved faceted look
--------------------------------------------------------------------------- */
function seededRandom(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return () => (s = (s * 16807) % 2147483647) / 2147483647;
}

// Jitter vertices by hashed position so shared verts move together (no cracks).
function facetJitter(geo, amount, seed) {
  const pos = geo.attributes.position;
  const rnd = seededRandom(seed);
  const cache = new Map();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const k = x.toFixed(3) + '|' + y.toFixed(3) + '|' + z.toFixed(3);
    let off = cache.get(k);
    if (!off) {
      off = [(rnd() - 0.5) * 2 * amount, (rnd() - 0.5) * 2 * amount, (rnd() - 0.5) * 2 * amount];
      cache.set(k, off);
    }
    pos.setXYZ(i, x + off[0], y + off[1], z + off[2]);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

// Flatten the base so the sculpture sits solidly.
function flattenBottom(geo, yLimit) {
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    if (pos.getY(i) < yLimit) pos.setY(i, yLimit);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

/* ---------------------------------------------------------------------------
   Materials — matte stone-grey planes, flat faceted shading
--------------------------------------------------------------------------- */
const mkStone = (color, rough = 0.92, metal = 0.0) =>
  new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, flatShading: true });

const matBody   = mkStone(0x8f8d88);
const matHead   = mkStone(0x969490);
const matWing   = mkStone(0x7a7873);
const matBrow   = mkStone(0x6f6d68);
const matTuft   = mkStone(0x8a8883);
const matFoot   = mkStone(0x6e6c67);
const matBeak   = mkStone(0x565049, 0.75);
const matSocket = mkStone(0xaeaca6, 0.95);
const matGem    = new THREE.MeshStandardMaterial({ color: 0x26272b, roughness: 0.35, metalness: 0.25, flatShading: true });
const matGlint  = new THREE.MeshStandardMaterial({ color: 0xf3f1ec, roughness: 0.4, metalness: 0.0, flatShading: true });

/* ---------------------------------------------------------------------------
   Build the ONE owl — a single centered Group
--------------------------------------------------------------------------- */
const owl = new THREE.Group();

function add(geo, mat, pos, rot, scale, cast = true) {
  const m = new THREE.Mesh(geo, mat);
  if (pos) m.position.set(pos[0], pos[1], pos[2]);
  if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
  if (scale) { Array.isArray(scale) ? m.scale.set(scale[0], scale[1], scale[2]) : m.scale.setScalar(scale); }
  m.castShadow = cast;
  m.receiveShadow = true;
  owl.add(m);
  return m;
}

/* Body — chunky faceted teardrop, flat base */
const bodyGeo = new THREE.IcosahedronGeometry(1.05, 1);
bodyGeo.scale(1.12, 1.25, 0.9);
facetJitter(bodyGeo, 0.075, 11);
flattenBottom(bodyGeo, -1.02);
add(bodyGeo, matBody, [0, 1.32, 0]);

/* Head — big faceted dome, overlapping body */
const headGeo = new THREE.IcosahedronGeometry(0.92, 1);
headGeo.scale(1.1, 1.0, 0.98);
facetJitter(headGeo, 0.06, 27);
add(headGeo, matHead, [0, 2.42, 0.02]);

/* Wings — flattened angular plates folded to the sides */
for (const s of [-1, 1]) {
  const wingGeo = new THREE.IcosahedronGeometry(0.6, 1);
  wingGeo.scale(0.34, 1.2, 0.72);
  facetJitter(wingGeo, 0.05, 41 + (s > 0 ? 3 : 0));
  add(wingGeo, matWing, [s * 0.98, 1.28, 0.12], [0.05, s * -0.28, s * 0.16]);
}

/* Ear tufts — sharp faceted horns on top of the head */
for (const s of [-1, 1]) {
  const tuftGeo = new THREE.ConeGeometry(0.16, 0.62, 4);
  facetJitter(tuftGeo, 0.02, 63 + (s > 0 ? 5 : 0));
  add(tuftGeo, matTuft, [s * 0.42, 3.02, -0.06], [-0.16, Math.PI / 4, s * 0.34]);
}

/* Brow ridges — angular "eyebrows" for a stern owl profile */
for (const s of [-1, 1]) {
  const browGeo = new THREE.IcosahedronGeometry(0.34, 0);
  browGeo.scale(1.7, 0.42, 0.5);
  facetJitter(browGeo, 0.02, 77 + (s > 0 ? 2 : 0));
  add(browGeo, matBrow, [s * 0.36, 2.66, 0.6], [-0.32, 0, s * 0.42]);
}

/* Big geometric eyes — faceted socket disc + hexagonal gem + glint */
for (const s of [-1, 1]) {
  const ex = s * 0.37, ey = 2.38;
  // socket (octagonal disc facing forward)
  add(new THREE.CylinderGeometry(0.3, 0.34, 0.14, 8), matSocket, [ex, ey, 0.7], [Math.PI / 2, 0, 0]);
  // gem eye (hexagonal pyramid poking forward)
  add(new THREE.ConeGeometry(0.21, 0.2, 6), matGem, [ex, ey, 0.78], [Math.PI / 2, 0, 0]);
  // catch-light
  add(new THREE.IcosahedronGeometry(0.04, 0), matGlint, [ex - 0.07, ey + 0.07, 0.92], null, 1, false);
}

/* Beak — sharp faceted 4-sided pyramid pointing down & forward */
const beakGeo = new THREE.ConeGeometry(0.17, 0.44, 4);
facetJitter(beakGeo, 0.015, 91);
add(beakGeo, matBeak, [0, 2.02, 0.78], [Math.PI * 0.92, Math.PI / 4, 0]);

/* Feet — small faceted claws gripping the ground */
function makeFoot(s) {
  const foot = new THREE.Group();
  const blockGeo = new THREE.IcosahedronGeometry(0.16, 0);
  blockGeo.scale(1.1, 0.6, 1.3);
  facetJitter(blockGeo, 0.015, 101 + (s > 0 ? 4 : 0));
  const block = new THREE.Mesh(blockGeo, matFoot);
  block.castShadow = true; block.receiveShadow = true;
  foot.add(block);
  for (const t of [-1, 0, 1]) {
    const toe = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.26, 4), matFoot);
    toe.position.set(t * 0.11, -0.02, 0.16);
    toe.rotation.set(Math.PI / 2, 0, t * 0.35);
    toe.castShadow = true; toe.receiveShadow = true;
    foot.add(toe);
  }
  foot.position.set(s * 0.32, 0.14, 0.6);
  owl.add(foot);
}
makeFoot(-1);
makeFoot(1);

scene.add(owl);

/* ---------------------------------------------------------------------------
   Ground the sculpture & frame the camera
--------------------------------------------------------------------------- */
let box = new THREE.Box3().setFromObject(owl);
owl.position.y -= box.min.y;                 // rest base on y = 0
box = new THREE.Box3().setFromObject(owl);
const center = box.getCenter(new THREE.Vector3());
const size = box.getSize(new THREE.Vector3());

const dist = size.y * 1.75;

/* ---------------------------------------------------------------------------
   Controls
--------------------------------------------------------------------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.enablePan = false;
controls.minDistance = size.y * 0.85;
controls.maxDistance = size.y * 4.5;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.copy(center);
camera.position.set(center.x + dist * 0.55, center.y + size.y * 0.14, center.z + dist);
controls.update();

/* ---------------------------------------------------------------------------
   Resize & render loop
--------------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
