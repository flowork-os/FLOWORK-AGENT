<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inflatable Pool Flamingo</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f7dfe8;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf7dfe8);
  scene.fog = new THREE.Fog(0xf7dfe8, 11, 22);

  const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(6.6, 4.3, 7.8);
  camera.lookAt(0, 1.35, 0.25);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.35, 0.25);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.7;
  controls.minDistance = 5;
  controls.maxDistance = 14;
  controls.maxPolarAngle = Math.PI * 0.48;

  const hemi = new THREE.HemisphereLight(0xfff4fa, 0x9d6c7c, 2.2);
  scene.add(hemi);

  const key = new THREE.DirectionalLight(0xffffff, 5.2);
  key.position.set(-4.5, 8, 6);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -6;
  key.shadow.camera.right = 6;
  key.shadow.camera.top = 7;
  key.shadow.camera.bottom = -4;
  key.shadow.camera.near = 0.5;
  key.shadow.camera.far = 22;
  key.shadow.bias = -0.00015;
  scene.add(key);

  const rim = new THREE.DirectionalLight(0xff4f9d, 3.2);
  rim.position.set(5, 4, -5);
  scene.add(rim);

  const fill = new THREE.PointLight(0xfff3dd, 35, 13, 2);
  fill.position.set(-4, 2.5, 3);
  scene.add(fill);

  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(8, 96),
    new THREE.MeshStandardMaterial({
      color: 0xf5cfdc,
      roughness: 0.88,
      metalness: 0
    })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.72;
  ground.receiveShadow = true;
  scene.add(ground);

  const flamingo = new THREE.Group();
  flamingo.rotation.y = -0.18;
  scene.add(flamingo);

  const pink = new THREE.MeshPhysicalMaterial({
    color: 0xff4f96,
    roughness: 0.19,
    metalness: 0,
    clearcoat: 1,
    clearcoatRoughness: 0.12,
    sheen: 0.35,
    sheenColor: new THREE.Color(0xffb2d1)
  });

  const lightPink = new THREE.MeshPhysicalMaterial({
    color: 0xff7eb0,
    roughness: 0.2,
    clearcoat: 1,
    clearcoatRoughness: 0.13,
    sheen: 0.45,
    sheenColor: new THREE.Color(0xffd4e5)
  });

  const seamMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xff8fba,
    roughness: 0.24,
    clearcoat: 0.9,
    clearcoatRoughness: 0.16
  });

  const black = new THREE.MeshPhysicalMaterial({
    color: 0x17131c,
    roughness: 0.22,
    clearcoat: 0.75,
    clearcoatRoughness: 0.14
  });

  const beakIvory = new THREE.MeshPhysicalMaterial({
    color: 0xffd8b4,
    roughness: 0.26,
    clearcoat: 0.75,
    clearcoatRoughness: 0.17
  });

  function finish(mesh) {
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  }

  function sphere(material, position, scale, segments = 48) {
    const mesh = finish(new THREE.Mesh(
      new THREE.SphereGeometry(1, segments, Math.floor(segments * 0.65)),
      material
    ));
    mesh.position.copy(position);
    mesh.scale.copy(scale);
    flamingo.add(mesh);
    return mesh;
  }

  function tube(points, radius, material, tubularSegments = 64, radialSegments = 14) {
    const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
    const mesh = finish(new THREE.Mesh(
      new THREE.TubeGeometry(curve, tubularSegments, radius, radialSegments, false),
      material
    ));
    flamingo.add(mesh);
    return mesh;
  }

  function cylinderBetween(a, b, radius, material, radialSegments = 24) {
    const midpoint = a.clone().add(b).multiplyScalar(0.5);
    const direction = b.clone().sub(a);
    const mesh = finish(new THREE.Mesh(
      new THREE.CylinderGeometry(radius, radius, direction.length(), radialSegments, 1, false),
      material
    ));
    mesh.position.copy(midpoint);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
    flamingo.add(mesh);
    return mesh;
  }

  const body = finish(new THREE.Mesh(
    new THREE.TorusGeometry(1.48, 0.58, 40, 112),
    pink
  ));
  body.rotation.x = Math.PI / 2;
  body.scale.set(1.2, 0.84, 1);
  body.position.y = 0.38;
  flamingo.add(body);

  const outerSeam = finish(new THREE.Mesh(
    new THREE.TorusGeometry(2.055, 0.035, 12, 112),
    seamMaterial
  ));
  outerSeam.rotation.x = Math.PI / 2;
  outerSeam.scale.set(1.02, 0.84, 0.98);
  outerSeam.position.y = 0.38;
  flamingo.add(outerSeam);

  const innerSeam = finish(new THREE.Mesh(
    new THREE.TorusGeometry(0.91, 0.032, 12, 96),
    seamMaterial
  ));
  innerSeam.rotation.x = Math.PI / 2;
  innerSeam.scale.set(1.18, 0.84, 1);
  innerSeam.position.y = 0.38;
  flamingo.add(innerSeam);

  const lowerBelly = sphere(
    pink,
    new THREE.Vector3(0, 0.18, -0.05),
    new THREE.Vector3(1.63, 0.48, 1.3)
  );
  lowerBelly.renderOrder = -1;

  const wingLeft = sphere(
    lightPink,
    new THREE.Vector3(-1.42, 0.72, -0.18),
    new THREE.Vector3(0.35, 0.24, 0.92)
  );
  wingLeft.rotation.z = -0.2;
  wingLeft.rotation.x = 0.1;

  const wingRight = sphere(
    lightPink,
    new THREE.Vector3(1.42, 0.72, -0.18),
    new THREE.Vector3(0.35, 0.24, 0.92)
  );
  wingRight.rotation.z = 0.2;
  wingRight.rotation.x = 0.1;

  const wingSeamLeft = tube([
    new THREE.Vector3(-1.69, 0.76, 0.48),
    new THREE.Vector3(-1.77, 0.88, 0.02),
    new THREE.Vector3(-1.68, 0.78, -0.55),
    new THREE.Vector3(-1.48, 0.68, -0.88)
  ], 0.026, seamMaterial, 40, 10);

  const wingSeamRight = tube([
    new THREE.Vector3(1.69, 0.76, 0.48),
    new THREE.Vector3(1.77, 0.88, 0.02),
    new THREE.Vector3(1.68, 0.78, -0.55),
    new THREE.Vector3(1.48, 0.68, -0.88)
  ], 0.026, seamMaterial, 40, 10);

  const tailCenter = sphere(
    pink,
    new THREE.Vector3(0, 0.57, -1.8),
    new THREE.Vector3(0.48, 0.34, 0.82)
  );
  tailCenter.rotation.x = -0.22;

  const tailLeft = sphere(
    lightPink,
    new THREE.Vector3(-0.4, 0.56, -1.72),
    new THREE.Vector3(0.3, 0.25, 0.72)
  );
  tailLeft.rotation.y = -0.35;
  tailLeft.rotation.x = -0.2;

  const tailRight = sphere(
    lightPink,
    new THREE.Vector3(0.4, 0.56, -1.72),
    new THREE.Vector3(0.3, 0.25, 0.72)
  );
  tailRight.rotation.y = 0.35;
  tailRight.rotation.x = -0.2;

  const neckPoints = [
    new THREE.Vector3(0, 0.55, 1.43),
    new THREE.Vector3(0, 1.08, 1.68),
    new THREE.Vector3(0, 1.68, 1.4),
    new THREE.Vector3(0, 2.22, 1.19),
    new THREE.Vector3(0, 2.78, 1.45),
    new THREE.Vector3(0, 3.02, 1.87),
    new THREE.Vector3(0, 2.91, 2.2)
  ];
  tube(neckPoints, 0.285, pink, 96, 24);

  tube([
    new THREE.Vector3(-0.002, 0.61, 1.7),
    new THREE.Vector3(-0.002, 1.14, 1.91),
    new THREE.Vector3(-0.002, 1.7, 1.62),
    new THREE.Vector3(-0.002, 2.25, 1.42),
    new THREE.Vector3(-0.002, 2.7, 1.62)
  ], 0.024, seamMaterial, 60, 9);

  const head = sphere(
    pink,
    new THREE.Vector3(0, 2.88, 2.31),
    new THREE.Vector3(0.43, 0.48, 0.58)
  );
  head.rotation.x = -0.16;

  const cheekLeft = sphere(
    lightPink,
    new THREE.Vector3(-0.3, 2.78, 2.48),
    new THREE.Vector3(0.09, 0.13, 0.18),
    28
  );
  const cheekRight = sphere(
    lightPink,
    new THREE.Vector3(0.3, 2.78, 2.48),
    new THREE.Vector3(0.09, 0.13, 0.18),
    28
  );

  const beakBase = finish(new THREE.Mesh(
    new THREE.ConeGeometry(0.34, 0.78, 36, 1, false),
    beakIvory
  ));
  beakBase.position.set(0, 2.72, 2.82);
  beakBase.rotation.x = Math.PI / 2;
  beakBase.scale.set(1, 1, 0.82);
  flamingo.add(beakBase);

  const beakTip = finish(new THREE.Mesh(
    new THREE.ConeGeometry(0.255, 0.53, 36, 1, false),
    black
  ));
  beakTip.position.set(0, 2.72, 3.32);
  beakTip.rotation.x = Math.PI / 2;
  beakTip.scale.set(1, 1, 0.85);
  flamingo.add(beakTip);

  const beakJoin = finish(new THREE.Mesh(
    new THREE.TorusGeometry(0.275, 0.022, 10, 40),
    seamMaterial
  ));
  beakJoin.position.set(0, 2.72, 3.08);
  flamingo.add(beakJoin);

  const eyeWhiteMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    roughness: 0.15,
    clearcoat: 1
  });

  const eyeLeft = sphere(
    eyeWhiteMaterial,
    new THREE.Vector3(-0.365, 3.01, 2.48),
    new THREE.Vector3(0.105, 0.14, 0.105),
    32
  );
  const eyeRight = sphere(
    eyeWhiteMaterial,
    new THREE.Vector3(0.365, 3.01, 2.48),
    new THREE.Vector3(0.105, 0.14, 0.105),
    32
  );

  const pupilLeft = sphere(
    black,
    new THREE.Vector3(-0.425, 3.015, 2.54),
    new THREE.Vector3(0.052, 0.074, 0.052),
    24
  );
  const pupilRight = sphere(
    black,
    new THREE.Vector3(0.425, 3.015, 2.54),
    new THREE.Vector3(0.052, 0.074, 0.052),
    24
  );

  const legLeftA = new THREE.Vector3(-0.56, -0.03, -0.52);
  const legLeftB = new THREE.Vector3(-0.72, -0.39, -0.12);
  const legLeftC = new THREE.Vector3(-0.43, -0.48, 0.16);
  cylinderBetween(legLeftA, legLeftB, 0.09, lightPink);
  cylinderBetween(legLeftB, legLeftC, 0.085, lightPink);
  sphere(lightPink, legLeftB, new THREE.Vector3(0.115, 0.115, 0.115), 24);

  const legRightA = new THREE.Vector3(0.56, -0.03, -0.52);
  const legRightB = new THREE.Vector3(0.72, -0.39, -0.12);
  const legRightC = new THREE.Vector3(0.43, -0.48, 0.16);
  cylinderBetween(legRightA, legRightB, 0.09, lightPink);
  cylinderBetween(legRightB, legRightC, 0.085, lightPink);
  sphere(lightPink, legRightB, new THREE.Vector3(0.115, 0.115, 0.115), 24);

  const footLeft = sphere(
    black,
    new THREE.Vector3(-0.39, -0.48, 0.25),
    new THREE.Vector3(0.19, 0.07, 0.25),
    28
  );
  footLeft.rotation.y = -0.2;

  const footRight = sphere(
    black,
    new THREE.Vector3(0.39, -0.48, 0.25),
    new THREE.Vector3(0.19, 0.07, 0.25),
    28
  );
  footRight.rotation.y = 0.2;

  const valve = finish(new THREE.Mesh(
    new THREE.CylinderGeometry(0.075, 0.085, 0.055, 24),
    seamMaterial
  ));
  valve.position.set(1.77, 0.48, -0.72);
  valve.rotation.z = Math.PI / 2;
  flamingo.add(valve);

  const highlightMaterial = new THREE.MeshBasicMaterial({
    color: 0xffd5e7,
    transparent: true,
    opacity: 0.42,
    depthWrite: false
  });

  const bodyHighlight = tube([
    new THREE.Vector3(-1.35, 0.83, 0.72),
    new THREE.Vector3(-0.82, 1.01, 1.28),
    new THREE.Vector3(-0.18, 1.07, 1.48)
  ], 0.025, highlightMaterial, 36, 8);

  const neckHighlight = tube([
    new THREE.Vector3(-0.22, 1.05, 1.66),
    new THREE.Vector3(-0.22, 1.62, 1.43),
    new THREE.Vector3(-0.22, 2.22, 1.26),
    new THREE.Vector3(-0.2, 2.72, 1.55)
  ], 0.022, highlightMaterial, 48, 8);

  flamingo.position.y = 0.02;

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
  });

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const elapsed = clock.getElapsedTime();
    flamingo.position.y = 0.02 + Math.sin(elapsed * 1.15) * 0.025;
    flamingo.rotation.z = Math.sin(elapsed * 0.7) * 0.009;
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
