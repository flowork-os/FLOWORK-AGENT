<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kawaii Boba Tea</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #22232c; }
  #app { position: fixed; inset: 0; }
  .hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #cfd0dd; opacity: 0.55; letter-spacing: 0.3px; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ----------------------------------------------------------------------------
// Renderer
// ----------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

// ----------------------------------------------------------------------------
// Scene & Camera
// ----------------------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x22232c);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3.4, 2.5, 5.4);

// ----------------------------------------------------------------------------
// Lighting: hemisphere + key/fill/rim
// ----------------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0xffffff, 0x3a3a48, 0.65);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e6, 1.7);
key.position.set(4.5, 7.5, 5.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 25;
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -2;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd4ff, 0.55);
fill.position.set(-5, 3, 3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd6ec, 0.8);
rim.position.set(-2.5, 4.5, -6);
scene.add(rim);

// ----------------------------------------------------------------------------
// Ground plane (receives shadows only)
// ----------------------------------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.28 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

// ============================================================================
// The single centered object: the Kawaii Boba Tea
// ============================================================================
const boba = new THREE.Group();
scene.add(boba);

// --- Cup silhouette (smoothed lathe profile) --------------------------------
const cupCtrl = [
  new THREE.Vector3(0.00, 0.00, 0),
  new THREE.Vector3(0.55, 0.00, 0),
  new THREE.Vector3(0.86, 0.06, 0),
  new THREE.Vector3(0.93, 0.35, 0),
  new THREE.Vector3(0.97, 0.90, 0),
  new THREE.Vector3(1.03, 1.50, 0),
  new THREE.Vector3(1.13, 2.10, 0),
  new THREE.Vector3(1.26, 2.55, 0),
  new THREE.Vector3(1.32, 2.66, 0),
  new THREE.Vector3(1.30, 2.72, 0)
];
const cupCurve = new THREE.CatmullRomCurve3(cupCtrl);
const cupPts = cupCurve.getPoints(90).map(p => new THREE.Vector2(p.x, p.y));

function radiusAt(y) {
  for (let i = 0; i < cupPts.length - 1; i++) {
    const a = cupPts[i], b = cupPts[i + 1];
    if ((y >= a.y && y <= b.y) || (y <= a.y && y >= b.y)) {
      const t = (y - a.y) / ((b.y - a.y) || 1e-6);
      return a.x + (b.x - a.x) * t;
    }
  }
  return cupPts[cupPts.length - 1].x;
}

// --- Cup shell (clear glossy plastic) ---------------------------------------
const cupGeo = new THREE.LatheGeometry(cupPts, 100);
const cupMat = new THREE.MeshPhysicalMaterial({
  color: 0xfff2f8,
  roughness: 0.06,
  metalness: 0.0,
  transparent: true,
  opacity: 0.24,
  transmission: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.08,
  ior: 1.35,
  side: THREE.DoubleSide,
  depthWrite: false
});
const cup = new THREE.Mesh(cupGeo, cupMat);
cup.castShadow = true;
boba.add(cup);

// --- Milk-tea liquid with pastel vertical gradient (vertex colors) ----------
const liqPts = [
  new THREE.Vector2(0.001, 0.02),
  new THREE.Vector2(0.50, 0.03),
  new THREE.Vector2(0.78, 0.08),
  new THREE.Vector2(0.86, 0.30),
  new THREE.Vector2(0.90, 0.70),
  new THREE.Vector2(0.95, 1.20),
  new THREE.Vector2(1.00, 1.70),
  new THREE.Vector2(1.02, 1.95),
  new THREE.Vector2(1.02, 2.00),
  new THREE.Vector2(0.00, 2.00)
];
const liqGeo = new THREE.LatheGeometry(liqPts, 80);
{
  const pos = liqGeo.attributes.position;
  const cBot = new THREE.Color(0xc98a5e);
  const cMid = new THREE.Color(0xe6bf93);
  const cTop = new THREE.Color(0xf5e6cb);
  const maxY = 2.0;
  const colors = [];
  for (let i = 0; i < pos.count; i++) {
    const t = THREE.MathUtils.clamp(pos.getY(i) / maxY, 0, 1);
    const col = (t < 0.5)
      ? cBot.clone().lerp(cMid, t / 0.5)
      : cMid.clone().lerp(cTop, (t - 0.5) / 0.5);
    colors.push(col.r, col.g, col.b);
  }
  liqGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
}
const liqMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.35,
  metalness: 0.0
});
const liquid = new THREE.Mesh(liqGeo, liqMat);
liquid.castShadow = true;
liquid.receiveShadow = true;
boba.add(liquid);

// --- Tapioca pearls with sparkle-eyes ---------------------------------------
const pearlMat = new THREE.MeshPhysicalMaterial({
  color: 0x241512,
  roughness: 0.16,
  metalness: 0.0,
  clearcoat: 1.0,
  clearcoatRoughness: 0.05
});
const sparkleMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  emissive: 0x888888,
  emissiveIntensity: 0.25,
  roughness: 0.25
});

const placements = [];
let attempts = 0;
while (placements.length < 13 && attempts < 500) {
  attempts++;
  const ang = Math.random() * Math.PI * 2;
  const rr = Math.sqrt(Math.random()) * 0.55;
  const x = Math.cos(ang) * rr;
  const z = Math.sin(ang) * rr;
  const y = 0.18 + Math.random() * 0.22;
  let ok = true;
  for (const p of placements) {
    if ((p.x - x) ** 2 + (p.y - y) ** 2 + (p.z - z) ** 2 < 0.15) { ok = false; break; }
  }
  if (ok) placements.push({ x, y, z });
}
for (const p of placements) {
  const s = 0.19 + Math.random() * 0.04;
  const pearl = new THREE.Mesh(new THREE.SphereGeometry(s, 22, 22), pearlMat);
  pearl.position.set(p.x, p.y, p.z);
  pearl.rotation.y = Math.random() * Math.PI * 2;
  pearl.castShadow = true;
  pearl.receiveShadow = true;
  // two glossy sparkle eyes on the front hemisphere
  for (const sx of [-1, 1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(s * 0.24, 12, 12), sparkleMat);
    e.position.set(sx * s * 0.34, s * 0.16, s * 0.86);
    pearl.add(e);
  }
  boba.add(pearl);
}

// --- Kawaii face on the front of the cup ------------------------------------
const faceDark = new THREE.MeshStandardMaterial({ color: 0x2b2b33, roughness: 0.28, metalness: 0.0 });
const faceShine = new THREE.MeshBasicMaterial({ color: 0xffffff });
const blushMat = new THREE.MeshBasicMaterial({ color: 0xff9ec4, transparent: true, opacity: 0.78 });

// place a mesh/group onto the curved cup surface, facing outward
function placeOnCup(obj, angleDeg, y, extra = 0.02) {
  const r = radiusAt(y) + extra;
  const a = THREE.MathUtils.degToRad(angleDeg);
  obj.position.set(Math.sin(a) * r, y, Math.cos(a) * r);
  obj.lookAt(obj.position.x * 3, y, obj.position.z * 3); // local +Z points outward
  return obj;
}

// eyes
for (const sgn of [-1, 1]) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.13, 22, 22), faceDark);
  placeOnCup(eye, sgn * 17, 1.53, 0.02);
  eye.scale.set(0.9, 1.28, 0.7);
  const spark = new THREE.Mesh(new THREE.SphereGeometry(0.038, 10, 10), faceShine);
  spark.position.set(-0.045, 0.05, 0.1);
  eye.add(spark);
  boba.add(eye);
}

// blush cheeks
for (const sgn of [-1, 1]) {
  const blush = new THREE.Mesh(new THREE.CircleGeometry(0.17, 28), blushMat);
  placeOnCup(blush, sgn * 34, 1.40, 0.015);
  blush.scale.set(1.35, 0.9, 1);
  boba.add(blush);
}

// smiling mouth (arc)
{
  const mouth = new THREE.Mesh(
    new THREE.TorusGeometry(0.27, 0.045, 12, 28, Math.PI),
    faceDark
  );
  mouth.rotation.z = Math.PI; // flip arc into a happy ∪ smile
  const mouthGroup = new THREE.Group();
  mouthGroup.add(mouth);
  placeOnCup(mouthGroup, 0, 1.27, 0.03);
  boba.add(mouthGroup);
}

// --- Domed lid (clear plastic collar + dome) --------------------------------
const lidMat = new THREE.MeshPhysicalMaterial({
  color: 0xeaf3ff,
  roughness: 0.08,
  metalness: 0.0,
  transparent: true,
  opacity: 0.32,
  clearcoat: 1.0,
  clearcoatRoughness: 0.1,
  ior: 1.3,
  side: THREE.DoubleSide,
  depthWrite: false
});

const collar = new THREE.Mesh(
  new THREE.CylinderGeometry(1.37, 1.34, 0.20, 100, 1, true),
  lidMat
);
collar.position.y = 2.66;
collar.castShadow = true;
boba.add(collar);

const dome = new THREE.Mesh(
  new THREE.SphereGeometry(1.34, 80, 40, 0, Math.PI * 2, 0, Math.PI / 2),
  lidMat
);
dome.scale.set(1, 0.52, 1);
dome.position.y = 2.72;
dome.castShadow = true;
boba.add(dome);

// --- Fat striped straw ------------------------------------------------------
function makeStripeTexture() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff6fa';
  ctx.fillRect(0, 0, 128, 128);
  ctx.strokeStyle = '#ff7fa8';
  ctx.lineWidth = 34;
  for (let i = -128; i < 256; i += 72) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i + 128, 128);
    ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(3, 2.2);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

const strawMat = new THREE.MeshStandardMaterial({
  map: makeStripeTexture(),
  roughness: 0.4,
  metalness: 0.0
});
const strawGroup = new THREE.Group();
const strawLen = 2.7, strawR = 0.21;
const straw = new THREE.Mesh(
  new THREE.CylinderGeometry(strawR, strawR, strawLen, 30, 1, false),
  strawMat
);
straw.castShadow = true;
strawGroup.add(straw);

// suggested opening at the straw tip
const strawTip = new THREE.Mesh(
  new THREE.CircleGeometry(strawR * 0.82, 24),
  new THREE.MeshStandardMaterial({ color: 0x8a3a58, roughness: 0.6 })
);
strawTip.rotation.x = -Math.PI / 2;
strawTip.position.y = strawLen / 2 + 0.001;
strawGroup.add(strawTip);

strawGroup.position.set(0.28, 2.42, 0.05);
strawGroup.rotation.z = -0.17;
boba.add(strawGroup);

// ----------------------------------------------------------------------------
// Controls
// ----------------------------------------------------------------------------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 3.2;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 1.5, 0);
controls.update();

// ----------------------------------------------------------------------------
// Resize
// ----------------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

// ----------------------------------------------------------------------------
// Render loop
// ----------------------------------------------------------------------------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
