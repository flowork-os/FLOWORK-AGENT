<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procedural Running Sneaker</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9dde0}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9dde0);
scene.fog = new THREE.Fog(0xd9dde0, 15, 28);

const camera = new THREE.PerspectiveCamera(37, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.8, -7.2, 5.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.25, 0, 1.15);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 6;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.48;

const hemi = new THREE.HemisphereLight(0xf4f8ff, 0x6f685e, 2.0);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 4.3);
key.position.set(4, -5, 9);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -7;
key.shadow.camera.near = 1;
key.shadow.camera.far = 20;
key.shadow.bias = -0.00025;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbfd7ff, 1.6);
fill.position.set(-5, 5, 5);
scene.add(fill);

const rim = new THREE.PointLight(0xffe2c2, 24, 16, 2);
rim.position.set(-4, -3, 4);
scene.add(rim);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0xc8ccce, roughness: 0.9, metalness: 0 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.z = -0.03;
floor.receiveShadow = true;
scene.add(floor);

const shoe = new THREE.Group();
shoe.rotation.z = -0.035;
shoe.rotation.x = 0.015;
scene.add(shoe);

const mat = {
  outsole: new THREE.MeshStandardMaterial({ color: 0x191a1b, roughness: 0.72 }),
  outsoleDark: new THREE.MeshStandardMaterial({ color: 0x090a0a, roughness: 0.84 }),
  foam: new THREE.MeshStandardMaterial({ color: 0xf4f0e7, roughness: 0.72 }),
  foamAccent: new THREE.MeshStandardMaterial({ color: 0xe5ded0, roughness: 0.8 }),
  mesh: new THREE.MeshStandardMaterial({ color: 0x819690, roughness: 0.96, metalness: 0 }),
  meshDark: new THREE.MeshStandardMaterial({ color: 0x344743, roughness: 0.94 }),
  lining: new THREE.MeshStandardMaterial({ color: 0x17211f, roughness: 1 }),
  overlay: new THREE.MeshStandardMaterial({ color: 0xd8ddd7, roughness: 0.7 }),
  overlayDark: new THREE.MeshStandardMaterial({ color: 0x536b65, roughness: 0.76 }),
  heel: new THREE.MeshStandardMaterial({ color: 0xb6c1ba, roughness: 0.54 }),
  rubberAccent: new THREE.MeshStandardMaterial({ color: 0xe56e42, roughness: 0.65 }),
  lace: new THREE.MeshStandardMaterial({ color: 0xf1eee5, roughness: 0.82 }),
  laceShadow: new THREE.MeshStandardMaterial({ color: 0xb8b6ad, roughness: 0.9 }),
  eyelet: new THREE.MeshStandardMaterial({ color: 0x40544f, roughness: 0.55 }),
  logo: new THREE.MeshStandardMaterial({ color: 0xf1683c, roughness: 0.52 })
};

function footprintShape(scaleX = 1, scaleY = 1, inset = 0) {
  const s = new THREE.Shape();
  s.moveTo((-3.22 + inset) * scaleX, -0.64 * scaleY);
  s.bezierCurveTo(-3.42 * scaleX, -0.36 * scaleY, -3.36 * scaleX, 0.48 * scaleY, (-3.03 + inset) * scaleX, 0.68 * scaleY);
  s.bezierCurveTo(-2.35 * scaleX, 0.83 * scaleY, -1.55 * scaleX, 0.72 * scaleY, -0.75 * scaleX, 0.73 * scaleY);
  s.bezierCurveTo(0.2 * scaleX, 0.82 * scaleY, 1.08 * scaleX, 1.0 * scaleY, 2.12 * scaleX, 0.94 * scaleY);
  s.bezierCurveTo(3.0 * scaleX, 0.89 * scaleY, 3.55 * scaleX, 0.58 * scaleY, 3.72 * scaleX, 0.22 * scaleY);
  s.bezierCurveTo(3.84 * scaleX, -0.12 * scaleY, 3.5 * scaleX, -0.57 * scaleY, 2.92 * scaleX, -0.76 * scaleY);
  s.bezierCurveTo(1.92 * scaleX, -1.03 * scaleY, 0.95 * scaleX, -0.83 * scaleY, 0.08 * scaleX, -0.72 * scaleY);
  s.bezierCurveTo(-0.92 * scaleX, -0.59 * scaleY, -1.64 * scaleX, -0.7 * scaleY, -2.3 * scaleX, -0.74 * scaleY);
  s.bezierCurveTo(-2.72 * scaleX, -0.78 * scaleY, -3.03 * scaleX, -0.76 * scaleY, (-3.22 + inset) * scaleX, -0.64 * scaleY);
  return s;
}

function extrudedSole(shape, depth, bevel, material, z) {
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: true,
    bevelSegments: 4,
    steps: 1,
    bevelSize: bevel,
    bevelThickness: bevel,
    curveSegments: 32
  });
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.z = z;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  shoe.add(mesh);
  return mesh;
}

extrudedSole(footprintShape(0.995, 0.985), 0.22, 0.07, mat.outsole, 0.04);
extrudedSole(footprintShape(0.985, 0.94), 0.38, 0.1, mat.foamAccent, 0.27);
extrudedSole(footprintShape(0.965, 0.895), 0.35, 0.11, mat.foam, 0.59);

const upperSections = [
  [-3.08, 0.54, 0.84, 1.45],
  [-2.68, 0.62, 0.86, 1.92],
  [-2.15, 0.66, 0.86, 2.27],
  [-1.55, 0.65, 0.87, 2.30],
  [-0.92, 0.63, 0.89, 2.08],
  [-0.25, 0.68, 0.91, 1.86],
  [0.48, 0.75, 0.91, 1.73],
  [1.25, 0.82, 0.90, 1.60],
  [2.03, 0.80, 0.88, 1.42],
  [2.72, 0.69, 0.84, 1.22],
  [3.28, 0.47, 0.79, 1.04],
  [3.56, 0.21, 0.76, 0.94]
];

function createUpperGeometry(sections, arcSegments = 18) {
  const vertices = [];
  const indices = [];
  const uvs = [];
  for (let i = 0; i < sections.length; i++) {
    const [x, width, bottom, top] = sections[i];
    for (let j = 0; j <= arcSegments; j++) {
      const a = Math.PI * j / arcSegments;
      const sideBias = Math.cos(a) < 0 ? 1.04 : 0.96;
      const y = width * Math.cos(a) * sideBias;
      const rise = Math.pow(Math.sin(a), 0.72);
      const z = bottom + (top - bottom) * rise;
      vertices.push(x, y, z);
      uvs.push(i / (sections.length - 1), j / arcSegments);
    }
  }
  const row = arcSegments + 1;
  for (let i = 0; i < sections.length - 1; i++) {
    for (let j = 0; j < arcSegments; j++) {
      const a = i * row + j;
      const b = a + row;
      indices.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  for (const endIndex of [0, sections.length - 1]) {
    const [x, , bottom] = sections[endIndex];
    const centerIndex = vertices.length / 3;
    vertices.push(x, 0, bottom);
    uvs.push(endIndex, 0.5);
    const base = endIndex * row;
    for (let j = 0; j < arcSegments; j++) {
      if (endIndex === 0) indices.push(centerIndex, base + j + 1, base + j);
      else indices.push(centerIndex, base + j, base + j + 1);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const upper = new THREE.Mesh(createUpperGeometry(upperSections), mat.mesh);
upper.castShadow = true;
upper.receiveShadow = true;
shoe.add(upper);

function tube(points, radius, material, segments = 48, radial = 8, closed = false) {
  const curve = new THREE.CatmullRomCurve3(points, closed, 'centripetal');
  const geometry = new THREE.TubeGeometry(curve, segments, radius, radial, closed);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  shoe.add(mesh);
  return mesh;
}

function sideZ(x) {
  if (x < -1.8) return 1.6 + (x + 1.8) * 0.12;
  if (x < 0.5) return 1.62 - (x + 0.4) * 0.13;
  return 1.48 - (x - 0.5) * 0.12;
}

const opening = new THREE.Mesh(
  new THREE.SphereGeometry(1, 48, 20),
  mat.lining
);
opening.scale.set(1.27, 0.58, 0.19);
opening.position.set(-1.95, 0, 2.22);
opening.rotation.y = -0.08;
opening.castShadow = true;
shoe.add(opening);

const insole = new THREE.Mesh(
  new THREE.SphereGeometry(1, 36, 16),
  new THREE.MeshStandardMaterial({ color: 0x293c37, roughness: 1 })
);
insole.scale.set(1.12, 0.49, 0.08);
insole.position.set(-1.84, 0, 2.13);
shoe.add(insole);

tube([
  new THREE.Vector3(-2.85, -0.46, 2.02),
  new THREE.Vector3(-2.42, -0.62, 2.27),
  new THREE.Vector3(-1.83, -0.61, 2.38),
  new THREE.Vector3(-1.25, -0.48, 2.23)
], 0.115, mat.meshDark, 42, 10);

tube([
  new THREE.Vector3(-2.85, 0.45, 2.03),
  new THREE.Vector3(-2.42, 0.63, 2.28),
  new THREE.Vector3(-1.82, 0.63, 2.39),
  new THREE.Vector3(-1.25, 0.48, 2.23)
], 0.115, mat.meshDark, 42, 10);

tube([
  new THREE.Vector3(-2.85, -0.45, 2.02),
  new THREE.Vector3(-3.05, 0, 2.13),
  new THREE.Vector3(-2.85, 0.45, 2.03)
], 0.12, mat.meshDark, 28, 10);

function panel(points, material, yOffset) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
  shape.closePath();
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.035,
    bevelEnabled: true,
    bevelSize: 0.025,
    bevelThickness: 0.015,
    bevelSegments: 2,
    curveSegments: 8
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.rotation.x = Math.PI / 2;
  mesh.position.y = yOffset;
  mesh.castShadow = true;
  shoe.add(mesh);
  return mesh;
}

const sidePanelPoints = [
  [-2.9, 1.03], [-2.55, 1.93], [-2.05, 2.12], [-1.42, 1.94],
  [-0.96, 1.67], [-0.48, 1.42], [0.15, 1.18], [-0.62, 1.05],
  [-1.4, 1.21], [-2.15, 1.12]
];
panel(sidePanelPoints, mat.overlayDark, -0.645);
panel(sidePanelPoints.map(p => [p[0], p[1] + 0.01]), mat.overlay, 0.65);

const heelPanelPoints = [
  [-3.2, 0.92], [-3.12, 1.63], [-2.75, 2.08],
  [-2.36, 1.98], [-2.28, 1.24], [-2.62, 1.02]
];
panel(heelPanelPoints, mat.heel, -0.625);
panel(heelPanelPoints, mat.heel, 0.635);

tube([
  new THREE.Vector3(-3.18, -0.6, 1.18),
  new THREE.Vector3(-3.32, 0, 1.22),
  new THREE.Vector3(-3.17, 0.6, 1.2)
], 0.105, mat.overlayDark, 30, 10);

const tongueGeometry = new THREE.BoxGeometry(2.55, 0.74, 0.14, 8, 4, 2);
tongueGeometry.translate(0, 0, 0);
const tongue = new THREE.Mesh(tongueGeometry, mat.meshDark);
tongue.position.set(-0.72, 0, 2.0);
tongue.rotation.y = -0.19;
tongue.rotation.z = 0.015;
tongue.castShadow = true;
shoe.add(tongue);

const tongueTop = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.39, 0.45, 8, 20),
  mat.meshDark
);
tongueTop.rotation.z = Math.PI / 2;
tongueTop.scale.set(1, 1, 0.22);
tongueTop.position.set(-1.87, 0, 2.42);
tongueTop.rotation.y = -0.1;
tongueTop.castShadow = true;
shoe.add(tongueTop);

const tongueBadge = new THREE.Mesh(
  new THREE.BoxGeometry(0.42, 0.42, 0.035),
  mat.logo
);
tongueBadge.position.set(-1.78, -0.385, 2.44);
tongueBadge.rotation.x = Math.PI / 2;
tongueBadge.rotation.z = 0.04;
shoe.add(tongueBadge);

const laceXs = [-1.22, -0.72, -0.18, 0.4, 0.98];
const laceWidths = [0.47, 0.5, 0.54, 0.57, 0.6];
const laceHeights = [2.18, 2.08, 1.98, 1.87, 1.76];

for (let i = 0; i < laceXs.length; i++) {
  const x = laceXs[i];
  const w = laceWidths[i];
  const z = laceHeights[i];

  for (const side of [-1, 1]) {
    const loop = new THREE.Mesh(
      new THREE.TorusGeometry(0.105, 0.025, 8, 24),
      mat.eyelet
    );
    loop.position.set(x, side * w, z);
    loop.rotation.x = side * 0.66;
    loop.rotation.y = 0.08;
    loop.scale.set(1.25, 0.82, 1);
    loop.castShadow = true;
    shoe.add(loop);
  }
}

for (let i = 0; i < laceXs.length - 1; i++) {
  const leftX = laceXs[i];
  const rightX = laceXs[i + 1];
  const leftW = laceWidths[i];
  const rightW = laceWidths[i + 1];
  const leftZ = laceHeights[i] + 0.045;
  const rightZ = laceHeights[i + 1] + 0.055;

  tube([
    new THREE.Vector3(leftX, -leftW, leftZ),
    new THREE.Vector3((leftX + rightX) * 0.5, 0, Math.max(leftZ, rightZ) + 0.11),
    new THREE.Vector3(rightX, rightW, rightZ)
  ], 0.035, mat.lace, 20, 7);

  tube([
    new THREE.Vector3(leftX, leftW, leftZ + 0.025),
    new THREE.Vector3((leftX + rightX) * 0.5, 0, Math.max(leftZ, rightZ) + 0.145),
    new THREE.Vector3(rightX, -rightW, rightZ + 0.025)
  ], 0.035, mat.lace, 20, 7);
}

tube([
  new THREE.Vector3(-1.23, -0.45, 2.22),
  new THREE.Vector3(-1.58, -0.15, 2.34),
  new THREE.Vector3(-1.9, -0.06, 2.43)
], 0.033, mat.lace, 24, 7);

tube([
  new THREE.Vector3(-1.23, 0.45, 2.22),
  new THREE.Vector3(-1.56, 0.16, 2.36),
  new THREE.Vector3(-1.88, 0.09, 2.45)
], 0.033, mat.lace, 24, 7);

const toeGuardPoints = [
  [1.65, 0.91], [2.42, 1.13], [3.22, 1.03],
  [3.52, 0.91], [3.14, 0.82], [2.32, 0.82]
];
panel(toeGuardPoints, mat.overlay, -0.66);
panel(toeGuardPoints, mat.overlay, 0.68);

tube([
  new THREE.Vector3(1.25, -0.71, 1.02),
  new THREE.Vector3(2.02, -0.82, 1.12),
  new THREE.Vector3(2.82, -0.66, 1.06),
  new THREE.Vector3(3.42, -0.31, 0.94)
], 0.055, mat.overlayDark, 48, 8);

const logoCurve = [
  new THREE.Vector3(-0.85, -0.692, 1.48),
  new THREE.Vector3(-0.18, -0.76, 1.37),
  new THREE.Vector3(0.58, -0.77, 1.38),
  new THREE.Vector3(1.34, -0.69, 1.47),
  new THREE.Vector3(0.67, -0.72, 1.3),
  new THREE.Vector3(-0.03, -0.71, 1.22)
];
tube(logoCurve, 0.055, mat.logo, 54, 9);

const medialLogo = logoCurve.map(p => new THREE.Vector3(p.x, -p.y + 0.018, p.z + 0.02));
tube(medialLogo, 0.045, mat.overlayDark, 54, 8);

const meshDots = new THREE.InstancedMesh(
  new THREE.SphereGeometry(0.018, 6, 4),
  mat.meshDark,
  112
);
const dotMatrix = new THREE.Matrix4();
let dotCount = 0;
for (const side of [-1, 1]) {
  for (let row = 0; row < 7; row++) {
    for (let col = 0; col < 8; col++) {
      const x = 0.48 + col * 0.31 + (row % 2) * 0.08;
      const width = Math.max(0.35, 0.77 - Math.max(0, x - 1.8) * 0.12);
      const y = side * (width + 0.018);
      const z = 1.04 + row * 0.065 + Math.max(0, 2.4 - x) * 0.035;
      dotMatrix.makeTranslation(x, y, z);
      meshDots.setMatrixAt(dotCount++, dotMatrix);
    }
  }
}
meshDots.count = dotCount;
meshDots.castShadow = true;
shoe.add(meshDots);

const foamGrooveMaterial = new THREE.MeshStandardMaterial({ color: 0xc8c1b5, roughness: 0.92 });
for (let i = 0; i < 7; i++) {
  const x = -2.65 + i * 0.88;
  tube([
    new THREE.Vector3(x, -0.78, 0.49),
    new THREE.Vector3(x + 0.18, -0.82, 0.58),
    new THREE.Vector3(x + 0.27, -0.76, 0.69)
  ], 0.025, foamGrooveMaterial, 14, 6);
}

const treadBlocks = [];
for (let i = 0; i < 9; i++) {
  const x = -2.85 + i * 0.75;
  const localWidth = x > 2.2 ? 0.55 : x < -2.3 ? 0.5 : 0.7;
  for (const side of [-1, 1]) {
    const block = new THREE.Mesh(
      new THREE.BoxGeometry(0.44, 0.25, 0.09),
      i === 4 || i === 5 ? mat.rubberAccent : mat.outsoleDark
    );
    block.position.set(x, side * localWidth, 0.035);
    block.rotation.z = side * 0.12 + (i % 2 ? 0.06 : -0.06);
    block.castShadow = true;
    shoe.add(block);
    treadBlocks.push(block);
  }
}

const heelPull = tube([
  new THREE.Vector3(-3.02, -0.18, 2.07),
  new THREE.Vector3(-3.22, -0.14, 2.52),
  new THREE.Vector3(-2.95, -0.12, 2.48)
], 0.055, mat.logo, 26, 8);
heelPull.castShadow = true;

const contactShadow = new THREE.Mesh(
  new THREE.CircleGeometry(4.4, 64),
  new THREE.MeshBasicMaterial({
    color: 0x4f5252,
    transparent: true,
    opacity: 0.12,
    depthWrite: false
  })
);
contactShadow.scale.set(1, 0.32, 1);
contactShadow.rotation.x = -Math.PI / 2;
contactShadow.position.set(0.1, 0, 0.005);
scene.add(contactShadow);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
