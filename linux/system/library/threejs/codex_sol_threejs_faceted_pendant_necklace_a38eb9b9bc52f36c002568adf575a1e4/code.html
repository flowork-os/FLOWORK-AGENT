<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faceted Amethyst Pendant Necklace</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080510;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080510);
scene.fog = new THREE.FogExp2(0x080510, 0.035);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 50);
camera.position.set(0, 0.25, 7.6);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setAnimationLoop(render);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.42;
controls.enablePan = false;
controls.minDistance = 5.2;
controls.maxDistance = 11;
controls.target.set(0, 0.15, 0);

const necklace = new THREE.Group();
necklace.rotation.x = -0.035;
scene.add(necklace);

const platinum = new THREE.MeshPhysicalMaterial({
  color: 0xe8e7f0,
  metalness: 0.92,
  roughness: 0.16,
  clearcoat: 0.65,
  clearcoatRoughness: 0.1
});

const darkMetal = new THREE.MeshStandardMaterial({
  color: 0x706c7f,
  metalness: 0.95,
  roughness: 0.22
});

const amethystMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x6f13c8,
  emissive: 0x21002e,
  emissiveIntensity: 0.24,
  metalness: 0.02,
  roughness: 0.055,
  transmission: 0.32,
  thickness: 1.35,
  ior: 2.1,
  attenuationColor: new THREE.Color(0x6f00b8),
  attenuationDistance: 0.62,
  clearcoat: 1,
  clearcoatRoughness: 0.025,
  iridescence: 0.22,
  iridescenceIOR: 1.8,
  flatShading: true,
  side: THREE.DoubleSide
});

const diamondMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xf8f6ff,
  emissive: 0xbfc8ff,
  emissiveIntensity: 0.08,
  metalness: 0,
  roughness: 0.035,
  transmission: 0.72,
  thickness: 0.35,
  ior: 2.35,
  attenuationColor: new THREE.Color(0xdde7ff),
  attenuationDistance: 2.5,
  clearcoat: 1,
  clearcoatRoughness: 0.015,
  iridescence: 0.28,
  iridescenceIOR: 2,
  flatShading: true,
  transparent: true,
  opacity: 0.96
});

function createPearGeometry(segments = 18) {
  const rings = [
    { y: -1.38, r: 0.0, d: 0.0 },
    { y: -1.17, r: 0.25, d: 0.18 },
    { y: -0.87, r: 0.48, d: 0.29 },
    { y: -0.50, r: 0.67, d: 0.36 },
    { y: -0.10, r: 0.78, d: 0.41 },
    { y:  0.28, r: 0.75, d: 0.42 },
    { y:  0.57, r: 0.59, d: 0.35 },
    { y:  0.78, r: 0.32, d: 0.22 },
    { y:  0.91, r: 0.0, d: 0.0 }
  ];

  const positions = [];
  const indices = [];
  const bottomIndex = 0;
  positions.push(0, rings[0].y, 0);

  const ringStarts = [];
  for (let j = 1; j < rings.length - 1; j++) {
    ringStarts.push(positions.length / 3);
    const ring = rings[j];
    const offset = (j % 2) * Math.PI / segments;
    for (let i = 0; i < segments; i++) {
      const a = i / segments * Math.PI * 2 + offset;
      const facetPulse = 1 + 0.035 * Math.cos(a * 6 + j * 1.7);
      positions.push(
        Math.cos(a) * ring.r * facetPulse,
        ring.y,
        Math.sin(a) * ring.d * facetPulse
      );
    }
  }

  const topIndex = positions.length / 3;
  positions.push(0, rings[rings.length - 1].y, 0);

  for (let i = 0; i < segments; i++) {
    indices.push(bottomIndex, ringStarts[0] + (i + 1) % segments, ringStarts[0] + i);
  }

  for (let j = 0; j < ringStarts.length - 1; j++) {
    const aStart = ringStarts[j];
    const bStart = ringStarts[j + 1];
    for (let i = 0; i < segments; i++) {
      const i1 = (i + 1) % segments;
      if ((i + j) % 2 === 0) {
        indices.push(aStart + i, bStart + i1, bStart + i);
        indices.push(aStart + i, aStart + i1, bStart + i1);
      } else {
        indices.push(aStart + i, aStart + i1, bStart + i);
        indices.push(aStart + i1, bStart + i1, bStart + i);
      }
    }
  }

  const lastStart = ringStarts[ringStarts.length - 1];
  for (let i = 0; i < segments; i++) {
    indices.push(lastStart + i, lastStart + (i + 1) % segments, topIndex);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  return geometry;
}

function createBiconeGeometry(radius = 0.1, depth = 0.13, segments = 8) {
  const positions = [0, 0, depth, 0, 0, -depth];
  for (let i = 0; i < segments; i++) {
    const a = i / segments * Math.PI * 2;
    positions.push(Math.cos(a) * radius, Math.sin(a) * radius, 0);
  }

  const indices = [];
  for (let i = 0; i < segments; i++) {
    const current = 2 + i;
    const next = 2 + (i + 1) % segments;
    indices.push(0, current, next);
    indices.push(1, next, current);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const pendant = new THREE.Group();
pendant.position.y = -0.66;
necklace.add(pendant);

const outlinePoints = [
  new THREE.Vector3(0, 0.99, -0.03),
  new THREE.Vector3(0.43, 0.85, -0.03),
  new THREE.Vector3(0.73, 0.52, -0.03),
  new THREE.Vector3(0.88, 0.04, -0.03),
  new THREE.Vector3(0.77, -0.53, -0.03),
  new THREE.Vector3(0.46, -1.03, -0.03),
  new THREE.Vector3(0, -1.50, -0.03),
  new THREE.Vector3(-0.46, -1.03, -0.03),
  new THREE.Vector3(-0.77, -0.53, -0.03),
  new THREE.Vector3(-0.88, 0.04, -0.03),
  new THREE.Vector3(-0.73, 0.52, -0.03),
  new THREE.Vector3(-0.43, 0.85, -0.03)
];

const outlineCurve = new THREE.CatmullRomCurve3(outlinePoints, true, 'centripetal');
const frameGeometry = new THREE.TubeGeometry(outlineCurve, 180, 0.045, 7, true);
const frame = new THREE.Mesh(frameGeometry, platinum);
frame.castShadow = true;
frame.receiveShadow = true;
pendant.add(frame);

const innerBacking = new THREE.Mesh(createPearGeometry(18), darkMetal);
innerBacking.scale.set(1.075, 1.075, 0.44);
innerBacking.position.z = -0.18;
innerBacking.castShadow = true;
pendant.add(innerBacking);

const amethyst = new THREE.Mesh(createPearGeometry(18), amethystMaterial);
amethyst.scale.set(0.93, 0.93, 1.0);
amethyst.position.z = 0.10;
amethyst.castShadow = true;
amethyst.receiveShadow = true;
pendant.add(amethyst);

const innerFacet = new THREE.Mesh(
  new THREE.OctahedronGeometry(0.48, 0),
  new THREE.MeshBasicMaterial({
    color: 0xa837ff,
    transparent: true,
    opacity: 0.095,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
innerFacet.scale.set(1.05, 1.65, 0.55);
innerFacet.position.set(0, -0.08, 0.12);
pendant.add(innerFacet);

const haloGemGeometry = createBiconeGeometry(0.094, 0.075, 8);
const haloCount = 42;
for (let i = 0; i < haloCount; i++) {
  const u = i / haloCount;
  const point = outlineCurve.getPointAt(u);
  const gem = new THREE.Mesh(haloGemGeometry, diamondMaterial);
  gem.position.copy(point);
  gem.position.z = 0.075;
  gem.rotation.z = u * Math.PI * 8;
  gem.scale.set(1, 1, 0.82);
  gem.castShadow = true;
  pendant.add(gem);

  const seat = new THREE.Mesh(
    new THREE.CylinderGeometry(0.075, 0.085, 0.055, 8),
    platinum
  );
  seat.rotation.x = Math.PI / 2;
  seat.position.copy(point);
  seat.position.z = -0.005;
  pendant.add(seat);
}

const prongGeometry = new THREE.SphereGeometry(0.052, 10, 8);
const prongPositions = [
  [-0.36, 0.68], [0.36, 0.68],
  [-0.66, 0.08], [0.66, 0.08],
  [-0.40, -0.83], [0.40, -0.83],
  [0, -1.25]
];
for (const [x, y] of prongPositions) {
  const prong = new THREE.Mesh(prongGeometry, platinum);
  prong.position.set(x, y, 0.43);
  prong.scale.set(0.82, 1.15, 0.72);
  prong.castShadow = true;
  pendant.add(prong);
}

const bailOuter = new THREE.Mesh(
  new THREE.TorusGeometry(0.22, 0.055, 9, 26),
  platinum
);
bailOuter.position.set(0, 1.19, -0.01);
bailOuter.scale.y = 1.38;
bailOuter.castShadow = true;
pendant.add(bailOuter);

const bailGem = new THREE.Mesh(createBiconeGeometry(0.105, 0.085, 8), diamondMaterial);
bailGem.position.set(0, 1.19, 0.075);
bailGem.rotation.z = Math.PI / 8;
pendant.add(bailGem);

const chainCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-3.35, 2.68, -0.18),
  new THREE.Vector3(-2.86, 2.25, -0.12),
  new THREE.Vector3(-2.21, 1.76, -0.08),
  new THREE.Vector3(-1.45, 1.35, -0.05),
  new THREE.Vector3(-0.72, 1.10, -0.02),
  new THREE.Vector3(0, 1.02, 0),
  new THREE.Vector3(0.72, 1.10, -0.02),
  new THREE.Vector3(1.45, 1.35, -0.05),
  new THREE.Vector3(2.21, 1.76, -0.08),
  new THREE.Vector3(2.86, 2.25, -0.12),
  new THREE.Vector3(3.35, 2.68, -0.18)
], false, 'centripetal');

const chainWire = new THREE.Mesh(
  new THREE.TubeGeometry(chainCurve, 160, 0.025, 6, false),
  platinum
);
chainWire.castShadow = true;
necklace.add(chainWire);

const chainGemGeometry = createBiconeGeometry(0.088, 0.075, 8);
const chainGemCount = 67;
const yAxis = new THREE.Vector3(0, 1, 0);
for (let i = 0; i < chainGemCount; i++) {
  const u = i / (chainGemCount - 1);
  const point = chainCurve.getPointAt(u);
  const tangent = chainCurve.getTangentAt(u).normalize();
  const gem = new THREE.Mesh(chainGemGeometry, diamondMaterial);
  gem.position.copy(point);
  gem.position.z += 0.035;
  gem.quaternion.setFromUnitVectors(yAxis, tangent);
  gem.rotateY(i * 1.71);
  gem.scale.setScalar(i % 2 === 0 ? 0.9 : 0.78);
  gem.castShadow = true;
  necklace.add(gem);
}

function createSparkle(size, color) {
  const group = new THREE.Group();
  const material = new THREE.LineBasicMaterial({
    color,
    transparent: true,
    opacity: 0.72,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const longLine = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-size, 0, 0),
    new THREE.Vector3(size, 0, 0)
  ]);
  const shortLine = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(0, -size * 0.45, 0),
    new THREE.Vector3(0, size * 0.45, 0)
  ]);

  group.add(new THREE.Line(longLine, material));
  group.add(new THREE.Line(shortLine, material));

  const diagonalMaterial = material.clone();
  diagonalMaterial.opacity = 0.34;
  const diagonal = new THREE.Line(shortLine.clone(), diagonalMaterial);
  diagonal.rotation.z = Math.PI / 4;
  group.add(diagonal);

  const diagonal2 = diagonal.clone();
  diagonal2.rotation.z = -Math.PI / 4;
  group.add(diagonal2);
  group.userData.materials = [material, diagonalMaterial];
  return group;
}

const sparkles = [];
const sparkleData = [
  [-0.48, -0.10, 0.64, 0.27, 0xe5c8ff],
  [0.32, 0.35, 0.63, 0.20, 0xffffff],
  [0.62, -0.57, 0.55, 0.16, 0xc9d9ff],
  [-0.15, -0.89, 0.61, 0.15, 0xb45cff],
  [1.64, 1.38, 0.12, 0.13, 0xffffff],
  [-2.22, 1.77, 0.08, 0.12, 0xdbe5ff]
];

for (let i = 0; i < sparkleData.length; i++) {
  const [x, y, z, size, color] = sparkleData[i];
  const sparkle = createSparkle(size, color);
  if (i < 4) {
    sparkle.position.set(x, y, z);
    pendant.add(sparkle);
  } else {
    sparkle.position.set(x, y, z);
    necklace.add(sparkle);
  }
  sparkle.userData.phase = i * 1.17;
  sparkles.push(sparkle);
}

const backdrop = new THREE.Mesh(
  new THREE.CircleGeometry(5.8, 96),
  new THREE.MeshStandardMaterial({
    color: 0x10091c,
    roughness: 0.84,
    metalness: 0.08
  })
);
backdrop.position.set(0, 0.2, -1.1);
backdrop.receiveShadow = true;
scene.add(backdrop);

const ambient = new THREE.HemisphereLight(0x8f78cc, 0x120818, 1.7);
scene.add(ambient);

const key = new THREE.SpotLight(0xe7ddff, 110, 16, Math.PI / 5.5, 0.45, 1.2);
key.position.set(-3.4, 5.1, 5.5);
key.target.position.set(0, 0, 0);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.bias = -0.0002;
scene.add(key, key.target);

const violetLight = new THREE.PointLight(0x8f2dff, 42, 9, 1.7);
violetLight.position.set(2.6, -0.5, 3.4);
scene.add(violetLight);

const rim = new THREE.DirectionalLight(0xb9ddff, 3.8);
rim.position.set(4, 3, -1);
scene.add(rim);

const lowerGlow = new THREE.PointLight(0xe8baff, 18, 6, 2);
lowerGlow.position.set(-1.6, -2.8, 2.2);
scene.add(lowerGlow);

const clock = new THREE.Clock();

function render() {
  const time = clock.getElapsedTime();
  controls.update();

  innerFacet.rotation.y = time * 0.32;
  innerFacet.rotation.z = Math.sin(time * 0.45) * 0.12;

  for (let i = 0; i < sparkles.length; i++) {
    const sparkle = sparkles[i];
    const pulse = 0.42 + 0.58 * Math.pow(Math.max(0, Math.sin(time * 1.65 + sparkle.userData.phase)), 5);
    sparkle.scale.setScalar(0.72 + pulse * 0.42);
    sparkle.rotation.z = Math.sin(time * 0.28 + i) * 0.16;
    for (const material of sparkle.userData.materials) {
      material.opacity = Math.min(0.92, pulse * 0.78);
    }
  }

  violetLight.intensity = 39 + Math.sin(time * 1.1) * 4;
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
