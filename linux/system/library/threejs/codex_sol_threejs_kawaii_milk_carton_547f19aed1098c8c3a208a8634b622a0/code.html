<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kawaii Milk Carton</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #eaf8ff;
    }
    canvas {
      display: block;
      touch-action: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xeaf8ff);
  scene.fog = new THREE.Fog(0xeaf8ff, 15, 27);

  const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(7.4, 4.5, 10.5);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.15, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.enablePan = false;
  controls.minDistance = 7;
  controls.maxDistance = 18;
  controls.minPolarAngle = Math.PI * 0.24;
  controls.maxPolarAngle = Math.PI * 0.54;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.65;

  const hemi = new THREE.HemisphereLight(0xffffff, 0x9fc5d8, 2.25);
  scene.add(hemi);

  const key = new THREE.DirectionalLight(0xffffff, 3.6);
  key.position.set(5, 9, 7);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -7;
  key.shadow.camera.right = 7;
  key.shadow.camera.top = 8;
  key.shadow.camera.bottom = -6;
  key.shadow.camera.near = 0.5;
  key.shadow.camera.far = 28;
  key.shadow.bias = -0.00025;
  key.shadow.normalBias = 0.025;
  scene.add(key);

  const fill = new THREE.DirectionalLight(0xb9e9ff, 1.45);
  fill.position.set(-6, 4, 5);
  scene.add(fill);

  const rim = new THREE.PointLight(0xffd8eb, 32, 16, 2);
  rim.position.set(-4, 3.5, -4);
  scene.add(rim);

  const blue = new THREE.MeshPhysicalMaterial({
    color: 0x8fd8f5,
    roughness: 0.29,
    metalness: 0,
    clearcoat: 0.58,
    clearcoatRoughness: 0.2
  });

  const blueDark = new THREE.MeshPhysicalMaterial({
    color: 0x62bddf,
    roughness: 0.31,
    clearcoat: 0.4,
    clearcoatRoughness: 0.22
  });

  const white = new THREE.MeshPhysicalMaterial({
    color: 0xfffdf8,
    roughness: 0.26,
    clearcoat: 0.42,
    clearcoatRoughness: 0.2
  });

  const pink = new THREE.MeshPhysicalMaterial({
    color: 0xff91b9,
    roughness: 0.3,
    clearcoat: 0.45,
    clearcoatRoughness: 0.18
  });

  const dark = new THREE.MeshPhysicalMaterial({
    color: 0x172b4f,
    roughness: 0.2,
    clearcoat: 0.75,
    clearcoatRoughness: 0.12
  });

  const character = new THREE.Group();
  character.position.y = 0.15;
  scene.add(character);

  const cartonShape = new THREE.Shape();
  cartonShape.moveTo(-2.0, -2.45);
  cartonShape.lineTo(2.0, -2.45);
  cartonShape.lineTo(2.0, 1.65);
  cartonShape.lineTo(0.82, 2.93);
  cartonShape.lineTo(-0.82, 2.93);
  cartonShape.lineTo(-2.0, 1.65);
  cartonShape.closePath();

  const cartonGeometry = new THREE.ExtrudeGeometry(cartonShape, {
    depth: 2.85,
    bevelEnabled: true,
    bevelSegments: 5,
    steps: 1,
    bevelSize: 0.11,
    bevelThickness: 0.11,
    curveSegments: 8
  });
  cartonGeometry.translate(0, 0, -1.425);
  cartonGeometry.computeVertexNormals();

  const body = new THREE.Mesh(cartonGeometry, blue);
  body.castShadow = true;
  body.receiveShadow = true;
  character.add(body);

  const sidePanel = new THREE.Mesh(
    new RoundedBoxGeometry(0.055, 3.6, 2.3, 4, 0.025),
    blueDark
  );
  sidePanel.position.set(2.065, -0.35, -0.02);
  sidePanel.castShadow = true;
  character.add(sidePanel);

  const gableShape = new THREE.Shape();
  gableShape.moveTo(-1.76, 1.69);
  gableShape.lineTo(1.76, 1.69);
  gableShape.lineTo(0.69, 2.82);
  gableShape.lineTo(-0.69, 2.82);
  gableShape.closePath();

  const gable = new THREE.Mesh(new THREE.ShapeGeometry(gableShape), white);
  gable.position.z = 1.548;
  gable.castShadow = true;
  character.add(gable);

  const ridge = new THREE.Mesh(
    new RoundedBoxGeometry(1.9, 0.29, 3.1, 5, 0.1),
    white
  );
  ridge.position.set(0, 2.91, 0);
  ridge.castShadow = true;
  character.add(ridge);

  const ridgeStripe = new THREE.Mesh(
    new RoundedBoxGeometry(1.98, 0.075, 3.14, 4, 0.03),
    blueDark
  );
  ridgeStripe.position.set(0, 2.92, 0);
  ridgeStripe.castShadow = true;
  character.add(ridgeStripe);

  const foldMaterial = new THREE.MeshStandardMaterial({
    color: 0x70bedc,
    roughness: 0.45
  });

  function addFold(x1, y1, x2, y2) {
    const curve = new THREE.LineCurve3(
      new THREE.Vector3(x1, y1, 1.575),
      new THREE.Vector3(x2, y2, 1.575)
    );
    const fold = new THREE.Mesh(
      new THREE.TubeGeometry(curve, 1, 0.025, 8, false),
      foldMaterial
    );
    character.add(fold);
  }

  addFold(-1.76, 1.7, -0.68, 2.81);
  addFold(1.76, 1.7, 0.68, 2.81);
  addFold(-0.68, 2.81, 0.68, 2.81);

  const labelCanvas = document.createElement('canvas');
  labelCanvas.width = 1024;
  labelCanvas.height = 1024;
  const ctx = labelCanvas.getContext('2d');

  ctx.clearRect(0, 0, 1024, 1024);
  ctx.fillStyle = '#fffdf8';
  ctx.beginPath();
  ctx.roundRect(34, 34, 956, 956, 96);
  ctx.fill();

  ctx.lineWidth = 17;
  ctx.strokeStyle = '#78c9e7';
  ctx.beginPath();
  ctx.roundRect(45, 45, 934, 934, 86);
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '900 150px "Arial Rounded MT Bold", "Trebuchet MS", sans-serif';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 24;
  ctx.strokeStyle = '#ffffff';
  ctx.strokeText('MILKY!', 512, 190);
  ctx.fillStyle = '#58b7dc';
  ctx.fillText('MILKY!', 512, 190);

  ctx.save();
  ctx.translate(512, 370);

  ctx.fillStyle = '#fffef9';
  ctx.strokeStyle = '#4da9cf';
  ctx.lineWidth = 14;
  ctx.beginPath();
  ctx.ellipse(0, 0, 126, 105, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#4da9cf';
  ctx.beginPath();
  ctx.ellipse(-75, -44, 41, 31, -0.45, 0, Math.PI * 2);
  ctx.ellipse(69, -52, 34, 42, 0.55, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#fffef9';
  ctx.strokeStyle = '#4da9cf';
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.ellipse(-125, -45, 48, 29, -0.4, 0, Math.PI * 2);
  ctx.ellipse(125, -45, 48, 29, 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#ffadc7';
  ctx.strokeStyle = '#4da9cf';
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.ellipse(0, 52, 83, 54, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = '#203656';
  ctx.beginPath();
  ctx.arc(-47, 4, 12, 0, Math.PI * 2);
  ctx.arc(47, 4, 12, 0, Math.PI * 2);
  ctx.arc(-29, 48, 8, 0, Math.PI * 2);
  ctx.arc(29, 48, 8, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#203656';
  ctx.lineWidth = 8;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(0, 54, 37, 0.25, Math.PI - 0.25);
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle = '#7bc9e5';
  ctx.font = '700 45px "Arial Rounded MT Bold", "Trebuchet MS", sans-serif';
  ctx.fillText('HAPPY FARM', 512, 525);

  const labelTexture = new THREE.CanvasTexture(labelCanvas);
  labelTexture.colorSpace = THREE.SRGBColorSpace;
  labelTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

  const labelMaterial = new THREE.MeshBasicMaterial({
    map: labelTexture,
    transparent: true,
    toneMapped: false
  });

  const label = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 3.4), labelMaterial);
  label.position.set(0, -0.13, 1.585);
  character.add(label);

  function makeEye(x) {
    const eye = new THREE.Group();

    const base = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), dark);
    base.scale.set(0.52, 0.68, 0.19);
    base.castShadow = true;
    eye.add(base);

    const lowerGlow = new THREE.Mesh(
      new THREE.SphereGeometry(1, 28, 18),
      new THREE.MeshPhysicalMaterial({
        color: 0x559bd0,
        roughness: 0.18,
        clearcoat: 0.8,
        clearcoatRoughness: 0.1
      })
    );
    lowerGlow.scale.set(0.27, 0.18, 0.065);
    lowerGlow.position.set(0, -0.28, 0.175);
    eye.add(lowerGlow);

    const shineLarge = new THREE.Mesh(
      new THREE.SphereGeometry(1, 24, 16),
      new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false })
    );
    shineLarge.scale.setScalar(0.16);
    shineLarge.position.set(-0.17, 0.23, 0.2);
    eye.add(shineLarge);

    const shineSmall = new THREE.Mesh(
      new THREE.SphereGeometry(1, 20, 14),
      new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false })
    );
    shineSmall.scale.setScalar(0.075);
    shineSmall.position.set(0.18, 0.05, 0.205);
    eye.add(shineSmall);

    const sparkle = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.09, 0),
      new THREE.MeshBasicMaterial({ color: 0xd9f7ff, toneMapped: false })
    );
    sparkle.scale.set(0.65, 1.35, 0.45);
    sparkle.position.set(0.16, 0.28, 0.21);
    eye.add(sparkle);

    eye.position.set(x, -0.22, 1.76);
    character.add(eye);
  }

  makeEye(-0.76);
  makeEye(0.76);

  function makeCheek(x) {
    const cheek = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 20), pink);
    cheek.scale.set(0.43, 0.19, 0.09);
    cheek.position.set(x, -0.82, 1.76);
    cheek.castShadow = true;
    character.add(cheek);

    const gleam = new THREE.Mesh(
      new THREE.SphereGeometry(1, 16, 10),
      new THREE.MeshBasicMaterial({ color: 0xffd9e7, toneMapped: false })
    );
    gleam.scale.set(0.11, 0.035, 0.025);
    gleam.position.set(x - 0.08, -0.77, 1.85);
    character.add(gleam);
  }

  makeCheek(-1.34);
  makeCheek(1.34);

  const smileCurve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(-0.43, -0.76, 1.84),
    new THREE.Vector3(0, -1.18, 1.9),
    new THREE.Vector3(0.43, -0.76, 1.84)
  );
  const smile = new THREE.Mesh(
    new THREE.TubeGeometry(smileCurve, 24, 0.075, 12, false),
    new THREE.MeshPhysicalMaterial({
      color: 0x6a2946,
      roughness: 0.33,
      clearcoat: 0.35
    })
  );
  character.add(smile);

  const tongue = new THREE.Mesh(
    new THREE.SphereGeometry(1, 28, 16, 0, Math.PI * 2, 0, Math.PI * 0.54),
    pink
  );
  tongue.scale.set(0.22, 0.12, 0.055);
  tongue.rotation.x = Math.PI;
  tongue.position.set(0, -1.0, 1.87);
  character.add(tongue);

  function makeArm(side) {
    const arm = new THREE.Group();
    const angle = side < 0 ? 0.78 : -0.78;

    const limb = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.24, 0.78, 8, 20),
      blue
    );
    limb.rotation.z = angle;
    limb.castShadow = true;
    arm.add(limb);

    const outward = new THREE.Vector3(-Math.sin(angle), Math.cos(angle), 0);
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.31, 28, 20), white);
    hand.position.copy(outward.multiplyScalar(0.65));
    hand.scale.set(1.05, 0.93, 0.9);
    hand.castShadow = true;
    arm.add(hand);

    arm.position.set(side * 2.13, -0.19, 0.4);
    character.add(arm);
  }

  makeArm(-1);
  makeArm(1);

  function makeFoot(x) {
    const foot = new THREE.Mesh(
      new RoundedBoxGeometry(0.8, 0.42, 1.0, 5, 0.18),
      blueDark
    );
    foot.position.set(x, -2.62, 0.42);
    foot.rotation.y = x < 0 ? -0.13 : 0.13;
    foot.castShadow = true;
    foot.receiveShadow = true;
    character.add(foot);
  }

  makeFoot(-0.93);
  makeFoot(0.93);

  character.traverse(object => {
    if (object.isMesh) {
      object.castShadow = true;
      object.receiveShadow = true;
    }
  });

  const groundMaterial = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    roughness: 0.9,
    transparent: true,
    opacity: 0.74
  });
  const ground = new THREE.Mesh(new THREE.CircleGeometry(8, 96), groundMaterial);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -2.71;
  ground.receiveShadow = true;
  scene.add(ground);

  const halo = new THREE.Mesh(
    new THREE.RingGeometry(3.6, 5.7, 96),
    new THREE.MeshBasicMaterial({
      color: 0xd6f3ff,
      transparent: true,
      opacity: 0.42,
      side: THREE.DoubleSide,
      depthWrite: false
    })
  );
  halo.rotation.x = -Math.PI / 2;
  halo.position.y = -2.695;
  scene.add(halo);

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const t = clock.getElapsedTime();
    character.position.y = 0.15 + Math.sin(t * 1.7) * 0.035;
    character.rotation.z = Math.sin(t * 1.05) * 0.012;
    controls.update();
    renderer.render(scene, camera);
  }

  animate();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
  });
</script>
</body>
</html>
