<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compact Pickup Truck</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #c9d3d7; }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(25, 34, 38, 0.72);
      font: 500 12px/1.4 system-ui, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Compact Utility Pickup</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xc9d4d8);
    scene.fog = new THREE.Fog(0xc9d4d8, 16, 32);

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(7.6, 4.4, 8.7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.05, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.7;
    controls.minDistance = 5;
    controls.maxDistance = 16;
    controls.maxPolarAngle = Math.PI * 0.48;

    const hemi = new THREE.HemisphereLight(0xeaf5ff, 0x576057, 2.2);
    scene.add(hemi);

    const keyLight = new THREE.DirectionalLight(0xfff3df, 4.2);
    keyLight.position.set(-5, 9, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -8;
    keyLight.shadow.camera.right = 8;
    keyLight.shadow.camera.top = 7;
    keyLight.shadow.camera.bottom = -5;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 24;
    keyLight.shadow.bias = -0.00025;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x9cc7ff, 1.5);
    rimLight.position.set(6, 4, -7);
    scene.add(rimLight);

    const paint = new THREE.MeshPhysicalMaterial({
      color: 0x234d4a,
      metalness: 0.55,
      roughness: 0.28,
      clearcoat: 0.85,
      clearcoatRoughness: 0.2
    });
    const darkPaint = new THREE.MeshStandardMaterial({
      color: 0x183735,
      metalness: 0.45,
      roughness: 0.34
    });
    const black = new THREE.MeshStandardMaterial({ color: 0x111416, roughness: 0.68, metalness: 0.12 });
    const rubber = new THREE.MeshStandardMaterial({ color: 0x111214, roughness: 0.92 });
    const trim = new THREE.MeshStandardMaterial({ color: 0x252a2c, roughness: 0.48, metalness: 0.38 });
    const chrome = new THREE.MeshStandardMaterial({ color: 0xc7ced0, roughness: 0.2, metalness: 0.92 });
    const wheelMetal = new THREE.MeshStandardMaterial({ color: 0x8a9497, roughness: 0.28, metalness: 0.88 });
    const glass = new THREE.MeshPhysicalMaterial({
      color: 0x182b32,
      roughness: 0.12,
      metalness: 0.1,
      transmission: 0.18,
      transparent: true,
      opacity: 0.82,
      side: THREE.DoubleSide
    });
    const headlamp = new THREE.MeshPhysicalMaterial({
      color: 0xf5f2d8,
      emissive: 0xffe8b0,
      emissiveIntensity: 0.45,
      roughness: 0.12,
      metalness: 0.15,
      clearcoat: 1
    });
    const amber = new THREE.MeshStandardMaterial({
      color: 0xff8c18,
      emissive: 0xff5b00,
      emissiveIntensity: 0.35,
      roughness: 0.25
    });
    const redLens = new THREE.MeshStandardMaterial({
      color: 0xa30d0d,
      emissive: 0x5d0000,
      emissiveIntensity: 0.75,
      roughness: 0.25
    });
    const whiteLens = new THREE.MeshStandardMaterial({
      color: 0xe8e1cf,
      emissive: 0x9b8f72,
      emissiveIntensity: 0.22,
      roughness: 0.2
    });

    const truck = new THREE.Group();
    truck.rotation.y = -0.08;
    scene.add(truck);

    function addBox(size, position, material, parent = truck, rotation = null) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material);
      mesh.position.set(position[0], position[1], position[2]);
      if (rotation) mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder(radiusTop, radiusBottom, height, segments, position, material, parent = truck, rotation = null) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
        material
      );
      mesh.position.set(position[0], position[1], position[2]);
      if (rotation) mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    addBox([4.95, 0.53, 1.72], [0, 0.91, 0], paint);
    addBox([4.48, 0.18, 1.52], [0.08, 0.61, 0], black);
    addBox([1.48, 0.18, 1.7], [-1.78, 1.25, 0], paint, truck, [0, 0, -0.035]);
    addBox([1.34, 0.05, 1.49], [-1.77, 1.355, 0], darkPaint, truck, [0, 0, -0.035]);

    const cabShape = new THREE.Shape();
    cabShape.moveTo(-1.18, 1.22);
    cabShape.lineTo(-1.02, 1.84);
    cabShape.lineTo(-0.73, 2.16);
    cabShape.lineTo(0.08, 2.16);
    cabShape.lineTo(0.37, 1.93);
    cabShape.lineTo(0.4, 1.22);
    cabShape.closePath();

    const cabGeometry = new THREE.ExtrudeGeometry(cabShape, {
      depth: 1.58,
      bevelEnabled: true,
      bevelSegments: 2,
      bevelSize: 0.045,
      bevelThickness: 0.045,
      curveSegments: 1
    });
    cabGeometry.translate(0, 0, -0.79);
    const cab = new THREE.Mesh(cabGeometry, paint);
    cab.castShadow = true;
    cab.receiveShadow = true;
    truck.add(cab);

    addBox([1.02, 0.12, 1.54], [-0.29, 2.17, 0], paint);
    addBox([0.08, 0.08, 1.52], [-1.15, 1.36, 0], trim);

    function sideWindow(side) {
      const shape = new THREE.Shape();
      shape.moveTo(-0.98, 1.82);
      shape.lineTo(-0.70, 2.09);
      shape.lineTo(-0.18, 2.09);
      shape.lineTo(-0.18, 1.48);
      shape.lineTo(-0.91, 1.48);
      shape.closePath();
      const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), glass);
      mesh.position.z = side * 0.838;
      mesh.castShadow = true;
      truck.add(mesh);

      const rearShape = new THREE.Shape();
      rearShape.moveTo(-0.12, 2.09);
      rearShape.lineTo(0.04, 2.09);
      rearShape.lineTo(0.30, 1.88);
      rearShape.lineTo(0.30, 1.48);
      rearShape.lineTo(-0.12, 1.48);
      rearShape.closePath();
      const rearMesh = new THREE.Mesh(new THREE.ShapeGeometry(rearShape), glass);
      rearMesh.position.z = side * 0.839;
      truck.add(rearMesh);

      addBox([0.045, 0.64, 0.025], [-0.15, 1.79, side * 0.852], trim);
      addBox([0.035, 0.075, 0.045], [-0.50, 1.33, side * 0.875], chrome);
      addBox([1.35, 0.025, 0.027], [-0.32, 1.43, side * 0.858], trim);
      addBox([0.025, 0.55, 0.027], [-1.07, 1.68, side * 0.858], trim, truck, [0, 0, -0.05]);
      addBox([0.025, 0.58, 0.027], [0.34, 1.69, side * 0.858], trim);
      addBox([1.38, 0.025, 0.027], [-0.34, 1.17, side * 0.858], trim);
    }
    sideWindow(1);
    sideWindow(-1);

    const windshieldGeometry = new THREE.BufferGeometry();
    const windshieldVertices = new Float32Array([
      -1.055, 1.83, -0.70,
      -0.735, 2.115, -0.70,
      -0.735, 2.115,  0.70,
      -1.055, 1.83, -0.70,
      -0.735, 2.115,  0.70,
      -1.055, 1.83,  0.70
    ]);
    windshieldGeometry.setAttribute('position', new THREE.BufferAttribute(windshieldVertices, 3));
    windshieldGeometry.computeVertexNormals();
    const windshield = new THREE.Mesh(windshieldGeometry, glass);
    windshield.castShadow = true;
    truck.add(windshield);

    addBox([0.025, 0.46, 1.18], [0.378, 1.82, 0], glass, truck, [0, 0, -0.04]);
    addBox([0.04, 0.47, 0.055], [0.398, 1.82, 0], trim, truck, [0, 0, -0.04]);

    for (const side of [-1, 1]) {
      const mirrorGroup = new THREE.Group();
      mirrorGroup.position.set(-0.91, 1.72, side * 0.94);
      truck.add(mirrorGroup);
      addBox([0.08, 0.08, 0.16], [0, 0, side * 0.02], trim, mirrorGroup);
      const mirror = addBox([0.22, 0.15, 0.08], [0.02, 0.055, side * 0.14], trim, mirrorGroup);
      mirror.rotation.x = side * -0.08;
    }

    addBox([2.12, 0.10, 1.43], [1.43, 0.94, 0], black);
    addBox([2.08, 0.06, 1.34], [1.42, 1.02, 0], trim);

    for (const side of [-1, 1]) {
      addBox([2.15, 0.54, 0.13], [1.43, 1.25, side * 0.79], paint);
      addBox([2.02, 0.08, 0.08], [1.43, 1.55, side * 0.75], darkPaint);
      addBox([1.9, 0.28, 0.035], [1.43, 1.28, side * 0.705], darkPaint);
    }
    addBox([0.13, 0.56, 1.58], [0.38, 1.27, 0], paint);
    addBox([0.035, 0.42, 1.30], [0.46, 1.28, 0], darkPaint);

    addBox([0.16, 0.56, 1.58], [2.49, 1.27, 0], paint);
    addBox([0.035, 0.38, 1.28], [2.395, 1.28, 0], darkPaint);
    addBox([0.025, 0.025, 0.35], [2.405, 1.33, 0], chrome);

    for (const side of [-1, 1]) {
      addBox([0.035, 0.34, 0.24], [2.585, 1.30, side * 0.61], redLens);
      addBox([0.037, 0.10, 0.22], [2.59, 1.45, side * 0.61], whiteLens);
    }

    addBox([0.18, 0.19, 1.82], [2.58, 0.69, 0], chrome);
    addBox([0.10, 0.10, 1.62], [2.67, 0.76, 0], trim);

    addBox([0.14, 0.48, 1.58], [-2.51, 1.02, 0], paint);
    addBox([0.075, 0.35, 0.86], [-2.595, 1.08, 0], trim);

    for (let z = -0.31; z <= 0.31; z += 0.155) {
      addBox([0.035, 0.25, 0.045], [-2.64, 1.08, z], chrome);
    }
    addBox([0.04, 0.04, 0.80], [-2.65, 1.20, 0], chrome);
    addBox([0.04, 0.04, 0.80], [-2.65, 0.97, 0], chrome);

    for (const side of [-1, 1]) {
      addBox([0.05, 0.26, 0.43], [-2.59, 1.17, side * 0.59], headlamp);
      addBox([0.055, 0.11, 0.23], [-2.60, 0.96, side * 0.64], amber);
    }

    addBox([0.18, 0.20, 1.84], [-2.61, 0.68, 0], chrome);
    addBox([0.10, 0.09, 1.66], [-2.72, 0.74, 0], trim);
    addBox([0.035, 0.18, 0.46], [-2.777, 0.78, 0], whiteLens);

    function createWheel(x, side) {
      const wheel = new THREE.Group();
      wheel.position.set(x, 0.58, side * 0.89);
      truck.add(wheel);

      const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.49, 0.49, 0.34, 32, 1), rubber);
      tire.rotation.x = Math.PI / 2;
      tire.castShadow = true;
      tire.receiveShadow = true;
      wheel.add(tire);

      const outerZ = side * 0.185;
      const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.285, 0.285, 0.355, 24), wheelMetal);
      rim.rotation.x = Math.PI / 2;
      rim.castShadow = true;
      wheel.add(rim);

      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.105, 0.375, 20), chrome);
      hub.rotation.x = Math.PI / 2;
      wheel.add(hub);

      const face = new THREE.Group();
      face.position.z = outerZ;
      wheel.add(face);
      for (let i = 0; i < 6; i++) {
        const angle = i * Math.PI / 3;
        const spoke = addBox([0.055, 0.24, 0.025], [0, 0, 0], chrome, face);
        spoke.rotation.z = angle;
      }

      for (let i = 0; i < 5; i++) {
        const angle = i * Math.PI * 2 / 5;
        const bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.025, 10), black);
        bolt.rotation.x = Math.PI / 2;
        bolt.position.set(Math.cos(angle) * 0.075, Math.sin(angle) * 0.075, side * 0.018);
        face.add(bolt);
      }
    }

    for (const x of [-1.65, 1.58]) {
      createWheel(x, 1);
      createWheel(x, -1);
    }

    for (const side of [-1, 1]) {
      for (const x of [-1.65, 1.58]) {
        const arch = new THREE.Mesh(
          new THREE.TorusGeometry(0.53, 0.055, 8, 30, Math.PI),
          paint
        );
        arch.position.set(x, 0.61, side * 0.895);
        arch.position.y += 0.02;
        arch.material = paint;
        arch.castShadow = true;
        truck.add(arch);
      }
    }

    addCylinder(0.06, 0.075, 0.38, 16, [2.18, 0.43, -0.52], trim, truck, [Math.PI / 2, 0, 0]);
    addCylinder(0.075, 0.075, 0.28, 16, [2.18, 0.39, -0.72], trim, truck, [0, 0, Math.PI / 2]);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(14, 96),
      new THREE.MeshStandardMaterial({ color: 0xaeb9b5, roughness: 0.93, metalness: 0.02 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0.075;
    ground.receiveShadow = true;
    scene.add(ground);

    const platform = new THREE.Mesh(
      new THREE.CylinderGeometry(4.5, 4.7, 0.14, 96),
      new THREE.MeshStandardMaterial({ color: 0x7f8987, roughness: 0.72, metalness: 0.1 })
    );
    platform.position.y = 0;
    platform.receiveShadow = true;
    scene.add(platform);

    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(4.52, 0.035, 8, 96),
      new THREE.MeshStandardMaterial({ color: 0xc8cfcd, roughness: 0.35, metalness: 0.65 })
    );
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.08;
    scene.add(ring);

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    }
    addEventListener('resize', resize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
