<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carved Wood Chimera</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17100c}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17100c);
scene.fog = new THREE.FogExp2(0x17100c, 0.027);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.7, 5.7, 10.3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.target.set(0, 2.3, 0);
controls.minDistance = 8;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.48;

const walnut = new THREE.MeshStandardMaterial({
  color: 0x70401f,
  roughness: 0.48,
  metalness: 0.02,
  flatShading: true
});
const walnutLight = new THREE.MeshStandardMaterial({
  color: 0xa66a35,
  roughness: 0.38,
  metalness: 0.015,
  flatShading: true
});
const walnutEdge = new THREE.MeshStandardMaterial({
  color: 0xc58a4b,
  roughness: 0.3,
  metalness: 0.01,
  flatShading: true
});
const recess = new THREE.MeshStandardMaterial({
  color: 0x2b140a,
  roughness: 0.72,
  metalness: 0,
  flatShading: true
});
const darkWood = new THREE.MeshStandardMaterial({
  color: 0x44200e,
  roughness: 0.56,
  metalness: 0,
  flatShading: true
});
const eyeWood = new THREE.MeshStandardMaterial({
  color: 0x160b06,
  roughness: 0.24,
  metalness: 0.04
});

const chimera = new THREE.Group();
chimera.rotation.y = -0.16;
scene.add(chimera);

function finish(mesh, shadow = true) {
  mesh.castShadow = shadow;
  mesh.receiveShadow = shadow;
  return mesh;
}

function ellipsoid(name, position, scale, material = walnut, segments = 12) {
  const geometry = new THREE.SphereGeometry(1, segments, Math.max(6, Math.floor(segments * 0.72)));
  const mesh = finish(new THREE.Mesh(geometry, material));
  mesh.name = name;
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  chimera.add(mesh);
  return mesh;
}

function coneBetween(a, b, radiusA, radiusB, material = walnut, radial = 8) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(radiusB, radiusA, length, radial, 1, false);
  const mesh = finish(new THREE.Mesh(geometry, material));
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  chimera.add(mesh);
  return mesh;
}

function taperedLimb(points, radii, material = walnut) {
  for (let i = 0; i < points.length - 1; i++) {
    coneBetween(points[i], points[i + 1], radii[i], radii[i + 1], material, 8);
  }
}

function tube(points, radius, material = darkWood, radial = 6, tubular = 48, closed = false) {
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = finish(new THREE.Mesh(
    new THREE.TubeGeometry(curve, tubular, radius, radial, closed),
    material
  ));
  chimera.add(mesh);
  return mesh;
}

function disk(position, scale, rotation, material = recess) {
  const mesh = finish(new THREE.Mesh(new THREE.CircleGeometry(1, 12), material));
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.rotation.set(rotation.x, rotation.y, rotation.z);
  chimera.add(mesh);
  return mesh;
}

function addClaw(x, y, z, angle = 0) {
  const claw = finish(new THREE.Mesh(new THREE.ConeGeometry(0.085, 0.3, 7), walnutEdge));
  claw.position.set(x, y, z);
  claw.rotation.z = -Math.PI / 2;
  claw.rotation.y = angle;
  chimera.add(claw);
}

function tuft(position, scale, rotation = new THREE.Euler(), material = walnutLight) {
  const geometry = new THREE.ConeGeometry(1, 2, 7, 1, false);
  const mesh = finish(new THREE.Mesh(geometry, material));
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.rotation.copy(rotation);
  chimera.add(mesh);
  return mesh;
}

function ringGroove(center, radius, tubeRadius, rotation, material = recess, arc = Math.PI * 2) {
  const mesh = finish(new THREE.Mesh(
    new THREE.TorusGeometry(radius, tubeRadius, 5, 22, arc),
    material
  ));
  mesh.position.copy(center);
  mesh.rotation.copy(rotation);
  chimera.add(mesh);
  return mesh;
}

ellipsoid('lion torso', new THREE.Vector3(-0.25, 2.42, 0), new THREE.Vector3(2.5, 1.03, 1.06), walnut, 16);
ellipsoid('chest', new THREE.Vector3(1.62, 2.52, 0), new THREE.Vector3(1.12, 1.2, 1.12), walnutLight, 13);
ellipsoid('haunch', new THREE.Vector3(-1.82, 2.35, 0), new THREE.Vector3(1.18, 1.22, 1.12), walnut, 13);
ellipsoid('belly shadow', new THREE.Vector3(-0.2, 1.93, 0), new THREE.Vector3(1.62, 0.28, 0.88), darkWood, 12);

const grainLines = [
  [-2.0,2.86,-0.97,-1.1,3.18,-1.04,0.1,3.22,-1.05,1.18,3.05,-0.96],
  [-2.15,2.61,-1.03,-1.2,2.84,-1.12,0.05,2.91,-1.13,1.32,2.78,-1.02],
  [-1.94,2.35,-1.04,-0.8,2.55,-1.12,0.4,2.52,-1.12,1.46,2.48,-1.01],
  [-1.75,3.07,-0.79,-0.7,3.38,-0.82,0.44,3.34,-0.82,1.42,3.08,-0.76]
];
for (const g of grainLines) {
  tube([
    new THREE.Vector3(g[0],g[1],g[2]),
    new THREE.Vector3(g[3],g[4],g[5]),
    new THREE.Vector3(g[6],g[7],g[8]),
    new THREE.Vector3(g[9],g[10],g[11])
  ], 0.025, recess, 5, 30);
}
for (let i = 0; i < 8; i++) {
  const x = -1.75 + i * 0.43;
  tube([
    new THREE.Vector3(x, 2.0, -0.91),
    new THREE.Vector3(x + 0.08, 2.32, -1.075),
    new THREE.Vector3(x + 0.13, 2.68, -1.07)
  ], 0.018, darkWood, 5, 12);
}

const legData = [
  [1.28,0.67, 1.18,0.66],
  [1.24,-0.68, 1.14,-0.72],
  [-1.48,0.72, -1.64,0.74],
  [-1.68,-0.65, -1.82,-0.67]
];
for (let i = 0; i < legData.length; i++) {
  const d = legData[i];
  const back = i > 1;
  const p0 = new THREE.Vector3(d[0], 2.25, d[1]);
  const p1 = new THREE.Vector3(d[2] + (back ? 0.17 : -0.08), 1.32, d[3]);
  const p2 = new THREE.Vector3(d[2], 0.52, d[3]);
  taperedLimb([p0,p1,p2], [0.42,0.29,0.22], walnut, 8);
  ellipsoid('paw', new THREE.Vector3(d[2] + 0.11, 0.34, d[3]), new THREE.Vector3(0.48,0.22,0.38), walnutLight, 10);
  for (let c = -1; c <= 1; c++) addClaw(d[2] + 0.42, 0.29, d[3] + c * 0.16, c * 0.06);
  tube([
    new THREE.Vector3(d[2] - 0.12, 1.14, d[3] - 0.27),
    new THREE.Vector3(d[2] - 0.06, 0.9, d[3] - 0.3),
    new THREE.Vector3(d[2] + 0.02, 0.66, d[3] - 0.28)
  ], 0.018, recess, 5, 10);
}

const lionNeckA = new THREE.Vector3(1.62, 2.92, 0);
const lionNeckB = new THREE.Vector3(2.42, 3.67, 0);
coneBetween(lionNeckA, lionNeckB, 0.82, 0.65, walnut, 10);
ellipsoid('lion head', new THREE.Vector3(2.68, 3.92, 0), new THREE.Vector3(0.88,0.78,0.76), walnutLight, 12);
ellipsoid('lion muzzle', new THREE.Vector3(3.33, 3.7, 0), new THREE.Vector3(0.68,0.42,0.58), walnutEdge, 10);
ellipsoid('nose', new THREE.Vector3(3.79, 3.82, 0), new THREE.Vector3(0.22,0.18,0.34), darkWood, 8);

for (const side of [-1,1]) {
  ellipsoid('lion brow', new THREE.Vector3(3.03,4.17,side*0.48), new THREE.Vector3(0.4,0.14,0.18), walnutEdge, 8).rotation.z = -0.18;
  ellipsoid('lion eye', new THREE.Vector3(3.17,4.08,side*0.61), new THREE.Vector3(0.13,0.1,0.07), eyeWood, 10);
  const ear = tuft(new THREE.Vector3(2.46,4.57,side*0.63), new THREE.Vector3(0.3,0.35,0.16), new THREE.Euler(side*0.12,0,-side*0.65), walnut);
  ear.rotation.x = side * 0.35;
  tube([
    new THREE.Vector3(3.46,3.6,side*0.31),
    new THREE.Vector3(3.65,3.52,side*0.4),
    new THREE.Vector3(3.85,3.51,side*0.46)
  ],0.018,recess,5,10);
}
disk(new THREE.Vector3(3.72,3.63,-0.01),new THREE.Vector3(0.32,0.045,1),new THREE.Euler(0,Math.PI/2,0),recess);
tube([
  new THREE.Vector3(3.38,3.57,-0.55),
  new THREE.Vector3(3.03,3.5,-0.72),
  new THREE.Vector3(2.73,3.44,-0.78)
],0.016,recess,5,12);
tube([
  new THREE.Vector3(3.38,3.57,0.55),
  new THREE.Vector3(3.03,3.5,0.72),
  new THREE.Vector3(2.73,3.44,0.78)
],0.016,recess,5,12);

const maneTufts = [
  [1.92,4.23,-0.68,.35,.62,.32,-.45],
  [2.15,4.62,-0.48,.34,.66,.34,-.22],
  [2.62,4.79,-0.36,.32,.58,.28,.05],
  [3.02,4.68,-0.42,.3,.54,.28,.25],
  [2.08,3.88,-0.83,.36,.72,.34,-.75],
  [1.91,3.47,-0.72,.38,.72,.35,-1.05],
  [2.1,3.18,-0.56,.36,.65,.34,-1.25]
];
for (const s of [-1,1]) {
  for (const m of maneTufts) {
    tuft(
      new THREE.Vector3(m[0],m[1],m[2]*s),
      new THREE.Vector3(m[3],m[4],m[5]),
      new THREE.Euler(s*0.18,0,m[6]),
      (Math.round(m[1]*10)%2===0)?walnutLight:walnut
    );
  }
}
for (let i = 0; i < 7; i++) {
  const a = -0.8 + i * 0.27;
  tuft(new THREE.Vector3(2.0 + Math.cos(a)*0.2,3.75+i*0.08,-0.93),new THREE.Vector3(.18,.42,.18),new THREE.Euler(0,0,a),walnutEdge);
}

const goatNeckA = new THREE.Vector3(0.85,3.02,0.35);
const goatNeckB = new THREE.Vector3(0.48,4.06,0.33);
coneBetween(goatNeckA, goatNeckB, 0.58, 0.43, walnutLight, 9);
ellipsoid('goat head', new THREE.Vector3(0.5,4.34,0.35), new THREE.Vector3(0.62,0.68,0.52), walnutLight, 10);
ellipsoid('goat muzzle', new THREE.Vector3(0.54,4.02,-0.12), new THREE.Vector3(0.42,0.33,0.48), walnutEdge, 9);
ellipsoid('goat nose', new THREE.Vector3(0.56,3.94,-0.52), new THREE.Vector3(0.25,0.14,0.13), darkWood, 8);

for (const side of [-1,1]) {
  ellipsoid('goat eye', new THREE.Vector3(0.5 + side*0.45,4.45,0.05),new THREE.Vector3(.1,.085,.065),eyeWood,8);
  const ear = ellipsoid('goat ear',new THREE.Vector3(0.5+side*.62,4.48,.24),new THREE.Vector3(.42,.16,.18),walnut,8);
  ear.rotation.z = side * 0.34;
}
tuft(new THREE.Vector3(0.52,3.62,-0.29),new THREE.Vector3(.27,.52,.2),new THREE.Euler(Math.PI/2,0,0),walnutLight);

function horn(points) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geometry = new THREE.TubeGeometry(curve, 24, 0.14, 7, false);
  const hornMesh = finish(new THREE.Mesh(geometry, darkWood));
  chimera.add(hornMesh);
  for (let i = 4; i < 22; i += 4) {
    const p = curve.getPoint(i / 24);
    const tangent = curve.getTangent(i / 24);
    const groove = finish(new THREE.Mesh(new THREE.TorusGeometry(.145,.018,5,12),recess));
    groove.position.copy(p);
    groove.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),tangent);
    chimera.add(groove);
  }
}
horn([
  new THREE.Vector3(0.15,4.78,0.35),
  new THREE.Vector3(-0.05,5.18,0.42),
  new THREE.Vector3(0.08,5.47,0.53),
  new THREE.Vector3(0.35,5.36,0.62)
]);
horn([
  new THREE.Vector3(0.84,4.78,0.35),
  new THREE.Vector3(1.04,5.18,0.42),
  new THREE.Vector3(0.91,5.47,0.53),
  new THREE.Vector3(0.65,5.36,0.62)
]);

for (let i = 0; i < 5; i++) {
  tube([
    new THREE.Vector3(0.18+i*.16,4.65,-0.18),
    new THREE.Vector3(0.12+i*.18,4.38,-0.29),
    new THREE.Vector3(0.16+i*.17,4.14,-0.39)
  ],.015,recess,5,9);
}

const tailPoints = [
  new THREE.Vector3(-2.45,2.55,0.12),
  new THREE.Vector3(-3.25,2.62,0.28),
  new THREE.Vector3(-3.88,2.95,0.58),
  new THREE.Vector3(-4.12,3.58,0.76),
  new THREE.Vector3(-3.82,4.08,0.61),
  new THREE.Vector3(-3.25,4.22,0.26),
  new THREE.Vector3(-2.91,3.94,-0.06),
  new THREE.Vector3(-3.06,3.56,-0.3),
  new THREE.Vector3(-3.42,3.51,-0.35)
];
const tailCurve = new THREE.CatmullRomCurve3(tailPoints);
const tail = finish(new THREE.Mesh(new THREE.TubeGeometry(tailCurve,64,.29,8,false),walnut));
chimera.add(tail);

for (let i = 5; i < 58; i += 5) {
  const u = i / 64;
  const p = tailCurve.getPoint(u);
  const tangent = tailCurve.getTangent(u);
  const scaleRing = 0.3 * (1 - u * 0.3);
  const ring = finish(new THREE.Mesh(new THREE.TorusGeometry(scaleRing,.027,5,12),darkWood));
  ring.position.copy(p);
  ring.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),tangent);
  chimera.add(ring);
}

ellipsoid('serpent head',new THREE.Vector3(-3.64,3.5,-0.36),new THREE.Vector3(.58,.34,.36),walnutLight,10).rotation.z = -.12;
ellipsoid('serpent snout',new THREE.Vector3(-4.05,3.46,-0.38),new THREE.Vector3(.36,.23,.3),walnutEdge,9);
for (const side of [-1,1]) {
  ellipsoid('serpent eye',new THREE.Vector3(-3.91,3.63,-.38+side*.25),new THREE.Vector3(.09,.07,.055),eyeWood,8);
}
tuft(new THREE.Vector3(-3.45,3.79,-.36),new THREE.Vector3(.18,.32,.16),new THREE.Euler(0,0,-.52),walnutEdge);
tuft(new THREE.Vector3(-3.12,3.74,-.31),new THREE.Vector3(.14,.27,.13),new THREE.Euler(0,0,-.9),walnutEdge);
tube([
  new THREE.Vector3(-4.15,3.39,-.38),
  new THREE.Vector3(-4.39,3.34,-.4),
  new THREE.Vector3(-4.56,3.39,-.4)
],.025,darkWood,5,10);
tube([
  new THREE.Vector3(-4.54,3.39,-.4),
  new THREE.Vector3(-4.7,3.46,-.47)
],.018,darkWood,5,7);
tube([
  new THREE.Vector3(-4.54,3.39,-.4),
  new THREE.Vector3(-4.7,3.32,-.33)
],.018,darkWood,5,7);

for (let i = 0; i < 14; i++) {
  const u = 0.08 + i * 0.054;
  const p = tailCurve.getPoint(u);
  const tangent = tailCurve.getTangent(u);
  const side = new THREE.Vector3().crossVectors(tangent,new THREE.Vector3(0,1,0)).normalize();
  if (side.lengthSq() < .1) side.set(0,0,1);
  for (const s of [-1,1]) {
    const sc = ellipsoid('tail scale',p.clone().addScaledVector(side,s*.285),new THREE.Vector3(.16,.12,.06),walnutEdge,7);
    sc.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0),tangent);
  }
}

for (let i = 0; i < 11; i++) {
  const x = -1.75 + i*.33;
  tuft(new THREE.Vector3(x,3.35 + Math.sin(i*.55)*.1,-.03),new THREE.Vector3(.13,.29,.14),new THREE.Euler(0,0,-Math.PI/2),i%2?walnutEdge:walnutLight);
}

const base = finish(new THREE.Mesh(
  new THREE.CylinderGeometry(3.75,4.02,.42,48,2),
  new THREE.MeshStandardMaterial({color:0x3a2114,roughness:.6,metalness:0})
));
base.position.set(-.25,.02,0);
chimera.add(base);
ringGroove(new THREE.Vector3(-.25,.24,0),3.62,.035,new THREE.Euler(Math.PI/2,0,0),walnutEdge);
ringGroove(new THREE.Vector3(-.25,-.17,0),3.82,.04,new THREE.Euler(Math.PI/2,0,0),recess);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(18,64),
  new THREE.MeshStandardMaterial({color:0x211610,roughness:.88,metalness:0})
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -.21;
floor.receiveShadow = true;
scene.add(floor);

const hemi = new THREE.HemisphereLight(0xffd6a1,0x27130c,1.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffc27a,4.3);
key.position.set(6,9,7);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -3;
key.shadow.camera.near = 1;
key.shadow.camera.far = 30;
key.shadow.bias = -0.0004;
scene.add(key);

const rim = new THREE.DirectionalLight(0xd2854d,2.2);
rim.position.set(-7,5,-6);
scene.add(rim);

const fill = new THREE.PointLight(0x8ca7bf,18,16,2);
fill.position.set(0,3,6);
scene.add(fill);

window.addEventListener('resize',() => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  key.position.x = 6 + Math.sin(t*.16)*.5;
  controls.update();
  renderer.render(scene,camera);
});
</script>
</body>
</html>
