<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commuter Bicycle</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe5e6; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe5e6);
scene.fog = new THREE.Fog(0xdfe5e6, 7, 15);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.55, 2.35, 4.1);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.minDistance = 2.7;
controls.maxDistance = 7;
controls.target.set(0, 0.75, 0);

scene.add(new THREE.HemisphereLight(0xf6fbff, 0x657078, 2.0));

const key = new THREE.DirectionalLight(0xffffff, 3.1);
key.position.set(-3, 6, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 4;
key.shadow.camera.bottom = -2;
scene.add(key);

const fill = new THREE.DirectionalLight(0xa8c8e8, 1.1);
fill.position.set(4, 2, -4);
scene.add(fill);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(18, 18),
  new THREE.MeshStandardMaterial({ color: 0xb8c1c1, roughness: 0.88, metalness: 0.02 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.04;
floor.receiveShadow = true;
scene.add(floor);

const frameMat = new THREE.MeshStandardMaterial({ color: 0x274c59, roughness: 0.3, metalness: 0.62 });
const frameEdgeMat = new THREE.MeshStandardMaterial({ color: 0x3f7180, roughness: 0.27, metalness: 0.68 });
const blackMat = new THREE.MeshStandardMaterial({ color: 0x11171a, roughness: 0.72, metalness: 0.15 });
const tireMat = new THREE.MeshStandardMaterial({ color: 0x101416, roughness: 0.92, metalness: 0.02 });
const rubberMat = new THREE.MeshStandardMaterial({ color: 0x171d20, roughness: 0.84 });
const metalMat = new THREE.MeshStandardMaterial({ color: 0xb7c3c6, roughness: 0.24, metalness: 0.9 });
const rotorMat = new THREE.MeshStandardMaterial({ color: 0x89979b, roughness: 0.38, metalness: 0.92 });
const brassMat = new THREE.MeshStandardMaterial({ color: 0xc58d3d, roughness: 0.3, metalness: 0.82 });
const bottleMat = new THREE.MeshStandardMaterial({ color: 0xc86f38, roughness: 0.38, metalness: 0.08 });

function cylinderBetween(a, b, radius, material, radial = 12) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, radial), material);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function tube(a, b, radius = 0.055, material = frameMat) {
  scene.add(cylinderBetween(a, b, radius, material, 16));
}

function addWheel(x, zOffset = 0) {
  const group = new THREE.Group();
  group.position.set(x, 0.74, zOffset);

  const tire = new THREE.Mesh(new THREE.TorusGeometry(0.72, 0.075, 14, 40), tireMat);
  tire.castShadow = true;
  tire.receiveShadow = true;
  group.add(tire);

  const rim = new THREE.Mesh(new THREE.TorusGeometry(0.655, 0.018, 8, 40), metalMat);
  rim.castShadow = true;
  group.add(rim);

  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.058, 0.058, 0.16, 16), metalMat);
  hub.rotation.x = Math.PI / 2;
  hub.castShadow = true;
  group.add(hub);

  for (let i = 0; i < 20; i++) {
    const angle = (i / 20) * Math.PI * 2;
    const end = new THREE.Vector3(Math.cos(angle) * 0.65, Math.sin(angle) * 0.65, 0);
    const spoke = cylinderBetween(new THREE.Vector3(0, 0, 0), end, 0.006, metalMat, 6);
    group.add(spoke);
  }

  for (const side of [-1, 1]) {
    const rotor = new THREE.Mesh(new THREE.CylinderGeometry(0.235, 0.235, 0.012, 32), rotorMat);
    rotor.rotation.x = Math.PI / 2;
    rotor.position.z = side * 0.095;
    rotor.castShadow = true;
    group.add(rotor);

    const rotorHub = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.018, 16), metalMat);
    rotorHub.rotation.x = Math.PI / 2;
    rotorHub.position.z = side * 0.105;
    group.add(rotorHub);
  }

  scene.add(group);
}

addWheel(-1.02);
addWheel(1.12);

const rear = new THREE.Vector3(-1.02, 0.74, 0);
const front = new THREE.Vector3(1.12, 0.74, 0);
const bb = new THREE.Vector3(-0.28, 0.30, 0);
const seatTop = new THREE.Vector3(-0.70, 1.34, 0);
const headTop = new THREE.Vector3(0.67, 1.28, 0);
const headBottom = new THREE.Vector3(0.58, 0.91, 0);

tube(rear, bb, 0.052);
tube(bb, seatTop, 0.064, frameEdgeMat);
tube(seatTop, headTop, 0.061);
tube(headTop, bb, 0.061);
tube(bb, rear, 0.052);
tube(headTop, headBottom, 0.072, frameEdgeMat);
tube(rear, seatTop, 0.043);
tube(rear, bb, 0.043);

const rearCap = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.18, 16), metalMat);
rearCap.rotation.x = Math.PI / 2;
rearCap.position.copy(rear);
rearCap.castShadow = true;
scene.add(rearCap);

const forkL = new THREE.Vector3(headBottom.x, headBottom.y, -0.075);
const forkR = new THREE.Vector3(headBottom.x, headBottom.y, 0.075);
const frontL = new THREE.Vector3(front.x, front.y, -0.075);
const frontR = new THREE.Vector3(front.x, front.y, 0.075);
tube(forkL, frontL, 0.045, frameEdgeMat);
tube(forkR, frontR, 0.045, frameEdgeMat);

const seatPostTop = new THREE.Vector3(-0.70, 1.56, 0);
tube(seatTop, seatPostTop, 0.032, blackMat);

const saddle = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.07, 0.17), blackMat);
saddle.position.set(-0.72, 1.59, 0);
saddle.rotation.z = -0.06;
saddle.castShadow = true;
scene.add(saddle);

const stemTop = new THREE.Vector3(0.77, 1.56, 0);
tube(headTop, stemTop, 0.034, blackMat);

const handlebar = cylinderBetween(
  new THREE.Vector3(0.77, 1.56, -0.38),
  new THREE.Vector3(0.77, 1.56, 0.38),
  0.025,
  blackMat,
  14
);
scene.add(handlebar);

for (const z of [-0.43, 0.43]) {
  const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.22, 14), rubberMat);
  grip.rotation.x = Math.PI / 2;
  grip.position.set(0.77, 1.56, z);
  grip.castShadow = true;
  scene.add(grip);
}

const brakeLeverL = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.15, 0.035), metalMat);
brakeLeverL.position.set(0.76, 1.48, -0.29);
brakeLeverL.rotation.z = -0.35;
scene.add(brakeLeverL);

const brakeLeverR = brakeLeverL.clone();
brakeLeverR.position.z = 0.29;
brakeLeverR.rotation.z = -0.35;
scene.add(brakeLeverR);

const chainCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-1.02, 0.83, 0.085),
  new THREE.Vector3(-0.28, 0.51, 0.085),
  new THREE.Vector3(-0.28, 0.10, 0.085),
  new THREE.Vector3(-1.02, 0.66, 0.085)
], true, "centripetal");
const chain = new THREE.Mesh(
  new THREE.TubeGeometry(chainCurve, 48, 0.012, 6, true),
  brassMat
);
chain.castShadow = true;
scene.add(chain);

const chainring = new THREE.Mesh(new THREE.TorusGeometry(0.19, 0.014, 8, 28), brassMat);
chainring.position.set(bb.x, bb.y, 0.095);
chainring.castShadow = true;
scene.add(chainring);

const crankAxle = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.22, 14), metalMat);
crankAxle.rotation.x = Math.PI / 2;
crankAxle.position.set(bb.x, bb.y, 0);
scene.add(crankAxle);

const crankArm = cylinderBetween(
  new THREE.Vector3(bb.x, bb.y, 0.12),
  new THREE.Vector3(bb.x + 0.27, bb.y - 0.11, 0.12),
  0.018,
  brassMat,
  10
);
scene.add(crankArm);

const pedalBar = cylinderBetween(
  new THREE.Vector3(bb.x + 0.23, bb.y - 0.11, 0.12),
  new THREE.Vector3(bb.x + 0.23, bb.y - 0.11, 0.28),
  0.014,
  blackMat,
  8
);
scene.add(pedalBar);

const pedal = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.035, 0.07), blackMat);
pedal.position.set(bb.x + 0.23, bb.y - 0.11, 0.30);
pedal.castShadow = true;
scene.add(pedal);

const cassette = new THREE.Mesh(new THREE.TorusGeometry(0.10, 0.014, 8, 24), brassMat);
cassette.position.set(rear.x, rear.y, 0.10);
cassette.castShadow = true;
scene.add(cassette);

const derailleurBody = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.16, 0.08), blackMat);
derailleurBody.position.set(-1.08, 0.58, 0.10);
derailleurBody.rotation.z = -0.28;
derailleurBody.castShadow = true;
scene.add(derailleurBody);

const derailleurCage = cylinderBetween(
  new THREE.Vector3(-1.10, 0.55, 0.11),
  new THREE.Vector3(-0.93, 0.37, 0.11),
  0.018,
  blackMat,
  10
);
scene.add(derailleurCage);

for (const p of [new THREE.Vector3(-1.10, 0.55, 0.11), new THREE.Vector3(-0.93, 0.37, 0.11)]) {
  const pulley = new THREE.Mesh(new THREE.TorusGeometry(0.045, 0.012, 8, 16), brassMat);
  pulley.position.copy(p);
  pulley.castShadow = true;
  scene.add(pulley);
}

const bottle = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.43, 20), bottleMat);
bottle.position.set(-0.04, 0.82, 0.075);
bottle.rotation.z = -0.42;
bottle.castShadow = true;
scene.add(bottle);

const bottleCap = new THREE.Mesh(new THREE.CylinderGeometry(0.079, 0.079, 0.035, 20), blackMat);
bottleCap.position.set(0.05, 1.01, 0.075);
bottleCap.rotation.z = -0.42;
bottleCap.castShadow = true;
scene.add(bottleCap);

const cageBars = [
  [new THREE.Vector3(-0.23, 0.63, 0.15), new THREE.Vector3(0.16, 0.77, 0.15)],
  [new THREE.Vector3(-0.18, 1.02, 0.15), new THREE.Vector3(0.21, 0.89, 0.15)],
  [new THREE.Vector3(-0.23, 0.63, 0.15), new THREE.Vector3(-0.18, 1.02, 0.15)],
  [new THREE.Vector3(0.16, 0.77, 0.15), new THREE.Vector3(0.21, 0.89, 0.15)]
];
for (const pair of cageBars) scene.add(cylinderBetween(pair[0], pair[1], 0.012, metalMat, 8));

const fender = new THREE.Mesh(
  new THREE.TorusGeometry(0.765, 0.018, 6, 36, Math.PI * 0.72),
  frameEdgeMat
);
fender.position.copy(front);
fender.rotation.z = Math.PI * 0.14;
fender.scale.set(1, 0.94, 1);
fender.castShadow = true;
scene.add(fender);

const rearLight = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.07, 0.05), new THREE.MeshStandardMaterial({
  color: 0xc51f2c,
  emissive: 0x65050a,
  emissiveIntensity: 0.5,
  roughness: 0.3
}));
rearLight.position.set(-1.12, 1.12, 0);
rearLight.castShadow = true;
scene.add(rearLight);

const kickstand = cylinderBetween(
  new THREE.Vector3(-0.42, 0.28, -0.03),
  new THREE.Vector3(-0.60, -0.02, -0.03),
  0.018,
  blackMat,
  10
);
scene.add(kickstand);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
