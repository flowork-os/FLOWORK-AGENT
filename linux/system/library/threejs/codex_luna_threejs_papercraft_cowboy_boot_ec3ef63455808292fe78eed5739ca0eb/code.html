<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papercraft Cowboy Boot</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #d8c6a8; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8c6a8);
scene.fog = new THREE.Fog(0xd8c6a8, 8, 18);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.5, 4.2, 7.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 4;
controls.maxDistance = 12;
controls.target.set(0, 2.0, 0.25);

const hemi = new THREE.HemisphereLight(0xfff3d5, 0x6e5846, 2.0);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe7bd, 3.4);
key.position.set(-4, 8, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -2;
key.shadow.bias = -0.0004;
scene.add(key);

const rim = new THREE.DirectionalLight(0x70a8a5, 1.3);
rim.position.set(4, 4, -5);
scene.add(rim);

const tan = new THREE.MeshStandardMaterial({
  color: 0xb87542,
  roughness: 0.9,
  metalness: 0,
  flatShading: true
});
const tanLight = new THREE.MeshStandardMaterial({
  color: 0xd49a60,
  roughness: 0.88,
  flatShading: true
});
const tanDark = new THREE.MeshStandardMaterial({
  color: 0x8f4f32,
  roughness: 0.95,
  flatShading: true
});
const turquoise = new THREE.MeshStandardMaterial({
  color: 0x159a9c,
  roughness: 0.8,
  flatShading: true
});
const turquoiseLight = new THREE.MeshStandardMaterial({
  color: 0x59c2b5,
  roughness: 0.78,
  flatShading: true
});
const paperEdge = new THREE.LineBasicMaterial({
  color: 0x613c2e,
  transparent: true,
  opacity: 0.68
});
const spurMat = new THREE.MeshStandardMaterial({
  color: 0xd7c6a2,
  roughness: 0.72,
  metalness: 0.12,
  flatShading: true
});

const boot = new THREE.Group();
boot.rotation.y = -0.12;
scene.add(boot);

function addEdges(mesh, threshold = 18) {
  const edgeLines = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, threshold), paperEdge);
  edgeLines.position.copy(mesh.position);
  edgeLines.rotation.copy(mesh.rotation);
  edgeLines.scale.copy(mesh.scale);
  mesh.parent.add(edgeLines);
}

function makeMesh(geometry, material, position = [0, 0, 0], rotation = [0, 0, 0], edged = true) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(position[0], position[1], position[2]);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  boot.add(mesh);
  if (edged) addEdges(mesh);
  return mesh;
}

const shaft = makeMesh(
  new THREE.CylinderGeometry(0.78, 0.86, 3.15, 8, 1, false),
  tanLight,
  [0, 2.55, -0.38],
  [0, 0.08, 0]
);

const shaftRim = makeMesh(
  new THREE.CylinderGeometry(0.79, 0.79, 0.13, 8, 1, false),
  tanDark,
  [0, 4.12, -0.38],
  [0, 0.08, 0]
);

const shaftTop = makeMesh(
  new THREE.CylinderGeometry(0.67, 0.67, 0.035, 8, 1, false),
  turquoise,
  [0, 4.195, -0.38],
  [0, 0.08, 0],
  false
);

const toeSections = [
  { z: -0.35, w: 0.78, bottom: 0.55, shoulder: 1.02, ridge: 1.11 },
  { z: 0.20, w: 0.82, bottom: 0.53, shoulder: 0.98, ridge: 1.08 },
  { z: 0.95, w: 0.70, bottom: 0.55, shoulder: 0.91, ridge: 1.00 },
  { z: 1.55, w: 0.43, bottom: 0.57, shoulder: 0.80, ridge: 0.87 },
  { z: 1.92, w: 0.06, bottom: 0.61, shoulder: 0.68, ridge: 0.70 }
];

const toeVertices = [];
for (const section of toeSections) {
  toeVertices.push(
    -section.w, section.bottom, section.z,
    -section.w, section.shoulder, section.z,
    0, section.ridge, section.z,
    section.w, section.shoulder, section.z,
    section.w, section.bottom, section.z
  );
}
const toeIndices = [];
const toeMaterialGroups = [];
for (let i = 0; i < toeSections.length - 1; i++) {
  const a = i * 5;
  const b = (i + 1) * 5;
  const faces = [
    [a, b, b + 1], [a, b + 1, a + 1],
    [a + 1, b + 1, b + 2], [a + 1, b + 2, a + 2],
    [a + 2, b + 2, b + 3], [a + 2, b + 3, a + 3],
    [a + 3, b + 3, b + 4], [a + 3, b + 4, a + 4],
    [a + 4, b + 4, b], [a + 4, b, a]
  ];
  for (const face of faces) toeIndices.push(...face);
}
toeIndices.push(0, 1, 2, 0, 2, 3, 0, 3, 4);
const toeGeometry = new THREE.BufferGeometry();
toeGeometry.setAttribute("position", new THREE.Float32BufferAttribute(toeVertices, 3));
toeGeometry.setIndex(toeIndices);
toeGeometry.computeVertexNormals();
const toe = makeMesh(toeGeometry, tan, [0, 0, 0.2], [0, 0, 0], true);

const sole = makeMesh(
  new THREE.BoxGeometry(1.62, 0.18, 2.55),
  tanDark,
  [0, 0.47, 0.48],
  [0, 0.015, 0]
);

const soleTop = makeMesh(
  new THREE.BoxGeometry(1.48, 0.055, 2.38),
  tanLight,
  [0, 0.585, 0.45],
  [0, 0.015, 0],
  false
);

const heel = makeMesh(
  new THREE.CylinderGeometry(0.56, 0.68, 0.72, 5, 1, false),
  tanDark,
  [0, 0.08, -1.03],
  [0, 0.1, 0.18]
);

const heelCap = makeMesh(
  new THREE.BoxGeometry(1.1, 0.09, 0.72),
  tanLight,
  [0, 0.47, -1.03],
  [0, 0.08, 0],
  true
);

function panelShape(width, height, inset = 0.08) {
  const shape = new THREE.Shape();
  shape.moveTo(-width * 0.46, -height * 0.5);
  shape.lineTo(width * 0.46, -height * 0.5);
  shape.lineTo(width * 0.5, height * 0.17);
  shape.lineTo(width * 0.25, height * 0.5);
  shape.lineTo(-width * 0.25, height * 0.5);
  shape.lineTo(-width * 0.5, height * 0.17);
  shape.closePath();
  return shape;
}

function makePanel(width, height, depth, position, rotation, material) {
  const geometry = new THREE.ExtrudeGeometry(panelShape(width, height), {
    depth,
    bevelEnabled: false,
    steps: 1
  });
  geometry.center();
  return makeMesh(geometry, material, position, rotation, true);
}

makePanel(0.82, 1.48, 0.045, [0, 2.48, 0.49], [0, 0.08, 0], turquoise);
makePanel(0.47, 1.02, 0.05, [0, 2.48, 0.525], [0, 0.08, 0], tanLight);

const sidePanel = makePanel(0.62, 1.46, 0.04, [-0.68, 2.5, -0.34], [0, Math.PI / 2 + 0.08, 0], turquoise);
sidePanel.rotation.z = 0.04;

function addStrip(width, height, depth, position, rotation, material = turquoiseLight) {
  const mesh = makeMesh(new THREE.BoxGeometry(width, height, depth), material, position, rotation, false);
  return mesh;
}

for (const yValue of [1.95, 2.28, 2.61, 2.94, 3.27]) {
  addStrip(0.66, 0.035, 0.065, [0, yValue, 0.565], [0, 0.08, 0], turquoiseLight);
}
for (const yValue of [2.06, 2.72]) {
  addStrip(0.37, 0.035, 0.072, [0, yValue, 0.602], [0, 0.08, 0], turquoise);
}
addStrip(0.035, 1.26, 0.07, [0, 2.48, 0.604], [0, 0.08, 0], turquoise);

const stitchPoints = [];
for (let index = 0; index < 9; index++) {
  const yValue = 1.86 + index * 0.16;
  stitchPoints.push(new THREE.Vector3(-0.34, yValue, 0.615), new THREE.Vector3(-0.23, yValue + 0.075, 0.615));
  stitchPoints.push(new THREE.Vector3(0.34, yValue, 0.615), new THREE.Vector3(0.23, yValue + 0.075, 0.615));
}
const stitchGeometry = new THREE.BufferGeometry().setFromPoints(stitchPoints);
const stitches = new THREE.LineSegments(stitchGeometry, new THREE.LineBasicMaterial({ color: 0xf2d48b, linewidth: 1 }));
stitches.rotation.y = 0.08;
boot.add(stitches);

for (const xValue of [-0.61, 0.61]) {
  addStrip(0.045, 1.85, 0.06, [xValue, 2.55, 0.49], [0, 0.08, 0], tanDark);
}

const pullLeft = addStrip(0.17, 0.72, 0.12, [-0.38, 4.48, -0.39], [0.14, 0.08, -0.22], turquoise);
const pullRight = addStrip(0.17, 0.72, 0.12, [0.38, 4.48, -0.39], [0.14, 0.08, 0.22], turquoise);
makeMesh(new THREE.BoxGeometry(0.88, 0.16, 0.12), turquoise, [0, 4.77, -0.39], [0.12, 0.08, 0], true);

const spurBar = makeMesh(
  new THREE.BoxGeometry(1.32, 0.09, 0.12),
  spurMat,
  [0, 0.12, -1.42],
  [0.04, 0, 0],
  true
);
const spurNeck = makeMesh(
  new THREE.BoxGeometry(0.12, 0.12, 0.68),
  spurMat,
  [0, 0.09, -1.72],
  [Math.PI / 2, 0, 0],
  true
);
makeMesh(
  new THREE.ConeGeometry(0.16, 0.34, 5),
  spurMat,
  [0, 0.09, -2.04],
  [Math.PI / 2, 0, 0],
  true
);

const seamPoints = [
  new THREE.Vector3(-0.76, 0.67, -0.75), new THREE.Vector3(-0.76, 0.67, 1.33),
  new THREE.Vector3(0.76, 0.67, -0.75), new THREE.Vector3(0.76, 0.67, 1.33)
];
const seamGeometry = new THREE.BufferGeometry().setFromPoints(seamPoints);
boot.add(new THREE.LineSegments(seamGeometry, paperEdge));

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0xcbb493, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.34;
ground.receiveShadow = true;
scene.add(ground);

const contactShadow = new THREE.Mesh(
  new THREE.CircleGeometry(2.25, 48),
  new THREE.MeshBasicMaterial({ color: 0x806956, transparent: true, opacity: 0.18, depthWrite: false })
);
contactShadow.rotation.x = -Math.PI / 2;
contactShadow.position.set(0, -0.325, 0.18);
contactShadow.scale.set(1.0, 0.54, 1);
scene.add(contactShadow);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
