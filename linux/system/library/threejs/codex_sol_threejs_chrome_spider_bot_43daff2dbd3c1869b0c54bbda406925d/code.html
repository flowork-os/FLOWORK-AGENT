<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chrome Spider Bot</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05070a;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

RectAreaLightUniformsLib.init();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05080c);
scene.fog = new THREE.FogExp2(0x05080c, 0.035);

const camera = new THREE.PerspectiveCamera(
  38,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.set(6.8, 4.1, 7.7);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.25, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.58;
controls.minDistance = 5.3;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.47;
controls.update();

const chromeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xdde7ee,
  metalness: 1,
  roughness: 0.045,
  clearcoat: 1,
  clearcoatRoughness: 0.025,
  envMapIntensity: 2.7
});

const darkChromeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x9aa8b0,
  metalness: 1,
  roughness: 0.075,
  clearcoat: 1,
  clearcoatRoughness: 0.04,
  envMapIntensity: 2.25
});

const floorMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x111820,
  metalness: 0.62,
  roughness: 0.24,
  clearcoat: 0.75,
  clearcoatRoughness: 0.15,
  envMapIntensity: 0.8
});

const floor = new THREE.Mesh(new THREE.PlaneGeometry(35, 35), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

const bot = new THREE.Group();
bot.position.y = 0.02;
scene.add(bot);

function liquidBodyGeometry(radius, width, height, depth, rearTaper, waveAmount) {
  const geometry = new THREE.SphereGeometry(radius, 96, 64);
  const position = geometry.attributes.position;
  const vertex = new THREE.Vector3();

  for (let i = 0; i < position.count; i++) {
    vertex.fromBufferAttribute(position, i);
    const normalizedZ = THREE.MathUtils.clamp(vertex.z / radius, -1, 1);
    const normalizedY = THREE.MathUtils.clamp(vertex.y / radius, -1, 1);
    const taper = 1 - rearTaper * Math.max(0, normalizedZ);
    const ripple =
      1 +
      waveAmount *
      Math.sin(normalizedZ * 7.2 + normalizedY * 3.1) *
      (1 - normalizedZ * normalizedZ) *
      (1 - normalizedY * normalizedY);

    position.setXYZ(
      i,
      vertex.x * width * taper * ripple,
      vertex.y * height * (1 + 0.035 * Math.cos(normalizedZ * 5.5)),
      vertex.z * depth
    );
  }

  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();
  return geometry;
}

const abdomen = new THREE.Mesh(
  liquidBodyGeometry(1, 0.94, 0.62, 1.42, 0.22, 0.025),
  chromeMaterial
);
abdomen.position.set(0, 1.72, 0.28);
abdomen.castShadow = true;
abdomen.receiveShadow = true;
bot.add(abdomen);

const thorax = new THREE.Mesh(
  liquidBodyGeometry(1, 0.7, 0.53, 0.76, 0.04, 0.018),
  chromeMaterial
);
thorax.position.set(0, 1.68, -0.88);
thorax.castShadow = true;
thorax.receiveShadow = true;
bot.add(thorax);

const sternum = new THREE.Mesh(
  new THREE.SphereGeometry(0.58, 56, 36),
  darkChromeMaterial
);
sternum.scale.set(1, 0.34, 1.35);
sternum.position.set(0, 1.39, -0.3);
sternum.castShadow = true;
bot.add(sternum);

const crown = new THREE.Mesh(
  new THREE.SphereGeometry(0.34, 48, 32),
  chromeMaterial
);
crown.scale.set(1.15, 0.52, 1);
crown.position.set(0, 2.2, -0.82);
crown.castShadow = true;
bot.add(crown);

const sensorGeometry = new THREE.SphereGeometry(0.105, 32, 24);
for (const x of [-0.28, -0.1, 0.1, 0.28]) {
  const sensor = new THREE.Mesh(sensorGeometry, chromeMaterial);
  sensor.position.set(x, 1.86 + 0.08 * (1 - Math.abs(x) / 0.28), -1.54);
  sensor.scale.set(1, 0.86, 0.58);
  sensor.castShadow = true;
  bot.add(sensor);
}

function createTube(points, radius, material, tubularSegments = 40) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const geometry = new THREE.TubeGeometry(curve, tubularSegments, radius, 12, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return { mesh, curve };
}

function createPin(start, end) {
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
  const geometry = new THREE.ConeGeometry(0.075, length, 20, 1, false);
  const mesh = new THREE.Mesh(geometry, chromeMaterial);
  mesh.position.copy(midpoint);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  mesh.castShadow = true;
  return mesh;
}

const jointGeometry = new THREE.SphereGeometry(1, 36, 26);
const dropletGeometry = new THREE.SphereGeometry(1, 28, 20);
const movingDroplets = [];

const anchorsZ = [-1.18, -0.52, 0.28, 0.92];
const elbowsZ = [-1.72, -0.78, 0.63, 1.42];
const anklesZ = [-2.2, -0.98, 0.95, 2.12];
const lateralReach = [2.28, 2.52, 2.48, 2.24];

for (const side of [-1, 1]) {
  for (let index = 0; index < 4; index++) {
    const start = new THREE.Vector3(
      side * (0.52 + index * 0.055),
      1.68 - index * 0.015,
      anchorsZ[index]
    );

    const elbow = new THREE.Vector3(
      side * (1.35 + (index === 1 || index === 2 ? 0.16 : 0)),
      1.24 + (index === 0 ? 0.11 : 0),
      elbowsZ[index]
    );

    const ankle = new THREE.Vector3(
      side * lateralReach[index],
      0.34,
      anklesZ[index]
    );

    const tip = new THREE.Vector3(
      side * (lateralReach[index] + 0.12),
      0.035,
      anklesZ[index] + (index < 2 ? -0.08 : 0.08)
    );

    const upperControl = new THREE.Vector3().lerpVectors(start, elbow, 0.52);
    upperControl.y += 0.12;
    upperControl.x += side * 0.08;

    const lowerControl = new THREE.Vector3().lerpVectors(elbow, ankle, 0.52);
    lowerControl.y += 0.08;
    lowerControl.x += side * 0.1;

    const upper = createTube(
      [start, upperControl, elbow],
      0.115,
      chromeMaterial,
      34
    );
    const lower = createTube(
      [elbow, lowerControl, ankle],
      0.087,
      chromeMaterial,
      42
    );

    bot.add(upper.mesh, lower.mesh);

    const elbowJoint = new THREE.Mesh(jointGeometry, chromeMaterial);
    elbowJoint.position.copy(elbow);
    elbowJoint.scale.set(0.165, 0.145, 0.165);
    elbowJoint.castShadow = true;
    bot.add(elbowJoint);

    const ankleJoint = new THREE.Mesh(jointGeometry, chromeMaterial);
    ankleJoint.position.copy(ankle);
    ankleJoint.scale.set(0.115, 0.105, 0.115);
    ankleJoint.castShadow = true;
    bot.add(ankleJoint);

    bot.add(createPin(ankle, tip));

    const bead = new THREE.Mesh(dropletGeometry, chromeMaterial);
    bead.scale.set(0.15, 0.075, 0.075);
    bead.castShadow = true;
    bot.add(bead);

    movingDroplets.push({
      mesh: bead,
      curve: lower.curve,
      phase: index * 1.37 + (side > 0 ? 0.7 : 2.1),
      speed: 0.72 + index * 0.08
    });

    if (index === 1 || index === 2) {
      const beadTwo = new THREE.Mesh(dropletGeometry, chromeMaterial);
      beadTwo.scale.set(0.105, 0.055, 0.055);
      beadTwo.castShadow = true;
      bot.add(beadTwo);

      movingDroplets.push({
        mesh: beadTwo,
        curve: upper.curve,
        phase: index * 1.9 + (side > 0 ? 3.2 : 0.4),
        speed: 0.58 + index * 0.06
      });
    }
  }
}

const fixedDrops = [
  [-0.44, 2.19, 0.03, 0.12],
  [0.36, 2.22, 0.4, 0.09],
  [-0.62, 2.02, 0.72, 0.075],
  [0.58, 1.94, -0.14, 0.085],
  [-0.25, 2.31, -0.69, 0.07],
  [0.18, 2.27, 1.0, 0.065]
];

for (const [x, y, z, size] of fixedDrops) {
  const drop = new THREE.Mesh(dropletGeometry, chromeMaterial);
  drop.position.set(x, y, z);
  drop.scale.set(size * 0.82, size, size * 0.82);
  drop.castShadow = true;
  bot.add(drop);
}

const environmentGroup = new THREE.Group();
scene.add(environmentGroup);

function addReflectionPanel(position, rotation, scale, color, intensity) {
  const material = new THREE.MeshBasicMaterial({
    color: new THREE.Color(color).multiplyScalar(intensity),
    side: THREE.DoubleSide,
    toneMapped: false
  });
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), material);
  panel.position.copy(position);
  panel.rotation.set(rotation.x, rotation.y, rotation.z);
  panel.scale.copy(scale);
  environmentGroup.add(panel);
}

addReflectionPanel(
  new THREE.Vector3(-5.5, 2.8, 0),
  new THREE.Euler(0, Math.PI / 2, 0),
  new THREE.Vector3(5, 0.42, 1),
  0xbfe8ff,
  2.8
);
addReflectionPanel(
  new THREE.Vector3(5.5, 2.4, 0.5),
  new THREE.Euler(0, -Math.PI / 2, 0),
  new THREE.Vector3(4.5, 0.3, 1),
  0xffffff,
  3.2
);
addReflectionPanel(
  new THREE.Vector3(0, 6, 0),
  new THREE.Euler(Math.PI / 2, 0, 0),
  new THREE.Vector3(5.5, 2.2, 1),
  0xe4f6ff,
  2.2
);
addReflectionPanel(
  new THREE.Vector3(0, 2.2, -6),
  new THREE.Euler(0, 0, 0),
  new THREE.Vector3(2.8, 4.2, 1),
  0xa7d7ff,
  1.7
);
addReflectionPanel(
  new THREE.Vector3(0, 1.5, 6),
  new THREE.Euler(0, Math.PI, 0),
  new THREE.Vector3(0.45, 4.8, 1),
  0xffe4c7,
  2.4
);
addReflectionPanel(
  new THREE.Vector3(-2.8, 1.4, 5.1),
  new THREE.Euler(0, Math.PI, -0.35),
  new THREE.Vector3(0.18, 4.6, 1),
  0xffffff,
  3.1
);
addReflectionPanel(
  new THREE.Vector3(3.1, 2.1, -5.2),
  new THREE.Euler(0, 0, 0.28),
  new THREE.Vector3(0.22, 5.2, 1),
  0xc2e9ff,
  2.9
);

const ambient = new THREE.HemisphereLight(0xb7dcff, 0x111318, 1.2);
scene.add(ambient);

const keyLight = new THREE.SpotLight(0xe4f5ff, 130, 22, Math.PI / 5.2, 0.48, 1.4);
keyLight.position.set(-4.5, 7.5, 4.5);
keyLight.target.position.set(0, 1, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 20;
keyLight.shadow.bias = -0.00025;
scene.add(keyLight, keyLight.target);

const rimLight = new THREE.SpotLight(0x8dcfff, 95, 20, Math.PI / 4.5, 0.55, 1.5);
rimLight.position.set(4.8, 5, -4.5);
rimLight.target.position.set(0, 1.4, 0);
scene.add(rimLight, rimLight.target);

const warmLight = new THREE.PointLight(0xffc89f, 28, 10, 2);
warmLight.position.set(-3.5, 2.2, -3.5);
scene.add(warmLight);

const leftArea = new THREE.RectAreaLight(0xd6f3ff, 7, 2.2, 5.5);
leftArea.position.set(-4, 3.3, 1);
leftArea.lookAt(0, 1.4, 0);
scene.add(leftArea);

const rightArea = new THREE.RectAreaLight(0xffffff, 6, 1.5, 4.5);
rightArea.position.set(4, 3.5, -1);
rightArea.lookAt(0, 1.3, 0);
scene.add(rightArea);

const cubeTarget = new THREE.WebGLCubeRenderTarget(512, {
  generateMipmaps: true,
  minFilter: THREE.LinearMipmapLinearFilter,
  colorSpace: THREE.SRGBColorSpace
});
const cubeCamera = new THREE.CubeCamera(0.1, 50, cubeTarget);
cubeCamera.position.set(0, 1.65, 0);
scene.add(cubeCamera);

bot.visible = false;
floor.visible = false;
cubeCamera.update(renderer, scene);
chromeMaterial.envMap = cubeTarget.texture;
darkChromeMaterial.envMap = cubeTarget.texture;
floorMaterial.envMap = cubeTarget.texture;
chromeMaterial.needsUpdate = true;
darkChromeMaterial.needsUpdate = true;
floorMaterial.needsUpdate = true;
environmentGroup.visible = false;
bot.visible = true;
floor.visible = true;

const clock = new THREE.Clock();
const tangent = new THREE.Vector3();
const axis = new THREE.Vector3(1, 0, 0);

function animate() {
  requestAnimationFrame(animate);

  const elapsed = clock.getElapsedTime();
  bot.position.y = 0.025 + Math.sin(elapsed * 0.85) * 0.018;
  bot.rotation.z = Math.sin(elapsed * 0.42) * 0.006;

  for (const droplet of movingDroplets) {
    const travel = 0.18 + 0.64 * (
      0.5 + 0.5 * Math.sin(elapsed * droplet.speed + droplet.phase)
    );
    droplet.curve.getPointAt(travel, droplet.mesh.position);
    droplet.curve.getTangentAt(travel, tangent).normalize();
    droplet.mesh.quaternion.setFromUnitVectors(axis, tangent);
  }

  crown.scale.y = 0.52 + Math.sin(elapsed * 1.2) * 0.012;

  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
