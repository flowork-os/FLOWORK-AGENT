<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claymation Pancake Stack</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4dcb5}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {RoundedBoxGeometry} from "three/addons/geometries/RoundedBoxGeometry.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4dcb5);
scene.fog = new THREE.Fog(0xf4dcb5, 5, 10);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.05, 2.45, 4.25);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 2.6;
controls.maxDistance = 6;
controls.target.set(0, 0.92, 0);

const warm = new THREE.HemisphereLight(0xffefd0, 0x9b5b35, 2.3);
scene.add(warm);

const key = new THREE.DirectionalLight(0xffe0b0, 3.8);
key.position.set(-3, 5, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left = -3;
key.shadow.camera.right = 3;
key.shadow.camera.top = 4;
key.shadow.camera.bottom = -2;
key.shadow.bias = -0.0005;
scene.add(key);

const fill = new THREE.PointLight(0xff9d5b, 1.1, 7);
fill.position.set(3, 1.5, 2);
scene.add(fill);

const pancakeMat = new THREE.MeshStandardMaterial({
  color:0xb96f35,
  roughness:0.9,
  metalness:0,
  flatShading:false
});
const edgeMat = new THREE.MeshStandardMaterial({
  color:0x9b542b,
  roughness:0.96
});
const syrupMat = new THREE.MeshStandardMaterial({
  color:0x7a280d,
  roughness:0.16,
  metalness:0.04
});
const syrupHighlightMat = new THREE.MeshStandardMaterial({
  color:0xa74413,
  roughness:0.2
});
const butterMat = new THREE.MeshStandardMaterial({
  color:0xffd96a,
  roughness:0.52
});
const butterTopMat = new THREE.MeshStandardMaterial({
  color:0xffe68b,
  roughness:0.42
});
const dimpleMat = new THREE.MeshStandardMaterial({
  color:0x854522,
  roughness:1
});
const groundMat = new THREE.MeshStandardMaterial({
  color:0xd9ad78,
  roughness:1
});

function seeded(n){
  return Math.abs(Math.sin(n * 12.9898 + 78.233) * 43758.5453) % 1;
}

function pancakeGeometry(radius, thickness, seed){
  const seg = 56, rings = 7;
  const pos = [];
  const idx = [];
  const topCenter = 0;
  pos.push(0, thickness * 0.5 + 0.012, 0);
  const topStart = 1;
  for(let r=1;r<=rings;r++){
    const rr = r / rings;
    for(let i=0;i<seg;i++){
      const a = i / seg * Math.PI * 2;
      const wobble = 1 + 0.035*Math.sin(a*5+seed) + 0.018*Math.sin(a*11+seed*2);
      const rad = radius * rr * wobble;
      const crown = (1 - rr*rr) * 0.028;
      pos.push(Math.cos(a)*rad, thickness*0.5 + crown + 0.006*Math.sin(a*7+seed)*rr, Math.sin(a)*rad);
    }
  }
  const bottomCenter = pos.length/3;
  pos.push(0, -thickness*0.5, 0);
  const bottomStart = pos.length/3;
  for(let r=1;r<=rings;r++){
    const rr = r / rings;
    for(let i=0;i<seg;i++){
      const a = i / seg * Math.PI * 2;
      const wobble = 1 + 0.035*Math.sin(a*5+seed) + 0.018*Math.sin(a*11+seed*2);
      const rad = radius * rr * wobble;
      pos.push(Math.cos(a)*rad, -thickness*0.5 - 0.004*Math.sin(a*6+seed)*rr, Math.sin(a)*rad);
    }
  }
  for(let i=0;i<seg;i++){
    const n=(i+1)%seg;
    idx.push(topCenter,topStart+i,topStart+n);
    idx.push(bottomCenter,bottomStart+n,bottomStart+i);
  }
  for(let r=1;r<rings;r++){
    const a0=topStart+(r-1)*seg, a1=topStart+r*seg;
    const b0=bottomStart+(r-1)*seg, b1=bottomStart+r*seg;
    for(let i=0;i<seg;i++){
      const n=(i+1)%seg;
      idx.push(a0+i,a1+i,a1+n,a0+i,a1+n,a0+n);
      idx.push(b0+i,b1+n,b1+i,b0+i,b0+n,b1+n);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

function addTopDimple(group, x, z, scale, rot){
  const m = new THREE.Mesh(new THREE.SphereGeometry(1,12,8), dimpleMat);
  m.position.set(x,0.171,z);
  m.scale.set(scale,0.012,scale*0.62);
  m.rotation.y=rot;
  m.castShadow=true;
  group.add(m);
}

function addSideDimple(group, a, y, scale){
  const r=1.012;
  const m=new THREE.Mesh(new THREE.SphereGeometry(1,10,7),dimpleMat);
  m.position.set(Math.cos(a)*r,y,Math.sin(a)*r);
  m.scale.set(scale,scale*0.7,0.012);
  m.rotation.y=-a;
  group.add(m);
}

function makePancake(seed, tilt){
  const g=new THREE.Group();
  g.rotation.z=tilt;
  g.rotation.x=tilt*0.45;
  const p=new THREE.Mesh(pancakeGeometry(1.04,0.34,seed),pancakeMat);
  p.castShadow=true;
  p.receiveShadow=true;
  g.add(p);
  const topDimples=[
    [-.55,.34,.045,.2],[-.22,.63,.035,1.1],[.2,.42,.045,.5],
    [.55,.22,.034,2.2],[-.7,-.1,.032,.4],[-.18,-.12,.03,1.5],
    [.28,-.48,.042,.8],[.7,-.3,.028,2.6],[.05,.08,.025,.1]
  ];
  topDimples.forEach(v=>addTopDimple(g,v[0],v[1],v[2],v[3]));
  for(let i=0;i<13;i++){
    const a=seeded(seed+i*2.7)*Math.PI*2;
    const y=-.11+seeded(seed+i*4.1)*.2;
    addSideDimple(g,a,y,.018+seeded(seed+i)*.018);
  }
  return g;
}

const stack=new THREE.Group();
stack.rotation.y=-0.12;
stack.position.y=0.2;
scene.add(stack);

const bottom=makePancake(1.7,-0.035);
bottom.position.set(0,0,0);
stack.add(bottom);

const middle=makePancake(4.2,0.018);
middle.position.set(-0.035,0.31,0.012);
middle.scale.set(0.985,1,0.99);
stack.add(middle);

const top=makePancake(7.1,-0.025);
top.position.set(0.035,0.62,-0.018);
top.scale.set(0.965,1,0.975);
stack.add(top);

function syrupBlob(x,z,sx,sz,y=0.805){
  const blob=new THREE.Mesh(new THREE.SphereGeometry(1,20,12),syrupMat);
  blob.position.set(x,y,z);
  blob.scale.set(sx,0.045,sz);
  blob.castShadow=true;
  stack.add(blob);
}

[
  [-.48,.23,.34,.22],[-.15,.49,.3,.17],[.22,.36,.32,.22],
  [.49,.08,.27,.18],[-.53,-.2,.24,.18],[-.13,-.18,.35,.2],
  [.31,-.3,.28,.16],[.02,.04,.4,.2]
].forEach(v=>syrupBlob(v[0],v[1],v[2],v[3]));

function syrupPath(points, radius, material=syrupMat){
  const curve=new THREE.CatmullRomCurve3(points);
  const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,32, radius,12,false),material);
  tube.castShadow=true;
  tube.receiveShadow=true;
  stack.add(tube);
  return tube;
}

syrupPath([
  new THREE.Vector3(.55,.835,.12),
  new THREE.Vector3(.72,.72,.2),
  new THREE.Vector3(.8,.52,.22),
  new THREE.Vector3(.76,.3,.18),
  new THREE.Vector3(.82,.15,.14)
],.055);
syrupPath([
  new THREE.Vector3(-.54,.83,-.05),
  new THREE.Vector3(-.72,.72,-.08),
  new THREE.Vector3(-.76,.54,-.03),
  new THREE.Vector3(-.74,.37,-.02)
],.043,syrupHighlightMat);
syrupPath([
  new THREE.Vector3(.18,.84,-.44),
  new THREE.Vector3(.37,.72,-.5),
  new THREE.Vector3(.48,.58,-.5),
  new THREE.Vector3(.47,.42,-.46)
],.047);

const butter=new THREE.Group();
butter.position.set(-.06,1.04,.02);
butter.rotation.set(-.035,0.18,-.08);
const butterGeo=new RoundedBoxGeometry(.68,.25,.57,5,.075);
const butterMesh=new THREE.Mesh(butterGeo,butterMat);
butterMesh.castShadow=true;
butterMesh.receiveShadow=true;
butter.add(butterMesh);
const butterTop=new THREE.Mesh(new THREE.BoxGeometry(.45,.012,.34),butterTopMat);
butterTop.position.set(-.06,.132,-.02);
butterTop.rotation.y=.08;
butterTop.castShadow=true;
butter.add(butterTop);
stack.add(butter);

syrupPath([
  new THREE.Vector3(-.3,1.19,.05),
  new THREE.Vector3(-.22,1.13,.08),
  new THREE.Vector3(-.1,1.1,.12),
  new THREE.Vector3(.08,1.08,.14)
],.035);
syrupPath([
  new THREE.Vector3(.18,1.17,-.14),
  new THREE.Vector3(.3,1.08,-.2),
  new THREE.Vector3(.42,.98,-.24),
  new THREE.Vector3(.47,.87,-.25)
],.032);

const floor=new THREE.Mesh(new THREE.CircleGeometry(5,64),groundMat);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.01;
floor.receiveShadow=true;
scene.add(floor);

const shadow=new THREE.Mesh(
  new THREE.CircleGeometry(1.55,64),
  new THREE.MeshBasicMaterial({color:0x8f4c2a,transparent:true,opacity:.16,depthWrite:false})
);
shadow.scale.set(1,.42,1);
shadow.rotation.x=-Math.PI/2;
shadow.position.y=.002;
scene.add(shadow);

function resize(){
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
}
addEventListener("resize",resize);

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
