<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpine Lake Shore</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #b8d7e3; }
    canvas { display: block; }
    .title {
      position: fixed;
      left: 24px;
      bottom: 20px;
      color: rgba(245, 250, 244, 0.9);
      font: 500 12px/1.4 system-ui, sans-serif;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(18, 35, 38, 0.7);
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="title">Alpine Lake Shore · Morning</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb7d4df);
    scene.fog = new THREE.FogExp2(0xb8d0d4, 0.0072);

    const camera = new THREE.PerspectiveCamera(
      48,
      innerWidth / innerHeight,
      0.1,
      500
    );
    camera.position.set(34, 20, 43);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 4.5, -7);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.22;
    controls.minDistance = 22;
    controls.maxDistance = 105;
    controls.maxPolarAngle = Math.PI * 0.47;

    let seed = 847261;
    function random() {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let t = seed;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    function rand(a, b) {
      return a + (b - a) * random();
    }
    function pick(array) {
      return array[Math.floor(random() * array.length)];
    }

    const anisotropy = renderer.capabilities.getMaxAnisotropy();

    function canvasTexture(size, painter, repeatX = 1, repeatY = 1) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      painter(ctx, size);
      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(repeatX, repeatY);
      texture.anisotropy = anisotropy;
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const grassTexture = canvasTexture(256, (ctx, s) => {
      ctx.fillStyle = '#728254';
      ctx.fillRect(0, 0, s, s);
      for (let i = 0; i < 4500; i++) {
        const g = Math.floor(rand(65, 145));
        ctx.fillStyle = `rgba(${g - 18},${g},${Math.floor(g * 0.62)},${rand(0.08, 0.3)})`;
        ctx.fillRect(rand(0, s), rand(0, s), rand(0.5, 2), rand(1, 5));
      }
    }, 20, 20);

    const woodTexture = canvasTexture(256, (ctx, s) => {
      ctx.fillStyle = '#815735';
      ctx.fillRect(0, 0, s, s);
      for (let y = 0; y < s; y += 16) {
        ctx.fillStyle = y % 32 ? '#745031' : '#8e6340';
        ctx.fillRect(0, y, s, 14);
        ctx.strokeStyle = 'rgba(44,24,13,.35)';
        ctx.beginPath();
        ctx.moveTo(0, y + 14);
        ctx.lineTo(s, y + 14);
        ctx.stroke();
      }
      for (let i = 0; i < 100; i++) {
        ctx.strokeStyle = `rgba(45,25,12,${rand(.06, .18)})`;
        ctx.beginPath();
        const y = rand(0, s);
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(s * .3, y + rand(-8, 8), s * .7, y + rand(-8, 8), s, y);
        ctx.stroke();
      }
    }, 3, 3);

    const roofTexture = canvasTexture(256, (ctx, s) => {
      ctx.fillStyle = '#4f453d';
      ctx.fillRect(0, 0, s, s);
      for (let y = 0; y < s; y += 20) {
        for (let x = (y / 20) % 2 ? -15 : 0; x < s; x += 30) {
          ctx.fillStyle = random() > .5 ? '#5c5046' : '#473e38';
          ctx.fillRect(x + 1, y + 1, 28, 17);
        }
      }
    }, 5, 3);

    const rockTexture = canvasTexture(128, (ctx, s) => {
      ctx.fillStyle = '#858982';
      ctx.fillRect(0, 0, s, s);
      for (let i = 0; i < 700; i++) {
        const c = Math.floor(rand(90, 180));
        ctx.fillStyle = `rgba(${c},${c + 3},${c},${rand(.04, .2)})`;
        ctx.beginPath();
        ctx.arc(rand(0, s), rand(0, s), rand(.4, 3), 0, Math.PI * 2);
        ctx.fill();
      }
    }, 3, 3);

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(230, 40, 20),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        uniforms: {
          topColor: { value: new THREE.Color(0x6fa9c7) },
          horizonColor: { value: new THREE.Color(0xe6ded0) },
          bottomColor: { value: new THREE.Color(0xb7c9c4) }
        },
        vertexShader: `
          varying vec3 vWorld;
          void main() {
            vec4 world = modelMatrix * vec4(position, 1.0);
            vWorld = world.xyz;
            gl_Position = projectionMatrix * viewMatrix * world;
          }
        `,
        fragmentShader: `
          varying vec3 vWorld;
          uniform vec3 topColor;
          uniform vec3 horizonColor;
          uniform vec3 bottomColor;
          void main() {
            float h = normalize(vWorld).y;
            vec3 c = mix(bottomColor, horizonColor, smoothstep(-0.08, 0.11, h));
            c = mix(c, topColor, smoothstep(0.10, 0.75, h));
            gl_FragColor = vec4(c, 1.0);
          }
        `
      })
    );
    scene.add(sky);

    const hemi = new THREE.HemisphereLight(0xd8eff7, 0x5c543d, 2.0);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffe0aa, 4.2);
    sun.position.set(-42, 62, 28);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -70;
    sun.shadow.camera.right = 70;
    sun.shadow.camera.top = 70;
    sun.shadow.camera.bottom = -70;
    sun.shadow.camera.near = 10;
    sun.shadow.camera.far = 170;
    sun.shadow.bias = -0.0003;
    scene.add(sun);

    const sunDisc = new THREE.Mesh(
      new THREE.SphereGeometry(2.7, 24, 16),
      new THREE.MeshBasicMaterial({ color: 0xffdfac, fog: false })
    );
    sunDisc.position.set(-95, 72, -130);
    scene.add(sunDisc);

    const terrainMat = new THREE.MeshStandardMaterial({
      map: grassTexture,
      color: 0x879568,
      roughness: 1
    });

    const terrainGeo = new THREE.PlaneGeometry(170, 165, 70, 70);
    terrainGeo.rotateX(-Math.PI / 2);
    const tp = terrainGeo.attributes.position;
    for (let i = 0; i < tp.count; i++) {
      const x = tp.getX(i);
      const z = tp.getZ(i);
      const lakeDistance = Math.sqrt((x * .78) ** 2 + ((z + 17) * .55) ** 2);
      let h = Math.max(0, lakeDistance - 31) * .09;
      h += Math.sin(x * .14) * .35 + Math.cos(z * .18) * .3;
      h += Math.sin((x + z) * .08) * .25;
      if (z > 18) h += (z - 18) * .11;
      tp.setY(i, h - 0.3);
    }
    terrainGeo.computeVertexNormals();
    const terrain = new THREE.Mesh(terrainGeo, terrainMat);
    terrain.receiveShadow = true;
    terrain.position.z = -3;
    scene.add(terrain);

    const shoreMat = new THREE.MeshStandardMaterial({
      color: 0xa99c79,
      roughness: 1
    });
    const shore = new THREE.Mesh(
      new THREE.RingGeometry(31, 36, 96, 5, 0, Math.PI * 2),
      shoreMat
    );
    shore.rotation.x = -Math.PI / 2;
    shore.scale.set(.78, .55, 1);
    shore.position.set(0, 0.02, -20);
    shore.receiveShadow = true;
    scene.add(shore);

    const waterGeo = new THREE.CircleGeometry(32, 128);
    const waterMat = new THREE.MeshPhysicalMaterial({
      color: 0x6e9b9e,
      metalness: 0.08,
      roughness: 0.08,
      transmission: 0.18,
      transparent: true,
      opacity: 0.92,
      clearcoat: 1,
      clearcoatRoughness: 0.06,
      side: THREE.DoubleSide
    });
    const water = new THREE.Mesh(waterGeo, waterMat);
    water.rotation.x = -Math.PI / 2;
    water.scale.set(.78, .55, 1);
    water.position.set(0, 0.12, -20);
    water.receiveShadow = true;
    scene.add(water);

    const mountainGroup = new THREE.Group();
    scene.add(mountainGroup);

    function makeMountain(x, z, radius, height, color, snowLine) {
      const segments = 9;
      const levels = 10;
      const vertices = [];
      const indices = [];

      for (let y = 0; y <= levels; y++) {
        const t = y / levels;
        const ringRadius = radius * Math.pow(1 - t, .82);
        for (let j = 0; j < segments; j++) {
          const angle = j / segments * Math.PI * 2;
          const noise = 1 + Math.sin(j * 5.3 + y * 1.7) * .08 + rand(-.08, .08);
          vertices.push(
            Math.cos(angle) * ringRadius * noise,
            t * height + rand(-.18, .18),
            Math.sin(angle) * ringRadius * noise
          );
        }
      }

      vertices.push(0, height * 1.04, 0);
      const tip = vertices.length / 3 - 1;

      for (let y = 0; y < levels; y++) {
        for (let j = 0; j < segments; j++) {
          const a = y * segments + j;
          const b = y * segments + (j + 1) % segments;
          const c = (y + 1) * segments + j;
          const d = (y + 1) * segments + (j + 1) % segments;
          indices.push(a, c, b, b, c, d);
        }
      }
      for (let j = 0; j < segments; j++) {
        indices.push(levels * segments + j, tip, levels * segments + (j + 1) % segments);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      const mountain = new THREE.Mesh(
        geometry,
        new THREE.MeshStandardMaterial({
          color,
          roughness: 1,
          flatShading: true
        })
      );
      mountain.position.set(x, -1, z);
      mountain.castShadow = true;
      mountain.receiveShadow = true;
      mountainGroup.add(mountain);

      const snowHeight = height * snowLine;
      const snow = new THREE.Mesh(
        new THREE.ConeGeometry(radius * (1 - snowLine) * 1.14, height * (1 - snowLine) * 1.05, 9),
        new THREE.MeshStandardMaterial({
          color: 0xe8eee9,
          roughness: .82,
          flatShading: true
        })
      );
      snow.position.set(x, snowHeight + height * (1 - snowLine) * .49 - 1, z);
      snow.rotation.y = rand(0, Math.PI);
      snow.castShadow = true;
      mountainGroup.add(snow);
    }

    makeMountain(-39, -84, 26, 43, 0x687b78, .64);
    makeMountain(-17, -91, 29, 53, 0x637578, .59);
    makeMountain(11, -96, 35, 59, 0x5e7075, .57);
    makeMountain(39, -86, 27, 46, 0x697b79, .63);
    makeMountain(61, -90, 24, 38, 0x74837d, .68);

    const trunkMat = new THREE.MeshStandardMaterial({
      color: 0x5d3e27,
      roughness: 1
    });
    const pineMats = [
      new THREE.MeshStandardMaterial({ color: 0x244d3b, roughness: .95 }),
      new THREE.MeshStandardMaterial({ color: 0x315b43, roughness: .95 }),
      new THREE.MeshStandardMaterial({ color: 0x3b674a, roughness: .95 })
    ];

    function createPine(x, z, scale = 1) {
      const group = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(.18 * scale, .3 * scale, 3.4 * scale, 7),
        trunkMat
      );
      trunk.position.y = 1.7 * scale;
      trunk.castShadow = true;
      group.add(trunk);

      for (let i = 0; i < 4; i++) {
        const foliage = new THREE.Mesh(
          new THREE.ConeGeometry((1.65 - i * .24) * scale, 2.8 * scale, 9),
          pineMats[(i + Math.floor(random() * 3)) % 3]
        );
        foliage.position.y = (2.6 + i * 1.2) * scale;
        foliage.castShadow = true;
        foliage.receiveShadow = true;
        group.add(foliage);
      }

      group.position.set(x, 0, z);
      group.rotation.y = rand(0, Math.PI * 2);
      scene.add(group);
      return group;
    }

    for (let i = 0; i < 85; i++) {
      const angle = rand(0, Math.PI * 2);
      const radius = rand(35, 70);
      const x = Math.cos(angle) * radius;
      const z = -20 + Math.sin(angle) * radius * .7;
      if (z > 5 && x > -24 && x < 30 && random() < .75) continue;
      createPine(x, z, rand(.65, 1.55));
    }

    for (let i = 0; i < 24; i++) {
      createPine(rand(-67, 67), rand(-83, -58), rand(.7, 1.2));
    }

    const rockMat = new THREE.MeshStandardMaterial({
      map: rockTexture,
      color: 0x8a8c82,
      roughness: .95,
      flatShading: true
    });

    function createBoulder(x, z, scale = 1) {
      const rock = new THREE.Mesh(
        new THREE.DodecahedronGeometry(scale, 1),
        rockMat
      );
      rock.position.set(x, scale * .55, z);
      rock.scale.set(rand(.8, 1.5), rand(.55, .95), rand(.8, 1.4));
      rock.rotation.set(rand(-.25, .25), rand(0, Math.PI), rand(-.15, .15));
      rock.castShadow = true;
      rock.receiveShadow = true;
      scene.add(rock);
    }

    for (let i = 0; i < 42; i++) {
      const a = rand(0, Math.PI * 2);
      const r = rand(31, 39);
      createBoulder(
        Math.cos(a) * r * .78,
        -20 + Math.sin(a) * r * .55,
        rand(.25, 1.35)
      );
    }

    const cabin = new THREE.Group();
    cabin.position.set(-20, .55, 13);
    cabin.rotation.y = .16;
    scene.add(cabin);

    const cabinWallMat = new THREE.MeshStandardMaterial({
      map: woodTexture,
      color: 0x9a6941,
      roughness: .9
    });
    const darkWoodMat = new THREE.MeshStandardMaterial({
      color: 0x49301f,
      roughness: .85
    });

    const cabinBody = new THREE.Mesh(
      new THREE.BoxGeometry(10, 5.5, 7.5),
      cabinWallMat
    );
    cabinBody.position.y = 2.75;
    cabinBody.castShadow = true;
    cabinBody.receiveShadow = true;
    cabin.add(cabinBody);

    const roofShape = new THREE.Shape();
    roofShape.moveTo(-5.8, 0);
    roofShape.lineTo(0, 3.2);
    roofShape.lineTo(5.8, 0);
    roofShape.lineTo(-5.8, 0);
    const roofGeo = new THREE.ExtrudeGeometry(roofShape, {
      depth: 8.8,
      bevelEnabled: false
    });
    roofGeo.translate(0, 0, -4.4);
    const roof = new THREE.Mesh(
      roofGeo,
      new THREE.MeshStandardMaterial({
        map: roofTexture,
        color: 0x62564a,
        roughness: 1
      })
    );
    roof.position.y = 5.48;
    roof.castShadow = true;
    cabin.add(roof);

    const door = new THREE.Mesh(
      new THREE.BoxGeometry(2.1, 3.7, .18),
      darkWoodMat
    );
    door.position.set(1.8, 1.85, 3.84);
    cabin.add(door);

    const handle = new THREE.Mesh(
      new THREE.SphereGeometry(.08, 10, 8),
      new THREE.MeshStandardMaterial({ color: 0xb89a54, metalness: .6, roughness: .3 })
    );
    handle.position.set(2.55, 1.9, 3.96);
    cabin.add(handle);

    const windowGlowMat = new THREE.MeshStandardMaterial({
      color: 0x694b2d,
      emissive: 0xffa83e,
      emissiveIntensity: 1.3,
      roughness: .2
    });

    function cabinWindow(x, y, z, ry = 0) {
      const frame = new THREE.Group();
      const pane = new THREE.Mesh(
        new THREE.PlaneGeometry(2.2, 1.7),
        windowGlowMat
      );
      frame.add(pane);
      const bars = [
        new THREE.Mesh(new THREE.BoxGeometry(.12, 1.9, .12), darkWoodMat),
        new THREE.Mesh(new THREE.BoxGeometry(2.4, .12, .12), darkWoodMat)
      ];
      bars[0].position.z = .04;
      bars[1].position.z = .04;
      frame.add(...bars);
      frame.position.set(x, y, z);
      frame.rotation.y = ry;
      cabin.add(frame);
    }

    cabinWindow(-2, 3, 3.86);
    cabinWindow(5.11, 3, -.8, Math.PI / 2);

    const chimney = new THREE.Mesh(
      new THREE.BoxGeometry(1.05, 3.6, 1.05),
      new THREE.MeshStandardMaterial({ color: 0x665f57, roughness: 1 })
    );
    chimney.position.set(-2.3, 8, -.5);
    chimney.castShadow = true;
    cabin.add(chimney);

    const smokePuffs = [];
    const smokeMat = new THREE.MeshStandardMaterial({
      color: 0xd8ddda,
      transparent: true,
      opacity: .24,
      depthWrite: false,
      roughness: 1
    });

    for (let i = 0; i < 14; i++) {
      const puff = new THREE.Mesh(
        new THREE.SphereGeometry(rand(.35, .8), 10, 8),
        smokeMat.clone()
      );
      puff.userData.offset = i / 14;
      puff.userData.phase = rand(0, Math.PI * 2);
      puff.position.copy(cabin.position);
      scene.add(puff);
      smokePuffs.push(puff);
    }

    const dock = new THREE.Group();
    dock.position.set(12, .42, 5);
    dock.rotation.y = -.12;
    scene.add(dock);

    const dockMat = new THREE.MeshStandardMaterial({
      map: woodTexture,
      color: 0x816042,
      roughness: .92
    });

    for (let i = 0; i < 14; i++) {
      const plank = new THREE.Mesh(
        new THREE.BoxGeometry(3.6, .22, .72),
        dockMat
      );
      plank.position.set(0, 0, -i * .72);
      plank.rotation.y = rand(-.012, .012);
      plank.castShadow = true;
      plank.receiveShadow = true;
      dock.add(plank);
    }

    for (const x of [-1.45, 1.45]) {
      for (const z of [0, -4.5, -9]) {
        const post = new THREE.Mesh(
          new THREE.CylinderGeometry(.18, .23, 2.4, 8),
          darkWoodMat
        );
        post.position.set(x, -.45, z);
        post.castShadow = true;
        dock.add(post);
      }
    }

    const boat = new THREE.Group();
    boat.position.set(17.2, .5, -5.5);
    boat.rotation.y = -.18;
    scene.add(boat);

    const hullMat = new THREE.MeshStandardMaterial({
      color: 0x9b3f2c,
      roughness: .72,
      side: THREE.DoubleSide
    });
    const boatWoodMat = new THREE.MeshStandardMaterial({
      color: 0xb68a55,
      roughness: .8
    });

    function boatSide(sign) {
      const shape = new THREE.Shape();
      shape.moveTo(-4.2, 0);
      shape.quadraticCurveTo(-3.4, 1.15, 0, 1.25);
      shape.quadraticCurveTo(3.4, 1.15, 4.2, 0);
      shape.quadraticCurveTo(2.3, .25, 0, .3);
      shape.quadraticCurveTo(-2.3, .25, -4.2, 0);
      const side = new THREE.Mesh(
        new THREE.ShapeGeometry(shape, 18),
        hullMat
      );
      side.position.set(0, 0, sign * .92);
      side.rotation.y = sign > 0 ? Math.PI : 0;
      side.castShadow = true;
      boat.add(side);
    }

    boatSide(1);
    boatSide(-1);

    const keel = new THREE.Mesh(
      new THREE.BoxGeometry(7.7, .28, 1.65),
      hullMat
    );
    keel.position.y = .2;
    boat.add(keel);

    for (const x of [-1.8, 0, 1.8]) {
      const seat = new THREE.Mesh(
        new THREE.BoxGeometry(.55, .18, 2.25),
        boatWoodMat
      );
      seat.position.set(x, 1.03, 0);
      seat.castShadow = true;
      boat.add(seat);
    }

    const oar = new THREE.Group();
    const oarShaft = new THREE.Mesh(
      new THREE.CylinderGeometry(.055, .07, 5.8, 8),
      boatWoodMat
    );
    oarShaft.rotation.z = Math.PI / 2;
    oar.add(oarShaft);
    const blade = new THREE.Mesh(
      new THREE.BoxGeometry(1.15, .13, .42),
      boatWoodMat
    );
    blade.position.x = 3.25;
    oar.add(blade);
    oar.position.set(.3, 1.18, 0);
    oar.rotation.y = -.58;
    boat.add(oar);

    const ropeCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(15.6, 1.1, -4.8),
      new THREE.Vector3(14.5, .65, -2.3),
      new THREE.Vector3(13.25, 1.0, -1.4)
    ]);
    const rope = new THREE.Mesh(
      new THREE.TubeGeometry(ropeCurve, 24, .045, 7, false),
      new THREE.MeshStandardMaterial({ color: 0x9a865d, roughness: 1 })
    );
    scene.add(rope);

    const rippleMat = new THREE.MeshBasicMaterial({
      color: 0xc7e3df,
      transparent: true,
      opacity: .25,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const ripples = [];

    for (let i = 0; i < 7; i++) {
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(.93, 1, 64),
        rippleMat.clone()
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(17.2, .155, -5.5);
      ring.userData.offset = i / 7;
      scene.add(ring);
      ripples.push(ring);
    }

    const fireGroup = new THREE.Group();
    fireGroup.position.set(-4, .15, 11);
    scene.add(fireGroup);

    for (let i = 0; i < 12; i++) {
      const a = i / 12 * Math.PI * 2;
      const stone = new THREE.Mesh(
        new THREE.DodecahedronGeometry(.42, 0),
        rockMat
      );
      stone.position.set(Math.cos(a) * 1.25, .28, Math.sin(a) * 1.25);
      stone.scale.y = .65;
      stone.castShadow = true;
      fireGroup.add(stone);
    }

    for (const r of [-.55, .55]) {
      const log = new THREE.Mesh(
        new THREE.CylinderGeometry(.18, .22, 2.2, 8),
        trunkMat
      );
      log.rotation.z = Math.PI / 2;
      log.rotation.y = r;
      log.position.y = .38;
      fireGroup.add(log);
    }

    const flameMats = [
      new THREE.MeshBasicMaterial({ color: 0xffc342, transparent: true, opacity: .9 }),
      new THREE.MeshBasicMaterial({ color: 0xff6b20, transparent: true, opacity: .82 })
    ];
    const flames = [];

    for (let i = 0; i < 7; i++) {
      const flame = new THREE.Mesh(
        new THREE.ConeGeometry(rand(.18, .4), rand(.7, 1.35), 7),
        flameMats[i % 2]
      );
      flame.position.set(rand(-.45, .45), rand(.65, .95), rand(-.4, .4));
      flame.userData.phase = rand(0, Math.PI * 2);
      fireGroup.add(flame);
      flames.push(flame);
    }

    const fireLight = new THREE.PointLight(0xff7b32, 4.5, 13, 2);
    fireLight.position.set(0, 1.3, 0);
    fireLight.castShadow = true;
    fireLight.shadow.mapSize.set(512, 512);
    fireGroup.add(fireLight);

    const flowerGroup = new THREE.Group();
    scene.add(flowerGroup);
    const flowerColors = [0xffd34f, 0xe9eef7, 0x8fa5ff, 0xee7e9f, 0xc9a4e8];
    const flowerHeads = [];

    function makeFlower(x, z, color) {
      const group = new THREE.Group();
      const stem = new THREE.Mesh(
        new THREE.CylinderGeometry(.018, .025, .48, 5),
        new THREE.MeshStandardMaterial({ color: 0x47743d, roughness: 1 })
      );
      stem.position.y = .24;
      group.add(stem);

      const petals = new THREE.Group();
      for (let i = 0; i < 5; i++) {
        const petal = new THREE.Mesh(
          new THREE.SphereGeometry(.09, 6, 5),
          new THREE.MeshStandardMaterial({ color, roughness: .8 })
        );
        const a = i / 5 * Math.PI * 2;
        petal.scale.set(1.4, .45, .7);
        petal.position.set(Math.cos(a) * .1, 0, Math.sin(a) * .1);
        petals.add(petal);
      }
      const center = new THREE.Mesh(
        new THREE.SphereGeometry(.065, 7, 5),
        new THREE.MeshStandardMaterial({ color: 0xe5a82c, roughness: .7 })
      );
      petals.add(center);
      petals.position.y = .51;
      group.add(petals);

      group.position.set(x, 0, z);
      group.rotation.y = rand(0, Math.PI * 2);
      group.scale.setScalar(rand(.75, 1.35));
      group.userData.phase = rand(0, Math.PI * 2);
      flowerGroup.add(group);
      flowerHeads.push(group);
    }

    for (let i = 0; i < 145; i++) {
      let x = rand(-31, 32);
      let z = rand(7, 31);
      if (x < -12 && z < 22) continue;
      if (Math.hypot(x + 4, z - 11) < 3) continue;
      makeFlower(x, z, pick(flowerColors));
    }

    const grassBlades = [];
    const bladeMat = new THREE.MeshStandardMaterial({
      color: 0x607e47,
      roughness: 1,
      side: THREE.DoubleSide
    });

    for (let i = 0; i < 350; i++) {
      const blade = new THREE.Mesh(
        new THREE.PlaneGeometry(.05, rand(.35, .85)),
        bladeMat
      );
      blade.position.set(rand(-38, 38), .3, rand(4, 35));
      blade.rotation.y = rand(0, Math.PI);
      blade.userData.phase = rand(0, Math.PI * 2);
      scene.add(blade);
      grassBlades.push(blade);
    }

    const mistPatches = [];
    const mistTexture = canvasTexture(128, (ctx, s) => {
      const gradient = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
      gradient.addColorStop(0, 'rgba(255,255,255,.65)');
      gradient.addColorStop(.45, 'rgba(245,250,248,.28)');
      gradient.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, s, s);
    });

    const mistMat = new THREE.MeshBasicMaterial({
      map: mistTexture,
      transparent: true,
      opacity: .18,
      depthWrite: false,
      side: THREE.DoubleSide,
      color: 0xe8f1ee
    });

    for (let i = 0; i < 28; i++) {
      const mist = new THREE.Mesh(
        new THREE.PlaneGeometry(rand(5, 12), rand(1.5, 3.5)),
        mistMat.clone()
      );
      mist.position.set(rand(-23, 23), rand(.5, 2.2), rand(-42, -4));
      mist.rotation.y = rand(-.35, .35);
      mist.userData.speed = rand(.18, .5);
      mist.userData.phase = rand(0, Math.PI * 2);
      scene.add(mist);
      mistPatches.push(mist);
    }

    const cubeTarget = new THREE.WebGLCubeRenderTarget(256, {
      generateMipmaps: true,
      minFilter: THREE.LinearMipmapLinearFilter
    });
    const cubeCamera = new THREE.CubeCamera(.5, 180, cubeTarget);
    cubeCamera.position.set(0, 1.0, -20);
    scene.add(cubeCamera);
    waterMat.envMap = cubeTarget.texture;

    water.visible = false;
    cubeCamera.update(renderer, scene);
    water.visible = true;

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      boat.position.y = .5 + Math.sin(t * .75) * .055;
      boat.rotation.z = Math.sin(t * .58) * .012;
      boat.rotation.x = Math.sin(t * .47 + 1) * .009;

      ripples.forEach((ring, i) => {
        const p = (t * .085 + ring.userData.offset) % 1;
        const scale = .5 + p * 7.5;
        ring.scale.set(scale * 1.25, scale * .58, 1);
        ring.material.opacity = .3 * Math.sin(p * Math.PI);
        ring.position.x = boat.position.x + Math.sin(t * .2 + i) * .08;
      });

      smokePuffs.forEach((puff, i) => {
        const p = (t * .075 + puff.userData.offset) % 1;
        puff.position.set(
          cabin.position.x - 2.1 + Math.sin(p * 9 + puff.userData.phase) * .65 + p * 2.5,
          cabin.position.y + 9.2 + p * 10,
          cabin.position.z - .6 + Math.cos(p * 7 + puff.userData.phase) * .35
        );
        const s = .45 + p * 2.1;
        puff.scale.set(s * 1.2, s, s);
        puff.material.opacity = .22 * (1 - p);
      });

      mistPatches.forEach((mist, i) => {
        mist.position.x += mist.userData.speed * .004;
        mist.position.y = .65 + Math.sin(t * .22 + mist.userData.phase) * .35 + (i % 4) * .18;
        mist.material.opacity = .09 + .1 * (Math.sin(t * .18 + mist.userData.phase) * .5 + .5);
        if (mist.position.x > 26) mist.position.x = -26;
        mist.lookAt(camera.position.x, mist.position.y, camera.position.z);
      });

      flames.forEach((flame) => {
        const pulse = 1 + Math.sin(t * 8 + flame.userData.phase) * .25;
        flame.scale.set(pulse, .8 + pulse * .35, pulse);
        flame.rotation.y += .035;
      });
      fireLight.intensity = 4.1 + Math.sin(t * 11) * .65 + Math.sin(t * 17) * .3;

      flowerHeads.forEach((flower) => {
        flower.rotation.z = Math.sin(t * 1.15 + flower.userData.phase) * .035;
      });

      grassBlades.forEach((blade) => {
        blade.rotation.z = Math.sin(t * 1.35 + blade.userData.phase) * .06;
      });

      waterMat.roughness = .075 + Math.sin(t * .32) * .008;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
