<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pumpkin Patch Farm</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#201428}
  canvas{display:block}
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ================================================================
// 1. CONFIG & PALETTE - warm autumn harvest at moonrise
// ================================================================
const SEED = 31415926;
const PAL = {
  soil: 0x4a3524, field: 0x8a6a38, barnRed: 0xa03428, trim: 0xe8e2d4,
  roofDark: 0x4a4038, wood: 0x8a7358, hay: 0xc9a24e, vine: 0x5a7a2e,
  pumpkin: 0xe07818, cream: 0xe8dcc4, bark: 0x4a392b, crow: 0x14141c,
  amber: 0xffb45c, moon: 0xff9838, duskFog: 0x3a2438
};
const PUMP_TINTS = [0xff8c28, 0xf07818, 0xe8a040, 0xd4691e, 0xf5a03c, 0xc75a14, 0xe8d8b8, 0x9aa04a];

// ================================================================
// 2. SEEDED PRNG & SMALL HELPERS
// ================================================================
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(SEED);
const rr = (a, b) => a + (b - a) * rand();
const pick = arr => arr[Math.floor(rand() * arr.length) % arr.length];
function mesh(geo, mat, x = 0, y = 0, z = 0){
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m;
}
function shadowify(g){
  g.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  return g;
}

// ---- core renderer / camera / controls ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(PAL.duskFog, 60, 155);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 420);
camera.position.set(27, 15, 34);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.6, 2);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.autoRotate = true; controls.autoRotateSpeed = 0.85;
controls.minDistance = 22; controls.maxDistance = 80;
controls.maxPolarAngle = 1.43;

// ================================================================
// 3. PROCEDURAL CANVAS TEXTURES
// ================================================================
function makeTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const groundTex = makeTex(512, 512, g => {
  g.fillStyle = '#8a6a38'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 2600; i++){
    g.strokeStyle = pick(['#7a5c30', '#a8863f', '#6b7a3a', '#96703c']);
    g.globalAlpha = 0.25 + rand() * 0.4; g.lineWidth = 1.4;
    const x = rand() * 512, y = rand() * 512;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + rr(-3, 3), y - rr(3, 8)); g.stroke();
  }
  g.globalAlpha = 1;
});
groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping; groundTex.repeat.set(8, 8);
const soilTex = makeTex(256, 256, g => {
  g.fillStyle = '#4a3524'; g.fillRect(0, 0, 256, 256);
  for (let y = 10; y < 256; y += 26){
    g.fillStyle = 'rgba(28,18,10,0.55)'; g.fillRect(0, y, 256, 5);
    g.fillStyle = 'rgba(120,88,54,0.3)'; g.fillRect(0, y + 8, 256, 3);
  }
  for (let i = 0; i < 500; i++){
    g.fillStyle = `rgba(${rand() < 0.5 ? '30,20,12' : '130,100,64'},0.35)`;
    g.fillRect(rand() * 256, rand() * 256, 2.2, 2.2);
  }
});
soilTex.wrapS = soilTex.wrapT = THREE.RepeatWrapping; soilTex.repeat.set(3, 2);
const barnTex = makeTex(256, 256, g => {
  g.fillStyle = '#a03428'; g.fillRect(0, 0, 256, 256);
  for (let x = 0; x < 256; x += 22){
    g.fillStyle = 'rgba(70,18,12,0.6)'; g.fillRect(x, 0, 3, 256);
    g.fillStyle = 'rgba(220,120,90,0.12)'; g.fillRect(x + 8, 0, 2, 256);
  }
  for (let i = 0; i < 90; i++){
    g.fillStyle = 'rgba(60,20,14,0.25)';
    g.fillRect(rand() * 256, rand() * 256, 2, rr(8, 40));
  }
});
barnTex.wrapS = barnTex.wrapT = THREE.RepeatWrapping; barnTex.repeat.set(1.4, 1.4);
const doorTex = makeTex(128, 128, g => {
  g.fillStyle = '#8a2a20'; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = '#e8e2d4'; g.lineWidth = 9;
  g.strokeRect(6, 6, 116, 116);
  g.beginPath(); g.moveTo(8, 8); g.lineTo(120, 120); g.moveTo(120, 8); g.lineTo(8, 120); g.stroke();
});
const woodTex = makeTex(256, 256, g => {
  g.fillStyle = '#8a7358'; g.fillRect(0, 0, 256, 256);
  for (let y = 0; y < 256; y += 20){
    g.fillStyle = `rgba(48,36,24,${0.25 + rand() * 0.2})`; g.fillRect(0, y, 256, 3);
  }
  for (let i = 0; i < 70; i++){
    g.strokeStyle = 'rgba(60,46,30,0.3)'; g.lineWidth = 1;
    const y = rand() * 256; g.beginPath(); g.moveTo(0, y);
    g.quadraticCurveTo(128, y + rr(-5, 5), 256, y); g.stroke();
  }
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;
const hayTex = makeTex(256, 256, g => {
  g.fillStyle = '#c9a24e'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1500; i++){
    g.strokeStyle = pick(['#e0c070', '#a07830', '#d8b25e']);
    g.globalAlpha = 0.5; g.lineWidth = 1.2;
    const x = rand() * 256, y = rand() * 256, a = rr(-0.5, 0.5);
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * 14, y + Math.sin(a) * 14); g.stroke();
  }
  g.globalAlpha = 1;
});
const pumpkinTex = makeTex(256, 128, g => {
  g.fillStyle = '#e58020'; g.fillRect(0, 0, 256, 128);
  for (let x = 0; x < 256; x += 32){
    const lg = g.createLinearGradient(x, 0, x + 32, 0);
    lg.addColorStop(0, 'rgba(150,70,10,0.55)'); lg.addColorStop(0.35, 'rgba(255,170,80,0.18)');
    lg.addColorStop(0.7, 'rgba(255,190,110,0.12)'); lg.addColorStop(1, 'rgba(150,70,10,0.55)');
    g.fillStyle = lg; g.fillRect(x, 0, 32, 128);
  }
});
function drawFace(g, u, glow){
  const cx = u * 256;
  g.fillStyle = glow ? '#ffd23a' : '#1a0c04';
  for (const s of [-1, 1]){                                // triangle eyes
    g.beginPath(); g.moveTo(cx + s * 22, 48); g.lineTo(cx + s * 10, 48); g.lineTo(cx + s * 16, 34);
    g.closePath(); g.fill();
  }
  g.beginPath(); g.moveTo(cx - 5, 62); g.lineTo(cx + 5, 62); g.lineTo(cx, 53); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(cx - 26, 78);                    // zigzag grin
  g.lineTo(cx - 14, 88); g.lineTo(cx - 7, 78); g.lineTo(cx, 88);
  g.lineTo(cx + 7, 78); g.lineTo(cx + 14, 88); g.lineTo(cx + 26, 78);
  g.lineTo(cx + 14, 96); g.lineTo(cx, 90); g.lineTo(cx - 14, 96); g.closePath(); g.fill();
}
const jackMap = makeTex(256, 128, g => {
  g.drawImage(pumpkinTex.image, 0, 0); drawFace(g, 0.25, false);
});
const jackEmis = makeTex(256, 128, g => {
  g.fillStyle = '#000'; g.fillRect(0, 0, 256, 128); drawFace(g, 0.25, true);
});
const cornTex = makeTex(128, 256, g => {
  g.clearRect(0, 0, 128, 256);
  g.strokeStyle = '#c9a24e'; g.lineWidth = 6;
  g.beginPath(); g.moveTo(64, 256); g.quadraticCurveTo(70, 120, 62, 20); g.stroke();
  g.lineWidth = 3.4;
  for (let i = 0; i < 7; i++){
    const y = 210 - i * 28, s = i % 2 ? 1 : -1;
    g.strokeStyle = pick(['#b8923e', '#d4ae58', '#a8842f']);
    g.beginPath(); g.moveTo(64, y);
    g.quadraticCurveTo(64 + s * 34, y - 22, 64 + s * 56, y - 8); g.stroke();
  }
  g.strokeStyle = '#d8b96a'; g.lineWidth = 2;
  for (const dx of [-8, 0, 8]){
    g.beginPath(); g.moveTo(62, 24); g.lineTo(62 + dx, 4); g.stroke();
  }
});
const leafTex = makeTex(64, 64, g => {
  g.clearRect(0, 0, 64, 64);
  g.fillStyle = '#e8e8e8';
  g.beginPath(); g.moveTo(32, 6); g.quadraticCurveTo(58, 22, 32, 58);
  g.quadraticCurveTo(6, 22, 32, 6); g.fill();
  g.strokeStyle = '#909090'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(32, 8); g.lineTo(32, 56); g.stroke();
});
const glowTex = makeTex(128, 128, g => {
  const rg = g.createRadialGradient(64, 64, 2, 64, 64, 64);
  rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(0.3, 'rgba(255,255,255,0.35)');
  rg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
});
const moonTex = makeTex(256, 256, g => {
  g.clearRect(0, 0, 256, 256);
  const rg = g.createRadialGradient(128, 128, 20, 128, 128, 122);
  rg.addColorStop(0, '#ffd9a0'); rg.addColorStop(0.6, '#ffb24a'); rg.addColorStop(1, '#f08428');
  g.fillStyle = rg; g.beginPath(); g.arc(128, 128, 120, 0, 7); g.fill();
  for (let i = 0; i < 11; i++){
    const a = rand() * Math.PI * 2, d = rand() * 85;
    g.fillStyle = 'rgba(205,110,40,0.32)';
    g.beginPath(); g.ellipse(128 + Math.cos(a) * d, 128 + Math.sin(a) * d, rr(7, 22), rr(6, 16), a, 0, 7); g.fill();
  }
});
const winTex = makeTex(64, 80, g => {
  g.fillStyle = '#2c2016'; g.fillRect(0, 0, 64, 80);
  const rg = g.createRadialGradient(32, 40, 4, 32, 40, 52);
  rg.addColorStop(0, '#ffe7b0'); rg.addColorStop(0.6, '#f7b45c'); rg.addColorStop(1, '#c97b2e');
  g.fillStyle = rg; g.fillRect(5, 5, 54, 70);
  g.fillStyle = '#3a2814'; g.fillRect(29, 5, 6, 70); g.fillRect(5, 37, 54, 6);
});
const plaidTex = makeTex(64, 64, g => {
  g.fillStyle = '#8a2a22'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = 'rgba(30,20,20,0.5)';
  for (let i = 0; i < 64; i += 16){ g.fillRect(i, 0, 5, 64); g.fillRect(0, i, 64, 5); }
  g.fillStyle = 'rgba(230,190,80,0.6)';
  for (let i = 8; i < 64; i += 16){ g.fillRect(i, 0, 2, 64); g.fillRect(0, i, 64, 2); }
});
const skyTex = makeTex(16, 256, g => {
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#151027'); gr.addColorStop(0.4, '#3a2145');
  gr.addColorStop(0.5, '#7a3a50'); gr.addColorStop(0.55, '#c96a38');
  gr.addColorStop(0.62, '#4a2a45'); gr.addColorStop(1, '#2a1a35');
  g.fillStyle = gr; g.fillRect(0, 0, 16, 256);
});

// ================================================================
// 4. MATERIALS
// ================================================================
const matGround = new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.95 });
const matSoil   = new THREE.MeshStandardMaterial({ map: soilTex, roughness: 0.98 });
const matBarn   = new THREE.MeshStandardMaterial({ map: barnTex, roughness: 0.85 });
const matDoor   = new THREE.MeshStandardMaterial({ map: doorTex, roughness: 0.8 });
const matTrim   = new THREE.MeshStandardMaterial({ color: PAL.trim, roughness: 0.8 });
const matRoof   = new THREE.MeshStandardMaterial({ map: woodTex, color: PAL.roofDark, roughness: 0.9 });
const matWood   = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.85 });
const matWoodDk = new THREE.MeshStandardMaterial({ map: woodTex, color: 0x6a5640, roughness: 0.85 });
const matHay    = new THREE.MeshStandardMaterial({ map: hayTex, roughness: 0.95 });
const matPump   = new THREE.MeshStandardMaterial({ map: pumpkinTex, roughness: 0.55 });
const matStem   = new THREE.MeshStandardMaterial({ color: 0x5a6828, roughness: 0.8 });
const matVine   = new THREE.MeshStandardMaterial({ color: PAL.vine, roughness: 0.85 });
const matLeaf   = new THREE.MeshStandardMaterial({ map: leafTex, color: 0x5f7c30, transparent: true, alphaTest: 0.4, side: THREE.DoubleSide, roughness: 0.9 });
const matCorn   = new THREE.MeshStandardMaterial({ map: cornTex, transparent: true, alphaTest: 0.45, side: THREE.DoubleSide, roughness: 0.9 });
const matCream  = new THREE.MeshStandardMaterial({ map: woodTex, color: PAL.cream, roughness: 0.85 });
const matWin    = new THREE.MeshStandardMaterial({ map: winTex, emissive: PAL.amber, emissiveMap: winTex, emissiveIntensity: 1.6, roughness: 0.5 });
const matBark   = new THREE.MeshStandardMaterial({ color: PAL.bark, roughness: 0.95 });
const matCrow   = new THREE.MeshStandardMaterial({ color: PAL.crow, roughness: 0.45, metalness: 0.2 });
const matBeak   = new THREE.MeshStandardMaterial({ color: 0x8a6a2a, roughness: 0.6 });
const matPlaid  = new THREE.MeshStandardMaterial({ map: plaidTex, roughness: 0.9 });
const matBurlap = new THREE.MeshStandardMaterial({ color: 0xc4a878, roughness: 0.95 });
const matJack   = new THREE.MeshStandardMaterial({ map: jackMap, emissive: 0xffb040, emissiveMap: jackEmis, emissiveIntensity: 2.2, roughness: 0.55 });

// ================================================================
// 5. BUILDER FUNCTIONS
// ================================================================
function gableRoof(parent, w, d, wallH, peakH){
  const A = Math.atan2(peakH, w / 2), slope = Math.hypot(peakH, w / 2) + 0.7;
  for (const s of [-1, 1]){
    const slab = mesh(new THREE.BoxGeometry(slope, 0.16, d + 1.0), matRoof,
      s * w / 4 + s * Math.sin(A) * 0.09, wallH + peakH / 2 + Math.cos(A) * 0.09, 0);
    slab.rotation.z = -s * A; parent.add(slab);
  }
  const ridge = mesh(new THREE.CylinderGeometry(0.14, 0.14, d + 1.0, 8), matRoof, 0, wallH + peakH + 0.12, 0);
  ridge.rotation.x = Math.PI / 2; parent.add(ridge);
}
function triGeo(w, peak, depth){
  const s = new THREE.Shape();
  s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(0, peak); s.closePath();
  return new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false });
}
function buildBarn(){
  const g = new THREE.Group();
  g.add(mesh(new THREE.BoxGeometry(9.6, 0.24, 11.6), matWoodDk, 0, 0.12, 0));
  g.add(mesh(new THREE.BoxGeometry(0.3, 6, 12), matBarn, -4.85, 3, 0));
  g.add(mesh(new THREE.BoxGeometry(0.3, 6, 12), matBarn, 4.85, 3, 0));
  g.add(mesh(new THREE.BoxGeometry(10, 6, 0.3), matBarn, 0, 3, -5.85));
  for (const sx of [-3.65, 3.65]) g.add(mesh(new THREE.BoxGeometry(2.7, 6, 0.3), matBarn, sx, 3, 5.85));
  g.add(mesh(new THREE.BoxGeometry(4.6, 1.2, 0.3), matBarn, 0, 5.4, 5.85));
  const gab = triGeo(10, 2.8, 0.3);
  g.add(mesh(gab, matBarn, 0, 6, 5.55));
  g.add(mesh(gab, matBarn, 0, 6, -5.85));
  gableRoof(g, 10, 12, 6, 2.8);
  for (const [cx, cz] of [[-4.85, 5.85], [4.85, 5.85], [-4.85, -5.85], [4.85, -5.85]])
    g.add(mesh(new THREE.BoxGeometry(0.34, 6.1, 0.34), matTrim, cx, 3.05, cz));
  // open double doors, swung outward
  for (const s of [-1, 1]){
    const hinge = new THREE.Group(); hinge.position.set(s * 2.3, 2.4, 6.0);
    hinge.add(mesh(new THREE.BoxGeometry(2.15, 4.8, 0.14), matDoor, -s * 1.07, 0, 0));
    hinge.rotation.y = s * 1.95; g.add(hinge);
  }
  // hayloft with tuft + hoist beam
  g.add(mesh(new THREE.PlaneGeometry(1.7, 1.9), new THREE.MeshStandardMaterial({ color: 0x140c06 }), 0, 7.1, 5.72));
  const tuft = mesh(new THREE.SphereGeometry(0.55, 8, 6), matHay, 0, 6.3, 5.8);
  tuft.scale.set(1.4, 0.5, 0.8); g.add(tuft);
  g.add(mesh(new THREE.BoxGeometry(0.16, 0.16, 1.6), matWoodDk, 0, 8.6, 6.2));
  // hay inside: stacked bales + loose pile
  for (const [bx, by, bz, ry] of [[-2.4, 0.7, -3.6, 0.2], [-0.6, 0.7, -4.1, -0.15], [1.5, 0.7, -3.5, 0.35], [-1.5, 1.6, -3.8, 0.05], [3.2, 0.7, -2.6, 0.7]]){
    const bale = mesh(new THREE.BoxGeometry(1.7, 1.0, 1.0), matHay, bx, by + 0.14, bz);
    bale.rotation.y = ry; g.add(bale);
  }
  const pile = mesh(new THREE.SphereGeometry(1.5, 10, 7), matHay, 2.9, 0.3, -4.2);
  pile.scale.set(1.3, 0.45, 1); g.add(pile);
  const lamp = new THREE.PointLight(0xffb060, 7, 14, 2); lamp.position.set(0, 4.4, -1); g.add(lamp);
  return shadowify(g);
}
function buildFarmhouse(){
  const g = new THREE.Group();
  g.add(mesh(new THREE.BoxGeometry(6.5, 5, 5.5), matCream, 0, 2.5, 0));
  gableRoof(g, 6.5, 5.5, 5, 2.2);
  g.add(mesh(triGeo(6.5, 2.2, 0.2), matCream, 0, 5, 2.66));
  g.add(mesh(new THREE.BoxGeometry(0.8, 2.2, 0.8), matBarn, 1.8, 6.3, -1.2));
  const winGeo = new THREE.PlaneGeometry(0.85, 1.1);
  for (const [wx, wy] of [[-1.7, 3.6], [1.7, 3.6], [-1.7, 1.6]]) g.add(mesh(winGeo, matWin, wx, wy, 2.78));
  for (const wz of [-1.2, 1.2]){
    const w1 = mesh(winGeo, matWin, -3.28, 2.6, wz); w1.rotation.y = -Math.PI / 2; g.add(w1);
  }
  g.add(mesh(new THREE.PlaneGeometry(1.05, 2.1), matWoodDk, 0.9, 1.6, 2.78));
  // porch: deck, columns, roof, steps
  g.add(mesh(new THREE.BoxGeometry(7.4, 0.35, 2.7), matWood, 0, 0.5, 4.1));
  for (const cx of [-3.4, 0, 3.4])
    g.add(mesh(new THREE.CylinderGeometry(0.1, 0.12, 2.5, 8), matTrim, cx, 1.95, 5.2));
  const proof = mesh(new THREE.BoxGeometry(7.7, 0.14, 3.1), matRoof, 0, 3.35, 4.15);
  proof.rotation.x = 0.1; g.add(proof);
  g.add(mesh(new THREE.BoxGeometry(2.2, 0.2, 0.7), matWood, 0.9, 0.32, 5.7));
  g.add(mesh(new THREE.BoxGeometry(2.2, 0.14, 0.5), matWood, 0.9, 0.12, 6.05));
  g.add(mesh(new THREE.SphereGeometry(0.09, 8, 6), new THREE.MeshStandardMaterial({ color: 0xffe0a0, emissive: 0xffc060, emissiveIntensity: 2 }), 0.25, 2.5, 2.9));
  return shadowify(g);
}
function buildScarecrow(){
  const g = new THREE.Group();
  g.add(mesh(new THREE.CylinderGeometry(0.07, 0.09, 2.7, 7), matWoodDk, 0, 1.35, 0));
  const cross = mesh(new THREE.CylinderGeometry(0.05, 0.05, 2.5, 7), matWoodDk, 0, 2.15, 0);
  cross.rotation.z = Math.PI / 2; g.add(cross);
  g.add(mesh(new THREE.BoxGeometry(1.0, 1.35, 0.55), matPlaid, 0, 1.85, 0));
  const skirt = mesh(new THREE.ConeGeometry(0.52, 0.7, 8), matHay, 0, 1.1, 0);
  g.add(skirt);
  for (const s of [-1, 1]){
    const arm = mesh(new THREE.BoxGeometry(0.95, 0.32, 0.36), matPlaid, s * 0.75, 2.14, 0);
    arm.rotation.z = s * 0.14; g.add(arm);
    const hand = mesh(new THREE.ConeGeometry(0.14, 0.42, 6), matHay, s * 1.3, 2.2, 0);
    hand.rotation.z = s * -Math.PI / 2; g.add(hand);
  }
  g.add(mesh(new THREE.SphereGeometry(0.35, 12, 10), matBurlap, 0, 2.95, 0));
  const hat = new THREE.Group(); hat.position.set(0, 3.22, 0); hat.rotation.z = 0.26;
  hat.add(mesh(new THREE.CylinderGeometry(0.66, 0.7, 0.06, 12), matHay, 0, 0, 0));
  hat.add(mesh(new THREE.ConeGeometry(0.4, 0.55, 10), matHay, 0, 0.28, 0));
  g.add(hat);
  g.rotation.z = 0.12;                                      // lopsided lean
  return shadowify(g);
}
function buildWheel(){
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.075, 8, 16), matWoodDk));
  for (let i = 0; i < 3; i++){
    const sp = new THREE.Mesh(new THREE.BoxGeometry(0.07, 1.12, 0.07), matWoodDk);
    sp.rotation.z = i * Math.PI / 3; g.add(sp);
  }
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.14, 8), matWoodDk);
  hub.rotation.x = Math.PI / 2; g.add(hub);
  return g;
}
function buildWagon(){
  const g = new THREE.Group();
  g.add(mesh(new THREE.BoxGeometry(2.3, 0.16, 3.5), matWood, 0, 1.0, 0));
  for (const sx of [-1.12, 1.12]) g.add(mesh(new THREE.BoxGeometry(0.1, 0.55, 3.5), matWood, sx, 1.3, 0));
  for (const sz of [-1.7, 1.7]) g.add(mesh(new THREE.BoxGeometry(2.3, 0.55, 0.1), matWood, 0, 1.3, sz));
  for (const sz of [-1.2, 1.2]){
    const axle = mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.6, 6), matWoodDk, 0, 0.6, sz);
    axle.rotation.z = Math.PI / 2; g.add(axle);
  }
  for (const [wx, wz] of [[-1.3, -1.2], [1.3, -1.2], [-1.3, 1.2], [1.3, 1.2]]){
    const wh = buildWheel(); wh.position.set(wx, 0.6, wz); wh.rotation.y = Math.PI / 2; g.add(wh);
  }
  for (const sx of [-0.4, 0.4]){
    const shaft = mesh(new THREE.CylinderGeometry(0.04, 0.04, 2.2, 6), matWoodDk, sx, 0.55, -2.6);
    shaft.rotation.x = Math.PI / 2 - 0.35; g.add(shaft);
  }
  return shadowify(g);
}
function buildCrow(){
  const g = new THREE.Group();
  const body = mesh(new THREE.SphereGeometry(0.16, 10, 8), matCrow, 0, 0.15, 0);
  body.scale.set(1, 0.85, 1.5); g.add(body);
  const head = new THREE.Group(); head.position.set(0, 0.27, 0.17);
  head.add(mesh(new THREE.SphereGeometry(0.095, 8, 8), matCrow, 0, 0, 0));
  const beak = mesh(new THREE.ConeGeometry(0.035, 0.15, 6), matBeak, 0, -0.01, 0.14);
  beak.rotation.x = Math.PI / 2; head.add(beak);
  g.add(head);
  const tail = mesh(new THREE.BoxGeometry(0.11, 0.03, 0.32), matCrow, 0, 0.17, -0.32);
  tail.rotation.x = 0.4; g.add(tail);
  g.userData = { head, tail, ph: rr(0, 9) };
  return shadowify(g);
}
function buildFence(x1, z, x2, posts){
  const g = new THREE.Group();
  for (let i = 0; i < posts; i++){
    const t = i / (posts - 1);
    g.add(mesh(new THREE.BoxGeometry(0.15, 1.15, 0.15), matWoodDk, x1 + (x2 - x1) * t, 0.55, z));
  }
  for (const ry of [0.55, 1.0])
    g.add(mesh(new THREE.BoxGeometry(Math.abs(x2 - x1) + 0.4, 0.09, 0.07), matWoodDk, (x1 + x2) / 2, ry, z));
  return shadowify(g);
}
function buildCrate(x, z, ry){
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry;
  g.add(mesh(new THREE.BoxGeometry(1.3, 0.08, 1.3), matWood, 0, 0.08, 0));
  for (const s of [-0.62, 0.62]){
    g.add(mesh(new THREE.BoxGeometry(1.3, 0.6, 0.07), matWood, 0, 0.36, s));
    g.add(mesh(new THREE.BoxGeometry(0.07, 0.6, 1.3), matWood, s, 0.36, 0));
  }
  return shadowify(g);
}
const oakNodes = [];
function growBranch(pivot, len, rad, depth){
  oakNodes.push({ node: pivot, len, rad });
  if (depth === 0) return;
  const kids = depth >= 3 ? 3 : (rand() < 0.5 ? 2 : 3);
  for (let i = 0; i < kids; i++){
    const c = new THREE.Object3D();
    c.position.y = len * rr(0.55, 0.95);
    c.rotation.set(rr(0.35, 0.85) * (rand() < 0.5 ? 1 : -1), rr(0, Math.PI * 2),
      rr(0.35, 0.85) * (rand() < 0.5 ? 1 : -1));
    pivot.add(c);
    growBranch(c, len * rr(0.55, 0.72), rad * 0.62, depth - 1);
  }
}
function buildOaks(defs){
  const tmp = new THREE.Object3D(); scene.add(tmp);
  for (const [x, z, s] of defs){
    const base = new THREE.Object3D();
    base.position.set(x, groundH(x, z), z);
    base.rotation.y = rr(0, Math.PI * 2); base.scale.setScalar(s);
    tmp.add(base);
    growBranch(base, 4.6, 0.5, 3);
  }
  tmp.updateMatrixWorld(true);
  const im = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.62, 1, 1, 7), matBark, oakNodes.length);
  const local = new THREE.Matrix4(), out = new THREE.Matrix4();
  oakNodes.forEach((b, i) => {
    local.makeScale(b.rad, b.len, b.rad).setPosition(0, b.len / 2, 0);
    out.multiplyMatrices(b.node.matrixWorld, local);
    im.setMatrixAt(i, out);
  });
  im.instanceMatrix.needsUpdate = true;
  im.castShadow = true; im.receiveShadow = true;
  scene.add(im); scene.remove(tmp);
}

// ================================================================
// 6. ASSEMBLY & LAYOUT
// ================================================================
const bumps = [];
for (let i = 0; i < 40; i++) bumps.push([rr(-100, 100), rr(-100, 100), rr(8, 22), rr(0.5, 2.4)]);
function groundH(x, z){
  let h = 0;
  for (const b of bumps){
    const dx = x - b[0], dz = z - b[1];
    h += b[3] * Math.exp(-(dx * dx + dz * dz) / (2 * b[2] * b[2]));
  }
  return h * THREE.MathUtils.smoothstep(Math.hypot(x, z), 36, 62);
}
const gGeo = new THREE.PlaneGeometry(240, 240, 80, 80);
gGeo.rotateX(-Math.PI / 2);
const gPos = gGeo.attributes.position;
for (let i = 0; i < gPos.count; i++) gPos.setY(i, groundH(gPos.getX(i), gPos.getZ(i)));
gGeo.computeVertexNormals();
const ground = new THREE.Mesh(gGeo, matGround);
ground.receiveShadow = true; scene.add(ground);

const patch = mesh(new THREE.PlaneGeometry(30, 22), matSoil, -3, 0.05, 14);
patch.rotation.x = -Math.PI / 2; patch.receiveShadow = true; scene.add(patch);
const path = mesh(new THREE.PlaneGeometry(27, 3.2), matWoodDk.clone(), 0, 0.06, -4);
path.material = new THREE.MeshStandardMaterial({ color: 0x9c7a4a, map: soilTex, roughness: 0.95 });
path.rotation.x = -Math.PI / 2; path.rotation.z = 0.06; path.receiveShadow = true; scene.add(path);

const barn = buildBarn();
barn.position.set(-13, 0.02, -9); barn.rotation.y = 0.35; scene.add(barn);
const farmhouse = buildFarmhouse();
farmhouse.position.set(13.5, 0.02, -10); farmhouse.rotation.y = -0.38; scene.add(farmhouse);
const scarecrow = buildScarecrow();
scarecrow.position.set(-4, 0.02, 13); scarecrow.rotation.y = 0.5; scene.add(scarecrow);
const wagon = buildWagon();
wagon.position.set(-2.5, 0.02, -1); wagon.rotation.y = 0.85; scene.add(wagon);
scene.add(buildFence(-16, 26.5, 14, 9));
scene.add(buildCrate(9.5, 0.5, 0.4)); scene.add(buildCrate(10.8, -0.6, -0.3));
for (const [hx, hz, hr] of [[-6.5, -13.5, 0.4], [-5.6, -12.2, 1.1], [-6.2, -12.6, 0.75]]){
  const bale = mesh(new THREE.BoxGeometry(1.7, 1.0, 1.0), matHay, hx, 0.52, hz);
  bale.rotation.y = hr; scene.add(shadowify(bale));
}
buildOaks([[24, 4, 1.15], [-26, -17, 1.0], [20, -24, 0.85]]);

// crows perched on the fence rail and scarecrow arm
const crows = [];
for (const [cx, cry] of [[-6, 0.4], [1.5, -0.3], [8.5, 0.1]]){
  const c = buildCrow(); c.position.set(cx, 1.06, 26.5); c.rotation.y = cry + Math.PI;
  scene.add(c); crows.push(c);
}
const armCrow = buildCrow();
armCrow.position.set(0.95, 2.38, 0); armCrow.rotation.y = -1.2;
scarecrow.add(armCrow); crows.push(armCrow);

// pumpkin patch: vine tubes, leaf clusters, instanced pumpkins
const pumps = [];
function addPumpkin(x, y, z, s, tint){ pumps.push([x, y, z, s, rr(0, Math.PI * 2), tint]); }
for (let r = 0; r < 6; r++){
  const rowZ = 5.5 + r * 3.3;
  const pts = [];
  for (let x = -16.5; x <= 10.5; x += 3.4) pts.push(new THREE.Vector3(x + rr(-0.5, 0.5), 0.1, rowZ + rr(-1.1, 1.1)));
  const vine = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 32, 0.055, 5), matVine);
  vine.castShadow = true; scene.add(vine);
  for (let x = -15.5; x < 10; x += rr(1.8, 3.4)){
    if (rand() < 0.8) addPumpkin(x + rr(-0.6, 0.6), 0, rowZ + rr(-1.3, 1.3), rr(0.3, 1.0), pick(PUMP_TINTS));
  }
}
addPumpkin(-1.2, 0, 11.5, 1.35, 0xf07818);                  // prize pumpkin
for (const [px, pz] of [[9.5, 0.5], [10.8, -0.6]]) addPumpkin(px, 0.45, pz, 0.42, pick(PUMP_TINTS));
for (let i = 0; i < 9; i++) addPumpkin(rr(-1.1, 1.1), 1.35, rr(-1.1, 1.1), rr(0.3, 0.5), pick(PUMP_TINTS));
const wagonLoad = pumps.length;                             // last 9 ride in the wagon bed
const pGeo = new THREE.SphereGeometry(1, 12, 9); pGeo.scale(1, 0.75, 1);
const pumpIM = new THREE.InstancedMesh(pGeo, matPump, pumps.length);
const stemIM = new THREE.InstancedMesh(new THREE.ConeGeometry(0.14, 0.5, 6), matStem, pumps.length);
{
  const d = new THREE.Object3D(), col = new THREE.Color();
  pumps.forEach((p, i) => {
    const inWagon = i >= wagonLoad - 9;
    const base = inWagon ? wagon : scene;
    const v = new THREE.Vector3(p[0], p[1] + p[3] * 0.68, p[2]);
    if (inWagon) wagon.localToWorld(v);
    d.position.copy(v); d.rotation.set(0, p[4], 0); d.scale.setScalar(p[3]); d.updateMatrix();
    pumpIM.setMatrixAt(i, d.matrix);
    col.setHex(p[5]); pumpIM.setColorAt(i, col);
    d.position.y += p[3] * 0.72; d.scale.setScalar(p[3] * 0.9);
    d.rotation.z = rr(-0.25, 0.25); d.updateMatrix();
    stemIM.setMatrixAt(i, d.matrix);
    void base;
  });
}
pumpIM.instanceColor.needsUpdate = true;
pumpIM.castShadow = true; pumpIM.receiveShadow = true; stemIM.castShadow = true;
scene.add(pumpIM); scene.add(stemIM);
const leafIM = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.6, 0.6), matLeaf, 150);
{
  const d = new THREE.Object3D();
  for (let i = 0; i < 150; i++){
    d.position.set(rr(-17, 11), 0.14, rr(4.5, 23.5));
    d.rotation.set(-Math.PI / 2 + rr(-0.5, 0.5), 0, rr(0, Math.PI * 2));
    d.scale.setScalar(rr(0.7, 1.4)); d.updateMatrix();
    leafIM.setMatrixAt(i, d.matrix);
  }
}
scene.add(leafIM);

// dry corn rows behind the yard (row pivots sway in the wind)
const cornRows = [];
{
  const cGeo = new THREE.PlaneGeometry(1.7, 2.7); cGeo.translate(0, 1.35, 0);
  for (let r = 0; r < 5; r++){
    const im = new THREE.InstancedMesh(cGeo, matCorn, 30);
    const d = new THREE.Object3D();
    for (let i = 0; i < 15; i++){
      const x = -19 + i * 2.3 + rr(-0.5, 0.5), zz = rr(-0.6, 0.6), ry = rr(0, Math.PI);
      d.position.set(x, 0, zz); d.rotation.set(0, ry, 0); d.scale.setScalar(rr(0.85, 1.2)); d.updateMatrix();
      im.setMatrixAt(i * 2, d.matrix);
      d.rotation.y = ry + Math.PI / 2; d.updateMatrix();
      im.setMatrixAt(i * 2 + 1, d.matrix);
    }
    im.position.set(3, 0.02, -19.5 - r * 2.7);
    im.userData.ph = rr(0, Math.PI * 2);
    scene.add(im); cornRows.push(im);
  }
}

// jack-o'-lantern glowing on the porch steps
const jack = new THREE.Mesh(pGeo, matJack);
jack.position.set(2.6, 0.98, 4.6); jack.scale.setScalar(0.55); jack.castShadow = true;
farmhouse.add(jack);
const jackStem = mesh(new THREE.ConeGeometry(0.09, 0.3, 6), matStem, 2.6, 1.42, 4.6);
jackStem.rotation.z = 0.2; farmhouse.add(jackStem);
const jackLight = new THREE.PointLight(0xff8830, 4, 9, 2);
jackLight.position.set(2.6, 1.25, 4.9); farmhouse.add(jackLight);

// sky dome, huge harvest moon, stars
const sky = new THREE.Mesh(new THREE.SphereGeometry(175, 32, 18),
  new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false }));
scene.add(sky);
const moonGlowMat = new THREE.SpriteMaterial({ map: glowTex, color: 0xff8c30, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
const moonGlow = new THREE.Sprite(moonGlowMat);
moonGlow.position.set(-58, 24, -92); moonGlow.scale.setScalar(58); scene.add(moonGlow);
const moonDisc = new THREE.Sprite(new THREE.SpriteMaterial({ map: moonTex, transparent: true, depthWrite: false, fog: false }));
moonDisc.position.copy(moonGlow.position); moonDisc.scale.setScalar(26); scene.add(moonDisc);
const starPos = [];
for (let i = 0; i < 200; i++){
  const a = rr(0, Math.PI * 2), e = rr(0.16, 1.45), r = 168;
  starPos.push(Math.cos(a) * Math.cos(e) * r, Math.sin(e) * r, Math.sin(a) * Math.cos(e) * r);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffe8c8, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0.7, depthWrite: false, fog: false })));

// ================================================================
// 7. LIGHTING RIG
// ================================================================
scene.add(new THREE.HemisphereLight(0x6a4a72, 0x4a3520, 0.5));
const moonKey = new THREE.DirectionalLight(0xffa050, 1.15);
moonKey.position.set(-48, 30, -60); moonKey.castShadow = true;
moonKey.shadow.mapSize.set(2048, 2048);
moonKey.shadow.camera.left = -55; moonKey.shadow.camera.right = 55;
moonKey.shadow.camera.top = 55; moonKey.shadow.camera.bottom = -55;
moonKey.shadow.camera.near = 5; moonKey.shadow.camera.far = 160;
moonKey.shadow.bias = -0.0006; moonKey.shadow.normalBias = 0.03;
scene.add(moonKey); scene.add(moonKey.target);
const fill = new THREE.DirectionalLight(0x7a5a9a, 0.32);
fill.position.set(40, 24, 45); scene.add(fill);
const porchGlow = new THREE.PointLight(0xffc070, 5, 12, 2);
porchGlow.position.set(0.25, 2.5, 3.2); farmhouse.add(porchGlow);

// ================================================================
// 8. ATMOSPHERE - drifting autumn leaves
// ================================================================
const LEAF_N = 130, FALL_H = 26;
const lfX = [], lfY = [], lfZ = [], lfSp = [], lfPh = [];
const lfArr = new Float32Array(LEAF_N * 3);
for (let i = 0; i < LEAF_N; i++){
  lfX.push(rr(-45, 45)); lfY.push(rr(0, FALL_H)); lfZ.push(rr(-42, 42));
  lfSp.push(rr(0.5, 1.3)); lfPh.push(rr(0, Math.PI * 2));
}
const lfGeo = new THREE.BufferGeometry();
lfGeo.setAttribute('position', new THREE.BufferAttribute(lfArr, 3).setUsage(THREE.DynamicDrawUsage));
const lfPts = new THREE.Points(lfGeo, new THREE.PointsMaterial({ map: leafTex, color: 0xc0762a, size: 0.55, transparent: true, alphaTest: 0.3, depthWrite: false }));
scene.add(lfPts);

// ================================================================
// 9. ANIMATION LOOP
// ================================================================
const clockT = new THREE.Clock();
function tick(){
  const t = clockT.getElapsedTime();
  controls.update();
  // rustling corn rows lean with gusts
  for (const row of cornRows) row.rotation.x = Math.sin(t * 1.15 + row.userData.ph) * 0.05;
  // crows fidget: head turns, tail flicks, tiny hop-bob
  for (const c of crows){
    const u = c.userData;
    u.head.rotation.y = Math.sin(t * 0.9 + u.ph) * 0.55;
    u.tail.rotation.x = 0.4 + Math.sin(t * 3.2 + u.ph) * 0.14;
    c.rotation.z = Math.sin(t * 2.3 + u.ph) * 0.035;
  }
  // jack-o'-lantern candle flicker
  const fl = 0.72 + 0.18 * Math.sin(t * 9.3) + 0.1 * Math.sin(t * 15.7 + 1.4);
  jackLight.intensity = 4.5 * fl;
  matJack.emissiveIntensity = 2.5 * fl;
  // scarecrow sways on its post
  scarecrow.rotation.z = 0.12 + Math.sin(t * 0.7) * 0.02;
  // drifting falling leaves
  const lp = lfGeo.attributes.position;
  for (let i = 0; i < LEAF_N; i++){
    let y = (lfY[i] - t * lfSp[i]) % FALL_H;
    if (y < 0) y += FALL_H;
    lp.array[i * 3] = lfX[i] + Math.sin(t * 0.65 + lfPh[i]) * 2.4;
    lp.array[i * 3 + 1] = y + 0.3;
    lp.array[i * 3 + 2] = lfZ[i] + Math.cos(t * 0.5 + lfPh[i]) * 1.6;
  }
  lp.needsUpdate = true;
  // harvest moon halo breathes
  moonGlowMat.opacity = 0.46 + 0.06 * Math.sin(t * 0.55);
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(tick);

// ================================================================
// 10. RESIZE
// ================================================================
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
