/* ===================== 3. TERRAIN FIELD + PLACEMENT ======================= */
function terrainHeight(x, z) {

const CLEARINGS = [];    // filled during layout so nothing grows through a prop

/* ==================== 4. PROCEDURAL CANVAS TEXTURES ====================== */
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

}

  }

  grd.addColorStop(0, inner); grd.addColorStop(0.45, mid); grd.addColorStop(1, 'rgba(255,255,255,0)');

/* ========================= 5. MATERIAL LIBRARY =========================== */
const TEX = {
  sky: toTexture(skyCanvas()), wood: toTexture(woodCanvas('#8b5f3a', '#4a3018', false), 2),
  plank: toTexture(woodCanvas('#96683f', '#4a3018', true), 1), stone: toTexture(stoneCanvas()),
  shingle: toTexture(shingleCanvas()), waterN: waterNormalTexture(), mist: toTexture(mistCanvas()),

/* ==================== 6. BUILDERS - ENVIRONMENT SHELL ==================== */
const buildSky = () => new THREE.Mesh(new THREE.SphereGeometry(300, 40, 26),
  new THREE.MeshBasicMaterial({ map: TEX.sky, side: THREE.BackSide, fog: false }));
function buildTerrain() {

  const cGrass = new THREE.Color(PAL.grass), cDry = new THREE.Color(PAL.grassDry);

/* ========================= 12. SCENE ASSEMBLY =========================== */
const dockLand = shorePoint(205, 16.2), cabinSite = shorePoint(176, 22.5), fireSite = shorePoint(157, 18.2);
const pileSite = shorePoint(167, 25.5), boatHome = shorePoint(216, 9.2); boatHome.y = 0.24;
[[cabinSite, 9], [dockLand, 6], [fireSite, 6], [pileSite, 3.5]].forEach(c => CLEARINGS.push({ x: c[0].x, z: c[0].z, r: c[1] }));
CLEARINGS.push({ x: camera.position.x, z: camera.position.z, r: 14 });
const lake = buildLake(); scene.add(buildSky(), buildTerrain(), lake);
scene.add(buildRidge(28, 46, 68, 19, 29, 12, 19, 0.64));     // near forested shoulders
scene.add(buildRidge(20, 108, 145, 24, 38, 22, 33, 0.52));   // distant snow-capped wall
scene.add(buildPines(), buildBoulders());
const meadow = buildMeadow(), cabin = buildCabin(), dock = buildDock(9.5), boat = buildRowboat();
const fire = buildCampfire(), pile = buildLogPile(); const ripples = buildRipples(), mist = buildMist();
cabin.position.copy(cabinSite);
cabin.rotation.y = Math.atan2(-cabinSite.x, -cabinSite.z);   // porch turned toward the water
dock.position.copy(dockLand); dock.rotation.y = Math.atan2(dockLand.x, dockLand.z); boat.position.copy(boatHome);
boat.rotation.y = Math.atan2(boatHome.x, boatHome.z) + 1.05; fire.position.copy(fireSite);
pile.position.copy(pileSite); pile.rotation.y = Math.atan2(-pileSite.x, -pileSite.z) + 0.5;
scene.add(meadow, cabin, dock, boat, fire, pile, ripples, mist); scene.updateMatrixWorld(true);
const smoke = makePuffs(16, TEX.soft, 0xdae0e4, THREE.NormalBlending);
smoke.position.copy(cabin.localToWorld(cabin.userData.chimney.clone()));
const embers = makePuffs(11, TEX.glow, 0xffb066, THREE.AdditiveBlending);
embers.position.set(fireSite.x, fireSite.y + 0.9, fireSite.z); scene.add(smoke, embers);
// Mooring line: dock cleat -> boat bow ring, sagging a little in the middle.
const ropeA = dock.localToWorld(dock.userData.cleat.clone());
const ropeB = boat.localToWorld(new THREE.Vector3(0, 0.16, 1.98));
const ropeMid = ropeA.clone().add(ropeB).multiplyScalar(0.5); ropeMid.y = Math.min(ropeA.y, ropeB.y) - 0.22;
scene.add(new THREE.Mesh(
  new THREE.TubeGeometry(new THREE.CatmullRomCurve3([ropeA, ropeMid, ropeB]), 18, 0.035, 5, false), MAT.rope));
/* ========================== 13. LIGHTING RIG ============================ */
const sunAz = 65 * Math.PI / 180, sunEl = 30 * Math.PI / 180; const key = new THREE.DirectionalLight(PAL.sun, 3.1);
key.position.set(Math.sin(sunAz) * Math.cos(sunEl) * 70, Math.sin(sunEl) * 70, Math.cos(sunAz) * Math.cos(sunEl) * 70 - 14);
key.target.position.set(0, 0, -14); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -34; key.shadow.camera.right = 34;
key.shadow.camera.top = 34; key.shadow.camera.bottom = -34; key.shadow.camera.near = 12; key.shadow.camera.far = 170;
key.shadow.bias = -0.0007; key.shadow.normalBias = 0.05; key.shadow.camera.updateProjectionMatrix();
const fill = new THREE.DirectionalLight(0xbcd6ee, 0.45); fill.position.set(-52, 26, 34);
const rim = new THREE.DirectionalLight(0xffe0bb, 0.35); rim.position.set(-20, 14, -70);
scene.add(key, key.target, fill, rim, new THREE.HemisphereLight(0xcfe4f5, 0x54603f, 0.5));
/* ========================= 14. ANIMATION LOOP =========================== */
const clock = new THREE.Clock();
const smokeOpts = { spread: 1.5, rise: 6.5, size0: 0.5, grow: 2.6, peak: 0.42 };
const emberOpts = { spread: 0.6, rise: 3.2, size0: 0.16, grow: 0.34, peak: 0.75 };
function animate() {
  requestAnimationFrame(animate); const dt = Math.min(clock.getDelta(), 0.05), t = clock.getElapsedTime();
  TEX.waterN.offset.set(t * 0.0045, t * 0.003);
  // Moored rowboat drifts on its line; the ripple rings follow it across the surface.
  boat.position.set(boatHome.x + Math.sin(t * 0.19) * 0.22, 0.24 + Math.sin(t * 0.55) * 0.05,
    boatHome.z + Math.cos(t * 0.16) * 0.18);

  ripples.position.set(boat.position.x, 0, boat.position.z);

  fire.userData.flame.scale.set(0.88 + 0.16 * flick, 0.8 + 0.35 * flick, 0.88 + 0.16 * flick);
  fire.userData.core.scale.setScalar(0.82 + 0.28 * flick); fire.userData.light.intensity = 14 + 11 * flick;
  dock.userData.lampLight.intensity = 5.2 + 1.1 * Math.sin(t * 2.1);
  cabin.userData.lamp.material.emissiveIntensity = 1.8 + 0.35 * Math.sin(t * 1.7);
  meadow.userData.update(t); mist.userData.update(t); ripples.userData.update(t);
  updatePuffs(smoke, dt, smokeOpts); updatePuffs(embers, dt, emberOpts); controls.update(); renderReflection();
  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
