<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arctic Ice Floe Night</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020712;
    }

    canvas {
      display: block;
    }

    .title {
      position: fixed;
      top: 22px;
      left: 26px;
      z-index: 2;
      color: rgba(224, 246, 255, 0.76);
      font: 500 12px/1.4 system-ui, sans-serif;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 1px 8px #000;
    }

    .subtitle {
      margin-top: 6px;
      color: rgba(166, 207, 221, 0.48);
      font-size: 9px;
      letter-spacing: 0.17em;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="title">
    Arctic Ice Floe Night
    <div class="subtitle">Drag to explore · Scroll to drift closer</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // -------------------------------------------------------------------------
    // Core setup
    // -------------------------------------------------------------------------

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020712);
    scene.fog = new THREE.FogExp2(0x071424, 0.0125);

    const camera = new THREE.PerspectiveCamera(
      48,
      window.innerWidth / window.innerHeight,
      0.1,
      350
    );
    camera.position.set(31, 20, 39);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.5, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.035;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.22;
    controls.minDistance = 22;
    controls.maxDistance = 82;
    controls.maxPolarAngle = Math.PI * 0.48;

    const clock = new THREE.Clock();

    // -------------------------------------------------------------------------
    // Deterministic helpers
    // -------------------------------------------------------------------------

    let seed = 0x51f15e;

    function random() {
      seed |= 0;
      seed = seed + 0x6d2b79f5 | 0;
      let t = seed;
      t = Math.imul(t ^ t >>> 15, 1 | t);
      t ^= t + Math.imul(t ^ t >>> 7, 61 | t);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }

    function range(min, max) {
      return min + (max - min) * random();
    }

    function choose(array) {
      return array[Math.floor(random() * array.length)];
    }

    function smoothstep(a, b, x) {
      x = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1);
      return x * x * (3 - 2 * x);
    }

    function ellipseGeometry(radius, detail = 20) {
      return new THREE.SphereGeometry(radius, detail, Math.max(10, detail / 2));
    }

    function setShadows(object, cast = true, receive = true) {
      object.traverse(child => {
        if (child.isMesh) {
          child.castShadow = cast;
          child.receiveShadow = receive;
        }
      });
      return object;
    }

    // -------------------------------------------------------------------------
    // Procedural textures
    // -------------------------------------------------------------------------

    function makeNoiseTexture(size, palette, points = 11000) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext('2d');

      const gradient = context.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, palette[0]);
      gradient.addColorStop(0.5, palette[1]);
      gradient.addColorStop(1, palette[2]);
      context.fillStyle = gradient;
      context.fillRect(0, 0, size, size);

      for (let i = 0; i < points; i++) {
        const x = random() * size;
        const y = random() * size;
        const alpha = range(0.015, 0.12);
        const light = random() > 0.5 ? 255 : 15;
        context.fillStyle = `rgba(${light},${light},${light},${alpha})`;
        context.fillRect(x, y, range(0.5, 2.3), range(0.5, 2.3));
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    function makeIceTexture(size = 512) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext('2d');

      context.fillStyle = '#dceff2';
      context.fillRect(0, 0, size, size);

      for (let i = 0; i < 180; i++) {
        const x = random() * size;
        const y = random() * size;
        const radius = range(4, 48);
        const glow = context.createRadialGradient(x, y, 0, x, y, radius);
        const blue = random() > 0.4;
        glow.addColorStop(
          0,
          blue
            ? `rgba(126,190,209,${range(0.03, 0.13)})`
            : `rgba(255,255,255,${range(0.05, 0.18)})`
        );
        glow.addColorStop(1, 'rgba(255,255,255,0)');
        context.fillStyle = glow;
        context.fillRect(x - radius, y - radius, radius * 2, radius * 2);
      }

      context.lineCap = 'round';

      for (let i = 0; i < 52; i++) {
        let x = random() * size;
        let y = random() * size;
        context.beginPath();
        context.moveTo(x, y);
        const segments = 2 + Math.floor(random() * 5);

        for (let j = 0; j < segments; j++) {
          x += range(-35, 35);
          y += range(-35, 35);
          context.lineTo(x, y);
        }

        context.strokeStyle = `rgba(62,126,150,${range(0.03, 0.11)})`;
        context.lineWidth = range(0.3, 1.5);
        context.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    const waterNoise = makeNoiseTexture(
      512,
      ['#07182a', '#0a2940', '#05111f'],
      15000
    );
    waterNoise.repeat.set(7, 7);

    const iceTexture = makeIceTexture();
    iceTexture.repeat.set(1.8, 1.8);

    // -------------------------------------------------------------------------
    // Sky dome and stars
    // -------------------------------------------------------------------------

    const skyUniforms = {
      topColor: { value: new THREE.Color(0x01030c) },
      horizonColor: { value: new THREE.Color(0x112c3d) },
      lowerColor: { value: new THREE.Color(0x06111d) }
    };

    const skyMaterial = new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: skyUniforms,
      vertexShader: `
        varying vec3 vWorldPosition;

        void main() {
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 horizonColor;
        uniform vec3 lowerColor;
        varying vec3 vWorldPosition;

        void main() {
          float h = normalize(vWorldPosition).y;
          float horizon = exp(-pow(abs(h) * 4.0, 1.7));
          vec3 base = mix(lowerColor, topColor, smoothstep(-0.15, 0.78, h));
          base = mix(base, horizonColor, horizon * 0.72);
          gl_FragColor = vec4(base, 1.0);
        }
      `
    });

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(190, 48, 24),
      skyMaterial
    );
    scene.add(sky);

    const starPositions = [];
    const starColors = [];
    const starColor = new THREE.Color();

    for (let i = 0; i < 1050; i++) {
      const theta = random() * Math.PI * 2;
      const y = range(16, 125);
      const horizontalRadius = Math.sqrt(
        Math.max(0, 150 * 150 - y * y)
      );
      const radius = horizontalRadius * range(0.92, 1);

      starPositions.push(
        Math.cos(theta) * radius,
        y,
        Math.sin(theta) * radius
      );

      starColor.setHSL(
        range(0.48, 0.67),
        range(0.05, 0.35),
        range(0.58, 1)
      );
      starColors.push(starColor.r, starColor.g, starColor.b);
    }

    const starGeometry = new THREE.BufferGeometry();
    starGeometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(starPositions, 3)
    );
    starGeometry.setAttribute(
      'color',
      new THREE.Float32BufferAttribute(starColors, 3)
    );

    const stars = new THREE.Points(
      starGeometry,
      new THREE.PointsMaterial({
        size: 0.19,
        sizeAttenuation: true,
        vertexColors: true,
        transparent: true,
        opacity: 0.92,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      })
    );
    scene.add(stars);

    // -------------------------------------------------------------------------
    // Moon and atmospheric glow
    // -------------------------------------------------------------------------

    const moonMaterial = new THREE.MeshBasicMaterial({
      color: 0xdff6ff,
      fog: false
    });

    const moon = new THREE.Mesh(
      new THREE.SphereGeometry(2.25, 32, 20),
      moonMaterial
    );
    moon.position.set(-47, 35, -69);
    scene.add(moon);

    const moonGlowMaterial = new THREE.SpriteMaterial({
      map: (() => {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 128;
        const context = canvas.getContext('2d');
        const gradient = context.createRadialGradient(64, 64, 4, 64, 64, 62);
        gradient.addColorStop(0, 'rgba(210,244,255,0.38)');
        gradient.addColorStop(0.18, 'rgba(168,222,255,0.18)');
        gradient.addColorStop(1, 'rgba(80,150,255,0)');
        context.fillStyle = gradient;
        context.fillRect(0, 0, 128, 128);
        return new THREE.CanvasTexture(canvas);
      })(),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      fog: false
    });

    const moonGlow = new THREE.Sprite(moonGlowMaterial);
    moonGlow.position.copy(moon.position);
    moonGlow.scale.set(16, 16, 1);
    scene.add(moonGlow);

    // -------------------------------------------------------------------------
    // Lighting
    // -------------------------------------------------------------------------

    const hemisphereLight = new THREE.HemisphereLight(
      0x719ab8,
      0x06101b,
      1.25
    );
    scene.add(hemisphereLight);

    const moonLight = new THREE.DirectionalLight(0xaddaff, 3.1);
    moonLight.position.set(-32, 46, -28);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.set(2048, 2048);
    moonLight.shadow.camera.left = -46;
    moonLight.shadow.camera.right = 46;
    moonLight.shadow.camera.top = 46;
    moonLight.shadow.camera.bottom = -46;
    moonLight.shadow.camera.near = 5;
    moonLight.shadow.camera.far = 120;
    moonLight.shadow.bias = -0.00035;
    moonLight.shadow.normalBias = 0.035;
    scene.add(moonLight);

    const blueFill = new THREE.PointLight(0x2b91c9, 18, 45, 2);
    blueFill.position.set(15, 5, -16);
    scene.add(blueFill);

    // -------------------------------------------------------------------------
    // Ocean
    // -------------------------------------------------------------------------

    const waterUniforms = {
      time: { value: 0 },
      deepColor: { value: new THREE.Color(0x03101d) },
      midColor: { value: new THREE.Color(0x0b3149) },
      moonColor: { value: new THREE.Color(0x8fd8f1) }
    };

    const waterMaterial = new THREE.ShaderMaterial({
      uniforms: waterUniforms,
      transparent: false,
      vertexShader: `
        uniform float time;
        varying vec3 vWorld;
        varying vec3 vNormal;
        varying float vWave;

        void main() {
          vec3 p = position;
          float waveA = sin(p.x * 0.20 + time * 0.42) * 0.13;
          float waveB = cos(p.y * 0.16 - time * 0.34) * 0.10;
          float waveC = sin((p.x + p.y) * 0.11 + time * 0.23) * 0.07;
          p.z += waveA + waveB + waveC;
          vWave = p.z;

          vec4 world = modelMatrix * vec4(p, 1.0);
          vWorld = world.xyz;
          vNormal = normalize(mat3(modelMatrix) * vec3(
            -0.026 * cos(p.x * 0.20 + time * 0.42),
            0.016 * sin(p.y * 0.16 - time * 0.34),
            1.0
          ));

          gl_Position = projectionMatrix * viewMatrix * world;
        }
      `,
      fragmentShader: `
        uniform float time;
        uniform vec3 deepColor;
        uniform vec3 midColor;
        uniform vec3 moonColor;
        varying vec3 vWorld;
        varying vec3 vNormal;
        varying float vWave;

        float hash(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }

        void main() {
          vec3 viewDirection = normalize(cameraPosition - vWorld);
          float fresnel = pow(1.0 - max(dot(viewDirection, vNormal), 0.0), 3.2);
          float ripple = sin(vWorld.x * 1.7 + time) *
                         sin(vWorld.z * 1.15 - time * 0.7);
          float glitter = smoothstep(
            0.965,
            1.0,
            hash(floor(vWorld.xz * 2.2) + floor(time * 2.0))
          );
          vec3 color = mix(deepColor, midColor, fresnel * 0.75 + vWave * 0.5);
          color += moonColor * max(ripple, 0.0) * 0.025;
          color += moonColor * glitter * fresnel * 0.45;
          gl_FragColor = vec4(color, 1.0);
        }
      `
    });

    const ocean = new THREE.Mesh(
      new THREE.PlaneGeometry(260, 260, 150, 150),
      waterMaterial
    );
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.y = -0.42;
    ocean.receiveShadow = true;
    scene.add(ocean);

    // -------------------------------------------------------------------------
    // Floes
    // -------------------------------------------------------------------------

    const floeTopMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xc7e4e8,
      map: iceTexture,
      roughness: 0.78,
      metalness: 0,
      clearcoat: 0.12,
      clearcoatRoughness: 0.62
    });

    const floeSideMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x4d9ab5,
      roughness: 0.5,
      transmission: 0.08,
      thickness: 1.4,
      transparent: true,
      opacity: 0.95
    });

    const floes = [];

    function createFloe(
      x,
      z,
      radiusX,
      radiusZ,
      points,
      thickness,
      rotation = 0
    ) {
      const group = new THREE.Group();
      const outline = [];

      for (let i = 0; i < points; i++) {
        const angle = i / points * Math.PI * 2;
        const irregularity =
          1 +
          Math.sin(angle * 3 + range(-0.4, 0.4)) * 0.08 +
          range(-0.12, 0.12);

        outline.push(
          new THREE.Vector2(
            Math.cos(angle) * radiusX * irregularity,
            Math.sin(angle) * radiusZ * irregularity
          )
        );
      }

      const shape = new THREE.Shape(outline);
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: thickness,
        bevelEnabled: true,
        bevelSegments: 2,
        bevelSize: Math.min(0.18, thickness * 0.28),
        bevelThickness: 0.11,
        curveSegments: 1,
        steps: 1
      });
      geometry.rotateX(Math.PI / 2);
      geometry.translate(0, thickness * 0.48, 0);
      geometry.computeVertexNormals();

      const mesh = new THREE.Mesh(
        geometry,
        [floeTopMaterial, floeSideMaterial]
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);

      const underside = new THREE.Mesh(
        geometry.clone(),
        new THREE.MeshPhysicalMaterial({
          color: 0x287792,
          roughness: 0.42,
          transparent: true,
          opacity: 0.25,
          side: THREE.BackSide
        })
      );
      underside.scale.set(0.985, 1.04, 0.985);
      underside.position.y = -0.12;
      group.add(underside);

      group.position.set(x, -0.08, z);
      group.rotation.y = rotation;
      group.userData.baseY = group.position.y;
      group.userData.phase = range(0, Math.PI * 2);
      group.userData.bob = range(0.025, 0.07);
      group.userData.roll = range(0.0015, 0.004);
      scene.add(group);
      floes.push(group);
      return group;
    }

    const mainFloe = createFloe(0, 0, 12.7, 9.3, 20, 0.72, -0.08);
    const iglooFloe = createFloe(-23, -17, 7.1, 5.3, 15, 0.58, 0.17);
    createFloe(20, -13, 8.5, 5.1, 16, 0.52, -0.36);
    createFloe(23, 10, 7.2, 4.5, 14, 0.48, 0.25);
    createFloe(-22, 9, 7.5, 4.1, 14, 0.46, -0.2);
    createFloe(7, 18, 5.3, 3.2, 12, 0.4, 0.31);
    createFloe(-9, -22, 5.6, 3.1, 12, 0.38, -0.18);
    createFloe(34, -3, 5.4, 3.1, 11, 0.36, 0.51);
    createFloe(-37, -5, 5.6, 3.2, 12, 0.42, -0.48);

    // -------------------------------------------------------------------------
    // Icebergs
    // -------------------------------------------------------------------------

    function createIceberg(x, z, radius, height, rings = 5) {
      const vertices = [];
      const indices = [];
      const segments = 9;
      const ringRadii = [];

      for (let ring = 0; ring <= rings; ring++) {
        const y = ring / rings * height;
        const taper = Math.pow(1 - ring / (rings + 0.35), 0.72);
        const ringRadius =
          radius *
          taper *
          range(0.78, 1.08);
        ringRadii.push(ringRadius);

        for (let i = 0; i < segments; i++) {
          const angle = i / segments * Math.PI * 2;
          const wobble =
            1 +
            0.12 * Math.sin(angle * 3 + ring * 0.8) +
            range(-0.1, 0.1);

          vertices.push(
            Math.cos(angle) * ringRadius * wobble,
            y,
            Math.sin(angle) * ringRadius * wobble
          );
        }
      }

      vertices.push(0, height * 1.08, 0);
      const tipIndex = vertices.length / 3 - 1;

      for (let ring = 0; ring < rings; ring++) {
        for (let i = 0; i < segments; i++) {
          const next = (i + 1) % segments;
          const a = ring * segments + i;
          const b = ring * segments + next;
          const c = (ring + 1) * segments + next;
          const d = (ring + 1) * segments + i;
          indices.push(a, b, d, b, c, d);
        }
      }

      for (let i = 0; i < segments; i++) {
        indices.push(
          rings * segments + i,
          rings * segments + (i + 1) % segments,
          tipIndex
        );
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        'position',
        new THREE.Float32BufferAttribute(vertices, 3)
      );
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      const material = new THREE.MeshPhysicalMaterial({
        color: 0xa9d7e3,
        roughness: 0.45,
        clearcoat: 0.25,
        clearcoatRoughness: 0.5,
        flatShading: true
      });

      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(x, -0.2, z);
      mesh.rotation.y = range(0, Math.PI);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);

      const submerged = new THREE.Mesh(
        new THREE.ConeGeometry(radius * 0.84, height * 0.85, 9, 1),
        new THREE.MeshPhysicalMaterial({
          color: 0x17647f,
          roughness: 0.32,
          transparent: true,
          opacity: 0.52
        })
      );
      submerged.position.set(x, -height * 0.45, z);
      submerged.rotation.x = Math.PI;
      scene.add(submerged);

      return mesh;
    }

    createIceberg(-39, -42, 7.6, 18);
    createIceberg(36, -49, 9.2, 24, 6);
    createIceberg(56, -21, 5.2, 13);
    createIceberg(-58, -13, 5.8, 15);
    createIceberg(8, -67, 5.5, 14);

    // -------------------------------------------------------------------------
    // Polar bears
    // -------------------------------------------------------------------------

    const bearMaterial = new THREE.MeshStandardMaterial({
      color: 0xe9eee8,
      roughness: 0.92
    });

    const bearShadowMaterial = new THREE.MeshStandardMaterial({
      color: 0xcbd7d5,
      roughness: 0.95
    });

    const darkMaterial = new THREE.MeshStandardMaterial({
      color: 0x101820,
      roughness: 0.8
    });

    function addEllipsoid(
      parent,
      scale,
      position,
      material = bearMaterial,
      segments = 20
    ) {
      const mesh = new THREE.Mesh(
        ellipseGeometry(1, segments),
        material
      );
      mesh.scale.set(scale.x, scale.y, scale.z);
      mesh.position.copy(position);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function createPolarBear(scale = 1, walking = false) {
      const bear = new THREE.Group();

      addEllipsoid(
        bear,
        new THREE.Vector3(2.05, 1.08, 0.92).multiplyScalar(scale),
        new THREE.Vector3(0, 1.35, 0).multiplyScalar(scale)
      );

      addEllipsoid(
        bear,
        new THREE.Vector3(0.78, 0.82, 0.7).multiplyScalar(scale),
        new THREE.Vector3(1.65, 1.75, 0).multiplyScalar(scale)
      );

      addEllipsoid(
        bear,
        new THREE.Vector3(0.78, 0.45, 0.5).multiplyScalar(scale),
        new THREE.Vector3(2.18, 1.62, 0).multiplyScalar(scale)
      );

      const earLeft = addEllipsoid(
        bear,
        new THREE.Vector3(0.23, 0.27, 0.13).multiplyScalar(scale),
        new THREE.Vector3(1.62, 2.43, 0.48).multiplyScalar(scale)
      );
      earLeft.rotation.z = -0.1;

      const earRight = addEllipsoid(
        bear,
        new THREE.Vector3(0.23, 0.27, 0.13).multiplyScalar(scale),
        new THREE.Vector3(1.62, 2.43, -0.48).multiplyScalar(scale)
      );
      earRight.rotation.z = -0.1;

      addEllipsoid(
        bear,
        new THREE.Vector3(0.19, 0.17, 0.21).multiplyScalar(scale),
        new THREE.Vector3(2.83, 1.68, 0).multiplyScalar(scale),
        darkMaterial,
        14
      );

      for (const z of [-0.58, 0.58]) {
        for (const x of [-1.15, 1.08]) {
          const stride =
            walking && x > 0
              ? (z > 0 ? 0.22 : -0.18)
              : 0;

          const leg = addEllipsoid(
            bear,
            new THREE.Vector3(0.35, 0.85, 0.32).multiplyScalar(scale),
            new THREE.Vector3(x + stride, 0.61, z).multiplyScalar(scale),
            bearShadowMaterial
          );
          leg.rotation.z = walking ? stride * 0.18 : 0;

          addEllipsoid(
            bear,
            new THREE.Vector3(0.55, 0.19, 0.35).multiplyScalar(scale),
            new THREE.Vector3(x + 0.18 + stride, 0.08, z).multiplyScalar(scale),
            bearMaterial
          );
        }
      }

      const eyeGeometry = new THREE.SphereGeometry(0.075 * scale, 10, 8);

      for (const z of [-0.5, 0.5]) {
        const eye = new THREE.Mesh(eyeGeometry, darkMaterial);
        eye.position.set(
          2.17 * scale,
          1.98 * scale,
          z * scale
        );
        bear.add(eye);
      }

      return bear;
    }

    const adultBear = createPolarBear(1.05, true);
    adultBear.position.set(-1.5, 0.72, 0.8);
    adultBear.rotation.y = -0.38;
    mainFloe.add(adultBear);

    const cub = createPolarBear(0.55, false);
    cub.position.set(3.2, 0.72, 1.4);
    cub.rotation.y = 2.65;
    mainFloe.add(cub);

    // -------------------------------------------------------------------------
    // Breathing hole and seals
    // -------------------------------------------------------------------------

    const holeMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x04121c,
      roughness: 0.18,
      metalness: 0.15,
      clearcoat: 0.65,
      clearcoatRoughness: 0.16
    });

    const hole = new THREE.Mesh(
      new THREE.CircleGeometry(1.85, 38),
      holeMaterial
    );
    hole.rotation.x = -Math.PI / 2;
    hole.scale.set(1.35, 1, 0.82);
    hole.position.set(5.35, 0.8, -3.55);
    hole.receiveShadow = true;
    mainFloe.add(hole);

    const holeRim = new THREE.Mesh(
      new THREE.TorusGeometry(1.86, 0.14, 9, 40),
      new THREE.MeshStandardMaterial({
        color: 0xaed7df,
        roughness: 0.76
      })
    );
    holeRim.rotation.x = Math.PI / 2;
    holeRim.scale.set(1.35, 0.82, 1);
    holeRim.position.copy(hole.position);
    holeRim.position.y += 0.035;
    holeRim.castShadow = true;
    mainFloe.add(holeRim);

    const sealMaterial = new THREE.MeshStandardMaterial({
      color: 0x687a82,
      roughness: 0.87
    });

    function createSeal(scale = 1) {
      const seal = new THREE.Group();

      addEllipsoid(
        seal,
        new THREE.Vector3(1.28, 0.52, 0.55).multiplyScalar(scale),
        new THREE.Vector3(0, 0.48, 0),
        sealMaterial
      );

      addEllipsoid(
        seal,
        new THREE.Vector3(0.52, 0.48, 0.44).multiplyScalar(scale),
        new THREE.Vector3(0.98, 0.72, 0),
        sealMaterial
      );

      const nose = addEllipsoid(
        seal,
        new THREE.Vector3(0.14, 0.11, 0.14).multiplyScalar(scale),
        new THREE.Vector3(1.43, 0.74, 0).multiplyScalar(scale),
        darkMaterial,
        12
      );
      nose.castShadow = true;

      for (const z of [-0.31, 0.31]) {
        const eye = new THREE.Mesh(
          new THREE.SphereGeometry(0.055 * scale, 10, 8),
          darkMaterial
        );
        eye.position.set(
          1.18 * scale,
          0.91 * scale,
          z * scale
        );
        seal.add(eye);
      }

      for (const z of [-0.45, 0.45]) {
        const flipper = addEllipsoid(
          seal,
          new THREE.Vector3(0.58, 0.12, 0.23).multiplyScalar(scale),
          new THREE.Vector3(-0.1, 0.25, z).multiplyScalar(scale),
          sealMaterial
        );
        flipper.rotation.y = z > 0 ? -0.5 : 0.5;
      }

      return seal;
    }

    const sealOne = createSeal(0.82);
    sealOne.position.set(7.3, 0.82, -2.2);
    sealOne.rotation.y = 2.52;
    sealOne.userData.baseY = sealOne.position.y;
    mainFloe.add(sealOne);

    const sealTwo = createSeal(0.62);
    sealTwo.position.set(4.15, 0.78, -5.25);
    sealTwo.rotation.y = 0.7;
    sealTwo.userData.baseY = sealTwo.position.y;
    mainFloe.add(sealTwo);

    // -------------------------------------------------------------------------
    // Igloo
    // -------------------------------------------------------------------------

    const igloo = new THREE.Group();
    igloo.position.set(0, 0.62, 0);
    igloo.rotation.y = 0.55;
    iglooFloe.add(igloo);

    const iglooMaterial = new THREE.MeshStandardMaterial({
      color: 0xc8e0e4,
      roughness: 0.86
    });

    const dome = new THREE.Mesh(
      new THREE.SphereGeometry(
        3.05,
        36,
        18,
        0,
        Math.PI * 2,
        0,
        Math.PI / 2
      ),
      iglooMaterial
    );
    dome.scale.y = 0.83;
    dome.castShadow = true;
    dome.receiveShadow = true;
    igloo.add(dome);

    const doorway = new THREE.Group();
    doorway.position.set(2.74, 0.02, 0);
    doorway.rotation.z = Math.PI / 2;
    igloo.add(doorway);

    const tunnel = new THREE.Mesh(
      new THREE.CylinderGeometry(
        1.02,
        1.16,
        1.9,
        20,
        1,
        false,
        0,
        Math.PI
      ),
      iglooMaterial
    );
    tunnel.rotation.z = Math.PI / 2;
    tunnel.rotation.y = Math.PI / 2;
    tunnel.position.set(0.55, 0.7, 0);
    tunnel.castShadow = true;
    tunnel.receiveShadow = true;
    igloo.add(tunnel);

    const entranceDark = new THREE.Mesh(
      new THREE.CircleGeometry(0.78, 24, 0, Math.PI),
      new THREE.MeshBasicMaterial({
        color: 0x160f0a,
        side: THREE.DoubleSide
      })
    );
    entranceDark.rotation.y = Math.PI / 2;
    entranceDark.rotation.z = -Math.PI / 2;
    entranceDark.position.set(3.72, 0.77, 0);
    igloo.add(entranceDark);

    const entranceGlow = new THREE.PointLight(0xffa84f, 22, 13, 2);
    entranceGlow.position.set(3.55, 0.92, 0);
    entranceGlow.castShadow = true;
    entranceGlow.shadow.mapSize.set(512, 512);
    igloo.add(entranceGlow);

    const warmPatch = new THREE.Mesh(
      new THREE.CircleGeometry(2.1, 30),
      new THREE.MeshBasicMaterial({
        color: 0xff8a35,
        transparent: true,
        opacity: 0.12,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      })
    );
    warmPatch.rotation.x = -Math.PI / 2;
    warmPatch.position.set(4.1, 0.03, 0);
    igloo.add(warmPatch);

    for (let row = 1; row < 5; row++) {
      const latitude = row / 5 * Math.PI / 2;
      const ringRadius = Math.cos(latitude) * 3.06;
      const y = Math.sin(latitude) * 2.54;

      if (ringRadius < 0.35) {
        continue;
      }

      const segments = Math.max(6, Math.floor(ringRadius * 6));

      for (let i = 0; i < segments; i++) {
        const angle =
          i / segments * Math.PI * 2 +
          (row % 2) * Math.PI / segments;

        const block = new THREE.Mesh(
          new THREE.BoxGeometry(
            ringRadius * Math.PI * 2 / segments * 0.87,
            0.055,
            0.045
          ),
          new THREE.MeshBasicMaterial({
            color: 0x779eaa,
            transparent: true,
            opacity: 0.34
          })
        );
        block.position.set(
          Math.cos(angle) * ringRadius * 1.002,
          y,
          Math.sin(angle) * ringRadius * 1.002
        );
        block.lookAt(0, y, 0);
        block.rotation.z = -latitude;
        igloo.add(block);
      }
    }

    // -------------------------------------------------------------------------
    // Ice fragments and snow ridges
    // -------------------------------------------------------------------------

    const shardMaterial = new THREE.MeshStandardMaterial({
      color: 0xb8dce4,
      roughness: 0.74,
      flatShading: true
    });

    for (let i = 0; i < 58; i++) {
      const angle = random() * Math.PI * 2;
      const distance = range(13.5, 54);
      const shard = new THREE.Mesh(
        new THREE.TetrahedronGeometry(range(0.12, 0.52), 0),
        shardMaterial
      );
      shard.scale.set(
        range(0.7, 2.5),
        range(0.18, 0.65),
        range(0.7, 2.2)
      );
      shard.position.set(
        Math.cos(angle) * distance,
        -0.16,
        Math.sin(angle) * distance
      );
      shard.rotation.set(
        random() * Math.PI,
        random() * Math.PI,
        random() * Math.PI
      );
      shard.castShadow = true;
      shard.receiveShadow = true;
      scene.add(shard);
    }

    // -------------------------------------------------------------------------
    // Aurora curtains
    // -------------------------------------------------------------------------

    const auroras = [];

    function createAurora(
      colorA,
      colorB,
      x,
      y,
      z,
      width,
      height,
      phase,
      rotationY
    ) {
      const geometry = new THREE.PlaneGeometry(width, height, 90, 22);
      geometry.translate(0, -height * 0.1, 0);

      const uniforms = {
        time: { value: 0 },
        colorA: { value: new THREE.Color(colorA) },
        colorB: { value: new THREE.Color(colorB) },
        phase: { value: phase },
        opacity: { value: range(0.34, 0.55) }
      };

      const material = new THREE.ShaderMaterial({
        uniforms,
        side: THREE.DoubleSide,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        vertexShader: `
          uniform float time;
          uniform float phase;
          varying vec2 vUv;
          varying float vFold;

          void main() {
            vUv = uv;
            vec3 p = position;
            float taper = smoothstep(0.0, 0.22, uv.y) *
                          smoothstep(1.0, 0.72, uv.y);
            float broad = sin(uv.x * 8.0 + time * 0.18 + phase);
            float fine = sin(uv.x * 20.0 - time * 0.31 + phase * 1.7);
            float rise = sin(uv.x * 5.0 + time * 0.12) * 2.2;
            p.z += (broad * 2.8 + fine * 0.65) * taper;
            p.y += rise * (0.25 + uv.y * 0.75);
            vFold = 0.52 + 0.48 * broad;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec3 colorA;
          uniform vec3 colorB;
          uniform float opacity;
          uniform float time;
          uniform float phase;
          varying vec2 vUv;
          varying float vFold;

          void main() {
            float lower = smoothstep(0.0, 0.17, vUv.y);
            float upper = 1.0 - smoothstep(0.62, 1.0, vUv.y);
            float edge = smoothstep(0.0, 0.08, vUv.x) *
                         smoothstep(1.0, 0.92, vUv.x);
            float ribs = 0.45 + 0.55 *
              pow(abs(sin(vUv.x * 35.0 + phase + time * 0.08)), 1.5);
            float shimmer = 0.86 + 0.14 *
              sin(time * 0.75 + vUv.y * 8.0 + phase);
            vec3 color = mix(colorA, colorB, vUv.y * 0.8 + vFold * 0.2);
            float alpha = lower * upper * edge * ribs * shimmer * opacity;
            gl_FragColor = vec4(color, alpha);
          }
        `
      });

      const curtain = new THREE.Mesh(geometry, material);
      curtain.position.set(x, y, z);
      curtain.rotation.y = rotationY;
      curtain.rotation.x = -0.06;
      scene.add(curtain);

      auroras.push({
        mesh: curtain,
        material,
        baseY: y,
        phase
      });

      return curtain;
    }

    createAurora(
      0x20e88a,
      0x7affcf,
      -12,
      37,
      -63,
      76,
      28,
      0.3,
      -0.08
    );

    createAurora(
      0x31c89e,
      0xb35cff,
      18,
      42,
      -72,
      66,
      24,
      2.1,
      0.12
    );

    createAurora(
      0x63ffd1,
      0x7c62ff,
      -34,
      48,
      -84,
      55,
      21,
      4.4,
      -0.2
    );

    // -------------------------------------------------------------------------
    // Star reflections between ice sheets
    // -------------------------------------------------------------------------

    const reflectionPositions = [];
    const reflectionPhases = [];

    for (let i = 0; i < 260; i++) {
      const angle = random() * Math.PI * 2;
      const distance = range(11, 56);
      const x = Math.cos(angle) * distance;
      const z = Math.sin(angle) * distance;

      reflectionPositions.push(x, -0.22, z);
      reflectionPhases.push(range(0, Math.PI * 2));
    }

    const reflectionGeometry = new THREE.BufferGeometry();
    reflectionGeometry.setAttribute(
      'position',
      new THREE.Float32BufferAttribute(reflectionPositions, 3)
    );
    reflectionGeometry.setAttribute(
      'phase',
      new THREE.Float32BufferAttribute(reflectionPhases, 1)
    );

    const reflectionMaterial = new THREE.ShaderMaterial({
      uniforms: {
        time: { value: 0 }
      },
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        uniform float time;
        attribute float phase;
        varying float vGlow;

        void main() {
          vec3 p = position;
          p.y += sin(time * 0.7 + phase) * 0.035;
          vGlow = 0.45 + 0.55 * sin(time * 1.3 + phase);
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_PointSize = (1.8 + vGlow * 2.2) * (45.0 / -mv.z);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        varying float vGlow;

        void main() {
          vec2 p = gl_PointCoord - 0.5;
          float d = length(p);
          float glow = smoothstep(0.5, 0.0, d);
          gl_FragColor = vec4(
            0.55,
            0.87,
            1.0,
            glow * (0.18 + vGlow * 0.5)
          );
        }
      `
    });

    const reflections = new THREE.Points(
      reflectionGeometry,
      reflectionMaterial
    );
    scene.add(reflections);

    // -------------------------------------------------------------------------
    // Mist ribbons
    // -------------------------------------------------------------------------

    const mistMaterial = new THREE.MeshBasicMaterial({
      color: 0x5f94a5,
      transparent: true,
      opacity: 0.035,
      depthWrite: false,
      side: THREE.DoubleSide
    });

    const mistBands = [];

    for (let i = 0; i < 5; i++) {
      const band = new THREE.Mesh(
        new THREE.PlaneGeometry(range(32, 62), range(1.3, 2.8)),
        mistMaterial.clone()
      );
      band.position.set(
        range(-28, 28),
        range(0.8, 2.3),
        range(-48, 22)
      );
      band.rotation.y = range(-0.25, 0.25);
      band.userData.phase = range(0, Math.PI * 2);
      band.userData.baseX = band.position.x;
      scene.add(band);
      mistBands.push(band);
    }

    // -------------------------------------------------------------------------
    // Animation
    // -------------------------------------------------------------------------

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      waterUniforms.time.value = elapsed;
      reflectionMaterial.uniforms.time.value = elapsed;

      stars.rotation.y = elapsed * 0.0025;

      for (let i = 0; i < floes.length; i++) {
        const floe = floes[i];
        const phase = floe.userData.phase;
        floe.position.y =
          floe.userData.baseY +
          Math.sin(elapsed * 0.38 + phase) * floe.userData.bob;
        floe.rotation.z =
          Math.sin(elapsed * 0.22 + phase) * floe.userData.roll;
        floe.rotation.x =
          Math.cos(elapsed * 0.17 + phase) * floe.userData.roll;
      }

      for (const aurora of auroras) {
        aurora.material.uniforms.time.value = elapsed;
        aurora.mesh.position.y =
          aurora.baseY +
          Math.sin(elapsed * 0.1 + aurora.phase) * 0.6;
      }

      sealOne.position.y =
        sealOne.userData.baseY +
        Math.sin(elapsed * 0.9) * 0.035;
      sealOne.rotation.z =
        Math.sin(elapsed * 0.65) * 0.025;

      sealTwo.position.y =
        sealTwo.userData.baseY +
        Math.sin(elapsed * 1.05 + 2.1) * 0.028;
      sealTwo.rotation.z =
        Math.sin(elapsed * 0.72 + 1.3) * 0.022;

      adultBear.rotation.z =
        Math.sin(elapsed * 0.42) * 0.006;
      cub.rotation.z =
        Math.sin(elapsed * 0.58 + 1.2) * 0.01;

      entranceGlow.intensity =
        21 +
        Math.sin(elapsed * 2.15) * 1.4 +
        Math.sin(elapsed * 4.8) * 0.5;
      warmPatch.material.opacity =
        0.11 + Math.sin(elapsed * 1.8) * 0.012;

      for (const mist of mistBands) {
        mist.position.x =
          mist.userData.baseX +
          Math.sin(elapsed * 0.055 + mist.userData.phase) * 4;
        mist.material.opacity =
          0.025 +
          0.015 * (
            0.5 +
            0.5 * Math.sin(elapsed * 0.18 + mist.userData.phase)
          );
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // -------------------------------------------------------------------------
    // Resize
    // -------------------------------------------------------------------------

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
