<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porcelain Arabesque</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d9d4cb}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9d4cb);
scene.fog = new THREE.Fog(0xd9d4cb, 7, 13);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.5, 3.4, 7.5);
camera.lookAt(0, 1.95, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 4.2;
controls.maxDistance = 10;
controls.target.set(0, 1.9, 0);

const porcelain = new THREE.MeshPhysicalMaterial({
  color: 0xf4f0e5,
  roughness: 0.22,
  metalness: 0.02,
  clearcoat: 0.82,
  clearcoatRoughness: 0.12,
  sheen: 0.25,
  sheenColor: 0xffffff
});
const porcelainShadow = new THREE.MeshPhysicalMaterial({
  color: 0xe8e2d4,
  roughness: 0.3,
  clearcoat: 0.62,
  clearcoatRoughness: 0.16
});
const cobalt = new THREE.MeshPhysicalMaterial({
  color: 0x123c83,
  roughness: 0.24,
  clearcoat: 0.5,
  clearcoatRoughness: 0.15
});
const gold = new THREE.MeshPhysicalMaterial({
  color: 0xc99b3c,
  metalness: 0.82,
  roughness: 0.2,
  clearcoat: 0.35
});
const darkHair = new THREE.MeshPhysicalMaterial({
  color: 0x39405b,
  roughness: 0.25,
  clearcoat: 0.7
});
const floorMat = new THREE.MeshStandardMaterial({color:0xbcb6ad, roughness:0.78});

function mesh(geometry, material, cast=true){
  const m = new THREE.Mesh(geometry, material);
  m.castShadow = cast;
  m.receiveShadow = true;
  return m;
}

function sphere(name, p, s, mat=porcelain){
  const m = mesh(new THREE.SphereGeometry(1, 32, 20), mat);
  m.name = name;
  m.position.set(...p);
  m.scale.set(...s);
  scene.add(m);
  return m;
}

function limb(name, a, b, r1, r2, mat=porcelain){
  const start = new THREE.Vector3(...a), end = new THREE.Vector3(...b);
  const dir = end.clone().sub(start);
  const g = new THREE.CylinderGeometry(r2, r1, dir.length(), 24, 1);
  const m = mesh(g, mat);
  m.name = name;
  m.position.copy(start).add(end).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  scene.add(m);
  return m;
}

function tube(points, radius, mat, closed=false){
  const curve = new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)), closed);
  const g = new THREE.TubeGeometry(curve, Math.max(16, points.length*8), radius, 8, closed);
  const m = mesh(g, mat, false);
  scene.add(m);
  return m;
}

function torus(y, major, minor, mat=porcelain, rotX=0){
  const m = mesh(new THREE.TorusGeometry(major, minor, 12, 64), mat);
  m.position.y = y;
  m.rotation.x = rotX;
  scene.add(m);
  return m;
}

const floor = mesh(new THREE.CircleGeometry(12, 96), floorMat, false);
floor.rotation.x = -Math.PI/2;
floor.position.y = -0.015;
floor.receiveShadow = true;
scene.add(floor);

const pedestal = new THREE.Group();
scene.add(pedestal);

const base = mesh(new THREE.CylinderGeometry(.83,.9,.18,64), porcelainShadow);
base.position.y=.09;
pedestal.add(base);

const lowerRing = mesh(new THREE.TorusGeometry(.78,.045,12,64), gold);
lowerRing.rotation.x=Math.PI/2;
lowerRing.position.y=.19;
pedestal.add(lowerRing);

const plinth = mesh(new THREE.CylinderGeometry(.72,.76,.46,64), porcelain);
plinth.position.y=.37;
pedestal.add(plinth);

for(let i=0;i<20;i++){
  const a=i/20*Math.PI*2;
  const flute=mesh(new THREE.CylinderGeometry(.045,.045,.43,12), porcelainShadow);
  flute.position.set(Math.cos(a)*.72,.37,Math.sin(a)*.72);
  pedestal.add(flute);
}
const topRing=mesh(new THREE.TorusGeometry(.67,.045,12,64), cobalt);
topRing.rotation.x=Math.PI/2;
topRing.position.y=.61;
pedestal.add(topRing);

const standingFoot=[0,.69,.02];
const ankle=[.02,1.02,.01];
const calf=[-.01,1.47,.01];
const knee=[.01,1.84,.01];
const hip=[.02,2.24,.02];

limb('standing shin', ankle, calf, .105,.14);
limb('standing thigh', calf, knee, .14,.18);
limb('standing upper leg', knee, hip, .18,.21);
sphere('standing heel', [0,.73,.02], [.14,.08,.2]);
sphere('pointed toe', [-.03,.67,.2], [.12,.055,.3]);

const rearKnee=[-.13,2.47,-.52];
const rearAnkle=[-.22,2.76,-1.03];
const rearToe=[-.2,2.79,-1.34];
limb('arabesque thigh', hip, rearKnee, .17,.2);
limb('arabesque calf', rearKnee, rearAnkle, .105,.14);
limb('arabesque foot', rearAnkle, rearToe, .09,.075);
sphere('rear pointed toe', rearToe, [.09,.06,.22]);

const torsoProfile=[
  new THREE.Vector2(.08,-.48),
  new THREE.Vector2(.25,-.4),
  new THREE.Vector2(.32,-.15),
  new THREE.Vector2(.29,.18),
  new THREE.Vector2(.23,.42),
  new THREE.Vector2(.13,.52),
  new THREE.Vector2(.06,.54)
];
const torso=mesh(new THREE.LatheGeometry(torsoProfile,40), porcelain);
torso.position.set(0,2.56,0);
torso.rotation.z=-.05;
scene.add(torso);

const waist=mesh(new THREE.TorusGeometry(.235,.035,12,48), gold);
waist.rotation.x=Math.PI/2;
waist.position.set(0,2.47,0);
scene.add(waist);

const tutu=mesh(new THREE.CylinderGeometry(.68,.57,.12,96), porcelain);
tutu.position.y=2.43;
scene.add(tutu);

for(let i=0;i<4;i++){
  const r=.45+i*.065;
  const ring=torus(2.48+i*.018,r,.035,porcelain);
  ring.scale.y=.5;
}
for(let i=0;i<36;i++){
  const a=i/36*Math.PI*2;
  const x=Math.cos(a)*.59, z=Math.sin(a)*.59;
  const frill=mesh(new THREE.SphereGeometry(.12,16,8), porcelain);
  frill.scale.set(1,.16,.7);
  frill.position.set(x,2.48,z);
  frill.rotation.y=-a;
  scene.add(frill);
}

const scroll=[];
for(let i=0;i<8;i++){
  const a=i/8*Math.PI*2;
  const cx=Math.cos(a)*.42, cz=Math.sin(a)*.42;
  scroll.push(tube([
    [cx-.11*Math.sin(a),2.535,cz+.11*Math.cos(a)],
    [cx-.04*Math.sin(a),2.555,cz+.04*Math.cos(a)],
    [cx+.04*Math.sin(a),2.555,cz-.04*Math.cos(a)],
    [cx+.11*Math.sin(a),2.535,cz-.11*Math.cos(a)]
  ],.012,cobalt,false));
}

const neck=sphere('neck',[0,3.08,0],[.105,.18,.105]);
const head=sphere('head',[0,3.34,0],[.235,.285,.22]);
head.rotation.z=-.05;

for(let i=0;i<11;i++){
  const a=i/11*Math.PI*2;
  sphere('hair coil',[Math.cos(a)*.16,3.48+Math.sin(a)*.055,Math.sin(a)*.15-.035],[.075,.1,.075],darkHair);
}
sphere('sculpted bun',[0,3.57,-.035],[.22,.19,.19],darkHair);
sphere('hair crown',[0,3.45,.005],[.24,.13,.22],darkHair);

const leftShoulder=[-.22,2.87,0], rightShoulder=[.22,2.87,0];
const leftElbow=[-.38,3.23,.015], rightElbow=[.38,3.23,.015];
const leftHand=[-.12,3.62,.02], rightHand=[.12,3.62,.02];
limb('left upper arm',leftShoulder,leftElbow,.09,.12);
limb('left forearm',leftElbow,leftHand,.065,.09);
limb('right upper arm',rightShoulder,rightElbow,.09,.12);
limb('right forearm',rightElbow,rightHand,.065,.09);
sphere('left hand',leftHand,[.075,.11,.07]);
sphere('right hand',rightHand,[.075,.11,.07]);

for(let side of [-1,1]){
  const x=side;
  tube([
    [side*.27,2.92,.03],
    [side*.22,2.98,.05],
    [side*.16,3.02,.04]
  ],.012,gold);
}

function crackleOnLimb(a,b,offset){
  const A=new THREE.Vector3(...a), B=new THREE.Vector3(...b);
  const d=B.clone().sub(A).normalize();
  const n=new THREE.Vector3(-d.z,.2,d.x).normalize();
  const q=A.clone().lerp(B,.35).add(n.clone().multiplyScalar(offset));
  const r=A.clone().lerp(B,.56).add(n.clone().multiplyScalar(offset*.65)).add(new THREE.Vector3(.035,.015,.02));
  const s=A.clone().lerp(B,.76).add(n.clone().multiplyScalar(-offset*.45));
  tube([q.toArray(),r.toArray(),s.toArray()],.008,cobalt);
}
crackleOnLimb(ankle,calf,.12);
crackleOnLimb(calf,knee,-.13);
crackleOnLimb(knee,hip,.14);
crackleOnLimb(hip,rearKnee,.14);
crackleOnLimb(rearKnee,rearAnkle,-.1);
crackleOnLimb(leftShoulder,leftElbow,.08);
crackleOnLimb(rightShoulder,rightElbow,-.08);

tube([[-.19,3.31,.2],[-.1,3.37,.22],[-.02,3.31,.225],[.08,3.37,.22],[.18,3.31,.2]],.009,cobalt);
tube([[-.17,3.42,.18],[-.06,3.46,.2],[.06,3.43,.2],[.16,3.46,.18]],.007,gold);
tube([[-.12,3.54,.13],[-.02,3.59,.15],[.08,3.55,.13]],.008,cobalt);

const ornament=new THREE.Group();
for(let i=0;i<6;i++){
  const a=i/6*Math.PI*2;
  const p1=[Math.cos(a)*.5,2.53,Math.sin(a)*.5];
  const p2=[Math.cos(a+.34)*.5,2.56,Math.sin(a+.34)*.5];
  const p3=[Math.cos(a+.68)*.5,2.53,Math.sin(a+.68)*.5];
  tube([p1,p2,p3],.01,cobalt);
}

const keyLight=new THREE.DirectionalLight(0xfff8e8,4.2);
keyLight.position.set(4,7,5);
keyLight.castShadow=true;
keyLight.shadow.mapSize.set(2048,2048);
keyLight.shadow.camera.left=-4;
keyLight.shadow.camera.right=4;
keyLight.shadow.camera.top=7;
keyLight.shadow.camera.bottom=-1;
scene.add(keyLight);

const fill=new THREE.HemisphereLight(0xf8f5ed,0x777b8c,2.0);
scene.add(fill);

const rim=new THREE.DirectionalLight(0x9cbcff,2.1);
rim.position.set(-4,4,-5);
scene.add(rim);

const halo=new THREE.Mesh(
  new THREE.RingGeometry(2.4,2.48,96),
  new THREE.MeshBasicMaterial({color:0xc9bda7,transparent:true,opacity:.22,side:THREE.DoubleSide})
);
halo.position.set(0,2.55,-.8);
halo.rotation.y=Math.PI;
scene.add(halo);

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
