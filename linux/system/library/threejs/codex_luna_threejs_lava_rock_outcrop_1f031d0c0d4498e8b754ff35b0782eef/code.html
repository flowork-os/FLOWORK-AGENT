<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Lava Rock Outcrop</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090b0d;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090b0d);
scene.fog = new THREE.Fog(0x090b0d, 18, 34);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(12, 8.5, 14);
camera.lookAt(0, 2.4, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.42;
controls.minDistance = 7;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.47;
controls.target.set(0, 2.5, 0);

const hemiLight = new THREE.HemisphereLight(0x82909b, 0x17110d, 1.55);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(0xffe0b0, 4.2);
keyLight.position.set(-7, 13, 9);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -13;
keyLight.shadow.camera.right = 13;
keyLight.shadow.camera.top = 14;
keyLight.shadow.camera.bottom = -7;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 35;
keyLight.shadow.bias = -0.00035;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x496a88, 2.2);
rimLight.position.set(8, 8, -10);
scene.add(rimLight);

const warmFill = new THREE.PointLight(0xff6b2f, 18, 12, 2);
warmFill.position.set(-1.8, 1.1, 3.0);
scene.add(warmFill);

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x151719,
  roughness: 0.96,
  metalness: 0.02
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(70, 70), groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.08;
ground.receiveShadow = true;
scene.add(ground);

const rngState = { value: 73519 };
function random() {
  rngState.value = (rngState.value * 1664525 + 1013904223) >>> 0;
  return rngState.value / 4294967296;
}

function rockMaterial(baseColor) {
  const material = new THREE.MeshStandardMaterial({
    color: baseColor,
    roughness: 0.91,
    metalness: 0.04,
    flatShading: true,
    vertexColors: true
  });
  return material;
}

function createRock(position, scale, rotation, shade) {
  const geometry = new THREE.IcosahedronGeometry(1, 1);
  const positions = geometry.getAttribute("position");
  const colors = [];
  const base = new THREE.Color(shade);

  for (let index = 0; index < positions.count; index++) {
    const vertical = positions.getY(index);
    const variation = (random() - 0.5) * 0.22 + vertical * 0.035;
    const color = base.clone().multiplyScalar(Math.max(0.48, 1 + variation));
    colors.push(color.r, color.g, color.b);
  }

  geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  geometry.computeVertexNormals();

  const mesh = new THREE.Mesh(geometry, rockMaterial(shade));
  mesh.position.set(position[0], position[1], position[2]);
  mesh.scale.set(scale[0], scale[1], scale[2]);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

const rocks = [
  [[-3.9, 1.05, 0.35], [3.25, 2.0, 2.7], [0.22, 0.5, -0.16], 0x292c2d],
  [[-1.15, 1.35, -0.35], [3.35, 2.55, 2.8], [-0.08, 0.78, 0.18], 0x343535],
  [[2.15, 1.12, 0.08], [3.35, 2.1, 2.8], [0.19, -0.38, -0.12], 0x242728],
  [[4.0, 0.9, 0.5], [2.35, 1.65, 2.2], [-0.12, 0.26, 0.23], 0x303232],
  [[-4.0, 2.75, -0.2], [2.25, 2.05, 2.0], [0.34, -0.3, 0.18], 0x3b3b39],
  [[-1.85, 3.2, -0.55], [2.35, 2.5, 2.15], [-0.15, 0.32, -0.24], 0x303233],
  [[0.65, 3.55, -0.35], [2.4, 2.75, 2.25], [0.14, -0.55, 0.12], 0x393a38],
  [[2.75, 3.0, 0.0], [2.15, 2.05, 2.0], [-0.2, 0.72, -0.1], 0x282b2c],
  [[-0.45, 5.25, -0.2], [2.25, 2.1, 2.0], [0.28, 0.18, -0.2], 0x333534],
  [[1.9, 4.75, -0.15], [1.75, 1.75, 1.65], [-0.26, -0.22, 0.24], 0x272a2b],
  [[-5.0, 0.62, 1.0], [1.9, 1.25, 1.8], [0.2, 0.45, -0.28], 0x202324],
  [[4.55, 0.72, -0.35], [1.8, 1.3, 1.65], [-0.15, -0.4, 0.18], 0x202223]
];

for (const rock of rocks) {
  createRock(rock[0], rock[1], rock[2], rock[3]);
}

function createCavity(position, scale, rotation, glowing) {
  const cavityMaterial = new THREE.MeshStandardMaterial({
    color: 0x050607,
    roughness: 1,
    metalness: 0,
    flatShading: true
  });
  const cavity = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 2), cavityMaterial);
  cavity.position.set(position[0], position[1], position[2]);
  cavity.scale.set(scale[0], scale[1], scale[2]);
  cavity.rotation.set(rotation[0], rotation[1], rotation[2]);
  cavity.castShadow = true;
  scene.add(cavity);

  const rimMaterial = new THREE.MeshStandardMaterial({
    color: 0x171a1a,
    roughness: 0.98,
    flatShading: true
  });
  const rim = new THREE.Mesh(new THREE.TorusGeometry(1, 0.16, 7, 12), rimMaterial);
  rim.position.set(position[0], position[1], position[2] + 0.06);
  rim.scale.set(scale[0], scale[1], 1);
  rim.rotation.set(rotation[0] + Math.PI / 2, rotation[1], rotation[2]);
  rim.castShadow = true;
  rim.receiveShadow = true;
  scene.add(rim);

  if (glowing) {
    const emberMaterial = new THREE.MeshStandardMaterial({
      color: 0x6b1608,
      emissive: 0xff3008,
      emissiveIntensity: 1.7,
      roughness: 1
    });
    const ember = new THREE.Mesh(new THREE.SphereGeometry(0.26, 10, 6), emberMaterial);
    ember.position.set(position[0] - 0.06, position[1] - 0.06, position[2] + 0.2);
    ember.scale.set(1.5, 0.65, 0.7);
    scene.add(ember);

    const cavityLight = new THREE.PointLight(0xff3b12, 2.4, 3.4, 2);
    cavityLight.position.copy(ember.position);
    scene.add(cavityLight);
  }
}

createCavity([-3.65, 2.25, 2.45], [0.92, 0.78, 0.28], [0.1, 0.1, 0.2], false);
createCavity([-1.05, 2.35, 2.5], [1.18, 0.8, 0.3], [-0.05, -0.2, -0.12], true);
createCavity([1.75, 1.65, 2.62], [0.82, 0.72, 0.26], [0.1, 0.25, 0.1], false);
createCavity([0.45, 4.2, 2.0], [0.68, 0.55, 0.24], [-0.2, -0.25, 0.18], true);
createCavity([3.18, 2.8, 2.05], [0.6, 0.66, 0.25], [0.18, 0.16, -0.2], false);

const seamMaterial = new THREE.MeshStandardMaterial({
  color: 0x0b0d0e,
  roughness: 1,
  flatShading: true
});

function createSeam(position, scale, rotation) {
  const seam = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), seamMaterial);
  seam.position.set(position[0], position[1], position[2]);
  seam.scale.set(scale[0], scale[1], scale[2]);
  seam.rotation.set(rotation[0], rotation[1], rotation[2]);
  seam.castShadow = true;
  scene.add(seam);
}

createSeam([-2.85, 3.8, 2.24], [0.1, 1.05, 0.08], [0.2, -0.25, 0.3]);
createSeam([2.45, 3.15, 2.34], [0.09, 0.82, 0.07], [-0.18, 0.35, -0.25]);
createSeam([-0.55, 5.0, 1.78], [0.08, 0.65, 0.06], [0.1, -0.45, 0.12]);
createSeam([0.75, 1.12, 2.86], [0.11, 0.8, 0.06], [-0.1, 0.18, -0.28]);

const dustMaterial = new THREE.MeshStandardMaterial({
  color: 0x30302d,
  roughness: 1,
  metalness: 0
});
const dust = new THREE.Mesh(new THREE.CircleGeometry(7.8, 64), dustMaterial);
dust.rotation.x = -Math.PI / 2;
dust.position.y = -0.065;
dust.scale.set(1.25, 0.78, 1);
dust.receiveShadow = true;
scene.add(dust);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
