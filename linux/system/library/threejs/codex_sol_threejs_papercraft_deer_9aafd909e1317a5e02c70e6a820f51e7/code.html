<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papercraft Deer</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #eee9e1;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeee9e1);
scene.fog = new THREE.Fog(0xeee9e1, 12, 24);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.2, 5.1, 8.6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.25, 2.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.72;
controls.minDistance = 6.5;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.49;

const hemi = new THREE.HemisphereLight(0xfff8eb, 0x786f68, 2.15);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff1dc, 4.1);
key.position.set(5, 9, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -3;
key.shadow.camera.near = 1;
key.shadow.camera.far = 22;
key.shadow.bias = -0.00025;
scene.add(key);

const fill = new THREE.DirectionalLight(0xc9dcff, 1.25);
fill.position.set(-6, 4, -5);
scene.add(fill);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xe6e0d7,
  roughness: 1,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(7.5, 64), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

const deer = new THREE.Group();
deer.rotation.y = -0.12;
scene.add(deer);

const paper = new THREE.MeshStandardMaterial({
  color: 0xc98f75,
  roughness: 0.94,
  metalness: 0,
  flatShading: true
});
const paperLight = new THREE.MeshStandardMaterial({
  color: 0xe8bba3,
  roughness: 0.96,
  metalness: 0,
  flatShading: true
});
const paperCream = new THREE.MeshStandardMaterial({
  color: 0xf1d6c4,
  roughness: 0.98,
  metalness: 0,
  flatShading: true
});
const darkPaper = new THREE.MeshStandardMaterial({
  color: 0x4b3833,
  roughness: 1,
  metalness: 0,
  flatShading: true
});
const antlerPaper = new THREE.MeshStandardMaterial({
  color: 0x826654,
  roughness: 1,
  metalness: 0,
  flatShading: true
});
const blackPaper = new THREE.MeshStandardMaterial({
  color: 0x211d1c,
  roughness: 0.85,
  metalness: 0,
  flatShading: true
});
const creaseMaterial = new THREE.LineBasicMaterial({
  color: 0x6f4b40,
  transparent: true,
  opacity: 0.32,
  depthWrite: false
});
const paleCreaseMaterial = new THREE.LineBasicMaterial({
  color: 0x8d6858,
  transparent: true,
  opacity: 0.22,
  depthWrite: false
});
const antlerCreaseMaterial = new THREE.LineBasicMaterial({
  color: 0x46362f,
  transparent: true,
  opacity: 0.42,
  depthWrite: false
});

function paperMesh(geometry, material, crease = creaseMaterial, threshold = 10) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  if (crease) {
    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geometry, threshold),
      crease
    );
    edges.renderOrder = 2;
    mesh.add(edges);
  }
  return mesh;
}

function facetedEllipsoid(position, scale, material, detail = 1, crease = creaseMaterial) {
  const geometry = new THREE.IcosahedronGeometry(1, detail);
  const mesh = paperMesh(geometry, material, crease, 8);
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  deer.add(mesh);
  return mesh;
}

function segment(a, b, radiusA, radiusB, material, radialSegments = 4, crease = creaseMaterial) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(radiusB, radiusA, length, radialSegments, 1, false);
  const mesh = paperMesh(geometry, material, crease, 5);
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  deer.add(mesh);
  return mesh;
}

function triangularPrism(verticesFront, depth, material) {
  const z0 = -depth * 0.5;
  const z1 = depth * 0.5;
  const positions = [
    verticesFront[0][0], verticesFront[0][1], z0,
    verticesFront[1][0], verticesFront[1][1], z0,
    verticesFront[2][0], verticesFront[2][1], z0,
    verticesFront[0][0], verticesFront[0][1], z1,
    verticesFront[1][0], verticesFront[1][1], z1,
    verticesFront[2][0], verticesFront[2][1], z1
  ];
  const indices = [
    0, 2, 1, 3, 4, 5,
    0, 1, 4, 0, 4, 3,
    1, 2, 5, 1, 5, 4,
    2, 0, 3, 2, 3, 5
  ];
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return paperMesh(geometry, material, creaseMaterial, 5);
}

const body = facetedEllipsoid(
  new THREE.Vector3(-0.18, 2.55, 0),
  new THREE.Vector3(1.62, 0.83, 0.69),
  paper,
  1
);
body.rotation.z = -0.035;

const shoulder = facetedEllipsoid(
  new THREE.Vector3(0.88, 2.78, 0),
  new THREE.Vector3(0.78, 0.76, 0.66),
  paperLight,
  0,
  paleCreaseMaterial
);
shoulder.rotation.z = -0.12;

segment(
  new THREE.Vector3(0.82, 3.03, 0),
  new THREE.Vector3(1.47, 4.02, 0),
  0.52, 0.34, paperLight, 5
);

const neckFront = triangularPrism(
  [[0.95, 3.15], [1.65, 4.18], [1.28, 4.28]],
  0.67,
  paperCream
);
neckFront.position.z = 0;
neckFront.renderOrder = 1;
deer.add(neckFront);

const head = facetedEllipsoid(
  new THREE.Vector3(1.77, 4.25, 0),
  new THREE.Vector3(0.74, 0.53, 0.47),
  paperLight,
  1,
  paleCreaseMaterial
);
head.rotation.z = -0.12;

const muzzle = facetedEllipsoid(
  new THREE.Vector3(2.40, 4.08, 0),
  new THREE.Vector3(0.61, 0.31, 0.32),
  paperCream,
  0,
  paleCreaseMaterial
);
muzzle.rotation.z = -0.08;

const nose = facetedEllipsoid(
  new THREE.Vector3(2.92, 4.04, 0),
  new THREE.Vector3(0.19, 0.19, 0.25),
  darkPaper,
  0,
  antlerCreaseMaterial
);

const throatPatch = triangularPrism(
  [[1.11, 3.15], [1.55, 4.00], [1.76, 3.92]],
  0.70,
  paperCream
);
throatPatch.position.z = 0;
deer.add(throatPatch);

for (const side of [-1, 1]) {
  const ear = triangularPrism(
    [[1.38, 4.52], [1.83, 4.55], [1.25, 5.22]],
    0.13,
    paperLight
  );
  ear.position.z = side * 0.40;
  ear.rotation.x = side * 0.16;
  ear.rotation.y = side * 0.18;
  deer.add(ear);

  const innerEar = triangularPrism(
    [[1.39, 4.62], [1.68, 4.62], [1.31, 5.08]],
    0.142,
    paperCream
  );
  innerEar.position.z = side * 0.405;
  innerEar.rotation.x = side * 0.16;
  innerEar.rotation.y = side * 0.18;
  innerEar.scale.set(0.88, 0.88, 0.88);
  deer.add(innerEar);

  const eye = facetedEllipsoid(
    new THREE.Vector3(2.02, 4.38, side * 0.425),
    new THREE.Vector3(0.075, 0.072, 0.045),
    blackPaper,
    0,
    null
  );
  eye.rotation.y = side * 0.15;
}

const legData = [
  {
    hip: new THREE.Vector3(0.88, 2.46, 0.43),
    knee: new THREE.Vector3(0.98, 1.43, 0.45),
    ankle: new THREE.Vector3(0.87, 0.37, 0.46),
    hoof: new THREE.Vector3(1.03, 0.16, 0.46)
  },
  {
    hip: new THREE.Vector3(0.70, 2.45, -0.43),
    knee: new THREE.Vector3(0.58, 1.44, -0.45),
    ankle: new THREE.Vector3(0.68, 0.37, -0.46),
    hoof: new THREE.Vector3(0.85, 0.16, -0.46)
  },
  {
    hip: new THREE.Vector3(-1.12, 2.40, 0.43),
    knee: new THREE.Vector3(-1.02, 1.43, 0.45),
    ankle: new THREE.Vector3(-1.18, 0.37, 0.46),
    hoof: new THREE.Vector3(-1.01, 0.16, 0.46)
  },
  {
    hip: new THREE.Vector3(-1.00, 2.40, -0.43),
    knee: new THREE.Vector3(-1.21, 1.45, -0.45),
    ankle: new THREE.Vector3(-1.08, 0.37, -0.46),
    hoof: new THREE.Vector3(-0.91, 0.16, -0.46)
  }
];

for (const leg of legData) {
  segment(leg.hip, leg.knee, 0.22, 0.15, paper, 4);
  segment(leg.knee, leg.ankle, 0.15, 0.095, paperLight, 4);
  segment(leg.ankle, leg.hoof, 0.105, 0.13, darkPaper, 4, antlerCreaseMaterial);
  const hoof = facetedEllipsoid(
    new THREE.Vector3(leg.hoof.x + 0.05, 0.13, leg.hoof.z),
    new THREE.Vector3(0.24, 0.13, 0.15),
    darkPaper,
    0,
    antlerCreaseMaterial
  );
  hoof.rotation.z = -0.12;
}

segment(
  new THREE.Vector3(-1.52, 2.88, 0),
  new THREE.Vector3(-2.02, 3.33, 0),
  0.28, 0.11, paperLight, 4
);
const tailTip = facetedEllipsoid(
  new THREE.Vector3(-2.08, 3.38, 0),
  new THREE.Vector3(0.20, 0.25, 0.18),
  paperCream,
  0,
  paleCreaseMaterial
);
tailTip.rotation.z = -0.72;

for (const side of [-1, 1]) {
  const z = side * 0.27;
  const root = new THREE.Vector3(1.55, 4.61, z);
  const p1 = new THREE.Vector3(1.42, 5.11, side * 0.34);
  const p2 = new THREE.Vector3(1.12, 5.55, side * 0.40);
  const p3 = new THREE.Vector3(0.72, 5.82, side * 0.44);
  segment(root, p1, 0.105, 0.085, antlerPaper, 5, antlerCreaseMaterial);
  segment(p1, p2, 0.09, 0.065, antlerPaper, 5, antlerCreaseMaterial);
  segment(p2, p3, 0.07, 0.025, antlerPaper, 5, antlerCreaseMaterial);

  segment(
    new THREE.Vector3(1.38, 5.13, side * 0.35),
    new THREE.Vector3(1.65, 5.52, side * 0.39),
    0.07, 0.018, antlerPaper, 5, antlerCreaseMaterial
  );
  segment(
    new THREE.Vector3(1.10, 5.52, side * 0.40),
    new THREE.Vector3(1.26, 5.98, side * 0.45),
    0.06, 0.016, antlerPaper, 5, antlerCreaseMaterial
  );
  segment(
    new THREE.Vector3(0.84, 5.73, side * 0.43),
    new THREE.Vector3(0.72, 6.12, side * 0.48),
    0.05, 0.014, antlerPaper, 5, antlerCreaseMaterial
  );
}

const chestFacet = triangularPrism(
  [[0.62, 2.46], [1.18, 3.20], [0.86, 3.56]],
  0.715,
  paperCream
);
chestFacet.position.z = 0;
deer.add(chestFacet);

const contactShadow = new THREE.Mesh(
  new THREE.CircleGeometry(2.15, 48),
  new THREE.MeshBasicMaterial({
    color: 0x6b5e55,
    transparent: true,
    opacity: 0.10,
    depthWrite: false
  })
);
contactShadow.rotation.x = -Math.PI / 2;
contactShadow.scale.set(1.25, 0.55, 1);
contactShadow.position.set(-0.05, 0.006, 0);
scene.add(contactShadow);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  deer.position.y = Math.sin(elapsed * 0.75) * 0.008;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
