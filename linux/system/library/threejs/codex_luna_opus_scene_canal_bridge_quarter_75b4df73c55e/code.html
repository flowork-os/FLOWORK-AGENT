import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x162837);
scene.fog = new THREE.Fog(0x162837, 32, 90);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(
  42,
  window.innerWidth / window.innerHeight,
  0.1,
  150
);
camera.position.set(17, 10.5, 18);
camera.lookAt(0, 4, -1);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.38;
controls.minDistance = 12;
controls.maxDistance = 38;
controls.maxPolarAngle = Math.PI * 0.48;
controls.target.set(0, 3.7, -2);

const clock = new THREE.Clock();
const rng = mulberry32(248631);

function mulberry32(seed) {
  return function () {
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function mat(color, roughness = 0.8, metalness = 0) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness
  });
}

function addMesh(parent, geometry, material, position = [0, 0, 0], rotation = [0, 0, 0]) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(...position);
  mesh.rotation.set(...rotation);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function box(parent, size, material, position = [0, 0, 0], rotation = [0, 0, 0]) {
  return addMesh(parent, new THREE.BoxGeometry(...size), material, position, rotation);
}

function cylinder(parent, radius, height, material, position = [0, 0, 0], rotation = [0, 0, 0], segments = 12) {
  return addMesh(parent, new THREE.CylinderGeometry(radius, radius, height, segments), material, position, rotation);
}

function sphere(parent, radius, material, position = [0, 0, 0], scale = [1, 1, 1]) {
  const mesh = addMesh(parent, new THREE.SphereGeometry(radius, 16, 10), material, position);
  mesh.scale.set(...scale);
  return mesh;
}

const stoneLight = mat(0x9b9788, 0.92);

const brickDark = mat(0x5e3030, 0.95);

const plasterBlue = mat(0x748898, 0.9);
const plasterGreen = mat(0x6f8876, 0.9);
const wood = mat(0x4a2b1d, 0.9);
const woodLight = mat(0x825333, 0.88);
const roof = mat(0x26383b, 0.96);
const roofRust = mat(0x603f38, 0.96);
const iron = mat(0x1b2222, 0.7, 0.65);
const gold = mat(0xb78a4c, 0.45, 0.45);
const windowFrame = mat(0xeee1bd, 0.65);
const waterMat = new THREE.MeshStandardMaterial({
  color: 0x123d3d,
  roughness: 0.25,
  metalness: 0.18
});
const warmWindow = new THREE.MeshStandardMaterial({
  color: 0xffb85a,
  emissive: 0xd76524,
  emissiveIntensity: 1.9,
  roughness: 0.48
});
const flowerRed = mat(0xc3473c, 0.78);
const flowerYellow = mat(0xe2af42, 0.8);
const leaf = mat(0x385e3a, 0.88);
const cream = mat(0xd8c79d, 0.88);
const blue = mat(0x496f88, 0.86);
const pink = mat(0xa66c78, 0.86);
const white = mat(0xd6d3c0, 0.88);

const hemi = new THREE.HemisphereLight(0x7890a0, 0x293229, 1.65);
scene.add(hemi);

const moonLight = new THREE.DirectionalLight(0x9bb4c9, 2.0);
moonLight.position.set(-18, 25, 12);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.left = -25;
moonLight.shadow.camera.right = 25;
moonLight.shadow.camera.top = 30;
moonLight.shadow.camera.bottom = -12;
moonLight.shadow.camera.near = 1;
moonLight.shadow.camera.far = 70;

sunset.position.set(20, 12, -25);
scene.add(sunset);

const ground = box(

  [48, 0.5, 82],
  mat(0x514b43, 0.96),

);

const promenadeLeft = box(scene, [6.2, 0.4, 82], mat(0x907d68, 0.96), [-7.1, 0, -10]);
const promenadeRight = box(scene, [6.2, 0.4, 82], mat(0x907d68, 0.96), [7.1, 0, -10]);

for (let side of [-1, 1]) {

    const seam = box(scene, [0.035, 0.012, 3.7], mat(0x6d6256), [side * 7.1, 0.21, z]);
    seam.rotation.y = (rng() - 0.5) * 0.035;

}

const waterGeometry = new THREE.PlaneGeometry(10, 82, 56, 150);
waterGeometry.rotateX(-Math.PI / 2);

const waterBase = [];
for (let i = 0; i < waterPositions.count; i++) {
  waterBase.push([
    waterPositions.getX(i),
    waterPositions.getY(i),
    waterPositions.getZ(i)
  ]);
}

function createBridge() {
  const group = new THREE.Group();
  group.position.set(0, 0, -7.4);

  const shape = new THREE.Shape();
  shape.moveTo(-7.1, 0);
  shape.lineTo(7.1, 0);
  shape.lineTo(7.1, 3.45);
  shape.quadraticCurveTo(4.4, 4.85, 0, 5.05);
  shape.quadraticCurveTo(-4.4, 4.85, -7.1, 3.45);
  shape.lineTo(-7.1, 0);

  const hole = new THREE.Path();
  hole.moveTo(-3.35, 0);
  hole.lineTo(-3.35, 1.12);
  hole.quadraticCurveTo(-3.35, 3.55, 0, 3.75);
  hole.quadraticCurveTo(3.35, 3.55, 3.35, 1.12);
  hole.lineTo(3.35, 0);
  hole.lineTo(-3.35, 0);
  shape.holes.push(hole);

  const bridgeGeometry = new THREE.ExtrudeGeometry(shape, {
    depth: 2.5,
    bevelEnabled: true,
    bevelSegments: 2,
    bevelSize: 0.08,
    bevelThickness: 0.08,
    curveSegments: 12
  });
  bridgeGeometry.translate(0, 0, -1.25);
  addMesh(group, bridgeGeometry, stone, [0, 0, 0]);

  box(group, [14.6, 0.38, 2.9], stoneLight, [0, 5.03, 0]);
  box(group, [15.2, 0.22, 0.22], stone, [0, 5.31, -1.24]);
  box(group, [15.2, 0.22, 0.22], stone, [0, 5.31, 1.24]);

  for (let x = -6.7; x <= 6.7; x += 0.85) {
    const cap = box(group, [0.24, 0.28, 0.24], stoneLight, [x, 5.34, -1.24]);
    cap.rotation.z = (rng() - 0.5) * 0.12;
    box(group, [0.24, 0.28, 0.24], stoneLight, [x, 5.34, 1.24]);
  }

  const keystone = box(group, [0.75, 0.62, 0.19], stoneLight, [0, 3.95, -1.34]);
  keystone.rotation.z = 0.05;

  for (let x = -6.3; x <= 6.3; x += 1.05) {
    const block = box(group, [0.9, 0.18, 0.16], stoneLight, [x, 2.65 + Math.abs(x) * 0.06, -1.34]);
    block.rotation.z = (x < 0 ? -1 : 1) * 0.12;
  }

  const lampPositions = [-5.7, 5.7];
  lampPositions.forEach(x => addLamp(group, [x, 5.65, -1.0], 0.9));

  scene.add(group);
  return group;
}

function addLamp(parent, position, scale = 1) {
  const group = new THREE.Group();
  group.position.set(...position);
  group.scale.setScalar(scale);

  cylinder(group, 0.075, 1.2, iron, [0, -0.6, 0], [0, 0, 0], 10);
  sphere(group, 0.12, iron, [0, 0.05, 0], [1.2, 0.7, 1.2]);
  const glow = new THREE.Mesh(
    new THREE.SphereGeometry(0.13, 12, 8),
    new THREE.MeshStandardMaterial({
      color: 0xffc46a,
      emissive: 0xff8d2d,
      emissiveIntensity: 3.8,
      roughness: 0.25
    })
  );
  glow.position.set(0, 0.08, 0);
  glow.castShadow = false;
  group.add(glow);

  const shade = new THREE.Mesh(
    new THREE.ConeGeometry(0.22, 0.3, 8),
    iron
  );
  shade.position.y = 0.3;
  shade.castShadow = true;
  group.add(shade);

  const light = new THREE.PointLight(0xffa856, 1.4, 5, 2);
  light.position.set(0, 0.1, 0);
  light.castShadow = true;
  light.shadow.mapSize.set(512, 512);
  group.add(light);

  parent.add(group);
  return group;
}

createBridge();

function createHouse(x, z, width, height, bodyMaterial, roofMaterial, rotation = 0) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  group.rotation.y = rotation;

  const depth = 3.5;
  box(group, [width, height, depth], bodyMaterial, [0, height / 2, 0]);

  const roofShape = new THREE.Shape();
  roofShape.moveTo(-width / 2 - 0.18, 0);
  roofShape.lineTo(width / 2 + 0.18, 0);
  roofShape.lineTo(0, height * 0.58);
  roofShape.lineTo(-width / 2 - 0.18, 0);

  const roofGeometry = new THREE.ExtrudeGeometry(roofShape, {
    depth: depth + 0.28,
    bevelEnabled: false,
    curveSegments: 4
  });
  roofGeometry.translate(0, height, -(depth + 0.28) / 2);
  addMesh(group, roofGeometry, roofMaterial);

  const frontZ = -depth / 2 - 0.045;
  const backZ = depth / 2 + 0.045;

  box(group, [width * 0.66, 0.09, 0.12], stoneLight, [0, height * 0.78, frontZ]);
  box(group, [width * 0.66, 0.09, 0.12], stoneLight, [0, height * 0.78, backZ]);

  const lowerWindowY = height * 0.47;
  const upperWindowY = height * 0.7;
  const windowW = Math.min(width * 0.38, 0.62);
  const windowH = 0.86;

  addWindow(group, [-width * 0.2, lowerWindowY, frontZ], windowW, windowH);
  addWindow(group, [width * 0.2, lowerWindowY, frontZ], windowW, windowH);
  addWindow(group, [0, upperWindowY, frontZ], windowW * 0.9, windowH * 0.82);
  addWindow(group, [-width * 0.2, lowerWindowY, backZ], windowW, windowH);
  addWindow(group, [width * 0.2, lowerWindowY, backZ], windowW, windowH);
  addWindow(group, [0, upperWindowY, backZ], windowW * 0.9, windowH * 0.82);

  const door = box(group, [width * 0.28, height * 0.34, 0.1], wood, [0, height * 0.17, frontZ]);
  box(group, [0.06, height * 0.3, 0.04], gold, [width * 0.04, height * 0.17, frontZ - 0.07]);
  box(group, [width * 0.36, 0.08, 0.14], stoneLight, [0, height * 0.35, frontZ]);

  const sign = box(group, [width * 0.66, 0.28, 0.06], woodLight, [0, height * 0.86, frontZ - 0.06]);
  sign.rotation.z = (rng() - 0.5) * 0.06;

  const chimney = box(group, [0.32, 1.1, 0.32], brickDark, [width * 0.27, height + height * 0.33, 0.1]);
  chimney.rotation.z = (rng() - 0.5) * 0.08;

  group.userData.frontZ = frontZ;
  scene.add(group);
  return group;
}

function addWindow(parent, pos, width, height) {
  const [x, y, z] = pos;
  box(parent, [width + 0.16, height + 0.16, 0.075], windowFrame, [x, y, z]);
  box(parent, [width, height, 0.09], warmWindow, [x, y, z - 0.055]);
  box(parent, [0.045, height, 0.04], windowFrame, [x, y, z - 0.11]);
  box(parent, [width, 0.045, 0.04], windowFrame, [x, y, z - 0.11]);
  box(parent, [width + 0.2, 0.08, 0.11], stoneLight, [x, y - height / 2 - 0.12, z]);
}

const houses = [
  [-10.0, -22, 2.55, 6.2, brick, roofRust],
  [-9.6, -15.2, 2.2, 7.2, plasterBlue, roof],
  [-10.1, -7.7, 2.65, 6.65, brickDark, roofRust],
  [-9.8, 0.4, 2.35, 7.4, plaster, roof],
  [-9.7, 8.5, 2.7, 6.5, plasterGreen, roofRust],
  [9.9, -23, 2.5, 7.0, plasterGreen, roof],
  [9.65, -15.8, 2.15, 6.4, brick, roofRust],
  [10.0, -8.4, 2.75, 7.3, plasterBlue, roof],
  [9.7, -0.4, 2.25, 6.6, brickDark, roofRust],
  [10.0, 7.5, 2.65, 7.1, plaster, roof]
];

houses.forEach((data, index) => {
  const [x, z, width, height, body, roofMaterial] = data;
  const rotation = (rng() - 0.5) * 0.035;
  createHouse(x, z, width, height, body, roofMaterial, rotation);
});

function createQuayRails(side) {
  const x = side * 5.15;
  const group = new THREE.Group();
  group.position.x = x;

  for (let z = -35; z <= 18; z += 2.25) {
    cylinder(group, 0.045, 0.95, iron, [0, 0.7, z], [0, 0, 0], 8);
    sphere(group, 0.08, iron, [0, 1.18, z], [1, 0.55, 1]);
  }

  const rail = cylinder(group, 0.055, 53, iron, [0, 1.08, -8.5], [Math.PI / 2, 0, 0], 8);
  rail.rotation.x = Math.PI / 2;
  scene.add(group);
}

createQuayRails(-1);
createQuayRails(1);

function createBoat() {
  const group = new THREE.Group();
  group.position.set(2.25, 0.35, -0.3);
  group.rotation.y = -0.16;

  const hullShape = new THREE.LatheGeometry(
    [
      new THREE.Vector2(0.0, -0.28),
      new THREE.Vector2(0.55, -0.22),
      new THREE.Vector2(1.04, -0.06),
      new THREE.Vector2(1.2, 0.18),
      new THREE.Vector2(1.03, 0.29),
      new THREE.Vector2(0.56, 0.32),
      new THREE.Vector2(0.0, 0.3)
    ],
    16
  );
  hullShape.rotateZ(Math.PI / 2);
  hullShape.rotateX(Math.PI / 2);
  const hull = addMesh(group, hullShape, wood, [0, 0, 0]);
  hull.scale.set(1, 0.64, 1.05);

  box(group, [1.65, 0.12, 0.9], woodLight, [0, 0.25, 0]);
  box(group, [0.9, 0.08, 0.62], wood, [0, 0.34, 0]);

  const post = cylinder(group, 0.045, 2.2, woodLight, [0, 1.32, 0], [0, 0, 0], 8);
  post.castShadow = true;
  const canopy = new THREE.Mesh(
    new THREE.ConeGeometry(0.82, 0.08, 4),
    blue
  );
  canopy.position.set(0, 2.25, 0);
  canopy.rotation.y = Math.PI / 4;
  canopy.scale.set(1.2, 1, 0.72);
  canopy.castShadow = true;
  group.add(canopy);

  for (let i = -1; i <= 1; i++) {
    const planter = box(group, [0.42, 0.22, 0.42], woodLight, [i * 0.48, 0.5, -0.42]);
    planter.rotation.y = (rng() - 0.5) * 0.18;
    for (let j = 0; j < 4; j++) {
      const flowerMat = j % 2 ? flowerRed : flowerYellow;
      sphere(group, 0.1, flowerMat, [i * 0.48 + (rng() - 0.5) * 0.24, 0.72 + rng() * 0.15, -0.42 + (rng() - 0.5) * 0.2]);
      cylinder(group, 0.025, 0.23, leaf, [i * 0.48 + (rng() - 0.5) * 0.2, 0.62, -0.42 + (rng() - 0.5) * 0.2], [0, 0, (rng() - 0.5) * 0.9], 6);
    }
  }

  const rope = cylinder(group, 0.018, 1.8, cream, [1.22, 0.28, 0], [0, 0, Math.PI / 2], 6);
  rope.rotation.z = Math.PI / 2;
  group.userData.phase = rng() * Math.PI * 2;
  scene.add(group);
  return group;
}

const boat = createBoat();

function createBicycle(x, z, side, lean = -0.18) {
  const group = new THREE.Group();
  group.position.set(x, 0.2, z);
  group.rotation.y = side * 0.4;
  group.rotation.z = lean;

  const wheelMat = new THREE.MeshStandardMaterial({
    color: 0x151b1c,
    roughness: 0.55,
    metalness: 0.8
  });
  const wheel1 = new THREE.Mesh(new THREE.TorusGeometry(0.38, 0.045, 8, 18), wheelMat);
  const wheel2 = wheel1.clone();
  wheel1.position.set(-0.43, 0.4, 0);
  wheel2.position.set(0.43, 0.4, 0);
  wheel1.rotation.y = Math.PI / 2;
  wheel2.rotation.y = Math.PI / 2;
  wheel1.castShadow = wheel2.castShadow = true;
  group.add(wheel1, wheel2);

  const framePoints = [
    [-0.43, 0.4, 0], [0, 0.42, 0], [0.23, 0.84, 0],
    [0.43, 0.4, 0], [-0.43, 0.4, 0], [0.23, 0.84, 0],
    [0, 0.42, 0], [0.43, 0.4, 0]
  ];
  for (let i = 0; i < framePoints.length - 1; i++) {
    const a = new THREE.Vector3(...framePoints[i]);
    const b = new THREE.Vector3(...framePoints[i + 1]);
    addBeam(group, a, b, 0.035, iron);
  }

  cylinder(group, 0.035, 0.3, iron, [0.23, 1.0, 0], [0, 0, -0.1], 8);
  box(group, [0.18, 0.035, 0.09], iron, [0.23, 1.14, 0]);
  box(group, [0.22, 0.045, 0.12], wood, [-0.03, 0.88, 0]);

  scene.add(group);
  return group;
}

function addBeam(parent, a, b, radius, material) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, length, 7),
    material
  );
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

createBicycle(-5.55, -3.4, -1, -0.18);
createBicycle(-5.35, -3.9, -1, 0.14);
createBicycle(5.45, 3.4, 1, 0.18);
createBicycle(5.4, 3.95, 1, -0.12);

function createLaundry() {
  const group = new THREE.Group();
  group.position.set(-8.0, 7.0, -3.8);
  group.rotation.y = 0.05;

  const lineMaterial = new THREE.LineBasicMaterial({ color: 0x1b2423 });
  const points = [
    new THREE.Vector3(-2.5, 0.15, 0),
    new THREE.Vector3(0, -0.18, 0),
    new THREE.Vector3(2.5, 0.1, 0)
  ];
  const curve = new THREE.CatmullRomCurve3(points);
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(curve.getPoints(24)),
    lineMaterial
  );
  group.add(line);

  const clothes = [
    [-1.95, -0.01, 0.55, cream],
    [-1.25, -0.09, 0.72, blue],
    [-0.52, -0.15, 0.5, pink],
    [0.3, -0.13, 0.75, white],
    [1.12, -0.08, 0.6, blue],
    [1.82, 0.0, 0.48, cream]
  ];

  clothes.forEach(([x, y, h, material], index) => {
    const garment = box(group, [0.52, h, 0.035], material, [x, y - h / 2, 0]);
    garment.userData.baseX = x;
    garment.userData.baseY = y - h / 2;
    garment.userData.phase = index * 0.8;
    garment.userData.laundry = true;
  });

  group.userData.laundry = true;
  scene.add(group);
  return group;
}

const laundry = createLaundry();

function createDucks() {
  const group = new THREE.Group();
  group.position.set(0, 0.31, -13.5);

  for (let i = 0; i < 3; i++) {
    const duck = new THREE.Group();
    duck.position.set((i - 1) * 0.65, 0, i * 0.2);
    const duckBody = sphere(duck, 0.18, mat(0xa98a52), [0, 0.08, 0], [1.45, 0.7, 0.95]);
    sphere(duck, 0.13, mat(0x92703d), [0.18, 0.18, 0.02], [0.95, 0.95, 0.95]);
    const beak = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.2, 5), flowerYellow);
    beak.position.set(0.31, 0.17, 0.02);
    beak.rotation.z = Math.PI / 2;
    beak.castShadow = true;
    duck.add(beak);
    sphere(duck, 0.018, iron, [0.24, 0.23, -0.09]);
    sphere(duck, 0.018, iron, [0.24, 0.23, 0.09]);

    const wake = new THREE.Mesh(
      new THREE.TorusGeometry(0.32, 0.012, 5, 24, Math.PI),
      new THREE.MeshBasicMaterial({ color: 0x9bb5a5, transparent: true, opacity: 0.42 })
    );
    wake.rotation.x = -Math.PI / 2;
    wake.position.y = -0.06;
    duck.add(wake);

    duck.userData.offset = i * 0.7;
    group.add(duck);
  }

  group.userData.ducks = true;
  scene.add(group);
  return group;
}

const ducks = createDucks();

function createPottedPlant(x, z, side) {
  const group = new THREE.Group();
  group.position.set(x, 0.2, z);
  group.rotation.y = side * 0.2;
  cylinder(group, 0.24, 0.4, woodLight, [0, 0.2, 0], [0, 0, 0], 10);
  for (let i = 0; i < 5; i++) {
    cylinder(group, 0.025, 0.45 + rng() * 0.2, leaf, [
      (rng() - 0.5) * 0.25,
      0.55 + rng() * 0.1,
      (rng() - 0.5) * 0.25
    ], [rng() - 0.5, rng() - 0.5, (rng() - 0.5) * 0.5], 6);
    sphere(group, 0.08, i % 2 ? flowerRed : flowerYellow, [
      (rng() - 0.5) * 0.35,
      0.76 + rng() * 0.2,
      (rng() - 0.5) * 0.3
    ]);
  }
  scene.add(group);
}

createPottedPlant(-5.4, -11.8, -1);
createPottedPlant(5.4, -11.6, 1);
createPottedPlant(-5.35, 5.7, -1);
createPottedPlant(5.35, 7.0, 1);

function addFacadeAwning(x, z, side, color) {
  const group = new THREE.Group();
  group.position.set(x, 3.55, z);
  group.rotation.y = side * 0.04;
  const awning = box(group, [1.35, 0.12, 0.55], color, [0, 0, side * -0.22]);
  awning.rotation.x = side * 0.2;
  box(group, [1.48, 0.08, 0.08], woodLight, [0, -0.19, side * -0.46]);
  scene.add(group);
}

addFacadeAwning(-5.5, -15.2, -1, cream);
addFacadeAwning(5.45, -15.8, 1, pink);

for (let side of [-1, 1]) {
  for (let i = 0; i < 9; i++) {
    const x = side * (5.8 + rng() * 0.9);
    const z = -31 + i * 5.1 + rng() * 1.2;
    const bollard = cylinder(scene, 0.11, 0.5, iron, [x, 0.3, z], [0, 0, 0], 10);
    bollard.rotation.z = (rng() - 0.5) * 0.05;
  }
}

function createMoon() {
  const moon = new THREE.Mesh(
    new THREE.SphereGeometry(2.15, 32, 20),
    new THREE.MeshBasicMaterial({ color: 0xd9d3b4 })
  );
  moon.position.set(-18, 22, -33);
  scene.add(moon);

  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(3.0, 32, 16),
    new THREE.MeshBasicMaterial({
      color: 0xaab6b0,
      transparent: true,
      opacity: 0.08,
      side: THREE.BackSide
    })
  );
  halo.position.copy(moon.position);
  scene.add(halo);
}

createMoon();

function createDistantRoofline() {
  const group = new THREE.Group();
  group.position.set(0, 0, -39);

  for (let x = -28; x <= 28; x += 4.3) {
    const h = 4 + rng() * 3;
    const w = 3.6 + rng() * 1.2;
    box(group, [w, h, 2.5], mat(0x344049), [x, h / 2, 0]);
    const roofGeo = new THREE.ConeGeometry(w * 0.76, h * 0.45, 3);
    const roofMesh = addMesh(group, roofGeo, mat(0x252f38), [x, h + h * 0.2, 0]);
    roofMesh.rotation.y = Math.PI / 2;
  }

  scene.add(group);
}

createDistantRoofline();

function addRailingChain(side, zStart, length) {
  const group = new THREE.Group();
  group.position.set(side * 5.35, 0.75, zStart);
  const count = Math.floor(length / 0.7);
  for (let i = 0; i < count; i++) {
    const xz = i * 0.7;
    const link = new THREE.Mesh(
      new THREE.TorusGeometry(0.09, 0.018, 6, 10),
      iron
    );
    link.position.set(0, -0.25 + Math.sin(i * 0.8) * 0.02, xz);
    link.rotation.set(Math.PI / 2, 0, i % 2 ? 0.55 : -0.55);
    link.castShadow = true;
    group.add(link);
  }
  scene.add(group);
}

addRailingChain(-1, -2.5, 5.4);
addRailingChain(1, -2.5, 5.4);

const bridgeLampLeft = addLamp(scene, [-4.9, 3.4, -5.9], 0.78);
const bridgeLampRight = addLamp(scene, [4.9, 3.4, -5.9], 0.78);

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  for (let i = 0; i < waterPositions.count; i++) {
    const base = waterBase[i];
    const x = base[0];
    const z = base[1];
    const wave =
      Math.sin(x * 2.1 + t * 1.5) * 0.022 +
      Math.sin(z * 0.9 - t * 1.1 + x) * 0.018 +
      Math.sin((x + z) * 3.4 + t * 0.7) * 0.008;
    waterPositions.setZ(i, wave);
  }
  waterPositions.needsUpdate = true;

  boat.position.y = 0.35 + Math.sin(t * 1.4 + boat.userData.phase) * 0.035;
  boat.rotation.z = Math.sin(t * 1.15 + 0.6) * 0.012;
  boat.rotation.y = -0.16 + Math.sin(t * 0.45) * 0.018;

  laundry.children.forEach(item => {
    if (item.userData.laundry) {
      item.rotation.z = Math.sin(t * 1.4 + item.userData.phase) * 0.08;
      item.position.x = Math.sin(t * 1.4 + item.userData.phase) * 0.025;
    }
  });

  ducks.position.z = -13.5 + Math.sin(t * 0.28) * 6.8;
  ducks.position.x = Math.sin(t * 0.22) * 0.42;
  ducks.children.forEach((duck, index) => {
    duck.position.y = Math.sin(t * 2.1 + duck.userData.offset) * 0.018;
    duck.rotation.z = Math.sin(t * 1.4 + index) * 0.025;
  });

  bridgeLampLeft.rotation.z = Math.sin(t * 0.8) * 0.008;
  bridgeLampRight.rotation.z = Math.sin(t * 0.8 + 1.5) * 0.008;

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
