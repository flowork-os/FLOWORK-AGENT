<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papercraft King Crab</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5ddc8}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5ddc8);
scene.fog = new THREE.Fog(0xf5ddc8, 16, 30);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.8, 5.4, 10.2);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 7;
controls.maxDistance = 18;
controls.target.set(0, 0.8, 0);

scene.add(new THREE.HemisphereLight(0xfff2df, 0x7c4850, 2.4));

const key = new THREE.DirectionalLight(0xfff3df, 4.2);
key.position.set(-5, 10, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -8;
scene.add(key);

const fill = new THREE.DirectionalLight(0xff9d7d, 1.4);
fill.position.set(7, 4, -6);
scene.add(fill);

const root = new THREE.Group();
root.rotation.y = 0.18;
scene.add(root);

const paperOrange = new THREE.MeshStandardMaterial({
  color:0xe96843, roughness:0.88, metalness:0, flatShading:true
});
const paperLight = new THREE.MeshStandardMaterial({
  color:0xf18b62, roughness:0.9, flatShading:true
});
const paperDark = new THREE.MeshStandardMaterial({
  color:0xb94438, roughness:0.9, flatShading:true
});
const paperCream = new THREE.MeshStandardMaterial({
  color:0xffc89b, roughness:0.92, side:THREE.DoubleSide
});
const ink = new THREE.LineBasicMaterial({
  color:0x793b39, transparent:true, opacity:0.52
});
const crease = new THREE.MeshBasicMaterial({
  color:0x873d36, transparent:true, opacity:0.72
});
const blackPaper = new THREE.MeshStandardMaterial({
  color:0x241d24, roughness:0.95, flatShading:true
});

function addEdges(mesh, opacity=0.42) {
  const lines = new THREE.LineSegments(
    new THREE.EdgesGeometry(mesh.geometry, 18),
    new THREE.LineBasicMaterial({color:0x713a37, transparent:true, opacity})
  );
  mesh.add(lines);
}

function between(a, b, radiusA, radiusB, material, sides=7) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const delta = end.clone().sub(start);
  const length = delta.length();
  const mesh = new THREE.Mesh(
    new THREE.ConeGeometry(radiusA, length, sides, 1, false),
    material
  );
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), delta.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  addEdges(mesh, 0.58);
  root.add(mesh);
  return mesh;
}

function jointRing(point, direction, radius) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(radius, 0.025, 5, 10), crease);
  ring.position.set(...point);
  ring.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,1,0),
    new THREE.Vector3(...direction).normalize()
  );
  ring.castShadow = true;
  root.add(ring);
}

function tab(point, angle, scale=1) {
  const geometry = new THREE.BufferGeometry();
  const vertices = new Float32Array([
    -0.24*scale, 0, -0.16*scale,
     0.26*scale, 0, -0.12*scale,
     0.02*scale, 0,  0.31*scale
  ]);
  geometry.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, paperCream);
  mesh.position.set(point[0], point[1] + 0.045, point[2]);
  mesh.rotation.y = angle;
  mesh.rotation.x = -0.12;
  mesh.castShadow = true;
  root.add(mesh);
  const fold = new THREE.LineSegments(
    new THREE.EdgesGeometry(geometry),
    new THREE.LineBasicMaterial({color:0x9b5143, transparent:true, opacity:0.8})
  );
  mesh.add(fold);
}

const body = new THREE.Mesh(
  new THREE.CylinderGeometry(2.0, 1.72, 0.72, 10, 1),
  paperDark
);
body.position.y = 0.52;
body.scale.z = 0.82;
body.castShadow = true;
body.receiveShadow = true;
addEdges(body, 0.65);
root.add(body);

const shell = new THREE.Mesh(
  new THREE.SphereGeometry(2.18, 12, 7, 0, Math.PI*2, 0, Math.PI*0.68),
  paperOrange
);
shell.position.y = 0.68;
shell.scale.set(1.02, 0.78, 0.84);
shell.castShadow = true;
shell.receiveShadow = true;
addEdges(shell, 0.34);
root.add(shell);

const shellRim = new THREE.Mesh(
  new THREE.TorusGeometry(1.78, 0.055, 5, 12),
  crease
);
shellRim.rotation.x = Math.PI / 2;
shellRim.position.set(0, 0.3, 0);
shellRim.scale.z = 0.83;
root.add(shellRim);

const specklePositions = [];
for (let i=0; i<80; i++) {
  const theta = Math.random()*Math.PI*2;
  const y = 0.38 + Math.random()*1.45;
  const normalized = (y-0.68)/1.7;
  const radial = Math.sqrt(Math.max(0.05, 1-normalized*normalized));
  const x = Math.cos(theta)*1.9*radial;
  const z = Math.sin(theta)*1.58*radial;
  specklePositions.push(x, y, z);
}
const speckles = new THREE.Points(
  new THREE.BufferGeometry(),
  new THREE.PointsMaterial({color:0x9d4439, size:0.075, sizeAttenuation:true, transparent:true, opacity:0.72})
);
speckles.geometry.setAttribute("position", new THREE.Float32BufferAttribute(specklePositions, 3));
root.add(speckles);

const legZ = [-1.25, -0.42, 0.42, 1.25];
for (let sideIndex=0; sideIndex<2; sideIndex++) {
  const side = sideIndex === 0 ? -1 : 1;
  for (let i=0; i<4; i++) {
    const z = legZ[i];
    const p0 = [side*1.48, 0.48, z*0.72];
    const p1 = [side*2.18, 0.28 + (i%2)*0.08, z + (i-1.5)*0.08];
    const p2 = [side*3.05, 0.10 + (i%2)*0.04, z + (i-1.5)*0.22];
    const p3 = [side*3.72, 0.07, z + (i-1.5)*0.37];
    between(p0,p1,0.28,0.21,paperLight);
    between(p1,p2,0.19,0.105,paperOrange);
    between(p2,p3,0.105,0.035,paperDark);
    jointRing(p1, [side*0.7,-0.1,0.1], 0.21);
    jointRing(p2, [side*0.8,-0.04,0.2], 0.105);
    tab(p1, side*(0.5 + i*0.12), 0.8);
  }
}

function claw(side) {
  const base = [side*1.25, 0.58, -1.28];
  const elbow = [side*2.02, 0.47, -1.63];
  const wrist = [side*2.78, 0.68, -1.75];
  between(base, elbow, 0.36, 0.25, paperLight, 7);
  between(elbow, wrist, 0.27, 0.16, paperOrange, 7);
  jointRing(elbow, [side*0.7,0,-0.25], 0.24);
  tab(elbow, side*0.8, 1.15);

  const palm = new THREE.Mesh(
    new THREE.CylinderGeometry(0.43,0.28,0.82,7),
    paperOrange
  );
  palm.position.set(side*3.05,0.83,-1.78);
  palm.rotation.z = side*Math.PI/2;
  palm.rotation.x = 0.12;
  palm.castShadow = true;
  addEdges(palm,0.62);
  root.add(palm);

  const upper = [side*3.45,1.02,-1.79];
  const lower = [side*3.44,0.57,-1.79];
  between([side*3.34,0.83,-1.78],upper,0.22,0.07,paperLight,6);
  between([side*3.34,0.83,-1.78],lower,0.22,0.07,paperDark,6);
  jointRing([side*3.34,0.83,-1.78],[0,1,0],0.2);
}
claw(-1);
claw(1);

for (const side of [-1,1]) {
  const stalk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.115,0.15,0.48,7),
    paperCream
  );
  stalk.position.set(side*0.46,1.95,-1.35);
  stalk.rotation.x = -0.18;
  stalk.castShadow = true;
  addEdges(stalk,0.6);
  root.add(stalk);

  const eye = new THREE.Mesh(
    new THREE.CylinderGeometry(0.19,0.19,0.07,8),
    blackPaper
  );
  eye.position.set(side*0.46,2.2,-1.42);
  eye.rotation.x = Math.PI/2;
  eye.castShadow = true;
  addEdges(eye,0.4);
  root.add(eye);
}

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(7,64),
  new THREE.MeshStandardMaterial({color:0xe8c4ad, roughness:1})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -0.05;
ground.receiveShadow = true;
scene.add(ground);

const shadowDisc = new THREE.Mesh(
  new THREE.CircleGeometry(4.4,48),
  new THREE.MeshBasicMaterial({color:0x9d5d5a, transparent:true, opacity:0.16})
);
shadowDisc.rotation.x = -Math.PI/2;
shadowDisc.position.y = -0.035;
shadowDisc.scale.set(1.15,0.62,1);
scene.add(shadowDisc);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
