function prepareMesh(mesh, cast = true, receive = true) {
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  return mesh;
}

function roundedBox(width, height, depth, radius, segments, material) {
  return prepareMesh(new THREE.Mesh(
    new RoundedBoxGeometry(width, height, depth, segments, radius),
    material
  ));
}

function box(width, height, depth, material) {
  return prepareMesh(new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth),
    material
  ));
}

function cylinder(radiusTop, radiusBottom, height, segments, material) {
  return prepareMesh(new THREE.Mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
    material
  ));
}

function sphere(radius, material, segments = 20) {
  return prepareMesh(new THREE.Mesh(
    new THREE.SphereGeometry(radius, segments, Math.max(10, segments / 2)),
    material
  ));
}

function createScreenTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 768;
  canvas.height = 432;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#d8b96f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const vignette = ctx.createRadialGradient(384, 210, 40, 384, 210, 430);
  vignette.addColorStop(0, 'rgba(255,240,165,0.10)');
  vignette.addColorStop(1, 'rgba(35,44,37,0.38)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#173f40';
  ctx.fillRect(0, 0, 768, 20);
  ctx.fillRect(0, 412, 768, 20);

  ctx.strokeStyle = '#b9492e';
  ctx.lineWidth = 8;
  ctx.strokeRect(30, 34, 708, 364);

  ctx.fillStyle = '#214f4e';
  ctx.font = 'bold 42px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('MOON PATROL', 384, 82);

  ctx.strokeStyle = '#315e58';
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.moveTo(55, 318);
  ctx.lineTo(118, 301);
  ctx.lineTo(169, 327);
  ctx.lineTo(238, 291);
  ctx.lineTo(315, 322);
  ctx.lineTo(390, 299);
  ctx.lineTo(461, 325);
  ctx.lineTo(530, 288);
  ctx.lineTo(612, 318);
  ctx.lineTo(713, 295);
  ctx.stroke();

  ctx.fillStyle = '#b9492e';
  ctx.fillRect(284, 224, 190, 54);
  ctx.fillRect(320, 188, 110, 45);
  ctx.fillStyle = '#173f40';
  ctx.fillRect(341, 201, 27, 22);
  ctx.fillRect(389, 201, 27, 22);

  ctx.strokeStyle = '#173f40';
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.moveTo(302, 274);
  ctx.lineTo(277, 300);
  ctx.moveTo(452, 274);
  ctx.lineTo(481, 300);
  ctx.stroke();

  ctx.fillStyle = '#173f40';
  ctx.beginPath();
  ctx.arc(313, 292, 25, 0, Math.PI * 2);
  ctx.arc(446, 292, 25, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#b9492e';
  ctx.beginPath();
  ctx.arc(604, 148, 35, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#214f4e';
  ctx.lineWidth = 7;
  ctx.beginPath();
  ctx.arc(604, 148, 62, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = '#214f4e';
  ctx.font = 'bold 30px monospace';
  ctx.fillText('SCORE  1958', 187, 378);
  ctx.fillText('HI  8888', 579, 378);

  ctx.globalAlpha = 0.18;
  for (let y = 25; y < 420; y += 12) {
    ctx.fillStyle = '#173f40';
    ctx.fillRect(0, y, 768, 2);
  }

  const random = mulberry32(1958);
  ctx.globalAlpha = 0.28;
  for (let i = 0; i < 90; i++) {
    const x = random() * 768;
    const y = random() * 432;
    const length = 4 + random() * 30;
    ctx.strokeStyle = random() > 0.55 ? '#f2d98c' : '#5d3b2a';
    ctx.lineWidth = 1 + random() * 3;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + length, y + (random() - 0.5) * 5);
    ctx.stroke();
  }

  ctx.globalAlpha = 1;
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

function mulberry32(seed) {
  let value = seed >>> 0;
  return function() {
    value += 0x6D2B79F5;
    let result = value;
    result = Math.imul(result ^ (result >>> 15), result | 1);
    result ^= result + Math.imul(result ^ (result >>> 7), result | 61);
    return ((result ^ (result >>> 14)) >>> 0) / 4294967296;
  };
}

function createCrossGeometry() {
  const shape = new THREE.Shape();
  shape.moveTo(-0.42, 1.02);
  shape.lineTo(0.42, 1.02);
  shape.quadraticCurveTo(0.54, 1.02, 0.54, 0.9);
  shape.lineTo(0.54, 0.54);
  shape.lineTo(0.9, 0.54);
  shape.quadraticCurveTo(1.02, 0.54, 1.02, 0.42);
  shape.lineTo(1.02, -0.42);
  shape.quadraticCurveTo(1.02, -0.54, 0.9, -0.54);
  shape.lineTo(0.54, -0.54);
  shape.lineTo(0.54, -0.9);
  shape.quadraticCurveTo(0.54, -1.02, 0.42, -1.02);
  shape.lineTo(-0.42, -1.02);
  shape.quadraticCurveTo(-0.54, -1.02, -0.54, -0.9);
  shape.lineTo(-0.54, -0.54);
  shape.lineTo(-0.9, -0.54);
  shape.quadraticCurveTo(-1.02, -0.54, -1.02, -0.42);
  shape.lineTo(-1.02, 0.42);
  shape.quadraticCurveTo(-1.02, 0.54, -0.9, 0.54);
  shape.lineTo(-0.54, 0.54);
  shape.lineTo(-0.54, 0.9);
  shape.quadraticCurveTo(-0.54, 1.02, -0.42, 1.02);

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.25,
    bevelEnabled: true,
    bevelSegments: 3,
    steps: 1,
    bevelSize: 0.09,
    bevelThickness: 0.07,
    curveSegments: 5
  });
  geometry.center();
  return geometry;
}

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  screenGlint.material.opacity = 0.11 + Math.sin(elapsed * 1.2) * 0.025;
  keyWing.rotation.z = 0.22 + Math.sin(elapsed * 0.75) * 0.025;

  controls.update();
  renderer.render(scene, camera);
}

  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
