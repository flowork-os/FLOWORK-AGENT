<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Carved Ritual Mask</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#171210}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {mergeVertices} from 'three/addons/utils/BufferGeometryUtils.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x171210);
scene.fog=new THREE.Fog(0x171210,11,22);
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(renderer),0.04).texture;

const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,60);
camera.position.set(0,0.7,7.6);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0.1,0);
controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=1.6;
controls.minDistance=4;controls.maxDistance=14;

// ---------- textures ----------
function woodTexture(){
  const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');
  g.fillStyle='#8a5732';g.fillRect(0,0,512,512);
  for(let i=0;i<70;i++){
    const x0=Math.random()*512,dark=Math.random()<0.55;
    g.strokeStyle=dark?`rgba(64,37,17,${0.06+Math.random()*0.22})`:`rgba(203,148,92,${0.05+Math.random()*0.16})`;
    g.lineWidth=2+Math.random()*7;g.beginPath();
    for(let y=-8;y<=520;y+=12){const x=x0+Math.sin(y*0.015+i*7)*9+Math.sin(y*0.11+i)*2;y<0?g.moveTo(x,y):g.lineTo(x,y);}
    g.stroke();
  }
  for(let i=0;i<4;i++){const x=Math.random()*512,y=Math.random()*512;
    for(let r=14;r>2;r-=3){g.strokeStyle='rgba(58,33,15,0.28)';g.lineWidth=1.5;g.beginPath();g.ellipse(x,y,r*1.6,r,0.3,0,7);g.stroke();}}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function wearTexture(){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,256,256);
  for(let i=0;i<90;i++){g.fillStyle=`rgba(0,0,0,${0.25+Math.random()*0.6})`;g.beginPath();
    g.ellipse(Math.random()*256,Math.random()*256,2+Math.random()*14,2+Math.random()*9,Math.random()*3,0,7);g.fill();}
  for(let i=0;i<25;i++){g.strokeStyle=`rgba(0,0,0,${0.3+Math.random()*0.5})`;g.lineWidth=1+Math.random()*2;
    g.beginPath();const x=Math.random()*256,y=Math.random()*256;g.moveTo(x,y);
    g.lineTo(x+(Math.random()-0.5)*60,y+(Math.random()-0.5)*60);g.stroke();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
const wtex=woodTexture();wtex.repeat.set(0.32,0.32);
const wear=wearTexture();
const woodMat=new THREE.MeshStandardMaterial({map:wtex,bumpMap:wtex,bumpScale:0.3,roughness:0.72,metalness:0,envMapIntensity:0.45});
const paint=c=>new THREE.MeshStandardMaterial({color:c,roughness:0.88,metalness:0,alphaMap:wear,alphaTest:0.35,envMapIntensity:0.25});
const whitePaint=paint(0xe6dbc2),redPaint=paint(0xa63b24),lipPaint=paint(0x7e2418);

// ---------- face-plate geometry helpers ----------
const RX=1.6,RY=2.2,DEPTH=0.22;
const domeZ=(x,y)=>0.95*Math.cos(Math.min(1,Math.hypot(x/RX,y/RY))*Math.PI/2);
const surf=(x,y)=>domeZ(x,y)+DEPTH+0.07;
const Z=new THREE.Vector3(0,0,1),e=0.02;
const nrm=(x,y)=>new THREE.Vector3(-(domeZ(x+e,y)-domeZ(x-e,y))/(2*e),-(domeZ(x,y+e)-domeZ(x,y-e))/(2*e),1).normalize();
function placeOn(o,x,y,spin=0,sink=0){o.position.set(x,y,surf(x,y)-sink);o.quaternion.setFromUnitVectors(Z,nrm(x,y));if(spin)o.rotateZ(spin);return o;}
function coat(m,mat){const c=m.clone();c.material=mat;c.scale.multiplyScalar(1.045);return c;}

const mask=new THREE.Group();mask.position.y=0.15;scene.add(mask);

// concave oval face plate with cut-out eyes + mouth
const shape=new THREE.Shape();
shape.absellipse(0,0,RX,RY,0,Math.PI*2);
for(const s of[-1,1]){const h=new THREE.Path();h.absellipse(s*0.62,0.55,0.42,0.19,0,Math.PI*2,true,s*0.12);shape.holes.push(h);}
const mh=new THREE.Path();mh.absellipse(0,-1.05,0.46,0.15,0,Math.PI*2,true,0);shape.holes.push(mh);
let fg=new THREE.ExtrudeGeometry(shape,{depth:DEPTH,bevelEnabled:true,bevelThickness:0.07,bevelSize:0.06,bevelSegments:3,curveSegments:56,steps:2});
fg.deleteAttribute('normal');fg=mergeVertices(fg);
{const p=fg.attributes.position;for(let i=0;i<p.count;i++)p.setZ(i,p.getZ(i)+domeZ(p.getX(i),p.getY(i)));}
fg.computeVertexNormals();
mask.add(new THREE.Mesh(fg,woodMat));

// protruding carved nose (4-facet, edge forward) + nostril flares
const ng=new THREE.CylinderGeometry(0.075,0.3,1.15,4,1);ng.scale(1.2,1,1.7);
const nose=new THREE.Mesh(ng,woodMat);placeOn(nose,0,0.1,0,0.16);nose.rotateX(-0.24);mask.add(nose);
for(const s of[-1,1]){const n=new THREE.Mesh(new THREE.SphereGeometry(0.105,20,14),woodMat);
  placeOn(n,s*0.21,-0.44,0,0.02);n.scale.set(1.25,0.75,0.7);mask.add(n);}

// brows, eye rims, lips — carved wood + worn paint coats
const torus=(R,t,arc=Math.PI*2)=>new THREE.TorusGeometry(R,t,12,48,arc);
const browG=torus(0.5,0.068,Math.PI*0.8);
for(const s of[-1,1]){const b=new THREE.Mesh(browG,woodMat);
  placeOn(b,s*0.55,0.64,Math.PI*0.1+s*0.15,0.03);b.scale.set(1,0.8,0.7);mask.add(b,coat(b,redPaint));}
const rimG=torus(0.46,0.06);
for(const s of[-1,1]){const r=new THREE.Mesh(rimG,woodMat);
  placeOn(r,s*0.62,0.55,s*0.12,0.03);r.scale.set(1,0.48,0.7);mask.add(r,coat(r,whitePaint));}
const lips=new THREE.Mesh(torus(0.46,0.09),woodMat);
placeOn(lips,0,-1.05,0,0.03);lips.scale.set(1.08,0.45,0.75);mask.add(lips,coat(lips,lipPaint));

// raised tool-mark ridges: forehead sunburst, cheek hatching, chin chevrons
const marks=[];
for(let r=0;r<3;r++){const R=1.0+r*0.2;
  for(let a=0.62;a<=Math.PI-0.61;a+=0.155)marks.push([Math.cos(a)*R,0.5+Math.sin(a)*R*1.05,a]);}
for(const s of[-1,1])for(let i=0;i<3;i++)for(let j=0;j<3;j++)
  marks.push([s*(0.52+j*0.23),-0.22-i*0.19-j*0.09,s*0.65]);
for(let i=0;i<3;i++)for(const s of[-1,1])marks.push([s*0.21,-1.42-i*0.17,s*0.5]);
const ridge=new THREE.InstancedMesh(new THREE.BoxGeometry(0.18,0.05,0.08),woodMat,marks.length);
{const d=new THREE.Object3D();
 marks.forEach(([x,y,sp],i)=>{placeOn(d,x,y,sp,0.01);d.scale.set(0.75+((i*29)%55)/100,1,1);d.updateMatrix();ridge.setMatrixAt(i,d.matrix);});}
mask.add(ridge);

// worn paint accents conforming to the dome
function strip(w,h,x,y,mat){
  const g=new THREE.PlaneGeometry(w,h,4,16),p=g.attributes.position,z0=surf(x,y);
  for(let i=0;i<p.count;i++)p.setZ(i,surf(x+p.getX(i),y+p.getY(i))-z0+0.02);
  g.computeVertexNormals();const m=new THREE.Mesh(g,mat);m.position.set(x,y,z0);return m;
}
mask.add(strip(0.2,0.95,0,1.42,whitePaint));
for(const s of[-1,1])mask.add(strip(0.13,0.36,s*0.62,-0.02,redPaint));
for(const s of[-1,1]){const dot=new THREE.Mesh(new THREE.SphereGeometry(0.14,18,12),redPaint);
  placeOn(dot,s*1.0,-0.95,0,0.01);dot.scale.set(1,1,0.3);mask.add(dot);}

mask.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});

// ---------- lighting & ground ----------
const key=new THREE.DirectionalLight(0xffd9ae,2.6);
key.position.set(3.5,5.5,4.5);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.near=1;key.shadow.camera.far=20;
key.shadow.camera.left=key.shadow.camera.bottom=-4.5;key.shadow.camera.right=key.shadow.camera.top=4.5;
key.shadow.bias=-0.0004;key.shadow.normalBias=0.03;key.shadow.radius=4;
const rimL=new THREE.DirectionalLight(0x7d96c8,1.1);rimL.position.set(-5,2.5,-4);
const hemi=new THREE.HemisphereLight(0xffe9cf,0x2b1c12,0.55);
scene.add(key,rimL,hemi);

const ground=new THREE.Mesh(new THREE.CircleGeometry(9,48),new THREE.ShadowMaterial({opacity:0.35}));
ground.rotation.x=-Math.PI/2;ground.position.y=-2.85;ground.receiveShadow=true;scene.add(ground);

// ---------- loop ----------
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);});
</script>
</body>
</html>
