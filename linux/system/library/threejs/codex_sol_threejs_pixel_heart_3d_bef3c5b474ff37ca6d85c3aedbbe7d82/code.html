<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voxel Heart</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 38%, #302743 0%, #171321 52%, #09080d 100%);
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(9.5, 7.2, 13.5);
    camera.lookAt(0, 0.4, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x000000, 0);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.15;
    controls.enablePan = false;
    controls.minDistance = 9;
    controls.maxDistance = 24;
    controls.target.set(0, 0.35, 0);

    scene.add(new THREE.HemisphereLight(0xffd7dd, 0x241930, 1.65));

    const keyLight = new THREE.DirectionalLight(0xfff0e8, 4.2);
    keyLight.position.set(-7, 10, 9);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -9;
    keyLight.shadow.camera.right = 9;
    keyLight.shadow.camera.top = 9;
    keyLight.shadow.camera.bottom = -9;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 30;
    keyLight.shadow.bias = -0.0004;
    keyLight.shadow.normalBias = 0.025;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xff244f, 2.8);
    rimLight.position.set(8, 3, -7);
    scene.add(rimLight);

    const fillLight = new THREE.PointLight(0x738cff, 1.8, 25, 2);
    fillLight.position.set(-6, -1, 5);
    scene.add(fillLight);

    const heart = new THREE.Group();
    scene.add(heart);

    const silhouette = [
      "..##.##..",
      ".#######.",
      "#########",
      "#########",
      ".#######.",
      "..#####..",
      "...###...",
      "....#...."
    ];

    const voxelSize = 0.92;
    const gap = 0.075;
    const step = voxelSize + gap;
    const depthLayers = 2;
    const positions = [];

    for (let row = 0; row < silhouette.length; row++) {
      for (let col = 0; col < silhouette[row].length; col++) {
        if (silhouette[row][col] !== "#") continue;
        for (let layer = 0; layer < depthLayers; layer++) {
          positions.push({
            x: (col - 4) * step,
            y: (3.5 - row) * step,
            z: (layer - 0.5) * step,
            row,
            col,
            layer
          });
        }
      }
    }

    const cubeGeometry = new THREE.BoxGeometry(voxelSize, voxelSize, voxelSize);
    const cubeMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.34,
      metalness: 0.04
    });

    const voxels = new THREE.InstancedMesh(cubeGeometry, cubeMaterial, positions.length);
    voxels.castShadow = true;
    voxels.receiveShadow = true;
    voxels.instanceMatrix.setUsage(THREE.StaticDrawUsage);

    const matrix = new THREE.Matrix4();
    const color = new THREE.Color();

    positions.forEach((voxel, index) => {
      matrix.makeTranslation(voxel.x, voxel.y, voxel.z);
      voxels.setMatrixAt(index, matrix);

      const isHighlight = voxel.layer === 1 &&
        ((voxel.row === 1 && voxel.col === 2) ||
         (voxel.row === 2 && voxel.col === 1));

      const isUpperGlow = voxel.layer === 1 && voxel.row <= 2;
      const isRearLayer = voxel.layer === 0;

      if (isHighlight) {
        color.set(0xffa1a1);
      } else if (isUpperGlow) {
        color.set(0xff314d);
      } else if (isRearLayer) {
        color.set(0xb70828);
      } else {
        color.set(0xef0f36);
      }

      voxels.setColorAt(index, color);
    });

    voxels.instanceMatrix.needsUpdate = true;
    voxels.instanceColor.needsUpdate = true;
    heart.add(voxels);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(28, 28),
      new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.28 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -5.1;
    floor.receiveShadow = true;
    scene.add(floor);

    heart.rotation.set(-0.055, -0.22, -0.035);
    heart.position.y = 0.45;

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      heart.position.y = 0.45 + Math.sin(t * 1.65) * 0.18;
      heart.rotation.z = -0.035 + Math.sin(t * 1.15) * 0.025;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
