<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Crystal Cavern Lake</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02040b;
    }

    canvas {
      display: block;
    }

    .title {
      position: fixed;
      left: 28px;
      bottom: 24px;
      z-index: 2;
      color: rgba(218, 240, 255, 0.82);
      font: 500 12px/1.5 system-ui, sans-serif;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow:
        0 0 12px rgba(80, 210, 255, 0.75),
        0 0 28px rgba(155, 90, 255, 0.55);
    }

    .title span {
      display: block;
      margin-top: 4px;
      color: rgba(181, 199, 219, 0.48);
      font-size: 9px;
      letter-spacing: 0.18em;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          transparent 40%,
          rgba(0, 2, 8, 0.18) 68%,
          rgba(0, 1, 5, 0.68) 100%
        );
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="title">
    Crystal Cavern Lake
    <span>Drag to explore · Scroll to travel</span>
  </div>
  <div class="vignette"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Reflector } from 'three/addons/objects/Reflector.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x02040b);
    scene.fog = new THREE.FogExp2(0x07101b, 0.017);

    const camera = new THREE.PerspectiveCamera(
      52,
      window.innerWidth / window.innerHeight,
      0.1,
      220
    );
    camera.position.set(25, 14, 31);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 5, -2);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.22;
    controls.minDistance = 18;
    controls.maxDistance = 67;
    controls.maxPolarAngle = Math.PI * 0.48;

    let seed = 0xC0FFEE;

    function random() {
      seed |= 0;
      seed = seed + 0x6D2B79F5 | 0;
      let value = Math.imul(seed ^ seed >>> 15, 1 | seed);
      value = value + Math.imul(value ^ value >>> 7, 61 | value) ^ value;
      return ((value ^ value >>> 14) >>> 0) / 4294967296;
    }

    function range(min, max) {
      return min + (max - min) * random();
    }

    function integer(min, max) {
      return Math.floor(range(min, max + 1));
    }

    function choose(values) {
      return values[Math.floor(random() * values.length)];
    }

    const crystalColors = [
      0x9c5cff,
      0xc581ff,
      0x57ddff,
      0x48f4dc,
      0x6d83ff
    ];

    const animations = {
      crystals: [],
      lights: [],
      glowworms: [],
      drips: [],
      motes: []
    };

    function makeRockTexture() {
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext('2d');

      context.fillStyle = '#101721';
      context.fillRect(0, 0, size, size);

      const image = context.getImageData(0, 0, size, size);
      const data = image.data;

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const index = (x + y * size) * 4;
          const wave =
            Math.sin(x * 0.105) * 5 +
            Math.sin(y * 0.077) * 4 +
            Math.sin((x + y) * 0.035) * 5;
          const noise = range(-14, 14);
          const value = 21 + wave + noise;
          data[index] = value * 0.55;
          data[index + 1] = value * 0.72;
          data[index + 2] = value;
          data[index + 3] = 255;
        }
      }

      context.putImageData(image, 0, 0);

      for (let i = 0; i < 55; i++) {
        context.strokeStyle =
          `rgba(75,105,130,${range(0.025, 0.09)})`;
        context.lineWidth = range(0.5, 2.2);
        context.beginPath();
        context.moveTo(range(0, size), range(0, size));
        context.lineTo(range(0, size), range(0, size));
        context.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(8, 5);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    function makeGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const context = canvas.getContext('2d');
      const gradient = context.createRadialGradient(
        64,
        64,
        0,
        64,
        64,
        64
      );
      gradient.addColorStop(0, 'rgba(255,255,235,1)');
      gradient.addColorStop(0.08, 'rgba(175,255,240,1)');
      gradient.addColorStop(0.25, 'rgba(74,225,255,0.62)');
      gradient.addColorStop(0.58, 'rgba(92,105,255,0.14)');
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      context.fillStyle = gradient;
      context.fillRect(0, 0, 128, 128);
      return new THREE.CanvasTexture(canvas);
    }

    function makeCausticTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const context = canvas.getContext('2d');
      context.fillStyle = '#081721';
      context.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 85; i++) {
        const x = range(0, 512);
        const y = range(0, 512);
        const radius = range(18, 90);
        const gradient = context.createRadialGradient(
          x,
          y,
          0,
          x,
          y,
          radius
        );
        gradient.addColorStop(0, 'rgba(55,210,255,0.12)');
        gradient.addColorStop(0.55, 'rgba(25,120,180,0.035)');
        gradient.addColorStop(1, 'rgba(0,0,0,0)');
        context.fillStyle = gradient;
        context.beginPath();
        context.ellipse(
          x,
          y,
          radius,
          radius * range(0.12, 0.35),
          range(0, Math.PI),
          0,
          Math.PI * 2
        );
        context.fill();
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(3, 3);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }

    const rockTexture = makeRockTexture();
    const glowTexture = makeGlowTexture();
    const causticTexture = makeCausticTexture();

    const cavernMaterial = new THREE.MeshStandardMaterial({
      color: 0x15202d,
      map: rockTexture,
      roughness: 0.93,
      metalness: 0.05,
      side: THREE.BackSide
    });

    const cavern = new THREE.Mesh(
      new THREE.SphereGeometry(55, 48, 28),
      cavernMaterial
    );
    cavern.scale.set(1.35, 0.65, 1);
    cavern.position.y = 10;
    cavern.receiveShadow = true;
    scene.add(cavern);

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x111923,
      map: rockTexture,
      roughness: 0.88,
      metalness: 0.12
    });

    const groundGeometry = new THREE.CircleGeometry(48, 80);
    const positions = groundGeometry.attributes.position;

    for (let i = 0; i < positions.count; i++) {
      const x = positions.getX(i);
      const y = positions.getY(i);
      const radius = Math.sqrt(x * x + y * y);
      const height =
        Math.sin(x * 0.36) * 0.42 +
        Math.cos(y * 0.31) * 0.35 +
        Math.sin((x + y) * 0.18) * 0.55 +
        Math.max(0, radius - 24) * 0.13;
      positions.setZ(i, height);
    }

    groundGeometry.computeVertexNormals();

    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.85;
    ground.receiveShadow = true;
    scene.add(ground);

    const lakeShape = new THREE.Shape();
    const lakePoints = [];

    for (let i = 0; i < 72; i++) {
      const angle = i / 72 * Math.PI * 2;
      const radius =
        13.5 +
        Math.sin(angle * 3) * 1.2 +
        Math.cos(angle * 5) * 0.65;
      lakePoints.push(
        new THREE.Vector2(
          Math.cos(angle) * radius * 1.42,
          Math.sin(angle) * radius * 0.72
        )
      );
    }

    lakeShape.setFromPoints(lakePoints);

    const lakeGeometry = new THREE.ShapeGeometry(lakeShape, 28);
    lakeGeometry.rotateX(-Math.PI / 2);

    const lake = new Reflector(lakeGeometry, {
      textureWidth:
        Math.floor(window.innerWidth * Math.min(window.devicePixelRatio, 1.5)),
      textureHeight:
        Math.floor(window.innerHeight * Math.min(window.devicePixelRatio, 1.5)),
      clipBias: 0.003,
      color: 0x173a4a
    });
    lake.position.y = -0.3;
    lake.renderOrder = 1;
    scene.add(lake);

    const lakeSurfaceMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x1a6073,
      map: causticTexture,
      transparent: true,
      opacity: 0.17,
      roughness: 0.07,
      metalness: 0.08,
      transmission: 0.1,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });

    const lakeSurface = new THREE.Mesh(
      lakeGeometry.clone(),
      lakeSurfaceMaterial
    );
    lakeSurface.position.y = -0.27;
    lakeSurface.renderOrder = 2;
    scene.add(lakeSurface);

    function crystalGeometry(radius, height, sides = 6) {
      const bodyHeight = height * 0.72;
      const geometry = new THREE.CylinderGeometry(
        radius * 0.86,
        radius,
        bodyHeight,
        sides,
        1,
        false
      );
      const tip = new THREE.ConeGeometry(
        radius * 0.86,
        height - bodyHeight,
        sides,
        1,
        false
      );
      tip.translate(0, height * 0.5, 0);
      geometry.translate(0, -height * 0.14, 0);
      return [geometry, tip];
    }

    function makeCrystal(
      parent,
      position,
      radius,
      height,
      color,
      tilt = 0,
      rotation = 0
    ) {
      const group = new THREE.Group();
      const sides = integer(5, 7);
      const parts = crystalGeometry(radius, height, sides);

      const shellMaterial = new THREE.MeshPhysicalMaterial({
        color,
        emissive: color,
        emissiveIntensity: 0.25,
        roughness: 0.16,
        metalness: 0.08,
        transmission: 0.3,
        thickness: 1.4,
        transparent: true,
        opacity: 0.88,
        clearcoat: 0.8,
        clearcoatRoughness: 0.12,
        side: THREE.DoubleSide
      });

      const innerMaterial = new THREE.MeshBasicMaterial({
        color,
        transparent: true,
        opacity: 0.24,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      for (const geometry of parts) {
        const shell = new THREE.Mesh(geometry, shellMaterial);
        shell.castShadow = true;
        shell.receiveShadow = true;
        group.add(shell);

        const inner = new THREE.Mesh(
          geometry.clone(),
          innerMaterial
        );
        inner.scale.set(0.56, 0.96, 0.56);
        group.add(inner);
      }

      const core = new THREE.Mesh(
        new THREE.CylinderGeometry(
          radius * 0.16,
          radius * 0.32,
          height * 0.72,
          sides
        ),
        new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: 0.38,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      core.position.y = -height * 0.05;
      group.add(core);

      group.position.copy(position);
      group.rotation.order = 'YXZ';
      group.rotation.y = rotation;
      group.rotation.z = tilt;
      group.userData.baseY = position.y;
      parent.add(group);

      animations.crystals.push({
        material: shellMaterial,
        innerMaterial,
        core: core.material,
        phase: range(0, Math.PI * 2),
        speed: range(0.35, 0.72),
        baseIntensity: range(0.18, 0.34)
      });

      return group;
    }

    function makeCluster(
      x,
      y,
      z,
      scale,
      colors,
      count,
      spread = 2.4
    ) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      scene.add(group);

      for (let i = 0; i < count; i++) {
        const central = i === 0;
        const angle = range(0, Math.PI * 2);
        const distance = central ? 0 : range(0.35, spread);
        const height = central
          ? range(9, 13) * scale
          : range(2.8, 8.5) * scale;
        const radius = height * range(0.085, 0.14);
        const localPosition = new THREE.Vector3(
          Math.cos(angle) * distance * scale,
          height * 0.5 - 0.1,
          Math.sin(angle) * distance * scale
        );

        makeCrystal(
          group,
          localPosition,
          radius,
          height,
          choose(colors),
          central ? range(-0.05, 0.05) : range(-0.35, 0.35),
          range(0, Math.PI * 2)
        );
      }

      const glowColor = new THREE.Color(choose(colors));
      const light = new THREE.PointLight(
        glowColor,
        30 * scale,
        18 * scale,
        2
      );
      light.position.set(0, 3.5 * scale, 0);
      light.castShadow = scale > 0.85;
      light.shadow.mapSize.set(512, 512);
      light.shadow.bias = -0.001;
      group.add(light);

      animations.lights.push({
        light,
        phase: range(0, Math.PI * 2),
        baseHue: glowColor.getHSL({}).h,
        intensity: light.intensity
      });

      return group;
    }

    makeCluster(
      -13,
      -0.6,
      -8,
      1.28,
      [0x8d52ff, 0xc069ff, 0x6f51ff],
      12,
      3.3
    );

    makeCluster(
      14,
      -0.65,
      -5,
      1.12,
      [0x3debd7, 0x56d5ff, 0x3e8dff],
      11,
      3.1
    );

    makeCluster(
      -20,
      -0.65,
      8,
      0.82,
      [0x955aff, 0x4d7fff],
      8,
      2.5
    );

    makeCluster(
      20,
      -0.65,
      10,
      0.72,
      [0x53e9ea, 0x73a3ff],
      8,
      2.4
    );

    makeCluster(
      4,
      -0.65,
      -17,
      0.66,
      [0xa968ff, 0x54dfff],
      7,
      2
    );

    function makeBridge() {
      const bridge = new THREE.Group();
      bridge.position.set(0, 0, 1);
      scene.add(bridge);

      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-17, 0.25, 3),
        new THREE.Vector3(-9, 2.6, 1.2),
        new THREE.Vector3(0, 4.2, 0),
        new THREE.Vector3(9, 2.6, -1.2),
        new THREE.Vector3(17, 0.25, -3)
      ]);

      const bridgeMaterial = new THREE.MeshPhysicalMaterial({
        color: 0x657789,
        emissive: 0x19283b,
        emissiveIntensity: 0.35,
        roughness: 0.28,
        metalness: 0.28,
        clearcoat: 0.48
      });

      const underside = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 96, 1.18, 7, false),
        bridgeMaterial
      );
      underside.scale.y = 0.64;
      underside.castShadow = true;
      underside.receiveShadow = true;
      bridge.add(underside);

      const railMaterial = new THREE.MeshPhysicalMaterial({
        color: 0x75cff5,
        emissive: 0x288ac2,
        emissiveIntensity: 0.8,
        transparent: true,
        opacity: 0.74,
        roughness: 0.18,
        transmission: 0.22
      });

      for (const side of [-1, 1]) {
        const railPoints = [];

        for (let i = 0; i <= 48; i++) {
          const t = i / 48;
          const point = curve.getPoint(t);
          railPoints.push(
            new THREE.Vector3(
              point.x,
              point.y + 1.05,
              point.z + side * 1.18
            )
          );
        }

        const railCurve = new THREE.CatmullRomCurve3(railPoints);
        const rail = new THREE.Mesh(
          new THREE.TubeGeometry(railCurve, 64, 0.09, 6, false),
          railMaterial
        );
        rail.castShadow = true;
        bridge.add(rail);
      }

      for (let i = 1; i < 16; i++) {
        const t = i / 16;
        const point = curve.getPoint(t);
        const tangent = curve.getTangent(t);

        for (const side of [-1, 1]) {
          const post = new THREE.Mesh(
            new THREE.CylinderGeometry(0.1, 0.16, 1.35, 6),
            railMaterial
          );
          post.position.set(
            point.x,
            point.y + 0.58,
            point.z + side * 1.15
          );
          post.rotation.z = -tangent.x * 0.06;
          post.castShadow = true;
          bridge.add(post);
        }

        if (i % 2 === 0) {
          const shard = makeCrystal(
            bridge,
            new THREE.Vector3(
              point.x,
              point.y + 0.45,
              point.z + choose([-1, 1]) * 1.3
            ),
            0.14,
            range(0.8, 1.7),
            choose([0x58dfff, 0xa16aff]),
            range(-0.25, 0.25),
            range(0, Math.PI * 2)
          );
          shard.scale.setScalar(0.85);
        }
      }
    }

    makeBridge();

    const stalactiteMaterial = new THREE.MeshStandardMaterial({
      color: 0x26313c,
      map: rockTexture,
      roughness: 0.82,
      metalness: 0.18
    });

    function makeStalactite(x, z, length, radius) {
      const group = new THREE.Group();
      group.position.set(x, 23 + range(-1.5, 1.5), z);

      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(radius, length, integer(6, 9), 3),
        stalactiteMaterial
      );
      cone.position.y = -length * 0.5;
      cone.rotation.x = Math.PI;
      cone.castShadow = true;
      cone.receiveShadow = true;
      group.add(cone);

      if (random() > 0.55) {
        const mineral = new THREE.Mesh(
          new THREE.ConeGeometry(radius * 0.55, length * 0.8, 6),
          new THREE.MeshPhysicalMaterial({
            color: choose(crystalColors),
            emissive: choose(crystalColors),
            emissiveIntensity: 0.22,
            transparent: true,
            opacity: 0.56,
            roughness: 0.24
          })
        );
        mineral.position.y = -length * 0.55;
        mineral.rotation.x = Math.PI;
        group.add(mineral);
      }

      if (random() > 0.62) {
        const dropMaterial = new THREE.MeshBasicMaterial({
          color: 0x8deaff,
          transparent: true,
          opacity: 0.72
        });
        const drop = new THREE.Mesh(
          new THREE.SphereGeometry(0.08, 10, 8),
          dropMaterial
        );
        drop.scale.y = 1.8;
        group.add(drop);

        animations.drips.push({
          drop,
          startY: -length - 0.2,
          distance: group.position.y - 0.2,
          phase: random(),
          speed: range(0.09, 0.18)
        });
      }

      scene.add(group);
    }

    for (let i = 0; i < 34; i++) {
      const angle = range(0, Math.PI * 2);
      const radius = range(5, 39);
      makeStalactite(
        Math.cos(angle) * radius * 1.18,
        Math.sin(angle) * radius * 0.78,
        range(2.5, 9.5),
        range(0.45, 1.7)
      );
    }

    function scatterShards() {
      const shardGroup = new THREE.Group();
      scene.add(shardGroup);

      for (let i = 0; i < 92; i++) {
        const angle = range(0, Math.PI * 2);
        const radius = range(15, 40);
        const x = Math.cos(angle) * radius * 1.16;
        const z = Math.sin(angle) * radius * 0.78;

        if (Math.abs(x) < 18 && Math.abs(z) < 9) {
          continue;
        }

        const height = range(0.3, 2.1);
        const color = choose(crystalColors);
        const geometry = new THREE.ConeGeometry(
          height * range(0.08, 0.18),
          height,
          integer(4, 6)
        );
        const material = new THREE.MeshStandardMaterial({
          color,
          emissive: color,
          emissiveIntensity: range(0.16, 0.55),
          roughness: 0.25,
          metalness: 0.15
        });
        const shard = new THREE.Mesh(geometry, material);
        shard.position.set(x, height * 0.5 - 0.55, z);
        shard.rotation.z = range(-0.55, 0.55);
        shard.rotation.y = range(0, Math.PI * 2);
        shard.castShadow = true;
        shardGroup.add(shard);
      }
    }

    scatterShards();

    function makeGlowworms() {
      const group = new THREE.Group();
      scene.add(group);

      const constellations = [
        [-16, -7],
        [-6, -14],
        [7, -13],
        [17, -5],
        [12, 8],
        [-11, 10]
      ];

      for (let c = 0; c < constellations.length; c++) {
        const center = constellations[c];
        const count = integer(12, 23);

        for (let i = 0; i < count; i++) {
          const material = new THREE.SpriteMaterial({
            map: glowTexture,
            color: choose([0x80ffe4, 0x7bd9ff, 0xc4ff86]),
            transparent: true,
            opacity: range(0.42, 0.95),
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          const sprite = new THREE.Sprite(material);
          sprite.position.set(
            center[0] + range(-5.5, 5.5),
            range(17.5, 22.5),
            center[1] + range(-4.2, 4.2)
          );
          const size = range(0.16, 0.52);
          sprite.scale.set(size, size, 1);
          group.add(sprite);

          animations.glowworms.push({
            sprite,
            material,
            baseY: sprite.position.y,
            baseOpacity: material.opacity,
            phase: range(0, Math.PI * 2),
            speed: range(0.7, 1.8),
            drift: range(0.03, 0.12)
          });
        }
      }
    }

    makeGlowworms();

    function makeMotes() {
      const geometry = new THREE.BufferGeometry();
      const count = 450;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const color = new THREE.Color();

      for (let i = 0; i < count; i++) {
        const radius = range(3, 42);
        const angle = range(0, Math.PI * 2);
        positions[i * 3] = Math.cos(angle) * radius;
        positions[i * 3 + 1] = range(0.3, 18);
        positions[i * 3 + 2] = Math.sin(angle) * radius * 0.7;

        color.set(choose([0x74dcff, 0xb884ff, 0x72ffe1]));
        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
      }

      geometry.setAttribute(
        'position',
        new THREE.BufferAttribute(positions, 3)
      );
      geometry.setAttribute(
        'color',
        new THREE.BufferAttribute(colors, 3)
      );

      const material = new THREE.PointsMaterial({
        size: 0.09,
        vertexColors: true,
        transparent: true,
        opacity: 0.62,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const points = new THREE.Points(geometry, material);
      scene.add(points);
      animations.motes.push({
        points,
        geometry,
        base: positions.slice()
      });
    }

    makeMotes();

    const hemiLight = new THREE.HemisphereLight(
      0x35558a,
      0x090711,
      0.7
    );
    scene.add(hemiLight);

    const moonLight = new THREE.DirectionalLight(
      0x89b8ff,
      1.45
    );
    moonLight.position.set(-12, 23, 11);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.set(1024, 1024);
    moonLight.shadow.camera.left = -32;
    moonLight.shadow.camera.right = 32;
    moonLight.shadow.camera.top = 32;
    moonLight.shadow.camera.bottom = -32;
    moonLight.shadow.camera.near = 1;
    moonLight.shadow.camera.far = 80;
    moonLight.shadow.bias = -0.0004;
    scene.add(moonLight);

    const cavernPulse = new THREE.PointLight(
      0x7355ff,
      36,
      48,
      2
    );
    cavernPulse.position.set(0, 11, -7);
    scene.add(cavernPulse);

    const rimLight = new THREE.SpotLight(
      0x39e5e2,
      48,
      70,
      Math.PI * 0.2,
      0.65,
      1.4
    );
    rimLight.position.set(20, 19, 15);
    rimLight.target.position.set(-7, 1, -5);
    rimLight.castShadow = true;
    rimLight.shadow.mapSize.set(512, 512);
    scene.add(rimLight);
    scene.add(rimLight.target);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();

      for (const crystal of animations.crystals) {
        const pulse =
          0.82 +
          Math.sin(
            elapsed * crystal.speed + crystal.phase
          ) * 0.18;
        crystal.material.emissiveIntensity =
          crystal.baseIntensity * pulse;
        crystal.innerMaterial.opacity = 0.19 + pulse * 0.1;
        crystal.core.opacity = 0.26 + pulse * 0.16;
      }

      for (let i = 0; i < animations.lights.length; i++) {
        const entry = animations.lights[i];
        const wave = Math.sin(elapsed * 0.46 + entry.phase);
        const hue =
          (entry.baseHue + elapsed * 0.006 + wave * 0.018 + 1) % 1;
        entry.light.color.setHSL(hue, 0.78, 0.62);
        entry.light.intensity =
          entry.intensity * (0.82 + wave * 0.18);
      }

      cavernPulse.color.setHSL(
        (0.68 + elapsed * 0.012) % 1,
        0.78,
        0.57
      );
      cavernPulse.intensity =
        30 + Math.sin(elapsed * 0.5) * 7;

      rimLight.color.setHSL(
        (0.49 + elapsed * 0.008) % 1,
        0.78,
        0.62
      );
      rimLight.intensity =
        43 + Math.sin(elapsed * 0.38 + 1.7) * 8;

      for (const worm of animations.glowworms) {
        const wave = Math.sin(
          elapsed * worm.speed + worm.phase
        );
        worm.material.opacity =
          worm.baseOpacity * (0.58 + wave * 0.42);
        worm.sprite.position.y =
          worm.baseY + Math.sin(
            elapsed * worm.drift * 8 + worm.phase
          ) * 0.15;
        const scale = 0.9 + wave * 0.16;
        worm.sprite.scale.setScalar(
          Math.max(0.04, worm.sprite.scale.x * 0.98 + scale * 0.02)
        );
      }

      for (const drip of animations.drips) {
        const progress =
          (drip.phase + elapsed * drip.speed) % 1;
        drip.drop.position.y =
          drip.startY - progress * drip.distance;
        drip.drop.material.opacity =
          Math.sin(progress * Math.PI) * 0.72;
        drip.drop.scale.y = 1.2 + progress * 1.7;
      }

      for (const moteSystem of animations.motes) {
        const position =
          moteSystem.geometry.attributes.position;
        const base = moteSystem.base;

        for (let i = 0; i < position.count; i++) {
          const offset = i * 3;
          position.array[offset] =
            base[offset] +
            Math.sin(elapsed * 0.12 + i * 0.73) * 0.16;
          position.array[offset + 1] =
            base[offset + 1] +
            Math.sin(elapsed * 0.18 + i * 0.37) * 0.32;
          position.array[offset + 2] =
            base[offset + 2] +
            Math.cos(elapsed * 0.1 + i * 0.51) * 0.14;
        }

        position.needsUpdate = true;
        moteSystem.points.rotation.y = elapsed * 0.008;
      }

      causticTexture.offset.x = elapsed * 0.006;
      causticTexture.offset.y =
        Math.sin(elapsed * 0.08) * 0.02;
      lakeSurfaceMaterial.opacity =
        0.145 + Math.sin(elapsed * 0.42) * 0.025;

      controls.update();
      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect =
        window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
      );
      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    }

    window.addEventListener('resize', onResize);
    animate();
  </script>
</body>
</html>
