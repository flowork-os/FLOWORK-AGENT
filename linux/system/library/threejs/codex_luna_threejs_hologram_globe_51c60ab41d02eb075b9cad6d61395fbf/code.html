<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holographic Earth</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020812}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020812);
scene.fog = new THREE.FogExp2(0x020812, 0.035);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.8, 3.8, 7.2);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 4.1;
controls.maxDistance = 12;
controls.target.set(0, 1.9, 0);

scene.add(new THREE.AmbientLight(0x17364a, 1.2));
const cyanLight = new THREE.PointLight(0x21dfff, 10, 10, 2);
cyanLight.position.set(0, 2.1, 0.7);
scene.add(cyanLight);

const hologram = new THREE.Group();
scene.add(hologram);

const cyan = new THREE.LineBasicMaterial({
  color:0x36eaff,
  transparent:true,
  opacity:0.5,
  blending:THREE.AdditiveBlending,
  depthWrite:false
});
const brightCyan = new THREE.LineBasicMaterial({
  color:0x9cffff,
  transparent:true,
  opacity:0.9,
  blending:THREE.AdditiveBlending,
  depthWrite:false
});
const paleCyan = new THREE.LineBasicMaterial({
  color:0x58c9dc,
  transparent:true,
  opacity:0.27,
  blending:THREE.AdditiveBlending,
  depthWrite:false
});

const earth = new THREE.Group();
earth.position.y = 2.55;
hologram.add(earth);

const globeRadius = 1.58;

function spherePoint(lon, lat, radius = globeRadius) {
  const a = THREE.MathUtils.degToRad(lon);
  const b = THREE.MathUtils.degToRad(lat);
  return new THREE.Vector3(
    radius * Math.cos(b) * Math.sin(a),
    radius * Math.sin(b),
    radius * Math.cos(b) * Math.cos(a)
  );
}

function createLatitude(lat, segments = 128) {
  const points = [];
  const r = globeRadius * 1.002;
  for (let i=0;i<=segments;i++) {
    const lon = i / segments * 360;
    points.push(spherePoint(lon, lat, r));
  }
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), Math.abs(lat) < 1 ? brightCyan : cyan);
}

function createLongitude(lon, segments = 128) {
  const points = [];
  const r = globeRadius * 1.003;
  for (let i=0;i<=segments;i++) {
    const lat = -90 + i / segments * 180;
    points.push(spherePoint(lon, lat, r));
  }
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), Math.abs(((lon+180)%30)-15) < 1 ? brightCyan : cyan);
}

for (let lat=-75; lat<=75; lat+=15) earth.add(createLatitude(lat));
for (let lon=0; lon<360; lon+=15) earth.add(createLongitude(lon));

const globeShell = new THREE.Mesh(
  new THREE.SphereGeometry(globeRadius * 0.996, 64, 32),
  new THREE.ShaderMaterial({
    transparent:true,
    blending:THREE.AdditiveBlending,
    depthWrite:false,
    side:THREE.BackSide,
    uniforms:{color:{value:new THREE.Color(0x05aeca)}, glow:{value:1.8}},
    vertexShader:`
      varying vec3 vNormal;
      varying vec3 vWorldPosition;
      void main(){
        vNormal=normalize(normalMatrix*normal);
        vec4 world=modelMatrix*vec4(position,1.0);
        vWorldPosition=world.xyz;
        gl_Position=projectionMatrix*viewMatrix*world;
      }
    `,
    fragmentShader:`
      uniform vec3 color;
      uniform float glow;
      varying vec3 vNormal;
      varying vec3 vWorldPosition;
      void main(){
        vec3 viewDir=normalize(cameraPosition-vWorldPosition);
        float rim=pow(1.0-max(dot(vNormal,viewDir),0.0),glow);
        gl_FragColor=vec4(color,rim*0.32);
      }
    `
  })
);
earth.add(globeShell);

const continents = [
  [[-168,62],[-150,68],[-126,70],[-111,61],[-98,52],[-91,43],[-83,31],[-101,24],[-116,29],[-128,42],[-146,48]],
  [[-81,12],[-72,8],[-64,-2],[-60,-17],[-67,-35],[-75,-54],[-82,-42],[-88,-19]],
  [[-16,37],[-5,43],[10,45],[26,40],[35,31],[31,20],[19,12],[6,5],[-8,12],[-18,25]],
  [[35,30],[49,28],[63,24],[78,28],[91,23],[108,18],[126,7],[140,15],[153,5],[145,-7],[126,-3],[112,5],[98,4],[83,9],[68,5],[54,11],[43,20]],
  [[112,-11],[132,-12],[151,-23],[153,-37],[137,-40],[119,-31]],
  [[-8,54],[2,58],[19,58],[29,68],[19,78],[2,74],[-12,65]],
  [[-180,-72],[-135,-73],[-83,-72],[-31,-75],[25,-72],[81,-74],[137,-71],[179,-73]]
];

for (const shape of continents) {
  const points = shape.map(p => spherePoint(p[0], p[1], globeRadius * 1.009));
  points.push(points[0].clone());
  earth.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), paleCyan));
}

const meridianAccent = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(
    Array.from({length:129},(_,i)=>spherePoint(42,-90+i/128*180,globeRadius*1.008))
  ),
  brightCyan
);
meridianAccent.material.opacity = 0.52;
earth.add(meridianAccent);

const orbitalRings = new THREE.Group();
orbitalRings.position.y = 2.55;
hologram.add(orbitalRings);

function ring(radius, rotation, opacity, color=0x35e7ff) {
  const m = new THREE.LineBasicMaterial({
    color, transparent:true, opacity,
    blending:THREE.AdditiveBlending, depthWrite:false
  });
  const g = new THREE.BufferGeometry().setFromPoints(
    Array.from({length:193},(_,i)=>{
      const a=i/192*Math.PI*2;
      return new THREE.Vector3(Math.cos(a)*radius,0,Math.sin(a)*radius).applyEuler(rotation);
    })
  );
  return new THREE.Line(g,m);
}
orbitalRings.add(ring(1.82,new THREE.Euler(0.35,0.1,0.15),0.33));
orbitalRings.add(ring(1.95,new THREE.Euler(-0.25,0.5,-0.32),0.2));
orbitalRings.add(ring(2.18,new THREE.Euler(Math.PI/2,0,0),0.14));

const emitter = new THREE.Group();
hologram.add(emitter);

const baseMaterial = new THREE.MeshStandardMaterial({
  color:0x06131d,
  metalness:0.9,
  roughness:0.28,
  emissive:0x063849,
  emissiveIntensity:1.25
});
const base = new THREE.Mesh(new THREE.CylinderGeometry(1.27,1.42,0.27,96),baseMaterial);
base.position.y=0.23;
base.castShadow=true;
base.receiveShadow=true;
emitter.add(base);

const topDisc = new THREE.Mesh(
  new THREE.CylinderGeometry(1.08,1.08,0.035,96),
  new THREE.MeshBasicMaterial({color:0x0b5369,transparent:true,opacity:0.8,blending:THREE.AdditiveBlending})
);
topDisc.position.y=0.39;
emitter.add(topDisc);

for (const [r,y,o] of [[1.38,0.38,0.38],[1.12,0.415,0.7],[0.78,0.44,0.48]]) {
  const q=ring(r,new THREE.Euler(0,0,0),o);
  q.position.y=y;
  emitter.add(q);
}

const cone = new THREE.Mesh(
  new THREE.ConeGeometry(1.05,1.72,96,1,true),
  new THREE.ShaderMaterial({
    transparent:true,
    depthWrite:false,
    blending:THREE.AdditiveBlending,
    side:THREE.DoubleSide,
    uniforms:{color:{value:new THREE.Color(0x11dfff)}},
    vertexShader:`
      varying float vY;
      void main(){
        vY=uv.y;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);
      }
    `,
    fragmentShader:`
      uniform vec3 color;
      varying float vY;
      void main(){
        float edge=smoothstep(0.0,0.24,vY)*smoothstep(1.0,0.7,vY);
        float pulse=0.72+0.28*sin(vY*38.0);
        gl_FragColor=vec4(color,edge*0.095*pulse);
      }
    `
  })
);
cone.position.y=1.27;
emitter.add(cone);

const beamRing = ring(0.76,new THREE.Euler(0,0,0),0.85,0x9cffff);
beamRing.position.y=2.1;
hologram.add(beamRing);

const core = new THREE.Mesh(
  new THREE.SphereGeometry(0.065,24,16),
  new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending})
);
core.position.set(0,0.46,0);
emitter.add(core);

const shadowLight = new THREE.SpotLight(0x1fe5ff, 18, 8, 0.5, 0.7, 1.5);
shadowLight.position.set(0,4,1);
shadowLight.target=base;
shadowLight.castShadow=true;
shadowLight.shadow.mapSize.set(1024,1024);
scene.add(shadowLight);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(7,96),
  new THREE.MeshBasicMaterial({color:0x020914,transparent:true,opacity:0.78})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=0.06;
floor.receiveShadow=true;
scene.add(floor);

const floorGlow = ring(2.55,new THREE.Euler(0,0,0),0.15,0x087b9d);
floorGlow.position.y=0.075;
scene.add(floorGlow);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  earth.rotation.y=t*0.075;
  orbitalRings.rotation.y=-t*0.11;
  orbitalRings.rotation.z=Math.sin(t*0.22)*0.035;
  beamRing.material.opacity=0.58+Math.sin(t*3.2)*0.22;
  core.scale.setScalar(1+Math.sin(t*4.5)*0.12);
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
