<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberpunk Nano Katana</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #03050a; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03050a);
scene.fog = new THREE.Fog(0x03050a, 8, 18);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.4, 3.8, 8.4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 5;
controls.maxDistance = 14;
controls.target.set(0, 0, 0);

const cyan = new THREE.Color(0x00eaff);
const magenta = new THREE.Color(0xff168f);
const cyanMat = new THREE.MeshStandardMaterial({
  color: 0x00aabd, emissive: 0x00dff5, emissiveIntensity: 5,
  metalness: 0.55, roughness: 0.22
});
const magentaMat = new THREE.MeshStandardMaterial({
  color: 0xc51070, emissive: 0xff087f, emissiveIntensity: 6,
  metalness: 0.25, roughness: 0.2
});
const blackMat = new THREE.MeshStandardMaterial({
  color: 0x080d13, metalness: 0.72, roughness: 0.3
});
const edgeMat = new THREE.MeshStandardMaterial({
  color: 0x122630, emissive: 0x00d9f5, emissiveIntensity: 3.8,
  metalness: 0.65, roughness: 0.25
});
const steelMat = new THREE.MeshStandardMaterial({
  color: 0x394652, metalness: 0.9, roughness: 0.25
});
const leatherMat = new THREE.MeshStandardMaterial({
  color: 0x4d101b, roughness: 0.82, metalness: 0.08
});
const leatherDarkMat = new THREE.MeshStandardMaterial({
  color: 0x18070c, roughness: 0.9, metalness: 0.05
});

const katana = new THREE.Group();
katana.position.x = -2.25;
katana.rotation.z = 0.035;
katana.rotation.y = -0.1;
scene.add(katana);

function addMesh(geometry, material, position = [0, 0, 0], rotation = [0, 0, 0], parent = katana) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(...position);
  mesh.rotation.set(...rotation);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

const bladeShape = new THREE.Shape();
bladeShape.moveTo(0, -0.115);
bladeShape.lineTo(1.2, -0.105);
bladeShape.lineTo(2.5, -0.092);
bladeShape.lineTo(3.85, -0.078);
bladeShape.lineTo(5.15, -0.063);
bladeShape.lineTo(6.18, -0.035);
bladeShape.lineTo(6.35, 0);
bladeShape.lineTo(6.17, 0.047);
bladeShape.lineTo(5.1, 0.082);
bladeShape.lineTo(3.75, 0.105);
bladeShape.lineTo(2.35, 0.12);
bladeShape.lineTo(1.1, 0.13);
bladeShape.lineTo(0, 0.135);
bladeShape.closePath();

const blade = addMesh(
  new THREE.ExtrudeGeometry(bladeShape, { depth: 0.105, bevelEnabled: false, curveSegments: 6 }),
  blackMat,
  [0, 0, -0.0525]
);

const bladeSpine = addMesh(
  new THREE.BoxGeometry(5.95, 0.018, 0.026),
  new THREE.MeshStandardMaterial({ color: 0x26333c, metalness: 0.8, roughness: 0.28 }),
  [3.02, 0.115, 0.008]
);

const edgeCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.02, -0.125, 0.07),
  new THREE.Vector3(1.2, -0.115, 0.07),
  new THREE.Vector3(2.5, -0.102, 0.07),
  new THREE.Vector3(3.85, -0.088, 0.07),
  new THREE.Vector3(5.15, -0.073, 0.07),
  new THREE.Vector3(6.25, -0.043, 0.07)
]);
addMesh(new THREE.TubeGeometry(edgeCurve, 72, 0.018, 6, false), cyanMat);

const circuitCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.15, -0.075, 0.072),
  new THREE.Vector3(1.25, -0.068, 0.072),
  new THREE.Vector3(2.45, -0.058, 0.072),
  new THREE.Vector3(3.7, -0.047, 0.072),
  new THREE.Vector3(4.9, -0.041, 0.072),
  new THREE.Vector3(6.05, -0.025, 0.072)
]);
addMesh(new THREE.TubeGeometry(circuitCurve, 64, 0.008, 5, false), cyanMat);

for (let i = 0; i < 18; i++) {
  const x = 0.18 + i * 0.335;
  const y = -0.12 + (x / 6.35) * 0.075;
  addMesh(new THREE.BoxGeometry(0.045, 0.045, 0.022), cyanMat, [x, y, 0.075]);
  if (i % 3 === 1) {
    addMesh(new THREE.BoxGeometry(0.12, 0.012, 0.018), cyanMat, [x + 0.04, y + 0.028, 0.075], [0, 0, -0.28]);
  }
}

const decalMat = new THREE.LineBasicMaterial({ color: 0x6bffff, transparent: true, opacity: 0.86 });
function addDecal(points) {
  const geometry = new THREE.BufferGeometry().setFromPoints(points.map(p => new THREE.Vector3(p[0], p[1], 0.081)));
  katana.add(new THREE.Line(geometry, decalMat));
}
addDecal([[1.0, 0.075], [1.16, 0.075], [1.24, 0.045], [1.48, 0.045]]);
addDecal([[2.05, 0.09], [2.2, 0.09], [2.28, 0.055], [2.52, 0.055]]);
addDecal([[3.25, 0.075], [3.42, 0.075], [3.5, 0.042], [3.78, 0.042]]);
addDecal([[4.48, 0.055], [4.65, 0.055], [4.74, 0.025], [5.0, 0.025]]);

const tsubaX = -0.12;
addMesh(new THREE.CylinderGeometry(0.44, 0.44, 0.13, 16), steelMat, [tsubaX, 0, 0], [0, 0, Math.PI / 2]);
addMesh(new THREE.CylinderGeometry(0.32, 0.32, 0.145, 12), blackMat, [tsubaX, 0, 0], [0, 0, Math.PI / 2]);

for (let i = 0; i < 8; i++) {
  const a = i * Math.PI / 4 + Math.PI / 8;
  addMesh(
    new THREE.BoxGeometry(0.18, 0.16, 0.07),
    blackMat,
    [tsubaX, Math.sin(a) * 0.425, Math.cos(a) * 0.425],
    [a, 0, 0]
  );
}

addMesh(new THREE.CylinderGeometry(0.075, 0.075, 0.035, 20), magentaMat, [tsubaX - 0.078, 0.27, 0], [0, 0, Math.PI / 2]);
addMesh(new THREE.CylinderGeometry(0.035, 0.035, 0.04, 16), cyanMat, [tsubaX - 0.1, -0.2, 0.18], [0, 0, Math.PI / 2]);

const core = addMesh(new THREE.CylinderGeometry(0.185, 0.185, 1.5, 6), blackMat, [-0.92, 0, 0], [0, 0, Math.PI / 2]);

for (let i = 0; i < 10; i++) {
  const x = -1.59 + i * 0.145;
  const wrap = addMesh(new THREE.TorusGeometry(0.205, 0.035, 8, 16), leatherMat, [x, 0, 0], [0, Math.PI / 2, 0]);
  wrap.scale.y = 0.88;
  if (i % 2 === 0) wrap.material = leatherDarkMat;
}

for (let i = 0; i < 7; i++) {
  const x = -1.5 + i * 0.19;
  addMesh(new THREE.BoxGeometry(0.13, 0.018, 0.018), leatherDarkMat, [x, 0.18, 0.11], [0, 0, 0.55]);
}

addMesh(new THREE.CylinderGeometry(0.235, 0.19, 0.18, 8), steelMat, [-1.76, 0, 0], [0, 0, Math.PI / 2]);
addMesh(new THREE.CylinderGeometry(0.14, 0.14, 0.07, 8), magentaMat, [-1.87, 0, 0], [0, 0, Math.PI / 2]);

const cablePoints = [];
for (let i = 0; i <= 40; i++) {
  const t = i / 40;
  const x = -1.9 + t * 0.72;
  const angle = t * Math.PI * 4.2;
  cablePoints.push(new THREE.Vector3(x, Math.cos(angle) * 0.245, Math.sin(angle) * 0.245));
}
const cableCurve = new THREE.CatmullRomCurve3(cablePoints);
addMesh(new THREE.TubeGeometry(cableCurve, 100, 0.012, 6, false), cyanMat);

const holoMat = new THREE.MeshBasicMaterial({
  color: 0xff2db4, transparent: true, opacity: 0.58,
  side: THREE.DoubleSide, blending: THREE.AdditiveBlending
});
addMesh(new THREE.PlaneGeometry(0.42, 0.06), holoMat, [2.85, 0.02, 0.083], [0, 0, -0.12]);
addMesh(new THREE.PlaneGeometry(0.26, 0.045), holoMat, [4.2, 0.02, 0.083], [0, 0, 0.16]);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(7, 64),
  new THREE.MeshStandardMaterial({ color: 0x050a11, metalness: 0.3, roughness: 0.72 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.85;
floor.receiveShadow = true;
scene.add(floor);

scene.add(new THREE.HemisphereLight(0x253b58, 0x030308, 1.4));

const keyLight = new THREE.DirectionalLight(0xbbeaff, 3.2);
keyLight.position.set(3, 6, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -5;
scene.add(keyLight);

const cyanLight = new THREE.PointLight(0x00d9ff, 11, 7, 2);
cyanLight.position.set(2.6, 0.2, 2.2);
scene.add(cyanLight);

const pinkLight = new THREE.PointLight(0xff087d, 10, 5, 2);
pinkLight.position.set(-1.5, 0.8, -1.8);
scene.add(pinkLight);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
