<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balloon Giraffe</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #fff7df 0%, #e8f2ee 55%, #b9d2ce 100%);
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeaf3ee);
scene.fog = new THREE.Fog(0xeaf3ee, 17, 30);

const camera = new THREE.PerspectiveCamera(32, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(10.5, 7.2, 13.5);
camera.lookAt(0, 4.6, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4.45, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 10;
controls.maxDistance = 24;
controls.maxPolarAngle = Math.PI * 0.48;

const yellowMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffc928,
  roughness: 0.18,
  metalness: 0,
  clearcoat: 1,
  clearcoatRoughness: 0.1,
  sheen: 0.45,
  sheenColor: new THREE.Color(0xffe87a)
});

const lightYellowMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffd84a,
  roughness: 0.2,
  clearcoat: 1,
  clearcoatRoughness: 0.11
});

const brownMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x7d381d,
  roughness: 0.25,
  clearcoat: 0.85,
  clearcoatRoughness: 0.16
});

const darkBrownMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x3c170f,
  roughness: 0.28,
  clearcoat: 0.7
});

const blackMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x090706,
  roughness: 0.12,
  clearcoat: 1
});

const whiteMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  roughness: 0.14,
  clearcoat: 1
});

const innerEarMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xc46941,
  roughness: 0.3,
  clearcoat: 0.55
});

const giraffe = new THREE.Group();
giraffe.rotation.y = -0.12;
scene.add(giraffe);

const sphereGeometry = new THREE.SphereGeometry(1, 48, 32);
const knotGeometry = new THREE.SphereGeometry(1, 32, 20);

function ellipsoid(name, position, scale, material, parent = giraffe) {
  const mesh = new THREE.Mesh(sphereGeometry, material);
  mesh.name = name;
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function balloonSegment(name, start, end, radius, material = yellowMaterial, parent = giraffe) {
  const midpoint = start.clone().add(end).multiplyScalar(0.5);
  const direction = end.clone().sub(start);
  const length = direction.length();
  const mesh = ellipsoid(name, midpoint, new THREE.Vector3(radius, length * 0.53, radius), material, parent);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  return mesh;
}

function knot(position, radius = 0.18, material = yellowMaterial, parent = giraffe) {
  const mesh = new THREE.Mesh(knotGeometry, material);
  mesh.position.copy(position);
  mesh.scale.set(radius * 1.15, radius * 0.72, radius);
  mesh.rotation.set(0.25, 0.15, -0.18);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function seamRing(position, direction, radius, material = lightYellowMaterial, parent = giraffe) {
  const geometry = new THREE.TorusGeometry(radius, 0.035, 10, 32);
  const ring = new THREE.Mesh(geometry, material);
  ring.position.copy(position);
  ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), direction.clone().normalize());
  ring.castShadow = true;
  parent.add(ring);
  return ring;
}

function surfaceSpot(center, axes, direction, size, rotation = 0, parent = giraffe) {
  const dir = direction.clone().normalize();
  const position = new THREE.Vector3(
    center.x + axes.x * dir.x,
    center.y + axes.y * dir.y,
    center.z + axes.z * dir.z
  );
  const normal = new THREE.Vector3(
    dir.x / axes.x,
    dir.y / axes.y,
    dir.z / axes.z
  ).normalize();
  position.addScaledVector(normal, 0.025);

  const spot = new THREE.Mesh(sphereGeometry, brownMaterial);
  spot.position.copy(position);
  spot.scale.set(size, 0.045, size * 0.76);
  spot.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
  spot.rotateY(rotation);
  spot.castShadow = true;
  parent.add(spot);
  return spot;
}

function smallSphere(position, scale, material, parent = giraffe) {
  return ellipsoid('detail', position, scale, material, parent);
}

const bodyCenter = new THREE.Vector3(-0.25, 3.72, 0);
const bodyAxes = new THREE.Vector3(1.72, 0.82, 0.72);
ellipsoid('inflated body', bodyCenter, bodyAxes, yellowMaterial);

seamRing(
  new THREE.Vector3(-1.69, 3.72, 0),
  new THREE.Vector3(1, 0, 0),
  0.48,
  lightYellowMaterial
);
seamRing(
  new THREE.Vector3(1.17, 3.72, 0),
  new THREE.Vector3(1, 0, 0),
  0.47,
  lightYellowMaterial
);

[
  [new THREE.Vector3(-0.75, 0.56, 0.57), 0.31, 0.2],
  [new THREE.Vector3(0.12, 0.83, 0.55), 0.28, 1.0],
  [new THREE.Vector3(0.72, 0.34, 0.61), 0.34, -0.3],
  [new THREE.Vector3(-0.1, -0.62, 0.75), 0.29, 0.8],
  [new THREE.Vector3(-0.72, -0.31, 0.68), 0.25, -0.5],
  [new THREE.Vector3(0.44, 0.72, -0.54), 0.27, 0.3],
  [new THREE.Vector3(-0.52, 0.55, -0.65), 0.3, -0.7]
].forEach(([direction, size, rotation]) => {
  surfaceSpot(bodyCenter, bodyAxes, direction, size, rotation);
});

const legData = [
  { hip: new THREE.Vector3(0.88, 3.43, 0.48), knee: new THREE.Vector3(0.94, 2.20, 0.53), ankle: new THREE.Vector3(1.05, 0.82, 0.57) },
  { hip: new THREE.Vector3(0.88, 3.43, -0.48), knee: new THREE.Vector3(0.82, 2.16, -0.53), ankle: new THREE.Vector3(0.70, 0.82, -0.58) },
  { hip: new THREE.Vector3(-1.24, 3.42, 0.47), knee: new THREE.Vector3(-1.17, 2.16, 0.54), ankle: new THREE.Vector3(-1.33, 0.79, 0.59) },
  { hip: new THREE.Vector3(-1.24, 3.42, -0.47), knee: new THREE.Vector3(-1.35, 2.15, -0.51), ankle: new THREE.Vector3(-1.18, 0.79, -0.57) }
];

legData.forEach((leg, index) => {
  balloonSegment(`upper leg ${index}`, leg.hip, leg.knee, 0.27);
  knot(leg.knee, 0.19);
  balloonSegment(`lower leg ${index}`, leg.knee, leg.ankle, 0.235);
  seamRing(leg.knee, leg.ankle.clone().sub(leg.knee), 0.205);
  smallSphere(
    leg.ankle.clone().add(new THREE.Vector3(0.045, -0.18, 0)),
    new THREE.Vector3(0.31, 0.25, 0.34),
    darkBrownMaterial
  );
  const spotPos = leg.hip.clone().lerp(leg.knee, 0.48);
  smallSphere(
    spotPos.clone().add(new THREE.Vector3(0.01, 0, leg.hip.z > 0 ? 0.255 : -0.255)),
    new THREE.Vector3(0.16, 0.24, 0.045),
    brownMaterial
  );
});

const neckPoints = [
  new THREE.Vector3(0.94, 4.02, 0),
  new THREE.Vector3(1.12, 5.00, 0),
  new THREE.Vector3(1.18, 6.05, 0),
  new THREE.Vector3(1.30, 7.05, 0),
  new THREE.Vector3(1.52, 7.88, 0)
];

for (let i = 0; i < neckPoints.length - 1; i++) {
  balloonSegment(`neck segment ${i}`, neckPoints[i], neckPoints[i + 1], 0.39 - i * 0.018);
  if (i > 0) {
    knot(neckPoints[i], 0.22 - i * 0.008);
    seamRing(
      neckPoints[i],
      neckPoints[i + 1].clone().sub(neckPoints[i]),
      0.31 - i * 0.012
    );
  }
}

const neckSpotCenters = [
  [new THREE.Vector3(1.09, 4.77, 0), new THREE.Vector3(0.82, 0.2, 0.54), 0.18],
  [new THREE.Vector3(1.16, 5.58, 0), new THREE.Vector3(-0.74, 0.2, 0.62), 0.16],
  [new THREE.Vector3(1.22, 6.36, 0), new THREE.Vector3(0.76, 0.05, 0.59), 0.17],
  [new THREE.Vector3(1.36, 7.08, 0), new THREE.Vector3(-0.72, 0.15, 0.63), 0.15],
  [new THREE.Vector3(1.44, 7.55, 0), new THREE.Vector3(0.6, 0.1, -0.78), 0.14]
];

neckSpotCenters.forEach(([center, direction, size]) => {
  const normal = direction.clone().normalize();
  const spot = new THREE.Mesh(sphereGeometry, brownMaterial);
  spot.position.copy(center).add(new THREE.Vector3(normal.x * 0.36, normal.y * 0.1, normal.z * 0.36));
  spot.scale.set(size, 0.04, size * 0.72);
  spot.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);
  spot.castShadow = true;
  giraffe.add(spot);
});

const headCenter = new THREE.Vector3(1.72, 8.25, 0);
ellipsoid('head balloon', headCenter, new THREE.Vector3(0.82, 0.58, 0.55), yellowMaterial);
seamRing(new THREE.Vector3(1.18, 8.18, 0), new THREE.Vector3(1, 0, 0), 0.37);

const muzzleCenter = new THREE.Vector3(2.31, 8.04, 0);
const muzzle = ellipsoid('muzzle', muzzleCenter, new THREE.Vector3(0.61, 0.39, 0.46), lightYellowMaterial);
muzzle.rotation.z = -0.08;

surfaceSpot(
  headCenter,
  new THREE.Vector3(0.82, 0.58, 0.55),
  new THREE.Vector3(-0.15, 0.72, 0.68),
  0.2,
  0.35
);

const eyePositions = [
  new THREE.Vector3(1.91, 8.43, 0.49),
  new THREE.Vector3(1.91, 8.43, -0.49)
];

eyePositions.forEach((eyePosition, index) => {
  const eye = smallSphere(eyePosition, new THREE.Vector3(0.115, 0.145, 0.07), blackMaterial);
  eye.rotation.y = index === 0 ? 0.1 : -0.1;
  smallSphere(
    eyePosition.clone().add(new THREE.Vector3(0.035, 0.05, index === 0 ? 0.067 : -0.067)),
    new THREE.Vector3(0.032, 0.04, 0.018),
    whiteMaterial
  );
});

[
  new THREE.Vector3(2.57, 8.13, 0.31),
  new THREE.Vector3(2.57, 8.13, -0.31)
].forEach((position) => {
  smallSphere(position, new THREE.Vector3(0.075, 0.052, 0.045), darkBrownMaterial);
});

const smileCurve = new THREE.QuadraticBezierCurve3(
  new THREE.Vector3(2.30, 7.82, 0.405),
  new THREE.Vector3(2.48, 7.73, 0.42),
  new THREE.Vector3(2.65, 7.83, 0.35)
);
const smileTube = new THREE.Mesh(
  new THREE.TubeGeometry(smileCurve, 24, 0.025, 8, false),
  darkBrownMaterial
);
smileTube.castShadow = true;
giraffe.add(smileTube);

function createEar(position, rotationY, rotationZ, side) {
  const earGroup = new THREE.Group();
  earGroup.position.copy(position);
  earGroup.rotation.set(0, rotationY, rotationZ);

  const outer = new THREE.Mesh(sphereGeometry, yellowMaterial);
  outer.scale.set(0.18, 0.48, 0.12);
  outer.castShadow = true;
  earGroup.add(outer);

  const inner = new THREE.Mesh(sphereGeometry, innerEarMaterial);
  inner.position.z = side * 0.105;
  inner.scale.set(0.09, 0.31, 0.026);
  inner.castShadow = true;
  earGroup.add(inner);

  giraffe.add(earGroup);
}

createEar(new THREE.Vector3(1.43, 8.69, 0.46), 0.48, -0.74, 1);
createEar(new THREE.Vector3(1.43, 8.69, -0.46), -0.48, -0.74, -1);

function createOssicone(x, z, tilt) {
  const start = new THREE.Vector3(x, 8.68, z);
  const end = new THREE.Vector3(x + tilt, 9.19, z);
  balloonSegment('ossicone stem', start, end, 0.105);
  knot(end, 0.12, brownMaterial);
  smallSphere(
    end.clone().add(new THREE.Vector3(tilt * 0.12, 0.07, 0)),
    new THREE.Vector3(0.18, 0.14, 0.16),
    brownMaterial
  );
}

createOssicone(1.42, 0.27, -0.08);
createOssicone(1.42, -0.27, -0.08);

const maneCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.82, 4.55, -0.03),
  new THREE.Vector3(0.78, 5.45, -0.03),
  new THREE.Vector3(0.84, 6.35, -0.03),
  new THREE.Vector3(0.99, 7.18, -0.03),
  new THREE.Vector3(1.20, 7.79, -0.03)
]);

const maneTube = new THREE.Mesh(
  new THREE.TubeGeometry(maneCurve, 48, 0.085, 10, false),
  brownMaterial
);
maneTube.castShadow = true;
giraffe.add(maneTube);

for (let i = 0; i < 9; i++) {
  const t = i / 9;
  const point = maneCurve.getPoint(t);
  const bump = smallSphere(
    point.clone().add(new THREE.Vector3(-0.08, 0, 0)),
    new THREE.Vector3(0.14, 0.2, 0.12),
    brownMaterial
  );
  bump.rotation.z = 0.55;
}

const tailCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-1.68, 3.93, 0),
  new THREE.Vector3(-2.12, 3.72, 0.04),
  new THREE.Vector3(-2.31, 3.21, 0.08),
  new THREE.Vector3(-2.12, 2.85, 0.11)
]);

const tail = new THREE.Mesh(
  new THREE.TubeGeometry(tailCurve, 40, 0.105, 12, false),
  yellowMaterial
);
tail.castShadow = true;
giraffe.add(tail);

knot(new THREE.Vector3(-2.12, 2.84, 0.11), 0.14, brownMaterial);
smallSphere(
  new THREE.Vector3(-2.13, 2.66, 0.12),
  new THREE.Vector3(0.22, 0.34, 0.21),
  brownMaterial
);

const knotTip = new THREE.Mesh(
  new THREE.ConeGeometry(0.12, 0.32, 16),
  yellowMaterial
);
knotTip.position.set(-1.86, 3.88, 0);
knotTip.rotation.z = -1.18;
knotTip.castShadow = true;
giraffe.add(knotTip);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xdce8df,
  roughness: 0.82,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(8.5, 96), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0.45;
floor.receiveShadow = true;
scene.add(floor);

const shadowDisc = new THREE.Mesh(
  new THREE.CircleGeometry(2.6, 64),
  new THREE.MeshBasicMaterial({
    color: 0x71847a,
    transparent: true,
    opacity: 0.12,
    depthWrite: false
  })
);
shadowDisc.rotation.x = -Math.PI / 2;
shadowDisc.position.set(-0.15, 0.462, 0);
scene.add(shadowDisc);

const hemisphereLight = new THREE.HemisphereLight(0xfff8de, 0x77958e, 2.1);
scene.add(hemisphereLight);

const keyLight = new THREE.DirectionalLight(0xfff0ca, 5.1);
keyLight.position.set(6, 12, 8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 11;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 30;
keyLight.shadow.bias = -0.0003;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x8ccfff, 2.7);
rimLight.position.set(-7, 8, -7);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0xffd88f, 18, 18, 2);
fillLight.position.set(4, 5, -5);
scene.add(fillLight);

const softLight = new THREE.PointLight(0xffffff, 12, 15, 2);
softLight.position.set(-4, 7, 5);
scene.add(softLight);

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}
window.addEventListener('resize', resize);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  giraffe.position.y = Math.sin(elapsed * 1.45) * 0.025;
  giraffe.rotation.z = Math.sin(elapsed * 0.72) * 0.006;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
