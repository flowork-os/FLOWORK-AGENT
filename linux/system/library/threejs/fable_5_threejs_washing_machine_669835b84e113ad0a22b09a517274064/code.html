<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Washing Machine</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e8eaee}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8eaee);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
camera.position.set(2.4, 1.6, 3.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.62, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 1.8;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.52;

// Lights
scene.add(new THREE.HemisphereLight(0xffffff, 0xb0b4bc, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(3, 5, 3.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -2;
key.shadow.camera.right = key.shadow.camera.top = 2;
key.shadow.bias = -0.0005;
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe6ff, 0.45);
fill.position.set(-4, 2.5, -2.5);
scene.add(fill);

// Ground
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(6, 64),
  new THREE.ShadowMaterial({ opacity: 0.22 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
const disc = new THREE.Mesh(
  new THREE.CircleGeometry(1.6, 64),
  new THREE.MeshStandardMaterial({ color: 0xdadde3, roughness: 0.95 })
);
disc.rotation.x = -Math.PI/2;
disc.position.y = -0.001;
disc.receiveShadow = true;
scene.add(disc);

// Materials
const white  = new THREE.MeshStandardMaterial({ color: 0xf4f5f7, roughness: 0.35, metalness: 0.05 });
const white2 = new THREE.MeshStandardMaterial({ color: 0xeceef1, roughness: 0.45, metalness: 0.05 });
const dark   = new THREE.MeshStandardMaterial({ color: 0x2a2d33, roughness: 0.5,  metalness: 0.1 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xcfd3d8, roughness: 0.15, metalness: 0.9 });
const rubber = new THREE.MeshStandardMaterial({ color: 0x8a8f96, roughness: 0.9 });
const glass  = new THREE.MeshPhysicalMaterial({ color: 0x3d4750, roughness: 0.05, metalness: 0, transmission: 0.35, thickness: 0.05, clearcoat: 1 });
const drumM  = new THREE.MeshStandardMaterial({ color: 0x9aa0a8, roughness: 0.3, metalness: 0.8, side: THREE.BackSide });

const machine = new THREE.Group();
scene.add(machine);
const W = 1.2, H = 1.24, D = 1.2;

function box(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  machine.add(m);
  return m;
}

// Body
box(W, H, D, white, 0, H/2, 0);
// Flat top slab (slight overhang)
box(W + 0.04, 0.05, D + 0.04, white, 0, H + 0.025, 0);
// Base plinth
box(W - 0.06, 0.06, D - 0.06, dark, 0, 0.03, 0);
// Feet
for (const [x, z] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
  const f = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 0.06, 16), dark);
  f.position.set(x*(W/2-0.1), 0.03, z*(D/2-0.1));
  f.castShadow = true;
  machine.add(f);
}

const FZ = D/2; // front plane

// Front panel seams (breaklines)
const seam = new THREE.MeshStandardMaterial({ color: 0xc9ccd2, roughness: 0.6 });
box(W - 0.02, 0.008, 0.006, seam, 0, 0.96, FZ + 0.002);      // under control panel
box(W - 0.02, 0.008, 0.006, seam, 0, 0.135, FZ + 0.002);     // above plinth

// ---- Control panel (top strip) ----
box(W - 0.02, 0.015, 0.015, seam, 0, 1.19, FZ - 0.004);      // panel top breakline
// Display
const disp = box(0.26, 0.1, 0.02, dark, 0.02, 1.08, FZ + 0.005);
const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.06),
  new THREE.MeshStandardMaterial({ color: 0x123a2a, emissive: 0x35e08a, emissiveIntensity: 0.7, roughness: 0.4 }));
scr.position.set(0.02, 1.08, FZ + 0.016);
machine.add(scr);
// Main program knob
const knob = new THREE.Group();
const kBase = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.11, 0.03, 32), chrome);
kBase.rotation.x = Math.PI/2;
const kTop = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.045, 32), white2);
kTop.rotation.x = Math.PI/2; kTop.position.z = 0.02;
const kMark = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.05, 0.012), dark);
kMark.position.set(0, 0.045, 0.042);
knob.add(kBase, kTop, kMark);
knob.position.set(-0.38, 1.08, FZ + 0.012);
knob.traverse(o => { if (o.isMesh) o.castShadow = true; });
machine.add(knob);
// Dial tick marks around knob
for (let i = 0; i < 12; i++) {
  const a = (i/12) * Math.PI * 2;
  const t = new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.025, 0.006), dark);
  t.position.set(-0.38 + Math.sin(a)*0.135, 1.08 + Math.cos(a)*0.135, FZ + 0.004);
  t.rotation.z = -a;
  machine.add(t);
}
// Small buttons + secondary knob
for (let i = 0; i < 4; i++)
  box(0.055, 0.03, 0.015, white2, 0.24 + i*0.08, 1.08, FZ + 0.006);
const k2 = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.04, 0.035, 24), white2);
k2.rotation.x = Math.PI/2;
k2.position.set(-0.17, 1.08, FZ + 0.012);
k2.castShadow = true;
machine.add(k2);

// ---- Detergent drawer (top-left, with seam) ----
box(0.3, 0.09, 0.02, white2, -0.37, 0.905, FZ + 0.004);
const drawerSeam = new THREE.Mesh(new THREE.BoxGeometry(0.31, 0.1, 0.004), seam);
drawerSeam.position.set(-0.37, 0.905, FZ + 0.001);
machine.add(drawerSeam);
box(0.14, 0.018, 0.02, dark, -0.37, 0.885, FZ + 0.016);      // drawer grip

// ---- Door assembly ----
const doorY = 0.56, R = 0.4;
// Recessed opening
const recess = new THREE.Mesh(new THREE.CylinderGeometry(R*0.82, R*0.82, 0.06, 48), dark);
recess.rotation.x = Math.PI/2;
recess.position.set(0, doorY, FZ - 0.02);
machine.add(recess);
// Drum interior
const drum = new THREE.Mesh(new THREE.CylinderGeometry(R*0.72, R*0.72, 0.5, 48, 1, true), drumM);
drum.rotation.x = Math.PI/2;
drum.position.set(0, doorY, FZ - 0.28);
machine.add(drum);
const drumBack = new THREE.Mesh(new THREE.CircleGeometry(R*0.72, 48), drumM.clone());
drumBack.material.side = THREE.FrontSide;
drumBack.position.set(0, doorY, FZ - 0.52);
machine.add(drumBack);
// Rubber gasket ring inside the opening
const gasket = new THREE.Mesh(new THREE.TorusGeometry(R*0.74, 0.035, 20, 64), rubber);
gasket.position.set(0, doorY, FZ - 0.005);
machine.add(gasket);
// Outer door rim (chrome ring)
const rim = new THREE.Mesh(new THREE.TorusGeometry(R, 0.045, 24, 80), chrome);
rim.position.set(0, doorY, FZ + 0.05);
rim.castShadow = true;
machine.add(rim);
// White door frame ring
const frame = new THREE.Mesh(new THREE.RingGeometry(R*0.82, R + 0.04, 64), white);
frame.position.set(0, doorY, FZ + 0.052);
machine.add(frame);
// Domed glass window
const dome = new THREE.Mesh(new THREE.SphereGeometry(R*0.86, 48, 32, 0, Math.PI*2, 0, Math.PI/2.6), glass);
dome.rotation.x = Math.PI/2;
dome.scale.z = 0.55;
dome.position.set(0, doorY, FZ + 0.03);
machine.add(dome);
// Hinge (left side)
const hingeArm = box(0.05, 0.22, 0.06, chrome, -R - 0.06, doorY, FZ + 0.03);
hingeArm.castShadow = true;
for (const dy of [-0.07, 0.07]) {
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.08, 16), dark);
  pin.position.set(-R - 0.06, doorY + dy, FZ + 0.03);
  pin.castShadow = true;
  machine.add(pin);
}
// Door handle (right side)
const handle = new THREE.Mesh(new THREE.TorusGeometry(0.055, 0.016, 12, 32, Math.PI), chrome);
handle.position.set(R + 0.015, doorY, FZ + 0.06);
handle.rotation.set(Math.PI/2, 0, Math.PI/2);
handle.castShadow = true;
machine.add(handle);

// Center machine
machine.position.x = 0;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
