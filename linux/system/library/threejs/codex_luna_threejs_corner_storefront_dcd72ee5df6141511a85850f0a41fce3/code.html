<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corner Storefront</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #151a20;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
    }
    .label {
      position: fixed;
      left: 24px;
      bottom: 20px;
      color: rgba(255,255,255,.72);
      letter-spacing: .14em;
      font-size: 11px;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">NOVA / Urban Goods</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x18202a);
    scene.fog = new THREE.Fog(0x18202a, 24, 48);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(13, 9, 15);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.42;
    controls.minDistance = 8;
    controls.maxDistance = 28;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.target.set(-3.6, 2.4, -3.6);

    const wallMaterial = new THREE.MeshStandardMaterial({
      color: 0x4b5157,
      roughness: 0.82,
      metalness: 0.04
    });
    const upperMaterial = new THREE.MeshStandardMaterial({
      color: 0x626970,
      roughness: 0.76,
      metalness: 0.05
    });
    const darkMaterial = new THREE.MeshStandardMaterial({
      color: 0x171c21,
      roughness: 0.5,
      metalness: 0.35
    });
    const frameMaterial = new THREE.MeshStandardMaterial({
      color: 0x252b31,
      roughness: 0.34,
      metalness: 0.72
    });
    const brassMaterial = new THREE.MeshStandardMaterial({
      color: 0xc18b38,
      roughness: 0.24,
      metalness: 0.86
    });
    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x315264,
      roughness: 0.11,
      metalness: 0.52,
      transparent: true,
      opacity: 0.42,
      transmission: 0.12,
      clearcoat: 0.8,
      side: THREE.DoubleSide
    });
    const warmGlassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xa96c3e,
      roughness: 0.18,
      metalness: 0.18,
      transparent: true,
      opacity: 0.7,
      emissive: 0x3a1809,
      emissiveIntensity: 0.18
    });
    const redFabricMaterial = new THREE.MeshStandardMaterial({
      color: 0x9b3028,
      roughness: 0.9,
      metalness: 0.02
    });
    const creamFabricMaterial = new THREE.MeshStandardMaterial({
      color: 0xe6d3a7,
      roughness: 0.92,
      metalness: 0.01
    });
    const signMaterial = new THREE.MeshStandardMaterial({
      color: 0xd18b39,
      roughness: 0.38,
      metalness: 0.22,
      emissive: 0x3a1604,
      emissiveIntensity: 0.22
    });
    const concreteMaterial = new THREE.MeshStandardMaterial({
      color: 0x73787a,
      roughness: 0.96,
      metalness: 0.02
    });
    const sidewalkMaterial = new THREE.MeshStandardMaterial({
      color: 0x383e43,
      roughness: 0.98,
      metalness: 0
    });
    const planterMaterial = new THREE.MeshStandardMaterial({
      color: 0x30383b,
      roughness: 0.85,
      metalness: 0.16
    });
    const foliageMaterial = new THREE.MeshStandardMaterial({
      color: 0x285342,
      roughness: 0.92,
      metalness: 0
    });

    function addBox(parent, width, height, depth, material, x, y, z, rx = 0, ry = 0, rz = 0, cast = true, receive = true) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
      mesh.position.set(x, y, z);
      mesh.rotation.set(rx, ry, rz);
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder(parent, radius, height, material, x, y, z, rx = 0, ry = 0, rz = 0, segments = 24) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, segments), material);
      mesh.position.set(x, y, z);
      mesh.rotation.set(rx, ry, rz);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addSphere(parent, radius, material, x, y, z) {
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 24, 16), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    addBox(scene, 40, 0.22, 40, sidewalkMaterial, -5, -0.11, -5, 0, 0, 0, false, true);
    addBox(scene, 30, 0.16, 2.5, concreteMaterial, -5, 0.02, 1.5, 0, 0, 0, false, true);
    addBox(scene, 2.5, 0.16, 30, concreteMaterial, 1.5, 0.02, -5, 0, 0, 0, false, true);

    addBox(scene, 12, 8, 12, wallMaterial, -6, 4, -6);
    addBox(scene, 12.15, 0.28, 0.34, upperMaterial, -6, 7.88, 0.16);
    addBox(scene, 0.34, 0.28, 12.15, upperMaterial, 0.16, 7.88, -6);
    addBox(scene, 11.7, 0.22, 0.2, darkMaterial, -5.85, 6.45, 0.17);
    addBox(scene, 0.2, 0.22, 11.7, darkMaterial, 0.17, 6.45, -5.85);

    for (let row = 0; row < 5; row += 1) {
      const brickY = 6.75 + row * 0.22;
      addBox(scene, 11.3, 0.035, 0.035, darkMaterial, -6, brickY, 0.205, 0, 0, 0, false, false);
      addBox(scene, 0.035, 0.035, 11.3, darkMaterial, 0.205, brickY, -6, 0, 0, 0, false, false);
    }

    const windowBottom = 0.68;
    const windowTop = 4.28;
    const windowHeight = windowTop - windowBottom;
    const frontStart = -11.45;
    const frontEnd = -1.55;
    const frontPanels = 5;
    const frontSpan = (frontEnd - frontStart) / frontPanels;

    for (let panelIndex = 0; panelIndex < frontPanels; panelIndex += 1) {
      const panelCenter = frontStart + frontSpan * (panelIndex + 0.5);
      const panelWidth = frontSpan - 0.16;
      addBox(scene, panelWidth, windowHeight - 0.16, 0.075, glassMaterial, panelCenter, (windowBottom + windowTop) / 2, 0.25, 0, 0, 0, false, false);
      addBox(scene, panelWidth * 0.72, 2.15, 0.035, warmGlassMaterial, panelCenter, 1.78, 0.315, 0, 0, 0, false, false);

      if (panelIndex === 1 || panelIndex === 3) {
        addBox(scene, panelWidth * 0.56, 0.09, 0.34, brassMaterial, panelCenter, 1.08, 0.42);
        addCylinder(scene, 0.19, 0.58, brassMaterial, panelCenter, 1.43, 0.43);
        addSphere(scene, 0.21, signMaterial, panelCenter, 2.18, 0.43);
      } else {
        addBox(scene, panelWidth * 0.54, 0.08, 0.3, frameMaterial, panelCenter, 1.02, 0.41);
        addBox(scene, panelWidth * 0.46, 0.78, 0.06, signMaterial, panelCenter, 1.48, 0.43);
        addBox(scene, panelWidth * 0.34, 0.06, 0.08, creamFabricMaterial, panelCenter, 2.38, 0.44);
      }
    }

    addBox(scene, frontEnd - frontStart + 0.24, 0.13, 0.14, frameMaterial, (frontStart + frontEnd) / 2, windowBottom, 0.32);
    addBox(scene, frontEnd - frontStart + 0.24, 0.13, 0.14, frameMaterial, (frontStart + frontEnd) / 2, windowTop, 0.32);
    for (let frameIndex = 0; frameIndex <= frontPanels; frameIndex += 1) {
      const frameX = frontStart + frameIndex * frontSpan;
      addBox(scene, 0.13, windowHeight + 0.12, 0.14, frameMaterial, frameX, (windowBottom + windowTop) / 2, 0.32);
    }

    const sideStart = -11.45;
    const sideEnd = -1.55;
    const sidePanels = 5;
    const sideSpan = (sideEnd - sideStart) / sidePanels;

    for (let panelIndex = 0; panelIndex < sidePanels; panelIndex += 1) {
      const panelCenter = sideStart + sideSpan * (panelIndex + 0.5);
      const panelDepth = sideSpan - 0.16;
      addBox(scene, 0.075, windowHeight - 0.16, panelDepth, glassMaterial, 0.25, (windowBottom + windowTop) / 2, panelCenter, 0, 0, 0, false, false);
      addBox(scene, 0.035, 2.15, panelDepth * 0.72, warmGlassMaterial, 0.315, 1.78, panelCenter, 0, 0, 0, false, false);

      if (panelIndex === 0 || panelIndex === 3) {
        addBox(scene, 0.34, 0.09, panelDepth * 0.56, brassMaterial, 0.42, 1.08, panelCenter);
        addCylinder(scene, 0.19, 0.58, brassMaterial, 0.43, 1.43, panelCenter);
        addSphere(scene, 0.21, signMaterial, 0.43, 2.18, panelCenter);
      } else {
        addBox(scene, 0.3, 0.08, panelDepth * 0.54, frameMaterial, 0.41, 1.02, panelCenter);
        addBox(scene, 0.06, 0.78, panelDepth * 0.46, signMaterial, 0.43, 1.48, panelCenter);
        addBox(scene, 0.08, 0.06, panelDepth * 0.34, creamFabricMaterial, 0.44, 2.38, panelCenter);
      }
    }

    addBox(scene, 0.14, windowHeight + 0.24, sideEnd - sideStart + 0.24, frameMaterial, 0.32, (windowBottom + windowTop) / 2, (sideStart + sideEnd) / 2);
    addBox(scene, 0.14, 0.13, sideEnd - sideStart + 0.24, frameMaterial, 0.32, windowBottom, (sideStart + sideEnd) / 2);
    addBox(scene, 0.14, 0.13, sideEnd - sideStart + 0.24, frameMaterial, 0.32, windowTop, (sideStart + sideEnd) / 2);
    for (let frameIndex = 0; frameIndex <= sidePanels; frameIndex += 1) {
      const frameZ = sideStart + frameIndex * sideSpan;
      addBox(scene, 0.14, windowHeight + 0.12, 0.13, frameMaterial, 0.32, (windowBottom + windowTop) / 2, frameZ);
    }

    function addAwningStripeRow(side) {
      const awningAngle = 0.2;
      const stripeCount = 10;
      if (side === "front") {
        addBox(scene, 10.0, 0.16, 1.86, redFabricMaterial, -6.25, 5.03, 0.92, awningAngle, 0, 0);
        for (let stripeIndex = 0; stripeIndex < stripeCount; stripeIndex += 1) {
          const stripeX = -11.18 + stripeIndex * 0.99;
          const stripeMaterial = stripeIndex % 2 === 0 ? creamFabricMaterial : redFabricMaterial;
          addBox(scene, 0.48, 0.07, 1.78, stripeMaterial, stripeX, 5.12, 0.92, awningAngle, 0, 0);
          addBox(scene, 0.47, 0.36, 0.11, stripeMaterial, stripeX, 4.53, 1.82, 0, 0, 0);
        }
      } else {
        addBox(scene, 0.16, 5.03, 1.86, redFabricMaterial, 0.92, 5.03, -6.25, 0, 0, -awningAngle);
        for (let stripeIndex = 0; stripeIndex < stripeCount; stripeIndex += 1) {
          const stripeZ = -11.18 + stripeIndex * 0.99;
          const stripeMaterial = stripeIndex % 2 === 0 ? creamFabricMaterial : redFabricMaterial;
          addBox(scene, 0.07, 0.48, 1.78, stripeMaterial, 0.92, 5.12, stripeZ, 0, 0, -awningAngle);
          addBox(scene, 0.11, 0.47, 0.36, stripeMaterial, 1.82, 4.53, stripeZ);
        }
      }
    }

    addAwningStripeRow("front");
    addAwningStripeRow("side");

    const entryGroup = new THREE.Group();
    entryGroup.position.set(0.58, 0, 0.58);
    entryGroup.rotation.y = Math.PI / 4;
    scene.add(entryGroup);

    addBox(entryGroup, 2.72, 4.08, 0.14, darkMaterial, 0, 2.15, -0.04);
    addBox(entryGroup, 2.24, 3.55, 0.08, glassMaterial, 0, 2.02, 0.1, 0, 0, 0, false, false);
    addBox(entryGroup, 0.12, 3.82, 0.24, frameMaterial, -1.18, 2.08, 0.17);
    addBox(entryGroup, 0.12, 3.82, 0.24, frameMaterial, 1.18, 2.08, 0.17);
    addBox(entryGroup, 2.48, 0.14, 0.24, frameMaterial, 0, 4.02, 0.17);
    addBox(entryGroup, 0.1, 3.55, 0.12, frameMaterial, 0, 2.02, 0.18);
    addBox(entryGroup, 0.08, 3.36, 0.05, warmGlassMaterial, -0.54, 2.02, 0.19, 0, 0, 0, false, false);
    addBox(entryGroup, 0.08, 3.36, 0.05, warmGlassMaterial, 0.54, 2.02, 0.19, 0, 0, 0, false, false);
    addCylinder(entryGroup, 0.035, 0.38, brassMaterial, -0.16, 2.05, 0.27);
    addCylinder(entryGroup, 0.035, 0.38, brassMaterial, 0.16, 2.05, 0.27);
    addBox(entryGroup, 2.8, 0.14, 0.76, redFabricMaterial, 0, 4.3, 0.39, 0, 0, 0);

    addBox(scene, 0.26, 4.25, 0.26, frameMaterial, 0.08, 2.15, 0.08);
    addBox(scene, 0.26, 4.25, 0.26, frameMaterial, 0.08, 2.15, -0.08);

    addBox(scene, 10.2, 1.15, 0.18, signMaterial, -6.1, 5.55, 0.21);
    addBox(scene, 0.18, 1.15, 10.2, signMaterial, 0.21, 5.55, -6.1);

    const patterns = {
      N: ["10001","11001","10101","10011","10001","10001","10001"],
      O: ["01110","10001","10001","10001","10001","10001","01110"],
      V: ["10001","10001","10001","10001","10001","01010","00100"],
      A: ["01110","10001","10001","11111","10001","10001","10001"]
    };

    function addPixelWord(word, x, y, z, rotationY) {
      const group = new THREE.Group();
      group.position.set(x, y, z);
      group.rotation.y = rotationY;
      scene.add(group);

      const cellWidth = 0.14;
      const cellHeight = 0.12;
      const gap = 0.035;

      for (let letterIndex = 0; letterIndex < word.length; letterIndex += 1) {
        const pattern = patterns[word[letterIndex]];
        const letterOffset = letterIndex * 1.03;
        for (let rowIndex = 0; rowIndex < pattern.length; rowIndex += 1) {
          for (let columnIndex = 0; columnIndex < pattern[rowIndex].length; columnIndex += 1) {
            if (pattern[rowIndex][columnIndex] === "1") {
              addBox(
                group,
                cellWidth,
                cellHeight,
                0.075,
                creamFabricMaterial,
                letterOffset + columnIndex * (cellWidth + gap),
                (6 - rowIndex) * (cellHeight + gap),
                0
              );
            }
          }
        }
      }
    }

    addPixelWord("NOVA", -8.55, 5.18, 0.34, 0);
    addPixelWord("NOVA", 0.34, 5.18, -8.55, Math.PI / 2);

    addBox(scene, 10.7, 0.12, 0.2, brassMaterial, -6, 4.53, 0.25);
    addBox(scene, 0.2, 0.12, 10.7, brassMaterial, 0.25, 4.53, -6);

    function addPlanter(x, z) {
      addBox(scene, 0.8, 0.72, 0.8, planterMaterial, x, 0.36, z);
      addBox(scene, 0.62, 0.06, 0.62, darkMaterial, x, 0.74, z);
      addCylinder(scene, 0.18, 0.75, foliageMaterial, x - 0.14, 1.08, z, 0, 0, 0, 16);
      addSphere(scene, 0.42, foliageMaterial, x + 0.08, 1.38, z);
    }

    addPlanter(-10.25, 1.2);
    addPlanter(1.2, -10.25);

    addCylinder(scene, 0.12, 0.82, brassMaterial, -1.1, 0.41, 1.0);
    addCylinder(scene, 0.12, 0.82, brassMaterial, 1.0, 0.41, -1.1);

    const sun = new THREE.DirectionalLight(0xffe4bd, 3.4);
    sun.position.set(9, 15, 11);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.left = -19;
    sun.shadow.camera.right = 12;
    sun.shadow.camera.top = 16;
    sun.shadow.camera.bottom = -16;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 42;
    sun.target.position.set(-4, 0, -4);
    scene.add(sun);
    scene.add(sun.target);

    scene.add(new THREE.HemisphereLight(0xb9d7f2, 0x29231e, 1.55));

    const frontGlow = new THREE.PointLight(0xffa24d, 2.6, 8, 2);
    frontGlow.position.set(-5.8, 2.35, 1.35);
    scene.add(frontGlow);

    const sideGlow = new THREE.PointLight(0xffa24d, 2.4, 8, 2);
    sideGlow.position.set(1.35, 2.35, -5.8);
    scene.add(sideGlow);

    const entryGlow = new THREE.PointLight(0xffc36a, 1.5, 5, 2);
    entryGlow.position.set(1.15, 2.7, 1.15);
    scene.add(entryGlow);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", resize);
    animate();
  </script>
</body>
</html>
