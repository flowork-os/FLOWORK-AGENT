<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amethyst Crystal Cluster</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080611;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090711);
scene.fog = new THREE.Fog(0x090711, 11, 22);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.7, 5.4, 9.2);
camera.lookAt(0, 1.65, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 5.7;
controls.maxDistance = 15;
controls.target.set(0, 1.75, 0);

scene.add(new THREE.HemisphereLight(0x7e75b8, 0x09070b, 1.25));

const keyLight = new THREE.DirectionalLight(0xd7c8ff, 3.4);
keyLight.position.set(-4.5, 8.5, 5.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -3;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const rimLight = new THREE.PointLight(0x9565ff, 28, 12, 2);
rimLight.position.set(4.5, 4.8, -3.5);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0x4c8cff, 17, 11, 2);
fillLight.position.set(-4, 2.5, -4.5);
scene.add(fillLight);

const warmLight = new THREE.PointLight(0xff9d62, 9, 9, 2);
warmLight.position.set(1.5, 1.3, 4.5);
scene.add(warmLight);

function makeRockGeometry() {
  const geometry = new THREE.IcosahedronGeometry(2.65, 2);
  const position = geometry.attributes.position;
  for (let i = 0; i < position.count; i++) {
    const x = position.getX(i);
    const y = position.getY(i);
    const z = position.getZ(i);
    const length = Math.sqrt(x * x + z * z) || 1;
    const wobble =
      1 +
      0.095 * Math.sin(x * 3.7 + z * 1.8) +
      0.055 * Math.sin(z * 6.1 - x * 2.2);
    const lower = y < -0.1 ? 0.82 : 1;
    position.setXYZ(
      i,
      x * wobble * lower,
      y * 0.62 + 0.06 * Math.sin(x * 4.2 - z * 3.3),
      z * wobble * lower
    );
  }
  geometry.computeVertexNormals();
  return geometry;
}

const rockMaterial = new THREE.MeshStandardMaterial({
  color: 0x171421,
  roughness: 0.91,
  metalness: 0.04,
  flatShading: true
});
const rock = new THREE.Mesh(makeRockGeometry(), rockMaterial);
rock.position.y = 0.55;
rock.rotation.y = 0.22;
rock.castShadow = true;
rock.receiveShadow = true;
scene.add(rock);

function makeCrystalGeometry(radius, bodyHeight, tipHeight, sides = 6) {
  const vertices = [];
  const indices = [];
  const angleOffset = Math.PI / 6;

  for (let i = 0; i < sides; i++) {
    const a = angleOffset + (i / sides) * Math.PI * 2;
    vertices.push(Math.cos(a) * radius, 0, Math.sin(a) * radius);
  }
  for (let i = 0; i < sides; i++) {
    const a = angleOffset + (i / sides) * Math.PI * 2;
    vertices.push(Math.cos(a) * radius, bodyHeight, Math.sin(a) * radius);
  }
  vertices.push(0, bodyHeight + tipHeight, 0);

  for (let i = 1; i < sides - 1; i++) {
    indices.push(0, i + 1, i);
  }

  for (let i = 0; i < sides; i++) {
    const next = (i + 1) % sides;
    indices.push(i, next, sides + next);
    indices.push(i, sides + next, sides + i);
  }

  const apex = sides * 2;
  for (let i = 0; i < sides; i++) {
    const next = (i + 1) % sides;
    indices.push(sides + i, sides + next, apex);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const crystalMaterials = [
  new THREE.MeshPhysicalMaterial({
    color: 0x6f32ba,
    roughness: 0.13,
    metalness: 0.04,
    transmission: 0.68,
    thickness: 0.52,
    ior: 1.58,
    reflectivity: 0.82,
    clearcoat: 0.7,
    clearcoatRoughness: 0.1,
    attenuationColor: new THREE.Color(0x5d249a),
    attenuationDistance: 1.9,
    flatShading: true
  }),
  new THREE.MeshPhysicalMaterial({
    color: 0x9a5be1,
    roughness: 0.1,
    metalness: 0.02,
    transmission: 0.62,
    thickness: 0.45,
    ior: 1.58,
    reflectivity: 0.9,
    clearcoat: 0.8,
    clearcoatRoughness: 0.08,
    attenuationColor: new THREE.Color(0x7a3fc0),
    attenuationDistance: 2.5,
    flatShading: true
  }),
  new THREE.MeshPhysicalMaterial({
    color: 0x451b82,
    roughness: 0.2,
    metalness: 0.03,
    transmission: 0.72,
    thickness: 0.65,
    ior: 1.59,
    reflectivity: 0.78,
    clearcoat: 0.55,
    clearcoatRoughness: 0.13,
    attenuationColor: new THREE.Color(0x351065),
    attenuationDistance: 1.35,
    flatShading: true
  })
];

const shards = [
  { x: -1.35, z: 0.05, r: 0.53, h: 2.42, t: 0.66, yaw: 0.15, lean: -0.06 },
  { x: -0.65, z: -0.58, r: 0.47, h: 3.05, t: 0.76, yaw: 0.72, lean: 0.045 },
  { x: 0.08, z: -0.28, r: 0.61, h: 3.82, t: 0.92, yaw: 0.19, lean: -0.025 },
  { x: 0.83, z: -0.22, r: 0.48, h: 2.7, t: 0.72, yaw: 0.9, lean: 0.07 },
  { x: 1.37, z: 0.22, r: 0.42, h: 2.18, t: 0.6, yaw: 0.4, lean: 0.11 },
  { x: 0.42, z: 0.68, r: 0.5, h: 3.06, t: 0.78, yaw: 1.05, lean: -0.055 },
  { x: -0.45, z: 0.66, r: 0.39, h: 2.28, t: 0.62, yaw: 0.28, lean: -0.13 },
  { x: -1.58, z: 0.57, r: 0.36, h: 1.72, t: 0.5, yaw: 0.7, lean: -0.17 },
  { x: 1.34, z: 0.8, r: 0.34, h: 1.63, t: 0.48, yaw: 0.22, lean: 0.14 },
  { x: -0.05, z: 1.18, r: 0.35, h: 2.15, t: 0.57, yaw: 0.84, lean: 0.09 },
  { x: 0.95, z: 1.25, r: 0.3, h: 1.58, t: 0.43, yaw: 0.53, lean: 0.18 },
  { x: -1.0, z: -1.0, r: 0.31, h: 1.72, t: 0.49, yaw: 0.08, lean: -0.08 }
];

shards.forEach((data, index) => {
  const geometry = makeCrystalGeometry(data.r, data.h, data.t);
  const crystal = new THREE.Mesh(geometry, crystalMaterials);
  crystal.position.set(data.x, 0.76, data.z);
  crystal.rotation.y = data.yaw;
  crystal.rotation.z = data.lean;
  crystal.rotation.x = Math.sin(index * 2.13) * 0.035;
  crystal.castShadow = true;
  crystal.receiveShadow = true;
  crystal.renderOrder = 2;
  crystal.geometry.clearGroups();
  const triangleCount = geometry.index.count / 3;
  for (let face = 0; face < triangleCount; face++) {
    const materialIndex = face < 4 ? 2 : (face + index) % 3;
    crystal.geometry.addGroup(face * 3, 3, materialIndex);
  }
  scene.add(crystal);
});

const haloMaterial = new THREE.MeshBasicMaterial({
  color: 0x382064,
  transparent: true,
  opacity: 0.12,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  side: THREE.BackSide
});
const halo = new THREE.Mesh(new THREE.SphereGeometry(3.5, 32, 20), haloMaterial);
halo.scale.set(1, 0.7, 1);
halo.position.y = 1.8;
scene.add(halo);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
