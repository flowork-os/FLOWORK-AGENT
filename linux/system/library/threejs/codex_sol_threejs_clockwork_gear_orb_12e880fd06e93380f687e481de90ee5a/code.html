<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clockwork Gear Orb</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #080706;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080706);
scene.fog = new THREE.FogExp2(0x080706, 0.035);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(7.4, 5.2, 8.6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 7;
controls.maxDistance = 19;
controls.target.set(0, 0, 0);

const brass = new THREE.MeshStandardMaterial({
  color: 0x9b681e,
  metalness: 0.92,
  roughness: 0.29
});
const brightBrass = new THREE.MeshStandardMaterial({
  color: 0xd29a39,
  metalness: 0.96,
  roughness: 0.19
});
const darkBrass = new THREE.MeshStandardMaterial({
  color: 0x5d3b14,
  metalness: 0.88,
  roughness: 0.42
});
const copper = new THREE.MeshStandardMaterial({
  color: 0x8e3f20,
  metalness: 0.9,
  roughness: 0.3
});
const agedCopper = new THREE.MeshStandardMaterial({
  color: 0x57281d,
  metalness: 0.82,
  roughness: 0.46
});
const steel = new THREE.MeshStandardMaterial({
  color: 0xa7a18f,
  metalness: 1,
  roughness: 0.16
});
const blackMetal = new THREE.MeshStandardMaterial({
  color: 0x17120d,
  metalness: 0.76,
  roughness: 0.4
});
const coreMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xd8a64d,
  metalness: 1,
  roughness: 0.08,
  clearcoat: 0.7,
  clearcoatRoughness: 0.12
});

const sculpture = new THREE.Group();
scene.add(sculpture);

const movingParts = [];
const clock = new THREE.Clock();

function setShadow(object) {
  object.traverse((child) => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });
}

function makeRingShape(outerRadius, innerRadius, segments = 96) {
  const shape = new THREE.Shape();
  for (let i = 0; i <= segments; i++) {
    const a = i / segments * Math.PI * 2;
    const x = Math.cos(a) * outerRadius;
    const y = Math.sin(a) * outerRadius;
    if (i === 0) shape.moveTo(x, y);
    else shape.lineTo(x, y);
  }
  const hole = new THREE.Path();
  for (let i = 0; i <= segments; i++) {
    const a = -i / segments * Math.PI * 2;
    const x = Math.cos(a) * innerRadius;
    const y = Math.sin(a) * innerRadius;
    if (i === 0) hole.moveTo(x, y);
    else hole.lineTo(x, y);
  }
  shape.holes.push(hole);
  return shape;
}

function extrudedRing(outerRadius, innerRadius, depth, material, bevel = 0.035) {
  const geometry = new THREE.ExtrudeGeometry(
    makeRingShape(outerRadius, innerRadius),
    {
      depth,
      bevelEnabled: true,
      bevelSegments: 2,
      steps: 1,
      bevelSize: bevel,
      bevelThickness: bevel,
      curveSegments: 48
    }
  );
  geometry.center();
  geometry.computeVertexNormals();
  return new THREE.Mesh(geometry, material);
}

function createGear(options) {
  const {
    radius,
    teeth,
    thickness,
    material,
    hubMaterial = material,
    spokes = 6,
    hole = 0.13,
    innerRatio = 0.57,
    toothDepth = 0.14
  } = options;

  const group = new THREE.Group();
  const rootRadius = radius * (1 - toothDepth);
  const innerRadius = radius * innerRatio;
  const shape = new THREE.Shape();
  const steps = teeth * 4;

  for (let i = 0; i <= steps; i++) {
    const a = i / steps * Math.PI * 2;
    const phase = i % 4;
    const r = phase === 1 || phase === 2 ? radius : rootRadius;
    const x = Math.cos(a) * r;
    const y = Math.sin(a) * r;
    if (i === 0) shape.moveTo(x, y);
    else shape.lineTo(x, y);
  }

  const innerHole = new THREE.Path();
  const holeSegments = Math.max(48, teeth * 2);
  for (let i = 0; i <= holeSegments; i++) {
    const a = -i / holeSegments * Math.PI * 2;
    const x = Math.cos(a) * innerRadius;
    const y = Math.sin(a) * innerRadius;
    if (i === 0) innerHole.moveTo(x, y);
    else innerHole.lineTo(x, y);
  }
  shape.holes.push(innerHole);

  const rimGeometry = new THREE.ExtrudeGeometry(shape, {
    depth: thickness,
    bevelEnabled: true,
    bevelSegments: 2,
    steps: 1,
    bevelSize: Math.min(thickness * 0.14, radius * 0.025),
    bevelThickness: Math.min(thickness * 0.14, radius * 0.025),
    curveSegments: 24
  });
  rimGeometry.center();
  rimGeometry.computeVertexNormals();

  const rim = new THREE.Mesh(rimGeometry, material);
  group.add(rim);

  const hubOuter = Math.max(hole * 2.15, radius * 0.19);
  const hub = extrudedRing(hubOuter, hole, thickness * 1.28, hubMaterial, thickness * 0.08);
  group.add(hub);

  const spokeLength = innerRadius - hubOuter + radius * 0.045;
  const spokeWidth = Math.max(radius * 0.075, 0.055);
  const spokeGeometry = new THREE.BoxGeometry(spokeLength, spokeWidth, thickness * 0.82);
  spokeGeometry.translate(spokeLength * 0.5 + hubOuter - radius * 0.025, 0, 0);

  for (let i = 0; i < spokes; i++) {
    const spoke = new THREE.Mesh(spokeGeometry, hubMaterial);
    spoke.rotation.z = i / spokes * Math.PI * 2;
    group.add(spoke);
  }

  const axleGeometry = new THREE.CylinderGeometry(hole * 0.61, hole * 0.61, thickness * 2.7, 24);
  axleGeometry.rotateX(Math.PI / 2);
  const axle = new THREE.Mesh(axleGeometry, steel);
  group.add(axle);

  const capGeometry = new THREE.CylinderGeometry(hole * 0.88, hole * 0.88, thickness * 0.22, 32);
  capGeometry.rotateX(Math.PI / 2);
  const capFront = new THREE.Mesh(capGeometry, brightBrass);
  capFront.position.z = thickness * 1.47;
  const capBack = capFront.clone();
  capBack.position.z = -thickness * 1.47;
  group.add(capFront, capBack);

  setShadow(group);
  return group;
}

function placeGear(config) {
  const gear = createGear(config);
  gear.position.copy(config.position);
  gear.rotation.set(config.rotation.x, config.rotation.y, config.rotation.z);
  gear.userData.baseZ = gear.rotation.z;
  sculpture.add(gear);
  movingParts.push({
    object: gear,
    speed: config.speed,
    phase: config.phase || 0
  });
  return gear;
}

function addGreatRing(radius, tube, rotation, material) {
  const group = new THREE.Group();
  group.rotation.set(rotation.x, rotation.y, rotation.z);

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(radius, tube, 12, 160),
    material
  );
  group.add(ring);

  const innerBand = new THREE.Mesh(
    new THREE.TorusGeometry(radius - tube * 1.7, tube * 0.3, 8, 144),
    darkBrass
  );
  group.add(innerBand);

  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    const rivet = new THREE.Mesh(
      new THREE.SphereGeometry(tube * 0.58, 12, 8),
      i % 3 === 0 ? copper : brightBrass
    );
    rivet.position.set(Math.cos(a) * radius, Math.sin(a) * radius, tube * 0.25);
    group.add(rivet);
  }

  setShadow(group);
  sculpture.add(group);
  return group;
}

const ringA = addGreatRing(3.02, 0.085, new THREE.Euler(0, 0, 0), brass);
const ringB = addGreatRing(3.02, 0.075, new THREE.Euler(Math.PI / 2, 0, 0), copper);
const ringC = addGreatRing(3.02, 0.07, new THREE.Euler(0, Math.PI / 2, 0), brightBrass);
const ringD = addGreatRing(2.88, 0.035, new THREE.Euler(0.72, 0.62, 0.18), darkBrass);
const ringE = addGreatRing(2.78, 0.032, new THREE.Euler(-0.66, 0.84, -0.42), agedCopper);

movingParts.push(
  { object: ringD, speed: 0.035, axis: 'z' },
  { object: ringE, speed: -0.027, axis: 'z' }
);

placeGear({
  radius: 1.28, teeth: 28, thickness: 0.22, material: brass,
  hubMaterial: brightBrass, spokes: 8, hole: 0.14,
  position: new THREE.Vector3(-0.72, 0.15, 0.78),
  rotation: new THREE.Euler(0.08, -0.1, 0.12),
  speed: 0.24
});
placeGear({
  radius: 0.88, teeth: 20, thickness: 0.19, material: copper,
  hubMaterial: agedCopper, spokes: 6, hole: 0.11,
  position: new THREE.Vector3(1.28, 0.42, 0.89),
  rotation: new THREE.Euler(0.05, 0.08, 0.05),
  speed: -0.36
});
placeGear({
  radius: 0.69, teeth: 16, thickness: 0.17, material: brightBrass,
  hubMaterial: brass, spokes: 5, hole: 0.09,
  position: new THREE.Vector3(0.82, -1.02, 0.96),
  rotation: new THREE.Euler(-0.04, 0.04, 0.02),
  speed: 0.47
});
placeGear({
  radius: 0.53, teeth: 14, thickness: 0.16, material: darkBrass,
  hubMaterial: copper, spokes: 5, hole: 0.075,
  position: new THREE.Vector3(-1.68, -0.76, 0.83),
  rotation: new THREE.Euler(0.12, -0.05, 0.18),
  speed: -0.58
});
placeGear({
  radius: 0.46, teeth: 12, thickness: 0.14, material: copper,
  hubMaterial: brightBrass, spokes: 4, hole: 0.065,
  position: new THREE.Vector3(-1.66, 1.22, 0.62),
  rotation: new THREE.Euler(-0.08, 0.11, 0.09),
  speed: 0.7
});

placeGear({
  radius: 1.04, teeth: 24, thickness: 0.21, material: agedCopper,
  hubMaterial: copper, spokes: 7, hole: 0.13,
  position: new THREE.Vector3(0.52, 0.08, -0.82),
  rotation: new THREE.Euler(0.1, Math.PI, -0.05),
  speed: -0.28
});
placeGear({
  radius: 0.75, teeth: 18, thickness: 0.17, material: brightBrass,
  hubMaterial: brass, spokes: 6, hole: 0.095,
  position: new THREE.Vector3(-1.15, 1.2, -0.93),
  rotation: new THREE.Euler(-0.08, Math.PI + 0.05, 0.12),
  speed: 0.41
});
placeGear({
  radius: 0.58, teeth: 15, thickness: 0.16, material: brass,
  hubMaterial: darkBrass, spokes: 5, hole: 0.08,
  position: new THREE.Vector3(1.52, -0.98, -0.76),
  rotation: new THREE.Euler(0.1, Math.PI - 0.08, -0.12),
  speed: -0.55
});

placeGear({
  radius: 0.83, teeth: 20, thickness: 0.18, material: darkBrass,
  hubMaterial: copper, spokes: 6, hole: 0.11,
  position: new THREE.Vector3(1.72, 0.1, -0.1),
  rotation: new THREE.Euler(0, Math.PI / 2, 0.08),
  speed: 0.33
});
placeGear({
  radius: 0.62, teeth: 16, thickness: 0.16, material: copper,
  hubMaterial: brightBrass, spokes: 5, hole: 0.085,
  position: new THREE.Vector3(1.7, 1.42, -0.2),
  rotation: new THREE.Euler(0.05, Math.PI / 2, -0.08),
  speed: -0.48
});
placeGear({
  radius: 0.74, teeth: 18, thickness: 0.18, material: brass,
  hubMaterial: brightBrass, spokes: 6, hole: 0.1,
  position: new THREE.Vector3(-1.7, -0.05, -0.23),
  rotation: new THREE.Euler(0.06, Math.PI / 2, 0.04),
  speed: -0.39
});
placeGear({
  radius: 0.49, teeth: 13, thickness: 0.14, material: brightBrass,
  hubMaterial: copper, spokes: 5, hole: 0.07,
  position: new THREE.Vector3(-1.78, -1.25, 0.18),
  rotation: new THREE.Euler(-0.07, Math.PI / 2, 0.1),
  speed: 0.63
});

placeGear({
  radius: 0.66, teeth: 17, thickness: 0.17, material: copper,
  hubMaterial: agedCopper, spokes: 5, hole: 0.09,
  position: new THREE.Vector3(0.14, 1.72, 0.25),
  rotation: new THREE.Euler(Math.PI / 2, 0.05, 0),
  speed: 0.45
});
placeGear({
  radius: 0.56, teeth: 15, thickness: 0.15, material: brightBrass,
  hubMaterial: brass, spokes: 5, hole: 0.075,
  position: new THREE.Vector3(-0.58, -1.75, -0.16),
  rotation: new THREE.Euler(Math.PI / 2, -0.08, 0.08),
  speed: -0.54
});

const coreGroup = new THREE.Group();
sculpture.add(coreGroup);

const core = new THREE.Mesh(
  new THREE.SphereGeometry(0.43, 48, 32),
  coreMaterial
);
core.castShadow = true;
core.receiveShadow = true;
coreGroup.add(core);

const coreCage1 = new THREE.Mesh(
  new THREE.TorusGeometry(0.61, 0.026, 10, 96),
  steel
);
const coreCage2 = coreCage1.clone();
coreCage2.rotation.x = Math.PI / 2;
const coreCage3 = coreCage1.clone();
coreCage3.rotation.y = Math.PI / 2;
coreGroup.add(coreCage1, coreCage2, coreCage3);

for (let i = 0; i < 8; i++) {
  const a = i / 8 * Math.PI * 2;
  const bearing = new THREE.Mesh(
    new THREE.SphereGeometry(0.065, 16, 10),
    i % 2 === 0 ? copper : brightBrass
  );
  bearing.position.set(Math.cos(a) * 0.59, Math.sin(a) * 0.59, 0);
  bearing.castShadow = true;
  coreGroup.add(bearing);
}

function addAxle(start, end, radius, material) {
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const midpoint = new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5);
  const geometry = new THREE.CylinderGeometry(radius, radius, length, 16);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(midpoint);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.clone().normalize()
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  sculpture.add(mesh);
}

addAxle(new THREE.Vector3(-2.65, 0, 0), new THREE.Vector3(2.65, 0, 0), 0.035, steel);
addAxle(new THREE.Vector3(0, -2.62, 0), new THREE.Vector3(0, 2.62, 0), 0.032, darkBrass);
addAxle(new THREE.Vector3(0, 0, -2.58), new THREE.Vector3(0, 0, 2.58), 0.03, copper);

const collarGeometry = new THREE.CylinderGeometry(0.11, 0.11, 0.17, 24);
for (const axis of ['x', 'y', 'z']) {
  for (const sign of [-1, 1]) {
    const collar = new THREE.Mesh(collarGeometry, brightBrass);
    if (axis === 'x') {
      collar.rotation.z = Math.PI / 2;
      collar.position.x = sign * 2.64;
    } else if (axis === 'y') {
      collar.position.y = sign * 2.62;
    } else {
      collar.rotation.x = Math.PI / 2;
      collar.position.z = sign * 2.6;
    }
    collar.castShadow = true;
    sculpture.add(collar);
  }
}

const ambient = new THREE.HemisphereLight(0xc9b98e, 0x120d09, 1.35);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffd89a, 4.1);
keyLight.position.set(5, 7, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -6;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 25;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x6d8fc9, 2.0);
rimLight.position.set(-6, 2, -5);
scene.add(rimLight);

const warmLight = new THREE.PointLight(0xff6b2e, 17, 13, 2);
warmLight.position.set(-3.2, -2.1, 3.6);
scene.add(warmLight);

const topLight = new THREE.SpotLight(0xffe4b6, 30, 18, Math.PI / 5, 0.55, 1.7);
topLight.position.set(1, 7, 1);
topLight.target.position.set(0, 0, 0);
topLight.castShadow = true;
topLight.shadow.mapSize.set(1024, 1024);
scene.add(topLight, topLight.target);

const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(28, 28),
  new THREE.MeshStandardMaterial({
    color: 0x0c0907,
    roughness: 0.93,
    metalness: 0.05
  })
);
backdrop.rotation.x = -Math.PI / 2;
backdrop.position.y = -3.72;
backdrop.receiveShadow = true;
scene.add(backdrop);

const pedestalShadow = new THREE.Mesh(
  new THREE.CircleGeometry(3.5, 64),
  new THREE.MeshBasicMaterial({
    color: 0x000000,
    transparent: true,
    opacity: 0.3,
    depthWrite: false
  })
);
pedestalShadow.rotation.x = -Math.PI / 2;
pedestalShadow.position.y = -3.7;
scene.add(pedestalShadow);

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;

  for (const part of movingParts) {
    if (part.axis === 'z') {
      part.object.rotation.z += part.speed * delta;
    } else {
      part.object.rotation.z += part.speed * delta;
    }
  }

  coreGroup.rotation.y += delta * 0.16;
  coreGroup.rotation.x = Math.sin(elapsed * 0.38) * 0.08;
  core.scale.setScalar(1 + Math.sin(elapsed * 1.7) * 0.012);

  ringA.rotation.z = Math.sin(elapsed * 0.15) * 0.025;
  ringB.rotation.x = Math.PI / 2 + Math.sin(elapsed * 0.13) * 0.025;
  ringC.rotation.y = Math.PI / 2 + Math.cos(elapsed * 0.12) * 0.022;

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

animate();
</script>
</body>
</html>
