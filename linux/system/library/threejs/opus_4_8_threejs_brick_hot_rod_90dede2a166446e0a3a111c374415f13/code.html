<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Hot Rod</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17191d; }
  #info {
    position: fixed; left: 14px; bottom: 12px; z-index: 10;
    font: 12px/1.4 -apple-system, Segoe UI, Roboto, sans-serif;
    color: #b9c1cc; letter-spacing: .04em; user-select: none; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="info">BRICK HOT ROD — drag to orbit · scroll to zoom</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------------------------------------------------------------- renderer */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

/* ---------------------------------------------------------------- scene */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x191b1f);
scene.fog = new THREE.Fog(0x191b1f, 26, 52);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------------------------------------------------------------- camera */
const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(10.5, 6.2, 12.5);

/* ---------------------------------------------------------------- controls */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.minDistance = 9;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 2.5, 0);

/* ---------------------------------------------------------------- lighting */
scene.add(new THREE.HemisphereLight(0x9db3d8, 0x161009, 0.55));

const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(8, 13, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 45;
key.shadow.camera.left = -11; key.shadow.camera.right = 11;
key.shadow.camera.top = 11; key.shadow.camera.bottom = -11;
key.shadow.bias = -0.0003;
key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd2ff, 0.55);
fill.position.set(-10, 6, 5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffe0b8, 0.9);
rim.position.set(-5, 8, -11);
scene.add(rim);

/* ---------------------------------------------------------------- ground (shadow only) */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(46, 64),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------- materials */
const redMat    = new THREE.MeshPhysicalMaterial({ color: 0xcf1a15, roughness: 0.30, metalness: 0.0, clearcoat: 1.0, clearcoatRoughness: 0.16, envMapIntensity: 1.0 });
const blackMat  = new THREE.MeshPhysicalMaterial({ color: 0x15171c, roughness: 0.34, metalness: 0.0, clearcoat: 1.0, clearcoatRoughness: 0.24, envMapIntensity: 0.9 });
const chromeMat = new THREE.MeshStandardMaterial({ color: 0xf3f6f9, roughness: 0.07, metalness: 1.0, envMapIntensity: 1.5 });
const metalMat  = new THREE.MeshStandardMaterial({ color: 0x9aa3ae, roughness: 0.26, metalness: 0.9, envMapIntensity: 1.15 });
const tireMat   = new THREE.MeshStandardMaterial({ color: 0x0b0b0e, roughness: 0.86, metalness: 0.0, envMapIntensity: 0.3 });
const orangeMat = new THREE.MeshStandardMaterial({ color: 0xff5a1f, roughness: 0.34, metalness: 0.0, emissive: 0x240900, envMapIntensity: 0.7 });
const yellowMat = new THREE.MeshStandardMaterial({ color: 0xffc21a, roughness: 0.34, metalness: 0.0, emissive: 0x2c1500, envMapIntensity: 0.7 });
const glassMat  = new THREE.MeshPhysicalMaterial({ color: 0xa6d4ec, roughness: 0.06, metalness: 0.0, transmission: 0.85, transparent: true, opacity: 0.55, thickness: 0.3, envMapIntensity: 1.0 });
const lensMat   = new THREE.MeshStandardMaterial({ color: 0xfff4d8, roughness: 0.2, emissive: 0x5a4600, emissiveIntensity: 0.5 });

/* ---------------------------------------------------------------- brick builder */
const U = 1.0;          // stud pitch
const STUD_R = 0.30;
const STUD_H = 0.16;

function makeBrick(w, d, h, mat, studs = true) {
  const parts = [];
  const box = new THREE.BoxGeometry(w, h, d);
  box.translate(0, h / 2, 0);
  parts.push(box);

  if (studs) {
    const nx = Math.max(1, Math.round(w / U));
    const nz = Math.max(1, Math.round(d / U));
    const sx = w / nx, sz = d / nz;
    const base = new THREE.CylinderGeometry(STUD_R, STUD_R, STUD_H, 14);
    for (let i = 0; i < nx; i++) {
      for (let j = 0; j < nz; j++) {
        const g = base.clone();
        g.translate(-w / 2 + sx * (i + 0.5), h + STUD_H / 2 - 0.02, -d / 2 + sz * (j + 0.5));
        parts.push(g);
      }
    }
  }
  const mesh = new THREE.Mesh(mergeGeometries(parts, false), mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const car = new THREE.Group();
scene.add(car);

function B(w, d, h, mat, x, y, z, studs = true) {
  const m = makeBrick(w, d, h, mat, studs);
  m.position.set(x, y, z);
  car.add(m);
  return m;
}

/* cylinder-between-two-points helper */
function tube(a, b, r, mat, seg = 18) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  m.castShadow = true; m.receiveShadow = true;
  car.add(m);
  return m;
}
function addMesh(mesh, x, y, z) { mesh.position.set(x, y, z); mesh.castShadow = true; mesh.receiveShadow = true; car.add(mesh); return mesh; }

/* ---------------------------------------------------------------- constants */
const FT = 1.7; // body base (floor top)

/* ---------------------------------------------------------------- chassis / sills */
B(4.2, 10.6, 0.4, blackMat, 0, 1.30, -0.2, false);   // floor pan
B(0.55, 8.6, 0.7, blackMat, -1.98, 1.02, -0.4, false); // left sill
B(0.55, 8.6, 0.7, blackMat,  1.98, 1.02, -0.4, false); // right sill

/* ---------------------------------------------------------------- bucket cabin (red) */
B(4.2, 0.8, 1.9, redMat, 0, FT, -2.6);       // rear wall
B(0.7, 3.2, 1.4, redMat, -1.75, FT, -1.0);   // left wall
B(0.7, 3.2, 1.4, redMat,  1.75, FT, -1.0);   // right wall
B(4.2, 0.9, 1.15, redMat, 0, FT, 0.55);      // cowl / dash
B(4.2, 1.6, 1.25, redMat, 0, FT, -3.85);     // tail
B(3.6, 1.5, 0.4, redMat, 0, FT + 1.25, -3.85); // tail cap

/* interior */
B(2.6, 1.4, 0.8, blackMat, 0, FT, -1.5);     // seat base
B(2.6, 0.45, 1.2, blackMat, 0, FT, -2.15);   // seat back

/* steering */
tube(new THREE.Vector3(0, FT + 0.5, -0.3), new THREE.Vector3(0, FT + 1.15, 0.35), 0.06, chromeMat);
const wheelSteer = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.055, 12, 28), chromeMat);
wheelSteer.rotation.x = Math.PI / 2 - 0.55;
addMesh(wheelSteer, 0, FT + 1.18, 0.4);

/* ---------------------------------------------------------------- hood + engine bay */
B(0.7, 3.3, 1.25, redMat, -1.75, FT, 2.5);   // left hood side
B(0.7, 3.3, 1.25, redMat,  1.75, FT, 2.5);   // right hood side
B(4.2, 0.8, 1.7, redMat, 0, FT, 4.35);       // front grille surround

/* engine block (pokes through hood) */
B(2.2, 2.9, 1.5, blackMat, 0, FT, 2.45);
B(2.0, 2.3, 1.2, blackMat, 0, FT + 1.5, 2.45);
B(0.45, 2.2, 0.5, chromeMat, -0.92, FT + 1.55, 2.45, false); // valve cover L
B(0.45, 2.2, 0.5, chromeMat,  0.92, FT + 1.55, 2.45, false); // valve cover R
B(1.5, 1.5, 1.0, metalMat, 0, FT + 2.7, 2.55, false);        // supercharger

/* blower pulley */
const pulley = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.3, 28), chromeMat);
pulley.rotation.x = Math.PI / 2;
addMesh(pulley, 0, FT + 2.85, 3.45);

/* velocity stacks (chrome injector trumpets) */
const stackGeo = new THREE.CylinderGeometry(0.22, 0.14, 0.5, 18, 1, true);
for (const sx of [-0.5, -0.17, 0.17, 0.5]) {
  for (const sz of [2.25, 2.85]) {
    const t = new THREE.Mesh(stackGeo, chromeMat);
    addMesh(t, sx, FT + 3.7 + 0.25, sz);
  }
}

/* ---------------------------------------------------------------- windshield */
B(0.28, 0.3, 1.4, chromeMat, -1.55, FT + 1.15, 1.0, false);
B(0.28, 0.3, 1.4, chromeMat,  1.55, FT + 1.15, 1.0, false);
B(3.3, 0.32, 0.28, chromeMat, 0, FT + 2.55, 1.0, false);
const glass = new THREE.Mesh(new THREE.BoxGeometry(3.05, 1.35, 0.1), glassMat);
addMesh(glass, 0, FT + 1.85, 1.02);

/* ---------------------------------------------------------------- front detailing */
/* grille */
B(3.0, 0.25, 1.2, chromeMat, 0, FT + 0.15, 4.78, false);
B(2.8, 0.2, 1.05, blackMat, 0, FT + 0.2, 4.74, false);
for (let i = 0; i < 7; i++) {
  B(0.09, 0.28, 1.0, chromeMat, -1.2 + i * 0.4, FT + 0.24, 4.82, false);
}
/* headlights */
for (const s of [-1, 1]) {
  tube(new THREE.Vector3(s * 1.55, FT + 0.7, 4.15), new THREE.Vector3(s * 1.55, FT + 1.5, 4.35), 0.07, chromeMat);
  const hl = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.45, 24), chromeMat);
  hl.rotation.x = Math.PI / 2;
  addMesh(hl, s * 1.55, FT + 1.55, 4.55);
  const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.06, 24), lensMat);
  lens.rotation.x = Math.PI / 2;
  addMesh(lens, s * 1.55, FT + 1.55, 4.79);
}
/* bumpers */
const fB = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 3.9, 20), chromeMat);
fB.rotation.z = Math.PI / 2; addMesh(fB, 0, FT - 0.05, 4.95);
const rB = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 3.9, 20), chromeMat);
rB.rotation.z = Math.PI / 2; addMesh(rB, 0, FT - 0.05, -4.75);

/* taillights */
for (const s of [-1, 1]) {
  const tl = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.3, 20),
    new THREE.MeshStandardMaterial({ color: 0xff2a1a, emissive: 0x3a0300, roughness: 0.3 }));
  tl.rotation.x = Math.PI / 2;
  addMesh(tl, s * 1.3, FT + 0.55, -4.68);
}

/* ---------------------------------------------------------------- chrome exhaust (flank sides) */
function exhaustSide(s) {
  // main collector pipe running along the body
  tube(new THREE.Vector3(s * 2.3, FT + 0.5, 3.6), new THREE.Vector3(s * 2.3, FT + 0.45, -0.6), 0.28, chromeMat);
  // swept back tip
  tube(new THREE.Vector3(s * 2.3, FT + 0.45, -0.6), new THREE.Vector3(s * 2.55, FT + 0.75, -1.5), 0.28, chromeMat);
  const tip = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.28, 0.4, 20), chromeMat);
  tip.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3(s * 0.25, 0.3, -0.9).normalize());
  addMesh(tip, s * 2.62, FT + 0.85, -1.75);
  // header pipes from engine to collector
  for (const hz of [1.4, 2.1, 2.8, 3.5]) {
    tube(new THREE.Vector3(s * 1.05, FT + 1.25, hz), new THREE.Vector3(s * 2.3, FT + 0.55, hz), 0.13, chromeMat);
  }
  // clip-on chrome exhaust bricks
  B(0.5, 0.7, 0.55, chromeMat, s * 2.18, FT + 0.72, 1.6);
  B(0.5, 0.7, 0.55, chromeMat, s * 2.18, FT + 0.72, 0.1);
}
exhaustSide(-1);
exhaustSide(1);

/* ---------------------------------------------------------------- studded flame decals */
function flameLayer(L, H, depth, mat) {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.lineTo(0, H * 0.9);
  shape.quadraticCurveTo(L * 0.16, H * 1.06, L * 0.29, H * 0.58);
  shape.quadraticCurveTo(L * 0.40, H * 0.86, L * 0.55, H * 0.44);
  shape.quadraticCurveTo(L * 0.66, H * 0.70, L * 0.80, H * 0.30);
  shape.quadraticCurveTo(L * 0.90, H * 0.52, L, H * 0.10);
  shape.lineTo(L, 0);
  shape.lineTo(0, 0);
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, steps: 1, curveSegments: 14 });
  const m = new THREE.Mesh(geo, mat);
  m.rotation.y = Math.PI / 2;
  return m;
}
function makeFlames(L, H) {
  const g = new THREE.Group();
  g.add(flameLayer(L, H, 0.12, orangeMat));
  const inner = flameLayer(L * 0.62, H * 0.6, 0.16, yellowMat);
  inner.position.set(0.05, H * 0.16, -L * 0.16);
  g.add(inner);
  const studGeo = new THREE.CylinderGeometry(0.15, 0.15, 0.14, 14);
  const pts = [[0.5, 0.40], [1.2, 0.50], [1.9, 0.42], [2.6, 0.34], [3.3, 0.24]];
  for (const [a, bf] of pts) {
    if (a > L) continue;
    const st = new THREE.Mesh(studGeo, yellowMat);
    st.rotation.z = Math.PI / 2;
    st.position.set(0.20, H * bf, -a);
    g.add(st);
  }
  return g;
}
const flR = makeFlames(4.2, 1.15); flR.position.set(2.12, FT + 0.12, 3.9); car.add(flR);
const flL = makeFlames(4.2, 1.15); flL.position.set(-2.12, FT + 0.12, 3.9); flL.scale.x = -1; car.add(flL);

/* ---------------------------------------------------------------- wheels */
function makeWheel(R, width, rimMat) {
  const g = new THREE.Group();
  const tire = new THREE.Mesh(new THREE.CylinderGeometry(R, R, width, 48), tireMat);
  tire.rotation.z = Math.PI / 2; tire.castShadow = true; tire.receiveShadow = true;
  g.add(tire);

  const rimR = R * 0.62;
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(rimR, rimR, width * 1.02, 40), rimMat);
  rim.rotation.z = Math.PI / 2; rim.castShadow = true; rim.receiveShadow = true;
  g.add(rim);

  const cap = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.2, R * 0.2, width * 1.08, 22), rimMat);
  cap.rotation.z = Math.PI / 2; g.add(cap);

  for (const side of [1, -1]) {
    for (let k = 0; k < 6; k++) {
      const ang = k / 6 * Math.PI * 2;
      const hole = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.09, R * 0.09, 0.14, 12), tireMat);
      hole.rotation.z = Math.PI / 2;
      hole.position.set(side * width * 0.51, Math.sin(ang) * R * 0.4, Math.cos(ang) * R * 0.4);
      g.add(hole);
    }
  }
  return g;
}
const rearL = makeWheel(1.75, 1.7, chromeMat); rearL.position.set(-2.95, 1.75, -3.4); car.add(rearL);
const rearR = makeWheel(1.75, 1.7, chromeMat); rearR.position.set( 2.95, 1.75, -3.4); car.add(rearR);
const frontL = makeWheel(1.15, 0.95, chromeMat); frontL.position.set(-2.95, 1.15, 4.0); car.add(frontL);
const frontR = makeWheel(1.15, 0.95, chromeMat); frontR.position.set( 2.95, 1.15, 4.0); car.add(frontR);

/* axles */
tube(new THREE.Vector3(-2.9, 1.75, -3.4), new THREE.Vector3(2.9, 1.75, -3.4), 0.18, chromeMat);
const diff = new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 16), chromeMat); addMesh(diff, 0, 1.75, -3.4);
tube(new THREE.Vector3(-2.9, 1.15, 4.0), new THREE.Vector3(2.9, 1.15, 4.0), 0.12, chromeMat);
B(3.4, 0.4, 0.15, chromeMat, 0, 1.22, 4.0, false); // front leaf spring hint

/* ---------------------------------------------------------------- resize */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

/* ---------------------------------------------------------------- animate */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
