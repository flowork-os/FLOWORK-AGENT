<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inflatable Boombox</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(circle at 50% 35%, #f8f3e8 0%, #cfd8dc 58%, #88979d 100%);
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9e2e3);
scene.fog = new THREE.Fog(0xd9e2e3, 18, 34);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(10.5, 7.2, 14.5);
camera.lookAt(0, 1.8, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 10;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xf9fdff, 0x5d6870, 2.4));

const key = new THREE.DirectionalLight(0xfff4de, 4.3);
key.position.set(-7, 10, 9);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -10;
key.shadow.camera.right = 10;
key.shadow.camera.top = 10;
key.shadow.camera.bottom = -10;
key.shadow.camera.near = 1;
key.shadow.camera.far = 30;
key.shadow.bias = -0.0003;
scene.add(key);

const rim = new THREE.DirectionalLight(0x72cfff, 3.2);
rim.position.set(8, 6, -8);
scene.add(rim);

const fill = new THREE.PointLight(0xff78bd, 18, 22, 2);
fill.position.set(-8, 3, 3);
scene.add(fill);

const floorMat = new THREE.MeshStandardMaterial({
  color: 0xaebcbf,
  roughness: 0.7,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(25, 96), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.31;
floor.receiveShadow = true;
scene.add(floor);

const boombox = new THREE.Group();
boombox.rotation.y = -0.08;
boombox.position.y = 0.05;
scene.add(boombox);

const vinylMat = new THREE.MeshPhysicalMaterial({
  color: 0xf15a91,
  roughness: 0.2,
  metalness: 0,
  clearcoat: 1,
  clearcoatRoughness: 0.14,
  sheen: 0.55,
  sheenColor: new THREE.Color(0xff9bc0)
});
const seamMat = new THREE.MeshPhysicalMaterial({
  color: 0xff82ad,
  roughness: 0.24,
  clearcoat: 0.9,
  clearcoatRoughness: 0.18
});
const darkMat = new THREE.MeshPhysicalMaterial({
  color: 0x242a31,
  roughness: 0.3,
  clearcoat: 0.55,
  clearcoatRoughness: 0.24
});
const coneMat = new THREE.MeshPhysicalMaterial({
  color: 0x3a424b,
  roughness: 0.44,
  clearcoat: 0.25
});
const printMat = new THREE.MeshStandardMaterial({
  color: 0x11161c,
  roughness: 0.5
});
const palePrintMat = new THREE.MeshStandardMaterial({
  color: 0xf8b2ca,
  roughness: 0.4
});
const cassetteMat = new THREE.MeshPhysicalMaterial({
  color: 0x35414b,
  roughness: 0.2,
  clearcoat: 0.9,
  clearcoatRoughness: 0.15,
  transparent: true,
  opacity: 0.94
});
const chromeMat = new THREE.MeshStandardMaterial({
  color: 0xd8e5e8,
  metalness: 0.65,
  roughness: 0.2
});

function shadow(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function roundedBox(w, h, d, radius, segments, material) {
  const mesh = new THREE.Mesh(
    new RoundedBoxGeometry(w, h, d, segments, radius),
    material
  );
  return shadow(mesh);
}

function capsuleBetween(a, b, radius, material, radialSegments = 14) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const direction = end.clone().sub(start);
  const length = direction.length();
  const geometry = new THREE.CapsuleGeometry(radius, Math.max(0.001, length - radius * 2), 6, radialSegments);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  return shadow(mesh);
}

function torus(radius, tube, material, position, rotation = [0, 0, 0], arc = Math.PI * 2) {
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 14, 72, arc), material);
  mesh.position.set(...position);
  mesh.rotation.set(...rotation);
  return shadow(mesh);
}

const body = roundedBox(10.2, 5.75, 3.15, 0.72, 8, vinylMat);
body.scale.set(1, 0.98, 1);
body.position.y = 0.15;
boombox.add(body);

const lowerSag = roundedBox(8.8, 0.72, 3.25, 0.35, 6, seamMat);
lowerSag.position.set(0.2, -2.46, -0.02);
lowerSag.scale.set(1, 0.82, 1.01);
boombox.add(lowerSag);

const frontZ = 1.61;
const edgeTube = 0.155;
boombox.add(capsuleBetween([-4.35, 2.52, frontZ + 0.11], [4.35, 2.52, frontZ + 0.11], edgeTube, seamMat));
boombox.add(capsuleBetween([-4.35, -2.18, frontZ + 0.11], [4.35, -2.18, frontZ + 0.11], edgeTube, seamMat));
boombox.add(capsuleBetween([-4.88, -1.65, frontZ + 0.11], [-4.88, 1.98, frontZ + 0.11], edgeTube, seamMat));
boombox.add(capsuleBetween([4.88, -1.65, frontZ + 0.11], [4.88, 1.98, frontZ + 0.11], edgeTube, seamMat));

for (const x of [-4.76, 4.76]) {
  boombox.add(torus(0.54, edgeTube, seamMat, [x > 0 ? x - 0.53 : x + 0.53, 1.99, frontZ + 0.11], [0, 0, x > 0 ? -Math.PI / 2 : Math.PI / 2], Math.PI / 2));
  boombox.add(torus(0.54, edgeTube, seamMat, [x > 0 ? x - 0.53 : x + 0.53, -1.65, frontZ + 0.11], [0, 0, x > 0 ? Math.PI : 0], Math.PI / 2));
}

function createSpeaker(x) {
  const group = new THREE.Group();
  group.position.set(x, -0.25, frontZ + 0.16);

  const stitchedRim = new THREE.Mesh(
    new THREE.TorusGeometry(1.72, 0.19, 16, 80),
    seamMat
  );
  shadow(stitchedRim);
  group.add(stitchedRim);

  const outerDisc = new THREE.Mesh(
    new THREE.CylinderGeometry(1.58, 1.63, 0.23, 64),
    darkMat
  );
  outerDisc.rotation.x = Math.PI / 2;
  outerDisc.position.z = 0.03;
  shadow(outerDisc);
  group.add(outerDisc);

  const cone = new THREE.Mesh(
    new THREE.CylinderGeometry(0.52, 1.39, 0.2, 64, 1, false),
    coneMat
  );
  cone.rotation.x = Math.PI / 2;
  cone.position.z = 0.22;
  shadow(cone);
  group.add(cone);

  const center = new THREE.Mesh(
    new THREE.SphereGeometry(0.58, 36, 20, 0, Math.PI * 2, 0, Math.PI * 0.52),
    printMat
  );
  center.rotation.x = -Math.PI / 2;
  center.position.z = 0.35;
  center.scale.z = 0.62;
  shadow(center);
  group.add(center);

  for (const ringRadius of [0.82, 1.1, 1.38]) {
    group.add(torus(ringRadius, 0.025, palePrintMat, [0, 0, 0.36]));
  }

  const stitchCount = 28;
  for (let i = 0; i < stitchCount; i++) {
    const angle = i / stitchCount * Math.PI * 2;
    const stitch = roundedBox(0.22, 0.055, 0.055, 0.025, 3, palePrintMat);
    stitch.position.set(Math.cos(angle) * 1.71, Math.sin(angle) * 1.71, 0.2);
    stitch.rotation.z = angle + Math.PI / 2;
    group.add(stitch);
  }

  boombox.add(group);
}

createSpeaker(-3.1);
createSpeaker(3.1);

const centerPanel = roundedBox(2.42, 3.74, 0.38, 0.38, 7, seamMat);
centerPanel.position.set(0, -0.18, frontZ + 0.16);
boombox.add(centerPanel);

const cassette = roundedBox(1.95, 1.82, 0.47, 0.28, 7, cassetteMat);
cassette.position.set(0, -0.44, frontZ + 0.43);
cassette.rotation.x = -0.055;
boombox.add(cassette);

const cassetteInset = roundedBox(1.4, 1.2, 0.12, 0.2, 5, printMat);
cassetteInset.position.set(0, -0.45, frontZ + 0.72);
boombox.add(cassetteInset);

for (const x of [-0.45, 0.45]) {
  const reel = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.1, 32), palePrintMat);
  reel.rotation.x = Math.PI / 2;
  reel.position.set(x, -0.42, frontZ + 0.81);
  shadow(reel);
  boombox.add(reel);

  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.12, 12), darkMat);
  hub.rotation.x = Math.PI / 2;
  hub.position.set(x, -0.42, frontZ + 0.88);
  boombox.add(hub);
}

const tapeWindow = roundedBox(1.22, 0.3, 0.09, 0.1, 4, palePrintMat);
tapeWindow.position.set(0, -1.05, frontZ + 0.83);
boombox.add(tapeWindow);

const display = roundedBox(1.55, 0.48, 0.18, 0.16, 5, darkMat);
display.position.set(0, 1.33, frontZ + 0.47);
boombox.add(display);

for (let i = 0; i < 8; i++) {
  const bar = roundedBox(0.1, 0.16 + (i % 4) * 0.045, 0.035, 0.025, 3, palePrintMat);
  bar.position.set(-0.55 + i * 0.16, 1.32, frontZ + 0.58);
  boombox.add(bar);
}

const frontButtons = [];
for (let i = 0; i < 3; i++) {
  const button = roundedBox(0.48, 0.38, 0.3, 0.16, 5, i === 1 ? chromeMat : palePrintMat);
  button.position.set(-0.58 + i * 0.58, 0.72, frontZ + 0.55);
  button.rotation.x = -0.08;
  frontButtons.push(button);
  boombox.add(button);
}

for (let row = 0; row < 9; row++) {
  const y = 2.02 - row * 0.47;
  const rib = capsuleBetween([-4.72, y, frontZ + 0.25], [4.72, y, frontZ + 0.25], 0.055, seamMat, 10);
  rib.scale.x = 0.995 - Math.abs(y) * 0.003;
  boombox.add(rib);
}

const topY = 3.05;
for (let i = 0; i < 5; i++) {
  const topButton = roundedBox(0.72, 0.42, 0.78, 0.2, 6, i === 2 ? chromeMat : seamMat);
  topButton.position.set(-1.75 + i * 0.88, topY, 0.58);
  topButton.rotation.x = 0.08;
  topButton.rotation.z = (i - 2) * 0.015;
  boombox.add(topButton);
}

const antennaKnob = new THREE.Mesh(new THREE.SphereGeometry(0.31, 24, 16), darkMat);
antennaKnob.position.set(3.98, 3.02, 0.72);
antennaKnob.scale.y = 0.72;
shadow(antennaKnob);
boombox.add(antennaKnob);

const handle = new THREE.Group();
handle.position.y = 2.87;
boombox.add(handle);

const handleMat = new THREE.MeshPhysicalMaterial({
  color: 0xf2709d,
  roughness: 0.25,
  clearcoat: 1,
  clearcoatRoughness: 0.16
});

handle.add(capsuleBetween([-3.22, 0, -0.3], [-3.07, 2.0, -0.25], 0.34, handleMat, 18));
handle.add(capsuleBetween([3.22, 0, -0.3], [3.05, 1.9, -0.25], 0.34, handleMat, 18));
handle.add(capsuleBetween([-3.05, 2.0, -0.25], [-2.5, 2.53, -0.22], 0.34, handleMat, 18));
handle.add(capsuleBetween([3.05, 1.9, -0.25], [2.5, 2.47, -0.22], 0.34, handleMat, 18));
handle.add(capsuleBetween([-2.5, 2.53, -0.22], [-0.45, 2.36, -0.2], 0.34, handleMat, 18));
handle.add(capsuleBetween([-0.45, 2.36, -0.2], [0.55, 2.25, -0.2], 0.34, handleMat, 18));
handle.add(capsuleBetween([0.55, 2.25, -0.2], [2.5, 2.47, -0.22], 0.34, handleMat, 18));

for (const x of [-3.2, 3.2]) {
  const mount = new THREE.Mesh(new THREE.TorusGeometry(0.47, 0.16, 14, 48), seamMat);
  mount.rotation.x = Math.PI / 2;
  mount.position.set(x, 0.05, -0.29);
  shadow(mount);
  handle.add(mount);
}

const valveStem = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.42, 24), seamMat);
valveStem.rotation.z = Math.PI / 2;
valveStem.position.set(5.25, -1.4, 0.4);
shadow(valveStem);
boombox.add(valveStem);

const valveCap = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.13, 24), palePrintMat);
valveCap.rotation.z = Math.PI / 2;
valveCap.position.set(5.48, -1.4, 0.4);
shadow(valveCap);
boombox.add(valveCap);

const sideSeamLeft = capsuleBetween([-5.12, -1.7, -1.05], [-5.12, 1.8, -1.05], 0.13, seamMat);
const sideSeamRight = capsuleBetween([5.12, -1.7, -1.05], [5.12, 1.8, -1.05], 0.13, seamMat);
boombox.add(sideSeamLeft, sideSeamRight);

const backTopSeam = capsuleBetween([-4.25, 2.65, -1.36], [4.25, 2.65, -1.36], 0.12, seamMat);
boombox.add(backTopSeam);

for (const x of [-4.15, 4.15]) {
  const foot = roundedBox(1.15, 0.55, 1.65, 0.25, 6, seamMat);
  foot.position.set(x, -2.73, -0.08);
  foot.scale.y = x < 0 ? 0.88 : 0.78;
  boombox.add(foot);
}

const highlightMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  roughness: 0.05,
  transparent: true,
  opacity: 0.32,
  clearcoat: 1,
  depthWrite: false
});

const highlightA = capsuleBetween([-3.9, 2.12, 1.78], [-1.6, 2.34, 1.78], 0.065, highlightMat, 10);
boombox.add(highlightA);
const highlightB = capsuleBetween([1.8, 2.36, 1.78], [3.6, 2.13, 1.78], 0.055, highlightMat, 10);
boombox.add(highlightB);

const shadowBlob = new THREE.Mesh(
  new THREE.CircleGeometry(6.2, 64),
  new THREE.MeshBasicMaterial({
    color: 0x4b5960,
    transparent: true,
    opacity: 0.17,
    depthWrite: false
  })
);
shadowBlob.rotation.x = -Math.PI / 2;
shadowBlob.scale.set(1, 0.38, 1);
shadowBlob.position.set(0, -2.29, 0.4);
scene.add(shadowBlob);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  handle.rotation.z = Math.sin(time * 0.72) * 0.006;
  handle.position.y = 2.87 + Math.sin(time * 0.85) * 0.012;
  valveCap.rotation.x = time * 0.08;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
