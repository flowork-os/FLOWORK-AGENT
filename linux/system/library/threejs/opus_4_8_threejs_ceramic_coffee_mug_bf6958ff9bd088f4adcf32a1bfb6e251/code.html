<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chipped Ceramic Coffee Mug</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #ececef; }
  #app { width: 100vw; height: 100vh; display: block; }
</style>

<!-- three.js + OrbitControls via importmap (jsDelivr CDN, three@0.160.0) -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="app"></canvas>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ *
 *  All dimensions are in METERS (real-world scale).
 *  The mug is a classic kitchen mug: ~9.5 cm tall, ~8 cm diameter.
 * ------------------------------------------------------------------ */

// ------------------------------------------------------------------
// Renderer
// ------------------------------------------------------------------
const canvas   = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping        = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace   = THREE.SRGBColorSpace;
renderer.shadowMap.enabled  = true;
renderer.shadowMap.type      = THREE.PCFSoftShadowMap;

// ------------------------------------------------------------------
// Scene & camera (studio neutral background)
// ------------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xececef);

const camera = new THREE.PerspectiveCamera(
  40, window.innerWidth / window.innerHeight, 0.01, 20
);

// ------------------------------------------------------------------
// Lighting: hemisphere fill + directional key (shadow) + soft fill
// ------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0xffffff, 0xbfb7ab, 0.55);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff6ec, 2.4);
keyLight.position.set(0.28, 0.42, 0.24);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near   = 0.05;
keyLight.shadow.camera.far    = 2.0;
keyLight.shadow.camera.left   = -0.16;
keyLight.shadow.camera.right  =  0.16;
keyLight.shadow.camera.top    =  0.16;
keyLight.shadow.camera.bottom = -0.16;
keyLight.shadow.bias          = -0.0004;
keyLight.shadow.radius        = 3;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xdfe6ff, 0.5);
fillLight.position.set(-0.3, 0.22, -0.25);
scene.add(fillLight);

// ------------------------------------------------------------------
// Ground / contact-shadow plane (the mug rests on this at y = 0)
// ------------------------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  new THREE.MeshStandardMaterial({ color: 0xdedee1, roughness: 0.95, metalness: 0.0 })
);
ground.name = 'groundPlane';
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ==================================================================
//  MATERIALS
// ==================================================================

// Glazed off-white ceramic (glossy glaze -> clearcoat sheen)
const glazeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xf3ede1,
  roughness: 0.35,
  metalness: 0.0,
  clearcoat: 0.7,
  clearcoatRoughness: 0.22,
  sheen: 0.15,
  sheenColor: 0xffffff
});

// Exposed unglazed bisque where the chip broke off (matte, warmer)
const bisqueMaterial = new THREE.MeshStandardMaterial({
  color: 0xdccbb2,
  roughness: 0.95,
  metalness: 0.0
});

// ==================================================================
//  MUG BODY  (LatheGeometry from a hand-tuned cross-section)
// ==================================================================
//
//  Profile = Vector2(radius, height).  Traced from the outer base,
//  up the outer wall, over the rim, then down the inner wall to the
//  inner floor.  Revolving this produces a hollow, open-topped mug
//  with a closed bottom.
//
const profile = [
  new THREE.Vector2(0.0000, 0.0000), // base centre (sits on ground)
  new THREE.Vector2(0.0340, 0.0000), // outer base edge
  new THREE.Vector2(0.0372, 0.0040), // foot chamfer
  new THREE.Vector2(0.0388, 0.0120),
  new THREE.Vector2(0.0398, 0.0300),
  new THREE.Vector2(0.0406, 0.0600),
  new THREE.Vector2(0.0410, 0.0860),
  new THREE.Vector2(0.0410, 0.0930), // outer wall near top
  new THREE.Vector2(0.0396, 0.0955), // rim top, outer corner
  new THREE.Vector2(0.0366, 0.0955), // rim top, inner corner
  new THREE.Vector2(0.0370, 0.0900), // inner wall top
  new THREE.Vector2(0.0364, 0.0600),
  new THREE.Vector2(0.0354, 0.0300),
  new THREE.Vector2(0.0344, 0.0140), // inner floor fillet
  new THREE.Vector2(0.0300, 0.0080),
  new THREE.Vector2(0.0000, 0.0080)  // inner floor centre
];

const RADIAL_SEGMENTS = 200;
const bodyGeo = new THREE.LatheGeometry(profile, RADIAL_SEGMENTS);

// ---- Post-process the rim: slight unevenness + one broken chip ----
const RIM_Y      = 0.0955;                 // top of rim
const RIM_ZONE   = 0.0840;                 // vertices above this are "rim"
const CHIP_ANGLE = Math.PI * 0.5;          // chip faces +Z (front)
const CHIP_WIDTH = 0.24;                    // angular half-width of chip
const pos = bodyGeo.attributes.position;
const v   = new THREE.Vector3();

for (let i = 0; i < pos.count; i++) {
  v.fromBufferAttribute(pos, i);
  if (v.y <= RIM_ZONE) continue;             // only touch the rim band

  const theta   = Math.atan2(v.z, v.x);      // angle around the mug
  const topness = (v.y - RIM_ZONE) / (RIM_Y - RIM_ZONE); // 0..1 near rim

  // (a) gently uneven, hand-thrown rim
  const wobble = 0.0011 * Math.sin(theta * 3.0 + 0.6)
               + 0.0006 * Math.sin(theta * 7.0 + 2.1);
  v.y += wobble * topness;

  // (b) a small chipped notch at CHIP_ANGLE
  let d = Math.abs(theta - CHIP_ANGLE);
  d = Math.min(d, Math.PI * 2 - d);          // wrap-around distance
  if (d < CHIP_WIDTH) {
    const f = 0.5 * (1.0 + Math.cos(Math.PI * d / CHIP_WIDTH)); // 1 centre -> 0 edge
    v.y -= 0.0135 * f * topness;              // dip the rim down (bite taken out)
    const r  = Math.hypot(v.x, v.z);          // pull slightly inward for a jagged look
    const nr = r - 0.0022 * f * topness;
    if (r > 1e-6) { v.x *= nr / r; v.z *= nr / r; }
  }
  pos.setXYZ(i, v.x, v.y, v.z);
}
bodyGeo.computeVertexNormals();

const mugBody = new THREE.Mesh(bodyGeo, glazeMaterial);
mugBody.name = 'mugBody';
mugBody.castShadow = true;
mugBody.receiveShadow = true;

// Small matte "exposed ceramic" nub nestled in the chip notch
const chipR = 0.0378;
const chipMesh = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.0058, 0),
  bisqueMaterial
);
chipMesh.name = 'rimChip';
chipMesh.scale.set(1.25, 0.75, 0.5);
chipMesh.position.set(
  chipR * Math.cos(CHIP_ANGLE),
  RIM_Y - 0.0075,
  chipR * Math.sin(CHIP_ANGLE)
);
chipMesh.rotation.set(0.3, CHIP_ANGLE, 0.5);
chipMesh.castShadow = true;

// ==================================================================
//  HANDLE  (thick C-shaped tube swept along a CatmullRom curve)
// ==================================================================
const handleCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.038, 0.082, 0.0),   // upper attach (into the wall)
  new THREE.Vector3(0.058, 0.086, 0.0),
  new THREE.Vector3(0.077, 0.072, 0.0),
  new THREE.Vector3(0.083, 0.050, 0.0),
  new THREE.Vector3(0.075, 0.028, 0.0),
  new THREE.Vector3(0.055, 0.021, 0.0),
  new THREE.Vector3(0.038, 0.028, 0.0)    // lower attach (into the wall)
], false, 'catmullrom', 0.5);

const handleGeo = new THREE.TubeGeometry(handleCurve, 96, 0.0078, 24, false);
const mugHandle = new THREE.Mesh(handleGeo, glazeMaterial);
mugHandle.name = 'mugHandle';
mugHandle.castShadow = true;
mugHandle.receiveShadow = true;

// ==================================================================
//  TEA-STAIN RING  (faint band on the inner wall via CanvasTexture)
// ==================================================================
function makeTeaStainTexture() {
  const size = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(size, size);

  for (let y = 0; y < size; y++) {
    // Two soft horizontal rings (main tide-line + a fainter one below)
    const main  = Math.exp(-((y - 150) ** 2) / (2 * 7 * 7));
    const faint = Math.exp(-((y - 132) ** 2) / (2 * 22 * 22)) * 0.45;
    let base = Math.min(0.42, main * 0.42 + faint * 0.18);

    for (let x = 0; x < size; x++) {
      // uneven staining around the circumference
      const colVar = 0.55
        + 0.45 * (0.5 + 0.5 * Math.sin(x * 0.10 + 1.3))
               * (0.6 + 0.4 * Math.sin(x * 0.031 + 4.0));
      const a = base * colVar;
      const idx = (y * size + x) * 4;
      img.data[idx    ] = 120;   // tea brown
      img.data[idx + 1] = 78;
      img.data[idx + 2] = 45;
      img.data[idx + 3] = Math.round(a * 255);
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const stainGeo = new THREE.CylinderGeometry(0.0362, 0.0356, 0.030, 96, 1, true);
const stainMat = new THREE.MeshStandardMaterial({
  map: makeTeaStainTexture(),
  transparent: true,
  opacity: 0.9,
  roughness: 0.6,
  metalness: 0.0,
  side: THREE.DoubleSide,
  depthWrite: false
});
const teaStain = new THREE.Mesh(stainGeo, stainMat);
teaStain.name = 'teaStainRing';
teaStain.position.y = 0.066;   // sit the ring on the upper inner wall

// ==================================================================
//  ASSEMBLE THE MUG GROUP
// ==================================================================
const mug = new THREE.Group();
mug.name = 'ceramicCoffeeMug';
mug.add(mugBody, mugHandle, chipMesh, teaStain);

// Centre the group horizontally at the origin (compensate for the
// handle) while keeping the base resting exactly on the ground.
const box    = new THREE.Box3().setFromObject(mug);
const center = box.getCenter(new THREE.Vector3());
mug.position.x -= center.x;
mug.position.z -= center.z;
mug.position.y -= box.min.y;   // base -> y = 0
scene.add(mug);

// ==================================================================
//  CAMERA AUTO-FRAMING FROM THE BOUNDING BOX
// ==================================================================
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate     = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 0.12;
controls.maxDistance = 1.2;

function frameObject() {
  const b       = new THREE.Box3().setFromObject(mug);
  const size    = b.getSize(new THREE.Vector3());
  const center  = b.getCenter(new THREE.Vector3());
  const maxDim  = Math.max(size.x, size.y, size.z);
  const fov     = THREE.MathUtils.degToRad(camera.fov);
  const dist    = (maxDim / 2) / Math.tan(fov / 2) * 1.7;

  camera.position.set(
    center.x + dist * 0.72,
    center.y + dist * 0.55,
    center.z + dist * 0.95
  );
  controls.target.copy(center);
  controls.update();
}
frameObject();

// ------------------------------------------------------------------
// Resize handling
// ------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ------------------------------------------------------------------
// Render loop
// ------------------------------------------------------------------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
