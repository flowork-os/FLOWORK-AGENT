<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papercraft King Crab</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #d8e0dc;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8e0dc);
scene.fog = new THREE.Fog(0xd8e0dc, 12, 24);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.6, 5.2, 8.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.85, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 6;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.48;

scene.add(new THREE.HemisphereLight(0xfff6e7, 0x607075, 2.0));

const keyLight = new THREE.DirectionalLight(0xffead4, 4.0);
keyLight.position.set(5, 9, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -8;
keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -7;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 24;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x8eb5c4, 1.45);
fillLight.position.set(-7, 4, -5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffb17a, 1.6);
rimLight.position.set(-2, 6, 8);
scene.add(rimLight);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xcbd5d0,
  roughness: 1,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(10, 72), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.08;
floor.receiveShadow = true;
scene.add(floor);

const crab = new THREE.Group();
crab.rotation.y = -0.08;
scene.add(crab);

const orangePaper = new THREE.MeshStandardMaterial({
  color: 0xd96532,
  roughness: 0.93,
  metalness: 0,
  flatShading: true
});
const lightPaper = new THREE.MeshStandardMaterial({
  color: 0xee8750,
  roughness: 0.96,
  flatShading: true,
  side: THREE.DoubleSide
});
const palePaper = new THREE.MeshStandardMaterial({
  color: 0xffd39c,
  roughness: 0.95,
  flatShading: true
});
const undersidePaper = new THREE.MeshStandardMaterial({
  color: 0x9f3d26,
  roughness: 1,
  flatShading: true
});
const creaseMaterial = new THREE.LineBasicMaterial({
  color: 0x613122,
  transparent: true,
  opacity: 0.88
});
const darkPaper = new THREE.MeshStandardMaterial({
  color: 0x241d1a,
  roughness: 1,
  flatShading: true
});
const highlightPaper = new THREE.MeshStandardMaterial({
  color: 0xfff1d5,
  roughness: 1,
  flatShading: true
});
const speckleMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x8e3224, roughness: 1, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0xf3a071, roughness: 1, side: THREE.DoubleSide }),
  new THREE.MeshStandardMaterial({ color: 0x6f342b, roughness: 1, side: THREE.DoubleSide })
];

function addEdges(mesh, threshold = 12, opacity = 0.78) {
  const material = creaseMaterial.clone();
  material.opacity = opacity;
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(mesh.geometry, threshold),
    material
  );
  edges.renderOrder = 3;
  mesh.add(edges);
  return edges;
}

function castObject(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const shellGeometry = new THREE.IcosahedronGeometry(1, 2);
const shell = castObject(new THREE.Mesh(shellGeometry, orangePaper));
shell.scale.set(2.22, 0.72, 1.62);
shell.position.set(0, 1.13, 0);
shell.rotation.y = Math.PI / 10;
addEdges(shell, 4, 0.7);
crab.add(shell);

const shellRim = castObject(new THREE.Mesh(
  new THREE.CylinderGeometry(1, 1.04, 0.15, 12, 1, false),
  undersidePaper
));
shellRim.scale.set(1.82, 1, 1.28);
shellRim.position.set(0, 0.69, 0.03);
addEdges(shellRim, 10, 0.8);
crab.add(shellRim);

const belly = castObject(new THREE.Mesh(
  new THREE.CylinderGeometry(1, 1, 0.07, 12),
  new THREE.MeshStandardMaterial({
    color: 0xc45530,
    roughness: 1,
    flatShading: true
  })
));
belly.scale.set(1.66, 1, 1.13);
belly.position.set(0, 0.59, 0.02);
addEdges(belly, 8, 0.72);
crab.add(belly);

function addSpeckle(x, z, radius, materialIndex) {
  const a = 2.22;
  const b = 0.72;
  const c = 1.62;
  const radial = Math.max(0.02, 1 - (x * x) / (a * a) - (z * z) / (c * c));
  const y = 1.13 + b * Math.sqrt(radial);
  const normal = new THREE.Vector3(
    x / (a * a),
    (y - 1.13) / (b * b),
    z / (c * c)
  ).normalize();
  const dot = new THREE.Mesh(
    new THREE.CircleGeometry(radius, 7),
    speckleMaterials[materialIndex % speckleMaterials.length]
  );
  dot.position.set(x, y, z).addScaledVector(normal, 0.018);
  dot.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), normal);
  dot.castShadow = true;
  crab.add(dot);
}

[
  [-1.47, 0.18, 0.070, 0], [-1.12, 0.72, 0.052, 1],
  [-0.79, -0.48, 0.060, 0], [-0.62, 0.34, 0.080, 2],
  [-0.24, 0.93, 0.050, 0], [-0.18, -0.58, 0.063, 1],
  [0.13, 0.22, 0.056, 2], [0.43, 0.77, 0.075, 0],
  [0.57, -0.72, 0.048, 2], [0.82, -0.12, 0.068, 1],
  [1.10, 0.56, 0.058, 2], [1.43, -0.18, 0.077, 0],
  [-1.55, -0.58, 0.044, 1], [1.53, 0.34, 0.046, 1],
  [-0.98, -0.91, 0.046, 2], [0.02, -1.04, 0.052, 0]
].forEach(s => addSpeckle(s[0], s[1], s[2], s[3]));

function segmentBetween(a, b, radiusA, radiusB, material = orangePaper, sides = 6) {
  const direction = new THREE.Vector3().subVectors(b, a);
  const length = direction.length();
  const geometry = new THREE.CylinderGeometry(radiusB, radiusA, length, sides, 1, false);
  const mesh = castObject(new THREE.Mesh(geometry, material));
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.clone().normalize()
  );
  addEdges(mesh, 8, 0.9);
  crab.add(mesh);
  return mesh;
}

function addCreaseRing(position, direction, radius) {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(radius, 0.012, 4, 12),
    new THREE.MeshStandardMaterial({ color: 0x633022, roughness: 1 })
  );
  ring.position.copy(position);
  ring.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 0, 1),
    direction.clone().normalize()
  );
  ring.castShadow = true;
  crab.add(ring);
}

function addGlueTab(joint, direction, sign, size = 0.25) {
  const forward = direction.clone().normalize();
  const side = new THREE.Vector3(-forward.z, 0, forward.x).normalize();
  if (side.lengthSq() < 0.01) side.set(sign, 0, 0);
  const lift = new THREE.Vector3(0, 0.055, 0);
  const p0 = joint.clone().add(lift).addScaledVector(side, -size * 0.42);
  const p1 = joint.clone().add(lift).addScaledVector(side, size * 0.42);
  const p2 = joint.clone().add(lift)
    .addScaledVector(forward, size * 0.72)
    .addScaledVector(side, sign * size * 0.16);

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute([
    p0.x, p0.y, p0.z,
    p1.x, p1.y, p1.z,
    p2.x, p2.y, p2.z
  ], 3));
  geometry.computeVertexNormals();

  const tab = castObject(new THREE.Mesh(geometry, palePaper));
  crab.add(tab);

  const borderGeometry = new THREE.BufferGeometry().setFromPoints([p0, p1, p2, p0]);
  const border = new THREE.Line(borderGeometry, creaseMaterial);
  border.renderOrder = 4;
  crab.add(border);

  const foldGeometry = new THREE.BufferGeometry().setFromPoints([p0, p1]);
  const fold = new THREE.Line(foldGeometry, creaseMaterial);
  fold.renderOrder = 4;
  crab.add(fold);
}

function addPolygonJoint(position, radius) {
  const joint = castObject(new THREE.Mesh(
    new THREE.IcosahedronGeometry(radius, 0),
    lightPaper
  ));
  joint.position.copy(position);
  addEdges(joint, 5, 0.86);
  crab.add(joint);
}

function makeWalkingLeg(side, index, anchorZ, reach, sweep) {
  const anchor = new THREE.Vector3(side * 1.58, 0.80, anchorZ);
  const knee = new THREE.Vector3(
    side * (2.45 + reach * 0.14),
    0.47 + index * 0.015,
    anchorZ + sweep
  );
  const ankle = new THREE.Vector3(
    side * (3.18 + reach * 0.24),
    0.20,
    anchorZ + sweep * 1.55
  );
  const tip = new THREE.Vector3(
    side * (3.73 + reach * 0.30),
    0.06,
    anchorZ + sweep * 2.0
  );

  segmentBetween(anchor, knee, 0.25, 0.19, orangePaper, 6);
  segmentBetween(knee, ankle, 0.19, 0.125, lightPaper, 6);
  segmentBetween(ankle, tip, 0.125, 0.045, orangePaper, 5);

  addPolygonJoint(knee, 0.205);
  addPolygonJoint(ankle, 0.14);
  addCreaseRing(knee, new THREE.Vector3().subVectors(ankle, knee), 0.205);
  addCreaseRing(ankle, new THREE.Vector3().subVectors(tip, ankle), 0.14);
  addGlueTab(knee, new THREE.Vector3().subVectors(ankle, knee), side, 0.29);
  addGlueTab(ankle, new THREE.Vector3().subVectors(tip, ankle), -side, 0.22);
}

const legData = [
  { z: -0.82, reach: 0.36, sweep: -0.56 },
  { z: -0.32, reach: 0.18, sweep: -0.18 },
  { z: 0.20, reach: 0.08, sweep: 0.19 },
  { z: 0.68, reach: -0.02, sweep: 0.52 }
];

for (const side of [-1, 1]) {
  legData.forEach((data, index) => {
    makeWalkingLeg(side, index, data.z, data.reach, data.sweep);
  });
}

function addClaw(side) {
  const root = new THREE.Vector3(side * 1.08, 0.82, 1.02);
  const elbow = new THREE.Vector3(side * 1.48, 0.58, 1.82);
  const wrist = new THREE.Vector3(side * 1.66, 0.43, 2.47);

  segmentBetween(root, elbow, 0.29, 0.23, orangePaper, 6);
  segmentBetween(elbow, wrist, 0.24, 0.19, lightPaper, 6);
  addPolygonJoint(elbow, 0.26);
  addCreaseRing(elbow, new THREE.Vector3().subVectors(wrist, elbow), 0.26);
  addGlueTab(elbow, new THREE.Vector3().subVectors(wrist, elbow), side, 0.31);

  const palm = castObject(new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.55, 0),
    orangePaper
  ));
  palm.scale.set(0.82, 0.58, 1.18);
  palm.position.set(side * 1.72, 0.45, 2.79);
  palm.rotation.set(0.15, side * -0.18, side * -0.12);
  addEdges(palm, 5, 0.88);
  crab.add(palm);

  const innerBase = new THREE.Vector3(side * 1.56, 0.48, 3.12);
  const outerBase = new THREE.Vector3(side * 1.91, 0.48, 3.09);
  const innerTip = new THREE.Vector3(side * 1.50, 0.47, 3.88);
  const outerTip = new THREE.Vector3(side * 2.12, 0.52, 3.78);

  segmentBetween(innerBase, innerTip, 0.22, 0.055, lightPaper, 5);
  segmentBetween(outerBase, outerTip, 0.24, 0.06, orangePaper, 5);

  const notchTip = new THREE.Vector3(side * 1.69, 0.47, 3.62);
  segmentBetween(innerTip, notchTip, 0.06, 0.025, lightPaper, 5);
  segmentBetween(outerTip, notchTip, 0.065, 0.025, orangePaper, 5);

  addGlueTab(innerBase, new THREE.Vector3().subVectors(innerTip, innerBase), -side, 0.22);
  addGlueTab(outerBase, new THREE.Vector3().subVectors(outerTip, outerBase), side, 0.22);
}

addClaw(-1);
addClaw(1);

function addEye(side) {
  const base = new THREE.Vector3(side * 0.67, 1.55, 1.16);
  const top = new THREE.Vector3(side * 0.77, 2.00, 1.35);
  segmentBetween(base, top, 0.105, 0.085, palePaper, 8);

  const faceNormal = new THREE.Vector3(side * 0.05, 0.2, 1).normalize();
  const eye = castObject(new THREE.Mesh(
    new THREE.CylinderGeometry(0.16, 0.16, 0.055, 14),
    darkPaper
  ));
  eye.position.copy(top).addScaledVector(faceNormal, 0.025);
  eye.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), faceNormal);
  crab.add(eye);

  const glint = new THREE.Mesh(
    new THREE.CircleGeometry(0.045, 8),
    highlightPaper
  );
  glint.position.copy(top)
    .addScaledVector(faceNormal, 0.058)
    .add(new THREE.Vector3(-side * 0.035, 0.038, 0));
  glint.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), faceNormal);
  crab.add(glint);
}

addEye(-1);
addEye(1);

const browLeft = new THREE.Mesh(
  new THREE.BoxGeometry(0.55, 0.045, 0.055),
  undersidePaper
);
browLeft.position.set(-0.62, 1.78, 1.37);
browLeft.rotation.set(-0.08, -0.13, -0.18);
browLeft.castShadow = true;
crab.add(browLeft);

const browRight = browLeft.clone();
browRight.position.x = 0.62;
browRight.rotation.z = 0.18;
crab.add(browRight);

const mouthLine = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-0.35, 1.02, 1.57),
    new THREE.Vector3(-0.14, 0.94, 1.63),
    new THREE.Vector3(0, 0.97, 1.65),
    new THREE.Vector3(0.14, 0.94, 1.63),
    new THREE.Vector3(0.35, 1.02, 1.57)
  ]),
  new THREE.LineBasicMaterial({ color: 0x633022 })
);
crab.add(mouthLine);

const contactShadow = new THREE.Mesh(
  new THREE.CircleGeometry(3.45, 48),
  new THREE.MeshBasicMaterial({
    color: 0x50605d,
    transparent: true,
    opacity: 0.12,
    depthWrite: false
  })
);
contactShadow.scale.set(1.55, 0.68, 1);
contactShadow.rotation.x = -Math.PI / 2;
contactShadow.position.y = -0.065;
scene.add(contactShadow);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
