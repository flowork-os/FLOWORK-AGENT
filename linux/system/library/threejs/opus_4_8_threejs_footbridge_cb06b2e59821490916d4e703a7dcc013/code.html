<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Pedestrian Footbridge — three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15171c; }
  canvas { display: block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ *
 * A lightweight steel PONY (half-through) Warren-truss footbridge.
 * Units are METERS. Everything procedural, centered on the origin.
 *   - Timber walkway deck on stringers + transverse floor beams
 *   - Two side trusses (act as the barrier of a pony truss)
 *   - Lower baluster railing infill + mid-rail + rounded handrail
 *   - Concrete abutments with elastomeric bearing pads
 * ------------------------------------------------------------------ */

// ---- Renderer -----------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ---- Scene --------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171c);
scene.fog = new THREE.Fog(0x15171c, 36, 100);

// Studio environment for believable metal reflections (IBL only, not shown as bg)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

// ---- Camera -------------------------------------------------------
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(18, 9, 21);

// ---- Controls -----------------------------------------------------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.target.set(0, 0.4, 0);
controls.minDistance = 9;
controls.maxDistance = 70;
controls.maxPolarAngle = 1.9;

// ---- Lighting: hemisphere + key/fill/rim --------------------------
const hemi = new THREE.HemisphereLight(0xbcd4ff, 0x2a2a2f, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 2.6);
key.position.set(16, 20, 12);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 70;
key.shadow.camera.left = -16;
key.shadow.camera.right = 16;
key.shadow.camera.top = 16;
key.shadow.camera.bottom = -16;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.03;
scene.add(key);
scene.add(key.target);

const fill = new THREE.DirectionalLight(0x9db4d0, 0.6);
fill.position.set(-14, 9, -6);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xfff2e0, 1.1);
rim.position.set(-8, 7, -16);
scene.add(rim);

// ---- Shadow-catcher ground ---------------------------------------
const groundY = -2.6;
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = groundY;
ground.receiveShadow = true;
scene.add(ground);

// ---- Materials ----------------------------------------------------
const steelMat = new THREE.MeshStandardMaterial({ color: 0x8c939c, metalness: 0.9, roughness: 0.42 });
const railMat  = new THREE.MeshStandardMaterial({ color: 0xb4bac1, metalness: 0.95, roughness: 0.30 });
const concreteMat = new THREE.MeshStandardMaterial({ color: 0xbdb9b0, metalness: 0.0, roughness: 0.9 });
const bearingMat  = new THREE.MeshStandardMaterial({ color: 0x1b1c1f, metalness: 0.2, roughness: 0.85 });
const woodMats = [];
for (let i = 0; i < 5; i++) {
  const c = new THREE.Color().setHSL(0.082, 0.45, 0.30 + i * 0.02);
  woodMats.push(new THREE.MeshStandardMaterial({ color: c, roughness: 0.72, metalness: 0.0 }));
}

// ---- Bridge group (the single centered object) --------------------
const bridge = new THREE.Group();
scene.add(bridge);

const up = new THREE.Vector3(0, 1, 0);

// Structural strut between two points (square/rect box section)
function beam(p1, p2, sx, sz, mat, cast = true) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, len, sz), mat);
  m.position.copy(p1).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(up, dir.normalize());
  m.castShadow = cast;
  m.receiveShadow = true;
  bridge.add(m);
  return m;
}
// Axis-aligned block helper
function box(w, h, d, x, y, z, mat, cast = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = cast;
  m.receiveShadow = true;
  bridge.add(m);
  return m;
}
// Long rounded rail running along X
function railX(y, z, r, mat) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, L, 16), mat);
  m.rotation.z = Math.PI / 2;
  m.position.set(0, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  bridge.add(m);
}

// ---- Key dimensions (meters) -------------------------------------
const L = 20;            // truss length (span between abutment faces + bearings)
const N = 10;            // panels
const PL = L / N;        // panel length = 2 m
const sideZ = 1.3;       // truss plane offset -> 2.6 m truss spacing, ~2.4 m clear walk
const bottomY = 0.0;     // bottom chord centerline
const topY = 1.75;       // top chord centerline (truss depth 1.75 m)
const deckY = 0.46;      // walking surface
const midRailY = 1.06;   // mid-rail height (~0.6 m above deck)
const railTopY = 1.86;   // handrail cap (on top of top chord)

const V = (x, y, z) => new THREE.Vector3(x, y, z);

// ---- Side trusses + railings --------------------------------------
for (const s of [-1, 1]) {
  const z = s * sideZ;
  const bot = [], top = [];
  for (let i = 0; i <= N; i++) {
    const x = -L / 2 + i * PL;
    bot.push(V(x, bottomY, z));
    top.push(V(x, topY, z));
  }
  // Chords
  for (let i = 0; i < N; i++) {
    beam(bot[i], bot[i + 1], 0.14, 0.14, steelMat); // bottom chord
    beam(top[i], top[i + 1], 0.14, 0.14, steelMat); // top chord
  }
  // Vertical posts
  for (let i = 0; i <= N; i++) beam(bot[i], top[i], 0.09, 0.09, steelMat);
  // Warren diagonals (zig-zag)
  for (let i = 0; i < N; i++) {
    if (i % 2 === 0) beam(bot[i], top[i + 1], 0.08, 0.08, steelMat);
    else             beam(top[i], bot[i + 1], 0.08, 0.08, steelMat);
  }
  // Gusset plates at chord nodes
  for (let i = 0; i <= N; i++) {
    box(0.26, 0.26, 0.035, bot[i].x, bottomY, z, steelMat);
    box(0.26, 0.26, 0.035, top[i].x, topY, z, steelMat);
  }
  // Pony-truss knee braces (U-frame) from posts down to floor beams
  for (let i = 1; i < N; i++) {
    const x = -L / 2 + i * PL;
    beam(V(x, 0.95, z), V(x, 0.30, s * (sideZ - 0.55)), 0.06, 0.06, steelMat);
  }
  // Handrail + mid-rail
  railX(railTopY, z, 0.045, railMat);
  railX(midRailY, z, 0.030, railMat);
}

// ---- Baluster railing infill (lower zone) -------------------------
const balH = midRailY - deckY;
const balGeo = new THREE.BoxGeometry(0.022, balH, 0.022);
for (const s of [-1, 1]) {
  const z = s * sideZ;
  for (let x = -L / 2 + 0.30; x <= L / 2 - 0.30 + 1e-6; x += 0.16) {
    const m = new THREE.Mesh(balGeo, steelMat);
    m.position.set(x, deckY - balH / 2 + balH, z - 0); // center between deck & mid-rail
    m.position.y = deckY + balH / 2;
    m.castShadow = false;
    m.receiveShadow = true;
    bridge.add(m);
  }
}

// ---- Deck: floor beams -> stringers -> timber planks --------------
for (let i = 0; i <= N; i++) {
  const x = -L / 2 + i * PL;
  box(0.12, 0.20, 2.6, x, 0.17, 0, steelMat); // transverse floor beam
}
for (const sz of [-1.05, -0.45, 0.45, 1.05]) {
  box(L, 0.14, 0.08, 0, 0.34, sz, steelMat, false); // longitudinal stringer (mostly hidden)
}
const plankGeo = new THREE.BoxGeometry(0.22, 0.05, 2.44);
for (let x = -L / 2 + 0.20; x <= L / 2 - 0.20 + 1e-6; x += 0.25) {
  const m = new THREE.Mesh(plankGeo, woodMats[Math.floor(Math.random() * woodMats.length)]);
  m.position.set(x, 0.435, 0);
  m.castShadow = true;
  m.receiveShadow = true;
  bridge.add(m);
}
// Edge curbs / toe boards
for (const s of [-1, 1]) box(L, 0.14, 0.06, 0, deckY + 0.07, s * 1.2, steelMat);

// ---- Concrete abutments + elastomeric bearings --------------------
for (const s of [-1, 1]) {
  box(3.2, 0.50, 4.6, s * 10.4, -2.35, 0, concreteMat);   // spread footing
  box(2.6, 2.05, 3.9, s * 10.4, -1.075, 0, concreteMat);  // stem / bearing seat
  for (const zz of [-sideZ, sideZ]) {
    box(0.40, 0.10, 0.40, s * 10, -0.06, zz, bearingMat); // bearing pad under chord end
  }
}

// ---- Render loop --------------------------------------------------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ---- Responsive ---------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>
</body>
</html>
