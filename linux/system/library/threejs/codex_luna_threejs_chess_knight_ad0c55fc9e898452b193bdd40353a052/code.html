<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carved Wooden Chess Knight</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #17100b;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x18110c);
scene.fog = new THREE.Fog(0x18110c, 9, 18);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.7, 4.4, 7.3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 4.8;
controls.maxDistance = 12;
controls.target.set(0, 2.05, 0.12);

const wood = new THREE.MeshStandardMaterial({
  color: 0x8b4c22,
  roughness: 0.34,
  metalness: 0.02
});
const woodLight = new THREE.MeshStandardMaterial({
  color: 0xb87539,
  roughness: 0.3
});
const woodDark = new THREE.MeshStandardMaterial({
  color: 0x5b2b15,
  roughness: 0.38
});
const cutWood = new THREE.MeshStandardMaterial({
  color: 0x713719,
  roughness: 0.42
});
const eyeMat = new THREE.MeshStandardMaterial({
  color: 0x070403,
  roughness: 0.12,
  metalness: 0.25
});
const brass = new THREE.MeshStandardMaterial({
  color: 0x9d5d24,
  roughness: 0.25,
  metalness: 0.18
});

function cast(mesh, receive = false) {
  mesh.castShadow = true;
  mesh.receiveShadow = receive;
  return mesh;
}

function lathe(name, points, material, segments = 64) {
  const geometry = new THREE.LatheGeometry(
    points.map(p => new THREE.Vector2(p[0], p[1])),
    segments
  );
  geometry.computeVertexNormals();
  const mesh = cast(new THREE.Mesh(geometry, material), true);
  mesh.name = name;
  return mesh;
}

function ellipsoid(name, position, scale, material) {
  const mesh = cast(new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), material), true);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.scale.set(scale[0], scale[1], scale[2]);
  return mesh;
}

function cylinderBetween(a, b, radius, material, radial = 32) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const direction = new THREE.Vector3().subVectors(end, start);
  const mesh = cast(new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius * 1.08, direction.length(), radial),
    material
  ), true);
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  return mesh;
}

function extrudedShape(name, points, depth, material, bevel = 0.035) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
  shape.closePath();
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: bevel > 0,
    bevelSegments: 2,
    bevelSize: bevel,
    bevelThickness: bevel,
    curveSegments: 4
  });
  geometry.center();
  geometry.computeVertexNormals();
  const mesh = cast(new THREE.Mesh(geometry, material), true);
  mesh.name = name;
  return mesh;
}

const piece = new THREE.Group();
piece.position.y = -0.02;
scene.add(piece);

const base = lathe('turned circular base', [
  [0.00, 0.00], [1.02, 0.00], [1.12, 0.08], [1.16, 0.17],
  [1.13, 0.27], [1.02, 0.35], [0.90, 0.40], [0.87, 0.51],
  [0.87, 0.61], [0.78, 0.70], [0.58, 0.76], [0.53, 0.86],
  [0.53, 0.98], [0.47, 1.08], [0.00, 1.08]
], wood, 96);
piece.add(base);

piece.add(lathe('lower base bead', [
  [0.72, 0.38], [0.91, 0.39], [1.04, 0.44], [1.08, 0.50],
  [1.00, 0.56], [0.77, 0.58], [0.70, 0.53]
], woodDark, 80));

piece.add(lathe('upper base collar', [
  [0.49, 0.86], [0.70, 0.88], [0.76, 0.94], [0.72, 1.00],
  [0.55, 1.04], [0.46, 1.00]
], woodLight, 80));

const neck = lathe('tapered curved neck', [
  [0.00, 0.98], [0.47, 1.03], [0.49, 1.17], [0.43, 1.39],
  [0.39, 1.65], [0.37, 1.92], [0.39, 2.18], [0.46, 2.43],
  [0.57, 2.67], [0.66, 2.88], [0.67, 3.07], [0.58, 3.18],
  [0.43, 3.25], [0.00, 3.27]
], wood, 64);
neck.rotation.z = -0.035;
piece.add(neck);

piece.add(ellipsoid('shoulder transition', [0, 1.22, 0.03], [0.58, 0.40, 0.48], woodDark));
piece.add(ellipsoid('forehead', [0, 3.43, 0.03], [0.54, 0.70, 0.47], woodLight));
piece.add(ellipsoid('horse cranium', [0, 3.72, 0.02], [0.57, 0.55, 0.48], wood));

const muzzle = ellipsoid('long tapered muzzle', [0, 3.42, 0.63], [0.43, 0.34, 0.75], woodLight);
muzzle.rotation.x = -0.08;
piece.add(muzzle);

const nose = ellipsoid('rounded nose', [0, 3.34, 1.12], [0.39, 0.29, 0.35], wood);
piece.add(nose);

const jaw = ellipsoid('defined lower jaw', [0, 3.08, 0.58], [0.40, 0.25, 0.66], cutWood);
jaw.rotation.x = 0.13;
piece.add(jaw);

piece.add(ellipsoid('throat undercut', [0, 2.91, 0.13], [0.33, 0.25, 0.47], woodDark));

const cheekL = ellipsoid('left cheek', [-0.40, 3.37, 0.30], [0.20, 0.35, 0.38], woodDark);
const cheekR = cheekL.clone();
cheekR.name = 'right cheek';
cheekR.position.x = 0.40;
piece.add(cheekL, cheekR);

const eyeL = ellipsoid('left eye', [-0.43, 3.68, 0.39], [0.075, 0.075, 0.06], eyeMat);
const eyeR = eyeL.clone();
eyeR.name = 'right eye';
eyeR.position.x = 0.43;
piece.add(eyeL, eyeR);

const browL = cylinderBetween([-0.49, 3.79, 0.30], [-0.27, 3.86, 0.30], 0.045, woodDark, 20);
const browR = browL.clone();
browR.position.x = 0.54;
piece.add(browL, browR);

const nostrilL = ellipsoid('left nostril', [-0.27, 3.39, 1.39], [0.09, 0.055, 0.035], eyeMat);
const nostrilR = nostrilL.clone();
nostrilR.name = 'right nostril';
nostrilR.position.x = 0.27;
piece.add(nostrilL, nostrilR);

function addEar(x, tilt) {
  const ear = new THREE.Mesh(new THREE.ConeGeometry(0.19, 0.68, 32, 1), wood);
  ear.position.set(x, 4.25, -0.02);
  ear.rotation.z = tilt;
  ear.rotation.x = -0.10;
  cast(ear, true);
  piece.add(ear);
  const inner = new THREE.Mesh(new THREE.ConeGeometry(0.085, 0.43, 24, 1), woodDark);
  inner.position.set(x, 4.26, 0.125);
  inner.rotation.z = tilt;
  inner.rotation.x = -0.10;
  cast(inner);
  piece.add(inner);
}
addEar(-0.26, -0.18);
addEar(0.26, 0.18);

const maneGroup = new THREE.Group();
maneGroup.name = 'carved mane';
maneGroup.position.z = -0.40;
piece.add(maneGroup);

const maneProfile = [
  [-0.02, -0.36], [0.23, -0.13], [0.20, 0.25],
  [0.10, 0.52], [-0.07, 0.67], [-0.20, 0.49],
  [-0.15, 0.15], [-0.22, -0.16]
];

for (let i = 0; i < 7; i++) {
  const fin = extrudedShape('mane carved ridge', maneProfile, 0.075, i % 2 ? woodDark : cutWood, 0.025);
  fin.position.set(0, 3.90 - i * 0.34, -0.02);
  fin.rotation.x = i * 0.025;
  fin.scale.set(1 - i * 0.045, 1 - i * 0.025, 1);
  maneGroup.add(fin);
}

for (let i = 0; i < 5; i++) {
  const groove = cylinderBetween(
    [-0.015, 2.45 + i * 0.27, -0.47],
    [-0.015, 2.67 + i * 0.27, -0.49],
    0.027,
    brass,
    12
  );
  groove.scale.x = 0.5;
  piece.add(groove);
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(8, 96),
  new THREE.MeshStandardMaterial({ color: 0x241810, roughness: 0.8 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.015;
floor.receiveShadow = true;
scene.add(floor);

const rim = new THREE.Mesh(
  new THREE.TorusGeometry(1.17, 0.025, 12, 96),
  brass
);
rim.rotation.x = Math.PI / 2;
rim.position.y = 0.12;
rim.scale.set(1, 1, 1);
piece.add(rim);

scene.add(new THREE.HemisphereLight(0xffd6a1, 0x1d1009, 2.0));

const key = new THREE.DirectionalLight(0xffd0a0, 4.2);
key.position.set(-4.5, 7.5, 5.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -2;
key.shadow.bias = -0.00035;
scene.add(key);

const fill = new THREE.PointLight(0x8e4a24, 18, 10, 2);
fill.position.set(4, 3.6, 3.5);
scene.add(fill);

const warmRim = new THREE.SpotLight(0xff9b52, 25, 14, Math.PI / 5, 0.5, 1.5);
warmRim.position.set(-4, 5, -5);
warmRim.target = piece;
scene.add(warmRim);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
