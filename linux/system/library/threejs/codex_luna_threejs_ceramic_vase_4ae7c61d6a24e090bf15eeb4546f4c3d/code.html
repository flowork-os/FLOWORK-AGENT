<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand-Thrown Glazed Ceramic Vase</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #11151a;
      font-family: Georgia, serif;
    }

    canvas {
      display: block;
    }

    .caption {
      position: fixed;
      left: 28px;
      bottom: 25px;
      color: rgba(255, 244, 220, 0.72);
      letter-spacing: 0.16em;
      font-size: 11px;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="caption">Hand-thrown / glazed stoneware</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x11151a);
    scene.fog = new THREE.Fog(0x11151a, 8, 17);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(7.2, 4.6, 8.5);
    camera.lookAt(0, 2.55, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.75;
    controls.minDistance = 5.3;
    controls.maxDistance = 12;
    controls.target.set(0, 2.55, 0);

    scene.add(new THREE.HemisphereLight(0x9aaebe, 0x17100d, 1.55));

    const keyLight = new THREE.SpotLight(0xffe9c5, 330, 18, Math.PI / 6, 0.48, 1.5);
    keyLight.position.set(4.8, 8.5, 5.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.bias = -0.00015;
    scene.add(keyLight);

    const fillLight = new THREE.PointLight(0x7898c2, 34, 10);
    fillLight.position.set(-4.5, 3.5, 3.5);
    scene.add(fillLight);

    const rimLight = new THREE.PointLight(0xffb47d, 40, 9);
    rimLight.position.set(1.5, 5.8, -4.5);
    scene.add(rimLight);

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x24282d,
      roughness: 0.76,
      metalness: 0.04
    });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.03;
    floor.receiveShadow = true;
    scene.add(floor);

    const profile = [
      new THREE.Vector2(0.00, 0.00),
      new THREE.Vector2(0.52, 0.04),
      new THREE.Vector2(0.98, 0.16),
      new THREE.Vector2(1.31, 0.48),
      new THREE.Vector2(1.53, 1.00),
      new THREE.Vector2(1.62, 1.68),
      new THREE.Vector2(1.59, 2.35),
      new THREE.Vector2(1.45, 2.94),
      new THREE.Vector2(1.22, 3.40),
      new THREE.Vector2(0.91, 3.72),
      new THREE.Vector2(0.67, 3.94),
      new THREE.Vector2(0.56, 4.28),
      new THREE.Vector2(0.56, 4.70),
      new THREE.Vector2(0.68, 4.88),
      new THREE.Vector2(0.84, 4.98),
      new THREE.Vector2(0.80, 5.17),
      new THREE.Vector2(0.61, 5.20),
      new THREE.Vector2(0.52, 5.05),
      new THREE.Vector2(0.44, 4.87),
      new THREE.Vector2(0.43, 4.31),
      new THREE.Vector2(0.48, 4.00),
      new THREE.Vector2(0.72, 3.72),
      new THREE.Vector2(1.00, 3.39),
      new THREE.Vector2(1.22, 2.84),
      new THREE.Vector2(1.34, 2.16),
      new THREE.Vector2(1.30, 1.42),
      new THREE.Vector2(1.10, 0.79),
      new THREE.Vector2(0.76, 0.47),
      new THREE.Vector2(0.36, 0.37),
      new THREE.Vector2(0.00, 0.37)
    ];

    const vaseGeometry = new THREE.LatheGeometry(profile, 144);
    const positions = vaseGeometry.attributes.position;
    const vertex = new THREE.Vector3();

    for (let i = 0; i < positions.count; i++) {
      vertex.fromBufferAttribute(positions, i);
      const radius = Math.sqrt(vertex.x * vertex.x + vertex.z * vertex.z);

      if (radius > 0.001) {
        const angle = Math.atan2(vertex.z, vertex.x);
        const irregularity =
          1 +
          0.018 * Math.sin(angle * 3.0 + vertex.y * 1.7) +
          0.009 * Math.sin(angle * 7.0 - vertex.y * 2.2);

        vertex.x *= irregularity;
        vertex.z *= irregularity;
        vertex.x += 0.012 * Math.sin(vertex.y * 1.3);
        vertex.z += 0.008 * Math.cos(vertex.y * 1.6);
      }

      positions.setXYZ(i, vertex.x, vertex.y, vertex.z);
    }

    vaseGeometry.computeVertexNormals();

    const glaze = new THREE.MeshPhysicalMaterial({
      color: 0x176b76,
      roughness: 0.19,
      metalness: 0.03,
      clearcoat: 0.82,
      clearcoatRoughness: 0.12,
      sheen: 0.18,
      sheenColor: 0x5fc1be
    });

    const vase = new THREE.Mesh(vaseGeometry, glaze);
    vase.castShadow = true;
    vase.receiveShadow = true;
    scene.add(vase);

    const innerLipMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x0b313a,
      roughness: 0.28,
      metalness: 0.02,
      clearcoat: 0.42,
      side: THREE.DoubleSide
    });

    const innerLip = new THREE.Mesh(
      new THREE.TorusGeometry(0.595, 0.038, 14, 72),
      innerLipMaterial
    );
    innerLip.position.y = 5.105;
    innerLip.scale.set(1.02, 1, 0.98);
    innerLip.castShadow = true;
    scene.add(innerLip);

    const rimHighlight = new THREE.Mesh(
      new THREE.TorusGeometry(0.735, 0.045, 16, 88),
      new THREE.MeshPhysicalMaterial({
        color: 0x2c8990,
        roughness: 0.16,
        clearcoat: 0.9,
        clearcoatRoughness: 0.1
      })
    );
    rimHighlight.position.y = 5.08;
    rimHighlight.scale.set(1.01, 0.78, 0.99);
    rimHighlight.castShadow = true;
    scene.add(rimHighlight);

    function addChip(angle, radius, size, rotation) {
      const chipShape = new THREE.Shape();
      chipShape.moveTo(-size, -size * 0.35);
      chipShape.lineTo(size * 0.9, -size * 0.18);
      chipShape.lineTo(size * 0.15, size * 0.72);
      chipShape.closePath();

      const chip = new THREE.Mesh(
        new THREE.ShapeGeometry(chipShape),
        new THREE.MeshStandardMaterial({
          color: 0x172229,
          roughness: 0.62,
          side: THREE.DoubleSide
        })
      );

      chip.rotation.x = -Math.PI / 2;
      chip.rotation.z = rotation;
      chip.position.set(
        Math.cos(angle) * radius,
        5.205,
        Math.sin(angle) * radius
      );
      chip.scale.set(0.8, 1.15, 1);
      scene.add(chip);

      const brokenEdge = new THREE.Mesh(
        new THREE.TorusGeometry(size * 0.42, 0.012, 5, 12),
        new THREE.MeshStandardMaterial({
          color: 0x8e9b91,
          roughness: 0.48
        })
      );
      brokenEdge.position.copy(chip.position);
      brokenEdge.position.y += 0.006;
      brokenEdge.rotation.x = -Math.PI / 2;
      brokenEdge.rotation.z = rotation;
      brokenEdge.scale.set(1.3, 0.55, 1);
      scene.add(brokenEdge);
    }

    addChip(0.55, 0.70, 0.12, 0.3);
    addChip(2.52, 0.67, 0.09, -0.8);
    addChip(4.35, 0.69, 0.105, 0.6);

    const neckRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.555, 0.018, 10, 72),
      new THREE.MeshPhysicalMaterial({
        color: 0x58a6a0,
        roughness: 0.22,
        clearcoat: 0.7
      })
    );
    neckRing.position.y = 4.73;
    neckRing.scale.set(1.01, 1, 0.99);
    scene.add(neckRing);

    const shadowDisc = new THREE.Mesh(
      new THREE.CircleGeometry(1.55, 96),
      new THREE.MeshBasicMaterial({
        color: 0x080a0b,
        transparent: true,
        opacity: 0.28
      })
    );
    shadowDisc.rotation.x = -Math.PI / 2;
    shadowDisc.position.y = 0.002;
    shadowDisc.scale.set(1.2, 0.52, 1);
    scene.add(shadowDisc);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      vase.rotation.y = Math.sin(elapsed * 0.18) * 0.012;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
