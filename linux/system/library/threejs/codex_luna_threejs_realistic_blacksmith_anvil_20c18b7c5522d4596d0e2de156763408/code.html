<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blacksmith Anvil</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101111;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111312);
scene.fog = new THREE.Fog(0x111312, 9, 18);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(6.1, 4.6, 7.1);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 4.8;
controls.maxDistance = 12;
controls.target.set(0.45, 1.75, 0);

const hemi = new THREE.HemisphereLight(0x9ca7ad, 0x1b1510, 1.9);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffe5c2, 4.1);
keyLight.position.set(-4.5, 8, 5.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -4;
keyLight.shadow.bias = -0.00025;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x6b8ea8, 2.0);
rimLight.position.set(5, 4, -5);
scene.add(rimLight);

const iron = new THREE.MeshStandardMaterial({
  color: 0x292b2a,
  roughness: 0.83,
  metalness: 0.72
});
const ironDark = new THREE.MeshStandardMaterial({
  color: 0x141716,
  roughness: 0.95,
  metalness: 0.46
});
const wornIron = new THREE.MeshStandardMaterial({
  color: 0x56534b,
  roughness: 0.52,
  metalness: 0.91
});
const faceMaterial = new THREE.MeshStandardMaterial({
  color: 0x77766c,
  roughness: 0.36,
  metalness: 0.96
});
const rust = new THREE.MeshStandardMaterial({
  color: 0x713d25,
  roughness: 0.92,
  metalness: 0.18
});
const rustLight = new THREE.MeshStandardMaterial({
  color: 0x9a5630,
  roughness: 0.88,
  metalness: 0.2
});
const holeMaterial = new THREE.MeshStandardMaterial({
  color: 0x090b0a,
  roughness: 1,
  metalness: 0.08
});

function bevelledBlock(width, depth, height, bevel, material) {
  const shape = new THREE.Shape();
  const x = width * 0.5;
  const z = depth * 0.5;
  const b = Math.min(bevel, x * 0.45, z * 0.45);
  shape.moveTo(-x + b, -z);
  shape.lineTo(x - b, -z);
  shape.quadraticCurveTo(x, -z, x, -z + b);
  shape.lineTo(x, z - b);
  shape.quadraticCurveTo(x, z, x - b, z);
  shape.lineTo(-x + b, z);
  shape.quadraticCurveTo(-x, z, -x, z - b);
  shape.lineTo(-x, -z + b);
  shape.quadraticCurveTo(-x, -z, -x + b, -z);

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: height,
    bevelEnabled: true,
    bevelSegments: 3,
    bevelSize: bevel * 0.55,
    bevelThickness: bevel * 0.55,
    curveSegments: 4
  });
  geometry.rotateX(Math.PI * 0.5);
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function taperedBody(bottomWidth, topWidth, bottomDepth, topDepth, height, y, material) {
  const geometry = new THREE.BufferGeometry();
  const positions = [];
  const normals = [];
  const indices = [];
  const bevel = 0.18;
  const ring = (width, depth, yy) => [
    [-width * 0.5 + bevel, yy, -depth * 0.5],
    [ width * 0.5 - bevel, yy, -depth * 0.5],
    [ width * 0.5, yy, -depth * 0.5 + bevel],
    [ width * 0.5, yy,  depth * 0.5 - bevel],
    [ width * 0.5 - bevel, yy, depth * 0.5],
    [-width * 0.5 + bevel, yy, depth * 0.5],
    [-width * 0.5, yy,  depth * 0.5 - bevel],
    [-width * 0.5, yy, -depth * 0.5 + bevel]
  ];
  const points = ring(bottomWidth, bottomDepth, y).concat(ring(topWidth, topDepth, y + height));
  for (const point of points) {
    positions.push(point[0], point[1], point[2]);
    normals.push(0, 1, 0);
  }
  for (let i = 0; i < 8; i++) {
    const j = (i + 1) % 8;
    indices.push(i, j, 8 + i, j, 8 + j, 8 + i);
  }
  indices.push(0, 7, 6, 0, 6, 5, 0, 5, 4, 0, 4, 3, 0, 3, 2, 0, 2, 1);
  indices.push(8, 9, 10, 8, 10, 11, 8, 11, 12, 8, 12, 13, 8, 13, 14, 8, 14, 15);
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function createHorn(material) {
  const geometry = new THREE.BufferGeometry();
  const positions = [];
  const indices = [];
  const segments = 22;
  const radial = 12;
  const startX = 1.58;
  const endX = 4.12;

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const x = startX + (endX - startX) * t;
    const radiusZ = 0.56 * Math.pow(1 - t, 0.72) + 0.018;
    const radiusY = 0.42 * Math.pow(1 - t, 0.68) + 0.018;
    const centerY = 2.86 + 0.20 * t + 0.11 * t * t;
    for (let j = 0; j < radial; j++) {
      const a = (j / radial) * Math.PI * 2;
      const y = centerY + Math.sin(a) * radiusY;
      const z = Math.cos(a) * radiusZ;
      positions.push(x, y, z);
    }
  }

  for (let i = 0; i < segments; i++) {
    for (let j = 0; j < radial; j++) {
      const next = (j + 1) % radial;
      const a = i * radial + j;
      const b = i * radial + next;
      const c = (i + 1) * radial + j;
      const d = (i + 1) * radial + next;
      indices.push(a, c, b, b, c, d);
    }
  }

  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const anvil = new THREE.Group();
scene.add(anvil);

const base = bevelledBlock(3.0, 1.55, 0.48, 0.18, ironDark);
base.position.y = 0.25;
anvil.add(base);

const footLeft = bevelledBlock(0.78, 1.65, 0.30, 0.12, iron);
footLeft.position.set(-0.98, 0.66, 0);
anvil.add(footLeft);

const footRight = bevelledBlock(0.78, 1.65, 0.30, 0.12, iron);
footRight.position.set(0.98, 0.66, 0);
anvil.add(footRight);

const waist = taperedBody(2.18, 1.45, 1.18, 0.92, 1.62, 0.72, iron);
anvil.add(waist);

const shoulder = taperedBody(2.68, 3.55, 1.30, 1.45, 0.38, 2.25, iron);
anvil.add(shoulder);

const face = bevelledBlock(3.72, 1.48, 0.30, 0.14, faceMaterial);
face.position.set(0, 2.58, 0);
anvil.add(face);

const horn = createHorn(wornIron);
anvil.add(horn);

const hornCollar = new THREE.Mesh(
  new THREE.CylinderGeometry(0.52, 0.62, 0.12, 12),
  iron
);
hornCollar.rotation.z = Math.PI * 0.5;
hornCollar.position.set(1.60, 2.86, 0);
hornCollar.castShadow = true;
hornCollar.receiveShadow = true;
anvil.add(hornCollar);

const holeOuter = new THREE.Mesh(
  new THREE.BoxGeometry(0.48, 0.045, 0.48),
  holeMaterial
);
holeOuter.position.set(-0.92, 2.755, 0.02);
holeOuter.castShadow = true;
anvil.add(holeOuter);

const holeInner = new THREE.Mesh(
  new THREE.BoxGeometry(0.31, 0.06, 0.31),
  new THREE.MeshStandardMaterial({ color: 0x050605, roughness: 1, metalness: 0 })
);
holeInner.position.set(-0.92, 2.77, 0.02);
anvil.add(holeInner);

const holeRimMaterial = new THREE.MeshStandardMaterial({
  color: 0x5c5a51,
  roughness: 0.46,
  metalness: 0.9
});
const rimPieces = [
  [0.48, 0.07, 0.07, -0.92, 2.79, -0.235],
  [0.48, 0.07, 0.07, -0.92, 2.79, 0.275],
  [0.07, 0.07, 0.36, -1.155, 2.79, 0.02],
  [0.07, 0.07, 0.36, -0.685, 2.79, 0.02]
];
for (const piece of rimPieces) {
  const rim = new THREE.Mesh(
    new THREE.BoxGeometry(piece[0], piece[1], piece[2]),
    holeRimMaterial
  );
  rim.position.set(piece[3], piece[4], piece[5]);
  rim.castShadow = true;
  anvil.add(rim);
}

const pitMaterial = new THREE.MeshStandardMaterial({
  color: 0x272722,
  roughness: 0.92,
  metalness: 0.55
});
const pits = [
  [-0.35, -0.42, 0.11], [0.25, -0.31, 0.07], [0.77, -0.39, 0.055],
  [-1.45, -0.42, 0.06], [0.14, 0.22, 0.08], [0.86, 0.28, 0.06],
  [-0.18, 0.48, 0.045], [1.19, 0.03, 0.05], [-1.52, 0.31, 0.05],
  [0.48, -0.02, 0.035], [-0.58, 0.17, 0.045], [1.46, -0.28, 0.035]
];
for (let i = 0; i < pits.length; i++) {
  const p = pits[i];
  const pit = new THREE.Mesh(
    new THREE.CylinderGeometry(p[2], p[2] * 0.82, 0.018, 9),
    pitMaterial
  );
  pit.position.set(p[0], 2.765, p[1]);
  pit.rotation.y = i * 0.71;
  anvil.add(pit);
}

const scarMaterial = new THREE.MeshStandardMaterial({
  color: 0x3f403b,
  roughness: 0.7,
  metalness: 0.82
});
const scars = [
  [0.22, -0.09, 0.52, 0.025, 0.11],
  [-0.56, -0.12, 0.36, 0.018, -0.32],
  [0.76, 0.42, 0.26, 0.015, 0.45],
  [-1.28, 0.12, 0.22, 0.014, -0.22],
  [0.41, 0.56, 0.18, 0.014, 0.18]
];
for (const scarData of scars) {
  const scar = new THREE.Mesh(
    new THREE.BoxGeometry(scarData[2], scarData[3], 0.018),
    scarMaterial
  );
  scar.position.set(scarData[0], 2.775, scarData[1]);
  scar.rotation.y = scarData[4];
  anvil.add(scar);
}

function addRustStreak(x, z, height, width, lean, material) {
  const streak = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, 0.018),
    material
  );
  streak.position.set(x, 1.08 + height * 0.5, z);
  streak.rotation.z = lean;
  streak.castShadow = true;
  anvil.add(streak);
}

addRustStreak(-1.22, -0.606, 0.82, 0.075, -0.055, rust);
addRustStreak(-0.98, -0.607, 0.43, 0.045, 0.035, rustLight);
addRustStreak(-0.47, -0.607, 1.08, 0.055, -0.025, rust);
addRustStreak(0.27, -0.607, 0.66, 0.065, 0.045, rustLight);
addRustStreak(0.92, -0.607, 0.94, 0.045, -0.04, rust);
addRustStreak(1.28, -0.607, 0.36, 0.035, 0.06, rustLight);

const sideRust = new THREE.Mesh(
  new THREE.BoxGeometry(0.11, 0.53, 0.018),
  rust
);
sideRust.position.set(1.34, 1.04, -0.49);
sideRust.rotation.z = -0.08;
anvil.add(sideRust);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x242321,
  roughness: 0.96,
  metalness: 0.08
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(10, 96), floorMaterial);
floor.rotation.x = -Math.PI * 0.5;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

const forgeGlow = new THREE.PointLight(0xc76b38, 1.15, 5.5, 2);
forgeGlow.position.set(-2.8, 1.0, 2.8);
scene.add(forgeGlow);

const backdrop = new THREE.Mesh(
  new THREE.CircleGeometry(7, 64),
  new THREE.MeshBasicMaterial({ color: 0x181918, side: THREE.DoubleSide })
);
backdrop.rotation.x = -Math.PI * 0.5;
backdrop.position.y = -0.012;
backdrop.scale.set(1.35, 1, 1.35);
scene.add(backdrop);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
