<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porcelain Mermaid Figurine</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #101216; }
  #app { position: fixed; inset: 0; }
  #cap {
    position: fixed; left: 16px; bottom: 14px; z-index: 2;
    font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: rgba(226,232,240,0.55); letter-spacing: .04em; pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="cap">Porcelain Mermaid · glazed ceramic · drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const v = (x, y, z) => new THREE.Vector3(x, y, z);

/* ------------------------------------------------------------------ */
/* Renderer, scene, camera                                            */
/* ------------------------------------------------------------------ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111318);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.7, 1.95, 4.7);

// Soft studio reflections for the glossy glaze
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

/* ------------------------------------------------------------------ */
/* Lighting: hemisphere fill + key + rim, soft shadows                */
/* ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xbcd6ec, 0x2a2622, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3e2, 2.5);
key.position.set(3.6, 5.6, 3.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 22;
key.shadow.camera.left = -3.2;
key.shadow.camera.right = 3.2;
key.shadow.camera.top = 3.6;
key.shadow.camera.bottom = -1.0;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fc4ff, 0.7);
fill.position.set(-4.2, 2.6, 2.2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffe4ad, 1.35);
rim.position.set(-2.4, 3.4, -4.2);
scene.add(rim);

/* ------------------------------------------------------------------ */
/* Materials — porcelain glaze, aqua, gold luster                     */
/* ------------------------------------------------------------------ */
const matSkin = new THREE.MeshPhysicalMaterial({
  color: 0xf8ede3, roughness: 0.28, clearcoat: 1.0, clearcoatRoughness: 0.09,
  sheen: 0.5, sheenColor: new THREE.Color(0xffe9e0), sheenRoughness: 0.6,
  envMapIntensity: 1.05
});
const matWhite = new THREE.MeshPhysicalMaterial({
  color: 0xf3f0ea, roughness: 0.22, clearcoat: 1.0, clearcoatRoughness: 0.08,
  envMapIntensity: 1.1
});
const matAqua = new THREE.MeshPhysicalMaterial({
  color: 0x8ad2ce, roughness: 0.16, clearcoat: 1.0, clearcoatRoughness: 0.06,
  envMapIntensity: 1.2, iridescence: 0.25, iridescenceIOR: 1.3
});
const matAquaDeep = new THREE.MeshPhysicalMaterial({
  color: 0x5fb6b1, roughness: 0.15, clearcoat: 1.0, clearcoatRoughness: 0.06,
  envMapIntensity: 1.2
});
const matGold = new THREE.MeshPhysicalMaterial({
  color: 0xceac52, metalness: 1.0, roughness: 0.28, clearcoat: 0.5,
  clearcoatRoughness: 0.2, envMapIntensity: 1.45
});
const matRose = new THREE.MeshPhysicalMaterial({
  color: 0xd98b84, roughness: 0.25, clearcoat: 1.0, clearcoatRoughness: 0.1,
  envMapIntensity: 1.0
});
const matEye = new THREE.MeshPhysicalMaterial({
  color: 0x5a4636, roughness: 0.3, clearcoat: 1.0, clearcoatRoughness: 0.1
});

/* Procedural scale texture (color + bump) for the tail */
function makeScaleTextures() {
  const S = 512;
  const cc = document.createElement('canvas'); cc.width = cc.height = S;
  const g = cc.getContext('2d');
  const bc = document.createElement('canvas'); bc.width = bc.height = S;
  const b = bc.getContext('2d');
  g.fillStyle = '#7cc8c4'; g.fillRect(0, 0, S, S);
  b.fillStyle = '#808080'; b.fillRect(0, 0, S, S);
  const cols = 9, rows = 12, w = S / cols, h = S / rows;
  for (let r = 0; r < rows; r++) {
    for (let c = -1; c <= cols; c++) {
      const off = (r % 2) ? w / 2 : 0;
      const cx = c * w + off, cy = r * h;
      const rad = g.createRadialGradient(cx, cy + h * 0.25, 2, cx, cy + h * 0.95, w * 0.95);
      rad.addColorStop(0, '#c7ede9');
      rad.addColorStop(0.55, '#8fd3cf');
      rad.addColorStop(1, '#57ada9');
      g.fillStyle = rad;
      const drawScale = (ctx) => {
        ctx.beginPath();
        ctx.moveTo(cx - w * 0.56, cy + h * 0.12);
        ctx.quadraticCurveTo(cx, cy + h * 1.3, cx + w * 0.56, cy + h * 0.12);
        ctx.quadraticCurveTo(cx, cy + h * 0.55, cx - w * 0.56, cy + h * 0.12);
        ctx.closePath();
      };
      drawScale(g); g.fill();
      g.lineWidth = 2.3; g.strokeStyle = 'rgba(214,176,88,0.9)'; g.stroke();
      const brad = b.createRadialGradient(cx, cy + h * 0.32, 2, cx, cy + h * 1.0, w);
      brad.addColorStop(0, '#ededed'); brad.addColorStop(1, '#484848');
      b.fillStyle = brad; drawScale(b); b.fill();
    }
  }
  const map = new THREE.CanvasTexture(cc);
  const bump = new THREE.CanvasTexture(bc);
  map.colorSpace = THREE.SRGBColorSpace;
  map.wrapS = map.wrapT = bump.wrapS = bump.wrapT = THREE.RepeatWrapping;
  map.repeat.set(3, 9); bump.repeat.set(3, 9);
  return { map, bump };
}
const scaleTex = makeScaleTextures();
const matTail = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, map: scaleTex.map, bumpMap: scaleTex.bump, bumpScale: 0.02,
  roughness: 0.18, clearcoat: 1.0, clearcoatRoughness: 0.07, envMapIntensity: 1.15
});

/* ------------------------------------------------------------------ */
/* Geometry helpers                                                   */
/* ------------------------------------------------------------------ */
// Tapered tube with elliptical cross-section: radiusFn(u) -> [rN, rB]
function taperedTube(curve, tubularSegments, radialSegments, radiusFn) {
  const frames = curve.computeFrenetFrames(tubularSegments, false);
  const positions = [], normals = [], uvs = [], indices = [];
  const P = new THREE.Vector3();
  for (let i = 0; i <= tubularSegments; i++) {
    const u = i / tubularSegments;
    curve.getPointAt(u, P);
    const N = frames.normals[i], B = frames.binormals[i];
    const rr = radiusFn(u);
    const a = rr[0], b = rr[1];
    for (let j = 0; j <= radialSegments; j++) {
      const t = j / radialSegments * Math.PI * 2;
      const cos = -Math.cos(t), sin = Math.sin(t);
      const px = P.x + a * cos * N.x + b * sin * B.x;
      const py = P.y + a * cos * N.y + b * sin * B.y;
      const pz = P.z + a * cos * N.z + b * sin * B.z;
      let nx = (cos / a) * N.x + (sin / b) * B.x;
      let ny = (cos / a) * N.y + (sin / b) * B.y;
      let nz = (cos / a) * N.z + (sin / b) * B.z;
      const l = Math.hypot(nx, ny, nz) || 1;
      positions.push(px, py, pz);
      normals.push(nx / l, ny / l, nz / l);
      uvs.push(u, j / radialSegments);
    }
  }
  for (let i = 1; i <= tubularSegments; i++) {
    for (let j = 1; j <= radialSegments; j++) {
      const a = (radialSegments + 1) * (i - 1) + (j - 1);
      const b = (radialSegments + 1) * i + (j - 1);
      const c = (radialSegments + 1) * i + j;
      const d = (radialSegments + 1) * (i - 1) + j;
      indices.push(a, b, d, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setIndex(indices);
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  return geo;
}

const _sphere = new THREE.SphereGeometry(1, 32, 24);
function ellipsoid(mat, sx, sy, sz, x, y, z) {
  const m = new THREE.Mesh(_sphere, mat);
  m.scale.set(sx, sy, sz);
  m.position.set(x, y, z);
  return m;
}
function bone(mat, a, b, r) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const geo = new THREE.CapsuleGeometry(r, len, 8, 14);
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(v(0, 1, 0), dir.normalize());
  return m;
}
// gilded scallop shell
function scallopGeometry(R) {
  const shape = new THREE.Shape();
  const lobes = 7, steps = 64;
  shape.moveTo(0, 0);
  for (let i = 0; i <= steps; i++) {
    const a = Math.PI * (i / steps);
    const wob = 1 + 0.09 * Math.cos(lobes * a * 2 - Math.PI);
    shape.lineTo(Math.cos(a) * R * wob, Math.sin(a) * R * wob);
  }
  shape.lineTo(0, 0);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: 0.03, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.015,
    bevelSegments: 2, steps: 1, curveSegments: 24
  });
  geo.computeVertexNormals();
  return geo;
}

/* ------------------------------------------------------------------ */
/* Build the figurine                                                 */
/* ------------------------------------------------------------------ */
const fig = new THREE.Group();

/* ---- Wave base ---- */
const base = new THREE.Group();
const baseProfile = [
  v(0.00, 0.00, 0), v(0.92, 0.00, 0), v(1.16, 0.05, 0), v(1.26, 0.15, 0),
  v(1.22, 0.28, 0), v(1.02, 0.35, 0), v(0.55, 0.39, 0), v(0.00, 0.40, 0)
];
const baseGeo = new THREE.LatheGeometry(baseProfile.map(p => new THREE.Vector2(p.x, p.y)), 64);
base.add(new THREE.Mesh(baseGeo, matWhite));

// breaking-wave curls around the rim
for (let i = 0; i < 6; i++) {
  const ang = i / 6 * Math.PI * 2 + 0.3;
  const rad = v(Math.cos(ang), 0, Math.sin(ang));
  const tan = v(-Math.sin(ang), 0, Math.cos(ang));
  const p0 = rad.clone().multiplyScalar(1.16).setY(0.33);
  const p1 = rad.clone().multiplyScalar(1.04).setY(0.55).addScaledVector(tan, 0.10);
  const p2 = rad.clone().multiplyScalar(0.90).setY(0.63).addScaledVector(tan, 0.20);
  const p3 = rad.clone().multiplyScalar(0.80).setY(0.55).addScaledVector(tan, 0.26);
  const curve = new THREE.CatmullRomCurve3([p0, p1, p2, p3], false, 'centripetal');
  const g = taperedTube(curve, 36, 10, (u) => { const r = 0.13 * (1 - u) + 0.02; return [r, r]; });
  base.add(new THREE.Mesh(g, matAqua));
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 10), matGold);
  tip.position.copy(p3);
  base.add(tip);
}

// gilded scallop shells + pearls around the base
const shellGeo = scallopGeometry(0.16);
for (let i = 0; i < 4; i++) {
  const ang = i / 4 * Math.PI * 2 + 0.7;
  const pivot = new THREE.Group();
  pivot.position.set(Math.cos(ang) * 1.02, 0.40, Math.sin(ang) * 1.02);
  pivot.rotation.y = -ang + Math.PI / 2;
  const shell = new THREE.Mesh(shellGeo, matGold);
  shell.rotation.x = -1.15 + 0.12 * Math.sin(i * 2);
  shell.scale.setScalar(0.9);
  pivot.add(shell);
  const pearl = new THREE.Mesh(new THREE.SphereGeometry(0.035, 14, 12), matWhite);
  pearl.position.set(0.18, 0.02, 0.02);
  pivot.add(pearl);
  base.add(pivot);
}
fig.add(base);

/* ---- Tail ---- */
const tailPts = [
  v(0.00, 1.03, 0.02), v(0.03, 0.83, 0.11), v(0.02, 0.63, 0.10),
  v(0.11, 0.50, 0.02), v(0.36, 0.46, -0.05), v(0.66, 0.51, -0.08),
  v(0.88, 0.63, -0.02), v(0.98, 0.83, 0.06)
];
const tailCurve = new THREE.CatmullRomCurve3(tailPts, false, 'centripetal', 0.5);
const tailGeo = taperedTube(tailCurve, 120, 20, (u) => {
  const base = 0.10 + 0.36 * Math.pow(1 - u, 1.25);
  return [base, base * (1 - 0.30 * u)];
});
fig.add(new THREE.Mesh(tailGeo, matTail));

// gold trim band where tail meets hips
const bandGeo = new THREE.TorusGeometry(0.40, 0.028, 14, 48);
const band = new THREE.Mesh(bandGeo, matGold);
band.position.set(0, 1.14, 0.02);
band.rotation.x = Math.PI / 2 - 0.18;
band.scale.set(1.05, 1.0, 0.95);
fig.add(band);

// tail fluke (fan fins) at the curl tip
function flukeShape() {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.bezierCurveTo(0.18, 0.28, 0.40, 0.55, 0.30, 1.0);
  s.bezierCurveTo(0.20, 0.80, 0.08, 0.72, 0.0, 0.82);
  s.bezierCurveTo(-0.08, 0.72, -0.20, 0.80, -0.30, 1.0);
  s.bezierCurveTo(-0.40, 0.55, -0.18, 0.28, 0, 0);
  return s;
}
const flukeGeo = new THREE.ExtrudeGeometry(flukeShape(), {
  depth: 0.045, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.03,
  bevelSegments: 3, steps: 1, curveSegments: 24
});
flukeGeo.center();
const flukeGoldGeo = flukeGeo.clone();
const flukeGroup = new THREE.Group();
flukeGroup.position.set(1.0, 0.95, 0.08);
flukeGroup.rotation.set(0.5, 0.2, -0.5);
for (const side of [1, -1]) {
  const gold = new THREE.Mesh(flukeGoldGeo, matGold); // gilded rim behind
  gold.scale.set(0.62 * side, 0.64, 0.62);
  gold.position.set(side * 0.16, 0.28, -0.03);
  gold.rotation.z = -side * 0.5;
  flukeGroup.add(gold);
  const fin = new THREE.Mesh(flukeGeo, matAquaDeep);
  fin.scale.set(0.56 * side, 0.58, 0.56);
  fin.position.set(side * 0.16, 0.28, 0.0);
  fin.rotation.z = -side * 0.5;
  flukeGroup.add(fin);
}
fig.add(flukeGroup);

/* ---- Torso, chest, shoulders ---- */
fig.add(ellipsoid(matSkin, 0.42, 0.36, 0.38, 0.00, 1.06, 0.00)); // pelvis
fig.add(ellipsoid(matSkin, 0.34, 0.30, 0.32, 0.00, 1.28, 0.02)); // lower belly
fig.add(ellipsoid(matSkin, 0.27, 0.28, 0.27, 0.00, 1.48, 0.03)); // waist
fig.add(ellipsoid(matSkin, 0.35, 0.32, 0.31, 0.00, 1.70, 0.02)); // ribcage
fig.add(ellipsoid(matSkin, 0.42, 0.20, 0.25, 0.00, 1.90, 0.00)); // shoulders
fig.add(ellipsoid(matSkin, 0.14, 0.13, 0.13, -0.13, 1.66, 0.20)); // bust L
fig.add(ellipsoid(matSkin, 0.14, 0.13, 0.13, 0.13, 1.66, 0.20)); // bust R

// gilded scallop-shell bra
const braGeo = scallopGeometry(0.16);
for (const side of [-1, 1]) {
  const cup = new THREE.Mesh(braGeo, matGold);
  cup.position.set(side * 0.13, 1.63, 0.20);
  cup.scale.setScalar(0.55);
  cup.rotation.set(-0.25, 0, side * 0.35);
  fig.add(cup);
}

/* ---- Neck & head ---- */
fig.add(bone(matSkin, v(0, 1.96, 0.0), v(0, 2.12, 0.01), 0.09));
const head = ellipsoid(matSkin, 0.215, 0.245, 0.225, 0.0, 2.30, 0.02);
head.rotation.set(0.05, 0.18, -0.06);
fig.add(head);

// face details
fig.add(ellipsoid(matSkin, 0.02, 0.022, 0.02, 0.01, 2.28, 0.235)); // nose
const lips = ellipsoid(matRose, 0.045, 0.022, 0.02, 0.015, 2.22, 0.225);
fig.add(lips);
for (const side of [-1, 1]) {
  const eyeGeo = new THREE.TorusGeometry(0.033, 0.006, 8, 16, Math.PI);
  const eye = new THREE.Mesh(eyeGeo, matEye);
  eye.position.set(0.01 + side * 0.075, 2.31, 0.205);
  eye.rotation.set(Math.PI, side * 0.1, 0);
  fig.add(eye);
}

/* ---- Arms & hands ---- */
// left arm raised toward the hair
fig.add(bone(matSkin, v(-0.36, 1.90, 0.03), v(-0.42, 1.70, 0.12), 0.075));
fig.add(bone(matSkin, v(-0.42, 1.70, 0.12), v(-0.24, 1.98, 0.14), 0.062));
fig.add(ellipsoid(matSkin, 0.06, 0.07, 0.05, -0.22, 2.02, 0.14));
// right arm resting on the tail curl
fig.add(bone(matSkin, v(0.36, 1.90, 0.03), v(0.46, 1.64, 0.14), 0.075));
fig.add(bone(matSkin, v(0.46, 1.64, 0.14), v(0.52, 1.44, 0.20), 0.062));
fig.add(ellipsoid(matSkin, 0.06, 0.05, 0.07, 0.53, 1.42, 0.22));

/* ---- Hair ---- */
const hair = new THREE.Group();
const matGoldHair = new THREE.MeshPhysicalMaterial({
  color: 0xd7b45c, metalness: 1.0, roughness: 0.32, clearcoat: 0.4, envMapIntensity: 1.4
});
// volume masses
hair.add(ellipsoid(matAqua, 0.25, 0.20, 0.24, 0.0, 2.42, -0.03));  // crown
hair.add(ellipsoid(matAqua, 0.24, 0.27, 0.22, 0.0, 2.34, -0.15));  // back mass
hair.add(ellipsoid(matAqua, 0.13, 0.18, 0.15, -0.20, 2.32, -0.04)); // side L
hair.add(ellipsoid(matAqua, 0.13, 0.18, 0.15, 0.20, 2.32, -0.04));  // side R

const hairR = (u) => { const r = 0.055 * (1 - u) + 0.015; return [r, r * 0.6]; };
// flowing strands down the back
const nBack = 11;
for (let i = 0; i < nBack; i++) {
  const s = (i / (nBack - 1)) * 2 - 1;
  const ph = i * 1.3;
  const pts = [
    v(0.16 * s, 2.44, -0.05 - 0.03 * Math.abs(s)),
    v(0.24 * s, 2.30, -0.20),
    v(0.30 * s + 0.03 * Math.sin(ph), 2.06, -0.24),
    v(0.31 * s + 0.06 * Math.sin(ph + 1), 1.82, -0.15),
    v(0.29 * s + 0.09 * Math.sin(ph + 2), 1.60, -0.02),
    v(0.25 * s + 0.10 * Math.sin(ph + 3), 1.44, 0.10)
  ];
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  const g = taperedTube(curve, 48, 8, hairR);
  hair.add(new THREE.Mesh(g, (i % 3 === 0) ? matGoldHair : matAqua));
}
// face-framing front strands
for (const side of [-1, 1]) {
  const pts = [
    v(0.17 * side, 2.42, 0.03),
    v(0.23 * side, 2.20, 0.11),
    v(0.24 * side, 1.98, 0.15),
    v(0.21 * side, 1.78, 0.14),
    v(0.17 * side, 1.60, 0.09),
    v(0.14 * side, 1.47, 0.02)
  ];
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  hair.add(new THREE.Mesh(taperedTube(curve, 40, 8, hairR), matAqua));
}
// little gold shell hair clip
const clip = new THREE.Mesh(scallopGeometry(0.16), matGold);
clip.position.set(-0.22, 2.34, 0.08);
clip.scale.setScalar(0.42);
clip.rotation.set(-0.4, 0.4, 0.5);
hair.add(clip);
fig.add(hair);

/* ------------------------------------------------------------------ */
/* Shadows + centering                                                */
/* ------------------------------------------------------------------ */
fig.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

const box = new THREE.Box3().setFromObject(fig);
const center = box.getCenter(new THREE.Vector3());
fig.position.x -= center.x;
fig.position.z -= center.z;
fig.position.y -= box.min.y;
fig.rotation.y = -0.25;
scene.add(fig);
const targetY = (box.max.y - box.min.y) * 0.48;

/* ---- Shadow-only ground ---- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(50, 50),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ */
/* Controls                                                           */
/* ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.minDistance = 2.6;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, targetY, 0);
controls.update();

/* ------------------------------------------------------------------ */
/* Resize + render loop                                               */
/* ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
