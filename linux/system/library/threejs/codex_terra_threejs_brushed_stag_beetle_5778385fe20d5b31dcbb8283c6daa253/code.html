<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brushed Metal Stag Beetle</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0d}
  canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07090c);
scene.fog = new THREE.Fog(0x07090c, 17, 31);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.6, 5.3, 9.6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.62;
controls.target.set(0, 0.45, 0);

const beetle = new THREE.Group();
beetle.rotation.x = -0.08;
scene.add(beetle);

const brushedAluminum = new THREE.MeshStandardMaterial({
  color: 0x9ca5aa, metalness: 0.96, roughness: 0.29
});
const darkAluminum = new THREE.MeshStandardMaterial({
  color: 0x454c52, metalness: 0.92, roughness: 0.34
});
const bronze = new THREE.MeshStandardMaterial({
  color: 0x8d572c, metalness: 0.88, roughness: 0.27
});
const bronzeDark = new THREE.MeshStandardMaterial({
  color: 0x4d2c16, metalness: 0.9, roughness: 0.32
});
const satin = new THREE.MeshStandardMaterial({
  color: 0x737b80, metalness: 0.86, roughness: 0.42
});
const blackMetal = new THREE.MeshStandardMaterial({
  color: 0x16191b, metalness: 0.75, roughness: 0.28
});

function smooth(mesh, cast = true) {
  mesh.castShadow = cast;
  mesh.receiveShadow = true;
  mesh.geometry.computeVertexNormals();
  return mesh;
}

function ellipsoid(material, scale, position, rotation = [0,0,0], segments = 48) {
  const mesh = smooth(new THREE.Mesh(new THREE.SphereGeometry(1, segments, 24), material));
  mesh.scale.set(...scale);
  mesh.position.set(...position);
  mesh.rotation.set(...rotation);
  beetle.add(mesh);
  return mesh;
}

function capsuleBetween(a, b, radius, material, radial = 12) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const midpoint = start.clone().add(end).multiplyScalar(0.5);
  const length = start.distanceTo(end);
  const mesh = smooth(new THREE.Mesh(new THREE.CylinderGeometry(radius, radius * 0.92, length, radial, 1, false), material));
  mesh.position.copy(midpoint);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), end.clone().sub(start).normalize());
  beetle.add(mesh);
  return mesh;
}

function curveTube(points, radius, material, tubular = 48, radial = 10) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), false, 'centripetal');
  const mesh = smooth(new THREE.Mesh(new THREE.TubeGeometry(curve, tubular, radius, radial, false), material));
  beetle.add(mesh);
  return mesh;
}

function bladeShape(points, thickness, material) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
  shape.closePath();
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: thickness, bevelEnabled: true, bevelThickness: 0.055,
    bevelSize: 0.055, bevelSegments: 2, curveSegments: 20
  });
  geometry.center();
  const mesh = smooth(new THREE.Mesh(geometry, material));
  beetle.add(mesh);
  return mesh;
}

function addGrain(mesh, width, length, z, material, count, angle = 0) {
  const group = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const offset = (i / (count - 1) - 0.5) * width;
    const line = new THREE.Mesh(
      new THREE.BoxGeometry(0.009, length * (0.72 + 0.2 * Math.sin(i * 2.7)), 0.008),
      material
    );
    line.position.set(offset, 0, z);
    line.rotation.z = angle;
    group.add(line);
  }
  group.position.copy(mesh.position);
  group.rotation.copy(mesh.rotation);
  beetle.add(group);
}

const abdomen = ellipsoid(bronze, [2.08, 0.72, 2.72], [0, 0.65, 0.85], [0.035,0,0], 64);
const thorax = ellipsoid(brushedAluminum, [1.72, 0.78, 1.48], [0, 0.79, -1.24], [-0.05,0,0], 56);
const head = ellipsoid(darkAluminum, [1.38, 0.62, 1.05], [0, 0.67, -2.48], [-0.08,0,0], 48);

const seamMaterial = new THREE.MeshStandardMaterial({ color: 0x24180f, metalness: 0.76, roughness: 0.38 });
for (let z = -0.58; z <= 2.45; z += 0.43) {
  const arc = new THREE.Mesh(new THREE.TorusGeometry(1.27 - Math.max(0, z - 1.6) * 0.14, 0.029, 8, 48, Math.PI), seamMaterial);
  arc.rotation.x = Math.PI / 2;
  arc.rotation.z = Math.PI;
  arc.position.set(0, 0.68, z);
  arc.scale.z = 1.48;
  beetle.add(arc);
}

const centerRidge = curveTube([
  [0,1.35,-0.3],[0,1.45,0.5],[0,1.4,1.4],[0,1.22,2.65]
], 0.065, brushedAluminum, 48, 8);

const wingSplit = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.16, 4.48), bronzeDark);
wingSplit.position.set(0, 1.03, 0.98);
wingSplit.rotation.x = -0.1;
beetle.add(wingSplit);

addGrain(abdomen, 3.25, 3.9, 2.58, bronzeDark, 62, 0.02);
addGrain(thorax, 2.45, 1.65, 1.42, darkAluminum, 42, -0.05);

const pronotumRim = new THREE.Mesh(new THREE.TorusGeometry(1.27, 0.08, 10, 44), bronze);
pronotumRim.scale.set(1, 0.45, 0.8);
pronotumRim.position.set(0, 1.1, -1.15);
pronotumRim.rotation.x = Math.PI / 2;
beetle.add(pronotumRim);

for (const side of [-1, 1]) {
  const eye = ellipsoid(blackMetal, [0.23, 0.18, 0.2], [side * 1.06, 0.86, -2.71], [0,0,0], 20);
  const eyeGlint = ellipsoid(brushedAluminum, [0.055,0.035,0.055], [side * 1.19, 0.92, -2.78], [0,0,0], 12);

  const baseX = side * 0.77;
  const legZ = [-1.45, -0.12, 1.36];
  for (let i = 0; i < legZ.length; i++) {
    const z = legZ[i];
    const hip = [baseX, 0.64, z];
    const knee = [side * (1.8 + i * 0.07), 0.3, z + (i - 1) * 0.2];
    const ankle = [side * 2.25, -0.25, z + 0.42];
    const foot = [side * 2.46, -0.56, z + 0.1];
    capsuleBetween(hip, knee, 0.105, satin);
    capsuleBetween(knee, ankle, 0.082, satin);
    capsuleBetween(ankle, foot, 0.057, darkAluminum);
    ellipsoid(bronze, [0.15,0.13,0.15], knee, [0,0,0], 16);
    curveTube([
      foot,
      [side * 2.58, -0.59, z - 0.04],
      [side * 2.66, -0.61, z - 0.11]
    ], 0.025, blackMetal, 12, 6);
    curveTube([
      [side * 2.43, -0.54, z + 0.1],
      [side * 2.58, -0.54, z + 0.22],
      [side * 2.63, -0.55, z + 0.28]
    ], 0.019, blackMetal, 10, 6);
  }

  curveTube([
    [side * 0.78, 0.81, -3.04],
    [side * 1.2, 0.98, -3.55],
    [side * 1.45, 1.02, -3.96]
  ], 0.045, satin, 22, 7);
  ellipsoid(bronze, [0.08,0.08,0.08], [side * 1.46,1.02,-3.98], [0,0,0], 12);
}

function mandible(side) {
  const outer = [
    [side * 0.54, 0.18], [side * 0.87, 0.47], [side * 1.14, 1.1],
    [side * 1.26, 1.95], [side * 1.15, 2.68], [side * 0.84, 3.35],
    [side * 0.55, 3.76], [side * 0.58, 3.39], [side * 0.82, 2.75],
    [side * 0.91, 2.02], [side * 0.79, 1.35], [side * 0.47, 0.63]
  ];
  const blade = bladeShape(outer, 0.23, brushedAluminum);
  blade.rotation.x = Math.PI / 2;
  blade.position.set(0, 0.72, -2.93);

  const innerBlade = bladeShape([
    [side * 0.65, 1.18], [side * 0.97, 1.48], [side * 0.82, 1.78], [side * 0.49, 1.48]
  ], 0.17, bronze);
  innerBlade.rotation.x = Math.PI / 2;
  innerBlade.position.set(0, 0.84, -2.95);

  const tooth1 = bladeShape([
    [side * 0.78, 2.02], [side * 1.34, 2.08], [side * 0.91, 2.38]
  ], 0.18, brushedAluminum);
  tooth1.rotation.x = Math.PI / 2;
  tooth1.position.set(0, 0.79, -2.95);

  const tooth2 = bladeShape([
    [side * 0.69, 2.71], [side * 1.22, 2.9], [side * 0.68, 3.06]
  ], 0.16, brushedAluminum);
  tooth2.rotation.x = Math.PI / 2;
  tooth2.position.set(0, 0.79, -2.95);

  const groove = curveTube([
    [side * 0.68, 0.86, -3.1],
    [side * 0.99, 0.86, -4.15],
    [side * 0.93, 0.86, -5.15],
    [side * 0.63, 0.86, -6.3]
  ], 0.032, bronzeDark, 42, 6);
  return blade;
}
mandible(-1);
mandible(1);

const jawHingeL = ellipsoid(bronze, [0.32,0.25,0.28], [-0.62,0.78,-3.06], [0,0,0], 20);
const jawHingeR = ellipsoid(bronze, [0.32,0.25,0.28], [0.62,0.78,-3.06], [0,0,0], 20);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(13, 96),
  new THREE.MeshStandardMaterial({ color: 0x11161a, metalness: 0.28, roughness: 0.68 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.72;
ground.receiveShadow = true;
scene.add(ground);

const ring = new THREE.Mesh(
  new THREE.RingGeometry(4.5, 4.56, 96),
  new THREE.MeshBasicMaterial({ color: 0x5c3b21, transparent: true, opacity: 0.55, side: THREE.DoubleSide })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = -0.708;
scene.add(ring);

const hemi = new THREE.HemisphereLight(0xb5c6d4, 0x24140b, 1.5);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xe7f3ff, 4.1);
key.position.set(5.5, 8, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -8;
scene.add(key);

const warm = new THREE.PointLight(0xd38038, 38, 13, 2);
warm.position.set(-5, 2.5, 1);
scene.add(warm);

const cool = new THREE.PointLight(0x75b9ff, 22, 12, 2);
cool.position.set(3, 4, -6);
scene.add(cool);

const rim = new THREE.SpotLight(0xffffff, 780, 20, 0.5, 0.6, 1.5);
rim.position.set(-2, 7, -5);
rim.target.position.set(0, 0.3, -1);
rim.castShadow = true;
scene.add(rim, rim.target);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
