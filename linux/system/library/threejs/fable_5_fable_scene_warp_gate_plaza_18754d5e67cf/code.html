<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Warp Gate Plaza</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0e1022}
  canvas{display:block}
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }

<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================ 1. CONFIG & PALETTE ============================ */
const CFG = {
  seed: 771204,
  gate: { radius: 9, tube: 1.3, y: 11 },     // torus ring dimensions / hub height
  daisTop: 1.8,                               // raised platform under the gate
  plazaR: 26,
  pylonsOuter: { r: 16, n: 8, h: 7.5 },
  pylonsInner: { r: 10.5, n: 6, h: 4.6 },
};
const PAL = {
  sky: 0x0e1022, fog: 0x131638,
  stone: 0x1a1e2c, trim: 0x2c3350, steel: 0x8b96ad, dark: 0x232838,
  teal: 0x36e0d8, violet: 0x8f5bff, amber: 0xffb35c, ember: 0xff5c7a,
  pod: 0xcdd6e4, podGlass: 0x0f2233,
};

/* ============================ 2. PRNG & HELPERS ============================ */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng  = mulberry32(CFG.seed);
const rand = (a, b) => a + rng() * (b - a);
const TAU  = Math.PI * 2;
const dummy = new THREE.Object3D();
function setShadow(root, cast = true, receive = true){
  root.traverse(o => { if (o.isMesh){ o.castShadow = cast; o.receiveShadow = receive; } });
}

/* ============================ 3. RENDERER / SCENE / CAMERA ============================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.sky);
scene.fog = new THREE.FogExp2(PAL.fog, 0.0115);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);
camera.position.set(30, 17.5, 36);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 7.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.15;
controls.minDistance = 26;
controls.maxDistance = 60;
controls.maxPolarAngle = 1.42;

/* ============================ 4. CANVAS TEXTURES ============================ */
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  return t;
}
// plaza slab: dark stone with concentric seams (color) + glowing circuitry rings (emissive)
const plazaColorTex = canvasTex(1024, 1024, (g, w, h) => {
  const cx = w / 2, cy = h / 2;
  g.fillStyle = '#191d2b'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1600; i++){
    g.fillStyle = rng() < 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.12)';
    g.fillRect(rand(0, w), rand(0, h), rand(1, 4), rand(1, 4));
  }
  g.strokeStyle = '#232a3e';
  for (let r = 60; r < 520; r += 46){ g.lineWidth = r % 92 < 46 ? 5 : 2;
    g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.stroke(); }
  g.lineWidth = 2;
  for (let k = 0; k < 24; k++){ const a = k * TAU / 24;
    g.beginPath(); g.moveTo(cx + Math.cos(a) * 90, cy + Math.sin(a) * 90);
    g.lineTo(cx + Math.cos(a) * 512, cy + Math.sin(a) * 512); g.stroke(); }
});
const plazaGlowTex = canvasTex(1024, 1024, (g, w, h) => {
  const cx = w / 2, cy = h / 2;
  g.fillStyle = '#000'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#2de0d4';
  [150, 262, 384].forEach((r, i) => { g.lineWidth = 7 - i * 2;
    g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.stroke(); });
  g.fillStyle = '#2de0d4';
  for (let k = 0; k < 48; k++){ const a = k * TAU / 48, r = 384;
    g.save(); g.translate(cx + Math.cos(a) * r, cy + Math.sin(a) * r); g.rotate(a);
    g.fillRect(-2, -9, 4, 18); g.restore(); }
  g.strokeStyle = '#7a4fd8'; g.lineWidth = 3;
  g.beginPath(); g.arc(cx, cy, 208, 0, TAU); g.stroke();
});
// holographic departures board
const boardTex = canvasTex(512, 384, (g, w, h) => {
  g.fillStyle = 'rgba(5,18,28,0.72)'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#35e0d6'; g.lineWidth = 4; g.strokeRect(5, 5, w - 10, h - 10);
  g.fillStyle = '#7ef2e9'; g.font = 'bold 34px monospace';
  g.fillText('WARP DEPARTURES', 22, 46);
  g.fillStyle = '#35e0d6'; g.fillRect(14, 60, w - 28, 3);
  const rows = [['VEGA PRIME', 'G-1', 'BOARDING', '#ffb35c'], ['NOVA KYOTO', 'G-2', 'ON TIME', '#5df0dd'],
    ['ELYSIUM-9', 'G-1', 'ON TIME', '#5df0dd'], ['THARSIS GATE', 'G-3', 'DELAYED', '#ff6d84'],
    ['AURIGA REEF', 'G-2', 'ON TIME', '#5df0dd'], ['CINDER MOON', 'G-1', 'BOARDING', '#ffb35c'],
    ['HELIX SPUR', 'G-3', 'ON TIME', '#5df0dd']];
  g.font = '22px monospace';
  rows.forEach((r, i) => {
    const y = 100 + i * 40;
    g.fillStyle = '#c8f4ef'; g.fillText(r[0], 22, y);
    g.fillStyle = '#8fb8d8'; g.fillText(r[1], 250, y);
    g.fillStyle = '#8fb8d8'; g.fillText(`0${8 + (i % 2)}:${10 + Math.floor(rand(0, 49))}`, 310, y);
    g.fillStyle = r[3]; g.fillText(r[2], 400, y);
  });
});
// vertical light-banner gradient with glyph ticks
const bannerTex = canvasTex(128, 512, (g, w, h) => {
  const grd = g.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, 'rgba(90,240,230,0.95)'); grd.addColorStop(0.55, 'rgba(90,170,255,0.45)');
  grd.addColorStop(1, 'rgba(120,80,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,255,255,0.85)';
  for (let y = 26; y < h * 0.8; y += 44) g.fillRect(w / 2 - rand(8, 26), y, rand(16, 52), 9);
});
// gas-giant backdrop with soft bands
const planetTex = canvasTex(256, 256, (g, w, h) => {
  const bands = ['#c6ccdf', '#a9b3d2', '#8e9cc4', '#b7bedd', '#9aa6cc', '#c1c8e2'];
  for (let i = 0; i < 16; i++){ g.fillStyle = bands[i % bands.length];
    g.fillRect(0, i * h / 16, w, h / 16 + 1); }
  g.fillStyle = 'rgba(230,235,250,0.6)';
  g.beginPath(); g.ellipse(w * 0.62, h * 0.58, 34, 14, 0.3, 0, TAU); g.fill();
});
const skyTex = canvasTex(256, 512, (g, w, h) => {
  const grd = g.createLinearGradient(0, 0, 0, h);
  grd.addColorStop(0, '#070818'); grd.addColorStop(0.5, '#10122c');
  grd.addColorStop(0.76, '#1d1b46'); grd.addColorStop(0.9, '#2a2050'); grd.addColorStop(1, '#131230');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
});

/* ============================ 5. MATERIALS ============================ */
const M = {
  plaza: new THREE.MeshStandardMaterial({ map: plazaColorTex, emissiveMap: plazaGlowTex,
    emissive: 0xffffff, emissiveIntensity: 0.9, roughness: 0.85, metalness: 0.15 }),
  ground: new THREE.MeshStandardMaterial({ color: 0x101322, roughness: 0.95 }),
  stone: new THREE.MeshStandardMaterial({ color: PAL.stone, roughness: 0.8, metalness: 0.1 }),
  trim:  new THREE.MeshStandardMaterial({ color: PAL.trim, roughness: 0.55, metalness: 0.45 }),
  steel: new THREE.MeshStandardMaterial({ color: PAL.steel, roughness: 0.35, metalness: 0.85 }),
  dark:  new THREE.MeshStandardMaterial({ color: PAL.dark, roughness: 0.6, metalness: 0.5 }),
  rune:  new THREE.MeshStandardMaterial({ color: 0x0c2a2a, emissive: PAL.teal, emissiveIntensity: 2.2 }),
  violetRune: new THREE.MeshStandardMaterial({ color: 0x180c30, emissive: PAL.violet, emissiveIntensity: 2 }),
  orb:   new THREE.MeshStandardMaterial({ color: 0x0c2a2a, emissive: 0x9df3ff, emissiveIntensity: 2.6 }),
  amberGlow: new THREE.MeshStandardMaterial({ color: 0x33200a, emissive: PAL.amber, emissiveIntensity: 1.8 }),
  pod:   new THREE.MeshStandardMaterial({ color: PAL.pod, roughness: 0.3, metalness: 0.55 }),
  podGlass: new THREE.MeshStandardMaterial({ color: PAL.podGlass, roughness: 0.1, metalness: 0.7 }),
  engine: new THREE.MeshStandardMaterial({ color: 0x0c2a2a, emissive: PAL.teal, emissiveIntensity: 2.4 }),
  board: new THREE.MeshBasicMaterial({ map: boardTex, transparent: true, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending, depthWrite: false }),
  banner: new THREE.MeshBasicMaterial({ map: bannerTex, transparent: true, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending, depthWrite: false }),
  bolt: new THREE.LineBasicMaterial({ color: 0xbdf2ff, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false }),
  spire: new THREE.MeshStandardMaterial({ color: 0x151a2a, roughness: 0.9 }),
  beacon: new THREE.MeshBasicMaterial({ color: 0xff8daa }),
  crateA: new THREE.MeshStandardMaterial({ color: 0x6c7890, roughness: 0.7, metalness: 0.3 }),
  crateB: new THREE.MeshStandardMaterial({ color: 0x9a6a3f, roughness: 0.85 }),
  strap: new THREE.MeshStandardMaterial({ color: 0x20242f, roughness: 0.6 }),
};
// swirling portal membrane (custom shader, time-driven spiral)
const portalUniforms = { uTime: { value: 0 } };
const membraneMat = new THREE.ShaderMaterial({
  uniforms: portalUniforms, transparent: true, side: THREE.DoubleSide, depthWrite: false,
  vertexShader: `varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `varying vec2 vUv; uniform float uTime;
    void main(){
      vec2 p = vUv * 2.0 - 1.0;
      float r = length(p), a = atan(p.y, p.x);
      float spiral = sin(9.0 * r - uTime * 1.5 + a * 3.0);
      float waves  = 0.5 + 0.5 * sin(a * 2.0 - uTime * 0.65 + r * 5.0);
      vec3 col = mix(vec3(0.12, 0.85, 0.9), vec3(0.55, 0.32, 1.0), waves);
      col += vec3(0.9, 0.95, 1.0) * pow(max(spiral, 0.0), 3.0) * 0.4;
      col *= smoothstep(1.0, 0.15, r) * 1.5 + pow(max(0.0, 1.0 - r * 3.5), 2.0) * 2.5;
      float alpha = smoothstep(1.0, 0.86, r) * 0.92;
      gl_FragColor = vec4(col, alpha);
    }`,
});

/* ============================ 6. BUILDERS ============================ */
// --- the warp gate: ring, membrane, buttresses, rune ticks ---
function buildWarpGate(){
  const g = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(CFG.gate.radius, CFG.gate.tube, 16, 56), M.steel);
  ring.position.y = CFG.gate.y; g.add(ring);
  const panelGeo = new THREE.BoxGeometry(1.15, 0.55, 2.9);          // segmented cladding
  const panels = new THREE.InstancedMesh(panelGeo, M.trim, 28);
  for (let i = 0; i < 28; i++){
    const a = i * TAU / 28;
    dummy.position.set(Math.cos(a) * CFG.gate.radius, CFG.gate.y + Math.sin(a) * CFG.gate.radius, 0);
    dummy.rotation.set(0, 0, a + Math.PI / 2); dummy.updateMatrix();
    panels.setMatrixAt(i, dummy.matrix);
  }
  panels.castShadow = true; g.add(panels);
  const runeGeo = new THREE.BoxGeometry(0.5, 0.22, 0.1);            // glowing rune ticks
  const runes = new THREE.InstancedMesh(runeGeo, M.rune, 72);
  for (let i = 0; i < 72; i++){
    const a = (i % 36) * TAU / 36, side = i < 36 ? 1 : -1;
    dummy.position.set(Math.cos(a) * CFG.gate.radius, CFG.gate.y + Math.sin(a) * CFG.gate.radius, side * 1.42);
    dummy.rotation.set(0, 0, a + Math.PI / 2); dummy.updateMatrix();
    runes.setMatrixAt(i, dummy.matrix);
  }
  g.add(runes);
  const membrane = new THREE.Mesh(new THREE.CircleGeometry(8.15, 64), membraneMat);
  membrane.position.y = CFG.gate.y; g.add(membrane);
  for (const s of [-1, 1]){                                          // leaning buttresses
    const b = new THREE.Mesh(new THREE.BoxGeometry(1.7, 8.6, 3.2), M.stone);
    b.position.set(s * 10.1, CFG.daisTop + 4.1, 0); b.rotation.z = s * 0.32; g.add(b);
    const foot = new THREE.Mesh(new THREE.BoxGeometry(3.4, 1.1, 4.4), M.trim);
    foot.position.set(s * 11.2, CFG.daisTop + 0.55, 0); g.add(foot);
    const fin = new THREE.Mesh(new THREE.BoxGeometry(0.5, 3.4, 0.5), M.violetRune);
    fin.position.set(s * 12.1, CFG.daisTop + 2.2, 0); g.add(fin);
  }
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(3.4, 4.4, 1.5, 10), M.trim);
  collar.position.y = CFG.daisTop + 0.75; g.add(collar);
  const crown = new THREE.Mesh(new THREE.ConeGeometry(0.85, 2.4, 8), M.trim);   // apex antenna
  crown.position.y = CFG.gate.y + CFG.gate.radius + CFG.gate.tube + 1.0; g.add(crown);
  const crownOrb = new THREE.Mesh(new THREE.SphereGeometry(0.42, 12, 10), M.orb);
  crownOrb.position.y = crown.position.y + 1.5; g.add(crownOrb);
  return g;
}
// --- power pylon: plinth, tapered mast, coil discs, tip orb ---
function buildPylon(h){
  const g = new THREE.Group();
  const plinth = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.8, 1.7), M.stone);
  plinth.position.y = 0.4; g.add(plinth);
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.62, h - 1.6, 8), M.trim);
  mast.position.y = 0.8 + (h - 1.6) / 2; g.add(mast);
  for (let i = 0; i < 3; i++){
    const coil = new THREE.Mesh(new THREE.CylinderGeometry(0.62 - i * 0.1, 0.62 - i * 0.1, 0.16, 12), M.dark);
    coil.position.y = h - 1.5 + i * 0.42; g.add(coil);
  }
  const orb = new THREE.Mesh(new THREE.SphereGeometry(0.36, 12, 10), M.orb);
  orb.position.y = h; g.add(orb);
  g.userData.tipY = h;
  return g;
}
// --- embarkation ramp climbing onto the dais, with lit railings ---
function buildRamp(len, rise){
  const g = new THREE.Group();
  const slope = Math.atan2(rise, len), hyp = Math.hypot(len, rise);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.28, hyp), M.stone);
  deck.position.set(0, rise / 2 + 0.02, len / 2); deck.rotation.x = slope; g.add(deck);
  for (const s of [-1, 1]){
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.9, hyp), M.trim);
    rail.position.set(s * 2.3, rise / 2 + 0.55, len / 2); rail.rotation.x = slope; g.add(rail);
    const strip = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, hyp), M.rune);
    strip.position.set(s * 2.3, rise / 2 + 1.02, len / 2); strip.rotation.x = slope; g.add(strip);
  }
  const arch = new THREE.Mesh(new THREE.TorusGeometry(2.6, 0.18, 8, 20, Math.PI), M.trim);
  arch.position.set(0, 0.1, len - 0.4); g.add(arch);
  return g;
}
// --- hovering transit pod: hull, canopy, engine ring, skids ---
function buildPod(){
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.CapsuleGeometry(0.85, 2.1, 5, 14), M.pod);
  hull.rotation.x = Math.PI / 2; g.add(hull);
  const canopy = new THREE.Mesh(new THREE.SphereGeometry(0.62, 14, 12, 0, TAU, 0, 1.35), M.podGlass);
  canopy.position.set(0, 0.42, 0.75); g.add(canopy);
  const fin = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.9), M.trim);
  fin.position.set(0, 0.7, -1.35); g.add(fin);
  const ringE = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.14, 8, 18), M.engine);
  ringE.position.z = -1.95; g.add(ringE);
  for (const s of [-1, 1]){
    const skid = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.1, 2.0), M.dark);
    skid.position.set(s * 0.62, -0.95, 0); g.add(skid);
    const strut = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.5, 0.08), M.dark);
    strut.position.set(s * 0.62, -0.65, 0); g.add(strut);
  }
  const beacon = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), M.amberGlow);
  beacon.position.set(0, 1.02, -1.3); g.add(beacon);
  return g;
}
// --- holographic destination board on a pylon stand ---
function buildHoloBoard(){
  const g = new THREE.Group();
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.2, 4.2, 8), M.trim);
  post.position.y = 2.1; g.add(post);
  const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.7, 0.25, 10), M.dark);
  foot.position.y = 0.12; g.add(foot);
  const emitter = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.18, 0.3), M.dark);
  emitter.position.y = 4.25; g.add(emitter);
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(4.3, 2.7), M.board);
  panel.position.y = 5.85; g.add(panel);
  for (const s of [-1, 1]){
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), M.rune);
    dot.position.set(s * 1.85, 4.25, 0.18); g.add(dot);
  }
  return g;
}
// --- banner-like light column on a slender pole ---
function buildBannerColumn(){
  const g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.2, 9.4, 8), M.trim);
  pole.position.y = 4.7; g.add(pole);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.14, 0.14), M.dark);
  arm.position.set(0.6, 9.1, 0); g.add(arm);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(0.26, 10, 8), M.orb);
  cap.position.y = 9.55; g.add(cap);
  const banner = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 7.4), M.banner);
  banner.position.set(0.85, 5.3, 0); g.add(banner);
  const banner2 = banner.clone(); banner2.rotation.y = Math.PI / 2;
  banner2.position.set(0.85, 5.3, 0.01); g.add(banner2);
  return g;
}
// --- travelers' luggage: seeded pile of crates and duffels ---
function buildLuggagePile(){
  const g = new THREE.Group();
  const n = 3 + Math.floor(rand(0, 3));
  for (let i = 0; i < n; i++){
    const w = rand(0.5, 0.95), hh = rand(0.35, 0.7), d = rand(0.4, 0.8);
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, hh, d), rng() < 0.6 ? M.crateA : M.crateB);
    box.position.set(rand(-0.9, 0.9), hh / 2, rand(-0.9, 0.9));
    box.rotation.y = rand(0, TAU); g.add(box);
    const strap = new THREE.Mesh(new THREE.BoxGeometry(w + 0.04, hh + 0.04, 0.1), M.strap);
    strap.position.copy(box.position); strap.rotation.copy(box.rotation); g.add(strap);
  }
  if (rng() < 0.7){
    const duf = new THREE.Mesh(new THREE.CapsuleGeometry(0.24, 0.7, 4, 10), M.crateB);
    duf.rotation.set(Math.PI / 2, 0, rand(0, TAU)); duf.position.set(rand(-0.8, 0.8), 0.24, rand(-0.8, 0.8));
    g.add(duf);
  }
  return g;
}
// --- luggage trolley: flat cart, handlebar, stacked cases ---
function buildTrolley(){
  const g = new THREE.Group();
  const bed = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.08, 0.72), M.trim);
  bed.position.y = 0.34; g.add(bed);
  for (const [sx, sz] of [[0.45, 0.28], [0.45, -0.28], [-0.45, 0.28], [-0.45, -0.28]]){
    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.06, 10), M.strap);
    wheel.rotation.x = Math.PI / 2; wheel.position.set(sx, 0.09, sz); g.add(wheel);
  }
  for (const s of [-1, 1]){
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.9, 8), M.steel);
    bar.position.set(0.55, 0.83, s * 0.3); g.add(bar);
  }
  const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.66, 8), M.steel);
  grip.rotation.x = Math.PI / 2; grip.position.set(0.55, 1.28, 0); g.add(grip);
  let y = 0.38;
  for (let i = 0; i < 2; i++){
    const hh = rand(0.24, 0.4);
    const box = new THREE.Mesh(new THREE.BoxGeometry(rand(0.7, 0.95), hh, rand(0.45, 0.62)),
      i ? M.crateB : M.crateA);
    box.position.set(rand(-0.06, 0.06), y + hh / 2, rand(-0.05, 0.05));
    box.rotation.y = rand(-0.2, 0.2); g.add(box); y += hh;
  }
  return g;
}
// --- plaza furniture: bench and ticket kiosk ---
function buildBench(){
  const g = new THREE.Group();
  const seat = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.14, 0.7), M.dark);
  seat.position.y = 0.55; g.add(seat);
  for (const s of [-1, 1]){
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.55, 0.66), M.trim);
    leg.position.set(s * 1.05, 0.27, 0); g.add(leg);
  }
  const glow = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.05, 0.06), M.rune);
  glow.position.set(0, 0.5, 0.36); g.add(glow);
  return g;
}
function buildKiosk(){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.15, 2.5, 8), M.stone);
  body.position.y = 1.25; g.add(body);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(1.35, 0.7, 8), M.trim);
  cap.position.y = 2.85; g.add(cap);
  const sign = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.4, 0.12), M.amberGlow);
  sign.position.set(0, 2.15, 1.02); g.add(sign);
  const slot = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 0.1), M.dark);
  slot.position.set(0, 1.35, 1.05); g.add(slot);
  return g;
}

/* ============================ 7. ENVIRONMENT SHELL ============================ */
function buildEnvironment(){
  const g = new THREE.Group();
  const ground = new THREE.Mesh(new THREE.CircleGeometry(220, 48), M.ground);
  ground.rotation.x = -Math.PI / 2; ground.position.y = -0.8; ground.receiveShadow = true; g.add(ground);
  const slab = new THREE.Mesh(new THREE.CylinderGeometry(CFG.plazaR, CFG.plazaR + 1.4, 0.8, 64), M.plaza);
  slab.position.y = -0.4; slab.receiveShadow = true; g.add(slab);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(CFG.plazaR, 0.22, 8, 64), M.trim);
  rim.rotation.x = Math.PI / 2; rim.position.y = 0.02; g.add(rim);
  const d1 = new THREE.Mesh(new THREE.CylinderGeometry(13, 13.8, 0.9, 48), M.stone);
  d1.position.y = 0.45; d1.receiveShadow = true; g.add(d1);
  const d2 = new THREE.Mesh(new THREE.CylinderGeometry(11.5, 12.2, 0.9, 48), M.stone);
  d2.position.y = 1.35; d2.receiveShadow = true; g.add(d2);
  const daisGlow = new THREE.Mesh(new THREE.TorusGeometry(12.0, 0.1, 6, 48), M.rune);
  daisGlow.rotation.x = Math.PI / 2; daisGlow.position.y = 1.82; g.add(daisGlow);
  const sky = new THREE.Mesh(new THREE.SphereGeometry(180, 32, 20),
    new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false }));
  g.add(sky);
  const starN = 420, pos = new Float32Array(starN * 3);
  for (let i = 0; i < starN; i++){
    const a = rand(0, TAU), e = rand(0.05, 1.4), r = 170;
    pos[i * 3] = Math.cos(a) * Math.cos(e) * r;
    pos[i * 3 + 1] = Math.sin(e) * r;
    pos[i * 3 + 2] = Math.sin(a) * Math.cos(e) * r;
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xcfdcff, size: 1.7,
    sizeAttenuation: false, transparent: true, opacity: 0.9, fog: false })));
  const planet = new THREE.Mesh(new THREE.SphereGeometry(20, 28, 22),
    new THREE.MeshBasicMaterial({ map: planetTex, fog: false }));
  planet.position.set(-78, 34, -108); planet.rotation.z = 0.25; g.add(planet);
  const halo = new THREE.Mesh(new THREE.RingGeometry(26, 40, 40),
    new THREE.MeshBasicMaterial({ color: 0x9aa8d8, transparent: true, opacity: 0.28,
      side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  halo.position.copy(planet.position); halo.rotation.set(1.35, 0.2, 0); g.add(halo);
  for (let i = 0; i < 12; i++){                                   // far skyline of monolith spires
    const a = i * TAU / 12 + rand(-0.15, 0.15), r = rand(58, 86);
    const hgt = rand(16, 40), wid = rand(3, 7);
    const geoS = rng() < 0.5 ? new THREE.ConeGeometry(wid, hgt, 6) : new THREE.BoxGeometry(wid, hgt, wid);
    const s = new THREE.Mesh(geoS, M.spire);
    s.position.set(Math.cos(a) * r, hgt / 2 - 0.8, Math.sin(a) * r); g.add(s);
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.35, 6, 6), M.beacon);
    b.position.set(s.position.x, hgt - 0.4, s.position.z); g.add(b);
  }
  return g;
}

/* ============================ 8. ASSEMBLY & LAYOUT ============================ */
scene.add(buildEnvironment());
const gate = buildWarpGate(); setShadow(gate); scene.add(gate);

const pylonTips = [], innerTips = [];
for (let i = 0; i < CFG.pylonsOuter.n; i++){
  const a = (i + 0.5) * TAU / CFG.pylonsOuter.n;
  const p = buildPylon(CFG.pylonsOuter.h);
  p.position.set(Math.cos(a) * CFG.pylonsOuter.r, 0, Math.sin(a) * CFG.pylonsOuter.r);
  setShadow(p); scene.add(p);
  pylonTips.push(new THREE.Vector3(p.position.x, CFG.pylonsOuter.h, p.position.z));
}
for (let i = 0; i < CFG.pylonsInner.n; i++){
  const a = (i + 0.25) * TAU / CFG.pylonsInner.n;
  const p = buildPylon(CFG.pylonsInner.h);
  p.position.set(Math.cos(a) * CFG.pylonsInner.r, 0, Math.sin(a) * CFG.pylonsInner.r);
  setShadow(p); scene.add(p);
  innerTips.push(new THREE.Vector3(p.position.x, CFG.pylonsInner.h, p.position.z));
}
for (const s of [1, -1]){                        // ramps north and south of the gate
  const ramp = buildRamp(7, CFG.daisTop);
  ramp.position.set(0, 0, s * 19); ramp.rotation.y = s > 0 ? Math.PI : 0;
  setShadow(ramp); scene.add(ramp);
}
const pods = [];
[[5.2, 16.5, -0.5], [-5.4, 17.5, 0.6], [5.6, -16.8, Math.PI + 0.4], [-5.2, -17.6, Math.PI - 0.5]]
.forEach(([x, z, ry], i) => {
  const pod = buildPod(); pod.position.set(x, 1.25, z); pod.rotation.y = ry;
  pod.userData = { baseY: 1.25, phase: i * 1.7, engine: pod.children.find(c => c.material === M.engine) };
  setShadow(pod); scene.add(pod); pods.push(pod);
});
const boards = [];
[0, 2.4, 3.9].forEach(a => {
  const b = buildHoloBoard();
  b.position.set(Math.cos(a) * 13.5, 0, Math.sin(a) * 13.5);
  b.rotation.y = -a + Math.PI / 2;               // face outward to the approaching crowd
  setShadow(b); scene.add(b); boards.push(b);
});
const banners = [];
for (let i = 0; i < 8; i++){
  const a = i * TAU / 8 + 0.62;                  // interleaved so no banner blocks the opening view
  const bn = buildBannerColumn();
  bn.position.set(Math.cos(a) * 22, 0, Math.sin(a) * 22);
  bn.rotation.y = -a + Math.PI; bn.userData.baseRot = bn.rotation.y;
  setShadow(bn); scene.add(bn); banners.push(bn);
}
[[8.5, 13.5], [-8, 14.5], [7.5, -13.8], [-9, -13], [14.5, 4], [-15, -3]].forEach(([x, z]) => {
  const pile = buildLuggagePile(); pile.position.set(x, 0, z);
  pile.rotation.y = rand(0, TAU); setShadow(pile); scene.add(pile);
});
[0.8, 2.3, 4.0, 5.5].forEach(a => {
  const bench = buildBench();
  bench.position.set(Math.cos(a) * 19.5, 0, Math.sin(a) * 19.5);
  bench.rotation.y = -a - Math.PI / 2; setShadow(bench); scene.add(bench);
});
const kiosk = buildKiosk(); kiosk.position.set(17, 0, -7.5); kiosk.rotation.y = 2.8;
setShadow(kiosk); scene.add(kiosk);
[[3.2, 13.2, 0.6], [-4.4, -14.2, 2.4]].forEach(([x, z, ry]) => {
  const tr = buildTrolley(); tr.position.set(x, 0, z); tr.rotation.y = ry;
  setShadow(tr); scene.add(tr);
});

// --- bollard lights ringing the inner promenade ---
const bollardBody = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.14, 0.18, 0.72, 8), M.dark, 12);
const bollardCap  = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.15, 0.15, 0.1, 8), M.rune, 12);
for (let i = 0; i < 12; i++){
  const a = i * TAU / 12 + 0.06;
  dummy.rotation.set(0, 0, 0);
  dummy.position.set(Math.cos(a) * 23.6, 0.36, Math.sin(a) * 23.6);
  dummy.updateMatrix(); bollardBody.setMatrixAt(i, dummy.matrix);
  dummy.position.y = 0.77; dummy.updateMatrix(); bollardCap.setMatrixAt(i, dummy.matrix);
}
bollardBody.castShadow = true;
scene.add(bollardBody, bollardCap);

// --- energy motes spiralling into the membrane ---
const MOTES = 42, moteData = [];
const motes = new THREE.InstancedMesh(new THREE.SphereGeometry(0.13, 8, 8),
  new THREE.MeshBasicMaterial({ color: 0xa7f4ff, transparent: true, opacity: 0.9,
    blending: THREE.AdditiveBlending, depthWrite: false }), MOTES);
motes.frustumCulled = false;
for (let i = 0; i < MOTES; i++)
  moteData.push({ a0: rand(0, TAU), speed: rand(0.05, 0.12), phase: rng(), side: rng() < 0.5 ? -1 : 1 });
scene.add(motes);

// --- electric arcs: jagged polylines regenerated on a fixed cadence ---
const bolts = [];
function addBolt(a, b, segs){
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array((segs + 1) * 3), 3));
  const line = new THREE.Line(geo, M.bolt);
  line.frustumCulled = false; scene.add(line);
  bolts.push({ a, b, segs, attr: geo.getAttribute('position') });
}
for (let i = 0; i < pylonTips.length; i++) addBolt(pylonTips[i], pylonTips[(i + 1) % pylonTips.length], 9);
innerTips.forEach(tip => {
  let best = pylonTips[0], bd = Infinity;
  pylonTips.forEach(p => { const d = p.distanceTo(tip); if (d < bd){ bd = d; best = p; } });
  addBolt(tip, best, 7);
});
const up = new THREE.Vector3(0, 1, 0), tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
function regenBolts(){
  for (const bt of bolts){
    tmpA.subVectors(bt.b, bt.a);
    tmpB.crossVectors(tmpA, up).normalize();
    for (let i = 0; i <= bt.segs; i++){
      const f = i / bt.segs, env = Math.sin(f * Math.PI);
      const px = bt.a.x + tmpA.x * f + tmpB.x * rand(-0.7, 0.7) * env;
      const py = bt.a.y + tmpA.y * f + rand(-0.5, 0.7) * env + env * 0.9;
      const pz = bt.a.z + tmpA.z * f + tmpB.z * rand(-0.7, 0.7) * env;
      bt.attr.setXYZ(i, px, py, pz);
    }
    bt.attr.needsUpdate = true;
  }
}
regenBolts();

/* ============================ 9. LIGHTING RIG ============================ */
scene.add(new THREE.HemisphereLight(0x8fa8ff, 0x1a1626, 0.6));
const key = new THREE.DirectionalLight(0xbfd4ff, 1.8);
key.position.set(34, 42, 22); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -32; key.shadow.camera.right = 32;
key.shadow.camera.top = 32; key.shadow.camera.bottom = -32;
key.shadow.camera.near = 5; key.shadow.camera.far = 110;
key.shadow.bias = -0.0004;
scene.add(key);
const gateLight = new THREE.PointLight(PAL.teal, 420, 70, 2);      // the portal's shifting cast
gateLight.position.set(0, CFG.gate.y, 0); scene.add(gateLight);
const underGlow = new THREE.PointLight(PAL.violet, 130, 30, 2);    // violet pool under the ring
underGlow.position.set(0, 3, 0); scene.add(underGlow);
const kioskLight = new THREE.PointLight(PAL.amber, 26, 11, 2);
kioskLight.position.set(16.4, 2.6, -6.9); scene.add(kioskLight);

/* ============================ 10. ANIMATION LOOP ============================ */
const clock = new THREE.Clock();
let boltTimer = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // portal: spiral membrane + shifting light wash across the plaza
  portalUniforms.uTime.value = t;
  gateLight.intensity = 380 + Math.sin(t * 0.8) * 130 + Math.sin(t * 2.7) * 40;
  gateLight.color.setHSL(0.5 + 0.1 * Math.sin(t * 0.21), 0.85, 0.62);
  M.rune.emissiveIntensity = 2.0 + Math.sin(t * 1.6) * 0.5;
  M.plaza.emissiveIntensity = 0.85 + Math.sin(t * 0.9) * 0.2;

  // electricity between the pylon crowns
  boltTimer += dt;
  if (boltTimer > 0.09){ boltTimer = 0; regenBolts(); }
  M.bolt.opacity = 0.65 + Math.sin(t * 21) * 0.25;
  M.orb.emissiveIntensity = 2.3 + Math.sin(t * 7) * 0.7;

  // hovering pods: gentle bob, engine pulse
  pods.forEach(p => {
    p.position.y = p.userData.baseY + Math.sin(t * 1.1 + p.userData.phase) * 0.12;
    p.rotation.z = Math.sin(t * 0.9 + p.userData.phase) * 0.03;
  });
  M.engine.emissiveIntensity = 2.2 + Math.sin(t * 3.4) * 0.7;

  // holo boards: slow row scroll + hologram flicker
  boardTex.offset.y = (t * 0.014) % 1;
  M.board.opacity = 0.86 + 0.08 * Math.sin(t * 17) + 0.05 * Math.sin(t * 7.7);

  // banner columns: soft sway and shimmer
  banners.forEach((bn, i) => { bn.rotation.y = bn.userData.baseRot + Math.sin(t * 0.4 + i) * 0.06; });
  M.banner.opacity = 0.8 + Math.sin(t * 1.3) * 0.15;

  // energy motes drawn along a shrinking spiral into the portal
  moteData.forEach((md, i) => {
    const f = (t * md.speed + md.phase) % 1;
    const r = 8.8 - f * 8.1, a = md.a0 + f * 4.2;   // stays inside the ring's disc
    dummy.position.set(Math.cos(a) * r, CFG.gate.y + Math.sin(a) * r, md.side * Math.sin(f * Math.PI) * 2.2);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.setScalar(0.5 + (1 - f) * 0.8);
    dummy.updateMatrix(); motes.setMatrixAt(i, dummy.matrix);
  });
  motes.instanceMatrix.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
});

/* ============================ 11. RESIZE ============================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
