<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alchemist's Laboratory</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09070b}
canvas{display:block}
#title{position:fixed;left:24px;top:20px;color:#d9c995;font:11px Georgia,serif;letter-spacing:4px;text-transform:uppercase;opacity:.72;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="title">The Ninth Crucible</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x09070b);
scene.fog = new THREE.FogExp2(0x110d17, 0.026);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);
camera.position.set(10.8,7.8,12.8);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .055;
controls.autoRotate = true;
controls.autoRotateSpeed = .34;
controls.target.set(0,3.05,0);

const rng = (() => {
  let s = 918273;
  return {
    next(){s=(s*1664525+1013904223)>>>0;return s/4294967296},
    range(a,b){return a+(b-a)*this.next()},
    pick(a){return a[Math.floor(this.next()*a.length)]}
  };
})();

const clock = new THREE.Clock();
const animated = [];
const candleFlames = [];
const potionLights = [];
const bubbles = [];
const runePulse = [];

const mats = {
  stone:new THREE.MeshStandardMaterial({color:0x292633,roughness:.96,metalness:.02}),
  stone2:new THREE.MeshStandardMaterial({color:0x403945,roughness:.93}),
  wood:new THREE.MeshStandardMaterial({color:0x24130e,roughness:.82}),
  woodEdge:new THREE.MeshStandardMaterial({color:0x55301b,roughness:.75}),
  brass:new THREE.MeshStandardMaterial({color:0x916b32,roughness:.3,metalness:.82}),
  brassDark:new THREE.MeshStandardMaterial({color:0x47351d,roughness:.42,metalness:.72}),
  iron:new THREE.MeshStandardMaterial({color:0x15171a,roughness:.56,metalness:.72}),
  glassGreen:new THREE.MeshPhysicalMaterial({color:0x5df58d,emissive:0x20a956,emissiveIntensity:1.4,transmission:.35,transparent:true,opacity:.62,roughness:.08,metalness:.05,side:THREE.DoubleSide}),
  glassViolet:new THREE.MeshPhysicalMaterial({color:0xc47bff,emissive:0x661db0,emissiveIntensity:1.7,transmission:.28,transparent:true,opacity:.6,roughness:.08,side:THREE.DoubleSide}),
  glassAmber:new THREE.MeshPhysicalMaterial({color:0xffbd58,emissive:0xbc5e13,emissiveIntensity:1.35,transmission:.3,transparent:true,opacity:.6,roughness:.1}),
  liquidGreen:new THREE.MeshStandardMaterial({color:0x36e879,emissive:0x20b94d,emissiveIntensity:2.5,roughness:.2}),
  liquidViolet:new THREE.MeshStandardMaterial({color:0xb94cff,emissive:0x6513bb,emissiveIntensity:2.5,roughness:.2}),
  liquidAmber:new THREE.MeshStandardMaterial({color:0xff9d27,emissive:0xb44b08,emissiveIntensity:2.2,roughness:.2}),
  paper:new THREE.MeshStandardMaterial({color:0xc5a974,roughness:.86}),
  paperDark:new THREE.MeshStandardMaterial({color:0x62492f,roughness:.9}),
  herb:new THREE.MeshStandardMaterial({color:0x425c31,roughness:.92}),
  herbDry:new THREE.MeshStandardMaterial({color:0x89733e,roughness:.9}),
  wax:new THREE.MeshStandardMaterial({color:0xddd0a4,roughness:.8}),
  waxRed:new THREE.MeshStandardMaterial({color:0x8e3029,roughness:.82}),
  rune:new THREE.MeshBasicMaterial({color:0x8c40ff,transparent:true,opacity:.78}),
  coal:new THREE.MeshStandardMaterial({color:0x0b0a0b,roughness:1}),
  glowGreen:new THREE.MeshBasicMaterial({color:0x48ff96}),
  glowPurple:new THREE.MeshBasicMaterial({color:0xa04dff}),
  glowGold:new THREE.MeshBasicMaterial({color:0xffb94d})
};

function mesh(g,m,p=[0,0,0],r=[0,0,0],s=[1,1,1]){
  const o=new THREE.Mesh(g,m);
  o.position.set(...p);o.rotation.set(...r);o.scale.set(...s);
  o.castShadow=true;o.receiveShadow=true;scene.add(o);return o;
}
function box(x,y,z,m,p,r=[0,0,0]){return mesh(new THREE.BoxGeometry(x,y,z),m,p,r)}
function cyl(rt,rb,h,m,p,r=[0,0,0],seg=16){return mesh(new THREE.CylinderGeometry(rt,rb,h,seg),m,p,r)}
function sph(x,y,z,m,p){return mesh(new THREE.SphereGeometry(1,20,12),m,p,[0,0,0],[x,y,z])}
function torus(R,r,m,p,rn=[0,0,0]){return mesh(new THREE.TorusGeometry(R,r,10,36),m,p,rn)}
function glowLight(color,intensity,distance,p){
  const l=new THREE.PointLight(color,intensity,distance,2);
  l.position.set(...p);l.castShadow=true;l.shadow.mapSize.set(512,512);scene.add(l);return l;
}
function labelTexture(text,color='#49321e'){
  const c=document.createElement('canvas');c.width=256;c.height=96;
  const x=c.getContext('2d');x.fillStyle='#d1bc87';x.fillRect(0,0,256,96);
  x.fillStyle=color;x.font='bold 25px Georgia';x.textAlign='center';x.textBaseline='middle';
  x.fillText(text,128,48);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function plank(w,h,d,p){
  return box(w,h,d,mats.woodEdge,p);
}
function jar(x,z,material,label){
  const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);
  const body=new THREE.Mesh(new THREE.SphereGeometry(.34,18,14),material);
  body.scale.y=1.12;body.position.y=.47;body.castShadow=true;g.add(body);
  const neck=cyl(.13,.17,.22,mats.glassAmber,[0,.88,0],[],12);g.add(neck);
  const cork=cyl(.14,.14,.1,mats.woodEdge,[0,1.04,0],[],10);g.add(cork);
  const tag=mesh(new THREE.PlaneGeometry(.34,.16),new THREE.MeshStandardMaterial({map:labelTexture(label),roughness:.9}),[0,.43,.31],[0,0,0]);
  g.add(tag);
  return g;
}
function candle(x,y,z,red=false){
  const waxMat=red?mats.waxRed:mats.wax;
  const c=cyl(.09,.1,.62,waxMat,[x,y+.31,z],[],12);
  c.scale.y=rng.range(.72,1.2);
  cyl(.12,.12,.035,mats.brass,[x,y+.02,z],[],16);
  const flame=sph(.075,.19,.075,mats.glowGold,[x,y+.74,z]);
  candleFlames.push({flame,base:y+.74,phase:rng.range(0,6)});
  glowLight(0xff922e,.65,3.5,[x,y+.75,z]);
}
function herbBundle(x,y,z,rot=0){
  const g=new THREE.Group();scene.add(g);g.position.set(x,y,z);g.rotation.z=rot;
  cyl(.035,.035,.72,mats.herbDry,[0,0,0],[0,0,0],8);
  for(let i=0;i<7;i++){
    const a=i*.87+rng.range(-.2,.2);
    const leaf=sph(.075,.18,.035,mats.herb,[Math.cos(a)*.16,.16+Math.sin(i)*.02,Math.sin(a)*.16]);
    leaf.rotation.z=a;g.add(leaf);
  }
  const tie=torus(.16,.025,mats.waxRed,[0,-.19,0],[Math.PI/2,0,0]);g.add(tie);
  return g;
}
function flask(x,y,z,type='green',scale=1){
  const glass=type==='violet'?mats.glassViolet:type==='amber'?mats.glassAmber:mats.glassGreen;
  const liquid=type==='violet'?mats.liquidViolet:type==='amber'?mats.liquidAmber:mats.liquidGreen;
  const g=new THREE.Group();scene.add(g);g.position.set(x,y,z);g.scale.setScalar(scale);
  const body=new THREE.Mesh(new THREE.SphereGeometry(.48,24,16),glass);
  body.scale.set(.86,1.0,.86);body.castShadow=true;g.add(body);
  const fill=sph(.39,.24,.39,liquid,[0,.18,0]);g.add(fill);
  cyl(.16,.2,.48,glass,[0,.66,0],[],16);
  cyl(.19,.19,.06,mats.brassDark,[0,.92,0],[],12);
  const glow=type==='violet'?0xb44cff:type==='amber'?0xff922b:0x31ff7b;
  const light=glowLight(glow,1.25,3.8,[x,y+.25,z]);potionLights.push({light,phase:rng.range(0,10)});
  for(let i=0;i<3;i++){
    const b=sph(.035,.035,.035,liquid,[rng.range(-.2,.2),.08+rng.range(0,.32),rng.range(-.2,.2)]);
    b.userData.speed=rng.range(.4,1);bubbles.push({b,baseY:b.position.y,phase:rng.range(0,6),group:g});
    g.add(b);
  }
  return g;
}
function retort(x,y,z,type='violet'){
  const g=new THREE.Group();scene.add(g);g.position.set(x,y,z);
  const glass=type==='green'?mats.glassGreen:mats.glassViolet;
  const liquid=type==='green'?mats.liquidGreen:mats.liquidViolet;
  const bowl=new THREE.Mesh(new THREE.SphereGeometry(.58,24,14),glass);
  bowl.scale.set(1.15,.72,1.15);bowl.castShadow=true;g.add(bowl);
  const fluid=sph(.48,.18,.48,liquid,[0,.05,0]);g.add(fluid);
  cyl(.14,.18,.8,glass,[0,.64,0],[],16);
  const neck=cyl(.18,.18,.07,mats.brass,[0,1.06,0],[],12);g.add(neck);
  const tube=new THREE.Mesh(new THREE.TorusGeometry(.45,.045,8,20,Math.PI*1.25),glass);
  tube.rotation.set(Math.PI/2,0,.25);tube.position.set(.36,.52,0);tube.castShadow=true;g.add(tube);
  const glow=type==='green'?0x48ff9c:0xaf4cff;
  potionLights.push({light:glowLight(glow,1.5,4,[x,y+.15,z]),phase:rng.range(0,7)});
  return g;
}

const floor=box(22,.45,20,mats.stone,[0,-.24,0]);
for(let i=0;i<50;i++){
  const x=rng.range(-10,10),z=rng.range(-8.5,8.5);
  const slab=box(rng.range(1.1,2.5),.035,rng.range(.65,1.45),mats.stone2,[x,.01,z],[0,rng.range(-.18,.18),0]);
  slab.receiveShadow=true;
}
box(22,9,.4,mats.stone,[0,4.5,-9.4]);
box(.4,9,19,mats.stone,[-11,4.5,0]);
box(.4,9,19,mats.stone,[11,4.5,0]);
for(let y=1;y<9;y+=1.15) box(21,.045,.05,mats.stone2,[0,y,-9.16]);

const ceilingBeam=box(22,.5,.6,mats.woodEdge,[0,8.9,-8.8]);
for(let x=-9;x<10;x+=3) box(.34,8.7,.35,mats.wood,[x,4.4,-9.05],[0,rng.range(-.025,.025),0]);

const table=box(7,.42,2.7,mats.woodEdge,[-2.5,2.7,-.9]);
for(const x of [-5.35,.35]) for(const z of [-1.85,.05]) box(.38,2.7,.38,mats.wood,[x,1.35,z]);
box(6.5,.12,2.35,mats.wood,[-2.5,2.95,-.9]);

for(const x of [-8.7,-4.9,-1.1,2.7,6.5]){plank(3.5,.24,.7,[x,3.85,-8.63]);plank(3.5,.24,.7,[x,5.55,-8.63]);plank(3.5,.24,.7,[x,7.25,-8.63]);}
for(let i=0;i<42;i++){
  const x=rng.range(-10,9.7), level=rng.pick([3.85,5.55,7.25]);
  const z=-8.2;
  const kind=rng.next();
  if(kind<.68) jar(x,z, rng.pick([mats.glassAmber,mats.glassGreen,mats.glassViolet]),rng.pick(['MERCURY','MOSS','ASH','DREAM','SALT','ROOT','NIGHT']));
  else if(kind<.88) flask(x,level-.48,z+.02,rng.pick(['green','violet','amber']),rng.range(.38,.62));
  else herbBundle(x,level-.15,z+.02,rng.range(-.4,.4));
}
for(let x=-9;x<=9;x+=2.25){herbBundle(x,7.95,-8.45,rng.range(-.25,.25));}

const cauldronGroup=new THREE.Group();scene.add(cauldronGroup);cauldronGroup.position.set(4,0,1.4);
const cauldron=cyl(1.28,1.48,1.42,mats.iron,[0,2.15,0],[],32);
torus(1.35,.12,mats.brass,[0,2.83,0]);
torus(1.48,.1,mats.brassDark,[0,1.5,0]);
const brew=cyl(1.18,1.18,.12,mats.liquidGreen,[0,2.82,0],[],32);
for(const a of [0,Math.PI*2/3,Math.PI*4/3]){
 const leg=box(.25,1.25,.25,mats.iron,[Math.cos(a)*.98,1.05,Math.sin(a)*.98]);
 leg.rotation.z=Math.cos(a)*.18;leg.rotation.x=Math.sin(a)*.18;
}
for(let i=0;i<9;i++){
  const a=rng.range(0,Math.PI*2),c=sph(.18,.12,.18,mats.coal,[Math.cos(a)*rng.range(.15,.8),.32,Math.sin(a)*rng.range(.15,.8)]);
  c.scale.y=.55;
}
const fire=sph(.75,.22,.75,mats.glowGreen,[0,.4,0]);
const coalLight=glowLight(0x4cff77,2.4,5,[4,2.7,1.4]);
for(let i=0;i<7;i++){
 const b=sph(.05,.05,.05,mats.glowGreen,[rng.range(-.75,.75),2.92+rng.range(0,.12),rng.range(-.7,.7)]);
 b.userData.cauldron=true;bubbles.push({b,baseY:b.position.y,phase:rng.range(0,6),group:cauldronGroup});cauldronGroup.add(b);
}
const hook=box(.12,3.5,.12,mats.iron,[4,5.4,1.4]);
torus(.7,.06,mats.brass,[4,7.05,1.4],[Math.PI/2,0,0]);
box(3.8,.22,.22,mats.iron,[4,6.9,1.4],[0,0,.1]);

const lectern=new THREE.Group();scene.add(lectern);lectern.position.set(-7,0,2.2);
box(1.35,.18,1.1,mats.woodEdge,[0,3.3,0],[.15,0,0]);
box(.23,3,.23,mats.wood,[0,1.65,0]);
box(1.6,.2,.23,mats.woodEdge,[0,.2,0]);
const book=new THREE.Group();scene.add(book);book.position.set(-7,3.48,2.16);book.rotation.x=-.18;
box(1.6,.08,.95,mats.paperDark,[0,0,0],[0,.08,0]);
box(.76,.045,.85,mats.paper,[.4,.065,0],[0,.08,0]);
box(.76,.045,.85,mats.paper,[-.4,.066,0],[0,-.08,0]);
for(let i=0;i<5;i++) box(.07,.012,.5,mats.paperDark,[-.4+rng.range(-.18,.18),.1,-.08+i*.13],[0,0,0]);
for(let i=0;i<5;i++) box(.07,.012,.5,mats.paperDark,[.4+rng.range(-.18,.18),.1,-.08+i*.13],[0,0,0]);
candle(-7.55,3.55,2.42,true);

const rune=new THREE.Group();scene.add(rune);rune.position.set(-.8,.03,4.5);
const runeMat=mats.rune;
torus(2.2,.055,runeMat,[0,0,0],[Math.PI/2,0,0]);
torus(1.63,.035,runeMat,[0,.01,0],[Math.PI/2,0,0]);
for(let i=0;i<12;i++){
 const a=i*Math.PI/6;
 const line=box(.045,.025,1.35,runeMat,[Math.cos(a)*.68,.02,Math.sin(a)*.68],[0,-a,0]);
 rune.add(line);
}
for(let i=0;i<8;i++){
 const a=i*Math.PI/4;
 const gem=sph(.09,.025,.09,mats.glowPurple,[Math.cos(a)*1.9,.04,Math.sin(a)*1.9]);rune.add(gem);
}
runePulse.push(rune);glowLight(0x7e3cff,1.6,5,[-.8,.4,4.5]);

const workbench=box(4.8,.3,1.35,mats.woodEdge,[-5,4.3,1.1]);
for(const x of [-6.9,-3.1]) box(.3,2.7,.3,mats.wood,[x,2.95,1.1]);
flask(-6.1,4.6,1.05,'green',.8);
flask(-4.9,4.6,1.05,'violet',.75);
retort(-3.9,4.55,1.08,'violet');
candle(-5.7,4.52,1.55);
for(let i=0;i<7;i++){
 const rod=cyl(.035,.035,rng.range(.8,1.5),mats.brass,[rng.range(-7,-3),4.65,rng.range(.45,1.55)],[rng.range(-.2,.2),rng.range(-.4,.4),rng.range(-.2,.2)],8);
}

const mortar=mesh(new THREE.CylinderGeometry(.48,.58,.4,24,1,true),mats.brass,[1.2,3.2,-.5]);
torus(.5,.07,mats.brassDark,[1.2,3.4,-.5]);
cyl(.1,.13,.8,mats.woodEdge,[1.2,3.78,-.5],[0,0,.2],12);

const sideCab=box(2.5,3.4,1.4,mats.wood,[-8.8,1.7,-1.4]);
for(let y=.7;y<3;y+=.72) box(2.25,.06,.05,mats.woodEdge,[-8.8,y,-.68]);
for(let i=0;i<13;i++) jar(rng.range(-9.7,-7.9),-1.05,mats.glassAmber,rng.pick(['BONE','INK','TEETH','THORN']));
for(let i=0;i<5;i++) herbBundle(rng.range(-9.6,-8),3.2,-.68,rng.range(-.4,.4));

const hanging=new THREE.Group();scene.add(hanging);hanging.position.set(7.9,6.4,-1.2);
box(3.4,.18,.18,mats.woodEdge,[0,0,0]);
for(let i=0;i<6;i++){
 const x=-1.35+i*.54;
 const cord=cyl(.025,.025,1.1,mats.herbDry,[x,-.55,0],[],6);
 hanging.add(cord);
 const h=herbBundle(x,-1.25,0,rng.range(-.35,.35));h.scale.setScalar(rng.range(.75,1.2));hanging.add(h);
}

for(let i=0;i<8;i++){
 const x=rng.range(-9,9),z=rng.range(-6,5);
 if(Math.abs(x+0.8)<3 && Math.abs(z-4.5)<2.5) continue;
 const p=box(rng.range(.35,.9),rng.range(.18,.4),rng.range(.35,.9),mats.wood,[x,.22,z],[0,rng.range(0,6),0]);
 if(rng.next()<.65) cyl(.08,.12,.35,mats.brass,[x,.55,z],[],10);
}

for(let i=0;i<12;i++) candle(rng.range(-9,9),rng.range(.25,4.8),rng.range(-7,4),rng.next()<.18);

const moon=glowLight(0x6b6dff,.45,16,[-5,8,-7]);
const key= new THREE.SpotLight(0xffc27a,180,24,Math.PI/4,.65,1.4);
key.position.set(-4,8,4);key.target.position.set(0,2,0);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key,key.target);
const fill=new THREE.PointLight(0x7040c8,2.5,12,2);fill.position.set(2,5,-4);scene.add(fill);
const greenRim=new THREE.PointLight(0x36ff8c,2,10,2);greenRim.position.set(4,3,1);scene.add(greenRim);

const ambient=new THREE.HemisphereLight(0x4c3e68,0x0a080c,.42);scene.add(ambient);

const dustGeo=new THREE.BufferGeometry();
const dustPos=[];
for(let i=0;i<180;i++) dustPos.push(rng.range(-10,10),rng.range(.4,8.5),rng.range(-8,7));
dustGeo.setAttribute('position',new THREE.Float32BufferAttribute(dustPos,3));
const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xcba86f,size:.025,transparent:true,opacity:.42}));
scene.add(dust);

function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();
 for(const f of candleFlames){
   f.flame.scale.set(1+.15*Math.sin(t*8+f.phase),1+.32*Math.sin(t*9+f.phase),1+.15*Math.sin(t*7+f.phase));
   f.flame.position.y=f.base+.025*Math.sin(t*7+f.phase);
 }
 for(const p of potionLights) p.light.intensity=1.2+.45*Math.sin(t*3.4+p.phase)+.18*Math.sin(t*9+p.phase);
 for(const q of bubbles){
   q.b.position.y=q.baseY+((t*q.b.userData.speed+q.phase)%1)*.62;
   q.b.position.x+=Math.sin(t*1.6+q.phase)*.0007;
   if(q.b.position.y>3.08 && q.group===cauldronGroup) q.b.position.y=2.9;
 }
 rune.rotation.y=Math.sin(t*.18)*.04;
 rune.scale.setScalar(1+.018*Math.sin(t*2.2));
 dust.rotation.y=t*.006;
 controls.update();
 renderer.render(scene,camera);
}
window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
animate();
</script>
</body>
</html>
