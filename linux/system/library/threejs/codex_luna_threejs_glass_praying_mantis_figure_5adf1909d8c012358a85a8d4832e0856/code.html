<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Mantis Figurine</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071012}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x071012);
scene.fog = new THREE.Fog(0x071012, 7, 15);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.3, 3.5, 6.6);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 4;
controls.maxDistance = 10;
controls.target.set(0, 1.65, 0);

const jade = new THREE.MeshPhysicalMaterial({
  color:0x9bd9c5, roughness:0.08, metalness:0.02,
  transmission:0.82, thickness:0.55, ior:1.45,
  transparent:true, opacity:0.82, side:THREE.DoubleSide
});
const darkJade = new THREE.MeshPhysicalMaterial({
  color:0x4b9e91, roughness:0.12, transmission:0.68,
  thickness:0.35, ior:1.46, transparent:true, opacity:0.8
});
const clearGlass = new THREE.MeshPhysicalMaterial({
  color:0xdafcf0, roughness:0.04, transmission:0.96,
  thickness:0.18, ior:1.5, transparent:true, opacity:0.75,
  side:THREE.DoubleSide
});
const amber = new THREE.MeshPhysicalMaterial({
  color:0xffb35c, emissive:0x6f2c09, emissiveIntensity:0.7,
  roughness:0.08, transmission:0.55, thickness:0.08,
  transparent:true, opacity:0.78, side:THREE.DoubleSide
});
const bubbleMat = new THREE.MeshPhysicalMaterial({
  color:0xeaffff, roughness:0.01, transmission:0.98,
  thickness:0.04, ior:1.33, transparent:true, opacity:0.6
});
const glowMat = new THREE.MeshBasicMaterial({color:0x79ffe0, transparent:true, opacity:0.65});
const darkMat = new THREE.MeshStandardMaterial({color:0x102a2a, roughness:0.3, metalness:0.2});

function ellipsoid(x,y,z,sx,sy,sz,material, parent=scene){
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1,32,20), material);
  mesh.position.set(x,y,z);
  mesh.scale.set(sx,sy,sz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function cylinderBetween(a,b,r1,r2,material,parent=scene,radial=12){
  const va = new THREE.Vector3(...a), vb = new THREE.Vector3(...b);
  const delta = new THREE.Vector3().subVectors(vb,va);
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,delta.length(),radial,1),material);
  mesh.position.copy(va).add(vb).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),delta.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function tube(points,radius,material,parent=scene){
  const curve = new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve,24, radius,10,false),material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}
function addWing(side){
  const shape = new THREE.Shape();
  shape.moveTo(0,0);
  shape.bezierCurveTo(side*0.65,0.15,side*1.25,0.58,side*1.52,1.38);
  shape.bezierCurveTo(side*1.12,1.27,side*0.48,0.95,0.08,0.42);
  shape.closePath();
  const wing = new THREE.Mesh(new THREE.ShapeGeometry(shape,12), clearGlass);
  wing.position.set(side*0.18,2.43,0.02);
  wing.rotation.set(0,0,side*0.16);
  wing.scale.set(1,1,0.08);
  wing.castShadow = true;
  scene.add(wing);

  const points = [
    new THREE.Vector3(side*0.18,2.43,0.045),
    new THREE.Vector3(side*0.8,2.56,0.045),
    new THREE.Vector3(side*1.43,3.02,0.045)
  ];
  const edge = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(points),
    new THREE.LineBasicMaterial({color:0xffa64d,transparent:true,opacity:0.8})
  );
  scene.add(edge);
}
const mantis = new THREE.Group();
mantis.position.y = 0.22;
scene.add(mantis);

const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.18,0.28,64), clearGlass);
pedestal.position.y = 0.14;
pedestal.castShadow = true;
pedestal.receiveShadow = true;
scene.add(pedestal);

const pedestalTop = new THREE.Mesh(new THREE.CylinderGeometry(0.73,0.88,0.16,64), jade);
pedestalTop.position.y = 0.34;
pedestalTop.castShadow = true;
scene.add(pedestalTop);

ellipsoid(0,1.36,0,0.52,1.05,0.38,jade,mantis);
ellipsoid(0,2.16,0.02,0.45,0.55,0.36,darkJade,mantis);
ellipsoid(0,2.65,0.01,0.39,0.3,0.33,jade,mantis);
ellipsoid(0,2.83,0.02,0.27,0.22,0.25,clearGlass,mantis);

const abdomenBandMat = new THREE.MeshBasicMaterial({color:0xb4f9de,transparent:true,opacity:0.22});
for(let i=0;i<5;i++){
  const band = new THREE.Mesh(new THREE.TorusGeometry(0.43-i*0.045,0.012,8,32),abdomenBandMat);
  band.rotation.x = Math.PI/2;
  band.position.set(0,0.82+i*0.27,0);
  mantis.add(band);
}

const bubblePositions = [
  [-0.2,1.02,0.15,0.075], [0.18,1.28,-0.08,0.055],
  [-0.12,1.58,-0.16,0.045], [0.18,1.76,0.1,0.085],
  [-0.04,1.94,0.04,0.04], [-0.25,1.42,0.05,0.035]
];
for(const b of bubblePositions) ellipsoid(b[0],b[1],b[2],b[3],b[3],b[3],bubbleMat,mantis);

for(const side of [-1,1]){
  tube([
    [side*0.32,2.37,0],[side*0.58,2.08,0.08],
    [side*0.48,1.82,0.12],[side*0.22,1.68,0.1]
  ],0.075,clearGlass,mantis);
  tube([
    [side*0.38,2.27,0.06],[side*0.78,2.46,-0.02],
    [side*0.98,2.22,-0.04],[side*0.7,1.94,0.04]
  ],0.06,jade,mantis);

  cylinderBetween([side*0.48,1.82,0.12],[side*0.31,1.7,0.11],0.1,0.07,amber,mantis);
  for(let j=0;j<3;j++){
    const x = side*(0.3-j*0.055);
    const spike = new THREE.Mesh(new THREE.ConeGeometry(0.018,0.13,8),amber);
    spike.position.set(x,1.69-j*0.025,0.11);
    spike.rotation.z = side*(Math.PI*0.35);
    mantis.add(spike);
  }

  tube([[side*0.3,2.02,0],[side*0.75,1.67,0.02],[side*0.95,1.24,-0.05]],0.045,clearGlass,mantis);
  tube([[side*0.28,1.9,0.02],[side*0.05,1.43,-0.08],[side*0.2,0.72,-0.03]],0.04,darkJade,mantis);
  tube([[side*0.33,2.0,-0.05],[side*0.72,1.4,0.15],[side*0.82,0.7,0.05]],0.035,clearGlass,mantis);
}
for(const side of [-1,1]){
  tube([[side*0.35,2.28,-0.02],[side*0.78,1.92,-0.16],[side*0.88,1.5,-0.2]],0.035,darkJade,mantis);
}
for(const side of [-1,1]){
  const eye = ellipsoid(side*0.22,2.87,-0.23,0.09,0.11,0.055,amber,mantis);
  eye.rotation.x = -0.25;
  tube([[side*0.12,2.98,0],[side*0.35,3.25,0.03],[side*0.52,3.38,0.08]],0.012,clearGlass,mantis);
  tube([[side*0.04,2.99,0.02],[side*0.0,3.26,-0.06],[side*0.14,3.42,-0.1]],0.01,clearGlass,mantis);
}
for(const side of [-1,1]) addWing(side);

const neckGlow = new THREE.Mesh(new THREE.TorusGeometry(0.3,0.018,8,32),glowMat);
neckGlow.rotation.x = Math.PI/2;
neckGlow.position.set(0,2.43,0);
mantis.add(neckGlow);

const causticMat = new THREE.MeshBasicMaterial({color:0x55ffe0,transparent:true,opacity:0.34,side:THREE.DoubleSide});
for(let i=0;i<7;i++){
  const tri = new THREE.Mesh(new THREE.CircleGeometry(0.11+Math.random()*0.09,3),causticMat);
  tri.scale.set(0.3+Math.random()*0.9,0.08+Math.random()*0.12,1);
  tri.rotation.z = Math.random()*Math.PI;
  tri.position.set((Math.random()-0.5)*0.9,0.375,(Math.random()-0.5)*0.5);
  scene.add(tri);
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(5.5,64),
  new THREE.MeshStandardMaterial({color:0x081719,roughness:0.68,metalness:0.12})
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -0.02;
floor.receiveShadow = true;
scene.add(floor);

scene.add(new THREE.HemisphereLight(0xb9fff0,0x061012,1.7));
const key = new THREE.SpotLight(0xd5fff4,65,12,Math.PI/7,0.55,1.4);
key.position.set(3.5,6,4);
key.target = mantis;
key.castShadow = true;
key.shadow.mapSize.set(1024,1024);
scene.add(key);
const rim = new THREE.PointLight(0xffa14d,18,5);
rim.position.set(-3,2.7,-2);
scene.add(rim);
const fill = new THREE.PointLight(0x55eaff,12,5);
fill.position.set(2,1,-3);
scene.add(fill);

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
