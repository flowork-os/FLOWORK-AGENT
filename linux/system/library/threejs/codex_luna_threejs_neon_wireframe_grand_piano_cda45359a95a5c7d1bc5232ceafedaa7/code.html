<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Wireframe Piano</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03000b}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03000b);
scene.fog = new THREE.FogExp2(0x03000b, 0.035);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.8, -10.5, 7.1);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.target.set(0, 0.25, 0.65);
controls.minDistance = 6;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.48;

scene.add(new THREE.HemisphereLight(0x53147c, 0x050008, 0.55));

function light(color, intensity, distance, position) {
  const l = new THREE.PointLight(color, intensity, distance);
  l.position.copy(position);
  l.castShadow = true;
  scene.add(l);
}
light(0xff168f, 7, 15, [-2.5, -3.0, 4.2]);
light(0x08c9ff, 6, 14, [3.8, -2.3, 2.8]);
light(0x812fff, 5, 13, [1.0, 3.5, 4.5]);

const root = new THREE.Group();
root.rotation.z = -0.035;
scene.add(root);

const magenta = 0xff168f;
const cyan = 0x12eaff;
const violet = 0x9d4dff;
const white = 0xffd9fa;

function material(color, opacity=1) {
  return new THREE.LineBasicMaterial({
    color,
    transparent: opacity < 1,
    opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
}

function line(points, color, closed=false, group=root) {
  const pts = points.map(p => p.clone ? p.clone() : new THREE.Vector3(p[0],p[1],p[2]));
  if (closed) pts.push(pts[0].clone());
  const geometry = new THREE.BufferGeometry().setFromPoints(pts);
  const glow = new THREE.Line(geometry, material(color, 0.12));
  const mid = new THREE.Line(geometry, material(color, 0.3));
  const core = new THREE.Line(geometry, material(color, 0.98));
  glow.scale.setScalar(1.035);
  mid.scale.setScalar(1.014);
  group.add(glow, mid, core);
  return core;
}

function segments(points, color, group=root) {
  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  const glow = new THREE.LineSegments(geometry, material(color, 0.11));
  const mid = new THREE.LineSegments(geometry, material(color, 0.28));
  const core = new THREE.LineSegments(geometry, material(color, 0.95));
  glow.scale.setScalar(1.035);
  mid.scale.setScalar(1.014);
  group.add(glow, mid, core);
  return core;
}

function curvePoints(points, samples=80, closed=false) {
  const curve = new THREE.CatmullRomCurve3(points, closed, "catmullrom", 0.45);
  return curve.getPoints(samples);
}

const outline2D = [
  [-3.75,-1.38],[-2.15,-1.38],[-1.42,-1.25],[-0.45,-0.98],
  [0.72,-0.54],[1.78,0.03],[2.58,0.75],[3.02,1.43],
  [3.00,1.93],[2.63,2.23],[1.73,2.40],[0.50,2.35],
  [-0.72,2.04],[-1.68,1.57],[-2.35,0.93],[-2.65,0.18],
  [-2.72,-0.43],[-3.75,-0.43]
];

function outlineAt(z, inset=0) {
  return outline2D.map(([x,y]) => new THREE.Vector3(x, y + inset, z));
}

const topOutline = curvePoints(outlineAt(1.42), 150, true);
const lowerOutline = curvePoints(outlineAt(0.72), 150, true);
line(topOutline, magenta);
line(lowerOutline, magenta);

for (let i=0;i<topOutline.length-1;i+=8) {
  line([topOutline[i], lowerOutline[Math.min(i,lowerOutline.length-1)]], magenta);
}

const innerTop = curvePoints(outlineAt(1.53, 0.06), 150, true);
line(innerTop, magenta);

for (let x=-2.35;x<=2.6;x+=0.42) {
  const a = new THREE.Vector3(x, -0.38, 1.46);
  const b = new THREE.Vector3(x + 0.15, 1.86, 1.46);
  line([a,b], magenta);
}

const plate = new THREE.Group();
root.add(plate);
line([
  new THREE.Vector3(-2.28,-0.26,1.49),
  new THREE.Vector3(2.48,0.76,1.49),
  new THREE.Vector3(2.55,1.72,1.49),
  new THREE.Vector3(-1.25,1.90,1.49),
  new THREE.Vector3(-2.28,-0.26,1.49)
], violet, false, plate);

for (let i=0;i<14;i++) {
  const x = -2.05 + i * 0.33;
  const y0 = -0.12 + i * 0.035;
  const y1 = 1.77 - i * 0.018;
  line([
    new THREE.Vector3(x,y0,1.5),
    new THREE.Vector3(x+0.03,y1,1.5)
  ], violet, false, plate);
}
for (let i=0;i<8;i++) {
  const y = 0.02 + i * 0.235;
  line([
    new THREE.Vector3(-2.18,y,1.505),
    new THREE.Vector3(2.48,y+0.78,1.505)
  ], violet, false, plate);
}

const keyboard = new THREE.Group();
root.add(keyboard);
line([
  new THREE.Vector3(-3.78,-1.53,1.34),
  new THREE.Vector3(-1.35,-1.53,1.34)
], cyan, false, keyboard);
line([
  new THREE.Vector3(-3.78,-1.53,0.91),
  new THREE.Vector3(-1.35,-1.53,0.91)
], cyan, false, keyboard);
line([
  new THREE.Vector3(-3.78,-1.53,1.34),
  new THREE.Vector3(-3.78,-1.53,0.91)
], cyan, false, keyboard);
line([
  new THREE.Vector3(-1.35,-1.53,1.34),
  new THREE.Vector3(-1.35,-1.53,0.91)
], cyan, false, keyboard);

const keyCount = 18;
for (let i=0;i<=keyCount;i++) {
  const x = -3.78 + i * (2.43 / keyCount);
  line([
    new THREE.Vector3(x,-1.535,0.94),
    new THREE.Vector3(x,-1.535,1.31)
  ], cyan, false, keyboard);
}
for (let i=0;i<keyCount;i+=2) {
  const x0 = -3.78 + i * (2.43 / keyCount);
  const x1 = x0 + 0.075;
  line([
    new THREE.Vector3(x0,-1.57,1.18),
    new THREE.Vector3(x1,-1.57,1.18)
  ], white, false, keyboard);
}

const lid = new THREE.Group();
root.add(lid);
const hingeA = new THREE.Vector3(-1.35,1.62,1.5);
const hingeB = new THREE.Vector3(2.58,1.88,1.5);
const lidA = new THREE.Vector3(-1.48,1.76,2.72);
const lidB = new THREE.Vector3(2.28,2.05,2.58);
line([hingeA,hingeB], magenta, false, lid);
line([hingeA,lidA,lidB,hingeB], magenta, false, lid);
line([
  new THREE.Vector3(-1.27,1.84,2.55),
  new THREE.Vector3(2.10,2.10,2.40)
], magenta, false, lid);
for (let i=0;i<9;i++) {
  const t=i/8;
  const p1=hingeA.clone().lerp(hingeB,t);
  const p2=lidA.clone().lerp(lidB,t);
  line([p1,p2], magenta, false, lid);
}
line([new THREE.Vector3(-1.48,1.76,2.72),new THREE.Vector3(-1.27,1.84,2.55)], magenta, false, lid);
line([new THREE.Vector3(2.28,2.05,2.58),new THREE.Vector3(2.10,2.10,2.40)], magenta, false, lid);

function taperedLeg(top, bottom, topW, bottomW, color) {
  const t = new THREE.Vector3(top[0],top[1],top[2]);
  const b = new THREE.Vector3(bottom[0],bottom[1],bottom[2]);
  const dx = new THREE.Vector3(topW,0,0);
  const dy = new THREE.Vector3(0,topW,0);
  const ex = new THREE.Vector3(bottomW,0,0);
  const ey = new THREE.Vector3(0,bottomW,0);
  const pts = [
    t.clone().sub(dx).sub(dy), t.clone().add(dx).sub(dy),
    t.clone().add(dx).add(dy), t.clone().sub(dx).add(dy),
    b.clone().sub(ex).sub(ey), b.clone().add(ex).sub(ey),
    b.clone().add(ex).add(ey), b.clone().sub(ex).add(ey)
  ];
  const edges=[];
  [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]]
    .forEach(([a,c])=>edges.push(pts[a],pts[c]));
  segments(edges,color);
}

taperedLeg([-2.45,-0.42,0.76],[-2.62,-0.50,-1.45],0.16,0.24,magenta);
taperedLeg([0.15,0.52,0.76],[0.05,0.50,-1.45],0.15,0.23,magenta);
taperedLeg([2.12,1.20,0.76],[2.24,1.28,-1.45],0.15,0.22,magenta);

line([
  new THREE.Vector3(-2.95,-0.84,-1.45),
  new THREE.Vector3(-2.25,-0.84,-1.45),
  new THREE.Vector3(-1.72,-0.84,-1.45)
], violet);
line([
  new THREE.Vector3(-2.35,-0.84,-1.45),
  new THREE.Vector3(-2.35,-1.12,-1.45)
], violet);
line([
  new THREE.Vector3(-1.95,-0.84,-1.45),
  new THREE.Vector3(-1.95,-1.12,-1.45)
], violet);

for (let i=0;i<3;i++) {
  const x=-2.35+i*0.38;
  line([
    new THREE.Vector3(x,-1.12,-1.45),
    new THREE.Vector3(x+0.11,-1.33,-1.45)
  ], cyan);
}

const accent = new THREE.Group();
root.add(accent);
line([
  new THREE.Vector3(-3.76,-1.39,0.72),
  new THREE.Vector3(-3.76,-1.39,1.42)
], magenta, false, accent);
line([
  new THREE.Vector3(-3.76,-0.43,0.72),
  new THREE.Vector3(-3.76,-0.43,1.42)
], magenta, false, accent);

for (let i=0;i<5;i++) {
  const y=-0.28+i*0.42;
  line([
    new THREE.Vector3(-2.55,y,0.75),
    new THREE.Vector3(-2.55,y,1.38)
  ], violet);
}

const starCount=90;
const starPositions=[];
for(let i=0;i<starCount;i++){
  const r=16+Math.random()*10;
  const a=Math.random()*Math.PI*2;
  const z=-1+Math.random()*14;
  starPositions.push(Math.cos(a)*r,Math.sin(a)*r,z);
}
const starGeometry=new THREE.BufferGeometry();
starGeometry.setAttribute("position",new THREE.Float32BufferAttribute(starPositions,3));
const stars=new THREE.Points(starGeometry,new THREE.PointsMaterial({
  color:0x7419a8,size:0.035,transparent:true,opacity:0.55,
  blending:THREE.AdditiveBlending,depthWrite:false
}));
scene.add(stars);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
