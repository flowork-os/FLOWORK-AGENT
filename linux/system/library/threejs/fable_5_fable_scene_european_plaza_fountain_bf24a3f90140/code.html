<script type="module">
// =================================================================
//  EUROPEAN PLAZA FOUNTAIN — sunlit Mediterranean square
//  tiered stone fountain · arcaded facades · clock tower · café
//  umbrellas · flower cart · orange trees · patterned cobblestones
// =================================================================
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ------------------------------------------------ config / palette
const SEED = 20260815;
const PAL = {
  sky: 0x86c3ee, horizon: 0xf3e2c1, fog: 0xefdebf,
  sun: 0xffe7c2, skyFill: 0xbcd8f2, bounce: 0xcfa578,
  stone: 0xd9cfba, stoneDark: 0xb2a68c, waterDeep: 0x2f89b5,
  cobbleA: '#b5a289', cobbleB: '#93826c', grout: '#6f6154',
  terra: 0xc25f3d, wood: 0x8a5a34, woodDark: 0x64432a,
  leaf: 0x4e7a34, orange: 0xef8b1f, iron: 0x33302b, cream: 0xf0e8d4,
  stucco:  [0xc97a52, 0xd9a441, 0xe6d9bd, 0xc98d74, 0xe0c274, 0xe9e0cc],
  shutter: [0x3f6b52, 0x2f5a6b, 0x6b4a2f, 0x4a5f3f, 0x35586b, 0x5a6b3f],
  stripes: [['#d94f3f','#f3ead8'], ['#3f7a8c','#f3ead8'], ['#e0a33f','#f3ead8']],
  flags: [0xd94f3f, 0xe0a33f, 0xf3ead8, 0x3f7a8c, 0xef8b1f]
};

// ------------------------------------------------ seeded prng / helpers
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(SEED);
const rand  = (a, b) => a + (b - a) * rng();
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick  = arr => arr[Math.floor(rng() * arr.length)];
const D2R   = THREE.MathUtils.degToRad;
const polar = (deg, r, y = 0) => new THREE.Vector3(Math.cos(D2R(deg)) * r, y, Math.sin(D2R(deg)) * r);
const faceCenterY = deg => -D2R(deg) - Math.PI / 2; // building front (+z) looks at origin

// ------------------------------------------------ renderer / scene / camera
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(PAL.fog, 55, 205);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 500);
camera.position.set(29, 25, 29);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.6, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.autoRotate = true; controls.autoRotateSpeed = 1.1;
controls.minDistance = 16; controls.maxDistance = 62;
controls.maxPolarAngle = 1.42;
controls.update();

// ------------------------------------------------ canvas texture helpers
function canvasTex(size, draw, repX = 1, repY = 1){
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repX, repY);
  t.anisotropy = 4; return t;
}
const skyTex = canvasTex(512, (g, s) => {
  const grad = g.createLinearGradient(0, 0, 0, s);
  grad.addColorStop(0, '#5fa8dd'); grad.addColorStop(0.45, '#a9d2ef');
  grad.addColorStop(0.78, '#e8ddc2'); grad.addColorStop(1, '#f6e4c4');
  g.fillStyle = grad; g.fillRect(0, 0, s, s);
});
const cobbleTex = canvasTex(512, (g, s) => {
  g.fillStyle = PAL.grout; g.fillRect(0, 0, s, s);
  const rows = 8, cols = 8, ch = s / rows;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
    const off = (r % 2) * ch * 0.5, x = c * ch + off, y = r * ch;
    const tone = rand(0, 1), base = tone < 0.5 ? PAL.cobbleA : PAL.cobbleB;
    g.fillStyle = base; g.beginPath();
    g.roundRect(x + 3, y + 3, ch - 6, ch - 6, 12); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.10)';
    g.beginPath(); g.roundRect(x + 6, y + 5, ch - 14, ch * 0.35, 8); g.fill();
  }
  g.fillStyle = 'rgba(60,50,40,0.15)';
  for (let i = 0; i < 260; i++) g.fillRect(rand(0, s), rand(0, s), 2, 2);
}, 13, 13);
const rosetteTex = canvasTex(512, (g, s) => {
  const cx = s / 2;
  g.fillStyle = '#a8977e'; g.fillRect(0, 0, s, s);
  for (let i = 6; i >= 0; i--){
    g.fillStyle = i % 2 ? '#c2b096' : '#8a5a3c';
    g.beginPath(); g.arc(cx, cx, (i + 1) * s / 15, 0, Math.PI * 2); g.fill();
  }
  g.strokeStyle = '#6f6154'; g.lineWidth = 5;
  for (let i = 0; i < 24; i++){
    const a = i / 24 * Math.PI * 2;
    g.beginPath(); g.moveTo(cx + Math.cos(a) * s * 0.09, cx + Math.sin(a) * s * 0.09);
    g.lineTo(cx + Math.cos(a) * s * 0.47, cx + Math.sin(a) * s * 0.47); g.stroke();
  }
});
function stuccoCanvas(hex){
  return canvasTex(256, (g, s) => {
    g.fillStyle = '#' + hex.toString(16).padStart(6, '0'); g.fillRect(0, 0, s, s);
    for (let i = 0; i < 420; i++){
      g.fillStyle = `rgba(${rand(0,1) < 0.5 ? '255,255,255' : '70,50,30'},${rand(0.03, 0.1)})`;
      const w = rand(4, 26); g.fillRect(rand(0, s), rand(0, s), w, w * rand(0.3, 1));
    }
    g.fillStyle = 'rgba(90,60,40,0.14)'; g.fillRect(0, s * 0.9, s, s * 0.1);
  });
}
const roofTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#a34f33'; g.fillRect(0, 0, s, s);
  const rows = 4, tw = s / 6;
  for (let r = 0; r < rows; r++) for (let c = 0; c < 7; c++){
    const x = c * tw + (r % 2) * tw / 2, y = r * s / rows;
    g.fillStyle = `rgb(${randi(180, 210)},${randi(95, 115)},${randi(62, 80)})`;
    g.beginPath(); g.arc(x, y + s / rows, tw / 2 - 2, Math.PI, 0); g.fill();
    g.strokeStyle = 'rgba(60,30,20,0.5)'; g.stroke();
  }
});
function stripeTex(pair){
  return canvasTex(256, (g, s) => {
    for (let i = 0; i < 8; i++){ g.fillStyle = pair[i % 2]; g.fillRect(i * s / 8, 0, s / 8, s); }
  });
}
const clockTex = canvasTex(256, (g, s) => {
  const c = s / 2;
  g.fillStyle = '#f5eedc'; g.beginPath(); g.arc(c, c, c - 6, 0, Math.PI * 2); g.fill();
  g.lineWidth = 10; g.strokeStyle = '#4a3b2a';
  g.beginPath(); g.arc(c, c, c - 12, 0, Math.PI * 2); g.stroke();
  for (let i = 0; i < 12; i++){
    const a = i / 12 * Math.PI * 2; g.lineWidth = i % 3 ? 5 : 9;
    g.beginPath(); g.moveTo(c + Math.cos(a) * (c - 26), c + Math.sin(a) * (c - 26));
    g.lineTo(c + Math.cos(a) * (c - 48), c + Math.sin(a) * (c - 48)); g.stroke();
  }
});
const waterTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#1e6f9e'; g.fillRect(0, 0, s, s);
  g.strokeStyle = 'rgba(220,245,255,0.55)'; g.lineWidth = 3;
  for (let i = 0; i < 60; i++){
    g.beginPath(); const x = rand(0, s), y = rand(0, s);
    g.arc(x, y, rand(6, 26), rand(0, 3), rand(3.5, 6)); g.stroke();
  }
});
const woodTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#8a5a34'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 6; i++){
    g.fillStyle = i % 2 ? '#7c4e2c' : '#96653c'; g.fillRect(0, i * s / 6, s, s / 6 - 3);
  }
  g.strokeStyle = 'rgba(60,35,18,0.5)'; g.lineWidth = 2;
  for (let i = 0; i < 40; i++){
    g.beginPath(); g.moveTo(0, rand(0, s));
    g.bezierCurveTo(s * 0.3, rand(0, s), s * 0.7, rand(0, s), s, rand(0, s)); g.stroke();
  }
});
const windowTex = canvasTex(128, (g, s) => {
  g.fillStyle = '#efe6cf'; g.fillRect(0, 0, s, s);
  g.fillStyle = '#26333f'; g.fillRect(10, 10, s - 20, s - 20);
  g.strokeStyle = '#efe6cf'; g.lineWidth = 6;
  g.beginPath(); g.moveTo(s / 2, 10); g.lineTo(s / 2, s - 10);
  g.moveTo(10, s / 2); g.lineTo(s - 10, s / 2); g.stroke();
  g.fillStyle = 'rgba(200,225,245,0.35)';
  g.beginPath(); g.moveTo(14, s - 14); g.lineTo(s - 40, 14); g.lineTo(s - 16, 14); g.lineTo(38, s - 14); g.fill();
});
function shutterTex(hex){
  return canvasTex(128, (g, s) => {
    g.fillStyle = '#' + hex.toString(16).padStart(6, '0'); g.fillRect(0, 0, s, s);
    g.fillStyle = 'rgba(0,0,0,0.28)';
    for (let y = 10; y < s - 8; y += 12) g.fillRect(8, y, s - 16, 4);
    g.strokeStyle = 'rgba(0,0,0,0.4)'; g.lineWidth = 6; g.strokeRect(3, 3, s - 6, s - 6);
  });
}
const railTex = canvasTex(128, (g, s) => {
  g.clearRect(0, 0, s, s); g.strokeStyle = '#26221d'; g.lineWidth = 7;
  g.beginPath(); g.moveTo(0, 6); g.lineTo(s, 6); g.moveTo(0, s - 6); g.lineTo(s, s - 6); g.stroke();
  g.lineWidth = 5;
  for (let x = 10; x < s; x += 22){
    g.beginPath(); g.moveTo(x, 6); g.lineTo(x, s - 6); g.stroke();
    g.beginPath(); g.arc(x + 11, s * 0.45, 8, 0, Math.PI * 2); g.stroke();
  }
});

// ------------------------------------------------ shared materials
const M = {
  stone:  new THREE.MeshStandardMaterial({ color: PAL.stone, roughness: 0.85 }),
  stoneFlat: new THREE.MeshStandardMaterial({ color: PAL.stoneDark, roughness: 0.9, flatShading: true }),
  water:  new THREE.MeshStandardMaterial({ map: waterTex, transparent: true, opacity: 0.94, roughness: 0.22, metalness: 0.05 }),
  stream: new THREE.MeshStandardMaterial({ color: 0xcfe9ff, transparent: true, opacity: 0.5, roughness: 0.1, depthWrite: false }),
  foam:   new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, depthWrite: false }),
  wood:   new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.8 }),
  woodDark: new THREE.MeshStandardMaterial({ color: PAL.woodDark, roughness: 0.85 }),
  terra:  new THREE.MeshStandardMaterial({ color: PAL.terra, roughness: 0.9 }),
  roof:   new THREE.MeshStandardMaterial({ map: roofTex, roughness: 0.9 }),
  leaf:   new THREE.MeshStandardMaterial({ color: PAL.leaf, roughness: 1 }),
  orange: new THREE.MeshStandardMaterial({ color: PAL.orange, roughness: 0.55 }),
  iron:   new THREE.MeshStandardMaterial({ color: PAL.iron, roughness: 0.6, metalness: 0.55 }),
  cream:  new THREE.MeshStandardMaterial({ color: PAL.cream, roughness: 0.9 }),
  glass:  new THREE.MeshStandardMaterial({ color: 0xfff2c8, emissive: 0xffdf9a, emissiveIntensity: 0.55, roughness: 0.4 }),
  rail:   new THREE.MeshBasicMaterial({ map: railTex, transparent: true, alphaTest: 0.35, side: THREE.DoubleSide }),
  window: new THREE.MeshStandardMaterial({ map: windowTex, roughness: 0.6 })
};
M.roof.map.repeat.set(0.55, 0.55);
const box = (w, h, d, mat) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.castShadow = m.receiveShadow = true; return m; };
const cyl = (rt, rb, h, seg, mat) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); m.castShadow = m.receiveShadow = true; return m; };

// ------------------------------------------------ builder: ground & sky
function buildGround(){
  const g = new THREE.Group();
  const plaza = new THREE.Mesh(new THREE.CircleGeometry(30, 64),
    new THREE.MeshStandardMaterial({ map: cobbleTex, roughness: 0.95 }));
  plaza.rotation.x = -Math.PI / 2; plaza.receiveShadow = true; g.add(plaza);
  const rosette = new THREE.Mesh(new THREE.CircleGeometry(6.6, 48),
    new THREE.MeshStandardMaterial({ map: rosetteTex, roughness: 0.95 }));
  rosette.rotation.x = -Math.PI / 2; rosette.position.y = 0.02; rosette.receiveShadow = true; g.add(rosette);
  const earth = new THREE.Mesh(new THREE.CircleGeometry(150, 48),
    new THREE.MeshStandardMaterial({ color: 0xc9b493, roughness: 1 }));
  earth.rotation.x = -Math.PI / 2; earth.position.y = -0.05; earth.receiveShadow = true; g.add(earth);
  const sky = new THREE.Mesh(new THREE.SphereGeometry(240, 32, 16),
    new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false }));
  g.add(sky);
  return g;
}

// ------------------------------------------------ builder: tiered fountain
const streams = [], foamRings = [];
function addStreams(g, n, topY, botY, rTop, rBot, off){
  for (let i = 0; i < n; i++){
    const a = i / n * Math.PI * 2 + off, len = topY - botY;
    const s = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.1, len * 1.04, 6, 1, true), M.stream.clone());
    const mid = (rTop + rBot) / 2;
    s.position.set(Math.cos(a) * mid, (topY + botY) / 2, Math.sin(a) * mid);
    s.rotation.z = -Math.cos(a) * (rBot - rTop) / len;
    s.rotation.x =  Math.sin(a) * (rBot - rTop) / len;
    s.userData.phase = rand(0, Math.PI * 2); streams.push(s); g.add(s);
  }
}
function buildFountain(){
  const g = new THREE.Group();
  const plinth = cyl(5.2, 5.4, 0.3, 8, M.stoneFlat); plinth.position.y = 0.15; g.add(plinth);
  const wall = cyl(4.35, 4.55, 1.05, 8, M.stoneFlat); wall.position.y = 0.8; g.add(wall);
  const rim = cyl(4.75, 4.8, 0.25, 8, M.stoneFlat); rim.position.y = 1.42; g.add(rim);
  const pool = new THREE.Mesh(new THREE.CircleGeometry(4.25, 40), M.water);
  pool.rotation.x = -Math.PI / 2; pool.position.y = 1.18; g.add(pool);
  const ped1 = cyl(0.55, 0.85, 1.5, 14, M.stone); ped1.position.y = 1.95; g.add(ped1);
  const midB = cyl(2.35, 0.45, 0.75, 26, M.stone); midB.position.y = 3.05; g.add(midB);
  const midW = new THREE.Mesh(new THREE.CircleGeometry(2.12, 32), M.water.clone());
  midW.rotation.x = -Math.PI / 2; midW.position.y = 3.36; g.add(midW);
  const ped2 = cyl(0.3, 0.5, 1.05, 12, M.stone); ped2.position.y = 3.95; g.add(ped2);
  const topB = cyl(1.25, 0.3, 0.55, 22, M.stone); topB.position.y = 4.75; g.add(topB);
  const topW = new THREE.Mesh(new THREE.CircleGeometry(1.06, 24), M.water.clone());
  topW.rotation.x = -Math.PI / 2; topW.position.y = 4.98; g.add(topW);
  const urn = new THREE.Mesh(new THREE.SphereGeometry(0.3, 14, 12), M.stone);
  urn.scale.set(1, 1.35, 1); urn.position.y = 5.28; urn.castShadow = true; g.add(urn);
  const jet = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.95, 8, 1, true), M.stream.clone());
  jet.position.y = 6.05; g.add(jet); g.userData.jet = jet;
  const splash = new THREE.Mesh(new THREE.SphereGeometry(0.17, 10, 8), M.foam.clone());
  splash.position.y = 6.5; g.add(splash); g.userData.splash = splash;
  addStreams(g, 5, 4.95, 3.4, 1.15, 1.62, 0.35);
  addStreams(g, 7, 3.32, 1.2, 2.28, 3.05, 0.1);
  for (const [r0, r1, y] of [[2.75, 3.35, 1.2], [1.35, 1.85, 3.37]]){
    const ring = new THREE.Mesh(new THREE.RingGeometry(r0, r1, 40), M.foam.clone());
    ring.rotation.x = -Math.PI / 2; ring.position.y = y + 0.005; foamRings.push(ring); g.add(ring);
  }
  g.userData.waters = [pool.material, midW.material, topW.material];
  return g;
}

// -------- sparkling spray points around the fountain
const SPARKS = 230, sparkPos = new Float32Array(SPARKS * 3), sparkDat = [];
for (let i = 0; i < SPARKS; i++){
  const tier = i < 70 ? 0 : (i < 160 ? 1 : 2);
  sparkDat.push({ a: rand(0, Math.PI * 2), ph: rand(0, 1), spd: rand(0.45, 0.95), tier,
    r0: tier === 0 ? 1.13 : (tier === 1 ? 2.26 : rand(2.4, 4.05)),
    r1: tier === 0 ? 1.62 : (tier === 1 ? 3.02 : rand(2.4, 4.05)),
    y0: tier === 0 ? 4.95 : (tier === 1 ? 3.32 : 1.24), len: tier === 0 ? 1.6 : (tier === 1 ? 2.15 : 0.12) });
}
const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({
  color: 0xeaf7ff, size: 0.11, transparent: true, opacity: 0.85,
  blending: THREE.AdditiveBlending, depthWrite: false }));

// ------------------------------------------------ builder: arcaded facade
function archBandGeo(w, h, n){
  const s = new THREE.Shape(), gap = w / n, r = gap * 0.32, spring = 2.15;
  s.moveTo(-w / 2, 0);
  for (let i = 0; i < n; i++){
    const cx = -w / 2 + gap * (i + 0.5);
    s.lineTo(cx - r, 0); s.lineTo(cx - r, spring);
    s.absarc(cx, spring, r, Math.PI, 0, true);
    s.lineTo(cx + r, 0);
  }
  s.lineTo(w / 2, 0); s.lineTo(w / 2, h); s.lineTo(-w / 2, h); s.closePath();
  return new THREE.ExtrudeGeometry(s, { depth: 0.55, bevelEnabled: false });
}
function buildBuilding(cfg){
  const { w, colorIdx } = cfg, depth = 6, stories = 2;
  const g = new THREE.Group();
  const bodyH = 3.9 + stories * 3.0;
  const stucco = new THREE.MeshStandardMaterial({ map: stuccoCanvas(PAL.stucco[colorIdx]), roughness: 0.95 });
  const bandMat = stucco.clone(); bandMat.map = stucco.map.clone(); bandMat.map.repeat.set(0.1, 0.1);
  const body = box(w, bodyH, depth, stucco); body.position.set(0, bodyH / 2, -depth / 2); g.add(body);
  const band = new THREE.Mesh(archBandGeo(w, 3.9, Math.max(3, Math.round(w / 3.6))), bandMat);
  band.position.z = 0.85; band.castShadow = band.receiveShadow = true; g.add(band);
  for (const sx of [-1, 1]){ const sw = box(0.55, 3.9, 1.35, stucco); sw.position.set(sx * (w / 2 - 0.28), 1.95, 0.6); g.add(sw); }
  const slab = box(w + 0.35, 0.32, 2.1, M.cream); slab.position.set(0, 4.05, 0.45); g.add(slab);
  const rail = new THREE.Mesh(new THREE.PlaneGeometry(w, 0.7), M.rail);
  rail.position.set(0, 4.55, 1.45); g.add(rail);
  const cornice = box(w + 0.5, 0.28, depth + 0.5, M.cream); cornice.position.set(0, bodyH + 0.1, -depth / 2); g.add(cornice);
  // hipped terracotta roof (triangular prism extruded across the width)
  const prof = new THREE.Shape();
  prof.moveTo(-(depth + 1) / 2, 0); prof.lineTo((depth + 1) / 2, 0); prof.lineTo(0, 1.7); prof.closePath();
  const roof = new THREE.Mesh(new THREE.ExtrudeGeometry(prof, { depth: w + 0.7, bevelEnabled: false }), M.roof);
  roof.rotation.y = Math.PI / 2; roof.position.set(-(w + 0.7) / 2, bodyH + 0.22, -depth / 2);
  roof.castShadow = roof.receiveShadow = true; g.add(roof);
  // upper-floor windows + open shutters (instanced per building)
  const nW = Math.max(3, Math.round(w / 3.6));
  const winInst = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.95, 1.5), M.window, nW * stories);
  const shGeo = new THREE.BoxGeometry(0.44, 1.5, 0.06);
  const shMat = new THREE.MeshStandardMaterial({ map: shutterTex(PAL.shutter[colorIdx]), roughness: 0.85 });
  const shInst = new THREE.InstancedMesh(shGeo, shMat, nW * stories * 2);
  const mtx = new THREE.Matrix4(), eul = new THREE.Euler(), q = new THREE.Quaternion(), one = new THREE.Vector3(1, 1, 1);
  let wi = 0, si = 0;
  for (let sN = 0; sN < stories; sN++) for (let i = 0; i < nW; i++){
    const wx = -w / 2 + (w / nW) * (i + 0.5), wy = 5.7 + sN * 3.0;
    mtx.compose(new THREE.Vector3(wx, wy, 0.03), q.identity(), one); winInst.setMatrixAt(wi++, mtx);
    for (const sd of [-1, 1]){
      eul.set(0, sd * rand(0.06, 0.2), 0); q.setFromEuler(eul);
      mtx.compose(new THREE.Vector3(wx + sd * 0.76, wy, 0.05), q, one); shInst.setMatrixAt(si++, mtx);
    }
  }
  winInst.castShadow = shInst.castShadow = true; g.add(winInst, shInst);
  // a couple of iron balconies on random upper windows
  for (let b = 0; b < 2; b++){
    const i = randi(0, nW - 1), wx = -w / 2 + (w / nW) * (i + 0.5), wy = 5.7 + (b % stories) * 3.0;
    const plat = box(1.5, 0.12, 0.6, M.cream); plat.position.set(wx, wy - 0.8, 0.3); g.add(plat);
    const br = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.72), M.rail);
    br.position.set(wx, wy - 0.4, 0.58); g.add(br);
  }
  // doors glimpsed through the arches
  for (let i = 0; i < nW; i += 2){
    const dx = -w / 2 + (w / nW) * (i + 0.5);
    const door = new THREE.Mesh(new THREE.PlaneGeometry(1.15, 2.3), M.woodDark);
    door.position.set(dx, 1.15, 0.02); g.add(door);
  }
  return g;
}

// ------------------------------------------------ builder: clock tower
const clockHands = [];
function buildClockTower(){
  const g = new THREE.Group(), sq = 3.5;
  const plinthT = box(sq + 0.7, 1.0, sq + 0.7, M.stoneFlat); plinthT.position.y = 0.5; g.add(plinthT);
  const shaft = box(sq, 12.4, sq, new THREE.MeshStandardMaterial({ map: stuccoCanvas(0xe8ddc2), roughness: 0.95 }));
  shaft.position.y = 7.2; g.add(shaft);
  const beltA = box(sq + 0.4, 0.25, sq + 0.4, M.cream); beltA.position.y = 9.6; g.add(beltA);
  for (let f = 0; f < 4; f++){
    const a = f * Math.PI / 2, nx = Math.sin(a), nz = Math.cos(a);
    const face = new THREE.Mesh(new THREE.CircleGeometry(1.05, 32),
      new THREE.MeshStandardMaterial({ map: clockTex, roughness: 0.7 }));
    face.position.set(nx * (sq / 2 + 0.02), 11.6, nz * (sq / 2 + 0.02)); face.rotation.y = a; g.add(face);
    const hg = new THREE.Group(); hg.position.set(nx * (sq / 2 + 0.06), 11.6, nz * (sq / 2 + 0.06)); hg.rotation.y = a;
    const hMin = box(0.07, 0.78, 0.03, M.iron); hMin.geometry.translate(0, 0.36, 0);
    const hHr = box(0.09, 0.52, 0.03, M.iron); hHr.geometry.translate(0, 0.23, 0);
    hg.add(hMin, hHr); clockHands.push({ min: hMin, hr: hHr }); g.add(hg);
  }
  const beltB = box(sq + 0.5, 0.3, sq + 0.5, M.cream); beltB.position.y = 13.5; g.add(beltB);
  for (const [sx, sz] of [[-1, -1], [-1, 1], [1, -1], [1, 1]]){
    const col = cyl(0.16, 0.18, 1.9, 10, M.cream); col.position.set(sx * (sq / 2 - 0.28), 14.6, sz * (sq / 2 - 0.28)); g.add(col);
  }
  const bell = new THREE.Mesh(new THREE.SphereGeometry(0.42, 14, 12, 0, Math.PI * 2, 0, 2.1), M.iron);
  bell.scale.set(1, 1.25, 1); bell.position.y = 15.0; bell.castShadow = true; g.add(bell);
  g.userData.bell = bell;
  const cap = box(sq + 0.6, 0.3, sq + 0.6, M.cream); cap.position.y = 15.7; g.add(cap);
  const spire = cyl(0.02, sq * 0.72, 1.9, 4, M.roof); spire.rotation.y = Math.PI / 4; spire.position.y = 16.8; g.add(spire);
  const fin = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), M.iron); fin.position.y = 17.9; g.add(fin);
  return g;
}

// ------------------------------------------------ builder: café table set
const umbrellas = [];
function buildCafeSet(stripeIdx){
  const g = new THREE.Group();
  const top = cyl(0.62, 0.62, 0.06, 20, M.cream); top.position.y = 0.78; g.add(top);
  const stem = cyl(0.05, 0.05, 0.78, 8, M.iron); stem.position.y = 0.39; g.add(stem);
  const foot = cyl(0.3, 0.36, 0.06, 14, M.iron); foot.position.y = 0.03; g.add(foot);
  for (let c = 0; c < 2; c++){
    const ch = new THREE.Group(), a = c * Math.PI + rand(-0.5, 0.5);
    ch.position.set(Math.cos(a) * 1.1, 0, Math.sin(a) * 1.1); ch.rotation.y = -a - Math.PI / 2;
    const seat = box(0.46, 0.05, 0.46, M.wood); seat.position.y = 0.45; ch.add(seat);
    const back = box(0.46, 0.5, 0.05, M.wood); back.position.set(0, 0.72, -0.21); back.rotation.x = -0.12; ch.add(back);
    for (const lx of [-0.18, 0.18]){ const leg = box(0.05, 0.45, 0.4, M.woodDark); leg.position.set(lx, 0.22, 0); ch.add(leg); }
    g.add(ch);
  }
  const pole = cyl(0.04, 0.04, 2.45, 8, M.iron); pole.position.y = 1.22; g.add(pole);
  const can = new THREE.Group(); can.position.y = 2.45;
  const cone = new THREE.Mesh(new THREE.ConeGeometry(1.65, 0.6, 8, 1, true),
    new THREE.MeshStandardMaterial({ map: stripeTex(PAL.stripes[stripeIdx]), roughness: 0.85, side: THREE.DoubleSide, flatShading: true }));
  cone.position.y = -0.05; cone.castShadow = true; can.add(cone);
  const tip = cyl(0.03, 0.05, 0.35, 6, M.iron); tip.position.y = 0.3; can.add(tip);
  can.userData.phase = rand(0, Math.PI * 2); umbrellas.push(can); g.add(can);
  return g;
}

// ------------------------------------------------ builder: flower cart
function buildFlowerCart(){
  const g = new THREE.Group();
  const bed = box(2.3, 0.45, 1.15, M.wood); bed.position.y = 0.95; g.add(bed);
  for (const sz of [-1, 1]){ const side = box(2.3, 0.35, 0.08, M.woodDark); side.position.set(0, 1.3, sz * 0.56); g.add(side); }
  const spokeGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.5, 6);
  const spokes = new THREE.InstancedMesh(spokeGeo, M.woodDark, 12);
  const mm = new THREE.Matrix4(), qq = new THREE.Quaternion(), ee = new THREE.Euler();
  let k = 0;
  for (const wx of [-0.75, 0.75]){
    const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.56, 0.07, 10, 22), M.woodDark);
    wheel.position.set(wx, 0.58, 0.66); wheel.castShadow = true; g.add(wheel);
    const hub = cyl(0.09, 0.09, 0.14, 8, M.iron); hub.rotation.x = Math.PI / 2; hub.position.set(wx, 0.58, 0.66); g.add(hub);
    for (let i = 0; i < 6; i++){
      ee.set(0, 0, i * Math.PI / 3); qq.setFromEuler(ee);
      mm.compose(new THREE.Vector3(wx, 0.58, 0.66), qq, new THREE.Vector3(1, 1, 1)); spokes.setMatrixAt(k++, mm);
    }
  }
  g.add(spokes);
  for (const [lx, lz] of [[-0.95, -0.4], [0.95, -0.4]]){ const leg = cyl(0.04, 0.04, 0.75, 6, M.woodDark); leg.position.set(lx, 0.37, lz); g.add(leg); }
  for (const hx of [-0.35, 0.35]){
    const h = cyl(0.035, 0.035, 1.15, 6, M.wood); h.rotation.x = 1.15; h.position.set(hx, 1.1, -1.0); g.add(h);
  }
  // flower mounds: bright instanced blossoms over green foliage
  const bloomGeo = new THREE.IcosahedronGeometry(0.085, 0);
  const blooms = new THREE.InstancedMesh(bloomGeo, new THREE.MeshStandardMaterial({ roughness: 0.7 }), 90);
  const greens = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.11, 0), M.leaf, 55);
  const colr = new THREE.Color(), fPal = [0xe0435c, 0xf3a7b8, 0xf2c14e, 0xffffff, 0xb45ecc, 0xef8b1f];
  for (let i = 0; i < 90; i++){
    mm.compose(new THREE.Vector3(rand(-1.0, 1.0), 1.42 + rand(0, 0.3), rand(-0.42, 0.42)), qq.identity(), new THREE.Vector3(1, 1, 1));
    blooms.setMatrixAt(i, mm); blooms.setColorAt(i, colr.setHex(pick(fPal)));
  }
  for (let i = 0; i < 55; i++){
    mm.compose(new THREE.Vector3(rand(-1.05, 1.05), 1.3 + rand(0, 0.2), rand(-0.48, 0.48)), qq.identity(), new THREE.Vector3(1, 1, 1));
    greens.setMatrixAt(i, mm);
  }
  blooms.castShadow = greens.castShadow = true; g.add(blooms, greens);
  const post = cyl(0.03, 0.03, 1.6, 6, M.iron); post.position.set(-1.0, 1.9, 0); g.add(post);
  const awn = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 1.3),
    new THREE.MeshStandardMaterial({ map: stripeTex(PAL.stripes[0]), side: THREE.DoubleSide, roughness: 0.9 }));
  awn.rotation.set(-Math.PI / 2 + 0.35, 0, Math.PI / 2); awn.position.set(0, 2.6, 0); awn.castShadow = true; g.add(awn);
  const post2 = cyl(0.03, 0.03, 1.6, 6, M.iron); post2.position.set(1.0, 1.9, 0); g.add(post2);
  return g;
}

// ------------------------------------------------ builder: potted orange tree
function buildOrangeTree(){
  const g = new THREE.Group();
  const pot = cyl(0.5, 0.38, 0.6, 14, M.terra); pot.position.y = 0.3; g.add(pot);
  const lip = cyl(0.56, 0.53, 0.14, 14, M.terra); lip.position.y = 0.62; g.add(lip);
  const trunk = cyl(0.08, 0.11, 1.0, 8, M.woodDark); trunk.position.y = 1.1; g.add(trunk);
  const mm = new THREE.Matrix4(), q0 = new THREE.Quaternion();
  const heads = [[0, 2.1, 0, 0.72], [0.4, 1.8, 0.15, 0.5], [-0.35, 1.85, -0.2, 0.48], [0.05, 1.75, 0.38, 0.42]];
  for (const [x, y, z, r] of heads){
    const h = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), M.leaf);
    h.position.set(x, y, z); h.castShadow = true; g.add(h);
  }
  const fruit = new THREE.InstancedMesh(new THREE.SphereGeometry(0.07, 8, 6), M.orange, 14);
  for (let i = 0; i < 14; i++){
    const hd = pick(heads), th = rand(0, Math.PI * 2), ph = rand(0.3, Math.PI - 0.3);
    mm.compose(new THREE.Vector3(hd[0] + Math.sin(ph) * Math.cos(th) * hd[3], hd[1] + Math.cos(ph) * hd[3], hd[2] + Math.sin(ph) * Math.sin(th) * hd[3]),
      q0.identity(), new THREE.Vector3(1, 1, 1));
    fruit.setMatrixAt(i, mm);
  }
  fruit.castShadow = true; g.add(fruit);
  return g;
}

// ------------------------------------------------ builders: lamps, bench, birds, bunting
function buildLampPost(){
  const g = new THREE.Group();
  const base = cyl(0.16, 0.22, 0.35, 10, M.iron); base.position.y = 0.17; g.add(base);
  const pole = cyl(0.05, 0.07, 3.3, 8, M.iron); pole.position.y = 1.95; g.add(pole);
  const lamp = box(0.34, 0.42, 0.34, M.glass); lamp.position.y = 3.8; g.add(lamp);
  const cap = cyl(0.03, 0.32, 0.26, 4, M.iron); cap.rotation.y = Math.PI / 4; cap.position.y = 4.12; g.add(cap);
  return g;
}
function buildBench(){
  const g = new THREE.Group();
  const slats = new THREE.InstancedMesh(new THREE.BoxGeometry(1.7, 0.05, 0.12), M.wood, 5);
  const mm = new THREE.Matrix4(), qq = new THREE.Quaternion(), ee = new THREE.Euler();
  const lay = [[0.48, -0.14, 0], [0.48, 0.02, 0], [0.48, 0.16, 0], [0.72, -0.26, -1.05], [0.95, -0.29, -1.05]];
  for (let i = 0; i < 5; i++){
    ee.set(lay[i][2], 0, 0); qq.setFromEuler(ee);
    mm.compose(new THREE.Vector3(0, lay[i][0], lay[i][1]), qq, new THREE.Vector3(1, 1, 1)); slats.setMatrixAt(i, mm);
  }
  slats.castShadow = true; g.add(slats);
  for (const sx of [-0.75, 0.75]){ const leg = box(0.08, 0.85, 0.5, M.iron); leg.position.set(sx, 0.42, -0.05); g.add(leg); }
  return g;
}
function buildPigeon(){
  const g = new THREE.Group(), grey = new THREE.MeshStandardMaterial({ color: pick([0x9a9aa2, 0x7d7d86, 0xb5b0a8]), roughness: 0.9 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), grey);
  body.scale.set(1, 0.85, 1.3); body.position.y = 0.16; body.castShadow = true; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), grey); head.position.set(0, 0.31, 0.16); g.add(head);
  const beak = new THREE.Mesh(new THREE.ConeGeometry(0.02, 0.06, 6), M.orange);
  beak.rotation.x = Math.PI / 2; beak.position.set(0, 0.3, 0.26); g.add(beak);
  const tail = box(0.1, 0.03, 0.16, grey); tail.rotation.x = 0.35; tail.position.set(0, 0.16, -0.2); g.add(tail);
  g.rotation.y = rand(0, Math.PI * 2); g.scale.setScalar(rand(0.85, 1.1));
  return g;
}
const buntings = [];
function buildBunting(p1, p2, sag){
  const g = new THREE.Group(), pts = [];
  for (let i = 0; i <= 22; i++){
    const u = i / 22, p = p1.clone().lerp(p2, u); p.y -= Math.sin(u * Math.PI) * sag; pts.push(p);
  }
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color: 0x4a3b2a }));
  g.add(line);
  const triShape = new THREE.Shape([new THREE.Vector2(-0.17, 0), new THREE.Vector2(0.17, 0), new THREE.Vector2(0, -0.42)]);
  const flagInst = new THREE.InstancedMesh(new THREE.ShapeGeometry(triShape),
    new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, roughness: 0.9 }), 11);
  const colr = new THREE.Color();
  const dir = Math.atan2(p2.x - p1.x, p2.z - p1.z) + Math.PI / 2;
  const dat = { inst: flagInst, pts: [], dir };
  for (let i = 0; i < 11; i++){
    dat.pts.push(pts[2 + i * 2].clone()); flagInst.setColorAt(i, colr.setHex(PAL.flags[i % PAL.flags.length]));
  }
  g.add(flagInst); buntings.push(dat);
  return g;
}

// ------------------------------------------------ assembly / layout
scene.add(buildGround());
const fountain = buildFountain(); scene.add(fountain); scene.add(sparks);

const buildingCfg = [
  { deg: 15, w: 15 }, { deg: 70, w: 13 }, { deg: 125, w: 16 },
  { deg: 180, w: 12.5 }, { deg: 235, w: 14 }, { deg: 320, w: 13.5 }
];
buildingCfg.forEach((cfg, i) => {
  const b = buildBuilding({ w: cfg.w, colorIdx: i % PAL.stucco.length });
  b.position.copy(polar(cfg.deg, 21.6)); b.rotation.y = faceCenterY(cfg.deg);
  scene.add(b);
});
const tower = buildClockTower();
tower.position.copy(polar(281, 20.2)); tower.rotation.y = faceCenterY(281);
scene.add(tower);

[40, 68, 352].forEach((deg, i) => {
  const set = buildCafeSet(i % PAL.stripes.length);
  set.position.copy(polar(deg, rand(12, 14.5)));
  set.rotation.y = rand(0, Math.PI * 2);
  scene.add(set);
});
const cart = buildFlowerCart();
cart.position.copy(polar(207, 12.2)); cart.rotation.y = D2R(-125);
scene.add(cart);

for (const deg of [52, 100, 152, 252, 300, 338]){
  const t = buildOrangeTree();
  t.position.copy(polar(deg + rand(-4, 4), rand(15.2, 16.8)));
  t.rotation.y = rand(0, Math.PI * 2);
  scene.add(t);
}
const lampAt = [0, 90, 180, 270].map(deg => {
  const l = buildLampPost(); l.position.copy(polar(deg, 10.6)); scene.add(l);
  return l.position.clone();
});
for (const deg of [130, 305]){
  const bn = buildBench();
  bn.position.copy(polar(deg, 8.6)); bn.rotation.y = faceCenterY(deg) + Math.PI; scene.add(bn);
}
for (const [px, pz] of [[3.4, 5.8], [-5.6, 2.4], [1.8, -6.4], [-2.5, -5.2]]){
  const p = buildPigeon(); p.position.set(px, 0, pz); scene.add(p);
}
scene.add(buildBunting(lampAt[0].clone().setY(3.95), lampAt[1].clone().setY(3.95), 0.85));
scene.add(buildBunting(lampAt[2].clone().setY(3.95), lampAt[3].clone().setY(3.95), 0.85));

// ------------------------------------------------ lighting rig
const sun = new THREE.DirectionalLight(PAL.sun, 2.6);
sun.position.set(38, 52, 20); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -36;
sun.shadow.camera.right = sun.shadow.camera.top = 36;
sun.shadow.camera.near = 10; sun.shadow.camera.far = 130;
sun.shadow.bias = -0.0006;
scene.add(sun);
scene.add(new THREE.HemisphereLight(PAL.skyFill, PAL.bounce, 0.75));
const bounce = new THREE.DirectionalLight(0xffd9b0, 0.4);
bounce.position.set(-30, 18, -24); scene.add(bounce);
const glow = new THREE.PointLight(0x7fd4ff, 0.7, 12, 2);
glow.position.set(0, 3.4, 0); scene.add(glow); // cool shimmer rising off the fountain

// ------------------------------------------------ animation loop
const clock = new THREE.Clock();
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpE = new THREE.Euler(), oneV = new THREE.Vector3(1, 1, 1);
function animate(){
  const t = clock.getElapsedTime();
  controls.update();
  // water: rotating caustics, pulsing spill streams, foam and jet
  fountain.userData.waters.forEach((wm, i) => {
    wm.map.center.set(0.5, 0.5); wm.map.rotation = t * 0.06 * (i % 2 ? -1 : 1);
  });
  for (const s of streams){
    const p = s.userData.phase;
    s.scale.x = s.scale.z = 1 + Math.sin(t * 6 + p) * 0.22;
    s.material.opacity = 0.42 + Math.sin(t * 5 + p) * 0.14;
  }
  foamRings.forEach((r, i) => {
    r.material.opacity = 0.22 + 0.14 * Math.sin(t * 2.6 + i * 1.7);
    r.scale.setScalar(1 + 0.05 * Math.sin(t * 1.9 + i));
  });
  fountain.userData.jet.scale.y = 1 + Math.sin(t * 3.2) * 0.1;
  fountain.userData.splash.scale.setScalar(1 + Math.sin(t * 4.1) * 0.25);
  // sparkling droplets falling between the basins
  for (let i = 0; i < SPARKS; i++){
    const d = sparkDat[i], u = (t * d.spd * 0.5 + d.ph) % 1;
    const r = d.r0 + (d.r1 - d.r0) * u;
    sparkPos[i * 3] = Math.cos(d.a) * r;
    sparkPos[i * 3 + 1] = d.y0 - u * d.len + (d.tier === 2 ? Math.sin(t * 3 + d.a * 7) * 0.05 : 0);
    sparkPos[i * 3 + 2] = Math.sin(d.a) * r;
  }
  sparkGeo.attributes.position.needsUpdate = true;
  glow.intensity = 0.55 + Math.sin(t * 5.3) * 0.2;
  // clock hands + gentle bell swing
  for (const h of clockHands){ h.min.rotation.z = -t * (Math.PI * 2 / 42); h.hr.rotation.z = -t * (Math.PI * 2 / 500); }
  tower.userData.bell.rotation.z = Math.sin(t * 1.6) * 0.12;
  // umbrellas swaying in the breeze
  for (const u of umbrellas){
    u.rotation.x = Math.sin(t * 0.8 + u.userData.phase) * 0.045;
    u.rotation.z = Math.cos(t * 0.7 + u.userData.phase) * 0.045;
  }
  // bunting flags fluttering
  for (const b of buntings){
    for (let i = 0; i < b.pts.length; i++){
      tmpE.set(Math.sin(t * 1.9 + i) * 0.12, b.dir + Math.sin(t * 1.4 + i * 0.8) * 0.35, 0);
      tmpQ.setFromEuler(tmpE);
      tmpM.compose(b.pts[i], tmpQ, oneV); b.inst.setMatrixAt(i, tmpM);
    }
    b.inst.instanceMatrix.needsUpdate = true;
  }
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

// ------------------------------------------------ resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
