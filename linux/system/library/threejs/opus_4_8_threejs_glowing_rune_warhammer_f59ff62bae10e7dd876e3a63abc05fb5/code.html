<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>Glowing Rune Warhammer</title>
<style>

  #hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    color: rgba(255, 210, 160, 0.45); font: 12px/1.4 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;

<body>
<div id="hint">Rune Warhammer &mdash; drag to orbit &middot; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------------------
// Renderer / Scene / Camera
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0c10);
scene.fog = new THREE.FogExp2(0x0b0c10, 0.021);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.05, 200);
camera.position.set(2.35, 1.35, 3.25);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.target.set(0, 1.05, 0);
controls.minDistance = 1.4;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.92;
controls.update();

// ---------------------------------------------------------------------------
// Palette
// ---------------------------------------------------------------------------
const COL_EMBER   = new THREE.Color(0xff6a12);
const COL_MOLTEN  = new THREE.Color(0xffa23a);
const COL_ARCANE  = new THREE.Color(0x2f8dff);
const COL_ARCANE2 = new THREE.Color(0x66c8ff);

// ---------------------------------------------------------------------------
// Lighting
// ---------------------------------------------------------------------------
const hemi = new THREE.HemisphereLight(0x5b6a86, 0x140d0a, 0.42);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xbfd2ff, 2.0);
key.position.set(4.2, 6.4, 3.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 24;
key.shadow.camera.left = -3.2;
key.shadow.camera.right = 3.2;
key.shadow.camera.top = 4.2;
key.shadow.camera.bottom = -1.2;
key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.018;
scene.add(key);

const fill = new THREE.DirectionalLight(0x5878a8, 0.45);
fill.position.set(-4.5, 2.2, 2.6);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xff8a3c, 0.85);
rim.position.set(-2.6, 3.0, -4.6);
scene.add(rim);

// Warm halo emitted by the runes themselves
const runeLightHead = new THREE.PointLight(0xff7a20, 3.2, 6.5, 2.0);
runeLightHead.position.set(0, 1.98, 0);
scene.add(runeLightHead);

const runeLightArcane = new THREE.PointLight(0x3f9bff, 1.5, 4.6, 2.0);
runeLightArcane.position.set(0, 1.32, 0);
scene.add(runeLightArcane);

const runeLightLow = new THREE.PointLight(0xff5a12, 1.2, 3.6, 2.0);
runeLightLow.position.set(0, 0.42, 0);
scene.add(runeLightLow);

// ---------------------------------------------------------------------------
// Ground: shadow-only catcher + faint glow disc
// ---------------------------------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.5 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// soft radial halo on the floor (additive, no shadow interaction)
const haloCanvasMat = new THREE.MeshBasicMaterial({
  color: 0xff6a1e,
  transparent: true,
  opacity: 0.16,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  side: THREE.DoubleSide
});
const halo = new THREE.Mesh(new THREE.CircleGeometry(1.8, 64), haloCanvasMat);
halo.rotation.x = -Math.PI / 2;
halo.position.y = 0.004;
scene.add(halo);

// ---------------------------------------------------------------------------
// Materials
// ---------------------------------------------------------------------------
const matDarkIron = new THREE.MeshStandardMaterial({
  color: 0x2b2e34,
  metalness: 0.92,
  roughness: 0.46,
  flatShading: false
});

const matIronRough = new THREE.MeshStandardMaterial({
  color: 0x22252a,
  metalness: 0.85,
  roughness: 0.64
});

const matSteelTrim = new THREE.MeshStandardMaterial({
  color: 0x6a6f78,
  metalness: 1.0,
  roughness: 0.3
});

const matBronze = new THREE.MeshStandardMaterial({
  color: 0x8a6a3a,
  metalness: 1.0,
  roughness: 0.35
});

const matLeather = new THREE.MeshStandardMaterial({
  color: 0x3a2418,
  metalness: 0.05,
  roughness: 0.86
});

const matLeatherDark = new THREE.MeshStandardMaterial({
  color: 0x2a1912,
  metalness: 0.05,
  roughness: 0.92
});

const matStoneCore = new THREE.MeshStandardMaterial({
  color: 0x3a3630,
  metalness: 0.25,
  roughness: 0.9
});

// Rune materials — emissive, animated intensity
const matRuneWarm = new THREE.MeshStandardMaterial({
  color: 0x150800,
  emissive: COL_MOLTEN.clone(),
  emissiveIntensity: 3.0,
  metalness: 0.0,
  roughness: 1.0,
  toneMapped: true
});

const matRuneHot = new THREE.MeshStandardMaterial({
  color: 0x1a0500,
  emissive: COL_EMBER.clone(),
  emissiveIntensity: 3.6,
  metalness: 0.0,
  roughness: 1.0
});

const matRuneCool = new THREE.MeshStandardMaterial({
  color: 0x000814,
  emissive: COL_ARCANE.clone(),
  emissiveIntensity: 3.0,
  metalness: 0.0,
  roughness: 1.0
});

const matRuneCoolBright = new THREE.MeshStandardMaterial({
  color: 0x001020,
  emissive: COL_ARCANE2.clone(),
  emissiveIntensity: 3.2,
  metalness: 0.0,
  roughness: 1.0
});

const pulseMaterials = [
  { m: matRuneWarm, base: 2.6, amp: 1.5, speed: 1.15, phase: 0.0 },
  { m: matRuneHot, base: 3.0, amp: 1.9, speed: 1.45, phase: 1.7 },
  { m: matRuneCool, base: 2.2, amp: 1.4, speed: 0.85, phase: 3.1 },
  { m: matRuneCoolBright, base: 2.6, amp: 1.6, speed: 1.0, phase: 4.4 }
];

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function addMesh(parent, geo, mat, opts = {}) {
  const m = new THREE.Mesh(geo, mat);
  if (opts.pos) m.position.set(opts.pos[0], opts.pos[1], opts.pos[2]);
  if (opts.rot) m.rotation.set(opts.rot[0], opts.rot[1], opts.rot[2]);
  if (opts.scale) m.scale.set(opts.scale[0], opts.scale[1], opts.scale[2]);
  m.castShadow = opts.castShadow !== false;
  m.receiveShadow = opts.receiveShadow !== false;
  parent.add(m);
  return m;
}

// A rune is a thin extruded glyph made of segments; we build it from small boxes
// laid on a local plane (x = width, y = height, thin in z), then oriented.
function makeRuneGlyph(segments, mat, thickness) {
  const g = new THREE.Group();
  const t = thickness === undefined ? 0.012 : thickness;
  for (const s of segments) {
    // s = [x1, y1, x2, y2, width]
    const x1 = s[0], y1 = s[1], x2 = s[2], y2 = s[3];
    const w = s[4] === undefined ? 0.018 : s[4];
    const dx = x2 - x1, dy = y2 - y1;
    const len = Math.sqrt(dx * dx + dy * dy);
    if (len < 1e-6) continue;
    const bar = new THREE.Mesh(new THREE.BoxGeometry(len + w * 0.6, w, t), mat);
    bar.position.set((x1 + x2) / 2, (y1 + y2) / 2, 0);
    bar.rotation.z = Math.atan2(dy, dx);
    bar.castShadow = false;
    bar.receiveShadow = false;
    g.add(bar);
  }
  return g;
}

// Library of angular "rune" glyph stroke sets (normalized roughly to +/-0.5)
const RUNE_LIBRARY = [
  // Algiz-like
  [[0, -0.5, 0, 0.5], [0, 0.18, -0.30, 0.5], [0, 0.18, 0.30, 0.5]],
  // Thurisaz-like
  [[-0.16, -0.5, -0.16, 0.5], [-0.16, 0.10, 0.24, -0.06], [-0.16, -0.24, 0.24, -0.06]],
  // Dagaz-like (hourglass X box)
  [[-0.26, -0.45, 0.26, 0.45], [-0.26, 0.45, 0.26, -0.45], [-0.26, -0.45, -0.26, 0.45], [0.26, -0.45, 0.26, 0.45]],
  // Eihwaz-like
  [[0, -0.45, 0, 0.45], [0, 0.45, -0.26, 0.24], [0, -0.45, 0.26, -0.24]],
  // Ansuz-like
  [[-0.18, -0.5, -0.18, 0.5], [-0.18, 0.42, 0.24, 0.16], [-0.18, 0.08, 0.24, -0.18]],
  // Gebo (X)
  [[-0.28, -0.42, 0.28, 0.42], [-0.28, 0.42, 0.28, -0.42]],
  // Tiwaz-like arrow
  [[0, -0.5, 0, 0.5], [0, 0.5, -0.24, 0.18], [0, 0.5, 0.24, 0.18]],
  // Ingwaz-like diamond
  [[0, -0.42, -0.26, 0], [-0.26, 0, 0, 0.42], [0, 0.42, 0.26, 0], [0.26, 0, 0, -0.42]],
  // Sowilo-like zigzag
  [[-0.24, -0.44, 0.20, -0.10], [0.20, -0.10, -0.20, 0.12], [-0.20, 0.12, 0.24, 0.44]],
  // Isa with crossbars
  [[0, -0.48, 0, 0.48], [-0.20, 0.20, 0.20, 0.20], [-0.20, -0.20, 0.20, -0.20]],
  // Othala-like
  [[0, 0.46, -0.24, 0.06], [0, 0.46, 0.24, 0.06], [-0.24, 0.06, 0.10, -0.46], [0.24, 0.06, -0.10, -0.46]],
  // Kenaz-like
  [[-0.22, -0.42, 0.18, 0.02], [0.18, 0.02, -0.22, 0.44]]
];

const runeMatCycle = [matRuneWarm, matRuneHot, matRuneCool, matRuneWarm, matRuneHot, matRuneCoolBright];

// Deterministic pseudo-random
let _seed = 20260720;
function rnd() {
  _seed = (_seed * 1664525 + 1013904223) % 4294967296;
  return _seed / 4294967296;
}

function placeRune(parent, index, size, pos, rot, mat, thickness) {
  const strokes = RUNE_LIBRARY[index % RUNE_LIBRARY.length];
  const scaled = strokes.map(s => [
    s[0] * size, s[1] * size, s[2] * size, s[3] * size, size * 0.115
  ]);
  const glyph = makeRuneGlyph(scaled, mat, thickness);
  glyph.position.set(pos[0], pos[1], pos[2]);
  glyph.rotation.set(rot[0], rot[1], rot[2]);
  parent.add(glyph);
  return glyph;
}

// ---------------------------------------------------------------------------
// THE WARHAMMER  (one centered object)
// ---------------------------------------------------------------------------
const hammer = new THREE.Group();
scene.add(hammer);

// --- Dimensions (metres) — a massive two-hander -----------------------------
const HAFT_LEN = 1.62;      // total shaft length
const HAFT_R = 0.036;       // shaft radius
const HEAD_Y = 1.70;        // centre height of the head
const HEAD_W = 0.42;        // along X (striking axis)
const HEAD_H = 0.30;        // vertical
const HEAD_D = 0.28;        // depth Z

// ===========================================================================
// 1. HAFT (shaft) — dark iron core with stone banding
// ===========================================================================
const haftGroup = new THREE.Group();
hammer.add(haftGroup);

const haftCore = addMesh(
  haftGroup,
  new THREE.CylinderGeometry(HAFT_R * 0.94, HAFT_R * 1.12, HAFT_LEN, 20, 1),
  matIronRough,
  { pos: [0, HAFT_LEN / 2 + 0.02, 0] }
);

// Subtle octagonal facet sleeve for a forged look
const haftFacet = addMesh(
  haftGroup,
  new THREE.CylinderGeometry(HAFT_R * 1.02, HAFT_R * 1.02, HAFT_LEN * 0.52, 8, 1),
  matDarkIron,
  { pos: [0, HAFT_LEN * 0.70, 0] }
);
haftFacet.rotation.y = Math.PI / 8;

// --- Leather grip wraps (two bound sections for a two-handed weapon) --------
function buildGripWrap(yStart, yEnd, coils, radius) {
  const g = new THREE.Group();
  const span = yEnd - yStart;
  const step = span / coils;
  const torusR = radius;
  const tube = step * 0.48;
  for (let i = 0; i < coils; i++) {
    const y = yStart + step * (i + 0.5);
    const mat = (i % 2 === 0) ? matLeather : matLeatherDark;
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(torusR, tube, 8, 26),
      mat
    );
    ring.rotation.x = Math.PI / 2;
    // slight helical tilt so it reads as a wrapped strap
    ring.rotation.y = 0.10;
    ring.rotation.z = (i % 2 === 0) ? 0.055 : -0.055;
    ring.position.y = y;
    ring.castShadow = true;
    ring.receiveShadow = true;
    g.add(ring);
  }
  return g;
}

const gripLower = buildGripWrap(0.10, 0.60, 16, HAFT_R * 1.20);
haftGroup.add(gripLower);

const gripUpper = buildGripWrap(0.86, 1.28, 14, HAFT_R * 1.16);
haftGroup.add(gripUpper);

// Leather binding knots / steel ferrules between the grips
function addFerrule(y, r, h, mat) {
  return addMesh(haftGroup, new THREE.CylinderGeometry(r, r, h, 16, 1), mat, { pos: [0, y, 0] });
}
addFerrule(0.635, HAFT_R * 1.30, 0.030, matSteelTrim);
addFerrule(0.075, HAFT_R * 1.32, 0.030, matSteelTrim);
addFerrule(0.825, HAFT_R * 1.28, 0.028, matSteelTrim);
addFerrule(1.310, HAFT_R * 1.30, 0.032, matSteelTrim);

// Rivets on the ferrules
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2;
  const r = HAFT_R * 1.32;
  addMesh(haftGroup, new THREE.SphereGeometry(0.0075, 8, 6), matSteelTrim, {
    pos: [Math.cos(a) * r, 0.635, Math.sin(a) * r]
  });
  addMesh(haftGroup, new THREE.SphereGeometry(0.0075, 8, 6), matSteelTrim, {
    pos: [Math.cos(a) * r, 1.310, Math.sin(a) * r]
  });
}

// --- Pommel / butt-cap ------------------------------------------------------
const pommel = new THREE.Group();
pommel.position.y = 0.02;
haftGroup.add(pommel);

addMesh(pommel, new THREE.CylinderGeometry(HAFT_R * 1.55, HAFT_R * 1.25, 0.075, 12, 1), matDarkIron, {
  pos: [0, -0.010, 0]
});
addMesh(pommel, new THREE.SphereGeometry(HAFT_R * 1.42, 20, 14), matDarkIron, {
  pos: [0, -0.062, 0], scale: [1, 0.82, 1]
});
addMesh(pommel, new THREE.ConeGeometry(HAFT_R * 0.72, 0.055, 10), matSteelTrim, {
  pos: [0, -0.112, 0], rot: [Math.PI, 0, 0]
});

// Glowing core gem in the pommel
const pommelGem = addMesh(pommel, new THREE.OctahedronGeometry(0.030, 0), matRuneHot, {
  pos: [0, -0.060, 0], scale: [1, 1.25, 1], castShadow: false, receiveShadow: false
});

// A slit of light around the pommel cap
const pommelRing = new THREE.Mesh(
  new THREE.TorusGeometry(HAFT_R * 1.38, 0.0055, 8, 32),
  matRuneWarm
);
pommelRing.rotation.x = Math.PI / 2;
pommelRing.position.y = -0.018;
pommelRing.castShadow = false;
pommelRing.receiveShadow = false;
pommel.add(pommelRing);

// ===========================================================================
// 2. HAFT RUNES — deep-cut glyphs blazing along the shaft
// ===========================================================================
const haftRunes = new THREE.Group();
haftGroup.add(haftRunes);

// Vertical inlay channels running up the bare mid-section
function addHaftChannel(yCenter, height, angle, mat, width) {
  const w = width === undefined ? 0.010 : width;
  const bar = new THREE.Mesh(new THREE.BoxGeometry(w, height, 0.010), mat);
  const r = HAFT_R * 1.035;
  bar.position.set(Math.cos(angle) * r, yCenter, Math.sin(angle) * r);
  bar.rotation.y = -angle + Math.PI / 2;
  bar.castShadow = false;
  bar.receiveShadow = false;
  haftRunes.add(bar);
  return bar;
}

const channelAngles = [0, Math.PI * 0.5, Math.PI, Math.PI * 1.5];
for (const a of channelAngles) {
  addHaftChannel(0.735, 0.155, a, matRuneCool, 0.009);
  addHaftChannel(1.075, 0.155, a, matRuneWarm, 0.009);
}

// Rune glyphs on the exposed shaft band between the grips
for (let i = 0; i < 8; i++) {
  const a = (i / 8) * Math.PI * 2 + 0.20;
  const y = 0.700 + (i % 4) * 0.052;
  const r = HAFT_R * 1.055;
  const mat = runeMatCycle[i % runeMatCycle.length];
  placeRune(
    haftRunes, i + 2, 0.078,
    [Math.cos(a) * r, y, Math.sin(a) * r],
    [0, -a + Math.PI / 2, 0],
    mat, 0.010
  );
}

// Rune band on the upper collar region
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * Math.PI * 2 + 0.5;
  const r = HAFT_R * 1.06;
  placeRune(
    haftRunes, i + 5, 0.062,
    [Math.cos(a) * r, 1.375, Math.sin(a) * r],
    [0, -a + Math.PI / 2, 0],
    (i % 2 === 0) ? matRuneHot : matRuneCoolBright, 0.009
  );
}

// ===========================================================================
// 3. HEAD COLLAR / LANGETS — steel straps binding head to haft
// ===========================================================================
const collar = new THREE.Group();
collar.position.y = HEAD_Y;
hammer.add(collar);

// Main socket block
addMesh(collar, new THREE.CylinderGeometry(HAFT_R * 1.9, HAFT_R * 2.25, 0.13, 12, 1), matDarkIron, {
  pos: [0, -HEAD_H * 0.60, 0]
});
addMesh(collar, new THREE.CylinderGeometry(HAFT_R * 2.05, HAFT_R * 1.85, 0.10, 12, 1), matDarkIron, {
  pos: [0, HEAD_H * 0.62, 0]
});

// Langets (flat straps down the haft, front & back)
for (const s of [-1, 1]) {
  const langet = addMesh(collar, new THREE.BoxGeometry(0.020, 0.30, 0.075), matSteelTrim, {
    pos: [0, -HEAD_H * 0.86, s * HAFT_R * 1.42],
    rot: [0, 0, 0]
  });
  langet.rotation.y = Math.PI / 2;
  // rivets
  for (let i = 0; i < 3; i++) {
    addMesh(collar, new THREE.SphereGeometry(0.0085, 8, 6), matBronze, {
      pos: [0, -HEAD_H * 0.86 - 0.09 + i * 0.09, s * (HAFT_R * 1.42 + 0.010)]
    });
  }
}
for (const s of [-1, 1]) {
  const langet = addMesh(collar, new THREE.BoxGeometry(0.020, 0.24, 0.070), matSteelTrim, {
    pos: [s * HAFT_R * 1.42, -HEAD_H * 0.80, 0]
  });
  langet.rotation.y = 0;
}

// ===========================================================================
// 4. HAMMER HEAD — blocky dark iron, stone-and-steel mass
// ===========================================================================
const head = new THREE.Group();
head.position.y = HEAD_Y;
hammer.add(head);

// Central mass block
const headCore = addMesh(head, new THREE.BoxGeometry(HEAD_W * 0.92, HEAD_H, HEAD_D), matDarkIron, {
  pos: [0, 0, 0]
});

// Bevelled shell (slightly larger, chamfered look via stacked plates)
addMesh(head, new THREE.BoxGeometry(HEAD_W * 0.86, HEAD_H * 1.06, HEAD_D * 0.90), matIronRough, { pos: [0, 0, 0] });
addMesh(head, new THREE.BoxGeometry(HEAD_W * 0.96, HEAD_H * 0.86, HEAD_D * 0.94), matIronRough, { pos: [0, 0, 0] });

// Stone inner core visible through the top seam
addMesh(head, new THREE.BoxGeometry(HEAD_W * 0.50, HEAD_H * 0.70, HEAD_D * 0.62), matStoneCore, { pos: [0, 0.005, 0] });

// --- Striking faces (both ends: one flat maul face, one blunt wedge) --------
function buildStrikeFace(dir) {
  const g = new THREE.Group();
  g.position.x = dir * HEAD_W * 0.46;

  // tapered neck
  const neck = addMesh(g, new THREE.BoxGeometry(0.055, HEAD_H * 0.94, HEAD_D * 0.94), matDarkIron, {
    pos: [dir * 0.028, 0, 0]
  });

  // face plate
  const plate = addMesh(g, new THREE.BoxGeometry(0.070, HEAD_H * 1.04, HEAD_D * 1.02), matDarkIron, {
    pos: [dir * 0.090, 0, 0]
  });

  // outer rim ring (steel band around the striking surface)
  const rim = addMesh(g, new THREE.BoxGeometry(0.022, HEAD_H * 1.10, HEAD_D * 1.08), matSteelTrim, {
    pos: [dir * 0.126, 0, 0]
  });

  // corner studs on the striking face
  const sx = dir * 0.140;
  const oy = HEAD_H * 0.40, oz = HEAD_D * 0.40;
  for (const my of [-1, 1]) {
    for (const mz of [-1, 1]) {
      addMesh(g, new THREE.CylinderGeometry(0.019, 0.023, 0.028, 8), matSteelTrim, {
        pos: [sx, my * oy, mz * oz],
        rot: [0, 0, Math.PI / 2 * dir]
      });
    }
  }

  // central boss
  addMesh(g, new THREE.CylinderGeometry(0.030, 0.038, 0.030, 12), matIronRough, {
    pos: [sx, 0, 0], rot: [0, 0, Math.PI / 2]
  });

  return g;
}

const faceA = buildStrikeFace(1);
const faceB = buildStrikeFace(-1);
head.add(faceA, faceB);

// --- Top crest / spike -------------------------------------------------------
const crest = new THREE.Group();
crest.position.y = HEAD_H * 0.5;
head.add(crest);

addMesh(crest, new THREE.BoxGeometry(HEAD_W * 0.34, 0.045, HEAD_D * 0.52), matDarkIron, { pos: [0, 0.022, 0] });
addMesh(crest, new THREE.ConeGeometry(0.055, 0.16, 4), matDarkIron, { pos: [0, 0.122, 0], rot: [0, Math.PI / 4, 0] });
addMesh(crest, new THREE.ConeGeometry(0.020, 0.055, 4), matSteelTrim, { pos: [0, 0.226, 0], rot: [0, Math.PI / 4, 0] });

// small side fins
for (const s of [-1, 1]) {
  addMesh(crest, new THREE.BoxGeometry(0.026, 0.055, 0.10), matIronRough, {
    pos: [s * HEAD_W * 0.22, 0.030, 0],
    rot: [0, 0, s * 0.22]
  });
}

// --- Bottom lugs -------------------------------------------------------------
for (const s of [-1, 1]) {
  addMesh(head, new THREE.BoxGeometry(0.055, 0.055, HEAD_D * 0.5), matIronRough, {
    pos: [s * HEAD_W * 0.30, -HEAD_H * 0.52, 0],
    rot: [0, 0, -s * 0.20]
  });
}

// ===========================================================================
// 5. HEAD RUNES + MOLTEN SEAMS
// ===========================================================================
const headRunes = new THREE.Group();
head.add(headRunes);

// -- Glowing seam channels wrapping the head (horizontal + vertical) --------
function addSeamBox(w, h, d, pos, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.castShadow = false;
  m.receiveShadow = false;
  headRunes.add(m);
  return m;
}

// horizontal seam ring around the mid of the head (4 sides)
const seamT = 0.014;
const seamOut = 0.004;
addSeamBox(HEAD_W * 0.94, seamT, HEAD_D + seamOut * 2, [0, 0.052, 0], matRuneHot);
addSeamBox(HEAD_W * 0.94, seamT * 0.8, HEAD_D + seamOut * 2, [0, -0.062, 0], matRuneWarm);
addSeamBox(HEAD_W + 0.02, seamT * 0.9, HEAD_D * 0.30, [0, -0.005, 0], matRuneCool);

// vertical seams on the Z faces
for (const z of [HEAD_D * 0.5 + 0.003, -(HEAD_D * 0.5 + 0.003)]) {
  for (const x of [-HEAD_W * 0.30, HEAD_W * 0.30]) {
    addSeamBox(0.012, HEAD_H * 0.92, 0.008, [x, 0, z], matRuneWarm);
  }
}
// vertical seams on the X-ends near the neck
for (const x of [HEAD_W * 0.455, -HEAD_W * 0.455]) {
  addSeamBox(0.010, HEAD_H * 0.80, HEAD_D * 0.62, [x, 0, 0], matRuneCool);
}

// -- Big rune glyphs on each side face of the head ---------------------------
const faceZ = HEAD_D * 0.5 + 0.008;
placeRune(headRunes, 0, 0.155, [-0.088, 0.000, faceZ], [0, 0, 0], matRuneHot, 0.012);
placeRune(headRunes, 3, 0.135, [0.010, 0.000, faceZ], [0, 0, 0], matRuneCoolBright, 0.012);
placeRune(headRunes, 6, 0.145, [0.105, 0.000, faceZ], [0, 0, 0], matRuneWarm, 0.012);

placeRune(headRunes, 7, 0.150, [0.088, 0.000, -faceZ], [0, Math.PI, 0], matRuneWarm, 0.012);
placeRune(headRunes, 10, 0.132, [-0.010, 0.000, -faceZ], [0, Math.PI, 0], matRuneCool, 0.012);
placeRune(headRunes, 8, 0.145, [-0.105, 0.000, -faceZ], [0, Math.PI, 0], matRuneHot, 0.012);

// -- Runes on the top crest --------------------------------------------------
const topY = HEAD_H * 0.5 + 0.046;
placeRune(headRunes, 2, 0.085, [-0.075, topY, 0], [-Math.PI / 2, 0, 0], matRuneCoolBright, 0.010);
placeRune(headRunes, 5, 0.085, [0.075, topY, 0], [-Math.PI / 2, 0, 0], matRuneCoolBright, 0.010);

// -- Runes on the underside --------------------------------------------------
const botY = -HEAD_H * 0.5 - 0.006;
placeRune(headRunes, 4, 0.080, [-0.080, botY, 0], [Math.PI / 2, 0, 0], matRuneWarm, 0.010);
placeRune(headRunes, 9, 0.080, [0.080, botY, 0], [Math.PI / 2, 0, 0], matRuneHot, 0.010);

// -- Runes stamped on the striking faces ------------------------------------
const strikeX = HEAD_W * 0.46 + 0.140;
placeRune(headRunes, 1, 0.115, [strikeX + 0.010, 0, 0], [0, Math.PI / 2, 0], matRuneHot, 0.010);
placeRune(headRunes, 11, 0.115, [-(strikeX + 0.010), 0, 0], [0, -Math.PI / 2, 0], matRuneCoolBright, 0.010);

// -- Glowing rivet dots along the head edges ---------------------------------
const dotGeo = new THREE.SphereGeometry(0.0085, 10, 8);
for (let i = 0; i < 5; i++) {
  const x = -HEAD_W * 0.34 + i * (HEAD_W * 0.17);
  for (const s of [1, -1]) {
    const d = new THREE.Mesh(dotGeo, (i % 2 === 0) ? matRuneHot : matRuneCoolBright);
    d.position.set(x, HEAD_H * 0.40, s * (HEAD_D * 0.5 + 0.006));
    d.castShadow = false;
    headRunes.add(d);
    const d2 = new THREE.Mesh(dotGeo, (i % 2 === 0) ? matRuneCool : matRuneWarm);
    d2.position.set(x, -HEAD_H * 0.40, s * (HEAD_D * 0.5 + 0.006));
    d2.castShadow = false;
    headRunes.add(d2);
  }
}

// ===========================================================================
// 6. GLOW SPRITES — soft halo around the emissive seams (additive)
// ===========================================================================
function makeGlowTexture() {
  const size = 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  g.addColorStop(0.00, 'rgba(255,255,255,1)');
  g.addColorStop(0.18, 'rgba(255,225,170,0.85)');
  g.addColorStop(0.42, 'rgba(255,140,40,0.34)');
  g.addColorStop(0.72, 'rgba(255,90,20,0.09)');
  g.addColorStop(1.00, 'rgba(255,60,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const glowTex = makeGlowTexture();

function addGlowSprite(parent, pos, scale, color, opacity) {
  const mat = new THREE.SpriteMaterial({
    map: glowTex,
    color: color,
    transparent: true,
    opacity: opacity,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const s = new THREE.Sprite(mat);
  s.position.set(pos[0], pos[1], pos[2]);
  s.scale.set(scale, scale, 1);
  parent.add(s);
  return s;
}

const glowSprites = [];
glowSprites.push(addGlowSprite(head, [0, 0.0, 0], 1.05, 0xff7a26, 0.42));
glowSprites.push(addGlowSprite(head, [HEAD_W * 0.60, 0, 0], 0.52, 0xff8a34, 0.34));
glowSprites.push(addGlowSprite(head, [-HEAD_W * 0.60, 0, 0], 0.52, 0x66b4ff, 0.30));
glowSprites.push(addGlowSprite(head, [0, HEAD_H * 0.72, 0], 0.44, 0x8ecdff, 0.30));
glowSprites.push(addGlowSprite(haftGroup, [0, 1.10, 0], 0.42, 0xff7a26, 0.26));
glowSprites.push(addGlowSprite(haftGroup, [0, 0.76, 0], 0.40, 0x5aa8ff, 0.24));
glowSprites.push(addGlowSprite(haftGroup, [0, -0.04, 0], 0.34, 0xff6a1c, 0.30));

// ===========================================================================
// 7. DRIFTING EMBERS — points rising from the seams
// ===========================================================================
const EMBER_COUNT = 420;
const emberPos = new Float32Array(EMBER_COUNT * 3);
const emberCol = new Float32Array(EMBER_COUNT * 3);
const emberSize = new Float32Array(EMBER_COUNT);
const emberData = [];

function spawnEmber(i, initial) {
  // pick a source: head seams (most), haft runes, pommel
  const r = rnd();
  let ox, oy, oz;
  if (r < 0.62) {
    ox = (rnd() - 0.5) * HEAD_W * 1.05;
    oy = HEAD_Y + (rnd() - 0.5) * HEAD_H * 0.95;
    oz = (rnd() - 0.5) * HEAD_D * 1.05;
  } else if (r < 0.94) {
    const a = rnd() * Math.PI * 2;
    ox = Math.cos(a) * HAFT_R * 1.3;
    oz = Math.sin(a) * HAFT_R * 1.3;
    oy = 0.62 + rnd() * 0.78;
  } else {
    const a = rnd() * Math.PI * 2;
    ox = Math.cos(a) * HAFT_R * 1.4;
    oz = Math.sin(a) * HAFT_R * 1.4;
    oy = -0.02 + rnd() * 0.10;
  }

  const life = 2.4 + rnd() * 3.4;
  const d = emberData[i] || (emberData[i] = {});
  d.ox = ox; d.oy = oy; d.oz = oz;
  d.vx = (rnd() - 0.5) * 0.055;
  d.vy = 0.075 + rnd() * 0.16;
  d.vz = (rnd() - 0.5) * 0.055;
  d.swayAmp = 0.012 + rnd() * 0.035;
  d.swayFreq = 0.6 + rnd() * 1.7;
  d.swayPhase = rnd() * Math.PI * 2;
  d.life = life;
  d.age = initial ? rnd() * life : 0;
  d.cool = rnd() < 0.28;
  d.baseSize = 0.010 + rnd() * 0.020;

  emberSize[i] = d.baseSize;
  const c = d.cool ? COL_ARCANE2 : (rnd() < 0.5 ? COL_EMBER : COL_MOLTEN);
  emberCol[i * 3 + 0] = c.r;
  emberCol[i * 3 + 1] = c.g;
  emberCol[i * 3 + 2] = c.b;
  emberPos[i * 3 + 0] = ox;
  emberPos[i * 3 + 1] = oy;
  emberPos[i * 3 + 2] = oz;
}

for (let i = 0; i < EMBER_COUNT; i++) spawnEmber(i, true);

const emberGeo = new THREE.BufferGeometry();
emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPos, 3));
emberGeo.setAttribute('color', new THREE.BufferAttribute(emberCol, 3));
emberGeo.setAttribute('aSize', new THREE.BufferAttribute(emberSize, 1));

const emberMat = new THREE.PointsMaterial({
  size: 0.030,
  map: glowTex,
  vertexColors: true,
  transparent: true,
  opacity: 0.95,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true
});

const embers = new THREE.Points(emberGeo, emberMat);
embers.frustumCulled = false;
hammer.add(embers);

// ===========================================================================
// 8. CENTER THE WHOLE OBJECT
// ===========================================================================
// Shift so the weapon's vertical mid-point sits nicely and its base is at y=0.
// (Everything was authored with the pommel near y≈-0.10 and head top near y≈2.0.)
hammer.position.y = 0.12;

// Recompute a good orbit target = centre of the hammer's bounding box
const bbox = new THREE.Box3();
bbox.setFromObject(hammer);
const center = new THREE.Vector3();
bbox.getCenter(center);
controls.target.set(0, center.y, 0);
controls.update();

// Ground halo tracks under the object
halo.position.set(0, 0.004, 0);

// ---------------------------------------------------------------------------
// Animation
// ---------------------------------------------------------------------------
const clock = new THREE.Clock();
const emberPosAttr = emberGeo.getAttribute('position');

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // --- pulsing rune emissive ------------------------------------------------
  let warmMix = 0;
  for (const p of pulseMaterials) {
    const s = Math.sin(t * p.speed + p.phase);
    const s2 = Math.sin(t * p.speed * 2.37 + p.phase * 1.7);
    const k = p.base + p.amp * (0.62 * s + 0.38 * s2) * 0.5 + p.amp * 0.25;
    p.m.emissiveIntensity = Math.max(0.25, k);
    warmMix += k;
  }
  warmMix /= pulseMaterials.length;

  // --- light throb ----------------------------------------------------------
  runeLightHead.intensity = 2.4 + Math.sin(t * 1.25) * 0.75 + Math.sin(t * 3.1) * 0.30;
  runeLightArcane.intensity = 1.15 + Math.sin(t * 0.85 + 1.4) * 0.45;
  runeLightLow.intensity = 0.95 + Math.sin(t * 1.6 + 2.2) * 0.35;

  // Keep the rune lights pinned to the (rotating) hammer's local axis
  runeLightHead.position.set(0, HEAD_Y + hammer.position.y, 0);
  runeLightArcane.position.set(0, 1.05 + hammer.position.y, 0);
  runeLightLow.position.set(0, 0.10 + hammer.position.y, 0);

  // --- glow sprite breathing ------------------------------------------------
  for (let i = 0; i < glowSprites.length; i++) {
    const s = glowSprites[i];
    const f = 0.88 + 0.14 * Math.sin(t * (1.0 + i * 0.19) + i * 1.3);
    const base = s.userData.baseScale || (s.userData.baseScale = s.scale.x);
    s.scale.set(base * f, base * f, 1);
  }

  // ground halo breathes with the runes
  halo.material.opacity = 0.11 + 0.055 * (0.5 + 0.5 * Math.sin(t * 1.1));

  // --- embers ---------------------------------------------------------------
  const arr = emberPosAttr.array;
  for (let i = 0; i < EMBER_COUNT; i++) {
    const d = emberData[i];
    d.age += dt;
    if (d.age >= d.life) {
      spawnEmber(i, false);
      arr[i * 3 + 0] = d.ox;
      arr[i * 3 + 1] = d.oy;
      arr[i * 3 + 2] = d.oz;
      continue;
    }
    const a = d.age;
    const sway = Math.sin(a * d.swayFreq + d.swayPhase) * d.swayAmp;
    const rise = d.vy * a + 0.020 * a * a; // slight buoyant acceleration
    arr[i * 3 + 0] = d.ox + d.vx * a + sway;
    arr[i * 3 + 1] = d.oy + rise;
    arr[i * 3 + 2] = d.oz + d.vz * a + sway * 0.7;
  }
  emberPosAttr.needsUpdate = true;

  // fade ember cloud slightly with the pulse
  emberMat.opacity = 0.72 + 0.22 * (0.5 + 0.5 * Math.sin(t * 1.3));
  emberMat.size = 0.026 + 0.008 * (0.5 + 0.5 * Math.sin(t * 2.0));

  // gem shimmer
  pommelGem.rotation.y += dt * 0.9;

  controls.update();
  renderer.render(scene, camera);
}

// ---------------------------------------------------------------------------
// Resize
// ---------------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

animate();
</script>
</body>
