<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ancient Coin Display</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171714}
canvas{display:block}
#label{position:fixed;left:22px;bottom:18px;color:#d8cfb5;font:12px/1.45 Georgia,serif;letter-spacing:.14em;text-transform:uppercase;pointer-events:none;text-shadow:0 1px 5px #000}
#label span{display:block;color:#8e8775;font-size:9px;letter-spacing:.22em;margin-top:3px}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">Coins of the Ancient World<span>Curated study collection</span></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171714);
scene.fog = new THREE.FogExp2(0x171714, 0.018);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(10.8, 13.5, 15.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.25, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.42;
controls.minDistance = 11;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.475;

const hemi = new THREE.HemisphereLight(0xc9d1ce, 0x30271d, 1.3);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe8c5, 4.8);
key.position.set(-7, 14, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -12;
key.shadow.camera.right = 12;
key.shadow.camera.top = 12;
key.shadow.camera.bottom = -12;
key.shadow.camera.near = 1;
key.shadow.camera.far = 35;
key.shadow.bias = -0.00025;
scene.add(key);

const fill = new THREE.PointLight(0x9bb6c8, 42, 35, 2);
fill.position.set(9, 7, -8);
scene.add(fill);

const rimLight = new THREE.PointLight(0xffb56b, 28, 26, 2);
rimLight.position.set(-10, 4, -7);
scene.add(rimLight);

const floorMat = new THREE.MeshStandardMaterial({ color: 0x25231e, roughness: 0.91, metalness: 0.02 });
const floor = new THREE.Mesh(new THREE.CircleGeometry(32, 96), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.74;
floor.receiveShadow = true;
scene.add(floor);

const tray = new THREE.Group();
tray.rotation.y = -0.035;
scene.add(tray);

const woodMat = new THREE.MeshStandardMaterial({ color: 0x3b2519, roughness: 0.48, metalness: 0.02 });
const woodEdgeMat = new THREE.MeshStandardMaterial({ color: 0x261711, roughness: 0.38 });
const feltMat = new THREE.MeshStandardMaterial({ color: 0x29483f, roughness: 0.98, metalness: 0 });
const recessMat = new THREE.MeshStandardMaterial({ color: 0x142a25, roughness: 1 });
const lipMat = new THREE.MeshStandardMaterial({ color: 0x1d3932, roughness: 0.96 });

const base = new THREE.Mesh(new RoundedBoxGeometry(16.6, 0.75, 11.2, 5, 0.34), woodMat);
base.position.y = -0.28;
base.castShadow = true;
base.receiveShadow = true;
tray.add(base);

const lowerEdge = new THREE.Mesh(new RoundedBoxGeometry(16.75, 0.26, 11.35, 5, 0.24), woodEdgeMat);
lowerEdge.position.y = -0.57;
lowerEdge.castShadow = true;
tray.add(lowerEdge);

const felt = new THREE.Mesh(new RoundedBoxGeometry(15.7, 0.16, 10.3, 4, 0.23), feltMat);
felt.position.y = 0.14;
felt.receiveShadow = true;
tray.add(felt);

function rail(x, z, w, d) {
  const mesh = new THREE.Mesh(new RoundedBoxGeometry(w, 0.5, d, 4, 0.17), woodMat);
  mesh.position.set(x, 0.27, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  tray.add(mesh);
}
rail(0, -5.22, 16.35, 0.48);
rail(0, 5.22, 16.35, 0.48);
rail(-8.02, 0, 0.48, 10.15);
rail(8.02, 0, 0.48, 10.15);

const brassMat = new THREE.MeshStandardMaterial({ color: 0xa88241, roughness: 0.35, metalness: 0.74 });
const plaque = new THREE.Mesh(new RoundedBoxGeometry(3.65, 0.08, 0.38, 3, 0.06), brassMat);
plaque.position.set(0, 0.58, 5.3);
plaque.castShadow = true;
tray.add(plaque);

const coinMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x8b6536, roughness: 0.48, metalness: 0.82 }),
  new THREE.MeshStandardMaterial({ color: 0x79736a, roughness: 0.39, metalness: 0.88 }),
  new THREE.MeshStandardMaterial({ color: 0x96733c, roughness: 0.55, metalness: 0.78 }),
  new THREE.MeshStandardMaterial({ color: 0x5f665e, roughness: 0.54, metalness: 0.76 }),
  new THREE.MeshStandardMaterial({ color: 0xaa8952, roughness: 0.44, metalness: 0.84 })
];

const reliefMaterials = coinMaterials.map(m => new THREE.MeshStandardMaterial({
  color: m.color.clone().multiplyScalar(1.1),
  roughness: Math.min(0.7, m.roughness + 0.05),
  metalness: m.metalness
}));

function seeded(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}

function tubeLine(points, radius, material) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(8, points.length * 5), radius, 7, false), material);
  mesh.castShadow = true;
  return mesh;
}

function addBeads(group, radius, y, material, count = 28) {
  const beadGeo = new THREE.SphereGeometry(radius * 0.025, 7, 5);
  for (let i = 0; i < count; i++) {
    const a = i / count * Math.PI * 2;
    const bead = new THREE.Mesh(beadGeo, material);
    bead.position.set(Math.cos(a) * radius * 0.83, y, Math.sin(a) * radius * 0.83);
    bead.scale.y = 0.48;
    bead.castShadow = true;
    group.add(bead);
  }
}

function addPortrait(group, r, y, material) {
  const head = new THREE.Mesh(new THREE.SphereGeometry(r * 0.23, 20, 12, 0, Math.PI * 2, 0, Math.PI * 0.53), material);
  head.scale.set(0.75, 0.27, 1);
  head.rotation.x = Math.PI / 2;
  head.position.set(-r * 0.05, y + r * 0.018, -r * 0.08);
  head.castShadow = true;
  group.add(head);

  const nose = tubeLine([
    new THREE.Vector3(r * 0.04, y, -r * 0.08),
    new THREE.Vector3(r * 0.20, y + r * 0.015, -r * 0.04),
    new THREE.Vector3(r * 0.10, y, r * 0.01)
  ], r * 0.035, material);
  group.add(nose);

  const neck = tubeLine([
    new THREE.Vector3(-r * 0.12, y, r * 0.08),
    new THREE.Vector3(-r * 0.12, y, r * 0.27),
    new THREE.Vector3(r * 0.16, y, r * 0.34)
  ], r * 0.055, material);
  group.add(neck);

  for (let i = 0; i < 7; i++) {
    const a = -1.05 + i * 0.32;
    const curl = new THREE.Mesh(new THREE.TorusGeometry(r * 0.055, r * 0.022, 6, 12, Math.PI * 1.65), material);
    curl.rotation.x = Math.PI / 2;
    curl.rotation.z = a;
    curl.position.set(-r * 0.16 + Math.cos(a) * r * 0.2, y + r * 0.012, -r * 0.08 + Math.sin(a) * r * 0.24);
    curl.castShadow = true;
    group.add(curl);
  }
}

function addLaurel(group, r, y, material) {
  for (const side of [-1, 1]) {
    const points = [];
    for (let i = 0; i <= 10; i++) {
      const t = i / 10;
      points.push(new THREE.Vector3(side * r * (0.18 + 0.48 * Math.sin(t * Math.PI * 0.8)), y, r * (0.55 - t * 1.08)));
    }
    group.add(tubeLine(points, r * 0.022, material));
    for (let i = 1; i < 9; i++) {
      const t = i / 10;
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(r * 0.075, 10, 6), material);
      leaf.scale.set(0.42, 0.18, 1);
      leaf.rotation.y = side * (0.55 + t * 0.2);
      leaf.position.set(side * r * (0.22 + 0.47 * Math.sin(t * Math.PI * 0.8)), y, r * (0.55 - t * 1.08));
      leaf.castShadow = true;
      group.add(leaf);
    }
  }
}

function addTemple(group, r, y, material) {
  const barGeo = new THREE.BoxGeometry(r * 1.05, r * 0.055, r * 0.075);
  const bars = [
    [0, 0, -r * 0.43, 1],
    [0, 0, r * 0.38, 1],
    [0, 0, -r * 0.25, 0.85]
  ];
  for (const b of bars) {
    const mesh = new THREE.Mesh(barGeo, material);
    mesh.scale.x = b[3];
    mesh.position.set(b[0], y, b[2]);
    mesh.castShadow = true;
    group.add(mesh);
  }
  const columnGeo = new THREE.CylinderGeometry(r * 0.035, r * 0.045, r * 0.62, 9);
  for (let i = -2; i <= 2; i++) {
    const col = new THREE.Mesh(columnGeo, material);
    col.rotation.x = Math.PI / 2;
    col.position.set(i * r * 0.2, y, r * 0.06);
    col.castShadow = true;
    group.add(col);
  }
  const roofShape = new THREE.Shape();
  roofShape.moveTo(-r * 0.58, 0);
  roofShape.lineTo(0, r * 0.28);
  roofShape.lineTo(r * 0.58, 0);
  roofShape.closePath();
  const roof = new THREE.Mesh(new THREE.ExtrudeGeometry(roofShape, { depth: r * 0.045, bevelEnabled: false }), material);
  roof.rotation.x = Math.PI / 2;
  roof.position.set(0, y + r * 0.02, -r * 0.29);
  roof.castShadow = true;
  group.add(roof);
}

function addSun(group, r, y, material) {
  const center = new THREE.Mesh(new THREE.SphereGeometry(r * 0.18, 18, 8), material);
  center.scale.y = 0.22;
  center.position.y = y;
  center.castShadow = true;
  group.add(center);
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    group.add(tubeLine([
      new THREE.Vector3(Math.cos(a) * r * 0.24, y, Math.sin(a) * r * 0.24),
      new THREE.Vector3(Math.cos(a) * r * 0.56, y, Math.sin(a) * r * 0.56)
    ], r * 0.026, material));
  }
}

function addHorse(group, r, y, material) {
  const body = new THREE.Mesh(new THREE.SphereGeometry(r * 0.22, 16, 9), material);
  body.scale.set(1.65, 0.25, 0.72);
  body.position.set(-r * 0.05, y, 0);
  body.castShadow = true;
  group.add(body);
  group.add(tubeLine([
    new THREE.Vector3(r * 0.17, y, -r * 0.03),
    new THREE.Vector3(r * 0.31, y, -r * 0.28),
    new THREE.Vector3(r * 0.45, y, -r * 0.23)
  ], r * 0.055, material));
  for (const x of [-0.27, 0.08]) {
    for (const dir of [-1, 1]) {
      group.add(tubeLine([
        new THREE.Vector3(r * x, y, r * 0.08),
        new THREE.Vector3(r * (x + dir * 0.08), y, r * 0.34),
        new THREE.Vector3(r * (x + dir * 0.18), y, r * 0.45)
      ], r * 0.025, material));
    }
  }
}

function addGlyphs(group, r, y, material, seed) {
  const rand = seeded(seed);
  const glyphs = 7;
  for (let i = 0; i < glyphs; i++) {
    const a = -1.9 + i * 0.62;
    const cx = Math.cos(a) * r * 0.67;
    const cz = Math.sin(a) * r * 0.67;
    const tangent = a + Math.PI / 2;
    const len = r * (0.09 + rand() * 0.07);
    const line = tubeLine([
      new THREE.Vector3(cx - Math.cos(tangent) * len, y, cz - Math.sin(tangent) * len),
      new THREE.Vector3(cx + Math.cos(tangent) * len, y, cz + Math.sin(tangent) * len)
    ], r * 0.018, material);
    group.add(line);
  }
}

function createCoin(x, z, r, type, matIndex, seed, angle = 0) {
  const group = new THREE.Group();
  group.position.set(x, 0, z);
  group.rotation.y = angle;
  tray.add(group);

  const well = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.13, r * 1.13, 0.11, 64), recessMat);
  well.position.y = 0.24;
  well.receiveShadow = true;
  group.add(well);

  const lip = new THREE.Mesh(new THREE.TorusGeometry(r * 1.09, 0.055, 10, 64), lipMat);
  lip.rotation.x = Math.PI / 2;
  lip.position.y = 0.305;
  group.add(lip);

  const rand = seeded(seed);
  const coinShape = new THREE.Shape();
  const segments = 72;
  for (let i = 0; i <= segments; i++) {
    const a = i / segments * Math.PI * 2;
    const jitter = 1 + (rand() - 0.5) * 0.035 + Math.sin(a * (5 + seed % 4)) * 0.009;
    const px = Math.cos(a) * r * jitter;
    const py = Math.sin(a) * r * jitter;
    if (i === 0) coinShape.moveTo(px, py);
    else coinShape.lineTo(px, py);
  }
  const bodyGeo = new THREE.ExtrudeGeometry(coinShape, {
    depth: r * 0.13,
    bevelEnabled: true,
    bevelSegments: 2,
    bevelSize: r * 0.035,
    bevelThickness: r * 0.025,
    curveSegments: 64
  });
  bodyGeo.rotateX(Math.PI / 2);
  bodyGeo.translate(0, r * 0.105 + 0.34, 0);
  const body = new THREE.Mesh(bodyGeo, coinMaterials[matIndex]);
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  const topY = 0.34 + r * 0.19;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r * 0.77, r * 0.024, 8, 64), reliefMaterials[matIndex]);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = topY;
  ring.castShadow = true;
  group.add(ring);

  addBeads(group, r, topY + r * 0.014, reliefMaterials[matIndex], Math.round(22 + r * 7));
  if (type === 0) addPortrait(group, r, topY + r * 0.025, reliefMaterials[matIndex]);
  if (type === 1) addLaurel(group, r, topY + r * 0.025, reliefMaterials[matIndex]);
  if (type === 2) addTemple(group, r, topY + r * 0.025, reliefMaterials[matIndex]);
  if (type === 3) addSun(group, r, topY + r * 0.025, reliefMaterials[matIndex]);
  if (type === 4) addHorse(group, r, topY + r * 0.025, reliefMaterials[matIndex]);
  addGlyphs(group, r, topY + r * 0.028, reliefMaterials[matIndex], seed + 17);
}

const coins = [
  [-5.75, -3.35, 1.10, 0, 2, 11, -0.18],
  [-1.95, -3.35, 0.91, 3, 1, 23, 0.14],
  [ 1.90, -3.35, 1.18, 2, 0, 37, -0.09],
  [ 5.78, -3.35, 0.96, 1, 3, 41, 0.25],
  [-5.75,  0.00, 0.92, 4, 3, 53, -0.20],
  [-1.95,  0.00, 1.18, 0, 1, 67, 0.08],
  [ 1.90,  0.00, 0.98, 1, 4, 71, -0.22],
  [ 5.78,  0.00, 1.14, 3, 2, 89, 0.12],
  [-5.75,  3.35, 1.13, 2, 4, 97, 0.17],
  [-1.95,  3.35, 0.96, 4, 0, 103, -0.13],
  [ 1.90,  3.35, 1.08, 0, 3, 127, 0.22],
  [ 5.78,  3.35, 0.88, 1, 1, 139, -0.17]
];
for (const c of coins) createCoin(...c);

const dustGeo = new THREE.BufferGeometry();
const dustCount = 420;
const dustPos = new Float32Array(dustCount * 3);
const dustRand = seeded(9001);
for (let i = 0; i < dustCount; i++) {
  const a = dustRand() * Math.PI * 2;
  const radius = 5 + dustRand() * 20;
  dustPos[i * 3] = Math.cos(a) * radius;
  dustPos[i * 3 + 1] = 1 + dustRand() * 12;
  dustPos[i * 3 + 2] = Math.sin(a) * radius;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0xc9b98f,
  size: 0.025,
  transparent: true,
  opacity: 0.22,
  depthWrite: false
}));
scene.add(dust);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  dust.rotation.y = t * 0.008;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
