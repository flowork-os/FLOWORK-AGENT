<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geodesic Glass Terrarium</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #11151a;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11161b);
scene.fog = new THREE.Fog(0x11161b, 9, 18);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(5.2, 3.6, 6.2);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 4.5;
controls.maxDistance = 11;
controls.target.set(0, -0.25, 0);

scene.add(new THREE.HemisphereLight(0xbfd5df, 0x251c17, 1.65));

const keyLight = new THREE.DirectionalLight(0xffe2bc, 3.4);
keyLight.position.set(-4, 7, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -4;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const rimLight = new THREE.PointLight(0x8ab8ff, 2.2, 8, 2);
rimLight.position.set(3, 2.8, -3.2);
scene.add(rimLight);

const terrarium = new THREE.Group();
scene.add(terrarium);

const brassMaterial = new THREE.MeshStandardMaterial({
  color: 0xb88945,
  metalness: 0.82,
  roughness: 0.24
});

const darkBrassMaterial = new THREE.MeshStandardMaterial({
  color: 0x6d4828,
  metalness: 0.72,
  roughness: 0.3
});

const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xb9e1dc,
  metalness: 0,
  roughness: 0.08,
  transmission: 0.78,
  transparent: true,
  opacity: 0.34,
  thickness: 0.045,
  ior: 1.45,
  side: THREE.DoubleSide,
  depthWrite: false
});

const glassGeometry = new THREE.IcosahedronGeometry(2.48, 1);
const glassShell = new THREE.Mesh(glassGeometry, glassMaterial);
glassShell.renderOrder = 2;
terrarium.add(glassShell);

const edgeGeometry = new THREE.EdgesGeometry(glassGeometry, 1);
const edgePositions = edgeGeometry.attributes.position.array;

function makeCylinderBetween(startPoint, endPoint, radius, material) {
  const delta = new THREE.Vector3().subVectors(endPoint, startPoint);
  const length = delta.length();
  const cylinder = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, length, 8),
    material
  );
  cylinder.position.copy(startPoint).add(endPoint).multiplyScalar(0.5);
  cylinder.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    delta.normalize()
  );
  cylinder.castShadow = true;
  cylinder.receiveShadow = true;
  return cylinder;
}

for (let edgeIndex = 0; edgeIndex < edgePositions.length; edgeIndex += 6) {
  const edgeStart = new THREE.Vector3(
    edgePositions[edgeIndex],
    edgePositions[edgeIndex + 1],
    edgePositions[edgeIndex + 2]
  );
  const edgeEnd = new THREE.Vector3(
    edgePositions[edgeIndex + 3],
    edgePositions[edgeIndex + 4],
    edgePositions[edgeIndex + 5]
  );
  const frameEdge = makeCylinderBetween(edgeStart, edgeEnd, 0.027, brassMaterial);
  frameEdge.renderOrder = 3;
  terrarium.add(frameEdge);
}

const baseRing = new THREE.Mesh(
  new THREE.TorusGeometry(1.48, 0.055, 10, 64),
  brassMaterial
);
baseRing.rotation.x = Math.PI / 2;
baseRing.position.y = -2.02;
baseRing.castShadow = true;
terrarium.add(baseRing);

const soilMaterial = new THREE.MeshStandardMaterial({
  color: 0x3d2a1e,
  roughness: 1
});

const soil = new THREE.Mesh(
  new THREE.CylinderGeometry(1.35, 1.4, 0.28, 48),
  soilMaterial
);
soil.position.y = -1.91;
soil.castShadow = true;
soil.receiveShadow = true;
terrarium.add(soil);

const soilTopMaterial = new THREE.MeshStandardMaterial({
  color: 0x513827,
  roughness: 1
});

const soilTop = new THREE.Mesh(
  new THREE.CylinderGeometry(1.32, 1.32, 0.025, 48),
  soilTopMaterial
);
soilTop.position.y = -1.76;
soilTop.receiveShadow = true;
terrarium.add(soilTop);

const pebbleMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x8a8173, roughness: 0.9 }),
  new THREE.MeshStandardMaterial({ color: 0xb1a48d, roughness: 0.86 }),
  new THREE.MeshStandardMaterial({ color: 0x70695e, roughness: 0.92 }),
  new THREE.MeshStandardMaterial({ color: 0xc4b89e, roughness: 0.88 })
];

const pebbleGeometry = new THREE.IcosahedronGeometry(0.16, 1);
const pebbleData = [
  [-0.84, -1.59, 0.16, 1.5, 0.75, 0.9],
  [-0.48, -1.62, -0.45, 1.1, 0.68, 0.8],
  [0.62, -1.61, -0.35, 1.35, 0.8, 0.7],
  [0.92, -1.59, 0.27, 1.7, 0.7, 1.1],
  [0.35, -1.62, 0.65, 1.05, 0.65, 0.8],
  [-0.18, -1.62, 0.82, 1.6, 0.75, 0.9],
  [-0.96, -1.6, -0.37, 1.2, 0.7, 1.1]
];

pebbleData.forEach((data, pebbleIndex) => {
  const pebble = new THREE.Mesh(pebbleGeometry, pebbleMaterials[pebbleIndex % pebbleMaterials.length]);
  pebble.position.set(data[0], data[1], data[2]);
  pebble.scale.set(data[3], data[4], data[5]);
  pebble.rotation.set(pebbleIndex * 0.7, pebbleIndex * 0.45, pebbleIndex * 0.25);
  pebble.castShadow = true;
  pebble.receiveShadow = true;
  terrarium.add(pebble);
});

const stemMaterial = new THREE.MeshStandardMaterial({
  color: 0x4d6b37,
  roughness: 0.75
});

const stem = new THREE.Mesh(
  new THREE.CylinderGeometry(0.065, 0.09, 0.62, 10),
  stemMaterial
);
stem.position.set(0, -1.35, 0);
stem.castShadow = true;
terrarium.add(stem);

const leafMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x789c52, roughness: 0.68 }),
  new THREE.MeshStandardMaterial({ color: 0x91ad68, roughness: 0.65 }),
  new THREE.MeshStandardMaterial({ color: 0x5f8246, roughness: 0.72 }),
  new THREE.MeshStandardMaterial({ color: 0xa4bb79, roughness: 0.62 })
];

const leafGeometry = new THREE.SphereGeometry(1, 16, 10);
const leafCount = 13;

for (let leafIndex = 0; leafIndex < leafCount; leafIndex++) {
  const leafAngle = (leafIndex / leafCount) * Math.PI * 2;
  const leafRadius = leafIndex < 7 ? 0.24 : 0.13;
  const leafHeight = leafIndex < 7 ? -1.38 : -1.05;
  const leaf = new THREE.Mesh(leafGeometry, leafMaterials[leafIndex % leafMaterials.length]);
  leaf.position.set(
    Math.cos(leafAngle) * leafRadius,
    leafHeight + Math.sin(leafIndex * 1.7) * 0.035,
    Math.sin(leafAngle) * leafRadius
  );
  leaf.scale.set(
    leafIndex < 7 ? 0.16 : 0.125,
    leafIndex < 7 ? 0.48 : 0.39,
    leafIndex < 7 ? 0.095 : 0.075
  );
  leaf.rotation.y = -leafAngle;
  leaf.rotation.z = leafIndex < 7 ? Math.cos(leafAngle) * 0.48 : Math.cos(leafAngle) * 0.3;
  leaf.castShadow = true;
  leaf.receiveShadow = true;
  terrarium.add(leaf);
}

const succulentCore = new THREE.Mesh(
  new THREE.SphereGeometry(0.25, 20, 12),
  new THREE.MeshStandardMaterial({ color: 0x668747, roughness: 0.68 })
);
succulentCore.position.set(0, -0.99, 0);
succulentCore.scale.set(1, 0.8, 1);
succulentCore.castShadow = true;
terrarium.add(succulentCore);

const innerGlow = new THREE.PointLight(0xffc777, 0.55, 3.5, 2);
innerGlow.position.set(-0.7, -0.25, 0.9);
terrarium.add(innerGlow);

const pedestalMaterial = new THREE.MeshStandardMaterial({
  color: 0x242a2c,
  roughness: 0.72,
  metalness: 0.18
});

const pedestal = new THREE.Mesh(
  new THREE.CylinderGeometry(1.72, 1.9, 0.25, 64),
  pedestalMaterial
);
pedestal.position.y = -2.7;
pedestal.castShadow = true;
pedestal.receiveShadow = true;
scene.add(pedestal);

const pedestalTrim = new THREE.Mesh(
  new THREE.TorusGeometry(1.78, 0.035, 8, 64),
  brassMaterial
);
pedestalTrim.rotation.x = Math.PI / 2;
pedestalTrim.position.y = -2.565;
pedestalTrim.castShadow = true;
scene.add(pedestalTrim);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x0d1114,
  roughness: 0.9,
  metalness: 0.05
});

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(18, 64),
  floorMaterial
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.84;
floor.receiveShadow = true;
scene.add(floor);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
