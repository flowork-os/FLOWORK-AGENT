<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro Gumball Machine</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f6c5a3;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6c5a3);
scene.fog = new THREE.Fog(0xf6c5a3, 11, 22);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(6.8, 4.8, 8.4);
camera.lookAt(0, 2.7, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.15;
controls.minDistance = 6;
controls.maxDistance = 14;
controls.target.set(0, 2.75, 0);

scene.add(new THREE.HemisphereLight(0xffe7d0, 0x8b4963, 2.2));

const keyLight = new THREE.DirectionalLight(0xfff2dc, 4.2);
keyLight.position.set(-4, 9, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 9;
keyLight.shadow.camera.bottom = -3;
scene.add(keyLight);

const rimLight = new THREE.PointLight(0x79d9ff, 13, 12, 2);
rimLight.position.set(4, 5.5, -3);
scene.add(rimLight);

const fillLight = new THREE.PointLight(0xff7d91, 10, 10, 2);
fillLight.position.set(-4, 2.8, 4);
scene.add(fillLight);

const redMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xd8273f,
  metalness: 0.28,
  roughness: 0.19,
  clearcoat: 0.85,
  clearcoatRoughness: 0.12
});

const redDarkMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x94152d,
  metalness: 0.3,
  roughness: 0.22,
  clearcoat: 0.7
});

const chromeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xdbe7eb,
  metalness: 0.96,
  roughness: 0.12,
  clearcoat: 0.8,
  clearcoatRoughness: 0.08
});

const goldMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xffc94f,
  metalness: 0.82,
  roughness: 0.17,
  clearcoat: 0.65
});

const darkMaterial = new THREE.MeshStandardMaterial({
  color: 0x221a27,
  metalness: 0.35,
  roughness: 0.3
});

const rubberMaterial = new THREE.MeshStandardMaterial({
  color: 0x3c1830,
  roughness: 0.48
});

function addMesh(geometry, material, position, rotation, castShadow = true, receiveShadow = true) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(position[0], position[1], position[2]);
  if (rotation) mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = castShadow;
  mesh.receiveShadow = receiveShadow;
  scene.add(mesh);
  return mesh;
}

addMesh(new THREE.CylinderGeometry(1.72, 1.82, 0.28, 64), redDarkMaterial, [0, 0.2, 0]);
addMesh(new THREE.CylinderGeometry(1.54, 1.63, 1.25, 64), redMaterial, [0, 0.92, 0]);
addMesh(new THREE.CylinderGeometry(1.32, 1.45, 0.22, 64), redDarkMaterial, [0, 1.58, 0]);
addMesh(new THREE.CylinderGeometry(1.18, 1.18, 0.12, 64), goldMaterial, [0, 1.72, 0]);

addMesh(new THREE.TorusGeometry(1.66, 0.075, 16, 64), chromeMaterial, [0, 0.31, 0], [Math.PI / 2, 0, 0]);
addMesh(new THREE.TorusGeometry(1.57, 0.055, 16, 64), goldMaterial, [0, 1.47, 0], [Math.PI / 2, 0, 0]);
addMesh(new THREE.TorusGeometry(1.25, 0.07, 16, 64), chromeMaterial, [0, 1.65, 0], [Math.PI / 2, 0, 0]);

const globeRadius = 2.28;
const globeCenterY = 3.7;

const glassMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xb9efff,
  metalness: 0,
  roughness: 0.06,
  transmission: 0.72,
  thickness: 0.08,
  ior: 1.45,
  transparent: true,
  opacity: 0.34,
  depthWrite: false,
  side: THREE.DoubleSide
});

const globe = addMesh(
  new THREE.SphereGeometry(globeRadius, 96, 64),
  glassMaterial,
  [0, globeCenterY, 0],
  null,
  false,
  false
);
globe.renderOrder = 4;

const globeHighlightMaterial = new THREE.MeshBasicMaterial({
  color: 0xffffff,
  transparent: true,
  opacity: 0.2,
  depthWrite: false
});
const highlightArc = addMesh(
  new THREE.TorusGeometry(1.88, 0.028, 10, 64, Math.PI * 0.72),
  globeHighlightMaterial,
  [-0.38, 4.52, 1.77],
  [0.34, -0.2, -0.38],
  false,
  false
);
highlightArc.renderOrder = 5;

const candyColors = [0xff4d6d, 0xffc928, 0x40c9ff, 0x8f63ff, 0x54d66a, 0xff8a3d, 0xf15bd7, 0x20d6bb];
let seed = 19;
function randomValue() {
  seed = (seed * 1664525 + 1013904223) % 4294967296;
  return seed / 4294967296;
}

for (let candyIndex = 0; candyIndex < 62; candyIndex += 1) {
  const angle = randomValue() * Math.PI * 2;
  const radial = Math.sqrt(randomValue()) * 1.76;
  const height = 1.85 + randomValue() * 2.55;
  const horizontalLimit = Math.sqrt(Math.max(0.2, globeRadius * globeRadius - (height - globeCenterY) * (height - globeCenterY)));
  const usableRadial = Math.min(radial, horizontalLimit - 0.12);
  const candyX = Math.cos(angle) * usableRadial;
  const candyZ = Math.sin(angle) * usableRadial;
  const candyY = height;
  const candyRadius = 0.18 + randomValue() * 0.055;
  const candyMaterial = new THREE.MeshPhysicalMaterial({
    color: candyColors[candyIndex % candyColors.length],
    metalness: 0.03,
    roughness: 0.18,
    clearcoat: 0.75,
    clearcoatRoughness: 0.1
  });
  const candy = addMesh(new THREE.SphereGeometry(candyRadius, 24, 16), candyMaterial, [candyX, candyY, candyZ], null, true, false);
  candy.renderOrder = 2;
}

addMesh(new THREE.CylinderGeometry(1.12, 1.12, 0.16, 64), chromeMaterial, [0, 1.78, 0]);
addMesh(new THREE.CylinderGeometry(0.82, 0.94, 0.18, 64), goldMaterial, [0, 5.99, 0]);
addMesh(new THREE.SphereGeometry(0.88, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2), chromeMaterial, [0, 6.03, 0]);
addMesh(new THREE.TorusGeometry(0.84, 0.055, 16, 64), goldMaterial, [0, 6.04, 0], [Math.PI / 2, 0, 0]);

const coinPlate = addMesh(new THREE.CylinderGeometry(0.34, 0.34, 0.075, 48), chromeMaterial, [0, 1.04, 1.58], [Math.PI / 2, 0, 0]);
addMesh(new THREE.BoxGeometry(0.28, 0.075, 0.035), darkMaterial, [0, 1.05, 1.625]);

const knobStem = addMesh(new THREE.CylinderGeometry(0.12, 0.12, 0.23, 32), chromeMaterial, [0, 0.77, 1.65], [Math.PI / 2, 0, 0]);
addMesh(new THREE.TorusGeometry(0.3, 0.075, 18, 48), chromeMaterial, [0, 0.77, 1.8], [Math.PI / 2, 0, 0]);
addMesh(new THREE.CylinderGeometry(0.23, 0.23, 0.08, 48), chromeMaterial, [0, 0.77, 1.83], [Math.PI / 2, 0, 0]);

addMesh(new THREE.BoxGeometry(0.9, 0.45, 0.16), redDarkMaterial, [0, 0.42, 1.43]);
addMesh(new THREE.BoxGeometry(0.72, 0.27, 0.08), darkMaterial, [0, 0.45, 1.54]);
addMesh(new THREE.TorusGeometry(0.32, 0.045, 12, 40), chromeMaterial, [0, 0.47, 1.59], [Math.PI / 2, 0, 0]);
addMesh(new THREE.SphereGeometry(0.055, 16, 12), goldMaterial, [-0.34, 0.47, 1.61]);
addMesh(new THREE.SphereGeometry(0.055, 16, 12), goldMaterial, [0.34, 0.47, 1.61]);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xe48c78,
  roughness: 0.82,
  metalness: 0
});
addMesh(new THREE.CircleGeometry(18, 64), floorMaterial, [0, 0.035, 0], [-Math.PI / 2, 0, 0], false, true);

const backdropMaterial = new THREE.MeshStandardMaterial({
  color: 0xf3b198,
  roughness: 0.9
});
addMesh(new THREE.PlaneGeometry(30, 16), backdropMaterial, [0, 7, -5.8], [0, 0, 0], false, false);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
