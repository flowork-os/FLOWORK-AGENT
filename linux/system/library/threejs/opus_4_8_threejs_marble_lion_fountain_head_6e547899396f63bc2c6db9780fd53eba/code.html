<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14151a);
scene.fog = new THREE.Fog(0x14151a, 8.5, 20);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(0.9, 1.35, 4.15);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.target.set(0, 1.06, 0);
controls.minDistance = 2.1;
controls.maxDistance = 9.0;

/* ============================================================
   LIGHTING — museum plinth studio
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xc9d6e6, 0x2a2622, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3e2, 2.35);
key.position.set(3.1, 5.0, 3.4);

key.shadow.mapSize.set(2048, 2048);

key.shadow.camera.far = 18;

key.shadow.camera.right = 3.2;

key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.018;
key.shadow.radius = 3.2;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fb6d4, 0.62);
fill.position.set(-4.0, 1.9, 2.3);
scene.add(fill);

const rim = new THREE.SpotLight(0xdce6ff, 26.0, 16, Math.PI * 0.30, 0.65, 1.6);
rim.position.set(-1.9, 3.6, -4.4);
rim.target.position.set(0, 1.15, 0);
scene.add(rim);
scene.add(rim.target);

const bounce = new THREE.PointLight(0xffe9cf, 3.2, 7.0, 2.0);
bounce.position.set(0.2, 0.28, 2.0);
scene.add(bounce);

/* ============================================================
   SHADOW-ONLY GROUND
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   PROCEDURAL MARBLE MATERIAL (veining via onBeforeCompile)
   ============================================================ */
const MARBLE_BASE   = new THREE.Color(0xf2efe7);
const MARBLE_SHADE  = new THREE.Color(0xd8d3c8);
const VEIN_GREY     = new THREE.Color(0x8d8f92);
const VEIN_DARK     = new THREE.Color(0x5f6266);

const NOISE_GLSL = /* glsl */`
  vec3 mod289v(vec3 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
  vec4 mod289v4(vec4 x){ return x - floor(x * (1.0/289.0)) * 289.0; }
  vec4 permute4(vec4 x){ return mod289v4(((x*34.0)+1.0)*x); }
  vec4 taylorInvSqrt4(vec4 r){ return 1.79284291400159 - 0.85373472095314 * r; }

  float snoise(vec3 v){
    const vec2 C = vec2(1.0/6.0, 1.0/3.0);
    const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
    vec3 i  = floor(v + dot(v, C.yyy));
    vec3 x0 = v - i + dot(i, C.xxx);
    vec3 g = step(x0.yzx, x0.xyz);
    vec3 l = 1.0 - g;
    vec3 i1 = min(g.xyz, l.zxy);
    vec3 i2 = max(g.xyz, l.zxy);
    vec3 x1 = x0 - i1 + C.xxx;
    vec3 x2 = x0 - i2 + C.yyy;
    vec3 x3 = x0 - D.yyy;
    i = mod289v(i);
    vec4 p = permute4( permute4( permute4(
               i.z + vec4(0.0, i1.z, i2.z, 1.0))
             + i.y + vec4(0.0, i1.y, i2.y, 1.0))
             + i.x + vec4(0.0, i1.x, i2.x, 1.0));
    float n_ = 0.142857142857;
    vec3 ns = n_ * D.wyz - D.xzx;
    vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
    vec4 x_ = floor(j * ns.z);
    vec4 y_ = floor(j - 7.0 * x_);
    vec4 x = x_ * ns.x + ns.yyyy;
    vec4 y = y_ * ns.x + ns.yyyy;
    vec4 h = 1.0 - abs(x) - abs(y);
    vec4 b0 = vec4(x.xy, y.xy);
    vec4 b1 = vec4(x.zw, y.zw);
    vec4 s0 = floor(b0)*2.0 + 1.0;
    vec4 s1 = floor(b1)*2.0 + 1.0;
    vec4 sh = -step(h, vec4(0.0));
    vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
    vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
    vec3 p0 = vec3(a0.xy, h.x);
    vec3 p1 = vec3(a0.zw, h.y);
    vec3 p2 = vec3(a1.xy, h.z);
    vec3 p3 = vec3(a1.zw, h.w);
    vec4 norm = taylorInvSqrt4(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
    vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
    m = m * m;
    return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
  }

  float fbm3(vec3 p){
    float f = 0.0, a = 0.5;
    for (int i = 0; i < 5; i++) { f += a * snoise(p); p *= 2.03; a *= 0.5; }
    return f;
  }
`;

/**
 * Creates a marble material.
 * opts.rough      : base roughness (polished ~0.16, chisel-rough ~0.72)
 * opts.veinAmt    : strength of the diagonal grey veining
 * opts.cheekBias  : if > 0, veining is concentrated on the +X cheek (diagonal run)
 * opts.chisel     : 0..1 amount of procedural chisel-tooth roughness breakup
 * opts.tint       : optional base color override
 */
function makeMarble(opts = {}) {
  const {
    rough = 0.34,
    veinAmt = 0.75,
    cheekBias = 0.0,
    chisel = 0.35,
    tint = MARBLE_BASE,
    metal = 0.0
  } = opts;

  const mat = new THREE.MeshStandardMaterial({
    color: tint,
    roughness: rough,
    metalness: metal,
    envMapIntensity: 0.55
  });

  mat.userData.uniforms = null;

  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uVeinAmt   = { value: veinAmt };
    shader.uniforms.uCheekBias = { value: cheekBias };
    shader.uniforms.uChisel    = { value: chisel };
    shader.uniforms.uBaseRough = { value: rough };
    shader.uniforms.uShade     = { value: MARBLE_SHADE };
    shader.uniforms.uVein      = { value: VEIN_GREY };
    shader.uniforms.uVeinDark  = { value: VEIN_DARK };

    shader.vertexShader = shader.vertexShader
      .replace('#include <common>', `
        #include <common>
        varying vec3 vObjPos;
        varying vec3 vObjNrm;
      `)
      .replace('#include <begin_vertex>', `
        #include <begin_vertex>
        vObjPos = position;
        vObjNrm = normalize(normal);
      `);

    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>', `
        #include <common>
        varying vec3 vObjPos;
        varying vec3 vObjNrm;
        uniform float uVeinAmt;
        uniform float uCheekBias;
        uniform float uChisel;
        uniform float uBaseRough;
        uniform vec3  uShade;
        uniform vec3  uVein;
        uniform vec3  uVeinDark;
        ${NOISE_GLSL}
      `)
      .replace('#include <color_fragment>', `
        #include <color_fragment>
        {
          vec3 p = vObjPos;

          // --- diagonal vein coordinate: sweeps down-right across the face ---
          float diag = (p.x * 0.72 + p.y * -0.58 + p.z * 0.30) * 2.05;

          // warp the vein bands with turbulence so they meander like real Carrara
          float warp  = fbm3(p * 1.35 + vec3(11.3, 4.1, 7.7)) * 1.15;
          float warp2 = fbm3(p * 3.9  + vec3(-3.4, 8.8, 1.2)) * 0.34;
          float bands = sin((diag + warp + warp2) * 3.05);

          // sharp thin veins: ridge function
          float ridge = 1.0 - abs(bands);
          float veinA = smoothstep(0.72, 0.995, ridge);
          float veinB = smoothstep(0.90, 1.0, ridge);

          // secondary hairline network
          float net = fbm3(p * 6.2 + vec3(2.0, -5.0, 9.0));
          float hair = smoothstep(0.42, 0.62, abs(net)) * 0.34;

          // cloudy grey drift in the stone body
          float cloud = fbm3(p * 0.95 + vec3(-6.0, 2.0, 3.0)) * 0.5 + 0.5;

          // cheek concentration mask (right cheek, +X, mid height)
          float cheekMask = 1.0;
          if (uCheekBias > 0.001) {
            float sideX = smoothstep(-0.05, 0.62, p.x);
            float bandY = 1.0 - smoothstep(0.30, 0.95, abs(p.y + 0.02));
            float frontZ = smoothstep(-0.10, 0.55, p.z);
            cheekMask = mix(0.22, 1.55, sideX * bandY * frontZ);
          }

          float veinTotal = clamp((veinA * 0.85 + veinB * 0.75 + hair) * uVeinAmt * cheekMask, 0.0, 1.0);

          vec3 stone = mix(diffuseColor.rgb, uShade, (1.0 - cloud) * 0.42);
          stone = mix(stone, uVein, veinTotal * 0.80);
          stone = mix(stone, uVeinDark, veinB * uVeinAmt * cheekMask * 0.42);

          // faint warm patina in deep recesses (approx by downward normals)
          float recess = smoothstep(0.15, -0.65, vObjNrm.y);
          stone = mix(stone, stone * vec3(0.86, 0.83, 0.77), recess * 0.55);

          diffuseColor.rgb = stone;
        }
      `)
      .replace('#include <roughnessmap_fragment>', `
        #include <roughnessmap_fragment>
        {
          vec3 pr = vObjPos;
          // chisel-tooth micro facets: high frequency, anisotropic-ish
          float tooth = fbm3(pr * 26.0 + vec3(5.5, 1.5, -2.5));
          float coarse = fbm3(pr * 7.0 + vec3(-1.0, 3.0, 6.0));
          // downward / inward facing surfaces read as unpolished chisel recesses
          float recess = smoothstep(0.35, -0.55, vObjNrm.y);
          float rr = uBaseRough
                   + uChisel * (0.30 + 0.22 * tooth + 0.16 * coarse)
                   + recess * 0.22 * uChisel;
          roughnessFactor = clamp(rr, 0.05, 1.0);
        }
      `);

    mat.userData.uniforms = shader.uniforms;
  };

  // ensure unique program per configuration
  mat.customProgramCacheKey = () =>
    'marble_' + rough.toFixed(3) + '_' + veinAmt.toFixed(3) + '_' +
    cheekBias.toFixed(2) + '_' + chisel.toFixed(3);

  return mat;
}

/* material palette */
const matPolished  = makeMarble({ rough: 0.17, veinAmt: 0.60, cheekBias: 1.0, chisel: 0.10 });
const matSkin      = makeMarble({ rough: 0.26, veinAmt: 0.72, cheekBias: 1.0, chisel: 0.22 });
const matMane      = makeMarble({ rough: 0.58, veinAmt: 0.52, cheekBias: 0.0, chisel: 0.85 });
const matManeDeep  = makeMarble({ rough: 0.72, veinAmt: 0.44, cheekBias: 0.0, chisel: 1.0,
                                  tint: new THREE.Color(0xe6e1d6) });
const matRough     = makeMarble({ rough: 0.78, veinAmt: 0.40, cheekBias: 0.0, chisel: 1.0,
                                  tint: new THREE.Color(0xe2ddd2) });
const matTooth     = makeMarble({ rough: 0.10, veinAmt: 0.10, cheekBias: 0.0, chisel: 0.02,
                                  tint: new THREE.Color(0xfbf8f1) });
const matEye       = makeMarble({ rough: 0.13, veinAmt: 0.22, cheekBias: 0.0, chisel: 0.05,
                                  tint: new THREE.Color(0xefece3) });
const matThroat    = makeMarble({ rough: 0.88, veinAmt: 0.30, cheekBias: 0.0, chisel: 1.0,
                                  tint: new THREE.Color(0x8e887d) });
const matPlinth    = makeMarble({ rough: 0.45, veinAmt: 0.85, cheekBias: 0.0, chisel: 0.55,
                                  tint: new THREE.Color(0xdedacf) });

const ALL_MATS = [matPolished, matSkin, matMane, matManeDeep, matRough,
                  matTooth, matEye, matThroat, matPlinth];

/* ============================================================
   SMALL GEOMETRY HELPERS
   ============================================================ */
function addMesh(parent, geo, mat, pos, rot, scale) {
  const m = new THREE.Mesh(geo, mat);
  if (pos)   m.position.set(pos[0], pos[1], pos[2]);
  if (rot)   m.rotation.set(rot[0], rot[1], rot[2]);
  if (scale) {
    if (Array.isArray(scale)) m.scale.set(scale[0], scale[1], scale[2]);
    else m.scale.setScalar(scale);
  }
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

/** Deterministic pseudo-random (so the sculpture is stable across reloads). */
function makeRand(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
const rand = makeRand(20260720);

/** Displace a geometry's vertices with layered value noise -> carved stone feel. */
function chiselGeometry(geo, opts = {}) {
  const {
    amp = 0.012, freq = 7.0, octaves = 3, seed = 1.0,
    axisBias = new THREE.Vector3(1, 1, 1), planar = 0.0
  } = opts;

  geo = geo.toNonIndexed ? geo : geo;
  const pos = geo.attributes.position;
  const nrm = geo.attributes.normal;
  const v = new THREE.Vector3();
  const n = new THREE.Vector3();

  // cheap 3D value noise
  const hash = (x, y, z) => {
    const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7 + seed * 43.3) * 43758.5453;
    return s - Math.floor(s);
  };
  const vnoise = (x, y, z) => {
    const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    const xf = x - xi, yf = y - yi, zf = z - zi;
    const u = xf * xf * (3 - 2 * xf), vv = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
    const lerp = (a, b, t) => a + (b - a) * t;
    const c000 = hash(xi, yi, zi),       c100 = hash(xi + 1, yi, zi);
    const c010 = hash(xi, yi + 1, zi),   c110 = hash(xi + 1, yi + 1, zi);
    const c001 = hash(xi, yi, zi + 1),   c101 = hash(xi + 1, yi, zi + 1);
    const c011 = hash(xi, yi + 1, zi + 1), c111 = hash(xi + 1, yi + 1, zi + 1);
    return lerp(
      lerp(lerp(c000, c100, u), lerp(c010, c110, u), vv),
      lerp(lerp(c001, c101, u), lerp(c011, c111, u), vv),
      w
    ) * 2.0 - 1.0;
  };
  const fbm = (x, y, z) => {
    let f = 0, a = 0.5, fr = 1.0;
    for (let i = 0; i < octaves; i++) {
      f += a * vnoise(x * fr, y * fr, z * fr);
      fr *= 2.07; a *= 0.5;
    }
    return f;
  };

  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    n.fromBufferAttribute(nrm, i);
    let d = fbm(v.x * freq, v.y * freq, v.z * freq);
    if (planar > 0.0) {
      // quantize into flat "chiselled planes"
      const q = Math.round(d * planar) / planar;
      d = d * (1.0 - 0.75) + q * 0.75;
    }
    const k = amp * d;
    pos.setXYZ(
      i,
      v.x + n.x * k * axisBias.x,
      v.y + n.y * k * axisBias.y,
      v.z + n.z * k * axisBias.z
    );
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

/** Mirror a group across X (build one side, get both). */
function mirrorGroup(src) {
  const clone = src.clone(true);
  clone.scale.x *= -1;
  clone.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return clone;
}

/* ============================================================
   THE SCULPTURE
   ============================================================ */
const lion = new THREE.Group();
scene.add(lion);

const head = new THREE.Group();
head.position.y = 1.02;
lion.add(head);

/* ---------- 1. CRANIUM / SKULL MASS ---------- */
{
  const g = new THREE.SphereGeometry(0.50, 96, 72);
  // sculpt the skull: flatten top-back, broaden cheeks, taper toward muzzle
  const p = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const u = v.clone().normalize();

    // broaden the sides (cheek bones) and shorten front-to-back
    v.x *= 1.04 + 0.20 * Math.max(0, -u.y) * Math.abs(u.x);
    v.z *= 0.98;

    // strong flat brow shelf across the forehead front-top
    const browZone = Math.max(0, u.z) * Math.max(0, u.y);
    v.z += browZone * 0.075;
    v.y += browZone * 0.03;

    // flatten the crown a touch (carved block feel)
    if (u.y > 0.55) v.y -= (u.y - 0.55) * 0.16;

    // narrow the jaw underside
    if (u.y < -0.35) {
      const t = (-u.y - 0.35) / 0.65;
      v.x *= 1.0 - 0.30 * t;
      v.z *= 1.0 - 0.10 * t;
    }
    p.setXYZ(i, v.x, v.y, v.z);
  }
  p.needsUpdate = true;
  g.computeVertexNormals();
  chiselGeometry(g, { amp: 0.009, freq: 8.5, octaves: 3, seed: 3.1 });
  addMesh(head, g, matSkin, [0, 0.02, 0]);
}

/* ---------- 2. BROW RIDGES (heavy furrowed stone) ---------- */
function makeBrowRidge() {
  // a thick torus arc, squashed into a stone shelf
  const g = new THREE.TorusGeometry(0.185, 0.062, 22, 44, Math.PI * 0.92);
  const p = g.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    v.z *= 1.55;              // deepen front-to-back
    v.y *= 0.86;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  p.needsUpdate = true;
  g.computeVertexNormals();
  chiselGeometry(g, { amp: 0.010, freq: 16.0, octaves: 2, seed: 7.7, planar: 3 });
  return g;
}
{
  const browGeo = makeBrowRidge();
  const browL = addMesh(head, browGeo, matSkin,
    [-0.175, 0.135, 0.365], [0.30, 0.24, -0.30], [1, 1, 1]);
  const browR = browL.clone();
  browR.position.x = 0.175;
  browR.rotation.set(0.30, -0.24, 0.30);
  browR.scale.x = -1;
  browR.castShadow = true; browR.receiveShadow = true;
  head.add(browR);

  // central furrow knot between the brows (the frown)
  const knot = new THREE.SphereGeometry(0.075, 32, 24);
  chiselGeometry(knot, { amp: 0.016, freq: 18.0, octaves: 2, seed: 2.2, planar: 2 });
  addMesh(head, knot, matSkin, [0, 0.115, 0.435], [0, 0, 0], [1.5, 1.15, 0.85]);

  // two vertical furrow grooves (as thin recessed slabs)
  for (const sx of [-1, 1]) {
    const gr = new THREE.CapsuleGeometry(0.017, 0.10, 6, 12);
    chiselGeometry(gr, { amp: 0.006, freq: 20, octaves: 2, seed: 4.4 });
    addMesh(head, gr, matRough,
      [sx * 0.048, 0.185, 0.452], [0.18, 0, sx * 0.20], [1, 1, 0.7]);
  }

  // upper forehead ridge that ties brows into the crown
  const shelf = new THREE.CapsuleGeometry(0.052, 0.26, 8, 20);
  chiselGeometry(shelf, { amp: 0.010, freq: 12, octaves: 3, seed: 9.1, planar: 3 });
  addMesh(head, shelf, matSkin, [0, 0.235, 0.345], [Math.PI / 2 + 0.30, 0, Math.PI / 2], [1, 1, 0.62]);
}

/* ---------- 3. EYES — blank, pupil-less, deep sockets ---------- */
function buildEye(sx) {
  const grp = new THREE.Group();

  // recessed socket (dark rough marble bowl)
  const socket = new THREE.SphereGeometry(0.098, 32, 24, 0, Math.PI * 2, 0, Math.PI * 0.62);
  chiselGeometry(socket, { amp: 0.008, freq: 20, octaves: 2, seed: 5.5 });
  const sm = addMesh(grp, socket, matRough, [0, 0, 0], [Math.PI * 0.52, 0, 0], [1.25, 1.0, 1.0]);
  sm.material = matRough;

  // the blank eyeball: smooth polished sphere, NO pupil
  const ball = new THREE.SphereGeometry(0.072, 40, 32);
  addMesh(grp, ball, matEye, [0, 0, 0.012], [0, 0, 0], [1.06, 0.98, 0.92]);

  // heavy upper lid (thick carved crescent)

/* ---------- 6. THE MANE — deep symmetrical carved scrolls ---------- */
const mane = new THREE.Group();

/**
 * A single carved scroll: a tapering tube swept along a logarithmic spiral,
 * lying in a plane, then oriented outward from the skull.
 */
function makeScrollGeometry(turns, startR, endR, thick0, thick1, segs, tubeSegs, twistZ) {
  const pts = [];
  const N = segs;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const ang = t * Math.PI * 2.0 * turns;
    const r = THREE.MathUtils.lerp(startR, endR, Math.pow(t, 0.85));
    pts.push(new THREE.Vector3(
      Math.cos(ang) * r,
      Math.sin(ang) * r,
      twistZ * t * t          // gentle lift out of plane -> deep relief
    ));
  }
  const curve = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.5);
  const geo = new THREE.TubeGeometry(curve, N * 2, 1.0, tubeSegs, false);

  // taper the tube radius manually along the tube's length
  const pos = geo.attributes.position;
  const nrm = geo.attributes.normal;
  const rings = N * 2 + 1;
  const ringVerts = tubeSegs + 1;
  const P = new THREE.Vector3();
  const Nv = new THREE.Vector3();
  const C = new THREE.Vector3();

  for (let ri = 0; ri < rings; ri++) {
    const t = ri / (rings - 1);
    const rad = THREE.MathUtils.lerp(thick0, thick1, Math.pow(t, 0.78));
    // ring center = point on curve
    curve.getPointAt(Math.min(t, 1), C);
    for (let vi = 0; vi < ringVerts; vi++) {
      const idx = ri * ringVerts + vi;
      if (idx >= pos.count) continue;
      P.fromBufferAttribute(pos, idx);
      Nv.fromBufferAttribute(nrm, idx);
      // current offset is unit-length (radius 1 tube)
      const ox = P.x - C.x, oy = P.y - C.y, oz = P.z - C.z;
      const len = Math.hypot(ox, oy, oz) || 1;
      // flatten the scroll slightly in Z so it reads as carved relief, not a wire
      pos.setXYZ(
        idx,
        C.x + (ox / len) * rad,
        C.y + (oy / len) * rad,
        C.z + (oz / len) * rad * 0.72
      );
    }
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

/** One mane lock = a scroll + a wedge root + a carved bead at the eye of the spiral. */
function buildLock(cfg, seedBase) {
  const g = new THREE.Group();

  const scrollGeo = makeScrollGeometry(
    cfg.turns, cfg.startR, cfg.endR, cfg.thick0, cfg.thick1, 60, 12, cfg.twist
  );
  chiselGeometry(scrollGeo, {
    amp: cfg.chiselAmp, freq: 14, octaves: 3, seed: seedBase, planar: 3
  });
  const scroll = new THREE.Mesh(scrollGeo, cfg.deep ? matManeDeep : matMane);
  scroll.castShadow = true; scroll.receiveShadow = true;
  g.add(scroll);

  // the "eye" of the scroll — a carved boss
  const beadGeo = new THREE.SphereGeometry(cfg.thick1 * 1.65, 20, 14);
  chiselGeometry(beadGeo, { amp: 0.008, freq: 22, octaves: 2, seed: seedBase + 0.5, planar: 2 });
  const beadAng = Math.PI * 2.0 * cfg.turns;
  const bead = new THREE.Mesh(beadGeo, matManeDeep);
  bead.position.set(
    Math.cos(beadAng) * cfg.endR,
    Math.sin(beadAng) * cfg.endR,
    cfg.twist
  );
  bead.scale.set(1, 1, 0.8);
  bead.castShadow = true; bead.receiveShadow = true;
  g.add(bead);

  // root wedge blending the lock into the skull mass
  const rootGeo = new THREE.ConeGeometry(cfg.thick0 * 1.5, cfg.startR * 1.7, 6);
  chiselGeometry(rootGeo, { amp: 0.010, freq: 12, octaves: 2, seed: seedBase + 1.5, planar: 2 });
  const root = new THREE.Mesh(rootGeo, matMane);
  root.position.set(cfg.startR * 0.30, cfg.startR * 0.10, -cfg.thick0 * 0.6);
  root.rotation.z = -Math.PI / 2 + 0.4;
  root.rotation.x = 0.2;
  root.castShadow = true; root.receiveShadow = true;
  g.add(root);

  return g;
}

/**
 * Place mane locks in symmetric rings around the head.
 * Each ring is defined by a polar angle band; locks spiral outward
 * from the skull like carved waves.
 */
const MANE_RINGS = [
  // radius from head center, vertical offset, count per side, size scale, tilt
  { r: 0.560, y: 0.290, count: 3, scale: 1.00, aStart: 0.30, aEnd: 1.28, deep: false, out: 0.02 },
  { r: 0.640, y: 0.090, count: 4, scale: 1.14, aStart: 0.14, aEnd: 1.42, deep: false, out: 0.04 },
  { r: 0.690, y: -0.150, count: 4, scale: 1.06, aStart: 0.18, aEnd: 1.30, deep: true,  out: 0.02 },
  { r: 0.760, y: 0.160, count: 4, scale: 1.28, aStart: 0.05, aEnd: 1.52, deep: true,  out: -0.06 },
  { r: 0.800, y: -0.080, count: 3, scale: 1.18, aStart: 0.22, aEnd: 1.30, deep: true,  out: -0.10 }
];

let seedCounter = 21.0;

MANE_RINGS.forEach((ring, ringIdx) => {
  for (let side = 0; side < 2; side++) {
    const sx = side === 0 ? 1 : -1;
    for (let i = 0; i < ring.count; i++) {
      const t = ring.count === 1 ? 0.5 : i / (ring.count - 1);
      const az = THREE.MathUtils.lerp(ring.aStart, ring.aEnd, t); // azimuth from +Z toward side
      const s = ring.scale * (0.92 + 0.16 * ((i * 7 + ringIdx * 3) % 5) / 4);

      const cfg = {
        turns: 0.78 + 0.22 * ((i + ringIdx) % 3) / 2,
        startR: 0.150 * s,
        endR: 0.036 * s,
        thick0: 0.049 * s,
        thick1: 0.021 * s,
        twist: (0.045 + 0.02 * ((i + ringIdx) % 2)) * s,
        chiselAmp: ring.deep ? 0.014 : 0.010,
        deep: ring.deep
      };

      const lock = buildLock(cfg, (seedCounter += 1.7));

      // position on an ellipsoidal shell around the skull
      const px = Math.sin(az) * ring.r * sx * 1.02;
      const pz = Math.cos(az) * ring.r * 0.88 - 0.10;
      const py = ring.y + Math.cos(az) * 0.05;

      lock.position.set(px, py, pz);

      // face outward, and mirror handedness so the mane is symmetric
      const outward = new THREE.Vector3(px, py * 0.35, pz + 0.10).normalize();
      const yaw = Math.atan2(outward.x, outward.z);
      const pitch = -Math.asin(THREE.MathUtils.clamp(outward.y, -1, 1)) * 0.7;

      lock.rotation.set(pitch, yaw, 0);
      // spiral handedness mirrors across the midline
      lock.scale.set(sx, 1, 1);
      // additional roll so the scroll "unrolls" downward/outward like waves
      lock.rotateZ(sx * (0.55 + 0.35 * t + ringIdx * 0.12));
      lock.translateZ(ring.out);

      mane.add(lock);
    }
  }
});

    { x: 0.440, y: -0.430, z: -0.020, s: 0.86, roll: 1.9 },
    { x: 0.290, y: -0.480, z: 0.100, s: 0.78, roll: 2.3 },
    { x: 0.120, y: -0.500, z: 0.030, s: 0.72, roll: 2.7 }
  ];
  RUFF.forEach((c, i) => {
    [1, -1].forEach((sx) => {
      const s = c.s;
      const cfg = {
        turns: 0.80 + 0.20 * (i % 2),
        startR: 0.130 * s,
        endR: 0.030 * s,
        thick0: 0.043 * s,
        thick1: 0.018 * s,
        twist: 0.040 * s,
        chiselAmp: 0.013,
        deep: i % 2 === 0
      };
      const lock = buildLock(cfg, (seedCounter += 1.7));
      lock.position.set(c.x * sx, c.y, c.z);
      const outward = new THREE.Vector3(c.x * sx, -0.45, c.z + 0.15).normalize();
      lock.rotation.set(-Math.asin(THREE.MathUtils.clamp(outward.y, -1, 1)) * 0.9,
                        Math.atan2(outward.x, outward.z), 0);
      lock.scale.set(sx, 1, 1);
      lock.rotateZ(sx * c.roll);
      mane.add(lock);
    });
  });
}

/* --- back mass of the mane: a chiselled shell so there is no hole behind --- */
{
  const shell = new THREE.SphereGeometry(0.72, 72, 54);
  const p = shell.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const u = v.clone().normalize();
    // compress the front (face lives there) and swell the back/sides
    const front = Math.max(0, u.z);
    v.z -= front * 0.34 * 0.72;
    v.x *= 1.02 - front * 0.16;
    v.y *= 0.94;
    // slight downward extension for the ruff base
    if (u.y < -0.4) v.y -= 0.06;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  p.needsUpdate = true;
  shell.computeVertexNormals();
  chiselGeometry(shell, { amp: 0.030, freq: 6.5, octaves: 4, seed: 31.4, planar: 2 });
  const sm = new THREE.Mesh(shell, matManeDeep);
  sm.position.set(0, 0.0, -0.16);
  sm.castShadow = true; sm.receiveShadow = true;
  mane.add(sm);

  // radial "wave" ridges over the back shell for extra carved rhythm
  for (let i = 0; i < 26; i++) {
    const a = (i / 26) * Math.PI * 2;
    const ridge = new THREE.TorusGeometry(0.30 + 0.05 * (i % 3), 0.030, 10, 24, Math.PI * 0.75);
    chiselGeometry(ridge, { amp: 0.010, freq: 16, octaves: 2, seed: 40 + i, planar: 2 });
    const rm = new THREE.Mesh(ridge, i % 2 ? matMane : matManeDeep);
    const rr = 0.55;
    rm.position.set(
      Math.cos(a) * rr * 1.0,
      Math.sin(a) * rr * 0.86,
      -0.42 - 0.06 * (i % 2)
    );
    rm.rotation.set(0.25 * Math.sin(a), 0.25 * Math.cos(a), a + Math.PI * 0.5);
    rm.castShadow = true; rm.receiveShadow = true;
    mane.add(rm);
  }
}

/* ---------- 7. NECK STUB + BASE BLOCK ---------- */
{
  const neck = new THREE.CylinderGeometry(0.44, 0.60, 0.42, 40, 4);
  chiselGeometry(neck, { amp: 0.018, freq: 8, octaves: 3, seed: 51.2, planar: 3 });
  addMesh(lion, neck, matManeDeep, [0, 0.42, -0.16], [0.10, 0, 0], [1.06, 1, 0.96]);

  // torus of small locks skirting the neck junction
  for (let i = 0; i < 14; i++) {
    const a = -Math.PI * 0.5 + (i / 13) * Math.PI * 2.0;
    const s = 0.62;
    const cfg = {
      turns: 0.8, startR: 0.115 * s, endR: 0.028 * s,
      thick0: 0.040 * s, thick1: 0.017 * s, twist: 0.035 * s,
      chiselAmp: 0.012, deep: i % 2 === 0
    };
    const lock = buildLock(cfg, (seedCounter += 1.7));
    const rr = 0.545;
    lock.position.set(Math.cos(a) * rr, 0.44 + Math.sin(a) * 0.10, Math.sin(a) * rr * 0.80 - 0.14);
    lock.rotation.set(0.5, a + Math.PI * 0.5, 0);
    lock.rotateZ(1.2);
    lion.add(lock);
  }
}

/* base plinth (part of the same carved object: the block the head rises from) */
{
  const plinth = new THREE.CylinderGeometry(0.86, 0.98, 0.24, 8, 2);
  chiselGeometry(plinth, { amp: 0.012, freq: 7, octaves: 3, seed: 61.3, planar: 4 });
  const pm = addMesh(lion, plinth, matPlinth, [0, 0.12, -0.05], [0, Math.PI / 8, 0]);
  pm.receiveShadow = true;

  const fillet = new THREE.TorusGeometry(0.86, 0.045, 12, 40);
  chiselGeometry(fillet, { amp: 0.006, freq: 14, octaves: 2, seed: 62.4, planar: 3 });
  addMesh(lion, fillet, matPlinth, [0, 0.245, -0.05], [Math.PI / 2, 0, 0]);
}

/* ============================================================
   CENTER + SCALE THE SINGLE OBJECT
   ============================================================ */
{
  const box = new THREE.Box3().setFromObject(lion);
  const size = new THREE.Vector3();
  const center = new THREE.Vector3();
  box.getSize(size);
  box.getCenter(center);

  // target overall height ~1.55 world units (life-size lion head + plinth)
  const targetH = 1.62;
  const k = targetH / Math.max(size.y, 1e-4);
  lion.scale.setScalar(k);

  // recompute and seat on the ground, centered on X/Z
  const box2 = new THREE.Box3().setFromObject(lion);
  const c2 = new THREE.Vector3();
  box2.getCenter(c2);
  lion.position.x -= c2.x;
  lion.position.z -= c2.z;
  lion.position.y -= box2.min.y;

  const box3 = new THREE.Box3().setFromObject(lion);
  const c3 = new THREE.Vector3();
  box3.getCenter(c3);
  controls.target.set(0, c3.y + 0.10, 0);
  rim.target.position.set(0, c3.y, 0);
  key.target.position.set(0, c3.y * 0.9, 0);
  scene.add(key.target);
}

/* subtle environment for marble specular response */
{
  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();

  // procedural gradient environment (no external assets)
  const envScene = new THREE.Scene();
  const gradGeo = new THREE.SphereGeometry(10, 32, 24);
  const gradMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {},
    vertexShader: `
      varying vec3 vPos;
      void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
    `,
    fragmentShader: `
      varying vec3 vPos;
      void main(){
        vec3 d = normalize(vPos);
        float t = clamp(d.y * 0.5 + 0.5, 0.0, 1.0);
        vec3 sky = mix(vec3(0.055,0.058,0.068), vec3(0.62,0.66,0.74), pow(t, 1.25));
        // soft overhead studio panel
        float panel = smoothstep(0.72, 0.98, d.y) * 1.6;
        // warm side kick
        float kick = smoothstep(0.55, 1.0, d.x * 0.7 + d.z * 0.5) * 0.35;
        gl_FragColor = vec4(sky + panel + vec3(0.30,0.24,0.16) * kick, 1.0);
      }
    `
  });
  const gradMesh = new THREE.Mesh(gradGeo, gradMat);
  envScene.add(gradMesh);

  const envRT = pmrem.fromScene(envScene, 0.04);
  scene.environment = envRT.texture;

  gradGeo.dispose();
  gradMat.dispose();
  pmrem.dispose();
}

/* ============================================================
   RESIZE + RENDER LOOP
   ============================================================ */
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // barely-there light breathing so the marble specular stays alive
  key.intensity = 2.35 + Math.sin(t * 0.35) * 0.06;
  bounce.intensity = 3.2 + Math.sin(t * 0.5 + 1.0) * 0.15;

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
