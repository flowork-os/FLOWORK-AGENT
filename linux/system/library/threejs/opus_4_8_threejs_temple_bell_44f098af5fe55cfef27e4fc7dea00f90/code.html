<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Temple Bell — Bonshō Study</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #131417; }
  #app { position: fixed; inset: 0; }
  .caption {
    position: fixed; left: 16px; bottom: 14px; z-index: 10;
    font: 13px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #b9c0c8; letter-spacing: .02em; user-select: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.6); opacity: .85;
  }
  .caption b { color: #e6d6ad; font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<div class="caption"><b>Bonshō</b> — hanging temple bell · procedural study · drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ */
/*  Renderer                                                           */
/* ------------------------------------------------------------------ */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

/* ------------------------------------------------------------------ */
/*  Scene & camera                                                     */
/* ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x131417);
scene.fog = new THREE.Fog(0x131417, 16, 42);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.6, 1.8, 5.4);

// Soft studio reflections for the metal
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ */
/*  Lighting                                                           */
/* ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0x9fb4c9, 0x2a2620, 0.5);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xfff2df, 2.4);
keyLight.position.set(6, 10, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 30;
keyLight.shadow.camera.left = -4;
keyLight.shadow.camera.right = 4;
keyLight.shadow.camera.top = 4;
keyLight.shadow.camera.bottom = -4;
keyLight.shadow.bias = -0.0004;
keyLight.shadow.normalBias = 0.02;
scene.add(keyLight);
scene.add(keyLight.target);

const fillLight = new THREE.DirectionalLight(0x9db8d6, 0.55);
fillLight.position.set(-6, 4, -3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffd9a8, 1.3);
rimLight.position.set(-3, 6, -8);
scene.add(rimLight);

/* ------------------------------------------------------------------ */
/*  Materials                                                          */
/* ------------------------------------------------------------------ */
const bodyMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  color: 0xffffff,
  metalness: 0.6,
  roughness: 0.55,
  side: THREE.DoubleSide,
  envMapIntensity: 1.0
});

const bronzeMat = new THREE.MeshStandardMaterial({
  color: 0x8f6f43,
  metalness: 0.95,
  roughness: 0.32,
  envMapIntensity: 1.15
});

/* ------------------------------------------------------------------ */
/*  Bell body — lathe profile (thick flared lip, domed crown)          */
/* ------------------------------------------------------------------ */
// Outer silhouette (radius, height), bottom -> top
const outerPts = [
  [1.00, 0.00], [1.07, 0.09], [1.05, 0.17], [1.00, 0.26],
  [0.975, 0.45], [0.958, 0.75], [0.948, 1.05], [0.941, 1.35],
  [0.936, 1.62], [0.930, 1.85], [0.918, 2.02], [0.892, 2.16],
  [0.845, 2.30], [0.770, 2.42], [0.660, 2.53], [0.520, 2.62],
  [0.360, 2.69], [0.200, 2.73], [0.130, 2.75]
].map(p => new THREE.Vector2(p[0], p[1]));

// Inner wall, top -> bottom (gives thickness & thick lip)
const innerPts = [
  [0.120, 2.70], [0.230, 2.62], [0.380, 2.53], [0.520, 2.42],
  [0.630, 2.28], [0.710, 2.10], [0.760, 1.88], [0.792, 1.60],
  [0.806, 1.30], [0.812, 1.00], [0.815, 0.70], [0.820, 0.45],
  [0.836, 0.28], [0.858, 0.18], [0.905, 0.10], [1.00, 0.00]
].map(p => new THREE.Vector2(p[0], p[1]));

const profile = outerPts.concat(innerPts);

function outerR(y) {
  const p = outerPts;
  if (y <= p[0].y) return p[0].x;
  for (let i = 1; i < p.length; i++) {
    if (y <= p[i].y) {
      const t = (y - p[i - 1].y) / (p[i].y - p[i - 1].y);
      return p[i - 1].x + (p[i].x - p[i - 1].x) * t;
    }
  }
  return p[p.length - 1].x;
}

const bodyGeo = new THREE.LatheGeometry(profile, 180);

// Procedural verdigris patina via vertex colors
(function paintPatina(geo) {
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const cBronze = new THREE.Color(0x8f6f43);
  const cPatina = new THREE.Color(0x4f8a72);
  const cDeep   = new THREE.Color(0x2c5c4c);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const noise = (x, y, z) =>
    (Math.sin(x * 2.3 + y * 1.7) + Math.sin(y * 2.9 - z * 1.3) +
     Math.sin(z * 2.1 + x * 1.1) + Math.sin((x + y + z) * 1.7)) * 0.25;
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const n1 = noise(x, y, z);
    const n2 = noise(x * 2.7 + 5.0, y * 2.7 - 3.0, z * 2.7 + 1.0);
    // patina pools lower & in sheltered blotches
    let g = 0.52 + 0.30 * n1 + 0.16 * n2 + 0.10 * Math.sin(y * 2.2 + n2 * 3.0);
    g = clamp(g, 0, 1);
    tmp.copy(cBronze).lerp(cPatina, g);
    const d = clamp(0.55 * n2 + 0.15, 0, 1) * g;
    tmp.lerp(cDeep, d * 0.55);
    colors[i * 3] = tmp.r; colors[i * 3 + 1] = tmp.g; colors[i * 3 + 2] = tmp.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
})(bodyGeo);

const bell = new THREE.Group();

const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
bodyMesh.castShadow = true;
bodyMesh.receiveShadow = true;
bell.add(bodyMesh);

/* ------------------------------------------------------------------ */
/*  Raised horizontal banding                                          */
/* ------------------------------------------------------------------ */
function addBand(y, tube) {
  const r = outerR(y) + 0.01;
  const g = new THREE.TorusGeometry(r, tube, 20, 140);
  const m = new THREE.Mesh(g, bronzeMat);
  m.rotation.x = Math.PI / 2;
  m.position.y = y;
  m.castShadow = true; m.receiveShadow = true;
  bell.add(m);
}
[[0.29, 0.034], [1.00, 0.028], [1.50, 0.030], [2.06, 0.034]].forEach(b => addBand(b[0], b[1]));

/* ------------------------------------------------------------------ */
/*  Vertical dividing ribs (four panels)                               */
/* ------------------------------------------------------------------ */
function addRib(angle) {
  const pts = [];
  for (let y = 0.30; y <= 2.061; y += 0.14) {
    const r = outerR(y) + 0.004;
    pts.push(new THREE.Vector3(Math.cos(angle) * r, y, Math.sin(angle) * r));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  const g = new THREE.TubeGeometry(curve, 90, 0.03, 12, false);
  const m = new THREE.Mesh(g, bronzeMat);
  m.castShadow = true; m.receiveShadow = true;
  bell.add(m);
}
[0, Math.PI / 2, Math.PI, 3 * Math.PI / 2].forEach(addRib);

/* ------------------------------------------------------------------ */
/*  Bosses (nyū) — grids of studs in the four upper panels             */
/* ------------------------------------------------------------------ */
(function addBosses() {
  const panelCenters = [Math.PI / 4, 3 * Math.PI / 4, 5 * Math.PI / 4, 7 * Math.PI / 4];
  const colOffsets = [-0.28, -0.093, 0.093, 0.28];
  const rowY = [1.56, 1.71, 1.86, 2.00];
  const count = panelCenters.length * colOffsets.length * rowY.length;
  const geo = new THREE.SphereGeometry(0.032, 16, 12);
  const inst = new THREE.InstancedMesh(geo, bronzeMat, count);
  inst.castShadow = true; inst.receiveShadow = true;
  const dummy = new THREE.Object3D();
  let i = 0;
  for (const c of panelCenters) {
    for (const off of colOffsets) {
      for (const y of rowY) {
        const a = c + off;
        const r = outerR(y) + 0.02;
        dummy.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
        dummy.rotation.set(0, 0, 0);
        dummy.updateMatrix();
        inst.setMatrixAt(i++, dummy.matrix);
      }
    }
  }
  inst.instanceMatrix.needsUpdate = true;
  bell.add(inst);
})();

/* ------------------------------------------------------------------ */
/*  Tsukiza — struck lotus bosses on the lower body                    */
/* ------------------------------------------------------------------ */
function faceOut(obj, angle, y, r) {
  obj.position.set(Math.cos(angle) * r, y, Math.sin(angle) * r);
  obj.lookAt(0, y, 0); // local +Z points outward
}
function addTsukiza(angle) {
  const grp = new THREE.Group();
  const dome = new THREE.Mesh(new THREE.SphereGeometry(0.12, 24, 18), bronzeMat);
  dome.scale.set(1, 1, 0.45);
  dome.castShadow = true; dome.receiveShadow = true;
  grp.add(dome);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.022, 14, 40), bronzeMat);
  ring.castShadow = true; ring.receiveShadow = true;
  grp.add(ring);
  const pip = new THREE.Mesh(new THREE.SphereGeometry(0.032, 14, 12), bronzeMat);
  pip.position.z = 0.055;
  grp.add(pip);
  const y = 0.72;
  faceOut(grp, angle, y, outerR(y) + 0.005);
  bell.add(grp);
}
addTsukiza(0);
addTsukiza(Math.PI);

/* ------------------------------------------------------------------ */
/*  Crown cap + dragon-crown suspension loop (ryūzu)                   */
/* ------------------------------------------------------------------ */
const crown = new THREE.Mesh(new THREE.SphereGeometry(0.18, 24, 16), bronzeMat);
crown.scale.set(1, 0.45, 1);
crown.position.y = 2.72;
crown.castShadow = true; crown.receiveShadow = true;
bell.add(crown);

const loopGroup = new THREE.Group();
function makeArch(rot) {
  const pts = [
    new THREE.Vector3(-0.30, 2.64, 0),
    new THREE.Vector3(-0.35, 2.88, 0),
    new THREE.Vector3(-0.20, 3.05, 0),
    new THREE.Vector3( 0.00, 3.12, 0),
    new THREE.Vector3( 0.20, 3.05, 0),
    new THREE.Vector3( 0.35, 2.88, 0),
    new THREE.Vector3( 0.30, 2.64, 0)
  ];
  const curve = new THREE.CatmullRomCurve3(pts);
  const geo = new THREE.TubeGeometry(curve, 90, 0.058, 18, false);
  const m = new THREE.Mesh(geo, bronzeMat);
  m.rotation.y = rot;
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
loopGroup.add(makeArch(0));
loopGroup.add(makeArch(Math.PI / 2));

// crossing knob
const knob = new THREE.Mesh(new THREE.SphereGeometry(0.095, 20, 16), bronzeMat);
knob.position.set(0, 3.12, 0);
knob.castShadow = true; knob.receiveShadow = true;
loopGroup.add(knob);

// dragon-head roots + a few scale studs
const roots = [
  [0.30, 2.64, 0], [-0.30, 2.64, 0], [0, 2.64, 0.30], [0, 2.64, -0.30]
];
roots.forEach(p => {
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 14), bronzeMat);
  head.position.set(p[0], p[1], p[2]);
  head.scale.set(1.1, 0.9, 1.1);
  head.castShadow = true; head.receiveShadow = true;
  loopGroup.add(head);
});
for (let k = 0; k < 8; k++) {
  const a = (k / 8) * Math.PI * 2;
  const stud = new THREE.Mesh(new THREE.SphereGeometry(0.028, 10, 8), bronzeMat);
  stud.position.set(Math.cos(a) * 0.11, 3.02 + Math.sin(a * 2) * 0.03, Math.sin(a) * 0.11);
  loopGroup.add(stud);
}
bell.add(loopGroup);

/* ------------------------------------------------------------------ */
/*  Place & centre the single object                                   */
/* ------------------------------------------------------------------ */
bell.position.y = -1.4;
scene.add(bell);

/* ------------------------------------------------------------------ */
/*  Ground plane (receives shadow only)                                */
/* ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -1.75;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ */
/*  Controls                                                           */
/* ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.target.set(0, 0.15, 0);
controls.minDistance = 3.2;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.52;
controls.update();

/* ------------------------------------------------------------------ */
/*  Resize + render loop                                               */
/* ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
