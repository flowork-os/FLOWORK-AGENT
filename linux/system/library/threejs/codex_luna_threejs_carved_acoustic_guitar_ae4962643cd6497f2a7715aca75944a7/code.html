<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carved Acoustic Guitar</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17110d}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17110d);
scene.fog = new THREE.Fog(0x17110d, 11, 20);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.4, 3.8, 10.2);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 6;
controls.maxDistance = 16;
controls.target.set(0, 0.9, 0);

scene.add(new THREE.HemisphereLight(0xffe4bd, 0x20130d, 2.1));

const key = new THREE.DirectionalLight(0xffd6a0, 4.2);
key.position.set(-5, 7, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -6;
scene.add(key);

const fill = new THREE.PointLight(0x9b5a34, 1.5, 15);
fill.position.set(5, 1, 5);
scene.add(fill);

const spruce = new THREE.MeshStandardMaterial({color:0xc88c51, roughness:.52, metalness:0});
const spruceLight = new THREE.MeshStandardMaterial({color:0xe0aa6a, roughness:.46});
const rosewood = new THREE.MeshStandardMaterial({color:0x4a1e18, roughness:.38});
const darkRose = new THREE.MeshStandardMaterial({color:0x25100f, roughness:.32});
const ebony = new THREE.MeshStandardMaterial({color:0x120d0c, roughness:.28});
const brass = new THREE.MeshStandardMaterial({color:0xc18b48, roughness:.3, metalness:.72});
const fretMat = new THREE.MeshStandardMaterial({color:0xd2a467, roughness:.25, metalness:.65});
const stringMat = new THREE.MeshStandardMaterial({color:0xd7b980, roughness:.22, metalness:.78});

function outlineShape() {
  const s = new THREE.Shape();
  s.moveTo(0,-2.55);
  s.bezierCurveTo(-.72,-2.55,-1.42,-2.18,-1.58,-1.47);
  s.bezierCurveTo(-1.72,-.84,-1.48,-.38,-1.16,-.08);
  s.bezierCurveTo(-.94,.13,-.97,.48,-1.18,.72);
  s.bezierCurveTo(-1.52,1.1,-1.42,1.54,-1.02,1.77);
  s.bezierCurveTo(-.61,2.01,-.32,2.13,0,2.14);
  s.bezierCurveTo(.32,2.13,.61,2.01,1.02,1.77);
  s.bezierCurveTo(1.42,1.54,1.52,1.1,1.18,.72);
  s.bezierCurveTo(.97,.48,.94,.13,1.16,-.08);
  s.bezierCurveTo(1.48,-.38,1.72,-.84,1.58,-1.47);
  s.bezierCurveTo(1.42,-2.18,.72,-2.55,0,-2.55);
  return s;
}

const bodyGeo = new THREE.ExtrudeGeometry(outlineShape(), {
  depth:.62, bevelEnabled:true, bevelSegments:3, bevelSize:.075, bevelThickness:.075, curveSegments:12
});
bodyGeo.center();
const body = new THREE.Mesh(bodyGeo, [rosewood, spruce]);
body.position.y = -1.05;
body.castShadow = true;
body.receiveShadow = true;
scene.add(body);

const top = new THREE.Mesh(new THREE.ShapeGeometry(outlineShape(), 32), spruce);
top.position.set(0,-1.05,.36);
top.scale.set(.985,.985,1);
top.castShadow = true;
scene.add(top);

function addGrain() {
  for (let i=0;i<25;i++) {
    const pts = [];
    const x = (i-12)*.105;
    const bend = (i%3-.9)*.035;
    for (let j=0;j<15;j++) {
      const y = -2.42 + j*.34;
      const edge = Math.min(1.48, .68 + Math.abs(y+.45)*.28);
      const xx = x + Math.sin(j*.7+i)*.018 + bend*y;
      if (Math.abs(xx) < edge) pts.push(new THREE.Vector3(xx, y, .385));
    }
    if (pts.length > 2) {
      const curve = new THREE.CatmullRomCurve3(pts);
      const line = new THREE.Mesh(new THREE.TubeGeometry(curve, 18, .008 + (i%4)*.0015, 5, false),
        new THREE.MeshStandardMaterial({color:i%2?0x925c32:0xa96e3b, roughness:.7}));
      line.position.y = -1.05;
      scene.add(line);
    }
  }
}
addGrain();

function cylinder(radius, depth, material, x, y, z, rotationZ=0) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,depth,24), material);
  m.position.set(x,y,z);
  m.rotation.z = rotationZ;
  m.castShadow = true;
  scene.add(m);
  return m;
}

const hole = cylinder(.58,.025,ebony,0,-.5,.43);
hole.rotation.x = Math.PI/2;

for (let r=0.67;r<.84;r+=.085) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r,.026,8,64), r<.76?rosewood:brass);
  ring.position.set(0,-.5,.45);
  ring.rotation.x = Math.PI/2;
  ring.castShadow = true;
  scene.add(ring);
}

for (let i=0;i<18;i++) {
  const a = i/18*Math.PI*2;
  const r = .755;
  const block = new THREE.Mesh(new THREE.BoxGeometry(.07,.15,.035), i%2?darkRose:brass);
  block.position.set(Math.cos(a)*r, -.5+Math.sin(a)*r, .48);
  block.rotation.z = a;
  block.castShadow = true;
  scene.add(block);
}

const bridge = new THREE.Mesh(new THREE.BoxGeometry(1.05,.18,.09), darkRose);
bridge.position.set(0,-1.87,.46);
bridge.castShadow = true;
scene.add(bridge);

const saddle = new THREE.Mesh(new THREE.BoxGeometry(.78,.045,.045), fretMat);
saddle.position.set(0,-1.78,.52);
scene.add(saddle);

for (let i=0;i<6;i++) {
  const pin = new THREE.Mesh(new THREE.SphereGeometry(.035,10,8), brass);
  pin.position.set(-.31+i*.124,-1.91,.54);
  scene.add(pin);
}

const neckShape = new THREE.Shape();
neckShape.moveTo(-.22,0); neckShape.lineTo(.22,0); neckShape.lineTo(.31,3.08);
neckShape.lineTo(-.31,3.08); neckShape.closePath();
const neckGeo = new THREE.ExtrudeGeometry(neckShape,{depth:.22,bevelEnabled:true,bevelSegments:2,bevelSize:.025,bevelThickness:.025});
neckGeo.center();
const neck = new THREE.Mesh(neckGeo, spruce);
neck.position.set(0,1.08,.21);
neck.castShadow = true;
scene.add(neck);

const boardShape = new THREE.Shape();
boardShape.moveTo(-.18,0); boardShape.lineTo(.18,0); boardShape.lineTo(.265,3.12); boardShape.lineTo(-.265,3.12); boardShape.closePath();
const board = new THREE.Mesh(new THREE.ExtrudeGeometry(boardShape,{depth:.075,bevelEnabled:true,bevelSegments:2,bevelSize:.018}), rosewood);
board.position.set(0,1.08,.37);
board.castShadow = true;
scene.add(board);

const fretYs = [0,.28,.53,.75,.95,1.14,1.31,1.47,1.62,1.76,1.89,2.01,2.12,2.22,2.31,2.39,2.46,2.53,2.59,2.65,2.71,2.77,2.82,2.87,2.92,2.97,3.02];
for (let i=0;i<fretYs.length;i++) {
  const y = 1.08 + fretYs[i];
  const width = .37 + fretYs[i]*.055;
  const f = new THREE.Mesh(new THREE.BoxGeometry(width,.027,.045), fretMat);
  f.position.set(0,y,.45);
  f.castShadow = true;
  scene.add(f);
}

for (const y of [1.75,2.28,2.72]) {
  for (const x of [-.075,.075]) {
    const dot = new THREE.Mesh(new THREE.SphereGeometry(.032,12,8), new THREE.MeshStandardMaterial({color:0xd3b275,roughness:.35}));
    dot.position.set(x,y,.425);
    scene.add(dot);
  }
}

function headShape() {
  const s = new THREE.Shape();
  s.moveTo(-.36,0); s.lineTo(.36,0); s.lineTo(.48,.5);
  s.bezierCurveTo(.61,.82,.45,1.23,.15,1.32);
  s.bezierCurveTo(.05,1.48,-.2,1.48,-.25,1.3);
  s.bezierCurveTo(-.6,1.22,-.63,.78,-.48,.48);
  s.closePath();
  return s;
}
const head = new THREE.Mesh(new THREE.ExtrudeGeometry(headShape(),{depth:.25,bevelEnabled:true,bevelSegments:3,bevelSize:.05,bevelThickness:.04}), rosewood);
head.position.set(0,4.15,.22);
head.castShadow = true;
scene.add(head);

const scroll = new THREE.Mesh(new THREE.TorusGeometry(.19,.055,10,28,Math.PI*1.65), brass);
scroll.position.set(-.19,5.2,.39);
scroll.rotation.x = Math.PI/2;
scene.add(scroll);

for (const side of [-1,1]) {
  for (let i=0;i<3;i++) {
    const y = 4.53+i*.23;
    const peg = new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.25,16), brass);
    peg.position.set(side*(.48+i*.025),y,.35);
    peg.rotation.z = Math.PI/2;
    peg.castShadow = true;
    scene.add(peg);
    const knob = new THREE.Mesh(new THREE.BoxGeometry(.13,.09,.07), ebony);
    knob.position.set(side*(.62+i*.025),y,.35);
    knob.rotation.z = side*.2;
    scene.add(knob);
  }
}

const nut = new THREE.Mesh(new THREE.BoxGeometry(.41,.06,.06), fretMat);
nut.position.set(0,4.17,.49);
scene.add(nut);

for (let i=0;i<6;i++) {
  const x = -.16+i*.064;
  const points = [
    new THREE.Vector3(x,-1.88,.575),
    new THREE.Vector3(x*.96,1.0,.55),
    new THREE.Vector3(x*.77,4.2,.56),
    new THREE.Vector3(x*.92,4.78,.55)
  ];
  const string = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points),24,.009+(5-i)*.001,6,false),stringMat);
  string.castShadow = true;
  scene.add(string);
}

const floor = new THREE.Mesh(new THREE.CircleGeometry(12,64), new THREE.MeshStandardMaterial({color:0x211610,roughness:.88}));
floor.rotation.x = -Math.PI/2;
floor.position.y = -3.72;
floor.receiveShadow = true;
scene.add(floor);

const halo = new THREE.Mesh(new THREE.CircleGeometry(4.8,64), new THREE.MeshBasicMaterial({color:0x684021,transparent:true,opacity:.13}));
halo.rotation.x = -Math.PI/2;
halo.position.y = -3.7;
scene.add(halo);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
