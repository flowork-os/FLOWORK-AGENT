<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chunky Sci-Fi Mecha</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050911;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050911);
    scene.fog = new THREE.Fog(0x050911, 18, 34);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(10, 7.8, 14);
    camera.lookAt(0, 4.2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.7;
    controls.target.set(0, 4.2, 0);
    controls.minDistance = 9;
    controls.maxDistance = 24;
    controls.maxPolarAngle = Math.PI * 0.49;

    const hemi = new THREE.HemisphereLight(0x9fc7ff, 0x11141c, 1.8);
    scene.add(hemi);

    const keyLight = new THREE.DirectionalLight(0xe5f1ff, 4.2);
    keyLight.position.set(7, 14, 10);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -10;
    keyLight.shadow.camera.right = 10;
    keyLight.shadow.camera.top = 15;
    keyLight.shadow.camera.bottom = -3;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 35;
    scene.add(keyLight);

    const rimLight = new THREE.PointLight(0x198cff, 18, 16, 2);
    rimLight.position.set(-7, 7, -4);
    scene.add(rimLight);

    const warmLight = new THREE.PointLight(0xffac32, 10, 11, 2);
    warmLight.position.set(5, 4, 4);
    scene.add(warmLight);

    const floorMat = new THREE.MeshStandardMaterial({
      color: 0x0a1019,
      metalness: 0.72,
      roughness: 0.54
    });
    const floor = new THREE.Mesh(new THREE.CylinderGeometry(8.5, 8.5, 0.35, 64), floorMat);
    floor.position.y = -0.18;
    floor.receiveShadow = true;
    scene.add(floor);

    const ringMat = new THREE.MeshStandardMaterial({
      color: 0x14283c,
      emissive: 0x0876c7,
      emissiveIntensity: 2.4,
      metalness: 0.55,
      roughness: 0.35
    });
    const floorRing = new THREE.Mesh(new THREE.TorusGeometry(6.7, 0.045, 10, 96), ringMat);
    floorRing.rotation.x = Math.PI / 2;
    floorRing.position.y = 0.01;
    scene.add(floorRing);

    const armor = new THREE.MeshStandardMaterial({
      color: 0x68727d,
      metalness: 0.86,
      roughness: 0.28
    });
    const armorLight = new THREE.MeshStandardMaterial({
      color: 0xaab3b9,
      metalness: 0.78,
      roughness: 0.3
    });
    const armorDark = new THREE.MeshStandardMaterial({
      color: 0x252e38,
      metalness: 0.8,
      roughness: 0.34
    });
    const black = new THREE.MeshStandardMaterial({
      color: 0x0b1118,
      metalness: 0.65,
      roughness: 0.38
    });
    const yellow = new THREE.MeshStandardMaterial({
      color: 0xffb72d,
      emissive: 0x552800,
      emissiveIntensity: 0.32,
      metalness: 0.62,
      roughness: 0.3
    });
    const blue = new THREE.MeshStandardMaterial({
      color: 0x55d8ff,
      emissive: 0x008dff,
      emissiveIntensity: 4.5,
      metalness: 0.25,
      roughness: 0.18
    });
    const blueDark = new THREE.MeshStandardMaterial({
      color: 0x0b6caa,
      emissive: 0x004c9b,
      emissiveIntensity: 2.6,
      metalness: 0.5,
      roughness: 0.24
    });
    const red = new THREE.MeshStandardMaterial({
      color: 0xff4351,
      emissive: 0xc20d28,
      emissiveIntensity: 3.2,
      metalness: 0.35,
      roughness: 0.2
    });

    const mech = new THREE.Group();
    mech.position.y = 0.05;
    scene.add(mech);

    function addBox(parent, width, height, depth, material, x, y, z, rx = 0, ry = 0, rz = 0) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
      mesh.position.set(x, y, z);
      mesh.rotation.set(rx, ry, rz);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder(parent, radiusTop, radiusBottom, height, material, x, y, z, rx = 0, ry = 0, rz = 0, segments = 16) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments), material);
      mesh.position.set(x, y, z);
      mesh.rotation.set(rx, ry, rz);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addSphere(parent, radius, material, x, y, z, sx = 1, sy = 1, sz = 1) {
      const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 24, 16), material);
      mesh.position.set(x, y, z);
      mesh.scale.set(sx, sy, sz);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addPanel(parent, width, height, depth, x, y, z, material = armorDark, rz = 0) {
      return addBox(parent, width, height, depth, material, x, y, z, 0, 0, rz);
    }

    function addHazardStripes(parent, x, y, z, width, height, depth, rotation = 0) {
      for (let stripeIndex = -2; stripeIndex <= 2; stripeIndex++) {
        addBox(parent, 0.13, height, depth + 0.012, yellow, x + stripeIndex * 0.32, y, z, 0, 0, rotation);
      }
    }

    const pelvis = new THREE.Group();
    mech.add(pelvis);
    addBox(pelvis, 2.8, 0.72, 1.7, armorDark, 0, 3.05, 0);
    addBox(pelvis, 2.35, 0.62, 1.88, armor, 0, 3.23, 0);
    addBox(pelvis, 1.18, 0.3, 1.98, black, 0, 3.48, 0);
    addBox(pelvis, 0.62, 0.42, 1.99, yellow, 0, 3.71, 0);
    addPanel(pelvis, 0.78, 0.22, 2.02, -0.9, 3.58, 0, armorLight, -0.04);
    addPanel(pelvis, 0.78, 0.22, 2.02, 0.9, 3.58, 0, armorLight, 0.04);

    const torso = new THREE.Group();
    mech.add(torso);
    addBox(torso, 4.55, 2.75, 2.1, armorDark, 0, 4.8, 0);
    addBox(torso, 4.1, 2.35, 2.38, armor, 0, 4.9, 0);
    addBox(torso, 3.4, 1.92, 2.48, armorLight, 0, 5.18, 0);
    addBox(torso, 3.52, 0.25, 2.51, black, 0, 4.18, 0);
    addBox(torso, 3.35, 0.18, 2.52, black, 0, 5.98, 0);

    addPanel(torso, 0.22, 1.58, 2.57, -1.63, 5.08, 0, armorDark, -0.06);
    addPanel(torso, 0.22, 1.58, 2.57, 1.63, 5.08, 0, armorDark, 0.06);
    addPanel(torso, 0.18, 1.2, 2.6, -1.05, 5.12, 0.02, armorLight, -0.07);
    addPanel(torso, 0.18, 1.2, 2.6, 1.05, 5.12, 0.02, armorLight, 0.07);

    addBox(torso, 1.7, 1.28, 0.16, black, 0, 5.13, 1.29);
    addBox(torso, 1.32, 0.92, 0.18, blueDark, 0, 5.15, 1.4);
    addCylinder(torso, 0.58, 0.58, 0.2, blue, 0, 5.15, 1.53, Math.PI / 2, 0, 0, 32);
    addCylinder(torso, 0.37, 0.37, 0.22, armorLight, 0, 5.15, 1.67, Math.PI / 2, 0, 0, 24);
    addCylinder(torso, 0.25, 0.25, 0.25, blue, 0, 5.15, 1.82, Math.PI / 2, 0, 0, 24);

    addBox(torso, 0.36, 0.17, 0.2, blue, -1.2, 4.53, 1.3);
    addBox(torso, 0.36, 0.17, 0.2, blue, 1.2, 4.53, 1.3);
    addHazardStripes(torso, 0, 4.0, 1.29, 1.5, 0.42, 0.06, 0.08);

    const neck = new THREE.Group();
    mech.add(neck);
    addCylinder(neck, 0.56, 0.64, 0.52, black, 0, 6.42, 0, 0, 0, 0, 16);
    addBox(neck, 1.35, 0.22, 1.12, blueDark, 0, 6.55, 0);

    const head = new THREE.Group();
    mech.add(head);
    addBox(head, 2.35, 1.55, 1.72, armorDark, 0, 7.35, 0);
    addBox(head, 2.02, 1.32, 1.86, armorLight, 0, 7.47, 0);
    addBox(head, 1.72, 0.62, 1.96, black, 0, 7.43, 0.08);
    addBox(head, 1.48, 0.27, 0.12, blue, 0, 7.48, 1.04);
    addBox(head, 1.1, 0.12, 0.14, blue, 0, 7.7, 1.03);
    addBox(head, 0.32, 0.85, 0.2, armorDark, -1.05, 7.45, 0);
    addBox(head, 0.32, 0.85, 0.2, armorDark, 1.05, 7.45, 0);
    addBox(head, 0.32, 0.3, 1.98, yellow, -0.78, 8.08, 0);
    addBox(head, 0.32, 0.3, 1.98, yellow, 0.78, 8.08, 0);
    addCylinder(head, 0.07, 0.07, 1.2, yellow, 0.55, 8.55, 0, 0, 0, -0.16, 12);
    addSphere(head, 0.12, red, 0.45, 9.14, 0);

    function createArm(side) {
      const arm = new THREE.Group();
      mech.add(arm);
      const sx = side * 1;
      const outer = side * 3.0;
      addCylinder(arm, 0.68, 0.76, 0.56, black, outer, 6.02, 0, 0, 0, Math.PI / 2, 18);
      addBox(arm, 1.35, 1.5, 1.85, armorDark, side * 2.73, 5.8, 0);
      addBox(arm, 1.22, 1.24, 1.9, armor, side * 2.84, 5.85, 0);
      addBox(arm, 0.72, 1.05, 1.95, armorLight, side * 3.12, 5.83, 0);
      addPanel(arm, 0.15, 0.8, 1.98, side * 3.5, 5.83, 0, black);
      addBox(arm, 0.82, 1.75, 1.18, armorDark, side * 2.93, 4.34, 0);
      addBox(arm, 0.96, 1.3, 1.3, armor, side * 3.0, 4.25, 0);
      addBox(arm, 0.45, 0.92, 1.38, armorLight, side * 3.42, 4.25, 0);
      addCylinder(arm, 0.52, 0.52, 0.42, black, side * 3.04, 3.28, 0, 0, 0, Math.PI / 2, 16);
      addBox(arm, 0.95, 0.72, 1.14, armorDark, side * 3.02, 2.56, 0);
      addBox(arm, 0.82, 0.58, 1.04, armor, side * 3.02, 2.18, 0);
      addBox(arm, 0.34, 0.78, 0.78, black, side * 3.02, 1.82, 0);
      addBox(arm, 0.92, 0.46, 1.05, armorDark, side * 3.02, 1.43, 0);
      addBox(arm, 0.72, 0.72, 0.98, armor, side * 3.02, 0.96, 0);
      addBox(arm, 0.96, 0.24, 1.1, yellow, side * 3.02, 1.67, 0);
      addBox(arm, 0.18, 0.48, 0.2, blue, side * 3.52, 4.32, 0);
      addBox(arm, 0.16, 0.5, 0.2, blue, side * 3.52, 2.48, 0);
      addPanel(arm, 0.55, 0.12, 0.9, side * 3.02, 4.9, 0.67, yellow, side * 0.06);
      return arm;
    }

    createArm(-1);
    createArm(1);

    function createLeg(side) {
      const leg = new THREE.Group();
      mech.add(leg);
      const x = side * 1.16;
      addBox(leg, 1.42, 0.78, 1.55, armorDark, x, 2.55, 0);
      addBox(leg, 1.2, 0.62, 1.72, armor, x, 2.38, 0);
      addBox(leg, 0.42, 0.28, 1.78, black, x, 2.04, 0);
      addBox(leg, 1.45, 2.05, 1.56, armorDark, x, 1.15, 0);
      addBox(leg, 1.15, 1.78, 1.72, armor, x, 1.18, 0);
      addBox(leg, 0.72, 1.48, 1.8, armorLight, x, 1.18, 0.05);
      addBox(leg, 0.3, 1.4, 1.84, black, x, 1.16, 0.76);
      addBox(leg, 1.24, 0.35, 1.82, yellow, x, 1.86, 0);
      addBox(leg, 1.0, 0.28, 1.86, armorDark, x, 0.28, 0);
      addBox(leg, 1.68, 0.42, 2.65, armorDark, x, 0.04, 0.28);
      addBox(leg, 1.48, 0.28, 2.4, armor, x, 0.28, 0.36);
      addBox(leg, 1.08, 0.12, 2.12, black, x, 0.45, 0.52);
      addBox(leg, 0.24, 0.18, 1.92, blue, x, 0.48, -0.54);
      addBox(leg, 0.72, 0.15, 0.12, blue, x, 1.45, 0.93);
      addBox(leg, 0.42, 0.16, 0.14, yellow, x, 0.64, 1.14);
      return leg;
    }

    createLeg(-1);
    createLeg(1);

    const shoulderBars = new THREE.Group();
    mech.add(shoulderBars);
    addBox(shoulderBars, 6.5, 0.34, 1.08, black, 0, 6.36, 0);
    addBox(shoulderBars, 5.65, 0.22, 1.26, armorLight, 0, 6.51, 0);
    addBox(shoulderBars, 0.22, 0.5, 1.35, yellow, -2.42, 6.53, 0);
    addBox(shoulderBars, 0.22, 0.5, 1.35, yellow, 2.42, 6.53, 0);

    const shoulderGlowLeft = new THREE.PointLight(0x168eff, 4, 3, 2);
    shoulderGlowLeft.position.set(-3.45, 5.9, 1.1);
    mech.add(shoulderGlowLeft);
    const shoulderGlowRight = new THREE.PointLight(0x168eff, 4, 3, 2);
    shoulderGlowRight.position.set(3.45, 5.9, 1.1);
    mech.add(shoulderGlowRight);

    const backSpine = new THREE.Group();
    mech.add(backSpine);
    addBox(backSpine, 1.05, 2.5, 0.32, armorDark, 0, 5.1, -1.3);
    addBox(backSpine, 0.52, 1.7, 0.16, blueDark, 0, 5.18, -1.5);
    addBox(backSpine, 1.55, 0.18, 0.18, blue, 0, 5.78, -1.52);
    addBox(backSpine, 1.55, 0.18, 0.18, blue, 0, 4.7, -1.52);

    const antennaBase = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.25, 12), black);
    antennaBase.position.set(-0.55, 8.38, 0.05);
    antennaBase.castShadow = true;
    mech.add(antennaBase);

    const antennaRod = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.055, 1.05, 10), yellow);
    antennaRod.position.set(-0.7, 8.92, 0.05);
    antennaRod.rotation.z = -0.2;
    antennaRod.castShadow = true;
    mech.add(antennaRod);

    const antennaTip = new THREE.Mesh(new THREE.SphereGeometry(0.1, 14, 10), red);
    antennaTip.position.set(-0.81, 9.43, 0.05);
    antennaTip.castShadow = true;
    mech.add(antennaTip);

    const sideLights = new THREE.Group();
    mech.add(sideLights);
    addBox(sideLights, 0.14, 0.42, 0.28, blue, -2.12, 5.55, 1.25);
    addBox(sideLights, 0.14, 0.42, 0.28, blue, 2.12, 5.55, 1.25);

    const exhaustLeft = addCylinder(mech, 0.24, 0.31, 0.5, black, -1.7, 4.72, -1.52, Math.PI / 2, 0, 0, 16);
    const exhaustRight = addCylinder(mech, 0.24, 0.31, 0.5, black, 1.7, 4.72, -1.52, Math.PI / 2, 0, 0, 16);
    addCylinder(mech, 0.14, 0.14, 0.08, blue, -1.7, 4.72, -1.82, Math.PI / 2, 0, 0, 16);
    addCylinder(mech, 0.14, 0.14, 0.08, blue, 1.7, 4.72, -1.82, Math.PI / 2, 0, 0, 16);

    const floorLight = new THREE.PointLight(0x087dff, 5, 8, 2);
    floorLight.position.set(0, 0.5, 1.5);
    scene.add(floorLight);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
