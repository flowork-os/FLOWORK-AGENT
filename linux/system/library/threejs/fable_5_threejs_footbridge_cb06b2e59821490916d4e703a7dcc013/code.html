<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedestrian Footbridge</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #cfd8dc; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- Renderer / Scene / Camera ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdce8f0);
scene.fog = new THREE.Fog(0xdce8f0, 40, 110);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 300);
camera.position.set(14, 8, 18);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.6, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 6;
controls.maxDistance = 60;

// ---------- Lights ----------
const sun = new THREE.DirectionalLight(0xfff2e0, 2.6);
sun.position.set(14, 22, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -18;
sun.shadow.camera.right = 18;
sun.shadow.camera.top = 18;
sun.shadow.camera.bottom = -18;
sun.shadow.camera.near = 4;
sun.shadow.camera.far = 60;
sun.shadow.bias = -0.0004;
sun.shadow.radius = 4;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbcd4e6, 0x8a7f6a, 0.9));
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.5);
fill.position.set(-12, 8, -14);
scene.add(fill);

// ---------- Materials ----------
const steelMat = new THREE.MeshStandardMaterial({ color: 0x3d6e52, metalness: 0.55, roughness: 0.45 }); // painted truss steel
const railMat  = new THREE.MeshStandardMaterial({ color: 0x9aa4ab, metalness: 0.8,  roughness: 0.35 }); // galvanized rail
const deckMat  = new THREE.MeshStandardMaterial({ color: 0x8a6a48, roughness: 0.85, metalness: 0.05 }); // timber deck
const concMat  = new THREE.MeshStandardMaterial({ color: 0xb9b6ae, roughness: 0.95, metalness: 0.0  }); // concrete abutment
const groundMat = new THREE.MeshStandardMaterial({ color: 0xa8b58e, roughness: 1.0 });

// ---------- Bridge (meters, centered on origin, span along X) ----------
const bridge = new THREE.Group();
scene.add(bridge);

const SPAN = 12;          // clear span between abutments
const WIDTH = 2.4;        // deck width
const PANELS = 6;         // truss panels
const PANEL = SPAN / PANELS;
const DECK_Y = 1.5;       // top of deck above ground
const TRUSS_H = 1.35;     // half-through truss height above deck
const CHORD = 0.16;       // chord section size
const halfW = WIDTH / 2;

function box(w, h, d, mat, x, y, z, ry = 0, rz = 0) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.rotation.y = ry; m.rotation.z = rz;
  m.castShadow = m.receiveShadow = true;
  bridge.add(m);
  return m;
}

// --- Abutments (concrete blocks at each end, deck bears on top) ---
for (const s of [-1, 1]) {
  box(1.6, DECK_Y - 0.12, 3.2, concMat, s * (SPAN / 2 + 0.8), (DECK_Y - 0.12) / 2, 0);
  // wing walls
  box(0.3, DECK_Y + 0.35, 3.6, concMat, s * (SPAN / 2 + 1.55), (DECK_Y + 0.35) / 2, 0);
}

// --- Main girders / bottom chords (run full span, sit on abutments) ---
const botY = DECK_Y - 0.22;
for (const z of [-halfW, halfW]) {
  box(SPAN + 1.6, CHORD * 1.4, CHORD, steelMat, 0, botY, z);
}

// --- Floor beams (transverse, under deck, at every panel point) ---
for (let i = 0; i <= PANELS; i++) {
  const x = -SPAN / 2 + i * PANEL;
  box(0.12, 0.18, WIDTH + 0.1, steelMat, x, botY, 0);
}

// --- Timber deck planks ---
const plankN = Math.floor(SPAN / 0.32);
for (let i = 0; i < plankN; i++) {
  const x = -SPAN / 2 + 0.16 + i * (SPAN / plankN);
  const p = box(SPAN / plankN - 0.025, 0.05, WIDTH - 0.06, deckMat, x, DECK_Y - 0.09, 0);
  p.material = deckMat;
}
// kerb / edge stringers
for (const z of [-halfW + 0.09, halfW - 0.09]) {
  box(SPAN, 0.09, 0.09, deckMat, 0, DECK_Y - 0.02, z);
}

// --- Half-through Pratt truss on each side ---
const topY = DECK_Y + TRUSS_H;
for (const z of [-halfW, halfW]) {
  // top chord (between end posts)
  box(SPAN - 2 * PANEL + CHORD, CHORD, CHORD, steelMat, 0, topY, z);
  // verticals at interior panel points
  for (let i = 1; i < PANELS; i++) {
    const x = -SPAN / 2 + i * PANEL;
    box(CHORD * 0.75, TRUSS_H - 0.2, CHORD * 0.75, steelMat, x, (botY + topY) / 2 + 0.1, z);
  }
  // inclined end posts
  const endLen = Math.hypot(PANEL, TRUSS_H);
  const endAng = Math.atan2(TRUSS_H, PANEL);
  for (const s of [-1, 1]) {
    box(endLen, CHORD, CHORD, steelMat,
        s * (SPAN / 2 - PANEL / 2), (botY + topY) / 2 + 0.1, z, 0, s * endAng);
  }
  // diagonals (Pratt: slope down toward midspan, carry tension)
  const dLen = Math.hypot(PANEL, TRUSS_H - 0.15);
  const dAng = Math.atan2(TRUSS_H - 0.15, PANEL);
  for (let i = 1; i < PANELS - 1; i++) {
    const x0 = -SPAN / 2 + i * PANEL;
    const toward = (x0 + PANEL / 2) < 0 ? 1 : -1; // lean toward center
    if (i === PANELS / 2) continue;               // skip center panel (verticals suffice)
    box(dLen, CHORD * 0.6, CHORD * 0.6, steelMat,
        x0 + PANEL / 2, (botY + topY) / 2 + 0.05, z, 0, toward * dAng);
  }
}

// --- Top lateral bracing (portal struts between trusses) ---
for (let i = 1; i < PANELS; i++) {
  const x = -SPAN / 2 + i * PANEL;
  box(0.1, 0.1, WIDTH, steelMat, x, topY, 0);
}

// --- Railings (handrail + midrail + posts, mounted inside trusses) ---
const railY = DECK_Y + 1.05;
for (const z of [-halfW + 0.12, halfW - 0.12]) {
  box(SPAN, 0.05, 0.05, railMat, 0, railY, z);          // handrail
  box(SPAN, 0.035, 0.035, railMat, 0, railY - 0.45, z); // midrail
  const postN = PANELS * 2;
  for (let i = 0; i <= postN; i++) {
    const x = -SPAN / 2 + i * (SPAN / postN);
    box(0.04, railY - DECK_Y + 0.05, 0.04, railMat, x, (railY + DECK_Y) / 2, z);
  }
}

// ---------- Ground ----------
const ground = new THREE.Mesh(new THREE.CircleGeometry(50, 64), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// gentle stream depression hint under the span
const stream = new THREE.Mesh(
  new THREE.PlaneGeometry(7, 100),
  new THREE.MeshStandardMaterial({ color: 0x6f95a8, roughness: 0.25, metalness: 0.1 })
);
stream.rotation.x = -Math.PI / 2;
stream.position.y = 0.02;
stream.receiveShadow = true;
scene.add(stream);

// soft contact shadow disc
const shadowTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 20, 128, 128, 128);
  grad.addColorStop(0, 'rgba(0,0,0,0.35)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(c);
})();
const softShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(SPAN + 8, WIDTH + 8),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
);
softShadow.rotation.x = -Math.PI / 2;
softShadow.position.y = 0.03;
scene.add(softShadow);

// ---------- Resize / Loop ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
