<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cluster Mailbox Unit</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: linear-gradient(#b9c8d4, #e3e5df);
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 20px;
      bottom: 18px;
      color: rgba(25, 32, 35, 0.72);
      font-size: 12px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Community Mail Station</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xc6d3dc);
    scene.fog = new THREE.Fog(0xc6d3dc, 22, 52);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(9.8, 7.1, 12.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.5, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.45;
    controls.minDistance = 8;
    controls.maxDistance = 24;
    controls.maxPolarAngle = Math.PI * 0.48;

    const hemi = new THREE.HemisphereLight(0xeaf5ff, 0x59604f, 2.25);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff3d9, 4.1);
    sun.position.set(-8, 13, 7);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -11;
    sun.shadow.camera.right = 11;
    sun.shadow.camera.top = 12;
    sun.shadow.camera.bottom = -7;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 35;
    sun.shadow.bias = -0.00025;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xb9d7ee, 1.25);
    fill.position.set(8, 7, -6);
    scene.add(fill);

    const postalGrey = new THREE.MeshStandardMaterial({
      color: 0x737d80,
      roughness: 0.56,
      metalness: 0.72
    });
    const frameGrey = new THREE.MeshStandardMaterial({
      color: 0x626b6e,
      roughness: 0.48,
      metalness: 0.78
    });
    const doorGrey = new THREE.MeshStandardMaterial({
      color: 0x858f91,
      roughness: 0.45,
      metalness: 0.76
    });
    const edgeDark = new THREE.MeshStandardMaterial({
      color: 0x262b2c,
      roughness: 0.4,
      metalness: 0.82
    });
    const insetDark = new THREE.MeshStandardMaterial({
      color: 0x151a1b,
      roughness: 0.7,
      metalness: 0.35
    });
    const brushedMetal = new THREE.MeshStandardMaterial({
      color: 0xc1c8c7,
      roughness: 0.24,
      metalness: 0.95
    });
    const concreteMaterial = new THREE.MeshStandardMaterial({
      color: 0xa8aaa3,
      roughness: 0.96,
      metalness: 0
    });
    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x7f8c70,
      roughness: 1
    });

    function mesh(geometry, material, x, y, z, cast = true, receive = true) {
      const object = new THREE.Mesh(geometry, material);
      object.position.set(x, y, z);
      object.castShadow = cast;
      object.receiveShadow = receive;
      scene.add(object);
      return object;
    }

    const ground = mesh(new THREE.PlaneGeometry(70, 70), groundMaterial, 0, 0, 0, false, true);
    ground.rotation.x = -Math.PI / 2;

    const pad = mesh(
      new RoundedBoxGeometry(8.2, 0.24, 5.2, 3, 0.12),
      concreteMaterial,
      0, 0.11, 0.25,
      false, true
    );

    const pedestalFoot = mesh(
      new RoundedBoxGeometry(2.55, 0.34, 1.72, 4, 0.12),
      frameGrey,
      0, 0.46, 0
    );
    const pedestal = mesh(
      new RoundedBoxGeometry(1.72, 2.05, 1.18, 5, 0.12),
      postalGrey,
      0, 1.55, 0
    );
    const pedestalNeck = mesh(
      new RoundedBoxGeometry(2.35, 0.28, 1.38, 4, 0.09),
      frameGrey,
      0, 2.57, 0
    );

    const bodyWidth = 6.2;
    const bodyHeight = 4.75;
    const bodyDepth = 1.35;
    const bodyCenterY = 4.86;
    const bodyFrontZ = 0.72;

    mesh(
      new RoundedBoxGeometry(bodyWidth, bodyHeight, bodyDepth, 6, 0.13),
      postalGrey,
      0, bodyCenterY, 0
    );

    mesh(
      new RoundedBoxGeometry(5.94, 4.38, 0.15, 3, 0.035),
      frameGrey,
      0, bodyCenterY - 0.04, bodyFrontZ
    );

    const topHeader = mesh(
      new RoundedBoxGeometry(5.74, 0.43, 0.09, 3, 0.035),
      doorGrey,
      0, 6.73, bodyFrontZ + 0.105
    );

    const emblemRing = mesh(
      new THREE.TorusGeometry(0.11, 0.022, 12, 28),
      brushedMetal,
      0, 6.73, bodyFrontZ + 0.172
    );
    emblemRing.rotation.x = Math.PI / 2;

    const emblemBar = mesh(
      new RoundedBoxGeometry(0.24, 0.04, 0.025, 2, 0.012),
      brushedMetal,
      0, 6.73, bodyFrontZ + 0.186
    );

    function addLock(x, y, z, scale = 1) {
      const escutcheon = mesh(
        new THREE.CylinderGeometry(0.07 * scale, 0.07 * scale, 0.026, 20),
        edgeDark, x, y, z
      );
      escutcheon.rotation.x = Math.PI / 2;

      const core = mesh(
        new THREE.CylinderGeometry(0.038 * scale, 0.038 * scale, 0.032, 18),
        brushedMetal, x, y, z + 0.018
      );
      core.rotation.x = Math.PI / 2;

      const slot = mesh(
        new RoundedBoxGeometry(0.012 * scale, 0.049 * scale, 0.008, 2, 0.004),
        insetDark, x, y, z + 0.04
      );
      slot.rotation.z = 0.14;
    }

    function addHandle(x, y, z, wide = false) {
      const width = wide ? 0.43 : 0.29;
      mesh(
        new RoundedBoxGeometry(width, 0.055, 0.07, 3, 0.022),
        brushedMetal, x, y, z
      );
      mesh(
        new RoundedBoxGeometry(0.045, 0.10, 0.06, 2, 0.014),
        edgeDark, x - width * 0.39, y - 0.01, z - 0.018
      );
      mesh(
        new RoundedBoxGeometry(0.045, 0.10, 0.06, 2, 0.014),
        edgeDark, x + width * 0.39, y - 0.01, z - 0.018
      );
    }

    function addDoor(x, y, width, height, parcel = false) {
      mesh(
        new RoundedBoxGeometry(width + 0.055, height + 0.055, 0.052, 2, 0.018),
        insetDark, x, y, bodyFrontZ + 0.11
      );
      mesh(
        new RoundedBoxGeometry(width, height, 0.074, 3, 0.022),
        doorGrey, x, y, bodyFrontZ + 0.145
      );

      const hingeX = x - width * 0.5 + 0.045;
      const hingeTop = y + height * 0.5 - 0.12;
      const hingeBottom = y - height * 0.5 + 0.12;
      mesh(
        new RoundedBoxGeometry(0.025, parcel ? 0.18 : 0.12, 0.025, 2, 0.008),
        brushedMetal, hingeX, hingeTop, bodyFrontZ + 0.198
      );
      mesh(
        new RoundedBoxGeometry(0.025, parcel ? 0.18 : 0.12, 0.025, 2, 0.008),
        brushedMetal, hingeX, hingeBottom, bodyFrontZ + 0.198
      );

      const hardwareX = x + width * 0.5 - (parcel ? 0.20 : 0.15);
      addLock(hardwareX, y + (parcel ? 0.15 : 0.06), bodyFrontZ + 0.205, parcel ? 1.15 : 0.86);
      addHandle(hardwareX - (parcel ? 0.13 : 0.10), y - (parcel ? 0.16 : 0.10), bodyFrontZ + 0.24, parcel);
    }

    const smallColumns = 8;
    const smallRows = 4;
    const smallWidth = 0.675;
    const smallHeight = 0.68;
    const smallGapX = 0.045;
    const smallGapY = 0.055;
    const smallTotalWidth = smallColumns * smallWidth + (smallColumns - 1) * smallGapX;
    const smallStartX = -smallTotalWidth * 0.5 + smallWidth * 0.5;
    const topRowY = 6.18;

    for (let row = 0; row < smallRows; row++) {
      for (let column = 0; column < smallColumns; column++) {
        const x = smallStartX + column * (smallWidth + smallGapX);
        const y = topRowY - row * (smallHeight + smallGapY);
        addDoor(x, y, smallWidth, smallHeight, false);
      }
    }

    const parcelWidth = 2.76;
    const parcelHeight = 1.05;
    addDoor(-1.42, 3.39, parcelWidth, parcelHeight, true);
    addDoor(1.42, 3.39, parcelWidth, parcelHeight, true);

    const lowerStrip = mesh(
      new RoundedBoxGeometry(5.74, 0.22, 0.075, 3, 0.025),
      doorGrey,
      0, 2.75, bodyFrontZ + 0.135
    );

    const sideVentMaterial = new THREE.MeshStandardMaterial({
      color: 0x3e4648,
      roughness: 0.55,
      metalness: 0.75
    });
    for (let i = 0; i < 5; i++) {
      const vent = mesh(
        new RoundedBoxGeometry(0.62, 0.035, 0.035, 2, 0.012),
        sideVentMaterial,
        3.105, 3.06 + i * 0.13, 0
      );
      vent.rotation.y = Math.PI / 2;
    }

    const roofY = 7.48;
    const roofLength = 3.65;
    const roofThickness = 0.16;
    const roofAngle = Math.atan2(0.58, 3.32);
    const roofPanelGeometry = new RoundedBoxGeometry(3.62, roofThickness, 1.72, 4, 0.065);

    const leftRoof = mesh(roofPanelGeometry, postalGrey, -1.69, roofY, 0);
    leftRoof.rotation.z = roofAngle;
    leftRoof.position.y = roofY - 0.29;

    const rightRoof = mesh(roofPanelGeometry, postalGrey, 1.69, roofY, 0);
    rightRoof.rotation.z = -roofAngle;
    rightRoof.position.y = roofY - 0.29;

    mesh(
      new RoundedBoxGeometry(0.18, 0.22, 1.82, 3, 0.045),
      frameGrey,
      0, roofY + 0.04, 0
    );

    const roofFrontShape = new THREE.Shape();
    roofFrontShape.moveTo(-3.28, 0);
    roofFrontShape.lineTo(0, 0.62);
    roofFrontShape.lineTo(3.28, 0);
    roofFrontShape.lineTo(3.28, -0.10);
    roofFrontShape.lineTo(0, 0.49);
    roofFrontShape.lineTo(-3.28, -0.10);
    roofFrontShape.closePath();
    const roofFrontGeometry = new THREE.ExtrudeGeometry(roofFrontShape, {
      depth: 0.11,
      bevelEnabled: false
    });
    roofFrontGeometry.translate(0, 0, -0.055);
    mesh(roofFrontGeometry, frameGrey, 0, roofY - 0.31, 0.91);

    const rearCap = mesh(roofFrontGeometry, frameGrey, 0, roofY - 0.31, -0.91);
    rearCap.rotation.y = Math.PI;

    const bollardMaterial = new THREE.MeshStandardMaterial({
      color: 0x4d5554,
      roughness: 0.58,
      metalness: 0.7
    });
    for (const x of [-3.7, 3.7]) {
      const bollard = mesh(
        new THREE.CylinderGeometry(0.13, 0.15, 1.05, 24),
        bollardMaterial,
        x, 0.67, 1.46
      );
      mesh(
        new THREE.SphereGeometry(0.13, 20, 12),
        bollardMaterial,
        x, 1.20, 1.46
      );
      const base = mesh(
        new THREE.CylinderGeometry(0.23, 0.23, 0.07, 24),
        edgeDark,
        x, 0.30, 1.46
      );
      base.receiveShadow = true;
    }

    const shrubMaterial = new THREE.MeshStandardMaterial({
      color: 0x526b46,
      roughness: 1
    });
    const shrubDarkMaterial = new THREE.MeshStandardMaterial({
      color: 0x405b3c,
      roughness: 1
    });
    const shrubPositions = [
      [-4.7, -0.7, 0.55], [-5.1, 0.2, 0.42], [-4.55, 0.55, 0.48],
      [4.65, -0.65, 0.52], [5.05, 0.15, 0.40], [4.55, 0.62, 0.46]
    ];
    shrubPositions.forEach((position, index) => {
      const shrub = mesh(
        new THREE.IcosahedronGeometry(position[3], 2),
        index % 2 ? shrubDarkMaterial : shrubMaterial,
        position[0], position[3] + 0.22, position[1],
        true, true
      );
      shrub.scale.set(1.35, 0.9, 1.1);
    });

    const pathMaterial = new THREE.MeshStandardMaterial({
      color: 0xbab8ae,
      roughness: 1
    });
    const path = mesh(new THREE.PlaneGeometry(4.4, 18), pathMaterial, 0, 0.012, 8.1, false, true);
    path.rotation.x = -Math.PI / 2;

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
