<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Knight</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #d9e0e3; }
canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9e0e3);
scene.fog = new THREE.Fog(0xd9e0e3, 12, 25);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.2, 6.8, 11.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.065;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.25;
controls.target.set(0, 3.25, 0);
controls.minDistance = 7;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.48;

scene.add(new THREE.HemisphereLight(0xf7fbff, 0x7e8790, 2.2));

const keyLight = new THREE.DirectionalLight(0xffffff, 4.2);
keyLight.position.set(5, 10, 8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 10;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x9db9d8, 1.4);
fillLight.position.set(-7, 5, 4);
scene.add(fillLight);

const blue = new THREE.MeshStandardMaterial({ color: 0x174b83, roughness: 0.25, metalness: 0.02 });
const darkBlue = new THREE.MeshStandardMaterial({ color: 0x102e54, roughness: 0.23 });
const yellow = new THREE.MeshStandardMaterial({ color: 0xf3bd32, roughness: 0.3 });
const gold = new THREE.MeshStandardMaterial({ color: 0xd9941f, roughness: 0.24, metalness: 0.05 });
const red = new THREE.MeshStandardMaterial({ color: 0xb52f2a, roughness: 0.28 });
const gray = new THREE.MeshStandardMaterial({ color: 0x78838a, roughness: 0.3, metalness: 0.28 });
const darkGray = new THREE.MeshStandardMaterial({ color: 0x3f4a50, roughness: 0.28, metalness: 0.35 });
const black = new THREE.MeshStandardMaterial({ color: 0x11161a, roughness: 0.2 });
const floorMat = new THREE.MeshStandardMaterial({ color: 0xc5cdd0, roughness: 0.8 });

function mesh(geometry, material, position = [0, 0, 0], rotation = [0, 0, 0]) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(...position);
  object.rotation.set(...rotation);
  object.castShadow = true;
  object.receiveShadow = true;
  return object;
}

function box(w, h, d, material, position, rotation = [0, 0, 0]) {
  return mesh(new THREE.BoxGeometry(w, h, d), material, position, rotation);
}

function cylinder(radiusTop, radiusBottom, height, material, position, radial = 24) {
  return mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, radial), material, position);
}

function stud(x, y, z, material = blue, radius = 0.13, height = 0.075) {
  return cylinder(radius, radius, height, material, [x, y, z], 16);
}

function addBrickSeams(group, width, height, depth, material) {
  const seam = new THREE.MeshBasicMaterial({ color: 0x0b2744, transparent: true, opacity: 0.2 });
  group.add(box(width * 0.96, 0.018, depth + 0.006, seam, [0, height * 0.22, 0]));
  group.add(box(width * 0.96, 0.018, depth + 0.006, seam, [0, -height * 0.22, 0]));
}

const knight = new THREE.Group();
knight.position.y = 0.12;
scene.add(knight);

const feet = new THREE.Group();
feet.add(box(0.78, 0.56, 0.95, darkBlue, [-0.47, 0.42, 0]));
feet.add(box(0.78, 0.56, 0.95, darkBlue, [0.47, 0.42, 0]));
feet.add(stud(-0.47, 0.72, 0, darkBlue, 0.14));
feet.add(stud(0.47, 0.72, 0, darkBlue, 0.14));
knight.add(feet);

const legs = new THREE.Group();
legs.add(box(0.73, 1.45, 0.78, blue, [-0.47, 1.38, 0]));
legs.add(box(0.73, 1.45, 0.78, blue, [0.47, 1.38, 0]));
addBrickSeams(legs.children[0], 0.73, 1.45, 0.78, blue);
knight.add(legs);

const torso = new THREE.Group();
torso.add(box(1.68, 1.82, 0.88, blue, [0, 3.02, 0]));
torso.add(box(1.55, 0.34, 0.95, gold, [0, 3.44, 0.03]));
torso.add(box(1.55, 0.32, 0.95, gold, [0, 2.61, 0.03]));
torso.add(box(0.018, 1.35, 0.02, darkGray, [0, 3.02, 0.5]));
torso.add(box(0.72, 0.018, 0.02, darkGray, [0, 3.02, 0.5]));
torso.add(box(1.42, 0.06, 0.06, gold, [0, 3.88, 0]));
torso.add(stud(-0.58, 3.98, 0, blue, 0.14));
torso.add(stud(0.58, 3.98, 0, blue, 0.14));
addBrickSeams(torso, 1.68, 1.82, 0.88, blue);
knight.add(torso);

const arms = new THREE.Group();
arms.add(box(0.56, 1.42, 0.72, blue, [-1.18, 3.03, 0]));
arms.add(box(0.56, 1.42, 0.72, blue, [1.18, 3.03, 0]));
arms.add(stud(-1.18, 3.79, 0, blue, 0.13));
arms.add(stud(1.18, 3.79, 0, blue, 0.13));
arms.add(cylinder(0.29, 0.29, 0.16, darkGray, [-1.18, 2.29, 0], 20));
arms.add(cylinder(0.29, 0.29, 0.16, darkGray, [1.18, 2.29, 0], 20));
addBrickSeams(arms.children[0], 0.56, 1.42, 0.72, blue);
knight.add(arms);

const neck = cylinder(0.3, 0.3, 0.25, yellow, [0, 4.05, 0], 20);
knight.add(neck);

const head = new THREE.Group();
head.add(cylinder(0.67, 0.67, 1.05, yellow, [0, 4.72, 0], 32));
head.add(cylinder(0.66, 0.7, 0.14, yellow, [0, 4.19, 0], 32));
head.add(box(0.78, 0.22, 0.12, yellow, [0, 4.78, 0.61]));
knight.add(head);

const helmet = new THREE.Group();
helmet.add(cylinder(0.76, 0.72, 0.62, darkBlue, [0, 5.42, 0], 32));
helmet.add(cylinder(0.7, 0.58, 0.28, darkBlue, [0, 5.84, 0], 32));
helmet.add(cylinder(0.88, 0.88, 0.12, darkBlue, [0, 5.13, 0], 32));
helmet.add(box(0.92, 0.18, 0.18, gold, [0, 5.29, 0.68]));
helmet.add(box(0.18, 0.46, 0.18, gold, [0, 5.43, 0.68]));
helmet.add(stud(0, 6.04, 0, darkBlue, 0.16, 0.1));
knight.add(helmet);

function cClip(position, rotation = [Math.PI / 2, 0, 0]) {
  const hand = mesh(new THREE.TorusGeometry(0.22, 0.09, 12, 24, Math.PI * 1.45), darkGray, position, rotation);
  return hand;
}
knight.add(cClip([-1.18, 2.16, 0.25], [Math.PI / 2, 0, Math.PI]));
knight.add(cClip([1.18, 2.16, 0.25], [Math.PI / 2, 0, 0]));

const shieldShape = new THREE.Shape();
shieldShape.moveTo(-0.62, 0.5);
shieldShape.quadraticCurveTo(-0.62, 0.78, 0, 0.9);
shieldShape.quadraticCurveTo(0.62, 0.78, 0.62, 0.5);
shieldShape.lineTo(0.54, -0.45);
shieldShape.quadraticCurveTo(0, -0.84, 0, -0.84);
shieldShape.quadraticCurveTo(0, -0.84, -0.54, -0.45);
shieldShape.closePath();

const shieldGeo = new THREE.ExtrudeGeometry(shieldShape, {
  depth: 0.18,
  bevelEnabled: true,
  bevelSegments: 2,
  bevelSize: 0.045,
  bevelThickness: 0.035
});
shieldGeo.center();

const shield = new THREE.Group();
shield.add(mesh(shieldGeo, gray, [-1.78, 2.72, 0.62], [0, 0, 0.04]));
shield.add(box(0.12, 0.82, 0.055, gold, [-1.78, 2.72, 0.73]));
shield.add(box(0.74, 0.12, 0.055, gold, [-1.78, 2.72, 0.73]));
shield.add(cylinder(0.2, 0.2, 0.08, darkGray, [-1.78, 2.72, 0.75], 20));
knight.add(shield);

const sword = new THREE.Group();
sword.position.set(1.72, 2.65, 0.64);
sword.rotation.z = -0.16;
sword.add(box(0.18, 1.58, 0.13, gray, [0, 0.86, 0]));
sword.add(mesh(new THREE.ConeGeometry(0.13, 0.34, 4), gray, [0, 1.82, 0], [0, 0, Math.PI / 4]));
sword.add(box(0.72, 0.13, 0.18, gold, [0, 0.02, 0]));
sword.add(cylinder(0.1, 0.1, 0.48, darkGray, [0, -0.27, 0], 12));
sword.add(cylinder(0.16, 0.16, 0.1, gold, [0, -0.54, 0], 16));
knight.add(sword);

const ground = mesh(new THREE.CylinderGeometry(4.6, 4.6, 0.18, 64), floorMat, [0, 0, 0]);
ground.receiveShadow = true;
scene.add(ground);

const contact = new THREE.Mesh(
  new THREE.CircleGeometry(3.05, 64),
  new THREE.MeshBasicMaterial({ color: 0x8f9ba0, transparent: true, opacity: 0.2 })
);
contact.rotation.x = -Math.PI / 2;
contact.position.y = 0.1;
scene.add(contact);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener("resize", resize);

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
