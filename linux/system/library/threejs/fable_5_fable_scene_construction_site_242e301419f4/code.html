// =================================================================
//  CITY CONSTRUCTION SITE — industrial stylized, dusk shift
//  tower crane slewing over a scaffolded concrete frame · mixer
//  truck · excavator & dirt mounds · site office · floodlit zone
// =================================================================
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ------------------------------------------------ config / palette
const SEED = 242301419;
const PAL = {
  skyTop: '#33415e', skyMid: '#8a7385', skyLow: '#d99a5b', fog: 0x9c7f68,
  sun: 0xffa564, hemiSky: 0x5e6e8a, hemiGnd: 0x4a3f35, flood: 0xe8f4ff,
  dirt: 0x8f7350, craneYellow: 0xf2b705, safeOrange: 0xe8641b,
  steel: 0x8a939c, steelDark: 0x565e66, concrete: 0xb6b2a8,
  rust: 0xa25b34, cab: 0xdfe3e6, hazardRed: '#d94136', warnYellow: '#f7c520',
  wood: 0x9a6b3a, glass: 0x9fd2e8
};

// ------------------------------------------------ seeded prng / helpers
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(SEED);
const rand  = (a, b) => a + (b - a) * rng();
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick  = arr => arr[Math.floor(rng() * arr.length)];
const v3    = (x, y, z) => new THREE.Vector3(x, y, z);
const degY  = d => THREE.MathUtils.degToRad(d);
// batch of oriented tube segments (lattice trusses, scaffolding, fences)
const _up = v3(0, 1, 0), _d = new THREE.Vector3(), _m = new THREE.Vector3(),
      _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _mx = new THREE.Matrix4();
function segmentBatch(segs, r, mat){
  const inst = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1, 1, 6, 1), mat, segs.length);
  segs.forEach(([a, b], i) => {
    _d.subVectors(b, a); const len = Math.max(_d.length(), 0.001);
    _m.addVectors(a, b).multiplyScalar(0.5);
    _q.setFromUnitVectors(_up, _d.normalize()); _s.set(r, len, r);
    _mx.compose(_m, _q, _s); inst.setMatrixAt(i, _mx);
  });
  inst.castShadow = true; return inst;
}

// ------------------------------------------------ renderer / scene / camera
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(PAL.fog, 55, 190);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 500);
camera.position.set(28, 22, 28);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.6, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.autoRotate = true; controls.autoRotateSpeed = 1.1;
controls.minDistance = 15; controls.maxDistance = 60;
controls.maxPolarAngle = 1.42;
controls.update();

// ------------------------------------------------ canvas textures
function canvasTex(size, draw, repX = 1, repY = 1){
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repX, repY);
  t.anisotropy = 4; return t;
}
const skyTex = canvasTex(512, (g, s) => {
  const gr = g.createLinearGradient(0, 0, 0, s);
  gr.addColorStop(0, PAL.skyTop); gr.addColorStop(0.55, PAL.skyMid);
  gr.addColorStop(0.82, PAL.skyLow); gr.addColorStop(1, '#e8b06e');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
});
const dirtTex = canvasTex(512, (g, s) => {
  g.fillStyle = '#8f7350'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 240; i++){
    g.fillStyle = `rgba(${rand(0,1)<0.5?'110,86,56':'169,140,98'},${rand(0.1,0.3)})`;
    g.beginPath(); g.ellipse(rand(0,s), rand(0,s), rand(6,34), rand(4,18), rand(0,3), 0, 7); g.fill();
  }
  g.strokeStyle = 'rgba(74,58,40,0.5)'; g.lineWidth = 9;
  for (const off of [-14, 14, 150, 178]){
    g.beginPath(); g.moveTo(0, s * 0.3 + off);
    g.bezierCurveTo(s * 0.3, s * 0.34 + off, s * 0.7, s * 0.22 + off, s, s * 0.3 + off); g.stroke();
  }
  g.fillStyle = 'rgba(60,48,34,0.35)';
  for (let i = 0; i < 500; i++) g.fillRect(rand(0, s), rand(0, s), 2.5, 2.5);
}, 5, 5);
const concreteTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#b6b2a8'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 300; i++){
    g.fillStyle = `rgba(${rand(0,1)<0.5?'90,88,80':'210,206,196'},${rand(0.04,0.12)})`;
    const w = rand(3, 20); g.fillRect(rand(0, s), rand(0, s), w, w);
  }
  g.strokeStyle = 'rgba(70,68,62,0.4)'; g.lineWidth = 2;
  g.strokeRect(0, 0, s, s); g.beginPath(); g.moveTo(s / 2, 0); g.lineTo(s / 2, s); g.stroke();
});
function stripeDiag(cA, cB){
  return canvasTex(128, (g, s) => {
    g.fillStyle = cA; g.fillRect(0, 0, s, s);
    g.fillStyle = cB; g.lineWidth = 0;
    for (let x = -s; x < s * 2; x += 32){
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x + 16, 0); g.lineTo(x - s + 16, s); g.lineTo(x - s, s); g.fill();
    }
  });
}
const hazardRW = stripeDiag('#ffffff', PAL.hazardRed);
const hazardYB = stripeDiag(PAL.warnYellow, '#1d1d1f');
const drumTex = stripeDiag('#e8e6e0', '#e8641b');
const chainTex = canvasTex(128, (g, s) => {
  g.clearRect(0, 0, s, s); g.strokeStyle = 'rgba(190,198,205,0.9)'; g.lineWidth = 3;
  for (let i = -1; i < 5; i++){
    g.beginPath(); g.moveTo(i * 32, 0); g.lineTo(i * 32 + s, s); g.stroke();
    g.beginPath(); g.moveTo(i * 32 + s, 0); g.lineTo(i * 32, s); g.stroke();
  }
  g.lineWidth = 6; g.beginPath(); g.moveTo(0, 3); g.lineTo(s, 3); g.stroke();
});
const netTex = canvasTex(128, (g, s) => {
  g.clearRect(0, 0, s, s); g.strokeStyle = 'rgba(240,110,30,0.85)'; g.lineWidth = 2;
  for (let i = 0; i <= 16; i++){
    g.beginPath(); g.moveTo(i * 8, 0); g.lineTo(i * 8, s); g.stroke();
    g.beginPath(); g.moveTo(0, i * 8); g.lineTo(s, i * 8); g.stroke();
  }
});
const corrTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#dfe3e6'; g.fillRect(0, 0, s, s);
  for (let x = 0; x < s; x += 10){
    g.fillStyle = 'rgba(120,130,140,0.35)'; g.fillRect(x, 0, 3, s);
    g.fillStyle = 'rgba(255,255,255,0.4)'; g.fillRect(x + 5, 0, 2, s);
  }
  g.fillStyle = 'rgba(90,100,110,0.5)'; g.fillRect(0, s * 0.48, s, 5);
});
const treadTex = canvasTex(128, (g, s) => {
  g.fillStyle = '#2c2c2e'; g.fillRect(0, 0, s, s);
  g.fillStyle = '#4a4a4e';
  for (let y = 4; y < s; y += 16) g.fillRect(0, y, s, 7);
});
const dangerTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#f4f1ea'; g.fillRect(0, 0, s, s);
  g.strokeStyle = PAL.hazardRed; g.lineWidth = 14; g.strokeRect(7, 7, s - 14, s - 14);
  g.textAlign = 'center'; g.fillStyle = PAL.hazardRed; g.font = 'bold 56px Arial';
  g.fillText('DANGER', s / 2, 78);
  g.fillStyle = '#1d1d1f'; g.font = 'bold 30px Arial';
  g.fillText('CONSTRUCTION', s / 2, 128); g.fillText('SITE', s / 2, 164);
  g.fillStyle = PAL.hazardRed; g.font = 'bold 40px Arial'; g.fillText('KEEP OUT', s / 2, 222);
});
const ppeTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#1f5fa8'; g.fillRect(0, 0, s, s);
  g.strokeStyle = '#ffffff'; g.lineWidth = 10; g.strokeRect(5, 5, s - 10, s - 10);
  g.textAlign = 'center'; g.fillStyle = '#ffffff'; g.font = 'bold 40px Arial';
  g.fillText('HARD HATS', s / 2, 96); g.fillText('MUST BE', s / 2, 146); g.fillText('WORN', s / 2, 196);
});
const warnTriTex = canvasTex(256, (g, s) => {
  g.clearRect(0, 0, s, s);
  g.fillStyle = PAL.warnYellow; g.strokeStyle = '#1d1d1f'; g.lineWidth = 16;
  g.beginPath(); g.moveTo(s / 2, 18); g.lineTo(s - 14, s - 20); g.lineTo(14, s - 20);
  g.closePath(); g.fill(); g.stroke();
  g.fillStyle = '#1d1d1f'; g.font = 'bold 130px Arial'; g.textAlign = 'center';
  g.fillText('!', s / 2, s - 55);
});
const officeSignTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#2b6e3f'; g.fillRect(0, 0, s, s / 2);
  g.fillStyle = '#ffffff'; g.font = 'bold 44px Arial'; g.textAlign = 'center';
  g.fillText('SITE OFFICE', s / 2, 80);
});

// ------------------------------------------------ shared materials
const M = {
  dirt: new THREE.MeshStandardMaterial({ map: dirtTex, roughness: 1 }),
  concrete: new THREE.MeshStandardMaterial({ map: concreteTex, roughness: 0.95 }),
  steel: new THREE.MeshStandardMaterial({ color: PAL.steel, roughness: 0.5, metalness: 0.6 }),
  steelDark: new THREE.MeshStandardMaterial({ color: PAL.steelDark, roughness: 0.6, metalness: 0.5 }),
  yellow: new THREE.MeshStandardMaterial({ color: PAL.craneYellow, roughness: 0.55, metalness: 0.2 }),
  orange: new THREE.MeshStandardMaterial({ color: PAL.safeOrange, roughness: 0.6 }),
  rust: new THREE.MeshStandardMaterial({ color: PAL.rust, roughness: 0.85 }),
  wood: new THREE.MeshStandardMaterial({ color: PAL.wood, roughness: 0.9 }),
  cab: new THREE.MeshStandardMaterial({ map: corrTex, roughness: 0.7, metalness: 0.15 }),
  glass: new THREE.MeshStandardMaterial({ color: PAL.glass, roughness: 0.2, metalness: 0.4, emissive: 0x2a4a5a, emissiveIntensity: 0.4 }),
  litWindow: new THREE.MeshStandardMaterial({ color: 0xffe2ae, emissive: 0xffc97a, emissiveIntensity: 1.6 }),
  hazardRW: new THREE.MeshStandardMaterial({ map: hazardRW, roughness: 0.7 }),
  hazardYB: new THREE.MeshStandardMaterial({ map: hazardYB, roughness: 0.7 }),
  net: new THREE.MeshBasicMaterial({ map: netTex, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false }),
  chain: new THREE.MeshBasicMaterial({ map: chainTex, transparent: true, alphaTest: 0.3, side: THREE.DoubleSide }),
  tread: new THREE.MeshStandardMaterial({ map: treadTex, roughness: 0.95 }),
  beacon: new THREE.MeshStandardMaterial({ color: 0xff5533, emissive: 0xff3311, emissiveIntensity: 2 }),
  floodFace: new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xf4faff, emissiveIntensity: 3 }),
  glow: new THREE.MeshBasicMaterial({ color: 0xcfe6ff, transparent: true, opacity: 0.055, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide })
};
const box = (w, h, d, mat) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.castShadow = m.receiveShadow = true; return m; };
const cyl = (rt, rb, h, seg, mat) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); m.castShadow = m.receiveShadow = true; return m; };

// ------------------------------------------------ ground, sky, city backdrop
function buildGround(){
  const g = new THREE.Group();
  const pad = new THREE.Mesh(new THREE.CircleGeometry(32, 56), M.dirt);
  pad.rotation.x = -Math.PI / 2; pad.receiveShadow = true; g.add(pad);
  const slab = box(12, 0.22, 10, M.concrete); slab.position.set(-7, 0.11, -3); g.add(slab);
  const outer = new THREE.Mesh(new THREE.CircleGeometry(160, 48),
    new THREE.MeshStandardMaterial({ color: 0x4f4238, roughness: 1 }));
  outer.rotation.x = -Math.PI / 2; outer.position.y = -0.06; outer.receiveShadow = true; g.add(outer);
  const sky = new THREE.Mesh(new THREE.SphereGeometry(240, 32, 16),
    new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false }));
  g.add(sky);
  return g;
}

// ------------------------------------------------ half-built frame + scaffolding
function buildConcreteFrame(){
  const g = new THREE.Group(); // local footprint x:-4.5..4.5  z:-3.75..3.75
  const colGeo = new THREE.BoxGeometry(0.45, 3, 0.45);
  const cols = [], grid = [];
  for (let ix = 0; ix < 4; ix++) for (let iz = 0; iz < 3; iz++) grid.push([-4.5 + ix * 3, -3.75 + iz * 3.75]);
  for (const [x, z] of grid){
    cols.push([x, 1.5, z], [x, 4.5, z]);
    if (x < -1) cols.push([x, 7.5, z]); // upper level only half built
  }
  const colInst = new THREE.InstancedMesh(colGeo, M.concrete, cols.length);
  cols.forEach((p, i) => { _mx.makeTranslation(p[0], p[1], p[2]); colInst.setMatrixAt(i, _mx); });
  colInst.castShadow = colInst.receiveShadow = true; g.add(colInst);
  for (const [y, w, cx] of [[3.1, 9.9, 0], [6.1, 9.9, 0], [9.1, 4.4, -2.75]]){
    const s = box(w, 0.28, 8.3, M.concrete); s.position.set(cx, y, 0); g.add(s);
  }
  const core = box(0.35, 8.9, 3.2, M.concrete); core.position.set(-4.5, 4.45, 0); g.add(core);
  // rebar sprouting from the unfinished half
  const rebars = [];
  for (const [x, z] of grid) if (x >= -1)
    for (let k = 0; k < 4; k++)
      rebars.push([v3(x - 0.12 + (k % 2) * 0.24, 6.25, z - 0.12 + (k > 1 ? 0.24 : 0)),
                   v3(x - 0.12 + (k % 2) * 0.24, 7.15, z - 0.12 + (k > 1 ? 0.24 : 0))]);
  g.add(segmentBatch(rebars, 0.022, M.rust));
  // scaffolding wrap on two faces: standards, ledgers, braces, decks, nets
  const faces = [[9.9, 0, 4.2, 0], [8.3, -4.65, 0, -Math.PI / 2]];
  for (const [len, px, pz, ry] of faces){
    const f = new THREE.Group(); f.position.set(px, 0, pz); f.rotation.y = ry;
    const tubes = [], n = Math.round(len / 1.5);
    for (let i = 0; i <= n; i++){
      const x = -len / 2 + i * (len / n);
      tubes.push([v3(x, 0, 0.15), v3(x, 9.6, 0.15)], [v3(x, 0, 0.95), v3(x, 9.6, 0.95)]);
      for (let L = 1; L <= 4; L++) tubes.push([v3(x, L * 2.4, 0.15), v3(x, L * 2.4, 0.95)]);
      if (i < n) tubes.push([v3(x, 0.2, 0.95), v3(x + len / n, 2.4, 0.95)]);
    }
    for (let L = 1; L <= 4; L++){
      tubes.push([v3(-len / 2, L * 2.4, 0.15), v3(len / 2, L * 2.4, 0.15)],
                 [v3(-len / 2, L * 2.4, 0.95), v3(len / 2, L * 2.4, 0.95)]);
      const pk = box(len, 0.07, 0.7, M.wood); pk.position.set(0, L * 2.4 + 0.05, 0.55); f.add(pk);
    }
    f.add(segmentBatch(tubes, 0.045, M.steelDark));
    const netMat = M.net.clone(); netMat.map = netTex.clone();
    netMat.map.repeat.set((len + 0.4) / 1.4, 6.6);
    const net = new THREE.Mesh(new THREE.PlaneGeometry(len + 0.4, 9.4), netMat);
    net.position.set(0, 4.8, 1.1); f.add(net);
    g.add(f);
  }
  return g;
}

// ------------------------------------------------ tower crane (slewing)
let slewGroup, hookGroup;
function buildTowerCrane(){
  const g = new THREE.Group();
  const base = box(2.6, 0.7, 2.6, M.hazardYB); base.position.y = 0.35; g.add(base);
  const mastSegs = [], sz = 0.55, top = 14.5;
  for (const [sx, szn] of [[-1, -1], [-1, 1], [1, -1], [1, 1]])
    mastSegs.push([v3(sx * sz, 0.7, szn * sz), v3(sx * sz, top, szn * sz)]);
  for (let y = 0.7; y < top - 0.5; y += 1.15){
    mastSegs.push([v3(-sz, y, -sz), v3(sz, y, -sz)], [v3(-sz, y, sz), v3(sz, y, sz)],
                  [v3(-sz, y, -sz), v3(-sz, y, sz)], [v3(sz, y, -sz), v3(sz, y, sz)]);
    const flip = Math.round(y / 1.15) % 2 ? 1 : -1;
    mastSegs.push([v3(-sz * flip, y, -sz), v3(sz * flip, y + 1.15, -sz)],
                  [v3(-sz * flip, y, sz), v3(sz * flip, y + 1.15, sz)]);
  }
  g.add(segmentBatch(mastSegs, 0.06, M.yellow));
  slewGroup = new THREE.Group(); slewGroup.position.y = top; g.add(slewGroup);
  const deck = box(1.7, 0.45, 1.7, M.yellow); deck.position.y = 0.22; slewGroup.add(deck);
  const cabB = box(1.0, 1.05, 1.0, M.yellow); cabB.position.set(0.55, 0.95, 0.95); slewGroup.add(cabB);
  const cabW = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.6), M.litWindow);
  cabW.position.set(1.06, 1.05, 0.95); cabW.rotation.y = Math.PI / 2; slewGroup.add(cabW);
  const jib = [], JL = 13, CJ = 4.6;
  for (let x = 0.4; x < JL; x += 1.3){
    const nx = Math.min(x + 1.3, JL);
    jib.push([v3(x, 0.5, -0.4), v3(nx, 0.5, -0.4)], [v3(x, 0.5, 0.4), v3(nx, 0.5, 0.4)],
             [v3(x, 1.3, 0), v3(nx, 1.3, 0)],
             [v3(x, 0.5, -0.4), v3(x, 1.3, 0)], [v3(x, 0.5, 0.4), v3(x, 1.3, 0)],
             [v3(x, 0.5, -0.4), v3(x, 0.5, 0.4)], [v3(x, 0.5, -0.4), v3(nx, 1.3, 0)]);
  }
  for (let x = -CJ; x < -0.4; x += 1.4)
    jib.push([v3(x, 0.5, -0.5), v3(x + 1.4, 0.5, -0.5)], [v3(x, 0.5, 0.5), v3(x + 1.4, 0.5, 0.5)],
             [v3(x, 0.5, -0.5), v3(x, 0.5, 0.5)]);
  const apexY = 3.1;
  jib.push([v3(0, 0.6, 0), v3(0, apexY, 0)],
           [v3(0, apexY, 0), v3(JL - 0.4, 1.35, 0)], [v3(0, apexY, 0), v3(-CJ + 0.2, 0.6, 0)]);
  slewGroup.add(segmentBatch(jib, 0.05, M.yellow));
  for (let i = 0; i < 3; i++){
    const w = box(0.5, 1.05, 1.15, M.concrete); w.position.set(-CJ + 0.5 + i * 0.55, 0.0, 0); slewGroup.add(w);
  }
  const beaconTop = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 8), M.beacon);
  beaconTop.position.set(0, apexY + 0.12, 0); slewGroup.add(beaconTop);
  g.userData.beacon = beaconTop;
  const trolley = box(0.55, 0.3, 0.6, M.steelDark); trolley.position.set(8.6, 0.32, 0); slewGroup.add(trolley);
  hookGroup = new THREE.Group(); hookGroup.position.set(8.6, 0.2, 0); slewGroup.add(hookGroup);
  const drop = 7.6;
  const cable = cyl(0.025, 0.025, drop, 5, M.steelDark); cable.position.y = -drop / 2; hookGroup.add(cable);
  const block = box(0.4, 0.5, 0.3, M.hazardYB); block.position.y = -drop; hookGroup.add(block);
  const load = new THREE.InstancedMesh(iBeamGeo(4), M.rust, 2);
  [-0.26, 0.26].forEach((oz, i) => {
    _mx.makeRotationY(Math.PI / 2).setPosition(0, -drop - 0.65, oz); load.setMatrixAt(i, _mx);
  });
  load.castShadow = true; hookGroup.add(load);
  const slings = segmentBatch([[v3(0, -drop + 0.1, 0), v3(-0.3, -drop - 0.5, 0)],
                               [v3(0, -drop + 0.1, 0), v3(0.3, -drop - 0.5, 0)]], 0.02, M.steelDark);
  hookGroup.add(slings);
  return g;
}
// I-beam cross-section, extruded along z
function iBeamGeo(len){
  const w = 0.4, h = 0.4, t = 0.07, s = new THREE.Shape();
  s.moveTo(-w/2, -h/2); s.lineTo(w/2, -h/2); s.lineTo(w/2, -h/2 + t); s.lineTo(t/2, -h/2 + t);
  s.lineTo(t/2, h/2 - t); s.lineTo(w/2, h/2 - t); s.lineTo(w/2, h/2); s.lineTo(-w/2, h/2);
  s.lineTo(-w/2, h/2 - t); s.lineTo(-t/2, h/2 - t); s.lineTo(-t/2, -h/2 + t); s.lineTo(-w/2, -h/2 + t);
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s, { depth: len, bevelEnabled: false });
  geo.translate(0, 0, -len / 2); return geo;
}

// ------------------------------------------------ cement mixer truck
let mixerDrum, cabBeacon;
function buildMixerTruck(){
  const g = new THREE.Group();
  const chassis = box(4.9, 0.28, 1.5, M.steelDark); chassis.position.y = 0.72; g.add(chassis);

// ------------------------------------------------ excavator + dirt mounds
let excBoom;
function buildExcavator(){
  const g = new THREE.Group();
  for (const zs of [-0.78, 0.78]){
    const tr = box(2.5, 0.62, 0.55, M.tread); tr.position.set(0, 0.31, zs); g.add(tr);
    const w1 = cyl(0.31, 0.31, 0.57, 12, M.steelDark); w1.rotation.x = Math.PI / 2; w1.position.set(-1.25, 0.31, zs); g.add(w1);
    const w2 = w1.clone(); w2.position.x = 1.25; g.add(w2);
  }
  const deck = box(1.9, 0.3, 1.7, M.steelDark); deck.position.y = 0.78; g.add(deck);
  const body = box(1.7, 0.85, 1.5, M.yellow); body.position.set(-0.25, 1.35, 0); g.add(body);
  const cabE = box(0.85, 0.95, 0.8, M.yellow); cabE.position.set(0.45, 1.55, 0.42); g.add(cabE);
  const cabG = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.62), M.litWindow);
  cabG.position.set(0.89, 1.62, 0.42); cabG.rotation.y = Math.PI / 2; g.add(cabG);
  const counter = box(0.7, 0.7, 1.3, M.steelDark); counter.position.set(-1.15, 1.3, 0); g.add(counter);
  excBoom = new THREE.Group(); excBoom.position.set(0.45, 1.35, -0.15); g.add(excBoom);
  const boom = box(2.3, 0.32, 0.24, M.yellow); boom.position.set(1.0, 0.45, 0); boom.rotation.z = 0.42; excBoom.add(boom);
  const stick = box(1.6, 0.2, 0.18, M.yellow); stick.position.set(2.5, 0.6, 0); stick.rotation.z = -0.75; excBoom.add(stick);
  const bucket = box(0.55, 0.45, 0.6, M.steelDark); bucket.position.set(3.15, 0.05, 0); bucket.rotation.z = 0.5; excBoom.add(bucket);

function buildDirtMound(r){
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 10), M.dirt);
  m.scale.y = 0.38; m.castShadow = m.receiveShadow = true; return m;
}

// ------------------------------------------------ site office, beams, props
function buildSiteOffice(){
  const g = new THREE.Group();
  for (const sx of [-2, 2]) for (const sz of [-0.9, 0.9]){
    const blk = box(0.5, 0.4, 0.5, M.concrete); blk.position.set(sx, 0.2, sz); g.add(blk);
  }
  const cabin = box(5, 2.5, 2.4, M.cab); cabin.position.y = 1.65; g.add(cabin);
  const roof = box(5.25, 0.14, 2.65, M.steelDark); roof.position.y = 2.96; g.add(roof);
  const door = box(0.8, 1.8, 0.06, M.steelDark); door.position.set(-1.5, 1.35, 1.22); g.add(door);
  for (const wx of [0.3, 1.8]){
    const win = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.85), M.litWindow);
    win.position.set(wx, 1.85, 1.24); g.add(win);
  }
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(1.9, 0.5),
    new THREE.MeshStandardMaterial({ map: officeSignTex, roughness: 0.8 }));
  sign.position.set(0.9, 2.62, 1.25); g.add(sign);
  const steps = box(1.0, 0.18, 0.7, M.steel); steps.position.set(-1.5, 0.09, 1.75); g.add(steps);
  const ac = box(0.6, 0.4, 0.5, M.steel); ac.position.set(1.8, 3.15, -0.4); g.add(ac);
  return g;
}
function buildBeamStack(){
  const g = new THREE.Group(), geo = iBeamGeo(6);
  const inst = new THREE.InstancedMesh(geo, M.steel, 9);
  const colr = new THREE.Color(); let i = 0;
  const layers = [[4, 0.31, -0.95, 0.62], [3, 0.72, -0.65, 0.65], [2, 1.13, -0.35, 0.7]];
  for (const [count, y, z0, dz] of layers)
    for (let k = 0; k < count; k++){
      _mx.makeRotationY(Math.PI / 2).setPosition(rand(-0.15, 0.15), y, z0 + k * dz);
      inst.setMatrixAt(i, _mx);
      inst.setColorAt(i++, colr.setHex(pick([0x9aa4ae, 0x8a939c, 0xa25b34, 0x77808a])));
    }
  inst.castShadow = true; g.add(inst);
  for (const zs of [-0.7, 0.7]){ // timber dunnage under the stack
    const dn = box(0.24, 0.18, 2.1, M.wood); dn.position.set(zs * 2.2, 0.02, 0); dn.rotation.y = Math.PI / 2; g.add(dn);
  }
  return g;
}
function buildBarrier(){
  const g = new THREE.Group();
  const bd = box(1.7, 0.38, 0.06, M.hazardRW); bd.position.y = 0.75; g.add(bd);
  for (const sx of [-0.7, 0.7]){
    const leg = box(0.08, 0.95, 0.45, M.steelDark); leg.position.set(sx, 0.47, 0); g.add(leg);
  }
  return g;
}
function buildFloodMast(mastPos, aimAt){
  const g = new THREE.Group(); g.position.copy(mastPos);
  const foot = box(1.4, 0.5, 1.4, M.hazardYB); foot.position.y = 0.25; g.add(foot);
  const pole = cyl(0.09, 0.13, 8.6, 8, M.steelDark); pole.position.y = 4.6; g.add(pole);
  const bar = box(1.9, 0.16, 0.16, M.steelDark); bar.position.y = 8.9; g.add(bar);
  const heads = new THREE.Group(); heads.position.y = 8.9;
  for (let i = 0; i < 4; i++){
    const h = box(0.42, 0.5, 0.22, M.steelDark); h.position.x = -0.72 + i * 0.48; heads.add(h);
    const f = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.4), M.floodFace);
    f.position.set(-0.72 + i * 0.48, 0, 0.13); heads.add(f);
  }
  heads.lookAt(aimAt.x - mastPos.x, 2, aimAt.z - mastPos.z); g.add(heads);
  const beam = new THREE.Mesh(new THREE.ConeGeometry(4.6, 10.5, 20, 1, true), M.glow);
  beam.position.y = 4.2; g.add(beam);
  const spot = new THREE.SpotLight(PAL.flood, 420, 60, 0.62, 0.55, 1.6);
  spot.position.set(0, 8.9, 0); g.add(spot);
  spot.target.position.copy(aimAt); g.userData.spot = spot;
  return g;
}
function buildSign(tex, w, h, twin){
  const g = new THREE.Group();
  const tr = tex === warnTriTex;
  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8, transparent: tr, alphaTest: tr ? 0.3 : 0 });
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  face.position.y = 1.55; face.castShadow = true; g.add(face);
  const back = face.clone(); back.rotation.y = Math.PI; back.position.z = -0.015; g.add(back); // readable from both sides
  for (const sx of twin ? [-w / 2 + 0.1, w / 2 - 0.1] : [0]){
    const post = cyl(0.05, 0.05, 1.9, 6, M.steelDark); post.position.set(sx, 0.95, -0.04); g.add(post);
  }
  return g;
}
function buildProps(){
  const g = new THREE.Group();
  const barrels = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.32, 0.32, 0.85, 14), M.orange, 4);
  const colr = new THREE.Color();
  [[-10.2, 2.6], [-9.5, 3.3], [-10.6, 3.6], [-9.9, 3.0]].forEach((p, i) => {
    _mx.makeTranslation(p[0], 0.42, p[1]); barrels.setMatrixAt(i, _mx);
    barrels.setColorAt(i, colr.setHex(pick([0xe8641b, 0x3f6ea8, 0xe8641b, 0x8a939c])));

  const bags = new THREE.InstancedMesh(new THREE.BoxGeometry(0.62, 0.26, 0.42),
    new THREE.MeshStandardMaterial({ color: 0xd8d3c8, roughness: 0.95 }), 6);
  [[-0.35, 0.28, -0.25], [0.35, 0.28, -0.25], [-0.35, 0.28, 0.25], [0.35, 0.28, 0.25], [-0.05, 0.55, 0], [0.15, 0.8, 0.05]].forEach((p, i) => {
    _mx.makeRotationY(rand(-0.2, 0.2)).setPosition(-6.5 + p[0], p[1], 11.5 + p[2]); bags.setMatrixAt(i, _mx);
  });
  bags.castShadow = true; g.add(bags);

// ------------------------------------------------ perimeter fence + cones
function buildFence(){
  const g = new THREE.Group(), R = 18.5, posts = [];
  const runs = [
    [v3(-R, 0, -R), v3(R, 0, -R)], [v3(R, 0, -R), v3(R, 0, R)],
    [v3(-R, 0, R), v3(-R, 0, -R)], [v3(-R, 0, R), v3(-3.2, 0, R)], [v3(3.2, 0, R), v3(R, 0, R)]
  ];
  for (const [a, b] of runs){
    const len = a.distanceTo(b), n = Math.ceil(len / 4.6);
    for (let i = 0; i <= n; i++){
      const p = a.clone().lerp(b, i / n); posts.push([p.clone(), p.clone().setY(2.1)]);
    }
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(len, 2.0), M.chain.clone());
    mesh.material.map = chainTex.clone(); mesh.material.map.repeat.set(len / 1.6, 1.6);
    const mid = a.clone().lerp(b, 0.5); mesh.position.set(mid.x, 1.05, mid.z);
    mesh.rotation.y = Math.atan2(b.x - a.x, b.z - a.z) + Math.PI / 2;
    g.add(mesh);
  }
  g.add(segmentBatch(posts, 0.05, M.steelDark));
  return g;
}
function placeCones(parent){
  const coneInst = new THREE.InstancedMesh(new THREE.ConeGeometry(0.22, 0.62, 12), M.orange, 12);
  const baseInst = new THREE.InstancedMesh(new THREE.BoxGeometry(0.5, 0.05, 0.5), M.orange, 12);
  const spots = [];
  for (let i = 0; i < 7; i++) spots.push([(i % 2 ? 1.9 : -1.9) + rand(-0.2, 0.2), 7.5 + i * 1.55]);
  spots.push([5.5, 3.5], [-4.6, 6.2], [9.2, 1.8], [-1.2, 4.8], [12.5, 8.5]);
  spots.forEach((p, i) => {
    _mx.makeTranslation(p[0], 0.34, p[1]); coneInst.setMatrixAt(i, _mx);
    _mx.makeTranslation(p[0], 0.03, p[1]); baseInst.setMatrixAt(i, _mx);
  });
  coneInst.castShadow = true; parent.add(coneInst, baseInst);
}

// ------------------------------------------------ assembly / layout
scene.add(buildGround());
const frame = buildConcreteFrame(); frame.position.set(-7, 0.2, -3); scene.add(frame);
const crane = buildTowerCrane(); crane.position.set(7.5, 0, -9); scene.add(crane);
const mixer = buildMixerTruck(); mixer.position.set(8.5, 0, 5.5); mixer.rotation.y = degY(-70); scene.add(mixer);
const exc = buildExcavator(); exc.position.set(11, 0, 0.5); exc.rotation.y = degY(150); scene.add(exc);
for (const [x, z, r] of [[13.5, -3.5, 2.6], [11.2, -5.8, 1.9], [15.2, -0.8, 1.6]]){
  const md = buildDirtMound(r); md.position.set(x, 0.12, z); scene.add(md);
}
const office = buildSiteOffice(); office.position.set(-13, 0, 10); office.rotation.y = degY(35); scene.add(office);
const beams = buildBeamStack(); beams.position.set(3.5, 0, 10.5); beams.rotation.y = degY(15); scene.add(beams);
for (const [x, z, ry] of [[-2.4, 15.5, 0], [0, 15.5, 0], [2.4, 15.5, 0], [6.2, 8.2, 60], [-4.2, 9.5, -25]]){
  const b = buildBarrier(); b.position.set(x, 0, z); b.rotation.y = degY(ry); scene.add(b);
}
placeCones(scene);
const masts = [];
for (const [x, z, ax, az] of [[-15.5, -13.5, -4, -2], [15, 13.5, 6, 4]]){
  const fm = buildFloodMast(v3(x, 0, z), v3(ax, 0, az));
  scene.add(fm); scene.add(fm.userData.spot.target); masts.push(fm);
}
scene.add(buildFence());
const signGate = buildSign(dangerTex, 2.1, 2.1, true); signGate.position.set(5.4, 0, 18.3); signGate.rotation.y = Math.PI; scene.add(signGate);
const signPPE = buildSign(ppeTex, 1.4, 1.4, false); signPPE.position.set(-5.2, 0, 17.9); signPPE.rotation.y = Math.PI + 0.2; scene.add(signPPE);
const signTri = buildSign(warnTriTex, 1.2, 1.2, false); signTri.position.set(12.8, 0, 5.6); signTri.rotation.y = degY(140); scene.add(signTri);
scene.add(buildProps());

// drifting dust motes in the floodlit air
const DUST = 140, dustPos = new Float32Array(DUST * 3), dustDat = [];
for (let i = 0; i < DUST; i++){
  dustDat.push({ x: rand(-16, 16), z: rand(-16, 16), y: rand(0.3, 9), s: rand(0.05, 0.22), p: rand(0, 7) });
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0xd8c9a8, size: 0.09, transparent: true, opacity: 0.4,
  blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(dust);

// ------------------------------------------------ lighting rig
const sun = new THREE.DirectionalLight(PAL.sun, 1.7);
sun.position.set(-34, 15, 22); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -34;
sun.shadow.camera.right = sun.shadow.camera.top = 34;
sun.shadow.camera.near = 5; sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0007;
scene.add(sun);
scene.add(new THREE.HemisphereLight(PAL.hemiSky, PAL.hemiGnd, 0.55));
const rim = new THREE.DirectionalLight(0x7a8db0, 0.35); rim.position.set(26, 20, -30); scene.add(rim);

// ------------------------------------------------ animation loop
const clock = new THREE.Clock();
function animate(){
  const t = clock.getElapsedTime();
  controls.update();
  // tower crane slews slowly; hook and slung beams sway gently
  slewGroup.rotation.y = t * 0.09;
  hookGroup.rotation.x = Math.sin(t * 0.9) * 0.05;
  hookGroup.rotation.z = Math.cos(t * 0.7) * 0.05;
  crane.userData.beacon.material.emissiveIntensity = 1.2 + Math.sin(t * 4) * 1.1;
  // mixer drum churns; amber cab beacon strobes
  mixerDrum.rotation.y = t * 1.1;
  cabBeacon.material.emissiveIntensity = (Math.sin(t * 7) > 0.2 ? 2.6 : 0.4);
  // excavator boom bobs as if grading the mound
  excBoom.rotation.z = Math.sin(t * 0.6) * 0.09 - 0.04;
  // floodlights flicker faintly
  masts.forEach((fm, i) => {
    fm.userData.spot.intensity = 400 + Math.sin(t * 13 + i * 9) * 26 + Math.sin(t * 31 + i) * 14;
  });
  // dust motes drift upward through the light
  for (let i = 0; i < DUST; i++){
    const d = dustDat[i];
    dustPos[i * 3] = d.x + Math.sin(t * d.s + d.p) * 1.4;
    dustPos[i * 3 + 1] = (d.y + t * d.s) % 9.5;
    dustPos[i * 3 + 2] = d.z + Math.cos(t * d.s * 0.8 + d.p) * 1.4;
  }
  dustGeo.attributes.position.needsUpdate = true;
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(animate);

// ------------------------------------------------ resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
