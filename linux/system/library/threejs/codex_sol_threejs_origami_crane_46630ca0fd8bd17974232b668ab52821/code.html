<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Origami Paper Crane</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #e8e4dc;
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e4dc);
scene.fog = new THREE.Fog(0xe8e4dc, 13, 25);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 50);
camera.position.set(7.6, 5.3, 9.4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.9, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 7;
controls.maxDistance = 17;
controls.maxPolarAngle = Math.PI * 0.49;

const paperWhite = new THREE.MeshStandardMaterial({
  color: 0xf2eee4,
  roughness: 0.88,
  metalness: 0,
  flatShading: true,
  side: THREE.DoubleSide
});
const paperWarm = new THREE.MeshStandardMaterial({
  color: 0xe3dac8,
  roughness: 0.9,
  metalness: 0,
  flatShading: true,
  side: THREE.DoubleSide
});
const paperLight = new THREE.MeshStandardMaterial({
  color: 0xfffcf3,
  roughness: 0.86,
  metalness: 0,
  flatShading: true,
  side: THREE.DoubleSide
});
const reversePaper = new THREE.MeshStandardMaterial({
  color: 0xcfaeaa,
  roughness: 0.92,
  metalness: 0,
  flatShading: true,
  side: THREE.DoubleSide
});
const reverseDark = new THREE.MeshStandardMaterial({
  color: 0xb88f8c,
  roughness: 0.92,
  metalness: 0,
  flatShading: true,
  side: THREE.DoubleSide
});
const creaseMaterial = new THREE.LineBasicMaterial({
  color: 0x8b7c70,
  transparent: true,
  opacity: 0.46
});
const edgeMaterial = new THREE.LineBasicMaterial({
  color: 0x7d7167,
  transparent: true,
  opacity: 0.32
});

const crane = new THREE.Group();
crane.rotation.y = -0.12;
scene.add(crane);

function createPolyhedron(vertices, faces, materials, faceMaterials, edgeOpacity = 0.3) {
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices.flat(), 3));
  geometry.setIndex(faces.flat());

  for (let i = 0; i < faces.length; i++) {
    geometry.addGroup(i * 3, 3, faceMaterials[i] ?? 0);
  }

  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();

  const mesh = new THREE.Mesh(geometry, materials);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  if (edgeOpacity > 0) {
    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geometry, 18),
      edgeMaterial.clone()
    );
    edges.material.opacity = edgeOpacity;
    mesh.add(edges);
  }
  return mesh;
}

function addLine(points, material = creaseMaterial) {
  const geometry = new THREE.BufferGeometry().setFromPoints(
    points.map((point) => new THREE.Vector3(point[0], point[1], point[2]))
  );
  const line = new THREE.LineSegments(geometry, material);
  line.renderOrder = 3;
  crane.add(line);
  return line;
}

function buildWing(side) {
  const s = side;
  const top = [
    [0.10 * s, 1.88,  0.12],
    [0.45 * s, 1.78,  0.84],
    [2.45 * s, 2.08,  0.42],
    [4.62 * s, 2.14, -0.78],
    [2.55 * s, 2.12, -1.08],
    [0.28 * s, 1.82, -0.65],
    [1.62 * s, 2.72, -0.14]
  ];
  const bottom = top.map((v) => [v[0], v[1] - 0.075, v[2] + 0.012]);
  const vertices = top.concat(bottom);

  const topFaces = [
    [0, 1, 6],
    [1, 2, 6],
    [2, 3, 6],
    [3, 4, 6],
    [4, 5, 6],
    [5, 0, 6]
  ];
  const bottomFaces = [
    [13, 8, 7],
    [13, 9, 8],
    [13, 10, 9],
    [13, 11, 10],
    [13, 12, 11],
    [13, 7, 12]
  ];
  const sideFaces = [];
  for (let i = 0; i < 6; i++) {
    const j = (i + 1) % 6;
    sideFaces.push([i, j, j + 7], [i, j + 7, i + 7]);
  }

  const faces = topFaces.concat(bottomFaces, sideFaces);
  const faceMaterials = [
    2, 0, 2, 1, 0, 1,
    3, 3, 4, 3, 4, 3,
    1, 3, 1, 3, 1, 3, 1, 4, 1, 4, 1, 3
  ];

  const wing = createPolyhedron(
    vertices,
    faces,
    [paperWhite, paperWarm, paperLight, reversePaper, reverseDark],
    faceMaterials,
    0.34
  );
  crane.add(wing);

  const ridgeLift = 0.013;
  const creaseSegments = [
    [top[0], [top[6][0], top[6][1] + ridgeLift, top[6][2]]],
    [top[1], [top[6][0], top[6][1] + ridgeLift, top[6][2]]],
    [top[2], [top[6][0], top[6][1] + ridgeLift, top[6][2]]],
    [top[3], [top[6][0], top[6][1] + ridgeLift, top[6][2]]],
    [top[4], [top[6][0], top[6][1] + ridgeLift, top[6][2]]],
    [top[5], [top[6][0], top[6][1] + ridgeLift, top[6][2]]],
    [top[1], top[5]],
    [top[2], top[4]]
  ];
  addLine(creaseSegments.flat());
}

buildWing(1);
buildWing(-1);

const bodyVertices = [
  [ 0.00, 2.30,  0.02],
  [ 0.82, 1.78,  0.05],
  [ 0.00, 1.58,  0.88],
  [-0.82, 1.78,  0.05],
  [ 0.00, 1.64, -0.82],
  [ 0.00, 0.56,  0.00],
  [ 0.50, 1.23,  0.48],
  [-0.50, 1.23,  0.48],
  [ 0.48, 1.20, -0.45],
  [-0.48, 1.20, -0.45]
];
const bodyFaces = [
  [0, 1, 2], [0, 2, 3], [0, 3, 4], [0, 4, 1],
  [1, 6, 2], [2, 6, 5], [2, 5, 7], [2, 7, 3],
  [3, 7, 5], [3, 5, 9], [3, 9, 4], [4, 9, 5],
  [4, 5, 8], [4, 8, 1], [1, 8, 5], [1, 5, 6]
];
const bodyFaceMaterials = [2, 0, 1, 2, 0, 3, 3, 1, 3, 4, 1, 3, 4, 1, 3, 0];
const body = createPolyhedron(
  bodyVertices,
  bodyFaces,
  [paperWhite, paperWarm, paperLight, reversePaper, reverseDark],
  bodyFaceMaterials,
  0.38
);
crane.add(body);

addLine([
  [0.00, 2.31, 0.02], [0.00, 1.59, 0.89],
  [0.00, 2.31, 0.02], [0.00, 1.65, -0.83],
  [0.82, 1.79, 0.05], [0.00, 0.57, 0.00],
  [-0.82, 1.79, 0.05], [0.00, 0.57, 0.00],
  [0.00, 1.59, 0.89], [0.00, 0.57, 0.00],
  [0.00, 1.65, -0.83], [0.00, 0.57, 0.00]
]);

function buildFoldedTube(points, widths, thicknesses, materialPattern) {
  const vertices = [];
  const sections = [];

  for (let i = 0; i < points.length; i++) {
    const center = new THREE.Vector3(...points[i]);
    const previous = new THREE.Vector3(...points[Math.max(0, i - 1)]);
    const next = new THREE.Vector3(...points[Math.min(points.length - 1, i + 1)]);
    const direction = next.clone().sub(previous).normalize();
    const side = new THREE.Vector3(1, 0, 0);
    const foldAxis = new THREE.Vector3().crossVectors(direction, side).normalize();

    const section = [
      center.clone().addScaledVector(side, widths[i]),
      center.clone().addScaledVector(foldAxis, thicknesses[i]),
      center.clone().addScaledVector(side, -widths[i]),
      center.clone().addScaledVector(foldAxis, -thicknesses[i])
    ];
    sections.push(section);
    section.forEach((v) => vertices.push(v.toArray()));
  }

  const faces = [];
  const faceMaterials = [];

  faces.push([0, 2, 1], [0, 3, 2]);
  faceMaterials.push(3, 3);

  for (let i = 0; i < sections.length - 1; i++) {
    const a = i * 4;
    const b = (i + 1) * 4;
    for (let j = 0; j < 4; j++) {
      const k = (j + 1) % 4;
      faces.push([a + j, b + j, b + k], [a + j, b + k, a + k]);
      faceMaterials.push(
        materialPattern[(j + i) % materialPattern.length],
        materialPattern[(j + i) % materialPattern.length]
      );
    }
  }

  const last = (sections.length - 1) * 4;
  faces.push([last, last + 1, last + 2], [last, last + 2, last + 3]);
  faceMaterials.push(0, 0);

  return createPolyhedron(
    vertices,
    faces,
    [paperWhite, paperWarm, paperLight, reversePaper],
    faceMaterials,
    0.42
  );
}

const neckPoints = [
  [0.00, 1.70, 0.48],
  [0.00, 2.25, 0.91],
  [0.00, 3.18, 1.14],
  [0.00, 3.62, 1.55]
];
const neck = buildFoldedTube(
  neckPoints,
  [0.34, 0.28, 0.20, 0.15],
  [0.22, 0.18, 0.14, 0.11],
  [0, 2, 1, 3]
);
crane.add(neck);

const tailPoints = [
  [0.00, 1.68, -0.47],
  [0.00, 1.92, -1.25],
  [0.00, 2.18, -2.25],
  [0.00, 2.24, -3.14]
];
const tail = buildFoldedTube(
  tailPoints,
  [0.35, 0.29, 0.17, 0.025],
  [0.23, 0.18, 0.10, 0.018],
  [1, 2, 0, 3]
);
crane.add(tail);

const headVertices = [
  [ 0.00, 3.92, 1.68],
  [ 0.27, 3.67, 1.70],
  [ 0.00, 3.43, 1.68],
  [-0.27, 3.67, 1.70],
  [ 0.00, 3.68, 2.08],
  [ 0.00, 3.67, 1.40]
];
const headFaces = [
  [0, 1, 4], [0, 4, 3], [0, 3, 5], [0, 5, 1],
  [2, 4, 1], [2, 3, 4], [2, 5, 3], [2, 1, 5]
];
const head = createPolyhedron(
  headVertices,
  headFaces,
  [paperWhite, paperWarm, paperLight, reversePaper],
  [2, 0, 1, 2, 0, 1, 3, 0],
  0.42
);
crane.add(head);

const beakVertices = [
  [ 0.00, 3.77, 2.00],
  [ 0.18, 3.66, 1.93],
  [-0.18, 3.66, 1.93],
  [ 0.00, 3.54, 1.96],
  [ 0.00, 3.61, 2.92]
];
const beakFaces = [
  [0, 1, 4], [0, 4, 2],
  [1, 3, 4], [3, 2, 4],
  [0, 2, 1], [1, 2, 3]
];
const beak = createPolyhedron(
  beakVertices,
  beakFaces,
  [paperWhite, paperWarm, reversePaper],
  [2, 1, 2, 1, 0, 2],
  0.45
);
crane.add(beak);

const baseVertices = [
  [ 0.00, 0.58,  0.00],
  [ 0.62, 0.37,  0.36],
  [ 0.00, 0.42,  0.76],
  [-0.62, 0.37,  0.36],
  [ 0.58, 0.36, -0.38],
  [ 0.00, 0.43, -0.72],
  [-0.58, 0.36, -0.38],
  [ 0.00, 0.30,  0.00]
];
const baseFaces = [
  [0, 1, 2], [0, 2, 3], [0, 4, 1], [0, 5, 4],
  [0, 6, 5], [0, 3, 6],
  [7, 2, 1], [7, 3, 2], [7, 1, 4],
  [7, 4, 5], [7, 5, 6], [7, 6, 3]
];
const base = createPolyhedron(
  baseVertices,
  baseFaces,
  [paperWhite, paperWarm, paperLight, reversePaper],
  [2, 0, 1, 2, 0, 1, 3, 3, 3, 3, 3, 3],
  0.38
);
crane.add(base);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(32, 32),
  new THREE.MeshStandardMaterial({
    color: 0xd8d3c9,
    roughness: 1,
    metalness: 0
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.285;
ground.receiveShadow = true;
scene.add(ground);

const hemisphere = new THREE.HemisphereLight(0xfffaf0, 0x716d6a, 2.15);
scene.add(hemisphere);

const keyLight = new THREE.DirectionalLight(0xfff4df, 4.4);
keyLight.position.set(5.5, 9, 6.5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -7;
keyLight.shadow.camera.right = 7;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -4;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 22;
keyLight.shadow.bias = -0.00035;
keyLight.shadow.normalBias = 0.025;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xcad9ea, 1.8);
fillLight.position.set(-6, 4, -5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffd6c4, 1.35);
rimLight.position.set(2, 5, -8);
scene.add(rimLight);

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}
window.addEventListener('resize', resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
