<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brushed Brass Stallion</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #11100e; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11100e);
scene.fog = new THREE.Fog(0x11100e, 10, 22);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.4, 4.3, 7.6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.target.set(0, 2.25, 0);

scene.add(new THREE.HemisphereLight(0xffe4b0, 0x211a14, 2.2));

const key = new THREE.DirectionalLight(0xffd7a0, 4.2);
key.position.set(5, 9, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -2;
scene.add(key);

const rim = new THREE.DirectionalLight(0x7d96b8, 2.0);
rim.position.set(-5, 5, -6);
scene.add(rim);

const brass = new THREE.MeshStandardMaterial({
  color: 0xb7833e,
  metalness: 0.91,
  roughness: 0.29
});
brass.onBeforeCompile = shader => {
  shader.vertexShader = shader.vertexShader.replace(
    "#include <common>",
    "#include <common>\nvarying vec3 vWorldPos;"
  );
  shader.vertexShader = shader.vertexShader.replace(
    "#include <worldpos_vertex>",
    "#include <worldpos_vertex>\nvWorldPos = worldPosition.xyz;"
  );
  shader.fragmentShader = shader.fragmentShader.replace(
    "#include <common>",
    "#include <common>\nvarying vec3 vWorldPos;"
  );
  shader.fragmentShader = shader.fragmentShader.replace(
    "#include <color_fragment>",
    "#include <color_fragment>\nfloat grain = sin(vWorldPos.y * 175.0 + vWorldPos.x * 11.0 + vWorldPos.z * 4.0) * 0.018;\ndiffuseColor.rgb *= 1.0 + grain;"
  );
};

const highlightBrass = new THREE.MeshStandardMaterial({
  color: 0xd09b4d,
  metalness: 0.94,
  roughness: 0.22
});

const patina = new THREE.MeshStandardMaterial({
  color: 0x3c2919,
  metalness: 0.83,
  roughness: 0.43
});

const darkEye = new THREE.MeshStandardMaterial({
  color: 0x090705,
  metalness: 0.35,
  roughness: 0.18
});

const root = new THREE.Group();
scene.add(root);

function finish(mesh, material = brass) {
  mesh.material = material;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  root.add(mesh);
  return mesh;
}

function ellipsoid(position, scale, material = brass, segments = 32) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, segments, segments), material);
  mesh.position.set(position[0], position[1], position[2]);
  mesh.scale.set(scale[0], scale[1], scale[2]);
  return finish(mesh, material);
}

function segment(a, b, radiusA, radiusB, material = brass, radial = 18) {
  const start = new THREE.Vector3(a[0], a[1], a[2]);
  const end = new THREE.Vector3(b[0], b[1], b[2]);
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const mesh = new THREE.Mesh(new THREE.ConeGeometry(radiusB, length, radial, 1, false), material);
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  return finish(mesh, material);
}

function tube(points, radius, material = brass, tubular = 28) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], p[1], p[2])));
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, tubular, radius, 8, false), material);
  return finish(mesh, material);
}

function hoof(position, rotation = [0, 0, 0]) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 16), patina);
  mesh.position.set(position[0], position[1], position[2]);
  mesh.scale.set(0.26, 0.19, 0.34);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  return finish(mesh, patina);
}

const base = new THREE.Mesh(new THREE.CylinderGeometry(1.72, 1.9, 0.34, 64), patina);
base.position.y = 0.18;
base.scale.z = 0.62;
finish(base, patina);

const baseTop = new THREE.Mesh(new THREE.CylinderGeometry(1.54, 1.66, 0.12, 64), brass);
baseTop.position.y = 0.38;
baseTop.scale.z = 0.62;
finish(baseTop, brass);

const baseRim = new THREE.Mesh(new THREE.TorusGeometry(1.65, 0.055, 10, 72), highlightBrass);
baseRim.position.y = 0.35;
baseRim.rotation.x = Math.PI / 2;
baseRim.scale.z = 0.62;
finish(baseRim, highlightBrass);

ellipsoid([0, 2.55, 0], [1.48, 0.82, 0.62]);
ellipsoid([-0.78, 2.72, 0], [0.72, 0.68, 0.58], highlightBrass);
ellipsoid([0.76, 2.55, 0], [0.7, 0.63, 0.57], brass);

segment([0.72, 2.82, 0], [1.12, 3.46, 0], 0.56, 0.43, brass);
segment([1.12, 3.42, 0], [1.42, 4.03, 0], 0.44, 0.34, highlightBrass);
ellipsoid([1.55, 4.22, 0], [0.57, 0.42, 0.34], brass);
ellipsoid([1.92, 4.16, 0], [0.42, 0.29, 0.28], highlightBrass);
ellipsoid([2.22, 4.09, 0], [0.3, 0.2, 0.22], patina);

segment([1.33, 4.43, -0.15], [1.35, 4.78, -0.18], 0.13, 0.05, brass);
segment([1.69, 4.4, 0.12], [1.82, 4.69, 0.15], 0.13, 0.05, brass);

ellipsoid([1.72, 4.28, 0.29], [0.065, 0.1, 0.045], darkEye);
ellipsoid([1.72, 4.28, -0.29], [0.065, 0.1, 0.045], darkEye);

segment([-0.82, 2.53, 0], [-1.02, 1.48, 0.05], 0.42, 0.31, brass);
segment([-1.02, 1.48, 0.05], [-0.84, 0.58, 0.03], 0.31, 0.2, highlightBrass);
hoof([-0.84, 0.39, 0.03], [0.08, 0.1, 0]);

segment([-0.34, 2.25, 0.35], [-0.2, 1.35, 0.4], 0.33, 0.24, brass);
segment([-0.2, 1.35, 0.4], [0.12, 0.55, 0.34], 0.24, 0.16, patina);
hoof([0.16, 0.39, 0.34], [0.12, -0.1, 0]);

segment([0.92, 2.82, 0.3], [1.6, 3.15, 0.34], 0.27, 0.19, brass);
segment([1.6, 3.15, 0.34], [2.04, 3.58, 0.31], 0.19, 0.12, highlightBrass);
segment([2.04, 3.58, 0.31], [1.78, 3.88, 0.29], 0.12, 0.08, patina);
hoof([1.72, 3.98, 0.29], [0.4, 0.2, -0.45]);

segment([0.98, 2.76, -0.3], [1.62, 3.02, -0.38], 0.26, 0.18, brass);
segment([1.62, 3.02, -0.38], [2.2, 3.32, -0.34], 0.18, 0.11, highlightBrass);
segment([2.2, 3.32, -0.34], [2.02, 3.65, -0.31], 0.11, 0.075, patina);
hoof([1.98, 3.76, -0.3], [0.35, -0.2, -0.4]);

tube([[0.55, 2.78, 0.56], [0.22, 2.98, 0.59], [-0.25, 3.02, 0.58], [-0.78, 2.85, 0.5]], 0.055, patina, 20);
tube([[0.42, 2.42, 0.61], [0.05, 2.28, 0.65], [-0.42, 2.35, 0.6], [-0.9, 2.55, 0.48]], 0.045, patina, 20);
tube([[0.75, 2.66, 0.59], [0.35, 2.5, 0.63], [-0.05, 2.52, 0.63]], 0.035, highlightBrass, 18);

const maneMaterial = new THREE.MeshStandardMaterial({
  color: 0x6d451f,
  metalness: 0.88,
  roughness: 0.34
});

tube([[1.15, 3.72, -0.45], [0.73, 3.93, -0.58], [0.2, 4.04, -0.65], [-0.38, 3.96, -0.7]], 0.105, maneMaterial, 24);
tube([[1.28, 3.9, -0.48], [0.83, 4.18, -0.63], [0.38, 4.35, -0.7], [-0.2, 4.42, -0.74]], 0.09, brass, 24);
tube([[1.39, 4.08, -0.42], [1.02, 4.39, -0.57], [0.56, 4.62, -0.62], [0.12, 4.72, -0.67]], 0.075, maneMaterial, 22);
tube([[1.45, 4.2, 0.4], [1.06, 4.48, 0.53], [0.62, 4.66, 0.58], [0.22, 4.73, 0.62]], 0.06, highlightBrass, 22);

tube([[-1.08, 2.78, 0], [-1.55, 3.0, 0.05], [-2.0, 3.25, 0.08], [-2.46, 3.27, 0.04]], 0.18, brass, 28);
tube([[-1.25, 2.7, 0.15], [-1.72, 2.83, 0.26], [-2.25, 2.98, 0.3], [-2.72, 3.18, 0.26]], 0.12, highlightBrass, 26);
tube([[-1.28, 2.6, -0.18], [-1.77, 2.55, -0.28], [-2.28, 2.66, -0.31], [-2.68, 2.9, -0.25]], 0.105, maneMaterial, 26);
tube([[-1.3, 2.55, 0], [-1.77, 2.32, 0.04], [-2.25, 2.28, 0.1], [-2.57, 2.47, 0.14]], 0.075, brass, 24);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(12, 96),
  new THREE.MeshStandardMaterial({ color: 0x171411, roughness: 0.76, metalness: 0.08 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.015;
floor.receiveShadow = true;
scene.add(floor);

const underGlow = new THREE.PointLight(0xa87943, 0.55, 7);
underGlow.position.set(0, 0.8, 1.5);
scene.add(underGlow);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
