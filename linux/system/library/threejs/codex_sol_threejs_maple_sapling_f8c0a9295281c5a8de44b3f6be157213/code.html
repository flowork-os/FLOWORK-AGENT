<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Young Maple Sapling</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #dce7db;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xdce7db);
  scene.fog = new THREE.Fog(0xdce7db, 10, 21);

  const camera = new THREE.PerspectiveCamera(
    40,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );
  camera.position.set(6.8, 4.7, 8.5);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 2.35, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.42;
  controls.minDistance = 4.5;
  controls.maxDistance = 14;
  controls.maxPolarAngle = Math.PI * 0.49;

  const hemisphereLight = new THREE.HemisphereLight(0xeaf4ff, 0x687253, 2.1);
  scene.add(hemisphereLight);

  const sun = new THREE.DirectionalLight(0xfff4d6, 3.4);
  sun.position.set(-4.5, 8.5, 5.5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -5;
  sun.shadow.camera.right = 5;
  sun.shadow.camera.top = 7;
  sun.shadow.camera.bottom = -2;
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 20;
  sun.shadow.bias = -0.00025;
  sun.shadow.normalBias = 0.025;
  scene.add(sun);

  const fillLight = new THREE.DirectionalLight(0xa9c8df, 0.65);
  fillLight.position.set(5, 4, -5);
  scene.add(fillLight);

  let seed = 284731;
  function random() {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  }

  function range(min, max) {
    return min + (max - min) * random();
  }

  const sapling = new THREE.Group();
  scene.add(sapling);

  const barkMaterials = [
    new THREE.MeshStandardMaterial({
      color: 0x70543b,
      roughness: 0.93,
      metalness: 0
    }),
    new THREE.MeshStandardMaterial({
      color: 0x785b40,
      roughness: 0.96,
      metalness: 0
    }),
    new THREE.MeshStandardMaterial({
      color: 0x624a36,
      roughness: 0.9,
      metalness: 0
    })
  ];

  const twigMaterial = new THREE.MeshStandardMaterial({
    color: 0x67503b,
    roughness: 0.91,
    metalness: 0
  });

  const petioleMaterials = [
    new THREE.MeshStandardMaterial({
      color: 0x71833c,
      roughness: 0.82,
      side: THREE.DoubleSide
    }),
    new THREE.MeshStandardMaterial({
      color: 0x8a7140,
      roughness: 0.85,
      side: THREE.DoubleSide
    }),
    new THREE.MeshStandardMaterial({
      color: 0x8f4e3d,
      roughness: 0.84,
      side: THREE.DoubleSide
    })
  ];

  const leafMaterials = [
    new THREE.MeshStandardMaterial({
      color: 0x4f873c,
      roughness: 0.76,
      side: THREE.DoubleSide
    }),
    new THREE.MeshStandardMaterial({
      color: 0x639a47,
      roughness: 0.78,
      side: THREE.DoubleSide
    }),
    new THREE.MeshStandardMaterial({
      color: 0x3f7637,
      roughness: 0.75,
      side: THREE.DoubleSide
    }),
    new THREE.MeshStandardMaterial({
      color: 0x779e49,
      roughness: 0.8,
      side: THREE.DoubleSide
    }),
    new THREE.MeshStandardMaterial({
      color: 0x9a8d3e,
      roughness: 0.79,
      side: THREE.DoubleSide
    })
  ];

  function cylinderBetween(start, end, radiusStart, radiusEnd, material, radialSegments = 8) {
    const delta = new THREE.Vector3().subVectors(end, start);
    const length = delta.length();
    if (length < 0.0001) return null;

    const geometry = new THREE.CylinderGeometry(
      Math.max(radiusEnd, 0.001),
      Math.max(radiusStart, 0.001),
      length,
      radialSegments,
      1,
      false
    );
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.copy(start).add(end).multiplyScalar(0.5);
    mesh.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      delta.normalize()
    );
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    sapling.add(mesh);
    return mesh;
  }

  const trunkPoints = [];
  const trunkHeight = 4.65;
  const trunkSegments = 11;

  for (let i = 0; i <= trunkSegments; i++) {
    const t = i / trunkSegments;
    trunkPoints.push(new THREE.Vector3(
      0.045 * Math.sin(t * 7.3) + 0.025 * Math.sin(t * 17.0),
      trunkHeight * t,
      0.04 * Math.sin(t * 5.2 + 0.7)
    ));
  }

  for (let i = 0; i < trunkSegments; i++) {
    const t0 = i / trunkSegments;
    const t1 = (i + 1) / trunkSegments;
    const lowerRadius = THREE.MathUtils.lerp(0.115, 0.034, Math.pow(t0, 0.72));
    const upperRadius = THREE.MathUtils.lerp(0.115, 0.034, Math.pow(t1, 0.72));
    cylinderBetween(
      trunkPoints[i],
      trunkPoints[i + 1],
      lowerRadius,
      upperRadius,
      barkMaterials[i % barkMaterials.length],
      10
    );
  }

  const mapleOutline = [
    [0.00, -0.08],
    [-0.10, 0.15],
    [-0.30, 0.09],
    [-0.24, 0.34],
    [-0.60, 0.39],
    [-0.38, 0.61],
    [-0.76, 0.78],
    [-0.41, 0.84],
    [-0.49, 1.13],
    [-0.18, 0.96],
    [0.00, 1.44],
    [0.18, 0.96],
    [0.49, 1.13],
    [0.41, 0.84],
    [0.76, 0.78],
    [0.38, 0.61],
    [0.60, 0.39],
    [0.24, 0.34],
    [0.30, 0.09],
    [0.10, 0.15]
  ];

  const leafShape = new THREE.Shape();
  leafShape.moveTo(mapleOutline[0][0], mapleOutline[0][1]);
  for (let i = 1; i < mapleOutline.length; i++) {
    leafShape.lineTo(mapleOutline[i][0], mapleOutline[i][1]);
  }
  leafShape.closePath();

  const leafGeometry = new THREE.ShapeGeometry(leafShape);
  leafGeometry.computeVertexNormals();

  const veinMaterial = new THREE.LineBasicMaterial({
    color: 0x315e2d,
    transparent: true,
    opacity: 0.42
  });

  function orientLeaf(object, direction, normalHint) {
    const yAxis = direction.clone().normalize();
    let zAxis = normalHint.clone();
    zAxis.addScaledVector(yAxis, -zAxis.dot(yAxis));

    if (zAxis.lengthSq() < 0.001) {
      zAxis.set(0, 0, 1);
      zAxis.addScaledVector(yAxis, -zAxis.dot(yAxis));
    }

    zAxis.normalize();
    const xAxis = new THREE.Vector3().crossVectors(yAxis, zAxis).normalize();
    zAxis.crossVectors(xAxis, yAxis).normalize();

    const basis = new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis);
    object.quaternion.setFromRotationMatrix(basis);
  }

  function addLeaf(base, direction, size, materialIndex) {
    const leafDirection = direction.clone().normalize();
    const petioleLength = size * range(0.31, 0.42);
    const leafBase = base.clone().addScaledVector(leafDirection, petioleLength);

    cylinderBetween(
      base,
      leafBase,
      size * 0.018,
      size * 0.012,
      petioleMaterials[materialIndex % petioleMaterials.length],
      6
    );

    const leafGroup = new THREE.Group();
    leafGroup.position.copy(leafBase);

    const leaf = new THREE.Mesh(
      leafGeometry,
      leafMaterials[materialIndex % leafMaterials.length]
    );
    leaf.scale.set(size * range(0.92, 1.08), size, size);
    leaf.castShadow = true;
    leaf.receiveShadow = true;
    leafGroup.add(leaf);

    const veinPoints = [
      new THREE.Vector3(0, 0.02, 0.003),
      new THREE.Vector3(0, 1.19, 0.003)
    ];
    const midVein = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints(veinPoints),
      veinMaterial
    );
    leafGroup.add(midVein);

    const sideVeins = [
      [0.02, 0.47, -0.42, 0.79],
      [-0.02, 0.47, 0.42, 0.79],
      [0.01, 0.65, -0.35, 1.00],
      [-0.01, 0.65, 0.35, 1.00]
    ];

    for (const vein of sideVeins) {
      const line = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(vein[0], vein[1], 0.003),
          new THREE.Vector3(vein[2], vein[3], 0.003)
        ]),
        veinMaterial
      );
      leafGroup.add(line);
    }

    const normalHint = new THREE.Vector3(
      range(-0.65, 0.65),
      range(0.35, 0.9),
      range(-0.65, 0.65)
    ).normalize();

    orientLeaf(leafGroup, leafDirection, normalHint);
    leafGroup.rotateY(range(-0.35, 0.35));
    sapling.add(leafGroup);
  }

  function terminalLeaves(position, branchDirection, scale) {
    const count = random() < 0.48 ? 1 : 2;
    const baseAzimuth = range(0, Math.PI * 2);

    for (let i = 0; i < count; i++) {
      const angle = baseAzimuth + i * range(1.7, 2.5);
      const leafDirection = branchDirection.clone().multiplyScalar(0.52);
      leafDirection.add(new THREE.Vector3(
        Math.cos(angle) * range(0.5, 0.85),
        range(0.12, 0.48),
        Math.sin(angle) * range(0.5, 0.85)
      ));
      leafDirection.normalize();

      addLeaf(
        position,
        leafDirection,
        scale * range(0.86, 1.08),
        Math.floor(random() * leafMaterials.length)
      );
    }
  }

  function growBranch(start, initialDirection, length, radius, depth) {
    let current = start.clone();
    let direction = initialDirection.clone().normalize();
    const segmentCount = depth > 0 ? 3 : 2;
    const segmentLength = length / segmentCount;

    for (let i = 0; i < segmentCount; i++) {
      direction.add(new THREE.Vector3(
        range(-0.10, 0.10),
        range(-0.018, 0.075),
        range(-0.10, 0.10)
      )).normalize();

      const next = current.clone().addScaledVector(
        direction,
        segmentLength * range(0.9, 1.08)
      );

      const fraction0 = i / segmentCount;
      const fraction1 = (i + 1) / segmentCount;
      const radius0 = THREE.MathUtils.lerp(radius, radius * 0.52, fraction0);
      const radius1 = THREE.MathUtils.lerp(radius, radius * 0.52, fraction1);

      cylinderBetween(
        current,
        next,
        radius0,
        radius1,
        depth === 0 ? twigMaterial : barkMaterials[(i + depth) % barkMaterials.length],
        depth === 0 ? 6 : 7
      );
      current = next;
    }

    if (depth > 0) {
      const childCount = random() < 0.23 ? 3 : 2;
      const baseAngle = Math.atan2(direction.z, direction.x);

      for (let i = 0; i < childCount; i++) {
        const spread = baseAngle + (i - (childCount - 1) * 0.5) * range(0.8, 1.25);
        const childDirection = direction.clone().multiplyScalar(0.45);
        childDirection.add(new THREE.Vector3(
          Math.cos(spread) * range(0.48, 0.72),
          range(0.18, 0.42),
          Math.sin(spread) * range(0.48, 0.72)
        )).normalize();

        growBranch(
          current,
          childDirection,
          length * range(0.46, 0.59),
          radius * 0.54,
          depth - 1
        );
      }

      if (random() < 0.42) {
        terminalLeaves(current, direction, range(0.25, 0.31));
      }
    } else {
      terminalLeaves(current, direction, range(0.28, 0.36));
    }
  }

  const branchLevels = [
    { index: 4, angle: 0.30, length: 0.78, lift: 0.43, radius: 0.035 },
    { index: 5, angle: 3.32, length: 0.93, lift: 0.36, radius: 0.038 },
    { index: 6, angle: 1.62, length: 1.07, lift: 0.42, radius: 0.040 },
    { index: 7, angle: 4.63, length: 1.02, lift: 0.48, radius: 0.036 },
    { index: 8, angle: 2.68, length: 0.88, lift: 0.53, radius: 0.032 },
    { index: 9, angle: 5.78, length: 0.72, lift: 0.59, radius: 0.027 },
    { index: 10, angle: 1.03, length: 0.58, lift: 0.66, radius: 0.022 }
  ];

  for (const branch of branchLevels) {
    const start = trunkPoints[branch.index].clone();
    const direction = new THREE.Vector3(
      Math.cos(branch.angle),
      branch.lift,
      Math.sin(branch.angle)
    ).normalize();

    growBranch(
      start,
      direction,
      branch.length,
      branch.radius,
      branch.index < 9 ? 1 : 0
    );
  }

  terminalLeaves(
    trunkPoints[trunkPoints.length - 1],
    new THREE.Vector3(0.05, 1, -0.03),
    0.33
  );

  const lenticelMaterialLight = new THREE.MeshStandardMaterial({
    color: 0x9a7a57,
    roughness: 1
  });
  const lenticelMaterialDark = new THREE.MeshStandardMaterial({
    color: 0x4c392b,
    roughness: 1
  });
  const lenticelGeometry = new THREE.SphereGeometry(1, 6, 4);

  for (let i = 0; i < 22; i++) {
    const y = range(0.18, 3.5);
    const t = y / trunkHeight;
    const radius = THREE.MathUtils.lerp(0.112, 0.045, Math.pow(t, 0.72));
    const angle = range(0, Math.PI * 2);
    const mark = new THREE.Mesh(
      lenticelGeometry,
      i % 3 === 0 ? lenticelMaterialDark : lenticelMaterialLight
    );
    mark.position.set(
      Math.cos(angle) * (radius + 0.002) + 0.04 * Math.sin(t * 7.3),
      y,
      Math.sin(angle) * (radius + 0.002) + 0.035 * Math.sin(t * 5.2 + 0.7)
    );
    mark.scale.set(
      range(0.018, 0.035),
      range(0.006, 0.011),
      range(0.004, 0.007)
    );
    mark.rotation.y = -angle;
    sapling.add(mark);
  }

  const groundMaterial = new THREE.MeshStandardMaterial({
    color: 0x71835e,
    roughness: 0.98,
    metalness: 0
  });
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(7.5, 96),
    groundMaterial
  );
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.025;
  ground.receiveShadow = true;
  scene.add(ground);

  const moundMaterial = new THREE.MeshStandardMaterial({
    color: 0x5e6e4e,
    roughness: 1
  });
  const mound = new THREE.Mesh(
    new THREE.SphereGeometry(0.56, 32, 12, 0, Math.PI * 2, 0, Math.PI * 0.42),
    moundMaterial
  );
  mound.scale.set(1.25, 0.18, 1);
  mound.position.y = -0.07;
  mound.receiveShadow = true;
  scene.add(mound);

  const pebbleMaterials = [
    new THREE.MeshStandardMaterial({ color: 0x777569, roughness: 1 }),
    new THREE.MeshStandardMaterial({ color: 0x898473, roughness: 1 }),
    new THREE.MeshStandardMaterial({ color: 0x676a5d, roughness: 1 })
  ];

  for (let i = 0; i < 18; i++) {
    const angle = range(0, Math.PI * 2);
    const distance = range(0.55, 2.7);
    const pebble = new THREE.Mesh(
      new THREE.DodecahedronGeometry(range(0.025, 0.07), 0),
      pebbleMaterials[i % pebbleMaterials.length]
    );
    pebble.position.set(
      Math.cos(angle) * distance,
      range(0.008, 0.025),
      Math.sin(angle) * distance
    );
    pebble.scale.y = range(0.45, 0.75);
    pebble.rotation.set(range(0, 1), range(0, Math.PI), range(0, 1));
    pebble.castShadow = true;
    pebble.receiveShadow = true;
    scene.add(pebble);
  }

  const grassMaterial = new THREE.MeshStandardMaterial({
    color: 0x607b4d,
    roughness: 0.95,
    side: THREE.DoubleSide
  });
  const grassGeometry = new THREE.ConeGeometry(0.018, 0.18, 4);

  for (let i = 0; i < 56; i++) {
    const angle = range(0, Math.PI * 2);
    const distance = range(0.4, 4.8);
    const blade = new THREE.Mesh(grassGeometry, grassMaterial);
    blade.position.set(
      Math.cos(angle) * distance,
      0.07,
      Math.sin(angle) * distance
    );
    blade.scale.set(range(0.45, 0.85), range(0.5, 1.35), range(0.45, 0.85));
    blade.rotation.z = range(-0.18, 0.18);
    blade.rotation.y = range(0, Math.PI);
    blade.castShadow = true;
    scene.add(blade);
  }

  const shadowPlane = new THREE.Mesh(
    new THREE.PlaneGeometry(32, 32),
    new THREE.ShadowMaterial({
      color: 0x243020,
      opacity: 0.12
    })
  );
  shadowPlane.rotation.x = -Math.PI / 2;
  shadowPlane.position.y = -0.018;
  shadowPlane.receiveShadow = true;
  scene.add(shadowPlane);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
