<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cozy Log Cabin Interior</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#090b12}
  canvas{display:block}
  #caption{position:fixed;left:18px;bottom:14px;color:#f8e7c4aa;font:12px/1.4 Georgia,serif;letter-spacing:.08em;pointer-events:none;text-shadow:0 1px 4px #000}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="caption">A winter evening in the old pine cabin</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11101a);
scene.fog = new THREE.FogExp2(0x18141a, 0.024);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 100);
camera.position.set(9.4, 6.1, 11.4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.65, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.22;
controls.minDistance = 7;
controls.maxDistance = 17;
controls.maxPolarAngle = Math.PI * 0.49;

let seed = 31991;
const rand = () => {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
};
const range = (a, b) => a + (b - a) * rand();
const pick = a => a[Math.floor(rand() * a.length)];

const wood = new THREE.MeshStandardMaterial({ color: 0x5a2e18, roughness: 0.78, metalness: 0 });
const darkWood = new THREE.MeshStandardMaterial({ color: 0x2d160f, roughness: 0.8 });
const cutWood = new THREE.MeshStandardMaterial({ color: 0x9a6332, roughness: 0.88 });
const bark = new THREE.MeshStandardMaterial({ color: 0x3b1b10, roughness: 0.95 });
const stone = new THREE.MeshStandardMaterial({ color: 0x5b5652, roughness: 0.96 });
const stoneDark = new THREE.MeshStandardMaterial({ color: 0x302d2d, roughness: 0.96 });
const brass = new THREE.MeshStandardMaterial({ color: 0xb77b2d, roughness: 0.31, metalness: 0.82 });
const iron = new THREE.MeshStandardMaterial({ color: 0x171517, roughness: 0.54, metalness: 0.67 });
const leather = new THREE.MeshStandardMaterial({ color: 0x60331e, roughness: 0.68, metalness: 0 });
const leatherLight = new THREE.MeshStandardMaterial({ color: 0x8a4a28, roughness: 0.7 });
const cream = new THREE.MeshStandardMaterial({ color: 0xd5bf9a, roughness: 0.95 });
const bookColors = [0x7c2330,0x213e50,0x415732,0x9a592b,0x5b3b62,0x9b7338,0x303c42];
const bookMats = bookColors.map(c => new THREE.MeshStandardMaterial({ color:c, roughness:0.79 }));
const snowMat = new THREE.MeshStandardMaterial({ color:0xdcecff, roughness:0.95 });
const frostMat = new THREE.MeshStandardMaterial({ color:0xa7c7ed, transparent:true, opacity:0.25, roughness:0.5 });
const emberMat = new THREE.MeshStandardMaterial({ color:0xbd2007, emissive:0xff3506, emissiveIntensity:2, roughness:0.8 });
const coalMat = new THREE.MeshStandardMaterial({ color:0x170b08, emissive:0x441006, emissiveIntensity:0.5, roughness:0.9 });

function mesh(geometry, material, x=0, y=0, z=0) {
  const m = new THREE.Mesh(geometry, material);
  m.position.set(x,y,z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}
function box(w,h,d,mat,x=0,y=0,z=0,bevel=0) {
  const g = bevel ? new THREE.BoxGeometry(w,h,d,1,1,1) : new THREE.BoxGeometry(w,h,d);
  return mesh(g,mat,x,y,z);
}
function cyl(r1,r2,h,mat,x=0,y=0,z=0,segments=16) {
  return mesh(new THREE.CylinderGeometry(r1,r2,h,segments),mat,x,y,z);
}
function sphere(r,mat,x=0,y=0,z=0) {
  return mesh(new THREE.SphereGeometry(r,18,12),mat,x,y,z);
}
function add(group, obj) { group.add(obj); return obj; }

const room = new THREE.Group();
scene.add(room);

const floor = mesh(new THREE.PlaneGeometry(18, 16), new THREE.MeshStandardMaterial({
  color:0x4d2b1b, roughness:0.86
}));
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.receiveShadow = true;
room.add(floor);

for (let x=-8; x<=8; x+=0.67) {
  const plank = box(0.57,0.025,14.5, pick([wood,darkWood,cutWood]), x+range(-.04,.04), .02, .25+range(-.06,.06));
  plank.scale.z = range(.92,1.02);
  room.add(plank);
}
for (let z=-6.7; z<7; z+=1.7) {
  const seam = box(16.8,.032,.026,darkWood,0,.045,z);
  room.add(seam);
}

function logWall(axis, pos, length, rows, openings=[]) {
  const group = new THREE.Group();
  for (let row=0; row<rows; row++) {
    const y = .36 + row * .43;
    const stagger = row % 2 ? .26 : 0;
    for (let k=-length/2; k<length/2; k+=1.08) {
      const center = k+.54+stagger;
      let blocked = false;
      for (const o of openings) {
        const a = axis === 'x' ? center : pos;
        const b = axis === 'x' ? pos : center;
        if (a>o.minX && a<o.maxX && y>o.minY && y<o.maxY && b>o.minZ && b<o.maxZ) blocked = true;
      }
      if (blocked) continue;
      const log = cyl(.235,.255,1.18,wood);
      log.rotation.z = Math.PI/2;
      if (axis === 'z') log.rotation.y = Math.PI/2;
      if (axis === 'x') log.position.set(center,y,pos);
      else log.position.set(pos,y,center);
      log.rotation.x += range(-.025,.025);
      log.rotation.z += range(-.018,.018);
      log.castShadow = log.receiveShadow = true;
      group.add(log);
      if (rand() > .55) {
        const knot = sphere(range(.025,.052),bark);
        if (axis === 'x') knot.position.set(center+range(-.25,.25),y+range(-.1,.1),pos+(rand()>.5?.24:-.24));
        else knot.position.set(pos+(rand()>.5?.24:-.24),y+range(-.1,.1),center+range(-.25,.25));
        group.add(knot);
      }
    }
  }
  room.add(group);
}
logWall('x', -6.9, 15.5, 13);
logWall('z', -7.5, 15, 13);
logWall('z', 7.15, 15, 13);
logWall('x', 7.6, 15.1, 13, [{minX:-3.4,maxX:1.0,minY:1.25,maxY:4.8,minZ:7.1,maxZ:8}]);

const ceiling = new THREE.Group();
room.add(ceiling);
const roofPanel = box(15.8,.2,14.5,darkWood,0,5.95,.1);
ceiling.add(roofPanel);
for (let x=-7.1; x<=7.1; x+=2.35) {
  const beam = cyl(.19,.22,14.8,bark,x,5.68,0);
  beam.rotation.x = Math.PI/2;
  ceiling.add(beam);
}
for (let x=-6.9; x<=6.9; x+=2.4) {
  for (let z=-6; z<=6; z+=2.2) {
    const peg = cyl(.07,.07,.32,cutWood,x,5.48,z);
    ceiling.add(peg);
  }
}

const windowGroup = new THREE.Group();
windowGroup.position.set(3.7,3.25,7.22);
room.add(windowGroup);
const night = mesh(new THREE.PlaneGeometry(3.15,2.45), new THREE.MeshBasicMaterial({color:0x16274a}),0,0,-.025);
windowGroup.add(night);
const glowSky = mesh(new THREE.PlaneGeometry(3.0,1.05),new THREE.MeshBasicMaterial({color:0x314b7c,transparent:true,opacity:.58}),0,-.65,-.04);
windowGroup.add(glowSky);
for(let i=0;i<85;i++){
  const s = sphere(range(.012,.043),snowMat,range(-1.45,1.45),range(-1.1,1.08),range(-.07,-.03));
  s.userData.baseX=s.position.x; s.userData.baseY=s.position.y; s.userData.speed=range(.35,1.1);
  windowGroup.add(s);
}
const frameMat = new THREE.MeshStandardMaterial({color:0x25140d,roughness:.75});
windowGroup.add(box(3.55,.18,.18,frameMat,0,1.32,.12));
windowGroup.add(box(3.55,.18,.18,frameMat,0,-1.32,.12));
windowGroup.add(box(.18,2.8,.18,frameMat,-1.68,0,.12));
windowGroup.add(box(.18,2.8,.18,frameMat,1.68,0,.12));
windowGroup.add(box(.12,2.55,.11,frameMat,0,0,.13));
windowGroup.add(box(3.25,.12,.11,frameMat,0,0,.13));
for(let i=0;i<25;i++){
  const ice = mesh(new THREE.PlaneGeometry(range(.04,.14),range(.22,.7)),frostMat,range(-1.42,1.42),1.1-range(0,.3),.16);
  ice.rotation.z=range(-.35,.35);
  windowGroup.add(ice);
}

const fireplace = new THREE.Group();
fireplace.position.set(-3.5,0,-7.15);
room.add(fireplace);
function stoneBlock(x,y,z,w,h,d) {
  const b = box(w,h,d,pick([stone,stone,stoneDark]),x,y,z);
  b.rotation.y = range(-.04,.04);
  b.rotation.z = range(-.025,.025);
  fireplace.add(b);
}
for(let row=0;row<7;row++){
  const y=.18+row*.36;
  const n=row<2?6:5;
  for(let i=0;i<n;i++){
    const x=(i-(n-1)/2)*.62+(row%2?.12:0);
    if(row>1 && x>-1.05 && x<1.05 && row<5) continue;
    stoneBlock(x,y,.18,.57,.32,.55);
  }
}
for(let row=0;row<3;row++){
  for(let i=0;i<5;i++) stoneBlock((i-2)*.63,2.62+row*.34,.15,.59,.3,.57);
}
for(let i=0;i<8;i++) stoneBlock((i-3.5)*.58,3.63,.15,.56,.3,.68);
const hearth=box(3.8,.25,1.28,stoneDark,0,.12,.55);
fireplace.add(hearth);
const firebox = mesh(new THREE.BoxGeometry(2.02,1.42,.4),new THREE.MeshStandardMaterial({color:0x100908,roughness:1}),0,1.3,.02);
fireplace.add(firebox);

const logs = new THREE.Group();
fireplace.add(logs);
for(let i=0;i<4;i++){
  const l=cyl(.115,.13,1.45,coalMat,range(-.5,.5),.68+range(-.03,.15),.34,10);
  l.rotation.z=Math.PI/2+range(-.3,.3);
  l.rotation.y=range(-.12,.12);
  logs.add(l);
}
const flames=[];
for(let i=0;i<17;i++){
  const f=mesh(new THREE.ConeGeometry(range(.05,.13),range(.35,.8),8),new THREE.MeshStandardMaterial({
    color:pick([0xff6418,0xffb12b,0xffd76a]),emissive:pick([0xff2904,0xff7008]),emissiveIntensity:2.8,roughness:.7
  }),range(-.67,.67),.68+range(0,.18),.20+range(-.05,.08));
  f.userData={base:f.position.clone(),phase:rand()*6.28,scale:range(.75,1.25)};
  fireplace.add(f); flames.push(f);
}
for(let i=0;i<18;i++){
  const e=sphere(range(.025,.06),emberMat,range(-.85,.85),.47+range(0,.18),.35+range(-.12,.16));
  e.userData.phase=rand()*6.28;
  fireplace.add(e); flames.push(e);
}

const mantel = box(4.1,.25,.65,darkWood,-3.5,3.82,-6.86);
mantel.castShadow=true; room.add(mantel);
const clock = new THREE.Group();
clock.position.set(-3.5,4.17,-6.78); room.add(clock);
clock.add(cyl(.34,.34,.12,brass,0,0,0,24).rotateX(Math.PI/2));
const face=mesh(new THREE.CircleGeometry(.265,24),cream,0,0,.07); clock.add(face);
for(let i=0;i<12;i++){ const a=i*Math.PI/6; const m=box(.025,.055,.013,iron,Math.sin(a)*.21,Math.cos(a)*.21,.08);m.rotation.z=-a;clock.add(m); }

const bookshelf = new THREE.Group();
bookshelf.position.set(5.5,0.1,-6.85); room.add(bookshelf);
bookshelf.add(box(2.45,4.52,.48,darkWood,0,2.25,0));
bookshelf.add(box(2.15,4.18,.26,wood,0,2.28,.29));
for(let y=1.03;y<4.12;y+=1.03) bookshelf.add(box(2.3,.12,.52,bark,0,y,.02));
for(let side of [-1,1]) bookshelf.add(box(.18,4.55,.58,bark,side*1.12,2.28,.02));
for(let shelf=0;shelf<4;shelf++){
  let x=-.91;
  while(x<.9){
    const w=range(.12,.25), h=range(.5,.85);
    const b=box(w,h,.23,pick(bookMats),x+w/2,.63+shelf*1.03,.33);
    b.rotation.z=range(-.055,.055);
    bookshelf.add(b); x+=w+range(.025,.06);
  }
}
for(let i=0;i<4;i++){
  const pot=sphere(.13,cream,range(-.75,.75),4.43,.3);
  pot.scale.y=.65; bookshelf.add(pot);
}

const chair = new THREE.Group();
chair.position.set(1.7,0.15,1.5);
chair.rotation.y=-.43;
room.add(chair);
chair.add(box(2.04,.34,1.73,leather,0,.82,0,.13));
chair.add(box(1.75,1.8,.32,leather,0,1.78,.57,.15).rotateX(-.13));
chair.add(box(.34,.75,1.55,leather,-1.04,1.15,0,.11));
chair.add(box(.34,.75,1.55,leather,1.04,1.15,0,.11));
chair.add(box(1.52,.28,1.22,leatherLight,0,1.1,-.12,.1));
for(const x of [-.8,.8]) for(const z of [-.58,.58]) {
  const leg=cyl(.09,.12,.72,darkWood,x,.35,z,10); chair.add(leg);
}
for(let i=0;i<8;i++){
  const tuft=sphere(.045,darkWood,range(-.65,.65),1.9+range(-.35,.35),.77);
  chair.add(tuft);
}
const throwGroup=new THREE.Group();
throwGroup.position.set(.52,1.25,-.56);
throwGroup.rotation.set(.18,.1,-.18);
chair.add(throwGroup);
const yarnColors=[0x9d392b,0xb04c34,0xe0a86a];
for(let i=0;i<23;i++){
  const strand=mesh(new THREE.TorusGeometry(.055,.014,6,10,Math.PI*1.45),new THREE.MeshStandardMaterial({color:pick(yarnColors),roughness:.95}),range(-.55,.55),range(-.64,.58),range(-.03,.03));
  strand.rotation.z=range(-1.5,1.5); throwGroup.add(strand);
}
const throwBase=box(1.2,1.52,.08,new THREE.MeshStandardMaterial({color:0xa74734,roughness:.95}),0,0,0);
throwGroup.add(throwBase);
for(let i=0;i<12;i++) throwGroup.add(cyl(.012,.012,range(.12,.26),cream,-.53+i*.095,-.86,.01,6).rotateZ(range(-.25,.25)));

const table = new THREE.Group();
table.position.set(-.55,0.1,1.6); room.add(table);
table.add(cyl(.9,.92,.12,darkWood,0,1.14,0,32));
table.add(cyl(.17,.22,1.05,wood,0,.58,0,16));
for(let i=0;i<3;i++){
  const a=i*Math.PI*2/3;
  table.add(cyl(.06,.08,.64,darkWood,Math.cos(a)*.53,.37,Math.sin(a)*.53,10));
}
const mug = new THREE.Group();
mug.position.set(.1,1.3,.05); table.add(mug);
mug.add(cyl(.22,.18,.36,cream,0,0,0,20));
mug.add(mesh(new THREE.TorusGeometry(.13,.035,8,14),cream,.22,.03,0).rotateY(Math.PI/2));
const coffee=mesh(new THREE.CircleGeometry(.16,20),new THREE.MeshStandardMaterial({color:0x1c0d08,roughness:.6}),0,.185,0);
coffee.rotation.x=-Math.PI/2; mug.add(coffee);

const steam=[];
for(let i=0;i<9;i++){
  const puff=sphere(range(.035,.075),new THREE.MeshBasicMaterial({color:0xdde6e8,transparent:true,opacity:.24,depthWrite:false}),range(-.07,.07),1.58+i*.09,range(-.07,.07));
  puff.userData={phase:rand()*6.28,startY:puff.position.y};
  room.add(puff); steam.push(puff);
}

const rug = new THREE.Group();
rug.position.set(-.7,.06,-1.45); rug.rotation.y=.12; room.add(rug);
const furMats=[new THREE.MeshStandardMaterial({color:0x6f4e31,roughness:1}),new THREE.MeshStandardMaterial({color:0xa87b4a,roughness:1}),new THREE.MeshStandardMaterial({color:0x3f2c20,roughness:1})];
const rugBase=mesh(new THREE.CircleGeometry(1.6,32),furMats[0],0,0,0);
rugBase.rotation.x=-Math.PI/2; rugBase.scale.set(1.42,.78,1); rug.add(rugBase);
for(let i=0;i<155;i++){
  const a=rand()*Math.PI*2, r=Math.sqrt(rand());
  const tuft=cyl(.018,.008,range(.08,.17),pick(furMats),Math.cos(a)*r*2.12,.055,Math.sin(a)*r*1.17,5);
  tuft.rotation.z=range(-.48,.48); rug.add(tuft);
}
const head=sphere(.34,furMats[2],-2.0,.08,0);
head.scale.set(1,.38,.8); rug.add(head);
for(const x of [-.15,.15]) for(const z of [-.2,.2]) rug.add(sphere(.045,iron,-2.22+x,.22,z));
rug.add(mesh(new THREE.SphereGeometry(.1,12,8),new THREE.MeshBasicMaterial({color:0xc79242}),-2.22,.2,-.08));
rug.add(mesh(new THREE.SphereGeometry(.1,12,8),new THREE.MeshBasicMaterial({color:0xc79242}),-2.22,.2,.08));

const desk = new THREE.Group();
desk.position.set(-5.7,.12,3.65); desk.rotation.y=.13; room.add(desk);
desk.add(box(2.45,.16,1.18,darkWood,0,1.35,0));
for(const x of [-.96,.96]) for(const z of [-.4,.4]) desk.add(cyl(.075,.11,1.32,wood,x,.68,z,10));
desk.add(box(2.28,.75,.08,wood,0,1.83,.52));
const paper=box(.88,.012,.6,new THREE.MeshStandardMaterial({color:0xd9c39d,roughness:.9}),-.2,1.45,-.05);
paper.rotation.y=-.1; desk.add(paper);
const quill=mesh(new THREE.ConeGeometry(.045,.75,8),cream,.45,1.56,.12); quill.rotation.z=-1.05; desk.add(quill);
const lamp=new THREE.Group(); lamp.position.set(.65,1.48,-.07); desk.add(lamp);
lamp.add(cyl(.17,.23,.12,brass,0,0,0,16));
lamp.add(cyl(.055,.055,.36,brass,0,.22,0,12));
const lampGlass=mesh(new THREE.SphereGeometry(.19,16,12),new THREE.MeshStandardMaterial({color:0xffb04d,emissive:0xff7218,emissiveIntensity:2.5,transparent:true,opacity:.8,roughness:.25}),0,.47,0);
lampGlass.scale.y=1.25; lamp.add(lampGlass);
lamp.add(cyl(.24,.14,.16,brass,0,.75,0,16));

const fireLight = new THREE.PointLight(0xff711c, 100, 12, 2);
fireLight.position.set(-3.5,1.45,-6.1); fireLight.castShadow=true;
fireLight.shadow.mapSize.set(1024,1024); scene.add(fireLight);
const lampLight = new THREE.PointLight(0xffae56, 15, 5, 2);
lampLight.position.set(-5.1,2.18,3.55); scene.add(lampLight);
const windowLight = new THREE.PointLight(0x7899e8, 10, 7, 2);
windowLight.position.set(3.7,3.3,5.8); scene.add(windowLight);
const ambient = new THREE.HemisphereLight(0x536b9b,0x2b1309,1.18);
scene.add(ambient);

const dust=[];
for(let i=0;i<120;i++){
  const d=sphere(range(.008,.018),new THREE.MeshBasicMaterial({color:0xffd79a,transparent:true,opacity:range(.08,.3),depthWrite:false}),range(-6.5,6.5),range(.4,5.3),range(-5.9,6.5));
  d.userData={phase:rand()*6.28,base:d.position.clone(),speed:range(.2,.7)};
  scene.add(d); dust.push(d);
}

const axe = new THREE.Group();
axe.position.set(-6.25,.15,-4.9); axe.rotation.z=-.1; room.add(axe);
axe.add(cyl(.05,.07,1.32,cutWood,0,.65,0,10).rotateZ(-.13));
const axeHead=box(.42,.24,.13,iron,.1,1.18,0); axeHead.rotation.z=-.13; axe.add(axeHead);

const candles=[];
for(let i=0;i<3;i++){
  const c=cyl(.07,.08,.36+range(0,.16),cream,-4.62+i*.25,4.09,-6.62,12);
  room.add(c);
  const flame=mesh(new THREE.ConeGeometry(.045,.16,8),new THREE.MeshBasicMaterial({color:0xffbe55}),c.position.x,c.position.y+.28,c.position.z);
  flame.userData={phase:rand()*6.28}; room.add(flame); candles.push(flame);
}

const clockTime = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clockTime.getElapsedTime();
  fireLight.intensity=72+Math.sin(t*8)*16+Math.sin(t*17)*8;
  fireLight.color.setHSL(.055+Math.sin(t*3)*.008,.95,.55);
  lampLight.intensity=13+Math.sin(t*2.1)*1.4;
  flames.forEach((f,i)=>{
    if(f.geometry.type==='ConeGeometry'){
      f.scale.y=f.userData.scale*(.72+Math.sin(t*7+f.userData.phase)*.22);
      f.position.x=f.userData.base.x+Math.sin(t*3+f.userData.phase)*.024;
      f.position.y=f.userData.base.y+Math.sin(t*5+f.userData.phase)*.04;
    } else {
      f.material.emissiveIntensity=1.2+Math.sin(t*9+f.userData.phase)*.8;
    }
  });
  steam.forEach((p,i)=>{
    const u=(t*.35+p.userData.phase)%2.8;
    p.position.y=p.userData.startY+u*.22;
    p.position.x=.1+Math.sin(t*1.7+p.userData.phase)*(.06+u*.025);
    p.position.z=.05+Math.cos(t*1.25+p.userData.phase)*.045;
    p.material.opacity=Math.max(0,.26-u*.075);
    p.scale.setScalar(.65+u*.36);
  });
  windowGroup.children.forEach(o=>{
    if(o.userData.speed){
      o.position.y-=o.userData.speed*.012;
      o.position.x+=Math.sin(t*1.7+o.userData.baseX)*.004;
      if(o.position.y<-1.17){o.position.y=1.18;o.position.x=range(-1.45,1.45);}
    }
  });
  dust.forEach(d=>{
    d.position.x=d.userData.base.x+Math.sin(t*d.userData.speed+d.userData.phase)*.22;
    d.position.y=d.userData.base.y+Math.sin(t*.7+d.userData.phase)*.12;
  });
  candles.forEach(c=>{c.scale.y=.82+Math.sin(t*9+c.userData.phase)*.24;c.position.x+=Math.sin(t*5+c.userData.phase)*.006;});
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
