<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Hot Rod</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #d8d3c8;
}
canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9d5cc);
scene.fog = new THREE.Fog(0xd9d5cc, 22, 40);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(11, 7.8, 13);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 10;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.48;

const hemi = new THREE.HemisphereLight(0xf6f8ff, 0x665544, 2.1);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 4.2);
key.position.set(-6, 12, 9);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -11;
key.shadow.camera.right = 11;
key.shadow.camera.top = 10;
key.shadow.camera.bottom = -7;
key.shadow.camera.near = 1;
key.shadow.camera.far = 30;
key.shadow.bias = -0.0004;
scene.add(key);

const rim = new THREE.DirectionalLight(0xffb37b, 2.1);
rim.position.set(9, 6, -10);
scene.add(rim);

const fill = new THREE.PointLight(0x78a7ff, 18, 18, 2);
fill.position.set(-5, 4, 6);
scene.add(fill);

const makeMaterial = (color, roughness = 0.25, metalness = 0) =>
  new THREE.MeshStandardMaterial({ color, roughness, metalness });

const red = makeMaterial(0xc50e16, 0.2);
const brightRed = makeMaterial(0xef1723, 0.18);
const darkRed = makeMaterial(0x71070b, 0.27);
const black = makeMaterial(0x090a0c, 0.24);
const rubber = makeMaterial(0x070708, 0.68);
const darkRubber = makeMaterial(0x020203, 0.8);
const charcoal = makeMaterial(0x1a1c20, 0.35);
const chrome = makeMaterial(0xdbe4e8, 0.12, 0.92);
const steel = makeMaterial(0x858f98, 0.23, 0.75);
const yellow = makeMaterial(0xffc400, 0.22);
const orange = makeMaterial(0xff6200, 0.2);
const cream = makeMaterial(0xffe2a3, 0.24);
const white = makeMaterial(0xffffff, 0.16);
const blueGlass = new THREE.MeshPhysicalMaterial({
  color: 0x163b55,
  roughness: 0.12,
  metalness: 0.05,
  transmission: 0.25,
  transparent: true,
  opacity: 0.78
});
const lamp = new THREE.MeshStandardMaterial({
  color: 0xffe6a0,
  emissive: 0xffa51b,
  emissiveIntensity: 1.5,
  roughness: 0.18
});

const edgeMaterial = new THREE.LineBasicMaterial({
  color: 0x300204,
  transparent: true,
  opacity: 0.35
});

const car = new THREE.Group();
car.rotation.y = -0.08;
scene.add(car);

function addBox(parent, size, position, material, edges = true) {
  const geometry = new THREE.BoxGeometry(size[0], size[1], size[2]);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(position[0], position[1], position[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);

  if (edges) {
    const lines = new THREE.LineSegments(new THREE.EdgesGeometry(geometry, 28), edgeMaterial);
    lines.position.copy(mesh.position);
    parent.add(lines);
  }
  return mesh;
}

function addStud(parent, x, y, z, material, radius = 0.155, height = 0.105) {
  const stud = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, height, 20),
    material
  );
  stud.position.set(x, y + height * 0.5, z);
  stud.castShadow = true;
  stud.receiveShadow = true;
  parent.add(stud);
  return stud;
}

function studdedBrick(parent, size, position, material, countX, countZ, edges = true) {
  const part = addBox(parent, size, position, material, edges);
  const spacingX = countX > 1 ? (size[0] - 0.45) / (countX - 1) : 0;
  const spacingZ = countZ > 1 ? (size[2] - 0.45) / (countZ - 1) : 0;
  for (let ix = 0; ix < countX; ix++) {
    for (let iz = 0; iz < countZ; iz++) {
      addStud(
        parent,
        position[0] - spacingX * (countX - 1) * 0.5 + ix * spacingX,
        position[1] + size[1] * 0.5,
        position[2] - spacingZ * (countZ - 1) * 0.5 + iz * spacingZ,
        material
      );
    }
  }
  return part;
}

function addCylinder(parent, radius, depth, position, material, rotation, segments = 28) {
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, depth, segments),
    material
  );
  mesh.position.set(position[0], position[1], position[2]);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function makeWheel(x, y, z, radius, width) {
  const wheel = new THREE.Group();
  wheel.position.set(x, y, z);
  car.add(wheel);

  const tire = addCylinder(wheel, radius, width, [0, 0, 0], rubber, [Math.PI / 2, 0, 0], 40);

  const sidewallGeometry = new THREE.CylinderGeometry(radius * 0.83, radius * 0.83, 0.04, 40);
  for (const side of [-1, 1]) {
    const sidewall = new THREE.Mesh(sidewallGeometry, darkRubber);
    sidewall.rotation.x = Math.PI / 2;
    sidewall.position.z = side * (width * 0.5 + 0.012);
    sidewall.castShadow = true;
    wheel.add(sidewall);

    const hub = addCylinder(
      wheel,
      radius * 0.38,
      0.09,
      [0, 0, side * (width * 0.5 + 0.055)],
      chrome,
      [Math.PI / 2, 0, 0],
      28
    );
    const inset = addCylinder(
      wheel,
      radius * 0.2,
      0.105,
      [0, 0, side * (width * 0.5 + 0.105)],
      black,
      [Math.PI / 2, 0, 0],
      24
    );
    addCylinder(
      wheel,
      radius * 0.075,
      0.12,
      [0, 0, side * (width * 0.5 + 0.16)],
      chrome,
      [Math.PI / 2, 0, 0],
      20
    );
  }

  const ringGeometry = new THREE.TorusGeometry(radius * 0.9, radius * 0.045, 8, 40);
  for (const zRing of [-width * 0.39, width * 0.39]) {
    const ring = new THREE.Mesh(ringGeometry, darkRubber);
    ring.position.z = zRing;
    ring.castShadow = true;
    wheel.add(ring);
  }

  return tire;
}

const rearX = 2.35;
const frontX = -3.15;
const rearRadius = 1.47;
const frontRadius = 0.94;

makeWheel(rearX, rearRadius, 2.0, rearRadius, 1.02);
makeWheel(rearX, rearRadius, -2.0, rearRadius, 1.02);
makeWheel(frontX, frontRadius, 1.76, frontRadius, 0.68);
makeWheel(frontX, frontRadius, -1.76, frontRadius, 0.68);

addBox(car, [7.15, 0.34, 2.48], [-0.15, 1.05, 0], black);
addBox(car, [4.6, 0.25, 1.7], [-1.15, 0.72, 0], charcoal);
addBox(car, [0.28, 0.32, 3.45], [-3.15, 0.96, 0], steel);
addBox(car, [0.24, 0.25, 3.45], [2.35, 1.0, 0], steel);

studdedBrick(car, [2.1, 0.48, 2.8], [2.25, 2.23, 0], red, 4, 6);
studdedBrick(car, [1.1, 0.42, 2.65], [3.72, 1.72, 0], darkRed, 2, 6);
studdedBrick(car, [2.45, 0.54, 2.5], [0.58, 1.68, 0], brightRed, 5, 5);
studdedBrick(car, [2.0, 0.43, 2.08], [-1.55, 1.61, 0], red, 4, 4);
studdedBrick(car, [1.06, 0.4, 1.82], [-3.35, 1.43, 0], red, 2, 4);

addBox(car, [0.35, 1.03, 2.42], [3.55, 1.48, 0], darkRed);
addBox(car, [0.32, 0.25, 3.0], [3.82, 1.0, 0], black);

for (const side of [-1, 1]) {
  addBox(car, [3.95, 0.58, 0.35], [-0.55, 1.32, side * 1.31], red);
  studdedBrick(car, [1.25, 0.42, 0.34], [3.15, 2.56, side * 1.36], brightRed, 3, 1);
  studdedBrick(car, [1.25, 0.4, 0.34], [1.58, 2.7, side * 1.36], red, 3, 1);
}

const cab = new THREE.Group();
car.add(cab);
addBox(cab, [1.85, 1.28, 2.34], [1.55, 3.0, 0], red);
addBox(cab, [1.3, 0.87, 2.08], [1.38, 3.08, 0], black, false);
addBox(cab, [0.09, 0.74, 1.8], [0.73, 3.12, 0], blueGlass, false);
addBox(cab, [1.1, 0.69, 0.08], [1.42, 3.12, 1.06], blueGlass, false);
addBox(cab, [1.1, 0.69, 0.08], [1.42, 3.12, -1.06], blueGlass, false);
addBox(cab, [0.12, 0.7, 1.82], [2.16, 3.12, 0], black);
studdedBrick(cab, [2.0, 0.35, 2.5], [1.53, 3.78, 0], black, 4, 5);
studdedBrick(cab, [1.05, 0.23, 1.78], [2.82, 2.84, 0], red, 2, 4);

addBox(car, [0.17, 1.0, 2.17], [-4.0, 1.62, 0], chrome);
for (const z of [-0.72, 0, 0.72]) {
  addBox(car, [0.1, 0.12, 0.42], [-4.1, 1.35, z], black, false);
  addBox(car, [0.1, 0.12, 0.42], [-4.1, 1.67, z], black, false);
  addBox(car, [0.1, 0.12, 0.42], [-4.1, 1.99, z], black, false);
}

for (const side of [-1, 1]) {
  addCylinder(car, 0.32, 0.22, [-3.87, 2.12, side * 0.86], chrome, [0, 0, Math.PI / 2], 28);
  addCylinder(car, 0.23, 0.235, [-4.0, 2.12, side * 0.86], lamp, [0, 0, Math.PI / 2], 24);
}

addBox(car, [0.42, 0.22, 3.32], [-4.02, 0.82, 0], chrome);
addBox(car, [0.23, 0.35, 2.9], [-4.12, 0.76, 0], black);

const engine = new THREE.Group();
car.add(engine);
studdedBrick(engine, [1.35, 0.78, 1.48], [-1.15, 2.22, 0], charcoal, 3, 3);
addBox(engine, [1.08, 0.55, 1.72], [-1.16, 2.82, 0], chrome);
addBox(engine, [0.75, 0.5, 1.34], [-1.22, 3.32, 0], black);
addBox(engine, [0.88, 0.25, 1.15], [-1.44, 3.7, 0], chrome);
addBox(engine, [0.42, 0.34, 0.84], [-1.83, 3.7, 0], black);
addBox(engine, [0.16, 0.17, 0.56], [-2.08, 3.7, 0], chrome);

for (const x of [-1.58, -1.15, -0.72]) {
  for (const z of [-0.58, 0.58]) {
    addCylinder(engine, 0.14, 0.16, [x, 3.18, z], chrome, [0, 0, 0], 20);
    addStud(engine, x, 3.26, z, black, 0.1, 0.08);
  }
}

for (const side of [-1, 1]) {
  const exhaustZ = side * 1.53;
  addCylinder(car, 0.16, 2.8, [-0.25, 1.15, exhaustZ], chrome, [0, 0, Math.PI / 2], 20);
  addCylinder(car, 0.18, 0.7, [1.14, 1.38, exhaustZ], chrome, [0, 0, 0], 20);
  addCylinder(car, 0.21, 0.33, [1.14, 1.78, exhaustZ], chrome, [0, 0, 0], 20);

  for (const x of [-1.2, -0.35, 0.5]) {
    addBox(car, [0.22, 0.44, 0.24], [x, 1.18, side * 1.43], black);
    addStud(car, x, 1.4, side * 1.43, chrome, 0.1, 0.08);
  }

  for (let i = 0; i < 3; i++) {
    const pipeX = -1.73 + i * 0.42;
    const upper = addCylinder(car, 0.12, 0.72, [pipeX, 2.4, side * 1.18], chrome, [0, 0, 0], 16);
    upper.rotation.z = side * -0.18;
  }
}

function flameDot(x, y, side, radius, material) {
  const dot = addCylinder(
    car,
    radius,
    0.075,
    [x, y, side * 1.515],
    material,
    [Math.PI / 2, 0, 0],
    18
  );
  dot.scale.y = 0.72;
  return dot;
}

for (const side of [-1, 1]) {
  const flames = [
    [-2.7, 1.58, 0.27, yellow],
    [-2.25, 1.55, 0.31, yellow],
    [-1.8, 1.55, 0.29, orange],
    [-1.35, 1.53, 0.25, orange],
    [-0.96, 1.51, 0.2, orange],
    [-2.48, 1.87, 0.2, yellow],
    [-2.03, 1.88, 0.2, orange],
    [-1.62, 1.83, 0.17, orange],
    [-2.27, 2.12, 0.15, yellow],
    [-1.85, 2.08, 0.13, orange]
  ];
  for (const item of flames) flameDot(item[0], item[1], side, item[2], item[3]);

  const tips = [
    [-1.1, 1.78, 0.42, 0.11],
    [-1.48, 2.05, 0.38, 0.1],
    [-1.9, 2.28, 0.35, 0.09],
    [-2.42, 2.34, 0.31, 0.08]
  ];
  for (const tip of tips) {
    const flameTip = addBox(
      car,
      [tip[2], tip[3] * 1.8, 0.075],
      [tip[0], tip[1], side * 1.52],
      tip[0] < -1.8 ? yellow : orange,
      false
    );
    flameTip.rotation.z = -0.45;
  }
}

for (const side of [-1, 1]) {
  addBox(car, [0.42, 0.27, 0.12], [3.92, 1.62, side * 0.72], darkRed);
  addCylinder(car, 0.16, 0.09, [3.995, 1.64, side * 0.72], red, [0, 0, Math.PI / 2], 20);
}

addBox(car, [0.82, 0.18, 1.15], [3.97, 1.12, 0], cream);
addBox(car, [0.48, 0.12, 0.78], [4.07, 1.13, 0], black);

for (const z of [-0.47, 0.47]) {
  addCylinder(car, 0.17, 0.09, [4.08, 1.65, z], red, [0, 0, Math.PI / 2], 20);
}

const steeringColumn = addCylinder(car, 0.06, 0.62, [1.03, 2.82, 0], chrome, [0, 0, -0.55], 14);
steeringColumn.position.z = 0.48;
const steeringWheel = new THREE.Mesh(
  new THREE.TorusGeometry(0.28, 0.055, 10, 24),
  black
);
steeringWheel.position.set(0.86, 3.05, 0.49);
steeringWheel.rotation.y = Math.PI / 2;
steeringWheel.rotation.z = -0.55;
steeringWheel.castShadow = true;
car.add(steeringWheel);

addBox(car, [0.72, 0.55, 0.72], [1.66, 2.58, 0], darkRed);
addBox(car, [0.62, 0.48, 0.1], [1.82, 2.88, 0], black);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(14, 80),
  new THREE.MeshStandardMaterial({ color: 0xbcb6aa, roughness: 0.82, metalness: 0 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.035;
floor.receiveShadow = true;
scene.add(floor);

const ring = new THREE.Mesh(
  new THREE.RingGeometry(7.2, 7.3, 80),
  new THREE.MeshBasicMaterial({ color: 0xaaa397, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = -0.025;
scene.add(ring);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
