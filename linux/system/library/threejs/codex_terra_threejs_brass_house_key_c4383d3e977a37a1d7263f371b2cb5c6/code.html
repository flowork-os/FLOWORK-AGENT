<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Procedural Brass House Key</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15110d; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17120e);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(3.9, -5.3, 5.3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.45, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.52;
controls.minDistance = 4.2;
controls.maxDistance = 10;

const keyGroup = new THREE.Group();
keyGroup.rotation.x = -0.13;
keyGroup.rotation.z = -0.08;
scene.add(keyGroup);

const brass = new THREE.MeshPhysicalMaterial({
  color: 0xb9852e,
  metalness: 0.92,
  roughness: 0.29,
  clearcoat: 0.08,
  clearcoatRoughness: 0.38
});

const edgeBrass = new THREE.MeshStandardMaterial({
  color: 0x8d601c,
  metalness: 0.9,
  roughness: 0.42
});

const wornBrass = new THREE.MeshStandardMaterial({
  color: 0x694415,
  metalness: 0.82,
  roughness: 0.52
});

const shape = new THREE.Shape();
shape.moveTo(-0.52, 0.46);
shape.lineTo(3.42, 0.46);
shape.quadraticCurveTo(3.72, 0.43, 3.87, 0.22);
shape.lineTo(3.87, -0.08);
shape.quadraticCurveTo(3.80, -0.22, 3.58, -0.26);
shape.lineTo(3.34, -0.26);
shape.lineTo(3.11, -0.43);
shape.lineTo(2.72, -0.43);
shape.lineTo(2.56, -0.60);
shape.lineTo(2.10, -0.60);
shape.lineTo(1.95, -0.43);
shape.lineTo(1.52, -0.43);
shape.lineTo(1.35, -0.69);
shape.lineTo(0.95, -0.69);
shape.lineTo(0.82, -0.49);
shape.lineTo(0.36, -0.49);
shape.lineTo(0.19, -0.33);
shape.lineTo(-0.55, -0.33);
shape.lineTo(-0.63, -0.61);
shape.quadraticCurveTo(-0.85, -1.22, -1.51, -1.39);
shape.quadraticCurveTo(-2.39, -1.59, -2.98, -0.93);
shape.quadraticCurveTo(-3.58, -0.26, -3.27, 0.62);
shape.quadraticCurveTo(-2.98, 1.43, -2.15, 1.65);
shape.quadraticCurveTo(-1.28, 1.89, -0.74, 1.23);
shape.quadraticCurveTo(-0.52, 0.95, -0.52, 0.46);

const hole = new THREE.Path();
hole.absellipse(-1.93, 0.17, 0.335, 0.335, 0, Math.PI * 2, true);
shape.holes.push(hole);

const keyGeometry = new THREE.ExtrudeGeometry(shape, {
  depth: 0.18,
  bevelEnabled: true,
  bevelSegments: 3,
  bevelSize: 0.045,
  bevelThickness: 0.035,
  curveSegments: 32
});
keyGeometry.center();
const key = new THREE.Mesh(keyGeometry, brass);
key.castShadow = true;
key.receiveShadow = true;
keyGroup.add(key);

const ringWear = new THREE.Mesh(
  new THREE.TorusGeometry(0.348, 0.026, 10, 48),
  edgeBrass
);
ringWear.position.set(-1.93, 0.17, 0.126);
ringWear.castShadow = true;
keyGroup.add(ringWear);

function shallowMark(points, width, color) {
  const mark = new THREE.Shape();
  const half = width * 0.5;
  mark.moveTo(points[0][0], points[0][1] + half);
  for (let i = 1; i < points.length; i++) mark.lineTo(points[i][0], points[i][1] + half);
  for (let i = points.length - 1; i >= 0; i--) mark.lineTo(points[i][0], points[i][1] - half);
  mark.closePath();
  const geometry = new THREE.ExtrudeGeometry(mark, {
    depth: 0.008,
    bevelEnabled: true,
    bevelSize: 0.007,
    bevelThickness: 0.004,
    bevelSegments: 2
  });
  const mesh = new THREE.Mesh(geometry, color);
  mesh.position.z = 0.13;
  keyGroup.add(mesh);
}

shallowMark([[0.38, -0.18], [0.92, -0.18], [1.05, -0.25], [1.34, -0.25]], 0.038, wornBrass);
shallowMark([[1.58, -0.20], [1.93, -0.20], [2.06, -0.28], [2.42, -0.28]], 0.034, wornBrass);
shallowMark([[2.67, -0.14], [3.18, -0.14], [3.36, -0.08]], 0.028, wornBrass);

const scratchMaterial = new THREE.MeshStandardMaterial({
  color: 0xd5aa53,
  metalness: 0.86,
  roughness: 0.34
});

function scratch(x, y, length, angle) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(length, 0.012, 0.008), scratchMaterial);
  mesh.position.set(x, y, 0.142);
  mesh.rotation.z = angle;
  keyGroup.add(mesh);
}

scratch(-2.68, 0.64, 0.26, 0.38);
scratch(-2.47, 1.03, 0.16, -0.6);
scratch(-1.14, 1.14, 0.21, -0.3);
scratch(-2.62, -0.61, 0.18, -0.7);
scratch(0.02, 0.25, 0.36, -0.03);
scratch(2.87, 0.18, 0.42, 0.02);
scratch(3.28, 0.30, 0.16, 0.08);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0x241b14, roughness: 0.76, metalness: 0.03 })
);
floor.position.z = -0.34;
floor.receiveShadow = true;
scene.add(floor);

const hemi = new THREE.HemisphereLight(0xffe1a8, 0x1d1712, 1.4);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffd58a, 4.1);
keyLight.position.set(-3.5, -4.5, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -6;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xff9d44, 20, 10, 2);
fillLight.position.set(4, 2, 3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffefc8, 2.2);
rimLight.position.set(-2, 5, 4);
scene.add(rimLight);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
