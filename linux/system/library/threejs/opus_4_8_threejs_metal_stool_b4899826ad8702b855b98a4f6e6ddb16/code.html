<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Metal Workshop Stool</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d7d9dc; }
  #app { width: 100vw; height: 100vh; display: block; }
</style>

<!-- three.js + OrbitControls via importmap (jsDelivr CDN) -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="app"></canvas>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------------------
// Renderer
// ---------------------------------------------------------------------------
const canvas = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ---------------------------------------------------------------------------
// Scene & neutral studio background
// ---------------------------------------------------------------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd7d9dc);

// ---------------------------------------------------------------------------
// Camera
// ---------------------------------------------------------------------------
const camera = new THREE.PerspectiveCamera(
  40, window.innerWidth / window.innerHeight, 0.01, 100
);

// ---------------------------------------------------------------------------
// Lighting
// ---------------------------------------------------------------------------
// Sky/ground hemisphere fill
const hemi = new THREE.HemisphereLight(0xffffff, 0x6b6b70, 0.65);
scene.add(hemi);

// Directional key light (casts shadows)
const key = new THREE.DirectionalLight(0xfff4e6, 2.4);
key.position.set(1.2, 2.0, 1.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 8;
key.shadow.camera.left = -1.2;
key.shadow.camera.right = 1.2;
key.shadow.camera.top = 1.2;
key.shadow.camera.bottom = -1.2;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);

// Subtle cool fill from the opposite side
const fill = new THREE.DirectionalLight(0xbfd4ff, 0.5);
fill.position.set(-1.5, 1.0, -1.2);
scene.add(fill);

// ---------------------------------------------------------------------------
// Procedural textures (CanvasTexture)
// ---------------------------------------------------------------------------
// Brushed/scuffed metal roughness map: subtle streaks + speckle
function makeScuffedMetalRoughness() {
  const s = 512;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  // base mid roughness
  ctx.fillStyle = '#8a8a8a';
  ctx.fillRect(0, 0, s, s);
  // faint horizontal brush streaks
  for (let i = 0; i < 900; i++) {
    const y = Math.random() * s;
    const len = 40 + Math.random() * 220;
    const x = Math.random() * s;
    const v = 100 + Math.random() * 90;
    ctx.strokeStyle = `rgba(${v},${v},${v},0.14)`;
    ctx.lineWidth = 0.6 + Math.random() * 1.2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + len, y + (Math.random() - 0.5) * 3);
    ctx.stroke();
  }
  // scuff blotches (rougher patches)
  for (let i = 0; i < 90; i++) {
    const x = Math.random() * s, y = Math.random() * s;
    const r = 4 + Math.random() * 20;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(210,210,210,0.35)');
    g.addColorStop(1, 'rgba(210,210,210,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

// Worn rubber texture for the feet: dark with grey scuffs
function makeRubberTexture() {
  const s = 256;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1c1c1e';
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 600; i++) {
    const x = Math.random() * s, y = Math.random() * s;
    const v = 40 + Math.random() * 90;
    ctx.fillStyle = `rgba(${v},${v},${v},${0.06 + Math.random() * 0.18})`;
    ctx.fillRect(x, y, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
  // pale scuff smears (worn edges)
  for (let i = 0; i < 30; i++) {
    const x = Math.random() * s, y = Math.random() * s;
    const r = 6 + Math.random() * 18;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(150,150,150,0.30)');
    g.addColorStop(1, 'rgba(150,150,150,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}

const metalRough = makeScuffedMetalRoughness();
const rubberTex = makeRubberTexture();

// ---------------------------------------------------------------------------
// Materials
// ---------------------------------------------------------------------------
// Bare steel/chrome-ish metal for seat & frame (lightly scuffed)
const metalMat = new THREE.MeshStandardMaterial({
  color: 0xb9bcc0,
  metalness: 0.95,
  roughness: 0.42,
  roughnessMap: metalRough,
  envMapIntensity: 1.0
});

// Slightly darker steel for the leg tubes to add a little variation
const tubeMat = new THREE.MeshStandardMaterial({
  color: 0xa9adb2,
  metalness: 0.95,
  roughness: 0.5,
  roughnessMap: metalRough
});

// Weld/brace metal (a touch duller)
const braceMat = new THREE.MeshStandardMaterial({
  color: 0x9ea2a6,
  metalness: 0.9,
  roughness: 0.55,
  roughnessMap: metalRough
});

// Scuffed rubber for the feet
const rubberMat = new THREE.MeshStandardMaterial({
  color: 0x2a2a2c,
  metalness: 0.0,
  roughness: 0.85,
  map: rubberTex
});

// ---------------------------------------------------------------------------
// Helper: build a tubular segment (cylinder) between two 3D points
// ---------------------------------------------------------------------------
function tubeBetween(p1, p2, radius, material, name) {
  const dir = new THREE.Vector3().subVectors(p2, p1);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(radius, radius, len, 20, 1, false);
  const mesh = new THREE.Mesh(geo, material);
  mesh.name = name;
  // midpoint position
  mesh.position.copy(p1).addScaledVector(dir, 0.5);
  // orient cylinder (default +Y) along dir
  const up = new THREE.Vector3(0, 1, 0);
  mesh.quaternion.setFromUnitVectors(up, dir.clone().normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// ---------------------------------------------------------------------------
// Build the stool
// ---------------------------------------------------------------------------
const stool = new THREE.Group();
stool.name = 'MetalWorkshopStool';

// --- Dimensions (metres, real-world proportions) ---
const seatRadius     = 0.165;   // ~33 cm diameter seat
const seatThickness  = 0.024;
const seatTopY       = 0.500;   // seat height ~50 cm
const seatBottomY    = seatTopY - seatThickness;

const legTubeR       = 0.013;   // tubular leg radius
const legTopRadius   = 0.115;   // where legs meet under seat
const legBottomRadius= 0.235;   // splayed foot spread
const footTopY       = 0.028;   // top of rubber foot (leg ends here)

const braceY         = 0.185;   // welded ring brace height
const numLegs        = 4;

// --- Seat: round flat disc with a slightly rounded top edge ---
const seat = new THREE.Mesh(
  new THREE.CylinderGeometry(seatRadius, seatRadius * 0.985, seatThickness, 64),
  metalMat
);
seat.name = 'seat';
seat.position.y = seatBottomY + seatThickness / 2;
seat.castShadow = true;
seat.receiveShadow = true;
stool.add(seat);

// Thin rolled lip under the seat edge (stamped-metal look)
const seatLip = new THREE.Mesh(
  new THREE.TorusGeometry(seatRadius - 0.008, 0.008, 16, 64),
  metalMat
);
seatLip.name = 'seat_lip';
seatLip.rotation.x = Math.PI / 2;
seatLip.position.y = seatBottomY + 0.004;
seatLip.castShadow = true;
seatLip.receiveShadow = true;
stool.add(seatLip);

// Small central mounting boss under the seat where legs gather
const boss = new THREE.Mesh(
  new THREE.CylinderGeometry(legTopRadius + 0.02, legTopRadius + 0.03, 0.028, 32),
  braceMat
);
boss.name = 'mounting_boss';
boss.position.y = seatBottomY - 0.012;
boss.castShadow = true;
boss.receiveShadow = true;
stool.add(boss);

// --- Legs, ring brace nodes and feet ---
const legsGroup   = new THREE.Group(); legsGroup.name = 'legs';
const feetGroup   = new THREE.Group(); feetGroup.name = 'rubber_feet';

// radius of the leg centre-line at the brace height (linear interpolation)
const legTFrac = (braceY - footTopY) / (seatBottomY - 0.01 - footTopY);
const braceRadius = legBottomRadius + (legTopRadius - legBottomRadius) * legTFrac;

for (let i = 0; i < numLegs; i++) {
  const ang = (i / numLegs) * Math.PI * 2 + Math.PI / 4; // offset so legs read as a square
  const cos = Math.cos(ang), sin = Math.sin(ang);

  // top (just under the seat / boss) and bottom (top of the rubber foot)
  const top = new THREE.Vector3(
    legTopRadius * cos, seatBottomY - 0.01, legTopRadius * sin
  );
  const bottom = new THREE.Vector3(
    legBottomRadius * cos, footTopY, legBottomRadius * sin
  );

  const leg = tubeBetween(top, bottom, legTubeR, tubeMat, 'leg_' + i);
  legsGroup.add(leg);

  // Scuffed rubber foot at the bottom of each leg
  const dir = new THREE.Vector3().subVectors(bottom, top).normalize();

  const foot = new THREE.Mesh(
    new THREE.CylinderGeometry(legTubeR * 1.5, legTubeR * 1.75, footTopY, 24),
    rubberMat
  );
  foot.name = 'foot_' + i;
  // sit on the ground, centred under the leg bottom's x/z
  foot.position.set(bottom.x, footTopY / 2, bottom.z);
  foot.castShadow = true;
  foot.receiveShadow = true;
  feetGroup.add(foot);

  // little rounded rubber tip resting on the floor
  const tip = new THREE.Mesh(
    new THREE.CylinderGeometry(legTubeR * 1.75, legTubeR * 1.55, 0.006, 24),
    rubberMat
  );
  tip.name = 'foot_tip_' + i;
  tip.position.set(bottom.x, 0.003, bottom.z);
  tip.castShadow = true;
  tip.receiveShadow = true;
  feetGroup.add(tip);
}

stool.add(legsGroup);
stool.add(feetGroup);

// --- Welded ring brace connecting the four legs partway down ---
const ringBrace = new THREE.Mesh(
  new THREE.TorusGeometry(braceRadius, 0.009, 16, 80),
  braceMat
);
ringBrace.name = 'ring_brace';
ringBrace.rotation.x = Math.PI / 2;
ringBrace.position.y = braceY;
ringBrace.castShadow = true;
ringBrace.receiveShadow = true;
stool.add(ringBrace);

// Little weld beads where the ring meets each leg
for (let i = 0; i < numLegs; i++) {
  const ang = (i / numLegs) * Math.PI * 2 + Math.PI / 4;
  const weld = new THREE.Mesh(
    new THREE.SphereGeometry(legTubeR * 1.15, 16, 12),
    braceMat
  );
  weld.name = 'weld_' + i;
  weld.position.set(
    braceRadius * Math.cos(ang), braceY, braceRadius * Math.sin(ang)
  );
  weld.scale.set(1.0, 0.7, 1.0);
  weld.castShadow = true;
  stool.add(weld);
}

scene.add(stool);

// ---------------------------------------------------------------------------
// Ground plane (soft studio floor the stool rests on)
// ---------------------------------------------------------------------------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: 0xcfd1d4, roughness: 0.95, metalness: 0.0 })
);
ground.name = 'ground';
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// ---------------------------------------------------------------------------
// OrbitControls
// ---------------------------------------------------------------------------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 0.6;
controls.maxDistance = 4;
controls.maxPolarAngle = Math.PI * 0.5; // keep camera above the floor

// ---------------------------------------------------------------------------
// Auto-frame camera to the object's bounding box
// ---------------------------------------------------------------------------
function frameObject(object) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  const maxDim = Math.max(size.x, size.y, size.z);
  const fov = camera.fov * (Math.PI / 180);
  let dist = (maxDim / 2) / Math.tan(fov / 2);
  dist *= 1.7; // padding

  camera.position.set(center.x + dist * 0.75, center.y + dist * 0.55, center.z + dist);
  camera.near = dist / 100;
  camera.far = dist * 100;
  camera.updateProjectionMatrix();

  controls.target.copy(center);
  controls.update();
}
frameObject(stool);

// ---------------------------------------------------------------------------
// Resize handling
// ---------------------------------------------------------------------------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------------------
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
