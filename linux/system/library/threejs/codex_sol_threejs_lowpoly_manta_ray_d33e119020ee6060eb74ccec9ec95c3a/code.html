<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low-Poly Manta Ray</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 38%, #173451 0%, #091827 48%, #030911 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07131f);
scene.fog = new THREE.FogExp2(0x07131f, 0.025);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.2, 5.8, 10.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.05, -0.45);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 7;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.88;

scene.add(new THREE.HemisphereLight(0xa7d6f1, 0x07101d, 1.7));

const key = new THREE.DirectionalLight(0xd8e8ff, 4.1);
key.position.set(-5, 8, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -8;
key.shadow.bias = -0.0004;
scene.add(key);

const rim = new THREE.DirectionalLight(0x507cff, 3.0);
rim.position.set(7, 1, -7);
scene.add(rim);

const fill = new THREE.PointLight(0x75c8df, 16, 22, 2);
fill.position.set(-5, -4, 4);
scene.add(fill);

const manta = new THREE.Group();
manta.rotation.x = -0.06;
scene.add(manta);

const dorsalColors = [
  new THREE.Color(0x182b54),
  new THREE.Color(0x263d68),
  new THREE.Color(0x344d76),
  new THREE.Color(0x132442),
  new THREE.Color(0x405878)
];
const ventralColors = [
  new THREE.Color(0xd8d3bf),
  new THREE.Color(0xe8e1cc),
  new THREE.Color(0xc8c3b3),
  new THREE.Color(0xb8b8b0)
];
const sideColors = [
  new THREE.Color(0x172b48),
  new THREE.Color(0x263b58),
  new THREE.Color(0x101e35)
];

const top = {
  N: [0, 0.05, 3.18],
  H: [0, 0.39, 2.08],
  C: [0, 0.64, 0.55],
  R: [0, 0.19, -1.34],
  B: [0, 0.045, -1.88],
  A1: [0.76, 0.17, 2.56],
  E1: [2.38, 0.08, 1.79],
  T1: [5.0, -0.12, 0.10],
  P1: [3.28, -0.025, -0.78],
  Q1: [1.27, 0.07, -1.47],
  A0: [-0.76, 0.17, 2.56],
  E0: [-2.38, 0.08, 1.79],
  T0: [-5.0, -0.12, 0.10],
  P0: [-3.28, -0.025, -0.78],
  Q0: [-1.27, 0.07, -1.47]
};

const bottom = {
  N: [0, -0.10, 3.18],
  H: [0, -0.25, 2.08],
  C: [0, -0.39, 0.55],
  R: [0, -0.22, -1.34],
  B: [0, -0.055, -1.88],
  A1: [0.76, -0.12, 2.56],
  E1: [2.38, -0.105, 1.79],
  T1: [5.0, -0.15, 0.10],
  P1: [3.28, -0.12, -0.78],
  Q1: [1.27, -0.13, -1.47],
  A0: [-0.76, -0.12, 2.56],
  E0: [-2.38, -0.105, 1.79],
  T0: [-5.0, -0.15, 0.10],
  P0: [-3.28, -0.12, -0.78],
  Q0: [-1.27, -0.13, -1.47]
};

const positions = [];
const colors = [];
let faceIndex = 0;

function addTriangle(a, b, c, palette, index = faceIndex++) {
  const color = palette[index % palette.length];
  for (const p of [a, b, c]) {
    positions.push(p[0], p[1], p[2]);
    colors.push(color.r, color.g, color.b);
  }
}

function addSurface(v, palette, reverse = false) {
  const faces = [
    ['N', 'A1', 'H'], ['A1', 'E1', 'H'], ['E1', 'C', 'H'],
    ['E1', 'T1', 'C'], ['T1', 'P1', 'C'], ['P1', 'R', 'C'],
    ['P1', 'Q1', 'R'], ['Q1', 'B', 'R'],
    ['N', 'H', 'A0'], ['A0', 'H', 'E0'], ['E0', 'H', 'C'],
    ['E0', 'C', 'T0'], ['T0', 'C', 'P0'], ['P0', 'C', 'R'],
    ['P0', 'R', 'Q0'], ['Q0', 'R', 'B']
  ];
  for (const f of faces) {
    if (reverse) addTriangle(v[f[2]], v[f[1]], v[f[0]], palette);
    else addTriangle(v[f[0]], v[f[1]], v[f[2]], palette);
  }
}

addSurface(top, dorsalColors);
addSurface(bottom, ventralColors, true);

const perimeter = ['N', 'A1', 'E1', 'T1', 'P1', 'Q1', 'B', 'Q0', 'P0', 'T0', 'E0', 'A0'];
for (let i = 0; i < perimeter.length; i++) {
  const a = perimeter[i];
  const b = perimeter[(i + 1) % perimeter.length];
  addTriangle(top[a], bottom[a], bottom[b], sideColors);
  addTriangle(top[a], bottom[b], top[b], sideColors);
}

const bodyGeometry = new THREE.BufferGeometry();
bodyGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
bodyGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
bodyGeometry.computeVertexNormals();

const bodyMaterial = new THREE.MeshStandardMaterial({
  vertexColors: true,
  flatShading: true,
  roughness: 0.76,
  metalness: 0.03,
  side: THREE.DoubleSide
});

const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
body.castShadow = true;
body.receiveShadow = true;
manta.add(body);

function createFacetedWedge(sign) {
  const sx = sign;
  const vertices = [
    [sx * 0.38, 0.27, 2.33],
    [sx * 0.82, 0.18, 2.47],
    [sx * 0.82, -0.04, 2.47],
    [sx * 0.39, -0.05, 2.31],
    [sx * 0.53, 0.27, 3.22],
    [sx * 0.82, 0.17, 3.39],
    [sx * 0.82, 0.01, 3.39],
    [sx * 0.53, -0.04, 3.20]
  ];
  const faces = [
    [0,1,5],[0,5,4],
    [1,2,6],[1,6,5],
    [2,3,7],[2,7,6],
    [3,0,4],[3,4,7],
    [4,5,6],[4,6,7]
  ];
  const p = [];
  const c = [];
  faces.forEach((f, i) => {
    const color = dorsalColors[(i + (sign > 0 ? 1 : 3)) % dorsalColors.length];
    f.forEach(j => {
      p.push(...vertices[j]);
      c.push(color.r, color.g, color.b);
    });
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
  g.computeVertexNormals();
  const mesh = new THREE.Mesh(g, bodyMaterial);
  mesh.castShadow = true;
  return mesh;
}

manta.add(createFacetedWedge(-1), createFacetedWedge(1));

const mouthMaterial = new THREE.MeshStandardMaterial({
  color: 0x160f18,
  roughness: 0.95,
  flatShading: true
});
const lipMaterial = new THREE.MeshStandardMaterial({
  color: 0xc9c1ad,
  roughness: 0.8,
  flatShading: true
});

const mouth = new THREE.Mesh(new THREE.BoxGeometry(1.22, 0.22, 0.075), mouthMaterial);
mouth.position.set(0, -0.145, 3.205);
mouth.castShadow = true;
manta.add(mouth);

const upperLip = new THREE.Mesh(new THREE.BoxGeometry(1.38, 0.065, 0.105), lipMaterial);
upperLip.position.set(0, 0.005, 3.215);
upperLip.castShadow = true;
manta.add(upperLip);

const lowerLip = new THREE.Mesh(new THREE.BoxGeometry(1.32, 0.06, 0.10), lipMaterial);
lowerLip.position.set(0, -0.285, 3.19);
lowerLip.castShadow = true;
manta.add(lowerLip);

const eyeMaterial = new THREE.MeshStandardMaterial({
  color: 0x02050a,
  roughness: 0.26,
  metalness: 0.12
});
for (const sign of [-1, 1]) {
  const eye = new THREE.Mesh(new THREE.OctahedronGeometry(0.105, 0), eyeMaterial);
  eye.scale.set(1.0, 0.72, 1.25);
  eye.position.set(sign * 0.79, 0.225, 2.42);
  eye.rotation.z = sign * 0.18;
  eye.castShadow = true;
  manta.add(eye);
}

const gillMaterial = new THREE.MeshStandardMaterial({
  color: 0x554b48,
  roughness: 0.92,
  flatShading: true
});

for (const sign of [-1, 1]) {
  for (let i = 0; i < 4; i++) {
    const slash = new THREE.Mesh(new THREE.BoxGeometry(0.48 - i * 0.025, 0.018, 0.065), gillMaterial);
    slash.position.set(sign * (0.52 + i * 0.11), -0.405 + i * 0.012, 1.05 - i * 0.27);
    slash.rotation.y = sign * (0.26 + i * 0.025);
    slash.rotation.x = -0.035;
    manta.add(slash);
  }
}

function createTail() {
  const path = [
    [0, 0.00, -1.78, 0.085],
    [0.02, 0.01, -2.25, 0.066],
    [0.08, 0.015, -2.88, 0.049],
    [0.17, 0.01, -3.56, 0.034],
    [0.22, -0.01, -4.23, 0.023],
    [0.17, -0.025, -4.87, 0.014],
    [0.05, -0.035, -5.48, 0.007],
    [-0.10, -0.04, -6.03, 0.0025]
  ];
  const radial = 5;
  const p = [];
  const c = [];
  const indices = [];

  for (let i = 0; i < path.length; i++) {
    const [x, y, z, radius] = path[i];
    for (let j = 0; j < radial; j++) {
      const angle = j / radial * Math.PI * 2;
      p.push(x + Math.cos(angle) * radius, y + Math.sin(angle) * radius, z);
      const color = dorsalColors[(i + j) % 3];
      c.push(color.r, color.g, color.b);
    }
  }

  for (let i = 0; i < path.length - 1; i++) {
    for (let j = 0; j < radial; j++) {
      const next = (j + 1) % radial;
      const a = i * radial + j;
      const b = i * radial + next;
      const d = (i + 1) * radial + j;
      const e = (i + 1) * radial + next;
      indices.push(a, d, b, b, d, e);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
  g.setIndex(indices);
  g.computeVertexNormals();

  const material = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.78,
    flatShading: true,
    side: THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(g, material);
  mesh.castShadow = true;
  return mesh;
}

manta.add(createTail());

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  manta.position.y = Math.sin(t * 0.72) * 0.11;
  manta.rotation.z = Math.sin(t * 0.48) * 0.025;
  controls.update();
  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
