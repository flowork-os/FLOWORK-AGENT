<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Wooden Dining Chair</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #e8e2d8;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe8e2d8);
  scene.fog = new THREE.Fog(0xe8e2d8, 3.5, 8);

  const camera = new THREE.PerspectiveCamera(
    38,
    window.innerWidth / window.innerHeight,
    0.01,
    20
  );
  camera.position.set(1.28, 0.88, -1.48);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.47, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.65;
  controls.minDistance = 0.85;
  controls.maxDistance = 3.4;
  controls.minPolarAngle = Math.PI * 0.18;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.enablePan = false;

  function seededRandom(seed) {
    let state = seed >>> 0;
    return () => {
      state = (state * 1664525 + 1013904223) >>> 0;
      return state / 4294967296;
    };
  }

  function createWoodTexture(seed, lightness = 1) {
    const size = 512;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const context = canvas.getContext('2d');
    const image = context.createImageData(size, size);
    const random = seededRandom(seed);
    const offsets = Array.from({ length: 12 }, () => random() * Math.PI * 2);
    const knots = Array.from({ length: 5 }, () => ({
      x: random() * size,
      y: random() * size,
      radius: 18 + random() * 38,
      strength: 0.35 + random() * 0.55
    }));

    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        let grain =
          Math.sin(y * 0.105 + offsets[0]) * 0.38 +
          Math.sin(y * 0.038 + x * 0.004 + offsets[1]) * 0.31 +
          Math.sin(y * 0.245 + Math.sin(x * 0.018) * 2.2 + offsets[2]) * 0.16;

        for (const knot of knots) {
          const dx = x - knot.x;
          const dy = y - knot.y;
          const distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < knot.radius * 2.7) {
            const angle = Math.atan2(dy, dx);
            grain += Math.sin(distance * 0.34 + angle * 2.1) *
              Math.exp(-distance / knot.radius) * knot.strength;
          }
        }

        grain += (random() - 0.5) * 0.09;
        const variation = grain * 13;
        const index = (y * size + x) * 4;
        image.data[index] = THREE.MathUtils.clamp((133 + variation) * lightness, 0, 255);
        image.data[index + 1] = THREE.MathUtils.clamp((78 + variation * 0.68) * lightness, 0, 255);
        image.data[index + 2] = THREE.MathUtils.clamp((42 + variation * 0.42) * lightness, 0, 255);
        image.data[index + 3] = 255;
      }
    }

    context.putImageData(image, 0, 0);

    const texture = new THREE.CanvasTexture(canvas);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(1.6, 3.4);
    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return texture;
  }

  function createGrainBump(seed) {
    const size = 256;
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const context = canvas.getContext('2d');
    const image = context.createImageData(size, size);
    const random = seededRandom(seed);

    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const wave =
          Math.sin(y * 0.19 + Math.sin(x * 0.025) * 2.5) * 8 +
          Math.sin(y * 0.055 + x * 0.008) * 5 +
          (random() - 0.5) * 5;
        const value = THREE.MathUtils.clamp(128 + wave, 0, 255);
        const index = (y * size + x) * 4;
        image.data[index] = value;
        image.data[index + 1] = value;
        image.data[index + 2] = value;
        image.data[index + 3] = 255;
      }
    }

    context.putImageData(image, 0, 0);
    const texture = new THREE.CanvasTexture(canvas);
    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;
    texture.repeat.set(1.6, 3.4);
    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return texture;
  }

  const woodBump = createGrainBump(83);
  const woodMaterials = [
    new THREE.MeshPhysicalMaterial({
      map: createWoodTexture(18, 1.0),
      bumpMap: woodBump,
      bumpScale: 0.0015,
      roughness: 0.38,
      metalness: 0,
      clearcoat: 0.18,
      clearcoatRoughness: 0.55
    }),
    new THREE.MeshPhysicalMaterial({
      map: createWoodTexture(47, 0.94),
      bumpMap: woodBump,
      bumpScale: 0.0014,
      roughness: 0.42,
      metalness: 0,
      clearcoat: 0.14,
      clearcoatRoughness: 0.6
    }),
    new THREE.MeshPhysicalMaterial({
      map: createWoodTexture(121, 1.06),
      bumpMap: woodBump,
      bumpScale: 0.0013,
      roughness: 0.4,
      metalness: 0,
      clearcoat: 0.16,
      clearcoatRoughness: 0.58
    })
  ];

  const chair = new THREE.Group();
  chair.rotation.y = -0.08;
  scene.add(chair);

  function addPart(name, size, position, materialIndex = 0, radius = 0.008, rotation = null) {
    const safeRadius = Math.min(radius, size.x * 0.22, size.y * 0.22, size.z * 0.22);
    const geometry = new RoundedBoxGeometry(
      size.x,
      size.y,
      size.z,
      4,
      safeRadius
    );
    const mesh = new THREE.Mesh(geometry, woodMaterials[materialIndex]);
    mesh.name = name;
    mesh.position.copy(position);
    if (rotation) mesh.rotation.set(rotation.x, rotation.y, rotation.z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    chair.add(mesh);
    return mesh;
  }

  const seatTop = 0.46;
  const seatThickness = 0.045;
  const seatWidth = 0.49;
  const seatDepth = 0.455;

  addPart(
    'Seat',
    new THREE.Vector3(seatWidth, seatThickness, seatDepth),
    new THREE.Vector3(0, seatTop - seatThickness * 0.5, -0.012),
    2,
    0.014
  );

  const legWidth = 0.044;
  const frontZ = -0.185;
  const rearZ = 0.18;
  const legX = 0.202;

  addPart(
    'Front left leg',
    new THREE.Vector3(legWidth, 0.415, legWidth),
    new THREE.Vector3(-legX, 0.2075, frontZ),
    0,
    0.006
  );
  addPart(
    'Front right leg',
    new THREE.Vector3(legWidth, 0.415, legWidth),
    new THREE.Vector3(legX, 0.2075, frontZ),
    1,
    0.006
  );
  addPart(
    'Rear left post',
    new THREE.Vector3(0.047, 0.965, 0.047),
    new THREE.Vector3(-legX, 0.4825, rearZ),
    1,
    0.006
  );
  addPart(
    'Rear right post',
    new THREE.Vector3(0.047, 0.965, 0.047),
    new THREE.Vector3(legX, 0.4825, rearZ),
    0,
    0.006
  );

  const apronHeight = 0.072;
  const apronY = seatTop - seatThickness - apronHeight * 0.5 + 0.004;

  addPart(
    'Front apron',
    new THREE.Vector3(0.395, apronHeight, 0.026),
    new THREE.Vector3(0, apronY, -0.202),
    0,
    0.005
  );
  addPart(
    'Rear apron',
    new THREE.Vector3(0.395, apronHeight, 0.026),
    new THREE.Vector3(0, apronY, 0.188),
    1,
    0.005
  );
  addPart(
    'Left apron',
    new THREE.Vector3(0.027, apronHeight, 0.35),
    new THREE.Vector3(-0.212, apronY, -0.008),
    1,
    0.005
  );
  addPart(
    'Right apron',
    new THREE.Vector3(0.027, apronHeight, 0.35),
    new THREE.Vector3(0.212, apronY, -0.008),
    0,
    0.005
  );

  const stretcherThickness = 0.025;
  addPart(
    'Front stretcher',
    new THREE.Vector3(0.385, stretcherThickness, 0.028),
    new THREE.Vector3(0, 0.205, frontZ),
    2,
    0.006
  );
  addPart(
    'Rear stretcher',
    new THREE.Vector3(0.385, stretcherThickness, 0.028),
    new THREE.Vector3(0, 0.205, rearZ),
    1,
    0.006
  );
  addPart(
    'Left side stretcher',
    new THREE.Vector3(0.028, stretcherThickness, 0.34),
    new THREE.Vector3(-legX, 0.185, -0.002),
    0,
    0.006
  );
  addPart(
    'Right side stretcher',
    new THREE.Vector3(0.028, stretcherThickness, 0.34),
    new THREE.Vector3(legX, 0.185, -0.002),
    2,
    0.006
  );

  addPart(
    'Lower back rail',
    new THREE.Vector3(0.365, 0.058, 0.035),
    new THREE.Vector3(0, 0.605, rearZ),
    1,
    0.008
  );
  addPart(
    'Upper back rail',
    new THREE.Vector3(0.39, 0.065, 0.042),
    new THREE.Vector3(0, 0.905, rearZ),
    2,
    0.01
  );

  const slatPositions = [-0.135, -0.0675, 0, 0.0675, 0.135];
  for (let i = 0; i < slatPositions.length; i++) {
    addPart(
      `Back slat ${i + 1}`,
      new THREE.Vector3(0.031, 0.252, 0.024),
      new THREE.Vector3(slatPositions[i], 0.755, rearZ - 0.002),
      i % 3,
      0.007
    );
  }

  const floorMaterial = new THREE.MeshStandardMaterial({
    color: 0xc9c2b6,
    roughness: 0.82,
    metalness: 0
  });
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(4.5, 96),
    floorMaterial
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.004;
  floor.receiveShadow = true;
  scene.add(floor);

  const ambient = new THREE.HemisphereLight(0xfff8ec, 0x665e54, 1.55);
  scene.add(ambient);

  const keyLight = new THREE.DirectionalLight(0xfff2dd, 4.2);
  keyLight.position.set(-2.7, 4.2, -2.4);
  keyLight.target.position.set(0, 0.42, 0);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.left = -1.35;
  keyLight.shadow.camera.right = 1.35;
  keyLight.shadow.camera.top = 1.7;
  keyLight.shadow.camera.bottom = -0.65;
  keyLight.shadow.camera.near = 0.5;
  keyLight.shadow.camera.far = 8;
  keyLight.shadow.bias = -0.00015;
  keyLight.shadow.normalBias = 0.025;
  scene.add(keyLight, keyLight.target);

  const fillLight = new THREE.DirectionalLight(0xc9ddff, 1.15);
  fillLight.position.set(2.5, 1.7, 2.4);
  fillLight.target.position.set(0, 0.5, 0);
  scene.add(fillLight, fillLight.target);

  const rimLight = new THREE.PointLight(0xffd2a0, 1.8, 4, 2);
  rimLight.position.set(-1.6, 1.35, 1.4);
  scene.add(rimLight);

  function resize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  window.addEventListener('resize', resize);

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  animate();
</script>
</body>
</html>
