<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Origami Nine-Tail Fox</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#15161a; }
  canvas { display:block; }
  #hint {
    position:fixed; left:14px; bottom:12px;
    font:12px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:rgba(235,230,225,0.42); letter-spacing:0.06em; user-select:none; pointer-events:none;
  }
</style>
</head>
<body>
<div id="hint">ORIGAMI KITSUNE — drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15161a);
scene.fog = new THREE.Fog(0x15161a, 9, 26);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 200);
camera.position.set(3.05, 2.05, 4.35);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.62;
controls.target.set(0, 1.02, 0);
controls.minDistance = 2.2;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.495;
controls.update();

/* ============================================================
   WASHI PAPER TEXTURE (procedural canvas)
   fibrous, faintly mottled, with sparse long fibers
   ============================================================ */
function makeWashiTextures() {
  const S = 512;
  const cv = document.createElement('canvas');
  cv.width = cv.height = S;
  const ctx = cv.getContext('2d');

  // base
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, S, S);

  // low-frequency mottling via soft radial blobs
  for (let i = 0; i < 240; i++) {
    const x = Math.random() * S, y = Math.random() * S;
    const r = 12 + Math.random() * 70;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const v = Math.random() < 0.5 ? 0 : 255;
    const a = 0.020 + Math.random() * 0.030;
    g.addColorStop(0, `rgba(${v},${v},${v},${a})`);
    g.addColorStop(1, `rgba(${v},${v},${v},0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // fine grain speckle
  const img = ctx.getImageData(0, 0, S, S);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 16;
    d[i] = Math.min(255, Math.max(0, d[i] + n));
    d[i + 1] = Math.min(255, Math.max(0, d[i + 1] + n));
    d[i + 2] = Math.min(255, Math.max(0, d[i + 2] + n));
  }
  ctx.putImageData(img, 0, 0);

  // long washi fibers
  ctx.lineCap = 'round';
  for (let i = 0; i < 300; i++) {
    const x = Math.random() * S, y = Math.random() * S;
    const ang = Math.random() * Math.PI * 2;
    const len = 18 + Math.random() * 95;
    const bright = Math.random() < 0.55;
    ctx.strokeStyle = bright ? 'rgba(255,255,255,0.30)' : 'rgba(120,115,110,0.16)';
    ctx.lineWidth = 0.5 + Math.random() * 1.2;
    ctx.beginPath();
    ctx.moveTo(x, y);
    const midx = x + Math.cos(ang) * len * 0.5 + (Math.random() - 0.5) * 10;
    const midy = y + Math.sin(ang) * len * 0.5 + (Math.random() - 0.5) * 10;
    ctx.quadraticCurveTo(midx, midy, x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    ctx.stroke();
  }

  const map = new THREE.CanvasTexture(cv);
  map.wrapS = map.wrapT = THREE.RepeatWrapping;
  map.repeat.set(2.2, 2.2);
  map.colorSpace = THREE.SRGBColorSpace;
  map.anisotropy = renderer.capabilities.getMaxAnisotropy();

  // bump/roughness variant (grayscale, higher contrast fibers)
  const cv2 = document.createElement('canvas');
  cv2.width = cv2.height = S;
  const c2 = cv2.getContext('2d');
  c2.drawImage(cv, 0, 0);
  c2.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 420; i++) {
    const x = Math.random() * S, y = Math.random() * S;
    const ang = Math.random() * Math.PI * 2;
    const len = 14 + Math.random() * 70;
    c2.strokeStyle = Math.random() < 0.5 ? 'rgba(255,255,255,0.28)' : 'rgba(0,0,0,0.16)';
    c2.lineWidth = 0.6 + Math.random() * 1.0;
    c2.beginPath();
    c2.moveTo(x, y);
    c2.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    c2.stroke();
  }
  const bump = new THREE.CanvasTexture(cv2);
  bump.wrapS = bump.wrapT = THREE.RepeatWrapping;
  bump.repeat.set(2.2, 2.2);
  bump.anisotropy = map.anisotropy;

  return { map, bump };
}
const WASHI = makeWashiTextures();

/* ============================================================
   MATERIALS — paper: matte, flat-shaded, hard-edged
   ============================================================ */
function paperMat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(color),
    map: WASHI.map,
    bumpMap: WASHI.bump,
    bumpScale: opts.bumpScale !== undefined ? opts.bumpScale : 0.012,
    roughness: opts.roughness !== undefined ? opts.roughness : 0.93,
    metalness: 0.0,
    flatShading: true,
    side: THREE.DoubleSide,
    ...(opts.extra || {})
  });
}

const MAT = {
  vermilion: paperMat(0xd83f24, { roughness: 0.92 }),
  vermilionDeep: paperMat(0xb32f1a, { roughness: 0.94 }),
  white: paperMat(0xf4efe6, { roughness: 0.88 }),
  whiteWarm: paperMat(0xe9e0d2, { roughness: 0.9 }),
  ink: paperMat(0x241d1c, { roughness: 0.78, bumpScale: 0.006 })
};

// crease line material (thin dark/light lines drawn over folds)
const creaseValley = new THREE.LineBasicMaterial({ color: 0x7a2a16, transparent: true, opacity: 0.55 });
const creaseMountain = new THREE.LineBasicMaterial({ color: 0xffd9c6, transparent: true, opacity: 0.34 });

/* ============================================================
   GEOMETRY HELPERS
   Build faceted paper shells from explicit vertex lists.
   ============================================================ */

// Build a BufferGeometry from an array of triangles: [[ax,ay,az],[bx..],[cx..]]
function triGeom(tris) {
  const pos = [];
  for (const t of tris) {
    for (const v of t) pos.push(v[0], v[1], v[2]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.computeVertexNormals();
  // simple planar-ish UVs from world-ish position so washi texture shows
  const uv = [];
  const p = g.attributes.position.array;
  for (let i = 0; i < p.length; i += 3) {
    uv.push(p[i] * 0.55 + p[i + 2] * 0.22, p[i + 1] * 0.55 + p[i + 2] * 0.18);
  }
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  return g;
}

// quad -> 2 tris
function quad(a, b, c, d) { return [[a, b, c], [a, c, d]]; }

// Convert THREE.Vector3 -> array
const V = (x, y, z) => [x, y, z];

// Build a closed faceted "sheet solid" from a list of cross-sections
// sections: array of { pts: [[x,y,z],...] } — all same length, forms a tube-ish faceted body
function loftGeom(sections, capStart = true, capEnd = true) {
  const tris = [];
  const n = sections[0].length;
  for (let s = 0; s < sections.length - 1; s++) {
    const A = sections[s], B = sections[s + 1];
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n;
      tris.push([A[i], A[j], B[j]]);
      tris.push([A[i], B[j], B[i]]);
    }
  }
  if (capStart) {
    const A = sections[0];
    for (let i = 1; i < n - 1; i++) tris.push([A[0], A[i + 1], A[i]]);
  }
  if (capEnd) {
    const B = sections[sections.length - 1];
    for (let i = 1; i < n - 1; i++) tris.push([B[0], B[i], B[i + 1]]);
  }
  return triGeom(tris);
}

// crease polyline helper
function creaseLine(points, mat) {
  const g = new THREE.BufferGeometry().setFromPoints(points.map(p => new THREE.Vector3(p[0], p[1], p[2])));
  const l = new THREE.Line(g, mat);
  l.renderOrder = 2;
  return l;
}

function addMesh(parent, geom, mat) {
  const m = new THREE.Mesh(geom, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

/* ============================================================
   THE FOX
   Root group; everything centered on origin, feet at y=0.
   ============================================================ */
const fox = new THREE.Group();
scene.add(fox);

/* ---------- BODY ------------------------------------------------
   A folded ridged body: sharp dorsal ridge (mountain fold),
   flat flanks, a creased belly. Cross-sections along -z..+z.
   z: -0.62 (rear/hips) → +0.55 (chest/shoulders)
   -------------------------------------------------------------- */
function buildBody() {
  const g = new THREE.Group();

  // section maker: kite-shaped cross-section (ridge top, keel bottom)
  // params: z, yTop, yBot, halfW, yMid (widest point height), xOff
  function section(z, yBot, yMid, yTop, halfW, xOff = 0, keel = 0.0) {
    return [
      V(xOff, yTop, z),                    // 0 dorsal ridge (mountain)
      V(xOff + halfW, yMid + 0.045, z),    // 1 upper flank crease
      V(xOff + halfW * 0.92, yMid - 0.10, z), // 2 lower flank crease
      V(xOff + keel, yBot, z),             // 3 belly keel
      V(xOff - halfW * 0.92, yMid - 0.10, z),
      V(xOff - halfW, yMid + 0.045, z)
    ];
  }

  const sections = [
    section(-0.60, 0.86, 0.94, 1.04, 0.075),  // tail root / rump tip
    section(-0.46, 0.80, 0.96, 1.13, 0.150),  // rump
    section(-0.26, 0.74, 0.95, 1.16, 0.175),  // hips
    section(-0.04, 0.72, 0.94, 1.145, 0.168), // waist
    section( 0.20, 0.74, 0.96, 1.165, 0.180), // ribs
    section( 0.40, 0.78, 0.99, 1.175, 0.172), // chest
    section( 0.55, 0.86, 1.02, 1.13, 0.128),  // shoulders
    section( 0.64, 0.96, 1.05, 1.09, 0.070)   // neck base
  ];

  const bodyGeom = loftGeom(sections, true, true);
  addMesh(g, bodyGeom, MAT.vermilion);

  // WHITE UNDERSIDE — a separate creased belly panel where the sheet flips
  const bellyTris = [];
  for (let s = 0; s < sections.length - 1; s++) {
    const A = sections[s], B = sections[s + 1];
    // lift slightly below to avoid z-fighting
    const lift = -0.006;
    const a2 = [A[2][0], A[2][1] + lift, A[2][2]];
    const a3 = [A[3][0], A[3][1] + lift, A[3][2]];
    const a4 = [A[4][0], A[4][1] + lift, A[4][2]];
    const b2 = [B[2][0], B[2][1] + lift, B[2][2]];
    const b3 = [B[3][0], B[3][1] + lift, B[3][2]];
    const b4 = [B[4][0], B[4][1] + lift, B[4][2]];
    bellyTris.push([a2, b3, a3], [a2, b2, b3]);
    bellyTris.push([a3, b4, a4], [a3, b3, b4]);
  }
  addMesh(g, triGeom(bellyTris), MAT.white);

  // dorsal mountain crease line
  const ridge = sections.map(s => [s[0][0], s[0][1] + 0.004, s[0][2]]);
  g.add(creaseLine(ridge, creaseMountain));
  // flank valley creases both sides
  g.add(creaseLine(sections.map(s => [s[1][0] * 1.004 + 0.004, s[1][1], s[1][2]]), creaseValley));
  g.add(creaseLine(sections.map(s => [s[5][0] * 1.004 - 0.004, s[5][1], s[5][2]]), creaseValley));

  return g;
}
fox.add(buildBody());

/* ---------- HEAD ------------------------------------------------
   Classic origami fox head: a folded pyramid with a long pointed
   muzzle, white underjaw, mountain ridge down the nose bridge.
   -------------------------------------------------------------- */
function buildHead() {
  const g = new THREE.Group();
  g.position.set(0, 1.155, 0.63);
  g.rotation.x = -0.10;

  // ---- skull: faceted wedge, wide at back, narrowing to muzzle tip
  const back = 0.0, mid = 0.20, front = 0.40, tipZ = 0.58;

  const P = {
    // back plate (attaches at neck)
    bTop:  V(0,      0.155, back),
    bTopL: V(-0.115, 0.115, back),
    bTopR: V( 0.115, 0.115, back),
    bMidL: V(-0.150, -0.010, back),
    bMidR: V( 0.150, -0.010, back),
    bBot:  V(0,     -0.130, back),

    // widest cheek section
    mTop:  V(0,      0.170, mid),
    mTopL: V(-0.108, 0.120, mid),
    mTopR: V( 0.108, 0.120, mid),
    mMidL: V(-0.142, -0.005, mid),
    mMidR: V( 0.142, -0.005, mid),
    mBot:  V(0,     -0.128, mid),

    // muzzle base
    fTop:  V(0,      0.098, front),
    fTopL: V(-0.055, 0.070, front),
    fTopR: V( 0.055, 0.070, front),
    fMidL: V(-0.070, -0.020, front),
    fMidR: V( 0.070, -0.020, front),
    fBot:  V(0,     -0.078, front),

    // nose tip
    tip:   V(0, -0.028, tipZ)
  };

  const s1 = [P.bTop, P.bTopR, P.bMidR, P.bBot, P.bMidL, P.bTopL];
  const s2 = [P.mTop, P.mTopR, P.mMidR, P.mBot, P.mMidL, P.mTopL];
  const s3 = [P.fTop, P.fTopR, P.fMidR, P.fBot, P.fMidL, P.fTopL];

  const skull = loftGeom([s1, s2, s3], true, false);
  addMesh(g, skull, MAT.vermilion);

  // ---- muzzle cone to the tip (vermilion top, white bottom)
  const topTris = [
    [P.fTop, P.fTopR, P.tip],
    [P.fTopL, P.fTop, P.tip],
    [P.fTopR, P.fMidR, P.tip],
    [P.fMidL, P.fTopL, P.tip]
  ];
  addMesh(g, triGeom(topTris), MAT.vermilion);

  const botTris = [
    [P.fMidR, P.fBot, P.tip],
    [P.fBot, P.fMidL, P.tip]
  ];
  addMesh(g, triGeom(botTris), MAT.white);

  // ---- white underjaw / throat panel (sheet flip)
  const lift = 0.006;
  const dn = p => [p[0], p[1] - lift, p[2]];
  const jawTris = [
    ...quad(dn(P.bMidR), dn(P.bBot), dn(P.mBot), dn(P.mMidR)),
    ...quad(dn(P.bBot), dn(P.bMidL), dn(P.mMidL), dn(P.mBot)),
    ...quad(dn(P.mMidR), dn(P.mBot), dn(P.fBot), dn(P.fMidR)),
    ...quad(dn(P.mBot), dn(P.mMidL), dn(P.fMidL), dn(P.fBot))
  ];
  addMesh(g, triGeom(jawTris), MAT.white);

  // ---- white cheek flashes (folded-back flap corners)
  function cheek(sign) {
    const a = [sign * 0.146, 0.000, mid + 0.005];
    const b = [sign * 0.108, 0.118, mid + 0.005];
    const c = [sign * 0.062, 0.058, front - 0.03];
    const d = [sign * 0.074, -0.018, front - 0.02];
    const tris = sign > 0 ? quad(a, b, c, d) : quad(d, c, b, a);
    const m = addMesh(g, triGeom(tris), MAT.whiteWarm);
    m.position.x = sign * 0.004;
    return m;
  }
  cheek(1); cheek(-1);

  // ---- nose (small dark folded tip)
  const noseTris = [
    [[0, -0.028, tipZ], [-0.026, 0.012, tipZ - 0.052], [0.026, 0.012, tipZ - 0.052]],
    [[0, -0.028, tipZ], [0.026, 0.012, tipZ - 0.052], [0, -0.004, tipZ - 0.06]],
    [[0, -0.028, tipZ], [0, -0.004, tipZ - 0.06], [-0.026, 0.012, tipZ - 0.052]]
  ];
  const nose = addMesh(g, triGeom(noseTris), MAT.ink);
  nose.position.z = 0.004;

  // ---- eyes: small ink triangles pressed flat on the cheek planes
  function eye(sign) {
    const z0 = 0.30;
    const tri = [
      [sign * 0.108, 0.062, z0],
      [sign * 0.070, 0.038, z0 + 0.075],
      [sign * 0.112, 0.014, z0 + 0.005]
    ];
    const tris = sign > 0 ? [tri] : [[tri[0], tri[2], tri[1]]];
    const m = addMesh(g, triGeom(tris), MAT.ink);
    m.position.x = sign * 0.012;
    m.castShadow = false;
    return m;
  }
  eye(1); eye(-1);

  // ---- crease lines on the muzzle (mountain bridge + valley folds)
  g.add(creaseLine([
    [0, 0.176, mid], [0, 0.104, front], [0, -0.022, tipZ - 0.004]
  ], creaseMountain));
  g.add(creaseLine([
    [0.112, 0.124, mid], [0.058, 0.073, front], [0.004, -0.026, tipZ - 0.006]
  ], creaseValley));
  g.add(creaseLine([
    [-0.112, 0.124, mid], [-0.058, 0.073, front], [-0.004, -0.026, tipZ - 0.006]
  ], creaseValley));
  g.add(creaseLine([
    [0.146, -0.004, mid], [0.073, -0.022, front], [0.004, -0.030, tipZ - 0.006]
  ], creaseValley));
  g.add(creaseLine([
    [-0.146, -0.004, mid], [-0.073, -0.022, front], [-0.004, -0.030, tipZ - 0.006]
  ], creaseValley));

  // ---- EARS: tall triangular folds, vermilion outside / white inner cone
  function ear(sign) {
    const e = new THREE.Group();
    e.position.set(sign * 0.098, 0.135, 0.085);
    e.rotation.z = sign * 0.30;
    e.rotation.x = -0.16;
    e.rotation.y = sign * 0.24;

    const h = 0.30, w = 0.088, d = 0.052;
    const apex = V(0, h, 0.012);
    const bL = V(-w, 0, -0.014);
    const bR = V(w, 0, -0.010);
    const bF = V(0.004, -0.012, d);       // front spine point (mountain fold)
    const bB = V(0, 0.006, -d * 0.55);    // back point

    // outer shell (vermilion): front-left, front-right, back panels
    const outer = [
      [bL, bF, apex],
      [bF, bR, apex],
      [bR, bB, apex],
      [bB, bL, apex]
    ];
    addMesh(e, triGeom(outer), MAT.vermilion);

    // inner white triangle inserted in the ear pocket
    const iApex = V(0, h * 0.80, 0.016);
    const iL = V(-w * 0.58, 0.012, d * 0.28);
    const iR = V(w * 0.58, 0.012, d * 0.28);
    const iF = V(0.003, 0.0, d * 0.72);
    const inner = [
      [iL, iF, iApex],
      [iF, iR, iApex]
    ];
    addMesh(e, triGeom(inner), MAT.white);

    // crease along the ear spine
    e.add(creaseLine([[0.004, -0.010, d * 1.005], [0.002, h * 0.5, d * 0.5 + 0.008], [0, h - 0.002, 0.014]], creaseMountain));
    e.add(creaseLine([[-w * 0.99, 0.001, -0.012], [0, h * 0.98, 0.011]], creaseValley));
    e.add(creaseLine([[w * 0.99, 0.001, -0.010], [0, h * 0.98, 0.011]], creaseValley));

    return e;
  }
  g.add(ear(1));
  g.add(ear(-1));

  return g;
}
fox.add(buildHead());

/* ---------- NECK JOIN -------------------------------------------
   Small folded collar wedge tying neck base to head.
   -------------------------------------------------------------- */
function buildNeck() {
  const g = new THREE.Group();
  const a = [
    V(0, 1.09, 0.62), V(0.072, 1.05, 0.62), V(0.078, 0.955, 0.62),
    V(0, 0.935, 0.62), V(-0.078, 0.955, 0.62), V(-0.072, 1.05, 0.62)
  ];
  const b = [
    V(0, 1.30, 0.635), V(0.112, 1.265, 0.638), V(0.146, 1.140, 0.638),
    V(0, 1.028, 0.638), V(-0.146, 1.140, 0.638), V(-0.112, 1.265, 0.638)
  ];
  addMesh(g, loftGeom([a, b], false, false), MAT.vermilion);

  // white throat wedge
  const throat = [
    [V(0.078, 0.958, 0.622), V(0, 0.937, 0.622), V(0, 1.030, 0.646)],
    [V(0, 0.937, 0.622), V(-0.078, 0.958, 0.622), V(0, 1.030, 0.646)]
  ];
  addMesh(g, triGeom(throat), MAT.white);
  return g;
}
fox.add(buildNeck());

/* ---------- LEGS ------------------------------------------------
   Folded, tapered pleats — sharp knee crease, white paw tips.
   -------------------------------------------------------------- */
function buildLeg(x, z, opts) {
  const g = new THREE.Group();
  const { hipY, kneeY, footY, kneeZ, footZ, w0, w1, w2, front } = opts;

  function sec(y, zc, hw, hd) {
    return [
      V(-hw, y, zc - hd), V(hw, y, zc - hd), V(hw, y, zc + hd), V(-hw, y, zc + hd)
    ];
  }

  const s0 = sec(hipY, 0.0, w0, w0 * 1.15);
  const s1 = sec((hipY + kneeY) * 0.5, kneeZ * 0.45, w0 * 0.86, w0 * 1.0);
  const s2 = sec(kneeY, kneeZ, w1, w1 * 1.05);
  const s3 = sec(footY + 0.055, footZ, w2 * 1.05, w2 * 1.12);
  const s4 = sec(footY + 0.012, footZ + (front ? 0.012 : 0.006), w2 * 0.98, w2 * 1.25);

  addMesh(g, loftGeom([s0, s1, s2, s3], true, false), MAT.vermilion);
  addMesh(g, loftGeom([s3, s4], false, false), MAT.vermilionDeep);

  // white paw — a flat folded foot plate
  const py = footY + 0.014;
  const pz = footZ + (front ? 0.014 : 0.008);
  const pw = w2 * 1.12, pd = w2 * 1.5;
  const paw = [
    ...quad(V(-pw, py, pz - pd), V(pw, py, pz - pd), V(pw * 0.86, py, pz + pd), V(-pw * 0.86, py, pz + pd)),
    ...quad(V(-pw, footY, pz - pd * 0.92), V(-pw * 0.86, footY, pz + pd * 0.92), V(pw * 0.86, footY, pz + pd * 0.92), V(pw, footY, pz - pd * 0.92)),
    // sides
    ...quad(V(pw, py, pz - pd), V(pw, footY, pz - pd * 0.92), V(pw * 0.86, footY, pz + pd * 0.92), V(pw * 0.86, py, pz + pd)),
    ...quad(V(-pw * 0.86, py, pz + pd), V(-pw * 0.86, footY, pz + pd * 0.92), V(-pw, footY, pz - pd * 0.92), V(-pw, py, pz - pd)),
    ...quad(V(-pw * 0.86, py, pz + pd), V(pw * 0.86, py, pz + pd), V(pw * 0.86, footY, pz + pd * 0.92), V(-pw * 0.86, footY, pz + pd * 0.92))
  ];
  addMesh(g, triGeom(paw), MAT.white);

  // knee mountain crease
  g.add(creaseLine([
    [0, hipY - 0.02, kneeZ * 0.35 + (front ? 0.048 : -0.05)],
    [0, kneeY + 0.004, kneeZ + (front ? 0.052 : -0.055)],
    [0, footY + 0.09, footZ + (front ? 0.04 : -0.042)]
  ], creaseMountain));

  g.position.set(x, 0, z);
  return g;
}

// front legs (slightly forward, alert stance) and rear legs (folded haunch)
fox.add(buildLeg(0.135, 0.40, { hipY: 0.90, kneeY: 0.46, footY: 0.0, kneeZ: 0.045, footZ: 0.055, w0: 0.062, w1: 0.044, w2: 0.040, front: true }));
fox.add(buildLeg(-0.135, 0.40, { hipY: 0.90, kneeY: 0.46, footY: 0.0, kneeZ: 0.045, footZ: 0.055, w0: 0.062, w1: 0.044, w2: 0.040, front: true }));
fox.add(buildLeg(0.140, -0.34, { hipY: 0.90, kneeY: 0.44, footY: 0.0, kneeZ: -0.075, footZ: -0.02, w0: 0.076, w1: 0.050, w2: 0.043, front: false }));
fox.add(buildLeg(-0.140, -0.34, { hipY: 0.90, kneeY: 0.44, footY: 0.0, kneeZ: -0.075, footZ: -0.02, w0: 0.076, w1: 0.050, w2: 0.043, front: false }));

// haunch wedges (folded paper thigh plates over the rear legs)
function buildHaunch(sign) {
  const g = new THREE.Group();
  const x = sign * 0.155;
  const pts = [
    V(x, 1.06, -0.42), V(x, 1.02, -0.13), V(x, 0.80, -0.04),
    V(x, 0.56, -0.19), V(x, 0.60, -0.42), V(x, 0.82, -0.52)
  ];
  const inner = pts.map(p => V(sign * 0.055, p[1] * 0.995 + 0.004, p[2] * 0.92));
  const tris = [];
  for (let i = 0; i < pts.length; i++) {
    const j = (i + 1) % pts.length;
    if (sign > 0) tris.push([pts[i], pts[j], inner[j]], [pts[i], inner[j], inner[i]]);
    else tris.push([pts[j], pts[i], inner[j]], [inner[j], pts[i], inner[i]]);
  }
  addMesh(g, triGeom(tris), MAT.vermilion);
  g.add(creaseLine([pts[0], pts[3]].map(p => [p[0] + sign * 0.004, p[1], p[2]]), creaseValley));
  g.add(creaseLine([pts[5], pts[2]].map(p => [p[0] + sign * 0.004, p[1], p[2]]), creaseMountain));
  return g;
}
fox.add(buildHaunch(1));
fox.add(buildHaunch(-1));

/* ---------- NINE TAILS ------------------------------------------
   Each tail: a narrow tapered folded blade with a sharp dorsal
   ridge, curving upward and fanning outward. White tip.
   -------------------------------------------------------------- */
function buildTail(params) {
  const { len, curl, yaw, roll, baseW, tipW, seed } = params;
  const g = new THREE.Group();

  const STEPS = 13;
  const secsRed = [];
  const secsWhite = [];
  const ridgePts = [];
  const leftCrease = [];
  const rightCrease = [];

  // path: rises and arcs backward then up, with a slight S-curl
  for (let i = 0; i <= STEPS; i++) {
    const t = i / STEPS;
    // angle sweeps from ~ -20deg (pointing back) to steeply up
    const ang = THREE.MathUtils.lerp(-0.32, curl, Math.pow(t, 0.82));
    // arc-length integration for a smooth curve
    let x = 0, y = 0, z = 0;
    const SUB = 40;
    for (let k = 0; k < SUB * t * STEPS / STEPS + 0.0001; k++) {
      const tk = (k / SUB) * (1 / STEPS) * STEPS;
      if (tk > t) break;
    }
    // simpler explicit parametric path (stable, no NaN)
    const s = t;
    const bend = curl;
    z = -len * (0.62 * s - 0.30 * s * s * 1.1);
    y = len * (0.78 * s + 0.30 * s * s) * (0.55 + 0.45 * Math.cos(bend * 0.35));
    x = Math.sin(s * Math.PI * 0.62) * Math.sin(seed * 1.7) * len * 0.035;

    const w = THREE.MathUtils.lerp(baseW, tipW, Math.pow(s, 0.75));
    const d = w * 1.35 * (1.0 - 0.25 * s);

    // local frame: tangent approximated by finite difference
    const eps = 0.001;
    const s2 = Math.min(1, s + eps);
    const z2 = -len * (0.62 * s2 - 0.30 * s2 * s2 * 1.1);
    const y2 = len * (0.78 * s2 + 0.30 * s2 * s2) * (0.55 + 0.45 * Math.cos(bend * 0.35));
    const tan = new THREE.Vector3(0, y2 - y, z2 - z);
    if (tan.lengthSq() < 1e-12) tan.set(0, 1, 0);
    tan.normalize();
    const side = new THREE.Vector3(1, 0, 0);
    const up = new THREE.Vector3().crossVectors(side, tan).normalize(); // points "outward" from ribbon face

    const C = new THREE.Vector3(x, y, z);
    const mk = (a, b) => {
      const p = C.clone().addScaledVector(side, a).addScaledVector(up, b);
      return [p.x, p.y, p.z];
    };

    // faceted diamond cross-section: ridge (outer), two flanks, keel (inner)
    const sec = [
      mk(0, d * 0.85),        // 0 outer ridge (mountain)
      mk(w, d * 0.10),        // 1
      mk(w * 0.72, -d * 0.55),// 2
      mk(0, -d * 0.72),       // 3 inner keel
      mk(-w * 0.72, -d * 0.55),
      mk(-w, d * 0.10)
    ];
    if (s < 0.74) secsRed.push(sec);
    if (s >= 0.68) secsWhite.push(sec);
    if (Math.abs(s - 0.74) < 0.0001) secsRed.push(sec);

    ridgePts.push(mk(0, d * 0.88));
    leftCrease.push(mk(-w * 1.01, d * 0.10));
    rightCrease.push(mk(w * 1.01, d * 0.10));
  }

  // ensure the red and white segments overlap exactly at the seam
  if (secsRed.length >= 2) addMesh(g, loftGeom(secsRed, true, false), MAT.vermilion);
  if (secsWhite.length >= 2) {
    // taper the very last section to a true point for a crisp folded tip
    const last = secsWhite[secsWhite.length - 1];
    const cx = last.reduce((a, p) => a + p[0], 0) / last.length;
    const cy = last.reduce((a, p) => a + p[1], 0) / last.length;
    const cz = last.reduce((a, p) => a + p[2], 0) / last.length;
    const tipSec = last.map(p => [
      cx + (p[0] - cx) * 0.06,
      cy + (p[1] - cy) * 0.06 + 0.035 * (len * 0.10),
      cz + (p[2] - cz) * 0.06
    ]);
    secsWhite.push(tipSec);
    addMesh(g, loftGeom(secsWhite, false, true), MAT.white);
  }

  // crease lines
  g.add(creaseLine(ridgePts, creaseMountain));
  g.add(creaseLine(leftCrease, creaseValley));
  g.add(creaseLine(rightCrease, creaseValley));

  g.rotation.y = yaw;
  g.rotation.z = roll;
  return g;
}

const tails = new THREE.Group();
tails.position.set(0, 0.98, -0.56);
fox.add(tails);

const TAIL_COUNT = 9;
for (let i = 0; i < TAIL_COUNT; i++) {
  const t = (i / (TAIL_COUNT - 1)) * 2 - 1;      // -1 .. 1
  const a = Math.abs(t);
  const len = 1.62 - a * 0.20;                   // center tails longest
  const curl = 0.55 + a * 0.55;
  const yaw = -t * 0.62;                         // fan sideways
  const roll = t * 0.50;                         // splay outward
  const tail = buildTail({
    len, curl, yaw, roll,
    baseW: 0.062 - a * 0.008,
    tipW: 0.020,
    seed: i + 1
  });
  tail.position.set(t * 0.045, -a * 0.045, a * 0.03);
  tails.add(tail);
}

// tail-root collar: a folded fan wrapping where all nine sheets meet
(function tailRoot() {
  const g = new THREE.Group();
  const N = 12, R = 0.135;
  const front = [], back = [];
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    const r = R * (0.82 + 0.18 * Math.cos(a * 3));
    front.push(V(Math.cos(a) * r, 0.98 + Math.sin(a) * r * 0.95, -0.50));
    back.push(V(Math.cos(a) * r * 0.72, 0.98 + Math.sin(a) * r * 0.68, -0.66));
  }
  addMesh(g, loftGeom([front, back], false, true), MAT.vermilionDeep);
  fox.add(g);
})();

/* ---------- WHISKER-LIKE CREASE ACCENTS ON BACK ------------------ */
(function backPleats() {
  const g = new THREE.Group();
  for (let i = 0; i < 4; i++) {
    const z = -0.34 + i * 0.26;
    const yTop = 1.155 - Math.abs(i - 1.4) * 0.012;
    g.add(creaseLine([
      [-0.16, yTop - 0.20, z + 0.02],
      [0, yTop + 0.006, z],
      [0.16, yTop - 0.20, z + 0.02]
    ], creaseValley));
  }
  fox.add(g);
})();

/* ---------- SETTLE THE FOX --------------------------------------
   Center it on the origin horizontally, keep feet at y=0.
   -------------------------------------------------------------- */
fox.position.set(0, 0.0, -0.06);
fox.scale.setScalar(1.0);

/* ============================================================
   GROUND (shadow-only)
   ============================================================ */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.46 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

// faint darkened disc so the fox reads as sitting on a surface
const disc = new THREE.Mesh(
  new THREE.CircleGeometry(4.6, 96),
  new THREE.MeshStandardMaterial({ color: 0x1c1d22, roughness: 1.0, metalness: 0.0 })
);
disc.rotation.x = -Math.PI / 2;
disc.position.y = -0.002;
disc.receiveShadow = true;
scene.add(disc);

/* ============================================================
   LIGHTING — key + fill + rim, hard-edged paper shadows
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xbfd3e8, 0x241f1c, 0.42);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e2, 2.9);
key.position.set(3.4, 5.2, 3.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 22;
key.shadow.camera.left = -3.2;
key.shadow.camera.right = 3.2;
key.shadow.camera.top = 3.6;
key.shadow.camera.bottom = -1.0;
key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.018;
key.shadow.radius = 2.0;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fb6d8, 0.62);
fill.position.set(-4.0, 2.0, 2.2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd7bb, 1.35);
rim.position.set(-2.0, 3.0, -4.6);
scene.add(rim);

const bounce = new THREE.PointLight(0xff9c74, 0.35, 8, 2.0);
bounce.position.set(0, 0.22, 0.55);
scene.add(bounce);

/* ============================================================
   RESIZE + LOOP
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
