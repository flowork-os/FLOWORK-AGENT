<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artist's Loft Studio</title>
<style>
html,body{margin:0;overflow:hidden;background:#b9d1d4}
canvas{display:block}
#label{position:fixed;left:24px;top:20px;color:#fff;font:600 13px/1.4 system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 2px 8px #263536;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">Artist's Loft · Morning Light</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const seed=17329;
let state=seed;
function rnd(){state=(state*1664525+1013904223)>>>0;return state/4294967296}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function mat(color,rough=.75,metal=0,emissive=0){
  return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,emissive:emissive?color:0,emissiveIntensity:emissive});
}
function box(name,x,y,z,w,h,d,material,rotY=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  m.name=name;m.position.set(x,y,z);m.rotation.y=rotY;m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function cyl(name,x,y,z,r,h,material,rot={x:0,y:0,z:0},seg=20){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),material);
  m.name=name;m.position.set(x,y,z);m.rotation.set(rot.x,rot.y,rot.z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function sphere(name,x,y,z,r,material,scale={x:1,y:1,z:1}){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,16),material);
  m.name=name;m.position.set(x,y,z);m.scale.set(scale.x,scale.y,scale.z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function tubeBetween(a,b,r,material){
  const dir=new THREE.Vector3().subVectors(b,a),len=dir.length();
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,12),material);
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
  m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
}
function canvasTexture(){
  const c=document.createElement('canvas');c.width=700;c.height=500;
  const g=c.getContext('2d');
  g.fillStyle='#e1b984';g.fillRect(0,0,c.width,c.height);
  for(let i=0;i<12000;i++){
    const x=rnd()*700,y=rnd()*500;
    g.fillStyle=`rgba(${80+rnd()*100},${45+rnd()*80},${20+rnd()*70},${.025+rnd()*.05})`;
    g.fillRect(x,y,1+rnd()*3,1+rnd()*2);
  }
  const strokes=[
    ['#314956',70,350,280,80,34],['#6f9b91',180,280,270,80,25],
    ['#c85e3f',390,140,210,170,45],['#e4a44f',420,230,170,35,28],
    ['#263b51',475,330,160,40,35],['#e4d0a0',310,180,100,110,22],
    ['#8b4a54',85,150,150,40,25],['#f0c278',550,105,85,130,20]
  ];
  strokes.forEach(s=>{
    g.save();g.strokeStyle=s[0];g.lineWidth=s[5];g.lineCap='round';
    g.beginPath();g.moveTo(s[1],s[2]);g.bezierCurveTo(s[1]+s[3]*.3,s[2]-s[4],s[1]+s[3]*.7,s[2]+s[4],s[1]+s[3],s[2]-s[4]*.25);g.stroke();g.restore();
  });
  g.fillStyle='rgba(250,218,157,.72)';g.beginPath();g.arc(330,250,54,0,Math.PI*2);g.fill();
  g.fillStyle='#475b58';g.beginPath();g.ellipse(330,345,55,23,0,0,Math.PI*2);g.fill();
  return new THREE.CanvasTexture(c);
}
function brickTexture(){
  const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d');
  g.fillStyle='#9b6452';g.fillRect(0,0,512,256);
  for(let y=0;y<256;y+=32)for(let x=-32;x<544;x+=64){
    const xx=x+(y/32%2)*32;
    g.fillStyle=`hsl(${15+rnd()*12},${25+rnd()*18}%,${38+rnd()*17}%)`;
    g.fillRect(xx+2,y+2,60,28);
  }
  g.strokeStyle='rgba(55,39,35,.28)';g.lineWidth=3;
  for(let y=0;y<256;y+=32){g.beginPath();g.moveTo(0,y);g.lineTo(512,y);g.stroke()}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,3);return t;
}
function floorTexture(){
  const c=document.createElement('canvas');c.width=512;c.height=512;const g=c.getContext('2d');
  g.fillStyle='#c3a37d';g.fillRect(0,0,512,512);
  for(let i=0;i<2500;i++){g.fillStyle=`rgba(55,42,33,${rnd()*.09})`;g.fillRect(rnd()*512,rnd()*512,1+rnd()*14,1+rnd()*3)}
  for(let i=0;i<180;i++){g.fillStyle=`hsla(${rnd()*45},55%,${25+rnd()*30}%,${.12+rnd()*.3})`;g.beginPath();g.arc(rnd()*512,rnd()*512,1+rnd()*9,0,Math.PI*2);g.fill()}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(5,5);return t;
}
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xb8d1d2);
scene.fog=new THREE.Fog(0xb8d1d2,18,34);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);
camera.position.set(11,7.7,13);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.055;controls.autoRotate=true;controls.autoRotateSpeed=.28;
controls.target.set(0,3.1,0);controls.minDistance=8;controls.maxDistance=22;controls.maxPolarAngle=1.48;

const wood=mat(0x684c38,.72), darkWood=mat(0x392f2a,.65), metal=mat(0x35424a,.36,.72);
const plaster=mat(0xd6c7ac), blue=mat(0x75999a), clothMat=mat(0xc9ad8a);
const clay=mat(0xa7684e,.9), green=mat(0x6f8571), brass=mat(0xb28a4b,.3,.65);
const canvasMat=new THREE.MeshStandardMaterial({map:canvasTexture(),roughness:.95});
const brickMat=new THREE.MeshStandardMaterial({map:brickTexture(),roughness:.95});
const floorMat=new THREE.MeshStandardMaterial({map:floorTexture(),roughness:1});

box('Floor',0,-.18,0,24,.35,19,floorMat);
box('Brick Backdrop',0,5.2,-6.2,24,11,.35,brickMat);
box('Left Wall',-11,5.2,0,.35,11,13,plaster);
box('Right Wall',11,5.2,0,.35,11,13,plaster);
box('Ceiling Beam',0,10.3,-1,23,.38,.55,darkWood);
for(let x=-9;x<=9;x+=3)box('Ceiling Joist',x,10.1,-1, .22,.3,13,darkWood);

const windowGlow=mat(0xeff4df,.2,0,.5);
function windowUnit(x,z,w,h){
  box('Window frame',x,5.7,z,w+.32,h+.32,.3,darkWood);
  box('Window light',x,5.7,z-.18,w,h, .04,windowGlow);
  box('Mullion V',x,5.7,z-.27,.1,h,.08,darkWood);
  box('Mullion H',x,5.7,z-.28,w,.1,.08,darkWood);
  box('Window sill',x,3.34,z-.34,w+.7,.2,.55,wood);
}
windowUnit(-6.7,-5.95,3.4,5.9);windowUnit(-2.7,-5.95,3.4,5.9);
windowUnit(1.5,-5.95,3.4,5.9);
box('Skylight opening',6.5,9.0,-1,5,.12,4,windowGlow);
for(let x=4.5;x<=8.5;x+=1)box('Skylight rib',x,9.12,-1,.09,.12,4,metal);
for(let z=-2.5;z<=.5;z+=1)box('Skylight rib',6.5,9.12,z,5,.12,.09,metal);

const sun=new THREE.DirectionalLight(0xffdfaa,4.2);sun.position.set(-7,12,7);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-14;sun.shadow.camera.right=14;sun.shadow.camera.top=14;sun.shadow.camera.bottom=-8;sun.shadow.bias=-.0002;scene.add(sun);
scene.add(new THREE.HemisphereLight(0xe8f4ef,0x7b5d4b,1.6));
const warm=new THREE.PointLight(0xffb761,2.2,10,2);warm.position.set(1,5.5,1.5);warm.castShadow=true;scene.add(warm);
const fill=new THREE.PointLight(0x9bcbd0,1.4,12,2);fill.position.set(-7,6,1);scene.add(fill);

const rug=box('Painted rug',-1,.04,1.1,8.5,.06,5.1,mat(0x8a8170,.95));
rug.rotation.y=-.07;
for(let i=0;i<24;i++){
  const p=box('Rug paint mark',-4.7+rnd()*7.4,.09-.001*i,.0+rnd()*3.1,.08+rnd()*.5,.015,.04+rnd()*.22,
    mat([0xb44b3d,0x3b6570,0xd6a43f,0x694d56][i%4],1));
  p.rotation.y=rnd()*Math.PI;
}
for(let i=0;i<35;i++){
  const s=.025+rnd()*.11;
  const p=sphere('Floor paint splatter',-7+rnd()*13,.07, -4.9+rnd()*7.5,s,mat([0xc34f38,0x376b72,0xdfa73b,0x76505b][i%4],.9));
  p.scale.y=.18;
}

const easel=new THREE.Group();easel.name='Large easel';scene.add(easel);easel.position.set(-1.1,0,1.0);
function easelPart(a,b,r=.11){const p=tubeBetween(a,b,r,wood);easel.attach(p)}
easelPart(new THREE.Vector3(-1.8,.2,0),new THREE.Vector3(-.75,5.4,0));
easelPart(new THREE.Vector3(1.0,.2,0),new THREE.Vector3(-.75,5.4,0));
easelPart(new THREE.Vector3(-.75,.2,-.25),new THREE.Vector3(-.75,5.4,0));
box('Canvas ledge',-1.1,3.0,1.02,3.55,.18,.35,wood);
const painting=new THREE.Mesh(new THREE.BoxGeometry(3.25,3.85,.16),canvasMat);
painting.position.set(-1.1,5.05,1.0);painting.rotation.z=-.015;painting.castShadow=true;painting.receiveShadow=true;scene.add(painting);
box('Canvas top stretcher',-1.1,6.98,1.02,3.32,.13,.2,wood);
box('Canvas bottom stretcher',-1.1,3.12,1.02,3.32,.13,.2,wood);
box('Canvas left stretcher',-2.72,5.05,1.02,.13,3.9,.2,wood);
box('Canvas right stretcher',.52,5.05,1.02,.13,3.9,.2,wood);
const palette=new THREE.Mesh(new THREE.SphereGeometry(.58,20,10),mat(0xd9b080,.95));
palette.scale.set(1.45,.18,.8);palette.position.set(-3.2,2.45,1.3);palette.rotation.set(-.2,.3,-.1);palette.castShadow=true;scene.add(palette);
[0xc54e39,0x426d77,0xe3ac42,0x6e4b52,0xd9c274].forEach((c,i)=>sphere('Palette daub',-3.55+i*.22,2.57,1.35,.12,mat(c,.7)));

const cart=new THREE.Group();cart.name='Rolling brush cart';cart.position.set(4.3,0,1.7);scene.add(cart);
function cartBox(x,y,z,w,h,d,m){const q=box('Cart shelf',x,y,z,w,h,d,m);cart.attach(q)}
function cartCyl(x,y,z,r,h,m,rot){const q=cyl('Cart detail',x,y,z,r,h,m,rot);cart.attach(q)}
cartBox(0,1.0,0,2.2,.16,1.35,metal);cartBox(0,2.2,0,2.2,.16,1.35,metal);cartBox(0,3.45,0,2.2,.16,1.35,metal);
[[-.9,.9],[.9,.9],[-.9,-.9],[.9,-.9]].forEach(([x,z])=>{const q=cyl('Cart upright',x,2.25,z,.07,3.2,metal);cart.attach(q)});
[[-.72,.9],[.72,.9],[-.72,-.9],[.72,-.9]].forEach(([x,z])=>{const q=cyl('Caster',x,.48,z,.2,.14,metal,{x:Math.PI/2,y:0,z:0});cart.attach(q)});
for(let i=0;i<12;i++){
  const x=-.82+(i%6)*.33,z=-.35+(i%2)*.42;
  const q=cyl('Paint tube',x,2.43,z,.1,.7,mat([0xc74e3b,0x3c7180,0xd6a13d,0x6b5064][i%4]),{x:0,z:(rnd()-.5)*.25});
  cart.attach(q);const cap=cyl('Tube cap',x,2.8,z,.105,.08,metal);cart.attach(cap);
}
for(let i=0;i<15;i++){
  const x=-.75+(i%8)*.22,z=.12+(i%3)*.17;
  const q=cyl('Brush',x,3.95,z,.025,1.4,wood,{x:(rnd()-.5)*.22,z:(rnd()-.5)*.16},8);cart.attach(q);
  const tip=cyl('Brush bristles',x,4.68,z,.055,.3,mat([0x8b5a3f,0x4c6c73,0xb88655][i%3]),{x:(rnd()-.5)*.22,z:(rnd()-.5)*.16},8);cart.attach(tip);
}

const stackX=7.7,stackZ=-5.58;
for(let i=0;i<5;i++){
  const q=box('Stacked canvas',stackX,0.55+i*.48,stackZ,3.1,.36,.25,wood,-.08);
  q.rotation.z=(rnd()-.5)*.04;
  box('Canvas face',stackX,0.75+i*.48,stackZ-.14,2.65,.27,.025,mat([0xd4b88b,0xbfa275,0xe0c79d][i%3],.95),-.08);
}

const standX=7.0,standZ=-.6;
cyl('Sculpture pedestal',standX,1.65,standZ,.92,3.2,mat(0xead8bd,.7));
cyl('Pedestal cap',standX,3.3,standZ,1.03,.16,wood);
const bust=new THREE.Group();bust.name='Clay bust';bust.position.set(standX,4.0,standZ);scene.add(bust);
const torso=new THREE.Mesh(new THREE.SphereGeometry(.7,24,18),clay);torso.scale.set(1.05,1.15,.68);torso.castShadow=true;bust.add(torso);
const neck=new THREE.Mesh(new THREE.CylinderGeometry(.32,.43,.7,20),clay);neck.position.y=.7;neck.castShadow=true;bust.add(neck);
const head=new THREE.Mesh(new THREE.SphereGeometry(.62,24,18),clay);head.position.y=1.38;head.scale.set(.88,1.08,.84);head.castShadow=true;bust.add(head);
const nose=new THREE.Mesh(new THREE.ConeGeometry(.14,.42,10),clay);nose.rotation.x=Math.PI/2;nose.position.set(0,1.37,.57);nose.castShadow=true;bust.add(nose);
for(const x of [-.22,.22]){const eye=sphere('Bust eye',x,1.55,.51,.045,mat(0x3c2925));bust.attach(eye)}
const shoulder=new THREE.Mesh(new THREE.SphereGeometry(.82,20,12),clay);shoulder.scale.set(1,.42,.62);shoulder.position.y=.38;shoulder.castShadow=true;bust.add(shoulder);

const ladder=new THREE.Group();ladder.name='Wooden ladder';ladder.position.set(-7.8,0,-1.9);ladder.rotation.z=-.1;scene.add(ladder);
function ladderBox(x,y,z,w,h,d){const q=box('Ladder rail',x,y,z,w,h,d,wood);ladder.attach(q)}
ladderBox(-.72,3.7,0,.16,7.6,.18);ladderBox(.72,3.7,0,.16,7.6,.18);
for(let i=0;i<7;i++){const q=box('Ladder rung',0,1.05+i*.9,0,.92,.14,.2,wood);ladder.attach(q)}

const beam=new THREE.Group();beam.name='Draped cloth';beam.position.set(2.2,9.45,-2.4);scene.add(beam);
box('Drapery support beam',0,0,0,7.2,.2,.28,darkWood);
const drapeMat=new THREE.MeshStandardMaterial({color:0x9c6f65,roughness:.95,side:THREE.DoubleSide});
const cloths=[];
for(let i=0;i<4;i++){
  const geo=new THREE.PlaneGeometry(1.45,4.6,10,16);
  const p=geo.attributes.position;
  for(let j=0;j<p.count;j++){const x=p.getX(j),y=p.getY(j);p.setZ(j,.22*Math.sin(x*4+y*1.8+i)+.1*Math.cos(y*3+i))}
  geo.computeVertexNormals();
  const q=new THREE.Mesh(geo,drapeMat);q.position.set(-2.55+i*1.7,-2.15,.08);q.rotation.y=(i%2?-0.08:.08);q.castShadow=true;beam.add(q);cloths.push(q);
}

const table=box('Worktable',2.4,2.05,-1.3,4.5,.25,1.65,wood);
for(const x of [0.7,4.1])for(const z of [-1.85,-.75])cyl('Table leg',x,.95,z,.15,2.0,darkWood);
box('Table drawer',2.4,1.7,-1.15,2.0,.45,.7,darkWood);
for(let i=0;i<6;i++){const q=cyl('Table jar',1.05+i*.5,2.52,-1.28,.16,.75,mat([0xa9c4bd,0xc6815f,0xe2ba67][i%3]),{x:0,z:(rnd()-.5)*.15});q.scale.y=.85;scene.add(q)}

for(let i=0;i<8;i++){
  const x=-5.4+(i%4)*1.55,y=1.2+Math.floor(i/4)*1.35,z=-5.85;
  const q=box('Leaning canvas',x,y,z,1.2,.13,2.0,wood,(rnd()-.5)*.12);q.rotation.x=.05; 
  box('Leaning artwork',x,y+.04,z-.11,1.0,.04,1.72,mat([0x7b9a90,0xb86b4f,0xd5aa63,0x5a6e79][i%4],.95),q.rotation.y);
}
for(let i=0;i<5;i++){const q=cyl('Rolled canvas',-5.4+i*.38,.35,-5.35,.16,2.0,mat(0xbca378),{x:Math.PI/2,z:.2});q.rotation.y=rnd();}

const stool=cyl('Studio stool',-3.8,1.25,-.9,.62,.22,wood);
cyl('Stool stem',-3.8,.68,-.9,.12,1.1,metal);
for(let i=0;i<3;i++){const q=box('Stool foot',-3.8,0.18,-.9,.1,.1,1.6,metal);q.rotation.y=i*Math.PI/3; }
const plant=new THREE.Group();plant.position.set(9.0,.2,2.8);scene.add(plant);
cyl('Plant pot',0,.55,0,.55,.9,mat(0x9d654d));
for(let i=0;i<9;i++){
  const stem=cyl('Leaf stem',0,.95,0,.035,1.8,green,{x:(rnd()-.5)*.8,z:(rnd()-.5)*.8},8);plant.attach(stem);
  const leaf=sphere('Leaf',(rnd()-.5)*.8,1.7+(rnd()-.5)*.6,(rnd()-.5)*.7,.35,green,{x:.3,y:1.2,z:.12});leaf.rotation.z=(rnd()-.5)*1.5;plant.attach(leaf);
}

const dust=[];
for(let i=0;i<18;i++){
  const q=sphere('Dust mote',-6+rnd()*13,2+rnd()*6,-4+rnd()*6,.018,mat(0xffdfaa,.4,0,1));
  q.material.transparent=true;q.material.opacity=.25;dust.push(q);
}
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);const t=clock.getElapsedTime();
  cloths.forEach((q,i)=>{q.rotation.z=Math.sin(t*.8+i)*.035;q.position.x+=Math.sin(t*.55+i)*.0005});
  cart.rotation.y=Math.sin(t*.7)*.012;
  bust.rotation.y=Math.sin(t*.45)*.035;
  warm.intensity=2.1+Math.sin(t*.9)*.22;
  dust.forEach((q,i)=>{q.position.y+=Math.sin(t*.35+i)*.0007;q.position.x+=Math.sin(t*.25+i)*.00035});
  controls.update();renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
animate();
</script>
</body>
</html>
