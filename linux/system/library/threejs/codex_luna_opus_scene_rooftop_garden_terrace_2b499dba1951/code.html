let seed = 48271;
function rand() {
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
}
function range(a, b) { return a + (b - a) * rand(); }

const mats = {};
function material(name, color, roughness = 0.65, metalness = 0) {
  mats[name] = new THREE.MeshStandardMaterial({
    color, roughness, metalness
  });
  return mats[name];
}

function box(w, h, d, mat, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function cyl(r, h, mat, x = 0, y = 0, z = 0, parent = scene, radial = 16) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, radial), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function sphere(r, mat, x = 0, y = 0, z = 0, parent = scene, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), mat);
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function beamBetween(a, b, radius, mat, parent = scene) {
  const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
  const dir = new THREE.Vector3().subVectors(b, a);
  const length = dir.length();
  const m = cyl(radius, length, mat, mid.x, mid.y, mid.z, parent, 10);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
  return m;
}

function makePlanter(x, z, w, d, h = 1.15) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  scene.add(g);
  box(w, h, 0.24, mats.wood, 0, h / 2, -d / 2, g);
  box(w, h, 0.24, mats.wood, 0, h / 2, d / 2, g);
  box(0.24, h, d, mats.wood, -w / 2, h / 2, 0, g);
  box(0.24, h, d, mats.wood, w / 2, h / 2, 0, g);
  box(w - 0.35, 0.18, d - 0.35, mats.soil, 0, h + 0.06, 0, g);
  for (let i = 0; i < 4; i++) {
    box(w - 0.45, 0.035, 0.035, mats.woodDark, 0, 0.3 + i * 0.24, -d / 2 - 0.14, g);
    box(w - 0.45, 0.035, 0.035, mats.woodDark, 0, 0.3 + i * 0.24, d / 2 + 0.14, g);
  }
  return { g, w, d, h };
}

function makeStem(x, z, height, leafMat = mats.leaf, parent = scene) {
  const g = new THREE.Group();
  g.position.set(x, 1.32, z);
  parent.add(g);
  const stem = beamBetween(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, height, 0), 0.045, mats.leafDark, g);
  stem.castShadow = true;
  const count = Math.max(2, Math.floor(height * 2.2));
  for (let i = 0; i < count; i++) {
    const y = 0.25 + i * height / count;
    const side = i % 2 ? 1 : -1;
    const leaf = sphere(0.22, leafMat, side * 0.17, y, 0, g, 1.5, 0.42, 0.75);
    leaf.rotation.z = side * 0.45;
  }
  return g;
}

function vine(side) {
  const g = new THREE.Group();
  pergola.add(g);
  for (let i = 0; i < 20; i++) {
    const t = i / 19;
    const x = side * (5.72 - t * 5.35);
    const y = 0.8 + t * 6.2;
    const z = side > 0 ? 2.72 : -2.72;
    sphere(0.13, mats.leaf, x, y, z + Math.sin(i * 1.7) * 0.18, g, 1.5, 0.55, 0.75);
    if (i > 0) beamBetween(new THREE.Vector3(side * (5.72 - (i - 1) / 19 * 5.35), 0.8 + (i - 1) / 19 * 6.2, z), new THREE.Vector3(x, y, z), 0.035, mats.leafDark, g);
  }
  return g;
}

const wireGroup = new THREE.Group();

const bulbMeshes = [];
for (const z of [-2.55, 2.55]) {
  const points = [];
  for (let i = 0; i <= 18; i++) {
    const x = -5.5 + i * 0.61;
    const y = 6.45 + Math.sin(i / 18 * Math.PI) * -0.85;
    points.push(new THREE.Vector3(x, y, z));
  }
  const curve = new THREE.CatmullRomCurve3(points);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 32, 0.025, 6, false), mats.wire);
  tube.castShadow = true;
  wireGroup.add(tube);
  for (let i = 0; i < 10; i++) {
    const x = -5.2 + i * 1.15;
    const y = 5.7 + Math.sin((i + 0.5) / 9.5 * Math.PI) * -0.85;
    const bulb = sphere(0.14, mats.warm, x, y, z, wireGroup, 0.8, 1, 0.8);
    bulb.userData.phase = i * 0.7 + z;
    bulbMeshes.push(bulb);
    const glow = new THREE.PointLight(0xffbb68, 0.35, 3.1, 2);
    glow.position.copy(bulb.position);
    wireGroup.add(glow);
    bulb.userData.glow = glow;
  }
}

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  for (let i = 0; i < bulbMeshes.length; i++) {
    const bulb = bulbMeshes[i];
    const sway = Math.sin(t * 1.3 + bulb.userData.phase) * 0.055;
    bulb.rotation.z = sway;
    bulb.position.x += Math.sin(t * 1.3 + bulb.userData.phase) * 0.0007;
    bulb.userData.glow.intensity = 0.28 + Math.sin(t * 2.1 + bulb.userData.phase) * 0.08;
  }
  for (let i = 0; i < animatedLeaves.length; i++) {
    const g = animatedLeaves[i];
    const phase = g.userData.sway || i;
    g.rotation.z = Math.sin(t * 0.65 + phase) * 0.025;
    g.rotation.x = Math.cos(t * 0.52 + phase) * 0.018;
  }
  flame.children.forEach((f, i) => {
    f.scale.y = 0.8 + Math.sin(t * 5 + i * 1.7) * 0.22;
    f.rotation.z = Math.sin(t * 3.5 + i) * 0.24;
    f.position.x += Math.sin(t * 4 + i) * 0.002;
  });
  fireLight.intensity = 2.8 + Math.sin(t * 7.5) * 0.5 + Math.sin(t * 13.1) * 0.25;
  starPoints.rotation.y = t * 0.002;
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
