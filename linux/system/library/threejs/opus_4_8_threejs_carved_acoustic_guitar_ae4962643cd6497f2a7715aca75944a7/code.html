<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Carved-Wood Acoustic Guitar</title>
<style>
  html, body { margin: 0; height: 100%; background: #16161a; overflow: hidden; }
  #info {
    position: fixed; left: 14px; bottom: 12px; z-index: 10;
    font: 12px/1.5 -apple-system, system-ui, sans-serif;
    color: #c9bfa8; letter-spacing: .3px; text-shadow: 0 1px 3px rgba(0,0,0,.6);
    pointer-events: none; user-select: none;
  }
  #info b { color: #e8d9b8; font-weight: 600; }
</style>
</head>
<body>
<div id="info"><b>Carved-Wood Dreadnought</b> — drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ *
 *  Renderer
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ------------------------------------------------------------------ *
 *  Scene & Camera
 * ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17171b);
scene.fog = new THREE.Fog(0x17171b, 3.2, 7.5);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(0.55, 0.22, 1.78);

/* ------------------------------------------------------------------ *
 *  Lighting  (hemisphere + key / fill / rim)
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xb8c6da, 0x3a2f26, 0.55);
scene.add(hemi);

const ambient = new THREE.AmbientLight(0x2a2620, 0.35);
scene.add(ambient);

const key = new THREE.DirectionalLight(0xfff3dc, 2.4);
key.position.set(1.6, 2.6, 2.1);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 9;
key.shadow.camera.left = -1.3;
key.shadow.camera.right = 1.3;
key.shadow.camera.top = 1.3;
key.shadow.camera.bottom = -1.3;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0xd9c9ff, 0.55);
fill.position.set(-2.6, 0.9, 1.4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xbfe0ff, 1.3);
rim.position.set(-1.2, 1.8, -2.6);
scene.add(rim);

/* ------------------------------------------------------------------ *
 *  Procedural wood-grain texture (canvas — no external assets)
 * ------------------------------------------------------------------ */
function makeWoodTexture(base, streak, lineCount, waviness) {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');

  // warm base with a faint vertical light variation
  const g = ctx.createLinearGradient(0, 0, 512, 0);
  g.addColorStop(0.0, base);
  g.addColorStop(0.5, shade(base, 10));
  g.addColorStop(1.0, base);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 512, 512);

  // long vertical grain streaks
  for (let i = 0; i < lineCount; i++) {
    const x = Math.random() * 512;
    const amp = waviness * (0.4 + Math.random());
    const ph = Math.random() * Math.PI * 2;
    const freq = 0.006 + Math.random() * 0.01;
    ctx.strokeStyle = Math.random() > 0.5
      ? hexA(streak, 0.04 + Math.random() * 0.14)
      : hexA(shade(base, 22), 0.05 + Math.random() * 0.10);
    ctx.lineWidth = 0.4 + Math.random() * 1.7;
    ctx.beginPath();
    for (let y = -8; y <= 520; y += 7) {
      const xx = x + Math.sin(y * freq + ph) * amp;
      if (y <= -8) ctx.moveTo(xx, y); else ctx.lineTo(xx, y);
    }
    ctx.stroke();
  }
  // occasional darker figure/knot swirl
  for (let k = 0; k < 5; k++) {
    ctx.strokeStyle = hexA(streak, 0.05);
    ctx.lineWidth = 1.2;
    const cx = Math.random() * 512, cy = Math.random() * 512, rr = 8 + Math.random() * 26;
    ctx.beginPath();
    ctx.ellipse(cx, cy, rr * 0.35, rr, Math.random(), 0, Math.PI * 2);
    ctx.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
}

const spruceTex   = makeWoodTexture('#d8b779', '#a8814a', 260, 9);
const rosewoodTex = makeWoodTexture('#5a3320', '#2e160c', 200, 14);
const fboardTex   = makeWoodTexture('#3a2113', '#1c0d07', 160, 10);
spruceTex.repeat.set(2.4, 2.4);
rosewoodTex.repeat.set(2.2, 2.6);
fboardTex.repeat.set(1.2, 4.0);

/* ------------------------------------------------------------------ *
 *  Materials
 * ------------------------------------------------------------------ */
const matTop = new THREE.MeshPhysicalMaterial({
  map: spruceTex, color: 0xffffff, roughness: 0.46, metalness: 0.0,
  clearcoat: 0.7, clearcoatRoughness: 0.35, sheen: 0.3, sheenColor: 0xffe9c2
});
const matRosewood = new THREE.MeshPhysicalMaterial({
  map: rosewoodTex, color: 0xffffff, roughness: 0.42, metalness: 0.0,
  clearcoat: 0.6, clearcoatRoughness: 0.34, side: THREE.DoubleSide
});
const matSides = matRosewood.clone();
const matNeck = new THREE.MeshPhysicalMaterial({
  color: 0x7a4a2b, roughness: 0.5, metalness: 0.0, flatShading: true,
  clearcoat: 0.45, clearcoatRoughness: 0.4
});
const matFboard = new THREE.MeshPhysicalMaterial({
  map: fboardTex, color: 0xffffff, roughness: 0.4, metalness: 0.0, clearcoat: 0.5, clearcoatRoughness: 0.3
});
const matHead = new THREE.MeshPhysicalMaterial({
  map: rosewoodTex, color: 0xf6f6f6, roughness: 0.4, metalness: 0.0, clearcoat: 0.6, clearcoatRoughness: 0.32
});
const matBridge = new THREE.MeshPhysicalMaterial({
  color: 0x2c1810, roughness: 0.45, metalness: 0.0, flatShading: true, clearcoat: 0.4
});
const matBone = new THREE.MeshStandardMaterial({ color: 0xe8e0cd, roughness: 0.5, metalness: 0.0 });
const matMetal = new THREE.MeshStandardMaterial({ color: 0xd0d3d8, roughness: 0.32, metalness: 0.95 });
const matString = new THREE.MeshStandardMaterial({ color: 0xcaccce, roughness: 0.35, metalness: 0.9 });
const matDark = new THREE.MeshStandardMaterial({ color: 0x0a0705, roughness: 1.0, metalness: 0.0 });
const matRosetteA = new THREE.MeshStandardMaterial({ color: 0x2a1810, roughness: 0.5, metalness: 0.0, flatShading: true });
const matRosetteB = new THREE.MeshStandardMaterial({ color: 0xcaa46a, roughness: 0.5, metalness: 0.05, flatShading: true });
const matPearl = new THREE.MeshStandardMaterial({ color: 0xeae6da, roughness: 0.35, metalness: 0.1 });

/* ------------------------------------------------------------------ *
 *  Geometry helpers
 * ------------------------------------------------------------------ */
const guitar = new THREE.Group();

function part(geo, mat, cast = true, receive = true) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast;
  m.receiveShadow = receive;
  guitar.add(m);
  return m;
}

// Dreadnought body outline (long axis = Y, symmetric in X)
function makeBodyShape() {
  const s = new THREE.Shape();
  s.moveTo(0, -0.300);
  s.bezierCurveTo(0.125, -0.300, 0.212, -0.205, 0.206, -0.100);
  s.bezierCurveTo(0.201, -0.020, 0.138, -0.008, 0.126, 0.030);
  s.bezierCurveTo(0.114, 0.072, 0.150, 0.100, 0.159, 0.146);
  s.bezierCurveTo(0.165, 0.192, 0.112, 0.226, 0.052, 0.240);
  s.bezierCurveTo(0.032, 0.245, 0.016, 0.247, 0.000, 0.247);
  s.bezierCurveTo(-0.016, 0.247, -0.032, 0.245, -0.052, 0.240);
  s.bezierCurveTo(-0.112, 0.226, -0.165, 0.192, -0.159, 0.146);
  s.bezierCurveTo(-0.150, 0.100, -0.114, 0.072, -0.126, 0.030);
  s.bezierCurveTo(-0.138, -0.008, -0.201, -0.020, -0.206, -0.100);
  s.bezierCurveTo(-0.212, -0.205, -0.125, -0.300, 0.000, -0.300);
  return s;
}

const BODY_D = 0.110;
const topZ = BODY_D / 2;      //  0.055
const backZ = -BODY_D / 2;    // -0.055
const HOLE_Y = 0.020;
const HOLE_R = 0.052;

// ---- Body: sides (lofted wall) ----
function buildSideWall(shape) {
  const pts = shape.getPoints(220);
  const N = pts.length;
  const cum = [0];
  for (let i = 1; i < N; i++) cum[i] = cum[i - 1] + pts[i].distanceTo(pts[i - 1]);
  const peri = cum[N - 1] || 1;

  const pos = [], uv = [], idx = [];
  for (let i = 0; i < N; i++) {
    const p = pts[i];
    const u = (cum[i] / peri) * 7.0;
    pos.push(p.x, p.y, topZ);  uv.push(u, 1);
    pos.push(p.x, p.y, backZ); uv.push(u, 0);
  }
  for (let i = 0; i < N - 1; i++) {
    const a = i * 2, b = (i + 1) * 2;
    idx.push(a, b, b + 1, a, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

const bodyShape = makeBodyShape();

// Back plate (rosewood)
const backPlate = part(new THREE.ShapeGeometry(bodyShape, 24), matRosewood);
backPlate.position.z = backZ;
backPlate.rotation.y = Math.PI;

// Side wall (rosewood)
part(buildSideWall(bodyShape), matSides);

// Top plate (spruce) with sound-hole cut
const topShape = makeBodyShape();
const holePath = new THREE.Path();
holePath.absarc(0, HOLE_Y, HOLE_R, 0, Math.PI * 2, true);
topShape.holes.push(holePath);
const topPlate = part(new THREE.ShapeGeometry(topShape, 24), matTop);
topPlate.position.z = topZ;

// dark cavity behind the sound hole
const cavity = part(new THREE.CircleGeometry(HOLE_R + 0.006, 40), matDark, false, false);
cavity.position.set(0, HOLE_Y, topZ - 0.028);

// ---- Rosette relief (carved concentric rings) ----
function ring(radius, tube, mat, seg) {
  const t = part(new THREE.TorusGeometry(radius, tube, 8, seg || 72), mat, false);
  t.position.set(0, HOLE_Y, topZ + 0.001);
  return t;
}
ring(HOLE_R + 0.004, 0.0028, matBone, 80);           // inner binding
ring(HOLE_R + 0.016, 0.0045, matRosetteA, 64);        // dark relief band
ring(HOLE_R + 0.024, 0.0026, matRosetteB, 80);        // light accent
ring(HOLE_R + 0.031, 0.0040, matRosetteA, 64);        // dark relief band
ring(HOLE_R + 0.038, 0.0024, matBone, 80);            // outer binding

// ---- Neck (faceted round back) ----
const neck = part(new THREE.CylinderGeometry(0.014, 0.017, 0.420, 10, 3), matNeck);
neck.position.set(0, 0.445, 0.044);

// Heel block joining neck to body
const heel = part(new THREE.BoxGeometry(0.055, 0.07, 0.045), matNeck);
heel.position.set(0, 0.232, 0.040);
heel.rotation.x = 0.12;

// ---- Fretboard (tapered, extends over the top as a tongue) ----
const fbShape = new THREE.Shape();
fbShape.moveTo(-0.032, 0.150);
fbShape.lineTo(0.032, 0.150);
fbShape.lineTo(0.0215, 0.663);
fbShape.lineTo(-0.0215, 0.663);
fbShape.lineTo(-0.032, 0.150);
const fboard = part(new THREE.ExtrudeGeometry(fbShape, { depth: 0.008, bevelEnabled: false }), matFboard);
fboard.position.z = 0.060;

const FB_FRONT = 0.068;
function fbHalfWidth(y) {
  const t = (y - 0.150) / (0.663 - 0.150);
  return 0.032 + (0.0215 - 0.032) * t;
}

// ---- Frets & inlays ----
const NUT_Y = 0.655, SCALE = 0.765;
const fretY = [];
for (let n = 1; n <= 19; n++) {
  const y = NUT_Y - SCALE * (1 - Math.pow(2, -n / 12));
  if (y >= 0.16) fretY.push(y);
}
for (const y of fretY) {
  const len = fbHalfWidth(y) * 2 + 0.002;
  const f = part(new THREE.CylinderGeometry(0.0016, 0.0016, len, 8), matMetal, true, false);
  f.rotation.z = Math.PI / 2;
  f.position.set(0, y, FB_FRONT + 0.0012);
}
// position markers (dots) between frets
const markerFrets = [3, 5, 7, 9, 12, 15, 17];
for (const n of markerFrets) {
  if (n >= fretY.length) continue;
  const y = (fretY[n - 1] + fretY[n - 2]) / 2;
  if (n === 12) {
    for (const dx of [-0.010, 0.010]) {
      const d = part(new THREE.CircleGeometry(0.0055, 20), matPearl, false, false);
      d.position.set(dx, y, FB_FRONT + 0.0002);
    }
  } else {
    const d = part(new THREE.CircleGeometry(0.0058, 20), matPearl, false, false);
    d.position.set(0, y, FB_FRONT + 0.0002);
  }
}

// ---- Nut ----
const nut = part(new THREE.BoxGeometry(0.046, 0.006, 0.012), matBone);
nut.position.set(0, NUT_Y + 0.004, FB_FRONT - 0.002);

// ---- Bridge, saddle & pins ----
const bridge = part(new THREE.BoxGeometry(0.086, 0.028, 0.014), matBridge);
bridge.position.set(0, -0.100, topZ + 0.007);
const saddle = part(new THREE.BoxGeometry(0.070, 0.006, 0.006), matBone);
saddle.position.set(0, -0.088, topZ + 0.016);
for (let i = 0; i < 6; i++) {
  const px = THREE.MathUtils.lerp(-0.028, 0.028, i / 5);
  const pin = part(new THREE.CylinderGeometry(0.0032, 0.0032, 0.012, 12), matBone);
  pin.position.set(px, -0.108, topZ + 0.016);
}

// ---- Headstock (scrolled, faceted) ----
const hsShape = new THREE.Shape();
hsShape.moveTo(-0.028, 0.655);
hsShape.bezierCurveTo(-0.030, 0.680, -0.044, 0.690, -0.042, 0.720);
hsShape.bezierCurveTo(-0.040, 0.760, -0.041, 0.775, -0.030, 0.795);
hsShape.bezierCurveTo(-0.020, 0.810, 0.020, 0.810, 0.030, 0.795);
hsShape.bezierCurveTo(0.041, 0.775, 0.040, 0.760, 0.042, 0.720);
hsShape.bezierCurveTo(0.044, 0.690, 0.030, 0.680, 0.028, 0.655);
hsShape.lineTo(-0.028, 0.655);
const headstock = part(new THREE.ExtrudeGeometry(hsShape, { depth: 0.011, bevelEnabled: false }), matHead);
headstock.position.z = 0.057;

// carved scroll curl at the crown
const scrollPts = [];
for (let i = 0; i <= 54; i++) {
  const t = i / 54;
  const ang = t * Math.PI * 3.1;
  const r = 0.030 * (1 - 0.60 * t);
  scrollPts.push(new THREE.Vector3(Math.sin(ang) * r * 0.85, 0.808 + Math.cos(ang) * r, 0.070 - t * 0.022));
}
const scroll = part(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(scrollPts), 70, 0.0055, 7), matNeck);

// tuning posts + buttons
const tunerY = [0.700, 0.742, 0.784];
for (let s = 0; s < 2; s++) {
  const sx = s === 0 ? -1 : 1;
  for (const ty of tunerY) {
    const post = part(new THREE.CylinderGeometry(0.0038, 0.0038, 0.024, 12), matMetal);
    post.rotation.x = Math.PI / 2;
    post.position.set(sx * 0.026, ty, 0.079);
    const cap = part(new THREE.CylinderGeometry(0.0028, 0.0028, 0.006, 10), matMetal);
    cap.rotation.x = Math.PI / 2;
    cap.position.set(sx * 0.026, ty, 0.092);
    const btn = part(new THREE.CylinderGeometry(0.007, 0.007, 0.012, 14), matPearl);
    btn.rotation.z = Math.PI / 2;
    btn.position.set(sx * 0.050, ty, 0.062);
    const stem = part(new THREE.CylinderGeometry(0.003, 0.003, 0.016, 10), matMetal);
    stem.rotation.z = Math.PI / 2;
    stem.position.set(sx * 0.042, ty, 0.062);
  }
}

// ---- Strings (bridge -> nut -> post) ----
for (let i = 0; i < 6; i++) {
  const f = i / 5;
  const bx = THREE.MathUtils.lerp(-0.026, 0.026, f);
  const nx = THREE.MathUtils.lerp(-0.020, 0.020, f);
  const side = i < 3 ? -1 : 1;
  const py = i < 3 ? [0.784, 0.742, 0.700][i] : [0.700, 0.742, 0.784][i - 3];
  const px = side * 0.026;
  const pts = [
    new THREE.Vector3(bx, -0.108, topZ + 0.017),
    new THREE.Vector3(bx, -0.020, topZ + 0.019),
    new THREE.Vector3(nx, 0.30, FB_FRONT + 0.005),
    new THREE.Vector3(nx, NUT_Y, FB_FRONT + 0.006),
    new THREE.Vector3(px, py, 0.083)
  ];
  const rad = 0.0009 + i * 0.00012;
  part(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 80, rad, 6), matString, true, false);
}

/* ------------------------------------------------------------------ *
 *  Center the object & add ground
 * ------------------------------------------------------------------ */
guitar.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(guitar);
const center = box.getCenter(new THREE.Vector3());
guitar.position.set(-center.x, -center.y, -center.z);
const groundY = box.min.y - center.y;
scene.add(guitar);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(8, 8),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = groundY - 0.001;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ *
 *  Controls
 * ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 0.7;
controls.maxDistance = 4.0;
controls.target.set(0, 0, 0);
controls.update();

/* ------------------------------------------------------------------ *
 *  Resize & Render loop
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
