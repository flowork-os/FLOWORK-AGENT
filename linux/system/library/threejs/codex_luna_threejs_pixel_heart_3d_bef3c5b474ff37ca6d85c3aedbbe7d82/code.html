<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voxel Heart</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #120914;
    }

    body {
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x120914);
    scene.fog = new THREE.Fog(0x120914, 10, 22);

    const camera = new THREE.PerspectiveCamera(
      34,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0.25, 10);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.065;
    controls.enablePan = false;
    controls.minDistance = 7;
    controls.maxDistance = 15;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.15;
    controls.target.set(0, 0, 0);

    scene.add(new THREE.HemisphereLight(0xffd5df, 0x210c24, 1.55));

    const keyLight = new THREE.DirectionalLight(0xffd9cf, 3.2);
    keyLight.position.set(-5, 7, 8);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.left = -6;
    keyLight.shadow.camera.right = 6;
    keyLight.shadow.camera.top = 7;
    keyLight.shadow.camera.bottom = -6;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 25;
    keyLight.shadow.bias = -0.0008;
    scene.add(keyLight);

    const rimLight = new THREE.PointLight(0xff174b, 5.5, 13, 2);
    rimLight.position.set(4, 0.5, 5);
    scene.add(rimLight);

    const fillLight = new THREE.PointLight(0x7e1f72, 3.2, 12, 2);
    fillLight.position.set(-4, -3, 2);
    scene.add(fillLight);

    const heart = new THREE.Group();
    heart.rotation.set(-0.045, 0.08, -0.025);
    scene.add(heart);

    const voxelSize = 0.88;
    const spacing = 0.96;
    const voxelGeometry = new THREE.BoxGeometry(voxelSize, voxelSize, voxelSize);

    const redMaterials = [
      new THREE.MeshStandardMaterial({
        color: 0xd7193f,
        roughness: 0.72,
        metalness: 0.02,
        flatShading: true
      }),
      new THREE.MeshStandardMaterial({
        color: 0xe51b42,
        roughness: 0.7,
        metalness: 0.02,
        flatShading: true
      }),
      new THREE.MeshStandardMaterial({
        color: 0xc81038,
        roughness: 0.76,
        metalness: 0.02,
        flatShading: true
      })
    ];

    const highlightMaterial = new THREE.MeshStandardMaterial({
      color: 0xff7180,
      roughness: 0.62,
      metalness: 0.01,
      flatShading: true
    });

    const silhouette = [
      { y: 2, xs: [-2, -1, 1, 2] },
      { y: 1, xs: [-2, -1, 0, 1, 2] },
      { y: 0, xs: [-2, -1, 0, 1, 2] },
      { y: -1, xs: [-1, 0, 1] },
      { y: -2, xs: [0] }
    ];

    const layers = [-0.88, 0, 0.88];
    const totalVoxels = silhouette.reduce((sum, row) => sum + row.xs.length, 0) * layers.length;
    let voxelIndex = 0;

    for (const z of layers) {
      for (const row of silhouette) {
        for (const x of row.xs) {
          const isHighlight = z === 0.88 && x === -2 && row.y === 1;
          const voxel = new THREE.Mesh(
            voxelGeometry,
            isHighlight ? highlightMaterial : redMaterials[voxelIndex % redMaterials.length]
          );

          voxel.position.set(
            x * spacing,
            row.y * spacing - 0.04,
            z
          );
          voxel.castShadow = true;
          voxel.receiveShadow = true;
          heart.add(voxel);
          voxelIndex++;
        }
      }
    }

    const sideMaterial = new THREE.MeshStandardMaterial({
      color: 0x8e1030,
      roughness: 0.82,
      metalness: 0.01,
      flatShading: true
    });

    const rearAccent = new THREE.Mesh(
      new THREE.BoxGeometry(0.34, 0.34, 0.18),
      sideMaterial
    );
    rearAccent.position.set(0.48, -1.95, -1.31);
    rearAccent.castShadow = true;
    heart.add(rearAccent);

    const glow = new THREE.PointLight(0xff163f, 1.4, 5, 2);
    glow.position.set(0, 0, 1.5);
    heart.add(glow);

    const clock = new THREE.Clock();

    function animate() {
      const elapsed = clock.getElapsedTime();
      heart.position.y = Math.sin(elapsed * 1.35) * 0.09;
      controls.update();
      renderer.render(scene, camera);
    }

    renderer.setAnimationLoop(animate);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
