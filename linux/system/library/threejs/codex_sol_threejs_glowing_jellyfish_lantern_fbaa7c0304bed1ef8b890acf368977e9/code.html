<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowing Jellyfish Lantern</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020511;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020511);
scene.fog = new THREE.FogExp2(0x020511, 0.032);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.4, 2.8, 9.6);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.15, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.enablePan = false;
controls.minDistance = 7;
controls.maxDistance = 18;
controls.minPolarAngle = 0.35;
controls.maxPolarAngle = Math.PI - 0.18;

scene.add(new THREE.HemisphereLight(0x315b82, 0x080315, 0.65));

const aquaLight = new THREE.PointLight(0x45f6ff, 42, 11, 2);
aquaLight.position.set(0, 1.35, 0);
scene.add(aquaLight);

const violetLight = new THREE.PointLight(0x8c4dff, 18, 9, 2);
violetLight.position.set(0, -2.15, 0.2);
scene.add(violetLight);

const lantern = new THREE.Group();
lantern.position.y = 0.25;
scene.add(lantern);

function makeGlowTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;
  const context = canvas.getContext('2d');
  const gradient = context.createRadialGradient(128, 128, 0, 128, 128, 128);
  gradient.addColorStop(0, 'rgba(125,255,255,0.9)');
  gradient.addColorStop(0.18, 'rgba(60,220,255,0.34)');
  gradient.addColorStop(0.52, 'rgba(78,75,255,0.09)');
  gradient.addColorStop(1, 'rgba(0,0,0,0)');
  context.fillStyle = gradient;
  context.fillRect(0, 0, 256, 256);
  return new THREE.CanvasTexture(canvas);
}

const haloMaterial = new THREE.SpriteMaterial({
  map: makeGlowTexture(),
  color: 0x8afcff,
  transparent: true,
  opacity: 0.46,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const halo = new THREE.Sprite(haloMaterial);
halo.scale.set(7.2, 7.2, 1);
halo.position.set(0, 0.45, -0.7);
lantern.add(halo);

const profile = [];
const profileSegments = 40;
for (let i = 0; i <= profileSegments; i++) {
  const t = i / profileSegments;
  const angle = t * Math.PI * 0.5;
  let radius = 2.04 * Math.pow(Math.sin(angle), 0.9);
  let y = 1.02 + 1.92 * Math.cos(angle);
  if (t > 0.82) {
    const lip = (t - 0.82) / 0.18;
    radius += 0.08 * Math.sin(lip * Math.PI);
    y += 0.05 * Math.sin(lip * Math.PI);
  }
  profile.push(new THREE.Vector2(Math.max(radius, 0.025), y));
}

const domeGeometry = new THREE.LatheGeometry(profile, 96);
domeGeometry.computeVertexNormals();

const domeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x54dce8,
  emissive: 0x0a6676,
  emissiveIntensity: 1.15,
  roughness: 0.18,
  metalness: 0,
  transmission: 0.5,
  thickness: 0.75,
  transparent: true,
  opacity: 0.54,
  side: THREE.DoubleSide,
  depthWrite: false,
  clearcoat: 0.7,
  clearcoatRoughness: 0.18
});

const dome = new THREE.Mesh(domeGeometry, domeMaterial);
dome.renderOrder = 2;
lantern.add(dome);

const innerGeometry = new THREE.SphereGeometry(1.55, 64, 32);
innerGeometry.scale(1, 0.62, 1);
const innerMaterial = new THREE.MeshBasicMaterial({
  color: 0x42e9ff,
  transparent: true,
  opacity: 0.095,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const innerGlow = new THREE.Mesh(innerGeometry, innerMaterial);
innerGlow.position.y = 1.43;
lantern.add(innerGlow);

const rimGeometry = new THREE.TorusGeometry(2.035, 0.065, 12, 96);
const rimMaterial = new THREE.MeshStandardMaterial({
  color: 0x86ffff,
  emissive: 0x29eaff,
  emissiveIntensity: 4,
  roughness: 0.22,
  transparent: true,
  opacity: 0.92
});
const rim = new THREE.Mesh(rimGeometry, rimMaterial);
rim.rotation.x = Math.PI / 2;
rim.position.y = 1.02;
lantern.add(rim);

const rimAura = new THREE.Mesh(
  new THREE.TorusGeometry(2.045, 0.14, 12, 96),
  new THREE.MeshBasicMaterial({
    color: 0x35eaff,
    transparent: true,
    opacity: 0.15,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
rimAura.rotation.x = Math.PI / 2;
rimAura.position.y = 1.02;
lantern.add(rimAura);

const veinMaterial = new THREE.MeshStandardMaterial({
  color: 0xc5ffff,
  emissive: 0x67f7ff,
  emissiveIntensity: 5,
  roughness: 0.28
});

const veinGlowMaterial = new THREE.MeshBasicMaterial({
  color: 0x42eaff,
  transparent: true,
  opacity: 0.13,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

function domePoint(phi, theta, lift = 0.025) {
  const radius = 2.04 * Math.pow(Math.sin(phi), 0.9) + lift;
  const y = 1.02 + 1.92 * Math.cos(phi);
  return new THREE.Vector3(
    radius * Math.cos(theta),
    y,
    radius * Math.sin(theta)
  );
}

function addVein(points, radius = 0.018) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geometry = new THREE.TubeGeometry(curve, Math.max(16, points.length * 8), radius, 6, false);
  const strand = new THREE.Mesh(geometry, veinMaterial);
  strand.renderOrder = 3;
  lantern.add(strand);

  const aura = new THREE.Mesh(
    new THREE.TubeGeometry(curve, Math.max(16, points.length * 8), radius * 2.8, 6, false),
    veinGlowMaterial
  );
  aura.renderOrder = 3;
  lantern.add(aura);
}

const mainVeins = 9;
for (let i = 0; i < mainVeins; i++) {
  const baseTheta = i * Math.PI * 2 / mainVeins;
  const points = [];
  const count = 9;
  for (let j = 0; j < count; j++) {
    const f = j / (count - 1);
    const phi = 0.22 + f * 1.29;
    const sway = Math.sin(f * Math.PI * 2.1 + i * 1.73) * 0.055 +
                 Math.sin(f * Math.PI * 5.2 + i) * 0.014;
    points.push(domePoint(phi, baseTheta + sway, 0.036));
  }
  addVein(points, 0.016 + (i % 3) * 0.003);

  for (let branchIndex = 0; branchIndex < 2; branchIndex++) {
    const startF = 0.34 + branchIndex * 0.23 + 0.025 * Math.sin(i * 2.1);
    const branchPoints = [];
    const direction = ((i + branchIndex) % 2 === 0 ? 1 : -1);
    for (let j = 0; j < 5; j++) {
      const f = j / 4;
      const phi = 0.22 + (startF + f * 0.24) * 1.29;
      const theta = baseTheta +
        Math.sin((startF + f * 0.24) * Math.PI * 2.1 + i * 1.73) * 0.055 +
        direction * f * (0.16 + branchIndex * 0.035);
      branchPoints.push(domePoint(phi, theta, 0.034));
    }
    addVein(branchPoints, 0.011);
  }
}

function createTaperedTube(curve, baseRadius, segments, radialSegments, phase) {
  const frames = curve.computeFrenetFrames(segments, false);
  const positions = [];
  const colors = [];
  const indices = [];
  const cyan = new THREE.Color(0x68ffff);
  const blue = new THREE.Color(0x3a9cff);
  const violet = new THREE.Color(0x9b45ff);

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const center = curve.getPointAt(t);
    const pulse = 1 + 0.055 * Math.sin(t * Math.PI * 7 + phase);
    const radius = Math.max(0.008, baseRadius * Math.pow(1 - t, 0.72) * pulse);
    const color = t < 0.48
      ? cyan.clone().lerp(blue, t / 0.48)
      : blue.clone().lerp(violet, (t - 0.48) / 0.52);

    for (let j = 0; j < radialSegments; j++) {
      const angle = j / radialSegments * Math.PI * 2;
      const normal = frames.normals[i];
      const binormal = frames.binormals[i];
      const offset = normal.clone().multiplyScalar(Math.cos(angle) * radius)
        .add(binormal.clone().multiplyScalar(Math.sin(angle) * radius));
      positions.push(center.x + offset.x, center.y + offset.y, center.z + offset.z);
      colors.push(color.r, color.g, color.b);
    }
  }

  for (let i = 0; i < segments; i++) {
    for (let j = 0; j < radialSegments; j++) {
      const next = (j + 1) % radialSegments;
      const a = i * radialSegments + j;
      const b = (i + 1) * radialSegments + j;
      const c = (i + 1) * radialSegments + next;
      const d = i * radialSegments + next;
      indices.push(a, b, d, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const tentacleMaterial = new THREE.MeshBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.96
});

const tentacleGlowMaterial = new THREE.MeshBasicMaterial({
  vertexColors: true,
  transparent: true,
  opacity: 0.11,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const tentacles = [];
const tentacleCount = 12;
for (let i = 0; i < tentacleCount; i++) {
  const angle = i * Math.PI * 2 / tentacleCount + 0.18;
  const ring = i % 2 === 0 ? 1.22 : 0.72;
  const length = 3.25 + 0.72 * (0.5 + 0.5 * Math.sin(i * 2.37));
  const start = new THREE.Vector3(
    Math.cos(angle) * ring,
    1.03,
    Math.sin(angle) * ring
  );
  const outward = 0.22 + 0.14 * Math.sin(i * 1.6);
  const curl = i % 2 === 0 ? 0.38 : -0.34;
  const points = [
    start,
    new THREE.Vector3(
      start.x + Math.cos(angle) * outward,
      0.25,
      start.z + Math.sin(angle) * outward
    ),
    new THREE.Vector3(
      start.x + Math.cos(angle + curl) * 0.42,
      1.03 - length * 0.53,
      start.z + Math.sin(angle + curl) * 0.42
    ),
    new THREE.Vector3(
      start.x + Math.cos(angle - curl * 1.4) * 0.58,
      1.03 - length,
      start.z + Math.sin(angle - curl * 1.4) * 0.58
    )
  ];
  const curve = new THREE.CatmullRomCurve3(points);
  const radius = 0.09 + (i % 3) * 0.012;
  const geometry = createTaperedTube(curve, radius, 48, 8, i);

  const tentacle = new THREE.Mesh(geometry, tentacleMaterial);
  tentacle.userData.phase = i * 0.77;
  tentacle.userData.angle = angle;
  lantern.add(tentacle);
  tentacles.push(tentacle);

  const glow = new THREE.Mesh(
    createTaperedTube(curve, radius * 2.35, 48, 8, i),
    tentacleGlowMaterial
  );
  glow.userData.phase = tentacle.userData.phase;
  glow.userData.angle = angle;
  lantern.add(glow);
  tentacles.push(glow);
}

const centralTendrilCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 1.05, 0),
  new THREE.Vector3(0.14, 0.1, -0.08),
  new THREE.Vector3(-0.18, -1.45, 0.12),
  new THREE.Vector3(0.08, -3.95, -0.02)
]);
const centralTendril = new THREE.Mesh(
  createTaperedTube(centralTendrilCurve, 0.12, 56, 8, 3),
  tentacleMaterial
);
lantern.add(centralTendril);

const collar = new THREE.Mesh(
  new THREE.SphereGeometry(0.72, 40, 20),
  new THREE.MeshStandardMaterial({
    color: 0x7afaff,
    emissive: 0x20d9ff,
    emissiveIntensity: 4.2,
    transparent: true,
    opacity: 0.58,
    roughness: 0.3,
    depthWrite: false
  })
);
collar.scale.y = 0.3;
collar.position.y = 0.94;
lantern.add(collar);

const loopMaterial = new THREE.MeshStandardMaterial({
  color: 0x101522,
  roughness: 0.62,
  metalness: 0.45
});

const loop = new THREE.Mesh(
  new THREE.TorusGeometry(0.36, 0.055, 12, 48),
  loopMaterial
);
loop.position.y = 3.26;
loop.rotation.y = Math.PI / 2;
lantern.add(loop);

const loopMount = new THREE.Mesh(
  new THREE.CylinderGeometry(0.095, 0.14, 0.26, 20),
  loopMaterial
);
loopMount.position.y = 3.02;
lantern.add(loopMount);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  for (let i = 0; i < tentacles.length; i++) {
    const strand = tentacles[i];
    const phase = strand.userData.phase;
    const angle = strand.userData.angle;
    strand.rotation.x = Math.sin(time * 0.72 + phase) * 0.018 * Math.sin(angle);
    strand.rotation.z = Math.sin(time * 0.83 + phase) * 0.021 * Math.cos(angle);
  }

  domeMaterial.emissiveIntensity = 1.08 + Math.sin(time * 1.25) * 0.1;
  rimMaterial.emissiveIntensity = 3.75 + Math.sin(time * 1.45) * 0.5;
  haloMaterial.opacity = 0.43 + Math.sin(time * 1.15) * 0.035;
  aquaLight.intensity = 40 + Math.sin(time * 1.25) * 3.5;
  lantern.rotation.y = Math.sin(time * 0.23) * 0.035;

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

animate();
</script>
</body>
</html>
