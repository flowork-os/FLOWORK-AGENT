<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Dump Truck</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #9b9a91;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
    }
    #hint {
      position: fixed;
      left: 18px;
      bottom: 18px;
      padding: 9px 13px;
      color: #f5f1df;
      background: rgba(22, 24, 22, 0.72);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 5px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      user-select: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hint">Drag to orbit · Scroll to zoom · Space to raise bed</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x9a9a90);
    scene.fog = new THREE.Fog(0x9a9a90, 18, 42);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(-8.8, 5.5, 8.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.target.set(0.3, 1.25, 0);

    const yellow = new THREE.MeshStandardMaterial({
      color: 0xd69b12,
      roughness: 0.72,
      metalness: 0.12
    });
    const yellowDark = new THREE.MeshStandardMaterial({
      color: 0x9e6d08,
      roughness: 0.8,
      metalness: 0.18
    });
    const steel = new THREE.MeshStandardMaterial({
      color: 0x363936,
      roughness: 0.8,
      metalness: 0.72
    });
    const darkSteel = new THREE.MeshStandardMaterial({
      color: 0x1d211f,
      roughness: 0.92,
      metalness: 0.35
    });
    const rubber = new THREE.MeshStandardMaterial({
      color: 0x151716,
      roughness: 0.96,
      metalness: 0.02
    });
    const glass = new THREE.MeshStandardMaterial({
      color: 0x172b30,
      roughness: 0.22,
      metalness: 0.18
    });
    const chrome = new THREE.MeshStandardMaterial({
      color: 0x9da39b,
      roughness: 0.28,
      metalness: 0.9
    });
    const lightMaterial = new THREE.MeshStandardMaterial({
      color: 0xffd98a,
      emissive: 0xff8c1a,
      emissiveIntensity: 1.2,
      roughness: 0.3
    });
    const redLightMaterial = new THREE.MeshStandardMaterial({
      color: 0x9d1d13,
      emissive: 0x4b0803,
      emissiveIntensity: 0.7,
      roughness: 0.35
    });

    function box(width, height, depth, material, x, y, z, parent = scene) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function cylinder(radius, height, material, x, y, z, rotationX = 0, parent = scene, segments = 24) {
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, segments), material);
      mesh.position.set(x, y, z);
      mesh.rotation.x = rotationX;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function cylinderBetween(a, b, radius, material, parent = scene) {
      const direction = new THREE.Vector3().subVectors(b, a);
      const length = direction.length();
      const midpoint = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, 16), material);
      mesh.position.copy(midpoint);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    const hemi = new THREE.HemisphereLight(0xdde2d1, 0x4a4033, 2.0);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffe6b0, 4.0);
    sun.position.set(-8, 13, 7);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -12;
    sun.shadow.camera.right = 12;
    sun.shadow.camera.top = 12;
    sun.shadow.camera.bottom = -8;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 35;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x9cb8c7, 1.0);
    fill.position.set(8, 6, -10);
    scene.add(fill);

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x655f52,
      roughness: 1
    });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.04;
    ground.receiveShadow = true;
    scene.add(ground);

    const chassis = new THREE.Group();
    scene.add(chassis);

    box(7.0, 0.34, 1.72, darkSteel, 0.1, 0.88, 0, chassis);
    box(6.4, 0.22, 2.04, steel, 0.1, 1.1, 0, chassis);
    box(0.55, 0.5, 2.22, steel, -3.3, 0.72, 0, chassis);
    box(0.42, 0.42, 2.15, steel, 3.45, 0.76, 0, chassis);

    for (const xPosition of [-2.45, -0.75, 1.0, 2.6]) {
      box(0.16, 0.72, 2.16, steel, xPosition, 0.72, 0, chassis);
    }

    const cab = new THREE.Group();
    scene.add(cab);

    box(2.32, 1.25, 1.96, yellow, -2.18, 1.72, 0, cab);
    box(2.0, 1.52, 1.82, yellow, -2.02, 2.88, 0, cab);
    box(1.88, 0.18, 1.96, yellowDark, -2.03, 3.68, 0, cab);
    box(0.34, 0.78, 2.12, yellowDark, -3.29, 1.57, 0, cab);
    box(0.23, 0.25, 2.22, steel, -3.51, 1.12, 0, cab);
    box(0.22, 0.3, 2.24, yellowDark, -3.47, 1.42, 0, cab);

    box(0.07, 0.78, 1.43, glass, -3.035, 2.95, 0, cab);
    box(0.82, 0.72, 0.045, glass, -2.1, 3.0, 0.916, cab);
    box(0.82, 0.72, 0.045, glass, -2.1, 3.0, -0.916, cab);

    box(0.06, 0.82, 0.08, yellowDark, -2.52, 2.94, 0.94, cab);
    box(0.06, 0.82, 0.08, yellowDark, -2.52, 2.94, -0.94, cab);
    box(0.9, 0.08, 0.08, yellowDark, -2.1, 2.55, 0.95, cab);
    box(0.9, 0.08, 0.08, yellowDark, -2.1, 2.55, -0.95, cab);

    box(0.09, 0.42, 0.08, darkSteel, -1.66, 2.14, 0.99, cab);
    box(0.09, 0.42, 0.08, darkSteel, -1.66, 2.14, -0.99, cab);
    box(0.36, 0.08, 0.06, darkSteel, -1.67, 2.28, 1.02, cab);
    box(0.36, 0.08, 0.06, darkSteel, -1.67, 2.28, -1.02, cab);

    box(0.16, 0.14, 0.52, lightMaterial, -3.64, 1.56, 0.67, cab);
    box(0.16, 0.14, 0.52, lightMaterial, -3.64, 1.56, -0.67, cab);
    box(0.1, 0.18, 0.38, redLightMaterial, -1.1, 1.52, 1.02, cab);
    box(0.1, 0.18, 0.38, redLightMaterial, -1.1, 1.52, -1.02, cab);

    cylinder(0.075, 0.48, darkSteel, -2.15, 3.96, 0.82, Math.PI / 2, cab, 16);
    cylinder(0.075, 0.48, darkSteel, -2.15, 3.96, -0.82, Math.PI / 2, cab, 16);
    box(0.08, 0.54, 0.06, glass, -2.15, 4.18, 0.82, cab);
    box(0.08, 0.54, 0.06, glass, -2.15, 4.18, -0.82, cab);

    const wheelPositions = [
      { x: -2.35, y: 0.72, rear: false },
      { x: 2.38, y: 0.78, rear: true }
    ];

    function addWheel(x, y, z, parent = scene) {
      const wheelGroup = new THREE.Group();
      wheelGroup.position.set(x, y, z);
      parent.add(wheelGroup);

      const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.72, 0.38, 32), rubber);
      tire.rotation.x = Math.PI / 2;
      tire.castShadow = true;
      tire.receiveShadow = true;
      wheelGroup.add(tire);

      const sidewall = new THREE.Mesh(new THREE.CylinderGeometry(0.47, 0.47, 0.405, 24), darkSteel);
      sidewall.rotation.x = Math.PI / 2;
      sidewall.castShadow = true;
      wheelGroup.add(sidewall);

      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.43, 20), chrome);
      hub.rotation.x = Math.PI / 2;
      hub.castShadow = true;
      wheelGroup.add(hub);

      const hubCap = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.46, 16), steel);
      hubCap.rotation.x = Math.PI / 2;
      wheelGroup.add(hubCap);

      for (let treadIndex = 0; treadIndex < 14; treadIndex++) {
        const angle = (treadIndex / 14) * Math.PI * 2;
        const tread = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.12, 0.43), rubber);
        tread.position.set(Math.cos(angle) * 0.67, Math.sin(angle) * 0.67, 0);
        tread.rotation.z = angle;
        tread.castShadow = true;
        wheelGroup.add(tread);
      }
    }

    for (const wheel of wheelPositions) {
      addWheel(wheel.x, wheel.y, 1.01);
      if (wheel.rear) {
        addWheel(wheel.x, wheel.y, 1.43);
        addWheel(wheel.x, wheel.y, -1.43);
      }
      addWheel(wheel.x, wheel.y, -1.01);
    }

    const bedPivot = new THREE.Group();
    bedPivot.position.set(0.55, 1.38, 0);
    bedPivot.rotation.z = 0.27;
    scene.add(bedPivot);

    box(4.75, 0.22, 2.18, steel, 2.38, 0.2, 0, bedPivot);
    box(4.72, 0.17, 0.1, yellowDark, 2.38, 0.34, 1.06, bedPivot);
    box(4.72, 0.17, 0.1, yellowDark, 2.38, 0.34, -1.06, bedPivot);

    box(4.65, 1.28, 0.12, yellow, 2.38, 0.92, 1.02, bedPivot);
    box(4.65, 1.28, 0.12, yellow, 2.38, 0.92, -1.02, bedPivot);
    box(0.13, 1.32, 2.12, yellow, 0.08, 0.9, 0, bedPivot);
    box(0.14, 1.26, 2.12, yellow, 4.7, 0.88, 0, bedPivot);

    for (const xPosition of [0.58, 1.62, 2.66, 3.7, 4.35]) {
      box(0.11, 1.35, 0.15, yellowDark, xPosition, 0.92, 1.01, bedPivot);
      box(0.11, 1.35, 0.15, yellowDark, xPosition, 0.92, -1.01, bedPivot);
    }

    for (const xPosition of [1.15, 2.25, 3.35, 4.25]) {
      box(0.08, 1.04, 2.16, yellowDark, xPosition, 0.86, 0, bedPivot);
    }

    box(0.18, 0.15, 2.34, steel, 2.38, 0.03, 0, bedPivot);
    box(0.16, 0.15, 2.28, steel, 4.73, 0.16, 0, bedPivot);

    const hingeLeft = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 2.35, 20), steel);
    hingeLeft.rotation.x = Math.PI / 2;
    hingeLeft.position.set(0, 0.05, 0);
    hingeLeft.castShadow = true;
    bedPivot.add(hingeLeft);

    const hydraulic = new THREE.Group();
    scene.add(hydraulic);
    const hydraulicBase = new THREE.Vector3(0.0, 1.13, 0.58);
    const hydraulicTop = new THREE.Vector3(1.38, 2.2, 0.58);
    cylinderBetween(hydraulicBase, hydraulicTop, 0.13, darkSteel, hydraulic);
    cylinderBetween(new THREE.Vector3(0.02, 1.14, 0.58), new THREE.Vector3(1.15, 2.03, 0.58), 0.075, chrome, hydraulic);
    cylinderBetween(new THREE.Vector3(0.0, 1.13, -0.58), new THREE.Vector3(1.38, 2.2, -0.58), 0.13, darkSteel, hydraulic);
    cylinderBetween(new THREE.Vector3(0.02, 1.14, -0.58), new THREE.Vector3(1.15, 2.03, -0.58), 0.075, chrome, hydraulic);

    box(0.22, 0.32, 2.32, yellowDark, 3.65, 1.35, 0, chassis);
    box(0.18, 0.2, 2.45, steel, 3.8, 1.02, 0, chassis);
    box(0.28, 0.3, 0.18, redLightMaterial, 3.88, 1.42, 0.9, chassis);
    box(0.28, 0.3, 0.18, redLightMaterial, 3.88, 1.42, -0.9, chassis);

    const exhaust = new THREE.Group();
    scene.add(exhaust);
    cylinder(0.105, 1.8, darkSteel, 0.05, 2.05, -0.88, 0, exhaust);
    cylinder(0.15, 0.22, steel, 0.05, 2.95, -0.88, 0, exhaust);
    cylinder(0.105, 0.44, darkSteel, 0.05, 3.22, -0.88, 0, exhaust);

    const steps = new THREE.Group();
    scene.add(steps);
    box(0.72, 0.14, 0.8, steel, -2.65, 0.84, 1.13, steps);
    box(0.55, 0.14, 0.72, steel, -2.78, 1.17, 1.13, steps);
    box(0.72, 0.14, 0.8, steel, -2.65, 0.84, -1.13, steps);
    box(0.55, 0.14, 0.72, steel, -2.78, 1.17, -1.13, steps);

    const rockMaterial = new THREE.MeshStandardMaterial({
      color: 0x777062,
      roughness: 1
    });
    const rockGeometry = new THREE.DodecahedronGeometry(0.16, 0);
    for (let rockIndex = 0; rockIndex < 110; rockIndex++) {
      const angle = rockIndex * 2.39996;
      const distance = 3.8 + ((rockIndex * 37) % 100) / 100 * 13;
      const rock = new THREE.Mesh(rockGeometry, rockMaterial);
      rock.position.set(
        Math.cos(angle) * distance,
        0.08 + ((rockIndex * 17) % 13) / 100,
        Math.sin(angle) * distance
      );
      const scaleValue = 0.35 + ((rockIndex * 19) % 80) / 100;
      rock.scale.set(scaleValue, 0.45 + scaleValue * 0.55, scaleValue * 0.8);
      rock.rotation.set(
        rockIndex * 0.73,
        rockIndex * 1.17,
        rockIndex * 0.41
      );
      rock.castShadow = true;
      rock.receiveShadow = true;
      scene.add(rock);
    }

    for (let lineIndex = 0; lineIndex < 18; lineIndex++) {
      const line = new THREE.Mesh(
        new THREE.BoxGeometry(0.025, 0.012, 22),
        new THREE.MeshStandardMaterial({ color: 0x514b40, roughness: 1 })
      );
      line.position.set(-9 + lineIndex * 1.05, 0.005, 2.5);
      line.rotation.y = (lineIndex % 3 - 1) * 0.12;
      line.receiveShadow = true;
      scene.add(line);
    }

    let bedTarget = 0.27;
    window.addEventListener("keydown", (event) => {
      if (event.code === "Space") {
        event.preventDefault();
        bedTarget = bedTarget > 0.3 ? 0.03 : 0.72;
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      bedPivot.rotation.z = THREE.MathUtils.lerp(bedPivot.rotation.z, bedTarget, 0.035);
      hydraulic.rotation.y = Math.sin(elapsed * 0.35) * 0.002;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
