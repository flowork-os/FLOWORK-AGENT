<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astronaut Helmet</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #070a0f;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 24px;
      bottom: 20px;
      color: rgba(220, 230, 240, 0.65);
      font: 10px/1.5 Arial, sans-serif;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Extravehicular Helmet · Series 07</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070a0f);
    scene.fog = new THREE.FogExp2(0x070a0f, 0.026);

    const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(7.2, 4.8, 9.6);
    camera.lookAt(0, 3.1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const pmrem = new THREE.PMREMGenerator(renderer);
    const roomEnvironment = new RoomEnvironment(renderer);
    scene.environment = pmrem.fromScene(roomEnvironment, 0.04).texture;
    roomEnvironment.dispose();
    pmrem.dispose();

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 3.05, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.minDistance = 7;
    controls.maxDistance = 17;
    controls.minPolarAngle = 0.55;
    controls.maxPolarAngle = 1.72;

    const hemi = new THREE.HemisphereLight(0xbfd9ff, 0x15100c, 1.35);
    scene.add(hemi);

    const key = new THREE.SpotLight(0xffffff, 125, 25, Math.PI / 5, 0.52, 1.5);
    key.position.set(5.5, 10, 7);
    key.target.position.set(0, 3, 0);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.bias = -0.00012;
    scene.add(key, key.target);

    const coolRim = new THREE.SpotLight(0x8bbcff, 85, 22, Math.PI / 4, 0.65, 1.4);
    coolRim.position.set(-7, 6, -4);
    coolRim.target.position.set(0, 3.5, 0);
    scene.add(coolRim, coolRim.target);

    const warmFill = new THREE.PointLight(0xffc16b, 32, 12, 2);
    warmFill.position.set(4, 2.7, -3.5);
    scene.add(warmFill);

    const materials = {
      shell: new THREE.MeshPhysicalMaterial({
        color: 0xe9edf0,
        roughness: 0.29,
        metalness: 0.04,
        clearcoat: 0.38,
        clearcoatRoughness: 0.24,
        envMapIntensity: 1.05
      }),
      shellSecondary: new THREE.MeshPhysicalMaterial({
        color: 0xcbd1d5,
        roughness: 0.38,
        metalness: 0.12,
        clearcoat: 0.22
      }),
      dark: new THREE.MeshStandardMaterial({
        color: 0x11161b,
        roughness: 0.31,
        metalness: 0.68
      }),
      blackRubber: new THREE.MeshStandardMaterial({
        color: 0x050606,
        roughness: 0.78,
        metalness: 0.03
      }),
      metal: new THREE.MeshStandardMaterial({
        color: 0x78838b,
        roughness: 0.2,
        metalness: 0.92,
        envMapIntensity: 1.4
      }),
      brushed: new THREE.MeshStandardMaterial({
        color: 0xadb4b7,
        roughness: 0.34,
        metalness: 0.85
      }),
      bronze: new THREE.MeshStandardMaterial({
        color: 0x6d4a19,
        roughness: 0.18,
        metalness: 0.92,
        envMapIntensity: 1.7
      }),
      visor: new THREE.MeshPhysicalMaterial({
        color: 0xc07a14,
        roughness: 0.095,
        metalness: 0.74,
        clearcoat: 1,
        clearcoatRoughness: 0.045,
        reflectivity: 1,
        envMapIntensity: 2.5,
        transparent: true,
        opacity: 0.92,
        side: THREE.DoubleSide
      }),
      red: new THREE.MeshStandardMaterial({
        color: 0x9d1714,
        roughness: 0.34,
        metalness: 0.48
      }),
      lens: new THREE.MeshPhysicalMaterial({
        color: 0xdff7ff,
        emissive: 0xb7eaff,
        emissiveIntensity: 2.8,
        roughness: 0.08,
        metalness: 0.05,
        transmission: 0.22,
        thickness: 0.08
      })
    };

    const helmet = new THREE.Group();
    helmet.rotation.y = -0.12;
    scene.add(helmet);

    function mesh(geometry, material, parent = helmet) {
      const result = new THREE.Mesh(geometry, material);
      result.castShadow = true;
      result.receiveShadow = true;
      parent.add(result);
      return result;
    }

    function roundedRectShape(width, height, radius) {
      const x = -width / 2;
      const y = -height / 2;
      const shape = new THREE.Shape();
      shape.moveTo(x + radius, y);
      shape.lineTo(x + width - radius, y);
      shape.quadraticCurveTo(x + width, y, x + width, y + radius);
      shape.lineTo(x + width, y + height - radius);
      shape.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      shape.lineTo(x + radius, y + height);
      shape.quadraticCurveTo(x, y + height, x, y + height - radius);
      shape.lineTo(x, y + radius);
      shape.quadraticCurveTo(x, y, x + radius, y);
      return shape;
    }

    function roundedPanel(width, height, depth, radius, material) {
      const geometry = new THREE.ExtrudeGeometry(
        roundedRectShape(width, height, radius),
        {
          depth,
          bevelEnabled: true,
          bevelSegments: 3,
          steps: 1,
          bevelSize: Math.min(0.07, radius * 0.35),
          bevelThickness: Math.min(0.06, depth * 0.22),
          curveSegments: 8
        }
      );
      geometry.translate(0, 0, -depth / 2);
      geometry.computeVertexNormals();
      return mesh(geometry, material);
    }

    function cylinderBetween(a, b, radius, material, radialSegments = 12) {
      const delta = new THREE.Vector3().subVectors(b, a);
      const length = delta.length();
      const result = mesh(
        new THREE.CylinderGeometry(radius, radius, length, radialSegments, 1, false),
        material
      );
      result.position.copy(a).add(b).multiplyScalar(0.5);
      result.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        delta.normalize()
      );
      return result;
    }

    function ellipsoidPoint(radius, phi, theta, scale, center) {
      return new THREE.Vector3(
        -radius * Math.cos(phi) * Math.sin(theta) * scale.x,
        radius * Math.cos(theta) * scale.y,
        radius * Math.sin(phi) * Math.sin(theta) * scale.z
      ).add(center);
    }

    function tubeFromPoints(points, radius, material, closed = false) {
      const curve = new THREE.CatmullRomCurve3(points, closed, 'centripetal');
      return mesh(
        new THREE.TubeGeometry(curve, Math.max(24, points.length * 4), radius, 8, closed),
        material
      );
    }

    const shellCenter = new THREE.Vector3(0, 3.65, 0);
    const shellScale = new THREE.Vector3(1.08, 1.12, 0.98);

    const dome = mesh(
      new THREE.SphereGeometry(2.05, 96, 64),
      materials.shell
    );
    dome.position.copy(shellCenter);
    dome.scale.copy(shellScale);

    const rearCrown = mesh(
      new THREE.SphereGeometry(1.91, 64, 48, 3.83, 1.88, 0.22, 2.58),
      materials.shellSecondary
    );
    rearCrown.position.copy(shellCenter).add(new THREE.Vector3(0, 0.03, -0.08));
    rearCrown.scale.set(1.105, 1.13, 1.015);

    const opening = mesh(
      new THREE.SphereGeometry(2.072, 72, 48, 0.44, 2.26, 0.43, 1.77),
      materials.blackRubber
    );
    opening.position.copy(shellCenter);
    opening.scale.set(1.09, 1.105, 1.0);

    const visor = mesh(
      new THREE.SphereGeometry(2.115, 96, 64, 0.49, 2.16, 0.47, 1.68),
      materials.visor
    );
    visor.position.copy(shellCenter);
    visor.scale.set(1.085, 1.105, 1.015);
    visor.renderOrder = 3;

    const visorScale = new THREE.Vector3(1.085, 1.105, 1.015);
    const visorCenter = shellCenter;
    const phiMin = 0.49;
    const phiMax = 2.65;
    const thetaTop = 0.47;
    const thetaBottom = 2.15;

    const topRimPoints = [];
    const bottomRimPoints = [];
    const leftRimPoints = [];
    const rightRimPoints = [];

    for (let i = 0; i <= 24; i++) {
      const t = i / 24;
      const phi = THREE.MathUtils.lerp(phiMin, phiMax, t);
      topRimPoints.push(ellipsoidPoint(2.127, phi, thetaTop, visorScale, visorCenter));
      bottomRimPoints.push(ellipsoidPoint(2.127, phi, thetaBottom, visorScale, visorCenter));
      const theta = THREE.MathUtils.lerp(thetaTop, thetaBottom, t);
      leftRimPoints.push(ellipsoidPoint(2.127, phiMin, theta, visorScale, visorCenter));
      rightRimPoints.push(ellipsoidPoint(2.127, phiMax, theta, visorScale, visorCenter));
    }

    tubeFromPoints(topRimPoints, 0.047, materials.bronze);
    tubeFromPoints(bottomRimPoints, 0.055, materials.dark);
    tubeFromPoints(leftRimPoints, 0.049, materials.bronze);
    tubeFromPoints(rightRimPoints, 0.049, materials.bronze);

    const rivetGeometry = new THREE.SphereGeometry(0.052, 14, 10);
    const rivetSamples = [
      [phiMin, 0.66], [phiMin, 1.02], [phiMin, 1.42], [phiMin, 1.82],
      [phiMax, 0.66], [phiMax, 1.02], [phiMax, 1.42], [phiMax, 1.82],
      [0.83, thetaTop], [1.18, thetaTop], [1.57, thetaTop], [1.96, thetaTop], [2.31, thetaTop]
    ];
    for (const [phi, theta] of rivetSamples) {
      const rivet = mesh(rivetGeometry, materials.brushed);
      rivet.position.copy(ellipsoidPoint(2.16, phi, theta, visorScale, visorCenter));
    }

    const crownSeamPoints = [];
    for (let i = 0; i <= 36; i++) {
      const phi = THREE.MathUtils.lerp(2.72, 4.70, i / 36);
      crownSeamPoints.push(
        ellipsoidPoint(
          2.065,
          phi,
          0.76,
          new THREE.Vector3(1.083, 1.125, 0.99),
          shellCenter
        )
      );
    }
    tubeFromPoints(crownSeamPoints, 0.018, materials.dark);

    const sideSeamPoints = [];
    for (let i = 0; i <= 30; i++) {
      const theta = THREE.MathUtils.lerp(0.78, 2.28, i / 30);
      sideSeamPoints.push(
        ellipsoidPoint(
          2.065,
          3.45,
          theta,
          new THREE.Vector3(1.083, 1.125, 0.99),
          shellCenter
        )
      );
    }
    tubeFromPoints(sideSeamPoints, 0.017, materials.dark);

    const brow = roundedPanel(2.26, 0.25, 0.18, 0.1, materials.shellSecondary);
    brow.position.set(0, 5.47, 1.17);
    brow.rotation.x = -0.32;

    for (const x of [-0.76, -0.38, 0, 0.38, 0.76]) {
      const vent = mesh(
        new THREE.BoxGeometry(0.18, 0.055, 0.16),
        materials.dark
      );
      vent.position.set(x, 5.5, 1.31);
      vent.rotation.x = -0.32;
    }

    const lowerJaw = roundedPanel(2.48, 0.46, 0.34, 0.15, materials.shell);
    lowerJaw.position.set(0, 1.95, 1.1);
    lowerJaw.rotation.x = 0.08;

    const chinInsert = roundedPanel(1.16, 0.19, 0.39, 0.075, materials.dark);
    chinInsert.position.set(0, 2.01, 1.3);

    for (let i = -2; i <= 2; i++) {
      const slot = mesh(
        new THREE.BoxGeometry(0.11, 0.055, 0.035),
        materials.metal
      );
      slot.position.set(i * 0.2, 2.02, 1.515);
    }

    const neckOuter = mesh(
      new THREE.CylinderGeometry(1.48, 1.55, 0.5, 64, 2),
      materials.metal
    );
    neckOuter.position.set(0, 1.68, 0);

    const neckDark = mesh(
      new THREE.CylinderGeometry(1.32, 1.36, 0.54, 64, 2),
      materials.blackRubber
    );
    neckDark.position.set(0, 1.7, 0);

    const neckTop = mesh(
      new THREE.TorusGeometry(1.43, 0.13, 16, 64),
      materials.brushed
    );
    neckTop.position.set(0, 1.92, 0);
    neckTop.rotation.x = Math.PI / 2;

    const neckLower = mesh(
      new THREE.TorusGeometry(1.52, 0.1, 14, 64),
      materials.dark
    );
    neckLower.position.set(0, 1.45, 0);
    neckLower.rotation.x = Math.PI / 2;

    for (let i = 0; i < 24; i++) {
      const angle = (i / 24) * Math.PI * 2;
      const tooth = mesh(
        new THREE.BoxGeometry(0.09, 0.15, 0.17),
        i % 2 === 0 ? materials.brushed : materials.metal
      );
      tooth.position.set(Math.cos(angle) * 1.51, 1.68, Math.sin(angle) * 1.51);
      tooth.rotation.y = -angle;
    }

    const leftHousing = roundedPanel(0.83, 1.25, 0.38, 0.18, materials.shellSecondary);
    leftHousing.position.set(-2.12, 3.36, 0.04);
    leftHousing.rotation.y = Math.PI / 2;

    const leftHousingInset = roundedPanel(0.55, 0.83, 0.41, 0.12, materials.dark);
    leftHousingInset.position.set(-2.34, 3.37, 0.04);
    leftHousingInset.rotation.y = Math.PI / 2;

    const dial = mesh(
      new THREE.CylinderGeometry(0.22, 0.22, 0.16, 24),
      materials.metal
    );
    dial.position.set(-2.59, 3.58, 0.04);
    dial.rotation.z = Math.PI / 2;

    const dialCap = mesh(
      new THREE.CylinderGeometry(0.13, 0.13, 0.17, 16),
      materials.red
    );
    dialCap.position.set(-2.69, 3.58, 0.04);
    dialCap.rotation.z = Math.PI / 2;

    const rightHousing = roundedPanel(0.84, 1.12, 0.42, 0.17, materials.shellSecondary);
    rightHousing.position.set(2.12, 3.48, -0.02);
    rightHousing.rotation.y = -Math.PI / 2;

    const lampPanel = roundedPanel(0.53, 0.74, 0.46, 0.11, materials.dark);
    lampPanel.position.set(2.36, 3.5, 0.02);
    lampPanel.rotation.y = -Math.PI / 2;

    for (const y of [3.27, 3.72]) {
      const lampCup = mesh(
        new THREE.CylinderGeometry(0.16, 0.19, 0.16, 24),
        materials.metal
      );
      lampCup.position.set(2.66, y, 0.02);
      lampCup.rotation.z = Math.PI / 2;

      const lampLens = mesh(
        new THREE.CylinderGeometry(0.125, 0.125, 0.025, 24),
        materials.lens
      );
      lampLens.position.set(2.755, y, 0.02);
      lampLens.rotation.z = Math.PI / 2;
    }

    const antennaBase = mesh(
      new THREE.CylinderGeometry(0.19, 0.24, 0.36, 24),
      materials.dark
    );
    antennaBase.position.set(-2.18, 4.25, -0.2);
    antennaBase.rotation.z = -0.23;

    const antennaStart = new THREE.Vector3(-2.23, 4.43, -0.2);
    const antennaEnd = new THREE.Vector3(-2.62, 6.22, -0.32);
    cylinderBetween(antennaStart, antennaEnd, 0.046, materials.metal, 12);

    const antennaTip = mesh(
      new THREE.CylinderGeometry(0.075, 0.055, 0.28, 16),
      materials.dark
    );
    antennaTip.position.copy(antennaEnd);
    antennaTip.quaternion.setFromUnitVectors(
      new THREE.Vector3(0, 1, 0),
      new THREE.Vector3().subVectors(antennaEnd, antennaStart).normalize()
    );

    const smallTip = mesh(
      new THREE.SphereGeometry(0.08, 16, 12),
      materials.red
    );
    smallTip.position.copy(antennaEnd).add(
      new THREE.Vector3().subVectors(antennaEnd, antennaStart).normalize().multiplyScalar(0.15)
    );

    const rearPack = roundedPanel(1.28, 1.42, 0.4, 0.2, materials.shellSecondary);
    rearPack.position.set(0, 3.3, -1.91);
    rearPack.rotation.y = Math.PI;

    const rearInset = roundedPanel(0.72, 0.66, 0.43, 0.13, materials.dark);
    rearInset.position.set(0, 3.45, -2.15);
    rearInset.rotation.y = Math.PI;

    for (let i = 0; i < 4; i++) {
      const rearVent = mesh(
        new THREE.BoxGeometry(0.46, 0.055, 0.05),
        materials.metal
      );
      rearVent.position.set(0, 3.22 + i * 0.15, -2.39);
    }

    const sideBadge = roundedPanel(0.5, 0.22, 0.04, 0.07, materials.dark);
    sideBadge.position.set(1.97, 4.45, 0.48);
    sideBadge.rotation.y = -1.21;
    sideBadge.rotation.z = 0.08;

    const badgeMark = mesh(
      new THREE.BoxGeometry(0.25, 0.045, 0.02),
      materials.red
    );
    badgeMark.position.set(2.018, 4.46, 0.506);
    badgeMark.rotation.y = -1.21;
    badgeMark.rotation.z = 0.08;

    const supportColumn = mesh(
      new THREE.CylinderGeometry(0.58, 0.72, 1.03, 48),
      materials.dark
    );
    supportColumn.position.set(0, 0.89, 0);

    const supportCollar = mesh(
      new THREE.TorusGeometry(0.69, 0.075, 14, 48),
      materials.metal
    );
    supportCollar.position.set(0, 1.37, 0);
    supportCollar.rotation.x = Math.PI / 2;

    const standBase = mesh(
      new THREE.CylinderGeometry(1.38, 1.62, 0.28, 64, 2),
      materials.dark
    );
    standBase.position.set(0, 0.29, 0);

    const standTop = mesh(
      new THREE.CylinderGeometry(1.34, 1.34, 0.08, 64),
      materials.brushed
    );
    standTop.position.set(0, 0.47, 0);

    const baseGroove = mesh(
      new THREE.TorusGeometry(1.46, 0.035, 10, 64),
      materials.metal
    );
    baseGroove.position.set(0, 0.23, 0);
    baseGroove.rotation.x = Math.PI / 2;

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(18, 96),
      new THREE.MeshStandardMaterial({
        color: 0x0a0e13,
        roughness: 0.82,
        metalness: 0.12
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0.12;
    floor.receiveShadow = true;
    scene.add(floor);

    const floorRing = new THREE.Mesh(
      new THREE.RingGeometry(2.35, 2.39, 96),
      new THREE.MeshBasicMaterial({
        color: 0x37546a,
        transparent: true,
        opacity: 0.34,
        side: THREE.DoubleSide
      })
    );
    floorRing.rotation.x = -Math.PI / 2;
    floorRing.position.y = 0.125;
    scene.add(floorRing);

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      materials.lens.emissiveIntensity = 2.65 + Math.sin(elapsed * 1.7) * 0.16;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
