<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low Dune Field</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #d8b982; }
    canvas { display: block; }
    .caption {
      position: fixed;
      left: 22px;
      bottom: 18px;
      color: rgba(75, 52, 31, 0.62);
      font: 500 11px/1.4 system-ui, sans-serif;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="caption">Low dune field · drag to orbit</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xd9bd8c, 0.018);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 180);
    camera.position.set(20, 12.5, 25);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.1, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.22;
    controls.minDistance = 10;
    controls.maxDistance = 58;
    controls.minPolarAngle = 0.35;
    controls.maxPolarAngle = Math.PI * 0.475;

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(110, 32, 16),
      new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          topColor: { value: new THREE.Color(0x7fa8bd) },
          horizonColor: { value: new THREE.Color(0xf1c98e) },
          lowColor: { value: new THREE.Color(0xc89059) }
        },
        vertexShader: `
          varying vec3 vPosition;
          void main() {
            vPosition = position;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vPosition;
          uniform vec3 topColor;
          uniform vec3 horizonColor;
          uniform vec3 lowColor;
          void main() {
            float h = normalize(vPosition).y;
            vec3 color = h > 0.0
              ? mix(horizonColor, topColor, smoothstep(0.0, 0.75, h))
              : mix(lowColor, horizonColor, smoothstep(-0.28, 0.0, h));
            gl_FragColor = vec4(color, 1.0);
          }
        `
      })
    );
    scene.add(sky);

    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(1.75, 24, 16),
      new THREE.MeshBasicMaterial({ color: 0xffe2a3, fog: false })
    );
    sun.position.set(-32, 19, -58);
    scene.add(sun);

    const sunGlow = new THREE.Mesh(
      new THREE.SphereGeometry(2.8, 24, 16),
      new THREE.MeshBasicMaterial({
        color: 0xffd38a,
        transparent: true,
        opacity: 0.13,
        depthWrite: false,
        fog: false
      })
    );
    sunGlow.position.copy(sun.position);
    scene.add(sunGlow);

    scene.add(new THREE.HemisphereLight(0xaec8d0, 0x9b6339, 1.55));

    const sunlight = new THREE.DirectionalLight(0xffd7a0, 3.2);
    sunlight.position.set(-24, 31, 15);
    sunlight.castShadow = true;
    sunlight.shadow.mapSize.set(2048, 2048);
    sunlight.shadow.camera.left = -38;
    sunlight.shadow.camera.right = 38;
    sunlight.shadow.camera.top = 32;
    sunlight.shadow.camera.bottom = -32;
    sunlight.shadow.camera.near = 1;
    sunlight.shadow.camera.far = 90;
    sunlight.shadow.bias = -0.00025;
    sunlight.shadow.normalBias = 0.04;
    scene.add(sunlight);

    function duneHeight(x, z) {
      const bentX = x + Math.sin(z * 0.085) * 2.2;
      const ridge = Math.pow(0.5 + 0.5 * Math.sin(bentX * 0.145 + z * 0.032), 1.7);
      const crossing = Math.sin(z * 0.155 - x * 0.046 + 0.7) * 0.27;
      const broad = Math.sin(x * 0.055 + z * 0.092 - 0.5) * 0.22;
      const rippleMask = 0.65 + ridge * 0.35;
      const ripples =
        Math.sin(x * 2.55 + z * 0.18 + Math.sin(z * 0.34) * 0.38) *
        0.042 * rippleMask;
      return ridge * 1.22 + crossing + broad + ripples - 0.45;
    }

    const terrainWidth = 72;
    const terrainDepth = 58;
    const segmentsX = 216;
    const segmentsZ = 174;
    const positions = [];
    const colors = [];
    const indices = [];
    const sandLow = new THREE.Color(0xb9824c);
    const sandMid = new THREE.Color(0xd7a968);
    const sandHigh = new THREE.Color(0xe4bf7f);
    const tempColor = new THREE.Color();

    for (let iz = 0; iz <= segmentsZ; iz++) {
      const z = (iz / segmentsZ - 0.5) * terrainDepth;
      for (let ix = 0; ix <= segmentsX; ix++) {
        const x = (ix / segmentsX - 0.5) * terrainWidth;
        const y = duneHeight(x, z);
        positions.push(x, y, z);

        const normalizedHeight = THREE.MathUtils.clamp((y + 0.65) / 2.25, 0, 1);
        if (normalizedHeight < 0.55) {
          tempColor.copy(sandLow).lerp(sandMid, normalizedHeight / 0.55);
        } else {
          tempColor.copy(sandMid).lerp(sandHigh, (normalizedHeight - 0.55) / 0.45);
        }
        const rippleShade = Math.sin(x * 2.55 + z * 0.18 + Math.sin(z * 0.34) * 0.38) * 0.018;
        tempColor.offsetHSL(0, 0, rippleShade);
        colors.push(tempColor.r, tempColor.g, tempColor.b);
      }
    }

    for (let iz = 0; iz < segmentsZ; iz++) {
      for (let ix = 0; ix < segmentsX; ix++) {
        const a = iz * (segmentsX + 1) + ix;
        const b = a + 1;
        const c = a + segmentsX + 1;
        const d = c + 1;
        indices.push(a, c, b, b, c, d);
      }
    }

    const terrainGeometry = new THREE.BufferGeometry();
    terrainGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    terrainGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    terrainGeometry.setIndex(indices);
    terrainGeometry.computeVertexNormals();
    terrainGeometry.computeBoundingSphere();

    const terrain = new THREE.Mesh(
      terrainGeometry,
      new THREE.MeshStandardMaterial({
        vertexColors: true,
        roughness: 0.96,
        metalness: 0
      })
    );
    terrain.receiveShadow = true;
    scene.add(terrain);

    const underSand = new THREE.Mesh(
      new THREE.CylinderGeometry(47, 50, 1.8, 64),
      new THREE.MeshStandardMaterial({ color: 0xb7814e, roughness: 1 })
    );
    underSand.position.y = -1.35;
    underSand.receiveShadow = true;
    scene.add(underSand);

    const fenceGroup = new THREE.Group();
    scene.add(fenceGroup);

    const postMaterial = new THREE.MeshStandardMaterial({
      color: 0x5b4634,
      roughness: 0.93,
      metalness: 0
    });
    const wireMaterial = new THREE.MeshStandardMaterial({
      color: 0x3b3731,
      roughness: 0.72,
      metalness: 0.45
    });
    const postGeometry = new THREE.CylinderGeometry(0.048, 0.075, 1.65, 7);
    const postLocations = [];

    for (let i = 0; i < 11; i++) {
      const x = -23 + i * 4.55;
      const z = -5.8 + Math.sin(i * 0.72) * 0.45 + x * 0.018;
      const ground = duneHeight(x, z);
      const post = new THREE.Mesh(postGeometry, postMaterial);
      post.position.set(x, ground + 0.79, z);
      post.rotation.z = Math.sin(i * 1.91) * 0.035;
      post.rotation.x = Math.cos(i * 1.27) * 0.025;
      post.castShadow = true;
      post.receiveShadow = true;
      fenceGroup.add(post);
      postLocations.push(new THREE.Vector3(x, ground, z));
    }

    for (let i = 0; i < postLocations.length - 1; i++) {
      const left = postLocations[i];
      const right = postLocations[i + 1];

      for (const wireHeight of [0.59, 1.15]) {
        const points = [];
        for (let j = 0; j <= 4; j++) {
          const t = j / 4;
          const point = left.clone().lerp(right, t);
          point.y =
            THREE.MathUtils.lerp(left.y + wireHeight, right.y + wireHeight, t) -
            Math.sin(Math.PI * t) * 0.105;
          points.push(point);
        }
        const curve = new THREE.CatmullRomCurve3(points);
        const wire = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 14, 0.014, 5, false),
          wireMaterial
        );
        wire.castShadow = true;
        fenceGroup.add(wire);
      }
    }

    const boardwalk = new THREE.Group();
    scene.add(boardwalk);

    const woodMaterial = new THREE.MeshStandardMaterial({
      color: 0x8a5b35,
      roughness: 0.88,
      metalness: 0
    });
    const edgeWoodMaterial = new THREE.MeshStandardMaterial({
      color: 0x604127,
      roughness: 0.94
    });
    const nailMaterial = new THREE.MeshStandardMaterial({
      color: 0x302b27,
      roughness: 0.55,
      metalness: 0.65
    });

    const plankGeometry = new THREE.BoxGeometry(2.45, 0.12, 0.34);
    const nailGeometry = new THREE.CylinderGeometry(0.027, 0.027, 0.018, 8);
    const plankCount = 42;
    const nailMesh = new THREE.InstancedMesh(nailGeometry, nailMaterial, plankCount * 2);
    const nailMatrix = new THREE.Matrix4();
    const nailQuaternion = new THREE.Quaternion();
    const nailScale = new THREE.Vector3(1, 1, 1);
    const upAxis = new THREE.Vector3(0, 1, 0);
    let nailIndex = 0;

    function pathPoint(t) {
      return new THREE.Vector3(
        7.7 - t * 0.36 + Math.sin(t * 0.18) * 0.18,
        0,
        15.2 - t * 0.72
      );
    }

    for (let i = 0; i < plankCount; i++) {
      const t = i * 0.47;
      const point = pathPoint(t);
      const next = pathPoint(t + 0.08);
      const dx = next.x - point.x;
      const dz = next.z - point.z;
      const yaw = Math.atan2(dx, dz);
      const ground = duneHeight(point.x, point.z);
      const plank = new THREE.Mesh(plankGeometry, woodMaterial);
      plank.position.set(point.x, ground + 0.14 + Math.sin(i * 1.73) * 0.012, point.z);
      plank.rotation.y = yaw;
      plank.rotation.z = Math.sin(i * 2.17) * 0.009;
      plank.castShadow = true;
      plank.receiveShadow = true;
      boardwalk.add(plank);

      const crossX = Math.cos(yaw);
      const crossZ = -Math.sin(yaw);
      nailQuaternion.setFromAxisAngle(upAxis, yaw);

      for (const side of [-0.93, 0.93]) {
        const nailPosition = new THREE.Vector3(
          point.x + crossX * side,
          plank.position.y + 0.069,
          point.z + crossZ * side
        );
        nailMatrix.compose(nailPosition, nailQuaternion, nailScale);
        nailMesh.setMatrixAt(nailIndex++, nailMatrix);
      }

      if (i % 4 === 0) {
        const supportGeometry = new THREE.BoxGeometry(2.15, 0.16, 1.7);
        const support = new THREE.Mesh(supportGeometry, edgeWoodMaterial);
        support.position.set(point.x, ground + 0.025, point.z);
        support.rotation.y = yaw;
        support.castShadow = true;
        support.receiveShadow = true;
        boardwalk.add(support);
      }
    }

    nailMesh.castShadow = true;
    nailMesh.receiveShadow = true;
    nailMesh.instanceMatrix.needsUpdate = true;
    boardwalk.add(nailMesh);

    const grassMaterial = new THREE.MeshStandardMaterial({
      color: 0x8d7744,
      roughness: 1,
      side: THREE.DoubleSide
    });
    const bladeGeometry = new THREE.PlaneGeometry(0.035, 0.55);
    bladeGeometry.translate(0, 0.275, 0);

    const grassSpots = [
      [-17.5, -1.2], [-14.8, -3.4], [-10.2, -0.8],
      [13.5, -7.8], [18.1, -4.1], [22.2, -8.5],
      [-20.5, 8.5], [17.2, 7.3]
    ];

    for (let s = 0; s < grassSpots.length; s++) {
      const [gx, gz] = grassSpots[s];
      const tuft = new THREE.Group();
      tuft.position.set(gx, duneHeight(gx, gz), gz);
      for (let b = 0; b < 5; b++) {
        const blade = new THREE.Mesh(bladeGeometry, grassMaterial);
        blade.rotation.y = b * 1.257 + s * 0.41;
        blade.rotation.z = Math.sin(b * 2.3 + s) * 0.16;
        blade.scale.y = 0.65 + ((b * 37 + s * 11) % 10) * 0.045;
        blade.castShadow = true;
        tuft.add(blade);
      }
      scene.add(tuft);
    }

    const clock = new THREE.Clock();

    function animate() {
      const elapsed = clock.getElapsedTime();
      sunGlow.scale.setScalar(1 + Math.sin(elapsed * 0.7) * 0.018);
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
