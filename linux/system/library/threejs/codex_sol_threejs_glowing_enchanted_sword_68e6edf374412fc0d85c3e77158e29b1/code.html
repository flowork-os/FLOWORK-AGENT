<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enchanted Sword</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #01070b;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x01070b);
scene.fog = new THREE.FogExp2(0x01070b, 0.035);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.2, 2.4, 10.5);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(devicePixelRatio, 2));
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  1.25,
  0.55,
  0.13
);
composer.addPass(bloom);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.enablePan = false;
controls.minDistance = 7.5;
controls.maxDistance = 18;
controls.target.set(0, 0.7, 0);

scene.add(new THREE.HemisphereLight(0x76dcff, 0x020307, 0.42));

const keyLight = new THREE.DirectionalLight(0xb6efff, 2.2);
keyLight.position.set(4, 7, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -5;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const rimLight = new THREE.PointLight(0x00ffd5, 20, 9, 2);
rimLight.position.set(-2.4, 0.8, -2.8);
scene.add(rimLight);

const bladeLight = new THREE.PointLight(0x24eaff, 13, 8, 2);
bladeLight.position.set(0, 2.1, 1.1);
scene.add(bladeLight);

const sword = new THREE.Group();
sword.rotation.z = -0.045;
scene.add(sword);

const steel = new THREE.MeshStandardMaterial({
  color: 0x7899a4,
  metalness: 0.92,
  roughness: 0.19,
  emissive: 0x063946,
  emissiveIntensity: 0.9
});

const darkSteel = new THREE.MeshStandardMaterial({
  color: 0x132a30,
  metalness: 0.9,
  roughness: 0.25,
  emissive: 0x02191d,
  emissiveIntensity: 0.7
});

const silverEdge = new THREE.MeshStandardMaterial({
  color: 0xbbefff,
  metalness: 0.75,
  roughness: 0.12,
  emissive: 0x14cde8,
  emissiveIntensity: 3.2
});

const cyanGlow = new THREE.MeshBasicMaterial({
  color: 0x59f7ff,
  toneMapped: false,
  transparent: true,
  opacity: 0.95,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const tealGlow = new THREE.MeshStandardMaterial({
  color: 0x77fff0,
  metalness: 0.45,
  roughness: 0.18,
  emissive: 0x00ffd5,
  emissiveIntensity: 4.5
});

function bladeWidth(y) {
  if (y < 3.72) return 0.47 - y * 0.026;
  return Math.max(0.015, 0.37 * (4.38 - y) / 0.66);
}

const bladeShape = new THREE.Shape();
bladeShape.moveTo(-0.46, 0.16);
bladeShape.lineTo(-0.47, 0.43);
bladeShape.lineTo(-0.40, 3.72);
bladeShape.lineTo(-0.25, 4.10);
bladeShape.lineTo(0, 4.42);
bladeShape.lineTo(0.25, 4.10);
bladeShape.lineTo(0.40, 3.72);
bladeShape.lineTo(0.47, 0.43);
bladeShape.lineTo(0.46, 0.16);
bladeShape.closePath();

const bladeGeometry = new THREE.ExtrudeGeometry(bladeShape, {
  depth: 0.18,
  bevelEnabled: true,
  bevelSegments: 3,
  bevelSize: 0.045,
  bevelThickness: 0.045,
  curveSegments: 12
});
bladeGeometry.translate(0, 0, -0.09);
bladeGeometry.computeVertexNormals();

const blade = new THREE.Mesh(bladeGeometry, steel);
blade.castShadow = true;
blade.receiveShadow = true;
sword.add(blade);

const fullerShape = new THREE.Shape();
fullerShape.moveTo(-0.205, 0.39);
fullerShape.lineTo(-0.18, 3.66);
fullerShape.lineTo(-0.10, 3.98);
fullerShape.lineTo(0, 4.17);
fullerShape.lineTo(0.10, 3.98);
fullerShape.lineTo(0.18, 3.66);
fullerShape.lineTo(0.205, 0.39);
fullerShape.closePath();

const fullerMaterial = new THREE.MeshStandardMaterial({
  color: 0x092b36,
  metalness: 0.75,
  roughness: 0.31,
  emissive: 0x007b8c,
  emissiveIntensity: 1.25,
  side: THREE.DoubleSide
});

for (const z of [0.145, -0.145]) {
  const fuller = new THREE.Mesh(new THREE.ShapeGeometry(fullerShape), fullerMaterial);
  fuller.position.z = z;
  fuller.rotation.y = z < 0 ? Math.PI : 0;
  sword.add(fuller);
}

function tubeBetween(a, b, radius, material, radialSegments = 7) {
  const curve = new THREE.LineCurve3(a, b);
  return new THREE.Mesh(
    new THREE.TubeGeometry(curve, 1, radius, radialSegments, false),
    material
  );
}

function addBladeEdge(side) {
  const points = [];
  for (let i = 0; i <= 42; i++) {
    const y = 0.29 + i / 42 * 4.08;
    const x = side * bladeWidth(y);
    points.push(new THREE.Vector3(x, y, 0.105));
  }
  const curve = new THREE.CatmullRomCurve3(points);
  const core = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 90, 0.028, 6, false),
    silverEdge
  );
  sword.add(core);

  const aura = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 90, 0.055, 6, false),
    new THREE.MeshBasicMaterial({
      color: 0x11dff7,
      transparent: true,
      opacity: 0.32,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      toneMapped: false
    })
  );
  sword.add(aura);
}

addBladeEdge(-1);
addBladeEdge(1);

const tipGlow = new THREE.Mesh(
  new THREE.SphereGeometry(0.065, 16, 12),
  cyanGlow
);
tipGlow.position.set(0, 4.39, 0.12);
tipGlow.scale.set(0.8, 1.8, 0.8);
sword.add(tipGlow);

function addRuneStroke(x1, y1, x2, y2, z = 0.166, radius = 0.018) {
  const stroke = tubeBetween(
    new THREE.Vector3(x1, y1, z),
    new THREE.Vector3(x2, y2, z),
    radius,
    cyanGlow,
    6
  );
  sword.add(stroke);
}

const runeSets = [
  [
    [-0.02, 0.66, -0.13, 0.91],
    [-0.13, 0.91, 0.12, 0.83],
    [0.12, 0.83, 0.02, 1.10],
    [-0.10, 0.98, 0.11, 1.01]
  ],
  [
    [0.00, 1.30, 0.00, 1.68],
    [0.00, 1.48, -0.13, 1.60],
    [0.00, 1.48, 0.13, 1.60],
    [-0.11, 1.34, 0.11, 1.34]
  ],
  [
    [-0.12, 1.91, 0.08, 2.03],
    [0.08, 2.03, -0.08, 2.20],
    [-0.08, 2.20, 0.12, 2.35],
    [-0.10, 2.12, 0.10, 2.13]
  ],
  [
    [0.00, 2.57, -0.13, 2.77],
    [-0.13, 2.77, 0.00, 2.98],
    [0.00, 2.98, 0.13, 2.77],
    [0.13, 2.77, 0.00, 2.57],
    [-0.11, 2.77, 0.11, 2.77]
  ],
  [
    [-0.12, 3.22, 0.11, 3.22],
    [0.11, 3.22, -0.05, 3.42],
    [-0.05, 3.42, 0.10, 3.58],
    [-0.10, 3.53, 0.10, 3.53]
  ]
];

for (const rune of runeSets) {
  for (const s of rune) addRuneStroke(...s);
}

for (const y of [0.54, 1.19, 1.79, 2.46, 3.10, 3.69]) {
  const bead = new THREE.Mesh(new THREE.SphereGeometry(0.032, 10, 8), cyanGlow);
  bead.position.set(0, y, 0.174);
  sword.add(bead);
}

const guardCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-1.48, -0.05, 0),
  new THREE.Vector3(-1.14, 0.08, 0),
  new THREE.Vector3(-0.56, 0.18, 0),
  new THREE.Vector3(0, 0.13, 0),
  new THREE.Vector3(0.56, 0.18, 0),
  new THREE.Vector3(1.14, 0.08, 0),
  new THREE.Vector3(1.48, -0.05, 0)
]);

const guard = new THREE.Mesh(
  new THREE.TubeGeometry(guardCurve, 48, 0.13, 12, false),
  darkSteel
);
guard.castShadow = true;
sword.add(guard);

const guardInlay = new THREE.Mesh(
  new THREE.TubeGeometry(guardCurve, 48, 0.035, 7, false),
  tealGlow
);
guardInlay.position.z = 0.115;
sword.add(guardInlay);

for (const side of [-1, 1]) {
  const quillon = new THREE.Mesh(
    new THREE.ConeGeometry(0.145, 0.48, 12),
    steel
  );
  quillon.position.set(side * 1.52, -0.13, 0);
  quillon.rotation.z = side * -0.58;
  quillon.castShadow = true;
  sword.add(quillon);

  const gem = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.13, 1),
    tealGlow
  );
  gem.position.set(side * 1.33, 0.015, 0.02);
  gem.scale.set(1.2, 0.8, 0.7);
  sword.add(gem);
}

const rainGuard = new THREE.Mesh(
  new THREE.CylinderGeometry(0.39, 0.31, 0.26, 12),
  steel
);
rainGuard.position.y = 0.07;
rainGuard.castShadow = true;
sword.add(rainGuard);

const centralGem = new THREE.Mesh(
  new THREE.OctahedronGeometry(0.19, 1),
  tealGlow
);
centralGem.position.set(0, 0.10, 0.24);
centralGem.scale.set(0.9, 1.25, 0.55);
sword.add(centralGem);

const gripCore = new THREE.Mesh(
  new THREE.CylinderGeometry(0.22, 0.25, 1.46, 16),
  new THREE.MeshStandardMaterial({
    color: 0x071215,
    metalness: 0.25,
    roughness: 0.68
  })
);
gripCore.position.y = -0.72;
gripCore.castShadow = true;
sword.add(gripCore);

for (let i = 0; i < 9; i++) {
  const wrap = new THREE.Mesh(
    new THREE.TorusGeometry(0.247, 0.027, 6, 22),
    i % 2 === 0 ? darkSteel : steel
  );
  wrap.position.y = -0.12 - i * 0.15;
  wrap.rotation.x = Math.PI / 2;
  wrap.scale.set(1, 1, 0.8);
  sword.add(wrap);
}

const gripGlowA = tubeBetween(
  new THREE.Vector3(-0.12, -0.08, 0.205),
  new THREE.Vector3(0.12, -1.37, 0.205),
  0.018,
  cyanGlow
);
sword.add(gripGlowA);

const gripGlowB = tubeBetween(
  new THREE.Vector3(0.12, -0.08, -0.205),
  new THREE.Vector3(-0.12, -1.37, -0.205),
  0.018,
  cyanGlow
);
sword.add(gripGlowB);

const pommelNeck = new THREE.Mesh(
  new THREE.CylinderGeometry(0.28, 0.24, 0.28, 12),
  steel
);
pommelNeck.position.y = -1.52;
pommelNeck.castShadow = true;
sword.add(pommelNeck);

const pommel = new THREE.Mesh(
  new THREE.OctahedronGeometry(0.37, 1),
  darkSteel
);
pommel.position.y = -1.84;
pommel.scale.set(0.85, 1.18, 0.72);
pommel.castShadow = true;
sword.add(pommel);

const pommelGem = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.18, 2),
  tealGlow
);
pommelGem.position.set(0, -1.86, 0.25);
pommelGem.scale.set(0.85, 1.15, 0.48);
sword.add(pommelGem);

const pommelRing = new THREE.Mesh(
  new THREE.TorusGeometry(0.27, 0.035, 8, 28),
  tealGlow
);
pommelRing.position.y = -1.68;
pommelRing.rotation.x = Math.PI / 2;
sword.add(pommelRing);

const arcMaterial = new THREE.LineBasicMaterial({
  color: 0x7dffff,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  toneMapped: false
});

const arcSegmentCount = 44;
const arcPositions = new Float32Array(arcSegmentCount * 2 * 3);
const arcGeometry = new THREE.BufferGeometry();
arcGeometry.setAttribute('position', new THREE.BufferAttribute(arcPositions, 3));
const arcs = new THREE.LineSegments(arcGeometry, arcMaterial);
sword.add(arcs);

function updateArcs(time) {
  const p = arcGeometry.attributes.position.array;
  let index = 0;

  for (let i = 0; i < arcSegmentCount; i++) {
    const side = i % 2 === 0 ? -1 : 1;
    const band = Math.floor(i / 2);
    const y = 0.42 + ((band * 0.183 + time * 0.24) % 3.77);
    const y2 = Math.min(4.27, y + 0.11 + 0.08 * Math.sin(i * 4.1 + time * 8));
    const pulse = Math.sin(i * 12.73 + time * 19.0);
    const x = side * bladeWidth(y);
    const x2 = side * (bladeWidth(y2) + 0.035 + 0.055 * pulse);

    p[index++] = x;
    p[index++] = y;
    p[index++] = 0.16;

    p[index++] = x2;
    p[index++] = y2;
    p[index++] = 0.18 + 0.045 * Math.cos(i + time * 11);
  }

  arcGeometry.attributes.position.needsUpdate = true;
}

const sparkCount = 110;
const sparkPositions = new Float32Array(sparkCount * 3);
const sparkData = [];

for (let i = 0; i < sparkCount; i++) {
  const y = -0.1 + Math.random() * 4.65;
  const side = Math.random() < 0.5 ? -1 : 1;
  const x = side * (bladeWidth(Math.max(0.2, Math.min(4.3, y))) + Math.random() * 0.32);
  sparkPositions[i * 3] = x;
  sparkPositions[i * 3 + 1] = y;
  sparkPositions[i * 3 + 2] = (Math.random() - 0.5) * 0.65;
  sparkData.push({
    vx: (Math.random() - 0.5) * 0.14,
    vy: 0.10 + Math.random() * 0.28,
    vz: (Math.random() - 0.5) * 0.12,
    life: Math.random(),
    speed: 0.45 + Math.random()
  });
}

const sparkGeometry = new THREE.BufferGeometry();
sparkGeometry.setAttribute('position', new THREE.BufferAttribute(sparkPositions, 3));

const sparkMaterial = new THREE.PointsMaterial({
  color: 0x67f7ff,
  size: 0.055,
  sizeAttenuation: true,
  transparent: true,
  opacity: 0.86,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  toneMapped: false
});

const sparks = new THREE.Points(sparkGeometry, sparkMaterial);
sword.add(sparks);

function resetSpark(i) {
  const p = sparkGeometry.attributes.position.array;
  const y = 0.1 + Math.random() * 4.2;
  const side = Math.random() < 0.5 ? -1 : 1;
  p[i * 3] = side * (bladeWidth(y) + 0.04 + Math.random() * 0.15);
  p[i * 3 + 1] = y;
  p[i * 3 + 2] = (Math.random() - 0.5) * 0.38;
  sparkData[i].life = 0;
  sparkData[i].vx = side * (0.025 + Math.random() * 0.12);
  sparkData[i].vy = 0.10 + Math.random() * 0.28;
  sparkData[i].vz = (Math.random() - 0.5) * 0.12;
  sparkData[i].speed = 0.45 + Math.random();
}

function updateSparks(dt) {
  const p = sparkGeometry.attributes.position.array;

  for (let i = 0; i < sparkCount; i++) {
    const d = sparkData[i];
    d.life += dt * d.speed * 0.42;

    if (d.life > 1) {
      resetSpark(i);
      continue;
    }

    p[i * 3] += d.vx * dt;
    p[i * 3 + 1] += d.vy * dt;
    p[i * 3 + 2] += d.vz * dt;
  }

  sparkGeometry.attributes.position.needsUpdate = true;
}

const haloMaterial = new THREE.MeshBasicMaterial({
  color: 0x00ddcf,
  transparent: true,
  opacity: 0.075,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  side: THREE.DoubleSide,
  toneMapped: false
});

const guardHalo = new THREE.Mesh(
  new THREE.SphereGeometry(1, 24, 16),
  haloMaterial
);
guardHalo.position.y = 0.03;
guardHalo.scale.set(1.65, 0.38, 0.55);
sword.add(guardHalo);

const pommelHalo = new THREE.Mesh(
  new THREE.SphereGeometry(1, 20, 14),
  haloMaterial.clone()
);
pommelHalo.position.y = -1.82;
pommelHalo.scale.set(0.55, 0.65, 0.45);
sword.add(pommelHalo);

const backAura = new THREE.Mesh(
  new THREE.PlaneGeometry(1.15, 4.55),
  new THREE.MeshBasicMaterial({
    color: 0x00cfe8,
    transparent: true,
    opacity: 0.025,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide,
    toneMapped: false
  })
);
backAura.position.set(0, 2.25, -0.35);
sword.add(backAura);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.04);
  const time = clock.elapsedTime;

  controls.update();
  updateArcs(time);
  updateSparks(dt);

  const pulse = 1 + Math.sin(time * 3.4) * 0.07;
  centralGem.scale.set(0.9 * pulse, 1.25 * pulse, 0.55 * pulse);
  pommelGem.scale.set(0.85 * pulse, 1.15 * pulse, 0.48 * pulse);
  guardHalo.material.opacity = 0.065 + Math.sin(time * 2.3) * 0.014;
  pommelHalo.material.opacity = 0.07 + Math.sin(time * 2.8 + 1) * 0.015;
  arcMaterial.opacity = 0.68 + Math.random() * 0.3;
  bladeLight.intensity = 12 + Math.sin(time * 4.2) * 1.5;

  composer.render();
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  composer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

animate();
</script>
</body>
</html>
