<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inflatable Pool Flamingo Float</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #161619; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .hint {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: rgba(255,255,255,0.42); letter-spacing: .06em; text-transform: uppercase;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">drag to orbit &nbsp;·&nbsp; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------- Renderer */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

/* ------------------------------------------------------------------- Scene */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x161619);

// Studio reflections for glossy PVC highlights
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ Camera */
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(6.0, 3.4, 7.0);

/* ---------------------------------------------------------------- Controls */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 5;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0.1, 1.95, 0);

/* ------------------------------------------------------------------ Lights */
const hemi = new THREE.HemisphereLight(0xbcd4ff, 0x2a2420, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(5.5, 8.5, 5.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 32;
key.shadow.camera.left = -7;
key.shadow.camera.right = 7;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd0ff, 0.55);
fill.position.set(-6.5, 3.0, 4.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd6ea, 1.15);
rim.position.set(-4.5, 5.5, -6.5);
scene.add(rim);

/* --------------------------------------------------------------- Materials */
const pinkMat = new THREE.MeshPhysicalMaterial({
  color: 0xff5f97, roughness: 0.17, metalness: 0.0,
  clearcoat: 1.0, clearcoatRoughness: 0.12,
  sheen: 0.5, sheenColor: new THREE.Color(0xffcfe2),
  envMapIntensity: 1.15
});
const seamMat = new THREE.MeshPhysicalMaterial({
  color: 0xff87b6, roughness: 0.1, metalness: 0.0,
  clearcoat: 1.0, clearcoatRoughness: 0.08, envMapIntensity: 1.25
});
const beakPinkMat = new THREE.MeshPhysicalMaterial({
  color: 0xff6c9c, roughness: 0.16, metalness: 0.0,
  clearcoat: 1.0, clearcoatRoughness: 0.1, envMapIntensity: 1.15
});
const blackMat = new THREE.MeshPhysicalMaterial({
  color: 0x151518, roughness: 0.18, metalness: 0.0,
  clearcoat: 1.0, clearcoatRoughness: 0.12, envMapIntensity: 1.3
});
const eyeMat = new THREE.MeshPhysicalMaterial({
  color: 0x0a0a0d, roughness: 0.04, metalness: 0.0,
  clearcoat: 1.0, clearcoatRoughness: 0.03, envMapIntensity: 1.6
});

/* -------------------------------------------- Tapered tube geometry helper */
function taperedTube(curve, rStart, rEnd, tubular, radial, ease) {
  const frames = curve.computeFrenetFrames(tubular, false);
  const pos = [], nor = [], uv = [], idx = [];
  const P = new THREE.Vector3(), N = new THREE.Vector3(), B = new THREE.Vector3();
  for (let i = 0; i <= tubular; i++) {
    const u = i / tubular;
    curve.getPointAt(u, P);
    N.copy(frames.normals[i]);
    B.copy(frames.binormals[i]);
    const t = ease ? ease(u) : u;
    const r = rStart + (rEnd - rStart) * t;
    for (let j = 0; j <= radial; j++) {
      const v = (j / radial) * Math.PI * 2;
      const s = Math.sin(v), c = -Math.cos(v);
      const nx = c * N.x + s * B.x, ny = c * N.y + s * B.y, nz = c * N.z + s * B.z;
      pos.push(P.x + r * nx, P.y + r * ny, P.z + r * nz);
      nor.push(nx, ny, nz);
      uv.push(u, j / radial);
    }
  }
  for (let i = 1; i <= tubular; i++) {
    for (let j = 1; j <= radial; j++) {
      const a = (radial + 1) * (i - 1) + (j - 1);
      const b = (radial + 1) * i + (j - 1);
      const c = (radial + 1) * i + j;
      const d = (radial + 1) * (i - 1) + j;
      idx.push(a, b, d, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

/* ----------------------------------------------------------- Flamingo build */
const flamingo = new THREE.Group();
scene.add(flamingo);

const bodyCenter = new THREE.Vector3(0, 1.15, 0);
const bodyRadii  = new THREE.Vector3(1.5, 1.15, 1.05);

// Plump air-filled body
const body = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64), pinkMat);
body.scale.copy(bodyRadii);
body.position.copy(bodyCenter);
flamingo.add(body);

// Chest bulge (extra puffiness toward the front-bottom)
const chest = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), pinkMat);
chest.scale.set(0.85, 0.8, 0.85);
chest.position.set(0.85, 0.85, 0);
flamingo.add(chest);

// Welded silhouette seam around the mid-plane
const bodySeam = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.055, 22, 120), seamMat);
bodySeam.scale.set(bodyRadii.x, bodyRadii.y, 1);
bodySeam.position.copy(bodyCenter);
flamingo.add(bodySeam);

// Puffy wing outline seams (one each side)
function addWing(zSign) {
  const wing = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.05, 18, 90), seamMat);
  wing.scale.set(0.62, 0.46, 1);
  wing.position.set(0.05, 1.28, zSign * 0.86);
  flamingo.add(wing);
}
addWing(1);
addWing(-1);

/* ------------------------------------------------ S-curved neck + seam rings */
const neckPts = [
  new THREE.Vector3(0.60, 1.90, 0),
  new THREE.Vector3(1.02, 2.52, 0),
  new THREE.Vector3(0.92, 3.08, 0),
  new THREE.Vector3(0.50, 3.38, 0),
  new THREE.Vector3(0.55, 3.72, 0),
  new THREE.Vector3(1.00, 3.82, 0)
];
const neckCurve = new THREE.CatmullRomCurve3(neckPts, false, 'catmullrom', 0.5);
const NECK_R0 = 0.50, NECK_R1 = 0.34;
const neck = new THREE.Mesh(
  taperedTube(neckCurve, NECK_R0, NECK_R1, 160, 40, u => Math.pow(u, 0.85)),
  pinkMat
);
flamingo.add(neck);

// Neck seam rings following the tangent
function addNeckSeam(u) {
  const p = neckCurve.getPointAt(u);
  const t = neckCurve.getTangentAt(u).normalize();
  const r = (NECK_R0 + (NECK_R1 - NECK_R0) * Math.pow(u, 0.85)) + 0.012;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.04, 14, 48), seamMat);
  ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), t);
  ring.position.copy(p);
  flamingo.add(ring);
}
[0.22, 0.45, 0.68, 0.88].forEach(addNeckSeam);

/* ------------------------------------------------------------------- Head */
const headCenter = new THREE.Vector3(1.05, 3.85, 0);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 64, 48), pinkMat);
head.position.copy(headCenter);
flamingo.add(head);

// Eyes
function addEye(zSign) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.075, 24, 18), eyeMat);
  eye.position.set(headCenter.x + 0.26, headCenter.y + 0.13, zSign * 0.30);
  eye.castShadow = false;
  flamingo.add(eye);
}
addEye(1);
addEye(-1);

/* --------------------------------------------- Stylized down-curving beak */
const up = new THREE.Vector3(0, 1, 0);
const attach = headCenter.clone().add(new THREE.Vector3(1, -0.15, 0).normalize().multiplyScalar(0.38));

// Pink upper beak (thick at face, tapering forward)
const d1 = new THREE.Vector3(1, -0.30, 0).normalize();
const beakBase = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.25, 0.52, 28), beakPinkMat);
beakBase.quaternion.setFromUnitVectors(up, d1);
beakBase.position.copy(attach.clone().add(d1.clone().multiplyScalar(0.26)));
flamingo.add(beakBase);

// Black down-hooked tip
const tip1 = attach.clone().add(d1.clone().multiplyScalar(0.52));
const d2 = new THREE.Vector3(0.68, -1.0, 0).normalize();
const beakTip = new THREE.Mesh(new THREE.ConeGeometry(0.135, 0.58, 28), blackMat);
beakTip.quaternion.setFromUnitVectors(up, d2);
beakTip.position.copy(tip1.clone().add(d2.clone().multiplyScalar(0.29)));
flamingo.add(beakTip);

/* ----------------------------------------------------- Upturned puffy tail */
const tailCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-1.30, 1.35, 0),
  new THREE.Vector3(-1.72, 1.75, 0),
  new THREE.Vector3(-2.00, 2.30, 0),
  new THREE.Vector3(-2.05, 2.85, 0)
], false, 'catmullrom', 0.5);
const tail = new THREE.Mesh(
  taperedTube(tailCurve, 0.52, 0.02, 90, 32, u => Math.pow(u, 0.7)),
  pinkMat
);
flamingo.add(tail);

// A couple of smaller tail feather puffs
[[-1.75, 2.05, 0.28], [-1.78, 2.0, -0.28]].forEach(([x, y, z]) => {
  const f = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 24), pinkMat);
  f.scale.set(0.55, 1.0, 0.45);
  f.position.set(x, y, z);
  f.rotation.z = 0.5;
  flamingo.add(f);
});

/* -------------------------------------------------------- Tucked-up legs */
function addLeg(zSign) {
  const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.14, 0.5, 10, 20), pinkMat);
  leg.rotation.z = Math.PI * 0.42;
  leg.rotation.y = zSign * 0.25;
  leg.position.set(0.25, 0.36, zSign * 0.46);
  flamingo.add(leg);

  // little folded webbed foot
  const foot = new THREE.Mesh(new THREE.SphereGeometry(0.2, 24, 16), pinkMat);
  foot.scale.set(0.9, 0.35, 0.62);
  foot.position.set(0.78, 0.24, zSign * 0.5);
  foot.rotation.z = -0.2;
  flamingo.add(foot);
}
addLeg(1);
addLeg(-1);

// Shadows for every part
flamingo.traverse(o => {
  if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
});

/* ---------------------------------------------------- Shadow-only ground */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 64),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* --------------------------------------------------------------- Resize */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ----------------------------------------------------------- Animate loop */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
