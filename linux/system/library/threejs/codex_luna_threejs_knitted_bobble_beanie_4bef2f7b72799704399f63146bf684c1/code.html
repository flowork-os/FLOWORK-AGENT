<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knitted Bobble Beanie</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #171514; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x181514);
scene.fog = new THREE.Fog(0x181514, 7, 13);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.7, 2.65, 5.2);
camera.lookAt(0, 1.25, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.15;
controls.minDistance = 3.3;
controls.maxDistance = 7.5;
controls.target.set(0, 1.25, 0);

const mustard = new THREE.MeshStandardMaterial({
  color: 0xd49b28,
  roughness: 0.9,
  metalness: 0
});
const mustardLight = new THREE.MeshStandardMaterial({
  color: 0xe4b43d,
  roughness: 0.86,
  metalness: 0
});
const cream = new THREE.MeshStandardMaterial({
  color: 0xf1dfb3,
  roughness: 0.92,
  metalness: 0
});
const shadowMustard = new THREE.MeshStandardMaterial({
  color: 0xb97d19,
  roughness: 0.95,
  metalness: 0
});

const beanie = new THREE.Group();
scene.add(beanie);

function domeRadius(y) {
  const t = THREE.MathUtils.clamp((y - 0.55) / 1.78, 0, 1);
  return 0.10 + 1.31 * Math.pow(1 - t, 0.54) + 0.035 * Math.sin(t * Math.PI);
}

const domeProfile = [];
for (let i = 0; i <= 28; i++) {
  const y = 0.55 + i * (1.78 / 28);
  domeProfile.push(new THREE.Vector2(domeRadius(y), y));
}
const dome = new THREE.Mesh(new THREE.LatheGeometry(domeProfile, 96), mustard);
dome.castShadow = true;
dome.receiveShadow = true;
beanie.add(dome);

const brim = new THREE.Mesh(
  new THREE.CylinderGeometry(1.43, 1.39, 0.58, 96, 5, false),
  shadowMustard
);
brim.position.y = 0.29;
brim.castShadow = true;
brim.receiveShadow = true;
beanie.add(brim);

const creamBand = new THREE.Mesh(
  new THREE.CylinderGeometry(1.405, 1.405, 0.27, 96, 4, false),
  cream
);
creamBand.position.y = 0.61;
creamBand.castShadow = true;
creamBand.receiveShadow = true;
beanie.add(creamBand);

const horizontalStitchGeometry = new THREE.TorusGeometry(0.052, 0.016, 7, 12);
const loopUp = new THREE.Vector3(0, 1, 0);
const loopRadial = new THREE.Vector3();
const loopQuaternion = new THREE.Quaternion();
const loopDummy = new THREE.Object3D();

function addDomeLoops() {
  const rows = 12;
  let total = 0;
  const rowCounts = [];
  for (let r = 0; r < rows; r++) {
    const y = 0.76 + r * 0.105;
    const count = Math.max(14, Math.floor((Math.PI * 2 * domeRadius(y)) / 0.19));
    rowCounts.push(count);
    total += count;
  }

  const loops = new THREE.InstancedMesh(horizontalStitchGeometry, mustardLight, total);
  let index = 0;

  for (let r = 0; r < rows; r++) {
    const y = 0.76 + r * 0.105;
    const radius = domeRadius(y) + 0.026;
    const count = rowCounts[r];
    const offset = (r % 2) * Math.PI / count;

    for (let c = 0; c < count; c++) {
      const angle = c / count * Math.PI * 2 + offset;
      loopRadial.set(Math.cos(angle), 0, Math.sin(angle));
      loopDummy.position.set(loopRadial.x * radius, y, loopRadial.z * radius);
      loopQuaternion.setFromUnitVectors(loopUp, loopRadial);
      loopDummy.quaternion.copy(loopQuaternion);
      loopDummy.scale.set(1, 1, 1);
      loopDummy.updateMatrix();
      loops.setMatrixAt(index++, loopDummy.matrix);
    }
  }

  loops.instanceMatrix.needsUpdate = true;
  loops.castShadow = true;
  loops.receiveShadow = true;
  beanie.add(loops);
}
addDomeLoops();

const bandLoopGeometry = new THREE.TorusGeometry(0.055, 0.018, 7, 12);
const bandLoops = new THREE.InstancedMesh(bandLoopGeometry, cream, 3 * 45);
let bandIndex = 0;
for (let row = 0; row < 3; row++) {
  const y = 0.505 + row * 0.095;
  for (let c = 0; c < 45; c++) {
    const angle = c / 45 * Math.PI * 2 + (row % 2) * 0.07;
    loopRadial.set(Math.cos(angle), 0, Math.sin(angle));
    loopDummy.position.set(loopRadial.x * 1.437, y, loopRadial.z * 1.437);
    loopQuaternion.setFromUnitVectors(loopUp, loopRadial);
    loopDummy.quaternion.copy(loopQuaternion);
    loopDummy.updateMatrix();
    bandLoops.setMatrixAt(bandIndex++, loopDummy.matrix);
  }
}
bandLoops.instanceMatrix.needsUpdate = true;
bandLoops.castShadow = true;
beanie.add(bandLoops);

const brimRibGeometry = new THREE.TorusGeometry(0.105, 0.027, 7, 14);
const brimRibs = new THREE.InstancedMesh(brimRibGeometry, mustardLight, 28);
for (let i = 0; i < 28; i++) {
  const angle = i / 28 * Math.PI * 2;
  loopRadial.set(Math.cos(angle), 0, Math.sin(angle));
  loopDummy.position.set(loopRadial.x * 1.405, 0.27, loopRadial.z * 1.405);
  loopQuaternion.setFromUnitVectors(loopUp, loopRadial);
  loopDummy.quaternion.copy(loopQuaternion);
  loopDummy.updateMatrix();
  brimRibs.setMatrixAt(i, loopDummy.matrix);
}
brimRibs.instanceMatrix.needsUpdate = true;
brimRibs.castShadow = true;
beanie.add(brimRibs);

class CableCurve extends THREE.Curve {
  constructor(columnAngle) {
    super();
    this.columnAngle = columnAngle;
  }
  getPoint(t, target = new THREE.Vector3()) {
    const y = 0.69 + t * 1.49;
    const phase = t * Math.PI * 3.2;
    const angle = this.columnAngle + Math.sin(phase) * 0.045;
    const radius = domeRadius(y) + 0.055 + Math.sin(phase) * 0.018;
    return target.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
  }
}

for (let i = 0; i < 9; i++) {
  const angle = i / 9 * Math.PI * 2;
  const cable = new THREE.Mesh(
    new THREE.TubeGeometry(new CableCurve(angle), 32, 0.033, 7, false),
    mustardLight
  );
  cable.castShadow = true;
  cable.receiveShadow = true;
  beanie.add(cable);
}

const bobbleGeometry = new THREE.IcosahedronGeometry(0.145, 1);
const bobbleMaterial = new THREE.MeshStandardMaterial({
  color: 0xd9a22e,
  roughness: 1,
  flatShading: true
});
const bobble = new THREE.InstancedMesh(bobbleGeometry, bobbleMaterial, 74);
const bobbleDummy = new THREE.Object3D();

for (let i = 0; i < 74; i++) {
  const a = i * 2.399963;
  const v = ((i * 37) % 73) / 72;
  const polar = Math.acos(1 - 2 * v);
  const radial = 0.18 + 0.33 * (((i * 17) % 71) / 70);
  const x = Math.sin(polar) * Math.cos(a) * radial;
  const z = Math.sin(polar) * Math.sin(a) * radial;
  const y = 2.40 + Math.cos(polar) * radial * 0.92;
  bobbleDummy.position.set(x, y, z);
  const scale = 0.72 + (((i * 11) % 29) / 28) * 0.42;
  bobbleDummy.scale.setScalar(scale);
  bobbleDummy.rotation.set(a * 0.7, polar, a * 0.35);
  bobbleDummy.updateMatrix();
  bobble.setMatrixAt(i, bobbleDummy.matrix);
}
bobble.instanceMatrix.needsUpdate = true;
bobble.castShadow = true;
bobble.receiveShadow = true;
beanie.add(bobble);

const pomCore = new THREE.Mesh(
  new THREE.SphereGeometry(0.30, 24, 16),
  mustard
);
pomCore.position.y = 2.4;
pomCore.castShadow = true;
beanie.add(pomCore);

const hemi = new THREE.HemisphereLight(0xffe6ba, 0x241613, 2.1);
scene.add(hemi);

const keyLight = new THREE.DirectionalLight(0xffd9a0, 4.2);
keyLight.position.set(-3.5, 6, 4.2);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -4;
keyLight.shadow.camera.right = 4;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -2;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0x9dbeff, 1.4, 9);
fillLight.position.set(3.5, 2.6, -3.5);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xffb85e, 1.5, 7);
rimLight.position.set(-2.5, 2.2, -2.6);
scene.add(rimLight);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(5.5, 96),
  new THREE.MeshStandardMaterial({ color: 0x211b19, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener("resize", resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
