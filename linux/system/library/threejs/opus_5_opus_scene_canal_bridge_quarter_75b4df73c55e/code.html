<title>Canal Bridge Quarter</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1b1a30}
  canvas{display:block}
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<body>
<script type="module">
/* ============================================================================
   CANAL BRIDGE QUARTER  —  dutch storybook, dusk
   A humpbacked stone bridge over dark green water, rows of tall narrow gabled
   houses with lit windows, a moored wooden boat with flower planters, bicycles
   leaning on the quay railings, cast-iron lamps reflecting in the canal, a
   laundry line strung across the water and ducks gliding under the arch.
   Everything is procedural: geometry plus canvas textures, no external assets.
   ========================================================================== */
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* --------------------------- 1. CONFIG & PALETTE -------------------------- */
const CFG = {
  seed: 20817,
  canalHalf: 3.6,      // half width of open water
  quayTop: 1.5,        // pavement height above the water line
  houseLine: 7.4,      // |x| of the facade planes
  houseDepth: 5.2,
  bridgeZ: 1.0,        // centre of the bridge along the canal
  bridgeHalf: 5.8,     // half span, lands flush on both quays
  bridgeW: 4.4,
  deckRise: 1.75,      // crown height above the quay pavement
  springX: 3.95, springY: 0.45, apexY: 2.35
};
const PAL = {
  water: 0x14302a, stone: 0x8b8172, stoneLight: 0xa9a08c, stoneDark: 0x4e4941,
  iron: 0x1e1b26, trim: 0xefe3c8, glow: 0xffc27a, fog: 0x3a3350,
  brick: [0x7a3a34, 0x8a4b3a, 0x60393c, 0x6d4a3e, 0x8b5f45, 0x574250],
  roof: [0x3f3648, 0x6f382f, 0x4a4550],
  wood: 0x6b4a30, woodLight: 0x9d7a4a, hull: 0x243530, leaf: 0x2f4a33,
  bloom: [0xd9455a, 0xe8a13c, 0xefe0d0, 0xc84f8c],
  cloth: [0xd8e2ea, 0xe4c05a, 0xc75c58, 0x6f9bb5, 0xe8e2d4, 0x8fa86b]
};

/* ----------------------- 2. PRNG & GEOMETRY HELPERS ----------------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(CFG.seed);
const rng = (a, b) => a + (b - a) * rand();
const pick = (arr) => arr[Math.floor(rand() * arr.length)];
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const std = (o) => new THREE.MeshStandardMaterial(o);

/** Mesh factory that also sets the shadow flags nearly every prop wants. */
function mesh(geo, mat, x = 0, y = 0, z = 0, cast = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = cast; m.receiveShadow = true; return m;
}
const box = (w, h, d, mat, x, y, z) => mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z);
const cyl = (rt, rb, h, mat, x, y, z, s = 10) => mesh(new THREE.CylinderGeometry(rt, rb, h, s), mat, x, y, z);
const sph = (r, mat, x, y, z, s = 10) => mesh(new THREE.SphereGeometry(r, s, s - 2), mat, x, y, z);

/** Thin cylinder stretched between two points — ropes, rails, bike tubes. */
function strut(a, b, radius, mat, seg = 6) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const m = mesh(new THREE.CylinderGeometry(radius, radius, Math.max(dir.length(), 1e-4), seg), mat);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(V(0, 1, 0), dir.clone().normalize()); return m;
}
/** Height of the bridge deck above the water at crossing coordinate x. */
const humpY = (x) => CFG.quayTop + CFG.deckRise * Math.pow(Math.max(0, 1 - (x / CFG.bridgeHalf) ** 2), 0.8);
/** Sagging catenary sample between two anchors, used for ropes and the line. */
const sagPt = (a, b, t, sag) => V(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t - sag * Math.sin(Math.PI * t),
  a.z + (b.z - a.z) * t);

/* --------------------------- 3. CANVAS TEXTURES --------------------------- */
function canvas2d(w = 256, h = w) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')];
}
function finish(c, rx = 1, ry = 1) {
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry); t.anisotropy = 4; t.colorSpace = THREE.SRGBColorSpace; return t;
}
/** Post-sunset gradient with a warm band straddling the horizon. */
function skyTexture() {
  const [c, g] = canvas2d(512), gr = g.createLinearGradient(0, 0, 0, 512), r = mulberry32(7);
  for (const [o, col] of [[0, '#0a0e2c'], [0.26, '#1e2350'], [0.42, '#4a3a68'], [0.48, '#8b5560'],
    [0.505, '#d98a56'], [0.53, '#f2b478'], [0.58, '#4b3d55'], [1, '#161528']]) gr.addColorStop(o, col);
  g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 160; i++) {
    const y = r() * 190;
    g.fillStyle = `rgba(255,246,222,${(0.2 + r() * 0.65) * (1 - y / 240)})`;
    g.fillRect(r() * 512, y, 1.6, 1.6);
  }
  return finish(c);
}
/** Soft round falloff reused for lamp halos, reflections and mist motes. */
function glowTexture() {
  const [c, g] = canvas2d(128), gr = g.createRadialGradient(64, 64, 1, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.35, 'rgba(255,226,180,0.55)');
  gr.addColorStop(1, 'rgba(255,190,120,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return finish(c);
}
/** Coursed ashlar for the bridge, the quay walls and the church tower. */
function stoneTexture(hex, seedN) {
  const [c, g] = canvas2d(256), r = mulberry32(seedN), col = new THREE.Color(hex);
  g.fillStyle = '#3a352f'; g.fillRect(0, 0, 256, 256);
  for (let row = 0; row < 8; row++) for (let i = -1; i < 5; i++) {
    const x = i * 64 + (row % 2) * 32, y = row * 32, k = 0.74 + r() * 0.46;
    g.fillStyle = `rgb(${col.r * 255 * k | 0},${col.g * 255 * k | 0},${col.b * 255 * k | 0})`;
    g.fillRect(x + 1.6, y + 1.6, 60.8, 28.8);
    g.fillStyle = `rgba(255,248,232,${r() * 0.08})`; g.fillRect(x + 2.4, y + 2.4, 59, 5);
  }
  for (let i = 0; i < 60; i++) {                                    // damp weed along the waterline
    g.fillStyle = `rgba(46,58,44,${0.05 + r() * 0.14})`; g.fillRect(r() * 256, 200 + r() * 56, 6 + r() * 34, 4 + r() * 18);
  }
  return finish(c);
}
/** Small klinker bricks laid in a basket weave for the quays. */
function paveTexture() {
  const [c, g] = canvas2d(256), r = mulberry32(91);
  g.fillStyle = '#241f22'; g.fillRect(0, 0, 256, 256);
  for (let row = 0; row < 16; row++) for (let i = -1; i < 9; i++) {
    const flip = (row + i) % 2 === 0, w = flip ? 30 : 14, h = flip ? 14 : 30, k = 0.6 + r() * 0.5;
    g.fillStyle = `rgb(${82 * k | 0},${66 * k | 0},${62 * k | 0})`;
    g.fillRect(i * 32 + (row % 2) * 16 + 1, row * 16 + 1, w, h);
  }
  return finish(c, 8, 26);
}
/** Weathered plank boarding for the boat, crates and quay furniture. */
function plankTexture(hex, seedN, rows = 8) {
  const [c, g] = canvas2d(256), r = mulberry32(seedN), col = new THREE.Color(hex);
  for (let i = 0; i < rows; i++) {
    const k = 0.72 + r() * 0.5, y = i * (256 / rows);
    g.fillStyle = `rgb(${col.r * 255 * k | 0},${col.g * 255 * k | 0},${col.b * 255 * k | 0})`;
    g.fillRect(0, y, 256, 256 / rows - 1.5);
    for (let j = 0; j < 26; j++) {
      g.fillStyle = `rgba(30,20,12,${0.05 + r() * 0.12})`;
      g.fillRect(r() * 256, y + r() * (256 / rows), 12 + r() * 60, 1.2);
    }
  }
  return finish(c);
}
/** Mottled dark-green canal water, slowly scrolled in the animation loop. */
function waterTexture() {
  const [c, g] = canvas2d(256), r = mulberry32(505);
  g.fillStyle = '#1a3c33'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 340; i++) {
    const x = r() * 256, y = r() * 256, w = 10 + r() * 70;
    g.strokeStyle = r() > 0.45 ? `rgba(150,205,180,${r() * 0.1})` : `rgba(6,20,18,${r() * 0.22})`;
    g.lineWidth = 0.8 + r() * 1.8;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + w * 0.5, y + r() * 6 - 3, x + w, y); g.stroke();
  }
  return finish(c, 4, 16);
}
/** Clay pantiles for the roofs tucked behind the gables. */
function tileTexture(hex) {
  const [c, g] = canvas2d(128), r = mulberry32((hex % 7919) + 3), col = new THREE.Color(hex);
  g.fillStyle = '#241f28'; g.fillRect(0, 0, 128, 128);
  for (let row = 0; row < 8; row++) for (let i = 0; i < 8; i++) {
    const k = 0.7 + r() * 0.5, x = i * 16 + (row % 2) * 8;
    g.fillStyle = `rgb(${col.r * 255 * k | 0},${col.g * 255 * k | 0},${col.b * 255 * k | 0})`;
    g.beginPath(); g.ellipse(x + 8, row * 16 + 8, 8, 7.4, 0, 0, 6.283); g.fill();
  }
  return finish(c, 3, 4);
}
/** One lit or shuttered sash, painted onto both colour and emissive maps. */
function drawWindow(g, eg, x, y, w, h, lit, r) {
  const x0 = x - w / 2, y0 = y - h / 2;
  g.fillStyle = '#ece0c8'; g.fillRect(x0 - 5, y0 - 5, w + 10, h + 10);
  if (lit) {
    const gr = g.createLinearGradient(0, y0, 0, y0 + h);
    gr.addColorStop(0, '#ffeec2'); gr.addColorStop(1, '#f09a48');
    g.fillStyle = gr; g.fillRect(x0, y0, w, h);
    if (r() < 0.6) { g.fillStyle = 'rgba(70,34,20,0.6)'; g.fillRect(x0 + w * 0.52, y0 + h * 0.5, w * 0.34, h * 0.5); }
  } else { g.fillStyle = '#222a38'; g.fillRect(x0, y0, w, h); }
  g.strokeStyle = '#ece0c8'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y0 + h);
  g.moveTo(x0, y0 + h * 0.42); g.lineTo(x0 + w, y0 + h * 0.42); g.stroke();
  g.fillStyle = '#d8cbb0'; g.fillRect(x0 - 8, y0 + h + 5, w + 16, 5);
  if (!lit) return;
  const rg = eg.createRadialGradient(x, y, 2, x, y, w * 1.4);
  rg.addColorStop(0, 'rgba(255,205,140,1)'); rg.addColorStop(0.5, 'rgba(255,168,88,0.45)');
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  eg.fillStyle = rg; eg.fillRect(x - w * 1.5, y - w * 1.5, w * 3, w * 3);
  eg.fillStyle = '#ffd79b'; eg.fillRect(x0, y0, w, h);
}
/** Ground-floor door with a glowing fanlight over it. */
function drawDoor(g, eg, x, y, w, h, r) {
  const dw = w * 1.06, dh = h * 1.55, x0 = x - dw / 2, y0 = 505 - dh;
  g.fillStyle = '#efe2c6'; g.fillRect(x0 - 5, y0 - 6, dw + 10, dh + 6);
  g.fillStyle = r() < 0.5 ? '#2c4a3e' : '#5a2b2b'; g.fillRect(x0, y0, dw, dh);
  g.fillStyle = '#ffeec2'; g.fillRect(x0 + 4, y0 + 4, dw - 8, dh * 0.2);
  g.fillStyle = '#c9a24d'; g.fillRect(x0 + dw - 13, y0 + dh * 0.55, 6, 6);
  const rg = eg.createRadialGradient(x, y0 + dh * 0.1, 2, x, y0 + dh * 0.1, dw * 1.2);
  rg.addColorStop(0, 'rgba(255,214,150,1)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  eg.fillStyle = rg; eg.fillRect(x0 - dw, y0 - dw, dw * 3, dw * 3);
  eg.fillStyle = '#ffe0ae'; eg.fillRect(x0 + 4, y0 + 4, dw - 8, dh * 0.2);
}
/** Whole brick facade: colour map plus a matching emissive map for the panes. */
function facadeTextures(hex, seedN, floors, cols) {
  const [c, g] = canvas2d(256, 512), [ec, eg] = canvas2d(256, 512);
  const r = mulberry32(seedN), base = new THREE.Color(hex);
  g.fillStyle = '#' + base.getHexString(); g.fillRect(0, 0, 256, 512);
  for (let row = 0; row < 64; row++) for (let i = -1; i < 17; i++) {
    const k = 0.76 + r() * 0.44;
    g.fillStyle = `rgb(${base.r * 255 * k | 0},${base.g * 255 * k | 0},${base.b * 255 * k | 0})`;
    g.fillRect(i * 16 + (row % 2) * 8 + 0.8, row * 8 + 0.8, 14.4, 6.4);
  }
  for (let i = 0; i < 20; i++) {                                   // rain staining down the brick
    g.fillStyle = `rgba(26,22,32,${0.03 + r() * 0.06})`;
    g.fillRect(r() * 256, r() * 380, 5 + r() * 22, 60 + r() * 130);
  }
  eg.fillStyle = '#000'; eg.fillRect(0, 0, 256, 512);
  const rowH = 452 / floors;
  for (let f = 0; f < floors; f++) {
    const cy = 496 - f * rowH - rowH * 0.52;
    const wh = Math.min(rowH * 0.56, 76), ww = Math.min(232 / cols - 14, 60);
    for (let i = 0; i < cols; i++) {
      const cx = 128 + (i - (cols - 1) / 2) * (232 / cols);
      if (f === 0 && i === 0) drawDoor(g, eg, cx, cy, ww, wh, r);
      else drawWindow(g, eg, cx, cy, ww, wh, r() < 0.82, r);
    }
  }
  return { map: finish(c), emis: finish(ec) };
}

/* ------------------------------ 4. MATERIALS ------------------------------ */
const TEX = { glow: glowTexture(), water: waterTexture() };
const MAT = {
  stone: std({ map: stoneTexture(PAL.stone, 31), roughness: 0.94 }),
  stoneLight: std({ map: stoneTexture(PAL.stoneLight, 57), roughness: 0.9 }),
  stoneDark: std({ color: PAL.stoneDark, roughness: 1 }),
  quayWall: std({ map: stoneTexture(0x6a5f52, 12), roughness: 1 }),
  brickTower: std({ map: stoneTexture(0x7d5a49, 66), roughness: 0.95 }),
  pave: std({ map: paveTexture(), roughness: 0.97 }),
  deck: std({ map: stoneTexture(0x77695c, 88), roughness: 0.95 }),
  water: std({ map: TEX.water, color: 0xd4ecdd, roughness: 0.16, metalness: 0.28 }),
  iron: std({ color: PAL.iron, roughness: 0.55, metalness: 0.65 }),
  trim: std({ color: PAL.trim, roughness: 0.8 }),
  wood: std({ map: plankTexture(PAL.wood, 21), roughness: 0.88 }),
  woodLight: std({ map: plankTexture(PAL.woodLight, 44, 6), roughness: 0.82 }),
  wicker: std({ color: 0x8a6b3e, roughness: 0.9, side: THREE.DoubleSide }),
  hull: std({ color: PAL.hull, roughness: 0.6, metalness: 0.1 }),
  leaf: std({ color: PAL.leaf, roughness: 0.95, flatShading: true }),
  bark: std({ color: 0x3d3129, roughness: 1 }),
  lampGlass: std({ color: 0xffd9a0, emissive: PAL.glow, emissiveIntensity: 2.6, roughness: 0.3 }),
  litPane: std({ color: 0xffd9a0, emissive: 0xffc98a, emissiveIntensity: 1.9, roughness: 0.6 }),
  duck: std({ color: 0xe8e2d6, roughness: 0.9 }),
  duckDark: std({ color: 0x2c3b33, roughness: 0.85 }),
  bill: std({ color: 0xe0902f, roughness: 0.7 }),
  halo: new THREE.SpriteMaterial({ map: TEX.glow, color: PAL.glow, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.55 }),
  reflect: new THREE.MeshBasicMaterial({ map: TEX.glow, color: 0xffb877, transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.4, fog: false })
};
const ROOF_MATS = PAL.roof.map(h => std({ map: tileTexture(h), roughness: 0.95 }));
const CLOTH_MATS = PAL.cloth.map(h => std({ color: h, roughness: 0.95, side: THREE.DoubleSide }));
const BLOOM_MATS = PAL.bloom.map(h => std({ color: h, roughness: 0.8, emissive: h, emissiveIntensity: 0.16 }));

/* ------------------- 5. SCENE, CAMERA, RENDERER, CONTROLS ----------------- */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(PAL.fog, 0.0082);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 420);
camera.position.set(10.8, 20.1, 38.6);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.24;
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.05;
controls.autoRotate = true; controls.autoRotateSpeed = 0.75;
controls.target.set(0, 5.5, -8);
controls.minDistance = 34; controls.maxDistance = 88;
controls.minPolarAngle = 0.55; controls.maxPolarAngle = 1.36;

/* ------------------ 6. BUILDERS — sky, water, quays, bridge --------------- */
function buildSkyDome() {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.SphereGeometry(190, 40, 24),
    new THREE.MeshBasicMaterial({ map: skyTexture(), side: THREE.BackSide, fog: false })));
  return g;
}
function buildWater() {
  const geo = new THREE.PlaneGeometry(26, 260, 18, 88); geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, MAT.water);
  m.position.set(0, 0, -10); m.receiveShadow = true;
  m.userData.base = Float32Array.from(geo.attributes.position.array); return m;
}
function buildQuays() {
  const g = new THREE.Group(), inner = CFG.canalHalf, outer = 22, len = 300;
  const hinter = std({ color: 0x2b2733, roughness: 1 });
  for (const s of [-1, 1]) {   // dark hinterland behind the quarter so no slab edge ever shows
    const f = mesh(new THREE.PlaneGeometry(180, 500), hinter, s * 112, CFG.quayTop - 0.05, -10, false);
    f.rotation.x = -Math.PI / 2; g.add(f);
  }
  for (const s of [-1, 1]) {
    const blk = new THREE.Mesh(new THREE.BoxGeometry(outer - inner, 5, len),
      [MAT.quayWall, MAT.quayWall, MAT.pave, MAT.stoneDark, MAT.quayWall, MAT.quayWall]);
    blk.position.set(s * (inner + (outer - inner) / 2), CFG.quayTop - 2.5, -10);
    blk.receiveShadow = true;
    g.add(blk, box(0.62, 0.3, len, MAT.stoneLight, s * (inner + 0.2), CFG.quayTop + 0.14, -10));
    for (let z = -26; z < 15; z += 6.5) {                          // mooring rings on the lip
      const ring = mesh(new THREE.TorusGeometry(0.16, 0.035, 6, 12), MAT.iron,
        s * (inner + 0.02), CFG.quayTop - 0.16, z);
      ring.rotation.y = Math.PI / 2; g.add(ring);
    }
  }
  return g;
}
/** Iron railings, broken where the bridge lands on each quay. */
function buildRailings() {
  const g = new THREE.Group(), posts = [];
  const postGeo = new THREE.CylinderGeometry(0.055, 0.07, 1.02, 6);
  for (const s of [-1, 1]) for (const [z0, z1] of [[-27, -1.6], [3.6, 15]]) {
    const x = s * (CFG.canalHalf + 0.5);
    for (let z = z0; z <= z1; z += 1.7) posts.push([x, z]);
    for (const h of [0.5, 0.96])
      g.add(strut(V(x, CFG.quayTop + h, z0), V(x, CFG.quayTop + h, z1), 0.035, MAT.iron));
  }
  const inst = new THREE.InstancedMesh(postGeo, MAT.iron, posts.length), dummy = new THREE.Object3D();
  inst.castShadow = true; inst.receiveShadow = true;
  posts.forEach(([x, z], i) => {
    dummy.position.set(x, CFG.quayTop + 0.51, z); dummy.updateMatrix(); inst.setMatrixAt(i, dummy.matrix);
  });
  g.add(inst); return g;
}
function buildBridge() {
  const g = new THREE.Group(), H = CFG.bridgeHalf, W = CFG.bridgeW, N = 40;
  const body = new THREE.Shape();                                  // humped slab...
  body.moveTo(-H, -1.8); body.lineTo(-H, CFG.quayTop);
  for (let i = 1; i <= N; i++) { const x = -H + 2 * H * i / N; body.lineTo(x, humpY(x)); }
  body.lineTo(H, -1.8); body.closePath();
  const s = CFG.springX, rise = CFG.apexY - CFG.springY;            // ...pierced by a segmental arch
  const R = (rise * rise + s * s) / (2 * rise), cy = CFG.apexY - R, a0 = Math.atan2(CFG.springY - cy, s);
  const hole = new THREE.Path();
  hole.moveTo(-s, -1.7); hole.lineTo(-s, CFG.springY);
  hole.absarc(0, cy, R, Math.PI - a0, a0, true);
  hole.lineTo(s, -1.7); hole.closePath(); body.holes.push(hole);
  const bodyGeo = new THREE.ExtrudeGeometry(body, { depth: W, bevelEnabled: false, curveSegments: 26 });
  bodyGeo.translate(0, 0, -W / 2);
  g.add(mesh(bodyGeo, MAT.stone));
  const band = (lo, hi, depth, mat, zc) => {                        // band following the deck hump
    const sh = new THREE.Shape(); sh.moveTo(-H, humpY(-H) + lo);
    for (let i = 1; i <= N; i++) { const x = -H + 2 * H * i / N; sh.lineTo(x, humpY(x) + lo); }
    sh.lineTo(H, humpY(H) + hi);
    for (let i = N - 1; i >= 0; i--) { const x = -H + 2 * H * i / N; sh.lineTo(x, humpY(x) + hi); }
    sh.closePath();
    const gm = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: false });
    gm.translate(0, 0, zc - depth / 2); return mesh(gm, mat);
  };
  g.add(band(0, 0.14, W - 0.2, MAT.deck, 0));                       // cobbled roadway
  for (const zs of [-1, 1]) {
    g.add(band(0.12, 0.9, 0.3, MAT.stone, zs * (W / 2 - 0.16)));    // parapet
    g.add(band(0.9, 1.06, 0.46, MAT.stoneLight, zs * (W / 2 - 0.16)));
    g.add(box(0.5, 0.62, 0.16, MAT.stoneLight, 0, CFG.apexY + 0.3, zs * (W / 2 + 0.03)));  // keystone
    for (const a of [0.55, 1.05, 2.09, 2.59]) {                     // voussoir accents
      const v = box(0.3, 0.46, 0.14, MAT.stoneLight, Math.cos(a) * (R + 0.16),
        cy + Math.sin(a) * (R + 0.16), zs * (W / 2 + 0.03));
      v.rotation.z = a - Math.PI / 2; g.add(v);
    }
  }
  return g;
}

/* ------------------ 7. BUILDERS — houses, tower, laundry ------------------ */
function buildHouse(spec) {
  const g = new THREE.Group(), w = spec.w, h = spec.h, d = CFG.houseDepth;
  const { map, emis } = facadeTextures(spec.color, spec.seed, spec.floors, spec.cols);
  const sideEmis = emis.clone(); sideEmis.repeat.set(d / w, 1);    // flank walls keep a dimmer glow
  const brick = std({ map: map.clone(), emissive: 0xffffff, emissiveMap: sideEmis,
    emissiveIntensity: 0.55, roughness: 0.95 });
  brick.map.repeat.set(d / w, 1);
  const front = std({ map, emissive: 0xffffff, emissiveMap: emis, emissiveIntensity: 1.4, roughness: 0.95 });
  const bMap = map.clone(), bEmis = emis.clone();
  bMap.repeat.x = -1; bMap.offset.x = 1; bEmis.repeat.x = -1; bEmis.offset.x = 1;
  const back = std({ map: bMap, emissive: 0xffffff, emissiveMap: bEmis, emissiveIntensity: 0.95, roughness: 0.95 });
  const rear = mesh(new THREE.PlaneGeometry(w, h), back, 0, h / 2, -d / 2 - 0.02);
  rear.rotation.y = Math.PI;
  g.add(mesh(new THREE.BoxGeometry(w, h, d), brick, 0, h / 2, 0), rear,
    mesh(new THREE.PlaneGeometry(w, h), front, 0, h / 2, d / 2 + 0.02));
  const roofH = w * 0.62, tri = new THREE.Shape();                  // pantiled roof behind the gable
  tri.moveTo(-w / 2, 0); tri.lineTo(w / 2, 0); tri.lineTo(0, roofH); tri.closePath();
  const roofGeo = new THREE.ExtrudeGeometry(tri, { depth: d, bevelEnabled: false });
  roofGeo.translate(0, 0, -d / 2);
  g.add(mesh(roofGeo, ROOF_MATS[spec.roof], 0, h, 0));
  const gh = spec.gableH;
  if (spec.style === 'step') {                                      // trapgevel
    for (let i = 0; i < 5; i++) {
      const sw = w * (1 - i * 0.165), sy = h + gh * (i + 0.5) / 5;
      g.add(box(sw, gh / 5 + 0.04, 0.42, brick, 0, sy, d / 2 - 0.2),
        box(sw + 0.1, 0.1, 0.5, MAT.stoneLight, 0, sy + gh / 10, d / 2 - 0.2));
    }
  } else {
    const sh = new THREE.Shape();
    if (spec.style === 'bell') {                                    // klokgevel
      sh.moveTo(-w / 2, 0); sh.lineTo(-w / 2, gh * 0.22);
      sh.bezierCurveTo(-w / 2, gh * 0.68, -w * 0.21, gh * 0.52, -w * 0.21, gh * 0.88);
      sh.lineTo(-w * 0.21, gh); sh.lineTo(w * 0.21, gh); sh.lineTo(w * 0.21, gh * 0.88);
      sh.bezierCurveTo(w * 0.21, gh * 0.52, w / 2, gh * 0.68, w / 2, gh * 0.22);
      sh.lineTo(w / 2, 0); sh.closePath();
    } else {                                                        // tuitgevel
      sh.moveTo(-w / 2, 0); sh.lineTo(-w * 0.17, gh); sh.lineTo(w * 0.17, gh);
      sh.lineTo(w / 2, 0); sh.closePath();
    }
    const geo = new THREE.ExtrudeGeometry(sh, { depth: 0.44, bevelEnabled: false, curveSegments: 12 });
    geo.translate(0, 0, d / 2 - 0.42);
    g.add(mesh(geo, brick, 0, h, 0), box(w * 0.5, 0.16, 0.56, MAT.stoneLight, 0, h + gh + 0.06, d / 2 - 0.2));
  }
  const attic = mesh(new THREE.PlaneGeometry(w * 0.3, w * 0.3), MAT.litPane, 0, h + gh * 0.42, d / 2 + 0.05);
  g.add(box(w + 0.22, 0.22, d + 0.16, MAT.trim, 0, h - 0.11, 0), attic,        // cornice + attic light
    box(0.16, 0.16, 0.95, MAT.wood, 0, h + gh + 0.28, d / 2 + 0.3),            // hoisting beam
    strut(V(0, h + gh + 0.22, d / 2 + 0.66), V(0, h + gh - 0.16, d / 2 + 0.66), 0.03, MAT.iron),
    box(w * 0.42, 0.18, 0.5, MAT.stoneLight, -w * 0.22, 0.09, d / 2 + 0.22),   // stoop
    box(0.5, 1.1, 0.5, brick, w * 0.22, h + roofH + 0.2, -d * 0.2));           // chimney
  g.userData = { attic, phase: rng(0, 6.28), flicker: spec.flicker }; return g;
}
/** Distant brick church tower closing the canal vista. */
function buildChurchTower() {
  const g = new THREE.Group(); let y = 0;
  for (const [wd, ht] of [[3.2, 7.5], [2.7, 5.5], [2.2, 4.2]]) {

  for (const s of [-1, 1]) g.add(mesh(new THREE.PlaneGeometry(0.8, 1.7), MAT.lampGlass, s * 0.55, y - 1.1, 1.14));

/** Line strung between two upper windows with garments pegged along it. */
function buildLaundryLine(a, b, n) {
  const g = new THREE.Group(), items = [];
  for (let i = 0; i < 14; i++) g.add(strut(sagPt(a, b, i / 14, 1.15), sagPt(a, b, (i + 1) / 14, 1.15), 0.022, MAT.iron, 4));
  for (let i = 0; i < n; i++) {
    const p = sagPt(a, b, 0.1 + 0.8 * (i / (n - 1)), 1.15), w = rng(0.8, 1.25), h = rng(1.0, 1.8);
    const cloth = mesh(new THREE.PlaneGeometry(w, h), CLOTH_MATS[i % CLOTH_MATS.length], p.x, p.y - h / 2 - 0.05, p.z);
    cloth.rotation.y = Math.PI / 2;

    cyl(0.13, 0.13, 0.12, MAT.iron, 0, 3.18, 0, 8), lantern, cap, sph(0.06, MAT.iron, 0, 4.03, 0, 6));
  for (const s of [-1, 1]) g.add(strut(V(s * 0.1, 3.24, 0), V(s * 0.22, 3.76, 0), 0.018, MAT.iron, 4));

  size: 0.34, transparent: true, opacity: 0.3, depthWrite: false, blending: THREE.AdditiveBlending }));
scene.add(motes);

/* ----------------------------- 10. LIGHTING RIG --------------------------- */
scene.add(new THREE.HemisphereLight(0x6e7fc0, 0x2b2434, 0.85), new THREE.AmbientLight(0x4a4468, 0.55));
const key = new THREE.DirectionalLight(0xffc08a, 2.0);        // low afterglow from the camera side
key.position.set(32, 16, 26); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -30; key.shadow.camera.right = 30;
key.shadow.camera.top = 28; key.shadow.camera.bottom = -22;
key.shadow.camera.near = 1; key.shadow.camera.far = 130;
key.shadow.bias = -0.0008; key.shadow.normalBias = 0.03;
key.shadow.camera.updateProjectionMatrix();
key.target.position.set(0, 2, -6); scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0x7d90e0, 0.8);        // cool dusk rim from behind
rim.position.set(-26, 15, -28); scene.add(rim);
const archLight = new THREE.PointLight(0xffb066, 13, 19, 2);  // keeps the arch soffit readable
archLight.position.set(0, 1.3, CFG.bridgeZ); scene.add(archLight);
const quayGlow = new THREE.PointLight(0xffa860, 6, 20, 2);    // warm spill onto the near quay
quayGlow.position.set(-5.0, 3.2, -2); scene.add(quayGlow);

/* ---------------------------- 11. ANIMATION LOOP -------------------------- */
const clock = new THREE.Clock();
const waterPos = water.geometry.attributes.position, waterBase = water.userData.base;
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  // 1. canal surface: crossing swells plus a slowly scrolling ripple texture
  for (let i = 0; i < waterPos.count; i++) {
    const x = waterBase[i * 3], z = waterBase[i * 3 + 2];
    waterPos.setY(i, Math.sin(x * 0.85 + t * 1.05) * 0.032 + Math.sin(z * 0.62 - t * 0.85) * 0.036
      + Math.sin((x + z) * 1.5 + t * 1.7) * 0.016);
  }
  waterPos.needsUpdate = true; water.geometry.computeVertexNormals();
  TEX.water.offset.y = (t * 0.006) % 1; TEX.water.offset.x = Math.sin(t * 0.11) * 0.01;
  // 2. gas lamps flicker, each lantern on its own phase, halos breathing with them
  for (const l of lamps) {
    const d = l.userData;
    const f = 0.85 + Math.sin(t * 4.6 + d.phase) * 0.08 + Math.sin(t * 12.9 + d.phase * 2.3) * 0.05;
    d.lantern.material.emissiveIntensity = 2.6 * f;
    d.halo.material.opacity = 0.42 + f * 0.2; d.halo.scale.setScalar(2.4 + f * 0.5);
    if (d.light) d.light.intensity = 14 * f;
  }
  // 3. ducks glide along the canal and slip under the bridge arch
  for (const d of ducks) {
    const u = d.userData, z = ((u.z0 + u.dir * t * u.speed * 3 + 40) % 34) - 18;
    d.position.set(u.lane + Math.sin(t * 0.5 + u.phase) * 0.35, 0.02 + Math.sin(t * 1.4 + u.phase) * 0.022, z);
    d.rotation.y = u.dir * Math.PI / 2 + Math.sin(t * 0.5 + u.phase) * 0.22;
    u.head.position.y = 0.33 - Math.max(0, Math.sin(t * 1.9 + u.phase) - 0.86) * 1.1;
    u.wake.material.opacity = 0.12 + 0.06 * (0.5 + 0.5 * Math.sin(t * 2 + u.phase));
  }
  // 4. the moored boat rocks against its lines, lantern brightening as it swings
  const roll = Math.sin(t * 0.66) * 0.028;
  boat.rotation.z = roll; boat.rotation.x = Math.sin(t * 0.47 + 1.2) * 0.016;
  boat.position.y = 0.12 + Math.sin(t * 0.8) * 0.035;
  boat.userData.lantern.material.emissiveIntensity = 2.4 + Math.sin(t * 2.3) * 0.5;
  boat.userData.boatLight.intensity = 5 + Math.sin(t * 2.3) * 1.1;
  boat.userData.planters.forEach((p, i) => { p.rotation.z = -roll * 0.6 + Math.sin(t + i) * 0.01; });
  // 5. laundry sways, quay trees stir, attic candles flicker behind the gables
  for (const it of laundry.userData.items) {
    it.cloth.rotation.x = Math.sin(t * 1.15 + it.phase) * 0.28;
    it.cloth.rotation.z = Math.sin(t * 0.8 + it.phase * 1.7) * 0.09;
  }
  for (const tr of trees) {
    tr.userData.crown.rotation.z = Math.sin(t * 0.55 + tr.userData.phase) * 0.038;
    tr.userData.crown.position.x = Math.sin(t * 0.4 + tr.userData.phase) * 0.07;
  }
  for (const h of houses) {
    const d = h.userData;
    d.attic.material.emissiveIntensity = d.flicker
      ? 1.5 + Math.sin(t * 6.2 + d.phase) * 0.55 + Math.sin(t * 17 + d.phase) * 0.2 : 1.9;
  }
  // 6. reflections shimmer and stretch, mist drifts down the canal
  for (const r of reflections) {
    const p = r.userData.phase;
    r.material.opacity = r.userData.op * (0.72 + 0.28 * Math.sin(t * 1.3 + p));
    r.scale.set(1 + Math.sin(t * 0.9 + p) * 0.09, 1 + Math.sin(t * 0.6 + p) * 0.06, 1);
  }
  const mp = motes.geometry.attributes.position;
  for (let i = 0; i < MOTES; i++) {
    let z = mp.getZ(i) + 0.011 + Math.sin(t * 0.3 + i) * 0.004;
    if (z > 15) z = -31;
    mp.setZ(i, z); mp.setY(i, mp.getY(i) + Math.sin(t * 0.7 + i * 0.9) * 0.0022);
  }
  mp.needsUpdate = true; motes.material.opacity = 0.24 + Math.sin(t * 0.6) * 0.07;
  archLight.intensity = 13 + Math.sin(t * 1.7) * 1.1;
  controls.update();
  renderer.render(scene, camera);
}
animate();

/* -------------------------------- 12. RESIZE ------------------------------ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
