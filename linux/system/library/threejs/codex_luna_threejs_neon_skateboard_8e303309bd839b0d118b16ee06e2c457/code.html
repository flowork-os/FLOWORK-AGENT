<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Skateboard</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02020a;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02020a);
scene.fog = new THREE.FogExp2(0x02020a, 0.035);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.9, 3.2, 5.4);
camera.lookAt(0, -0.05, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.15;
controls.minDistance = 3.7;
controls.maxDistance = 9;
controls.target.set(0, -0.1, 0);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  1.55,
  0.72,
  0.08
);
composer.addPass(bloom);

scene.add(new THREE.AmbientLight(0x16102d, 1.8));
const magentaLight = new THREE.PointLight(0xff168f, 4.5, 7, 2);
magentaLight.position.set(-2.7, 1.2, 2.1);
scene.add(magentaLight);
const cyanLight = new THREE.PointLight(0x00eaff, 4.5, 7, 2);
cyanLight.position.set(2.6, -0.4, -2);
scene.add(cyanLight);

const root = new THREE.Group();
root.rotation.set(0.12, -0.16, -0.03);
scene.add(root);

const magenta = new THREE.LineBasicMaterial({
  color: 0xff168f,
  transparent: true,
  opacity: 0.98,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const cyan = new THREE.LineBasicMaterial({
  color: 0x00eaff,
  transparent: true,
  opacity: 0.98,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const violet = new THREE.LineBasicMaterial({
  color: 0xa72dff,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const length = 4.65;
const width = 1.34;
const halfL = length / 2;
const halfW = width / 2;
const nx = 48;
const nz = 14;

function deckHeight(x, z) {
  const edgeLift = 0.13 * Math.pow(z / halfW, 2);
  const end = Math.max(0, Math.abs(x) - 1.58);
  const kick = 0.32 * Math.pow(end / (halfL - 1.58), 2);
  return 0.08 + edgeLift + kick;
}

function deckPoint(x, z, underside = false) {
  const top = deckHeight(x, z);
  return new THREE.Vector3(x, underside ? top - 0.14 : top, z);
}

function makeLine(points, material, closed = false) {
  const vertices = [];
  const count = points.length;
  for (let i = 0; i < count - 1; i++) {
    vertices.push(
      points[i].x, points[i].y, points[i].z,
      points[i + 1].x, points[i + 1].y, points[i + 1].z
    );
  }
  if (closed && count > 2) {
    const a = points[count - 1];
    const b = points[0];
    vertices.push(a.x, a.y, a.z, b.x, b.y, b.z);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  const line = new THREE.LineSegments(geometry, material);
  root.add(line);
  return line;
}

const outlineTop = [];
const outlineBottom = [];
for (let i = 0; i <= nx; i++) {
  const x = -halfL + (length * i / nx);
  outlineTop.push(deckPoint(x, -halfW));
}
for (let i = nx; i >= 0; i--) {
  const x = -halfL + (length * i / nx);
  outlineTop.push(deckPoint(x, halfW));
}
makeLine(outlineTop, magenta, true);

for (let i = 0; i <= nx; i++) {
  const x = -halfL + (length * i / nx);
  outlineBottom.push(deckPoint(x, -halfW, true));
}
for (let i = nx; i >= 0; i--) {
  const x = -halfL + (length * i / nx);
  outlineBottom.push(deckPoint(x, halfW, true));
}
makeLine(outlineBottom, violet, true);

for (let i = 0; i <= nx; i += 2) {
  const x = -halfL + (length * i / nx);
  makeLine([
    deckPoint(x, -halfW),
    deckPoint(x, halfW)
  ], i % 4 === 0 ? cyan : violet);
  makeLine([
    deckPoint(x, -halfW, true),
    deckPoint(x, halfW, true)
  ], violet);
}

for (let j = 1; j < nz; j++) {
  const z = -halfW + width * j / nz;
  const points = [];
  for (let i = 0; i <= nx; i++) {
    const x = -halfL + length * i / nx;
    points.push(deckPoint(x, z));
  }
  makeLine(points, j % 3 === 0 ? cyan : magenta);
}

for (const x of [-halfL, halfL]) {
  makeLine([deckPoint(x, -halfW), deckPoint(x, -halfW, true)], cyan);
  makeLine([deckPoint(x, halfW), deckPoint(x, halfW, true)], magenta);
}

function cylinderWire(radius, depth, radialSegments, material, position, rotation = new THREE.Euler()) {
  const geometry = new THREE.CylinderGeometry(radius, radius, depth, radialSegments, 1, true);
  const edges = new THREE.EdgesGeometry(geometry, 18);
  const line = new THREE.LineSegments(edges, material);
  line.position.copy(position);
  line.rotation.copy(rotation);
  root.add(line);
  return line;
}

function lineBetween(a, b, material) {
  return makeLine([a, b], material);
}

const truckXs = [-1.42, 1.42];
for (let t = 0; t < truckXs.length; t++) {
  const x = truckXs[t];
  const baseY = -0.2;
  const truckMat = t === 0 ? cyan : magenta;

  cylinderWire(0.12, 1.23, 8, truckMat, new THREE.Vector3(x, baseY, 0), new THREE.Euler(Math.PI / 2, 0, 0));

  const hanger = [
    new THREE.Vector3(x - 0.08, baseY + 0.05, -0.58),
    new THREE.Vector3(x, baseY - 0.16, 0),
    new THREE.Vector3(x + 0.08, baseY + 0.05, 0.58)
  ];
  makeLine(hanger, truckMat);

  const mountY = deckHeight(x, 0) - 0.17;
  lineBetween(
    new THREE.Vector3(x - 0.25, mountY, -0.32),
    new THREE.Vector3(x + 0.25, mountY, 0.32),
    violet
  );
  lineBetween(
    new THREE.Vector3(x - 0.25, mountY, 0.32),
    new THREE.Vector3(x + 0.25, mountY, -0.32),
    violet
  );
}

function createWheel(x, z, material) {
  const y = -0.53;
  const wheel = new THREE.Group();
  wheel.position.set(x, y, z);
  root.add(wheel);

  const torus = new THREE.TorusGeometry(0.285, 0.055, 8, 20);
  const torusEdges = new THREE.EdgesGeometry(torus, 15);
  const torusLine = new THREE.LineSegments(torusEdges, material);
  wheel.add(torusLine);

  const inner = new THREE.TorusGeometry(0.19, 0.025, 6, 16);
  const innerEdges = new THREE.EdgesGeometry(inner, 15);
  const innerLine = new THREE.LineSegments(innerEdges, material === cyan ? magenta : cyan);
  wheel.add(innerLine);

  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    const p1 = new THREE.Vector3(Math.cos(a) * 0.06, Math.sin(a) * 0.06, 0);
    const p2 = new THREE.Vector3(Math.cos(a) * 0.255, Math.sin(a) * 0.255, 0);
    const geo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
    wheel.add(new THREE.LineSegments(geo, material));
  }

  cylinderWire(0.08, 0.08, 8, violet, new THREE.Vector3(x, y, z), new THREE.Euler(Math.PI / 2, 0, 0));
}

createWheel(-1.42, -0.59, cyan);
createWheel(-1.42, 0.59, magenta);
createWheel(1.42, -0.59, magenta);
createWheel(1.42, 0.59, cyan);

const axleGlow = new THREE.Group();
root.add(axleGlow);
for (const x of truckXs) {
  makeLine([
    new THREE.Vector3(x, -0.53, -0.67),
    new THREE.Vector3(x, -0.53, 0.67)
  ], cyan);
}

const haloGeometry = new THREE.BufferGeometry();
const haloPoints = [];
for (let i = 0; i < 120; i++) {
  const a = (i / 120) * Math.PI * 2;
  haloPoints.push(Math.cos(a) * 3.05, -0.85 + Math.sin(a) * 0.25, Math.sin(a) * 1.25);
}
haloGeometry.setAttribute("position", new THREE.Float32BufferAttribute(haloPoints, 3));
const halo = new THREE.LineLoop(haloGeometry, new THREE.LineBasicMaterial({
  color: 0x3c0b70,
  transparent: true,
  opacity: 0.5,
  blending: THREE.AdditiveBlending,
  depthWrite: false
}));
halo.rotation.x = -0.12;
root.add(halo);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();
  const pulse = 0.78 + Math.sin(time * 2.2) * 0.18 + Math.sin(time * 5.1) * 0.05;
  magenta.opacity = pulse;
  cyan.opacity = 0.82 + Math.sin(time * 2.2 + 1.4) * 0.14;
  violet.opacity = 0.72 + Math.sin(time * 2.8) * 0.12;
  bloom.strength = 1.35 + Math.sin(time * 2.1) * 0.24;
  magentaLight.intensity = 3.9 + Math.sin(time * 2.2) * 0.8;
  cyanLight.intensity = 3.9 + Math.sin(time * 2.2 + 1.5) * 0.8;
  halo.material.opacity = 0.38 + Math.sin(time * 1.6) * 0.12;

  controls.update();
  composer.render();
}

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
