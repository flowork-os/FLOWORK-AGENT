<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Low Dune Field</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #191a1d; }
  #app { position: fixed; inset: 0; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #c9c4bb; opacity: 0.55; user-select: none; pointer-events: none;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="hint">drag to orbit · scroll to zoom · auto-rotating</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ *
 *  Renderer
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

/* ------------------------------------------------------------------ *
 *  Scene & camera
 * ------------------------------------------------------------------ */
const scene = new THREE.Scene();
const BG = new THREE.Color(0x191a1d);          // neutral dark studio
scene.background = BG;
scene.fog = new THREE.Fog(BG, 30, 74);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(16, 8.5, 17);

/* ------------------------------------------------------------------ *
 *  Lighting  (hemisphere + directional key + fill + rim)
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xfff0d8, 0x5a4632, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2d0, 2.5);
key.position.set(15, 17, 9);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 70;
key.shadow.camera.left = -16;
key.shadow.camera.right = 16;
key.shadow.camera.top = 16;
key.shadow.camera.bottom = -16;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x93a9c6, 0.5);   // cool sky fill
fill.position.set(-13, 8, -5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd7a0, 0.95);   // warm back rim
rim.position.set(-7, 6, -15);
scene.add(rim);

/* ------------------------------------------------------------------ *
 *  Procedural noise helpers
 * ------------------------------------------------------------------ */
function hash(x, y) {
  const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return n - Math.floor(n);
}
function valueNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi),     b = hash(xi + 1, yi);
  const c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
}
function fbm(x, y) {
  let sum = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < 4; i++) { sum += amp * valueNoise(x * freq, y * freq); freq *= 2; amp *= 0.5; }
  return sum;
}

// Broad, gently rolling low dunes (wind ridges migrating along x)
function duneHeight(x, z) {
  let h = 1.8 * (fbm(x * 0.045 + 5.2, z * 0.045 + 9.1) - 0.5);
  const warp = fbm(x * 0.08, z * 0.08) * 2.0;
  h += 0.275 * Math.sin(x * 0.22 + warp) + 0.15;
  h += 0.25 * (fbm(x * 0.15 + 2.0, z * 0.15 + 7.0) - 0.5);
  return h;
}
// Fine wind ripples (small parallel ridges perpendicular to the wind)
function rippleHeight(x, z) {
  const meander = Math.sin(z * 0.5) * 0.6 + fbm(x * 0.3, z * 0.3) * 1.2;
  let r = Math.sin(x * 13.0 + meander * 3.0);
  r = Math.sign(r) * Math.pow(Math.abs(r), 0.8);          // slightly sharpened crests
  const r2 = Math.sin(x * 26.0 + meander * 4.0) * 0.4;
  return 0.028 * r + 0.010 * r2;
}
function sandHeight(x, z) { return duneHeight(x, z) + rippleHeight(x, z); }

/* ------------------------------------------------------------------ *
 *  ONE centered object: the dune field group
 * ------------------------------------------------------------------ */
const duneField = new THREE.Group();
scene.add(duneField);

/* ---- Sand surface --------------------------------------------------- */
const FIELD = 22, SEG = 340;
const sandGeo = new THREE.PlaneGeometry(FIELD, FIELD, SEG, SEG);
sandGeo.rotateX(-Math.PI / 2);

const pos = sandGeo.attributes.position;
let minH = Infinity, maxH = -Infinity;
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i);
  const y = sandHeight(x, z);
  pos.setY(i, y);
  if (y < minH) minH = y;
  if (y > maxH) maxH = y;
}
sandGeo.computeVertexNormals();

// warm sand vertex colours: darker warm hollows -> pale lit crests, with grain speckle
const colAttr = new Float32Array(pos.count * 3);
const cLow = new THREE.Color(0xb0885a);
const cHigh = new THREE.Color(0xe9cfa2);
const tmp = new THREE.Color();
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
  const t = THREE.MathUtils.clamp((y - minH) / (maxH - minH), 0, 1);
  tmp.copy(cLow).lerp(cHigh, t * 0.85 + 0.1);
  const speckle = 0.9 + 0.22 * valueNoise(x * 4.0 + 50, z * 4.0 + 50);
  tmp.multiplyScalar(speckle);
  colAttr[i * 3] = tmp.r; colAttr[i * 3 + 1] = tmp.g; colAttr[i * 3 + 2] = tmp.b;
}
sandGeo.setAttribute('color', new THREE.BufferAttribute(colAttr, 3));

const sandMat = new THREE.MeshStandardMaterial({
  vertexColors: true, roughness: 0.97, metalness: 0.0
});
const sand = new THREE.Mesh(sandGeo, sandMat);
sand.castShadow = true;
sand.receiveShadow = true;
duneField.add(sand);

/* ---- Sparse fence: thin posts + sagging wire ----------------------- */
const fence = new THREE.Group();
duneField.add(fence);

const woodPostMat = new THREE.MeshStandardMaterial({ color: 0x9c7d54, roughness: 0.9, metalness: 0.0 });
const wireMat = new THREE.MeshStandardMaterial({ color: 0x51473a, roughness: 0.5, metalness: 0.55 });

const postH = 1.15;
const posts = [];
for (let x = -7; x <= 6.001; x += 2.1) {
  const z = 3.5 + Math.sin(x * 0.2) * 0.25 + (valueNoise(x * 0.7, 4.0) - 0.5) * 0.3;
  const sY = sandHeight(x, z);
  const geo = new THREE.CylinderGeometry(0.028, 0.04, postH, 8);
  const post = new THREE.Mesh(geo, woodPostMat);
  post.position.set(x, sY - 0.12 + postH / 2, z);
  post.rotation.z = (valueNoise(x, 1.3) - 0.5) * 0.1;   // gentle weathered lean
  post.rotation.x = (valueNoise(x, 7.7) - 0.5) * 0.1;
  post.castShadow = true;
  post.receiveShadow = true;
  fence.add(post);
  posts.push({ x, z, sandY: sY - 0.12 });
}

// two wire strands, each sagging between neighbouring posts
for (let i = 0; i < posts.length - 1; i++) {
  const p0 = posts[i], p1 = posts[i + 1];
  for (const wh of [0.55, 0.95]) {
    const a = new THREE.Vector3(p0.x, p0.sandY + wh, p0.z);
    const b = new THREE.Vector3(p1.x, p1.sandY + wh, p1.z);
    const mid = a.clone().lerp(b, 0.5); mid.y -= 0.13;   // catenary-like sag
    const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
    const geo = new THREE.TubeGeometry(curve, 14, 0.006, 5, false);
    const wire = new THREE.Mesh(geo, wireMat);
    wire.castShadow = true;
    fence.add(wire);
  }
}

/* ---- Short wooden boardwalk crossing the sand ---------------------- */
const boardwalk = new THREE.Group();
duneField.add(boardwalk);

const stringerMat = new THREE.MeshStandardMaterial({ color: 0x866a45, roughness: 0.85, metalness: 0.0 });
const supportMat  = new THREE.MeshStandardMaterial({ color: 0x7c6340, roughness: 0.88, metalness: 0.0 });
const plankBaseMat = new THREE.MeshStandardMaterial({ color: 0xcaa066, roughness: 0.82, metalness: 0.0 });

const walkZ = -1.0, halfW = 0.66;
// find a deck height that clears the sand along the walk centreline
let maxWalk = -Infinity;
for (let x = -2.6; x <= 2.6; x += 0.2) maxWalk = Math.max(maxWalk, sandHeight(x, walkZ));
const deckY = maxWalk + 0.28;
const plankT = 0.045;
const plankBottom = deckY - plankT;
const stringerH = 0.18;
const stringerBottom = plankBottom - stringerH;

// stringers (two beams running along the walk)
for (const sz of [walkZ - 0.52, walkZ + 0.52]) {
  const geo = new THREE.BoxGeometry(5.1, stringerH, 0.1);
  const beam = new THREE.Mesh(geo, stringerMat);
  beam.position.set(0, stringerBottom + stringerH / 2, sz);
  beam.castShadow = true; beam.receiveShadow = true;
  boardwalk.add(beam);
}

// support posts reaching down into the sand
for (const px of [-2.2, -0.9, 0.9, 2.2]) {
  for (const sz of [walkZ - 0.52, walkZ + 0.52]) {
    const base = sandHeight(px, sz) - 0.12;
    const top = stringerBottom;
    const h = top - base;
    const geo = new THREE.BoxGeometry(0.09, h, 0.09);
    const sp = new THREE.Mesh(geo, supportMat);
    sp.position.set(px, base + h / 2, sz);
    sp.castShadow = true; sp.receiveShadow = true;
    boardwalk.add(sp);
  }
}

// deck planks (laid across the walk) with subtle weathered variation
const plankLen = halfW * 2 + 0.02;
let idx = 0;
for (let x = -2.44; x <= 2.44; x += 0.2, idx++) {
  const mat = plankBaseMat.clone();
  mat.color.offsetHSL(
    (valueNoise(idx * 3.1, 0.5) - 0.5) * 0.02,
    (valueNoise(idx * 1.7, 2.5) - 0.5) * 0.08,
    (valueNoise(idx * 2.3, 5.5) - 0.5) * 0.1
  );
  const geo = new THREE.BoxGeometry(0.16, plankT, plankLen);
  const plank = new THREE.Mesh(geo, mat);
  plank.position.set(x, deckY - plankT / 2 + (valueNoise(idx, 9) - 0.5) * 0.006, walkZ);
  plank.rotation.x = (valueNoise(idx, 3) - 0.5) * 0.02;   // slight cupping
  plank.castShadow = true; plank.receiveShadow = true;
  boardwalk.add(plank);
}

/* ------------------------------------------------------------------ *
 *  Studio shadow-catcher ground (receives shadows only)
 * ------------------------------------------------------------------ */
const shadowGround = new THREE.Mesh(
  new THREE.PlaneGeometry(240, 240),
  new THREE.ShadowMaterial({ opacity: 0.32 })
);
shadowGround.rotation.x = -Math.PI / 2;
shadowGround.position.y = minH - 0.02;
shadowGround.receiveShadow = true;
scene.add(shadowGround);

/* ------------------------------------------------------------------ *
 *  Controls
 * ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.target.set(0, 0.3, 0);
controls.minDistance = 8;
controls.maxDistance = 44;
controls.maxPolarAngle = Math.PI * 0.49;
controls.update();

/* ------------------------------------------------------------------ *
 *  Resize + render loop
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
