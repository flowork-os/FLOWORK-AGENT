<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Base Cabinet</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e9e6e1}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e6e1);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
camera.position.set(1.7, 1.35, 2.0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

// ---------- Materials ----------
const matCarcass = new THREE.MeshStandardMaterial({ color: 0xb9b2a6, roughness: 0.6 });
const matFront   = new THREE.MeshStandardMaterial({ color: 0x8f9a88, roughness: 0.45 });
const matTop     = new THREE.MeshStandardMaterial({ color: 0xf1efe9, roughness: 0.3 });
const matKick    = new THREE.MeshStandardMaterial({ color: 0x2c2c2e, roughness: 0.7 });
const matMetal   = new THREE.MeshStandardMaterial({ color: 0xc3c7cb, metalness: 0.9, roughness: 0.28 });

// ---------- Cabinet ----------
const cab = new THREE.Group();
const W = 0.9, D = 0.6, KICK = 0.1, BODY = 0.76, TOPT = 0.04, g = 0.004;

function box(geo, mat, x, y, z){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  cab.add(m);
  return m;
}

// Toe-kick plinth (recessed)
box(new THREE.BoxGeometry(W - 0.06, KICK, D - 0.08), matKick, 0, KICK/2, -0.03);

// Carcass
box(new THREE.BoxGeometry(W, BODY, D), matCarcass, 0, KICK + BODY/2, 0);

// Countertop with slight overhang
box(new RoundedBoxGeometry(W + 0.04, TOPT, D + 0.035, 3, 0.008), matTop, 0, KICK + BODY + TOPT/2, 0.008);

// Fronts (flat panels, slightly proud of carcass)
const ft = 0.02, fz = D/2 + ft/2 + 0.001;
const fx0 = -W/2 + g, fx1 = W/2 - g;         // horizontal extent
const fy0 = KICK + g, fy1 = KICK + BODY - g; // vertical extent
const drawerH = 0.165;
const doorH = (fy1 - fy0) - drawerH - g;
const doorW = (fx1 - fx0 - g) / 2;

// Drawer front (top)
box(new RoundedBoxGeometry(fx1 - fx0, drawerH, ft, 3, 0.004), matFront, 0, fy1 - drawerH/2, fz);
// Two doors
const doorY = fy0 + doorH/2;
box(new RoundedBoxGeometry(doorW, doorH, ft, 3, 0.004), matFront, fx0 + doorW/2, doorY, fz);
box(new RoundedBoxGeometry(doorW, doorH, ft, 3, 0.004), matFront, fx1 - doorW/2, doorY, fz);

// Slim bar handle
function handle(x, y, len){
  const h = new THREE.Group();
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, len, 16), matMetal);
  bar.rotation.z = Math.PI/2;
  bar.position.z = 0.028;
  h.add(bar);
  for (const s of [-1, 1]){
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, 0.028, 12), matMetal);
    post.rotation.x = Math.PI/2;
    post.position.set(s * (len/2 - 0.015), 0, 0.014);
    h.add(post);
  }
  h.position.set(x, y, fz + ft/2);
  h.traverse(o => { o.castShadow = true; });
  cab.add(h);
}
handle(0, fy1 - drawerH/2, 0.24);                          // drawer
handle(fx0 + doorW/2, doorY + doorH/2 - 0.05, 0.18);       // left door
handle(fx1 - doorW/2, doorY + doorH/2 - 0.05, 0.18);       // right door

scene.add(cab);

// ---------- Ground (soft shadow catcher) ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(6, 48).rotateX(-Math.PI/2),
  new THREE.ShadowMaterial({ opacity: 0.22 })
);
ground.receiveShadow = true;
scene.add(ground);

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x9a917f, 0.9));
const key = new THREE.DirectionalLight(0xfff4e0, 2.0);
key.position.set(3, 5, 2.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -2;
key.shadow.camera.right = key.shadow.camera.top = 2;
key.shadow.radius = 6;
scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.5);
fill.position.set(-3, 2, -2);
scene.add(fill);

// ---------- Controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.48, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 1.2;
controls.maxDistance = 5;
controls.maxPolarAngle = Math.PI/2 - 0.02;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
