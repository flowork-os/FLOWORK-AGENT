<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asian Night Market</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0c1028}
  canvas{display:block}
</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   CONFIG & PALETTE — warm stylized night-market mood board
   ============================================================ */
const SEED = 0x39064bb3;
const C = {
  nightSky:  0x0d1230,   // fog + zenith
  paver:     0x4a3b30,   // stone lane base
  woodDark:  0x5a3a22,   // stall frames, crates
  woodLight: 0x8a6038,   // counters, table tops
  bamboo:    0xc9a86a,   // steamer baskets
  lanternRed:0xe83c30,
  lanternGlow:0xff7a3d,
  bulbWarm:  0xffd9a0,
  emberHot:  0xff5a18,
  canvasCream:0xf2e4c8,
  moonBlue:  0x8898d8
};
const AWNING_SETS = [['#d84040','#f5ecd8'], ['#2e8f7a','#f5ecd8'], ['#e0a028','#f5ecd8'], ['#4a68b0','#f0e6d0'], ['#c25a8a','#f5ecd8'], ['#6a9c3e','#f2e8d4']];
const LANE = { halfWidth: 3.2, length: 26 };

/* ============================================================
   PRNG & HELPERS — every random draw goes through rng()
   ============================================================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng = mulberry32(SEED);
const rand = (lo, hi) => lo + (hi - lo) * rng();
const randInt = (lo, hi) => Math.floor(rand(lo, hi + 1));
const pick = arr => arr[Math.floor(rng() * arr.length)];
const animators = [];   // fn(t, dt) hooks executed every frame

/* ============================================================
   RENDERER / SCENE / CAMERA / CONTROLS
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(C.nightSky, 24, 64);

const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 260);
camera.position.set(13, 17, 15);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.3, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.minDistance = 15;
controls.maxDistance = 40;
controls.maxPolarAngle = 1.18;

/* ============================================================
   PROCEDURAL TEXTURES — every surface painted on offscreen canvas
   ============================================================ */
function makeTex(w, h, draw){
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
// Worn stone pavers with mossy joints and warm scuffs
const paverTex = makeTex(512, 512, (g, w, h) => {
  g.fillStyle = '#4a3b30'; g.fillRect(0, 0, w, h);
  const cw = w / 8, chh = h / 10;
  for (let y = 0; y < 10; y++) for (let x = 0; x < 8; x++){
    const off = (y % 2) * cw * 0.5;
    g.fillStyle = `hsl(${randInt(20,32)},${randInt(18,30)}%,${randInt(22,32)}%)`;
    g.fillRect(x * cw + off + 2, y * chh + 2, cw - 4, chh - 4);
  }
  for (let i = 0; i < 500; i++){
    g.fillStyle = `rgba(${randInt(120,200)},${randInt(90,140)},${randInt(50,80)},${rand(0.03,0.1).toFixed(2)})`;
    g.fillRect(rand(0, w), rand(0, h), rand(2, 14), rand(2, 14));
  }
});
paverTex.wrapS = paverTex.wrapT = THREE.RepeatWrapping; paverTex.repeat.set(9, 9);
// Striped awning canvas, one texture per colour pair
function awningTex(a, b){
  return makeTex(256, 128, (g, w, h) => {
    for (let i = 0; i < 10; i++){ g.fillStyle = i % 2 ? b : a; g.fillRect(i * w / 10, 0, w / 10, h); }
    g.fillStyle = 'rgba(60,30,10,0.18)'; g.fillRect(0, h - 16, w, 16);
  });
}
// Brush-painted glyph boards (pseudo-hanzi strokes + red seal)
function brushGlyph(g, cx, cy, s){
  for (let i = 0, n = randInt(3, 5); i < n; i++){
    const k = randInt(0, 4);
    g.lineWidth = s * rand(0.09, 0.14); g.lineCap = 'round';
    g.beginPath();
    if (k === 0)      { const y = cy + rand(-0.3, 0.3) * s; g.moveTo(cx - s * 0.38, y); g.lineTo(cx + s * 0.38, y); }
    else if (k === 1) { const x = cx + rand(-0.3, 0.3) * s; g.moveTo(x, cy - s * 0.38); g.lineTo(x, cy + s * 0.38); }
    else if (k === 2) { g.moveTo(cx - s * 0.32, cy - s * 0.3); g.lineTo(cx + s * 0.28, cy + s * 0.36); }
    else if (k === 3) { g.rect(cx - s * 0.26, cy - s * 0.26, s * 0.52, s * 0.52); }
    else              { g.moveTo(cx - s * 0.36, cy + s * 0.3); g.lineTo(cx, cy - s * 0.36); g.lineTo(cx + s * 0.36, cy + s * 0.3); }
    g.stroke();
  }
}
function signboardTex(glyphs, boardCss, inkCss){
  return makeTex(512, 128, (g, w, h) => {
    g.fillStyle = boardCss; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 60; i++){ // wood grain streaks
      g.fillStyle = `rgba(40,20,8,${rand(0.04,0.12).toFixed(2)})`;
      g.fillRect(rand(0, w), rand(0, h), rand(20, 90), rand(1, 3));
    }
    g.strokeStyle = inkCss;
    const cell = w / (glyphs + 1);
    for (let i = 0; i < glyphs; i++) brushGlyph(g, cell * (i + 1), h / 2, h * 0.62);
    g.fillStyle = '#c22818'; g.fillRect(w - 30, h - 36, 20, 20); // seal stamp
    g.strokeStyle = '#8a5a20'; g.lineWidth = 6; g.strokeRect(4, 4, w - 8, h - 8);
  });
}
// Shophouse backdrop wall: shutters, some windows lit warm
function shophouseTex(){
  return makeTex(256, 256, (g, w, h) => {
    g.fillStyle = `hsl(${randInt(14,26)},${randInt(14,22)}%,${randInt(14,20)}%)`; g.fillRect(0, 0, w, h);
    for (let fy = 0; fy < 2; fy++) for (let fx = 0; fx < 4; fx++){
      const wx = 18 + fx * 60, wy = 30 + fy * 120;
      g.fillStyle = rng() < 0.4 ? `hsl(${randInt(28,40)},85%,${randInt(52,64)}%)` : '#141018';
      g.fillRect(wx, wy, 34, 52);
      g.strokeStyle = '#241a12'; g.lineWidth = 5; g.strokeRect(wx, wy, 34, 52);
    }
  });
}
// Soft radial puff for steam / bulb halos
const puffTex = makeTex(64, 64, (g, w, h) => {
  const grd = g.createRadialGradient(w/2, h/2, 2, w/2, h/2, w/2);
  grd.addColorStop(0, 'rgba(255,250,240,0.9)'); grd.addColorStop(0.5, 'rgba(255,240,220,0.3)'); grd.addColorStop(1, 'rgba(255,235,210,0)');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
});
// Crate side: rough planks
const crateTex = makeTex(128, 128, (g, w, h) => {
  g.fillStyle = '#6a4526'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 4; i++){
    g.fillStyle = `hsl(${randInt(22,30)},${randInt(30,45)}%,${randInt(26,36)}%)`;
    g.fillRect(0, i * h / 4 + 2, w, h / 4 - 4);
  }
  g.fillStyle = 'rgba(30,15,5,0.5)'; g.fillRect(0, 0, 6, h); g.fillRect(w - 6, 0, 6, h);
});

/* ============================================================
   SHARED MATERIALS
   ============================================================ */
const M = {
  paver:   new THREE.MeshStandardMaterial({ map: paverTex, roughness: 0.92 }),
  woodDark:new THREE.MeshStandardMaterial({ color: C.woodDark, roughness: 0.85 }),
  woodLight:new THREE.MeshStandardMaterial({ color: C.woodLight, roughness: 0.7 }),
  bamboo:  new THREE.MeshStandardMaterial({ color: C.bamboo, roughness: 0.8 }),
  crate:   new THREE.MeshStandardMaterial({ map: crateTex, roughness: 0.9 }),
  metal:   new THREE.MeshStandardMaterial({ color: 0x50565e, roughness: 0.45, metalness: 0.7 }),
  cloth:   new THREE.MeshStandardMaterial({ color: 0xd8c8a8, roughness: 0.95, side: THREE.DoubleSide }),
  paperRed:new THREE.MeshStandardMaterial({ color: 0xb02020, emissive: C.lanternGlow, emissiveIntensity: 0.9, roughness: 0.6 }),
  gold:    new THREE.MeshStandardMaterial({ color: 0xc89a3a, roughness: 0.4, metalness: 0.6 })
};

/* ============================================================
   BUILDER FUNCTIONS — one named factory per focal structure
   ============================================================ */
// Shared rising-steam rig (billboard puffs on a loop)
function addSteam(parent, ox, oy, oz, count, height, size){
  const puffs = [];
  for (let i = 0; i < count; i++){
    const p = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTex, color: 0xf5ead8, transparent: true, opacity: 0, depthWrite: false }));
    p.userData = { ph: rand(0, 1), drift: rand(-0.2, 0.2), spd: rand(0.09, 0.15) };
    parent.add(p); puffs.push(p);
  }
  animators.push(t => {
    for (const p of puffs){
      const k = (t * p.userData.spd + p.userData.ph) % 1;
      p.position.set(ox + Math.sin(k * 8 + p.userData.ph * 6) * 0.12 + p.userData.drift * k, oy + k * height, oz + p.userData.drift * k * 0.5);
      p.scale.setScalar(size * (0.3 + k * 1.2));
      p.material.opacity = 0.38 * Math.sin(k * Math.PI);
    }
  });
}
// Red paper lantern with gold caps and a swinging tassel
function buildLantern(scale){
  const L = new THREE.Group();
  const paper = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), M.paperRed);
  paper.scale.set(1, 1.15, 1); L.add(paper);
  const capGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.05, 8);
  for (const dy of [0.27, -0.27]){
    const cap = new THREE.Mesh(capGeo, M.gold); cap.position.y = dy; L.add(cap);
  }
  const tassel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.035, 0.2, 6), new THREE.MeshStandardMaterial({ color: 0xc82818, roughness: 0.8 }));
  tassel.position.y = -0.4; L.add(tassel);
  L.scale.setScalar(scale);
  return L;
}
function hangLantern(parent, x, y, z, scale){
  const pivot = new THREE.Group(); pivot.position.set(x, y, z);
  const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.3, 4), M.woodDark);
  cord.position.y = -0.15; pivot.add(cord);
  const l = buildLantern(scale); l.position.y = -0.3 - 0.27 * scale; pivot.add(l);
  const ph = rand(0, 6.28), amp = rand(0.05, 0.12);
  animators.push(t => { pivot.rotation.z = Math.sin(t * 1.1 + ph) * amp; pivot.rotation.x = Math.sin(t * 0.8 + ph * 2) * amp * 0.7; });
  parent.add(pivot);
}
// Catenary string of warm bulbs spanning the lane
function buildBulbString(z, y, sag){
  const g = new THREE.Group();
  const curve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(-LANE.halfWidth - 0.4, y, z),
    new THREE.Vector3(rand(-0.5, 0.5), y - sag, z + rand(-0.4, 0.4)),
    new THREE.Vector3(LANE.halfWidth + 0.4, y + rand(-0.15, 0.15), z));
  g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 24, 0.014, 5), M.woodDark));
  const nB = 8;
  const bulbs = new THREE.InstancedMesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({ color: C.bulbWarm, toneMapped: false }), nB);
  const m4 = new THREE.Matrix4();
  const halo = new THREE.Group();
  const haloMat = new THREE.SpriteMaterial({ map: puffTex, color: 0xffc880, transparent: true, opacity: 0.35, depthWrite: false });
  for (let i = 0; i < nB; i++){
    const pt = curve.getPoint((i + 1) / (nB + 1));
    m4.setPosition(pt.x, pt.y - 0.06, pt.z); bulbs.setMatrixAt(i, m4);
    const sp = new THREE.Sprite(haloMat);
    sp.position.set(pt.x, pt.y - 0.06, pt.z); sp.scale.setScalar(0.34); halo.add(sp);
  }
  g.add(bulbs); g.add(halo);
  const ph = rand(0, 6.28);
  animators.push(t => {
    const tw = 0.78 + 0.22 * Math.sin(t * 5.3 + ph) * Math.sin(t * 1.7 + ph * 2);
    bulbs.material.color.set(C.bulbWarm).multiplyScalar(tw);
    haloMat.opacity = 0.32 * tw;
  });
  return g;
}
// Food stall: counter, frame, striped awning, sign, wares, glow
function buildStall(themeIdx, theme){
  const S = new THREE.Group();
  const [colA, colB] = AWNING_SETS[themeIdx % AWNING_SETS.length];
  const counter = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.95, 1.25), M.woodDark);
  counter.position.y = 0.5; counter.castShadow = counter.receiveShadow = true; S.add(counter);
  const top = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.08, 1.45), M.woodLight);
  top.position.y = 1.0; top.castShadow = true; S.add(top);
  const skirtTex = awningTex(colA, colB);
  const skirt = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 0.8), new THREE.MeshStandardMaterial({ map: skirtTex, roughness: 0.9 }));
  skirt.position.set(0, 0.5, 0.64); S.add(skirt);
  for (const px of [-1.5, 1.5]) for (const pz of [-0.55, 0.55]){
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.055, 2.1, 8), M.woodDark);
    post.position.set(px, 2.0, pz); post.castShadow = true; S.add(post);
  }
  // sloped striped awning with scalloped front flap
  const awn = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.07, 2.0), new THREE.MeshStandardMaterial({ map: skirtTex, roughness: 0.85 }));
  awn.position.set(0, 3.0, 0.1); awn.rotation.x = 0.18; awn.castShadow = true; S.add(awn);
  const flap = new THREE.Mesh(new THREE.PlaneGeometry(3.8, 0.35), new THREE.MeshStandardMaterial({ map: skirtTex, roughness: 0.85, side: THREE.DoubleSide }));
  flap.position.set(0, 2.75, 1.08); S.add(flap);
  animators.push(t => { flap.rotation.x = Math.sin(t * 1.9 + themeIdx) * 0.08; });
  // hanging painted signboard under the awning
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 0.44), new THREE.MeshStandardMaterial({ map: signboardTex(randInt(3, 4), pick(['#2a1a10', '#742018', '#1d2c20']), pick(['#f0d890', '#f5ead0'])), emissive: 0xffd9a0, emissiveIntensity: 0.14, roughness: 0.8 }));
  sign.position.set(0, 2.35, 1.02);
  const ph = rand(0, 6.28);
  animators.push(t => { sign.rotation.z = Math.sin(t * 1.4 + ph) * 0.045; });
  S.add(sign);
  // interior shelf + back wall cloth
  const back = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 2.0), M.cloth);
  back.position.set(0, 1.95, -0.62); S.add(back);
  const shelf = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.06, 0.4), M.woodLight);
  shelf.position.set(0, 2.0, -0.45); S.add(shelf);
  buildWares(S, theme);
  hangLantern(S, -1.55, 2.78, 0.95, 0.8);
  hangLantern(S, 1.55, 2.78, 0.95, 0.8);
  return S;
}
// Theme-specific counter wares
function buildWares(S, theme){
  if (theme === 'grill'){
    const grill = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.22, 0.6), M.metal);
    grill.position.set(-0.7, 1.15, 0.1); S.add(grill);
    const ember = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.5), new THREE.MeshBasicMaterial({ color: C.emberHot, toneMapped: false }));
    ember.rotation.x = -Math.PI / 2; ember.position.set(-0.7, 1.27, 0.1); S.add(ember);
    animators.push(t => { ember.material.color.set(C.emberHot).multiplyScalar(0.7 + 0.3 * Math.sin(t * 6.2) * Math.sin(t * 2.3)); });
    for (let i = 0; i < 5; i++){ // skewers with meat cubes
      const sk = new THREE.Group();
      const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.66, 5), M.bamboo);
      stick.rotation.z = Math.PI / 2; sk.add(stick);
      for (let c = 0; c < 3; c++){
        const cube = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.06, 0.06), new THREE.MeshStandardMaterial({ color: pick([0x9c4a20, 0xb05828, 0x7c3a18]), roughness: 0.7 }));
        cube.position.x = -0.18 + c * 0.13; sk.add(cube);
      }
      sk.position.set(-0.7 + rand(-0.15, 0.15), 1.3, -0.08 + i * 0.1); sk.rotation.y = rand(-0.2, 0.2);
      S.add(sk);
    }
    addSteam(S, -0.7, 1.35, 0.1, 6, 1.5, 0.4);
  } else if (theme === 'steamer'){
    for (let sx = 0; sx < 2; sx++){ // stacked bamboo steamer baskets
      const n = 3 - sx;
      for (let i = 0; i < n; i++){
        const basket = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.14, 14), M.bamboo);
        basket.position.set(-0.75 + sx * 0.75, 1.12 + i * 0.15, 0); basket.castShadow = true; S.add(basket);
        const rim = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.02, 6, 14), M.woodDark);
        rim.rotation.x = Math.PI / 2; rim.position.set(-0.75 + sx * 0.75, 1.19 + i * 0.15, 0); S.add(rim);
      }
      addSteam(S, -0.75 + sx * 0.75, 1.62, 0, 6, 1.7, 0.45);
    }
    const bun = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), new THREE.MeshStandardMaterial({ color: 0xf0e2c8, roughness: 0.9 }));
    bun.scale.y = 0.75; bun.position.set(0.9, 1.1, 0.25); S.add(bun);
  } else if (theme === 'noodle'){
    const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.28, 0.4, 14), M.metal);
    pot.position.set(-0.8, 1.22, 0); pot.castShadow = true; S.add(pot);
    const broth = new THREE.Mesh(new THREE.CircleGeometry(0.28, 14), new THREE.MeshStandardMaterial({ color: 0xd09a48, emissive: 0x603010, emissiveIntensity: 0.5, roughness: 0.25 }));
    broth.rotation.x = -Math.PI / 2; broth.position.set(-0.8, 1.43, 0); S.add(broth);
    for (let i = 0; i < 4; i++){
      const bowl = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xe8ddc8, roughness: 0.5 }));
      bowl.rotation.x = Math.PI; bowl.position.set(0.15 + (i % 2) * 0.32, 1.1, -0.15 + Math.floor(i / 2) * 0.35); S.add(bowl);
    }
    addSteam(S, -0.8, 1.5, 0, 7, 1.6, 0.42);
  } else if (theme === 'fruit'){
    for (let i = 0; i < 3; i++) S.add(buildFruitCrate(-1.0 + i * 1.0, 1.12, 0.05, true));
  } else if (theme === 'drinks'){
    for (let i = 0; i < 8; i++){
      const bottle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, rand(0.22, 0.3), 8), new THREE.MeshStandardMaterial({ color: pick([0xd8642a, 0x66b04a, 0xc23a4a, 0xe8b03a]), roughness: 0.3 }));
      bottle.position.set(-1.1 + (i % 4) * 0.3, 1.18, -0.2 + Math.floor(i / 4) * 0.4); S.add(bottle);
    }
    const jug = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.4, 10), new THREE.MeshStandardMaterial({ color: 0xb8d8e8, roughness: 0.2 }));
    jug.position.set(0.9, 1.25, 0); S.add(jug);
  } else { // sweets: candy jars and cake tray
    for (let i = 0; i < 4; i++){
      const jar = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.2, 10), new THREE.MeshStandardMaterial({ color: pick([0xe89ab8, 0xf0d060, 0x9ad0a8, 0xe8b090]), roughness: 0.3 }));
      jar.position.set(-0.9 + i * 0.42, 1.15, 0.15); S.add(jar);
    }
    const tray = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.05, 0.5), M.bamboo);
    tray.position.set(0.7, 1.08, -0.2); S.add(tray);
    for (let i = 0; i < 6; i++){
      const cake = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.05, 8), new THREE.MeshStandardMaterial({ color: 0xf2d8a8, roughness: 0.8 }));
      cake.position.set(0.5 + (i % 3) * 0.2, 1.14, -0.32 + Math.floor(i / 3) * 0.24); S.add(cake);
    }
  }
}
// Slatted crate piled with instanced fruit
function buildFruitCrate(x, y, z, small){
  const G = new THREE.Group();
  const s = small ? 0.62 : 1;
  const box = new THREE.Mesh(new THREE.BoxGeometry(0.8 * s, 0.4 * s, 0.6 * s), M.crate);
  box.castShadow = box.receiveShadow = true; G.add(box);
  const fruitCol = pick([0xe07820, 0xd8b02a, 0xc03028, 0x7ab040, 0xe8a86a]);
  const fruit = new THREE.InstancedMesh(new THREE.SphereGeometry(0.085 * s, 8, 6), new THREE.MeshStandardMaterial({ color: fruitCol, roughness: 0.55 }), 9);
  const m4 = new THREE.Matrix4();
  for (let i = 0; i < 9; i++){
    m4.setPosition((i % 3 - 1) * 0.22 * s + rand(-0.02, 0.02), 0.24 * s, (Math.floor(i / 3) - 1) * 0.17 * s + rand(-0.02, 0.02));
    fruit.setMatrixAt(i, m4);
  }
  fruit.castShadow = true; G.add(fruit);
  G.position.set(x, y, z);
  return G;
}
// Folding table with taped legs + a ring of low stools
function buildTableSet(){
  const G = new THREE.Group();
  const top = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.05, 0.7), M.woodLight);
  top.position.y = 0.62; top.castShadow = true; G.add(top);
  for (const lx of [-0.48, 0.48]) for (const lz of [-0.26, 0.26]){
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.6, 6), M.metal);
    leg.position.set(lx, 0.3, lz); leg.rotation.z = lx * 0.12; G.add(leg);
  }
  const bowlA = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 5, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0xe8ddc8, roughness: 0.5 }));
  bowlA.rotation.x = Math.PI; bowlA.position.set(0.15, 0.68, 0.1); G.add(bowlA);
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.035, 0.09, 8), new THREE.MeshStandardMaterial({ color: 0x4a7a58, roughness: 0.4 }));
  cup.position.set(-0.2, 0.7, -0.12); G.add(cup);
  const stools = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.15, 0.13, 0.4, 9), new THREE.MeshStandardMaterial({ color: pick([0xb04030, 0x3a6ea0, 0xc09030]), roughness: 0.6 }), 4);
  const m4 = new THREE.Matrix4();
  const spots = [[-0.85, 0.2, 0.1], [0.85, 0.2, -0.15], [0.15, 0.2, 0.75], [-0.2, 0.2, -0.72]];
  for (let i = 0; i < 4; i++){ m4.setPosition(...spots[i]); stools.setMatrixAt(i, m4); }
  stools.castShadow = true; G.add(stools);
  return G;
}
// Bicycle cart: frame, spoked wheels, cargo box with wares
function buildBicycleCart(){
  const G = new THREE.Group();
  const wheelGeo = new THREE.TorusGeometry(0.34, 0.03, 8, 18);
  const spokeGeo = new THREE.BoxGeometry(0.62, 0.016, 0.016);
  for (const wx of [-0.55, 0.55]){
    const wheel = new THREE.Mesh(wheelGeo, M.metal);
    wheel.position.set(wx, 0.34, 0); wheel.rotation.y = Math.PI / 2; wheel.castShadow = true; G.add(wheel);
    for (let i = 0; i < 3; i++){
      const spoke = new THREE.Mesh(spokeGeo, M.metal);
      spoke.position.set(wx, 0.34, 0); spoke.rotation.x = i * Math.PI / 3; spoke.rotation.y = Math.PI / 2; G.add(spoke);
    }
  }
  const axle = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.16, 6), M.metal);
  axle.rotation.z = Math.PI / 2; axle.position.y = 0.34; G.add(axle);
  const bed = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.07, 0.85), M.woodLight);
  bed.position.y = 0.62; bed.castShadow = true; G.add(bed);
  const cargo = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.45, 0.7), M.crate);
  cargo.position.y = 0.88; cargo.castShadow = true; G.add(cargo);
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.75, 6), M.metal);
  bar.position.set(0, 0.95, 0.62); bar.rotation.x = 0.5; G.add(bar);
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.5, 6), M.metal);
  handle.rotation.z = Math.PI / 2; handle.position.set(0, 1.12, 0.78); G.add(handle);
  hangLantern(G, 0.22, 1.1, 0.78, 0.5);
  return G;
}
// Market gate: posts + painted header board + little tiled cap
function buildGateSign(glyphs){
  const G = new THREE.Group();
  for (const px of [-2.7, 2.7]){
    const post = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 3.6, 10), new THREE.MeshStandardMaterial({ color: 0x8a2820, roughness: 0.6 }));
    post.position.set(px, 1.8, 0); post.castShadow = true; G.add(post);
  }
  const board = new THREE.Mesh(new THREE.BoxGeometry(5.9, 1.0, 0.14), new THREE.MeshStandardMaterial({ map: signboardTex(glyphs, '#2a1a10', '#f0d890'), emissive: 0xffc880, emissiveIntensity: 0.16, roughness: 0.75 }));
  board.position.y = 3.7; board.castShadow = true; G.add(board);
  const rearBoard = new THREE.Mesh(new THREE.PlaneGeometry(5.9, 1.0), new THREE.MeshStandardMaterial({ map: signboardTex(glyphs, '#2a1a10', '#f0d890'), emissive: 0xffc880, emissiveIntensity: 0.16, roughness: 0.75 }));
  rearBoard.position.set(0, 3.7, -0.075); rearBoard.rotation.y = Math.PI; G.add(rearBoard);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(6.3, 0.12, 0.5), new THREE.MeshStandardMaterial({ color: 0x243a2c, roughness: 0.7 }));
  cap.position.y = 4.28; G.add(cap);
  const capTop = new THREE.Mesh(new THREE.BoxGeometry(6.0, 0.1, 0.34), new THREE.MeshStandardMaterial({ color: 0x2e4a38, roughness: 0.7 }));
  capTop.position.y = 4.38; G.add(capTop);
  hangLantern(G, -2.2, 3.2, 0.1, 0.9);
  hangLantern(G, 2.2, 3.2, 0.1, 0.9);
  return G;
}
// Backdrop shophouse silhouettes with a few lit shutters
function buildShophouse(w, h){
  const B = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, 3), new THREE.MeshStandardMaterial({ color: 0x241a16, roughness: 0.95 }));
  body.position.y = h / 2; body.castShadow = body.receiveShadow = true; B.add(body);
  const faceTex = shophouseTex();
  const face = new THREE.Mesh(new THREE.PlaneGeometry(w * 0.96, h * 0.92), new THREE.MeshStandardMaterial({ map: faceTex, emissive: 0xffffff, emissiveMap: faceTex, emissiveIntensity: 0.5, roughness: 0.9 }));
  face.position.set(0, h / 2, 1.52); B.add(face);
  const rearTex = shophouseTex(); // street-facing back wall so orbit views stay alive
  const rear = new THREE.Mesh(face.geometry, new THREE.MeshStandardMaterial({ map: rearTex, emissive: 0xffffff, emissiveMap: rearTex, emissiveIntensity: 0.42, roughness: 0.9 }));
  rear.rotation.y = Math.PI; rear.position.set(0, h / 2, -1.52); B.add(rear);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 0.5, 0.16, 3.6), new THREE.MeshStandardMaterial({ color: 0x1a2430, roughness: 0.8 }));
  roof.position.y = h + 0.05; roof.castShadow = true; B.add(roof);
  const ridge = new THREE.Mesh(new THREE.BoxGeometry(w + 0.7, 0.1, 0.3), new THREE.MeshStandardMaterial({ color: 0x141c26, roughness: 0.8 }));
  ridge.position.set(0, h + 0.16, 1.7); B.add(ridge);
  return B;
}
// Star-flecked indigo dome with a warm city-glow horizon
function buildSky(){
  const tex = makeTex(512, 256, (g, w, h) => {
    const grd = g.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, '#070a1e'); grd.addColorStop(0.55, '#101a3c');
    grd.addColorStop(0.82, '#2c2846'); grd.addColorStop(1, '#4a3040');
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 130; i++){
      g.fillStyle = `rgba(255,255,${randInt(210,255)},${rand(0.25,0.9).toFixed(2)})`;
      const sy = rand(h * 0.07, h * 0.55);
      g.fillRect(rand(0, w), sy, rand(1, 2.4), rand(1, 2.4));
    }
  });
  return new THREE.Mesh(new THREE.SphereGeometry(120, 24, 16), new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false }));
}

/* ============================================================
   ASSEMBLY & LAYOUT
   ============================================================ */
scene.add(buildSky());
const ground = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), M.paver);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// warm lamplight pools painted onto the lane
const poolTex = makeTex(128, 128, (g, w, h) => {
  const grd = g.createRadialGradient(w/2, h/2, 4, w/2, h/2, w/2);
  grd.addColorStop(0, 'rgba(255,190,110,0.55)'); grd.addColorStop(1, 'rgba(255,170,90,0)');
  g.fillStyle = grd; g.fillRect(0, 0, w, h);
});
for (const [px, pz, ps] of [[0, -7, 5.5], [0.4, 0, 6], [-0.3, 7, 5.5], [0, 12.6, 4.5]]){
  const pool = new THREE.Mesh(new THREE.PlaneGeometry(ps, ps), new THREE.MeshBasicMaterial({ map: poolTex, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false }));
  pool.rotation.x = -Math.PI / 2; pool.position.set(px, 0.02, pz); scene.add(pool);
}

// Two facing rows of themed stalls
const themes = ['grill', 'steamer', 'fruit', 'noodle', 'drinks', 'sweets'];
const stallZ = [-8.2, -0.2, 7.8];
for (let side = 0; side < 2; side++){
  for (let i = 0; i < 3; i++){
    const idx = side * 3 + i;
    const st = buildStall(idx, themes[idx]);
    const sx = side === 0 ? -LANE.halfWidth - 0.8 : LANE.halfWidth + 0.8;
    st.position.set(sx, 0, stallZ[i] + rand(-0.4, 0.4));
    st.rotation.y = side === 0 ? Math.PI / 2 : -Math.PI / 2;
    scene.add(st);
  }
}

// Market gates at both lane mouths
const gateA = buildGateSign(5); gateA.position.set(0, 0, 13.2); scene.add(gateA);
const gateB = buildGateSign(4); gateB.position.set(0, 0, -13.2); gateB.rotation.y = Math.PI; scene.add(gateB);

// Bulb strings and lantern strings over the lane
for (const [z, y, sag] of [[-10.5, 3.3, 0.5], [-6, 3.25, 0.6], [-2.3, 3.35, 0.5], [2, 3.3, 0.55], [5.6, 3.25, 0.5], [9.6, 3.3, 0.6]]) scene.add(buildBulbString(z, y, sag));
for (const z of [-4.2, 3.9]){
  const string = new THREE.Group();
  const wire = new THREE.Mesh(new THREE.CylinderGeometry(0.013, 0.013, LANE.halfWidth * 2 + 1.4, 5), M.woodDark);
  wire.rotation.z = Math.PI / 2; wire.position.y = 3.45; string.add(wire);
  for (let i = 0; i < 4; i++) hangLantern(string, -2.4 + i * 1.6, 3.45, 0, 0.95);
  string.position.z = z; scene.add(string);
}

// Lane furniture: folding tables, carts, crates, stray props
const tableSpots = [[-0.9, -4.6, 0.4], [1.1, 1.9, -0.7], [-1.2, 10.4, 1.9]];
for (const [tx, tz, ry] of tableSpots){
  const set = buildTableSet(); set.position.set(tx, 0, tz); set.rotation.y = ry; scene.add(set);
}
const cartA = buildBicycleCart(); cartA.position.set(1.7, 0, -11.6); cartA.rotation.y = -0.5; scene.add(cartA);
const cartB = buildBicycleCart(); cartB.position.set(-1.9, 0, 11.4); cartB.rotation.y = 2.5; scene.add(cartB);
for (let i = 0; i < 6; i++){
  const cr = buildFruitCrate(rand(-2.6, 2.6), 0.2, rand(-12, 12), false);
  cr.rotation.y = rand(0, Math.PI); scene.add(cr);
  if (rng() < 0.5){ const c2 = buildFruitCrate(0, 0.62, 0, false); c2.rotation.y = rand(0, Math.PI); cr.add(c2); }
}
// backdrop shophouse rows behind each stall line
for (const side of [-1, 1]){
  let zc = -11;
  while (zc < 12){
    const w = rand(4.5, 7), h = rand(3.8, 4.9);
    const house = buildShophouse(w, h);
    house.position.set(side * 9.4, 0, zc + w / 2);
    house.rotation.y = side === -1 ? Math.PI / 2 : -Math.PI / 2;
    scene.add(house);
    zc += w + rand(0.3, 0.9);
  }
}
// paper scraps + a broom leaning on a crate for lived-in charm
for (let i = 0; i < 10; i++){
  const scrap = new THREE.Mesh(new THREE.PlaneGeometry(rand(0.1, 0.2), rand(0.1, 0.2)), new THREE.MeshStandardMaterial({ color: 0xd8cdb0, roughness: 1, side: THREE.DoubleSide }));
  scrap.rotation.set(-Math.PI / 2, 0, rand(0, Math.PI)); scrap.position.set(rand(-2.8, 2.8), 0.015, rand(-12, 12));
  scene.add(scrap);
}
const broom = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 1.3, 6), M.bamboo);
broom.position.set(2.6, 0.6, 5.2); broom.rotation.z = 0.4; scene.add(broom);
const brush = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.3, 8), M.woodDark);
brush.position.set(2.85, 0.12, 5.2); scene.add(brush);

/* ============================================================
   LIGHTING RIG — cool moon key + lantern pools over the lane
   ============================================================ */
const hemi = new THREE.HemisphereLight(0x3a4a80, 0x40281a, 1.0);
scene.add(hemi);
const moon = new THREE.DirectionalLight(C.moonBlue, 0.9);
moon.position.set(-14, 20, 10);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
moon.shadow.camera.left = -18; moon.shadow.camera.right = 18;
moon.shadow.camera.top = 20; moon.shadow.camera.bottom = -18;
moon.shadow.camera.far = 60; moon.shadow.bias = -0.0004;
scene.add(moon);
const lanePools = [];
for (const [lx, lz] of [[0, -7], [0.4, 0], [-0.3, 7]]){
  const p = new THREE.PointLight(0xffa04a, 30, 13, 2);
  p.position.set(lx, 3.0, lz); scene.add(p); lanePools.push(p);
}
const gateGlow = new THREE.PointLight(0xff8a3a, 20, 11, 2);
gateGlow.position.set(0, 3.4, 12.6); scene.add(gateGlow);
const grillGlow = new THREE.PointLight(0xff6a22, 12, 6, 2);
grillGlow.position.set(-3.6, 1.6, -8.4); scene.add(grillGlow);
animators.push(t => {
  lanePools.forEach((p, i) => { p.intensity = 30 * (0.88 + 0.12 * Math.sin(t * 2.1 + i * 2.4) * Math.sin(t * 0.9 + i)); });
  grillGlow.intensity = 12 * (0.75 + 0.25 * Math.sin(t * 5.7) * Math.sin(t * 2.2 + 1));
});

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  for (const fn of animators) fn(t, dt);
  controls.update();
  renderer.render(scene, camera);
}
tick();

/* ============================================================
   RESIZE
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
