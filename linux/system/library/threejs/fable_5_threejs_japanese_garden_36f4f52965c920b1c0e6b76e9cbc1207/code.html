<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miniature Japanese Garden</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e8e4da}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e4da);
scene.fog = new THREE.Fog(0xe8e4da, 60, 140);

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 300);
camera.position.set(28, 20, 30);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.target.set(0, 1.5, 0);
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 15; controls.maxDistance = 90;

// Lighting
scene.add(new THREE.HemisphereLight(0xf5f2ea, 0x8a8070, 0.7));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.0);
sun.position.set(18, 30, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
sun.shadow.bias = -0.0004;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xcfd8e8, 0.5);
fill.position.set(-15, 12, -18);
scene.add(fill);

// Materials
const M = {
  gravel: new THREE.MeshStandardMaterial({color:0xd7cfbe, roughness:0.95}),
  moss:   new THREE.MeshStandardMaterial({color:0x5f7a3f, roughness:0.9}),
  moss2:  new THREE.MeshStandardMaterial({color:0x6d8a4a, roughness:0.9}),
  stone:  new THREE.MeshStandardMaterial({color:0x8f8d86, roughness:0.85}),
  stone2: new THREE.MeshStandardMaterial({color:0x7d7b74, roughness:0.85}),
  lantern:new THREE.MeshStandardMaterial({color:0x9a978e, roughness:0.8}),
  water:  new THREE.MeshPhysicalMaterial({color:0x4f7f8a, roughness:0.08, metalness:0, transmission:0.35, thickness:1, ior:1.33}),
  sand:   new THREE.MeshStandardMaterial({color:0xcbbfa6, roughness:1}),
  wood:   new THREE.MeshStandardMaterial({color:0x6b5138, roughness:0.85})
};

// ONE centered procedural garden object
const garden = new THREE.Group();
scene.add(garden);

function shadowed(m){ m.castShadow = true; m.receiveShadow = true; return m; }

// Base tray (centimeter-scale miniature, ~36cm across)
const base = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(18, 18.6, 1.6, 64), M.wood));
base.position.y = 0.8; garden.add(base);
const soil = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(17.4, 17.4, 0.6, 64), M.gravel));
soil.position.y = 1.9; garden.add(soil);

// Shallow pond with defined coping edge
const pond = new THREE.Group(); pond.position.set(-4.5, 0, -3); garden.add(pond);
const basin = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(6.2, 5.6, 0.5, 48), M.stone2));
basin.position.y = 2.05; pond.add(basin);
const water = new THREE.Mesh(new THREE.CylinderGeometry(5.9, 5.9, 0.25, 48), M.water);
water.position.y = 2.28; water.receiveShadow = true; pond.add(water);
// Coping: neat ring of rounded stones
const copingGeo = new THREE.SphereGeometry(0.62, 12, 10);
for (let i = 0; i < 30; i++) {
  const a = (i/30) * Math.PI * 2;
  const s = shadowed(new THREE.Mesh(copingGeo, i%2 ? M.stone : M.stone2));
  s.position.set(Math.cos(a)*6.35, 2.35, Math.sin(a)*6.35);
  s.scale.set(1.05, 0.6, 0.85);
  s.rotation.y = a;
  pond.add(s);
}

// Path of flat stepping stones (gentle S-curve across the garden)
const stepGeo = new THREE.CylinderGeometry(1, 1.1, 0.4, 20);
const pathPts = [[-13,7.5],[-10.2,5.6],[-7.4,4.6],[-4.4,4.4],[-1.4,4.8],[1.4,5.6],[4.2,5.6],[7,4.6],[9.6,3],[11.6,0.8]];
pathPts.forEach(([x,z], i) => {
  const s = shadowed(new THREE.Mesh(stepGeo, i%2 ? M.stone : M.stone2));
  const r = 1 + 0.14 * Math.sin(i * 2.7);
  s.scale.set(r, 1, r * (0.85 + 0.1 * Math.cos(i*1.9)));
  s.rotation.y = i * 0.7;
  s.position.set(x, 2.4, z);
  garden.add(s);
});

// Clipped rounded earth mounds (moss hummocks)
const moundGeo = new THREE.SphereGeometry(1, 24, 18);
const mounds = [[6,-5,3.6,.45],[9.5,-2,2.4,.42],[3,-8.5,2.6,.4],[-11,-6,3,.44],[-13.5,-1.5,2,.4],[10,7.5,2.2,.42],[-8,9.8,2.4,.42],[13.2,3.6,1.6,.4],[-14.2,4.2,1.7,.4],[0,-11.5,2,.4]];
mounds.forEach(([x,z,r,f], i) => {
  const m = shadowed(new THREE.Mesh(moundGeo, i%2 ? M.moss : M.moss2));
  m.scale.set(r, r*f/0.4*0.8, r);
  m.position.set(x, 2.15, z);
  garden.add(m);
});

// Small stone lantern (yukimi style) beside the pond
const lantern = new THREE.Group(); lantern.position.set(4.6, 2.2, -3.4); garden.add(lantern);
const parts = [
  [new THREE.CylinderGeometry(1.15, 1.35, 0.5, 6), 0.25],   // base
  [new THREE.CylinderGeometry(0.42, 0.5, 2.2, 6), 1.6],     // pedestal
  [new THREE.CylinderGeometry(1.05, 0.8, 0.35, 6), 2.9],    // platform
  [new THREE.CylinderGeometry(0.62, 0.62, 1.0, 6), 3.55],   // firebox
  [new THREE.CylinderGeometry(0.25, 1.55, 0.85, 6), 4.4],   // roof
  [new THREE.SphereGeometry(0.3, 12, 10), 4.98]             // finial
];
parts.forEach(([g, y]) => { const p = shadowed(new THREE.Mesh(g, M.lantern)); p.position.y = y; lantern.add(p); });
const glow = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.55, 0.5),
  new THREE.MeshStandardMaterial({color:0xffe6b0, emissive:0xffb347, emissiveIntensity:0.9}));
glow.position.y = 3.55; lantern.add(glow);
const lamp = new THREE.PointLight(0xffb060, 3, 8, 2);
lamp.position.set(0, 3.55, 0); lantern.add(lamp);

// Accent rocks & raked sand patch for balance
const rockGeo = new THREE.DodecahedronGeometry(1, 1);
[[-1,-7,1.3],[0.6,-6,0.8],[12.5,-4.5,1],[-15,7.8,0.9]].forEach(([x,z,r], i) => {
  const rk = shadowed(new THREE.Mesh(rockGeo, i%2 ? M.stone2 : M.stone));
  rk.scale.set(r, r*0.7, r*0.85);
  rk.rotation.set(i, i*1.7, i*0.6);
  rk.position.set(x, 2.4, z);
  garden.add(rk);
});
const sandPatch = new THREE.Mesh(new THREE.CircleGeometry(4.4, 40), M.sand);
sandPatch.rotation.x = -Math.PI/2; sandPatch.position.set(8.5, 2.22, 9);
sandPatch.receiveShadow = true; garden.add(sandPatch);
const rakeRing = new THREE.TorusGeometry(1, 0.06, 6, 40);
for (let i = 1; i <= 3; i++) {
  const ring = new THREE.Mesh(rakeRing, M.gravel);
  ring.rotation.x = -Math.PI/2;
  ring.scale.setScalar(i * 1.15);
  ring.position.set(8.5, 2.24, 9);
  garden.add(ring);
}

// Soft ground shadow catcher
const ground = new THREE.Mesh(new THREE.CircleGeometry(70, 64), new THREE.ShadowMaterial({opacity:0.28}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
scene.add(ground);

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  water.position.y = 2.28 + Math.sin(clock.getElapsedTime() * 1.2) * 0.02;
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
