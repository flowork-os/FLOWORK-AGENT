<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faceted Crystal Koi</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050308}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050308);
scene.fog = new THREE.Fog(0x050308, 7, 15);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.6, 3.0, 6.2);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 3.5;
controls.maxDistance = 11;
controls.target.set(0.35, 0, 0);

scene.add(new THREE.HemisphereLight(0x9d8cff, 0x12060e, 1.8));

const key = new THREE.DirectionalLight(0xffd8c5, 4.0);
key.position.set(-4, 6, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -5;
scene.add(key);

const rim = new THREE.PointLight(0x4d8dff, 16, 10, 2);
rim.position.set(3, 2, -3);
scene.add(rim);

const rubyGlow = new THREE.PointLight(0xff164c, 9, 6, 2);
rubyGlow.position.set(-1.0, -0.4, 0.5);
scene.add(rubyGlow);

const koi = new THREE.Group();
koi.rotation.y = -0.12;
scene.add(koi);

function gradientColor(t, belly) {
  const ruby = new THREE.Color(0x7d071f);
  const wine = new THREE.Color(0xc92346);
  const white = new THREE.Color(0xf8f4ed);
  let c = t < 0.62 ? ruby.clone().lerp(wine, t / 0.62) : wine.clone().lerp(white, (t - 0.62) / 0.38);
  if (belly > 0.48) c.lerp(new THREE.Color(0xffd9d5), (belly - 0.48) * 0.55);
  return c;
}

function makeBody() {
  const rings = [
    [-1.72, 0.05, 0.05],
    [-1.58, 0.62, 0.54],
    [-1.22, 0.82, 0.73],
    [-0.70, 0.92, 0.79],
    [-0.05, 0.82, 0.72],
    [0.62, 0.65, 0.57],
    [1.18, 0.43, 0.39],
    [1.58, 0.18, 0.17]
  ];
  const sides = 10;
  const positions = [];
  const colors = [];
  const indices = [];
  for (let r = 0; r < rings.length; r++) {
    const x = rings[r][0], ry = rings[r][1], rz = rings[r][2];
    for (let s = 0; s < sides; s++) {
      const a = (s / sides) * Math.PI * 2 + (r % 2) * 0.055;
      const y = Math.cos(a) * ry;
      const z = Math.sin(a) * rz;
      positions.push(x, y, z);
      const t = (x + 1.72) / 3.3;
      const belly = (z < 0 ? -z / Math.max(rz, 0.01) : 0);
      colors.push(...gradientColor(t, belly).toArray());
    }
  }
  for (let r = 0; r < rings.length - 1; r++) {
    for (let s = 0; s < sides; s++) {
      const a = r * sides + s;
      const b = r * sides + (s + 1) % sides;
      const c = (r + 1) * sides + s;
      const d = (r + 1) * sides + (s + 1) % sides;
      if ((r + s) % 2 === 0) {
        indices.push(a, c, b, b, c, d);
      } else {
        indices.push(a, c, d, a, d, b);
      }
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  const material = new THREE.MeshPhysicalMaterial({
    vertexColors:true,
    roughness:0.16,
    metalness:0.18,
    transmission:0.22,
    thickness:0.8,
    clearcoat:0.85,
    clearcoatRoughness:0.08,
    side:THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
koi.add(makeBody());

function blade(vertices, color, opacity) {
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geometry.computeVertexNormals();
  const material = new THREE.MeshPhysicalMaterial({
    color,
    roughness:0.12,
    metalness:0.1,
    transmission:0.55,
    thickness:0.12,
    transparent:true,
    opacity,
    side:THREE.DoubleSide,
    flatShading:true
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  return mesh;
}

function finPair() {
  const group = new THREE.Group();
  group.add(blade([
    -0.72,0.68,0.08, -0.18,1.62,0.02, 0.38,0.72,0.08,
    -0.72,0.68,0.08, 0.38,0.72,0.08, -0.18,1.62,0.02
  ], 0x9fcaff, 0.68));
  group.add(blade([
    -0.72,-0.68,0.08, 0.38,-0.72,0.08, -0.18,-1.62,0.02,
    -0.72,-0.68,0.08, -0.18,-1.62,0.02, 0.38,-0.72,0.08
  ], 0xff7e9e, 0.58));
  return group;
}
koi.add(finPair());

koi.add(blade([
  -0.42,0,0.55, 0.12,0,1.42, 0.62,0,0.36,
  -0.42,0,0.55, 0.62,0,0.36, 0.12,0,1.42
], 0xefd5ff, 0.56));

koi.add(blade([
  0.62,0.06,0, 1.78,0.06,0.85, 2.38,0.04,0.08,
  0.62,0.06,0, 2.38,0.04,0.08, 1.78,0.06,0.85,
  0.62,-0.06,0, 2.38,-0.04,-0.08, 1.78,-0.06,-0.85,
  0.62,-0.06,0, 1.78,-0.06,-0.85, 2.38,-0.04,-0.08
], 0xf7e6ff, 0.64));

function eye(y) {
  const geometry = new THREE.SphereGeometry(0.19, 12, 8);
  geometry.scale(1, 0.72, 1);
  const material = new THREE.MeshPhysicalMaterial({
    color:0x26030e,
    roughness:0.12,
    metalness:0.32,
    clearcoat:1,
    clearcoatRoughness:0.04
  });
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(-1.28, y, 0.28);
  mesh.rotation.z = y < 0 ? -0.18 : 0.18;
  mesh.castShadow = true;
  return mesh;
}
koi.add(eye(0.68));
koi.add(eye(-0.68));

function createSparks() {
  const count = 55;
  const positions = [];
  const sparkColors = [];
  const palette = [0xff3155, 0xff9b55, 0xffe6a1, 0xff527c];
  for (let i = 0; i < count; i++) {
    const x = -1.05 + Math.random() * 2.15;
    const radius = 0.62 * Math.sqrt(Math.random());
    const angle = Math.random() * Math.PI * 2;
    positions.push(x, Math.cos(angle) * radius * 0.74, Math.sin(angle) * radius * 0.7);
    sparkColors.push(...new THREE.Color(palette[i % palette.length]).toArray());
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute("color", new THREE.Float32BufferAttribute(sparkColors, 3));
  const material = new THREE.PointsMaterial({
    size:0.045,
    vertexColors:true,
    transparent:true,
    opacity:0.92,
    blending:THREE.AdditiveBlending,
    depthWrite:false,
    sizeAttenuation:true
  });
  return new THREE.Points(geometry, material);
}
koi.add(createSparks());

function createFlare(x, y, z, color, scale) {
  const group = new THREE.Group();
  const geometry = new THREE.OctahedronGeometry(scale, 0);
  const material = new THREE.MeshBasicMaterial({
    color,
    transparent:true,
    opacity:0.85,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  });
  const flare = new THREE.Mesh(geometry, material);
  group.add(flare);
  const light = new THREE.PointLight(color, 1.8, 1.3, 2);
  group.add(light);
  group.position.set(x,y,z);
  return group;
}
koi.add(createFlare(-0.15, 1.33, 0.04, 0x70c8ff, 0.07));
koi.add(createFlare(0.26, -1.28, 0.05, 0xff6aa5, 0.06));
koi.add(createFlare(1.72, 0.05, 0.56, 0xffe5a0, 0.055));
koi.add(createFlare(1.78, 0.05, -0.58, 0x8e9dff, 0.05));

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(7, 64),
  new THREE.MeshStandardMaterial({color:0x09050c, roughness:0.42, metalness:0.35})
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.72;
floor.receiveShadow = true;
scene.add(floor);

const halo = new THREE.Mesh(
  new THREE.RingGeometry(2.0, 2.08, 96),
  new THREE.MeshBasicMaterial({color:0x421536, transparent:true, opacity:0.38, side:THREE.DoubleSide})
);
halo.rotation.x = -Math.PI / 2;
halo.position.y = -1.70;
scene.add(halo);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  const time = performance.now() * 0.001;
  koi.position.y = Math.sin(time * 1.3) * 0.035;
  koi.rotation.z = Math.sin(time * 0.7) * 0.012;
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
