<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plush Axolotl</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f8dce8; }
canvas { display: block; width: 100%; height: 100%; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf8dce8);
scene.fog = new THREE.Fog(0xf8dce8, 7, 14);

const camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.4, 2.4, 6.4);
camera.lookAt(0, 0.45, -0.35);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.065;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.15;
controls.minDistance = 4;
controls.maxDistance = 10;
controls.target.set(0, 0.45, -0.35);

const pink = new THREE.MeshStandardMaterial({ color: 0xf3a9bd, roughness: 0.92, metalness: 0 });
const pinkLight = new THREE.MeshStandardMaterial({ color: 0xf8bfd0, roughness: 0.95, metalness: 0 });
const pinkShadow = new THREE.MeshStandardMaterial({ color: 0xd982a0, roughness: 0.96, metalness: 0 });
const magenta = new THREE.MeshStandardMaterial({ color: 0xc73d82, roughness: 0.88, metalness: 0 });
const magentaLight = new THREE.MeshStandardMaterial({ color: 0xe15a98, roughness: 0.9, metalness: 0 });
const thread = new THREE.MeshStandardMaterial({ color: 0x632044, roughness: 0.8, metalness: 0 });
const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0x3d1832, roughness: 0.72, metalness: 0 });
const highlightMaterial = new THREE.MeshBasicMaterial({ color: 0xffeaf2 });

const axolotl = new THREE.Group();
scene.add(axolotl);

function ellipsoid(geometry, material, position, scale, rotation) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(position.x, position.y, position.z);
  mesh.scale.set(scale.x, scale.y, scale.z);
  if (rotation) mesh.rotation.set(rotation.x, rotation.y, rotation.z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  axolotl.add(mesh);
  return mesh;
}

const softSphere = new THREE.SphereGeometry(1, 40, 24);
const body = ellipsoid(softSphere, pink, new THREE.Vector3(0, 0.15, -0.45), new THREE.Vector3(1.02, 0.67, 1.25));
body.rotation.x = -0.08;

const belly = ellipsoid(softSphere, pinkLight, new THREE.Vector3(0, -0.16, 0.22), new THREE.Vector3(0.82, 0.47, 0.78));

const head = ellipsoid(softSphere, pinkLight, new THREE.Vector3(0, 1.03, 0.2), new THREE.Vector3(1.48, 0.78, 0.68));
head.rotation.x = -0.05;

const lowerJaw = ellipsoid(softSphere, pink, new THREE.Vector3(0, 0.72, 0.68), new THREE.Vector3(0.9, 0.3, 0.32));

const tail = ellipsoid(softSphere, pinkShadow, new THREE.Vector3(0, 0.02, -2.02), new THREE.Vector3(0.7, 0.28, 1.25));
tail.rotation.x = -0.08;

const tailUpper = ellipsoid(softSphere, pink, new THREE.Vector3(0, 0.18, -1.75), new THREE.Vector3(0.58, 0.31, 0.82));
tailUpper.rotation.x = -0.12;

function tube(points, radius, material, closed = false) {
  const curve = new THREE.CatmullRomCurve3(points);
  curve.closed = closed;
  const geometry = new THREE.TubeGeometry(curve, Math.max(8, points.length * 8), radius, 8, closed);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  axolotl.add(mesh);
  return mesh;
}

function frond(side, index) {
  const x = side * (1.18 + index * 0.09);
  const y = 1.34 - index * 0.22;
  const z = 0.23 - index * 0.05;
  const bend = side * (0.22 + index * 0.1);
  const points = [
    new THREE.Vector3(x * 0.84, y, z),
    new THREE.Vector3(x + bend * 0.34, y + 0.12, z - 0.02),
    new THREE.Vector3(x + bend * 0.76, y + 0.2 - index * 0.06, z - 0.03),
    new THREE.Vector3(x + bend, y - 0.03 - index * 0.05, z + 0.04)
  ];
  tube(points, 0.105 - index * 0.012, index === 1 ? magentaLight : magenta);
  const tip = points[points.length - 1];
  ellipsoid(softSphere, index === 1 ? magentaLight : magenta, tip, new THREE.Vector3(0.18, 0.11, 0.07), new THREE.Vector3(0, side * 0.35, side * 0.22));
}

for (let sideIndex = -1; sideIndex <= 1; sideIndex += 2) {
  for (let frondIndex = 0; frondIndex < 3; frondIndex += 1) frond(sideIndex, frondIndex);
}

function limb(position, scale, rotation) {
  const limbMesh = ellipsoid(softSphere, pink, position, scale, rotation);
  const paw = ellipsoid(softSphere, pinkLight,
    new THREE.Vector3(position.x, position.y - 0.04, position.z + 0.18),
    new THREE.Vector3(scale.x * 1.08, scale.y * 0.72, scale.z * 0.72),
    rotation
  );
  return { limbMesh, paw };
}

limb(new THREE.Vector3(-0.82, -0.18, 0.12), new THREE.Vector3(0.34, 0.22, 0.48), new THREE.Vector3(-0.18, 0.2, -0.18));
limb(new THREE.Vector3(0.82, -0.18, 0.12), new THREE.Vector3(0.34, 0.22, 0.48), new THREE.Vector3(-0.18, -0.2, 0.18));
limb(new THREE.Vector3(-0.76, 0.42, -0.9), new THREE.Vector3(0.3, 0.2, 0.42), new THREE.Vector3(0.1, 0.18, -0.22));
limb(new THREE.Vector3(0.76, 0.42, -0.9), new THREE.Vector3(0.3, 0.2, 0.42), new THREE.Vector3(0.1, -0.18, 0.22));

const eyeGeometry = new THREE.SphereGeometry(0.105, 24, 16);
const leftEye = ellipsoid(eyeGeometry, eyeMaterial, new THREE.Vector3(-0.52, 1.16, 0.79), new THREE.Vector3(1, 1.2, 0.55));
const rightEye = ellipsoid(eyeGeometry, eyeMaterial, new THREE.Vector3(0.52, 1.16, 0.79), new THREE.Vector3(1, 1.2, 0.55));
ellipsoid(new THREE.SphereGeometry(0.027, 12, 8), highlightMaterial, new THREE.Vector3(-0.55, 1.2, 0.875), new THREE.Vector3(1, 1, 0.5));
ellipsoid(new THREE.SphereGeometry(0.027, 12, 8), highlightMaterial, new THREE.Vector3(0.49, 1.2, 0.875), new THREE.Vector3(1, 1, 0.5));

const smilePoints = [
  new THREE.Vector3(-0.38, 0.91, 0.84),
  new THREE.Vector3(-0.2, 0.82, 0.88),
  new THREE.Vector3(0, 0.8, 0.89),
  new THREE.Vector3(0.2, 0.82, 0.88),
  new THREE.Vector3(0.38, 0.91, 0.84)
];
tube(smilePoints, 0.025, thread);

const seamPoints = [
  new THREE.Vector3(0, 0.52, -0.28),
  new THREE.Vector3(0, 0.53, -0.82),
  new THREE.Vector3(0, 0.38, -1.34),
  new THREE.Vector3(0, 0.26, -1.86),
  new THREE.Vector3(0, 0.2, -2.72)
];
tube(seamPoints, 0.026, thread);

function wrinkle(side, z, y, angle) {
  const points = [
    new THREE.Vector3(side * 0.9, y + 0.02, z),
    new THREE.Vector3(side * 1.04, y - 0.08, z + 0.06),
    new THREE.Vector3(side * 1.1, y - 0.12, z + 0.16)
  ];
  const mark = tube(points, 0.018, pinkShadow);
  mark.rotation.z = angle;
}
wrinkle(-1, 0.24, -0.28, -0.1);
wrinkle(1, 0.24, -0.28, 0.1);
wrinkle(-1, -0.84, 0.2, -0.12);
wrinkle(1, -0.84, 0.2, 0.12);

const pillMaterial = new THREE.MeshStandardMaterial({ color: 0xe998b0, roughness: 1, metalness: 0 });
const pillGeometry = new THREE.SphereGeometry(0.035, 8, 6);
const pills = [
  [-0.9, 0.37, 0.5], [0.91, 0.31, 0.43], [-0.72, -0.2, 0.71],
  [0.68, -0.21, 0.7], [-0.62, 0.35, -1.05], [0.7, 0.3, -1.12],
  [-0.38, 0.49, -1.33], [0.42, 0.46, -1.42], [-1.05, 0.1, -0.2],
  [1.03, 0.02, -0.35], [-0.28, -0.33, 0.65], [0.25, -0.34, 0.62]
];
for (const pill of pills) {
  ellipsoid(pillGeometry, pillMaterial, new THREE.Vector3(pill[0], pill[1], pill[2]), new THREE.Vector3(1, 0.7, 0.7));
}

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(7, 64),
  new THREE.MeshStandardMaterial({ color: 0xf4d2df, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.72;
ground.receiveShadow = true;
scene.add(ground);

const hemisphere = new THREE.HemisphereLight(0xffedf5, 0xb66c91, 2.1);
scene.add(hemisphere);

const keyLight = new THREE.DirectionalLight(0xffffff, 3.2);
keyLight.position.set(-3.5, 6, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1536, 1536);
keyLight.shadow.camera.left = -4;
keyLight.shadow.camera.right = 4;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -3;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const rimLight = new THREE.PointLight(0xff8fc4, 2.1, 8, 2);
rimLight.position.set(3, 2.5, -2.5);
scene.add(rimLight);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
