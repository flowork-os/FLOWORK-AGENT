<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x063b63);
scene.fog = new THREE.FogExp2(0x075075, 0.017);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 250);
camera.position.set(24, 15, 30);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;
controls.minDistance = 16;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.49;

let seed = 0x5ea5ca1e;
function random() {
  seed |= 0;
  seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
const rand = (a, b) => a + (b - a) * random();
const pick = a => a[Math.floor(random() * a.length)];

function canvasTexture(size, painter) {
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext("2d");
  painter(ctx, size);
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const sandTexture = canvasTexture(256, (c, s) => {
  c.fillStyle = "#cdb981";
  c.fillRect(0, 0, s, s);
  for (let i = 0; i < 6500; i++) {
    const v = Math.floor(rand(130, 225));
    c.fillStyle = `rgba(${v},${v - 12},${v - 48},${rand(.05,.25)})`;
    const r = rand(.25, 1.35);
    c.beginPath();
    c.arc(rand(0,s), rand(0,s), r, 0, Math.PI * 2);
    c.fill();
  }
});
sandTexture.repeat.set(12, 12);

const causticTexture = canvasTexture(512, (c, s) => {
  c.fillStyle = "#0b6f91";
  c.fillRect(0, 0, s, s);
  c.globalCompositeOperation = "screen";
  c.filter = "blur(5px)";
  for (let i = 0; i < 65; i++) {
    c.strokeStyle = `rgba(130,245,255,${rand(.06,.18)})`;
    c.lineWidth = rand(1, 5);
    c.beginPath();
    const y = rand(0, s);
    c.moveTo(-20, y);
    for (let x = 0; x <= s + 20; x += 30)
      c.quadraticCurveTo(x + 15, y + rand(-25,25), x + 30, y + rand(-10,10));
    c.stroke();
  }
});
causticTexture.repeat.set(3, 3);

const sandMat = new THREE.MeshStandardMaterial({
  color: 0xd8c28a,
  map: sandTexture,
  roughness: .92,
  metalness: 0
});
const floorGeo = new THREE.PlaneGeometry(90, 75, 45, 38);
const pos = floorGeo.attributes.position;
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), y = pos.getY(i);
  const edge = Math.max(0, (Math.abs(x) - 25) * .03);
  pos.setZ(i, Math.sin(x * .22) * .22 + Math.cos(y * .17) * .18 - edge);
}
floorGeo.computeVertexNormals();
const floor = new THREE.Mesh(floorGeo, sandMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -.55;
floor.receiveShadow = true;
scene.add(floor);

const backdrop = new THREE.Mesh(
  new THREE.SphereGeometry(95, 48, 24, 0, Math.PI * 2, 0, Math.PI * .56),
  new THREE.MeshBasicMaterial({
    color: 0x075579,
    map: causticTexture,
    side: THREE.BackSide,
    fog: false
  })
);
backdrop.rotation.z = Math.PI;
backdrop.position.y = 32;
scene.add(backdrop);

scene.add(new THREE.HemisphereLight(0x72dffc, 0x20403c, 1.8));
const sun = new THREE.DirectionalLight(0xc9ffff, 3.3);
sun.position.set(-12, 28, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30;
sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30;
sun.shadow.camera.bottom = -20;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 70;
sun.shadow.bias = -.00025;
scene.add(sun);

const fill = new THREE.PointLight(0x31bde0, 18, 42, 2);
fill.position.set(13, 8, 12);
scene.add(fill);
const coralGlow = new THREE.PointLight(0xff4b9b, 10, 18, 2);
coralGlow.position.set(-8, 4, 2);
scene.add(coralGlow);

function material(color, roughness=.65, emissive=0x000000) {
  return new THREE.MeshStandardMaterial({
    color, roughness, metalness: .02, emissive, emissiveIntensity: .16
  });
}
const rockMat = material(0x496c69, .95);
const rockMat2 = material(0x365c60, .93);
const coralColors = [0xff638f, 0xff8b42, 0xb967e8, 0xef487f, 0xffb34f];

function shadow(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function addRock(x, z, scale=1) {
  const g = new THREE.DodecahedronGeometry(1, 1);
  const m = shadow(new THREE.Mesh(g, random() > .5 ? rockMat : rockMat2));
  m.position.set(x, rand(.15,.55) * scale, z);
  m.scale.set(rand(1.2,2.4), rand(.65,1.2), rand(1,2.1)).multiplyScalar(scale);
  m.rotation.set(rand(-.3,.3), rand(0,6.28), rand(-.15,.15));
  scene.add(m);
  return m;
}
for (let i = 0; i < 26; i++) {
  const a = rand(0, Math.PI * 2), r = rand(7, 31);
  addRock(Math.cos(a) * r, Math.sin(a) * r, rand(.35,1.2));
}

function cylinderBetween(a, b, r1, r2, mat, radial=8) {
  const d = new THREE.Vector3().subVectors(b, a);
  const mesh = shadow(new THREE.Mesh(
    new THREE.CylinderGeometry(r2, r1, d.length(), radial, 1),
    mat
  ));
  mesh.position.copy(a).add(b).multiplyScalar(.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize());
  return mesh;
}

function createStaghorn(x, z, color, scale=1) {
  const group = new THREE.Group();
  const mat = material(color, .58, color);
  const tips = [];
  function branch(start, dir, length, radius, depth) {
    const end = start.clone().addScaledVector(dir, length);
    group.add(cylinderBetween(start, end, radius, radius * .67, mat, 9));
    if (depth <= 0) {
      const tip = shadow(new THREE.Mesh(
        new THREE.SphereGeometry(radius * .72, 8, 6), mat
      ));
      tip.position.copy(end);
      group.add(tip);
      tips.push(tip);
      return;
    }
    const count = depth === 3 ? 4 : 2 + (random() > .42 ? 1 : 0);
    for (let i = 0; i < count; i++) {
      const nd = dir.clone();
      nd.x += rand(-.65,.65);
      nd.z += rand(-.65,.65);
      nd.y += rand(.08,.45);
      nd.normalize();
      branch(end, nd, length * rand(.56,.76), radius * .68, depth - 1);
    }
  }
  const trunks = 4;
  for (let i = 0; i < trunks; i++) {
    const start = new THREE.Vector3(rand(-.55,.55), 0, rand(-.55,.55));
    branch(start, new THREE.Vector3(rand(-.22,.22),1,rand(-.22,.22)).normalize(),
      rand(2.3,3.5), .28, 3);
  }
  group.position.set(x, 0, z);
  group.scale.setScalar(scale);
  scene.add(group);
  return group;
}

createStaghorn(-8, 1, 0xff557d, 1.25);
createStaghorn(7, -5, 0xff873c, 1.05);
createStaghorn(11, 5, 0xb65ce0, .84);
createStaghorn(-13, -7, 0xffa34c, .72);

function createBrainCoral(x, z, color, scale=1) {
  const group = new THREE.Group();
  const base = shadow(new THREE.Mesh(
    new THREE.SphereGeometry(1.75, 42, 25, 0, Math.PI*2, 0, Math.PI*.54),
    material(color, .72, color)
  ));
  base.scale.set(1.25, .82, 1.05);
  group.add(base);
  const ridgeMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(color).multiplyScalar(.63),
    roughness: .75
  });
  for (let i = 0; i < 11; i++) {
    const curve = [];
    const phase = rand(0,6.28);
    for (let j = 0; j < 32; j++) {
      const t = j / 31;
      const a = phase + t * rand(2.8,5.5);
      const rad = 1.45 * Math.sin(t * Math.PI);
      curve.push(new THREE.Vector3(
        Math.cos(a) * rad * 1.15,
        Math.cos((t-.5)*Math.PI) * .75 + .35,
        Math.sin(a) * rad
      ));
    }
    const tube = shadow(new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(curve), 36, .065, 5, false),
      ridgeMat
    ));
    group.add(tube);
  }
  group.position.set(x, .15, z);
  group.scale.setScalar(scale);
  group.rotation.y = rand(0,6.28);
  scene.add(group);
}
createBrainCoral(1, -3, 0xe65a9a, 1.2);
createBrainCoral(-4, 8, 0xff8048, .95);
createBrainCoral(13, 1, 0x9659cf, .75);

const animatedKelp = [];
function createKelp(x, z, height=7, color=0x3b8f60) {
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: .8, side: THREE.DoubleSide
  });
  for (let k = 0; k < 3; k++) {
    const geo = new THREE.PlaneGeometry(rand(.45,.8), height * rand(.75,1.1), 1, 16);
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const y = p.getY(i) + height/2;
      p.setX(i, p.getX(i) + Math.sin(y * 1.15 + k) * .24 * y / height);
    }
    geo.translate(0, height/2, 0);
    geo.computeVertexNormals();
    const blade = shadow(new THREE.Mesh(geo, mat));
    blade.position.set(rand(-.35,.35), 0, rand(-.3,.3));
    blade.rotation.y = rand(0,Math.PI);
    blade.userData.phase = rand(0,6.28);
    group.add(blade);
    animatedKelp.push(blade);
  }
  group.position.set(x, 0, z);
  scene.add(group);
}
for (let i = 0; i < 18; i++) {
  const side = random() > .5 ? 1 : -1;
  createKelp(side * rand(14,27), rand(-17,13), rand(4,9),
    pick([0x337d58,0x428d62,0x39724c,0x52966b]));
}

const fans = [];
function createSeaFan(x, z, color, scale=1) {
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({
    color, roughness: .74, side: THREE.DoubleSide
  });
  const root = new THREE.Vector3(0,0,0);
  function fanBranch(start, angle, length, width, depth) {
    const dir = new THREE.Vector3(Math.sin(angle), Math.cos(angle), rand(-.035,.035));
    const end = start.clone().addScaledVector(dir, length);
    group.add(cylinderBetween(start, end, width, width*.72, mat, 5));
    if (depth > 0) {
      fanBranch(end, angle-rand(.18,.35), length*.75, width*.7, depth-1);
      fanBranch(end, angle+rand(.18,.35), length*.75, width*.7, depth-1);
    }
  }
  fanBranch(root, 0, 1.2, .075, 5);
  group.position.set(x,.1,z);
  group.scale.setScalar(scale);
  group.rotation.y = rand(0,6.28);
  group.userData.phase = rand(0,6.28);
  fans.push(group);
  scene.add(group);
}
createSeaFan(-15, 2, 0xd52e78, 1.2);
createSeaFan(15, -7, 0xff6b52, 1.0);
createSeaFan(4, 9, 0xa341bd, .8);
createSeaFan(-10, -10, 0xe44887, .7);

const tentacles = [];
function createAnemone(x, z, color=0xf675c8) {
  const group = new THREE.Group();
  const base = shadow(new THREE.Mesh(
    new THREE.SphereGeometry(1.45, 20, 10, 0, Math.PI*2, 0, Math.PI*.55),
    material(0xa13b8f,.8)
  ));
  base.scale.y = .55;
  group.add(base);
  const tentacleMat = material(color, .54, color);
  for (let i = 0; i < 30; i++) {
    const a = rand(0,6.28), r = Math.sqrt(random()) * 1.25;
    const points = [
      new THREE.Vector3(Math.cos(a)*r,.25,Math.sin(a)*r),
      new THREE.Vector3(Math.cos(a)*r*.95,1.0,Math.sin(a)*r*.95),
      new THREE.Vector3(Math.cos(a)*r+rand(-.3,.3),1.7+rand(-.2,.3),Math.sin(a)*r+rand(-.3,.3))
    ];
    const mesh = shadow(new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 9, rand(.055,.095), 6),
      tentacleMat
    ));
    mesh.userData.phase = rand(0,6.28);
    mesh.userData.baseRot = mesh.rotation.z;
    group.add(mesh);
    tentacles.push(mesh);
  }
  group.position.set(x,.05,z);
  scene.add(group);
}
createAnemone(-3, 3, 0xff74c9);
createAnemone(8, 6, 0xff9866);

function createFish(color=0xffb128, stripe=true) {
  const group = new THREE.Group();
  const bodyMat = material(color,.42);
  const body = shadow(new THREE.Mesh(new THREE.SphereGeometry(1,18,12),bodyMat));
  body.scale.set(1.3,.65,.38);
  group.add(body);
  const finMat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(color).multiplyScalar(.75),
    roughness:.55, side:THREE.DoubleSide
  });
  const tailShape = new THREE.Shape();
  tailShape.moveTo(0,0);
  tailShape.lineTo(-.85,.65);
  tailShape.lineTo(-.7,0);
  tailShape.lineTo(-.85,-.65);
  tailShape.closePath();
  const tail = shadow(new THREE.Mesh(new THREE.ShapeGeometry(tailShape),finMat));
  tail.position.x = -1.15;
  group.add(tail);
  const fin = shadow(new THREE.Mesh(
    new THREE.ConeGeometry(.36,.85,3), finMat
  ));
  fin.position.set(0,.62,0);
  fin.rotation.z = -.15;
  group.add(fin);
  if (stripe) {
    for (const x of [-.35,.45]) {
      const band = new THREE.Mesh(
        new THREE.TorusGeometry(.48,.10,8,18), material(0xf7f3df,.5)
      );
      band.rotation.y = Math.PI/2;
      band.position.x = x;
      band.scale.y = 1.12;
      group.add(band);
    }
  }
  const eye = new THREE.Mesh(
    new THREE.SphereGeometry(.09,8,6), new THREE.MeshBasicMaterial({color:0x07151b})
  );
  eye.position.set(.75,.22,.35);
  group.add(eye);
  return group;
}

const clownfish = [];
for (let i = 0; i < 4; i++) {
  const fish = createFish(0xff861f, true);
  fish.scale.setScalar(rand(.42,.58));
  fish.userData = { phase: rand(0,6.28), center: new THREE.Vector3(-3,2.3,3) };
  scene.add(fish);
  clownfish.push(fish);
}

const schools = [];
function createSchool(count, center, color, scale=.28) {
  const group = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const fish = createFish(color,false);
    fish.scale.setScalar(scale * rand(.7,1.15));
    const row = Math.floor(i / 6);
    const col = i % 6;
    fish.position.set(col*1.2 + row*.35, rand(-.4,.4)-row*.7, rand(-1.1,1.1));
    fish.rotation.y = rand(-.08,.08);
    fish.userData.phase = rand(0,6.28);
    group.add(fish);
  }
  group.position.copy(center);
  group.userData.phase = rand(0,6.28);
  group.userData.base = center.clone();
  scene.add(group);
  schools.push(group);
}
createSchool(24,new THREE.Vector3(-14,10,-7),0x4bd2de,.24);
createSchool(18,new THREE.Vector3(7,13,-9),0xf3d35c,.22);
createSchool(15,new THREE.Vector3(15,8,7),0x76c7f3,.2);

function createTurtle() {
  const group = new THREE.Group();
  const shellMat = material(0x3e7356,.62);
  const skinMat = material(0x6b9470,.72);
  const shell = shadow(new THREE.Mesh(
    new THREE.SphereGeometry(1.7,24,16), shellMat
  ));
  shell.scale.set(1.35,.45,1);
  group.add(shell);
  const underside = shadow(new THREE.Mesh(
    new THREE.SphereGeometry(1.48,20,12), material(0xb4a46c,.8)
  ));
  underside.position.y = -.3;
  underside.scale.set(1.3,.25,.92);
  group.add(underside);
  const head = shadow(new THREE.Mesh(new THREE.SphereGeometry(.48,14,10),skinMat));
  head.position.set(2.05,.05,0);
  head.scale.set(1.15,.8,.8);
  group.add(head);
  for (const z of [-1,1]) {
    const flipper = shadow(new THREE.Mesh(
      new THREE.SphereGeometry(1,16,8),skinMat
    ));
    flipper.scale.set(1.2,.13,.55);
    flipper.position.set(.25,-.08,z*1.25);
    flipper.rotation.y = z*.38;
    flipper.userData.side = z;
    group.add(flipper);
    group.userData.flippers ||= [];
    group.userData.flippers.push(flipper);
  }
  for (const z of [-1,1]) {
    const rear = shadow(new THREE.Mesh(
      new THREE.SphereGeometry(.55,12,7),skinMat
    ));
    rear.scale.set(.8,.13,.42);
    rear.position.set(-1.55,-.1,z*.75);
    rear.rotation.y = z*.25;
    group.add(rear);
  }
  const eye = new THREE.Mesh(
    new THREE.SphereGeometry(.065,8,6),new THREE.MeshBasicMaterial({color:0x07130e})
  );
  eye.position.set(2.43,.17,.28);
  group.add(eye);
  group.position.set(2,10,7);
  group.rotation.y = -.35;
  group.scale.setScalar(1.15);
  scene.add(group);
  return group;
}
const turtle = createTurtle();

function createStarfish(x,z,color,scale=1) {
  const shape = new THREE.Shape();
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5 + Math.PI/2;
    const r = i % 2 ? .35 : 1;
    const px = Math.cos(a)*r, py = Math.sin(a)*r;
    i ? shape.lineTo(px,py) : shape.moveTo(px,py);
  }
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape,{
    depth:.14,bevelEnabled:true,bevelSegments:2,bevelSize:.08,bevelThickness:.06
  });
  geo.center();
  const star = shadow(new THREE.Mesh(geo,material(color,.77)));
  star.position.set(x,.02,z);
  star.rotation.set(-Math.PI/2,0,rand(0,6.28));
  star.scale.setScalar(scale);
  scene.add(star);
}
createStarfish(-1,10,0xe35e4d,1);
createStarfish(12,-10,0xf29b42,.8);
createStarfish(-16,-2,0xb84d81,.65);
createStarfish(4,-12,0xe56f49,.72);

function createAnchor() {
  const group = new THREE.Group();
  const metal = new THREE.MeshStandardMaterial({
    color:0x35494b,roughness:.83,metalness:.65
  });
  const shaft = shadow(new THREE.Mesh(new THREE.CylinderGeometry(.19,.24,5,10),metal));
  group.add(shaft);
  const ring = shadow(new THREE.Mesh(new THREE.TorusGeometry(.65,.16,10,24),metal));
  ring.position.y = 2.75;
  group.add(ring);
  const bar = shadow(new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,3.2,8),metal));
  bar.rotation.z = Math.PI/2;
  bar.position.y = 1.65;
  group.add(bar);
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-2,-2.2,0),
    new THREE.Vector3(-1.2,-2.75,0),
    new THREE.Vector3(0,-2.4,0),
    new THREE.Vector3(1.2,-2.75,0),
    new THREE.Vector3(2,-2.2,0)
  ]);
  group.add(shadow(new THREE.Mesh(new THREE.TubeGeometry(curve,28,.2,8),metal)));
  for (const s of [-1,1]) {
    const tip = shadow(new THREE.Mesh(new THREE.ConeGeometry(.42,1.15,8),metal));
    tip.position.set(s*2,-1.8,0);
    tip.rotation.z = s*.55;
    group.add(tip);
  }
  group.position.set(-11,1.05,9);
  group.rotation.set(.15,0,-1.03);
  scene.add(group);
}
createAnchor();

const bubbles = [];
const bubbleMat = new THREE.MeshPhysicalMaterial({
  color:0xc8f8ff,transparent:true,opacity:.32,roughness:.05,
  metalness:0,transmission:.75,thickness:.08,depthWrite:false
});
function bubbleStream(x,z,count=18) {
  for (let i = 0; i < count; i++) {
    const bubble = new THREE.Mesh(
      new THREE.SphereGeometry(rand(.06,.18),10,8),bubbleMat
    );
    bubble.position.set(x+rand(-.25,.25),rand(.2,17),z+rand(-.25,.25));
    bubble.userData = {baseX:x,baseZ:z,speed:rand(.45,1.1),phase:rand(0,6.28)};
    scene.add(bubble);
    bubbles.push(bubble);
  }
}
bubbleStream(-6,-2);
bubbleStream(9,2);
bubbleStream(-15,-8,12);

const rays = [];
const rayMat = new THREE.MeshBasicMaterial({
  color:0x9af6ff,transparent:true,opacity:.07,depthWrite:false,
  blending:THREE.AdditiveBlending,side:THREE.DoubleSide
});
for (let i = 0; i < 8; i++) {
  const ray = new THREE.Mesh(
    new THREE.CylinderGeometry(rand(1.2,2.7),rand(3,5),32,20,1,true),
    rayMat.clone()
  );
  ray.position.set(rand(-22,22),18,rand(-15,8));
  ray.rotation.z = rand(-.14,.14);
  ray.userData.phase = rand(0,6.28);
  scene.add(ray);
  rays.push(ray);
}

const particlesGeo = new THREE.BufferGeometry();
const particleCount = 700;
const particlePositions = new Float32Array(particleCount*3);
for (let i=0;i<particleCount;i++) {
  particlePositions[i*3] = rand(-42,42);
  particlePositions[i*3+1] = rand(.2,30);
  particlePositions[i*3+2] = rand(-35,25);
}
particlesGeo.setAttribute("position",new THREE.BufferAttribute(particlePositions,3));
const particles = new THREE.Points(
  particlesGeo,
  new THREE.PointsMaterial({
    color:0xa7eff1,size:.035,transparent:true,opacity:.5,depthWrite:false
  })
);
scene.add(particles);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  causticTexture.offset.x = t * .008;
  causticTexture.offset.y = Math.sin(t*.1)*.02;

  animatedKelp.forEach((blade,i) => {
    blade.rotation.z = Math.sin(t*.55 + blade.userData.phase)*(.08+i%3*.012);
    blade.rotation.x = Math.cos(t*.42 + blade.userData.phase)*.035;
  });

  fans.forEach(fan => {
    fan.rotation.z = Math.sin(t*.5+fan.userData.phase)*.045;
  });

  tentacles.forEach((tentacle,i) => {
    tentacle.rotation.z = Math.sin(t*1.15+tentacle.userData.phase)*(.08+(i%4)*.012);
    tentacle.rotation.x = Math.cos(t*.9+tentacle.userData.phase)*.045;
  });

  clownfish.forEach((fish,i) => {
    const a=t*.55+fish.userData.phase;
    fish.position.copy(fish.userData.center).add(new THREE.Vector3(
      Math.cos(a)*2.2,
      Math.sin(a*1.7)*.65+i*.15,
      Math.sin(a)*1.45
    ));
    fish.rotation.y = -a + Math.PI/2;
    fish.children[1].rotation.y = Math.sin(t*8+i)*.35;
  });

  schools.forEach((school,i) => {
    const a=t*.12+school.userData.phase;
    school.position.copy(school.userData.base);
    school.position.x += Math.cos(a)*5;
    school.position.z += Math.sin(a)*3;
    school.position.y += Math.sin(t*.25+i)*.5;
    school.rotation.y = -a*.35;
    school.children.forEach((fish,j) => {
      fish.position.y += Math.sin(t*1.6+j)*.0015;
      fish.children[1].rotation.y = Math.sin(t*7+j)*.32;
    });
  });

  turtle.position.x = Math.sin(t*.12)*7+2;
  turtle.position.z = Math.cos(t*.12)*6+5;
  turtle.position.y = 9.5+Math.sin(t*.35)*.7;
  turtle.rotation.y = -t*.12;
  turtle.userData.flippers.forEach((f,i) => {
    f.rotation.x = Math.sin(t*1.25+i*Math.PI)*.34;
  });

  bubbles.forEach(b => {
    b.position.y += .025*b.userData.speed;
    b.position.x = b.userData.baseX+Math.sin(t*.8+b.userData.phase)*.25;
    b.position.z = b.userData.baseZ+Math.cos(t*.7+b.userData.phase)*.18;
    if (b.position.y > 22) b.position.y = rand(.1,1);
  });

  rays.forEach((r,i) => {
    r.material.opacity=.045+(Math.sin(t*.24+r.userData.phase)+1)*.025;
    r.rotation.y=t*.012*(i%2?1:-1);
  });

  particles.rotation.y=t*.008;
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",() => {
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
