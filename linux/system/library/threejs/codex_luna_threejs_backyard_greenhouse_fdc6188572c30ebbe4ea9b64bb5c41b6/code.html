<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backyard Greenhouse</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #b9d2d8;
      font-family: Georgia, serif;
    }
    #app {
      width: 100%;
      height: 100%;
    }
    .label {
      position: fixed;
      left: 28px;
      bottom: 24px;
      color: rgba(255,255,255,.85);
      letter-spacing: .16em;
      font-size: 11px;
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0,0,0,.35);
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="label">Backyard greenhouse · orbit to explore</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb9d2d8);
    scene.fog = new THREE.Fog(0xb9d2d8, 24, 48);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(8.7, 5.8, -9.5);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.getElementById("app").appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.65, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.45;
    controls.enablePan = false;
    controls.minDistance = 7;
    controls.maxDistance = 23;
    controls.maxPolarAngle = Math.PI * 0.49;

    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x9bd7d8,
      metalness: 0.04,
      roughness: 0.13,
      transmission: 0.18,
      transparent: true,
      opacity: 0.28,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const aluminumMaterial = new THREE.MeshStandardMaterial({
      color: 0x83949a,
      metalness: 0.86,
      roughness: 0.24
    });

    const darkAluminumMaterial = new THREE.MeshStandardMaterial({
      color: 0x43545a,
      metalness: 0.78,
      roughness: 0.27
    });

    const concreteMaterial = new THREE.MeshStandardMaterial({
      color: 0x8b9794,
      roughness: 0.86
    });

    const grassMaterial = new THREE.MeshStandardMaterial({
      color: 0x526b4c,
      roughness: 1
    });

    const woodMaterial = new THREE.MeshStandardMaterial({
      color: 0x805637,
      roughness: 0.82
    });

    const woodDarkMaterial = new THREE.MeshStandardMaterial({
      color: 0x573a2c,
      roughness: 0.88
    });

    const terracottaMaterial = new THREE.MeshStandardMaterial({
      color: 0xb96543,
      roughness: 0.8
    });

    const soilMaterial = new THREE.MeshStandardMaterial({
      color: 0x30251e,
      roughness: 1
    });

    const foliageMaterial = new THREE.MeshStandardMaterial({
      color: 0x3d6b43,
      roughness: 0.9,
      flatShading: true
    });

    const foliageLightMaterial = new THREE.MeshStandardMaterial({
      color: 0x719354,
      roughness: 0.88,
      flatShading: true
    });

    const brassMaterial = new THREE.MeshStandardMaterial({
      color: 0xb98a4e,
      metalness: 0.8,
      roughness: 0.24
    });

    const pathMaterial = new THREE.MeshStandardMaterial({
      color: 0xa8aaa0,
      roughness: 0.96
    });

    function addBox(parent, size, position, material, rotation = null, castShadow = true, receiveShadow = true) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(size.x, size.y, size.z),
        material
      );
      mesh.position.copy(position);
      if (rotation) {
        mesh.rotation.copy(rotation);
      }
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;
      parent.add(mesh);
      return mesh;
    }

    function addCylinder(parent, radius, height, position, material, segments = 16, rotation = null) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, height, segments),
        material
      );
      mesh.position.copy(position);
      if (rotation) {
        mesh.rotation.copy(rotation);
      }
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function createBeam(start, end, thickness, material, parent = scene) {
      const direction = end.clone().sub(start);
      const length = direction.length();
      if (length < 0.0001) {
        return null;
      }
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(thickness, thickness, length),
        material
      );
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 0, 1),
        direction.normalize()
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function createGlassBox(size, position, rotation = null, parent = scene) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(size.x, size.y, size.z),
        glassMaterial
      );
      mesh.position.copy(position);
      if (rotation) {
        mesh.rotation.copy(rotation);
      }
      mesh.renderOrder = 2;
      parent.add(mesh);
      return mesh;
    }

    function createGableGlass(zPosition) {
      const geometry = new THREE.BufferGeometry();
      const vertices = new Float32Array([
        -3.0, 3.0, 0,
         3.0, 3.0, 0,
         0.0, 4.35, 0
      ]);
      geometry.setAttribute("position", new THREE.BufferAttribute(vertices, 3));
      geometry.computeVertexNormals();

      const mesh = new THREE.Mesh(geometry, glassMaterial);
      mesh.position.z = zPosition;
      mesh.renderOrder = 2;
      scene.add(mesh);
      return mesh;
    }

    function createShrub(x, z, scale) {
      const group = new THREE.Group();
      group.position.set(x, 0, z);

      const positions = [
        [-0.42, 0.52, 0.06],
        [0.0, 0.64, 0.0],
        [0.42, 0.48, -0.03],
        [-0.18, 0.9, 0.02],
        [0.23, 0.82, 0.03]
      ];

      positions.forEach((item, index) => {
        const bush = new THREE.Mesh(
          new THREE.SphereGeometry(
            (index === 3 || index === 4 ? 0.42 : 0.5) * scale,
            10,
            7
          ),
          index % 2 === 0 ? foliageMaterial : foliageLightMaterial
        );
        bush.position.set(item[0] * scale, item[1] * scale, item[2] * scale);
        bush.scale.y = 0.82;
        bush.castShadow = true;
        bush.receiveShadow = true;
        group.add(bush);
      });

      scene.add(group);
      return group;
    }

    function createPlant(parent, x, z, scale) {
      const potHeight = 0.25 * scale;
      const pot = new THREE.Mesh(
        new THREE.CylinderGeometry(0.17 * scale, 0.125 * scale, potHeight, 12),
        terracottaMaterial
      );
      pot.position.set(x, 1.18 + potHeight * 0.5, z);
      pot.castShadow = true;
      pot.receiveShadow = true;
      parent.add(pot);

      const soil = new THREE.Mesh(
        new THREE.CylinderGeometry(0.135 * scale, 0.135 * scale, 0.025 * scale, 12),
        soilMaterial
      );
      soil.position.set(x, 1.18 + potHeight + 0.012, z);
      soil.castShadow = true;
      parent.add(soil);

      const stem = new THREE.Mesh(
        new THREE.CylinderGeometry(0.025 * scale, 0.032 * scale, 0.52 * scale, 8),
        foliageMaterial
      );
      stem.position.set(x, 1.65 * scale + 0.42, z);
      stem.castShadow = true;
      parent.add(stem);

      const leafA = new THREE.Mesh(
        new THREE.SphereGeometry(0.16 * scale, 8, 6),
        foliageLightMaterial
      );
      leafA.position.set(x - 0.13 * scale, 1.72 * scale + 0.5, z + 0.02);
      leafA.scale.set(1.55, 0.55, 0.8);
      leafA.rotation.z = -0.38;
      leafA.castShadow = true;
      parent.add(leafA);

      const leafB = new THREE.Mesh(
        new THREE.SphereGeometry(0.16 * scale, 8, 6),
        foliageMaterial
      );
      leafB.position.set(x + 0.13 * scale, 1.86 * scale + 0.46, z - 0.03);
      leafB.scale.set(1.45, 0.52, 0.78);
      leafB.rotation.z = 0.36;
      leafB.castShadow = true;
      parent.add(leafB);
    }

    function createBench(x) {
      const bench = new THREE.Group();
      bench.position.x = x;

      addBox(
        bench,
        new THREE.Vector3(0.68, 0.12, 3.45),
        new THREE.Vector3(0, 1.03, 0.05),
        woodMaterial
      );

      [-1.42, 1.52].forEach((zValue) => {
        [-0.23, 0.23].forEach((xValue) => {
          addBox(
            bench,
            new THREE.Vector3(0.1, 0.94, 0.1),
            new THREE.Vector3(xValue, 0.52, zValue),
            woodDarkMaterial
          );
        });
      });

      addBox(
        bench,
        new THREE.Vector3(0.55, 0.1, 3.12),
        new THREE.Vector3(0, 0.55, 0.05),
        woodDarkMaterial
      );

      addBox(
        bench,
        new THREE.Vector3(0.66, 0.08, 3.45),
        new THREE.Vector3(0, 1.29, 0.05),
        woodDarkMaterial
      );

      scene.add(bench);
      return bench;
    }

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(36, 36),
      grassMaterial
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.04;
    ground.receiveShadow = true;
    scene.add(ground);

    addBox(
      scene,
      new THREE.Vector3(9.5, 0.12, 7.4),
      new THREE.Vector3(0, 0.02, 0.45),
      concreteMaterial
    );

    const fencePlankMaterial = new THREE.MeshStandardMaterial({
      color: 0x7d6650,
      roughness: 0.92
    });

    for (let index = -15; index <= 15; index += 1) {
      const plankHeight = 3.35 + (Math.abs(index) % 3) * 0.12;
      addBox(
        scene,
        new THREE.Vector3(0.68, plankHeight, 0.14),
        new THREE.Vector3(index * 0.78, plankHeight * 0.5 - 0.03, 6.0),
        fencePlankMaterial
      );
    }

    [0.75, 2.55].forEach((railHeight) => {
      addBox(
        scene,
        new THREE.Vector3(25.5, 0.16, 0.22),
        new THREE.Vector3(0, railHeight, 5.88),
        woodDarkMaterial
      );
    });

    const steppingStones = [
      [-0.55, -3.3, 1.1, 0.52],
      [0.42, -4.35, 1.0, -0.42],
      [-0.22, -5.4, 1.25, 0.24],
      [0.55, -6.5, 1.08, -0.2],
      [-0.42, -7.55, 1.18, 0.35]
    ];

    steppingStones.forEach((stone) => {
      addBox(
        scene,
        new THREE.Vector3(stone[2], 0.12, 0.62),
        new THREE.Vector3(stone[0], 0.13, stone[1]),
        pathMaterial,
        new THREE.Euler(0, stone[3], 0)
      );
    });

    createShrub(-5.0, 3.75, 1.15);
    createShrub(5.0, 4.0, 1.0);
    createShrub(-5.3, -2.8, 0.78);
    createShrub(5.15, -2.4, 0.9);

    const greenhouseFloor = addBox(
      scene,
      new THREE.Vector3(5.7, 0.08, 3.7),
      new THREE.Vector3(0, 0.13, 0),
      new THREE.MeshStandardMaterial({ color: 0x6e7770, roughness: 0.9 })
    );
    greenhouseFloor.receiveShadow = true;

    const halfWidth = 3.0;
    const halfDepth = 2.0;
    const wallHeight = 3.0;
    const roofRise = 1.35;
    const roofY = wallHeight + roofRise;
    const roofAngle = Math.atan2(roofRise, halfWidth);
    const roofLength = Math.sqrt(halfWidth * halfWidth + roofRise * roofRise);

    [-halfWidth, halfWidth].forEach((xValue) => {
      [-halfDepth, 0, halfDepth].forEach((zValue) => {
        createBeam(
          new THREE.Vector3(xValue, 0.18, zValue),
          new THREE.Vector3(xValue, wallHeight, zValue),
          0.105,
          aluminumMaterial
        );
      });
    });

    [-halfDepth, halfDepth].forEach((zValue) => {
      createBeam(
        new THREE.Vector3(-halfWidth, 0.18, zValue),
        new THREE.Vector3(halfWidth, 0.18, zValue),
        0.105,
        aluminumMaterial
      );
      createBeam(
        new THREE.Vector3(-halfWidth, wallHeight, zValue),
        new THREE.Vector3(halfWidth, wallHeight, zValue),
        0.105,
        aluminumMaterial
      );
    });

    [-halfWidth, halfWidth].forEach((xValue) => {
      createBeam(
        new THREE.Vector3(xValue, wallHeight, -halfDepth),
        new THREE.Vector3(xValue, wallHeight, halfDepth),
        0.105,
        aluminumMaterial
      );
      createBeam(
        new THREE.Vector3(xValue, 1.5, -halfDepth),
        new THREE.Vector3(xValue, 1.5, halfDepth),
        0.075,
        aluminumMaterial
      );
    });

    [-halfDepth, 0, halfDepth].forEach((zValue) => {
      createBeam(
        new THREE.Vector3(-halfWidth, 1.5, zValue),
        new THREE.Vector3(halfWidth, 1.5, zValue),
        0.075,
        aluminumMaterial
      );
    });

    [-halfDepth, -1, 0, 1, halfDepth].forEach((zValue) => {
      createBeam(
        new THREE.Vector3(-halfWidth, wallHeight, zValue),
        new THREE.Vector3(0, roofY, zValue),
        0.09,
        aluminumMaterial
      );
      createBeam(
        new THREE.Vector3(0, roofY, zValue),
        new THREE.Vector3(halfWidth, wallHeight, zValue),
        0.09,
        aluminumMaterial
      );
    });

    createBeam(
      new THREE.Vector3(0, roofY, -halfDepth),
      new THREE.Vector3(0, roofY, halfDepth),
      0.11,
      aluminumMaterial
    );

    createGlassBox(
      new THREE.Vector3(0.035, wallHeight - 0.15, halfDepth * 2 - 0.18),
      new THREE.Vector3(-halfWidth + 0.012, wallHeight * 0.5, 0)
    );

    createGlassBox(
      new THREE.Vector3(0.035, wallHeight - 0.15, halfDepth * 2 - 0.18),
      new THREE.Vector3(halfWidth - 0.012, wallHeight * 0.5, 0)
    );

    createGlassBox(
      new THREE.Vector3(halfWidth * 2 - 0.18, wallHeight - 0.15, 0.035),
      new THREE.Vector3(0, wallHeight * 0.5, halfDepth - 0.012)
    );

    const doorWidth = 1.5;
    const frontPanelWidth = (halfWidth - doorWidth * 0.5) - 0.14;
    const frontPanelHeight = wallHeight - 0.15;
    const leftPanelCenter = (-halfWidth - doorWidth * 0.5) * 0.5;
    const rightPanelCenter = (halfWidth + doorWidth * 0.5) * 0.5;

    createGlassBox(
      new THREE.Vector3(frontPanelWidth, frontPanelHeight, 0.035),
      new THREE.Vector3(leftPanelCenter, wallHeight * 0.5, -halfDepth - 0.014)
    );

    createGlassBox(
      new THREE.Vector3(frontPanelWidth, frontPanelHeight, 0.035),
      new THREE.Vector3(rightPanelCenter, wallHeight * 0.5, -halfDepth - 0.014)
    );

    const roofPanelY = wallHeight + roofRise * 0.5;
    createGlassBox(
      new THREE.Vector3(roofLength, 0.035, halfDepth * 2 - 0.16),
      new THREE.Vector3(-halfWidth * 0.5, roofPanelY, 0),
      new THREE.Euler(0, 0, roofAngle)
    );

    createGlassBox(
      new THREE.Vector3(roofLength, 0.035, halfDepth * 2 - 0.16),
      new THREE.Vector3(halfWidth * 0.5, roofPanelY, 0),
      new THREE.Euler(0, 0, -roofAngle)
    );

    createGableGlass(-halfDepth - 0.018);
    createGableGlass(halfDepth + 0.018);

    const doorGroup = new THREE.Group();
    doorGroup.position.set(-doorWidth * 0.5, 0.12, -halfDepth - 0.12);
    doorGroup.rotation.y = 0.16;
    scene.add(doorGroup);

    addBox(
      doorGroup,
      new THREE.Vector3(doorWidth - 0.16, 2.58, 0.035),
      new THREE.Vector3(doorWidth * 0.5, 1.3, 0),
      glassMaterial,
      null,
      false,
      false
    );

    const doorHeight = 2.7;
    const doorBeamThickness = 0.09;

    createBeam(
      new THREE.Vector3(0, 0.05, 0),
      new THREE.Vector3(doorWidth, 0.05, 0),
      doorBeamThickness,
      darkAluminumMaterial,
      doorGroup
    );
    createBeam(
      new THREE.Vector3(0, doorHeight, 0),
      new THREE.Vector3(doorWidth, doorHeight, 0),
      doorBeamThickness,
      darkAluminumMaterial,
      doorGroup
    );
    createBeam(
      new THREE.Vector3(0, 0.05, 0),
      new THREE.Vector3(0, doorHeight, 0),
      doorBeamThickness,
      darkAluminumMaterial,
      doorGroup
    );
    createBeam(
      new THREE.Vector3(doorWidth, 0.05, 0),
      new THREE.Vector3(doorWidth, doorHeight, 0),
      doorBeamThickness,
      darkAluminumMaterial,
      doorGroup
    );
    createBeam(
      new THREE.Vector3(0.06, 1.33, 0),
      new THREE.Vector3(doorWidth - 0.06, 1.33, 0),
      0.065,
      darkAluminumMaterial,
      doorGroup
    );
    createBeam(
      new THREE.Vector3(doorWidth * 0.5, 0.08, 0),
      new THREE.Vector3(doorWidth * 0.5, doorHeight - 0.08, 0),
      0.065,
      darkAluminumMaterial,
      doorGroup
    );

    [0.65, 2.1].forEach((hingeHeight) => {
      addCylinder(
        doorGroup,
        0.07,
        0.22,
        new THREE.Vector3(0.015, hingeHeight, -0.06),
        brassMaterial,
        12
      );
    });

    addCylinder(
      doorGroup,
      0.045,
      0.36,
      new THREE.Vector3(1.2, 1.46, -0.12),
      brassMaterial,
      12
    );

    addCylinder(
      doorGroup,
      0.075,
      0.045,
      new THREE.Vector3(1.2, 1.63, -0.12),
      brassMaterial,
      12
    );

    addCylinder(
      doorGroup,
      0.075,
      0.045,
      new THREE.Vector3(1.2, 1.29, -0.12),
      brassMaterial,
      12
    );

    createBench(-1.85);
    createBench(1.85);

    const interiorGroup = new THREE.Group();
    scene.add(interiorGroup);

    [-1.85, 1.85].forEach((benchX) => {
      [-1.28, -0.45, 0.42, 1.25].forEach((plantZ, index) => {
        createPlant(interiorGroup, benchX + (index % 2 === 0 ? -0.1 : 0.1), plantZ, index % 3 === 0 ? 0.82 : 0.68);
      });
    });

    addBox(
      interiorGroup,
      new THREE.Vector3(4.7, 0.09, 0.44),
      new THREE.Vector3(0, 2.05, 1.35),
      woodMaterial
    );

    [-2.15, 2.15].forEach((shelfX) => {
      addBox(
        interiorGroup,
        new THREE.Vector3(0.08, 1.9, 0.08),
        new THREE.Vector3(shelfX, 1.1, 1.35),
        woodDarkMaterial
      );
    });

    [-1.4, 0, 1.4].forEach((potZ, index) => {
      const shelfPot = new THREE.Mesh(
        new THREE.CylinderGeometry(0.14, 0.105, 0.2, 12),
        terracottaMaterial
      );
      shelfPot.position.set(index === 1 ? 0 : (index === 0 ? -1.3 : 1.3), 2.2, potZ * 0.18 + 1.35);
      shelfPot.castShadow = true;
      interiorGroup.add(shelfPot);
    });

    const warmLight = new THREE.PointLight(0xffc477, 4.2, 8.5, 2);
    warmLight.position.set(0, 2.25, 0.2);
    warmLight.castShadow = true;
    warmLight.shadow.mapSize.set(512, 512);
    scene.add(warmLight);

    const sun = new THREE.DirectionalLight(0xffe6c2, 3.2);
    sun.position.set(-8, 12, -7);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -13;
    sun.shadow.camera.right = 13;
    sun.shadow.camera.top = 13;
    sun.shadow.camera.bottom = -13;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 35;
    sun.shadow.bias = -0.00035;
    scene.add(sun);

    const fill = new THREE.HemisphereLight(0xc7e5ed, 0x4b5a3c, 1.65);
    scene.add(fill);

    const rimLight = new THREE.DirectionalLight(0xa9d9e4, 1.15);
    rimLight.position.set(7, 6, 9);
    scene.add(rimLight);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function handleResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.addEventListener("resize", handleResize);
    animate();
  </script>
</body>
</html>
