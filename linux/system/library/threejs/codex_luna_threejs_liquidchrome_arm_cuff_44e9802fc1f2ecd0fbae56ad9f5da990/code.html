<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liquid Chrome Arm Cuff</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #07111f; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07111f);
scene.fog = new THREE.Fog(0x07111f, 7, 15);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.6, 1.9, 5.4);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 3.2;
controls.maxDistance = 8;
controls.target.set(0, 0, 0);

scene.add(new THREE.HemisphereLight(0x9bbfff, 0x07101c, 1.7));

const key = new THREE.DirectionalLight(0xdceaff, 4.5);
key.position.set(-4, 5, 4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 4;
key.shadow.camera.bottom = -4;
scene.add(key);

const blueLight = new THREE.PointLight(0x287dff, 22, 8, 2);
blueLight.position.set(3, 1.4, 2.5);
scene.add(blueLight);

const coolLight = new THREE.PointLight(0x76c9ff, 18, 7, 2);
coolLight.position.set(-3, -1.5, 1);
scene.add(coolLight);

const chrome = new THREE.MeshPhysicalMaterial({
  color: 0xcbd5df,
  metalness: 1,
  roughness: 0.105,
  clearcoat: 1,
  clearcoatRoughness: 0.08,
  envMapIntensity: 2.5
});

class CuffCurve extends THREE.Curve {
  getPoint(t, target = new THREE.Vector3()) {
    const a0 = 0.46;
    const a1 = Math.PI * 2 - 0.46;
    const a = a0 + (a1 - a0) * t;
    const c = Math.cos(a);
    const s = Math.sin(a);
    const radial = 1.18 + 0.2 * (1 - c) + 0.055 * Math.sin(a * 7.0) + 0.035 * Math.sin(a * 13.0);
    const x = s * radial;
    const z = c * (1.33 + 0.09 * Math.sin(a * 3.0));
    const y = 0.12 * Math.sin(a * 2.0) + 0.055 * Math.sin(a * 7.0);
    return target.set(x, y, z);
  }
}

function createRibbon(curve, tubularSegments, radialSegments) {
  const frames = curve.computeFrenetFrames(tubularSegments, false);
  const positions = [];
  const uvs = [];
  const indices = [];

  for (let i = 0; i <= tubularSegments; i++) {
    const t = i / tubularSegments;
    const point = curve.getPointAt(t);
    const normal = frames.normals[i];
    const binormal = frames.binormals[i];
    const endTaper = Math.min(1, t / 0.075, (1 - t) / 0.075);
    const pulse = 1 + 0.11 * Math.sin(t * Math.PI * 18) + 0.055 * Math.sin(t * Math.PI * 39);
    const radius = (0.255 + 0.105 * Math.pow(Math.sin(t * Math.PI), 0.55)) * pulse * Math.max(0.28, endTaper);

    for (let j = 0; j <= radialSegments; j++) {
      const v = j / radialSegments;
      const ang = v * Math.PI * 2;
      const ripple = 1 + 0.045 * Math.sin(ang * 5 + t * 26) + 0.028 * Math.sin(ang * 9 - t * 17);
      const nx = Math.cos(ang) * radius * ripple;
      const by = Math.sin(ang) * radius * 1.22 * ripple;
      const vertex = point.clone()
        .addScaledVector(normal, nx)
        .addScaledVector(binormal, by);
      positions.push(vertex.x, vertex.y, vertex.z);
      uvs.push(t, v);
    }
  }

  const stride = radialSegments + 1;
  for (let i = 0; i < tubularSegments; i++) {
    for (let j = 0; j < radialSegments; j++) {
      const a = i * stride + j;
      const b = a + stride;
      indices.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const cuff = new THREE.Group();
const ribbon = new THREE.Mesh(createRibbon(new CuffCurve(), 180, 28), chrome);
ribbon.castShadow = true;
ribbon.receiveShadow = true;
cuff.add(ribbon);

function addBulge(position, scale, rotation = [0, 0, 0]) {
  const geometry = new THREE.IcosahedronGeometry(0.42, 5);
  const mesh = new THREE.Mesh(geometry, chrome);
  mesh.position.copy(position);
  mesh.scale.set(scale[0], scale[1], scale[2]);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  cuff.add(mesh);
}

addBulge(new THREE.Vector3(0.78, 0.04, -1.28), [0.29, 0.54, 0.31], [0.2, -0.4, 0.2]);
addBulge(new THREE.Vector3(-0.8, 0.09, -1.22), [0.25, 0.48, 0.28], [-0.1, 0.5, -0.15]);
addBulge(new THREE.Vector3(1.24, 0.08, -0.42), [0.25, 0.38, 0.22], [0.3, 0.15, 0.1]);
addBulge(new THREE.Vector3(-1.18, 0.02, -0.5), [0.22, 0.34, 0.2], [-0.2, -0.15, 0.2]);

cuff.rotation.set(0.08, -0.18, 0.03);
scene.add(cuff);

const envGroup = new THREE.Group();
envGroup.layers.set(1);

function panel(position, scale, color, rotation = [0, 0, 0]) {
  const material = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 0.08), material);
  mesh.position.set(position[0], position[1], position[2]);
  mesh.scale.set(scale[0], scale[1], scale[2]);
  mesh.rotation.set(rotation[0], rotation[1], rotation[2]);
  mesh.layers.set(1);
  envGroup.add(mesh);
}

panel([-3.5, 1.2, -1.2], [2.8, 4.5, 1], 0x124f9d, [0, 0.2, -0.2]);
panel([3.2, -0.8, 0.2], [2.1, 4.8, 1], 0x0b2f69, [0, -0.35, 0.18]);
panel([0.2, 3.6, -0.8], [4.5, 1.3, 1], 0x9edcff, [0.2, 0, 0]);
panel([-0.4, -3.5, 0.8], [4.2, 1.1, 1], 0x061a3b, [-0.25, 0, 0]);
panel([0.8, 0.2, 4], [3.2, 3.8, 1], 0x315d9d, [0, 0, 0]);
scene.add(envGroup);

const cubeTarget = new THREE.WebGLCubeRenderTarget(256, {
  format: THREE.RGBAFormat,
  type: THREE.HalfFloatType,
  generateMipmaps: true,
  minFilter: THREE.LinearMipmapLinearFilter
});
const cubeCamera = new THREE.CubeCamera(0.1, 30, cubeTarget);
cubeCamera.layers.set(1);
scene.add(cubeCamera);

chrome.envMap = cubeTarget.texture;
chrome.needsUpdate = true;

const clock = new THREE.Clock();
let frame = 0;

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  cuff.position.y = Math.sin(elapsed * 0.8) * 0.025;
  cuff.rotation.z = Math.sin(elapsed * 0.45) * 0.012;
  if (frame++ % 12 === 0) {
    cuff.visible = false;
    cubeCamera.position.copy(cuff.position);
    cubeCamera.update(renderer, scene);
    cuff.visible = true;
  }
  controls.update();
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
