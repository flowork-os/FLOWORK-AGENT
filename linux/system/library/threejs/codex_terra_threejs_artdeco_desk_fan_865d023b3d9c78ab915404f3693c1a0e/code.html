<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Deco Desk Fan</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0d10; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101116);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(8.8, 5.8, 11.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 7;
controls.maxDistance = 18;

const chrome = new THREE.MeshPhysicalMaterial({
  color: 0xd8e0e4, metalness: 1, roughness: 0.12,
  clearcoat: 0.75, clearcoatRoughness: 0.08
});
const nickel = new THREE.MeshPhysicalMaterial({
  color: 0xb4bcc0, metalness: 1, roughness: 0.27,
  clearcoat: 0.3, clearcoatRoughness: 0.18
});
const aluminum = new THREE.MeshPhysicalMaterial({
  color: 0xd4d9da, metalness: 0.96, roughness: 0.18,
  clearcoat: 0.48, clearcoatRoughness: 0.1
});
const gold = new THREE.MeshPhysicalMaterial({
  color: 0xd69b2d, metalness: 0.92, roughness: 0.2,
  clearcoat: 0.7, clearcoatRoughness: 0.12
});
const black = new THREE.MeshPhysicalMaterial({
  color: 0x08090b, metalness: 0.12, roughness: 0.16,
  clearcoat: 0.85, clearcoatRoughness: 0.1
});
const ivory = new THREE.MeshPhysicalMaterial({
  color: 0xf2e2bd, metalness: 0.08, roughness: 0.22,
  clearcoat: 0.35, clearcoatRoughness: 0.15
});
const darkGold = new THREE.MeshPhysicalMaterial({
  color: 0x815116, metalness: 0.88, roughness: 0.28
});

function mesh(geometry, material, position = [0, 0, 0], rotation = [0, 0, 0]) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(...position);
  object.rotation.set(...rotation);
  object.castShadow = true;
  object.receiveShadow = true;
  return object;
}

function roundedProfile(points, material, depth = 0.22) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
  shape.closePath();
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.035,
    bevelSegments: 2, curveSegments: 18
  });
  geometry.center();
  return mesh(geometry, material);
}

const fan = new THREE.Group();
scene.add(fan);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0x1b1c20, roughness: 0.45, metalness: 0.18 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const baseGroup = new THREE.Group();
fan.add(baseGroup);

const baseLevels = [
  { w: 5.25, d: 3.15, h: 0.34, y: 0.17 },
  { w: 4.55, d: 2.7, h: 0.30, y: 0.47 },
  { w: 3.78, d: 2.28, h: 0.29, y: 0.765 }
];
for (const level of baseLevels) {
  const base = mesh(new THREE.BoxGeometry(level.w, level.h, level.d), black, [0, level.y, 0]);
  base.geometry.computeVertexNormals();
  baseGroup.add(base);
  const trim = mesh(new THREE.BoxGeometry(level.w + 0.07, 0.055, level.d + 0.07), darkGold, [0, level.y + level.h / 2 + 0.012, 0]);
  baseGroup.add(trim);
}

const frontChevronY = 0.93;
for (let side = -1; side <= 1; side += 2) {
  const strip = mesh(new THREE.BoxGeometry(1.15, 0.06, 0.18), ivory, [side * 0.84, frontChevronY, 1.18], [0, side * 0.52, 0]);
  baseGroup.add(strip);
}
const centerChevron = mesh(new THREE.BoxGeometry(0.92, 0.06, 0.18), ivory, [0, frontChevronY, 1.18], [0, 0, 0]);
baseGroup.add(centerChevron);

for (const x of [-1.82, 1.82]) {
  const foot = mesh(new THREE.CylinderGeometry(0.28, 0.33, 0.16, 32), darkGold, [x, 0.08, 0.9]);
  baseGroup.add(foot);
}

const neck = new THREE.Group();
neck.position.set(0, 1.04, -0.32);
fan.add(neck);

const neckColumn = mesh(new THREE.CylinderGeometry(0.37, 0.48, 2.1, 48), nickel, [0, 1.03, 0], [0, 0, 0]);
neck.add(neckColumn);

const neckGold1 = mesh(new THREE.TorusGeometry(0.39, 0.055, 12, 48), gold, [0, 0.35, 0], [Math.PI / 2, 0, 0]);
const neckGold2 = mesh(new THREE.TorusGeometry(0.34, 0.045, 12, 48), gold, [0, 1.71, 0], [Math.PI / 2, 0, 0]);
neck.add(neckGold1, neckGold2);

const motor = new THREE.Group();
motor.position.set(0, 3.08, -0.18);
fan.add(motor);

const motorBody = mesh(new THREE.CylinderGeometry(1.03, 0.84, 1.52, 64), nickel, [0, 0, 0], [Math.PI / 2, 0, 0]);
motor.add(motorBody);

for (let i = 0; i < 18; i++) {
  const angle = i / 18 * Math.PI * 2;
  const flute = mesh(new THREE.CylinderGeometry(0.037, 0.037, 1.58, 10), chrome, [
    Math.cos(angle) * 0.94, Math.sin(angle) * 0.94, 0
  ], [Math.PI / 2, 0, 0]);
  motor.add(flute);
}

for (const z of [-0.7, 0.7]) {
  const band = mesh(new THREE.TorusGeometry(1.035, 0.075, 10, 64), gold, [0, 0, z], [0, 0, 0]);
  motor.add(band);
}

const rearCap = mesh(new THREE.CylinderGeometry(0.53, 0.67, 0.25, 48), chrome, [0, 0, -0.88], [Math.PI / 2, 0, 0]);
motor.add(rearCap);

const fanAssembly = new THREE.Group();
fanAssembly.position.set(0, 3.1, 0.87);
fan.add(fanAssembly);

const hub = mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.58, 48), gold, [0, 0, 0], [Math.PI / 2, 0, 0]);
fanAssembly.add(hub);
const hubFace = mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.61, 48), chrome, [0, 0, 0], [Math.PI / 2, 0, 0]);
fanAssembly.add(hubFace);

const bladeShape = new THREE.Shape();
bladeShape.moveTo(0.18, 0.0);
bladeShape.bezierCurveTo(0.72, 0.04, 1.65, 0.11, 2.27, 0.55);
bladeShape.bezierCurveTo(2.55, 0.75, 2.43, 1.03, 2.06, 1.02);
bladeShape.bezierCurveTo(1.31, 0.98, 0.56, 0.61, 0.18, 0.26);
bladeShape.closePath();
const bladeGeometry = new THREE.ExtrudeGeometry(bladeShape, {
  depth: 0.09, bevelEnabled: true, bevelThickness: 0.025, bevelSize: 0.025, bevelSegments: 2, curveSegments: 24
});
bladeGeometry.center();

for (let i = 0; i < 4; i++) {
  const blade = mesh(bladeGeometry, aluminum, [0, 0, 0.12], [0, 0, i * Math.PI / 2 + Math.PI / 4]);
  blade.scale.set(1, 1, 1);
  fanAssembly.add(blade);
}

const cage = new THREE.Group();
cage.position.set(0, 0, 0.48);
fanAssembly.add(cage);

const outerRing = mesh(new THREE.TorusGeometry(3.08, 0.072, 12, 120), chrome, [0, 0, 0], [0, 0, 0]);
const innerRing = mesh(new THREE.TorusGeometry(2.70, 0.038, 10, 100), gold, [0, 0, -0.015], [0, 0, 0]);
cage.add(outerRing, innerRing);

const wireMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xdde8ec, metalness: 1, roughness: 0.13, clearcoat: 0.9, clearcoatRoughness: 0.08
});
for (let i = 0; i < 36; i++) {
  const a = i / 36 * Math.PI * 2;
  const radius = 3.03;
  const length = radius - 0.47;
  const wire = mesh(new THREE.CylinderGeometry(0.022, 0.022, length, 8), wireMaterial);
  wire.position.set(Math.cos(a) * (0.47 + length / 2), Math.sin(a) * (0.47 + length / 2), 0);
  wire.rotation.set(0, 0, a - Math.PI / 2);
  cage.add(wire);
}
for (const r of [1.25, 2.0, 2.55]) {
  const ring = mesh(new THREE.TorusGeometry(r, 0.026, 8, 96), chrome, [0, 0, 0.02], [0, 0, 0]);
  cage.add(ring);
}

const centerBadge = mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.12, 32), gold, [0, 0, 0.09], [Math.PI / 2, 0, 0]);
cage.add(centerBadge);

const switchGroup = new THREE.Group();
switchGroup.position.set(0, 1.08, 1.31);
fan.add(switchGroup);

const escutcheonShape = [];
for (let i = 0; i <= 20; i++) {
  const a = Math.PI + i / 20 * Math.PI;
  escutcheonShape.push([Math.cos(a) * 0.52, Math.sin(a) * 0.43]);
}
escutcheonShape.push([0.52, -0.15], [-0.52, -0.15]);
const escutcheon = roundedProfile(escutcheonShape, gold, 0.09);
escutcheon.rotation.x = Math.PI / 2;
switchGroup.add(escutcheon);

const switchBase = mesh(new THREE.CylinderGeometry(0.14, 0.16, 0.12, 24), black, [0, 0.04, 0.09], [Math.PI / 2, 0, 0]);
const lever = mesh(new THREE.BoxGeometry(0.09, 0.42, 0.07), chrome, [0.11, 0.22, 0.15], [0, 0, -0.38]);
switchGroup.add(switchBase, lever);

const logoPlate = mesh(new THREE.BoxGeometry(0.86, 0.22, 0.055), ivory, [0, 1.02, 1.335]);
fan.add(logoPlate);

const keyLight = new THREE.DirectionalLight(0xfff3d8, 4.2);
keyLight.position.set(5, 9, 7);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -8;
keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -8;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xb5d8ff, 2.4);
rimLight.position.set(-7, 5, -6);
scene.add(rimLight);

const warmLight = new THREE.PointLight(0xffc86b, 30, 18, 2);
warmLight.position.set(-3, 4.5, 5);
warmLight.castShadow = true;
scene.add(warmLight);

scene.add(new THREE.HemisphereLight(0x7999c9, 0x16110d, 1.5));

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
