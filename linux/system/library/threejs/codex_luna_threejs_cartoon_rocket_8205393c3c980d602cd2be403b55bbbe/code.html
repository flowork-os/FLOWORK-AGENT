<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartoon Rocket Ship</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #9edcf2;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9edcf2);
scene.fog = new THREE.Fog(0x9edcf2, 10, 24);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.4, 3.2, 6.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.35;
controls.minDistance = 4;
controls.maxDistance = 11;
controls.target.set(0, 0.35, 0);

const hemiLight = new THREE.HemisphereLight(0xdff7ff, 0x47738c, 2.1);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(0xffffff, 4.2);
keyLight.position.set(4, 8, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -5;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xffd5bd, 1.2);
fillLight.position.set(-5, 2, 3);
scene.add(fillLight);

const redMaterial = new THREE.MeshStandardMaterial({
  color: 0xe83d3d,
  roughness: 0.25,
  metalness: 0.05
});
const whiteMaterial = new THREE.MeshStandardMaterial({
  color: 0xfff7e8,
  roughness: 0.3,
  metalness: 0.02
});
const darkMaterial = new THREE.MeshStandardMaterial({
  color: 0x493b52,
  roughness: 0.28,
  metalness: 0.15
});
const blueGlassMaterial = new THREE.MeshStandardMaterial({
  color: 0x4fc9eb,
  roughness: 0.12,
  metalness: 0.2,
  emissive: 0x0b536b,
  emissiveIntensity: 0.18
});
const orangeMaterial = new THREE.MeshStandardMaterial({
  color: 0xff8b18,
  roughness: 0.3,
  emissive: 0x6d2100,
  emissiveIntensity: 0.25
});
const yellowMaterial = new THREE.MeshStandardMaterial({
  color: 0xffdf35,
  roughness: 0.24,
  emissive: 0x9e4500,
  emissiveIntensity: 0.35
});

const rocket = new THREE.Group();
rocket.position.y = 0.35;
scene.add(rocket);

const bodyProfile = [
  new THREE.Vector2(0.0, -1.55),
  new THREE.Vector2(0.48, -1.46),
  new THREE.Vector2(0.82, -1.2),
  new THREE.Vector2(0.99, -0.75),
  new THREE.Vector2(1.02, 0.75),
  new THREE.Vector2(0.97, 1.16),
  new THREE.Vector2(0.78, 1.48),
  new THREE.Vector2(0.42, 1.66),
  new THREE.Vector2(0.0, 1.72)
];
const bodyGeometry = new THREE.LatheGeometry(bodyProfile, 64);
bodyGeometry.computeVertexNormals();
const body = new THREE.Mesh(bodyGeometry, redMaterial);
body.castShadow = true;
body.receiveShadow = true;
rocket.add(body);

const bellyProfile = [
  new THREE.Vector2(0.0, -1.545),
  new THREE.Vector2(0.49, -1.455),
  new THREE.Vector2(0.83, -1.19),
  new THREE.Vector2(1.0, -0.74),
  new THREE.Vector2(1.025, -0.02),
  new THREE.Vector2(0.0, -0.02)
];
const bellyGeometry = new THREE.LatheGeometry(bellyProfile, 64);
bellyGeometry.computeVertexNormals();
const belly = new THREE.Mesh(bellyGeometry, whiteMaterial);
belly.castShadow = true;
belly.receiveShadow = true;
rocket.add(belly);

const noseGeometry = new THREE.ConeGeometry(0.81, 1.12, 64);
const nose = new THREE.Mesh(noseGeometry, redMaterial);
nose.position.y = 2.18;
nose.castShadow = true;
nose.receiveShadow = true;
rocket.add(nose);

const collarGeometry = new THREE.CylinderGeometry(0.84, 0.84, 0.12, 64);
const collar = new THREE.Mesh(collarGeometry, whiteMaterial);
collar.position.y = 1.68;
collar.castShadow = true;
rocket.add(collar);

const windowOuterGeometry = new THREE.CylinderGeometry(0.43, 0.43, 0.12, 48);
const windowOuter = new THREE.Mesh(windowOuterGeometry, darkMaterial);
windowOuter.rotation.x = Math.PI / 2;
windowOuter.position.set(0, 0.48, 0.985);
windowOuter.castShadow = true;
rocket.add(windowOuter);

const windowGeometry = new THREE.SphereGeometry(0.34, 40, 24);
const windowMesh = new THREE.Mesh(windowGeometry, blueGlassMaterial);
windowMesh.scale.set(1, 1, 0.28);
windowMesh.position.set(0, 0.48, 1.065);
windowMesh.castShadow = true;
rocket.add(windowMesh);

const rimGeometry = new THREE.TorusGeometry(0.43, 0.075, 16, 48);
const rim = new THREE.Mesh(rimGeometry, whiteMaterial);
rim.rotation.x = Math.PI / 2;
rim.position.set(0, 0.48, 1.075);
rim.castShadow = true;
rocket.add(rim);

const highlightGeometry = new THREE.SphereGeometry(0.075, 20, 12);
const highlight = new THREE.Mesh(highlightGeometry, new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 0.12,
  emissive: 0xffffff,
  emissiveIntensity: 0.2
}));
highlight.scale.set(1, 1.45, 0.25);
highlight.position.set(-0.13, 0.63, 1.17);
rocket.add(highlight);

const finShape = new THREE.Shape();
finShape.moveTo(0.06, -1.02);
finShape.lineTo(0.62, -1.18);
finShape.quadraticCurveTo(1.0, -1.34, 1.12, -1.7);
finShape.quadraticCurveTo(0.72, -1.63, 0.32, -1.47);
finShape.lineTo(0.04, -1.32);
finShape.closePath();

const finGeometry = new THREE.ExtrudeGeometry(finShape, {
  depth: 0.24,
  bevelEnabled: true,
  bevelSegments: 3,
  steps: 1,
  bevelSize: 0.045,
  bevelThickness: 0.045
});
finGeometry.center();

for (let finIndex = 0; finIndex < 3; finIndex += 1) {
  const fin = new THREE.Mesh(finGeometry, redMaterial);
  fin.rotation.y = finIndex * (Math.PI * 2 / 3);
  fin.castShadow = true;
  fin.receiveShadow = true;
  rocket.add(fin);
}

const nozzleGeometry = new THREE.CylinderGeometry(0.28, 0.36, 0.28, 40);
const nozzle = new THREE.Mesh(nozzleGeometry, darkMaterial);
nozzle.position.y = -1.68;
nozzle.castShadow = true;
rocket.add(nozzle);

const nozzleRingGeometry = new THREE.TorusGeometry(0.3, 0.045, 12, 36);
const nozzleRing = new THREE.Mesh(nozzleRingGeometry, orangeMaterial);
nozzleRing.rotation.x = Math.PI / 2;
nozzleRing.position.y = -1.82;
nozzleRing.castShadow = true;
rocket.add(nozzleRing);

const flameGroup = new THREE.Group();
flameGroup.position.y = -1.98;
rocket.add(flameGroup);

const flameConeGeometry = new THREE.ConeGeometry(0.27, 1.0, 32);
const flameCone = new THREE.Mesh(flameConeGeometry, orangeMaterial);
flameCone.rotation.x = Math.PI;
flameCone.position.y = -0.42;
flameCone.scale.set(1, 1, 0.9);
flameCone.castShadow = true;
flameGroup.add(flameCone);

const innerFlameGeometry = new THREE.ConeGeometry(0.15, 0.68, 28);
const innerFlame = new THREE.Mesh(innerFlameGeometry, yellowMaterial);
innerFlame.rotation.x = Math.PI;
innerFlame.position.y = -0.3;
innerFlame.castShadow = true;
flameGroup.add(innerFlame);

const puffGeometry = new THREE.SphereGeometry(0.26, 24, 16);
const puffOffsets = [
  [-0.2, -0.78, 0.04, 0.85],
  [0.2, -0.78, 0.02, 0.82],
  [0.0, -0.98, 0.02, 0.72],
  [-0.34, -0.55, 0.01, 0.62],
  [0.34, -0.56, 0.01, 0.62]
];
for (const puffData of puffOffsets) {
  const puff = new THREE.Mesh(puffGeometry, orangeMaterial);
  puff.position.set(puffData[0], puffData[1], puffData[2]);
  puff.scale.set(puffData[3], puffData[3], puffData[3]);
  puff.castShadow = true;
  flameGroup.add(puff);
}

const flameLight = new THREE.PointLight(0xff9a25, 2.2, 4.5, 2);
flameLight.position.set(0, -2.4, 0.25);
rocket.add(flameLight);

const groundGeometry = new THREE.CircleGeometry(8, 64);
const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x78b9a0,
  roughness: 0.92,
  metalness: 0
});
const ground = new THREE.Mesh(groundGeometry, groundMaterial);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -2.68;
ground.receiveShadow = true;
scene.add(ground);

const shadowDiscGeometry = new THREE.CircleGeometry(1.65, 48);
const shadowDiscMaterial = new THREE.MeshBasicMaterial({
  color: 0x3c7180,
  transparent: true,
  opacity: 0.18,
  depthWrite: false
});
const shadowDisc = new THREE.Mesh(shadowDiscGeometry, shadowDiscMaterial);
shadowDisc.rotation.x = -Math.PI / 2;
shadowDisc.position.set(0, -2.665, 0);
shadowDisc.scale.set(1.15, 0.52, 1);
scene.add(shadowDisc);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  flameGroup.scale.y = 0.94 + Math.sin(elapsed * 14) * 0.07;
  flameGroup.rotation.z = Math.sin(elapsed * 7) * 0.025;
  flameLight.intensity = 2.1 + Math.sin(elapsed * 16) * 0.35;
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
