<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victorian Greenhouse Conservatory</title>
<style>
html,body{margin:0;overflow:hidden;background:#101813}
canvas{display:block}
#label{position:fixed;left:24px;top:20px;color:#dbe8cf;font:600 14px Georgia,serif;letter-spacing:2px;text-shadow:0 2px 8px #0008;pointer-events:none}
</style>
<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">VICTORIAN CONSERVATORY</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x94ad9d);
scene.fog=new THREE.Fog(0x94ad9d,24,55);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);
camera.position.set(15,10.5,17);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.055;
controls.autoRotate=true;
controls.autoRotateSpeed=.35;
controls.target.set(0,4,0);
controls.minDistance=10;
controls.maxDistance=31;
controls.maxPolarAngle=Math.PI*.48;

const rand=(()=>{let s=73421;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}})();
const clock=new THREE.Clock();
const animated=[];
const dust=[];
const leaves=[];

function mat(color,rough=.7,metal=0,opacity=1,transparent=false){
  return new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal,opacity,transparent,side:THREE.DoubleSide});
}
function box(w,h,d,m){
  const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  o.castShadow=true;o.receiveShadow=true;return o;
}
function cyl(r1,r2,h,m,seg=12){
  const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),m);
  o.castShadow=true;o.receiveShadow=true;return o;
}
function sphere(r,m,ws=12,hs=8){
  const o=new THREE.Mesh(new THREE.SphereGeometry(r,ws,hs),m);
  o.castShadow=true;o.receiveShadow=true;return o;
}
function tube(points,r,m){
  const curve=new THREE.CatmullRomCurve3(points);
  const o=new THREE.Mesh(new THREE.TubeGeometry(curve,24,r,8,false),m);
  o.castShadow=true;return o;
}
function leaf(m,scale=.45){
  const g=new THREE.Group();
  const s=new THREE.Mesh(new THREE.SphereGeometry(1,12,6),m);
  s.scale.set(scale,scale*.18,scale*.58);
  s.rotation.z=(rand()-.5)*.5;
  s.castShadow=true;
  g.add(s);
  return g;
}

const iron=mat(0x182824,.32,.72);
iron.color.multiplyScalar(.72);
const ironLight=mat(0x31453b,.34,.62);
const glass=mat(0xbadfd6,.08,.05,.23,true);
const glassRoof=mat(0xd3eee0,.06,.03,.30,true);
const brick=mat(0x8a5039,.9);
const brickDark=mat(0x65392f,.95);
const wood=mat(0x5a3724,.72);
const woodTop=mat(0x8e6040,.72);
const soil=mat(0x302117,1);
const terracotta=mat(0xa85838,.84);
const terracottaDark=mat(0x71382b,.9);
const leafMats=[
  mat(0x315d35,.82),
  mat(0x4e8047,.76),
  mat(0x6a944c,.74),
  mat(0x244d39,.88),
  mat(0x78964f,.74)
];
const brass=mat(0xb58943,.31,.7);
const water=mat(0x72cad0,.08,.15,.72,true);

const ground=box(52,.35,52,mat(0x506b54,1));
ground.position.y=-.22;
scene.add(ground);

const backWall=box(40,13,.4,mat(0x3e6048,1));
backWall.position.set(0,6,-15);
scene.add(backWall);

const sun=new THREE.DirectionalLight(0xffe9b8,4.2);
sun.position.set(-12,22,10);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-18;sun.shadow.camera.right=18;
sun.shadow.camera.top=22;sun.shadow.camera.bottom=-10;
sun.shadow.camera.near=1;sun.shadow.camera.far=55;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xd9f4dc,0x26382a,1.7));
const fill=new THREE.PointLight(0xc3e6bd,2.5,28);
fill.position.set(0,9,2);
scene.add(fill);

function frameBar(a,b,r=.075,m=iron){
  return tube([a,b],r,m);
}
function panel(w,h,d,pos,rot=new THREE.Euler()){
  const o=box(w,h,d,glass);o.position.copy(pos);o.rotation.copy(rot);o.castShadow=false;return o;
}

function buildGreenhouse(){
  const g=new THREE.Group();
  const W=12,L=18,e=0;
  const y0=0,y1=8,roofY=11;
  const posts=[];
  for(const x of [-W/2,W/2]){
    for(const z of [-L/2,0,L/2]){
      posts.push(frameBar(new THREE.Vector3(x,y0,z),new THREE.Vector3(x,y1,z),.115));
    }
  }
  for(const z of [-L/2,0,L/2]){
    g.add(frameBar(new THREE.Vector3(-W/2,0,z),new THREE.Vector3(W/2,0,z),.11));
    g.add(frameBar(new THREE.Vector3(-W/2,8,z),new THREE.Vector3(W/2,8,z),.1));
  }
  g.add(...posts);
  for(const z of [-L/2,0,L/2]){
    const slope=roofY-y1;
    g.add(frameBar(new THREE.Vector3(-W/2,y1,z),new THREE.Vector3(0,roofY,z),.105));
    g.add(frameBar(new THREE.Vector3(W/2,y1,z),new THREE.Vector3(0,roofY,z),.105));
  }
  for(let z=-L/2+1.5;z<L/2;z+=2.25){
    g.add(frameBar(new THREE.Vector3(-W/2,8,z),new THREE.Vector3(0,roofY,z),.065));
    g.add(frameBar(new THREE.Vector3(W/2,8,z),new THREE.Vector3(0,roofY,z),.065));
  }
  for(const x of [-W/2,0,W/2]){
    g.add(frameBar(new THREE.Vector3(x,0,-L/2),new THREE.Vector3(x,8,-L/2),.08));
    g.add(frameBar(new THREE.Vector3(x,0,L/2),new THREE.Vector3(x,8,L/2),.08));
  }
  for(let x=-W/2+1.5;x<W/2;x+=2.25){
    g.add(frameBar(new THREE.Vector3(x,8,-L/2),new THREE.Vector3(x,8,L/2),.07));
  }
  for(let z=-L/2+1.5;z<L/2;z+=2.25){
    g.add(panel(11.65,7.7,.025,new THREE.Vector3(0,4,z)));
  }
  for(let x=-W/2+1.5;x<W/2;x+=2.25){
    g.add(panel(1.8,7.7,.025,new THREE.Vector3(x,4,-L/2),new THREE.Euler(0,Math.PI/2,0)));
    g.add(panel(1.8,7.7,.025,new THREE.Vector3(x,4,L/2),new THREE.Euler(0,Math.PI/2,0)));
  }
  for(let z=-L/2+1.5;z<L/2;z+=2.25){
    const a=new THREE.Vector3(-6,8,z),b=new THREE.Vector3(0,11,z),c=new THREE.Vector3(6,8,z);
    g.add(panel(2.7,8.2,.025,new THREE.Vector3(-3,9.3,z),new THREE.Euler(0,0,-Math.atan(3/3))));
    g.add(panel(2.7,8.2,.025,new THREE.Vector3(3,9.3,z),new THREE.Euler(0,0,Math.atan(3/3))));
  }
  const ridge=box(.24,.24,18,iron);ridge.position.set(0,11,0);g.add(ridge);
  const finial=sphere(.28,brass);finial.position.set(0,11.35,-9);g.add(finial);
  scene.add(g);
}
buildGreenhouse();

function brickPath(){
  const g=new THREE.Group();
  const pathMat=mat(0xb47a58,.95);
  for(let z=-8.7;z<8.8;z+=.72){
    const b=box(3.5,.16,.62,pathMat);
    b.position.set(0,.08,z);
    b.rotation.y=(rand()-.5)*.025;
    g.add(b);
  }
  scene.add(g);
}
brickPath();

function pot(x,y,z,r=.42,h=.65,color=terracotta){
  const g=new THREE.Group();
  const p=cyl(r*.9,r,h,color,14);p.position.y=h/2;g.add(p);
  const rim=cyl(r*1.04,r*1.08,.12,color,14);rim.position.y=h-.05;g.add(rim);
  const dirt=cyl(r*.86,r*.86,.035,soil,14);dirt.position.y=h+.008;g.add(dirt);
  g.position.set(x,y,z);scene.add(g);
  return g;
}
function trunk(x,z,h=2.2,r=.13){
  const o=cyl(r*.75,r,h,wood,9);o.position.set(x,h/2+.7,z);scene.add(o);return o;
}
function palm(x,z,s=1){
  const g=new THREE.Group();
  const p=pot(0,0,0,.44*s,.62*s);
  p.position.set(0,.7*s,0);g.add(p);
  const t=cyl(.12*s,.17*s,2.5*s,wood,10);t.position.y=2.05*s;g.add(t);
  const crown=new THREE.Group();crown.position.y=3.32*s;g.add(crown);
  for(let i=0;i<10;i++){
    const a=i*Math.PI*2/10+rand()*.2;
    const l=leaf(leafMats[i%3],.48*s);
    l.position.set(Math.cos(a)*.72*s,Math.sin(i*1.4)*.08*s,Math.sin(a)*.72*s);
    l.rotation.y=-a;
    l.rotation.z=Math.PI*.38+(rand()-.5)*.2;
    crown.add(l);leaves.push({o:l,phase:rand()*6});
  }
  g.position.set(x,0,z);scene.add(g);animated.push({o:crown,phase:rand()*6,amount:.035});
}
function fern(x,z,s=1){
  const g=new THREE.Group();
  const p=pot(0,0,0,.34*s,.48*s);p.position.y=.5*s;g.add(p);
  const crown=new THREE.Group();crown.position.y=1.05*s;g.add(crown);
  for(let i=0;i<18;i++){
    const a=i*Math.PI*2/18;
    const stem=tube([new THREE.Vector3(0,0,0),new THREE.Vector3(Math.cos(a)*.5*s,.35*s,Math.sin(a)*.5*s)],.018*s,leafMats[1]);
    crown.add(stem);
    for(let j=1;j<5;j++){
      const q=leaf(leafMats[(i+j)%3],.18*s);
      q.position.set(Math.cos(a)*j*.12*s,.13*j*s,Math.sin(a)*j*.12*s);
      q.rotation.y=-a;q.rotation.z=.35;
      stem.add(q);
    }
  }
  g.position.set(x,0,z);scene.add(g);
}
function tropical(x,z,s=1){
  const g=new THREE.Group();
  const p=pot(0,0,0,.45*s,.58*s);p.position.y=.59*s;g.add(p);
  const crown=new THREE.Group();crown.position.y=1.2*s;g.add(crown);
  for(let i=0;i<8;i++){
    const a=i*Math.PI*2/8;
    const l=leaf(leafMats[(i+2)%5],.72*s);
    l.position.set(Math.cos(a)*.48*s,.28*Math.sin(i)*s,Math.sin(a)*.48*s);
    l.scale.z=1.35;l.rotation.y=-a;l.rotation.z=.65+(rand()-.5)*.3;
    crown.add(l);leaves.push({o:l,phase:rand()*6});
  }
  g.position.set(x,0,z);scene.add(g);animated.push({o:crown,phase:rand()*6,amount:.025});
}
for(const z of [-7.3,-4.9,-2.5,2.5,4.9,7.3]){
  palm(-4.65,z,.83+rand()*.16);
  palm(4.65,z,.8+rand()*.18);
}
for(const z of [-6.4,-3.9,3.9,6.4]){
  fern(-2.8,z,.82);fern(2.8,z,.78);
}
for(const z of [-7.2,-4.5,4.5,7.2]){
  tropical(-1.7,z,.72);tropical(1.7,z,.74);
}

function bench(x,z,flip=1){
  const g=new THREE.Group();
  const top=box(2.25,.18,5.6,woodTop);top.position.y=2.05;g.add(top);
  const lower=box(2.05,.15,5.3,wood);lower.position.y=1.02;g.add(lower);
  for(const zz of [-2.35,2.35])for(const xx of [-.82,.82]){
    const leg=box(.16,2.05,.16,iron);leg.position.set(xx,1.02,zz);g.add(leg);
  }
  for(let z0=-2.1;z0<2.2;z0+=1.05)for(let x0=-.65;x0<=.65;x0+=1.3){
    const s=rand();
    if(s<.5) fern(x+x0,z+z0,.38);
    else tropical(x+x0,z+z0,.34);
  }
  g.position.set(x,0,z);scene.add(g);
}
bench(-3.5,-.2);bench(3.5,.2);

function hangingBasket(x,z,phase){
  const g=new THREE.Group();
  const chain=frameBar(new THREE.Vector3(0,0,0),new THREE.Vector3(0,-1.15,0),.025,iron);g.add(chain);
  const bowl=cyl(.58,.43,.34,terracottaDark,16);bowl.position.y=-1.38;g.add(bowl);
  for(let i=0;i<8;i++){
    const a=i*Math.PI*2/8;
    const l=leaf(leafMats[i%4],.34);l.position.set(Math.cos(a)*.35,-1.2+rand()*.2,Math.sin(a)*.35);l.rotation.y=-a;l.rotation.z=.8;g.add(l);
  }
  g.position.set(x,8.65,z);scene.add(g);animated.push({o:g,phase,amount:.055});
}
hangingBasket(-3.1,-2.5,1.2);hangingBasket(3.2,3.4,3.7);hangingBasket(-2.5,5.2,5.4);

function fountain(){
  const g=new THREE.Group();
  const base=cyl(1.55,1.7,.35,mat(0x788078,.9),32);base.position.y=.18;g.add(base);
  const basin=cyl(1.3,1.18,.34,mat(0x9a9e92,.86),32);basin.position.y=.48;g.add(basin);
  const inside=cyl(1.08,1.08,.04,water,32);inside.position.y=.67;g.add(inside);
  const column=cyl(.3,.42,1.75,mat(0x878c82,.88),18);column.position.y=1.48;g.add(column);
  const bowl=cyl(.68,.48,.24,mat(0x9da092,.85),24);bowl.position.y=2.35;g.add(bowl);
  const waterTop=cyl(.43,.43,.035,water,24);waterTop.position.y=2.49;g.add(waterTop);
  for(let i=0;i<12;i++){
    const a=i*Math.PI*2/12;
    const jet=tube([new THREE.Vector3(0,2.5,0),new THREE.Vector3(Math.cos(a)*.7,1.3,Math.sin(a)*.7)],.028,water);
    g.add(jet);
  }
  g.position.set(0,0,0);scene.add(g);
  animated.push({o:waterTop,phase:0,amount:.04});
}
fountain();

function wateringCan(){
  const g=new THREE.Group();
  const body=sphere(.62,mat(0x6d8580,.35,.55),16,10);body.scale.set(1,.78,1.15);g.add(body);
  const top=cyl(.18,.22,.12,brass,12);top.position.y=.57;g.add(top);
  const handle=tube([new THREE.Vector3(-.42,.3,0),new THREE.Vector3(-.6,1.15,0),new THREE.Vector3(.42,1.15,0),new THREE.Vector3(.5,.3,0)],.07,ironLight);g.add(handle);
  const spout=tube([new THREE.Vector3(.48,.25,0),new THREE.Vector3(1.05,.5,0),new THREE.Vector3(1.48,.85,0)],.13,mat(0x607872,.4,.45));g.add(spout);
  const rose=cyl(.22,.27,.13,brass,16);rose.rotation.z=Math.PI/2;rose.position.set(1.54,.87,0);g.add(rose);
  g.position.set(4.35,.3,7.65);g.rotation.y=-.35;scene.add(g);
}
wateringCan();

function toolRack(){
  const g=new THREE.Group();
  const rack=box(1.25,.12,.2,wood);rack.position.y=1.1;g.add(rack);
  for(let i=0;i<4;i++){
    const shaft=cyl(.035,.035,1.65,woodTop,8);shaft.position.set(-.45+i*.3,.62,0);g.add(shaft);
    const head=box(.16,.18,.08,ironLight);head.position.set(-.45+i*.3,1.47,0);head.rotation.z=(i%2?-.3:.25);g.add(head);
  }
  g.position.set(-4.8,.2,6.6);g.rotation.y=.2;scene.add(g);
}
toolRack();

function crate(x,z){
  const g=new THREE.Group();
  const body=box(1.2,.8,1.1,wood);body.position.y=.4;g.add(body);
  for(const y of [.15,.65]){const slat=box(1.28,.08,1.16,woodTop);slat.position.y=y;g.add(slat)}
  for(const xx of [-.48,.48])for(const zz of [-.43,.43]){
    const c=box(.08,.88,.08,woodTop);c.position.set(xx,.42,zz);g.add(c);
  }
  g.position.set(x,0,z);scene.add(g);
}
crate(-4.7,-7.2);crate(4.65,-6.8);

function stone(x,z,s){
  const o=sphere(s,mat(0x657066,.95),8,5);o.scale.y=.5;o.position.set(x,s*.5,z);scene.add(o);
}
for(let i=0;i<22;i++){
  const a=rand()*Math.PI*2,r=10+rand()*3;
  stone(Math.cos(a)*r,Math.sin(a)*r,.15+rand()*.24);
}

const dustGeo=new THREE.BufferGeometry();
const dustPos=[];
for(let i=0;i<170;i++)dustPos.push((rand()-.5)*10,2+rand()*8,(rand()-.5)*14);
dustGeo.setAttribute('position',new THREE.Float32BufferAttribute(dustPos,3));
const dustMat=new THREE.PointsMaterial({color:0xfff1c3,size:.045,transparent:true,opacity:.55,depthWrite:false});
const dustCloud=new THREE.Points(dustGeo,dustMat);scene.add(dustCloud);

function updateDust(t){
  const p=dustGeo.attributes.position.array;
  for(let i=0;i<p.length;i+=3){
    p[i]+=Math.sin(t*.35+i)*.0008;
    p[i+1]+=.002+Math.sin(t+i)*.0004;
    p[i+2]+=Math.cos(t*.25+i)*.0005;
    if(p[i+1]>10)p[i+1]=2;
  }
  dustGeo.attributes.position.needsUpdate=true;
}
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  for(const a of animated){
    a.o.rotation.z=Math.sin(t*.75+a.phase)*a.amount;
    a.o.rotation.x=Math.cos(t*.6+a.phase)*a.amount*.65;
  }
  for(const l of leaves){
    l.o.rotation.x+=Math.sin(t*1.1+l.phase)*.0008;
    l.o.rotation.z+=Math.cos(t*.9+l.phase)*.0005;
  }
  updateDust(t);
  controls.update();
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
animate();
</script>
</body>
</html>
