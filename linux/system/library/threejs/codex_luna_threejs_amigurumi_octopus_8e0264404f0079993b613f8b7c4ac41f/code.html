<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amigurumi Octopus</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #10152b; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10152b);
scene.fog = new THREE.Fog(0x10152b, 8, 15);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 3.05, 7.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.15;
controls.minDistance = 4.6;
controls.maxDistance = 11;
controls.target.set(0, 1.15, 0);

scene.add(new THREE.HemisphereLight(0xb8d8ff, 0x211536, 2.1));

const key = new THREE.DirectionalLight(0xfff3df, 4.1);
key.position.set(-4, 7, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0002;
scene.add(key);

const rim = new THREE.PointLight(0x8f7cff, 2.2, 10);
rim.position.set(4, 3.8, -3);
scene.add(rim);

const palette = [
  0x159eaa,
  0x208fa9,
  0x3b7daa,
  0x596ba8,
  0x765a9e,
  0x8b4f96,
  0x9b478c
];

const materials = palette.map(color => new THREE.MeshStandardMaterial({
  color,
  roughness: 0.9,
  metalness: 0,
  flatShading: false
}));

const darkYarn = new THREE.MeshStandardMaterial({ color: 0x482b67, roughness: 0.92 });
const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0x11121b, roughness: 0.3 });
const whiteMaterial = new THREE.MeshStandardMaterial({ color: 0xf7f3ea, roughness: 0.45 });

const octopus = new THREE.Group();
octopus.position.y = 0.08;
scene.add(octopus);

const head = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 5), materials[1]);
head.scale.set(1.47, 1.29, 1.39);
head.position.y = 1.82;
head.castShadow = true;
head.receiveShadow = true;
octopus.add(head);

const stitchGeometry = new THREE.SphereGeometry(0.086, 8, 6);

for (let row = 0; row < 10; row++) {
  const v = -0.78 + row * 0.17;
  const ringRadius = Math.sqrt(Math.max(0, 1 - v * v));
  const count = 25;
  for (let col = 0; col < count; col++) {
    const theta = (col / count) * Math.PI * 2 + (row % 2) * 0.12;
    const n = new THREE.Vector3(
      ringRadius * Math.cos(theta),
      v,
      ringRadius * Math.sin(theta)
    );
    const stitch = new THREE.Mesh(stitchGeometry, materials[Math.min(6, Math.floor((row / 9) * 6))]);
    stitch.position.set(
      1.475 * n.x,
      1.82 + 1.295 * n.y,
      1.395 * n.z
    );
    stitch.scale.set(1.12, 0.78, 1.02);
    stitch.castShadow = true;
    stitch.receiveShadow = true;
    octopus.add(stitch);
  }
}

function makeTentacle(index) {
  const angle = index * Math.PI * 2 / 8 + Math.PI / 8;
  const curlDirection = index % 2 === 0 ? 1 : -1;
  const radial = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
  const tangent = new THREE.Vector3(-Math.sin(angle), 0, Math.cos(angle));
  const points = [];

  for (let i = 0; i < 28; i++) {
    const t = i / 27;
    const outward = 0.68 + 1.18 * t;
    const curl = curlDirection * Math.pow(Math.max(0, t - 0.38), 1.25) * 2.6;
    const wobble = Math.sin(t * Math.PI * 3 + index) * 0.045;
    const p = radial.clone().multiplyScalar(outward + wobble);
    p.add(tangent.clone().multiplyScalar(Math.sin(curl) * 0.34));
    p.y = 0.72 - 1.13 * t + 0.12 * Math.sin(t * Math.PI * 2 + index * 0.7);
    points.push(p);
  }

  const curve = new THREE.CatmullRomCurve3(points);
  curve.curveType = "centripetal";
  curve.tension = 0.55;

  const tube = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 80, 0.245, 12, false),
    materials[Math.min(6, 1 + Math.floor(index * 5 / 7))]
  );
  tube.castShadow = true;
  tube.receiveShadow = true;
  octopus.add(tube);

  for (let i = 1; i < points.length - 1; i += 2) {
    const p = curve.getPointAt(i / 27);
    const bead = new THREE.Mesh(stitchGeometry, materials[Math.min(6, Math.floor((i / 27) * 6))]);
    bead.position.copy(p);
    bead.scale.set(1.16, 0.72, 1.12);
    bead.castShadow = true;
    bead.receiveShadow = true;
    octopus.add(bead);
  }
}

for (let i = 0; i < 8; i++) makeTentacle(i);

function addEye(x) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.205, 24, 16), eyeMaterial);
  eye.position.set(x, 1.92, 1.285);
  eye.scale.set(0.92, 1.12, 0.42);
  eye.castShadow = true;
  octopus.add(eye);

  const glint = new THREE.Mesh(new THREE.SphereGeometry(0.052, 12, 8), whiteMaterial);
  glint.position.set(x - 0.065, 2.005, 1.405);
  glint.scale.set(1, 1, 0.35);
  octopus.add(glint);
}

addEye(-0.43);
addEye(0.43);

const smilePoints = [];
for (let i = 0; i < 19; i++) {
  const t = i / 18;
  const x = -0.38 + t * 0.76;
  const y = 1.48 - Math.sin(t * Math.PI) * 0.17;
  smilePoints.push(new THREE.Vector3(x, y, 1.315));
}
const smile = new THREE.Mesh(
  new THREE.TubeGeometry(new THREE.CatmullRomCurve3(smilePoints), 36, 0.045, 8, false),
  darkYarn
);
smile.castShadow = true;
octopus.add(smile);

const cheekMaterial = new THREE.MeshStandardMaterial({ color: 0xb84e88, roughness: 0.95 });
for (const x of [-0.78, 0.78]) {
  const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.12, 14, 10), cheekMaterial);
  cheek.position.set(x, 1.56, 1.22);
  cheek.scale.set(1.35, 0.72, 0.3);
  octopus.add(cheek);
}

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(7, 64),
  new THREE.MeshStandardMaterial({ color: 0x171b35, roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.55;
floor.receiveShadow = true;
scene.add(floor);

const halo = new THREE.Mesh(
  new THREE.CircleGeometry(3.1, 64),
  new THREE.MeshBasicMaterial({ color: 0x24254b, transparent: true, opacity: 0.55 })
);
halo.rotation.x = -Math.PI / 2;
halo.position.y = -0.545;
scene.add(halo);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
