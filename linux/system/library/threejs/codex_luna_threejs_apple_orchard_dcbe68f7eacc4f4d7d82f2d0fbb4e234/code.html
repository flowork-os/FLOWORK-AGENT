<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procedural Apple Orchard</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #b9d7e2;
    }
    canvas {
      display: block;
    }
    .label {
      position: fixed;
      left: 22px;
      top: 20px;
      color: rgba(255,255,255,0.9);
      font: 600 14px/1.4 system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0,0,0,0.35);
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="label">Apple Orchard · Early Summer</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb9d7e2);
    scene.fog = new THREE.Fog(0xb9d7e2, 26, 48);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(12, 8.5, 16);
    camera.lookAt(0, 3.2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.35;
    controls.target.set(0, 3.1, 0);
    controls.minDistance = 8;
    controls.maxDistance = 30;
    controls.maxPolarAngle = Math.PI * 0.47;

    const hemiLight = new THREE.HemisphereLight(0xdcefff, 0x57733c, 2.1);
    scene.add(hemiLight);

    const sun = new THREE.DirectionalLight(0xfff2d2, 3.7);
    sun.position.set(-9, 16, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -18;
    sun.shadow.camera.right = 18;
    sun.shadow.camera.top = 18;
    sun.shadow.camera.bottom = -18;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 45;
    sun.shadow.bias = -0.00035;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xb8d9ff, 0.7);
    fill.position.set(10, 7, -12);
    scene.add(fill);

    const trunkMaterial = new THREE.MeshStandardMaterial({
      color: 0x6d4329,
      roughness: 0.92,
      metalness: 0
    });

    const branchMaterial = new THREE.MeshStandardMaterial({
      color: 0x56351f,
      roughness: 0.95
    });

    const leafMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x2f6f31, roughness: 0.88 }),
      new THREE.MeshStandardMaterial({ color: 0x3f823b, roughness: 0.86 }),
      new THREE.MeshStandardMaterial({ color: 0x5b963e, roughness: 0.84 }),
      new THREE.MeshStandardMaterial({ color: 0x28602f, roughness: 0.9 })
    ];

    const appleMaterial = new THREE.MeshStandardMaterial({
      color: 0xb92f25,
      roughness: 0.5,
      metalness: 0.02
    });

    const appleHighlightMaterial = new THREE.MeshStandardMaterial({
      color: 0xd94a2d,
      roughness: 0.48
    });

    const grassMaterial = new THREE.MeshStandardMaterial({
      color: 0x648e42,
      roughness: 1
    });

    const soilMaterial = new THREE.MeshStandardMaterial({
      color: 0x765538,
      roughness: 1
    });

    function terrainHeight(x, z) {
      return 0.11 * Math.sin(x * 0.57) +
             0.08 * Math.cos(z * 0.64) +
             0.045 * Math.sin((x + z) * 1.35) +
             0.025 * Math.cos((x - z) * 2.1);
    }

    function createTerrain() {
      const size = 25;
      const segments = 48;
      const positions = [];
      const indices = [];

      for (let iz = 0; iz <= segments; iz++) {
        const z = -size / 2 + size * iz / segments;
        for (let ix = 0; ix <= segments; ix++) {
          const x = -size / 2 + size * ix / segments;
          positions.push(x, terrainHeight(x, z), z);
        }
      }

      for (let iz = 0; iz < segments; iz++) {
        for (let ix = 0; ix < segments; ix++) {
          const a = iz * (segments + 1) + ix;
          const b = a + 1;
          const c = a + segments + 1;
          const d = c + 1;
          indices.push(a, c, b, b, c, d);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      const mesh = new THREE.Mesh(geometry, grassMaterial);
      mesh.receiveShadow = true;
      scene.add(mesh);
    }

    function cylinderBetween(start, end, radius, material, radialSegments = 10) {
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();
      const geometry = new THREE.CylinderGeometry(radius * 0.78, radius, length, radialSegments);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function createSoilRing(x, z) {
      const ring = new THREE.Mesh(
        new THREE.CylinderGeometry(1.52, 1.64, 0.055, 40),
        soilMaterial
      );
      ring.position.set(x, terrainHeight(x, z) + 0.035, z);
      ring.scale.y = 1;
      ring.receiveShadow = true;
      scene.add(ring);

      const inner = new THREE.Mesh(
        new THREE.CylinderGeometry(1.08, 1.18, 0.075, 40),
        new THREE.MeshStandardMaterial({ color: 0x80603d, roughness: 1 })
      );
      inner.position.set(x, terrainHeight(x, z) + 0.07, z);
      inner.receiveShadow = true;
      scene.add(inner);
    }

    function createTree(x, z, variant) {
      const group = new THREE.Group();
      group.position.set(x, terrainHeight(x, z), z);
      scene.add(group);

      createSoilRing(x, z);

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.22, 0.34, 3.65, 14),
        trunkMaterial
      );
      trunk.position.y = 1.83;
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      group.add(trunk);

      const branchData = [
        [new THREE.Vector3(0, 2.15, 0), new THREE.Vector3(-1.12, 3.48, 0.18), 0.13],
        [new THREE.Vector3(0, 2.55, 0), new THREE.Vector3(1.18, 3.76, -0.1), 0.14],
        [new THREE.Vector3(0, 2.85, 0), new THREE.Vector3(-0.55, 4.2, -0.58), 0.115],
        [new THREE.Vector3(0, 3.05, 0), new THREE.Vector3(0.55, 4.28, 0.62), 0.11],
        [new THREE.Vector3(-0.68, 3.22, 0.12), new THREE.Vector3(-1.26, 4.1, 0.5), 0.075],
        [new THREE.Vector3(0.7, 3.43, -0.08), new THREE.Vector3(1.35, 4.26, -0.4), 0.075]
      ];

      for (const data of branchData) {
        group.add(cylinderBetween(data[0], data[1], data[2], branchMaterial, 9));
      }

      const canopyParts = [
        [0, 5.18, 0, 1.58, 1.32, 1.48, 0],
        [-1.03, 5.05, 0.12, 1.03, 1.02, 1.12, 1],
        [1.03, 5.2, -0.08, 1.08, 1.08, 1.14, 2],
        [-0.42, 5.82, -0.7, 1.05, 0.95, 1.02, 3],
        [0.5, 5.86, 0.55, 1.12, 1.0, 1.05, 1],
        [0, 6.35, 0.02, 0.78, 0.72, 0.8, 2]
      ];

      for (const part of canopyParts) {
        const foliage = new THREE.Mesh(
          new THREE.SphereGeometry(1, 20, 14),
          leafMaterials[(part[6] + variant) % leafMaterials.length]
        );
        foliage.position.set(part[0], part[1], part[2]);
        foliage.scale.set(part[3], part[4], part[5]);
        foliage.rotation.y = 0.3 * Math.sin(part[0] * 3 + variant);
        foliage.castShadow = true;
        foliage.receiveShadow = true;
        group.add(foliage);
      }

      const apples = [
        [-1.18, 5.28, 0.58, 0.15],
        [-0.72, 4.75, -0.94, 0.13],
        [-0.05, 4.52, 1.2, 0.14],
        [0.72, 4.9, 0.97, 0.145],
        [1.23, 5.42, -0.22, 0.13],
        [0.58, 5.75, -0.91, 0.125],
        [-0.35, 6.05, 0.84, 0.12],
        [-0.9, 5.72, 0.62, 0.13],
        [0.95, 6.1, 0.28, 0.12]
      ];

      for (let i = 0; i < apples.length; i++) {
        const apple = apples[i];
        const fruit = new THREE.Mesh(
          new THREE.SphereGeometry(apple[3], 12, 10),
          i % 3 === 0 ? appleHighlightMaterial : appleMaterial
        );
        fruit.position.set(apple[0], apple[1], apple[2]);
        fruit.scale.set(1, 0.92, 1);
        fruit.castShadow = true;
        group.add(fruit);

        const stem = new THREE.Mesh(
          new THREE.CylinderGeometry(0.018, 0.022, 0.12, 6),
          branchMaterial
        );
        stem.position.set(apple[0], apple[1] + apple[3] + 0.055, apple[2]);
        stem.rotation.z = 0.18 * Math.sin(i + variant);
        stem.castShadow = true;
        group.add(stem);
      }
    }

    function createGrassTuft(x, z, scale, rotation) {
      const tuft = new THREE.Group();
      tuft.position.set(x, terrainHeight(x, z) + 0.02, z);
      tuft.rotation.y = rotation;
      tuft.scale.setScalar(scale);

      const blades = [
        [-0.08, 0.28, -0.02, -0.16],
        [0.02, 0.34, 0.02, 0.04],
        [0.1, 0.25, 0.01, 0.2]
      ];

      for (const blade of blades) {
        const bladeMesh = new THREE.Mesh(
          new THREE.ConeGeometry(0.045, blade[1], 5),
          new THREE.MeshStandardMaterial({ color: 0x477537, roughness: 1 })
        );
        bladeMesh.position.set(blade[0], blade[1] * 0.5, blade[2]);
        bladeMesh.rotation.z = blade[3];
        bladeMesh.castShadow = true;
        tuft.add(bladeMesh);
      }

      scene.add(tuft);
    }

    createTerrain();

    createTree(-5.2, 0, 0);
    createTree(0, 0, 1);
    createTree(5.2, 0, 2);

    const tuftPositions = [
      [-9.3, -3.6, 1.2, 0.4], [-7.8, 3.6, 0.8, 1.1], [-4.0, -3.2, 0.75, 0.2],
      [-1.7, 3.5, 1.1, 2.4], [2.0, -3.7, 0.9, 1.2], [3.8, 3.2, 0.75, 0.3],
      [7.7, -3.3, 1.1, 2.2], [9.6, 2.8, 0.8, 1.4], [-10.2, 1.3, 0.75, 0.8],
      [1.4, 1.8, 0.65, 0.5], [-2.6, -1.7, 0.65, 1.7], [7.6, 1.1, 0.7, 2.8]
    ];

    for (const tuft of tuftPositions) {
      createGrassTuft(tuft[0], tuft[1], tuft[2], tuft[3]);
    }

    const distantHillMaterial = new THREE.MeshStandardMaterial({
      color: 0x71935b,
      roughness: 1
    });

    const hillGeometry = new THREE.SphereGeometry(11, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.5);
    const hill = new THREE.Mesh(hillGeometry, distantHillMaterial);
    hill.scale.set(2.2, 0.42, 0.65);
    hill.position.set(0, -0.25, -14);
    hill.receiveShadow = true;
    scene.add(hill);

    const farHillGeometry = new THREE.SphereGeometry(10, 32, 16, 0, Math.PI * 2, 0, Math.PI * 0.5);
    const farHill = new THREE.Mesh(farHillGeometry, new THREE.MeshStandardMaterial({
      color: 0x86a86e,
      roughness: 1
    }));
    farHill.scale.set(2.8, 0.48, 0.65);
    farHill.position.set(-10, -0.3, -18);
    scene.add(farHill);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
