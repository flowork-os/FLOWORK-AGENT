<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knitted Bobble Beanie</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ded8ca;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xded8ca);
scene.fog = new THREE.Fog(0xded8ca, 12, 24);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 50);
camera.position.set(6.7, 4.7, 8.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.18, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 6;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.53;

scene.add(new THREE.HemisphereLight(0xfff8e8, 0x6f675e, 2.4));

const keyLight = new THREE.DirectionalLight(0xfff3d5, 4.6);
keyLight.position.set(4.5, 8, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 7;
keyLight.shadow.camera.bottom = -3;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 18;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xb8d4e6, 1.7);
fillLight.position.set(-5, 4, 4);
scene.add(fillLight);

const rimLight = new THREE.PointLight(0xffc76d, 18, 12, 2);
rimLight.position.set(2.5, 5.8, -4);
scene.add(rimLight);

const mustard = new THREE.MeshStandardMaterial({
  color: 0xd39a20,
  roughness: 0.92,
  metalness: 0,
  bumpScale: 0.02
});
const mustardLight = new THREE.MeshStandardMaterial({
  color: 0xe1aa2c,
  roughness: 0.94,
  metalness: 0
});
const mustardDark = new THREE.MeshStandardMaterial({
  color: 0xb87912,
  roughness: 0.96,
  metalness: 0
});
const cream = new THREE.MeshStandardMaterial({
  color: 0xf2dfb3,
  roughness: 0.96,
  metalness: 0
});
const creamHighlight = new THREE.MeshStandardMaterial({
  color: 0xffedc7,
  roughness: 0.94,
  metalness: 0
});

const beanie = new THREE.Group();
beanie.rotation.y = -0.15;
scene.add(beanie);

function pseudoNoise(a, b) {
  const n = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return n - Math.floor(n);
}

function bodyRadius(t) {
  return Math.max(0.085, 1.49 * (1 - 0.16 * t - 0.80 * Math.pow(t, 2.75)));
}

function bodyCenter(t) {
  return {
    x: 0.13 * Math.sin(Math.PI * t) * Math.pow(t, 1.25),
    z: -0.08 * Math.sin(Math.PI * t) * t
  };
}

function makeBodyGeometry() {
  const radialSegments = 144;
  const heightSegments = 54;
  const positions = [];
  const uvs = [];
  const indices = [];

  for (let iy = 0; iy <= heightSegments; iy++) {
    const t = iy / heightSegments;
    const y = 1.08 + 2.62 * t;
    const baseRadius = bodyRadius(t);
    const center = bodyCenter(t);

    for (let ix = 0; ix <= radialSegments; ix++) {
      const u = ix / radialSegments;
      const theta = u * Math.PI * 2;
      const ribs = 0.025 * Math.cos(theta * 24);
      const stitch = 0.014 * Math.sin(theta * 24 + iy * Math.PI * 0.72);
      const irregular = (pseudoNoise(ix, iy) - 0.5) * 0.009;
      const radius = baseRadius + ribs + stitch + irregular;
      positions.push(
        center.x + Math.cos(theta) * radius,
        y,
        center.z + Math.sin(theta) * radius
      );
      uvs.push(u * 6, t * 8);
    }
  }

  for (let iy = 0; iy < heightSegments; iy++) {
    for (let ix = 0; ix < radialSegments; ix++) {
      const a = iy * (radialSegments + 1) + ix;
      const b = a + radialSegments + 1;
      indices.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const body = new THREE.Mesh(makeBodyGeometry(), mustard);
body.castShadow = true;
body.receiveShadow = true;
beanie.add(body);

function brimRadiusAt(y, y0, y1) {
  const t = (y - y0) / (y1 - y0);
  return 1.57 + 0.07 * Math.sin(Math.PI * t);
}

function makeBrimSection(y0, y1, ribs, material) {
  const radialSegments = 144;
  const heightSegments = Math.max(6, Math.round((y1 - y0) * 24));
  const positions = [];
  const indices = [];

  for (let iy = 0; iy <= heightSegments; iy++) {
    const v = iy / heightSegments;
    const y = THREE.MathUtils.lerp(y0, y1, v);

    for (let ix = 0; ix <= radialSegments; ix++) {
      const u = ix / radialSegments;
      const theta = u * Math.PI * 2;
      const rib = 0.042 * Math.pow(0.5 + 0.5 * Math.cos(theta * ribs), 1.7);
      const yarnWobble = 0.008 * Math.sin(theta * ribs * 2 + iy * 0.85);
      const radius = brimRadiusAt(y, y0, y1) + rib + yarnWobble;
      positions.push(Math.cos(theta) * radius, y, Math.sin(theta) * radius);
    }
  }

  for (let iy = 0; iy < heightSegments; iy++) {
    for (let ix = 0; ix < radialSegments; ix++) {
      const a = iy * (radialSegments + 1) + ix;
      const b = a + radialSegments + 1;
      indices.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();

  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

beanie.add(makeBrimSection(0.12, 0.48, 36, mustardDark));
beanie.add(makeBrimSection(0.46, 0.88, 36, cream));
beanie.add(makeBrimSection(0.86, 1.28, 36, mustard));

const lowerRoll = new THREE.Mesh(
  new THREE.TorusGeometry(1.56, 0.095, 10, 144),
  mustardLight
);
lowerRoll.rotation.x = Math.PI / 2;
lowerRoll.position.y = 0.16;
lowerRoll.castShadow = true;
beanie.add(lowerRoll);

const upperRoll = new THREE.Mesh(
  new THREE.TorusGeometry(1.55, 0.085, 10, 144),
  mustardLight
);
upperRoll.rotation.x = Math.PI / 2;
upperRoll.position.y = 1.22;
upperRoll.castShadow = true;
beanie.add(upperRoll);

function addLoopRows(material, rowYs, count, radius, loopScale, angleOffset = 0) {
  const loopGeometry = new THREE.TorusGeometry(0.115, 0.026, 7, 14);
  const total = rowYs.length * count;
  const loops = new THREE.InstancedMesh(loopGeometry, material, total);
  loops.castShadow = true;
  loops.receiveShadow = true;

  const dummy = new THREE.Object3D();
  const normal = new THREE.Vector3();
  const zAxis = new THREE.Vector3(0, 0, 1);
  let index = 0;

  for (let row = 0; row < rowYs.length; row++) {
    for (let i = 0; i < count; i++) {
      const theta = angleOffset + (i + (row % 2) * 0.5) / count * Math.PI * 2;
      const r = radius + 0.012 * Math.sin(i * 2.13 + row);
      normal.set(Math.cos(theta), 0, Math.sin(theta));
      dummy.position.set(
        Math.cos(theta) * r,
        rowYs[row],
        Math.sin(theta) * r
      );
      dummy.quaternion.setFromUnitVectors(zAxis, normal);
      dummy.rotateZ((row % 2 ? -1 : 1) * 0.16);
      dummy.scale.set(loopScale.x, loopScale.y, loopScale.z);
      dummy.updateMatrix();
      loops.setMatrixAt(index++, dummy.matrix);
    }
  }

  beanie.add(loops);
}

addLoopRows(mustardLight, [0.27, 0.40], 36, 1.665, new THREE.Vector3(0.76, 1.22, 1));
addLoopRows(creamHighlight, [0.55, 0.68, 0.81], 36, 1.66, new THREE.Vector3(0.77, 1.18, 1), 0.025);
addLoopRows(mustardLight, [0.96, 1.09], 36, 1.655, new THREE.Vector3(0.76, 1.22, 1));

function bodyPoint(theta, t, radialOffset = 0) {
  const radius = bodyRadius(t) + radialOffset;
  const center = bodyCenter(t);
  return new THREE.Vector3(
    center.x + Math.cos(theta) * radius,
    1.08 + 2.62 * t,
    center.z + Math.sin(theta) * radius
  );
}

const cableCount = 12;
for (let cable = 0; cable < cableCount; cable++) {
  const baseTheta = cable / cableCount * Math.PI * 2;
  for (let strand = 0; strand < 2; strand++) {
    const points = [];
    const phase = strand * Math.PI;

    for (let j = 0; j <= 42; j++) {
      const t = 0.025 + 0.88 * (j / 42);
      const wave = 0.044 * Math.sin(t * Math.PI * 8 + phase);
      const taper = 0.5 + 0.5 * Math.min(1, bodyRadius(t) / 0.75);
      points.push(bodyPoint(baseTheta + wave * taper, t, 0.055));
    }

    const curve = new THREE.CatmullRomCurve3(points);
    const geometry = new THREE.TubeGeometry(curve, 90, 0.044, 7, false);
    const mesh = new THREE.Mesh(
      geometry,
      strand === 0 ? mustardLight : mustardDark
    );
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    beanie.add(mesh);
  }
}

const bodyLoopGeometry = new THREE.TorusGeometry(0.102, 0.023, 7, 13);
const bodyRows = 8;
const betweenColumns = 12;
const bodyLoops = new THREE.InstancedMesh(
  bodyLoopGeometry,
  mustardLight,
  bodyRows * betweenColumns
);
bodyLoops.castShadow = true;

{
  const dummy = new THREE.Object3D();
  const outward = new THREE.Vector3();
  const zAxis = new THREE.Vector3(0, 0, 1);
  let index = 0;

  for (let row = 0; row < bodyRows; row++) {
    const t = 0.10 + row * 0.095;
    for (let i = 0; i < betweenColumns; i++) {
      const theta = (i + 0.5 + (row % 2) * 0.08) / betweenColumns * Math.PI * 2;
      const p = bodyPoint(theta, t, 0.045);
      outward.set(Math.cos(theta), 0, Math.sin(theta));
      dummy.position.copy(p);
      dummy.quaternion.setFromUnitVectors(zAxis, outward);
      dummy.rotateZ((row % 2 ? 1 : -1) * 0.20);
      const topTaper = THREE.MathUtils.clamp(bodyRadius(t) / 1.0, 0.62, 1);
      dummy.scale.set(0.62 * topTaper, 1.18, 1);
      dummy.updateMatrix();
      bodyLoops.setMatrixAt(index++, dummy.matrix);
    }
  }
}
beanie.add(bodyLoops);

const crownCap = new THREE.Mesh(
  new THREE.SphereGeometry(0.19, 20, 14),
  mustardDark
);
crownCap.position.set(0.12, 3.69, -0.07);
crownCap.scale.set(1, 0.65, 1);
crownCap.castShadow = true;
beanie.add(crownCap);

const pomGroup = new THREE.Group();
pomGroup.position.set(0.13, 4.03, -0.06);
beanie.add(pomGroup);

const pomCore = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.48, 3),
  mustardLight
);
pomCore.scale.set(1.04, 0.98, 1.02);
pomCore.castShadow = true;
pomCore.receiveShadow = true;
pomGroup.add(pomCore);

const tuftCount = 210;
const tuftGeometry = new THREE.ConeGeometry(0.052, 0.29, 5, 1, false);
tuftGeometry.translate(0, 0.145, 0);
const tufts = new THREE.InstancedMesh(tuftGeometry, mustardLight, tuftCount);
tufts.castShadow = true;

{
  const dummy = new THREE.Object3D();
  const up = new THREE.Vector3(0, 1, 0);
  const direction = new THREE.Vector3();

  for (let i = 0; i < tuftCount; i++) {
    const golden = Math.PI * (3 - Math.sqrt(5));
    const y = 1 - (i / (tuftCount - 1)) * 2;
    const radial = Math.sqrt(Math.max(0, 1 - y * y));
    const theta = golden * i;
    direction.set(Math.cos(theta) * radial, y, Math.sin(theta) * radial);

    const variation = pseudoNoise(i, 17);
    const surfaceRadius = 0.43 + variation * 0.085;
    dummy.position.copy(direction).multiplyScalar(surfaceRadius);
    dummy.quaternion.setFromUnitVectors(up, direction);
    dummy.rotateY(variation * Math.PI * 2);
    const lengthScale = 0.72 + variation * 0.75;
    const widthScale = 0.72 + pseudoNoise(i, 31) * 0.65;
    dummy.scale.set(widthScale, lengthScale, widthScale);
    dummy.updateMatrix();
    tufts.setMatrixAt(i, dummy.matrix);
  }
}
pomGroup.add(tufts);

const pomNubsGeometry = new THREE.SphereGeometry(0.065, 7, 5);
const pomNubs = new THREE.InstancedMesh(pomNubsGeometry, mustardLight, 95);
pomNubs.castShadow = true;

{
  const dummy = new THREE.Object3D();
  for (let i = 0; i < 95; i++) {
    const golden = Math.PI * (3 - Math.sqrt(5));
    const y = 1 - (i / 94) * 2;
    const radial = Math.sqrt(Math.max(0, 1 - y * y));
    const theta = golden * i + 0.4;
    const r = 0.52 + pseudoNoise(i, 8) * 0.055;
    dummy.position.set(
      Math.cos(theta) * radial * r,
      y * r,
      Math.sin(theta) * radial * r
    );
    const scale = 0.68 + pseudoNoise(i, 51) * 0.7;
    dummy.scale.setScalar(scale);
    dummy.rotation.set(theta, theta * 0.7, theta * 0.3);
    dummy.updateMatrix();
    pomNubs.setMatrixAt(i, dummy.matrix);
  }
}
pomGroup.add(pomNubs);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xc9c1b2,
  roughness: 0.96,
  metalness: 0
});
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(8, 96),
  floorMaterial
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

const shadowDisc = new THREE.Mesh(
  new THREE.CircleGeometry(2.1, 64),
  new THREE.MeshBasicMaterial({
    color: 0x7b6d5b,
    transparent: true,
    opacity: 0.065,
    depthWrite: false
  })
);
shadowDisc.rotation.x = -Math.PI / 2;
shadowDisc.position.y = 0.006;
scene.add(shadowDisc);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
