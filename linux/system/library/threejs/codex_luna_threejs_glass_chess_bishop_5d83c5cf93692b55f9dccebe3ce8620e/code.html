<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal Bishop</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #061117; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x061117);
scene.fog = new THREE.Fog(0x061117, 9, 17);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.2, 4.4, 8.2);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 5.3;
controls.maxDistance = 13;
controls.target.set(0, 2.45, 0);

const bishop = new THREE.Group();
bishop.rotation.y = -0.18;
scene.add(bishop);

const crystal = new THREE.MeshPhysicalMaterial({
  color: 0xb7edf0,
  metalness: 0.02,
  roughness: 0.075,
  transmission: 0.96,
  thickness: 0.52,
  ior: 1.48,
  transparent: true,
  opacity: 0.72,
  clearcoat: 0.7,
  clearcoatRoughness: 0.08,
  side: THREE.DoubleSide
});

const edgeCrystal = new THREE.MeshPhysicalMaterial({
  color: 0x79dfe6,
  metalness: 0.04,
  roughness: 0.055,
  transmission: 0.88,
  thickness: 0.2,
  ior: 1.5,
  transparent: true,
  opacity: 0.78,
  clearcoat: 1,
  clearcoatRoughness: 0.04,
  side: THREE.DoubleSide
});

const glow = new THREE.MeshBasicMaterial({
  color: 0x6cf6ef,
  transparent: true,
  opacity: 0.62,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const darkSlot = new THREE.MeshBasicMaterial({
  color: 0x06191d,
  transparent: true,
  opacity: 0.9
});

const profile = [
  new THREE.Vector2(0.00, 0.12),
  new THREE.Vector2(0.86, 0.12),
  new THREE.Vector2(1.12, 0.19),
  new THREE.Vector2(1.29, 0.34),
  new THREE.Vector2(1.27, 0.51),
  new THREE.Vector2(1.12, 0.65),
  new THREE.Vector2(0.87, 0.73),
  new THREE.Vector2(0.69, 0.83),
  new THREE.Vector2(0.63, 0.98),
  new THREE.Vector2(0.55, 1.08),
  new THREE.Vector2(0.43, 1.17),
  new THREE.Vector2(0.38, 1.35),
  new THREE.Vector2(0.35, 2.02),
  new THREE.Vector2(0.40, 2.16),
  new THREE.Vector2(0.49, 2.25),
  new THREE.Vector2(0.49, 2.39),
  new THREE.Vector2(0.39, 2.50),
  new THREE.Vector2(0.34, 2.66),
  new THREE.Vector2(0.33, 3.08),
  new THREE.Vector2(0.39, 3.19),
  new THREE.Vector2(0.54, 3.28),
  new THREE.Vector2(0.60, 3.42),
  new THREE.Vector2(0.54, 3.55),
  new THREE.Vector2(0.00, 3.55)
];

const body = new THREE.Mesh(new THREE.LatheGeometry(profile, 96), crystal);
body.castShadow = true;
body.receiveShadow = true;
bishop.add(body);

function torus(radius, tube, y, material, scale = 1) {
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(radius, tube, 20, 96), material);
  mesh.rotation.x = Math.PI / 2;
  mesh.position.y = y;
  mesh.scale.setScalar(scale);
  mesh.castShadow = true;
  bishop.add(mesh);
  return mesh;
}

torus(0.96, 0.026, 0.22, edgeCrystal);
torus(1.08, 0.018, 0.34, glow);
torus(0.67, 0.024, 0.91, edgeCrystal);
torus(0.47, 0.022, 2.27, edgeCrystal);
torus(0.46, 0.018, 2.42, glow);
torus(0.49, 0.024, 3.38, edgeCrystal);
torus(0.43, 0.017, 3.52, glow);

function extrudedPolygon(points, depth) {
  const vertices = [];
  const indices = [];
  const half = depth * 0.5;

  for (const point of points) vertices.push(point[0], point[1], half);
  for (const point of points) vertices.push(point[0], point[1], -half);

  const n = points.length;
  for (let i = 1; i < n - 1; i++) {
    indices.push(0, i + 1, i);
    indices.push(n, n + i, n + i + 1);
  }
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    indices.push(i, j, n + j);
    indices.push(i, n + j, n + i);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

const leftLobe = [
  [-0.60, 3.56],
  [-0.055, 3.56],
  [-0.095, 3.96],
  [-0.015, 4.64],
  [-0.40, 4.30]
];

const rightLobe = leftLobe.map(point => [-point[0], point[1]]);

const leftMitre = new THREE.Mesh(extrudedPolygon(leftLobe, 0.52), crystal);
const rightMitre = new THREE.Mesh(extrudedPolygon(rightLobe, 0.52), crystal);
leftMitre.castShadow = true;
rightMitre.castShadow = true;
bishop.add(leftMitre, rightMitre);

const slot = new THREE.Mesh(new THREE.BoxGeometry(0.052, 0.88, 0.56), darkSlot);
slot.position.set(0.0, 4.15, 0.015);
slot.rotation.z = -0.12;
slot.castShadow = true;
bishop.add(slot);

const slotLight = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.84, 0.575), glow);
slotLight.position.set(0.0, 4.15, 0.31);
slotLight.rotation.z = -0.12;
bishop.add(slotLight);

const cap = new THREE.Mesh(new THREE.SphereGeometry(0.225, 48, 32), edgeCrystal);
cap.position.y = 4.79;
cap.castShadow = true;
bishop.add(cap);

const capGlow = new THREE.Mesh(new THREE.SphereGeometry(0.105, 32, 20), glow);
capGlow.position.set(-0.035, 4.78, 0.12);
bishop.add(capGlow);

const innerFlare = new THREE.Mesh(
  new THREE.CylinderGeometry(0.09, 0.31, 0.52, 48, 1, true),
  new THREE.MeshBasicMaterial({
    color: 0x53e9e1,
    transparent: true,
    opacity: 0.07,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    depthWrite: false
  })
);
innerFlare.position.y = 1.72;
bishop.add(innerFlare);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x08161b,
  roughness: 0.3,
  metalness: 0.2
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(14, 96), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

const halo = new THREE.Mesh(
  new THREE.RingGeometry(1.65, 2.15, 96),
  new THREE.MeshBasicMaterial({
    color: 0x1a6269,
    transparent: true,
    opacity: 0.09,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide
  })
);
halo.rotation.x = -Math.PI / 2;
halo.position.y = 0.018;
scene.add(halo);

const hemisphere = new THREE.HemisphereLight(0xbfeef1, 0x071014, 1.65);
scene.add(hemisphere);

const key = new THREE.SpotLight(0xe8ffff, 8.5, 18, Math.PI / 7, 0.55, 1.2);
key.position.set(4.2, 8.2, 5.4);
key.target.position.set(0, 2.2, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.00025;
scene.add(key, key.target);

const rim = new THREE.PointLight(0x39d8e0, 8, 7, 2);
rim.position.set(-3.2, 4.8, -2.8);
scene.add(rim);

const fill = new THREE.PointLight(0x6b9dff, 3.2, 8, 2);
fill.position.set(3.2, 1.6, -3.5);
scene.add(fill);

const warm = new THREE.PointLight(0xffd6a3, 2.0, 6, 2);
warm.position.set(-3.8, 1.4, 3.2);
scene.add(warm);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
