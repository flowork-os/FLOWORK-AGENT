<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papercraft Hot Air Balloon</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#dce8e4}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdce8e4);
scene.fog = new THREE.Fog(0xdce8e4, 10, 22);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.2, 3.4, 8.8);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 5;
controls.maxDistance = 14;
controls.target.set(0, 1.65, 0);

const hemi = new THREE.HemisphereLight(0xf9f4e9, 0x8b9b94, 2.2);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2d4, 4.2);
key.position.set(-5, 9, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -5;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9bd4d0, 1.3);
fill.position.set(6, 3, -5);
scene.add(fill);

function grainTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(128,128);
  for (let i=0;i<img.data.length;i+=4) {
    const n = 218 + Math.floor(Math.random()*28);
    img.data[i]=n;
    img.data[i+1]=n;
    img.data[i+2]=n;
    img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3.5, 5);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const grain = grainTexture();

function paper(color, rough=0.9) {
  return new THREE.MeshStandardMaterial({
    color,
    map: grain,
    bumpMap: grain,
    bumpScale: 0.035,
    roughness: rough,
    metalness: 0
  });
}

const cream = new THREE.Color(0xf2dfb4);
const coral = new THREE.Color(0xe96f61);
const teal = new THREE.Color(0x3b9d9a);
const ivory = paper(0xf5e8c8);
const seamMat = paper(0xc49c70);
const cordMat = paper(0x7d593d);
const kraft = paper(0xa87545);
const kraftLight = paper(0xc58d50);
const kraftDark = paper(0x70472d);

const balloon = new THREE.Group();
scene.add(balloon);

const goreCount = 12;
const rows = 18;
const bottomY = 0.18;
const topY = 4.62;
const height = topY - bottomY;
const gap = 0.035;

function radiusAt(t) {
  return 1.72 * Math.pow(Math.sin(Math.PI * t), 0.62) * (0.92 + 0.08*t) + 0.045;
}
function balloonPoint(theta, t, extra=0) {
  const r = radiusAt(t) + extra;
  return new THREE.Vector3(
    Math.cos(theta) * r,
    bottomY + height*t,
    Math.sin(theta) * r
  );
}

const panelMats = [cream, coral, teal];
for (let p=0;p<goreCount;p++) {
  const a0 = p * Math.PI*2/goreCount + gap;
  const a1 = (p+1) * Math.PI*2/goreCount - gap;
  const positions = [];
  const colors = [];
  const uvs = [];
  const indices = [];
  const base = panelMats[p%3];

  for (let j=0;j<=rows;j++) {
    const t = j/rows;
    for (let i=0;i<=3;i++) {
      const f = i/3;
      const theta = THREE.MathUtils.lerp(a0,a1,f);
      const pt = balloonPoint(theta,t);
      positions.push(pt.x,pt.y,pt.z);
      const variation = 0.92 + 0.08*Math.sin(i*2.4+j*1.7+p);
      colors.push(base.r*variation, base.g*variation, base.b*variation);
      uvs.push(f,t);
    }
  }
  for (let j=0;j<rows;j++) {
    for (let i=0;i<3;i++) {
      const n = j*4+i;
      indices.push(n,n+1,n+4, n+1,n+5,n+4);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(positions,3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(colors,3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uvs,2));
  g.setIndex(indices);
  g.computeVertexNormals();

  const m = new THREE.MeshStandardMaterial({
    vertexColors:true,
    map:grain,
    bumpMap:grain,
    bumpScale:0.025,
    roughness:0.88,
    flatShading:true,
    side:THREE.DoubleSide
  });
  const mesh = new THREE.Mesh(g,m);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  balloon.add(mesh);
}

function tube(points, radius, material, radial=6) {
  const curve = new THREE.CatmullRomCurve3(points);
  const g = new THREE.TubeGeometry(curve, Math.max(8,points.length*2), radius, radial, false);
  const m = new THREE.MeshStandardMaterial({
    ...material,
    flatShading:true
  });
  const mesh = new THREE.Mesh(g,m);
  mesh.castShadow = true;
  return mesh;
}

for (let p=0;p<goreCount;p++) {
  const theta = (p+1)*Math.PI*2/goreCount;
  const pts = [];
  for (let j=0;j<=12;j++) pts.push(balloonPoint(theta,j/12,0.035));
  balloon.add(tube(pts,0.023,seamMat,5));
}

for (const t of [0.25,0.5,0.75]) {
  for (let p=0;p<goreCount;p++) {
    const a0 = p*Math.PI*2/goreCount + gap + 0.025;
    const a1 = (p+1)*Math.PI*2/goreCount - gap - 0.025;
    balloon.add(tube([balloonPoint(a0,t,0.018),balloonPoint(a1,t,0.018)],0.009,ivory,4));
  }
}

function tabGeometry(theta, t0, t1, width) {
  const a = [];
  for (const [ang,t] of [[theta,t0],[theta+width,t0],[theta+width,t1],[theta,t1]]) {
    const pt = balloonPoint(ang,t,0.065);
    a.push(pt.x,pt.y,pt.z);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.Float32BufferAttribute(a,3));
  g.setAttribute("uv",new THREE.Float32BufferAttribute([0,0,1,0,1,1,0,1],2));
  g.setIndex([0,1,2,0,2,3]);
  g.computeVertexNormals();
  return g;
}
for (const p of [1,4,7,10]) {
  const theta = p*Math.PI*2/goreCount - 0.02;
  const tab = new THREE.Mesh(tabGeometry(theta,0.31,0.55,0.115),ivory);
  tab.castShadow = true;
  balloon.add(tab);
  const crease = tube([
    balloonPoint(theta+0.058,0.32,0.075),
    balloonPoint(theta+0.058,0.54,0.075)
  ],0.008,seamMat,4);
  balloon.add(crease);
}

const capMat = paper(0xd6b078);
const topCap = new THREE.Mesh(new THREE.IcosahedronGeometry(0.105,1),capMat);
topCap.position.y = topY;
topCap.scale.set(1,0.55,1);
topCap.castShadow = true;
balloon.add(topCap);

const bottomCap = new THREE.Mesh(new THREE.IcosahedronGeometry(0.16,1),paper(0x3c7770));
bottomCap.position.y = bottomY-0.02;
bottomCap.scale.set(1,0.55,1);
bottomCap.castShadow = true;
balloon.add(bottomCap);

const basket = new THREE.Group();
scene.add(basket);

const body = new THREE.Mesh(new THREE.BoxGeometry(1.34,0.86,0.92),kraft);
body.position.set(0,-0.86,0);
body.castShadow = true;
body.receiveShadow = true;
basket.add(body);

for (let x=-0.58;x<=0.58;x+=0.29) {
  const front = new THREE.Mesh(new THREE.BoxGeometry(0.13,0.89,0.045),x%0.58===0?kraftDark:kraftLight);
  front.position.set(x,-0.86,0.485);
  front.rotation.z = (x*0.22);
  front.castShadow = true;
  basket.add(front);

  const back = front.clone();
  back.position.z = -0.485;
  basket.add(back);
}
for (let z=-0.3;z<=0.3;z+=0.3) {
  const band = new THREE.Mesh(new THREE.BoxGeometry(1.39,0.105,0.055),kraftDark);
  band.position.set(0,-0.63+z*0.25,0.49);
  band.castShadow = true;
  basket.add(band);
}
for (const z of [-0.31,0.31]) {
  for (const s of [-1,1]) {
    const side = new THREE.Mesh(new THREE.BoxGeometry(0.045,0.88,0.18),kraftLight);
    side.position.set(s*0.69,-0.86,z);
    side.castShadow = true;
    basket.add(side);
  }
}

const rim = paper(0x73472c);
for (const [x,y,z,sx,sz] of [
  [0,-0.34,0.5,1.48,0.08],[0,-0.34,-0.5,1.48,0.08],
  [0.72,-0.34,0,0.08,0.95],[-0.72,-0.34,0,0.08,0.95]
]) {
  const beam = new THREE.Mesh(new THREE.BoxGeometry(sx,0.13,sz),rim);
  beam.position.set(x,y,z);
  beam.castShadow = true;
  basket.add(beam);
}
for (let i=-5;i<=5;i++) {
  const scallop = new THREE.Mesh(new THREE.CylinderGeometry(0.115,0.115,0.055,12),kraftLight);
  scallop.rotation.x = Math.PI/2;
  scallop.position.set(i*0.13,-0.27,0.54);
  scallop.castShadow = true;
  basket.add(scallop);
}

function cord(x1,z1,x2,z2) {
  const pts = [
    new THREE.Vector3(x1,0.18,z1),
    new THREE.Vector3(x1*0.93,-0.02,z1*0.93),
    new THREE.Vector3(x2*0.98,-0.2,z2*0.98),
    new THREE.Vector3(x2,-0.34,z2)
  ];
  basket.add(tube(pts,0.027,cordMat,5));
}
cord(-0.72,-0.42,-0.55,-0.34);
cord(0.72,-0.42,0.55,-0.34);
cord(-0.72,0.42,-0.55,0.34);
cord(0.72,0.42,0.55,0.34);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(12,64),
  new THREE.MeshStandardMaterial({color:0xcbd9d4,roughness:1})
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -1.34;
ground.receiveShadow = true;
scene.add(ground);

const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(2.05,64),
  new THREE.MeshBasicMaterial({color:0x78918d,transparent:true,opacity:0.13})
);
shadow.scale.set(1,0.34,1);
shadow.rotation.x = -Math.PI/2;
shadow.position.set(0,-1.325,0);
scene.add(shadow);

window.addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
