<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chunky Sci-Fi Mecha</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080c}
canvas{display:block;width:100%;height:100%}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 46%,transparent 45%,rgba(0,0,0,.58) 100%)}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="vignette"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05080c);
scene.fog = new THREE.FogExp2(0x05080c, 0.022);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 120);
camera.position.set(16, 11, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 5.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 13;
controls.maxDistance = 34;
controls.maxPolarAngle = Math.PI * 0.49;

const matArmor = new THREE.MeshStandardMaterial({
  color: 0x59636b,
  roughness: 0.48,
  metalness: 0.7
});
const matArmorDark = new THREE.MeshStandardMaterial({
  color: 0x202830,
  roughness: 0.4,
  metalness: 0.82
});
const matArmorLight = new THREE.MeshStandardMaterial({
  color: 0x87929a,
  roughness: 0.42,
  metalness: 0.67
});
const matJoint = new THREE.MeshStandardMaterial({
  color: 0x11171d,
  roughness: 0.32,
  metalness: 0.9
});
const matBlack = new THREE.MeshStandardMaterial({
  color: 0x080b0e,
  roughness: 0.55,
  metalness: 0.72
});
const matYellow = new THREE.MeshStandardMaterial({
  color: 0xf2b71b,
  roughness: 0.4,
  metalness: 0.5
});
const matBlue = new THREE.MeshStandardMaterial({
  color: 0x32c8ff,
  emissive: 0x079ee8,
  emissiveIntensity: 5.5,
  roughness: 0.18,
  metalness: 0.2
});
const matBlueGlass = new THREE.MeshPhysicalMaterial({
  color: 0x80e7ff,
  emissive: 0x087aaa,
  emissiveIntensity: 3.6,
  transmission: 0.16,
  transparent: true,
  opacity: 0.9,
  roughness: 0.12,
  metalness: 0.15,
  clearcoat: 1
});
const matRed = new THREE.MeshStandardMaterial({
  color: 0xff503c,
  emissive: 0xaa1309,
  emissiveIntensity: 3.2,
  roughness: 0.3,
  metalness: 0.2
});

function mesh(geometry, material, position, rotation = [0, 0, 0], scale = [1, 1, 1], parent = scene) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(position[0], position[1], position[2]);
  object.rotation.set(rotation[0], rotation[1], rotation[2]);
  object.scale.set(scale[0], scale[1], scale[2]);
  object.castShadow = true;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}

function box(size, material, position, rotation, parent) {
  return mesh(
    new THREE.BoxGeometry(size[0], size[1], size[2]),
    material,
    position,
    rotation || [0, 0, 0],
    [1, 1, 1],
    parent
  );
}

function cylinder(radiusTop, radiusBottom, height, segments, material, position, rotation, parent) {
  return mesh(
    new THREE.CylinderGeometry(radiusTop, radiusBottom, height, segments),
    material,
    position,
    rotation || [0, 0, 0],
    [1, 1, 1],
    parent
  );
}

function sphere(radius, material, position, scale, parent, widthSegments = 32, heightSegments = 18) {
  return mesh(
    new THREE.SphereGeometry(radius, widthSegments, heightSegments),
    material,
    position,
    [0, 0, 0],
    scale || [1, 1, 1],
    parent
  );
}

function addBolt(parent, x, y, z, axis = 'z', material = matArmorLight, radius = 0.075) {
  const rotation = axis === 'x' ? [0, 0, Math.PI / 2] : axis === 'z' ? [Math.PI / 2, 0, 0] : [0, 0, 0];
  cylinder(radius, radius, 0.05, 12, material, [x, y, z], rotation, parent);
}

function addPanelLine(parent, size, position, rotation = [0, 0, 0]) {
  box(size, matJoint, position, rotation, parent);
}

const mech = new THREE.Group();
mech.rotation.y = -0.08;
scene.add(mech);

const pelvis = new THREE.Group();
mech.add(pelvis);
box([3.7, 1.15, 2.25], matArmorDark, [0, 4.55, 0], [0, 0, 0], pelvis);
box([2.7, 0.75, 2.55], matArmor, [0, 4.68, 0.05], [0, 0, 0], pelvis);
box([1.25, 0.62, 0.18], matYellow, [0, 4.72, 1.37], [0, 0, 0], pelvis);
box([0.82, 0.72, 0.16], matBlack, [-0.1, 4.72, 1.47], [0, 0, -0.62], pelvis);
box([0.82, 0.72, 0.16], matBlack, [0.53, 4.72, 1.47], [0, 0, -0.62], pelvis);
box([0.82, 0.72, 0.16], matBlack, [-0.72, 4.72, 1.47], [0, 0, -0.62], pelvis);
cylinder(0.68, 0.68, 0.62, 20, matJoint, [0, 5.17, 0], [0, 0, 0], pelvis);

const torso = new THREE.Group();
mech.add(torso);
box([4.65, 2.85, 2.55], matArmor, [0, 6.85, 0], [0, 0, 0], torso);
box([4.15, 0.72, 2.72], matArmorLight, [0, 8.04, -0.03], [0, 0, 0], torso);
box([3.55, 0.62, 2.72], matArmorDark, [0, 5.67, 0.02], [0, 0, 0], torso);

box([1.25, 1.7, 0.25], matArmorDark, [-1.55, 6.85, 1.39], [0, 0, 0], torso);
box([1.25, 1.7, 0.25], matArmorDark, [1.55, 6.85, 1.39], [0, 0, 0], torso);
box([0.17, 1.38, 0.1], matArmorLight, [-1.55, 6.86, 1.56], [0, 0, 0.14], torso);
box([0.17, 1.38, 0.1], matArmorLight, [1.55, 6.86, 1.56], [0, 0, -0.14], torso);
addPanelLine(torso, [3.45, 0.085, 0.11], [0, 7.87, 1.39]);
addPanelLine(torso, [0.085, 0.7, 0.11], [-1.96, 7.48, 1.39]);
addPanelLine(torso, [0.085, 0.7, 0.11], [1.96, 7.48, 1.39]);

const reactor = new THREE.Group();
reactor.position.set(0, 7.05, 1.48);
torso.add(reactor);
cylinder(0.82, 0.82, 0.22, 32, matJoint, [0, 0, 0], [Math.PI / 2, 0, 0], reactor);
mesh(new THREE.TorusGeometry(0.61, 0.14, 12, 32), matArmorLight, [0, 0, 0.16], [0, 0, 0], [1, 1, 1], reactor);
cylinder(0.45, 0.45, 0.16, 32, matBlueGlass, [0, 0, 0.22], [Math.PI / 2, 0, 0], reactor);
cylinder(0.18, 0.18, 0.19, 20, matBlue, [0, 0, 0.31], [Math.PI / 2, 0, 0], reactor);
const reactorLight = new THREE.PointLight(0x2dcaff, 15, 7, 2);
reactorLight.position.set(0, 7.05, 3.05);
mech.add(reactorLight);

for (const side of [-1, 1]) {
  box([0.58, 1.08, 0.2], matYellow, [side * 1.78, 7.95, 1.5], [0, 0, side * 0.1], torso);
  box([0.48, 0.14, 0.08], matBlack, [side * 1.78, 8.24, 1.62], [0, 0, side * 0.1], torso);
  box([0.48, 0.14, 0.08], matBlack, [side * 1.78, 7.92, 1.62], [0, 0, side * 0.1], torso);
  box([0.48, 0.14, 0.08], matBlack, [side * 1.78, 7.60, 1.62], [0, 0, side * 0.1], torso);
  addBolt(torso, side * 2.05, 6.0, 1.39);
  addBolt(torso, side * 2.05, 7.72, 1.39);
}

const backpack = new THREE.Group();
mech.add(backpack);
box([3.35, 2.55, 1.05], matArmorDark, [0, 7.0, -1.72], [0, 0, 0], backpack);
box([1.15, 1.9, 0.58], matArmor, [-1.25, 7.0, -2.47], [0.05, 0, -0.05], backpack);
box([1.15, 1.9, 0.58], matArmor, [1.25, 7.0, -2.47], [0.05, 0, 0.05], backpack);
for (const side of [-1, 1]) {
  cylinder(0.36, 0.5, 0.65, 20, matJoint, [side * 1.25, 6.2, -2.83], [Math.PI / 2, 0, 0], backpack);
  cylinder(0.22, 0.34, 0.1, 20, matBlue, [side * 1.25, 6.2, -3.18], [Math.PI / 2, 0, 0], backpack);
}

const neck = new THREE.Group();
mech.add(neck);
cylinder(0.55, 0.64, 0.54, 20, matJoint, [0, 8.61, 0], [0, 0, 0], neck);
cylinder(0.72, 0.72, 0.16, 20, matArmorLight, [0, 8.84, 0], [0, 0, 0], neck);

const head = new THREE.Group();
head.position.set(0, 9.48, 0.06);
mech.add(head);
box([2.05, 1.18, 1.65], matArmorDark, [0, 0, 0], [0, 0, 0], head);
sphere(1.05, matArmor, [0, 0.32, -0.02], [1.03, 0.82, 0.82], head, 32, 16);
box([1.88, 0.43, 0.18], matBlack, [0, 0.3, 0.89], [0, 0, 0], head);
box([1.48, 0.23, 0.12], matBlueGlass, [0, 0.31, 1.02], [0, 0, 0], head);
box([1.12, 0.34, 0.36], matArmorLight, [0, -0.47, 0.75], [0.12, 0, 0], head);
box([0.22, 0.56, 0.2], matYellow, [-0.83, -0.18, 0.87], [0, 0, 0], head);
box([0.22, 0.56, 0.2], matYellow, [0.83, -0.18, 0.87], [0, 0, 0], head);
box([0.13, 1.55, 0.13], matArmorLight, [0.65, 1.23, 0], [0, 0, -0.18], head);
cylinder(0.12, 0.18, 0.3, 12, matYellow, [0.78, 2.02, 0], [0, 0, -0.18], head);
sphere(0.13, matRed, [0.82, 2.19, 0], [1, 1, 1], head, 16, 10);
addBolt(head, -0.89, -0.48, 0.85);
addBolt(head, 0.89, -0.48, 0.85);

function createArm(side) {
  const arm = new THREE.Group();
  mech.add(arm);

  const shoulderX = side * 3.05;
  cylinder(0.72, 0.72, 0.72, 24, matJoint, [shoulderX, 7.65, 0], [0, 0, Math.PI / 2], arm);
  sphere(0.68, matJoint, [shoulderX, 7.65, 0], [1, 1, 1], arm, 24, 14);

  const pauldron = new THREE.Group();
  pauldron.position.set(side * 3.55, 7.72, 0);
  pauldron.rotation.z = side * -0.08;
  arm.add(pauldron);
  box([1.65, 1.15, 2.5], matArmor, [0, 0, 0], [0, 0, 0], pauldron);
  box([1.75, 0.27, 2.64], matArmorLight, [0, 0.52, 0], [0, 0, 0], pauldron);
  box([0.22, 0.72, 2.16], matYellow, [side * 0.84, 0.03, 0], [0, 0, 0], pauldron);
  box([0.1, 0.68, 1.65], matJoint, [-side * 0.84, 0.02, 0], [0, 0, 0], pauldron);
  addBolt(pauldron, -side * 0.84, 0.25, 1.14);
  addBolt(pauldron, -side * 0.84, -0.25, 1.14);

  const upperX = side * 3.52;
  box([1.15, 1.75, 1.35], matArmorDark, [upperX, 6.48, 0], [0, 0, side * -0.05], arm);
  box([0.86, 1.25, 1.48], matArmorLight, [upperX - side * 0.05, 6.52, 0.05], [0, 0, side * -0.05], arm);
  box([0.18, 1.05, 0.8], matYellow, [upperX + side * 0.51, 6.52, 0.35], [0, 0, side * -0.05], arm);

  cylinder(0.55, 0.55, 0.82, 20, matJoint, [side * 3.58, 5.45, 0], [0, 0, Math.PI / 2], arm);
  cylinder(0.32, 0.32, 1.04, 16, matArmorLight, [side * 3.58, 5.45, 0], [0, 0, Math.PI / 2], arm);

  box([1.18, 1.72, 1.42], matArmor, [side * 3.6, 4.42, 0.06], [0, 0, side * 0.035], arm);
  box([0.8, 1.25, 1.57], matArmorDark, [side * 3.58, 4.42, 0.08], [0, 0, side * 0.035], arm);
  box([0.16, 0.95, 0.82], matBlue, [side * 3.58, 4.48, 0.91], [0, 0, side * 0.035], arm);

  cylinder(0.38, 0.42, 0.42, 18, matJoint, [side * 3.62, 3.43, 0.06], [0, 0, 0], arm);

  const fist = new THREE.Group();
  fist.position.set(side * 3.64, 2.88, 0.11);
  arm.add(fist);
  box([1.25, 1.05, 1.38], matArmorDark, [0, 0, 0], [0, 0, side * 0.04], fist);
  box([1.1, 0.7, 1.52], matArmor, [0, -0.08, 0.03], [0, 0, side * 0.04], fist);
  for (let i = 0; i < 3; i++) {
    box([0.3, 0.34, 0.22], matJoint, [side * (-0.18 + i * 0.18), -0.38, 0.83], [0, 0, 0], fist);
  }
}

createArm(-1);
createArm(1);

function createLeg(side) {
  const leg = new THREE.Group();
  mech.add(leg);
  const x = side * 1.35;

  cylinder(0.67, 0.67, 0.82, 24, matJoint, [x, 4.35, 0], [0, 0, Math.PI / 2], leg);
  sphere(0.62, matJoint, [x, 4.33, 0], [1, 1, 1], leg, 24, 14);

  box([1.48, 1.95, 1.72], matArmorDark, [x, 3.46, 0], [0, 0, side * -0.025], leg);
  box([1.15, 1.65, 1.86], matArmor, [x, 3.48, 0.08], [0, 0, side * -0.025], leg);
  box([0.68, 1.2, 0.18], matArmorLight, [x, 3.54, 1.04], [0, 0, side * -0.025], leg);
  box([0.24, 0.88, 0.1], matYellow, [x + side * 0.25, 3.56, 1.17], [0, 0, side * -0.025], leg);

  cylinder(0.58, 0.58, 0.78, 22, matJoint, [x, 2.28, 0.02], [0, 0, Math.PI / 2], leg);
  cylinder(0.34, 0.34, 1.18, 18, matArmorLight, [x, 2.28, 0.02], [0, 0, Math.PI / 2], leg);
  box([0.88, 0.5, 1.15], matArmor, [x, 2.27, 0.15], [0, 0, 0], leg);

  box([1.65, 1.62, 1.88], matArmor, [x, 1.42, -0.02], [0, 0, side * 0.025], leg);
  box([1.24, 1.2, 2.02], matArmorDark, [x, 1.38, 0], [0, 0, side * 0.025], leg);
  box([0.85, 0.86, 0.2], matArmorLight, [x, 1.5, 1.12], [0, 0, side * 0.025], leg);
  box([0.45, 0.17, 0.1], matBlue, [x, 1.48, 1.25], [0, 0, 0], leg);

  const foot = new THREE.Group();
  foot.position.set(x, 0.48, 0.3);
  leg.add(foot);
  box([2.05, 0.78, 3.05], matArmorDark, [0, 0, 0], [0, 0, 0], foot);
  box([1.8, 0.62, 2.65], matArmor, [0, 0.22, 0.18], [0, 0, 0], foot);
  box([1.86, 0.5, 0.72], matArmorLight, [0, 0.18, 1.55], [-0.18, 0, 0], foot);
  box([1.48, 0.14, 0.44], matYellow, [0, 0.37, 1.94], [-0.18, 0, 0], foot);
  box([0.18, 0.33, 2.25], matJoint, [side * 0.83, 0.22, 0.08], [0, 0, 0], foot);

  addBolt(leg, x - 0.43, 3.48, 1.16);
  addBolt(leg, x + 0.43, 3.48, 1.16);
  addBolt(leg, x - 0.42, 1.5, 1.25);
  addBolt(leg, x + 0.42, 1.5, 1.25);
}

createLeg(-1);
createLeg(1);

for (const side of [-1, 1]) {
  const pistonX = side * 0.73;
  cylinder(0.11, 0.11, 1.35, 12, matArmorLight, [pistonX, 5.05, -0.74], [0, 0, side * 0.18], mech);
  cylinder(0.18, 0.18, 0.72, 12, matJoint, [pistonX, 5.15, -0.74], [0, 0, side * 0.18], mech);
}

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x10161b,
  roughness: 0.78,
  metalness: 0.45
});
const platformMaterial = new THREE.MeshStandardMaterial({
  color: 0x1c252c,
  roughness: 0.58,
  metalness: 0.72
});
const ground = mesh(new THREE.CircleGeometry(28, 96), floorMaterial, [0, -0.03, 0], [-Math.PI / 2, 0, 0]);
ground.receiveShadow = true;
ground.castShadow = false;

const platform = cylinder(7.2, 7.7, 0.28, 64, platformMaterial, [0, 0.02, 0], [0, 0, 0]);
platform.receiveShadow = true;
mesh(new THREE.TorusGeometry(6.55, 0.055, 8, 96), matBlue, [0, 0.19, 0], [Math.PI / 2, 0, 0]);
mesh(new THREE.TorusGeometry(7.18, 0.045, 8, 96), matYellow, [0, 0.2, 0], [Math.PI / 2, 0, 0]);

for (let i = 0; i < 24; i++) {
  const angle = i / 24 * Math.PI * 2;
  const radius = 7.38;
  const marker = box(
    [0.38, 0.035, 0.9],
    i % 2 === 0 ? matYellow : matBlack,
    [Math.sin(angle) * radius, 0.18, Math.cos(angle) * radius],
    [0, angle, 0]
  );
  marker.castShadow = false;
}

const hemi = new THREE.HemisphereLight(0x8bc9e8, 0x15100b, 2.2);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xd9efff, 5.2);
key.position.set(9, 15, 10);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -10;
key.shadow.camera.right = 10;
key.shadow.camera.top = 14;
key.shadow.camera.bottom = -5;
key.shadow.camera.near = 1;
key.shadow.camera.far = 42;
key.shadow.bias = -0.0003;
scene.add(key);

const rim = new THREE.DirectionalLight(0x238dff, 4.5);
rim.position.set(-10, 8, -12);
scene.add(rim);

const warm = new THREE.SpotLight(0xffb14a, 950, 38, Math.PI / 5, 0.65, 1.5);
warm.position.set(10, 12, -7);
warm.target.position.set(0, 5, 0);
scene.add(warm, warm.target);

const blueFill = new THREE.PointLight(0x1aa8ff, 70, 18, 2);
blueFill.position.set(-7, 4, 5);
scene.add(blueFill);

const clock = new THREE.Clock();
const initialMechY = mech.position.y;

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  mech.position.y = initialMechY + Math.sin(elapsed * 1.35) * 0.018;
  reactor.rotation.z = elapsed * 0.32;
  reactorLight.intensity = 14 + Math.sin(elapsed * 3.2) * 2.2;
  matBlue.emissiveIntensity = 5.2 + Math.sin(elapsed * 3.2) * 0.7;
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
