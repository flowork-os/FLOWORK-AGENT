<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Amigurumi Cat</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17181c; }
  #app { position: fixed; inset: 0; }
  .credit {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 system-ui, sans-serif; color: #8a8a92;
    letter-spacing: .3px; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="credit">Amigurumi cat · drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------------------
   Renderer
--------------------------------------------------------------------------- */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

const maxAniso = renderer.capabilities.getMaxAnisotropy();

/* ---------------------------------------------------------------------------
   Scene, camera, environment
--------------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17181c);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.6, 1.8, 3.6);

/* ---------------------------------------------------------------------------
   Lighting: hemisphere + key + fill + rim
--------------------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0xcfe0ff, 0x2b241d, 0.5);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e0, 2.1);
key.position.set(4.5, 6.5, 4.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 25;
key.shadow.camera.left = -3.5;
key.shadow.camera.right = 3.5;
key.shadow.camera.top = 3.5;
key.shadow.camera.bottom = -3.5;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd2ff, 0.5);
fill.position.set(-4.0, 2.5, 1.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffe6c4, 0.9);
rim.position.set(-2.5, 3.5, -4.5);
scene.add(rim);

/* ---------------------------------------------------------------------------
   Ground plane (shadow catcher only)
--------------------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------------
   Procedural knit / crochet stitch texture (color variation + bump relief)
--------------------------------------------------------------------------- */
function buildStitchCanvases() {
  const S = 1024;
  const bumpC = document.createElement('canvas'); bumpC.width = bumpC.height = S;
  const colC  = document.createElement('canvas'); colC.width = colC.height = S;
  const b = bumpC.getContext('2d');
  const c = colC.getContext('2d');

  b.fillStyle = '#808080'; b.fillRect(0, 0, S, S);
  c.fillStyle = '#d7d2c9'; c.fillRect(0, 0, S, S);

  const cols = 20, rows = 22;
  const cw = S / cols, ch = S / rows;

  const vpath = (ctx, cx, topY, botY, spread) => {
    ctx.beginPath();
    ctx.moveTo(cx - spread, topY);
    ctx.lineTo(cx, botY);
    ctx.lineTo(cx + spread, topY);
    ctx.stroke();
  };

  const drawStitch = (cx, cy) => {
    const spread = cw * 0.40;
    const topY = cy - ch * 0.40;
    const botY = cy + ch * 0.34;
    const lw = cw * 0.30;
    // bump: dark shadow then bright highlight (offset gives relief)
    b.lineCap = 'round'; b.lineJoin = 'round'; b.lineWidth = lw;
    b.strokeStyle = 'rgba(20,20,20,0.5)';   vpath(b, cx, topY + ch * 0.07, botY + ch * 0.07, spread);
    b.strokeStyle = 'rgba(245,245,245,0.9)'; vpath(b, cx, topY, botY, spread);
    // color: subtle darker gap then near-white highlight (tinted by material.color)
    c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = lw;
    c.strokeStyle = 'rgba(120,110,95,0.35)'; vpath(c, cx, topY + ch * 0.07, botY + ch * 0.07, spread);
    c.strokeStyle = 'rgba(255,255,255,0.9)'; vpath(c, cx, topY, botY, spread);
  };

  for (let j = -1; j <= rows; j++) {
    const offset = (j % 2 === 0) ? 0 : cw * 0.5;
    for (let i = -1; i <= cols; i++) {
      drawStitch(i * cw + cw * 0.5 + offset, j * ch + ch * 0.5);
    }
  }

  // fine fiber noise
  const addDots = (ctx, n, alpha) => {
    for (let k = 0; k < n; k++) {
      const x = Math.random() * S, y = Math.random() * S, r = Math.random() * 1.4 + 0.4;
      const g = Math.floor(Math.random() * 90 + 110);
      ctx.fillStyle = `rgba(${g},${g},${g},${alpha})`;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  };
  addDots(c, 6000, 0.05);
  addDots(b, 6000, 0.08);

  return { bumpC, colC };
}

const { bumpC, colC } = buildStitchCanvases();
const colorBase = new THREE.CanvasTexture(colC);
colorBase.colorSpace = THREE.SRGBColorSpace;
const bumpBase = new THREE.CanvasTexture(bumpC);

function tex(base, rx, ry) {
  const t = base.clone();
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx, ry);
  t.anisotropy = maxAniso;
  t.needsUpdate = true;
  return t;
}

function yarn(color, rx, ry, opt = {}) {
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(color),
    map: tex(colorBase, rx, ry),
    bumpMap: tex(bumpBase, rx, ry),
    bumpScale: opt.bump ?? 0.022,
    roughness: opt.rough ?? 0.96,
    metalness: 0.0,
    envMapIntensity: opt.env ?? 0.55
  });
}

/* ---------------------------------------------------------------------------
   Palette
--------------------------------------------------------------------------- */
const FUR    = 0xd98a4e; // warm ginger wool
const CREAM  = 0xf3e6cf; // belly / muzzle / paws / inner ear / tail tip
const PINK   = 0xe0959b; // nose
const DARK   = 0x2b2622; // embroidered eyes / mouth
const WHISK  = 0xf5efe6; // whiskers

/* ---------------------------------------------------------------------------
   Build the ONE centered amigurumi cat
--------------------------------------------------------------------------- */
const cat = new THREE.Group();
scene.add(cat);

function part(geo, mat, opts = {}) {
  const m = new THREE.Mesh(geo, mat);
  if (opts.pos) m.position.set(...opts.pos);
  if (opts.rot) m.rotation.set(...opts.rot);
  if (opts.scale) {
    if (Array.isArray(opts.scale)) m.scale.set(...opts.scale);
    else m.scale.setScalar(opts.scale);
  }
  m.castShadow = opts.cast !== false;
  m.receiveShadow = opts.receive !== false;
  (opts.parent || cat).add(m);
  return m;
}

// --- Body (rounded, slightly egg-shaped, sitting) ---
part(new THREE.SphereGeometry(0.62, 64, 48), yarn(FUR, 5, 5), {
  pos: [0, 0.66, 0], scale: [1.03, 1.05, 0.92]
});

// --- Cream belly patch ---
part(new THREE.SphereGeometry(0.5, 48, 32), yarn(CREAM, 4, 4), {
  pos: [0, 0.60, 0.30], scale: [0.72, 0.95, 0.55]
});

// --- Head ---
part(new THREE.SphereGeometry(0.5, 64, 48), yarn(FUR, 4, 4), {
  pos: [0, 1.40, 0.02], scale: [1.03, 0.97, 1.0]
});

// --- Ears ---
for (const s of [-1, 1]) {
  part(new THREE.ConeGeometry(0.18, 0.34, 24), yarn(FUR, 2, 3), {
    pos: [s * 0.27, 1.78, 0.0], rot: [-0.12, 0, s * -0.28]
  });
  part(new THREE.ConeGeometry(0.10, 0.22, 20), yarn(CREAM, 2, 2), {
    pos: [s * 0.27, 1.74, 0.06], rot: [-0.12, 0, s * -0.28], scale: [1, 1, 0.6]
  });
}

// --- Muzzle (cream) ---
part(new THREE.SphereGeometry(0.24, 48, 32), yarn(CREAM, 3, 3), {
  pos: [0, 1.26, 0.40], scale: [1.05, 0.8, 0.62]
});

// --- Eyes (glossy embroidered/safety-eye look) with highlights ---
const eyeMat = new THREE.MeshStandardMaterial({ color: DARK, roughness: 0.25, metalness: 0.05, envMapIntensity: 1.0 });
const hiMat  = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.0, envMapIntensity: 1.0 });
for (const s of [-1, 1]) {
  part(new THREE.SphereGeometry(0.088, 32, 24), eyeMat, {
    pos: [s * 0.185, 1.47, 0.44], scale: [1, 1.12, 0.55]
  });
  part(new THREE.SphereGeometry(0.026, 16, 12), hiMat, {
    pos: [s * 0.16, 1.50, 0.50], cast: false
  });
}

// --- Nose (little pink triangle) ---
part(new THREE.ConeGeometry(0.058, 0.05, 3), new THREE.MeshStandardMaterial({ color: PINK, roughness: 0.85, metalness: 0, envMapIntensity: 0.4 }), {
  pos: [0, 1.30, 0.53], rot: [Math.PI, Math.PI / 6, 0], scale: [1, 1, 0.5]
});

// --- Mouth (two little stitched arcs) ---
const mouthMat = new THREE.MeshStandardMaterial({ color: DARK, roughness: 0.6, metalness: 0 });
for (const s of [-1, 1]) {
  part(new THREE.TorusGeometry(0.05, 0.008, 8, 20, Math.PI), mouthMat, {
    pos: [s * 0.05, 1.20, 0.52], rot: [0, 0, Math.PI], cast: false
  });
}

// --- Whiskers ---
const whiskMat = new THREE.MeshStandardMaterial({ color: WHISK, roughness: 0.5, metalness: 0, transparent: true, opacity: 0.75 });
for (const s of [-1, 1]) {
  for (const k of [-1, 0, 1]) {
    part(new THREE.CylinderGeometry(0.005, 0.0022, 0.5, 6), whiskMat, {
      pos: [s * 0.39, 1.27 + k * 0.055, 0.44],
      rot: [0, 0, Math.PI / 2 + (s > 0 ? k * 0.14 : -k * 0.14)],
      cast: false, receive: false
    });
  }
}

// --- Front legs (stubby) + paws ---
for (const s of [-1, 1]) {
  part(new THREE.CapsuleGeometry(0.12, 0.16, 8, 16), yarn(FUR, 2, 3), {
    pos: [s * 0.22, 0.16, 0.30], rot: [Math.PI / 2.1, 0, 0]
  });
  part(new THREE.SphereGeometry(0.14, 32, 24), yarn(CREAM, 2, 2), {
    pos: [s * 0.22, 0.10, 0.50], scale: [1, 0.72, 1.1]
  });
}

// --- Back haunches + feet ---
for (const s of [-1, 1]) {
  part(new THREE.SphereGeometry(0.30, 48, 32), yarn(FUR, 3, 3), {
    pos: [s * 0.50, 0.34, -0.02], scale: [0.85, 0.92, 1.15]
  });
  part(new THREE.SphereGeometry(0.16, 32, 24), yarn(CREAM, 2, 2), {
    pos: [s * 0.48, 0.11, 0.28], scale: [1, 0.66, 1.3]
  });
}

// --- Curled tail ---
const tailCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3( 0.30, 0.20, -0.42),
  new THREE.Vector3( 0.52, 0.30, -0.42),
  new THREE.Vector3( 0.66, 0.55, -0.30),
  new THREE.Vector3( 0.66, 0.85, -0.05),
  new THREE.Vector3( 0.50, 1.02,  0.15),
  new THREE.Vector3( 0.28, 1.02,  0.26),
  new THREE.Vector3( 0.16, 0.90,  0.28)
]);
part(new THREE.TubeGeometry(tailCurve, 90, 0.082, 20, false), yarn(FUR, 3, 14));
// tail tip
part(new THREE.SphereGeometry(0.085, 24, 18), yarn(CREAM, 2, 2), {
  pos: [0.16, 0.90, 0.28]
});

/* ---------------------------------------------------------------------------
   Controls
--------------------------------------------------------------------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.enablePan = false;
controls.minDistance = 2.2;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 0.82, 0);
controls.update();

/* ---------------------------------------------------------------------------
   Resize + render loop
--------------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
