<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glowing Rune Warhammer</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #18202a 0%, #090b10 52%, #030405 100%);
    }
    canvas { display: block; }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle, transparent 38%, rgba(0,0,0,.22) 68%, rgba(0,0,0,.72) 115%);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="vignette"></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05070a);
    scene.fog = new THREE.FogExp2(0x05070a, 0.035);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(8.5, 3.2, 12.5);
    camera.lookAt(0, 0.25, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.25, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.minDistance = 8;
    controls.maxDistance = 22;
    controls.maxPolarAngle = Math.PI * 0.82;

    const hemi = new THREE.HemisphereLight(0x7389a8, 0x110b08, 1.2);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xbdd8ff, 3.4);
    key.position.set(6, 9, 8);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -7;
    key.shadow.camera.right = 7;
    key.shadow.camera.top = 8;
    key.shadow.camera.bottom = -8;
    key.shadow.bias = -0.0004;
    scene.add(key);

    const rim = new THREE.SpotLight(0x446dff, 22, 28, Math.PI / 5, 0.65, 1.5);
    rim.position.set(-8, 5, -7);
    rim.target.position.set(0, 1, 0);
    scene.add(rim, rim.target);

    const warmLight = new THREE.PointLight(0xff5a16, 18, 8, 2);
    warmLight.position.set(0.8, 2.6, 2.1);
    scene.add(warmLight);

    const blueLight = new THREE.PointLight(0x168fff, 14, 7, 2);
    blueLight.position.set(-1.4, 2.7, -1.8);
    scene.add(blueLight);

    const iron = new THREE.MeshStandardMaterial({
      color: 0x171a1d,
      metalness: 0.9,
      roughness: 0.31
    });
    const darkIron = new THREE.MeshStandardMaterial({
      color: 0x090b0d,
      metalness: 0.82,
      roughness: 0.42
    });
    const edgeIron = new THREE.MeshStandardMaterial({
      color: 0x30363a,
      metalness: 0.95,
      roughness: 0.24
    });
    const wornIron = new THREE.MeshStandardMaterial({
      color: 0x25292b,
      metalness: 0.82,
      roughness: 0.48
    });
    const leather = new THREE.MeshStandardMaterial({
      color: 0x30170e,
      roughness: 0.82,
      metalness: 0.05
    });
    const leatherEdge = new THREE.MeshStandardMaterial({
      color: 0x6b341c,
      roughness: 0.68
    });
    const runeOrange = new THREE.MeshStandardMaterial({
      color: 0xff7a20,
      emissive: 0xff3b05,
      emissiveIntensity: 7,
      metalness: 0.15,
      roughness: 0.22
    });
    const runeBlue = new THREE.MeshStandardMaterial({
      color: 0x4bc8ff,
      emissive: 0x007dff,
      emissiveIntensity: 7,
      metalness: 0.12,
      roughness: 0.18
    });
    const grooveMaterial = new THREE.MeshBasicMaterial({ color: 0x010203 });
    const orangeHalo = new THREE.MeshBasicMaterial({
      color: 0xff5316,
      transparent: true,
      opacity: 0.16,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const blueHalo = new THREE.MeshBasicMaterial({
      color: 0x168dff,
      transparent: true,
      opacity: 0.14,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const weapon = new THREE.Group();
    weapon.rotation.z = -0.08;
    weapon.position.y = -0.1;
    scene.add(weapon);

    function shadowed(mesh) {
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function roundedBox(w, h, d, radius, segments, material) {
      return shadowed(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, segments, radius), material));
    }

    function cylinderBetween(a, b, radius, material, radialSegments = 8) {
      const start = new THREE.Vector3(...a);
      const end = new THREE.Vector3(...b);
      const midpoint = start.clone().add(end).multiplyScalar(0.5);
      const length = start.distanceTo(end);
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, radialSegments, 1, false),
        material
      );
      mesh.position.copy(midpoint);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), end.clone().sub(start).normalize());
      return mesh;
    }

    function addBox(group, size, position, material, radius = 0.08) {
      const mesh = roundedBox(size[0], size[1], size[2], radius, 3, material);
      mesh.position.set(...position);
      group.add(mesh);
      return mesh;
    }

    const head = new THREE.Group();
    head.position.y = 2.82;
    weapon.add(head);

    addBox(head, [4.85, 1.78, 1.62], [0, 0, 0], iron, 0.13);
    addBox(head, [3.18, 1.98, 1.78], [0, 0, 0], darkIron, 0.11);
    addBox(head, [1.14, 2.12, 1.9], [0, 0, 0], wornIron, 0.1);

    for (const side of [-1, 1]) {
      addBox(head, [0.24, 1.93, 1.8], [side * 1.68, 0, 0], edgeIron, 0.045);
      addBox(head, [0.28, 1.68, 1.72], [side * 2.32, 0, 0], edgeIron, 0.055);

      const cap = new THREE.Mesh(
        new THREE.CylinderGeometry(0.76, 0.9, 0.42, 8, 1, false),
        wornIron
      );
      cap.rotation.z = Math.PI / 2;
      cap.position.x = side * 2.57;
      cap.scale.set(1, 1, 1.05);
      shadowed(cap);
      head.add(cap);

      const endPlate = new THREE.Mesh(
        new THREE.CylinderGeometry(0.66, 0.66, 0.06, 8),
        edgeIron
      );
      endPlate.rotation.z = Math.PI / 2;
      endPlate.position.x = side * 2.79;
      shadowed(endPlate);
      head.add(endPlate);

      for (const sy of [-0.62, 0.62]) {
        for (const sz of [-0.58, 0.58]) {
          const rivet = new THREE.Mesh(new THREE.SphereGeometry(0.085, 10, 8), edgeIron);
          rivet.position.set(side * 2.8, sy, sz);
          rivet.scale.x = 0.45;
          head.add(rivet);
        }
      }
    }

    const socket = new THREE.Mesh(new THREE.CylinderGeometry(0.58, 0.48, 1.2, 8), darkIron);
    socket.position.y = -1.1;
    shadowed(socket);
    head.add(socket);

    const socketCollar = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.12, 8, 16), edgeIron);
    socketCollar.rotation.x = Math.PI / 2;
    socketCollar.position.y = -0.75;
    shadowed(socketCollar);
    head.add(socketCollar);

    const haft = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.31, 6.1, 10), wornIron);
    haft.position.y = -1.98;
    shadowed(haft);
    weapon.add(haft);

    const haftCore = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.19, 5.8, 10), darkIron);
    haftCore.position.set(0, -1.98, 0);
    weapon.add(haftCore);

    const upperGrip = new THREE.Group();
    upperGrip.position.y = -0.35;
    weapon.add(upperGrip);

    const lowerGrip = new THREE.Group();
    lowerGrip.position.y = -2.65;
    weapon.add(lowerGrip);

    function makeGrip(group, length, radius) {
      const base = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius * 1.04, length, 10), leather);
      shadowed(base);
      group.add(base);

      const turns = Math.max(18, Math.floor(length * 12));
      const points = [];
      for (let i = 0; i <= turns * 5; i++) {
        const t = i / (turns * 5);
        const angle = t * turns * Math.PI * 2;
        points.push(new THREE.Vector3(
          Math.cos(angle) * (radius + 0.018),
          (t - 0.5) * length,
          Math.sin(angle) * (radius + 0.018)
        ));
      }
      const curve = new THREE.CatmullRomCurve3(points);
      const wrap = new THREE.Mesh(new THREE.TubeGeometry(curve, points.length, 0.026, 5, false), leatherEdge);
      shadowed(wrap);
      group.add(wrap);

      for (const y of [-length / 2, length / 2]) {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(radius + 0.02, 0.07, 7, 16), edgeIron);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = y;
        shadowed(ring);
        group.add(ring);
      }
    }

    makeGrip(upperGrip, 1.32, 0.31);
    makeGrip(lowerGrip, 1.75, 0.34);

    const pommelCollar = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.38, 0.28, 8), edgeIron);
    pommelCollar.position.y = -3.68;
    shadowed(pommelCollar);
    weapon.add(pommelCollar);

    const pommel = new THREE.Mesh(new THREE.OctahedronGeometry(0.55, 0), darkIron);
    pommel.position.y = -4.15;
    pommel.scale.y = 1.25;
    shadowed(pommel);
    weapon.add(pommel);

    const pommelTip = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.48, 8), edgeIron);
    pommelTip.position.y = -4.72;
    pommelTip.rotation.z = Math.PI;
    shadowed(pommelTip);
    weapon.add(pommelTip);

    const animatedRunes = [];

    function addRuneLine(group, a, b, z, colorType, front = true) {
      const sign = front ? 1 : -1;
      const material = colorType === 'blue' ? runeBlue : runeOrange;
      const haloMaterial = colorType === 'blue' ? blueHalo : orangeHalo;
      const zPos = sign * z;
      const p1 = [a[0], a[1], zPos];
      const p2 = [b[0], b[1], zPos];

      const groove = cylinderBetween(p1, p2, 0.075, grooveMaterial, 8);
      const glow = cylinderBetween(
        [a[0], a[1], zPos + sign * 0.014],
        [b[0], b[1], zPos + sign * 0.014],
        0.038,
        material,
        8
      );
      const halo = cylinderBetween(
        [a[0], a[1], zPos + sign * 0.026],
        [b[0], b[1], zPos + sign * 0.026],
        0.11,
        haloMaterial,
        8
      );
      group.add(groove, glow, halo);
      animatedRunes.push({ material, haloMaterial });
    }

    const runeGlyphs = [
      [[[-2.08,-0.53],[-1.78,0.52]], [[-1.78,0.52],[-1.48,-0.53]], [[-1.94,-0.04],[-1.61,-0.04]]],
      [[[-1.18,-0.54],[-1.18,0.53]], [[-1.18,0.53],[-0.78,0.22]], [[-1.18,0.05],[-0.75,-0.53]]],
      [[[-0.45,0.53],[0,-0.54]], [[0,-0.54],[0.45,0.53]], [[-0.28,0.12],[0.28,0.12]]],
      [[[0.77,-0.53],[0.77,0.53]], [[0.77,0.53],[1.21,0.12]], [[1.21,0.12],[0.77,-0.08]], [[0.77,-0.08],[1.25,-0.53]]],
      [[[1.52,0.48],[2.05,0.48]], [[1.79,0.48],[1.79,-0.54]], [[1.52,-0.2],[2.05,-0.2]]]
    ];

    runeGlyphs.forEach((glyph, index) => {
      glyph.forEach((segment, segmentIndex) => {
        const color = (index + segmentIndex) % 3 === 0 ? 'blue' : 'orange';
        addRuneLine(head, segment[0], segment[1], 0.925, color, true);
        addRuneLine(head, segment[0], segment[1], 0.925, color, false);
      });
    });

    function addHeadSeam(x, colorType) {
      addRuneLine(head, [x, -0.76], [x, 0.76], 0.935, colorType, true);
      addRuneLine(head, [x, -0.76], [x, 0.76], 0.935, colorType, false);
    }
    addHeadSeam(-1.68, 'blue');
    addHeadSeam(1.68, 'orange');

    function addHaftRune(y, side, colorType) {
      const group = new THREE.Group();
      group.position.set(side * 0.275, y, 0.02);
      group.rotation.y = side > 0 ? Math.PI / 2 : -Math.PI / 2;
      weapon.add(group);
      const material = colorType === 'blue' ? runeBlue : runeOrange;
      const haloMaterial = colorType === 'blue' ? blueHalo : orangeHalo;

      const shape = [
        [[-0.13, -0.25, 0], [0.08, -0.04, 0]],
        [[0.08, -0.04, 0], [-0.08, 0.13, 0]],
        [[-0.08, 0.13, 0], [0.13, 0.3, 0]]
      ];
      for (const segment of shape) {
        const groove = cylinderBetween(segment[0], segment[1], 0.045, grooveMaterial, 7);
        const glow = cylinderBetween(
          [segment[0][0], segment[0][1], 0.018],
          [segment[1][0], segment[1][1], 0.018],
          0.022,
          material,
          7
        );
        const halo = cylinderBetween(
          [segment[0][0], segment[0][1], 0.026],
          [segment[1][0], segment[1][1], 0.026],
          0.065,
          haloMaterial,
          7
        );
        group.add(groove, glow, halo);
      }
      animatedRunes.push({ material, haloMaterial });
    }

    addHaftRune(1.24, 1, 'orange');
    addHaftRune(0.72, -1, 'blue');
    addHaftRune(-1.35, 1, 'blue');
    addHaftRune(-3.62, -1, 'orange');

    const emberCount = 145;
    const emberPositions = new Float32Array(emberCount * 3);
    const emberSeeds = new Float32Array(emberCount);
    const emberBase = [];
    for (let i = 0; i < emberCount; i++) {
      const aroundHead = Math.random() < 0.76;
      const x = aroundHead ? (Math.random() - 0.5) * 5.8 : (Math.random() - 0.5) * 1.1;
      const y = aroundHead ? 2.0 + Math.random() * 2.2 : -3.8 + Math.random() * 6.3;
      const z = (Math.random() - 0.5) * (aroundHead ? 2.8 : 1.2);
      emberPositions[i * 3] = x;
      emberPositions[i * 3 + 1] = y;
      emberPositions[i * 3 + 2] = z;
      emberSeeds[i] = Math.random();
      emberBase.push(new THREE.Vector3(x, y, z));
    }

    const emberGeometry = new THREE.BufferGeometry();
    emberGeometry.setAttribute('position', new THREE.BufferAttribute(emberPositions, 3));
    emberGeometry.setAttribute('seed', new THREE.BufferAttribute(emberSeeds, 1));

    const emberMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        time: { value: 0 },
        pixelRatio: { value: Math.min(devicePixelRatio, 2) }
      },
      vertexShader: `
        attribute float seed;
        uniform float time;
        uniform float pixelRatio;
        varying float vSeed;
        void main() {
          vSeed = seed;
          vec3 p = position;
          p.y += mod(time * (0.16 + seed * 0.42) + seed * 5.0, 1.8);
          p.x += sin(time * (0.7 + seed) + seed * 31.0) * 0.11;
          p.z += cos(time * 0.6 + seed * 19.0) * 0.08;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_PointSize = pixelRatio * (2.0 + seed * 5.2) * (7.0 / max(2.0, -mv.z));
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        varying float vSeed;
        void main() {
          vec2 q = gl_PointCoord - 0.5;
          float d = length(q);
          float alpha = smoothstep(0.5, 0.05, d);
          vec3 orange = vec3(1.0, 0.19, 0.015);
          vec3 blue = vec3(0.02, 0.42, 1.0);
          vec3 color = mix(orange, blue, step(0.82, vSeed));
          color = mix(color, vec3(1.0, 0.82, 0.35), smoothstep(0.25, 0.0, d));
          gl_FragColor = vec4(color, alpha * (0.32 + vSeed * 0.68));
        }
      `
    });

    const embers = new THREE.Points(emberGeometry, emberMaterial);
    weapon.add(embers);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(10, 64),
      new THREE.MeshStandardMaterial({
        color: 0x080a0d,
        roughness: 0.92,
        metalness: 0.05,
        transparent: true,
        opacity: 0.92
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -5.0;
    ground.receiveShadow = true;
    scene.add(ground);

    const groundGlow = new THREE.Mesh(
      new THREE.RingGeometry(1.2, 4.8, 64),
      new THREE.MeshBasicMaterial({
        color: 0xff4010,
        transparent: true,
        opacity: 0.045,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        side: THREE.DoubleSide
      })
    );
    groundGlow.rotation.x = -Math.PI / 2;
    groundGlow.position.y = -4.98;
    scene.add(groundGlow);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();
      const pulse = 0.82 + Math.sin(time * 2.15) * 0.13 + Math.sin(time * 4.9) * 0.05;

      runeOrange.emissiveIntensity = 6.5 * pulse;
      runeBlue.emissiveIntensity = 7.2 * (0.92 + Math.sin(time * 1.85 + 1.2) * 0.12);
      orangeHalo.opacity = 0.12 + pulse * 0.055;
      blueHalo.opacity = 0.11 + Math.sin(time * 1.7 + 0.8) * 0.025;
      warmLight.intensity = 15 + pulse * 5;
      blueLight.intensity = 12 + Math.sin(time * 1.8 + 0.7) * 2.5;
      groundGlow.material.opacity = 0.035 + pulse * 0.018;
      emberMaterial.uniforms.time.value = time;

      weapon.position.y = -0.1 + Math.sin(time * 0.72) * 0.035;
      controls.update();
      renderer.render(scene, camera);
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      emberMaterial.uniforms.pixelRatio.value = Math.min(devicePixelRatio, 2);
    });

    animate();
  </script>
</body>
</html>
