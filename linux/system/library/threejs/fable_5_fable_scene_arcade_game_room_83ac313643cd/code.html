{ "imports": {

<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ===================== 1. CONFIG / PALETTE ===================== */
const ROOM = { w: 22, d: 16, h: 8 };          // interior footprint (metres-ish)
const SEED = 0x9AC4DE;
const PAL = {
  fog:        0x07041a,
  wall:       0x151034,
  ceiling:    0x0b0724,
  carpetBase: '#150c33',
  cabinetBody:0x1b1c31,
  cabinetDark:0x0d0e1c,
  panel:      0x23244a,
  chrome:     0xb9c2d6,
  glassTint:  0x9fd8ff,
  neonCyan:   0x22e6ff,
  neonMagenta:0xff2fd6,
  neonOrange: 0xff8c2a,
  neonYellow: 0xffe14d,
  carpetInks: ['#25f4ff', '#ff3fd9', '#ff9a2e', '#ffe14d', '#7dff6a'],
  plush:      ['#ff9ecb', '#8ce8ff', '#ffd88a', '#b8ffa8', '#d8b4ff', '#ff8a7a'],
  accents:    [0x22e6ff, 0xff2fd6, 0xff8c2a]
};
const GAME_NAMES = ['PIXEL RAID', 'TURBO GP', 'STAR FURY', 'MEGA PUNCH', 'GHOST MAZE',
                    'LASER LORD', 'BIT BLAST', 'NEON JET', 'ROBO RUN', 'SKY DUEL', 'CRYPT RUN'];

/* ===================== 2. SEEDED PRNG / HELPERS ===================== */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(SEED);
const rand  = (lo, hi) => lo + rng() * (hi - lo);
const pick  = (arr) => arr[Math.floor(rng() * arr.length)];
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d')];
}
function canvasTexture(canvas, repeatX = 1, repeatY = 1) {
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeatX, repeatY);
  tex.anisotropy = 4;
  return tex;
}

/* ===================== 3. PROCEDURAL TEXTURES ===================== */
// --- wild 90s arcade carpet: confetti shapes over deep purple ---
function makeCarpetTexture() {
  const [c, g] = makeCanvas(512, 512);
  g.fillStyle = PAL.carpetBase; g.fillRect(0, 0, 512, 512);
  g.globalAlpha = 0.16; g.fillStyle = '#0a0620';           // faint checker underlay
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++)
    if ((x + y) % 2) g.fillRect(x * 64, y * 64, 64, 64);
  g.globalAlpha = 1;
  for (let i = 0; i < 150; i++) {                          // confetti: squiggles, tris, dots, zigzags
    const ink = pick(PAL.carpetInks);
    const x = rng() * 512, y = rng() * 512, s = rand(9, 26);
    g.strokeStyle = ink; g.fillStyle = ink; g.lineWidth = rand(2.5, 5);
    const kind = Math.floor(rng() * 4);
    if (kind === 0) {                                      // squiggle arc
      g.beginPath(); g.arc(x, y, s, rng() * 6.28, rng() * 3 + 1); g.stroke();
    } else if (kind === 1) {                               // triangle
      g.beginPath(); g.moveTo(x, y - s); g.lineTo(x + s, y + s); g.lineTo(x - s, y + s);
      g.closePath(); rng() < 0.5 ? g.fill() : g.stroke();
    } else if (kind === 2) {                               // dot cluster
      for (let d = 0; d < 4; d++) {
        g.beginPath(); g.arc(x + rand(-s, s), y + rand(-s, s), rand(2, 4.5), 0, 6.28); g.fill();
      }
    } else {                                               // zigzag bolt
      g.beginPath(); g.moveTo(x, y);
      for (let z = 1; z <= 4; z++) g.lineTo(x + z * s * 0.5, y + (z % 2 ? -s : s) * 0.5);
      g.stroke();
    }
  }
  return canvasTexture(c, 3, 2);
}
// --- glowing marquee title strip for one cabinet ---
function makeMarqueeTexture(name, hex) {
  const [c, g] = makeCanvas(256, 64);
  const grad = g.createLinearGradient(0, 0, 0, 64);
  grad.addColorStop(0, '#08061c'); grad.addColorStop(0.5, '#1c1348'); grad.addColorStop(1, '#08061c');
  g.fillStyle = grad; g.fillRect(0, 0, 256, 64);
  g.strokeStyle = hex; g.lineWidth = 4; g.strokeRect(4, 4, 248, 56);
  g.font = 'bold 30px monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.shadowColor = hex; g.shadowBlur = 14;
  g.fillStyle = '#ffffff'; g.fillText(name, 128, 34);
  return canvasTexture(c);
}
// --- neon ARCADE wall sign ---
function makeSignTexture() {
  const [c, g] = makeCanvas(512, 128);
  g.clearRect(0, 0, 512, 128);
  g.font = 'bold 86px monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const inks = ['#25f4ff', '#ff3fd9', '#ff9a2e'];
  const word = 'ARCADE';
  for (let i = 0; i < word.length; i++) {
    const ink = inks[i % 3], x = 60 + i * 80;
    g.shadowColor = ink; g.shadowBlur = 26; g.fillStyle = ink;
    g.fillText(word[i], x, 66);
    g.shadowBlur = 0; g.fillStyle = '#ffffff';
    g.font = 'bold 74px monospace'; g.fillText(word[i], x, 66); g.font = 'bold 86px monospace';
  }
  return canvasTexture(c);
}
// --- retro wall poster ---
function makePosterTexture(title, sub, ink) {
  const [c, g] = makeCanvas(256, 384);
  g.fillStyle = '#0d0a26'; g.fillRect(0, 0, 256, 384);
  g.strokeStyle = ink; g.lineWidth = 8; g.strokeRect(10, 10, 236, 364);
  for (let i = 0; i < 26; i++) {                           // starburst speckle
    g.fillStyle = i % 2 ? ink : '#ffffff'; g.globalAlpha = rand(0.3, 0.9);
    g.fillRect(rng() * 256, rng() * 384, 4, 4);
  }
  g.globalAlpha = 1; g.textAlign = 'center';
  g.font = 'bold 44px monospace'; g.shadowColor = ink; g.shadowBlur = 18; g.fillStyle = '#ffffff';
  g.fillText(title, 128, 130);
  g.font = 'bold 26px monospace'; g.fillStyle = ink; g.fillText(sub, 128, 250);
  g.shadowBlur = 0;
  return canvasTexture(c);
}
// --- change machine face ---
function makeChangeFaceTexture() {
  const [c, g] = makeCanvas(128, 256);
  g.fillStyle = '#101642'; g.fillRect(0, 0, 128, 256);
  g.font = 'bold 30px monospace'; g.textAlign = 'center';
  g.shadowColor = '#ffe14d'; g.shadowBlur = 12; g.fillStyle = '#ffe14d';
  g.fillText('CHANGE', 64, 44); g.shadowBlur = 0;
  g.fillStyle = '#05050f'; g.fillRect(24, 70, 80, 56);     // bill acceptor
  g.strokeStyle = '#8b93a8'; g.lineWidth = 3; g.strokeRect(24, 70, 80, 56);
  g.fillStyle = '#25f4ff'; g.fillRect(40, 92, 48, 8);
  g.fillStyle = '#05050f';                                  // coin cups
  g.beginPath(); g.arc(44, 190, 18, 0, 6.28); g.arc(84, 190, 18, 0, 6.28); g.fill();
  g.fillStyle = '#ffd76a';
  g.beginPath(); g.arc(44, 190, 8, 0, 6.28); g.arc(84, 192, 7, 0, 6.28); g.fill();
  return canvasTexture(c);
}
// --- animated game screens (redrawn each few frames) ---
function makeScreen(drawFn) {
  const [c, g] = makeCanvas(160, 120);
  const tex = canvasTexture(c);
  tex.magFilter = THREE.NearestFilter;                     // chunky pixels
  return { tex, draw: (t) => { drawFn(g, t); tex.needsUpdate = true; } };
}
function drawInvaders(g, t) {
  g.fillStyle = '#030310'; g.fillRect(0, 0, 160, 120);
  const step = Math.floor(t * 2), sway = (step % 2 ? 6 : -6);
  for (let r = 0; r < 4; r++) for (let col = 0; col < 6; col++) {
    g.fillStyle = ['#39ff6a', '#25f4ff', '#ff3fd9', '#ffe14d'][r];
    const x = 22 + col * 20 + sway, y = 12 + r * 16;
    g.fillRect(x, y, 12, 8); g.fillRect(x + 2, y - 3, 8, 3);
    g.fillRect(x - 2, y + 8, 3, 3); g.fillRect(x + 11, y + 8, 3, 3);
  }
  g.fillStyle = '#ffffff'; g.fillRect(76 + Math.sin(t * 1.7) * 40, 104, 14, 8);
  g.fillRect(81 + Math.sin(t * 1.7) * 40, 84 - (t * 140 % 70), 3, 8);
}
function drawPong(g, t) {
  g.fillStyle = '#04021a'; g.fillRect(0, 0, 160, 120);
  g.strokeStyle = '#2a2f6e'; g.setLineDash([6, 6]);
  g.beginPath(); g.moveTo(80, 0); g.lineTo(80, 120); g.stroke(); g.setLineDash([]);
  const bx = 80 + Math.sin(t * 2.4) * 62, by = 60 + Math.sin(t * 3.1) * 44;
  g.fillStyle = '#25f4ff'; g.fillRect(6, by - 16, 6, 32);
  g.fillStyle = '#ff3fd9'; g.fillRect(148, 44 + Math.sin(t * 2.4 + 1) * 30, 6, 32);
  g.fillStyle = '#ffffff'; g.fillRect(bx - 4, by - 4, 8, 8);
  g.font = 'bold 18px monospace'; g.fillText(String(Math.floor(t) % 10), 56, 20);
  g.fillText(String(Math.floor(t * 0.7) % 10), 94, 20);
}
function drawRacer(g, t) {
  g.fillStyle = '#050214'; g.fillRect(0, 0, 160, 60);
  g.fillStyle = '#1a0f38'; g.fillRect(0, 60, 160, 60);
  g.fillStyle = '#3a3f66';                                  // road
  g.beginPath(); g.moveTo(64, 60); g.lineTo(96, 60); g.lineTo(150, 120); g.lineTo(10, 120);
  g.closePath(); g.fill();
  g.fillStyle = '#ffe14d';
  for (let i = 0; i < 5; i++) {                            // scrolling dashes
    const p = ((t * 1.6 + i * 0.2) % 1), y = 60 + p * 60;
    g.fillRect(78 - p * 4, y, 5 + p * 6, 6 + p * 5);
  }
  g.fillStyle = '#ff3fd9'; g.fillRect(66 + Math.sin(t * 1.3) * 18, 96, 26, 16);
  g.fillStyle = '#25f4ff'; g.fillRect(69 + Math.sin(t * 1.3) * 18, 90, 20, 8);
  g.fillStyle = '#ff9a2e'; g.fillRect(30, 20 + Math.sin(t) * 4, 10, 10);  // sunset blob
}

/* ===================== 4. SHARED MATERIALS ===================== */
const MAT = {
  wall:    new THREE.MeshStandardMaterial({ color: PAL.wall, roughness: 0.95 }),
  ceiling: new THREE.MeshStandardMaterial({ color: PAL.ceiling, roughness: 0.95 }),
  body:    new THREE.MeshStandardMaterial({ color: PAL.cabinetBody, roughness: 0.6, metalness: 0.15 }),
  dark:    new THREE.MeshStandardMaterial({ color: PAL.cabinetDark, roughness: 0.5, metalness: 0.2 }),
  panel:   new THREE.MeshStandardMaterial({ color: PAL.panel, roughness: 0.45, metalness: 0.3 }),
  chrome:  new THREE.MeshStandardMaterial({ color: PAL.chrome, roughness: 0.25, metalness: 0.9 }),
  glass:   new THREE.MeshPhysicalMaterial({ color: PAL.glassTint, transparent: true, opacity: 0.14,
                                            roughness: 0.06, metalness: 0, side: THREE.DoubleSide }),
  stripCyan:    new THREE.MeshStandardMaterial({ color: 0x061a22, emissive: PAL.neonCyan, emissiveIntensity: 2 }),
  stripMagenta: new THREE.MeshStandardMaterial({ color: 0x220619, emissive: PAL.neonMagenta, emissiveIntensity: 2 }),
  stripOrange:  new THREE.MeshStandardMaterial({ color: 0x221204, emissive: PAL.neonOrange, emissiveIntensity: 2 }),
  mirror:  new THREE.MeshStandardMaterial({ color: 0xdde4f2, roughness: 0.08, metalness: 0.95 })
};
const screens = [makeScreen(drawInvaders), makeScreen(drawPong), makeScreen(drawRacer)];
const screenMats = screens.map(s => new THREE.MeshStandardMaterial({
  color: 0x000000, emissive: 0xffffff, emissiveMap: s.tex, emissiveIntensity: 1.35, roughness: 0.35
}));

/* ===================== 5. BUILDER FUNCTIONS ===================== */
function box(w, h, d, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}
// --- the room shell: carpet floor + inward-facing walls + ceiling ---
function buildRoom() {
  const g = new THREE.Group();
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(ROOM.w, ROOM.d),
    new THREE.MeshStandardMaterial({ map: makeCarpetTexture(), roughness: 0.92 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true;
  g.add(floor);
  const wallGeoW = new THREE.PlaneGeometry(ROOM.w, ROOM.h);
  const wallGeoD = new THREE.PlaneGeometry(ROOM.d, ROOM.h);
  const back = new THREE.Mesh(wallGeoW, MAT.wall);
  back.position.set(0, ROOM.h / 2, -ROOM.d / 2);
  const front = new THREE.Mesh(wallGeoW, MAT.wall);
  front.position.set(0, ROOM.h / 2, ROOM.d / 2); front.rotation.y = Math.PI;
  const left = new THREE.Mesh(wallGeoD, MAT.wall);
  left.position.set(-ROOM.w / 2, ROOM.h / 2, 0); left.rotation.y = Math.PI / 2;
  const right = new THREE.Mesh(wallGeoD, MAT.wall);
  right.position.set(ROOM.w / 2, ROOM.h / 2, 0); right.rotation.y = -Math.PI / 2;
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(ROOM.w, ROOM.d), MAT.ceiling);
  ceil.position.y = ROOM.h; ceil.rotation.x = Math.PI / 2;
  for (const wall of [back, front, left, right, ceil]) { wall.receiveShadow = true; g.add(wall); }
  return g;
}
// --- neon strips hugging the walls near the ceiling + corner verticals ---
// (one-sided planes: a strip is culled together with the wall it sits on)
function buildNeonStrips() {
  const g = new THREE.Group(), t = 0.11, out = 0.06;
  const runs = [
    [ROOM.w - 1, MAT.stripCyan,    0, 5.9, -ROOM.d / 2 + out, 0],
    [ROOM.w - 1, MAT.stripMagenta, 0, 6.35, -ROOM.d / 2 + out, 0],
    [ROOM.d - 1, MAT.stripOrange, -ROOM.w / 2 + out, 5.9, 0, Math.PI / 2],
    [ROOM.d - 1, MAT.stripCyan,   -ROOM.w / 2 + out, 6.35, 0, Math.PI / 2],
    [ROOM.d - 1, MAT.stripMagenta, ROOM.w / 2 - out, 5.9, 0, -Math.PI / 2],
    [ROOM.d - 1, MAT.stripOrange,  ROOM.w / 2 - out, 6.35, 0, -Math.PI / 2],
    [ROOM.w - 1, MAT.stripOrange,  0, 6.1, ROOM.d / 2 - out, Math.PI]
  ];
  for (const [len, mat, x, y, z, ry] of runs) {
    const s = new THREE.Mesh(new THREE.PlaneGeometry(len, t), mat);
    s.position.set(x, y, z); s.rotation.y = ry; g.add(s);
  }
  for (const [cx, cz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {   // corner columns
    const v = new THREE.Mesh(new THREE.PlaneGeometry(t, 5.2), cx * cz > 0 ? MAT.stripMagenta : MAT.stripCyan);
    v.position.set(cx * (ROOM.w / 2 - out), 2.9, cz * (ROOM.d / 2 - out));
    v.rotation.y = cx > 0 ? -Math.PI / 2 : Math.PI / 2;             // culls with its side wall
    g.add(v);
  }
  return g;
}
// --- one arcade cabinet with animated screen, marquee, joystick panel ---
function buildArcadeCabinet(index) {
  const g = new THREE.Group();
  const accent = PAL.accents[index % 3];
  const accentMat = new THREE.MeshStandardMaterial({ color: 0x101020, emissive: accent, emissiveIntensity: 1.1 });
  const plinth = box(1.5, 0.24, 1.15, MAT.dark); plinth.position.set(0, 0.12, 0);
  g.add(plinth);
  const bodyMesh = box(1.4, 1.9, 1.05, MAT.body); bodyMesh.position.set(0, 1.19, -0.05);
  g.add(bodyMesh);
  const hood = box(1.4, 0.85, 0.75, MAT.body); hood.position.set(0, 2.5, -0.2);
  g.add(hood);
  const marquee = new THREE.Mesh(new THREE.BoxGeometry(1.42, 0.42, 0.1),
    new THREE.MeshStandardMaterial({ color: 0x05050f, emissive: 0xffffff, emissiveIntensity: 1.5,
      emissiveMap: makeMarqueeTexture(GAME_NAMES[index % GAME_NAMES.length], '#' + accent.toString(16).padStart(6, '0')) }));
  marquee.position.set(0, 2.98, 0.14); marquee.rotation.x = -0.12;
  g.add(marquee);
  const bezel = box(1.3, 1.05, 0.12, MAT.dark); bezel.position.set(0, 1.95, 0.42); bezel.rotation.x = -0.22;
  g.add(bezel);
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.05, 0.8), screenMats[index % 3]);
  screen.position.set(0, 1.96, 0.487); screen.rotation.x = -0.22;
  g.add(screen);
  const ctrl = box(1.4, 0.16, 0.62, MAT.panel); ctrl.position.set(0, 1.28, 0.55); ctrl.rotation.x = 0.18;
  g.add(ctrl);
  const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.17, 8), MAT.chrome);
  stick.position.set(-0.32, 1.42, 0.52); g.add(stick);
  const knob = new THREE.Mesh(new THREE.SphereGeometry(0.055, 10, 8), accentMat);
  knob.position.set(-0.32, 1.51, 0.52); g.add(knob);
  for (let i = 0; i < 3; i++) {
    const btn = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.05, 10),
      i ? accentMat : MAT.stripMagenta);
    btn.position.set(0.08 + i * 0.2, 1.38 - i * 0.035, 0.55 + i * 0.02); btn.rotation.x = 0.18;
    g.add(btn);
  }
  const coinDoor = box(0.5, 0.42, 0.05, MAT.dark); coinDoor.position.set(0, 0.62, 0.485);
  g.add(coinDoor);
  const coinSlot = new THREE.Mesh(new THREE.PlaneGeometry(0.09, 0.16), accentMat);
  coinSlot.position.set(0, 0.64, 0.515); g.add(coinSlot);
  const trim = new THREE.Mesh(new THREE.BoxGeometry(0.05, 2.6, 0.05), accentMat);   // glowing side edge
  trim.position.set(-0.72, 1.6, 0.35); g.add(trim.clone().translateX(1.44)); g.add(trim);
  return g;
}
// --- air-hockey table with drifting puck and mallets ---
function buildAirHockey() {
  const g = new THREE.Group();
  const surfCanvas = makeCanvas(256, 160);
  const [sc, sg] = surfCanvas;
  sg.fillStyle = '#e8f0f8'; sg.fillRect(0, 0, 256, 160);
  sg.strokeStyle = '#2244aa'; sg.lineWidth = 5;
  sg.beginPath(); sg.moveTo(128, 6); sg.lineTo(128, 154); sg.stroke();
  sg.beginPath(); sg.arc(128, 80, 34, 0, 6.28); sg.stroke();
  sg.strokeStyle = '#cc3355';
  sg.beginPath(); sg.arc(6, 80, 40, -1.57, 1.57); sg.stroke();
  sg.beginPath(); sg.arc(250, 80, 40, 1.57, 4.71); sg.stroke();
  const surf = new THREE.Mesh(new THREE.BoxGeometry(3.3, 0.12, 1.9),
    new THREE.MeshStandardMaterial({ map: canvasTexture(sc), emissiveMap: canvasTexture(sc),
      emissive: 0xffffff, emissiveIntensity: 0.22, roughness: 0.35 }));
  surf.position.y = 0.82; surf.castShadow = surf.receiveShadow = true;
  g.add(surf);
  const rim = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.16, 2.1), MAT.dark);
  rim.position.y = 0.78; rim.castShadow = true; g.add(rim);
  for (const [sx, sz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const leg = box(0.16, 0.74, 0.16, MAT.panel);
    leg.position.set(sx * 1.45, 0.37, sz * 0.8); g.add(leg);
  }
  const glowRimF = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.05, 0.06), MAT.stripCyan);
  glowRimF.position.set(0, 0.9, 1.03); g.add(glowRimF);
  const glowRimB = glowRimF.clone(); glowRimB.position.z = -1.03; g.add(glowRimB);
  const glowRimS = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.05, 2.1), MAT.stripMagenta);
  glowRimS.position.set(1.73, 0.9, 0); g.add(glowRimS);
  const glowRimS2 = glowRimS.clone(); glowRimS2.position.x = -1.73; g.add(glowRimS2);
  const malletGeo = new THREE.CylinderGeometry(0.11, 0.13, 0.06, 14);
  const m1 = new THREE.Mesh(malletGeo, new THREE.MeshStandardMaterial({ color: 0xff3355, roughness: 0.4 }));
  const m2 = new THREE.Mesh(malletGeo, new THREE.MeshStandardMaterial({ color: 0x22e6ff, roughness: 0.4 }));
  m1.position.set(-1.2, 0.92, 0); m2.position.set(1.2, 0.92, 0);
  m1.castShadow = m2.castShadow = true;
  const puck = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.035, 14),
    new THREE.MeshStandardMaterial({ color: 0x111118, emissive: 0xffe14d, emissiveIntensity: 0.5 }));
  puck.position.y = 0.905;
  g.add(m1, m2, puck);
  g.userData = { puck, m1, m2 };
  return g;
}
// --- prize claw machine stuffed with plush toys ---
function buildClawMachine() {
  const g = new THREE.Group();
  const base = box(1.7, 1.0, 1.5, MAT.panel); base.position.y = 0.5;
  g.add(base);
  const chute = box(0.5, 0.35, 0.08, MAT.dark); chute.position.set(-0.4, 0.72, 0.755);
  g.add(chute);
  const caseH = 1.5, caseY = 1.0;
  for (const [cx, cz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
    const post = box(0.1, caseH, 0.1, MAT.dark);
    post.position.set(cx * 0.8, caseY + caseH / 2, cz * 0.7); g.add(post);
  }
  const glassF = new THREE.Mesh(new THREE.PlaneGeometry(1.5, caseH), MAT.glass);
  glassF.position.set(0, caseY + caseH / 2, 0.7);
  const glassB = glassF.clone(); glassB.position.z = -0.7; glassB.rotation.y = Math.PI;
  const glassL = new THREE.Mesh(new THREE.PlaneGeometry(1.3, caseH), MAT.glass);
  glassL.position.set(-0.8, caseY + caseH / 2, 0); glassL.rotation.y = Math.PI / 2;
  const glassR = glassL.clone(); glassR.position.x = 0.8; glassR.rotation.y = -Math.PI / 2;
  g.add(glassF, glassB, glassL, glassR);
  const top = box(1.8, 0.42, 1.6, MAT.panel); top.position.y = caseY + caseH + 0.21;
  g.add(top);
  const topSign = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.3, 0.06),
    new THREE.MeshStandardMaterial({ color: 0x0a0a18, emissive: PAL.neonYellow, emissiveIntensity: 1.4 }));
  topSign.position.set(0, caseY + caseH + 0.21, 0.79); g.add(topSign);
  for (let i = 0; i < 9; i++) {                            // plush pile
    const tone = new THREE.Color(PAL.plush[i % PAL.plush.length]);
    const mat = new THREE.MeshStandardMaterial({ color: tone, roughness: 1 });
    const plush = new THREE.Group();
    const bodySize = rand(0.13, 0.17);
    const pb = new THREE.Mesh(new THREE.SphereGeometry(bodySize, 10, 8), mat);
    const ph = new THREE.Mesh(new THREE.SphereGeometry(bodySize * 0.7, 10, 8), mat);
    ph.position.y = bodySize * 1.1;
    const earGeo = new THREE.SphereGeometry(bodySize * 0.28, 8, 6);
    const e1 = new THREE.Mesh(earGeo, mat); e1.position.set(-bodySize * 0.5, bodySize * 1.65, 0);
    const e2 = new THREE.Mesh(earGeo, mat); e2.position.set(bodySize * 0.5, bodySize * 1.65, 0);
    plush.add(pb, ph, e1, e2);
    plush.position.set(rand(-0.55, 0.55), caseY + bodySize + 0.02, rand(-0.45, 0.45));
    plush.rotation.y = rand(0, 6.28);
    plush.traverse(o => { if (o.isMesh) o.castShadow = true; });
    g.add(plush);
  }
  const clawRig = new THREE.Group();                        // bobbing claw on a rod
  const rodGeo = new THREE.CylinderGeometry(0.02, 0.02, 1, 8); rodGeo.translate(0, -0.5, 0);
  const rod = new THREE.Mesh(rodGeo, MAT.chrome);
  const claw = new THREE.Group();
  const hub = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 8), MAT.chrome);
  claw.add(hub);
  for (let i = 0; i < 3; i++) {
    const finger = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.02, 0.24, 6), MAT.chrome);
    const a = i * Math.PI * 2 / 3;
    finger.position.set(Math.cos(a) * 0.08, -0.1, Math.sin(a) * 0.08);
    finger.rotation.set(Math.sin(a) * 0.5, 0, -Math.cos(a) * 0.5);
    claw.add(finger);
  }
  clawRig.add(rod, claw);
  clawRig.position.set(0.25, caseY + caseH, -0.1);
  g.add(clawRig);
  const caseGlow = new THREE.PointLight(0xfff2cc, 7, 4.5, 2);      // lights the plush pile
  caseGlow.position.set(0, caseY + caseH - 0.25, 0);
  g.add(caseGlow);
  g.userData = { rod, claw, topY: caseY + caseH };
  return g;
}
// --- coin change machine ---
function buildChangeMachine() {
  const g = new THREE.Group();
  const bodyMesh = box(1.0, 2.0, 0.65, new THREE.MeshStandardMaterial({ color: 0x24307a, roughness: 0.5, metalness: 0.3 }));
  bodyMesh.position.y = 1.0; g.add(bodyMesh);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(0.84, 1.7),
    new THREE.MeshStandardMaterial({ map: makeChangeFaceTexture(), emissiveMap: makeChangeFaceTexture(),
      emissive: 0xffffff, emissiveIntensity: 0.55, roughness: 0.5 }));
  face.position.set(0, 1.05, 0.328); g.add(face);
  const marquee = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.22, 0.08), MAT.stripOrange);
  marquee.position.set(0, 2.05, 0.3); g.add(marquee);
  const feet = box(0.9, 0.08, 0.55, MAT.dark); feet.position.y = 0.04; g.add(feet);
  return g;
}
// --- soda vending machine (coherent extra prop) ---
function buildVendingMachine() {
  const g = new THREE.Group();
  const [c, gg] = makeCanvas(128, 256);
  gg.fillStyle = '#301048'; gg.fillRect(0, 0, 128, 256);
  gg.font = 'bold 26px monospace'; gg.textAlign = 'center';
  gg.shadowColor = '#25f4ff'; gg.shadowBlur = 10; gg.fillStyle = '#25f4ff';
  gg.fillText('ZAP', 64, 34); gg.fillText('COLA', 64, 62); gg.shadowBlur = 0;
  for (let r = 0; r < 3; r++) for (let col = 0; col < 3; col++) {
    gg.fillStyle = PAL.carpetInks[(r * 3 + col) % 5];
    gg.fillRect(18 + col * 34, 84 + r * 44, 24, 32);
  }
  gg.fillStyle = '#05050f'; gg.fillRect(18, 218, 92, 26);
  const bodyMesh = box(1.15, 2.3, 0.75, new THREE.MeshStandardMaterial({ color: 0x481838, roughness: 0.5 }));
  bodyMesh.position.y = 1.15; g.add(bodyMesh);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 2.05),
    new THREE.MeshStandardMaterial({ map: canvasTexture(c), emissiveMap: canvasTexture(c),
      emissive: 0xffffff, emissiveIntensity: 0.65, roughness: 0.4 }));
  face.position.set(0, 1.2, 0.378); g.add(face);
  return g;
}
// --- mirror ball with instanced facets ---
function buildMirrorBall() {
  const g = new THREE.Group();
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.52, 20, 14),
    new THREE.MeshStandardMaterial({ color: 0x30343f, roughness: 0.4, metalness: 0.8 }));
  g.add(core);
  const N = 210;
  const facets = new THREE.InstancedMesh(new THREE.PlaneGeometry(0.11, 0.11), MAT.mirror, N);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < N; i++) {                            // fibonacci sphere distribution
    const y = 1 - (i / (N - 1)) * 2, rad = Math.sqrt(1 - y * y), th = 2.39996 * i;
    const p = new THREE.Vector3(Math.cos(th) * rad, y, Math.sin(th) * rad);
    dummy.position.copy(p).multiplyScalar(0.55);
    dummy.lookAt(p.clone().multiplyScalar(2));
    dummy.updateMatrix();
    facets.setMatrixAt(i, dummy.matrix);
  }
  g.add(facets);
  const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 1.1, 6), MAT.dark);
  cable.position.y = 1.05; g.add(cable);
  return g;
}
// --- flickering ARCADE neon sign (plane, culled when its wall is) ---
function buildNeonSign() {
  const mat = new THREE.MeshBasicMaterial({ map: makeSignTexture(), transparent: true });
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(6.2, 1.55), mat);
  sign.userData.mat = mat;
  return sign;
}
// --- round diner stool ---
function buildStool() {
  const g = new THREE.Group();
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 0.5, 10), MAT.chrome);
  post.position.y = 0.25; post.castShadow = true;
  const seat = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.26, 0.1, 14),
    new THREE.MeshStandardMaterial({ color: 0xd6295a, roughness: 0.55 }));
  seat.position.y = 0.55; seat.castShadow = true;
  const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.2, 0.04, 12), MAT.dark);
  foot.position.y = 0.02;
  g.add(post, seat, foot);
  return g;
}
// --- trash bin with lid swing top ---
function buildTrashBin() {
  const g = new THREE.Group();
  const bin = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.22, 0.72, 12),
    new THREE.MeshStandardMaterial({ color: 0x3a4152, roughness: 0.7, metalness: 0.4 }));
  bin.position.y = 0.36; bin.castShadow = true;
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.1, 12), MAT.dark);
  lid.position.y = 0.77;
  g.add(bin, lid);
  return g;
}

/* ===================== 6. RENDERER / SCENE / CAMERA ===================== */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.fog);
scene.fog = new THREE.Fog(PAL.fog, 20, 58);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 120);
camera.position.set(15, 11.5, 19);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.2, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 14;
controls.maxDistance = 34;
controls.minPolarAngle = 0.65;
controls.maxPolarAngle = 1.30;

/* ===================== 7. ASSEMBLY / LAYOUT ===================== */
scene.add(buildRoom());
scene.add(buildNeonStrips());

const cabinets = [];
let cabIndex = 0;
function placeCabinet(x, z, ry) {
  const cab = buildArcadeCabinet(cabIndex++);
  cab.position.set(x, 0, z);
  cab.rotation.y = ry + rand(-0.03, 0.03);
  scene.add(cab);
  cabinets.push(cab);
}
for (let i = 0; i < 5; i++) placeCabinet(-4.8 + i * 2.4, -7.0, 0);            // back wall row
for (let i = 0; i < 4; i++) placeCabinet(-9.9, -4.5 + i * 3.0, Math.PI / 2);  // left wall row
placeCabinet(9.9, -1.4, -Math.PI / 2);                                         // right wall pair
placeCabinet(9.9, 1.0, -Math.PI / 2);

const airHockey = buildAirHockey();
airHockey.position.set(-0.6, 0, 2.4); airHockey.rotation.y = 0.5;
scene.add(airHockey);

const claw = buildClawMachine();
claw.position.set(7.6, 0, -6.5); claw.rotation.y = -0.28;                      // back-right, angled in
scene.add(claw);

const changeMachine = buildChangeMachine();
changeMachine.position.set(-7.9, 0, -6.9); changeMachine.rotation.y = 0.3;     // back-left corner
scene.add(changeMachine);

const vending = buildVendingMachine();
vending.position.set(9.85, 0, 3.6); vending.rotation.y = -Math.PI / 2;
scene.add(vending);

const mirrorBall = buildMirrorBall();
mirrorBall.position.set(0, 6.6, 0);
scene.add(mirrorBall);

const sign = buildNeonSign();
sign.position.set(0, 6.1, -ROOM.d / 2 + 0.06);
scene.add(sign);

const poster1 = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 2.55),
  new THREE.MeshStandardMaterial({ map: makePosterTexture('HIGH', 'SCORE', '#25f4ff'),
    emissiveMap: makePosterTexture('HIGH', 'SCORE', '#25f4ff'), emissive: 0xffffff, emissiveIntensity: 0.4 }));
poster1.position.set(-ROOM.w / 2 + 0.05, 4.6, -6.2); poster1.rotation.y = Math.PI / 2;
const poster2 = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 2.55),
  new THREE.MeshStandardMaterial({ map: makePosterTexture('INSERT', 'COIN', '#ff9a2e'),
    emissiveMap: makePosterTexture('INSERT', 'COIN', '#ff9a2e'), emissive: 0xffffff, emissiveIntensity: 0.4 }));
poster2.position.set(ROOM.w / 2 - 0.05, 4.6, -6.6); poster2.rotation.y = -Math.PI / 2;
scene.add(poster1, poster2);

const stool1 = buildStool(); stool1.position.set(-2.6, 0, 4.0);
const stool2 = buildStool(); stool2.position.set(1.6, 0, 1.0);
const stool3 = buildStool(); stool3.position.set(4.2, 0, 5.6);
scene.add(stool1, stool2, stool3);

const bin = buildTrashBin(); bin.position.set(7.6, 0, 6.8);
scene.add(bin);

/* ===================== 8. LIGHTING RIG ===================== */
const hemi = new THREE.HemisphereLight(0x6a4ac2, 0x0a0518, 0.5);
scene.add(hemi);

const keySpot = new THREE.SpotLight(0xaebcff, 220, 30, 0.85, 0.55, 1.8);
keySpot.position.set(0, 7.9, 2.5);
keySpot.target.position.set(0, 0, 0);
keySpot.castShadow = true;
keySpot.shadow.mapSize.set(2048, 2048);
keySpot.shadow.bias = -0.0004;
keySpot.shadow.camera.near = 2; keySpot.shadow.camera.far = 22;
scene.add(keySpot, keySpot.target);

const glowCyan = new THREE.PointLight(PAL.neonCyan, 55, 17, 1.9);
glowCyan.position.set(-7.5, 4.4, -4.5);
const glowMagenta = new THREE.PointLight(PAL.neonMagenta, 55, 17, 1.9);
glowMagenta.position.set(7.5, 4.4, -4.0);
const glowOrange = new THREE.PointLight(PAL.neonOrange, 40, 15, 1.9);
glowOrange.position.set(0.5, 3.2, 5.6);
const ballGlow = new THREE.PointLight(0xffffff, 16, 12, 2.0);
ballGlow.position.set(0, 6.2, 0);
scene.add(glowCyan, glowMagenta, glowOrange, ballGlow);

/* ===================== 9. ANIMATION LOOP ===================== */
const clock = new THREE.Clock();
let screenTimer = 0;
const ah = airHockey.userData, cw = claw.userData;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  // 1) animated cabinet screens (redrawn at ~12 fps)
  screenTimer += dt;
  if (screenTimer > 0.085) {
    screenTimer = 0;
    for (const s of screens) s.draw(t);
  }

  // 2) neon strips pulse in offset phases
  MAT.stripCyan.emissiveIntensity    = 1.9 + Math.sin(t * 2.1) * 0.7;
  MAT.stripMagenta.emissiveIntensity = 1.9 + Math.sin(t * 2.1 + 2.1) * 0.7;
  MAT.stripOrange.emissiveIntensity  = 1.9 + Math.sin(t * 2.1 + 4.2) * 0.7;

  // 3) mirror ball spin + roaming disco tint
  mirrorBall.rotation.y = t * 0.55;
  ballGlow.color.setHSL((t * 0.05) % 1, 0.55, 0.62);
  ballGlow.position.x = Math.sin(t * 0.4) * 1.5;
  ballGlow.position.z = Math.cos(t * 0.4) * 1.5;

  // 4) air-hockey rally: puck slides, mallets chase
  ah.puck.position.x = Math.sin(t * 1.35) * 1.15;
  ah.puck.position.z = Math.sin(t * 2.7 + 0.6) * 0.5;
  ah.m1.position.x = -1.25 + Math.sin(t * 1.35) * 0.14;
  ah.m1.position.z = ah.puck.position.z * 0.55;
  ah.m2.position.x = 1.25 + Math.sin(t * 1.35 + Math.PI) * 0.14;
  ah.m2.position.z = ah.puck.position.z * 0.4;

  // 5) claw bobs on its rod above the plush pile
  const drop = 0.62 + Math.sin(t * 0.8) * 0.28;
  cw.rod.scale.y = drop;
  cw.claw.position.y = -drop;
  cw.claw.rotation.y = t * 0.6;

  // 6) ARCADE sign flicker (deterministic time function)
  const flick = (Math.sin(t * 13.0) > 0.96 || Math.sin(t * 7.3) < -0.985) ? 0.3 : 1.0;
  sign.userData.mat.opacity = flick;

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ===================== 10. RESIZE ===================== */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
