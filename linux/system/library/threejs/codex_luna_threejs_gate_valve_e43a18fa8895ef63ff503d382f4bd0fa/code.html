<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Industrial Gate Valve</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101419;
      font-family: Arial, sans-serif;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 24px;
      top: 20px;
      color: #d9e1e5;
      letter-spacing: 0.16em;
      font-size: 12px;
      text-transform: uppercase;
      opacity: 0.72;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Industrial Gate Valve · Cast Steel Assembly</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101419);
    scene.fog = new THREE.Fog(0x101419, 10, 25);

    const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(7.4, 4.8, 7.1);
    camera.lookAt(0, 1.55, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.85;
    controls.target.set(0, 1.65, 0);
    controls.minDistance = 4.7;
    controls.maxDistance = 14;
    controls.maxPolarAngle = Math.PI * 0.49;

    const hemi = new THREE.HemisphereLight(0xb9c8d0, 0x17191b, 2.1);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xfff1dc, 4.2);
    key.position.set(5, 9, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -7;
    key.shadow.camera.right = 7;
    key.shadow.camera.top = 8;
    key.shadow.camera.bottom = -5;
    key.shadow.bias = -0.00025;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0x8eadd0, 1.7);
    fill.position.set(-6, 4, -5);
    scene.add(fill);

    const rim = new THREE.PointLight(0x8ab7d8, 15, 15, 2);
    rim.position.set(0, 5.2, -4.5);
    scene.add(rim);

    const metal = new THREE.MeshStandardMaterial({
      color: 0x4a5356,
      metalness: 0.88,
      roughness: 0.29
    });

    const darkMetal = new THREE.MeshStandardMaterial({
      color: 0x252b2d,
      metalness: 0.93,
      roughness: 0.23
    });

    const edgeMetal = new THREE.MeshStandardMaterial({
      color: 0x7b8584,
      metalness: 0.92,
      roughness: 0.2
    });

    const brass = new THREE.MeshStandardMaterial({
      color: 0x9d7740,
      metalness: 0.9,
      roughness: 0.24
    });

    const rubber = new THREE.MeshStandardMaterial({
      color: 0x111516,
      metalness: 0.18,
      roughness: 0.72
    });

    function addMesh(geometry, material, position, rotation, parent = scene) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(position.x, position.y, position.z);
      if (rotation) mesh.rotation.set(rotation.x, rotation.y, rotation.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function cylinderBetween(a, b, radius, material, segments = 20, parent = scene) {
      const start = new THREE.Vector3(a.x, a.y, a.z);
      const end = new THREE.Vector3(b.x, b.y, b.z);
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();
      const geometry = new THREE.CylinderGeometry(radius, radius, length, segments);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function bolt(x, y, z, side) {
      const shaft = addMesh(
        new THREE.CylinderGeometry(0.125, 0.125, 0.17, 16),
        brass,
        { x, y, z },
        { x: 0, y: 0, z: Math.PI / 2 }
      );
      shaft.position.x += side * 0.02;
      const nut = addMesh(
        new THREE.CylinderGeometry(0.19, 0.19, 0.16, 6),
        edgeMetal,
        { x: x + side * 0.12, y, z },
        { x: 0, y: 0, z: Math.PI / 2 }
      );
      nut.rotation.y = Math.PI / 6;
    }

    const body = addMesh(
      new THREE.CylinderGeometry(1.18, 1.18, 2.55, 64),
      metal,
      { x: 0, y: 1.35, z: 0 },
      { x: 0, y: 0, z: Math.PI / 2 }
    );

    addMesh(
      new THREE.SphereGeometry(1.17, 48, 24),
      metal,
      { x: 0, y: 1.35, z: 0 }
    ).scale.set(1.12, 0.94, 0.94);

    addMesh(
      new THREE.CylinderGeometry(0.78, 0.9, 2.95, 48),
      darkMetal,
      { x: 0, y: 1.35, z: 0 },
      { x: 0, y: 0, z: Math.PI / 2 }
    );

    addMesh(
      new THREE.CylinderGeometry(0.91, 0.91, 2.62, 48),
      metal,
      { x: 0, y: 1.35, z: 0 },
      { x: 0, y: 0, z: Math.PI / 2 }
    );

    addMesh(
      new THREE.TorusGeometry(0.92, 0.075, 12, 64),
      edgeMetal,
      { x: -1.32, y: 1.35, z: 0 },
      { x: 0, y: Math.PI / 2, z: 0 }
    );
    addMesh(
      new THREE.TorusGeometry(0.92, 0.075, 12, 64),
      edgeMetal,
      { x: 1.32, y: 1.35, z: 0 },
      { x: 0, y: Math.PI / 2, z: 0 }
    );

    for (const side of [-1, 1]) {
      const x = side * 1.55;

      addMesh(
        new THREE.CylinderGeometry(1.52, 1.52, 0.34, 64),
        metal,
        { x, y: 1.35, z: 0 },
        { x: 0, y: 0, z: Math.PI / 2 }
      );

      addMesh(
        new THREE.CylinderGeometry(1.23, 1.23, 0.39, 64),
        darkMetal,
        { x: x + side * 0.025, y: 1.35, z: 0 },
        { x: 0, y: 0, z: Math.PI / 2 }
      );

      addMesh(
        new THREE.TorusGeometry(1.39, 0.075, 12, 64),
        edgeMetal,
        { x: x + side * 0.19, y: 1.35, z: 0 },
        { x: 0, y: Math.PI / 2, z: 0 }
      );

      addMesh(
        new THREE.TorusGeometry(1.04, 0.045, 10, 64),
        edgeMetal,
        { x: x + side * 0.2, y: 1.35, z: 0 },
        { x: 0, y: Math.PI / 2, z: 0 }
      );

      for (let i = 0; i < 8; i++) {
        const angle = i * Math.PI / 4 + Math.PI / 8;
        const y = 1.35 + Math.cos(angle) * 1.18;
        const z = Math.sin(angle) * 1.18;
        bolt(x + side * 0.22, y, z, side);
      }
    }

    addMesh(
      new THREE.CylinderGeometry(0.82, 1.02, 0.34, 48),
      metal,
      { x: 0, y: 2.51, z: 0 }
    );

    addMesh(
      new THREE.CylinderGeometry(0.69, 0.78, 0.8, 48),
      metal,
      { x: 0, y: 3.0, z: 0 }
    );

    addMesh(
      new THREE.TorusGeometry(0.71, 0.065, 12, 48),
      edgeMetal,
      { x: 0, y: 2.69, z: 0 }
    );

    addMesh(
      new THREE.CylinderGeometry(0.38, 0.46, 0.42, 40),
      darkMetal,
      { x: 0, y: 3.6, z: 0 }
    );

    addMesh(
      new THREE.CylinderGeometry(0.115, 0.115, 1.52, 24),
      brass,
      { x: 0, y: 4.25, z: 0 }
    );

    addMesh(
      new THREE.CylinderGeometry(0.16, 0.16, 0.18, 24),
      edgeMetal,
      { x: 0, y: 3.62, z: 0 }
    );

    const wheel = new THREE.Group();
    wheel.position.set(0, 4.96, 0);
    scene.add(wheel);

    const wheelRim = new THREE.Mesh(
      new THREE.TorusGeometry(1.13, 0.13, 16, 64),
      darkMetal
    );
    wheelRim.castShadow = true;
    wheelRim.receiveShadow = true;
    wheel.add(wheelRim);

    const wheelInner = new THREE.Mesh(
      new THREE.TorusGeometry(0.88, 0.045, 10, 64),
      edgeMetal
    );
    wheelInner.castShadow = true;
    wheelInner.receiveShadow = true;
    wheel.add(wheelInner);

    const hub = new THREE.Mesh(
      new THREE.CylinderGeometry(0.28, 0.28, 0.38, 32),
      brass
    );
    hub.castShadow = true;
    hub.receiveShadow = true;
    wheel.add(hub);

    for (let i = 0; i < 8; i++) {
      const angle = i * Math.PI / 4;
      const outer = new THREE.Vector3(Math.sin(angle) * 0.96, 0, Math.cos(angle) * 0.96);
      const inner = new THREE.Vector3(Math.sin(angle) * 0.18, 0, Math.cos(angle) * 0.18);
      cylinderBetween(inner, outer, 0.072, edgeMetal, 16, wheel);
    }

    addMesh(
      new THREE.CylinderGeometry(0.19, 0.19, 0.18, 24),
      brass,
      { x: 0, y: 5.2, z: 0 }
    );

    const floor = addMesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({
        color: 0x20272a,
        metalness: 0.22,
        roughness: 0.82
      }),
      { x: 0, y: -0.18, z: 0 },
      { x: -Math.PI / 2, y: 0, z: 0 }
    );
    floor.receiveShadow = true;

    const pedestal = addMesh(
      new THREE.BoxGeometry(3.4, 0.22, 2.4),
      darkMetal,
      { x: 0, y: -0.06, z: 0 }
    );
    pedestal.receiveShadow = true;

    const grid = new THREE.GridHelper(30, 30, 0x3b464a, 0x252d30);
    grid.position.y = -0.165;
    grid.material.transparent = true;
    grid.material.opacity = 0.28;
    scene.add(grid);

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      controls.update();
      renderer.render(scene, camera);
    }

    renderer.setAnimationLoop(animate);
  </script>
</body>
</html>
