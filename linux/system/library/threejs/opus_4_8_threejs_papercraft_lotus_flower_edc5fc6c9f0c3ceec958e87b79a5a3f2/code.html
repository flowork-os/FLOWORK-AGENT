<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Papercraft Lotus Flower</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#15161a; }
  canvas { display:block; }
</style>
</head>
<body>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ *
 *  Renderer / Scene / Camera
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14151a);
scene.fog = new THREE.Fog(0x14151a, 0.9, 3.2);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(0.34, 0.26, 0.44);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 0.22;
controls.maxDistance = 1.6;
controls.target.set(0, 0.075, 0);
controls.maxPolarAngle = Math.PI * 0.495;

/* ------------------------------------------------------------------ *
 *  Lighting : hemisphere ambient + key + fill + rim
 * ------------------------------------------------------------------ */
scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x2a2118, 0.55));

const key = new THREE.DirectionalLight(0xfff4e8, 2.5);
key.position.set(0.42, 0.62, 0.32);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.05;
key.shadow.camera.far = 2.4;
key.shadow.camera.left = -0.32;
key.shadow.camera.right = 0.32;
key.shadow.camera.top = 0.32;
key.shadow.camera.bottom = -0.32;
key.shadow.bias = -0.0009;
key.shadow.radius = 3;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd2ff, 0.62);
fill.position.set(-0.5, 0.24, 0.34);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9e6, 1.15);
rim.position.set(-0.22, 0.38, -0.55);
scene.add(rim);

const bounce = new THREE.PointLight(0xffe8ef, 0.45, 1.2, 2.0);
bounce.position.set(0, 0.04, 0.18);
scene.add(bounce);

/* shadow-only ground */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(4, 4),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ *
 *  Root object (the ONE centered object)
 * ------------------------------------------------------------------ */
const lotus = new THREE.Group();
scene.add(lotus);

/* ------------------------------------------------------------------ *
 *  Petal geometry builder
 *  A flat paper sheet: lens-shaped outline, longitudinal centre crease
 *  (V fold), transverse curl toward the tip, slight cupping.
 *  Vertex colours carry the pink -> white gradient.
 * ------------------------------------------------------------------ */
const TMP = new THREE.Vector3();

function buildPetalGeometry(opts) {
  const {
    length      = 0.10,
    width       = 0.040,
    segU        = 15,   // across width
    segV        = 34,   // along length
    creaseDepth = 0.014,// centre-fold rise
    cupping     = 0.55, // how much edges lift
    curl        = 1.15, // tip bend upward/backward
    tipCurl     = 0.9,  // extra curl concentrated in the last 25%
    tipSharp    = 0.62, // outline sharpness at tip
    baseTaper   = 0.30,
    colInner    = new THREE.Color(0xf4a7bd),
    colOuter    = new THREE.Color(0xfff6f6),
    gradPow     = 1.35,
    thickness   = 0.0011
  } = opts || {};

  // outline half-width profile along v (0 base .. 1 tip)
  const halfW = (v) => {
    const base = Math.pow(Math.sin(Math.PI * Math.pow(v, 0.72)), 0.85);
    const taper = THREE.MathUtils.lerp(baseTaper, 1.0, Math.min(1, v / 0.18));
    const tip = Math.pow(1.0 - v, tipSharp * 0.42);
    return 0.5 * width * base * taper * (0.55 + 0.45 * tip);
  };

  const positions = [];
  const normals   = [];
  const colors    = [];
  const uvs       = [];
  const indices   = [];

  const cols = segU + 1;
  const rows = segV + 1;

  // ---- build the mid-surface as a grid --------------------------------
  const pts = [];
  for (let j = 0; j <= segV; j++) {
    const v = j / segV;
    const hw = halfW(v);

    // spine curve: petal rises then curls back at the tip
    const bend = curl * Math.pow(v, 1.9);
    const extra = tipCurl * Math.pow(Math.max(0, (v - 0.72) / 0.28), 2.2);
    const ang = bend + extra;                 // radians of bend accumulated

    // integrate an arc so the sheet keeps its arc-length (paper doesn't stretch)
    // approximate: sample analytically
    const steps = 24;
    let sx = 0, sy = 0;
    for (let s = 1; s <= steps; s++) {
      const t = (v * s) / steps;
      const b = curl * Math.pow(t, 1.9) + tipCurl * Math.pow(Math.max(0, (t - 0.72) / 0.28), 2.2);
      sx += Math.cos(b) * (length / steps) * v ;
      sy += Math.sin(b) * (length / steps) * v ;
    }
    const spineR = sx;   // radial distance from centre
    const spineY = sy;   // height

    const rowPts = [];
    for (let i = 0; i <= segU; i++) {
      const u = i / segU;            // 0 .. 1 across
      const s = (u - 0.5) * 2;       // -1 .. 1
      const as = Math.abs(s);

      // V crease: centre line sits higher, edges droop -> then cupping lifts them
      const crease = creaseDepth * (1 - as) * Math.sin(Math.PI * Math.pow(v, 0.7));
      const cup = cupping * hw * (as * as) * (0.35 + 0.65 * v);

      // local frame: spine tangent
      const nAng = ang + Math.PI * 0.5;
      const lift = crease + cup * 0.55;

      const x = s * hw;
      const rr = spineR + Math.cos(nAng) * lift;
      const yy = spineY + Math.sin(nAng) * lift;

      // gentle sideways furl of the outer edges near the tip
      const furl = 0.20 * hw * Math.pow(v, 3.0) * s;

      rowPts.push(new THREE.Vector3(x - furl * 0.15, yy, rr));
      void TMP;
    }
    pts.push(rowPts);
  }

  // ---- vertex data for one side ---------------------------------------
  function pushSide(sign) {
    const base = positions.length / 3;
    for (let j = 0; j <= segV; j++) {
      const v = j / segV;
      for (let i = 0; i <= segU; i++) {
        const u = i / segU;
        const p = pts[j][i];

        // compute normal via neighbours
        const pj = pts[Math.min(segV, j + 1)][i];
        const mj = pts[Math.max(0, j - 1)][i];
        const pi = pts[j][Math.min(segU, i + 1)];
        const mi = pts[j][Math.max(0, i - 1)];
        const dv = new THREE.Vector3().subVectors(pj, mj);
        const du = new THREE.Vector3().subVectors(pi, mi);
        const n = new THREE.Vector3().crossVectors(dv, du).normalize();
        if (n.lengthSq() < 1e-9) n.set(0, 1, 0);
        n.multiplyScalar(sign);

        positions.push(
          p.x + n.x * thickness * sign * 0.5,
          p.y + n.y * thickness * sign * 0.5,
          p.z + n.z * thickness * sign * 0.5
        );
        normals.push(n.x, n.y, n.z);

        // pink at base -> white at tip, with a touch of edge-whitening
        const edge = Math.pow(Math.abs((u - 0.5) * 2), 2.5);
        const t = THREE.MathUtils.clamp(Math.pow(v, gradPow) * 0.92 + edge * 0.28, 0, 1);
        const c = colInner.clone().lerp(colOuter, t);
        // subtle back-face darkening for depth
        if (sign < 0) c.multiplyScalar(0.9);
        colors.push(c.r, c.g, c.b);
        uvs.push(u, v);
      }
    }
    for (let j = 0; j < segV; j++) {
      for (let i = 0; i < segU; i++) {
        const a = base + j * cols + i;
        const b = a + 1;
        const c = a + cols;
        const d = c + 1;
        if (sign > 0) { indices.push(a, c, b, b, c, d); }
        else          { indices.push(a, b, c, b, d, c); }
      }
    }
  }

  pushSide(1);
  pushSide(-1);

  // ---- rim strip so the paper edge reads as a crisp cut edge -----------
  {
    const topBase = 0;
    const botBase = rows * cols;
    const addQuad = (a, b, c, d) => indices.push(a, b, c, b, d, c);
    // two long edges
    for (let j = 0; j < segV; j++) {
      // i = 0 edge
      addQuad(topBase + j * cols, botBase + j * cols,
              topBase + (j + 1) * cols, botBase + (j + 1) * cols);
      // i = segU edge
      addQuad(botBase + j * cols + segU, topBase + j * cols + segU,
              botBase + (j + 1) * cols + segU, topBase + (j + 1) * cols + segU);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(normals, 3));
  g.setAttribute('color',    new THREE.Float32BufferAttribute(colors, 3));
  g.setAttribute('uv',       new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(indices);
  g.computeBoundingSphere();
  return { geometry: g, pts, halfW, segU, segV };
}

/* ------------------------------------------------------------------ *
 *  Score lines: thin dark creases drawn on the petal surface
 * ------------------------------------------------------------------ */
const scoreMat = new THREE.LineBasicMaterial({
  color: 0xc07f95, transparent: true, opacity: 0.55
});
const scoreMatSoft = new THREE.LineBasicMaterial({
  color: 0xd79bad, transparent: true, opacity: 0.34
});

function buildScoreLines(built, count = 5) {
  const { pts, segU, segV } = built;
  const group = new THREE.Group();
  const lift = 0.0011;

  // longitudinal creases (radiating fan from base)
  for (let k = 0; k < count; k++) {
    const frac = count === 1 ? 0.5 : k / (count - 1);
    const iIdeal = frac * segU;
    const i0 = Math.max(0, Math.min(segU, Math.round(iIdeal)));
    const pos = [];
    for (let j = 1; j <= segV; j++) {
      const p = pts[j][i0];
      // pull slightly toward the tip-narrowing so lines converge like real scores
      const v = j / segV;
      const shrink = THREE.MathUtils.lerp(1.0, 0.55, Math.pow(v, 1.4));
      pos.push(p.x * shrink, p.y + lift, p.z);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    const isCentre = Math.abs(frac - 0.5) < 0.06;
    group.add(new THREE.Line(g, isCentre ? scoreMat : scoreMatSoft));
  }

  // transverse fold near the base (the "knuckle" crease of a folded petal)
  for (const vFrac of [0.14, 0.30]) {
    const j = Math.round(vFrac * segV);
    const pos = [];
    for (let i = 0; i <= segU; i++) {
      const p = pts[j][i];
      pos.push(p.x, p.y + lift, p.z);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    group.add(new THREE.Line(g, scoreMatSoft));
  }

  // crisp outline along the cut edge
  {
    const pos = [];
    for (let j = 0; j <= segV; j++) { const p = pts[j][0]; pos.push(p.x, p.y + lift * 0.6, p.z); }
    for (let j = segV; j >= 0; j--) { const p = pts[j][segU]; pos.push(p.x, p.y + lift * 0.6, p.z); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    group.add(new THREE.Line(g, scoreMatSoft));
  }

  return group;
}

/* ------------------------------------------------------------------ *
 *  Paper materials
 * ------------------------------------------------------------------ */
function paperMaterial(extra) {
  return new THREE.MeshStandardMaterial(Object.assign({
    vertexColors: true,
    roughness: 0.92,
    metalness: 0.0,
    side: THREE.DoubleSide,
    flatShading: false
  }, extra || {}));
}

const petalMaterial = paperMaterial({});

/* ------------------------------------------------------------------ *
 *  Glue tab: a small trapezoid of paper folded at the petal base
 * ------------------------------------------------------------------ */
const tabMaterial = new THREE.MeshStandardMaterial({
  color: 0xf0b3c4, roughness: 0.95, metalness: 0.0, side: THREE.DoubleSide
});

function buildTab(width, depth, fold) {
  const w0 = width * 0.5, w1 = width * 0.30;
  const pos = [
    -w0, 0, 0,
     w0, 0, 0,
    -w1, -Math.sin(fold) * depth, -Math.cos(fold) * depth,
     w1, -Math.sin(fold) * depth, -Math.cos(fold) * depth
  ];
  const idx = [0, 2, 1, 1, 2, 3];
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* ------------------------------------------------------------------ *
 *  Ring assembly
 * ------------------------------------------------------------------ */
const RINGS = [
  // outermost, widest open  ->  innermost, tight and upright
  { n: 16, len: 0.115, wid: 0.048, r: 0.0225, tilt:  1.30, roll: 0.00, curl: 1.02, tipCurl: 0.55, y: 0.0075, cIn: 0xef95b0, cOut: 0xfff2f3, cup: 0.42, crease: 0.011 },
  { n: 15, len: 0.108, wid: 0.045, r: 0.0205, tilt:  1.08, roll: 0.00, curl: 1.05, tipCurl: 0.62, y: 0.0110, cIn: 0xf09ab4, cOut: 0xfff4f4, cup: 0.46, crease: 0.011 },
  { n: 13, len: 0.098, wid: 0.042, r: 0.0180, tilt:  0.86, roll: 0.00, curl: 1.08, tipCurl: 0.70, y: 0.0150, cIn: 0xf2a1b9, cOut: 0xfff5f5, cup: 0.50, crease: 0.012 },
  { n: 12, len: 0.087, wid: 0.038, r: 0.0158, tilt:  0.66, roll: 0.00, curl: 1.10, tipCurl: 0.78, y: 0.0190, cIn: 0xf4a8bf, cOut: 0xfff6f6, cup: 0.54, crease: 0.012 },
  { n: 11, len: 0.076, wid: 0.034, r: 0.0136, tilt:  0.48, roll: 0.00, curl: 1.12, tipCurl: 0.86, y: 0.0230, cIn: 0xf5b0c5, cOut: 0xfff8f8, cup: 0.58, crease: 0.012 },
  { n:  9, len: 0.064, wid: 0.030, r: 0.0112, tilt:  0.32, roll: 0.00, curl: 1.14, tipCurl: 0.92, y: 0.0272, cIn: 0xf7b8cb, cOut: 0xfffafa, cup: 0.62, crease: 0.011 },
  { n:  8, len: 0.052, wid: 0.026, r: 0.0090, tilt:  0.19, roll: 0.00, curl: 1.16, tipCurl: 0.98, y: 0.0312, cIn: 0xf9c1d2, cOut: 0xfffbfb, cup: 0.66, crease: 0.010 },
  { n:  7, len: 0.040, wid: 0.021, r: 0.0068, tilt:  0.09, roll: 0.00, curl: 1.18, tipCurl: 1.02, y: 0.0348, cIn: 0xfbcbd9, cOut: 0xfffcfc, cup: 0.70, crease: 0.009 },
  { n:  6, len: 0.030, wid: 0.017, r: 0.0050, tilt:  0.02, roll: 0.00, curl: 1.20, tipCurl: 1.06, y: 0.0378, cIn: 0xfdd6e1, cOut: 0xfffdfd, cup: 0.74, crease: 0.008 }
];

// deterministic pseudo-random (handmade irregularity, but stable)
let seed = 20260720;
function rnd() {
  seed = (seed * 1664525 + 1013904223) % 4294967296;
  return seed / 4294967296;
}

const petalsRoot = new THREE.Group();
lotus.add(petalsRoot);

RINGS.forEach((ring, ri) => {
  const built = buildPetalGeometry({
    length: ring.len,
    width: ring.wid,
    curl: ring.curl,
    tipCurl: ring.tipCurl,
    cupping: ring.cup,
    creaseDepth: ring.crease,
    colInner: new THREE.Color(ring.cIn),
    colOuter: new THREE.Color(ring.cOut),
    segU: 13,
    segV: 30
  });
  const scoreProto = buildScoreLines(built, ri < 5 ? 5 : 3);
  const tabGeom = buildTab(ring.wid * 0.55, ring.len * 0.10, 1.15);

  const ringGroup = new THREE.Group();
  ringGroup.position.y = ring.y;
  ringGroup.rotation.y = ri * 0.41 + rnd() * 0.05;
  petalsRoot.add(ringGroup);

  for (let k = 0; k < ring.n; k++) {
    const a = (k / ring.n) * Math.PI * 2;

    const pivot = new THREE.Group();
    pivot.rotation.y = a;
    ringGroup.add(pivot);

    const arm = new THREE.Group();
    arm.position.set(0, 0, ring.r);
    // handmade jitter
    const jTilt = (rnd() - 0.5) * 0.085;
    const jRoll = (rnd() - 0.5) * 0.075;
    const jYaw  = (rnd() - 0.5) * 0.055;
    const jY    = (rnd() - 0.5) * 0.0016;

    arm.rotation.order = 'YXZ';
    arm.rotation.y = jYaw;
    arm.rotation.x = -(ring.tilt + jTilt) + Math.PI * 0.5; // 0 = flat outward
    arm.rotation.z = jRoll;
    arm.position.y += jY;
    pivot.add(arm);

    // NOTE: petal geometry is built in +Z (length) / +Y (lift); rotate to lay
    // it along the arm's local axis.
    const petal = new THREE.Mesh(built.geometry, petalMaterial);
    petal.castShadow = true;
    petal.receiveShadow = true;
    petal.rotation.x = -Math.PI * 0.5;
    arm.add(petal);

    const sc = scoreProto.clone(true);
    sc.rotation.x = -Math.PI * 0.5;
    arm.add(sc);

    // glue tab folded under the petal base
    const tab = new THREE.Mesh(tabGeom, tabMaterial);
    tab.castShadow = true;
    tab.receiveShadow = true;
    tab.rotation.x = -Math.PI * 0.5;
    arm.add(tab);
  }
});

/* ------------------------------------------------------------------ *
 *  Sepals — a few green paper leaves tucked beneath the outer ring
 * ------------------------------------------------------------------ */
{
  const sepBuilt = buildPetalGeometry({
    length: 0.098, width: 0.044, curl: 0.62, tipCurl: 0.30,
    cupping: 0.36, creaseDepth: 0.010,
    colInner: new THREE.Color(0x6f8f57), colOuter: new THREE.Color(0xbcd2a1),
    segU: 11, segV: 24
  });
  const sepScores = buildScoreLines(sepBuilt, 3);
  sepScores.traverse(o => {
    if (o.isLine) o.material = new THREE.LineBasicMaterial({ color: 0x53703f, transparent: true, opacity: 0.4 });
  });
  const sepMat = paperMaterial({});
  const nS = 8;
  const sepRing = new THREE.Group();
  sepRing.position.y = 0.0045;
  sepRing.rotation.y = 0.19;
  lotus.add(sepRing);
  for (let k = 0; k < nS; k++) {
    const pivot = new THREE.Group();
    pivot.rotation.y = (k / nS) * Math.PI * 2;
    sepRing.add(pivot);
    const arm = new THREE.Group();
    arm.position.set(0, 0, 0.024);
    arm.rotation.order = 'YXZ';
    arm.rotation.x = -(1.62 + (rnd() - 0.5) * 0.08) + Math.PI * 0.5;
    arm.rotation.z = (rnd() - 0.5) * 0.06;
    pivot.add(arm);
    const m = new THREE.Mesh(sepBuilt.geometry, sepMat);
    m.castShadow = true; m.receiveShadow = true;
    m.rotation.x = -Math.PI * 0.5;
    arm.add(m);
    const s = sepScores.clone(true);
    s.rotation.x = -Math.PI * 0.5;
    arm.add(s);
  }
}

/* ------------------------------------------------------------------ *
 *  Card centre: a folded paper disc + beaded stamens + seed pod
 * ------------------------------------------------------------------ */
const centre = new THREE.Group();
centre.position.y = 0.030;
lotus.add(centre);

/* --- pleated card disc (visible facets = folded card stock) --- */
{
  const SEG = 26, R = 0.0175;
  const pos = [], col = [], idx = [];
  const cA = new THREE.Color(0xf6d98a), cB = new THREE.Color(0xfff0c4);
  // centre vertex
  pos.push(0, 0.0035, 0); col.push(cB.r, cB.g, cB.b);
  for (let i = 0; i < SEG; i++) {
    const a = (i / SEG) * Math.PI * 2;
    const alt = i % 2 === 0 ? 1.0 : 0.86;
    const yy = i % 2 === 0 ? 0.0016 : -0.0004;
    pos.push(Math.cos(a) * R * alt, yy, Math.sin(a) * R * alt);
    const c = i % 2 === 0 ? cA : cB;
    col.push(c.r, c.g, c.b);
  }
  for (let i = 0; i < SEG; i++) {
    idx.push(0, 1 + i, 1 + ((i + 1) % SEG));
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.85, metalness: 0.0,
    side: THREE.DoubleSide, flatShading: true
  }));
  m.castShadow = true; m.receiveShadow = true;
  centre.add(m);
}

/* --- seed pod: a small card cylinder with punched dimples --- */
{
  const podMat = new THREE.MeshStandardMaterial({
    color: 0xd8c98a, roughness: 0.88, metalness: 0.0, flatShading: true
  });
  const pod = new THREE.Mesh(new THREE.CylinderGeometry(0.0092, 0.0072, 0.0072, 14, 1), podMat);
  pod.position.y = 0.0055;
  pod.castShadow = true; pod.receiveShadow = true;
  centre.add(pod);

  const capMat = new THREE.MeshStandardMaterial({
    color: 0xe6dcae, roughness: 0.9, metalness: 0.0, flatShading: true
  });
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.0096, 0.0096, 0.0012, 14, 1), capMat);
  cap.position.y = 0.0097;
  cap.castShadow = true; cap.receiveShadow = true;
  centre.add(cap);

  // seed dimples
  const seedGeom = new THREE.SphereGeometry(0.0017, 10, 8);
  const seedMat = new THREE.MeshStandardMaterial({ color: 0x8c7d4d, roughness: 0.7, metalness: 0.05 });
  const rings = [[0, 1], [0.0042, 6], [0.0074, 9]];
  for (const [rr, cnt] of rings) {
    for (let i = 0; i < cnt; i++) {
      const a = (i / cnt) * Math.PI * 2 + rr * 40;
      const s = new THREE.Mesh(seedGeom, seedMat);
      s.position.set(Math.cos(a) * rr, 0.0102, Math.sin(a) * rr);
      s.castShadow = true;
      centre.add(s);
    }
  }
}

/* --- beaded stamens: wire stems with glossy beads --- */
{
  const beadMat = new THREE.MeshStandardMaterial({
    color: 0xffd35c, roughness: 0.24, metalness: 0.18,
    emissive: 0x3a2a00, emissiveIntensity: 0.35
  });
  const beadMatB = new THREE.MeshStandardMaterial({
    color: 0xfff0a8, roughness: 0.2, metalness: 0.12
  });
  const wireMat = new THREE.MeshStandardMaterial({ color: 0xf3e2b0, roughness: 0.8, metalness: 0.0 });
  const beadGeom = new THREE.SphereGeometry(0.00135, 12, 10);
  const beadGeomB = new THREE.SphereGeometry(0.00105, 10, 8);

  const RINGS_S = [
    { r: 0.0112, n: 22, h: 0.0135, out: 0.30 },
    { r: 0.0142, n: 26, h: 0.0120, out: 0.46 },
    { r: 0.0168, n: 28, h: 0.0100, out: 0.60 }
  ];

  RINGS_S.forEach((rs, si) => {
    for (let i = 0; i < rs.n; i++) {
      const a = (i / rs.n) * Math.PI * 2 + si * 0.13 + rnd() * 0.05;
      const jitter = 1 + (rnd() - 0.5) * 0.16;
      const h = rs.h * jitter;
      const x0 = Math.cos(a) * rs.r, z0 = Math.sin(a) * rs.r;
      const lean = rs.out * h;
      const x1 = Math.cos(a) * (rs.r + lean), z1 = Math.sin(a) * (rs.r + lean);

      // stem as a thin tube along a slight arc
      const curve = new THREE.QuadraticBezierCurve3(
        new THREE.Vector3(x0, 0.0015, z0),
        new THREE.Vector3(Math.cos(a) * (rs.r + lean * 0.15), 0.0015 + h * 0.7, Math.sin(a) * (rs.r + lean * 0.15)),
        new THREE.Vector3(x1, 0.0015 + h, z1)
      );
      const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 6, 0.00030, 5, false), wireMat);
      tube.castShadow = true;
      centre.add(tube);

      const bead = new THREE.Mesh(si === 2 ? beadGeomB : beadGeom, si === 1 ? beadMatB : beadMat);
      bead.position.set(x1, 0.0015 + h + 0.0009, z1);
      bead.castShadow = true;
      centre.add(bead);
    }
  });
}

/* ------------------------------------------------------------------ *
 *  Under-base: a small folded paper collar hiding the tabs
 * ------------------------------------------------------------------ */
{
  const g = new THREE.CylinderGeometry(0.030, 0.020, 0.010, 20, 1, true);
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({
    color: 0xe9a7bb, roughness: 0.94, metalness: 0.0,
    side: THREE.DoubleSide, flatShading: true
  }));
  m.position.y = 0.0055;
  m.castShadow = true; m.receiveShadow = true;
  lotus.add(m);

  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(0.0305, 20),
    new THREE.MeshStandardMaterial({ color: 0xd7899f, roughness: 0.95, side: THREE.DoubleSide })
  );
  disc.rotation.x = Math.PI * 0.5;
  disc.position.y = 0.0009;
  disc.receiveShadow = true;
  lotus.add(disc);
}

/* ------------------------------------------------------------------ *
 *  Centre & scale the single object nicely above the ground
 * ------------------------------------------------------------------ */
lotus.position.y = 0.001;

/* ------------------------------------------------------------------ *
 *  Loop
 * ------------------------------------------------------------------ */
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
}
window.addEventListener('resize', onResize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
