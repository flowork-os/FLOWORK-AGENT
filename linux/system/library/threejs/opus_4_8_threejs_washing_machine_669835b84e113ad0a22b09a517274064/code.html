<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Front-Loading Washing Machine — three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15171a; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: rgba(255,255,255,0.45); letter-spacing: .3px; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="hint">drag to orbit · scroll to zoom</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const TWO_PI = Math.PI * 2;

/* ---------------------------------------------------------------- renderer */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ------------------------------------------------------------------- scene */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171a);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ camera */
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(0.98, 0.5, 1.28);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.target.set(0, 0.0, 0);
controls.minDistance = 0.9;
controls.maxDistance = 3.2;
controls.maxPolarAngle = Math.PI * 0.52;

/* ------------------------------------------------------------------ lights */
scene.add(new THREE.HemisphereLight(0xcdd8e6, 0x1a1c1f, 0.55));

const key = new THREE.DirectionalLight(0xffffff, 2.5);
key.position.set(1.5, 2.2, 1.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 8;
key.shadow.camera.left = -0.9;
key.shadow.camera.right = 0.9;
key.shadow.camera.top = 0.9;
key.shadow.camera.bottom = -0.9;
key.shadow.bias = -0.0002;
key.shadow.normalBias = 0.02;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd0e8, 0.55);
fill.position.set(-1.6, 0.8, 1.1);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xdfe8ff, 1.4);
rim.position.set(-0.6, 1.1, -1.8);
scene.add(rim);

/* ------------------------------------------------------------------- floor */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.45;
floor.receiveShadow = true;
scene.add(floor);

/* --------------------------------------------------------------- materials */
const whiteMat = new THREE.MeshPhysicalMaterial({
  color: 0xf1f2f0, roughness: 0.42, metalness: 0.0,
  clearcoat: 0.7, clearcoatRoughness: 0.32, envMapIntensity: 0.9
});
const steelMat = new THREE.MeshStandardMaterial({
  color: 0xbcc2c7, metalness: 1.0, roughness: 0.28, envMapIntensity: 1.1
});
const darkSteelMat = new THREE.MeshStandardMaterial({
  color: 0x2c2f33, metalness: 0.85, roughness: 0.38, envMapIntensity: 1.0
});
const rubberMat = new THREE.MeshStandardMaterial({
  color: 0x171819, metalness: 0.0, roughness: 0.95
});
const knobMat = new THREE.MeshStandardMaterial({
  color: 0x26292c, metalness: 0.55, roughness: 0.4
});
const pointerMat = new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.5 });
const grooveMat = new THREE.MeshStandardMaterial({ color: 0x9ea2a4, metalness: 0.2, roughness: 0.7 });
const slotMat = new THREE.MeshStandardMaterial({ color: 0x131415, metalness: 0.2, roughness: 0.7 });
const displayMat = new THREE.MeshPhysicalMaterial({
  color: 0x05070a, roughness: 0.12, metalness: 0.2,
  clearcoat: 1.0, clearcoatRoughness: 0.06,
  emissive: 0x08202f, emissiveIntensity: 0.5
});
const displayLitMat = new THREE.MeshStandardMaterial({
  color: 0x9fe4ff, emissive: 0x4fc6ff, emissiveIntensity: 1.4, roughness: 0.5
});
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0x2b3b40, metalness: 0.0, roughness: 0.05,
  transmission: 0.88, transparent: true, thickness: 0.06, ior: 1.5,
  attenuationColor: 0x1e2c30, attenuationDistance: 0.35,
  clearcoat: 1.0, clearcoatRoughness: 0.04, envMapIntensity: 1.4
});

/* ---------------------------------------------------------- washer assembly */
const washer = new THREE.Group();
scene.add(washer);

const BODY_W = 0.60, BODY_H = 0.85, BODY_D = 0.60;
const FRONT = BODY_D / 2;               // z of the front face
const g = grooveMat;

// body
const body = new THREE.Mesh(new RoundedBoxGeometry(BODY_W, BODY_H, BODY_D, 6, 0.02), whiteMat);
washer.add(body);

// overhanging worktop
const top = new THREE.Mesh(new RoundedBoxGeometry(BODY_W + 0.02, 0.02, BODY_D + 0.02, 4, 0.007), whiteMat);
top.position.y = BODY_H / 2 - 0.01;
washer.add(top);

// feet
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.026, 0.025, 20), darkSteelMat);
  foot.position.set(sx * 0.24, -BODY_H / 2 - 0.0125, sz * 0.24);
  washer.add(foot);
}

/* ---- helper: thin surface groove / line ---- */
function line(w, h, x, y, mat = grooveMat, z = FRONT + 0.0006) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.003), mat);
  m.position.set(x, y, z);
  washer.add(m);
  return m;
}

/* ---------------------------------------------------- top strip breaklines */
line(0.58, 0.0035, 0.0, 0.408);   // under worktop
line(0.58, 0.0035, 0.0, 0.288);   // bottom of control strip
line(0.0035, 0.120, 0.0, 0.348);  // between drawer & panel

/* --------------------------------------------------- detergent drawer (left) */
const drawer = new THREE.Mesh(new RoundedBoxGeometry(0.22, 0.09, 0.035, 4, 0.006), whiteMat);
drawer.position.set(-0.14, 0.352, FRONT + 0.0075);
washer.add(drawer);
// seam near the top of the drawer face
const drawerSeam = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.0035, 0.004), grooveMat);
drawerSeam.position.set(-0.14, 0.388, FRONT + 0.0255);
washer.add(drawerSeam);
// finger recess along the bottom
const drawerGrip = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.014, 0.012), slotMat);
drawerGrip.position.set(-0.14, 0.320, FRONT + 0.024);
washer.add(drawerGrip);

/* --------------------------------------------------- control panel (right) */
const display = new THREE.Mesh(new RoundedBoxGeometry(0.10, 0.05, 0.008, 4, 0.004), displayMat);
display.position.set(0.06, 0.375, FRONT + 0.004);
washer.add(display);
const seg = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.013, 0.002), displayLitMat);
seg.position.set(0.06, 0.375, FRONT + 0.0095);
washer.add(seg);

// small indicator buttons
for (let i = 0; i < 3; i++) {
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.006, 16), knobMat);
  b.rotation.x = Math.PI / 2;
  b.position.set(0.028 + i * 0.032, 0.342, FRONT + 0.003);
  washer.add(b);
}

// rotary knobs
function makeKnob(r, x, y) {
  const grp = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(r * 1.08, r * 1.08, 0.006, 40), steelMat);
  base.rotation.x = Math.PI / 2; base.position.z = 0.003;
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.78, r * 0.94, 0.022, 40), knobMat);
  cap.rotation.x = Math.PI / 2; cap.position.z = 0.017;
  const face = new THREE.Mesh(new THREE.CircleGeometry(r * 0.78, 40), knobMat);
  face.position.z = 0.028;
  const ptr = new THREE.Mesh(new THREE.BoxGeometry(0.0045, r * 0.55, 0.0045), pointerMat);
  ptr.position.set(0, r * 0.32, 0.029);
  grp.add(base, cap, face, ptr);
  grp.position.set(x, y, FRONT);
  washer.add(grp);
  return grp;
}
makeKnob(0.020, 0.15, 0.368);
makeKnob(0.030, 0.238, 0.362);

/* -------------------------------------------------------------- door group */
const door = new THREE.Group();
door.position.set(0, -0.03, FRONT);   // local +z points outward from the machine
washer.add(door);

// gap groove around the door
const surround = new THREE.Mesh(new THREE.RingGeometry(0.228, 0.235, 72), grooveMat);
surround.position.set(0, -0.03, FRONT + 0.0007);
washer.add(surround);

// door frame (ring built from primitives — front face + outer & inner walls)
const R_IN = 0.15, R_OUT = 0.225, D_DEPTH = 0.05;
const frontRing = new THREE.Mesh(new THREE.RingGeometry(R_IN, R_OUT, 72), whiteMat);
frontRing.position.z = D_DEPTH;
const outerWall = new THREE.Mesh(new THREE.CylinderGeometry(R_OUT, R_OUT, D_DEPTH, 72, 1, true), whiteMat);
outerWall.rotation.x = Math.PI / 2; outerWall.position.z = D_DEPTH / 2;
const innerWall = new THREE.Mesh(new THREE.CylinderGeometry(R_IN, R_IN, D_DEPTH, 72, 1, true), whiteMat);
innerWall.material = whiteMat.clone(); innerWall.material.side = THREE.DoubleSide;
innerWall.rotation.x = Math.PI / 2; innerWall.position.z = D_DEPTH / 2;
outerWall.material = whiteMat.clone(); outerWall.material.side = THREE.DoubleSide;
door.add(frontRing, outerWall, innerWall);

// chrome trim ring at the glass edge
const trim = new THREE.Mesh(new THREE.TorusGeometry(0.148, 0.007, 16, 80), steelMat);
trim.position.z = D_DEPTH - 0.004;
door.add(trim);

// rubber gasket (bellows) at the drum mouth — seen through the glass
const gasket = new THREE.Mesh(new THREE.TorusGeometry(0.145, 0.017, 20, 80), rubberMat);
gasket.position.z = 0.022;
door.add(gasket);
const gasketInner = new THREE.Mesh(new THREE.TorusGeometry(0.128, 0.011, 18, 72), rubberMat);
gasketInner.position.z = 0.014;
door.add(gasketInner);

// recessed drum interior (kept in front of the body face so it reads as a cavity)
const drumWall = new THREE.Mesh(
  new THREE.CylinderGeometry(0.147, 0.147, 0.034, 64, 1, true), darkSteelMat.clone());
drumWall.material.side = THREE.DoubleSide;
drumWall.rotation.x = Math.PI / 2; drumWall.position.z = 0.023;
door.add(drumWall);
const drumBack = new THREE.Mesh(new THREE.CircleGeometry(0.15, 64), darkSteelMat);
drumBack.position.z = 0.006;
door.add(drumBack);
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.012, 28), steelMat);
hub.rotation.x = Math.PI / 2; hub.position.z = 0.012;
door.add(hub);
// concentric drum rings
for (const rr of [0.055, 0.095, 0.13]) {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(rr, 0.0025, 8, 80), steelMat);
  ring.position.z = 0.008;
  door.add(ring);
}
// drum lifter paddles
for (let i = 0; i < 3; i++) {
  const a = i * (TWO_PI / 3) + 0.5;
  const pad = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.016, 0.022), darkSteelMat);
  pad.position.set(Math.cos(a) * 0.09, Math.sin(a) * 0.09, 0.02);
  pad.rotation.z = a;
  door.add(pad);
}

// convex tinted glass (ellipsoid that bulges out and slightly into the drum)
const glass = new THREE.Mesh(new THREE.SphereGeometry(0.136, 56, 40), glassMat);
glass.scale.set(1, 1, 0.30);
glass.position.z = 0.028;
glass.renderOrder = 2;
door.add(glass);

// hinge (left side)
for (const sy of [-1, 1]) {
  const knuckle = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.06, 20), steelMat);
  knuckle.position.set(-0.233, sy * 0.075, 0.026);
  door.add(knuckle);
}
const hingePin = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.20, 16), darkSteelMat);
hingePin.position.set(-0.233, 0, 0.026);
door.add(hingePin);
const hingeArmTop = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.02, 0.03), steelMat);
hingeArmTop.position.set(-0.213, 0.075, 0.026);
door.add(hingeArmTop);
const hingeArmBot = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.02, 0.03), steelMat);
hingeArmBot.position.set(-0.213, -0.075, 0.026);
door.add(hingeArmBot);

// pull handle (right side)
const handle = new THREE.Mesh(new RoundedBoxGeometry(0.022, 0.11, 0.03, 4, 0.008), whiteMat);
handle.position.set(0.206, 0, 0.05);
door.add(handle);
const handleSlot = new THREE.Mesh(new THREE.BoxGeometry(0.028, 0.10, 0.02), slotMat);
handleSlot.position.set(0.20, 0, 0.028);
door.add(handleSlot);

/* --------------------------------------------------- shadows on all solids */
washer.traverse((o) => {
  if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
});
glass.castShadow = false;      // transparent glass shouldn't cast a hard shadow
surround.castShadow = false;

/* ----------------------------------------------------------------- resize  */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

/* ------------------------------------------------------------------- loop  */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
