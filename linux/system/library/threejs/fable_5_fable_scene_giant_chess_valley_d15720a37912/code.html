<!DOCTYPE html>
<html lang="en">

<title>Giant Chess Valley</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#c99a6e}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================ config / palette ================================ */
const PAL = {
  fog:      0xd8b394,                       // dusty golden haze
  skyTop:   '#4a5d8c', skyMid: '#8a7ba6', skyRose: '#d89a7a', skyHorizon: '#f2c37c',
  ivory:    '#e6dac4', ivoryVein: 'rgba(150,130,100,0.5)',
  onyx:     '#4b4f4a', onyxVein:  'rgba(20,24,20,0.6)',
  squareLight: '#cdbb96', squareDark: '#4e463c',
  moss:     0x4c6b34, mossDeep: 0x36512a, vine: 0x3d5c2e,
  sediment: '#b98f63', strata: ['#c59a6b', '#a97b4e', '#8a5f3e', '#c2a075', '#9c6f47'],
  sun:      0xffd9a0, dust: 0xffd9a0, bird: 0x2e2620
};
const SQ = 6, BOARD_Y = 0.8;                // colossal squares, plinth top height
const sqPos = (c, r) => new THREE.Vector3(-21 + c * SQ, BOARD_Y, -21 + r * SQ);
const DUST_N = 260;

/* ================================ prng / helpers ================================ */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const prng = mulberry32(64460640);
const rand = (a, b) => a + prng() * (b - a);
const pick = arr => arr[Math.floor(prng() * arr.length)];
const dummy = new THREE.Object3D();
function shadowed(root){
  root.traverse(o => { if (o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  return root;
}
function lathe(profile, mat, seg = 28){
  const pts = profile.map(p => new THREE.Vector2(p[0], p[1]));
  return new THREE.Mesh(new THREE.LatheGeometry(pts, seg), mat);
}

/* ================================ canvas textures ================================ */
function canvasTexture(w, h, painter, rx = 1, ry = 1){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  painter(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function veinedStone(base, vein){                       // shared marble painter
  return (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 70; i++){                       // stains and pitting
      g.fillStyle = prng() < 0.5 ? 'rgba(90,75,55,0.16)' : 'rgba(240,235,220,0.10)';
      g.beginPath(); g.arc(rand(0, w), rand(0, h), rand(4, 26), 0, 7); g.fill();
    }
    g.strokeStyle = vein;
    for (let i = 0; i < 16; i++){                       // marble veins
      g.lineWidth = rand(0.6, 2.2);
      let x = rand(0, w), y = rand(0, h);
      g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < 4; k++){ x += rand(-40, 40); y += rand(14, 46); g.lineTo(x, y); }
      g.stroke();
    }
    g.strokeStyle = 'rgba(30,25,18,0.55)'; g.lineWidth = 1.4;
    for (let i = 0; i < 5; i++){                        // weather cracks
      let x = rand(0, w), y = rand(0, h);
      g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < 5; k++){ x += rand(-24, 24); y += rand(10, 30); g.lineTo(x, y); }
      g.stroke();
    }
  };
}
const ivoryTex = canvasTexture(256, 256, veinedStone(PAL.ivory, PAL.ivoryVein), 1, 2);
const onyxTex  = canvasTexture(256, 256, veinedStone(PAL.onyx, PAL.onyxVein), 1, 2);
function paintSquare(g, x, y, s, dark){                 // one weathered board square
  g.fillStyle = dark ? PAL.squareDark : PAL.squareLight; g.fillRect(x, y, s, s);
  for (let i = 0; i < 26; i++){                         // stone mottling
    g.fillStyle = dark ? 'rgba(30,26,20,0.35)' : 'rgba(120,100,70,0.22)';
    g.beginPath(); g.arc(x + rand(0, s), y + rand(0, s), rand(2, 12), 0, 7); g.fill();
  }
  if (dark) for (let i = 0; i < 30; i++){               // moss reclaiming dark squares
    g.fillStyle = pick(['rgba(76,107,52,0.55)', 'rgba(54,81,42,0.6)', 'rgba(96,128,60,0.4)']);
    const mx = x + rand(0, s), my = y + rand(0, s);
    g.beginPath(); g.arc(mx, my, rand(3, 14), 0, 7); g.fill();
  }
  g.strokeStyle = 'rgba(25,20,14,0.7)'; g.lineWidth = 3; g.strokeRect(x + 1, y + 1, s - 2, s - 2);
  if (prng() < 0.5){                                    // hairline fracture
    g.strokeStyle = 'rgba(20,16,12,0.6)'; g.lineWidth = 1.6;
    let cx = x + rand(0, s), cy = y;
    g.beginPath(); g.moveTo(cx, cy);
    for (let k = 0; k < 4; k++){ cx += rand(-22, 22); cy += s / 4; g.lineTo(cx, cy); }
    g.stroke();
  }
}
const boardTex = canvasTexture(1024, 1024, (g, w) => {
  const s = w / 8;
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) paintSquare(g, c * s, r * s, s, (r + c) % 2 === 1);
  g.strokeStyle = 'rgba(15,12,8,0.5)'; g.lineWidth = 5;  // one great diagonal fracture
  g.beginPath(); g.moveTo(w * 0.1, w * 0.85); g.lineTo(w * 0.45, w * 0.55); g.lineTo(w * 0.62, w * 0.32); g.stroke();
});
const sedimentTex = canvasTexture(512, 512, (g, w, h) => {
  g.fillStyle = PAL.sediment; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 480; i++){
    g.fillStyle = pick(['rgba(140,100,60,0.3)', 'rgba(200,170,120,0.3)', 'rgba(110,80,50,0.28)', 'rgba(170,130,85,0.3)']);
    g.beginPath(); g.ellipse(rand(0, w), rand(0, h), rand(3, 26), rand(2, 9), rand(0, 3), 0, 7); g.fill();
  }
  for (let i = 0; i < 700; i++){
    g.fillStyle = prng() < 0.5 ? 'rgba(80,55,35,0.5)' : 'rgba(220,190,140,0.5)';
    g.fillRect(rand(0, w), rand(0, h), 2, 2);
  }
}, 22, 22);
const strataTex = canvasTexture(256, 256, (g, w, h) => {  // banded mesa rock
  let y = 0;
  while (y < h){
    const bh = rand(10, 30);
    g.fillStyle = pick(PAL.strata); g.fillRect(0, y, w, bh);
    g.fillStyle = 'rgba(60,38,22,0.25)'; g.fillRect(0, y + bh - 3, w, 3);
    y += bh;
  }
  for (let i = 0; i < 240; i++){
    g.fillStyle = prng() < 0.5 ? 'rgba(70,45,28,0.3)' : 'rgba(230,200,150,0.25)';
    g.fillRect(rand(0, w), rand(0, h), rand(2, 10), rand(1, 4));
  }
}, 2, 1);
const skyTex = canvasTexture(64, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0.00, PAL.skyTop); gr.addColorStop(0.42, PAL.skyMid);
  gr.addColorStop(0.66, PAL.skyRose); gr.addColorStop(0.85, PAL.skyHorizon);
  gr.addColorStop(1.00, '#caa06f');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
const glowTex = canvasTexture(64, 64, (g, s) => {
  const gr = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.45, 'rgba(255,255,255,0.4)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, s, s);
});
const glyphTex = canvasTexture(256, 256, (g, w, h) => {  // carved score-keeping stones
  veinedStone('#a68b62', 'rgba(90,65,40,0.5)')(g, w, h);
  g.strokeStyle = 'rgba(55,38,22,0.85)'; g.lineWidth = 5; g.lineCap = 'round';
  for (let r = 0; r < 5; r++) for (let c = 0; c < 4; c++){
    const x = 26 + c * 56, y = 26 + r * 46, kind = Math.floor(rand(0, 4));
    g.beginPath();
    if (kind === 0) g.rect(x, y, 26, 26);
    else if (kind === 1) g.arc(x + 13, y + 13, 13, 0, 7);
    else if (kind === 2){ g.moveTo(x, y + 26); g.lineTo(x + 13, y); g.lineTo(x + 26, y + 26); }
    else { g.moveTo(x, y + 26); g.lineTo(x, y + 8); g.lineTo(x + 20, y); g.lineTo(x + 20, y + 26); }
    g.stroke();
  }
});
const squareSlab = dark => canvasTexture(128, 128, g => paintSquare(g, 0, 0, 128, dark));
const slabDarkTex = squareSlab(true), slabLightTex = squareSlab(false);

/* ================================ materials ================================ */
const MAT = {
  ivory: new THREE.MeshStandardMaterial({ map: ivoryTex, roughness: 0.6 }),
  onyx:  new THREE.MeshStandardMaterial({ map: onyxTex, roughness: 0.7 }),
  board: new THREE.MeshStandardMaterial({ map: boardTex, roughness: 0.9 }),
  plinth:new THREE.MeshStandardMaterial({ color: 0x9a8567, roughness: 0.95 }),
  floor: new THREE.MeshStandardMaterial({ map: sedimentTex, roughness: 1 }),
  mesa:  new THREE.MeshStandardMaterial({ map: strataTex, roughness: 1, flatShading: true }),
  moss:  new THREE.MeshStandardMaterial({ color: PAL.moss, roughness: 1 }),
  mossDeep: new THREE.MeshStandardMaterial({ color: PAL.mossDeep, roughness: 1 }),
  vine:  new THREE.MeshStandardMaterial({ color: PAL.vine, roughness: 0.9 }),
  leaf:  new THREE.MeshStandardMaterial({ color: 0x5c7d3a, roughness: 0.9, side: THREE.DoubleSide }),
  earth: new THREE.MeshStandardMaterial({ color: 0x7a5c3b, roughness: 1 }),
  grass: new THREE.MeshStandardMaterial({ color: 0xb8a05e, roughness: 1 }),
  bird:  new THREE.MeshBasicMaterial({ color: PAL.bird, side: THREE.DoubleSide }),
  sun:   new THREE.MeshBasicMaterial({ color: 0xfff2cc, fog: false }),
  glyph: new THREE.MeshStandardMaterial({ map: glyphTex, roughness: 1 }),
  slabDark:  new THREE.MeshStandardMaterial({ map: slabDarkTex, roughness: 0.9 }),
  slabLight: new THREE.MeshStandardMaterial({ map: slabLightTex, roughness: 0.9 }),
  weed:  new THREE.MeshStandardMaterial({ color: 0x8a6f42, roughness: 1, wireframe: true })
};
const FX = { wings: [], flocks: [], fogBanks: [] };     // animation registry

/* ================================ builders: chess pieces ================================ */
function buildPawn(mat){
  const g = new THREE.Group();
  g.add(lathe([[0,0],[1.25,0],[1.3,0.18],[1.05,0.5],[0.62,0.9],[0.5,1.5],[0.42,2.1],[0.75,2.3],
    [0.42,2.5],[0.62,2.85],[0.78,3.15],[0.72,3.5],[0.45,3.85],[0.15,4.05],[0,4.15]], mat));
  return shadowed(g);
}
function buildRook(mat){
  const g = new THREE.Group();
  g.add(lathe([[0,0],[1.55,0],[1.6,0.25],[1.3,0.6],[1.05,1.0],[0.92,2.2],[0.88,3.4],[1.1,3.8],
    [1.3,4.0],[1.3,4.55],[1.12,4.65],[0,4.65]], mat));
  for (let i = 0; i < 5; i++){                          // crenellations
    const a = i / 5 * Math.PI * 2;
    const tooth = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.75, 0.4), mat);
    tooth.position.set(Math.cos(a) * 0.98, 4.95, Math.sin(a) * 0.98);
    tooth.rotation.y = -a + Math.PI / 2; g.add(tooth);
  }
  return shadowed(g);
}
function buildBishop(mat){
  const g = new THREE.Group();
  g.add(lathe([[0,0],[1.4,0],[1.45,0.22],[1.15,0.55],[0.8,0.9],[0.6,1.4],[0.5,2.6],[0.45,3.6],
    [0.82,3.9],[0.5,4.15],[0.74,4.55],[0.66,5.05],[0.4,5.5],[0.12,5.8],[0,5.85]], mat));
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 8), mat);
  tip.position.y = 5.95; g.add(tip);
  return shadowed(g);
}
function buildQueenBody(mat){
  return lathe([[0,0],[1.5,0],[1.55,0.25],[1.2,0.6],[0.9,1.0],[0.62,1.8],[0.5,3.2],[0.46,4.6],
    [0.92,5.3],[1.02,5.6],[0.78,5.8],[0,5.85]], mat);
}
function buildCoronet(mat){                             // spiked crown ring + orb
  const g = new THREE.Group();
  for (let i = 0; i < 8; i++){
    const a = i / 8 * Math.PI * 2;
    const spike = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.7, 6), mat);
    spike.position.set(Math.cos(a) * 0.72, 0.25, Math.sin(a) * 0.72);
    spike.rotation.set(Math.sin(a) * 0.35, 0, -Math.cos(a) * 0.35); g.add(spike);
  }
  const orb = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 8), mat);
  orb.position.y = 0.42; g.add(orb);
  return g;
}
function buildQueen(mat){
  const g = new THREE.Group();
  g.add(buildQueenBody(mat));
  const crown = buildCoronet(mat); crown.position.y = 5.85; g.add(crown);
  return shadowed(g);
}
function buildKing(mat){
  const g = new THREE.Group();
  g.add(lathe([[0,0],[1.6,0],[1.65,0.25],[1.25,0.65],[0.95,1.1],[0.65,2.0],[0.52,3.8],[0.48,5.2],
    [0.95,6.0],[1.05,6.3],[0.72,6.55],[0.55,6.75],[0,6.8]], mat));
  const cross = new THREE.Group();
  const v = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.05, 0.22), mat); v.position.y = 0.5; cross.add(v);
  const hbar = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.22, 0.22), mat); hbar.position.y = 0.62; cross.add(hbar);
  cross.position.y = 6.75; g.add(cross);
  return shadowed(g);
}
function buildKnight(mat){                              // pedestal + carved horse silhouette
  const g = new THREE.Group();
  g.add(lathe([[0,0],[1.55,0],[1.6,0.22],[1.3,0.5],[1.1,0.85],[1.05,1.25],[1.2,1.45],[1.05,1.6],[0,1.65]], mat));
  const chest = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.5, 1.9), mat);
  chest.position.set(0, 2.75, -0.1); chest.rotation.x = 0.16; g.add(chest);
  const skull = new THREE.Mesh(new THREE.BoxGeometry(1.05, 1.05, 2.0), mat);
  skull.position.set(0, 4.35, 0.55); skull.rotation.x = -0.4; g.add(skull);
  const muzzle = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.72, 1.05), mat);
  muzzle.position.set(0, 3.98, 1.42); muzzle.rotation.x = -0.42; g.add(muzzle);
  for (const sx of [-1, 1]){
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.55, 5), mat);
    ear.position.set(sx * 0.28, 5.05, 0.02); ear.rotation.x = -0.25; g.add(ear);
  }
  for (let i = 0; i < 3; i++){                          // mane ridge down the neck
    const tuft = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.95 - i * 0.18, 0.55), mat);
    tuft.position.set(0, 4.55 - i * 0.75, -0.75 - i * 0.28); tuft.rotation.x = 0.35; g.add(tuft);
  }
  return shadowed(g);
}

/* ================================ builders: vines, mounds, mesas, birds ================================ */
function makeVine(points, leafCount){
  const g = new THREE.Group();
  const curve = new THREE.CatmullRomCurve3(points);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 48, 0.07, 5), MAT.vine);
  tube.castShadow = true; g.add(tube);
  const leaves = new THREE.InstancedMesh(new THREE.CircleGeometry(0.24, 5), MAT.leaf, leafCount);
  for (let i = 0; i < leafCount; i++){
    const p = curve.getPoint(rand(0.05, 0.98));
    dummy.position.copy(p).add(new THREE.Vector3(rand(-0.12, 0.12), rand(0, 0.14), rand(-0.12, 0.12)));
    dummy.rotation.set(rand(-1.4, -0.4), rand(0, 6.28), rand(-0.4, 0.4));
    dummy.scale.setScalar(rand(0.7, 1.5)); dummy.updateMatrix();
    leaves.setMatrixAt(i, dummy.matrix);
  }
  leaves.castShadow = true; g.add(leaves);
  return g;
}
function helixOver(cx, cy, cz, axis, len, radius, turns){ // vine path wrapping a lying piece
  const pts = [], n1 = new THREE.Vector3(0, 1, 0), a = axis.clone().normalize();
  const n2 = new THREE.Vector3().crossVectors(a, n1).normalize();
  for (let i = 0; i <= 10; i++){
    const t = i / 10, th = t * turns * Math.PI * 2 + rand(-0.15, 0.15);
    pts.push(new THREE.Vector3(cx, cy, cz)
      .addScaledVector(a, (t - 0.5) * len)
      .addScaledVector(n1, Math.max(Math.sin(th), -0.25) * radius)
      .addScaledVector(n2, Math.cos(th) * radius));
  }
  return pts;
}
function buildMound(w, h, mat){                         // earth / moss heap
  const m = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), mat);
  m.scale.set(w, h, w * rand(0.8, 1.1)); m.rotation.y = rand(0, 6.28);
  m.castShadow = m.receiveShadow = true;
  return m;
}
function buildMesa(r, h){                               // stacked strata butte + talus skirt
  const g = new THREE.Group();
  let y = 0, rr = r;
  for (let i = 0; i < 3; i++){
    const bh = h * [0.5, 0.32, 0.18][i];
    const band = new THREE.Mesh(new THREE.CylinderGeometry(rr * rand(0.82, 0.9), rr, bh, 9), MAT.mesa);
    band.position.y = y + bh / 2; band.rotation.y = rand(0, 6.28); g.add(band);
    y += bh; rr *= rand(0.78, 0.88);
  }
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(rr * 0.9, rr, h * 0.06, 9), MAT.mesa);
  cap.position.y = y; g.add(cap);
  const talus = new THREE.Mesh(new THREE.ConeGeometry(r * 1.45, h * 0.36, 10), MAT.floor);
  talus.position.y = h * 0.15; g.add(talus);
  return g;
}
function buildFlock(cx, cy, cz, r, speed){
  const flock = new THREE.Group(); flock.position.set(cx, cy, cz);
  for (let i = 0; i < 5; i++){
    const a = i / 5 * Math.PI * 2 + rand(-0.3, 0.3);
    const bird = new THREE.Group();
    bird.position.set(Math.cos(a) * r, rand(-1.2, 1.2), Math.sin(a) * r);
    bird.rotation.y = -a;
    for (const sx of [-1, 1]){
      const wing = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 0.26), MAT.bird);
      wing.position.x = sx * 0.45; wing.rotation.z = sx * 0.4;
      bird.add(wing); FX.wings.push({ mesh: wing, side: sx, ph: a * 3 });
    }
    flock.add(bird);
  }
  FX.flocks.push({ group: flock, speed, ph: rand(0, 6.28) });
  return flock;
}
function buildArch(){                                   // ruined ceremonial gateway
  const g = new THREE.Group();
  for (const sx of [-1, 1]){
    const pylon = new THREE.Group();
    let y = 0, w = 3.6;
    for (let i = 0; i < 3; i++){                        // weathered drum courses
      const bh = [5.2, 4.2, 2.6][i];
      const block = new THREE.Mesh(new THREE.BoxGeometry(w, bh, w * 0.85), MAT.mesa);
      block.position.y = y + bh / 2; block.rotation.y = rand(-0.05, 0.05); pylon.add(block);
      y += bh; w *= 0.88;
    }
    const capital = new THREE.Mesh(new THREE.BoxGeometry(w * 1.35, 0.8, w * 1.2), MAT.plinth);
    capital.position.y = y + 0.4; pylon.add(capital);
    pylon.position.x = sx * 7.2; pylon.rotation.z = sx * -0.03; g.add(pylon);
  }
  const lintel = new THREE.Mesh(new THREE.BoxGeometry(9.5, 1.5, 2.6), MAT.plinth);
  lintel.position.set(-2.6, 13.3, 0); lintel.rotation.z = 0.06; g.add(lintel);  // surviving half-span
  const snapped = new THREE.Mesh(new THREE.BoxGeometry(5.4, 1.4, 2.5), MAT.plinth);
  snapped.position.set(4.6, 0.9, 1.6); snapped.rotation.set(0.1, 0.5, 0.12); g.add(snapped);
  g.add(makeVine([ new THREE.Vector3(-8.6, 0.1, 1.4), new THREE.Vector3(-7.9, 3.4, 1.6),
    new THREE.Vector3(-6.6, 6.8, 0.8), new THREE.Vector3(-7.2, 10.2, -0.4), new THREE.Vector3(-6.2, 12.6, 0.2) ], 26));
  return shadowed(g);
}
function buildMonolith(h, lean){                        // carved tally-stone
  const g = new THREE.Group();
  const stone = new THREE.Mesh(new THREE.BoxGeometry(2.3, h, 1.5), MAT.glyph);
  stone.position.y = h / 2 - 0.4; stone.rotation.z = lean; g.add(stone);
  const foot = new THREE.Mesh(new THREE.DodecahedronGeometry(1.1), MAT.plinth);
  foot.scale.y = 0.5; foot.position.y = 0.1; g.add(foot);
  return shadowed(g);
}
function buildTumbleweed(radius){
  const geo = new THREE.IcosahedronGeometry(radius, 1);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++){                  // ruffle the twig ball
    const k = 1 + rand(-0.25, 0.25);
    pos.setXYZ(i, pos.getX(i) * k, pos.getY(i) * k, pos.getZ(i) * k);
  }
  const m = new THREE.Mesh(geo, MAT.weed);
  m.castShadow = true;
  return m;
}

/* ================================ scene / renderer / camera ================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc99a6e);
scene.fog = new THREE.Fog(PAL.fog, 70, 235);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 620);
camera.position.set(40, 23, 48);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.6, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.autoRotate = true; controls.autoRotateSpeed = 0.75;
controls.minDistance = 26; controls.maxDistance = 92;
controls.maxPolarAngle = 1.4;

/* ================================ assembly: valley, board, mesas ================================ */
const sky = new THREE.Mesh(new THREE.SphereGeometry(270, 32, 20),
  new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, fog: false }));
scene.add(sky);
const floor = new THREE.Mesh(new THREE.CircleGeometry(290, 64), MAT.floor);
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const board = new THREE.Mesh(new THREE.BoxGeometry(48, BOARD_Y, 48),
  [MAT.plinth, MAT.plinth, MAT.board, MAT.plinth, MAT.plinth, MAT.plinth]);
board.position.y = BOARD_Y / 2; board.receiveShadow = board.castShadow = true; scene.add(board);
for (let e = 0; e < 4; e++){                            // cracked plinth border frame
  const rail = new THREE.Mesh(new THREE.BoxGeometry(50.6, 1.05, 1.3), MAT.plinth);
  const a = e * Math.PI / 2;
  rail.position.set(Math.sin(a) * 24.65, 0.52, Math.cos(a) * 24.65);
  rail.rotation.y = a; rail.rotation.z = rand(-0.012, 0.012);
  rail.castShadow = rail.receiveShadow = true; scene.add(rail);
}
const mesaSpecs = [ [0.25, 128, 26, 24], [1.15, 118, 20, 30], [2.0, 142, 30, 22], [2.8, 125, 22, 27],
  [3.7, 138, 34, 20], [4.6, 120, 18, 25], [5.4, 146, 28, 18], [5.95, 108, 15, 14] ];
for (const [az, dist, r, h] of mesaSpecs){
  const mesa = buildMesa(r, h);
  mesa.position.set(Math.cos(az) * dist, 0, Math.sin(az) * dist);
  scene.add(mesa);
}

/* ================================ assembly: the abandoned middlegame ================================ */
function place(g, c, r, ry = 0, lean = 0){
  g.position.copy(sqPos(c, r)); g.rotation.y = ry; g.rotation.z = lean;
  scene.add(g); return g;
}
// dark army holds the north board
place(buildKing(MAT.onyx), 4, 0, 0, 0.015);
place(buildRook(MAT.onyx), 0, 0, 0, 0.06);
place(buildBishop(MAT.onyx), 5, 1, 0, -0.03);
place(buildKnight(MAT.onyx), 2, 1, 0.25);
place(buildPawn(MAT.onyx), 4, 2); place(buildPawn(MAT.onyx), 6, 2, 1.2, 0.04); place(buildPawn(MAT.onyx), 1, 3, 2.4);
// ivory army answers from the south
place(buildKing(MAT.ivory), 3, 7, Math.PI, -0.02);
place(buildQueen(MAT.ivory), 5, 5, Math.PI, 0.03);
place(buildRook(MAT.ivory), 7, 7, 0, -0.05);
place(buildBishop(MAT.ivory), 6, 6, Math.PI);
place(buildPawn(MAT.ivory), 3, 5); place(buildPawn(MAT.ivory), 0, 5, 0.8); place(buildPawn(MAT.ivory), 2, 6, 0, 0.05);
// toppled onyx queen, snapped at the neck, crown rolled free
const fallenQueen = new THREE.Group();
const fqBody = buildQueenBody(MAT.onyx); fqBody.rotation.z = -Math.PI / 2 + 0.06; fqBody.castShadow = fqBody.receiveShadow = true;
fqBody.position.set(-2.6, 1.05, 0); fallenQueen.add(fqBody);
const fqCrown = buildCoronet(MAT.onyx); shadowed(fqCrown);
fqCrown.rotation.set(0.4, 0, 2.1); fqCrown.position.set(4.2, 0.62, 1.4); fallenQueen.add(fqCrown);
fallenQueen.position.set(-6, BOARD_Y, 3); fallenQueen.rotation.y = 0.35; scene.add(fallenQueen);
fallenQueen.add(makeVine(helixOver(-1.2, 1.0, 0, new THREE.Vector3(1, 0, 0.1), 5.4, 1.15, 1.6), 26));
// toppled ivory rook, cracked across the drum
const fallenRook = buildRook(MAT.ivory);
fallenRook.rotation.set(Math.PI / 2 - 0.05, 0, 0.6);
fallenRook.position.set(15, BOARD_Y + 1.28, -2.2); scene.add(fallenRook);
const rookVine = makeVine(helixOver(15, BOARD_Y + 1.2, 0.2, new THREE.Vector3(0.05, 0, 1), 6, 1.35, 1.8), 30);
scene.add(rookVine);
// beheaded onyx pawn, its head rolled onto the light square
const fallenPawn = new THREE.Group();
const fpBody = lathe([[0,0],[1.25,0],[1.3,0.18],[1.05,0.5],[0.62,0.9],[0.5,1.5],[0.42,2.1],[0.75,2.3],[0.55,2.45],[0,2.5]], MAT.onyx);
fpBody.rotation.x = Math.PI / 2 - 0.08; fpBody.position.y = 0.9; shadowed(fpBody); fallenPawn.add(fpBody);
const fpHead = new THREE.Mesh(new THREE.SphereGeometry(0.8, 14, 10), MAT.onyx);
fpHead.position.set(1.1, 0.78, 3.4); fpHead.castShadow = fpHead.receiveShadow = true; fallenPawn.add(fpHead);
fallenPawn.position.set(-15, BOARD_Y, 9); fallenPawn.rotation.y = -0.5; scene.add(fallenPawn);
// the fallen knight, half-buried in the valley silt beyond the east rail
const buriedKnight = buildKnight(MAT.ivory);
buriedKnight.rotation.set(0.15, -0.9, -1.42);
buriedKnight.position.set(26.8, 0.9, 12.2); scene.add(buriedKnight);
const drift = buildMound(3.4, 1.5, MAT.earth); drift.position.set(25.7, -0.1, 10.9); scene.add(drift);
const drift2 = buildMound(2.6, 1.1, MAT.moss); drift2.position.set(27.9, -0.05, 13.3); scene.add(drift2);
const drift3 = buildMound(1.8, 0.8, MAT.mossDeep); drift3.position.set(29.1, 0, 11.3); scene.add(drift3);
scene.add(makeVine(helixOver(26.9, 0.8, 12.1, new THREE.Vector3(1, 0.05, 0.5), 7, 1.5, 1.4), 34));
scene.add(makeVine([ new THREE.Vector3(23.8, 0.1, 9.2), new THREE.Vector3(25.5, 0.7, 10.5),
  new THREE.Vector3(27.1, 1.9, 11.7), new THREE.Vector3(28.5, 1.1, 13.1), new THREE.Vector3(29.9, 0.15, 14.1) ], 22));
// captured pieces laid out along the west rail
const capturedPawn = buildPawn(MAT.ivory);
capturedPawn.rotation.set(0, 0.4, Math.PI / 2 - 0.06); capturedPawn.position.set(-28.6, 0.75, -6); scene.add(capturedPawn);
const capturedBishop = buildBishop(MAT.onyx);
capturedBishop.rotation.set(Math.PI / 2 - 0.04, 0, 2.3); capturedBishop.position.set(-29.4, 0.85, 1.5); scene.add(capturedBishop);

/* ================================ assembly: monuments of the valley ================================ */
const slabSpecs = [ [3, 2, true], [2, 7, true], [4, 4, false] ];   // heaved, frost-jacked tiles
for (const [c, r, dark] of slabSpecs){
  const mats = dark ? MAT.slabDark : MAT.slabLight;
  const slab = new THREE.Mesh(new THREE.BoxGeometry(5.7, 0.55, 5.7),
    [MAT.plinth, MAT.plinth, mats, MAT.plinth, MAT.plinth, MAT.plinth]);
  slab.position.copy(sqPos(c, r)); slab.position.y = BOARD_Y + 0.1;
  slab.rotation.set(rand(-0.06, 0.06), 0, rand(0.05, 0.11));
  slab.castShadow = slab.receiveShadow = true; scene.add(slab);
}
const arch = buildArch(); arch.position.set(2, 0, -35); arch.rotation.y = 0.12; scene.add(arch);
const monoYard = new THREE.Group();                     // tally-stones beyond the west rail
monoYard.add(buildMonolith(7.5, 0.05));
const mono2 = buildMonolith(6.2, -0.1); mono2.position.set(4.6, 0, 2.8); mono2.rotation.y = 0.7; monoYard.add(mono2);
const mono3 = buildMonolith(6.8, 0); mono3.rotation.set(0, 1.9, Math.PI / 2 - 0.12);
mono3.position.set(2.2, 0.6, 7.6); monoYard.add(mono3);   // one has toppled face-down
monoYard.position.set(-38, 0, 16); monoYard.rotation.y = 0.5; scene.add(monoYard);
const colossus = buildKing(MAT.onyx);                   // forgotten colossal king, waist-deep in silt
colossus.scale.setScalar(4.4); colossus.rotation.set(0.05, 0.9, 0.4);
colossus.position.set(-80, -7.5, -64); scene.add(colossus);
const colossusDrift = buildMound(16, 4.5, MAT.earth);
colossusDrift.position.set(-76, 0, -60); scene.add(colossusDrift);
FX.weeds = [];
for (let i = 0; i < 3; i++){                            // wind-driven tumbleweeds
  const holder = new THREE.Group(), weed = buildTumbleweed(rand(0.55, 0.9));
  holder.add(weed); scene.add(holder);
  FX.weeds.push({ holder, weed, R: 33 + i * 8, sp: rand(0.05, 0.09) * (i % 2 ? -1 : 1), ph: rand(0, 6.28), r: weed.geometry.parameters.radius });
}

/* ================================ assembly: rubble, moss, grass, sun ================================ */
const chunkSpots = [];                                   // fracture debris near every casualty
for (let i = 0; i < 12; i++) chunkSpots.push([rand(-4, -0.5) - 6, BOARD_Y + 0.2, rand(2, 4.5)]);
for (let i = 0; i < 10; i++) chunkSpots.push([15 + rand(-2.5, 2.5), BOARD_Y + 0.2, -2.2 + rand(-2, 2)]);
for (let i = 0; i < 8; i++)  chunkSpots.push([-15 + rand(-1.5, 2.5), BOARD_Y + 0.15, 9 + rand(-1.5, 2)]);
for (let i = 0; i < 14; i++) chunkSpots.push([rand(24, 31), 0.15, rand(9, 15.5)]);
for (let i = 0; i < 10; i++) chunkSpots.push([2 + rand(-9, 9), 0.18, -35 + rand(-3, 3.5)]);
for (let i = 0; i < 6; i++)  chunkSpots.push([-38 + rand(-4, 5), 0.15, 16 + rand(-3, 5)]);
for (let i = 0; i < 16; i++){ const a = rand(0, 6.28); const d = rand(26, 42); chunkSpots.push([Math.cos(a) * d, 0.14, Math.sin(a) * d]); }
const chunkIM = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1), MAT.plinth, chunkSpots.length);
chunkSpots.forEach((p, i) => {
  dummy.position.set(p[0], p[1], p[2]); dummy.rotation.set(prng() * 3, prng() * 3, prng() * 3);
  dummy.scale.set(rand(0.16, 0.5), rand(0.12, 0.35), rand(0.16, 0.5)); dummy.updateMatrix();
  chunkIM.setMatrixAt(i, dummy.matrix);
});
chunkIM.castShadow = chunkIM.receiveShadow = true; scene.add(chunkIM);
const mossIM = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 6), MAT.moss, 14);   // creeping cushions
const darkSquares = [[1,0],[3,2],[6,3],[2,5],[5,4],[0,7],[7,6],[4,7],[6,7],[0,3]];
for (let i = 0; i < 14; i++){
  let x, z;
  if (i < 10){ const s = sqPos(darkSquares[i][0], darkSquares[i][1]); x = s.x + rand(-1.8, 1.8); z = s.z + rand(-1.8, 1.8); }
  else { x = rand(24, 31); z = rand(9, 16); }           // spillover around the buried knight
  dummy.position.set(x, i < 10 ? BOARD_Y + 0.02 : 0.02, z); dummy.rotation.set(0, rand(0, 6.28), 0);
  dummy.scale.set(rand(0.7, 1.5), rand(0.1, 0.2), rand(0.7, 1.5)); dummy.updateMatrix();
  mossIM.setMatrixAt(i, dummy.matrix);
}
mossIM.receiveShadow = true; scene.add(mossIM);
const grassIM = new THREE.InstancedMesh(new THREE.ConeGeometry(0.14, 1, 4), MAT.grass, 110); // dry bunch-grass
for (let i = 0; i < 110; i++){
  const a = rand(0, 6.28), d = rand(26.5, 62);
  dummy.position.set(Math.cos(a) * d, 0.4, Math.sin(a) * d);
  dummy.rotation.set(rand(-0.25, 0.25), a, rand(-0.25, 0.25));
  dummy.scale.set(1, rand(0.5, 1.6), 1); dummy.updateMatrix();
  grassIM.setMatrixAt(i, dummy.matrix);
}
grassIM.castShadow = true; scene.add(grassIM);
// low sun disc + bloom halo on the horizon line of the light
const sunDir = new THREE.Vector3(55, 16, 20).normalize();
const sunDisc = new THREE.Mesh(new THREE.CircleGeometry(15, 28), MAT.sun);
sunDisc.position.copy(sunDir).multiplyScalar(252); sunDisc.lookAt(0, 0, 0); scene.add(sunDisc);
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: PAL.sun, transparent: true, opacity: 0.75, fog: false, blending: THREE.AdditiveBlending }));
halo.scale.setScalar(120); halo.position.copy(sunDisc.position); scene.add(halo);
FX.halo = halo;

/* ================================ assembly: fog banks, dust, birds ================================ */
for (let i = 0; i < 9; i++){                             // low fog drifting between the pieces
  const bank = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex, color: 0xeeddc4, transparent: true, opacity: rand(0.14, 0.24),
    depthWrite: false, rotation: rand(-0.1, 0.1) }));
  bank.scale.set(rand(17, 30), rand(3.2, 6), 1);
  bank.position.set(rand(-24, 24), rand(1.6, 4.2), -20 + i * 5 + rand(-2, 2));
  scene.add(bank);
  FX.fogBanks.push({ s: bank, bx: bank.position.x, ph: rand(0, 6.28), sp: rand(0.5, 1), o: bank.material.opacity });
}
const dustPos = new Float32Array(DUST_N * 3), dustSeed = [];
for (let i = 0; i < DUST_N; i++){
  dustSeed.push({ x: rand(-34, 34), y: rand(0.6, 13), z: rand(-34, 34), sp: rand(0.25, 0.9), ph: rand(0, 6.28) });
  dustPos.set([dustSeed[i].x, dustSeed[i].y, dustSeed[i].z], i * 3);
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  map: glowTex, color: PAL.dust, size: 0.22, transparent: true, opacity: 0.55,
  depthWrite: false, blending: THREE.AdditiveBlending }));
scene.add(dust);
scene.add(buildFlock(-42, 32, -75, 9, 0.10));
scene.add(buildFlock(58, 36, -32, 7, -0.13));

/* ================================ lighting rig ================================ */
scene.add(new THREE.HemisphereLight(0x9aa8cc, 0x8a6844, 0.55));
const sunLight = new THREE.DirectionalLight(0xffb066, 2.6);   // long, low golden key
sunLight.position.set(55, 16, 20);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(2048, 2048);
sunLight.shadow.camera.left = sunLight.shadow.camera.bottom = -38;
sunLight.shadow.camera.right = sunLight.shadow.camera.top = 38;
sunLight.shadow.camera.far = 190;
sunLight.shadow.bias = -0.0006;
scene.add(sunLight);
const bounce = new THREE.DirectionalLight(0x7a86b8, 0.35);    // cool sky bounce from the shade side
bounce.position.set(-40, 24, -28); scene.add(bounce);
const warmFill = new THREE.PointLight(0xffcf96, 0.6, 90, 2);  // faint valley-floor radiance
warmFill.position.set(0, 10, 0); scene.add(warmFill);

/* ================================ animation loop ================================ */
const clock = new THREE.Clock();
function tick(){
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  for (const b of FX.fogBanks){                          // 1) fog banks sliding between pieces
    b.s.position.x = b.bx + Math.sin(t * 0.05 * b.sp + b.ph) * 9;
    b.s.material.opacity = b.o + Math.sin(t * 0.11 + b.ph) * 0.04;
  }
  for (let i = 0; i < DUST_N; i++){                      // 2) sun-caught dust motes
    const d = dustSeed[i];
    dustPos[i * 3]     = d.x + Math.sin(t * 0.11 * d.sp + d.ph) * 3.5;
    dustPos[i * 3 + 1] = d.y + Math.sin(t * 0.23 * d.sp + d.ph * 2) * 0.9;
    dustPos[i * 3 + 2] = d.z + Math.cos(t * 0.09 * d.sp + d.ph) * 3.5;
  }
  dustGeo.attributes.position.needsUpdate = true;
  for (const f of FX.flocks) f.group.rotation.y = f.ph + t * f.speed;   // 3) wheeling carrion birds
  for (const w of FX.wings) w.mesh.rotation.z = w.side * (0.4 + Math.sin(t * 7 + w.ph) * 0.4);
  for (const tw of FX.weeds){                            // 4) tumbleweeds rolling the perimeter
    const a = tw.ph + t * tw.sp;
    tw.holder.position.set(Math.cos(a) * tw.R, tw.r * 0.85 + Math.abs(Math.sin(t * 2.6 + tw.ph)) * 0.35, Math.sin(a) * tw.R);
    tw.holder.rotation.y = -a;
    tw.weed.rotation.z = -a * tw.R / tw.r;
  }
  FX.halo.material.opacity = 0.72 + Math.sin(t * 0.5) * 0.07;           // 5) sun shimmer breath
  controls.update();
  renderer.render(scene, camera);
}
tick();

/* ================================ resize ================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
