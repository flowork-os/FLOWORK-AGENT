<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portable Generator</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #cbd1d2; }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 22px;
      top: 18px;
      color: #192126;
      font: 600 12px/1.4 system-ui, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
      pointer-events: none;
      opacity: .72;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Portable Generator · 6500W</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xcbd1d2);
    scene.fog = new THREE.Fog(0xcbd1d2, 16, 32);

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(8.6, 5.6, 8.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.75, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.7;
    controls.minDistance = 6;
    controls.maxDistance = 17;
    controls.maxPolarAngle = Math.PI * 0.48;

    const hemi = new THREE.HemisphereLight(0xeaf5ff, 0x3f4137, 2.3);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xfff3db, 4.2);
    key.position.set(6, 10, 7);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -8;
    key.shadow.camera.right = 8;
    key.shadow.camera.top = 8;
    key.shadow.camera.bottom = -8;
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 25;
    key.shadow.bias = -0.0003;
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x8fc3d8, 1.3);
    rim.position.set(-7, 5, -6);
    scene.add(rim);

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0xaeb6b5,
      roughness: 0.92,
      metalness: 0.03
    });
    const ground = new THREE.Mesh(new THREE.CircleGeometry(18, 96), groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const generator = new THREE.Group();
    generator.rotation.y = -0.18;
    scene.add(generator);

    const MAT = {
      frame: new THREE.MeshStandardMaterial({ color: 0x171b1c, roughness: 0.32, metalness: 0.75 }),
      black: new THREE.MeshStandardMaterial({ color: 0x101314, roughness: 0.52, metalness: 0.45 }),
      rubber: new THREE.MeshStandardMaterial({ color: 0x151718, roughness: 0.9, metalness: 0.02 }),
      darkRubber: new THREE.MeshStandardMaterial({ color: 0x090a0a, roughness: 0.96 }),
      engine: new THREE.MeshStandardMaterial({ color: 0x525b5d, roughness: 0.54, metalness: 0.75 }),
      engineDark: new THREE.MeshStandardMaterial({ color: 0x292f30, roughness: 0.46, metalness: 0.78 }),
      aluminum: new THREE.MeshStandardMaterial({ color: 0xb1b9b6, roughness: 0.35, metalness: 0.85 }),
      orange: new THREE.MeshStandardMaterial({ color: 0xd94516, roughness: 0.37, metalness: 0.3 }),
      orangeDark: new THREE.MeshStandardMaterial({ color: 0x8f230c, roughness: 0.46, metalness: 0.36 }),
      panel: new THREE.MeshStandardMaterial({ color: 0x252b2d, roughness: 0.42, metalness: 0.64 }),
      inset: new THREE.MeshStandardMaterial({ color: 0x090b0c, roughness: 0.7 }),
      steel: new THREE.MeshStandardMaterial({ color: 0x7d8585, roughness: 0.32, metalness: 0.9 }),
      brass: new THREE.MeshStandardMaterial({ color: 0xa76c24, roughness: 0.38, metalness: 0.76 }),
      red: new THREE.MeshStandardMaterial({ color: 0xc91d13, roughness: 0.34, metalness: 0.18 }),
      green: new THREE.MeshStandardMaterial({ color: 0x25ae69, roughness: 0.25, emissive: 0x06351c, emissiveIntensity: 0.5 }),
      white: new THREE.MeshStandardMaterial({ color: 0xeee9db, roughness: 0.52 }),
      translucent: new THREE.MeshPhysicalMaterial({
        color: 0xd3e8a2, roughness: 0.18, transmission: 0.35,
        transparent: true, opacity: 0.8
      })
    };

    function shadow(mesh, cast = true, receive = true) {
      mesh.castShadow = cast;
      mesh.receiveShadow = receive;
      return mesh;
    }

    function box(w, h, d, material, x, y, z, radius = 0.04) {
      const geometry = radius > 0
        ? new RoundedBoxGeometry(w, h, d, 3, Math.min(radius, w * 0.2, h * 0.2, d * 0.2))
        : new THREE.BoxGeometry(w, h, d);
      const mesh = shadow(new THREE.Mesh(geometry, material));
      mesh.position.set(x, y, z);
      generator.add(mesh);
      return mesh;
    }

    function cylinder(radius, length, material, x, y, z, axis = 'y', segments = 24) {
      const mesh = shadow(new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, segments),
        material
      ));
      if (axis === 'x') mesh.rotation.z = Math.PI / 2;
      if (axis === 'z') mesh.rotation.x = Math.PI / 2;
      mesh.position.set(x, y, z);
      generator.add(mesh);
      return mesh;
    }

    function tubeBetween(a, b, radius, material = MAT.frame, segments = 20) {
      const start = new THREE.Vector3(...a);
      const end = new THREE.Vector3(...b);
      const direction = end.clone().sub(start);
      const length = direction.length();
      const mesh = shadow(new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, length, segments),
        material
      ));
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      generator.add(mesh);
      return mesh;
    }

    function bolt(x, y, z, axis = 'z', scale = 1) {
      const mesh = cylinder(0.075 * scale, 0.07 * scale, MAT.steel, x, y, z, axis, 12);
      return mesh;
    }

    // Lower chassis.
    tubeBetween([-2.35, 0.52, -1.28], [2.35, 0.52, -1.28], 0.115);
    tubeBetween([-2.35, 0.52, 1.28], [2.35, 0.52, 1.28], 0.115);
    tubeBetween([-2.25, 0.52, -1.28], [-2.25, 0.52, 1.28], 0.115);
    tubeBetween([2.25, 0.52, -1.28], [2.25, 0.52, 1.28], 0.115);

    // Tall protective roll-frame sides.
    for (const x of [-2.35, 2.35]) {
      tubeBetween([x, 0.52, -1.28], [x, 3.38, -1.28], 0.125);
      tubeBetween([x, 0.52, 1.28], [x, 3.38, 1.28], 0.125);
      tubeBetween([x, 3.38, -1.28], [x, 3.38, 1.28], 0.125);
    }
    tubeBetween([-2.35, 3.38, -1.28], [2.35, 3.38, -1.28], 0.125);
    tubeBetween([-2.35, 3.38, 1.28], [2.35, 3.38, 1.28], 0.125);

    // Feet and isolation mounts.
    for (const x of [-1.7, 1.7]) {
      for (const z of [-0.9, 0.9]) {
        cylinder(0.15, 0.18, MAT.rubber, x, 0.39, z);
        cylinder(0.2, 0.06, MAT.darkRubber, x, 0.27, z);
      }
    }

    // Engine block and crankcase.
    box(2.55, 1.48, 1.55, MAT.engine, -0.15, 1.38, -0.06, 0.13);
    box(2.1, 0.42, 1.7, MAT.engineDark, -0.1, 0.73, -0.04, 0.1);
    box(1.55, 0.56, 1.35, MAT.aluminum, -0.35, 2.18, -0.05, 0.08);

    // Cylinder-head fins.
    for (let i = 0; i < 7; i++) {
      const fin = box(1.82 - i * 0.035, 0.045, 1.5, MAT.engineDark, -0.35, 1.9 + i * 0.105, -0.05, 0.015);
      fin.rotation.z = -0.045;
    }

    // Small carburettor and air filter.
    box(0.68, 0.76, 0.5, MAT.black, 1.23, 1.77, 0.46, 0.12);
    cylinder(0.19, 0.2, MAT.brass, 0.88, 1.76, 0.48, 'x', 20);
    cylinder(0.055, 0.46, MAT.brass, 1.03, 2.2, 0.42, 'y', 16);

    // Pull-start housing on front face.
    const pullGroup = new THREE.Group();
    pullGroup.position.set(-0.58, 1.48, 0.86);
    generator.add(pullGroup);

    const pullShell = shadow(new THREE.Mesh(
      new THREE.CylinderGeometry(0.72, 0.77, 0.28, 40),
      MAT.orange
    ));
    pullShell.rotation.x = Math.PI / 2;
    pullGroup.add(pullShell);

    const pullInset = shadow(new THREE.Mesh(
      new THREE.CylinderGeometry(0.48, 0.48, 0.3, 40),
      MAT.orangeDark
    ));
    pullInset.rotation.x = Math.PI / 2;
    pullInset.position.z = 0.03;
    pullGroup.add(pullInset);

    const pullHub = shadow(new THREE.Mesh(
      new THREE.CylinderGeometry(0.13, 0.13, 0.34, 24),
      MAT.black
    ));
    pullHub.rotation.x = Math.PI / 2;
    pullHub.position.z = 0.05;
    pullGroup.add(pullHub);

    for (let i = 0; i < 10; i++) {
      const angle = i * Math.PI * 2 / 10;
      const rib = shadow(new THREE.Mesh(
        new RoundedBoxGeometry(0.09, 0.48, 0.07, 2, 0.025),
        MAT.orangeDark
      ));
      rib.position.set(Math.cos(angle) * 0.3, Math.sin(angle) * 0.3, 0.2);
      rib.rotation.z = angle - Math.PI / 2;
      pullGroup.add(rib);
    }

    // Starter rope, guide and handle.
    const ropeCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-0.08, 1.45, 1.05),
      new THREE.Vector3(0.45, 1.56, 1.18),
      new THREE.Vector3(0.64, 1.91, 1.25),
      new THREE.Vector3(0.84, 2.01, 1.29)
    ]);
    const rope = shadow(new THREE.Mesh(
      new THREE.TubeGeometry(ropeCurve, 24, 0.025, 8, false),
      MAT.darkRubber
    ));
    generator.add(rope);
    cylinder(0.08, 0.36, MAT.black, 0.96, 2.04, 1.3, 'x', 16);

    // Fuel tank.
    box(3.5, 0.72, 1.88, MAT.orange, -0.08, 2.9, -0.02, 0.19);
    box(3.15, 0.09, 1.45, MAT.orangeDark, -0.08, 2.55, -0.02, 0.03);

    // Tank seams.
    box(0.055, 0.62, 1.72, MAT.orangeDark, -1.48, 2.9, -0.02, 0.015);
    box(0.055, 0.62, 1.72, MAT.orangeDark, 1.32, 2.9, -0.02, 0.015);

    // Fuel cap and filler neck.
    cylinder(0.19, 0.12, MAT.black, 0.83, 3.34, 0.24, 'y', 28);
    cylinder(0.26, 0.12, MAT.black, 0.83, 3.44, 0.24, 'y', 28);
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI * 2 / 12;
      const grip = box(0.045, 0.12, 0.09, MAT.rubber,
        0.83 + Math.cos(a) * 0.255, 3.44, 0.24 + Math.sin(a) * 0.255, 0.015);
      grip.rotation.y = -a;
    }

    // Fuel gauge.
    box(0.58, 0.055, 0.26, MAT.black, -0.65, 3.31, 0.3, 0.04);
    box(0.42, 0.02, 0.13, MAT.translucent, -0.65, 3.35, 0.3, 0.025);

    // Control panel on front-right.
    const panel = box(1.48, 1.25, 0.15, MAT.panel, 1.31, 1.72, 1.18, 0.08);
    panel.rotation.x = -0.06;
    box(1.28, 0.28, 0.035, MAT.black, 1.31, 2.12, 1.275, 0.035);

    // Meter face.
    box(0.48, 0.2, 0.025, MAT.inset, 1.03, 2.12, 1.3, 0.025);
    box(0.35, 0.1, 0.015, MAT.translucent, 1.03, 2.12, 1.32, 0.012);

    // Breakers and status lamp.
    box(0.15, 0.18, 0.08, MAT.red, 1.48, 2.12, 1.34, 0.025);
    cylinder(0.055, 0.04, MAT.green, 1.73, 2.12, 1.34, 'z', 20);

    function outlet(x, y) {
      cylinder(0.22, 0.06, MAT.inset, x, y, 1.31, 'z', 28);
      cylinder(0.055, 0.07, MAT.black, x - 0.075, y + 0.035, 1.35, 'z', 14);
      cylinder(0.055, 0.07, MAT.black, x + 0.075, y + 0.035, 1.35, 'z', 14);
      box(0.045, 0.085, 0.07, MAT.black, x, y - 0.08, 1.35, 0.014);
      cylinder(0.025, 0.075, MAT.steel, x, y + 0.03, 1.39, 'z', 12);
    }
    outlet(1.0, 1.55);
    outlet(1.61, 1.55);

    // Main switch and grounding terminal.
    box(0.22, 0.29, 0.09, MAT.inset, 1.01, 1.13, 1.34, 0.035);
    box(0.11, 0.19, 0.11, MAT.red, 1.01, 1.17, 1.41, 0.025);
    cylinder(0.08, 0.09, MAT.brass, 1.62, 1.14, 1.34, 'z', 16);
    cylinder(0.035, 0.13, MAT.brass, 1.62, 1.14, 1.42, 'z', 12);

    for (const x of [0.66, 1.96]) {
      for (const y of [1.13, 2.25]) bolt(x, y, 1.31, 'z', 0.7);
    }

    // Muffler at rear.
    box(1.05, 0.77, 0.65, MAT.engineDark, 1.23, 1.78, -0.96, 0.11);
    box(0.94, 0.63, 0.05, MAT.black, 1.23, 1.78, -1.31, 0.035);
    for (let row = 0; row < 4; row++) {
      for (let col = 0; col < 6; col++) {
        cylinder(0.035, 0.04, MAT.inset,
          0.88 + col * 0.14, 1.55 + row * 0.14, -1.35, 'z', 12);
      }
    }
    tubeBetween([0.68, 1.62, -0.76], [0.35, 1.55, -0.38], 0.1, MAT.engineDark, 18);
    cylinder(0.13, 0.55, MAT.engineDark, 1.52, 2.25, -0.98, 'y', 18);
    cylinder(0.15, 0.25, MAT.black, 1.52, 2.57, -0.98, 'y', 18);

    // Wheels and axle.
    cylinder(0.11, 5.0, MAT.steel, 0, 0.68, -0.77, 'x', 20);

    function wheel(x) {
      const tire = shadow(new THREE.Mesh(
        new THREE.TorusGeometry(0.61, 0.18, 16, 36),
        MAT.rubber
      ));
      tire.position.set(x, 0.69, -0.77);
      tire.rotation.y = Math.PI / 2;
      generator.add(tire);

      const hub = cylinder(0.27, 0.24, MAT.engineDark, x, 0.69, -0.77, 'x', 28);
      const cap = cylinder(0.105, 0.28, MAT.steel, x, 0.69, -0.77, 'x', 20);
      hub.rotation.x += 0.01;
      cap.rotation.x += 0.01;

      for (let i = 0; i < 8; i++) {
        const a = i * Math.PI * 2 / 8;
        const spoke = tubeBetween(
          [x + (x > 0 ? 0.135 : -0.135), 0.69 + Math.sin(a) * 0.16, -0.77 + Math.cos(a) * 0.16],
          [x + (x > 0 ? 0.135 : -0.135), 0.69 + Math.sin(a) * 0.41, -0.77 + Math.cos(a) * 0.41],
          0.035, MAT.steel, 10
        );
        spoke.rotation.x += 0.001;
      }

      for (let i = 0; i < 18; i++) {
        const a = i * Math.PI * 2 / 18;
        const tread = box(0.1, 0.16, 0.26, MAT.darkRubber,
          x, 0.69 + Math.sin(a) * 0.77, -0.77 + Math.cos(a) * 0.77, 0.025);
        tread.rotation.x = a;
      }
    }
    wheel(-2.47);
    wheel(2.47);

    // Fold-down twin rear handles.
    for (const x of [-1.45, 1.45]) {
      cylinder(0.16, 0.12, MAT.frame, x, 2.52, -1.35, 'x', 20);
      tubeBetween([x, 2.52, -1.36], [x, 2.18, -2.06], 0.105);
      tubeBetween([x, 2.18, -2.06], [x, 1.72, -2.42], 0.105);
      cylinder(0.16, 0.68, MAT.rubber, x, 1.59, -2.54, 'z', 20);
    }
    tubeBetween([-1.45, 1.72, -2.42], [1.45, 1.72, -2.42], 0.09, MAT.frame);

    // Safety/branding plates.
    box(1.1, 0.35, 0.025, MAT.black, -0.55, 2.93, 0.94, 0.035);
    box(0.74, 0.08, 0.012, MAT.white, -0.62, 3.0, 0.96, 0.012);
    box(0.47, 0.055, 0.012, MAT.orange, -0.75, 2.87, 0.96, 0.01);

    const cautionShape = new THREE.Shape();
    cautionShape.moveTo(0, 0.23);
    cautionShape.lineTo(-0.2, -0.12);
    cautionShape.lineTo(0.2, -0.12);
    cautionShape.closePath();
    const caution = shadow(new THREE.Mesh(
      new THREE.ExtrudeGeometry(cautionShape, { depth: 0.018, bevelEnabled: false }),
      new THREE.MeshStandardMaterial({ color: 0xf0b61d, roughness: 0.55 })
    ));
    caution.position.set(0.22, 2.9, 0.955);
    generator.add(caution);

    // Wiring and fuel hose.
    const hoseCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0.88, 2.69, 0.2),
      new THREE.Vector3(1.12, 2.47, 0.15),
      new THREE.Vector3(1.02, 2.17, 0.35),
      new THREE.Vector3(1.06, 1.93, 0.46)
    ]);
    const hose = shadow(new THREE.Mesh(
      new THREE.TubeGeometry(hoseCurve, 30, 0.035, 8, false),
      MAT.darkRubber
    ));
    generator.add(hose);

    // Ground contact shadows beneath wheels.
    for (const x of [-2.47, 2.47]) {
      const contact = new THREE.Mesh(
        new THREE.CircleGeometry(0.42, 28),
        new THREE.MeshBasicMaterial({
          color: 0x45504e,
          transparent: true,
          opacity: 0.17,
          depthWrite: false
        })
      );
      contact.scale.set(1.4, 0.45, 1);
      contact.rotation.x = -Math.PI / 2;
      contact.position.set(x, 0.012, -0.77);
      generator.add(contact);
    }

    // Soft studio backdrop rings.
    const ringMaterial = new THREE.MeshBasicMaterial({
      color: 0xe0e5e4,
      transparent: true,
      opacity: 0.18,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const ring = new THREE.Mesh(new THREE.RingGeometry(7.5, 8.2, 96), ringMaterial);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.008;
    scene.add(ring);

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      generator.position.y = Math.sin(elapsed * 0.55) * 0.003;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
