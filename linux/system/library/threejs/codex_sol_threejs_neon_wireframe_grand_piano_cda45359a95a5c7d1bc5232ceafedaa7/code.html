<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Wireframe Piano</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #020008;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020008);
  scene.fog = new THREE.FogExp2(0x05000d, 0.038);

  const camera = new THREE.PerspectiveCamera(
    42,
    window.innerWidth / window.innerHeight,
    0.05,
    100
  );
  camera.position.set(6.8, 4.8, 7.8);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.25, -0.15);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.55;
  controls.minDistance = 5;
  controls.maxDistance = 14;
  controls.minPolarAngle = 0.35;
  controls.maxPolarAngle = Math.PI * 0.49;

  const composer = new EffectComposer(renderer);
  composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  composer.addPass(new RenderPass(scene, camera));

  const bloomPass = new UnrealBloomPass(
    new THREE.Vector2(window.innerWidth, window.innerHeight),
    1.75,
    0.48,
    0.12
  );
  composer.addPass(bloomPass);
  composer.addPass(new OutputPass());

  const magenta = new THREE.MeshStandardMaterial({
    color: 0xff159f,
    emissive: 0xff0088,
    emissiveIntensity: 5.8,
    roughness: 0.28,
    metalness: 0.08
  });

  const hotMagenta = new THREE.MeshStandardMaterial({
    color: 0xff64ce,
    emissive: 0xff0aa0,
    emissiveIntensity: 7.2,
    roughness: 0.22,
    metalness: 0.05
  });

  const cyan = new THREE.MeshStandardMaterial({
    color: 0x37f8ff,
    emissive: 0x00dfff,
    emissiveIntensity: 5.3,
    roughness: 0.25,
    metalness: 0.06
  });

  const paleCyan = new THREE.MeshStandardMaterial({
    color: 0xb8ffff,
    emissive: 0x22eeff,
    emissiveIntensity: 6.4,
    roughness: 0.2,
    metalness: 0.04
  });

  const violet = new THREE.MeshStandardMaterial({
    color: 0xb34dff,
    emissive: 0x7b20ff,
    emissiveIntensity: 4.4,
    roughness: 0.32,
    metalness: 0.05
  });

  const dimViolet = new THREE.MeshStandardMaterial({
    color: 0x6d42b8,
    emissive: 0x5720a8,
    emissiveIntensity: 2.5,
    roughness: 0.38,
    metalness: 0.04
  });

  const piano = new THREE.Group();
  piano.rotation.y = -0.08;
  scene.add(piano);

  function addTube(points, radius, material, segments = 20, closed = false, parent = piano) {
    const curve = points.length === 2
      ? new THREE.LineCurve3(points[0], points[1])
      : new THREE.CatmullRomCurve3(points, closed, 'centripetal', 0.5);

    const geometry = new THREE.TubeGeometry(
      curve,
      Math.max(4, segments),
      radius,
      6,
      closed
    );
    const mesh = new THREE.Mesh(geometry, material);
    mesh.castShadow = true;
    mesh.receiveShadow = false;
    parent.add(mesh);
    return mesh;
  }

  function line(a, b, radius, material, parent = piano) {
    return addTube([a, b], radius, material, 6, false, parent);
  }

  function loopAt(x, y, z, rx, rz, radius, material, parent = piano) {
    const points = [];
    const count = 20;
    for (let i = 0; i < count; i++) {
      const angle = i / count * Math.PI * 2;
      points.push(new THREE.Vector3(
        x + Math.cos(angle) * rx,
        y,
        z + Math.sin(angle) * rz
      ));
    }
    return addTube(points, radius, material, 32, true, parent);
  }

  const caseProfile = [
    [-1.48, 1.24],
    [-1.49, 0.35],
    [-1.48, -0.65],
    [-1.42, -1.55],
    [-1.16, -2.25],
    [-0.72, -2.63],
    [-0.16, -2.76],
    [0.40, -2.65],
    [0.82, -2.31],
    [1.08, -1.75],
    [1.28, -1.05],
    [1.46, -0.25],
    [1.51, 0.55],
    [1.47, 1.24]
  ];

  function profileAtHeight(y) {
    return caseProfile.map(([x, z]) => new THREE.Vector3(x, y, z));
  }

  addTube(profileAtHeight(1.45), 0.035, magenta, 90, true);
  addTube(profileAtHeight(1.76), 0.032, hotMagenta, 90, true);

  for (let i = 0; i < caseProfile.length; i += 2) {
    const [x, z] = caseProfile[i];
    line(
      new THREE.Vector3(x, 1.45, z),
      new THREE.Vector3(x, 1.76, z),
      0.022,
      magenta
    );
  }

  line(
    new THREE.Vector3(-1.48, 1.60, 1.24),
    new THREE.Vector3(1.47, 1.60, 1.24),
    0.03,
    hotMagenta
  );

  const innerProfile = caseProfile.map(([x, z]) => {
    const scale = z < -2.2 ? 0.88 : 0.91;
    return new THREE.Vector3(x * scale, 1.79, z * 0.96 + 0.01);
  });
  addTube(innerProfile, 0.017, violet, 90, true);

  function innerLeft(z) {
    const t = THREE.MathUtils.clamp((1.05 - z) / 3.45, 0, 1);
    return -1.27 + 0.72 * Math.pow(t, 4);
  }

  function innerRight(z) {
    const t = THREE.MathUtils.clamp((1.05 - z) / 3.45, 0, 1);
    return 1.27 - 0.72 * Math.pow(t, 1.55);
  }

  const stringCount = 23;
  for (let i = 0; i < stringCount; i++) {
    const u = i / (stringCount - 1);
    const startX = THREE.MathUtils.lerp(-1.20, 1.20, u);
    const endX = THREE.MathUtils.lerp(-0.48, 0.49, Math.pow(u, 0.9));
    const endZ = -2.38 + 0.16 * Math.sin(u * Math.PI);
    line(
      new THREE.Vector3(startX, 1.805, 1.04),
      new THREE.Vector3(endX, 1.815, endZ),
      i % 5 === 0 ? 0.011 : 0.0065,
      i % 5 === 0 ? violet : dimViolet
    );
  }

  for (let i = 0; i < 10; i++) {
    const z = THREE.MathUtils.lerp(0.82, -2.28, i / 9);
    line(
      new THREE.Vector3(innerLeft(z), 1.80, z),
      new THREE.Vector3(innerRight(z), 1.80, z),
      0.007,
      dimViolet
    );
  }

  line(
    new THREE.Vector3(-1.18, 1.825, 0.96),
    new THREE.Vector3(0.43, 1.825, -2.35),
    0.026,
    violet
  );
  line(
    new THREE.Vector3(1.17, 1.825, 0.98),
    new THREE.Vector3(-0.42, 1.825, -2.37),
    0.022,
    violet
  );
  line(
    new THREE.Vector3(-1.18, 1.825, -0.05),
    new THREE.Vector3(0.96, 1.825, -1.48),
    0.018,
    violet
  );

  const keyFrontZ = 2.38;
  const keyBackZ = 1.28;
  const keyY = 1.55;
  const keyLeft = -1.39;
  const keyRight = 1.39;

  const keyboardFrame = [
    new THREE.Vector3(keyLeft, keyY, keyFrontZ),
    new THREE.Vector3(keyRight, keyY, keyFrontZ),
    new THREE.Vector3(keyRight, keyY, keyBackZ),
    new THREE.Vector3(keyLeft, keyY, keyBackZ)
  ];
  addTube(keyboardFrame, 0.031, hotMagenta, 24, true);

  line(
    new THREE.Vector3(keyLeft, keyY + 0.03, keyFrontZ - 0.07),
    new THREE.Vector3(keyRight, keyY + 0.03, keyFrontZ - 0.07),
    0.018,
    cyan
  );
  line(
    new THREE.Vector3(keyLeft, keyY + 0.03, keyBackZ + 0.07),
    new THREE.Vector3(keyRight, keyY + 0.03, keyBackZ + 0.07),
    0.018,
    cyan
  );

  const whiteKeyCount = 25;
  for (let i = 0; i <= whiteKeyCount; i++) {
    const x = THREE.MathUtils.lerp(keyLeft + 0.035, keyRight - 0.035, i / whiteKeyCount);
    line(
      new THREE.Vector3(x, keyY + 0.045, keyFrontZ - 0.08),
      new THREE.Vector3(x, keyY + 0.045, keyBackZ + 0.08),
      i === 0 || i === whiteKeyCount ? 0.013 : 0.008,
      i % 7 === 0 ? paleCyan : cyan
    );
  }

  const blackPattern = [0, 1, 3, 4, 5];
  for (let octave = 0; octave < 4; octave++) {
    for (const note of blackPattern) {
      const index = octave * 7 + note + 1;
      if (index >= whiteKeyCount) continue;
      const x = THREE.MathUtils.lerp(
        keyLeft + 0.035,
        keyRight - 0.035,
        index / whiteKeyCount
      );
      line(
        new THREE.Vector3(x, keyY + 0.095, keyBackZ + 0.13),
        new THREE.Vector3(x, keyY + 0.095, keyBackZ + 0.53),
        0.015,
        violet
      );
    }
  }

  line(
    new THREE.Vector3(-1.43, 1.45, 2.28),
    new THREE.Vector3(-1.43, 1.16, 1.34),
    0.025,
    magenta
  );
  line(
    new THREE.Vector3(1.43, 1.45, 2.28),
    new THREE.Vector3(1.43, 1.16, 1.34),
    0.025,
    magenta
  );
  line(
    new THREE.Vector3(-1.43, 1.18, 1.35),
    new THREE.Vector3(1.43, 1.18, 1.35),
    0.025,
    magenta
  );

  const lidAngle = THREE.MathUtils.degToRad(27);
  const hingeX = -1.47;
  const lidBaseY = 1.86;

  function lidPoint(x, z) {
    const dx = x - hingeX;
    return new THREE.Vector3(
      hingeX + dx * Math.cos(lidAngle),
      lidBaseY + dx * Math.sin(lidAngle),
      z
    );
  }

  const lidOutline = caseProfile.map(([x, z]) => lidPoint(x, z));
  addTube(lidOutline, 0.039, hotMagenta, 92, true);

  const lidInner = caseProfile.map(([x, z]) => {
    const insetX = x * (z < -2.2 ? 0.88 : 0.91);
    const insetZ = z * 0.96;
    return lidPoint(insetX, insetZ);
  });
  addTube(lidInner, 0.018, magenta, 92, true);

  for (const z of [0.86, 0.08, -0.72, -1.45, -2.05]) {
    const left = innerLeft(z);
    const right = innerRight(z);
    line(lidPoint(left, z), lidPoint(right, z), 0.014, magenta);
  }

  line(
    lidPoint(-1.37, 1.08),
    lidPoint(-1.34, -2.10),
    0.023,
    hotMagenta
  );

  const propBottom = new THREE.Vector3(0.80, 1.79, -0.63);
  const propTop = lidPoint(0.67, -0.63);
  line(propBottom, propTop, 0.035, hotMagenta);
  loopAt(propBottom.x, propBottom.y, propBottom.z, 0.075, 0.075, 0.012, violet);

  function addLeg(cx, cz, leanX, leanZ) {
    const topY = 1.43;
    const bottomY = 0.20;
    const topHalf = 0.145;
    const bottomHalf = 0.070;
    const bx = cx + leanX;
    const bz = cz + leanZ;

    const topCorners = [
      [cx - topHalf, topY, cz - topHalf],
      [cx + topHalf, topY, cz - topHalf],
      [cx + topHalf, topY, cz + topHalf],
      [cx - topHalf, topY, cz + topHalf]
    ];

    const bottomCorners = [
      [bx - bottomHalf, bottomY, bz - bottomHalf],
      [bx + bottomHalf, bottomY, bz - bottomHalf],
      [bx + bottomHalf, bottomY, bz + bottomHalf],
      [bx - bottomHalf, bottomY, bz + bottomHalf]
    ];

    for (let i = 0; i < 4; i++) {
      line(
        new THREE.Vector3(...topCorners[i]),
        new THREE.Vector3(...bottomCorners[i]),
        0.022,
        magenta
      );
    }

    loopAt(cx, topY, cz, topHalf * 1.18, topHalf * 1.18, 0.018, hotMagenta);
    loopAt(bx, bottomY, bz, bottomHalf * 1.22, bottomHalf * 1.22, 0.016, magenta);

    line(
      new THREE.Vector3(bx - 0.13, 0.13, bz),
      new THREE.Vector3(bx + 0.13, 0.13, bz),
      0.018,
      violet
    );

    const wheelPoints = [];
    for (let i = 0; i < 18; i++) {
      const a = i / 18 * Math.PI * 2;
      wheelPoints.push(new THREE.Vector3(
        bx + Math.cos(a) * 0.085,
        0.095 + Math.sin(a) * 0.085,
        bz
      ));
    }
    addTube(wheelPoints, 0.013, hotMagenta, 28, true);
  }

  addLeg(-1.17, 1.04, -0.09, 0.10);
  addLeg(1.17, 1.04, 0.09, 0.10);
  addLeg(-0.72, -1.88, -0.07, -0.09);

  const lyreTopLeft = new THREE.Vector3(-0.28, 1.25, 1.52);
  const lyreTopRight = new THREE.Vector3(0.28, 1.25, 1.52);
  const lyreBottomLeft = new THREE.Vector3(-0.16, 0.48, 1.63);
  const lyreBottomRight = new THREE.Vector3(0.16, 0.48, 1.63);

  line(lyreTopLeft, lyreBottomLeft, 0.024, magenta);
  line(lyreTopRight, lyreBottomRight, 0.024, magenta);
  line(lyreBottomLeft, lyreBottomRight, 0.020, violet);
  line(
    new THREE.Vector3(-0.22, 1.02, 1.56),
    new THREE.Vector3(0.22, 1.02, 1.56),
    0.015,
    magenta
  );

  line(
    new THREE.Vector3(-0.12, 0.48, 1.63),
    new THREE.Vector3(-0.29, 0.38, 1.91),
    0.024,
    paleCyan
  );
  line(
    new THREE.Vector3(0.12, 0.48, 1.63),
    new THREE.Vector3(0.29, 0.38, 1.91),
    0.024,
    paleCyan
  );
  line(
    new THREE.Vector3(-0.29, 0.38, 1.91),
    new THREE.Vector3(-0.15, 0.38, 2.04),
    0.026,
    cyan
  );
  line(
    new THREE.Vector3(0.29, 0.38, 1.91),
    new THREE.Vector3(0.43, 0.38, 2.04),
    0.026,
    cyan
  );

  const ambient = new THREE.AmbientLight(0x170024, 0.8);
  scene.add(ambient);

  const magentaLight = new THREE.PointLight(0xff0088, 22, 9, 2);
  magentaLight.position.set(2.8, 3.8, 1.4);
  magentaLight.castShadow = true;
  magentaLight.shadow.mapSize.set(512, 512);
  scene.add(magentaLight);

  const cyanLight = new THREE.PointLight(0x00dfff, 17, 8, 2);
  cyanLight.position.set(-2.8, 2.7, 3.0);
  scene.add(cyanLight);

  const violetLight = new THREE.PointLight(0x7722ff, 12, 8, 2);
  violetLight.position.set(0, 3.8, -3.2);
  scene.add(violetLight);

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const elapsed = clock.getElapsedTime();

    magentaLight.intensity = 21 + Math.sin(elapsed * 2.1) * 1.2;
    cyanLight.intensity = 16.5 + Math.sin(elapsed * 1.7 + 1.4) * 0.8;
    violetLight.intensity = 11.5 + Math.sin(elapsed * 1.3 + 2.3) * 0.7;

    controls.update();
    composer.render();
  }

  window.addEventListener('resize', () => {
    const width = window.innerWidth;
    const height = window.innerHeight;
    const pixelRatio = Math.min(window.devicePixelRatio, 2);

    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    renderer.setPixelRatio(pixelRatio);
    renderer.setSize(width, height);

    composer.setPixelRatio(pixelRatio);
    composer.setSize(width, height);
  });

  animate();
</script>
</body>
</html>
