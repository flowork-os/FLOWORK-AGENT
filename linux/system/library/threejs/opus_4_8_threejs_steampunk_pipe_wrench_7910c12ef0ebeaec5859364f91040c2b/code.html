<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Steampunk Pipe Wrench</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#15171a; }
  canvas { display:block; }
  #hint {
    position:fixed; left:50%; bottom:14px; transform:translateX(-50%);
    font:12px/1.4 "Georgia", serif; color:#b9a37c; opacity:.55;
    letter-spacing:.14em; text-transform:uppercase; pointer-events:none;
    text-shadow:0 1px 3px rgba(0,0,0,.8);
  }
</style>
</head>
<body>
<div id="hint">Steampunk Adjustable Pipe Wrench &mdash; drag to orbit, scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161a);
scene.fog = new THREE.Fog(0x14161a, 26, 60);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(7.2, 4.4, 9.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 5;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 0.9, 0);

/* ============================================================
   PROCEDURAL TEXTURES (canvas based — no external assets)
   ============================================================ */
function makeNoiseCanvas(size, base, spots, spotColor, spotAlpha, blotchScale) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.fillStyle = base;
  g.fillRect(0, 0, size, size);

  // large soft blotches (patina / staining)
  for (let i = 0; i < spots; i++) {
    const x = Math.random() * size;
    const y = Math.random() * size;
    const r = (0.02 + Math.random() * blotchScale) * size;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    const a = spotAlpha * (0.35 + Math.random() * 0.65);
    grd.addColorStop(0, `rgba(${spotColor[0]},${spotColor[1]},${spotColor[2]},${a})`);
    grd.addColorStop(1, `rgba(${spotColor[0]},${spotColor[1]},${spotColor[2]},0)`);
    g.fillStyle = grd;
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  }

  // fine speckle grain
  const img = g.getImageData(0, 0, size, size);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 26;
    d[i]     = Math.max(0, Math.min(255, d[i] + n));
    d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n));
    d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n));
  }
  g.putImageData(img, 0, 0);
  return c;
}

function canvasTexture(canvas, repeat) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function roughnessTexture(canvas, repeat) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeat, repeat);
  t.anisotropy = 4;
  return t;
}

// Aged brass / bronze map (green-gold patina + oil darkening)
const brassCanvas = makeNoiseCanvas(512, '#b98d43', 130, [78, 112, 86], 0.55, 0.10);
const brassMap = canvasTexture(brassCanvas, 2);
const brassRoughCanvas = makeNoiseCanvas(512, '#6b6b6b', 110, [215, 215, 215], 0.7, 0.09);
const brassRough = roughnessTexture(brassRoughCanvas, 2);

// Blued steel / iron map (dark, oil stained, mottled)
const ironCanvas = makeNoiseCanvas(512, '#3a3f48', 150, [22, 26, 33], 0.7, 0.12);
const ironMap = canvasTexture(ironCanvas, 2);
const ironRoughCanvas = makeNoiseCanvas(512, '#787878', 140, [225, 225, 225], 0.75, 0.11);
const ironRough = roughnessTexture(ironRoughCanvas, 2);

// Copper map (warm with verdigris)
const copperCanvas = makeNoiseCanvas(512, '#a75a34', 120, [72, 124, 108], 0.5, 0.09);
const copperMap = canvasTexture(copperCanvas, 2);
const copperRoughCanvas = makeNoiseCanvas(512, '#6f6f6f', 100, [210, 210, 210], 0.6, 0.09);
const copperRough = roughnessTexture(copperRoughCanvas, 2);

/* ============================================================
   MATERIALS
   ============================================================ */
const matBrass = new THREE.MeshStandardMaterial({
  color: 0xffe7b0, map: brassMap, roughnessMap: brassRough,
  metalness: 1.0, roughness: 0.38
});

const matBrassDark = new THREE.MeshStandardMaterial({
  color: 0xc9a05e, map: brassMap, roughnessMap: brassRough,
  metalness: 1.0, roughness: 0.52
});

const matBronze = new THREE.MeshStandardMaterial({
  color: 0xc98f52, map: brassMap, roughnessMap: brassRough,
  metalness: 1.0, roughness: 0.46
});

const matIron = new THREE.MeshStandardMaterial({
  color: 0x8b95a4, map: ironMap, roughnessMap: ironRough,
  metalness: 1.0, roughness: 0.55
});

const matBluedSteel = new THREE.MeshStandardMaterial({
  color: 0x5f6f8c, map: ironMap, roughnessMap: ironRough,
  metalness: 1.0, roughness: 0.33
});

const matDarkIron = new THREE.MeshStandardMaterial({
  color: 0x6a7080, map: ironMap, roughnessMap: ironRough,
  metalness: 1.0, roughness: 0.66
});

const matCopper = new THREE.MeshStandardMaterial({
  color: 0xd98d5a, map: copperMap, roughnessMap: copperRough,
  metalness: 1.0, roughness: 0.36
});

const matSteelPolish = new THREE.MeshStandardMaterial({
  color: 0xc6ccd6, metalness: 1.0, roughness: 0.18
});

const matGlass = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0.0, roughness: 0.05,
  transmission: 0.94, thickness: 0.05, ior: 1.45,
  transparent: true, opacity: 0.42, clearcoat: 1.0, clearcoatRoughness: 0.03
});

const matEnamel = new THREE.MeshStandardMaterial({
  color: 0xe8dcbc, metalness: 0.0, roughness: 0.62
});

const matNeedle = new THREE.MeshStandardMaterial({
  color: 0x8e1f14, metalness: 0.2, roughness: 0.5
});

const matLeather = new THREE.MeshStandardMaterial({
  color: 0x4a2f1e, metalness: 0.05, roughness: 0.85
});

const matEmberGlow = new THREE.MeshStandardMaterial({
  color: 0xffb347, emissive: 0xff8a1e, emissiveIntensity: 1.6, roughness: 0.4, metalness: 0.2
});

/* ============================================================
   HELPERS
   ============================================================ */
const TWO_PI = Math.PI * 2;

function mesh(geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// A ring of rivets around a circle in a given plane
function rivetRing(parent, count, radius, rivetR, mat, axis, offset) {
  for (let i = 0; i < count; i++) {
    const a = (i / count) * TWO_PI;
    const head = new THREE.Mesh(new THREE.SphereGeometry(rivetR, 12, 10, 0, TWO_PI, 0, Math.PI * 0.55), mat);
    head.castShadow = true;
    head.receiveShadow = true;
    if (axis === 'z') {
      head.position.set(Math.cos(a) * radius, Math.sin(a) * radius, offset);
      head.rotation.x = Math.PI * 0.5;
      head.rotation.z = 0;
      head.rotateOnAxis(new THREE.Vector3(1, 0, 0), 0);
    } else {
      head.position.set(Math.cos(a) * radius, offset, Math.sin(a) * radius);
    }
    parent.add(head);
  }
}

// Single rivet, dome facing +Z by default
function rivet(x, y, z, r, mat, dir) {
  const g = new THREE.SphereGeometry(r, 14, 10, 0, TWO_PI, 0, Math.PI * 0.52);
  const m = new THREE.Mesh(g, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  m.position.set(x, y, z);
  if (dir === 'z') m.rotation.x = Math.PI * 0.5;
  else if (dir === '-z') m.rotation.x = -Math.PI * 0.5;
  else if (dir === 'x') m.rotation.z = -Math.PI * 0.5;
  else if (dir === '-x') m.rotation.z = Math.PI * 0.5;
  return m;
}

// Gear built from an extruded shape with real teeth + spokes + hub bore
function makeGear(outerR, toothH, teeth, thickness, boreR, spokes) {
  const shape = new THREE.Shape();
  const rRoot = outerR;
  const rTip = outerR + toothH;
  const steps = teeth * 4;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const a = t * TWO_PI;
    const phase = (i % 4);
    let r;
    if (phase === 0) r = rRoot;
    else if (phase === 1) r = rTip * 0.99;
    else if (phase === 2) r = rTip;
    else r = rRoot * 1.01;
    const x = Math.cos(a) * r;
    const y = Math.sin(a) * r;
    if (i === 0) shape.moveTo(x, y);
    else shape.lineTo(x, y);
  }
  shape.closePath();

  // bore
  const hole = new THREE.Path();
  hole.absarc(0, 0, boreR, 0, TWO_PI, true);
  shape.holes.push(hole);

  // lightening holes between spokes
  if (spokes > 0) {
    const holeR = (outerR - boreR) * 0.26;
    const ringR = boreR + (outerR - boreR) * 0.52;
    for (let s = 0; s < spokes; s++) {
      const a = (s / spokes) * TWO_PI + Math.PI / spokes;
      const p = new THREE.Path();
      p.absarc(Math.cos(a) * ringR, Math.sin(a) * ringR, holeR, 0, TWO_PI, true);
      shape.holes.push(p);
    }
  }

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: thickness,
    bevelEnabled: true,
    bevelThickness: thickness * 0.12,
    bevelSize: thickness * 0.12,
    bevelSegments: 2,
    curveSegments: 8
  });
  geo.translate(0, 0, -thickness / 2);
  geo.computeVertexNormals();
  return geo;
}

// Extruded plate from a list of 2D points
function makePlate(points, thickness, bevel) {
  const shape = new THREE.Shape();
  shape.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
  shape.closePath();
  const b = bevel === undefined ? thickness * 0.14 : bevel;
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: thickness,
    bevelEnabled: b > 0,
    bevelThickness: b,
    bevelSize: b,
    bevelSegments: 2,
    curveSegments: 10
  });
  geo.translate(0, 0, -thickness / 2);
  geo.computeVertexNormals();
  return geo;
}

// Threaded rod: a cylinder plus a helical torus-ish ridge approximated by a tube
function makeThreadTube(radius, length, turns, wireR) {
  const pts = [];
  const segs = Math.max(64, Math.floor(turns * 26));
  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const a = t * TWO_PI * turns;
    pts.push(new THREE.Vector3(Math.cos(a) * radius, -length / 2 + t * length, Math.sin(a) * radius));
  }
  const curve = new THREE.CatmullRomCurve3(pts);
  return new THREE.TubeGeometry(curve, segs, wireR, 8, false);
}

// A curved copper pipe following a Catmull-Rom through given points
function makePipe(pointArray, radius, tubularSegments) {
  const v = pointArray.map(p => new THREE.Vector3(p[0], p[1], p[2]));
  const curve = new THREE.CatmullRomCurve3(v, false, 'catmullrom', 0.4);
  return new THREE.TubeGeometry(curve, tubularSegments || 64, radius, 12, false);
}

/* ============================================================
   THE WRENCH  (single centered object)
   Layout: handle runs along +Y down to -Y; head at top.
   ============================================================ */
const wrench = new THREE.Group();
scene.add(wrench);

const HANDLE_LEN = 4.6;          // main handle length
const HANDLE_R = 0.30;           // handle radius
const HEAD_Y = 2.55;             // where the fixed head starts

/* ---------- 1. HANDLE (blued steel shaft, hex mid-section) ---------- */
const handleGroup = new THREE.Group();
wrench.add(handleGroup);

// Tapered main shaft (lathe profile for a forged look)
const shaftProfile = [];
(function buildShaftProfile() {
  const N = 26;
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const y = -HANDLE_LEN * 0.52 + t * HANDLE_LEN;
    // base taper: fat near head, slimmer near butt, with a swell in the grip
    let r = HANDLE_R * (0.72 + 0.46 * t);
    r += 0.055 * Math.sin(t * Math.PI * 3.0);       // subtle forged ripples
    r *= 1.0 + 0.10 * Math.exp(-Math.pow((t - 0.30) / 0.13, 2)); // grip swell
    shaftProfile.push(new THREE.Vector2(Math.max(0.06, r), y));
  }
})();
const shaftGeo = new THREE.LatheGeometry(shaftProfile, 40);
const shaft = mesh(shaftGeo, matBluedSteel, 0, HEAD_Y - HANDLE_LEN * 0.48 - 0.02, 0);
handleGroup.add(shaft);

// Octagonal collar sleeves (bronze bands) along the handle
function collar(y, rOut, h, mat, sides) {
  const g = new THREE.CylinderGeometry(rOut, rOut, h, sides || 8, 1);
  const m = mesh(g, mat, 0, y, 0);
  return m;
}
const collarYs = [HEAD_Y - 0.30, HEAD_Y - 1.35, HEAD_Y - 2.55, HEAD_Y - 3.72];
const collarRs = [0.345, 0.335, 0.315, 0.30];
collarYs.forEach((y, i) => {
  const c = collar(y, collarRs[i], 0.20, matBronze, 8);
  handleGroup.add(c);
  // rivets around the collar
  for (let k = 0; k < 4; k++) {
    const a = (k / 4) * TWO_PI + Math.PI / 4;
    const rv = rivet(Math.cos(a) * collarRs[i] * 0.99, y, Math.sin(a) * collarRs[i] * 0.99, 0.037, matDarkIron);
    rv.lookAt(new THREE.Vector3(Math.cos(a) * 4, y, Math.sin(a) * 4));
    rv.rotateX(Math.PI * 0.5);
    handleGroup.add(rv);
  }
});

// Leather wrapped grip (stacked slightly irregular rings)
const gripGroup = new THREE.Group();
handleGroup.add(gripGroup);
for (let i = 0; i < 16; i++) {
  const y = HEAD_Y - 1.62 - i * 0.055;
  const r = 0.315 + 0.012 * Math.sin(i * 1.7);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.032, 8, 28), matLeather);
  ring.rotation.x = Math.PI / 2;
  ring.rotation.z = i * 0.31;
  ring.position.y = y;
  ring.castShadow = true;
  ring.receiveShadow = true;
  gripGroup.add(ring);
}

// Butt cap: ornate bronze finial with a small ring
const buttY = HEAD_Y - HANDLE_LEN - 0.10;
const buttProfile = [];
for (let i = 0; i <= 14; i++) {
  const t = i / 14;
  const y = t * 0.46;
  const r = 0.33 * Math.sqrt(Math.max(0.0001, 1 - t)) + 0.10 * Math.sin(t * Math.PI * 2.2) + 0.06;
  buttProfile.push(new THREE.Vector2(Math.max(0.04, r), -y));
}
const buttCap = mesh(new THREE.LatheGeometry(buttProfile, 32), matBronze, 0, buttY + 0.42, 0);
handleGroup.add(buttCap);

const hangRing = new THREE.Mesh(new THREE.TorusGeometry(0.15, 0.038, 12, 28), matBrassDark);
hangRing.position.set(0, buttY + 0.02, 0);
hangRing.rotation.y = Math.PI / 2;
hangRing.castShadow = true;
hangRing.receiveShadow = true;
handleGroup.add(hangRing);

/* ---------- 2. PRESSURE GAUGE set into the handle ---------- */
const gaugeGroup = new THREE.Group();
gaugeGroup.position.set(0, HEAD_Y - 0.82, 0);
handleGroup.add(gaugeGroup);

const GAUGE_R = 0.40;
const gaugeTilt = -0.18;

// Housing boss that merges into the handle
const boss = mesh(new THREE.CylinderGeometry(0.30, 0.36, 0.30, 20), matBronze, 0, 0, 0.16);
boss.rotation.x = Math.PI / 2;
gaugeGroup.add(boss);

// Bezel (lathe: stepped brass ring)
const bezelProfile = [
  new THREE.Vector2(0.10, 0.00),
  new THREE.Vector2(GAUGE_R * 0.94, 0.00),
  new THREE.Vector2(GAUGE_R * 1.00, 0.05),
  new THREE.Vector2(GAUGE_R * 1.02, 0.14),
  new THREE.Vector2(GAUGE_R * 0.92, 0.19),
  new THREE.Vector2(GAUGE_R * 0.80, 0.16),
  new THREE.Vector2(GAUGE_R * 0.82, 0.05),
  new THREE.Vector2(0.10, 0.04)
];
const bezel = new THREE.Mesh(new THREE.LatheGeometry(bezelProfile, 44), matBrass);
bezel.castShadow = true; bezel.receiveShadow = true;
bezel.rotation.x = -Math.PI / 2;   // face +Z
bezel.position.z = 0.22;
gaugeGroup.add(bezel);

// Dial face
const dial = mesh(new THREE.CylinderGeometry(GAUGE_R * 0.80, GAUGE_R * 0.80, 0.03, 40), matEnamel, 0, 0, 0.245);
dial.rotation.x = Math.PI / 2;
gaugeGroup.add(dial);

// Tick marks on the dial
const tickMat = new THREE.MeshStandardMaterial({ color: 0x2a2018, metalness: 0.1, roughness: 0.7 });
for (let i = 0; i <= 20; i++) {
  const a = (-Math.PI * 0.78) + (i / 20) * (Math.PI * 1.56);
  const major = (i % 5 === 0);
  const len = major ? 0.075 : 0.042;
  const w = major ? 0.022 : 0.012;
  const tick = new THREE.Mesh(new THREE.BoxGeometry(w, len, 0.012), tickMat);
  const rr = GAUGE_R * 0.80 - len * 0.5 - 0.025;
  // dial "up" is +Y, angle measured from top
  tick.position.set(Math.sin(a) * rr, Math.cos(a) * rr, 0.262);
  tick.rotation.z = -a;
  tick.castShadow = false;
  tick.receiveShadow = false;
  gaugeGroup.add(tick);
}

// Red danger arc
const arcGeo = new THREE.RingGeometry(GAUGE_R * 0.63, GAUGE_R * 0.74, 28, 1, Math.PI * 0.02, Math.PI * 0.32);
const arc = new THREE.Mesh(arcGeo, new THREE.MeshStandardMaterial({ color: 0x9c2b1c, roughness: 0.7, metalness: 0.0 }));
arc.position.z = 0.263;
gaugeGroup.add(arc);

// Needle + hub
const needleGroup = new THREE.Group();
needleGroup.position.set(0, 0, 0.268);
gaugeGroup.add(needleGroup);

const needleShape = makePlate([
  [-0.022, -0.055], [0.022, -0.055], [0.010, GAUGE_R * 0.70], [-0.010, GAUGE_R * 0.70]
], 0.014, 0.003);
const needle = new THREE.Mesh(needleShape, matNeedle);
needle.castShadow = false;
needleGroup.add(needle);

const needleHub = mesh(new THREE.CylinderGeometry(0.045, 0.055, 0.05, 16), matBrass, 0, 0, 0.276);
needleHub.rotation.x = Math.PI / 2;
gaugeGroup.add(needleHub);

// Glass crystal
const crystal = new THREE.Mesh(new THREE.CylinderGeometry(GAUGE_R * 0.81, GAUGE_R * 0.81, 0.02, 40), matGlass);
crystal.rotation.x = Math.PI / 2;
crystal.position.z = 0.288;
gaugeGroup.add(crystal);

// Bezel screws
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * TWO_PI + 0.2;
  gaugeGroup.add(rivet(Math.cos(a) * GAUGE_R * 0.90, Math.sin(a) * GAUGE_R * 0.90, 0.315, 0.030, matDarkIron, 'z'));
}
gaugeGroup.rotation.y = gaugeTilt;

/* ---------- 3. HEAD BODY (the fixed jaw shank / frame) ---------- */
const headGroup = new THREE.Group();
headGroup.position.set(0, HEAD_Y, 0);
wrench.add(headGroup);

// Main frame plate — profile drawn in XY, extruded in Z
const framePts = [
  [-0.42, -0.30],
  [0.42, -0.30],
  [0.52, 0.20],
  [0.56, 0.95],
  [0.48, 1.62],
  [0.20, 1.66],
  [0.14, 1.10],
  [-0.06, 0.55],
  [-0.30, 0.30],
  [-0.46, 0.02]
];
const frame = mesh(makePlate(framePts, 0.62, 0.05), matIron, 0, 0, 0);
headGroup.add(frame);

// Reinforcing web / boss on the frame face
const web = mesh(new THREE.BoxGeometry(0.34, 1.5, 0.10), matDarkIron, 0.33, 0.72, 0.34);
web.rotation.z = 0.03;
headGroup.add(web);
const web2 = web.clone();
web2.position.z = -0.34;
headGroup.add(web2);

// Rivets along the frame
const frameRivetPts = [
  [0.30, -0.10], [0.42, 0.42], [0.46, 0.96], [0.40, 1.44], [-0.16, 0.16]
];
frameRivetPts.forEach(p => {
  headGroup.add(rivet(p[0], p[1], 0.325, 0.055, matBrassDark, 'z'));
  headGroup.add(rivet(p[0], p[1], -0.325, 0.055, matBrassDark, '-z'));
});

/* ---------- 4. FIXED (upper) JAW — riveted iron ---------- */
const fixedJaw = new THREE.Group();
fixedJaw.position.set(0, 1.62, 0);
headGroup.add(fixedJaw);

const fixedJawPts = [
  [0.52, -0.10],
  [0.50, 0.62],
  [0.30, 0.86],
  [-0.62, 0.86],
  [-0.86, 0.66],
  [-0.86, 0.34],
  [-0.60, 0.30],
  [-0.20, 0.28],
  [0.10, 0.10],
  [0.20, -0.12]
];
const fixedJawMesh = mesh(makePlate(fixedJawPts, 0.60, 0.045), matIron, 0, 0, 0);
fixedJaw.add(fixedJawMesh);

// Serrated gripping teeth on the underside of the fixed jaw
const fixedTeeth = new THREE.Group();
fixedJaw.add(fixedTeeth);
for (let i = 0; i < 9; i++) {
  const x = -0.80 + i * 0.095;
  const th = new THREE.Mesh(new THREE.ConeGeometry(0.045, 0.115, 4), matSteelPolish);
  th.position.set(x, 0.245, 0);
  th.rotation.x = Math.PI / 2;
  th.rotation.y = Math.PI / 4;
  th.scale.set(1, 1, 5.2);
  th.castShadow = true;
  th.receiveShadow = true;
  // orient point downward
  th.rotation.z = Math.PI;
  fixedTeeth.add(th);
}
// straighten: rebuild simply as downward cones stretched in Z
fixedTeeth.clear();
for (let i = 0; i < 9; i++) {
  const x = -0.80 + i * 0.098;
  const g = new THREE.ConeGeometry(0.05, 0.12, 4, 1);
  g.rotateX(Math.PI);      // point down
  g.rotateY(Math.PI / 4);
  g.scale(1, 1, 4.6);
  const th = new THREE.Mesh(g, matSteelPolish);
  th.position.set(x, 0.30, 0);
  th.castShadow = true;
  th.receiveShadow = true;
  fixedTeeth.add(th);
}

// Rivet rows on the fixed jaw cheeks
for (let i = 0; i < 4; i++) {
  const x = -0.66 + i * 0.24;
  fixedJaw.add(rivet(x, 0.60, 0.315, 0.05, matBrassDark, 'z'));
  fixedJaw.add(rivet(x, 0.60, -0.315, 0.05, matBrassDark, '-z'));
}
fixedJaw.add(rivet(0.34, 0.20, 0.315, 0.062, matBrassDark, 'z'));
fixedJaw.add(rivet(0.34, 0.20, -0.315, 0.062, matBrassDark, '-z'));

/* ---------- 5. MOVABLE (lower) JAW on its slide ---------- */
const movJawGroup = new THREE.Group();
movJawGroup.position.set(0, 0.62, 0);
headGroup.add(movJawGroup);

// Slide bar riding in the frame
const slide = mesh(new THREE.BoxGeometry(0.30, 1.30, 0.44), matBluedSteel, 0.20, 0.16, 0);
movJawGroup.add(slide);
// dovetail rails
const railL = mesh(new THREE.BoxGeometry(0.10, 1.24, 0.10), matDarkIron, 0.20, 0.16, 0.26);
const railR = railL.clone(); railR.position.z = -0.26;

const movJawPts = [
  [0.34, -0.34],
  [0.34, 0.30],
  [0.06, 0.34],
  [-0.62, 0.30],
  [-0.84, 0.14],
  [-0.84, -0.20],
  [-0.56, -0.34],
  [0.02, -0.40]
];
const movJawMesh = mesh(makePlate(movJawPts, 0.58, 0.045), matIron, 0, 0.20, 0);
movJawGroup.add(movJawMesh);

// Upward serrated teeth
for (let i = 0; i < 9; i++) {
  const x = -0.78 + i * 0.098;
  const g = new THREE.ConeGeometry(0.05, 0.12, 4, 1);
  g.rotateY(Math.PI / 4);
  g.scale(1, 1, 4.4);
  const th = new THREE.Mesh(g, matSteelPolish);
  th.position.set(x, 0.56, 0);
  th.castShadow = true;
  th.receiveShadow = true;
  movJawGroup.add(th);
}

// Rivets on movable jaw
for (let i = 0; i < 3; i++) {
  const x = -0.60 + i * 0.26;
  movJawGroup.add(rivet(x, 0.28, 0.30, 0.048, matBrassDark, 'z'));
  movJawGroup.add(rivet(x, 0.28, -0.30, 0.048, matBrassDark, '-z'));
}

/* ---------- 6. ADJUSTMENT SCREW (knurled nut + threaded rod) ---------- */
const screwGroup = new THREE.Group();
screwGroup.position.set(0.20, 0.55, 0);
headGroup.add(screwGroup);

// Threaded rod core
const rodCore = mesh(new THREE.CylinderGeometry(0.13, 0.13, 1.55, 20), matSteelPolish, 0, 0.35, 0);
screwGroup.add(rodCore);
// Helical thread
const thread = new THREE.Mesh(makeThreadTube(0.145, 1.5, 13, 0.028), matSteelPolish);
thread.position.y = 0.35;
thread.castShadow = true;
thread.receiveShadow = true;
screwGroup.add(thread);

// Knurled adjusting nut (barrel with vertical knurl ridges)
const nutGroup = new THREE.Group();
nutGroup.position.set(0, 0.05, 0);
screwGroup.add(nutGroup);

const nutBody = mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.62, 32), matBronze, 0, 0, 0);
nutGroup.add(nutBody);
const knurlCount = 30;
for (let i = 0; i < knurlCount; i++) {
  const a = (i / knurlCount) * TWO_PI;
  const k = new THREE.Mesh(new THREE.BoxGeometry(0.026, 0.60, 0.05), matBrassDark);
  k.position.set(Math.cos(a) * 0.30, 0, Math.sin(a) * 0.30);
  k.rotation.y = -a;
  k.castShadow = true;
  k.receiveShadow = true;
  nutGroup.add(k);
}
// nut end flanges
const flangeTop = mesh(new THREE.CylinderGeometry(0.335, 0.335, 0.07, 32), matBrass, 0, 0.32, 0);
const flangeBot = mesh(new THREE.CylinderGeometry(0.335, 0.335, 0.07, 32), matBrass, 0, -0.32, 0);
nutGroup.add(flangeTop, flangeBot);

/* ---------- 7. EXPOSED CLOCKWORK MECHANISM ---------- */
const clockwork = new THREE.Group();
clockwork.position.set(0.34, 0.42, 0.46);
headGroup.add(clockwork);

// Back plate the gears mount to
const plate = mesh(makePlate([
  [-0.52, -0.44], [0.52, -0.50], [0.62, 0.24], [0.30, 0.62], [-0.34, 0.58], [-0.60, 0.10]
], 0.05, 0.02), matBrassDark, 0, 0.10, -0.10);
clockwork.add(plate);

// Standoff pillars
[[-0.42, -0.30], [0.44, -0.34], [0.36, 0.46], [-0.40, 0.40]].forEach(p => {
  const pil = mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.34, 10), matBrass, p[0], p[1] + 0.10, -0.28);
  pil.rotation.x = Math.PI / 2;
  clockwork.add(pil);
  clockwork.add(rivet(p[0], p[1] + 0.10, 0.02, 0.05, matDarkIron, 'z'));
});

// Gears — animated
const gearA = new THREE.Mesh(makeGear(0.42, 0.075, 20, 0.085, 0.075, 5), matBrass);
gearA.position.set(0.06, 0.10, 0.05);
gearA.castShadow = true; gearA.receiveShadow = true;
clockwork.add(gearA);

const gearB = new THREE.Mesh(makeGear(0.26, 0.06, 13, 0.075, 0.06, 4), matBronze);
gearB.position.set(0.06 + 0.42 + 0.26 + 0.005, 0.10 + 0.10, 0.02);
gearB.castShadow = true; gearB.receiveShadow = true;
clockwork.add(gearB);

const gearC = new THREE.Mesh(makeGear(0.20, 0.05, 11, 0.07, 0.05, 0), matSteelPolish);
gearC.position.set(0.06 - 0.42 - 0.20 - 0.01, 0.10 - 0.16, 0.06);
gearC.castShadow = true; gearC.receiveShadow = true;
clockwork.add(gearC);

const gearD = new THREE.Mesh(makeGear(0.15, 0.04, 9, 0.06, 0.04, 0), matBrassDark);
gearD.position.set(0.06 + 0.16, 0.10 + 0.55, 0.10);
gearD.castShadow = true; gearD.receiveShadow = true;
clockwork.add(gearD);

// Escapement-ish balance wheel with a glowing jewel
const balance = new THREE.Group();
balance.position.set(-0.30, 0.62, 0.12);
clockwork.add(balance);
const balRim = new THREE.Mesh(new THREE.TorusGeometry(0.20, 0.026, 10, 36), matBrass);
balRim.castShadow = true; balRim.receiveShadow = true;
balance.add(balRim);
for (let i = 0; i < 3; i++) {
  const a = (i / 3) * TWO_PI;
  const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.022, 0.022), matBrass);
  spoke.position.set(Math.cos(a) * 0.10, Math.sin(a) * 0.10, 0);
  spoke.rotation.z = a;
  spoke.castShadow = true;
  balance.add(spoke);
}
const jewel = new THREE.Mesh(new THREE.OctahedronGeometry(0.055, 0), matEmberGlow);
balance.add(jewel);

const jewelLight = new THREE.PointLight(0xff9a3c, 1.5, 3.2, 2);
jewelLight.position.copy(balance.position);
clockwork.add(jewelLight);

// Axle pins through gear centers
[[0.06, 0.10, 0.05], [0.735, 0.20, 0.02], [-0.57, -0.06, 0.06], [0.22, 0.65, 0.10]].forEach(p => {
  const pin = mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.24, 10), matSteelPolish, p[0], p[1], p[2] + 0.03);
  pin.rotation.x = Math.PI / 2;
  clockwork.add(pin);
  const cap = mesh(new THREE.SphereGeometry(0.05, 12, 10), matBrass, p[0], p[1], p[2] + 0.14);
  clockwork.add(cap);
});

// A mirrored (static) gear cluster on the far side for symmetry
const clockworkB = new THREE.Group();
clockworkB.position.set(0.34, 0.42, -0.46);
headGroup.add(clockworkB);
const plateB = plate.clone();
plateB.position.z = 0.10;
clockworkB.add(plateB);
const gearE = new THREE.Mesh(makeGear(0.32, 0.065, 16, 0.08, 0.06, 4), matBronze);
gearE.position.set(0.05, 0.14, -0.06);
gearE.castShadow = true; gearE.receiveShadow = true;
clockworkB.add(gearE);
const gearF = new THREE.Mesh(makeGear(0.18, 0.045, 10, 0.07, 0.045, 0), matBrass);
gearF.position.set(0.05 + 0.32 + 0.18, 0.14 + 0.06, -0.04);
gearF.castShadow = true; gearF.receiveShadow = true;
clockworkB.add(gearF);
const pinB1 = mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.22, 10), matSteelPolish, 0.05, 0.14, -0.10);
pinB1.rotation.x = Math.PI / 2;
clockworkB.add(pinB1);

/* ---------- 8. COPPER PIPING + BOILER CANISTER ---------- */
const plumbing = new THREE.Group();
wrench.add(plumbing);

// Small pressure vessel strapped to the handle
const canister = new THREE.Group();
canister.position.set(-0.52, HEAD_Y - 1.05, -0.10);
canister.rotation.z = 0.10;
plumbing.add(canister);

const canBody = mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.78, 24), matCopper, 0, 0, 0);
canister.add(canBody);
const canTop = mesh(new THREE.SphereGeometry(0.24, 24, 12, 0, TWO_PI, 0, Math.PI / 2), matCopper, 0, 0.39, 0);
const canBot = mesh(new THREE.SphereGeometry(0.24, 24, 12, Math.PI / 2, TWO_PI, 0, Math.PI / 2), matCopper, 0, -0.39, 0);
canBot.rotation.z = Math.PI;
canister.add(canTop, canBot);

// Bands + rivets on the canister
[-0.22, 0.22].forEach(y => {
  const band = mesh(new THREE.CylinderGeometry(0.252, 0.252, 0.07, 24), matBrassDark, 0, y, 0);
  canister.add(band);
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * TWO_PI;
    const rv = rivet(Math.cos(a) * 0.255, y, Math.sin(a) * 0.255, 0.028, matDarkIron);
    rv.lookAt(new THREE.Vector3(Math.cos(a) * 4, y, Math.sin(a) * 4));
    rv.rotateX(Math.PI * 0.5);
    canister.add(rv);
  }
});

// Tiny relief valve on top of the canister
const relief = mesh(new THREE.CylinderGeometry(0.055, 0.075, 0.16, 12), matBrass, 0, 0.5, 0);
canister.add(relief);
const reliefCap = mesh(new THREE.SphereGeometry(0.075, 14, 10), matBrass, 0, 0.585, 0);
canister.add(reliefCap);

// Copper pipes: canister -> gauge, canister -> head, head -> clockwork
const pipeA = new THREE.Mesh(makePipe([
  [-0.52, HEAD_Y - 0.55, -0.10],
  [-0.46, HEAD_Y - 0.42, 0.02],
  [-0.26, HEAD_Y - 0.55, 0.22],
  [-0.05, HEAD_Y - 0.72, 0.30],
  [0.00, HEAD_Y - 0.82, 0.16]
], 0.055, 60), matCopper);
pipeA.castShadow = true; pipeA.receiveShadow = true;
plumbing.add(pipeA);

const pipeB = new THREE.Mesh(makePipe([
  [-0.52, HEAD_Y - 1.46, -0.10],
  [-0.60, HEAD_Y - 1.80, -0.02],
  [-0.44, HEAD_Y - 2.05, 0.22],
  [-0.10, HEAD_Y - 2.15, 0.30],
  [0.10, HEAD_Y - 2.05, 0.16]
], 0.048, 60), matCopper);
pipeB.castShadow = true; pipeB.receiveShadow = true;
plumbing.add(pipeB);

const pipeC = new THREE.Mesh(makePipe([
  [-0.42, HEAD_Y - 0.90, -0.30],
  [-0.30, HEAD_Y + 0.05, -0.48],
  [0.00, HEAD_Y + 0.35, -0.56],
  [0.30, HEAD_Y + 0.42, -0.52]
], 0.05, 60), matCopper);
pipeC.castShadow = true; pipeC.receiveShadow = true;
plumbing.add(pipeC);

const pipeD = new THREE.Mesh(makePipe([
  [0.62, HEAD_Y + 0.10, 0.40],
  [0.86, HEAD_Y + 0.45, 0.30],
  [0.90, HEAD_Y + 0.95, 0.10],
  [0.72, HEAD_Y + 1.35, 0.02]
], 0.045, 60), matCopper);
pipeD.castShadow = true; pipeD.receiveShadow = true;
plumbing.add(pipeD);

// Union collars where pipes meet fittings
function unionAt(x, y, z, r, rot) {
  const u = mesh(new THREE.CylinderGeometry(r, r, 0.09, 12), matBrass, x, y, z);
  if (rot) u.rotation.set(rot[0], rot[1], rot[2]);
  plumbing.add(u);
  return u;
}
unionAt(-0.52, HEAD_Y - 0.53, -0.10, 0.085);
unionAt(-0.52, HEAD_Y - 1.44, -0.10, 0.078);
unionAt(0.63, HEAD_Y + 0.12, 0.39, 0.075, [Math.PI / 2, 0, 0.5]);
unionAt(0.72, HEAD_Y + 1.32, 0.02, 0.072, [0.2, 0, 0.1]);

/* ---------- 9. THE ORNATE VALVE HELD IN THE JAWS ---------- */
const valve = new THREE.Group();
valve.position.set(-0.35, HEAD_Y + 1.42, 0);
wrench.add(valve);

// Hex valve body clamped between the jaws
const valveBody = mesh(new THREE.CylinderGeometry(0.36, 0.36, 0.62, 6), matBronze, 0, 0, 0);
valve.add(valveBody);
// Flanged collars top and bottom of the hex
const vcTop = mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.10, 20), matBrass, 0, 0.36, 0);
const vcBot = mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.10, 20), matBrass, 0, -0.36, 0);
valve.add(vcTop, vcBot);

// Body of the valve above and below (pipe stubs)
const stubUp = mesh(new THREE.CylinderGeometry(0.20, 0.22, 0.55, 20), matCopper, 0, 0.68, 0);
valve.add(stubUp);
const stubDown = mesh(new THREE.CylinderGeometry(0.22, 0.20, 0.55, 20), matCopper, 0, -0.68, 0);
valve.add(stubDown);

// Flange plates on the stubs with bolt circles
function flange(y, r) {
  const f = mesh(new THREE.CylinderGeometry(r, r, 0.09, 24), matBrassDark, 0, y, 0);
  valve.add(f);
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * TWO_PI;
    const b = mesh(new THREE.CylinderGeometry(0.032, 0.032, 0.13, 6), matDarkIron,
      Math.cos(a) * (r - 0.07), y, Math.sin(a) * (r - 0.07));
    valve.add(b);
  }
}
flange(0.96, 0.32);
flange(-0.96, 0.32);

// Valve bonnet + handwheel on top
const bonnet = mesh(new THREE.CylinderGeometry(0.14, 0.20, 0.28, 16), matBrass, 0, 1.20, 0);
valve.add(bonnet);
const stem = mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.42, 12), matSteelPolish, 0, 1.48, 0);
valve.add(stem);

const wheel = new THREE.Group();
wheel.position.set(0, 1.68, 0);
valve.add(wheel);
const wheelRim = new THREE.Mesh(new THREE.TorusGeometry(0.30, 0.045, 12, 40), matBrass);
wheelRim.rotation.x = Math.PI / 2;
wheelRim.castShadow = true; wheelRim.receiveShadow = true;
wheel.add(wheelRim);
const wheelHub = mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.12, 14), matBrass, 0, 0, 0);
wheel.add(wheelHub);
for (let i = 0; i < 5; i++) {
  const a = (i / 5) * TWO_PI;
  const sp = new THREE.Mesh(new THREE.BoxGeometry(0.30, 0.045, 0.045), matBrass);
  sp.position.set(Math.cos(a) * 0.16, 0, Math.sin(a) * 0.16);
  sp.rotation.y = -a;
  sp.castShadow = true; sp.receiveShadow = true;
  wheel.add(sp);
}

// Ornate filigree ring around the valve body
for (let i = 0; i < 6; i++) {
  const a = (i / 6) * TWO_PI + 0.3;
  const orn = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.020, 8, 20), matBrass);
  orn.position.set(Math.cos(a) * 0.36, 0.02, Math.sin(a) * 0.36);
  orn.lookAt(new THREE.Vector3(Math.cos(a) * 3, 0.02, Math.sin(a) * 3));
  orn.castShadow = true; orn.receiveShadow = true;
  valve.add(orn);
}

// Small tag/plate chained to the valve
const tag = mesh(new THREE.BoxGeometry(0.16, 0.22, 0.02), matBrassDark, 0.42, 0.55, 0.26);
tag.rotation.set(0.2, -0.4, 0.25);
valve.add(tag);

valve.rotation.z = 0.03;

/* ---------- 10. FINAL PLACEMENT / CENTERING ---------- */
// Give the whole tool a pleasing tilt, then center it on the origin.
wrench.rotation.set(0, 0.34, -0.10);

const bbox = new THREE.Box3().setFromObject(wrench);
const size = new THREE.Vector3();
const center = new THREE.Vector3();
bbox.getSize(size);
bbox.getCenter(center);

// Scale so the tool comfortably fills the frame
const targetHeight = 5.6;
const s = targetHeight / Math.max(0.001, size.y);
wrench.scale.setScalar(s);

// Recompute and center at y ≈ 0.9 above ground
const bbox2 = new THREE.Box3().setFromObject(wrench);
const c2 = new THREE.Vector3();
bbox2.getCenter(c2);
wrench.position.sub(c2);
wrench.position.y += 3.05;

const bbox3 = new THREE.Box3().setFromObject(wrench);
const GROUND_Y = bbox3.min.y - 0.55;

/* ============================================================
   GROUND (shadow only)
   ============================================================ */
const shadowFloor = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
shadowFloor.rotation.x = -Math.PI / 2;
shadowFloor.position.y = GROUND_Y;
shadowFloor.receiveShadow = true;
scene.add(shadowFloor);

controls.target.set(0, (bbox3.min.y + bbox3.max.y) * 0.5, 0);
camera.position.set(6.6, controls.target.y + 2.4, 8.8);

/* ============================================================
   LIGHTING: hemisphere + key + fill + rim
   ============================================================ */
const hemi = new THREE.HemisphereLight(0x9fb4c8, 0x241a12, 0.42);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff0d4, 2.5);
key.position.set(6.5, 9.5, 6.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 40;
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -8;
key.shadow.bias = -0.0008;
key.shadow.normalBias = 0.02;
key.shadow.radius = 3;
scene.add(key);

const fill = new THREE.DirectionalLight(0x6f8fb8, 0.75);
fill.position.set(-7.0, 3.2, 5.0);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffb066, 1.5);
rim.position.set(-4.5, 5.0, -7.5);
scene.add(rim);

// Warm practical bounce near the base for a forge-lit feel
const forge = new THREE.PointLight(0xff7a2a, 1.6, 14, 2);
forge.position.set(-2.6, GROUND_Y + 1.0, -2.2);
scene.add(forge);

// A soft cool bounce from the front to read the blued steel
const frontFill = new THREE.PointLight(0xa8c4e6, 0.9, 18, 2);
frontFill.position.set(2.4, 1.6, 5.4);
scene.add(frontFill);

/* ============================================================
   ANIMATION
   ============================================================ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // Clockwork drives the adjustment screw
  const w = 0.55;
  gearA.rotation.z = t * w;
  gearB.rotation.z = -t * w * (20 / 13) + 0.25;
  gearC.rotation.z = -t * w * (20 / 11);
  gearD.rotation.z = t * w * 1.6;
  gearE.rotation.z = -t * w * 0.8;
  gearF.rotation.z = t * w * 1.4;

  balance.rotation.z = Math.sin(t * 2.3) * 0.9;
  jewel.rotation.y = t * 1.4;
  jewel.rotation.x = t * 0.9;
  matEmberGlow.emissiveIntensity = 1.25 + Math.sin(t * 3.1) * 0.45;
  jewelLight.intensity = 1.2 + Math.sin(t * 3.1) * 0.45;

  // Adjusting nut + threaded rod spin in sympathy
  nutGroup.rotation.y = -t * w * 0.9;
  thread.rotation.y = -t * w * 0.9;
  rodCore.rotation.y = -t * w * 0.9;

  // Movable jaw creeps microscopically as the screw turns
  movJawGroup.position.y = 0.62 + Math.sin(t * 0.5) * 0.022;

  // Pressure needle jitters within the dial sweep
  const p = 0.5 + 0.34 * Math.sin(t * 0.7) + 0.05 * Math.sin(t * 5.3);
  needleGroup.rotation.z = -((-Math.PI * 0.78) + p * (Math.PI * 1.56));

  // Forge light flicker
  forge.intensity = 1.35 + Math.sin(t * 7.3) * 0.18 + Math.sin(t * 2.1) * 0.12;

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ============================================================
   RESIZE
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
