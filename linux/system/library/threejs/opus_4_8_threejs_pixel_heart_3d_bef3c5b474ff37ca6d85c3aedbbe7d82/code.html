<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Voxel Pixel Heart</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15161c; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="app"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- Renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

/* ---------- Scene & Camera ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15161c);

const camera = new THREE.PerspectiveCamera(
  42, window.innerWidth / window.innerHeight, 0.1, 300
);
camera.position.set(7, 5.5, 21);

/* ---------- Controls ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 9;
controls.maxDistance = 48;
controls.target.set(0, 0.2, 0);
controls.update();

/* ---------- Lighting: hemi fill + key + fill + rim ---------- */
const hemi = new THREE.HemisphereLight(0xbcd2ff, 0x241612, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff1e2, 2.5);
key.position.set(9, 13, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 70;
key.shadow.camera.left = -16;
key.shadow.camera.right = 16;
key.shadow.camera.top = 16;
key.shadow.camera.bottom = -16;
key.shadow.bias = -0.0005;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9bb8ff, 0.55);
fill.position.set(-11, 5, 7);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xff5f74, 0.9);
rim.position.set(-7, 7, -13);
scene.add(rim);

/* ---------- Ground plane (receives shadow only) ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -7.2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- Voxel heart definition (pixel silhouette) ---------- */
const rows = [
  "..OOO...OOO..",
  ".OOOOO.OOOOO.",
  "OOOOOOOOOOOOO",
  "OOOOOOOOOOOOO",
  "OOOOOOOOOOOOO",
  ".OOOOOOOOOOO.",
  "..OOOOOOOOO..",
  "...OOOOOOO...",
  "....OOOOO....",
  ".....OOO.....",
  "......O......"
];
const H = rows.length;         // 11
const W = rows[0].length;      // 13
const inMask  = (r, c) => r >= 0 && r < H && c >= 0 && c < W && rows[r][c] === 'O';
const eroded  = (r, c) => inMask(r, c) && inMask(r - 1, c) && inMask(r + 1, c) &&
                          inMask(r, c - 1) && inMask(r, c + 1);

const spacing = 1.0;
const boxSize = 0.9;           // chunky cubes with visible seams
const offX = (W - 1) / 2;
const offY = (H - 1) / 2;

// Lighter "shine" voxels on the upper-left lobe
const highlightCells = new Set(['1,3', '1,4', '2,3']);

const dummy = new THREE.Object3D();
const bodyMatrices = [];
const hlMatrices = [];
let minCubeY = Infinity;

for (let r = 0; r < H; r++) {
  for (let c = 0; c < W; c++) {
    if (!inMask(r, c)) continue;
    const x = (c - offX) * spacing;
    const y = (offY - r) * spacing;

    // Onion-style depth: 3-deep core, +2 shell layers on interior cells for a rounded bevel
    const zList = [-1, 0, 1];
    if (eroded(r, c)) { zList.unshift(-2); zList.push(2); }
    const frontZ = zList[zList.length - 1];

    for (const zi of zList) {
      dummy.position.set(x, y, zi * spacing);
      dummy.rotation.set(0, 0, 0);
      dummy.updateMatrix();
      const isHL = highlightCells.has(r + ',' + c) && zi === frontZ;
      (isHL ? hlMatrices : bodyMatrices).push(dummy.matrix.clone());
      if (y - boxSize / 2 < minCubeY) minCubeY = y - boxSize / 2;
    }
  }
}

/* ---------- Materials & instanced meshes ---------- */
const boxGeo = new THREE.BoxGeometry(boxSize, boxSize, boxSize);

const bodyMat = new THREE.MeshStandardMaterial({
  color: 0xe11d2c,
  roughness: 0.5,
  metalness: 0.06,
  emissive: 0x3a040a,
  emissiveIntensity: 0.35
});

const hlMat = new THREE.MeshStandardMaterial({
  color: 0xff9fb1,
  roughness: 0.38,
  metalness: 0.0,
  emissive: 0xff5068,
  emissiveIntensity: 0.55
});

const heart = new THREE.Group();

const bodyMesh = new THREE.InstancedMesh(boxGeo, bodyMat, bodyMatrices.length);
bodyMatrices.forEach((m, i) => bodyMesh.setMatrixAt(i, m));
bodyMesh.instanceMatrix.needsUpdate = true;
bodyMesh.castShadow = true;
bodyMesh.receiveShadow = true;
heart.add(bodyMesh);

if (hlMatrices.length > 0) {
  const hlMesh = new THREE.InstancedMesh(boxGeo, hlMat, hlMatrices.length);
  hlMatrices.forEach((m, i) => hlMesh.setMatrixAt(i, m));
  hlMesh.instanceMatrix.needsUpdate = true;
  hlMesh.castShadow = true;
  hlMesh.receiveShadow = true;
  heart.add(hlMesh);
}

scene.add(heart);

/* ---------- Animation ---------- */
const clock = new THREE.Clock();
const baseY = 0.4;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  heart.position.y = baseY + Math.sin(t * 1.2) * 0.35;   // gentle float
  heart.rotation.z = Math.sin(t * 0.8) * 0.02;           // subtle sway
  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ---------- Resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});
</script>
</body>
</html>
