<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seated Bronze Memorial</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171a18;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171a18);
scene.fog = new THREE.FogExp2(0x171a18, 0.018);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(9.4, 6.4, 11.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.75, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
controls.minDistance = 6;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.48;

const bronze = new THREE.MeshStandardMaterial({
  color: 0x3e352b,
  roughness: 0.68,
  metalness: 0.78
});
const bronzeLight = new THREE.MeshStandardMaterial({
  color: 0x66513a,
  roughness: 0.57,
  metalness: 0.82
});
const bronzeDark = new THREE.MeshStandardMaterial({
  color: 0x211f1b,
  roughness: 0.78,
  metalness: 0.72
});
const patina = new THREE.MeshStandardMaterial({
  color: 0x294b43,
  roughness: 0.88,
  metalness: 0.52
});
const wood = new THREE.MeshStandardMaterial({
  color: 0x3a2920,
  roughness: 0.72,
  metalness: 0.12
});
const iron = new THREE.MeshStandardMaterial({
  color: 0x171817,
  roughness: 0.54,
  metalness: 0.8
});
const stone = new THREE.MeshStandardMaterial({
  color: 0x5d5b53,
  roughness: 0.94,
  metalness: 0.02
});

function mesh(geometry, material, position, scale, rotation) {
  const object = new THREE.Mesh(geometry, material);
  if (position) object.position.set(...position);
  if (scale) object.scale.set(...scale);
  if (rotation) object.rotation.set(...rotation);
  object.castShadow = true;
  object.receiveShadow = true;
  scene.add(object);
  return object;
}

function capsuleBetween(a, b, radius, material, radialSegments = 12) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const direction = end.clone().sub(start);
  const distance = direction.length();
  const geometry = new THREE.CapsuleGeometry(
    radius,
    Math.max(0.015, distance - radius * 2),
    7,
    radialSegments
  );
  const object = new THREE.Mesh(geometry, material);
  object.position.copy(start).add(end).multiplyScalar(0.5);
  object.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    direction.normalize()
  );
  object.castShadow = true;
  object.receiveShadow = true;
  scene.add(object);
  return object;
}

function curveTube(points, radius, material, segments = 24) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  return mesh(new THREE.TubeGeometry(curve, segments, radius, 8, false), material);
}

const ground = mesh(
  new THREE.CircleGeometry(18, 96),
  new THREE.MeshStandardMaterial({ color: 0x282b27, roughness: 1 }),
  [0, -0.035, 0],
  null,
  [-Math.PI / 2, 0, 0]
);
ground.receiveShadow = true;
ground.castShadow = false;

mesh(new THREE.CylinderGeometry(4.9, 5.1, 0.24, 64), stone, [0, 0.09, 0]);
mesh(new THREE.CylinderGeometry(4.55, 4.68, 0.12, 64), bronzeDark, [0, 0.26, 0]);

// Bench seat and back
for (let i = 0; i < 4; i++) {
  mesh(
    new THREE.BoxGeometry(7.3, 0.15, 0.46),
    wood,
    [0, 2.18, -0.72 + i * 0.47]
  );
}
for (let i = 0; i < 4; i++) {
  mesh(
    new THREE.BoxGeometry(7.3, 0.17, 0.34),
    wood,
    [0, 2.72 + i * 0.43, -1.03],
    null,
    [0.06, 0, 0]
  );
}

for (const x of [-2.85, 2.85]) {
  capsuleBetween([x, 0.35, -0.64], [x, 2.17, -0.48], 0.13, iron);
  capsuleBetween([x, 0.35, 0.62], [x, 2.17, 0.47], 0.13, iron);
  capsuleBetween([x, 2.14, -0.56], [x, 4.12, -1.05], 0.12, iron);
  capsuleBetween([x, 0.38, -0.62], [x, 0.38, 0.62], 0.14, iron);
  mesh(new THREE.CylinderGeometry(0.24, 0.28, 0.12, 18), iron, [x, 0.28, -0.66]);
  mesh(new THREE.CylinderGeometry(0.24, 0.28, 0.12, 18), iron, [x, 0.28, 0.66]);
}
capsuleBetween([-3.15, 2.42, -0.92], [-3.15, 2.42, 0.7], 0.1, iron);
capsuleBetween([3.15, 2.42, -0.92], [3.15, 2.42, 0.7], 0.1, iron);

// Seated figure: lower coat and legs
mesh(
  new THREE.SphereGeometry(1, 32, 24),
  bronze,
  [-0.62, 3.02, 0.12],
  [1.03, 0.78, 0.76],
  [0.08, 0, -0.02]
);
mesh(
  new THREE.CylinderGeometry(0.72, 0.98, 1.7, 24, 5),
  bronze,
  [-0.66, 3.82, -0.04],
  [1, 1, 0.82],
  [0.2, 0, 0.025]
);
mesh(
  new THREE.SphereGeometry(1, 32, 20),
  bronze,
  [-0.65, 4.55, 0.13],
  [1.0, 0.45, 0.56],
  [0.19, 0, 0.02]
);

// Coat lapels, collar, hem and folds
curveTube(
  [[-1.13, 4.58, 0.52], [-0.86, 4.13, 0.65], [-0.67, 3.54, 0.72]],
  0.075, bronzeLight
);
curveTube(
  [[-0.19, 4.55, 0.52], [-0.43, 4.14, 0.68], [-0.61, 3.54, 0.73]],
  0.075, bronzeLight
);
curveTube(
  [[-1.55, 2.82, 0.24], [-1.18, 2.68, 0.72], [-0.68, 2.58, 0.88], [0.24, 2.62, 0.57]],
  0.055, bronzeDark
);
curveTube(
  [[-1.18, 3.38, 0.66], [-1.23, 3.03, 0.83], [-1.18, 2.68, 0.95]],
  0.032, bronzeLight
);
curveTube(
  [[-0.47, 3.45, 0.73], [-0.36, 3.04, 0.93], [-0.18, 2.68, 0.93]],
  0.034, bronzeLight
);

for (const p of [
  [-0.64, 3.75, 0.7],
  [-0.62, 3.43, 0.76],
  [-0.59, 3.13, 0.78]
]) {
  mesh(new THREE.SphereGeometry(0.075, 16, 12), bronzeLight, p, [1, 1, 0.55]);
}

// Thighs, trousers, shins
capsuleBetween([-1.08, 2.77, 0.18], [-1.17, 1.92, 1.14], 0.31, bronzeDark);
capsuleBetween([-0.23, 2.76, 0.2], [-0.11, 1.91, 1.09], 0.3, bronzeDark);
capsuleBetween([-1.17, 1.93, 1.13], [-1.24, 0.64, 0.91], 0.245, bronzeDark);
capsuleBetween([-0.11, 1.92, 1.08], [0.02, 0.62, 0.98], 0.235, bronzeDark);

mesh(
  new THREE.SphereGeometry(1, 24, 16),
  bronzeDark,
  [-1.22, 0.49, 1.24],
  [0.38, 0.22, 0.68],
  [0.04, 0, 0]
);
mesh(
  new THREE.SphereGeometry(1, 24, 16),
  bronzeDark,
  [0.06, 0.48, 1.3],
  [0.37, 0.21, 0.7],
  [0.02, 0.04, 0]
);

// Shoulders and sleeves, bent inward toward the lap
capsuleBetween([-1.47, 4.51, 0.17], [-1.59, 3.66, 0.55], 0.265, bronze);
capsuleBetween([-1.59, 3.66, 0.55], [-1.15, 2.93, 0.93], 0.235, bronze);
capsuleBetween([0.16, 4.46, 0.19], [0.28, 3.62, 0.58], 0.255, bronze);
capsuleBetween([0.28, 3.62, 0.58], [-0.08, 2.95, 0.98], 0.225, bronze);

for (const p of [
  [-1.5, 4.03, 0.48],
  [0.2, 4.02, 0.49],
  [-1.38, 3.35, 0.76],
  [0.14, 3.34, 0.78]
]) {
  mesh(new THREE.TorusGeometry(0.2, 0.026, 8, 20), bronzeLight, p, null, [Math.PI / 2, 0, 0]);
}

// Hands folded loosely in the lap
mesh(
  new THREE.SphereGeometry(1, 24, 16),
  bronzeLight,
  [-0.85, 2.87, 1.08],
  [0.42, 0.16, 0.22],
  [0.08, -0.18, -0.1]
);
mesh(
  new THREE.SphereGeometry(1, 24, 16),
  bronzeLight,
  [-0.39, 2.93, 1.13],
  [0.41, 0.16, 0.22],
  [-0.06, 0.17, 0.08]
);
for (let i = 0; i < 4; i++) {
  capsuleBetween(
    [-1.12 + i * 0.1, 2.91 + i * 0.009, 1.22],
    [-0.74 + i * 0.1, 2.91 + i * 0.004, 1.23],
    0.025,
    bronzeLight,
    8
  );
  capsuleBetween(
    [-0.63 + i * 0.095, 2.98 - i * 0.008, 1.26],
    [-0.27 + i * 0.09, 2.96 - i * 0.01, 1.24],
    0.023,
    bronzeLight,
    8
  );
}

// Neck and bowed head
capsuleBetween([-0.68, 4.66, 0.2], [-0.67, 4.98, 0.42], 0.25, bronze);
mesh(
  new THREE.SphereGeometry(1, 36, 28),
  bronze,
  [-0.68, 5.25, 0.58],
  [0.48, 0.61, 0.46],
  [0.25, 0, 0.03]
);
mesh(new THREE.SphereGeometry(1, 20, 14), bronze, [-1.14, 5.26, 0.55], [0.09, 0.15, 0.055]);
mesh(new THREE.SphereGeometry(1, 20, 14), bronze, [-0.22, 5.26, 0.55], [0.09, 0.15, 0.055]);

// Restrained facial planes
mesh(
  new THREE.ConeGeometry(0.105, 0.32, 14),
  bronzeLight,
  [-0.68, 5.32, 1.01],
  null,
  [Math.PI / 2, 0, 0]
);
curveTube(
  [[-0.86, 5.47, 0.98], [-0.77, 5.49, 1.015], [-0.7, 5.47, 1.025]],
  0.018, bronzeDark, 12
);
curveTube(
  [[-0.66, 5.47, 1.025], [-0.57, 5.49, 1.015], [-0.49, 5.46, 0.98]],
  0.018, bronzeDark, 12
);
curveTube(
  [[-0.84, 5.09, 0.98], [-0.68, 5.05, 1.025], [-0.5, 5.08, 0.98]],
  0.022, bronzeDark, 14
);
curveTube(
  [[-1.04, 5.56, 0.72], [-0.87, 5.77, 0.56], [-0.56, 5.85, 0.46], [-0.31, 5.66, 0.55]],
  0.035, bronzeLight, 18
);

// Subtle patina in sheltered areas
for (const patch of [
  [-1.36, 4.33, 0.49, 0.14, 0.21, 0.035],
  [-0.06, 4.18, 0.54, 0.1, 0.2, 0.03],
  [-1.3, 3.07, 0.79, 0.13, 0.17, 0.028],
  [-0.53, 3.64, 0.76, 0.08, 0.13, 0.026],
  [-0.91, 5.16, 0.97, 0.06, 0.08, 0.018]
]) {
  mesh(
    new THREE.SphereGeometry(1, 12, 8),
    patina,
    patch.slice(0, 3),
    patch.slice(3),
    [0, 0, 0]
  );
}

// Small memorial plaque
mesh(new THREE.BoxGeometry(1.75, 0.04, 0.72), bronzeLight, [0, 0.37, 3.18], null, [-0.08, 0, 0]);
mesh(new THREE.BoxGeometry(1.55, 0.025, 0.025), bronzeDark, [0, 0.404, 3.13]);
for (const y of [3.02, 3.15, 3.28]) {
  mesh(new THREE.BoxGeometry(1.12, 0.018, 0.018), bronzeDark, [0, 0.41, y]);
}

const hemi = new THREE.HemisphereLight(0xb9c7c1, 0x30251d, 1.25);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe3bf, 4.1);
key.position.set(5.5, 10, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 9;
key.shadow.camera.bottom = -3;
key.shadow.camera.near = 1;
key.shadow.camera.far = 30;
key.shadow.bias = -0.0003;
scene.add(key);

const rim = new THREE.DirectionalLight(0x87aaa3, 2.0);
rim.position.set(-7, 6, -5);
scene.add(rim);

const warm = new THREE.PointLight(0xd28e52, 32, 12, 2);
warm.position.set(4, 2.1, 3.5);
scene.add(warm);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
