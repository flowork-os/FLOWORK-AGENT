<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worn Brass House Key</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111316;
      font-family: Georgia, serif;
    }

    #scene {
      display: block;
      width: 100%;
      height: 100%;
    }

    .caption {
      position: fixed;
      left: 28px;
      bottom: 24px;
      color: rgba(246, 221, 171, 0.74);
      letter-spacing: 0.16em;
      font-size: 11px;
      text-transform: uppercase;
      pointer-events: none;
      text-shadow: 0 1px 8px #000;
    }

    .caption span {
      display: block;
      margin-top: 6px;
      color: rgba(246, 221, 171, 0.4);
      letter-spacing: 0.08em;
      font-size: 9px;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="caption">Worn brass house key<span>procedural study · orbit to inspect</span></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const canvas = document.getElementById("scene");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111316);
    scene.fog = new THREE.Fog(0x111316, 9, 18);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(5.6, 4.8, 6.6);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.72;
    controls.minDistance = 4.2;
    controls.maxDistance = 12;
    controls.maxPolarAngle = 1.48;
    controls.target.set(0.85, -0.82, 0.02);

    const brassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xb78238,
      metalness: 0.9,
      roughness: 0.29,
      clearcoat: 0.18,
      clearcoatRoughness: 0.23
    });

    const edgeBrassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x76501e,
      metalness: 0.84,
      roughness: 0.38
    });

    const polishedWearMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xe0ae58,
      metalness: 0.94,
      roughness: 0.2,
      clearcoat: 0.3,
      clearcoatRoughness: 0.18
    });

    const darkWearMaterial = new THREE.MeshStandardMaterial({
      color: 0x4d3519,
      metalness: 0.7,
      roughness: 0.46
    });

    const shadowMaterial = new THREE.MeshStandardMaterial({
      color: 0x17191b,
      roughness: 0.68,
      metalness: 0.08
    });

    function roundedBowShape(centerX, centerY, width, height, radius, holeX, holeY, holeRX, holeRY) {
      const left = centerX - width / 2;
      const right = centerX + width / 2;
      const bottom = centerY - height / 2;
      const top = centerY + height / 2;
      const bowShape = new THREE.Shape();

      bowShape.moveTo(left + radius, bottom);
      bowShape.lineTo(right - radius, bottom);
      bowShape.quadraticCurveTo(right, bottom, right, bottom + radius);
      bowShape.lineTo(right, top - radius);
      bowShape.quadraticCurveTo(right, top, right - radius, top);
      bowShape.lineTo(left + radius, top);
      bowShape.quadraticCurveTo(left, top, left, top - radius);
      bowShape.lineTo(left, bottom + radius);
      bowShape.quadraticCurveTo(left, bottom, left + radius, bottom);

      const holePath = new THREE.Path();
      holePath.absellipse(holeX, holeY, holeRX, holeRY, 0, Math.PI * 2, false, 0);
      bowShape.holes.push(holePath);

      return bowShape;
    }

    function makeExtrudedMesh(shape, depth, bevelSize, bevelThickness) {
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth,
        steps: 1,
        curveSegments: 12,
        bevelEnabled: true,
        bevelSegments: 3,
        bevelSize,
        bevelThickness
      });
      geometry.translate(0, 0, -depth / 2);
      const mesh = new THREE.Mesh(geometry, [brassMaterial, edgeBrassMaterial]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    const keyGroup = new THREE.Group();
    keyGroup.position.set(0, -0.82, 0);
    keyGroup.rotation.set(-Math.PI / 2 + 0.16, -0.07, 0.045);
    scene.add(keyGroup);

    const bowShape = roundedBowShape(
      -1.56,
      0.1,
      1.56,
      1.62,
      0.43,
      -1.56,
      0.1,
      0.39,
      0.5
    );
    const bowMesh = makeExtrudedMesh(bowShape, 0.24, 0.055, 0.045);
    keyGroup.add(bowMesh);

    const shoulderShape = new THREE.Shape();
    shoulderShape.moveTo(-0.92, 0.37);
    shoulderShape.lineTo(-0.67, 0.49);
    shoulderShape.lineTo(0.08, 0.49);
    shoulderShape.lineTo(0.08, -0.45);
    shoulderShape.lineTo(-0.67, -0.45);
    shoulderShape.lineTo(-0.92, -0.29);
    shoulderShape.lineTo(-0.92, 0.37);

    const shoulderMesh = makeExtrudedMesh(shoulderShape, 0.25, 0.045, 0.04);
    keyGroup.add(shoulderMesh);

    const bladeShape = new THREE.Shape();
    bladeShape.moveTo(-0.77, 0.37);
    bladeShape.lineTo(3.98, 0.37);
    bladeShape.lineTo(4.19, 0.25);
    bladeShape.lineTo(4.19, -0.23);
    bladeShape.lineTo(3.87, -0.23);
    bladeShape.lineTo(3.78, -0.37);
    bladeShape.lineTo(3.43, -0.37);
    bladeShape.lineTo(3.34, -0.24);
    bladeShape.lineTo(3.02, -0.24);
    bladeShape.lineTo(2.94, -0.35);
    bladeShape.lineTo(2.59, -0.35);
    bladeShape.lineTo(2.51, -0.23);
    bladeShape.lineTo(2.19, -0.23);
    bladeShape.lineTo(2.1, -0.33);
    bladeShape.lineTo(1.75, -0.33);
    bladeShape.lineTo(1.67, -0.21);
    bladeShape.lineTo(1.33, -0.21);
    bladeShape.lineTo(1.24, -0.31);
    bladeShape.lineTo(0.9, -0.31);
    bladeShape.lineTo(0.81, -0.19);
    bladeShape.lineTo(0.45, -0.19);
    bladeShape.lineTo(0.35, -0.3);
    bladeShape.lineTo(-0.02, -0.3);
    bladeShape.lineTo(-0.13, -0.25);
    bladeShape.lineTo(-0.77, -0.25);
    bladeShape.lineTo(-0.77, 0.37);

    const bladeMesh = makeExtrudedMesh(bladeShape, 0.2, 0.04, 0.035);
    keyGroup.add(bladeMesh);

    const holeWear = new THREE.Mesh(
      new THREE.TorusGeometry(0.397, 0.026, 10, 56),
      polishedWearMaterial
    );
    holeWear.position.set(-1.56, 0.1, 0.17);
    holeWear.scale.y = 1.25;
    holeWear.castShadow = true;
    keyGroup.add(holeWear);

    const innerWear = new THREE.Mesh(
      new THREE.TorusGeometry(0.385, 0.012, 8, 56),
      darkWearMaterial
    );
    innerWear.position.set(-1.56, 0.1, 0.188);
    innerWear.scale.y = 1.25;
    keyGroup.add(innerWear);

    const bowHighlight = new THREE.Mesh(
      new THREE.TorusGeometry(0.61, 0.012, 8, 64),
      polishedWearMaterial
    );
    bowHighlight.position.set(-1.56, 0.1, 0.152);
    bowHighlight.scale.set(1.04, 1.28, 1);
    bowHighlight.material.opacity = 0.28;
    bowHighlight.material.transparent = true;
    keyGroup.add(bowHighlight);

    const topRidge = new THREE.Mesh(
      new THREE.BoxGeometry(3.76, 0.026, 0.014),
      polishedWearMaterial
    );
    topRidge.position.set(1.72, 0.335, 0.158);
    topRidge.rotation.z = -0.012;
    topRidge.castShadow = true;
    keyGroup.add(topRidge);

    const faceWarmth = new THREE.Mesh(
      new THREE.BoxGeometry(2.95, 0.018, 0.009),
      new THREE.MeshStandardMaterial({
        color: 0xc79243,
        metalness: 0.84,
        roughness: 0.31
      })
    );
    faceWarmth.position.set(1.55, 0.09, 0.16);
    keyGroup.add(faceWarmth);

    const grooveMarks = [
      [0.24, -0.277, 0.23, -0.08],
      [0.66, -0.283, 0.2, 0.03],
      [1.08, -0.294, 0.22, -0.04],
      [1.51, -0.304, 0.2, 0.04],
      [1.95, -0.305, 0.22, -0.05],
      [2.39, -0.325, 0.2, 0.03],
      [2.82, -0.334, 0.21, -0.03],
      [3.28, -0.344, 0.2, 0.04],
      [3.7, -0.342, 0.18, -0.04]
    ];

    grooveMarks.forEach((mark, index) => {
      const groove = new THREE.Mesh(
        new THREE.BoxGeometry(mark[2], 0.015, 0.01),
        index % 3 === 0 ? darkWearMaterial : edgeBrassMaterial
      );
      groove.position.set(mark[0], mark[1], 0.16);
      groove.rotation.z = mark[3];
      keyGroup.add(groove);
    });

    const smallScuffGeometry = new THREE.BoxGeometry(0.11, 0.012, 0.008);
    const scuffPositions = [
      [0.9, 0.18, -0.12],
      [1.41, 0.23, 0.08],
      [2.17, 0.16, -0.06],
      [2.76, 0.21, 0.1],
      [3.45, 0.15, -0.1]
    ];

    scuffPositions.forEach((position, index) => {
      const scuff = new THREE.Mesh(
        smallScuffGeometry,
        index % 2 === 0 ? polishedWearMaterial : darkWearMaterial
      );
      scuff.position.set(position[0], position[1], 0.165);
      scuff.rotation.z = position[2];
      keyGroup.add(scuff);
    });

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(24, 24),
      shadowMaterial
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.03;
    ground.receiveShadow = true;
    scene.add(ground);

    const groundAccent = new THREE.Mesh(
      new THREE.CircleGeometry(4.8, 96),
      new THREE.MeshStandardMaterial({
        color: 0x202326,
        roughness: 0.74,
        metalness: 0.04,
        transparent: true,
        opacity: 0.65
      })
    );
    groundAccent.rotation.x = -Math.PI / 2;
    groundAccent.position.set(0.5, -1.021, 0);
    groundAccent.receiveShadow = true;
    scene.add(groundAccent);

    const hemisphere = new THREE.HemisphereLight(0xf2dfbc, 0x19130c, 1.55);
    scene.add(hemisphere);

    const keyLight = new THREE.DirectionalLight(0xffd99a, 3.2);
    keyLight.position.set(-4.5, 7.5, 5.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.left = -6;
    keyLight.shadow.camera.right = 7;
    keyLight.shadow.camera.top = 5;
    keyLight.shadow.camera.bottom = -5;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 18;
    keyLight.shadow.bias = -0.00035;
    scene.add(keyLight);

    const coolFill = new THREE.PointLight(0x91a8c7, 42, 13, 2);
    coolFill.position.set(4.5, 3.2, -3.8);
    scene.add(coolFill);

    const warmFill = new THREE.PointLight(0xffb454, 34, 11, 2);
    warmFill.position.set(-3.6, 1.8, 3.8);
    scene.add(warmFill);

    const rimLight = new THREE.SpotLight(0xffe5bd, 85, 14, 0.46, 0.6, 1.4);
    rimLight.position.set(2.2, 6.3, -4.5);
    rimLight.target.position.set(1, -0.8, 0);
    scene.add(rimLight);
    scene.add(rimLight.target);

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(width, height);
    }

    window.addEventListener("resize", resize);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
