<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papercraft Hot Air Balloon</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #e9e2d5; }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e2d5);
scene.fog = new THREE.Fog(0xe9e2d5, 12, 24);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.2, 2.8, 9.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.35, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 7;
controls.maxDistance = 17;
controls.maxPolarAngle = Math.PI * 0.78;

scene.add(new THREE.HemisphereLight(0xfff8e8, 0x776d68, 2.15));

const keyLight = new THREE.DirectionalLight(0xffead4, 4.2);
keyLight.position.set(5, 8, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 6;
keyLight.shadow.camera.bottom = -5;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 22;
keyLight.shadow.bias = -0.00035;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xbad8dc, 1.35);
fillLight.position.set(-6, 3, 4);
scene.add(fillLight);

const warmLight = new THREE.DirectionalLight(0xffbd98, 0.8);
warmLight.position.set(2, 1, -5);
scene.add(warmLight);

function makePaperTexture() {
  const size = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f5f2eb';
  ctx.fillRect(0, 0, size, size);

  let seed = 41729;
  const random = () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };

  const image = ctx.getImageData(0, 0, size, size);
  for (let i = 0; i < image.data.length; i += 4) {
    const n = Math.floor((random() - 0.5) * 18);
    image.data[i] = Math.max(0, Math.min(255, image.data[i] + n));
    image.data[i + 1] = Math.max(0, Math.min(255, image.data[i + 1] + n));
    image.data[i + 2] = Math.max(0, Math.min(255, image.data[i + 2] + n));
  }
  ctx.putImageData(image, 0, 0);

  ctx.lineCap = 'round';
  for (let i = 0; i < 440; i++) {
    const x = random() * size;
    const y = random() * size;
    const length = 2 + random() * 12;
    ctx.strokeStyle = random() > 0.5
      ? `rgba(110,92,70,${0.018 + random() * 0.035})`
      : `rgba(255,255,255,${0.03 + random() * 0.05})`;
    ctx.lineWidth = 0.3 + random() * 0.65;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + length * 0.45, y + (random() - 0.5) * 1.4, x + length, y);
    ctx.stroke();
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(5, 8);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const paperTexture = makePaperTexture();
const balloon = new THREE.Group();
scene.add(balloon);

const paperMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  map: paperTexture,
  bumpMap: paperTexture,
  bumpScale: 0.018,
  vertexColors: true,
  roughness: 0.93,
  metalness: 0,
  flatShading: true
});

const palette = [
  new THREE.Color(0xf0dfbd),
  new THREE.Color(0xd96b5c),
  new THREE.Color(0x3f9895)
];

const profile = [
  { y: 3.52, r: 0.055 },
  { y: 3.37, r: 0.34 },
  { y: 3.08, r: 0.73 },
  { y: 2.65, r: 1.13 },
  { y: 2.12, r: 1.43 },
  { y: 1.51, r: 1.57 },
  { y: 0.90, r: 1.50 },
  { y: 0.34, r: 1.25 },
  { y: -0.14, r: 0.88 },
  { y: -0.50, r: 0.48 },
  { y: -0.68, r: 0.16 }
];

const goreCount = 12;
const angleStep = Math.PI * 2 / goreCount;
const positions = [];
const colors = [];
const uvs = [];

function pushVertex(x, y, z, color, u, v) {
  positions.push(x, y, z);
  colors.push(color.r, color.g, color.b);
  uvs.push(u, v);
}

for (let g = 0; g < goreCount; g++) {
  const a0 = g * angleStep;
  const a1 = (g + 1) * angleStep;
  const base = palette[g % palette.length];

  for (let k = 0; k < profile.length - 1; k++) {
    const p0 = profile[k];
    const p1 = profile[k + 1];
    const variation = 0.94 + ((g * 7 + k * 11) % 9) * 0.012;
    const color = base.clone().multiplyScalar(variation);

    const v00 = new THREE.Vector3(Math.cos(a0) * p0.r, p0.y, Math.sin(a0) * p0.r);
    const v10 = new THREE.Vector3(Math.cos(a1) * p0.r, p0.y, Math.sin(a1) * p0.r);
    const v11 = new THREE.Vector3(Math.cos(a1) * p1.r, p1.y, Math.sin(a1) * p1.r);
    const v01 = new THREE.Vector3(Math.cos(a0) * p1.r, p1.y, Math.sin(a0) * p1.r);

    const vv0 = k / (profile.length - 1);
    const vv1 = (k + 1) / (profile.length - 1);

    pushVertex(v00.x, v00.y, v00.z, color, 0, vv0);
    pushVertex(v10.x, v10.y, v10.z, color, 1, vv0);
    pushVertex(v11.x, v11.y, v11.z, color, 1, vv1);

    pushVertex(v00.x, v00.y, v00.z, color, 0, vv0);
    pushVertex(v11.x, v11.y, v11.z, color, 1, vv1);
    pushVertex(v01.x, v01.y, v01.z, color, 0, vv1);
  }
}

const envelopeGeometry = new THREE.BufferGeometry();
envelopeGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
envelopeGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
envelopeGeometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
envelopeGeometry.computeVertexNormals();

const envelope = new THREE.Mesh(envelopeGeometry, paperMaterial);
envelope.castShadow = true;
envelope.receiveShadow = true;
balloon.add(envelope);

const seamMaterial = new THREE.MeshStandardMaterial({
  color: 0x8e6f59,
  roughness: 1,
  metalness: 0
});

for (let g = 0; g < goreCount; g++) {
  const angle = g * angleStep;
  const points = profile.map((p) =>
    new THREE.Vector3(
      Math.cos(angle) * (p.r + 0.013),
      p.y,
      Math.sin(angle) * (p.r + 0.013)
    )
  );
  const curve = new THREE.CatmullRomCurve3(points, false, 'chordal');
  const geometry = new THREE.TubeGeometry(curve, 42, 0.009, 4, false);
  const seam = new THREE.Mesh(geometry, seamMaterial);
  seam.castShadow = true;
  balloon.add(seam);
}

for (let k = 1; k < profile.length - 1; k++) {
  const p = profile[k];
  const geometry = new THREE.TorusGeometry(p.r + 0.015, 0.007, 4, goreCount * 4);
  geometry.rotateX(Math.PI / 2);
  const crease = new THREE.Mesh(geometry, seamMaterial);
  crease.position.y = p.y;
  crease.scale.y = 0.998;
  balloon.add(crease);
}

const tabMaterials = palette.map((color) => new THREE.MeshStandardMaterial({
  color: color.clone().lerp(new THREE.Color(0xffffff), 0.12),
  map: paperTexture,
  bumpMap: paperTexture,
  bumpScale: 0.012,
  roughness: 0.96,
  side: THREE.DoubleSide,
  flatShading: true
}));

function makeGlueTab(seamIndex, levelIndex) {
  const angle = seamIndex * angleStep;
  const p0 = profile[levelIndex];
  const p1 = profile[levelIndex + 1];
  const insetAngle = angle + 0.105;
  const trim = (p0.y - p1.y) * 0.14;
  const lift = 0.045;

  const points = [
    new THREE.Vector3(Math.cos(angle) * (p0.r + lift), p0.y - trim, Math.sin(angle) * (p0.r + lift)),
    new THREE.Vector3(Math.cos(insetAngle) * (p0.r + lift + 0.055), p0.y - trim * 1.45, Math.sin(insetAngle) * (p0.r + lift + 0.055)),
    new THREE.Vector3(Math.cos(insetAngle) * (p1.r + lift + 0.055), p1.y + trim * 1.45, Math.sin(insetAngle) * (p1.r + lift + 0.055)),
    new THREE.Vector3(Math.cos(angle) * (p1.r + lift), p1.y + trim, Math.sin(angle) * (p1.r + lift))
  ];

  const geometry = new THREE.BufferGeometry().setFromPoints([
    points[0], points[1], points[2],
    points[0], points[2], points[3]
  ]);
  geometry.computeVertexNormals();
  const tab = new THREE.Mesh(geometry, tabMaterials[seamIndex % 3]);
  tab.castShadow = true;
  balloon.add(tab);

  const creaseCurve = new THREE.LineCurve3(points[0], points[3]);
  const creaseGeometry = new THREE.TubeGeometry(creaseCurve, 1, 0.006, 4, false);
  balloon.add(new THREE.Mesh(creaseGeometry, seamMaterial));
}

for (let seam = 0; seam < goreCount; seam += 2) {
  makeGlueTab(seam, 2 + (seam % 4));
  makeGlueTab(seam, 6 + ((seam / 2) % 2));
}

const capMaterial = new THREE.MeshStandardMaterial({
  color: 0xb38a69,
  map: paperTexture,
  roughness: 0.95,
  flatShading: true
});

const topCap = new THREE.Mesh(
  new THREE.CylinderGeometry(0.045, 0.085, 0.12, 12, 1, false),
  capMaterial
);
topCap.position.y = 3.57;
topCap.castShadow = true;
balloon.add(topCap);

const bottomCollar = new THREE.Mesh(
  new THREE.CylinderGeometry(0.16, 0.115, 0.18, 12, 1, false),
  capMaterial
);
bottomCollar.position.y = -0.73;
bottomCollar.castShadow = true;
balloon.add(bottomCollar);

const cordMaterial = new THREE.MeshStandardMaterial({
  color: 0x72513a,
  roughness: 1
});

const basketTopY = -1.66;
const basketBottomY = -2.62;
const cordAngles = [
  Math.PI * 0.25,
  Math.PI * 0.75,
  Math.PI * 1.25,
  Math.PI * 1.75
];

for (const angle of cordAngles) {
  const start = new THREE.Vector3(Math.cos(angle) * 0.25, -0.67, Math.sin(angle) * 0.25);
  const end = new THREE.Vector3(Math.cos(angle) * 0.69, basketTopY - 0.02, Math.sin(angle) * 0.69);
  const mid = start.clone().lerp(end, 0.52);
  mid.y -= 0.035;
  const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
  const geometry = new THREE.TubeGeometry(curve, 12, 0.017, 6, false);
  const cord = new THREE.Mesh(geometry, cordMaterial);
  cord.castShadow = true;
  balloon.add(cord);
}

const basket = new THREE.Group();
balloon.add(basket);

const basketMaterial = new THREE.MeshStandardMaterial({
  color: 0xa86f3f,
  map: paperTexture,
  bumpMap: paperTexture,
  bumpScale: 0.025,
  roughness: 0.98,
  flatShading: true,
  side: THREE.DoubleSide
});

const darkKraftMaterial = new THREE.MeshStandardMaterial({
  color: 0x765035,
  roughness: 1,
  flatShading: true
});

const topHalf = 0.61;
const bottomHalf = 0.43;

function basketSide(side) {
  let verts;
  if (side === 0) {
    verts = [
      -topHalf, basketTopY, topHalf,
       topHalf, basketTopY, topHalf,
       bottomHalf, basketBottomY, bottomHalf,
      -bottomHalf, basketBottomY, bottomHalf
    ];
  } else if (side === 1) {
    verts = [
       topHalf, basketTopY, topHalf,
       topHalf, basketTopY, -topHalf,
       bottomHalf, basketBottomY, -bottomHalf,
       bottomHalf, basketBottomY, bottomHalf
    ];
  } else if (side === 2) {
    verts = [
       topHalf, basketTopY, -topHalf,
      -topHalf, basketTopY, -topHalf,
      -bottomHalf, basketBottomY, -bottomHalf,
       bottomHalf, basketBottomY, -bottomHalf
    ];
  } else {
    verts = [
      -topHalf, basketTopY, -topHalf,
      -topHalf, basketTopY, topHalf,
      -bottomHalf, basketBottomY, bottomHalf,
      -bottomHalf, basketBottomY, -bottomHalf
    ];
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute([
    0, 1, 1, 1, 1, 0, 0, 0
  ], 2));
  geometry.setIndex([0, 1, 2, 0, 2, 3]);
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, basketMaterial);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  basket.add(mesh);
}

for (let side = 0; side < 4; side++) basketSide(side);

const basketBottom = new THREE.Mesh(
  new THREE.BoxGeometry(bottomHalf * 2, 0.07, bottomHalf * 2),
  darkKraftMaterial
);
basketBottom.position.y = basketBottomY - 0.025;
basketBottom.castShadow = true;
basket.add(basketBottom);

const basketInterior = new THREE.Mesh(
  new THREE.BoxGeometry(1.03, 0.055, 1.03),
  new THREE.MeshStandardMaterial({ color: 0x3d2d24, roughness: 1 })
);
basketInterior.position.y = basketTopY - 0.07;
basketInterior.castShadow = true;
basket.add(basketInterior);

function addBasketStrip(side, y, thickness, verticalOffset = 0) {
  const t = (y - basketBottomY) / (basketTopY - basketBottomY);
  const half = THREE.MathUtils.lerp(bottomHalf, topHalf, t);
  const length = half * 2 + 0.035;
  const geometry = new THREE.BoxGeometry(length, thickness, 0.036);
  const strip = new THREE.Mesh(geometry, darkKraftMaterial);
  strip.position.y = y + verticalOffset;

  if (side === 0) {
    strip.position.z = half + 0.018;
  } else if (side === 1) {
    strip.rotation.y = Math.PI / 2;
    strip.position.x = half + 0.018;
  } else if (side === 2) {
    strip.position.z = -half - 0.018;
  } else {
    strip.rotation.y = Math.PI / 2;
    strip.position.x = -half - 0.018;
  }
  strip.castShadow = true;
  basket.add(strip);
}

for (let side = 0; side < 4; side++) {
  for (let row = 1; row <= 6; row++) {
    addBasketStrip(side, basketBottomY + row * 0.135, 0.038, row % 2 ? 0.006 : -0.004);
  }
}

function addVerticalWeave(side, offset) {
  const height = basketTopY - basketBottomY - 0.08;
  const geometry = new THREE.BoxGeometry(0.045, height, 0.032);
  const strip = new THREE.Mesh(geometry, darkKraftMaterial);
  strip.position.y = (basketTopY + basketBottomY) * 0.5;

  const middleHalf = (topHalf + bottomHalf) * 0.5;
  if (side === 0) {
    strip.position.set(offset, strip.position.y, middleHalf + 0.038);
    strip.rotation.z = -offset * 0.17;
  } else if (side === 1) {
    strip.position.set(middleHalf + 0.038, strip.position.y, -offset);
    strip.rotation.y = Math.PI / 2;
    strip.rotation.x = offset * 0.17;
  } else if (side === 2) {
    strip.position.set(-offset, strip.position.y, -middleHalf - 0.038);
    strip.rotation.z = offset * 0.17;
  } else {
    strip.position.set(-middleHalf - 0.038, strip.position.y, offset);
    strip.rotation.y = Math.PI / 2;
    strip.rotation.x = -offset * 0.17;
  }
  strip.castShadow = true;
  basket.add(strip);
}

for (let side = 0; side < 4; side++) {
  for (const offset of [-0.39, -0.19, 0, 0.19, 0.39]) addVerticalWeave(side, offset);
}

const rimMaterial = new THREE.MeshStandardMaterial({
  color: 0x8c5d38,
  map: paperTexture,
  roughness: 0.98,
  side: THREE.DoubleSide
});

for (let side = 0; side < 4; side++) {
  addBasketStrip(side, basketTopY + 0.01, 0.11);
}

function addScallop(side, offset) {
  const geometry = new THREE.CircleGeometry(0.095, 10, Math.PI, Math.PI);
  const scallop = new THREE.Mesh(geometry, rimMaterial);
  scallop.position.y = basketTopY - 0.035;

  if (side === 0) {
    scallop.position.x = offset;
    scallop.position.z = topHalf + 0.041;
  } else if (side === 1) {
    scallop.rotation.y = Math.PI / 2;
    scallop.position.x = topHalf + 0.041;
    scallop.position.z = -offset;
  } else if (side === 2) {
    scallop.rotation.y = Math.PI;
    scallop.position.x = -offset;
    scallop.position.z = -topHalf - 0.041;
  } else {
    scallop.rotation.y = -Math.PI / 2;
    scallop.position.x = -topHalf - 0.041;
    scallop.position.z = offset;
  }
  scallop.castShadow = true;
  basket.add(scallop);
}

for (let side = 0; side < 4; side++) {
  for (const offset of [-0.48, -0.24, 0, 0.24, 0.48]) addScallop(side, offset);
}

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(5.5, 64),
  new THREE.ShadowMaterial({ color: 0x5c5147, opacity: 0.18 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -2.77;
ground.receiveShadow = true;
scene.add(ground);

const groundingDisc = new THREE.Mesh(
  new THREE.CircleGeometry(5.5, 64),
  new THREE.MeshStandardMaterial({
    color: 0xe9e2d5,
    roughness: 1,
    transparent: true,
    opacity: 0.72
  })
);
groundingDisc.rotation.x = -Math.PI / 2;
groundingDisc.position.y = -2.79;
groundingDisc.receiveShadow = true;
scene.add(groundingDisc);

balloon.rotation.y = -0.18;

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
}
addEventListener('resize', resize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
