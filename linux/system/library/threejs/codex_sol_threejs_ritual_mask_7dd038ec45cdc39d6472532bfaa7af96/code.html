<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carved Wooden Ritual Mask</title>
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #17110d;
}
canvas { display: block; }
.info {
  position: fixed;
  left: 20px;
  bottom: 18px;
  color: rgba(238, 218, 184, 0.72);
  font: 11px/1.5 Georgia, serif;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  pointer-events: none;
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div class="info">Carved ritual mask · drag to examine</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17110d);
scene.fog = new THREE.FogExp2(0x17110d, 0.035);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0.2, 0.3, 10.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.42;
controls.target.set(0, 0, 0.25);
controls.minDistance = 6.8;
controls.maxDistance = 15;
controls.maxPolarAngle = Math.PI * 0.72;

const hemi = new THREE.HemisphereLight(0xd9c4a2, 0x24150f, 1.5);
scene.add(hemi);

const key = new THREE.SpotLight(0xffd5a0, 95, 25, Math.PI / 5.2, 0.45, 1.5);
key.position.set(-5.5, 7, 8);
key.target.position.set(0, 0.2, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004;
scene.add(key, key.target);

const rim = new THREE.DirectionalLight(0x9a6d4a, 2.7);
rim.position.set(5, 3, -3);
scene.add(rim);

const fill = new THREE.PointLight(0xb84d2c, 14, 12, 2);
fill.position.set(4, -2, 5);
scene.add(fill);

const mask = new THREE.Group();
mask.rotation.x = -0.035;
mask.rotation.y = -0.03;
scene.add(mask);

const wood = new THREE.MeshStandardMaterial({
  color: 0x6d3219,
  roughness: 0.78,
  metalness: 0.02
});
const woodDark = new THREE.MeshStandardMaterial({
  color: 0x2a120b,
  roughness: 0.94
});
const woodLight = new THREE.MeshStandardMaterial({
  color: 0xa45b2d,
  roughness: 0.82
});
const ridgeMat = new THREE.MeshStandardMaterial({
  color: 0x8a4522,
  roughness: 0.7
});
const redPaint = new THREE.MeshStandardMaterial({
  color: 0x8e251b,
  roughness: 0.88
});
const ochrePaint = new THREE.MeshStandardMaterial({
  color: 0xc58a36,
  roughness: 0.9
});
const chalkPaint = new THREE.MeshStandardMaterial({
  color: 0xc7b58c,
  roughness: 1
});
const cavityMat = new THREE.MeshStandardMaterial({
  color: 0x090504,
  roughness: 1,
  side: THREE.DoubleSide
});

function frontZ(x, y) {
  const radial = x * x / 5.2 + y * y / 10.6;
  return 0.19 + 0.59 * Math.max(0, 1 - radial);
}

const faceShape = new THREE.Shape();
faceShape.moveTo(0, 3.18);
faceShape.bezierCurveTo(1.18, 3.08, 2.08, 2.18, 2.18, 0.78);
faceShape.bezierCurveTo(2.29, -0.75, 1.54, -2.45, 0.42, -3.18);
faceShape.bezierCurveTo(0.15, -3.38, -0.15, -3.38, -0.42, -3.18);
faceShape.bezierCurveTo(-1.54, -2.45, -2.29, -0.75, -2.18, 0.78);
faceShape.bezierCurveTo(-2.08, 2.18, -1.18, 3.08, 0, 3.18);

function eyeHole(cx) {
  const path = new THREE.Path();
  path.absellipse(cx, 0.7, 0.65, 0.32, 0, Math.PI * 2, true, 0);
  return path;
}
faceShape.holes.push(eyeHole(-0.91), eyeHole(0.91));

const faceGeometry = new THREE.ExtrudeGeometry(faceShape, {
  depth: 0.28,
  bevelEnabled: true,
  bevelSegments: 3,
  steps: 1,
  bevelSize: 0.09,
  bevelThickness: 0.08,
  curveSegments: 48
});
const facePositions = faceGeometry.attributes.position;
for (let i = 0; i < facePositions.count; i++) {
  const x = facePositions.getX(i);
  const y = facePositions.getY(i);
  const originalZ = facePositions.getZ(i);
  const dish = 0.58 * Math.max(0, 1 - x * x / 5.15 - y * y / 10.5);
  facePositions.setZ(i, originalZ - 0.16 + dish);
}
faceGeometry.computeVertexNormals();
const face = new THREE.Mesh(faceGeometry, wood);
face.castShadow = true;
face.receiveShadow = true;
mask.add(face);

function ellipseDisk(x, y, sx, sy, z, material) {
  const geometry = new THREE.CircleGeometry(1, 48);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.set(x, y, z);
  mesh.scale.set(sx, sy, 1);
  mesh.receiveShadow = true;
  return mesh;
}

mask.add(
  ellipseDisk(-0.91, 0.7, 0.63, 0.3, -0.2, cavityMat),
  ellipseDisk(0.91, 0.7, 0.63, 0.3, -0.2, cavityMat)
);

function createEyeRim(x) {
  const geometry = new THREE.TorusGeometry(0.49, 0.105, 10, 44);
  const rimMesh = new THREE.Mesh(geometry, woodLight);
  rimMesh.position.set(x, 0.7, frontZ(x, 0.7) + 0.12);
  rimMesh.scale.set(1.38, 0.73, 0.82);
  rimMesh.castShadow = true;
  return rimMesh;
}
mask.add(createEyeRim(-0.91), createEyeRim(0.91));

function makeTriangleGeometry(points, triangles) {
  const values = [];
  for (const tri of triangles) {
    for (const index of tri) {
      values.push(points[index].x, points[index].y, points[index].z);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(values, 3));
  geometry.computeVertexNormals();
  return geometry;
}

const nosePoints = [
  new THREE.Vector3(-0.38, 1.23, 0.72),
  new THREE.Vector3(0.38, 1.23, 0.72),
  new THREE.Vector3(-0.48, -0.48, 0.69),
  new THREE.Vector3(0.48, -0.48, 0.69),
  new THREE.Vector3(0, -0.2, 1.83),
  new THREE.Vector3(0, -0.83, 1.12),
  new THREE.Vector3(0, 1.38, 0.82)
];
const noseTriangles = [
  [0, 4, 6], [4, 1, 6],
  [0, 2, 4], [1, 4, 3],
  [2, 5, 4], [4, 5, 3],
  [2, 0, 6], [2, 6, 5],
  [1, 3, 6], [3, 5, 6]
];
const nose = new THREE.Mesh(makeTriangleGeometry(nosePoints, noseTriangles), woodLight);
nose.castShadow = true;
nose.receiveShadow = true;
mask.add(nose);

const nostrilGeometry = new THREE.SphereGeometry(0.12, 18, 10);
const nostrilLeft = new THREE.Mesh(nostrilGeometry, cavityMat);
nostrilLeft.position.set(-0.25, -0.52, 1.11);
nostrilLeft.scale.set(1.4, 0.52, 0.38);
const nostrilRight = nostrilLeft.clone();
nostrilRight.position.x = 0.25;
mask.add(nostrilLeft, nostrilRight);

function tubeFromPoints(points, radius, material, tubularSegments = 40) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const geometry = new THREE.TubeGeometry(curve, tubularSegments, radius, 8, false);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function surfacePoint(x, y, lift = 0.1) {
  return new THREE.Vector3(x, y, frontZ(x, y) + lift);
}

const browLeft = tubeFromPoints([
  surfacePoint(-1.62, 1.18, 0.12),
  surfacePoint(-1.15, 1.48, 0.13),
  surfacePoint(-0.55, 1.35, 0.14)
], 0.09, ridgeMat);
const browRight = tubeFromPoints([
  surfacePoint(0.55, 1.35, 0.14),
  surfacePoint(1.15, 1.48, 0.13),
  surfacePoint(1.62, 1.18, 0.12)
], 0.09, ridgeMat);
mask.add(browLeft, browRight);

const mouthSlit = tubeFromPoints([
  surfacePoint(-0.8, -1.38, 0.12),
  surfacePoint(-0.35, -1.5, 0.16),
  surfacePoint(0, -1.46, 0.18),
  surfacePoint(0.35, -1.5, 0.16),
  surfacePoint(0.8, -1.38, 0.12)
], 0.115, cavityMat);
mask.add(mouthSlit);

const upperLip = tubeFromPoints([
  surfacePoint(-0.78, -1.28, 0.16),
  surfacePoint(-0.35, -1.18, 0.19),
  surfacePoint(0, -1.29, 0.21),
  surfacePoint(0.35, -1.18, 0.19),
  surfacePoint(0.78, -1.28, 0.16)
], 0.09, redPaint);
const lowerLip = tubeFromPoints([
  surfacePoint(-0.72, -1.55, 0.14),
  surfacePoint(0, -1.68, 0.17),
  surfacePoint(0.72, -1.55, 0.14)
], 0.085, woodLight);
mask.add(upperLip, lowerLip);

const chinRidge = tubeFromPoints([
  surfacePoint(-0.68, -2.12, 0.1),
  surfacePoint(0, -2.3, 0.12),
  surfacePoint(0.68, -2.12, 0.1)
], 0.075, ridgeMat);
mask.add(chinRidge);

const foreheadRidges = [
  [[-0.92, 2.18], [-0.48, 2.5], [0, 2.61], [0.48, 2.5], [0.92, 2.18]],
  [[-1.42, 1.9], [-1.05, 2.23], [-0.72, 2.39]],
  [[1.42, 1.9], [1.05, 2.23], [0.72, 2.39]]
];
for (const line of foreheadRidges) {
  const points = line.map(([x, y]) => surfacePoint(x, y, 0.09));
  mask.add(tubeFromPoints(points, 0.055, ridgeMat, 28));
}

const cheekPatterns = [
  [[-1.73, 0.05], [-1.47, -0.17], [-1.27, -0.55]],
  [[-1.69, -0.55], [-1.43, -0.76], [-1.23, -1.04]],
  [[1.73, 0.05], [1.47, -0.17], [1.27, -0.55]],
  [[1.69, -0.55], [1.43, -0.76], [1.23, -1.04]]
];
for (const line of cheekPatterns) {
  const points = line.map(([x, y]) => surfacePoint(x, y, 0.085));
  mask.add(tubeFromPoints(points, 0.052, ochrePaint, 24));
}

function paintFragment(x, y, radius, colorMaterial, rotation, sides = 6) {
  const geometry = new THREE.CircleGeometry(radius, sides);
  const fragment = new THREE.Mesh(geometry, colorMaterial);
  fragment.position.set(x, y, frontZ(x, y) + 0.105);
  fragment.rotation.z = rotation;
  fragment.scale.set(1, 0.42 + Math.random() * 0.32, 1);
  fragment.castShadow = true;
  return fragment;
}

let seed = 9381;
function randomValue() {
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
}

const paintBands = [
  { y: 2.12, material: redPaint, count: 12, span: 2.6 },
  { y: -0.55, material: chalkPaint, count: 10, span: 3.2 },
  { y: -2.15, material: ochrePaint, count: 8, span: 2.0 }
];
for (const band of paintBands) {
  for (let i = 0; i < band.count; i++) {
    const x = (randomValue() - 0.5) * band.span;
    const y = band.y + (randomValue() - 0.5) * 0.28;
    const radius = 0.09 + randomValue() * 0.18;
    mask.add(paintFragment(x, y, radius, band.material, randomValue() * Math.PI, 5 + Math.floor(randomValue() * 3)));
  }
}

const grainMaterial = new THREE.MeshStandardMaterial({
  color: 0x3e1b0e,
  roughness: 1
});
const grainLines = [
  [[-1.85, 1.72], [-1.72, 2.25], [-1.31, 2.69]],
  [[1.85, 1.72], [1.72, 2.25], [1.31, 2.69]],
  [[-1.95, -0.9], [-1.72, -1.55], [-1.18, -2.35]],
  [[1.95, -0.9], [1.72, -1.55], [1.18, -2.35]],
  [[-0.38, -2.55], [0, -2.73], [0.38, -2.55]]
];
for (const line of grainLines) {
  mask.add(tubeFromPoints(
    line.map(([x, y]) => surfacePoint(x, y, 0.065)),
    0.021,
    grainMaterial,
    24
  ));
}

for (let i = 0; i < 24; i++) {
  const angle = randomValue() * Math.PI * 2;
  const x = Math.cos(angle) * (1.15 + randomValue() * 0.7);
  const y = Math.sin(angle) * (1.65 + randomValue() * 1.15);
  if (x * x / 4.5 + y * y / 9.5 > 0.88) continue;
  const length = 0.12 + randomValue() * 0.23;
  const direction = (randomValue() - 0.5) * 0.7;
  const p1 = surfacePoint(x - Math.cos(direction) * length, y - Math.sin(direction) * length, 0.07);
  const p2 = surfacePoint(x + Math.cos(direction) * length, y + Math.sin(direction) * length, 0.07);
  mask.add(tubeFromPoints([p1, p2], 0.014, grainMaterial, 4));
}

const edgePegGeometry = new THREE.CylinderGeometry(0.105, 0.14, 0.48, 8);
for (const x of [-1.42, -0.72, 0, 0.72, 1.42]) {
  const peg = new THREE.Mesh(edgePegGeometry, woodLight);
  peg.position.set(x, 3.18 - Math.abs(x) * 0.15, frontZ(x, 3.0));
  peg.rotation.z = -x * 0.08;
  peg.castShadow = true;
  mask.add(peg);
}

const cordMaterial = new THREE.MeshStandardMaterial({
  color: 0x3a2516,
  roughness: 1
});
const cord = tubeFromPoints([
  new THREE.Vector3(-1.45, 2.95, -0.12),
  new THREE.Vector3(-1.1, 4.05, -0.25),
  new THREE.Vector3(0, 4.42, -0.3),
  new THREE.Vector3(1.1, 4.05, -0.25),
  new THREE.Vector3(1.45, 2.95, -0.12)
], 0.038, cordMaterial, 48);
mask.add(cord);

const backdrop = new THREE.Mesh(
  new THREE.PlaneGeometry(28, 20),
  new THREE.MeshStandardMaterial({ color: 0x231813, roughness: 1 })
);
backdrop.position.set(0, 0, -2.4);
backdrop.receiveShadow = true;
scene.add(backdrop);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(22, 16),
  new THREE.MeshStandardMaterial({ color: 0x1c120e, roughness: 0.95 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -3.52;
floor.receiveShadow = true;
scene.add(floor);

const pedestal = new THREE.Mesh(
  new THREE.CylinderGeometry(1.6, 1.9, 0.35, 48),
  new THREE.MeshStandardMaterial({ color: 0x38231a, roughness: 0.9 })
);
pedestal.position.set(0, -3.38, -0.6);
pedestal.receiveShadow = true;
pedestal.castShadow = true;
scene.add(pedestal);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  fill.intensity = 13.5 + Math.sin(elapsed * 0.75) * 0.8;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
