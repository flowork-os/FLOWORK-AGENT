<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contemporary Kitchen Base Cabinet</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #d9d6cf;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdedbd3);
    scene.fog = new THREE.Fog(0xdedbd3, 4.5, 9);

    const camera = new THREE.PerspectiveCamera(
      35,
      window.innerWidth / window.innerHeight,
      0.01,
      20
    );
    camera.position.set(2.25, 1.48, 2.55);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.49, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.enablePan = false;
    controls.minDistance = 2.0;
    controls.maxDistance = 5.0;
    controls.minPolarAngle = Math.PI * 0.20;
    controls.maxPolarAngle = Math.PI * 0.48;

    const cabinetMaterial = new THREE.MeshStandardMaterial({
      color: 0x25453f,
      roughness: 0.52,
      metalness: 0.02
    });

    const cabinetSideMaterial = new THREE.MeshStandardMaterial({
      color: 0x203e39,
      roughness: 0.58,
      metalness: 0.02
    });

    const revealMaterial = new THREE.MeshStandardMaterial({
      color: 0x111817,
      roughness: 0.82
    });

    const countertopMaterial = new THREE.MeshStandardMaterial({
      color: 0xe8e4da,
      roughness: 0.28,
      metalness: 0.01
    });

    const countertopEdgeMaterial = new THREE.MeshStandardMaterial({
      color: 0xd8d2c6,
      roughness: 0.34,
      metalness: 0.01
    });

    const brassMaterial = new THREE.MeshStandardMaterial({
      color: 0xb58a4b,
      roughness: 0.25,
      metalness: 0.88
    });

    const toeKickMaterial = new THREE.MeshStandardMaterial({
      color: 0x182d29,
      roughness: 0.7,
      metalness: 0.03
    });

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0xb6aa98,
      roughness: 0.88
    });

    const wallMaterial = new THREE.MeshStandardMaterial({
      color: 0xe5e1d9,
      roughness: 0.93
    });

    const baseboardMaterial = new THREE.MeshStandardMaterial({
      color: 0xd5d0c6,
      roughness: 0.76
    });

    function addMesh(geometry, material, position, parent = scene) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(position.x, position.y, position.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function addBox(name, width, height, depth, x, y, z, material, radius = 0) {
      const safeRadius = Math.min(radius, width * 0.2, height * 0.2, depth * 0.2);
      const geometry = safeRadius > 0
        ? new RoundedBoxGeometry(width, height, depth, 3, safeRadius)
        : new THREE.BoxGeometry(width, height, depth);
      const mesh = addMesh(geometry, material, new THREE.Vector3(x, y, z));
      mesh.name = name;
      return mesh;
    }

    const cabinet = new THREE.Group();
    scene.add(cabinet);

    const cabinetWidth = 1.8;
    const cabinetDepth = 0.62;
    const bodyBottom = 0.12;
    const bodyTop = 0.85;
    const bodyHeight = bodyTop - bodyBottom;
    const frontZ = cabinetDepth * 0.5;
    const sideThickness = 0.045;

    const toeKick = addBox(
      'Recessed toe-kick',
      1.66,
      0.105,
      0.47,
      0,
      0.0525,
      -0.045,
      toeKickMaterial,
      0.008
    );
    cabinet.attach(toeKick);

    const leftSide = addBox(
      'Left carcass side',
      sideThickness,
      bodyHeight,
      cabinetDepth,
      -cabinetWidth * 0.5 + sideThickness * 0.5,
      bodyBottom + bodyHeight * 0.5,
      0,
      cabinetSideMaterial,
      0.006
    );
    cabinet.attach(leftSide);

    const rightSide = addBox(
      'Right carcass side',
      sideThickness,
      bodyHeight,
      cabinetDepth,
      cabinetWidth * 0.5 - sideThickness * 0.5,
      bodyBottom + bodyHeight * 0.5,
      0,
      cabinetSideMaterial,
      0.006
    );
    cabinet.attach(rightSide);

    const bottomPanel = addBox(
      'Carcass bottom',
      cabinetWidth - sideThickness * 2,
      0.035,
      cabinetDepth,
      0,
      bodyBottom + 0.0175,
      0,
      cabinetSideMaterial,
      0.004
    );
    cabinet.attach(bottomPanel);

    const topRail = addBox(
      'Carcass top rail',
      cabinetWidth - sideThickness * 2,
      0.04,
      cabinetDepth,
      0,
      bodyTop - 0.02,
      0,
      cabinetSideMaterial,
      0.004
    );
    cabinet.attach(topRail);

    const backPanel = addBox(
      'Back panel',
      cabinetWidth - sideThickness * 2,
      bodyHeight - 0.07,
      0.025,
      0,
      bodyBottom + bodyHeight * 0.5,
      -cabinetDepth * 0.5 + 0.0125,
      cabinetSideMaterial
    );
    cabinet.attach(backPanel);

    const darkReveal = addBox(
      'Front shadow reveal',
      cabinetWidth - 0.075,
      bodyHeight - 0.055,
      0.018,
      0,
      bodyBottom + bodyHeight * 0.5,
      frontZ + 0.005,
      revealMaterial
    );
    cabinet.attach(darkReveal);

    const counterEdge = addBox(
      'Countertop shadow edge',
      1.91,
      0.064,
      0.70,
      0,
      0.882,
      0.014,
      countertopEdgeMaterial,
      0.014
    );
    cabinet.attach(counterEdge);

    const countertop = addBox(
      'Quartz countertop',
      1.895,
      0.054,
      0.688,
      0,
      0.889,
      0.017,
      countertopMaterial,
      0.012
    );
    cabinet.attach(countertop);

    const frontPanelZ = frontZ + 0.026;
    const doorBottom = 0.145;
    const doorTop = 0.642;
    const doorHeight = doorTop - doorBottom;
    const centerGap = 0.009;
    const sideGap = 0.045;
    const doorWidth = (cabinetWidth - sideGap * 2 - centerGap) * 0.5;
    const doorCenterOffset = centerGap * 0.5 + doorWidth * 0.5;

    const leftDoor = addBox(
      'Left hinged door',
      doorWidth,
      doorHeight,
      0.026,
      -doorCenterOffset,
      doorBottom + doorHeight * 0.5,
      frontPanelZ,
      cabinetMaterial,
      0.008
    );
    cabinet.attach(leftDoor);

    const rightDoor = addBox(
      'Right hinged door',
      doorWidth,
      doorHeight,
      0.026,
      doorCenterOffset,
      doorBottom + doorHeight * 0.5,
      frontPanelZ,
      cabinetMaterial,
      0.008
    );
    cabinet.attach(rightDoor);

    const drawerBottom = 0.66;
    const drawerTop = 0.827;
    const drawerFront = addBox(
      'Shallow top drawer',
      cabinetWidth - sideGap * 2,
      drawerTop - drawerBottom,
      0.026,
      0,
      drawerBottom + (drawerTop - drawerBottom) * 0.5,
      frontPanelZ,
      cabinetMaterial,
      0.008
    );
    cabinet.attach(drawerFront);

    function addBarHandle(name, x, y, length, horizontal) {
      const group = new THREE.Group();
      group.name = name;
      group.position.set(x, y, frontPanelZ + 0.036);

      const barRadius = 0.009;
      const barGeometry = new THREE.CylinderGeometry(
        barRadius,
        barRadius,
        length,
        20,
        1,
        false
      );
      const bar = new THREE.Mesh(barGeometry, brassMaterial);
      if (horizontal) {
        bar.rotation.z = Math.PI * 0.5;
      }
      bar.position.z = 0.034;
      bar.castShadow = true;
      group.add(bar);

      const postGeometry = new THREE.CylinderGeometry(0.007, 0.007, 0.036, 16);
      const offset = length * 0.5 - 0.045;

      for (const direction of [-1, 1]) {
        const post = new THREE.Mesh(postGeometry, brassMaterial);
        post.rotation.x = Math.PI * 0.5;
        if (horizontal) {
          post.position.x = direction * offset;
        } else {
          post.position.y = direction * offset;
        }
        post.position.z = 0.016;
        post.castShadow = true;
        group.add(post);

        const foot = new THREE.Mesh(
          new THREE.CylinderGeometry(0.012, 0.012, 0.006, 20),
          brassMaterial
        );
        foot.rotation.x = Math.PI * 0.5;
        if (horizontal) {
          foot.position.x = direction * offset;
        } else {
          foot.position.y = direction * offset;
        }
        foot.position.z = -0.001;
        foot.castShadow = true;
        group.add(foot);
      }

      cabinet.add(group);
    }

    addBarHandle(
      'Drawer bar handle',
      0,
      drawerBottom + (drawerTop - drawerBottom) * 0.5,
      0.46,
      true
    );

    addBarHandle(
      'Left door bar handle',
      -0.085,
      doorBottom + doorHeight * 0.56,
      0.255,
      false
    );

    addBarHandle(
      'Right door bar handle',
      0.085,
      doorBottom + doorHeight * 0.56,
      0.255,
      false
    );

    const speckMaterialA = new THREE.MeshStandardMaterial({
      color: 0xaaa59b,
      roughness: 0.48
    });
    const speckMaterialB = new THREE.MeshStandardMaterial({
      color: 0xc3bdb1,
      roughness: 0.5
    });

    let randomState = 24837;
    function seededRandom() {
      randomState = (randomState * 16807) % 2147483647;
      return (randomState - 1) / 2147483646;
    }

    for (let i = 0; i < 44; i++) {
      const radius = 0.0015 + seededRandom() * 0.0025;
      const speck = new THREE.Mesh(
        new THREE.SphereGeometry(radius, 8, 5),
        i % 3 === 0 ? speckMaterialA : speckMaterialB
      );
      speck.scale.y = 0.18;
      speck.position.set(
        (seededRandom() - 0.5) * 1.75,
        0.917,
        (seededRandom() - 0.5) * 0.59 + 0.015
      );
      speck.castShadow = false;
      cabinet.add(speck);
    }

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(12, 12),
      floorMaterial
    );
    floor.rotation.x = -Math.PI * 0.5;
    floor.position.y = -0.002;
    floor.receiveShadow = true;
    scene.add(floor);

    const wall = new THREE.Mesh(
      new THREE.PlaneGeometry(12, 5),
      wallMaterial
    );
    wall.position.set(0, 2.15, -0.48);
    wall.receiveShadow = true;
    scene.add(wall);

    const baseboard = addBox(
      'Wall baseboard',
      7,
      0.095,
      0.025,
      0,
      0.0475,
      -0.455,
      baseboardMaterial,
      0.005
    );
    baseboard.castShadow = false;

    const floorLineMaterial = new THREE.MeshStandardMaterial({
      color: 0xa39785,
      roughness: 0.9
    });

    for (let i = -5; i <= 5; i++) {
      const seam = new THREE.Mesh(
        new THREE.BoxGeometry(0.006, 0.0015, 12),
        floorLineMaterial
      );
      seam.position.set(i * 0.78, 0.0002, 0);
      seam.receiveShadow = true;
      scene.add(seam);
    }

    const hemisphere = new THREE.HemisphereLight(0xf7f5ed, 0x665f55, 1.45);
    scene.add(hemisphere);

    const keyLight = new THREE.DirectionalLight(0xfff1da, 3.2);
    keyLight.position.set(-2.7, 4.2, 3.1);
    keyLight.target.position.set(0, 0.45, 0);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -2.5;
    keyLight.shadow.camera.right = 2.5;
    keyLight.shadow.camera.top = 2.8;
    keyLight.shadow.camera.bottom = -1.2;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 9;
    keyLight.shadow.bias = -0.00018;
    keyLight.shadow.normalBias = 0.025;
    scene.add(keyLight);
    scene.add(keyLight.target);

    const fillLight = new THREE.DirectionalLight(0xc9ddff, 1.25);
    fillLight.position.set(3.5, 2.2, 1.4);
    fillLight.target.position.set(0, 0.55, 0);
    scene.add(fillLight);
    scene.add(fillLight.target);

    const warmBounce = new THREE.PointLight(0xffd6a4, 0.85, 4.5, 2);
    warmBounce.position.set(-1.7, 1.2, 1.7);
    scene.add(warmBounce);

    const clock = new THREE.Clock();

    function render() {
      requestAnimationFrame(render);
      const delta = Math.min(clock.getDelta(), 0.05);
      controls.update(delta);
      renderer.render(scene, camera);
    }

    render();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
