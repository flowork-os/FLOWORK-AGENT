<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roman Terracotta Oil Lamp</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#221c18}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x221c18);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.4, 2.3, 4.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.55, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.6;
controls.minDistance = 2.5;
controls.maxDistance = 12;
controls.maxPolarAngle = 1.45;

// Lights
scene.add(new THREE.HemisphereLight(0xffe8d0, 0x33231a, 0.55));
const key = new THREE.DirectionalLight(0xffdfb8, 2.2);
key.position.set(3.5, 6, 2.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -4;
key.shadow.camera.right = key.shadow.camera.top = 4;
key.shadow.camera.near = 1;
key.shadow.camera.far = 15;
key.shadow.normalBias = 0.02;
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.35);
fill.position.set(-4, 3, -3);
scene.add(fill);

// Materials
const terra = new THREE.MeshStandardMaterial({ color: 0xb4632f, roughness: 0.85, metalness: 0, side: THREE.DoubleSide, envMapIntensity: 0.5 });
const dark = new THREE.MeshStandardMaterial({ color: 0x1e120c, roughness: 0.95 });

const lamp = new THREE.Group();

// Reservoir body (lathe): flattened round body, shoulder ridge, sunken discus, raised fill-port rim
const profile = [
  [0.02, 0.0], [0.50, 0.0], [0.88, 0.10], [1.14, 0.32], [1.20, 0.50], [1.04, 0.70],
  [0.80, 0.82], [0.70, 0.845], [0.65, 0.875], [0.60, 0.845], [0.30, 0.765],
  [0.235, 0.825], [0.175, 0.825], [0.155, 0.68], [0.14, 0.56]
].map(p => new THREE.Vector2(p[0], p[1]));
const body = new THREE.Mesh(new THREE.LatheGeometry(profile, 96), terra);
lamp.add(body);

// Dark interior seen through fill port
const inner = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.02, 24), dark);
inner.position.y = 0.56;
lamp.add(inner);

// Spout with nozzle
const spout = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 28), terra);
spout.scale.set(0.46, 0.33, 0.82);
spout.position.set(0, 0.36, 1.05);
lamp.add(spout);
const wickRim = new THREE.Mesh(new THREE.TorusGeometry(0.145, 0.032, 14, 28), terra);
wickRim.rotation.set(Math.PI / 2 + 0.3, 0, 0);
wickRim.position.set(0, 0.615, 1.55);
lamp.add(wickRim);
const wickHole = new THREE.Mesh(new THREE.CylinderGeometry(0.125, 0.125, 0.05, 24), dark);
wickHole.rotation.x = 0.3;
wickHole.position.set(0, 0.605, 1.55);
lamp.add(wickHole);

// Loop handle at back
const handleGeo = new THREE.TorusGeometry(0.28, 0.08, 18, 40);
handleGeo.rotateY(Math.PI / 2);
handleGeo.rotateX(-0.35);
const handle = new THREE.Mesh(handleGeo, terra);
handle.scale.set(1, 1.1, 1);
handle.position.set(0, 0.62, -1.22);
lamp.add(handle);

// Relief on the discus: rosette petals + dot border
for (let i = 0; i < 12; i++) {
  const a = (i / 12) * Math.PI * 2;
  const petal = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 12), terra);
  petal.scale.set(1, 0.4, 2.2);
  petal.position.set(Math.sin(a) * 0.44, 0.80, Math.cos(a) * 0.44);
  petal.rotation.y = a;
  lamp.add(petal);
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.026, 10, 8), terra);
  const b = a + Math.PI / 12;
  dot.position.set(Math.sin(b) * 0.56, 0.835, Math.cos(b) * 0.56);
  lamp.add(dot);
}

lamp.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
scene.add(lamp);

// Soft ground shadow
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 64).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.32 })
);
ground.position.y = -0.001;
ground.receiveShadow = true;
scene.add(ground);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
