<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Monumental Stone Statue</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#c9cdd3}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9cdd3);
scene.fog = new THREE.Fog(0xc9cdd3, 45, 140);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 300);
camera.position.set(17, 10, 23);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

// --- weathered stone texture (procedural speckle + grime streaks) ---
const cv = document.createElement('canvas'); cv.width = cv.height = 512;
const ctx = cv.getContext('2d');
ctx.fillStyle = '#a49d92'; ctx.fillRect(0,0,512,512);
for (let i=0;i<26000;i++){
  const s = Math.random();
  ctx.fillStyle = `rgba(${s<.5?58:235},${s<.5?54:228},${s<.5?48:214},${(Math.random()*0.14).toFixed(3)})`;
  ctx.fillRect(Math.random()*512, Math.random()*512, 1+Math.random()*2, 1+Math.random()*2);
}
for (let i=0;i<90;i++){ // vertical weather streaks
  const x = Math.random()*512;
  ctx.fillStyle = `rgba(60,56,48,${(0.02+Math.random()*0.05).toFixed(3)})`;
  ctx.fillRect(x, Math.random()*200, 2+Math.random()*5, 120+Math.random()*300);
}
const tex = new THREE.CanvasTexture(cv);
tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(2,2);
tex.colorSpace = THREE.SRGBColorSpace;

const stone = new THREE.MeshStandardMaterial({
  map: tex, bumpMap: tex, bumpScale: 0.6,
  color: 0xb5aea1, roughness: 0.95, metalness: 0.0, flatShading: true
});

// --- deterministic erosion: chisel/weather the vertices ---
function weather(g, amt){
  const p = g.attributes.position, v = new THREE.Vector3();
  for (let i=0;i<p.count;i++){
    v.fromBufferAttribute(p,i);
    const n1 = Math.sin(v.x*11.3 + v.y*7.1) * Math.cos(v.z*9.7 + v.y*3.3);
    const n2 = Math.sin(v.y*17.0 + v.z*5.0) * Math.cos(v.x*6.0);
    p.setXYZ(i, v.x + n1*amt, v.y + n2*amt*0.7, v.z + (n1+n2)*0.5*amt);
  }
  g.computeVertexNormals();
  return g;
}

const statue = new THREE.Group();
scene.add(statue);
function add(geom, x, y, z, amt=0.05, rz=0, rx=0){
  const m = new THREE.Mesh(weather(geom, amt), stone);
  m.position.set(x,y,z); m.rotation.z = rz; m.rotation.x = rx;
  m.castShadow = m.receiveShadow = true;
  statue.add(m); return m;
}
const B = (w,h,d,s=2)=> new THREE.BoxGeometry(w,h,d,s,s,s);
const C = (rt,rb,h,seg=7)=> new THREE.CylinderGeometry(rt,rb,h,seg,4);

// --- stepped plinth + pedestal ---
add(B(13,0.9,13,4), 0, 0.45, 0, 0.03);
add(B(11,0.9,11,4), 0, 1.35, 0, 0.03);
add(B(9,0.9,9,4),   0, 2.25, 0, 0.04);
add(B(6.6,0.6,6.6,3), 0, 3.0, 0, 0.04);   // base trim
add(B(5.6,2.6,5.6,3), 0, 4.6, 0, 0.05);   // pedestal shaft
add(B(6.4,0.5,6.4,3), 0, 6.15, 0, 0.04);  // cornice

// --- robed figure, blocky carved masses ---
const y0 = 6.4;
add(C(2.15,2.4,0.55,9), 0, y0+0.28, 0, 0.05);          // robe hem
add(C(1.35,2.1,5.2,7),  0, y0+2.6, 0, 0.07);           // falling robe
add(C(1.1,1.42,2.5,7),  0, y0+6.25, 0, 0.06);          // torso
add(B(3.25,0.95,1.75),  0, y0+7.5, 0, 0.06);           // shoulder mass
add(B(0.78,2.7,0.95),  1.45, y0+6.3, 0.12, 0.05, -0.07); // right upper arm
add(B(0.78,2.7,0.95), -1.45, y0+6.3, 0.12, 0.05,  0.07); // left upper arm
add(B(2.3,0.66,0.75),  0.25, y0+5.7, 0.98, 0.045, 0.16); // forearm folded
add(B(2.3,0.66,0.75), -0.25, y0+5.25, 1.0, 0.045,-0.16); // forearm folded
add(B(1.05,1.3,1.05),  0, y0+8.65, 0.18, 0.045);       // head
add(C(0.55,1.05,1.85,7),0, y0+8.75,-0.12, 0.05);       // cowl / hood
add(B(1.15,0.32,1.1),   0, y0+9.55, 0.02, 0.04);       // crown slab

// --- ground ---
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(70, 48),
  new THREE.MeshStandardMaterial({color: 0x8a857a, roughness: 1})
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// --- lighting ---
scene.add(new THREE.HemisphereLight(0xd8dde6, 0x57503f, 0.55));
const sun = new THREE.DirectionalLight(0xfff0da, 2.4);
sun.position.set(19, 26, 13);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = sun.shadow.camera.bottom = -16;
sun.shadow.camera.right = sun.shadow.camera.top = 16;
sun.shadow.camera.far = 70;
sun.shadow.radius = 7;
sun.shadow.bias = -0.0005;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xa9c0e0, 0.45);
fill.position.set(-15, 9, -12);
scene.add(fill);

// --- controls ---
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 7.4, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.enableDamping = true;
controls.minDistance = 12;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI/2 - 0.02;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
