<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Compact Pickup Truck — three.js</title>
<style>
  html, body { margin: 0; height: 100%; background: #111318; overflow: hidden; }
  #info {
    position: fixed; left: 12px; bottom: 12px; z-index: 10;
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #8a93a3; letter-spacing: .3px; user-select: none; pointer-events: none;
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="info">Compact Pickup — drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ */
/*  Renderer                                                           */
/* ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

/* ------------------------------------------------------------------ */
/*  Scene / Camera                                                     */
/* ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111318);
scene.fog = new THREE.Fog(0x111318, 16, 42);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(5.6, 3.2, 7.6);

// Studio environment for realistic reflections on paint / chrome / glass
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

/* ------------------------------------------------------------------ */
/*  Lighting: hemisphere fill + key + fill + rim                       */
/* ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xbfd4ea, 0x0a0a0c, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e2, 2.5);
key.position.set(6, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 30;
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -5;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 5;
scene.add(key);
scene.add(key.target);

const fill = new THREE.DirectionalLight(0xbcd0ff, 0.7);
fill.position.set(-7, 4, 4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.3);
rim.position.set(-4, 3.5, -7);
scene.add(rim);

/* ------------------------------------------------------------------ */
/*  Ground plane — receives shadows only (subtle studio floor)         */
/* ------------------------------------------------------------------ */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(40, 64),
  new THREE.MeshStandardMaterial({ color: 0x15161b, roughness: 1.0, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ------------------------------------------------------------------ */
/*  Materials                                                          */
/* ------------------------------------------------------------------ */
const BODY_COLOR = 0xb23a34; // metallic red

const bodyMat = new THREE.MeshPhysicalMaterial({
  color: BODY_COLOR, metalness: 0.55, roughness: 0.42,
  clearcoat: 1.0, clearcoatRoughness: 0.12, envMapIntensity: 1.0
});
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0x0a0f14, metalness: 0.0, roughness: 0.06,
  transparent: true, opacity: 0.52, envMapIntensity: 1.6,
  clearcoat: 1.0, clearcoatRoughness: 0.04
});
const tireMat  = new THREE.MeshStandardMaterial({ color: 0x0b0b0d, roughness: 0.85, metalness: 0.1 });
const rimMat   = new THREE.MeshStandardMaterial({ color: 0xb8bcc2, metalness: 0.95, roughness: 0.28, envMapIntensity: 1.2 });
const chromeMat= new THREE.MeshStandardMaterial({ color: 0xe2e6ec, metalness: 1.0, roughness: 0.13, envMapIntensity: 1.5 });
const darkMat  = new THREE.MeshStandardMaterial({ color: 0x121316, roughness: 0.55, metalness: 0.35 });
const grilleMat= new THREE.MeshStandardMaterial({ color: 0x0c0c0e, roughness: 0.5, metalness: 0.6 });
const linerMat = new THREE.MeshStandardMaterial({ color: 0x17181b, roughness: 0.95, metalness: 0.05 });
const lensMat  = new THREE.MeshPhysicalMaterial({ color: 0xeef4ff, roughness: 0.06, metalness: 0.0, transparent: true, opacity: 0.65, clearcoat: 1.0, envMapIntensity: 1.4 });
const bulbMat  = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff2d0, emissiveIntensity: 1.6, roughness: 0.3 });
const tailMat  = new THREE.MeshStandardMaterial({ color: 0x7a0d0d, emissive: 0xff1e1e, emissiveIntensity: 0.7, roughness: 0.4 });
const amberMat = new THREE.MeshStandardMaterial({ color: 0x7a4a05, emissive: 0xffa51e, emissiveIntensity: 0.9, roughness: 0.4 });

/* ------------------------------------------------------------------ */
/*  Helpers                                                            */
/* ------------------------------------------------------------------ */
const truck = new THREE.Group();
scene.add(truck);

function rbox(w, h, d, mat, r = 0.05) {
  const rad = Math.min(r, Math.min(w, h, d) / 2 - 0.001);
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, rad), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function box(w, h, d, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function part(mesh, x, y, z, parent = truck) {
  mesh.position.set(x, y, z);
  parent.add(mesh);
  return mesh;
}

/* ------------------------------------------------------------------ */
/*  Dimensions (metres)                                                */
/* ------------------------------------------------------------------ */
const HALF_W    = 0.89;   // body half width
const WHEEL_R   = 0.38;
const TIRE_W    = 0.26;
const WHEEL_X   = 0.83;
const FRONT_Z   = 1.5;
const REAR_Z    = -1.5;

/* ------------------------------------------------------------------ */
/*  Underbody frame                                                    */
/* ------------------------------------------------------------------ */
part(rbox(1.52, 0.16, 3.7, darkMat, 0.05), 0, 0.50, -0.1);

/* ------------------------------------------------------------------ */
/*  Cab — lower (two doors)                                            */
/* ------------------------------------------------------------------ */
part(rbox(1.78, 0.58, 1.20, bodyMat, 0.10), 0, 0.87, 0.0);

// door shut-lines & handles
[1, -1].forEach(s => {
  part(box(0.012, 0.46, 0.9, darkMat), s * (HALF_W + 0.001), 0.88, 0.0);      // side crease (thin dark strip)
  const handle = part(rbox(0.14, 0.035, 0.05, chromeMat, 0.015), s * (HALF_W + 0.01), 1.03, 0.16);
});

/* ------------------------------------------------------------------ */
/*  Cab — greenhouse (glass core + painted frame)                      */
/* ------------------------------------------------------------------ */
part(rbox(1.58, 0.53, 0.84, glassMat, 0.06), 0, 1.42, -0.09).castShadow = false; // glass core

// painted roof cap (overhangs the glass a touch)
part(rbox(1.64, 0.12, 0.90, bodyMat, 0.06), 0, 1.70, -0.11);

// slanted windshield
const windshield = part(box(1.50, 0.62, 0.03), 0, 1.42, 0.44);
windshield.material = glassMat; windshield.rotation.x = -0.42; windshield.castShadow = false;

// A-pillars (frame the windshield)
[1, -1].forEach(s => {
  const p = part(box(0.07, 0.64, 0.09), s * 0.74, 1.42, 0.44);
  p.material = bodyMat; p.rotation.x = -0.42; p.castShadow = true;
});
// C-pillars (frame the rear glass)
[1, -1].forEach(s => part(rbox(0.08, 0.50, 0.10, bodyMat, 0.03), s * 0.75, 1.42, -0.50));

/* ------------------------------------------------------------------ */
/*  Side mirrors                                                       */
/* ------------------------------------------------------------------ */
[1, -1].forEach(s => {
  part(rbox(0.10, 0.03, 0.03, darkMat, 0.01), s * 0.94, 1.20, 0.52);          // arm
  part(rbox(0.05, 0.12, 0.14, bodyMat, 0.03), s * 1.00, 1.22, 0.55);          // housing
  const g = part(box(0.02, 0.10, 0.11), s * 1.02, 1.22, 0.555);
  g.material = glassMat; g.castShadow = false;
});

/* ------------------------------------------------------------------ */
/*  Hood / front body                                                  */
/* ------------------------------------------------------------------ */
part(rbox(1.76, 0.42, 1.52, bodyMat, 0.09), 0, 0.81, 1.35);                   // hood block (y 0.60–1.02)

// front fascia panel
part(rbox(1.74, 0.44, 0.08, bodyMat, 0.05), 0, 0.80, 2.10);

// grille (recessed dark + chrome surround + slats)
part(rbox(1.10, 0.36, 0.05, chromeMat, 0.03), 0, 0.80, 2.11);
part(rbox(1.00, 0.30, 0.05, grilleMat, 0.02), 0, 0.80, 2.135);
for (let i = 0; i < 4; i++) {
  part(box(0.98, 0.02, 0.03), 0, 0.68 + i * 0.08, 2.155).material = chromeMat;
}

// headlights
[1, -1].forEach(s => {
  part(rbox(0.34, 0.22, 0.12, chromeMat, 0.05), s * 0.62, 0.90, 2.07);        // reflector housing
  const lens = part(rbox(0.31, 0.19, 0.06, lensMat, 0.03), s * 0.62, 0.90, 2.14);
  lens.castShadow = false;
  const bulb = part(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.03, 20), bulbMat), s * 0.62, 0.90, 2.12);
  bulb.rotation.x = Math.PI / 2;
});

// front bumper + valance + fog lights
part(rbox(1.74, 0.22, 0.20, chromeMat, 0.06), 0, 0.55, 2.16);
part(rbox(1.40, 0.14, 0.12, darkMat, 0.04), 0, 0.45, 2.14);
[1, -1].forEach(s => {
  const fog = part(new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.04, 18), amberMat), s * 0.55, 0.52, 2.22);
  fog.rotation.x = Math.PI / 2;
});

/* ------------------------------------------------------------------ */
/*  Cargo bed (open, with tailgate)                                    */
/* ------------------------------------------------------------------ */
const BED_FRONT = -0.62, BED_REAR = -2.30;
const BED_CZ = (BED_FRONT + BED_REAR) / 2;           // -1.46
const BED_LEN = BED_FRONT - BED_REAR;                // 1.68

// headboard (front wall behind cab)
part(rbox(1.76, 0.56, 0.08, bodyMat, 0.04), 0, 0.85, BED_FRONT);
// side walls (outer, painted) + inner liner + rail caps
[1, -1].forEach(s => {
  part(rbox(0.10, 0.54, BED_LEN, bodyMat, 0.03), s * 0.84, 0.85, BED_CZ);
  part(rbox(0.03, 0.48, BED_LEN - 0.06, linerMat, 0.01), s * 0.785, 0.85, BED_CZ);
  part(rbox(0.15, 0.04, BED_LEN, darkMat, 0.02), s * 0.84, 1.14, BED_CZ);      // rail cap
});
// bed floor (liner)
part(rbox(1.62, 0.10, BED_LEN, linerMat, 0.02), 0, 0.66, BED_CZ);
// inner front liner
part(rbox(1.60, 0.48, 0.03, linerMat, 0.01), 0, 0.85, BED_FRONT - 0.06);

// tailgate (closed) with handle + styling line
part(rbox(1.76, 0.50, 0.09, bodyMat, 0.04), 0, 0.83, BED_REAR);
part(rbox(0.30, 0.05, 0.05, chromeMat, 0.02), 0, 0.98, BED_REAR - 0.04);
part(box(1.6, 0.012, 0.02, ), 0, 0.80, BED_REAR - 0.045).material = darkMat;

// rear bumper + tail lights
part(rbox(1.74, 0.20, 0.20, chromeMat, 0.06), 0, 0.55, BED_REAR - 0.06);
[1, -1].forEach(s => {
  part(rbox(0.14, 0.36, 0.07, tailMat, 0.03), s * 0.80, 0.90, BED_REAR + 0.02);
});
// exhaust tip
const exhaust = part(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.14, 18), chromeMat), -0.55, 0.44, BED_REAR - 0.12);
exhaust.rotation.x = Math.PI / 2;

/* ------------------------------------------------------------------ */
/*  Fender flares (wheel arches)                                       */
/* ------------------------------------------------------------------ */
function fender(x, z) {
  const t = new THREE.Mesh(
    new THREE.TorusGeometry(0.47, 0.06, 12, 28, Math.PI),
    darkMat
  );
  t.rotation.y = Math.PI / 2;
  t.position.set(x, 0.40, z);
  t.castShadow = true; t.receiveShadow = true;
  truck.add(t);
}
[[0.90, FRONT_Z], [-0.90, FRONT_Z], [0.90, REAR_Z], [-0.90, REAR_Z]].forEach(p => fender(p[0], p[1]));

/* ------------------------------------------------------------------ */
/*  Wheels                                                             */
/* ------------------------------------------------------------------ */
function makeWheel() {
  const g = new THREE.Group();
  const rimR = WHEEL_R * 0.60;

  const tire = new THREE.Mesh(new THREE.CylinderGeometry(WHEEL_R, WHEEL_R, TIRE_W, 48, 1, false), tireMat);
  tire.rotation.z = Math.PI / 2;
  tire.castShadow = true; tire.receiveShadow = true;
  g.add(tire);

  [1, -1].forEach(s => {
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(rimR, rimR, 0.06, 32), rimMat);
    rim.rotation.z = Math.PI / 2;
    rim.position.x = s * (TIRE_W / 2 - 0.015);
    rim.castShadow = true;
    g.add(rim);

    const hub = new THREE.Mesh(new THREE.CylinderGeometry(rimR * 0.30, rimR * 0.30, 0.07, 16), chromeMat);
    hub.rotation.z = Math.PI / 2;
    hub.position.x = s * (TIRE_W / 2);
    g.add(hub);

    const spokes = 5;
    for (let i = 0; i < spokes; i++) {
      const ang = (i / spokes) * Math.PI * 2;
      const sp = new THREE.Mesh(new THREE.BoxGeometry(0.05, rimR * 1.2, 0.05), rimMat);
      sp.position.set(s * (TIRE_W / 2 - 0.03), Math.sin(ang) * rimR * 0.5, Math.cos(ang) * rimR * 0.5);
      sp.rotation.x = Math.PI / 2 - ang;
      sp.castShadow = true;
      g.add(sp);
    }
  });
  return g;
}

[[WHEEL_X, FRONT_Z], [-WHEEL_X, FRONT_Z], [WHEEL_X, REAR_Z], [-WHEEL_X, REAR_Z]].forEach(p => {
  const w = makeWheel();
  w.position.set(p[0], WHEEL_R, p[1]);
  truck.add(w);
});

/* ------------------------------------------------------------------ */
/*  Center the object                                                  */
/* ------------------------------------------------------------------ */
truck.position.set(0, 0, 0);

/* ------------------------------------------------------------------ */
/*  Controls                                                           */
/* ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.target.set(0, 0.85, 0);
controls.minDistance = 4;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.495;
controls.update();

/* ------------------------------------------------------------------ */
/*  Resize + render loop                                               */
/* ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
