<body>
<div id="caption">Carved Butternut Pelican &nbsp;·&nbsp; hand gouged, satin wax finish</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16130f);
scene.fog = new THREE.Fog(0x16130f, 2.4, 8.0);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(0.86, 0.60, 1.28);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.62;
controls.target.set(0, 0.40, 0);
controls.minDistance = 0.55;
controls.maxDistance = 4.2;
controls.maxPolarAngle = Math.PI * 0.52;
controls.update();

/* ============================================================
   LIGHTING  — key + fill + rim over a shadow-only ground
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xd8c9ad, 0x1c1610, 0.42);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff0d8, 2.35);
key.position.set(1.45, 2.25, 1.35);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.4;
key.shadow.camera.far = 8.0;
key.shadow.camera.left = -1.1;
key.shadow.camera.right = 1.1;
key.shadow.camera.top = 1.3;
key.shadow.camera.bottom = -0.5;
key.shadow.bias = -0.0009;
key.shadow.normalBias = 0.012;
key.shadow.radius = 2.4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fb2c8, 0.42);
fill.position.set(-1.6, 0.95, 0.85);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9a8, 1.15);
rim.position.set(-0.75, 1.15, -1.75);
scene.add(rim);

const bounce = new THREE.PointLight(0xffbe86, 0.35, 3.0, 2.0);
bounce.position.set(0.0, 0.06, 0.55);
scene.add(bounce);

// Ground plane: shadow only
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(14, 14),
  new THREE.ShadowMaterial({ opacity: 0.46 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ============================================================
   PROCEDURAL WOOD MATERIAL
   Canvas-generated grain map (no external assets) + gouge facets
   ============================================================ */

// --- small deterministic value-noise helpers (for canvas textures) ---
function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}
function smooth(t) { return t * t * (3 - 2 * t); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = smooth(xf), v = smooth(yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi);
  const c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
function fbm2(x, y, oct) {
  let s = 0, amp = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += amp * vnoise(x * f, y * f); f *= 2.03; amp *= 0.5; }
  return s;
}

/**
 * Butternut grain map. Vertical (V axis) growth rings sweeping up the
 * billet, with darker heartwood streaks and scattered pore flecks.
 */
function makeWoodTexture(w, h, opts) {
  const o = Object.assign({
    base: [201, 163, 116],
    dark: [126, 88, 55],
    heart: [96, 62, 38],
    ringFreq: 26.0,
    warp: 2.2,
    streaks: 1.0,
    contrast: 1.0
  }, opts || {});
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(w, h);
  const D = img.data;

  for (let y = 0; y < h; y++) {
    const v = y / h;
    for (let x = 0; x < w; x++) {
      const u = x / w;

      // Warp the ring coordinate so grain flows and swirls like real stock.
      const wx = fbm2(u * 3.1, v * 1.6, 4) - 0.5;
      const wy = fbm2(u * 2.2 + 11.3, v * 4.4 + 5.1, 4) - 0.5;
      const ring = u * o.ringFreq + wx * o.warp * 5.0 + wy * o.warp * 1.4;

      // Ring profile: sharp latewood lines, soft earlywood fields
      let g = Math.sin(ring * Math.PI * 2.0) * 0.5 + 0.5;
      g = Math.pow(g, 2.1);

      // fine fiber striation along grain direction
      const fiber = fbm2(u * 190.0, v * 5.0, 2);
      g = g * 0.78 + fiber * 0.22;

      // Heartwood streaking: broad darker bands
      const streakField = fbm2(u * 1.7 + 31.7, v * 0.9 + 2.4, 3);
      const streak = Math.pow(Math.max(0, streakField - 0.44) * 2.6, 1.5) * o.streaks;

      // pores / flecks
      const fleck = vnoise(u * 320.0, v * 96.0);
      const pore = fleck > 0.86 ? (fleck - 0.86) * 3.4 : 0.0;

      let t = Math.min(1, g * 0.72 + pore * 0.55);
      t = Math.min(1, Math.max(0, (t - 0.5) * o.contrast + 0.5));

      let r = o.base[0] * (1 - t) + o.dark[0] * t;
      let gg = o.base[1] * (1 - t) + o.dark[1] * t;
      let b = o.base[2] * (1 - t) + o.dark[2] * t;

      const s = Math.min(1, streak);
      r = r * (1 - s) + o.heart[0] * s;
      gg = gg * (1 - s) + o.heart[1] * s;
      b = b * (1 - s) + o.heart[2] * s;

      const i = (y * w + x) * 4;
      D[i] = r; D[i + 1] = gg; D[i + 2] = b; D[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

/** Roughness variation map derived from the same grain logic (grayscale). */
function makeGrainRoughness(w, h, lo, hi) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(w, h);
  const D = img.data;
  for (let y = 0; y < h; y++) {
    const v = y / h;
    for (let x = 0; x < w; x++) {
      const u = x / w;
      const wx = fbm2(u * 3.1, v * 1.6, 4) - 0.5;
      const ring = u * 26.0 + wx * 11.0;
      let g = Math.sin(ring * Math.PI * 2.0) * 0.5 + 0.5;
      g = Math.pow(g, 2.0);
      const fiber = fbm2(u * 170.0, v * 6.0, 2);
      const patch = fbm2(u * 5.0 + 60.0, v * 5.0 + 17.0, 3);
      let t = g * 0.42 + fiber * 0.24 + patch * 0.34;
      t = Math.min(1, Math.max(0, t));
      const val = (lo + (hi - lo) * t) * 255;
      const i = (y * w + x) * 4;
      D[i] = D[i + 1] = D[i + 2] = val; D[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = 4;
  return tex;
}

const woodMap      = makeWoodTexture(768, 768, {});
const woodMapPale  = makeWoodTexture(512, 512, { base:[212,178,133], dark:[152,112,74], heart:[118,80,50], ringFreq:20, streaks:0.55, contrast:0.82 });
const woodMapDark  = makeWoodTexture(512, 512, { base:[150,109,68], dark:[86,55,32], heart:[62,38,22], ringFreq:32, streaks:1.5, contrast:1.15 });
const roughMap     = makeGrainRoughness(512, 512, 0.28, 0.62);

// Grain runs vertically up the billet -> rotate the map 90° so ring bands
// (drawn along U) sweep along the model's Y axis.
[woodMap, woodMapPale, woodMapDark, roughMap].forEach(t => {
  t.center.set(0.5, 0.5);
  t.rotation = Math.PI / 2;
});

function woodMaterial(map, opts) {
  const o = Object.assign({ color: 0xffffff, rough: 0.44, repeat: [1, 1], sheen: 0.0 }, opts || {});
  const m = map.clone();
  m.needsUpdate = true;
  m.wrapS = m.wrapT = THREE.RepeatWrapping;
  m.center.set(0.5, 0.5);
  m.rotation = Math.PI / 2;
  m.repeat.set(o.repeat[0], o.repeat[1]);
  const r = roughMap.clone();
  r.needsUpdate = true;
  r.wrapS = r.wrapT = THREE.RepeatWrapping;
  r.center.set(0.5, 0.5);
  r.rotation = Math.PI / 2;
  r.repeat.set(o.repeat[0], o.repeat[1]);

  return new THREE.MeshPhysicalMaterial({
    map: m,
    roughnessMap: r,
    color: o.color,
    roughness: o.rough,
    metalness: 0.0,
    clearcoat: 0.34,          // lightly waxed satin finish
    clearcoatRoughness: 0.52,
    sheen: 0.25,
    sheenRoughness: 0.85,
    sheenColor: new THREE.Color(0xffe6c0),
    flatShading: true         // gouge facets
  });
}

/* ============================================================
   GOUGE-FACET GEOMETRY UTILITIES
   ============================================================ */

/** Deterministic pseudo-random from a 3D position (for carve displacement). */
function pnoise3(x, y, z) {
  const s = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453;
  return (s - Math.floor(s)) * 2 - 1;
}
function fbm3(x, y, z, oct) {
  let sum = 0, amp = 1, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) {
    // smooth-ish by averaging neighbouring lattice samples
    const xi = Math.floor(x * f), yi = Math.floor(y * f), zi = Math.floor(z * f);
    const xf = x * f - xi, yf = y * f - yi, zf = z * f - zi;
    const u = smooth(xf), v = smooth(yf), wq = smooth(zf);
    const c000 = pnoise3(xi, yi, zi),         c100 = pnoise3(xi + 1, yi, zi);
    const c010 = pnoise3(xi, yi + 1, zi),     c110 = pnoise3(xi + 1, yi + 1, zi);
    const c001 = pnoise3(xi, yi, zi + 1),     c101 = pnoise3(xi + 1, yi, zi + 1);
    const c011 = pnoise3(xi, yi + 1, zi + 1), c111 = pnoise3(xi + 1, yi + 1, zi + 1);
    const x00 = c000 * (1 - u) + c100 * u, x10 = c010 * (1 - u) + c110 * u;
    const x01 = c001 * (1 - u) + c101 * u, x11 = c011 * (1 - u) + c111 * u;
    const y0 = x00 * (1 - v) + x10 * v, y1 = x01 * (1 - v) + x11 * v;
    sum += amp * (y0 * (1 - wq) + y1 * wq);
    norm += amp;
    amp *= 0.5; f *= 2.07;
  }
  return sum / norm;
}

/**
 * Carve a geometry: push vertices along their normals with a banded,
 * chisel-like signal so the surface reads as overlapping gouge scoops.
 * Welds duplicate vertices first so the displacement stays watertight.
 */
function carve(geo, amount, scale, bandFreq, bandAmt) {
  const pos = geo.attributes.position;
  const nrm = geo.attributes.normal;
  if (!nrm) geo.computeVertexNormals();
  const n = geo.attributes.normal;
  const bf = bandFreq === undefined ? 9.0 : bandFreq;
  const ba = bandAmt === undefined ? 0.55 : bandAmt;

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const nx = n.getX(i), ny = n.getY(i), nz = n.getZ(i);

    // broad lumpiness of a hand-worked blank
    const lump = fbm3(x * scale, y * scale, z * scale, 3);

    // gouge bands: overlapping scoop channels running around the form
    const band = Math.sin((y * bf) + Math.atan2(z, x) * 2.4 + lump * 2.0);
    const scoop = -Math.abs(band) * ba + ba * 0.5;

    const d = amount * (lump * 0.62 + scoop);

    pos.setXYZ(i, x + nx * d, y + ny * d, z + nz * d);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

/** Merge-free helper: build a lathe profile from a list of [radius, y]. */
function latheGeo(points, segments, phiStart, phiLength) {
  const pts = points.map(p => new THREE.Vector2(Math.max(0.00025, p[0]), p[1]));
  return new THREE.LatheGeometry(pts, segments || 40, phiStart || 0, phiLength || Math.PI * 2);
}

/** Smooth a coarse profile with Catmull-Rom resampling for clean lathes. */
function resampleProfile(ctrl, count) {
  const curve = new THREE.SplineCurve(ctrl.map(p => new THREE.Vector2(p[0], p[1])));
  const out = [];
  for (let i = 0; i < count; i++) {
    const p = curve.getPoint(i / (count - 1));
    out.push([Math.max(0.0004, p.x), p.y]);
  }
  return out;
}

/* ============================================================
   MATERIALS
   ============================================================ */
const matBody = woodMaterial(woodMap, { rough: 0.46, repeat: [1, 1] });
const matBodyPale = woodMaterial(woodMapPale, { rough: 0.42, repeat: [1.1, 1.1] });
const matWingEdge = woodMaterial(woodMapDark, { rough: 0.40, repeat: [1.4, 1.4], color: 0xf2e3d0 });
const matPouch = woodMaterial(woodMapPale, { rough: 0.38, repeat: [1.25, 1.0], color: 0xffe9cd });
const matBill = woodMaterial(woodMapPale, { rough: 0.34, repeat: [2.0, 1.0], color: 0xf6dcb4 });

const matBaseWood = woodMaterial(woodMapDark, { rough: 0.5, repeat: [1.6, 1.0], color: 0xe8d6bd });

const matEye = new THREE.MeshPhysicalMaterial({
  color: 0x07060a, roughness: 0.06, metalness: 0.0,
  clearcoat: 1.0, clearcoatRoughness: 0.02,
  reflectivity: 0.75
});
const matPaintDark = new THREE.MeshStandardMaterial({
  color: 0x241c14, roughness: 0.55, metalness: 0.0
});
const matBillTip = new THREE.MeshPhysicalMaterial({
  color: 0xc9713a, roughness: 0.33, metalness: 0.0,
  clearcoat: 0.5, clearcoatRoughness: 0.35, flatShading: true
});

/* ============================================================
   THE PELICAN  (single centered object, group `pelican`)
   Scale: ~ 0.90 m tall folk carving on a small plinth.
   ============================================================ */
const pelican = new THREE.Group();
scene.add(pelican);

/* ---------- 1. BODY BILLET ----------------------------------
   Upright teardrop body: heavy breast, tucked tail. */
const bodyProfileCtrl = [
  [0.001, 0.155],
  [0.070, 0.160],
  [0.118, 0.196],
  [0.148, 0.258],
  [0.161, 0.330],
  [0.158, 0.404],
  [0.140, 0.462],
  [0.112, 0.505],
  [0.080, 0.534],
  [0.058, 0.552],
  [0.001, 0.566]
];
const bodyProfile = resampleProfile(bodyProfileCtrl, 52);
let bodyGeo = latheGeo(bodyProfile, 56);
bodyGeo.scale(1.0, 1.0, 1.30);           // deeper front-to-back than wide
carve(bodyGeo, 0.0125, 7.5, 34.0, 0.62);
const body = new THREE.Mesh(bodyGeo, matBody);
body.castShadow = true; body.receiveShadow = true;
pelican.add(body);

/* Breast swell — the low, full chest of a pelican at rest */
let breastGeo = new THREE.SphereGeometry(0.108, 40, 32);
breastGeo.scale(0.92, 1.05, 0.90);
carve(breastGeo, 0.010, 9.0, 30.0, 0.6);
const breast = new THREE.Mesh(breastGeo, matBody);
breast.position.set(0, 0.318, 0.100);
breast.castShadow = true; breast.receiveShadow = true;
pelican.add(breast);

/* Rump / tail block */
let rumpGeo = new THREE.SphereGeometry(0.088, 32, 24);
rumpGeo.scale(0.95, 1.0, 1.05);
carve(rumpGeo, 0.009, 10.0, 28.0, 0.55);
const rump = new THREE.Mesh(rumpGeo, matBody);
rump.position.set(0, 0.352, -0.108);
rump.castShadow = true; rump.receiveShadow = true;
pelican.add(rump);

/* ---------- 2. TAIL ----------------------------------------- */
const tailShape = new THREE.Shape();
tailShape.moveTo(0, 0);
tailShape.lineTo(0.062, -0.028);
tailShape.lineTo(0.070, -0.100);
tailShape.quadraticCurveTo(0.030, -0.150, 0.0, -0.163);
tailShape.quadraticCurveTo(-0.030, -0.150, -0.070, -0.100);
tailShape.lineTo(-0.062, -0.028);
tailShape.lineTo(0, 0);
let tailGeo = new THREE.ExtrudeGeometry(tailShape, {
  depth: 0.030, bevelEnabled: true, bevelThickness: 0.010,
  bevelSize: 0.012, bevelSegments: 3, curveSegments: 10
});
tailGeo.translate(0, 0, -0.015);
tailGeo.rotateX(Math.PI / 2);
tailGeo = tailGeo.toNonIndexed();
carve(tailGeo, 0.004, 22.0, 60.0, 0.5);
const tail = new THREE.Mesh(tailGeo, matBody);
tail.position.set(0, 0.352, -0.152);
tail.rotation.x = -0.30;
tail.castShadow = true; tail.receiveShadow = true;
pelican.add(tail);

/* ---------- 3. FOLDED WINGS ---------------------------------
   Carved as shallow shield-shaped slabs laid on the flanks, with
   a darker heartwood edge strip along the trailing/lower margin. */
function makeWing(side) {
  const g = new THREE.Group();

  const wingShape = new THREE.Shape();
  wingShape.moveTo(0.00, 0.145);                                  // shoulder top
  wingShape.bezierCurveTo(0.075, 0.130, 0.115, 0.055, 0.112, -0.030);
  wingShape.bezierCurveTo(0.108, -0.110, 0.060, -0.175, -0.010, -0.205); // primaries tip
  wingShape.bezierCurveTo(-0.055, -0.150, -0.088, -0.060, -0.086, 0.032);
  wingShape.bezierCurveTo(-0.084, 0.098, -0.048, 0.140, 0.00, 0.145);

  let wg = new THREE.ExtrudeGeometry(wingShape, {
    depth: 0.030, bevelEnabled: true, bevelThickness: 0.014,
    bevelSize: 0.016, bevelSegments: 4, curveSegments: 20
  });
  wg.translate(0, 0, -0.015);
  wg = wg.toNonIndexed();
  // Cup the slab so it wraps the flank
  {
    const p = wg.attributes.position;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const bendX = -(x * x) * 0.85;
      const bendY = -(y * y) * 0.30;
      p.setZ(i, z + bendX + bendY);
    }
    p.needsUpdate = true;
    wg.computeVertexNormals();
  }
  carve(wg, 0.0055, 16.0, 44.0, 0.62);
  const wing = new THREE.Mesh(wg, matBodyPale);
  wing.castShadow = true; wing.receiveShadow = true;
  g.add(wing);

  // Darker heartwood streak along the wing edge (a thin raised welt)
  const edgeCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3( 0.000,  0.142, 0.006),
    new THREE.Vector3( 0.072,  0.118, 0.000),
    new THREE.Vector3( 0.106,  0.036, -0.006),
    new THREE.Vector3( 0.104, -0.046, -0.010),
    new THREE.Vector3( 0.068, -0.140, -0.012),
    new THREE.Vector3(-0.010, -0.198, -0.014)
  ]);
  const edgeGeo = new THREE.TubeGeometry(edgeCurve, 44, 0.0085, 7, false);
  const edge = new THREE.Mesh(edgeGeo, matWingEdge);
  edge.castShadow = true; edge.receiveShadow = true;
  g.add(edge);

  // Three carved primary-feather grooves — shallow raised ridges
  for (let i = 0; i < 4; i++) {
    const t = i / 3;
    const c = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0.052 - t * 0.030, 0.052 - t * 0.030, 0.010),
      new THREE.Vector3(0.048 - t * 0.036, -0.030 - t * 0.020, 0.010),
      new THREE.Vector3(0.026 - t * 0.030, -0.116 - t * 0.014, 0.004),
      new THREE.Vector3(-0.004 - t * 0.014, -0.176 - t * 0.006, -0.004)
    ]);
    const fg = new THREE.TubeGeometry(c, 26, 0.0045, 6, false);
    const f = new THREE.Mesh(fg, matWingEdge);
    f.castShadow = true;
    g.add(f);
  }

  g.position.set(side * 0.150, 0.352, -0.006);
  g.rotation.y = side * (Math.PI / 2) - side * 0.16;
  g.rotation.z = side * 0.05;
  g.scale.set(side, 1, 1);
  return g;
}
pelican.add(makeWing(1));
pelican.add(makeWing(-1));

/* ---------- 4. NECK -----------------------------------------
   Thick S-curve sweeping up out of the shoulders; grain flows up it. */
const neckCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0,  0.470,  0.052),
  new THREE.Vector3(0,  0.530,  0.070),
  new THREE.Vector3(0,  0.592,  0.062),
  new THREE.Vector3(0,  0.648,  0.028),
  new THREE.Vector3(0,  0.700, -0.008),
  new THREE.Vector3(0,  0.752, -0.020),
  new THREE.Vector3(0,  0.800,  0.000),
  new THREE.Vector3(0,  0.832,  0.034)
]);
const neckSteps = 72;
const neckRadial = 26;
const neckGeo = new THREE.BufferGeometry();
{
  const positions = [];
  const uvs = [];
  const indices = [];
  const frames = neckCurve.computeFrenetFrames(neckSteps, false);
  for (let i = 0; i <= neckSteps; i++) {
    const t = i / neckSteps;
    const p = neckCurve.getPointAt(t);
    const N = frames.normals[i], B = frames.binormals[i];
    // taper: thick at the shoulders, slimmer at mid-neck, flaring to skull
    const r = 0.0655 * (1 - t) + 0.0300 * t + Math.sin(t * Math.PI) * 0.0075 + Math.pow(t, 5) * 0.026;
    for (let j = 0; j <= neckRadial; j++) {
      const a = (j / neckRadial) * Math.PI * 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      // slightly oval section (deeper front-to-back), plus a hint of facets
      const facet = 1.0 + Math.cos(a * 6.0) * 0.022 + Math.sin(t * 26.0 + a * 2.0) * 0.018;
      const rx = r * 0.94 * facet;
      const rz = r * 1.08 * facet;
      positions.push(
        p.x + N.x * ca * rx + B.x * sa * rz,
        p.y + N.y * ca * rx + B.y * sa * rz,
        p.z + N.z * ca * rx + B.z * sa * rz
      );
      uvs.push(j / neckRadial, t);
    }
  }
  for (let i = 0; i < neckSteps; i++) {
    for (let j = 0; j < neckRadial; j++) {
      const a = i * (neckRadial + 1) + j;
      const b = a + neckRadial + 1;
      indices.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  neckGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  neckGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  neckGeo.setIndex(indices);
  neckGeo.computeVertexNormals();
}
const neckFlat = neckGeo.toNonIndexed();
neckFlat.computeVertexNormals();
const neck = new THREE.Mesh(neckFlat, matBody);
neck.castShadow = true; neck.receiveShadow = true;
pelican.add(neck);

/* Shoulder blend collar so neck meets body cleanly */
let collarGeo = new THREE.SphereGeometry(0.082, 28, 20);
collarGeo.scale(1.0, 0.80, 1.05);

/* ---------- 5. HEAD ----------------------------------------- */
const headGroup = new THREE.Group();
headGroup.position.set(0, 0.836, 0.040);
headGroup.rotation.x = 0.10;

let skullGeo = new THREE.SphereGeometry(0.062, 40, 30);

/* Small carved crest ridge over the crown */

/* ---------- 6. THE OVERSIZED FLAT BILL ------------------------
   Upper mandible: long, broad, flat-topped wedge with a hooked nail. */
function makeUpperBill() {
  const L = 0.300;                    // bill length (oversized, folk-art)
  const segs = 46;
  const ring = 18;
  const positions = [], uvs = [], indices = [];

  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const z = t * L;

    // Plan-view half-width: wide at base, gently tapering, pinching at tip
    const halfW = 0.052 * (1 - Math.pow(t, 2.4)) + 0.011;
    // Side-view thickness: flat plate, thinning forward
    const thick = 0.026 * (1 - t * 0.62) + 0.0035;
    // Gentle downward droop plus a hooked tip
    const droop = -0.020 * t * t - Math.pow(Math.max(0, t - 0.86) / 0.14, 2.0) * 0.026;

    for (let j = 0; j <= ring; j++) {
      const a = (j / ring) * Math.PI * 2;
      const ca = Math.cos(a), sa = Math.sin(a);
      // Superellipse cross-section => flat top & bottom, crisp side edges
      const p = 2.9;
      const sx = Math.sign(ca) * Math.pow(Math.abs(ca), 2 / p);
      const sy = Math.sign(sa) * Math.pow(Math.abs(sa), 2 / p);
      // slight ridge along the culmen
      const ridge = 1.0 + Math.max(0, sy) * 0.16 * (1 - t * 0.5);
      const x = sx * halfW;
      const y = sy * thick * ridge + droop;
      positions.push(x, y, z);
      uvs.push(j / ring, t);
    }
  }
  for (let i = 0; i < segs; i++) {
    for (let j = 0; j < ring; j++) {
      const a = i * (ring + 1) + j;
      const b = a + ring + 1;
      indices.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(indices);
  g.computeVertexNormals();
  const flat = g.toNonIndexed();
  carve(flat, 0.0022, 26.0, 90.0, 0.45);
  return flat;
}

const billGroup = new THREE.Group();
billGroup.position.set(0, -0.006, 0.048);
billGroup.rotation.x = -0.055;
headGroup.add(billGroup);

const upperBill = new THREE.Mesh(makeUpperBill(), matBill);
upperBill.castShadow = true; upperBill.receiveShadow = true;
billGroup.add(upperBill);

/* Hooked nail at the bill tip */
let nailGeo = new THREE.SphereGeometry(0.016, 18, 14);
nailGeo.scale(0.70, 1.05, 1.35);
nailGeo = nailGeo.toNonIndexed();
carve(nailGeo, 0.0016, 40.0, 100.0, 0.4);
const nail = new THREE.Mesh(nailGeo, matBillTip);

/* Culmen line — thin painted dark ridge along the top of the bill */

/* Lower mandible rims — the thin bony arms that hold the pouch open */
function makeMandibleRim(side) {
  const c = new THREE.CatmullRomCurve3([
    new THREE.Vector3(side * 0.045, -0.020, 0.006),
    new THREE.Vector3(side * 0.052, -0.030, 0.070),
    new THREE.Vector3(side * 0.049, -0.038, 0.145),
    new THREE.Vector3(side * 0.038, -0.047, 0.212),
    new THREE.Vector3(side * 0.018, -0.052, 0.266),
    new THREE.Vector3(side * 0.002, -0.052, 0.288)
  ]);
  const g = new THREE.TubeGeometry(c, 48, 0.0062, 7, false);
  const m = new THREE.Mesh(g, matBill);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
billGroup.add(makeMandibleRim(1));
billGroup.add(makeMandibleRim(-1));

/* ---------- 7. THE DEEP GULAR POUCH ---------------------------
   A heavy bulging sack slung from the mandible rims down the throat. */
function makePouch() {
  const segs = 54;   // along the bill axis
  const ring = 30;   // around the sack
  const positions = [], uvs = [], indices = [];

  for (let i = 0; i <= segs; i++) {
    const t = i / segs;
    const z = 0.010 + t * 0.278;

    // width follows the mandible rims
    const halfW = (0.049 * (1 - Math.pow(t, 2.2)) + 0.006) * 1.02;
    // depth of sag: deepest around 40-55% of bill length
    const sag = Math.sin(Math.pow(t, 0.78) * Math.PI) * 0.108 + 0.012;
    const topY = -0.024 - t * 0.028;

    for (let j = 0; j <= ring; j++) {
      const a = (j / ring) * Math.PI - Math.PI * 0.5; // half revolution: -90..90
      // hemi-tube: x from rim to rim, y bulging downward
      const ca = Math.cos(a), sa = Math.sin(a);
      // bulge factor: pouches are fuller than a plain half-cylinder
      const bulge = 1.0 + Math.pow(Math.cos(a), 2.0) * 0.34;
      let x = sa * halfW * bulge;
      let y = topY - ca * sag * bulge * 0.92;

      // soft transverse wrinkles carved into the sack
      const wob = Math.sin(t * 30.0 + a * 1.2) * 0.0022 + Math.sin(t * 12.0) * 0.0018;
      y += wob;
      x += Math.sin(t * 22.0 + a * 3.0) * 0.0016;

      positions.push(x, y, z);
      uvs.push(j / ring, t);
    }
  }
  for (let i = 0; i < segs; i++) {
    for (let j = 0; j < ring; j++) {
      const a = i * (ring + 1) + j;
      const b = a + ring + 1;
      indices.push(a, a + 1, b, a + 1, b + 1, b);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  g.setIndex(indices);
  g.computeVertexNormals();
  const flat = g.toNonIndexed();
  carve(flat, 0.0030, 20.0, 55.0, 0.5);
  return flat;
}
const pouch = new THREE.Mesh(makePouch(), matPouch);

/* ---------- 9. LEGS & WEBBED FEET ---------------------------- */
function makeLeg(side) {
  const g = new THREE.Group();

  // stout tarsus
  const legCurve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0.170, 0.006),
    new THREE.Vector3(0, 0.124, 0.014),
    new THREE.Vector3(0, 0.074, 0.018),
    new THREE.Vector3(0, 0.030, 0.014),
    new THREE.Vector3(0, 0.012, 0.010)
  ]);
  const legGeo = new THREE.TubeGeometry(legCurve, 30, 0.0175, 8, false);
  const leg = new THREE.Mesh(legGeo, matBodyPale);
  leg.castShadow = true; leg.receiveShadow = true;
  g.add(leg);

  // thigh blend into body
  let thighGeo = new THREE.SphereGeometry(0.032, 20, 14);
  thighGeo.scale(0.9, 1.1, 1.0);
  const thigh = new THREE.Mesh(thighGeo, matBody);
  thigh.position.set(0, 0.176, 0.004);
  thigh.castShadow = true; thigh.receiveShadow = true;
  g.add(thigh);

  // webbed foot: flattened fan
  const footShape = new THREE.Shape();
  footShape.moveTo(0, -0.020);
  footShape.lineTo(0.038, 0.052);
  footShape.quadraticCurveTo(0.030, 0.062, 0.021, 0.058);
  footShape.lineTo(0.012, 0.070);
  footShape.quadraticCurveTo(0.002, 0.074, -0.008, 0.068);
  footShape.lineTo(-0.024, 0.060);
  footShape.quadraticCurveTo(-0.034, 0.050, -0.036, 0.038);
  footShape.lineTo(-0.026, -0.014);
  footShape.quadraticCurveTo(-0.014, -0.026, 0, -0.020);
  let footGeo = new THREE.ExtrudeGeometry(footShape, {
    depth: 0.013, bevelEnabled: true, bevelThickness: 0.005,
    bevelSize: 0.005, bevelSegments: 2, curveSegments: 10
  });
  footGeo.rotateX(-Math.PI / 2);
  footGeo = footGeo.toNonIndexed();
  carve(footGeo, 0.0016, 40.0, 120.0, 0.4);
  const foot = new THREE.Mesh(footGeo, matBodyPale);
  foot.position.set(0, 0.004, 0.012);
  foot.castShadow = true; foot.receiveShadow = true;
  g.add(foot);

  g.position.set(side * 0.055, 0, 0.008);
  g.rotation.y = side * 0.14;
  return g;
}
pelican.add(makeLeg(1));
pelican.add(makeLeg(-1));

/* ---------- 10. PLINTH (the base of the same billet) ---------- */
const plinthProfile = resampleProfile([
  [0.001, 0.000],

], 26);

plinth.castShadow = true; plinth.receiveShadow = true;

// lift the bird so the feet stand on the plinth top
[body, breast, rump, tail, neck, collar, throat, headGroup].forEach(o => { o.position.y += 0.034; });
pelican.children.forEach(c => {
  if (c !== plinth && c.type === 'Group') c.position.y += 0.034;
});

/* Recenter horizontally and sit on the ground */
pelican.position.set(0, 0, 0);

/* ============================================================
   ANIMATION
   ============================================================ */
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
