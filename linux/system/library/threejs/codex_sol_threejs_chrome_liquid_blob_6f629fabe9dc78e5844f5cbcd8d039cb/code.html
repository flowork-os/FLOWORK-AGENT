<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Chrome</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090b0e;
    }

    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x090b0e);
    scene.fog = new THREE.FogExp2(0x090b0e, 0.025);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(10.5, 6.7, 13.5);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const roomEnvironment = new RoomEnvironment();
    const environmentMap = pmremGenerator.fromScene(roomEnvironment, 0.04).texture;
    scene.environment = environmentMap;
    roomEnvironment.dispose();
    pmremGenerator.dispose();

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.65, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.enablePan = false;
    controls.minDistance = 8;
    controls.maxDistance = 24;
    controls.minPolarAngle = Math.PI * 0.22;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;

    const chromeMaterial = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0xdde7ef),
      metalness: 1,
      roughness: 0.055,
      clearcoat: 0.32,
      clearcoatRoughness: 0.045,
      envMapIntensity: 2.8
    });

    const blob = new MarchingCubes(
      78,
      chromeMaterial,
      false,
      false,
      220000
    );
    blob.isolation = 80;
    blob.scale.set(5.1, 5.7, 5.1);
    blob.position.set(0, 2.48, 0);
    blob.castShadow = true;
    blob.receiveShadow = true;

    const subtract = 12;

    function addBall(x, y, z, strength) {
      blob.addBall(x, y, z, strength, subtract);
    }

    addBall(0.50, 0.255, 0.50, 0.34);
    addBall(0.39, 0.265, 0.48, 0.25);
    addBall(0.61, 0.270, 0.48, 0.26);
    addBall(0.48, 0.265, 0.38, 0.25);
    addBall(0.52, 0.270, 0.62, 0.26);

    addBall(0.29, 0.285, 0.51, 0.18);
    addBall(0.70, 0.295, 0.53, 0.18);
    addBall(0.47, 0.290, 0.29, 0.17);
    addBall(0.55, 0.300, 0.71, 0.18);

    addBall(0.40, 0.365, 0.48, 0.27);
    addBall(0.55, 0.385, 0.52, 0.30);
    addBall(0.48, 0.465, 0.50, 0.29);

    addBall(0.36, 0.475, 0.46, 0.17);
    addBall(0.31, 0.565, 0.43, 0.13);
    addBall(0.27, 0.645, 0.40, 0.095);

    addBall(0.61, 0.490, 0.55, 0.17);
    addBall(0.67, 0.575, 0.58, 0.12);
    addBall(0.70, 0.655, 0.60, 0.085);

    addBall(0.49, 0.565, 0.50, 0.21);
    addBall(0.47, 0.655, 0.49, 0.145);
    addBall(0.44, 0.725, 0.48, 0.085);

    addBall(0.66, 0.845, 0.49, 0.055);
    addBall(0.34, 0.935, 0.55, 0.038);

    blob.update();
    scene.add(blob);

    const floorMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x11151a,
      metalness: 0.18,
      roughness: 0.24,
      envMapIntensity: 0.75,
      clearcoat: 0.45,
      clearcoatRoughness: 0.16
    });

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      floorMaterial
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.02;
    floor.receiveShadow = true;
    scene.add(floor);

    const hemisphereLight = new THREE.HemisphereLight(0xb9d5ff, 0x17100d, 1.1);
    scene.add(hemisphereLight);

    const keyLight = new THREE.SpotLight(0xffffff, 1450, 35, 0.38, 0.55, 1.25);
    keyLight.position.set(-7, 13, 8);
    keyLight.target.position.set(0, 2.4, 0);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 35;
    keyLight.shadow.bias = -0.00025;
    keyLight.shadow.normalBias = 0.025;
    scene.add(keyLight, keyLight.target);

    const rimLight = new THREE.SpotLight(0x8fbfff, 900, 28, 0.5, 0.7, 1.4);
    rimLight.position.set(8, 8, -8);
    rimLight.target.position.set(0, 3.1, 0);
    scene.add(rimLight, rimLight.target);

    const warmLight = new THREE.PointLight(0xffc49a, 180, 18, 1.7);
    warmLight.position.set(-6, 3.5, -4);
    scene.add(warmLight);

    const frontLight = new THREE.PointLight(0xffffff, 130, 16, 1.6);
    frontLight.position.set(2, 6, 8);
    scene.add(frontLight);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      warmLight.position.y = 3.5 + Math.sin(elapsed * 0.45) * 0.3;
      rimLight.intensity = 860 + Math.sin(elapsed * 0.6) * 60;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
