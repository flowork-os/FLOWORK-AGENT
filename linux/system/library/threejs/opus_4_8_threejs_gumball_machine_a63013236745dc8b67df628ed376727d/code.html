<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retro Gumball Machine</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141417; }
  #c { display: block; width: 100%; height: 100%; }
  .hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: 12px/1.4 system-ui, sans-serif; color: #8a8a92; letter-spacing: .04em;
    pointer-events: none; user-select: none; opacity: .7;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">drag to orbit • scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ---------- Renderer ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

/* ---------- Scene & Camera ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141417);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.4, 1.55, 3.3);

/* ---------- Environment (procedural, for chrome/glass reflections) ---------- */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

/* ---------- Lighting: hemisphere + key/fill/rim ---------- */
const hemi = new THREE.HemisphereLight(0xdfe6ff, 0x2b2530, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e6, 2.6);
key.position.set(3.2, 6.0, 4.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 22;
key.shadow.camera.left = -2;
key.shadow.camera.right = 2;
key.shadow.camera.top = 2.6;
key.shadow.camera.bottom = -1.2;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0xbcd4ff, 0.7);
fill.position.set(-4.0, 2.2, 2.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 2.0);
rim.position.set(-2.5, 3.4, -4.5);
scene.add(rim);

/* ---------- Ground plane (receives shadows only) ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- Materials ---------- */
const chromeMat = new THREE.MeshStandardMaterial({
  color: 0xf4f6f8, metalness: 1.0, roughness: 0.14, envMapIntensity: 1.35
});
const chromeDarkMat = new THREE.MeshStandardMaterial({
  color: 0xbfc4c9, metalness: 1.0, roughness: 0.28, envMapIntensity: 1.1
});
const redEnamel = new THREE.MeshPhysicalMaterial({
  color: 0xcf1620, metalness: 0.0, roughness: 0.22,
  clearcoat: 1.0, clearcoatRoughness: 0.06, envMapIntensity: 0.9,
  side: THREE.DoubleSide
});
const darkSlot = new THREE.MeshStandardMaterial({
  color: 0x14151a, metalness: 0.6, roughness: 0.5, envMapIntensity: 0.6
});
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0.0, roughness: 0.03,
  transmission: 1.0, thickness: 0.15, ior: 1.2,
  transparent: true, clearcoat: 1.0, clearcoatRoughness: 0.04,
  envMapIntensity: 1.0
});

/* ---------- The single centered object ---------- */
const machine = new THREE.Group();
scene.add(machine);

const rGlobe = 0.45;
const globeCenterY = 1.52;
const baseBottomY = 0.66;

/* --- Stand: foot disc + chrome pole + collars --- */
const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.5, 0.06, 64), chromeMat);
foot.position.y = 0.03;
foot.castShadow = true; foot.receiveShadow = true;
machine.add(foot);

const footCap = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.42, 0.05, 64), chromeDarkMat);
footCap.position.y = 0.085;
footCap.castShadow = true;
machine.add(footCap);

const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.062, 0.075, baseBottomY - 0.11, 40), chromeMat);
pole.position.y = 0.11 + (baseBottomY - 0.11) / 2;
pole.castShadow = true;
machine.add(pole);

const collarLow = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.02, 20, 40), chromeDarkMat);
collarLow.rotation.x = Math.PI / 2; collarLow.position.y = 0.12;
machine.add(collarLow);

const collarTop = new THREE.Mesh(new THREE.TorusGeometry(0.075, 0.022, 20, 40), chromeDarkMat);
collarTop.rotation.x = Math.PI / 2; collarTop.position.y = baseBottomY - 0.02;
machine.add(collarTop);

/* --- Red enamel base (lathe profile) --- */
const baseProfile = [
  [0.00, 0.00], [0.20, 0.00], [0.30, 0.03], [0.315, 0.07],
  [0.28, 0.13], [0.25, 0.23], [0.27, 0.33], [0.31, 0.43],
  [0.315, 0.47], [0.30, 0.50], [0.24, 0.505], [0.205, 0.49], [0.205, 0.45]
].map(p => new THREE.Vector2(p[0], p[1]));
const baseMesh = new THREE.Mesh(new THREE.LatheGeometry(baseProfile, 72), redEnamel);
baseMesh.position.y = baseBottomY;
baseMesh.castShadow = true; baseMesh.receiveShadow = true;
machine.add(baseMesh);

/* --- Chrome seat collar hiding the globe/base seam --- */
const seat = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.03, 24, 64), chromeMat);
seat.rotation.x = Math.PI / 2; seat.position.y = baseBottomY + 0.49;
seat.castShadow = true;
machine.add(seat);

/* --- Gumballs (instanced, candy colors) inside the globe --- */
const candy = [
  0xff3b3b, 0xff8c1a, 0xffd21a, 0x35c93a, 0x1a9cff,
  0x8c3bff, 0xff3bab, 0xffffff, 0x16cdbf, 0xff6ad0, 0x6ee23a
];
function packGumballs() {
  const R = 0.37, minD = 0.086, minD2 = minD * minD;
  const pts = [];
  let attempts = 0;
  const maxA = 60000, target = 330;
  while (pts.length < target && attempts < maxA) {
    attempts++;
    let x, y, z, d2;
    do { x = Math.random() * 2 - 1; y = Math.random() * 2 - 1; z = Math.random() * 2 - 1; d2 = x * x + y * y + z * z; }
    while (d2 > 1 || d2 < 1e-6);
    const r = R * Math.cbrt(Math.random());
    const inv = r / Math.sqrt(d2);
    const px = x * inv, py = y * inv, pz = z * inv;
    let ok = true;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i], dx = p.x - px, dy = p.y - py, dz = p.z - pz;
      if (dx * dx + dy * dy + dz * dz < minD2) { ok = false; break; }
    }
    if (ok) pts.push(new THREE.Vector3(px, py, pz));
  }
  return pts;
}
const gumPts = packGumballs();
const gumGeo = new THREE.SphereGeometry(0.05, 20, 16);
const gumMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff, metalness: 0.0, roughness: 0.22,
  clearcoat: 1.0, clearcoatRoughness: 0.08, envMapIntensity: 1.0
});
const gumballs = new THREE.InstancedMesh(gumGeo, gumMat, gumPts.length);
const dummy = new THREE.Object3D();
const col = new THREE.Color();
gumPts.forEach((p, i) => {
  dummy.position.copy(p);
  const s = 0.9 + Math.random() * 0.22;
  dummy.scale.setScalar(s);
  dummy.rotation.set(Math.random() * 6.28, Math.random() * 6.28, 0);
  dummy.updateMatrix();
  gumballs.setMatrixAt(i, dummy.matrix);
  col.set(candy[(Math.random() * candy.length) | 0]);
  gumballs.setColorAt(i, col);
});
gumballs.instanceMatrix.needsUpdate = true;
if (gumballs.instanceColor) gumballs.instanceColor.needsUpdate = true;
gumballs.position.y = globeCenterY;
machine.add(gumballs);

/* --- Glass globe --- */
const globe = new THREE.Mesh(new THREE.SphereGeometry(rGlobe, 96, 72), glassMat);
globe.position.y = globeCenterY;
globe.renderOrder = 2;
machine.add(globe);

/* --- Chrome lid on top --- */
const lidCollar = new THREE.Mesh(new THREE.TorusGeometry(0.135, 0.028, 24, 56), chromeMat);
lidCollar.rotation.x = Math.PI / 2; lidCollar.position.y = 1.95;
lidCollar.castShadow = true;
machine.add(lidCollar);

const dome = new THREE.Mesh(
  new THREE.SphereGeometry(0.14, 40, 24, 0, Math.PI * 2, 0, Math.PI * 0.5),
  chromeMat
);
dome.position.y = 1.95;
dome.castShadow = true;
machine.add(dome);

const finialStem = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.024, 0.035, 24), chromeMat);
finialStem.position.y = 2.10;
machine.add(finialStem);
const finialKnob = new THREE.Mesh(new THREE.SphereGeometry(0.032, 24, 18), chromeMat);
finialKnob.position.y = 2.13;
machine.add(finialKnob);

/* --- Coin mechanism on the front (+z) --- */
const coinGroup = new THREE.Group();
machine.add(coinGroup);

const housing = new THREE.Mesh(new RoundedBoxGeometry(0.24, 0.32, 0.18, 5, 0.035), chromeMat);
housing.position.set(0, 1.0, 0.29);
housing.castShadow = true;
coinGroup.add(housing);

const facePlate = new THREE.Mesh(new RoundedBoxGeometry(0.19, 0.26, 0.02, 4, 0.02), chromeDarkMat);
facePlate.position.set(0, 1.0, 0.385);
coinGroup.add(facePlate);

// coin slot
const slot = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.055, 0.03), darkSlot);
slot.position.set(0, 1.095, 0.392);
coinGroup.add(slot);

// turn knob (axis pointing forward)
const knobBody = new THREE.Mesh(new THREE.CylinderGeometry(0.058, 0.058, 0.055, 40), chromeMat);
knobBody.rotation.x = Math.PI / 2;
knobBody.position.set(0, 0.955, 0.415);
knobBody.castShadow = true;
coinGroup.add(knobBody);

const knobRing = new THREE.Mesh(new THREE.TorusGeometry(0.058, 0.014, 18, 40), chromeDarkMat);
knobRing.position.set(0, 0.955, 0.443);
coinGroup.add(knobRing);

const handle = new THREE.Mesh(new RoundedBoxGeometry(0.155, 0.03, 0.03, 4, 0.014), chromeMat);
handle.position.set(0, 0.955, 0.462);
handle.castShadow = true;
coinGroup.add(handle);

const handleCap = new THREE.Mesh(new THREE.SphereGeometry(0.02, 18, 14), chromeMat);
handleCap.position.set(0, 0.955, 0.475);
coinGroup.add(handleCap);

/* --- Dispensing door at bottom front --- */
const doorGroup = new THREE.Group();
machine.add(doorGroup);

const doorFrame = new THREE.Mesh(new RoundedBoxGeometry(0.17, 0.14, 0.05, 4, 0.02), chromeMat);
doorFrame.position.set(0, 0.82, 0.255);
doorFrame.castShadow = true;
doorGroup.add(doorFrame);

const doorHole = new THREE.Mesh(new THREE.BoxGeometry(0.125, 0.095, 0.03), darkSlot);
doorHole.position.set(0, 0.815, 0.275);
doorGroup.add(doorHole);

const flap = new THREE.Mesh(new RoundedBoxGeometry(0.12, 0.09, 0.014, 3, 0.012), chromeDarkMat);
flap.position.set(0, 0.795, 0.29);
flap.rotation.x = -0.32;
doorGroup.add(flap);

/* ---------- Controls ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 1.8;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 1.12, 0);
controls.update();

/* ---------- Resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- Render loop ---------- */
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
