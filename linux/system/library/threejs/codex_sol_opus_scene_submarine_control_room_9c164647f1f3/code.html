import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020808);
scene.fog = new THREE.FogExp2(0x06100f, 0.027);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 100);
camera.position.set(11.8, 6.3, 13.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.45, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.22;
controls.minDistance = 7;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.49;

let seed = 19440317;
function rand() {
  seed |= 0;
  seed = seed + 0x6D2B79F5 | 0;
  let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296;
}
function range(a, b) { return a + (b - a) * rand(); }

const mats = {
  steel: new THREE.MeshStandardMaterial({ color: 0x34433f, roughness: 0.68, metalness: 0.72 }),
  darkSteel: new THREE.MeshStandardMaterial({ color: 0x172220, roughness: 0.62, metalness: 0.78 }),
  black: new THREE.MeshStandardMaterial({ color: 0x070b0a, roughness: 0.5, metalness: 0.55 }),
  brass: new THREE.MeshStandardMaterial({ color: 0x806637, roughness: 0.42, metalness: 0.8 }),
  copper: new THREE.MeshStandardMaterial({ color: 0x744b35, roughness: 0.48, metalness: 0.72 }),
  paint: new THREE.MeshStandardMaterial({ color: 0x52605a, roughness: 0.82, metalness: 0.32 }),
  cream: new THREE.MeshStandardMaterial({ color: 0xb1aa8c, roughness: 0.82, metalness: 0.08 }),
  red: new THREE.MeshStandardMaterial({ color: 0x661711, roughness: 0.45, metalness: 0.3 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x101312, roughness: 0.92 }),
  glass: new THREE.MeshPhysicalMaterial({
    color: 0x8db8aa, roughness: 0.16, metalness: 0,
    transmission: 0.22, transparent: true, opacity: 0.68
  }),
  greenGlow: new THREE.MeshBasicMaterial({ color: 0x42ff8b, toneMapped: false }),
  amberGlow: new THREE.MeshBasicMaterial({ color: 0xffb12e, toneMapped: false }),
  redGlow: new THREE.MeshBasicMaterial({ color: 0xff2818, toneMapped: false }),
  bunk: new THREE.MeshStandardMaterial({ color: 0x48564b, roughness: 0.95 }),
  paper: new THREE.MeshStandardMaterial({ color: 0xb8b28d, roughness: 0.9 })
};

function mesh(geometry, material, parent = scene) {
  const m = new THREE.Mesh(geometry, material);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function box(w, h, d, material, x, y, z, parent = scene) {
  const m = mesh(new THREE.BoxGeometry(w, h, d), material, parent);
  m.position.set(x, y, z);
  return m;
}
function cyl(r, h, material, x, y, z, parent = scene, segments = 24) {
  const m = mesh(new THREE.CylinderGeometry(r, r, h, segments), material, parent);
  m.position.set(x, y, z);
  return m;
}
function sphere(r, material, x, y, z, parent = scene, segments = 20) {
  const m = mesh(new THREE.SphereGeometry(r, segments, Math.max(10, segments / 2)), material, parent);
  m.position.set(x, y, z);
  return m;
}
function torus(major, tube, material, x, y, z, parent = scene, segments = 24) {
  const m = mesh(new THREE.TorusGeometry(major, tube, 10, segments), material, parent);
  m.position.set(x, y, z);
  return m;
}
function lineTube(points, radius, material, parent = scene) {
  const curve = new THREE.CatmullRomCurve3(points);
  const m = mesh(new THREE.TubeGeometry(curve, 32, radius, 8, false), material, parent);
  return m;
}

function makeNoiseTexture(base, fleck) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 5000; i++) {
    const a = range(0.015, 0.12);
    ctx.fillStyle = `rgba(${fleck},${a})`;
    ctx.fillRect(rand() * 256, rand() * 256, range(0.4, 2), range(0.4, 2));
  }
  for (let i = 0; i < 35; i++) {
    ctx.strokeStyle = `rgba(7,18,15,${range(.03,.12)})`;
    ctx.beginPath();
    ctx.moveTo(rand() * 256, 0);
    ctx.lineTo(rand() * 256, 256);
    ctx.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(4, 3);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const wallTexture = makeNoiseTexture('#34443e', '190,205,183');
mats.wall = new THREE.MeshStandardMaterial({
  map: wallTexture, color: 0x52645c, roughness: 0.9, metalness: 0.35
});

const room = new THREE.Group();
scene.add(room);

box(15.5, .28, 11, mats.darkSteel, 0, -.14, 0, room);
box(15.5, .16, 11, mats.paint, 0, .02, 0, room);

for (let x = -7.25; x <= 7.25; x += .5) {
  box(.025, .012, 10.6, mats.black, x, .115, 0, room);
}
for (let z = -5; z <= 5; z += 1) {
  box(15, .018, .025, mats.black, 0, .12, z, room);
}

box(15.6, 6.8, .24, mats.wall, 0, 3.4, -5.4, room);
box(.24, 6.8, 11, mats.wall, -7.8, 3.4, 0, room);
box(.24, 6.8, 11, mats.wall, 7.8, 3.4, 0, room);

for (let x = -7; x <= 7; x += 2) {

}
for (let y = .45; y < 6.6; y += 1.2) {

}
for (let x = -7; x <= 7; x += 1) {

  }
}

const ceilingRibs = new THREE.Group();
room.add(ceilingRibs);
for (let z = -5; z <= 5; z += 1.45) {
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-7.65, 5.85, z),
    new THREE.Vector3(-5.4, 6.85, z),
    new THREE.Vector3(0, 7.25, z),
    new THREE.Vector3(5.4, 6.85, z),
    new THREE.Vector3(7.65, 5.85, z)
  ]);
  mesh(new THREE.TubeGeometry(curve, 36, .075, 8, false), mats.darkSteel, ceilingRibs);
}

function makeValve(x, y, z, scale = 1, rotationY = 0, parent = room) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.y = rotationY;
  g.scale.setScalar(scale);
  parent.add(g);
  torus(.38, .055, mats.red, 0, 0, 0, g, 32).rotation.y = Math.PI / 2;
  cyl(.07, .22, mats.brass, 0, 0, 0, g, 16).rotation.z = Math.PI / 2;
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3;
    const spoke = box(.035, .035, .66, mats.red, 0, 0, 0, g);
    spoke.rotation.x = a;
  }
  sphere(.11, mats.brass, 0, 0, 0, g, 14);
  return g;
}

for (let i = 0; i < 10; i++) {
  makeValve(
    -7.57,
    1.0 + (i % 5) * 1.02,
    -4.1 + Math.floor(i / 5) * 2.05,
    range(.72, 1.05),
    Math.PI / 2
  );
}
for (let i = 0; i < 6; i++) {
  makeValve(-5.8 + i * 1.22, 1.35 + (i % 2) * 1.3, -5.03, range(.6, .86));
}

function pipeRun(x, z, height, mat, bend = 1) {
  return lineTube([
    new THREE.Vector3(x, .15, z),
    new THREE.Vector3(x, height - .55, z),
    new THREE.Vector3(x + .18 * bend, height, z),
    new THREE.Vector3(x + 1.4 * bend, height, z),
    new THREE.Vector3(x + 1.7 * bend, height + .25, z)
  ], .075, mat, room);
}
pipeRun(-6.8, -4.95, 5.7, mats.copper, 1);
pipeRun(-6.45, -4.92, 6.1, mats.brass, 1);
pipeRun(6.9, -4.94, 5.15, mats.copper, -1);
pipeRun(6.55, -4.91, 5.55, mats.steel, -1);

for (let y = .8; y < 5.8; y += .85) {
  lineTube([
    new THREE.Vector3(7.55, y, -4.7),
    new THREE.Vector3(7.2, y, -4.15),
    new THREE.Vector3(7.2, y, 3.9),
    new THREE.Vector3(7.55, y + .25, 4.5)
  ], .045 + (y % 1.7) * .012, y % 1.7 < .2 ? mats.copper : mats.darkSteel, room);
}

function makeGauge(x, y, z, r = .28, parent = room) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  parent.add(g);
  cyl(r + .06, .12, mats.brass, 0, 0, 0, g, 28).rotation.x = Math.PI / 2;
  const face = cyl(r, .125, mats.cream, 0, 0, .012, g, 28);
  face.rotation.x = Math.PI / 2;
  torus(r + .015, .025, mats.darkSteel, 0, 0, .09, g, 28);
  const pivot = new THREE.Group();
  pivot.position.z = .105;
  g.add(pivot);
  const needle = box(.025, r * .76, .018, mats.red, 0, r * .34, 0, pivot);
  needle.position.y = r * .34;
  sphere(.045, mats.black, 0, 0, .018, pivot, 12);
  for (let i = 0; i < 9; i++) {
    const a = -1.15 + i * .2875;
    const tick = box(.014, .055, .012, mats.black, Math.sin(a) * r * .75, Math.cos(a) * r * .75, .005, g);
    tick.rotation.z = -a;
  }
  g.userData.needle = pivot;
  g.userData.phase = range(0, Math.PI * 2);
  gauges.push(g);
  return g;
}

const gauges = [];
for (let i = 0; i < 7; i++) {
  makeGauge(-4.65 + i * .72, 4.55 + (i % 2) * .67, -5.02, .22);
}

const periscope = new THREE.Group();
periscope.position.set(-.25, 0, -.3);
room.add(periscope);

cyl(.46, 6.5, mats.steel, 0, 3.4, 0, periscope, 32);

head.geometry.translate(.15, 0, 0);

periscope.add(handlePivot);

sonarConsole.position.set(4.45, 0, -3.9);
room.add(sonarConsole);
box(3.1, 1.9, 1.15, mats.darkSteel, 0, 1.05, 0, sonarConsole);

sonarTexture.colorSpace = THREE.SRGBColorSpace;

sphere(.045, mats.greenGlow, -.48, 2.08, .22, sonarConsole, 12);

for (let i = 0; i < 7; i++) {

const clock = new THREE.Clock();
let sonarAngle = 0;

function drawSonar(time) {
  const c = sonarCtx;
  const w = 512;
  c.fillStyle = '#011b0d';
  c.fillRect(0, 0, w, w);

  const radial = c.createRadialGradient(256, 256, 10, 256, 256, 245);
  radial.addColorStop(0, 'rgba(30,255,110,.12)');
  radial.addColorStop(1, 'rgba(0,40,20,.02)');
  c.fillStyle = radial;
  c.beginPath();
  c.arc(256, 256, 238, 0, Math.PI * 2);
  c.fill();

  c.strokeStyle = 'rgba(55,255,125,.28)';
  c.lineWidth = 2;
  for (const r of [55, 110, 165, 220]) {
    c.beginPath();
    c.arc(256, 256, r, 0, Math.PI * 2);
    c.stroke();
  }
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6;
    c.beginPath();
    c.moveTo(256, 256);
    c.lineTo(256 + Math.cos(a) * 220, 256 + Math.sin(a) * 220);
    c.stroke();
  }

  sonarAngle = time * .72;
  const sweep = c.createConicGradient(sonarAngle, 256, 256);
  sweep.addColorStop(0, 'rgba(80,255,140,.72)');
  sweep.addColorStop(.035, 'rgba(45,255,115,.30)');
  sweep.addColorStop(.16, 'rgba(20,120,60,.03)');
  sweep.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = sweep;
  c.beginPath();
  c.arc(256, 256, 220, 0, Math.PI * 2);
  c.fill();

  const contacts = [
    [325, 170, .2],
    [172, 317, 1.7],
    [390, 292, 3.1],
    [245, 104, 4.4]
  ];
  for (const [x, y, phase] of contacts) {
    const pulse = .25 + .75 * Math.max(0, Math.sin(time * 2.4 + phase));
    c.fillStyle = `rgba(125,255,160,${pulse})`;
    c.shadowColor = '#5cff9b';
    c.shadowBlur = 16 * pulse;
    c.beginPath();
    c.arc(x, y, 4 + 3 * pulse, 0, Math.PI * 2);
    c.fill();
  }
  c.shadowBlur = 0;

  c.strokeStyle = 'rgba(140,255,175,.42)';
  c.lineWidth = 5;
  c.beginPath();
  c.arc(256, 256, 235, 0, Math.PI * 2);
  c.stroke();

  for (let y = 0; y < 512; y += 4) {
    c.fillStyle = 'rgba(0,0,0,.05)';
    c.fillRect(0, y, 512, 1);
  }
  sonarTexture.needsUpdate = true;
}

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta(), .05);

  drawSonar(t);
  alertRotor.rotation.y = t * .78;
  handlePivot.rotation.y = Math.sin(t * .16) * .045;
  compassNeedle.rotation.y = Math.sin(t * .33) * .14;
  instNeedle.rotation.z = Math.sin(t * 6.8) * .06;

  for (let i = 0; i < gauges.length; i++) {
    const g = gauges[i];
    g.userData.needle.rotation.z =
      Math.sin(t * (7.2 + i * .31) + g.userData.phase) * .045 +
      Math.sin(t * .37 + i) * .22;
  }

  sonarLight.intensity = 5.2 + Math.sin(t * 2.2) * .65;
  warmLight.intensity = 3.6 + Math.sin(t * 9.1) * .08;
  hangingLights[0].intensity = 4.6 + Math.sin(t * 11.3) * .08;
  hangingLights[1].intensity = 4.7 + Math.sin(t * 7.7) * .06;

  controls.update(dt);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
