<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worn Brass House Key</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #171510;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171510);
scene.fog = new THREE.FogExp2(0x171510, 0.028);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(
  36,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.set(8.5, -11.5, 8.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.5, 0, 0.3);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 8;
controls.maxDistance = 28;
controls.maxPolarAngle = Math.PI * 0.48;

scene.add(new THREE.HemisphereLight(0xffe2ae, 0x201b18, 1.35));

const keyLight = new THREE.DirectionalLight(0xffd8a1, 4.2);
keyLight.position.set(-5, -5, 10);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -10;
keyLight.shadow.camera.right = 10;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -8;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 30;
keyLight.shadow.bias = -0.0002;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xff9d45, 2.1);
rimLight.position.set(8, 5, 5);
scene.add(rimLight);

const coolFill = new THREE.PointLight(0x8ba9c7, 17, 18, 2);
coolFill.position.set(-4, 5, 4);
scene.add(coolFill);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x25221d,
  roughness: 0.78,
  metalness: 0.03
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), floorMaterial);
floor.receiveShadow = true;
scene.add(floor);

const key = new THREE.Group();
key.rotation.z = -0.13;
key.position.z = 0.38;
scene.add(key);

const brassMaterial = new THREE.MeshStandardMaterial({
  color: 0xb47823,
  metalness: 0.88,
  roughness: 0.3
});

const wornBrassMaterial = new THREE.MeshStandardMaterial({
  color: 0xe1ad4e,
  metalness: 0.92,
  roughness: 0.22
});

const darkBrassMaterial = new THREE.MeshStandardMaterial({
  color: 0x694214,
  metalness: 0.82,
  roughness: 0.46
});

const silhouette = new THREE.Shape();
silhouette.moveTo(-0.55, 0.82);
silhouette.lineTo(5.75, 0.70);
silhouette.quadraticCurveTo(6.15, 0.68, 6.48, 0.34);
silhouette.lineTo(6.48, -0.68);
silhouette.lineTo(5.61, -0.69);
silhouette.lineTo(5.36, -0.24);
silhouette.lineTo(4.92, -0.25);
silhouette.lineTo(4.67, -0.70);
silhouette.lineTo(4.10, -0.71);
silhouette.lineTo(3.85, -0.36);
silhouette.lineTo(3.46, -0.37);
silhouette.lineTo(3.20, -0.73);
silhouette.lineTo(2.47, -0.75);
silhouette.lineTo(2.20, -0.46);
silhouette.lineTo(1.82, -0.47);
silhouette.lineTo(1.58, -0.78);
silhouette.lineTo(-0.56, -0.82);
silhouette.quadraticCurveTo(-0.83, -1.25, -1.17, -1.51);
silhouette.bezierCurveTo(-1.70, -2.12, -2.48, -2.49, -3.33, -2.36);
silhouette.bezierCurveTo(-4.58, -2.18, -5.31, -1.22, -5.36, -0.03);
silhouette.bezierCurveTo(-5.42, 1.31, -4.50, 2.30, -3.27, 2.47);
silhouette.bezierCurveTo(-2.17, 2.62, -1.24, 2.02, -0.72, 1.21);
silhouette.quadraticCurveTo(-0.60, 1.02, -0.55, 0.82);
silhouette.closePath();

const ringHole = new THREE.Path();
ringHole.absellipse(-3.30, 0.02, 1.04, 1.04, 0, Math.PI * 2, true);
silhouette.holes.push(ringHole);

const keyGeometry = new THREE.ExtrudeGeometry(silhouette, {
  depth: 0.38,
  bevelEnabled: true,
  bevelSegments: 4,
  steps: 1,
  bevelSize: 0.085,
  bevelThickness: 0.07,
  curveSegments: 48
});
keyGeometry.translate(0, 0, -0.19);
keyGeometry.computeVertexNormals();

const keyBody = new THREE.Mesh(keyGeometry, brassMaterial);
keyBody.castShadow = true;
keyBody.receiveShadow = true;
key.add(keyBody);

function makeWearRing(z, material, opacityScale = 1) {
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(1.02, 1.105, 64),
    material.clone()
  );
  ring.material.transparent = opacityScale < 1;
  ring.material.opacity = opacityScale;
  ring.position.set(-3.30, 0.02, z);
  return ring;
}

key.add(makeWearRing(0.266, wornBrassMaterial));
key.add(makeWearRing(-0.266, wornBrassMaterial, 0.85));

const innerWallGeometry = new THREE.TorusGeometry(1.042, 0.055, 10, 72);
const innerWall = new THREE.Mesh(innerWallGeometry, darkBrassMaterial);
innerWall.position.set(-3.30, 0.02, 0);
key.add(innerWall);

const shoulderStamp = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.055, 1.65, 4, 20),
  darkBrassMaterial
);
shoulderStamp.rotation.z = Math.PI / 2;
shoulderStamp.scale.y = 0.22;
shoulderStamp.position.set(-0.04, 0.02, 0.258);
key.add(shoulderStamp);

const bladeChannelMaterial = darkBrassMaterial.clone();
bladeChannelMaterial.color.setHex(0x80531c);
bladeChannelMaterial.roughness = 0.4;

const bladeChannel = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.035, 4.75, 4, 18),
  bladeChannelMaterial
);
bladeChannel.rotation.z = Math.PI / 2;
bladeChannel.scale.y = 0.18;
bladeChannel.position.set(3.25, 0.24, 0.26);
key.add(bladeChannel);

const lowerChannel = bladeChannel.clone();
lowerChannel.scale.set(0.78, 0.16, 0.78);
lowerChannel.position.set(3.55, -0.08, 0.258);
key.add(lowerChannel);

const wearPatches = [
  [-4.56, -0.42, 0.34, 0.12, -0.7],
  [-4.20, 1.45, 0.42, 0.10, 0.25],
  [-2.15, 1.89, 0.48, 0.10, -0.15],
  [-1.45, -1.52, 0.38, 0.09, 0.55],
  [0.15, 0.71, 0.58, 0.045, -0.02],
  [5.78, 0.52, 0.42, 0.055, -0.32],
  [5.95, -0.65, 0.38, 0.05, 0.03],
  [4.45, -0.69, 0.30, 0.045, 0.02],
  [2.85, -0.72, 0.26, 0.04, 0.02]
];

for (const patch of wearPatches) {
  const mark = new THREE.Mesh(
    new THREE.PlaneGeometry(patch[2], patch[3]),
    wornBrassMaterial
  );
  mark.position.set(patch[0], patch[1], 0.269);
  mark.rotation.z = patch[4];
  key.add(mark);
}

const scratchMaterial = new THREE.LineBasicMaterial({
  color: 0xf2c46a,
  transparent: true,
  opacity: 0.42
});

const darkScratchMaterial = new THREE.LineBasicMaterial({
  color: 0x5c3712,
  transparent: true,
  opacity: 0.33
});

const scratchData = [
  [-4.40, 0.77, -3.95, 0.60, true],
  [-4.23, -0.96, -3.72, -0.71, false],
  [-3.87, 1.73, -3.27, 1.58, true],
  [-2.62, -1.77, -2.04, -1.53, false],
  [-2.26, 1.34, -1.70, 1.17, true],
  [-1.42, 0.58, -0.77, 0.43, false],
  [0.34, 0.42, 1.10, 0.34, true],
  [1.48, -0.24, 2.19, -0.18, false],
  [2.50, 0.50, 3.28, 0.42, true],
  [3.47, 0.06, 4.25, 0.01, false],
  [4.58, 0.43, 5.28, 0.34, true],
  [5.40, -0.05, 6.02, -0.12, false]
];

for (const scratch of scratchData) {
  const points = [
    new THREE.Vector3(scratch[0], scratch[1], 0.273),
    new THREE.Vector3(scratch[2], scratch[3], 0.273)
  ];
  const geometry = new THREE.BufferGeometry().setFromPoints(points);
  key.add(new THREE.Line(
    geometry,
    scratch[4] ? scratchMaterial : darkScratchMaterial
  ));
}

const edgeHighlights = new THREE.Group();
const highlightMaterial = new THREE.MeshStandardMaterial({
  color: 0xe9b957,
  metalness: 0.94,
  roughness: 0.2
});

function addEdgeHighlight(x, y, length, angle) {
  const mesh = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.022, length, 3, 10),
    highlightMaterial
  );
  mesh.rotation.z = angle;
  mesh.position.set(x, y, 0.285);
  edgeHighlights.add(mesh);
}

addEdgeHighlight(-4.73, 1.02, 0.34, -0.46);
addEdgeHighlight(-4.70, -1.00, 0.28, 0.55);
addEdgeHighlight(-2.22, 2.19, 0.38, Math.PI / 2);
addEdgeHighlight(-1.58, -1.78, 0.30, Math.PI / 3);
addEdgeHighlight(1.05, 0.74, 0.50, Math.PI / 2);
addEdgeHighlight(5.92, 0.65, 0.24, Math.PI / 2);
key.add(edgeHighlights);

const contactShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(13.5, 5.7),
  new THREE.MeshBasicMaterial({
    color: 0x000000,
    transparent: true,
    opacity: 0.16,
    depthWrite: false
  })
);
contactShadow.position.set(0.45, -0.08, 0.008);
scene.add(contactShadow);

const dustGeometry = new THREE.BufferGeometry();
const dustPositions = [];
for (let i = 0; i < 180; i++) {
  const radius = 5 + Math.random() * 14;
  const angle = Math.random() * Math.PI * 2;
  dustPositions.push(
    Math.cos(angle) * radius,
    Math.sin(angle) * radius,
    0.012 + Math.random() * 0.006
  );
}
dustGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(dustPositions, 3)
);
const dust = new THREE.Points(
  dustGeometry,
  new THREE.PointsMaterial({
    color: 0x9a8465,
    size: 0.018,
    transparent: true,
    opacity: 0.28,
    depthWrite: false
  })
);
scene.add(dust);

function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  rimLight.intensity = 2.05 + Math.sin(elapsed * 0.45) * 0.08;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
