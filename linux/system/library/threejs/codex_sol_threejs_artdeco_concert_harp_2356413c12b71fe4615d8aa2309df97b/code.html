<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Deco Concert Harp</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #090a0d;
    }
    canvas { display: block; }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 43%, transparent 35%, rgba(0,0,0,.18) 68%, rgba(0,0,0,.58) 100%);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="vignette"></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080a0e);
    scene.fog = new THREE.FogExp2(0x080a0e, 0.026);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(7.8, 1.5, 10.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.05, 0.08, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.65;
    controls.minDistance = 7.5;
    controls.maxDistance = 16;
    controls.minPolarAngle = Math.PI * 0.27;
    controls.maxPolarAngle = Math.PI * 0.64;

    const lacquer = new THREE.MeshPhysicalMaterial({
      color: 0x08090b,
      metalness: 0.18,
      roughness: 0.14,
      clearcoat: 1,
      clearcoatRoughness: 0.08
    });
    const lacquerSoft = new THREE.MeshPhysicalMaterial({
      color: 0x121319,
      metalness: 0.12,
      roughness: 0.24,
      clearcoat: 0.8,
      clearcoatRoughness: 0.12
    });
    const gold = new THREE.MeshStandardMaterial({
      color: 0xd8a83f,
      metalness: 0.92,
      roughness: 0.24
    });
    const paleGold = new THREE.MeshStandardMaterial({
      color: 0xf0cb72,
      metalness: 0.86,
      roughness: 0.19
    });
    const darkGold = new THREE.MeshStandardMaterial({
      color: 0x80561b,
      metalness: 0.86,
      roughness: 0.3
    });
    const stringGold = new THREE.MeshStandardMaterial({
      color: 0xe8d7a2,
      metalness: 0.48,
      roughness: 0.25
    });
    const stringRed = new THREE.MeshStandardMaterial({
      color: 0x9f2030,
      metalness: 0.3,
      roughness: 0.28
    });
    const stringBlue = new THREE.MeshStandardMaterial({
      color: 0x214d7c,
      metalness: 0.34,
      roughness: 0.25
    });

    const harp = new THREE.Group();
    harp.rotation.y = -0.1;
    harp.position.y = 0.05;
    scene.add(harp);

    function extrudedShape(points, depth, material, bevel = 0.045, z = 0) {
      const shape = new THREE.Shape();
      shape.moveTo(points[0][0], points[0][1]);
      for (let i = 1; i < points.length; i++) shape.lineTo(points[i][0], points[i][1]);
      shape.closePath();

      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth,
        bevelEnabled: bevel > 0,
        bevelThickness: bevel,
        bevelSize: bevel,
        bevelSegments: 3,
        curveSegments: 8
      });
      geometry.translate(0, 0, -depth * 0.5);
      geometry.computeVertexNormals();

      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.z = z;
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      harp.add(mesh);
      return mesh;
    }

    function box(size, position, material, bevel = 0) {
      let geometry;
      if (bevel > 0) {
        const shape = new THREE.Shape();
        const w = size.x, h = size.y, r = Math.min(bevel, w * 0.25, h * 0.25);
        shape.moveTo(-w / 2 + r, -h / 2);
        shape.lineTo(w / 2 - r, -h / 2);
        shape.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
        shape.lineTo(w / 2, h / 2 - r);
        shape.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
        shape.lineTo(-w / 2 + r, h / 2);
        shape.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
        shape.lineTo(-w / 2, -h / 2 + r);
        shape.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
        geometry = new THREE.ExtrudeGeometry(shape, {
          depth: size.z,
          bevelEnabled: true,
          bevelThickness: Math.min(0.025, size.z * 0.12),
          bevelSize: Math.min(0.025, r * 0.4),
          bevelSegments: 2
        });
        geometry.translate(0, 0, -size.z / 2);
      } else {
        geometry = new THREE.BoxGeometry(size.x, size.y, size.z);
      }
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(position);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      harp.add(mesh);
      return mesh;
    }

    function cylinderBetween(a, b, radius, material, radialSegments = 10, parent = harp) {
      const start = new THREE.Vector3(...a);
      const end = new THREE.Vector3(...b);
      const direction = end.clone().sub(start);
      const length = direction.length();
      const geometry = new THREE.CylinderGeometry(radius, radius, length, radialSegments, 1, false);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
      mesh.castShadow = radius > 0.012;
      parent.add(mesh);
      return mesh;
    }

    function tube(points, radius, material, z = 0, closed = false) {
      const curve = new THREE.CatmullRomCurve3(
        points.map(p => new THREE.Vector3(p[0], p[1], p.length > 2 ? p[2] : z)),
        closed,
        'centripetal',
        0.35
      );
      const geometry = new THREE.TubeGeometry(curve, Math.max(32, points.length * 16), radius, 10, closed);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      harp.add(mesh);
      return mesh;
    }

    // Stepped pedestal and pedal box.
    box(new THREE.Vector3(2.48, 0.20, 0.92), new THREE.Vector3(0.45, -3.01, 0), darkGold, 0.06);
    box(new THREE.Vector3(2.20, 0.25, 0.82), new THREE.Vector3(0.48, -2.86, 0), gold, 0.055);
    box(new THREE.Vector3(1.84, 0.31, 0.72), new THREE.Vector3(0.56, -2.66, 0), lacquer, 0.07);
    box(new THREE.Vector3(1.52, 0.12, 0.78), new THREE.Vector3(0.62, -2.46, 0), paleGold, 0.035);

    // Seven concert pedals.
    for (let i = 0; i < 7; i++) {
      const x = -0.03 + i * 0.19;
      const pedal = box(
        new THREE.Vector3(0.095, 0.44, 0.055),
        new THREE.Vector3(x, -2.92, 0.52),
        i === 3 ? paleGold : gold,
        0.025
      );
      pedal.rotation.z = -0.24 + i * 0.018;
    }

    // Broad tapered sound box, gold shell with black lacquer face.
    extrudedShape([
      [-1.58, 1.57], [-1.22, 1.46], [1.39, -2.50],
      [1.08, -2.72], [0.52, -2.71], [-1.78, 1.30]
    ], 0.62, darkGold, 0.055);

    extrudedShape([
      [-1.52, 1.43], [-1.24, 1.35], [1.22, -2.42],
      [0.96, -2.55], [0.67, -2.55], [-1.68, 1.26]
    ], 0.16, lacquer, 0.035, 0.34);

    // Art-deco inlay down the face of the soundboard.
    tube([
      [-1.45, 1.28, 0.455], [-0.82, 0.40, 0.455],
      [-0.12, -0.70, 0.455], [0.92, -2.43, 0.455]
    ], 0.034, paleGold);
    tube([
      [-1.60, 1.30, 0.455], [-0.96, 0.32, 0.455],
      [-0.25, -0.82, 0.455], [0.73, -2.47, 0.455]
    ], 0.018, gold);

    // Small geometric soundboard ornaments.
    for (let i = 0; i < 5; i++) {
      const t = i / 4;
      const x = -1.27 + t * 1.63;
      const y = 1.04 - t * 2.62;
      const s = 0.10 + t * 0.035;
      cylinderBetween([x - s, y, 0.47], [x, y + s * 1.25, 0.47], 0.013, gold, 8);
      cylinderBetween([x, y + s * 1.25, 0.47], [x + s, y, 0.47], 0.013, gold, 8);
      cylinderBetween([x - s, y, 0.47], [x + s, y, 0.47], 0.013, gold, 8);
    }

    // Gilded, subtly tapered structural column.
    extrudedShape([
      [1.29, -2.57], [1.31, 2.70], [1.46, 3.04],
      [1.73, 3.03], [1.83, 2.71], [1.76, -2.62]
    ], 0.62, gold, 0.055);

    extrudedShape([
      [1.39, -2.42], [1.40, 2.61], [1.51, 2.86],
      [1.65, 2.86], [1.70, 2.61], [1.65, -2.45]
    ], 0.15, lacquerSoft, 0.028, 0.34);

    // Stepped column bands.
    const bandLevels = [-2.20, -1.18, -0.14, 0.90, 1.91, 2.55];
    for (const y of bandLevels) {
      box(new THREE.Vector3(0.52, 0.10, 0.72), new THREE.Vector3(1.55, y, 0), paleGold, 0.025);
      box(new THREE.Vector3(0.34, 0.045, 0.755), new THREE.Vector3(1.55, y + 0.105, 0), darkGold, 0.012);
    }

    // Fluted art-deco chevrons on the column face.
    for (let i = 0; i < 5; i++) {
      const y = -1.73 + i * 0.88;
      cylinderBetween([1.40, y + 0.18, 0.46], [1.55, y, 0.46], 0.025, paleGold, 8);
      cylinderBetween([1.55, y, 0.46], [1.70, y + 0.18, 0.46], 0.025, paleGold, 8);
      cylinderBetween([1.43, y + 0.29, 0.455], [1.55, y + 0.15, 0.455], 0.012, gold, 8);
      cylinderBetween([1.55, y + 0.15, 0.455], [1.67, y + 0.29, 0.455], 0.012, gold, 8);
    }

    // Angular neck: gold silhouette, lacquer inset, and stepped trim.
    extrudedShape([
      [-1.64, 1.70], [-1.28, 2.03], [-0.67, 2.34],
      [0.06, 2.61], [0.82, 2.88], [1.47, 3.13],
      [1.72, 3.00], [1.61, 2.73], [0.89, 2.49],
      [0.14, 2.24], [-0.59, 1.96], [-1.24, 1.58]
    ], 0.58, darkGold, 0.055);

    extrudedShape([
      [-1.47, 1.73], [-1.20, 1.95], [-0.62, 2.22],
      [0.08, 2.48], [0.82, 2.73], [1.46, 2.96],
      [1.56, 2.87], [0.85, 2.61], [0.12, 2.37],
      [-0.58, 2.10], [-1.19, 1.76]
    ], 0.15, lacquer, 0.03, 0.34);

    tube([
      [-1.47, 1.81, 0.45], [-1.18, 2.04, 0.45],
      [-0.60, 2.31, 0.45], [0.10, 2.57, 0.45],
      [0.82, 2.82, 0.45], [1.47, 3.05, 0.45]
    ], 0.036, paleGold);

    // Tuning pins along the neck.
    for (let i = 0; i < 18; i++) {
      const t = i / 17;
      const x = -1.20 + t * 2.48;
      const y = 1.92 + 0.39 * (x + 1.20);
      const pin = new THREE.Mesh(
        new THREE.CylinderGeometry(0.038, 0.038, 0.18, 10),
        i % 5 === 0 ? paleGold : gold
      );
      pin.position.set(x, y + 0.17, 0.46);
      pin.rotation.x = Math.PI / 2;
      pin.castShadow = true;
      harp.add(pin);
    }

    // Crisp vertical string sweep.
    const stringCount = 35;
    for (let i = 0; i < stringCount; i++) {
      const t = i / (stringCount - 1);
      const x = -1.12 + t * 2.43;
      const top = 1.91 + 0.405 * (x + 1.20);
      const bottom = 1.20 - 1.565 * (x + 1.10);
      const radius = 0.008 + t * 0.0045;
      let material = stringGold;
      if (i % 7 === 0) material = stringRed;
      else if (i % 7 === 4) material = stringBlue;
      cylinderBetween([x, bottom, 0.51], [x, top, 0.51], radius, material, 7);
    }

    // Fan-motif crown at the neck and column junction.
    const fanCenter = new THREE.Vector3(1.52, 3.02, 0.47);
    const fan = new THREE.Group();
    harp.add(fan);

    const fanAngles = [-2.76, -2.50, -2.24, -1.98, -1.72, -1.46, -1.20];
    for (let i = 0; i < fanAngles.length; i++) {
      const angle = fanAngles[i];
      const length = i === 3 ? 0.53 : 0.47;
      const end = [
        fanCenter.x + Math.cos(angle) * length,
        fanCenter.y + Math.sin(angle) * length,
        fanCenter.z + 0.015
      ];
      cylinderBetween(
        [fanCenter.x, fanCenter.y, fanCenter.z],
        end,
        i === 3 ? 0.026 : 0.018,
        paleGold,
        8,
        fan
      );
    }
    const crownArc = new THREE.EllipseCurve(0, 0, 0.50, 0.50, Math.PI * 1.20, Math.PI * 1.80, false);
    const crownPoints = crownArc.getPoints(32).map(p => [
      fanCenter.x + p.x,
      fanCenter.y + p.y,
      fanCenter.z
    ]);
    tube(crownPoints, 0.027, paleGold);
    const crownGem = new THREE.Mesh(new THREE.SphereGeometry(0.10, 20, 12), paleGold);
    crownGem.scale.set(1.25, 0.8, 0.55);
    crownGem.position.copy(fanCenter);
    crownGem.castShadow = true;
    harp.add(crownGem);

    // Decorative finial at the far end of the neck.
    const finial = new THREE.Mesh(new THREE.OctahedronGeometry(0.18, 0), paleGold);
    finial.position.set(-1.60, 1.72, 0);
    finial.scale.set(0.72, 1.35, 0.72);
    finial.rotation.z = -0.28;
    finial.castShadow = true;
    harp.add(finial);

    // Ground and restrained art-deco presentation lighting.
    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0x111218,
      metalness: 0.15,
      roughness: 0.53
    });
    const floor = new THREE.Mesh(new THREE.CircleGeometry(12, 96), floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -3.13;
    floor.receiveShadow = true;
    scene.add(floor);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(3.0, 3.045, 96),
      new THREE.MeshBasicMaterial({ color: 0x6a4b1e, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = -3.115;
    scene.add(ring);

    scene.add(new THREE.HemisphereLight(0xb8c4de, 0x24180d, 1.25));

    const key = new THREE.SpotLight(0xffe1a1, 125, 25, Math.PI / 6, 0.55, 1.4);
    key.position.set(-4.5, 8.5, 7);
    key.target.position.set(0, 0, 0);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.bias = -0.00015;
    key.shadow.normalBias = 0.025;
    scene.add(key, key.target);

    const rim = new THREE.SpotLight(0x6d92d0, 95, 22, Math.PI / 5, 0.7, 1.5);
    rim.position.set(5.5, 5.0, -6);
    rim.target.position.set(0.2, 0.5, 0);
    scene.add(rim, rim.target);

    const warmFill = new THREE.PointLight(0xffb54d, 28, 12, 2);
    warmFill.position.set(-3.2, -0.5, 4.5);
    scene.add(warmFill);

    const topGlow = new THREE.PointLight(0xffdd9b, 22, 9, 2);
    topGlow.position.set(1.2, 5.4, 1.8);
    scene.add(topGlow);

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    }
    addEventListener('resize', resize);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      warmFill.intensity = 27 + Math.sin(elapsed * 0.7) * 1.2;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
