<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holographic Music Box</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050813}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040711);
scene.fog = new THREE.FogExp2(0x040711, 0.045);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(4.2, 3.15, 5.3);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 3.4;
controls.maxDistance = 8.5;
controls.target.set(0, 0.9, 0);

const clock = new THREE.Clock();

const holoVertex = `
varying vec3 vNormal;
varying vec3 vWorldPosition;
void main(){
  vNormal = normalize(mat3(modelMatrix) * normal);
  vec4 wp = modelMatrix * vec4(position,1.0);
  vWorldPosition = wp.xyz;
  gl_Position = projectionMatrix * viewMatrix * wp;
}`;
const holoFragment = `
uniform float uTime;
uniform float uOpacity;
varying vec3 vNormal;
varying vec3 vWorldPosition;
void main(){
  vec3 viewDir = normalize(cameraPosition - vWorldPosition);
  float fresnel = pow(1.0 - max(dot(normalize(vNormal), viewDir), 0.0), 2.0);
  float angle = dot(normalize(vNormal), normalize(vec3(0.32,0.8,0.48))) * 0.5 + 0.5;
  float sweep = sin(vWorldPosition.y*3.2 + vWorldPosition.x*2.5 + vWorldPosition.z*2.0 + uTime*0.55)*0.5+0.5;
  vec3 teal = vec3(0.02,0.88,0.78);
  vec3 violet = vec3(0.48,0.08,1.0);
  vec3 gold = vec3(1.0,0.48,0.05);
  vec3 blue = vec3(0.04,0.28,1.0);
  vec3 col = mix(teal, violet, smoothstep(0.18,0.55,angle));
  col = mix(col, gold, smoothstep(0.52,0.86,angle));
  col = mix(col, blue, smoothstep(0.62,0.98,sweep)*0.34);
  col += fresnel * vec3(0.48,0.7,1.0);
  float sparkle = pow(max(sin(vWorldPosition.x*24.0+vWorldPosition.z*19.0+uTime*1.7),0.0),28.0);
  col += sparkle * vec3(1.0,0.75,0.34) * 0.42;
  gl_FragColor = vec4(col, uOpacity*(0.72+fresnel*0.45));
}`;

const holoMat = new THREE.ShaderMaterial({
  uniforms:{uTime:{value:0},uOpacity:{value:0.94}},
  vertexShader:holoVertex, fragmentShader:holoFragment,
  transparent:true, side:THREE.DoubleSide
});
const lidMat = holoMat.clone();
const dancerMat = holoMat.clone();
dancerMat.uniforms.uOpacity.value = 0.58;
const fringeMat = new THREE.MeshBasicMaterial({
  color:0xffffff, transparent:true, opacity:0.9,
  blending:THREE.AdditiveBlending
});
const darkMat = new THREE.MeshPhysicalMaterial({
  color:0x071126, metalness:0.7, roughness:0.2,
  clearcoat:1, clearcoatRoughness:0.12
});
const innerMat = new THREE.MeshPhysicalMaterial({
  color:0x050719, metalness:0.35, roughness:0.18,
  emissive:0x071d38, emissiveIntensity:1.6
});
const goldMat = new THREE.MeshPhysicalMaterial({
  color:0xffb849, metalness:0.85, roughness:0.16,
  emissive:0x54220c, emissiveIntensity:0.5
});

function octagonPoints(radius, y=0, z=0){
  const p=[];
  for(let i=0;i<8;i++){
    const a=Math.PI/8 + i*Math.PI/4;
    p.push(new THREE.Vector3(Math.cos(a)*radius, y, Math.sin(a)*radius+z));
  }
  return p;
}
function edgeLoop(points, radius=0.025){
  const curve=new THREE.CatmullRomCurve3(points,true,"centripetal");
  return new THREE.Mesh(new THREE.TubeGeometry(curve,64,radius,6,true),fringeMat);
}
function makeOctagonalShape(w,h,c){
  const s=new THREE.Shape();
  s.moveTo(-w/2+c,-h/2);
  s.lineTo(w/2-c,-h/2); s.lineTo(w/2,-h/2+c);
  s.lineTo(w/2,h/2-c); s.lineTo(w/2-c,h/2);
  s.lineTo(-w/2+c,h/2); s.lineTo(-w/2,h/2-c);
  s.lineTo(-w/2,-h/2+c); s.closePath();
  return s;
}

const box = new THREE.Group();
scene.add(box);

const body = new THREE.Mesh(new THREE.CylinderGeometry(1.55,1.68,0.9,8,1,false,Math.PI/8),holoMat);
body.position.y=0;
body.castShadow=true; body.receiveShadow=true;
box.add(body);

const lowerBand = new THREE.Mesh(new THREE.CylinderGeometry(1.68,1.68,0.12,8,1,false,Math.PI/8),darkMat);
lowerBand.position.y=-0.39;
lowerBand.castShadow=true;
box.add(lowerBand);

const inner = new THREE.Mesh(new THREE.CylinderGeometry(1.34,1.34,0.07,48),innerMat);
inner.position.y=0.49;
box.add(inner);

const topRing = new THREE.Mesh(new THREE.TorusGeometry(1.46,0.075,10,8,Math.PI*2),fringeMat);
topRing.rotation.x=Math.PI/2;
topRing.rotation.z=Math.PI/8;
topRing.position.y=0.51;
box.add(topRing);

const bodyEdge = edgeLoop(octagonPoints(1.58,0.47),0.032);
box.add(bodyEdge);

const hinge = new THREE.Group();
hinge.position.set(0,0.53,-1.38);
box.add(hinge);

const hingeBar = new THREE.Mesh(new THREE.CylinderGeometry(0.105,0.105,2.45,16),goldMat);
hingeBar.rotation.z=Math.PI/2;
hinge.add(hingeBar);

for(const x of [-1.05,1.05]){
  const knuckle=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.17,0.38,16),goldMat);
  knuckle.rotation.z=Math.PI/2;
  knuckle.position.x=x;
  hinge.add(knuckle);
  const glint=new THREE.Mesh(new THREE.TorusGeometry(0.18,0.018,6,18),fringeMat);
  glint.rotation.y=Math.PI/2;
  glint.position.x=x;
  hinge.add(glint);
}

const lidPivot = new THREE.Group();
lidPivot.position.set(0,0.55,-1.35);
lidPivot.rotation.x=-1.08;
box.add(lidPivot);

const lidShape=makeOctagonalShape(3.18,1.88,0.28);
const lidGeo=new THREE.ExtrudeGeometry(lidShape,{depth:0.17,bevelEnabled:true,bevelSegments:3,bevelSize:0.055,bevelThickness:0.04});
lidGeo.translate(0,0,0);
const lid=new THREE.Mesh(lidGeo,lidMat);
lid.position.set(0,0.94,-0.085);
lid.castShadow=true;
lidPivot.add(lid);

const lidPoints=[
  new THREE.Vector3(-1.31,0.09,-0.19),new THREE.Vector3(1.31,0.09,-0.19),
  new THREE.Vector3(1.59,0.37,-0.19),new THREE.Vector3(1.59,1.51,-0.19),
  new THREE.Vector3(1.31,1.79,-0.19),new THREE.Vector3(-1.31,1.79,-0.19),
  new THREE.Vector3(-1.59,1.51,-0.19),new THREE.Vector3(-1.59,0.37,-0.19)
];
lidPivot.add(edgeLoop(lidPoints,0.032));

const lidInset=new THREE.Mesh(new THREE.ShapeGeometry(makeOctagonalShape(2.82,1.52,0.22)),innerMat);
lidInset.position.set(0,0.94,0.095);
lidInset.rotation.x=0;
lidPivot.add(lidInset);

for(const x of [-1.22,1.22]){
  const latch=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.34,0.1),goldMat);
  latch.position.set(x,0.77,-0.22);
  latch.rotation.z=x<0?-0.12:0.12;
  lidPivot.add(latch);
}

const dancer = new THREE.Group();
dancer.position.y=0.56;
box.add(dancer);

const spindle=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.065,1.38,16),goldMat);
spindle.position.y=0.69;
dancer.add(spindle);

const spindleGlow=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,1.3,12),new THREE.MeshBasicMaterial({
  color:0x56fff1,transparent:true,opacity:0.22,blending:THREE.AdditiveBlending
}));
spindleGlow.position.y=0.69;
dancer.add(spindleGlow);

const skirt=new THREE.Mesh(new THREE.LatheGeometry([
  new THREE.Vector2(0.08,0.35),new THREE.Vector2(0.18,0.28),
  new THREE.Vector2(0.42,0.06),new THREE.Vector2(0.5,-0.04),
  new THREE.Vector2(0.44,-0.12),new THREE.Vector2(0.1,-0.16)
],32),dancerMat);
skirt.position.y=1.25;
skirt.castShadow=true;
dancer.add(skirt);

const torso=new THREE.Mesh(new THREE.SphereGeometry(0.16,20,14),dancerMat);
torso.scale.set(0.75,1.35,0.7);
torso.position.y=1.62;
dancer.add(torso);

const head=new THREE.Mesh(new THREE.SphereGeometry(0.14,20,14),dancerMat);
head.position.y=1.91;
dancer.add(head);

function tubeBetween(a,b,r,material){
  const mid=a.clone().add(b).multiplyScalar(0.5);
  const curve=new THREE.LineCurve3(a.clone(),b.clone());
  const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,12,r,8,false),material);
  mesh.position.sub(mid);
  const g=new THREE.Group();
  g.position.copy(mid); g.add(mesh);
  return g;
}
const armL=tubeBetween(new THREE.Vector3(-0.1,1.7,0),new THREE.Vector3(-0.42,1.82,0.02),0.035,dancerMat);
const armR=tubeBetween(new THREE.Vector3(0.1,1.7,0),new THREE.Vector3(0.43,1.77,0.02),0.035,dancerMat);
dancer.add(armL,armR);

const halo=new THREE.Mesh(new THREE.TorusGeometry(0.34,0.018,8,48),fringeMat);
halo.position.y=1.94;
halo.rotation.x=Math.PI/2;
dancer.add(halo);

const halo2=new THREE.Mesh(new THREE.TorusGeometry(0.54,0.012,8,48),new THREE.MeshBasicMaterial({
  color:0x7e6bff,transparent:true,opacity:0.42,blending:THREE.AdditiveBlending
}));
halo2.position.y=1.35;
halo2.rotation.x=Math.PI/2;
dancer.add(halo2);

const floor=new THREE.Mesh(new THREE.CircleGeometry(12,96),new THREE.MeshStandardMaterial({
  color:0x03050b,metalness:0.65,roughness:0.26
}));
floor.rotation.x=-Math.PI/2;
floor.position.y=-0.52;
floor.receiveShadow=true;
scene.add(floor);

const glowDisc=new THREE.Mesh(new THREE.CircleGeometry(2.7,64),new THREE.MeshBasicMaterial({
  color:0x073954,transparent:true,opacity:0.18,blending:THREE.AdditiveBlending
}));
glowDisc.rotation.x=-Math.PI/2;
glowDisc.position.y=-0.515;
scene.add(glowDisc);

scene.add(new THREE.HemisphereLight(0x78cfff,0x080316,1.25));

const key=new THREE.DirectionalLight(0xb9f6ff,3.1);
key.position.set(3.5,6,4);
key.castShadow=true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.left=-4; key.shadow.camera.right=4;
key.shadow.camera.top=5; key.shadow.camera.bottom=-3;
scene.add(key);

const violet=new THREE.PointLight(0x8a42ff,16,7,2);
violet.position.set(-3,2.5,-2.2);
scene.add(violet);

const cyan=new THREE.PointLight(0x00f5dc,13,6,2);
cyan.position.set(2,1.5,2.8);
scene.add(cyan);

function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  holoMat.uniforms.uTime.value=t;
  lidMat.uniforms.uTime.value=t;
  dancerMat.uniforms.uTime.value=t;
  dancer.rotation.y=t*1.15;
  halo.rotation.z=t*1.8;
  halo2.rotation.z=-t*0.8;
  glowDisc.material.opacity=0.13+Math.sin(t*1.6)*0.035;
  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
