<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plush Axolotl</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f6eaf0;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6eaf0);
scene.fog = new THREE.Fog(0xf6eaf0, 10, 18);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 50);
camera.position.set(5.4, 4.15, 7.6);
camera.lookAt(0, 1.15, -0.25);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.15, -0.25);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.72;
controls.minDistance = 5.4;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xfff7fb, 0x8e7185, 2.25));

const key = new THREE.DirectionalLight(0xfff0f5, 4.1);
key.position.set(4.5, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -6;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 18;
key.shadow.bias = -0.00025;
scene.add(key);

const rim = new THREE.DirectionalLight(0xd7c8ff, 2.2);
rim.position.set(-5, 4, -5);
scene.add(rim);

const fill = new THREE.PointLight(0xff99bc, 17, 12, 2);
fill.position.set(-3.5, 2.2, 4);
scene.add(fill);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xeadde3,
  roughness: 0.96,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(7.5, 96), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

const plush = new THREE.MeshPhysicalMaterial({
  color: 0xf5a8bd,
  roughness: 0.89,
  metalness: 0,
  sheen: 0.72,
  sheenColor: new THREE.Color(0xffd2dc),
  sheenRoughness: 0.84,
  clearcoat: 0.03,
  clearcoatRoughness: 1
});

const plushLight = new THREE.MeshPhysicalMaterial({
  color: 0xffbdce,
  roughness: 0.92,
  metalness: 0,
  sheen: 0.8,
  sheenColor: new THREE.Color(0xffe1e8),
  sheenRoughness: 0.9
});

const felt = new THREE.MeshPhysicalMaterial({
  color: 0xd84579,
  roughness: 0.96,
  metalness: 0,
  sheen: 0.38,
  sheenColor: new THREE.Color(0xff82a8),
  sheenRoughness: 1
});

const feltEdge = new THREE.MeshStandardMaterial({
  color: 0xb82f62,
  roughness: 1
});

const thread = new THREE.MeshStandardMaterial({
  color: 0x4a2434,
  roughness: 0.8
});

const seamMaterial = new THREE.MeshStandardMaterial({
  color: 0xbf7188,
  roughness: 1
});

const fiberMaterial = new THREE.MeshStandardMaterial({
  color: 0xffcfda,
  roughness: 1
});

const axolotl = new THREE.Group();
axolotl.rotation.y = -0.08;
scene.add(axolotl);

function makeEllipsoid(radius, sx, sy, sz, material, x, y, z, segments = 48) {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(radius, segments, Math.floor(segments * 0.65)),
    material
  );
  mesh.scale.set(sx, sy, sz);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

const body = makeEllipsoid(1, 1.03, 0.78, 1.72, plush, 0, 1.12, -0.37, 56);
body.rotation.x = -0.045;
axolotl.add(body);

const belly = makeEllipsoid(1, 0.87, 0.61, 1.42, plushLight, 0, 0.88, -0.18, 48);
belly.scale.multiplyScalar(0.98);
axolotl.add(belly);

const head = makeEllipsoid(1, 1.54, 0.84, 0.76, plushLight, 0, 1.57, 1.27, 64);
head.rotation.x = -0.025;
axolotl.add(head);

const muzzle = makeEllipsoid(1, 1.09, 0.43, 0.24, plushLight, 0, 1.36, 1.91, 48);
axolotl.add(muzzle);

const tailGeometry = new THREE.SphereGeometry(1, 64, 36);
const tailPosition = tailGeometry.attributes.position;
for (let i = 0; i < tailPosition.count; i++) {
  const x = tailPosition.getX(i);
  const y = tailPosition.getY(i);
  const z = tailPosition.getZ(i);
  const dimple = 1 - 0.075 * Math.exp(-10 * (z + 0.05) * (z + 0.05)) * (0.5 + 0.5 * Math.cos(y * 5));
  const sideWobble = 1 + 0.025 * Math.sin(y * 9 + z * 4);
  tailPosition.setXYZ(i, x * dimple * sideWobble, y * sideWobble, z);
}
tailGeometry.computeVertexNormals();

const tail = new THREE.Mesh(tailGeometry, plush);
tail.scale.set(0.39, 0.76, 1.56);
tail.position.set(-0.18, 1.12, -2.18);
tail.rotation.set(-0.08, -0.18, 0.08);
tail.castShadow = true;
tail.receiveShadow = true;
axolotl.add(tail);

function addLimb(side, z, angle, scale = 1) {
  const group = new THREE.Group();
  group.position.set(side * 0.83, 0.7, z);
  group.rotation.z = side * angle;
  group.rotation.x = z > 0 ? -0.2 : 0.14;

  const limb = makeEllipsoid(1, 0.37 * scale, 0.29 * scale, 0.65 * scale, plushLight, 0, 0, 0, 40);
  limb.rotation.x = z > 0 ? -0.18 : 0.1;
  limb.rotation.z = side * 0.2;
  group.add(limb);

  const paw = makeEllipsoid(1, 0.43 * scale, 0.19 * scale, 0.38 * scale, plushLight, side * 0.12, -0.16, 0.42, 36);
  paw.rotation.z = side * 0.08;
  group.add(paw);

  for (let i = -1; i <= 1; i++) {
    const toe = makeEllipsoid(1, 0.085 * scale, 0.06 * scale, 0.2 * scale, plushLight,
      side * 0.12 + i * 0.14, -0.17, 0.68, 22);
    toe.rotation.x = 0.18;
    group.add(toe);
  }

  axolotl.add(group);
}

addLimb(-1, 0.52, 0.54, 1);
addLimb(1, 0.52, 0.54, 1);
addLimb(-1, -1.03, 0.42, 0.93);
addLimb(1, -1.03, 0.42, 0.93);

function addTube(curve, radius, material, segments = 32, radial = 7, parent = axolotl) {
  const mesh = new THREE.Mesh(
    new THREE.TubeGeometry(curve, segments, radius, radial, false),
    material
  );
  mesh.castShadow = true;
  parent.add(mesh);
  return mesh;
}

function wrinkle(side, z, index) {
  const x = side * (0.91 + index * 0.055);
  const y = 0.81 + index * 0.09;
  const curve = new THREE.CubicBezierCurve3(
    new THREE.Vector3(x, y, z - 0.31),
    new THREE.Vector3(side * 1.06, y + 0.04, z - 0.12),
    new THREE.Vector3(side * 1.07, y + 0.04, z + 0.13),
    new THREE.Vector3(x, y, z + 0.29)
  );
  addTube(curve, 0.014, seamMaterial, 22, 6);
}

for (const side of [-1, 1]) {
  wrinkle(side, 0.48, 0);
  wrinkle(side, 0.48, 1);
  wrinkle(side, -1.02, 0);
  wrinkle(side, -1.02, 1);
}

function createGill(side, y, rotation, length, width) {
  const shape = new THREE.Shape();
  shape.moveTo(0, -width * 0.34);
  shape.bezierCurveTo(length * 0.16, -width * 0.58, length * 0.2, -width * 0.06, length * 0.34, -width * 0.42);
  shape.bezierCurveTo(length * 0.45, -width * 0.7, length * 0.53, -width * 0.08, length * 0.64, -width * 0.38);
  shape.bezierCurveTo(length * 0.77, -width * 0.64, length * 0.86, -width * 0.1, length, 0);
  shape.bezierCurveTo(length * 0.84, width * 0.14, length * 0.78, width * 0.62, length * 0.64, width * 0.35);
  shape.bezierCurveTo(length * 0.53, width * 0.1, length * 0.46, width * 0.68, length * 0.33, width * 0.4);
  shape.bezierCurveTo(length * 0.2, width * 0.12, length * 0.13, width * 0.52, 0, width * 0.34);
  shape.closePath();

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.095,
    bevelEnabled: true,
    bevelSegments: 2,
    steps: 1,
    bevelSize: 0.035,
    bevelThickness: 0.025,
    curveSegments: 18
  });
  geometry.translate(0, 0, -0.0475);

  const frond = new THREE.Mesh(geometry, felt);
  frond.position.set(side * 1.24, y, 1.22);
  frond.rotation.z = side > 0 ? rotation : Math.PI - rotation;
  frond.rotation.x = -0.16;
  frond.rotation.y = side * 0.11;
  frond.castShadow = true;
  frond.receiveShadow = true;
  axolotl.add(frond);

  const baseCurve = new THREE.CubicBezierCurve3(
    new THREE.Vector3(side * 1.12, y, 1.23),
    new THREE.Vector3(side * 1.26, y + 0.01, 1.24),
    new THREE.Vector3(side * 1.35, y + 0.01, 1.23),
    new THREE.Vector3(side * 1.43, y, 1.22)
  );
  addTube(baseCurve, 0.065, feltEdge, 16, 8);
}

for (const side of [-1, 1]) {
  createGill(side, 2.05, side * 0.48, 1.08, 0.44);
  createGill(side, 1.69, side * 0.06, 1.21, 0.5);
  createGill(side, 1.34, side * -0.42, 1.03, 0.43);
}

function eye(side) {
  const eyeMesh = makeEllipsoid(1, 0.13, 0.14, 0.07, thread, side * 0.59, 1.69, 1.985, 32);
  eyeMesh.rotation.x = -0.05;
  axolotl.add(eyeMesh);

  const glint = makeEllipsoid(1, 0.024, 0.028, 0.012,
    new THREE.MeshBasicMaterial({ color: 0xffedf4 }),
    side * 0.555, 1.735, 2.048, 16);
  axolotl.add(glint);
}
eye(-1);
eye(1);

const smile = new THREE.CubicBezierCurve3(
  new THREE.Vector3(-0.43, 1.35, 2.148),
  new THREE.Vector3(-0.21, 1.22, 2.205),
  new THREE.Vector3(0.21, 1.22, 2.205),
  new THREE.Vector3(0.43, 1.35, 2.148)
);
addTube(smile, 0.026, thread, 42, 8);

for (const side of [-1, 1]) {
  const cheek = makeEllipsoid(
    1, 0.18, 0.075, 0.025,
    new THREE.MeshBasicMaterial({ color: 0xf28eae, transparent: true, opacity: 0.48 }),
    side * 0.83, 1.32, 2.055, 26
  );
  axolotl.add(cheek);
}

const spine = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 2.23, 1.02),
  new THREE.Vector3(0, 1.91, 0.48),
  new THREE.Vector3(0, 1.88, -0.24),
  new THREE.Vector3(-0.02, 1.76, -1.02),
  new THREE.Vector3(-0.12, 1.65, -1.75),
  new THREE.Vector3(-0.22, 1.58, -2.63)
]);
addTube(spine, 0.018, seamMaterial, 72, 6);

const stitchGeometry = new THREE.CylinderGeometry(0.014, 0.014, 0.19, 6);
const stitchMaterial = new THREE.MeshStandardMaterial({ color: 0x985269, roughness: 1 });
const stitchPoints = [
  [0, 2.22, 0.97, 0],
  [0, 2.03, 0.63, 0],
  [0, 1.91, 0.22, 0],
  [0, 1.88, -0.22, 0],
  [-0.01, 1.82, -0.67, 0],
  [-0.04, 1.74, -1.1, 0.03],
  [-0.1, 1.67, -1.53, 0.08],
  [-0.16, 1.61, -1.96, 0.12],
  [-0.22, 1.57, -2.38, 0.16]
];

for (const [x, y, z, turn] of stitchPoints) {
  const stitch = new THREE.Mesh(stitchGeometry, stitchMaterial);
  stitch.position.set(x, y + 0.018, z);
  stitch.rotation.z = Math.PI / 2;
  stitch.rotation.y = turn;
  stitch.castShadow = true;
  axolotl.add(stitch);
}

let seed = 982451653;
function random() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}

function addPilling(center, radii, count, material, latitudeMin = -0.2) {
  const geometry = new THREE.ConeGeometry(0.009, 0.046, 4);
  geometry.translate(0, 0.023, 0);
  const fibers = new THREE.InstancedMesh(geometry, material, count);
  const dummy = new THREE.Object3D();
  const normal = new THREE.Vector3();
  const worldUp = new THREE.Vector3(0, 1, 0);

  for (let i = 0; i < count; i++) {
    const phi = random() * Math.PI * 2;
    const v = latitudeMin + random() * (1 - latitudeMin);
    const theta = Math.acos(THREE.MathUtils.clamp(v, -1, 1));
    const nx = Math.sin(theta) * Math.cos(phi);
    const ny = Math.cos(theta);
    const nz = Math.sin(theta) * Math.sin(phi);

    normal.set(nx / radii.x, ny / radii.y, nz / radii.z).normalize();
    dummy.position.set(
      center.x + nx * radii.x,
      center.y + ny * radii.y,
      center.z + nz * radii.z
    );
    dummy.quaternion.setFromUnitVectors(worldUp, normal);
    const s = 0.6 + random() * 1.25;
    dummy.scale.set(s, s, s);
    dummy.updateMatrix();
    fibers.setMatrixAt(i, dummy.matrix);
  }
  fibers.castShadow = true;
  axolotl.add(fibers);
}

addPilling(new THREE.Vector3(0, 1.58, 1.28), new THREE.Vector3(1.55, 0.85, 0.77), 170, fiberMaterial, -0.12);
addPilling(new THREE.Vector3(0, 1.13, -0.37), new THREE.Vector3(1.04, 0.79, 1.72), 210, fiberMaterial, -0.05);
addPilling(new THREE.Vector3(-0.18, 1.12, -2.18), new THREE.Vector3(0.4, 0.77, 1.55), 80, fiberMaterial, -0.05);

const looseThreads = new THREE.Group();
for (let i = 0; i < 24; i++) {
  const angle = random() * Math.PI * 2;
  const x = Math.cos(angle) * (0.98 + random() * 0.08);
  const z = -0.35 + Math.sin(angle) * (1.55 + random() * 0.08);
  const y = 1.15 + 0.62 * Math.sqrt(Math.max(0, 1 - Math.min(1, (z + 0.35) * (z + 0.35) / 2.5)));
  const curve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(x, y, z),
    new THREE.Vector3(x * 1.02, y + 0.04, z + 0.015),
    new THREE.Vector3(x * 1.025, y + 0.075, z + 0.03)
  );
  addTube(curve, 0.006, fiberMaterial, 5, 4, looseThreads);
}
axolotl.add(looseThreads);

const softShadow = new THREE.Mesh(
  new THREE.CircleGeometry(2.55, 64),
  new THREE.MeshBasicMaterial({
    color: 0x8d6574,
    transparent: true,
    opacity: 0.1,
    depthWrite: false
  })
);
softShadow.rotation.x = -Math.PI / 2;
softShadow.scale.set(1, 1.65, 1);
softShadow.position.set(0, 0.012, -0.4);
scene.add(softShadow);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  axolotl.position.y = 0.025 + Math.sin(t * 1.15) * 0.012;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
