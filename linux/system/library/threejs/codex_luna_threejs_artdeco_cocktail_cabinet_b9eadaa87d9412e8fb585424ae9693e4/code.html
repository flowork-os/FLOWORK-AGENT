<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Deco Cocktail Cabinet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09080a}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x09080a);
scene.fog = new THREE.Fog(0x09080a, 13, 24);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(9, 7.3, 12);
camera.lookAt(0, 3.6, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.target.set(0, 3.55, 0);
controls.minDistance = 8;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.48;

const ebony = new THREE.MeshStandardMaterial({color:0x111116, metalness:0.28, roughness:0.2});
const ebonyEdge = new THREE.MeshStandardMaterial({color:0x25222a, metalness:0.35, roughness:0.18});
const brass = new THREE.MeshStandardMaterial({color:0xc28a38, metalness:0.88, roughness:0.18});
const brassLight = new THREE.MeshStandardMaterial({color:0xf1c768, metalness:0.92, roughness:0.12});
const black = new THREE.MeshStandardMaterial({color:0x030306, metalness:0.15, roughness:0.25});
const ruby = new THREE.MeshStandardMaterial({color:0x7c1424, metalness:0.35, roughness:0.2});
const floorMat = new THREE.MeshStandardMaterial({color:0x151116, metalness:0.05, roughness:0.72});

function box(name, x, y, z, sx, sy, sz, material, bevel=false){
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz), material);
  mesh.name = name;
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}
function cylinder(name, x, y, z, r1, r2, h, material, radial=16){
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,radial), material);
  mesh.name = name;
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}
function triangle(name, cx, cy, radius, a0, a1, material, z=0.82){
  const shape = new THREE.Shape();
  shape.moveTo(0,0);
  shape.lineTo(Math.cos(a0)*radius, Math.sin(a0)*radius);
  shape.lineTo(Math.cos(a1)*radius, Math.sin(a1)*radius);
  shape.closePath();
  const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shape), material);
  mesh.name = name;
  mesh.position.set(cx,cy,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

box("Cabinet carcass",0,4.12,0,4.05,4.95,1.48,ebony);
box("Lower plinth",0,1.63,0,4.28,0.28,1.68,black);
box("Upper cornice",0,6.57,0,4.32,0.25,1.7,ebonyEdge);
box("Upper brass line",0,6.74,0.02,4.12,0.09,1.58,brass);

for(const x of [-2.08,2.08]){
  box("Vertical brass stile",x,4.12,0.78,0.13,4.7,0.1,brassLight);
  box("Stile shadow",x*0.96,4.12,0.785,0.055,4.45,0.035,black);
}
for(const y of [1.86,6.38]){
  box("Door horizontal rail",0,y,0.79,3.98,0.12,0.1,brass);
}

const doorY = 4.12;
for(const side of [-1,1]){
  const cx = side * 0.98;
  box("Ebony door",cx,doorY,0.77,1.87,4.32,0.13,ebonyEdge);
  box("Door inner shadow",cx,doorY,0.845,1.67,4.1,0.035,black);
  box("Door top rail",cx,6.22,0.87,1.78,0.075,0.04,brass);
  box("Door bottom rail",cx,2.02,0.87,1.78,0.075,0.04,brass);
  box("Door outer rail",cx + side*0.84,doorY,0.87,0.07,4.12,0.04,brass);
  box("Door inner rail",cx - side*0.84,doorY,0.87,0.07,4.12,0.04,brass);
  const radius = 1.9;
  for(let i=0;i<10;i++){
    const a0 = -Math.PI*0.5 + i*(Math.PI/10);
    const a1 = -Math.PI*0.5 + (i+1)*(Math.PI/10);
    triangle("Sunburst ray",cx,doorY,radius,a0,a1,i%2===0?brass:brassLight,0.895);
  }
  for(let i=0;i<10;i++){
    const a0 = Math.PI*0.5 + i*(Math.PI/10);
    const a1 = Math.PI*0.5 + (i+1)*(Math.PI/10);
    triangle("Sunburst ray",cx,doorY,radius,a0,a1,i%2===0?brassLight:brass,0.896);
  }
  cylinder("Sunburst boss",cx,doorY,0.93,0.19,0.19,0.08,ruby,24);
  cylinder("Sunburst boss rim",cx,doorY,0.95,0.25,0.25,0.045,brassLight,24);
  box("Door diamond",cx,doorY,0.98,0.3,0.3,0.045,brassLight).rotation.z=Math.PI/4;
}

for(const x of [-1.82,-1.55,-1.28,1.28,1.55,1.82]){
  cylinder("Brass fluting",x,4.05,0.88,0.045,0.045,4.18,brassLight,10);
}
for(const x of [-0.12,0.12]){
  cylinder("Door handle",x,3.72,1.03,0.075,0.075,0.56,brassLight,16).rotation.x=Math.PI/2;
  cylinder("Handle end",x,4.02,1.04,0.1,0.1,0.08,ruby,16).rotation.x=Math.PI/2;
}

for(const x of [-1.62,1.62]){
  const leg = cylinder("Tapered gold foot",x,0.83,0,0.22,0.14,1.48,ebony,4);
  leg.rotation.y=Math.PI/4;
  cylinder("Gold leg cap",x,0.1,0,0.24,0.19,0.16,brassLight,4).rotation.y=Math.PI/4;
  box("Leg brass collar",x,1.32,0,0.47,0.13,0.47,brass);
  box("Leg black inset",x,1.39,0,0.32,0.08,0.32,black);
}

const crownLevels = [
  [4.35,6.88,1.8,0.42],
  [3.85,7.22,1.5,0.36],
  [3.2,7.53,1.12,0.3],
  [2.35,7.79,0.68,0.24]
];
for(const level of crownLevels){
  box("Stepped ziggurat crown",0,level[1],0,level[0],level[3],1.55,ebonyEdge);
  box("Crown brass edge",0,level[1]+level[3]*0.5+0.025,0.01,level[0]*0.94,0.045,1.6,brassLight);
}
box("Crown finial",0,8.03,0,0.34,0.2,0.6,brass);
box("Crown finial black",0,8.17,0,0.18,0.12,0.4,black);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(40,40), floorMat);
floor.rotation.x=-Math.PI/2;
floor.position.y=0;
floor.receiveShadow=true;
scene.add(floor);

const backGlow = new THREE.Mesh(
  new THREE.PlaneGeometry(12,9),
  new THREE.MeshBasicMaterial({color:0x17121b, transparent:true, opacity:0.7})
);
backGlow.position.set(0,4.5,-2.8);
scene.add(backGlow);

scene.add(new THREE.HemisphereLight(0x9d91b4,0x120d12,1.5));

const key = new THREE.DirectionalLight(0xffe2b0,4.2);
key.position.set(5,10,8);
key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-7;
key.shadow.camera.right=7;
key.shadow.camera.top=11;
key.shadow.camera.bottom=-2;
scene.add(key);

const fill = new THREE.PointLight(0x6f83ff,18,14,2);
fill.position.set(-5,5,5);
scene.add(fill);

const rim = new THREE.SpotLight(0xffbd55,32,18,Math.PI/7,0.45,1.4);
rim.position.set(0,9,-5);
rim.target.position.set(0,4,0);
rim.castShadow=true;
scene.add(rim);
scene.add(rim.target);

const warm = new THREE.PointLight(0xd64245,7,8,2);
warm.position.set(0,3,2.5);
scene.add(warm);

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});

function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
