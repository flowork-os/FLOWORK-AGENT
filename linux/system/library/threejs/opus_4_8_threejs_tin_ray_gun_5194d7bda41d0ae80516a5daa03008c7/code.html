<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Retro Tin-Toy Ray Gun</title>
<style>
  html, body { margin: 0; height: 100%; background: #14171b; overflow: hidden; }
  #info {
    position: fixed; left: 14px; bottom: 12px; z-index: 10;
    font: 12px/1.4 "Courier New", monospace; color: #9aa3ad;
    letter-spacing: 1px; text-transform: uppercase; user-select: none;
    text-shadow: 0 1px 2px #000;
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="info">Atomic Ray Gun · litho tin toy · drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------- Renderer */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const maxAniso = renderer.capabilities.getMaxAnisotropy();

/* ------------------------------------------------------------------- Scene */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15181c);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ Camera */
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.6, 2.4, 7.0);

/* ---------------------------------------------------------------- Controls */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.15;
controls.minDistance = 4.5;
controls.maxDistance = 16;
controls.target.set(0, 0, 0);

/* ---------------------------------------------------------------- Lighting */
const hemi = new THREE.HemisphereLight(0x9bb3d6, 0x2a2018, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2df, 2.5);
key.position.set(5, 7.5, 4.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 32;
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -5;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
scene.add(key);
scene.add(key.target);

const fill = new THREE.DirectionalLight(0xbcd0ff, 0.55);
fill.position.set(-6, 2.5, 3.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0x88bbff, 1.35);
rim.position.set(-3.5, 4.5, -6);
scene.add(rim);

/* --------------------------------------------------- Procedural textures */
function newCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

function addScratches(x, w, h, n) {
  for (let i = 0; i < n; i++) {
    x.globalAlpha = 0.05 + Math.random() * 0.22;
    x.strokeStyle = Math.random() < 0.5 ? '#ffffff' : '#20180f';
    x.lineWidth = Math.random() < 0.85 ? 1 : 2;
    const px = Math.random() * w, py = Math.random() * h;
    const len = 8 + Math.random() * 75, ang = Math.random() * Math.PI * 2;
    x.beginPath();
    x.moveTo(px, py);
    x.lineTo(px + Math.cos(ang) * len, py + Math.sin(ang) * len);
    x.stroke();
  }
  x.globalAlpha = 1;
}

function addWear(x, w, h) {
  for (let i = 0; i < 30; i++) {
    const px = Math.random() * w, py = Math.random() * h, r = 18 + Math.random() * 80;
    const g = x.createRadialGradient(px, py, 0, px, py, r);
    const bright = Math.random() < 0.6;
    g.addColorStop(0, bright ? 'rgba(205,210,214,0.22)' : 'rgba(40,30,20,0.20)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g;
    x.fillRect(px - r, py - r, 2 * r, 2 * r);
  }
}

function drawStar(x, cx, cy, r, color) {
  x.save();
  x.translate(cx, cy);
  x.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * 2 * Math.PI / 5;
    x.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    const a2 = a + Math.PI / 5;
    x.lineTo(Math.cos(a2) * r * 0.45, Math.sin(a2) * r * 0.45);
  }
  x.closePath();
  x.fillStyle = color;
  x.fill();
  x.restore();
}

function drawRocket(x, cx, cy, s) {
  x.save();
  x.translate(cx, cy);
  x.scale(s, s);
  // flame
  x.fillStyle = '#f2c318';
  x.beginPath(); x.moveTo(-12, 46); x.quadraticCurveTo(0, 90, 12, 46); x.closePath(); x.fill();
  x.fillStyle = '#e8641a';
  x.beginPath(); x.moveTo(-7, 46); x.quadraticCurveTo(0, 72, 7, 46); x.closePath(); x.fill();
  // fins
  x.fillStyle = '#b5321f';
  x.beginPath(); x.moveTo(-20, 26); x.lineTo(-42, 54); x.lineTo(-17, 44); x.closePath(); x.fill();
  x.beginPath(); x.moveTo(20, 26); x.lineTo(42, 54); x.lineTo(17, 44); x.closePath(); x.fill();
  // body
  x.fillStyle = '#e8ecf0';
  x.beginPath(); x.ellipse(0, -2, 22, 47, 0, 0, Math.PI * 2); x.fill();
  x.strokeStyle = '#241f1c'; x.lineWidth = 2; x.stroke();
  // nose
  x.fillStyle = '#b5321f';
  x.beginPath(); x.moveTo(-22, -32); x.quadraticCurveTo(0, -74, 22, -32); x.closePath(); x.fill();
  // window
  x.fillStyle = '#2a6f97';
  x.beginPath(); x.arc(0, -8, 9, 0, Math.PI * 2); x.fill();
  x.strokeStyle = '#241f1c'; x.lineWidth = 2; x.stroke();
  x.restore();
}

function makeLithoTexture() {
  const w = 1024, h = 512;
  const c = newCanvas(w, h);
  const x = c.getContext('2d');
  x.fillStyle = '#e7d9b5';
  x.fillRect(0, 0, w, h);
  const bands = [
    [0.00, 0.10, '#b5321f'],
    [0.10, 0.13, '#241f1c'],
    [0.13, 0.45, '#ecdcae'],
    [0.45, 0.52, '#f2c318'],
    [0.52, 0.58, '#b5321f'],
    [0.58, 0.60, '#241f1c'],
    [0.60, 0.86, '#e9d38f'],
    [0.86, 0.90, '#241f1c'],
    [0.90, 1.00, '#b5321f'],
  ];
  bands.forEach(b => {
    x.fillStyle = b[2];
    x.fillRect(0, b[0] * h, w, (b[1] - b[0]) * h);
  });
  for (let i = 0; i < 3; i++) drawRocket(x, (i + 0.5) * w / 3, 0.29 * h, 1.0);
  for (let i = 0; i < 8; i++) drawStar(x, (i + 0.5) * w / 8, 0.73 * h, 12, '#f2c318');
  for (let i = 0; i < 8; i++) drawStar(x, (i + 0.5) * w / 8, 0.05 * h, 6, '#f7e39a');
  addWear(x, w, h);
  addScratches(x, w, h, 150);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.ClampToEdgeWrapping;
  t.repeat.set(3, 1);
  t.anisotropy = maxAniso;
  return t;
}

function makeGripTexture() {
  const w = 512, h = 512;
  const c = newCanvas(w, h);
  const x = c.getContext('2d');
  x.fillStyle = '#a12a1a';
  x.fillRect(0, 0, w, h);
  // yellow band
  x.fillStyle = '#f2c318';
  x.fillRect(0, 0.42 * h, w, 0.16 * h);
  x.fillStyle = '#241f1c';
  x.fillRect(0, 0.40 * h, w, 0.02 * h);
  x.fillRect(0, 0.58 * h, w, 0.02 * h);
  // grip ridges
  x.strokeStyle = 'rgba(20,15,10,0.5)';
  x.lineWidth = 3;
  for (let i = 0; i < 10; i++) {
    const yy = (0.62 + i * 0.035) * h;
    x.beginPath(); x.moveTo(0, yy); x.lineTo(w, yy); x.stroke();
  }
  drawStar(x, w * 0.5, h * 0.5, 26, '#b5321f');
  addWear(x, w, h);
  addScratches(x, w, h, 110);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  return t;
}

function makeMetalRough() {
  const w = 512, h = 512;
  const c = newCanvas(w, h);
  const x = c.getContext('2d');
  x.fillStyle = '#8c8c8c';
  x.fillRect(0, 0, w, h);
  for (let i = 0; i < 400; i++) {
    x.globalAlpha = 0.05 + Math.random() * 0.25;
    x.strokeStyle = Math.random() < 0.5 ? '#ffffff' : '#3a3a3a';
    x.lineWidth = Math.random() < 0.8 ? 1 : 2;
    const px = Math.random() * w, py = Math.random() * h;
    const len = 10 + Math.random() * 90, ang = Math.random() * Math.PI * 2;
    x.beginPath(); x.moveTo(px, py);
    x.lineTo(px + Math.cos(ang) * len, py + Math.sin(ang) * len);
    x.stroke();
  }
  x.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2, 1);
  t.anisotropy = maxAniso;
  return t;
}

const lithoTex = makeLithoTexture();
const gripTex = makeGripTexture();
const metalRoughTex = makeMetalRough();

/* --------------------------------------------------------------- Materials */
const matBody = new THREE.MeshStandardMaterial({ map: lithoTex, metalness: 0.55, roughness: 0.5, envMapIntensity: 0.9 });
const matGrip = new THREE.MeshStandardMaterial({ map: gripTex, metalness: 0.5, roughness: 0.55, envMapIntensity: 0.8 });
const matRed = new THREE.MeshStandardMaterial({ color: 0xb5321f, metalness: 0.5, roughness: 0.5 });
const matSteel = new THREE.MeshStandardMaterial({ color: 0xd0d4d9, metalness: 0.95, roughness: 0.32, roughnessMap: metalRoughTex, envMapIntensity: 1.0 });
const matBrass = new THREE.MeshStandardMaterial({ color: 0xd9a441, metalness: 0.95, roughness: 0.33, roughnessMap: metalRoughTex, envMapIntensity: 1.0 });
const matDark = new THREE.MeshStandardMaterial({ color: 0x2b2b30, metalness: 0.8, roughness: 0.42 });
const matChrome = new THREE.MeshStandardMaterial({ color: 0xf0f2f5, metalness: 1.0, roughness: 0.08, envMapIntensity: 1.2 });
const matRivet = new THREE.MeshStandardMaterial({ color: 0xbfc4c9, metalness: 0.95, roughness: 0.28 });
const matGlass = new THREE.MeshPhysicalMaterial({
  color: 0xcfe6ff, metalness: 0, roughness: 0.06, transmission: 1.0,
  transparent: true, thickness: 0.35, ior: 1.45, envMapIntensity: 1.2, clearcoat: 1.0, clearcoatRoughness: 0.05
});
const matSpark = new THREE.MeshStandardMaterial({ color: 0x0a1826, emissive: 0x66ccff, emissiveIntensity: 2.2, roughness: 0.4 });
const matMuzzle = new THREE.MeshStandardMaterial({ color: 0x1a0a00, emissive: 0xff7a1a, emissiveIntensity: 1.5, roughness: 0.5 });

/* ------------------------------------------------------ Helix curve helper */
class HelixCurve extends THREE.Curve {
  constructor(radius, height, turns, phase = 0) {
    super();
    this.radius = radius; this.height = height; this.turns = turns; this.phase = phase;
  }
  getPoint(t, target = new THREE.Vector3()) {
    const a = this.phase + t * this.turns * Math.PI * 2;
    return target.set(t * this.height, this.radius * Math.cos(a), this.radius * Math.sin(a));
  }
}

/* --------------------------------------------------------- Build the gun */
const gun = new THREE.Group();

function addMesh(geo, mat, opts = {}) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = opts.cast !== false;
  m.receiveShadow = opts.receive !== false;
  if (opts.pos) m.position.set(opts.pos[0], opts.pos[1], opts.pos[2]);
  if (opts.rot) m.rotation.set(opts.rot[0], opts.rot[1], opts.rot[2]);
  gun.add(m);
  return m;
}

// --- Body (lathe, bulbous receiver) along +X
const profile = [
  [0.02, 0.00], [0.30, 0.05], [0.48, 0.15], [0.62, 0.35], [0.70, 0.60],
  [0.72, 0.85], [0.68, 1.10], [0.55, 1.35], [0.42, 1.55], [0.34, 1.70]
].map(p => new THREE.Vector2(p[0], p[1]));
const bodyGeo = new THREE.LatheGeometry(profile, 72);
bodyGeo.rotateZ(-Math.PI / 2);
addMesh(bodyGeo, matBody);

// back cap
addMesh(new THREE.SphereGeometry(0.16, 24, 16), matBody, { pos: [0.0, 0, 0] });

// --- Barrel
const barrelGeo = new THREE.CylinderGeometry(0.24, 0.28, 1.6, 40, 1, false);
barrelGeo.rotateZ(-Math.PI / 2);
addMesh(barrelGeo, matSteel, { pos: [2.5, 0, 0] });

// --- Barrel coil (helix)
const coilGeo = new THREE.TubeGeometry(new HelixCurve(0.33, 1.35, 9), 260, 0.05, 10, false);
addMesh(coilGeo, matBrass, { pos: [1.8, 0, 0] });

// --- Muzzle flare
const muzzleGeo = new THREE.CylinderGeometry(0.52, 0.27, 0.5, 40, 1, true);
muzzleGeo.rotateZ(-Math.PI / 2);
addMesh(muzzleGeo, matSteel, { pos: [3.55, 0, 0], receive: true });
// lip ring
addMesh(new THREE.TorusGeometry(0.5, 0.05, 16, 40), matBrass, { pos: [3.8, 0, 0], rot: [0, Math.PI / 2, 0] });
// glowing inner disc
const muzzleDisc = addMesh(new THREE.CircleGeometry(0.24, 40), matMuzzle, { pos: [3.45, 0, 0], rot: [0, Math.PI / 2, 0], cast: false });

// --- Seams / bands
addMesh(new THREE.TorusGeometry(0.715, 0.02, 12, 60), matDark, { pos: [0.85, 0, 0], rot: [0, Math.PI / 2, 0] });
addMesh(new THREE.TorusGeometry(0.42, 0.03, 12, 48), matBrass, { pos: [1.62, 0, 0], rot: [0, Math.PI / 2, 0] });
addMesh(new THREE.TorusGeometry(0.315, 0.02, 12, 40), matDark, { pos: [0.14, 0, 0], rot: [0, Math.PI / 2, 0] });

// --- Rivets around seams
function addRivetRing(px, r, count) {
  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2;
    addMesh(new THREE.SphereGeometry(0.032, 12, 10), matRivet,
      { pos: [px, r * Math.cos(a), r * Math.sin(a)], cast: true });
  }
}
addRivetRing(0.85, 0.715, 18);
addRivetRing(0.30, 0.47, 14);
addRivetRing(1.35, 0.545, 14);

// --- Spark-window dome on top
const domeCenter = new THREE.Vector3(0.9, 0.78, 0);
// collar
addMesh(new THREE.TorusGeometry(0.29, 0.045, 16, 40), matBrass, { pos: [0.9, 0.66, 0], rot: [Math.PI / 2, 0, 0] });
// glass hemisphere
addMesh(new THREE.SphereGeometry(0.28, 40, 24, 0, Math.PI * 2, 0, Math.PI / 2), matGlass,
  { pos: [0.9, 0.66, 0], cast: false, receive: false });
// spark filament (two crossed rings + core)
const sparkGroup = new THREE.Group();
sparkGroup.position.copy(domeCenter);
const ring1 = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.013, 10, 28), matSpark);
const ring2 = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.013, 10, 28), matSpark);
ring2.rotation.y = Math.PI / 2;
const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.05, 0), matSpark);
sparkGroup.add(ring1, ring2, core);
sparkGroup.traverse(o => { o.castShadow = false; o.receiveShadow = false; });
gun.add(sparkGroup);
const sparkLight = new THREE.PointLight(0x88ccff, 2.2, 3.2, 2);
sparkLight.position.copy(domeCenter);
gun.add(sparkLight);
const muzzleLight = new THREE.PointLight(0xff7a1a, 0.5, 2.5, 2);
muzzleLight.position.set(3.5, 0, 0);
gun.add(muzzleLight);

// --- Grip
const gripGeo = new THREE.BoxGeometry(0.34, 1.2, 0.62);
gripGeo.translate(0, -0.6, 0);
const grip = addMesh(gripGeo, matGrip, { pos: [0.52, -0.28, 0], rot: [0, 0, 0.24] });
// rounded butt
addMesh(new THREE.CylinderGeometry(0.31, 0.31, 0.34, 24), matGrip,
  { pos: [0.28, -1.34, 0], rot: [Math.PI / 2, 0, 0.24] });
// grip rivets
[[0.42, -0.6, 0.31], [0.42, -1.05, 0.31], [0.62, -0.6, 0.31], [0.62, -1.05, 0.31]].forEach(p => {
  addMesh(new THREE.SphereGeometry(0.03, 10, 8), matRivet, { pos: p });
});

// --- Trigger guard + trigger
addMesh(new THREE.TorusGeometry(0.26, 0.05, 14, 40), matSteel, { pos: [1.15, -0.42, 0] });
addMesh(new THREE.BoxGeometry(0.06, 0.24, 0.1), matDark, { pos: [1.12, -0.4, 0], rot: [0, 0, 0.35] });

// --- Wind-up key on the side (+Z)
const keyGroup = new THREE.Group();
const shaftGeo = new THREE.CylinderGeometry(0.055, 0.055, 0.55, 20);
shaftGeo.rotateX(Math.PI / 2);
keyGroup.add(new THREE.Mesh(shaftGeo, matBrass));
keyGroup.children[0].position.set(0, 0, 0.85);
// key bow (two loops)
const loopA = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.045, 14, 32), matBrass);
const loopB = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.045, 14, 32), matBrass);
loopA.position.set(0, 0.14, 1.12);
loopB.position.set(0, -0.14, 1.12);
keyGroup.add(loopA, loopB);
// hub
const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.06, 18), matBrass);
hub.rotation.x = Math.PI / 2;
hub.position.set(0, 0, 1.12);
keyGroup.add(hub);
keyGroup.position.set(0.52, 0.12, 0.55);
keyGroup.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
gun.add(keyGroup);

// --- Antenna with chrome ball (back top)
addMesh(new THREE.CylinderGeometry(0.028, 0.028, 0.75, 14), matSteel, { pos: [0.12, 0.82, 0] });
addMesh(new THREE.SphereGeometry(0.13, 24, 18), matChrome, { pos: [0.12, 1.26, 0] });

// --- Tail fins (rocket look)
const finShape = new THREE.Shape();
finShape.moveTo(0.0, 0.34);
finShape.lineTo(-0.34, 0.34);
finShape.lineTo(0.02, 0.74);
finShape.closePath();
const finGeo = new THREE.ExtrudeGeometry(finShape, { depth: 0.035, bevelEnabled: false });
finGeo.translate(0, 0, -0.0175);
for (let k = 0; k < 3; k++) {
  const angle = Math.PI / 6 + k * (Math.PI * 2 / 3);
  addMesh(finGeo, matRed, { pos: [0.1, 0, 0], rot: [angle, 0, 0] });
}

/* --------------------------------------- Center object & ground shadow */
scene.add(gun);
const box = new THREE.Box3().setFromObject(gun);
const center = box.getCenter(new THREE.Vector3());
gun.position.sub(center);
const groundY = box.min.y - center.y;

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 64),
  new THREE.ShadowMaterial({ opacity: 0.4 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = groundY - 0.01;
ground.receiveShadow = true;
scene.add(ground);

key.target.position.set(0, 0, 0);

/* -------------------------------------------------------------- Animate */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // spark flicker
  const flick = 1.6 + 0.7 * Math.sin(t * 9) + 0.4 * Math.sin(t * 23.3) + 0.25 * Math.sin(t * 41.7);
  matSpark.emissiveIntensity = Math.max(0.4, flick);
  sparkLight.intensity = Math.max(0.3, 1.2 + flick * 0.5);
  sparkGroup.rotation.x = t * 1.5;
  sparkGroup.rotation.z = t * 1.1;

  // muzzle pulse
  const pulse = 1.2 + 0.35 * Math.sin(t * 3.0);
  matMuzzle.emissiveIntensity = pulse;
  muzzleLight.intensity = 0.35 + 0.25 * Math.sin(t * 3.0);

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* --------------------------------------------------------------- Resize */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
