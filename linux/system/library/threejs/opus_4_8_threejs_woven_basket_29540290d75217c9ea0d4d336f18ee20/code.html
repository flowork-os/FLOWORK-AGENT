<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Woven Wicker Basket — three.js</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #121317; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #label {
    position: fixed; left: 18px; bottom: 16px;
    font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: rgba(230, 220, 205, 0.55);
    letter-spacing: 0.02em; pointer-events: none; user-select: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  #label b { color: rgba(240, 225, 200, 0.82); font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<div id="label"><b>Woven Wicker Basket</b> · procedural three.js · drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ *
 *  Renderer
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

/* ------------------------------------------------------------------ *
 *  Scene, camera, controls
 * ------------------------------------------------------------------ */
const scene = new THREE.Scene();

// Neutral dark studio backdrop (subtle radial gradient)
function makeBackground() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(256, 200, 40, 256, 300, 520);
  grad.addColorStop(0.0, '#2b2d34');
  grad.addColorStop(0.45, '#1c1d22');
  grad.addColorStop(1.0, '#0e0f12');
  g.fillStyle = grad; g.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
scene.background = makeBackground();

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.02, 100);
camera.position.set(0.36, 0.27, 0.44);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.target.set(0, 0.095, 0);
controls.minDistance = 0.28;
controls.maxDistance = 1.4;
controls.maxPolarAngle = 1.53;
controls.enablePan = false;

/* ------------------------------------------------------------------ *
 *  Environment lighting (image-based, soft)
 * ------------------------------------------------------------------ */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();

/* ------------------------------------------------------------------ *
 *  Lights: hemisphere fill + key + fill + rim, soft shadows
 * ------------------------------------------------------------------ */
const hemi = new THREE.HemisphereLight(0xd8e2ff, 0x201a12, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff1dc, 3.4);
key.position.set(0.42, 0.62, 0.34);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.15;
key.shadow.camera.far = 3.0;
key.shadow.camera.left = -0.33;
key.shadow.camera.right = 0.33;
key.shadow.camera.top = 0.46;
key.shadow.camera.bottom = -0.06;
key.shadow.bias = -0.00035;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
key.target.position.set(0, 0.09, 0);
scene.add(key);
scene.add(key.target);

const fill = new THREE.DirectionalLight(0xbdd2ff, 0.75);
fill.position.set(-0.5, 0.28, 0.36);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffe6c4, 1.7);
rim.position.set(-0.28, 0.46, -0.52);
scene.add(rim);

/* ------------------------------------------------------------------ *
 *  Ground plane — subtle, only there to receive shadows
 * ------------------------------------------------------------------ */
function makeFloorTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(256, 256, 20, 256, 256, 300);
  grad.addColorStop(0.0, '#26262b');
  grad.addColorStop(0.5, '#17171b');
  grad.addColorStop(1.0, '#0c0c0e');
  g.fillStyle = grad; g.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 6),
  new THREE.MeshStandardMaterial({ map: makeFloorTexture(), roughness: 0.96, metalness: 0.0 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.receiveShadow = true;
floor.castShadow = false;
scene.add(floor);

/* ------------------------------------------------------------------ *
 *  Procedural wicker textures (color + roughness)
 * ------------------------------------------------------------------ */
function makeFiberTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#c69a63'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2800; i++) {
    const x = Math.random() * 256, y = Math.random() * 256;
    const len = 6 + Math.random() * 28;
    const ang = Math.random() * Math.PI * 2;
    const s = 150 + Math.floor(Math.random() * 90);
    g.strokeStyle = `rgba(${s},${Math.floor(s * 0.77)},${Math.floor(s * 0.5)},${0.05 + Math.random() * 0.13})`;
    g.lineWidth = 0.6 + Math.random() * 1.5;
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    g.stroke();
  }
  for (let i = 0; i < 420; i++) {
    g.fillStyle = `rgba(${60 + Math.random() * 45},${38 + Math.random() * 30},${18 + Math.random() * 22},${0.05 + Math.random() * 0.13})`;
    const x = Math.random() * 256, y = Math.random() * 256, r = 0.5 + Math.random() * 2.2;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function makeRoughTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#b4b4b4'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2200; i++) {
    const x = Math.random() * 256, y = Math.random() * 256;
    const len = 6 + Math.random() * 26;
    const ang = Math.random() * Math.PI * 2;
    const v = 120 + Math.floor(Math.random() * 100);
    g.strokeStyle = `rgba(${v},${v},${v},${0.06 + Math.random() * 0.14})`;
    g.lineWidth = 0.6 + Math.random() * 1.4;
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.NoColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const fiberTex = makeFiberTexture();
const roughTex = makeRoughTexture();

function makeMat(hex, rough) {
  const map = fiberTex.clone(); map.needsUpdate = true;
  const rmap = roughTex.clone(); rmap.needsUpdate = true;
  const rep = 2.4 + Math.random() * 1.4;
  const off = new THREE.Vector2(Math.random(), Math.random());
  const rot = Math.random() * Math.PI;
  for (const tx of [map, rmap]) {
    tx.wrapS = tx.wrapT = THREE.RepeatWrapping;
    tx.repeat.set(rep, rep);
    tx.center.set(0.5, 0.5);
    tx.offset.copy(off);
    tx.rotation = rot;
  }
  return new THREE.MeshStandardMaterial({
    color: new THREE.Color(hex),
    roughness: rough,
    metalness: 0.0,
    map,
    roughnessMap: rmap,
    envMapIntensity: 0.42
  });
}

const weaverMats = [makeMat(0xd6a86a, 0.72), makeMat(0xc99a5c, 0.74), makeMat(0xe0b579, 0.70), makeMat(0xcb9f66, 0.73), makeMat(0xd2a463, 0.72)];
const stakeMats  = [makeMat(0xb98a50, 0.77), makeMat(0xc2945a, 0.75), makeMat(0xad7f48, 0.79)];
const baseMat     = makeMat(0xb2894f, 0.79);
const rimMat      = makeMat(0xc79a5e, 0.72);
const rimWrapMat  = makeMat(0x9c6f3e, 0.72);
const handleMat   = makeMat(0xb07c42, 0.74);
const handleWrapMat = makeMat(0x8f6535, 0.72);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

/* ------------------------------------------------------------------ *
 *  Basket group + helpers
 * ------------------------------------------------------------------ */
const basket = new THREE.Group();
scene.add(basket);

function addTube(curve, closed, seg, rad, radial, mat) {
  const geo = new THREE.TubeGeometry(curve, seg, rad, radial, closed);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  basket.add(m);
  return m;
}

// A thin fibre helically wrapped around a core curve (for rim & handles)
function addWrap(curve, closed, coreR, wrapR, turns, mat) {
  const segs = Math.max(140, Math.floor(turns * 16));
  const fr = curve.computeFrenetFrames(segs, closed);
  const pts = [];
  const count = closed ? segs : segs + 1;
  for (let i = 0; i < count; i++) {
    const t = i / segs;
    const p = curve.getPointAt(Math.min(t, 1)).clone();
    const n = fr.normals[Math.min(i, fr.normals.length - 1)];
    const b = fr.binormals[Math.min(i, fr.binormals.length - 1)];
    const a = t * turns * Math.PI * 2;
    const off = n.clone().multiplyScalar(Math.cos(a) * coreR)
      .add(b.clone().multiplyScalar(Math.sin(a) * coreR));
    pts.push(p.add(off));
  }
  const wc = new THREE.CatmullRomCurve3(pts, closed, 'centripetal', 0.5);
  addTube(wc, closed, segs, wrapR, 5, mat);
}

/* ------------------------------------------------------------------ *
 *  Profile of the basket wall (radius as a function of height)
 * ------------------------------------------------------------------ */
const knots = [
  new THREE.Vector3(0.061, 0.000, 0),
  new THREE.Vector3(0.083, 0.013, 0),
  new THREE.Vector3(0.104, 0.055, 0),
  new THREE.Vector3(0.118, 0.106, 0),
  new THREE.Vector3(0.116, 0.152, 0),
  new THREE.Vector3(0.107, 0.200, 0)
];
const profileCurve = new THREE.CatmullRomCurve3(knots, false, 'catmullrom', 0.5);
const PROF = profileCurve.getPoints(260);
const Y_MIN = PROF[0].y, Y_MAX = PROF[PROF.length - 1].y;

function rAtY(y) {
  if (y <= PROF[0].y) return PROF[0].x;
  if (y >= PROF[PROF.length - 1].y) return PROF[PROF.length - 1].x;
  for (let i = 0; i < PROF.length - 1; i++) {
    const a = PROF[i], b = PROF[i + 1];
    if (y >= a.y && y <= b.y) {
      const f = (y - a.y) / ((b.y - a.y) || 1e-9);
      return a.x + (b.x - a.x) * f;
    }
  }
  return PROF[PROF.length - 1].x;
}

// smooth pseudo-noise for organic irregularity
const sn = (x) => 0.5 * Math.sin(x) + 0.3 * Math.sin(2.3 * x + 1.1) + 0.2 * Math.sin(4.7 * x + 2.7);

/* ------------------------------------------------------------------ *
 *  1) Vertical stakes (spokes)
 * ------------------------------------------------------------------ */
const N = 24;                // number of stakes (must be even for over/under)
const STAKE_R = 0.0046;
for (let k = 0; k < N; k++) {
  const th = (k / N) * Math.PI * 2;
  const ct = Math.cos(th), st = Math.sin(th);
  const pts = [];
  const vseg = 60;
  for (let j = 0; j <= vseg; j++) {
    const yy = THREE.MathUtils.lerp(0.004, 0.196, j / vseg);
    const rr = rAtY(yy);
    pts.push(new THREE.Vector3(rr * ct, yy, rr * st));
  }
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
  addTube(curve, false, vseg, STAKE_R, 6, pick(stakeMats));
}

/* ------------------------------------------------------------------ *
 *  2) Horizontal weavers (over-under woven bands)
 * ------------------------------------------------------------------ */
const ROWS = 16;
const AMP = 0.0106;          // radial over/under amplitude
const WEAVER_R = 0.0055;
const Y0 = 0.014, Y1 = 0.190;
const RING_SEG = 240;
for (let r = 0; r < ROWS; r++) {
  const t = r / (ROWS - 1);
  const yc = THREE.MathUtils.lerp(Y0, Y1, t);
  const Rc = rAtY(yc);
  const phase = (r % 2) * Math.PI;    // alternate rows -> checkerboard weave
  const pts = [];
  for (let i = 0; i < RING_SEG; i++) {
    const th = (i / RING_SEG) * Math.PI * 2;
    const w = Math.cos((N / 2) * th + phase);
    const rr = Rc + AMP * w;
    const yy = yc + 0.0009 * w;        // tiny vertical dive for 3D feel
    pts.push(new THREE.Vector3(rr * Math.cos(th), yy, rr * Math.sin(th)));
  }
  const curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal', 0.5);
  addTube(curve, true, RING_SEG, WEAVER_R, 8, pick(weaverMats));
}

/* ------------------------------------------------------------------ *
 *  3) Coiled woven base
 * ------------------------------------------------------------------ */
(function buildBase() {
  const turns = 5.2;
  const totalA = turns * Math.PI * 2;
  const outR = rAtY(0.008) - 0.004;
  const segs = 460;
  const pts = [];
  for (let i = 0; i <= segs; i++) {
    const tt = i / segs;
    const ang = tt * totalA;
    const rr = 0.006 + tt * (outR - 0.006);
    const yy = 0.004 + 0.007 * Math.pow(tt, 1.5);   // gentle rise toward the wall
    pts.push(new THREE.Vector3(rr * Math.cos(ang), yy, rr * Math.sin(ang)));
  }
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
  addTube(curve, false, segs, 0.0058, 6, baseMat);
})();

/* ------------------------------------------------------------------ *
 *  4) Slightly irregular rolled rim (bound with a wrap)
 * ------------------------------------------------------------------ */
(function buildRim() {
  const yRim = 0.196;
  const Rrim = rAtY(0.193) + 0.0035;
  const seg = 280;
  const pts = [];
  for (let i = 0; i < seg; i++) {
    const th = (i / seg) * Math.PI * 2;
    const rr = Rrim + 0.0032 * sn(th * 2.0) + 0.0015 * sn(th * 5.0 + 1.7);
    const yy = yRim + 0.0022 * sn(th * 3.0 + 4.2);
    pts.push(new THREE.Vector3(rr * Math.cos(th), yy, rr * Math.sin(th)));
  }
  const curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal', 0.5);
  addTube(curve, true, seg, 0.0096, 12, rimMat);
  addWrap(curve, true, 0.0096, 0.0022, 58, rimWrapMat);   // binding wrap
})();

/* ------------------------------------------------------------------ *
 *  5) Two woven side handles (attachment points) with wrapped fibre
 * ------------------------------------------------------------------ */
function buildHandle(theta) {
  const ux = Math.cos(theta), uz = Math.sin(theta);
  const yBottom = 0.112, yTop = 0.184;
  const ymid = (yBottom + yTop) / 2, half = (yTop - yBottom) / 2;
  const bulge = 0.052;
  const seg = 52;
  const pts = [];
  for (let i = 0; i <= seg; i++) {
    const s = i / seg;
    const phi = Math.PI * s;                 // 0..PI, top -> bottom
    const yy = ymid + half * Math.cos(phi);
    const radialOut = bulge * Math.sin(phi);
    const Rwall = rAtY(THREE.MathUtils.clamp(yy, Y_MIN, Y_MAX));
    const rr = Rwall - 0.004 + radialOut;     // ends tuck into the wall
    pts.push(new THREE.Vector3(rr * ux, yy, rr * uz));
  }
  const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5);
  addTube(curve, false, seg, 0.0072, 8, handleMat);
  addWrap(curve, false, 0.0072, 0.0018, 20, handleWrapMat);
}
buildHandle(0);
buildHandle(Math.PI);

/* ------------------------------------------------------------------ *
 *  Center / seat the basket on the floor
 * ------------------------------------------------------------------ */
const bbox = new THREE.Box3().setFromObject(basket);
const center = bbox.getCenter(new THREE.Vector3());
basket.position.x -= center.x;
basket.position.z -= center.z;
basket.position.y -= bbox.min.y;

/* ------------------------------------------------------------------ *
 *  Resize + render loop
 * ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
