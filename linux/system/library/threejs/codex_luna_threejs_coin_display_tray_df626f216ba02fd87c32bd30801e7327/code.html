<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ancient Coin Display</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #10100f;
    }
    body {
      font-family: Georgia, serif;
    }
    canvas {
      display: block;
    }
    .caption {
      position: fixed;
      left: 28px;
      bottom: 24px;
      color: rgba(238, 226, 197, 0.72);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 11px;
      pointer-events: none;
      text-shadow: 0 1px 4px #000;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="caption">Antiquities Collection · Roman &amp; Hellenistic Coinage</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x10100f);
    scene.fog = new THREE.Fog(0x10100f, 10, 19);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(7.8, 7.4, 8.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.38;
    controls.minDistance = 6;
    controls.maxDistance = 15;
    controls.maxPolarAngle = Math.PI * 0.47;
    controls.target.set(0, 0.25, 0);

    const warmMetal = new THREE.MeshStandardMaterial({
      color: 0x756039, metalness: 0.72, roughness: 0.32
    });
    const darkMetal = new THREE.MeshStandardMaterial({
      color: 0x29251d, metalness: 0.35, roughness: 0.7
    });
    const felt = new THREE.MeshStandardMaterial({
      color: 0x26352d, roughness: 0.96, metalness: 0.02
    });
    const pocketMat = new THREE.MeshStandardMaterial({
      color: 0x121915, roughness: 1.0, metalness: 0.02
    });

    function roundedRectShape(w, h, r) {
      const s = new THREE.Shape();
      s.moveTo(-w / 2 + r, -h / 2);
      s.lineTo(w / 2 - r, -h / 2);
      s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
      s.lineTo(w / 2, h / 2 - r);
      s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
      s.lineTo(-w / 2 + r, h / 2);
      s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
      s.lineTo(-w / 2, -h / 2 + r);
      s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
      return s;
    }

    function extrudedShape(shape, depth, material, bevel = 0) {
      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth,
        bevelEnabled: bevel > 0,
        bevelSegments: 2,
        bevelSize: bevel,
        bevelThickness: bevel
      });
      geometry.center();
      const mesh = new THREE.Mesh(geometry, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    const tray = extrudedShape(roundedRectShape(10.4, 6.8, 0.42), 0.58, warmMetal, 0.14);
    tray.rotation.x = -Math.PI / 2;
    tray.position.y = 0.16;
    scene.add(tray);

    const innerTray = extrudedShape(roundedRectShape(9.72, 6.1, 0.32), 0.075, darkMetal, 0.06);
    innerTray.rotation.x = -Math.PI / 2;
    innerTray.position.y = 0.47;
    scene.add(innerTray);

    const feltPanel = extrudedShape(roundedRectShape(9.32, 5.7, 0.27), 0.045, felt, 0.04);
    feltPanel.rotation.x = -Math.PI / 2;
    feltPanel.position.y = 0.54;
    scene.add(feltPanel);

    const coinMaterials = [
      new THREE.MeshStandardMaterial({ color: 0x8b713e, metalness: 0.82, roughness: 0.34 }),
      new THREE.MeshStandardMaterial({ color: 0x927946, metalness: 0.78, roughness: 0.39 }),
      new THREE.MeshStandardMaterial({ color: 0x6f613e, metalness: 0.74, roughness: 0.48 }),
      new THREE.MeshStandardMaterial({ color: 0x9b8150, metalness: 0.8, roughness: 0.3 }),
      new THREE.MeshStandardMaterial({ color: 0x77613b, metalness: 0.8, roughness: 0.41 })
    ];
    const reliefMaterials = coinMaterials.map(m => new THREE.MeshStandardMaterial({
      color: new THREE.Color(m.color).multiplyScalar(1.16),
      metalness: 0.78,
      roughness: 0.3
    }));

    function addReliefShape(group, shape, material, scale = 1) {
      const depth = 0.045;
      const mesh = extrudedShape(shape, depth, material, 0.008);
      mesh.rotation.x = Math.PI / 2;
      mesh.position.set(0, 0.091, -depth / 2);
      mesh.scale.set(scale, scale, scale);
      group.add(mesh);
      return mesh;
    }

    function starShape(points, outer, inner) {
      const s = new THREE.Shape();
      for (let i = 0; i < points * 2; i++) {
        const a = i / (points * 2) * Math.PI * 2 - Math.PI / 2;
        const r = i % 2 === 0 ? outer : inner;
        const x = Math.cos(a) * r;
        const y = Math.sin(a) * r;
        if (i === 0) s.moveTo(x, y);
        else s.lineTo(x, y);
      }
      s.closePath();
      return s;
    }

    function bustShape() {
      const s = new THREE.Shape();
      s.moveTo(-0.18, -0.31);
      s.lineTo(-0.06, -0.19);
      s.lineTo(0.03, -0.12);
      s.lineTo(0.09, -0.02);
      s.lineTo(0.06, 0.08);
      s.lineTo(0.17, 0.14);
      s.lineTo(0.08, 0.19);
      s.lineTo(0.03, 0.31);
      s.lineTo(-0.15, 0.26);
      s.lineTo(-0.23, 0.14);
      s.lineTo(-0.19, 0.02);
      s.lineTo(-0.28, -0.10);
      s.closePath();
      return s;
    }

    function coin(x, z, radius, type, materialIndex) {
      const group = new THREE.Group();
      group.position.set(x, 0.65, z);

      const coinMat = coinMaterials[materialIndex % coinMaterials.length];
      const reliefMat = reliefMaterials[materialIndex % reliefMaterials.length];

      const disc = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, 0.15, 64), coinMat);
      disc.castShadow = true;
      disc.receiveShadow = true;
      group.add(disc);

      const rim = new THREE.Mesh(new THREE.TorusGeometry(radius * 0.86, radius * 0.075, 10, 64), reliefMat);
      rim.rotation.x = Math.PI / 2;
      rim.position.y = 0.087;
      rim.castShadow = true;
      group.add(rim);

      const innerRim = new THREE.Mesh(
        new THREE.TorusGeometry(radius * 0.69, radius * 0.027, 8, 48),
        reliefMat
      );
      innerRim.rotation.x = Math.PI / 2;
      innerRim.position.y = 0.09;
      group.add(innerRim);

      if (type === "bust") {
        addReliefShape(group, bustShape(), reliefMat, radius * 1.9);
        for (let i = 0; i < 5; i++) {
          const hair = new THREE.Mesh(
            new THREE.CylinderGeometry(radius * 0.027, radius * 0.027, radius * 0.035, 10),
            reliefMat
          );
          hair.position.set(
            -radius * 0.35 + i * radius * 0.1,
            0.103,
            radius * 0.2 - Math.abs(i - 2) * radius * 0.035
          );
          hair.rotation.z = -0.4 + i * 0.18;
          group.add(hair);
        }
      } else if (type === "star") {
        addReliefShape(group, starShape(8, radius * 0.48, radius * 0.18), reliefMat);
        for (let i = 0; i < 8; i++) {
          const a = i / 8 * Math.PI * 2;
          const mark = new THREE.Mesh(
            new THREE.BoxGeometry(radius * 0.045, radius * 0.26, radius * 0.04),
            reliefMat
          );
          mark.position.set(Math.cos(a) * radius * 0.53, 0.101, Math.sin(a) * radius * 0.53);
          mark.rotation.y = -a;
          group.add(mark);
        }
      } else if (type === "wreath") {
        for (let i = 0; i < 14; i++) {
          const a = i / 14 * Math.PI * 2;
          const leaf = new THREE.Mesh(
            new THREE.SphereGeometry(radius * 0.115, 10, 6),
            reliefMat
          );
          leaf.scale.set(1.5, 0.3, 0.62);
          leaf.position.set(Math.cos(a) * radius * 0.47, 0.103, Math.sin(a) * radius * 0.47);
          leaf.rotation.y = -a + Math.PI / 2;
          group.add(leaf);
        }
        const center = new THREE.Mesh(
          new THREE.CylinderGeometry(radius * 0.28, radius * 0.28, 0.045, 24),
          reliefMat
        );
        center.position.y = 0.105;
        group.add(center);
      } else if (type === "shield") {
        const shield = new THREE.Mesh(
          new THREE.SphereGeometry(radius * 0.42, 24, 16),
          reliefMat
        );
        shield.scale.set(0.72, 0.11, 1);
        shield.position.y = 0.105;
        group.add(shield);

        for (let i = 0; i < 6; i++) {
          const a = i / 6 * Math.PI * 2;
          const spoke = new THREE.Mesh(
            new THREE.BoxGeometry(radius * 0.035, 0.025, radius * 0.33),
            reliefMat
          );
          spoke.position.set(Math.cos(a) * radius * 0.12, 0.137, Math.sin(a) * radius * 0.12);
          spoke.rotation.y = -a;
          group.add(spoke);
        }
      } else {
        const animal = new THREE.Mesh(
          new THREE.SphereGeometry(radius * 0.3, 18, 10),
          reliefMat
        );
        animal.scale.set(1.45, 0.14, 0.5);
        animal.position.set(0, 0.108, -radius * 0.04);
        group.add(animal);

        const head = new THREE.Mesh(
          new THREE.SphereGeometry(radius * 0.16, 16, 10),
          reliefMat
        );
        head.scale.set(1, 0.2, 0.85);
        head.position.set(radius * 0.3, 0.115, radius * 0.08);
        group.add(head);

        const tail = new THREE.Mesh(
          new THREE.TorusGeometry(radius * 0.17, radius * 0.035, 7, 16, Math.PI * 1.4),
          reliefMat
        );
        tail.rotation.x = Math.PI / 2;
        tail.position.set(-radius * 0.31, 0.115, -radius * 0.02);
        group.add(tail);
      }

      const shadowPocket = new THREE.Mesh(
        new THREE.CylinderGeometry(radius * 1.055, radius * 1.055, 0.035, 64),
        pocketMat
      );
      shadowPocket.position.set(x, 0.59, z);
      shadowPocket.receiveShadow = true;
      scene.add(shadowPocket);

      const pocketRing = new THREE.Mesh(
        new THREE.TorusGeometry(radius * 1.08, 0.045, 8, 64),
        darkMetal
      );
      pocketRing.rotation.x = Math.PI / 2;
      pocketRing.position.set(x, 0.615, z);
      scene.add(pocketRing);

      group.rotation.y = (materialIndex * 0.63) % (Math.PI * 2);
      scene.add(group);
    }

    coin(-3.1, 1.72, 0.82, "bust", 0);
    coin(-1.04, 1.78, 0.63, "star", 2);
    coin(1.02, 1.72, 0.91, "wreath", 1);
    coin(3.16, 1.73, 0.68, "shield", 3);
    coin(-3.05, -0.02, 0.58, "star", 4);
    coin(-1.2, -0.05, 0.86, "animal", 2);
    coin(1.03, -0.03, 0.68, "bust", 3);
    coin(3.12, -0.03, 0.88, "wreath", 0);
    coin(-2.2, -1.95, 0.76, "shield", 1);
    coin(0.02, -1.93, 0.56, "animal", 4);
    coin(2.08, -1.94, 0.73, "bust", 2);

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(24, 96),
      new THREE.MeshStandardMaterial({ color: 0x0d0e0d, roughness: 1 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.19;
    floor.receiveShadow = true;
    scene.add(floor);

    const keyLight = new THREE.DirectionalLight(0xffe2ad, 4.3);
    keyLight.position.set(-5, 10, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -8;
    keyLight.shadow.camera.right = 8;
    keyLight.shadow.camera.top = 8;
    keyLight.shadow.camera.bottom = -8;
    keyLight.shadow.bias = -0.0004;
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x9aaec2, 1.25);
    fillLight.position.set(6, 5, -5);
    scene.add(fillLight);

    const rimLight = new THREE.PointLight(0xb87333, 18, 12, 2);
    rimLight.position.set(-3, 4, -4);
    scene.add(rimLight);

    scene.add(new THREE.HemisphereLight(0x718277, 0x17130f, 1.4));

    const backdrop = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({ color: 0x10100f, roughness: 1 })
    );
    backdrop.rotation.x = -Math.PI / 2;
    backdrop.position.y = -0.2;
    backdrop.receiveShadow = true;
    scene.add(backdrop);

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      rimLight.intensity = 17 + Math.sin(t * 0.7) * 1.2;
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
