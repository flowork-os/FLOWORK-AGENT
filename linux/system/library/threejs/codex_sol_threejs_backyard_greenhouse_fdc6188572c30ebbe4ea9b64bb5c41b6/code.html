<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backyard Greenhouse</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #dce8e8;
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; }
    .caption {
      position: fixed;
      left: 24px;
      bottom: 22px;
      color: rgba(26, 42, 38, 0.76);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 11px;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="caption">Backyard greenhouse · drag to orbit</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdce8e8);
    scene.fog = new THREE.Fog(0xdce8e8, 15, 34);

    const camera = new THREE.PerspectiveCamera(
      38,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(9.2, 6.2, 10.4);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.45, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.42;
    controls.minDistance = 6;
    controls.maxDistance = 22;
    controls.maxPolarAngle = Math.PI * 0.48;

    const hemi = new THREE.HemisphereLight(0xeaf7ff, 0x59664b, 2.0);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff0d5, 3.4);
    sun.position.set(-7, 11, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -10;
    sun.shadow.camera.right = 10;
    sun.shadow.camera.top = 10;
    sun.shadow.camera.bottom = -10;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 30;
    sun.shadow.bias = -0.00035;
    sun.shadow.normalBias = 0.025;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xbfd8e1, 0.65);
    fill.position.set(8, 5, -7);
    scene.add(fill);

    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x71815f,
      roughness: 0.96
    });
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(18, 96),
      groundMaterial
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const greenhouse = new THREE.Group();
    greenhouse.rotation.y = -0.045;
    scene.add(greenhouse);

    const W = 4.2;
    const D = 6.0;
    const wallH = 2.35;
    const ridgeH = 3.45;
    const halfW = W / 2;
    const halfD = D / 2;
    const roofSlope = Math.hypot(halfW, ridgeH - wallH);

    const aluminum = new THREE.MeshStandardMaterial({
      color: 0xb8bec0,
      metalness: 0.82,
      roughness: 0.25
    });
    const aluminumDark = new THREE.MeshStandardMaterial({
      color: 0x7c8485,
      metalness: 0.75,
      roughness: 0.32
    });
    const glass = new THREE.MeshPhysicalMaterial({
      color: 0xb8d9d6,
      transparent: true,
      opacity: 0.25,
      roughness: 0.18,
      metalness: 0,
      transmission: 0.18,
      thickness: 0.05,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const glassRoof = glass.clone();
    glassRoof.color.set(0xc5e1df);
    glassRoof.opacity = 0.21;
    const glassEdge = new THREE.MeshStandardMaterial({
      color: 0x7fa5a1,
      transparent: true,
      opacity: 0.22,
      roughness: 0.5,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    const wood = new THREE.MeshStandardMaterial({
      color: 0x564332,
      roughness: 0.88
    });
    const woodTop = new THREE.MeshStandardMaterial({
      color: 0x6f5640,
      roughness: 0.82
    });
    const darkMetal = new THREE.MeshStandardMaterial({
      color: 0x303536,
      metalness: 0.65,
      roughness: 0.35
    });
    const terracotta = new THREE.MeshStandardMaterial({
      color: 0x96503a,
      roughness: 0.84
    });
    const soil = new THREE.MeshStandardMaterial({
      color: 0x2d251e,
      roughness: 1
    });
    const leafMat = new THREE.MeshStandardMaterial({
      color: 0x476847,
      roughness: 0.9
    });

    function box(w, h, d, material, x, y, z, parent = greenhouse) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function beamBetween(a, b, thickness = 0.075, material = aluminum, parent = greenhouse) {
      const start = new THREE.Vector3(...a);
      const end = new THREE.Vector3(...b);
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(thickness, length, thickness),
        material
      );
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function quad(points, material, parent = greenhouse) {
      const positions = new Float32Array([
        ...points[0], ...points[1], ...points[2],
        ...points[0], ...points[2], ...points[3]
      ]);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.computeVertexNormals();
      const mesh = new THREE.Mesh(geometry, material);
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function triangle(points, material, parent = greenhouse) {
      const positions = new Float32Array([
        ...points[0], ...points[1], ...points[2]
      ]);
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.computeVertexNormals();
      const mesh = new THREE.Mesh(geometry, material);
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    // Raised perimeter sill and foundation curb.
    const curbMat = new THREE.MeshStandardMaterial({
      color: 0x8a8b80,
      roughness: 0.92
    });
    box(W + 0.28, 0.18, 0.24, curbMat, 0, 0.09, -halfD);
    box(W + 0.28, 0.18, 0.24, curbMat, 0, 0.09, halfD);
    box(0.24, 0.18, D - 0.24, curbMat, -halfW, 0.09, 0);
    box(0.24, 0.18, D - 0.24, curbMat, halfW, 0.09, 0);

    const slab = box(W - 0.2, 0.08, D - 0.2, curbMat, 0, 0.07, 0);
    slab.material = curbMat.clone();
    slab.material.color.set(0x9b9a8e);

    // Wall glazing in separate bays.
    const bayZ = [-3, -1.5, 0, 1.5, 3];
    for (let i = 0; i < bayZ.length - 1; i++) {
      const z0 = bayZ[i] + 0.045;
      const z1 = bayZ[i + 1] - 0.045;
      quad([
        [-halfW - 0.012, 0.2, z0],
        [-halfW - 0.012, 0.2, z1],
        [-halfW - 0.012, wallH - 0.04, z1],
        [-halfW - 0.012, wallH - 0.04, z0]
      ], glass);
      quad([
        [halfW + 0.012, 0.2, z1],
        [halfW + 0.012, 0.2, z0],
        [halfW + 0.012, wallH - 0.04, z0],
        [halfW + 0.012, wallH - 0.04, z1]
      ], glass);
    }

    // Roof glazing, split into four long panels for visible seams.
    const roofZ = [-3, -1.5, 0, 1.5, 3];
    for (let i = 0; i < roofZ.length - 1; i++) {
      const z0 = roofZ[i] + 0.035;
      const z1 = roofZ[i + 1] - 0.035;
      quad([
        [-halfW, wallH + 0.018, z0],
        [0, ridgeH + 0.018, z0],
        [0, ridgeH + 0.018, z1],
        [-halfW, wallH + 0.018, z1]
      ], glassRoof);
      quad([
        [0, ridgeH + 0.018, z0],
        [halfW, wallH + 0.018, z0],
        [halfW, wallH + 0.018, z1],
        [0, ridgeH + 0.018, z1]
      ], glassRoof);
    }

    // Rear glazing and gable.
    quad([
      [-halfW + 0.05, 0.2, -halfD - 0.012],
      [halfW - 0.05, 0.2, -halfD - 0.012],
      [halfW - 0.05, wallH - 0.04, -halfD - 0.012],
      [-halfW + 0.05, wallH - 0.04, -halfD - 0.012]
    ], glass);
    triangle([
      [-halfW + 0.05, wallH + 0.015, -halfD - 0.012],
      [halfW - 0.05, wallH + 0.015, -halfD - 0.012],
      [0, ridgeH - 0.035, -halfD - 0.012]
    ], glass);

    // Front glazing around the doorway.
    const doorW = 1.18;
    const doorH = 2.16;
    const doorLeft = -doorW / 2;
    const doorRight = doorW / 2;
    quad([
      [-halfW + 0.05, 0.2, halfD + 0.012],
      [doorLeft - 0.06, 0.2, halfD + 0.012],
      [doorLeft - 0.06, wallH - 0.04, halfD + 0.012],
      [-halfW + 0.05, wallH - 0.04, halfD + 0.012]
    ], glass);
    quad([
      [doorRight + 0.06, 0.2, halfD + 0.012],
      [halfW - 0.05, 0.2, halfD + 0.012],
      [halfW - 0.05, wallH - 0.04, halfD + 0.012],
      [doorRight + 0.06, wallH - 0.04, halfD + 0.012]
    ], glass);
    quad([
      [doorLeft, doorH + 0.05, halfD + 0.012],
      [doorRight, doorH + 0.05, halfD + 0.012],
      [doorRight, wallH - 0.035, halfD + 0.012],
      [doorLeft, wallH - 0.035, halfD + 0.012]
    ], glass);
    triangle([
      [-halfW + 0.05, wallH + 0.015, halfD + 0.012],
      [halfW - 0.05, wallH + 0.015, halfD + 0.012],
      [0, ridgeH - 0.035, halfD + 0.012]
    ], glass);

    // Primary aluminum skeleton.
    const frameT = 0.085;
    for (const x of [-halfW, halfW]) {
      for (const z of [-halfD, -1.5, 0, 1.5, halfD]) {
        beamBetween([x, 0.17, z], [x, wallH, z], frameT);
      }
    }

    for (const z of [-halfD, -1.5, 0, 1.5, halfD]) {
      beamBetween([-halfW, wallH, z], [0, ridgeH, z], frameT);
      beamBetween([0, ridgeH, z], [halfW, wallH, z], frameT);
    }

    beamBetween([-halfW, 0.18, -halfD], [-halfW, 0.18, halfD], frameT);
    beamBetween([halfW, 0.18, -halfD], [halfW, 0.18, halfD], frameT);
    beamBetween([-halfW, wallH, -halfD], [-halfW, wallH, halfD], frameT);
    beamBetween([halfW, wallH, -halfD], [halfW, wallH, halfD], frameT);
    beamBetween([0, ridgeH, -halfD], [0, ridgeH, halfD], 0.105);
    beamBetween([-halfW, wallH, -halfD], [halfW, wallH, -halfD], frameT);
    beamBetween([-halfW, wallH, halfD], [halfW, wallH, halfD], frameT);

    // Horizontal wall rails and roof panel rails.
    for (const x of [-halfW, halfW]) {
      beamBetween([x, 1.22, -halfD], [x, 1.22, halfD], 0.055, aluminumDark);
    }
    for (const side of [-1, 1]) {
      const x = side * halfW * 0.5;
      const y = wallH + (ridgeH - wallH) * 0.5;
      beamBetween([x, y, -halfD], [x, y, halfD], 0.052, aluminumDark);
    }

    // End-wall uprights and doorway jambs.
    for (const z of [-halfD, halfD]) {
      beamBetween([0, wallH, z], [0, ridgeH, z], 0.065);
      beamBetween([-halfW, 0.18, z], [-halfW, wallH, z], frameT);
      beamBetween([halfW, 0.18, z], [halfW, wallH, z], frameT);
    }
    beamBetween([doorLeft - 0.055, 0.18, halfD], [doorLeft - 0.055, wallH, halfD], frameT);
    beamBetween([doorRight + 0.055, 0.18, halfD], [doorRight + 0.055, wallH, halfD], frameT);
    beamBetween([doorLeft - 0.055, doorH + 0.05, halfD], [doorRight + 0.055, doorH + 0.05, halfD], frameT);

    // Hinged, slightly open door.
    const doorPivot = new THREE.Group();
    doorPivot.position.set(doorLeft, 0.18, halfD + 0.055);
    doorPivot.rotation.y = -0.20;
    greenhouse.add(doorPivot);

    function doorBeam(x, y, w, h, d = 0.065) {
      return box(w, h, d, aluminumDark, x, y, 0, doorPivot);
    }

    const localDoorH = doorH - 0.18;
    doorBeam(doorW / 2, 0.045, doorW, 0.075);
    doorBeam(doorW / 2, localDoorH, doorW, 0.075);
    doorBeam(0.04, localDoorH / 2, 0.075, localDoorH);
    doorBeam(doorW - 0.04, localDoorH / 2, 0.075, localDoorH);
    doorBeam(doorW / 2, localDoorH * 0.54, doorW - 0.08, 0.055);

    const doorGlass = new THREE.Mesh(
      new THREE.PlaneGeometry(doorW - 0.14, localDoorH - 0.14),
      glass.clone()
    );
    doorGlass.material.opacity = 0.32;
    doorGlass.position.set(doorW / 2, localDoorH / 2, -0.012);
    doorGlass.receiveShadow = true;
    doorPivot.add(doorGlass);

    const handle = new THREE.Mesh(
      new THREE.CylinderGeometry(0.025, 0.025, 0.30, 16),
      darkMetal
    );
    handle.position.set(doorW - 0.16, localDoorH * 0.53, 0.095);
    handle.castShadow = true;
    doorPivot.add(handle);

    for (const y of [localDoorH * 0.53 - 0.12, localDoorH * 0.53 + 0.12]) {
      const mount = new THREE.Mesh(
        new THREE.CylinderGeometry(0.025, 0.025, 0.105, 14),
        darkMetal
      );
      mount.rotation.x = Math.PI / 2;
      mount.position.set(doorW - 0.16, y, 0.048);
      mount.castShadow = true;
      doorPivot.add(mount);
    }

    // Hinge plates.
    for (const y of [0.42, 1.55]) {
      const hinge = box(0.11, 0.14, 0.055, darkMetal, 0.045, y, -0.055, doorPivot);
      hinge.castShadow = true;
    }

    // Interior center aisle.
    const aisleMat = new THREE.MeshStandardMaterial({
      color: 0x827b69,
      roughness: 1
    });
    box(0.95, 0.025, D - 0.45, aisleMat, 0, 0.13, -0.05);

    // Potting benches along both sides.
    function makeBench(x, z, length, mirrored = false) {
      const group = new THREE.Group();
      group.position.set(x, 0.14, z);
      greenhouse.add(group);

      box(0.84, 0.10, length, woodTop, 0, 0.86, 0, group);
      box(0.72, 0.07, length - 0.12, wood, 0, 0.43, 0, group);

      for (const dz of [-length / 2 + 0.16, length / 2 - 0.16]) {
        for (const dx of [-0.31, 0.31]) {
          box(0.075, 0.82, 0.075, wood, dx, 0.43, dz, group);
        }
      }

      const backX = mirrored ? 0.38 : -0.38;
      box(0.055, 0.55, length, wood, backX, 1.10, 0, group);

      for (let i = 0; i < 4; i++) {
        const pz = -length * 0.36 + i * length * 0.24;
        const radius = i % 2 === 0 ? 0.15 : 0.12;
        const pot = new THREE.Mesh(
          new THREE.CylinderGeometry(radius * 0.78, radius, 0.24, 16),
          terracotta
        );
        pot.position.set((i % 2 - 0.5) * 0.24, 1.03, pz);
        pot.castShadow = true;
        group.add(pot);

        const dirt = new THREE.Mesh(
          new THREE.CylinderGeometry(radius * 0.76, radius * 0.76, 0.018, 16),
          soil
        );
        dirt.position.set(pot.position.x, 1.155, pz);
        group.add(dirt);

        if (i !== 1) {
          const stem = new THREE.Mesh(
            new THREE.CylinderGeometry(0.012, 0.014, 0.30, 8),
            leafMat
          );
          stem.position.set(pot.position.x, 1.30, pz);
          group.add(stem);

          for (const offset of [-0.09, 0.09]) {
            const leaf = new THREE.Mesh(
              new THREE.SphereGeometry(0.09, 12, 8),
              leafMat
            );
            leaf.scale.set(1.25, 0.42, 0.72);
            leaf.position.set(pot.position.x + offset, 1.34 + Math.abs(offset) * 0.45, pz);
            leaf.rotation.z = offset > 0 ? -0.4 : 0.4;
            group.add(leaf);
          }
        }
      }
    }

    makeBench(-1.48, -0.28, 4.75, false);
    makeBench(1.48, -0.55, 4.15, true);

    // Watering can silhouette on a lower shelf.
    const canGroup = new THREE.Group();
    canGroup.position.set(1.48, 0.67, 1.35);
    greenhouse.add(canGroup);
    const canBody = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.19, 0.28, 16),
      darkMetal
    );
    canBody.position.y = 0.03;
    canBody.castShadow = true;
    canGroup.add(canBody);
    const spout = new THREE.Mesh(
      new THREE.CylinderGeometry(0.035, 0.075, 0.48, 12),
      darkMetal
    );
    spout.rotation.z = Math.PI * 0.39;
    spout.position.set(-0.25, 0.13, 0);
    spout.castShadow = true;
    canGroup.add(spout);

    // Roof vent panel and lifting arm.
    const vent = new THREE.Group();
    vent.position.set(0.76, 2.98, -0.72);
    vent.rotation.z = -0.485;
    vent.rotation.x = -0.10;
    greenhouse.add(vent);
    box(1.32, 0.045, 1.02, aluminumDark, 0, 0, 0, vent);
    const ventGlass = new THREE.Mesh(
      new THREE.PlaneGeometry(1.20, 0.90),
      glass.clone()
    );
    ventGlass.material.opacity = 0.3;
    ventGlass.rotation.x = -Math.PI / 2;
    ventGlass.position.y = 0.028;
    vent.add(ventGlass);

    beamBetween(
      [0.72, 2.74, -0.40],
      [1.02, 3.08, -0.35],
      0.025,
      darkMetal
    );

    // Path outside the door.
    const pathMat = new THREE.MeshStandardMaterial({
      color: 0xa39982,
      roughness: 1
    });
    for (let i = 0; i < 7; i++) {
      const stone = new THREE.Mesh(
        new THREE.CylinderGeometry(
          0.48 + (i % 3) * 0.035,
          0.52,
          0.055,
          7
        ),
        pathMat
      );
      stone.position.set(
        Math.sin(i * 2.1) * 0.09,
        0.035,
        halfD + 0.52 + i * 0.62
      );
      stone.rotation.y = i * 0.71;
      stone.scale.z = 0.72;
      stone.receiveShadow = true;
      scene.add(stone);
    }

    // Simple timber fence to establish the backyard.
    const fenceMat = new THREE.MeshStandardMaterial({
      color: 0x7c705d,
      roughness: 0.95
    });
    const fence = new THREE.Group();
    fence.position.set(0, 0, -7.4);
    scene.add(fence);
    for (let i = -8; i <= 8; i++) {
      const slat = new THREE.Mesh(
        new THREE.BoxGeometry(0.62, 1.55, 0.09),
        fenceMat
      );
      slat.position.set(i * 0.66, 0.78 + Math.sin(i * 1.7) * 0.025, 0);
      slat.castShadow = true;
      slat.receiveShadow = true;
      fence.add(slat);
    }
    for (const y of [0.42, 1.16]) {
      const rail = new THREE.Mesh(
        new THREE.BoxGeometry(11.4, 0.12, 0.14),
        fenceMat
      );
      rail.position.set(0, y, 0.08);
      rail.castShadow = true;
      fence.add(rail);
    }

    // Low shrubs around the perimeter.
    const shrubMat = new THREE.MeshStandardMaterial({
      color: 0x405d3b,
      roughness: 1
    });
    const shrubLight = shrubMat.clone();
    shrubLight.color.set(0x58764b);

    function shrub(x, z, scale, material) {
      const group = new THREE.Group();
      group.position.set(x, 0.22, z);
      scene.add(group);
      const lobes = [
        [0, 0.25, 0, 0.62],
        [-0.34, 0.16, 0.05, 0.46],
        [0.33, 0.18, 0.02, 0.48],
        [-0.12, 0.10, 0.28, 0.44],
        [0.14, 0.12, -0.25, 0.42]
      ];
      for (const [lx, ly, lz, radius] of lobes) {
        const mesh = new THREE.Mesh(
          new THREE.IcosahedronGeometry(radius * scale, 2),
          material
        );
        mesh.position.set(lx * scale, ly * scale, lz * scale);
        mesh.scale.y = 0.78;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        group.add(mesh);
      }
    }

    shrub(-3.6, -3.8, 1.0, shrubMat);
    shrub(3.65, -4.0, 1.15, shrubLight);
    shrub(-4.15, 0.25, 0.9, shrubLight);
    shrub(4.25, 0.65, 0.85, shrubMat);
    shrub(-3.65, 3.8, 0.75, shrubMat);

    // Small utility planter beside the greenhouse.
    const planterMat = new THREE.MeshStandardMaterial({
      color: 0x6c5038,
      roughness: 0.9
    });
    box(1.35, 0.42, 0.72, planterMat, -3.05, 0.21, 1.55, scene);
    box(1.18, 0.05, 0.56, soil, -3.05, 0.445, 1.55, scene);
    for (let i = 0; i < 5; i++) {
      const plant = new THREE.Mesh(
        new THREE.SphereGeometry(0.13, 12, 8),
        leafMat
      );
      plant.scale.set(0.75, 1.35, 0.6);
      plant.position.set(-3.48 + i * 0.215, 0.61 + (i % 2) * 0.04, 1.55);
      plant.castShadow = true;
      scene.add(plant);
    }

    // Soft shadow-catching patch under the structure.
    const shadowPatch = new THREE.Mesh(
      new THREE.PlaneGeometry(5.6, 7.3),
      new THREE.MeshBasicMaterial({
        color: 0x263222,
        transparent: true,
        opacity: 0.08,
        depthWrite: false
      })
    );
    shadowPatch.rotation.x = -Math.PI / 2;
    shadowPatch.position.set(0, 0.012, 0);
    scene.add(shadowPatch);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
