<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crystal Seahorse</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; }
  #app { position: fixed; inset: 0; }
  .caption {
    position: fixed; left: 22px; bottom: 18px;
    font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    color: rgba(226, 236, 255, 0.55);
    letter-spacing: 0.18em; text-transform: uppercase; font-size: 12px;
    user-select: none; pointer-events: none;
    text-shadow: 0 1px 12px rgba(0,0,0,0.6);
  }
  .caption small { display:block; letter-spacing:0.06em; text-transform:none; font-size:11px; color:rgba(226,236,255,0.32); margin-top:4px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="caption">Crystal Seahorse<small>leaded crystal · faceted · orbit to explore</small></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const UP = new THREE.Vector3(0, 1, 0);

/* ------------------------------------------------------------------ */
/*  Renderer                                                          */
/* ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

/* ------------------------------------------------------------------ */
/*  Scene & camera                                                    */
/* ------------------------------------------------------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d12);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(2.9, 0.55, 5.7);

/* ------------------------------------------------------------------ */
/*  Procedural studio environment (drives crystal refraction colour)  */
/* ------------------------------------------------------------------ */
function makeEnvTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const ctx = c.getContext('2d');

  const g = ctx.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0.00, '#404a60');
  g.addColorStop(0.32, '#1a1f2b');
  g.addColorStop(0.58, '#0c0f16');
  g.addColorStop(1.00, '#04050a');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 1024, 512);

  // soft horizon key band
  const hb = ctx.createLinearGradient(0, 120, 0, 250);
  hb.addColorStop(0, 'rgba(255,255,255,0)');
  hb.addColorStop(0.5, 'rgba(214,228,255,0.55)');
  hb.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hb;
  ctx.fillRect(0, 120, 1024, 130);

  // coloured glow blobs -> prismatic reflections
  const blobs = [
    ['255,61,129', 150, 150, 190],
    ['55,214,255', 520, 120, 200],
    ['255,209,102', 830, 175, 185],
    ['138,92,255', 350, 330, 210],
    ['38,255,166', 700, 350, 190],
    ['255,255,255', 512, 60, 150]
  ];
  ctx.globalCompositeOperation = 'lighter';
  for (const [rgb, x, y, r] of blobs) {
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, `rgba(${rgb},0.85)`);
    rg.addColorStop(0.5, `rgba(${rgb},0.25)`);
    rg.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, 1024, 512);
  }
  ctx.globalCompositeOperation = 'source-over';

  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const envTex = makeEnvTexture();
const envMap = pmrem.fromEquirectangular(envTex).texture;
scene.environment = envMap;
envTex.dispose();
pmrem.dispose();

/* ------------------------------------------------------------------ */
/*  Materials                                                         */
/* ------------------------------------------------------------------ */
const bodyMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0.0,
  roughness: 0.045,
  transmission: 1.0,
  ior: 1.72,
  thickness: 1.1,
  attenuationColor: new THREE.Color(0xdff1ff),
  attenuationDistance: 2.4,
  clearcoat: 1.0,
  clearcoatRoughness: 0.05,
  iridescence: 1.0,
  iridescenceIOR: 1.32,
  iridescenceThicknessRange: [120, 520],
  envMapIntensity: 1.5,
  flatShading: true,
  side: THREE.FrontSide,
  transparent: false
});

const finMat = new THREE.MeshPhysicalMaterial({
  color: 0xf2fbff,
  metalness: 0.0,
  roughness: 0.06,
  transmission: 1.0,
  ior: 1.6,
  thickness: 0.25,
  attenuationColor: new THREE.Color(0xcfe6ff),
  attenuationDistance: 1.2,
  clearcoat: 1.0,
  clearcoatRoughness: 0.06,
  iridescence: 1.0,
  iridescenceIOR: 1.3,
  iridescenceThicknessRange: [140, 480],
  envMapIntensity: 1.6,
  flatShading: true,
  side: THREE.DoubleSide,
  transparent: false
});

const eyeMat = new THREE.MeshPhysicalMaterial({
  color: 0xbfe0ff, roughness: 0.03, metalness: 0.0,
  transmission: 0.9, ior: 1.7, thickness: 0.2, clearcoat: 1.0,
  envMapIntensity: 1.4, transparent: false
});
const pupilMat = new THREE.MeshStandardMaterial({ color: 0x0a0d14, roughness: 0.25, metalness: 0.1 });

/* ------------------------------------------------------------------ */
/*  Helpers                                                           */
/* ------------------------------------------------------------------ */
const radKnots = [
  [0.00, 0.185],[0.09, 0.255],[0.19, 0.285],[0.30, 0.278],
  [0.42, 0.245],[0.53, 0.200],[0.63, 0.160],[0.73, 0.125],
  [0.82, 0.090],[0.90, 0.060],[0.96, 0.035],[1.00, 0.015]
];
function baseRadius(u) {
  u = Math.max(0, Math.min(1, u));
  for (let i = 0; i < radKnots.length - 1; i++) {
    const a = radKnots[i], b = radKnots[i + 1];
    if (u >= a[0] && u <= b[0]) {
      const t = (u - a[0]) / (b[0] - a[0]);
      return a[1] + (b[1] - a[1]) * t;
    }
  }
  return radKnots[radKnots.length - 1][1];
}
function bodyRadius(u) {
  const ring = 1 + 0.05 * Math.sin(u * Math.PI * 2 * 13);
  return baseRadius(u) * ring;
}

function buildTube(curve, seg, radial, radiusFn, depth) {
  const frames = curve.computeFrenetFrames(seg, false);
  const pos = [], idx = [];
  const P = new THREE.Vector3(), N = new THREE.Vector3(), B = new THREE.Vector3();
  for (let i = 0; i <= seg; i++) {
    const u = i / seg;
    curve.getPointAt(u, P);
    N.copy(frames.normals[i]); B.copy(frames.binormals[i]);
    const r = radiusFn(u);
    for (let j = 0; j <= radial; j++) {
      const v = j / radial * Math.PI * 2;
      const cs = Math.cos(v), sn = Math.sin(v);
      pos.push(
        P.x + r * (cs * N.x + sn * depth * B.x),
        P.y + r * (cs * N.y + sn * depth * B.y),
        P.z + r * (cs * N.z + sn * depth * B.z)
      );
    }
  }
  for (let i = 0; i < seg; i++) {
    for (let j = 0; j < radial; j++) {
      const a = (radial + 1) * i + j;
      const b = (radial + 1) * (i + 1) + j;
      const c = (radial + 1) * (i + 1) + (j + 1);
      const d = (radial + 1) * i + (j + 1);
      idx.push(a, b, d, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function crystalMesh(geo, mat) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = false;
  return m;
}

// scalloped crystal fin (blade in local XY, thin in Z)
function makeFinGeometry() {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  const outer = [
    [0.06,1.00],[0.19,0.90],[0.14,0.82],[0.27,0.74],[0.22,0.66],
    [0.34,0.58],[0.29,0.50],[0.37,0.42],[0.31,0.34],[0.34,0.26],
    [0.26,0.18],[0.16,0.08],[0.05,0.02]
  ];
  s.lineTo(0.0, 1.0);
  for (const [x, y] of outer) s.lineTo(x, y);
  s.lineTo(0, 0);
  const geo = new THREE.ExtrudeGeometry(s, {
    depth: 0.05, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 1, steps: 1
  });
  geo.translate(0, 0, -0.045);
  return geo;
}

/* ------------------------------------------------------------------ */
/*  Build the seahorse                                                */
/* ------------------------------------------------------------------ */
const seahorse = new THREE.Group();

// --- main body + curled tail (spine curve) ---
const spinePts = [
  new THREE.Vector3(-0.05, 2.62, 0),
  new THREE.Vector3( 0.00, 2.35, 0),
  new THREE.Vector3( 0.10, 2.02, 0),
  new THREE.Vector3( 0.18, 1.68, 0),
  new THREE.Vector3( 0.21, 1.34, 0),
  new THREE.Vector3( 0.14, 1.00, 0),
  new THREE.Vector3(-0.02, 0.72, 0),
  new THREE.Vector3(-0.20, 0.47, 0),
  new THREE.Vector3(-0.29, 0.16, 0),
  new THREE.Vector3(-0.21,-0.12, 0),
  new THREE.Vector3( 0.02,-0.28, 0),
  new THREE.Vector3( 0.28,-0.22, 0),
  new THREE.Vector3( 0.45, 0.02, 0),
  new THREE.Vector3( 0.47, 0.29, 0),
  new THREE.Vector3( 0.31, 0.44, 0),
  new THREE.Vector3( 0.11, 0.36, 0),
  new THREE.Vector3( 0.03, 0.15, 0),
  new THREE.Vector3( 0.13, 0.03, 0)
];
const spine = new THREE.CatmullRomCurve3(spinePts, false, 'centripetal', 0.5);
spine.arcLengthDivisions = 600;

const bodyGeo = buildTube(spine, 300, 12, bodyRadius, 1.14);
seahorse.add(crystalMesh(bodyGeo, bodyMat));

// tail tip cap
const tipSphere = crystalMesh(new THREE.IcosahedronGeometry(0.03, 0), bodyMat);
tipSphere.position.copy(spine.getPointAt(1));
seahorse.add(tipSphere);

// --- dorsal ridge tubercles (cut-gem bevels along the spine) ---
const gemGeo = new THREE.OctahedronGeometry(1, 0);
const tp = new THREE.Vector3(), tt = new THREE.Vector3();
for (let u = 0.05; u <= 0.9; u += 0.041) {
  spine.getPointAt(u, tp);
  spine.getTangentAt(u, tt);
  const pOut = new THREE.Vector3(tt.y, -tt.x, 0).normalize();
  const r = baseRadius(u);
  const size = THREE.MathUtils.clamp(r * 0.6, 0.028, 0.125);
  const gem = crystalMesh(gemGeo, bodyMat);
  gem.position.copy(tp).addScaledVector(pOut, r * 0.72);
  gem.quaternion.setFromUnitVectors(UP, pOut);
  gem.scale.set(size * 0.82, size * 1.35, size * 0.82);
  seahorse.add(gem);
}

// --- head ---
const headGeo = new THREE.IcosahedronGeometry(0.27, 1);
const head = crystalMesh(headGeo, bodyMat);
head.position.set(0.0, 2.82, 0);
head.scale.set(1.0, 1.06, 0.86);
seahorse.add(head);

// --- snout (tapered tube) ---
const snoutPts = [
  new THREE.Vector3(0.16, 2.80, 0),
  new THREE.Vector3(0.40, 2.74, 0),
  new THREE.Vector3(0.60, 2.63, 0),
  new THREE.Vector3(0.76, 2.50, 0)
];
const snoutCurve = new THREE.CatmullRomCurve3(snoutPts, false, 'catmullrom', 0.5);
snoutCurve.arcLengthDivisions = 200;
const snoutGeo = buildTube(snoutCurve, 90, 10, (u) => (0.125 * (1 - u) + 0.042 * u) * (1 + 0.04 * Math.sin(u * Math.PI * 2 * 4)), 1.0);
seahorse.add(crystalMesh(snoutGeo, bodyMat));
const snoutTip = crystalMesh(new THREE.IcosahedronGeometry(0.05, 0), bodyMat);
snoutTip.position.copy(snoutCurve.getPointAt(1));
seahorse.add(snoutTip);

// --- eyes ---
for (const side of [-1, 1]) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.062, 20, 16), eyeMat);
  eye.castShadow = true;
  eye.position.set(0.14, 2.90, 0.17 * side);
  seahorse.add(eye);
  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.03, 14, 12), pupilMat);
  pupil.position.set(0.185, 2.90, 0.205 * side);
  seahorse.add(pupil);
}

// --- coronet (ridged crown of gem spikes) ---
const coronet = new THREE.Group();
const knob = crystalMesh(new THREE.IcosahedronGeometry(0.09, 0), bodyMat);
knob.position.set(-0.02, 3.0, 0);
coronet.add(knob);
for (let i = -2; i <= 2; i++) {
  const h = 0.30 - 0.045 * Math.abs(i);
  const spike = crystalMesh(new THREE.ConeGeometry(0.052, h, 6), bodyMat);
  spike.position.set(-0.02, 3.0 + h * 0.5, i * 0.075);
  spike.rotation.z = 0.14;                 // lean back
  spike.rotation.x = -i * 0.19;            // fan sideways
  coronet.add(spike);
}
seahorse.add(coronet);

// --- dorsal fin ---
const finGeo = makeFinGeometry();
const dorsal = crystalMesh(finGeo, finMat);
dorsal.position.set(-0.02, 1.18, 0);
dorsal.rotation.y = Math.PI;   // blade points backward (-x)
dorsal.rotation.z = 0.16;
dorsal.scale.set(0.98, 1.0, 1.0);
seahorse.add(dorsal);

// --- pectoral fins (sideways, behind the head) ---
for (const side of [-1, 1]) {
  const pec = crystalMesh(finGeo, finMat);
  pec.position.set(0.02, 2.42, 0.16 * side);
  pec.rotation.y = side > 0 ? -Math.PI / 2 : Math.PI / 2;
  pec.rotation.z = 0.35;
  pec.scale.setScalar(0.34);
  seahorse.add(pec);
}

scene.add(seahorse);

/* ------------------------------------------------------------------ */
/*  Center the object at the origin & place the shadow ground         */
/* ------------------------------------------------------------------ */
const box = new THREE.Box3().setFromObject(seahorse);
const center = box.getCenter(new THREE.Vector3());
seahorse.position.sub(center);
const groundY = box.min.y - center.y;

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(7, 64),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = groundY - 0.02;
ground.receiveShadow = true;
scene.add(ground);

seahorse.rotation.y = -0.35;

/* ------------------------------------------------------------------ */
/*  Lighting: hemisphere fill + key/fill/rim + prismatic point lights */
/* ------------------------------------------------------------------ */
scene.add(new THREE.HemisphereLight(0xbfd3ff, 0x161620, 0.4));

const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(4.2, 6.5, 5.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 4;
key.shadow.bias = -0.0004;
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 30;
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 4;
key.shadow.camera.bottom = -4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fbaff, 0.55);
fill.position.set(-5.5, 2.0, 3.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd9a0, 0.9);
rim.position.set(-3.5, 4.0, -6.0);
scene.add(rim);

const p1 = new THREE.PointLight(0xff2e88, 6.0, 9, 2); p1.position.set(1.6, 0.8, 2.2);
const p2 = new THREE.PointLight(0x22e0ff, 5.0, 9, 2); p2.position.set(-1.9, 0.4, 1.6);
const p3 = new THREE.PointLight(0xffcf5e, 4.0, 9, 2); p3.position.set(0.6, 2.3, -2.2);
scene.add(p1, p2, p3);

/* ------------------------------------------------------------------ */
/*  Controls                                                          */
/* ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.enablePan = false;
controls.minDistance = 3.2;
controls.maxDistance = 14;
controls.target.set(0, 0, 0);
controls.update();

/* ------------------------------------------------------------------ */
/*  Resize & render loop                                              */
/* ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
