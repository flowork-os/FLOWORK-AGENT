<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carved Walnut Zither</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #3a3028 0%, #191613 52%, #080706 100%);
    }
    canvas { display: block; }
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.42) 100%);
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="vignette"></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x17120f, 0.035);

    const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(7.8, 6.2, 8.8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.prepend(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;
    controls.minDistance = 8;
    controls.maxDistance = 20;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.target.set(0, 0.15, 0);

    function createWoodTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1536;
      canvas.height = 384;
      const ctx = canvas.getContext('2d');

      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, '#5b2915');
      gradient.addColorStop(0.35, '#7c4120');
      gradient.addColorStop(0.68, '#633018');
      gradient.addColorStop(1, '#432012');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const random = (seed => () => {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      })(73191);

      for (let i = 0; i < 180; i++) {
        const y = random() * canvas.height;
        const width = 0.3 + random() * 2.1;
        const alpha = 0.025 + random() * 0.11;
        const wave = 4 + random() * 22;
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x <= canvas.width; x += 24) {
          const sweep = Math.sin(x * 0.006 + i * 1.7) * wave;
          const curl = Math.sin(x * 0.018 + i * 0.53) * wave * 0.16;
          ctx.lineTo(x, y + sweep + curl);
        }
        ctx.strokeStyle = random() > 0.42
          ? `rgba(35,12,5,${alpha})`
          : `rgba(224,133,65,${alpha * 0.65})`;
        ctx.lineWidth = width;
        ctx.stroke();
      }

      for (let i = 0; i < 13; i++) {
        const cx = random() * canvas.width;
        const cy = random() * canvas.height;
        for (let j = 0; j < 7; j++) {
          ctx.beginPath();
          ctx.ellipse(cx, cy, 25 + j * 15, 3 + j * 3.2, 0, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(32,10,4,${0.08 - j * 0.007})`;
          ctx.lineWidth = 1.1;
          ctx.stroke();
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(1.35, 1.2);
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      return texture;
    }

    const woodTexture = createWoodTexture();
    const woodMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x8a4826,
      map: woodTexture,
      roughness: 0.34,
      metalness: 0,
      clearcoat: 0.28,
      clearcoatRoughness: 0.38,
      bumpMap: woodTexture,
      bumpScale: 0.018
    });

    const darkWoodMaterial = new THREE.MeshStandardMaterial({
      color: 0x32160d,
      roughness: 0.52,
      metalness: 0.02
    });

    const reliefMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xa76235,
      roughness: 0.3,
      clearcoat: 0.3,
      clearcoatRoughness: 0.42
    });

    const boneMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xeadcbd,
      roughness: 0.31,
      clearcoat: 0.12
    });

    const stringMaterial = new THREE.MeshStandardMaterial({
      color: 0xd9c49b,
      roughness: 0.24,
      metalness: 0.56
    });

    const blackMaterial = new THREE.MeshStandardMaterial({
      color: 0x090604,
      roughness: 0.9
    });

    const zither = new THREE.Group();
    zither.rotation.y = -0.08;
    scene.add(zither);

    function bodyShape(inset = 0) {
      const shape = new THREE.Shape();
      const left = -4.5 + inset;
      const right = 4.5 - inset;
      const wide = 1.68 - inset * 0.48;
      const narrow = 1.22 - inset * 0.48;
      const radius = Math.max(0.08, 0.34 - inset * 0.15);

      shape.moveTo(left + radius, -wide);
      shape.lineTo(right - radius, -narrow);
      shape.quadraticCurveTo(right, -narrow, right, -narrow + radius);
      shape.lineTo(right, narrow - radius);
      shape.quadraticCurveTo(right, narrow, right - radius, narrow);
      shape.lineTo(left + radius, wide);
      shape.quadraticCurveTo(left, wide, left, wide - radius);
      shape.lineTo(left, -wide + radius);
      shape.quadraticCurveTo(left, -wide, left + radius, -wide);
      return shape;
    }

    const bodyGeometry = new THREE.ExtrudeGeometry(bodyShape(0), {
      depth: 0.52,
      bevelEnabled: true,
      bevelSegments: 2,
      bevelSize: 0.13,
      bevelThickness: 0.11,
      curveSegments: 5,
      steps: 1
    });
    bodyGeometry.rotateX(Math.PI / 2);
    bodyGeometry.translate(0, 0.26, 0);
    bodyGeometry.computeVertexNormals();

    const body = new THREE.Mesh(bodyGeometry, woodMaterial);
    body.castShadow = true;
    body.receiveShadow = true;
    zither.add(body);

    const topGeometry = new THREE.ShapeGeometry(bodyShape(0.21), 8);
    topGeometry.rotateX(-Math.PI / 2);
    const top = new THREE.Mesh(topGeometry, woodMaterial);
    top.position.y = 0.405;
    top.castShadow = true;
    top.receiveShadow = true;
    zither.add(top);

    const bevelRails = new THREE.Group();
    zither.add(bevelRails);

    function addRail(points) {
      const curve = new THREE.CatmullRomCurve3(points);
      const geometry = new THREE.TubeGeometry(curve, 48, 0.045, 5, false);
      const mesh = new THREE.Mesh(geometry, darkWoodMaterial);
      mesh.castShadow = true;
      bevelRails.add(mesh);
    }

    addRail([
      new THREE.Vector3(-4.15, 0.43, -1.48),
      new THREE.Vector3(-2.1, 0.44, -1.38),
      new THREE.Vector3(0, 0.44, -1.28),
      new THREE.Vector3(2.1, 0.44, -1.17),
      new THREE.Vector3(4.13, 0.43, -1.06)
    ]);
    addRail([
      new THREE.Vector3(-4.15, 0.43, 1.48),
      new THREE.Vector3(-2.1, 0.44, 1.38),
      new THREE.Vector3(0, 0.44, 1.28),
      new THREE.Vector3(2.1, 0.44, 1.17),
      new THREE.Vector3(4.13, 0.43, 1.06)
    ]);

    const soundHole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.67, 0.69, 0.025, 64),
      blackMaterial
    );
    soundHole.position.set(0.35, 0.421, 0);
    soundHole.receiveShadow = true;
    zither.add(soundHole);

    const innerRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.635, 0.055, 8, 48),
      darkWoodMaterial
    );
    innerRing.rotation.x = Math.PI / 2;
    innerRing.position.set(0.35, 0.447, 0);
    innerRing.castShadow = true;
    zither.add(innerRing);

    function knotCurve(phase, scale, material) {
      const points = [];
      const count = 144;
      for (let i = 0; i <= count; i++) {
        const t = (i / count) * Math.PI * 2;
        const radial = 0.43 + 0.12 * Math.cos(4 * t + phase);
        const x = 0.35 + Math.cos(t + phase * 0.12) * radial * scale;
        const z = Math.sin(t + phase * 0.12) * radial * scale;
        const y = 0.472 + 0.022 * Math.sin(4 * t + phase);
        points.push(new THREE.Vector3(x, y, z));
      }
      const curve = new THREE.CatmullRomCurve3(points, true);
      const tube = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 144, 0.038, 7, true),
        material
      );
      tube.castShadow = true;
      zither.add(tube);
    }

    knotCurve(0, 1.0, reliefMaterial);
    knotCurve(Math.PI, 0.79, boneMaterial);

    const centralBoss = new THREE.Mesh(
      new THREE.SphereGeometry(0.105, 16, 8),
      reliefMaterial
    );
    centralBoss.scale.y = 0.25;
    centralBoss.position.set(0.35, 0.5, 0);
    centralBoss.castShadow = true;
    zither.add(centralBoss);

    function addCylinderBetween(start, end, radius, material, radialSegments = 8) {
      const direction = new THREE.Vector3().subVectors(end, start);
      const length = direction.length();
      const geometry = new THREE.CylinderGeometry(radius, radius, length, radialSegments, 1);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.clone().normalize()
      );
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      zither.add(mesh);
      return mesh;
    }

    function addBridge(x, width) {
      const bridge = new THREE.Mesh(
        new THREE.BoxGeometry(0.13, 0.24, width),
        boneMaterial
      );
      bridge.position.set(x, 0.52, 0);
      bridge.rotation.z = x < 0 ? -0.025 : 0.025;
      bridge.castShadow = true;
      zither.add(bridge);

      const cap = new THREE.Mesh(
        new THREE.BoxGeometry(0.18, 0.055, width + 0.08),
        darkWoodMaterial
      );
      cap.position.set(x, 0.655, 0);
      cap.castShadow = true;
      zither.add(cap);
    }

    addBridge(-3.45, 2.33);
    addBridge(3.28, 1.86);

    const stringCount = 12;
    for (let i = 0; i < stringCount; i++) {
      const fraction = i / (stringCount - 1);
      const z = THREE.MathUtils.lerp(-0.88, 0.88, fraction);
      const subtle = Math.sin(fraction * Math.PI) * 0.025;
      addCylinderBetween(
        new THREE.Vector3(-3.94, 0.69 + subtle, z * 1.13),
        new THREE.Vector3(3.82, 0.69 + subtle, z),
        i % 4 === 0 ? 0.012 : 0.008,
        stringMaterial,
        6
      );

      const hitch = new THREE.Mesh(
        new THREE.CylinderGeometry(0.045, 0.052, 0.13, 8),
        darkWoodMaterial
      );
      hitch.position.set(-4.02, 0.53, z * 1.14);
      hitch.castShadow = true;
      zither.add(hitch);

      const pin = new THREE.Mesh(
        new THREE.CylinderGeometry(0.055, 0.065, 0.31, 10),
        boneMaterial
      );
      pin.position.set(3.86, 0.58, z);
      pin.rotation.z = -0.11;
      pin.castShadow = true;
      zither.add(pin);

      const pegHead = new THREE.Mesh(
        new THREE.BoxGeometry(0.19, 0.09, 0.075),
        boneMaterial
      );
      pegHead.position.set(3.84, 0.75, z);
      pegHead.rotation.y = (i % 2 ? 0.14 : -0.14);
      pegHead.castShadow = true;
      zither.add(pegHead);
    }

    function createVine(side) {
      const points = [];
      const leafMaterial = reliefMaterial;
      for (let i = 0; i <= 72; i++) {
        const f = i / 72;
        const x = THREE.MathUtils.lerp(-3.65, 2.8, f);
        const baseZ = side * THREE.MathUtils.lerp(1.31, 1.08, f);
        const z = baseZ + side * Math.sin(f * Math.PI * 5.2) * 0.075;
        const y = 0.493 + Math.cos(f * Math.PI * 10.4) * 0.009;
        points.push(new THREE.Vector3(x, y, z));
      }

      const stem = new THREE.Mesh(
        new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 80, 0.025, 6, false),
        reliefMaterial
      );
      stem.castShadow = true;
      zither.add(stem);

      for (let i = 1; i < 9; i++) {
        const f = i / 10;
        const x = THREE.MathUtils.lerp(-3.65, 2.8, f);
        const baseZ = side * THREE.MathUtils.lerp(1.31, 1.08, f);
        const z = baseZ + side * Math.sin(f * Math.PI * 5.2) * 0.075;
        const outward = side * (i % 2 === 0 ? 0.11 : -0.105);

        const leaf = new THREE.Mesh(
          new THREE.SphereGeometry(0.095, 12, 8),
          leafMaterial
        );
        leaf.scale.set(1.55, 0.18, 0.6);
        leaf.rotation.y = (i % 2 === 0 ? 0.55 : -0.55) * side;
        leaf.position.set(x + 0.05, 0.51, z + outward);
        leaf.castShadow = true;
        zither.add(leaf);

        const tendrilPoints = [
          new THREE.Vector3(x, 0.495, z),
          new THREE.Vector3(x + 0.08, 0.505, z + outward * 0.55),
          new THREE.Vector3(x + 0.16, 0.51, z + outward)
        ];
        const tendril = new THREE.Mesh(
          new THREE.TubeGeometry(new THREE.CatmullRomCurve3(tendrilPoints), 10, 0.014, 5, false),
          reliefMaterial
        );
        tendril.castShadow = true;
        zither.add(tendril);
      }
    }

    createVine(-1);
    createVine(1);

    for (let i = 0; i < 18; i++) {
      const fraction = i / 17;
      const x = THREE.MathUtils.lerp(-3.95, 3.72, fraction);
      const halfWidth = THREE.MathUtils.lerp(1.48, 1.04, fraction);
      for (const side of [-1, 1]) {
        const facet = new THREE.Mesh(
          new THREE.BoxGeometry(0.23, 0.055, 0.085),
          new THREE.MeshStandardMaterial({
            color: i % 3 === 0 ? 0x6f351d : 0x8e4b27,
            roughness: 0.48
          })
        );
        facet.position.set(x, 0.385, side * halfWidth);
        facet.rotation.y = side * 0.08;
        facet.rotation.z = Math.sin(i * 1.8) * 0.025;
        facet.castShadow = true;
        zither.add(facet);
      }
    }

    const footMaterial = new THREE.MeshStandardMaterial({
      color: 0x25110a,
      roughness: 0.62
    });

    for (const x of [-3.35, 3.35]) {
      for (const z of [-0.92, 0.92]) {
        const foot = new THREE.Mesh(
          new THREE.CylinderGeometry(0.16, 0.21, 0.28, 8),
          footMaterial
        );
        foot.position.set(x, -0.49, z);
        foot.castShadow = true;
        zither.add(foot);
      }
    }

    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(15, 96),
      new THREE.MeshStandardMaterial({
        color: 0x1b1511,
        roughness: 0.78,
        metalness: 0
      })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.66;
    floor.receiveShadow = true;
    scene.add(floor);

    const hemisphere = new THREE.HemisphereLight(0xffdfbd, 0x160d09, 1.45);
    scene.add(hemisphere);

    const keyLight = new THREE.DirectionalLight(0xffc486, 4.1);
    keyLight.position.set(-4.5, 8, 5.5);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(2048, 2048);
    keyLight.shadow.camera.left = -8;
    keyLight.shadow.camera.right = 8;
    keyLight.shadow.camera.top = 7;
    keyLight.shadow.camera.bottom = -7;
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 25;
    keyLight.shadow.bias = -0.00035;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x8ca7d8, 1.8);
    rimLight.position.set(5, 4, -6);
    scene.add(rimLight);

    const warmFill = new THREE.PointLight(0xff7d36, 32, 12, 2);
    warmFill.position.set(-4.5, 1.8, -3.5);
    scene.add(warmFill);

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      zither.position.y = Math.sin(elapsed * 0.65) * 0.012;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
