<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shopping Cart</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e9ebef}canvas{display:block}</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9ebef);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, .1, 50);
camera.position.set(1.9, 1.25, 2.3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, .55, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.5;
controls.minDistance = 1.2;
controls.maxDistance = 7;
controls.maxPolarAngle = Math.PI * .52;

const key = new THREE.DirectionalLight(0xffffff, 1.6);
key.position.set(3, 5, 2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -1.6, right: 1.6, top: 1.6, bottom: -1.6, near: 1, far: 12 });
key.shadow.radius = 6;
key.shadow.blurSamples = 16;
scene.add(key, new THREE.HemisphereLight(0xe8eef8, 0x8b8f96, .35));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: .28 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const chrome = new THREE.MeshStandardMaterial({ color: 0xf4f6f8, metalness: 1, roughness: .18 });
const rubber = new THREE.MeshStandardMaterial({ color: 0x24262a, roughness: .9 });
const plastic = new THREE.MeshStandardMaterial({ color: 0xb3202e, roughness: .45 });
const grayP = new THREE.MeshStandardMaterial({ color: 0x585d64, roughness: .6, metalness: .2 });

const cart = new THREE.Group();
cart.position.z = .08;
scene.add(cart);

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const LV = (a, b, t) => a.clone().lerp(b, t);
const L = THREE.MathUtils.lerp;
const UP = V(0, 1, 0);
const wireGeo = new THREE.CylinderGeometry(1, 1, 1, 8);

function wire(a, b, r = .006, mat = chrome) {
  const d = b.clone().sub(a), m = new THREE.Mesh(wireGeo, mat);
  m.scale.set(r, d.length(), r);
  m.position.copy(a).addScaledVector(d, .5);
  m.quaternion.setFromUnitVectors(UP, d.normalize());
  m.castShadow = true;
  cart.add(m);
  return m;
}

// Basket: tapers toward front, sloped rim (u: 0=back -> 1=front, s: side)
const bp = (u, s) => V(s * L(.22, .17, u), .52, L(-.32, .40, u));
const tp = (u, s) => V(s * L(.30, .23, u), L(.98, .90, u), L(-.44, .48, u));

for (const s of [-1, 1]) {                                   // side walls
  for (let i = 0; i <= 10; i++) wire(bp(i / 10, s), tp(i / 10, s));
  for (let k = 1; k <= 3; k++) wire(LV(bp(0, s), tp(0, s), k / 4), LV(bp(1, s), tp(1, s), k / 4));
}
for (const u of [0, 1]) {                                    // back & front walls
  for (let i = 1; i < 9; i++) wire(LV(bp(u, -1), bp(u, 1), i / 9), LV(tp(u, -1), tp(u, 1), i / 9));
  for (let k = 1; k <= 3; k++) wire(LV(bp(u, -1), tp(u, -1), k / 4), LV(bp(u, 1), tp(u, 1), k / 4));
}
for (let i = 0; i <= 6; i++)                                  // floor grid
  wire(LV(bp(0, -1), bp(0, 1), i / 6), LV(bp(1, -1), bp(1, 1), i / 6));
for (let i = 1; i < 7; i++) wire(bp(i / 7, -1), bp(i / 7, 1));
for (const s of [-1, 1]) { wire(bp(0, s), bp(1, s), .008); wire(tp(0, s), tp(1, s), .012); } // rim + base loop
wire(bp(0, -1), bp(0, 1), .008); wire(bp(1, -1), bp(1, 1), .008);
wire(tp(0, -1), tp(0, 1), .012); wire(tp(1, -1), tp(1, 1), .012);

// Child seat flap (back) + seat platform
const fT = t => V(L(-.25, .25, t), .93, -.40), fB = t => V(L(-.25, .25, t), .58, -.26), sB = t => V(L(-.25, .25, t), .58, -.335);
for (let i = 0; i <= 7; i++) { wire(fT(i / 7), fB(i / 7)); wire(fB(i / 7), sB(i / 7)); }
for (let k = 0; k <= 2; k++) wire(LV(fT(0), fB(0), k / 2), LV(fT(1), fB(1), k / 2), .007);
wire(sB(0), sB(1), .007);

// Handle + rear legs + cross brace
const hb = s => V(s * .30, 1.03, -.60), legB = s => V(s * .25, .17, -.42);
for (const s of [-1, 1]) { wire(hb(s), tp(0, s), .015); wire(hb(s), legB(s), .016); }
wire(LV(hb(-1), legB(-1), .7), LV(hb(1), legB(1), .7), .013);
const grip = new THREE.Mesh(new THREE.CapsuleGeometry(.027, .56, 8, 16), plastic);
grip.rotation.z = Math.PI / 2;
grip.position.set(0, 1.03, -.60);
grip.castShadow = true;
cart.add(grip);

// Lower rack + front struts
const rr = s => V(s * .25, .17, -.42), rf = s => V(s * .19, .11, .36);
for (const s of [-1, 1]) { wire(rr(s), rf(s), .012); wire(rf(s), bp(1, s), .013); }
wire(rf(-1), rf(1), .012);
for (let i = 1; i <= 6; i++) wire(LV(rr(-1), rf(-1), i / 7), LV(rr(1), rf(1), i / 7));
for (const t of [.3, .5, .7]) wire(LV(rr(-1), rr(1), t), LV(rf(-1), rf(1), t));

// Swivel caster wheels
const wheelGeo = new THREE.CylinderGeometry(.052, .052, .034, 24);
const hubGeo = new THREE.CylinderGeometry(.02, .02, .04, 16);
const plateGeo = new THREE.BoxGeometry(.012, .09, .05);
function caster(x, z, topY, spin) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = spin;
  const add = (geo, mat, px, py, pz, rz = 0) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(px, py, pz);
    m.rotation.z = rz;
    m.castShadow = true;
    g.add(m);
  };
  add(new THREE.CylinderGeometry(.011, .011, topY - .09, 10), chrome, 0, (topY + .09) / 2, 0);
  add(new THREE.CylinderGeometry(.027, .027, .024, 16), grayP, 0, .098, 0);
  add(plateGeo, grayP, -.028, .062, .028);
  add(plateGeo, grayP, .028, .062, .028);
  add(new THREE.BoxGeometry(.068, .012, .05), grayP, 0, .101, .028);
  add(wheelGeo, rubber, 0, .052, .036, Math.PI / 2);
  add(hubGeo, grayP, 0, .052, .036, Math.PI / 2);
  add(new THREE.CylinderGeometry(.007, .007, .075, 8), chrome, 0, .052, .036, Math.PI / 2);
  cart.add(g);
}
caster(-.25, -.42, .18, .4);
caster(.25, -.42, .18, -.25);
caster(-.19, .36, .12, .15);
caster(.19, .36, .12, -.35);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
