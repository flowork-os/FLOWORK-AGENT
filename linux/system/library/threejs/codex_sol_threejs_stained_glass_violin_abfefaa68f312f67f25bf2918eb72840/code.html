<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stained Glass Violin</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background:
        radial-gradient(circle at 50% 42%, #342416 0%, #12151d 38%, #05070b 76%, #020305 100%);
    }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x080a10, 0.038);

const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0.6, 1.2, 14.8);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x05070b, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.22;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.enablePan = false;
controls.minDistance = 10;
controls.maxDistance = 23;
controls.target.set(0, 0.2, 0);

const violin = new THREE.Group();
violin.position.y = -1.35;
violin.rotation.x = -0.035;
scene.add(violin);

const leadMaterial = new THREE.MeshStandardMaterial({
  color: 0x090a0d,
  metalness: 0.88,
  roughness: 0.27,
  emissive: 0x2a1408,
  emissiveIntensity: 0.13
});

const edgeMaterial = new THREE.MeshStandardMaterial({
  color: 0x111216,
  metalness: 0.72,
  roughness: 0.35
});

const glassPalette = [
  [0xe39718, 0x542400],
  [0xffb62d, 0x5c2b00],
  [0x9f1028, 0x3d000b],
  [0xd82732, 0x520008],
  [0x153e9c, 0x00174b],
  [0x1769ba, 0x002451],
  [0xf1c251, 0x5d3900]
];

function glassMaterial(color, emissive) {
  return new THREE.MeshPhysicalMaterial({
    color,
    emissive,
    emissiveIntensity: 0.45,
    metalness: 0.02,
    roughness: 0.2,
    transmission: 0.2,
    thickness: 0.55,
    transparent: true,
    opacity: 0.9,
    clearcoat: 0.75,
    clearcoatRoughness: 0.2,
    side: THREE.DoubleSide
  });
}

const glassMaterials = glassPalette.map(c => glassMaterial(c[0], c[1]));

function seeded(index) {
  const x = Math.sin(index * 91.731 + 17.23) * 43758.5453;
  return x - Math.floor(x);
}

function makeViolinBodyShape() {
  const s = new THREE.Shape();
  s.moveTo(0, -3.08);
  s.bezierCurveTo(-0.74, -3.08, -1.58, -2.7, -1.72, -1.92);
  s.bezierCurveTo(-1.88, -1.02, -1.22, -0.66, -0.84, -0.34);
  s.bezierCurveTo(-0.61, -0.1, -0.68, 0.48, -1.24, 0.84);
  s.bezierCurveTo(-1.79, 1.2, -1.68, 2.16, -1.2, 2.55);
  s.bezierCurveTo(-0.8, 2.89, -0.34, 2.86, 0, 2.68);
  s.bezierCurveTo(0.34, 2.86, 0.8, 2.89, 1.2, 2.55);
  s.bezierCurveTo(1.68, 2.16, 1.79, 1.2, 1.24, 0.84);
  s.bezierCurveTo(0.68, 0.48, 0.61, -0.1, 0.84, -0.34);
  s.bezierCurveTo(1.22, -0.66, 1.88, -1.02, 1.72, -1.92);
  s.bezierCurveTo(1.58, -2.7, 0.74, -3.08, 0, -3.08);
  s.closePath();
  return s;
}

const bodyShape = makeViolinBodyShape();
const bodyBaseGeometry = new THREE.ExtrudeGeometry(bodyShape, {
  depth: 0.34,
  bevelEnabled: true,
  bevelSegments: 4,
  steps: 1,
  bevelSize: 0.09,
  bevelThickness: 0.09,
  curveSegments: 18
});
bodyBaseGeometry.translate(0, 0, -0.17);
const bodyBase = new THREE.Mesh(bodyBaseGeometry, leadMaterial);
bodyBase.castShadow = true;
bodyBase.receiveShadow = true;
violin.add(bodyBase);

const innerGlow = new THREE.Mesh(
  new THREE.ShapeGeometry(bodyShape, 18),
  new THREE.MeshBasicMaterial({
    color: 0xb9570b,
    transparent: true,
    opacity: 0.3,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
innerGlow.position.z = -0.2;
innerGlow.scale.set(0.965, 0.965, 1);
violin.add(innerGlow);

const contour = bodyShape.getPoints(18);
if (contour.length > 1 && contour[0].distanceTo(contour[contour.length - 1]) < 0.001) contour.pop();

const bodyTriangles = THREE.ShapeUtils.triangulateShape(contour, []);
bodyTriangles.forEach((tri, i) => {
  const a = contour[tri[0]];
  const b = contour[tri[1]];
  const c = contour[tri[2]];
  const center = new THREE.Vector2(
    (a.x + b.x + c.x) / 3,
    (a.y + b.y + c.y) / 3
  );
  const inset = 0.91;
  const vertices = [a, b, c].map(p => new THREE.Vector2(
    center.x + (p.x - center.x) * inset,
    center.y + (p.y - center.y) * inset
  ));
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute([
    vertices[0].x, vertices[0].y, 0,
    vertices[1].x, vertices[1].y, 0,
    vertices[2].x, vertices[2].y, 0
  ], 3));
  geometry.computeVertexNormals();
  const materialIndex = Math.floor(seeded(i) * glassMaterials.length);
  const shard = new THREE.Mesh(geometry, glassMaterials[materialIndex]);
  shard.position.z = 0.275 + seeded(i + 100) * 0.012;
  shard.renderOrder = 2;
  violin.add(shard);
});

function tubeFromPoints(points, radius, material, closed = false, segments = 48) {
  const curve = new THREE.CatmullRomCurve3(
    points.map(p => new THREE.Vector3(p[0], p[1], p[2] ?? 0)),
    closed,
    'centripetal'
  );
  const mesh = new THREE.Mesh(
    new THREE.TubeGeometry(curve, segments, radius, 7, closed),
    material
  );
  mesh.castShadow = true;
  return mesh;
}

const outerLead = tubeFromPoints(
  contour.map(p => [p.x, p.y, 0.32]),
  0.045,
  leadMaterial,
  true,
  180
);
violin.add(outerLead);

const centralSeams = [
  [[0, -3.01, 0.306], [-0.18, -2.34, 0.306], [0.06, -1.62, 0.306], [-0.17, -0.8, 0.306]],
  [[0, 2.65, 0.306], [0.19, 2.05, 0.306], [-0.06, 1.45, 0.306], [0.16, 0.82, 0.306]],
  [[-1.53, -1.82, 0.306], [-0.84, -1.55, 0.306], [-0.1, -1.7, 0.306], [0.76, -1.42, 0.306], [1.55, -1.72, 0.306]],
  [[-1.48, 1.36, 0.306], [-0.74, 1.62, 0.306], [-0.04, 1.4, 0.306], [0.71, 1.7, 0.306], [1.46, 1.45, 0.306]]
];
centralSeams.forEach(points => violin.add(tubeFromPoints(points, 0.024, leadMaterial, false, 42)));

function createFHole(side) {
  const x = side * 0.73;
  const points = [
    [x + side * 0.1, 0.75, 0.39],
    [x - side * 0.08, 0.42, 0.39],
    [x - side * 0.07, 0.08, 0.39],
    [x + side * 0.12, -0.22, 0.39],
    [x + side * 0.06, -0.63, 0.39],
    [x - side * 0.12, -0.91, 0.39]
  ];
  violin.add(tubeFromPoints(points, 0.055, leadMaterial, false, 56));
  const dotGeo = new THREE.SphereGeometry(0.105, 18, 12);
  const topDot = new THREE.Mesh(dotGeo, leadMaterial);
  topDot.position.set(x + side * 0.11, 0.82, 0.39);
  topDot.scale.set(0.75, 1.25, 0.55);
  violin.add(topDot);
  const lowerDot = topDot.clone();
  lowerDot.position.set(x - side * 0.14, -0.98, 0.39);
  violin.add(lowerDot);
  const wing = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.075, 0.075), leadMaterial);
  wing.position.set(x, -0.07, 0.39);
  wing.rotation.z = side * -0.45;
  violin.add(wing);
}
createFHole(-1);
createFHole(1);

const neckShape = new THREE.Shape();
neckShape.moveTo(-0.31, 2.42);
neckShape.lineTo(-0.22, 5.45);
neckShape.lineTo(0.22, 5.45);
neckShape.lineTo(0.31, 2.42);
neckShape.closePath();

const neckBaseGeo = new THREE.ExtrudeGeometry(neckShape, {
  depth: 0.24,
  bevelEnabled: true,
  bevelSegments: 2,
  bevelSize: 0.035,
  bevelThickness: 0.04
});
neckBaseGeo.translate(0, 0, -0.08);
const neckBase = new THREE.Mesh(neckBaseGeo, leadMaterial);
neckBase.castShadow = true;
violin.add(neckBase);

const neckPanels = [
  { p: [[-0.25,2.54],[0.25,2.54],[0.23,3.38],[-0.27,3.12]], m: 4 },
  { p: [[-0.27,3.12],[0.23,3.38],[0.22,4.15],[-0.25,4.02]], m: 1 },
  { p: [[-0.25,4.02],[0.22,4.15],[0.2,5.34],[-0.21,5.34]], m: 2 }
];
neckPanels.forEach(item => {
  const s = new THREE.Shape();
  s.moveTo(item.p[0][0], item.p[0][1]);
  item.p.slice(1).forEach(p => s.lineTo(p[0], p[1]));
  s.closePath();
  const panel = new THREE.Mesh(new THREE.ShapeGeometry(s), glassMaterials[item.m]);
  panel.position.z = 0.205;
  violin.add(panel);
});

const fingerShape = new THREE.Shape();
fingerShape.moveTo(-0.34, 0.18);
fingerShape.lineTo(-0.19, 5.34);
fingerShape.lineTo(0.19, 5.34);
fingerShape.lineTo(0.34, 0.18);
fingerShape.closePath();
const fingerboard = new THREE.Mesh(
  new THREE.ExtrudeGeometry(fingerShape, {
    depth: 0.1,
    bevelEnabled: true,
    bevelSegments: 2,
    bevelSize: 0.025,
    bevelThickness: 0.025
  }),
  edgeMaterial
);
fingerboard.position.z = 0.25;
fingerboard.castShadow = true;
violin.add(fingerboard);

const tailShape = new THREE.Shape();
tailShape.moveTo(-0.48, -2.58);
tailShape.quadraticCurveTo(-0.57, -1.92, -0.33, -1.25);
tailShape.lineTo(-0.2, -0.72);
tailShape.lineTo(0.2, -0.72);
tailShape.lineTo(0.33, -1.25);
tailShape.quadraticCurveTo(0.57, -1.92, 0.48, -2.58);
tailShape.quadraticCurveTo(0, -2.83, -0.48, -2.58);
tailShape.closePath();
const tailpiece = new THREE.Mesh(
  new THREE.ExtrudeGeometry(tailShape, {
    depth: 0.15,
    bevelEnabled: true,
    bevelSegments: 3,
    bevelSize: 0.045,
    bevelThickness: 0.04
  }),
  glassMaterial(0x5f0719, 0x4b000d)
);
tailpiece.position.z = 0.31;
tailpiece.castShadow = true;
violin.add(tailpiece);

const tailOutline = tubeFromPoints(
  tailShape.getPoints(10).slice(0, -1).map(p => [p.x, p.y, 0.5]),
  0.035,
  leadMaterial,
  true,
  80
);
violin.add(tailOutline);

const bridgeShape = new THREE.Shape();
bridgeShape.moveTo(-0.75, -0.45);
bridgeShape.lineTo(-0.62, 0.16);
bridgeShape.quadraticCurveTo(-0.36, 0.3, -0.28, 0.08);
bridgeShape.lineTo(-0.18, -0.2);
bridgeShape.quadraticCurveTo(0, -0.07, 0.18, -0.2);
bridgeShape.lineTo(0.28, 0.08);
bridgeShape.quadraticCurveTo(0.36, 0.3, 0.62, 0.16);
bridgeShape.lineTo(0.75, -0.45);
bridgeShape.lineTo(0.58, -0.48);
bridgeShape.lineTo(0.47, -0.15);
bridgeShape.lineTo(-0.47, -0.15);
bridgeShape.lineTo(-0.58, -0.48);
bridgeShape.closePath();
const bridge = new THREE.Mesh(
  new THREE.ExtrudeGeometry(bridgeShape, {
    depth: 0.1,
    bevelEnabled: true,
    bevelSegments: 2,
    bevelSize: 0.025,
    bevelThickness: 0.025
  }),
  glassMaterial(0xf2b947, 0x714000)
);
bridge.position.z = 0.48;
bridge.castShadow = true;
violin.add(bridge);

const pegboxShape = new THREE.Shape();
pegboxShape.moveTo(-0.22, 5.25);
pegboxShape.bezierCurveTo(-0.31, 5.66, -0.36, 6.07, -0.18, 6.38);
pegboxShape.bezierCurveTo(0.01, 6.64, 0.25, 6.43, 0.26, 6.12);
pegboxShape.lineTo(0.22, 5.25);
pegboxShape.closePath();
const pegbox = new THREE.Mesh(
  new THREE.ExtrudeGeometry(pegboxShape, {
    depth: 0.25,
    bevelEnabled: true,
    bevelSegments: 3,
    bevelSize: 0.045,
    bevelThickness: 0.04
  }),
  glassMaterial(0x173e91, 0x001848)
);
pegbox.position.z = 0.08;
pegbox.castShadow = true;
violin.add(pegbox);

violin.add(tubeFromPoints([
  [-0.16, 6.25, 0.3],
  [-0.25, 6.52, 0.3],
  [-0.08, 6.78, 0.3],
  [0.23, 6.77, 0.3],
  [0.38, 6.54, 0.3],
  [0.27, 6.34, 0.3],
  [0.06, 6.38, 0.3],
  [0.03, 6.54, 0.3],
  [0.16, 6.6, 0.3]
], 0.065, leadMaterial, false, 88));

const pegStemGeo = new THREE.CylinderGeometry(0.055, 0.055, 0.92, 14);
const pegHeadGeo = new THREE.SphereGeometry(0.18, 18, 12);
[
  { y: 5.56, side: 1 },
  { y: 5.83, side: -1 },
  { y: 6.08, side: 1 },
  { y: 6.31, side: -1 }
].forEach((peg, i) => {
  const stem = new THREE.Mesh(pegStemGeo, leadMaterial);
  stem.rotation.z = Math.PI / 2;
  stem.position.set(0, peg.y, 0.15);
  violin.add(stem);
  const head = new THREE.Mesh(pegHeadGeo, glassMaterials[i % 2 === 0 ? 2 : 4]);
  head.position.set(peg.side * 0.53, peg.y, 0.15);
  head.scale.set(1.45, 0.7, 0.55);
  head.castShadow = true;
  violin.add(head);
});

const stringMaterial = new THREE.MeshStandardMaterial({
  color: 0x181310,
  metalness: 0.92,
  roughness: 0.22,
  emissive: 0x9e4c12,
  emissiveIntensity: 0.38
});
[-0.075, -0.025, 0.025, 0.075].forEach((x, i) => {
  const topX = [-0.12, -0.04, 0.05, 0.14][i];
  const string = tubeFromPoints([
    [x * 2.25, -2.35, 0.56],
    [x * 1.2, -0.08, 0.64],
    [x, 2.5, 0.49],
    [x * 0.7, 5.25, 0.42],
    [topX, 6.2, 0.39]
  ], 0.012, stringMaterial, false, 100);
  violin.add(string);
});

const nut = new THREE.Mesh(
  new THREE.BoxGeometry(0.45, 0.08, 0.13),
  glassMaterial(0xe7b44d, 0x6a3c00)
);
nut.position.set(0, 5.27, 0.45);
violin.add(nut);

const halo = new THREE.Mesh(
  new THREE.PlaneGeometry(7.8, 11.8),
  new THREE.MeshBasicMaterial({
    color: 0x8b3b0e,
    transparent: true,
    opacity: 0.075,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
halo.position.set(0, 0.25, -1.25);
violin.add(halo);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({
    color: 0x08090c,
    roughness: 0.78,
    metalness: 0.08,
    transparent: true,
    opacity: 0.72
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -4.55;
floor.receiveShadow = true;
scene.add(floor);

const warmBacklight = new THREE.PointLight(0xff8a28, 115, 21, 1.75);
warmBacklight.position.set(0, 0.8, -3.6);
scene.add(warmBacklight);

const amberLight = new THREE.PointLight(0xffbd55, 38, 13, 2);
amberLight.position.set(-4.2, 1.3, 3.8);
scene.add(amberLight);

const blueRim = new THREE.PointLight(0x386dcc, 34, 14, 2);
blueRim.position.set(4.3, 2.6, 2);
scene.add(blueRim);

const keyLight = new THREE.DirectionalLight(0xffe4bd, 3.1);
keyLight.position.set(-3.5, 7, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.left = -6;
keyLight.shadow.camera.right = 6;
keyLight.shadow.camera.top = 9;
keyLight.shadow.camera.bottom = -7;
keyLight.shadow.bias = -0.0004;
scene.add(keyLight);

scene.add(new THREE.HemisphereLight(0x556789, 0x1b0b04, 1.25));

const jewelLights = [
  { color: 0xd52131, x: -1.15, y: -1.6 },
  { color: 0x245fc1, x: 1.1, y: 1.55 },
  { color: 0xf3a524, x: -0.8, y: 2.05 }
];
jewelLights.forEach(j => {
  const light = new THREE.PointLight(j.color, 5.5, 4.5, 2);
  light.position.set(j.x, j.y - 1.35, 1.4);
  scene.add(light);
});

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  warmBacklight.intensity = 112 + Math.sin(t * 1.15) * 5;
  violin.rotation.z = Math.sin(t * 0.32) * 0.009;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
