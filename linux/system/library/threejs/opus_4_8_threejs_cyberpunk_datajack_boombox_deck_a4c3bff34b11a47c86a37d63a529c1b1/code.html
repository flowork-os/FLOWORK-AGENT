<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cyberpunk Deck Turntable</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#0a0a0c; }
  canvas { display:block; }
  #hint {
    position:fixed; left:14px; bottom:12px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(160,255,170,.32); pointer-events:none; user-select:none;
  }
</style>
</head>
<body>
<div id="hint">drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- renderer / scene / camera ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0c10);
scene.fog = new THREE.FogExp2(0x0b0c10, 0.05);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.02, 100);
camera.position.set(0.66, 0.46, 0.80);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 0.35;
controls.maxDistance = 2.6;
controls.maxPolarAngle = Math.PI * 0.495;
controls.target.set(0, 0.09, 0);

/* ---------------- deterministic rng ---------------- */
let _seed = 1337;
function rnd() { _seed = (_seed * 1664525 + 1013904223) % 4294967296; return _seed / 4294967296; }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* ---------------- palette ---------------- */
const ACID = 0x9dff2f, PINK = 0xff2a86, CYAN = 0x28e0ff, AMBER = 0xffb03a;

/* ---------------- procedural textures ---------------- */
function makeRoughTexture(base = 170, contrast = 40, repeat = 1) {
  const S = 256, c = mkCanvas(S, S), g = c.getContext('2d');
  g.fillStyle = `rgb(${base},${base},${base})`; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 300; i++) {
    const x = rnd() * S, y = rnd() * S, r = 3 + rnd() * 34;
    const v = Math.max(0, Math.min(255, base + (rnd() - 0.5) * contrast * 2)) | 0;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, `rgba(${v},${v},${v},0.5)`); grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat);
  return t;
}

function makeScuffTexture(base = '#22252b', repeat = 1) {
  const S = 512, c = mkCanvas(S, S), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 240; i++) {
    const x = rnd() * S, y = rnd() * S, r = 6 + rnd() * 60, a = 0.012 + rnd() * 0.05;
    const light = rnd() > 0.55;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, light ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a * 1.6})`);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  for (let i = 0; i < 130; i++) {
    const x = rnd() * S, y = rnd() * S, len = 8 + rnd() * 90, ang = rnd() * Math.PI * 2;
    g.strokeStyle = `rgba(255,255,255,${0.02 + rnd() * 0.07})`;
    g.lineWidth = rnd() < 0.8 ? 1 : 1.8;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); t.anisotropy = 8;
  return t;
}

function makeCarbonTexture(repeat = 10) {
  const S = 128, cell = 16, c = mkCanvas(S, S), g = c.getContext('2d');
  g.fillStyle = '#111318'; g.fillRect(0, 0, S, S);
  for (let y = 0; y < S; y += cell) for (let x = 0; x < S; x += cell) {
    const h = ((x / cell) + (y / cell)) % 2 === 0;
    const grd = h ? g.createLinearGradient(x, y, x, y + cell) : g.createLinearGradient(x, y, x + cell, y);
    grd.addColorStop(0, '#0b0d10'); grd.addColorStop(0.5, '#262a31'); grd.addColorStop(1, '#0b0d10');
    g.fillStyle = grd; g.fillRect(x, y, cell, cell);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); t.anisotropy = 8;
  return t;
}

function makeFacePlateTexture() {
  const W = 1024, H = 1024, c = mkCanvas(W, H), g = c.getContext('2d');
  g.fillStyle = '#1a1d22'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 500; i++) {
    const x = rnd() * W, y = rnd() * H, r = 8 + rnd() * 80;
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    const light = rnd() > 0.5;
    grd.addColorStop(0, light ? `rgba(255,255,255,${rnd() * 0.05})` : `rgba(0,0,0,${rnd() * 0.09})`);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  for (let i = 0; i < 200; i++) {
    g.strokeStyle = `rgba(255,255,255,${0.02 + rnd() * 0.06})`; g.lineWidth = 1;
    const x = rnd() * W, y = rnd() * H, a = rnd() * Math.PI * 2, l = 10 + rnd() * 100;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  g.fillStyle = 'rgba(215,225,240,0.5)';
  g.font = 'bold 40px ui-monospace, Menlo, monospace';
  g.textAlign = 'left';
  g.fillText('KRSH-9000', 120, 900);
  g.fillStyle = 'rgba(157,255,47,0.45)';
  g.font = '20px ui-monospace, monospace';
  g.fillText('DIRECT-MAGLEV / QUARTZ LOCK', 120, 932);
  g.fillStyle = 'rgba(200,210,225,0.26)';
  g.font = '18px ui-monospace, monospace';
  g.textAlign = 'right';
  g.fillText('SN 84-0117', W - 70, 100);
  g.fillText('100-240V ~ 50/60Hz', W - 70, 124);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

function makeVinylTexture() {
  const S = 1024, R = S / 2, c = mkCanvas(S, S), g = c.getContext('2d');
  g.fillStyle = '#08080a'; g.fillRect(0, 0, S, S);
  for (let r = R * 0.985; r > R * 0.30; r -= 1.5) {
    g.strokeStyle = `rgba(255,255,255,${0.02 + rnd() * 0.03})`; g.lineWidth = 0.8;
    g.beginPath(); g.arc(R, R, r, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = 'rgba(0,0,0,0.30)'; g.lineWidth = 0.7;
    g.beginPath(); g.arc(R, R, r - 0.7, 0, Math.PI * 2); g.stroke();
  }
  const lg = g.createRadialGradient(R, R, 0, R, R, R * 0.295);
  lg.addColorStop(0, '#16201a'); lg.addColorStop(0.7, '#101a14'); lg.addColorStop(1, '#0a120e');
  g.fillStyle = lg; g.beginPath(); g.arc(R, R, R * 0.295, 0, Math.PI * 2); g.fill();
  g.strokeStyle = 'rgba(157,255,47,0.7)'; g.lineWidth = 3;
  g.beginPath(); g.arc(R, R, R * 0.265, 0, Math.PI * 2); g.stroke();
  g.lineWidth = 1.2;
  g.beginPath(); g.arc(R, R, R * 0.22, 0, Math.PI * 2); g.stroke();
  g.save(); g.translate(R, R);
  g.fillStyle = 'rgba(157,255,47,0.85)';
  g.font = 'bold 26px ui-monospace, monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const chars = 'NEON//SUBSTRATE - KRSH-009 - '.split('');
  const step = (Math.PI * 2) / chars.length;
  for (let i = 0; i < chars.length; i++) {
    g.save(); g.rotate(i * step); g.translate(0, -R * 0.243);
    g.fillText(chars[i], 0, 0); g.restore();
  }
  g.restore();
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = 'rgba(255,42,134,0.75)';
  g.font = 'bold 44px "Hiragino Kaku Gothic ProN","Yu Gothic","MS Gothic",sans-serif';
  g.fillText('ダブ', R, R - 34);
  g.fillStyle = 'rgba(230,240,255,0.55)';
  g.font = '20px ui-monospace, monospace';
  g.fillText('SIDE  A', R, R + 26);
  g.fillText('45 RPM', R, R + 50);
  g.fillStyle = '#000'; g.beginPath(); g.arc(R, R, R * 0.024, 0, Math.PI * 2); g.fill();
  for (let i = 0; i < 800; i++) {
    const a = rnd() * Math.PI * 2, rr = R * (0.30 + rnd() * 0.69);
    g.fillStyle = `rgba(255,255,255,${rnd() * 0.05})`;
    g.fillRect(R + Math.cos(a) * rr, R + Math.sin(a) * rr, 1 + rnd() * 2, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16;
  return t;
}

function makeStrobeTexture() {
  const W = 2048, H = 64, c = mkCanvas(W, H), g = c.getContext('2d');
  g.fillStyle = '#1d2026'; g.fillRect(0, 0, W, H);
  const rows = [
    { n: 92, y: 10, col: 'rgba(230,238,248,0.85)' },
    { n: 76, y: 24, col: 'rgba(200,212,226,0.7)' },
    { n: 60, y: 38, col: 'rgba(180,192,208,0.6)' },
    { n: 44, y: 52, col: 'rgba(157,255,47,0.55)' }
  ];
  rows.forEach(r => {
    const step = W / r.n; g.fillStyle = r.col;
    for (let i = 0; i < r.n; i++) g.fillRect(i * step + step * 0.28, r.y - 4, step * 0.42, 8);
  });
  for (let i = 0; i < 200; i++) { g.fillStyle = `rgba(0,0,0,${rnd() * 0.25})`; g.fillRect(rnd() * W, rnd() * H, rnd() * 30, rnd() * 4); }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = THREE.RepeatWrapping; t.anisotropy = 16;
  return t;
}

function makeHazardTexture() {
  const W = 512, H = 320, c = mkCanvas(W, H), g = c.getContext('2d');
  g.fillStyle = '#f2c024'; g.fillRect(0, 0, W, H);
  g.save(); g.beginPath(); g.rect(0, 0, W, H); g.clip();
  g.strokeStyle = '#101216'; g.lineWidth = 26;
  for (let x = -H; x < W + H; x += 52) { g.beginPath(); g.moveTo(x, -10); g.lineTo(x + H + 20, H + 10); g.stroke(); }
  g.restore();
  g.fillStyle = '#f2c024'; g.fillRect(24, 96, W - 48, 128);
  g.strokeStyle = '#101216'; g.lineWidth = 7; g.strokeRect(24, 96, W - 48, 128);
  g.fillStyle = '#101216'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = 'bold 50px "Hiragino Kaku Gothic ProN","Yu Gothic","MS Gothic",monospace';
  g.fillText('高電圧 危険', W / 2, 140);
  g.font = 'bold 26px ui-monospace, Menlo, monospace';
  g.fillText('HIGH VOLTAGE - DO NOT OPEN', W / 2, 192);
  g.beginPath(); g.moveTo(W / 2, 34); g.lineTo(W / 2 + 32, 84); g.lineTo(W / 2 - 32, 84); g.closePath();
  g.fillStyle = '#101216'; g.fill();
  g.fillStyle = '#f2c024'; g.font = 'bold 30px ui-monospace, monospace'; g.fillText('!', W / 2, 74);
  for (let i = 0; i < 300; i++) { g.fillStyle = `rgba(30,26,14,${rnd() * 0.16})`; g.fillRect(rnd() * W, rnd() * H, rnd() * 26, rnd() * 5); }
  for (let i = 0; i < 60; i++) { g.fillStyle = `rgba(255,255,255,${rnd() * 0.22})`; g.fillRect(rnd() * W, rnd() * H, rnd() * 40, 1.5); }
  const img = g.getImageData(0, 0, W, H), d = img.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y * W + x) * 4;
    let a = 255;
    const edge = Math.min(x, y, W - 1 - x, H - 1 - y);
    const wob = 3 + Math.sin(x * 0.13 + y * 0.07) * 2.4 + Math.sin(y * 0.21) * 2.0;
    if (edge < wob) a = 0;
    if ((x - (W - 122)) + (76 - y) > 0) a = 0;   // peeled corner cut
    d[i + 3] = a;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

function makePeelBackTexture() {
  const S = 256, c = mkCanvas(S, S), g = c.getContext('2d');
  g.fillStyle = '#c9bda3'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(90,78,58,${rnd() * 0.28})`; g.fillRect(rnd() * S, rnd() * S, rnd() * 22, rnd() * 4); }
  for (let i = 0; i < 120; i++) { g.fillStyle = `rgba(255,255,255,${rnd() * 0.25})`; g.fillRect(rnd() * S, rnd() * S, rnd() * 12, rnd() * 3); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

function makeTapeTexture() {
  const W = 256, H = 64, c = mkCanvas(W, H), g = c.getContext('2d');
  g.fillStyle = '#191b1f'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 200; i++) { g.fillStyle = `rgba(255,255,255,${rnd() * 0.10})`; g.fillRect(rnd() * W, rnd() * H, rnd() * 30, 1); }
  for (let i = 0; i < 60; i++) { g.fillStyle = `rgba(0,0,0,${rnd() * 0.4})`; g.fillRect(rnd() * W, rnd() * H, rnd() * 18, rnd() * 4); }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

function makeRibbonTexture() {
  const W = 16, H = 128, c = mkCanvas(W, H), g = c.getContext('2d');
  const cols = ['#4a4f57', '#6b7078', '#3a3e45', '#5a606a', '#2f333a', '#7b818b',
                '#454a52', '#63686f', '#33373d', '#565b63', '#3d4249', '#6e747d'];
  const bw = H / cols.length;
  cols.forEach((col, i) => {
    const grd = g.createLinearGradient(0, i * bw, 0, (i + 1) * bw);
    grd.addColorStop(0, '#101216'); grd.addColorStop(0.4, col);
    grd.addColorStop(0.6, col); grd.addColorStop(1, '#101216');
    g.fillStyle = grd; g.fillRect(0, i * bw, W, bw);
  });
  g.fillStyle = '#b9303a'; g.fillRect(0, 0, W, bw * 0.7);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

/* ---------------- cracked LCD (animated) ---------------- */
const KATA = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲンガギグゲゴザジズゼゾバビブベボパピプペポ';
const LCD_W = 512, LCD_H = 192;
const lcdCanvas = mkCanvas(LCD_W, LCD_H);
const lcdCtx = lcdCanvas.getContext('2d');
const lcdTexture = new THREE.CanvasTexture(lcdCanvas);
lcdTexture.colorSpace = THREE.SRGBColorSpace;
lcdTexture.anisotropy = 8;

const CRACKS = (() => {
  const paths = [];
  const ox = LCD_W * 0.71, oy = LCD_H * 0.34;
  for (let i = 0; i < 7; i++) {
    const pts = [{ x: ox, y: oy }];
    let a = (i / 7) * Math.PI * 2 + rnd() * 0.6, x = ox, y = oy;
    const segs = 4 + Math.floor(rnd() * 4);
    for (let s = 0; s < segs; s++) {
      const len = 16 + rnd() * 52;
      a += (rnd() - 0.5) * 0.9;
      x += Math.cos(a) * len; y += Math.sin(a) * len;
      pts.push({ x, y });
    }
    paths.push(pts);
  }
  paths.push([{ x: 8, y: 22 }, { x: 130, y: 58 }, { x: 250, y: 40 }, { x: 372, y: 88 }, { x: 504, y: 70 }]);
  paths.push([{ x: 40, y: 184 }, { x: 128, y: 128 }, { x: 236, y: 150 }, { x: 340, y: 112 }, { x: 470, y: 160 }]);
  return paths;
})();

function randKata(n) {
  let s = '';
  for (let i = 0; i < n; i++) {
    s += (rnd() < 0.13) ? ' ' + '0123456789#/*<>'[Math.floor(rnd() * 15)] + ' ' : KATA[Math.floor(rnd() * KATA.length)];
  }
  return s;
}
const lcdRows = [
  { y: 46, speed: 34, x: 0, size: 30, txt: '' },
  { y: 94, speed: -22, x: 0, size: 26, txt: '' },
  { y: 142, speed: 46, x: 0, size: 22, txt: '' }
];
lcdRows.forEach(r => { r.txt = randKata(40) + '  ' + randKata(40) + '  '; });

function drawLCD(time, dt) {
  const g = lcdCtx;
  g.fillStyle = '#04120e'; g.fillRect(0, 0, LCD_W, LCD_H);
  const bl = g.createLinearGradient(0, 0, 0, LCD_H);
  bl.addColorStop(0, 'rgba(20,90,70,0.55)');
  bl.addColorStop(0.5, 'rgba(10,55,42,0.35)');
  bl.addColorStop(1, 'rgba(24,100,76,0.5)');
  g.fillStyle = bl; g.fillRect(0, 0, LCD_W, LCD_H);

  g.fillStyle = 'rgba(0,0,0,0.5)';
  for (let i = 0; i < 9; i++) {
    const x = 352 + i * 17 + Math.sin(time * 2 + i) * 1.5;
    g.fillRect(x, 0, 2 + (i % 3), LCD_H);
  }

  g.fillStyle = 'rgba(157,255,47,0.16)'; g.fillRect(0, 0, LCD_W, 20);
  g.fillStyle = 'rgba(190,255,140,0.85)';
  g.font = 'bold 14px ui-monospace, Menlo, monospace';
  g.textAlign = 'left'; g.textBaseline = 'middle';
  const bpm = (128 + Math.sin(time * 0.7) * 0.4).toFixed(1);
  g.fillText('TRK 07   BPM ' + bpm + '   PITCH ' + (Math.sin(time * 0.5) * 7.9).toFixed(1) + '%', 8, 11);
  g.textAlign = 'right';
  g.fillText((Math.sin(time * 3) > 0 ? 'SYNC ●' : 'SYNC ○'), LCD_W - 8, 11);
  g.textAlign = 'left';

  lcdRows.forEach((r, ri) => {
    r.x -= r.speed * dt;
    const glitch = rnd() < 0.07;
    g.save();
    g.beginPath(); g.rect(0, 22, LCD_W, LCD_H - 22); g.clip();
    g.font = `${r.size}px "Hiragino Kaku Gothic ProN","Yu Gothic","MS Gothic","Noto Sans JP",monospace`;
    g.textBaseline = 'middle';
    const wApprox = Math.max(1, g.measureText(r.txt).width);
    const x0 = ((r.x % wApprox) + wApprox) % wApprox - wApprox;
    const yj = glitch ? (rnd() - 0.5) * 8 : 0;
    for (let pass = 0; pass < 3; pass++) {
      const px = x0 + pass * wApprox;
      g.fillStyle = 'rgba(255,42,134,0.30)'; g.fillText(r.txt, px + 2.2, r.y + yj);
      g.fillStyle = 'rgba(40,224,255,0.28)'; g.fillText(r.txt, px - 2.2, r.y + yj);
      g.fillStyle = ri === 1 ? 'rgba(210,255,180,0.92)' : 'rgba(170,255,120,0.88)';
      g.fillText(r.txt, px, r.y + yj);
    }
    g.restore();
    if (glitch) {
      const sh = 6 + Math.floor(rnd() * 14);
      const sy = Math.floor(24 + rnd() * (LCD_H - 44));
      const dx = Math.round((rnd() - 0.5) * 40);
      const slice = g.getImageData(0, sy, LCD_W, sh);
      g.putImageData(slice, dx, sy);
    }
  });

  if (rnd() < 0.1) {
    g.fillStyle = `rgba(255,42,134,${0.10 + rnd() * 0.22})`;
    g.fillRect(0, rnd() * LCD_H, LCD_W, 3 + rnd() * 10);
  }

  g.fillStyle = 'rgba(0,0,0,0.28)';
  for (let y = 0; y < LCD_H; y += 3) g.fillRect(0, y, LCD_W, 1);

  const bx = LCD_W * 0.71, by = LCD_H * 0.34;
  const blot = g.createRadialGradient(bx, by, 2, bx, by, 48);
  blot.addColorStop(0, 'rgba(0,0,0,0.92)');
  blot.addColorStop(0.55, 'rgba(4,14,12,0.55)');
  blot.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = blot;

function roundedBox(w, d, h, r, seg = 5) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -d / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + d - r); s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
  s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  const geo = new THREE.ExtrudeGeometry(s, {
    depth: h, bevelEnabled: true, bevelThickness: 0.0025,
    bevelSize: 0.0025, bevelSegments: 2, curveSegments: seg
  });
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, h, 0);
  geo.computeVertexNormals();
  return geo;
}

function addMesh(geo, mat, parent = deck, cast = true, recv = true) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast; m.receiveShadow = recv;
  parent.add(m);
  return m;
}

    p.setX(i, x * (1 - 0.12 * t));
    p.setY(i, -PL / 2 + R * Math.sin(bend));
    p.setZ(i, R * (1 - Math.cos(bend)) + sag);
  }
  peelGeo.computeVertexNormals();
}

function makeRibbon(points, width, thickness = 0.0008, twist = 0) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], p[1], p[2])), false, 'catmullrom', 0.4);
  const SEG = 80, pos = [], uvs = [], idx = [];
  const fr = curve.computeFrenetFrames(SEG, false);
  for (let i = 0; i <= SEG; i++) {
    const t = i / SEG;
    const p = curve.getPointAt(t);
    const N = fr.normals[i], B = fr.binormals[i];
    const tw = Math.sin(t * Math.PI * 2) * twist;
    const ca = Math.cos(tw), sa = Math.sin(tw);
    const U = N.clone().multiplyScalar(ca).add(B.clone().multiplyScalar(sa));
    const V = N.clone().multiplyScalar(-sa).add(B.clone().multiplyScalar(ca));
    const hw = width / 2, ht = thickness / 2;
    const corners = [
      p.clone().addScaledVector(U, -hw).addScaledVector(V, ht),
      p.clone().addScaledVector(U, hw).addScaledVector(V, ht),
      p.clone().addScaledVector(U, hw).addScaledVector(V, -ht),
      p.clone().addScaledVector(U, -hw).addScaledVector(V, -ht)
    ];
    corners.forEach((c, k) => {
      pos.push(c.x, c.y, c.z);
      uvs.push(t * 6, (k === 0 || k === 3) ? 0 : 1);
    });
  }
  for (let i = 0; i < SEG; i++) {
    const a = i * 4, b = (i + 1) * 4;
    for (let k = 0; k < 4; k++) {
      const k2 = (k + 1) % 4;
      idx.push(a + k, b + k, b + k2, a + k, b + k2, a + k2);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, ribbonMat);
  m.castShadow = true; m.receiveShadow = true;
  deck.add(m);
  return m;
}

/* ---------------- animation ---------------- */
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  // platter spins (33 1/3 rpm) with a faint maglev wobble
  platter.rotation.y -= dt * (2 * Math.PI * 33.333 / 60);
  const bob = Math.sin(elapsed * 1.7) * 0.00035 + Math.sin(elapsed * 3.9) * 0.0002;
  platter.position.y = TOP_Y + HOVER + bob;
  platter.rotation.x = Math.sin(elapsed * 1.3) * 0.0016;
  platter.rotation.z = Math.cos(elapsed * 1.1) * 0.0016;

  // levitation field pulse
  const fieldPulse = 0.38 + Math.sin(elapsed * 2.4) * 0.14;
  fieldRing.material.opacity = fieldPulse;
  gapGlow.material.opacity = 0.20 + Math.sin(elapsed * 2.4 + 0.6) * 0.09;
  underRing.material.opacity = 0.34 + Math.sin(elapsed * 3.1) * 0.10;
  platterGlowL.intensity = 1.4 + Math.sin(elapsed * 2.4) * 0.45;

  // EL strip breathing
  const elPulse = 0.82 + Math.sin(elapsed * 2.0) * 0.16;
  elMat.color.setHex(ACID).multiplyScalar(elPulse);
  elGlowMat.opacity = 0.16 + Math.sin(elapsed * 2.0) * 0.06;
  faderGlowL.intensity = 1.5 + Math.sin(elapsed * 2.0) * 0.4;

  // pitch fader drifts along its travel
  knob.position.z = Math.sin(elapsed * 0.42) * (FL * 0.36);

  // underglow flicker
  const flick = 0.86 + Math.sin(elapsed * 5.1) * 0.06 + Math.sin(elapsed * 11.3) * 0.03;
  glowStripMat.opacity = 0.7 * flick + 0.25;
  underL.intensity = 4.0 * flick;
  underR.intensity = 4.0 * flick;
  halo.material.opacity = 0.72 * flick;

  // hot-cue pads pulse on the beat
  const beat = (elapsed * (128 / 60)) % 4;
  pads.forEach((p, i) => {
    const on = Math.floor(beat) === i;
    const target = on ? 2.4 : 0.55;
    p.material.emissiveIntensity += (target - p.material.emissiveIntensity) * Math.min(1, dt * 12);
  });
  ssBtnMat.emissiveIntensity = 0.9 + Math.sin(elapsed * 4.0) * 0.35;

  // VU meter
  const level = 0.55 + Math.sin(elapsed * 3.3) * 0.22 + Math.sin(elapsed * 8.7) * 0.14;
  vuLeds.forEach(l => {
    const lit = (l.idx / 12) < level;
    const target = lit ? 0.95 : 0.08;
    l.mat.opacity += (target - l.mat.opacity) * Math.min(1, dt * 14);
  });

  // stylus indicator blink
  stylusLed.visible = Math.sin(elapsed * 6.0) > -0.3;

  drawLCD(elapsed, dt);
  lcdGlowL.intensity = 0.85 + Math.sin(elapsed * 7.0) * 0.25;

  controls.update();
  renderer.render(scene, camera);
}
animate();

  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
