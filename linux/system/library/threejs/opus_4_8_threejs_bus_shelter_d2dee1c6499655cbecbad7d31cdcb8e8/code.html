<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bus Shelter — three.js</title>
<style>
  html, body { margin: 0; height: 100%; background: #16171a; overflow: hidden; }
  #info {
    position: fixed; left: 12px; bottom: 10px; z-index: 10;
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: #9aa0a6; letter-spacing: .02em; user-select: none; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="info">Bus shelter · procedural three.js · drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- Renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

/* ---------- Scene / Camera ---------- */
const scene = new THREE.Scene();
const BG = new THREE.Color(0x1a1b1e);
scene.background = BG;
scene.fog = new THREE.Fog(BG, 14, 34);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(6.2, 3.4, 6.6);

/* Environment for realistic metal / glass reflections (procedural) */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ---------- Lighting ---------- */
const hemi = new THREE.HemisphereLight(0xbfd4ff, 0x2a2620, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2e2, 2.6);
key.position.set(6.5, 9.5, 5.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 32;
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -6;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fb8ff, 0.7);
fill.position.set(-7, 4, 3);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.1);
rim.position.set(-3, 5.5, -7);
scene.add(rim);

/* ---------- Ground (shadow-only) + concrete pad ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------- Shelter group ---------- */
const shelter = new THREE.Group();
scene.add(shelter);

/* Dimensions (metres) */
const L = 4.0;          // length (X)
const D = 1.5;          // depth  (Z)
const H = 2.35;         // post height
const P = 0.07;         // post section
const cornerX = L / 2 - P / 2;   // 1.965
const cornerZ = D / 2 - P / 2;   // 0.715

/* Materials */
const matAlu = new THREE.MeshStandardMaterial({ color: 0xc2c7cc, metalness: 0.95, roughness: 0.34, envMapIntensity: 1.1 });
const matAluDark = new THREE.MeshStandardMaterial({ color: 0x33363b, metalness: 0.85, roughness: 0.5, envMapIntensity: 0.9 });
const matRoof = new THREE.MeshStandardMaterial({ color: 0xd8dbde, metalness: 0.55, roughness: 0.42, side: THREE.DoubleSide, envMapIntensity: 1.0 });
const matWood = new THREE.MeshStandardMaterial({ color: 0x8a5a33, roughness: 0.55, metalness: 0.0 });
const matConcrete = new THREE.MeshStandardMaterial({ color: 0x8f9195, roughness: 0.95, metalness: 0.0 });
const matGlass = new THREE.MeshPhysicalMaterial({
  color: 0xaecdd2, metalness: 0.0, roughness: 0.06,
  transmission: 0.92, transparent: true, thickness: 0.04,
  ior: 1.46, reflectivity: 0.28, clearcoat: 0.35, clearcoatRoughness: 0.18,
  envMapIntensity: 1.3, side: THREE.DoubleSide
});

/* Procedural advertising poster */
function makePoster() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 720;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 720);
  g.addColorStop(0.0, '#173357');
  g.addColorStop(0.5, '#2f6fae');
  g.addColorStop(1.0, '#9fd0ea');
  x.fillStyle = g; x.fillRect(0, 0, 512, 720);
  x.fillStyle = 'rgba(255,238,190,0.35)'; x.beginPath(); x.arc(372, 190, 140, 0, Math.PI * 2); x.fill();
  x.fillStyle = 'rgba(255,226,150,0.98)'; x.beginPath(); x.arc(372, 190, 82, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#245a4a'; x.beginPath();
  x.moveTo(0, 540); x.quadraticCurveTo(150, 440, 300, 520);
  x.quadraticCurveTo(430, 566, 512, 498); x.lineTo(512, 720); x.lineTo(0, 720); x.closePath(); x.fill();
  x.fillStyle = '#1b4636'; x.beginPath();
  x.moveTo(0, 604); x.quadraticCurveTo(185, 522, 342, 592);
  x.quadraticCurveTo(452, 632, 512, 592); x.lineTo(512, 720); x.lineTo(0, 720); x.closePath(); x.fill();
  x.fillStyle = 'rgba(255,255,255,0.94)'; x.fillRect(38, 596, 436, 96);
  x.textBaseline = 'middle';
  x.fillStyle = '#12263b'; x.font = '700 54px Helvetica, Arial, sans-serif';
  x.fillText('EXPLORE', 58, 630);
  x.fillStyle = '#2f6fae'; x.font = '700 30px Helvetica, Arial, sans-serif';
  x.fillText('THE COAST — BY BUS', 58, 672);
  x.fillStyle = 'rgba(255,255,255,0.92)'; x.font = '700 27px Helvetica, Arial, sans-serif';
  x.fillText('CITY TRANSIT', 40, 58);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 8;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const posterTex = makePoster();
const matPoster = new THREE.MeshStandardMaterial({
  map: posterTex, emissive: 0xffffff, emissiveMap: posterTex,
  emissiveIntensity: 0.55, roughness: 0.5, metalness: 0.0
});

/* Helper */
function box(w, h, d, mat, px, py, pz, cast = true, recv = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(px, py, pz);
  m.castShadow = cast; m.receiveShadow = recv;
  shelter.add(m);
  return m;
}

/* ---------- Concrete pad ---------- */
box(L + 0.7, 0.07, D + 0.7, matConcrete, 0, 0.035, 0, false, true);

/* ---------- Posts ---------- */
const postPos = [
  [ cornerX,  cornerZ], [-cornerX,  cornerZ],
  [ cornerX, -cornerZ], [-cornerX, -cornerZ],
  [0,  cornerZ], [0, -cornerZ]
];
for (const [px, pz] of postPos) {
  box(P, H, P, matAlu, px, H / 2 + 0.06, pz);
  box(0.17, 0.03, 0.17, matAluDark, px, 0.085, pz); // base plate
}

/* ---------- Header beams (tie posts under roof) ---------- */
const beamY = H - 0.02;
box(2 * cornerX + P, 0.08, 0.08, matAlu, 0, beamY, -cornerZ);
box(2 * cornerX + P, 0.08, 0.08, matAlu, 0, beamY,  cornerZ);
box(0.08, 0.08, 2 * cornerZ + P, matAlu, -cornerX, beamY, 0);
box(0.08, 0.08, 2 * cornerZ + P, matAlu,  cornerX, beamY, 0);

/* ---------- Curved roof canopy with gutter fascia ---------- */
const roofLen = L + 0.36;         // along X
const roofDepth = D + 0.34;       // along Z
const rt = 0.09;                  // thickness
const arch = 0.10, slopeF = 0.10; // gentle dome + drainage slope
const N = 30;
const top = [], bot = [];
for (let i = 0; i <= N; i++) {
  const t = i / N;
  const p = -roofDepth / 2 + t * roofDepth;
  const c = arch * Math.sin(Math.PI * t) - slopeF * t;
  top.push([p, c + rt / 2]);
  bot.push([p, c - rt / 2]);
}
const roofShape = new THREE.Shape();
roofShape.moveTo(top[0][0], top[0][1]);
for (let i = 1; i <= N; i++) roofShape.lineTo(top[i][0], top[i][1]);
for (let i = N; i >= 0; i--) roofShape.lineTo(bot[i][0], bot[i][1]);
roofShape.closePath();
const roofGeo = new THREE.ExtrudeGeometry(roofShape, { depth: roofLen, bevelEnabled: false, steps: 1 });
roofGeo.translate(0, 0, -roofLen / 2);
const roofY = H + 0.045;
const roof = new THREE.Mesh(roofGeo, matRoof);
roof.rotation.y = -Math.PI / 2;
roof.position.y = roofY;
roof.castShadow = true; roof.receiveShadow = true;
shelter.add(roof);

/* Gutter fascia along the front edge (visible drip/gutter band) */
const frontZ = roofDepth / 2;   // world Z of front edge
box(roofLen, 0.20, 0.045, matAluDark, 0, roofY - 0.115, frontZ + 0.01, true, false);
/* Slim gutter lip along the back edge too */
box(roofLen, 0.12, 0.04, matAluDark, 0, roofY - 0.10, -roofDepth / 2 - 0.01, true, false);

/* ---------- Glazing (back + one side) ---------- */
const gB = 0.16, gT = H - 0.10;           // glass bottom / top
const gH = gT - gB, gCy = (gB + gT) / 2;

/* Back glass: two panels + central mullion */
const backZ = -cornerZ + 0.05;
const panelW = cornerX - 0.12;
box(panelW, gH, 0.02, matGlass, -(cornerX / 2 + 0.02), gCy, backZ, false, false);
box(panelW, gH, 0.02, matGlass,  (cornerX / 2 + 0.02), gCy, backZ, false, false);
box(2 * cornerX, 0.06, 0.06, matAlu, 0, gT + 0.02, backZ);   // top rail
box(2 * cornerX, 0.06, 0.06, matAlu, 0, gB - 0.02, backZ);   // bottom rail
box(0.05, gH, 0.06, matAlu, 0, gCy, backZ);                  // centre mullion

/* Side glass: left (-X) end */
const sideX = -cornerX + 0.05;
const sideW = 2 * cornerZ - 0.06;
box(0.02, gH, sideW, matGlass, sideX, gCy, 0, false, false);
box(0.06, 0.06, sideW, matAlu, sideX, gT + 0.02, 0);
box(0.06, 0.06, sideW, matAlu, sideX, gB - 0.02, 0);

/* ---------- Advertising panel on the +X end ---------- */
const adX = cornerX;
box(0.16, 2.0, 2 * cornerZ - 0.08, matAluDark, adX, 1.10, 0);   // frame box
const posterGeoW = 1.30, posterGeoH = 1.78;
const pOut = new THREE.Mesh(new THREE.PlaneGeometry(posterGeoW, posterGeoH), matPoster);
pOut.rotation.y = Math.PI / 2; pOut.position.set(adX + 0.083, 1.10, 0);
shelter.add(pOut);
const pIn = new THREE.Mesh(new THREE.PlaneGeometry(posterGeoW, posterGeoH), matPoster);
pIn.rotation.y = -Math.PI / 2; pIn.position.set(adX - 0.083, 1.10, 0);
shelter.add(pIn);

/* ---------- Bench along the back ---------- */
const benchLen = 2.55, benchX = -0.28, seatY = 0.45;
const seatZ = [-0.60, -0.48, -0.36, -0.24];
for (const z of seatZ) box(benchLen, 0.035, 0.08, matWood, benchX, seatY, z);
/* backrest slats */
const backY = [0.58, 0.70, 0.82];
for (const y of backY) box(benchLen, 0.075, 0.03, matWood, benchX, y, -0.66);
/* metal end + mid supports */
for (const sx of [benchX - benchLen / 2 + 0.12, benchX, benchX + benchLen / 2 - 0.12]) {
  box(0.05, seatY, 0.42, matAluDark, sx, seatY / 2, -0.44);
  box(0.05, 0.42, 0.05, matAluDark, sx, 0.66, -0.66);
}

/* ---------- Center the composed object ---------- */
const bb = new THREE.Box3().setFromObject(shelter);
const center = bb.getCenter(new THREE.Vector3());
shelter.position.x -= center.x;
shelter.position.z -= center.z;

/* Point key light at shelter mid-height */
key.target.position.set(0, 1.1, 0);
scene.add(key.target);

/* ---------- Controls ---------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.target.set(0, 1.15, 0);
controls.minDistance = 4;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.5;
controls.update();

/* ---------- Resize ---------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------- Render loop ---------- */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
