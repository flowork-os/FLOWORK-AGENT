<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Machined Stag Beetle</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080a0c; }
    canvas { display: block; }
    .caption {
      position: fixed;
      left: 24px;
      bottom: 20px;
      color: rgba(220, 225, 226, 0.66);
      font: 10px/1.5 system-ui, sans-serif;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="caption">Machined Stag Beetle · Brushed Aluminum / Anodized Bronze</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080a0c);
    scene.fog = new THREE.FogExp2(0x080a0c, 0.035);

    const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(7.8, 6.2, 9.3);
    camera.lookAt(0, 1.15, -0.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.15, -0.25);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.55;
    controls.minDistance = 6;
    controls.maxDistance = 18;
    controls.maxPolarAngle = Math.PI * 0.48;

    function makeGrainTexture(size = 512, vertical = false) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const context = canvas.getContext('2d');
      const image = context.createImageData(size, size);
      const data = image.data;

      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          const axis = vertical ? y : x;
          const cross = vertical ? x : y;
          const fine = Math.sin(axis * 1.9) * 10 + Math.sin(axis * 0.31) * 7;
          const waviness = Math.sin(cross * 0.027 + Math.sin(axis * 0.013)) * 4;
          const noise = (Math.random() - 0.5) * 18;
          const value = Math.max(0, Math.min(255, 128 + fine + waviness + noise));
          const index = (y * size + x) * 4;
          data[index] = value;
          data[index + 1] = value;
          data[index + 2] = value;
          data[index + 3] = 255;
        }
      }
      context.putImageData(image, 0, 0);

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(vertical ? 3 : 8, vertical ? 8 : 3);
      texture.colorSpace = THREE.NoColorSpace;
      texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return texture;
    }

    const aluminumGrain = makeGrainTexture(512, true);
    const bronzeGrain = makeGrainTexture(512, false);

    const aluminum = new THREE.MeshPhysicalMaterial({
      color: 0xb9c0c2,
      metalness: 1,
      roughness: 0.28,
      bumpMap: aluminumGrain,
      bumpScale: 0.025,
      anisotropy: 0.75,
      clearcoat: 0.12,
      clearcoatRoughness: 0.35
    });

    const darkAluminum = new THREE.MeshPhysicalMaterial({
      color: 0x4b5355,
      metalness: 1,
      roughness: 0.3,
      bumpMap: aluminumGrain,
      bumpScale: 0.018,
      anisotropy: 0.6
    });

    const edgeMetal = new THREE.MeshPhysicalMaterial({
      color: 0xdce1e1,
      metalness: 1,
      roughness: 0.17,
      anisotropy: 0.85
    });

    const bronze = new THREE.MeshPhysicalMaterial({
      color: 0x9a5128,
      metalness: 1,
      roughness: 0.25,
      bumpMap: bronzeGrain,
      bumpScale: 0.022,
      anisotropy: 0.8,
      clearcoat: 0.2,
      clearcoatRoughness: 0.25
    });

    const darkBronze = new THREE.MeshPhysicalMaterial({
      color: 0x3f1f12,
      metalness: 0.95,
      roughness: 0.34
    });

    const blackMetal = new THREE.MeshPhysicalMaterial({
      color: 0x090b0c,
      metalness: 0.85,
      roughness: 0.19,
      clearcoat: 0.35,
      clearcoatRoughness: 0.18
    });

    const beetle = new THREE.Group();
    beetle.rotation.y = -0.08;
    scene.add(beetle);

    function addMesh(geometry, material, position, scale, parent = beetle) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(position);
      if (scale) mesh.scale.copy(scale);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function spherePart(position, scale, material, segments = 64) {
      return addMesh(
        new THREE.SphereGeometry(1, segments, Math.floor(segments * 0.62)),
        material,
        position,
        scale
      );
    }

    function cylinderBetween(a, b, radiusA, radiusB, material, radialSegments = 12, parent = beetle) {
      const delta = new THREE.Vector3().subVectors(b, a);
      const length = delta.length();
      const geometry = new THREE.CylinderGeometry(radiusB, radiusA, length, radialSegments, 1, false);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(a).add(b).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function coneBetween(base, tip, radius, material, radialSegments = 10, parent = beetle) {
      const delta = new THREE.Vector3().subVectors(tip, base);
      const geometry = new THREE.ConeGeometry(radius, delta.length(), radialSegments);
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(base).add(tip).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), delta.normalize());
      mesh.castShadow = true;
      parent.add(mesh);
      return mesh;
    }

    // Abdomen under-shell and articulated rim
    spherePart(new THREE.Vector3(0, 1.42, 0.85), new THREE.Vector3(1.25, 0.56, 1.65), darkAluminum);
    spherePart(new THREE.Vector3(0, 1.31, 1.47), new THREE.Vector3(1.12, 0.38, 1.18), darkAluminum);

    // Paired anodized wing casings
    const leftWing = spherePart(
      new THREE.Vector3(-0.48, 1.66, 0.88),
      new THREE.Vector3(0.72, 0.39, 1.55),
      bronze
    );
    leftWing.rotation.z = -0.045;

    const rightWing = spherePart(
      new THREE.Vector3(0.48, 1.66, 0.88),
      new THREE.Vector3(0.72, 0.39, 1.55),
      bronze
    );
    rightWing.rotation.z = 0.045;

    // Elytra center seam and perimeter machining
    cylinderBetween(
      new THREE.Vector3(0, 1.925, -0.42),
      new THREE.Vector3(0, 1.88, 2.22),
      0.027, 0.018, edgeMetal, 10
    );

    for (const side of [-1, 1]) {
      const rimCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(side * 0.18, 1.91, -0.43),
        new THREE.Vector3(side * 0.73, 1.88, -0.1),
        new THREE.Vector3(side * 1.03, 1.76, 0.75),
        new THREE.Vector3(side * 0.82, 1.72, 1.78),
        new THREE.Vector3(side * 0.3, 1.75, 2.25)
      ]);
      addMesh(new THREE.TubeGeometry(rimCurve, 48, 0.022, 8, false), edgeMetal, new THREE.Vector3());
    }

    // Thorax plates
    spherePart(new THREE.Vector3(0, 1.55, -0.68), new THREE.Vector3(1.13, 0.51, 0.82), aluminum);
    spherePart(new THREE.Vector3(0, 1.72, -0.76), new THREE.Vector3(1.02, 0.32, 0.68), darkAluminum);

    const collar = addMesh(
      new THREE.TorusGeometry(0.76, 0.075, 12, 48),
      edgeMetal,
      new THREE.Vector3(0, 1.58, -1.2),
      new THREE.Vector3(1, 1, 0.63)
    );
    collar.rotation.x = Math.PI / 2;

    // Head and facial armor
    spherePart(new THREE.Vector3(0, 1.53, -1.63), new THREE.Vector3(0.82, 0.48, 0.69), darkAluminum);
    spherePart(new THREE.Vector3(0, 1.72, -1.73), new THREE.Vector3(0.73, 0.27, 0.58), aluminum);

    const facePlate = addMesh(
      new THREE.CylinderGeometry(0.52, 0.67, 0.2, 8),
      aluminum,
      new THREE.Vector3(0, 1.57, -2.12),
      new THREE.Vector3(1, 1, 0.72)
    );
    facePlate.rotation.x = Math.PI / 2;

    // Eyes in recessed bronze sockets
    for (const side of [-1, 1]) {
      spherePart(
        new THREE.Vector3(side * 0.68, 1.68, -1.86),
        new THREE.Vector3(0.16, 0.14, 0.19),
        darkBronze,
        32
      );
      spherePart(
        new THREE.Vector3(side * 0.71, 1.7, -1.91),
        new THREE.Vector3(0.105, 0.095, 0.12),
        blackMetal,
        32
      );
    }

    // Mandibles: beveled, curved, mirrored milled blades
    function createMandible(side) {
      const shape = new THREE.Shape();
      const sx = value => side * value;

      shape.moveTo(sx(0.38), -2.0);
      shape.bezierCurveTo(sx(0.56), -2.4, sx(0.72), -3.0, sx(1.0), -3.55);
      shape.bezierCurveTo(sx(1.2), -3.94, sx(1.06), -4.35, sx(0.65), -4.55);
      shape.bezierCurveTo(sx(0.47), -4.63, sx(0.39), -4.5, sx(0.52), -4.36);
      shape.bezierCurveTo(sx(0.77), -4.08, sx(0.79), -3.77, sx(0.61), -3.43);
      shape.bezierCurveTo(sx(0.4), -3.03, sx(0.28), -2.54, sx(0.22), -2.1);
      shape.closePath();

      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: 0.18,
        steps: 1,
        bevelEnabled: true,
        bevelSegments: 4,
        bevelSize: 0.055,
        bevelThickness: 0.045
      });
      geometry.rotateX(Math.PI / 2);

      const mandible = addMesh(
        geometry,
        aluminum,
        new THREE.Vector3(0, 1.68, 0)
      );

      // Inner branching teeth
      const toothSpecs = [
        [0.48, -2.73, 0.14, -3.0],
        [0.65, -3.18, 0.22, -3.46],
        [0.82, -3.62, 0.38, -3.9]
      ];

      for (const [outerX, z0, innerX, z1] of toothSpecs) {
        const base = new THREE.Vector3(sx(outerX), 1.7, z0);
        const tip = new THREE.Vector3(sx(innerX), 1.7, z1);
        cylinderBetween(base, tip, 0.09, 0.045, aluminum, 10);
        coneBetween(
          tip,
          new THREE.Vector3(sx(innerX * 0.86), 1.7, z1 - 0.18),
          0.05,
          edgeMetal,
          10
        );
      }

      // Bronze pivot fastener
      const pivot = addMesh(
        new THREE.CylinderGeometry(0.135, 0.135, 0.08, 24),
        bronze,
        new THREE.Vector3(sx(0.39), 1.89, -2.14)
      );
      pivot.rotation.x = Math.PI / 2;

      const slot = addMesh(
        new THREE.BoxGeometry(0.15, 0.025, 0.035),
        darkBronze,
        new THREE.Vector3(sx(0.39), 1.936, -2.14)
      );
      slot.rotation.y = side * 0.35;

      return mandible;
    }

    createMandible(-1);
    createMandible(1);

    // Antennae with clubbed tips
    for (const side of [-1, 1]) {
      const antennaCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(side * 0.54, 1.73, -1.96),
        new THREE.Vector3(side * 0.9, 1.92, -2.22),
        new THREE.Vector3(side * 1.2, 2.02, -2.49),
        new THREE.Vector3(side * 1.42, 1.94, -2.7)
      ]);
      addMesh(new THREE.TubeGeometry(antennaCurve, 32, 0.035, 8, false), darkAluminum, new THREE.Vector3());

      cylinderBetween(
        new THREE.Vector3(side * 1.39, 1.94, -2.67),
        new THREE.Vector3(side * 1.54, 1.91, -2.82),
        0.07, 0.055, bronze, 10
      );
      cylinderBetween(
        new THREE.Vector3(side * 1.53, 1.91, -2.82),
        new THREE.Vector3(side * 1.67, 1.84, -2.94),
        0.065, 0.04, bronze, 10
      );
    }

    // Six articulated satin-metal legs
    const legRows = [
      { z: -0.88, hipX: 0.75, kneeX: 1.55, kneeZ: -1.35, footX: 2.35, footZ: -1.72 },
      { z: 0.05, hipX: 0.93, kneeX: 1.8, kneeZ: 0.0, footX: 2.62, footZ: -0.12 },
      { z: 0.88, hipX: 0.9, kneeX: 1.72, kneeZ: 1.16, footX: 2.38, footZ: 1.72 }
    ];

    for (const side of [-1, 1]) {
      for (const leg of legRows) {
        const hip = new THREE.Vector3(side * leg.hipX, 1.42, leg.z);
        const knee = new THREE.Vector3(side * leg.kneeX, 0.91, leg.kneeZ);
        const ankle = new THREE.Vector3(side * leg.footX, 0.45, leg.footZ);
        const toe = new THREE.Vector3(side * (leg.footX + 0.31), 0.29, leg.footZ - 0.07);

        spherePart(hip, new THREE.Vector3(0.14, 0.14, 0.14), bronze, 24);
        cylinderBetween(hip, knee, 0.12, 0.095, darkAluminum, 12);
        spherePart(knee, new THREE.Vector3(0.13, 0.13, 0.13), bronze, 24);
        cylinderBetween(knee, ankle, 0.095, 0.052, aluminum, 12);
        cylinderBetween(ankle, toe, 0.052, 0.026, darkAluminum, 10);

        // Sharp terminal fork and tibial barbs
        coneBetween(
          toe,
          new THREE.Vector3(side * (leg.footX + 0.48), 0.25, leg.footZ - 0.17),
          0.035,
          edgeMetal,
          8
        );
        coneBetween(
          toe,
          new THREE.Vector3(side * (leg.footX + 0.44), 0.25, leg.footZ + 0.09),
          0.032,
          edgeMetal,
          8
        );

        const lowerDirection = new THREE.Vector3().subVectors(ankle, knee);
        for (const fraction of [0.45, 0.67, 0.84]) {
          const barbBase = knee.clone().addScaledVector(lowerDirection, fraction);
          const barbTip = barbBase.clone().add(new THREE.Vector3(
            side * 0.16,
            -0.025,
            leg.z < 0 ? -0.08 : 0.08
          ));
          coneBetween(barbBase, barbTip, 0.025, edgeMetal, 7);
        }
      }
    }

    // Fine segmented abdominal tail plates
    for (let i = 0; i < 4; i++) {
      const z = 1.62 + i * 0.2;
      const width = 0.77 - i * 0.1;
      const band = addMesh(
        new THREE.TorusGeometry(width, 0.025, 8, 40, Math.PI),
        edgeMetal,
        new THREE.Vector3(0, 1.49 - i * 0.015, z),
        new THREE.Vector3(1, 1, 0.48)
      );
      band.rotation.x = Math.PI / 2;
      band.rotation.z = Math.PI / 2;
    }

    // Subtle machined fasteners
    const fastenerPositions = [
      [-0.62, 1.93, -0.78], [0.62, 1.93, -0.78],
      [-0.78, 1.83, 0.16], [0.78, 1.83, 0.16],
      [-0.66, 1.78, 1.52], [0.66, 1.78, 1.52]
    ];

    for (const [x, y, z] of fastenerPositions) {
      const bolt = addMesh(
        new THREE.CylinderGeometry(0.047, 0.047, 0.025, 16),
        edgeMetal,
        new THREE.Vector3(x, y, z)
      );
      bolt.rotation.x = Math.PI / 2;
    }

    // Ground plane
    const groundMaterial = new THREE.MeshStandardMaterial({
      color: 0x111518,
      metalness: 0.25,
      roughness: 0.68
    });
    const ground = new THREE.Mesh(new THREE.CircleGeometry(11, 96), groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0.18;
    ground.receiveShadow = true;
    scene.add(ground);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(3.1, 3.13, 96),
      new THREE.MeshBasicMaterial({
        color: 0x754128,
        transparent: true,
        opacity: 0.28,
        side: THREE.DoubleSide
      })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.185;
    scene.add(ring);

    // Studio lighting
    const hemisphere = new THREE.HemisphereLight(0xc9d9e6, 0x17100b, 1.15);
    scene.add(hemisphere);

    const key = new THREE.DirectionalLight(0xffe6ca, 5.1);
    key.position.set(-5, 9, -5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -6;
    key.shadow.camera.right = 6;
    key.shadow.camera.top = 6;
    key.shadow.camera.bottom = -6;
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 22;
    key.shadow.bias = -0.00025;
    scene.add(key);

    const coolRim = new THREE.SpotLight(0x8bc8ff, 55, 18, Math.PI / 5, 0.55, 1.3);
    coolRim.position.set(5.5, 5.8, 4.5);
    coolRim.target.position.set(0, 1.1, 0);
    scene.add(coolRim, coolRim.target);

    const bronzeRim = new THREE.SpotLight(0xff7b32, 42, 16, Math.PI / 6, 0.65, 1.4);
    bronzeRim.position.set(-5, 3.5, 3.8);
    bronzeRim.target.position.set(0, 1.2, 0.3);
    scene.add(bronzeRim, bronzeRim.target);

    const frontFill = new THREE.PointLight(0xdce9ef, 10, 10, 2);
    frontFill.position.set(0, 2.1, -5.5);
    scene.add(frontFill);

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
