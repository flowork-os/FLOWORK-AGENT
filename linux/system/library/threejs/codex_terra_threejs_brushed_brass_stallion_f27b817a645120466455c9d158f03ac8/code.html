<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brushed Brass Stallion</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15120e}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17130f);
scene.fog = new THREE.Fog(0x17130f, 12, 25);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.7, 4.7, 8.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.25, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.55;
controls.minDistance = 5.2;
controls.maxDistance = 15;

function grainTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#bd7a28';
  ctx.fillRect(0, 0, 512, 512);
  for (let y = 0; y < 512; y++) {
    const wave = Math.sin(y * 0.31) * 8 + Math.sin(y * 0.071) * 7;
    const tone = Math.max(70, Math.min(205, 145 + wave + ((y * 17) % 19) - 9));
    ctx.fillStyle = `rgba(${tone + 30},${Math.max(50,tone - 18)},${Math.max(15,tone - 86)},0.24)`;
    ctx.fillRect(0, y, 512, 1);
  }
  for (let i = 0; i < 700; i++) {
    const y = (i * 37) % 512;
    ctx.strokeStyle = i % 4 === 0 ? 'rgba(62,34,13,.16)' : 'rgba(255,224,157,.09)';
    ctx.lineWidth = i % 7 === 0 ? 1.2 : 0.45;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.bezierCurveTo(145, y + ((i % 9) - 4), 355, y - ((i % 7) - 3), 512, y + ((i % 5) - 2));
    ctx.stroke();
  }
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(2.8, 1.5);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return texture;
}

const grain = grainTexture();
const brass = new THREE.MeshStandardMaterial({
  color: 0xc6812d, map: grain, bumpMap: grain, bumpScale: 0.055,
  metalness: 0.94, roughness: 0.28, envMapIntensity: 1.35
});
const brassDark = new THREE.MeshStandardMaterial({
  color: 0x553015, metalness: 0.87, roughness: 0.43
});
const patina = new THREE.MeshStandardMaterial({
  color: 0x342116, metalness: 0.8, roughness: 0.52
});

const statue = new THREE.Group();
statue.rotation.y = -0.2;
scene.add(statue);

function mesh(geometry, material = brass) {
  const item = new THREE.Mesh(geometry, material);
  item.castShadow = true;
  item.receiveShadow = true;
  statue.add(item);
  return item;
}
function ellipsoid(x, y, z, sx, sy, sz, material = brass) {
  const item = mesh(new THREE.SphereGeometry(1, 36, 24), material);
  item.position.set(x, y, z);
  item.scale.set(sx, sy, sz);
  return item;
}
function rod(a, b, ra, rb, material = brass, radial = 24) {
  const av = new THREE.Vector3(...a);
  const bv = new THREE.Vector3(...b);
  const direction = new THREE.Vector3().subVectors(bv, av);
  const length = direction.length();
  const item = mesh(new THREE.CylinderGeometry(rb, ra, length, radial, 4), material);
  item.position.copy(av).add(bv).multiplyScalar(0.5);
  item.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  return item;
}
function tube(points, radius, material = brass, segments = 64) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)), false, 'centripetal');
  return mesh(new THREE.TubeGeometry(curve, segments, radius, 10, false), material);
}
function hoof(x, y, z, rotationZ, rotationX = 0) {
  const item = mesh(new THREE.BoxGeometry(0.39, 0.24, 0.53), brassDark);
  item.position.set(x, y, z);
  item.rotation.set(rotationX, 0, rotationZ);
  return item;
}

const base = mesh(new THREE.CylinderGeometry(1.78, 1.93, 0.28, 72), brassDark);
base.scale.set(1.38, 1, 0.84);
base.position.y = 0.14;
const baseTop = mesh(new THREE.CylinderGeometry(1.70, 1.70, 0.045, 72), brass);
baseTop.scale.set(1.38, 1, 0.84);
baseTop.position.y = 0.303;

ellipsoid(-0.08, 2.25, 0, 1.18, 0.75, 0.61);
ellipsoid(0.16, 2.72, 0, 0.94, 0.78, 0.54);
ellipsoid(0.55, 3.17, 0, 0.64, 0.82, 0.46);
ellipsoid(-0.77, 2.15, 0.02, 0.52, 0.53, 0.48);
ellipsoid(-0.13, 2.05, 0.52, 0.75, 0.40, 0.18, brassDark);
ellipsoid(-0.13, 2.05, -0.52, 0.75, 0.40, 0.18, brassDark);

ellipsoid(-0.08, 2.53, 0.49, 0.72, 0.44, 0.17, brass);
ellipsoid(-0.08, 2.53, -0.49, 0.72, 0.44, 0.17, brass);
ellipsoid(0.32, 2.92, 0.43, 0.53, 0.60, 0.16, brass);
ellipsoid(0.32, 2.92, -0.43, 0.53, 0.60, 0.16, brass);

rod([-0.85,2.0,0.37],[-1.18,1.22,0.38],0.27,0.20);
ellipsoid(-1.18,1.21,0.38,0.23,0.25,0.21);
rod([-1.18,1.20,0.38],[-1.02,0.48,0.37],0.18,0.12);
hoof(-1.00,0.40,0.38,-0.20,0.04);

rod([-0.72,2.0,-0.38],[-0.48,1.27,-0.43],0.28,0.20);
ellipsoid(-0.48,1.26,-0.43,0.23,0.25,0.21);
rod([-0.48,1.25,-0.43],[-0.70,0.49,-0.45],0.18,0.12);
hoof(-0.74,0.40,-0.45,0.22,-0.06);

rod([-0.55,2.15,0.39],[-0.98,1.46,0.38],0.30,0.22);
ellipsoid(-0.99,1.45,0.38,0.25,0.26,0.22);
rod([-0.99,1.43,0.38],[-1.23,0.67,0.37],0.19,0.12);
hoof(-1.26,0.57,0.37,0.28,-0.06);

rod([0.53,3.05,0.34],[1.07,2.33,0.38],0.24,0.18);
ellipsoid(1.07,2.32,0.38,0.21,0.22,0.19);
rod([1.08,2.30,0.38],[1.54,2.55,0.39],0.16,0.10);
hoof(1.64,2.58,0.39,-0.65,0.65);

rod([0.64,3.05,-0.34],[1.22,2.72,-0.40],0.24,0.18);
ellipsoid(1.22,2.70,-0.40,0.21,0.22,0.19);
rod([1.23,2.69,-0.40],[1.67,3.24,-0.42],0.16,0.10);
hoof(1.73,3.34,-0.42,-0.68,0.75);

tube([[0.47,3.2,0],[0.58,3.75,0],[0.88,4.20,0],[1.13,4.52,0]],0.39);
ellipsoid(1.12,4.48,0,0.43,0.52,0.36);
ellipsoid(1.42,4.46,0,0.47,0.31,0.31);
ellipsoid(1.72,4.39,0,0.30,0.20,0.25);
rod([1.53,4.44,0],[1.91,4.33,0],0.24,0.14);
ellipsoid(1.94,4.31,0,0.18,0.14,0.18);

const muzzle = ellipsoid(1.88,4.27,0,0.25,0.16,0.22, brassDark);
const nostrilA = ellipsoid(2.02,4.30,0.13,0.045,0.035,0.04, patina);
const nostrilB = ellipsoid(2.02,4.30,-0.13,0.045,0.035,0.04, patina);
nostrilA.rotation.z = nostrilB.rotation.z = 0.35;

const eyeA = ellipsoid(1.58,4.59,0.28,0.065,0.065,0.035, patina);
const eyeB = ellipsoid(1.58,4.59,-0.28,0.065,0.065,0.035, patina);
eyeA.rotation.y = 0.3;
eyeB.rotation.y = -0.3;

const ear1 = mesh(new THREE.ConeGeometry(0.105,0.38,16), brass);
ear1.position.set(1.16,4.91,0.20);
ear1.rotation.z = -0.18;
const ear2 = mesh(new THREE.ConeGeometry(0.105,0.38,16), brass);
ear2.position.set(1.16,4.91,-0.20);
ear2.rotation.z = -0.18;

for (let i = 0; i < 9; i++) {
  const z = (i - 4) * 0.065;
  tube([
    [0.31,3.44,z],
    [0.08,3.79,z * 1.15],
    [0.25,4.17,z * 1.3],
    [0.71,4.46,z * 1.15],
    [0.88,4.59,z]
  ], 0.055 + (i % 2) * 0.008, i === 0 || i === 8 ? brassDark : brass, 40);
}

for (let i = 0; i < 8; i++) {
  const z = (i - 3.5) * 0.09;
  tube([
    [-1.00,2.29,z],
    [-1.47,2.28,z * 1.3],
    [-1.88,2.08,z * 1.7],
    [-2.18,1.78,z * 1.55],
    [-2.56,1.61,z * 1.25]
  ], 0.065 + (i % 3) * 0.01, i === 0 || i === 7 ? brassDark : brass, 48);
}

for (const side of [-1, 1]) {
  tube([[-0.72,2.23,side*0.49],[-0.32,2.19,side*0.61],[0.22,2.46,side*0.52]],0.052,brassDark,28);
  tube([[0.06,2.96,side*0.47],[0.49,3.12,side*0.51],[0.73,3.42,side*0.42]],0.045,brassDark,28);
}

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.30 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.01;
ground.receiveShadow = true;
scene.add(ground);

scene.add(new THREE.HemisphereLight(0xffefd0, 0x24140d, 1.75));

const key = new THREE.DirectionalLight(0xffd8a0, 4.0);
key.position.set(4.5, 8, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -3;
key.shadow.bias = -0.00025;
scene.add(key);

const rim = new THREE.DirectionalLight(0xf4a65e, 2.5);
rim.position.set(-5, 4.5, -5);
scene.add(rim);

const fill = new THREE.PointLight(0xffbb72, 28, 12, 2);
fill.position.set(1.5, 3.5, -4);
scene.add(fill);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
