<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Tall Bookshelf</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #d8d2c8;
    }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 24px;
      bottom: 20px;
      color: rgba(42, 36, 30, 0.72);
      font: 12px/1.4 system-ui, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">Adjustable oak shelving</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd8d2c8);
    scene.fog = new THREE.Fog(0xd8d2c8, 11, 24);

    const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.05, 60);
    camera.position.set(6.1, 4.45, 7.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.35, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.45;
    controls.minDistance = 5.2;
    controls.maxDistance = 13;
    controls.maxPolarAngle = Math.PI * 0.49;

    const hemi = new THREE.HemisphereLight(0xf5f0e7, 0x706a61, 1.55);
    scene.add(hemi);

    const key = new THREE.DirectionalLight(0xfff4df, 3.4);
    key.position.set(-4.5, 8.5, 5.5);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -5;
    key.shadow.camera.right = 5;
    key.shadow.camera.top = 8;
    key.shadow.camera.bottom = -2;
    key.shadow.camera.near = 1;
    key.shadow.camera.far = 20;
    key.shadow.bias = -0.00035;
    key.shadow.normalBias = 0.025;
    scene.add(key);

    const fill = new THREE.DirectionalLight(0xcbd8e7, 1.25);
    fill.position.set(5, 4, -4);
    scene.add(fill);

    const warmLight = new THREE.PointLight(0xffd7a0, 14, 10, 2);
    warmLight.position.set(2.8, 3.2, 3.8);
    scene.add(warmLight);

    const floorMaterial = new THREE.MeshStandardMaterial({
      color: 0xbab2a6,
      roughness: 0.93,
      metalness: 0
    });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const shadowPad = new THREE.Mesh(
      new THREE.CircleGeometry(2.25, 64),
      new THREE.MeshBasicMaterial({
        color: 0x51473d,
        transparent: true,
        opacity: 0.10,
        depthWrite: false
      })
    );
    shadowPad.rotation.x = -Math.PI / 2;
    shadowPad.position.set(0, 0.003, 0.08);
    shadowPad.scale.set(1, 0.45, 1);
    scene.add(shadowPad);

    const shelfUnit = new THREE.Group();
    shelfUnit.rotation.y = -0.06;
    scene.add(shelfUnit);

    const W = 2.72;
    const H = 5.10;
    const D = 0.76;
    const SIDE = 0.13;
    const BOARD = 0.105;
    const BACK = 0.045;
    const baseY = 0.075;
    const innerW = W - SIDE * 2;
    const frontZ = D / 2;
    const backZ = -D / 2;

    const woodMaterials = [
      new THREE.MeshStandardMaterial({ color: 0xb77b42, roughness: 0.58, metalness: 0.01 }),
      new THREE.MeshStandardMaterial({ color: 0xc58b50, roughness: 0.60, metalness: 0.01 }),
      new THREE.MeshStandardMaterial({ color: 0xa96937, roughness: 0.56, metalness: 0.01 })
    ];
    const backMaterial = new THREE.MeshStandardMaterial({
      color: 0x9d6336,
      roughness: 0.72,
      metalness: 0
    });
    const edgeMaterial = new THREE.MeshStandardMaterial({
      color: 0x82502e,
      roughness: 0.65
    });
    const holeMaterial = new THREE.MeshStandardMaterial({
      color: 0x342820,
      roughness: 0.82
    });
    const footMaterial = new THREE.MeshStandardMaterial({
      color: 0x292724,
      roughness: 0.68
    });

    function boxPart(name, sx, sy, sz, x, y, z, material, bevel = 0.018) {
      const shape = new THREE.Shape();
      const hw = sx / 2;
      const hh = sy / 2;
      const r = Math.min(bevel, hw * 0.35, hh * 0.35);

      shape.moveTo(-hw + r, -hh);
      shape.lineTo(hw - r, -hh);
      shape.quadraticCurveTo(hw, -hh, hw, -hh + r);
      shape.lineTo(hw, hh - r);
      shape.quadraticCurveTo(hw, hh, hw - r, hh);
      shape.lineTo(-hw + r, hh);
      shape.quadraticCurveTo(-hw, hh, -hw, hh - r);
      shape.lineTo(-hw, -hh + r);
      shape.quadraticCurveTo(-hw, -hh, -hw + r, -hh);

      const geometry = new THREE.ExtrudeGeometry(shape, {
        depth: sz,
        bevelEnabled: true,
        bevelSegments: 2,
        steps: 1,
        bevelSize: Math.min(0.008, sz * 0.12),
        bevelThickness: Math.min(0.008, sz * 0.12),
        curveSegments: 2
      });
      geometry.translate(0, 0, -sz / 2);
      geometry.computeVertexNormals();

      const mesh = new THREE.Mesh(geometry, material);
      mesh.name = name;
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      shelfUnit.add(mesh);
      return mesh;
    }

    function addFrontEdge(sx, sy, x, y) {
      return boxPart(
        'Solid wood front edge',
        sx,
        sy,
        0.027,
        x,
        y,
        frontZ + 0.013,
        edgeMaterial,
        0.012
      );
    }

    const bodyCenterY = baseY + H / 2;
    boxPart('Left side panel', SIDE, H, D, -W / 2 + SIDE / 2, bodyCenterY, 0, woodMaterials[0], 0.025);
    boxPart('Right side panel', SIDE, H, D, W / 2 - SIDE / 2, bodyCenterY, 0, woodMaterials[1], 0.025);
    addFrontEdge(SIDE + 0.012, H - 0.025, -W / 2 + SIDE / 2, bodyCenterY);
    addFrontEdge(SIDE + 0.012, H - 0.025, W / 2 - SIDE / 2, bodyCenterY);

    const bottomY = baseY + BOARD / 2;
    const topY = baseY + H - BOARD / 2;
    boxPart('Bottom board', innerW, BOARD, D - 0.025, 0, bottomY, 0.006, woodMaterials[2], 0.018);
    boxPart('Top board', innerW, BOARD, D - 0.025, 0, topY, 0.006, woodMaterials[1], 0.018);
    addFrontEdge(innerW, BOARD + 0.006, 0, bottomY);
    addFrontEdge(innerW, BOARD + 0.006, 0, topY);

    const backHeight = H - BOARD * 1.25;
    const backPanelZ = backZ + BACK / 2 + 0.032;
    boxPart(
      'Recessed back panel',
      innerW - 0.055,
      backHeight,
      BACK,
      0,
      bodyCenterY,
      backPanelZ,
      backMaterial,
      0.010
    );

    const shelfCount = 5;
    const clearBottom = baseY + BOARD;
    const clearTop = baseY + H - BOARD;
    const clearHeight = clearTop - clearBottom;
    const shelfYs = [];

    for (let i = 1; i <= shelfCount; i++) {
      const y = clearBottom + clearHeight * (i / (shelfCount + 1));
      shelfYs.push(y);
      boxPart(
        `Adjustable shelf ${i}`,
        innerW - 0.045,
        BOARD,
        D - 0.105,
        0,
        y,
        0.035,
        woodMaterials[i % woodMaterials.length],
        0.016
      );
      addFrontEdge(innerW - 0.045, BOARD + 0.004, 0, y);
    }

    const pegRadius = 0.026;
    const pegDepth = 0.010;
    const pegGeometry = new THREE.CylinderGeometry(pegRadius, pegRadius * 0.96, pegDepth, 14, 1, false);
    pegGeometry.rotateZ(Math.PI / 2);

    const holeYStart = baseY + 0.29;
    const holeYEnd = baseY + H - 0.28;
    const holeSpacing = 0.205;
    const holeRows = Math.floor((holeYEnd - holeYStart) / holeSpacing) + 1;
    const zRows = [frontZ - 0.155, backZ + 0.165];
    const totalHoles = holeRows * zRows.length * 2;
    const holes = new THREE.InstancedMesh(pegGeometry, holeMaterial, totalHoles);
    holes.name = 'Adjustable shelf peg holes';
    holes.castShadow = false;
    holes.receiveShadow = true;

    const dummy = new THREE.Object3D();
    let holeIndex = 0;
    for (const side of [-1, 1]) {
      const innerFaceX = side * (W / 2 - SIDE);
      for (const z of zRows) {
        for (let i = 0; i < holeRows; i++) {
          const y = holeYStart + i * holeSpacing;
          dummy.position.set(innerFaceX - side * pegDepth * 0.32, y, z);
          dummy.rotation.set(0, 0, 0);
          dummy.updateMatrix();
          holes.setMatrixAt(holeIndex++, dummy.matrix);
        }
      }
    }
    holes.instanceMatrix.needsUpdate = true;
    shelfUnit.add(holes);

    const pinMaterial = new THREE.MeshStandardMaterial({
      color: 0x665a4d,
      roughness: 0.38,
      metalness: 0.42
    });
    const pinGeometry = new THREE.CylinderGeometry(0.020, 0.020, 0.055, 12);
    pinGeometry.rotateZ(Math.PI / 2);
    const supports = new THREE.InstancedMesh(pinGeometry, pinMaterial, shelfCount * 4);
    supports.name = 'Metal shelf supports';
    supports.castShadow = true;

    let supportIndex = 0;
    for (const y of shelfYs) {
      for (const side of [-1, 1]) {
        for (const z of zRows) {
          dummy.position.set(side * (innerW / 2 - 0.03), y - BOARD / 2 - 0.006, z);
          dummy.rotation.set(0, 0, 0);
          dummy.updateMatrix();
          supports.setMatrixAt(supportIndex++, dummy.matrix);
        }
      }
    }
    supports.instanceMatrix.needsUpdate = true;
    shelfUnit.add(supports);

    const toeHeight = 0.17;
    boxPart(
      'Recessed toe plinth',
      W - 0.28,
      toeHeight,
      D - 0.22,
      0,
      baseY + toeHeight / 2 - 0.01,
      -0.045,
      woodMaterials[2],
      0.020
    );

    const footGeometry = new THREE.CylinderGeometry(0.052, 0.058, 0.07, 20);
    const feet = new THREE.InstancedMesh(footGeometry, footMaterial, 4);
    feet.castShadow = true;
    feet.receiveShadow = true;
    const footPositions = [
      [-W / 2 + 0.20, 0.035, frontZ - 0.16],
      [ W / 2 - 0.20, 0.035, frontZ - 0.16],
      [-W / 2 + 0.20, 0.035, backZ + 0.16],
      [ W / 2 - 0.20, 0.035, backZ + 0.16]
    ];
    footPositions.forEach((p, i) => {
      dummy.position.set(...p);
      dummy.rotation.set(0, 0, 0);
      dummy.updateMatrix();
      feet.setMatrixAt(i, dummy.matrix);
    });
    feet.instanceMatrix.needsUpdate = true;
    shelfUnit.add(feet);

    const grainMaterial = new THREE.MeshBasicMaterial({
      color: 0x714326,
      transparent: true,
      opacity: 0.17,
      depthWrite: false
    });
    const grainGeometry = new THREE.BoxGeometry(1, 0.007, 0.005);
    const grainMarks = new THREE.Group();
    grainMarks.name = 'Subtle front edge grain';

    let seed = 872341;
    function random() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    }

    const boardLevels = [bottomY, ...shelfYs, topY];
    for (const y of boardLevels) {
      for (let i = 0; i < 8; i++) {
        const length = 0.10 + random() * 0.33;
        const mark = new THREE.Mesh(grainGeometry, grainMaterial);
        mark.scale.x = length;
        mark.position.set(
          -innerW / 2 + 0.13 + random() * (innerW - 0.26),
          y + (random() - 0.5) * BOARD * 0.55,
          frontZ + 0.028
        );
        mark.rotation.z = (random() - 0.5) * 0.05;
        grainMarks.add(mark);
      }
    }
    shelfUnit.add(grainMarks);

    const wall = new THREE.Mesh(
      new THREE.PlaneGeometry(22, 10),
      new THREE.MeshStandardMaterial({
        color: 0xd5cec3,
        roughness: 0.95
      })
    );
    wall.position.set(0, 5, -3.3);
    wall.receiveShadow = true;
    scene.add(wall);

    const baseboard = new THREE.Mesh(
      new THREE.BoxGeometry(22, 0.18, 0.075),
      new THREE.MeshStandardMaterial({
        color: 0xeee9df,
        roughness: 0.72
      })
    );
    baseboard.position.set(0, 0.09, -3.22);
    baseboard.castShadow = true;
    baseboard.receiveShadow = true;
    scene.add(baseboard);

    function resize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    }
    window.addEventListener('resize', resize);

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
