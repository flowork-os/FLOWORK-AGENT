<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carved Wood Chimera</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #160d09; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x160d09);
scene.fog = new THREE.Fog(0x160d09, 7, 14);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.4, 2.8, 6.2);
camera.lookAt(0, 1.0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 3.7;
controls.maxDistance = 8.5;
controls.target.set(0, 1.0, 0);

scene.add(new THREE.HemisphereLight(0x9c7651, 0x24110b, 2.0));

const keyLight = new THREE.DirectionalLight(0xffd7a4, 4.2);
keyLight.position.set(4.5, 7, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -4;
keyLight.shadow.camera.right = 4;
keyLight.shadow.camera.top = 5;
keyLight.shadow.camera.bottom = -3;
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x6e3b22, 2.2);
rimLight.position.set(-5, 3, -4);
scene.add(rimLight);

const wood = new THREE.MeshStandardMaterial({
  color: 0x713b20,
  roughness: 0.62,
  metalness: 0.02
});
const woodLight = new THREE.MeshStandardMaterial({
  color: 0x965b31,
  roughness: 0.5,
  metalness: 0.01
});
const woodDark = new THREE.MeshStandardMaterial({
  color: 0x3b1a10,
  roughness: 0.82,
  metalness: 0.0
});
const cut = new THREE.MeshStandardMaterial({
  color: 0x26100a,
  roughness: 0.9,
  metalness: 0
});
const eyeMat = new THREE.MeshStandardMaterial({
  color: 0xd79540,
  roughness: 0.28,
  emissive: 0x4b1d08,
  emissiveIntensity: 0.35
});

const chimera = new THREE.Group();
chimera.rotation.y = -0.08;
scene.add(chimera);

function finish(mesh, cast = true) {
  mesh.castShadow = cast;
  mesh.receiveShadow = true;
  chimera.add(mesh);
  return mesh;
}

function ellipsoid(material, position, scale, segments = 32) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(1, segments, Math.max(16, Math.floor(segments * 0.7))), material);
  mesh.position.copy(position);
  mesh.scale.copy(scale);
  return finish(mesh);
}

function cylinder(material, position, radiusTop, radiusBottom, height, rotation = new THREE.Euler(), radial = 20) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, height, radial, 1), material);
  mesh.position.copy(position);
  mesh.rotation.copy(rotation);
  return finish(mesh);
}

function coneAlong(material, position, radius, height, direction, radial = 10) {
  const mesh = new THREE.Mesh(new THREE.ConeGeometry(radius, height, radial, 1), material);
  mesh.position.copy(position);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.clone().normalize());
  return finish(mesh);
}

function tube(material, points, radius, tubular = 16) {
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(16, points.length * 8), radius, 8, false), material);
  return finish(mesh);
}

function grain(points, radius = 0.012, material = cut) {
  return tube(material, points, radius, 12);
}

function torus(material, position, major, minor, rotation = new THREE.Euler(), arc = Math.PI * 2) {
  const mesh = new THREE.Mesh(new THREE.TorusGeometry(major, minor, 8, 28, arc), material);
  mesh.position.copy(position);
  mesh.rotation.copy(rotation);
  return finish(mesh);
}

function addManeTuft(position, direction, size, angle = 0) {
  const tuft = coneAlong(woodLight, position, size * 0.28, size, direction, 8);
  tuft.rotation.z += angle;
  const groove = coneAlong(cut, position.clone().add(direction.clone().multiplyScalar(0.02)), size * 0.055, size * 0.7, direction, 6);
  groove.scale.x = 0.8;
  groove.scale.z = 0.8;
}

function addClaw(position, rotation) {
  const claw = new THREE.Mesh(new THREE.ConeGeometry(0.075, 0.24, 8), woodDark);
  claw.position.copy(position);
  claw.rotation.copy(rotation);
  claw.castShadow = true;
  claw.receiveShadow = true;
  chimera.add(claw);
}

ellipsoid(wood, new THREE.Vector3(-0.1, 1.18, 0), new THREE.Vector3(1.45, 0.86, 0.68));
ellipsoid(woodLight, new THREE.Vector3(0.68, 1.28, 0.02), new THREE.Vector3(0.72, 0.62, 0.56));
ellipsoid(woodDark, new THREE.Vector3(-1.05, 1.22, 0), new THREE.Vector3(0.58, 0.62, 0.57));

const chestGrain = [
  new THREE.Vector3(-0.95, 1.52, 0.52),
  new THREE.Vector3(-0.35, 1.73, 0.62),
  new THREE.Vector3(0.35, 1.65, 0.58),
  new THREE.Vector3(0.94, 1.47, 0.48)
];
grain(chestGrain, 0.018, woodDark);
grain(chestGrain.map(p => p.clone().add(new THREE.Vector3(0, -0.16, 0.025))), 0.012, cut);
grain([
  new THREE.Vector3(-0.82, 1.02, 0.57),
  new THREE.Vector3(-0.23, 0.82, 0.65),
  new THREE.Vector3(0.42, 0.91, 0.62),
  new THREE.Vector3(0.86, 1.12, 0.52)
], 0.014, woodLight);

const legData = [
  { x: -0.78, z: 0.42, y: 0.68, lean: -0.12 },
  { x: -0.62, z: -0.43, y: 0.68, lean: -0.09 },
  { x: 0.66, z: 0.42, y: 0.68, lean: 0.09 },
  { x: 0.73, z: -0.43, y: 0.68, lean: 0.12 }
];

for (const leg of legData) {
  const upper = cylinder(wood, new THREE.Vector3(leg.x, leg.y, leg.z), 0.19, 0.25, 0.72, new THREE.Euler(leg.lean, 0, 0), 18);
  ellipsoid(woodLight, new THREE.Vector3(leg.x + leg.lean * 0.18, 0.32, leg.z), new THREE.Vector3(0.23, 0.18, 0.27));
  addClaw(new THREE.Vector3(leg.x - 0.08, 0.22, leg.z + 0.12), new THREE.Euler(-0.25, 0, 0.3));
  addClaw(new THREE.Vector3(leg.x + 0.08, 0.22, leg.z + 0.12), new THREE.Euler(-0.25, 0, -0.3));
  grain([
    new THREE.Vector3(leg.x - 0.11, 0.96, leg.z + 0.12),
    new THREE.Vector3(leg.x - 0.13, 0.68, leg.z + 0.15),
    new THREE.Vector3(leg.x - 0.10, 0.40, leg.z + 0.13)
  ], 0.012, cut);
  void upper;
}

const neck = ellipsoid(wood, new THREE.Vector3(0.93, 1.72, 0.02), new THREE.Vector3(0.48, 0.72, 0.47));
const head = ellipsoid(woodLight, new THREE.Vector3(1.37, 2.08, 0.01), new THREE.Vector3(0.66, 0.48, 0.45));
ellipsoid(wood, new THREE.Vector3(1.82, 2.02, 0.01), new THREE.Vector3(0.39, 0.31, 0.34));
ellipsoid(woodDark, new THREE.Vector3(1.98, 1.96, 0.01), new THREE.Vector3(0.23, 0.19, 0.22));

ellipsoid(eyeMat, new THREE.Vector3(1.62, 2.18, 0.365), new THREE.Vector3(0.075, 0.075, 0.045), 16);
ellipsoid(eyeMat, new THREE.Vector3(1.62, 2.18, -0.365), new THREE.Vector3(0.075, 0.075, 0.045), 16);
ellipsoid(cut, new THREE.Vector3(1.63, 2.18, 0.405), new THREE.Vector3(0.018, 0.055, 0.012), 10);
ellipsoid(cut, new THREE.Vector3(1.63, 2.18, -0.405), new THREE.Vector3(0.018, 0.055, 0.012), 10);
grain([
  new THREE.Vector3(1.55, 2.28, 0.42),
  new THREE.Vector3(1.73, 2.33, 0.45),
  new THREE.Vector3(1.86, 2.27, 0.39)
], 0.014, cut);
grain([
  new THREE.Vector3(1.7, 1.91, 0.3),
  new THREE.Vector3(1.88, 1.87, 0.28),
  new THREE.Vector3(2.02, 1.92, 0.2)
], 0.013, cut);

for (let i = 0; i < 15; i++) {
  const a = -1.15 + i * 0.16;
  const p = new THREE.Vector3(0.88 + 0.37 * Math.cos(a), 1.82 + 0.62 * Math.sin(a), 0);
  const d = new THREE.Vector3(0.48 * Math.cos(a), 0.75 * Math.sin(a), 0);
  addManeTuft(p, d, 0.34 + (i % 3) * 0.035, (i % 2 ? 0.16 : -0.16));
}

addManeTuft(new THREE.Vector3(1.05, 2.45, 0.18), new THREE.Vector3(0.2, 1, 0.1), 0.42, 0.12);
addManeTuft(new THREE.Vector3(1.29, 2.53, 0), new THREE.Vector3(0.1, 1, 0), 0.38, -0.12);
addManeTuft(new THREE.Vector3(1.52, 2.47, -0.12), new THREE.Vector3(-0.05, 1, -0.15), 0.3, 0.1);

const goatNeck = ellipsoid(woodDark, new THREE.Vector3(-0.25, 1.72, 0.22), new THREE.Vector3(0.34, 0.62, 0.34));
const goatHead = ellipsoid(woodLight, new THREE.Vector3(-0.34, 2.25, 0.28), new THREE.Vector3(0.43, 0.4, 0.38));
ellipsoid(woodDark, new THREE.Vector3(-0.64, 2.2, 0.29), new THREE.Vector3(0.28, 0.24, 0.24));
ellipsoid(eyeMat, new THREE.Vector3(-0.48, 2.34, 0.61), new THREE.Vector3(0.055, 0.055, 0.035), 14);
ellipsoid(cut, new THREE.Vector3(-0.7, 2.17, 0.45), new THREE.Vector3(0.045, 0.025, 0.02), 10);

for (const side of [-1, 1]) {
  const hornPoints = [
    new THREE.Vector3(-0.34, 2.53, 0.28 + side * 0.19),
    new THREE.Vector3(-0.28, 2.82, 0.31 + side * 0.22),
    new THREE.Vector3(-0.05, 2.99, 0.32 + side * 0.2)
  ];
  tube(woodDark, hornPoints, 0.105, 10);
  for (let j = 0; j < 4; j++) {
    const p = hornPoints[1].clone().lerp(hornPoints[2], j / 4);
    torus(cut, p, 0.105, 0.018, new THREE.Euler(0.15, side * 0.55, 0.2), Math.PI * 1.5);
  }
}

for (let i = 0; i < 8; i++) {
  const x = -0.55 + i * 0.11;
  addManeTuft(new THREE.Vector3(x, 1.95 + (i % 2) * 0.08, 0.43), new THREE.Vector3(-0.2, 0.45, 0.7), 0.19, 0);
}

const tailPoints = [
  new THREE.Vector3(-1.18, 1.38, -0.02),
  new THREE.Vector3(-1.58, 1.26, -0.02),
  new THREE.Vector3(-1.88, 1.04, -0.03),
  new THREE.Vector3(-1.92, 0.68, 0.04),
  new THREE.Vector3(-1.72, 0.48, 0.16),
  new THREE.Vector3(-1.43, 0.57, 0.26),
  new THREE.Vector3(-1.35, 0.87, 0.3),
  new THREE.Vector3(-1.54, 1.03, 0.32)
];
tube(wood, tailPoints, 0.18, 18);
grain([
  new THREE.Vector3(-1.23, 1.43, 0.13),
  new THREE.Vector3(-1.58, 1.25, 0.14),
  new THREE.Vector3(-1.84, 0.98, 0.12),
  new THREE.Vector3(-1.82, 0.7, 0.15)
], 0.018, cut);

for (let i = 1; i < tailPoints.length - 1; i++) {
  const current = tailPoints[i];
  const next = tailPoints[i + 1];
  const tangent = next.clone().sub(current).normalize();
  const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
  const scalePos = current.clone().add(side.multiplyScalar(0.14));
  coneAlong(woodLight, scalePos, 0.14 - i * 0.008, 0.22, tangent.clone().multiplyScalar(-1), 8);
}

const pedestal = cylinder(woodDark, new THREE.Vector3(0, 0.03, 0), 1.35, 1.48, 0.18, new THREE.Euler(), 48);
pedestal.castShadow = true;
torus(woodLight, new THREE.Vector3(0, 0.14, 0), 1.28, 0.055, new THREE.Euler(), Math.PI * 2);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(20, 64),
  new THREE.MeshStandardMaterial({ color: 0x1b100b, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.08;
floor.receiveShadow = true;
scene.add(floor);

const smallCarve = new THREE.MeshStandardMaterial({ color: 0x542714, roughness: 0.72 });
for (let i = 0; i < 10; i++) {
  const a = i * Math.PI * 2 / 10;
  const p = new THREE.Vector3(Math.cos(a) * 1.15, 0.15, Math.sin(a) * 1.15);
  torus(smallCarve, p, 0.035, 0.012, new THREE.Euler(Math.PI / 2, 0, a), Math.PI * 0.8);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
