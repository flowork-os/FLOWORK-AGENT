<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Carved Wood Hornbill</title>
<style>

  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #160d09;
}
canvas {
  display: block;
  width: 100%;
  height: 100%;
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }

<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x160d09);
scene.fog = new THREE.Fog(0x160d09, 9, 18);

const camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(7.1, 4.7, 10.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0.15, 2.7, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 6.5;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.57;

const mahogany = new THREE.MeshStandardMaterial({
  color: 0x6e2e1b,
  roughness: 0.68,
  metalness: 0.015,
  flatShading: true
});
const mahoganyLight = new THREE.MeshStandardMaterial({
  color: 0x95502b,
  roughness: 0.64,
  metalness: 0.01,
  flatShading: true
});
const mahoganyDark = new THREE.MeshStandardMaterial({
  color: 0x32140d,
  roughness: 0.8,
  metalness: 0.01,
  flatShading: true
});
const gougeShadow = new THREE.MeshStandardMaterial({
  color: 0x4b1b11,
  roughness: 0.78,
  flatShading: true
});
const maple = new THREE.MeshPhysicalMaterial({
  color: 0xe5bd72,
  roughness: 0.2,
  metalness: 0.025,
  clearcoat: 0.62,
  clearcoatRoughness: 0.13
});
const mapleLight = new THREE.MeshPhysicalMaterial({
  color: 0xf1d797,
  roughness: 0.17,
  metalness: 0.02,
  clearcoat: 0.72,
  clearcoatRoughness: 0.1
});
const mapleShadow = new THREE.MeshStandardMaterial({
  color: 0xaa7134,
  roughness: 0.38,
  metalness: 0.02
});
const eyeMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x120a07,
  roughness: 0.12,
  metalness: 0.15,
  clearcoat: 0.8
});
const waxHighlight = new THREE.MeshStandardMaterial({
  color: 0xb86432,
  roughness: 0.48,
  metalness: 0.015,
  flatShading: true
});

function finishMesh(mesh) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function cylinderBetween(start, end, radius, material, radialSegments = 8) {
  const axis = end.clone().sub(start);
  const length = axis.length();
  if (length < 0.0001) {
    return new THREE.Group();
  }
  const geometry = new THREE.CylinderGeometry(radius, radius * 1.04, length, radialSegments);
  const mesh = finishMesh(new THREE.Mesh(geometry, material));
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(
    new THREE.Vector3(0, 1, 0),
    axis.normalize()
  );
  return mesh;
}

function makeLoftGeometry(points, radii, radialSegments = 18) {
  const positions = [];
  const indices = [];
  const rings = [];

  for (let i = 0; i < points.length; i++) {
    let tangent;
    if (i === 0) {
      tangent = points[1].clone().sub(points[0]).normalize();
    } else if (i === points.length - 1) {
      tangent = points[i].clone().sub(points[i - 1]).normalize();
    } else {
      tangent = points[i + 1].clone().sub(points[i - 1]).normalize();
    }

    const reference = new THREE.Vector3(
      Math.abs(tangent.z) > 0.9 ? 1 : 0,
      0,
      Math.abs(tangent.z) > 0.9 ? 0 : 1
    );
    const side = tangent.clone().cross(reference).normalize();
    const vertical = side.clone().cross(tangent).normalize();
    const ring = [];

    for (let j = 0; j < radialSegments; j++) {
      const angle = (j / radialSegments) * Math.PI * 2;
      const vertex = points[i].clone()
        .addScaledVector(side, Math.cos(angle) * radii[i])
        .addScaledVector(vertical, Math.sin(angle) * radii[i]);
      ring.push(positions.length / 3);
      positions.push(vertex.x, vertex.y, vertex.z);
    }
    rings.push(ring);
  }

  for (let i = 0; i < rings.length - 1; i++) {
    for (let j = 0; j < radialSegments; j++) {
      const next = (j + 1) % radialSegments;
      const a = rings[i][j];
      const b = rings[i][next];
      const c = rings[i + 1][next];
      const d = rings[i + 1][j];
      indices.push(a, b, d, b, c, d);
    }
  }

  const firstCenter = positions.length / 3;
  positions.push(points[0].x, points[0].y, points[0].z);
  const lastCenter = positions.length / 3;
  const finalPoint = points[points.length - 1];
  positions.push(finalPoint.x, finalPoint.y, finalPoint.z);

  for (let j = 0; j < radialSegments; j++) {
    const next = (j + 1) % radialSegments;
    indices.push(firstCenter, rings[0][next], rings[0][j]);
    indices.push(lastCenter, rings[rings.length - 1][j], rings[rings.length - 1][next]);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function loft(points, radii, material, radialSegments = 18) {
  return finishMesh(new THREE.Mesh(makeLoftGeometry(points, radii, radialSegments), material));
}

function triangleFacet(a, b, c, material) {
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute([
    a.x, a.y, a.z,
    b.x, b.y, b.z,
    c.x, c.y, c.z
  ], 3));
  geometry.setIndex([0, 1, 2]);
  geometry.computeVertexNormals();
  return finishMesh(new THREE.Mesh(geometry, material));
}

function reliefCurve(points, radius, material) {
  const curve = new THREE.CatmullRomCurve3(points);
  return finishMesh(new THREE.Mesh(
    new THREE.TubeGeometry(curve, 18, radius, 6, false),
    material
  ));
}

function tailFeather(length, width, material) {
  const shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.quadraticCurveTo(-length * 0.44, width, -length, width * 0.34);
  shape.quadraticCurveTo(-length * 0.74, 0, -length, -width * 0.34);
  shape.quadraticCurveTo(-length * 0.42, -width, 0, 0);

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.13,
    bevelEnabled: false,
    curveSegments: 2
  });
  return finishMesh(new THREE.Mesh(geometry, material));
}

function wingPlate(material) {
  const shape = new THREE.Shape();
  shape.moveTo(-0.62, 0.68);
  shape.quadraticCurveTo(-0.22, 0.98, 0.38, 0.8);
  shape.quadraticCurveTo(0.61, 0.25, 0.36, -0.42);
  shape.quadraticCurveTo(0.08, -0.9, -0.48, -0.88);
  shape.quadraticCurveTo(-0.84, -0.6, -0.84, -0.08);
  shape.quadraticCurveTo(-0.83, 0.42, -0.62, 0.68);

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.16,
    bevelEnabled: false,
    curveSegments: 2
  });
  return finishMesh(new THREE.Mesh(geometry, material));
}

const bird = new THREE.Group();
scene.add(bird);

const stump = finishMesh(new THREE.Mesh(
  new THREE.CylinderGeometry(0.82, 0.96, 1.55, 12, 1, false),
  mahogany
));
stump.position.y = 0.78;
bird.add(stump);

const stumpTop = finishMesh(new THREE.Mesh(
  new THREE.CylinderGeometry(0.73, 0.8, 0.12, 12),
  mahoganyLight
));
stumpTop.position.y = 1.56;
bird.add(stumpTop);

const stumpGougeA = finishMesh(new THREE.Mesh(
  new THREE.BoxGeometry(0.06, 1.05, 0.035),
  gougeShadow
));
stumpGougeA.position.set(-0.38, 0.82, 0.79);
stumpGougeA.rotation.z = -0.18;
bird.add(stumpGougeA);

const stumpGougeB = finishMesh(new THREE.Mesh(
  new THREE.BoxGeometry(0.05, 0.75, 0.04),
  mahoganyDark
));
stumpGougeB.position.set(0.28, 0.7, 0.8);
stumpGougeB.rotation.z = 0.27;
bird.add(stumpGougeB);

const body = finishMesh(new THREE.Mesh(
  new THREE.SphereGeometry(1, 22, 15),
  mahogany
));
body.position.set(-0.03, 2.78, 0);
body.scale.set(0.92, 1.25, 0.73);
body.rotation.z = -0.08;
bird.add(body);

const breast = finishMesh(new THREE.Mesh(
  new THREE.SphereGeometry(0.7, 18, 12),
  mahoganyLight
));
breast.position.set(0.42, 2.86, 0.48);
breast.scale.set(0.72, 1.0, 0.34);
breast.rotation.z = -0.18;
bird.add(breast);

const farWing = wingPlate(mahoganyDark);
farWing.position.set(-0.25, 2.98, -0.55);
farWing.rotation.y = Math.PI;
bird.add(farWing);

const nearWing = wingPlate(mahoganyLight);
nearWing.position.set(-0.29, 3.02, 0.51);
bird.add(nearWing);

const wingShadowPatch = triangleFacet(
  new THREE.Vector3(-0.91, 3.47, 0.69),
  new THREE.Vector3(-0.35, 3.78, 0.7),
  new THREE.Vector3(-0.5, 3.28, 0.72),
  gougeShadow
);
bird.add(wingShadowPatch);

const wingWarmPatch = triangleFacet(
  new THREE.Vector3(-0.52, 2.26, 0.7),
  new THREE.Vector3(-0.06, 2.43, 0.71),
  new THREE.Vector3(-0.35, 2.83, 0.73),
  waxHighlight
);
bird.add(wingWarmPatch);

const wingReliefMaterial = new THREE.MeshStandardMaterial({
  color: 0x4a1b10,
  roughness: 0.75,
  flatShading: true
});

const wingLines = [
  [new THREE.Vector3(-0.18, 3.62, 0.73), new THREE.Vector3(-0.29, 3.24, 0.75), new THREE.Vector3(-0.62, 2.39, 0.73)],
  [new THREE.Vector3(0.04, 3.6, 0.74), new THREE.Vector3(-0.05, 3.18, 0.76), new THREE.Vector3(-0.4, 2.27, 0.73)],
  [new THREE.Vector3(0.25, 3.48, 0.74), new THREE.Vector3(0.18, 3.04, 0.76), new THREE.Vector3(-0.07, 2.27, 0.73)],
  [new THREE.Vector3(-0.42, 3.54, 0.74), new THREE.Vector3(-0.55, 3.1, 0.76), new THREE.Vector3(-0.76, 2.56, 0.73)],
  [new THREE.Vector3(0.35, 3.24, 0.74), new THREE.Vector3(0.27, 2.8, 0.76), new THREE.Vector3(0.05, 2.45, 0.73)]
];
for (const wingLine of wingLines) {
  bird.add(reliefCurve(wingLine, 0.021, wingReliefMaterial));
}

const breastFacetA = triangleFacet(
  new THREE.Vector3(-0.2, 3.35, 0.68),
  new THREE.Vector3(0.27, 3.58, 0.7),
  new THREE.Vector3(0.04, 3.11, 0.76),
  waxHighlight
);
const breastFacetB = triangleFacet(
  new THREE.Vector3(0.04, 3.11, 0.76),
  new THREE.Vector3(0.46, 3.3, 0.69),
  new THREE.Vector3(0.33, 2.84, 0.78),
  gougeShadow
);
const breastFacetC = triangleFacet(
  new THREE.Vector3(-0.12, 2.72, 0.75),
  new THREE.Vector3(0.33, 2.84, 0.78),
  new THREE.Vector3(0.12, 2.42, 0.7),
  mahoganyLight
);
bird.add(breastFacetA, breastFacetB, breastFacetC);

const tailOne = tailFeather(1.5, 0.29, mahoganyDark);
tailOne.position.set(-0.57, 2.65, 0.08);
tailOne.rotation.z = -0.15;
bird.add(tailOne);

const tailTwo = tailFeather(1.38, 0.34, mahogany);
tailTwo.position.set(-0.6, 2.48, 0.28);
tailTwo.rotation.z = -0.28;
bird.add(tailTwo);

const tailThree = tailFeather(1.25, 0.27, mahoganyLight);
tailThree.position.set(-0.62, 2.4, 0.43);
tailThree.rotation.z = -0.4;
bird.add(tailThree);

const tailGrainMaterial = new THREE.MeshStandardMaterial({
  color: 0x24100b,
  roughness: 0.82
});
bird.add(reliefCurve([
  new THREE.Vector3(-0.7, 2.6, 0.24),
  new THREE.Vector3(-1.12, 2.44, 0.29),
  new THREE.Vector3(-1.78, 2.18, 0.28)
], 0.026, tailGrainMaterial));
bird.add(reliefCurve([
  new THREE.Vector3(-0.66, 2.46, 0.48),
  new THREE.Vector3(-1.1, 2.28, 0.5),
  new THREE.Vector3(-1.67, 1.98, 0.48)
], 0.021, tailGrainMaterial));
bird.add(reliefCurve([
  new THREE.Vector3(-0.72, 2.72, 0.05),
  new THREE.Vector3(-1.15, 2.55, 0.08),
  new THREE.Vector3(-1.93, 2.31, 0.07)
], 0.018, tailGrainMaterial));

const neck = finishMesh(new THREE.Mesh(
  new THREE.SphereGeometry(0.72, 20, 14),
  mahogany
));
neck.position.set(0.27, 3.65, 0);
neck.scale.set(0.73, 0.9, 0.7);
bird.add(neck);

const head = finishMesh(new THREE.Mesh(
  new THREE.SphereGeometry(0.72, 22, 16),
  mahoganyLight
));
head.position.set(0.48, 4.18, 0);
head.scale.set(0.84, 0.86, 0.74);
bird.add(head);

const headFacet = triangleFacet(
  new THREE.Vector3(0.02, 4.48, 0.48),
  new THREE.Vector3(0.5, 4.63, 0.5),
  new THREE.Vector3(0.28, 4.15, 0.7),
  waxHighlight
);
bird.add(headFacet);

const casque = loft([
  new THREE.Vector3(0.55, 4.42, 0),
  new THREE.Vector3(0.58, 4.68, 0),
  new THREE.Vector3(0.78, 4.94, 0),
  new THREE.Vector3(1.0, 4.86, 0),
  new THREE.Vector3(1.12, 4.59, 0)
], [0.3, 0.44, 0.46, 0.3, 0.1], mapleLight, 22);
bird.add(casque);

const casqueFacet = triangleFacet(
  new THREE.Vector3(0.48, 4.68, 0.37),
  new THREE.Vector3(0.78, 4.96, 0.3),
  new THREE.Vector3(0.98, 4.78, 0.36),
  maple
);
bird.add(casqueFacet);

const beak = loft([
  new THREE.Vector3(0.72, 4.15, 0),
  new THREE.Vector3(1.13, 4.23, 0),
  new THREE.Vector3(1.68, 4.18, 0),
  new THREE.Vector3(2.12, 4.01, 0),
  new THREE.Vector3(2.48, 3.76, 0),
  new THREE.Vector3(2.57, 3.48, 0)
], [0.44, 0.43, 0.35, 0.27, 0.15, 0.055], mapleLight, 24);
bird.add(beak);

const lowerBeak = loft([
  new THREE.Vector3(0.75, 3.99, 0),
  new THREE.Vector3(1.2, 3.98, 0),
  new THREE.Vector3(1.72, 3.91, 0),
  new THREE.Vector3(2.15, 3.73, 0),
  new THREE.Vector3(2.51, 3.49, 0)
], [0.26, 0.27, 0.23, 0.15, 0.045], mapleShadow, 20);
bird.add(lowerBeak);

const billSeam = reliefCurve([
  new THREE.Vector3(0.84, 4.01, 0.42),
  new THREE.Vector3(1.3, 4.0, 0.39),
  new THREE.Vector3(1.8, 3.88, 0.3),
  new THREE.Vector3(2.25, 3.68, 0.2),
  new THREE.Vector3(2.5, 3.5, 0.08)
], 0.018, mahoganyDark);
bird.add(billSeam);

const nostril = finishMesh(new THREE.Mesh(
  new THREE.SphereGeometry(0.065, 12, 8),
  eyeMaterial
));
nostril.position.set(1.13, 4.36, 0.37);
nostril.scale.set(1.25, 0.72, 0.5);
bird.add(nostril);

const eyeRing = finishMesh(new THREE.Mesh(
  new THREE.TorusGeometry(0.145, 0.034, 8, 20),
  maple
));
eyeRing.position.set(0.73, 4.27, 0.585);
eyeRing.rotation.x = 0.02;
bird.add(eyeRing);

const eye = finishMesh(new THREE.Mesh(
  new THREE.SphereGeometry(0.092, 16, 12),
  eyeMaterial
));
eye.position.set(0.73, 4.27, 0.625);
eye.scale.set(0.82, 1, 0.48);
bird.add(eye);

const eyeGlint = finishMesh(new THREE.Mesh(
  new THREE.SphereGeometry(0.019, 8, 6),
  new THREE.MeshBasicMaterial({ color: 0xffeac0 })
));
eyeGlint.position.set(0.7, 4.305, 0.682);
bird.add(eyeGlint);

const legMaterial = new THREE.MeshStandardMaterial({
  color: 0x3a160d,
  roughness: 0.72,
  flatShading: true
});
bird.add(cylinderBetween(
  new THREE.Vector3(-0.28, 2.04, 0.18),
  new THREE.Vector3(-0.25, 1.6, 0.2),
  0.095,
  legMaterial,
  8
));
bird.add(cylinderBetween(
  new THREE.Vector3(0.2, 2.02, 0.22),
  new THREE.Vector3(0.23, 1.6, 0.23),
  0.095,
  legMaterial,
  8
));

const toePairs = [
  [new THREE.Vector3(-0.25, 1.62, 0.2), new THREE.Vector3(-0.58, 1.51, 0.42)],
  [new THREE.Vector3(-0.25, 1.62, 0.2), new THREE.Vector3(-0.02, 1.49, 0.47)],
  [new THREE.Vector3(0.23, 1.62, 0.23), new THREE.Vector3(-0.08, 1.5, 0.45)],
  [new THREE.Vector3(0.23, 1.62, 0.23), new THREE.Vector3(0.51, 1.5, 0.42)],
  [new THREE.Vector3(-0.25, 1.61, 0.18), new THREE.Vector3(-0.27, 1.48, -0.18)],
  [new THREE.Vector3(0.23, 1.61, 0.2), new THREE.Vector3(0.2, 1.49, -0.17)]
];
for (const toePair of toePairs) {
  bird.add(cylinderBetween(toePair[0], toePair[1], 0.045, legMaterial, 7));
}

const clawMaterial = new THREE.MeshStandardMaterial({
  color: 0x170a07,
  roughness: 0.5,
  metalness: 0.05
});
const clawPairs = [
  [new THREE.Vector3(-0.58, 1.51, 0.42), new THREE.Vector3(-0.67, 1.42, 0.38)],
  [new THREE.Vector3(-0.02, 1.49, 0.47), new THREE.Vector3(-0.08, 1.4, 0.43)],
  [new THREE.Vector3(-0.08, 1.5, 0.45), new THREE.Vector3(-0.16, 1.41, 0.42)],
  [new THREE.Vector3(0.51, 1.5, 0.42), new THREE.Vector3(0.59, 1.42, 0.37)]
];
for (const clawPair of clawPairs) {
  bird.add(cylinderBetween(clawPair[0], clawPair[1], 0.027, clawMaterial, 6));
}

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x21130e,
  roughness: 0.9,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.CircleGeometry(8, 64), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

const hemiLight = new THREE.HemisphereLight(0xffd8a4, 0x24100b, 2.0);
scene.add(hemiLight);

const keyLight = new THREE.DirectionalLight(0xffd5a0, 4.1);
keyLight.position.set(4.5, 8.5, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -1;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 20;
scene.add(keyLight);

const fillLight = new THREE.PointLight(0xc47743, 3.2, 12, 2);
fillLight.position.set(-4, 4.5, 4.5);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffb35e, 2.2);
rimLight.position.set(-4, 6, -6);
scene.add(rimLight);

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
}

window.addEventListener('resize', onResize);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
