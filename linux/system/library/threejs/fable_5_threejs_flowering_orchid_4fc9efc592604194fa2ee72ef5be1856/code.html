<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Moth Orchid</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #eceae4; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeceae4);
scene.fog = new THREE.Fog(0xeceae4, 8, 20);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.2, 2.6, 4.6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.35, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.0;
controls.minDistance = 2.5;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.52;

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xfff4e6, 0xb8b0a4, 0.55));
const key = new THREE.DirectionalLight(0xfff1dd, 1.5);
key.position.set(4, 7, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4; key.shadow.camera.right = 4;
key.shadow.camera.top = 4; key.shadow.camera.bottom = -4;
key.shadow.bias = -0.0004;
key.shadow.radius = 6;
scene.add(key);
const fill = new THREE.DirectionalLight(0xdce8ff, 0.45);
fill.position.set(-5, 3, -4);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 0.35);
rim.position.set(0, 4, -6);
scene.add(rim);

// ---------- Ground (soft shadow catcher) ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 64),
  new THREE.ShadowMaterial({ opacity: 0.22 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const disc = new THREE.Mesh(
  new THREE.CircleGeometry(9, 64),
  new THREE.MeshStandardMaterial({ color: 0xe6e3dc, roughness: 1 })
);
disc.rotation.x = -Math.PI / 2;
disc.position.y = -0.002;
scene.add(disc);

// ---------- Materials ----------
const potMat = new THREE.MeshStandardMaterial({ color: 0xd9d4ca, roughness: 0.45, metalness: 0.02 });
const soilMat = new THREE.MeshStandardMaterial({ color: 0x3d2f24, roughness: 1 });
const leafMat = new THREE.MeshPhysicalMaterial({
  color: 0x2c6b34, roughness: 0.32, clearcoat: 0.7, clearcoatRoughness: 0.35,
  side: THREE.DoubleSide, sheen: 0.4, sheenColor: new THREE.Color(0x9fd08a)
});
const stemMat = new THREE.MeshStandardMaterial({ color: 0x5a7d3a, roughness: 0.7 });
const stakeMat = new THREE.MeshStandardMaterial({ color: 0x8a9b57, roughness: 0.55 });
const clipMat = new THREE.MeshStandardMaterial({ color: 0xcfd8dc, roughness: 0.4, metalness: 0.1 });
const petalMat = new THREE.MeshPhysicalMaterial({
  color: 0xfdf5fb, roughness: 0.55, transmission: 0.12, thickness: 0.05,
  side: THREE.DoubleSide, sheen: 1.0, sheenColor: new THREE.Color(0xf3c4e6), sheenRoughness: 0.6
});
const sepalMat = petalMat.clone();
sepalMat.color = new THREE.Color(0xf9e9f6);
const lipMat = new THREE.MeshPhysicalMaterial({
  color: 0xa8237d, roughness: 0.45, clearcoat: 0.4, side: THREE.DoubleSide
});
const columnMat = new THREE.MeshStandardMaterial({ color: 0xfff3d6, roughness: 0.5 });
const budMat = new THREE.MeshStandardMaterial({ color: 0xbede9a, roughness: 0.6 });

const orchid = new THREE.Group();
scene.add(orchid);

function shadowify(o) { o.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } }); }

// ---------- Pot ----------
const potPts = [];
for (let i = 0; i <= 12; i++) {
  const t = i / 12;
  potPts.push(new THREE.Vector2(0.42 + 0.16 * Math.pow(t, 1.25), t * 0.62));
}
const pot = new THREE.Mesh(new THREE.LatheGeometry(potPts, 48), potMat);
const potRimGeo = new THREE.TorusGeometry(0.585, 0.028, 12, 48);
const potRim = new THREE.Mesh(potRimGeo, potMat);
potRim.rotation.x = Math.PI / 2;
potRim.position.y = 0.62;
const soil = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.05, 40), soilMat);
soil.position.y = 0.585;
orchid.add(pot, potRim, soil);
// bark chips
for (let i = 0; i < 26; i++) {
  const a = Math.random() * Math.PI * 2, r = Math.random() * 0.48;
  const chip = new THREE.Mesh(new THREE.DodecahedronGeometry(0.035 + Math.random() * 0.03, 0), soilMat.clone());
  chip.material.color.setHSL(0.07, 0.4, 0.16 + Math.random() * 0.12);
  chip.position.set(Math.cos(a) * r, 0.615, Math.sin(a) * r);
  chip.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  chip.scale.y = 0.5;
  orchid.add(chip);
}

// ---------- Leaves ----------
function makeLeaf(len, wid) {
  const seg = 22, geo = new THREE.PlaneGeometry(1, 1, seg, 6);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i) + 0.5;           // 0..1 along leaf
    const y = pos.getY(i);                  // -0.5..0.5 across
    const half = Math.sin(Math.pow(x, 0.75) * Math.PI) * 0.5 * (1 - 0.15 * x);
    const ny = y * 2 * half;
    const droop = -Math.pow(x, 2.1) * 0.55 + x * 0.32;
    const cup = -(ny * ny) * 1.4 - Math.abs(ny) * 0.12;
    const ripple = Math.sin(x * 14) * 0.008 * x;
    pos.setXYZ(i, x * len, droop * len + cup * wid + ripple, ny * wid);
  }
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, leafMat);
}
const leafSpecs = [
  { a: 0.35, len: 1.45, wid: 0.5, tilt: 0.10 },
  { a: Math.PI + 0.5, len: 1.55, wid: 0.55, tilt: 0.06 },
  { a: Math.PI * 0.55 + 1.9, len: 1.15, wid: 0.42, tilt: 0.22 },
  { a: -1.15, len: 1.0, wid: 0.38, tilt: 0.3 }
];
for (const s of leafSpecs) {
  const leaf = makeLeaf(s.len, s.wid);
  leaf.position.set(Math.cos(s.a) * 0.07, 0.62, Math.sin(s.a) * 0.07);
  leaf.rotation.y = -s.a;
  leaf.rotation.z = s.tilt;
  orchid.add(leaf);
}

// ---------- Flower stem (arching spike) ----------
const stemPts = [
  new THREE.Vector3(0.02, 0.62, 0.0),
  new THREE.Vector3(0.05, 1.15, 0.02),
  new THREE.Vector3(0.06, 1.7, 0.03),
  new THREE.Vector3(0.13, 2.2, 0.04),
  new THREE.Vector3(0.38, 2.62, 0.05),
  new THREE.Vector3(0.75, 2.88, 0.05),
  new THREE.Vector3(1.15, 2.96, 0.03),
  new THREE.Vector3(1.5, 2.9, 0.0)
];
const stemCurve = new THREE.CatmullRomCurve3(stemPts);
const stem = new THREE.Mesh(
  new THREE.TubeGeometry(stemCurve, 80, 0.022, 10),
  stemMat
);
orchid.add(stem);

// ---------- Support stake + clips ----------
const stake = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 1.95, 10), stakeMat);
stake.position.set(0.09, 0.6 + 0.975, 0.06);
orchid.add(stake);
const stakeCap = new THREE.Mesh(new THREE.SphereGeometry(0.022, 10, 8), stakeMat);
stakeCap.position.set(0.09, 2.575, 0.06);
orchid.add(stakeCap);
function makeClip(y, t) {
  const p = stemCurve.getPoint(t);
  const clip = new THREE.Group();
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.014, 8, 20, Math.PI * 1.7), clipMat);
  ring.rotation.x = Math.PI / 2;
  ring.rotation.z = 0.6;
  clip.add(ring);
  const grip = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.028), clipMat);
  grip.position.set(0.055, 0, 0.03);
  clip.add(grip);
  clip.position.set((p.x + 0.09) / 2, y, (p.z + 0.06) / 2);
  return clip;
}
orchid.add(makeClip(1.35, 0.28), makeClip(2.05, 0.52));

// ---------- Petal geometry helpers ----------
function petalGeo(len, wid, cup, notch) {
  const geo = new THREE.PlaneGeometry(1, 1, 14, 8);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i) + 0.5;
    const y = pos.getY(i);
    let half = Math.sin(Math.pow(x, 0.62) * Math.PI);
    if (notch) half *= 1 - 0.25 * Math.exp(-Math.pow((x - 1) * 6, 2));
    const ny = y * half;
    const z = (-(ny * ny) * cup - Math.pow(x, 2) * cup * 0.35 + Math.sin(x * 9) * 0.006) * len;
    pos.setXYZ(i, x * len, ny * wid, z);
  }
  geo.computeVertexNormals();
  return geo;
}

// ---------- One bloom ----------
function makeFlower(scale) {
  const f = new THREE.Group();
  // 3 sepals (back, narrower)
  const sGeo = petalGeo(0.30, 0.13, 0.5, false);
  for (const a of [Math.PI / 2, Math.PI / 2 + 2.15, Math.PI / 2 - 2.15]) {
    const s = new THREE.Mesh(sGeo, sepalMat);
    s.rotation.set(0, 0, a);
    s.rotateOnAxis(new THREE.Vector3(0, 1, 0), -0.32);
    s.position.z = -0.012;
    f.add(s);
  }
  // 2 broad lateral petals — the moth "wings"
  const pGeo = petalGeo(0.30, 0.27, 0.55, true);
  for (const a of [Math.PI * 0.86, Math.PI * 0.14]) {
    const p = new THREE.Mesh(pGeo, petalMat);
    p.rotation.set(0, 0, a);
    p.rotateOnAxis(new THREE.Vector3(0, 1, 0), -0.42);
    p.position.z = 0.01;
    f.add(p);
  }
  // lip (labellum)
  const lip = new THREE.Group();
  const lipMid = new THREE.Mesh(petalGeo(0.16, 0.055, 1.6, false), lipMat);
  lipMid.rotation.z = -Math.PI / 2;
  lipMid.rotateOnAxis(new THREE.Vector3(0, 1, 0), 0.85);
  lip.add(lipMid);
  for (const sgn of [-1, 1]) {
    const lobe = new THREE.Mesh(petalGeo(0.09, 0.05, 1.2, false), lipMat);
    lobe.rotation.z = -Math.PI / 2 + sgn * 1.05;
    lobe.rotateOnAxis(new THREE.Vector3(0, 1, 0), 0.5);
    lip.add(lobe);
  }
  for (const sgn of [-1, 1]) {
    const whisker = new THREE.Mesh(new THREE.CylinderGeometry(0.0035, 0.001, 0.11, 6), lipMat);
    whisker.position.set(sgn * 0.02, -0.15, 0.075);
    whisker.rotation.set(0.9, 0, sgn * 0.55);
    lip.add(whisker);
  }
  lip.position.set(0, -0.015, 0.035);
  f.add(lip);
  // column
  const col = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.024, 0.075, 10), columnMat);
  col.rotation.x = 1.15;
  col.position.set(0, 0.005, 0.045);
  f.add(col);
  const anther = new THREE.Mesh(new THREE.SphereGeometry(0.02, 10, 8), columnMat);
  anther.position.set(0, -0.022, 0.075);
  f.add(anther);
  f.scale.setScalar(scale);
  return f;
}

// ---------- Blooms along the spike ----------
const bloomTs = [0.5, 0.585, 0.67, 0.755, 0.84];
bloomTs.forEach((t, i) => {
  const p = stemCurve.getPoint(t);
  const tan = stemCurve.getTangent(t);
  const side = i % 2 === 0 ? 1 : -1;
  // short pedicel
  const out = new THREE.Vector3(side * 0.35, 0.12, side * 0.55 + 0.25).normalize();
  const end = p.clone().addScaledVector(out, 0.16).add(new THREE.Vector3(0, -0.03, 0));
  const pedCurve = new THREE.CatmullRomCurve3([p, p.clone().addScaledVector(out, 0.08).add(new THREE.Vector3(0, 0.02, 0)), end]);
  const ped = new THREE.Mesh(new THREE.TubeGeometry(pedCurve, 10, 0.011, 8), stemMat);
  orchid.add(ped);
  const flower = makeFlower(1.05 - i * 0.045);
  flower.position.copy(end);
  const face = out.clone().add(new THREE.Vector3(tan.x * 0.3, -0.35, 0)).normalize();
  flower.lookAt(end.clone().add(face));
  flower.rotateZ(side * 0.15);
  orchid.add(flower);
});
// buds at the tip
[0.905, 0.955, 0.99].forEach((t, i) => {
  const p = stemCurve.getPoint(t);
  const bud = new THREE.Mesh(new THREE.SphereGeometry(0.052 - i * 0.014, 12, 10), budMat);
  bud.scale.set(0.8, 1, 0.8);
  bud.position.copy(p).add(new THREE.Vector3(0.02, -0.035 - i * 0.005, (i % 2 ? -1 : 1) * 0.03));
  orchid.add(bud);
});

shadowify(orchid);

// ---------- Resize + loop ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  orchid.rotation.z = Math.sin(t * 0.7) * 0.004;
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
