<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Cavern Lake</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05040c; }
  canvas { display: block; }
  #label {
    position: fixed; left: 18px; bottom: 15px; pointer-events: none;
    color: #d8f8ff; font: 11px/1.4 system-ui, sans-serif; letter-spacing: .22em;
    text-transform: uppercase; opacity: .62; text-shadow: 0 0 12px #68dfff;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">Crystal Cavern Lake</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05040c);
scene.fog = new THREE.FogExp2(0x0a0820, 0.025);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.35;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 180);
camera.position.set(19, 10, 22);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.22;
controls.minDistance = 10;
controls.maxDistance = 42;
controls.maxPolarAngle = Math.PI * 0.49;

let seed = 842719;
function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a, b) { return a + (b - a) * rand(); }
function pick(array) { return array[Math.floor(rand() * array.length)]; }

const clock = new THREE.Clock();
const animated = [];
const pulseLights = [];
const wormDots = [];
const waterRipples = [];

const cavern = new THREE.Group();
scene.add(cavern);

function makeCanvasTexture(draw, size = 256) {
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext("2d");
  draw(ctx, size);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
  return texture;
}

const rockTexture = makeCanvasTexture((ctx, s) => {
  const g = ctx.createRadialGradient(s * .5, s * .45, 5, s * .5, s * .5, s * .72);
  g.addColorStop(0, "#2d2440");
  g.addColorStop(.55, "#171324");
  g.addColorStop(1, "#090916");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 1900; i++) {
    const v = Math.floor(range(0, 55));
    ctx.fillStyle = `rgba(${v + 18},${v + 10},${v + 42},${range(.02, .13)})`;
    const x = rand() * s, y = rand() * s, r = range(.25, 2.4);
    ctx.fillRect(x, y, r, r);
  }
});

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x171126,
  map: rockTexture,
  roughness: 0.93,
  metalness: 0.05
});

const caveMaterial = new THREE.MeshStandardMaterial({
  color: 0x100d1d,
  map: rockTexture,
  roughness: 0.95,
  metalness: 0.04,
  side: THREE.BackSide
});

const darkRockMaterial = new THREE.MeshStandardMaterial({
  color: 0x151025,
  roughness: 0.91,
  metalness: 0.08
});

const wetRockMaterial = new THREE.MeshStandardMaterial({
  color: 0x15152b,
  roughness: 0.38,
  metalness: 0.32
});

const floor = new THREE.Mesh(new THREE.CircleGeometry(40, 96), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.22;
floor.receiveShadow = true;
cavern.add(floor);

const caveShell = new THREE.Mesh(new THREE.SphereGeometry(37, 48, 32), caveMaterial);
caveShell.scale.set(1, .57, .84);
caveShell.position.y = 14;
cavern.add(caveShell);

function rock(height, radius, material = darkRockMaterial, sides = 7) {
  const geometry = new THREE.ConeGeometry(radius, height, sides, 3);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

for (let i = 0; i < 70; i++) {
  const angle = rand() * Math.PI * 2;
  const distance = range(14, 31);
  const h = range(1.2, 6.5);
  const r = range(1.1, 4.1);
  const mesh = rock(h, r, pick([darkRockMaterial, wetRockMaterial]), Math.floor(range(5, 9)));
  mesh.position.set(Math.cos(angle) * distance, -1.2 + h * .32, Math.sin(angle) * distance);
  mesh.rotation.set(range(-.35, .35), rand() * Math.PI, range(-.35, .35));
  mesh.scale.set(range(.7, 1.3), 1, range(.7, 1.35));
  cavern.add(mesh);
}

const waterTexture = makeCanvasTexture((ctx, s) => {
  const g = ctx.createLinearGradient(0, 0, 0, s);
  g.addColorStop(0, "#5eeeff");
  g.addColorStop(.42, "#114b83");
  g.addColorStop(1, "#130f47");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  for (let i = 0; i < 120; i++) {
    ctx.strokeStyle = `rgba(211,255,255,${range(.04, .18)})`;
    ctx.lineWidth = range(.3, 1.2);
    ctx.beginPath();
    const y = rand() * s;
    ctx.moveTo(0, y);
    for (let x = 0; x <= s; x += 16) ctx.lineTo(x, y + Math.sin(x * .09 + i) * range(1, 5));
    ctx.stroke();
  }
});

const lake = new THREE.Mesh(
  new THREE.CircleGeometry(11.7, 96),
  new THREE.MeshPhysicalMaterial({
    color: 0x126ca2,
    map: waterTexture,
    transparent: true,
    opacity: .84,
    roughness: .08,
    metalness: .05,
    clearcoat: 1,
    clearcoatRoughness: .08,
    transmission: .08,
    thickness: 1.2,
    reflectivity: 1
  })
);
lake.rotation.x = -Math.PI / 2;
lake.position.y = -1.09;
lake.receiveShadow = true;
cavern.add(lake);

const lakeBed = new THREE.Mesh(
  new THREE.CircleGeometry(11.35, 80),
  new THREE.MeshStandardMaterial({ color: 0x091832, roughness: .7, metalness: .2 })
);
lakeBed.rotation.x = -Math.PI / 2;
lakeBed.position.y = -1.48;
cavern.add(lakeBed);

function makeCrystalMaterial(color, emissive, strength = 0.5) {
  return new THREE.MeshPhysicalMaterial({
    color,
    emissive,
    emissiveIntensity: strength,
    roughness: 0.18,
    metalness: 0.12,
    transmission: 0.18,
    thickness: 1.8,
    ior: 1.46,
    transparent: true,
    opacity: 0.91,
    side: THREE.DoubleSide
  });
}

const amethyst = makeCrystalMaterial(0xa85dff, 0x6c18d5, .7);
const aquamarine = makeCrystalMaterial(0x59f5ff, 0x087ba9, .66);
const roseCrystal = makeCrystalMaterial(0xff8ed5, 0x9e207e, .54);
const paleCrystal = makeCrystalMaterial(0xc2fbff, 0x357ca7, .68);
const innerAmethyst = makeCrystalMaterial(0xdca4ff, 0x9e3bff, 1.15);
const innerAqua = makeCrystalMaterial(0xb9ffff, 0x17b9e8, 1.1);

function crystalMesh(radius, height, material) {
  const geometry = new THREE.CylinderGeometry(radius * .64, radius, height, 6, 1, false);
  geometry.rotateY(Math.PI / 6);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function createCrystalCluster(position, scale, material, accent, count = 8, tilt = .45) {
  const group = new THREE.Group();
  group.position.copy(position);
  const base = new THREE.Mesh(
    new THREE.DodecahedronGeometry(scale * .54, 1),
    wetRockMaterial
  );
  base.scale.y = .48;
  base.position.y = -scale * .08;
  base.castShadow = true;
  base.receiveShadow = true;
  group.add(base);

  for (let i = 0; i < count; i++) {
    const a = (i / count) * Math.PI * 2 + range(-.28, .28);
    const d = i === 0 ? 0 : range(scale * .08, scale * .62);
    const h = i === 0 ? scale * range(2.1, 2.65) : scale * range(.7, 1.75);
    const r = scale * (i === 0 ? range(.26, .39) : range(.13, .28));
    const crystal = crystalMesh(r, h, i === 0 ? accent : material);
    crystal.position.set(Math.cos(a) * d, h * .5, Math.sin(a) * d);
    crystal.rotation.set(range(-tilt, tilt), range(0, Math.PI), range(-tilt, tilt));
    group.add(crystal);

    const cap = new THREE.Mesh(
      new THREE.OctahedronGeometry(r * .82, 0),
      i === 0 ? accent : material
    );
    cap.position.set(crystal.position.x, h, crystal.position.z);
    cap.scale.set(.95, 1.25, .95);
    cap.rotation.copy(crystal.rotation);
    group.add(cap);
  }

  cavern.add(group);
  animated.push({ object: group, speed: range(.13, .28), phase: rand() * 6.28, baseY: position.y });
  return group;
}

const heroA = createCrystalCluster(new THREE.Vector3(-7.4, -1.1, -2.5), 2.35, amethyst, innerAmethyst, 11, .25);
const heroB = createCrystalCluster(new THREE.Vector3(6.7, -1.1, -4.9), 2.25, aquamarine, innerAqua, 10, .3);
const heroC = createCrystalCluster(new THREE.Vector3(-1.4, -1.08, -10.2), 1.75, aquamarine, paleCrystal, 9, .34);
const heroD = createCrystalCluster(new THREE.Vector3(9.7, -1.1, 4.5), 1.48, roseCrystal, innerAmethyst, 8, .4);
const heroE = createCrystalCluster(new THREE.Vector3(-11, -1.1, 6.1), 1.32, amethyst, innerAmethyst, 8, .42);

for (let i = 0; i < 21; i++) {
  const a = rand() * Math.PI * 2;
  const d = range(12.3, 23);
  const s = range(.24, .72);
  createCrystalCluster(
    new THREE.Vector3(Math.cos(a) * d, -1.1, Math.sin(a) * d),
    s,
    pick([amethyst, aquamarine, roseCrystal, paleCrystal]),
    pick([innerAmethyst, innerAqua, paleCrystal]),
    Math.floor(range(3, 6)),
    .7
  );
}

function makeBridge() {
  const bridge = new THREE.Group();
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-10.5, 1.65, 3.8),
    new THREE.Vector3(-5.2, 2.15, 1.2),
    new THREE.Vector3(0, 2.45, .2),
    new THREE.Vector3(5.2, 2.18, -1.1),
    new THREE.Vector3(10.3, 1.55, -3.6)
  ]);
  const body = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 64, .72, 8, false),
    new THREE.MeshStandardMaterial({
      color: 0x373050,
      roughness: .52,
      metalness: .25,
      emissive: 0x16162b,
      emissiveIntensity: .22
    })
  );
  body.castShadow = true;
  body.receiveShadow = true;
  bridge.add(body);

  for (let i = 0; i < 28; i++) {
    const t = i / 27;
    const p = curve.getPoint(t);
    const tangent = curve.getTangent(t).normalize();
    const side = new THREE.Vector3(-tangent.z, 0, tangent.x).normalize();
    const slab = new THREE.Mesh(
      new THREE.BoxGeometry(.72, .12, 1.72),
      new THREE.MeshStandardMaterial({ color: 0x4e4164, roughness: .62, metalness: .16 })
    );
    slab.position.copy(p).add(new THREE.Vector3(0, .12, 0));
    slab.rotation.y = Math.atan2(tangent.x, tangent.z);
    slab.castShadow = true;
    slab.receiveShadow = true;
    bridge.add(slab);

    if (i > 2 && i < 25 && i % 2 === 0) {
      for (const sign of [-1, 1]) {
        const shard = crystalMesh(.12, range(.42, .82), sign > 0 ? aquamarine : amethyst);
        shard.position.copy(p).add(side.multiplyScalar(sign * .78)).add(new THREE.Vector3(0, .43, 0));
        shard.rotation.z = sign * range(.15, .4);
        bridge.add(shard);
      }
    }
  }
  cavern.add(bridge);
}
makeBridge();

function stalactite(x, z, length, radius) {
  const group = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.ConeGeometry(radius, length, 7, 3),
    darkRockMaterial
  );
  body.position.y = 12.1 - length * .5;
  body.castShadow = true;
  group.add(body);

  if (rand() > .35) {
    const crystal = crystalMesh(radius * .31, length * .42, pick([amethyst, aquamarine, paleCrystal]));
    crystal.position.y = 12.02 - length * .95;
    crystal.rotation.set(Math.PI, 0, 0);
    group.add(crystal);
  }

  group.position.set(x, 0, z);
  cavern.add(group);
}

for (let i = 0; i < 75; i++) {
  const a = rand() * Math.PI * 2;
  const d = range(2, 31);
  stalactite(Math.cos(a) * d, Math.sin(a) * d, range(.8, 4.8), range(.12, .65));
}

const dripMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x93eeff,
  emissive: 0x164b84,
  emissiveIntensity: .5,
  roughness: .12,
  transmission: .65,
  transparent: true,
  opacity: .72
});

for (let i = 0; i < 19; i++) {
  const a = rand() * Math.PI * 2;
  const d = range(5, 23);
  const drop = new THREE.Mesh(new THREE.SphereGeometry(range(.035, .09), 8, 8), dripMaterial);
  drop.position.set(Math.cos(a) * d, range(4.5, 10.5), Math.sin(a) * d);
  cavern.add(drop);
  animated.push({ object: drop, drip: true, startY: drop.position.y, phase: rand() * 6.28, speed: range(.4, .9) });
}

function mineralShard(position, size, material) {
  const shard = crystalMesh(size * .28, size, material);
  shard.position.copy(position);
  shard.rotation.set(range(-1.25, 1.25), range(0, Math.PI), range(-1.25, 1.25));
  cavern.add(shard);
  return shard;
}

for (let i = 0; i < 180; i++) {
  const a = rand() * Math.PI * 2;
  const d = range(11.8, 27);
  const p = new THREE.Vector3(Math.cos(a) * d, -1.03, Math.sin(a) * d);
  mineralShard(p, range(.12, .58), pick([amethyst, aquamarine, roseCrystal, paleCrystal]));
}

for (let i = 0; i < 62; i++) {
  const a = rand() * Math.PI * 2;
  const d = Math.sqrt(rand()) * 10.7;
  const p = new THREE.Vector3(Math.cos(a) * d, -1.03, Math.sin(a) * d);
  mineralShard(p, range(.08, .31), pick([amethyst, aquamarine, paleCrystal]));
}

function createGlowwormTexture() {
  return makeCanvasTexture((ctx, s) => {
    const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    g.addColorStop(0, "rgba(235,255,202,1)");
    g.addColorStop(.13, "rgba(158,255,135,.96)");
    g.addColorStop(.37, "rgba(74,235,166,.38)");
    g.addColorStop(1, "rgba(34,176,215,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);
  }, 128);
}

const wormTexture = createGlowwormTexture();
const wormMaterial = new THREE.SpriteMaterial({
  map: wormTexture,
  color: 0xbaffb1,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

function constellation(center, count, radius) {
  const group = new THREE.Group();
  group.position.copy(center);
  for (let i = 0; i < count; i++) {
    const sprite = new THREE.Sprite(wormMaterial.clone());
    const a = rand() * Math.PI * 2;
    const d = Math.sqrt(rand()) * radius;
    sprite.position.set(Math.cos(a) * d, range(-.25, .25), Math.sin(a) * d);
    const s = range(.09, .26);
    sprite.scale.set(s, s, 1);
    group.add(sprite);
    wormDots.push({ sprite, phase: rand() * 6.28, scale: s, speed: range(.7, 2.1) });
  }
  cavern.add(group);
}

constellation(new THREE.Vector3(-9, 10.5, -5), 54, 5.8);
constellation(new THREE.Vector3(6, 11.4, 2), 47, 5.2);
constellation(new THREE.Vector3(0, 10.9, 10), 33, 3.7);

const rippleMaterial = new THREE.MeshBasicMaterial({
  color: 0x9afaff,
  transparent: true,
  opacity: .28,
  side: THREE.DoubleSide,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

for (let i = 0; i < 11; i++) {
  const a = rand() * Math.PI * 2;
  const d = Math.sqrt(rand()) * 9.5;
  const ring = new THREE.Mesh(new THREE.RingGeometry(.42, .48, 40), rippleMaterial.clone());
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(Math.cos(a) * d, -1.06, Math.sin(a) * d);
  ring.scale.set(range(.3, 1), range(.3, 1), 1);
  cavern.add(ring);
  waterRipples.push({ ring, phase: rand() * 6.28, base: range(.16, .72) });
}

const ambient = new THREE.HemisphereLight(0x433075, 0x091226, 1.25);
scene.add(ambient);

const moonLight = new THREE.DirectionalLight(0xbac8ff, 1.3);
moonLight.position.set(-8, 16, 7);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.left = -28;
moonLight.shadow.camera.right = 28;
moonLight.shadow.camera.top = 28;
moonLight.shadow.camera.bottom = -28;
moonLight.shadow.camera.near = 1;
moonLight.shadow.camera.far = 55;
scene.add(moonLight);

function orbLight(position, color, intensity, distance, size) {
  const light = new THREE.PointLight(color, intensity, distance, 2);
  light.position.copy(position);
  light.castShadow = true;
  light.shadow.mapSize.set(512, 512);
  scene.add(light);

  const orb = new THREE.Mesh(
    new THREE.SphereGeometry(size, 16, 12),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .8 })
  );
  orb.position.copy(position);
  scene.add(orb);
  pulseLights.push({ light, orb, phase: rand() * 6.28, base: intensity, color });
}

orbLight(new THREE.Vector3(-7, 3.1, -2), 0xb34cff, 17, 13, .22);
orbLight(new THREE.Vector3(6.5, 3.0, -4.3), 0x39eaff, 18, 13, .22);
orbLight(new THREE.Vector3(-.5, 4.2, -9.5), 0x68efff, 12, 12, .16);
orbLight(new THREE.Vector3(7.7, 3.5, 5), 0xff78c9, 10, 10, .16);

const overheadGlow = new THREE.PointLight(0x6d57ff, 6, 35, 2);
overheadGlow.position.set(0, 9, 0);
scene.add(overheadGlow);

const entranceGlow = new THREE.PointLight(0x1c9cff, 4, 32, 2);
entranceGlow.position.set(0, 4, 23);
scene.add(entranceGlow);

function createMist() {
  const texture = makeCanvasTexture((ctx, s) => {
    const g = ctx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    g.addColorStop(0, "rgba(111,235,255,.42)");
    g.addColorStop(.35, "rgba(93,127,255,.15)");
    g.addColorStop(1, "rgba(20,13,55,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, s, s);
  }, 256);

  const material = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    opacity: .16,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });

  for (let i = 0; i < 19; i++) {
    const sprite = new THREE.Sprite(material.clone());
    const a = rand() * Math.PI * 2;
    const d = range(3, 22);
    sprite.position.set(Math.cos(a) * d, range(-.45, 2.4), Math.sin(a) * d);
    const s = range(4, 10);
    sprite.scale.set(s * 1.55, s, 1);
    cavern.add(sprite);
    animated.push({ object: sprite, mist: true, phase: rand() * 6.28, speed: range(.08, .18), x: sprite.position.x, z: sprite.position.z });
  }
}
createMist();

const ceilingGlow = new THREE.Mesh(
  new THREE.CircleGeometry(10, 64),
  new THREE.MeshBasicMaterial({
    color: 0x23144f,
    transparent: true,
    opacity: .24,
    side: THREE.DoubleSide
  })
);
ceilingGlow.rotation.x = Math.PI / 2;
ceilingGlow.position.y = 11.8;
cavern.add(ceilingGlow);

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  overheadGlow.color.setHSL(.70 + Math.sin(t * .13) * .09, .77, .58);
  overheadGlow.intensity = 5.5 + Math.sin(t * .72) * 1.7;
  entranceGlow.color.setHSL(.52 + Math.sin(t * .11 + 1.4) * .08, .82, .56);

  pulseLights.forEach((entry, i) => {
    const pulse = .72 + Math.sin(t * (1.15 + i * .13) + entry.phase) * .28;
    entry.light.intensity = entry.base * pulse;
    entry.orb.scale.setScalar(.82 + pulse * .32);
    entry.orb.material.color.setHSL(.55 + Math.sin(t * .16 + i) * .13, .88, .62);
  });

  animated.forEach(entry => {
    if (entry.drip) {
      const cycle = (Math.sin(t * entry.speed + entry.phase) + 1) * .5;
      entry.object.position.y = entry.startY - cycle * 2.5;
      entry.object.scale.setScalar(.7 + cycle * .5);
    } else if (entry.mist) {
      entry.object.position.x = entry.x + Math.sin(t * entry.speed + entry.phase) * 1.3;
      entry.object.position.z = entry.z + Math.cos(t * entry.speed * .82 + entry.phase) * .9;
      entry.object.material.opacity = .08 + (Math.sin(t * .32 + entry.phase) + 1) * .045;
    } else {
      const glow = .88 + Math.sin(t * entry.speed + entry.phase) * .12;
      entry.object.scale.setScalar(glow);
    }
  });

  wormDots.forEach(entry => {
    const glow = .42 + (Math.sin(t * entry.speed + entry.phase) + 1) * .35;
    entry.sprite.material.opacity = glow;
    const s = entry.scale * (.72 + glow * .55);
    entry.sprite.scale.set(s, s, 1);
  });

  waterRipples.forEach(entry => {
    const wave = (Math.sin(t * .68 + entry.phase) + 1) * .5;
    const s = entry.base + wave * 1.4;
    entry.ring.scale.set(s, s, 1);
    entry.ring.material.opacity = .2 * (1 - wave);
  });

  lake.material.map.offset.x = t * .004;
  lake.material.map.offset.y = t * .002;
  lake.material.emissive = new THREE.Color().setHSL(.56 + Math.sin(t * .16) * .04, .75, .09);
  lake.material.emissiveIntensity = .42 + Math.sin(t * .7) * .12;

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
</html>
