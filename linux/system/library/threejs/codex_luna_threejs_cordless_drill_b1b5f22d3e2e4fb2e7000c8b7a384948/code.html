<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Cordless Drill</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#10151a}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10151a);
scene.fog = new THREE.Fog(0x10151a, 12, 25);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(7.8, 4.8, 7.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.target.set(0.55, 0.1, 0);

const yellow = new THREE.MeshStandardMaterial({ color: 0xd5a51e, roughness: 0.34, metalness: 0.08 });
const yellowDark = new THREE.MeshStandardMaterial({ color: 0x9c7411, roughness: 0.42, metalness: 0.08 });
const black = new THREE.MeshStandardMaterial({ color: 0x111416, roughness: 0.78, metalness: 0.04 });
const rubber = new THREE.MeshStandardMaterial({ color: 0x202426, roughness: 0.94, metalness: 0 });
const rubberEdge = new THREE.MeshStandardMaterial({ color: 0x303638, roughness: 0.88 });
const steel = new THREE.MeshStandardMaterial({ color: 0x8d9697, roughness: 0.28, metalness: 0.86 });
const darkSteel = new THREE.MeshStandardMaterial({ color: 0x343a3b, roughness: 0.34, metalness: 0.8 });
const red = new THREE.MeshStandardMaterial({ color: 0x9d2118, roughness: 0.4, metalness: 0.1 });

function rounded(w, h, d, r, material, pos, rot = [0,0,0]) {
  const mesh = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, r, 5), material);
  mesh.position.set(...pos);
  mesh.rotation.set(...rot);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function box(w, h, d, material, pos, rot = [0,0,0]) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  mesh.position.set(...pos);
  mesh.rotation.set(...rot);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function cylinder(radius, depth, material, pos, rot = [0,0,0], radialSegments = 32) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, depth, radialSegments), material);
  mesh.position.set(...pos);
  mesh.rotation.set(...rot);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

const drill = new THREE.Group();
scene.add(drill);

function addToDrill(mesh) {
  scene.remove(mesh);
  drill.add(mesh);
  return mesh;
}

const bodyUpper = rounded(3.65, 2.25, 1.25, 0.28, yellow, [-0.05, 1.02, 0]);
const bodyLower = rounded(3.58, 2.05, 1.22, 0.25, yellowDark, [-0.08, 0.83, 0]);
addToDrill(bodyUpper);
addToDrill(bodyLower);

const sidePanelL = rounded(2.55, 1.6, 0.12, 0.08, yellow, [-0.32, 1.12, 0.67]);
const sidePanelR = rounded(2.55, 1.6, 0.12, 0.08, yellow, [-0.32, 1.12, -0.67]);
addToDrill(sidePanelL);
addToDrill(sidePanelR);

const rearBlack = rounded(1.2, 1.7, 1.34, 0.22, black, [-1.48, 1.02, 0]);
addToDrill(rearBlack);

const topVent = rounded(1.35, 0.28, 1.42, 0.08, black, [-0.55, 2.16, 0]);
addToDrill(topVent);
for (let i = 0; i < 5; i++) {
  const vent = box(0.12, 0.08, 1.05, rubberEdge, [-1.1 + i * 0.28, 2.34, 0], [0, 0.12, 0]);
  addToDrill(vent);
}

const grip = rounded(1.28, 3.45, 1.42, 0.25, rubber, [-0.72, -0.52, 0], [0, 0, -0.17]);
addToDrill(grip);

const gripPanel = rounded(1.02, 2.86, 0.12, 0.08, rubberEdge, [-0.67, -0.54, 0.73], [0, 0, -0.17]);
addToDrill(gripPanel);

for (let i = 0; i < 8; i++) {
  const groove = box(0.12, 0.055, 1.18, black, [-1.14 + i * 0.13, -0.3 - i * 0.18, 0], [0, 0, -0.17]);
  addToDrill(groove);
}

const triggerGuard = rounded(0.94, 0.82, 1.12, 0.18, black, [-0.35, -0.12, 0], [0, 0, -0.1]);
addToDrill(triggerGuard);

const trigger = rounded(0.32, 0.74, 0.62, 0.12, red, [-0.47, 0.05, 0], [0, 0, -0.34]);
addToDrill(trigger);

const directionSwitch = box(0.72, 0.18, 0.28, red, [-0.52, 0.63, 0.69]);
addToDrill(directionSwitch);

const battery = rounded(2.18, 0.92, 1.62, 0.2, black, [-0.78, -2.17, 0]);
addToDrill(battery);
const batteryYellow = rounded(1.78, 0.2, 1.44, 0.07, yellow, [-0.78, -1.74, 0]);
addToDrill(batteryYellow);
const batteryRelease = box(0.55, 0.11, 0.42, rubberEdge, [-0.78, -1.55, 0]);
addToDrill(batteryRelease);
for (let i = 0; i < 4; i++) {
  const batteryLine = box(0.08, 0.34, 1.42, rubberEdge, [-1.63 + i * 0.25, -2.17, 0]);
  addToDrill(batteryLine);
}

const collar = cylinder(0.91, 0.44, black, [1.82, 1.02, 0], [0, 0, Math.PI / 2]);
addToDrill(collar);
const chuck = cylinder(0.78, 1.18, darkSteel, [2.5, 1.02, 0], [0, 0, Math.PI / 2]);
addToDrill(chuck);
const chuckFront = cylinder(0.68, 0.2, steel, [3.15, 1.02, 0], [0, 0, Math.PI / 2]);
addToDrill(chuckFront);

for (let i = 0; i < 3; i++) {
  const angle = i * Math.PI * 2 / 3 + 0.3;
  const jaw = box(0.78, 0.18, 0.27, black, [3.28, 1.02 + Math.cos(angle) * 0.32, Math.sin(angle) * 0.32], [angle, 0, 0]);
  addToDrill(jaw);
}

const bit = cylinder(0.13, 1.35, steel, [3.95, 1.02, 0], [0, 0, Math.PI / 2], 20);
addToDrill(bit);
const bitTip = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.28, 20), steel);
bitTip.position.set(4.76, 1.02, 0);
bitTip.rotation.z = -Math.PI / 2;
bitTip.castShadow = true;
addToDrill(bitTip);

for (const z of [-0.735, 0.735]) {
  for (const x of [-1.05, 0.15, 1.0]) {
    const screw = cylinder(0.115, 0.035, steel, [x, 1.08, z], [Math.PI / 2, 0, 0], 24);
    addToDrill(screw);
    const slotA = box(0.13, 0.025, 0.035, black, [x, 1.08, z + (z > 0 ? 0.021 : -0.021)], [0, 0, 0.2]);
    addToDrill(slotA);
    const slotB = box(0.025, 0.13, 0.035, black, [x, 1.08, z + (z > 0 ? 0.022 : -0.022)], [0, 0, 0.2]);
    addToDrill(slotB);
  }
}

const led = new THREE.Mesh(new THREE.SphereGeometry(0.12, 20, 12), new THREE.MeshStandardMaterial({
  color: 0xbceaff, emissive: 0x56bfff, emissiveIntensity: 3, roughness: 0.2
}));
led.position.set(0.74, -0.05, 0.69);
led.castShadow = true;
drill.add(led);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0x1a2023, roughness: 0.82, metalness: 0.05 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -2.72;
floor.receiveShadow = true;
scene.add(floor);

const hemi = new THREE.HemisphereLight(0x9db4c5, 0x111315, 2.0);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe4bd, 4.5);
key.position.set(5, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -8;
scene.add(key);

const fill = new THREE.DirectionalLight(0x72a9d6, 1.8);
fill.position.set(-5, 3, -7);
scene.add(fill);

const rim = new THREE.PointLight(0xffb84c, 3.2, 8);
rim.position.set(2, 1, -4);
scene.add(rim);

drill.rotation.y = -0.25;

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
</body>
</html>
