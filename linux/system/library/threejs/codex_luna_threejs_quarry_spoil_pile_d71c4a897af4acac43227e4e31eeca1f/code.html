<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quarry Spoil Pile</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#b9c5c1}
canvas{display:block}
#label{position:fixed;top:18px;left:20px;color:#332b22;font:600 13px/1.4 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;background:rgba(238,231,214,.72);padding:10px 13px;border-left:3px solid #806c4d;backdrop-filter:blur(4px)}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">North · Quarry Spoil Yard</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9c5c1);
scene.fog = new THREE.Fog(0xb9c5c1, 95, 190);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 300);
camera.position.set(68, 58, 82);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;
controls.target.set(0,5,0);
controls.maxPolarAngle = Math.PI * .48;
controls.minDistance = 35;
controls.maxDistance = 150;

scene.add(new THREE.HemisphereLight(0xdce4e0,0x665443,2.1));
const sun = new THREE.DirectionalLight(0xffe6be,3.2);
sun.position.set(-55,95,42);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-90; sun.shadow.camera.right=90;
sun.shadow.camera.top=90; sun.shadow.camera.bottom=-90;
sun.shadow.camera.near=1; sun.shadow.camera.far=220;
sun.shadow.bias=-0.0005;
scene.add(sun);

function hash(x,z){
  const n = Math.sin(x*127.1+z*311.7)*43758.5453;
  return n-Math.floor(n);
}
function groundHeight(x,z){
  return 0.8*Math.sin(x*.095)*Math.cos(z*.11)+
         0.42*Math.sin(x*.31+z*.14)+
         0.22*Math.cos(z*.39-x*.17);
}

const terrainSize=150, seg=100;
const terrainPos=[], terrainNorm=[], terrainUV=[], terrainIdx=[];
for(let iz=0;iz<=seg;iz++){
  const z=-terrainSize/2+terrainSize*iz/seg;
  for(let ix=0;ix<=seg;ix++){
    const x=-terrainSize/2+terrainSize*ix/seg;
    terrainPos.push(x,groundHeight(x,z)-.35,z);
    terrainNorm.push(0,1,0);
    terrainUV.push(ix/seg*8,iz/seg*8);
  }
}
for(let iz=0;iz<seg;iz++)for(let ix=0;ix<seg;ix++){
  const a=iz*(seg+1)+ix,b=a+1,c=a+seg+1,d=c+1;
  terrainIdx.push(a,c,b,b,c,d);
}
const terrainGeo=new THREE.BufferGeometry();
terrainGeo.setAttribute("position",new THREE.Float32BufferAttribute(terrainPos,3));
terrainGeo.setAttribute("normal",new THREE.Float32BufferAttribute(terrainNorm,3));
terrainGeo.setAttribute("uv",new THREE.Float32BufferAttribute(terrainUV,2));
terrainGeo.setIndex(terrainIdx);
terrainGeo.computeVertexNormals();
const terrain=new THREE.Mesh(terrainGeo,new THREE.MeshStandardMaterial({
  color:0x81755d,roughness:1,metalness:0
}));
terrain.receiveShadow=true;
scene.add(terrain);

function ribbon(points,widths,material,yOffset){
  const verts=[], indices=[];
  for(let i=0;i<points.length;i++){
    const p=points[i], prev=points[Math.max(0,i-1)], next=points[Math.min(points.length-1,i+1)];
    const dx=next.x-prev.x,dz=next.z-prev.z, len=Math.hypot(dx,dz);
    const nx=-dz/len,nz=dx/len;
    const w=widths[i];
    const y=groundHeight(p.x,p.z)+yOffset;
    verts.push(p.x+nx*w,y,p.z+nz*w,p.x-nx*w,y+.025,p.z-nz*w);
  }
  for(let i=0;i<points.length-1;i++){
    const a=i*2,b=a+1,c=a+2,d=a+3;
    indices.push(a,c,b,b,c,d);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.Float32BufferAttribute(verts,3));
  g.setIndex(indices); g.computeVertexNormals();
  const m=new THREE.Mesh(g,material);
  m.receiveShadow=true; m.castShadow=true; scene.add(m); return m;
}
const roadPoints=[
  new THREE.Vector3(-57,-48,0),new THREE.Vector3(-42,-34,0),
  new THREE.Vector3(-27,-22,0),new THREE.Vector3(-24,-5,0),
  new THREE.Vector3(-22,14,0),new THREE.Vector3(-12,29,0),
  new THREE.Vector3(7,43,0),new THREE.Vector3(35,53,0)
];
const roadWidth=[6.8,6.2,5.8,5.6,5.4,5.2,5,4.8];
ribbon(roadPoints,roadWidth,new THREE.MeshStandardMaterial({color:0x9a8060,roughness:1}),.08);
ribbon(roadPoints,roadWidth.map(v=>v*.52),new THREE.MeshStandardMaterial({color:0xb29b76,roughness:1}),.13);

const pileCenter=new THREE.Vector3(9,0,0);
const rings=8, radial=56;
const pileVerts=[], pileIndices=[];
for(let j=0;j<=rings;j++){
  const t=j/rings;
  const y=groundHeight(pileCenter.x,pileCenter.z)+.15+17.5*t;
  for(let i=0;i<radial;i++){
    const a=i/radial*Math.PI*2;
    const irregular=1+.1*Math.sin(a*3.1)+.055*Math.sin(a*8.7+1.4);
    const taper=Math.pow(1-t,.72);
    const rx=20*irregular*taper;
    const rz=15.5*(1+.08*Math.cos(a*5))*taper;
    pileVerts.push(pileCenter.x+Math.cos(a)*rx,y,pileCenter.z+Math.sin(a)*rz);
  }
}
for(let j=0;j<rings;j++)for(let i=0;i<radial;i++){
  const a=j*radial+i,b=j*radial+(i+1)%radial,c=(j+1)*radial+i,d=(j+1)*radial+(i+1)%radial;
  pileIndices.push(a,c,b,b,c,d);
}
const apex=pileVerts.length/3;
pileVerts.push(pileCenter.x+.4,groundHeight(9,0)+18.1,pileCenter.z-.2);
for(let i=0;i<radial;i++)pileIndices.push(rings*radial+i,apex,rings*radial+(i+1)%radial);
const pileGeo=new THREE.BufferGeometry();
pileGeo.setAttribute("position",new THREE.Float32BufferAttribute(pileVerts,3));
pileGeo.setIndex(pileIndices); pileGeo.computeVertexNormals();
const pile=new THREE.Mesh(pileGeo,new THREE.MeshStandardMaterial({
  color:0x766450,roughness:.98,flatShading:true
}));
pile.castShadow=true; pile.receiveShadow=true; scene.add(pile);

let seed=17;
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
const rockGeo=new THREE.DodecahedronGeometry(1,0);
const rockMat=new THREE.MeshStandardMaterial({color:0x6b6254,roughness:.96,flatShading:true});
const rocks=new THREE.InstancedMesh(rockGeo,rockMat,420);
const dummy=new THREE.Object3D();
for(let i=0;i<420;i++){
  const a=rnd()*Math.PI*2;
  const r=4+Math.pow(rnd(),.72)*21;
  const zscale=15.5/20;
  const px=pileCenter.x+Math.cos(a)*r;
  const pz=pileCenter.z+Math.sin(a)*r*zscale;
  const edge=Math.max(0,1-r/21);
  const py=groundHeight(px,pz)+.3+edge*14.5*rnd();
  const s=.18+rnd()*.62;
  dummy.position.set(px,py,pz);
  dummy.rotation.set(rnd()*3,rnd()*3,rnd()*3);
  dummy.scale.set(s*(.75+rnd()*.5),s*(.7+rnd()*.65),s*(.75+rnd()*.45));
  dummy.updateMatrix();
  rocks.setMatrixAt(i,dummy.matrix);
}
rocks.castShadow=true; rocks.receiveShadow=true; scene.add(rocks);

const bermMat=new THREE.MeshStandardMaterial({color:0x655848,roughness:1,flatShading:true});
for(let i=0;i<34;i++){
  const t=i/33, p=roadPoints[Math.floor(t*(roadPoints.length-1))];
  const side=i%2?1:-1;
  const x=p.x+side*(roadWidth[Math.floor(t*(roadWidth.length-1))]+1.1);
  const z=p.z;
  const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.45+rnd()*.5,0),bermMat);
  rock.position.set(x,groundHeight(x,z)+.45,z);
  rock.scale.y=.65; rock.rotation.set(rnd(),rnd(),rnd());
  rock.castShadow=true; rock.receiveShadow=true; scene.add(rock);
}

const compass=new THREE.Group();
const northMat=new THREE.MeshBasicMaterial({color:0x493d2e});
const arrow=new THREE.Mesh(new THREE.ConeGeometry(.7,2.5,4),northMat);
arrow.position.set(-60,.4,55); arrow.rotation.x=0; compass.add(arrow);
const shaft=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,4,8),northMat);
shaft.position.set(-60,.35,57); shaft.rotation.x=Math.PI/2; compass.add(shaft);
scene.add(compass);

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  controls.update(clock.getDelta());
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
