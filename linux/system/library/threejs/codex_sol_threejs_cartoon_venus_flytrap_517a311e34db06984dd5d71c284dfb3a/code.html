<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartoon Venus Flytrap</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f4e7c8;
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4e7c8);
scene.fog = new THREE.Fog(0xf4e7c8, 15, 27);

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.8, 6.4, 12.5);
camera.lookAt(0, 3.5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.13;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.target.set(0, 3.25, 0);
controls.minDistance = 8;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI * 0.49;

const hemi = new THREE.HemisphereLight(0xfff6dd, 0x789c70, 2.15);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff0d6, 4.2);
key.position.set(-6, 10, 8);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 11;
key.shadow.camera.bottom = -4;
key.shadow.camera.near = 1;
key.shadow.camera.far = 25;
key.shadow.bias = -0.0004;
scene.add(key);

const rim = new THREE.DirectionalLight(0x9eeeff, 2.1);
rim.position.set(7, 6, -6);
scene.add(rim);

const warm = new THREE.PointLight(0xff9366, 1.5, 12);
warm.position.set(-4, 3, 5);
scene.add(warm);

const mat = {
  pot: new THREE.MeshPhysicalMaterial({
    color: 0xc85e35,
    roughness: 0.48,
    metalness: 0,
    clearcoat: 0.22,
    clearcoatRoughness: 0.45
  }),
  potDark: new THREE.MeshStandardMaterial({
    color: 0x74321f,
    roughness: 0.78
  }),
  soil: new THREE.MeshStandardMaterial({
    color: 0x392018,
    roughness: 1
  }),
  stem: new THREE.MeshPhysicalMaterial({
    color: 0x48b938,
    roughness: 0.36,
    clearcoat: 0.48,
    clearcoatRoughness: 0.25
  }),
  leaf: new THREE.MeshPhysicalMaterial({
    color: 0x67dc42,
    roughness: 0.31,
    clearcoat: 0.65,
    clearcoatRoughness: 0.2
  }),
  leafDark: new THREE.MeshStandardMaterial({
    color: 0x2f9b30,
    roughness: 0.45
  }),
  mouth: new THREE.MeshPhysicalMaterial({
    color: 0xd92d65,
    roughness: 0.32,
    clearcoat: 0.55,
    clearcoatRoughness: 0.22
  }),
  mouthDark: new THREE.MeshStandardMaterial({
    color: 0x7e123e,
    roughness: 0.7
  }),
  tooth: new THREE.MeshPhysicalMaterial({
    color: 0xfff8dc,
    roughness: 0.27,
    clearcoat: 0.35
  }),
  eye: new THREE.MeshPhysicalMaterial({
    color: 0xfffdf1,
    roughness: 0.2,
    clearcoat: 0.65
  }),
  pupil: new THREE.MeshPhysicalMaterial({
    color: 0x152315,
    roughness: 0.18,
    clearcoat: 0.7
  })
};

function shadowify(object) {
  object.traverse(child => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });
  return object;
}

const plant = new THREE.Group();
scene.add(plant);

function makePot() {
  const pot = new THREE.Group();

  const profile = [
    new THREE.Vector2(1.52, 0),
    new THREE.Vector2(1.42, 0.16),
    new THREE.Vector2(1.18, 2.08),
    new THREE.Vector2(1.23, 2.25),
    new THREE.Vector2(1.73, 2.3),
    new THREE.Vector2(1.78, 2.66),
    new THREE.Vector2(1.68, 2.82),
    new THREE.Vector2(1.13, 2.82)
  ];
  const body = new THREE.Mesh(
    new THREE.LatheGeometry(profile, 64),
    mat.pot
  );
  body.position.y = 0.12;
  pot.add(body);

  const innerRim = new THREE.Mesh(
    new THREE.CylinderGeometry(1.43, 1.43, 0.22, 64),
    mat.potDark
  );
  innerRim.position.y = 2.84;
  pot.add(innerRim);

  const soil = new THREE.Mesh(
    new THREE.CylinderGeometry(1.39, 1.39, 0.15, 64),
    mat.soil
  );
  soil.position.y = 2.98;
  pot.add(soil);

  const bottom = new THREE.Mesh(
    new THREE.CylinderGeometry(1.5, 1.54, 0.18, 64),
    mat.pot
  );
  bottom.position.y = 0.18;
  pot.add(bottom);

  const highlight = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.09, 1.25, 6, 12),
    new THREE.MeshBasicMaterial({
      color: 0xffa878,
      transparent: true,
      opacity: 0.45
    })
  );
  highlight.position.set(-0.82, 1.35, 1.04);
  highlight.rotation.z = -0.08;
  highlight.scale.set(0.7, 1, 0.25);
  pot.add(highlight);

  return shadowify(pot);
}

plant.add(makePot());

function tubeBetween(points, radius, material, segments = 48) {
  const curve = new THREE.CatmullRomCurve3(points);
  const mesh = new THREE.Mesh(
    new THREE.TubeGeometry(curve, segments, radius, 12, false),
    material
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function createLeaf(scale = 1) {
  const group = new THREE.Group();
  const leaf = new THREE.Mesh(
    new THREE.SphereGeometry(1, 32, 20),
    mat.leaf
  );
  leaf.scale.set(0.72 * scale, 0.11 * scale, 1.45 * scale);
  leaf.rotation.x = -0.1;
  group.add(leaf);

  const vein = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.035 * scale, 1.8 * scale, 5, 8),
    mat.leafDark
  );
  vein.rotation.x = Math.PI / 2;
  vein.position.y = 0.09 * scale;
  group.add(vein);
  return shadowify(group);
}

const baseLeaves = [
  { p: [-0.68, 3.12, 0.4], r: [0.18, -0.75, -0.55], s: 0.92 },
  { p: [0.65, 3.1, 0.25], r: [-0.18, 0.78, 0.48], s: 0.86 },
  { p: [-0.05, 3.12, -0.48], r: [0.02, 0.12, -0.12], s: 0.74 }
];

for (const spec of baseLeaves) {
  const leaf = createLeaf(spec.s);
  leaf.position.set(...spec.p);
  leaf.rotation.set(...spec.r);
  plant.add(leaf);
}

function makeTooth(size, upper) {
  const tooth = new THREE.Mesh(
    new THREE.ConeGeometry(size * 0.52, size, 12),
    mat.tooth
  );
  if (upper) tooth.rotation.z = Math.PI;
  tooth.castShadow = true;
  return tooth;
}

function createTrap(options = {}) {
  const {
    grin = true,
    eyeDirection = 0,
    scale = 1
  } = options;

  const trap = new THREE.Group();
  const opening = grin ? 0.43 : 0.2;
  const lobeY = grin ? 0.5 : 0.3;

  function lobe(upper) {
    const side = upper ? 1 : -1;
    const pivot = new THREE.Group();
    pivot.position.y = side * 0.04;

    const shell = new THREE.Mesh(
      new THREE.SphereGeometry(1, 40, 24),
      mat.leaf
    );
    shell.scale.set(1.42, 0.25, 0.82);
    shell.position.set(0, side * lobeY, -0.03);
    shell.rotation.x = side * opening;
    pivot.add(shell);

    const inner = new THREE.Mesh(
      new THREE.SphereGeometry(1, 36, 20),
      mat.mouth
    );
    inner.scale.set(1.19, 0.075, 0.63);
    inner.position.set(0, side * (lobeY - 0.19), 0.3);
    inner.rotation.x = side * opening;
    pivot.add(inner);

    const lip = tubeBetween([
      new THREE.Vector3(-1.15, side * (lobeY - 0.18), 0.48),
      new THREE.Vector3(-0.62, side * (lobeY - 0.12), 0.57),
      new THREE.Vector3(0, side * (lobeY - 0.09), 0.61),
      new THREE.Vector3(0.62, side * (lobeY - 0.12), 0.57),
      new THREE.Vector3(1.15, side * (lobeY - 0.18), 0.48)
    ], 0.075, mat.leafDark, 32);
    pivot.add(lip);

    const toothCount = grin ? 8 : 7;
    for (let i = 0; i < toothCount; i++) {
      const t = i / (toothCount - 1);
      const x = THREE.MathUtils.lerp(-1.04, 1.04, t);
      const arch = 1 - Math.pow(Math.abs(x) / 1.08, 2);
      const toothSize = (0.34 + arch * 0.14);
      const tooth = makeTooth(toothSize, upper);
      tooth.position.set(
        x,
        side * (lobeY - 0.25 - arch * 0.02),
        0.62 + arch * 0.05
      );
      tooth.rotation.x = side * (0.13 + Math.abs(x) * 0.07);
      tooth.rotation.z += side * x * 0.16;
      pivot.add(tooth);
    }

    return pivot;
  }

  trap.add(lobe(true));
  trap.add(lobe(false));

  const hinge = new THREE.Mesh(
    new THREE.SphereGeometry(0.34, 24, 16),
    mat.leafDark
  );
  hinge.scale.set(1, 1.15, 0.78);
  hinge.position.set(0, 0, -0.69);
  trap.add(hinge);

  if (grin) {
    const tongue = new THREE.Mesh(
      new THREE.SphereGeometry(1, 28, 18),
      mat.mouth
    );
    tongue.scale.set(0.66, 0.1, 0.42);
    tongue.position.set(0.2, -0.23, 0.62);
    tongue.rotation.x = -0.16;
    trap.add(tongue);

    const tongueTip = new THREE.Mesh(
      new THREE.SphereGeometry(0.16, 20, 12),
      mat.mouth
    );
    tongueTip.scale.set(1.45, 0.5, 1);
    tongueTip.position.set(0.62, -0.19, 0.82);
    trap.add(tongueTip);

    for (const x of [-0.52, 0.52]) {
      const eyeStalk = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.13, 0.25, 6, 12),
        mat.leaf
      );
      eyeStalk.position.set(x, 0.86, -0.08);
      eyeStalk.rotation.z = -x * 0.22;
      trap.add(eyeStalk);

      const eye = new THREE.Mesh(
        new THREE.SphereGeometry(0.25, 24, 18),
        mat.eye
      );
      eye.position.set(x, 1.04, 0.04);
      eye.scale.set(0.9, 1.05, 0.82);
      trap.add(eye);

      const pupil = new THREE.Mesh(
        new THREE.SphereGeometry(0.105, 20, 14),
        mat.pupil
      );
      pupil.position.set(x + eyeDirection * 0.035, 1.045, 0.235);
      pupil.scale.set(0.75, 1.12, 0.45);
      trap.add(pupil);

      const glint = new THREE.Mesh(
        new THREE.SphereGeometry(0.025, 10, 8),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      glint.position.set(
        x - 0.025 + eyeDirection * 0.035,
        1.095,
        0.326
      );
      trap.add(glint);
    }

    const cheekMaterial = new THREE.MeshBasicMaterial({
      color: 0xff7a8a,
      transparent: true,
      opacity: 0.45
    });
    for (const x of [-0.95, 0.95]) {
      const cheek = new THREE.Mesh(
        new THREE.SphereGeometry(0.13, 16, 10),
        cheekMaterial
      );
      cheek.scale.set(1.3, 0.45, 0.4);
      cheek.position.set(x, 0.38, 0.72);
      trap.add(cheek);
    }
  }

  trap.scale.setScalar(scale);
  return shadowify(trap);
}

function makeBranch(points, radius, trapSettings, headPosition, headRotation) {
  const branch = new THREE.Group();
  const stem = tubeBetween(points, radius, mat.stem, 56);
  branch.add(stem);

  const collar = new THREE.Mesh(
    new THREE.SphereGeometry(radius * 1.5, 20, 14),
    mat.leafDark
  );
  collar.position.copy(headPosition);
  branch.add(collar);

  const head = createTrap(trapSettings);
  head.position.copy(headPosition);
  head.rotation.set(...headRotation);
  branch.add(head);

  shadowify(branch);
  return { branch, head };
}

const mainBranch = makeBranch(
  [
    new THREE.Vector3(-0.25, 2.96, 0),
    new THREE.Vector3(-0.38, 3.85, 0.05),
    new THREE.Vector3(-0.05, 4.82, 0.08),
    new THREE.Vector3(-0.25, 5.72, 0.12),
    new THREE.Vector3(-0.05, 6.35, 0.08)
  ],
  0.17,
  { grin: true, eyeDirection: 0.55, scale: 1.02 },
  new THREE.Vector3(-0.05, 6.35, 0.08),
  [-0.08, -0.08, -0.04]
);
plant.add(mainBranch.branch);

const sideBranch = makeBranch(
  [
    new THREE.Vector3(0.32, 2.98, -0.05),
    new THREE.Vector3(0.45, 3.72, -0.08),
    new THREE.Vector3(1.05, 4.25, -0.1),
    new THREE.Vector3(1.48, 4.82, -0.05),
    new THREE.Vector3(1.77, 5.25, 0.02)
  ],
  0.145,
  { grin: false, scale: 0.78 },
  new THREE.Vector3(1.77, 5.25, 0.02),
  [0.03, -0.52, -0.22]
);
plant.add(sideBranch.branch);

const budStem = tubeBetween([
  new THREE.Vector3(-0.55, 3.0, -0.15),
  new THREE.Vector3(-0.95, 3.5, -0.35),
  new THREE.Vector3(-1.15, 4.05, -0.5)
], 0.1, mat.stem, 32);
plant.add(budStem);

const bud = new THREE.Mesh(
  new THREE.SphereGeometry(0.3, 24, 16),
  mat.leaf
);
bud.scale.set(0.8, 1.15, 0.72);
bud.position.set(-1.15, 4.12, -0.5);
bud.rotation.z = -0.35;
bud.castShadow = true;
plant.add(bud);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(11, 96),
  new THREE.MeshStandardMaterial({
    color: 0xdccda9,
    roughness: 0.92
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0.02;
ground.receiveShadow = true;
scene.add(ground);

const shadowBlob = new THREE.Mesh(
  new THREE.CircleGeometry(2.25, 64),
  new THREE.MeshBasicMaterial({
    color: 0x775d48,
    transparent: true,
    opacity: 0.13,
    depthWrite: false
  })
);
shadowBlob.rotation.x = -Math.PI / 2;
shadowBlob.position.y = 0.035;
shadowBlob.scale.set(1.25, 0.8, 1);
scene.add(shadowBlob);

plant.position.y = 0.02;
plant.rotation.y = -0.08;

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  mainBranch.branch.rotation.z = Math.sin(t * 1.55) * 0.018;
  mainBranch.branch.rotation.x = Math.sin(t * 1.12 + 1.2) * 0.012;
  sideBranch.branch.rotation.z = Math.sin(t * 1.7 + 2.4) * 0.025;
  sideBranch.branch.rotation.x = Math.sin(t * 1.25 + 0.4) * 0.014;

  mainBranch.head.rotation.z =
    -0.04 + Math.sin(t * 2.05) * 0.018;
  mainBranch.head.position.y =
    6.35 + Math.sin(t * 1.8) * 0.025;

  sideBranch.head.rotation.z =
    -0.22 + Math.sin(t * 1.65 + 1.5) * 0.024;

  plant.scale.y = 1 + Math.sin(t * 1.8) * 0.0035;
  plant.scale.x = 1 - Math.sin(t * 1.8) * 0.002;

  controls.update();
  renderer.render(scene, camera);
}

animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
