<html lang="en">
<head>

<title>Cryogenics Lab Interior</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0a121a}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ================================================================ config / palette
const LAB_W = 44, LAB_D = 44, LAB_H = 11;          // lab interior dimensions
const FOG_COLOR = 0x0a121a;
const PAL = {
  floor: '#5f6d79', grout: '#46515b', wall: '#6a7884',
  podGlow: 0xaee2ff, cryoCyan: 0x7fd4ff, amber: 0xffb03a,
  steel: 0x9fb0bc, steelDark: 0x39434d, shellWhite: 0xcfd9e0,
  tankFluid: 0x59e8c8, silhouette: 0x0b1118
};

// ================================================================ prng / helpers
function mulberry32(seed){ let a = seed >>> 0; return function(){
  a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rng = mulberry32(59034);
const rand = (a, b) => a + rng() * (b - a);
const pick = arr => arr[Math.floor(rng() * arr.length)];
function shadowify(root){ root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); return root; }

// ================================================================ canvas textures
function canvasTex(w, h, draw, repX, repY){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  if (repX){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repX, repY); }
  return t;
}
const floorTex = canvasTex(1024, 1024, (g, w, h) => {
  const px = 1024 / LAB_W, tile = 2 * px;                       // 2 m clinical tiles
  g.fillStyle = PAL.floor; g.fillRect(0, 0, w, h);
  for (let ty = 0; ty < 22; ty++) for (let tx = 0; tx < 22; tx++){
    g.fillStyle = `rgba(${rng() < 0.5 ? '20,26,32' : '196,210,220'},${rand(0.02, 0.07)})`;
    g.fillRect(tx * tile, ty * tile, tile, tile);
  }
  g.strokeStyle = PAL.grout; g.lineWidth = 3;
  for (let p = 0; p <= w; p += tile){ g.beginPath(); g.moveTo(p, 0); g.lineTo(p, h); g.moveTo(0, p); g.lineTo(w, p); g.stroke(); }
  g.strokeStyle = 'rgba(127,212,255,0.5)'; g.lineWidth = 5;      // console halo ring
  g.beginPath(); g.arc(512, 512, 3.4 * px, 0, 6.3); g.stroke();
  g.strokeStyle = 'rgba(127,212,255,0.28)'; g.setLineDash([20, 14]);
  for (const lx of [512 - 3.6 * px, 512 + 3.6 * px]){ g.beginPath(); g.moveTo(lx, 60); g.lineTo(lx, 964); g.stroke(); }
  g.setLineDash([]);
  for (let i = 0; i < 40; i++){                                  // faint scuffs
    g.strokeStyle = `rgba(24,30,36,${rand(0.05, 0.14)})`; g.lineWidth = rand(1, 3);
    const x = rand(0, w), y = rand(0, h); g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + rand(-60, 60), y + rand(-60, 60), x + rand(-120, 120), y + rand(-120, 120)); g.stroke();
  }
  const dx = 512 + 6 * px, dy = 512 + 7 * px;                    // floor drain grate
  g.fillStyle = '#2c343c'; g.beginPath(); g.arc(dx, dy, 20, 0, 6.3); g.fill();
  g.strokeStyle = '#141a20'; g.lineWidth = 3;
  for (let i = -12; i <= 12; i += 6){ g.beginPath(); g.moveTo(dx - 16, dy + i); g.lineTo(dx + 16, dy + i); g.stroke(); }
});
const wallTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = PAL.wall; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++){ g.fillStyle = `rgba(${rng() < 0.5 ? '30,38,46' : '210,224,232'},${rand(0.02, 0.06)})`;
    g.fillRect(rand(0, w), rand(0, h), rand(4, 40), rand(4, 26)); }
  g.strokeStyle = 'rgba(52,62,72,0.85)'; g.lineWidth = 4;        // panel seams
  for (let x = 0; x <= w; x += 128){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  g.fillStyle = 'rgba(40,50,60,0.55)'; g.fillRect(0, 0, w, 40); g.fillRect(0, h - 56, w, 56);
  g.fillStyle = 'rgba(127,212,255,0.16)'; g.fillRect(0, h - 66, w, 8); // cyan trim light line
}, 6, 1.4);
const mistTex = canvasTex(256, 256, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  for (let i = 0; i < 60; i++){
    const x = rand(0, w), y = rand(0, h), r = rand(20, 70);
    const gr = g.createRadialGradient(x, y, 1, x, y, r);
    gr.addColorStop(0, `rgba(200,228,244,${rand(0.1, 0.26)})`); gr.addColorStop(1, 'rgba(200,228,244,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.3); g.fill();
  }
}, 2, 2);
const stripTex = canvasTex(512, 128, (g, w, h) => {              // seamless scrolling ECG strip
  g.fillStyle = '#04121a'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(40,90,110,0.5)'; g.lineWidth = 1;
  for (let x = 0; x <= w; x += 32){ g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  for (let y = 0; y <= h; y += 32){ g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  g.strokeStyle = '#5fe8ff'; g.lineWidth = 3; g.shadowColor = '#5fe8ff'; g.shadowBlur = 6; g.beginPath();
  for (let c = 0; c < 4; c++){ const x0 = c * 128;               // 4 identical cycles -> wraps cleanly
    g.moveTo(x0, 72); g.lineTo(x0 + 22, 72); g.quadraticCurveTo(x0 + 30, 58, x0 + 38, 72);
    g.lineTo(x0 + 52, 72); g.lineTo(x0 + 58, 20); g.lineTo(x0 + 66, 108); g.lineTo(x0 + 72, 72);
    g.quadraticCurveTo(x0 + 92, 52, x0 + 104, 72); g.lineTo(x0 + 128, 72);
  }
  g.stroke(); g.shadowBlur = 0;
});
stripTex.wrapS = THREE.RepeatWrapping;
function infoDraw(title){ return (g, w, h) => {
  g.fillStyle = '#061620'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#0d2c3c'; g.fillRect(0, 0, w, 34);
  g.fillStyle = '#7fd4ff'; g.font = 'bold 22px monospace'; g.fillText(title, 10, 25);
  g.font = 'bold 44px monospace'; g.fillText(`${Math.round(rand(52, 64))}`, 16, 92); // pulse bpm
  g.fillStyle = '#59e8c8'; g.fillText(`${rand(-191, -186).toFixed(1)}`, 120, 92);    // core temp C
  g.font = '15px monospace'; g.fillStyle = '#4c98b8';
  g.fillText('BPM', 16, 112); g.fillText('CORE TEMP', 120, 112); g.fillText('O2 SAT 99%', 16, 140);
  for (let r = 0; r < 6; r++){ g.fillStyle = `rgba(95,232,255,${rand(0.35, 0.9)})`;
    g.fillRect(16 + r * 38, 168 - rand(6, 40), 26, 60); }
  g.strokeStyle = '#2c5c70'; g.strokeRect(6, 40, w - 12, 138);
  g.fillStyle = '#ffb03a'; g.fillRect(w - 60, 10, 44, 14);       // amber status chip
}; }
const infoTexA = canvasTex(256, 192, infoDraw('POD ARRAY // A'));
const infoTexB = canvasTex(256, 192, infoDraw('CRYO CORE 03'));
const frostTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = 'rgba(190,215,230,1)'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 90; i++){                                  // feathery frost veins
    g.strokeStyle = `rgba(255,255,255,${rand(0.2, 0.6)})`; g.lineWidth = rand(1, 2.5);
    let x = rand(0, w), y = rand(0, h); g.beginPath(); g.moveTo(x, y);
    for (let s = 0; s < 4; s++){ x += rand(-22, 22); y += rand(-22, 22); g.lineTo(x, y); }
    g.stroke();
  }
}, 3, 0.5);
const spriteTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(32, 32, 2, 32, 32, 30);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.4)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
})();

// ================================================================ materials
const MAT = {
  floor: new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.45, metalness: 0.15 }),
  wall: new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.8, metalness: 0.1 }),
  ceiling: new THREE.MeshStandardMaterial({ color: 0x2b343e, roughness: 0.9 }),
  steel: new THREE.MeshStandardMaterial({ color: PAL.steel, roughness: 0.4, metalness: 0.7 }),
  steelDark: new THREE.MeshStandardMaterial({ color: PAL.steelDark, roughness: 0.55, metalness: 0.6 }),
  shell: new THREE.MeshStandardMaterial({ color: PAL.shellWhite, roughness: 0.5, metalness: 0.25 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x141920, roughness: 0.95, metalness: 0.05 }),
  cableBlue: new THREE.MeshStandardMaterial({ color: 0x1e3a54, roughness: 0.85, metalness: 0.1 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xbfe4f5, transparent: true, opacity: 0.3, roughness: 0.7, metalness: 0, depthWrite: false, emissive: 0x9fd8ff, emissiveIntensity: 0.12 }),
  tankGlass: new THREE.MeshPhysicalMaterial({ color: 0xc8f0e4, transparent: true, opacity: 0.24, roughness: 0.25, metalness: 0, depthWrite: false }),
  fluid: new THREE.MeshStandardMaterial({ color: 0x0e3a34, emissive: PAL.tankFluid, emissiveIntensity: 0.55, transparent: true, opacity: 0.55 }),
  frost: new THREE.MeshStandardMaterial({ map: frostTex, color: 0xeef7ff, emissive: 0x9fc8e0, emissiveIntensity: 0.35, roughness: 0.9 }),
  crystal: new THREE.MeshStandardMaterial({ color: 0xe8f6ff, emissive: 0xbfe4ff, emissiveIntensity: 0.5, roughness: 0.3 }),
  silhouette: new THREE.MeshStandardMaterial({ color: PAL.silhouette, roughness: 0.95, metalness: 0 }),
  strip: new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffffff, emissiveMap: stripTex, emissiveIntensity: 1.3, roughness: 0.4 }),
  infoA: new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffffff, emissiveMap: infoTexA, emissiveIntensity: 1.1, roughness: 0.4 }),
  infoB: new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xffffff, emissiveMap: infoTexB, emissiveIntensity: 1.1, roughness: 0.4 }),
  podCore: new THREE.MeshStandardMaterial({ color: 0x0c2634, emissive: PAL.podGlow, emissiveIntensity: 1.6, side: THREE.BackSide }),
  panelLight: new THREE.MeshStandardMaterial({ color: 0x28323c, emissive: 0xcfe4f2, emissiveIntensity: 1.05 }),
  amber: new THREE.MeshStandardMaterial({ color: 0x33210a, emissive: PAL.amber, emissiveIntensity: 0.2 }),
  cyanTrim: new THREE.MeshStandardMaterial({ color: 0x06222e, emissive: PAL.cryoCyan, emissiveIntensity: 1.1 })
};

// ================================================================ renderer / scene / camera
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(FOG_COLOR);
scene.fog = new THREE.Fog(FOG_COLOR, 14, 52);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 140);
camera.position.set(11, 7.6, 15.5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.2, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.autoRotate = true; controls.autoRotateSpeed = 0.8;
controls.minDistance = 8; controls.maxDistance = 20;
controls.maxPolarAngle = 1.45;

// ================================================================ builder: lab shell
function buildLabShell(){
  const g = new THREE.Group();
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(LAB_W, LAB_D), MAT.floor);
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; g.add(floor);
  const wallGeo = new THREE.PlaneGeometry(LAB_W, LAB_H);
  for (const [x, z, ry] of [[0, -LAB_D / 2, 0], [0, LAB_D / 2, Math.PI], [-LAB_W / 2, 0, Math.PI / 2], [LAB_W / 2, 0, -Math.PI / 2]]){
    const wall = new THREE.Mesh(wallGeo, MAT.wall);
    wall.position.set(x, LAB_H / 2, z); wall.rotation.y = ry; wall.receiveShadow = true; g.add(wall);
  }
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(LAB_W, LAB_D), MAT.ceiling);
  ceil.rotation.x = Math.PI / 2; ceil.position.y = LAB_H; g.add(ceil);
  for (const px of [-11, 0, 11]) for (const pz of [-11, 0, 11]){  // recessed light panels
    const frame = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.16, 2.4), MAT.steelDark);
    frame.position.set(px, LAB_H - 0.1, pz); g.add(frame);
    const lit = new THREE.Mesh(new THREE.PlaneGeometry(4.8, 2.0), MAT.panelLight);
    lit.rotation.x = Math.PI / 2; lit.position.set(px, LAB_H - 0.19, pz); g.add(lit);
  }
  for (const sx of [-1, 1]) for (const z of [-14, 0, 14]){        // wall ribs
    const rib = new THREE.Mesh(new THREE.BoxGeometry(0.4, LAB_H, 0.7), MAT.steelDark);
    rib.position.set(sx * (LAB_W / 2 - 0.3), LAB_H / 2, z); g.add(rib);
  }
  for (const sx of [-1, 1]){                                      // coolant pipes along side walls
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 40, 10), MAT.steel);
    pipe.rotation.x = Math.PI / 2; pipe.position.set(sx * (LAB_W / 2 - 0.75), 7.6, 0); g.add(pipe);
    const pipe2 = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 40, 10), MAT.cableBlue);
    pipe2.rotation.x = Math.PI / 2; pipe2.position.set(sx * (LAB_W / 2 - 0.75), 7.1, 0); g.add(pipe2);
  }
  for (const [vx, vz, vr] of [[-15, -LAB_D / 2 + 0.35, 0], [15, LAB_D / 2 - 0.35, Math.PI]]){ // vent grilles
    const vent = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.3, 0.2), MAT.steelDark);
    vent.position.set(vx, 8.6, vz); vent.rotation.y = vr; g.add(vent);
    for (let s = 0; s < 5; s++){ const slat = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.12, 0.1), MAT.steel);
      slat.position.set(vx, 8.15 + s * 0.22, vz + (vr === 0 ? 0.12 : -0.12)); slat.rotation.y = vr; g.add(slat); }
  }
  return shadowify(g);
}

// ================================================================ builder: cryo pod (upright, occupied)
function buildSleeper(){
  const f = new THREE.Group();
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 10), MAT.silhouette); head.position.y = 1.62; f.add(head);
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.23, 0.55, 4, 10), MAT.silhouette); torso.position.y = 1.12; f.add(torso);
  for (const s of [-1, 1]){                                       // arms folded across the chest
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.4, 3, 8), MAT.silhouette);
    arm.position.set(s * 0.1, 1.2, 0.2); arm.rotation.z = s * 1.25; arm.rotation.x = -0.25; f.add(arm);
  }
  const legs = new THREE.Mesh(new THREE.CapsuleGeometry(0.17, 0.62, 4, 10), MAT.silhouette); legs.position.y = 0.48; f.add(legs);
  head.rotation.x = 0.18; return f;
}
const crystalGeo = new THREE.TetrahedronGeometry(0.055);
function buildCryoPod(coreMat){
  const g = new THREE.Group();
  const plinth = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 1.1, 0.5, 18), MAT.shell);
  plinth.position.y = 0.25; g.add(plinth);
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.95, 0.22, 18), MAT.steelDark);
  collar.position.y = 0.6; g.add(collar);
  const core = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 2.45, 14, 1, true), coreMat);
  core.position.y = 1.95; g.add(core);                            // glowing back shell (BackSide)
  const sleeper = buildSleeper(); sleeper.position.y = 0.62; sleeper.scale.setScalar(1.18); g.add(sleeper);
  const glass = new THREE.Mesh(new THREE.CapsuleGeometry(0.66, 1.75, 6, 16), MAT.glass);
  glass.position.y = 1.95; g.add(glass);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.55, 0.42, 16), MAT.shell);
  cap.position.y = 3.4; g.add(cap);
  const beaconTip = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), MAT.amber);
  beaconTip.position.y = 3.66; g.add(beaconTip);
  for (const s of [-1, 1]){                                       // frame struts + cyan light strips
    const strut = new THREE.Mesh(new THREE.BoxGeometry(0.16, 2.9, 0.24), MAT.steel);
    strut.position.set(s * 0.72, 1.95, -0.08); g.add(strut);
    const stripLight = new THREE.Mesh(new THREE.BoxGeometry(0.05, 2.5, 0.05), MAT.cyanTrim);
    stripLight.position.set(s * 0.7, 1.95, 0.08); g.add(stripLight);
  }
  for (const [ry, rr] of [[0.72, 0.78], [3.2, 0.6]]){             // frosted rims
    const rim = new THREE.Mesh(new THREE.TorusGeometry(rr, 0.07, 8, 22), MAT.frost);
    rim.rotation.x = Math.PI / 2; rim.position.y = ry; g.add(rim);
  }
  const crystals = new THREE.InstancedMesh(crystalGeo, MAT.crystal, 26); // creeping frost crystals
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  for (let i = 0; i < 26; i++){
    const onTop = i % 2 === 0, rr = onTop ? 0.6 : 0.78, ry = onTop ? 3.2 : 0.72;
    const a = rand(0, Math.PI * 2), s = rand(0.6, 1.7);
    e.set(rand(0, 3.1), rand(0, 3.1), rand(0, 3.1)); q.setFromEuler(e);
    m4.compose(new THREE.Vector3(Math.cos(a) * rr, ry + rand(-0.05, 0.12), Math.sin(a) * rr), q, new THREE.Vector3(s, s * rand(1, 2.2), s));
    crystals.setMatrixAt(i, m4);
  }
  g.add(crystals);
  const panel = new THREE.Mesh(new THREE.BoxGeometry(0.66, 0.42, 0.08), MAT.steelDark);
  panel.position.set(0, 0.32, 1.0); panel.rotation.x = -0.35; g.add(panel);
  const panelScr = new THREE.Mesh(new THREE.PlaneGeometry(0.56, 0.3), MAT.strip);
  panelScr.position.set(0, 0.34, 1.05); panelScr.rotation.x = -0.35; g.add(panelScr);
  for (const s of [-1, 1]){                                       // coolant hoses into the deck
    const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(s * 0.4, 0.55, -0.85),
      new THREE.Vector3(s * 0.7, 0.25, -1.25), new THREE.Vector3(s * 0.95, 0.06, -1.7)]);
    g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.06, 7), MAT.rubber));
  }
  shadowify(g); glass.castShadow = false; return g;
}

// ================================================================ builder: monitoring console
function buildConsole(){
  const g = new THREE.Group();
  const dais = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.8, 0.24, 24), MAT.shell); dais.position.y = 0.12; g.add(dais);
  const trim = new THREE.Mesh(new THREE.TorusGeometry(2.62, 0.05, 8, 40), MAT.cyanTrim);
  trim.rotation.x = Math.PI / 2; trim.position.y = 0.26; g.add(trim);
  const column = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.7, 2.5, 12), MAT.steelDark); column.position.y = 1.5; g.add(column);
  const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.55, 0.5, 12), MAT.shell); crown.position.y = 2.9; g.add(crown);
  const halo = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.05, 8, 24), MAT.cyanTrim);
  halo.rotation.x = Math.PI / 2; halo.position.y = 3.2; g.add(halo);
  for (let i = 0; i < 4; i++){                                    // four angled vitals stations
    const a = i * Math.PI / 2 + Math.PI / 4, st = new THREE.Group();
    const desk = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.5, 0.7), MAT.shell); desk.position.y = 0.95; st.add(desk);
    const scrF = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.95, 0.1), MAT.steelDark);
    scrF.position.set(0, 1.75, -0.12); scrF.rotation.x = -0.3; st.add(scrF);
    const info = new THREE.Mesh(new THREE.PlaneGeometry(1.26, 0.6), i % 2 ? MAT.infoA : MAT.infoB);
    info.position.set(0, 1.88, -0.045); info.rotation.x = -0.3; st.add(info);
    const strip = new THREE.Mesh(new THREE.PlaneGeometry(1.26, 0.24), MAT.strip);
    strip.position.set(0, 1.47, 0.083); strip.rotation.x = -0.3; st.add(strip);
    st.position.set(Math.cos(a) * 1.85, 0.12, Math.sin(a) * 1.85);
    st.rotation.y = -a - Math.PI / 2; g.add(st);
  }
  return shadowify(g);
}

// ================================================================ builder: specimen tank rig
function buildTankRig(){
  const g = new THREE.Group();
  const bench = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.55, 1.7), MAT.shell); bench.position.y = 0.28; g.add(bench);
  const back = new THREE.Mesh(new THREE.BoxGeometry(5.6, 2.9, 0.25), MAT.steelDark); back.position.set(0, 1.45, -0.8); g.add(back);
  const bubbleSystems = [];
  for (let i = 0; i < 3; i++){
    const x = -1.8 + i * 1.8;
    const glass = new THREE.Mesh(new THREE.CylinderGeometry(0.52, 0.52, 2.0, 16, 1, true), MAT.tankGlass);
    glass.position.set(x, 1.72, 0); g.add(glass);

function updateVapor(t){
  for (let i = 0; i < vaporN; i++){
    const top = podTops[Math.floor(i / VAPOR_PER_POD)];
    const age = (t * vaporSpd[i] + vaporPh[i]) % 1, j = i * 3, r = 0.55 + age * 0.75;
    vaporPos[j] = top.x + Math.cos(vaporAng[i] + t * 0.25) * r;
    vaporPos[j + 1] = top.y - age * 2.9;
    vaporPos[j + 2] = top.z + Math.sin(vaporAng[i] + t * 0.25) * r;
  }
  vaporGeo.attributes.position.needsUpdate = true;
}

const rowLightR = new THREE.PointLight(PAL.podGlow, 140, 20, 1.9); rowLightR.position.set(7.4, 3.4, 0); scene.add(rowLightR);
const consoleLight = new THREE.PointLight(PAL.cryoCyan, 70, 12, 1.9); consoleLight.position.set(0, 3.4, 0); scene.add(consoleLight);
const tankLight = new THREE.PointLight(PAL.tankFluid, 45, 10, 1.9); tankLight.position.set(10.2, 2.6, -11.4); scene.add(tankLight);
const amberLight = new THREE.PointLight(PAL.amber, 0, 24, 1.8); amberLight.position.set(0, 8.2, -LAB_D / 2 + 1.2); scene.add(amberLight);

// ================================================================ animation loop
const clock = new THREE.Clock();
function updateBubbles(t){
  for (const s of tankRig.bubbleSystems){
    for (let i = 0; i < s.n; i++){
      const age = (t * s.spd[i] + s.ph[i]) % 1, j = i * 3;
      s.pos[j] = s.cx + Math.cos(s.ang[i] + age * 2.4) * s.rad[i] * (1 - age * 0.35);
      s.pos[j + 1] = s.cy + age * s.h;
      s.pos[j + 2] = Math.sin(s.ang[i] + age * 2.4) * s.rad[i] * (1 - age * 0.35);
    }
    s.geo.attributes.position.needsUpdate = true;
  }
}
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  stripTex.offset.x = (t * 0.22) % 1;                              // vitals traces scroll
  for (const p of podPulses) p.mat.emissiveIntensity = 2.2 + Math.sin(t * 0.85 + p.ph) * 0.55; // pods breathe
  const blink = Math.pow(Math.max(0, Math.sin(t * 2.7)), 6);       // amber warning cadence
  for (const b of beacons) b.mat.emissiveIntensity = 0.25 + Math.pow(Math.max(0, Math.sin(t * 2.7 + b.ph)), 6) * 4.2;
  amberLight.intensity = blink * 240;
  for (const m of mistLayers){                                     // mist swirl + slow breathing
    m.mesh.rotation.z += m.spin * dt * 60 * 0.016;
    m.mesh.material.opacity = 0.3 + 0.08 * Math.sin(t * 0.4 + m.ph);
  }
  holo.g.rotation.y = t * 0.55;                                    // console hologram spin
  holo.icosa.rotation.x = t * 0.8; holo.rings[0].rotation.x = 0.4 + Math.sin(t * 0.5) * 0.25;
  holo.rings[1].rotation.z = Math.sin(t * 0.35) * 0.3;
  gantry.head.position.z = Math.sin(t * 0.11) * 9.5;               // scanner tracking the aisle
  gantry.lensMat.emissiveIntensity = 1.0 + Math.pow(Math.max(0, Math.sin(t * 1.7)), 4) * 1.6;
  updateVapor(t);
  updateBubbles(t);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ================================================================ resize
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
