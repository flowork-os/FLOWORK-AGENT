<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedural Farm Tractor</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #b9d1d9; }
canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb8d0d7);
scene.fog = new THREE.Fog(0xb8d0d7, 18, 36);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(6.4, 4.1, 6.8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.target.set(0, 0.95, 0);

const colors = {
  red: 0x9b271d,
  redDark: 0x641914,
  orange: 0xc65320,
  yellow: 0xd49b28,
  tire: 0x171817,
  rubber: 0x262826,
  metal: 0x687074,
  metalDark: 0x3f4749,
  cream: 0xd8c596,
  glass: 0x273c3a,
  ground: 0x8a9d62
};

const mats = {
  red: new THREE.MeshStandardMaterial({ color: colors.red, roughness: 0.36, metalness: 0.05 }),
  redDark: new THREE.MeshStandardMaterial({ color: colors.redDark, roughness: 0.45 }),
  orange: new THREE.MeshStandardMaterial({ color: colors.orange, roughness: 0.34 }),
  yellow: new THREE.MeshStandardMaterial({ color: colors.yellow, roughness: 0.3, metalness: 0.2 }),
  tire: new THREE.MeshStandardMaterial({ color: colors.tire, roughness: 0.92 }),
  rubber: new THREE.MeshStandardMaterial({ color: colors.rubber, roughness: 0.86 }),
  metal: new THREE.MeshStandardMaterial({ color: colors.metal, roughness: 0.42, metalness: 0.65 }),
  metalDark: new THREE.MeshStandardMaterial({ color: colors.metalDark, roughness: 0.5, metalness: 0.7 }),
  cream: new THREE.MeshStandardMaterial({ color: colors.cream, roughness: 0.72 }),
  glass: new THREE.MeshStandardMaterial({ color: colors.glass, roughness: 0.22, metalness: 0.15 }),
  ground: new THREE.MeshStandardMaterial({ color: colors.ground, roughness: 1 })
};

function add(mesh, parent = scene) {
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function box(name, size, position, material, bevel = 0.04, parent = scene) {
  const geometry = new THREE.BoxGeometry(...size);
  let mesh;
  if (bevel > 0) {
    geometry.translate(0, 0, 0);
    mesh = new THREE.Mesh(geometry, material);
  } else {
    mesh = new THREE.Mesh(geometry, material);
  }
  mesh.name = name;
  mesh.position.set(...position);
  return add(mesh, parent);
}

function cylinder(name, radius, height, position, material, segments = 32, rotation = [0, 0, 0], parent = scene) {
  const geometry = new THREE.CylinderGeometry(radius, radius, height, segments);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.set(...position);
  mesh.rotation.set(...rotation);
  return add(mesh, parent);
}

function torus(name, major, tube, position, material, rotation = [0, 0, 0], parent = scene) {
  const geometry = new THREE.TorusGeometry(major, tube, 18, 48);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.set(...position);
  mesh.rotation.set(...rotation);
  return add(mesh, parent);
}

const tractor = new THREE.Group();
scene.add(tractor);

box('lower chassis', [3.45, 0.28, 1.2], [-0.05, 0.48, 0], mats.redDark, 0, tractor);
box('rear platform', [1.45, 0.22, 1.45], [-0.78, 1.04, 0], mats.red, 0, tractor);
box('front frame', [1.1, 0.25, 0.92], [1.18, 0.61, 0], mats.metalDark, 0, tractor);

box('engine hood', [1.62, 0.82, 0.95], [0.78, 1.18, 0], mats.red, 0, tractor);
box('hood top', [1.46, 0.12, 0.86], [0.78, 1.64, 0], mats.orange, 0, tractor);
box('hood nose', [0.28, 0.72, 0.9], [1.58, 1.22, 0], mats.red, 0, tractor);

for (let i = 0; i < 5; i++) {
  box('engine ventilation slot', [0.045, 0.38, 0.018], [0.46 + i * 0.18, 1.22, 0.487], mats.redDark, 0, tractor);
  box('engine ventilation slot', [0.045, 0.38, 0.018], [0.46 + i * 0.18, 1.22, -0.487], mats.redDark, 0, tractor);
}

box('front grille', [0.035, 0.46, 0.68], [1.73, 1.2, 0], mats.metalDark, 0, tractor);
for (let i = -2; i <= 2; i++) {
  box('grille bar', [0.045, 0.05, 0.7], [1.70, 1.04 + i * 0.09, 0], mats.metal, 0, tractor);
}

for (const z of [-0.47, 0.47]) {
  cylinder('headlight', 0.13, 0.06, [1.76, 1.48, z], mats.cream, 24, [0, Math.PI / 2, 0], tractor);
  cylinder('headlight rim', 0.145, 0.025, [1.80, 1.48, z], mats.metalDark, 24, [0, Math.PI / 2, 0], tractor);
}

const rearX = -1.18;
const rearY = 0.92;
const frontX = 1.32;
const frontY = 0.62;

for (const z of [-0.86, 0.86]) {
  torus('large rear tire', 0.64, 0.23, [rearX, rearY, z], mats.tire, [Math.PI / 2, 0, 0], tractor);
  cylinder('rear wheel hub', 0.25, 0.18, [rearX, rearY, z], mats.yellow, 32, [Math.PI / 2, 0, 0], tractor);
  cylinder('rear axle cap', 0.11, 0.205, [rearX, rearY, z + (z > 0 ? 0.02 : -0.02)], mats.metalDark, 24, [Math.PI / 2, 0, 0], tractor);
  for (let a = 0; a < 8; a++) {
    const ang = a * Math.PI / 4;
    cylinder('hub bolt', 0.035, 0.22, [
      rearX + Math.cos(ang) * 0.16,
      rearY + Math.sin(ang) * 0.16,
      z
    ], mats.metalDark, 12, [Math.PI / 2, 0, 0], tractor);
  }

  torus('small front tire', 0.37, 0.14, [frontX, frontY, z * 0.9], mats.tire, [Math.PI / 2, 0, 0], tractor);
  cylinder('front wheel hub', 0.13, 0.16, [frontX, frontY, z * 0.9], mats.yellow, 28, [Math.PI / 2, 0, 0], tractor);
}

box('rear axle housing', [0.42, 0.26, 1.86], [rearX, 0.72, 0], mats.metalDark, 0, tractor);
box('front axle', [1.0, 0.16, 1.95], [frontX, 0.52, 0], mats.metalDark, 0, tractor);
cylinder('steering knuckle left', 0.12, 0.3, [frontX, 0.55, -0.78], mats.metal, 20, [Math.PI / 2, 0, 0], tractor);
cylinder('steering knuckle right', 0.12, 0.3, [frontX, 0.55, 0.78], mats.metal, 20, [Math.PI / 2, 0, 0], tractor);

function fender(z) {
  const shape = new THREE.Shape();
  const cx = rearX;
  const cy = rearY;
  const outer = 0.91;
  const inner = 0.72;
  const steps = 20;
  for (let i = 0; i <= steps; i++) {
    const a = Math.PI - (Math.PI * i / steps);
    const x = cx + Math.cos(a) * outer;
    const y = cy + Math.sin(a) * outer;
    if (i === 0) shape.moveTo(x, y);
    else shape.lineTo(x, y);
  }
  for (let i = 0; i <= steps; i++) {
    const a = Math.PI * i / steps;
    shape.lineTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner);
  }
  shape.closePath();
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: 0.16,
    bevelEnabled: true,
    bevelSegments: 2,
    bevelSize: 0.025,
    bevelThickness: 0.025
  });
  const mesh = new THREE.Mesh(geometry, mats.orange);
  mesh.position.z = z - 0.08;
  mesh.name = 'curved rear fender';
  return add(mesh, tractor);
}
fender(-1.02);
fender(0.86);

box('seat support', [0.18, 0.62, 0.22], [-0.48, 1.47, 0], mats.metalDark, 0, tractor);
box('seat cushion', [0.72, 0.18, 0.72], [-0.52, 1.84, 0], mats.cream, 0, tractor);
box('seat back', [0.16, 0.58, 0.7], [-0.83, 2.05, 0], mats.cream, 0, tractor);
box('seat back shell', [0.12, 0.64, 0.76], [-0.91, 2.05, 0], mats.redDark, 0, tractor);

cylinder('steering column', 0.075, 0.72, [0.05, 1.72, 0], mats.metalDark, 20, [0, 0, -0.23], tractor);
torus('steering wheel', 0.29, 0.045, [0.18, 2.05, 0], mats.rubber, [0, Math.PI / 2, 0], tractor);
cylinder('steering center', 0.1, 0.1, [0.18, 2.05, 0], mats.metal, 24, [0, Math.PI / 2, 0], tractor);
for (let i = 0; i < 3; i++) {
  const angle = i * Math.PI * 2 / 3;
  const spoke = box('steering spoke', [0.25, 0.025, 0.035], [
    0.18,
    2.05 + Math.sin(angle) * 0.12,
    Math.cos(angle) * 0.12
  ], mats.metalDark, 0, tractor);
  spoke.rotation.x = -angle;
}

cylinder('exhaust pipe', 0.09, 1.24, [0.92, 2.23, 0.28], mats.metalDark, 24, [0, 0, 0], tractor);
cylinder('exhaust cap', 0.13, 0.12, [0.92, 2.86, 0.28], mats.metal, 24, [0, 0, 0], tractor);
box('exhaust heat shield', [0.05, 0.65, 0.25], [0.78, 2.18, 0.28], mats.metal, 0, tractor);

box('front ballast mount', [0.25, 0.5, 0.72], [2.05, 0.82, 0], mats.metalDark, 0, tractor);
box('ballast weight', [0.42, 0.78, 1.18], [2.31, 0.75, 0], mats.metal, 0, tractor);
box('ballast upper step', [0.3, 0.22, 1.0], [2.15, 1.25, 0], mats.metalDark, 0, tractor);
for (let z of [-0.42, 0, 0.42]) {
  cylinder('ballast rib', 0.09, 0.74, [2.54, 0.76, z], mats.metalDark, 20, [0, Math.PI / 2, 0], tractor);
}

box('rear hitch beam', [0.45, 0.18, 0.18], [-2.0, 0.62, 0], mats.metalDark, 0, tractor);
for (const z of [-0.28, 0.28]) {
  cylinder('hitch pin', 0.06, 0.22, [-2.18, 0.55, z], mats.metal, 18, [Math.PI / 2, 0, 0], tractor);
}

const ground = new THREE.Mesh(new THREE.CircleGeometry(18, 64), mats.ground);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

const platform = new THREE.Mesh(
  new THREE.CylinderGeometry(4.3, 4.3, 0.08, 64),
  new THREE.MeshStandardMaterial({ color: 0x718250, roughness: 1 })
);
platform.position.y = -0.035;
platform.receiveShadow = true;
scene.add(platform);

const sun = new THREE.DirectionalLight(0xfff1d1, 4.2);
sun.position.set(-5, 9, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -7;
sun.shadow.camera.right = 7;
sun.shadow.camera.top = 7;
sun.shadow.camera.bottom = -5;
sun.shadow.bias = -0.00025;
scene.add(sun);

const fill = new THREE.HemisphereLight(0xd8efff, 0x586243, 1.8);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffb27a, 1.25);
rim.position.set(5, 4, -6);
scene.add(rim);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  tractor.position.y = Math.sin(t * 1.2) * 0.008;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
