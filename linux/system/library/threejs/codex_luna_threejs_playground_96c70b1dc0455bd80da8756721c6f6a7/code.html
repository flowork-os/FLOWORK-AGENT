<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Playground</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #9ed9f2;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ed9f2);
scene.fog = new THREE.Fog(0x9ed9f2, 28, 55);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(14, 11, 17);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.target.set(0, 1.8, 0);
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 10;
controls.maxDistance = 32;

const hemi = new THREE.HemisphereLight(0xeaf8ff, 0x71583e, 2.2);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff4db, 3.4);
sun.position.set(-10, 18, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -22;
sun.shadow.camera.right = 22;
sun.shadow.camera.top = 22;
sun.shadow.camera.bottom = -18;
sun.shadow.bias = -0.0004;
scene.add(sun);

const mats = {
  mulch: new THREE.MeshStandardMaterial({ color: 0x8b5a38, roughness: 1 }),
  curb: new THREE.MeshStandardMaterial({ color: 0xd8d0bd, roughness: 0.9 }),
  wood: new THREE.MeshStandardMaterial({ color: 0x4e9a52, roughness: 0.72 }),
  woodLight: new THREE.MeshStandardMaterial({ color: 0x78bb57, roughness: 0.68 }),
  red: new THREE.MeshStandardMaterial({ color: 0xe64032, roughness: 0.55 }),
  yellow: new THREE.MeshStandardMaterial({ color: 0xffcf38, roughness: 0.5 }),
  blue: new THREE.MeshStandardMaterial({ color: 0x2d73c9, roughness: 0.48 }),
  teal: new THREE.MeshStandardMaterial({ color: 0x18a7a0, roughness: 0.5 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x697987, metalness: 0.72, roughness: 0.28 }),
  darkMetal: new THREE.MeshStandardMaterial({ color: 0x334552, metalness: 0.8, roughness: 0.25 }),
  black: new THREE.MeshStandardMaterial({ color: 0x20252a, roughness: 0.6 }),
  sand: new THREE.MeshStandardMaterial({ color: 0xe7c477, roughness: 1 })
};

function box(name, size, position, material, bevel = 0) {
  const geometry = new THREE.BoxGeometry(size[0], size[1], size[2]);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function cylinder(name, radius, height, position, material, radialSegments = 16) {
  const geometry = new THREE.CylinderGeometry(radius, radius, height, radialSegments);
  const mesh = new THREE.Mesh(geometry, material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function beamBetween(name, a, b, radius, material, segments = 16) {
  const start = new THREE.Vector3(a[0], a[1], a[2]);
  const end = new THREE.Vector3(b[0], b[1], b[2]);
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, length, segments),
    material
  );
  mesh.name = name;
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

function sphere(name, radius, position, material) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 20, 12), material);
  mesh.name = name;
  mesh.position.set(position[0], position[1], position[2]);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  return mesh;
}

box("mulch foundation", [18, 0.42, 11.5], [0, -0.28, 0], mats.mulch);
box("sand play patch", [7.2, 0.08, 4.5], [-3.1, -0.04, 2.9], mats.sand);

box("front curb", [19, 0.5, 0.45], [0, 0.05, -5.65], mats.curb);
box("back curb", [19, 0.5, 0.45], [0, 0.05, 5.65], mats.curb);
box("left curb", [0.45, 0.5, 10.8], [-9.3, 0.05, 0], mats.curb);
box("right curb", [0.45, 0.5, 10.8], [9.3, 0.05, 0], mats.curb);

const towerX = -4.0;
const towerZ = 1.35;
const postPositions = [
  [towerX - 1.25, 1.7, towerZ - 1.05],
  [towerX + 1.25, 1.7, towerZ - 1.05],
  [towerX - 1.25, 1.7, towerZ + 1.05],
  [towerX + 1.25, 1.7, towerZ + 1.05]
];

postPositions.forEach((p, i) => box("tower post " + i, [0.28, 3.4, 0.28], p, mats.wood));

box("tower platform", [3.1, 0.32, 2.7], [towerX, 3.38, towerZ], mats.yellow);

const roof = new THREE.Mesh(
  new THREE.ConeGeometry(2.25, 1.55, 4),
  mats.red
);
roof.name = "play tower roof";
roof.position.set(towerX, 5.65, towerZ);
roof.rotation.y = Math.PI / 4;
roof.castShadow = true;
roof.receiveShadow = true;
scene.add(roof);

for (const z of [towerZ - 1.25, towerZ + 1.25]) {
  beamBetween("tower safety rail", [towerX - 1.25, 3.62, z], [towerX + 1.25, 3.62, z], 0.075, mats.blue);
}
for (const x of [towerX - 1.25, towerX + 1.25]) {
  beamBetween("tower corner rail", [x, 3.62, towerZ - 1.25], [x, 3.62, towerZ + 1.25], 0.075, mats.blue);
}
box("tower front rail", [2.6, 0.12, 0.12], [towerX, 4.18, towerZ - 1.25], mats.blue);

const ladderX = towerX + 1.42;
const ladderZ = towerZ - 1.03;
beamBetween("ladder left rail", [ladderX - 0.42, 0.15, ladderZ], [ladderX - 0.42, 3.36, ladderZ], 0.095, mats.blue);
beamBetween("ladder right rail", [ladderX + 0.42, 0.15, ladderZ], [ladderX + 0.42, 3.36, ladderZ], 0.095, mats.blue);
for (let i = 0; i < 6; i++) {
  const y = 0.55 + i * 0.5;
  beamBetween("ladder rung", [ladderX - 0.42, y, ladderZ], [ladderX + 0.42, y, ladderZ], 0.07, mats.yellow);
}

const slideCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(towerX - 0.1, 3.2, towerZ - 1.45),
  new THREE.Vector3(towerX - 0.15, 2.8, towerZ - 2.2),
  new THREE.Vector3(towerX + 0.35, 1.8, towerZ - 3.6),
  new THREE.Vector3(towerX + 1.55, 0.56, towerZ - 4.65),
  new THREE.Vector3(towerX + 3.1, 0.4, towerZ - 4.9)
]);
const slidePoints = slideCurve.getPoints(28);
const slideVertices = [];
const slideIndices = [];
const slideWidth = 0.72;

for (let i = 0; i < slidePoints.length; i++) {
  const point = slidePoints[i];
  const before = slidePoints[Math.max(0, i - 1)];
  const after = slidePoints[Math.min(slidePoints.length - 1, i + 1)];
  const tangent = new THREE.Vector3().subVectors(after, before).normalize();
  const side = new THREE.Vector3(-tangent.y, tangent.x, 0).normalize();
  const left = point.clone().addScaledVector(side, slideWidth);
  const right = point.clone().addScaledVector(side, -slideWidth);
  const bottom = point.clone().add(new THREE.Vector3(0, -0.32, 0));
  slideVertices.push(left.x, left.y + 0.08, left.z);
  slideVertices.push(bottom.x, bottom.y, bottom.z);
  slideVertices.push(right.x, right.y + 0.08, right.z);
}
for (let i = 0; i < slidePoints.length - 1; i++) {
  const a = i * 3;
  const b = (i + 1) * 3;
  slideIndices.push(a, b, a + 1, a + 1, b, b + 1);
  slideIndices.push(a + 1, b + 1, a + 2, a + 2, b + 1, b + 2);
}
const slideGeometry = new THREE.BufferGeometry();
slideGeometry.setAttribute("position", new THREE.Float32BufferAttribute(slideVertices, 3));
slideGeometry.setIndex(slideIndices);
slideGeometry.computeVertexNormals();
const slide = new THREE.Mesh(slideGeometry, mats.red);
slide.name = "curved slide chute";
slide.castShadow = true;
slide.receiveShadow = true;
scene.add(slide);

const leftRailPoints = [];
const rightRailPoints = [];
for (let i = 0; i < slidePoints.length; i++) {
  const point = slidePoints[i];
  const before = slidePoints[Math.max(0, i - 1)];
  const after = slidePoints[Math.min(slidePoints.length - 1, i + 1)];
  const tangent = new THREE.Vector3().subVectors(after, before).normalize();
  const side = new THREE.Vector3(-tangent.y, tangent.x, 0).normalize();
  leftRailPoints.push(point.clone().addScaledVector(side, slideWidth + 0.08).add(new THREE.Vector3(0, 0.18, 0)));
  rightRailPoints.push(point.clone().addScaledVector(side, -slideWidth - 0.08).add(new THREE.Vector3(0, 0.18, 0)));
}
for (const railPoints of [leftRailPoints, rightRailPoints]) {
  const railCurve = new THREE.CatmullRomCurve3(railPoints);
  const rail = new THREE.Mesh(
    new THREE.TubeGeometry(railCurve, 32, 0.075, 10, false),
    mats.yellow
  );
  rail.castShadow = true;
  rail.receiveShadow = true;
  scene.add(rail);
}

const swingLeft = 3.2;
const swingRight = 7.4;
const swingFrontZ = 0.6;
const swingBackZ = 2.7;
const topY = 5.15;

beamBetween("swing top beam", [swingLeft, topY, 1.65], [swingRight, topY, 1.65], 0.15, mats.blue);
beamBetween("swing left front leg", [swingLeft, 0.25, swingFrontZ], [swingLeft, topY, 1.65], 0.13, mats.blue);
beamBetween("swing left back leg", [swingLeft, 0.25, swingBackZ], [swingLeft, topY, 1.65], 0.13, mats.blue);
beamBetween("swing right front leg", [swingRight, 0.25, swingFrontZ], [swingRight, topY, 1.65], 0.13, mats.blue);
beamBetween("swing right back leg", [swingRight, 0.25, swingBackZ], [swingRight, topY, 1.65], 0.13, mats.blue);

for (const x of [4.55, 6.1]) {
  const chainY = 2.2;
  beamBetween("swing chain front", [x - 0.31, topY - 0.05, 1.65], [x - 0.31, chainY, 1.65], 0.035, mats.darkMetal, 10);
  beamBetween("swing chain back", [x + 0.31, topY - 0.05, 1.65], [x + 0.31, chainY, 1.65], 0.035, mats.darkMetal, 10);
  box("swing seat", [0.86, 0.16, 0.42], [x, chainY - 0.08, 1.65], mats.black);
}

for (const x of [swingLeft, swingRight]) {
  cylinder("swing foot", 0.24, 0.08, [x, 0.18, swingFrontZ], mats.darkMetal);
  cylinder("swing foot", 0.24, 0.08, [x, 0.18, swingBackZ], mats.darkMetal);
}

for (const x of [-7.7, -5.6, -3.5, -1.4, 1.2, 3.2, 5.3, 7.3]) {
  const tuft = new THREE.Group();
  tuft.position.set(x, 0.16, -5.35);
  const blade = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.35, 5), mats.woodLight);
  blade.position.y = 0.16;
  blade.castShadow = true;
  tuft.add(blade);
  scene.add(tuft);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

animate();
</script>
</body>
</html>
