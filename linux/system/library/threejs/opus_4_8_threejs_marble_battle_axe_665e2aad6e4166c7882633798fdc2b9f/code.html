<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marble Ceremonial Battle Axe</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17181b; }
  #app { position: fixed; inset: 0; }
  #caption {
    position: fixed; left: 0; right: 0; bottom: 14px;
    text-align: center; pointer-events: none;
    font-family: Georgia, 'Times New Roman', serif;
    letter-spacing: 0.18em; font-size: 12px; text-transform: uppercase;
    color: rgba(220, 222, 228, 0.42);
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="caption">Ceremonial Double-Bladed Battle Axe · Polished Grey Marble</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------------------
   Renderer
--------------------------------------------------------------------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

/* ---------------------------------------------------------------------------
   Scene & Camera
--------------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17181b);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.6, 1.9, 7.6);

// Soft procedural studio environment for polished-marble reflections
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.045).texture;

/* ---------------------------------------------------------------------------
   Procedural marble texture (canvas-generated, no external assets)
--------------------------------------------------------------------------- */
function hash(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = h ^ (h >>> 16);
  return (h >>> 0) / 4294967295;
}
function smoothNoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi);
  const c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
}
function fbm(x, y) {
  let t = 0, amp = 0.5, freq = 1;
  for (let o = 0; o < 6; o++) { t += amp * smoothNoise(x * freq, y * freq); freq *= 2; amp *= 0.5; }
  return t;
}
function makeMarbleTexture(seed) {
  const size = 512;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  const data = img.data;
  const off = seed * 13.37;

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const nx = x / size, ny = y / size;
      const turb = fbm(nx * 3.0 + off, ny * 3.0 + off);
      // primary marble veining
      const pattern = Math.sin((nx * 6.5 + ny * 1.6 + turb * 3.6) * Math.PI * 2.0);
      let g = 0.63 + 0.11 * pattern;
      const vein = Math.pow(Math.max(0, 1 - Math.abs(pattern)), 6);
      g -= 0.30 * vein;
      // fine secondary ripples
      const turb2 = fbm(nx * 9 + 21 + off, ny * 9 + 21 + off);
      g += 0.05 * (turb2 - 0.5);
      g = Math.min(1, Math.max(0.16, g));

      const i = (y * size + x) * 4;
      data[i]     = Math.round(g * 0.975 * 255); // cool grey tint
      data[i + 1] = Math.round(g * 0.995 * 255);
      data[i + 2] = Math.round(Math.min(1, g * 1.03) * 255);
      data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

/* ---------------------------------------------------------------------------
   Marble materials
--------------------------------------------------------------------------- */
const bladeTex = makeMarbleTexture(1);
bladeTex.repeat.set(1, 1);

const marbleMat = new THREE.MeshPhysicalMaterial({
  map: bladeTex,
  bumpMap: bladeTex,
  bumpScale: 0.015,
  color: 0xffffff,
  roughness: 0.30,
  metalness: 0.0,
  clearcoat: 0.7,
  clearcoatRoughness: 0.22,
  envMapIntensity: 1.15,
  side: THREE.DoubleSide
});

const haftTex = makeMarbleTexture(2);
haftTex.repeat.set(2, 6);
const haftMat = marbleMat.clone();
haftMat.map = haftTex;
haftMat.bumpMap = haftTex;

/* ---------------------------------------------------------------------------
   Build the axe (one composed object)
--------------------------------------------------------------------------- */
const axe = new THREE.Group();

function addMesh(geo, mat) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  m.receiveShadow = true;
  axe.add(m);
  return m;
}

// --- Haft (tapered pole) ---
const haftGeo = new THREE.CylinderGeometry(0.115, 0.145, 4.9, 56, 1);
haftGeo.translate(0, -0.15, 0); // spans y = -2.60 .. 2.30
addMesh(haftGeo, haftMat);

// --- Intertwined knotwork rope bands (two helices = celtic rope relief) ---
function ropeBand(yA, yB, turns, radius, tubeR) {
  for (const phase of [0, Math.PI]) {
    const seg = Math.max(28, turns * 22);
    const pts = [];
    for (let i = 0; i <= seg; i++) {
      const t = i / seg;
      const a = phase + t * turns * Math.PI * 2;
      const y = yA + t * (yB - yA);
      pts.push(new THREE.Vector3(Math.cos(a) * radius, y, Math.sin(a) * radius));
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    addMesh(new THREE.TubeGeometry(curve, seg, tubeR, 10, false), haftMat);
  }
}

// --- Carved collar rings ---
function collar(y, r) {
  const t = new THREE.TorusGeometry(r, 0.032, 16, 48);
  t.rotateX(Math.PI / 2);
  t.translate(0, y, 0);
  addMesh(t, haftMat);
}

ropeBand(-2.00, -1.20, 3, 0.155, 0.030);
collar(-2.04, 0.16); collar(-1.16, 0.16);

ropeBand(0.10, 0.92, 3, 0.150, 0.030);
collar(0.06, 0.155); collar(0.96, 0.155);

collar(1.30, 0.20);

// --- Pommel (rounded base cap) ---
const pommel = new THREE.SphereGeometry(0.19, 40, 28);
pommel.scale(1, 0.85, 1);
pommel.translate(0, -2.58, 0);
addMesh(pommel, haftMat);
collar(-2.42, 0.145);

/* ---------- Head assembly (centred at yHead) ---------- */
const yHead = 1.85;

// Eye / hub the haft passes through, from which blades spring
const hub = new THREE.CylinderGeometry(0.30, 0.30, 1.0, 40, 1);
hub.translate(0, yHead, 0);
addMesh(hub, marbleMat);
collar(yHead + 0.48, 0.285);
collar(yHead - 0.48, 0.285);

// Crescent blade profile (broad, honed cutting edge on the outer arc)
function makeBladeShape() {
  const s = new THREE.Shape();
  s.moveTo(0.22, 0.34);
  s.bezierCurveTo(0.72, 0.72, 1.18, 0.86, 1.58, 0.60);   // sweep up to top horn
  s.bezierCurveTo(1.92, 0.30, 1.92, -0.30, 1.58, -0.60); // convex cutting edge
  s.bezierCurveTo(1.18, -0.86, 0.72, -0.72, 0.22, -0.34); // sweep to bottom horn
  s.bezierCurveTo(0.05, -0.14, 0.05, 0.14, 0.22, 0.34);   // concave inner neck
  return s;
}
const extrudeSettings = {
  depth: 0.13,
  bevelEnabled: true,
  bevelThickness: 0.05,
  bevelSize: 0.10,
  bevelSegments: 5,
  steps: 1,
  curveSegments: 48
};
const bladeGeo = new THREE.ExtrudeGeometry(makeBladeShape(), extrudeSettings);
bladeGeo.translate(0, 0, -0.065); // centre thickness on z
bladeGeo.computeVertexNormals();

// Right blade
const bladeR = new THREE.Mesh(bladeGeo, marbleMat);
bladeR.position.set(0, yHead, 0);
bladeR.castShadow = true; bladeR.receiveShadow = true;
axe.add(bladeR);

// Left blade (mirrored)
const bladeL = new THREE.Mesh(bladeGeo, marbleMat);
bladeL.position.set(0, yHead, 0);
bladeL.scale.x = -1;
bladeL.castShadow = true; bladeL.receiveShadow = true;
axe.add(bladeL);

// Knotwork relief medallions on the hub faces
const medGeo = new THREE.TorusKnotGeometry(0.13, 0.032, 90, 10, 2, 3);
for (const z of [0.29, -0.29]) {
  const med = new THREE.Mesh(medGeo, marbleMat);
  med.position.set(0, yHead, z);
  med.scale.set(1, 1, 0.35);
  med.castShadow = true; med.receiveShadow = true;
  axe.add(med);
}

// Top finial spike
const spike = new THREE.ConeGeometry(0.115, 0.62, 32);
spike.translate(0, yHead + 0.50 + 0.31, 0);
addMesh(spike, marbleMat);
collar(yHead + 0.50, 0.13);

/* ---------------------------------------------------------------------------
   Centre the composed object at the origin
--------------------------------------------------------------------------- */
const box = new THREE.Box3().setFromObject(axe);
const center = box.getCenter(new THREE.Vector3());
axe.position.set(-center.x, -center.y, -center.z);
scene.add(axe);
const groundY = box.min.y - center.y - 0.01;

/* ---------------------------------------------------------------------------
   Ground plane (only receives shadows)
--------------------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = groundY;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------------
   Lighting: hemisphere fill + directional key + fill + rim
--------------------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0xbfc6d6, 0x2a2b30, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e6, 2.4);
key.position.set(5, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 30;
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 7;
key.shadow.camera.bottom = -7;
key.shadow.bias = -0.0004;
key.shadow.radius = 5;
scene.add(key);

const fill = new THREE.DirectionalLight(0x9fb4d4, 0.7);
fill.position.set(-6, 3, 4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xdfe6ff, 1.3);
rim.position.set(-3, 5, -7);
scene.add(rim);

/* ---------------------------------------------------------------------------
   Controls
--------------------------------------------------------------------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 4;
controls.maxDistance = 16;
controls.target.set(0, 0, 0);
controls.update();

/* ---------------------------------------------------------------------------
   Resize + render loop
--------------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
