<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1950s Retro Diner</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08121a}
canvas{display:block}
#label{position:fixed;left:18px;bottom:16px;color:#fff8e8;font:12px/1.5 Georgia,serif;letter-spacing:.18em;text-transform:uppercase;opacity:.7;pointer-events:none;text-shadow:0 1px 8px #000}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="label">Starlite Diner · Open All Night</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08141d);
scene.fog = new THREE.FogExp2(0x101922, 0.018);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 180);
camera.position.set(19, 13, 24);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 3.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;
controls.minDistance = 12;
controls.maxDistance = 48;
controls.maxPolarAngle = Math.PI * 0.48;

let seed = 1955;
function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a, b) { return a + (b - a) * rand(); }

const MAT = {
  red: new THREE.MeshStandardMaterial({ color: 0xa80d22, roughness: 0.32 }),
  redDark: new THREE.MeshStandardMaterial({ color: 0x4f0712, roughness: 0.5 }),
  cream: new THREE.MeshStandardMaterial({ color: 0xffe5b0, roughness: 0.45 }),
  white: new THREE.MeshStandardMaterial({ color: 0xf4ead7, roughness: 0.38 }),
  black: new THREE.MeshStandardMaterial({ color: 0x101317, roughness: 0.58 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xe9f3f5, metalness: 0.95, roughness: 0.13 }),
  steel: new THREE.MeshStandardMaterial({ color: 0x87949b, metalness: 0.82, roughness: 0.26 }),
  teal: new THREE.MeshStandardMaterial({ color: 0x087d80, roughness: 0.32 }),
  wood: new THREE.MeshStandardMaterial({ color: 0x63351f, roughness: 0.65 }),
  glass: new THREE.MeshPhysicalMaterial({
    color: 0xe8fbff,
    transmission: 0.72,
    transparent: true,
    opacity: 0.3,
    roughness: 0.08,
    metalness: 0,
    thickness: 0.08,
    side: THREE.DoubleSide
  }),
  pinkGlow: new THREE.MeshStandardMaterial({
    color: 0xff479e,
    emissive: 0xff0a78,
    emissiveIntensity: 5,
    roughness: 0.3
  }),
  cyanGlow: new THREE.MeshStandardMaterial({
    color: 0x65ffff,
    emissive: 0x00d9ff,
    emissiveIntensity: 5,
    roughness: 0.25
  }),
  warmGlow: new THREE.MeshStandardMaterial({
    color: 0xffd56a,
    emissive: 0xff8a16,
    emissiveIntensity: 3
  })
};

function mesh(geometry, material, parent = scene, cast = true, receive = true) {
  const m = new THREE.Mesh(geometry, material);
  m.castShadow = cast;
  m.receiveShadow = receive;
  parent.add(m);
  return m;
}
function box(w, h, d, material, x, y, z, parent = scene) {
  const m = mesh(new THREE.BoxGeometry(w, h, d), material, parent);
  m.position.set(x, y, z);
  return m;
}
function cyl(rt, rb, h, seg, material, x, y, z, parent = scene) {
  const m = mesh(new THREE.CylinderGeometry(rt, rb, h, seg), material, parent);
  m.position.set(x, y, z);
  return m;
}
function sphere(r, material, x, y, z, parent = scene, sy = 1) {
  const m = mesh(new THREE.SphereGeometry(r, 24, 16), material, parent);
  m.position.set(x, y, z);
  m.scale.y = sy;
  return m;
}
function torus(R, r, material, x, y, z, parent = scene) {
  const m = mesh(new THREE.TorusGeometry(R, r, 12, 48), material, parent);
  m.position.set(x, y, z);
  return m;
}
function tube(points, radius, material, parent = scene) {
  const curve = new THREE.CatmullRomCurve3(points);
  return mesh(new THREE.TubeGeometry(curve, 48, radius, 8, false), material, parent, false, false);
}
function canvasTexture(draw, size = 512) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  draw(ctx, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

const floorTexture = canvasTexture((ctx, s) => {
  const n = 8;
  const d = s / n;
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      ctx.fillStyle = (x + y) % 2 ? '#17191b' : '#eee5d1';
      ctx.fillRect(x * d, y * d, d, d);
    }
  }
  ctx.strokeStyle = 'rgba(255,255,255,.1)';
  ctx.lineWidth = 2;
  for (let i = 0; i <= n; i++) {
    ctx.beginPath();
    ctx.moveTo(i * d, 0);
    ctx.lineTo(i * d, s);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i * d);
    ctx.lineTo(s, i * d);
    ctx.stroke();
  }
}, 512);
floorTexture.wrapS = floorTexture.wrapT = THREE.RepeatWrapping;
floorTexture.repeat.set(5, 4);
const floorMat = new THREE.MeshStandardMaterial({
  map: floorTexture,
  roughness: 0.48,
  metalness: 0.08
});
box(32, 0.25, 24, floorMat, 0, -0.15, 0);

const wallMat = new THREE.MeshStandardMaterial({
  color: 0xd9c9a8,
  roughness: 0.78
});
box(32, 10, 0.35, wallMat, 0, 5, -12);
box(0.35, 10, 24, wallMat, -16, 5, 0);
box(32, 0.28, 24, MAT.cream, 0, 10, 0);

box(32, 0.16, 0.18, MAT.teal, 0, 3.15, -11.78);
box(32, 0.16, 0.18, MAT.red, 0, 3.5, -11.76);
box(0.18, 10, 0.18, MAT.chrome, -15.72, 5, -11.72);

for (let x = -13; x <= 13; x += 4) {
  box(0.08, 0.07, 24, MAT.chrome, x, 9.82, 0);
}
for (let z = -10; z <= 10; z += 4) {
  box(32, 0.07, 0.08, MAT.chrome, 0, 9.81, z);
}

function windowPanel(x, z, rotY = 0) {
  const g = new THREE.Group();
  g.position.set(x, 4.9, z);
  g.rotation.y = rotY;
  scene.add(g);
  box(7.2, 5.8, 0.14, MAT.black, 0, 0, 0, g);
  box(6.65, 5.25, 0.08, MAT.glass, 0, 0, -0.12, g);
  box(0.12, 5.45, 0.22, MAT.chrome, 0, 0, -0.25, g);
  box(6.9, 0.12, 0.22, MAT.chrome, 0, 0, -0.25, g);
  return g;
}
windowPanel(8.2, -11.55);
windowPanel(-15.55, 5.2, Math.PI / 2);

function makeBooth(x, z, rot = 0) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = rot;
  scene.add(g);

  const seat = box(4.5, 0.65, 1.45, MAT.red, 0, 1.05, 0, g);
  seat.geometry.translate(0, 0, 0);
  box(4.6, 0.14, 1.55, MAT.chrome, 0, 0.71, 0, g);
  box(4.55, 2.45, 0.55, MAT.red, 0, 2.05, 0.54, g);
  box(4.68, 0.1, 0.65, MAT.chrome, 0, 3.28, 0.54, g);

  for (let i = -1; i <= 1; i++) {
    box(0.055, 2.15, 0.575, MAT.redDark, i * 1.12, 2.05, 0.51, g);
  }
  for (const sx of [-1.8, 1.8]) {
    cyl(0.075, 0.075, 0.65, 12, MAT.chrome, sx, 0.35, 0, g);
  }
  return g;
}

function makeTable(x, z, rot = 0) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = rot;
  scene.add(g);

  box(4.1, 0.18, 1.8, MAT.white, 0, 2.2, 0, g);
  box(4.24, 0.1, 1.94, MAT.chrome, 0, 2.08, 0, g);
  cyl(0.16, 0.16, 2, 16, MAT.chrome, 0, 1.05, 0, g);
  cyl(0.75, 0.9, 0.12, 24, MAT.chrome, 0, 0.08, 0, g);
  return g;
}

for (const z of [-8.8, -3.3, 2.2, 7.7]) {
  makeBooth(-13.4, z, Math.PI / 2);
  makeTable(-10.9, z, Math.PI / 2);
}

function makeCounter() {
  const g = new THREE.Group();
  g.position.set(4.1, 0, -4.2);
  scene.add(g);

  box(14.5, 3.25, 2.3, MAT.teal, 0, 1.62, 0, g);
  box(14.65, 0.48, 2.55, MAT.white, 0, 3.3, 0, g);
  box(14.8, 0.13, 2.67, MAT.chrome, 0, 3.06, 0, g);
  box(14.45, 0.65, 0.11, MAT.chrome, 0, 1.5, 1.18, g);

  for (let x = -6.6; x <= 6.6; x += 1.3) {
    box(0.06, 3, 0.08, MAT.chrome, x, 1.52, 1.19, g);
  }

  for (let x = -6; x <= 6; x += 2.35) makeStool(x + 4.1, -0.9);
  return g;
}

function makeStool(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  scene.add(g);

  cyl(0.68, 0.68, 0.24, 28, MAT.red, 0, 2.1, 0, g);
  torus(0.68, 0.07, MAT.chrome, 0, 2.1, 0, g).rotation.x = Math.PI / 2;
  cyl(0.1, 0.12, 1.9, 14, MAT.chrome, 0, 1.05, 0, g);
  torus(0.55, 0.055, MAT.chrome, 0, 0.7, 0, g).rotation.x = Math.PI / 2;
  const feet = cyl(0.72, 0.8, 0.09, 24, MAT.chrome, 0, 0.07, 0, g);
  feet.scale.z = 0.7;
  return g;
}
makeCounter();

function makeBurger(x, y, z) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  scene.add(g);

  cyl(1.15, 1.15, 0.09, 32, MAT.white, 0, 0, 0, g);
  cyl(0.7, 0.72, 0.22, 24,
    new THREE.MeshStandardMaterial({ color: 0xd18b35, roughness: 0.75 }),
    0, 0.22, 0, g);
  cyl(0.68, 0.68, 0.16, 24,
    new THREE.MeshStandardMaterial({ color: 0x522012, roughness: 0.8 }),
    0, 0.4, 0, g);
  cyl(0.71, 0.71, 0.06, 24,
    new THREE.MeshStandardMaterial({ color: 0xf7cb22, roughness: 0.6 }),
    0, 0.52, 0, g);
  cyl(0.66, 0.69, 0.12, 24,
    new THREE.MeshStandardMaterial({ color: 0x3c8d2b, roughness: 0.8 }),
    0, 0.61, 0, g);
  const bun = sphere(0.72,
    new THREE.MeshStandardMaterial({ color: 0xd99943, roughness: 0.72 }),
    0, 0.77, 0, g, 0.48);
  bun.position.y = 0.76;

  for (let i = 0; i < 13; i++) {
    const a = rand() * Math.PI * 2;
    const r = range(0.08, 0.52);
    const sesame = sphere(0.035, MAT.cream,
      Math.cos(a) * r, 1.07 + range(-0.01, 0.035), Math.sin(a) * r, g, 0.45);
    sesame.rotation.y = a;
  }
}
makeBurger(2.8, 3.65, -4);

function makeMilkshake(x, y, z) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  scene.add(g);

  const shakeMat = new THREE.MeshStandardMaterial({
    color: 0xffb6cf,
    roughness: 0.45,
    transparent: true,
    opacity: 0.9
  });
  cyl(0.34, 0.26, 1.15, 24, shakeMat, 0, 0.62, 0, g);
  cyl(0.39, 0.39, 0.07, 24, MAT.chrome, 0, 0.05, 0, g);
  cyl(0.07, 0.07, 0.35, 12, MAT.chrome, 0, 0.2, 0, g);
  sphere(0.33, MAT.white, 0, 1.25, 0, g, 0.62);
  sphere(0.11,
    new THREE.MeshStandardMaterial({ color: 0xd81432, roughness: 0.4 }),
    0.05, 1.52, 0, g);
  const straw = cyl(0.025, 0.025, 1.45, 10, MAT.cyanGlow, 0.15, 1.25, 0, g);
  straw.rotation.z = -0.18;
}
makeMilkshake(0.8, 3.58, -4);

function makeCondiments(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 3.65, z);
  scene.add(g);

  for (const [dx, color] of [[-0.22, 0xb71922], [0.22, 0xe0b522]]) {
    const m = new THREE.MeshStandardMaterial({ color, roughness: 0.5 });
    cyl(0.11, 0.16, 0.52, 16, m, dx, 0.27, 0, g);
    cyl(0.045, 0.07, 0.18, 12, m, dx, 0.62, 0, g);
  }
  box(0.62, 0.08, 0.28, MAT.chrome, 0, 0.04, 0, g);
}
makeCondiments(6.6, -4);

function makeJukebox() {
  const g = new THREE.Group();
  g.position.set(11.8, 0, 6.3);
  g.rotation.y = -0.42;
  scene.add(g);

  const bodyShape = new THREE.Shape();
  bodyShape.moveTo(-1.45, 0);
  bodyShape.lineTo(1.45, 0);
  bodyShape.lineTo(1.45, 2.4);
  bodyShape.bezierCurveTo(1.45, 4.5, 0.95, 5.5, 0, 5.65);
  bodyShape.bezierCurveTo(-0.95, 5.5, -1.45, 4.5, -1.45, 2.4);
  bodyShape.closePath();

  const body = mesh(new THREE.ExtrudeGeometry(bodyShape, {
    depth: 0.75,
    bevelEnabled: true,
    bevelSize: 0.12,
    bevelThickness: 0.12,
    bevelSegments: 4
  }), MAT.wood, g);
  body.position.z = -0.38;

  const archPts = [
    new THREE.Vector3(-1.13, 1.1, 0.48),
    new THREE.Vector3(-1.15, 4.0, 0.48),
    new THREE.Vector3(-0.78, 5.05, 0.48),
    new THREE.Vector3(0, 5.35, 0.48),
    new THREE.Vector3(0.78, 5.05, 0.48),
    new THREE.Vector3(1.15, 4.0, 0.48),
    new THREE.Vector3(1.13, 1.1, 0.48)
  ];
  tube(archPts, 0.13, MAT.pinkGlow, g);
  tube(archPts.map(p => p.clone().multiplyScalar(0.82)
    .add(new THREE.Vector3(0, 0.55, 0.03))), 0.075, MAT.cyanGlow, g);

  box(1.75, 1.55, 0.09, MAT.glass, 0, 3.65, 0.49, g);
  box(1.72, 0.85, 0.12, MAT.black, 0, 1.05, 0.5, g);

  for (let y = 0.77; y <= 1.32; y += 0.28) {
    for (let x = -0.62; x <= 0.62; x += 0.31) {
      box(0.2, 0.08, 0.05, MAT.cream, x, y, 0.58, g);
    }
  }

  const record = cyl(0.56, 0.56, 0.07, 32, MAT.black, 0, 3.7, 0.54, g);
  record.rotation.x = Math.PI / 2;
  const hub = cyl(0.08, 0.08, 0.09, 20, MAT.red, 0, 3.7, 0.59, g);
  hub.rotation.x = Math.PI / 2;
  g.userData.record = record;

  const light = new THREE.PointLight(0xff2d91, 12, 11, 2);
  light.position.set(0, 3.4, 1.3);
  g.add(light);
  return g;
}
const jukebox = makeJukebox();

function neonWordTexture() {
  return canvasTexture((ctx, s) => {
    ctx.clearRect(0, 0, s, s);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'italic bold 112px cursive';
    ctx.shadowBlur = 30;
    ctx.shadowColor = '#ff137e';
    ctx.strokeStyle = '#ff338f';
    ctx.lineWidth = 9;
    ctx.strokeText('DINER', s / 2, s * 0.42);
    ctx.shadowColor = '#0ff';
    ctx.fillStyle = '#baffff';
    ctx.font = 'bold 38px sans-serif';
    ctx.fillText('OPEN 24 HOURS', s / 2, s * 0.62);
  });
}
const signMat = new THREE.MeshBasicMaterial({
  map: neonWordTexture(),
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending
});
const neonSign = mesh(new THREE.PlaneGeometry(6.4, 4.0), signMat, scene, false, false);
neonSign.position.set(8.2, 5.05, -11.25);

const pinkWindowLight = new THREE.RectAreaLight(0xff1683, 13, 6, 4);
pinkWindowLight.position.set(8.2, 4.8, -10.7);
pinkWindowLight.lookAt(3, 2, 0);
scene.add(pinkWindowLight);

const cyanWindowLight = new THREE.RectAreaLight(0x00d9ff, 9, 5, 4);
cyanWindowLight.position.set(-15, 4, 5.2);
cyanWindowLight.lookAt(-7, 2, 4);
scene.add(cyanWindowLight);

function makePieCase() {
  const g = new THREE.Group();
  g.position.set(8.8, 3.62, -4.2);
  scene.add(g);

  box(3.3, 0.12, 1.4, MAT.chrome, 0, 0, 0, g);
  box(3.3, 1.9, 0.08, MAT.glass, 0, 0.98, 0.68, g);
  box(0.08, 1.9, 1.4, MAT.glass, -1.62, 0.98, 0, g);
  box(0.08, 1.9, 1.4, MAT.glass, 1.62, 0.98, 0, g);
  box(3.3, 0.1, 1.4, MAT.chrome, 0, 1.95, 0, g);
  box(3.15, 0.07, 1.3, MAT.chrome, 0, 0.92, 0, g);

  for (const [px, py, color] of [
    [-0.75, 0.43, 0xb92b30],
    [0.75, 0.43, 0xd38425],
    [-0.65, 1.35, 0x793425],
    [0.7, 1.35, 0xe0b04e]
  ]) {
    const pm = new THREE.MeshStandardMaterial({ color, roughness: 0.65 });
    cyl(0.5, 0.55, 0.2, 28, pm, px, py, 0, g);
    const slice = new THREE.Mesh(
      new THREE.CylinderGeometry(0.48, 0.5, 0.24, 28, 1, false, 0, Math.PI * 1.75),
      pm
    );
    slice.position.set(px, py + 0.12, 0);
    slice.castShadow = true;
    g.add(slice);
  }
}
makePieCase();

function makeFan(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 9.25, z);
  scene.add(g);

  cyl(0.08, 0.08, 0.75, 12, MAT.chrome, 0, 0.3, 0, g);
  const rotor = new THREE.Group();
  rotor.position.y = -0.12;
  g.add(rotor);

  cyl(0.25, 0.32, 0.22, 18, MAT.chrome, 0, 0, 0, rotor);
  for (let i = 0; i < 4; i++) {
    const arm = new THREE.Group();
    arm.rotation.y = i * Math.PI / 2;
    rotor.add(arm);
    const blade = box(2.25, 0.06, 0.55, MAT.wood, 1.15, 0, 0, arm);
    blade.rotation.y = -0.1;
    blade.geometry.translate(0, 0, 0);
  }

  const lamp = sphere(0.36, MAT.warmGlow, 0, -0.4, 0, g, 0.55);
  lamp.castShadow = false;
  g.userData.rotor = rotor;
  return g;
}
const fans = [
  makeFan(-7, -3),
  makeFan(4.5, 3.5),
  makeFan(10, -5)
];

function makePendant(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 9.7, z);
  scene.add(g);

  cyl(0.035, 0.035, 1.2, 8, MAT.black, 0, -0.5, 0, g);
  const shade = mesh(new THREE.CylinderGeometry(0.25, 0.72, 0.45, 24, 1, true),
    MAT.red, g);
  shade.position.y = -1.18;
  const bulb = sphere(0.15, MAT.warmGlow, 0, -1.42, 0, g);
  bulb.castShadow = false;

  const light = new THREE.PointLight(0xffc66a, 4.5, 10, 2);
  light.position.y = -1.4;
  light.castShadow = true;
  light.shadow.mapSize.set(512, 512);
  light.shadow.bias = -0.001;
  g.add(light);
}
for (const x of [-2, 4, 10]) makePendant(x, -4.2);

function makeClock() {
  const g = new THREE.Group();
  g.position.set(-7, 6.8, -11.55);
  scene.add(g);

  const face = cyl(0.9, 0.9, 0.12, 40, MAT.white, 0, 0, 0, g);
  face.rotation.x = Math.PI / 2;
  torus(0.91, 0.08, MAT.chrome, 0, 0, 0.08, g);

  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6;
    box(0.06, 0.2, 0.04, MAT.black,
      Math.sin(a) * 0.7, Math.cos(a) * 0.7, 0.16, g).rotation.z = -a;
  }

  const hour = box(0.07, 0.48, 0.04, MAT.black, 0, 0.2, 0.2, g);
  hour.geometry.translate(0, -0.18, 0);
  hour.rotation.z = -0.7;
  const minute = box(0.045, 0.67, 0.04, MAT.red, 0, 0.29, 0.22, g);
  minute.geometry.translate(0, -0.25, 0);
  minute.rotation.z = 1.7;
  g.userData.minute = minute;
  return g;
}
const clock = makeClock();

function makeNapkinHolder(x, z) {
  const g = new THREE.Group();
  g.position.set(x, 3.65, z);
  scene.add(g);

  box(0.65, 0.65, 0.22, MAT.chrome, 0, 0.33, 0, g);
  box(0.5, 0.56, 0.04, MAT.white, 0, 0.55, 0, g);
}
makeNapkinHolder(-1.5, -4);
makeNapkinHolder(5, -4);

function makeMenu(x, y, z, rot = 0) {
  const tex = canvasTexture((ctx, s) => {
    ctx.fillStyle = '#fff1c9';
    ctx.fillRect(0, 0, s, s);
    ctx.strokeStyle = '#b20e24';
    ctx.lineWidth = 22;
    ctx.strokeRect(15, 15, s - 30, s - 30);
    ctx.fillStyle = '#b20e24';
    ctx.textAlign = 'center';
    ctx.font = 'bold 58px Georgia';
    ctx.fillText("TODAY'S", s / 2, 100);
    ctx.fillStyle = '#176f75';
    ctx.font = 'bold 45px sans-serif';
    ctx.fillText('BLUE PLATE', s / 2, 175);
    ctx.fillText('SPECIAL', s / 2, 228);
    ctx.fillStyle = '#2b2220';
    ctx.font = '30px monospace';
    ctx.fillText('Burger & Shake', s / 2, 305);
    ctx.fillText('$ 1.25', s / 2, 356);
  });
  const m = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.65 });
  const p = mesh(new THREE.PlaneGeometry(2.5, 3.2), m);
  p.position.set(x, y, z);
  p.rotation.y = rot;
  return p;
}
makeMenu(-15.76, 6.1, -4.4, Math.PI / 2);

function makeCeilingTrim() {
  const pts = [
    new THREE.Vector3(-15.65, 8.65, -11.65),
    new THREE.Vector3(15.65, 8.65, -11.65),
    new THREE.Vector3(15.65, 8.65, 11.65)
  ];
  tube(pts, 0.07, MAT.cyanGlow);
}
makeCeilingTrim();

for (let i = 0; i < 18; i++) {
  const x = range(-14, 14);
  const z = range(-10, 10);
  if (x > -8 && z > -6 && z < -2) continue;
  const sparkle = sphere(range(0.012, 0.026), MAT.chrome, x, 0.02, z);
  sparkle.castShadow = false;
}

const hemi = new THREE.HemisphereLight(0x9ed8ff, 0x281016, 1.35);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe5bb, 3.2);
key.position.set(-8, 14, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -20;
key.shadow.camera.right = 20;
key.shadow.camera.top = 18;
key.shadow.camera.bottom = -18;
key.shadow.camera.near = 1;
key.shadow.camera.far = 45;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.PointLight(0x48dfff, 8, 20, 2);
fill.position.set(-12, 4, 6);
scene.add(fill);

const neonPulse = new THREE.PointLight(0xff1a88, 8, 22, 2);
neonPulse.position.set(8, 5, -9);
scene.add(neonPulse);

const dust = new THREE.BufferGeometry();
const dustCount = 180;
const dustPos = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i++) {
  dustPos[i * 3] = range(-15, 15);
  dustPos[i * 3 + 1] = range(0.5, 9);
  dustPos[i * 3 + 2] = range(-11, 11);
}
dust.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dustPoints = new THREE.Points(dust, new THREE.PointsMaterial({
  color: 0xffe6cf,
  size: 0.025,
  transparent: true,
  opacity: 0.42,
  depthWrite: false
}));
scene.add(dustPoints);

const clockTimer = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clockTimer.getElapsedTime();
  const dt = Math.min(clockTimer.getDelta(), 0.05);

  fans.forEach((fan, i) => {
    fan.userData.rotor.rotation.y = t * (0.48 + i * 0.05);
  });

  jukebox.userData.record.rotation.z = t * 0.55;
  clock.userData.minute.rotation.z = 1.7 - t * 0.012;
  neonPulse.intensity = 7.5 + Math.sin(t * 2.4) * 1.2
    + Math.sin(t * 7.1) * 0.25;
  signMat.opacity = 0.88 + Math.sin(t * 3.2) * 0.08;
  dustPoints.rotation.y = t * 0.008;
  dustPoints.position.y = Math.sin(t * 0.25) * 0.08;

  controls.update(dt);
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});
</script>
