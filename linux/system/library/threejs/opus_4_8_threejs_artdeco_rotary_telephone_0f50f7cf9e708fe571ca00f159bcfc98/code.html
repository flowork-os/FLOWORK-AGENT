<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art-Deco Rotary Telephone</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0c0f;}
  #c{display:block;width:100%;height:100%;}
  .tag{position:fixed;left:16px;bottom:14px;font:12px/1.4 Georgia,serif;color:#8b8f98;
       letter-spacing:.18em;text-transform:uppercase;user-select:none;pointer-events:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tag">Rotary Telephone &middot; Bakelite &amp; Chrome</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const PI = Math.PI;

/* ---------------------------------------------------------------- renderer */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.outputColorSpace = THREE.SRGBColorSpace;

/* ------------------------------------------------------------------- scene */
const scene = new THREE.Scene();

/* studio background – dark radial vignette */
function makeBackground(){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(256,210,40, 256,260,420);
  grd.addColorStop(0,'#262a31');
  grd.addColorStop(0.45,'#161821');
  grd.addColorStop(1,'#080a0d');
  g.fillStyle = grd; g.fillRect(0,0,512,512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
scene.background = makeBackground();

/* environment for realistic chrome reflections */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ camera */
const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(2.7, 1.95, 3.75);

/* ---------------------------------------------------------------- controls */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.target.set(0, 0.62, 0);
controls.minDistance = 2.6;
controls.maxDistance = 8;
controls.maxPolarAngle = PI * 0.52;
controls.update();

/* ---------------------------------------------------------------- lighting */
const hemi = new THREE.HemisphereLight(0x9aa6b6, 0x14100d, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff4e6, 2.3);
key.position.set(3.6, 5.4, 4.0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 25;
key.shadow.camera.left = -3;  key.shadow.camera.right = 3;
key.shadow.camera.top = 3;    key.shadow.camera.bottom = -3;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x8fb0d8, 0.6);
fill.position.set(-4.5, 2.2, 2.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.25);
rim.position.set(-2.4, 3.2, -4.2);
scene.add(rim);

/* --------------------------------------------------------------- shadow floor */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
floor.rotation.x = -PI/2;
floor.position.y = 0.0;
floor.receiveShadow = true;
scene.add(floor);

/* --------------------------------------------------------------- materials */
const matBakelite = new THREE.MeshPhysicalMaterial({
  color:0x0b0b0e, metalness:0.0, roughness:0.17,
  clearcoat:1.0, clearcoatRoughness:0.06, envMapIntensity:1.05
});
const matChrome = new THREE.MeshStandardMaterial({
  color:0xf5f7fa, metalness:1.0, roughness:0.09, envMapIntensity:1.5
});
const matNickel = new THREE.MeshStandardMaterial({
  color:0xe9e6da, metalness:1.0, roughness:0.17, envMapIntensity:1.3
});
const matDarkPlate = new THREE.MeshPhysicalMaterial({
  color:0x101013, metalness:0.25, roughness:0.32,
  clearcoat:0.5, clearcoatRoughness:0.2, envMapIntensity:0.85
});
const matCap = new THREE.MeshPhysicalMaterial({
  color:0x0a0a0c, metalness:0.12, roughness:0.4, clearcoat:0.6, envMapIntensity:0.9
});
const matCord = new THREE.MeshStandardMaterial({
  color:0x2c2420, metalness:0.04, roughness:0.92, envMapIntensity:0.35
});

/* ------------------------------------------------- procedural helper geometry */
function roundedRectShape(w, d, r){
  const s = new THREE.Shape();
  const x = -w/2, y = -d/2;
  s.moveTo(x+r, y);
  s.lineTo(x+w-r, y);  s.quadraticCurveTo(x+w, y, x+w, y+r);
  s.lineTo(x+w, y+d-r);s.quadraticCurveTo(x+w, y+d, x+w-r, y+d);
  s.lineTo(x+r, y+d);  s.quadraticCurveTo(x, y+d, x, y+d-r);
  s.lineTo(x, y+r);    s.quadraticCurveTo(x, y, x+r, y);
  return s;
}
function roundedBoxGeo(w, d, h, r, bevel=0.02){
  const b = Math.min(bevel, h/2 - 0.001, r - 0.001);
  const shape = roundedRectShape(w-2*b, d-2*b, Math.max(0.01, r-b));
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth:h-2*b, bevelEnabled:true, bevelThickness:b, bevelSize:b,
    bevelSegments:4, curveSegments:28, steps:1
  });
  geo.rotateX(-PI/2);
  geo.center();
  return geo;
}

/* --------------------------------------------------------- number-card texture */
const dialLayout = [
  {d:'1', l:'',    deg:75},
  {d:'2', l:'ABC', deg:45},
  {d:'3', l:'DEF', deg:15},
  {d:'4', l:'GHI', deg:345},
  {d:'5', l:'JKL', deg:255},
  {d:'6', l:'MNO', deg:225},
  {d:'7', l:'PRS', deg:195},
  {d:'8', l:'TUV', deg:165},
  {d:'9', l:'WXY', deg:135},
  {d:'0', l:'',    deg:105},
];
const DISC_R = 0.46;
function makeDialTexture(){
  const S = 1024, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.clearRect(0,0,S,S);
  const cx = S/2, cy = S/2;
  const Rnum = S * (0.40 / DISC_R) / 2 * 2; // pixel radius for plane-radius 0.40
  const Rn = S/2 * (0.40/DISC_R);
  for(const it of dialLayout){
    const a = it.deg * PI/180;
    const x = cx + Rn*Math.cos(a);
    const y = cy - Rn*Math.sin(a);
    g.save();
    g.translate(x,y);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    // numeral
    g.shadowColor = 'rgba(255,255,255,0.45)'; g.shadowBlur = 8;
    g.fillStyle = '#f4f0e4';
    g.font = 'bold 96px Georgia, "Times New Roman", serif';
    g.fillText(it.d, 0, -8);
    g.shadowBlur = 0;
    // letters
    if(it.l){
      g.fillStyle = '#d7cfbd';
      g.font = 'bold 30px Arial, sans-serif';
      g.fillText(it.l.split('').join(' '), 0, 52);
    }
    g.restore();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
const matNum = new THREE.MeshStandardMaterial({
  map: makeDialTexture(), transparent:true, alphaTest:0.32,
  color:0xf2eee2, metalness:0.7, roughness:0.28,
  emissive:0x191913, emissiveIntensity:0.3, envMapIntensity:1.3, side:THREE.FrontSide
});

/* --------------------------------------------------- transmitter (mouth) cap tex */
function makePerfTexture(){
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#131315'; g.fillRect(0,0,S,S);
  const cx = S/2, cy = S/2;
  const rings = [0,1,2,3];
  for(const ring of rings){
    const rad = ring*24;
    const count = ring===0 ? 1 : ring*6;
    for(let i=0;i<count;i++){
      const a = (i/count)*PI*2;
      const px = cx + rad*Math.cos(a);
      const py = cy + rad*Math.sin(a);
      g.beginPath(); g.arc(px,py,6,0,PI*2);
      g.fillStyle = '#050506'; g.fill();
      g.beginPath(); g.arc(px-1.5,py-1.5,3,0,PI*2);
      g.fillStyle = '#3a3a3d'; g.fill();
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const matMouthCap = new THREE.MeshStandardMaterial({
  map: makePerfTexture(), color:0x2a2a2c, metalness:0.3, roughness:0.55, envMapIntensity:0.7
});

/* ============================================================= BUILD PHONE  */
const phone = new THREE.Group();

/* ---- stepped chrome banding (art-deco skirt) */
const steps = [
  {y:0.030, h:0.060, w:2.18, d:2.08, r:0.50},
  {y:0.085, h:0.050, w:2.09, d:1.99, r:0.47},
  {y:0.128, h:0.050, w:2.01, d:1.91, r:0.44},
];
for(const s of steps){
  const m = new THREE.Mesh(roundedBoxGeo(s.w, s.d, s.h, s.r, 0.018), matChrome);
  m.position.y = s.y;
  phone.add(m);
}

/* ---- main bakelite body */
const body = new THREE.Mesh(roundedBoxGeo(2.0, 1.9, 0.80, 0.42, 0.16), matBakelite);
body.position.y = 0.52;
phone.add(body);

/* ---- slim chrome top lip */
const topLip = new THREE.Mesh(roundedBoxGeo(2.03, 1.93, 0.045, 0.43, 0.02), matChrome);
topLip.position.y = 0.885;
phone.add(topLip);

/* =========================================================== ROTARY DIAL */
const dial = new THREE.Group();

/* dark dial plate */
const plateGeo = new THREE.CylinderGeometry(DISC_R, DISC_R, 0.05, 64);
plateGeo.rotateX(PI/2);
const plate = new THREE.Mesh(plateGeo, matDarkPlate);
plate.position.z = -0.024;
dial.add(plate);

/* numeral card */
const numDisc = new THREE.Mesh(new THREE.CircleGeometry(DISC_R-0.004, 96), matNum);
numDisc.position.z = 0.007;
dial.add(numDisc);

/* chrome bezel ring */
const bezel = new THREE.Mesh(new THREE.TorusGeometry(DISC_R-0.005, 0.022, 20, 96), matChrome);
bezel.position.z = 0.006;
dial.add(bezel);

/* nickel finger-wheel with 10 holes */
const wheelShape = new THREE.Shape();
wheelShape.absarc(0,0, 0.36, 0, PI*2, false);
const centerHole = new THREE.Path();
centerHole.absarc(0,0, 0.115, 0, PI*2, true);
wheelShape.holes.push(centerHole);
for(const it of dialLayout){
  const a = it.deg*PI/180;
  const hx = 0.28*Math.cos(a), hy = 0.28*Math.sin(a);
  const p = new THREE.Path();
  p.absarc(hx, hy, 0.052, 0, PI*2, true);
  wheelShape.holes.push(p);
}
const wheelGeo = new THREE.ExtrudeGeometry(wheelShape, {
  depth:0.05, bevelEnabled:true, bevelThickness:0.012, bevelSize:0.012,
  bevelSegments:2, curveSegments:34
});
const wheel = new THREE.Mesh(wheelGeo, matNickel);
wheel.position.z = 0.012;
dial.add(wheel);

/* center hub */
const hubBase = new THREE.Mesh(new THREE.CylinderGeometry(0.118,0.118,0.06,40), matChrome);
hubBase.rotation.x = PI/2; hubBase.position.z = 0.04;
dial.add(hubBase);
const hubDome = new THREE.Mesh(
  new THREE.SphereGeometry(0.11, 32, 20, 0, PI*2, 0, PI/2), matChrome);
hubDome.rotation.x = -PI/2; hubDome.position.z = 0.07;
dial.add(hubDome);

/* finger stop */
const stopA = -60*PI/180;
const sx = 0.335*Math.cos(stopA), sy = 0.335*Math.sin(stopA);
const stopPost = new THREE.Mesh(new THREE.CylinderGeometry(0.028,0.034,0.13,20), matChrome);
stopPost.rotation.x = PI/2;
stopPost.position.set(sx, sy, 0.06);
dial.add(stopPost);
const stopTab = new THREE.Mesh(new THREE.BoxGeometry(0.11,0.032,0.05), matChrome);
stopTab.position.set(sx-0.045, sy+0.015, 0.11);
stopTab.rotation.z = 0.5;
dial.add(stopTab);

dial.position.set(0, 0.50, 0.86);
dial.rotation.x = -0.30;
phone.add(dial);

/* =========================================================== FAN CRADLE */
function makeSaddle(){
  const s = new THREE.Shape();
  s.moveTo(-0.28,0);
  s.lineTo(-0.30,0.12);
  s.lineTo(-0.24,0.30);
  s.lineTo(-0.095,0.30);
  s.quadraticCurveTo(-0.06,0.30,-0.05,0.205);
  s.quadraticCurveTo(0,0.165,0.05,0.205);
  s.quadraticCurveTo(0.06,0.30,0.095,0.30);
  s.lineTo(0.24,0.30);
  s.lineTo(0.30,0.12);
  s.lineTo(0.28,0);
  s.closePath();
  const geo = new THREE.ExtrudeGeometry(s,{
    depth:0.16, bevelEnabled:true, bevelThickness:0.02, bevelSize:0.02,
    bevelSegments:2, curveSegments:26
  });
  geo.translate(0,0,-0.10);
  geo.rotateY(-PI/2);
  return geo;
}
const saddleGeo = makeSaddle();
for(const sx2 of [-0.42, 0.42]){
  const sd = new THREE.Mesh(saddleGeo, matChrome);
  sd.position.set(sx2, 0.90, 0);
  phone.add(sd);
  // decorative fan ribs on the outward faces
  for(let k=-1;k<=1;k++){
    const rib = new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,0.26,10), matChrome);
    rib.position.set(sx2 + (sx2>0?0.085:-0.085), 0.90+0.14, k*0.11);
    rib.rotation.x = k*0.32;
    rib.rotation.z = PI/2;
    phone.add(rib);
  }
}
/* switch-hook plunger pins between saddles */
for(const px of [-0.16, 0.16]){
  const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.034,0.04,0.11,20), matChrome);
  pin.position.set(px, 0.945, 0);
  phone.add(pin);
}

/* =========================================================== HANDSET */
const handset = new THREE.Group();

/* central curved handle */
const handlePts = [
  new THREE.Vector3(-0.58, 0.00, 0),
  new THREE.Vector3(-0.30, 0.07, 0),
  new THREE.Vector3( 0.00, 0.10, 0),
  new THREE.Vector3( 0.30, 0.07, 0),
  new THREE.Vector3( 0.58, 0.00, 0),
];
const handleCurve = new THREE.CatmullRomCurve3(handlePts, false, 'catmullrom', 0.5);
const handle = new THREE.Mesh(
  new THREE.TubeGeometry(handleCurve, 80, 0.062, 20, false), matBakelite);
handset.add(handle);

/* ear / mouth pieces */
function makeEndpiece(isMouth){
  const g = new THREE.Group();
  const bottomR = isMouth ? 0.162 : 0.150;
  const flare = new THREE.Mesh(
    new THREE.CylinderGeometry(0.072, bottomR, 0.175, 36), matBakelite);
  flare.position.y = -0.088;
  g.add(flare);
  const capR = bottomR - 0.006;
  const cap = new THREE.Mesh(new THREE.CircleGeometry(capR, 40),
                             isMouth ? matMouthCap : matCap);
  cap.rotation.x = PI/2;   // face downward/outward
  cap.position.y = -0.175;
  g.add(cap);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(capR, 0.014, 14, 44), matChrome);
  ring.rotation.x = PI/2;
  ring.position.y = -0.174;
  g.add(ring);
  return g;
}
const ear = makeEndpiece(false);
ear.position.set(-0.62, -0.055, 0);
ear.rotation.z = -0.5;
handset.add(ear);

const mouth = makeEndpiece(true);
mouth.position.set(0.62, -0.055, 0);
mouth.rotation.z = 0.5;
handset.add(mouth);

handset.position.set(0, 1.16, 0);
phone.add(handset);

/* =========================================================== BRAIDED CORD */
const cordPts = [
  new THREE.Vector3(0.64, 1.00, 0.02),
  new THREE.Vector3(0.86, 0.66, 0.22),
  new THREE.Vector3(0.97, 0.34, 0.24),
  new THREE.Vector3(0.87, 0.16, 0.02),
  new THREE.Vector3(0.66, 0.24,-0.16),
  new THREE.Vector3(0.72, 0.45,-0.05),
  new THREE.Vector3(0.95, 0.34, 0.02),
  new THREE.Vector3(1.03, 0.23,-0.05),
];
const cordCurve = new THREE.CatmullRomCurve3(cordPts, false, 'catmullrom', 0.5);
const cord = new THREE.Mesh(
  new THREE.TubeGeometry(cordCurve, 240, 0.03, 12, false), matCord);
phone.add(cord);
/* chrome grommets at both ends of the cord */
const grommetA = new THREE.Mesh(new THREE.TorusGeometry(0.045,0.014,12,28), matChrome);
grommetA.position.copy(cordPts[0]); grommetA.rotation.x = PI/2;
phone.add(grommetA);
const grommetB = new THREE.Mesh(new THREE.TorusGeometry(0.05,0.016,12,28), matChrome);
grommetB.position.copy(cordPts[cordPts.length-1]); grommetB.rotation.z = 0.4;
phone.add(grommetB);

/* --------------------------------------------------- shadows on all parts */
phone.traverse(o=>{
  if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; }
});
scene.add(phone);

/* ---------------------------------------------------------------- resize */
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ------------------------------------------------------------------ loop */
function animate(){
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
