<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inflatable Boombox</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08101d}
canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08101d);
scene.fog = new THREE.Fog(0x08101d, 18, 32);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(10, 6.6, 13);
camera.lookAt(0, 0.8, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 8;
controls.maxDistance = 23;
controls.target.set(0, 0.75, 0);

const vinylBlue = new THREE.MeshPhysicalMaterial({
  color: 0x287e9d,
  roughness: 0.22,
  metalness: 0.03,
  clearcoat: 0.8,
  clearcoatRoughness: 0.13
});
const seamMat = new THREE.MeshPhysicalMaterial({
  color: 0x64c8c7,
  roughness: 0.2,
  clearcoat: 0.9,
  clearcoatRoughness: 0.1
});
const darkVinyl = new THREE.MeshPhysicalMaterial({
  color: 0x202d39,
  roughness: 0.3,
  metalness: 0.1,
  clearcoat: 0.45
});
const speakerMat = new THREE.MeshPhysicalMaterial({
  color: 0x303c47,
  roughness: 0.38,
  clearcoat: 0.38
});
const ringMat = new THREE.MeshStandardMaterial({
  color: 0x76c9c3,
  roughness: 0.3,
  metalness: 0.15
});
const coralMat = new THREE.MeshPhysicalMaterial({
  color: 0xf06d65,
  roughness: 0.24,
  clearcoat: 0.7,
  clearcoatRoughness: 0.14
});
const yellowMat = new THREE.MeshPhysicalMaterial({
  color: 0xf5c85b,
  roughness: 0.25,
  clearcoat: 0.8
});
const blackMat = new THREE.MeshStandardMaterial({
  color: 0x090d14,
  roughness: 0.48
});
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0x16394b,
  roughness: 0.17,
  metalness: 0.12,
  transmission: 0.08,
  clearcoat: 0.8
});

function mesh(geometry, material, position, scale, rotation) {
  const object = new THREE.Mesh(geometry, material);
  if (position) object.position.set(position[0], position[1], position[2]);
  if (scale) object.scale.set(scale[0], scale[1], scale[2]);
  if (rotation) object.rotation.set(rotation[0], rotation[1], rotation[2]);
  object.castShadow = true;
  object.receiveShadow = true;
  scene.add(object);
  return object;
}

function roundedBox(width, height, depth, radius, material, position, scale, rotation) {
  return mesh(new RoundedBoxGeometry(width, height, depth, 6, radius), material, position, scale, rotation);
}

function tube(points, radius, material, closed) {
  const curve = new THREE.CatmullRomCurve3(points);
  const geometry = new THREE.TubeGeometry(curve, 28, radius, 10, closed === true);
  return mesh(geometry, material);
}

function cylinder(radiusTop, radiusBottom, depth, material, position, rotation) {
  return mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, depth, 48), material, position, null, rotation);
}

function sphere(material, position, scale) {
  return mesh(new THREE.SphereGeometry(1, 40, 24), material, position, scale);
}

const body = roundedBox(8.8, 3.35, 2.45, 0.48, vinylBlue, [0, 0.3, 0], [1, 1, 1], [0, 0, 0]);

roundedBox(8.45, 0.16, 2.05, 0.08, seamMat, [0, 1.89, 0], [1, 1, 1], [0, 0, 0]);
roundedBox(8.45, 0.16, 2.05, 0.08, seamMat, [0, -1.28, 0], [1, 1, 1], [0, 0, 0]);
roundedBox(0.16, 2.92, 2.05, 0.08, seamMat, [-4.29, 0.3, 0], [1, 1, 1], [0, 0, 0]);
roundedBox(0.16, 2.92, 2.05, 0.08, seamMat, [4.29, 0.3, 0], [1, 1, 1], [0, 0, 0]);

sphere(vinylBlue, [-3.9, -1.18, 0], [1.15, 0.45, 1.05]);
sphere(vinylBlue, [3.9, -1.18, 0], [1.15, 0.45, 1.05]);

for (const x of [-2.78, 2.78]) {
  cylinder(1.34, 1.34, 0.18, darkVinyl, [x, 0.18, 1.24], [Math.PI / 2, 0, 0]);
  cylinder(1.08, 0.93, 0.22, speakerMat, [x, 0.18, 1.38], [Math.PI / 2, 0, 0]);
  for (const radius of [0.98, 0.76, 0.53]) {
    mesh(new THREE.TorusGeometry(radius, 0.045, 10, 64), ringMat, [x, 0.18, 1.52], null, [Math.PI / 2, 0, 0]);
  }
  cylinder(0.34, 0.44, 0.26, darkVinyl, [x, 0.18, 1.53], [Math.PI / 2, 0, 0]);
  sphere(darkVinyl, [x, 0.18, 1.69], [0.2, 0.2, 0.08]);
}

roundedBox(2.05, 1.34, 0.24, 0.18, seamMat, [0, -0.22, 1.3]);
roundedBox(1.82, 1.1, 0.25, 0.13, darkVinyl, [0, -0.22, 1.48]);
roundedBox(1.5, 0.78, 0.08, 0.06, glassMat, [0, -0.22, 1.64]);

for (const x of [-0.52, 0.52]) {
  cylinder(0.3, 0.3, 0.1, blackMat, [x, -0.22, 1.72], [Math.PI / 2, 0, 0]);
  mesh(new THREE.TorusGeometry(0.22, 0.035, 8, 32), coralMat, [x, -0.22, 1.78], null, [Math.PI / 2, 0, 0]);
}

for (const x of [-1.35, 1.35]) {
  roundedBox(0.86, 0.33, 0.42, 0.15, coralMat, [x, -1.03, 1.42]);
  roundedBox(0.58, 0.18, 0.18, 0.08, yellowMat, [x, -0.99, 1.66]);
}

roundedBox(0.8, 0.34, 0.42, 0.15, yellowMat, [0, -1.02, 1.43]);
roundedBox(0.38, 0.18, 0.18, 0.08, blackMat, [0, -0.98, 1.66]);

const handlePoints = [
  new THREE.Vector3(-2.25, 1.72, 0.05),
  new THREE.Vector3(-2.35, 2.18, 0.02),
  new THREE.Vector3(-1.9, 2.62, 0),
  new THREE.Vector3(-0.9, 2.7, 0),
  new THREE.Vector3(0.15, 2.57, 0),
  new THREE.Vector3(0.92, 2.32, 0),
  new THREE.Vector3(1.9, 2.3, 0.02),
  new THREE.Vector3(2.22, 1.8, 0.05)
];
tube(handlePoints, 0.25, seamMat, false);
sphere(seamMat, [-2.25, 1.72, 0.05], [0.31, 0.31, 0.31]);
sphere(seamMat, [2.22, 1.8, 0.05], [0.31, 0.31, 0.31]);

const ribY = [-0.75, -0.35, 0.05, 0.45, 0.85];
for (const y of ribY) {
  tube([
    new THREE.Vector3(-4.02, y, 1.28),
    new THREE.Vector3(-3.55, y + 0.04, 1.42),
    new THREE.Vector3(-3.05, y, 1.45)
  ], 0.045, seamMat, false);
  tube([
    new THREE.Vector3(3.05, y, 1.45),
    new THREE.Vector3(3.55, y - 0.04, 1.42),
    new THREE.Vector3(4.02, y, 1.28)
  ], 0.045, seamMat, false);
}

const valveStem = cylinder(0.16, 0.22, 0.33, coralMat, [3.22, 1.88, -0.48], [0, 0, Math.PI / 2]);
sphere(coralMat, [3.4, 1.88, -0.48], [0.22, 0.22, 0.22]);

const indicator = new THREE.PointLight(0xff8c65, 1.8, 4);
indicator.position.set(0, 0.2, 2.1);
scene.add(indicator);

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(18, 64),
  new THREE.MeshStandardMaterial({ color: 0x0d1d2b, roughness: 0.7, metalness: 0.05 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.72;
floor.receiveShadow = true;
scene.add(floor);

const hemi = new THREE.HemisphereLight(0x9ed9e4, 0x0a1220, 2.1);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffe8c5, 4.3);
key.position.set(-6, 10, 9);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -10;
key.shadow.camera.right = 10;
key.shadow.camera.top = 10;
key.shadow.camera.bottom = -7;
key.shadow.bias = -0.0002;
scene.add(key);

const rim = new THREE.DirectionalLight(0x4e9dff, 2.4);
rim.position.set(8, 5, -8);
scene.add(rim);

const fill = new THREE.PointLight(0x57d8d1, 2.2, 16);
fill.position.set(-6, 2, 5);
scene.add(fill);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  controls.update();
  renderer.render(scene, camera);
}

renderer.setAnimationLoop(animate);
</script>
</body>
</html>
