<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Commuter Bicycle — three.js</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #16181c; }
  #app { position: fixed; inset: 0; }
  .hint {
    position: fixed; left: 14px; bottom: 12px;
    font: 12px/1.4 system-ui, sans-serif; color: #8a9099;
    letter-spacing: .3px; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hint">Commuter bicycle · drag to orbit · scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------- Renderer */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

/* ------------------------------------------------------------------- Scene */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x181a1e);

// Environment for realistic metal reflections
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ Camera */
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.05, 100);
camera.position.set(2.25, 1.10, 2.65);

/* ---------------------------------------------------------------- Controls */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.minDistance = 1.4;
controls.maxDistance = 8;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 0.52, 0);

/* ---------------------------------------------------------------- Lighting */
const hemi = new THREE.HemisphereLight(0x9aa4b2, 0x1b1c20, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3e6, 2.4);
key.position.set(3.2, 5.0, 2.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 16;
key.shadow.camera.left = -2.2;
key.shadow.camera.right = 2.2;
key.shadow.camera.top = 2.2;
key.shadow.camera.bottom = -2.2;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0xa9c6ff, 0.55);
fill.position.set(-3.5, 2.0, 3.0);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.5);
rim.position.set(-2.4, 3.2, -3.8);
scene.add(rim);

/* ------------------------------------------------------------------ Ground */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color: 0x121317, roughness: 0.98, metalness: 0.0 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* --------------------------------------------------------------- Materials */
const frameMat   = new THREE.MeshStandardMaterial({ color: 0x2c7580, metalness: 0.55, roughness: 0.32 });
const frameMat2  = new THREE.MeshStandardMaterial({ color: 0x23606a, metalness: 0.55, roughness: 0.34 });
const rubberMat  = new THREE.MeshStandardMaterial({ color: 0x121216, metalness: 0.0,  roughness: 0.88 });
const gripMat    = new THREE.MeshStandardMaterial({ color: 0x1a1a1d, metalness: 0.0,  roughness: 0.75 });
const aluMat     = new THREE.MeshStandardMaterial({ color: 0xc7ccd2, metalness: 0.9,  roughness: 0.30 });
const steelMat   = new THREE.MeshStandardMaterial({ color: 0xd6d9de, metalness: 0.95, roughness: 0.20 });
const darkMetal  = new THREE.MeshStandardMaterial({ color: 0x3b3e44, metalness: 0.85, roughness: 0.42 });
const blackPlas  = new THREE.MeshStandardMaterial({ color: 0x161719, metalness: 0.25, roughness: 0.55 });
const saddleMat  = new THREE.MeshStandardMaterial({ color: 0x1a1a1e, metalness: 0.1,  roughness: 0.6 });

/* --------------------------------------------------------------- Utilities */
const bike = new THREE.Group();
const V = (x, y, z = 0) => new THREE.Vector3(x, y, z);
const up = new THREE.Vector3(0, 1, 0);

function reg(m) { m.castShadow = true; m.receiveShadow = true; return m; }

// Cylinder (tube) between two points
function connect(a, b, radius, material, seg = 14) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const geo = new THREE.CylinderGeometry(radius, radius, len, seg);
  const m = new THREE.Mesh(geo, material);
  m.position.copy(a).addScaledVector(dir, 0.5);
  m.quaternion.setFromUnitVectors(up, dir.clone().normalize());
  bike.add(reg(m));
  return m;
}

// Small sphere lug at a joint
function lug(p, r, material) {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 14), material);
  m.position.copy(p);
  bike.add(reg(m));
  return m;
}

// A flat disc whose axis lies along Z (wheels, rotors, chainrings...)
function discZ(radius, thickness, material, center, z, seg = 40) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, thickness, seg), material);
  m.rotation.x = Math.PI / 2;
  m.position.set(center.x, center.y, z);
  return reg(m);
}

/* ------------------------------------------------------------- Key layout  */
const R          = 0.34;                 // wheel outer radius (700c-ish)
const BB         = V(0.00, 0.28, 0);     // bottom bracket
const rearAxle   = V(-0.44, 0.34, 0);
const frontAxle  = V(0.62, 0.34, 0);
const seatTop    = V(-0.14, 0.76, 0);    // top of seat tube
const headTop    = V(0.505, 0.71, 0);
const headBot    = V(0.545, 0.59, 0);
const DRIVE_Z    = 0.058;                // drivetrain plane (right side)

/* ------------------------------------------------------------------ Wheels */
function makeWheel() {
  const g = new THREE.Group();

  // Tire
  const tire = new THREE.Mesh(new THREE.TorusGeometry(0.322, 0.018, 20, 60), rubberMat);
  g.add(reg(tire));

  // Rim band + spoke bed
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.303, 0.303, 0.024, 64, 1, true), aluMat);
  rim.rotation.x = Math.PI / 2;
  g.add(reg(rim));
  const bed = new THREE.Mesh(new THREE.TorusGeometry(0.298, 0.007, 12, 60), aluMat);
  g.add(reg(bed));

  // Hub + flanges
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.021, 0.021, 0.095, 24), aluMat);
  hub.rotation.x = Math.PI / 2;
  g.add(reg(hub));
  for (const z of [-0.034, 0.034]) {
    const fl = new THREE.Mesh(new THREE.CylinderGeometry(0.030, 0.030, 0.006, 24), aluMat);
    fl.rotation.x = Math.PI / 2; fl.position.z = z;
    g.add(reg(fl));
  }

  // Spokes (tangential lacing look, dished to the flanges)
  const nS = 28;
  for (let i = 0; i < nS; i++) {
    const th = (i / nS) * Math.PI * 2;
    const side = (i % 2 === 0) ? 1 : -1;
    const lace = 0.30 * side;
    const hp = V(0.027 * Math.cos(th), 0.027 * Math.sin(th), side * 0.034);
    const rp = V(0.293 * Math.cos(th + lace), 0.293 * Math.sin(th + lace), 0);
    const dir = new THREE.Vector3().subVectors(rp, hp);
    const len = dir.length();
    const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.0016, 0.0016, len, 5), steelMat);
    sp.position.copy(hp).addScaledVector(dir, 0.5);
    sp.quaternion.setFromUnitVectors(up, dir.clone().normalize());
    g.add(reg(sp));
  }

  // Disc-brake rotor (left side)
  const rotor = new THREE.Mesh(new THREE.CylinderGeometry(0.073, 0.073, 0.0024, 40), steelMat);
  rotor.rotation.x = Math.PI / 2; rotor.position.z = -0.05;
  g.add(reg(rotor));
  const spider = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.003, 20), aluMat);
  spider.rotation.x = Math.PI / 2; spider.position.z = -0.05;
  g.add(reg(spider));
  // a few rotor "arms"
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.006, 0.045, 0.0022), steelMat);
    arm.position.set(0.045 * Math.cos(a), 0.045 * Math.sin(a), -0.05);
    arm.rotation.z = a;
    g.add(reg(arm));
  }

  return g;
}

const rearWheel = makeWheel();  rearWheel.position.copy(rearAxle);
const frontWheel = makeWheel(); frontWheel.position.copy(frontAxle);
bike.add(rearWheel, frontWheel);

/* ------------------------------------------------------------- Diamond frame */
// Main triangle
connect(BB, seatTop, 0.016, frameMat);        // seat tube
connect(BB, headBot, 0.019, frameMat);        // down tube
connect(seatTop, headTop, 0.015, frameMat);   // top tube
connect(headTop, headBot, 0.020, frameMat2);  // head tube

// Rear triangle (paired stays)
for (const z of [-0.05, 0.05]) {
  connect(V(0, 0.28, z * 0.55), V(rearAxle.x, rearAxle.y, z), 0.010, frameMat);              // chainstay
  connect(V(seatTop.x, seatTop.y, z * 0.22), V(rearAxle.x, rearAxle.y, z), 0.0095, frameMat); // seatstay
}

// Fork (paired legs) + crown
connect(headBot, V(headBot.x + 0.01, headBot.y - 0.06, 0), 0.017, frameMat2); // crown stub
for (const z of [-0.05, 0.05]) {
  connect(V(headBot.x + 0.008, headBot.y - 0.055, 0), V(frontAxle.x, frontAxle.y, z), 0.011, frameMat2);
}

// Smooth lugs at frame joints
lug(BB, 0.024, frameMat);
lug(seatTop, 0.019, frameMat);
lug(headTop, 0.022, frameMat2);
lug(headBot, 0.021, frameMat2);

// Bottom-bracket shell
const bbShell = new THREE.Mesh(new THREE.CylinderGeometry(0.021, 0.021, 0.072, 24), aluMat);
bbShell.rotation.x = Math.PI / 2; bbShell.position.copy(BB);
bike.add(reg(bbShell));

// Rear dropouts / axle nuts
for (const z of [-0.05, 0.05]) lug(V(rearAxle.x, rearAxle.y, z), 0.012, aluMat);
for (const z of [-0.05, 0.05]) lug(V(frontAxle.x, frontAxle.y, z), 0.012, aluMat);

/* ----------------------------------------------------------- Seatpost & saddle */
const seatpostTop = V(-0.155, 0.925, 0);
connect(seatTop, seatpostTop, 0.0125, aluMat);
lug(seatTop, 0.016, blackPlas); // seat clamp

const saddle = new THREE.Mesh(new THREE.SphereGeometry(0.5, 26, 18), saddleMat);
saddle.scale.set(0.15, 0.032, 0.086);
saddle.position.set(-0.15, 0.947, 0);
bike.add(reg(saddle));
// saddle rails / post link
connect(seatpostTop, V(-0.15, 0.935, 0), 0.008, aluMat);

/* --------------------------------------------------------- Stem & flat bars */
const barCenter = V(0.43, 0.80, 0);
connect(headTop, V(headTop.x - 0.01, headTop.y + 0.055, 0), 0.014, aluMat); // steerer/spacers
connect(V(headTop.x - 0.01, headTop.y + 0.055, 0), barCenter, 0.014, aluMat); // stem
lug(barCenter, 0.016, blackPlas); // bar clamp

// Flat handlebar with gentle backsweep
const leftEnd  = V(0.39, 0.80, -0.27);
const rightEnd = V(0.39, 0.80, 0.27);
connect(barCenter, leftEnd, 0.0105, aluMat);
connect(barCenter, rightEnd, 0.0105, aluMat);

// Grips + brake levers
for (const end of [leftEnd, rightEnd]) {
  const dir = new THREE.Vector3().subVectors(end, barCenter).normalize();
  const gripStart = end.clone().addScaledVector(dir, -0.11);
  connect(gripStart, end, 0.016, gripMat, 16);
  // lever
  const s = Math.sign(end.z);
  const lp = end.clone().addScaledVector(dir, -0.02);
  connect(lp, V(lp.x + 0.05, lp.y - 0.015, lp.z - s * 0.01), 0.006, steelMat, 8);
}

/* ------------------------------------------------------- Crank, chainring, pedals */
const chainR = 0.093;
// Chainring (drive side)
bike.add(discZ(chainR, 0.004, aluMat, BB, DRIVE_Z + 0.006, 44));
bike.add(discZ(0.05, 0.006, aluMat, BB, DRIVE_Z + 0.004, 30)); // spider/crank spider
// tooth ring hint
const teeth = new THREE.Mesh(new THREE.TorusGeometry(chainR, 0.004, 8, 60), darkMetal);
teeth.position.set(BB.x, BB.y, DRIVE_Z + 0.006);
bike.add(reg(teeth));

function makePedal(center, outboardZ) {
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.085, 0.02, 0.055), blackPlas);
  body.position.set(center.x, center.y, outboardZ);
  bike.add(reg(body));
}

const crankLen = 0.165;
const driveAngle = -1.05;
// drive-side crank + pedal
const pDrive = V(BB.x + crankLen * Math.cos(driveAngle), BB.y + crankLen * Math.sin(driveAngle), 0.09);
connect(V(BB.x, BB.y, DRIVE_Z + 0.01), V(pDrive.x, pDrive.y, 0.078), 0.012, aluMat);
connect(V(pDrive.x, pDrive.y, 0.078), V(pDrive.x, pDrive.y, 0.12), 0.006, steelMat, 10); // spindle
makePedal(pDrive, 0.115);
// non-drive crank + pedal
const la = driveAngle + Math.PI;
const pLeft = V(BB.x + crankLen * Math.cos(la), BB.y + crankLen * Math.sin(la), -0.09);
connect(V(BB.x, BB.y, -0.06), V(pLeft.x, pLeft.y, -0.078), 0.012, aluMat);
connect(V(pLeft.x, pLeft.y, -0.078), V(pLeft.x, pLeft.y, -0.12), 0.006, steelMat, 10);
makePedal(pLeft, -0.115);

/* ---------------------------------------------------------- Cassette & derailleur */
// Rear cassette (stack of cogs)
const cogSizes = [0.052, 0.046, 0.040, 0.034, 0.029];
cogSizes.forEach((r, i) => {
  bike.add(discZ(r, 0.0035, darkMetal, rearAxle, 0.044 + i * 0.006, 30));
});

// Rear derailleur silhouette
const rdTop = V(-0.44, 0.30, DRIVE_Z + 0.006);
const upperPulley = V(-0.435, 0.205, DRIVE_Z + 0.006);
const lowerPulley = V(-0.395, 0.150, DRIVE_Z + 0.006);
connect(V(-0.44, 0.34, DRIVE_Z), V(-0.415, 0.245, DRIVE_Z + 0.006), 0.008, darkMetal); // hanger/link
const rdBody = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.062, 0.02), blackPlas);
rdBody.position.set(-0.415, 0.235, DRIVE_Z + 0.006);
rdBody.rotation.z = 0.2;
bike.add(reg(rdBody));
// cage plates + jockey wheels
connect(upperPulley, lowerPulley, 0.006, darkMetal, 10);
bike.add(discZ(0.022, 0.005, darkMetal, upperPulley, DRIVE_Z + 0.006, 20));
bike.add(discZ(0.022, 0.005, darkMetal, lowerPulley, DRIVE_Z + 0.006, 20));

/* --------------------------------------------------------------------- Chain */
const chainMat = darkMetal;
const zc = DRIVE_Z + 0.004;
// top run (chainring top -> cassette top)
connect(V(0.02, BB.y + chainR, zc), V(rearAxle.x, rearAxle.y + 0.052, zc), 0.0055, chainMat, 8);
// cassette -> upper pulley
connect(V(rearAxle.x, rearAxle.y + 0.02, zc), upperPulley, 0.0055, chainMat, 8);
// lower pulley -> chainring bottom
connect(lowerPulley, V(0.0, BB.y - chainR, zc), 0.0055, chainMat, 8);

/* -------------------------------------------------------- Disc brake calipers */
const fCal = new THREE.Mesh(new THREE.BoxGeometry(0.028, 0.05, 0.022), blackPlas);
fCal.position.set(0.575, 0.41, -0.05); bike.add(reg(fCal));
const rCal = new THREE.Mesh(new THREE.BoxGeometry(0.028, 0.05, 0.022), blackPlas);
rCal.position.set(-0.40, 0.41, -0.05); bike.add(reg(rCal));

/* --------------------------------------------------- Bottle-cage mount bosses */
function boss(a, b, t) {
  const p = a.clone().lerp(b, t);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.0075, 0.0075, 0.02, 14), aluMat);
  m.rotation.x = Math.PI / 2;
  m.position.set(p.x, p.y, 0.026);
  bike.add(reg(m));
}
boss(BB, headBot, 0.42);  boss(BB, headBot, 0.60);   // down-tube mounts
boss(BB, seatTop, 0.45);  boss(BB, seatTop, 0.66);   // seat-tube mounts

/* --------------------------------------------------------------- Center & add */
bike.position.x = -0.09;   // center the wheelbase on the Y axis
scene.add(bike);

/* --------------------------------------------------------------------- Loop */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
