<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liquid Chrome Blob</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050506; }
  #c { display: block; width: 100%; height: 100%; }
  .hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    color: rgba(220,225,235,0.35); font: 12px/1.4 -apple-system, Segoe UI, Roboto, sans-serif;
    letter-spacing: 0.06em; text-transform: uppercase; pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">drag to orbit &middot; scroll to zoom</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- Renderer ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

// ---------- Scene ----------
const scene = new THREE.Scene();

// Neutral dark studio backdrop (procedural radial gradient, no external asset)
function makeBackdrop() {
  const c = document.createElement('canvas');
  c.width = c.height = 1024;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(512, 430, 80, 512, 560, 760);
  grad.addColorStop(0.0, '#1c2028');
  grad.addColorStop(0.55, '#0c0e12');
  grad.addColorStop(1.0, '#040406');
  g.fillStyle = grad;
  g.fillRect(0, 0, 1024, 1024);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
scene.background = makeBackdrop();

// ---------- Camera ----------
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(3.6, 2.8, 8.8);

// ---------- Environment (procedural room => crisp chrome reflections) ----------
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(renderer), 0.02).texture;
scene.environment = envTex;

// ---------- Lighting: hemisphere fill + key + fill + rim ----------
const hemi = new THREE.HemisphereLight(0xaecbff, 0x141319, 0.35);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(6, 10, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 40;
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -6;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.02;
key.shadow.radius = 5;
scene.add(key);

const fill = new THREE.DirectionalLight(0x88a6ff, 0.55);
fill.position.set(-7, 3.5, 5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 1.4);
rim.position.set(-4, 5, -7);
scene.add(rim);

// ---------- Chrome material ----------
const chrome = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 1.0,
  roughness: 0.015,
  envMapIntensity: 1.2,
  clearcoat: 1.0,
  clearcoatRoughness: 0.02
});

// ---------- The single object: metaball liquid-metal blob ----------
const S = 3.8;                       // world scale of the marching-cubes field
const RES = 64;
const blob = new MarchingCubes(RES, chrome, false, false, 200000);
blob.isolation = 80;
blob.position.set(0, 0, 0);
blob.scale.setScalar(S);
blob.castShadow = true;
blob.receiveShadow = false;
scene.add(blob);

// Base metaballs (positions in field space [0,1]): bulbous body, a rising
// neck, and a couple of detaching droplets => an abstract mid-splash sculpture.
const SUBTRACT = 12;
const BALLS = [
  { x: 0.500, y: 0.420, z: 0.500, s: 0.95, drift: 0.006, sp: 0.9,  ph: 0.0 }, // core
  { x: 0.605, y: 0.462, z: 0.470, s: 0.68, drift: 0.010, sp: 0.7,  ph: 1.1 }, // right lobe
  { x: 0.398, y: 0.446, z: 0.545, s: 0.66, drift: 0.010, sp: 0.8,  ph: 2.3 }, // left lobe
  { x: 0.520, y: 0.338, z: 0.452, s: 0.60, drift: 0.008, sp: 0.6,  ph: 3.0 }, // lower front bulge
  { x: 0.462, y: 0.356, z: 0.585, s: 0.56, drift: 0.008, sp: 0.65, ph: 4.2 }, // lower back bulge
  { x: 0.552, y: 0.522, z: 0.520, s: 0.50, drift: 0.012, sp: 1.0,  ph: 0.6 }, // upper hump / splash base
  { x: 0.566, y: 0.602, z: 0.502, s: 0.42, drift: 0.016, sp: 1.2,  ph: 1.7 }, // rising neck
  { x: 0.578, y: 0.672, z: 0.500, s: 0.34, drift: 0.020, sp: 1.35, ph: 2.6 }, // neck tip
  { x: 0.612, y: 0.780, z: 0.478, s: 0.30, drift: 0.045, sp: 1.3,  ph: 0.4 }, // droplet 1
  { x: 0.438, y: 0.842, z: 0.542, s: 0.235, drift: 0.052, sp: 1.1, ph: 3.4 }  // droplet 2
];

function updateBlob(t) {
  blob.reset();
  for (const b of BALLS) {
    const dy = b.drift * Math.sin(t * b.sp + b.ph);
    const dx = 0.4 * b.drift * Math.cos(t * b.sp * 0.7 + b.ph);
    blob.addBall(b.x + dx, b.y + dy, b.z, b.s, SUBTRACT);
  }
  blob.update();
}

// Build once to measure, then place ground / frame the shot.
updateBlob(0);
blob.geometry.computeBoundingBox();
const bb = blob.geometry.boundingBox;
const minY = bb.min.y * S;
const maxY = bb.max.y * S;
const targetY = (minY + maxY) * 0.5;

// ---------- Ground plane: receives shadows only ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.ShadowMaterial({ opacity: 0.42 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = minY - 0.02;
ground.receiveShadow = true;
scene.add(ground);

// Aim the key light's shadow at the sculpture.
key.target.position.set(0, targetY, 0);
scene.add(key.target);

// ---------- Controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.enablePan = false;
controls.minDistance = 5;
controls.maxDistance = 20;
controls.target.set(0, targetY, 0);
camera.position.y = targetY + 2.2;
controls.update();

// ---------- Resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
});

// ---------- Render loop ----------
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  updateBlob(t);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
