<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly Stylized Fox</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17181c; }
  #c { display: block; width: 100%; height: 100%; }
  .caption {
    position: fixed; left: 0; right: 0; bottom: 14px;
    text-align: center; color: #c9cdd6; opacity: 0.5;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="caption">Low-Poly Fox &middot; drag to orbit</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------------------------------------------------------------------
   Renderer
--------------------------------------------------------------------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

/* ---------------------------------------------------------------------------
   Scene & Camera
--------------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x17181c);
scene.fog = new THREE.Fog(0x17181c, 12, 26);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.2, 3.0, 6.0);

/* ---------------------------------------------------------------------------
   Lighting  (Hemisphere + Key + Fill + Rim)
--------------------------------------------------------------------------- */
const hemi = new THREE.HemisphereLight(0x9fb4d6, 0x2a231a, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff1dc, 2.6);
key.position.set(5, 7.5, 4.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 1;
key.shadow.camera.far = 30;
key.shadow.camera.left = -6;
key.shadow.camera.right = 6;
key.shadow.camera.top = 6;
key.shadow.camera.bottom = -6;
key.shadow.bias = -0.0004;
key.shadow.radius = 4;
scene.add(key);

const fill = new THREE.DirectionalLight(0x7fa4ff, 0.55);
fill.position.set(-6, 3, 3.5);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffd2a1, 1.5);
rim.position.set(-3.5, 4.5, -6);
scene.add(rim);

/* ---------------------------------------------------------------------------
   Ground plane — receives shadows only
--------------------------------------------------------------------------- */
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(14, 64),
  new THREE.ShadowMaterial({ opacity: 0.34 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------------------
   Materials — flat shaded, matte, faceted
--------------------------------------------------------------------------- */
const matOrange     = new THREE.MeshStandardMaterial({ color: 0xe0702c, flatShading: true, roughness: 0.9,  metalness: 0.0 });
const matOrangeDeep = new THREE.MeshStandardMaterial({ color: 0xc95d20, flatShading: true, roughness: 0.92, metalness: 0.0 });
const matCream      = new THREE.MeshStandardMaterial({ color: 0xf2e2c6, flatShading: true, roughness: 0.95, metalness: 0.0 });
const matWhite      = new THREE.MeshStandardMaterial({ color: 0xf7f1e6, flatShading: true, roughness: 0.95, metalness: 0.0 });
const matDark       = new THREE.MeshStandardMaterial({ color: 0x2a2622, flatShading: true, roughness: 0.85, metalness: 0.0 });
const matNose       = new THREE.MeshStandardMaterial({ color: 0x1d1a17, flatShading: true, roughness: 0.6,  metalness: 0.0 });
const matEye        = new THREE.MeshStandardMaterial({ color: 0x14110e, flatShading: true, roughness: 0.35, metalness: 0.0 });

/* ---------------------------------------------------------------------------
   Fox build
--------------------------------------------------------------------------- */
const fox = new THREE.Group();

function part(geo, mat, pos = [0,0,0], rot = [0,0,0], scale = [1,1,1]) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(pos[0], pos[1], pos[2]);
  m.rotation.set(rot[0], rot[1], rot[2]);
  m.scale.set(scale[0], scale[1], scale[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  fox.add(m);
  return m;
}

// Reusable low-poly primitives
const icoSmall = (r) => new THREE.IcosahedronGeometry(r, 0);   // 20 facets
const pyr      = (r, h) => new THREE.ConeGeometry(r, h, 4);     // 4-sided pyramid

/* ---- Lower body / haunches (sitting rump) ---- */
part(icoSmall(0.9),  matOrangeDeep, [0, 0.82, -0.25], [0, 0.4, 0], [1.05, 0.95, 1.15]);

/* ---- Upper torso / chest rising up ---- */
part(icoSmall(0.66), matOrange,     [0, 1.5, 0.12],   [0, -0.3, 0], [0.98, 1.15, 0.92]);

/* ---- Cream chest / belly front ---- */
part(icoSmall(0.5),  matCream,      [0, 1.02, 0.5],   [0, 0, 0], [0.82, 1.3, 0.6]);
part(icoSmall(0.34), matCream,      [0, 1.62, 0.55],  [0, 0, 0], [0.72, 0.9, 0.5]);

/* ---- Neck / head ---- */
part(icoSmall(0.5),  matOrange,     [0, 2.14, 0.28],  [0, 0, 0], [1.0, 0.96, 1.02]);

/* ---- Cheek ruffs (cream) ---- */
part(pyr(0.24, 0.46), matCream, [-0.44, 2.02, 0.42], [0.2, 0, 0.9],  [1, 1, 0.7]);
part(pyr(0.24, 0.46), matCream, [ 0.44, 2.02, 0.42], [0.2, 0, -0.9], [1, 1, 0.7]);

/* ---- Snout ---- */
part(pyr(0.3, 0.66), matOrange, [0, 2.06, 0.74], [Math.PI / 2, Math.PI / 4, 0], [1, 1, 1]);
part(pyr(0.24, 0.4), matCream,  [0, 1.92, 0.82], [Math.PI / 2, Math.PI / 4, 0], [1, 0.7, 1]);
/* Nose */
part(icoSmall(0.11), matNose, [0, 2.0, 1.08]);

/* ---- Ears (triangular, pointed) ---- */
function ear(sx) {
  part(pyr(0.24, 0.62), matOrange, [0.32 * sx, 2.68, 0.16], [ -0.12, 0, -0.24 * sx], [1, 1, 0.55]);
  // inner dark ear
  part(pyr(0.13, 0.4), matDark, [0.32 * sx, 2.62, 0.28], [ -0.12, 0, -0.24 * sx], [1, 1, 0.4]);
}
ear(-1);
ear(1);

/* ---- Eyes ---- */
part(icoSmall(0.075), matEye, [-0.24, 2.24, 0.62], [0,0,0], [1, 1.25, 0.6]);
part(icoSmall(0.075), matEye, [ 0.24, 2.24, 0.62], [0,0,0], [1, 1.25, 0.6]);

/* ---- Front legs (angular) ---- */
function frontLeg(sx) {
  part(new THREE.CylinderGeometry(0.17, 0.14, 0.95, 5), matOrange,
       [0.27 * sx, 0.5, 0.62], [0.06, 0, 0], [1, 1, 1]);
  // dark paw
  part(new THREE.BoxGeometry(0.28, 0.2, 0.4), matDark,
       [0.27 * sx, 0.1, 0.74], [0, 0, 0], [1, 1, 1]);
}
frontLeg(-1);
frontLeg(1);

/* ---- Tucked hind paws peeking out front sides ---- */
part(new THREE.BoxGeometry(0.28, 0.2, 0.42), matDark, [-0.5, 0.1, 0.24], [0, 0.25, 0]);
part(new THREE.BoxGeometry(0.28, 0.2, 0.42), matDark, [ 0.5, 0.1, 0.24], [0, -0.25, 0]);

/* ---- Big bushy tail (curling around the side, white tip) ---- */
const tailSegs = [
  { p: [ 0.15, 0.68, -0.9 ], r: 0.5,  mat: matOrangeDeep, s: [1.1, 1.0, 1.1] },
  { p: [ 0.55, 0.52, -0.72], r: 0.5,  mat: matOrange,     s: [1.15, 1.0, 1.15] },
  { p: [ 0.82, 0.42, -0.32], r: 0.46, mat: matOrange,     s: [1.1, 1.0, 1.15] },
  { p: [ 0.95, 0.36, 0.16 ], r: 0.42, mat: matOrange,     s: [1.1, 1.0, 1.1] },
  { p: [ 0.9,  0.33, 0.58 ], r: 0.37, mat: matOrange,     s: [1.05, 1.0, 1.05] },
  { p: [ 0.76, 0.32, 0.95 ], r: 0.31, mat: matWhite,      s: [1.05, 1.0, 1.05] },
  { p: [ 0.55, 0.34, 1.18 ], r: 0.22, mat: matWhite,      s: [1.0, 1.0, 1.0] },
];
tailSegs.forEach((seg, i) => {
  part(icoSmall(seg.r), seg.mat, seg.p, [i * 0.7, i * 1.1, i * 0.5], seg.s);
});

/* ---------------------------------------------------------------------------
   Center the fox horizontally & rest feet on the ground
--------------------------------------------------------------------------- */
const foxRoot = new THREE.Group();
foxRoot.add(fox);
scene.add(foxRoot);

const box = new THREE.Box3().setFromObject(fox);
const center = box.getCenter(new THREE.Vector3());
fox.position.x -= center.x;
fox.position.z -= center.z;
fox.position.y -= box.min.y;

// gentle overall scale to frame nicely
foxRoot.scale.setScalar(0.95);

/* ---------------------------------------------------------------------------
   Controls
--------------------------------------------------------------------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 3.5;
controls.maxDistance = 14;
controls.maxPolarAngle = Math.PI * 0.52;
controls.target.set(0, 1.35, 0);
controls.update();

/* ---------------------------------------------------------------------------
   Resize
--------------------------------------------------------------------------- */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------------------------------------------------------------------------
   Render loop
--------------------------------------------------------------------------- */
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
