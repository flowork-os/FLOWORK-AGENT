<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Corner Storefront</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0e1116}canvas{display:block}</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14181f);
scene.fog = new THREE.Fog(0x14181f, 30, 70);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 200);
camera.position.set(11, 7, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.4, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 6;
controls.maxDistance = 30;
controls.maxPolarAngle = Math.PI * 0.49;

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0x9db4d6, 0x2a2118, 0.55));
const sun = new THREE.DirectionalLight(0xfff0dd, 2.2);
sun.position.set(9, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12; sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12; sun.shadow.camera.bottom = -12;
sun.shadow.bias = -0.0004;
scene.add(sun);
const warm = new THREE.PointLight(0xffc98a, 12, 14, 2);
warm.position.set(1.2, 2.6, 1.2);
scene.add(warm);
const fill = new THREE.DirectionalLight(0x8fa6c9, 0.4);
fill.position.set(-8, 6, -4);
scene.add(fill);

// ---------- Ground + soft shadow ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(24, 64),
  new THREE.MeshStandardMaterial({ color: 0x3a3d42, roughness: 0.95 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const shadowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(128,128,10,128,128,128);
  grd.addColorStop(0, 'rgba(0,0,0,0.42)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
})();
const softShadow = new THREE.Mesh(
  new THREE.PlaneGeometry(15, 15),
  new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false })
);
softShadow.rotation.x = -Math.PI/2;
softShadow.position.y = 0.01;
scene.add(softShadow);

// ---------- Materials ----------
const brick = new THREE.MeshStandardMaterial({ color: 0x8a4a38, roughness: 0.9 });
const stone = new THREE.MeshStandardMaterial({ color: 0xd8cfc0, roughness: 0.8 });
const frameMat = new THREE.MeshStandardMaterial({ color: 0x1d2b26, roughness: 0.45, metalness: 0.35 });
const glass = new THREE.MeshPhysicalMaterial({
  color: 0xaac8d8, roughness: 0.06, metalness: 0, transmission: 0.92,
  thickness: 0.05, transparent: true, opacity: 0.55, envMapIntensity: 1.2
});
const interiorMat = new THREE.MeshStandardMaterial({ color: 0x5a4632, roughness: 0.9, emissive: 0x2a1d0c, emissiveIntensity: 0.6 });
const awningMat = new THREE.MeshStandardMaterial({ color: 0x9b2c2c, roughness: 0.85, side: THREE.DoubleSide });
const awningStripe = new THREE.MeshStandardMaterial({ color: 0xe8e2d4, roughness: 0.85, side: THREE.DoubleSide });
const doorMat = new THREE.MeshStandardMaterial({ color: 0x24352f, roughness: 0.4, metalness: 0.3 });
const signMat = new THREE.MeshStandardMaterial({ color: 0x14201c, roughness: 0.5 });
const signText = new THREE.MeshStandardMaterial({ color: 0xf2e2b6, emissive: 0xd9b45e, emissiveIntensity: 0.9, roughness: 0.4 });

// ---------- Building ----------
const shop = new THREE.Group();
scene.add(shop);
const add = (mesh, parent = shop) => { mesh.castShadow = mesh.receiveShadow = true; parent.add(mesh); return mesh; };
const box = (w,h,d,m) => new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);

// Layout: corner at (+X,+Z), facades along +X face (facing +Z) and +Z face (facing +X)
const W = 8, D = 8, H1 = 4.2, H2 = 3.0, chamfer = 2.2, t = 0.35;

// Upper storey (brick) with corner chamfer via shape extrude
const upShape = new THREE.Shape();
upShape.moveTo(-W/2, -D/2);
upShape.lineTo(W/2, -D/2);
upShape.lineTo(W/2, D/2 - chamfer);
upShape.lineTo(W/2 - chamfer, D/2);
upShape.lineTo(-W/2, D/2);
upShape.closePath();
const upper = new THREE.Mesh(
  new THREE.ExtrudeGeometry(upShape, { depth: H2, bevelEnabled: false }),
  brick
);
upper.rotation.x = -Math.PI/2;
upper.position.y = H1 + H2;
add(upper);

// Upper windows
const uw = new THREE.MeshStandardMaterial({ color: 0x2b3844, roughness: 0.3, metalness: 0.2, emissive: 0x1a2733, emissiveIntensity: 0.5 });
for (let i = 0; i < 3; i++) {
  const wf = add(box(0.9, 1.4, 0.12, stone)); wf.position.set(-2.4 + i*2.2, H1 + 1.8, D/2 + 0.02);
  const wg = add(box(0.7, 1.2, 0.12, uw)); wg.position.set(-2.4 + i*2.2, H1 + 1.8, D/2 + 0.08);
  const wf2 = add(box(0.12, 1.4, 0.9, stone)); wf2.position.set(W/2 + 0.02, H1 + 1.8, -2.4 + i*2.2);
  const wg2 = add(box(0.12, 1.2, 0.7, uw)); wg2.position.set(W/2 + 0.08, H1 + 1.8, -2.4 + i*2.2);
}

// Cornice
const corShape = upShape.clone();
const cornice = new THREE.Mesh(new THREE.ExtrudeGeometry(corShape, { depth: 0.28, bevelEnabled: false }), stone);
cornice.rotation.x = -Math.PI/2;
cornice.scale.set(1.04, 1.04, 1);
cornice.position.y = H1 + H2 + 0.28;
add(cornice);

// Ground floor solid back walls (the two non-street sides)
add(box(W, H1, t, brick)).position.set(0, H1/2, -D/2 + t/2);
add(box(t, H1, D, brick)).position.set(-W/2 + t/2, H1/2, 0);
// interior floor + warm interior hint
add(box(W - t, 0.1, D - t, interiorMat)).position.set(-t/2, 0.06, -t/2);
const counter = add(box(2.2, 1.0, 0.8, interiorMat)); counter.position.set(-0.5, 0.5, -0.5);

// ---------- Storefront glazing ----------
const bulkH = 0.6, glassH = 2.6, transomH = 0.5; // bulkhead, glass, transom
const pier = (x, z, ry=0) => { const p = add(box(0.4, H1, 0.4, stone)); p.position.set(x, H1/2, z); p.rotation.y = ry; };

function facadeBay(cx, cz, len, ry) {
  const g = new THREE.Group();
  g.position.set(cx, 0, cz); g.rotation.y = ry;
  shop.add(g);
  // bulkhead
  add(box(len, bulkH, 0.25, frameMat), g).position.y = bulkH/2;
  // glass
  add(box(len, glassH, 0.06, glass), g).position.y = bulkH + glassH/2;
  // transom strip
  add(box(len, transomH, 0.2, frameMat), g).position.y = bulkH + glassH + transomH/2;
  // mullions
  const n = Math.round(len / 1.5);
  for (let i = 0; i <= n; i++) {
    const m = add(box(0.09, glassH, 0.14, frameMat), g);
    m.position.set(-len/2 + (len/n)*i, bulkH + glassH/2, 0);
  }
  // top & bottom rails
  add(box(len, 0.1, 0.14, frameMat), g).position.y = bulkH + 0.05;
  add(box(len, 0.1, 0.14, frameMat), g).position.y = bulkH + glassH - 0.05;
}

// Front facade (+Z), leaving corner chamfer zone
const frontLen = W - chamfer - 0.4;
facadeBay(-chamfer/2 - 0.2 + 0, D/2, frontLen, 0);
// Side facade (+X)
facadeBay(W/2, -chamfer/2 - 0.2, frontLen, Math.PI/2);
pier(-W/2 + 0.2, D/2 - 0.1);
pier(W/2 - 0.1, -D/2 + 0.2);

// ---------- Recessed corner entry ----------
const cornerDir = new THREE.Vector3(1, 0, 1).normalize();
const cornerMid = new THREE.Vector3(W/2 - chamfer/2, 0, D/2 - chamfer/2);
const entry = new THREE.Group();
entry.position.copy(cornerMid).addScaledVector(cornerDir, -0.7); // recess inward
entry.rotation.y = Math.PI/4;
shop.add(entry);
const diagW = Math.hypot(chamfer, chamfer) * 0.72;
// door
add(box(1.15, 2.5, 0.1, doorMat), entry).position.y = 1.25;
add(box(0.85, 1.7, 0.12, glass), entry).position.y = 1.45;
const handle = add(box(0.05, 0.5, 0.08, new THREE.MeshStandardMaterial({ color: 0xc9a227, metalness: 0.9, roughness: 0.25 })), entry);
handle.position.set(0.42, 1.3, 0.1);
// sidelights
add(box(0.6, 2.5, 0.08, glass), entry).position.set(-0.95, 1.25, 0);
add(box(0.6, 2.5, 0.08, glass), entry).position.set(0.95, 1.25, 0);
add(box(diagW + 0.7, 0.6, 0.2, frameMat), entry).position.y = 2.8; // header
// recess side walls (returns)
[[-1,1],[1,-1]].forEach(([s]) => {
  const r = add(box(0.15, H1 - 1.0, 1.05, stone), entry);
  r.position.set(s * (diagW/2 + 0.42), (H1-1.0)/2, 0.5);
});
// entry step
const step = add(box(diagW + 1.0, 0.12, 1.4, stone), entry);
step.position.set(0, 0.06, 0.75);
// entry ceiling light
const soffit = add(box(diagW + 0.8, 0.12, 1.1, frameMat), entry);
soffit.position.set(0, 3.05, 0.5);
const entryGlow = new THREE.PointLight(0xffd9a0, 6, 5, 2);
entryGlow.position.set(0, 2.7, 0.6);
entry.add(entryGlow);

// ---------- Sign band ----------
function signBand(cx, cz, len, ry, label=true) {
  const g = new THREE.Group();
  g.position.set(cx, H1 - 0.45, cz); g.rotation.y = ry;
  shop.add(g);
  add(box(len, 0.7, 0.18, signMat), g).position.z = 0.12;
  if (label) {
    // simple letter blocks as sign type
    const nL = 7;
    for (let i = 0; i < nL; i++) {
      const lw = 0.28 + (i % 3) * 0.05;
      const l = add(box(lw, 0.34, 0.06, signText), g);
      l.position.set(-len/2 + len*0.18 + i * (len*0.64/nL), 0, 0.25);
    }
  }
}
signBand(-chamfer/2 - 0.2, D/2 + 0.05, frontLen, 0);
signBand(W/2 + 0.05, -chamfer/2 - 0.2, frontLen, Math.PI/2);
// corner sign over entry
const cSign = new THREE.Group();
cSign.position.copy(cornerMid).addScaledVector(cornerDir, 0.1);
cSign.position.y = H1 - 0.45;
cSign.rotation.y = Math.PI/4;
shop.add(cSign);
add(box(2.6, 0.7, 0.18, signMat), cSign);
const badge = add(new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.08, 24), signText), cSign);
badge.rotation.x = Math.PI/2;
badge.position.z = 0.16;

// ---------- Awnings ----------
function awning(cx, cz, len, ry) {
  const g = new THREE.Group();
  g.position.set(cx, bulkH + glassH + transomH, cz);
  g.rotation.y = ry;
  shop.add(g);
  const proj = 1.5, drop = 0.75, nS = Math.max(4, Math.round(len / 0.85));
  const sw = len / nS;
  for (let i = 0; i < nS; i++) {
    const geo = new THREE.PlaneGeometry(sw, Math.hypot(proj, drop));
    const s = new THREE.Mesh(geo, i % 2 ? awningStripe : awningMat);
    s.castShadow = s.receiveShadow = true;
    s.position.set(-len/2 + sw/2 + i*sw, -drop/2, proj/2);
    s.rotation.x = Math.atan2(proj, drop) - Math.PI/2 + Math.PI/2; // slope
    s.rotation.x = -Math.atan2(drop, proj) - Math.PI/2 + Math.PI/2;
    s.rotation.x = -(Math.PI/2 - Math.atan2(drop, proj)) ;
    g.add(s);
    // valance
    const v = new THREE.Mesh(new THREE.PlaneGeometry(sw, 0.28), i % 2 ? awningStripe : awningMat);
    v.castShadow = true;
    v.position.set(-len/2 + sw/2 + i*sw, -drop - 0.14, proj);
    g.add(v);
  }
  // awning bar
  const bar = add(new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, len, 10), frameMat), g);
  bar.rotation.z = Math.PI/2;
  bar.position.set(0, -drop, proj);
}
awning(-chamfer/2 - 0.2, D/2 + 0.02, frontLen, 0);
awning(W/2 + 0.02, -chamfer/2 - 0.2, frontLen, Math.PI/2);

// small corner awning over entry
(function(){
  const g = new THREE.Group();
  g.position.copy(cornerMid).addScaledVector(cornerDir, 0.05);
  g.position.y = bulkH + glassH + transomH;
  g.rotation.y = Math.PI/4;
  shop.add(g);
  const len = 2.6, proj = 1.2, drop = 0.6, nS = 3, sw = len/nS;
  for (let i = 0; i < nS; i++) {
    const s = new THREE.Mesh(new THREE.PlaneGeometry(sw, Math.hypot(proj, drop)), i % 2 ? awningStripe : awningMat);
    s.castShadow = true;
    s.position.set(-len/2 + sw/2 + i*sw, -drop/2, proj/2);
    s.rotation.x = -(Math.PI/2 - Math.atan2(drop, proj));
    g.add(s);
    const v = new THREE.Mesh(new THREE.PlaneGeometry(sw, 0.24), i % 2 ? awningStripe : awningMat);
    v.position.set(-len/2 + sw/2 + i*sw, -drop - 0.12, proj);
    g.add(v);
  }
})();

// ---------- Sidewalk + curb detail ----------
const walk = add(box(W + 4, 0.12, D + 4, new THREE.MeshStandardMaterial({ color: 0x55585e, roughness: 0.95 })));
walk.position.set(0.9, 0.061, 0.9);
walk.receiveShadow = true;
// simple bollards near corner
[[5.2, 3.2],[3.2, 5.2]].forEach(([x, z]) => {
  const b = add(new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.8, 12), frameMat));
  b.position.set(x, 0.5, z);
});

// center the composition
shop.position.set(-0.9, 0, -0.9);

// ---------- Resize + loop ----------
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
