<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glowing Fantasy Potion</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #06131a; }
canvas { display: block; width: 100%; height: 100%; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06141a);
scene.fog = new THREE.Fog(0x06141a, 5, 12);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.15, 1.45, 5.4);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.75;
controls.minDistance = 3.5;
controls.maxDistance = 8;
controls.target.set(0, 0.05, 0);

const root = new THREE.Group();
scene.add(root);

scene.add(new THREE.HemisphereLight(0x9bd9dc, 0x061016, 1.4));

const key = new THREE.DirectionalLight(0xbdebf0, 2.4);
key.position.set(-3, 5, 4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 4;
key.shadow.camera.bottom = -4;
scene.add(key);

const tealLight = new THREE.PointLight(0x25ffd0, 7, 4.3, 2);
tealLight.position.set(0, -0.35, 0.15);
tealLight.castShadow = true;
root.add(tealLight);

const goldLight = new THREE.PointLight(0xffb34c, 2.5, 3.2, 2);
goldLight.position.set(0, 1.25, 0.5);
root.add(goldLight);

const bottleProfile = [
  [0.00, -1.38], [0.34, -1.38], [0.66, -1.23], [0.88, -0.91],
  [1.00, -0.48], [0.98, -0.12], [0.85, 0.22], [0.62, 0.52],
  [0.39, 0.72], [0.31, 0.91], [0.30, 1.19], [0.25, 1.39],
  [0.22, 1.52], [0.00, 1.52]
];

function lathe(points, segments = 12) {
  return new THREE.LatheGeometry(
    points.map(p => new THREE.Vector2(p[0], p[1])),
    segments, 0, Math.PI * 2
  );
}

const glass = new THREE.Mesh(
  lathe(bottleProfile, 12),
  new THREE.MeshPhysicalMaterial({
    color: 0x9bdfe0,
    metalness: 0.05,
    roughness: 0.11,
    transmission: 0.88,
    thickness: 0.16,
    ior: 1.45,
    transparent: true,
    opacity: 0.48,
    side: THREE.DoubleSide,
    envMapIntensity: 1.8
  })
);
glass.castShadow = true;
glass.receiveShadow = true;
root.add(glass);

const liquidVertex = `
uniform float uTime;
varying vec3 vPos;
varying vec3 vNormal;
void main() {
  vPos = position;
  vNormal = normal;
  vec3 p = position;
  float wave = sin(p.y * 5.0 + uTime * 2.2 + p.x * 4.0) * 0.025;
  p.x += wave * (1.0 - smoothstep(-1.3, 0.15, p.y));
  p.z += cos(p.y * 4.0 - uTime * 1.7 + p.z * 3.0) * 0.02;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
}
`;

const liquidFragment = `
uniform float uTime;
varying vec3 vPos;
varying vec3 vNormal;
void main() {
  float bands = sin(vPos.y * 10.0 + uTime * 2.4 + sin(vPos.x * 6.0 + uTime) * 0.8) * 0.5 + 0.5;
  float spiral = sin((vPos.x + vPos.z) * 8.0 - vPos.y * 5.0 + uTime * 3.0) * 0.5 + 0.5;
  vec3 deep = vec3(0.005, 0.20, 0.16);
  vec3 bright = vec3(0.04, 1.0, 0.57);
  vec3 color = mix(deep, bright, bands * 0.42 + spiral * 0.34);
  float edge = pow(1.0 - abs(vNormal.y), 1.8);
  color += vec3(0.04, 0.35, 0.21) * edge;
  gl_FragColor = vec4(color, 0.92);
}
`;

const liquidMaterial = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 } },
  vertexShader: liquidVertex,
  fragmentShader: liquidFragment,
  transparent: true,
  side: THREE.DoubleSide
});

const liquidProfile = [
  [0.00, -1.27], [0.28, -1.27], [0.58, -1.15], [0.77, -0.82],
  [0.84, -0.46], [0.78, -0.13], [0.00, -0.13]
];
const liquid = new THREE.Mesh(lathe(liquidProfile, 28), liquidMaterial);
liquid.position.y = 0;
root.add(liquid);

const liquidTop = new THREE.Mesh(
  new THREE.CylinderGeometry(0.77, 0.79, 0.035, 32),
  liquidMaterial
);
liquidTop.position.y = -0.13;
root.add(liquidTop);

const liquidGlow = new THREE.Mesh(
  new THREE.SphereGeometry(0.68, 32, 20),
  new THREE.MeshBasicMaterial({
    color: 0x24ffc4,
    transparent: true,
    opacity: 0.055,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
liquidGlow.scale.set(1, 1.24, 1);
liquidGlow.position.y = -0.53;
root.add(liquidGlow);

const cork = new THREE.Mesh(
  new THREE.CylinderGeometry(0.205, 0.24, 0.48, 10),
  new THREE.MeshStandardMaterial({ color: 0x8b4b27, roughness: 0.92 })
);
cork.position.y = 1.72;
cork.castShadow = true;
root.add(cork);

const corkTop = new THREE.Mesh(
  new THREE.CylinderGeometry(0.225, 0.225, 0.045, 10),
  new THREE.MeshStandardMaterial({ color: 0xb36b3c, roughness: 0.88 })
);
corkTop.position.y = 1.96;
root.add(corkTop);

const collar = new THREE.Mesh(
  new THREE.TorusGeometry(0.285, 0.035, 8, 16),
  new THREE.MeshStandardMaterial({ color: 0xdda34f, metalness: 0.72, roughness: 0.28 })
);
collar.rotation.x = Math.PI / 2;
collar.position.y = 1.49;
root.add(collar);

const tieMaterial = new THREE.MeshStandardMaterial({
  color: 0x6e2e45,
  roughness: 0.7,
  emissive: 0x1b0710
});
const tie = new THREE.Mesh(new THREE.TorusGeometry(0.31, 0.018, 6, 24), tieMaterial);
tie.rotation.x = Math.PI / 2;
tie.position.set(0, 1.43, 0);
root.add(tie);

const tag = new THREE.Group();
tag.position.set(0.60, 0.84, 0.22);
tag.rotation.set(-0.14, -0.30, -0.10);
root.add(tag);

const tagBody = new THREE.Mesh(
  new THREE.BoxGeometry(0.54, 0.76, 0.035),
  new THREE.MeshStandardMaterial({ color: 0xd7ad68, roughness: 0.9 })
);
tagBody.castShadow = true;
tag.add(tagBody);

const tagEdge = new THREE.Mesh(
  new THREE.BoxGeometry(0.45, 0.015, 0.045),
  new THREE.MeshStandardMaterial({ color: 0x8c552d, roughness: 0.8 })
);
tagEdge.position.set(0, -0.25, 0.025);
tag.add(tagEdge);

const runeMaterial = new THREE.MeshStandardMaterial({
  color: 0x39243a,
  emissive: 0x61234c,
  emissiveIntensity: 0.7,
  roughness: 0.65
});
const rune = new THREE.Group();
rune.position.z = 0.03;
tag.add(rune);

const runeRing = new THREE.Mesh(new THREE.TorusGeometry(0.105, 0.014, 6, 16), runeMaterial);
rune.add(runeRing);
const runeDiamond = new THREE.Mesh(new THREE.OctahedronGeometry(0.075, 0), runeMaterial);
runeDiamond.rotation.z = Math.PI / 4;
runeDiamond.position.y = -0.01;
rune.add(runeDiamond);
const runeLine = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.23, 0.018), runeMaterial);
runeLine.position.y = -0.19;
rune.add(runeLine);

const cordCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-0.12, 1.46, 0.02),
  new THREE.Vector3(0.18, 1.34, 0.12),
  new THREE.Vector3(0.43, 1.08, 0.19),
  new THREE.Vector3(0.60, 0.95, 0.23)
]);
const cord = new THREE.Mesh(
  new THREE.TubeGeometry(cordCurve, 24, 0.014, 6, false),
  new THREE.MeshStandardMaterial({ color: 0x54273a, roughness: 0.8 })
);
root.add(cord);

const bubbleData = [
  { x: -0.32, y: -0.22, z: 0.12, r: 0.075, speed: 0.42 },
  { x: 0.24, y: -0.52, z: 0.18, r: 0.045, speed: 0.66 },
  { x: 0.04, y: -0.76, z: -0.22, r: 0.095, speed: 0.31 },
  { x: -0.48, y: -0.98, z: -0.08, r: 0.038, speed: 0.55 },
  { x: 0.40, y: -0.90, z: -0.16, r: 0.052, speed: 0.38 }
];

const bubbles = bubbleData.map((b, i) => {
  const material = new THREE.MeshBasicMaterial({
    color: i % 2 ? 0x8affdd : 0x37ffc6,
    transparent: true,
    opacity: 0.86,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(b.r, 16, 12), material);
  mesh.position.set(b.x, b.y, b.z);
  root.add(mesh);
  return { mesh, data: b, baseY: b.y, phase: i * 1.7 };
});

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(4.5, 64),
  new THREE.MeshStandardMaterial({ color: 0x071a20, roughness: 0.96, metalness: 0.05 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -1.42;
floor.receiveShadow = true;
scene.add(floor);

const halo = new THREE.Mesh(
  new THREE.CircleGeometry(1.35, 64),
  new THREE.MeshBasicMaterial({
    color: 0x0cbf9c,
    transparent: true,
    opacity: 0.10,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  })
);
halo.rotation.x = -Math.PI / 2;
halo.position.set(0, -1.405, 0);
scene.add(halo);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  liquidMaterial.uniforms.uTime.value = t;

  tealLight.intensity = 6.5 + Math.sin(t * 2.2) * 1.1;
  liquidGlow.scale.x = 1 + Math.sin(t * 1.8) * 0.035;
  liquidGlow.scale.z = 1 + Math.cos(t * 1.6) * 0.035;

  bubbles.forEach(({ mesh, data, baseY, phase }) => {
    mesh.position.y = baseY + ((t * data.speed + phase) % 1.18) * 0.98;
    mesh.position.x = data.x + Math.sin(t * 1.5 + phase) * 0.035;
    mesh.position.z = data.z + Math.cos(t * 1.2 + phase) * 0.028;
    mesh.material.opacity = 0.48 + 0.34 * (0.5 + 0.5 * Math.sin(t * 2.0 + phase));
  });

  controls.update();
  renderer.render(scene, camera);
}

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
