<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dining Chair</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e8e4dc}canvas{display:block}</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e4dc);
scene.fog = new THREE.Fog(0xe8e4dc, 6, 14);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.05, 50);
camera.position.set(1.6, 1.25, 1.9);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.HemisphereLight(0xfff5e8, 0x8a8378, 0.55));
const key = new THREE.DirectionalLight(0xfff2dd, 2.2);
key.position.set(3, 4.5, 2.5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -1.5;
key.shadow.camera.right = key.shadow.camera.top = 1.5;
key.shadow.camera.near = 1; key.shadow.camera.far = 12;
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
scene.add(key);
const fill = new THREE.DirectionalLight(0xdde8ff, 0.5);
fill.position.set(-3, 2, -2);
scene.add(fill);

// Ground (soft shadow catcher)
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(6, 64),
  new THREE.ShadowMaterial({ opacity: 0.28 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(6, 64),
  new THREE.MeshStandardMaterial({ color: 0xdcd6ca, roughness: 0.95 })
);
floor.rotation.x = -Math.PI/2;
floor.position.y = -0.001;
scene.add(floor);

// Procedural wood texture
function woodTexture(base, streak) {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 120; i++) {
    const y = Math.random()*256, w = 0.5 + Math.random()*1.8;
    g.strokeStyle = streak; g.globalAlpha = 0.05 + Math.random()*0.12;
    g.lineWidth = w; g.beginPath();
    g.moveTo(0, y);
    for (let x = 0; x <= 256; x += 32) g.lineTo(x, y + Math.sin(x*0.05 + i)*2.5);
    g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const wood = new THREE.MeshStandardMaterial({
  map: woodTexture('#8a5a33', '#5c3a1e'), roughness: 0.62, metalness: 0.0
});
const woodDark = new THREE.MeshStandardMaterial({
  map: woodTexture('#74491f', '#4a2d12'), roughness: 0.68, metalness: 0.0
});

// Chair (real-world metres): seat ~0.45 m high, 0.44 m wide/deep, back ~0.92 m
const chair = new THREE.Group();
function box(w, h, d, x, y, z, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat || wood);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  chair.add(m);
  return m;
}

const seatW = 0.44, seatD = 0.42, seatT = 0.035, seatH = 0.45;
const legT = 0.045, halfX = seatW/2 - legT/2 - 0.01, halfZ = seatD/2 - legT/2 - 0.01;

// Seat (flat, slight overhang)
box(seatW + 0.02, seatT, seatD + 0.02, 0, seatH - seatT/2, 0);

// Front legs (straight, to seat) and back posts (rise to top of backrest)
const backH = 0.92;
box(legT, seatH - seatT, legT,  halfX, (seatH - seatT)/2,  halfZ, woodDark);
box(legT, seatH - seatT, legT, -halfX, (seatH - seatT)/2,  halfZ, woodDark);
box(legT, backH, legT,  halfX, backH/2, -halfZ, woodDark);
box(legT, backH, legT, -halfX, backH/2, -halfZ, woodDark);

// Seat aprons (under seat, between legs)
const apronH = 0.06, apronT = 0.022, apronY = seatH - seatT - apronH/2;
box(halfX*2 - legT, apronH, apronT, 0, apronY,  halfZ, woodDark);          // front
box(halfX*2 - legT, apronH, apronT, 0, apronY, -halfZ, woodDark);          // rear
box(apronT, apronH, halfZ*2 - legT,  halfX, apronY, 0, woodDark);          // right
box(apronT, apronH, halfZ*2 - legT, -halfX, apronY, 0, woodDark);          // left

// Stretchers joining the legs (lower)
const strT = 0.025, strY = 0.16;
box(halfX*2 - legT, strT, strT, 0, strY,  halfZ, woodDark);
box(halfX*2 - legT, strT, strT, 0, strY - 0.04, -halfZ, woodDark);
box(strT, strT, halfZ*2 - legT,  halfX, strY - 0.02, 0, woodDark);
box(strT, strT, halfZ*2 - legT, -halfX, strY - 0.02, 0, woodDark);

// Backrest: top rail, lower rail, vertical slats
const railT = 0.03, topRailY = backH - 0.035, lowRailY = seatH + 0.06;
box(halfX*2 - legT, 0.07, railT, 0, topRailY, -halfZ, wood);
box(halfX*2 - legT, 0.05, railT, 0, lowRailY, -halfZ, wood);
const slats = 4, slatW = 0.045, slatH = topRailY - lowRailY;
for (let i = 0; i < slats; i++) {
  const x = -halfX + legT/2 + (i + 0.5) * (halfX*2 - legT)/slats;
  box(slatW, slatH, 0.018, x, (topRailY + lowRailY)/2, -halfZ, wood);
}

scene.add(chair);

// Controls
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.45, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;
controls.minDistance = 0.8;
controls.maxDistance = 6;
controls.maxPolarAngle = Math.PI/2 - 0.02;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
