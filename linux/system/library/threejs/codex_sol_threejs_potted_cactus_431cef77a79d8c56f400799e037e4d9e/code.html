<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiny Potted Cactus</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #e8e3d8;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe8e3d8);
  scene.fog = new THREE.Fog(0xe8e3d8, 7, 13);

  const camera = new THREE.PerspectiveCamera(
    38,
    window.innerWidth / window.innerHeight,
    0.1,
    50
  );
  camera.position.set(4.1, 3.0, 5.0);

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance'
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 1.25, 0);
  controls.enableDamping = true;
  controls.dampingFactor = 0.055;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.65;
  controls.minDistance = 3.4;
  controls.maxDistance = 8;
  controls.minPolarAngle = Math.PI * 0.18;
  controls.maxPolarAngle = Math.PI * 0.48;

  const hemiLight = new THREE.HemisphereLight(0xfff9ec, 0x655d52, 2.0);
  scene.add(hemiLight);

  const keyLight = new THREE.DirectionalLight(0xfff1d4, 4.2);
  keyLight.position.set(4, 6, 4);
  keyLight.castShadow = true;
  keyLight.shadow.mapSize.set(2048, 2048);
  keyLight.shadow.camera.left = -3.5;
  keyLight.shadow.camera.right = 3.5;
  keyLight.shadow.camera.top = 4;
  keyLight.shadow.camera.bottom = -2;
  keyLight.shadow.camera.near = 0.5;
  keyLight.shadow.camera.far = 14;
  keyLight.shadow.bias = -0.00015;
  keyLight.shadow.normalBias = 0.025;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0xa9c9d2, 1.25);
  fillLight.position.set(-4, 3, -3);
  scene.add(fillLight);

  const rimLight = new THREE.PointLight(0xffc99d, 8, 8, 2);
  rimLight.position.set(2.5, 2.8, -2.8);
  scene.add(rimLight);

  const deskMaterial = new THREE.MeshStandardMaterial({
    color: 0xc8bca7,
    roughness: 0.9,
    metalness: 0
  });
  const desk = new THREE.Mesh(new THREE.PlaneGeometry(18, 18), deskMaterial);
  desk.rotation.x = -Math.PI / 2;
  desk.position.y = -0.02;
  desk.receiveShadow = true;
  scene.add(desk);

  const plant = new THREE.Group();
  plant.rotation.y = -0.18;
  scene.add(plant);

  const pot = new THREE.Group();
  pot.name = 'Terracotta Pot';
  plant.add(pot);

  const terracottaMaterial = new THREE.MeshStandardMaterial({
    color: 0xa94f2f,
    roughness: 0.76,
    metalness: 0
  });

  const terracottaEdgeMaterial = new THREE.MeshStandardMaterial({
    color: 0xbc6240,
    roughness: 0.72,
    metalness: 0
  });

  const potProfile = [
    new THREE.Vector2(0.40, 0.04),
    new THREE.Vector2(0.50, 0.04),
    new THREE.Vector2(0.56, 0.11),
    new THREE.Vector2(0.68, 0.79),
    new THREE.Vector2(0.72, 0.88),
    new THREE.Vector2(0.71, 0.96),
    new THREE.Vector2(0.59, 0.96),
    new THREE.Vector2(0.58, 0.86),
    new THREE.Vector2(0.49, 0.16),
    new THREE.Vector2(0.40, 0.08)
  ];

  const potBody = new THREE.Mesh(
    new THREE.LatheGeometry(potProfile, 64),
    terracottaMaterial
  );
  potBody.castShadow = true;
  potBody.receiveShadow = true;
  pot.add(potBody);

  const lowerFoot = new THREE.Mesh(
    new THREE.CylinderGeometry(0.50, 0.48, 0.105, 64),
    terracottaMaterial
  );
  lowerFoot.position.y = 0.07;
  lowerFoot.castShadow = true;
  lowerFoot.receiveShadow = true;
  pot.add(lowerFoot);

  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(0.655, 0.092, 18, 64),
    terracottaEdgeMaterial
  );
  rim.rotation.x = Math.PI / 2;
  rim.position.y = 0.91;
  rim.castShadow = true;
  rim.receiveShadow = true;
  pot.add(rim);

  const rimInner = new THREE.Mesh(
    new THREE.TorusGeometry(0.574, 0.018, 12, 64),
    new THREE.MeshStandardMaterial({
      color: 0x71351f,
      roughness: 0.86
    })
  );
  rimInner.rotation.x = Math.PI / 2;
  rimInner.position.y = 0.952;
  pot.add(rimInner);

  const soilMaterial = new THREE.MeshStandardMaterial({
    color: 0x302117,
    roughness: 1
  });
  const soil = new THREE.Mesh(
    new THREE.CylinderGeometry(0.574, 0.56, 0.085, 64),
    soilMaterial
  );
  soil.position.y = 0.935;
  soil.receiveShadow = true;
  pot.add(soil);

  let randomState = 74291;
  function random() {
    randomState = (randomState * 1664525 + 1013904223) >>> 0;
    return randomState / 4294967296;
  }

  const gritGeometry = new THREE.IcosahedronGeometry(0.025, 0);
  const gritMaterials = [
    new THREE.MeshStandardMaterial({ color: 0x735845, roughness: 1 }),
    new THREE.MeshStandardMaterial({ color: 0xa88a68, roughness: 1 }),
    new THREE.MeshStandardMaterial({ color: 0x514138, roughness: 1 })
  ];

  for (let i = 0; i < 22; i++) {
    const angle = random() * Math.PI * 2;
    const radius = 0.18 + random() * 0.35;
    const grit = new THREE.Mesh(
      gritGeometry,
      gritMaterials[Math.floor(random() * gritMaterials.length)]
    );
    grit.position.set(
      Math.cos(angle) * radius,
      0.991 + random() * 0.012,
      Math.sin(angle) * radius
    );
    grit.scale.set(
      0.65 + random() * 1.1,
      0.35 + random() * 0.45,
      0.65 + random() * 1.1
    );
    grit.rotation.set(random() * 3, random() * 3, random() * 3);
    grit.castShadow = true;
    pot.add(grit);
  }

  const cactus = new THREE.Group();
  cactus.name = 'Ribbed Cactus';
  plant.add(cactus);

  const cactusBaseY = 0.96;
  const cactusHeight = 1.72;
  const ribCount = 11;
  const radialSegments = 88;
  const verticalSegments = 43;
  const positions = [];
  const indices = [];

  function cactusRadius(t) {
    if (t < 0.58) {
      return 0.35 + 0.23 * Math.sin((t / 0.58) * Math.PI * 0.5);
    }
    const u = (t - 0.58) / 0.42;
    return 0.58 * Math.sqrt(Math.max(0, 1 - u * u));
  }

  for (let yIndex = 0; yIndex < verticalSegments; yIndex++) {
    const t = yIndex / verticalSegments;
    const baseRadius = cactusRadius(t);

    for (let xIndex = 0; xIndex < radialSegments; xIndex++) {
      const angle = (xIndex / radialSegments) * Math.PI * 2;
      const ribWave = 1 + 0.075 * Math.cos(ribCount * angle);
      const radius = baseRadius * ribWave;
      positions.push(
        Math.cos(angle) * radius,
        cactusBaseY + t * cactusHeight,
        Math.sin(angle) * radius
      );
    }
  }

  const topIndex = positions.length / 3;
  positions.push(0, cactusBaseY + cactusHeight, 0);

  for (let yIndex = 0; yIndex < verticalSegments - 1; yIndex++) {
    for (let xIndex = 0; xIndex < radialSegments; xIndex++) {
      const nextX = (xIndex + 1) % radialSegments;
      const a = yIndex * radialSegments + xIndex;
      const b = yIndex * radialSegments + nextX;
      const c = (yIndex + 1) * radialSegments + nextX;
      const d = (yIndex + 1) * radialSegments + xIndex;
      indices.push(a, b, d, b, c, d);
    }
  }

  const finalRing = (verticalSegments - 1) * radialSegments;
  for (let xIndex = 0; xIndex < radialSegments; xIndex++) {
    const nextX = (xIndex + 1) % radialSegments;
    indices.push(finalRing + xIndex, finalRing + nextX, topIndex);
  }

  const cactusGeometry = new THREE.BufferGeometry();
  cactusGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions, 3)
  );
  cactusGeometry.setIndex(indices);
  cactusGeometry.computeVertexNormals();
  cactusGeometry.computeBoundingSphere();

  const cactusMaterial = new THREE.MeshStandardMaterial({
    color: 0x28744c,
    roughness: 0.66,
    metalness: 0,
    side: THREE.FrontSide
  });

  const cactusBody = new THREE.Mesh(cactusGeometry, cactusMaterial);
  cactusBody.castShadow = true;
  cactusBody.receiveShadow = true;
  cactus.add(cactusBody);

  const areoleGeometry = new THREE.SphereGeometry(0.028, 10, 7);
  const areoleMaterial = new THREE.MeshStandardMaterial({
    color: 0xe4d8b8,
    roughness: 0.88
  });

  const clusterLevels = [0.18, 0.32, 0.47, 0.62, 0.76, 0.88];
  const clusterCount = ribCount * clusterLevels.length;
  const areoles = new THREE.InstancedMesh(
    areoleGeometry,
    areoleMaterial,
    clusterCount
  );
  areoles.castShadow = true;

  const spineGeometry = new THREE.CylinderGeometry(0.006, 0.009, 0.14, 5);
  const spineMaterial = new THREE.MeshStandardMaterial({
    color: 0xf0e4c7,
    roughness: 0.72
  });
  const spinesPerCluster = 4;
  const spines = new THREE.InstancedMesh(
    spineGeometry,
    spineMaterial,
    clusterCount * spinesPerCluster
  );
  spines.castShadow = true;

  const dummy = new THREE.Object3D();
  const upAxis = new THREE.Vector3(0, 1, 0);
  let clusterIndex = 0;
  let spineIndex = 0;

  for (let levelIndex = 0; levelIndex < clusterLevels.length; levelIndex++) {
    const t = clusterLevels[levelIndex];
    const baseRadius = cactusRadius(t);

    for (let ribIndex = 0; ribIndex < ribCount; ribIndex++) {
      const offset = levelIndex % 2 === 0 ? 0 : 0.045;
      const angle = (ribIndex / ribCount + offset) * Math.PI * 2;
      const surfaceRadius = baseRadius * 1.075;
      const radial = new THREE.Vector3(
        Math.cos(angle),
        0,
        Math.sin(angle)
      ).normalize();
      const tangent = new THREE.Vector3(
        -Math.sin(angle),
        0,
        Math.cos(angle)
      ).normalize();
      const basePosition = new THREE.Vector3(
        radial.x * (surfaceRadius + 0.012),
        cactusBaseY + t * cactusHeight,
        radial.z * (surfaceRadius + 0.012)
      );

      dummy.position.copy(basePosition);
      dummy.quaternion.setFromUnitVectors(upAxis, radial);
      dummy.scale.set(1.0, 0.52, 1.0);
      dummy.updateMatrix();
      areoles.setMatrixAt(clusterIndex, dummy.matrix);

      for (let spineNumber = 0; spineNumber < spinesPerCluster; spineNumber++) {
        const fan = (spineNumber - 1.5) * 0.34;
        const verticalTilt = spineNumber % 2 === 0 ? 0.2 : -0.13;
        const direction = radial.clone()
          .addScaledVector(tangent, fan)
          .add(new THREE.Vector3(0, verticalTilt, 0))
          .normalize();
        const lengthScale = 0.78 + 0.16 * ((spineNumber + ribIndex) % 3);
        const center = basePosition.clone().addScaledVector(
          direction,
          0.07 * lengthScale
        );

        dummy.position.copy(center);
        dummy.quaternion.setFromUnitVectors(upAxis, direction);
        dummy.scale.set(1, lengthScale, 1);
        dummy.updateMatrix();
        spines.setMatrixAt(spineIndex, dummy.matrix);
        spineIndex++;
      }

      clusterIndex++;
    }
  }

  areoles.instanceMatrix.needsUpdate = true;
  spines.instanceMatrix.needsUpdate = true;
  cactus.add(areoles, spines);

  const topAreole = new THREE.Mesh(
    new THREE.SphereGeometry(0.072, 16, 10),
    new THREE.MeshStandardMaterial({
      color: 0xd9cba8,
      roughness: 0.95
    })
  );
  topAreole.scale.y = 0.36;
  topAreole.position.y = cactusBaseY + cactusHeight - 0.012;
  topAreole.castShadow = true;
  cactus.add(topAreole);

  const topSpineCount = 12;
  const topSpines = new THREE.InstancedMesh(
    new THREE.CylinderGeometry(0.005, 0.008, 0.12, 5),
    spineMaterial,
    topSpineCount
  );
  topSpines.castShadow = true;

  for (let i = 0; i < topSpineCount; i++) {
    const angle = (i / topSpineCount) * Math.PI * 2;
    const direction = new THREE.Vector3(
      Math.cos(angle) * 0.48,
      0.8,
      Math.sin(angle) * 0.48
    ).normalize();
    dummy.position.set(0, cactusBaseY + cactusHeight, 0);
    dummy.position.addScaledVector(direction, 0.055);
    dummy.quaternion.setFromUnitVectors(upAxis, direction);
    dummy.scale.set(1, 0.8 + (i % 3) * 0.11, 1);
    dummy.updateMatrix();
    topSpines.setMatrixAt(i, dummy.matrix);
  }
  topSpines.instanceMatrix.needsUpdate = true;
  cactus.add(topSpines);

  const contactShadow = new THREE.Mesh(
    new THREE.CircleGeometry(1.12, 64),
    new THREE.MeshBasicMaterial({
      color: 0x51493f,
      transparent: true,
      opacity: 0.13,
      depthWrite: false
    })
  );
  contactShadow.rotation.x = -Math.PI / 2;
  contactShadow.position.set(0.17, -0.012, 0.16);
  contactShadow.scale.set(1, 0.58, 1);
  scene.add(contactShadow);

  function resize() {
    const width = window.innerWidth;
    const height = window.innerHeight;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  }

  window.addEventListener('resize', resize);

  function animate() {
    controls.update();
    renderer.render(scene, camera);
  }

  renderer.setAnimationLoop(animate);
</script>
</body>
</html>
