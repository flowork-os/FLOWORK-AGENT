function seededRandomGenerator(seed) {
  let value = seed >>> 0;
  return function () {
    value += 0x6D2B79F5;
    let t = value;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function createTaperedBox(topWidth, topDepth, bottomWidth, bottomDepth, height, material) {
  const y0 = 0;
  const y1 = height;
  const vertices = new Float32Array([
    -bottomWidth / 2, y0, -bottomDepth / 2,
     bottomWidth / 2, y0, -bottomDepth / 2,
     bottomWidth / 2, y0,  bottomDepth / 2,
    -bottomWidth / 2, y0,  bottomDepth / 2,
    -topWidth / 2, y1, -topDepth / 2,
     topWidth / 2, y1, -topDepth / 2,
     topWidth / 2, y1,  topDepth / 2,
    -topWidth / 2, y1,  topDepth / 2
  ]);
  const indices = [
    0, 2, 1, 0, 3, 2,
    0, 1, 5, 0, 5, 4,
    1, 2, 6, 1, 6, 5,
    2, 3, 7, 2, 7, 6,
    3, 0, 4, 3, 4, 7
  ];
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, material);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

function cylinderBetween(start, end, radiusStart, radiusEnd, material, radialSegments = 9) {
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  if (length < 0.0001) return null;
  const geometry = new THREE.CylinderGeometry(
    Math.max(radiusEnd, 0.003),
    Math.max(radiusStart, 0.003),
    length,
    radialSegments,
    1,
    false
  );
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.copy(start).add(end).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(upAxis, direction.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  world.add(mesh);
  return mesh;
}

function makeCurveBranch(points, startRadius, endRadius, material, segments = 16) {
  const curve = new THREE.CatmullRomCurve3(
    points.map(p => new THREE.Vector3(...p)),
    false,
    'centripetal',
    0.45
  );
  let previous = curve.getPoint(0);
  for (let i = 1; i <= segments; i++) {
    const t = i / segments;
    const current = curve.getPoint(t);
    const taper = Math.pow(t, 0.82);
    const r0 = THREE.MathUtils.lerp(startRadius, endRadius, Math.pow((i - 1) / segments, 0.82));
    const r1 = THREE.MathUtils.lerp(startRadius, endRadius, taper);
    cylinderBetween(previous, current, r0, r1, material, startRadius > 0.2 ? 11 : 7);
    previous = current;
  }
  return curve;
}

  cylinderBetween(trunkPrevious, current, base0 * swelling0, base1 * swelling1, material, 11);

}

function addTrainingWire(curve, branchRadius, turns) {
  const points = [];
  const samples = Math.max(45, Math.floor(turns * 16));
  let previousNormal = new THREE.Vector3(1, 0, 0);
  for (let i = 0; i <= samples; i++) {
    const t = i / samples;
    const center = curve.getPoint(t);
    const tangent = curve.getTangent(t).normalize();
    let normal = new THREE.Vector3().crossVectors(tangent, new THREE.Vector3(0, 1, 0));
    if (normal.lengthSq() < 0.01) normal.copy(previousNormal);
    normal.normalize();
    const binormal = new THREE.Vector3().crossVectors(tangent, normal).normalize();
    previousNormal.copy(normal);
    const angle = t * Math.PI * 2 * turns;
    const offset = branchRadius * (0.96 - 0.45 * t) + 0.028;
    center.addScaledVector(normal, Math.cos(angle) * offset);
    center.addScaledVector(binormal, Math.sin(angle) * offset);
    points.push(center);
  }
  const wireCurve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const geometry = new THREE.TubeGeometry(wireCurve, samples, 0.025, 5, false);
  const mesh = new THREE.Mesh(geometry, wireMaterial);
  mesh.castShadow = true;
  world.add(mesh);
}

const needleMatrix = new THREE.Matrix4();
const needleQuat = new THREE.Quaternion();
const needleScale = new THREE.Vector3();
const needlePosition = new THREE.Vector3();
const clusterCenter = new THREE.Vector3();
const direction = new THREE.Vector3();
const axisOne = new THREE.Vector3();
const axisTwo = new THREE.Vector3();
let needleIndex = 0;

for (let p = 0; p < padSpecs.length; p++) {
  const spec = padSpecs[p];
  const padCenter = new THREE.Vector3(...spec.c);
  const sx = spec.s[0];
  const sy = spec.s[1];
  const sz = spec.s[2];

  for (let blob = 0; blob < 9; blob++) {
    const a = random() * Math.PI * 2;
    const radial = Math.sqrt(random()) * 0.72;
    const localX = Math.cos(a) * radial * sx;
    const localZ = Math.sin(a) * radial * sz;
    const localY = (random() - 0.5) * sy * 0.9;
    const cosR = Math.cos(spec.r);
    const sinR = Math.sin(spec.r);
    const blobMesh = new THREE.Mesh(massGeometry, foliageMaterials[(blob + p) % foliageMaterials.length]);
    blobMesh.position.set(
      padCenter.x + localX * cosR - localZ * sinR,
      padCenter.y + localY,
      padCenter.z + localX * sinR + localZ * cosR
    );
    const blobSize = 0.36 + random() * 0.24;
    blobMesh.scale.set(
      blobSize * (1.25 + random() * 0.55),
      blobSize * (0.52 + random() * 0.22),
      blobSize * (0.85 + random() * 0.45)
    );
    blobMesh.rotation.set(random() * 0.5, random() * Math.PI, random() * 0.3);
    blobMesh.castShadow = true;
    blobMesh.receiveShadow = true;
    foliageMassGroup.add(blobMesh);
  }

  for (let c = 0; c < needleClustersPerPad; c++) {
    const angle = random() * Math.PI * 2;
    const radial = Math.pow(random(), 0.48);
    const localX = Math.cos(angle) * radial * sx;
    const localZ = Math.sin(angle) * radial * sz;
    const localY = (random() - 0.34) * sy;
    const cosR = Math.cos(spec.r);
    const sinR = Math.sin(spec.r);

    clusterCenter.set(
      padCenter.x + localX * cosR - localZ * sinR,
      padCenter.y + localY,
      padCenter.z + localX * sinR + localZ * cosR
    );

    const outward = new THREE.Vector3(
      localX / Math.max(sx, 0.01),
      0.18 + random() * 0.35,
      localZ / Math.max(sz, 0.01)
    ).normalize();

    axisOne.crossVectors(outward, upAxis);
    if (axisOne.lengthSq() < 0.01) axisOne.set(1, 0, 0);
    axisOne.normalize();
    axisTwo.crossVectors(outward, axisOne).normalize();

    for (let n = 0; n < needlesPerCluster; n++) {
      const fanAngle = (n / needlesPerCluster) * Math.PI * 2 + random() * 0.28;
      const spread = 0.34 + random() * 0.42;
      direction.copy(outward)
        .multiplyScalar(1.0)
        .addScaledVector(axisOne, Math.cos(fanAngle) * spread)
        .addScaledVector(axisTwo, Math.sin(fanAngle) * spread)
        .normalize();
      direction.y += 0.08 + random() * 0.15;
      direction.normalize();

      const length = 0.25 + random() * 0.22;
      needlePosition.copy(clusterCenter).addScaledVector(direction, 0.015 + random() * 0.055);
      needleQuat.setFromUnitVectors(upAxis, direction);
      needleScale.set(0.75 + random() * 0.45, length, 0.75 + random() * 0.45);
      needleMatrix.compose(needlePosition, needleQuat, needleScale);
      needles.setMatrixAt(needleIndex, needleMatrix);
      const needleColor = new THREE.Color().setHSL(
        0.315 + random() * 0.035,
        0.48 + random() * 0.2,
        0.19 + random() * 0.12
      );
      needles.setColorAt(needleIndex, needleColor);
      needleIndex++;
    }
  }
}
needles.instanceMatrix.needsUpdate = true;
if (needles.instanceColor) needles.instanceColor.needsUpdate = true;

for (const spec of padSpecs) {
  const center = new THREE.Vector3(...spec.c);
  for (let i = 0; i < 5; i++) {
    const start = center.clone().add(new THREE.Vector3(
      (random() - 0.5) * spec.s[0] * 0.55,
      -spec.s[1] * 0.42,
      (random() - 0.5) * spec.s[2] * 0.55
    ));
    const end = center.clone().add(new THREE.Vector3(
      (random() - 0.5) * spec.s[0] * 1.25,
      (random() - 0.25) * spec.s[1],
      (random() - 0.5) * spec.s[2] * 1.25
    ));
    cylinderBetween(start, end, 0.022, 0.009, twigMaterial, 5);
  }
}

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0xbeb8a9,
  roughness: 0.96
});
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(13, 96),
  groundMaterial
);
ground.rotation.x = -Math.PI * 0.5;
ground.position.y = -0.035;
ground.receiveShadow = true;
scene.add(ground);

const backdropRing = new THREE.Mesh(
  new THREE.RingGeometry(7.5, 13, 96),
  new THREE.MeshBasicMaterial({
    color: 0xd3cec1,
    transparent: true,
    opacity: 0.32,
    side: THREE.DoubleSide
  })
);
backdropRing.rotation.x = -Math.PI * 0.5;
backdropRing.position.y = -0.025;
scene.add(backdropRing);

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
}
window.addEventListener('resize', resize);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  foliageMassGroup.rotation.z = Math.sin(elapsed * 0.43) * 0.0015;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
