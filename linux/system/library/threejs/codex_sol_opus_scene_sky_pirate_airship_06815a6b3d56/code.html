<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x7d5d79);
scene.fog = new THREE.FogExp2(0x8d7185, 0.0075);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 500);
camera.position.set(26, 17, 31);
camera.lookAt(0, 6, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.045;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.28;
controls.minDistance = 18;
controls.maxDistance = 62;
controls.maxPolarAngle = Math.PI * 0.79;

let seed = 928471;
function rand() {
  seed = (seed * 1664525 + 1013904223) >>> 0;
  return seed / 4294967296;
}
function range(a, b) {
  return a + (b - a) * rand();
}

function canvasTexture(draw, size = 512) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  draw(x, size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

const woodTex = canvasTexture((c, s) => {
  c.fillStyle = '#633719';
  c.fillRect(0, 0, s, s);
  for (let i = 0; i < 90; i++) {
    const y = range(0, s);
    c.strokeStyle = `rgba(${range(80,160)|0},${range(35,75)|0},${range(12,30)|0},.35)`;
    c.lineWidth = range(1, 5);
    c.beginPath();
    c.moveTo(0, y);
    for (let x = 0; x <= s; x += 24)
      c.lineTo(x, y + Math.sin(x * .035 + i) * range(1, 6));
    c.stroke();
  }
  for (let i = 0; i < 15; i++) {
    c.strokeStyle = 'rgba(25,10,3,.45)';
    c.beginPath();
    c.ellipse(range(0,s), range(0,s), range(7,22), range(2,7), 0, 0, Math.PI*2);
    c.stroke();
  }
});
woodTex.repeat.set(3, 1);

const plankTex = canvasTexture((c, s) => {
  c.fillStyle = '#754522';
  c.fillRect(0, 0, s, s);
  const rows = 8;
  for (let r = 0; r < rows; r++) {
    const y = r * s / rows;
    c.fillStyle = r % 2 ? 'rgba(255,180,75,.035)' : 'rgba(20,5,0,.06)';
    c.fillRect(0, y, s, s / rows);
    c.strokeStyle = 'rgba(24,10,3,.8)';
    c.lineWidth = 3;
    c.beginPath();
    c.moveTo(0, y);
    c.lineTo(s, y);
    c.stroke();
    for (let k = 0; k < 4; k++) {
      const xx = ((k + (r % 2) * .5) / 4) * s;
      c.beginPath();
      c.moveTo(xx, y);
      c.lineTo(xx, y + s / rows);
      c.stroke();
    }
  }
  for (let i = 0; i < 150; i++) {
    c.strokeStyle = `rgba(220,145,65,${range(.02,.12)})`;
    c.beginPath();
    const y = range(0,s), x = range(0,s);
    c.moveTo(x, y);
    c.lineTo(x + range(15,80), y + range(-2,2));
    c.stroke();
  }
});
plankTex.repeat.set(4, 2);

const clothTex = canvasTexture((c, s) => {
  c.fillStyle = '#a1845d';
  c.fillRect(0, 0, s, s);
  for (let y = 0; y < s; y += 6) {
    c.strokeStyle = y % 12 ? 'rgba(255,245,195,.08)' : 'rgba(35,20,10,.08)';
    c.beginPath(); c.moveTo(0,y); c.lineTo(s,y); c.stroke();
  }
  for (let x = 0; x < s; x += 7) {
    c.strokeStyle = 'rgba(50,28,12,.045)';
    c.beginPath(); c.moveTo(x,0); c.lineTo(x,s); c.stroke();
  }
});

const deckMat = new THREE.MeshStandardMaterial({
  map: plankTex, color: 0xc28a50, roughness: .82, metalness: .02
});
const woodMat = new THREE.MeshStandardMaterial({
  map: woodTex, color: 0x8f5a31, roughness: .78
});
const darkWood = new THREE.MeshStandardMaterial({
  color: 0x321b12, roughness: .82
});
const ropeMat = new THREE.MeshStandardMaterial({
  color: 0x8b663c, roughness: 1
});
const brassMat = new THREE.MeshStandardMaterial({
  color: 0xb9832f, roughness: .3, metalness: .76
});
const darkMetal = new THREE.MeshStandardMaterial({
  color: 0x17191b, roughness: .34, metalness: .82
});
const ironMat = new THREE.MeshStandardMaterial({
  color: 0x303033, roughness: .56, metalness: .63
});
const redMat = new THREE.MeshStandardMaterial({
  color: 0x6e1718, roughness: .78
});
const sailMat = new THREE.MeshStandardMaterial({
  map: clothTex, color: 0xbda77a, roughness: .92, side: THREE.DoubleSide
});

function shadow(mesh, cast = true, receive = true) {
  mesh.castShadow = cast;
  mesh.receiveShadow = receive;
  return mesh;
}
function mesh(geometry, material, parent = scene) {
  const m = new THREE.Mesh(geometry, material);
  parent.add(m);
  shadow(m);
  return m;
}
function box(w, h, d, mat, x, y, z, parent = scene) {
  const m = mesh(new THREE.BoxGeometry(w,h,d), mat, parent);
  m.position.set(x,y,z);
  return m;
}
function cyl(rt, rb, h, seg, mat, x, y, z, parent = scene) {
  const m = mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat, parent);
  m.position.set(x,y,z);
  return m;
}
function ropeBetween(a, b, radius = .045, mat = ropeMat, parent = scene) {
  const mid = a.clone().add(b).multiplyScalar(.5);
  const dir = b.clone().sub(a);
  const m = mesh(new THREE.CylinderGeometry(radius,radius,dir.length(),7), mat, parent);
  m.position.copy(mid);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  return m;
}
function curvedRope(points, radius = .04, mat = ropeMat, parent = scene) {
  const curve = new THREE.CatmullRomCurve3(points);
  return mesh(new THREE.TubeGeometry(curve, 32, radius, 6, false), mat, parent);
}

const hemi = new THREE.HemisphereLight(0xffd6ad, 0x303151, 2.25);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffb36c, 4.2);
sun.position.set(-24, 32, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -34;
sun.shadow.camera.right = 34;
sun.shadow.camera.top = 34;
sun.shadow.camera.bottom = -34;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 90;
sun.shadow.bias = -0.0002;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x7299ff, 1.8);
rim.position.set(24, 12, -25);
scene.add(rim);

const skyGeo = new THREE.SphereGeometry(180, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: {
    topColor: { value: new THREE.Color(0x292a60) },
    horizonColor: { value: new THREE.Color(0xf28b67) },
    bottomColor: { value: new THREE.Color(0xb89a9a) }
  },
  vertexShader: `
    varying vec3 vWorld;
    void main(){
      vec4 w = modelMatrix * vec4(position,1.0);
      vWorld = w.xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader: `
    varying vec3 vWorld;
    uniform vec3 topColor;
    uniform vec3 horizonColor;
    uniform vec3 bottomColor;
    void main(){
      float h=normalize(vWorld).y;
      vec3 col=mix(horizonColor,topColor,smoothstep(0.0,.72,h));
      col=mix(bottomColor,col,smoothstep(-.7,-.03,h));
      gl_FragColor=vec4(col,1.0);
    }`
});
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

const sunDisc = mesh(
  new THREE.SphereGeometry(3.2, 24, 16),
  new THREE.MeshBasicMaterial({color:0xffd09b}),
  scene
);
sunDisc.position.set(-72, 24, -105);
sunDisc.castShadow = false;

const airship = new THREE.Group();
airship.position.y = 1.4;
scene.add(airship);

const hullShape = new THREE.Shape();
hullShape.moveTo(-13, 0);
hullShape.bezierCurveTo(-12.5,-2.2,-8,-4.2,0,-4.8);
hullShape.bezierCurveTo(8,-4.2,12.5,-2.2,13,0);
hullShape.lineTo(10.7,1.2);
hullShape.lineTo(-10.7,1.2);
hullShape.closePath();
const hullGeo = new THREE.ExtrudeGeometry(hullShape, {
  depth: 7.2, bevelEnabled: true, bevelSegments: 3,
  bevelSize: .35, bevelThickness: .35, curveSegments: 20
});
hullGeo.translate(0,0,-3.6);
const hull = mesh(hullGeo, woodMat, airship);
hull.position.y = 3.8;

const hullBandMat = new THREE.MeshStandardMaterial({
  color: 0x402014, roughness: .75
});
for (const z of [-3.64,3.64]) {
  const railLine = curvedRope([
    new THREE.Vector3(-11.5,4.7,z),
    new THREE.Vector3(-6,2.2,z),
    new THREE.Vector3(0,1.2,z),
    new THREE.Vector3(6,2.2,z),
    new THREE.Vector3(11.5,4.7,z)
  ], .12, hullBandMat, airship);
  railLine.castShadow = true;
}
for (const x of [-8,-4,0,4,8]) {
  const keelBand = curvedRope([
    new THREE.Vector3(x,4.8,-3.65),
    new THREE.Vector3(x,1.4,0),
    new THREE.Vector3(x,4.8,3.65)
  ], .09, darkWood, airship);
}

const deck = box(21.5,.55,7.1,deckMat,0,5.25,0,airship);
deck.geometry = new THREE.BoxGeometry(21.5,.55,7.1,1,1,1);

const sternDeck = box(5.8,.5,7.1,deckMat,-7.9,6.65,0,airship);
box(1.0,1.35,7.0,woodMat,-5.4,5.95,0,airship);
for (const z of [-3.65,3.65]) {
  box(21.8,.22,.18,darkWood,0,6.58,z,airship);
  for (let x=-10.5;x<=10.5;x+=1.75)
    cyl(.075,.075,1.45,8,darkWood,x,5.9,z,airship);
  box(21.8,.15,.16,woodMat,0,5.65,z,airship);
}
for (const x of [-10.7,10.7]) {
  box(.18,.2,7.1,darkWood,x,6.58,0,airship);
  for (let z=-3.5;z<=3.5;z+=1.75)
    cyl(.075,.075,1.45,8,darkWood,x,5.9,z,airship);
}

const bowsprit = ropeBetween(
  new THREE.Vector3(10,6.15,0),
  new THREE.Vector3(17.2,7.0,0),
  .22,darkWood,airship
);
ropeBetween(new THREE.Vector3(10.8,5.5,-3.2),new THREE.Vector3(17,7,0),.055,ropeMat,airship);
ropeBetween(new THREE.Vector3(10.8,5.5,3.2),new THREE.Vector3(17,7,0),.055,ropeMat,airship);
const figurehead = mesh(new THREE.ConeGeometry(.45,1.5,7),brassMat,airship);
figurehead.position.set(13.1,5.8,0);
figurehead.rotation.z = -Math.PI/2;

const mast = cyl(.25,.34,13.5,12,darkWood,-1,12.2,0,airship);
const crowNest = cyl(1.0,1.25,.8,16,woodMat,-1,16.1,0,airship);
const mastTop = mesh(new THREE.SphereGeometry(.35,12,8),brassMat,airship);
mastTop.position.set(-1,19.15,0);

const yard = ropeBetween(
  new THREE.Vector3(-1,14.4,-6.5),
  new THREE.Vector3(-1,14.4,6.5),
  .15,darkWood,airship
);

const balloon = new THREE.Group();
balloon.position.set(-.4,19.7,0);
airship.add(balloon);
const balloonMat = new THREE.MeshStandardMaterial({
  map: clothTex, color: 0xc7ad76, roughness: .88
});
const balloonBody = mesh(new THREE.SphereGeometry(1,48,24),balloonMat,balloon);
balloonBody.scale.set(10.5,5.3,5.9);
const endA = mesh(new THREE.ConeGeometry(3.8,4.0,32),balloonMat,balloon);
endA.rotation.z = Math.PI/2;
endA.position.x = -10.6;
endA.scale.y = 1.1;
const endB = endA.clone();
endB.rotation.z = -Math.PI/2;
endB.position.x = 10.6;
balloon.add(endB);
shadow(endB);

const balloonBands = [];
for (let x=-8;x<=8;x+=4) {
  const band = mesh(new THREE.TorusGeometry(
    Math.sqrt(Math.max(5.0,30-x*x*.22)),.10,8,40
  ),darkWood,balloon);
  band.position.x=x;
  band.rotation.y=Math.PI/2;
  band.scale.z=1.08;
  balloonBands.push(band);
}
for (const z of [-4.4,4.4]) {
  curvedRope([
    new THREE.Vector3(-9,18.8,z*.55),
    new THREE.Vector3(-5,23.3,z),
    new THREE.Vector3(0,25,z*1.12),
    new THREE.Vector3(5,23.3,z),
    new THREE.Vector3(9,18.8,z*.55)
  ],.075,darkWood,airship);
}

const patchMat1 = new THREE.MeshStandardMaterial({
  color:0x7b4134,roughness:.95,side:THREE.DoubleSide
});
const patchMat2 = new THREE.MeshStandardMaterial({
  color:0x55604a,roughness:.95,side:THREE.DoubleSide
});
for (let i=0;i<12;i++) {
  const patch = mesh(new THREE.PlaneGeometry(range(.8,2),range(.6,1.5)),i%2?patchMat1:patchMat2,balloon);
  const a=range(0,Math.PI*2), b=range(-.65,.65);
  patch.position.set(Math.sin(b)*9.4,Math.cos(b)*4.85*Math.cos(a),Math.cos(b)*5.4*Math.sin(a));
  patch.lookAt(new THREE.Vector3(0,0,0));
  patch.rotateY(Math.PI);
  patch.position.multiplyScalar(1.015);
}

for (const x of [-7,-2,3,8]) {
  for (const z of [-4.2,4.2]) {
    ropeBetween(
      new THREE.Vector3(x,6.4,z*.78),
      new THREE.Vector3(x*.95,18.6,z),
      .065,ropeMat,airship
    );
  }
}

function makePropeller() {
  const g = new THREE.Group();
  const hub = mesh(new THREE.CylinderGeometry(.45,.45,.8,16),brassMat,g);
  hub.rotation.x=Math.PI/2;
  for(let i=0;i<4;i++){
    const blade=mesh(new THREE.BoxGeometry(.42,3.4,.16),woodMat,g);
    blade.position.y=1.8;
    blade.rotation.z=i*Math.PI/2;
    blade.geometry.translate(0,-1.45,0);
  }
  return g;
}
const propeller=makePropeller();
propeller.position.set(-13.6,4.3,0);
propeller.rotation.y=Math.PI/2;
airship.add(propeller);
const engine = cyl(1.05,1.2,2.4,16,darkMetal,-12.3,4.3,0,airship);
engine.rotation.z=Math.PI/2;

function makeWheel() {
  const g=new THREE.Group();
  const rim=mesh(new THREE.TorusGeometry(1.45,.13,10,32),darkWood,g);
  rim.rotation.y=Math.PI/2;
  const hub=mesh(new THREE.CylinderGeometry(.3,.3,.55,16),brassMat,g);
  hub.rotation.z=Math.PI/2;
  for(let i=0;i<10;i++){
    const a=i*Math.PI/5;
    const spoke=ropeBetween(
      new THREE.Vector3(0,Math.cos(a)*.25,Math.sin(a)*.25),
      new THREE.Vector3(0,Math.cos(a)*1.7,Math.sin(a)*1.7),
      .055,darkWood,g
    );
    const grip=mesh(new THREE.CylinderGeometry(.09,.12,.55,8),darkWood,g);
    grip.position.set(0,Math.cos(a)*1.78,Math.sin(a)*1.78);
    grip.rotation.x=Math.PI/2-a;
  }
  return g;
}
const wheel=makeWheel();
wheel.position.set(-7.6,8.2,0);
wheel.rotation.y=Math.PI/2;
airship.add(wheel);
const wheelStand=box(1.3,1.5,1.4,woodMat,-7.6,7.15,0,airship);
const axle=ropeBetween(new THREE.Vector3(-7.6,8.2,-.7),new THREE.Vector3(-7.6,8.2,.7),.16,brassMat,airship);

function makeCannon(x,z,side) {
  const g=new THREE.Group();
  g.position.set(x,6.05,z);
  airship.add(g);
  const carriage=box(2.0,.5,1.25,redMat,0,0,0,g);
  carriage.rotation.y=side*Math.PI/2;
  const barrel=mesh(new THREE.CylinderGeometry(.27,.46,2.9,18),brassMat,g);
  barrel.rotation.x=Math.PI/2;
  barrel.position.set(0,.65,side*.8);
  const muzzle=mesh(new THREE.TorusGeometry(.29,.1,8,18),brassMat,g);
  muzzle.position.set(0,.65,side*2.25);
  muzzle.rotation.x=Math.PI/2;
  for(const xx of [-.7,.7]){
    for(const zz of [-.48,.48]){
      const w=mesh(new THREE.CylinderGeometry(.35,.35,.18,12),darkWood,g);
      w.position.set(xx,-.18,zz);
      w.rotation.z=Math.PI/2;
      const cap=mesh(new THREE.CylinderGeometry(.11,.11,.2,10),brassMat,w);
    }
  }
}
makeCannon(4.8,-3.15,-1);
makeCannon(-.2,-3.15,-1);
makeCannon(3.0,3.15,1);
makeCannon(8.0,3.15,1);

function makeCrate(x,y,z,s=1) {
  const g=new THREE.Group();
  g.position.set(x,y,z);
  airship.add(g);
  box(1.5*s,1.35*s,1.45*s,woodMat,0,0,0,g);
  const slat=.11*s;
  box(1.62*s,slat,1.57*s,darkWood,0,.61*s,0,g);
  box(1.62*s,slat,1.57*s,darkWood,0,-.61*s,0,g);
  box(slat,1.35*s,1.57*s,darkWood,.68*s,0,0,g);
  box(slat,1.35*s,1.57*s,darkWood,-.68*s,0,0,g);
}
makeCrate(7.8,6.2,-1.5,.82);
makeCrate(9.0,6.35,-.7,1);
makeCrate(-4.2,6.3,2.2,.95);
makeCrate(-4.1,7.55,2.25,.72);

function makeBarrel(x,z,s=1) {
  const g=new THREE.Group();
  g.position.set(x,6.25,z);
  airship.add(g);
  const b=mesh(new THREE.CylinderGeometry(.58*s,.68*s,1.55*s,14),woodMat,g);
  for(const yy of [-.56,0,.56]){
    const band=mesh(new THREE.TorusGeometry((yy? .61:.68)*s,.055*s,7,16),ironMat,g);
    band.position.y=yy*s;
    band.rotation.x=Math.PI/2;
  }
}
makeBarrel(6.2,1.9,1);
makeBarrel(7.2,2.1,.85);
makeBarrel(-8.6,-2.2,.9);

const ladder = new THREE.Group();
airship.add(ladder);
for(const z of [-1.9,1.9]){
  curvedRope([
    new THREE.Vector3(-1,6.3,z),
    new THREE.Vector3(-1.2,10,z*1.15),
    new THREE.Vector3(-1,14.4,z*1.4),
    new THREE.Vector3(-.6,18.7,z*1.7)
  ],.06,ropeMat,ladder);
}
for(let y=7;y<18.5;y+=.72){
  const spread=1.9+(y-7)*.07;
  ropeBetween(new THREE.Vector3(-1,y,-spread),new THREE.Vector3(-1,y,spread),.045,ropeMat,ladder);
}

const flagPole=cyl(.1,.12,5.1,10,darkWood,-9.1,10.5,0,airship);
const flagGeo=new THREE.PlaneGeometry(4.4,2.5,18,8);
flagGeo.translate(-2.2,0,0);
const flagCanvas=canvasTexture((c,s)=>{
  c.fillStyle='#17171c';c.fillRect(0,0,s,s);
  c.fillStyle='#e8dfc4';
  c.beginPath();c.arc(s*.52,s*.43,s*.12,0,Math.PI*2);c.fill();
  c.fillRect(s*.49,s*.52,s*.06,s*.14);
  c.strokeStyle='#e8dfc4';c.lineWidth=s*.04;
  c.beginPath();c.moveTo(s*.35,s*.7);c.lineTo(s*.7,s*.5);
  c.moveTo(s*.35,s*.5);c.lineTo(s*.7,s*.7);c.stroke();
  c.fillStyle='#17171c';
  c.beginPath();c.arc(s*.48,s*.42,s*.018,0,7);c.arc(s*.56,s*.42,s*.018,0,7);c.fill();
});
const flagMat=new THREE.MeshStandardMaterial({
  map:flagCanvas,roughness:.9,side:THREE.DoubleSide
});
const flag=mesh(flagGeo,flagMat,airship);
flag.position.set(-9.1,12.15,.05);
flag.rotation.y=Math.PI/2;

function makeLantern(x,z) {
  const pivot=new THREE.Group();
  pivot.position.set(x,6.65,z);
  airship.add(pivot);
  ropeBetween(new THREE.Vector3(0,0,0),new THREE.Vector3(0,-.8,0),.035,darkMetal,pivot);
  const frame=new THREE.Group();
  frame.position.y=-1.15;
  pivot.add(frame);
  const glowMat=new THREE.MeshStandardMaterial({
    color:0xffad45,emissive:0xff731c,emissiveIntensity:3,
    transparent:true,opacity:.82
  });
  const glass=mesh(new THREE.CylinderGeometry(.27,.34,.65,8),glowMat,frame);
  mesh(new THREE.TorusGeometry(.3,.045,6,10),darkMetal,frame).position.y=.31;
  mesh(new THREE.TorusGeometry(.36,.055,6,10),darkMetal,frame).position.y=-.31;
  for(let i=0;i<4;i++){
    const bar=cyl(.025,.025,.68,5,darkMetal,0,0,0,frame);
    bar.position.set(Math.cos(i*Math.PI/2)*.28,0,Math.sin(i*Math.PI/2)*.28);
  }
  const light=new THREE.PointLight(0xff7a25,2.3,6,2);
  light.position.y=-1.1;
  pivot.add(light);
  return pivot;
}
const lanterns=[
  makeLantern(-4.8,-3.55),
  makeLantern(2.2,3.55),
  makeLantern(9.2,-3.55)
];

function makeSpyglass() {
  const g=new THREE.Group();
  const tube=mesh(new THREE.CylinderGeometry(.13,.2,1.9,14),brassMat,g);
  tube.rotation.z=Math.PI/2;
  const eye=mesh(new THREE.CylinderGeometry(.24,.24,.16,14),darkWood,g);
  eye.rotation.z=Math.PI/2;eye.position.x=-1;
  const lens=mesh(new THREE.CylinderGeometry(.17,.17,.04,16),
    new THREE.MeshStandardMaterial({color:0x6ea5bb,metalness:.4,roughness:.15}),g);
  lens.rotation.z=Math.PI/2;lens.position.x=1;
  const stand=cyl(.08,.11,1.3,8,brassMat,0,-.8,0,g);
  g.rotation.y=-.18;
  return g;
}
const spyglass=makeSpyglass();
spyglass.position.set(8.5,7.45,2.95);
spyglass.rotation.y=-.45;
airship.add(spyglass);

const ropeCoil=new THREE.Group();
ropeCoil.position.set(1.0,5.72,-1.4);
airship.add(ropeCoil);
for(let i=0;i<7;i++){
  const coil=mesh(new THREE.TorusGeometry(.55-i*.045,.045,6,28),ropeMat,ropeCoil);
  coil.rotation.x=Math.PI/2;
  coil.position.y=i*.045;
}

const cloudMat=new THREE.MeshStandardMaterial({
  color:0xffd9ca,roughness:1,transparent:true,opacity:.78,
  depthWrite:false
});
const cloudMatShade=new THREE.MeshStandardMaterial({
  color:0xb79db8,roughness:1,transparent:true,opacity:.52,
  depthWrite:false
});
const clouds=[];
function createCloud(x,y,z,scale) {
  const g=new THREE.Group();
  g.position.set(x,y,z);
  g.scale.setScalar(scale);
  scene.add(g);
  const count=7+Math.floor(rand()*7);
  for(let i=0;i<count;i++){
    const puff=mesh(new THREE.SphereGeometry(range(1.3,3.0),16,10),
      i%4===0?cloudMatShade:cloudMat,g);
    puff.position.set(range(-5,5),range(-.8,1.2),range(-2.5,2.5));
    puff.scale.y=range(.55,1);
    puff.castShadow=false;
    puff.receiveShadow=false;
  }
  clouds.push({g,speed:range(.25,.55)});
}
for(let i=0;i<32;i++){
  createCloud(range(-85,85),range(-18,-5),range(-75,45),range(.7,2.2));
}

for(let i=0;i<70;i++){
  const star=mesh(new THREE.SphereGeometry(range(.025,.07),5,4),
    new THREE.MeshBasicMaterial({color:0xffe7c2}),scene);
  const a=range(0,Math.PI*2), h=range(30,110), r=150;
  star.position.set(Math.cos(a)*r,h,Math.sin(a)*r);
  star.castShadow=false;
}

const clock=new THREE.Clock();
const flagBase=flagGeo.attributes.position.array.slice();

function animate() {
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();

  propeller.rotation.z=t*7.5;
  wheel.rotation.x=Math.sin(t*.35)*.09;

  const pos=flag.geometry.attributes.position;
  for(let i=0;i<pos.count;i++){
    const base=i*3;
    const x=flagBase[base];
    const y=flagBase[base+1];
    const anchored=(-x)/4.4;
    pos.setZ(i,
      flagBase[base+2]+Math.sin(t*4.2+x*2.3+y*.8)*.18*(1-anchored)
    );
  }
  pos.needsUpdate=true;
  flag.geometry.computeVertexNormals();

  lanterns.forEach((l,i)=>{
    l.rotation.z=Math.sin(t*1.35+i*1.8)*.13;
    l.rotation.x=Math.sin(t*.9+i)*.055;
  });

  balloon.rotation.z=Math.sin(t*.35)*.012;
  airship.rotation.z=Math.sin(t*.28)*.012;
  airship.position.y=1.4+Math.sin(t*.45)*.12;

  clouds.forEach((c,i)=>{
    c.g.position.x+=c.speed*.012;
    c.g.position.z+=c.speed*.045;
    c.g.position.y+=Math.sin(t*.15+i)*.0015;
    if(c.g.position.z>55){
      c.g.position.z=-85;
      c.g.position.x=range(-85,85);
    }
  });

  controls.update();
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
