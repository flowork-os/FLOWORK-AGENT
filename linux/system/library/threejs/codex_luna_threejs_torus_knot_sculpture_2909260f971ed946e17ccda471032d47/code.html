<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parametric Torus Knot Sculpture</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111216;
    }
    canvas {
      display: block;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101116);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(
  38,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.set(6.2, 4.6, 7.3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.42;
controls.minDistance = 4.2;
controls.maxDistance = 13;
controls.target.set(0, 2.25, 0);

const pmrem = new THREE.PMREMGenerator(renderer);
const environment = new RoomEnvironment(renderer);
scene.environment = pmrem.fromScene(environment, 0.04).texture;
environment.dispose();

const sculptureMaterial = new THREE.MeshStandardMaterial({
  color: 0xc7d1d7,
  metalness: 0.97,
  roughness: 0.105,
  envMapIntensity: 2.25
});

const pedestalMaterial = new THREE.MeshStandardMaterial({
  color: 0x777d83,
  metalness: 0.86,
  roughness: 0.2,
  envMapIntensity: 1.35
});

const darkMetalMaterial = new THREE.MeshStandardMaterial({
  color: 0x34383d,
  metalness: 0.92,
  roughness: 0.17,
  envMapIntensity: 1.4
});

function createRibbonTorusKnot() {
  const segments = 360;
  const radialSegments = 20;
  const majorRadius = 1.27;
  const minorRadius = 0.59;
  const p = 3;
  const q = 2;
  const verticalScale = 1.08;
  const centerY = 2.46;
  const ribbonWidth = 0.235;
  const ribbonThickness = 0.072;

  const centers = [];
  const tangents = [];
  const normals = [];
  const binormals = [];

  function pointAt(t) {
    const c = Math.cos(q * t);
    const s = Math.sin(q * t);
    return new THREE.Vector3(
      (majorRadius + minorRadius * c) * Math.cos(p * t),
      centerY + verticalScale * (majorRadius + minorRadius * c) * Math.sin(p * t),
      minorRadius * s
    );
  }

  for (let i = 0; i < segments; i++) {
    const t = (i / segments) * Math.PI * 2;
    centers.push(pointAt(t));
  }

  for (let i = 0; i < segments; i++) {
    const prev = centers[(i + segments - 1) % segments];
    const next = centers[(i + 1) % segments];
    const tangent = next.clone().sub(prev).normalize();
    tangents.push(tangent);
  }

  for (let i = 0; i < segments; i++) {
    const prevT = tangents[(i + segments - 1) % segments];
    const nextT = tangents[(i + 1) % segments];
    let normal = nextT.clone().sub(prevT);

    if (normal.lengthSq() < 1e-8) {
      normal = new THREE.Vector3(0, 1, 0).cross(tangents[i]);
    }
    normal.normalize();

    let binormal = tangents[i].clone().cross(normal).normalize();
    normal = binormal.clone().cross(tangents[i]).normalize();

    normals.push(normal);
    binormals.push(binormal);
  }

  const positions = [];
  const normalsArray = [];
  const uvs = [];
  const indices = [];

  for (let i = 0; i < segments; i++) {
    const center = centers[i];
    const normal = normals[i];
    const binormal = binormals[i];

    for (let j = 0; j < radialSegments; j++) {
      const theta = (j / radialSegments) * Math.PI * 2;
      const offset = normal.clone()
        .multiplyScalar(Math.cos(theta) * ribbonWidth)
        .add(binormal.clone().multiplyScalar(Math.sin(theta) * ribbonThickness));

      const vertex = center.clone().add(offset);
      positions.push(vertex.x, vertex.y, vertex.z);

      const surfaceNormal = normal.clone()
        .multiplyScalar(Math.cos(theta) / ribbonWidth)
        .add(binormal.clone().multiplyScalar(Math.sin(theta) / ribbonThickness))
        .normalize();

      normalsArray.push(surfaceNormal.x, surfaceNormal.y, surfaceNormal.z);
      uvs.push(i / segments, j / radialSegments);
    }
  }

  for (let i = 0; i < segments; i++) {
    const nextI = (i + 1) % segments;
    for (let j = 0; j < radialSegments; j++) {
      const nextJ = (j + 1) % radialSegments;
      const a = i * radialSegments + j;
      const b = nextI * radialSegments + j;
      const c = nextI * radialSegments + nextJ;
      const d = i * radialSegments + nextJ;
      indices.push(a, b, d, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute("normal", new THREE.Float32BufferAttribute(normalsArray, 3));
  geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeBoundingSphere();

  return new THREE.Mesh(geometry, sculptureMaterial);
}

const sculpture = createRibbonTorusKnot();
sculpture.castShadow = true;
sculpture.receiveShadow = true;
scene.add(sculpture);

const baseGroup = new THREE.Group();

const base = new THREE.Mesh(
  new THREE.CylinderGeometry(2.02, 2.1, 0.34, 128),
  pedestalMaterial
);
base.position.y = 0.17;
base.castShadow = true;
base.receiveShadow = true;
baseGroup.add(base);

const upperBase = new THREE.Mesh(
  new THREE.CylinderGeometry(1.72, 1.91, 0.17, 128),
  darkMetalMaterial
);
upperBase.position.y = 0.425;
upperBase.castShadow = true;
upperBase.receiveShadow = true;
baseGroup.add(upperBase);

const accentRing = new THREE.Mesh(
  new THREE.TorusGeometry(1.78, 0.035, 12, 128),
  sculptureMaterial
);
accentRing.rotation.x = Math.PI / 2;
accentRing.position.y = 0.515;
accentRing.castShadow = true;
accentRing.receiveShadow = true;
baseGroup.add(accentRing);

scene.add(baseGroup);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({
    color: 0x17191e,
    metalness: 0.12,
    roughness: 0.56,
    envMapIntensity: 0.5
  })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.015;
floor.receiveShadow = true;
scene.add(floor);

const keyLight = new THREE.DirectionalLight(0xffffff, 4.2);
keyLight.position.set(4.5, 8, 5);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -5;
keyLight.shadow.camera.right = 5;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -2;
keyLight.shadow.bias = -0.00035;
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0x93b9e8, 2.0);
fillLight.position.set(-5, 4, -4);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffd3a6, 2.3);
rimLight.position.set(1, 5, -7);
scene.add(rimLight);

const softGlow = new THREE.PointLight(0x8aaeff, 1.3, 10, 2);
softGlow.position.set(-2.5, 2.5, 3.5);
scene.add(softGlow);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  sculpture.rotation.y = Math.sin(elapsed * 0.18) * 0.025;
  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
