<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Runner in the Park</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #b9c8ce;
    }
    canvas {
      display: block;
    }
    .label {
      position: fixed;
      left: 22px;
      bottom: 20px;
      color: rgba(255,255,255,0.92);
      font: 500 12px/1.45 Georgia, serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0,0,0,0.65);
      pointer-events: none;
      user-select: none;
    }
    .label span {
      display: block;
      margin-top: 3px;
      font: 400 10px/1.3 Arial, sans-serif;
      letter-spacing: 0.1em;
      opacity: 0.72;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">The Long Stride<span>Bronze study · public park</span></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xb8c8ce);
    scene.fog = new THREE.FogExp2(0xb8c8ce, 0.018);

    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(5.7, 3.7, 7.1);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.05, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.38;
    controls.minDistance = 3.6;
    controls.maxDistance = 13;
    controls.maxPolarAngle = Math.PI * 0.48;

    const hemi = new THREE.HemisphereLight(0xdbe9ee, 0x4a493a, 1.5);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xffefd2, 4.2);
    sun.position.set(-5.5, 9, 5.5);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -8;
    sun.shadow.camera.right = 8;
    sun.shadow.camera.top = 9;
    sun.shadow.camera.bottom = -4;
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 25;
    sun.shadow.bias = -0.00025;
    sun.shadow.normalBias = 0.025;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x9ebdd2, 1.05);
    fill.position.set(6, 4, -6);
    scene.add(fill);

    const bronze = new THREE.MeshStandardMaterial({
      color: 0x6d3d20,
      roughness: 0.34,
      metalness: 0.82
    });
    const bronzeDark = new THREE.MeshStandardMaterial({
      color: 0x302219,
      roughness: 0.44,
      metalness: 0.72
    });
    const bronzeEdge = new THREE.MeshStandardMaterial({
      color: 0xa36c35,
      roughness: 0.29,
      metalness: 0.9
    });
    const stone = new THREE.MeshStandardMaterial({
      color: 0xa8a69e,
      roughness: 0.91,
      metalness: 0.02
    });
    const stoneDark = new THREE.MeshStandardMaterial({
      color: 0x77766f,
      roughness: 0.95
    });
    const plaqueMat = new THREE.MeshStandardMaterial({
      color: 0x30251c,
      roughness: 0.4,
      metalness: 0.78
    });
    const grassMat = new THREE.MeshStandardMaterial({
      color: 0x536f44,
      roughness: 1
    });
    const pathMat = new THREE.MeshStandardMaterial({
      color: 0xb7aa91,
      roughness: 1
    });

    function shadowMesh(mesh) {
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    function ellipsoid(position, scale, material = bronze, segments = 32) {
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(1, segments, Math.max(12, Math.floor(segments * 0.65))),
        material
      );
      mesh.position.copy(position);
      mesh.scale.copy(scale);
      shadowMesh(mesh);
      scene.add(mesh);
      return mesh;
    }

    function limb(a, b, radiusA, radiusB, material = bronze, radialSegments = 18) {
      const start = new THREE.Vector3().copy(a);
      const end = new THREE.Vector3().copy(b);
      const delta = end.clone().sub(start);
      const length = delta.length();
      const geometry = new THREE.CylinderGeometry(
        radiusB, radiusA, length, radialSegments, 5, false
      );
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(start).add(end).multiplyScalar(0.5);
      mesh.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        delta.normalize()
      );
      shadowMesh(mesh);
      scene.add(mesh);
      return mesh;
    }

    function joint(position, radius, material = bronze) {
      return ellipsoid(position, new THREE.Vector3(radius, radius, radius), material, 24);
    }

    function box(size, position, material, bevel = false) {
      let geometry;
      if (bevel) {
        const shape = new THREE.Shape();
        const w = size.x;
        const d = size.z;
        const r = Math.min(0.05, w * 0.08, d * 0.08);
        shape.moveTo(-w / 2 + r, -d / 2);
        shape.lineTo(w / 2 - r, -d / 2);
        shape.quadraticCurveTo(w / 2, -d / 2, w / 2, -d / 2 + r);
        shape.lineTo(w / 2, d / 2 - r);
        shape.quadraticCurveTo(w / 2, d / 2, w / 2 - r, d / 2);
        shape.lineTo(-w / 2 + r, d / 2);
        shape.quadraticCurveTo(-w / 2, d / 2, -w / 2, d / 2 - r);
        shape.lineTo(-w / 2, -d / 2 + r);
        shape.quadraticCurveTo(-w / 2, -d / 2, -w / 2 + r, -d / 2);
        geometry = new THREE.ExtrudeGeometry(shape, {
          depth: size.y,
          bevelEnabled: true,
          bevelSegments: 2,
          bevelSize: 0.018,
          bevelThickness: 0.018,
          curveSegments: 2
        });
        geometry.rotateX(Math.PI / 2);
        geometry.translate(0, size.y / 2, 0);
      } else {
        geometry = new THREE.BoxGeometry(size.x, size.y, size.z);
      }
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.copy(position);
      shadowMesh(mesh);
      scene.add(mesh);
      return mesh;
    }

    function makeTorso() {
      const rings = [
        { y: 2.39, x: 0.18, z: 0.135, cz: -0.015 },
        { y: 2.49, x: 0.235, z: 0.17, cz: 0.000 },
        { y: 2.64, x: 0.25, z: 0.185, cz: 0.030 },
        { y: 2.80, x: 0.27, z: 0.19, cz: 0.065 },
        { y: 2.96, x: 0.31, z: 0.205, cz: 0.105 },
        { y: 3.08, x: 0.275, z: 0.185, cz: 0.135 },
        { y: 3.17, x: 0.155, z: 0.135, cz: 0.155 }
      ];
      const segments = 36;
      const positions = [];
      const indices = [];

      for (const ring of rings) {
        for (let i = 0; i < segments; i++) {
          const angle = i / segments * Math.PI * 2;
          const sideShape = 1 - 0.06 * Math.cos(angle * 2);
          positions.push(
            Math.cos(angle) * ring.x * sideShape,
            ring.y,
            ring.cz + Math.sin(angle) * ring.z
          );
        }
      }

      for (let r = 0; r < rings.length - 1; r++) {
        for (let i = 0; i < segments; i++) {
          const n = (i + 1) % segments;
          const a = r * segments + i;
          const b = r * segments + n;
          const c = (r + 1) * segments + n;
          const d = (r + 1) * segments + i;
          indices.push(a, b, d, b, c, d);
        }
      }

      const bottomCenter = positions.length / 3;
      positions.push(0, rings[0].y, rings[0].cz);
      const topCenter = positions.length / 3;
      const top = rings[rings.length - 1];
      positions.push(0, top.y, top.cz);

      for (let i = 0; i < segments; i++) {
        const n = (i + 1) % segments;
        indices.push(bottomCenter, n, i);
        const base = (rings.length - 1) * segments;
        indices.push(topCenter, base + i, base + n);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      const torso = new THREE.Mesh(geometry, bronze);
      shadowMesh(torso);
      scene.add(torso);
      return torso;
    }

    const ground = new THREE.Mesh(new THREE.CircleGeometry(26, 96), grassMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.035;
    ground.receiveShadow = true;
    scene.add(ground);

    const path = new THREE.Mesh(new THREE.RingGeometry(6.2, 8.5, 96), pathMat);
    path.rotation.x = -Math.PI / 2;
    path.position.y = -0.018;
    path.receiveShadow = true;
    scene.add(path);

    const innerLawn = new THREE.Mesh(
      new THREE.CircleGeometry(5.7, 64),
      new THREE.MeshStandardMaterial({ color: 0x607d4b, roughness: 1 })
    );
    innerLawn.rotation.x = -Math.PI / 2;
    innerLawn.position.y = -0.008;
    innerLawn.receiveShadow = true;
    scene.add(innerLawn);

    box(new THREE.Vector3(2.18, 0.16, 1.74), new THREE.Vector3(0, 0.08, 0), stoneDark, true);
    box(new THREE.Vector3(1.88, 0.16, 1.48), new THREE.Vector3(0, 0.23, 0), stone, true);
    box(new THREE.Vector3(1.58, 0.68, 1.18), new THREE.Vector3(0, 0.64, 0), stone, true);
    box(new THREE.Vector3(1.76, 0.15, 1.35), new THREE.Vector3(0, 1.055, 0), stoneDark, true);
    box(new THREE.Vector3(1.64, 0.11, 1.25), new THREE.Vector3(0, 1.18, 0), stone, true);

    const plaque = box(
      new THREE.Vector3(0.78, 0.34, 0.025),
      new THREE.Vector3(0, 0.66, 0.606),
      plaqueMat,
      true
    );
    plaque.rotation.x = -0.01;

    for (let i = 0; i < 3; i++) {
      const line = box(
        new THREE.Vector3(0.48 - i * 0.055, 0.018, 0.012),
        new THREE.Vector3(0, 0.72 - i * 0.064, 0.623),
        bronzeEdge
      );
      line.castShadow = false;
    }

    makeTorso();

    const hipL = new THREE.Vector3(-0.145, 2.46, 0.005);
    const hipR = new THREE.Vector3(0.145, 2.45, -0.015);
    const kneeL = new THREE.Vector3(-0.02, 1.98, 0.43);
    const ankleL = new THREE.Vector3(0.18, 1.60, 0.73);
    const kneeR = new THREE.Vector3(0.18, 1.91, -0.42);
    const ankleR = new THREE.Vector3(0.13, 1.28, -0.66);

    ellipsoid(new THREE.Vector3(0, 2.43, 0), new THREE.Vector3(0.27, 0.22, 0.19));
    limb(hipL, kneeL, 0.145, 0.105);
    joint(kneeL, 0.112);
    limb(kneeL, ankleL, 0.095, 0.066);
    joint(ankleL, 0.072);

    limb(hipR, kneeR, 0.148, 0.106);
    joint(kneeR, 0.112);
    limb(kneeR, ankleR, 0.096, 0.068);
    joint(ankleR, 0.073);

    const forwardFoot = ellipsoid(
      new THREE.Vector3(0.18, 1.54, 0.86),
      new THREE.Vector3(0.105, 0.075, 0.235),
      bronzeDark
    );
    forwardFoot.rotation.x = -0.16;
    forwardFoot.rotation.z = 0.04;

    const rearFoot = ellipsoid(
      new THREE.Vector3(0.13, 1.255, -0.79),
      new THREE.Vector3(0.11, 0.075, 0.245),
      bronzeDark
    );
    rearFoot.rotation.x = 0.11;

    const sole1 = ellipsoid(
      new THREE.Vector3(0.18, 1.49, 0.87),
      new THREE.Vector3(0.112, 0.025, 0.235),
      bronzeEdge
    );
    sole1.rotation.x = -0.16;

    const sole2 = ellipsoid(
      new THREE.Vector3(0.13, 1.215, -0.79),
      new THREE.Vector3(0.116, 0.027, 0.245),
      bronzeEdge
    );
    sole2.rotation.x = 0.11;

    const shoulderL = new THREE.Vector3(-0.315, 3.06, 0.12);
    const elbowL = new THREE.Vector3(-0.43, 2.76, 0.43);
    const wristL = new THREE.Vector3(-0.24, 2.98, 0.66);
    const shoulderR = new THREE.Vector3(0.315, 3.05, 0.12);
    const elbowR = new THREE.Vector3(0.43, 2.72, -0.18);
    const wristR = new THREE.Vector3(0.28, 2.42, -0.43);

    joint(shoulderL, 0.135);
    limb(shoulderL, elbowL, 0.112, 0.083);
    joint(elbowL, 0.088);
    limb(elbowL, wristL, 0.078, 0.058);
    ellipsoid(wristL, new THREE.Vector3(0.072, 0.105, 0.075));

    joint(shoulderR, 0.135);
    limb(shoulderR, elbowR, 0.112, 0.083);
    joint(elbowR, 0.088);
    limb(elbowR, wristR, 0.078, 0.058);
    ellipsoid(wristR, new THREE.Vector3(0.073, 0.108, 0.076));

    const thumbL = ellipsoid(
      new THREE.Vector3(-0.17, 2.96, 0.665),
      new THREE.Vector3(0.03, 0.06, 0.033)
    );
    thumbL.rotation.z = 0.6;
    const thumbR = ellipsoid(
      new THREE.Vector3(0.22, 2.43, -0.40),
      new THREE.Vector3(0.03, 0.06, 0.033)
    );
    thumbR.rotation.z = -0.55;

    const neckBase = new THREE.Vector3(0, 3.19, 0.155);
    const neckTop = new THREE.Vector3(0, 3.34, 0.19);
    limb(neckBase, neckTop, 0.105, 0.095);

    const head = ellipsoid(
      new THREE.Vector3(0, 3.49, 0.225),
      new THREE.Vector3(0.15, 0.205, 0.155)
    );
    head.rotation.x = -0.06;
    head.rotation.z = -0.035;

    ellipsoid(
      new THREE.Vector3(0, 3.58, 0.17),
      new THREE.Vector3(0.154, 0.13, 0.145),
      bronzeDark
    );
    ellipsoid(
      new THREE.Vector3(0, 3.46, 0.374),
      new THREE.Vector3(0.035, 0.055, 0.06),
      bronze
    );
    ellipsoid(
      new THREE.Vector3(-0.151, 3.49, 0.225),
      new THREE.Vector3(0.025, 0.052, 0.035),
      bronze
    );
    ellipsoid(
      new THREE.Vector3(0.151, 3.49, 0.225),
      new THREE.Vector3(0.025, 0.052, 0.035),
      bronze
    );

    const browL = ellipsoid(
      new THREE.Vector3(-0.058, 3.525, 0.355),
      new THREE.Vector3(0.047, 0.012, 0.014),
      bronzeDark,
      16
    );
    browL.rotation.z = -0.08;
    const browR = ellipsoid(
      new THREE.Vector3(0.058, 3.525, 0.355),
      new THREE.Vector3(0.047, 0.012, 0.014),
      bronzeDark,
      16
    );
    browR.rotation.z = 0.08;

    ellipsoid(
      new THREE.Vector3(0, 3.412, 0.351),
      new THREE.Vector3(0.055, 0.017, 0.012),
      bronzeDark,
      16
    );

    const support = limb(
      new THREE.Vector3(0.13, 1.22, -0.72),
      new THREE.Vector3(0.13, 1.235, -0.20),
      0.035,
      0.028,
      bronzeDark,
      12
    );

    function makeTree(x, z, scale, hueShift = 0) {
      const trunkMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(0.075 + hueShift, 0.38, 0.25),
        roughness: 1
      });
      const leafMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(0.27 + hueShift, 0.46, 0.28),
        roughness: 0.95
      });

      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18 * scale, 0.26 * scale, 2.6 * scale, 10),
        trunkMat
      );
      trunk.position.set(x, 1.3 * scale, z);
      shadowMesh(trunk);
      scene.add(trunk);

      const crownPositions = [
        [0, 3.2, 0, 1.25],
        [-0.72, 2.95, 0.1, 0.83],
        [0.67, 3.0, 0.05, 0.92],
        [0.18, 3.35, -0.68, 0.82],
        [-0.15, 3.5, 0.58, 0.79]
      ];

      for (const p of crownPositions) {
        const crown = new THREE.Mesh(
          new THREE.IcosahedronGeometry(p[3] * scale, 2),
          leafMat
        );
        crown.position.set(
          x + p[0] * scale,
          p[1] * scale,
          z + p[2] * scale
        );
        crown.scale.y = 0.86;
        shadowMesh(crown);
        scene.add(crown);
      }
    }

    makeTree(-8.7, -4.8, 1.12, 0.00);
    makeTree(8.2, -5.8, 1.28, 0.015);
    makeTree(-9.5, 6.3, 1.0, -0.015);
    makeTree(9.8, 5.3, 1.15, 0.008);
    makeTree(-3.8, -10.5, 0.95, 0.018);
    makeTree(4.4, -11.2, 1.03, -0.01);

    function makeBench(x, z, rotation) {
      const wood = new THREE.MeshStandardMaterial({
        color: 0x6f452b,
        roughness: 0.72
      });
      const iron = new THREE.MeshStandardMaterial({
        color: 0x252824,
        roughness: 0.42,
        metalness: 0.72
      });
      const group = new THREE.Group();

      for (let i = -1; i <= 1; i++) {
        const slat = new THREE.Mesh(
          new THREE.BoxGeometry(1.65, 0.075, 0.18),
          wood
        );
        slat.position.set(0, 0.54, i * 0.19);
        shadowMesh(slat);
        group.add(slat);
      }

      for (let i = 0; i < 3; i++) {
        const back = new THREE.Mesh(
          new THREE.BoxGeometry(1.65, 0.11, 0.075),
          wood
        );
        back.position.set(0, 0.76 + i * 0.16, -0.31);
        back.rotation.x = -0.1;
        shadowMesh(back);
        group.add(back);
      }

      for (const side of [-0.64, 0.64]) {
        const leg = new THREE.Mesh(
          new THREE.BoxGeometry(0.075, 0.55, 0.075),
          iron
        );
        leg.position.set(side, 0.275, 0);
        shadowMesh(leg);
        group.add(leg);

        const backLeg = new THREE.Mesh(
          new THREE.BoxGeometry(0.065, 1.0, 0.065),
          iron
        );
        backLeg.position.set(side, 0.5, -0.3);
        backLeg.rotation.x = -0.1;
        shadowMesh(backLeg);
        group.add(backLeg);
      }

      group.position.set(x, 0, z);
      group.rotation.y = rotation;
      scene.add(group);
    }

    makeBench(-6.7, 1.0, Math.PI * 0.46);
    makeBench(6.5, -1.5, -Math.PI * 0.52);

    const shrubMat = new THREE.MeshStandardMaterial({
      color: 0x3c5d38,
      roughness: 1
    });
    for (let i = 0; i < 18; i++) {
      const angle = i / 18 * Math.PI * 2 + 0.14;
      const radius = 4.8 + 0.18 * Math.sin(i * 2.7);
      const shrub = new THREE.Mesh(
        new THREE.IcosahedronGeometry(0.32 + 0.07 * Math.sin(i), 1),
        shrubMat
      );
      shrub.position.set(
        Math.cos(angle) * radius,
        0.27,
        Math.sin(angle) * radius
      );
      shrub.scale.set(1.15, 0.8, 0.95);
      shadowMesh(shrub);
      scene.add(shrub);
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsed = clock.getElapsedTime();
      sun.intensity = 4.15 + Math.sin(elapsed * 0.16) * 0.04;
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
