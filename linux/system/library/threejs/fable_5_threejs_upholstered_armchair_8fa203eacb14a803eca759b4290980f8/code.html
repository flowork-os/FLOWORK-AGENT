<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upholstered Armchair</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e8e6e2; }
  canvas { display: block; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e6e2);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(2.6, 1.7, 3.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

// ---------- Lighting ----------
scene.add(new THREE.HemisphereLight(0xf4f1ec, 0x8f8a82, 0.55));

const key = new THREE.DirectionalLight(0xfff4e6, 1.6);
key.position.set(4, 6, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -3; key.shadow.camera.right = 3;
key.shadow.camera.top = 3;   key.shadow.camera.bottom = -3;
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0xdfe8f0, 0.5);
fill.position.set(-4, 3, -2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 0.35);
rim.position.set(0, 4, -5);
scene.add(rim);

// ---------- Ground (soft shadow catcher) ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(6, 64),
  new THREE.ShadowMaterial({ opacity: 0.22 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const disc = new THREE.Mesh(
  new THREE.CircleGeometry(2.4, 64),
  new THREE.MeshStandardMaterial({ color: 0xdedad4, roughness: 0.95, metalness: 0 })
);
disc.rotation.x = -Math.PI / 2;
disc.position.y = -0.002;
disc.receiveShadow = true;
scene.add(disc);

// ---------- Fabric texture (subtle weave) ----------
function fabricTexture(base, dark) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = base;
  g.fillRect(0, 0, 256, 256);
  g.strokeStyle = dark;
  g.globalAlpha = 0.12;
  for (let i = 0; i < 256; i += 3) {
    g.beginPath(); g.moveTo(0, i); g.lineTo(256, i); g.stroke();
    g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 256); g.stroke();
  }
  g.globalAlpha = 0.06;
  for (let i = 0; i < 900; i++) {
    g.fillStyle = Math.random() > 0.5 ? '#ffffff' : dark;
    g.fillRect(Math.random() * 256, Math.random() * 256, 1.4, 1.4);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(3, 3);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const fabricMat = new THREE.MeshStandardMaterial({
  map: fabricTexture('#9a978c', '#6f6c62'),
  roughness: 0.92,
  metalness: 0
});
const pipingMat = new THREE.MeshStandardMaterial({
  color: 0x7b786d,
  roughness: 0.7,
  metalness: 0
});
const woodMat = new THREE.MeshStandardMaterial({
  color: 0x3a2a1e,
  roughness: 0.45,
  metalness: 0.05
});

// ---------- Chair ----------
const chair = new THREE.Group();
scene.add(chair);

function box(w, h, d, r, mat, segs = 4) {
  // rounded box via extruded rounded rect (depth axis = z)
  const shape = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  shape.moveTo(x + r, y);
  shape.lineTo(x + w - r, y);
  shape.quadraticCurveTo(x + w, y, x + w, y + r);
  shape.lineTo(x + w, y + h - r);
  shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  shape.lineTo(x + r, y + h);
  shape.quadraticCurveTo(x, y + h, x, y + h - r);
  shape.lineTo(x, y + r);
  shape.quadraticCurveTo(x, y, x + r, y);
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: d - r * 2, bevelEnabled: true, bevelThickness: r, bevelSize: r * 0.98,
    bevelSegments: segs, curveSegments: segs * 2
  });
  geo.translate(0, 0, -(d - r * 2) / 2);
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}

function piping(w, d, y, r = 0.014) {
  // rounded-rectangle torus following cushion edge
  const hw = w / 2, hd = d / 2, cr = Math.min(hw, hd) * 0.35;
  const pts = [];
  const seg = 10;
  function corner(cx, cz, a0) {
    for (let i = 0; i <= seg; i++) {
      const a = a0 + (i / seg) * (Math.PI / 2);
      pts.push(new THREE.Vector3(cx + cr * Math.cos(a), 0, cz + cr * Math.sin(a)));
    }
  }
  corner(hw - cr, hd - cr, 0);
  corner(-hw + cr, hd - cr, Math.PI / 2);
  corner(-hw + cr, -hd + cr, Math.PI);
  corner(hw - cr, -hd + cr, Math.PI * 1.5);
  const curve = new THREE.CatmullRomCurve3(pts, true);
  const geo = new THREE.TubeGeometry(curve, 140, r, 10, true);
  const m = new THREE.Mesh(geo, pipingMat);
  m.position.y = y;
  m.castShadow = true;
  return m;
}

// Dimensions
const seatW = 1.0, seatD = 0.95;
const armW = 0.24, armH = 0.62, armTopR = 0.115;
const baseH = 0.28, baseY = 0.18; // base bottom at legs top

// Base frame (under seat cushion)
const base = box(seatW + armW * 2, baseH, seatD, 0.05, fabricMat);
base.position.y = baseY + baseH / 2;
chair.add(base);
chair.add(piping(seatW + armW * 2 - 0.02, seatD - 0.02, baseY + baseH - 0.015));

// Seat cushion
const seatCushH = 0.17;
const seat = box(seatW - 0.02, seatCushH, seatD - 0.06, 0.055, fabricMat);
seat.position.set(0, baseY + baseH + seatCushH / 2 - 0.01, 0.01);
chair.add(seat);
chair.add(piping(seatW - 0.04, seatD - 0.08, seat.position.y + seatCushH / 2 - 0.028, 0.013));
chair.add(piping(seatW - 0.04, seatD - 0.08, seat.position.y - seatCushH / 2 + 0.028, 0.013));

// Back frame (slightly reclined)
const backFrame = box(seatW + armW * 2, 0.85, 0.22, 0.06, fabricMat);
backFrame.position.set(0, baseY + 0.62, -seatD / 2 + 0.06);
backFrame.rotation.x = -0.1;
chair.add(backFrame);

// Back cushion
const backCush = box(seatW - 0.04, 0.62, 0.15, 0.055, fabricMat);
backCush.position.set(0, baseY + 0.66, -seatD / 2 + 0.235);
backCush.rotation.x = -0.1;
chair.add(backCush);
const bp1 = piping(seatW - 0.06, 0.13, 0, 0.013);
bp1.rotation.x = Math.PI / 2 - 0.1;
bp1.position.set(0, backCush.position.y + 0.31 * Math.cos(0.1) - 0.03, backCush.position.z + 0.31 * Math.sin(0.1) + 0.003);
chair.add(bp1);
const bp2 = piping(seatW - 0.06, 0.13, 0, 0.013);
bp2.rotation.x = Math.PI / 2 - 0.1;
bp2.position.set(0, backCush.position.y - 0.31 * Math.cos(0.1) + 0.03, backCush.position.z - 0.31 * Math.sin(0.1) - 0.003);
chair.add(bp2);

// Rolled armrests
function armrest(side) {
  const g = new THREE.Group();
  const x = side * (seatW / 2 + armW / 2);
  // vertical padded panel
  const panel = box(armW, armH - armTopR, seatD, 0.05, fabricMat);
  panel.position.set(x, baseY + (armH - armTopR) / 2, 0);
  g.add(panel);
  // rolled top (cylinder along depth)
  const rollLen = seatD - 0.10;
  const roll = new THREE.Mesh(
    new THREE.CylinderGeometry(armTopR, armTopR, rollLen, 32, 1),
    fabricMat
  );
  roll.rotation.x = Math.PI / 2;
  roll.position.set(x, baseY + armH - armTopR * 0.5, 0);
  roll.castShadow = roll.receiveShadow = true;
  g.add(roll);
  // rounded front cap of the roll
  const capF = new THREE.Mesh(new THREE.SphereGeometry(armTopR, 24, 16), fabricMat);
  capF.position.set(x, roll.position.y, rollLen / 2);
  capF.castShadow = true;
  g.add(capF);
  const capB = capF.clone();
  capB.position.z = -rollLen / 2;
  g.add(capB);
  // piping seam along the roll (two lines where roll meets panel)
  for (const s of [-1, 1]) {
    const seam = new THREE.Mesh(
      new THREE.CylinderGeometry(0.011, 0.011, rollLen + 0.02, 8),
      pipingMat
    );
    seam.rotation.x = Math.PI / 2;
    seam.position.set(x + s * armTopR * 0.92, roll.position.y - armTopR * 0.35, 0);
    seam.castShadow = true;
    g.add(seam);
  }
  return g;
}
chair.add(armrest(-1), armrest(1));

// Legs (short, dark wood, slightly tapered & splayed)
function leg(x, z) {
  const g = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.042, baseY + 0.02, 16), woodMat);
  g.position.set(x, (baseY + 0.02) / 2 - 0.01, z);
  g.rotation.z = -Math.sign(x) * 0.07;
  g.rotation.x = Math.sign(z) * 0.07;
  g.castShadow = g.receiveShadow = true;
  return g;
}
const lx = seatW / 2 + armW - 0.09, lz = seatD / 2 - 0.09;
chair.add(leg(lx, lz), leg(-lx, lz), leg(lx, -lz), leg(-lx, -lz));

// ---------- Controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.62, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.minDistance = 1.8;
controls.maxDistance = 7;
controls.maxPolarAngle = Math.PI / 2 - 0.02;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
