<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chipped Ceramic Coffee Mug</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #d8cbb9; }
    canvas { display: block; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd8cbbb);
scene.fog = new THREE.Fog(0xd8cbbb, 18, 34);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(12.5, 10.5, 15.5);
camera.lookAt(0, 4.2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.target.set(0, 4.25, 0);
controls.minDistance = 10;
controls.maxDistance = 25;
controls.maxPolarAngle = Math.PI * 0.48;

const hemi = new THREE.HemisphereLight(0xfff5e6, 0x6d6259, 2.05);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff1d4, 4.3);
key.position.set(-7, 15, 9);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -13;
key.shadow.camera.right = 13;
key.shadow.camera.top = 16;
key.shadow.camera.bottom = -8;
key.shadow.bias = -0.0004;
scene.add(key);

const fill = new THREE.DirectionalLight(0xb8d5ff, 1.25);
fill.position.set(9, 8, -10);
scene.add(fill);

const ceramic = new THREE.MeshPhysicalMaterial({
  color: 0xf0ede4,
  roughness: 0.24,
  metalness: 0,
  clearcoat: 0.38,
  clearcoatRoughness: 0.18
});

const ceramicDark = new THREE.MeshPhysicalMaterial({
  color: 0xb8a58d,
  roughness: 0.52,
  clearcoat: 0.08
});

const stainMaterial = new THREE.MeshStandardMaterial({
  color: 0x8a5b35,
  roughness: 0.72,
  transparent: true,
  opacity: 0.34,
  side: THREE.DoubleSide
});

const innerCoffee = new THREE.MeshStandardMaterial({
  color: 0x3a2115,
  roughness: 0.32
});

const radialSegments = 128;
const profile = [
  [0.0, 0.16],
  [3.48, 0.16],
  [4.08, 0.29],
  [4.42, 0.62],
  [4.54, 1.05],
  [4.58, 7.95],
  [4.62, 8.48],
  [4.59, 8.82],
  [4.42, 9.00],
  [4.08, 8.98],
  [3.94, 8.78],
  [3.88, 8.30],
  [3.86, 1.42],
  [3.70, 1.02],
  [3.30, 0.72],
  [0.0, 0.68]
];

const mugGeometry = new THREE.LatheGeometry(
  profile.map(p => new THREE.Vector2(p[0], p[1])),
  radialSegments
);

const pos = mugGeometry.attributes.position;
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i);
  const z = pos.getZ(i);
  const y = pos.getY(i);
  if (y > 8.35) {
    const a = Math.atan2(z, x);
    const uneven = 0.035 * Math.sin(a * 3.0 + 0.4) + 0.018 * Math.sin(a * 7.0 - 0.8);
    pos.setY(i, y + uneven);
  }
}
pos.needsUpdate = true;
mugGeometry.computeVertexNormals();

const mug = new THREE.Mesh(mugGeometry, ceramic);
mug.castShadow = true;
mug.receiveShadow = true;
scene.add(mug);

const handleCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(4.16, 7.15, 0),
  new THREE.Vector3(5.20, 7.32, 0),
  new THREE.Vector3(6.65, 6.58, 0),
  new THREE.Vector3(7.20, 5.05, 0),
  new THREE.Vector3(7.12, 3.35, 0),
  new THREE.Vector3(6.38, 1.95, 0),
  new THREE.Vector3(5.12, 1.55, 0),
  new THREE.Vector3(4.18, 1.72, 0)
]);
const handleGeometry = new THREE.TubeGeometry(handleCurve, 96, 0.72, 32, false);
handleGeometry.computeVertexNormals();
const handle = new THREE.Mesh(handleGeometry, ceramic);
handle.castShadow = true;
handle.receiveShadow = true;
scene.add(handle);

const ringGeometry = new THREE.TorusGeometry(3.855, 0.105, 12, 128);
ringGeometry.rotateX(Math.PI / 2);
const teaRing = new THREE.Mesh(ringGeometry, stainMaterial);
teaRing.position.y = 5.45;
teaRing.scale.set(1.0, 1.0, 0.98);
teaRing.castShadow = false;
scene.add(teaRing);

const innerShadeGeometry = new THREE.TorusGeometry(3.79, 0.035, 10, 128);
innerShadeGeometry.rotateX(Math.PI / 2);
const innerShade = new THREE.Mesh(innerShadeGeometry, new THREE.MeshStandardMaterial({
  color: 0x6b4027,
  roughness: 0.8,
  transparent: true,
  opacity: 0.18
}));
innerShade.position.y = 5.50;
scene.add(innerShade);

const coffeeSurface = new THREE.Mesh(
  new THREE.CircleGeometry(3.72, 96),
  innerCoffee
);
coffeeSurface.rotation.x = -Math.PI / 2;
coffeeSurface.position.y = 0.73;
coffeeSurface.receiveShadow = true;
scene.add(coffeeSurface);

function rimPoint(radius, angle, y) {
  return new THREE.Vector3(radius * Math.cos(angle), y, radius * Math.sin(angle));
}

const chipAngle = Math.PI * 0.52;
const chipWidth = 0.19;
const chipInner = 4.02;
const chipOuter = 4.68;

const chipTopVertices = [
  rimPoint(chipInner, chipAngle - chipWidth, 9.015),
  rimPoint(chipOuter, chipAngle - chipWidth * 0.78, 9.005),
  rimPoint(chipOuter + 0.04, chipAngle - chipWidth * 0.18, 8.992),
  rimPoint(chipOuter - 0.02, chipAngle + chipWidth * 0.48, 8.978),
  rimPoint(chipInner + 0.05, chipAngle + chipWidth, 8.99)
];

const chipPositions = [];
for (const v of chipTopVertices) chipPositions.push(v.x, v.y, v.z);
const chipIndices = [0, 1, 2, 0, 2, 3, 0, 3, 4];
const chipGeo = new THREE.BufferGeometry();
chipGeo.setAttribute("position", new THREE.Float32BufferAttribute(chipPositions, 3));
chipGeo.setIndex(chipIndices);
chipGeo.computeVertexNormals();
const chip = new THREE.Mesh(chipGeo, ceramicDark);
chip.castShadow = true;
scene.add(chip);

const chipEdge = new THREE.Mesh(
  new THREE.TorusGeometry(4.38, 0.045, 8, 24, chipWidth * 2.15),
  ceramicDark
);
chipEdge.rotation.x = Math.PI / 2;
chipEdge.rotation.z = chipAngle - chipWidth;
chipEdge.position.y = 8.96;
scene.add(chipEdge);

const fleckMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xe4dfd2,
  roughness: 0.35,
  clearcoat: 0.2
});

function addFleck(angle, radius, y, scale, rotation) {
  const geo = new THREE.TetrahedronGeometry(scale, 0);
  const mesh = new THREE.Mesh(geo, fleckMaterial);
  mesh.position.copy(rimPoint(radius, angle, y));
  mesh.rotation.set(rotation * 0.7, angle, rotation);
  mesh.castShadow = true;
  scene.add(mesh);
}
addFleck(chipAngle - 0.30, 4.72, 8.94, 0.12, 0.7);
addFleck(chipAngle + 0.30, 4.69, 8.91, 0.085, -0.5);
addFleck(chipAngle - 0.46, 4.57, 9.03, 0.06, 1.1);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xb7a38d,
  roughness: 0.78,
  metalness: 0
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(70, 70), floorMaterial);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0;
floor.receiveShadow = true;
scene.add(floor);

const saucerShadow = new THREE.Mesh(
  new THREE.CircleGeometry(6.1, 96),
  new THREE.MeshBasicMaterial({ color: 0x68584c, transparent: true, opacity: 0.13 })
);
saucerShadow.rotation.x = -Math.PI / 2;
saucerShadow.position.y = 0.012;
saucerShadow.scale.set(1.22, 0.72, 1);
scene.add(saucerShadow);

const contactShadow = new THREE.Mesh(
  new THREE.CircleGeometry(4.9, 96),
  new THREE.MeshBasicMaterial({ color: 0x44372f, transparent: true, opacity: 0.15 })
);
contactShadow.rotation.x = -Math.PI / 2;
contactShadow.position.y = 0.018;
contactShadow.scale.set(1.0, 0.52, 1);
scene.add(contactShadow);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  mug.rotation.y = Math.sin(t * 0.18) * 0.018;
  handle.rotation.y = mug.rotation.y;
  teaRing.rotation.y = mug.rotation.y;
  innerShade.rotation.y = mug.rotation.y;
  chip.rotation.y = mug.rotation.y;
  chipEdge.rotation.y = mug.rotation.y;
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
