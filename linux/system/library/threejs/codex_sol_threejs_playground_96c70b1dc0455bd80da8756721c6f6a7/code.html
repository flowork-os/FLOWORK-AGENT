<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Playground</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #bfe8ff; }
    canvas { display: block; }
    .label {
      position: fixed;
      left: 18px;
      top: 16px;
      color: #18324a;
      font: 600 14px/1.4 system-ui, sans-serif;
      letter-spacing: .04em;
      text-shadow: 0 1px 3px rgba(255,255,255,.8);
      pointer-events: none;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div class="label">SUNNY SIDE PLAYGROUND</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xbfe8ff);
    scene.fog = new THREE.Fog(0xbfe8ff, 22, 48);

    const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(11, 8, 13);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.5, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.45;
    controls.minDistance = 8;
    controls.maxDistance = 28;
    controls.maxPolarAngle = Math.PI * 0.47;

    const hemi = new THREE.HemisphereLight(0xe7f7ff, 0x6f5638, 2.0);
    scene.add(hemi);

    const sun = new THREE.DirectionalLight(0xfff1d0, 4.2);
    sun.position.set(-8, 13, 7);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -14;
    sun.shadow.camera.right = 14;
    sun.shadow.camera.top = 14;
    sun.shadow.camera.bottom = -14;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 35;
    sun.shadow.bias = -0.00025;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0x87bfff, 0.65);
    fill.position.set(8, 5, -10);
    scene.add(fill);

    const mats = {
      mulch: new THREE.MeshStandardMaterial({ color: 0xb7773e, roughness: 0.95 }),
      curb: new THREE.MeshStandardMaterial({ color: 0xe6ded0, roughness: 0.8 }),
      grass: new THREE.MeshStandardMaterial({ color: 0x72ad55, roughness: 1 }),
      red: new THREE.MeshStandardMaterial({ color: 0xe6322d, roughness: 0.5 }),
      blue: new THREE.MeshStandardMaterial({ color: 0x1769d2, roughness: 0.45 }),
      yellow: new THREE.MeshStandardMaterial({ color: 0xffc928, roughness: 0.45 }),
      green: new THREE.MeshStandardMaterial({ color: 0x2ca65a, roughness: 0.55 }),
      darkGreen: new THREE.MeshStandardMaterial({ color: 0x177a42, roughness: 0.6 }),
      metal: new THREE.MeshStandardMaterial({ color: 0xd9e2e8, metalness: 0.65, roughness: 0.28 }),
      chain: new THREE.MeshStandardMaterial({ color: 0x5d6670, metalness: 0.8, roughness: 0.25 }),
      rubber: new THREE.MeshStandardMaterial({ color: 0x25313d, roughness: 0.72 }),
      wood: new THREE.MeshStandardMaterial({ color: 0x9a5d2e, roughness: 0.78 })
    };

    function mesh(geometry, material, parent = scene) {
      const object = new THREE.Mesh(geometry, material);
      object.castShadow = true;
      object.receiveShadow = true;
      parent.add(object);
      return object;
    }

    function box(w, h, d, material, x, y, z, parent = scene) {
      const object = mesh(new THREE.BoxGeometry(w, h, d), material, parent);
      object.position.set(x, y, z);
      return object;
    }

    function cylinderBetween(a, b, radius, material, radialSegments = 12, parent = scene) {
      const direction = new THREE.Vector3().subVectors(b, a);
      const length = direction.length();
      const object = mesh(
        new THREE.CylinderGeometry(radius, radius, length, radialSegments),
        material,
        parent
      );
      object.position.copy(a).add(b).multiplyScalar(0.5);
      object.quaternion.setFromUnitVectors(
        new THREE.Vector3(0, 1, 0),
        direction.normalize()
      );
      return object;
    }

    const grass = mesh(new THREE.CircleGeometry(28, 64), mats.grass);
    grass.rotation.x = -Math.PI / 2;
    grass.position.y = -0.22;
    grass.receiveShadow = true;
    grass.castShadow = false;

    const base = mesh(new THREE.BoxGeometry(15.6, 0.28, 10.6), mats.mulch);
    base.position.y = -0.05;

    const curbHeight = 0.32;
    box(16.2, curbHeight, 0.34, mats.curb, 0, 0.11, -5.47);
    box(16.2, curbHeight, 0.34, mats.curb, 0, 0.11, 5.47);
    box(0.34, curbHeight, 10.6, mats.curb, -8.27, 0.11, 0);
    box(0.34, curbHeight, 10.6, mats.curb, 8.27, 0.11, 0);

    const mulchPebbleGeometry = new THREE.IcosahedronGeometry(0.055, 0);
    const mulchPebbleMaterial = new THREE.MeshStandardMaterial({ color: 0x8b522d, roughness: 1 });
    const pebbles = new THREE.InstancedMesh(mulchPebbleGeometry, mulchPebbleMaterial, 260);
    pebbles.castShadow = false;
    pebbles.receiveShadow = true;
    const dummy = new THREE.Object3D();
    let seed = 9137;
    function random() {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    }
    for (let i = 0; i < 260; i++) {
      dummy.position.set((random() - 0.5) * 15.1, 0.115, (random() - 0.5) * 10.1);
      dummy.rotation.set(random() * Math.PI, random() * Math.PI, random() * Math.PI);
      dummy.scale.set(0.7 + random(), 0.35 + random() * 0.45, 0.7 + random());
      dummy.updateMatrix();
      pebbles.setMatrixAt(i, dummy.matrix);
    }
    scene.add(pebbles);

    const tower = new THREE.Group();
    tower.position.set(-3.4, 0, 0.45);
    scene.add(tower);

    const platformHeight = 2.25;
    const postPositions = [
      [-1.05, -0.92], [1.05, -0.92],
      [-1.05, 0.92], [1.05, 0.92]
    ];

    for (const [x, z] of postPositions) {
      box(0.18, 2.85, 0.18, mats.red, x, 1.38, z, tower);
      const foot = mesh(new THREE.CylinderGeometry(0.17, 0.22, 0.14, 16), mats.metal, tower);
      foot.position.set(x, 0.11, z);
    }

    box(2.35, 0.22, 2.05, mats.blue, 0, platformHeight, 0, tower);
    box(2.25, 0.12, 0.12, mats.yellow, 0, 3.05, -0.98, tower);
    box(0.12, 0.8, 0.12, mats.yellow, -1.04, 2.68, -0.98, tower);
    box(0.12, 0.8, 0.12, mats.yellow, 1.04, 2.68, -0.98, tower);
    box(2.25, 0.12, 0.12, mats.yellow, 0, 3.05, 0.98, tower);
    box(0.12, 0.8, 0.12, mats.yellow, -1.04, 2.68, 0.98, tower);
    box(0.12, 0.8, 0.12, mats.yellow, 1.04, 2.68, 0.98, tower);

    box(0.12, 0.72, 0.12, mats.yellow, -1.04, 2.65, 0, tower);
    box(0.12, 0.72, 0.12, mats.yellow, 1.04, 2.65, 0, tower);

    const roofY = 3.88;
    cylinderBetween(
      new THREE.Vector3(-1.28, roofY, -1.08),
      new THREE.Vector3(0, roofY + 0.72, -1.08),
      0.07, mats.darkGreen, 10, tower
    );
    cylinderBetween(
      new THREE.Vector3(0, roofY + 0.72, -1.08),
      new THREE.Vector3(1.28, roofY, -1.08),
      0.07, mats.darkGreen, 10, tower
    );
    cylinderBetween(
      new THREE.Vector3(-1.28, roofY, 1.08),
      new THREE.Vector3(0, roofY + 0.72, 1.08),
      0.07, mats.darkGreen, 10, tower
    );
    cylinderBetween(
      new THREE.Vector3(0, roofY + 0.72, 1.08),
      new THREE.Vector3(1.28, roofY, 1.08),
      0.07, mats.darkGreen, 10, tower
    );

    const roofLeft = box(1.52, 0.10, 2.5, mats.green, -0.61, 4.18, 0, tower);
    roofLeft.rotation.z = -0.51;
    const roofRight = box(1.52, 0.10, 2.5, mats.green, 0.61, 4.18, 0, tower);
    roofRight.rotation.z = 0.51;

    const ladderLeftBottom = new THREE.Vector3(-0.62, 0.18, 2.45);
    const ladderLeftTop = new THREE.Vector3(-0.62, 2.42, 1.02);
    const ladderRightBottom = new THREE.Vector3(0.62, 0.18, 2.45);
    const ladderRightTop = new THREE.Vector3(0.62, 2.42, 1.02);
    cylinderBetween(ladderLeftBottom, ladderLeftTop, 0.075, mats.red, 12, tower);
    cylinderBetween(ladderRightBottom, ladderRightTop, 0.075, mats.red, 12, tower);
    for (let i = 0; i < 6; i++) {
      const t = i / 5;
      const left = ladderLeftBottom.clone().lerp(ladderLeftTop, t);
      const right = ladderRightBottom.clone().lerp(ladderRightTop, t);
      cylinderBetween(left, right, 0.055, mats.yellow, 10, tower);
    }

    function createSlideGeometry() {
      const curve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-1.12, 2.3, 0),
        new THREE.Vector3(-1.65, 2.2, 0),
        new THREE.Vector3(-2.25, 1.68, 0),
        new THREE.Vector3(-2.7, 0.83, 0),
        new THREE.Vector3(-3.15, 0.3, 0),
        new THREE.Vector3(-3.75, 0.22, 0)
      ]);
      const segments = 48;
      const halfWidth = 0.48;
      const thickness = 0.075;
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i <= segments; i++) {
        const t = i / segments;
        const p = curve.getPoint(t);
        positions.push(
          p.x, p.y, p.z - halfWidth,
          p.x, p.y, p.z + halfWidth,
          p.x, p.y - thickness, p.z - halfWidth,
          p.x, p.y - thickness, p.z + halfWidth
        );
        uvs.push(t, 0, t, 1, t, 0, t, 1);
      }

      for (let i = 0; i < segments; i++) {
        const a = i * 4;
        const b = (i + 1) * 4;
        indices.push(
          a, b, a + 1, a + 1, b, b + 1,
          a + 2, a + 3, b + 2, a + 3, b + 3, b + 2,
          a, a + 2, b, a + 2, b + 2, b,
          a + 1, b + 1, a + 3, a + 3, b + 1, b + 3
        );
      }

      indices.push(0, 1, 2, 1, 3, 2);
      const end = segments * 4;
      indices.push(end, end + 2, end + 1, end + 1, end + 2, end + 3);

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return { geometry, curve };
    }

    const slideData = createSlideGeometry();
    mesh(slideData.geometry, mats.yellow, tower);

    for (const side of [-0.55, 0.55]) {
      const points = [];
      for (let i = 0; i <= 48; i++) {
        const p = slideData.curve.getPoint(i / 48);
        points.push(new THREE.Vector3(p.x, p.y + 0.16, side));
      }
      const railCurve = new THREE.CatmullRomCurve3(points);
      mesh(new THREE.TubeGeometry(railCurve, 48, 0.055, 8, false), mats.red, tower);
    }

    const swing = new THREE.Group();
    swing.position.set(3.35, 0, -0.25);
    scene.add(swing);

    const legPoints = [
      [new THREE.Vector3(-2.05, 0.12, -1.3), new THREE.Vector3(-1.55, 3.45, 0)],
      [new THREE.Vector3(-2.05, 0.12, 1.3), new THREE.Vector3(-1.55, 3.45, 0)],
      [new THREE.Vector3(2.05, 0.12, -1.3), new THREE.Vector3(1.55, 3.45, 0)],
      [new THREE.Vector3(2.05, 0.12, 1.3), new THREE.Vector3(1.55, 3.45, 0)]
    ];
    for (const [a, b] of legPoints) {
      cylinderBetween(a, b, 0.105, mats.blue, 14, swing);
      const foot = mesh(new THREE.CylinderGeometry(0.17, 0.22, 0.14, 16), mats.metal, swing);
      foot.position.copy(a);
    }

    cylinderBetween(
      new THREE.Vector3(-1.72, 3.45, 0),
      new THREE.Vector3(1.72, 3.45, 0),
      0.13, mats.red, 16, swing
    );

    function addSwing(x, angle) {
      const assembly = new THREE.Group();
      assembly.position.set(x, 3.35, 0);
      assembly.rotation.x = angle;
      swing.add(assembly);

      for (const z of [-0.34, 0.34]) {
        cylinderBetween(
          new THREE.Vector3(0, 0, z),
          new THREE.Vector3(0, -1.72, z),
          0.018, mats.chain, 8, assembly
        );
        const connector = mesh(new THREE.TorusGeometry(0.055, 0.014, 6, 12), mats.chain, assembly);
        connector.position.set(0, -1.72, z);
        connector.rotation.y = Math.PI / 2;
      }

      const seat = box(0.72, 0.1, 0.82, mats.rubber, 0, -1.78, 0, assembly);
      seat.geometry.translate(0, 0, 0);
    }

    addSwing(-0.75, 0.12);
    addSwing(0.75, -0.1);

    const steppingStones = [
      [6.4, 0.12, 3.5, 0.42],
      [5.55, 0.12, 3.85, 0.36],
      [4.72, 0.12, 4.02, 0.32]
    ];
    for (const [x, y, z, r] of steppingStones) {
      const stone = mesh(new THREE.CylinderGeometry(r, r * 1.08, 0.12, 20), mats.curb);
      stone.position.set(x, y, z);
    }

    const ball = mesh(new THREE.SphereGeometry(0.28, 24, 16), mats.red);
    ball.position.set(0.7, 0.4, 3.75);
    const ballStripe = mesh(
      new THREE.TorusGeometry(0.283, 0.025, 8, 32),
      mats.yellow
    );
    ballStripe.position.copy(ball.position);
    ballStripe.rotation.x = Math.PI / 2;

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      const elapsed = clock.getElapsedTime();
      ball.rotation.y = elapsed * 0.15;
      renderer.render(scene, camera);
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
