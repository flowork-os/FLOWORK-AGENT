<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Old Library Hall</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#08090c}
canvas{display:block}
#title{position:fixed;left:24px;top:20px;color:#d9c6a2;font:11px Georgia,serif;letter-spacing:.28em;text-transform:uppercase;opacity:.72;pointer-events:none}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="title">Old Library Hall · Evening Study</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x090d14);
scene.fog = new THREE.FogExp2(0x0a1018,0.018);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.18;
document.body.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(46,innerWidth/innerHeight,.1,180);
camera.position.set(20,12,25);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=.045;
controls.autoRotate=true;
controls.autoRotateSpeed=.32;
controls.target.set(0,5,-2);
controls.minDistance=12;
controls.maxDistance=48;
controls.maxPolarAngle=Math.PI*.48;

let seed=734923;
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function range(a,b){return a+(b-a)*rnd()}
function pick(a){return a[Math.floor(rnd()*a.length)]}

const C={
  floor:0x211d1a, wood:0x33251d, darkWood:0x1c1715,
  trim:0x553c29, brass:0xb88743, green:0x27453c,
  leather:0x5a3026, red:0x6a2925, navy:0x22364b,
  paper:0xb9a981, wall:0x2c3035, stone:0x67605a,
  gold:0xd7af61, glass:0x9bc4c2
};
const mats={};
function mat(name,color,rough=.72,metal=0){
  mats[name]=new THREE.MeshStandardMaterial({color,roughness:rough,metalness:metal});
  return mats[name];
}
mat("floor",C.floor,.94);
mat("wood",C.wood,.78);
mat("darkWood",C.darkWood,.86);
mat("trim",C.trim,.68);
mat("brass",C.brass,.3,.72);
mat("green",C.green,.6);
mat("leather",C.leather,.76);
mat("red",C.red,.68);
mat("navy",C.navy,.65);
mat("paper",C.paper,.9);
mat("wall",C.wall,.96);
mat("stone",C.stone,.88);
mat("gold",C.gold,.38,.35);
mat("glass",C.glass,.17,.08);
mat("black",0x0a0b0d,.48);
mat("lampShade",0x6c5b36,.8);
mat("rug",0x3a2020,.98);

function box(w,h,d,material,x=0,y=0,z=0){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m;
}
function cyl(r,h,material,x=0,y=0,z=0,radial=16){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,radial),material);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m;
}
function sphere(r,material,x=0,y=0,z=0){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,14),material);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;return m;
}
function torus(R,r,material,x=0,y=0,z=0,rx=0){
  const m=new THREE.Mesh(new THREE.TorusGeometry(R,r,10,32),material);
  m.position.set(x,y,z);m.rotation.x=rx;m.castShadow=true;return m;
}

const hall=new THREE.Group();scene.add(hall);
hall.add(box(42,.45,34,mats.floor,0,-.25,-2));
hall.add(box(42,16,.5,mats.wall,0,7,-18));
hall.add(box(.5,16,34,mats.wall,-21,7,-2));
hall.add(box(.5,16,34,mats.wall,21,7,-2));
hall.add(box(42,.45,34,mats.darkWood,0,15.9,-2));

const floorRug=box(19,.035,24,mats.rug,0,.01,1);
hall.add(floorRug);
for(let z=-10;z<13;z+=5){
  hall.add(box(19,.04,.09,mats.gold,0,.045,z));
}
for(let x=-8;x<9;x+=4){
  hall.add(box(.07,.04,24,mats.gold,x,.045,1));
}

function cornice(z){
  hall.add(box(42,.28,.42,mats.trim,0,z,-17.65));
  hall.add(box(.42,.28,34,mats.trim,-20.65,z,-2));
  hall.add(box(.42,.28,34,mats.trim,20.65,z,-2));
}
cornice(14.9);cornice(15.55);

function archWindow(x,z){
  const g=new THREE.Group();g.position.set(x,7.2,z);
  const frame=mats.trim;
  g.add(box(3.5,8,.28,frame,0,0,0));
  g.add(box(4.2,.38,.35,frame,0,4.0,0));
  g.add(box(4.2,.38,.35,frame,0,-4.0,0));
  const arch=new THREE.Mesh(new THREE.CylinderGeometry(2.1,2.1,.35,32,1,false,0,Math.PI),frame);
  arch.rotation.z=Math.PI/2;arch.position.set(0,3.95,0);g.add(arch);
  const pane=new THREE.Mesh(new THREE.ShapeGeometry((()=>{const s=new THREE.Shape();s.moveTo(-1.7,-3.7);s.lineTo(1.7,-3.7);s.lineTo(1.7,3.1);s.absarc(0,3.1,1.7,0,Math.PI,false);s.lineTo(-1.7,-3.7);return s})()),mats.glass);
  pane.position.z=-.17;g.add(pane);
  for(const px of [-.65,0,.65])g.add(box(.07,7.2,.18,mats.brass,px,.1,.05));
  g.add(box(3.5,.07,.18,mats.brass,0,.25,.05));
  const glow=new THREE.PointLight(0x78a1b6,.35,13);glow.position.set(0,1,-.4);g.add(glow);
  hall.add(g);
}
[-15,-8,8,15].forEach(x=>archWindow(x,-17.3));

function shelf(x,z,side=1){
  const g=new THREE.Group();g.position.set(x,0,z);
  g.add(box(4.4,11,.55,mats.darkWood,0,5.5,0));
  g.add(box(4.8,.38,.8,mats.trim,0,11.2,0));
  g.add(box(4.8,.28,.8,mats.trim,0,.25,0));
  for(let y=1.35;y<10.8;y+=1.72){
    g.add(box(4.55,.17,.72,mats.trim,0,y,side*.08));
    for(let i=0;i<7;i++){
      const h=range(1.15,1.53),w=range(.27,.48);
      const colors=[mats.red,mats.navy,mats.green,mats.leather,mats.gold];
      const b=box(w,h,.48,pick(colors),-1.85+i*.57,y+h/2+.08,side*.13);
      b.rotation.z=range(-.035,.035);g.add(b);
      if(rnd()>.72)g.add(box(w*.68,.025,.02,mats.gold,-1.85+i*.57,y+h*.55,side*.38));
    }
  }
  g.add(box(.22,10.8,.95,mats.trim,-2.06,5.65,0));
  g.add(box(.22,10.8,.95,mats.trim,2.06,5.65,0));
  hall.add(g);return g;
}
for(const x of [-16,-10,10,16])shelf(x,-13);
for(const x of [-16,-10,10,16])shelf(x,-3);
for(const x of [-16,-10,10,16])shelf(x,7);

function ladder(x,z){
  const g=new THREE.Group();g.position.set(x,0,z);
  const railA=new THREE.Mesh(new THREE.CylinderGeometry(.105,.105,9.7,12),mats.brass);
  railA.position.set(-1.22,5.0,0);railA.rotation.z=-.1;
  const railB=railA.clone();railB.position.x=1.22;g.add(railA,railB);
  for(let i=0;i<7;i++)g.add(box(2.35,.13,.22,mats.brass,-.02,1.0+i*1.28,.05));
  g.rotation.y=.02;hall.add(g);return g;
}
ladder(-13,-12);ladder(13,-2);ladder(-13,8);

function desk(x,z){
  const g=new THREE.Group();g.position.set(x,0,z);
  g.add(box(7,.35,2.1,mats.wood,0,4.25,0));
  for(const px of [-2.75,2.75])for(const pz of [-.68,.68])g.add(box(.27,4.2,.27,mats.darkWood,px,2.05,pz));
  g.add(box(6.3,.18,1.55,mats.leather,0,4.47,0));
  const chair=box(1.6,2,.55,mats.wood,0,1.15,1.9);
  chair.add(box(1.35,1.45,.15,mats.leather,0,1.0,-.27));g.add(chair);
  for(const px of [-2.2,2.2]){
    const lamp=bankerLamp(px,4.9,-.1);g.add(lamp);
  }
  const book=box(1.25,.12,.9,mats.paper,-.4,4.65,.15);book.rotation.y=range(-.3,.3);g.add(book);
  g.add(box(.08,.02,.72,mats.red,.25,4.73,.15));
  hall.add(g);return g;
}
desk(-4,-5);desk(4,3);

function bankerLamp(x,y,z){
  const g=new THREE.Group();g.position.set(x,y,z);
  g.add(cyl(.16,.08,mats.brass,0,0,0));
  g.add(cyl(.055,.58,mats.brass,0,.3,0));
  const shade=new THREE.Mesh(new THREE.CylinderGeometry(.48,.33,.35,20,1),mats.green);
  shade.position.y=.62;g.add(shade);
  const bulb=new THREE.PointLight(0xffc76b,1.15,4.8,.8);bulb.position.y=.55;g.add(bulb);
  return g;
}

function atlas(x,z){
  const g=new THREE.Group();g.position.set(x,4.72,z);
  const left=box(1.25,.06,1.45,mats.paper,-.63,0,0);left.rotation.z=-.12;
  const right=box(1.25,.06,1.45,mats.paper,.63,0,0);right.rotation.z=.12;
  g.add(left,right,box(.05,.08,1.48,mats.leather,0,.02,0));
  for(const px of [-.85,-.42,.42,.85])g.add(box(.025,.01,1.1,mats.red,px,0.04,0));
  hall.add(g);
}
atlas(-2.8,-5);

function pile(x,y,z,n=5){
  const g=new THREE.Group();g.position.set(x,y,z);
  for(let i=0;i<n;i++){
    const b=box(range(1.0,1.8),.22,range(.75,1.25),pick([mats.red,mats.navy,mats.green,mats.leather]),range(-.22,.22),i*.25,range(-.14,.14));
    b.rotation.y=range(-.25,.25);g.add(b);
  }
  hall.add(g);
}
pile(-8,.1,-9,6);pile(7,.1,-1,4);pile(9,.1,8,5);

function globe(x,z){
  const g=new THREE.Group();g.position.set(x,0,z);
  g.add(cyl(1.45,.24,mats.wood,0,.25,0,24));
  g.add(cyl(.13,2.6,mats.brass,0,1.55,0));
  const earth=sphere(1.12,mats.navy,0,2.85,0);
  earth.material=new THREE.MeshStandardMaterial({color:0x28495a,roughness:.7});
  g.add(earth);
  for(let i=0;i<5;i++){
    const ring=torus(1.13,.025,mats.green,0,2.85,0);
    ring.rotation.set(range(-.9,.9),range(-.9,.9),range(-.9,.9));g.add(ring);
  }
  const arc=torus(1.48,.06,mats.brass,0,2.85,0);
  arc.rotation.x=Math.PI/2;g.add(arc);
  g.userData.spin=earth;hall.add(g);return g;
}
const globeObj=globe(-8,5);

function staircase(){
  const g=new THREE.Group();g.position.set(12,0,10);
  g.add(cyl(1.9,.5,mats.wood,0,.25,0,32));
  for(let i=0;i<19;i++){
    const a=i*.48,r=1.35;
    const step=box(2.5,.28,.85,mats.wood,Math.cos(a)*r,1.0+i*.54,Math.sin(a)*r);
    step.rotation.y=-a+.25;g.add(step);
  }
  const post=cyl(.16,11,mats.darkWood,0,5.65,0);
  g.add(post);
  const rail=new THREE.Mesh(new THREE.TorusGeometry(1.55, .09,10,64),mats.brass);
  rail.scale.y=3.1;rail.rotation.x=Math.PI/2;rail.position.y=6.0;g.add(rail);
  const upper=box(7,.32,5.6,mats.wood,1.5,11.0,-1.8);g.add(upper);
  g.add(box(7,.35,.22,mats.brass,1.5,11.45,-4.55));
  g.add(box(.22,.9,5.6,mats.brass,-1.85,11.55,-1.8));
  for(let i=-1;i<5;i++)g.add(cyl(.07,.9,mats.brass,-1.7+i*1.35,11.55,-4.55));
  hall.add(g);return g;
}
const stairs=staircase();

function chandelier(){
  const g=new THREE.Group();g.position.set(0,13.6,-4);
  g.add(cyl(.13,2.4,mats.brass,0,-1.2,0));
  g.add(torus(2.0,.12,mats.brass,0,-2.3,0,Math.PI/2));
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    const arm=box(1.7,.08,.08,mats.brass,Math.cos(a)*.85,-2.3,Math.sin(a)*.85);
    arm.rotation.y=a;g.add(arm);
    const light=new THREE.PointLight(0xffbd69,.6,8);light.position.set(Math.cos(a)*1.65,-2.4,Math.sin(a)*1.65);g.add(light);
    g.add(sphere(.16,mats.gold,Math.cos(a)*1.65,-2.34,Math.sin(a)*1.65));
  }
  hall.add(g);return g;
}
const chandelierObj=chandelier();

const dustGroup=new THREE.Group();scene.add(dustGroup);
const dustMat=new THREE.MeshBasicMaterial({color:0xd2bd8e,transparent:true,opacity:.48});
for(let i=0;i<130;i++){
  const p=sphere(range(.025,.065),dustMat,range(-18,18),range(1,14),range(-16,13));
  p.castShadow=false;dustGroup.add(p);
}
const particles=dustGroup.children;

const ambient=new THREE.HemisphereLight(0x536477,0x120d0a,.48);scene.add(ambient);
const moon=new THREE.DirectionalLight(0x91acc8,1.15);
moon.position.set(-12,18,12);moon.target.position.set(0,4,-4);
moon.castShadow=true;moon.shadow.mapSize.set(2048,2048);
moon.shadow.camera.left=-25;moon.shadow.camera.right=25;
moon.shadow.camera.top=25;moon.shadow.camera.bottom=-15;
scene.add(moon,moon.target);

const sunset=new THREE.DirectionalLight(0xd48758,2.1);
sunset.position.set(-18,10,-25);sunset.target.position.set(0,3,0);
sunset.castShadow=true;sunset.shadow.mapSize.set(1024,1024);
sunset.shadow.camera.left=-22;sunset.shadow.camera.right=22;
sunset.shadow.camera.top=18;sunset.shadow.camera.bottom=-8;
scene.add(sunset,sunset.target);

const pools=new THREE.Group();scene.add(pools);
for(const x of [-15,-8,8,15]){
  const light=new THREE.SpotLight(0xd78d5b,.75,28,Math.PI/8,.65,1.2);
  light.position.set(x,8,-13);light.target.position.set(x*.7,0,0);
  light.castShadow=true;pools.add(light,light.target);
}

function windowResize(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
}
addEventListener("resize",windowResize);

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  controls.update();
  globeObj.userData.spin.rotation.y=t*.18;
  stairs.rotation.y=Math.sin(t*.18)*.012;
  chandelierObj.rotation.z=Math.sin(t*.7)*.018;
  chandelierObj.position.y=13.6+Math.sin(t*.55)*.06;
  particles.forEach((p,i)=>{
    p.position.y+=.0025+((i%5)*.0005);
    p.position.x+=Math.sin(t*.35+i)*.0007;
    if(p.position.y>15)p.position.y=.8;
  });
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
