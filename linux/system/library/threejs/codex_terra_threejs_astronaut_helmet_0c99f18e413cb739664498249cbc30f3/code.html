<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Astronaut Helmet</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#070a10}
  canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a10);
scene.fog = new THREE.Fog(0x070a10, 9, 22);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.1, 2.65, 7.4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;
controls.minDistance = 4.5;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.49;

const white = new THREE.MeshStandardMaterial({ color: 0xdfe5e8, roughness: 0.42, metalness: 0.08 });
const whiteDark = new THREE.MeshStandardMaterial({ color: 0xaeb8be, roughness: 0.35, metalness: 0.2 });
const charcoal = new THREE.MeshStandardMaterial({ color: 0x11171c, roughness: 0.28, metalness: 0.72 });
const metal = new THREE.MeshStandardMaterial({ color: 0x7f929b, roughness: 0.22, metalness: 0.92 });
const darkMetal = new THREE.MeshStandardMaterial({ color: 0x28353d, roughness: 0.2, metalness: 0.9 });
const gold = new THREE.MeshStandardMaterial({
  color: 0xdba942, metalness: 0.98, roughness: 0.12,
  envMapIntensity: 2.2
});
const goldDark = new THREE.MeshStandardMaterial({ color: 0x5b3811, metalness: 0.9, roughness: 0.2 });
const red = new THREE.MeshStandardMaterial({ color: 0xd72d27, emissive: 0x370000, roughness: 0.3, metalness: 0.25 });
const cyan = new THREE.MeshStandardMaterial({ color: 0x7dd8e9, emissive: 0x18616f, emissiveIntensity: 1.8, roughness: 0.18, metalness: 0.3 });

function mesh(geometry, material, position, rotation = [0, 0, 0]) {
  const object = new THREE.Mesh(geometry, material);
  object.position.set(...position);
  object.rotation.set(...rotation);
  object.castShadow = true;
  object.receiveShadow = true;
  return object;
}

function cylinderBetween(parent, a, b, radius, material, radial = 16) {
  const start = new THREE.Vector3(...a);
  const end = new THREE.Vector3(...b);
  const direction = new THREE.Vector3().subVectors(end, start);
  const item = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, direction.length(), radial), material);
  item.position.copy(start).add(end).multiplyScalar(0.5);
  item.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  item.castShadow = true;
  parent.add(item);
  return item;
}

const helmet = new THREE.Group();
helmet.position.y = 0.3;
scene.add(helmet);

const shell = mesh(new THREE.SphereGeometry(1.72, 64, 40, 0, Math.PI * 2, 0, Math.PI * 0.83), white, [0, 1.63, 0]);
shell.scale.set(1, 1.03, 0.96);
helmet.add(shell);

const lowerShell = mesh(new THREE.CylinderGeometry(1.44, 1.2, 0.72, 64, 1, true), white, [0, 0.72, 0]);
helmet.add(lowerShell);

const chin = mesh(new THREE.SphereGeometry(1, 40, 24), white, [0, 0.45, 0.72]);
chin.scale.set(1.16, 0.7, 0.56);
helmet.add(chin);

const visorFrame = mesh(new THREE.SphereGeometry(1.57, 64, 32, -1.14, 2.28, 0.23, 1.19), charcoal, [0, 1.56, 0.16]);
visorFrame.scale.set(1, 0.93, 0.86);
helmet.add(visorFrame);

const visor = mesh(new THREE.SphereGeometry(1.54, 64, 32, -1.055, 2.11, 0.29, 1.04), gold, [0, 1.57, 0.22]);
visor.scale.set(1, 0.92, 0.855);
helmet.add(visor);

const visorHighlight = mesh(new THREE.SphereGeometry(1.557, 48, 16, -0.88, 0.66, 0.38, 0.64), new THREE.MeshStandardMaterial({
  color: 0xffe59a, metalness: 0.95, roughness: 0.06, transparent: true, opacity: 0.52
}), [0, 1.58, 0.225]);
visorHighlight.scale.set(1, 0.92, 0.858);
helmet.add(visorHighlight);

const brow = mesh(new THREE.TorusGeometry(1.5, 0.075, 12, 56, 2.28), whiteDark, [0, 2.27, 0.16], [Math.PI * 0.5, 0, 0]);
brow.scale.set(1, 0.74, 1);
helmet.add(brow);

const neckBase = mesh(new THREE.CylinderGeometry(1.26, 1.34, 0.43, 64), darkMetal, [0, 0.18, 0]);
helmet.add(neckBase);
const neckRing1 = mesh(new THREE.TorusGeometry(1.28, 0.09, 12, 64), metal, [0, 0.38, 0], [Math.PI * 0.5, 0, 0]);
const neckRing2 = mesh(new THREE.TorusGeometry(1.34, 0.06, 10, 64), charcoal, [0, 0.12, 0], [Math.PI * 0.5, 0, 0]);
helmet.add(neckRing1, neckRing2);

for (let i = 0; i < 20; i++) {
  const angle = i / 20 * Math.PI * 2;
  const rivet = mesh(new THREE.SphereGeometry(0.045, 12, 8), metal, [1.31 * Math.cos(angle), 0.41, 1.31 * Math.sin(angle)]);
  helmet.add(rivet);
}

const leftModule = new THREE.Group();
leftModule.position.set(-1.55, 1.26, 0.02);
leftModule.rotation.z = -0.18;
helmet.add(leftModule);
leftModule.add(mesh(new THREE.CylinderGeometry(0.31, 0.37, 0.48, 24), whiteDark, [0, 0, 0], [0, 0, Math.PI * 0.5]));
leftModule.add(mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.12, 24), charcoal, [-0.29, 0, 0], [0, 0, Math.PI * 0.5]));
leftModule.add(mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.14, 20), cyan, [-0.39, 0, 0], [0, 0, Math.PI * 0.5]));
leftModule.add(mesh(new THREE.BoxGeometry(0.28, 0.48, 0.5), white, [0.08, 0.12, 0]));

const rightModule = new THREE.Group();
rightModule.position.set(1.56, 1.28, 0.04);
rightModule.rotation.z = 0.18;
helmet.add(rightModule);
rightModule.add(mesh(new THREE.CylinderGeometry(0.33, 0.38, 0.5, 24), whiteDark, [0, 0, 0], [0, 0, Math.PI * 0.5]));
rightModule.add(mesh(new THREE.CylinderGeometry(0.23, 0.23, 0.13, 24), charcoal, [0.3, 0, 0], [0, 0, Math.PI * 0.5]));
rightModule.add(mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.15, 20), red, [0.41, 0, 0], [0, 0, Math.PI * 0.5]));
rightModule.add(mesh(new THREE.BoxGeometry(0.29, 0.47, 0.5), white, [-0.08, 0.12, 0]));

const antennaBase = mesh(new THREE.CylinderGeometry(0.17, 0.22, 0.19, 20), darkMetal, [-1.32, 2.55, 0.1], [0.1, 0, -0.45]);
helmet.add(antennaBase);
cylinderBetween(helmet, [-1.38, 2.62, 0.1], [-1.72, 3.28, 0.18], 0.035, metal, 12);
helmet.add(mesh(new THREE.SphereGeometry(0.1, 16, 10), cyan, [-1.72, 3.28, 0.18]));

const panelSeamMaterial = new THREE.MeshStandardMaterial({ color: 0x71818a, roughness: 0.48, metalness: 0.2 });
for (const x of [-0.78, 0.78]) {
  const seam = mesh(new THREE.TorusGeometry(0.73, 0.018, 6, 32, 1.3), panelSeamMaterial, [x, 2.24, -0.2], [0.05, Math.PI * 0.5, x < 0 ? 0.42 : -0.42]);
  helmet.add(seam);
}
for (let i = 0; i < 7; i++) {
  const x = -0.72 + i * 0.24;
  helmet.add(mesh(new THREE.SphereGeometry(0.032, 10, 7), metal, [x, 2.66 - 0.11 * Math.abs(x), 0.78]));
}

const stand = new THREE.Group();
scene.add(stand);
stand.add(mesh(new THREE.CylinderGeometry(1.55, 1.8, 0.19, 64), charcoal, [0, -0.1, 0]));
stand.add(mesh(new THREE.CylinderGeometry(1.3, 1.43, 0.16, 64), metal, [0, 0.06, 0]));
stand.add(mesh(new THREE.CylinderGeometry(0.78, 0.95, 0.44, 48), darkMetal, [0, -0.3, 0]));
stand.add(mesh(new THREE.TorusGeometry(1.48, 0.035, 8, 64), metal, [0, 0.02, 0], [Math.PI * 0.5, 0, 0]));

const floor = mesh(new THREE.CircleGeometry(12, 96), new THREE.MeshStandardMaterial({ color: 0x0d1219, roughness: 0.8, metalness: 0.18 }), [0, -0.53, 0], [-Math.PI * 0.5, 0, 0]);
floor.receiveShadow = true;
scene.add(floor);

const hemi = new THREE.HemisphereLight(0x9ac9e8, 0x111820, 1.35);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2d0, 4.1);
key.position.set(4.5, 6.5, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5;
key.shadow.camera.right = 5;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -5;
scene.add(key);

const rim = new THREE.DirectionalLight(0x75bde4, 3.1);
rim.position.set(-5, 3.8, -4);
scene.add(rim);

const warm = new THREE.PointLight(0xffab45, 28, 8, 2);
warm.position.set(-2.8, 1.8, 3.5);
scene.add(warm);

const cool = new THREE.PointLight(0x77cfff, 22, 7, 2);
cool.position.set(3.5, 3.5, -2.2);
scene.add(cool);

const reflectionBands = new THREE.Group();
scene.add(reflectionBands);
for (let i = 0; i < 4; i++) {
  const band = new THREE.Mesh(
    new THREE.PlaneGeometry(2.2 - i * 0.18, 0.12),
    new THREE.MeshBasicMaterial({ color: i % 2 ? 0x274c65 : 0xffd782, transparent: true, opacity: 0.16, side: THREE.DoubleSide })
  );
  band.position.set(-1.2 + i * 0.75, 2.1 - i * 0.22, 1.66);
  band.rotation.set(-0.14, 0.18, -0.2);
  reflectionBands.add(band);
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  reflectionBands.lookAt(camera.position);
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
