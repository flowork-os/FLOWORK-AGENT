<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inflatable T-Rex</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(circle at 50% 32%, #eef9ff 0%, #cde6ee 48%, #9bb7c2 100%);
    }
    canvas { display: block; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd9edf2);
scene.fog = new THREE.Fog(0xd9edf2, 15, 28);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.1, 100);
camera.position.set(8.4, 5.0, 9.5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.45, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.65;
controls.minDistance = 7;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xf4fcff, 0x54706a, 2.2));

const key = new THREE.DirectionalLight(0xffffff, 4.3);
key.position.set(5, 9, 7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -8;
key.shadow.camera.right = 8;
key.shadow.camera.top = 8;
key.shadow.camera.bottom = -4;
key.shadow.camera.near = 1;
key.shadow.camera.far = 24;
key.shadow.bias = -0.0003;
scene.add(key);

const rim = new THREE.DirectionalLight(0xb8fff0, 2.2);
rim.position.set(-7, 5, -6);
scene.add(rim);

const fill = new THREE.PointLight(0xfff2c7, 55, 18, 2);
fill.position.set(5, 3, -5);
scene.add(fill);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(9, 96),
  new THREE.MeshStandardMaterial({
    color: 0xc2d9dd,
    roughness: 0.88,
    metalness: 0
  })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

const rex = new THREE.Group();
rex.rotation.y = -0.22;
rex.position.y = 0.02;
scene.add(rex);

const vinyl = new THREE.MeshPhysicalMaterial({
  color: 0x8eea19,
  roughness: 0.18,
  metalness: 0,
  clearcoat: 1,
  clearcoatRoughness: 0.12,
  sheen: 0.5,
  sheenColor: new THREE.Color(0xd8ff69),
  specularIntensity: 1,
  specularColor: new THREE.Color(0xffffff)
});

const bellyVinyl = new THREE.MeshPhysicalMaterial({
  color: 0xb7f23a,
  roughness: 0.22,
  clearcoat: 0.9,
  clearcoatRoughness: 0.15
});

const seamMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x70c410,
  roughness: 0.28,
  clearcoat: 0.85,
  clearcoatRoughness: 0.18
});

const darkMaterial = new THREE.MeshPhysicalMaterial({
  color: 0x132013,
  roughness: 0.3,
  clearcoat: 0.5
});

const eyeWhite = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  roughness: 0.18,
  clearcoat: 0.8
});

const toothMaterial = new THREE.MeshPhysicalMaterial({
  color: 0xfff4c9,
  roughness: 0.28,
  clearcoat: 0.5
});

function mesh(geometry, material, parent = rex) {
  const object = new THREE.Mesh(geometry, material);
  object.castShadow = true;
  object.receiveShadow = true;
  parent.add(object);
  return object;
}

function ellipsoid(name, position, scale, material = vinyl, segments = 48) {
  const object = mesh(new THREE.SphereGeometry(1, segments, Math.floor(segments * 0.65)), material);
  object.name = name;
  object.position.copy(position);
  object.scale.copy(scale);
  return object;
}

function capsuleBetween(name, start, end, radius, material = vinyl, radialSegments = 24) {
  const direction = new THREE.Vector3().subVectors(end, start);
  const length = direction.length();
  const geometry = new THREE.CapsuleGeometry(radius, Math.max(0.02, length - radius * 2), 12, radialSegments);
  const object = mesh(geometry, material);
  object.name = name;
  object.position.copy(start).add(end).multiplyScalar(0.5);
  object.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
  return object;
}

function tube(name, points, radius, material, closed = false) {
  const curve = new THREE.CatmullRomCurve3(points, closed, 'catmullrom', 0.45);
  const object = mesh(new THREE.TubeGeometry(curve, 48, radius, 10, closed), material);
  object.name = name;
  return object;
}

function torus(name, position, radius, tubeRadius, scale, rotation, material = seamMaterial, arc = Math.PI * 2) {
  const object = mesh(new THREE.TorusGeometry(radius, tubeRadius, 12, 64, arc), material);
  object.name = name;
  object.position.copy(position);
  object.scale.copy(scale);
  object.rotation.set(rotation.x, rotation.y, rotation.z);
  return object;
}

ellipsoid('plump torso', new THREE.Vector3(-0.15, 2.25, 0), new THREE.Vector3(1.62, 1.48, 1.18));
ellipsoid('soft belly', new THREE.Vector3(0.45, 2.17, 0.91), new THREE.Vector3(0.91, 1.12, 0.22), bellyVinyl, 40);
ellipsoid('chest', new THREE.Vector3(0.92, 2.87, 0), new THREE.Vector3(0.92, 1.15, 0.92));

capsuleBetween(
  'inflated neck',
  new THREE.Vector3(0.78, 3.02, 0),
  new THREE.Vector3(1.55, 3.82, 0),
  0.75
);

ellipsoid('large cartoon head', new THREE.Vector3(1.82, 4.18, 0), new THREE.Vector3(1.18, 0.88, 0.93));
ellipsoid('puffy muzzle', new THREE.Vector3(2.62, 3.91, 0), new THREE.Vector3(0.97, 0.56, 0.79));
ellipsoid('upper snout', new THREE.Vector3(2.68, 4.25, 0), new THREE.Vector3(0.84, 0.42, 0.72));

ellipsoid('left brow', new THREE.Vector3(2.07, 4.75, 0.62), new THREE.Vector3(0.42, 0.25, 0.24));
ellipsoid('right brow', new THREE.Vector3(2.07, 4.75, -0.62), new THREE.Vector3(0.42, 0.25, 0.24));

function addEye(z, mirrored) {
  const white = ellipsoid(
    mirrored ? 'far eye' : 'near eye',
    new THREE.Vector3(2.24, 4.66, z),
    new THREE.Vector3(0.23, 0.28, 0.12),
    eyeWhite,
    32
  );
  white.rotation.y = mirrored ? -0.18 : 0.18;

  const pupil = ellipsoid(
    'pupil',
    new THREE.Vector3(2.35, 4.67, z + (mirrored ? -0.105 : 0.105)),
    new THREE.Vector3(0.085, 0.12, 0.055),
    darkMaterial,
    24
  );
  pupil.rotation.y = mirrored ? -0.18 : 0.18;

  ellipsoid(
    'eye glint',
    new THREE.Vector3(2.39, 4.73, z + (mirrored ? -0.151 : 0.151)),
    new THREE.Vector3(0.022, 0.032, 0.018),
    eyeWhite,
    16
  );
}
addEye(0.72, false);
addEye(-0.72, true);

ellipsoid('near nostril', new THREE.Vector3(3.28, 4.28, 0.43), new THREE.Vector3(0.09, 0.065, 0.045), darkMaterial, 20);
ellipsoid('far nostril', new THREE.Vector3(3.28, 4.28, -0.43), new THREE.Vector3(0.09, 0.065, 0.045), darkMaterial, 20);

tube(
  'cartoon grin',
  [
    new THREE.Vector3(3.28, 3.95, 0.67),
    new THREE.Vector3(2.86, 3.73, 0.79),
    new THREE.Vector3(2.34, 3.70, 0.80),
    new THREE.Vector3(1.92, 3.89, 0.73)
  ],
  0.075,
  darkMaterial
);

for (let i = 0; i < 5; i++) {
  const x = 2.92 - i * 0.22;
  const tooth = mesh(new THREE.ConeGeometry(0.075, 0.21, 16), toothMaterial);
  tooth.position.set(x, 3.76 + Math.sin(i * 0.8) * 0.025, 0.82);
  tooth.rotation.z = Math.PI;
  tooth.rotation.x = -0.11;
}

function addLeg(z, farSide) {
  const sideScale = farSide ? 0.94 : 1;
  capsuleBetween(
    farSide ? 'far thigh' : 'near thigh',
    new THREE.Vector3(-0.28, 1.72, z),
    new THREE.Vector3(-0.13, 0.72, z + 0.03),
    0.57 * sideScale
  );
  ellipsoid(
    farSide ? 'far foot' : 'near foot',
    new THREE.Vector3(0.25, 0.37, z + 0.12),
    new THREE.Vector3(0.84, 0.34, 0.54).multiplyScalar(sideScale)
  );

  for (let i = 0; i < 3; i++) {
    const claw = mesh(new THREE.ConeGeometry(0.095, 0.31, 18), toothMaterial);
    claw.position.set(0.78, 0.34, z - 0.25 + i * 0.25);
    claw.rotation.z = -Math.PI / 2;
    claw.scale.multiplyScalar(sideScale);
  }
}
addLeg(0.72, false);
addLeg(-0.72, true);

function addArm(z, farSide) {
  const shoulder = new THREE.Vector3(1.07, 3.12, z);
  const elbow = new THREE.Vector3(1.62, 2.72, z + (farSide ? -0.06 : 0.06));
  const hand = new THREE.Vector3(1.97, 2.82, z + (farSide ? -0.03 : 0.03));
  capsuleBetween(farSide ? 'far upper arm' : 'near upper arm', shoulder, elbow, 0.18);
  capsuleBetween(farSide ? 'far forearm' : 'near forearm', elbow, hand, 0.14);

  for (let i = 0; i < 2; i++) {
    const finger = capsuleBetween(
      'stubby finger',
      new THREE.Vector3(1.91, 2.82, hand.z + (i ? -0.07 : 0.07)),
      new THREE.Vector3(2.20, 2.72 + i * 0.05, hand.z + (i ? -0.10 : 0.10)),
      0.055,
      toothMaterial,
      14
    );
    finger.scale.set(1, 1, 1);
  }
}
addArm(0.75, false);
addArm(-0.75, true);

capsuleBetween(
  'tail base',
  new THREE.Vector3(-1.15, 2.45, 0),
  new THREE.Vector3(-2.65, 2.04, -0.03),
  0.78
);
capsuleBetween(
  'tail middle',
  new THREE.Vector3(-2.48, 2.05, -0.03),
  new THREE.Vector3(-3.75, 1.44, -0.08),
  0.49
);
capsuleBetween(
  'tail tip',
  new THREE.Vector3(-3.58, 1.52, -0.08),
  new THREE.Vector3(-4.55, 1.20, -0.11),
  0.25
);
ellipsoid('rounded tail tip', new THREE.Vector3(-4.61, 1.18, -0.11), new THREE.Vector3(0.30, 0.23, 0.23));

torus(
  'torso welded seam',
  new THREE.Vector3(-0.15, 2.27, 0),
  1,
  0.035,
  new THREE.Vector3(1.20, 1.47, 1),
  new THREE.Vector3(0, Math.PI / 2, 0)
);

torus(
  'neck welded seam',
  new THREE.Vector3(1.26, 3.50, 0),
  0.64,
  0.031,
  new THREE.Vector3(1, 1, 1.13),
  new THREE.Vector3(Math.PI / 2, 0, -0.65)
);

torus(
  'head welded seam',
  new THREE.Vector3(1.84, 4.17, 0),
  1,
  0.032,
  new THREE.Vector3(1.17, 0.89, 1),
  new THREE.Vector3(0, Math.PI / 2, 0)
);

torus(
  'muzzle welded seam',
  new THREE.Vector3(2.65, 3.93, 0),
  0.72,
  0.028,
  new THREE.Vector3(1.30, 0.75, 1),
  new THREE.Vector3(0, Math.PI / 2, 0)
);

torus(
  'near ankle seam',
  new THREE.Vector3(-0.02, 0.63, 0.76),
  0.49,
  0.027,
  new THREE.Vector3(1.05, 1, 1),
  new THREE.Vector3(Math.PI / 2, 0, 0)
);

torus(
  'tail seam one',
  new THREE.Vector3(-1.71, 2.30, -0.02),
  0.63,
  0.026,
  new THREE.Vector3(1, 1.02, 1),
  new THREE.Vector3(0.08, Math.PI / 2, 1.82)
);

torus(
  'tail seam two',
  new THREE.Vector3(-2.96, 1.82, -0.06),
  0.39,
  0.022,
  new THREE.Vector3(1, 1.04, 1),
  new THREE.Vector3(0.08, Math.PI / 2, 1.96)
);

const plugStem = mesh(new THREE.CylinderGeometry(0.11, 0.13, 0.21, 24), seamMaterial);
plugStem.name = 'air plug nub';
plugStem.position.set(-0.38, 2.56, -1.19);
plugStem.rotation.x = Math.PI / 2;

const plugCap = mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.06, 28), vinyl);
plugCap.position.set(-0.38, 2.56, -1.32);
plugCap.rotation.x = Math.PI / 2;

const plugRing = mesh(new THREE.TorusGeometry(0.12, 0.018, 8, 28), seamMaterial);
plugRing.position.set(-0.38, 2.56, -1.355);

const highlight = tube(
  'vinyl highlight',
  [
    new THREE.Vector3(-0.75, 3.33, 0.98),
    new THREE.Vector3(-0.15, 3.58, 0.94),
    new THREE.Vector3(0.48, 3.45, 0.88)
  ],
  0.035,
  new THREE.MeshBasicMaterial({
    color: 0xeaffad,
    transparent: true,
    opacity: 0.58,
    depthWrite: false
  })
);
highlight.castShadow = false;

rex.traverse((object) => {
  if (object.isMesh) {
    object.castShadow = true;
    object.receiveShadow = true;
  }
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  rex.position.y = 0.02 + Math.sin(t * 1.45) * 0.025;
  rex.rotation.z = Math.sin(t * 1.1) * 0.008;
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
